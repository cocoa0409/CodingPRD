# =============================================================================
# PRD Benchmark Scaffold — Retail Site Selection & Trade Area Analysis
# Retail chain real estate committee pipeline: market screening, trade-area
# drive-time & cannibalization modeling, competitor/co-tenancy mapping,
# site-visit scoring, committee quorum approval, LOI/lease negotiation,
# permitting & build-out, post-opening performance vs forecast.
# =============================================================================

scenario: |
  Retail Site Selection & Trade Area Analysis (retail chain real estate
  committee): market screening & demographic/psychographic filters, trade area
  drive-time & cannibalization modeling, competitor mapping & co-tenancy
  attractiveness, site visit scoring & real estate committee approval, sales
  forecast model & pro forma occupancy cost ratio, LOI & lease negotiation
  parameters, permitting/build-out timeline to open, post-opening performance
  vs forecast

domain_name: retail-site-selection
api_prefix: /api

# =============================================================================
# §0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: workflow_orchestration      # site pipeline: screening -> modeling -> scoring -> committee -> LOI -> lease -> build-out -> open -> measurement
  secondary_archetype: multi_party_negotiation   # committee quorum voting with sponsor segregation + LOI counter rounds
  complexity_layers:
    - optimistic_concurrency                     # OCC on Site.version (model lock) and CommitteeReview.version (vote cast)
    - cascading_side_effects                     # model-lock supersession chain; ratify -> capex commit; miss -> UNDERPERFORMING -> market posture
    - dual_variant_calculation                   # GRAVITY vs ANALOG forecast; FLAT_BAND vs DISTANCE_DECAY cannibalization
    - temporal_windowing                         # LOI exclusivity half-open windows; crew build windows with buffer days
  entity_topology: flat                          # peer resources joined by FK references; no nested URL ownership
  state_machine_shape: cyclic                    # LOI SENT->COUNTERED->SENT rounds; Site REJECTED->DRAFT revision loop; Market QUALIFIED<->SATURATED
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: segregation_of_duties              # deal sponsor may not vote on or ratify their own deal; chair-only ratify
  consistency_model: immediate
  entity_count: 15
  state_machine_count: 13
  calculation_count: 10
  validation_layers: 10
  endpoint_count: 69
  error_code_count: 36
  role_count: 7

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Market
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Market (metro/DSA) display name" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state code", constraints: "uppercase A-Z, length 2" }
      - { name: population, type: integer, source: input, description: "Metro population", constraints: ">= 1" }
      - { name: median_household_income_cents, type: integer, source: input, description: "Median household income, whole cents per year", constraints: ">= 0" }
      - { name: population_growth_bp, type: integer, source: input, description: "Annual population growth in basis points; may be negative" }
      - { name: psychographic_index, type: integer, source: input, description: "Lifestyle/psychographic fit index", constraints: "0..200" }
      - { name: base_target_stores, type: integer, source: input, description: "Planned store count before tier bonus", constraints: ">= 1" }
      - { name: annual_capex_budget_cents, type: integer, source: input, description: "Annual capital budget for new stores, whole cents", constraints: ">= 1" }
      - { name: max_rent_psf_cents, type: integer, source: input, description: "Maximum acceptable asking rent, cents per sqft per year", constraints: ">= 1" }
      - { name: prototype_sales_cents, type: integer, source: input, description: "Prototype store annual sales used as ANALOG fallback when no analog stores exist, whole cents", constraints: ">= 1" }
      - { name: market_status, type: enum, source: system, description: "SCREENING | QUALIFIED | DISQUALIFIED | SATURATED | CLOSED", default: SCREENING }
      - { name: raw_score, type: number, source: computed, description: "Screening raw weighted score, 2dp; null until first evaluate" }
      - { name: screening_tier, type: enum, source: computed, description: "A | B | C; null until first evaluate" }
      - { name: target_store_count, type: integer, source: computed, description: "base_target_stores + tier bonus (A:+4, B:+2, C:+0); null until first evaluate" }
      - { name: penetration_index, type: number, source: computed, description: "open_store_count / target_store_count at evaluation time, 6dp; null until first evaluate" }
      - { name: final_score, type: number, source: computed, description: "raw_score minus penetration penalty, 2dp; QUALIFIED iff >= 60.00" }
      - { name: open_store_count, type: integer, source: computed, description: "count(ExistingStore with store_status=OPERATING in this market) + count(Site in this market with site_status IN {OPEN, MEASURING, UNDERPERFORMING})", default: 0 }
      - { name: committed_capex_cents, type: integer, source: computed, description: "sum of build_cost_cents over Sites in this market with site_status IN {APPROVED, LOI_ACTIVE, LEASE_EXECUTED, BUILD_OUT, OPEN, MEASURING, UNDERPERFORMING}", default: 0 }

  - name: ExistingStore
    parent: null
    common_fields: true
    fields:
      - { name: market_id, type: string, source: input, description: "FK -> Market.id; owning market" }
      - { name: store_code, type: string, source: input, description: "Chain-wide store code; unique within the market (case-sensitive)" }
      - { name: format_type, type: enum, source: input, description: "EXPRESS | STANDARD | FLAGSHIP" }
      - { name: annual_sales_cents, type: integer, source: input, description: "Trailing annual sales, whole cents", constraints: ">= 0" }
      - { name: store_status, type: enum, source: system, description: "OPERATING | CLOSED", default: OPERATING }

  - name: Site
    parent: null
    common_fields: true
    fields:
      - { name: market_id, type: string, source: input, description: "FK -> Market.id; candidate market" }
      - { name: address, type: string, source: input, description: "Street address of the candidate parcel" }
      - { name: format_type, type: enum, source: input, description: "EXPRESS | STANDARD | FLAGSHIP" }
      - { name: square_footage, type: integer, source: input, description: "Gross leasable sqft", constraints: ">= 1" }
      - { name: asking_rent_psf_cents, type: integer, source: input, description: "Asking base rent, cents per sqft per year", constraints: ">= 0" }
      - { name: cam_psf_cents, type: integer, source: input, description: "CAM charges, cents per sqft per year", constraints: ">= 0" }
      - { name: tax_psf_cents, type: integer, source: input, description: "Property tax pass-through, cents per sqft per year", constraints: ">= 0" }
      - { name: build_cost_cents, type: integer, source: input, description: "Estimated build-out capital cost, whole cents", constraints: ">= 0" }
      - { name: site_status, type: enum, source: system, description: "DRAFT | SCREENED | MODELED | SCORED | FORECAST_LOCKED | IN_COMMITTEE | APPROVED | REJECTED | LOI_ACTIVE | LEASE_EXECUTED | BUILD_OUT | OPEN | MEASURING | UNDERPERFORMING | WITHDRAWN | CLOSED_OUT", default: DRAFT }
      - { name: consecutive_miss_count, type: integer, source: computed, description: "Count of consecutive FINALIZED PerformanceSnapshots with variance_bp <= -2000; reset to 0 on any FINALIZED snapshot with variance_bp > -2000", default: 0 }

  - name: TradeAreaModel
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id; modeled candidate site" }
      - { name: drive_time_minutes, type: integer, source: input, description: "Trade-area drive-time contour D", constraints: "1..30" }
      - { name: trade_area_population, type: integer, source: input, description: "Population inside the drive-time contour", constraints: ">= 0" }
      - { name: per_capita_spend_cents, type: integer, source: input, description: "Annual category spend per capita inside the contour, whole cents", constraints: ">= 0" }
      - { name: cannibalization_variant, type: enum, source: input, description: "FLAT_BAND | DISTANCE_DECAY; pinned at creation, immutable" }
      - { name: store_drive_times, type: array, source: input, description: "Array of {store_id, drive_minutes} pairs: modeled drive time from each ExistingStore to the candidate site; drive_minutes integer >= 0", default: [] }
      - { name: model_status, type: enum, source: system, description: "DRAFT | LOCKED | SUPERSEDED", default: DRAFT }
      - { name: cannibalized_sales_cents, type: integer, source: computed, description: "Cannibalization snapshot computed at lock time; null while DRAFT" }

  - name: CompetitorListing
    parent: null
    common_fields: true
    fields:
      - { name: trade_area_model_id, type: string, source: input, description: "FK -> TradeAreaModel.id; owning model" }
      - { name: listing_type, type: enum, source: input, description: "COMPETITOR | COTENANT" }
      - { name: brand_name, type: string, source: input, description: "Competitor or co-tenant brand name" }
      - { name: estimated_sqft, type: integer, source: input, description: "Estimated store sqft", constraints: ">= 1" }
      - { name: distance_minutes, type: integer, source: input, description: "Drive minutes from candidate site; 0 allowed (co-located)", constraints: ">= 0" }

  - name: SiteVisit
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id; visited site" }
      - { name: visited_on, type: string, source: input, description: "Visit date, ISO 8601 date (YYYY-MM-DD)" }
      - { name: visibility_score, type: integer, source: input, description: "Visibility component", constraints: "0..100" }
      - { name: access_score, type: integer, source: input, description: "Access/ingress-egress component", constraints: "0..100" }
      - { name: parking_score, type: integer, source: input, description: "Parking component", constraints: "0..100" }
      - { name: cotenancy_score, type: integer, source: input, description: "Co-tenancy attractiveness component", constraints: "0..100" }
      - { name: total_score, type: number, source: computed, description: "Weighted total, round_half_up 2dp: 0.30*visibility + 0.25*access + 0.15*parking + 0.30*cotenancy" }
      - { name: visit_status, type: enum, source: system, description: "SUBMITTED | SUPERSEDED", default: SUBMITTED }

  - name: SalesForecast
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id; forecast site" }
      - { name: trade_area_model_id, type: string, source: input, description: "FK -> TradeAreaModel.id; must reference the site's currently LOCKED model" }
      - { name: model_variant, type: enum, source: input, description: "GRAVITY | ANALOG; pinned at creation, immutable" }
      - { name: forecast_status, type: enum, source: system, description: "DRAFT | COMMITTEE_LOCKED | ACTUALIZED | SUPERSEDED", default: DRAFT }
      - { name: gross_annual_sales_cents, type: integer, source: computed, description: "Gross forecast computed at creation from the variant formula" }
      - { name: cannibalized_sales_cents, type: integer, source: computed, description: "Cannibalization computed at lock time from the pinned model's variant and live store statuses; null while DRAFT" }
      - { name: net_annual_sales_cents, type: integer, source: computed, description: "gross_annual_sales_cents - cannibalized_sales_cents, computed at lock; null while DRAFT" }
      - { name: occupancy_ratio_bp, type: integer, source: computed, description: "PROVISIONAL occupancy cost ratio in basis points using asking rent; computed at lock; null while DRAFT" }
      - { name: occupancy_band, type: enum, source: computed, description: "GREEN (<=1500bp) | YELLOW (1501..2200bp) | RED (>=2201bp); null while DRAFT" }

  - name: CommitteeMember
    parent: null
    common_fields: true
    fields:
      - { name: display_name, type: string, source: input, description: "Member display name" }
      - { name: is_chair, type: boolean, source: input, description: "Whether the member holds the committee chair", default: false }
      - { name: member_status, type: enum, source: system, description: "ACTIVE | INACTIVE", default: ACTIVE }

  - name: CommitteeReview
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: system, description: "FK -> Site.id; deal under review (taken from the submit-committee path site)" }
      - { name: sales_forecast_id, type: string, source: input, description: "FK -> SalesForecast.id; the COMMITTEE_LOCKED forecast pinned to this review" }
      - { name: sponsor_member_id, type: string, source: input, description: "FK -> CommitteeMember.id; deal sponsor; barred from voting on or ratifying this review" }
      - { name: chair_override, type: boolean, source: input, description: "Required true at submission when the forecast's occupancy_band is YELLOW", default: false }
      - { name: expires_at, type: string, source: input, description: "Review deadline, ISO 8601 datetime; must be strictly after the logical clock at creation" }
      - { name: review_status, type: enum, source: system, description: "OPEN | DECIDED | RATIFIED | EXPIRED | VOID", default: OPEN }
      - { name: decided_outcome, type: enum, source: system, description: "APPROVE | REJECT; null until DECIDED" }
      - { name: eligible_member_count, type: integer, source: computed, description: "count(CommitteeMember with member_status=ACTIVE and id != sponsor_member_id) at creation" }
      - { name: quorum_count, type: integer, source: computed, description: "ceil(eligible_member_count * 2/3)" }
      - { name: approve_votes, type: integer, source: computed, description: "Tally of APPROVE ballots", default: 0 }
      - { name: reject_votes, type: integer, source: computed, description: "Tally of REJECT ballots", default: 0 }
      - { name: abstain_votes, type: integer, source: computed, description: "Tally of ABSTAIN ballots", default: 0 }

  - name: Vote
    parent: null
    common_fields: false
    fields:
      - { name: review_id, type: string, source: system, description: "FK -> CommitteeReview.id; review voted on (taken from the votes path)" }
      - { name: member_id, type: string, source: system, description: "FK -> CommitteeMember.id; taken from X-User-ID of the casting member" }
      - { name: ballot, type: enum, source: input, description: "APPROVE | REJECT | ABSTAIN" }

  - name: LOI
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id; negotiated site" }
      - { name: rent_psf_cents, type: integer, source: input, description: "Broker's current year-1 base rent offer, cents per sqft per year", constraints: ">= 0" }
      - { name: escalation_pct_bp, type: integer, source: input, description: "Annual rent escalation, basis points (e.g. 200 = 2%)", constraints: "0..2000" }
      - { name: term_years, type: integer, source: input, description: "Lease term in whole years", constraints: "1..20" }
      - { name: ti_allowance_cents, type: integer, source: input, description: "Landlord tenant-improvement allowance, whole cents", default: 0, constraints: ">= 0" }
      - { name: free_rent_months, type: integer, source: input, description: "Free-rent months at term start", default: 0, constraints: "0..term_years*12" }
      - { name: exclusivity_start_date, type: string, source: input, description: "Exclusivity window start, ISO date; window is half-open [start, end)" }
      - { name: exclusivity_end_date, type: string, source: input, description: "Exclusivity window end, ISO date; must be strictly after start" }
      - { name: countered_rent_psf_cents, type: integer, source: system, description: "Landlord's countered year-1 rent; set by counter action; null otherwise" }
      - { name: agreed_rent_psf_cents, type: integer, source: system, description: "Agreed year-1 rent fixed at accept: countered_rent_psf_cents when accepted from COUNTERED, else rent_psf_cents; null until ACCEPTED" }
      - { name: round_number, type: integer, source: system, description: "Negotiation round; starts at 1, increments on each resend", default: 1 }
      - { name: effective_annual_rent_cents, type: integer, source: computed, description: "Effective rent per loi_effective_rent calc over current broker terms; recomputed at send and resend" }
      - { name: loi_status, type: enum, source: system, description: "DRAFT | SENT | COUNTERED | ACCEPTED | EXPIRED | WITHDRAWN", default: DRAFT }

  - name: Lease
    parent: null
    common_fields: true
    fields:
      - { name: loi_id, type: string, source: input, description: "FK -> LOI.id; source LOI, must be ACCEPTED" }
      - { name: final_rent_psf_cents, type: integer, source: input, description: "Final year-1 base rent, cents per sqft per year", constraints: ">= 0" }
      - { name: escalation_pct_bp, type: integer, source: input, description: "Annual escalation, basis points", constraints: "0..2000" }
      - { name: term_years, type: integer, source: input, description: "Lease term, whole years", constraints: "1..20" }
      - { name: ti_allowance_cents, type: integer, source: input, description: "TI allowance, whole cents", default: 0, constraints: ">= 0" }
      - { name: free_rent_months, type: integer, source: input, description: "Free-rent months", default: 0, constraints: "0..term_years*12" }
      - { name: crew_id, type: string, source: input, description: "FK -> ConstructionCrew.id; build-out crew, must be ACTIVE" }
      - { name: build_start_date, type: string, source: input, description: "Build window start, ISO date; closed interval" }
      - { name: build_end_date, type: string, source: input, description: "Build window end, ISO date; must be strictly after start" }
      - { name: effective_annual_rent_cents, type: integer, source: computed, description: "Effective rent per loi_effective_rent calc over lease terms; computed at execute; null while NEGOTIATING" }
      - { name: final_occupancy_ratio_bp, type: integer, source: computed, description: "FINAL occupancy ratio variant: executed rent over the pinned forecast's net_annual_sales_cents; computed at execute; null while NEGOTIATING" }
      - { name: lease_status, type: enum, source: system, description: "NEGOTIATING | EXECUTED | TERMINATED", default: NEGOTIATING }

  - name: ConstructionCrew
    parent: null
    common_fields: true
    fields:
      - { name: crew_code, type: string, source: input, description: "Crew code; unique chain-wide (case-sensitive)" }
      - { name: crew_status, type: enum, source: system, description: "ACTIVE | RETIRED", default: ACTIVE }

  - name: PermitMilestone
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id; build-out site" }
      - { name: milestone_type, type: enum, source: input, description: "PERMIT_SUBMITTED | PERMIT_APPROVED | BUILD_START | BUILD_COMPLETE; at most one milestone per (site_id, milestone_type)" }
      - { name: planned_date, type: string, source: input, description: "Planned completion date, ISO date" }
      - { name: actual_date, type: string, source: system, description: "Actual completion date recorded at complete; null while PENDING" }
      - { name: milestone_status, type: enum, source: system, description: "PENDING | COMPLETED", default: PENDING }

  - name: PerformanceSnapshot
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id; measured site" }
      - { name: period_index, type: integer, source: input, description: "Monthly period number, >= 1; must equal count of the site's FINALIZED snapshots + 1", constraints: ">= 1" }
      - { name: actual_sales_cents, type: integer, source: input, description: "Actual net sales for the period, whole cents", constraints: ">= 0" }
      - { name: expected_sales_cents, type: integer, source: computed, description: "round_half_up(ACTUALIZED forecast net_annual_sales_cents / 12); computed at finalize; null while RECORDED" }
      - { name: variance_bp, type: integer, source: computed, description: "round_half_up((actual_sales_cents - expected_sales_cents) * 10000 / expected_sales_cents); computed at finalize; null while RECORDED" }
      - { name: snapshot_status, type: enum, source: system, description: "RECORDED | FINALIZED", default: RECORDED }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Market
    field: market_status
    initial_state: SCREENING
    terminal_states: [CLOSED]
    transitions:
      - from: SCREENING
        to: QUALIFIED
        trigger: "POST /api/markets/{id}/evaluate and final_score >= 60.00"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "Sets raw_score, screening_tier, target_store_count, penetration_index, final_score per market_screening_evaluation"
      - from: SCREENING
        to: DISQUALIFIED
        trigger: "POST /api/markets/{id}/evaluate and final_score < 60.00"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "Sets score fields per market_screening_evaluation"
      - from: DISQUALIFIED
        to: QUALIFIED
        trigger: "POST /api/markets/{id}/evaluate (re-evaluation) and final_score >= 60.00"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "Recomputes all score fields from current inputs and current open_store_count"
      - from: DISQUALIFIED
        to: DISQUALIFIED
        trigger: "POST /api/markets/{id}/evaluate (re-evaluation) and final_score < 60.00"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "Recomputes all score fields (self-loop: stays DISQUALIFIED)"
      - from: QUALIFIED
        to: SATURATED
        trigger: "system (open_store_count rises to >= target_store_count)"
        actor: system
        preconditions:
          - "open_store_count >= target_store_count after the triggering store open / site open"
        side_effects:
          - "Market stops accepting site screening (ERR_MARKET_NOT_QUALIFIED on run-screening)"
      - from: SATURATED
        to: QUALIFIED
        trigger: "system (open_store_count drops below target_store_count)"
        actor: system
        preconditions:
          - "open_store_count < target_store_count after the triggering store close / site close-out"
        side_effects: []
      - from: QUALIFIED
        to: CLOSED
        trigger: "POST /api/markets/{id}/close"
        actor: PlatformAdmin
        preconditions:
          - "No Site in this market with site_status IN {DRAFT, SCREENED, MODELED, SCORED, FORECAST_LOCKED, IN_COMMITTEE, APPROVED, LOI_ACTIVE, LEASE_EXECUTED, BUILD_OUT}"
        side_effects: []

  - entity: ExistingStore
    field: store_status
    initial_state: OPERATING
    terminal_states: [CLOSED]
    transitions:
      - from: OPERATING
        to: CLOSED
        trigger: "POST /api/stores/{id}/close"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "Market.open_store_count decremented (ledger sync)"
          - "If Market SATURATED and open_store_count < target_store_count: Market -> QUALIFIED (bubble up)"

  - entity: Site
    field: site_status
    initial_state: DRAFT
    terminal_states: [WITHDRAWN, CLOSED_OUT]
    transitions:
      - from: DRAFT
        to: SCREENED
        trigger: "POST /api/sites/{id}/run-screening"
        actor: RealEstateAnalyst
        preconditions:
          - "Market.market_status == QUALIFIED (else ERR_MARKET_NOT_QUALIFIED)"
          - "square_footage within format band (EXPRESS 2000..4000, STANDARD 8000..15000, FLAGSHIP 20000..45000; else ERR_FORMAT_SQFT_MISMATCH)"
          - "asking_rent_psf_cents <= Market.max_rent_psf_cents (else ERR_ASKING_RENT_ABOVE_MARKET_CAP)"
        side_effects: []
      - from: SCREENED
        to: MODELED
        trigger: "system (a TradeAreaModel for this site transitions DRAFT -> LOCKED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: MODELED
        to: SCORED
        trigger: "system (a SiteVisit is created with total_score >= 70.00)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SCORED
        to: MODELED
        trigger: "system (a replacement SiteVisit is created with total_score < 70.00)"
        actor: system
        preconditions: []
        side_effects:
          - "Conditional regression: visit accepted and recorded, but site loses SCORED standing"
      - from: SCORED
        to: FORECAST_LOCKED
        trigger: "system (a SalesForecast for this site transitions DRAFT -> COMMITTEE_LOCKED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FORECAST_LOCKED
        to: MODELED
        trigger: "system (the COMMITTEE_LOCKED forecast is SUPERSEDED via a newer TradeAreaModel lock)"
        actor: system
        preconditions: []
        side_effects:
          - "Site regresses; requires a new forecast lock before resubmission"
      - from: IN_COMMITTEE
        to: MODELED
        trigger: "system (the pinned forecast is SUPERSEDED via a newer TradeAreaModel lock; the open review is EXPIRED in the same cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "Site regresses two pipeline stages; committee work product voided"
      - from: FORECAST_LOCKED
        to: IN_COMMITTEE
        trigger: "POST /api/sites/{id}/submit-committee"
        actor: RealEstateManager
        preconditions:
          - "sales_forecast_id references a COMMITTEE_LOCKED forecast of this site (else ERR_FORECAST_NOT_LOCKED)"
          - "eligible_member_count >= 1 (else ERR_NO_ELIGIBLE_VOTERS)"
          - "occupancy_band != RED (else ERR_OCCUPANCY_RATIO_RED)"
          - "occupancy_band == YELLOW requires chair_override=true (else ERR_CHAIR_OVERRIDE_REQUIRED)"
          - "Market.committed_capex_cents + build_cost_cents <= Market.annual_capex_budget_cents * 9000/10000 (else ERR_BUDGET_CAP_EXCEEDED)"
        side_effects:
          - "Creates CommitteeReview in OPEN with pinned sales_forecast_id, computed eligible_member_count and quorum_count"
      - from: IN_COMMITTEE
        to: APPROVED
        trigger: "system (CommitteeReview RATIFIED with decided_outcome=APPROVE)"
        actor: system
        preconditions: []
        side_effects:
          - "Market.committed_capex_cents += build_cost_cents (ledger sync)"
      - from: IN_COMMITTEE
        to: REJECTED
        trigger: "system (CommitteeReview RATIFIED with decided_outcome=REJECT, or review EXPIRED by clock sweep)"
        actor: system
        preconditions: []
        side_effects: []
      - from: REJECTED
        to: DRAFT
        trigger: "POST /api/sites/{id}/revise"
        actor: RealEstateManager
        preconditions: []
        side_effects:
          - "Cascade down: every LOCKED TradeAreaModel -> SUPERSEDED; every SUBMITTED SiteVisit -> SUPERSEDED; every DRAFT or COMMITTEE_LOCKED SalesForecast -> SUPERSEDED"
      - from: APPROVED
        to: LOI_ACTIVE
        trigger: "system (first LOI for this site transitions DRAFT -> SENT)"
        actor: system
        preconditions: []
        side_effects: []
      - from: LOI_ACTIVE
        to: LEASE_EXECUTED
        trigger: "system (a Lease for this site's ACCEPTED LOI transitions NEGOTIATING -> EXECUTED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: LEASE_EXECUTED
        to: BUILD_OUT
        trigger: "system (BUILD_START PermitMilestone completed)"
        actor: system
        preconditions: []
        side_effects: []
      - from: BUILD_OUT
        to: OPEN
        trigger: "POST /api/sites/{id}/open"
        actor: RealEstateManager
        preconditions:
          - "The site's BUILD_COMPLETE PermitMilestone is COMPLETED (else ERR_BUILD_NOT_COMPLETE)"
        side_effects:
          - "Market.open_store_count incremented (ledger sync)"
          - "If Market QUALIFIED and open_store_count >= target_store_count: Market -> SATURATED (bubble up)"
      - from: OPEN
        to: MEASURING
        trigger: "system (first PerformanceSnapshot FINALIZED)"
        actor: system
        preconditions: []
        side_effects:
          - "The site's COMMITTEE_LOCKED SalesForecast -> ACTUALIZED"
      - from: MEASURING
        to: UNDERPERFORMING
        trigger: "system (finalize makes consecutive_miss_count reach 2)"
        actor: system
        preconditions: []
        side_effects:
          - "Site remains counted in Market.open_store_count while UNDERPERFORMING"
      - from: UNDERPERFORMING
        to: MEASURING
        trigger: "system (a FINALIZED snapshot with variance_bp > -2000 resets consecutive_miss_count to 0)"
        actor: system
        preconditions: []
        side_effects: []
      - from: [MEASURING, UNDERPERFORMING]
        to: CLOSED_OUT
        trigger: "POST /api/sites/{id}/close-out"
        actor: RealEstateManager
        preconditions: []
        side_effects:
          - "Market.open_store_count decremented (ledger sync)"
          - "Market.committed_capex_cents -= build_cost_cents (capital release)"
          - "If Market SATURATED and open_store_count < target_store_count: Market -> QUALIFIED (bubble up)"
      - from: [DRAFT, SCREENED, MODELED, SCORED, FORECAST_LOCKED, IN_COMMITTEE, APPROVED, REJECTED, LOI_ACTIVE, LEASE_EXECUTED, BUILD_OUT]
        to: WITHDRAWN
        trigger: "POST /api/sites/{id}/withdraw"
        actor: RealEstateManager
        preconditions: []
        side_effects:
          - "Compensation: if previous status IN {APPROVED, LOI_ACTIVE, LEASE_EXECUTED, BUILD_OUT}: Market.committed_capex_cents -= build_cost_cents (exact release of the approval-time commitment)"
          - "Cascade down: any LOI for this site in {DRAFT, SENT, COUNTERED} -> WITHDRAWN; any CommitteeReview in {OPEN, DECIDED} -> VOID"

  - entity: TradeAreaModel
    field: model_status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: LOCKED
        trigger: "POST /api/trade-area-models/{id}/lock"
        actor: RealEstateAnalyst
        preconditions:
          - "Site.site_status IN {SCREENED, MODELED, SCORED, FORECAST_LOCKED, IN_COMMITTEE} (else ERR_INVALID_STATE)"
          - "expected_site_version == Site.version (else ERR_STALE_VERSION, 412)"
        side_effects:
          - "Computes and stores cannibalized_sales_cents from live ExistingStore statuses (stores with store_status != OPERATING are excluded at this instant; later store closes do not change this snapshot)"
          - "Increments Site.version by 1"
          - "Supersession: any other LOCKED TradeAreaModel for the same site -> SUPERSEDED"
          - "Cascade link 1->2: every SalesForecast with trade_area_model_id equal to the superseded model and forecast_status IN {DRAFT, COMMITTEE_LOCKED} -> SUPERSEDED"
          - "Cascade link 2->3: any CommitteeReview with sales_forecast_id equal to a just-SUPERSEDED forecast and review_status IN {OPEN, DECIDED} -> EXPIRED"
          - "Cascade link 3->4: Site IN_COMMITTEE whose review just EXPIRED -> MODELED; Site FORECAST_LOCKED whose locked forecast just SUPERSEDED -> MODELED"
          - "If site was SCREENED: Site -> MODELED (bubble up)"
      - from: LOCKED
        to: SUPERSEDED
        trigger: "system (a different TradeAreaModel for the same site is LOCKED, or site revise cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system (site revise cascade only)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: SiteVisit
    field: visit_status
    initial_state: SUBMITTED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "system (a newer SiteVisit is created for the same site, or site revise cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: SalesForecast
    field: forecast_status
    initial_state: DRAFT
    terminal_states: [ACTUALIZED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: COMMITTEE_LOCKED
        trigger: "POST /api/sales-forecasts/{id}/lock"
        actor: RealEstateAnalyst
        preconditions:
          - "Site.site_status == SCORED (else ERR_INVALID_STATE)"
          - "trade_area_model_id references a LOCKED TradeAreaModel of this site (else ERR_TRADE_AREA_NOT_LOCKED)"
          - "cannibalized_sales_cents <= gross_annual_sales_cents * 2500/10000 (else ERR_CANNIBALIZATION_EXCEEDS_CAP)"
        side_effects:
          - "Computes cannibalized_sales_cents from the pinned model's variant and store_drive_times over live OPERATING stores"
          - "net_annual_sales_cents = gross_annual_sales_cents - cannibalized_sales_cents"
          - "Computes occupancy_ratio_bp (PROVISIONAL: asking rent + cam + tax) and occupancy_band"
          - "Every other SalesForecast for this site with forecast_status IN {DRAFT, COMMITTEE_LOCKED} -> SUPERSEDED"
          - "Site SCORED -> FORECAST_LOCKED (bubble up)"
      - from: COMMITTEE_LOCKED
        to: ACTUALIZED
        trigger: "system (site's first PerformanceSnapshot is FINALIZED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: [DRAFT, COMMITTEE_LOCKED]
        to: SUPERSEDED
        trigger: "system (pinned TradeAreaModel superseded, another forecast of the same site locks, or site revise cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: CommitteeReview
    field: review_status
    initial_state: OPEN
    terminal_states: [RATIFIED, EXPIRED, VOID]
    transitions:
      - from: OPEN
        to: DECIDED
        trigger: "system (the vote that makes ballots_cast == eligible_member_count is recorded)"
        actor: system
        preconditions:
          - "approve_votes + reject_votes + abstain_votes == eligible_member_count after the cast"
        side_effects:
          - "decided_outcome = APPROVE iff approve_votes*100 > 60*(approve_votes+reject_votes) AND (approve_votes+reject_votes) >= quorum_count; otherwise REJECT (abstains excluded from the percentage denominator; A+R==0 => REJECT)"
      - from: DECIDED
        to: RATIFIED
        trigger: "POST /api/committee-reviews/{id}/ratify"
        actor: CommitteeChair
        preconditions:
          - "X-User-ID references a CommitteeMember with is_chair=true and member_status=ACTIVE (else ERR_NOT_CHAIR)"
          - "chair member id != sponsor_member_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "decided_outcome=APPROVE: Site IN_COMMITTEE -> APPROVED and Market.committed_capex_cents += site.build_cost_cents (ledger sync)"
          - "decided_outcome=REJECT: Site IN_COMMITTEE -> REJECTED"
      - from: OPEN
        to: EXPIRED
        trigger: "system (POST /api/_clock/set_current_utc advances the logical clock strictly past expires_at)"
        actor: system
        preconditions: []
        side_effects:
          - "Site IN_COMMITTEE -> REJECTED"
      - from: [OPEN, DECIDED]
        to: EXPIRED
        trigger: "system (cascade link 2->3 of a TradeAreaModel lock that supersedes the pinned forecast)"
        actor: system
        preconditions: []
        side_effects:
          - "DECIDED reviews expired this way also revert the Site to MODELED via cascade link 3->4"
      - from: [OPEN, DECIDED]
        to: VOID
        trigger: "system (site withdraw cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: LOI
    field: loi_status
    initial_state: DRAFT
    terminal_states: [ACCEPTED, EXPIRED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SENT
        trigger: "POST /api/lois/{id}/send"
        actor: RealEstateManager
        preconditions:
          - "Site.site_status IN {APPROVED, LOI_ACTIVE} (else ERR_INVALID_STATE)"
          - "No other LOI for this site with loi_status IN {SENT, COUNTERED, ACCEPTED} whose half-open exclusivity window overlaps this one (else ERR_LOI_EXCLUSIVITY_OVERLAP)"
          - "exclusivity_end_date strictly after the logical clock date (else ERR_WINDOW_IN_PAST)"
        side_effects:
          - "Computes effective_annual_rent_cents per loi_effective_rent"
          - "If this is the site's first SENT LOI: Site APPROVED -> LOI_ACTIVE (bubble up)"
      - from: SENT
        to: COUNTERED
        trigger: "POST /api/lois/{id}/counter"
        actor: RealEstateManager
        preconditions:
          - "Logical clock date <= exclusivity_end_date (else ERR_WINDOW_IN_PAST)"
        side_effects:
          - "Stores countered_rent_psf_cents from input"
      - from: COUNTERED
        to: SENT
        trigger: "POST /api/lois/{id}/resend"
        actor: RealEstateManager
        preconditions:
          - "Logical clock date <= exclusivity_end_date (else ERR_WINDOW_IN_PAST)"
        side_effects:
          - "round_number += 1; rent_psf_cents replaced by the resend input; countered_rent_psf_cents cleared to null"
          - "Recomputes effective_annual_rent_cents per loi_effective_rent"
      - from: SENT
        to: ACCEPTED
        trigger: "POST /api/lois/{id}/accept"
        actor: RealEstateManager
        preconditions:
          - "Logical clock date <= exclusivity_end_date (else ERR_WINDOW_IN_PAST)"
        side_effects:
          - "agreed_rent_psf_cents = rent_psf_cents"
      - from: COUNTERED
        to: ACCEPTED
        trigger: "POST /api/lois/{id}/accept"
        actor: RealEstateManager
        preconditions:
          - "Logical clock date <= exclusivity_end_date (else ERR_WINDOW_IN_PAST)"
        side_effects:
          - "agreed_rent_psf_cents = countered_rent_psf_cents (landlord's counter is what is accepted)"
      - from: [SENT, COUNTERED]
        to: EXPIRED
        trigger: "system (POST /api/_clock/set_current_utc advances the logical clock strictly past exclusivity_end_date)"
        actor: system
        preconditions: []
        side_effects: []
      - from: [DRAFT, SENT, COUNTERED]
        to: WITHDRAWN
        trigger: "POST /api/lois/{id}/withdraw or system (site withdraw cascade)"
        actor: RealEstateManager
        preconditions: []
        side_effects: []

  - entity: Lease
    field: lease_status
    initial_state: NEGOTIATING
    terminal_states: [TERMINATED]
    transitions:
      - from: NEGOTIATING
        to: EXECUTED
        trigger: "POST /api/leases/{id}/execute"
        actor: RealEstateManager
        preconditions:
          - "final_rent_psf_cents <= round_half_up(LOI.agreed_rent_psf_cents * 10500/10000) (else ERR_LEASE_TERMS_DRIFT)"
        side_effects:
          - "Computes effective_annual_rent_cents per loi_effective_rent over lease terms"
          - "Computes final_occupancy_ratio_bp (FINAL variant: executed rent + cam + tax from the site over the pinned forecast's net_annual_sales_cents)"
          - "Site LOI_ACTIVE -> LEASE_EXECUTED (bubble up)"
      - from: EXECUTED
        to: TERMINATED
        trigger: "POST /api/leases/{id}/terminate"
        actor: RealEstateManager
        preconditions: []
        side_effects:
          - "Site in {LEASE_EXECUTED, BUILD_OUT} -> WITHDRAWN with capital release (compensation cascade)"

  - entity: ConstructionCrew
    field: crew_status
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /api/construction-crews/{id}/retire"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "Existing NEGOTIATING/EXECUTED leases keep their reserved windows; new lease creation referencing this crew is rejected (ERR_CREW_NOT_AVAILABLE)"

  - entity: PermitMilestone
    field: milestone_status
    initial_state: PENDING
    terminal_states: [COMPLETED]
    transitions:
      - from: PENDING
        to: COMPLETED
        trigger: "POST /api/permit-milestones/{id}/complete"
        actor: ConstructionManager
        preconditions:
          - "Every lower-order milestone_type for the same site is COMPLETED; order: PERMIT_SUBMITTED < PERMIT_APPROVED < BUILD_START < BUILD_COMPLETE (else ERR_MILESTONE_OUT_OF_ORDER)"
        side_effects:
          - "Records actual_date from input"
          - "BUILD_START completion: Site LEASE_EXECUTED -> BUILD_OUT (bubble up)"

  - entity: PerformanceSnapshot
    field: snapshot_status
    initial_state: RECORDED
    terminal_states: [FINALIZED]
    transitions:
      - from: RECORDED
        to: FINALIZED
        trigger: "POST /api/performance-snapshots/{id}/finalize"
        actor: RealEstateManager
        preconditions: []
        side_effects:
          - "Computes expected_sales_cents and variance_bp per performance_variance"
          - "If this is the site's first FINALIZED snapshot: Site OPEN -> MEASURING and its COMMITTEE_LOCKED SalesForecast -> ACTUALIZED"
          - "If variance_bp <= -2000: Site.consecutive_miss_count += 1; else consecutive_miss_count = 0"
          - "Cascade link 2: if consecutive_miss_count reaches 2 and site MEASURING: Site -> UNDERPERFORMING"
          - "Cascade link 3 (recovery): if site UNDERPERFORMING and variance_bp > -2000: Site -> MEASURING"

  - entity: CommitteeMember
    field: member_status
    initial_state: ACTIVE
    terminal_states: [INACTIVE]
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /api/committee-members/{id}/deactivate"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "Member immediately ineligible to vote or ratify; already-cast votes remain counted"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only; state preconditions live in §1.2/§1.4)
# =============================================================================
concurrency_rules:
  - rule_id: model-lock-stale-site
    parent_entity: Site
    write_endpoint: "POST /api/trade-area-models/{id}/lock"
    occ_field: expected_site_version
    description: |
      Locking a TradeAreaModel against a Site whose version has advanced since
      the client last observed it is rejected. This captures the case where
      another writer has just locked a different model for the same site
      (which legitimately supersedes the previously LOCKED model under §1.2)
      and the current writer's view of the site's artifact set is therefore
      stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: vote-stale-review
    parent_entity: CommitteeReview
    write_endpoint: "POST /api/committee-reviews/{id}/votes"
    occ_field: expected_review_version
    description: |
      Casting a Vote against a CommitteeReview whose version has advanced
      since the member last observed the tally is rejected. This captures the
      case where another member's ballot has just been recorded (each
      recorded ballot legitimately advances the review's tally and version)
      and the current member's view of the tally is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: market_screening_evaluation
    trigger: "POST /api/markets/{id}/evaluate"
    algorithm: threshold
    formula: |
      // Circular-looking chain; evaluation order is pinned as written:
      // (1) raw_score -> (2) tier -> (3) target_store_count -> (4) penetration -> (5) final_score.
      // The tier depends on raw_score while final_score depends on target_store_count
      // which depends on the tier — the pinned order makes the value well-defined.
      pop_score    = min(population / 250000, 1.0) * 100
      income_score = min(median_household_income_cents / 7500000, 1.0) * 100   // $75,000 in cents
      growth_score = min(max(population_growth_bp, 0) / 500, 1.0) * 100
      psycho_score = min(psychographic_index / 120, 1.0) * 100
      (1) raw_score = round_half_up(0.30*pop_score + 0.30*income_score + 0.20*growth_score + 0.20*psycho_score, 2dp)
      (2) screening_tier: raw_score >= 75.00 -> A (bonus +4); raw_score >= 50.00 -> B (bonus +2); else C (bonus +0)
      (3) target_store_count = base_target_stores + tier_bonus
      (4) penetration_index = round_half_up(open_store_count / target_store_count, 6dp)  // 0 when open_store_count==0
          penetration_penalty = min(penetration_index, 1.0) * 20
      (5) final_score = round_half_up(raw_score - penetration_penalty, 2dp)
      market_status = QUALIFIED iff final_score >= 60.00 (inclusive), else DISQUALIFIED
    input_set: "The Market's own input fields and its current open_store_count"
    constants:
      W_POP: 0.30
      W_INCOME: 0.30
      W_GROWTH: 0.20
      W_PSYCHO: 0.20
      POP_NORM: 250000
      INCOME_NORM_CENTS: 7500000
      GROWTH_NORM_BP: 500
      PSYCHO_NORM: 120
      TIER_A_MIN: 75.00
      TIER_B_MIN: 50.00
      TIER_A_BONUS: 4
      TIER_B_BONUS: 2
      PENETRATION_PENALTY_MAX: 20
      QUALIFY_MIN: 60.00
    precision: "scores 2 decimal places round_half_up; penetration_index 6dp round_half_up"

  - name: cannibalization_impact
    trigger: "TradeAreaModel lock (snapshot stored on the model) and SalesForecast lock (authoritative value stored on the forecast)"
    algorithm: forward_looking
    formula: |
      Eligible stores: for each {store_id, drive_minutes} in the pinned model's
      store_drive_times: include the ExistingStore iff store_status == OPERATING
      at evaluation time AND drive_minutes <= model.drive_time_minutes.
      cannibalized_sales_cents = sum over eligible stores of
        round_half_up(store.annual_sales_cents * factor, whole cents)   // per-store rounding BEFORE summation (pinned)
      factor per variant (below).
    input_set: "The pinned TradeAreaModel's store_drive_times joined to ExistingStore; only OPERATING stores; drive_minutes <= drive_time_minutes"
    constants:
      FLAT_BAND_LE5: 0.30
      FLAT_BAND_LE10: 0.15
      FLAT_BAND_REST: 0.05
      DECAY_PEAK: 0.35
    precision: "whole cents, round_half_up per store, then integer sum"
    variants:
      - name: FLAT_BAND
        when: "model.cannibalization_variant == FLAT_BAND"
        difference: "factor = 0.30 if drive_minutes <= 5; 0.15 if 6..10; 0.05 if 11..drive_time_minutes"
      - name: DISTANCE_DECAY
        when: "model.cannibalization_variant == DISTANCE_DECAY"
        difference: "factor = 0.35 * (D - drive_minutes)^2 / D^2 where D = model.drive_time_minutes; computed in exact decimal arithmetic"

  - name: sales_forecast_gross
    trigger: "POST /api/sales-forecasts (at creation)"
    algorithm: forward_looking
    formula: |
      // Variant GRAVITY (Huff-style):
      A_site = site.square_footage / SITE_SELF_DRIVE_MINUTES^2           // 25
      For each CompetitorListing of the pinned model with listing_type == COMPETITOR:
        d = max(distance_minutes, DISTANCE_FLOOR_MINUTES)                // floor 1
        A_i = listing.estimated_sqft / d^2                               // exact decimal
      capture_rate = round_half_up(A_site / (A_site + sum(A_i)), 6dp)    // == 1.000000 when no COMPETITOR listings
      gross_annual_sales_cents = round_half_up(trade_area_population * per_capita_spend_cents * capture_rate, whole cents)
      // Variant ANALOG:
      analogs = ExistingStore with market_id == site.market_id, store_status == OPERATING,
                format_type == site.format_type
      base = round_half_up(mean(analogs.annual_sales_cents), whole cents) // mean rounded BEFORE factor
      if analogs empty: base = market.prototype_sales_cents               // empty-set fallback (pinned)
      gross_annual_sales_cents = round_half_up(base * format_factor, whole cents)
    input_set: "GRAVITY: pinned LOCKED model's COMPETITOR listings + trade_area_population + per_capita_spend_cents. ANALOG: live OPERATING same-format ExistingStores of the market, else prototype fallback."
    constants:
      SITE_SELF_DRIVE_MINUTES: 5
      DISTANCE_FLOOR_MINUTES: 1
      FORMAT_FACTOR_EXPRESS: 0.85
      FORMAT_FACTOR_STANDARD: 1.00
      FORMAT_FACTOR_FLAGSHIP: 1.20
    precision: "capture_rate 6dp round_half_up; money whole cents round_half_up"
    variants:
      - name: GRAVITY
        when: "model_variant == GRAVITY"
        difference: "Share-of-attraction model over competitor listings; ignores own-store sales levels"
      - name: ANALOG
        when: "model_variant == ANALOG"
        difference: "Mean of same-format OPERATING store sales times the candidate's format factor; ignores competitor geometry"

  - name: occupancy_cost_ratio
    trigger: "SalesForecast lock (PROVISIONAL) and Lease execute (FINAL)"
    algorithm: threshold
    formula: |
      annual_occupancy_cents = (rent_psf_cents + cam_psf_cents + tax_psf_cents) * square_footage
      // PROVISIONAL: rent_psf_cents = site.asking_rent_psf_cents; cam/tax from site.
      // FINAL: rent_psf_cents = lease.final_rent_psf_cents; cam/tax from site.
      ratio_bp = round_half_up(annual_occupancy_cents * 10000 / denominator_sales_cents, integer bp)
      // denominator: PROVISIONAL uses forecast.net_annual_sales_cents; FINAL uses the pinned
      // forecast's net_annual_sales_cents as well (the forecast is the locked baseline).
      occupancy_band: ratio_bp <= 1500 -> GREEN; 1501..2200 -> YELLOW; >= 2201 -> RED
    input_set: "Site financial fields + the COMMITTEE_LOCKED forecast's net_annual_sales_cents"
    constants:
      BAND_GREEN_MAX_BP: 1500
      BAND_YELLOW_MAX_BP: 2200
    precision: "integer basis points, round_half_up"
    variants:
      - name: PROVISIONAL
        when: "computed at SalesForecast lock"
        difference: "uses asking_rent_psf_cents (deal not yet negotiated)"
      - name: FINAL
        when: "computed at Lease execute"
        difference: "uses lease final_rent_psf_cents; same sales baseline; different rent source yields a different ratio for identical site data"

  - name: site_visit_total_score
    trigger: "POST /api/site-visits (at creation)"
    algorithm: weighted_scoring
    formula: |
      total_score = round_half_up(0.30*visibility_score + 0.25*access_score
                                  + 0.15*parking_score + 0.30*cotenancy_score, 2dp)
      Site advance gate (bubble-up): total_score >= 70.00 advances MODELED -> SCORED;
      total_score < 70.00 records the visit but does not advance the site
      (and regresses SCORED -> MODELED when the site was SCORED).
    input_set: "The four component scores of the visit being created"
    constants:
      W_VISIBILITY: 0.30
      W_ACCESS: 0.25
      W_PARKING: 0.15
      W_COTENANCY: 0.30
      PASS_MIN: 70.00
    precision: "2 decimal places, round_half_up; the >= comparison uses the rounded 2dp value"

  - name: committee_vote_tally
    trigger: "POST /api/committee-reviews/{id}/votes (running tally after each recorded ballot)"
    algorithm: threshold
    formula: |
      E = eligible_member_count (pinned at review creation)
      quorum_count = ceil(E * 2/3)                                        // pinned at creation
      After each ballot: A = approve_votes, R = reject_votes, Ab = abstain_votes
      Decision point: when A + R + Ab == E (full turnout) the review -> DECIDED.
      decided_outcome = APPROVE iff BOTH:
        (i)  A * 100 > 60 * (A + R)          // strictly greater; exactly 60% is REJECT
        (ii) (A + R) >= quorum_count          // abstentions do not count toward quorum
      Otherwise REJECT. A + R == 0 => REJECT.
    input_set: "All Vote rows of the review (review_id match), tallied in cast order; order does not affect the final tally"
    constants:
      APPROVE_PCT_STRICT: 60
      QUORUM_NUM: 2
      QUORUM_DEN: 3
    precision: "integer ballot counts; percentage comparison in exact integer arithmetic (no floating point)"

  - name: loi_effective_rent
    trigger: "LOI send, LOI resend, Lease execute"
    algorithm: tiered_pricing
    formula: |
      // Nested rounding order is pinned; evaluating in a different order yields different cents.
      esc = escalation_pct_bp / 10000
      psf[1] = rent_psf_cents                                             // year-1 psf as given
      psf[y] = round_half_up(psf[y-1] * (1 + esc), whole cents)           // per-year psf rounded FIRST
      year_rent[y] = round_half_up(psf[y] * square_footage, whole cents)  // then per-year rent rounded
      monthly_year1 = round_half_up(year_rent[1] / 12, whole cents)       // monthly rounded BEFORE multiplying
      free_rent_value = monthly_year1 * free_rent_months
      total_contract_rent_cents = sum(year_rent[1..term_years]) - ti_allowance_cents - free_rent_value
      effective_annual_rent_cents = round_half_up(total_contract_rent_cents / term_years, whole cents)
      // square_footage comes from the LOI's site (or lease's LOI's site).
    input_set: "LOI/Lease rent terms + the site's square_footage"
    constants: {}
    precision: "whole cents, round_half_up at each pinned step"

  - name: performance_variance
    trigger: "PerformanceSnapshot finalize"
    algorithm: threshold
    formula: |
      expected_sales_cents = round_half_up(forecast.net_annual_sales_cents / 12, whole cents)
      // forecast: the site's ACTUALIZED SalesForecast
      variance_bp = round_half_up((actual_sales_cents - expected_sales_cents) * 10000 / expected_sales_cents, integer bp)
      miss iff variance_bp <= -2000 (inclusive: exactly -2000 IS a miss)
      consecutive_miss_count maintained on Site (see PerformanceSnapshot transitions)
    input_set: "The snapshot's actual_sales_cents + the site's ACTUALIZED forecast net_annual_sales_cents"
    constants:
      PERIODS_PER_YEAR: 12
      MISS_THRESHOLD_BP: -2000
      UNDERPERFORMING_MISSES: 2
    precision: "whole cents and integer bp, round_half_up"

  - name: market_capex_commitment
    trigger: "Site transitions into/out of {APPROVED, LOI_ACTIVE, LEASE_EXECUTED, BUILD_OUT, OPEN, MEASURING, UNDERPERFORMING} (ratify, withdraw, close-out)"
    algorithm: aggregation
    formula: |
      committed_capex_cents = sum(site.build_cost_cents) over Sites of the market with
        site_status IN {APPROVED, LOI_ACTIVE, LEASE_EXECUTED, BUILD_OUT, OPEN, MEASURING, UNDERPERFORMING}
      Submission gate (at submit-committee):
        committed_capex_cents + site.build_cost_cents
          <= round_half_up(annual_capex_budget_cents * BUDGET_CAP_BP / 10000, whole cents)
      Invariant: approve-then-withdraw leaves committed_capex_cents unchanged
        (commit adds build_cost_cents exactly once; withdraw releases exactly the same amount).
    input_set: "Sites of the market in the explicit status set above"
    constants:
      BUDGET_CAP_BP: 9000
    precision: "whole cents"

  - name: open_store_count_saturation
    trigger: "Site open, Site close-out, ExistingStore close"
    algorithm: aggregation
    formula: |
      open_store_count = count(ExistingStore of market with store_status == OPERATING)
                       + count(Site of market with site_status IN {OPEN, MEASURING, UNDERPERFORMING})
      Posture rule (bubble up, evaluated after every recompute):
        QUALIFIED -> SATURATED iff open_store_count >= target_store_count
        SATURATED -> QUALIFIED iff open_store_count < target_store_count
      Boundary: exactly target_store_count IS saturated (>= inclusive).
    input_set: "Market's stores and sites in the explicit status sets above"
    constants: {}
    precision: "integer counts"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and non-blank; X-User-Role is a declared role name"
    error_id: ERR_MISSING_AUTH_HEADER
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Acting role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path-template ids resolve left-to-right; body-referenced FK ids (market_id, site_id, trade_area_model_id, sales_forecast_id, sponsor_member_id, loi_id, crew_id, store ids inside store_drive_times) exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Request shape: required fields present, types correct, enum membership, date ordering (exclusivity_end_date > exclusivity_start_date, build_end_date > build_start_date), numeric ranges per entity constraints"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 4
    category: state
    check: "OCC: expected_site_version == Site.version on model lock; expected_review_version == CommitteeReview.version on vote cast"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: ["POST /api/trade-area-models/{id}/lock", "POST /api/committee-reviews/{id}/votes"]
  - priority: 5
    category: state
    check: "Target resource's own state permits the transition (site pipeline stage incl. site in {SCREENED..IN_COMMITTEE} for model create, MODELED|SCORED for visit/forecast create, APPROVED|LOI_ACTIVE for LOI create, LEASE_EXECUTED|BUILD_OUT for milestone create; model DRAFT for listing add/delete; forecast DRAFT for lock; review OPEN for votes / DECIDED for ratify; LOI from-state; lease NEGOTIATING/EXECUTED; milestone PENDING; snapshot RECORDED; member ACTIVE for deactivate)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 5
    category: state
    check: "Terminal lockdown: no mutation endpoint accepts a resource already in a terminal state (WITHDRAWN/CLOSED_OUT site, SUPERSEDED model/visit/forecast, RATIFIED/EXPIRED/VOID review, ACCEPTED/EXPIRED/WITHDRAWN LOI, TERMINATED lease, COMPLETED milestone, FINALIZED snapshot, CLOSED store/market, INACTIVE member)"
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 6
    category: business_safety
    check: "Segregation of duties: review sponsor may not cast a Vote on that review; review sponsor may not ratify that review"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: ["POST /api/committee-reviews/{id}/votes", "POST /api/committee-reviews/{id}/ratify"]
  - priority: 6
    category: business_safety
    check: "Voter eligibility: X-User-ID references a CommitteeMember with member_status == ACTIVE"
    error_id: ERR_VOTER_INELIGIBLE
    http_status: 403
    applies_to: ["POST /api/committee-reviews/{id}/votes"]
  - priority: 6
    category: business_safety
    check: "Chair authority: ratify requires the acting member to hold is_chair=true and member_status=ACTIVE"
    error_id: ERR_NOT_CHAIR
    http_status: 403
    applies_to: ["POST /api/committee-reviews/{id}/ratify"]
  - priority: 7
    category: business_constraint
    check: "Uniqueness and cardinality: one Vote per (review_id, member_id); store_code unique per market; crew_code unique chain-wide; at most one ACTIVE CommitteeMember with is_chair=true; at most one PermitMilestone per (site_id, milestone_type); at most one CommitteeReview per site in {OPEN, DECIDED}"
    error_id: ERR_DUPLICATE_VOTE
    http_status: 409
    applies_to: ["POST /api/committee-reviews/{id}/votes"]
    note: "Other uniqueness violations map to their specific ids: ERR_DUPLICATE_STORE_CODE, ERR_CREW_CODE_TAKEN, ERR_CHAIR_CONFLICT, ERR_DUPLICATE_MILESTONE. At most one non-terminal review per site is a structural invariant (the site leaves FORECAST_LOCKED when a review is created), so it needs no error id."
  - priority: 7
    category: business_constraint
    check: "store_code uniqueness within market on store create"
    error_id: ERR_DUPLICATE_STORE_CODE
    http_status: 409
    applies_to: ["POST /api/stores"]
  - priority: 7
    category: business_constraint
    check: "crew_code uniqueness on crew create"
    error_id: ERR_CREW_CODE_TAKEN
    http_status: 409
    applies_to: ["POST /api/construction-crews"]
  - priority: 7
    category: business_constraint
    check: "Chair singleton: creating a member with is_chair=true while another ACTIVE chair exists"
    error_id: ERR_CHAIR_CONFLICT
    http_status: 409
    applies_to: ["POST /api/committee-members"]
  - priority: 7
    category: business_constraint
    check: "One milestone per (site_id, milestone_type)"
    error_id: ERR_DUPLICATE_MILESTONE
    http_status: 409
    applies_to: ["POST /api/permit-milestones"]
  - priority: 7
    category: business_constraint
    check: "LOI exclusivity half-open overlap: new LOI's [exclusivity_start_date, exclusivity_end_date) must not intersect any other LOI of the same site with loi_status IN {SENT, COUNTERED, ACCEPTED}; adjacency (start == other.end) is allowed"
    error_id: ERR_LOI_EXCLUSIVITY_OVERLAP
    http_status: 409
    applies_to: ["POST /api/lois", "POST /api/lois/{id}/send"]
  - priority: 7
    category: business_constraint
    check: "Format sqft band at run-screening: EXPRESS 2000..4000, STANDARD 8000..15000, FLAGSHIP 20000..45000"
    error_id: ERR_FORMAT_SQFT_MISMATCH
    http_status: 422
    applies_to: ["POST /api/sites/{id}/run-screening"]
  - priority: 8
    category: business_temporal
    check: "LOI clock gates: create and send require exclusivity_end_date strictly after the logical clock date; counter/resend/accept require logical clock date <= exclusivity_end_date"
    error_id: ERR_WINDOW_IN_PAST
    http_status: 422
    applies_to: ["POST /api/lois", "POST /api/lois/{id}/send", "POST /api/lois/{id}/counter", "POST /api/lois/{id}/resend", "POST /api/lois/{id}/accept"]
  - priority: 8
    category: business_temporal
    check: "Review deadline: expires_at must be strictly after the logical clock at submit-committee"
    error_id: ERR_DEADLINE_IN_PAST
    http_status: 422
    applies_to: ["POST /api/sites/{id}/submit-committee"]
  - priority: 8
    category: business_temporal
    check: "Crew build-window conflict (closed interval + buffer): a lease's [build_start_date, build_end_date] conflicts with another NEGOTIATING-or-EXECUTED lease on the same crew iff new_start <= other_end + 6 days (equivalently the gap between windows must be >= 7 days; exactly 7 days is allowed)"
    error_id: ERR_CREW_WINDOW_CONFLICT
    http_status: 409
    applies_to: ["POST /api/leases"]
  - priority: 8
    category: business_temporal
    check: "Milestone order: completing a milestone requires every lower-order type for the site COMPLETED (PERMIT_SUBMITTED < PERMIT_APPROVED < BUILD_START < BUILD_COMPLETE)"
    error_id: ERR_MILESTONE_OUT_OF_ORDER
    http_status: 409
    applies_to: ["POST /api/permit-milestones/{id}/complete"]
  - priority: 8
    category: business_temporal
    check: "Snapshot period sequence: period_index must equal the site's count of FINALIZED snapshots + 1 (no gaps, no replays)"
    error_id: ERR_PERIOD_GAP
    http_status: 422
    applies_to: ["POST /api/performance-snapshots"]
  - priority: 9
    category: business_referential
    check: "Referenced-entity state: market QUALIFIED for run-screening (ERR_MARKET_NOT_QUALIFIED); trade-area model LOCKED and belongs to site for forecast create/lock (ERR_TRADE_AREA_NOT_LOCKED); forecast COMMITTEE_LOCKED and belongs to site for submit-committee (ERR_FORECAST_NOT_LOCKED); LOI ACCEPTED for lease create (ERR_LOI_NOT_ACCEPTED); crew ACTIVE for lease create (ERR_CREW_NOT_AVAILABLE); BUILD_COMPLETE milestone COMPLETED for site open (ERR_BUILD_NOT_COMPLETE); site OPEN/MEASURING/UNDERPERFORMING for snapshot create (ERR_SITE_NOT_OPEN)"
    error_id: ERR_MARKET_NOT_QUALIFIED
    http_status: 409
    applies_to: ["POST /api/sites/{id}/run-screening"]
    note: "One row per referential check below; all share priority 9"
  - priority: 9
    category: business_referential
    check: "TradeAreaModel referenced by a forecast create/lock must be LOCKED and belong to the same site"
    error_id: ERR_TRADE_AREA_NOT_LOCKED
    http_status: 409
    applies_to: ["POST /api/sales-forecasts", "POST /api/sales-forecasts/{id}/lock"]
  - priority: 9
    category: business_referential
    check: "SalesForecast referenced at submit-committee must be COMMITTEE_LOCKED and belong to the site"
    error_id: ERR_FORECAST_NOT_LOCKED
    http_status: 409
    applies_to: ["POST /api/sites/{id}/submit-committee"]
  - priority: 9
    category: business_referential
    check: "LOI referenced by lease create must be ACCEPTED"
    error_id: ERR_LOI_NOT_ACCEPTED
    http_status: 409
    applies_to: ["POST /api/leases"]
  - priority: 9
    category: business_referential
    check: "Crew referenced by lease create must be ACTIVE"
    error_id: ERR_CREW_NOT_AVAILABLE
    http_status: 409
    applies_to: ["POST /api/leases"]
  - priority: 9
    category: business_referential
    check: "Site open requires its BUILD_COMPLETE milestone COMPLETED"
    error_id: ERR_BUILD_NOT_COMPLETE
    http_status: 409
    applies_to: ["POST /api/sites/{id}/open"]
  - priority: 9
    category: business_referential
    check: "Snapshot create requires site OPEN, MEASURING, or UNDERPERFORMING"
    error_id: ERR_SITE_NOT_OPEN
    http_status: 409
    applies_to: ["POST /api/performance-snapshots"]
  - priority: 10
    category: business_fiscal
    check: "Asking rent at run-screening <= Market.max_rent_psf_cents"
    error_id: ERR_ASKING_RENT_ABOVE_MARKET_CAP
    http_status: 422
    applies_to: ["POST /api/sites/{id}/run-screening"]
  - priority: 10
    category: business_fiscal
    check: "Cannibalization cap at forecast lock: cannibalized_sales_cents <= gross_annual_sales_cents * 2500/10000 (inclusive boundary)"
    error_id: ERR_CANNIBALIZATION_EXCEEDS_CAP
    http_status: 422
    applies_to: ["POST /api/sales-forecasts/{id}/lock"]
  - priority: 10
    category: business_fiscal
    check: "Occupancy band at submit-committee: RED blocks; YELLOW requires chair_override=true"
    error_id: ERR_OCCUPANCY_RATIO_RED
    http_status: 422
    applies_to: ["POST /api/sites/{id}/submit-committee"]
  - priority: 10
    category: business_fiscal
    check: "YELLOW band submitted without chair_override=true"
    error_id: ERR_CHAIR_OVERRIDE_REQUIRED
    http_status: 422
    applies_to: ["POST /api/sites/{id}/submit-committee"]
  - priority: 10
    category: business_fiscal
    check: "Budget cap at submit-committee: committed_capex_cents + build_cost_cents <= budget * 9000/10000 (inclusive boundary)"
    error_id: ERR_BUDGET_CAP_EXCEEDED
    http_status: 422
    applies_to: ["POST /api/sites/{id}/submit-committee"]
  - priority: 10
    category: business_fiscal
    check: "Lease drift at execute: final_rent_psf_cents <= round_half_up(agreed_rent_psf_cents * 10500/10000, whole cents) (inclusive boundary)"
    error_id: ERR_LEASE_TERMS_DRIFT
    http_status: 422
    applies_to: ["POST /api/leases/{id}/execute"]
  - priority: 10
    category: business_fiscal
    check: "Eligible voter pool non-empty at submit-committee (count of ACTIVE members other than the sponsor >= 1)"
    error_id: ERR_NO_ELIGIBLE_VOTERS
    http_status: 422
    applies_to: ["POST /api/sites/{id}/submit-committee"]

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Markets ---
  - method: POST
    path: "/api/markets"
    description: "Create a market in SCREENING"
    roles: [PlatformAdmin]
    code: 201
    input: [name, state_code, population, median_household_income_cents, population_growth_bp, psychographic_index, base_target_stores, annual_capex_budget_cents, max_rent_psf_cents, prototype_sales_cents]
    output: Market
    side_effects: ["market_status=SCREENING; open_store_count=0; committed_capex_cents=0; score fields null"]
  - method: GET
    path: "/api/markets"
    description: "List markets"
    roles: [PlatformAdmin, RealEstateAnalyst, RealEstateManager, CommitteeMember, CommitteeChair, ConstructionManager]
    code: 200
    input: ["limit?", "offset?"]
    output: Market[]
    side_effects: []
  - method: GET
    path: "/api/markets/{id}"
    description: "Get a market"
    roles: [PlatformAdmin, RealEstateAnalyst, RealEstateManager, CommitteeMember, CommitteeChair, ConstructionManager]
    code: 200
    input: []
    output: Market
    side_effects: []
  - method: POST
    path: "/api/markets/{id}/evaluate"
    description: "Run market screening evaluation; sets score fields and QUALIFIED/DISQUALIFIED"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Market
    side_effects: ["runs market_screening_evaluation; market_status -> QUALIFIED or DISQUALIFIED (self-loop on DISQUALIFIED re-eval); increments version"]
  - method: POST
    path: "/api/markets/{id}/close"
    description: "Close a QUALIFIED market (terminal); blocked while any non-terminal pipeline site exists"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Market
    side_effects: ["market_status QUALIFIED -> CLOSED"]

  # --- Existing stores ---
  - method: POST
    path: "/api/stores"
    description: "Register an existing chain store"
    roles: [PlatformAdmin]
    code: 201
    input: [market_id, store_code, format_type, annual_sales_cents]
    output: ExistingStore
    side_effects: ["store_status=OPERATING; Market.open_store_count += 1; saturation bubble-up check"]
  - method: GET
    path: "/api/stores"
    description: "List stores, optional market filter"
    roles: [PlatformAdmin, RealEstateAnalyst, RealEstateManager, CommitteeMember, CommitteeChair, ConstructionManager]
    code: 200
    input: ["market_id?", "limit?", "offset?"]
    output: ExistingStore[]
    side_effects: []
  - method: GET
    path: "/api/stores/{id}"
    description: "Get a store"
    roles: [PlatformAdmin, RealEstateAnalyst, RealEstateManager, CommitteeMember, CommitteeChair, ConstructionManager]
    code: 200
    input: []
    output: ExistingStore
    side_effects: []
  - method: POST
    path: "/api/stores/{id}/close"
    description: "Close a store (OPERATING -> CLOSED)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: ExistingStore
    side_effects: ["Market.open_store_count -= 1; if Market SATURATED and count < target: Market -> QUALIFIED"]

  # --- Sites ---
  - method: POST
    path: "/api/sites"
    description: "Create a candidate site in DRAFT"
    roles: [RealEstateAnalyst]
    code: 201
    input: [market_id, address, format_type, square_footage, asking_rent_psf_cents, cam_psf_cents, tax_psf_cents, build_cost_cents]
    output: Site
    side_effects: ["site_status=DRAFT; consecutive_miss_count=0"]
  - method: GET
    path: "/api/sites"
    description: "List sites, optional filters"
    roles: [PlatformAdmin, RealEstateAnalyst, RealEstateManager, CommitteeMember, CommitteeChair, ConstructionManager]
    code: 200
    input: ["market_id?", "site_status?", "limit?", "offset?"]
    output: Site[]
    side_effects: []
  - method: GET
    path: "/api/sites/{id}"
    description: "Get a site"
    roles: [PlatformAdmin, RealEstateAnalyst, RealEstateManager, CommitteeMember, CommitteeChair, ConstructionManager]
    code: 200
    input: []
    output: Site
    side_effects: []
  - method: POST
    path: "/api/sites/{id}/run-screening"
    description: "Run site screening gate (DRAFT -> SCREENED)"
    roles: [RealEstateAnalyst]
    code: 200
    input: []
    output: Site
    side_effects: ["site_status -> SCREENED; increments version"]
  - method: POST
    path: "/api/sites/{id}/submit-committee"
    description: "Submit a FORECAST_LOCKED site to the committee; creates an OPEN CommitteeReview"
    roles: [RealEstateManager]
    code: 201
    input: [sales_forecast_id, sponsor_member_id, expires_at, "chair_override?"]
    output: CommitteeReview
    side_effects: ["site_status FORECAST_LOCKED -> IN_COMMITTEE; creates CommitteeReview OPEN with computed eligible_member_count and quorum_count; increments Site.version"]
  - method: POST
    path: "/api/sites/{id}/withdraw"
    description: "Withdraw a site pre-open (compensating release of committed capex; cascades to LOI and review)"
    roles: [RealEstateManager]
    code: 200
    input: []
    output: Site
    side_effects: ["site_status -> WITHDRAWN; capex release if applicable; LOIs in {DRAFT,SENT,COUNTERED} -> WITHDRAWN; reviews in {OPEN,DECIDED} -> VOID"]
  - method: POST
    path: "/api/sites/{id}/revise"
    description: "Revise a REJECTED site back to DRAFT; supersedes all analysis artifacts"
    roles: [RealEstateManager]
    code: 200
    input: []
    output: Site
    side_effects: ["site_status REJECTED -> DRAFT; LOCKED models -> SUPERSEDED; SUBMITTED visits -> SUPERSEDED; DRAFT/COMMITTEE_LOCKED forecasts -> SUPERSEDED"]
  - method: POST
    path: "/api/sites/{id}/open"
    description: "Open a BUILD_OUT site whose BUILD_COMPLETE milestone is COMPLETED"
    roles: [RealEstateManager]
    code: 200
    input: []
    output: Site
    side_effects: ["site_status -> OPEN; Market.open_store_count += 1; saturation bubble-up check"]
  - method: POST
    path: "/api/sites/{id}/close-out"
    description: "Permanently close an operating site (MEASURING/UNDERPERFORMING -> CLOSED_OUT)"
    roles: [RealEstateManager]
    code: 200
    input: []
    output: Site
    side_effects: ["site_status -> CLOSED_OUT; Market.open_store_count -= 1; Market.committed_capex_cents -= build_cost_cents; de-saturation bubble-up check"]

  # --- Trade area models ---
  - method: POST
    path: "/api/trade-area-models"
    description: "Create a trade-area model in DRAFT for a site; site must be in {SCREENED, MODELED, SCORED, FORECAST_LOCKED, IN_COMMITTEE} (else ERR_INVALID_STATE)"
    roles: [RealEstateAnalyst]
    code: 201
    input: [site_id, drive_time_minutes, trade_area_population, per_capita_spend_cents, cannibalization_variant, "store_drive_times?"]
    output: TradeAreaModel
    side_effects: ["model_status=DRAFT; cannibalized_sales_cents=null"]
  - method: GET
    path: "/api/trade-area-models"
    description: "List trade-area models, optional filters"
    roles: [PlatformAdmin, RealEstateAnalyst, RealEstateManager, CommitteeMember, CommitteeChair, ConstructionManager]
    code: 200
    input: ["site_id?", "model_status?", "limit?", "offset?"]
    output: TradeAreaModel[]
    side_effects: []
  - method: GET
    path: "/api/trade-area-models/{id}"
    description: "Get a trade-area model"
    roles: [PlatformAdmin, RealEstateAnalyst, RealEstateManager, CommitteeMember, CommitteeChair, ConstructionManager]
    code: 200
    input: []
    output: TradeAreaModel
    side_effects: []
  - method: POST
    path: "/api/trade-area-models/{id}/lock"
    description: "Lock a DRAFT model (OCC on Site.version); supersedes the site's previously LOCKED model and cascades"
    roles: [RealEstateAnalyst]
    code: 200
    input: [expected_site_version]
    output: TradeAreaModel
    side_effects: ["model_status DRAFT -> LOCKED; computes cannibalized_sales_cents snapshot; increments Site.version by 1; supersession + forecast/review/site cascade per §1.2; site SCREENED -> MODELED when applicable"]

  # --- Competitor listings ---
  - method: POST
    path: "/api/competitor-listings"
    description: "Add a competitor/co-tenant listing to a DRAFT model"
    roles: [RealEstateAnalyst]
    code: 201
    input: [trade_area_model_id, listing_type, brand_name, estimated_sqft, distance_minutes]
    output: CompetitorListing
    side_effects: []
  - method: GET
    path: "/api/competitor-listings"
    description: "List listings, optional filters"
    roles: [PlatformAdmin, RealEstateAnalyst, RealEstateManager, CommitteeMember, CommitteeChair, ConstructionManager]
    code: 200
    input: ["trade_area_model_id?", "listing_type?", "limit?", "offset?"]
    output: CompetitorListing[]
    side_effects: []
  - method: GET
    path: "/api/competitor-listings/{id}"
    description: "Get a listing"
    roles: [PlatformAdmin, RealEstateAnalyst, RealEstateManager, CommitteeMember, CommitteeChair, ConstructionManager]
    code: 200
    input: []
    output: CompetitorListing
    side_effects: []
  - method: DELETE
    path: "/api/competitor-listings/{id}"
    description: "Remove a listing from a DRAFT model"
    roles: [RealEstateAnalyst]
    code: 204
    input: []
    output: null
    side_effects: []

  # --- Site visits ---
  - method: POST
    path: "/api/site-visits"
    description: "Record a site visit; requires site MODELED or SCORED (else ERR_INVALID_STATE); computes weighted total; supersedes the site's prior SUBMITTED visit; bubbles site MODELED<->SCORED"
    roles: [RealEstateAnalyst]
    code: 201
    input: [site_id, visited_on, visibility_score, access_score, parking_score, cotenancy_score]
    output: SiteVisit
    side_effects: ["total_score computed; prior SUBMITTED visit -> SUPERSEDED; site MODELED -> SCORED iff total_score >= 70.00; site SCORED -> MODELED iff total_score < 70.00"]
  - method: GET
    path: "/api/site-visits"
    description: "List site visits, optional filters"
    roles: [PlatformAdmin, RealEstateAnalyst, RealEstateManager, CommitteeMember, CommitteeChair, ConstructionManager]
    code: 200
    input: ["site_id?", "visit_status?", "limit?", "offset?"]
    output: SiteVisit[]
    side_effects: []
  - method: GET
    path: "/api/site-visits/{id}"
    description: "Get a site visit"
    roles: [PlatformAdmin, RealEstateAnalyst, RealEstateManager, CommitteeMember, CommitteeChair, ConstructionManager]
    code: 200
    input: []
    output: SiteVisit
    side_effects: []

  # --- Sales forecasts ---
  - method: POST
    path: "/api/sales-forecasts"
    description: "Create a forecast in DRAFT against the site's LOCKED model; requires site MODELED or SCORED (else ERR_INVALID_STATE); computes gross per variant"
    roles: [RealEstateAnalyst]
    code: 201
    input: [site_id, trade_area_model_id, model_variant]
    output: SalesForecast
    side_effects: ["gross_annual_sales_cents computed per sales_forecast_gross; forecast_status=DRAFT"]
  - method: GET
    path: "/api/sales-forecasts"
    description: "List forecasts, optional filters"
    roles: [PlatformAdmin, RealEstateAnalyst, RealEstateManager, CommitteeMember, CommitteeChair, ConstructionManager]
    code: 200
    input: ["site_id?", "trade_area_model_id?", "forecast_status?", "limit?", "offset?"]
    output: SalesForecast[]
    side_effects: []
  - method: GET
    path: "/api/sales-forecasts/{id}"
    description: "Get a forecast"
    roles: [PlatformAdmin, RealEstateAnalyst, RealEstateManager, CommitteeMember, CommitteeChair, ConstructionManager]
    code: 200
    input: []
    output: SalesForecast
    side_effects: []
  - method: POST
    path: "/api/sales-forecasts/{id}/lock"
    description: "Committee-lock a DRAFT forecast; computes cannibalization, net, occupancy ratio/band; supersedes sibling forecasts"
    roles: [RealEstateAnalyst]
    code: 200
    input: []
    output: SalesForecast
    side_effects: ["forecast_status DRAFT -> COMMITTEE_LOCKED; computes cannibalized_sales_cents, net_annual_sales_cents, occupancy_ratio_bp, occupancy_band; sibling DRAFT/COMMITTEE_LOCKED forecasts -> SUPERSEDED; site SCORED -> FORECAST_LOCKED"]

  # --- Committee members ---
  - method: POST
    path: "/api/committee-members"
    description: "Register a committee member"
    roles: [PlatformAdmin]
    code: 201
    input: [display_name, "is_chair?"]
    output: CommitteeMember
    side_effects: ["member_status=ACTIVE"]
  - method: GET
    path: "/api/committee-members"
    description: "List committee members"
    roles: [PlatformAdmin, RealEstateAnalyst, RealEstateManager, CommitteeMember, CommitteeChair, ConstructionManager]
    code: 200
    input: ["member_status?", "limit?", "offset?"]
    output: CommitteeMember[]
    side_effects: []
  - method: GET
    path: "/api/committee-members/{id}"
    description: "Get a committee member"
    roles: [PlatformAdmin, RealEstateAnalyst, RealEstateManager, CommitteeMember, CommitteeChair, ConstructionManager]
    code: 200
    input: []
    output: CommitteeMember
    side_effects: []
  - method: POST
    path: "/api/committee-members/{id}/deactivate"
    description: "Deactivate a member (ACTIVE -> INACTIVE)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: CommitteeMember
    side_effects: ["member_status -> INACTIVE"]

  # --- Committee reviews & votes ---
  - method: GET
    path: "/api/committee-reviews"
    description: "List reviews, optional filters"
    roles: [PlatformAdmin, RealEstateAnalyst, RealEstateManager, CommitteeMember, CommitteeChair, ConstructionManager]
    code: 200
    input: ["site_id?", "sales_forecast_id?", "sponsor_member_id?", "review_status?", "limit?", "offset?"]
    output: CommitteeReview[]
    side_effects: []
  - method: GET
    path: "/api/committee-reviews/{id}"
    description: "Get a review with tallies"
    roles: [PlatformAdmin, RealEstateAnalyst, RealEstateManager, CommitteeMember, CommitteeChair, ConstructionManager]
    code: 200
    input: []
    output: CommitteeReview
    side_effects: []
  - method: POST
    path: "/api/committee-reviews/{id}/votes"
    description: "Cast a ballot (OCC on CommitteeReview.version); member identity from X-User-ID"
    roles: [CommitteeMember, CommitteeChair]
    code: 201
    input: [ballot, expected_review_version]
    output: Vote
    side_effects: ["tally updated on the review; increments CommitteeReview.version by 1; review OPEN -> DECIDED at full turnout with decided_outcome per committee_vote_tally"]
  - method: POST
    path: "/api/committee-reviews/{id}/ratify"
    description: "Chair ratifies a DECIDED review; applies outcome to the site with cascades"
    roles: [CommitteeChair]
    code: 200
    input: []
    output: CommitteeReview
    side_effects: ["review DECIDED -> RATIFIED; APPROVE: site -> APPROVED and Market.committed_capex_cents += build_cost_cents; REJECT: site -> REJECTED"]
  - method: GET
    path: "/api/votes"
    description: "List votes, optional filters (review_id, member_id)"
    roles: [PlatformAdmin, RealEstateAnalyst, RealEstateManager, CommitteeMember, CommitteeChair, ConstructionManager]
    code: 200
    input: ["review_id?", "member_id?", "limit?", "offset?"]
    output: Vote[]
    side_effects: []
  - method: GET
    path: "/api/votes/{id}"
    description: "Get a vote"
    roles: [PlatformAdmin, RealEstateAnalyst, RealEstateManager, CommitteeMember, CommitteeChair, ConstructionManager]
    code: 200
    input: []
    output: Vote
    side_effects: []

  # --- LOIs ---
  - method: POST
    path: "/api/lois"
    description: "Create an LOI in DRAFT for an APPROVED/LOI_ACTIVE site"
    roles: [RealEstateManager]
    code: 201
    input: [site_id, rent_psf_cents, escalation_pct_bp, term_years, "ti_allowance_cents?", "free_rent_months?", exclusivity_start_date, exclusivity_end_date]
    output: LOI
    side_effects: ["loi_status=DRAFT; round_number=1"]
  - method: GET
    path: "/api/lois"
    description: "List LOIs, optional filters"
    roles: [PlatformAdmin, RealEstateAnalyst, RealEstateManager, CommitteeMember, CommitteeChair, ConstructionManager]
    code: 200
    input: ["site_id?", "loi_status?", "limit?", "offset?"]
    output: LOI[]
    side_effects: []
  - method: GET
    path: "/api/lois/{id}"
    description: "Get an LOI"
    roles: [PlatformAdmin, RealEstateAnalyst, RealEstateManager, CommitteeMember, CommitteeChair, ConstructionManager]
    code: 200
    input: []
    output: LOI
    side_effects: []
  - method: POST
    path: "/api/lois/{id}/send"
    description: "Send a DRAFT LOI; computes effective rent; first send moves site APPROVED -> LOI_ACTIVE"
    roles: [RealEstateManager]
    code: 200
    input: []
    output: LOI
    side_effects: ["loi_status DRAFT -> SENT; computes effective_annual_rent_cents; site APPROVED -> LOI_ACTIVE on first send"]
  - method: POST
    path: "/api/lois/{id}/counter"
    description: "Record a landlord counter (SENT -> COUNTERED)"
    roles: [RealEstateManager]
    code: 200
    input: [countered_rent_psf_cents]
    output: LOI
    side_effects: ["loi_status SENT -> COUNTERED; stores countered_rent_psf_cents"]
  - method: POST
    path: "/api/lois/{id}/resend"
    description: "Re-send with revised broker terms (COUNTERED -> SENT); round_number increments"
    roles: [RealEstateManager]
    code: 200
    input: [rent_psf_cents]
    output: LOI
    side_effects: ["loi_status COUNTERED -> SENT; round_number += 1; countered_rent_psf_cents cleared; effective_annual_rent_cents recomputed"]
  - method: POST
    path: "/api/lois/{id}/accept"
    description: "Accept current terms (SENT or COUNTERED -> ACCEPTED); agreed rent pinned per from-state"
    roles: [RealEstateManager]
    code: 200
    input: []
    output: LOI
    side_effects: ["loi_status -> ACCEPTED; agreed_rent_psf_cents = rent_psf_cents (from SENT) or countered_rent_psf_cents (from COUNTERED)"]
  - method: POST
    path: "/api/lois/{id}/withdraw"
    description: "Withdraw a non-terminal LOI"
    roles: [RealEstateManager]
    code: 200
    input: []
    output: LOI
    side_effects: ["loi_status -> WITHDRAWN"]

  # --- Leases ---
  - method: POST
    path: "/api/leases"
    description: "Create a lease in NEGOTIATING from an ACCEPTED LOI; assigns crew build window"
    roles: [RealEstateManager]
    code: 201
    input: [loi_id, final_rent_psf_cents, escalation_pct_bp, term_years, "ti_allowance_cents?", "free_rent_months?", crew_id, build_start_date, build_end_date]
    output: Lease
    side_effects: ["lease_status=NEGOTIATING; crew window reserved for overlap checks"]
  - method: GET
    path: "/api/leases"
    description: "List leases, optional filters"
    roles: [PlatformAdmin, RealEstateAnalyst, RealEstateManager, CommitteeMember, CommitteeChair, ConstructionManager]
    code: 200
    input: ["loi_id?", "crew_id?", "lease_status?", "limit?", "offset?"]
    output: Lease[]
    side_effects: []
  - method: GET
    path: "/api/leases/{id}"
    description: "Get a lease"
    roles: [PlatformAdmin, RealEstateAnalyst, RealEstateManager, CommitteeMember, CommitteeChair, ConstructionManager]
    code: 200
    input: []
    output: Lease
    side_effects: []
  - method: POST
    path: "/api/leases/{id}/execute"
    description: "Execute a NEGOTIATING lease; drift check vs LOI agreed rent; computes FINAL occupancy ratio"
    roles: [RealEstateManager]
    code: 200
    input: []
    output: Lease
    side_effects: ["lease_status -> EXECUTED; computes effective_annual_rent_cents and final_occupancy_ratio_bp; site LOI_ACTIVE -> LEASE_EXECUTED"]
  - method: POST
    path: "/api/leases/{id}/terminate"
    description: "Terminate an EXECUTED lease; site withdraws with capital release"
    roles: [RealEstateManager]
    code: 200
    input: []
    output: Lease
    side_effects: ["lease_status -> TERMINATED; site {LEASE_EXECUTED, BUILD_OUT} -> WITHDRAWN with capex release"]

  # --- Construction crews ---
  - method: POST
    path: "/api/construction-crews"
    description: "Register a build-out crew"
    roles: [PlatformAdmin]
    code: 201
    input: [crew_code]
    output: ConstructionCrew
    side_effects: ["crew_status=ACTIVE"]
  - method: GET
    path: "/api/construction-crews"
    description: "List crews"
    roles: [PlatformAdmin, RealEstateAnalyst, RealEstateManager, CommitteeMember, CommitteeChair, ConstructionManager]
    code: 200
    input: ["limit?", "offset?"]
    output: ConstructionCrew[]
    side_effects: []
  - method: GET
    path: "/api/construction-crews/{id}"
    description: "Get a crew"
    roles: [PlatformAdmin, RealEstateAnalyst, RealEstateManager, CommitteeMember, CommitteeChair, ConstructionManager]
    code: 200
    input: []
    output: ConstructionCrew
    side_effects: []
  - method: POST
    path: "/api/construction-crews/{id}/retire"
    description: "Retire a crew (ACTIVE -> RETIRED); reserved windows on existing leases are kept"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: ConstructionCrew
    side_effects: ["crew_status -> RETIRED"]

  # --- Permit milestones ---
  - method: POST
    path: "/api/permit-milestones"
    description: "Plan a milestone for a site in LEASE_EXECUTED or BUILD_OUT"
    roles: [ConstructionManager]
    code: 201
    input: [site_id, milestone_type, planned_date]
    output: PermitMilestone
    side_effects: ["milestone_status=PENDING"]
  - method: GET
    path: "/api/permit-milestones"
    description: "List milestones, optional filters"
    roles: [PlatformAdmin, RealEstateAnalyst, RealEstateManager, CommitteeMember, CommitteeChair, ConstructionManager]
    code: 200
    input: ["site_id?", "milestone_status?", "limit?", "offset?"]
    output: PermitMilestone[]
    side_effects: []
  - method: GET
    path: "/api/permit-milestones/{id}"
    description: "Get a milestone"
    roles: [PlatformAdmin, RealEstateAnalyst, RealEstateManager, CommitteeMember, CommitteeChair, ConstructionManager]
    code: 200
    input: []
    output: PermitMilestone
    side_effects: []
  - method: POST
    path: "/api/permit-milestones/{id}/complete"
    description: "Complete a PENDING milestone in type order; BUILD_START completion moves site to BUILD_OUT"
    roles: [ConstructionManager]
    code: 200
    input: [actual_date]
    output: PermitMilestone
    side_effects: ["milestone_status -> COMPLETED; records actual_date; BUILD_START: site LEASE_EXECUTED -> BUILD_OUT"]

  # --- Performance snapshots ---
  - method: POST
    path: "/api/performance-snapshots"
    description: "Record a monthly actual-sales snapshot for an open site (RECORDED)"
    roles: [RealEstateManager]
    code: 201
    input: [site_id, period_index, actual_sales_cents]
    output: PerformanceSnapshot
    side_effects: ["snapshot_status=RECORDED; expected/variance null until finalize"]
  - method: GET
    path: "/api/performance-snapshots"
    description: "List snapshots, optional filters"
    roles: [PlatformAdmin, RealEstateAnalyst, RealEstateManager, CommitteeMember, CommitteeChair, ConstructionManager]
    code: 200
    input: ["site_id?", "snapshot_status?", "limit?", "offset?"]
    output: PerformanceSnapshot[]
    side_effects: []
  - method: GET
    path: "/api/performance-snapshots/{id}"
    description: "Get a snapshot"
    roles: [PlatformAdmin, RealEstateAnalyst, RealEstateManager, CommitteeMember, CommitteeChair, ConstructionManager]
    code: 200
    input: []
    output: PerformanceSnapshot
    side_effects: []
  - method: POST
    path: "/api/performance-snapshots/{id}/finalize"
    description: "Finalize a RECORDED snapshot; computes variance; drives UNDERPERFORMING/recovery cascades"
    roles: [RealEstateManager]
    code: 200
    input: []
    output: PerformanceSnapshot
    side_effects: ["snapshot_status -> FINALIZED; computes expected_sales_cents and variance_bp; first finalize: site OPEN -> MEASURING and forecast COMMITTEE_LOCKED -> ACTUALIZED; miss/recovery updates Site.consecutive_miss_count and UNDERPERFORMING transitions"]

  # --- Logical clock (test-driving) ---
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Advance the logical clock. Startup default (before any call) is exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time. Applying a new time fires all time-based transitions whose deadline is strictly before the new time: LOIs in {SENT, COUNTERED} with exclusivity_end_date passed -> EXPIRED; CommitteeReviews in OPEN with expires_at passed -> EXPIRED (site IN_COMMITTEE -> REJECTED)."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["applies time-based LOI EXPIRED and review EXPIRED transitions with their cascades"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_AUTH_HEADER, http: 401, condition: "X-User-Role or X-User-ID missing/blank, or role name not declared" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Acting role not in the endpoint's roles list" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body-referenced resource id does not exist (checked left-to-right)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, wrong type, enum violation, range violation, or end-date not after start-date" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_site_version != Site.version on model lock, or expected_review_version != CommitteeReview.version on vote cast" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource's own state does not permit the requested transition" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "Resource is in a terminal state; no further transitions" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Review sponsor attempts to vote on or ratify their own deal" }
  - { id: ERR_VOTER_INELIGIBLE, http: 403, condition: "Casting member is INACTIVE or X-User-ID does not reference a CommitteeMember" }
  - { id: ERR_NOT_CHAIR, http: 403, condition: "Ratify attempted by a member without is_chair=true or not ACTIVE" }
  - { id: ERR_DUPLICATE_VOTE, http: 409, condition: "A Vote already exists for (review_id, member_id)" }
  - { id: ERR_DUPLICATE_STORE_CODE, http: 409, condition: "store_code already exists within the market" }
  - { id: ERR_CREW_CODE_TAKEN, http: 409, condition: "crew_code already exists" }
  - { id: ERR_CHAIR_CONFLICT, http: 409, condition: "Creating a member with is_chair=true while another ACTIVE chair exists" }
  - { id: ERR_DUPLICATE_MILESTONE, http: 409, condition: "A PermitMilestone already exists for (site_id, milestone_type)" }
  - { id: ERR_LOI_EXCLUSIVITY_OVERLAP, http: 409, condition: "Half-open exclusivity window intersects another LOI of the same site in {SENT, COUNTERED, ACCEPTED}" }
  - { id: ERR_FORMAT_SQFT_MISMATCH, http: 422, condition: "square_footage outside the format band at run-screening" }
  - { id: ERR_WINDOW_IN_PAST, http: 422, condition: "LOI action with the exclusivity window ended relative to the logical clock (or create/send with end date not after the clock date)" }
  - { id: ERR_DEADLINE_IN_PAST, http: 422, condition: "submit-committee with expires_at not strictly after the logical clock" }
  - { id: ERR_CREW_WINDOW_CONFLICT, http: 409, condition: "Lease build window violates the same crew's existing window with the 7-day buffer rule" }
  - { id: ERR_MILESTONE_OUT_OF_ORDER, http: 409, condition: "Completing a milestone while a lower-order milestone for the site is still PENDING" }
  - { id: ERR_PERIOD_GAP, http: 422, condition: "Snapshot period_index is not exactly the count of FINALIZED snapshots + 1" }
  - { id: ERR_MARKET_NOT_QUALIFIED, http: 409, condition: "run-screening while the market is not QUALIFIED" }
  - { id: ERR_TRADE_AREA_NOT_LOCKED, http: 409, condition: "Forecast create/lock references a model that is not LOCKED or belongs to another site" }
  - { id: ERR_FORECAST_NOT_LOCKED, http: 409, condition: "submit-committee references a forecast that is not COMMITTEE_LOCKED or belongs to another site" }
  - { id: ERR_LOI_NOT_ACCEPTED, http: 409, condition: "Lease create references an LOI that is not ACCEPTED" }
  - { id: ERR_CREW_NOT_AVAILABLE, http: 409, condition: "Lease create references a crew that is not ACTIVE" }
  - { id: ERR_BUILD_NOT_COMPLETE, http: 409, condition: "Site open without a COMPLETED BUILD_COMPLETE milestone" }
  - { id: ERR_SITE_NOT_OPEN, http: 409, condition: "Snapshot create while site is not OPEN, MEASURING, or UNDERPERFORMING" }
  - { id: ERR_ASKING_RENT_ABOVE_MARKET_CAP, http: 422, condition: "asking_rent_psf_cents exceeds Market.max_rent_psf_cents at run-screening" }
  - { id: ERR_CANNIBALIZATION_EXCEEDS_CAP, http: 422, condition: "Forecast lock with cannibalized_sales_cents > 25% of gross_annual_sales_cents" }
  - { id: ERR_OCCUPANCY_RATIO_RED, http: 422, condition: "submit-committee with occupancy_band RED (ratio >= 2201 bp)" }
  - { id: ERR_CHAIR_OVERRIDE_REQUIRED, http: 422, condition: "submit-committee with occupancy_band YELLOW and chair_override not true" }
  - { id: ERR_BUDGET_CAP_EXCEEDED, http: 422, condition: "submit-committee would push committed capex past 90% of the market budget" }
  - { id: ERR_LEASE_TERMS_DRIFT, http: 422, condition: "Lease execute with final rent above agreed rent * 1.05" }
  - { id: ERR_NO_ELIGIBLE_VOTERS, http: 422, condition: "submit-committee with zero ACTIVE members other than the sponsor" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Chain administrator; owns markets, existing stores, committee roster, crews, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /api/markets, POST /api/markets/{id}/evaluate, POST /api/markets/{id}/close"
      - "POST /api/stores, POST /api/stores/{id}/close"
      - "POST /api/committee-members, POST /api/committee-members/{id}/deactivate"
      - "POST /api/construction-crews, POST /api/construction-crews/{id}/retire"
      - "POST /api/_clock/set_current_utc"
    shared_operations: ["All GET endpoints"]
  - name: RealEstateAnalyst
    description: "Research analyst; owns sites' analytical artifacts: screening, trade-area models, listings, visits, forecasts"
    identity: opaque
    exclusive_operations:
      - "POST /api/sites, POST /api/sites/{id}/run-screening"
      - "POST /api/trade-area-models, POST /api/trade-area-models/{id}/lock"
      - "POST /api/competitor-listings, DELETE /api/competitor-listings/{id}"
      - "POST /api/site-visits"
      - "POST /api/sales-forecasts, POST /api/sales-forecasts/{id}/lock"
    shared_operations: ["All GET endpoints"]
  - name: RealEstateManager
    description: "Deal manager; submits deals to committee, negotiates LOIs, executes leases, opens/closes sites, records actuals"
    identity: opaque
    exclusive_operations:
      - "POST /api/sites/{id}/submit-committee, /withdraw, /revise, /open, /close-out"
      - "POST /api/lois and LOI actions (send, counter, resend, accept, withdraw)"
      - "POST /api/leases, POST /api/leases/{id}/execute, /terminate"
      - "POST /api/performance-snapshots, POST /api/performance-snapshots/{id}/finalize"
    shared_operations: ["All GET endpoints"]
  - name: CommitteeMember
    description: "Voting committee member; X-User-ID must equal a CommitteeMember entity id"
    identity: "entity_backed:CommitteeMember"
    exclusive_operations:
      - "POST /api/committee-reviews/{id}/votes"
    shared_operations: ["All GET endpoints"]
  - name: CommitteeChair
    description: "Committee chair; X-User-ID must equal a CommitteeMember entity id with is_chair=true; may also cast votes (chairs are members)"
    identity: "entity_backed:CommitteeMember"
    exclusive_operations:
      - "POST /api/committee-reviews/{id}/ratify"
    shared_operations: ["All GET endpoints", "POST /api/committee-reviews/{id}/votes"]
  - name: ConstructionManager
    description: "Build-out coordinator; owns the permitting/build-out milestone timeline"
    identity: opaque
    exclusive_operations:
      - "POST /api/permit-milestones, POST /api/permit-milestones/{id}/complete"
    shared_operations: ["All GET endpoints"]
  - name: System
    description: "Internal actor for automatic transitions (bubble-ups, supersession cascades, clock sweeps); not callable via the API"
    identity: opaque
    exclusive_operations:
      - "Automatic state transitions declared in §1.2 with actor=system"
    shared_operations: []
