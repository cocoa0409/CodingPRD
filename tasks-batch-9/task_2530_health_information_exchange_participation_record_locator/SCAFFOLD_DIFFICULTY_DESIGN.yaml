  - rule_id: cross_entity_state_dependency
    instances:
      - name: locator_query_blocked_until_the_ccda_feed_leaves_provisioning
        grounds:
          - validations.priority_13_ERR_QUERY_FEED_NOT_OPERATIONAL
          - state_machines.DataFeed.PROVISIONING_to_MONITORED
          - calculations.consent_disclosure_decision
          - endpoints.POST_hie_record_locator_queries
        distinguishing_aspect: |
          Entity pair RecordLocatorQuery -> DataFeed: an operation on one entity is gated by the state of
          a completely different entity owned by the same participant. The identical query payload is
          refused with 409 ERR_QUERY_FEED_NOT_OPERATIONAL while the participant's CCDA feed is
          PROVISIONING and accepted with 201 once a quality sample moves that feed to MONITORED. Nothing
          about the query, the cluster, the policy or the caller changes between the two attempts - only
          the foreign entity's state.
        test_recipe:
          setup:
            - "An OPT_OUT statewide policy with default_share_for_treatment true is ACTIVE, so a member with no directives is disclosed for TREATMENT."
            - "A PROBABILISTIC_ONLY threshold generation is ACTIVE with auto_link_threshold 0.9200."
            - "Participant M is certified end-to-end and contributes one patient record, creating a single-member ACTIVE cluster."
            - "Participant M's CCDA feed exists but has never received a sample, so it is PROVISIONING."
          setup_api_calls:
            - call: "POST /hie/consent-policies"
              payload: { policy_version: "SP-2026.6", model: "OPT_OUT", sensitive_categories_segmented: ["BEHAVIORAL_HEALTH", "HIV", "SUBSTANCE_USE", "REPRODUCTIVE"], default_share_for_treatment: true, effective_from: "2026-01-01T00:00:00Z" }
