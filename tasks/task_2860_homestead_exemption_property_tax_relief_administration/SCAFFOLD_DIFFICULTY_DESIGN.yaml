          Depth-3 cascade rooted at a single POST /exemption-grants/{id}/port whose fan-out is
          LATERAL rather than reversing: L1 mints a child grant on the destination parcel, L2 empties
          the source portable balance and flips the source to TRANSFERRED, L3 re-decomposes TWO
