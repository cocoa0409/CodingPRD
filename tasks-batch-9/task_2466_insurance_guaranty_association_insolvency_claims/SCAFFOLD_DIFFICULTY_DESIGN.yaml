scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: claim_payable_offset_then_cap_versus_cap_then_offset_on_same_loss
        grounds:
          - calculations.claim_net_payable
          - entities.CoveredClaim.fields.net_payable_cents
          - entities.CoveredClaim.fields.alt_net_payable_cents
          - entities.CoverageProfile.fields.cap_order_mode
          - state_machines.OtherInsuranceCoverage.PURSUING_to_EXHAUSTED
        distinguishing_aspect: |
          On the CoveredClaim entity, the two claim_net_payable variants order the statutory
          deductible and other-insurance offsets differently around the per-claim cap, so identical
          loss data yields net_payable_cents 3000000 under OFFSET_THEN_CAP and alt_net_payable_cents
          1790000 under CAP_THEN_OFFSET, a delta of exactly 1210000 cents.
        test_recipe:
          setup:
            - "A PERSONAL_AUTO CoverageProfile with cap_order_mode OFFSET_THEN_CAP, per_claim_cap_cents 3000000, per_policy_aggregate_cap_cents 5000000 and statutory_deductible_cents 10000."
            - "Insolvency in TRIGGERED with liquidation_order_date 2026-03-01, so coverage_termination_date is 2026-03-31."
            - "TransferredPolicy PA-1001 in CANCELLED_BY_ORDER with no large deductible, no self-insured retention and no collateral."
            - "CoveredClaim C-1 in SCREENED_ELIGIBLE with gross_loss_cents 4500000 and one OtherInsuranceCoverage layer in PURSUING for stated_limit_cents 2000000."
            - "Logical clock at its 2026-08-01T00:00:00Z default, well before the 2027-03-01T00:00:00Z proof-of-claim deadline."
          setup_api_calls:
            - call: "POST /coverage-profiles"
              payload: { line_of_business: "PERSONAL_AUTO", per_claim_cap_cents: 3000000, per_policy_aggregate_cap_cents: 5000000, unearned_premium_cap_cents: 1000000, refund_priority_class: 2, statutory_deductible_cents: 10000, net_worth_exclusion_threshold_cents: 2500000000, covers_punitive_damages: false, cap_order_mode: "OFFSET_THEN_CAP" }
              as: AssociationAdmin
            - call: "POST /insolvencies"
              payload: { insurer_name: "Great Lakes Mutual Casualty", naic_code: "10001", domiciliary_state_code: "MI", liquidation_order_date: "2026-03-01" }
              as: AssociationAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /policies"
              payload: { insolvency_id: "${ins_id}", policy_number: "PA-1001", line_of_business: "PERSONAL_AUTO", policyholder_name: "Ada Renner", policyholder_state_code: "MI", effective_date: "2025-10-01", expiration_date: "2026-10-01", annual_premium_cents: 1200000, policyholder_net_worth_cents: 50000000, large_deductible_cents: 0, self_insured_retention_cents: 0, collateral_held_cents: 0 }
              as: ReceiverLiaison
              captures: { pol_id: $.data.id }
            - call: "POST /insolvencies/${ins_id}/trigger"
              payload: {}
              as: AssociationAdmin
            - call: "POST /claims"
              payload: { insolvency_id: "${ins_id}", policy_id: "${pol_id}", claim_number: "C-1", claimant_name: "Ben Ortiz", claimant_state_code: "MI", loss_date: "2026-01-15", gross_loss_cents: 4500000, punitive_damages_cents: 0 }
              as: CoverageAnalyst
              captures: { clm_id: $.data.id }
            - call: "POST /claims/${clm_id}/screen"
              payload: { decision: "COVERED" }
              as: CoverageAnalyst
              as_user_id: "analyst-1"
              captures: { clm_v: $.data.version }
            - call: "POST /claims/${clm_id}/other-insurance"
              payload: { carrier_name: "Northline Casualty", policy_number: "NL-77", coverage_type: "PRIMARY", stated_limit_cents: 2000000, expected_claim_version: "${clm_v}" }
              as: CoverageAnalyst
              captures: { oic_id: $.data.id }
            - call: "PATCH /claims/${clm_id}/other-insurance/${oic_id}"
              payload: { status: "PURSUING" }
              as: CoverageAnalyst
          trigger:
            - call: "PATCH /claims/${clm_id}/other-insurance/${oic_id}"
              payload: { status: "EXHAUSTED", recovered_cents: 1200000 }
              as: CoverageAnalyst
            - call: "GET /claims/${clm_id}/settlement-worksheet"
              payload: {}
              as: CoverageAnalyst
              captures: { delta: $.data.variant_delta_cents }
          assert:
            - "CoveredClaim.${clm_id}.other_insurance_recoverable_cents == 1200000"
            - "CoveredClaim.${clm_id}.covered_layer_cents == 4500000"
            - "CoveredClaim.${clm_id}.net_payable_cents == 3000000"
            - "CoveredClaim.${clm_id}.alt_net_payable_cents == 1790000"
            - "CoveredClaim.${clm_id}.cap_binding == PER_CLAIM"
            - "${delta} == 1210000"

      - name: unearned_premium_pro_rata_versus_short_rate_on_same_policy
        grounds:
          - calculations.unearned_premium_refund
          - entities.UnearnedPremiumRefund.fields.computed_refund_cents
          - entities.UnearnedPremiumRefund.fields.alt_refund_cents
          - entities.TransferredPolicy.fields.unexpired_days
          - concurrency_rules[up-refund-create-stale-policy]
        distinguishing_aspect: |
          On the TransferredPolicy entity, the unearned_premium_refund variants differ by the 0.90
          SHORT_RATE_FACTOR applied before the single round_half_up step, so the same 1200000 cent
          premium with 184 unexpired days of a 365 day term refunds 544438 cents under SHORT_RATE
          and 604932 cents under PRO_RATA.
        test_recipe:
          setup:
            - "A PERSONAL_AUTO CoverageProfile with unearned_premium_cap_cents 1000000 and refund_priority_class 2."
            - "Insolvency in TRIGGERED with liquidation_order_date 2026-03-01 and coverage_termination_date 2026-03-31."
            - "TransferredPolicy PA-1001 in CANCELLED_BY_ORDER with annual_premium_cents 1200000, term 2025-10-01 to 2026-10-01 (365 days), cancellation_date 2026-03-31 and unexpired_days 184."
            - "No unearned premium refund filed yet, so up_refund_filed is false."
          setup_api_calls:
            - call: "POST /coverage-profiles"
              payload: { line_of_business: "PERSONAL_AUTO", per_claim_cap_cents: 3000000, per_policy_aggregate_cap_cents: 5000000, unearned_premium_cap_cents: 1000000, refund_priority_class: 2, statutory_deductible_cents: 10000, cap_order_mode: "OFFSET_THEN_CAP" }
              as: AssociationAdmin
            - call: "POST /insolvencies"
              payload: { insurer_name: "Great Lakes Mutual Casualty", naic_code: "10001", domiciliary_state_code: "MI", liquidation_order_date: "2026-03-01" }
              as: AssociationAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /policies"
              payload: { insolvency_id: "${ins_id}", policy_number: "PA-1001", line_of_business: "PERSONAL_AUTO", policyholder_name: "Ada Renner", policyholder_state_code: "MI", effective_date: "2025-10-01", expiration_date: "2026-10-01", annual_premium_cents: 1200000 }
              as: ReceiverLiaison
              captures: { pol_id: $.data.id }
            - call: "POST /insolvencies/${ins_id}/trigger"
              payload: {}
              as: AssociationAdmin
            - call: "GET /policies/${pol_id}"
              payload: {}
              as: CoverageAnalyst
              captures: { pol_v: $.data.version }
          trigger:
            - call: "POST /policies/${pol_id}/premium-refunds"
              payload: { refund_method: "SHORT_RATE", expected_policy_version: "${pol_v}" }
              as: CoverageAnalyst
              captures: { upr_id: $.data.id }
          assert:
            - "TransferredPolicy.${pol_id}.unexpired_days == 184"
            - "UnearnedPremiumRefund.${upr_id}.computed_refund_cents == 544438"
            - "UnearnedPremiumRefund.${upr_id}.alt_refund_cents == 604932"
            - "UnearnedPremiumRefund.${upr_id}.capped == false"
            - "UnearnedPremiumRefund.${upr_id}.priority_class == 2"
            - "UnearnedPremiumRefund.${upr_id}.status == PENDING"
            - "Insolvency.${ins_id}.pending_up_liability_cents == 544438"

  - rule_id: combinatorial_formula
    instances:
      - name: cap_then_offset_profile_flips_which_payable_is_statutory
        grounds:
          - calculations.claim_net_payable
          - entities.CoverageProfile.fields.cap_order_mode
          - entities.CoveredClaim.fields.cap_binding
          - state_machines.CoveredClaim.RECEIVED_to_SCREENED_ELIGIBLE
        distinguishing_aspect: |
          The cap_order_mode configuration flag is the first combinatorial axis: a
          COMMERCIAL_GENERAL_LIABILITY profile set to CAP_THEN_OFFSET makes net_payable_cents
          1790000 and alt_net_payable_cents 3000000 on exactly the loss data that produced the
          mirror-image pair under OFFSET_THEN_CAP.
        test_recipe:
          setup:
            - "A COMMERCIAL_GENERAL_LIABILITY CoverageProfile with cap_order_mode CAP_THEN_OFFSET, per_claim_cap_cents 3000000, per_policy_aggregate_cap_cents 5000000 and statutory_deductible_cents 10000."
            - "Insolvency in TRIGGERED and TransferredPolicy CGL-2001 in CANCELLED_BY_ORDER with no retained layer."
            - "CoveredClaim C-9 in SCREENED_ELIGIBLE with gross_loss_cents 4500000 and one OtherInsuranceCoverage layer that has reached EXHAUSTED with recovered_cents 1200000."
          setup_api_calls:
            - call: "POST /coverage-profiles"
              payload: { line_of_business: "COMMERCIAL_GENERAL_LIABILITY", per_claim_cap_cents: 3000000, per_policy_aggregate_cap_cents: 5000000, unearned_premium_cap_cents: 1000000, refund_priority_class: 3, statutory_deductible_cents: 10000, cap_order_mode: "CAP_THEN_OFFSET" }
              as: AssociationAdmin
            - call: "POST /insolvencies"
              payload: { insurer_name: "Great Lakes Mutual Casualty", naic_code: "10001", domiciliary_state_code: "MI", liquidation_order_date: "2026-03-01" }
              as: AssociationAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /policies"
              payload: { insolvency_id: "${ins_id}", policy_number: "CGL-2001", line_of_business: "COMMERCIAL_GENERAL_LIABILITY", policyholder_name: "Renner Fabrication LLC", policyholder_state_code: "MI", effective_date: "2025-10-01", expiration_date: "2026-10-01", annual_premium_cents: 900000, policyholder_net_worth_cents: 40000000 }
              as: ReceiverLiaison
              captures: { pol_id: $.data.id }
            - call: "POST /insolvencies/${ins_id}/trigger"
              payload: {}
              as: AssociationAdmin
            - call: "POST /claims"
              payload: { insolvency_id: "${ins_id}", policy_id: "${pol_id}", claim_number: "C-9", claimant_name: "Cora Diaz", claimant_state_code: "MI", loss_date: "2026-02-02", gross_loss_cents: 4500000 }
              as: CoverageAnalyst
              captures: { clm_id: $.data.id }
            - call: "POST /claims/${clm_id}/screen"
              payload: { decision: "COVERED" }
              as: CoverageAnalyst
              as_user_id: "analyst-1"
              captures: { clm_v: $.data.version }
            - call: "POST /claims/${clm_id}/other-insurance"
              payload: { carrier_name: "Northline Casualty", policy_number: "NL-88", coverage_type: "PRIMARY", stated_limit_cents: 2000000, expected_claim_version: "${clm_v}" }
              as: CoverageAnalyst
              captures: { oic_id: $.data.id }
            - call: "PATCH /claims/${clm_id}/other-insurance/${oic_id}"
              payload: { status: "PURSUING" }
              as: CoverageAnalyst
            - call: "PATCH /claims/${clm_id}/other-insurance/${oic_id}"
              payload: { status: "EXHAUSTED", recovered_cents: 1200000 }
              as: CoverageAnalyst
          trigger:
            - call: "GET /claims/${clm_id}/settlement-worksheet"
              payload: {}
              as: CoverageAnalyst
              captures: { net: $.data.net_payable_cents, alt: $.data.alt_net_payable_cents, mode: $.data.cap_order_mode }
          assert:
            - "${mode} == CAP_THEN_OFFSET"
            - "${net} == 1790000"
            - "${alt} == 3000000"
            - "CoveredClaim.${clm_id}.net_payable_cents == 1790000"
            - "CoveredClaim.${clm_id}.alt_net_payable_cents == 3000000"
            - "CoveredClaim.${clm_id}.cap_binding == PER_CLAIM"

      - name: waterfall_pro_rata_remainder_cent_goes_to_earliest_refund
        grounds:
          - calculations.distribution_waterfall
          - entities.UnearnedPremiumRefund.fields.sequence
          - state_machines.UnearnedPremiumRefund.PENDING_to_PARTIALLY_PAID
          - concurrency_rules[distribution-stale-insolvency]
        distinguishing_aspect: |
          The second combinatorial axis is the waterfall's rounding branch: with 500000 cents against
          788932 cents of class 3 outstanding, the floored pro-rata shares total 499999 and the single
          residual cent goes to the earliest-created refund, producing 383387 and 116613 rather than
          383386 and 116614.
        test_recipe:
          setup:
            - "A PERSONAL_AUTO CoverageProfile with unearned_premium_cap_cents 1000000 and refund_priority_class 2."
            - "Insolvency in TRIGGERED with two PERSONAL_AUTO policies in CANCELLED_BY_ORDER: PA-1001 with annual_premium_cents 1200000 and PA-1002 with annual_premium_cents 365000, both 2025-10-01 to 2026-10-01 with unexpired_days 184."
            - "UnearnedPremiumRefund on PA-1001 filed first (PRO_RATA, 604932 cents) then on PA-1002 (PRO_RATA, 184000 cents); both PENDING, class 3 outstanding 788932 cents."
            - "No vendor invoices and no approved claims, so class 1 and class 2 are empty."
            - "estate_remitted_cents 500000 and estate_undistributed_cents 500000."
          setup_api_calls:
            - call: "POST /coverage-profiles"
              payload: { line_of_business: "PERSONAL_AUTO", per_claim_cap_cents: 3000000, per_policy_aggregate_cap_cents: 5000000, unearned_premium_cap_cents: 1000000, refund_priority_class: 2, statutory_deductible_cents: 10000 }
              as: AssociationAdmin
            - call: "POST /insolvencies"
              payload: { insurer_name: "Great Lakes Mutual Casualty", naic_code: "10001", domiciliary_state_code: "MI", liquidation_order_date: "2026-03-01" }
              as: AssociationAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /policies"
              payload: { insolvency_id: "${ins_id}", policy_number: "PA-1001", line_of_business: "PERSONAL_AUTO", policyholder_name: "Ada Renner", policyholder_state_code: "MI", effective_date: "2025-10-01", expiration_date: "2026-10-01", annual_premium_cents: 1200000 }
              as: ReceiverLiaison
              captures: { pol_a: $.data.id }
            - call: "POST /policies"
              payload: { insolvency_id: "${ins_id}", policy_number: "PA-1002", line_of_business: "PERSONAL_AUTO", policyholder_name: "Boris Ilic", policyholder_state_code: "MI", effective_date: "2025-10-01", expiration_date: "2026-10-01", annual_premium_cents: 365000 }
              as: ReceiverLiaison
              captures: { pol_b: $.data.id }
            - call: "POST /insolvencies/${ins_id}/trigger"
              payload: {}
              as: AssociationAdmin
            - call: "GET /policies/${pol_a}"
              payload: {}
              as: CoverageAnalyst
              captures: { pol_a_v: $.data.version }
            - call: "POST /policies/${pol_a}/premium-refunds"
              payload: { refund_method: "PRO_RATA", expected_policy_version: "${pol_a_v}" }
              as: CoverageAnalyst
              captures: { upr_a: $.data.id }
            - call: "GET /policies/${pol_b}"
              payload: {}
              as: CoverageAnalyst
              captures: { pol_b_v: $.data.version }
            - call: "POST /policies/${pol_b}/premium-refunds"
              payload: { refund_method: "PRO_RATA", expected_policy_version: "${pol_b_v}" }
              as: CoverageAnalyst
              captures: { upr_b: $.data.id }
            - call: "POST /insolvencies/${ins_id}/estate-remittances"
              payload: { amount_cents: 500000, remittance_ref: "EA-2026-01" }
              as: ReceiverLiaison
            - call: "GET /insolvencies/${ins_id}"
              payload: {}
              as: AssociationAdmin
              captures: { ins_v: $.data.version }
          trigger:
            - call: "POST /insolvencies/${ins_id}/distributions"
              payload: { distribution_amount_cents: 500000, expected_insolvency_version: "${ins_v}" }
              as: AssociationAdmin
              captures: { class3: $.data.class3_paid_cents, seq: $.data.distribution_sequence }
          assert:
            - "${class3} == 500000"
            - "${seq} == 1"
            - "UnearnedPremiumRefund.${upr_a}.computed_refund_cents == 604932"
            - "UnearnedPremiumRefund.${upr_b}.computed_refund_cents == 184000"
            - "UnearnedPremiumRefund.${upr_a}.paid_amount_cents == 383387"
            - "UnearnedPremiumRefund.${upr_b}.paid_amount_cents == 116613"
            - "UnearnedPremiumRefund.${upr_a}.status == PARTIALLY_PAID"
            - "UnearnedPremiumRefund.${upr_b}.status == PARTIALLY_PAID"
            - "Insolvency.${ins_id}.estate_distributed_cents == 500000"
            - "Insolvency.${ins_id}.estate_undistributed_cents == 0"
            - "Insolvency.${ins_id}.pending_up_liability_cents == 288932"

      - name: assessment_cap_forces_second_round_redistribution
        grounds:
          - calculations.member_assessment_allocation
          - entities.MemberInsurer.fields.annual_cap_rate_bps
          - entities.MemberAssessment.fields.cap_amount_cents
          - entities.MemberAssessment.fields.capped
          - state_machines.Assessment.DRAFT_to_CERTIFIED
        distinguishing_aspect: |
          The third combinatorial axis is the allocation's redistribution branch: the member whose
          regulator-reduced annual_cap_rate_bps of 50 caps at 150000 exits the pool, and the residual
          1250000 cents is re-spread over the remaining 70000000 premium base, so the 10000000 base
          member is levied 178572 rather than its first-round raw share of 140000.
        test_recipe:
          setup:
            - "Insolvency in TRIGGERED (PERSONAL_AUTO profile registered, one policy imported and cancelled by the order)."
            - "Three ACTIVE MemberInsurer rows for PERSONAL_AUTO base_year 2025, created in this order: M1 premium base 10000000 at 200 bps (cap 200000), M2 premium base 30000000 reduced to 50 bps (cap 150000), M3 premium base 60000000 at 200 bps (cap 1200000)."
            - "Assessment in DRAFT for PERSONAL_AUTO base_year 2025 with needed_amount_cents 1400000."
          setup_api_calls:
            - call: "POST /coverage-profiles"
              payload: { line_of_business: "PERSONAL_AUTO", per_claim_cap_cents: 3000000, per_policy_aggregate_cap_cents: 5000000, unearned_premium_cap_cents: 1000000, refund_priority_class: 2, statutory_deductible_cents: 10000 }
              as: AssociationAdmin
            - call: "POST /insolvencies"
              payload: { insurer_name: "Great Lakes Mutual Casualty", naic_code: "10001", domiciliary_state_code: "MI", liquidation_order_date: "2026-03-01" }
              as: AssociationAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /policies"
              payload: { insolvency_id: "${ins_id}", policy_number: "PA-1001", line_of_business: "PERSONAL_AUTO", policyholder_name: "Ada Renner", policyholder_state_code: "MI", effective_date: "2025-10-01", expiration_date: "2026-10-01", annual_premium_cents: 1200000 }
              as: ReceiverLiaison
            - call: "POST /insolvencies/${ins_id}/trigger"
              payload: {}
              as: AssociationAdmin
            - call: "POST /member-insurers"
              payload: { naic_code: "20001", insurer_name: "Huron Standard Insurance", assessable_line: "PERSONAL_AUTO", base_year: 2025, direct_written_premium_cents: 10000000, annual_cap_rate_bps: 200 }
              as: AssociationAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /member-insurers"
              payload: { naic_code: "20002", insurer_name: "Saginaw Reciprocal", assessable_line: "PERSONAL_AUTO", base_year: 2025, direct_written_premium_cents: 30000000, annual_cap_rate_bps: 50 }
              as: AssociationAdmin
              captures: { m2_id: $.data.id }
            - call: "POST /member-insurers"
              payload: { naic_code: "20003", insurer_name: "Detroit Indemnity Company", assessable_line: "PERSONAL_AUTO", base_year: 2025, direct_written_premium_cents: 60000000, annual_cap_rate_bps: 200 }
              as: AssociationAdmin
              captures: { m3_id: $.data.id }
            - call: "POST /assessments"
              payload: { insolvency_id: "${ins_id}", assessable_line: "PERSONAL_AUTO", base_year: 2025, needed_amount_cents: 1400000 }
              as: AssessmentOfficer
              captures: { asmt_id: $.data.id }
          trigger:
            - call: "POST /assessments/${asmt_id}/certify"
              payload: {}
              as: AssessmentOfficer
            - call: "GET /member-assessments"
              payload: { assessment_id: "${asmt_id}" }
              as: AssessmentOfficer
          assert:
            - "Assessment.${asmt_id}.status == CERTIFIED"
            - "Assessment.${asmt_id}.levied_amount_cents == 1400000"
            - "Assessment.${asmt_id}.shortfall_cents == 0"
            - "Assessment.${asmt_id}.member_count == 3"
            - "MemberAssessment where member_insurer_id == ${m1_id} has cap_amount_cents == 200000 and levied_amount_cents == 178572 and capped == false"
            - "MemberAssessment where member_insurer_id == ${m2_id} has cap_amount_cents == 150000 and levied_amount_cents == 150000 and capped == true"
            - "MemberAssessment where member_insurer_id == ${m3_id} has cap_amount_cents == 1200000 and levied_amount_cents == 1071428 and capped == false"
            - "Insolvency.${ins_id}.assessment_shortfall_cents == 0"

  - rule_id: non_linear_state_machine
    instances:
      - name: third_remand_refused_after_two_recommend_remand_cycles
        grounds:
          - state_machines.CoveredClaim.RECOMMENDED_to_ADJUSTING
          - state_machines.CoveredClaim.ADJUSTING_to_RECOMMENDED
          - entities.CoveredClaim.fields.remand_count
          - validations[priority=19]
          - errors[ERR_REMAND_LIMIT_REACHED]
        distinguishing_aspect: |
          CoveredClaim's non-linearity is a bounded RECOMMENDED to ADJUSTING revert cycle: the claim
          traverses the loop exactly twice, remand_count reaches 2, and the third remand is refused
          with ERR_REMAND_LIMIT_REACHED while the claim stays in RECOMMENDED.
        test_recipe:
          setup:
            - "Insolvency in TRIGGERED, PERSONAL_AUTO policy in CANCELLED_BY_ORDER, CoveredClaim C-1 screened eligible with net_payable_cents 3000000."
            - "One ASSIGNED ADJUSTER VendorAssignment with settlement_authority_cents 2500000 covering 2026-08-01 to 2026-08-31, so the claim is in ADJUSTING."
            - "The claim has already completed two recommend/remand cycles, so remand_count == 2 and status is RECOMMENDED."
          setup_api_calls:
            - call: "POST /coverage-profiles"
              payload: { line_of_business: "PERSONAL_AUTO", per_claim_cap_cents: 3000000, per_policy_aggregate_cap_cents: 5000000, unearned_premium_cap_cents: 1000000, refund_priority_class: 2, statutory_deductible_cents: 10000 }
              as: AssociationAdmin
            - call: "POST /insolvencies"
              payload: { insurer_name: "Great Lakes Mutual Casualty", naic_code: "10001", domiciliary_state_code: "MI", liquidation_order_date: "2026-03-01" }
              as: AssociationAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /policies"
              payload: { insolvency_id: "${ins_id}", policy_number: "PA-1001", line_of_business: "PERSONAL_AUTO", policyholder_name: "Ada Renner", policyholder_state_code: "MI", effective_date: "2025-10-01", expiration_date: "2026-10-01", annual_premium_cents: 1200000 }
              as: ReceiverLiaison
              captures: { pol_id: $.data.id }
            - call: "POST /insolvencies/${ins_id}/trigger"
              payload: {}
              as: AssociationAdmin
            - call: "POST /claims"
              payload: { insolvency_id: "${ins_id}", policy_id: "${pol_id}", claim_number: "C-1", claimant_name: "Ben Ortiz", claimant_state_code: "MI", loss_date: "2026-01-15", gross_loss_cents: 4500000 }
              as: CoverageAnalyst
              captures: { clm_id: $.data.id }
            - call: "POST /claims/${clm_id}/screen"
              payload: { decision: "COVERED" }
              as: CoverageAnalyst
              as_user_id: "analyst-1"
            - call: "POST /claims/${clm_id}/vendor-assignments"
