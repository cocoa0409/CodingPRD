      - name: deluge_density_products_are_rounded_to_a_tenth_then_lifted_by_their_floor
        claim_type: precision
        grounds:
          - calculations.auxiliary_system_demand
          - entities.AuxiliarySystem.fields.protected_area_sqft
        distinguishing_aspect: |
          Both deluge families multiply a density by an area, round the product to one decimal
          round_half_up and only then apply their floor. FOAM at 1000 sqft computes 160.0 and is lifted
          to FOAM_FLOOR_GPM 250.0, while 1573 sqft computes 251.68 and survives as 251.7 - a figure a
          truncating implementation would report as 251.6 and a floor-first implementation would report
          as 250.0. HAZMAT at 800 sqft is lifted from 240.0 to 300.0 and at 1005 sqft lands on 301.5.
        test_recipe:
          setup:
            - "Project FP-2601 with no hydraulic calculation"
          setup_api_calls:
            - call: "POST /engineers"
              payload: { full_name: "Dana Ruiz", license_state: "TX", license_number: "PE-77120", license_status: "ACTIVE" }
              as: FirmAdmin
              captures: { e1: $.data.id }
            - call: "POST /ahj-reviewers"
