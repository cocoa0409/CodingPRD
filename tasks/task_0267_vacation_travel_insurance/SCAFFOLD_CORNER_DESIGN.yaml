              as_user_id: "${trav_id}"
          assert:
            - "Exactly one Refund exists for policy ${pol_id} with refund_type == SHORT_RATE"
            - "That Refund.amount_cents == 14166"

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: refund_complete_immediately_reflects_payment_refunded
        claim_type: immediate
        grounds:
          - "state_machines.Refund.PENDING_to_COMPLETED"
          - "entities.Policy.fields.payment_status"
          - "entities.Policy.fields.net_premium_collected_cents"
        distinguishing_aspect: "After a SHORT_RATE refund is completed, the same request's read of the policy shows payment_status=REFUNDED and net_premium_collected_cents reduced by the refund amount — changes are immediate, not eventual."
        test_recipe:
          setup: ["Policy cancelled post-free-look -> a PENDING SHORT_RATE Refund exists; premium 20000; refund 14166 (30-day coverage, elapsed 5, admin fee 2500). Underwriter completes it; net_premium_collected_cents becomes 20000 - 14166 = 5834."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CarrierAdmin
            - call: "POST /plans"
              payload: { code: "CM-1", tier: "BASIC", base_rate_bps: 400, cancellation_limit_pct: 100, medical_limit_cents: 500000, delay_block_cap_cents: 20000, delay_limit_cents: 100000, baggage_item_sublimit_cents: 30000, baggage_limit_cents: 100000, baggage_depreciation_bps: 2000, waiver_window_days: 14, free_look_days: 3, claim_filing_window_days: 90, cfar_loading_bps: 4000, cfar_reimbursement_pct: 75, senior_loading_bps: 5000 }
              as: CarrierAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /travelers"
              payload: { email: "cm1@x.com", full_name: "CM1", date_of_birth: "1990-01-01" }
              as: CarrierAdmin
              captures: { trav_id: $.data.id }
            - call: "POST /policies"
              payload: { plan_id: "${plan_id}", owner_traveler_id: "${trav_id}", trip_cost_cents: 500000, initial_deposit_at: "2026-05-25T00:00:00Z", trip_start_at: "2026-06-25T00:00:00Z", trip_end_at: "2026-07-01T00:00:00Z" }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { pol_id: $.data.id }
            - call: "POST /policies/${pol_id}/insured-travelers"
              payload: { traveler_id: "${trav_id}", age_at_departure: 36, covered_trip_cost_cents: 500000 }
              as: Traveler
              as_user_id: "${trav_id}"
            - call: "GET /policies/${pol_id}"
              as: Any
              captures: { pol_id_polver: $.data.version }
            - call: "POST /policies/${pol_id}/record-payment"
              payload: { expected_policy_version: "${pol_id_polver}" }
              as: Traveler
              as_user_id: "${trav_id}"
            - call: "POST /policies/${pol_id}/issue"
              payload: {}
              as: Underwriter
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-06T00:00:00Z" }
              as: CarrierAdmin
            - call: "POST /policies/${pol_id}/cancel"
              payload: {}
              as: Traveler
              as_user_id: "${trav_id}"
            - call: "GET /refunds?policy_id=${pol_id}"
              as: Any
              captures: { refund_id: "$.data[0].id" }
          trigger:
            - call: "POST /refunds/${refund_id}/complete"
              payload: {}
              as: Underwriter
          assert:
            - "Refund.${refund_id}.status == COMPLETED"
            - "Policy.${pol_id}.payment_status == REFUNDED"
            - "Policy.${pol_id}.net_premium_collected_cents == 5834"

  # ---------------------------------------------------------------------------
  # excluded_because stubs — corners already exercised by §1.8 instances
  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: error_named_storm_cutoff_on_approve_stub
        claim_type: Violation → Error
        grounds:
          - "errors[ERR_NAMED_STORM_CUTOFF]"
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / named_storm_cutoff_beats_aggregate_fiscal_on_approve
          rationale: "ERR_NAMED_STORM_CUTOFF is asserted as the winning error in the named §1.8 priority-conflict instance."
      - name: error_delay_below_threshold_stub
        claim_type: Violation → Error
        grounds:
          - "errors[ERR_DELAY_BELOW_THRESHOLD]"
        excluded_because:
          difficulty_instance: boundary_precision_check / delay_threshold_inclusive_12h_covered_11h_rejected
          rationale: "The 11h-rejected leg of the boundary instance triggers ERR_DELAY_BELOW_THRESHOLD."
      - name: baggage_round_per_item_correct_result_stub
        claim_type: Correct Result
        grounds:
          - "calculations.baggage_reimbursement"
        excluded_because:
          difficulty_instance: combinatorial_formula / baggage_reimbursement_round_per_item_before_sum
          rationale: "Baggage per-item-rounding correctness is the core assertion of the named §1.8 instance."
      - name: premium_quote_correct_result_stub
        claim_type: Correct Result
        grounds:
          - "calculations.premium_quote"
        excluded_because:
          difficulty_instance: combinatorial_formula / premium_quote_tiered_rate_plus_senior_plus_cfar_loadings
          rationale: "Premium computation (base + senior + CFAR) is asserted directly in the named §1.8 instance."

  - section: state_machines
    instances:
      - name: payout_disburse_side_effect_ledger_stub
        claim_type: Side Effect Execution
        grounds:
          - "state_machines.Payout.PENDING_to_DISBURSED"
        excluded_because:
          difficulty_instance: transitive_cascade / payout_disburse_cascades_ledger_then_exhausted_then_sibling_denial
          rationale: "Disburse side effects (ledger debit, EXHAUSTED, sibling denial, claim PAID) are asserted by the named §1.8 cascade instance."
      - name: payout_reverse_compensation_stub
        claim_type: Compensation
        grounds:
          - "state_machines.Payout.DISBURSED_to_REVERSED"
        excluded_because:
          difficulty_instance: compensating_invariant / payout_reverse_restores_remaining_aggregate
          rationale: "Reverse compensation (aggregate restored, no drift) is the core assertion of the named §1.8 invariant instance."
      - name: free_look_refund_cascade_stub
        claim_type: Cross-entity
        grounds:
          - "state_machines.Policy.coverage:ACTIVE_to_coverage:CANCELLED"
        excluded_because:
          difficulty_instance: transitive_cascade / free_look_cancel_cascades_refund_then_payment_refunded
          rationale: "The free-look refund cascade and payment_status flip are asserted by the named §1.8 instance."
      - name: claim_cycle_valid_transitions_stub
        claim_type: Valid Transition
        grounds:
          - "state_machines.Claim.INFO_REQUESTED_to_UNDER_REVIEW"
        excluded_because:
          difficulty_instance: non_linear_state_machine / claim_cycle_under_review_info_requested_under_review
          rationale: "The UNDER_REVIEW<->INFO_REQUESTED cycle transitions are exercised by the named §1.8 instance."
