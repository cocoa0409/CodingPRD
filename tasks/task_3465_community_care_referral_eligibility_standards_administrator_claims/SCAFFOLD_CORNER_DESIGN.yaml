scaffold_corner_design:
  - section: entities
    instances:
      - name: care_station_creation_returns_all_fields
        claim_type: creation
        grounds:
          - "entities.CareStation"
        distinguishing_aspect: "POST /community-care/care-stations with all required fields returns 201 with every input echoed plus system fields (id, created_at, updated_at, version == 1)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /community-care/care-stations"
              payload: { name: "Station Alpha", latitude: 40.0, longitude: -75.0, primary_wait_days: 10, specialty_wait_days: 15, service_codes: ["PT_EVAL", "CARD"] }
              as: PlatformAdmin
              captures: { st_id: $.data.id, st_v: $.data.version }
          assert:
            - "response 201; data.name == 'Station Alpha', primary_wait_days == 10, specialty_wait_days == 15, service_codes == ['PT_EVAL','CARD']"
            - "version == 1 and id/created_at/updated_at are populated"

      - name: veteran_creation_and_retrieval_round_trip
        claim_type: retrieval
        grounds:
          - "entities.Veteran"
          - "entities.CareStation"
        distinguishing_aspect: "A created veteran is retrievable by id with identical field values."
        test_recipe:
          setup: ["one station exists"]
          setup_api_calls:
            - call: "POST /community-care/care-stations"
              payload: { name: "Station Alpha", latitude: 40.0, longitude: -75.0, primary_wait_days: 10, specialty_wait_days: 15, service_codes: ["PT_EVAL"] }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
            - call: "POST /community-care/veterans"
              payload: { full_name: "V Round", home_station_id: "${st_id}", priority_group: 6, home_latitude: 41.0, home_longitude: -74.5 }
              as: EligibilityClerk
              captures: { v_id: $.data.id }
          trigger:
            - call: "GET /community-care/veterans/${v_id}"
              as: Veteran
              as_user_id: "${v_id}"
              captures: { got_name: $.data.full_name, got_pg: $.data.priority_group }
          assert:
            - "GET returns 200; full_name == 'V Round', priority_group == 6, home_station_id == ${st_id}"

      - name: veteran_create_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - "entities.Veteran"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Omitting required input home_station_id yields 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["one station exists"]
          setup_api_calls:
            - call: "POST /community-care/care-stations"
              payload: { name: "Station Alpha", latitude: 40.0, longitude: -75.0, primary_wait_days: 10, specialty_wait_days: 15, service_codes: ["PT_EVAL"] }
              as: PlatformAdmin
          trigger:
            - call: "POST /community-care/veterans"
              payload: { full_name: "V NoStation", priority_group: 6, home_latitude: 41.0, home_longitude: -74.5 }
              as: EligibilityClerk
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST (400)"

      - name: veteran_create_invalid_request_for_priority_group_range
        claim_type: type_constraints
        grounds:
          - "entities.Veteran.fields.priority_group"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "priority_group 9 is outside the declared 1..8 range and is rejected at shape validation."
        test_recipe:
          setup: ["one station exists"]
          setup_api_calls:
            - call: "POST /community-care/care-stations"
              payload: { name: "Station Alpha", latitude: 40.0, longitude: -75.0, primary_wait_days: 10, specialty_wait_days: 15, service_codes: ["PT_EVAL"] }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
          trigger:
            - call: "POST /community-care/veterans"
              payload: { full_name: "V BadPG", home_station_id: "${st_id}", priority_group: 9, home_latitude: 41.0, home_longitude: -74.5 }
              as: EligibilityClerk
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST (priority_group 9 violates 1..8)"

      - name: assessment_supersede_marks_prior_and_bumps_veteran_version
        claim_type: computed_fields
        grounds:
          - "entities.EligibilityAssessment.fields.status"
          - "state_machines.EligibilityAssessment.CURRENT_to_SUPERSEDED"
        distinguishing_aspect: "A second assessment for the same (veteran, service_code) flips the first to SUPERSEDED and increments veteran.version by exactly 1; the new one is CURRENT."
        test_recipe:
          setup: ["station + veteran (version 1) exist"]
          setup_api_calls:
            - call: "POST /community-care/care-stations"
              payload: { name: "Station Alpha", latitude: 40.0, longitude: -75.0, primary_wait_days: 10, specialty_wait_days: 15, service_codes: ["PT_EVAL"] }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
            - call: "POST /community-care/veterans"
              payload: { full_name: "V Sup", home_station_id: "${st_id}", priority_group: 5, home_latitude: 40.2609, home_longitude: -75.0 }
              as: EligibilityClerk
              captures: { v_id: $.data.id, v_v1: $.data.version }
            - call: "POST /community-care/veterans/${v_id}/eligibility-assessments"
              payload: { service_code: "PT_EVAL", service_category: "PRIMARY_CARE", geo_classification: "URBAN", choice_requested: false, expected_veteran_version: "${v_v1}" }
              as: EligibilityClerk
              captures: { a1: $.data.id }
            - call: "GET /community-care/veterans/${v_id}"
              as: EligibilityClerk
              captures: { v_v2: $.data.version }
          trigger:
            - call: "POST /community-care/veterans/${v_id}/eligibility-assessments"
              payload: { service_code: "PT_EVAL", service_category: "SPECIALTY_CARE", geo_classification: "RURAL", choice_requested: true, expected_veteran_version: "${v_v2}" }
              as: EligibilityClerk
              captures: { a2: $.data.id }
            - call: "GET /community-care/veterans/${v_id}/eligibility-assessments"
              as: EligibilityClerk
          assert:
            - "assessment ${a1}.status == SUPERSEDED; assessment ${a2}.status == CURRENT"
            - "Veteran.${v_id}.version advanced exactly once per assessment (1 -> 2 -> 3)"
            - "list for ${v_id} returns 2 entries, one CURRENT and one SUPERSEDED"

      - name: referral_derived_fields_computed_at_creation
        claim_type: computed_fields
        grounds:
          - "entities.ReferralAuthorization.fields.tpa_id"
          - "entities.ReferralAuthorization.fields.scheduling_responsibility"
          - "entities.ReferralAuthorization.fields.end_date_exclusive"
        distinguishing_aspect: "tpa_id, scheduling_responsibility and end_date_exclusive are server-derived (from provider and start_date+duration_days), never taken from the request body."
        test_recipe:
          setup: ["credentialed TPA-scheduled provider; URBAN drive-failed eligible veteran with CURRENT assessment"]
          setup_api_calls:
            - call: "POST /community-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /community-care/care-stations"
              payload: { name: "Station Alpha", latitude: 40.0, longitude: -75.0, primary_wait_days: 10, specialty_wait_days: 10, service_codes: ["PT_EVAL"] }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
            - call: "POST /community-care/tpas"
              payload: { name: "TPA One", region_code: "R1" }
              as: PlatformAdmin
              captures: { tpa_id: $.data.id }
            - call: "POST /community-care/tpas/${tpa_id}/providers"
              payload: { name: "Prov One", service_codes: ["PT_EVAL"], contract_scheduling: "TPA", latitude: 40.1, longitude: -75.1 }
              as: TPAAdministrator
              as_user_id: "${tpa_id}"
              captures: { p_id: $.data.id }
            - call: "POST /community-care/providers/${p_id}/credential-decision"
              payload: { target_status: "CREDENTIALED" }
              as: NetworkManager
            - call: "POST /community-care/veterans"
              payload: { full_name: "V One", home_station_id: "${st_id}", priority_group: 5, home_latitude: 40.2609, home_longitude: -75.0 }
              as: EligibilityClerk
              captures: { v_id: $.data.id, v_v: $.data.version }
            - call: "POST /community-care/veterans/${v_id}/eligibility-assessments"
              payload: { service_code: "PT_EVAL", service_category: "PRIMARY_CARE", geo_classification: "URBAN", choice_requested: false, expected_veteran_version: "${v_v}" }
              as: EligibilityClerk
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /community-care/referral-authorizations"
              payload: { veteran_id: "${v_id}", assessment_id: "${a_id}", provider_id: "${p_id}", service_code: "PT_EVAL", authorized_visits: 4, duration_days: 30, start_date: "2026-09-05" }
              as: CareCoordinator
              captures: { ra_id: $.data.id, ra_tpa: $.data.tpa_id, ra_sched: $.data.scheduling_responsibility, ra_end: $.data.end_date_exclusive, ra_status: $.data.status }
          assert:
            - "ReferralAuthorization.tpa_id == ${tpa_id} (derived from provider, not input)"
            - "scheduling_responsibility == TPA (provider.contract_scheduling)"
            - "end_date_exclusive == 2025-10-05 is wrong; correct value: 2026-10-05 (2026-09-05 + 30 days, half-open)"
            - "status == PENDING_REVIEW; remaining_visits == 4; reserved_visits == 0; completed_visits == 0; extended_visits == 0"

      - name: claim_billed_total_computed_from_lines
        claim_type: computed_fields
        grounds:
          - "entities.Claim.fields.billed_total_cents"
        distinguishing_aspect: "billed_total_cents is computed as sum(unit_billed_cents * units) over service_lines on creation: 2x9000 + 3x100 = 18300."
        test_recipe:
          setup: ["full episode fixture with one COMPLETED appointment on 2026-09-06"]
          setup_api_calls:
            - call: "POST /community-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /community-care/care-stations"
              payload: { name: "Station Alpha", latitude: 40.0, longitude: -75.0, primary_wait_days: 10, specialty_wait_days: 10, service_codes: ["PT_EVAL"] }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
            - call: "POST /community-care/tpas"
              payload: { name: "TPA One", region_code: "R1" }
              as: PlatformAdmin
              captures: { tpa_id: $.data.id }
            - call: "POST /community-care/tpas/${tpa_id}/providers"
              payload: { name: "Prov One", service_codes: ["PT_EVAL"], contract_scheduling: "TPA", latitude: 40.1, longitude: -75.1 }
              as: TPAAdministrator
              as_user_id: "${tpa_id}"
              captures: { p_id: $.data.id }
            - call: "POST /community-care/providers/${p_id}/credential-decision"
              payload: { target_status: "CREDENTIALED" }
              as: NetworkManager
            - call: "POST /community-care/veterans"
              payload: { full_name: "V One", home_station_id: "${st_id}", priority_group: 5, home_latitude: 40.2609, home_longitude: -75.0 }
              as: EligibilityClerk
              captures: { v_id: $.data.id, v_v: $.data.version }
            - call: "POST /community-care/veterans/${v_id}/eligibility-assessments"
              payload: { service_code: "PT_EVAL", service_category: "PRIMARY_CARE", geo_classification: "URBAN", choice_requested: false, expected_veteran_version: "${v_v}" }
              as: EligibilityClerk
              captures: { a_id: $.data.id }
            - call: "POST /community-care/referral-authorizations"
              payload: { veteran_id: "${v_id}", assessment_id: "${a_id}", provider_id: "${p_id}", service_code: "PT_EVAL", authorized_visits: 2, duration_days: 60, start_date: "2026-09-05" }
              as: CareCoordinator
              captures: { ra_id: $.data.id }
            - call: "POST /community-care/referral-authorizations/${ra_id}/authorize"
              as: CareCoordinator
            - call: "POST /community-care/referral-authorizations/${ra_id}/appointments"
              payload: { scheduled_start: "2026-09-06T10:00:00Z", requested_date: "2026-09-02" }
              as: TPAAdministrator
              as_user_id: "${tpa_id}"
              captures: { ap_id: $.data.id }
            - call: "POST /community-care/appointments/${ap_id}/complete"
              as: ProviderRep
              as_user_id: "${p_id}"
          trigger:
            - call: "POST /community-care/claims"
              payload: { referral_authorization_id: "${ra_id}", service_date: "2026-09-06", service_lines: [{ service_code: "PT_EVAL", service_category: "SPECIALTY_CARE", units: 2, unit_billed_cents: 9000 }, { service_code: "GEN1", service_category: "PRIMARY_CARE", units: 3, unit_billed_cents: 100 }] }
              as: ProviderRep
              as_user_id: "${p_id}"
              captures: { cl_id: $.data.id, billed: $.data.billed_total_cents }
          assert:
            - "Claim.${cl_id}.billed_total_cents == 18300 (2*9000 + 3*100) — computed server-side at creation"
            - "status == RECEIVED; resubmit_count == 0; paid_amount_cents is null before adjudication"

      - name: tpa_not_found_returns_404
        claim_type: not_found
        grounds:
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET with a well-formed but non-existent TPA id returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /community-care/tpas/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: CareCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "404 with error_id == ERR_NOT_FOUND"

  - section: state_machines
    instances:
      - name: referral_authorize_valid_transition_sets_authorized_at
        claim_type: valid_transition
        grounds:
          - "state_machines.ReferralAuthorization.PENDING_REVIEW_to_AUTHORIZED"
        distinguishing_aspect: "authorize moves PENDING_REVIEW -> AUTHORIZED, stamps authorized_at from the logical clock, and increments version by 1."
        test_recipe:
          setup: ["PENDING_REVIEW authorization fixture (no appointments)"]
          setup_api_calls:
            - call: "POST /community-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /community-care/care-stations"
              payload: { name: "Station Alpha", latitude: 40.0, longitude: -75.0, primary_wait_days: 10, specialty_wait_days: 10, service_codes: ["PT_EVAL"] }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
            - call: "POST /community-care/tpas"
              payload: { name: "TPA One", region_code: "R1" }
              as: PlatformAdmin
              captures: { tpa_id: $.data.id }
            - call: "POST /community-care/tpas/${tpa_id}/providers"
              payload: { name: "Prov One", service_codes: ["PT_EVAL"], contract_scheduling: "TPA", latitude: 40.1, longitude: -75.1 }
              as: TPAAdministrator
              as_user_id: "${tpa_id}"
              captures: { p_id: $.data.id }
            - call: "POST /community-care/providers/${p_id}/credential-decision"
              payload: { target_status: "CREDENTIALED" }
              as: NetworkManager
            - call: "POST /community-care/veterans"
              payload: { full_name: "V One", home_station_id: "${st_id}", priority_group: 5, home_latitude: 40.2609, home_longitude: -75.0 }
              as: EligibilityClerk
              captures: { v_id: $.data.id, v_v: $.data.version }
            - call: "POST /community-care/veterans/${v_id}/eligibility-assessments"
              payload: { service_code: "PT_EVAL", service_category: "PRIMARY_CARE", geo_classification: "URBAN", choice_requested: false, expected_veteran_version: "${v_v}" }
              as: EligibilityClerk
              captures: { a_id: $.data.id }
            - call: "POST /community-care/referral-authorizations"
              payload: { veteran_id: "${v_id}", assessment_id: "${a_id}", provider_id: "${p_id}", service_code: "PT_EVAL", authorized_visits: 2, duration_days: 60, start_date: "2026-09-05" }
              as: CareCoordinator
              captures: { ra_id: $.data.id, ra_v1: $.data.version }
          trigger:
            - call: "POST /community-care/referral-authorizations/${ra_id}/authorize"
              as: CareCoordinator
              captures: { st2: $.data.status, at: $.data.authorized_at, v2: $.data.version }
          assert:
            - "status == AUTHORIZED; authorized_at == 2026-09-01T00:00:00Z (logical clock at authorize time)"
            - "version == ${ra_v1} + 1 (exactly one increment)"

      - name: referral_authorize_from_authorized_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - "state_machines.ReferralAuthorization"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "authorize is not idempotent: a second authorize on an AUTHORIZED referral fails with ERR_INVALID_STATE and changes nothing."
        test_recipe:
          setup: ["AUTHORIZED authorization fixture"]
          setup_api_calls:
            - call: "POST /community-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /community-care/care-stations"
              payload: { name: "Station Alpha", latitude: 40.0, longitude: -75.0, primary_wait_days: 10, specialty_wait_days: 10, service_codes: ["PT_EVAL"] }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
            - call: "POST /community-care/tpas"
              payload: { name: "TPA One", region_code: "R1" }
              as: PlatformAdmin
              captures: { tpa_id: $.data.id }
            - call: "POST /community-care/tpas/${tpa_id}/providers"
              payload: { name: "Prov One", service_codes: ["PT_EVAL"], contract_scheduling: "TPA", latitude: 40.1, longitude: -75.1 }
              as: TPAAdministrator
              as_user_id: "${tpa_id}"
              captures: { p_id: $.data.id }
            - call: "POST /community-care/providers/${p_id}/credential-decision"
              payload: { target_status: "CREDENTIALED" }
              as: NetworkManager
            - call: "POST /community-care/veterans"
              payload: { full_name: "V One", home_station_id: "${st_id}", priority_group: 5, home_latitude: 40.2609, home_longitude: -75.0 }
              as: EligibilityClerk
              captures: { v_id: $.data.id, v_v: $.data.version }
            - call: "POST /community-care/veterans/${v_id}/eligibility-assessments"
              payload: { service_code: "PT_EVAL", service_category: "PRIMARY_CARE", geo_classification: "URBAN", choice_requested: false, expected_veteran_version: "${v_v}" }
              as: EligibilityClerk
              captures: { a_id: $.data.id }
            - call: "POST /community-care/referral-authorizations"
              payload: { veteran_id: "${v_id}", assessment_id: "${a_id}", provider_id: "${p_id}", service_code: "PT_EVAL", authorized_visits: 2, duration_days: 60, start_date: "2026-09-05" }
              as: CareCoordinator
              captures: { ra_id: $.data.id }
            - call: "POST /community-care/referral-authorizations/${ra_id}/authorize"
              as: CareCoordinator
          trigger:
            - call: "POST /community-care/referral-authorizations/${ra_id}/authorize"
              as: CareCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (409); status stays AUTHORIZED"

      - name: episode_overlap_rejected_but_adjacency_allowed
        claim_type: side_effect_execution
        grounds:
          - "validations[priority=8]"
          - "errors[ERR_EPISODE_OVERLAP]"
          - "calculations.episode_window"
        distinguishing_aspect: "Episode windows are half-open: a second same-veteran+service_code authorization starting exactly at the first's end_date_exclusive is accepted, while one starting a day earlier collides with ERR_EPISODE_OVERLAP."
        test_recipe:
          setup: ["eligible veteran with CURRENT assessment; first authorization on [2026-09-05, 2026-10-05) exists (PENDING_REVIEW counts as non-terminal)"]
          setup_api_calls:
            - call: "POST /community-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /community-care/care-stations"
              payload: { name: "Station Alpha", latitude: 40.0, longitude: -75.0, primary_wait_days: 10, specialty_wait_days: 10, service_codes: ["PT_EVAL"] }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
            - call: "POST /community-care/tpas"
              payload: { name: "TPA One", region_code: "R1" }
              as: PlatformAdmin
              captures: { tpa_id: $.data.id }
            - call: "POST /community-care/tpas/${tpa_id}/providers"
              payload: { name: "Prov One", service_codes: ["PT_EVAL"], contract_scheduling: "TPA", latitude: 40.1, longitude: -75.1 }
              as: TPAAdministrator
              as_user_id: "${tpa_id}"
              captures: { p_id: $.data.id }
            - call: "POST /community-care/providers/${p_id}/credential-decision"
              payload: { target_status: "CREDENTIALED" }
              as: NetworkManager
            - call: "POST /community-care/veterans"
              payload: { full_name: "V One", home_station_id: "${st_id}", priority_group: 5, home_latitude: 40.2609, home_longitude: -75.0 }
              as: EligibilityClerk
              captures: { v_id: $.data.id, v_v: $.data.version }
            - call: "POST /community-care/veterans/${v_id}/eligibility-assessments"
              payload: { service_code: "PT_EVAL", service_category: "PRIMARY_CARE", geo_classification: "URBAN", choice_requested: false, expected_veteran_version: "${v_v}" }
              as: EligibilityClerk
              captures: { a_id: $.data.id }
            - call: "POST /community-care/referral-authorizations"
              payload: { veteran_id: "${v_id}", assessment_id: "${a_id}", provider_id: "${p_id}", service_code: "PT_EVAL", authorized_visits: 2, duration_days: 30, start_date: "2026-09-05" }
              as: CareCoordinator
              captures: { ra1: $.data.id }
          trigger:
            - call: "POST /community-care/referral-authorizations"
              payload: { veteran_id: "${v_id}", assessment_id: "${a_id}", provider_id: "${p_id}", service_code: "PT_EVAL", authorized_visits: 2, duration_days: 30, start_date: "2026-10-04" }
              as: CareCoordinator
              captures: { err: $.data.error_id }
            - call: "POST /community-care/referral-authorizations"
              payload: { veteran_id: "${v_id}", assessment_id: "${a_id}", provider_id: "${p_id}", service_code: "PT_EVAL", authorized_visits: 2, duration_days: 30, start_date: "2026-10-05" }
              as: CareCoordinator
              captures: { ra2: $.data.id, ra2_status: $.data.status }
          assert:
            - "start 2026-10-04 (one day before end_date_exclusive) -> error_id == ERR_EPISODE_OVERLAP"
            - "start 2026-10-05 (exactly end_date_exclusive) -> 201, status == PENDING_REVIEW (half-open adjacency is not overlap)"

      - name: claim_adjudicate_from_paid_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - "state_machines.Claim"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "A PAID claim cannot be adjudicated again; the second adjudicate fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["claim adjudicated PAID"]
          setup_api_calls:
            - call: "POST /community-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /community-care/care-stations"
              payload: { name: "Station Alpha", latitude: 40.0, longitude: -75.0, primary_wait_days: 10, specialty_wait_days: 10, service_codes: ["PT_EVAL"] }
