            - { call: "POST /api/expenditures/${e}/post", payload: {}, as: GrantsAccountant }
            - { call: "GET /api/awards/${aw}", as: GrantsAccountant, captures: { v: $.data.version } }
            - { call: "POST /api/drawdown-requests", payload: { award_id: "${aw}", amount_cents: 150000, expected_award_version: "${v}" }, as: GrantsAccountant, captures: { d: $.data.id } }
            - { call: "POST /api/drawdown-requests/${d}/submit", payload: {}, as: GrantsAccountant }
            - { call: "POST /api/drawdown-requests/${d}/settle", payload: {}, as: SponsorOfficial }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2027-01-01T00:00:00Z" }, as: SystemAdmin }
