            - "${st} == REJECTED and ${ver_after} == ${rej_ver}"
            - "GET /recommerce/credit-grants?trade_in_id=${ti_id} returns total_count 0 and GET /recommerce/resale-units?trade_in_id=${ti_id} returns total_count 0"

      - name: appeal_regrade_needs_a_second_authenticator_then_exhausts_the_appeal_limit
        claim_type: precondition_enforcement
        grounds:
          - state_machines.TradeIn.transitions[APPEALED -> AUTHENTICATED]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - errors[ERR_APPEAL_LIMIT_EXCEEDED]
          - global_constants.APPEAL_LIMIT
        distinguishing_aspect: "The re-grade leg refuses the original grader with ERR_SEGREGATION_OF_DUTIES (409), accepts a different Authenticator who overwrites assessed_grade and graded_by_user_id without recomputing appraised_credit_minor, and a second appeal is then refused with ERR_APPEAL_LIMIT_EXCEEDED because appeal_count has reached APPEAL_LIMIT 1."
        test_recipe:
          setup:
            - "ACTIVE FOOTWEAR GradePolicies for grade A and grade B so both grades are priceable."
            - "Ava's MAIL_IN FOOTWEAR trade-in declared A, received, then graded A by auth-001 and appealed by Ava."
          setup_api_calls:
            - call: "POST /recommerce/grade-policies"
              payload: { product_category: "FOOTWEAR", condition_grade: "A", base_credit_pct_bp: 3500, resale_price_pct_bp: 6500, refurb_budget_cap_pct_bp: 2500, restock_fee_pct_bp: 1200, warranty_days: 30 }
              as: ProgramAdmin
              as_user_id: "admin-001"
            - call: "POST /recommerce/grade-policies"
              payload: { product_category: "FOOTWEAR", condition_grade: "B", base_credit_pct_bp: 2400, resale_price_pct_bp: 4800, refurb_budget_cap_pct_bp: 2500, restock_fee_pct_bp: 1200, warranty_days: 30 }
              as: ProgramAdmin
              as_user_id: "admin-001"
            - call: "POST /recommerce/credit-policies"
              payload: { code: "CORE-2026", expiry_days: 180, mail_in_bonus_pct_bp: 1000, max_redemption_pct_bp: 5000, min_cash_remainder_minor: 500, eligible_assortment: "BOTH" }
              as: ProgramAdmin
              as_user_id: "admin-001"
            - call: "POST /recommerce/store-locations"
              payload: { code: "ST-01", region_code: "US-CA" }
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { store_id: "$.data.id" }
            - call: "POST /recommerce/customers"
              payload: { email: "ava@example.com", full_name: "Ava Reyes", loyalty_tier: "PLUS" }
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { cust_id: "$.data.id" }
            - call: "POST /recommerce/trade-ins"
              payload: { customer_id: "${cust_id}", store_location_id: "${store_id}", channel: "MAIL_IN", product_category: "FOOTWEAR", declared_grade: "A", msrp_minor: 120000, item_mass_grams: 900 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ti_id: "$.data.id", quote: "$.data.appraised_credit_minor" }
            - call: "POST /recommerce/trade-ins/${ti_id}/receive"
              payload: {}
              as: IntakeAgent
              as_user_id: "intake-001"
            - call: "POST /recommerce/trade-ins/${ti_id}/authenticate"
              payload: { authenticity_result: "GENUINE", assessed_grade: "A" }
              as: Authenticator
              as_user_id: "auth-001"
              captures: { grader1: "$.data.graded_by_user_id" }
            - call: "POST /recommerce/trade-ins/${ti_id}/appeal"
              payload: { appeal_reason: "the sole wear is cosmetic only" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { st_appealed: "$.data.status", appeals1: "$.data.appeal_count", ver_appealed: "$.data.version" }
          trigger:
            - call: "POST /recommerce/trade-ins/${ti_id}/authenticate"
