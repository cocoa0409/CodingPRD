  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: volume_tier_boundary_exactly_500000_applies
        claim_type: constants_applied
        grounds:
          - calculations.bid_price_detailed
        distinguishing_aspect: "The 500bp volume discount applies iff gross materials >= 500000 (inclusive): gross exactly 500000 (250 x 2000 reuse units) prices at 637560 while gross 498000 (249 units) prices at 667920 — the boundary unit of stock flips the tier (and the cheaper-gross bid is not the cheaper price)."
        test_recipe:
          setup:
            - "Shop standard rates; client; package; StockItem LUMBER_4X8 grade B qty 600 replacement 5000 (reuse unit 2000)"
            - "Two takeoffs (labor 1h each): T1 one STOCK line qty 250 (gross 500000); T2 one STOCK line qty 249 (gross 498000)"
          setup_api_calls:
            - call: "POST /scenic/shops"
              payload: { name: "Metro Scenic", weekly_crew_hours_capacity: 100, horizon_weeks: 4, bay_count: 2, truck_fleet_size: 6, labor_rate_cents_per_hour: 8000, overtime_multiplier_bp: 15000, overhead_pct_bp: 1000, margin_pct_bp: 2000 }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /scenic/clients"
              payload: { shop_id: "${shop_id}", company_name: "Northlight Productions", contact_email: "pm@northlight.example", credit_limit_cents: 100000000 }
              as: ShopAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /scenic/design-packages"
              payload: { client_id: "${cl_id}", show_title: "Hamlet", venue: "Lyric Theatre", load_in_at: "2026-09-26T00:00:00Z", strike_at: "2026-10-10T00:00:00Z" }
              as: ClientPM
              as_user_id: "${cl_id}"
              captures: { pkg_id: $.data.id }
            - call: "POST /scenic/stock-items"
              payload: { shop_id: "${shop_id}", material_code: "LUMBER_4X8", condition_grade: "B", quantity_on_hand: 600, replacement_cost_cents: 5000 }
              as: ShopAdmin
              captures: { si_id: $.data.id }
            - call: "POST /scenic/takeoffs"
              payload: { design_package_id: "${pkg_id}", labor_hours_est: 1 }
              as: Estimator
              captures: { to_1: $.data.id, to_1_v: $.data.version }
            - call: "POST /scenic/takeoff-lines"
              payload: { takeoff_id: "${to_1}", expected_takeoff_version: "${to_1_v}", material_code: "LUMBER_4X8", quantity: 250, source: "STOCK", stock_item_id: "${si_id}" }
              as: Estimator
            - call: "POST /scenic/takeoffs"
              payload: { design_package_id: "${pkg_id}", labor_hours_est: 1 }
              as: Estimator
              captures: { to_2: $.data.id, to_2_v: $.data.version }
            - call: "POST /scenic/takeoff-lines"
              payload: { takeoff_id: "${to_2}", expected_takeoff_version: "${to_2_v}", material_code: "LUMBER_4X8", quantity: 249, source: "STOCK", stock_item_id: "${si_id}" }
              as: Estimator
          trigger:
            - call: "POST /scenic/bids"
              payload: { client_id: "${cl_id}", design_package_id: "${pkg_id}", pricing_variant: "DETAILED", takeoff_id: "${to_1}", has_automation_scope: false, bays_required: 1, build_start_at: "2026-09-01T00:00:00Z", validity_days: 30 }
              as: Estimator
              captures: { bid_1: $.data.id }
            - call: "POST /scenic/bids"
              payload: { client_id: "${cl_id}", design_package_id: "${pkg_id}", pricing_variant: "DETAILED", takeoff_id: "${to_2}", has_automation_scope: false, bays_required: 1, build_start_at: "2026-09-01T00:00:00Z", validity_days: 30 }
              as: Estimator
              captures: { bid_2: $.data.id }
          assert:
            - "Bid.${bid_1}.price_cents == 637560   # tier applies at exactly 500000: materials 475000 + labor 8000 = 483000; overhead 48300; margin round_half_up(531300 x 0.2)=106260; 483000+48300+106260"
            - "Bid.${bid_2}.price_cents == 667920   # no tier below 500000: materials 498000 + labor 8000 = 506000; overhead 50600; margin round_half_up(556600 x 0.2)=111320; 506000+50600+111320"
            - "the two bids differ exactly by the tier treatment of one boundary unit"

      - name: posture_input_set_excludes_built_productions
        claim_type: input_set_filtering
        grounds:
          - calculations.capacity_posture
        distinguishing_aspect: "capacity_posture sums only productions in {SCHEDULED, IN_BUILD, ON_HOLD}: the moment the production reaches BUILT its 100 hours drop out of Shop.committed_crew_hours (100 -> 0, posture back to OPEN) even though the show is far from closed."
