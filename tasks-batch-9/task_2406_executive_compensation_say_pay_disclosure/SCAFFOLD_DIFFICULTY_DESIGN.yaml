  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: program_vote_dimension_advances_while_design_dimension_holds
        grounds:
          - state_machines.PayProgram
          - entities.PayProgram.fields.design_status
          - entities.PayProgram.fields.vote_status
          - entities.PayProgram.fields.enhanced_engagement_required
          - calculations.say_on_pay_support
          - calculations.outreach_coverage
          - validations[priority=18]
          - errors[ERR_VOTE_NOT_FAILED]
        distinguishing_aspect: |
          PayProgram carries two INDEPENDENT state dimensions: vote_status walks NOT_VOTED -> FAILED -> REMEDIATED
          while design_status stays pinned at DISCLOSED throughout the failure, and only the remediation step
          moves design_status to CLOSED — so the combined state (DISCLOSED, FAILED) is reachable and a remediation
          attempted before the vote dimension reaches FAILED is rejected with ERR_VOTE_NOT_FAILED.
        test_recipe:
          setup:
            - "MINI fixture with an APPROVED one-peer group; PayProgram P1 COMMITTEE_APPROVED with two ANNUAL_INCENTIVE metrics."
            - "An ISS ProxyAdvisorScreen in SCREENED so the CD&A can be legally cleared."
