# =============================================================================
# task_0534_traffic_enforcement — §1.8 Scaffold Difficulty Design
# Test Targeting Index — cross-references §1.1–§1.7 against the nine §0.5 rules.
# Standard program config used by recipes unless noted:
#   base_red_light_fine_cents=10000, base_speed_fine_cents=8000,
#   admin_fee_cents=2500, late_fee_cents=4000, response_window_days=30,
#   repeat_offender_window_days=365, repeat_offender_surcharge_pct=0.5
# Logical clock startup default: 2026-05-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: statutory_vs_adjudicated_fine_on_citation
        grounds:
          - calculations.fine_schedule_statutory
          - calculations.fine_schedule_adjudicated
          - state_machines.Citation.HEARING_SCHEDULED_to_ADJUDICATED_UPHELD
          - entities.Citation.fields.adjudicated_amount_cents
        distinguishing_aspect: |
          On the SAME citation, the statutory variant yields assessed_amount_cents=12500 while
          the adjudicated-REDUCED variant yields adjudicated_amount_cents=6500 (reduced fine 4000 + admin 2500),
          discarding the statutory fine — same entity, two divergent numbers.
        test_recipe:
          setup:
            - "Program with standard config; RED_LIGHT camera ACTIVE with PASS calibration covering event time."
            - "RegisteredOwner registered for the captured plate; citation reviewed to CITED (assessed=12500)."
            - "Owner contests; ProgramAdmin schedules a hearing with a different adjudicator; clock advanced to hearing time."
          setup_api_calls:
            - call: "POST /programs"
              payload: { jurisdiction_name: "Metro", base_red_light_fine_cents: 10000, base_speed_fine_cents: 8000, admin_fee_cents: 2500, late_fee_cents: 4000, response_window_days: 30, repeat_offender_window_days: 365, repeat_offender_surcharge_pct: 0.5 }
              as: SystemAdmin
              captures: { pid: $.data.id }
            - call: "POST /cameras"
              payload: { program_id: "${pid}", intersection_code: "INT-1", camera_type: "RED_LIGHT" }
              as: ProgramAdmin
              captures: { cam: $.data.id }
            - call: "POST /cameras/${cam}/calibrations"
              payload: { performed_at_utc: "2026-04-01T00:00:00Z", valid_until_utc: "2026-12-01T00:00:00Z", technician_ref: "T1", result: "PASS" }
              as: ProgramAdmin
            - call: "POST /owners"
              payload: { program_id: "${pid}", plate_number: "ABC123", full_name: "Pat Owner", mailing_address: "1 St" }
              as: ProgramAdmin
              captures: { owner: $.data.id, pin: $.data.portal_access_pin }
            - call: "POST /citations"
              payload: { program_id: "${pid}", camera_id: "${cam}", captured_plate_number: "ABC123", event_at_utc: "2026-05-01T08:00:00Z" }
              as: ReviewOfficer
              as_user_id: "ro-1"
              captures: { cit: $.data.id }
            - call: "POST /citations/${cit}/review"
              payload: { decision: "APPROVE" }
              as: ReviewOfficer
              as_user_id: "ro-1"
              captures: { cit_v: $.data.version }
            - call: "POST /citations/${cit}/contests"
              payload: { registered_owner_id: "${owner}", portal_access_pin: "${pin}", ground: "PLATE_MISREAD", statement: "not me", expected_citation_version: "${cit_v}" }
              as: RegisteredOwner
              as_user_id: "${owner}"
              captures: { contest: $.data.id }
            - call: "POST /contests/${contest}/hearings"
              payload: { scheduled_at_utc: "2026-05-15T10:00:00Z", adjudicator_ref: "adj-9" }
              as: ProgramAdmin
              captures: { hearing: $.data.id, hearing_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-15T11:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /hearings/${hearing}/rule"
              payload: { outcome: "REDUCED", reduced_amount_cents: 4000, expected_hearing_version: "${hearing_v}" }
              as: Adjudicator
              as_user_id: "adj-9"
          assert:
            - "Citation.${cit}.assessed_amount_cents == 12500"
            - "Citation.${cit}.adjudicated_amount_cents == 6500"
            - "Citation.${cit}.status == ADJUDICATED_UPHELD"

      - name: vendor_share_vs_owner_owed_on_payment
        grounds:
          - calculations.vendor_revenue_share
          - calculations.amount_owed_total
          - state_machines.Citation.CITED_to_PAID
          - entities.VendorContract.fields.accrued_vendor_share_cents
        distinguishing_aspect: |
          On PAID, the owner-owed calculation (amount_owed_total) yields 12500 for the owner while the
          vendor-revenue-share calculation on the VendorContract yields 3000 (30% of the 10000 fine portion,
          admin fee excluded) — two distinct algorithms on two different entity domains (Citation vs VendorContract).
        test_recipe:
          setup:
            - "Program standard config; ACTIVE VendorContract with revenue_share_pct=0.3, no cap."
            - "RED_LIGHT citation CITED at assessed=12500; owner pays 12500 in full and it clears."
          setup_api_calls:
            - call: "POST /programs"
              payload: { jurisdiction_name: "Metro", base_red_light_fine_cents: 10000, base_speed_fine_cents: 8000, admin_fee_cents: 2500, late_fee_cents: 4000, response_window_days: 30, repeat_offender_window_days: 365, repeat_offender_surcharge_pct: 0.5 }
              as: SystemAdmin
              captures: { pid: $.data.id }
            - call: "POST /vendor-contracts"
              payload: { program_id: "${pid}", vendor_name: "CamCo", revenue_share_pct: 0.3 }
              as: ProgramAdmin
              captures: { vc: $.data.id }
            - call: "POST /cameras"
              payload: { program_id: "${pid}", intersection_code: "INT-1", camera_type: "RED_LIGHT" }
              as: ProgramAdmin
              captures: { cam: $.data.id }
            - call: "POST /cameras/${cam}/calibrations"
              payload: { performed_at_utc: "2026-04-01T00:00:00Z", valid_until_utc: "2026-12-01T00:00:00Z", technician_ref: "T1", result: "PASS" }
              as: ProgramAdmin
            - call: "POST /owners"
              payload: { program_id: "${pid}", plate_number: "ABC123", full_name: "Pat Owner", mailing_address: "1 St" }
              as: ProgramAdmin
              captures: { owner: $.data.id }
            - call: "POST /citations"
              payload: { program_id: "${pid}", camera_id: "${cam}", captured_plate_number: "ABC123", event_at_utc: "2026-05-01T08:00:00Z" }
              as: ReviewOfficer
              as_user_id: "ro-1"
              captures: { cit: $.data.id }
            - call: "POST /citations/${cit}/review"
              payload: { decision: "APPROVE" }
              as: ReviewOfficer
              as_user_id: "ro-1"
            - call: "POST /citations/${cit}/payments"
              payload: { amount_cents: 12500, method: "CARD" }
              as: ProgramAdmin
              captures: { pay: $.data.id }
          trigger:
            - call: "POST /_payments/settle"
              payload: { payment_id: "${pay}", outcome: "CLEARED" }
              as: SystemAdmin
          assert:
            - "Citation.${cit}.status == PAID"
            - "Citation.${cit}.amount_paid_cents == 12500"
            - "VendorContract.${vc}.accrued_vendor_share_cents == 3000"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: speed_band_tiered_nonlinear_with_surcharge
        grounds:
          - calculations.fine_schedule_statutory
          - entities.Camera.fields.speed_limit_mph
          - entities.Citation.fields.measured_speed_mph
        distinguishing_aspect: |
          Mode (a): assessed depends non-linearly on ≥3 inputs — camera_type, (measured-limit) band selection
          (1.0/1.5/2.5), and repeat-offender count — with conditional branches; a SPEED citation at 55 over a 40
          limit (over=15 -> band 1.5) yields base 12000, assessed 14500 (first offense).
        test_recipe:
          setup:
            - "Program standard config; SPEED camera limit=40 ACTIVE with PASS calibration; owner registered."
          setup_api_calls:
            - call: "POST /programs"
              payload: { jurisdiction_name: "Metro", base_red_light_fine_cents: 10000, base_speed_fine_cents: 8000, admin_fee_cents: 2500, late_fee_cents: 4000, response_window_days: 30, repeat_offender_window_days: 365, repeat_offender_surcharge_pct: 0.5 }
              as: SystemAdmin
              captures: { pid: $.data.id }
            - call: "POST /cameras"
              payload: { program_id: "${pid}", intersection_code: "SPD-1", camera_type: "SPEED", speed_limit_mph: 40 }
              as: ProgramAdmin
              captures: { cam: $.data.id }
            - call: "POST /cameras/${cam}/calibrations"
              payload: { performed_at_utc: "2026-04-01T00:00:00Z", valid_until_utc: "2026-12-01T00:00:00Z", technician_ref: "T1", result: "PASS" }
              as: ProgramAdmin
            - call: "POST /owners"
              payload: { program_id: "${pid}", plate_number: "SPD999", full_name: "Lee Owner", mailing_address: "2 St" }
              as: ProgramAdmin
              captures: { owner: $.data.id }
            - call: "POST /citations"
              payload: { program_id: "${pid}", camera_id: "${cam}", captured_plate_number: "SPD999", event_at_utc: "2026-05-01T08:00:00Z", measured_speed_mph: 55 }
              as: ReviewOfficer
              as_user_id: "ro-1"
              captures: { cit: $.data.id }
          trigger:
            - call: "POST /citations/${cit}/review"
              payload: { decision: "APPROVE" }
              as: ReviewOfficer
              as_user_id: "ro-1"
          assert:
            - "Citation.${cit}.assessed_amount_cents == 14500"
            - "Citation.${cit}.status == CITED"

      - name: fine_rounding_order_band_then_surcharge
        grounds:
          - calculations.fine_schedule_statutory
          - entities.Program.fields.repeat_offender_surcharge_pct
        distinguishing_aspect: |
          Mode (b): rounding order is pinned — band multiply-and-round FIRST, then surcharge multiply-and-round,
          each independently. RED_LIGHT repeat offense: base 10000 -> surcharge round(10000*1.5)=15000 -> assessed 17500,
          proving the surcharge rounds on the post-band base, not a combined single multiply.
        test_recipe:
          setup:
            - "Program standard config; RED_LIGHT camera ACTIVE with PASS calibration; single owner with a PRIOR CITED"
            - "citation within the 365-day window, then a SECOND capture triggering the repeat surcharge."
          setup_api_calls:
            - call: "POST /programs"
              payload: { jurisdiction_name: "Metro", base_red_light_fine_cents: 10000, base_speed_fine_cents: 8000, admin_fee_cents: 2500, late_fee_cents: 4000, response_window_days: 30, repeat_offender_window_days: 365, repeat_offender_surcharge_pct: 0.5 }
              as: SystemAdmin
              captures: { pid: $.data.id }
            - call: "POST /cameras"
              payload: { program_id: "${pid}", intersection_code: "INT-1", camera_type: "RED_LIGHT" }
              as: ProgramAdmin
              captures: { cam: $.data.id }
            - call: "POST /cameras/${cam}/calibrations"
              payload: { performed_at_utc: "2026-04-01T00:00:00Z", valid_until_utc: "2026-12-01T00:00:00Z", technician_ref: "T1", result: "PASS" }
              as: ProgramAdmin
            - call: "POST /owners"
              payload: { program_id: "${pid}", plate_number: "REP111", full_name: "Rex Owner", mailing_address: "3 St" }
              as: ProgramAdmin
              captures: { owner: $.data.id }
            - call: "POST /citations"
              payload: { program_id: "${pid}", camera_id: "${cam}", captured_plate_number: "REP111", event_at_utc: "2026-05-01T08:00:00Z" }
              as: ReviewOfficer
              as_user_id: "ro-1"
              captures: { cit1: $.data.id }
            - call: "POST /citations/${cit1}/review"
              payload: { decision: "APPROVE" }
              as: ReviewOfficer
              as_user_id: "ro-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /citations"
              payload: { program_id: "${pid}", camera_id: "${cam}", captured_plate_number: "REP111", event_at_utc: "2026-05-02T08:00:00Z" }
              as: ReviewOfficer
              as_user_id: "ro-1"
              captures: { cit2: $.data.id }
          trigger:
            - call: "POST /citations/${cit2}/review"
              payload: { decision: "APPROVE" }
              as: ReviewOfficer
              as_user_id: "ro-1"
          assert:
            - "Citation.${cit2}.assessed_amount_cents == 17500"
            - "Citation.${cit1}.assessed_amount_cents == 12500"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: citation_branching_contest_hearing_outcomes
        grounds:
          - state_machines.Citation.CITED_to_CONTESTED
          - state_machines.Citation.HEARING_SCHEDULED_to_ADJUDICATED_DISMISSED
          - state_machines.Citation.CITED_to_VOID
        distinguishing_aspect: |
          Citation is branching fork-join: CITED forks into CONTESTED (→ hearing → UPHELD/REDUCED/DISMISSED with
          divergent side-effect sets) vs VOID, with DISMISSED zeroing adjudicated_amount_cents — divergent branches
          on one entity, not a linear pipeline.
        test_recipe:
          setup:
            - "RED_LIGHT citation CITED, contested, hearing scheduled with distinct adjudicator, clock at hearing time."
          setup_api_calls:
            - call: "POST /programs"
              payload: { jurisdiction_name: "Metro", base_red_light_fine_cents: 10000, base_speed_fine_cents: 8000, admin_fee_cents: 2500, late_fee_cents: 4000, response_window_days: 30, repeat_offender_window_days: 365, repeat_offender_surcharge_pct: 0.5 }
              as: SystemAdmin
              captures: { pid: $.data.id }
            - call: "POST /cameras"
              payload: { program_id: "${pid}", intersection_code: "INT-1", camera_type: "RED_LIGHT" }
              as: ProgramAdmin
              captures: { cam: $.data.id }
            - call: "POST /cameras/${cam}/calibrations"
              payload: { performed_at_utc: "2026-04-01T00:00:00Z", valid_until_utc: "2026-12-01T00:00:00Z", technician_ref: "T1", result: "PASS" }
              as: ProgramAdmin
            - call: "POST /owners"
              payload: { program_id: "${pid}", plate_number: "ABC123", full_name: "Pat Owner", mailing_address: "1 St" }
              as: ProgramAdmin
              captures: { owner: $.data.id, pin: $.data.portal_access_pin }
            - call: "POST /citations"
              payload: { program_id: "${pid}", camera_id: "${cam}", captured_plate_number: "ABC123", event_at_utc: "2026-05-01T08:00:00Z" }
              as: ReviewOfficer
              as_user_id: "ro-1"
              captures: { cit: $.data.id }
            - call: "POST /citations/${cit}/review"
              payload: { decision: "APPROVE" }
              as: ReviewOfficer
              as_user_id: "ro-1"
              captures: { cit_v: $.data.version }
            - call: "POST /citations/${cit}/contests"
              payload: { registered_owner_id: "${owner}", portal_access_pin: "${pin}", ground: "SIGNAL_MALFUNCTION", statement: "light was green", expected_citation_version: "${cit_v}" }
              as: RegisteredOwner
              as_user_id: "${owner}"
              captures: { contest: $.data.id }
            - call: "POST /contests/${contest}/hearings"
              payload: { scheduled_at_utc: "2026-05-15T10:00:00Z", adjudicator_ref: "adj-9" }
              as: ProgramAdmin
              captures: { hearing: $.data.id, hearing_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-15T11:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /hearings/${hearing}/rule"
              payload: { outcome: "DISMISSED", expected_hearing_version: "${hearing_v}" }
              as: Adjudicator
              as_user_id: "adj-9"
          assert:
            - "Citation.${cit}.status == ADJUDICATED_DISMISSED"
            - "Citation.${cit}.adjudicated_amount_cents == 0"
            - "Contest.${contest}.status == UPHELD"

      - name: payment_reversal_cycle_repaids_citation
        grounds:
          - state_machines.Payment.CLEARED_to_REVERSED
          - state_machines.Citation.CITED_to_PAID
          - entities.Citation.fields.status
        distinguishing_aspect: |
          Payment carries a cyclic dimension via compensation: a citation reaches PAID then a payment REVERSE
          drives it BACK to CITED (CITED→PAID→CITED loop on a different entity than Citation's own branching),
          proving non-linear (revert) shape on the Payment/Citation coupling.
        test_recipe:
          setup:
            - "RED_LIGHT citation PAID in full (12500) via a CLEARED payment; ACTIVE vendor contract 30%."
          setup_api_calls:
            - call: "POST /programs"
              payload: { jurisdiction_name: "Metro", base_red_light_fine_cents: 10000, base_speed_fine_cents: 8000, admin_fee_cents: 2500, late_fee_cents: 4000, response_window_days: 30, repeat_offender_window_days: 365, repeat_offender_surcharge_pct: 0.5 }
              as: SystemAdmin
              captures: { pid: $.data.id }
            - call: "POST /vendor-contracts"
              payload: { program_id: "${pid}", vendor_name: "CamCo", revenue_share_pct: 0.3 }
              as: ProgramAdmin
              captures: { vc: $.data.id }
            - call: "POST /cameras"
              payload: { program_id: "${pid}", intersection_code: "INT-1", camera_type: "RED_LIGHT" }
              as: ProgramAdmin
              captures: { cam: $.data.id }
            - call: "POST /cameras/${cam}/calibrations"
              payload: { performed_at_utc: "2026-04-01T00:00:00Z", valid_until_utc: "2026-12-01T00:00:00Z", technician_ref: "T1", result: "PASS" }
              as: ProgramAdmin
            - call: "POST /owners"
              payload: { program_id: "${pid}", plate_number: "ABC123", full_name: "Pat Owner", mailing_address: "1 St" }
              as: ProgramAdmin
              captures: { owner: $.data.id }
            - call: "POST /citations"
              payload: { program_id: "${pid}", camera_id: "${cam}", captured_plate_number: "ABC123", event_at_utc: "2026-05-01T08:00:00Z" }
              as: ReviewOfficer
              as_user_id: "ro-1"
              captures: { cit: $.data.id }
            - call: "POST /citations/${cit}/review"
              payload: { decision: "APPROVE" }
              as: ReviewOfficer
              as_user_id: "ro-1"
            - call: "POST /citations/${cit}/payments"
              payload: { amount_cents: 12500, method: "CARD" }
              as: ProgramAdmin
              captures: { pay: $.data.id }
            - call: "POST /_payments/settle"
              payload: { payment_id: "${pay}", outcome: "CLEARED" }
              as: SystemAdmin
          trigger:
            - call: "POST /payments/${pay}/reverse"
              payload: {}
              as: ProgramAdmin
          assert:
            - "Payment.${pay}.status == REVERSED"
            - "Citation.${cit}.status == CITED"
            - "Citation.${cit}.amount_paid_cents == 0"
            - "VendorContract.${vc}.accrued_vendor_share_cents == 0"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: void_cascades_citation_contest_hearing
        grounds:
          - state_machines.Citation.CITED_to_VOID
          - state_machines.Contest.SUBMITTED_to_WITHDRAWN
          - state_machines.Hearing.SCHEDULED_to_ADJOURNED
        distinguishing_aspect: |
          Depth-3 cascade from VOID: void the Citation (A) → its Contest is WITHDRAWN (B, caused by A) →
          because the contest is withdrawn its scheduled Hearing is ADJOURNED (C, caused by B), each link
          triggered by the prior link, originating from the void transition.
        test_recipe:
          setup:
            - "RED_LIGHT citation CITED, contested, hearing scheduled with distinct adjudicator; no cleared payment."
          setup_api_calls:
            - call: "POST /programs"
              payload: { jurisdiction_name: "Metro", base_red_light_fine_cents: 10000, base_speed_fine_cents: 8000, admin_fee_cents: 2500, late_fee_cents: 4000, response_window_days: 30, repeat_offender_window_days: 365, repeat_offender_surcharge_pct: 0.5 }
              as: SystemAdmin
              captures: { pid: $.data.id }
            - call: "POST /cameras"
              payload: { program_id: "${pid}", intersection_code: "INT-1", camera_type: "RED_LIGHT" }
              as: ProgramAdmin
              captures: { cam: $.data.id }
            - call: "POST /cameras/${cam}/calibrations"
              payload: { performed_at_utc: "2026-04-01T00:00:00Z", valid_until_utc: "2026-12-01T00:00:00Z", technician_ref: "T1", result: "PASS" }
              as: ProgramAdmin
            - call: "POST /owners"
              payload: { program_id: "${pid}", plate_number: "ABC123", full_name: "Pat Owner", mailing_address: "1 St" }
              as: ProgramAdmin
              captures: { owner: $.data.id, pin: $.data.portal_access_pin }
            - call: "POST /citations"
              payload: { program_id: "${pid}", camera_id: "${cam}", captured_plate_number: "ABC123", event_at_utc: "2026-05-01T08:00:00Z" }
              as: ReviewOfficer
              as_user_id: "ro-1"
              captures: { cit: $.data.id }
            - call: "POST /citations/${cit}/review"
              payload: { decision: "APPROVE" }
              as: ReviewOfficer
              as_user_id: "ro-1"
              captures: { cit_v: $.data.version }
            - call: "POST /citations/${cit}/contests"
              payload: { registered_owner_id: "${owner}", portal_access_pin: "${pin}", ground: "PLATE_MISREAD", statement: "not me", expected_citation_version: "${cit_v}" }
              as: RegisteredOwner
              as_user_id: "${owner}"
              captures: { contest: $.data.id }
            - call: "POST /contests/${contest}/hearings"
              payload: { scheduled_at_utc: "2026-05-15T10:00:00Z", adjudicator_ref: "adj-9" }
              as: ProgramAdmin
              captures: { hearing: $.data.id }
          trigger:
            - call: "POST /citations/${cit}/void"
              payload: {}
              as: ProgramAdmin
          assert:
            - "Citation.${cit}.status == VOID"
            - "Contest.${contest}.status == WITHDRAWN"
            - "Hearing.${hearing}.status == ADJOURNED"

      - name: reversal_cascades_citation_and_vendor_share
        grounds:
          - state_machines.Payment.CLEARED_to_REVERSED
          - state_machines.Citation.CITED_to_PAID
          - entities.VendorContract.fields.accrued_vendor_share_cents
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (payment reverse): reversing the CLEARED Payment (A) →
          the PAID Citation reverts to CITED and amount_paid drops (B, caused by A) → the vendor share
          accrued from that citation is de-accrued on the VendorContract (also caused by A's compensation),
          originating from a distinct transition than the void cascade.
        test_recipe:
          setup:
            - "RED_LIGHT citation PAID (12500) with vendor share 3000 accrued (30% of 10000 fine portion)."
          setup_api_calls:
            - call: "POST /programs"
              payload: { jurisdiction_name: "Metro", base_red_light_fine_cents: 10000, base_speed_fine_cents: 8000, admin_fee_cents: 2500, late_fee_cents: 4000, response_window_days: 30, repeat_offender_window_days: 365, repeat_offender_surcharge_pct: 0.5 }
              as: SystemAdmin
              captures: { pid: $.data.id }
            - call: "POST /vendor-contracts"
              payload: { program_id: "${pid}", vendor_name: "CamCo", revenue_share_pct: 0.3 }
              as: ProgramAdmin
              captures: { vc: $.data.id }
            - call: "POST /cameras"
              payload: { program_id: "${pid}", intersection_code: "INT-1", camera_type: "RED_LIGHT" }
              as: ProgramAdmin
              captures: { cam: $.data.id }
            - call: "POST /cameras/${cam}/calibrations"
              payload: { performed_at_utc: "2026-04-01T00:00:00Z", valid_until_utc: "2026-12-01T00:00:00Z", technician_ref: "T1", result: "PASS" }
              as: ProgramAdmin
            - call: "POST /owners"
              payload: { program_id: "${pid}", plate_number: "ABC123", full_name: "Pat Owner", mailing_address: "1 St" }
              as: ProgramAdmin
              captures: { owner: $.data.id }
            - call: "POST /citations"
              payload: { program_id: "${pid}", camera_id: "${cam}", captured_plate_number: "ABC123", event_at_utc: "2026-05-01T08:00:00Z" }
              as: ReviewOfficer
              as_user_id: "ro-1"
              captures: { cit: $.data.id }
            - call: "POST /citations/${cit}/review"
