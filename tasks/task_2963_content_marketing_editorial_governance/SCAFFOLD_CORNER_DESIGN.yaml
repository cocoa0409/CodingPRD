      - name: expert_availability_action_toggles_status_and_bumps_version_with_no_dependents
        claim_type: Action endpoint
        grounds:
          - endpoints[POST /editorial/experts/{id}/availability]
          - state_machines.SubjectMatterExpert.transitions[AVAILABLE->ON_LEAVE]
          - state_machines.SubjectMatterExpert.transitions[ON_LEAVE->AVAILABLE]
        distinguishing_aspect: "The expert holds no briefs, so every conditional side effect of the ON_LEAVE branch is a no-op and only the two declared writes remain: the status flips and version increments on each call, reaching 3 after the round trip. committed_hours_total stays 0 across both directions, and the return to AVAILABLE restores nothing because nothing was cleared."
        test_recipe:
          setup:
            - "Clock parked at 2026-08-03T08:00:00.000Z; one expert with expertise_tags [security] and weekly_capacity_hours 40, and no briefs at all."
          setup_api_calls:
            - call: "POST /editorial/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00.000Z" }
              as: ManagingEditor
            - call: "POST /editorial/experts"
              payload: { full_name: "Dana Vo", expertise_tags: ["security"], weekly_capacity_hours: 40 }
              as: ManagingEditor
              captures: { exp_id: $.data.id, v1: $.data.version }
          trigger:
            - call: "POST /editorial/experts/${exp_id}/availability"
