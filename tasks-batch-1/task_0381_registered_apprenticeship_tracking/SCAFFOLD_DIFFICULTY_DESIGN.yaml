  - rule_id: compensating_invariant
    instances:
      - name: ratio_slot_conserved_register_then_cancel
        grounds:
          - state_machines.ApprenticeAgreement.DRAFT_to_REGISTERED
          - state_machines.ApprenticeAgreement.REGISTERED_to_CANCELLED
          - entities.ApprenticeshipProgram.fields.active_agreement_count
          - entities.Journeyworker.fields.active_apprentice_count
        distinguishing_aspect: |
          Conserved quantity = ratio-slot occupancy. Invariant: program.active_agreement_count ==
          count of agreements in {REGISTERED,ACTIVE,SUSPENDED} for the program, and equals the sum of
          journeyworker.active_apprentice_count. After register (+1) then cancel (-1) both return to 0.
        test_recipe:
          setup:
            - "ACTIVE HOURS_BASED program PROG (ratio 4), one QUALIFIED journeyworker, one DRAFT agreement AGR."
