          setup:
            - "Logical clock at 2026-08-10T14:00:00Z, inside the processing window."
            - "Club Harbor Kings (cap 500000000), player Ray Alder, and a DRAFT SIGNING filing for 3 years / base 80000000 / bonus 10000000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T14:00:00Z" }
              as: LeagueOfficer
            - call: "POST /teams"
              payload: { name: "Harbor Kings", market_code: "HKG", salary_cap_limit_cents: 500000000, waiver_priority_rank: 1 }
              as: LeagueOfficer
              captures: { vt_team_id: $.data.id, vt_team_v1: $.data.version }
            - call: "POST /players"
              payload: { full_name: "Ray Alder", position: "QB" }
              as: LeagueOfficer
              captures: { vt_p_id: $.data.id }
            - call: "POST /transactions"
              payload: { team_id: "${vt_team_id}", player_id: "${vt_p_id}", transaction_type: "SIGNING", expected_team_version: "${vt_team_v1}", years: 3, base_salary_cents: 80000000, signing_bonus_cents: 10000000, start_season_year: 2026 }
