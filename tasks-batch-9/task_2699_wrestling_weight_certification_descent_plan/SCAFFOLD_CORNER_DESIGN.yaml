        distinguishing_aspect: "Three uniqueness rules with two different scopes: credential_number is global (any second AS-1001 is refused), school_name is unique only WITHIN a season (the same school name is accepted in a second season), and (season_id, effective_date) is unique per season (a second 2026-12-01 allowance is refused while 2026-12-02 succeeds)."
