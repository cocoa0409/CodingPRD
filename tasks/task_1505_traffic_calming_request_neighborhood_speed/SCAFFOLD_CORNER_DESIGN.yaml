              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE_CYCLE_YEAR"

  # ===========================================================================
  # Section: cross_cutting_layers (OCC x2 per concurrency_rules, clock default)
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_version_on_plan_create
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[plan-create-stale-request]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "Create-plan OCC: after a first plan creation bumps the request version, a second creation carrying the previously observed expected_request_version is rejected with ERR_STALE_VERSION (412) — and would otherwise have superseded the first plan."
        test_recipe:
          setup: ["request FUNDED; client observed version v0; first plan created (request version now v0+1)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: CityAdmin }
            - call: "POST /api/segments"
              payload: { name: "OCC Ave", speed_limit_mph: 30, household_count: 4, functional_class: "LOCAL" }
              as: CityAdmin
              captures: { seg: $.data.id }
            - { call: "POST /api/residents", payload: { full_name: "R1", email: "occ-r1@x.com", street_segment_id: "${seg}", household_ref: "H1" }, as: CityAdmin, captures: { r1: $.data.id } }
            - { call: "POST /api/residents", payload: { full_name: "R2", email: "occ-r2@x.com", street_segment_id: "${seg}", household_ref: "H2" }, as: CityAdmin, captures: { r2: $.data.id } }
            - { call: "POST /api/residents", payload: { full_name: "R3", email: "occ-r3@x.com", street_segment_id: "${seg}", household_ref: "H3" }, as: CityAdmin, captures: { r3: $.data.id } }
            - call: "POST /api/requests"
              payload: { street_segment_id: "${seg}", title: "OCC plan", requested_budget_cents: 10000 }
              as: Resident
              as_user_id: "${r1}"
              captures: { req: $.data.id }
            - { call: "POST /api/requests/${req}/open-petition", payload: {}, as: TrafficEngineer }
            - { call: "POST /api/requests/${req}/petition-signatures", payload: {}, as: Resident, as_user_id: "${r1}" }
            - { call: "POST /api/requests/${req}/petition-signatures", payload: {}, as: Resident, as_user_id: "${r2}" }
            - { call: "POST /api/requests/${req}/petition-signatures", payload: {}, as: Resident, as_user_id: "${r3}" }
            - call: "POST /api/requests/${req}/speed-studies"
              payload: { study_type: "INITIAL", window_start_date: "2026-08-03", window_end_date: "2026-08-05" }
              as: TrafficEngineer
              captures: { study: $.data.id }
            - { call: "POST /api/speed-studies/${study}/observations", payload: { observation_date: "2026-08-03", vehicle_count: 3000, p85_speed_mph: 40.0, mean_speed_mph: 33.0 }, as: TrafficEngineer }
