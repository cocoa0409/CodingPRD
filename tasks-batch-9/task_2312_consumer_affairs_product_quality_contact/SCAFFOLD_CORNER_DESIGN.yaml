            - "GET /complaints?duplicate_of_complaint_id=${p1} has total_count == 2"

      - name: corner_trend_signal_scope_shape_must_match_scope_level
        claim_type: violation_to_error
        grounds: ["validations[priority 41]", "errors[ERR_SCOPE_SHAPE_INVALID]", "endpoints[POST /trend-signals]"]
        distinguishing_aspect: "All three scope levels are probed with the wrong shape — LOT missing its lot, LINE carrying a forbidden lot, PLANT carrying a forbidden line — so the rule is shown to be a two-sided requires/forbids matrix, not a null check."
