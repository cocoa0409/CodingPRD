              payload: { control_id: "${w01}", period_start: "2026-09-01T00:00:00.000Z", period_end: "2026-11-30T00:00:00.000Z", expected_control_version: "${w01_v}" }
              as: Auditor
              as_user_id: "aud-1"
              captures: { smp_w: $.data.id }
          assert:
            - "AuditSample.${smp_d}.population_size_snapshot == 100"
            - "AuditSample.${smp_d}.sample_size == 13"
            - "AuditSample.${smp_d}.allowed_deviations == 1"
            - "AuditSample.${smp_d}.zero_population == false"
            - "AuditSample.${smp_d}.status == DRAWN"
            - "AuditSample.${smp_w}.population_size_snapshot == 4"
            - "AuditSample.${smp_w}.sample_size == 4"
            - "AuditSample.${smp_w}.allowed_deviations == 0"
            - "AuditSample.${smp_w}.status == DRAWN"

      - name: readiness_score_per_category_round_then_average_order
        grounds:
          - calculations.readiness_score
          - calculations.criteria_coverage
          - entities.Engagement.fields.readiness_score
          - entities.Engagement.fields.criteria_coverage_pct_readiness
          - entities.Engagement.fields.required_criteria_categories
        distinguishing_aspect: |
          MODE (b): the pinned order is round each category to 2dp FIRST, then average — SECURITY
