            - "VerificationSession.${s1_id}.risk_score == 40 and VerificationSession.${s1_id}.risk_level == MEDIUM"

  # =====================================================================================
  # RULE 4 — transitive_cascade
  # Three distinct triggers; depths 5, 4 and 5; every link is caused by the previous link.
  # =====================================================================================
  - rule_id: transitive_cascade
    instances:

      - name: bias_evaluation_cascades_five_levels_to_client_stepup_counter
        grounds:
          - state_machines.BiasAudit.state.COLLECTING_to_REMEDIATION_REQUIRED
          - state_machines.MethodProfile.bias_state.CLEARED_to_RESTRICTED
          - state_machines.MethodAttempt.state.SCORED_to_REQUIRES_RESCORE
          - state_machines.VerificationSession.identity_state.IN_PROGRESS_to_AWAITING_EVIDENCE
          - entities.Client.fields.pending_stepup_count
          - entities.VerificationPolicy.fields.degraded_flag
          - calculations.cohort_disparity_evaluation
        distinguishing_aspect: |
