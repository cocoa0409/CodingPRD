              captures: { e2_earned: $.data.earned_points_total }
            - call: "POST /academic-terms/${term_id}/lifecycle-transitions"
              payload: { target_state: "FINALS" }
              as: Registrar
              captures: { term_state: $.data.lifecycle_state }
            - call: "POST /grade-passbacks"
              payload: { shell_id: "${shell_id}" }
              as: Instructor
