  # ---------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (two different interval semantics)
  # ---------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: policy_effective_year_windows_half_open_strictly_increasing
        grounds:
          - state_machines.SpendingPolicyVersion.DRAFT_to_ADOPTED
          - validations[priority=14]
          - errors[ERR_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Resource SpendingPolicyVersion with HALF-OPEN effective windows
          [effective_from, next effective): adopting a second policy with the same
          effective year (2026) conflicts; adopting one with a strictly later year (2028)
          succeeds and closes the previous window (first policy -> SUPERSEDED). Adjacent
          years (2027 then 2028) would touch cleanly; equality is the only collision.
        test_recipe:
          setup:
            - "Pool with allocation; policy A (500bps, FY2026) ADOPTED; policy B (550bps, FY2026) in DRAFT; policy C (550bps, FY2028) in DRAFT"
          setup_api_calls:
            - { call: "POST /endowment/pools", payload: { pool_name: "Pool PW", inception_fiscal_year: 2026 }, as: EndowmentAdmin, captures: { pw_pool: $.data.id, pw_pv: $.data.version } }
            - { call: "POST /endowment/allocations/bulk_upsert", payload: { pool_id: "${pw_pool}", items: [ { asset_class: US_EQUITY, target_pct_bps: 10000, rebalance_band_bps: 500 } ] }, as: EndowmentAdmin }
            - { call: "POST /endowment/policies", payload: { pool_id: "${pw_pool}", spending_rate_bps: 500, smoothing_window_quarters: 4, band_floor_bps: 0, band_cap_bps: 10000, effective_from_fiscal_year: 2026 }, as: InvestmentOfficer, as_user_id: "io-1", captures: { pw_pa: $.data.id } }
            - { call: "POST /endowment/policies/${pw_pa}/adopt", payload: { expected_pool_version: "${pw_pv}" }, as: BoardMember, as_user_id: "bm-1" }
            - { call: "POST /endowment/policies", payload: { pool_id: "${pw_pool}", spending_rate_bps: 550, smoothing_window_quarters: 4, band_floor_bps: 0, band_cap_bps: 10000, effective_from_fiscal_year: 2026 }, as: InvestmentOfficer, as_user_id: "io-1", captures: { pw_pb: $.data.id } }
            - { call: "POST /endowment/policies", payload: { pool_id: "${pw_pool}", spending_rate_bps: 550, smoothing_window_quarters: 4, band_floor_bps: 0, band_cap_bps: 10000, effective_from_fiscal_year: 2028 }, as: InvestmentOfficer, as_user_id: "io-1", captures: { pw_pc: $.data.id } }
          trigger:
            - { call: "GET /endowment/pools/${pw_pool}", as: BoardMember, captures: { pw_pv2: $.data.version } }
            - { call: "POST /endowment/policies/${pw_pb}/adopt", payload: { expected_pool_version: "${pw_pv2}" }, as: BoardMember, as_user_id: "bm-1", captures: { pw_err: $.data.error_id } }
            - { call: "POST /endowment/policies/${pw_pc}/adopt", payload: { expected_pool_version: "${pw_pv2}" }, as: BoardMember, as_user_id: "bm-1", captures: { pw_pc_st: $.data.policy_status } }
            - { call: "GET /endowment/policies/${pw_pa}", as: BoardMember, captures: { pw_pa_st: $.data.policy_status } }
          assert:
            - "Adopting policy B (effective 2026, equal to A's) fails with ERR_WINDOW_CONFLICT (http 409) — half-open windows may not share a start"
            - "Adopting policy C (effective 2028, strictly greater) succeeds: policy_status == ADOPTED"
            - "Policy A becomes SUPERSEDED once C is ADOPTED (its window closes at 2028); note the failed B adoption did NOT bump the pool version, so C's expected version still matches"

      - name: manager_coverage_intervals_inclusive_overlap_vs_adjacency
        grounds:
          - state_machines.InvestmentManager.PROSPECT_to_ENGAGED
          - state_machines.InvestmentManager.WATCHLIST_to_TERMINATED
          - validations[priority=14]
          - errors[ERR_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Resource InvestmentManager with INCLUSIVE (closed) coverage intervals
          [coverage_start_quarter, coverage_end_quarter] — different interval semantics from
          the sibling's half-open policy windows: after manager A (coverage [1,3]) is
          terminated, a new same-class manager starting at quarter 4 engages cleanly
          (adjacency), while one starting at quarter 3 collides (3 is inside [1,3] under
          closed semantics — a half-open reading would wrongly allow it).
        test_recipe:
          setup:
            - "Pool with 100% US_EQUITY allocation; manager A (US_EQUITY, coverage_start 1) ENGAGED, then driven to WATCHLIST by three consecutive negative-excess reports (excess -100 each of Q1-Q3, each quarter finalized), then TERMINATED by the board with coverage_end_quarter == 3"
          setup_api_calls:
            - { call: "POST /endowment/pools", payload: { pool_name: "Pool MC", inception_fiscal_year: 2026 }, as: EndowmentAdmin, captures: { mc_pool: $.data.id, mc_pv: $.data.version } }
            - { call: "POST /endowment/allocations/bulk_upsert", payload: { pool_id: "${mc_pool}", items: [ { asset_class: US_EQUITY, target_pct_bps: 10000, rebalance_band_bps: 500 } ] }, as: EndowmentAdmin }
            - { call: "POST /endowment/managers", payload: { pool_id: "${mc_pool}", manager_name: "M A", asset_class: US_EQUITY, benchmark_code: "SPX", coverage_start_quarter: 1 }, as: InvestmentOfficer, captures: { mc_ma: $.data.id } }
            - { call: "POST /endowment/managers/${mc_ma}/engage", payload: {}, as: InvestmentOfficer }
            - { call: "POST /endowment/manager-quarter-reports", payload: { manager_id: "${mc_ma}", quarter_index: 1, beginning_mv_cents: 1000000, ending_mv_cents: 1000000, flows: [], benchmark_return_bps: 100 }, as: InvestmentOfficer }
            - { call: "POST /endowment/valuations", payload: { pool_id: "${mc_pool}", estimated_pool_market_value_cents: 1000000 }, as: InvestmentOfficer, captures: { mc_v1: $.data.id } }
            - { call: "POST /endowment/valuations/${mc_v1}/finalize", payload: { final_pool_market_value_cents: 1000000, expected_pool_version: "${mc_pv}" }, as: InvestmentOfficer }
            - { call: "POST /endowment/manager-quarter-reports", payload: { manager_id: "${mc_ma}", quarter_index: 2, beginning_mv_cents: 1000000, ending_mv_cents: 1000000, flows: [], benchmark_return_bps: 100 }, as: InvestmentOfficer }
            - { call: "POST /endowment/valuations", payload: { pool_id: "${mc_pool}", estimated_pool_market_value_cents: 1000000 }, as: InvestmentOfficer, captures: { mc_v2: $.data.id } }
            - { call: "GET /endowment/pools/${mc_pool}", as: InvestmentOfficer, captures: { mc_pv2: $.data.version } }
            - { call: "POST /endowment/valuations/${mc_v2}/finalize", payload: { final_pool_market_value_cents: 1000000, expected_pool_version: "${mc_pv2}" }, as: InvestmentOfficer }
            - { call: "POST /endowment/manager-quarter-reports", payload: { manager_id: "${mc_ma}", quarter_index: 3, beginning_mv_cents: 1000000, ending_mv_cents: 1000000, flows: [], benchmark_return_bps: 100 }, as: InvestmentOfficer }
            - { call: "POST /endowment/valuations", payload: { pool_id: "${mc_pool}", estimated_pool_market_value_cents: 1000000 }, as: InvestmentOfficer, captures: { mc_v3: $.data.id } }
            - { call: "GET /endowment/pools/${mc_pool}", as: InvestmentOfficer, captures: { mc_pv3: $.data.version } }
            - { call: "POST /endowment/valuations/${mc_v3}/finalize", payload: { final_pool_market_value_cents: 1000000, expected_pool_version: "${mc_pv3}" }, as: InvestmentOfficer }
            - { call: "POST /endowment/managers/${mc_ma}/terminate", payload: {}, as: BoardMember, as_user_id: "bm-1", captures: { mc_end: $.data.coverage_end_quarter } }
            - { call: "POST /endowment/managers", payload: { pool_id: "${mc_pool}", manager_name: "M D", asset_class: US_EQUITY, benchmark_code: "SPX", coverage_start_quarter: 4 }, as: InvestmentOfficer, captures: { mc_md: $.data.id } }
            - { call: "POST /endowment/managers", payload: { pool_id: "${mc_pool}", manager_name: "M E", asset_class: US_EQUITY, benchmark_code: "SPX", coverage_start_quarter: 3 }, as: InvestmentOfficer, captures: { mc_me: $.data.id } }
          trigger:
            - { call: "POST /endowment/managers/${mc_md}/engage", payload: {}, as: InvestmentOfficer, captures: { mc_md_st: $.data.engagement_status } }
            - { call: "POST /endowment/managers/${mc_me}/engage", payload: {}, as: InvestmentOfficer, captures: { mc_me_err: $.data.error_id } }
          assert:
            - "Manager A terminated with coverage_end_quarter == 3 (pool.current_quarter_index at termination)"
            - "Manager D (coverage_start 4 = 3 + 1, adjacent) engages: engagement_status == ENGAGED"
            - "Manager E (coverage_start 3, inside A's closed interval [1,3]) is rejected with ERR_WINDOW_CONFLICT (http 409)"

  # ---------------------------------------------------------------
  # Rule 9 — compensating_invariant (two different conserved quantities)
  # ---------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: pool_unit_identity_conserved_across_unitize_redeem_and_corpus_redeem
        grounds:
          - calculations.gift_unitization
          - calculations.distribution_redemption_units
          - entities.EndowmentPool.fields.total_units_outstanding_micro
        distinguishing_aspect: |
          Conserved quantity: the exact integer identity pool.total_units_outstanding_micro
          == sum of all funds' units_held_micro. Forward + compensating flows across TWO
          funds and THREE mechanisms (gift unitization +150000000000, distribution
          redemption -5000000000, corpus redemption -10000000000) leave the identity exact
          at 135000000000 — no rounding drift is allowed to leak between the pool counter
          and the per-fund counters.
        test_recipe:
          setup:
            - "Pool with allocation, policy (500/4/0/10000/2026) ADOPTED, engaged manager, donor"
            - "Fund FU1 (TRUE_ENDOWMENT) with CORPUS gift 10000000 and Fund FU2 (QUASI_ENDOWMENT) with CORPUS gift 5000000, both ACTIVE and RECEIVED in Q1; Q1 finalized at inception price 100000 -> FU1 holds 100000000000, FU2 holds 50000000000 micro-units"
          setup_api_calls:
            - { call: "POST /endowment/pools", payload: { pool_name: "Pool UI", inception_fiscal_year: 2026 }, as: EndowmentAdmin, captures: { ui_pool: $.data.id, ui_pv: $.data.version } }
            - { call: "POST /endowment/allocations/bulk_upsert", payload: { pool_id: "${ui_pool}", items: [ { asset_class: US_EQUITY, target_pct_bps: 10000, rebalance_band_bps: 500 } ] }, as: EndowmentAdmin }
            - { call: "POST /endowment/policies", payload: { pool_id: "${ui_pool}", spending_rate_bps: 500, smoothing_window_quarters: 4, band_floor_bps: 0, band_cap_bps: 10000, effective_from_fiscal_year: 2026 }, as: InvestmentOfficer, as_user_id: "io-1", captures: { ui_pol: $.data.id } }
            - { call: "POST /endowment/policies/${ui_pol}/adopt", payload: { expected_pool_version: "${ui_pv}" }, as: BoardMember, as_user_id: "bm-1" }
            - { call: "POST /endowment/managers", payload: { pool_id: "${ui_pool}", manager_name: "M UI", asset_class: US_EQUITY, benchmark_code: "SPX", coverage_start_quarter: 1 }, as: InvestmentOfficer, captures: { ui_mgr: $.data.id } }
            - { call: "POST /endowment/managers/${ui_mgr}/engage", payload: {}, as: InvestmentOfficer }
            - { call: "POST /endowment/funds", payload: { pool_id: "${ui_pool}", fund_code: "FU1", fund_name: "Fund U1", endowment_class: TRUE_ENDOWMENT, purpose_restriction: UNRESTRICTED }, as: DevelopmentOfficer, captures: { ui_f1: $.data.id } }
            - { call: "POST /endowment/funds", payload: { pool_id: "${ui_pool}", fund_code: "FU2", fund_name: "Fund U2", endowment_class: QUASI_ENDOWMENT, purpose_restriction: UNRESTRICTED }, as: DevelopmentOfficer, captures: { ui_f2: $.data.id } }
            - { call: "POST /endowment/donors", payload: { donor_name: "D UI", donor_type: INDIVIDUAL }, as: DevelopmentOfficer, captures: { ui_donor: $.data.id } }
            - { call: "POST /endowment/gifts", payload: { fund_id: "${ui_f1}", donor_id: "${ui_donor}", external_ref: "U1", gift_type: CORPUS, amount_cents: 10000000 }, as: DevelopmentOfficer, captures: { ui_g1: $.data.id } }
            - { call: "POST /endowment/gifts", payload: { fund_id: "${ui_f2}", donor_id: "${ui_donor}", external_ref: "U2", gift_type: CORPUS, amount_cents: 5000000 }, as: DevelopmentOfficer, captures: { ui_g2: $.data.id } }
            - { call: "POST /endowment/funds/${ui_f1}/activate", payload: {}, as: DevelopmentOfficer }
            - { call: "POST /endowment/funds/${ui_f2}/activate", payload: {}, as: DevelopmentOfficer }
            - { call: "POST /endowment/gifts/${ui_g1}/receive", payload: {}, as: DevelopmentOfficer }
            - { call: "POST /endowment/gifts/${ui_g2}/receive", payload: {}, as: DevelopmentOfficer }
            - { call: "POST /endowment/manager-quarter-reports", payload: { manager_id: "${ui_mgr}", quarter_index: 1, beginning_mv_cents: 0, ending_mv_cents: 15000000, flows: [ { day_offset: 0, amount_cents: 15000000 } ], benchmark_return_bps: 0 }, as: InvestmentOfficer }
            - { call: "POST /endowment/valuations", payload: { pool_id: "${ui_pool}", estimated_pool_market_value_cents: 15000000 }, as: InvestmentOfficer, captures: { ui_v1: $.data.id } }
            - { call: "GET /endowment/pools/${ui_pool}", as: InvestmentOfficer, captures: { ui_pv1: $.data.version } }
            - { call: "POST /endowment/valuations/${ui_v1}/finalize", payload: { final_pool_market_value_cents: 15000000, expected_pool_version: "${ui_pv1}" }, as: InvestmentOfficer }
            - { call: "POST /endowment/distributions", payload: { fund_id: "${ui_f1}", fiscal_year: 2026 }, as: DevelopmentOfficer, as_user_id: "dev-1", captures: { ui_d: $.data.id } }
            - { call: "POST /endowment/distributions/${ui_d}/propose", payload: {}, as: DevelopmentOfficer, as_user_id: "dev-1" }
            - { call: "POST /endowment/distributions/${ui_d}/approve", payload: {}, as: BoardMember, as_user_id: "bm-1" }
          trigger:
            - { call: "POST /endowment/distributions/${ui_d}/distribute", payload: {}, as: InvestmentOfficer, captures: { ui_redeemed: $.data.units_redeemed_micro } }
            - { call: "POST /endowment/funds/${ui_f2}/redeem_corpus", payload: { amount_cents: 1000000 }, as: BoardMember, as_user_id: "bm-1" }
            - { call: "GET /endowment/pools/${ui_pool}", as: InvestmentOfficer, captures: { ui_total: $.data.total_units_outstanding_micro } }
            - { call: "GET /endowment/funds/${ui_f1}", as: InvestmentOfficer, captures: { ui_f1u: $.data.units_held_micro } }
            - { call: "GET /endowment/funds/${ui_f2}", as: InvestmentOfficer, captures: { ui_f2u: $.data.units_held_micro, ui_f2hgv: $.data.historic_gift_value_cents } }
            - { call: "GET /endowment/ledger-entries?fund_id=${ui_f2}&entry_type=CORPUS_REDEEM", as: InvestmentOfficer, captures: { ui_led: "$.data[0].units_delta_micro" } }
          assert:
            - "Distribution redeemed units_redeemed_micro == 5000000000 (round_half_up(500000 * 1e9 / 100000))"
            - "Fund FU1.units_held_micro == 95000000000 and FU2.units_held_micro == 40000000000 (corpus redemption burned 10000000000)"
            - "EndowmentPool.total_units_outstanding_micro == 135000000000 == 95000000000 + 40000000000 (exact identity, zero drift)"
            - "Fund FU2.historic_gift_value_cents == 4000000 (HGV moved only by the corpus redemption)"
            - "UnitLedgerEntry CORPUS_REDEEM for FU2 has units_delta_micro == -10000000000"

      - name: payout_cash_conservation_allocated_equals_spent_plus_swept
        grounds:
          - calculations.unspent_sweep
          - state_machines.ProgramPayout.DISBURSED_to_CLOSED_RETURNED
          - entities.ProgramPayout.fields.unspent_amount_cents
        distinguishing_aspect: |
          Conserved quantity: per-payout cash — allocated_amount_cents (500000) must equal
          spent_amount_cents (200000) + swept unspent (300000) exactly after the lapse sweep
          fires at age exactly 4 quarters, and the swept cents re-enter the fund as a
          reinvestment gift of exactly 300000 (which unitizes to 3000000000 micro-units at
          the flat price 100000). Different conserved quantity from the sibling unit identity.
