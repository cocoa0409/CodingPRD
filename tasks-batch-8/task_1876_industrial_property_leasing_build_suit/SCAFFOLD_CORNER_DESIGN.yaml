        grounds: ["validations[priority=3]", "errors[ERR_FORBIDDEN]", entities.TenantRequirement.fields.tenant_rep_id]
        distinguishing_aspect: "Ownership: rep-002 (a valid TenantRep) may not withdraw rep-001's requirement — 403 ERR_FORBIDDEN from the priority-3 ownership check."
