      - name: acceptance_of_an_already_accepted_consignment_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=12]
          - errors[ERR_CARGO_INVALID_STATE]
          - endpoints[POST /cargo-items/{id}/accept]
