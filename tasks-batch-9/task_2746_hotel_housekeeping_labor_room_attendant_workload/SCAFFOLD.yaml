scenario: |
  Generate task harder than expert level!

  2746. Hotel Housekeeping Labor & Room Attendant Workload (hotel rooms operations): forecast-driven
  staffing from occupancy and arrival/departure mix with credit-based workload allocation, room
  assignment balancing checkout, stayover and deep-clean credits by room type, opt-out and
  every-other-day service programs with guest incentive tracking, inspection sampling with quality
  scoring and re-clean triggers, linen par levels, laundry turnaround and shortage escalation,
  minimum daily hours, workload limits and injury prevention requirements under local ordinances,
  lost and found handling with retention and claim procedures, productivity measurement in minutes
  per room with quality guardrails

domain_name: hotel-housekeeping-labor-workload
api_prefix: "/housekeeping"

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy

  entity_topology: flat
  # Peer entities linked by foreign keys; every URL is a top-level collection under /housekeeping
  # plus action sub-paths. No entity is addressed through a parent path segment, and every FK is
  # discovered through a filtered list endpoint rather than a nested route.

  state_machine_shape: cyclic
  # RoomAssignment loops COMPLETED -> RECLEAN_REQUIRED -> (superseding generation) IN_PROGRESS ->
  # COMPLETED, bounded by reclean_generation <= 2. ShiftRoster additionally carries two independent
  # state dimensions (status and compliance_state) that advance on unrelated triggers.
  # LostFoundItem forks CLAIM_PENDING -> {RELEASED, SHIPPED, STORED} with divergent side effects.

  relationship_patterns:
    - one_to_many
    - self_referential      # RoomAssignment.supersedes_assignment_id -> RoomAssignment.id
    - cross_aggregate       # RoomAssignment reads Room/RoomType credits and debits LinenItem stock

  role_model: segregation_of_duties
  # The Supervisor who cleaned a room may not inspect it (Inspection.inspector_attendant_id must
  # differ from the roster's attendant_id), and the ComplianceOfficer who grants an ordinance
  # workload waiver may not be the operator who requested it.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Property
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Hotel property display name
        constraints: 1..120 chars
      - name: ordinance_profile
        type: enum
        source: input
        description: >-
          Local ordinance regime. NONE = no square-foot ceiling and waiver headroom factor 1.25;
          SQFT_CAP_2200 = per-attendant square-foot ceiling enforced from max_daily_square_feet with
          waiver headroom factor 1.25; CREDIT_CAP_STRICT = no square-foot ceiling and waiver headroom
          factor 1.00 (a waiver may never exceed the credit cap).
        default: NONE
        constraints: "one of {NONE, SQFT_CAP_2200, CREDIT_CAP_STRICT}"
      - name: credit_minute_value
        type: integer
        source: input
        description: Standard minutes of work represented by one workload credit
        default: 30
        constraints: 5..120
      - name: standard_shift_minutes
        type: integer
        source: input
        description: Paid minutes in a standard shift before overtime accrues
        default: 480
        constraints: 60..720
      - name: pre_post_shift_minutes
        type: integer
        source: input
        description: Non-cleaning minutes per shift (line-up, cart set-up, close-out) removed before converting shift length into assignable credits
        default: 45
        constraints: 0..240
      - name: min_daily_paid_minutes
        type: integer
        source: input
        description: Ordinance minimum daily paid minutes guaranteed to an attendant who clocked in
        default: 240
        constraints: 0..480
      - name: max_daily_credits
        type: number
        source: input
        description: Ordinance ceiling on workload credits assignable to one attendant per business date, before the restricted-duty reduction
        default: 16.00
        constraints: "0.25..40.00, 2 decimals"
      - name: max_daily_square_feet
        type: integer
        source: input
        description: Ordinance ceiling on cleaned square feet per attendant per business date; enforced only when ordinance_profile == SQFT_CAP_2200
        default: 2200
        constraints: 100..20000
      - name: laundry_sla_minutes
        type: integer
        source: input
        description: Maximum laundry turnaround minutes before a returned cycle is booked as an SLA breach
        default: 240
        constraints: 30..1440
      - name: laundry_capacity_sets
        type: integer
        source: input
        description: Maximum linen sets that may be in flight across overlapping laundry cycles for this property
        default: 300
        constraints: 1..10000
      - name: reclean_threshold_score
        type: number
        source: input
        description: Inspection score_pct at or above which an inspection passes
        default: 85.0
        constraints: "0.0..100.0, 1 decimal"
      - name: inspection_sample_rate
        type: number
        source: input
        description: Baseline fraction of an attendant's completed cleans that must be inspected before the roster may close
        default: 0.20
        constraints: "0.00..1.00, 2 decimals"
      - name: probation_sample_rate
        type: number
        source: input
        description: Sampling fraction applied instead of inspection_sample_rate when Attendant.quality_probation is true
        default: 0.50
        constraints: "0.00..1.00, 2 decimals"
      - name: rest_buffer_minutes
        type: integer
        source: input
        description: Injury-prevention rest minutes that must separate two cleaning windows worked by the same attendant
        default: 10
        constraints: 0..120
      - name: total_rooms
        type: integer
        source: computed
        description: "Count of Room rows with property_id == this.id, counted regardless of cleanliness_status or occupancy_state"
        default: 0
      - name: outstanding_incentive_points
        type: integer
        source: computed
        description: "Sum of ServiceEnrollment.points_accrued over enrollments whose room_id resolves to a Room of this property and whose status == ACTIVE"
        default: 0

  - name: RoomType
    parent: null
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: FK -> Property.id
      - name: code
        type: string
        source: input
        description: Room type code, unique per property (for example KING, SUITE)
        constraints: 1..24 chars, uppercase
      - name: square_feet
        type: integer
        source: input
        description: Cleanable square feet of one room of this type; snapshotted onto every RoomAssignment
        constraints: 50..5000
      - name: checkout_credits
        type: number
        source: input
        description: Base workload credits for a departure (checkout) clean of this room type
        constraints: "0.25..10.00, 2 decimals"
      - name: stayover_credits
        type: number
        source: input
        description: Base workload credits for a stayover service of this room type
        constraints: "0.25..10.00, 2 decimals"
      - name: deep_clean_credits
        type: number
        source: input
        description: Base workload credits for a deep clean of this room type
        constraints: "0.25..10.00, 2 decimals"
      - name: linen_sets_per_room
        type: integer
        source: input
        description: Linen sets required to make up one room of this type; drives LinenItem.par_required_sets and the linen debit on completion
        default: 2
        constraints: 0..40
      - name: room_count
        type: integer
        source: computed
        description: "Count of Room rows with room_type_id == this.id"
        default: 0

  - name: Room
    parent: null
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: FK -> Property.id
      - name: room_type_id
        type: string
        source: input
        description: FK -> RoomType.id; must belong to the same property_id
      - name: room_number
        type: string
        source: input
        description: Guest-facing room number, unique per property
        constraints: 1..12 chars
      - name: floor
        type: integer
        source: input
        description: Floor number used for reporting only; never a decision input
        default: 1
      - name: service_program
        type: enum
        source: input
        description: >-
          Guest service program in force for the room. DAILY = serviced every day; EVERY_OTHER_DAY =
          stayover service permitted only when the room was last serviced two or more business dates
          ago; OPT_OUT = stayover service declined by the guest. Overwritten by ServiceEnrollment
          creation and reset to DAILY when the enrollment is voided.
        default: DAILY
        constraints: "one of {DAILY, EVERY_OTHER_DAY, OPT_OUT}"
      - name: occupancy_state
        type: enum
        source: input
        description: >-
          Front-desk occupancy posture for the current business date. VACANT = empty and ready;
          STAYOVER = occupied by a continuing guest; DUE_OUT = departure expected today;
          ARRIVAL = held for an inbound guest and not serviceable.
        default: VACANT
        constraints: "one of {VACANT, STAYOVER, DUE_OUT, ARRIVAL}"
      - name: cleanliness_status
        type: enum
        source: system
        description: >-
          Housekeeping condition. DIRTY on creation and whenever occupancy_state is set to DUE_OUT;
          IN_SERVICE while an assignment on the room is IN_PROGRESS; CLEAN on assignment completion;
          INSPECTED_PASS on a passing inspection; RECLEAN_REQUIRED on a failing inspection;
          OUT_OF_ORDER when a generation-2 re-clean also fails or when set by an operator correction.
        default: DIRTY
        constraints: "one of {CLEAN, DIRTY, IN_SERVICE, INSPECTED_PASS, RECLEAN_REQUIRED, OUT_OF_ORDER}"
      - name: last_serviced_business_date
        type: string
        source: input
        description: Business date (YYYY-MM-DD) of the most recent completed service; seedable at creation and re-stamped by assignment completion
        default: null
      - name: last_deep_cleaned_business_date
        type: string
        source: input
        description: Business date (YYYY-MM-DD) of the most recent completed deep clean; seedable at creation and re-stamped by DEEP_CLEAN completion
        default: null

  - name: Attendant
    parent: null
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: FK -> Property.id
      - name: employee_code
        type: string
        source: input
        description: Payroll code, unique per property
        constraints: 1..24 chars
      - name: full_name
        type: string
        source: input
        description: Attendant display name
        constraints: 1..120 chars
      - name: seniority_date
        type: string
        source: input
        description: Bargaining-unit seniority date (YYYY-MM-DD); the pinned tie-break key for balancing decisions
        constraints: ISO date
      - name: hourly_rate_cents
        type: integer
        source: input
        description: Base wage in cents per hour, used by the shift labor cost calculation
        constraints: 100..20000
      - name: can_inspect
        type: boolean
        source: input
        description: True when the attendant is credentialed as a working supervisor and may file inspections
        default: false
      - name: restricted_duty
        type: boolean
        source: input
        description: Injury-prevention flag; when true the attendant's effective credit cap is 75 percent of Property.max_daily_credits and DEEP_CLEAN work is barred
        default: false
      - name: status
        type: enum
        source: input
        description: Employment posture; only ACTIVE attendants may be rostered
        default: ACTIVE
        constraints: "one of {ACTIVE, ON_LEAVE, TERMINATED}"
      - name: quality_probation
        type: boolean
        source: computed
        description: Set true by the first failing inspection on any of this attendant's assignments; raises the inspection sampling rate on later rosters
        default: false
      - name: lifetime_fail_count
        type: integer
        source: computed
        description: Count of Inspection rows with result == FAIL whose assignment sits on a roster of this attendant
        default: 0

  - name: ForecastDay
    parent: null
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: FK -> Property.id
      - name: business_date
        type: string
        source: input
        description: Operating date (YYYY-MM-DD); unique per property_id
        constraints: ISO date
      - name: forecast_occupied_rooms
        type: integer
        source: input
        description: Rooms forecast to be occupied tonight
        constraints: 0..5000
      - name: forecast_arrivals
        type: integer
        source: input
        description: Rooms forecast to check in today
        constraints: "0..5000; must be <= forecast_occupied_rooms"
      - name: forecast_departures
        type: integer
        source: input
        description: Rooms forecast to check out today
        constraints: 0..5000
      - name: planned_deep_clean_rooms
        type: integer
        source: input
        description: Rooms the planner intends to deep clean today
        default: 0
        constraints: 0..5000
      - name: status
        type: enum
        source: system
        description: DRAFT on creation, PUBLISHED once staffing is released, CLOSED after day-end reconciliation
        default: DRAFT
        constraints: "one of {DRAFT, PUBLISHED, CLOSED}"
      - name: projected_required_credits
        type: number
        source: computed
        description: "Forward-looking staffing demand in credits (calculations.forecast_required_credits, variant PROJECTED_INVENTORY_MIX); recomputed on creation and on publish"
        default: 0.00
      - name: required_attendants
        type: integer
        source: computed
        description: "Attendant headcount implied by projected_required_credits (calculations.required_attendant_headcount)"
        default: 0
      - name: allocated_credits_total
        type: number
        source: computed
        description: "Conserved day quantity: sum of ShiftRoster.assigned_credits over every roster with forecast_day_id == this.id"
        default: 0.00
      - name: actual_reconciled_credits
        type: number
        source: computed
        description: "Chronological day-end demand in credits (calculations.forecast_required_credits, variant ACTUAL_RECONCILED); null until status == CLOSED"
        default: null
      - name: credit_variance_pct
        type: number
        source: computed
        description: "Signed percentage divergence of actual_reconciled_credits from projected_required_credits (calculations.forecast_credit_variance); null until status == CLOSED"
        default: null

  - name: ShiftRoster
    parent: null
    common_fields: true
    fields:
      - name: forecast_day_id
        type: string
        source: input
        description: FK -> ForecastDay.id
      - name: attendant_id
        type: string
        source: input
        description: FK -> Attendant.id; must belong to the same property as the forecast day
      - name: planned_start_at
        type: datetime
        source: input
        description: Scheduled shift start (ISO 8601 UTC, three fractional digits); reporting only
        default: null
      - name: status
        type: enum
        source: system
        description: Lifecycle dimension - PLANNED on creation, CLOCKED_IN once the attendant starts the shift, CLOSED after day-end settlement
        default: PLANNED
        constraints: "one of {PLANNED, CLOCKED_IN, CLOSED}"
      - name: compliance_state
        type: enum
        source: computed
        description: >-
          Ordinance dimension, independent of status - COMPLIANT below every ceiling, AT_LIMIT when
          assigned_credits equals effective_credit_cap or assigned_square_feet equals
          effective_sqft_cap, BREACH_BLOCKED above a ceiling (blocks assignment starts),
          WAIVER_GRANTED when a granted waiver covers assigned_credits.
        default: COMPLIANT
        constraints: "one of {COMPLIANT, AT_LIMIT, BREACH_BLOCKED, WAIVER_GRANTED}"
      - name: waiver_state
        type: enum
        source: system
        description: Ordinance waiver dimension - NONE until a waiver is requested, REQUESTED after the supervisor files it, GRANTED or DENIED after the compliance decision
        default: NONE
        constraints: "one of {NONE, REQUESTED, GRANTED, DENIED}"
      - name: waiver_requested_credits
        type: number
        source: input
        description: Credit ceiling the waiver request asks for; null until a request is filed
        default: null
      - name: waiver_requested_by_user_id
        type: string
        source: system
        description: X-User-ID of the operator who filed the waiver request; compared against the decider for segregation of duties
        default: null
      - name: waiver_decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the compliance operator who decided the waiver
        default: null
      - name: assigned_credits
        type: number
        source: computed
        description: "Sum of RoomAssignment.credits over assignments with roster_id == this.id and status IN {ASSIGNED, IN_PROGRESS, COMPLETED, INSPECTED_PASS, RECLEAN_REQUIRED}"
        default: 0.00
      - name: assigned_square_feet
        type: integer
        source: computed
        description: "Sum of RoomAssignment.square_feet_snapshot over the same assignment set as assigned_credits"
        default: 0
      - name: effective_credit_cap
        type: number
        source: computed
        description: "Property.max_daily_credits reduced by the restricted-duty factor (calculations.roster_workload_compliance)"
        default: 0.00
      - name: effective_sqft_cap
        type: integer
        source: computed
        description: "Property.max_daily_square_feet when Property.ordinance_profile == SQFT_CAP_2200, else null (no square-foot ceiling applies)"
        default: null
      - name: worked_minutes
        type: integer
        source: input
        description: Clock minutes reported at close; null until status == CLOSED
        default: null
      - name: break_minutes
        type: integer
        source: input
        description: Unproductive break minutes reported at close
        default: 0
      - name: paid_minutes
        type: integer
        source: computed
        description: "worked_minutes lifted to Property.min_daily_paid_minutes when short (calculations.shift_settlement); null until status == CLOSED"
        default: null
      - name: overtime_minutes
        type: integer
        source: computed
        description: "paid_minutes beyond Property.standard_shift_minutes; null until status == CLOSED"
        default: null
      - name: rooms_completed_gross
        type: integer
        source: computed
        description: "Count of assignments with roster_id == this.id and status IN {COMPLETED, INSPECTED_PASS, RECLEAN_REQUIRED} (each physical clean counted, re-cleans included)"
        default: 0
      - name: rooms_credited_net
        type: integer
        source: computed
        description: "Count of distinct room_id over the same assignment set as rooms_completed_gross (a re-cleaned room counted once)"
        default: 0
      - name: minutes_per_room_gross
        type: number
        source: computed
        description: "Productivity variant GROSS_PHYSICAL (calculations.minutes_per_room); null until status == CLOSED or when rooms_completed_gross == 0"
        default: null
      - name: minutes_per_room_net
        type: number
        source: computed
        description: "Productivity variant NET_CREDITED_ROOMS (calculations.minutes_per_room); null until status == CLOSED or when rooms_credited_net == 0"
        default: null
      - name: target_minutes_per_room
        type: number
        source: computed
        description: "Standard minutes implied by assigned_credits over rooms_credited_net (calculations.minutes_per_room); null until status == CLOSED"
        default: null
      - name: productivity_flag
        type: enum
        source: computed
        description: >-
          PENDING until close; QUALITY_HOLD when any assignment on the roster has reclean_generation
          >= 1 (the quality guardrail outranks the minutes comparison); otherwise ON_TARGET when
          minutes_per_room_net <= target_minutes_per_room and OVER_TARGET when it exceeds it.
        default: PENDING
        constraints: "one of {PENDING, ON_TARGET, OVER_TARGET, QUALITY_HOLD}"
      - name: required_inspection_samples
        type: integer
        source: computed
        description: "Inspections that must exist before close (calculations.inspection_sampling_plan)"
        default: 0
      - name: inspections_completed
        type: integer
        source: computed
        description: "Count of Inspection rows whose assignment_id resolves to an assignment with roster_id == this.id"
        default: 0
      - name: base_wage_cents
        type: integer
        source: computed
        description: "paid_minutes valued at Attendant.hourly_rate_cents (calculations.shift_labor_cost); null until status == CLOSED"
        default: null
      - name: ordinance_premium_cents
        type: integer
        source: computed
        description: "Ordinance premium keyed on the base_wage_cents tier (calculations.shift_labor_cost); null until status == CLOSED"
        default: null
      - name: total_labor_cost_cents
        type: integer
        source: computed
        description: "base_wage_cents + ordinance_premium_cents; null until status == CLOSED"
        default: null

  - name: RoomAssignment
    parent: null
    common_fields: true
    fields:
      - name: roster_id
        type: string
        source: input
        description: FK -> ShiftRoster.id
      - name: room_id
        type: string
        source: input
        description: FK -> Room.id
      - name: supersedes_assignment_id
        type: string
        source: system
        description: FK -> RoomAssignment.id; set only on a system-generated re-clean assignment and points at the assignment that failed inspection
        default: null
      - name: service_type
        type: enum
        source: input
        description: >-
          CHECKOUT for departure cleans, STAYOVER for occupied-room service, DEEP_CLEAN for
          rotational deep cleaning, LINEN_REFRESH for a linen-only touch on an opted-out room.
        constraints: "one of {CHECKOUT, STAYOVER, DEEP_CLEAN, LINEN_REFRESH}"
      - name: credits
        type: number
        source: computed
        description: "Workload credits carried by this assignment (calculations.assignment_credit_value), snapped to quarter credits"
        default: 0.00
      - name: reclean_generation
        type: integer
        source: system
        description: 0 for an originally planned clean, 1 or 2 for a system-generated re-clean of a failed inspection
        default: 0
      - name: status
        type: enum
        source: system
        description: >-
          ASSIGNED on creation, IN_PROGRESS once started, COMPLETED once finished, INSPECTED_PASS or
          RECLEAN_REQUIRED after inspection, CANCELLED when withdrawn by an operator, DEFERRED when
          pushed off the day by a linen escalation cascade or by roster close.
        default: ASSIGNED
        constraints: "one of {ASSIGNED, IN_PROGRESS, COMPLETED, INSPECTED_PASS, RECLEAN_REQUIRED, CANCELLED, DEFERRED}"
      - name: started_at
        type: datetime
        source: input
        description: Cleaning window start (ISO 8601 UTC, three fractional digits); defaults to the logical clock when omitted at start
        default: null
      - name: completed_at
        type: datetime
        source: input
        description: Cleaning window end (ISO 8601 UTC, three fractional digits); defaults to the logical clock when omitted at completion
        default: null
      - name: actual_minutes
        type: integer
        source: computed
        description: "Whole minutes from started_at to completed_at, truncated toward zero; null until status leaves IN_PROGRESS"
        default: null
      - name: square_feet_snapshot
        type: integer
        source: computed
        description: "RoomType.square_feet of the assigned room copied at creation time; later RoomType edits never move an existing assignment's ordinance arithmetic"
        default: 0
      - name: linen_sets_debited
        type: integer
        source: computed
        description: "Linen sets moved from on_hand_clean to soiled_queue when this assignment completed; 0 when the property has no SHEET_SET LinenItem or when service_type == STAYOVER"
        default: 0
      - name: roster_version_after
        type: integer
        source: computed
        description: "ShiftRoster.version immediately after the mutation that produced this response; lets a client chain expected_roster_version without re-reading the roster"
        default: 0

  - name: Inspection
    parent: null
    common_fields: false
    fields:
      - name: assignment_id
        type: string
        source: input
        description: FK -> RoomAssignment.id
      - name: inspector_attendant_id
        type: string
        source: system
        description: FK -> Attendant.id; taken from the X-User-ID header of the filing Supervisor and never accepted from the body
      - name: bathroom_points
        type: integer
        source: input
        description: Bathroom score, weight 0.30; a value <= 6 is a critical failure regardless of the total
        constraints: 0..10
      - name: linen_points
        type: integer
        source: input
        description: Bed and linen score, weight 0.25; a value <= 6 is a critical failure regardless of the total
        constraints: 0..10
      - name: dust_points
        type: integer
        source: input
        description: Dusting and surfaces score, weight 0.20
        constraints: 0..10
      - name: amenity_points
        type: integer
        source: input
        description: Amenity replenishment score, weight 0.15
        constraints: 0..10
      - name: floor_points
        type: integer
        source: input
        description: Floor care score, weight 0.10
        constraints: 0..10
      - name: score_pct
        type: number
        source: computed
        description: "Weighted score on a 0..100 scale, one decimal (calculations.inspection_quality_score)"
      - name: critical_fail
        type: boolean
        source: computed
        description: "True when bathroom_points <= 6 or linen_points <= 6"
        default: false
      - name: result
        type: enum
        source: computed
        description: "FAIL when critical_fail is true or score_pct < Property.reclean_threshold_score, else PASS"
        constraints: "one of {PASS, FAIL}"
      - name: generated_reclean_assignment_id
        type: string
        source: computed
        description: "FK -> RoomAssignment.id; the re-clean assignment this inspection created, or null when result == PASS or when the failed assignment already carried reclean_generation == 2"
        default: null

  - name: LinenItem
    parent: null
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: FK -> Property.id
      - name: linen_type
        type: enum
        source: input
        description: Linen class held in inventory; unique per property_id. Only SHEET_SET stock is debited by assignment completion and gates DEEP_CLEAN creation.
        constraints: "one of {SHEET_SET, TOWEL_SET, DUVET_COVER}"
      - name: total_owned_sets
        type: integer
        source: input
        description: Sets owned by the property; the conserved quantity of the linen ledger
        constraints: 0..100000
      - name: on_hand_clean
        type: integer
        source: computed
        description: "Clean sets on the shelf; initialised to total_owned_sets - initial_soiled_sets"
        default: 0
      - name: in_laundry
        type: integer
        source: computed
        description: "Sets held by laundry cycles with status == QUEUED"
        default: 0
      - name: soiled_queue
        type: integer
        source: computed
        description: "Soiled sets awaiting dispatch"
        default: 0
      - name: par_required_sets
        type: integer
        source: computed
        description: "Sum over RoomType rows of this property of (room_count * linen_sets_per_room)"
        default: 0
      - name: coverage_ratio
        type: number
        source: computed
        description: "on_hand_clean / par_required_sets to four decimals, or null when par_required_sets == 0"
        default: null
      - name: shortage_status
        type: enum
        source: computed
        description: "Coverage ladder from coverage_ratio, forced to ESCALATED while any laundry cycle of this item has status == LATE_ESCALATED (calculations.linen_coverage_status)"
        default: OK
        constraints: "one of {OK, WATCH, SHORTAGE, ESCALATED}"

  - name: LaundryCycle
    parent: null
    common_fields: true
    fields:
      - name: linen_item_id
        type: string
        source: input
        description: FK -> LinenItem.id
      - name: batch_sets
        type: integer
        source: input
        description: Sets dispatched in this batch; moved from soiled_queue into in_laundry on creation
        constraints: 1..100000
      - name: dispatched_at
        type: datetime
        source: input
        description: Batch hand-off instant (ISO 8601 UTC, three fractional digits); start of the capacity occupation window
        constraints: required
      - name: expected_return_at
        type: datetime
        source: input
        description: Contracted return instant (ISO 8601 UTC, three fractional digits); exclusive end of the capacity occupation window and must be strictly after dispatched_at
        constraints: required
      - name: returned_at
        type: datetime
        source: input
        description: Actual return instant; defaults to the logical clock when omitted at return
        default: null
      - name: returned_sets
        type: integer
        source: input
        description: Sets actually returned; defaults to batch_sets. Any shortfall is written off against LinenItem.total_owned_sets so the linen ledger identity still holds.
        default: null
      - name: status
        type: enum
        source: system
        description: QUEUED while in flight, RETURNED when returned inside the SLA, LATE_ESCALATED when the turnaround breached the SLA, VOIDED when recalled before return
        default: QUEUED
        constraints: "one of {QUEUED, RETURNED, LATE_ESCALATED, VOIDED}"
      - name: turnaround_minutes
        type: integer
        source: computed
        description: "Whole minutes from dispatched_at to returned_at, truncated toward zero; null until the cycle returns"
        default: null
      - name: sla_breach
        type: boolean
        source: computed
        description: "True when turnaround_minutes > Property.laundry_sla_minutes"
        default: false
      - name: linen_item_version_after
        type: integer
        source: computed
        description: "LinenItem.version immediately after the mutation that produced this response; lets a client chain expected_linen_item_version without re-reading the linen item"
        default: 0

  - name: LostFoundItem
    parent: null
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: FK -> Property.id
      - name: room_id
        type: string
        source: input
        description: FK -> Room.id; the room the item was recovered from
      - name: found_by_attendant_id
        type: string
        source: input
        description: FK -> Attendant.id; the attendant who recovered the item
      - name: description
        type: string
        source: input
        description: Free-text description used for description-match claim proof
        constraints: 1..240 chars
      - name: category
        type: enum
        source: input
        description: "Retention class: HIGH_VALUE 90 days, ID_DOCUMENT 60 days, STANDARD 30 days, PERISHABLE 0 days"
        constraints: "one of {HIGH_VALUE, ID_DOCUMENT, STANDARD, PERISHABLE}"
      - name: logged_at
        type: datetime
        source: system
        description: Logical-clock instant at which the item was logged
      - name: storage_bin
        type: string
        source: input
        description: Secure storage bin label; supplied when the item is stored
        default: null
      - name: stored_at
        type: datetime
        source: system
        description: Logical-clock instant at which the item entered storage; start of the retention window
        default: null
      - name: retention_days
        type: integer
        source: computed
        description: "Retention days implied by category (calculations.lost_found_retention_window)"
        default: 0
      - name: retention_expires_at
        type: datetime
        source: computed
        description: "Exclusive end of the retention window, stored_at plus retention_days days; null until the item is stored"
        default: null
      - name: status
        type: enum
        source: system
        description: >-
          LOGGED on creation, STORED once binned, CLAIM_PENDING while a claim is open, RELEASED on
          approved pickup, SHIPPED on approved shipment, DISPOSED or DONATED after retention lapses.
          A denied claim returns the item to STORED.
        default: LOGGED
        constraints: "one of {LOGGED, STORED, CLAIM_PENDING, RELEASED, SHIPPED, DISPOSED, DONATED}"
      - name: claimant_name
        type: string
        source: input
        description: Name on the open or last claim
        default: null
      - name: claimant_contact
        type: string
        source: input
        description: Contact string on the open or last claim
        default: null
      - name: proof_kind
        type: enum
        source: input
        description: "Proof offered with the claim; PHOTO_ID is mandatory for category == HIGH_VALUE and category == ID_DOCUMENT"
        default: null
        constraints: "one of {PHOTO_ID, DESCRIPTION_MATCH, RECEIPT}"
      - name: claim_attempt_count
        type: integer
        source: computed
        description: "Number of claims filed against this item, including denied ones"
        default: 0
      - name: denial_reason
        type: string
        source: input
        description: Reason recorded on the most recent denied claim
        default: null
      - name: tracking_code
        type: string
        source: input
        description: Carrier tracking code recorded when an approved claim is shipped
        default: null

  - name: ServiceEnrollment
    parent: null
    common_fields: true
    fields:
      - name: room_id
        type: string
        source: input
        description: FK -> Room.id
      - name: reservation_code
        type: string
        source: input
        description: Reservation the guest incentive accrues to
        constraints: 1..32 chars
      - name: program
        type: enum
        source: input
        description: OPT_OUT declines stayover service outright; EVERY_OTHER_DAY accepts service on alternating business dates
        constraints: "one of {OPT_OUT, EVERY_OTHER_DAY}"
      - name: nights
        type: integer
        source: input
        description: Nights of the stay the enrollment covers; caps the number of accruable skips through skip_budget = nights for OPT_OUT and ceil(nights / 2) for EVERY_OTHER_DAY (validations priority 39)
        constraints: 1..60
      - name: points_per_skip
        type: integer
        source: computed
        description: "500 when program == OPT_OUT, 250 when program == EVERY_OTHER_DAY"
        default: 0
      - name: skips_accrued
        type: integer
        source: computed
        description: "Number of accrued service skips; incremented once per accrual call"
        default: 0
      - name: points_accrued
        type: integer
        source: computed
        description: "skips_accrued * points_per_skip"
        default: 0
      - name: status
        type: enum
        source: system
        description: ACTIVE while skips remain, COMPLETED once skips_accrued == nights, VOIDED when the enrollment is reversed
        default: ACTIVE
        constraints: "one of {ACTIVE, COMPLETED, VOIDED}"

state_machines:
  - entity: ForecastDay
    dimension: status
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /housekeeping/forecast-days/{id}/publish"
        actor: HousekeepingDirector
        preconditions:
          - "forecast_day.status == DRAFT"
          - "at least one RoomType row exists with property_id == forecast_day.property_id"
        side_effects:
          - "recomputes projected_required_credits from the CURRENT RoomType inventory mix per calculations.forecast_required_credits variant PROJECTED_INVENTORY_MIX (rooms added after creation are therefore included)"
          - "recomputes required_attendants per calculations.required_attendant_headcount"
          - "sets status = PUBLISHED; increments version by 1; refreshes updated_at"
        note: "Rosters may only be created against a PUBLISHED forecast day."
      - from: PUBLISHED
        to: CLOSED
        trigger: "POST /housekeeping/forecast-days/{id}/close"
        actor: HousekeepingDirector
        preconditions:
          - "forecast_day.status == PUBLISHED"
          - "every ShiftRoster with forecast_day_id == this.id has status == CLOSED (else ERR_ROSTER_STILL_OPEN)"
        side_effects:
          - "computes actual_reconciled_credits per calculations.forecast_required_credits variant ACTUAL_RECONCILED"
          - "computes credit_variance_pct per calculations.forecast_credit_variance"
          - "sets status = CLOSED; increments version by 1"

  - entity: ShiftRoster
    dimension: status
    initial_state: PLANNED
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNED
        to: CLOCKED_IN
        trigger: "POST /housekeeping/shift-rosters/{id}/clock-in"
        actor: Supervisor
        preconditions:
          - "roster.status == PLANNED"
          - "forecast_day.status == PUBLISHED (cross-entity gate; ERR_FORECAST_NOT_PUBLISHED)"
          - "attendant.status == ACTIVE (ERR_ATTENDANT_NOT_ACTIVE)"
          - "roster.compliance_state != BREACH_BLOCKED (ERR_ROSTER_WORKLOAD_BREACH)"
        side_effects:
          - "sets status = CLOCKED_IN; increments version by 1"
        note: "Assignments may be created while the roster is PLANNED, but may only be STARTED once the roster is CLOCKED_IN."
      - from: CLOCKED_IN
        to: CLOSED
        trigger: "POST /housekeeping/shift-rosters/{id}/close"
        actor: Supervisor
        preconditions:
          - "roster.status == CLOCKED_IN"
          - "no assignment with roster_id == this.id has status == IN_PROGRESS (ERR_ASSIGNMENT_IN_PROGRESS)"
          - "inspections_completed >= required_inspection_samples (ERR_INSPECTION_SAMPLE_INCOMPLETE)"
          - "0 <= break_minutes <= worked_minutes <= 720"
        side_effects:
          - "hop 1: every assignment with roster_id == this.id and status == ASSIGNED moves to DEFERRED, processed in created_at ASC order"
          - "hop 2: because those assignments left the counted set, assigned_credits and assigned_square_feet are recomputed, then compliance_state is recomputed per calculations.roster_workload_compliance"
          - "hop 3: because assigned_credits changed, ForecastDay.allocated_credits_total is recomputed"
          - "stamps worked_minutes and break_minutes; computes paid_minutes, overtime_minutes per calculations.shift_settlement"
          - "computes rooms_completed_gross, rooms_credited_net, minutes_per_room_gross, minutes_per_room_net, target_minutes_per_room and productivity_flag per calculations.minutes_per_room"
          - "computes base_wage_cents, ordinance_premium_cents, total_labor_cost_cents per calculations.shift_labor_cost"
          - "sets status = CLOSED; increments version by 1"

  - entity: ShiftRoster
    dimension: compliance_state
    initial_state: COMPLIANT
    terminal_states: []
    transitions:
      - from: COMPLIANT
        to: AT_LIMIT
        trigger: "system recomputation after any change to assigned_credits, assigned_square_feet, effective_credit_cap or effective_sqft_cap"
        actor: system
        preconditions:
          - "assigned_credits == effective_credit_cap OR (effective_sqft_cap != null AND assigned_square_feet == effective_sqft_cap)"
        side_effects:
          - "sets compliance_state = AT_LIMIT; the roster still accepts clock-in and assignment starts"
        note: "Boundary dimension: equality lands on AT_LIMIT, strictly greater lands on BREACH_BLOCKED."
      - from: AT_LIMIT
        to: COMPLIANT
        trigger: "system recomputation after an assignment is CANCELLED or DEFERRED"
        actor: system
        preconditions:
          - "assigned_credits < effective_credit_cap AND (effective_sqft_cap == null OR assigned_square_feet < effective_sqft_cap)"
        side_effects:
          - "sets compliance_state = COMPLIANT"
      - from: COMPLIANT
        to: BREACH_BLOCKED
        trigger: "system recomputation after PATCH /housekeeping/attendants/{id} sets restricted_duty = true, or after a system-generated re-clean assignment is inserted"
        actor: system
        preconditions:
          - "assigned_credits > effective_credit_cap OR (effective_sqft_cap != null AND assigned_square_feet > effective_sqft_cap)"
          - "waiver_state != GRANTED"
        side_effects:
          - "sets compliance_state = BREACH_BLOCKED, which blocks POST /housekeeping/shift-rosters/{id}/clock-in and POST /housekeeping/room-assignments/{id}/start"
        note: "Operator-driven assignment creation can never reach this state - validations[priority=15] and [priority=16] reject the create first. Only the restricted-duty cascade and the ordinance carve-out for system-generated re-cleans can push a roster over its ceiling."
      - from: AT_LIMIT
        to: BREACH_BLOCKED
        trigger: "system recomputation after PATCH /housekeeping/attendants/{id} sets restricted_duty = true, or after a system-generated re-clean assignment is inserted"
        actor: system
        preconditions:
          - "assigned_credits > effective_credit_cap OR (effective_sqft_cap != null AND assigned_square_feet > effective_sqft_cap)"
          - "waiver_state != GRANTED"
        side_effects:
          - "sets compliance_state = BREACH_BLOCKED"
      - from: BREACH_BLOCKED
        to: WAIVER_GRANTED
        trigger: "POST /housekeeping/shift-rosters/{id}/waiver-decision with decision == GRANT"
        actor: ComplianceOfficer
        preconditions:
          - "waiver_state == REQUESTED"
          - "assigned_credits <= waiver_requested_credits"
        side_effects:
          - "sets compliance_state = WAIVER_GRANTED, which re-opens clock-in and assignment starts"
      - from: BREACH_BLOCKED
        to: COMPLIANT
        trigger: "system recomputation after an over-cap assignment is CANCELLED"
        actor: system
        preconditions:
          - "assigned_credits < effective_credit_cap AND (effective_sqft_cap == null OR assigned_square_feet < effective_sqft_cap)"
        side_effects:
          - "sets compliance_state = COMPLIANT"

  - entity: ShiftRoster
    dimension: waiver_state
    initial_state: NONE
    terminal_states: [GRANTED, DENIED]
    transitions:
      - from: NONE
        to: REQUESTED
        trigger: "POST /housekeeping/shift-rosters/{id}/waiver-request"
        actor: Supervisor
        preconditions:
          - "roster.waiver_state == NONE (ERR_WAIVER_ALREADY_DECIDED)"
          - "roster.status IN {PLANNED, CLOCKED_IN}"
          - "requested_credits <= effective_credit_cap * (1.25 when Property.ordinance_profile IN {NONE, SQFT_CAP_2200}, 1.00 when Property.ordinance_profile == CREDIT_CAP_STRICT) (ERR_WAIVER_EXCEEDS_ORDINANCE_MAX)"
        side_effects:
          - "stamps waiver_requested_credits and waiver_requested_by_user_id = X-User-ID; sets waiver_state = REQUESTED; increments version by 1"
      - from: REQUESTED
        to: GRANTED
        trigger: "POST /housekeeping/shift-rosters/{id}/waiver-decision with decision == GRANT"
        actor: ComplianceOfficer
        preconditions:
          - "roster.waiver_state == REQUESTED (ERR_WAIVER_NOT_REQUESTED)"
          - "X-User-ID != roster.waiver_requested_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "stamps waiver_decided_by_user_id; sets waiver_state = GRANTED"
          - "recomputes compliance_state per calculations.roster_workload_compliance, which yields WAIVER_GRANTED when assigned_credits <= waiver_requested_credits"
          - "increments version by 1"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /housekeeping/shift-rosters/{id}/waiver-decision with decision == DENY"
        actor: ComplianceOfficer
        preconditions:
          - "roster.waiver_state == REQUESTED (ERR_WAIVER_NOT_REQUESTED)"
          - "X-User-ID != roster.waiver_requested_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "stamps waiver_decided_by_user_id; sets waiver_state = DENIED"
          - "recomputes compliance_state ignoring the waiver, so a roster over its ceiling stays BREACH_BLOCKED"
          - "increments version by 1"

  - entity: RoomAssignment
    dimension: status
    initial_state: ASSIGNED
    terminal_states: [INSPECTED_PASS, RECLEAN_REQUIRED, CANCELLED, DEFERRED]
    transitions:
      - from: ASSIGNED
        to: IN_PROGRESS
        trigger: "POST /housekeeping/room-assignments/{id}/start"
        actor: RoomAttendant
        preconditions:
          - "assignment.status == ASSIGNED (ERR_ASSIGNMENT_NOT_ASSIGNED)"
          - "X-User-ID == roster.attendant_id (ERR_NOT_ASSIGNMENT_OWNER)"
          - "roster.status == CLOCKED_IN (cross-entity gate; ERR_ROSTER_NOT_CLOCKED_IN)"
          - "roster.compliance_state != BREACH_BLOCKED (ERR_ROSTER_WORKLOAD_BREACH)"
          - "no other assignment with the same room_id has status == IN_PROGRESS (ERR_ROOM_ALREADY_IN_SERVICE)"
        side_effects:
          - "stamps started_at from the body or, when omitted, from the logical clock"
          - "sets status = IN_PROGRESS; sets Room.cleanliness_status = IN_SERVICE; increments both versions by 1"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /housekeeping/room-assignments/{id}/complete"
        actor: RoomAttendant
        preconditions:
          - "assignment.status == IN_PROGRESS (ERR_ASSIGNMENT_NOT_IN_PROGRESS)"
          - "X-User-ID == roster.attendant_id (ERR_NOT_ASSIGNMENT_OWNER)"
          - "completed_at > started_at (ERR_INVALID_TIME_WINDOW)"
          - "the window [started_at, completed_at) does not overlap the window of another assignment on the same room_id with status IN {COMPLETED, INSPECTED_PASS, RECLEAN_REQUIRED} (ERR_ROOM_WINDOW_OVERLAP)"
          - "the window expanded by Property.rest_buffer_minutes does not touch the window of another assignment on the same roster_id with status IN {COMPLETED, INSPECTED_PASS, RECLEAN_REQUIRED} (ERR_REST_BUFFER_VIOLATION)"
        side_effects:
          - "stamps completed_at from the body or, when omitted, from the logical clock; computes actual_minutes"
          - "sets status = COMPLETED; sets Room.cleanliness_status = CLEAN; sets Room.last_serviced_business_date = forecast_day.business_date; when service_type == DEEP_CLEAN also sets Room.last_deep_cleaned_business_date"
          - "conditional cascade: when a LinenItem with linen_type == SHEET_SET exists for the property AND service_type != STAYOVER, debits linen_sets_debited = RoomType.linen_sets_per_room from LinenItem.on_hand_clean into LinenItem.soiled_queue, then recomputes coverage_ratio and shortage_status; when no SHEET_SET item exists the debit is skipped and linen_sets_debited stays 0"
          - "recomputes ShiftRoster.rooms_completed_gross and rooms_credited_net; increments assignment, room and (when debited) linen item versions by 1"
      - from: COMPLETED
        to: INSPECTED_PASS
        trigger: "POST /housekeeping/inspections with a computed result == PASS"
        actor: Supervisor
        preconditions:
          - "assignment.status == COMPLETED (ERR_ASSIGNMENT_NOT_COMPLETED)"
        side_effects:
          - "sets status = INSPECTED_PASS; sets Room.cleanliness_status = INSPECTED_PASS"
          - "recomputes ShiftRoster.inspections_completed; increments versions by 1"
        note: "Fork branch A of the COMPLETED fork; carries no re-clean, no probation and no credit change."
      - from: COMPLETED
        to: RECLEAN_REQUIRED
        trigger: "POST /housekeeping/inspections with a computed result == FAIL"
        actor: Supervisor
        preconditions:
          - "assignment.status == COMPLETED (ERR_ASSIGNMENT_NOT_COMPLETED)"
        side_effects:
          - "hop 1: sets status = RECLEAN_REQUIRED"
          - "hop 2a: because the assignment became RECLEAN_REQUIRED and reclean_generation < 2, inserts a new RoomAssignment on the same roster_id and room_id with supersedes_assignment_id = this.id, reclean_generation = this.reclean_generation + 1, status = ASSIGNED and credits from calculations.assignment_credit_value (re-clean factor applied); sets Room.cleanliness_status = RECLEAN_REQUIRED"
          - "hop 2b: when reclean_generation == 2 no re-clean row is inserted and Room.cleanliness_status = OUT_OF_ORDER instead"
          - "hop 3: because a re-clean row was inserted, ShiftRoster.assigned_credits and assigned_square_feet grow and compliance_state is recomputed - the system-generated re-clean is exempt from the pre-create ordinance checks, so compliance_state MAY land on BREACH_BLOCKED"
          - "hop 4: because ShiftRoster.assigned_credits changed, ForecastDay.allocated_credits_total is recomputed"
          - "branch off hop 1: sets Attendant.quality_probation = true and increments Attendant.lifetime_fail_count by 1, which raises ShiftRoster.required_inspection_samples through calculations.inspection_sampling_plan"
        note: "Fork branch B of the COMPLETED fork; divergent side-effect set from branch A."
      - from: ASSIGNED
        to: CANCELLED
        trigger: "POST /housekeeping/room-assignments/{id}/cancel"
        actor: Supervisor
        preconditions:
          - "assignment.status == ASSIGNED (ERR_ASSIGNMENT_TERMINAL)"
        side_effects:
          - "sets status = CANCELLED, which removes credits from the counted set"
          - "recomputes ShiftRoster.assigned_credits and assigned_square_feet, then compliance_state"
          - "recomputes ForecastDay.allocated_credits_total, restoring the conserved day quantity to its pre-create value"
          - "increments assignment and roster versions by 1"
      - from: ASSIGNED
        to: DEFERRED
        trigger: "system: linen shortage escalation cascade from POST /housekeeping/laundry-cycles/{id}/return, or roster close sweep"
        actor: system
        preconditions:
          - "assignment.status == ASSIGNED"
          - "for the linen cascade: service_type == DEEP_CLEAN and the SHEET_SET LinenItem of the property has shortage_status == ESCALATED"
        side_effects:
          - "sets status = DEFERRED, which removes credits from ShiftRoster.assigned_credits and assigned_square_feet"
          - "recomputes ShiftRoster.compliance_state and ForecastDay.allocated_credits_total"

  - entity: Room
    dimension: cleanliness_status
    initial_state: DIRTY
    terminal_states: [OUT_OF_ORDER]
    transitions:
      - from: DIRTY
        to: IN_SERVICE
        trigger: "POST /housekeeping/room-assignments/{id}/start"
        actor: RoomAttendant
        preconditions:
          - "room.cleanliness_status IN {DIRTY, RECLEAN_REQUIRED, CLEAN, INSPECTED_PASS}"
          - "no other assignment on this room_id has status == IN_PROGRESS"
        side_effects:
          - "sets cleanliness_status = IN_SERVICE; increments version by 1"
      - from: IN_SERVICE
        to: CLEAN
        trigger: "POST /housekeeping/room-assignments/{id}/complete"
        actor: RoomAttendant
        preconditions:
          - "the completing assignment references this room_id"
        side_effects:
          - "sets cleanliness_status = CLEAN; stamps last_serviced_business_date; increments version by 1"
      - from: CLEAN
        to: INSPECTED_PASS
        trigger: "POST /housekeeping/inspections with result == PASS"
        actor: Supervisor
        preconditions:
          - "the inspected assignment references this room_id and has status == COMPLETED"
        side_effects:
          - "sets cleanliness_status = INSPECTED_PASS"
      - from: CLEAN
        to: RECLEAN_REQUIRED
        trigger: "POST /housekeeping/inspections with result == FAIL and the assignment's reclean_generation < 2"
        actor: Supervisor
        preconditions:
          - "the inspected assignment references this room_id and has status == COMPLETED"
        side_effects:
          - "sets cleanliness_status = RECLEAN_REQUIRED"
      - from: RECLEAN_REQUIRED
        to: IN_SERVICE
        trigger: "POST /housekeeping/room-assignments/{id}/start on the system-generated re-clean assignment"
        actor: RoomAttendant
        preconditions:
          - "the starting assignment has reclean_generation >= 1 and references this room_id"
        side_effects:
          - "sets cleanliness_status = IN_SERVICE, closing the service loop RECLEAN_REQUIRED -> IN_SERVICE -> CLEAN"
        note: "This edge plus CLEAN -> RECLEAN_REQUIRED makes the room condition machine cyclic; a room may traverse the loop at most twice because reclean_generation is capped at 2."
      - from: CLEAN
        to: DIRTY
        trigger: "PATCH /housekeeping/rooms/{id} with occupancy_state == DUE_OUT"
        actor: HousekeepingDirector
        preconditions:
          - "room.cleanliness_status IN {CLEAN, INSPECTED_PASS}"
        side_effects:
          - "sets cleanliness_status = DIRTY, returning the room to the head of the loop for the next business date"
      - from: INSPECTED_PASS
        to: DIRTY
        trigger: "PATCH /housekeeping/rooms/{id} with occupancy_state == DUE_OUT"
        actor: HousekeepingDirector
        preconditions:
          - "room.cleanliness_status IN {CLEAN, INSPECTED_PASS}"
        side_effects:
          - "sets cleanliness_status = DIRTY"
      - from: RECLEAN_REQUIRED
        to: OUT_OF_ORDER
        trigger: "POST /housekeeping/inspections with result == FAIL on an assignment whose reclean_generation == 2"
        actor: Supervisor
        preconditions:
          - "the failing assignment has reclean_generation == 2"
        side_effects:
          - "sets cleanliness_status = OUT_OF_ORDER; no further re-clean assignment is generated"
      - from: DIRTY
        to: OUT_OF_ORDER
        trigger: "PATCH /housekeeping/rooms/{id} with cleanliness_status == OUT_OF_ORDER"
        actor: HousekeepingDirector
        preconditions:
          - "room.cleanliness_status != IN_SERVICE (ERR_ROOM_ALREADY_IN_SERVICE)"
        side_effects:
          - "sets cleanliness_status = OUT_OF_ORDER; increments version by 1"

  - entity: LaundryCycle
    dimension: status
    initial_state: QUEUED
    terminal_states: [RETURNED, LATE_ESCALATED, VOIDED]
    transitions:
      - from: QUEUED
        to: RETURNED
        trigger: "POST /housekeeping/laundry-cycles/{id}/return with turnaround_minutes <= Property.laundry_sla_minutes"
        actor: LaundryLead
        preconditions:
          - "cycle.status == QUEUED (ERR_CYCLE_NOT_QUEUED)"
          - "returned_at >= dispatched_at (ERR_INVALID_TIME_WINDOW)"
          - "returned_sets <= batch_sets"
        side_effects:
          - "computes turnaround_minutes; sets sla_breach = false; sets status = RETURNED"
          - "moves returned_sets from LinenItem.in_laundry into LinenItem.on_hand_clean; writes off (batch_sets - returned_sets) against LinenItem.total_owned_sets and LinenItem.in_laundry so on_hand_clean + in_laundry + soiled_queue == total_owned_sets still holds"
          - "recomputes LinenItem.coverage_ratio and shortage_status; increments both versions by 1"
      - from: QUEUED
        to: LATE_ESCALATED
        trigger: "POST /housekeeping/laundry-cycles/{id}/return with turnaround_minutes > Property.laundry_sla_minutes"
        actor: LaundryLead
        preconditions:
          - "cycle.status == QUEUED (ERR_CYCLE_NOT_QUEUED)"
          - "returned_at >= dispatched_at (ERR_INVALID_TIME_WINDOW)"
        side_effects:
          - "hop 1: computes turnaround_minutes, sets sla_breach = true and status = LATE_ESCALATED"
          - "hop 2: because this cycle became LATE_ESCALATED, the linen sets move back to on_hand_clean and LinenItem.shortage_status is forced to ESCALATED by calculations.linen_coverage_status regardless of coverage_ratio"
          - "hop 3: because LinenItem.shortage_status became ESCALATED, every RoomAssignment with service_type == DEEP_CLEAN and status == ASSIGNED whose roster's forecast day belongs to the same property and has status == PUBLISHED moves to DEFERRED, processed in created_at ASC order"
          - "hop 4: because those assignments became DEFERRED, each affected ShiftRoster recomputes assigned_credits, assigned_square_feet and compliance_state"
          - "hop 5: because roster assigned_credits changed, each affected ForecastDay recomputes allocated_credits_total"
      - from: QUEUED
        to: VOIDED
        trigger: "POST /housekeeping/laundry-cycles/{id}/void"
        actor: LaundryLead
        preconditions:
          - "cycle.status == QUEUED (ERR_CYCLE_NOT_QUEUED)"
        side_effects:
          - "sets status = VOIDED; moves batch_sets from LinenItem.in_laundry back into LinenItem.soiled_queue, which is the exact compensation of the dispatch"
          - "recomputes LinenItem.coverage_ratio and shortage_status; increments both versions by 1"

  - entity: LostFoundItem
    dimension: status
    initial_state: LOGGED
    terminal_states: [RELEASED, SHIPPED, DISPOSED, DONATED]
    transitions:
      - from: LOGGED
        to: STORED
        trigger: "POST /housekeeping/lost-found-items/{id}/store"
        actor: FrontDeskAgent
        preconditions:
          - "item.status == LOGGED (ERR_ITEM_NOT_LOGGED)"
        side_effects:
          - "stamps storage_bin and stored_at = logical clock; computes retention_days and retention_expires_at per calculations.lost_found_retention_window; increments version by 1"
      - from: STORED
        to: CLAIM_PENDING
        trigger: "POST /housekeeping/lost-found-items/{id}/claim"
        actor: FrontDeskAgent
        preconditions:
          - "item.status == STORED (ERR_ITEM_NOT_STORED)"
          - "logical clock < retention_expires_at (ERR_RETENTION_EXPIRED)"
          - "proof_kind == PHOTO_ID when category IN {HIGH_VALUE, ID_DOCUMENT} (ERR_PROOF_INSUFFICIENT)"
        side_effects:
          - "stamps claimant_name, claimant_contact, proof_kind; increments claim_attempt_count by 1; sets status = CLAIM_PENDING; increments version by 1"
      - from: CLAIM_PENDING
        to: RELEASED
        trigger: "POST /housekeeping/lost-found-items/{id}/claim-decision with decision == APPROVE_PICKUP"
        actor: FrontDeskAgent
        preconditions:
          - "item.status == CLAIM_PENDING (ERR_CLAIM_NOT_PENDING)"
        side_effects:
          - "sets status = RELEASED; clears storage_bin; leaves tracking_code null"
        note: "Fork branch 1 of the claim decision; divergent side-effect set from APPROVE_SHIP and DENY."
      - from: CLAIM_PENDING
        to: SHIPPED
        trigger: "POST /housekeeping/lost-found-items/{id}/claim-decision with decision == APPROVE_SHIP"
        actor: FrontDeskAgent
        preconditions:
          - "item.status == CLAIM_PENDING (ERR_CLAIM_NOT_PENDING)"
          - "tracking_code is present in the body (ERR_INVALID_REQUEST)"
        side_effects:
          - "sets status = SHIPPED; stamps tracking_code; clears storage_bin"
        note: "Fork branch 2 of the claim decision."
      - from: CLAIM_PENDING
        to: STORED
        trigger: "POST /housekeeping/lost-found-items/{id}/claim-decision with decision == DENY"
        actor: FrontDeskAgent
        preconditions:
          - "item.status == CLAIM_PENDING (ERR_CLAIM_NOT_PENDING)"
          - "denial_reason is present in the body (ERR_INVALID_REQUEST)"
        side_effects:
          - "stamps denial_reason; clears claimant_name and claimant_contact; keeps storage_bin, stored_at and retention_expires_at untouched; sets status = STORED"
        note: "Fork branch 3 closes the cycle STORED -> CLAIM_PENDING -> STORED, so a second claimant may file inside the same retention window."
      - from: STORED
        to: DISPOSED
        trigger: "POST /housekeeping/lost-found-items/{id}/dispose with disposition == DISPOSED"
        actor: FrontDeskAgent
        preconditions:
          - "item.status == STORED (ERR_ITEM_NOT_STORED)"
          - "logical clock >= retention_expires_at (ERR_RETENTION_ACTIVE)"
        side_effects:
          - "sets status = DISPOSED; clears storage_bin; increments version by 1"
      - from: STORED
        to: DONATED
        trigger: "POST /housekeeping/lost-found-items/{id}/dispose with disposition == DONATED"
        actor: FrontDeskAgent
        preconditions:
          - "item.status == STORED (ERR_ITEM_NOT_STORED)"
          - "logical clock >= retention_expires_at (ERR_RETENTION_ACTIVE)"
          - "category IN {STANDARD, PERISHABLE} (ERR_DISPOSITION_NOT_PERMITTED)"
        side_effects:
          - "sets status = DONATED; clears storage_bin; increments version by 1"

  - entity: ServiceEnrollment
    dimension: status
    initial_state: ACTIVE
    terminal_states: [COMPLETED, VOIDED]
    transitions:
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /housekeeping/service-enrollments/{id}/accrue on the accrual that makes skips_accrued == nights"
        actor: FrontDeskAgent
        preconditions:
          - "enrollment.status == ACTIVE (ERR_ENROLLMENT_NOT_ACTIVE)"
          - "skips_accrued < skip_budget (ERR_ENROLLMENT_SKIPS_EXHAUSTED), where skip_budget = nights when program == OPT_OUT and ceil(nights / 2) when program == EVERY_OTHER_DAY - an every-other-day guest cannot skip every night (validations priority 39)"
        side_effects:
          - "increments skips_accrued by 1; recomputes points_accrued = skips_accrued * points_per_skip"
          - "recomputes Property.outstanding_incentive_points"
          - "sets status = COMPLETED when skips_accrued == nights, otherwise leaves status = ACTIVE"
          - "increments version by 1"
        note: "An accrual that leaves skips_accrued < nights is a self-edge on ACTIVE with the same side effects except the status change. Because skip_budget is ceil(nights / 2) for EVERY_OTHER_DAY, such an enrollment exhausts its skip budget while still ACTIVE and its next accrual is refused with ERR_ENROLLMENT_SKIPS_EXHAUSTED; an OPT_OUT enrollment instead reaches COMPLETED on the accrual that makes skips_accrued == nights."
      - from: ACTIVE
        to: VOIDED
        trigger: "POST /housekeeping/service-enrollments/{id}/void"
        actor: FrontDeskAgent
        preconditions:
          - "enrollment.status == ACTIVE (ERR_ENROLLMENT_NOT_ACTIVE)"
        side_effects:
          - "sets skips_accrued = 0 and points_accrued = 0; sets status = VOIDED"
          - "resets Room.service_program = DAILY, the exact compensation of the enrollment's creation side effect"
          - "recomputes Property.outstanding_incentive_points back to its pre-enrollment value"
          - "increments enrollment and room versions by 1"

concurrency_rules:
  - rule_id: assignment-create-stale-roster
    parent_entity: ShiftRoster
    write_endpoint: "POST /housekeeping/room-assignments"
    occ_field: "expected_roster_version"
    description: |
      Creating a RoomAssignment against a ShiftRoster whose version has advanced since the client
      last observed it is rejected. Adding a further room to a roster is legitimate product
      behaviour, so the server cannot fall back on a state precondition; the ordinance ceilings in
      validations[priority=15] and [priority=16] are evaluated against the roster's credit and
      square-foot totals, and a writer holding a stale view would size its request against
      superseded totals. The stale version check reduces that to a deterministic rejection.
    error_id: ERR_STALE_ROSTER_VERSION
    http_status: 412

  - rule_id: laundry-dispatch-stale-linen-item
    parent_entity: LinenItem
    write_endpoint: "POST /housekeeping/laundry-cycles"
    occ_field: "expected_linen_item_version"
    description: |
      Dispatching a LaundryCycle against a LinenItem whose version has advanced since the client
      last observed it is rejected. Dispatching a second batch out of the same soiled queue is
      legitimate product behaviour, and every assignment completion also debits the same linen
      ledger, so the caller's view of soiled_queue, in_laundry and the aggregate laundry capacity
      may be superseded. The stale version check turns that into a deterministic rejection.
    error_id: ERR_STALE_LINEN_VERSION
    http_status: 412

calculations:
  - name: forecast_required_credits
    trigger: "POST /housekeeping/forecast-days (creation), POST /housekeeping/forecast-days/{id}/publish (variant PROJECTED_INVENTORY_MIX writes ForecastDay.projected_required_credits); POST /housekeeping/forecast-days/{id}/close (variant ACTUAL_RECONCILED writes ForecastDay.actual_reconciled_credits)"
    algorithm: forward_looking
    formula: |
      # ---- variant PROJECTED_INVENTORY_MIX (forward-looking) ----
      checkout_rooms  = forecast_departures
      stayover_rooms  = forecast_occupied_rooms - forecast_arrivals
      deep_rooms      = planned_deep_clean_rooms

      # PINNED EVALUATION AND ROUNDING ORDER: iterate RoomType rows of the property in
      # code ASC order, round EACH room type's raw credits to 2 decimals half-up, and only
      # then sum the rounded per-type figures. The competing reading - sum the raw
      # per-type figures first and round once at the end - is REJECTED and produces a
      # different number whenever two types each carry a half-cent tail.
      per_type_rounded = []
      for t in RoomType rows with property_id == forecast_day.property_id ordered by code ASC:
          share_t = t.room_count / Property.total_rooms          # exact rational, never rounded here
          raw_t   = (checkout_rooms * share_t) * t.checkout_credits
                  + (stayover_rooms * share_t) * t.stayover_credits
                  + (deep_rooms     * share_t) * t.deep_clean_credits
          per_type_rounded.append(round_half_up(raw_t, 2))
      projected_required_credits = round_half_up(sum(per_type_rounded), 2)
      # Property.total_rooms == 0  ->  projected_required_credits = 0.00

      # ---- variant ACTUAL_RECONCILED (chronological) ----
      # Work actually performed, read off the assignment ledger instead of the inventory mix.
      actual_reconciled_credits = round_half_up(
          sum(a.credits for a in RoomAssignment
              if a.roster_id IN (rosters of this forecast day)
              and a.status IN {COMPLETED, INSPECTED_PASS, RECLEAN_REQUIRED}), 2)
    input_set: |
      PROJECTED_INVENTORY_MIX reads only ForecastDay input counters plus the CURRENT RoomType
      room_count values and Property.total_rooms; it ignores every RoomAssignment row.
      ACTUAL_RECONCILED reads only RoomAssignment rows whose status IN
      {COMPLETED, INSPECTED_PASS, RECLEAN_REQUIRED} - ASSIGNED, IN_PROGRESS, CANCELLED and DEFERRED
      rows are excluded, so deferred deep cleans and cancelled rooms never enter the reconciliation.
    constants:
      ROUNDING: round_half_up
    precision: "2 decimal places, round_half_up, applied per room type and then once to the sum"
    variants:
      - name: PROJECTED_INVENTORY_MIX
        when: "ForecastDay creation and publish"
        difference: "Derives demand from occupancy and arrival/departure mix spread across the room-type inventory share; a room type with no rooms contributes 0."
      - name: ACTUAL_RECONCILED
        when: "ForecastDay close"
        difference: "Derives demand from the credits of assignments actually performed, so the same day yields a different number than the projection whenever the mix assumption or the deferral pattern differs."

  - name: required_attendant_headcount
    trigger: "POST /housekeeping/forecast-days and POST /housekeeping/forecast-days/{id}/publish, writing ForecastDay.required_attendants"
    algorithm: threshold
    formula: |
      credits_per_shift  = (Property.standard_shift_minutes - Property.pre_post_shift_minutes)
                           / Property.credit_minute_value
      assignable_ceiling = min(credits_per_shift, Property.max_daily_credits)
      required_attendants = 0 if projected_required_credits == 0
                            else ceil(projected_required_credits / assignable_ceiling)
    input_set: "Property configuration plus the just-computed projected_required_credits of the same request."
    constants:
      CEILING_MODE: "ceil on the exact rational quotient, never on a pre-rounded quotient"
    precision: "integer"

  - name: forecast_credit_variance
    trigger: "POST /housekeeping/forecast-days/{id}/close, writing ForecastDay.credit_variance_pct"
    algorithm: aggregation
    formula: |
      credit_variance_pct = null if projected_required_credits == 0
        else round_half_up((actual_reconciled_credits - projected_required_credits)
                           / projected_required_credits * 100, 2)
    input_set: "The two variants of forecast_required_credits on the same ForecastDay row."
    precision: "2 decimal places, round_half_up; the value is signed"

  - name: assignment_credit_value
    trigger: "POST /housekeeping/room-assignments and the system insertion of a re-clean assignment on an inspection FAIL, writing RoomAssignment.credits"
    algorithm: tiered_pricing
    formula: |
      base = { CHECKOUT:      RoomType.checkout_credits,
               STAYOVER:      RoomType.stayover_credits,
               DEEP_CLEAN:    RoomType.deep_clean_credits,
               LINEN_REFRESH: LINEN_REFRESH_CREDITS }[service_type]

      program_factor = 0.50 if (Room.service_program == EVERY_OTHER_DAY and service_type == STAYOVER)
                       else 1.00                      # CHECKOUT and DEEP_CLEAN never discount
      reclean_factor = RECLEAN_CREDIT_FACTOR if reclean_generation >= 1 else 1.00

      raw     = base * program_factor * reclean_factor
      snapped = round_half_up(raw / QUARTER_CREDIT, 0) * QUARTER_CREDIT   # snap to quarter credits
      credits = min(MAX_SINGLE_ROOM_CREDITS, max(QUARTER_CREDIT, snapped))
      # Worked example chain: SUITE deep clean base 3.50 -> snapped 3.50 -> clamped to 3.00.
      # Worked example chain: KING checkout base 1.00 at generation 1 -> raw 0.60
      #   -> 0.60/0.25 = 2.4 -> round_half_up -> 2 -> 0.50.
      # Worked example chain: SUITE checkout base 2.00 at generation 1 -> raw 1.20
      #   -> 1.20/0.25 = 4.8 -> round_half_up -> 5 -> 1.25.
    input_set: "The assignment's own service_type and reclean_generation, the Room.service_program in force at creation time, and the RoomType credit columns of the room's type."
    constants:
      QUARTER_CREDIT: 0.25
      MAX_SINGLE_ROOM_CREDITS: 3.00
      LINEN_REFRESH_CREDITS: 0.25
      RECLEAN_CREDIT_FACTOR: 0.60
    precision: "quarter credits; the division is rounded half-up to an integer number of quarters, then the floor and ceiling clamps apply in that order"

  - name: roster_workload_compliance
    trigger: "every mutation that changes RoomAssignment.status or credits on the roster, PATCH /housekeeping/attendants/{id}, and POST /housekeeping/shift-rosters/{id}/waiver-decision; writes ShiftRoster.assigned_credits, assigned_square_feet, effective_credit_cap, effective_sqft_cap and compliance_state"
    algorithm: threshold
    formula: |
      counted = assignments with roster_id == roster.id and
                status IN {ASSIGNED, IN_PROGRESS, COMPLETED, INSPECTED_PASS, RECLEAN_REQUIRED}
      assigned_credits      = round_half_up(sum(a.credits for a in counted), 2)
      assigned_square_feet  = sum(a.square_feet_snapshot for a in counted)

      effective_credit_cap  = round_half_up(Property.max_daily_credits
                                * (RESTRICTED_DUTY_FACTOR if Attendant.restricted_duty else 1.00), 2)
      effective_sqft_cap    = Property.max_daily_square_feet
                              if Property.ordinance_profile == SQFT_CAP_2200 else null

      over_credits = assigned_credits > effective_credit_cap
      over_sqft    = effective_sqft_cap != null and assigned_square_feet > effective_sqft_cap
      at_credits   = assigned_credits == effective_credit_cap
      at_sqft      = effective_sqft_cap != null and assigned_square_feet == effective_sqft_cap

      if waiver_state == GRANTED and assigned_credits <= waiver_requested_credits and not over_sqft:
          compliance_state = WAIVER_GRANTED
      elif over_credits or over_sqft:  compliance_state = BREACH_BLOCKED
      elif at_credits or at_sqft:      compliance_state = AT_LIMIT
      else:                            compliance_state = COMPLIANT
    input_set: "CANCELLED and DEFERRED assignments are excluded from both sums; every other status is counted, including RECLEAN_REQUIRED rows that have been superseded."
    constants:
      RESTRICTED_DUTY_FACTOR: 0.75
      WAIVER_HEADROOM_FACTOR_DEFAULT: 1.25
      WAIVER_HEADROOM_FACTOR_STRICT: 1.00
    precision: "credits to 2 decimals round_half_up; square feet are integers; comparisons are exact - equality lands on AT_LIMIT, strictly greater lands on BREACH_BLOCKED"

  - name: shift_settlement
    trigger: "POST /housekeeping/shift-rosters/{id}/close, writing ShiftRoster.paid_minutes and overtime_minutes"
    algorithm: waterfall_allocation
    formula: |
      # PINNED EVALUATION ORDER - the guarantee gap looks circular because it is defined from
      # the minimum it then helps satisfy. Evaluate strictly in these numbered steps:
      # 1. worked_minutes            <- request body
      # 2. guarantee_gap             = max(0, Property.min_daily_paid_minutes - worked_minutes)
      # 3. paid_minutes              = worked_minutes + guarantee_gap
      # 4. overtime_minutes          = max(0, paid_minutes - Property.standard_shift_minutes)
      # 5. productive_minutes        = worked_minutes - break_minutes
      #    PINNED: productive_minutes is derived from worked_minutes, NEVER from paid_minutes.
      #    The competing reading (paid_minutes - break_minutes) inflates productivity on any
      #    short shift that was lifted by the daily minimum and is REJECTED.
    input_set: "Only the closing roster's own worked_minutes and break_minutes plus Property configuration."
    constants:
      GUARANTEE_BASIS: min_daily_paid_minutes
    precision: "integer minutes"

  - name: minutes_per_room
    trigger: "POST /housekeeping/shift-rosters/{id}/close, writing ShiftRoster.minutes_per_room_gross, minutes_per_room_net, target_minutes_per_room and productivity_flag"
    algorithm: aggregation
    formula: |
      performed = assignments with roster_id == roster.id and
                  status IN {COMPLETED, INSPECTED_PASS, RECLEAN_REQUIRED}
      rooms_completed_gross = count(performed)
      rooms_credited_net    = count(distinct a.room_id for a in performed)
      productive_minutes    = worked_minutes - break_minutes        # step 5 of shift_settlement

      minutes_per_room_gross = null if rooms_completed_gross == 0
                               else round_half_up(productive_minutes / rooms_completed_gross, 2)
      minutes_per_room_net   = null if rooms_credited_net == 0
                               else round_half_up(productive_minutes / rooms_credited_net, 2)
      target_minutes_per_room = null if rooms_credited_net == 0
                               else round_half_up(assigned_credits * Property.credit_minute_value
                                                  / rooms_credited_net, 2)

      # Quality guardrail outranks the minutes comparison.
      if any(a.reclean_generation >= 1 for a in assignments with roster_id == roster.id
             and status != CANCELLED):        productivity_flag = QUALITY_HOLD
      elif rooms_credited_net == 0:           productivity_flag = PENDING
      elif minutes_per_room_net <= target_minutes_per_room: productivity_flag = ON_TARGET
      else:                                   productivity_flag = OVER_TARGET
    input_set: "Only performed assignments enter both counters; ASSIGNED rows have already been swept to DEFERRED by the close transition, and CANCELLED/DEFERRED rows are excluded from every counter."
    precision: "2 decimal places, round_half_up; the ON_TARGET comparison is inclusive at equality"
    variants:
      - name: GROSS_PHYSICAL
        when: "ShiftRoster.minutes_per_room_gross - the operational reading used for labour standards"
        difference: "Divides by the number of physical cleans, so a re-cleaned room is counted twice and the attendant's minutes-per-room looks better."
      - name: NET_CREDITED_ROOMS
        when: "ShiftRoster.minutes_per_room_net - the payroll reading used for the productivity flag"
        difference: "Divides by distinct rooms, so a re-cleaned room is counted once and the same minutes yield a strictly larger figure whenever any re-clean exists."

  - name: shift_labor_cost
    trigger: "POST /housekeeping/shift-rosters/{id}/close, writing ShiftRoster.base_wage_cents, ordinance_premium_cents and total_labor_cost_cents"
    algorithm: tiered_pricing
    formula: |
      base_wage_cents = round_half_up(paid_minutes * Attendant.hourly_rate_cents / 60, 0)

      # PINNED EVALUATION ORDER for the circular-looking tier: the ordinance premium is a
      # percentage of the wage, and the percentage is selected by a tier. The tier is keyed on
      # base_wage_cents, NOT on total_labor_cost_cents. The competing reading - key the tier on
      # the total that already contains the premium - is REJECTED; it lifts a base of 29800 into
      # the 7 percent tier and yields 31886 instead of the correct 30992.
      premium_applies = overtime_minutes > 0 or compliance_state == WAIVER_GRANTED
      tier_pct = 0.00 if base_wage_cents < PREMIUM_TIER_1_FLOOR
                 else (PREMIUM_TIER_1_PCT if base_wage_cents < PREMIUM_TIER_2_FLOOR
                       else PREMIUM_TIER_2_PCT)
      ordinance_premium_cents = round_half_up(base_wage_cents * tier_pct, 0) if premium_applies else 0
      total_labor_cost_cents  = base_wage_cents + ordinance_premium_cents
    input_set: "paid_minutes and overtime_minutes from shift_settlement of the same close request, compliance_state as recomputed by that close, and Attendant.hourly_rate_cents."
    constants:
      PREMIUM_TIER_1_FLOOR: 20000
      PREMIUM_TIER_2_FLOOR: 30000
      PREMIUM_TIER_1_PCT: 0.04
      PREMIUM_TIER_2_PCT: 0.07
    precision: "whole cents, round_half_up on each of the two roundings; the tier selection itself is an exact integer comparison"

  - name: inspection_quality_score
    trigger: "POST /housekeeping/inspections, writing Inspection.score_pct, critical_fail and result"
    algorithm: weighted_scoring
    formula: |
      raw = 0.30 * bathroom_points + 0.25 * linen_points + 0.20 * dust_points
          + 0.15 * amenity_points  + 0.10 * floor_points          # raw lands in 0.00 .. 10.00
      score_pct    = round_half_up(raw * 10, 1)
      critical_fail = (bathroom_points <= CRITICAL_ITEM_FLOOR) or (linen_points <= CRITICAL_ITEM_FLOOR)
      result = FAIL if critical_fail or score_pct < Property.reclean_threshold_score else PASS
      # Worked examples: (9,8,8,8,10) -> 85.0 -> PASS at the exact threshold.
      #                  (9,8,8,8,9)  -> 84.0 -> FAIL.
      #                  (6,10,10,10,10) -> 88.0 but critical_fail -> FAIL above the threshold.
    input_set: "The five item scores on this request only; no history is consulted."
    constants:
      W_BATHROOM: 0.30
      W_LINEN: 0.25
      W_DUST: 0.20
      W_AMENITY: 0.15
      W_FLOOR: 0.10
      CRITICAL_ITEM_FLOOR: 6
    precision: "score_pct to 1 decimal, round_half_up; the PASS comparison is inclusive at Property.reclean_threshold_score"

  - name: inspection_sampling_plan
    trigger: "GET /housekeeping/shift-rosters/{id}/inspection-sample-plan (read), and every mutation of an assignment status or of Attendant.quality_probation (writes ShiftRoster.required_inspection_samples)"
    algorithm: threshold
    formula: |
      completed_count = count(assignments with roster_id == roster.id and
                              status IN {COMPLETED, INSPECTED_PASS, RECLEAN_REQUIRED})
      rate = Property.probation_sample_rate if Attendant.quality_probation
             else Property.inspection_sample_rate
      required_inspection_samples = 0 if completed_count == 0
             else min(completed_count, max(1, ceil(completed_count * rate)))
      remaining_samples = max(0, required_inspection_samples - inspections_completed)

      # Selector for WHICH rooms to inspect next - fully pinned, no random input:
      #   eligibility filter : assignments with roster_id == roster.id and status == COMPLETED
      #                        (already inspected rows have left COMPLETED)
      #   ranking expression : credits DESC, then Room.room_number ASC, then created_at ASC
      #   tie-break          : created_at ASC (the id field is never consulted)
      #   empty-pool fallback: selected_assignment_ids = [] with no error; required_samples is
      #                        still reported so the caller can see the outstanding obligation
      selected_assignment_ids = first `remaining_samples` ids of the ranked eligible list
    input_set: "Only assignments of this roster; CANCELLED, DEFERRED, ASSIGNED and IN_PROGRESS rows are excluded from completed_count and from the eligible pool."
    constants:
      MIN_SAMPLES_WHEN_ANY_COMPLETED: 1
    precision: "integer counts; ceil is applied to the exact rational product, so completed_count 5 at rate 0.20 requires exactly 1 sample, not 2"

  - name: linen_coverage_status
    trigger: "LinenItem creation, POST /housekeeping/linen-items/{id}/soil, assignment completion linen debit, and every LaundryCycle transition; writes LinenItem.par_required_sets, coverage_ratio and shortage_status"
    algorithm: threshold
    formula: |
      par_required_sets = sum(t.room_count * t.linen_sets_per_room
                              for t in RoomType rows with property_id == linen_item.property_id)
      coverage_ratio = null if par_required_sets == 0
                       else round_half_up(on_hand_clean / par_required_sets, 4)

      if any LaundryCycle with linen_item_id == this.id has status == LATE_ESCALATED:
          shortage_status = ESCALATED            # sticky while a late cycle exists
      elif coverage_ratio == null:      shortage_status = OK
      elif coverage_ratio >= 1.0000:    shortage_status = OK
      elif coverage_ratio >= 0.8500:    shortage_status = WATCH
      elif coverage_ratio >= 0.6000:    shortage_status = SHORTAGE
      else:                             shortage_status = ESCALATED
      # Ledger identity that must hold after every mutation:
      #   on_hand_clean + in_laundry + soiled_queue == total_owned_sets
    input_set: "All RoomType rows of the property regardless of room_count, plus every LaundryCycle of this linen item regardless of age."
    constants:
      WATCH_FLOOR: 0.8500
      SHORTAGE_FLOOR: 0.6000
    precision: "coverage_ratio to 4 decimals, round_half_up; each ladder comparison is inclusive at its floor"

  - name: laundry_turnaround
    trigger: "POST /housekeeping/laundry-cycles/{id}/return, writing LaundryCycle.turnaround_minutes and sla_breach"
    algorithm: interval_merge
    formula: |
      turnaround_minutes = floor((returned_at - dispatched_at) in seconds / 60)
      sla_breach         = turnaround_minutes > Property.laundry_sla_minutes
      status             = LATE_ESCALATED if sla_breach else RETURNED
      # Aggregate capacity rule enforced on dispatch instead of on return:
      #   occupied = sum(c.batch_sets for c in LaundryCycle
      #                  if c.linen_item_id resolves to the same property
      #                  and c.status IN {QUEUED, LATE_ESCALATED}
      #                  and c.dispatched_at < new.expected_return_at
      #                  and new.dispatched_at < c.expected_return_at)      # half-open overlap
      #   reject when occupied + new.batch_sets > Property.laundry_capacity_sets
    input_set: "Only the returning cycle's own two timestamps for turnaround; the capacity rule reads every QUEUED or LATE_ESCALATED cycle of the same property."
    constants:
      OVERLAP_SEMANTICS: "half-open [dispatched_at, expected_return_at); touching windows do not overlap"
    precision: "integer minutes, truncated toward zero; the SLA comparison is strictly greater"

  - name: lost_found_retention_window
    trigger: "POST /housekeeping/lost-found-items/{id}/store, writing LostFoundItem.retention_days and retention_expires_at"
    algorithm: decay_function
    formula: |
      retention_days = { HIGH_VALUE: 90, ID_DOCUMENT: 60, STANDARD: 30, PERISHABLE: 0 }[category]
      retention_expires_at = stored_at + retention_days days
      # The retention window is half-open [stored_at, retention_expires_at):
      #   a claim is accepted while clock < retention_expires_at
      #   disposal is accepted while clock >= retention_expires_at
      # PERISHABLE therefore has an EMPTY claim window - retention_expires_at == stored_at, so the
      # first claim is already expired and disposal is immediately permitted.
    input_set: "The item's own category and stored_at only."
    constants:
      RETENTION_HIGH_VALUE_DAYS: 90
      RETENTION_ID_DOCUMENT_DAYS: 60
      RETENTION_STANDARD_DAYS: 30
      RETENTION_PERISHABLE_DAYS: 0
    precision: "whole days added to the stored_at instant; the boundary instant itself belongs to the disposal side"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty on every request."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role names one of the six declared roles; an unrecognized role string is treated as unauthenticated, never as a permission failure."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 3
    category: auth
    check: "The recognized role appears in the target endpoint's roles list."
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 4
    category: business_constraint
    check: "Request body shape: every required input field present, JSON types correct, enum values inside their declared sets, integers non-negative where the field is a count or a minute total, and points fields inside 0..10. Includes the presence of expected_roster_version / expected_linen_item_version on the endpoints that declare them."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 5
    category: existence
    check: "Every id in the path resolves, validated left to right."
    error_id: "ERR_PROPERTY_NOT_FOUND | ERR_ROOM_TYPE_NOT_FOUND | ERR_ROOM_NOT_FOUND | ERR_ATTENDANT_NOT_FOUND | ERR_FORECAST_DAY_NOT_FOUND | ERR_ROSTER_NOT_FOUND | ERR_ASSIGNMENT_NOT_FOUND | ERR_INSPECTION_NOT_FOUND | ERR_LINEN_ITEM_NOT_FOUND | ERR_LAUNDRY_CYCLE_NOT_FOUND | ERR_LOST_FOUND_ITEM_NOT_FOUND | ERR_ENROLLMENT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id"

  - priority: 6
    category: existence
    check: "Every foreign key in the request body resolves, validated in the field order declared by the endpoint's input list. An X-User-ID that must resolve to an Attendant row (Supervisor, RoomAttendant) is checked here as ERR_ATTENDANT_NOT_FOUND."
    error_id: "ERR_PROPERTY_NOT_FOUND | ERR_ROOM_TYPE_NOT_FOUND | ERR_ROOM_NOT_FOUND | ERR_ATTENDANT_NOT_FOUND | ERR_FORECAST_DAY_NOT_FOUND | ERR_ROSTER_NOT_FOUND | ERR_ASSIGNMENT_NOT_FOUND | ERR_LINEN_ITEM_NOT_FOUND"
    http_status: 404
    applies_to: "all write endpoints carrying a foreign key"

  - priority: 7
    category: auth
    check: "Ownership: when the acting role is RoomAttendant, the targeted assignment's roster must belong to that attendant (X-User-ID == ShiftRoster.attendant_id). A RoomAttendant may only start and complete their own rooms and only clock in on their own roster."
    error_id: ERR_NOT_ASSIGNMENT_OWNER
    http_status: 403
    applies_to: "POST /housekeeping/room-assignments/{id}/start, POST /housekeeping/room-assignments/{id}/complete, POST /housekeeping/shift-rosters/{id}/clock-in"

  - priority: 8
    category: business_referential
    check: "Property scope coherence: all entities referenced by one request must belong to the same Property. A room whose property_id differs from the roster's forecast day property, a linen item from another property, or an attendant rostered on another property's forecast day are all rejected here - BEFORE any state, capacity or occupancy rule is consulted."
    error_id: ERR_PROPERTY_SCOPE_MISMATCH
    http_status: 409
    applies_to: "POST /housekeeping/room-assignments, POST /housekeeping/shift-rosters, POST /housekeeping/lost-found-items, POST /housekeeping/laundry-cycles"

  - priority: 9
    category: state
    check: "Optimistic concurrency: expected_roster_version equals the current ShiftRoster.version; expected_linen_item_version equals the current LinenItem.version."
    error_id: "ERR_STALE_ROSTER_VERSION | ERR_STALE_LINEN_VERSION"
    http_status: 412
    applies_to: "POST /housekeeping/room-assignments, POST /housekeeping/laundry-cycles"

  - priority: 10
    category: state
    check: "Target-state precondition on the entity being acted upon: roster must be CLOCKED_IN to start or complete a room and to record an inspection; roster must not already be CLOSED; assignment must be ASSIGNED to start, IN_PROGRESS to complete, COMPLETED to inspect, and not already terminal to cancel; a room already IN_SERVICE cannot receive a second start; a lost-and-found item must be LOGGED to store, STORED to claim, CLAIM_PENDING to decide; a laundry cycle must be QUEUED to return or void; an enrollment must be ACTIVE to accrue or void; a waiver must be REQUESTED to decide and must not already be decided; a forecast day must be DRAFT to publish and must not already be CLOSED."
    error_id: "ERR_ROSTER_NOT_CLOCKED_IN | ERR_ROSTER_ALREADY_CLOSED | ERR_ASSIGNMENT_NOT_ASSIGNED | ERR_ASSIGNMENT_NOT_IN_PROGRESS | ERR_ASSIGNMENT_NOT_COMPLETED | ERR_ASSIGNMENT_TERMINAL | ERR_ROOM_ALREADY_IN_SERVICE | ERR_ITEM_NOT_LOGGED | ERR_ITEM_NOT_STORED | ERR_CLAIM_NOT_PENDING | ERR_CYCLE_NOT_QUEUED | ERR_ENROLLMENT_NOT_ACTIVE | ERR_WAIVER_NOT_REQUESTED | ERR_WAIVER_ALREADY_DECIDED | ERR_FORECAST_NOT_DRAFT | ERR_FORECAST_ALREADY_CLOSED"
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 11
    category: state
    check: "Cross-entity state gate: a ShiftRoster may only be created against a PUBLISHED ForecastDay, and only for an ACTIVE Attendant."
    error_id: "ERR_FORECAST_NOT_PUBLISHED | ERR_ATTENDANT_NOT_ACTIVE"
    http_status: 409
    applies_to: "POST /housekeeping/shift-rosters"

  - priority: 12
    category: business_constraint
    check: "Uniqueness: one ForecastDay per (property_id, business_date); one ShiftRoster per (forecast_day_id, attendant_id); room_number unique per property; room_type code unique per property; employee_code unique per property; one LinenItem per (property_id, linen_type); at most one non-terminal RoomAssignment per (roster_id, room_id, service_type)."
    error_id: "ERR_FORECAST_DAY_DUPLICATE | ERR_ROSTER_DUPLICATE | ERR_ROOM_NUMBER_DUPLICATE | ERR_ROOM_TYPE_CODE_DUPLICATE | ERR_EMPLOYEE_CODE_DUPLICATE | ERR_LINEN_TYPE_DUPLICATE | ERR_ASSIGNMENT_DUPLICATE"
    http_status: 409
    applies_to: "POST /housekeeping/forecast-days, POST /housekeeping/shift-rosters, POST /housekeeping/rooms, POST /housekeeping/room-types, POST /housekeeping/attendants, POST /housekeeping/linen-items, POST /housekeeping/room-assignments"

  - priority: 13
    category: auth
    check: "Segregation of duties: the X-User-ID recording an inspection must differ from the ShiftRoster.attendant_id of the inspected assignment, and the X-User-ID deciding a workload waiver must differ from ShiftRoster.waiver_requested_by_user_id. Nobody inspects their own work or approves their own waiver."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /housekeeping/inspections, POST /housekeeping/shift-rosters/{id}/waiver-decision"

  - priority: 14
    category: auth
    check: "Inspector qualification: the Attendant identified by X-User-ID on an inspection must have can_inspect == true and status == ACTIVE."
    error_id: ERR_NOT_INSPECTION_QUALIFIED
    http_status: 403
    applies_to: "POST /housekeeping/inspections"

  - priority: 15
    category: business_safety
    check: "Local square-footage ordinance: when Property.ordinance_profile == SQFT_CAP_2200, the roster's assigned_square_feet including the incoming room must not exceed Property.max_daily_square_feet. Evaluated before the credit ceiling, because the ordinance is statutory and the credit ceiling is contractual."
    error_id: ERR_ORDINANCE_SQFT_EXCEEDED
    http_status: 409
    applies_to: "POST /housekeeping/room-assignments"

  - priority: 16
    category: business_safety
    check: "Credit ceiling: the roster's assigned_credits including the incoming room must not exceed effective_credit_cap, unless a GRANTED waiver covers the requested figure. Equality at the cap is permitted and yields compliance_state AT_LIMIT."
    error_id: ERR_CREDIT_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /housekeeping/room-assignments"

  - priority: 17
    category: business_safety
    check: "Injury-prevention gate: a roster already in compliance_state BREACH_BLOCKED accepts no further work of any kind - no start, no complete, no additional assignment - until a waiver is granted or work is cancelled off it."
    error_id: ERR_ROSTER_WORKLOAD_BREACH
    http_status: 409
    applies_to: "POST /housekeeping/room-assignments, POST /housekeeping/room-assignments/{id}/start, POST /housekeeping/room-assignments/{id}/complete"

  - priority: 18
    category: business_safety
    check: "Restricted-duty eligibility: an attendant with restricted_duty == true may not be assigned a DEEP_CLEAN room at all, regardless of remaining credit headroom."
    error_id: ERR_RESTRICTED_DUTY_INELIGIBLE
    http_status: 422
    applies_to: "POST /housekeeping/room-assignments"

  - priority: 19
    category: business_constraint
    check: "Linen shortage block: a DEEP_CLEAN assignment may not be created while any LinenItem of the property has shortage_status IN {SHORTAGE, ESCALATED}. CHECKOUT and STAYOVER rooms are unaffected."
    error_id: ERR_LINEN_SHORTAGE_BLOCK
    http_status: 409
    applies_to: "POST /housekeeping/room-assignments"

  - priority: 20
    category: business_constraint
    check: "Linen stock sufficiency: completing an assignment debits linen_sets_debited from on_hand_clean, and dispatching a laundry batch moves batch_sets out of soiled_queue. Neither may drive its source counter negative."
    error_id: ERR_LINEN_STOCK_INSUFFICIENT
    http_status: 409
    applies_to: "POST /housekeeping/room-assignments/{id}/complete, POST /housekeeping/laundry-cycles"

  - priority: 21
    category: business_constraint
    check: "Opt-out respected: a room whose service_program == OPT_OUT accepts no CHECKOUT or STAYOVER assignment. DEEP_CLEAN and LINEN_REFRESH remain permitted because they are property-driven rather than guest-driven."
    error_id: ERR_SERVICE_OPTED_OUT
    http_status: 422
    applies_to: "POST /housekeeping/room-assignments"

  - priority: 22
    category: business_temporal
    check: "Every-other-day cadence: a room whose service_program == EVERY_OTHER_DAY accepts a STAYOVER assignment only when last_serviced_business_date IS NULL or last_serviced_business_date <= forecast_day.business_date minus 2 days. A gap of exactly 2 days is permitted; a gap of 1 day is not."
    error_id: ERR_SERVICE_NOT_DUE
    http_status: 422
    applies_to: "POST /housekeeping/room-assignments"

  - priority: 23
    category: business_constraint
    check: "Occupancy coherence: service_type must match Room.occupancy_state - CHECKOUT requires DUE_OUT, STAYOVER requires STAYOVER, DEEP_CLEAN requires VACANT. Any other pairing is rejected."
    error_id: ERR_OCCUPANCY_MISMATCH
    http_status: 422
    applies_to: "POST /housekeeping/room-assignments"

  - priority: 24
    category: business_temporal
    check: "Time-window sanity: completed_at must be strictly after started_at; a laundry return's returned_at must be at or after dispatched_at; a forecast business_date must not be earlier than the property's creation date; expected_return_at must be strictly after dispatched_at."
    error_id: ERR_INVALID_TIME_WINDOW
    http_status: 422
    applies_to: "POST /housekeeping/room-assignments/{id}/complete, POST /housekeeping/laundry-cycles, POST /housekeeping/laundry-cycles/{id}/return, POST /housekeeping/forecast-days"

  - priority: 25
    category: business_temporal
    check: "Room service-window exclusivity: the [started_at, completed_at) window of a new completion must not overlap any other non-cancelled assignment window on the SAME room. Windows are half-open, so one attendant finishing at 10:30 and another starting at 10:30 on the same room is permitted."
    error_id: ERR_ROOM_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /housekeeping/room-assignments/{id}/complete"

  - priority: 26
    category: business_temporal
    check: "Attendant rest buffer: the [started_at, completed_at] windows of one attendant's own assignments are CLOSED intervals and must additionally be separated by at least Property.rest_buffer_minutes. Back-to-back rooms with no gap violate this even though the room-level half-open rule would allow them."
    error_id: ERR_REST_BUFFER_VIOLATION
    http_status: 409
    applies_to: "POST /housekeeping/room-assignments/{id}/complete"

  - priority: 27
    category: business_fiscal
    check: "Laundry plant capacity: the sum of batch_sets across QUEUED and LATE_ESCALATED cycles of the property whose [dispatched_at, expected_return_at) windows overlap the new cycle's window, plus the new batch_sets, must not exceed Property.laundry_capacity_sets. Each batch is individually acceptable; only the collective overlap breaches."
    error_id: ERR_LAUNDRY_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /housekeeping/laundry-cycles"

  - priority: 28
    category: business_temporal
    check: "Claim inside retention: a claim is accepted only while the logical clock is strictly before retention_expires_at. At the boundary instant the window is already closed."
    error_id: ERR_RETENTION_EXPIRED
    http_status: 422
    applies_to: "POST /housekeeping/lost-found-items/{id}/claim"

  - priority: 29
    category: business_temporal
    check: "Disposal after retention: disposal is accepted only while the logical clock is at or after retention_expires_at. The boundary instant belongs to the disposal side."
    error_id: ERR_RETENTION_ACTIVE
    http_status: 409
    applies_to: "POST /housekeeping/lost-found-items/{id}/dispose"

  - priority: 30
    category: business_constraint
    check: "Claim proof sufficiency: a HIGH_VALUE or ID_DOCUMENT item requires proof_kind IN {PHOTO_ID, RECEIPT}; DESCRIPTION_MATCH alone is insufficient for those categories."
    error_id: ERR_PROOF_INSUFFICIENT
    http_status: 422
    applies_to: "POST /housekeeping/lost-found-items/{id}/claim"

  - priority: 31
    category: business_constraint
    check: "Disposition permitted: DONATED is not a permitted disposal disposition for ID_DOCUMENT items, and SHIPPED requires a non-empty claimant_contact. A claim decision of RELEASED or SHIPPED must name the disposition explicitly."
    error_id: ERR_DISPOSITION_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /housekeeping/lost-found-items/{id}/dispose, POST /housekeeping/lost-found-items/{id}/claim-decision"

  - priority: 32
    category: business_constraint
    check: "No in-flight work at close: a roster with any assignment still in IN_PROGRESS cannot be closed. ASSIGNED rows are swept to DEFERRED by the close transition, but IN_PROGRESS rows block it."
    error_id: ERR_ASSIGNMENT_IN_PROGRESS
    http_status: 409
    applies_to: "POST /housekeeping/shift-rosters/{id}/close"

  - priority: 33
    category: business_safety
    check: "Inspection sampling obligation: a roster cannot be closed while inspections_completed < required_inspection_samples. The quality guardrail is a precondition of settlement, not an afterthought."
    error_id: ERR_INSPECTION_SAMPLE_INCOMPLETE
    http_status: 409
    applies_to: "POST /housekeeping/shift-rosters/{id}/close"

  - priority: 34
    category: business_constraint
    check: "Forecast close ordering: a ForecastDay cannot be closed while any of its rosters is still PLANNED or CLOCKED_IN."
    error_id: ERR_ROSTER_STILL_OPEN
    http_status: 409
    applies_to: "POST /housekeeping/forecast-days/{id}/close"

  - priority: 35
    category: business_safety
    check: "Waiver ceiling: waiver_requested_credits must not exceed effective_credit_cap multiplied by the ordinance headroom factor - WAIVER_HEADROOM_FACTOR_STRICT (1.00, i.e. no headroom at all) when Property.ordinance_profile == CREDIT_CAP_STRICT, otherwise WAIVER_HEADROOM_FACTOR_DEFAULT (1.25)."
    error_id: ERR_WAIVER_EXCEEDS_ORDINANCE_MAX
    http_status: 422
    applies_to: "POST /housekeeping/shift-rosters/{id}/waiver-request"

  - priority: 36
    category: business_fiscal
    check: "Worked-minutes plausibility: worked_minutes must be between 0 and MAX_WORKED_MINUTES_PER_SHIFT (720) inclusive at both ends."
    error_id: ERR_WORKED_MINUTES_IMPLAUSIBLE
    http_status: 422
    applies_to: "POST /housekeeping/shift-rosters/{id}/close"

  - priority: 37
    category: business_fiscal
    check: "Break coherence: break_minutes must not exceed worked_minutes, so productive_minutes can never go negative."
    error_id: ERR_BREAK_EXCEEDS_WORKED
    http_status: 422
    applies_to: "POST /housekeeping/shift-rosters/{id}/close"

  - priority: 38
    category: business_constraint
    check: "One active enrollment per room: a room may not hold two ACTIVE ServiceEnrollment rows."
    error_id: ERR_ENROLLMENT_ACTIVE_EXISTS
    http_status: 409
    applies_to: "POST /housekeeping/service-enrollments"

  - priority: 39
    category: business_constraint
    check: "Skip budget: skip_budget = nights when program == OPT_OUT and ceil(nights / 2) when program == EVERY_OTHER_DAY; an accrual is rejected once skips_accrued has reached skip_budget. An OPT_OUT enrollment therefore reaches COMPLETED on its last budgeted accrual, while an EVERY_OTHER_DAY enrollment exhausts its budget while still ACTIVE and its next accrual is refused here."
    error_id: ERR_ENROLLMENT_SKIPS_EXHAUSTED
    http_status: 422
    applies_to: "POST /housekeeping/service-enrollments/{id}/accrue"

endpoints:
  - method: POST
    path: "/housekeeping/properties"
    description: "Register a hotel property with its ordinance regime, credit-minute standard, laundry SLA and inspection sampling rates."
    roles: [HousekeepingDirector]
    code: 201
    input: [name, ordinance_profile, credit_minute_value, standard_shift_minutes, pre_post_shift_minutes, min_daily_paid_minutes, max_daily_credits, max_daily_square_feet, laundry_sla_minutes, laundry_capacity_sets, reclean_threshold_score, inspection_sample_rate, probation_sample_rate, rest_buffer_minutes]
    output: Property
    side_effects: ["total_rooms initialised to 0", "outstanding_incentive_points initialised to 0"]

  - method: GET
    path: "/housekeeping/properties/{id}"
    description: "Read one property including its computed total_rooms and outstanding_incentive_points."
    roles: [HousekeepingDirector, Supervisor, RoomAttendant, LaundryLead, FrontDeskAgent, ComplianceOfficer]
    code: 200
    input: []
    output: Property
    side_effects: []

  - method: POST
    path: "/housekeeping/room-types"
    description: "Define a room type with its square footage and its checkout, stayover and deep-clean credit values."
    roles: [HousekeepingDirector]
    code: 201
    input: [property_id, code, square_feet, checkout_credits, stayover_credits, deep_clean_credits, linen_sets_per_room]
    output: RoomType
    side_effects: ["room_count initialised to 0", "recomputes par_required_sets and shortage_status on every LinenItem of the property"]

  - method: GET
    path: "/housekeeping/room-types/{id}"
    description: "Read one room type including its computed room_count."
    roles: [HousekeepingDirector, Supervisor, RoomAttendant, LaundryLead, FrontDeskAgent, ComplianceOfficer]
    code: 200
    input: []
    output: RoomType
    side_effects: []

  - method: GET
    path: "/housekeeping/room-types"
    description: "List room types, optionally filtered by property or code. Reverse lookup for RoomType.property_id."
    roles: [HousekeepingDirector, Supervisor, RoomAttendant, LaundryLead, FrontDeskAgent, ComplianceOfficer]
    code: 200
    input: ["property_id?", "code?"]
    output: RoomType[]
    side_effects: []

  - method: POST
    path: "/housekeeping/rooms"
    description: "Add a room. service_program defaults to DAILY, occupancy_state defaults to VACANT, cleanliness_status starts DIRTY."
    roles: [HousekeepingDirector]
    code: 201
    input: [property_id, room_type_id, room_number, floor, "service_program?", "occupancy_state?", "last_serviced_business_date?", "last_deep_cleaned_business_date?"]
    output: Room
    side_effects: ["increments RoomType.room_count and Property.total_rooms", "recomputes par_required_sets, coverage_ratio and shortage_status on every LinenItem of the property"]

  - method: GET
    path: "/housekeeping/rooms/{id}"
    description: "Read one room including its current occupancy and cleanliness posture."
    roles: [HousekeepingDirector, Supervisor, RoomAttendant, LaundryLead, FrontDeskAgent, ComplianceOfficer]
    code: 200
    input: []
    output: Room
    side_effects: []

  - method: GET
    path: "/housekeeping/rooms"
    description: "List rooms, optionally filtered by property, room type, service program or cleanliness. Reverse lookup for Room.property_id and Room.room_type_id."
    roles: [HousekeepingDirector, Supervisor, RoomAttendant, LaundryLead, FrontDeskAgent, ComplianceOfficer]
    code: 200
    input: ["property_id?", "room_type_id?", "service_program?", "cleanliness_status?"]
    output: Room[]
    side_effects: []

  - method: PATCH
    path: "/housekeeping/rooms/{id}"
    description: "Front-desk or director update of a room's occupancy posture, service program, cleanliness status or last-serviced date."
    roles: [HousekeepingDirector, FrontDeskAgent]
    code: 200
    input: ["occupancy_state?", "service_program?", "cleanliness_status?", "last_serviced_business_date?", "last_deep_cleaned_business_date?"]
    output: Room
    side_effects: ["increments room version by 1"]

  - method: POST
    path: "/housekeeping/attendants"
    description: "Hire a room attendant or working supervisor. can_inspect and restricted_duty default to false, status defaults to ACTIVE."
    roles: [HousekeepingDirector]
    code: 201
    input: [property_id, employee_code, full_name, seniority_date, hourly_rate_cents, "can_inspect?", "restricted_duty?", "status?"]
    output: Attendant
    side_effects: ["quality_probation initialised to false and lifetime_fail_count to 0"]

  - method: GET
    path: "/housekeeping/attendants/{id}"
    description: "Read one attendant including quality_probation and lifetime_fail_count."
    roles: [HousekeepingDirector, Supervisor, RoomAttendant, LaundryLead, FrontDeskAgent, ComplianceOfficer]
    code: 200
    input: []
    output: Attendant
    side_effects: []

  - method: GET
    path: "/housekeeping/attendants"
    description: "List attendants, optionally filtered by property or employment status. Reverse lookup for Attendant.property_id."
    roles: [HousekeepingDirector, Supervisor, RoomAttendant, LaundryLead, FrontDeskAgent, ComplianceOfficer]
    code: 200
    input: ["property_id?", "status?"]
    output: Attendant[]
    side_effects: []

  - method: PATCH
    path: "/housekeeping/attendants/{id}"
    description: "Update restricted-duty status, inspection credential or employment status. A restricted-duty change re-derives the caps and compliance_state of every open roster of the attendant."
    roles: [HousekeepingDirector]
    code: 200
    input: ["restricted_duty?", "can_inspect?", "status?"]
    output: Attendant
    side_effects: ["recomputes effective_credit_cap and compliance_state on every ShiftRoster of this attendant whose status != CLOSED", "recomputes required_inspection_samples on those rosters"]

  - method: POST
    path: "/housekeeping/forecast-days"
    description: "Create a DRAFT forecast day from occupancy and arrival/departure mix; computes projected_required_credits and required_attendants immediately."
    roles: [HousekeepingDirector]
    code: 201
    input: [property_id, business_date, forecast_occupied_rooms, forecast_arrivals, forecast_departures, planned_deep_clean_rooms]
    output: ForecastDay
    side_effects: ["runs calculations.forecast_required_credits variant PROJECTED_INVENTORY_MIX", "runs calculations.required_attendant_headcount", "allocated_credits_total initialised to 0.00"]

  - method: GET
    path: "/housekeeping/forecast-days/{id}"
    description: "Read one forecast day including projection, allocation and reconciliation figures."
    roles: [HousekeepingDirector, Supervisor, RoomAttendant, LaundryLead, FrontDeskAgent, ComplianceOfficer]
    code: 200
    input: []
    output: ForecastDay
    side_effects: []

  - method: GET
    path: "/housekeeping/forecast-days"
    description: "List forecast days, optionally filtered by property, status or business date. Reverse lookup for ForecastDay.property_id."
    roles: [HousekeepingDirector, Supervisor, RoomAttendant, LaundryLead, FrontDeskAgent, ComplianceOfficer]
    code: 200
    input: ["property_id?", "status?", "business_date?"]
    output: ForecastDay[]
    side_effects: []

  - method: POST
    path: "/housekeeping/forecast-days/{id}/publish"
    description: "Release the staffing plan, re-running the projection against the current room inventory. Rosters may only be created against a PUBLISHED day."
    roles: [HousekeepingDirector]
    code: 200
    input: []
    output: ForecastDay
    side_effects: ["re-runs calculations.forecast_required_credits variant PROJECTED_INVENTORY_MIX", "re-runs calculations.required_attendant_headcount", "sets status = PUBLISHED"]

  - method: POST
    path: "/housekeeping/forecast-days/{id}/close"
    description: "Close the day, reconciling projected credits against the credits actually performed."
    roles: [HousekeepingDirector]
    code: 200
    input: []
    output: ForecastDay
    side_effects: ["runs calculations.forecast_required_credits variant ACTUAL_RECONCILED", "runs calculations.forecast_credit_variance", "sets status = CLOSED"]

  - method: POST
    path: "/housekeeping/shift-rosters"
    description: "Roster an attendant onto a published forecast day; derives the ordinance caps that will govern the shift."
    roles: [HousekeepingDirector, Supervisor]
    code: 201
    input: [forecast_day_id, attendant_id, planned_start_at]
    output: ShiftRoster
    side_effects: ["runs calculations.roster_workload_compliance to set effective_credit_cap, effective_sqft_cap and compliance_state = COMPLIANT", "status = PLANNED, waiver_state = NONE, productivity_flag = PENDING"]

  - method: GET
    path: "/housekeeping/shift-rosters/{id}"
    description: "Read one roster including its three state dimensions, workload totals, productivity figures and settlement amounts."
    roles: [HousekeepingDirector, Supervisor, RoomAttendant, LaundryLead, FrontDeskAgent, ComplianceOfficer]
    code: 200
    input: []
    output: ShiftRoster
    side_effects: []

  - method: GET
    path: "/housekeeping/shift-rosters"
    description: "List rosters, optionally filtered by forecast day, attendant, status or compliance state. Reverse lookup for ShiftRoster.forecast_day_id and ShiftRoster.attendant_id."
    roles: [HousekeepingDirector, Supervisor, RoomAttendant, LaundryLead, FrontDeskAgent, ComplianceOfficer]
    code: 200
    input: ["forecast_day_id?", "attendant_id?", "status?", "compliance_state?"]
    output: ShiftRoster[]
    side_effects: []

  - method: POST
    path: "/housekeeping/shift-rosters/{id}/clock-in"
    description: "Attendant clocks in, moving the roster's lifecycle dimension to CLOCKED_IN without touching its compliance dimension."
    roles: [Supervisor, RoomAttendant]
    code: 200
    input: []
    output: ShiftRoster
    side_effects: ["sets status = CLOCKED_IN", "compliance_state and waiver_state are left untouched"]

  - method: POST
    path: "/housekeeping/shift-rosters/{id}/close"
    description: "Close the shift: settle paid and overtime minutes, compute both minutes-per-room variants, apply the quality guardrail and price the labour cost."
    roles: [HousekeepingDirector, Supervisor]
    code: 200
    input: [worked_minutes, break_minutes]
    output: ShiftRoster
    side_effects: ["sweeps every still-ASSIGNED assignment on the roster to DEFERRED", "runs calculations.shift_settlement", "runs calculations.minutes_per_room", "runs calculations.shift_labor_cost", "sets status = CLOSED", "recomputes ForecastDay.allocated_credits_total"]

  - method: POST
    path: "/housekeeping/shift-rosters/{id}/waiver-request"
    description: "Supervisor files an ordinance workload waiver naming the credit ceiling requested."
    roles: [Supervisor]
    code: 200
    input: [waiver_requested_credits]
    output: ShiftRoster
    side_effects: ["sets waiver_state = REQUESTED", "records waiver_requested_by_user_id from X-User-ID", "status and compliance_state are left untouched"]

  - method: POST
    path: "/housekeeping/shift-rosters/{id}/waiver-decision"
    description: "Compliance officer grants or denies a filed waiver. decision is one of GRANT or DENY."
    roles: [ComplianceOfficer]
    code: 200
    input: [decision]
    output: ShiftRoster
    side_effects: ["sets waiver_state = GRANTED or DENIED", "records waiver_decided_by_user_id from X-User-ID", "re-runs calculations.roster_workload_compliance, which may lift compliance_state from BREACH_BLOCKED to WAIVER_GRANTED"]

  - method: GET
    path: "/housekeeping/shift-rosters/{id}/inspection-sample-plan"
    description: "Computed read: how many inspections the roster still owes and exactly which completed assignments to sample, ranked credits DESC then room_number ASC then created_at ASC."
    roles: [HousekeepingDirector, Supervisor, RoomAttendant, LaundryLead, FrontDeskAgent, ComplianceOfficer]
    code: 200
    input: []
    output: "{ roster_id: string, completed_count: integer, sample_rate: number, required_samples: integer, inspections_completed: integer, remaining_samples: integer, selected_assignment_ids: string[] }"
    side_effects: []

  - method: POST
    path: "/housekeeping/room-assignments"
    description: "Assign a room to a roster. Requires expected_roster_version. Credits are derived from room type, service type and service program; the ordinance ceilings are enforced against the roster totals."
    roles: [HousekeepingDirector, Supervisor]
    code: 201
    input: [roster_id, room_id, service_type, expected_roster_version]
    output: RoomAssignment
    side_effects: ["runs calculations.assignment_credit_value", "snapshots RoomType.square_feet into square_feet_snapshot", "re-runs calculations.roster_workload_compliance", "recomputes ShiftRoster.required_inspection_samples", "recomputes ForecastDay.allocated_credits_total", "increments ShiftRoster.version and records roster_version_after"]

  - method: GET
    path: "/housekeeping/room-assignments/{id}"
    description: "Read one room assignment including its credits, snapshots and re-clean generation."
    roles: [HousekeepingDirector, Supervisor, RoomAttendant, LaundryLead, FrontDeskAgent, ComplianceOfficer]
    code: 200
    input: []
    output: RoomAssignment
    side_effects: []

  - method: GET
    path: "/housekeeping/room-assignments"
    description: "List room assignments, optionally filtered by roster, room, superseded assignment or status. Reverse lookup for RoomAssignment.roster_id, room_id and supersedes_assignment_id, and the only discovery channel for system-generated re-clean assignments."
    roles: [HousekeepingDirector, Supervisor, RoomAttendant, LaundryLead, FrontDeskAgent, ComplianceOfficer]
    code: 200
    input: ["roster_id?", "room_id?", "supersedes_assignment_id?", "status?", "service_type?"]
    output: RoomAssignment[]
    side_effects: []

  - method: POST
    path: "/housekeeping/room-assignments/{id}/start"
    description: "Attendant starts cleaning the room. started_at defaults to the logical clock when omitted."
    roles: [Supervisor, RoomAttendant]
    code: 200
    input: ["started_at?"]
    output: RoomAssignment
    side_effects: ["sets status = IN_PROGRESS", "sets Room.cleanliness_status = IN_SERVICE"]

  - method: POST
    path: "/housekeeping/room-assignments/{id}/complete"
    description: "Attendant finishes the room. completed_at defaults to the logical clock. Debits linen, updates the room and re-derives the roster productivity inputs."
    roles: [Supervisor, RoomAttendant]
    code: 200
    input: ["completed_at?"]
    output: RoomAssignment
    side_effects: ["computes actual_minutes", "sets status = COMPLETED", "sets Room.cleanliness_status = CLEAN and Room.last_serviced_business_date", "when a LinenItem with linen_type == SHEET_SET exists for the room's property AND service_type != STAYOVER, debits linen_sets_debited = RoomType.linen_sets_per_room from that LinenItem.on_hand_clean into its soiled_queue and re-runs calculations.linen_coverage_status; otherwise linen_sets_debited stays 0", "recomputes ShiftRoster.required_inspection_samples", "increments ShiftRoster.version and records roster_version_after"]

  - method: POST
    path: "/housekeeping/room-assignments/{id}/cancel"
    description: "Cancel an assignment that has not started, releasing its credits and square feet from the roster totals."
    roles: [HousekeepingDirector, Supervisor]
    code: 200
    input: []
    output: RoomAssignment
    side_effects: ["sets status = CANCELLED", "re-runs calculations.roster_workload_compliance, which may lift compliance_state out of BREACH_BLOCKED", "recomputes ForecastDay.allocated_credits_total", "increments ShiftRoster.version and records roster_version_after"]

  - method: POST
    path: "/housekeeping/inspections"
    description: "Supervisor records a quality inspection of a completed room. A FAIL generates a re-clean assignment and puts the attendant on quality probation."
    roles: [Supervisor]
    code: 201
    input: [assignment_id, bathroom_points, linen_points, dust_points, amenity_points, floor_points]
    output: Inspection
    side_effects: ["runs calculations.inspection_quality_score", "records inspector_attendant_id from X-User-ID", "on PASS sets the assignment to INSPECTED_PASS and Room.cleanliness_status = INSPECTED_PASS", "on FAIL sets the assignment to RECLEAN_REQUIRED, sets Room.cleanliness_status = RECLEAN_REQUIRED, inserts a re-clean RoomAssignment with reclean_generation + 1 and supersedes_assignment_id set, sets Attendant.quality_probation = true, increments Attendant.lifetime_fail_count, and re-runs calculations.roster_workload_compliance and calculations.inspection_sampling_plan", "increments ShiftRoster.inspections_completed"]

  - method: GET
    path: "/housekeeping/inspections/{id}"
    description: "Read one inspection including its score, critical-fail flag and the re-clean assignment it generated."
    roles: [HousekeepingDirector, Supervisor, RoomAttendant, LaundryLead, FrontDeskAgent, ComplianceOfficer]
    code: 200
    input: []
    output: Inspection
    side_effects: []

  - method: GET
    path: "/housekeeping/inspections"
    description: "List inspections, optionally filtered by inspected assignment, inspector, generated re-clean assignment or result. Reverse lookup for Inspection.assignment_id, inspector_attendant_id and generated_reclean_assignment_id."
    roles: [HousekeepingDirector, Supervisor, RoomAttendant, LaundryLead, FrontDeskAgent, ComplianceOfficer]
    code: 200
    input: ["assignment_id?", "inspector_attendant_id?", "generated_reclean_assignment_id?", "result?"]
    output: Inspection[]
    side_effects: []

  - method: POST
    path: "/housekeeping/linen-items"
    description: "Open a linen inventory line. initial_soiled_sets defaults to 0 and is deducted from the clean shelf so the ledger identity holds from creation."
    roles: [HousekeepingDirector, LaundryLead]
    code: 201
    input: [property_id, linen_type, total_owned_sets, "initial_soiled_sets?"]
    output: LinenItem
    side_effects: ["sets on_hand_clean = total_owned_sets - initial_soiled_sets, soiled_queue = initial_soiled_sets, in_laundry = 0", "runs calculations.linen_coverage_status"]

  - method: GET
    path: "/housekeeping/linen-items/{id}"
    description: "Read one linen line including par level, coverage ratio and shortage status."
    roles: [HousekeepingDirector, Supervisor, RoomAttendant, LaundryLead, FrontDeskAgent, ComplianceOfficer]
    code: 200
    input: []
    output: LinenItem
    side_effects: []

  - method: GET
    path: "/housekeeping/linen-items"
    description: "List linen lines, optionally filtered by property, linen type or shortage status. Reverse lookup for LinenItem.property_id."
    roles: [HousekeepingDirector, Supervisor, RoomAttendant, LaundryLead, FrontDeskAgent, ComplianceOfficer]
    code: 200
    input: ["property_id?", "linen_type?", "shortage_status?"]
    output: LinenItem[]
    side_effects: []

  - method: POST
    path: "/housekeeping/linen-items/{id}/soil"
    description: "Move sets from the clean shelf into the soiled queue outside a room completion, for example after a guest complaint strip-down."
    roles: [Supervisor, LaundryLead]
    code: 200
    input: [sets]
    output: LinenItem
    side_effects: ["moves sets from on_hand_clean to soiled_queue, preserving the ledger identity", "re-runs calculations.linen_coverage_status", "increments linen item version by 1"]

  - method: POST
    path: "/housekeeping/laundry-cycles"
    description: "Dispatch a soiled batch to the laundry plant. Requires expected_linen_item_version and respects the overlapping-window plant capacity."
    roles: [LaundryLead]
    code: 201
    input: [linen_item_id, batch_sets, dispatched_at, expected_return_at, expected_linen_item_version]
    output: LaundryCycle
    side_effects: ["moves batch_sets from soiled_queue to in_laundry", "sets status = QUEUED", "re-runs calculations.linen_coverage_status", "increments LinenItem.version and records linen_item_version_after"]

  - method: GET
    path: "/housekeeping/laundry-cycles/{id}"
    description: "Read one laundry cycle including turnaround minutes and SLA breach flag."
    roles: [HousekeepingDirector, Supervisor, RoomAttendant, LaundryLead, FrontDeskAgent, ComplianceOfficer]
    code: 200
    input: []
    output: LaundryCycle
    side_effects: []

  - method: GET
    path: "/housekeeping/laundry-cycles"
    description: "List laundry cycles, optionally filtered by linen line or status. Reverse lookup for LaundryCycle.linen_item_id."
    roles: [HousekeepingDirector, Supervisor, RoomAttendant, LaundryLead, FrontDeskAgent, ComplianceOfficer]
    code: 200
    input: ["linen_item_id?", "status?"]
    output: LaundryCycle[]
    side_effects: []

  - method: POST
    path: "/housekeeping/laundry-cycles/{id}/return"
    description: "Receive a batch back. returned_at defaults to the logical clock and returned_sets to batch_sets. A turnaround beyond the property SLA escalates the cycle and drives the linen line to ESCALATED."
    roles: [LaundryLead]
    code: 200
    input: ["returned_at?", "returned_sets?"]
    output: LaundryCycle
    side_effects: ["runs calculations.laundry_turnaround", "moves returned_sets from in_laundry to on_hand_clean and any shortfall from in_laundry to soiled_queue", "sets status = RETURNED or LATE_ESCALATED", "re-runs calculations.linen_coverage_status", "on LATE_ESCALATED forces LinenItem.shortage_status = ESCALATED, which blocks further DEEP_CLEAN assignments property-wide", "increments LinenItem.version and records linen_item_version_after"]

  - method: POST
    path: "/housekeeping/laundry-cycles/{id}/void"
    description: "Void a dispatched batch that never left the property, returning the sets to the soiled queue."
    roles: [LaundryLead]
    code: 200
    input: []
    output: LaundryCycle
    side_effects: ["moves batch_sets from in_laundry back to soiled_queue, the exact compensation of the dispatch", "sets status = VOIDED", "re-runs calculations.linen_coverage_status", "increments LinenItem.version and records linen_item_version_after"]

  - method: POST
    path: "/housekeeping/lost-found-items"
    description: "Log an item recovered from a room. logged_at is taken from the logical clock."
    roles: [Supervisor, RoomAttendant]
    code: 201
    input: [property_id, room_id, found_by_attendant_id, description, category]
    output: LostFoundItem
    side_effects: ["sets status = LOGGED and logged_at from the logical clock", "claim_attempt_count initialised to 0"]

  - method: GET
    path: "/housekeeping/lost-found-items/{id}"
    description: "Read one lost-and-found item including its retention window and claim history counters."
    roles: [HousekeepingDirector, Supervisor, RoomAttendant, LaundryLead, FrontDeskAgent, ComplianceOfficer]
    code: 200
    input: []
    output: LostFoundItem
    side_effects: []

  - method: GET
    path: "/housekeeping/lost-found-items"
    description: "List lost-and-found items, optionally filtered by property, room, finder or status. Reverse lookup for LostFoundItem.property_id, room_id and found_by_attendant_id."
    roles: [HousekeepingDirector, Supervisor, RoomAttendant, LaundryLead, FrontDeskAgent, ComplianceOfficer]
    code: 200
    input: ["property_id?", "room_id?", "found_by_attendant_id?", "status?", "category?"]
    output: LostFoundItem[]
    side_effects: []

  - method: POST
    path: "/housekeeping/lost-found-items/{id}/store"
    description: "Bin the item in secure storage, starting the category-driven retention window."
    roles: [Supervisor, FrontDeskAgent]
    code: 200
    input: [storage_bin]
    output: LostFoundItem
    side_effects: ["sets stored_at from the logical clock", "runs calculations.lost_found_retention_window to set retention_days and retention_expires_at", "sets status = STORED"]

  - method: POST
    path: "/housekeeping/lost-found-items/{id}/claim"
    description: "Front desk files a guest claim inside the retention window with the offered proof."
    roles: [FrontDeskAgent]
    code: 200
    input: [claimant_name, claimant_contact, proof_kind]
    output: LostFoundItem
    side_effects: ["sets status = CLAIM_PENDING", "increments claim_attempt_count", "records claimant_name, claimant_contact and proof_kind"]

  - method: POST
    path: "/housekeeping/lost-found-items/{id}/claim-decision"
    description: "Supervisor approves or denies a pending claim. decision is APPROVE or DENY; an approved claim is either RELEASED at the desk or SHIPPED to the claimant."
    roles: [Supervisor]
    code: 200
    input: [decision, "disposition?", "tracking_code?", "denial_reason?"]
    output: LostFoundItem
    side_effects: ["on APPROVE sets status = RELEASED, or SHIPPED with tracking_code recorded", "on DENY returns status to STORED, records denial_reason and leaves the retention window running so a later claim is still possible"]

  - method: POST
    path: "/housekeeping/lost-found-items/{id}/dispose"
    description: "Dispose of an unclaimed item once the retention window has closed. disposition is DISPOSED or DONATED."
    roles: [Supervisor]
    code: 200
    input: [disposition]
    output: LostFoundItem
    side_effects: ["sets status = DISPOSED or DONATED, both terminal"]

  - method: POST
    path: "/housekeeping/service-enrollments"
    description: "Enrol a reservation in an opt-out or every-other-day service programme, which rewrites the room's service_program."
    roles: [FrontDeskAgent]
    code: 201
    input: [room_id, reservation_code, program, nights]
    output: ServiceEnrollment
    side_effects: ["sets points_per_skip from the programme", "sets Room.service_program to OPT_OUT or EVERY_OTHER_DAY", "status = ACTIVE with skips_accrued 0 and points_accrued 0"]

  - method: GET
    path: "/housekeeping/service-enrollments/{id}"
    description: "Read one service enrolment including accrued skips and incentive points."
    roles: [HousekeepingDirector, Supervisor, RoomAttendant, LaundryLead, FrontDeskAgent, ComplianceOfficer]
    code: 200
    input: []
    output: ServiceEnrollment
    side_effects: []

  - method: GET
    path: "/housekeeping/service-enrollments"
    description: "List service enrolments, optionally filtered by room, status or programme. Reverse lookup for ServiceEnrollment.room_id."
    roles: [HousekeepingDirector, Supervisor, RoomAttendant, LaundryLead, FrontDeskAgent, ComplianceOfficer]
    code: 200
    input: ["room_id?", "status?", "program?"]
    output: ServiceEnrollment[]
    side_effects: []

  - method: POST
    path: "/housekeeping/service-enrollments/{id}/accrue"
    description: "Record one skipped service and credit the guest incentive points for it."
    roles: [Supervisor, FrontDeskAgent]
    code: 200
    input: []
    output: ServiceEnrollment
    side_effects: ["increments skips_accrued and recomputes points_accrued", "increments Property.outstanding_incentive_points by points_per_skip", "sets status = COMPLETED when skips_accrued reaches nights"]

  - method: POST
    path: "/housekeeping/service-enrollments/{id}/void"
    description: "Void an active enrolment, reversing every accrual and restoring daily service to the room."
    roles: [FrontDeskAgent]
    code: 200
    input: []
    output: ServiceEnrollment
    side_effects: ["zeroes skips_accrued and points_accrued", "restores Room.service_program = DAILY", "decrements Property.outstanding_incentive_points back to its pre-enrolment value", "sets status = VOIDED"]

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical UTC clock, which drives logged_at, stored_at, retention comparisons and the defaults for started_at, completed_at and returned_at. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time."
    roles: [HousekeepingDirector]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["sets the logical clock used by every timestamp default and every retention or SLA comparison"]

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing or empty, or X-User-Role naming a role outside the six declared roles"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "Recognized role absent from the target endpoint's roles list"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required body field, wrong JSON type, enum value outside its declared set, negative count or minute value, inspection points outside 0..10, or a missing expected_*_version on an endpoint that requires it"
  - id: ERR_PROPERTY_NOT_FOUND
    http: 404
    condition: "property_id in the path or body does not resolve to a Property"
  - id: ERR_ROOM_TYPE_NOT_FOUND
    http: 404
    condition: "room_type_id does not resolve to a RoomType"
  - id: ERR_ROOM_NOT_FOUND
    http: 404
    condition: "room_id does not resolve to a Room"
  - id: ERR_ATTENDANT_NOT_FOUND
    http: 404
    condition: "attendant_id, found_by_attendant_id, or the X-User-ID of an entity-backed role does not resolve to an Attendant"
  - id: ERR_FORECAST_DAY_NOT_FOUND
    http: 404
    condition: "forecast_day_id does not resolve to a ForecastDay"
  - id: ERR_ROSTER_NOT_FOUND
    http: 404
    condition: "roster_id does not resolve to a ShiftRoster"
  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "assignment_id does not resolve to a RoomAssignment"
  - id: ERR_INSPECTION_NOT_FOUND
    http: 404
    condition: "Inspection id in the path does not resolve"
  - id: ERR_LINEN_ITEM_NOT_FOUND
    http: 404
    condition: "linen_item_id does not resolve to a LinenItem"
  - id: ERR_LAUNDRY_CYCLE_NOT_FOUND
    http: 404
    condition: "LaundryCycle id in the path does not resolve"
  - id: ERR_LOST_FOUND_ITEM_NOT_FOUND
    http: 404
    condition: "LostFoundItem id in the path does not resolve"
  - id: ERR_ENROLLMENT_NOT_FOUND
    http: 404
    condition: "ServiceEnrollment id in the path does not resolve"
  - id: ERR_NOT_ASSIGNMENT_OWNER
    http: 403
    condition: "Acting RoomAttendant's X-User-ID differs from the ShiftRoster.attendant_id that owns the targeted roster or assignment"
  - id: ERR_PROPERTY_SCOPE_MISMATCH
    http: 409
    condition: "Two entities referenced by one request belong to different Property rows"
  - id: ERR_STALE_ROSTER_VERSION
    http: 412
    condition: "expected_roster_version differs from the current ShiftRoster.version"
  - id: ERR_STALE_LINEN_VERSION
    http: 412
    condition: "expected_linen_item_version differs from the current LinenItem.version"
  - id: ERR_ROSTER_NOT_CLOCKED_IN
    http: 409
    condition: "Work or inspection recorded against a roster whose status is not CLOCKED_IN"
  - id: ERR_ROSTER_ALREADY_CLOSED
    http: 409
    condition: "Any mutation targeting a ShiftRoster whose status is already CLOSED"
  - id: ERR_ASSIGNMENT_NOT_ASSIGNED
    http: 409
    condition: "Start requested on an assignment whose status is not ASSIGNED"
  - id: ERR_ASSIGNMENT_NOT_IN_PROGRESS
    http: 409
    condition: "Complete requested on an assignment whose status is not IN_PROGRESS"
  - id: ERR_ASSIGNMENT_NOT_COMPLETED
    http: 409
    condition: "Inspection recorded against an assignment whose status is not COMPLETED"
  - id: ERR_ASSIGNMENT_TERMINAL
    http: 409
    condition: "Cancel requested on an assignment already in INSPECTED_PASS, CANCELLED or DEFERRED"
  - id: ERR_ROOM_ALREADY_IN_SERVICE
    http: 409
    condition: "Start requested on a room whose cleanliness_status is already IN_SERVICE for another assignment"
  - id: ERR_ITEM_NOT_LOGGED
    http: 409
    condition: "Store requested on a lost-and-found item whose status is not LOGGED"
  - id: ERR_ITEM_NOT_STORED
    http: 409
    condition: "Claim or dispose requested on a lost-and-found item whose status is not STORED"
  - id: ERR_CLAIM_NOT_PENDING
    http: 409
    condition: "Claim decision requested on an item whose status is not CLAIM_PENDING"
  - id: ERR_CYCLE_NOT_QUEUED
    http: 409
    condition: "Return or void requested on a laundry cycle whose status is not QUEUED"
  - id: ERR_ENROLLMENT_NOT_ACTIVE
    http: 409
    condition: "Accrue or void requested on a ServiceEnrollment whose status is not ACTIVE"
  - id: ERR_WAIVER_NOT_REQUESTED
    http: 409
    condition: "Waiver decision recorded while waiver_state is NONE"
  - id: ERR_WAIVER_ALREADY_DECIDED
    http: 409
    condition: "Waiver decision recorded while waiver_state is already GRANTED or DENIED"
  - id: ERR_FORECAST_NOT_DRAFT
    http: 409
    condition: "Publish requested on a ForecastDay whose status is not DRAFT"
  - id: ERR_FORECAST_ALREADY_CLOSED
    http: 409
    condition: "Any mutation targeting a ForecastDay whose status is already CLOSED"
  - id: ERR_FORECAST_NOT_PUBLISHED
    http: 409
    condition: "ShiftRoster creation against a ForecastDay whose status is not PUBLISHED"
  - id: ERR_ATTENDANT_NOT_ACTIVE
    http: 409
    condition: "ShiftRoster creation for an Attendant whose status is ON_LEAVE or TERMINATED"
  - id: ERR_FORECAST_DAY_DUPLICATE
    http: 409
    condition: "A ForecastDay already exists for this (property_id, business_date)"
  - id: ERR_ROSTER_DUPLICATE
    http: 409
    condition: "A ShiftRoster already exists for this (forecast_day_id, attendant_id)"
  - id: ERR_ROOM_NUMBER_DUPLICATE
    http: 409
    condition: "room_number already used within the property"
  - id: ERR_ROOM_TYPE_CODE_DUPLICATE
    http: 409
    condition: "RoomType code already used within the property"
  - id: ERR_EMPLOYEE_CODE_DUPLICATE
    http: 409
    condition: "employee_code already used within the property"
  - id: ERR_LINEN_TYPE_DUPLICATE
    http: 409
    condition: "A LinenItem already exists for this (property_id, linen_type)"
  - id: ERR_ASSIGNMENT_DUPLICATE
    http: 409
    condition: "A non-terminal RoomAssignment already exists for this (roster_id, room_id, service_type)"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "An attendant inspects work performed on their own roster, or the waiver requester decides their own waiver"
  - id: ERR_NOT_INSPECTION_QUALIFIED
    http: 403
    condition: "The inspecting attendant has can_inspect false or status other than ACTIVE"
  - id: ERR_ORDINANCE_SQFT_EXCEEDED
    http: 409
    condition: "Roster assigned_square_feet including the incoming room would exceed effective_sqft_cap under ordinance_profile SQFT_CAP_2200"
  - id: ERR_CREDIT_CAP_EXCEEDED
    http: 409
    condition: "Roster assigned_credits including the incoming room would exceed effective_credit_cap without a covering granted waiver"
  - id: ERR_ROSTER_WORKLOAD_BREACH
    http: 409
    condition: "Further work requested on a roster whose compliance_state is BREACH_BLOCKED"
  - id: ERR_RESTRICTED_DUTY_INELIGIBLE
    http: 422
    condition: "DEEP_CLEAN assigned to an attendant whose restricted_duty is true"
  - id: ERR_LINEN_SHORTAGE_BLOCK
    http: 409
    condition: "DEEP_CLEAN assignment created while a LinenItem of the property has shortage_status SHORTAGE or ESCALATED"
  - id: ERR_LINEN_STOCK_INSUFFICIENT
    http: 409
    condition: "A linen debit or dispatch would drive on_hand_clean or soiled_queue below zero"
  - id: ERR_SERVICE_OPTED_OUT
    http: 422
    condition: "CHECKOUT or STAYOVER assigned to a room whose service_program is OPT_OUT"
  - id: ERR_SERVICE_NOT_DUE
    http: 422
    condition: "STAYOVER assigned to an EVERY_OTHER_DAY room serviced less than two days before the forecast business_date"
  - id: ERR_OCCUPANCY_MISMATCH
    http: 422
    condition: "service_type does not match Room.occupancy_state under the pinned pairing table"
  - id: ERR_INVALID_TIME_WINDOW
    http: 422
    condition: "completed_at not after started_at, returned_at before dispatched_at, expected_return_at not after dispatched_at, or a business_date before the property's creation date"
  - id: ERR_ROOM_WINDOW_OVERLAP
    http: 409
    condition: "The completion window overlaps another non-cancelled assignment window on the same room under half-open comparison"
  - id: ERR_REST_BUFFER_VIOLATION
    http: 409
    condition: "Two of one attendant's cleaning windows are separated by fewer than Property.rest_buffer_minutes under closed-interval comparison"
  - id: ERR_LAUNDRY_CAPACITY_EXCEEDED
    http: 409
    condition: "Aggregate batch_sets of overlapping in-flight cycles plus the new batch exceeds Property.laundry_capacity_sets"
  - id: ERR_RETENTION_EXPIRED
    http: 422
    condition: "Claim filed at or after retention_expires_at"
  - id: ERR_RETENTION_ACTIVE
    http: 409
    condition: "Disposal attempted before retention_expires_at"
  - id: ERR_PROOF_INSUFFICIENT
    http: 422
    condition: "proof_kind DESCRIPTION_MATCH offered for a HIGH_VALUE or ID_DOCUMENT item"
  - id: ERR_DISPOSITION_NOT_PERMITTED
    http: 422
    condition: "DONATED disposition for an ID_DOCUMENT item, SHIPPED without claimant_contact, or an approved claim decision with no disposition named"
  - id: ERR_ASSIGNMENT_IN_PROGRESS
    http: 409
    condition: "Roster close attempted while an assignment on it is still IN_PROGRESS"
  - id: ERR_INSPECTION_SAMPLE_INCOMPLETE
    http: 409
    condition: "Roster close attempted while inspections_completed is below required_inspection_samples"
  - id: ERR_ROSTER_STILL_OPEN
    http: 409
    condition: "ForecastDay close attempted while a roster of the day is still PLANNED or CLOCKED_IN"
  - id: ERR_WAIVER_EXCEEDS_ORDINANCE_MAX
    http: 422
    condition: "waiver_requested_credits exceeds effective_credit_cap times the ordinance headroom factor"
  - id: ERR_WORKED_MINUTES_IMPLAUSIBLE
    http: 422
    condition: "worked_minutes below 0 or above 720"
  - id: ERR_BREAK_EXCEEDS_WORKED
    http: 422
    condition: "break_minutes greater than worked_minutes"
  - id: ERR_ENROLLMENT_ACTIVE_EXISTS
    http: 409
    condition: "A second ACTIVE ServiceEnrollment created for the same room"
  - id: ERR_ENROLLMENT_SKIPS_EXHAUSTED
    http: 422
    condition: "Accrual requested when skips_accrued already equals nights"

roles:
  - name: HousekeepingDirector
    description: "Property leadership: configures the property, its room types, rooms and attendants, publishes and closes forecast days, and owns the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /housekeeping/properties"
      - "POST /housekeeping/room-types"
      - "POST /housekeeping/rooms"
      - "POST /housekeeping/attendants"
      - "PATCH /housekeeping/attendants/{id}"
      - "POST /housekeeping/forecast-days"
      - "POST /housekeeping/forecast-days/{id}/publish"
      - "POST /housekeeping/forecast-days/{id}/close"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "PATCH /housekeeping/rooms/{id} (with FrontDeskAgent)"
      - "POST /housekeeping/shift-rosters (with Supervisor)"
      - "POST /housekeeping/shift-rosters/{id}/close (with Supervisor)"
      - "POST /housekeeping/room-assignments (with Supervisor)"
      - "POST /housekeeping/room-assignments/{id}/cancel (with Supervisor)"
      - "POST /housekeeping/linen-items (with LaundryLead)"
      - "every GET endpoint"

  - name: Supervisor
    description: "Working floor supervisor, an Attendant row with can_inspect true. Builds room assignments, records inspections, files workload waivers and closes shifts."
    identity: "entity_backed:Attendant"
    exclusive_operations:
      - "POST /housekeeping/inspections"
      - "POST /housekeeping/shift-rosters/{id}/waiver-request"
      - "POST /housekeeping/lost-found-items/{id}/claim-decision"
      - "POST /housekeeping/lost-found-items/{id}/dispose"
    shared_operations:
      - "POST /housekeeping/shift-rosters (with HousekeepingDirector)"
      - "POST /housekeeping/shift-rosters/{id}/clock-in (with RoomAttendant)"
      - "POST /housekeeping/shift-rosters/{id}/close (with HousekeepingDirector)"
      - "POST /housekeeping/room-assignments (with HousekeepingDirector)"
      - "POST /housekeeping/room-assignments/{id}/start (with RoomAttendant)"
      - "POST /housekeeping/room-assignments/{id}/complete (with RoomAttendant)"
      - "POST /housekeeping/room-assignments/{id}/cancel (with HousekeepingDirector)"
      - "POST /housekeeping/linen-items/{id}/soil (with LaundryLead)"
      - "POST /housekeeping/lost-found-items (with RoomAttendant)"
      - "POST /housekeeping/lost-found-items/{id}/store (with FrontDeskAgent)"
      - "POST /housekeeping/service-enrollments/{id}/accrue (with FrontDeskAgent)"
      - "every GET endpoint"

  - name: RoomAttendant
    description: "Room attendant, an Attendant row. Clocks in on their own roster, starts and completes their own rooms and logs recovered property."
    identity: "entity_backed:Attendant"
    exclusive_operations: []
    shared_operations:
      - "POST /housekeeping/shift-rosters/{id}/clock-in (with Supervisor, own roster only)"
      - "POST /housekeeping/room-assignments/{id}/start (with Supervisor, own roster only)"
      - "POST /housekeeping/room-assignments/{id}/complete (with Supervisor, own roster only)"
      - "POST /housekeeping/lost-found-items (with Supervisor)"
      - "every GET endpoint"

  - name: LaundryLead
    description: "Laundry plant lead: dispatches, returns and voids laundry cycles and opens linen inventory lines."
    identity: opaque
    exclusive_operations:
      - "POST /housekeeping/laundry-cycles"
      - "POST /housekeeping/laundry-cycles/{id}/return"
      - "POST /housekeeping/laundry-cycles/{id}/void"
    shared_operations:
      - "POST /housekeeping/linen-items (with HousekeepingDirector)"
      - "POST /housekeeping/linen-items/{id}/soil (with Supervisor)"
      - "every GET endpoint"

  - name: FrontDeskAgent
    description: "Front desk: maintains room occupancy posture, enrols guests in opt-out and every-other-day programmes, and files lost-and-found claims."
    identity: opaque
    exclusive_operations:
      - "POST /housekeeping/lost-found-items/{id}/claim"
      - "POST /housekeeping/service-enrollments"
      - "POST /housekeeping/service-enrollments/{id}/void"
    shared_operations:
      - "PATCH /housekeeping/rooms/{id} (with HousekeepingDirector)"
      - "POST /housekeeping/lost-found-items/{id}/store (with Supervisor)"
      - "POST /housekeeping/service-enrollments/{id}/accrue (with Supervisor)"
      - "every GET endpoint"

  - name: ComplianceOfficer
    description: "Ordinance compliance officer: the only role that may decide a workload waiver, and never the role that files one."
    identity: opaque
    exclusive_operations:
      - "POST /housekeeping/shift-rosters/{id}/waiver-decision"
    shared_operations:
      - "every GET endpoint"
