              captures: { track_id: $.data.id }
            - call: "POST /box/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BoxManager
            - call: "POST /box/sessions"
              payload: { track_id: "${track_id}", coach_id: "${coach_id}", starts_at: "2026-06-10T18:00:00Z", duration_minutes: 60, capacity: 5, drop_in_fee_cents: 2500 }
              as: Coach
              as_user_id: "${coach_id}"
              captures: { sess_id: $.data.id, sess_v: $.data.version }
            - call: "POST /box/members/register"
              payload: { email: "b6v@x.com", full_name: "B6V", home_box_member: false }
              as: Anonymous
              captures: { v_id: $.data.id }
            - call: "POST /box/reservations"
              payload: { session_id: "${sess_id}", member_id: "${v_id}", reservation_kind: "DROP_IN", expected_session_version: "${sess_v}" }
              as: Member
              as_user_id: "${v_id}"
              captures: { resv_id: $.data.id }
            - call: "POST /box/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T06:00:00Z" }
              as: BoxManager
          trigger:
            - call: "POST /box/reservations/${resv_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${v_id}"
          assert:
            - "Reservation.${resv_id}.drop_in_fee_charged_cents == 0"
            - "Reservation.${resv_id}.status == CANCELLED"

      - name: empty_leaderboard_returns_empty_array
        grounds:
          - calculations.leaderboard_ranking
          - endpoints
          - entities.BenchmarkResult.fields.verified
        distinguishing_aspect: "Empty-set edge on a different metric and a different endpoint (GET /box/program-tracks/{id}/leaderboard): with zero verified results for the benchmark the leaderboard is an empty array (length 0), not an error — distinct from the numeric-threshold boundary instance."
        test_recipe:
          setup:
            - "A REGULAR track exists; one UNVERIFIED FRAN result exists (so verified filter excludes it) — no verified results at all."
          setup_api_calls:
            - call: "POST /box/coaches"
              payload: { full_name: "Coach B6b", email: "cb6b@x.com", certified: true }
