# =============================================================================
# SCAFFOLD.yaml — Ocean Freight Forwarding & NVOCC Operations
# §1.0–§1.7 seed tables (difficulty design and corner design live in sibling files)
# =============================================================================

scenario: |
  Ocean Freight Forwarding & NVOCC Operations (licensed NVOCC/forwarder): booking
  with carrier contract or spot rate, container stuffing/CFS consolidation & FCL vs
  LCL decision, bill of lading issuance & release control, ISF/AMS filing deadline
  compliance, demurrage/detention monitoring & free-time management, tariff
  publication & NVOCC bonding, cargo insurance & claim handling, rollover/blank
  sailing contingency

domain_name: ocean-freight-nvocc
api_prefix: /freight

complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Quota / allocation"
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many      # Booking <-> Consolidation via ContainerAssignment junction
    - cross_aggregate   # BillOfLading gates on ComplianceFiling / SuretyBond / Invoice
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (13 entities, flat topology, FK-linked)
# =============================================================================
entities:
  - name: Shipper
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Shipper legal entity name" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum tolerated credit exposure in cents" }
      - { name: credit_terms, type: enum, source: input, default: PREPAID_ONLY, description: "PREPAID_ONLY | NET_7 | NET_30; drives invoice due_date offset", constraints: "enum {PREPAID_ONLY, NET_7, NET_30}" }
      - { name: credit_exposure_posted_cents, type: integer, source: computed, default: 0, description: "Sum of balance_cents over this shipper's invoices with status IN {ISSUED, PARTIALLY_PAID}" }
      - { name: credit_exposure_forward_cents, type: integer, source: computed, default: 0, description: "credit_exposure_posted_cents + estimated_freight_cents of bookings with status IN {CONFIRMED, DOCUMENTATION_CLEARED, LOADED, DEPARTED, ARRIVED} that have no FREIGHT invoice with status IN {DRAFT, ISSUED, PARTIALLY_PAID, PAID}" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> SUSPENDED -> ACTIVE; auto-SUSPENDED when posted exposure exceeds credit_limit", constraints: "enum {ACTIVE, SUSPENDED}" }

  - name: Tariff
    parent: null
    common_fields: true
    fields:
      - { name: tariff_code, type: string, source: input, description: "Published tariff identifier (FMC tariff publication record)" }
      - { name: origin_port, type: string, source: input, description: "UN/LOCODE-style origin port code, e.g. CNSHA" }
      - { name: destination_port, type: string, source: input, description: "Destination port code, e.g. USLAX" }
      - { name: commodity_type, type: enum, source: input, description: "GENERAL | REEFER | HAZMAT", constraints: "enum {GENERAL, REEFER, HAZMAT}" }
      - { name: mode, type: enum, source: input, description: "FCL | LCL", constraints: "enum {FCL, LCL}" }
      - { name: container_type, type: enum, source: input, description: "Required iff mode == FCL; forbidden when mode == LCL", constraints: "enum {20GP, 40GP, 40HC, 40RF}; null allowed" }
      - { name: rate_per_unit_cents, type: integer, source: input, description: "Sell rate: per container (FCL) or per revenue ton (LCL)" }
      - { name: minimum_charge_cents, type: integer, source: input, default: 0, description: "LCL minimum freight; ignored for FCL" }
      - { name: effective_from, type: datetime, source: input, description: "Window start, inclusive" }
      - { name: effective_to, type: datetime, source: input, description: "Window end, EXCLUSIVE — window is half-open [effective_from, effective_to)" }
      - { name: status, type: enum, source: system, description: "DRAFT -> PUBLISHED -> SUPERSEDED | RETIRED", constraints: "enum {DRAFT, PUBLISHED, SUPERSEDED, RETIRED}" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the ComplianceOfficer who created the draft (SoD anchor)" }
      - { name: published_by_user_id, type: string, source: system, description: "X-User-ID of the ComplianceOfficer who published; must differ from created_by_user_id" }

  - name: CarrierContract
    parent: null
    common_fields: true
    fields:
      - { name: contract_number, type: string, source: input, description: "Carrier service contract number" }
      - { name: carrier_name, type: string, source: input, description: "Ocean carrier name" }
      - { name: service_lane, type: string, source: input, description: "Lane string, e.g. CNSHA-USLAX" }
      - { name: container_rates, type: array, source: input, description: "Array of {container_type, rate_cents} buy rates per FCL container type" }
      - { name: demurrage_free_days, type: integer, source: input, default: 4, description: "Free days at destination terminal before demurrage accrues" }
      - { name: detention_free_days, type: integer, source: input, default: 3, description: "Free days after gate-out before detention accrues" }
      - { name: demurrage_tiers, type: array, source: input, description: "Array of {from_day, to_day (null = unbounded), per_diem_cents}; day indexes are 1-based chargeable days beyond free time; tiers must tile contiguously from from_day=1" }
      - { name: detention_per_diem_cents, type: integer, source: input, description: "Flat detention rate per chargeable day" }
      - { name: service_start, type: datetime, source: input, description: "Contract service window start, INCLUSIVE — closed interval" }
      - { name: service_end, type: datetime, source: input, description: "Contract service window end, INCLUSIVE — closed interval [service_start, service_end]" }
      - { name: status, type: enum, source: system, description: "NEGOTIATION -> ACTIVE -> SUSPENDED -> ACTIVE -> EXPIRED", constraints: "enum {NEGOTIATION, ACTIVE, SUSPENDED, EXPIRED}" }

  - name: SuretyBond
    parent: null
    common_fields: true
    fields:
      - { name: bond_number, type: string, source: input, description: "FMC NVOCC bond number" }
      - { name: surety_company, type: string, source: input, description: "Surety underwriter" }
      - { name: coverage_amount_cents, type: integer, source: input, description: "Total bond coverage in cents" }
      - { name: available_coverage_cents, type: integer, source: computed, description: "= coverage_amount_cents - SUM(penalty_amount_cents over ComplianceFiling with penalty_status == ACCRUED)" }
      - { name: effective_from, type: datetime, source: input, description: "Bond window start, inclusive" }
      - { name: effective_to, type: datetime, source: input, description: "Bond window end, EXCLUSIVE — half-open [effective_from, effective_to)" }
      - { name: status, type: enum, source: system, description: "INACTIVE -> ACTIVE -> EXPIRED; EXPIRED assigned lazily when logical clock >= effective_to", constraints: "enum {INACTIVE, ACTIVE, EXPIRED}" }

  - name: Voyage
    parent: null
    common_fields: true
    fields:
      - { name: vessel_name, type: string, source: input, description: "Vessel name" }
      - { name: voyage_number, type: string, source: input, description: "Voyage number" }
      - { name: carrier_contract_id, type: string, source: input, description: "FK -> CarrierContract.id; contract must be ACTIVE at voyage creation" }
      - { name: origin_port, type: string, source: input, description: "Origin port code" }
      - { name: destination_port, type: string, source: input, description: "Destination port code" }
      - { name: etd, type: datetime, source: input, description: "Estimated time of departure; must fall inside contract closed window" }
      - { name: eta, type: datetime, source: input, description: "Estimated time of arrival; must be > etd" }
      - { name: isf_deadline, type: datetime, source: computed, description: "= etd - 24h (ISF 10+2 must be filed 24h before loading)" }
      - { name: ams_deadline, type: datetime, source: computed, description: "= etd - 48h (AMS manifest filing 48h before loading)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> BOOKING_OPEN -> DEPARTED -> ARRIVED -> CLOSED; BLANKED terminal from SCHEDULED|BOOKING_OPEN", constraints: "enum {SCHEDULED, BOOKING_OPEN, DEPARTED, ARRIVED, CLOSED, BLANKED}" }

  - name: Booking
    parent: null
    common_fields: true
    fields:
      - { name: booking_number, type: string, source: system, description: "Server-minted booking reference BK-<seq>" }
      - { name: shipper_id, type: string, source: system, description: "FK -> Shipper.id; defaults to X-User-ID for Shipper role, required in body for BookingCoordinator" }
      - { name: voyage_id, type: string, source: input, description: "FK -> Voyage.id; voyage must be BOOKING_OPEN at creation" }
      - { name: tariff_id, type: string, source: input, description: "FK -> Tariff.id; must be PUBLISHED with window covering voyage.etd and matching lane/commodity/mode" }
      - { name: rate_source, type: enum, source: input, description: "CONTRACT = sell at tariff rate; SPOT = sell at agreed spot_rate_per_unit_cents", constraints: "enum {CONTRACT, SPOT}" }
      - { name: spot_rate_per_unit_cents, type: integer, source: input, description: "Required iff rate_source == SPOT; forbidden when CONTRACT" }
      - { name: mode, type: enum, source: input, description: "FCL | LCL", constraints: "enum {FCL, LCL}" }
      - { name: container_type, type: enum, source: input, description: "Required iff mode == FCL; must equal tariff.container_type; forbidden when LCL", constraints: "enum {20GP, 40GP, 40HC, 40RF}; null allowed" }
      - { name: container_count, type: integer, source: input, description: "Required iff mode == FCL, >= 1; forbidden when LCL" }
      - { name: commodity_type, type: enum, source: input, description: "GENERAL | REEFER | HAZMAT; must equal tariff.commodity_type", constraints: "enum {GENERAL, REEFER, HAZMAT}" }
      - { name: gross_weight_kg, type: number, source: input, description: "Total gross weight; > 0" }
      - { name: volume_cbm, type: number, source: input, description: "Total volume; > 0" }
      - { name: terms, type: enum, source: input, description: "PREPAID = pay before B/L release; COLLECT = pay before delivery", constraints: "enum {PREPAID, COLLECT}" }
      - { name: chargeable_weight_rt, type: number, source: computed, description: "Revenue tons = max(gross_weight_kg / 1000, volume_cbm), 3 decimals round_half_up" }
      - { name: estimated_freight_cents, type: integer, source: computed, default: 0, description: "Sell-side total freight per calculation ocean_freight_charge; computed at creation, recomputed on amend/confirm/rebook" }
      - { name: rollover_count, type: integer, source: system, default: 0, description: "Increments on every transition into ROLLED; cap MAX_ROLLOVERS = 2" }
      - { name: rolled_reason, type: enum, source: system, description: "Set on entry to ROLLED: SHIPPER_REQUEST | BLANK_SAILING | MISSED_DEPARTURE; null otherwise", constraints: "enum {SHIPPER_REQUEST, BLANK_SAILING, MISSED_DEPARTURE}; null allowed" }
      - { name: pending_rollover_fee_cents, type: integer, source: system, default: 0, description: "Fee owed from last shipper-requested rebook; consumed into the FREIGHT invoice as ROLLOVER_FEE line" }
      - { name: status, type: enum, source: system, description: "QUOTED -> CONFIRMED -> DOCUMENTATION_CLEARED -> LOADED -> DEPARTED -> ARRIVED -> DELIVERED; ROLLED <-> CONFIRMED cycle; CANCELLED terminal", constraints: "enum {QUOTED, CONFIRMED, DOCUMENTATION_CLEARED, LOADED, DEPARTED, ARRIVED, DELIVERED, ROLLED, CANCELLED}" }

  - name: Consolidation
    parent: null
    common_fields: true
    fields:
      - { name: consolidation_number, type: string, source: system, description: "Server-minted CFS consolidation reference CON-<seq>" }
      - { name: voyage_id, type: string, source: input, description: "FK -> Voyage.id; voyage must be BOOKING_OPEN" }
      - { name: cfs_location, type: string, source: input, description: "Container freight station code" }
      - { name: container_type, type: enum, source: input, description: "Consolidation box type", constraints: "enum {20GP, 40GP, 40HC, 40RF}" }
      - { name: max_weight_kg, type: number, source: input, description: "Payload capacity kg; > 0" }
      - { name: max_volume_cbm, type: number, source: input, description: "Capacity cbm; > 0" }
      - { name: used_weight_kg, type: number, source: computed, default: 0, description: "SUM stuffed_weight_kg over member ContainerAssignment with status IN {STUFFED, GATED_IN, LOADED}" }
      - { name: used_volume_cbm, type: number, source: computed, default: 0, description: "SUM stuffed_volume_cbm over member ContainerAssignment with status IN {STUFFED, GATED_IN, LOADED}" }
      - { name: stuffing_window_start, type: datetime, source: input, description: "Stuffing window start, inclusive" }
      - { name: stuffing_window_end, type: datetime, source: input, description: "Stuffing window end, EXCLUSIVE — half-open [start, end); end must be > start" }
      - { name: status, type: enum, source: system, description: "OPEN -> CLOSED -> TENDERED -> DEPARTED -> ARRIVED; auto-reopen CLOSED -> OPEN when last member removed; CANCELLED from OPEN|CLOSED", constraints: "enum {OPEN, CLOSED, TENDERED, DEPARTED, ARRIVED, CANCELLED}" }

  - name: ContainerAssignment
    parent: null
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id" }
      - { name: consolidation_id, type: string, source: system, description: "FK -> Consolidation.id; null for FCL direct assignments; set by the stuff endpoint for LCL" }
      - { name: assignment_mode, type: enum, source: system, description: "FCL when consolidation_id is null, LCL otherwise", constraints: "enum {FCL, LCL}" }
      - { name: container_number, type: string, source: input, description: "FCL: operator-supplied box number; LCL: assigned by system from consolidation as <consolidation_number>-BX" }
      - { name: seal_number, type: string, source: input, description: "Optional seal; LCL sealed at consolidation level" }
      - { name: stuffed_weight_kg, type: number, source: input, description: "Stuffed gross weight (FCL input; LCL copied from booking.gross_weight_kg)" }
      - { name: stuffed_volume_cbm, type: number, source: input, description: "Stuffed volume (FCL input; LCL copied from booking.volume_cbm)" }
      - { name: stuffed_at, type: datetime, source: system, description: "Logical clock at stuffing" }
      - { name: gated_in_at, type: datetime, source: system, description: "Logical clock at gate-in; null until GATED_IN" }
      - { name: discharged_at, type: datetime, source: system, description: "Logical clock at voyage arrival; null until DISCHARGED" }
      - { name: gated_out_at, type: datetime, source: system, description: "Logical clock at gate-out; null until GATED_OUT" }
      - { name: empty_returned_at, type: datetime, source: system, description: "Logical clock at empty return; null until EMPTY_RETURNED" }
      - { name: demurrage_days, type: integer, source: computed, default: 0, description: "Final chargeable demurrage days; computed at gate-out per demurrage_detention_charge" }
      - { name: detention_days, type: integer, source: computed, default: 0, description: "Final chargeable detention days; computed at empty-return" }
      - { name: provisional_demurrage_cents, type: integer, source: computed, default: 0, description: "Forward-looking estimate using logical clock as open-interval endpoint; recomputed on every read while assignment is DISCHARGED or GATED_OUT" }
      - { name: provisional_detention_cents, type: integer, source: computed, default: 0, description: "Same provisional basis for the detention interval" }
      - { name: demurrage_charge_cents, type: integer, source: computed, default: 0, description: "FINAL demurrage charge frozen at gate-out" }
      - { name: detention_charge_cents, type: integer, source: computed, default: 0, description: "FINAL detention charge frozen at empty-return" }
      - { name: status, type: enum, source: system, description: "STUFFED -> GATED_IN -> LOADED -> DISCHARGED -> GATED_OUT -> EMPTY_RETURNED; CANCELLED terminal", constraints: "enum {STUFFED, GATED_IN, LOADED, DISCHARGED, GATED_OUT, EMPTY_RETURNED, CANCELLED}" }

  - name: BillOfLading
    parent: null
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id" }
      - { name: bl_number, type: string, source: system, description: "Server-minted B/L number BL-<seq>" }
      - { name: bl_type, type: enum, source: input, description: "HOUSE | MASTER", constraints: "enum {HOUSE, MASTER}" }
      - { name: release_mode, type: enum, source: input, description: "ORIGINAL (paper surrender required) | SEAWAY (express) | TELEX (surrender at origin)", constraints: "enum {ORIGINAL, SEAWAY, TELEX}" }
      - { name: issued_by_user_id, type: string, source: system, description: "X-User-ID of issuing DocumentationOfficer (SoD anchor)" }
      - { name: released_by_user_id, type: string, source: system, description: "X-User-ID of releasing DocumentationOfficer; must differ from issued_by_user_id" }
      - { name: amendment_count, type: integer, source: system, default: 0, description: "Increments on ISSUED -> AMENDMENT_PENDING; cap MAX_AMENDMENTS = 3" }
      - { name: status, type: enum, source: system, description: "DRAFT -> ISSUED -> AMENDMENT_PENDING -> DRAFT amendment cycle; ISSUED -> SURRENDERED -> RELEASED; ISSUED -> RELEASED for SEAWAY; VOIDED terminal", constraints: "enum {DRAFT, ISSUED, AMENDMENT_PENDING, SURRENDERED, RELEASED, VOIDED}" }

  - name: ComplianceFiling
    parent: null
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; at most one filing per (booking_id, filing_type)" }
      - { name: filing_type, type: enum, source: input, description: "ISF | AMS", constraints: "enum {ISF, AMS}" }
      - { name: deadline_at, type: datetime, source: computed, description: "Snapshot frozen at creation: voyage.isf_deadline for ISF, voyage.ams_deadline for AMS" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical clock at each submission (refreshed on REJECTED -> SUBMITTED resubmission)" }
      - { name: is_late, type: boolean, source: computed, default: false, description: "= submitted_at > deadline_at (strictly greater; submission exactly AT the deadline is ON TIME)" }
      - { name: penalty_status, type: enum, source: system, description: "NONE -> ACCRUED -> PAID | WAIVED; ACCRUED debits SuretyBond.available_coverage_cents", constraints: "enum {NONE, ACCRUED, PAID, WAIVED}" }
      - { name: penalty_amount_cents, type: integer, source: computed, default: 0, description: "0 when not late; ISF_LATE_PENALTY 500000 or AMS_LATE_PENALTY 300000 when late (per isf_ams_penalty)" }
      - { name: filed_by_user_id, type: string, source: system, description: "X-User-ID of filing ComplianceOfficer" }
      - { name: status, type: enum, source: system, description: "PENDING -> SUBMITTED -> ACCEPTED | REJECTED; REJECTED -> SUBMITTED resubmission loop", constraints: "enum {PENDING, SUBMITTED, ACCEPTED, REJECTED}" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id" }
      - { name: invoice_number, type: string, source: system, description: "Server-minted INV-<seq>" }
      - { name: invoice_type, type: enum, source: input, description: "FREIGHT (one per booking) | DEMURRAGE_DETENTION (auto-created at empty-return) | CANCELLATION (auto-created on fee-bearing cancel)", constraints: "enum {FREIGHT, DEMURRAGE_DETENTION, CANCELLATION}" }
      - { name: lines, type: array, source: computed, description: "Array of {line_type, description, quantity, unit_rate_cents, amount_cents}; line_type IN {OCEAN_FREIGHT, BAF, THC, DOC_FEE, INSURANCE_PREMIUM, ROLLOVER_FEE, CANCELLATION_FEE, DEMURRAGE, DETENTION, MANUAL_ADJUSTMENT}; amount_cents = round_half_up(quantity * unit_rate_cents) PER LINE, then total sums the rounded line amounts" }
      - { name: total_cents, type: integer, source: computed, default: 0, description: "SUM of per-line rounded amount_cents" }
      - { name: paid_cents, type: integer, source: system, default: 0, description: "SUM of recorded payments" }
      - { name: balance_cents, type: integer, source: computed, default: 0, description: "= total_cents - paid_cents" }
      - { name: issued_at, type: datetime, source: system, description: "Logical clock at issue; null while DRAFT" }
      - { name: due_date, type: datetime, source: computed, description: "= issued_at + shipper.credit_terms days (PREPAID_ONLY = 0, NET_7 = 7d, NET_30 = 30d)" }
      - { name: status, type: enum, source: system, description: "DRAFT -> ISSUED -> PARTIALLY_PAID -> PARTIALLY_PAID (self-loop) -> PAID; VOID from DRAFT or from ISSUED when paid_cents == 0", constraints: "enum {DRAFT, ISSUED, PARTIALLY_PAID, PAID, VOID}" }

  - name: CargoInsurancePolicy
    parent: null
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id" }
      - { name: policy_number, type: string, source: system, description: "Server-minted POL-<seq>" }
      - { name: coverage_type, type: enum, source: input, description: "ALL_RISK | WA (With Average) | FPA (Free of Particular Average)", constraints: "enum {ALL_RISK, WA, FPA}" }
      - { name: cargo_value_cents, type: integer, source: input, description: "Declared cargo value; > 0" }
      - { name: insured_value_cents, type: integer, source: computed, description: "= round_half_up((cargo_value_cents + freight_base_cents) * 1.10) per insured_value_premium (CIF + 10%)" }
      - { name: freight_base_cents, type: integer, source: computed, description: "Snapshot of the booking freight BASE (ocean freight line only, no surcharges) at quote time" }
      - { name: premium_cents, type: integer, source: computed, description: "= max(MIN_PREMIUM_CENTS, round_half_up(insured_value_cents * rate)); rate by coverage_type: ALL_RISK 0.006, WA 0.004, FPA 0.0025" }
      - { name: status, type: enum, source: system, description: "QUOTED -> BOUND -> CANCELLED; BOUND -> EXPIRED at booking DELIVERED", constraints: "enum {QUOTED, BOUND, CANCELLED, EXPIRED}" }

  - name: CargoClaim
    parent: null
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: input, description: "FK -> CargoInsurancePolicy.id; policy must be BOUND" }
      - { name: booking_id, type: string, source: system, description: "FK -> Booking.id; denormalized from policy.booking_id" }
      - { name: claim_number, type: string, source: system, description: "Server-minted CLM-<seq>" }
      - { name: claim_type, type: enum, source: input, description: "DAMAGE | LOSS | SHORTAGE | DELAY", constraints: "enum {DAMAGE, LOSS, SHORTAGE, DELAY}" }
      - { name: claimed_amount_cents, type: integer, source: input, description: "Amount claimed; > 0" }
      - { name: description, type: string, source: input, description: "Optional free-text loss description" }
      - { name: deductible_cents, type: integer, source: computed, description: "ALL_RISK/WA: max(50000, round_half_up(insured_value_cents * 0.01)); FPA: max(100000, round_half_up(insured_value_cents * 0.02))" }
      - { name: settlement_amount_cents, type: integer, source: computed, description: "Computed at approve per claim_settlement variant rules; 0 while FILED/UNDER_REVIEW/DENIED" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "X-User-ID of ClaimsAdjuster who started review (SoD anchor)" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of approving/denying ClaimsAdjuster; must differ from reviewed_by_user_id" }
      - { name: settled_at, type: datetime, source: system, description: "Logical clock at settlement; null until SETTLED" }
      - { name: status, type: enum, source: system, description: "FILED -> UNDER_REVIEW -> APPROVED -> SETTLED; UNDER_REVIEW -> DENIED", constraints: "enum {FILED, UNDER_REVIEW, APPROVED, DENIED, SETTLED}" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Shipper
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (automatic when an invoice issue leaves credit_exposure_posted_cents > credit_limit_cents) OR POST /freight/shippers/{shipperId}/suspend"
        actor: FinanceController | system
        preconditions:
          - "Shipper must be ACTIVE (ERR_SHIPPER_INVALID_STATE)"
        side_effects:
          - "New booking creation for this shipper blocked (ERR_SHIPPER_SUSPENDED)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: POST /freight/shippers/{shipperId}/reinstate
        actor: FinanceController
        preconditions:
          - "Shipper must be SUSPENDED (ERR_SHIPPER_INVALID_STATE)"
          - "credit_exposure_posted_cents <= credit_limit_cents (ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects: []

  - entity: Tariff
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, RETIRED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: POST /freight/tariffs/{tariffId}/publish
        actor: ComplianceOfficer
        preconditions:
          - "Tariff must be DRAFT (ERR_TARIFF_INVALID_STATE)"
          - "published_by_user_id != created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "effective_from < effective_to (ERR_INVALID_REQUEST)"
          - "No OTHER tariff with status PUBLISHED and identical (origin_port, destination_port, commodity_type, mode, container_type) whose half-open window [effective_from, effective_to) intersects this tariff's window; adjacency (a.effective_to == b.effective_from) is NOT an intersection (ERR_TARIFF_WINDOW_OVERLAP)"
        side_effects:
          - "If payload supersedes_tariff_id given: that tariff (must be PUBLISHED, same key tuple) transitions PUBLISHED -> SUPERSEDED"
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system (automatic when another tariff publishes with supersedes_tariff_id naming this tariff)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PUBLISHED
        to: RETIRED
        trigger: POST /freight/tariffs/{tariffId}/retire
        actor: ComplianceOfficer
        preconditions:
          - "Tariff must be PUBLISHED (ERR_TARIFF_INVALID_STATE)"
        side_effects:
          - "Existing bookings pinned to this tariff are unaffected; new bookings referencing it fail ERR_TARIFF_NOT_EFFECTIVE"

  - entity: CarrierContract
    initial_state: NEGOTIATION
    terminal_states: [EXPIRED]
    transitions:
      - from: NEGOTIATION
        to: ACTIVE
        trigger: POST /freight/carrier-contracts/{contractId}/activate
        actor: OperationsManager
        preconditions:
          - "Contract must be NEGOTIATION (ERR_CONTRACT_INVALID_STATE)"
          - "service_start <= service_end (ERR_INVALID_REQUEST)"
          - "No OTHER contract with identical (carrier_name, service_lane) and status IN {ACTIVE, SUSPENDED} whose CLOSED window [service_start, service_end] intersects this closed window; adjacency (a.service_end == b.service_start) IS an intersection (ERR_CONTRACT_WINDOW_OVERLAP)"
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: POST /freight/carrier-contracts/{contractId}/suspend
        actor: OperationsManager
        preconditions:
          - "Contract must be ACTIVE (ERR_CONTRACT_INVALID_STATE)"
        side_effects:
          - "New voyage creation against this contract blocked (ERR_CONTRACT_NOT_ACTIVE); existing voyages unaffected"
      - from: SUSPENDED
        to: ACTIVE
        trigger: POST /freight/carrier-contracts/{contractId}/resume
        actor: OperationsManager
        preconditions:
          - "Contract must be SUSPENDED (ERR_CONTRACT_INVALID_STATE)"
          - "Window-overlap check re-run against ACTIVE contracts on resume (ERR_CONTRACT_WINDOW_OVERLAP)"
        side_effects: []
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (lazy, evaluated on read or on any use: logical clock > service_end)"
        actor: system
        preconditions: []
        side_effects:
          - "Voyages already SCHEDULED/BOOKING_OPEN remain valid (pinned contract reference)"

  - entity: SuretyBond
    initial_state: INACTIVE
    terminal_states: [EXPIRED]
    transitions:
      - from: INACTIVE
        to: ACTIVE
        trigger: POST /freight/surety-bonds/{bondId}/activate
        actor: ComplianceOfficer
        preconditions:
          - "Bond must be INACTIVE (ERR_BOND_INVALID_STATE)"
          - "effective_from <= logical clock < effective_to (ERR_BOND_NOT_IN_WINDOW)"
        side_effects: []
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (lazy, evaluated on read or on any gate check: logical clock >= effective_to)"
        actor: system
        preconditions: []
        side_effects:
          - "B/L issuance gate fails while no qualifying bond exists (ERR_BOND_COVERAGE_INSUFFICIENT)"

  - entity: Voyage
    initial_state: SCHEDULED
    terminal_states: [CLOSED, BLANKED]
    transitions:
      - from: SCHEDULED
        to: BOOKING_OPEN
        trigger: POST /freight/voyages/{voyageId}/open-for-booking
        actor: OperationsManager
        preconditions:
          - "Voyage must be SCHEDULED (ERR_VOYAGE_INVALID_STATE)"
        side_effects: []
      - from: BOOKING_OPEN
        to: DEPARTED
        trigger: POST /freight/voyages/{voyageId}/depart
        actor: OperationsManager
        preconditions:
          - "Voyage must be BOOKING_OPEN (ERR_VOYAGE_INVALID_STATE)"
          - "Logical clock >= etd (ERR_VOYAGE_NOT_DEPARTABLE)"
        side_effects:
          - "Bookings with status LOADED -> DEPARTED"
          - "Bookings with status CONFIRMED or DOCUMENTATION_CLEARED -> ROLLED with rolled_reason = MISSED_DEPARTURE, rollover_count += 1; if rollover_count would exceed MAX_ROLLOVERS the booking transitions to CANCELLED instead"
          - "Bookings with status QUOTED -> CANCELLED (quote lapsed)"
          - "Cascade per rolled booking: its BillOfLading in {DRAFT, ISSUED, AMENDMENT_PENDING, SURRENDERED} -> VOIDED; its FREIGHT invoices in DRAFT -> VOID; its ContainerAssignment in {STUFFED, GATED_IN} -> CANCELLED"
          - "Consolidations with status IN {OPEN, CLOSED, TENDERED} on this voyage -> CANCELLED; member ContainerAssignments -> CANCELLED; member bookings already ROLLED by the step above"
      - from: DEPARTED
        to: ARRIVED
        trigger: POST /freight/voyages/{voyageId}/arrive
        actor: OperationsManager
        preconditions:
          - "Voyage must be DEPARTED (ERR_VOYAGE_INVALID_STATE)"
          - "Logical clock >= eta (ERR_VOYAGE_NOT_ARRIVABLE)"
        side_effects:
          - "Bookings with status DEPARTED -> ARRIVED"
          - "ContainerAssignments with status LOADED on those bookings -> DISCHARGED with discharged_at = logical clock (demurrage clock starts)"
          - "Consolidations with status DEPARTED -> ARRIVED"
      - from: ARRIVED
        to: CLOSED
        trigger: POST /freight/voyages/{voyageId}/close
        actor: OperationsManager
        preconditions:
          - "Voyage must be ARRIVED (ERR_VOYAGE_INVALID_STATE)"
          - "Every booking on the voyage must be in {DELIVERED, CANCELLED} (ERR_VOYAGE_HAS_OPEN_BOOKINGS)"
        side_effects: []
      - from: SCHEDULED
        to: BLANKED
        trigger: POST /freight/voyages/{voyageId}/blank
        actor: OperationsManager
        preconditions:
          - "Voyage must be SCHEDULED or BOOKING_OPEN (ERR_VOYAGE_INVALID_STATE)"
        side_effects:
          - "Blank-sailing cascade: bookings in {CONFIRMED, DOCUMENTATION_CLEARED, LOADED} -> ROLLED with rolled_reason = BLANK_SAILING, rollover_count += 1 (CANCELLED instead if cap exceeded)"
          - "Bookings in QUOTED -> CANCELLED"
          - "Cascade per rolled booking: BillOfLading in {DRAFT, ISSUED, AMENDMENT_PENDING, SURRENDERED} -> VOIDED; FREIGHT invoices in DRAFT -> VOID; ContainerAssignments in {STUFFED, GATED_IN} -> CANCELLED"
          - "Voided DRAFT invoices drop out of Shipper.credit_exposure_* recompute (both variants)"
          - "Consolidations in {OPEN, CLOSED, TENDERED} -> CANCELLED, members CANCELLED"
      - from: BOOKING_OPEN
        to: BLANKED
        trigger: POST /freight/voyages/{voyageId}/blank
        actor: OperationsManager
        preconditions:
          - "Voyage must be SCHEDULED or BOOKING_OPEN (ERR_VOYAGE_INVALID_STATE)"
        side_effects:
          - "Same blank-sailing cascade as SCHEDULED -> BLANKED"

  - entity: Booking
    initial_state: QUOTED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: QUOTED
        to: CONFIRMED
        trigger: POST /freight/bookings/{bookingId}/confirm
        actor: BookingCoordinator
        preconditions:
          - "Booking must be QUOTED (ERR_BOOKING_INVALID_STATE)"
          - "Shipper must be ACTIVE (ERR_SHIPPER_SUSPENDED)"
          - "Credit gate: shipper.credit_exposure_forward_cents (excluding this booking's own estimate) + booking.estimated_freight_cents <= shipper.credit_limit_cents; equality is ALLOWED (ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects:
          - "estimated_freight_cents recomputed and frozen per ocean_freight_charge"
          - "Shipper.credit_exposure_forward_cents now includes this booking"
      - from: QUOTED
        to: CANCELLED
        trigger: POST /freight/bookings/{bookingId}/cancel
        actor: Shipper | BookingCoordinator
        preconditions:
          - "Booking must be QUOTED, CONFIRMED, or DOCUMENTATION_CLEARED (ERR_BOOKING_NOT_CANCELLABLE)"
          - "No invoice of this booking with status IN {ISSUED, PARTIALLY_PAID} and balance_cents > 0 (ERR_OUTSTANDING_BALANCE)"
        side_effects:
          - "No cancellation fee from QUOTED"
          - "Shipper exposure variants recompute (booking estimate drops out of forward set)"
      - from: CONFIRMED
        to: CANCELLED
        trigger: POST /freight/bookings/{bookingId}/cancel
        actor: Shipper | BookingCoordinator
        preconditions:
          - "Booking must be QUOTED, CONFIRMED, or DOCUMENTATION_CLEARED (ERR_BOOKING_NOT_CANCELLABLE)"
          - "No invoice of this booking with status IN {ISSUED, PARTIALLY_PAID} and balance_cents > 0 (ERR_OUTSTANDING_BALANCE)"
        side_effects:
          - "Cancellation fee: auto-create CANCELLATION invoice (DRAFT) with one CANCELLATION_FEE line, CANCELLATION_FEE_CENTS 75000"
          - "ContainerAssignments in {STUFFED, GATED_IN} -> CANCELLED; LCL removal recomputes Consolidation.used_weight_kg / used_volume_cbm; if that consolidation is CLOSED and no member assignment remains in {STUFFED, GATED_IN, LOADED}, consolidation CLOSED -> OPEN"
          - "BillOfLading in {DRAFT, ISSUED, AMENDMENT_PENDING, SURRENDERED} -> VOIDED"
          - "FREIGHT invoices in DRAFT -> VOID"
          - "CargoInsurancePolicy in {QUOTED, BOUND} -> CANCELLED"
          - "Shipper exposure variants recompute"
      - from: DOCUMENTATION_CLEARED
        to: CANCELLED
        trigger: POST /freight/bookings/{bookingId}/cancel
        actor: Shipper | BookingCoordinator
        preconditions:
          - "Same as CONFIRMED -> CANCELLED"
        side_effects:
          - "Same cascade as CONFIRMED -> CANCELLED"
      - from: CONFIRMED
        to: DOCUMENTATION_CLEARED
        trigger: "system (automatic, re-evaluated whenever a ComplianceFiling for this booking becomes ACCEPTED and whenever its BillOfLading becomes ISSUED)"
        actor: system
        preconditions:
          - "Booking has one ACCEPTED ComplianceFiling with filing_type == ISF AND one ACCEPTED ComplianceFiling with filing_type == AMS"
          - "Booking has a BillOfLading with status IN {ISSUED, SURRENDERED}"
        side_effects:
          - "Re-evaluate LOADED gate (see CONFIRMED/DOCUMENTATION_CLEARED -> LOADED rule below)"
      - from: DOCUMENTATION_CLEARED
        to: LOADED
        trigger: "system (automatic bubble-up: fires when FCL — count of ContainerAssignment in GATED_IN == booking.container_count; LCL — its assignment's consolidation reaches TENDERED)"
        actor: system
        preconditions:
          - "FCL: exactly container_count assignments of this booking are in {GATED_IN, LOADED}"
          - "LCL: booking has an assignment with consolidation.status IN {TENDERED, DEPARTED, ARRIVED}"
        side_effects:
          - "Member ContainerAssignments GATED_IN -> LOADED"
      - from: CONFIRMED
        to: ROLLED
        trigger: POST /freight/bookings/{bookingId}/roll
        actor: Shipper | BookingCoordinator
        preconditions:
          - "Booking must be CONFIRMED or DOCUMENTATION_CLEARED (ERR_BOOKING_INVALID_STATE)"
          - "rollover_count < MAX_ROLLOVERS (2) (ERR_ROLLOVER_LIMIT_EXCEEDED)"
        side_effects:
          - "rolled_reason = SHIPPER_REQUEST; rollover_count += 1"
          - "BillOfLading in {DRAFT, ISSUED, AMENDMENT_PENDING, SURRENDERED} -> VOIDED"
          - "FREIGHT invoices in DRAFT -> VOID"
          - "ContainerAssignments in {STUFFED, GATED_IN} -> CANCELLED; LCL removal recomputes consolidation used_* (and CLOSED consolidation with zero remaining members -> OPEN)"
      - from: DOCUMENTATION_CLEARED
        to: ROLLED
        trigger: POST /freight/bookings/{bookingId}/roll
        actor: Shipper | BookingCoordinator
        preconditions:
          - "Same as CONFIRMED -> ROLLED"
        side_effects:
          - "Same cascade as CONFIRMED -> ROLLED"
      - from: ROLLED
        to: CONFIRMED
        trigger: POST /freight/bookings/{bookingId}/rebook
        actor: BookingCoordinator
        preconditions:
          - "Booking must be ROLLED (ERR_BOOKING_INVALID_STATE)"
          - "new_voyage must exist, be BOOKING_OPEN, and share origin_port and destination_port with the booking's current voyage (ERR_VOYAGE_LANE_MISMATCH)"
          - "Booking's tariff window must cover new_voyage.etd and tariff must be PUBLISHED (ERR_TARIFF_NOT_EFFECTIVE)"
          - "Credit gate re-run with recomputed estimate (ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects:
          - "voyage_id := new_voyage_id"
          - "estimated_freight_cents recomputed per rollover_rebook_charge variant: BLANK_SAILING/MISSED_DEPARTURE -> carrier-caused: min(old estimate, fresh quote), fee 0; SHIPPER_REQUEST -> fresh quote, pending_rollover_fee_cents += ROLLOVER_FEE_CENTS 150000"
      - from: LOADED
        to: DEPARTED
        trigger: "system (voyage depart cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DEPARTED
        to: ARRIVED
        trigger: "system (voyage arrive cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ARRIVED
        to: DELIVERED
        trigger: POST /freight/bookings/{bookingId}/deliver
        actor: BookingCoordinator
        preconditions:
          - "Booking must be ARRIVED (ERR_BOOKING_INVALID_STATE)"
          - "Booking has a BillOfLading with status RELEASED (ERR_BL_NOT_RELEASED)"
          - "If terms == COLLECT: every FREIGHT invoice of the booking has status PAID (ERR_OUTSTANDING_BALANCE)"
        side_effects:
          - "CargoInsurancePolicy BOUND -> EXPIRED"

  - entity: Consolidation
    initial_state: OPEN
    terminal_states: [ARRIVED, CANCELLED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: POST /freight/consolidations/{consolidationId}/close
        actor: BookingCoordinator
        preconditions:
          - "Consolidation must be OPEN (ERR_CONSOLIDATION_INVALID_STATE)"
          - "At least one member ContainerAssignment in {STUFFED, GATED_IN} (ERR_CONSOLIDATION_EMPTY)"
        side_effects: []
      - from: CLOSED
        to: OPEN
        trigger: "system (automatic when the last member assignment in {STUFFED, GATED_IN, LOADED} is removed by unstuff or booking cancel/roll cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CLOSED
        to: TENDERED
        trigger: POST /freight/consolidations/{consolidationId}/tender
        actor: BookingCoordinator
        preconditions:
          - "Consolidation must be CLOSED (ERR_CONSOLIDATION_INVALID_STATE)"
          - "Voyage must be BOOKING_OPEN (ERR_VOYAGE_INVALID_STATE)"
        side_effects:
          - "Member ContainerAssignments STUFFED -> GATED_IN"
          - "Re-evaluate LOADED gate for every member booking (LCL branch)"
      - from: TENDERED
        to: DEPARTED
        trigger: "system (voyage depart cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DEPARTED
        to: ARRIVED
        trigger: "system (voyage arrive cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: CANCELLED
        trigger: "POST /freight/consolidations/{consolidationId}/cancel OR system (voyage blank/depart cascade)"
        actor: BookingCoordinator | system
        preconditions:
          - "Consolidation must be OPEN, CLOSED, or TENDERED (ERR_CONSOLIDATION_INVALID_STATE)"
        side_effects:
          - "Member ContainerAssignments in {STUFFED, GATED_IN} -> CANCELLED; used_weight_kg/used_volume_cbm -> 0"
      - from: CLOSED
        to: CANCELLED
        trigger: "POST /freight/consolidations/{consolidationId}/cancel OR system (voyage blank/depart cascade)"
        actor: BookingCoordinator | system
        preconditions:
          - "Consolidation must be OPEN, CLOSED, or TENDERED (ERR_CONSOLIDATION_INVALID_STATE)"
        side_effects:
          - "Same member cancellation as OPEN -> CANCELLED"

  - entity: ContainerAssignment
    initial_state: STUFFED
    terminal_states: [EMPTY_RETURNED, CANCELLED]
    transitions:
      - from: STUFFED
        to: GATED_IN
        trigger: POST /freight/container-assignments/{assignmentId}/gate-in
        actor: BookingCoordinator
        preconditions:
          - "Assignment must be STUFFED (ERR_ASSIGNMENT_INVALID_STATE)"
          - "Booking must be in {CONFIRMED, DOCUMENTATION_CLEARED} (ERR_BOOKING_INVALID_STATE)"
        side_effects:
          - "gated_in_at = logical clock"
          - "Re-evaluate LOADED gate for the booking (FCL branch)"
      - from: GATED_IN
        to: LOADED
        trigger: "system (booking LOADED bubble-up)"
        actor: system
        preconditions: []
        side_effects: []
      - from: LOADED
        to: DISCHARGED
        trigger: "system (voyage arrive cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "discharged_at = logical clock; demurrage free-time window starts"
      - from: DISCHARGED
        to: GATED_OUT
        trigger: POST /freight/container-assignments/{assignmentId}/gate-out
        actor: BookingCoordinator
        preconditions:
          - "Assignment must be DISCHARGED (ERR_ASSIGNMENT_INVALID_STATE)"
        side_effects:
          - "gated_out_at = logical clock; detention free-time window starts"
          - "FINAL demurrage computed per demurrage_detention_charge (final variant): demurrage_days, demurrage_charge_cents frozen"
      - from: GATED_OUT
        to: EMPTY_RETURNED
        trigger: POST /freight/container-assignments/{assignmentId}/empty-return
        actor: BookingCoordinator
        preconditions:
          - "Assignment must be GATED_OUT (ERR_ASSIGNMENT_INVALID_STATE)"
        side_effects:
          - "empty_returned_at = logical clock"
          - "FINAL detention computed: detention_days, detention_charge_cents frozen"
          - "If demurrage_charge_cents + detention_charge_cents > 0: auto-create DEMURRAGE_DETENTION invoice (DRAFT) for the booking with DEMURRAGE and DETENTION lines (skip zero lines)"
          - "Shipper exposure variants recompute"
      - from: STUFFED
        to: CANCELLED
        trigger: "system (booking cancel/roll, consolidation cancel, voyage blank/depart cascades)"
        actor: system
        preconditions: []
        side_effects:
          - "LCL: Consolidation.used_weight_kg / used_volume_cbm recompute; CLOSED consolidation with zero remaining members -> OPEN"
      - from: GATED_IN
        to: CANCELLED
        trigger: "system (booking cancel/roll, consolidation cancel, voyage blank/depart cascades)"
        actor: system
        preconditions: []
        side_effects:
          - "Same consolidation recompute as STUFFED -> CANCELLED"

  - entity: BillOfLading
    initial_state: DRAFT
    terminal_states: [RELEASED, VOIDED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: POST /freight/bill-of-lading/{blId}/issue
        actor: DocumentationOfficer
        preconditions:
          - "B/L must be DRAFT (ERR_BL_INVALID_STATE)"
          - "Booking must be in {CONFIRMED, DOCUMENTATION_CLEARED, LOADED, DEPARTED} (ERR_BOOKING_INVALID_STATE)"
          - "Bond gate: EXISTS SuretyBond with status == ACTIVE, effective_from <= logical clock < effective_to, and available_coverage_cents >= MIN_BOND_AVAILABLE_CENTS 75000 (ERR_BOND_COVERAGE_INSUFFICIENT)"
        side_effects:
          - "issued_by_user_id = X-User-ID"
          - "Re-evaluate booking DOCUMENTATION_CLEARED gate (filings + issued B/L compound)"
      - from: ISSUED
        to: AMENDMENT_PENDING
        trigger: POST /freight/bill-of-lading/{blId}/request-amendment
        actor: DocumentationOfficer
        preconditions:
          - "B/L must be ISSUED (ERR_BL_INVALID_STATE)"
          - "amendment_count < MAX_AMENDMENTS (3) (ERR_AMENDMENT_LIMIT_EXCEEDED)"
        side_effects:
          - "amendment_count += 1"
      - from: AMENDMENT_PENDING
        to: DRAFT
        trigger: POST /freight/bill-of-lading/{blId}/reissue
        actor: DocumentationOfficer
        preconditions:
          - "B/L must be AMENDMENT_PENDING (ERR_BL_INVALID_STATE)"
        side_effects:
          - "Booking in DOCUMENTATION_CLEARED reverts to CONFIRMED (docs no longer satisfied while B/L not ISSUED)"
      - from: ISSUED
        to: SURRENDERED
        trigger: POST /freight/bill-of-lading/{blId}/surrender
        actor: Shipper
        preconditions:
          - "B/L must be ISSUED (ERR_BL_INVALID_STATE)"
          - "release_mode must be ORIGINAL or TELEX (ERR_BL_INVALID_STATE)"
          - "Acting Shipper's X-User-ID must equal booking.shipper_id (ERR_INSUFFICIENT_PERMISSIONS)"
        side_effects: []
      - from: ISSUED
        to: RELEASED
        trigger: POST /freight/bill-of-lading/{blId}/release
        actor: DocumentationOfficer
        preconditions:
          - "release_mode must be SEAWAY for the ISSUED -> RELEASED direct path (ERR_BL_INVALID_STATE)"
          - "released_by_user_id (X-User-ID) != issued_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "Booking's ISF and AMS ComplianceFilings are both ACCEPTED (ERR_FILINGS_NOT_CLEARED)"
          - "If booking.terms == PREPAID: every FREIGHT invoice of the booking has status PAID (ERR_OUTSTANDING_BALANCE)"
        side_effects:
          - "released_by_user_id = X-User-ID"
      - from: SURRENDERED
        to: RELEASED
        trigger: POST /freight/bill-of-lading/{blId}/release
        actor: DocumentationOfficer
        preconditions:
          - "released_by_user_id (X-User-ID) != issued_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "Booking's ISF and AMS ComplianceFilings are both ACCEPTED (ERR_FILINGS_NOT_CLEARED)"
          - "If booking.terms == PREPAID: every FREIGHT invoice of the booking has status PAID (ERR_OUTSTANDING_BALANCE)"
        side_effects:
          - "released_by_user_id = X-User-ID"
      - from: DRAFT
        to: VOIDED
        trigger: "POST /freight/bill-of-lading/{blId}/void OR system (booking cancel/roll, voyage blank/depart cascades)"
        actor: DocumentationOfficer | system
        preconditions:
          - "B/L must be DRAFT or AMENDMENT_PENDING for the manual endpoint (ERR_BL_INVALID_STATE)"
        side_effects: []
      - from: AMENDMENT_PENDING
        to: VOIDED
        trigger: "POST /freight/bill-of-lading/{blId}/void OR system cascade"
        actor: DocumentationOfficer | system
        preconditions:
          - "B/L must be DRAFT or AMENDMENT_PENDING for the manual endpoint (ERR_BL_INVALID_STATE)"
        side_effects: []
      - from: ISSUED
        to: VOIDED
        trigger: "system cascade only (booking cancel/roll, voyage blank/depart); manual void of an ISSUED B/L is forbidden"
        actor: system
        preconditions: []
        side_effects: []
      - from: SURRENDERED
        to: VOIDED
        trigger: "system cascade only (booking cancel/roll, voyage blank/depart)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ComplianceFiling
    initial_state: PENDING
    terminal_states: [ACCEPTED]
    transitions:
      - from: PENDING
        to: SUBMITTED
        trigger: POST /freight/compliance-filings/{filingId}/submit
        actor: ComplianceOfficer
        preconditions:
          - "Filing must be PENDING or REJECTED (ERR_FILING_INVALID_STATE)"
          - "Booking must be in {CONFIRMED, DOCUMENTATION_CLEARED, LOADED, DEPARTED} (ERR_BOOKING_INVALID_STATE)"
          - "Voyage must not be BLANKED (ERR_VOYAGE_INVALID_STATE)"
        side_effects:
          - "submitted_at = logical clock; is_late recomputed"
          - "If is_late and penalty_status == NONE: penalty_status -> ACCRUED, penalty_amount_cents set per isf_ams_penalty; SuretyBond.available_coverage_cents recomputed (debits the bond selected as: status ACTIVE, window covers clock, earliest created_at; if no bond qualifies, the accrual is recorded on the filing only and debits nothing)"
      - from: REJECTED
        to: SUBMITTED
        trigger: POST /freight/compliance-filings/{filingId}/submit
        actor: ComplianceOfficer
        preconditions:
          - "Same as PENDING -> SUBMITTED"
        side_effects:
          - "Same as PENDING -> SUBMITTED (lateness and penalty re-evaluated on resubmission)"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: POST /freight/compliance-filings/{filingId}/record-response with outcome = ACCEPTED
        actor: ComplianceOfficer
        preconditions:
          - "Filing must be SUBMITTED (ERR_FILING_INVALID_STATE)"
        side_effects:
          - "Re-evaluate booking DOCUMENTATION_CLEARED gate (both filing types ACCEPTED + B/L ISSUED)"
      - from: SUBMITTED
        to: REJECTED
        trigger: POST /freight/compliance-filings/{filingId}/record-response with outcome = REJECTED
        actor: ComplianceOfficer
        preconditions:
          - "Filing must be SUBMITTED (ERR_FILING_INVALID_STATE)"
        side_effects: []

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [PAID, VOID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: POST /freight/invoices/{invoiceId}/issue
        actor: FinanceController
        preconditions:
          - "Invoice must be DRAFT (ERR_INVOICE_INVALID_STATE)"
          - "total_cents > 0 (ERR_INVOICE_EMPTY)"
        side_effects:
          - "issued_at = logical clock; due_date computed from shipper.credit_terms"
          - "Shipper.credit_exposure_posted_cents and credit_exposure_forward_cents recompute"
          - "If posted exposure > credit_limit_cents: Shipper ACTIVE -> SUSPENDED (auto)"
      - from: ISSUED
        to: PARTIALLY_PAID
        trigger: POST /freight/invoices/{invoiceId}/payments with amount_cents < balance_cents
        actor: FinanceController
        preconditions:
          - "Invoice must be ISSUED or PARTIALLY_PAID (ERR_INVOICE_INVALID_STATE)"
          - "0 < amount_cents <= balance_cents (ERR_OVERPAYMENT)"
        side_effects:
          - "paid_cents += amount_cents; Shipper exposure variants recompute"
      - from: PARTIALLY_PAID
        to: PARTIALLY_PAID
        trigger: POST /freight/invoices/{invoiceId}/payments with amount_cents < balance_cents
        actor: FinanceController
        preconditions:
          - "Invoice must be ISSUED or PARTIALLY_PAID (ERR_INVOICE_INVALID_STATE)"
          - "0 < amount_cents <= balance_cents (ERR_OVERPAYMENT)"
        side_effects:
          - "paid_cents += amount_cents; Shipper exposure variants recompute"
      - from: ISSUED
        to: PAID
        trigger: POST /freight/invoices/{invoiceId}/payments with amount_cents == balance_cents
        actor: FinanceController
        preconditions:
          - "Invoice must be ISSUED or PARTIALLY_PAID (ERR_INVOICE_INVALID_STATE)"
          - "0 < amount_cents <= balance_cents (ERR_OVERPAYMENT)"
        side_effects:
          - "paid_cents = total_cents; Shipper exposure variants recompute"
      - from: PARTIALLY_PAID
        to: PAID
        trigger: POST /freight/invoices/{invoiceId}/payments with amount_cents == balance_cents
        actor: FinanceController
        preconditions:
          - "Invoice must be ISSUED or PARTIALLY_PAID (ERR_INVOICE_INVALID_STATE)"
          - "0 < amount_cents <= balance_cents (ERR_OVERPAYMENT)"
        side_effects:
          - "paid_cents = total_cents; Shipper exposure variants recompute"
      - from: DRAFT
        to: VOID
        trigger: "POST /freight/invoices/{invoiceId}/void OR system (booking cancel/roll, voyage blank/depart cascades)"
        actor: FinanceController | system
        preconditions:
          - "Manual: invoice must be DRAFT, or ISSUED with paid_cents == 0 (ERR_INVOICE_INVALID_STATE)"
        side_effects:
          - "Shipper exposure variants recompute (invoice drops out of posted set)"
      - from: ISSUED
        to: VOID
        trigger: POST /freight/invoices/{invoiceId}/void
        actor: FinanceController
        preconditions:
          - "Invoice must be ISSUED and paid_cents == 0 (ERR_INVOICE_INVALID_STATE)"
        side_effects:
          - "Shipper exposure variants recompute"

  - entity: CargoInsurancePolicy
    initial_state: QUOTED
    terminal_states: [CANCELLED, EXPIRED]
    transitions:
      - from: QUOTED
        to: BOUND
        trigger: POST /freight/insurance-policies/{policyId}/bind
        actor: BookingCoordinator
        preconditions:
          - "Policy must be QUOTED (ERR_POLICY_INVALID_STATE)"
          - "Booking must be in {CONFIRMED, DOCUMENTATION_CLEARED, LOADED} (ERR_BOOKING_INVALID_STATE)"
        side_effects:
          - "Premium becomes billable: next FREIGHT invoice of the booking includes INSURANCE_PREMIUM line"
      - from: QUOTED
        to: CANCELLED
        trigger: "POST /freight/insurance-policies/{policyId}/cancel OR system (booking cancel cascade)"
        actor: BookingCoordinator | system
        preconditions:
          - "Manual: policy must be QUOTED or BOUND (ERR_POLICY_INVALID_STATE)"
          - "Manual: no claim on this policy in {FILED, UNDER_REVIEW, APPROVED} (ERR_CLAIMS_OPEN)"
        side_effects: []
      - from: BOUND
        to: CANCELLED
        trigger: "POST /freight/insurance-policies/{policyId}/cancel OR system (booking cancel cascade; system cascade bypasses the open-claims precondition because claims are cascade-DENIED first)"
        actor: BookingCoordinator | system
        preconditions:
          - "Manual: policy must be QUOTED or BOUND (ERR_POLICY_INVALID_STATE)"
          - "Manual: no claim on this policy in {FILED, UNDER_REVIEW, APPROVED} (ERR_CLAIMS_OPEN)"
        side_effects: []
      - from: BOUND
        to: EXPIRED
        trigger: "system (booking DELIVERED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: CargoClaim
    initial_state: FILED
    terminal_states: [DENIED, SETTLED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: POST /freight/claims/{claimId}/start-review
        actor: ClaimsAdjuster
        preconditions:
          - "Claim must be FILED (ERR_CLAIM_INVALID_STATE)"
          - "Policy must be BOUND (ERR_POLICY_INVALID_STATE)"
        side_effects:
          - "reviewed_by_user_id = X-User-ID"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: POST /freight/claims/{claimId}/approve
        actor: ClaimsAdjuster
        preconditions:
          - "Claim must be UNDER_REVIEW (ERR_CLAIM_INVALID_STATE)"
          - "approved_by_user_id (X-User-ID) != reviewed_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "settlement_amount_cents computed per claim_settlement variant rules and frozen"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: POST /freight/claims/{claimId}/deny
        actor: ClaimsAdjuster
        preconditions:
          - "Claim must be UNDER_REVIEW (ERR_CLAIM_INVALID_STATE)"
          - "approved_by_user_id (X-User-ID) != reviewed_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "settlement_amount_cents = 0"
      - from: APPROVED
        to: SETTLED
        trigger: POST /freight/claims/{claimId}/settle
        actor: FinanceController
        preconditions:
          - "Claim must be APPROVED (ERR_CLAIM_INVALID_STATE)"
        side_effects:
          - "settled_at = logical clock"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only; sequential-testable)
# =============================================================================
concurrency_rules:
  - rule_id: booking-amend-stale-version
    parent_entity: Booking
    write_endpoint: "PATCH /freight/bookings/{bookingId}"
    occ_field: "expected_booking_version"
    description: |
      Amending a Booking whose version has advanced since the client last
      observed it is rejected with 412. This captures the case where another
      coordinator has just amended the same booking (weight/volume changes are
      legitimate at any time while QUOTED or CONFIRMED) and the current
      writer's view of the booking is therefore stale.
    error_id: ERR_STALE_BOOKING_VERSION
    http_status: 412

  - rule_id: consolidation-stuff-stale-version
    parent_entity: Consolidation
    write_endpoint: "POST /freight/consolidations/{consolidationId}/stuff"
    occ_field: "expected_consolidation_version"
    description: |
      Stuffing an LCL booking into a Consolidation whose version has advanced
      since the client last observed it is rejected with 412. A prior stuffing
      or unstuffing legitimately changed used_weight_kg/used_volume_cbm and the
      consolidation version, so the current writer's capacity view is stale.
    error_id: ERR_STALE_CONSOLIDATION_VERSION
    http_status: 412

  - rule_id: invoice-adjustment-stale-version
    parent_entity: Invoice
    write_endpoint: "POST /freight/invoices/{invoiceId}/adjustments"
    occ_field: "expected_invoice_version"
    description: |
      Adding a manual adjustment line to a DRAFT Invoice whose version has
      advanced since the client last observed it is rejected with 412. A prior
      adjustment legitimately changed the line set and total, so the current
      writer's invoice view is stale.
    error_id: ERR_STALE_INVOICE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: chargeable_weight_revenue_tons
    trigger: "booking creation and every amend of gross_weight_kg / volume_cbm"
    algorithm: aggregation
    formula: |
      chargeable_weight_rt = round_half_up(max(gross_weight_kg / 1000, volume_cbm), 3)
      W/M rule: 1 revenue ton = 1000 kg OR 1 cbm, whichever yields more.
    input_set: "the booking's own gross_weight_kg and volume_cbm"
    precision: "3 decimal places, round_half_up"

  - name: ocean_freight_charge
    trigger: "booking creation, amend, confirm, and rebook (sell-side estimate frozen at confirm; re-frozen at rebook per rollover variant)"
    algorithm: tiered_pricing
    formula: |
      unit = (rate_source == CONTRACT) ? tariff.rate_per_unit_cents
                                       : booking.spot_rate_per_unit_cents
      IF mode == FCL:
        base_cents = container_count * unit
        thc_cents  = container_count * THC_FCL_PER_CONTAINER_CENTS
      ELSE (LCL):
        base_cents = max(chargeable_weight_rt * unit, tariff.minimum_charge_cents)
                     -- round base to integer cents round_half_up AFTER the max()
        thc_cents  = round_half_up(chargeable_weight_rt * THC_LCL_PER_RT_CENTS)
      baf_cents = round_half_up(base_cents * BAF_PCT)
      doc_cents = DOC_FEE_CENTS
      estimated_freight_cents = base_cents + baf_cents + thc_cents + doc_cents
      >= 3 inputs with non-linear interaction: max() W/M rule, minimum-charge
      floor (LCL only), mode branch, dual rate source.
    input_set: "booking fields + pinned Tariff (must be PUBLISHED, window covers voyage.etd)"
    constants:
      BAF_PCT: 0.10
      THC_FCL_PER_CONTAINER_CENTS: 25000
      THC_LCL_PER_RT_CENTS: 1200
      DOC_FEE_CENTS: 7500
    precision: "integer cents; BAF and LCL base rounded round_half_up"
    variants:
      - name: contract_rate
        when: "rate_source == CONTRACT"
        difference: "unit rate read from the published Tariff"
      - name: spot_rate
        when: "rate_source == SPOT"
        difference: "unit rate read from booking.spot_rate_per_unit_cents; identical cargo prices differently from contract_rate"

  - name: demurrage_detention_charge
    trigger: "gate-out (freeze FINAL demurrage), empty-return (freeze FINAL detention), and every read while DISCHARGED/GATED_OUT (PROVISIONAL refresh)"
    algorithm: chronological
    formula: |
      full_days(t0, t1) = floor((t1 - t0) / 24h)   -- whole 24h periods only
      demurrage_days    = max(0, full_days(discharged_at, gated_out_at) - contract.demurrage_free_days)
      detention_days    = max(0, full_days(gated_out_at, empty_returned_at) - contract.detention_free_days)
      demurrage_charge: marginal tier walk over contract.demurrage_tiers
        remaining = demurrage_days; charge = 0
        for tier in tiers ordered by from_day ASC:
          span = (tier.to_day == null) ? remaining : min(remaining, tier.to_day - tier.from_day + 1)
          charge += span * tier.per_diem_cents; remaining -= span; stop when remaining == 0
      detention_charge  = detention_days * contract.detention_per_diem_cents
      Boundary: a stay of exactly free_days (full_days == free_days) yields 0
      chargeable days — the comparison is chargeable = full_days - free_days
      with NO +1; gate-out/return at the same clock instant as discharge yields 0.
    input_set: "the assignment's 4 timestamps + the voyage's carrier contract free days and tiers"
    precision: "integer cents; no fractional days"
    variants:
      - name: provisional
        when: "assignment DISCHARGED or GATED_OUT and not yet EMPTY_RETURNED"
        difference: "open intervals close at the CURRENT LOGICAL CLOCK (gated_out_at treated as now while DISCHARGED; empty_returned_at treated as now while GATED_OUT); produces provisional_demurrage_cents / provisional_detention_cents which differ from the final frozen values whenever the real event happens later"
      - name: final
        when: "gate-out (demurrage) and empty-return (detention)"
        difference: "uses actual event timestamps; freezes demurrage_charge_cents / detention_charge_cents"

  - name: isf_ams_penalty
    trigger: "filing submission (PENDING|REJECTED -> SUBMITTED)"
    algorithm: threshold
    formula: |
      is_late = (submitted_at > deadline_at)   -- strictly greater; == is ON TIME
      IF is_late AND penalty_status == NONE:
        penalty_amount_cents = (filing_type == ISF) ? ISF_LATE_PENALTY_CENTS : AMS_LATE_PENALTY_CENTS
        penalty_status = ACCRUED  -- debits SuretyBond.available_coverage_cents
      ELSE: penalty_amount_cents = 0
      Resubmission of a REJECTED filing re-evaluates lateness against the
      frozen deadline_at; a filing already ACCRUED stays ACCRUED (no double
      accrual); a filing whose resubmission is on time keeps penalty_status
      unchanged (penalties are not retroactively waived).
    input_set: "the filing's submitted_at and deadline_at"
    constants:
      ISF_LATE_PENALTY_CENTS: 500000
      AMS_LATE_PENALTY_CENTS: 300000
      MIN_BOND_AVAILABLE_CENTS: 75000
    precision: "integer cents"

  - name: invoice_total
    trigger: "invoice creation, manual adjustment append, auto D&D invoice creation"
    algorithm: aggregation
    formula: |
      PINNED ROUNDING ORDER (nested-rounding rule):
        1. per line: amount_cents = round_half_up(quantity * unit_rate_cents)
        2. total_cents = SUM(amount_cents over all lines)
      The reverse order (sum raw products, round once) is WRONG and yields
      different cents whenever a line product has a fractional cent.
      balance_cents = total_cents - paid_cents.
    input_set: "the invoice's own lines array"
    precision: "integer cents, round_half_up per line"

  - name: insured_value_premium
    trigger: "policy creation (quote); insured/premium frozen at QUOTED creation"
    algorithm: constraint_propagation
    formula: |
      CIRCULAR-LOOKING CHAIN — evaluation order is PINNED:
        1. chargeable_weight_rt  (from booking weight/volume)
        2. freight_base_cents    (ocean_freight_charge base component only,
                                  EXCLUDING BAF/THC/DOC and any rollover fee)
        3. insured_value_cents = round_half_up((cargo_value_cents + freight_base_cents) * 1.10)
        4. premium_cents = max(MIN_PREMIUM_CENTS,
                               round_half_up(insured_value_cents * RATE[coverage_type]))
      The premium is then eligible to appear as an INSURANCE_PREMIUM line on
      the booking's FREIGHT invoice, which feeds Shipper.credit_exposure — but
      the exposure gate never feeds back into THIS policy's premium (order
      fixed at 1->2->3->4, no fixpoint iteration).
    input_set: "booking freight base, policy cargo_value_cents, coverage_type"
    constants:
      MIN_PREMIUM_CENTS: 2500
      RATE_ALL_RISK: 0.006
      RATE_WA: 0.004
      RATE_FPA: 0.0025
      INSURED_MARKUP: 1.10
    precision: "integer cents, round_half_up at each step"

  - name: credit_exposure
    trigger: "booking confirm/cancel/rebook, invoice issue/payment/void, D&D invoice auto-creation"
    algorithm: forward_looking
    formula: |
      posted  = SUM(balance_cents) over the shipper's invoices with
                status IN {ISSUED, PARTIALLY_PAID}
      forward = posted + SUM(estimated_freight_cents) over the shipper's
                bookings with status IN {CONFIRMED, DOCUMENTATION_CLEARED,
                LOADED, DEPARTED, ARRIVED} that have NO FREIGHT invoice with
                status IN {DRAFT, ISSUED, PARTIALLY_PAID, PAID}
      Confirm gate uses FORWARD: forward_excluding_this_booking +
      this_booking.estimated_freight_cents <= credit_limit_cents (equality OK).
      Auto-suspend uses POSTED: on invoice issue, posted > credit_limit_cents
      transitions Shipper ACTIVE -> SUSPENDED.
    input_set: "shipper's invoices (status-filtered) and bookings (status-filtered)"
    precision: "integer cents"
    variants:
      - name: posted
        when: "auto-suspension check, reinstate check"
        difference: "counts issued invoice balances only; ignores unbilled bookings"
      - name: forward
        when: "booking confirm and rebook credit gates"
        difference: "adds unbilled estimated freight of in-flight bookings; strictly >= posted, and strictly greater whenever an unbilled in-flight booking exists"

  - name: claim_settlement
    trigger: "claim approve"
    algorithm: waterfall_allocation
    formula: |
      deductible_cents =
        ALL_RISK / WA: max(50000, round_half_up(insured_value_cents * 0.01))
        FPA:           max(100000, round_half_up(insured_value_cents * 0.02))
      settlement waterfall:
        1. IF claim_type == DELAY: settlement = 0 (consequential loss excluded on all coverages)
        2. ELSE IF coverage_type == FPA AND claim_type IN {DAMAGE, SHORTAGE}: settlement = 0
           (FPA covers total loss only)
        3. ELSE: settlement = max(0, min(claimed_amount_cents, insured_value_cents) - deductible_cents)
    input_set: "claim fields + policy insured_value_cents and coverage_type"
    precision: "integer cents"
    variants:
      - name: all_risk_or_wa
        when: "coverage_type IN {ALL_RISK, WA}"
        difference: "partial losses settle at min(claimed, insured) - deductible"
      - name: fpa
        when: "coverage_type == FPA"
        difference: "DAMAGE/SHORTAGE (partial losses) settle at 0 regardless of claimed amount; only LOSS (total) pays; deductible floor is higher (100000 vs 50000)"

  - name: rollover_rebook_charge
    trigger: "rebook (ROLLED -> CONFIRMED)"
    algorithm: threshold
    formula: |
      fresh_quote = ocean_freight_charge evaluated against the booking's
                    pinned tariff and the NEW voyage (window must cover new etd)
      IF rolled_reason == SHIPPER_REQUEST:
        estimated_freight_cents = fresh_quote
        pending_rollover_fee_cents += ROLLOVER_FEE_CENTS   -- billed on FREIGHT invoice
      ELSE (BLANK_SAILING or MISSED_DEPARTURE — carrier-caused):
        estimated_freight_cents = min(old estimated_freight_cents, fresh_quote)
        no fee
    input_set: "booking + new voyage + pinned tariff"
    constants:
      ROLLOVER_FEE_CENTS: 150000
      CANCELLATION_FEE_CENTS: 75000
      MAX_ROLLOVERS: 2
      MAX_AMENDMENTS: 3
    precision: "integer cents"

  - name: consolidation_utilization
    trigger: "stuff, unstuff, and any cascade that cancels a member assignment"
    algorithm: aggregation
    formula: |
      used_weight_kg  = SUM(stuffed_weight_kg)  over member assignments with
                        status IN {STUFFED, GATED_IN, LOADED}
      used_volume_cbm = SUM(stuffed_volume_cbm) over the same set
      Stuffing gate: used_weight_kg + booking.gross_weight_kg  <= max_weight_kg
                 AND used_volume_cbm + booking.volume_cbm     <= max_volume_cbm
      Boundary: equality is ALLOWED (a consolidation stuffed to exactly
      max_weight_kg and max_volume_cbm is legal; one more kg or cbm rejects).
    input_set: "member ContainerAssignments (status-filtered) + the candidate booking"
    precision: "3 decimal places on volumes; weights at 3 decimals"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; lower number wins when
# several checks fail on one request)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and the role must be a declared role name"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Acting role must be listed in the endpoint's roles; entity_backed Shipper may only act on resources whose shipper_id equals X-User-ID"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Resource ids in path must exist (left-to-right); body FK references (voyage_id, tariff_id, booking_id, policy_id, consolidation_id, new_voyage_id) must exist"
    error_id: "ERR_{RESOURCE}_NOT_FOUND (ERR_SHIPPER_NOT_FOUND, ERR_TARIFF_NOT_FOUND, ERR_CONTRACT_NOT_FOUND, ERR_BOND_NOT_FOUND, ERR_VOYAGE_NOT_FOUND, ERR_BOOKING_NOT_FOUND, ERR_CONSOLIDATION_NOT_FOUND, ERR_ASSIGNMENT_NOT_FOUND, ERR_BL_NOT_FOUND, ERR_FILING_NOT_FOUND, ERR_INVOICE_NOT_FOUND, ERR_POLICY_NOT_FOUND, ERR_CLAIM_NOT_FOUND)"
    http_status: 404
    applies_to: "all endpoints with resource ids or FK payloads"

  - priority: 4
    category: auth
    check: "Segregation of duties: tariff publisher != draft creator; B/L releaser != issuer; claim approver/denier != reviewer"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /freight/tariffs/{id}/publish, POST /freight/bill-of-lading/{id}/release, POST /freight/claims/{id}/approve, POST /freight/claims/{id}/deny"

  - priority: 5
    category: business_constraint
    check: "Request body shape: required fields present, enum members valid, numeric > 0 where required, conditional fields honored (SPOT requires spot_rate_per_unit_cents; FCL requires container_type + container_count; LCL forbids both; container_type required iff tariff mode FCL)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST/PATCH endpoints"

  - priority: 6
    category: state
    check: "Target resource state permits the operation (per §1.2 preconditions); includes voyage BOOKING_OPEN for booking/consolidation creation, shipper not SUSPENDED for booking creation/confirm, contract ACTIVE for voyage creation"
    error_id: "ERR_VOYAGE_NOT_OPEN | ERR_SHIPPER_SUSPENDED | ERR_CONTRACT_NOT_ACTIVE | ERR_BOOKING_INVALID_STATE | ERR_BL_INVALID_STATE | ERR_INVOICE_INVALID_STATE | ERR_FILING_INVALID_STATE | ERR_CLAIM_INVALID_STATE | ERR_POLICY_INVALID_STATE | ERR_CONSOLIDATION_INVALID_STATE | ERR_CONTRACT_INVALID_STATE | ERR_TARIFF_INVALID_STATE | ERR_BOND_INVALID_STATE | ERR_ASSIGNMENT_INVALID_STATE | ERR_VOYAGE_INVALID_STATE | ERR_SHIPPER_INVALID_STATE"
    http_status: 409
    applies_to: "state-transition endpoints"

  - priority: 7
    category: business_safety
    check: "Regulatory gates: B/L release requires both ISF and AMS filings ACCEPTED; B/L issue requires a qualifying ACTIVE bond with available_coverage_cents >= 75000"
    error_id: "ERR_FILINGS_NOT_CLEARED | ERR_BOND_COVERAGE_INSUFFICIENT"
    http_status: 409
    applies_to: "POST /freight/bill-of-lading/{id}/release, POST /freight/bill-of-lading/{id}/issue"

  - priority: 8
    category: business_safety
    check: "Commodity compatibility inside a consolidation: a booking with commodity_type HAZMAT may not be stuffed into a consolidation that already holds a member booking with commodity_type REEFER, and vice versa (GENERAL mixes with either)"
    error_id: ERR_INCOMPATIBLE_CARGO_MIX
    http_status: 422
    applies_to: "POST /freight/consolidations/{id}/stuff"

  - priority: 9
    category: business_referential
    check: "Booking references must be consistent: tariff PUBLISHED with window covering voyage.etd; tariff origin/destination match voyage ports; tariff commodity_type and mode match booking; FCL container_type matches tariff.container_type"
    error_id: "ERR_TARIFF_NOT_EFFECTIVE | ERR_TARIFF_MISMATCH"
    http_status: 422
    applies_to: "POST /freight/bookings, POST /freight/bookings/{id}/rebook"

  - priority: 10
    category: business_referential
    check: "Uniqueness: at most one filing per (booking_id, filing_type); at most one FREIGHT invoice per booking; at most one B/L per booking in {DRAFT, ISSUED, AMENDMENT_PENDING, SURRENDERED}; a booking already holding an LCL assignment in {STUFFED, GATED_IN, LOADED} may not be stuffed again"
    error_id: "ERR_FILING_EXISTS | ERR_INVOICE_EXISTS | ERR_ACTIVE_BL_EXISTS | ERR_BOOKING_ALREADY_STUFFED"
    http_status: 409
    applies_to: "POST /freight/compliance-filings, POST /freight/invoices, POST /freight/bill-of-lading, POST /freight/consolidations/{id}/stuff"

  - priority: 11
    category: business_temporal
    check: "Interval rules: tariff publish half-open overlap (adjacency allowed); contract activate/resume closed-window overlap (adjacency IS conflict); consolidation stuffing windows at the same cfs_location must not overlap (half-open, adjacency allowed); voyage etd inside contract closed window; depart requires clock >= etd; arrive requires clock >= eta; rebook target voyage same lane"
    error_id: "ERR_TARIFF_WINDOW_OVERLAP | ERR_CONTRACT_WINDOW_OVERLAP | ERR_STUFFING_WINDOW_OVERLAP | ERR_VOYAGE_OUTSIDE_CONTRACT_WINDOW | ERR_VOYAGE_NOT_DEPARTABLE | ERR_VOYAGE_NOT_ARRIVABLE | ERR_VOYAGE_LANE_MISMATCH"
    http_status: 409
    applies_to: "tariff publish, contract activate/resume, consolidation create, voyage create/depart/arrive, booking rebook"

  - priority: 12
    category: business_constraint
    check: "Capacity and count caps: consolidation weight/volume gate (<= capacity, equality allowed); rollover_count cap 2; amendment_count cap 3; consolidation must be non-empty to close"
    error_id: "ERR_CONSOLIDATION_CAPACITY_EXCEEDED | ERR_ROLLOVER_LIMIT_EXCEEDED | ERR_AMENDMENT_LIMIT_EXCEEDED | ERR_CONSOLIDATION_EMPTY"
    http_status: 422
    applies_to: "stuff, roll, request-amendment, close"

  - priority: 13
    category: business_fiscal
    check: "Fiscal gates (last): confirm/rebook credit gate (forward exposure <= credit_limit); cancel and COLLECT-deliver and PREPAID-release require no unpaid issued balances; payments may not exceed balance_cents"
    error_id: "ERR_CREDIT_LIMIT_EXCEEDED | ERR_OUTSTANDING_BALANCE | ERR_OVERPAYMENT"
    http_status: 402
    applies_to: "booking confirm/rebook/cancel, B/L release, booking deliver, invoice payments"

  - priority: 14
    category: business_constraint
    check: "OCC: expected_<parent>_version must equal the parent entity's current version on the three OCC-guarded writes"
    error_id: "ERR_STALE_BOOKING_VERSION | ERR_STALE_CONSOLIDATION_VERSION | ERR_STALE_INVOICE_VERSION"
    http_status: 412
    applies_to: "PATCH /freight/bookings/{id}, POST /freight/consolidations/{id}/stuff, POST /freight/invoices/{id}/adjustments"

# =============================================================================
# §1.5 API Endpoint Table (flat topology; all collections under /freight)
# =============================================================================
endpoints:
  # --- Test-driving clock (logical clock; startup default 2026-08-01T00:00:00Z) ---
  - method: POST
    path: "/freight/_clock/set_current_utc"
    description: "Advance the logical clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time. Monotonic: to_iso8601 must be >= current logical time."
    roles: [OperationsManager]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects:
      - "Lazy expiry evaluation: SuretyBond ACTIVE -> EXPIRED and CarrierContract ACTIVE -> EXPIRED when the new clock passes their window ends"

  # --- Shipper ---
  - method: POST
    path: "/freight/shippers"
    description: "Register a shipper with credit terms"
    roles: [OperationsManager]
    code: 201
    input: [legal_name, credit_limit_cents, "credit_terms?"]
    output: Shipper
    side_effects: ["status = ACTIVE; exposures initialized to 0"]

  - method: GET
    path: "/freight/shippers"
    description: "List shippers"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "Shipper[]"
    side_effects: []

  - method: GET
    path: "/freight/shippers/{shipperId}"
    description: "Get a shipper (exposures recomputed on read)"
    roles: [Any]
    code: 200
    input: []
    output: Shipper
    side_effects: []

  - method: PATCH
    path: "/freight/shippers/{shipperId}/credit-terms"
    description: "Adjust credit limit and/or terms"
    roles: [FinanceController]
    code: 200
    input: ["credit_limit_cents?", "credit_terms?"]
    output: Shipper
    side_effects: ["exposure variants recompute; if posted exposure now within limit and shipper SUSPENDED, shipper stays SUSPENDED until explicit reinstate"]

  - method: POST
    path: "/freight/shippers/{shipperId}/suspend"
    description: "Manually suspend a shipper"
    roles: [FinanceController]
    code: 200
    input: []
    output: Shipper
    side_effects: ["status ACTIVE -> SUSPENDED"]

  - method: POST
    path: "/freight/shippers/{shipperId}/reinstate"
    description: "Reinstate a suspended shipper"
    roles: [FinanceController]
    code: 200
    input: []
    output: Shipper
    side_effects: ["status SUSPENDED -> ACTIVE (requires posted exposure <= limit)"]

  # --- Tariff ---
  - method: POST
    path: "/freight/tariffs"
    description: "Create a DRAFT tariff record"
    roles: [ComplianceOfficer]
    code: 201
    input: [tariff_code, origin_port, destination_port, commodity_type, mode, "container_type?", rate_per_unit_cents, "minimum_charge_cents?", effective_from, effective_to]
    output: Tariff
    side_effects: ["status = DRAFT; created_by_user_id = X-User-ID"]

  - method: GET
    path: "/freight/tariffs"
    description: "List tariffs"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "status?", "origin_port?", "destination_port?"]
    output: "Tariff[]"
    side_effects: []

  - method: GET
    path: "/freight/tariffs/{tariffId}"
    description: "Get a tariff"
    roles: [Any]
    code: 200
    input: []
    output: Tariff
    side_effects: []

  - method: POST
    path: "/freight/tariffs/{tariffId}/publish"
    description: "Publish a tariff (SoD: publisher != creator); validates half-open window overlap"
    roles: [ComplianceOfficer]
    code: 200
    input: ["supersedes_tariff_id?"]
    output: Tariff
    side_effects: ["status DRAFT -> PUBLISHED; superseded tariff -> SUPERSEDED"]

  - method: POST
    path: "/freight/tariffs/{tariffId}/retire"
    description: "Retire a published tariff"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Tariff
    side_effects: ["status PUBLISHED -> RETIRED"]

  # --- CarrierContract ---
  - method: POST
    path: "/freight/carrier-contracts"
    description: "Create a carrier contract in NEGOTIATION"
    roles: [OperationsManager]
    code: 201
    input: [contract_number, carrier_name, service_lane, container_rates, "demurrage_free_days?", "detention_free_days?", demurrage_tiers, detention_per_diem_cents, service_start, service_end]
    output: CarrierContract
    side_effects: ["status = NEGOTIATION"]

  - method: GET
    path: "/freight/carrier-contracts"
    description: "List carrier contracts"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "status?", "carrier_name?"]
    output: "CarrierContract[]"
    side_effects: []

  - method: GET
    path: "/freight/carrier-contracts/{contractId}"
    description: "Get a carrier contract"
    roles: [Any]
    code: 200
    input: []
    output: CarrierContract
    side_effects: []

  - method: POST
    path: "/freight/carrier-contracts/{contractId}/activate"
    description: "Activate a contract (closed-window overlap check on same carrier+lane)"
    roles: [OperationsManager]
    code: 200
    input: []
    output: CarrierContract
    side_effects: ["status NEGOTIATION -> ACTIVE"]

  - method: POST
    path: "/freight/carrier-contracts/{contractId}/suspend"
    description: "Suspend an active contract"
    roles: [OperationsManager]
    code: 200
    input: []
    output: CarrierContract
    side_effects: ["status ACTIVE -> SUSPENDED"]

  - method: POST
    path: "/freight/carrier-contracts/{contractId}/resume"
    description: "Resume a suspended contract (re-runs overlap check)"
    roles: [OperationsManager]
    code: 200
    input: []
    output: CarrierContract
    side_effects: ["status SUSPENDED -> ACTIVE"]

  # --- SuretyBond ---
  - method: POST
    path: "/freight/surety-bonds"
    description: "Register an NVOCC surety bond (INACTIVE)"
    roles: [ComplianceOfficer]
    code: 201
    input: [bond_number, surety_company, coverage_amount_cents, effective_from, effective_to]
    output: SuretyBond
    side_effects: ["status = INACTIVE; available_coverage_cents = coverage_amount_cents"]

  - method: GET
    path: "/freight/surety-bonds"
    description: "List bonds"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "SuretyBond[]"
    side_effects: []

  - method: GET
    path: "/freight/surety-bonds/{bondId}"
    description: "Get a bond (available_coverage recomputed on read)"
    roles: [Any]
    code: 200
    input: []
    output: SuretyBond
    side_effects: []

  - method: POST
    path: "/freight/surety-bonds/{bondId}/activate"
    description: "Activate a bond (clock must be inside its half-open window)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: SuretyBond
    side_effects: ["status INACTIVE -> ACTIVE"]

  # --- Voyage ---
  - method: POST
    path: "/freight/voyages"
    description: "Create a voyage against an ACTIVE contract; etd must lie inside the contract's closed service window"
    roles: [OperationsManager]
    code: 201
    input: [vessel_name, voyage_number, carrier_contract_id, origin_port, destination_port, etd, eta]
    output: Voyage
    side_effects: ["status = SCHEDULED; isf_deadline = etd - 24h; ams_deadline = etd - 48h"]

  - method: GET
    path: "/freight/voyages"
    description: "List voyages"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "status?", "carrier_contract_id?"]
    output: "Voyage[]"
    side_effects: []

  - method: GET
    path: "/freight/voyages/{voyageId}"
    description: "Get a voyage"
    roles: [Any]
    code: 200
    input: []
    output: Voyage
    side_effects: []

  - method: POST
    path: "/freight/voyages/{voyageId}/open-for-booking"
    description: "Open a voyage for bookings"
    roles: [OperationsManager]
    code: 200
    input: []
    output: Voyage
    side_effects: ["status SCHEDULED -> BOOKING_OPEN"]

  - method: POST
    path: "/freight/voyages/{voyageId}/depart"
    description: "Depart a voyage (clock >= etd); cascades bookings/consolidations/assignments"
    roles: [OperationsManager]
    code: 200
    input: []
    output: Voyage
    side_effects: ["status BOOKING_OPEN -> DEPARTED", "booking/consolidation/assignment cascade per §1.2 Voyage.depart"]

  - method: POST
    path: "/freight/voyages/{voyageId}/arrive"
    description: "Arrive a voyage (clock >= eta); starts demurrage clocks"
    roles: [OperationsManager]
    code: 200
    input: []
    output: Voyage
    side_effects: ["status DEPARTED -> ARRIVED", "assignments LOADED -> DISCHARGED with discharged_at = clock"]

  - method: POST
    path: "/freight/voyages/{voyageId}/close"
    description: "Close an arrived voyage once all bookings are terminal"
    roles: [OperationsManager]
    code: 200
    input: []
    output: Voyage
    side_effects: ["status ARRIVED -> CLOSED"]

  - method: POST
    path: "/freight/voyages/{voyageId}/blank"
    description: "Declare a blank sailing; full rollover cascade"
    roles: [OperationsManager]
    code: 200
    input: []
    output: Voyage
    side_effects: ["status -> BLANKED", "blank-sailing cascade per §1.2 Voyage.blank"]

  # --- Booking ---
  - method: POST
    path: "/freight/bookings"
    description: "Create a booking (QUOTED) against a BOOKING_OPEN voyage and a PUBLISHED tariff; Shipper creates for self (X-User-ID), BookingCoordinator must pass shipper_id"
    roles: [Shipper, BookingCoordinator]
    code: 201
    input: [voyage_id, tariff_id, rate_source, "spot_rate_per_unit_cents?", mode, "container_type?", "container_count?", commodity_type, gross_weight_kg, volume_cbm, terms, "shipper_id?"]
    output: Booking
    side_effects: ["chargeable_weight_rt and estimated_freight_cents computed", "increments Booking.version by 1 (initial version 1)"]

  - method: GET
    path: "/freight/bookings"
    description: "List bookings"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "shipper_id?", "voyage_id?", "tariff_id?", "status?"]
    output: "Booking[]"
    side_effects: []

  - method: GET
    path: "/freight/bookings/{bookingId}"
    description: "Get a booking"
    roles: [Any]
    code: 200
    input: []
    output: Booking
    side_effects: []

  - method: PATCH
    path: "/freight/bookings/{bookingId}"
    description: "Amend cargo particulars (weight/volume/commodity/container_count/terms) while QUOTED or CONFIRMED; OCC-guarded"
    roles: [BookingCoordinator]
    code: 200
    input: [expected_booking_version, "gross_weight_kg?", "volume_cbm?", "commodity_type?", "container_count?", "terms?"]
    output: Booking
    side_effects:
      - "increments Booking.version by 1"
      - "chargeable_weight_rt and estimated_freight_cents recomputed when weight/volume/count change"
      - "commodity_type change re-validated against tariff (ERR_TARIFF_MISMATCH)"

  - method: POST
    path: "/freight/bookings/{bookingId}/confirm"
    description: "Confirm a quoted booking (credit gate: forward exposure variant)"
    roles: [BookingCoordinator]
    code: 200
    input: []
    output: Booking
    side_effects: ["status QUOTED -> CONFIRMED", "estimate frozen", "shipper forward exposure recompute"]

  - method: POST
    path: "/freight/bookings/{bookingId}/cancel"
    description: "Cancel a booking while QUOTED/CONFIRMED/DOCUMENTATION_CLEARED; fee from CONFIRMED onwards"
    roles: [Shipper, BookingCoordinator]
    code: 200
    input: ["reason?"]
    output: Booking
    side_effects: ["status -> CANCELLED", "cascade per §1.2 Booking.cancel (assignments, B/L, invoices, policy, consolidation recompute)", "CANCELLATION invoice created when cancelling from CONFIRMED or DOCUMENTATION_CLEARED"]

  - method: POST
    path: "/freight/bookings/{bookingId}/roll"
    description: "Shipper-initiated rollover: CONFIRMED/DOCUMENTATION_CLEARED -> ROLLED (SHIPPER_REQUEST)"
    roles: [Shipper, BookingCoordinator]
    code: 200
    input: ["reason?"]
    output: Booking
    side_effects: ["status -> ROLLED", "rollover_count += 1, rolled_reason = SHIPPER_REQUEST", "cascade per §1.2 Booking.roll"]

  - method: POST
    path: "/freight/bookings/{bookingId}/rebook"
    description: "Rebook a ROLLED booking onto a same-lane BOOKING_OPEN voyage; charge per rollover_rebook_charge variant"
    roles: [BookingCoordinator]
    code: 200
    input: [new_voyage_id]
    output: Booking
    side_effects: ["status ROLLED -> CONFIRMED", "voyage_id replaced", "estimated_freight_cents recomputed per rolled_reason", "pending_rollover_fee_cents += 150000 when SHIPPER_REQUEST"]

  - method: POST
    path: "/freight/bookings/{bookingId}/deliver"
    description: "Deliver an ARRIVED booking (requires RELEASED B/L; COLLECT terms require paid freight invoices)"
    roles: [BookingCoordinator]
    code: 200
    input: []
    output: Booking
    side_effects: ["status ARRIVED -> DELIVERED", "BOUND policies -> EXPIRED"]

  # --- Consolidation ---
  - method: POST
    path: "/freight/consolidations"
    description: "Open a CFS consolidation on a BOOKING_OPEN voyage; stuffing windows at the same cfs_location must not overlap (half-open)"
    roles: [BookingCoordinator]
    code: 201
    input: [voyage_id, cfs_location, container_type, max_weight_kg, max_volume_cbm, stuffing_window_start, stuffing_window_end]
    output: Consolidation
    side_effects: ["status = OPEN; used_* initialized to 0"]

  - method: GET
    path: "/freight/consolidations"
    description: "List consolidations"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "voyage_id?", "cfs_location?", "status?"]
    output: "Consolidation[]"
    side_effects: []

  - method: GET
    path: "/freight/consolidations/{consolidationId}"
    description: "Get a consolidation"
    roles: [Any]
    code: 200
    input: []
    output: Consolidation
    side_effects: []

  - method: POST
    path: "/freight/consolidations/{consolidationId}/stuff"
    description: "Stuff an LCL booking into the consolidation; booking must be mode LCL and in {CONFIRMED, DOCUMENTATION_CLEARED} (ERR_BOOKING_INVALID_STATE), consolidation must be OPEN (ERR_CONSOLIDATION_INVALID_STATE); OCC-guarded; capacity gate; commodity-mix gate"
    roles: [BookingCoordinator]
    code: 201
    input: [booking_id, expected_consolidation_version]
    output: ContainerAssignment
    side_effects:
      - "increments Consolidation.version by 1"
      - "creates ContainerAssignment (LCL, status STUFFED, stuffed weight/volume copied from booking)"
      - "used_weight_kg / used_volume_cbm recompute"

  - method: POST
    path: "/freight/consolidations/{consolidationId}/unstuff"
    description: "Remove a stuffed booking from the consolidation (assignment -> CANCELLED); booking must hold a member assignment in this consolidation with status IN {STUFFED, GATED_IN} (ERR_ASSIGNMENT_NOT_FOUND); consolidation must be OPEN or CLOSED (ERR_CONSOLIDATION_INVALID_STATE)"
    roles: [BookingCoordinator]
    code: 200
    input: [booking_id]
    output: Consolidation
    side_effects: ["member assignment -> CANCELLED", "used_weight_kg / used_volume_cbm recompute", "CLOSED consolidation with zero remaining members -> OPEN", "increments Consolidation.version by 1"]

  - method: POST
    path: "/freight/consolidations/{consolidationId}/close"
    description: "Close a non-empty OPEN consolidation"
    roles: [BookingCoordinator]
    code: 200
    input: []
    output: Consolidation
    side_effects: ["status OPEN -> CLOSED"]

  - method: POST
    path: "/freight/consolidations/{consolidationId}/tender"
    description: "Tender a CLOSED consolidation to the carrier; members STUFFED -> GATED_IN; member bookings re-evaluate LOADED"
    roles: [BookingCoordinator]
    code: 200
    input: []
    output: Consolidation
    side_effects: ["status CLOSED -> TENDERED", "member assignments STUFFED -> GATED_IN", "member booking LOADED re-evaluation"]

  - method: POST
    path: "/freight/consolidations/{consolidationId}/cancel"
    description: "Cancel an OPEN/CLOSED/TENDERED consolidation"
    roles: [BookingCoordinator]
    code: 200
    input: []
    output: Consolidation
    side_effects: ["status -> CANCELLED", "member assignments -> CANCELLED", "used_* -> 0"]

  # --- ContainerAssignment ---
  - method: POST
    path: "/freight/container-assignments"
    description: "Create an FCL container assignment for a booking (booking mode must be FCL and booking in {CONFIRMED, DOCUMENTATION_CLEARED} -> ERR_BOOKING_INVALID_STATE; LCL bookings get assignments only via consolidation stuff)"
    roles: [BookingCoordinator]
    code: 201
    input: [booking_id, container_number, "seal_number?", stuffed_weight_kg, stuffed_volume_cbm]
    output: ContainerAssignment
    side_effects: ["status = STUFFED, consolidation_id = null, stuffed_at = clock", "booking FCL assignment count must not exceed container_count (ERR_CONTAINER_COUNT_EXCEEDED)"]

  - method: GET
    path: "/freight/container-assignments"
    description: "List container assignments (FK reverse-reachability for booking_id and consolidation_id)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "booking_id?", "consolidation_id?", "status?"]
    output: "ContainerAssignment[]"
    side_effects: []

  - method: GET
    path: "/freight/container-assignments/{assignmentId}"
    description: "Get an assignment (provisional demurrage/detention refreshed on read)"
    roles: [Any]
    code: 200
    input: []
    output: ContainerAssignment
    side_effects: []

  - method: POST
    path: "/freight/container-assignments/{assignmentId}/gate-in"
    description: "Gate in a stuffed container"
    roles: [BookingCoordinator]
    code: 200
    input: []
    output: ContainerAssignment
    side_effects: ["status STUFFED -> GATED_IN", "gated_in_at = clock", "booking LOADED re-evaluation (FCL)"]

  - method: POST
    path: "/freight/container-assignments/{assignmentId}/gate-out"
    description: "Gate out a discharged container; freezes FINAL demurrage"
    roles: [BookingCoordinator]
    code: 200
    input: []
    output: ContainerAssignment
    side_effects: ["status DISCHARGED -> GATED_OUT", "gated_out_at = clock", "demurrage_days and demurrage_charge_cents frozen (final variant)"]

  - method: POST
    path: "/freight/container-assignments/{assignmentId}/empty-return"
    description: "Return the empty container; freezes FINAL detention and auto-creates the D&D invoice when charges > 0"
    roles: [BookingCoordinator]
    code: 200
    input: []
    output: ContainerAssignment
    side_effects: ["status GATED_OUT -> EMPTY_RETURNED", "empty_returned_at = clock", "detention_days and detention_charge_cents frozen", "auto-create DEMURRAGE_DETENTION invoice (DRAFT) when total charges > 0", "shipper exposure recompute"]

  # --- BillOfLading ---
  - method: POST
    path: "/freight/bill-of-lading"
    description: "Create a DRAFT B/L for a booking (booking must be in {CONFIRMED, DOCUMENTATION_CLEARED, LOADED, DEPARTED, ARRIVED} -> ERR_BOOKING_INVALID_STATE; at most one non-terminal B/L per booking -> ERR_ACTIVE_BL_EXISTS)"
    roles: [DocumentationOfficer]
    code: 201
    input: [booking_id, bl_type, release_mode]
    output: BillOfLading
    side_effects: ["status = DRAFT"]

  - method: GET
    path: "/freight/bill-of-lading"
    description: "List bills of lading"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "booking_id?", "status?"]
    output: "BillOfLading[]"
    side_effects: []

  - method: GET
    path: "/freight/bill-of-lading/{blId}"
    description: "Get a B/L"
    roles: [Any]
    code: 200
    input: []
    output: BillOfLading
    side_effects: []

  - method: POST
    path: "/freight/bill-of-lading/{blId}/issue"
    description: "Issue a DRAFT B/L (bond gate)"
    roles: [DocumentationOfficer]
    code: 200
    input: []
    output: BillOfLading
    side_effects: ["status DRAFT -> ISSUED", "issued_by_user_id = X-User-ID", "booking DOCUMENTATION_CLEARED re-evaluation"]

  - method: POST
    path: "/freight/bill-of-lading/{blId}/request-amendment"
    description: "Start an amendment cycle on an ISSUED B/L (cap 3)"
    roles: [DocumentationOfficer]
    code: 200
    input: []
    output: BillOfLading
    side_effects: ["status ISSUED -> AMENDMENT_PENDING", "amendment_count += 1"]

  - method: POST
    path: "/freight/bill-of-lading/{blId}/reissue"
    description: "Return an AMENDMENT_PENDING B/L to DRAFT for correction"
    roles: [DocumentationOfficer]
    code: 200
    input: []
    output: BillOfLading
    side_effects: ["status AMENDMENT_PENDING -> DRAFT", "booking DOCUMENTATION_CLEARED reverts to CONFIRMED"]

  - method: POST
    path: "/freight/bill-of-lading/{blId}/surrender"
    description: "Shipper surrenders original B/L (ORIGINAL/TELEX modes)"
    roles: [Shipper]
    code: 200
    input: []
    output: BillOfLading
    side_effects: ["status ISSUED -> SURRENDERED"]

  - method: POST
    path: "/freight/bill-of-lading/{blId}/release"
    description: "Release a B/L (SoD: releaser != issuer; filings gate; PREPAID payment gate)"
    roles: [DocumentationOfficer]
    code: 200
    input: []
    output: BillOfLading
    side_effects: ["status -> RELEASED", "released_by_user_id = X-User-ID"]

  - method: POST
    path: "/freight/bill-of-lading/{blId}/void"
    description: "Void a DRAFT or AMENDMENT_PENDING B/L"
    roles: [DocumentationOfficer]
    code: 200
    input: []
    output: BillOfLading
    side_effects: ["status -> VOIDED"]

  # --- ComplianceFiling ---
  - method: POST
    path: "/freight/compliance-filings"
    description: "Create a compliance filing (ISF or AMS) for a booking; booking must be in {CONFIRMED, DOCUMENTATION_CLEARED, LOADED, DEPARTED} (ERR_BOOKING_INVALID_STATE); deadline snapshot frozen at creation; one filing per (booking_id, filing_type) -> ERR_FILING_EXISTS"
    roles: [ComplianceOfficer]
    code: 201
    input: [booking_id, filing_type]
    output: ComplianceFiling
    side_effects: ["status = PENDING", "deadline_at snapshot from voyage (isf_deadline or ams_deadline)"]

  - method: GET
    path: "/freight/compliance-filings"
    description: "List filings"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "booking_id?", "filing_type?", "status?"]
    output: "ComplianceFiling[]"
    side_effects: []

  - method: GET
    path: "/freight/compliance-filings/{filingId}"
    description: "Get a filing"
    roles: [Any]
    code: 200
    input: []
    output: ComplianceFiling
    side_effects: []

  - method: POST
    path: "/freight/compliance-filings/{filingId}/submit"
    description: "Submit a PENDING or REJECTED filing; lateness evaluated against the frozen deadline; late filings accrue penalty against the bond"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ComplianceFiling
    side_effects: ["status -> SUBMITTED", "submitted_at = clock", "is_late / penalty evaluated per isf_ams_penalty", "bond available_coverage_cents recompute"]

  - method: POST
    path: "/freight/compliance-filings/{filingId}/record-response"
    description: "Record the customs authority response (ACCEPTED | REJECTED)"
    roles: [ComplianceOfficer]
    code: 200
    input: [outcome]
    output: ComplianceFiling
    side_effects: ["status SUBMITTED -> ACCEPTED or REJECTED", "booking DOCUMENTATION_CLEARED re-evaluation on ACCEPTED"]

  - method: POST
    path: "/freight/compliance-filings/{filingId}/resolve-penalty"
    description: "Resolve an accrued penalty (PAID | WAIVED); restores bond available coverage"
    roles: [ComplianceOfficer]
    code: 200
    input: [resolution]
    output: ComplianceFiling
    side_effects: ["penalty_status ACCRUED -> PAID or WAIVED", "bond available_coverage_cents recompute (accrual removed)"]

  # --- Invoice ---
  - method: POST
    path: "/freight/invoices"
    description: "Generate the FREIGHT invoice for a booking in {CONFIRMED, DOCUMENTATION_CLEARED, LOADED, DEPARTED, ARRIVED} (ERR_BOOKING_INVALID_STATE); one FREIGHT invoice per booking (ERR_INVOICE_EXISTS); lines per ocean_freight_charge + BOUND policy premium + pending rollover fee"
    roles: [FinanceController]
    code: 201
    input: [booking_id, invoice_type]
    output: Invoice
    side_effects: ["status = DRAFT", "lines generated with per-line rounding", "total_cents = SUM(rounded lines)"]

  - method: GET
    path: "/freight/invoices"
    description: "List invoices"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "booking_id?", "invoice_type?", "status?"]
    output: "Invoice[]"
    side_effects: []

  - method: GET
    path: "/freight/invoices/{invoiceId}"
    description: "Get an invoice (lines embedded)"
    roles: [Any]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: POST
    path: "/freight/invoices/{invoiceId}/issue"
    description: "Issue a DRAFT invoice; computes due_date; may auto-suspend the shipper"
    roles: [FinanceController]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status DRAFT -> ISSUED", "issued_at/due_date set", "shipper exposure recompute + auto-suspend check"]

  - method: POST
    path: "/freight/invoices/{invoiceId}/payments"
    description: "Record a payment (amount <= balance; drives ISSUED/PARTIALLY_PAID/PAID)"
    roles: [FinanceController]
    code: 200
    input: [amount_cents]
    output: Invoice
    side_effects: ["paid_cents += amount_cents", "status transition per §1.2 Invoice", "shipper exposure recompute"]

  - method: POST
    path: "/freight/invoices/{invoiceId}/void"
    description: "Void a DRAFT invoice or an ISSUED invoice with paid_cents == 0"
    roles: [FinanceController]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status -> VOID", "shipper exposure recompute"]

  - method: POST
    path: "/freight/invoices/{invoiceId}/adjustments"
    description: "Append a MANUAL_ADJUSTMENT line to a DRAFT invoice; OCC-guarded"
    roles: [FinanceController]
    code: 200
    input: [description, quantity, unit_rate_cents, expected_invoice_version]
    output: Invoice
    side_effects:
      - "increments Invoice.version by 1"
      - "line appended with per-line rounding; total_cents recomputed"

  # --- CargoInsurancePolicy ---
  - method: POST
    path: "/freight/insurance-policies"
    description: "Quote a cargo insurance policy for a booking in {CONFIRMED, DOCUMENTATION_CLEARED, LOADED} (ERR_BOOKING_INVALID_STATE); insured value + premium computed per insured_value_premium"
    roles: [BookingCoordinator]
    code: 201
    input: [booking_id, coverage_type, cargo_value_cents]
    output: CargoInsurancePolicy
    side_effects: ["status = QUOTED", "freight_base_cents / insured_value_cents / premium_cents computed"]

  - method: GET
    path: "/freight/insurance-policies"
    description: "List policies"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "booking_id?", "status?"]
    output: "CargoInsurancePolicy[]"
    side_effects: []

  - method: GET
    path: "/freight/insurance-policies/{policyId}"
    description: "Get a policy"
    roles: [Any]
    code: 200
    input: []
    output: CargoInsurancePolicy
    side_effects: []

  - method: POST
    path: "/freight/insurance-policies/{policyId}/bind"
    description: "Bind a quoted policy (booking must be CONFIRMED/DOCUMENTATION_CLEARED/LOADED)"
    roles: [BookingCoordinator]
    code: 200
    input: []
    output: CargoInsurancePolicy
    side_effects: ["status QUOTED -> BOUND"]

  - method: POST
    path: "/freight/insurance-policies/{policyId}/cancel"
    description: "Cancel a QUOTED or BOUND policy with no open claims"
    roles: [BookingCoordinator]
    code: 200
    input: []
    output: CargoInsurancePolicy
    side_effects: ["status -> CANCELLED"]

  # --- CargoClaim ---
  - method: POST
    path: "/freight/claims"
    description: "File a cargo claim against a BOUND policy (ERR_POLICY_INVALID_STATE); Shipper files for own booking (policy.booking_id belongs to X-User-ID shipper, else ERR_INSUFFICIENT_PERMISSIONS)"
    roles: [Shipper]
    code: 201
    input: [policy_id, claim_type, claimed_amount_cents, "description?"]
    output: CargoClaim
    side_effects: ["status = FILED", "booking_id denormalized from policy"]

  - method: GET
    path: "/freight/claims"
    description: "List claims"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "policy_id?", "booking_id?", "status?"]
    output: "CargoClaim[]"
    side_effects: []

  - method: GET
    path: "/freight/claims/{claimId}"
    description: "Get a claim"
    roles: [Any]
    code: 200
    input: []
    output: CargoClaim
    side_effects: []

  - method: POST
    path: "/freight/claims/{claimId}/start-review"
    description: "Start adjuster review"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: CargoClaim
    side_effects: ["status FILED -> UNDER_REVIEW", "reviewed_by_user_id = X-User-ID"]

  - method: POST
    path: "/freight/claims/{claimId}/approve"
    description: "Approve a claim (SoD: approver != reviewer); settlement computed per coverage variant"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: CargoClaim
    side_effects: ["status UNDER_REVIEW -> APPROVED", "settlement_amount_cents computed per claim_settlement"]

  - method: POST
    path: "/freight/claims/{claimId}/deny"
    description: "Deny a claim (SoD: denier != reviewer)"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: CargoClaim
    side_effects: ["status UNDER_REVIEW -> DENIED", "settlement_amount_cents = 0"]

  - method: POST
    path: "/freight/claims/{claimId}/settle"
    description: "Pay out an approved claim"
    roles: [FinanceController]
    code: 200
    input: []
    output: CargoClaim
    side_effects: ["status APPROVED -> SETTLED", "settled_at = clock"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, or role not a declared role name" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted on this endpoint, or entity_backed Shipper acting on a resource whose shipper_id != X-User-ID" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Same X-User-ID on both sides of a SoD pair (tariff create/publish, B/L issue/release, claim review/approve-deny)" }

  # --- Generic input ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum member, non-positive number, or violated conditional-field rule (SPOT without spot_rate; FCL without container_type/container_count; LCL carrying them; end <= start on windows)" }

  # --- Not found (404) ---
  - { id: ERR_SHIPPER_NOT_FOUND, http: 404, condition: "Shipper id does not exist" }
  - { id: ERR_TARIFF_NOT_FOUND, http: 404, condition: "Tariff id does not exist" }
  - { id: ERR_CONTRACT_NOT_FOUND, http: 404, condition: "CarrierContract id does not exist" }
  - { id: ERR_BOND_NOT_FOUND, http: 404, condition: "SuretyBond id does not exist" }
  - { id: ERR_VOYAGE_NOT_FOUND, http: 404, condition: "Voyage id does not exist (path or voyage_id / new_voyage_id body FK)" }
  - { id: ERR_BOOKING_NOT_FOUND, http: 404, condition: "Booking id does not exist" }
  - { id: ERR_CONSOLIDATION_NOT_FOUND, http: 404, condition: "Consolidation id does not exist" }
  - { id: ERR_ASSIGNMENT_NOT_FOUND, http: 404, condition: "ContainerAssignment id does not exist" }
  - { id: ERR_BL_NOT_FOUND, http: 404, condition: "BillOfLading id does not exist" }
  - { id: ERR_FILING_NOT_FOUND, http: 404, condition: "ComplianceFiling id does not exist" }
  - { id: ERR_INVOICE_NOT_FOUND, http: 404, condition: "Invoice id does not exist" }
  - { id: ERR_POLICY_NOT_FOUND, http: 404, condition: "CargoInsurancePolicy id does not exist" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "CargoClaim id does not exist" }

  # --- State (409) ---
  - { id: ERR_VOYAGE_NOT_OPEN, http: 409, condition: "Booking or consolidation creation requires voyage status BOOKING_OPEN" }
  - { id: ERR_SHIPPER_SUSPENDED, http: 409, condition: "Shipper status SUSPENDED blocks booking creation and confirm" }
  - { id: ERR_CONTRACT_NOT_ACTIVE, http: 409, condition: "Voyage creation requires contract status ACTIVE" }
  - { id: ERR_BOOKING_INVALID_STATE, http: 409, condition: "Booking not in a state that permits the requested operation" }
  - { id: ERR_BOOKING_NOT_CANCELLABLE, http: 409, condition: "Cancel requires booking in {QUOTED, CONFIRMED, DOCUMENTATION_CLEARED}" }
  - { id: ERR_BL_INVALID_STATE, http: 409, condition: "B/L not in a state that permits the requested operation (incl. SEAWAY-only direct release and ORIGINAL/TELEX-only surrender)" }
  - { id: ERR_BL_NOT_RELEASED, http: 409, condition: "Deliver requires a RELEASED B/L on the booking" }
  - { id: ERR_INVOICE_INVALID_STATE, http: 409, condition: "Invoice not in a state that permits the requested operation" }
  - { id: ERR_INVOICE_EMPTY, http: 409, condition: "Issue requires total_cents > 0" }
  - { id: ERR_FILING_INVALID_STATE, http: 409, condition: "Filing not in a state that permits the requested operation" }
  - { id: ERR_CLAIM_INVALID_STATE, http: 409, condition: "Claim not in a state that permits the requested operation" }
  - { id: ERR_POLICY_INVALID_STATE, http: 409, condition: "Policy not in a state that permits the requested operation" }
  - { id: ERR_CONSOLIDATION_INVALID_STATE, http: 409, condition: "Consolidation not in a state that permits the requested operation" }
  - { id: ERR_CONTRACT_INVALID_STATE, http: 409, condition: "Contract not in a state that permits the requested operation" }
  - { id: ERR_TARIFF_INVALID_STATE, http: 409, condition: "Tariff not in a state that permits the requested operation" }
  - { id: ERR_BOND_INVALID_STATE, http: 409, condition: "Bond not in a state that permits the requested operation" }
  - { id: ERR_BOND_NOT_IN_WINDOW, http: 409, condition: "Bond activation requires effective_from <= logical clock < effective_to" }
  - { id: ERR_ASSIGNMENT_INVALID_STATE, http: 409, condition: "ContainerAssignment not in a state that permits the requested operation" }
  - { id: ERR_VOYAGE_INVALID_STATE, http: 409, condition: "Voyage not in a state that permits the requested operation" }
  - { id: ERR_SHIPPER_INVALID_STATE, http: 409, condition: "Shipper not in a state that permits the requested operation" }
  - { id: ERR_VOYAGE_HAS_OPEN_BOOKINGS, http: 409, condition: "Voyage close requires every booking in {DELIVERED, CANCELLED}" }

  # --- Business safety / compliance ---
  - { id: ERR_FILINGS_NOT_CLEARED, http: 409, condition: "B/L release requires ISF and AMS filings both ACCEPTED for the booking" }
  - { id: ERR_BOND_COVERAGE_INSUFFICIENT, http: 409, condition: "No ACTIVE SuretyBond in its window with available_coverage_cents >= 75000 at B/L issue" }
  - { id: ERR_INCOMPATIBLE_CARGO_MIX, http: 422, condition: "HAZMAT and REEFER bookings may not share a consolidation" }
  - { id: ERR_CLAIMS_OPEN, http: 409, condition: "Policy cancel blocked while a claim is in {FILED, UNDER_REVIEW, APPROVED}" }

  # --- Business referential ---
  - { id: ERR_TARIFF_NOT_EFFECTIVE, http: 422, condition: "Tariff not PUBLISHED or its half-open window does not cover the voyage etd" }
  - { id: ERR_TARIFF_MISMATCH, http: 422, condition: "Tariff lane/commodity/mode/container_type inconsistent with voyage and booking" }
  - { id: ERR_FILING_EXISTS, http: 409, condition: "A filing already exists for (booking_id, filing_type)" }
  - { id: ERR_INVOICE_EXISTS, http: 409, condition: "A FREIGHT invoice already exists for the booking" }
  - { id: ERR_ACTIVE_BL_EXISTS, http: 409, condition: "Booking already has a B/L in {DRAFT, ISSUED, AMENDMENT_PENDING, SURRENDERED}" }
  - { id: ERR_BOOKING_ALREADY_STUFFED, http: 409, condition: "Booking already holds an LCL assignment in {STUFFED, GATED_IN, LOADED}" }

  # --- Business temporal ---
  - { id: ERR_TARIFF_WINDOW_OVERLAP, http: 409, condition: "Another PUBLISHED tariff with identical key has an intersecting half-open window (adjacency allowed)" }
  - { id: ERR_CONTRACT_WINDOW_OVERLAP, http: 409, condition: "Another ACTIVE/SUSPENDED contract with same carrier+lane has an intersecting closed window (adjacency IS conflict)" }
  - { id: ERR_STUFFING_WINDOW_OVERLAP, http: 409, condition: "Another consolidation at the same cfs_location in {OPEN, CLOSED, TENDERED} has an intersecting half-open stuffing window" }
  - { id: ERR_VOYAGE_OUTSIDE_CONTRACT_WINDOW, http: 422, condition: "Voyage etd outside the contract's closed [service_start, service_end] window" }
  - { id: ERR_VOYAGE_NOT_DEPARTABLE, http: 409, condition: "Logical clock < etd at depart" }
  - { id: ERR_VOYAGE_NOT_ARRIVABLE, http: 409, condition: "Logical clock < eta at arrive" }
  - { id: ERR_VOYAGE_LANE_MISMATCH, http: 409, condition: "Rebook target voyage must share origin_port and destination_port with the booking's current voyage" }

  # --- Business constraint ---
  - { id: ERR_CONSOLIDATION_CAPACITY_EXCEEDED, http: 422, condition: "Stuffing would push used_weight_kg > max_weight_kg or used_volume_cbm > max_volume_cbm (equality allowed)" }
  - { id: ERR_CONSOLIDATION_EMPTY, http: 422, condition: "Close requires at least one member assignment in {STUFFED, GATED_IN}" }
  - { id: ERR_CONTAINER_COUNT_EXCEEDED, http: 422, condition: "FCL booking already has container_count assignments in {STUFFED, GATED_IN, LOADED}" }
  - { id: ERR_ROLLOVER_LIMIT_EXCEEDED, http: 422, condition: "roll requires rollover_count < 2" }
  - { id: ERR_AMENDMENT_LIMIT_EXCEEDED, http: 422, condition: "request-amendment requires amendment_count < 3" }

  # --- Business fiscal ---
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 402, condition: "Confirm/rebook/reinstate credit gate failed (forward exposure after the operation would exceed credit_limit_cents)" }
  - { id: ERR_OUTSTANDING_BALANCE, http: 402, condition: "Operation blocked by an unpaid invoice in {ISSUED, PARTIALLY_PAID} with balance_cents > 0" }
  - { id: ERR_OVERPAYMENT, http: 422, condition: "Payment amount_cents must satisfy 0 < amount_cents <= balance_cents" }

  # --- OCC (412) ---
  - { id: ERR_STALE_BOOKING_VERSION, http: 412, condition: "expected_booking_version != current Booking.version on PATCH /freight/bookings/{id}" }
  - { id: ERR_STALE_CONSOLIDATION_VERSION, http: 412, condition: "expected_consolidation_version != current Consolidation.version on stuff" }
  - { id: ERR_STALE_INVOICE_VERSION, http: 412, condition: "expected_invoice_version != current Invoice.version on adjustments" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Shipper
    description: "Beneficial cargo owner; books freight, surrenders B/Ls, files claims; may only touch own resources (shipper_id == X-User-ID)"
    identity: "entity_backed:Shipper"
    exclusive_operations:
      - "POST /freight/bill-of-lading/{id}/surrender"
      - "POST /freight/claims"
    shared_operations:
      - "POST /freight/bookings (own shipper_id; omit shipper_id body field)"
      - "POST /freight/bookings/{id}/cancel (own bookings)"
      - "POST /freight/bookings/{id}/roll (own bookings)"
      - "All GET endpoints"

  - name: BookingCoordinator
    description: "Forwarder operations desk; manages bookings, consolidations, containers, insurance"
    identity: "opaque"
    exclusive_operations:
      - "POST /freight/bookings/{id}/confirm, /rebook, /deliver"
      - "PATCH /freight/bookings/{id}"
      - "POST /freight/consolidations and all /freight/consolidations/{id}/* actions"
      - "POST /freight/container-assignments and gate-in / gate-out / empty-return"
      - "POST /freight/insurance-policies and bind / cancel"
    shared_operations:
      - "POST /freight/bookings (must pass shipper_id)"
      - "POST /freight/bookings/{id}/cancel, /roll"
      - "All GET endpoints"

  - name: DocumentationOfficer
    description: "Documentation desk; drafts, issues, amends, releases, and voids bills of lading (SoD: issuer never releases)"
    identity: "opaque"
    exclusive_operations:
      - "POST /freight/bill-of-lading"
      - "POST /freight/bill-of-lading/{id}/issue, /request-amendment, /reissue, /release, /void"
    shared_operations:
      - "All GET endpoints"

  - name: ComplianceOfficer
    description: "Compliance desk; tariffs, bonds, ISF/AMS filings (SoD: tariff creator never publishes)"
    identity: "opaque"
    exclusive_operations:
      - "POST /freight/tariffs and publish / retire"
      - "POST /freight/surety-bonds and activate"
      - "POST /freight/compliance-filings and submit / record-response / resolve-penalty"
    shared_operations:
      - "All GET endpoints"

  - name: FinanceController
    description: "Finance desk; invoices, payments, credit terms, suspension, claim settlement"
    identity: "opaque"
    exclusive_operations:
      - "POST /freight/invoices and issue / payments / void / adjustments"
      - "PATCH /freight/shippers/{id}/credit-terms"
      - "POST /freight/shippers/{id}/suspend, /reinstate"
      - "POST /freight/claims/{id}/settle"
    shared_operations:
      - "All GET endpoints"

  - name: ClaimsAdjuster
    description: "Claims desk; reviews and adjudicates cargo claims (SoD: reviewer never approves/denies own review)"
    identity: "opaque"
    exclusive_operations:
      - "POST /freight/claims/{id}/start-review, /approve, /deny"
    shared_operations:
      - "All GET endpoints"

  - name: OperationsManager
    description: "Network operations; shippers registry, carrier contracts, voyages, blank sailings, logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /freight/shippers"
      - "POST /freight/carrier-contracts and activate / suspend / resume"
      - "POST /freight/voyages and open-for-booking / depart / arrive / close / blank"
      - "POST /freight/_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"

  - name: Any
    description: "Pseudo-role: every declared role may perform these shared operations"
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "All GET endpoints"
