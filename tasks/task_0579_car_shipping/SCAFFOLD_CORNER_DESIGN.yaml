        claim_type: Constants Applied
        grounds: [calculations.deposit_split, entities.ShipmentOrder.fields.deposit_cents]
        distinguishing_aspect: "For quoted_total 212500, raw deposit round(42500)=42500 exceeds the 40000 cap, so deposit_cents=40000 and cod_balance_cents=172500."
