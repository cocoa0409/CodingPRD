scenario: |
  Generate task harder than expert level!

  2469. Hydrogen Production & Fueling Station Operations (hydrogen fuel operator): production pathway selection across electrolysis and reforming with feedstock, power supply and carbon intensity implications, purity specification and quality assurance testing for fuel cell vehicle grade, storage, compression and cascade system operation with pressure vessel inspection requirements, station dispensing with fill protocol compliance, temperature management and metering accuracy, delivery logistics with tube trailers or liquid tankers and scheduling against station consumption, safety systems including leak detection, ventilation and setback requirements with emergency response training, incentive program participation with carbon intensity certification and credit generation, station uptime reporting under funding agreements

domain_name: "hydrogen-fueling-ops"
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  state_machine_shape_secondary: [parallel, posture_driven, branching]
  relationship_patterns:
    - one_to_many
    - self_referential
    - polymorphic
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_level: expert_plus

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: FundingAgreement
    parent: null
    common_fields: true
    fields:
      - name: agreement_code
        type: string
        source: input
        description: "Unique funder-assigned agreement code"
        constraints: "required; unique across FundingAgreement"
      - name: funder_name
        type: string
        source: input
        description: "Name of the funding authority"
        constraints: "required"
      - name: min_uptime_pct
        type: number
        source: input
        description: "Contractual minimum station uptime percentage per reporting period"
        constraints: "required; 0 <= min_uptime_pct <= 100; 3 decimal places"
      - name: penalty_per_point_cents
        type: integer
        source: input
        description: "Cents assessed per whole percentage point of uptime shortfall"
        constraints: "required; >= 0"
      - name: initial_holdback_cents
        type: integer
        source: input
        description: "Holdback pool from which uptime penalties are deducted"
        constraints: "required; >= 0"
      - name: holdback_balance_cents
        type: integer
        source: computed
        description: "initial_holdback_cents minus SUM(UptimeReport.penalty_cents) over UptimeReport rows for this agreement whose status == FINAL; floored at 0. Reports whose status is DRAFT or AMENDED are excluded, so superseding a report reverses its penalty."
      - name: uptime_method
        type: enum
        source: input
        description: "Which uptime variant is contractually binding for penalty assessment"
        constraints: "required; one of NOZZLE_WEIGHTED, STATION_LEVEL"

  - name: Station
    parent: null
    common_fields: true
    fields:
      - name: funding_agreement_id
        type: string
        source: input
        description: "FK -> FundingAgreement.id; agreement whose uptime floor and holdback govern this station"
        constraints: "required; referenced FundingAgreement must exist"
      - name: code
        type: string
        source: input
        description: "Operator station code"
        constraints: "required; unique across Station"
      - name: name
        type: string
        source: input
        description: "Human-readable station name"
        constraints: "required"
      - name: nozzle_count
        type: integer
        source: input
        description: "Number of dispensing nozzles installed"
        constraints: "required; >= 1"
      - name: offload_bay_count
        type: integer
        source: input
        description: "Number of trailer/tanker offload bays available for concurrent delivery windows"
        constraints: "required; >= 1"
      - name: storage_capacity_kg
        type: number
        source: input
        description: "Maximum permitted on-site hydrogen inventory in kg"
        constraints: "required; > 0; 3 decimal places"
      - name: reserve_floor_kg
        type: number
        source: input
        description: "Supply-alert floor: projected_available_kg below this raises supply_alert"
        constraints: "required; >= 0; 3 decimal places"
      - name: max_pressure_class
        type: enum
        source: input
        description: "Highest dispensing pressure class the station equipment supports"
        constraints: "required; one of H35, H70"
      - name: setback_compliant
        type: boolean
        source: input
        description: "Whether the station currently satisfies its permitted setback distances"
        default: true
      - name: ventilation_status
        type: enum
        source: computed
        description: "Ventilation subsystem condition; set to FAULT when a VENTILATION_FAULT SafetyEvent is OPEN or ACKNOWLEDGED, NORMAL once all are CLEARED"
        default: "NORMAL"
        constraints: "one of NORMAL, FAULT"
      - name: leak_detection_status
        type: enum
        source: computed
        description: "Leak detection subsystem condition; set to ALARM when a LEAK_DETECTED SafetyEvent is OPEN or ACKNOWLEDGED, NORMAL once all are CLEARED"
        default: "NORMAL"
        constraints: "one of NORMAL, ALARM"
      - name: compressor_status
        type: enum
        source: computed
        description: "Compressor availability; set to OFFLINE when a COMPRESSOR_FAULT SafetyEvent is OPEN or ACKNOWLEDGED, ONLINE once all are CLEARED"
        default: "ONLINE"
        constraints: "one of ONLINE, OFFLINE"
      - name: safety_posture
        type: enum
        source: computed
        description: "Derived gate over all child operations; see calculations.station_safety_posture"
        constraints: "one of OPEN, RESTRICTED, FROZEN"
      - name: onsite_inventory_kg
        type: number
        source: computed
        description: "resulting_onsite_kg of the latest InventoryLedgerEntry for this station (ordered occurred_at ASC, then sequence_no ASC); 0.000 when the ledger is empty"
      - name: reserved_kg
        type: number
        source: computed
        description: "SUM(DispenseSession.planned_kg) for this station where fill_status IN {PRECOOLING, FUELING}"
      - name: available_kg
        type: number
        source: computed
        description: "onsite_inventory_kg - reserved_kg"
      - name: total_deliverable_kg
        type: number
        source: computed
        description: "SUM over this station's PressureVessel rows whose inspection_status IN {CURRENT, DUE} of MAX(0, (current_pressure_bar - min_residual_bar) * water_volume_l * KG_PER_L_PER_BAR)"
      - name: high_bank_deliverable_kg
        type: number
        source: computed
        description: "Same sum as total_deliverable_kg restricted to PressureVessel rows with bank_tier == HIGH"
      - name: inbound_planned_kg
        type: number
        source: computed
        description: "SUM(Delivery.planned_kg) for this station where status IN {SCHEDULED, ARRIVED}"
      - name: projected_available_kg
        type: number
        source: computed
        description: "available_kg + inbound_planned_kg"
      - name: supply_alert
        type: boolean
        source: computed
        description: "true when projected_available_kg < reserve_floor_kg, else false"
      - name: metered_kg_mtd
        type: number
        source: computed
        description: "SUM(DispenseSession.metered_kg) for this station where billing_status == METERED and started_at falls in the current logical-clock calendar month"
      - name: corrected_kg_mtd
        type: number
        source: computed
        description: "Sum of the per-session rounded DispenseSession.corrected_kg over the same input set as metered_kg_mtd; see calculations.metering_accuracy_rollup"
      - name: metering_error_pct_mtd
        type: number
        source: computed
        description: "Month-to-date metering error percentage; see calculations.metering_accuracy_rollup"
      - name: metering_accuracy_flag
        type: enum
        source: computed
        description: "WITHIN_TOLERANCE when ABS(metering_error_pct_mtd) <= METER_TOLERANCE_PCT, else OUT_OF_TOLERANCE"
        constraints: "one of WITHIN_TOLERANCE, OUT_OF_TOLERANCE"
      - name: credits_issued_total_mt
        type: number
        source: computed
        description: "SUM(IncentiveClaim.net_credits_mt) for this station where status == CREDITS_ISSUED"

  - name: PressureVessel
    parent: null
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: input
        description: "FK -> Station.id; station that owns this vessel"
        constraints: "required; referenced Station must exist"
      - name: bank_tier
        type: enum
        source: input
        description: "Cascade bank tier this vessel serves"
        constraints: "required; one of HIGH, MEDIUM, LOW"
      - name: water_volume_l
        type: number
        source: input
        description: "Vessel water volume in litres"
        constraints: "required; > 0; 3 decimal places"
      - name: mawp_bar
        type: number
        source: input
        description: "Maximum allowable working pressure in bar"
        constraints: "required; > 0; 2 decimal places"
      - name: min_residual_bar
        type: number
        source: input
        description: "Minimum residual pressure that must remain in the vessel after any draw"
        constraints: "required; >= 0; < mawp_bar; 2 decimal places"
      - name: initial_pressure_bar
        type: number
        source: input
        description: "Pressure at commissioning"
        constraints: "required; >= min_residual_bar; <= mawp_bar; 2 decimal places"
      - name: current_pressure_bar
        type: number
        source: computed
        description: "Current vessel pressure; initialised to initial_pressure_bar and adjusted by cascade draws, compressor makeup, offload receipts and inspection vents"
      - name: stored_mass_kg
        type: number
        source: computed
        description: "current_pressure_bar * water_volume_l * KG_PER_L_PER_BAR, rounded to 3 decimal places"
      - name: last_inspection_date
        type: string
        source: computed
        description: "Date (YYYY-MM-DD) of the most recent recorded inspection; null until the first inspection"
      - name: next_inspection_due_date
        type: string
        source: input
        description: "Date (YYYY-MM-DD) the next periodic inspection is due; recomputed on each inspection"
        constraints: "required; YYYY-MM-DD"
      - name: inspection_status
        type: enum
        source: computed
        description: "Derived from next_inspection_due_date against the logical clock date and from condemnation; see state_machines.PressureVessel"
        constraints: "one of CURRENT, DUE, OVERDUE, CONDEMNED"
      - name: inspection_count
        type: integer
        source: computed
        description: "Number of inspections recorded against this vessel"
        default: 0

  - name: ProductionAsset
    parent: null
    common_fields: true
    fields:
      - name: asset_code
        type: string
        source: input
        description: "Unique production asset code"
        constraints: "required; unique across ProductionAsset"
      - name: pathway
        type: enum
        source: input
        description: "Production pathway of this asset"
        constraints: "required; one of PEM_ELECTROLYSIS, ALKALINE_ELECTROLYSIS, SMR, SMR_CCS"
      - name: nameplate_kg_per_day
        type: number
        source: input
        description: "Nameplate hydrogen output in kg/day"
        constraints: "required; > 0; 3 decimal places"
      - name: ccs_capture_rate
        type: number
        source: input
        description: "Fraction of process CO2 captured; applies only to pathway SMR_CCS"
        default: 0
        constraints: "0 <= ccs_capture_rate <= 1; 4 decimal places; MUST be 0 unless pathway == SMR_CCS"
      - name: operator_org
        type: string
        source: input
        description: "Operating organisation name"
        constraints: "required"

  - name: PowerSupplyContract
    parent: null
    common_fields: true
    fields:
      - name: production_asset_id
        type: string
        source: input
        description: "FK -> ProductionAsset.id; asset this power contract supplies"
        constraints: "required; referenced ProductionAsset must exist"
      - name: contract_code
        type: string
        source: input
        description: "Unique power contract code"
        constraints: "required; unique across PowerSupplyContract"
      - name: grid_ci_gco2e_per_mwh
        type: number
        source: input
        description: "Grid carbon intensity of the non-renewable balance in gCO2e/MWh"
        constraints: "required; >= 0; 2 decimal places"
      - name: annual_renewable_pct
        type: number
        source: input
        description: "Annual-average renewable share of supplied electricity, as a percentage"
        constraints: "required; 0 <= annual_renewable_pct <= 100; 3 decimal places"
      - name: hourly_matched_renewable_pct
        type: number
        source: input
        description: "Hour-by-hour matched renewable share of supplied electricity, as a percentage"
        constraints: "required; 0 <= hourly_matched_renewable_pct <= 100; 3 decimal places"
      - name: hourly_matching_enabled
        type: boolean
        source: input
        description: "When true, lots produced under this contract use the HOURLY_MATCHED carbon-intensity variant"
        default: false
      - name: effective_from
        type: datetime
        source: input
        description: "Inclusive start of the contract's effective interval"
        constraints: "required; ISO 8601 UTC"
      - name: effective_to
        type: datetime
        source: input
        description: "Exclusive end of the contract's effective interval"
        constraints: "required; ISO 8601 UTC; > effective_from"

  - name: ProductionLot
    parent: null
    common_fields: true
    fields:
      - name: production_asset_id
        type: string
        source: input
        description: "FK -> ProductionAsset.id; asset that produced this lot"
        constraints: "required; referenced ProductionAsset must exist"
      - name: predecessor_lot_id
        type: string
        source: input
        description: "FK -> ProductionLot.id; self-referential link to the lot whose carryover_kg was blended into this lot; null when there is none"
        default: null
        constraints: "optional; referenced ProductionLot must exist and belong to the same production_asset_id"
      - name: lot_code
        type: string
        source: input
        description: "Unique lot code"
        constraints: "required; unique across ProductionLot"
      - name: mass_kg
        type: number
        source: input
        description: "Hydrogen mass produced in this lot, in kg"
        constraints: "required; > 0; 3 decimal places"
      - name: energy_consumed_kwh
        type: number
        source: input
        description: "Electricity consumed producing this lot, in kWh"
        constraints: "required; >= 0; 3 decimal places"
      - name: feedstock_consumed_mmbtu
        type: number
        source: input
        description: "Natural-gas feedstock consumed producing this lot, in MMBtu"
        default: 0
        constraints: ">= 0; 3 decimal places; MUST be 0 for electrolysis pathways"
      - name: carryover_kg
        type: number
        source: input
        description: "Mass carried over from the predecessor lot and included in mass_kg"
        default: 0
        constraints: ">= 0; 3 decimal places; MUST be 0 when predecessor_lot_id is null; MUST be <= mass_kg"
      - name: production_start_at
        type: datetime
        source: input
        description: "Inclusive start of the production window"
        constraints: "required; ISO 8601 UTC"
      - name: production_end_at
        type: datetime
        source: input
        description: "Exclusive end of the production window; also the instant used to select the governing PowerSupplyContract"
        constraints: "required; ISO 8601 UTC; > production_start_at"
      - name: selected_power_contract_id
        type: string
        source: computed
        description: "Id of the PowerSupplyContract selected by calculations.production_lot_carbon_intensity's selector; identity reference only, never a request input"
      - name: ci_provisional_gco2e_per_mj
        type: number
        source: computed
        description: "Provisional carbon intensity stamped at lot creation using the ANNUAL_AVERAGE variant"
      - name: ci_certified_gco2e_per_mj
        type: number
        source: computed
        description: "Certified carbon intensity stamped at POST /production-lots/{id}/certify-ci using the variant selected by ci_variant_applied; null until certification"
      - name: ci_variant_applied
        type: enum
        source: computed
        description: "Which carbon-intensity variant produced ci_certified_gco2e_per_mj"
        constraints: "one of ANNUAL_AVERAGE, HOURLY_MATCHED"
      - name: qa_status
        type: enum
        source: computed
        description: "Quality-assurance verdict branch; PENDING until a purity test exists, then PASSED or FAILED from the latest PurityTest"
        default: "PENDING"
        constraints: "one of PENDING, PASSED, FAILED"
      - name: ci_status
        type: enum
        source: computed
        description: "Carbon-intensity certification branch"
        default: "PENDING"
        constraints: "one of PENDING, CERTIFIED"
      - name: status
        type: enum
        source: computed
        description: "Lot lifecycle; see state_machines.ProductionLot"
        default: "PRODUCED"
        constraints: "one of PRODUCED, RELEASED, REJECTED, CONSUMED"
      - name: released_by_user_id
        type: string
        source: system
        description: "X-User-ID of the QualityAnalyst or ComplianceAdmin who released the lot; null until release"
      - name: accepted_delivered_kg
        type: number
        source: computed
        description: "SUM(Delivery.net_receipt_kg) for this lot where Delivery.status == ACCEPTED"

  - name: PurityTest
    parent: null
    common_fields: false
    fields:
      - name: production_lot_id
        type: string
        source: input
        description: "FK -> ProductionLot.id; lot the sample was drawn from"
        constraints: "required; referenced ProductionLot must exist"
      - name: performed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the QualityAnalyst who performed the test; compared against released_by_user_id for segregation of duties"
      - name: sampled_at
        type: datetime
        source: input
        description: "Instant the sample was drawn; primary selector key for the latest test on a lot"
        constraints: "required; ISO 8601 UTC"
      - name: total_hydrocarbons_ppm
        type: number
        source: input
        description: "Total hydrocarbons, C1 basis, in ppm"
        constraints: "required; >= 0; 3 decimal places"
      - name: water_ppm
        type: number
        source: input
        description: "Water content in ppm"
        constraints: "required; >= 0; 3 decimal places"
      - name: oxygen_ppm
        type: number
        source: input
        description: "Oxygen content in ppm"
        constraints: "required; >= 0; 3 decimal places"
      - name: nitrogen_ppm
        type: number
        source: input
        description: "Nitrogen content in ppm"
        constraints: "required; >= 0; 3 decimal places"
      - name: carbon_monoxide_ppm
        type: number
        source: input
        description: "Carbon monoxide content in ppm"
        constraints: "required; >= 0; 3 decimal places"
      - name: carbon_dioxide_ppm
        type: number
        source: input
        description: "Carbon dioxide content in ppm"
        constraints: "required; >= 0; 3 decimal places"
      - name: total_sulfur_ppm
        type: number
        source: input
        description: "Total sulfur compounds in ppm"
        constraints: "required; >= 0; 3 decimal places"
      - name: ammonia_ppm
        type: number
        source: input
        description: "Ammonia content in ppm; omitted when the analyte was not measured"
        default: null
        constraints: "optional; >= 0; 3 decimal places"
      - name: helium_ppm
        type: number
        source: input
        description: "Helium content in ppm; omitted when the analyte was not measured"
        default: null
        constraints: "optional; >= 0; 3 decimal places"
      - name: verdict
        type: enum
        source: computed
        description: "Fuel-cell-grade verdict; see calculations.purity_verdict"
        constraints: "one of PASS, FAIL, INDETERMINATE"
      - name: failing_analytes
        type: array
        source: computed
        description: "Analyte field names whose measured value exceeds its limit, ordered by the fixed analyte order declared in calculations.purity_verdict"
      - name: purity_margin_pct
        type: number
        source: computed
        description: "Tightest remaining headroom across measured analytes; see calculations.purity_verdict"

  - name: InventoryLedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: station_id
        type: string
        source: input
        description: "FK -> Station.id; station whose on-site inventory this entry moves"
        constraints: "required; referenced Station must exist"
      - name: sequence_no
        type: integer
        source: system
        description: "Monotonic per-station append index starting at 1; secondary ordering key after occurred_at"
      - name: reason
        type: enum
        source: system
        description: "Why the entry was appended"
        constraints: "one of OPENING_BALANCE, DELIVERY_RECEIPT, HEEL_RETURNED, BOILOFF_LOSS, DISPENSE_DRAW, METER_CORRECTION, METER_VOID_REVERSAL, INSPECTION_VENT"
      - name: delta_kg
        type: number
        source: system
        description: "Signed mass change in kg, 3 decimal places"
      - name: resulting_onsite_kg
        type: number
        source: system
        description: "Running on-site inventory after applying delta_kg, 3 decimal places"
      - name: source_ref_type
        type: enum
        source: system
        description: "Which entity type source_ref_id points at; polymorphic reference, deliberately not a declared foreign key"
        constraints: "one of PRESSURE_VESSEL, DELIVERY, DISPENSE_SESSION"
      - name: source_ref_id
        type: string
        source: system
        description: "Id of the entity named by source_ref_type; null for OPENING_BALANCE"
      - name: occurred_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the movement was recorded; primary ordering key"

  - name: Delivery
    parent: null
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: input
        description: "FK -> Station.id; receiving station"
        constraints: "required; referenced Station must exist"
      - name: production_lot_id
        type: string
        source: input
        description: "FK -> ProductionLot.id; lot being delivered"
        constraints: "required; referenced ProductionLot must exist"
      - name: receiving_vessel_id
        type: string
        source: input
        description: "FK -> PressureVessel.id; vessel the offload is routed into"
        constraints: "required; referenced PressureVessel must exist and belong to station_id"
      - name: mode
        type: enum
        source: input
        description: "Transport mode, which selects the net-receipt loss variant"
        constraints: "required; one of TUBE_TRAILER, LIQUID_TANKER"
      - name: planned_kg
        type: number
        source: input
        description: "Gross mass loaded for delivery in kg"
        constraints: "required; > 0; 3 decimal places"
      - name: window_start
        type: datetime
        source: input
        description: "Inclusive start of the booked offload-bay window"
        constraints: "required; ISO 8601 UTC"
      - name: window_end
        type: datetime
        source: input
        description: "Exclusive end of the booked offload-bay window"
        constraints: "required; ISO 8601 UTC; > window_start"
      - name: trailer_water_volume_l
        type: number
        source: input
        description: "Tube-trailer aggregate water volume in litres; required when mode == TUBE_TRAILER, MUST be omitted otherwise"
        default: null
        constraints: "optional; > 0; 3 decimal places"
      - name: trailer_final_pressure_bar
        type: number
        source: input
        description: "Tube-trailer residual pressure after offload in bar; required when mode == TUBE_TRAILER, MUST be omitted otherwise"
        default: null
        constraints: "optional; >= 0; 2 decimal places"
      - name: departed_at
        type: datetime
        source: input
        description: "Instant the load departed the production site; used with arrived_at for transit_hours"
        constraints: "required; ISO 8601 UTC; <= window_start"
      - name: arrived_at
        type: datetime
        source: system
        description: "Logical-clock instant recorded by POST /deliveries/{id}/arrive"
      - name: accepted_at
        type: datetime
        source: system
        description: "Logical-clock instant recorded by POST /deliveries/{id}/offload"
      - name: transit_hours
        type: number
        source: computed
        description: "(arrived_at - departed_at) in hours, 3 decimal places; null until arrival"
      - name: boiloff_kg
        type: number
        source: computed
        description: "Liquid-tanker boil-off loss; see calculations.delivery_net_receipt"
      - name: heel_kg
        type: number
        source: computed
        description: "Tube-trailer undeliverable heel remaining in the tubes; see calculations.delivery_net_receipt"
      - name: net_receipt_kg
        type: number
        source: computed
        description: "Mass actually credited to station inventory at offload; see calculations.delivery_net_receipt"
      - name: status
        type: enum
        source: computed
        description: "Delivery lifecycle; see state_machines.Delivery"
        default: "SCHEDULED"
        constraints: "one of SCHEDULED, ARRIVED, ACCEPTED, REJECTED, QUARANTINED"
      - name: reject_reason
        type: enum
        source: input
        description: "Why the load was refused; null unless status IN {REJECTED, QUARANTINED}"
        constraints: "required at POST /deliveries/{id}/reject, null otherwise; one of PURITY_FAIL, LOT_NOT_RELEASED, DOCUMENTATION, SEAL_BROKEN"
      - name: reschedule_count
        type: integer
        source: computed
        description: "Number of times this delivery has been rescheduled after a rejection"
        default: 0

  - name: DispenseSession
    parent: null
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: input
        description: "FK -> Station.id; dispensing station"
        constraints: "required; referenced Station must exist"
      - name: vehicle_class
        type: enum
        source: input
        description: "Vehicle category being fuelled"
        constraints: "required; one of LIGHT_DUTY, TRANSIT_BUS, HEAVY_TRUCK, FORKLIFT"
      - name: target_pressure_class
        type: enum
        source: input
        description: "Requested nominal working pressure class for this fill"
        constraints: "required; one of H35, H70"
      - name: fill_protocol
        type: enum
        source: input
        description: "Fill-protocol family governing precool requirements"
        constraints: "required; one of SAE_J2601_TABLE, MC_FORMULA"
      - name: planned_kg
        type: number
        source: input
        description: "Mass the session reserves against station inventory"
        constraints: "required; > 0; 3 decimal places"
      - name: ambient_temp_c
        type: number
        source: input
        description: "Ambient temperature at fill start in degrees Celsius"
        constraints: "required; -40 <= ambient_temp_c <= 55; 1 decimal place"
      - name: required_precool_c
        type: number
        source: computed
        description: "Precool temperature ceiling demanded by fill_protocol, target_pressure_class and ambient_temp_c; see calculations.required_precool_temperature"
      - name: precool_temp_achieved_c
        type: number
        source: input
        description: "Actual dispenser precool temperature reported at POST /dispense-sessions/{id}/fuel"
        constraints: "required at fuel; -40 <= precool_temp_achieved_c <= 25; 1 decimal place"
      - name: metered_kg
        type: number
        source: input
        description: "Mass indicated by the dispenser meter, reported at POST /dispense-sessions/{id}/complete"
        constraints: "required at complete; > 0; 3 decimal places; <= planned_kg"
      - name: avg_dispense_pressure_bar
        type: number
        source: input
        description: "Average dispensing pressure over the fill in bar, reported at complete"
        constraints: "required at complete; > 0; 2 decimal places"
      - name: final_pressure_bar
        type: number
        source: input
        description: "Vehicle tank pressure at end of fill in bar, reported at complete"
        constraints: "required at complete; > 0; 2 decimal places"
      - name: density_correction_factor
        type: number
        source: computed
        description: "Temperature/pressure density correction applied to metered_kg; see calculations.dispense_metered_mass_correction"
      - name: corrected_kg
        type: number
        source: computed
        description: "metered_kg * density_correction_factor rounded to 3 decimal places"
      - name: metering_error_pct
        type: number
        source: computed
        description: "Per-session metering error percentage; see calculations.dispense_metered_mass_correction"
      - name: metering_within_tolerance
        type: boolean
        source: computed
        description: "true when ABS(metering_error_pct) <= METER_TOLERANCE_PCT"
      - name: direct_cascade_kg
        type: number
        source: computed
        description: "Portion of planned_kg served by gravity cascade from the vessel banks; see calculations.cascade_fill_allocation"
      - name: compressor_makeup_kg
        type: number
        source: computed
        description: "Portion of planned_kg that the compressor must make up; see calculations.cascade_fill_allocation"
      - name: cascade_plan
        type: array
        source: computed
        description: "Ordered allocation records [{bank_tier, vessel_id, kg, pressure_after_bar}] produced by calculations.cascade_fill_allocation"
      - name: fill_status
        type: enum
        source: computed
        description: "Physical fill dimension; evolves independently of billing_status"
        default: "PRECOOLING"
        constraints: "one of PRECOOLING, FUELING, COMPLETED, ABORTED"
      - name: billing_status
        type: enum
        source: computed
        description: "Settlement dimension; evolves independently of fill_status"
        default: "PENDING"
        constraints: "one of PENDING, METERED, VOIDED"
      - name: abort_reason
        type: enum
        source: system
        description: "Why the fill was abandoned; null unless fill_status == ABORTED"
        constraints: "one of OPERATOR_ABORT, STATION_FROZEN"
      - name: void_reason
        type: enum
        source: input
        description: "Why a metered settlement was reversed; supplied at POST /dispense-sessions/{id}/void-meter and null otherwise"
        constraints: "required at void-meter; one of METER_FAULT, BILLING_DISPUTE, AUDIT_ADJUSTMENT"
      - name: started_at
        type: datetime
        source: system
        description: "Logical-clock instant the session was created; determines the month-to-date rollup bucket"

  - name: SafetyEvent
    parent: null
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: input
        description: "FK -> Station.id; station where the condition was detected"
        constraints: "required; referenced Station must exist"
      - name: kind
        type: enum
        source: input
        description: "Which safety subsystem raised the condition"
        constraints: "required; one of LEAK_DETECTED, VENTILATION_FAULT, COMPRESSOR_FAULT, OVERPRESSURE, SETBACK_BREACH"
      - name: severity
        type: enum
        source: input
        description: "Severity band, which decides posture impact and uptime downtime accrual"
        constraints: "required; one of MINOR, MAJOR, CRITICAL"
      - name: affected_nozzle_count
        type: integer
        source: input
        description: "Number of nozzles taken out of service by this condition; drives nozzle-weighted downtime"
        constraints: "required; >= 0; <= Station.nozzle_count"
      - name: detected_by
        type: enum
        source: input
        description: "Detection channel"
        constraints: "required; one of SENSOR, OPERATOR_ROUND, THIRD_PARTY"
      - name: opened_by_user_id
        type: string
        source: system
        description: "X-User-ID of the actor who opened the event"
      - name: cleared_by_user_id
        type: string
        source: system
        description: "X-User-ID of the actor who cleared the event; MUST differ from opened_by_user_id"
      - name: opened_at
        type: datetime
        source: system
        description: "Logical-clock instant the event was opened; inclusive start of the downtime interval"
      - name: acknowledged_at
        type: datetime
        source: system
        description: "Logical-clock instant of acknowledgement"
      - name: cleared_at
        type: datetime
        source: system
        description: "Logical-clock instant the event was cleared; exclusive end of the downtime interval"
      - name: status
        type: enum
        source: computed
        description: "Event lifecycle; see state_machines.SafetyEvent"
        default: "OPEN"
        constraints: "one of OPEN, ACKNOWLEDGED, CLEARED"
      - name: corrective_action
        type: string
        source: input
        description: "Narrative of the corrective action, supplied at clear"
        constraints: "required at clear; non-empty"

  - name: ResponderCertification
    parent: null
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: input
        description: "FK -> Station.id; station this responder is certified for"
        constraints: "required; referenced Station must exist"
      - name: responder_ref
        type: string
        source: input
        description: "Operator-assigned responder reference"
        constraints: "required"
      - name: cert_type
        type: enum
        source: input
        description: "Certification programme completed"
        constraints: "required; one of EMERGENCY_RESPONSE, HAZMAT_AWARENESS, CONFINED_SPACE"
      - name: valid_from
        type: string
        source: input
        description: "Inclusive first date (YYYY-MM-DD) the certification is valid"
        constraints: "required; YYYY-MM-DD"
      - name: expires_on
        type: string
        source: input
        description: "Inclusive last date (YYYY-MM-DD) the certification is valid"
        constraints: "required; YYYY-MM-DD; >= valid_from"
      - name: is_current
        type: boolean
        source: computed
        description: "true when valid_from <= logical-clock date <= expires_on, else false"

  - name: IncentiveClaim
    parent: null
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: input
        description: "FK -> Station.id; station whose dispensed volume is claimed"
        constraints: "required; referenced Station must exist"
      - name: program
        type: enum
        source: input
        description: "Low-carbon-fuel programme the claim is filed under"
        constraints: "required; one of LCFS, CFP_OREGON, CFS_CANADA"
      - name: period_start
        type: string
        source: input
        description: "Inclusive first date (YYYY-MM-DD) of the claim period"
        constraints: "required; YYYY-MM-DD"
      - name: period_end
        type: string
        source: input
        description: "Inclusive last date (YYYY-MM-DD) of the claim period"
        constraints: "required; YYYY-MM-DD; >= period_start"
      - name: production_lot_ids
        type: array
        source: input
        description: "Client-declared list of ProductionLot ids whose certified carbon intensity backs this claim; each element must reference an existing ProductionLot"
        constraints: "required; non-empty array of ProductionLot ids"
      - name: dispensed_kg
        type: number
        source: computed
        description: "SUM(DispenseSession.corrected_kg) for station_id where billing_status == METERED and DATE(started_at) BETWEEN period_start AND period_end inclusive"
      - name: energy_mj
        type: number
        source: computed
        description: "dispensed_kg * H2_LHV_MJ_PER_KG, rounded to 3 decimal places"
      - name: pathway_ci_gco2e_per_mj
        type: number
        source: computed
        description: "Mass-weighted mean of ProductionLot.ci_certified_gco2e_per_mj over production_lot_ids, weighted by ProductionLot.accepted_delivered_kg; see calculations.incentive_credit_netting"
      - name: gross_credits_mt
        type: number
        source: computed
        description: "Gross credits in metric tonnes CO2e; see calculations.incentive_credit_netting"
      - name: admin_fee_rate
        type: number
        source: computed
        description: "Administrative fee rate selected from the tier table keyed on gross_credits_mt"
      - name: admin_fee_mt
        type: number
        source: computed
        description: "gross_credits_mt * admin_fee_rate, rounded to 3 decimal places"
      - name: net_credits_mt
        type: number
        source: computed
        description: "gross_credits_mt - admin_fee_mt, rounded to 3 decimal places"
      - name: revision_round
        type: integer
        source: computed
        description: "Number of completed revision loops; incremented on each POST /incentive-claims/{id}/request-revision"
        default: 0
      - name: submitted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceAdmin who submitted the claim"
      - name: certified_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ProgramAuditor who certified the claim; MUST differ from submitted_by_user_id"
      - name: revision_note
        type: string
        source: input
        description: "Auditor's note describing the requested revision, supplied at request-revision"
        constraints: "required at request-revision; non-empty"
      - name: status
        type: enum
        source: computed
        description: "Claim lifecycle; see state_machines.IncentiveClaim"
        default: "SUBMITTED"
        constraints: "one of SUBMITTED, REVISION_REQUESTED, CERTIFIED, CREDITS_ISSUED, DENIED"

  - name: UptimeReport
    parent: null
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: input
        description: "FK -> Station.id; station being reported on"
        constraints: "required; referenced Station must exist"
      - name: funding_agreement_id
        type: string
        source: input
        description: "FK -> FundingAgreement.id; agreement the report is filed under; MUST equal Station.funding_agreement_id"
        constraints: "required; referenced FundingAgreement must exist"
      - name: amended_from_report_id
        type: string
        source: input
        description: "FK -> UptimeReport.id; self-referential link to the report this one supersedes; null for an original report"
        default: null
        constraints: "optional; referenced UptimeReport must exist, share station_id, and have status == FINAL"
      - name: period_start
        type: datetime
        source: input
        description: "Inclusive start of the reporting period"
        constraints: "required; ISO 8601 UTC"
      - name: period_end
        type: datetime
        source: input
        description: "Exclusive end of the reporting period"
        constraints: "required; ISO 8601 UTC; > period_start"
      - name: nozzle_count_snapshot
        type: integer
        source: computed
        description: "Station.nozzle_count captured at report creation; denominator of the nozzle-weighted variant"
      - name: downtime_nozzle_minutes
        type: number
        source: computed
        description: "Nozzle-minutes lost inside the period; see calculations.station_uptime_pct"
      - name: full_outage_minutes
        type: number
        source: computed
        description: "Minutes inside the period during which the station was wholly out of service; see calculations.station_uptime_pct"
      - name: uptime_pct_nozzle_weighted
        type: number
        source: computed
        description: "Nozzle-weighted uptime variant result, 3 decimal places"
      - name: uptime_pct_station_level
        type: number
        source: computed
        description: "Station-level uptime variant result, 3 decimal places"
      - name: uptime_pct
        type: number
        source: computed
        description: "Whichever of the two variants FundingAgreement.uptime_method selects; the contractually binding figure"
      - name: shortfall_points
        type: number
        source: computed
        description: "MAX(0, FundingAgreement.min_uptime_pct - uptime_pct), 3 decimal places"
      - name: penalty_cents
        type: integer
        source: computed
        description: "Penalty assessed at finalisation; see calculations.funding_penalty; 0 while status == DRAFT"
      - name: status
        type: enum
        source: computed
        description: "Report lifecycle; see state_machines.UptimeReport"
        default: "DRAFT"
        constraints: "one of DRAFT, FINAL, AMENDED"
      - name: amend_reason
        type: string
        source: input
        description: "Reason the superseded report is being amended, supplied at amend"
        constraints: "required at amend; non-empty"

state_machines:
  - entity: Station
    initial_state: OPEN
    terminal_states: []
    note: "Posture is a derived field on Station (`safety_posture`) recomputed after every mutation that touches its inputs; see calculations.station_safety_posture. Shape is cyclic and posture-driven."
    transitions:
      - from: OPEN
        to: FROZEN
        trigger: "POST /safety-events (kind IN {LEAK_DETECTED, VENTILATION_FAULT, SETBACK_BREACH} OR severity == CRITICAL) — system recompute"
        actor: system
        preconditions:
          - "Station.safety_posture == OPEN before the event is appended"
          - "New SafetyEvent.status == OPEN"
        side_effects:
          - "Cascade hop 1: SafetyEvent row created with status OPEN, opened_at = logical clock"
          - "Cascade hop 1: Station.leak_detection_status = ALARM when kind == LEAK_DETECTED; Station.ventilation_status = FAULT when kind == VENTILATION_FAULT; Station.setback_compliant = false when kind == SETBACK_BREACH"
          - "Cascade hop 2: because that subsystem field changed, Station.safety_posture is recomputed to FROZEN"
          - "Cascade hop 3: because safety_posture became FROZEN, every DispenseSession of this station with fill_status IN {PRECOOLING, FUELING} transitions fill_status -> ABORTED with abort_reason = STATION_FROZEN"
          - "Cascade hop 4: because those sessions left {PRECOOLING, FUELING}, each one's billing_status PENDING -> VOIDED, and Station.reserved_kg / available_kg / projected_available_kg / supply_alert are recomputed"
          - "increments Station.version by 1"
      - from: OPEN
        to: RESTRICTED
        trigger: "POST /safety-events (kind == COMPRESSOR_FAULT AND severity == MAJOR) — system recompute"
        actor: system
        preconditions:
          - "Station.safety_posture == OPEN before the event is appended"
        side_effects:
          - "Station.compressor_status = OFFLINE"
          - "Station.safety_posture recomputed to RESTRICTED"
          - "in-flight DispenseSession rows are NOT aborted (RESTRICTED only gates new H70 sessions and new compressor makeup)"
          - "increments Station.version by 1"
      - from: OPEN
        to: RESTRICTED
        trigger: "POST /dispense-sessions/{id}/complete whose cascade draw leaves high_bank_deliverable_kg < MIN_HIGH_BANK_DELIVERABLE_KG"
        actor: system
        preconditions:
          - "Station.safety_posture == OPEN before the draw"
          - "high_bank_deliverable_kg >= MIN_HIGH_BANK_DELIVERABLE_KG before the draw"
        side_effects:
          - "PressureVessel.current_pressure_bar decremented per cascade_plan"
          - "Station.high_bank_deliverable_kg recomputed and falls below MIN_HIGH_BANK_DELIVERABLE_KG"
          - "Station.safety_posture recomputed to RESTRICTED"
          - "increments Station.version by 1"
      - from: OPEN
        to: RESTRICTED
        trigger: "POST /_clock/set_current_utc advancing the logical date past PressureVessel.next_inspection_due_date + INSPECTION_GRACE_DAYS"
        actor: system
        preconditions:
          - "Station has at least one PressureVessel whose inspection_status transitions to OVERDUE at the new clock position"
        side_effects:
          - "PressureVessel.inspection_status recomputed to OVERDUE"
          - "that vessel drops out of total_deliverable_kg / high_bank_deliverable_kg input sets"
          - "Station.safety_posture recomputed to RESTRICTED"
          - "increments Station.version by 1"
      - from: RESTRICTED
        to: FROZEN
        trigger: "POST /safety-events (kind IN {LEAK_DETECTED, VENTILATION_FAULT, SETBACK_BREACH} OR severity == CRITICAL) — system recompute"
        actor: system
        preconditions:
          - "Station.safety_posture == RESTRICTED before the event is appended"
        side_effects:
          - "same cascade as OPEN -> FROZEN: subsystem field set, posture recomputed to FROZEN, in-flight sessions ABORTED then VOIDED, reserved_kg recomputed"
          - "increments Station.version by 1"
      - from: FROZEN
        to: RESTRICTED
        trigger: "POST /safety-events/{id}/clear on the last freezing event while a MAJOR COMPRESSOR_FAULT event remains OPEN or ACKNOWLEDGED — system recompute"
        actor: system
        preconditions:
          - "No SafetyEvent of kind IN {LEAK_DETECTED, VENTILATION_FAULT, SETBACK_BREACH} and no severity == CRITICAL event remains with status IN {OPEN, ACKNOWLEDGED}"
          - "At least one restricting condition still holds per calculations.station_safety_posture"
        side_effects:
          - "cleared SafetyEvent.status -> CLEARED, cleared_at = logical clock, cleared_by_user_id recorded"
          - "the corresponding subsystem field returns to its NORMAL value"
          - "Station.safety_posture recomputed to RESTRICTED"
          - "increments Station.version by 1"
      - from: RESTRICTED
        to: OPEN
        trigger: "POST /safety-events/{id}/clear, POST /pressure-vessels/{id}/inspections, or an offload that restores high_bank_deliverable_kg — system recompute"
        actor: system
        preconditions:
          - "No restricting or freezing condition remains per calculations.station_safety_posture"
        side_effects:
          - "Station.safety_posture recomputed to OPEN"
          - "increments Station.version by 1"
      - from: FROZEN
        to: OPEN
        trigger: "POST /safety-events/{id}/clear on the last outstanding event — system recompute"
        actor: system
        preconditions:
          - "No SafetyEvent for this station remains with status IN {OPEN, ACKNOWLEDGED}"
          - "No restricting condition remains per calculations.station_safety_posture"
        side_effects:
          - "Station.safety_posture recomputed to OPEN"
          - "increments Station.version by 1"

  - entity: PressureVessel
    initial_state: CURRENT
    terminal_states: [CONDEMNED]
    note: "Cyclic: CURRENT -> DUE -> CURRENT via inspection, with an OVERDUE lobe and a CONDEMNED sink."
    transitions:
      - from: CURRENT
        to: DUE
        trigger: "POST /_clock/set_current_utc reaching or passing next_inspection_due_date"
        actor: system
        preconditions:
          - "logical-clock date >= next_inspection_due_date"
          - "logical-clock date <= next_inspection_due_date + INSPECTION_GRACE_DAYS"
        side_effects:
          - "PressureVessel.inspection_status = DUE"
          - "vessel remains inside total_deliverable_kg input set (DUE still deliverable)"
      - from: DUE
        to: OVERDUE
        trigger: "POST /_clock/set_current_utc passing next_inspection_due_date + INSPECTION_GRACE_DAYS"
        actor: system
        preconditions:
          - "logical-clock date > next_inspection_due_date + INSPECTION_GRACE_DAYS"
        side_effects:
          - "PressureVessel.inspection_status = OVERDUE"
          - "vessel leaves total_deliverable_kg and high_bank_deliverable_kg input sets"
          - "Station.safety_posture recomputed (OVERDUE is a restricting condition)"
      - from: DUE
        to: CURRENT
        trigger: "POST /pressure-vessels/{id}/inspections with outcome == PASS"
        actor: SafetyOfficer
        preconditions:
          - "inspection_status IN {DUE, OVERDUE}"
          - "Station.safety_posture != FROZEN"
        side_effects:
          - "PressureVessel.last_inspection_date = logical-clock date"
          - "PressureVessel.next_inspection_due_date = supplied next_due_date"
          - "PressureVessel.inspection_count incremented by 1"
          - "PressureVessel.inspection_status = CURRENT"
          - "Station.safety_posture recomputed"
      - from: OVERDUE
        to: CURRENT
        trigger: "POST /pressure-vessels/{id}/inspections with outcome == PASS"
        actor: SafetyOfficer
        preconditions:
          - "inspection_status == OVERDUE"
          - "Station.safety_posture != FROZEN"
        side_effects:
          - "same as DUE -> CURRENT"
          - "vessel re-enters total_deliverable_kg / high_bank_deliverable_kg input sets"
          - "Station.safety_posture recomputed, dropping the OVERDUE restriction"
      - from: DUE
        to: CONDEMNED
        trigger: "POST /pressure-vessels/{id}/inspections with outcome == CONDEMN"
        actor: SafetyOfficer
        preconditions:
          - "inspection_status IN {DUE, OVERDUE}"
        side_effects:
          - "PressureVessel.inspection_status = CONDEMNED (terminal)"
          - "an InventoryLedgerEntry with reason INSPECTION_VENT and delta_kg = -stored_mass_kg is appended; PressureVessel.current_pressure_bar = 0.00"
          - "Station.onsite_inventory_kg / total_deliverable_kg / high_bank_deliverable_kg / safety_posture recomputed"
      - from: OVERDUE
        to: CONDEMNED
        trigger: "POST /pressure-vessels/{id}/inspections with outcome == CONDEMN"
        actor: SafetyOfficer
        preconditions:
          - "inspection_status == OVERDUE"
        side_effects:
          - "same as DUE -> CONDEMNED"

  - entity: ProductionLot
    initial_state: PRODUCED
    terminal_states: [REJECTED, CONSUMED]
    note: "Branching fork-join: the qa_status branch (purity testing) and the ci_status branch (carbon-intensity certification) advance independently; the join is the RELEASED transition, which requires both branches complete."
    transitions:
      - from: PRODUCED
        to: PRODUCED
        trigger: "POST /production-lots/{id}/purity-tests with verdict PASS or INDETERMINATE (qa branch)"
        actor: QualityAnalyst
        preconditions:
          - "ProductionLot.status == PRODUCED"
          - "PurityTest.sampled_at >= ProductionLot.production_end_at"
        side_effects:
          - "PurityTest row created with computed verdict, failing_analytes, purity_margin_pct"
          - "ProductionLot.qa_status = PASSED when verdict == PASS; stays PENDING when verdict == INDETERMINATE"
          - "ProductionLot.status unchanged (branch progress only)"
      - from: PRODUCED
        to: PRODUCED
        trigger: "POST /production-lots/{id}/certify-ci (ci branch)"
        actor: ComplianceAdmin
        preconditions:
          - "ProductionLot.status == PRODUCED"
          - "ProductionLot.ci_status == PENDING"
          - "ProductionLot.selected_power_contract_id is not null"
        side_effects:
          - "ProductionLot.ci_variant_applied set from the selected PowerSupplyContract.hourly_matching_enabled"
          - "ProductionLot.ci_certified_gco2e_per_mj computed per calculations.production_lot_carbon_intensity"
          - "ProductionLot.ci_status = CERTIFIED"
          - "ProductionLot.status unchanged (branch progress only)"
      - from: PRODUCED
        to: RELEASED
        trigger: "POST /production-lots/{id}/release (join)"
        actor: QualityAnalyst
        preconditions:
          - "ProductionLot.status == PRODUCED"
          - "ProductionLot.qa_status == PASSED"
          - "ProductionLot.ci_status == CERTIFIED"
          - "X-User-ID differs from performed_by_user_id of every PurityTest on this lot (segregation of duties)"
        side_effects:
          - "ProductionLot.status = RELEASED"
          - "ProductionLot.released_by_user_id = X-User-ID"
      - from: PRODUCED
        to: REJECTED
        trigger: "POST /production-lots/{id}/purity-tests with verdict == FAIL"
        actor: QualityAnalyst
        preconditions:
          - "ProductionLot.status == PRODUCED"
        side_effects:
          - "PurityTest row created with verdict FAIL and non-empty failing_analytes"
          - "ProductionLot.qa_status = FAILED"
          - "ProductionLot.status = REJECTED (terminal)"
      - from: RELEASED
        to: CONSUMED
        trigger: "POST /deliveries/{id}/offload that lifts accepted_delivered_kg to or above mass_kg * LOT_CONSUMED_FRACTION"
        actor: system
        preconditions:
          - "ProductionLot.status == RELEASED"
          - "accepted_delivered_kg >= mass_kg * LOT_CONSUMED_FRACTION after the offload"
        side_effects:
          - "ProductionLot.accepted_delivered_kg recomputed"
          - "ProductionLot.status = CONSUMED (terminal); no further Delivery may reference this lot"

  - entity: Delivery
    initial_state: SCHEDULED
    terminal_states: [ACCEPTED, QUARANTINED]
    note: "Cyclic: REJECTED -> SCHEDULED reschedule loop, bounded by MAX_RESCHEDULES."
    transitions:
      - from: SCHEDULED
        to: ARRIVED
        trigger: "POST /deliveries/{id}/arrive"
        actor: LogisticsDispatcher
        preconditions:
          - "Delivery.status == SCHEDULED"
          - "logical-clock instant is within [window_start, window_end)"
        side_effects:
          - "Delivery.arrived_at = logical clock"
          - "Delivery.transit_hours computed from departed_at and arrived_at"
          - "Delivery.boiloff_kg / heel_kg / net_receipt_kg computed per calculations.delivery_net_receipt"
          - "Delivery.status = ARRIVED (still inside Station.inbound_planned_kg input set)"
      - from: ARRIVED
        to: ACCEPTED
        trigger: "POST /deliveries/{id}/offload"
        actor: StationOperator
        preconditions:
          - "Delivery.status == ARRIVED"
          - "ProductionLot.status == RELEASED (cross-entity guard)"
          - "Station.safety_posture != FROZEN"
          - "PressureVessel.inspection_status IN {CURRENT, DUE}"
          - "receiving vessel pressure after receipt <= mawp_bar"
          - "Station.onsite_inventory_kg + net_receipt_kg <= Station.storage_capacity_kg"
        side_effects:
          - "Cascade hop 1: Delivery.status = ACCEPTED, accepted_at = logical clock"
          - "Cascade hop 2: because the delivery was accepted, PressureVessel.current_pressure_bar increases by net_receipt_kg / (water_volume_l * KG_PER_L_PER_BAR) and stored_mass_kg is recomputed"
          - "Cascade hop 2: an InventoryLedgerEntry with reason DELIVERY_RECEIPT, delta_kg = +net_receipt_kg, source_ref_type = DELIVERY is appended; a second entry with reason HEEL_RETURNED (TUBE_TRAILER) or BOILOFF_LOSS (LIQUID_TANKER) and delta_kg = 0.000 records the loss term for audit"
          - "Cascade hop 3: because the ledger and vessel pressure changed, Station.onsite_inventory_kg / available_kg / total_deliverable_kg / high_bank_deliverable_kg / inbound_planned_kg / projected_available_kg / supply_alert / safety_posture are recomputed"
          - "Cascade hop 4: because ProductionLot.accepted_delivered_kg rose, the lot may transition RELEASED -> CONSUMED"
      - from: ARRIVED
        to: REJECTED
        trigger: "POST /deliveries/{id}/reject with reject_reason IN {LOT_NOT_RELEASED, DOCUMENTATION, SEAL_BROKEN}"
        actor: StationOperator
        preconditions:
          - "Delivery.status == ARRIVED"
        side_effects:
          - "Cascade hop 1: Delivery.status = REJECTED, reject_reason recorded"
          - "Cascade hop 2: because the delivery left {SCHEDULED, ARRIVED}, Station.inbound_planned_kg decreases by planned_kg"
          - "Cascade hop 3: because inbound_planned_kg decreased, Station.projected_available_kg decreases by the same amount"
          - "Cascade hop 4: because projected_available_kg fell below Station.reserve_floor_kg, Station.supply_alert flips false -> true"
          - "no InventoryLedgerEntry is appended (nothing was received)"
      - from: ARRIVED
        to: QUARANTINED
        trigger: "POST /deliveries/{id}/reject with reject_reason == PURITY_FAIL"
        actor: StationOperator
        preconditions:
          - "Delivery.status == ARRIVED"
        side_effects:
          - "Delivery.status = QUARANTINED (terminal; not reschedulable)"
          - "Station.inbound_planned_kg / projected_available_kg / supply_alert recomputed"
      - from: REJECTED
        to: SCHEDULED
        trigger: "POST /deliveries/{id}/reschedule"
        actor: LogisticsDispatcher
        preconditions:
          - "Delivery.status == REJECTED"
          - "Delivery.reschedule_count < MAX_RESCHEDULES"
          - "new [window_start, window_end) does not exhaust Station.offload_bay_count"
        side_effects:
          - "Delivery.window_start / window_end replaced with the supplied values"
          - "Delivery.reschedule_count incremented by 1"
          - "Delivery.arrived_at / transit_hours / boiloff_kg / heel_kg / net_receipt_kg / reject_reason reset to null"
          - "Delivery.status = SCHEDULED"
          - "Station.inbound_planned_kg / projected_available_kg / supply_alert recomputed (planned_kg re-enters the input set)"

  - entity: DispenseSession
    initial_state: PRECOOLING
    terminal_states: [COMPLETED, ABORTED]
    note: "Parallel dimensions on one row: fill_status (PRECOOLING -> FUELING -> COMPLETED | ABORTED) and billing_status (PENDING -> METERED | VOIDED) advance independently. Terminal states above refer to the fill_status axis."
    transitions:
      - from: PRECOOLING
        to: FUELING
        trigger: "POST /dispense-sessions/{id}/fuel"
        actor: StationOperator
        preconditions:
          - "fill_status == PRECOOLING"
          - "Station.safety_posture != FROZEN"
          - "precool_temp_achieved_c <= required_precool_c (fill-protocol compliance)"
        side_effects:
          - "DispenseSession.precool_temp_achieved_c stored"
          - "DispenseSession.fill_status = FUELING; billing_status remains PENDING"
          - "planned_kg remains inside Station.reserved_kg input set"
      - from: FUELING
        to: COMPLETED
        trigger: "POST /dispense-sessions/{id}/complete"
        actor: StationOperator
        preconditions:
          - "fill_status == FUELING"
          - "metered_kg <= planned_kg"
          - "cascade allocation can serve planned_kg per calculations.cascade_fill_allocation"
          - "Station.compressor_status == ONLINE when compressor_makeup_kg > 0"
        side_effects:
          - "DispenseSession.density_correction_factor / corrected_kg / metering_error_pct / metering_within_tolerance computed"
          - "DispenseSession.cascade_plan / direct_cascade_kg / compressor_makeup_kg computed"
          - "each PressureVessel in cascade_plan has current_pressure_bar and stored_mass_kg decremented"
          - "an InventoryLedgerEntry with reason DISPENSE_DRAW, delta_kg = -metered_kg, source_ref_type = DISPENSE_SESSION is appended"
          - "DispenseSession.fill_status = COMPLETED; billing_status still PENDING"
          - "Station.onsite_inventory_kg / reserved_kg / available_kg / total_deliverable_kg / high_bank_deliverable_kg / projected_available_kg / supply_alert / safety_posture recomputed"
      - from: PRECOOLING
        to: ABORTED
        trigger: "POST /dispense-sessions/{id}/abort, or the FROZEN cascade from POST /safety-events"
        actor: StationOperator
        preconditions:
          - "fill_status == PRECOOLING"
        side_effects:
          - "DispenseSession.fill_status = ABORTED, abort_reason = OPERATOR_ABORT (operator call) or STATION_FROZEN (cascade)"
          - "DispenseSession.billing_status PENDING -> VOIDED"
          - "planned_kg leaves Station.reserved_kg input set; available_kg recomputed"
          - "no InventoryLedgerEntry is appended"
      - from: FUELING
        to: ABORTED
        trigger: "POST /dispense-sessions/{id}/abort, or the FROZEN cascade from POST /safety-events"
        actor: StationOperator
        preconditions:
          - "fill_status == FUELING"
        side_effects:
          - "same as PRECOOLING -> ABORTED"
      - from: PENDING
        to: METERED
        trigger: "POST /dispense-sessions/{id}/meter-settlement (billing axis)"
        actor: ComplianceAdmin
        preconditions:
          - "billing_status == PENDING"
          - "fill_status == COMPLETED"
        side_effects:
          - "DispenseSession.billing_status = METERED"
          - "an InventoryLedgerEntry with reason METER_CORRECTION and delta_kg = -(corrected_kg - metered_kg) is appended, reconciling the meter reading to the corrected mass"
          - "Station.metered_kg_mtd / corrected_kg_mtd / metering_error_pct_mtd / metering_accuracy_flag / onsite_inventory_kg / available_kg recomputed"
      - from: METERED
        to: VOIDED
        trigger: "POST /dispense-sessions/{id}/void-meter (billing axis, compensating action)"
        actor: ComplianceAdmin
        preconditions:
          - "billing_status == METERED"
          - "no IncentiveClaim with status IN {CERTIFIED, CREDITS_ISSUED} covers this session's started_at date"
        side_effects:
          - "DispenseSession.billing_status = VOIDED"
          - "an InventoryLedgerEntry with reason METER_VOID_REVERSAL and delta_kg = +(corrected_kg - metered_kg) is appended, exactly reversing the METER_CORRECTION entry"
          - "Station.metered_kg_mtd / corrected_kg_mtd / metering_error_pct_mtd / metering_accuracy_flag / onsite_inventory_kg / available_kg recomputed; onsite_inventory_kg returns to its pre-settlement value"

  - entity: SafetyEvent
    initial_state: OPEN
    terminal_states: [CLEARED]
    transitions:
      - from: OPEN
        to: ACKNOWLEDGED
        trigger: "POST /safety-events/{id}/acknowledge"
        actor: SafetyOfficer
        preconditions:
          - "SafetyEvent.status == OPEN"
        side_effects:
          - "SafetyEvent.acknowledged_at = logical clock"
          - "SafetyEvent.status = ACKNOWLEDGED"
          - "Station.safety_posture unchanged (ACKNOWLEDGED still counts as outstanding)"
      - from: ACKNOWLEDGED
        to: CLEARED
        trigger: "POST /safety-events/{id}/clear"
        actor: SafetyOfficer
        preconditions:
          - "SafetyEvent.status == ACKNOWLEDGED"
          - "X-User-ID differs from opened_by_user_id (segregation of duties)"
        side_effects:
          - "SafetyEvent.cleared_at = logical clock, cleared_by_user_id = X-User-ID, corrective_action stored"
          - "SafetyEvent.status = CLEARED (terminal); the downtime interval [opened_at, cleared_at) is now closed for uptime accrual"
          - "the corresponding Station subsystem field returns to NORMAL / ONLINE / setback_compliant = true when no other event of that kind remains OPEN or ACKNOWLEDGED"
          - "Station.safety_posture recomputed"

  - entity: IncentiveClaim
    initial_state: SUBMITTED
    terminal_states: [CREDITS_ISSUED, DENIED]
    note: "Cyclic revision loop SUBMITTED <-> REVISION_REQUESTED bounded by MAX_REVISION_ROUNDS; the bound is enforced by auto-denial rather than by an error."
    transitions:
      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /incentive-claims/{id}/request-revision while revision_round < MAX_REVISION_ROUNDS"
        actor: ProgramAuditor
        preconditions:
          - "IncentiveClaim.status == SUBMITTED"
          - "IncentiveClaim.revision_round < MAX_REVISION_ROUNDS"
        side_effects:
          - "IncentiveClaim.revision_round incremented by 1"
          - "IncentiveClaim.revision_note stored"
          - "IncentiveClaim.status = REVISION_REQUESTED"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /incentive-claims/{id}/request-revision while revision_round == MAX_REVISION_ROUNDS"
        actor: ProgramAuditor
        preconditions:
          - "IncentiveClaim.status == SUBMITTED"
          - "IncentiveClaim.revision_round == MAX_REVISION_ROUNDS"
        side_effects:
          - "IncentiveClaim.revision_round incremented by 1 (to MAX_REVISION_ROUNDS + 1)"
          - "IncentiveClaim.revision_note stored"
          - "IncentiveClaim.status = DENIED (terminal); no credits are ever issued"
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /incentive-claims/{id}/resubmit"
        actor: ComplianceAdmin
        preconditions:
          - "IncentiveClaim.status == REVISION_REQUESTED"
          - "every ProductionLot in the supplied production_lot_ids has ci_status == CERTIFIED"
        side_effects:
          - "IncentiveClaim.production_lot_ids replaced with the supplied array"
          - "dispensed_kg / energy_mj / pathway_ci_gco2e_per_mj / gross_credits_mt / admin_fee_rate / admin_fee_mt / net_credits_mt recomputed"
          - "IncentiveClaim.status = SUBMITTED"
      - from: SUBMITTED
        to: CERTIFIED
        trigger: "POST /incentive-claims/{id}/certify"
        actor: ProgramAuditor
        preconditions:
          - "IncentiveClaim.status == SUBMITTED"
          - "X-User-ID differs from submitted_by_user_id (segregation of duties)"
        side_effects:
          - "IncentiveClaim.certified_by_user_id = X-User-ID"
          - "IncentiveClaim.status = CERTIFIED; the covered DispenseSession rows become ineligible for void-meter"
      - from: CERTIFIED
        to: CREDITS_ISSUED
        trigger: "POST /incentive-claims/{id}/issue-credits"
        actor: ProgramAuditor
        preconditions:
          - "IncentiveClaim.status == CERTIFIED"
          - "IncentiveClaim.net_credits_mt > 0"
        side_effects:
          - "IncentiveClaim.status = CREDITS_ISSUED (terminal)"
          - "Station.credits_issued_total_mt recomputed to include net_credits_mt"

  - entity: UptimeReport
    initial_state: DRAFT
    terminal_states: [AMENDED]
    transitions:
      - from: DRAFT
        to: FINAL
        trigger: "POST /uptime-reports/{id}/finalize"
        actor: ComplianceAdmin
        preconditions:
          - "UptimeReport.status == DRAFT"
          - "no other UptimeReport for this station with status == FINAL has a period overlapping [period_start, period_end)"
        side_effects:
          - "UptimeReport.penalty_cents computed per calculations.funding_penalty"
          - "UptimeReport.status = FINAL"
          - "FundingAgreement.holdback_balance_cents recomputed (penalty now inside the FINAL sum)"
          - "increments FundingAgreement.version by 1"
      - from: FINAL
        to: AMENDED
        trigger: "POST /uptime-reports/{id}/amend"
        actor: ComplianceAdmin
        preconditions:
          - "UptimeReport.status == FINAL"
          - "amend_reason is non-empty"
        side_effects:
          - "UptimeReport.status = AMENDED (terminal), amend_reason stored; its penalty_cents value is retained for audit but leaves the FINAL sum"
          - "a replacement UptimeReport is created with status DRAFT, amended_from_report_id = this report's id, the same period, and freshly recomputed uptime figures"
          - "FundingAgreement.holdback_balance_cents recomputed — the superseded penalty is reversed"
          - "increments FundingAgreement.version by 1"

concurrency_rules:
  - rule_id: dispense-session-create-stale-station
    parent_entity: Station
    write_endpoint: "POST /dispense-sessions"
    occ_field: "expected_station_version"
    description: |
      Creating a DispenseSession against a Station whose version has advanced
      since the client last read it is rejected with a stale-version error. A
      session create legitimately supersedes the operator's view of available
      inventory, posture and reserved mass, so the server refuses to reserve
      mass against an out-of-date snapshot rather than silently over-committing.
    error_id: ERR_STALE_STATION_VERSION
    http_status: 412
  - rule_id: uptime-report-create-stale-agreement
    parent_entity: FundingAgreement
    write_endpoint: "POST /uptime-reports"
    occ_field: "expected_funding_agreement_version"
    description: |
      Creating an UptimeReport against a FundingAgreement whose version has
      advanced since the client last read it is rejected with a stale-version
      error. A report draft legitimately supersedes the client's view of the
      holdback balance, so the server refuses to draft against an out-of-date
      snapshot of the agreement.
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412

calculations:
  - name: station_safety_posture
    trigger: "Recomputed after every mutation that touches Station subsystem fields, its SafetyEvent rows, its PressureVessel rows, or its vessel pressures — i.e. POST /safety-events, POST /safety-events/{id}/acknowledge, POST /safety-events/{id}/clear, POST /pressure-vessels/{id}/inspections, POST /deliveries/{id}/offload, POST /dispense-sessions/{id}/complete, POST /_clock/set_current_utc"
    algorithm: constraint_propagation
    formula: |
      # Evaluated top-down; the FIRST matching band wins.
      frozen_conditions =
            leak_detection_status == ALARM
         OR ventilation_status == FAULT
         OR setback_compliant == false
         OR EXISTS SafetyEvent(station_id = this, severity == CRITICAL, status IN {OPEN, ACKNOWLEDGED})
      IF frozen_conditions: safety_posture = FROZEN

      restricted_conditions =
            compressor_status == OFFLINE
         OR high_bank_deliverable_kg < MIN_HIGH_BANK_DELIVERABLE_KG
         OR EXISTS PressureVessel(station_id = this, inspection_status IN {OVERDUE, CONDEMNED})
         OR EXISTS SafetyEvent(station_id = this, severity == MAJOR, status IN {OPEN, ACKNOWLEDGED})
      ELSE IF restricted_conditions: safety_posture = RESTRICTED

      ELSE: safety_posture = OPEN
    input_set: "SafetyEvent rows of this station with status IN {OPEN, ACKNOWLEDGED} (CLEARED rows are excluded); PressureVessel rows of this station in every inspection_status"
    constants:
      MIN_HIGH_BANK_DELIVERABLE_KG: 10.000
    precision: "enum output; high_bank_deliverable_kg compared at 3 decimal places"
    variants: []

  - name: production_lot_carbon_intensity
    trigger: "POST /production-lots (stamps ci_provisional_gco2e_per_mj and selected_power_contract_id) and POST /production-lots/{id}/certify-ci (stamps ci_certified_gco2e_per_mj and ci_variant_applied)"
    algorithm: weighted_scoring
    formula: |
      # STEP 1 — power-contract selector (deterministic; no random field participates)
      #   eligibility filter: PowerSupplyContract.production_asset_id == lot.production_asset_id
      #                       AND effective_from <= lot.production_end_at < effective_to
      #   ranking expression: effective_from DESC
      #   tie-break: created_at ASC
      #   empty candidate set: reject with ERR_NO_POWER_CONTRACT (422)
      contract = first(candidates ordered by effective_from DESC, created_at ASC)
      selected_power_contract_id = contract.id

      # STEP 2 — variant selection
      #   ci_provisional_gco2e_per_mj ALWAYS uses ANNUAL_AVERAGE, regardless of the contract flag.
      #   ci_certified_gco2e_per_mj uses HOURLY_MATCHED when contract.hourly_matching_enabled == true,
      #   otherwise ANNUAL_AVERAGE; the chosen variant is recorded in ci_variant_applied.
      renewable_pct = (variant == HOURLY_MATCHED)
                        ? contract.hourly_matched_renewable_pct
                        : contract.annual_renewable_pct

      # STEP 3 — emissions terms, all in grams CO2e
      fresh_kg          = lot.mass_kg - lot.carryover_kg
      electricity_g     = lot.energy_consumed_kwh
                          * (contract.grid_ci_gco2e_per_mwh / 1000)
                          * (1 - renewable_pct / 100)
      feedstock_g       = lot.feedstock_consumed_mmbtu
                          * NG_TOTAL_G_PER_MMBTU
                          * (1 - asset.ccs_capture_rate)
      compression_g     = fresh_kg * COMPRESSION_ADDER_G_PER_KG
      own_emissions_g   = electricity_g + feedstock_g + compression_g

      # STEP 4 — predecessor blending (self-referential); carryover mass carries the
      #          predecessor's carbon intensity rather than this lot's.
      IF lot.predecessor_lot_id IS NULL OR lot.carryover_kg == 0:
          carryover_g = 0
      ELSE:
          predecessor_ci = (computing ci_provisional_gco2e_per_mj)
                             ? predecessor.ci_provisional_gco2e_per_mj
                             : predecessor.ci_certified_gco2e_per_mj
          carryover_g    = lot.carryover_kg * H2_LHV_MJ_PER_KG * predecessor_ci

      ci = (own_emissions_g + carryover_g) / (lot.mass_kg * H2_LHV_MJ_PER_KG)
      RETURN round_half_up(ci, 2)
    input_set: "Exactly one PowerSupplyContract, chosen by the STEP 1 selector; the lot's own ProductionAsset; and, when carryover_kg > 0, the single ProductionLot named by predecessor_lot_id, which MUST have ci_status == CERTIFIED at certify-ci time (else ERR_LOT_CI_NOT_CERTIFIED)"
    constants:
      H2_LHV_MJ_PER_KG: 120.0
      COMPRESSION_ADDER_G_PER_KG: 300.0
      NG_TOTAL_G_PER_MMBTU: 61260.0
    precision: "2 decimal places, round_half_up"
    variants:
      - name: ANNUAL_AVERAGE
        when: "contract.hourly_matching_enabled == false, and always for ci_provisional_gco2e_per_mj"
        difference: "Uses contract.annual_renewable_pct as the renewable share, crediting the annual-average renewable contract volume against every production hour"
      - name: HOURLY_MATCHED
        when: "contract.hourly_matching_enabled == true, and only for ci_certified_gco2e_per_mj"
        difference: "Uses contract.hourly_matched_renewable_pct instead, crediting only renewable generation matched hour-by-hour; on identical lot data this yields a strictly higher carbon intensity whenever hourly_matched_renewable_pct < annual_renewable_pct"

  - name: purity_verdict
    trigger: "POST /production-lots/{id}/purity-tests"
    algorithm: threshold
    formula: |
      # Fixed analyte order — used for failing_analytes ordering:
      ANALYTE_ORDER = [total_hydrocarbons_ppm, water_ppm, oxygen_ppm, nitrogen_ppm,
                       carbon_monoxide_ppm, carbon_dioxide_ppm, total_sulfur_ppm,
                       ammonia_ppm, helium_ppm]

      measured = analytes in ANALYTE_ORDER whose supplied value is not null
      # An analyte fails only when it is STRICTLY GREATER than its limit;
      # a value exactly EQUAL to the limit PASSES.
      failing_analytes = [a for a in measured if value(a) > LIMIT[a]]   # order preserved

      IF failing_analytes is non-empty:      verdict = FAIL          # FAIL outranks INDETERMINATE
      ELSE IF ammonia_ppm IS NULL OR helium_ppm IS NULL:
                                             verdict = INDETERMINATE
      ELSE:                                  verdict = PASS

      purity_margin_pct = MIN over a in measured of
                            round_half_up((LIMIT[a] - value(a)) / LIMIT[a] * 100, 3)
    input_set: "The nine analyte fields of this single PurityTest row; the two optional analytes (ammonia_ppm, helium_ppm) are excluded from both failing_analytes and purity_margin_pct when omitted"
    constants:
      LIMIT_TOTAL_HYDROCARBONS_PPM: 2.000
      LIMIT_WATER_PPM: 5.000
      LIMIT_OXYGEN_PPM: 5.000
      LIMIT_NITROGEN_PPM: 100.000
      LIMIT_CARBON_MONOXIDE_PPM: 0.200
      LIMIT_CARBON_DIOXIDE_PPM: 2.000
      LIMIT_TOTAL_SULFUR_PPM: 0.004
      LIMIT_AMMONIA_PPM: 0.100
      LIMIT_HELIUM_PPM: 300.000
    precision: "purity_margin_pct at 3 decimal places, round_half_up"
    variants: []

  - name: required_precool_temperature
    trigger: "POST /dispense-sessions (stamps required_precool_c) and re-checked at POST /dispense-sessions/{id}/fuel"
    algorithm: threshold
    formula: |
      # Table band selection on ambient_temp_c — bands are half-open so that
      # ambient_temp_c == 30.0 lands in the MIDDLE band, not the hot band.
      IF ambient_temp_c > 30.0:                    band = HOT
      ELSE IF ambient_temp_c > 10.0:               band = MILD
      ELSE:                                        band = COLD

      table_c = TABLE[target_pressure_class][band]
      #   H70: HOT -> -40.0, MILD -> -33.0, COLD -> -26.0
      #   H35: HOT -> -33.0, MILD -> -26.0, COLD -> -17.0

      IF fill_protocol == MC_FORMULA:  required_precool_c = table_c + MC_FORMULA_RELIEF_C
      ELSE:                            required_precool_c = table_c

      # Compliance check at /fuel: precool_temp_achieved_c <= required_precool_c,
      # else ERR_FILL_PROTOCOL_VIOLATION (422). Equality COMPLIES.
    input_set: "The single DispenseSession row's ambient_temp_c, target_pressure_class and fill_protocol"
    constants:
      PRECOOL_H70_HOT_C: -40.0
      PRECOOL_H70_MILD_C: -33.0
      PRECOOL_H70_COLD_C: -26.0
      PRECOOL_H35_HOT_C: -33.0
      PRECOOL_H35_MILD_C: -26.0
      PRECOOL_H35_COLD_C: -17.0
      MC_FORMULA_RELIEF_C: 5.0
    precision: "1 decimal place"
    variants: []

  - name: cascade_fill_allocation
    trigger: "POST /dispense-sessions/{id}/complete"
    algorithm: waterfall_allocation
    formula: |
      terminal_bar = (target_pressure_class == H70) ? TERMINAL_BAR_H70 : TERMINAL_BAR_H35

      # PASS 1 — gravity cascade, HIGH bank first (fastest fill).
      #   candidate vessels: PressureVessel of this station with
      #                      inspection_status IN {CURRENT, DUE}
      #   allocation order: bank_tier HIGH, then MEDIUM, then LOW;
      #                     within one tier, created_at ASC
      remaining = planned_kg
      cascade_plan = []
      FOR v IN candidates ORDERED BY [HIGH, MEDIUM, LOW], created_at ASC:
          floor_bar  = MAX(v.min_residual_bar, terminal_bar)
          usable_bar = MAX(0, v.current_pressure_bar - floor_bar)
          vessel_kg  = usable_bar * v.water_volume_l * KG_PER_L_PER_BAR
          take       = round_half_up(MIN(remaining, vessel_kg), 3)
          IF take > 0:
              v.current_pressure_bar -= take / (v.water_volume_l * KG_PER_L_PER_BAR)
              cascade_plan.append({bank_tier: v.bank_tier, vessel_id: v.id,
                                   kg: take, pressure_after_bar: v.current_pressure_bar})
              remaining -= take
      direct_cascade_kg = round_half_up(SUM(cascade_plan[*].kg), 3)

      # PASS 2 — compressor makeup, drawn in the OPPOSITE tier order (LOW bank
      #          first, to preserve high-bank pressure) and down to each vessel's
      #          own min_residual_bar rather than the fill terminal pressure.
      compressor_makeup_kg = round_half_up(planned_kg - direct_cascade_kg, 3)
      IF compressor_makeup_kg > 0 AND Station.compressor_status == OFFLINE:
          reject ERR_COMPRESSOR_OFFLINE (422)
      remaining = compressor_makeup_kg
      FOR v IN candidates ORDERED BY [LOW, MEDIUM, HIGH], created_at ASC:
          usable_bar = MAX(0, v.current_pressure_bar - v.min_residual_bar)
          vessel_kg  = usable_bar * v.water_volume_l * KG_PER_L_PER_BAR
          take       = round_half_up(MIN(remaining, vessel_kg), 3)
          IF take > 0:
              v.current_pressure_bar -= take / (v.water_volume_l * KG_PER_L_PER_BAR)
              cascade_plan.append({bank_tier: v.bank_tier, vessel_id: v.id,
                                   kg: take, pressure_after_bar: v.current_pressure_bar})
              remaining -= take
      IF remaining > 0:
          reject ERR_CASCADE_INSUFFICIENT (422)
    input_set: "PressureVessel rows of this station with inspection_status IN {CURRENT, DUE}; vessels that are OVERDUE or CONDEMNED are excluded from both passes"
    constants:
      KG_PER_L_PER_BAR: 0.00008
      TERMINAL_BAR_H35: 438.00
      TERMINAL_BAR_H70: 875.00
    precision: "kg amounts at 3 decimal places, round_half_up; pressures at 2 decimal places"
    variants: []

  - name: dispense_metered_mass_correction
    trigger: "POST /dispense-sessions/{id}/complete"
    algorithm: threshold
    formula: |
      density_correction_factor =
          1
          + (REF_TEMP_C - ambient_temp_c) * TEMP_COEFF_PER_C
          + (avg_dispense_pressure_bar - REF_PRESSURE_BAR) * PRESSURE_COEFF_PER_BAR
      corrected_kg = round_half_up(metered_kg * density_correction_factor, 3)
      metering_error_pct = round_half_up((metered_kg - corrected_kg) / corrected_kg * 100, 3)
      metering_within_tolerance = ABS(metering_error_pct) <= METER_TOLERANCE_PCT   # equality is WITHIN
    input_set: "The single DispenseSession row's metered_kg, ambient_temp_c and avg_dispense_pressure_bar"
    constants:
      REF_TEMP_C: 20.0
      REF_PRESSURE_BAR: 700.00
      TEMP_COEFF_PER_C: 0.00040
      PRESSURE_COEFF_PER_BAR: -0.00002
      METER_TOLERANCE_PCT: 1.500
    precision: "density_correction_factor exact (no intermediate rounding); corrected_kg and metering_error_pct at 3 decimal places, round_half_up"
    variants: []

  - name: metering_accuracy_rollup
    trigger: "POST /dispense-sessions/{id}/meter-settlement and POST /dispense-sessions/{id}/void-meter (recomputes Station.metered_kg_mtd, corrected_kg_mtd, metering_error_pct_mtd, metering_accuracy_flag)"
    algorithm: aggregation
    formula: |
      # Input set: DispenseSession rows of this station with billing_status == METERED
      # whose started_at falls in the same calendar month (UTC) as the current
      # logical clock, ordered created_at ASC. VOIDED and PENDING rows are excluded.
      metered_kg_mtd   = round_half_up(SUM over s of s.metered_kg, 3)

      # ROUNDING ORDER IS PINNED: round EACH session's corrected mass to 3 dp
      # first (the value already stored in DispenseSession.corrected_kg), THEN sum.
      #   corrected_kg_mtd = SUM(round_half_up(s.metered_kg * s.dcf, 3))
      # The rejected alternative — round_half_up(SUM(s.metered_kg * s.dcf), 3) —
      # differs by up to one milligram per session and MUST NOT be used.
      corrected_kg_mtd = SUM over s of s.corrected_kg

      metering_error_pct_mtd = round_half_up(
          (metered_kg_mtd - corrected_kg_mtd) / corrected_kg_mtd * 100, 3)
      metering_accuracy_flag = (ABS(metering_error_pct_mtd) <= METER_TOLERANCE_PCT)
                                 ? WITHIN_TOLERANCE : OUT_OF_TOLERANCE
      # Empty input set: metered_kg_mtd = 0.000, corrected_kg_mtd = 0.000,
      #                  metering_error_pct_mtd = 0.000, flag = WITHIN_TOLERANCE
    input_set: "DispenseSession rows of this station with billing_status == METERED and started_at inside the logical clock's current UTC calendar month; ordered created_at ASC; ties impossible because created_at is unique per row"
    constants:
      METER_TOLERANCE_PCT: 1.500
    precision: "3 decimal places, round_half_up; per-session rounding precedes summation"
    variants: []

  - name: onsite_inventory_reconciliation
    trigger: "Every InventoryLedgerEntry append: POST /stations/{id}/pressure-vessels (OPENING_BALANCE), POST /deliveries/{id}/offload (DELIVERY_RECEIPT + HEEL_RETURNED|BOILOFF_LOSS), POST /dispense-sessions/{id}/complete (DISPENSE_DRAW), POST /dispense-sessions/{id}/meter-settlement (METER_CORRECTION), POST /dispense-sessions/{id}/void-meter (METER_VOID_REVERSAL), POST /pressure-vessels/{id}/inspections with outcome CONDEMN (INSPECTION_VENT)"
    algorithm: projection
    formula: |
      # Replay order is pinned: occurred_at ASC, then sequence_no ASC.
      # sequence_no is assigned 1, 2, 3, ... per station in append order, so the
      # secondary key fully disambiguates entries sharing one logical-clock instant.
      running = 0.000
      FOR e IN InventoryLedgerEntry(station_id = this) ORDERED BY occurred_at ASC, sequence_no ASC:
          running = round_half_up(running + e.delta_kg, 3)
          e.resulting_onsite_kg = running
      Station.onsite_inventory_kg = running          # 0.000 when the ledger is empty

      # Global invariant (checked by the compensating-action tests):
      #   Station.onsite_inventory_kg == round_half_up(SUM(delta_kg over all entries), 3)
      #   == resulting_onsite_kg of the last entry in replay order
    input_set: "All InventoryLedgerEntry rows of this station, in every reason; the ledger is append-only and no row is ever mutated or deleted"
    constants: {}
    precision: "3 decimal places, round_half_up at each step"
    variants: []

  - name: delivery_net_receipt
    trigger: "POST /deliveries/{id}/arrive (computes transit_hours, boiloff_kg, heel_kg, net_receipt_kg); the values are consumed by POST /deliveries/{id}/offload"
    algorithm: chronological
    formula: |
      transit_hours = round_half_up((arrived_at - departed_at) in hours, 3)

      IF mode == TUBE_TRAILER:
          heel_kg        = round_half_up(trailer_final_pressure_bar
                                         * trailer_water_volume_l
                                         * KG_PER_L_PER_BAR, 3)
          boiloff_kg     = 0.000
      ELSE:   # LIQUID_TANKER — linear boil-off in transit time
          heel_kg        = 0.000
          boiloff_kg     = round_half_up(planned_kg * DAILY_BOILOFF_RATE
                                         * transit_hours / 24, 3)

      net_receipt_kg = round_half_up(planned_kg - heel_kg - boiloff_kg, 3)
    input_set: "The single Delivery row; TUBE_TRAILER uses trailer_water_volume_l and trailer_final_pressure_bar (both required for that mode), LIQUID_TANKER uses transit_hours"
    constants:
      KG_PER_L_PER_BAR: 0.00008
      DAILY_BOILOFF_RATE: 0.003
    precision: "3 decimal places, round_half_up"
    variants:
      - name: TUBE_TRAILER_HEEL
        when: "mode == TUBE_TRAILER"
        difference: "Loss is the residual heel left in the tubes, a function of trailer geometry and final pressure; it is completely independent of transit_hours"
      - name: LIQUID_TANKER_BOILOFF
        when: "mode == LIQUID_TANKER"
        difference: "Loss is linear in transit_hours at DAILY_BOILOFF_RATE per 24 h and completely independent of trailer geometry"

  - name: incentive_credit_netting
    trigger: "POST /incentive-claims and POST /incentive-claims/{id}/resubmit"
    algorithm: tiered_pricing
    formula: |
      # STEP 1 — dispensed volume for the claim period (inclusive date bounds)
      #   input set: DispenseSession(station_id = claim.station_id,
      #                             billing_status == METERED,
      #                             period_start <= DATE(started_at) <= period_end)
      dispensed_kg = round_half_up(SUM over s of s.corrected_kg, 3)
      energy_mj    = round_half_up(dispensed_kg * H2_LHV_MJ_PER_KG, 3)

      # STEP 2 — pathway carbon intensity: mass-weighted over the declared lots,
      #          weighted by ProductionLot.accepted_delivered_kg.
      #   Every lot in production_lot_ids MUST have ci_status == CERTIFIED.
      #   When SUM(accepted_delivered_kg) == 0 the weights are undefined, so the
      #   unweighted arithmetic mean of ci_certified_gco2e_per_mj is used instead.
      W = SUM over lots of lot.accepted_delivered_kg
      pathway_ci_gco2e_per_mj = (W > 0)
          ? round_half_up(SUM(lot.ci_certified_gco2e_per_mj * lot.accepted_delivered_kg) / W, 2)
          : round_half_up(SUM(lot.ci_certified_gco2e_per_mj) / COUNT(lots), 2)

      # STEP 3 — EVALUATION ORDER IS PINNED to break the apparent circularity
      #          between the fee tier and the netted credit total:
      #            (1) gross_credits_mt   from CI and energy
      #            (2) admin_fee_rate     from the tier table keyed on gross_credits_mt
      #            (3) admin_fee_mt       = gross * rate
      #            (4) net_credits_mt     = gross - fee
      #          The tier is keyed on GROSS, never on NET. Keying the tier on
      #          net_credits_mt would be self-referential and is forbidden.
      gross_credits_mt = MAX(0.000, round_half_up(
          (CI_BENCHMARK_GCO2E_PER_MJ - pathway_ci_gco2e_per_mj / EER) * energy_mj / 1000000, 3))

      IF gross_credits_mt >= ADMIN_TIER_HIGH_MT:   admin_fee_rate = ADMIN_RATE_HIGH
      ELSE IF gross_credits_mt >= ADMIN_TIER_MID_MT: admin_fee_rate = ADMIN_RATE_MID
      ELSE:                                        admin_fee_rate = ADMIN_RATE_LOW

      admin_fee_mt   = round_half_up(gross_credits_mt * admin_fee_rate, 3)
      net_credits_mt = round_half_up(gross_credits_mt - admin_fee_mt, 3)
    input_set: "DispenseSession rows with billing_status == METERED inside the inclusive claim period; ProductionLot rows named by production_lot_ids, all of which must have ci_status == CERTIFIED"
    constants:
      H2_LHV_MJ_PER_KG: 120.0
      CI_BENCHMARK_GCO2E_PER_MJ: 79.10
      EER: 3.4
      ADMIN_TIER_HIGH_MT: 3.600
      ADMIN_TIER_MID_MT: 1.200
      ADMIN_RATE_HIGH: 0.030
      ADMIN_RATE_MID: 0.020
      ADMIN_RATE_LOW: 0.010
    precision: "gross_credits_mt, admin_fee_mt, net_credits_mt at 3 decimal places, round_half_up; pathway_ci_gco2e_per_mj at 2 decimal places"
    variants: []

  - name: station_uptime_pct
    trigger: "POST /uptime-reports (stamps both variants and uptime_pct) and POST /uptime-reports/{id}/amend (recomputes them on the replacement DRAFT)"
    algorithm: interval_merge
    formula: |
      period_minutes = (period_end - period_start) in minutes
      nozzle_count_snapshot = Station.nozzle_count at report creation

      # Input set: SafetyEvent(station_id = this, severity IN {MAJOR, CRITICAL},
      #                        status == CLEARED) whose half-open outage interval
      #            [opened_at, cleared_at) intersects [period_start, period_end).
      # OPEN and ACKNOWLEDGED events have no cleared_at and are excluded.
      # Each interval is clipped to the period before use.

      # VARIANT A — nozzle-weighted: NO interval merging. Overlapping events accrue
      # independently because each names its own affected_nozzle_count.
      downtime_nozzle_minutes = SUM over e of
          (clipped_minutes(e) * e.affected_nozzle_count)
      uptime_pct_nozzle_weighted = round_half_up(
          100 - downtime_nozzle_minutes / (period_minutes * nozzle_count_snapshot) * 100, 3)

      # VARIANT B — station-level: keep only FULL outages (affected_nozzle_count ==
      # nozzle_count_snapshot), then MERGE their clipped half-open intervals.
      # Adjacent intervals with gap == 0 merge into one; disjoint intervals are kept
      # separate; overlaps are counted once.
      full_outage_minutes = total length of UNION(clipped [opened_at, cleared_at)
          of events with affected_nozzle_count == nozzle_count_snapshot)
      uptime_pct_station_level = round_half_up(
          100 - full_outage_minutes / period_minutes * 100, 3)

      uptime_pct = (FundingAgreement.uptime_method == NOZZLE_WEIGHTED)
                     ? uptime_pct_nozzle_weighted
                     : uptime_pct_station_level
      shortfall_points = round_half_up(MAX(0, FundingAgreement.min_uptime_pct - uptime_pct), 3)
    input_set: "SafetyEvent rows of this station with severity IN {MAJOR, CRITICAL} and status == CLEARED whose [opened_at, cleared_at) intersects [period_start, period_end); MINOR events and uncleared events are excluded"
    constants: {}
    precision: "3 decimal places, round_half_up"
    variants:
      - name: NOZZLE_WEIGHTED
        when: "FundingAgreement.uptime_method == NOZZLE_WEIGHTED"
        difference: "Weights each outage by affected_nozzle_count over a nozzle-minute denominator and does NOT merge overlapping intervals, so a partial outage overlapping a full outage still reduces uptime"
      - name: STATION_LEVEL
        when: "FundingAgreement.uptime_method == STATION_LEVEL"
        difference: "Counts only full-station outages and merges their intervals, so overlapping and adjacent outages are counted once and partial-nozzle outages are invisible; on identical event data it reports a strictly higher uptime whenever any partial outage exists"

  - name: funding_penalty
    trigger: "POST /uptime-reports/{id}/finalize (stamps UptimeReport.penalty_cents and recomputes FundingAgreement.holdback_balance_cents)"
    algorithm: threshold
    formula: |
      # holdback_before is the agreement's holdback_balance_cents evaluated over
      # UptimeReport rows with status == FINAL, i.e. EXCLUDING this report.
      raw_penalty_cents = round_half_up(shortfall_points * FundingAgreement.penalty_per_point_cents, 0)
      penalty_cents     = MIN(raw_penalty_cents, holdback_before)   # clamped; never negative
      # shortfall_points == 0.000 -> penalty_cents == 0 and no holdback movement.
      # After the write:
      #   FundingAgreement.holdback_balance_cents
      #     = MAX(0, initial_holdback_cents - SUM(penalty_cents over reports with status == FINAL))
    input_set: "This UptimeReport plus every other UptimeReport of the same funding_agreement_id with status == FINAL"
    constants: {}
    precision: "integer cents, round_half_up before clamping"
    variants: []

  - name: operational_thresholds
    trigger: "Evaluated wherever the named predicate appears: POST /_clock/set_current_utc and every read of PressureVessel.inspection_status / ResponderCertification.is_current; POST /deliveries/{id}/reschedule; POST /incentive-claims/{id}/request-revision; POST /deliveries/{id}/offload; POST /production-assets/{id}/power-supply-contracts"
    algorithm: threshold
    formula: |
      today = DATE(logical clock, UTC)

      # (1) PressureVessel.inspection_status derivation
      IF inspection_status == CONDEMNED:                             CONDEMNED   # terminal, sticky
      ELSE IF today < next_inspection_due_date:                      CURRENT
      ELSE IF today <= next_inspection_due_date + INSPECTION_GRACE_DAYS days:  DUE
      ELSE:                                                          OVERDUE
      # Boundaries: today == next_inspection_due_date -> DUE (not CURRENT);
      #             today == due + INSPECTION_GRACE_DAYS -> DUE (not OVERDUE).

      # (2) ResponderCertification.is_current
      is_current = (valid_from <= today AND today <= expires_on)     # both bounds inclusive
      trained_responders = COUNT(ResponderCertification(station_id = this,
                                    cert_type == EMERGENCY_RESPONSE, is_current == true))
      # trained_responders < MIN_TRAINED_RESPONDERS -> ERR_RESPONDER_TRAINING_LAPSED

      # (3) Delivery reschedule bound
      # reschedule_count >= MAX_RESCHEDULES -> ERR_RESCHEDULE_LIMIT_REACHED

      # (4) IncentiveClaim revision bound
      # revision_round <  MAX_REVISION_ROUNDS -> SUBMITTED -> REVISION_REQUESTED
      # revision_round == MAX_REVISION_ROUNDS -> SUBMITTED -> DENIED (auto-denial)

      # (5) ProductionLot consumption bound
      # accepted_delivered_kg >= mass_kg * LOT_CONSUMED_FRACTION -> RELEASED -> CONSUMED

      # (6) PowerSupplyContract changeover buffer — see validations[priority=170]
    input_set: "The single row named by each predicate, plus the station's ResponderCertification rows for (2)"
    constants:
      INSPECTION_GRACE_DAYS: 30
      MIN_TRAINED_RESPONDERS: 2
      MAX_RESCHEDULES: 2
      MAX_REVISION_ROUNDS: 2
      LOT_CONSUMED_FRACTION: 0.900
      CONTRACT_CHANGEOVER_BUFFER_HOURS: 24
    precision: "integer day/hour counts; LOT_CONSUMED_FRACTION applied at 3 decimal places"
    variants: []

validations:
  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role names a role declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 20
    category: auth
    check: "The acting role appears in the target endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"
  - priority: 30
    category: auth
    check: "When the acting role is StationOperator (identity entity_backed:Station), X-User-ID equals the station_id of the resource being acted on"
    error_id: ERR_STATION_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: "POST /deliveries/{id}/offload, POST /deliveries/{id}/reject, POST /dispense-sessions, POST /dispense-sessions/{id}/fuel, POST /dispense-sessions/{id}/complete, POST /dispense-sessions/{id}/abort"
  - priority: 40
    category: existence
    check: "Every id appearing in the request PATH resolves to an existing row, validated left-to-right"
    error_id: "ERR_STATION_NOT_FOUND | ERR_FUNDING_AGREEMENT_NOT_FOUND | ERR_PRESSURE_VESSEL_NOT_FOUND | ERR_PRODUCTION_ASSET_NOT_FOUND | ERR_PRODUCTION_LOT_NOT_FOUND | ERR_DELIVERY_NOT_FOUND | ERR_DISPENSE_SESSION_NOT_FOUND | ERR_SAFETY_EVENT_NOT_FOUND | ERR_INCENTIVE_CLAIM_NOT_FOUND | ERR_UPTIME_REPORT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id"
  - priority: 50
    category: existence
    check: "Request body/query passes schema validation: required fields present, types correct, enum members valid, numeric ranges and decimal precision respected, pagination limit in [1,100] and offset >= 0, mode-conditional fields present (trailer_water_volume_l and trailer_final_pressure_bar required for TUBE_TRAILER and forbidden for LIQUID_TANKER), feedstock_consumed_mmbtu == 0 for electrolysis pathways, ccs_capture_rate == 0 unless pathway == SMR_CCS, carryover_kg == 0 when predecessor_lot_id is null, period_end >= period_start, window_end > window_start"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 60
    category: existence
    check: "Every id referenced in the request BODY resolves to an existing row (funding_agreement_id, station_id, production_asset_id, production_lot_id, predecessor_lot_id, receiving_vessel_id, amended_from_report_id, each element of production_lot_ids)"
    error_id: "ERR_STATION_NOT_FOUND | ERR_FUNDING_AGREEMENT_NOT_FOUND | ERR_PRESSURE_VESSEL_NOT_FOUND | ERR_PRODUCTION_ASSET_NOT_FOUND | ERR_PRODUCTION_LOT_NOT_FOUND | ERR_UPTIME_REPORT_NOT_FOUND"
    http_status: 404
    applies_to: "POST /stations, POST /production-lots, POST /deliveries, POST /dispense-sessions, POST /incentive-claims, POST /incentive-claims/{id}/resubmit, POST /uptime-reports"
  - priority: 70
    category: state
    check: "OCC: the supplied expected_<parent>_version equals the parent's current version"
    error_id: "ERR_STALE_STATION_VERSION | ERR_STALE_AGREEMENT_VERSION"
    http_status: 412
    applies_to: "POST /dispense-sessions, POST /uptime-reports"
  - priority: 80
    category: state
    check: "The target row is in a from-state that the requested §1.2 transition declares"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "every action endpoint that drives a §1.2 transition"
  - priority: 90
    category: state
    check: "Station.safety_posture != FROZEN"
    error_id: ERR_STATION_FROZEN
    http_status: 409
    applies_to: "POST /dispense-sessions, POST /dispense-sessions/{id}/fuel, POST /dispense-sessions/{id}/complete, POST /deliveries/{id}/offload, POST /pressure-vessels/{id}/inspections"
  - priority: 100
    category: business_safety
    check: "Station.safety_posture != RESTRICTED when target_pressure_class == H70"
    error_id: ERR_POSTURE_RESTRICTS_H70
    http_status: 422
    applies_to: "POST /dispense-sessions, POST /dispense-sessions/{id}/fuel"
  - priority: 110
    category: business_safety
    check: "The station has at least MIN_TRAINED_RESPONDERS (2) ResponderCertification rows with cert_type == EMERGENCY_RESPONSE and is_current == true"
    error_id: ERR_RESPONDER_TRAINING_LAPSED
    http_status: 422
    applies_to: "POST /dispense-sessions, POST /deliveries/{id}/offload"
  - priority: 120
    category: business_safety
    check: "The PressureVessel targeted by the operation has inspection_status IN {CURRENT, DUE}"
    error_id: ERR_VESSEL_INSPECTION_OVERDUE
    http_status: 422
    applies_to: "POST /deliveries, POST /deliveries/{id}/offload"
  - priority: 130
    category: business_referential
    check: "The Delivery's ProductionLot has status == RELEASED"
    error_id: ERR_LOT_NOT_RELEASED
    http_status: 422
    applies_to: "POST /deliveries/{id}/offload"
  - priority: 132
    category: business_referential
    check: "ProductionLot.qa_status == PASSED and ci_status == CERTIFIED before release"
    error_id: ERR_QA_NOT_PASSED
    http_status: 422
    applies_to: "POST /production-lots/{id}/release"
  - priority: 135
    category: business_temporal
    check: "PurityTest.sampled_at >= ProductionLot.production_end_at"
    error_id: ERR_SAMPLE_BEFORE_PRODUCTION_END
    http_status: 422
    applies_to: "POST /production-lots/{id}/purity-tests"
  - priority: 140
    category: business_safety
    check: "precool_temp_achieved_c <= DispenseSession.required_precool_c (equality complies)"
    error_id: ERR_FILL_PROTOCOL_VIOLATION
    http_status: 422
    applies_to: "POST /dispense-sessions/{id}/fuel"
  - priority: 150
    category: business_temporal
    check: "The logical-clock instant lies inside the half-open window [window_start, window_end)"
    error_id: ERR_ARRIVAL_OUTSIDE_WINDOW
    http_status: 422
    applies_to: "POST /deliveries/{id}/arrive"
  - priority: 160
    category: business_temporal
    check: "AGGREGATE-CAPACITY overlap on the station's offload bays: the count of other Delivery rows for the same station_id with status IN {SCHEDULED, ARRIVED} whose half-open window [window_start, window_end) intersects the requested window is < Station.offload_bay_count. Windows that merely touch (existing.window_end == new.window_start) do NOT intersect."
    error_id: ERR_OFFLOAD_BAY_CONFLICT
    http_status: 409
    applies_to: "POST /deliveries, POST /deliveries/{id}/reschedule"
  - priority: 170
    category: business_temporal
    check: "EXCLUSIVE-WITH-BUFFER overlap on the production asset's power supply: for every existing PowerSupplyContract of the same production_asset_id, reject when new.effective_from < existing.effective_to + CONTRACT_CHANGEOVER_BUFFER_HOURS (24) AND existing.effective_from < new.effective_to + CONTRACT_CHANGEOVER_BUFFER_HOURS. Back-to-back intervals therefore still conflict unless separated by at least 24 hours."
    error_id: ERR_POWER_CONTRACT_OVERLAP
    http_status: 409
    applies_to: "POST /production-assets/{id}/power-supply-contracts"
  - priority: 180
    category: business_constraint
    check: "Segregation of duties: X-User-ID differs from the user recorded for the preceding step — release vs every PurityTest.performed_by_user_id on the lot; clear vs SafetyEvent.opened_by_user_id; certify vs IncentiveClaim.submitted_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /production-lots/{id}/release, POST /safety-events/{id}/clear, POST /incentive-claims/{id}/certify"
  - priority: 185
    category: business_referential
    check: "The power-contract selector's candidate set for the lot's production_end_at is non-empty"
    error_id: ERR_NO_POWER_CONTRACT
    http_status: 422
    applies_to: "POST /production-lots, POST /production-lots/{id}/certify-ci"
  - priority: 190
    category: business_referential
    check: "Every ProductionLot named by production_lot_ids has ci_status == CERTIFIED; and, when certifying a lot with carryover_kg > 0, its predecessor lot has ci_status == CERTIFIED"
    error_id: ERR_LOT_CI_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /incentive-claims, POST /incentive-claims/{id}/resubmit, POST /production-lots/{id}/certify-ci"
  - priority: 200
    category: business_referential
    check: "Every ProductionLot named by production_lot_ids has at least one Delivery to this station with status == ACCEPTED and accepted_at inside the inclusive claim period"
    error_id: ERR_LOT_NOT_DELIVERED_IN_PERIOD
    http_status: 422
    applies_to: "POST /incentive-claims, POST /incentive-claims/{id}/resubmit"
  - priority: 205
    category: business_constraint
    check: "Station.code is unique across all Station rows; FundingAgreement.agreement_code, ProductionAsset.asset_code and PowerSupplyContract.contract_code are unique within their own tables"
    error_id: "ERR_STATION_CODE_TAKEN | ERR_CODE_TAKEN"
    http_status: 409
    applies_to: "POST /stations, POST /funding-agreements, POST /production-assets, POST /production-assets/{id}/power-supply-contracts"
  - priority: 208
    category: business_constraint
    check: "ProductionLot.lot_code is unique across all ProductionLot rows"
    error_id: ERR_LOT_CODE_TAKEN
    http_status: 409
    applies_to: "POST /production-lots"
  - priority: 210
    category: business_temporal
    check: "INCLUSIVE-DATE-RANGE exclusive overlap: no other IncentiveClaim for the same station_id and program with status NOT IN {DENIED} has an inclusive [period_start, period_end] date range intersecting the requested range"
    error_id: ERR_CLAIM_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /incentive-claims"
  - priority: 215
    category: business_temporal
    check: "No other UptimeReport for the same station_id with status == FINAL has a half-open period [period_start, period_end) intersecting the requested period"
    error_id: ERR_REPORT_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /uptime-reports, POST /uptime-reports/{id}/finalize"
  - priority: 218
    category: business_constraint
    check: "Cross-aggregate ownership: UptimeReport.funding_agreement_id equals Station.funding_agreement_id, and a Delivery's receiving_vessel_id names a PressureVessel whose station_id equals the Delivery's station_id"
    error_id: ERR_AGREEMENT_MISMATCH
    http_status: 409
    applies_to: "POST /uptime-reports, POST /deliveries"
  - priority: 220
    category: business_constraint
    check: "The count of DispenseSession rows for the station with fill_status IN {PRECOOLING, FUELING} is < Station.nozzle_count"
    error_id: ERR_NO_NOZZLE_AVAILABLE
    http_status: 409
    applies_to: "POST /dispense-sessions"
  - priority: 230
    category: business_constraint
    check: "metered_kg <= DispenseSession.planned_kg"
    error_id: ERR_METERED_EXCEEDS_PLANNED
    http_status: 422
    applies_to: "POST /dispense-sessions/{id}/complete"
  - priority: 235
    category: business_safety
    check: "target_pressure_class is supported by the station: H70 requires Station.max_pressure_class == H70"
    error_id: ERR_PRESSURE_CLASS_UNSUPPORTED
    http_status: 422
    applies_to: "POST /dispense-sessions"
  - priority: 240
    category: business_safety
    check: "receiving_vessel.current_pressure_bar + net_receipt_kg / (water_volume_l * KG_PER_L_PER_BAR) <= receiving_vessel.mawp_bar"
    error_id: ERR_VESSEL_PRESSURE_LIMIT
    http_status: 422
    applies_to: "POST /deliveries/{id}/offload"
  - priority: 245
    category: business_safety
    check: "Station.compressor_status == ONLINE whenever calculations.cascade_fill_allocation yields compressor_makeup_kg > 0"
    error_id: ERR_COMPRESSOR_OFFLINE
    http_status: 422
    applies_to: "POST /dispense-sessions/{id}/complete"
  - priority: 250
    category: business_constraint
    check: "Delivery.reschedule_count < MAX_RESCHEDULES (2)"
    error_id: ERR_RESCHEDULE_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /deliveries/{id}/reschedule"
  - priority: 260
    category: business_fiscal
    check: "The two cascade passes together can serve planned_kg without taking any vessel below its own min_residual_bar"
    error_id: ERR_CASCADE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /dispense-sessions/{id}/complete"
  - priority: 265
    category: business_fiscal
    check: "planned_kg <= Station.available_kg at session creation"
    error_id: ERR_INSUFFICIENT_AVAILABLE_INVENTORY
    http_status: 422
    applies_to: "POST /dispense-sessions"
  - priority: 270
    category: business_fiscal
    check: "Station.onsite_inventory_kg + net_receipt_kg <= Station.storage_capacity_kg"
    error_id: ERR_STORAGE_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /deliveries/{id}/offload"
  - priority: 280
    category: business_fiscal
    check: "IncentiveClaim.net_credits_mt > 0"
    error_id: ERR_NO_CREDITS_TO_ISSUE
    http_status: 422
    applies_to: "POST /incentive-claims/{id}/issue-credits"

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not a role declared in §1.7"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "Acting role is not listed in the target endpoint's roles"
  - id: ERR_STATION_OWNERSHIP_MISMATCH
    http: 403
    condition: "StationOperator's X-User-ID does not equal the station_id of the targeted resource"
  - id: ERR_STATION_NOT_FOUND
    http: 404
    condition: "Referenced Station id does not exist"
  - id: ERR_FUNDING_AGREEMENT_NOT_FOUND
    http: 404
    condition: "Referenced FundingAgreement id does not exist"
  - id: ERR_PRESSURE_VESSEL_NOT_FOUND
    http: 404
    condition: "Referenced PressureVessel id does not exist"
  - id: ERR_PRODUCTION_ASSET_NOT_FOUND
    http: 404
    condition: "Referenced ProductionAsset id does not exist"
  - id: ERR_PRODUCTION_LOT_NOT_FOUND
    http: 404
    condition: "Referenced ProductionLot id does not exist, including any element of production_lot_ids or predecessor_lot_id"
  - id: ERR_DELIVERY_NOT_FOUND
    http: 404
    condition: "Referenced Delivery id does not exist"
  - id: ERR_DISPENSE_SESSION_NOT_FOUND
    http: 404
    condition: "Referenced DispenseSession id does not exist"
  - id: ERR_SAFETY_EVENT_NOT_FOUND
    http: 404
    condition: "Referenced SafetyEvent id does not exist"
  - id: ERR_INCENTIVE_CLAIM_NOT_FOUND
    http: 404
    condition: "Referenced IncentiveClaim id does not exist"
  - id: ERR_UPTIME_REPORT_NOT_FOUND
    http: 404
    condition: "Referenced UptimeReport id does not exist, including amended_from_report_id"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Body or query fails schema validation: missing required field, wrong type, unknown enum member, out-of-range number, bad decimal precision, pagination limit outside [1,100] or negative offset, mode-conditional field present when forbidden or absent when required, or an inverted date/time range"
  - id: ERR_STALE_STATION_VERSION
    http: 412
    condition: "expected_station_version does not equal Station.version at POST /dispense-sessions"
  - id: ERR_STALE_AGREEMENT_VERSION
    http: 412
    condition: "expected_funding_agreement_version does not equal FundingAgreement.version at POST /uptime-reports"
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "The target row's current state is not a declared from-state for the requested transition, including repeating an already-applied action and acting on a terminal state"
  - id: ERR_STATION_FROZEN
    http: 409
    condition: "Station.safety_posture == FROZEN blocks the requested dispensing, offload or inspection operation"
  - id: ERR_POSTURE_RESTRICTS_H70
    http: 422
    condition: "Station.safety_posture == RESTRICTED and the session's target_pressure_class == H70"
  - id: ERR_RESPONDER_TRAINING_LAPSED
    http: 422
    condition: "Fewer than MIN_TRAINED_RESPONDERS current EMERGENCY_RESPONSE certifications at the station"
  - id: ERR_VESSEL_INSPECTION_OVERDUE
    http: 422
    condition: "The targeted PressureVessel has inspection_status IN {OVERDUE, CONDEMNED}"
  - id: ERR_LOT_NOT_RELEASED
    http: 422
    condition: "Offload attempted while the Delivery's ProductionLot.status != RELEASED"
  - id: ERR_QA_NOT_PASSED
    http: 422
    condition: "Release attempted while ProductionLot.qa_status != PASSED or ci_status != CERTIFIED"
  - id: ERR_SAMPLE_BEFORE_PRODUCTION_END
    http: 422
    condition: "PurityTest.sampled_at is earlier than the lot's production_end_at"
  - id: ERR_FILL_PROTOCOL_VIOLATION
    http: 422
    condition: "precool_temp_achieved_c is warmer than required_precool_c"
  - id: ERR_ARRIVAL_OUTSIDE_WINDOW
    http: 422
    condition: "Arrival recorded outside the half-open booked window"
  - id: ERR_OFFLOAD_BAY_CONFLICT
    http: 409
    condition: "All of the station's offload bays are already booked for an intersecting window"
  - id: ERR_POWER_CONTRACT_OVERLAP
    http: 409
    condition: "A new PowerSupplyContract interval is within CONTRACT_CHANGEOVER_BUFFER_HOURS of an existing interval on the same asset"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "The acting X-User-ID already performed the incompatible preceding step (tested the lot, opened the safety event, or submitted the claim)"
  - id: ERR_NO_POWER_CONTRACT
    http: 422
    condition: "No PowerSupplyContract of the lot's asset covers production_end_at"
  - id: ERR_LOT_CI_NOT_CERTIFIED
    http: 422
    condition: "A referenced ProductionLot (claim lot or predecessor lot) has ci_status != CERTIFIED"
  - id: ERR_LOT_NOT_DELIVERED_IN_PERIOD
    http: 422
    condition: "A claimed ProductionLot has no ACCEPTED Delivery to this station inside the claim period"
  - id: ERR_STATION_CODE_TAKEN
    http: 409
    condition: "Station.code already exists"
  - id: ERR_CODE_TAKEN
    http: 409
    condition: "FundingAgreement.agreement_code, ProductionAsset.asset_code or PowerSupplyContract.contract_code already exists"
  - id: ERR_LOT_CODE_TAKEN
    http: 409
    condition: "ProductionLot.lot_code already exists"
  - id: ERR_CLAIM_PERIOD_OVERLAP
    http: 409
    condition: "Another non-DENIED IncentiveClaim for the same station and program covers an intersecting inclusive date range"
  - id: ERR_REPORT_PERIOD_OVERLAP
    http: 409
    condition: "Another FINAL UptimeReport for the same station covers an intersecting half-open period"
  - id: ERR_AGREEMENT_MISMATCH
    http: 409
    condition: "UptimeReport.funding_agreement_id differs from Station.funding_agreement_id, or a Delivery's receiving vessel belongs to a station other than the Delivery's station"
  - id: ERR_NO_NOZZLE_AVAILABLE
    http: 409
    condition: "Every nozzle is already occupied by a PRECOOLING or FUELING session"
  - id: ERR_METERED_EXCEEDS_PLANNED
    http: 422
    condition: "metered_kg exceeds the session's planned_kg"
  - id: ERR_PRESSURE_CLASS_UNSUPPORTED
    http: 422
    condition: "H70 requested at a station whose max_pressure_class is H35"
  - id: ERR_VESSEL_PRESSURE_LIMIT
    http: 422
    condition: "Offload would push the receiving vessel above its mawp_bar"
  - id: ERR_COMPRESSOR_OFFLINE
    http: 422
    condition: "Compressor makeup is required but Station.compressor_status == OFFLINE"
  - id: ERR_RESCHEDULE_LIMIT_REACHED
    http: 409
    condition: "Delivery.reschedule_count already equals MAX_RESCHEDULES"
  - id: ERR_CASCADE_INSUFFICIENT
    http: 422
    condition: "Cascade plus compressor makeup cannot serve planned_kg without breaching a vessel's min_residual_bar"
  - id: ERR_INSUFFICIENT_AVAILABLE_INVENTORY
    http: 422
    condition: "planned_kg exceeds Station.available_kg at session creation"
  - id: ERR_STORAGE_CAPACITY_EXCEEDED
    http: 422
    condition: "Offload would push Station.onsite_inventory_kg above storage_capacity_kg"
  - id: ERR_NO_CREDITS_TO_ISSUE
    http: 422
    condition: "issue-credits attempted while net_credits_mt == 0.000"

