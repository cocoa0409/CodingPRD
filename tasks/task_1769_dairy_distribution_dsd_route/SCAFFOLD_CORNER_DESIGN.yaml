        distinguishing_aspect: "submit-offer on DRAFT fails; seller self-offer fails with ERR_SELF_DEALING; reject-offer cycles OFFER_PENDING back to LISTED with buyer fields cleared and allows a NEW offer; withdraw from LISTED terminates; publish on WITHDRAWN fails."
        test_recipe:
          setup: ["Distributors D1 (seller) and D2 (buyer); route R1 ACTIVE owned by D1 with store; listing L1 DRAFT"]
