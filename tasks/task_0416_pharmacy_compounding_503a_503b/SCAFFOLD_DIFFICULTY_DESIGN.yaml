  # ===========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: yield_variance_band_inclusive_upper_boundary_compile
        grounds:
          - calculations.yield_reconciliation
          - validations[priority=12]
          - errors[ERR_YIELD_OUT_OF_RANGE]
          - state_machines.CompoundingBatch.IN_PROCESS_to_COMPILED
        distinguishing_aspect: |
          On POST /compounding-batches/{bid}/compile: actual_yield_units=106 against
          theoretical 100 gives variance +6.00 which is just over the inclusive
          +5.00 band, so compile is rejected with ERR_YIELD_OUT_OF_RANGE (422); this
          is the numeric-threshold boundary metric (variance band, >= vs >), reached
          via the compile endpoint.
        test_recipe:
          setup:
            - "503A facility, nonsterile MFR theoretical_yield_units=100, PRESCRIPTION batch started, ready to compile."
          setup_api_calls:
            - call: "POST /pharmacy-compounding/facilities"
