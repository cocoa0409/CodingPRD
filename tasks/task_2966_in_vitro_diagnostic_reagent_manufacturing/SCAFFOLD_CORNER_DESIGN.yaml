            - "complaint C, still NEW, answers the priority 60 ERR_COMPLAINT_STATE_INVALID rather than the priority 96 justification error, because the state gate is evaluated first"

      - name: retest_window_at_priority_104_is_evaluated_before_the_retest_count_limit_at_priority_106
        claim_type: Priority Ordering
        grounds:
          - validations.priority_104_ERR_RETEST_WINDOW_EXPIRED
          - validations.priority_106_ERR_MAX_RETESTS_EXCEEDED
          - errors.ERR_RETEST_WINDOW_EXPIRED
          - errors.ERR_MAX_RETESTS_EXCEEDED
        distinguishing_aspect: "The window is measured from first_oos_at and its far edge is INCLUSIVE, so a retest recorded at exactly first_oos_at plus retest_window_days must be accepted while one instant later it is refused. A lot that is both outside the window and already at max_retests must answer the window error, which is the only way to see which of the two checks ran first."
