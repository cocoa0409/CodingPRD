            - "Provider.${prov_id}.outstanding_forfeiture_cents == 4125000"

  - rule_id: combinatorial_formula
    instances:
      - name: attestation_ladder_nonlinear_precedence_over_four_inputs
        grounds:
          - calculations.attestation_level_assignment
          - entities.CallAttestation.fields.attestation_reason_code
          - entities.CallAttestation.fields.risk_tier_at_signing
          - entities.Customer.fields.risk_tier
        distinguishing_aspect: |
          Mode (a): four inputs (Provider.auth_posture, Customer.risk_tier,
          Customer.kyc_evidence_level, NumberAssignment.ownership_evidence) interact
          non-linearly — a customer with BUSINESS_REGISTRY_VERIFIED KYC and
          DIRECT_ALLOCATION ownership, which alone yields level A, is forced to level C
          with reason RISK_DOWNGRADE because risk_tier HIGH short-circuits the ladder
          before the KYC branches are ever evaluated.
        test_recipe:
          setup:
            - "Provider with ACTIVE certificate and ACCEPTED plan, auth_posture FULL_ATTESTATION"
            - "Customer BUSINESS_REGISTRY_VERIFIED, kyc VERIFIED, origination ENABLED, owning +12025550111 by DIRECT_ALLOCATION from 2026-07-01T00:00:00Z"
            - "One traffic observation window [2026-07-01T00:00:00Z, 2026-07-02T00:00:00Z] with 1000 attempts, 1000 short, 600 unanswered, 9 complaints, giving window_subscore 0.75 and traffic_risk_index 0.7500 (risk_tier HIGH)"
            - "Logical clock at the 2026-08-01T00:00:00Z default"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: Regulator
            - call: "POST /rmd/providers"
              payload: { legal_name: "Cascadia Voice Inc", provider_type: "FACILITIES_BASED" }
              as: Regulator
              captures: { prov_id: $.data.id }
            - call: "POST /rmd/certificates"
              payload: { provider_id: "${prov_id}", spc_token: "SPC-0003", public_key_fingerprint: "fp-0003", not_before: "2026-07-01T00:00:00Z", not_after: "2027-07-01T00:00:00Z" }
              as: PolicyAdministrator
              captures: { cert_id: $.data.id }
            - call: "POST /rmd/certificates/${cert_id}/issue"
              payload: {}
              as: PolicyAdministrator
            - call: "POST /rmd/certificates/${cert_id}/activate"
              payload: {}
              as: ProviderAdmin
              as_user_id: "${prov_id}"
            - call: "GET /rmd/providers/${prov_id}"
              payload: {}
              as: Regulator
              captures: { prov_v0: $.data.version }
            - call: "POST /rmd/mitigation-plans"
              payload: { provider_id: "${prov_id}", prevention_practices: ["KYC_ONBOARDING", "TRACEBACK_COOPERATION", "TRAFFIC_PATTERN_MONITORING"], expected_provider_version: "${prov_v0}" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { plan_id: $.data.id }
            - call: "POST /rmd/mitigation-plans/${plan_id}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /rmd/mitigation-plans/${plan_id}/decision"
              payload: { decision: "ACCEPT" }
              as: Regulator
            - call: "POST /rmd/customers"
              payload: { provider_id: "${prov_id}", legal_name: "Zephyr Dialing LLC", contact_email: "ops@zephyr.example", kyc_evidence_level: "BUSINESS_REGISTRY_VERIFIED" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { cust_id: $.data.id }
            - call: "POST /rmd/customers/${cust_id}/kyc-submit"
              payload: {}
              as: KycAnalyst
              as_user_id: "kyc-1"
            - call: "POST /rmd/customers/${cust_id}/kyc-decision"
              payload: { decision: "VERIFY" }
              as: KycAnalyst
              as_user_id: "kyc-2"
            - call: "POST /rmd/customers/${cust_id}/origination-actions"
              payload: { action: "ENABLE" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
            - call: "POST /rmd/number-assignments"
              payload: { provider_id: "${prov_id}", customer_id: "${cust_id}", telephone_number: "+12025550111", ownership_evidence: "DIRECT_ALLOCATION", effective_from: "2026-07-01T00:00:00Z" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
            - call: "POST /rmd/traffic-observations"
              payload: { provider_id: "${prov_id}", customer_id: "${cust_id}", window_start: "2026-07-01T00:00:00Z", window_end: "2026-07-02T00:00:00Z", total_call_count: 1000, short_duration_call_count: 1000, unanswered_call_count: 600, complaint_count: 9 }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { obs_id: $.data.id }
          trigger:
            - call: "POST /rmd/call-attestations"
              payload: { provider_id: "${prov_id}", customer_id: "${cust_id}", calling_number: "+12025550111", called_number: "+12025550999", origination_time: "2026-08-01T00:00:00Z" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { att_id: $.data.id }
          assert:
            - "TrafficObservation.${obs_id}.window_subscore == 0.75"
            - "Customer.${cust_id}.traffic_risk_index == 0.7500"
            - "Customer.${cust_id}.risk_tier == HIGH"
            - "Customer.${cust_id}.origination_state == ENABLED"
            - "CallAttestation.${att_id}.attestation_level == C"
            - "CallAttestation.${att_id}.attestation_reason_code == RISK_DOWNGRADE"
            - "CallAttestation.${att_id}.ownership_verified == true"
            - "CallAttestation.${att_id}.risk_tier_at_signing == HIGH"

      - name: risk_index_rounds_per_window_before_recency_weighting
        grounds:
          - calculations.customer_traffic_risk_index
          - entities.TrafficObservation.fields.window_subscore
          - entities.TrafficObservation.fields.resulting_risk_index
          - entities.Customer.fields.traffic_risk_index
        distinguishing_aspect: |
          Mode (b): the scaffold pins round-per-window-then-weight, so three windows
          with subscores 0.62, 0.38 (raw 0.383333...) and 1.00 give
          traffic_risk_index 0.7380, whereas weighting the unrounded raw values and
          rounding last gives 0.7390 — the two orders are distinguishable by a
          0.0010 difference on the same three rows.
        test_recipe:
          setup:
            - "Provider and one kyc-VERIFIED, origination-ENABLED customer (no certificate needed: no call is signed)"
            - "Observation A over [2026-07-01T00:00:00Z, 2026-07-02T00:00:00Z] with 1000/800/600/5 -> subscore 0.62"
            - "Observation B over [2026-07-03T00:00:00Z, 2026-07-04T00:00:00Z] with 3/1/2/0 -> raw 0.383333, stored subscore 0.38"
            - "Logical clock at the 2026-08-01T00:00:00Z default so every window is in the past"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: Regulator
            - call: "POST /rmd/providers"
              payload: { legal_name: "Meridian Voice Co", provider_type: "NON_FACILITIES_RESELLER" }
              as: Regulator
              captures: { prov_id: $.data.id }
            - call: "POST /rmd/customers"
              payload: { provider_id: "${prov_id}", legal_name: "Halcyon Contact Center", contact_email: "ops@halcyon.example", kyc_evidence_level: "CONTRACT_ONLY" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { cust_id: $.data.id }
            - call: "POST /rmd/customers/${cust_id}/kyc-submit"
              payload: {}
              as: KycAnalyst
