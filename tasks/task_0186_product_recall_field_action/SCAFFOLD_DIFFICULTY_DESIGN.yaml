              payload: { name: "CCE", contact_channel: "EMAIL", contact_address: "ce@x.com" }
              as: FieldServiceAgent
              captures: { cust: $.data.id }
            - call: "POST /units"
              payload: { lot_id: "${lot}", serial_number: 9, customer_id: "${cust}", sale_price_cents: 4000 }
              as: FieldServiceAgent
              captures: { unit: $.data.id }
            - call: "POST /recalls"
              payload: { product_id: "${prod}", reason: "buckle", hazard_severity: "SERIOUS", injury_reported: false }
              as: RecallCoordinator
              captures: { rc: $.data.id, rc_v0: $.data.version }
            - call: "POST /recalls/${rc}/affected-lots"
              payload: { lot_id: "${lot}", expected_recall_version: "${rc_v0}" }
              as: RecallCoordinator
            - call: "POST /recalls/${rc}/classify"
              payload: {}
              as: RecallCoordinator
              captures: { rc_v2: $.data.version }
          trigger:
            - call: "GET /recalls/${rc}"
              payload: {}
              as: FieldServiceAgent
              captures: { rcv_d15: $.data.version }
            - call: "POST /dispositions"
              payload: { recall_id: "${rc}", unit_id: "${unit}", disposition_type: "RETURN", expected_recall_version: "${rcv_d15}" }
              as: FieldServiceAgent
              captures: { err: $.data.error_id }
