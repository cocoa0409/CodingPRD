scaffold_corner_design:
  - section: entities
    instances:
      - name: barrel_create_missing_fill_volume_returns_validation
        claim_type: required_fields
        grounds:
          - "entities.Barrel.fields.fill_volume_liters"
          - "errors[ERR_VALIDATION]"
          - "validations[priority=3]"
        distinguishing_aspect: "Omitting the required input fill_volume_liters on barrel creation is rejected with ERR_VALIDATION (400); no barrel is persisted."
        test_recipe:
          setup: ["Rickhouse 1x1x1 commissioned; one free slot."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /barrel-aging/expansion-projects"
              payload: { name: "RH-E1", region_code: "KY", floors: 1, rows_per_floor: 1, positions_per_row: 1, construction_lag_months: 24, planned_annual_distillation_liters: 50000 }
              as: DistilleryPlanner
              captures: { proj_id: $.data.id }
            - { call: "POST /barrel-aging/expansion-projects/${proj_id}/approve", as: OperationsDirector }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2028-08-21T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /barrel-aging/expansion-projects/${proj_id}/commission", as: OperationsDirector }
            - { call: "GET /barrel-aging/rickhouses?expansion_project_id=${proj_id}", as: PlatformAdmin, captures: { rh_id: "$.data[0].id" } }
            - { call: "GET /barrel-aging/rickhouses/${rh_id}/slots", as: PlatformAdmin, captures: { slot_a: "$.data[0].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2028-09-01T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - call: "POST /barrel-aging/barrels"
              payload: { slot_id: "${slot_a}", wood_origin: "AMERICAN_WHITE_OAK", seasoning_months: 12, char_level: 3, spirit_type: "BOURBON", fill_proof: 125.0, min_maturation_months: 48 }
              as: WarehouseManager
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_VALIDATION"
            - "GET /barrel-aging/barrels afterwards returns total_count == 0"

      - name: barrel_create_char_level_out_of_range_rejected
        claim_type: type_constraints
        grounds:
          - "entities.Barrel.fields.char_level"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "char_level is constrained to [1,4]; char_level 5 is rejected with ERR_VALIDATION before any state change."
        test_recipe:
          setup: ["Rickhouse 1x1x1 commissioned; one free slot."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /barrel-aging/expansion-projects"
              payload: { name: "RH-E2", region_code: "KY", floors: 1, rows_per_floor: 1, positions_per_row: 1, construction_lag_months: 24, planned_annual_distillation_liters: 50000 }
              as: DistilleryPlanner
              captures: { proj_id: $.data.id }
            - { call: "POST /barrel-aging/expansion-projects/${proj_id}/approve", as: OperationsDirector }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2028-08-21T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /barrel-aging/expansion-projects/${proj_id}/commission", as: OperationsDirector }
            - { call: "GET /barrel-aging/rickhouses?expansion_project_id=${proj_id}", as: PlatformAdmin, captures: { rh_id: "$.data[0].id" } }
            - { call: "GET /barrel-aging/rickhouses/${rh_id}/slots", as: PlatformAdmin, captures: { slot_a: "$.data[0].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2028-09-01T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - call: "POST /barrel-aging/barrels"
              payload: { slot_id: "${slot_a}", wood_origin: "AMERICAN_WHITE_OAK", seasoning_months: 12, char_level: 5, spirit_type: "BOURBON", fill_proof: 125.0, fill_volume_liters: 200.0, min_maturation_months: 48 }
              as: WarehouseManager
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_VALIDATION"
            - "the slot still has zero occupancies afterwards"

      - name: barrel_create_undeclared_computed_field_rejected
        claim_type: computed_fields
        grounds:
          - "entities.Barrel.fields.current_volume_ledger_liters"
          - "validations[priority=3]"
        distinguishing_aspect: "Client-supplied values for computed fields (current_volume_ledger_liters) are undeclared input and rejected with ERR_VALIDATION; the computed ledger is never settable."
        test_recipe:
          setup: ["Rickhouse 1x1x1 commissioned; one free slot."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /barrel-aging/expansion-projects"
              payload: { name: "RH-E3", region_code: "KY", floors: 1, rows_per_floor: 1, positions_per_row: 1, construction_lag_months: 24, planned_annual_distillation_liters: 50000 }
              as: DistilleryPlanner
              captures: { proj_id: $.data.id }
            - { call: "POST /barrel-aging/expansion-projects/${proj_id}/approve", as: OperationsDirector }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2028-08-21T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /barrel-aging/expansion-projects/${proj_id}/commission", as: OperationsDirector }
            - { call: "GET /barrel-aging/rickhouses?expansion_project_id=${proj_id}", as: PlatformAdmin, captures: { rh_id: "$.data[0].id" } }
            - { call: "GET /barrel-aging/rickhouses/${rh_id}/slots", as: PlatformAdmin, captures: { slot_a: "$.data[0].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2028-09-01T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - call: "POST /barrel-aging/barrels"
              payload: { slot_id: "${slot_a}", wood_origin: "AMERICAN_WHITE_OAK", seasoning_months: 12, char_level: 3, spirit_type: "BOURBON", fill_proof: 125.0, fill_volume_liters: 200.0, min_maturation_months: 48, current_volume_ledger_liters: 1.0 }
              as: WarehouseManager
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_VALIDATION (undeclared field present)"

      - name: barrel_create_initial_state_and_system_fields
        claim_type: system_fields
        grounds:
          - "entities.Barrel.fields.fill_date"
          - "entities.Barrel.fields.maturation_status"
          - "state_machines.Barrel(maturation_status).FILLED_to_AGING"
          - "entities.SlotOccupancy.fields.move_reason"
        distinguishing_aspect: "A created barrel is server-stamped (UUID id, version 1, fill_date == logical clock), starts maturation AGING (FILLED -> AGING fires within the create request) with custody BONDED, both volume variants equal the fill volume, and exactly one OPEN INITIAL_FILL occupancy exists on the requested slot."
        test_recipe:
          setup: ["Rickhouse 1x1x1 commissioned; clock at 2028-09-01."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /barrel-aging/expansion-projects"
              payload: { name: "RH-E4", region_code: "KY", floors: 1, rows_per_floor: 1, positions_per_row: 1, construction_lag_months: 24, planned_annual_distillation_liters: 50000 }
              as: DistilleryPlanner
              captures: { proj_id: $.data.id }
            - { call: "POST /barrel-aging/expansion-projects/${proj_id}/approve", as: OperationsDirector }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2028-08-21T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /barrel-aging/expansion-projects/${proj_id}/commission", as: OperationsDirector }
            - { call: "GET /barrel-aging/rickhouses?expansion_project_id=${proj_id}", as: PlatformAdmin, captures: { rh_id: "$.data[0].id" } }
            - { call: "GET /barrel-aging/rickhouses/${rh_id}/slots", as: PlatformAdmin, captures: { slot_a: "$.data[0].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2028-09-01T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - call: "POST /barrel-aging/barrels"
              payload: { slot_id: "${slot_a}", wood_origin: "AMERICAN_WHITE_OAK", seasoning_months: 12, char_level: 3, spirit_type: "BOURBON", fill_proof: 125.0, fill_volume_liters: 200.0, min_maturation_months: 48 }
              as: WarehouseManager
              captures: { b_id: $.data.id }
            - { call: "GET /barrel-aging/barrels/${b_id}/occupancies", as: WarehouseManager }
          assert:
            - "Barrel.${b_id}.version == 1 and id is a server-minted UUID"
            - "Barrel.${b_id}.fill_date == 2028-09-01T00:00:00Z (logical clock, not wall clock)"
            - "Barrel.${b_id}.maturation_status == AGING and custody_status == BONDED"
            - "Barrel.${b_id}.current_volume_ledger_liters == 200.00 and current_volume_statutory_liters == 200.00 (no elapsed blocks)"
            - "exactly one SlotOccupancy exists for the barrel: status OPEN, move_reason INITIAL_FILL, slot_id == ${slot_a}, start_at == 2028-09-01T00:00:00Z"

      - name: barrel_get_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - "errors[ERR_NOT_FOUND]"
          - "validations[priority=4]"
        distinguishing_aspect: "Reading a barrel by a well-formed but non-existent UUID returns ERR_NOT_FOUND (404) with the error envelope."
        test_recipe:
          setup: ["Empty database; default clock."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - call: "GET /barrel-aging/barrels/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: WarehouseManager
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_NOT_FOUND"

      - name: barrels_list_paginates_with_total_count
        claim_type: listing
        grounds:
          - "response_envelope"
          - "endpoints"
        distinguishing_aspect: "GET /barrel-aging/barrels honors limit/offset and reports total_count and has_more: 3 barrels with limit=2 returns 2 items, total_count 3, has_more true."
        test_recipe:
          setup: ["Rickhouse 1x1x3 commissioned; three barrels filled at 2028-09-01."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /barrel-aging/expansion-projects"
              payload: { name: "RH-E6", region_code: "KY", floors: 1, rows_per_floor: 1, positions_per_row: 3, construction_lag_months: 24, planned_annual_distillation_liters: 50000 }
              as: DistilleryPlanner
              captures: { proj_id: $.data.id }
            - { call: "POST /barrel-aging/expansion-projects/${proj_id}/approve", as: OperationsDirector }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2028-08-21T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /barrel-aging/expansion-projects/${proj_id}/commission", as: OperationsDirector }
            - { call: "GET /barrel-aging/rickhouses?expansion_project_id=${proj_id}", as: PlatformAdmin, captures: { rh_id: "$.data[0].id" } }
            - { call: "GET /barrel-aging/rickhouses/${rh_id}/slots", as: PlatformAdmin, captures: { s1: "$.data[0].id", s2: "$.data[1].id", s3: "$.data[2].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2028-09-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /barrel-aging/barrels"
              payload: { slot_id: "${s1}", wood_origin: "AMERICAN_WHITE_OAK", seasoning_months: 12, char_level: 3, spirit_type: "BOURBON", fill_proof: 125.0, fill_volume_liters: 100.0, min_maturation_months: 12 }
              as: WarehouseManager
            - call: "POST /barrel-aging/barrels"
              payload: { slot_id: "${s2}", wood_origin: "AMERICAN_WHITE_OAK", seasoning_months: 12, char_level: 3, spirit_type: "RYE", fill_proof: 110.0, fill_volume_liters: 100.0, min_maturation_months: 12 }
              as: WarehouseManager
            - call: "POST /barrel-aging/barrels"
              payload: { slot_id: "${s3}", wood_origin: "AMERICAN_WHITE_OAK", seasoning_months: 12, char_level: 3, spirit_type: "BOURBON", fill_proof: 125.0, fill_volume_liters: 100.0, min_maturation_months: 12 }
              as: WarehouseManager
          trigger:
            - { call: "GET /barrel-aging/barrels?limit=2&offset=0", as: WarehouseManager }
          assert:
            - "response contains exactly 2 data items, total_count == 3, has_more == true"

      - name: assessment_quality_score_omitted_defaults_null
        claim_type: defaults
        grounds:
          - "entities.BarrelAssessment.fields.quality_score"
        distinguishing_aspect: "quality_score is optional; an EVAPORATION_READING created without it persists and returns quality_score == null."
        test_recipe:
          setup: ["Rickhouse 1x1x1 commissioned; barrel filled 2028-09-01 with 200.0 L."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /barrel-aging/expansion-projects"
              payload: { name: "RH-E7", region_code: "KY", floors: 1, rows_per_floor: 1, positions_per_row: 1, construction_lag_months: 24, planned_annual_distillation_liters: 50000 }
              as: DistilleryPlanner
              captures: { proj_id: $.data.id }
            - { call: "POST /barrel-aging/expansion-projects/${proj_id}/approve", as: OperationsDirector }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2028-08-21T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /barrel-aging/expansion-projects/${proj_id}/commission", as: OperationsDirector }
            - { call: "GET /barrel-aging/rickhouses?expansion_project_id=${proj_id}", as: PlatformAdmin, captures: { rh_id: "$.data[0].id" } }
            - { call: "GET /barrel-aging/rickhouses/${rh_id}/slots", as: PlatformAdmin, captures: { slot_a: "$.data[0].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2028-09-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /barrel-aging/barrels"
              payload: { slot_id: "${slot_a}", wood_origin: "AMERICAN_WHITE_OAK", seasoning_months: 12, char_level: 3, spirit_type: "BOURBON", fill_proof: 125.0, fill_volume_liters: 200.0, min_maturation_months: 48 }
              as: WarehouseManager
              captures: { b_id: $.data.id }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2029-01-01T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - call: "POST /barrel-aging/barrels/${b_id}/assessments"
              payload: { kind: "EVAPORATION_READING", measured_volume_liters: 195.0 }
              as: WarehouseManager
          assert:
            - "the created BarrelAssessment has quality_score == null and measured_volume_liters == 195.00"
            - "Barrel.${b_id}.current_volume_ledger_liters == 195.00"

      - name: slot_heat_factor_computed_per_floor
        claim_type: computed_fields
        grounds:
          - "entities.WarehouseSlot.fields.heat_factor"
        excluded_because:
          difficulty_instance: statutory_evaporation_multi_factor_rate
          rationale: "That instance asserts WarehouseSlot heat_factor == 1.05 for floor_index 2 and uses it in the evaporation computation."

  - section: state_machines
    instances:
      - name: dump_already_dumped_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.Barrel(maturation_status)"
          - "errors[ERR_INVALID_STATE_TRANSITION]"
        distinguishing_aspect: "DUMPED is terminal for the maturation dimension: a second dump is rejected with ERR_INVALID_STATE_TRANSITION and no further side effects fire."
        test_recipe:
          setup: ["Rickhouse 1x1x1 commissioned; barrel filled 2028-09-01; barrel dumped at 2028-09-02."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /barrel-aging/expansion-projects"
              payload: { name: "RH-S1", region_code: "KY", floors: 1, rows_per_floor: 1, positions_per_row: 1, construction_lag_months: 24, planned_annual_distillation_liters: 50000 }
              as: DistilleryPlanner
              captures: { proj_id: $.data.id }
            - { call: "POST /barrel-aging/expansion-projects/${proj_id}/approve", as: OperationsDirector }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2028-08-21T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /barrel-aging/expansion-projects/${proj_id}/commission", as: OperationsDirector }
            - { call: "GET /barrel-aging/rickhouses?expansion_project_id=${proj_id}", as: PlatformAdmin, captures: { rh_id: "$.data[0].id" } }
            - { call: "GET /barrel-aging/rickhouses/${rh_id}/slots", as: PlatformAdmin, captures: { slot_a: "$.data[0].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2028-09-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /barrel-aging/barrels"
              payload: { slot_id: "${slot_a}", wood_origin: "AMERICAN_WHITE_OAK", seasoning_months: 12, char_level: 3, spirit_type: "BOURBON", fill_proof: 125.0, fill_volume_liters: 200.0, min_maturation_months: 48 }
              as: WarehouseManager
              captures: { b_id: $.data.id }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2028-09-02T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /barrel-aging/barrels/${b_id}/dump", as: WarehouseManager }
          trigger:
            - call: "POST /barrel-aging/barrels/${b_id}/dump"
              as: WarehouseManager
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_INVALID_STATE_TRANSITION"
            - "Barrel.${b_id}.maturation_status == DUMPED and version unchanged by the rejected call"

      - name: withdraw_before_dump_join_gate
        claim_type: invalid_transition
        grounds:
          - "state_machines.Barrel(custody_status).BONDED_to_WITHDRAWN"
        excluded_because:
          difficulty_instance: barrel_parallel_maturation_and_custody_dimensions
          rationale: "Asserted there as the join-gate failure path (withdraw before dump returns ERR_INVALID_STATE_TRANSITION)."

      - name: file_open_report_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - "state_machines.BondedPeriodReport.OPEN_to_RECONCILED"
          - "errors[ERR_INVALID_STATE_TRANSITION]"
        distinguishing_aspect: "Filing is only valid from RECONCILED or AMENDED; filing an OPEN report is rejected."
        test_recipe:
          setup: ["Report with period [2026-01-01, 2026-07-01) created at the default clock 2026-09-01 (still OPEN, never reconciled)."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /barrel-aging/bonded-reports"
              payload: { period_start: "2026-01-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }
              as: BondedPreparer
              captures: { rep_id: $.data.id }
          trigger:
            - call: "POST /barrel-aging/bonded-reports/${rep_id}/file"
              as: BondedPreparer
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_INVALID_STATE_TRANSITION"
            - "BondedPeriodReport.${rep_id}.state == OPEN"

      - name: revise_proposed_batch_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - "state_machines.BlendBatch.VALIDATED_to_PROPOSED"
          - "errors[ERR_INVALID_STATE_TRANSITION]"
        distinguishing_aspect: "The revision loop only runs VALIDATED -> PROPOSED; revising a batch that is already PROPOSED is rejected."
        test_recipe:
          setup: ["Label registered; batch created at clock 2028-09-01 with scheduled_bottling_date 2030-09-01 (still PROPOSED). No rickhouse or barrel needed."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /barrel-aging/labels"
              payload: { name: "Rev Loop", age_statement_years: 1, spirit_type: "BOURBON" }
              as: MasterBlender
              captures: { lbl_id: $.data.id }
          trigger:
            - call: "POST /barrel-aging/blend-batches"
              payload: { label_id: "${lbl_id}", scheduled_bottling_date: "2030-09-01T00:00:00Z" }
              as: MasterBlender
              captures: { bb_id: $.data.id }
            - call: "POST /barrel-aging/blend-batches/${bb_id}/revise"
              as: MasterBlender
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_INVALID_STATE_TRANSITION"
            - "BlendBatch.${bb_id}.state == PROPOSED"

      - name: consume_released_reservation_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - "state_machines.BarrelReservation.ACTIVE_to_CONSUMED"
          - "errors[ERR_INVALID_STATE_TRANSITION]"
        distinguishing_aspect: "RELEASED is terminal; consuming a released reservation is rejected even though the barrel itself is still eligible."
        test_recipe:
          setup: ["Rickhouse 1x1x1 commissioned; barrel min_maturation_months 0 (MATURE_ELIGIBLE); program required_barrel_count 1, window 45 days; reservation created then released."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /barrel-aging/expansion-projects"
              payload: { name: "RH-S5", region_code: "KY", floors: 1, rows_per_floor: 1, positions_per_row: 1, construction_lag_months: 24, planned_annual_distillation_liters: 50000 }
              as: DistilleryPlanner
              captures: { proj_id: $.data.id }
            - { call: "POST /barrel-aging/expansion-projects/${proj_id}/approve", as: OperationsDirector }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2028-08-21T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /barrel-aging/expansion-projects/${proj_id}/commission", as: OperationsDirector }
            - { call: "GET /barrel-aging/rickhouses?expansion_project_id=${proj_id}", as: PlatformAdmin, captures: { rh_id: "$.data[0].id" } }
            - { call: "GET /barrel-aging/rickhouses/${rh_id}/slots", as: PlatformAdmin, captures: { slot_a: "$.data[0].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2028-09-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /barrel-aging/barrels"
              payload: { slot_id: "${slot_a}", wood_origin: "AMERICAN_WHITE_OAK", seasoning_months: 12, char_level: 3, spirit_type: "BOURBON", fill_proof: 125.0, fill_volume_liters: 200.0, min_maturation_months: 0 }
              as: WarehouseManager
              captures: { b_id: $.data.id }
            - call: "POST /barrel-aging/private-selection-programs"
