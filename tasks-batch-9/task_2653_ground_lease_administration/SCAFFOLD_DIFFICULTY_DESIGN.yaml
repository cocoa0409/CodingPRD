              as: GroundTenant
              as_user_id: "${lessee_id}"
            - call: "POST /portfolio/rent-revaluations/${reval_id}/arbitration-referrals"
              payload: { arbitrator_user_id: "arb-neutral-1", hearing_date: "2027-07-01T00:00:00Z" }
              as: LessorAdmin
              captures: { arb_id: $.data.id }
          assert:
            - "after setup: RentRevaluation.${reval_id}.status == PROPOSALS_EXCHANGED with divergence_bps 4000 and Lease.${lease_id}.lease_status == IN_DEFAULT, rent_status == REVALUATION_OPEN"
            - "trigger[0] returns ERR_CROSS_ENTITY_BLOCKED (409); no ArbitrationProceeding row exists and the revaluation stays PROPOSALS_EXCHANGED"
            - "after trigger[1]: Lease.${lease_id}.lease_status == ACTIVE, arrears_balance_cents == 0, rent_status still REVALUATION_OPEN"
            - "trigger[2] returns 201 with ArbitrationProceeding.${arb_id}.status == REFERRED and arbitrator_user_id 'arb-neutral-1'"
            - "after trigger[2]: RentRevaluation.${reval_id}.status == ARBITRATION_REFERRED and Lease.${lease_id}.rent_status == IN_ARBITRATION"
            - "GET /portfolio/arbitrations?revaluation_id=${reval_id} returns exactly one row"

      - name: alteration_approval_blocked_until_the_casualty_election_is_made
        grounds:
          - validations.priority_9_cross_entity
          - state_machines.LossEvent.REPORTED_to_ADJUSTED
          - state_machines.LossEvent.ADJUSTED_to_RESTORATION_ELECTED
          - state_machines.AlterationRequest.SUBMITTED_to_APPROVED
          - entities.Lease.fields.gfa_allocated_sqft
        distinguishing_aspect: |
          The guard is state-specific rather than entity-specific: an open CASUALTY blocks the approval in
          both REPORTED and ADJUSTED, and only the tenant's restoration election clears it. The same
          approve call is therefore refused twice for the same reason with the loss event in two different
          states, then succeeds once the event reaches RESTORATION_ELECTED, and the development envelope
          must stay at 0 for both refusals.
        test_recipe:
          setup:
            - "Clock at its 2026-08-01T00:00:00Z default."
            - "One lease with total_permitted_gfa_sqft 200000, permitted_use_code RETAIL_MIXED and nothing allocated."
            - "One SUBMITTED COSMETIC alteration for 10000 sqft in window 2027-01-01 to 2027-06-01."
            - "One CASUALTY loss event in status REPORTED with damage 1000000, far below the CASUALTY_TERMINATION_THRESHOLD_BPS trigger."
          setup_api_calls:
            - call: "POST /portfolio/lessees"
              payload: { legal_name: "Harborline Retail Holdings LLC", notice_email: "notices@harborline.example", credit_rating_code: "A" }
              as: LessorAdmin
              captures: { lessee_id: $.data.id }
            - call: "POST /portfolio/leases"
              payload: { lessee_id: "${lessee_id}", premises_code: "PIER-59", commencement_date: "2020-01-01T00:00:00Z", expiration_date: "2070-01-01T00:00:00Z", initial_annual_base_rent_cents: 10000000, revaluation_interval_years: 5, reval_collar_min_uplift_bps: 1000, reval_collar_max_uplift_bps: 5000, percentage_rent_rate_bps: 600, percentage_rent_breakpoint_cents: 100000000, permitted_use_code: "RETAIL_MIXED", total_permitted_gfa_sqft: 200000, improvements_value_cents: 60000000, reversion_land_value_cents: 40000000, reversion_standard_code: "SHELL_CONDITION", security_deposit_cents: 5000000 }
              as: LessorAdmin
              captures: { lease_id: $.data.id }
            - call: "POST /portfolio/leases/${lease_id}/alteration-requests"
              payload: { scope_code: "COSMETIC", proposed_use_code: "RETAIL_MIXED", requested_gfa_sqft: 10000, construction_window_start: "2027-01-01T00:00:00Z", construction_window_end: "2027-06-01T00:00:00Z", estimated_cost_cents: 1000000 }
              as: GroundTenant
              as_user_id: "${lessee_id}"
              captures: { alt_id: $.data.id }
            - call: "POST /portfolio/leases/${lease_id}/loss-events"
              payload: { event_type: "CASUALTY", scope_code: "PARTIAL", occurred_at: "2026-07-15T00:00:00Z", damage_estimate_cents: 1000000, damaged_area_sqft: 500 }
              as: GroundTenant
              as_user_id: "${lessee_id}"
              captures: { loss_id: $.data.id }
          trigger:
            - call: "POST /portfolio/alteration-requests/${alt_id}/decision"
              payload: { decision: "APPROVE" }
              as: AssetManager
              as_user_id: "am-1"
            - call: "POST /portfolio/loss-events/${loss_id}/adjust"
              payload: { distributable_pool_cents: 800000, allocation_method: "BONUS_VALUE", rent_abatement_bps: 500 }
              as: AssetManager
              as_user_id: "am-1"
            - call: "POST /portfolio/alteration-requests/${alt_id}/decision"
              payload: { decision: "APPROVE" }
              as: AssetManager
              as_user_id: "am-1"
            - call: "POST /portfolio/loss-events/${loss_id}/election"
              payload: { election: "RESTORE" }
              as: GroundTenant
              as_user_id: "${lessee_id}"
            - call: "POST /portfolio/alteration-requests/${alt_id}/decision"
              payload: { decision: "APPROVE" }
              as: AssetManager
              as_user_id: "am-1"
          assert:
            - "trigger[0] returns ERR_CROSS_ENTITY_BLOCKED (409) with LossEvent.${loss_id}.status == REPORTED; AlterationRequest.${alt_id}.status stays SUBMITTED"
            - "after trigger[1]: LossEvent.${loss_id}.status == ADJUSTED with distributable_pool_cents 800000 and rent_abatement_bps 500"
            - "trigger[2] returns ERR_CROSS_ENTITY_BLOCKED (409) again - ADJUSTED is still an open casualty"
            - "after both refusals: Lease.${lease_id}.gfa_allocated_sqft == 0 and gfa_unallocated_sqft == 200000 and the lease version never moved"
            - "after trigger[3]: LossEvent.${loss_id}.status == RESTORATION_ELECTED and the lease is still ACTIVE (damage 1000000 is far below the 50% termination threshold)"
            - "trigger[4] returns 200 with AlterationRequest.${alt_id}.status == APPROVED and decided_by_user_id 'am-1'"
            - "after trigger[4]: Lease.${lease_id}.gfa_allocated_sqft == 10000 and gfa_unallocated_sqft == 190000"

      - name: estoppel_certificate_blocked_while_a_revaluation_is_in_arbitration
        grounds:
          - validations.priority_9_cross_entity
          - validations.priority_18_insurance
          - state_machines.RentRevaluation.ARBITRATION_REFERRED_to_RESOLVED
          - entities.EstoppelCertificate.fields.certified_rent_status
          - concurrency_rules.estoppel-create-stale-lease
        distinguishing_aspect: |
          A financing certificate may not be issued while the rent it would certify is under dispute, and
          the blocking state lives on a third entity (RentRevaluation) reached through the lease. The OCC
          guard is satisfied on both attempts, so the 409 cannot be confused with the 412, and the award
          both clears the block and changes what gets certified: the successful certificate reports
          14000000 and RESET_APPLIED, not the 10000000 / IN_ARBITRATION picture of the refused attempt.
        test_recipe:
