      - name: initial_fee_proration_aug1_two_dogs
        claim_type: correct_result
        grounds: [calculations.initial_membership_fee, entities.Membership.fields.charged_fee_cents]
        distinguishing_aspect: "Purchase on 2026-08-01 (153 days remaining) with 2 VERIFIED dogs charges 6288 = round_half_up(12000*153/365)=5030 plus round_half_up(3000*1*153/365)=1258."
        test_recipe:
          setup:
            - "Clock 2026-08-01; member with 2 VERIFIED dogs"
          setup_api_calls:
            - call: "POST /dog-park/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
