          assert:
            - "${s2_cutoff} == false and ${mid_status} == INJECTING: injection_pressure_pa == 1000.0 is exactly MAX_INJECTION_PA and does NOT trip the cutoff (the rule is strictly greater than)"
            - "The 1000.0 sample is still stored with seal_rate_cfm_per_min == null (sample_seq < 3) and SealJob.sample_count == 2"
            - "${s3_cutoff} == true and the sample create still returns HTTP 201 — the offending sample is ACCEPTED, not rejected"
            - "${aborted_status} == ABORTED_SAFETY and ${abort_why} == 'injection pressure cutoff'"
            - "The resume call returns HTTP 422 with ${e_resume} == ERR_INJECTION_PRESSURE_LIMIT, NOT 409 ERR_SEAL_JOB_INVALID_STATE — this is the priority-60 carve-out"
            - "The pause call on the very same ABORTED_SAFETY job returns HTTP 409 with ${e_pause} == ERR_SEAL_JOB_INVALID_STATE, proving the carve-out is scoped to resume alone"
            - "${ds_seal} == SEAL_PENDING, ${ds_work} == 300.00 and ${ds_red} == 0.00: hop 2 restored the leakage ledger to baseline"
            - "${p_status} == SAFETY_HOLD, ${p_hold} == true and ${p_why} contains 'injection pressure cutoff'"
            - "SealJob.${job_id} is terminal: neither the resume nor the pause attempt changed its status or bumped its version"

