      - name: ht_capacity_exact_fit_and_overflow
        claim_type: violation_to_error
        grounds: ["validations[priority=16]", "errors[ERR_HT_CAPACITY_EXCEEDED]"]
        distinguishing_aspect: "assign-lot admits a lot that brings loaded_pallets to EXACTLY capacity_pallets and rejects one pallet over."
        test_recipe:
          setup: ["STAGING run capacity 30; lot1 qty 20 assigned; lot2 qty 10 (exact fit); lot3 qty 1 (overflow)"]
          setup_api_calls:
            - call: "POST /pallet-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantManager
            - call: "POST /pallet-ops/lumber-index"
              payload: { species: "PINE", price_per_mbf_cents: 400000, effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z" }
              as: ProcurementManager
            - call: "POST /pallet-ops/specs"
              payload: { spec_code: "GMA-48X40-15B", length_in: 48, width_in: 40, height_in: 6.0, board_count: 15, lumber_species: "PINE", requires_heat_treatment_default: true }
              as: PlantManager
              captures: { spec_id: $.data.id }
            - call: "POST /pallet-ops/specs/${spec_id}/activate"
              payload: {}
              as: PlantManager
            - call: "POST /pallet-ops/inventory-lots"
              payload: { spec_id: "${spec_id}", origin_type: "NEW_BUILD", quantity_total: 20, quality_grade: "NEW" }
              as: PlantManager
              captures: { l1: $.data.id }
            - call: "POST /pallet-ops/inventory-lots"
              payload: { spec_id: "${spec_id}", origin_type: "NEW_BUILD", quantity_total: 10, quality_grade: "NEW" }
              as: PlantManager
              captures: { l2: $.data.id }
            - call: "POST /pallet-ops/inventory-lots"
              payload: { spec_id: "${spec_id}", origin_type: "NEW_BUILD", quantity_total: 1, quality_grade: "NEW" }
              as: PlantManager
              captures: { l3: $.data.id }
            - call: "POST /pallet-ops/ht-runs"
              payload: { chamber_code: "CH-3", species_profile: "PINE", capacity_pallets: 30 }
              as: HeatTreatOperator
              captures: { run: $.data.id }
            - call: "POST /pallet-ops/ht-runs/${run}/assign-lot"
              payload: { lot_id: "${l1}" }
              as: HeatTreatOperator
            - call: "POST /pallet-ops/ht-runs/${run}/assign-lot"
              payload: { lot_id: "${l2}" }
              as: HeatTreatOperator
          trigger:
            - call: "POST /pallet-ops/ht-runs/${run}/assign-lot"
              payload: { lot_id: "${l3}" }
              as: HeatTreatOperator
              captures: { err: $.data.error_id }
          assert:
            - "lot2 admitted at exact fit (loaded_pallets == 30 == capacity)"
            - "lot3 rejected with ERR_HT_CAPACITY_EXCEEDED (422); loaded_pallets remains 30"

      - name: ht_species_mismatch_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_HT_SPECIES_MISMATCH]"]
        distinguishing_aspect: "Assigning an OAK-spec lot to a PINE-profile run fails with ERR_HT_SPECIES_MISMATCH."
        test_recipe:
          setup: ["STAGING PINE run; OAK spec ACTIVE with PENDING_HT OAK lot"]
