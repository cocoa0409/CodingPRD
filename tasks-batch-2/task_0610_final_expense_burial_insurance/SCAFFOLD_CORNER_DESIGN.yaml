# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Final Expense & Burial Insurance — EXPERT band
# Breadth probe across the claim-extraction-guide sections. Corners already
# covered by a §1.8 difficulty instance are emitted as excluded_because stubs.
#
# Canonical GRADED plan payload reused across recipes (same as §1.8 fixture).
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_product_plan_returns_201_with_fields
        claim_type: Creation
        grounds: ["entities.ProductPlan", "endpoints"]
        distinguishing_aspect: "POST /product-plans with all required fields returns 201 and a ProductPlan with server-minted id, benefit_type GRADED_BENEFIT echoed back."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /product-plans"
              payload: { name: "Heritage Graded", benefit_type: "GRADED_BENEFIT", base_monthly_rate_per_1000_cents: 400, graded_period_months: 24, contestability_period_months: 24, graded_refund_apr: 0.10, cash_value_factor_per_1000_cents: 1500, cash_value_vesting_years: 3, max_loan_to_cash_value_pct: 0.90, loan_apr: 0.08, loan_cooldown_days: 30, grace_period_days: 31, reinstatement_window_days: 180, min_issue_age: 45, max_issue_age: 85, face_tiers: [{tier_name: "SMALL", min_face_cents: 100000, max_face_cents: 1000000, tier_load_pct: 0.0}], age_bands: [{band_name: "A", min_age: 45, max_age: 60, age_factor: 1.0}], surrender_charge_tiers: [{min_gross_cents: 0, max_gross_cents: 99999999, charge_pct: 0.0}] }
              as: PolicyAdmin
              captures: { plan_id: $.data.id, bt: $.data.benefit_type }
          assert:
            - "Response code == 201"
            - "ProductPlan.${plan_id}.benefit_type == GRADED_BENEFIT"
            - "Response data.id is a non-prefixed UUID"

      - name: get_nonexistent_policy_returns_not_found
        claim_type: Not Found
        grounds: ["entities.Policy", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /policies/{id} with a random non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /policies/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PolicyAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_NOT_FOUND (HTTP 404)"

      - name: create_application_missing_required_field_returns_validation
        claim_type: Required Fields
        grounds: ["entities.Application", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /applications omitting requested_face_amount_cents returns ERR_VALIDATION (422); applicant_id and product_plan_id alone are insufficient."
        test_recipe:
          setup: ["A plan and applicant exist."]
          setup_api_calls:
            - call: "POST /product-plans"
              payload: { name: "P", benefit_type: "GRADED_BENEFIT", face_tiers: [{tier_name: "SMALL", min_face_cents: 100000, max_face_cents: 1000000, tier_load_pct: 0.0}], age_bands: [{band_name: "A", min_age: 45, max_age: 85, age_factor: 1.0}], surrender_charge_tiers: [{min_gross_cents: 0, max_gross_cents: 99999999, charge_pct: 0.0}] }
              as: PolicyAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "A", date_of_birth: "1960-06-15", gender: "MALE", tobacco_use: false, state_code: "TX" }
              as: Underwriter
              captures: { app_person_id: $.data.id }
          trigger:
            - call: "POST /applications"
              payload: { applicant_id: "${app_person_id}", product_plan_id: "${plan_id}" }
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_VALIDATION (HTTP 422)"

      - name: policy_computed_fields_ignored_on_issue
        claim_type: Computed Fields
        grounds: ["entities.Policy.fields.gross_cash_value_cents", "entities.Policy.fields.net_cash_value_cents"]
        distinguishing_aspect: "Newly issued policy reports gross_cash_value_cents 0 and net_cash_value_cents 0 (in force < vesting years), computed, not client-supplied."
        test_recipe:
          setup: ["GRADED plan; application approved; policy issued 2026-02-01."]
          setup_api_calls:
            - call: "POST /product-plans"
              payload: { name: "Heritage Graded", benefit_type: "GRADED_BENEFIT", base_monthly_rate_per_1000_cents: 400, graded_period_months: 24, contestability_period_months: 24, graded_refund_apr: 0.10, cash_value_factor_per_1000_cents: 1500, cash_value_vesting_years: 3, max_loan_to_cash_value_pct: 0.90, loan_apr: 0.08, loan_cooldown_days: 30, grace_period_days: 31, reinstatement_window_days: 180, min_issue_age: 45, max_issue_age: 85, face_tiers: [{tier_name: "SMALL", min_face_cents: 100000, max_face_cents: 1000000, tier_load_pct: 0.0}], age_bands: [{band_name: "A", min_age: 45, max_age: 85, age_factor: 1.0}], surrender_charge_tiers: [{min_gross_cents: 0, max_gross_cents: 99999999, charge_pct: 0.0}] }
              as: PolicyAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Cv Test", date_of_birth: "1960-06-15", gender: "MALE", tobacco_use: false, state_code: "TX" }
              as: Underwriter
              captures: { app_person_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${app_person_id}", product_plan_id: "${plan_id}", requested_face_amount_cents: 1000000 }
              as: Underwriter
              captures: { application_id: $.data.id }
            - call: "POST /applications/${application_id}/questionnaire"
              payload: { terminal_illness: false, aids_hiv: false, nursing_home_confined: false, major_condition_last_2y: false }
              as: Underwriter
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: Underwriter
            - call: "POST /applications/${application_id}/submit"
              payload: {}
              as: Underwriter
          trigger:
            - call: "POST /applications/${application_id}/issue"
              payload: { policyholder_user_id: "ph_cv" }
              as: PolicyAdmin
              captures: { gross: $.data.gross_cash_value_cents, net: $.data.net_cash_value_cents }
          assert:
            - "Policy.gross_cash_value_cents == 0"
            - "Policy.net_cash_value_cents == 0"

      - name: list_policies_filtered_by_applicant_fk
        claim_type: Parent Relationships
        grounds: ["entities.Policy.fields.applicant_id", "endpoints"]
        distinguishing_aspect: "GET /policies?applicant_id={id} returns only policies whose applicant_id matches (FK reverse-reachability, flat topology)."
        test_recipe:
          setup: ["One policy issued for applicant X."]
          setup_api_calls:
            - call: "POST /product-plans"
              payload: { name: "Heritage Graded", benefit_type: "GRADED_BENEFIT", base_monthly_rate_per_1000_cents: 400, cash_value_factor_per_1000_cents: 1500, cash_value_vesting_years: 3, min_issue_age: 45, max_issue_age: 85, face_tiers: [{tier_name: "SMALL", min_face_cents: 100000, max_face_cents: 1000000, tier_load_pct: 0.0}], age_bands: [{band_name: "A", min_age: 45, max_age: 85, age_factor: 1.0}], surrender_charge_tiers: [{min_gross_cents: 0, max_gross_cents: 99999999, charge_pct: 0.0}] }
              as: PolicyAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Filt X", date_of_birth: "1960-06-15", gender: "MALE", tobacco_use: false, state_code: "TX" }
              as: Underwriter
              captures: { app_person_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${app_person_id}", product_plan_id: "${plan_id}", requested_face_amount_cents: 1000000 }
              as: Underwriter
              captures: { application_id: $.data.id }
            - call: "POST /applications/${application_id}/questionnaire"
              payload: { terminal_illness: false, aids_hiv: false, nursing_home_confined: false, major_condition_last_2y: false }
              as: Underwriter
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: Underwriter
            - call: "POST /applications/${application_id}/submit"
              payload: {}
              as: Underwriter
            - call: "POST /applications/${application_id}/issue"
              payload: { policyholder_user_id: "ph_filt" }
              as: PolicyAdmin
              captures: { policy_id: $.data.id }
          trigger:
            - call: "GET /policies?applicant_id=${app_person_id}"
              payload: {}
              as: PolicyAdmin
              captures: { first_id: "$.data[0].id" }
          assert:
            - "Response is an array containing exactly the policy with applicant_id == ${app_person_id}"
            - "total_count == 1"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: submit_already_submitted_application_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.Application.SUBMITTED_to_APPROVED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Re-submitting an already-adjudicated (APPROVED) Application returns ERR_INVALID_STATE; no re-adjudication, no premium recompute."
        test_recipe:
          setup: ["Clean application submitted and auto-APPROVED."]
          setup_api_calls:
            - call: "POST /product-plans"
              payload: { name: "Heritage Graded", benefit_type: "GRADED_BENEFIT", base_monthly_rate_per_1000_cents: 400, min_issue_age: 45, max_issue_age: 85, cash_value_factor_per_1000_cents: 1500, cash_value_vesting_years: 3, face_tiers: [{tier_name: "SMALL", min_face_cents: 100000, max_face_cents: 1000000, tier_load_pct: 0.0}], age_bands: [{band_name: "A", min_age: 45, max_age: 85, age_factor: 1.0}], surrender_charge_tiers: [{min_gross_cents: 0, max_gross_cents: 99999999, charge_pct: 0.0}] }
              as: PolicyAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Re Sub", date_of_birth: "1960-06-15", gender: "MALE", tobacco_use: false, state_code: "TX" }
              as: Underwriter
              captures: { app_person_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${app_person_id}", product_plan_id: "${plan_id}", requested_face_amount_cents: 1000000 }
              as: Underwriter
              captures: { application_id: $.data.id }
            - call: "POST /applications/${application_id}/questionnaire"
              payload: { terminal_illness: false, aids_hiv: false, nursing_home_confined: false, major_condition_last_2y: false }
              as: Underwriter
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: Underwriter
            - call: "POST /applications/${application_id}/submit"
              payload: {}
              as: Underwriter
          trigger:
            - call: "POST /applications/${application_id}/submit"
              payload: {}
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_INVALID_STATE (HTTP 409)"

      - name: submit_without_questionnaire_rejected
        claim_type: Precondition Enforcement
        grounds: ["state_machines.Application.DRAFT_to_SUBMITTED", "errors[ERR_QUESTIONNAIRE_MISSING]"]
        distinguishing_aspect: "Submitting a DRAFT Application that has no HealthQuestionnaire returns ERR_QUESTIONNAIRE_MISSING (409)."
        test_recipe:
          setup: ["DRAFT application without questionnaire."]
          setup_api_calls:
            - call: "POST /product-plans"
              payload: { name: "Heritage Graded", benefit_type: "GRADED_BENEFIT", min_issue_age: 45, max_issue_age: 85, face_tiers: [{tier_name: "SMALL", min_face_cents: 100000, max_face_cents: 1000000, tier_load_pct: 0.0}], age_bands: [{band_name: "A", min_age: 45, max_age: 85, age_factor: 1.0}], surrender_charge_tiers: [{min_gross_cents: 0, max_gross_cents: 99999999, charge_pct: 0.0}] }
              as: PolicyAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "No Q", date_of_birth: "1960-06-15", gender: "MALE", tobacco_use: false, state_code: "TX" }
              as: Underwriter
              captures: { app_person_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${app_person_id}", product_plan_id: "${plan_id}", requested_face_amount_cents: 1000000 }
              as: Underwriter
              captures: { application_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: Underwriter
          trigger:
            - call: "POST /applications/${application_id}/submit"
              payload: {}
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_QUESTIONNAIRE_MISSING (HTTP 409)"

      - name: knockout_questionnaire_auto_declines
        claim_type: Valid Transition
        grounds: ["state_machines.Application.SUBMITTED_to_DECLINED", "entities.HealthQuestionnaire.fields.knockout_triggered"]
        distinguishing_aspect: "Submitting with terminal_illness true sets knockout_triggered and auto-DECLINES with decline_reason KNOCKOUT_CONDITION."
        test_recipe:
          setup: ["Application whose questionnaire flags terminal_illness."]
          setup_api_calls:
            - call: "POST /product-plans"
              payload: { name: "Heritage Graded", benefit_type: "GRADED_BENEFIT", min_issue_age: 45, max_issue_age: 85, face_tiers: [{tier_name: "SMALL", min_face_cents: 100000, max_face_cents: 1000000, tier_load_pct: 0.0}], age_bands: [{band_name: "A", min_age: 45, max_age: 85, age_factor: 1.0}], surrender_charge_tiers: [{min_gross_cents: 0, max_gross_cents: 99999999, charge_pct: 0.0}] }
              as: PolicyAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Ko Out", date_of_birth: "1960-06-15", gender: "MALE", tobacco_use: false, state_code: "TX" }
              as: Underwriter
              captures: { app_person_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${app_person_id}", product_plan_id: "${plan_id}", requested_face_amount_cents: 1000000 }
              as: Underwriter
              captures: { application_id: $.data.id }
            - call: "POST /applications/${application_id}/questionnaire"
              payload: { terminal_illness: true, aids_hiv: false, nursing_home_confined: false, major_condition_last_2y: false }
              as: Underwriter
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: Underwriter
          trigger:
            - call: "POST /applications/${application_id}/submit"
              payload: {}
              as: Underwriter
              captures: { st: $.data.status, dr: $.data.decline_reason }
          assert:
            - "Application.${application_id}.status == DECLINED"
            - "Application.${application_id}.decline_reason == KNOCKOUT_CONDITION"

      - name: manual_lapse_before_grace_expires_rejected
        claim_type: Precondition Enforcement
        grounds: ["state_machines.Policy.ACTIVE_to_LAPSED", "errors[ERR_GRACE_NOT_EXPIRED]"]
        distinguishing_aspect: "Manual POST /policies/{id}/lapse before due_date + grace_period_days returns ERR_GRACE_NOT_EXPIRED (409)."
        test_recipe:
          setup: ["GRADED plan; policy issued 2026-02-01; clock 2026-02-10 (only 9 days, < 31 grace)."]
          setup_api_calls:
            - call: "POST /product-plans"
              payload: { name: "Heritage Graded", benefit_type: "GRADED_BENEFIT", base_monthly_rate_per_1000_cents: 400, grace_period_days: 31, min_issue_age: 45, max_issue_age: 85, cash_value_factor_per_1000_cents: 1500, cash_value_vesting_years: 3, face_tiers: [{tier_name: "SMALL", min_face_cents: 100000, max_face_cents: 1000000, tier_load_pct: 0.0}], age_bands: [{band_name: "A", min_age: 45, max_age: 85, age_factor: 1.0}], surrender_charge_tiers: [{min_gross_cents: 0, max_gross_cents: 99999999, charge_pct: 0.0}] }
              as: PolicyAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Gr Ace", date_of_birth: "1960-06-15", gender: "MALE", tobacco_use: false, state_code: "TX" }
              as: Underwriter
              captures: { app_person_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${app_person_id}", product_plan_id: "${plan_id}", requested_face_amount_cents: 1000000 }
              as: Underwriter
              captures: { application_id: $.data.id }
            - call: "POST /applications/${application_id}/questionnaire"
              payload: { terminal_illness: false, aids_hiv: false, nursing_home_confined: false, major_condition_last_2y: false }
              as: Underwriter
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: Underwriter
            - call: "POST /applications/${application_id}/submit"
              payload: {}
              as: Underwriter
            - call: "POST /applications/${application_id}/issue"
              payload: { policyholder_user_id: "ph_grace" }
              as: PolicyAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-10T00:00:00Z" }
              as: PolicyAdmin
          trigger:
            - call: "POST /policies/${policy_id}/lapse"
              payload: {}
              as: PolicyAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_GRACE_NOT_EXPIRED (HTTP 409)"

      - name: reinstate_after_window_closed_rejected
        claim_type: Precondition Enforcement
        grounds: ["state_machines.Policy.LAPSED_to_ACTIVE", "errors[ERR_REINSTATEMENT_WINDOW_CLOSED]"]
        distinguishing_aspect: "Reinstating a LAPSED policy after lapse + reinstatement_window_days (180) returns ERR_REINSTATEMENT_WINDOW_CLOSED (409)."
        test_recipe:
          setup:
            - "GRADED plan reinstatement 180d; policy issued 2026-02-01; lapsed at 2026-04-01; clock advanced to 2027-01-01 (> 180 days past lapse)."
          setup_api_calls:
            - call: "POST /product-plans"
              payload: { name: "Heritage Graded", benefit_type: "GRADED_BENEFIT", base_monthly_rate_per_1000_cents: 400, grace_period_days: 31, reinstatement_window_days: 180, min_issue_age: 45, max_issue_age: 85, cash_value_factor_per_1000_cents: 1500, cash_value_vesting_years: 3, face_tiers: [{tier_name: "SMALL", min_face_cents: 100000, max_face_cents: 1000000, tier_load_pct: 0.0}], age_bands: [{band_name: "A", min_age: 45, max_age: 85, age_factor: 1.0}], surrender_charge_tiers: [{min_gross_cents: 0, max_gross_cents: 99999999, charge_pct: 0.0}] }
              as: PolicyAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Wi Closed", date_of_birth: "1960-06-15", gender: "MALE", tobacco_use: false, state_code: "TX" }
              as: Underwriter
              captures: { app_person_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${app_person_id}", product_plan_id: "${plan_id}", requested_face_amount_cents: 1000000 }
              as: Underwriter
              captures: { application_id: $.data.id }
            - call: "POST /applications/${application_id}/questionnaire"
              payload: { terminal_illness: false, aids_hiv: false, nursing_home_confined: false, major_condition_last_2y: false }
              as: Underwriter
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: Underwriter
            - call: "POST /applications/${application_id}/submit"
              payload: {}
              as: Underwriter
            - call: "POST /applications/${application_id}/issue"
              payload: { policyholder_user_id: "ph_wi" }
              as: PolicyAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PolicyAdmin
            - call: "POST /policies/${policy_id}/lapse"
              payload: {}
              as: PolicyAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: PolicyAdmin
            - call: "POST /premium-payments"
              payload: { policy_id: "${policy_id}", amount_cents: 6000, coverage_start: "2026-02-01T00:00:00Z", coverage_end: "2027-02-01T00:00:00Z" }
              as: PolicyAdmin
          trigger:
            - call: "POST /policies/${policy_id}/reinstate"
              payload: {}
              as: PolicyAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_REINSTATEMENT_WINDOW_CLOSED (HTTP 409)"

      - name: terminal_state_surrendered_no_further_transition
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.Policy.ACTIVE_to_SURRENDERED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A SURRENDERED policy cannot be surrendered again; POST /policies/{id}/surrender returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["GRADED plan; policy issued 2026-02-01; clock 2031-02-01; surrendered."]
          setup_api_calls:
            - call: "POST /product-plans"
              payload: { name: "Heritage Graded", benefit_type: "GRADED_BENEFIT", base_monthly_rate_per_1000_cents: 400, cash_value_factor_per_1000_cents: 1500, cash_value_vesting_years: 3, min_issue_age: 45, max_issue_age: 85, face_tiers: [{tier_name: "SMALL", min_face_cents: 100000, max_face_cents: 1000000, tier_load_pct: 0.0}], age_bands: [{band_name: "A", min_age: 45, max_age: 85, age_factor: 1.0}], surrender_charge_tiers: [{min_gross_cents: 0, max_gross_cents: 99999999, charge_pct: 0.0}] }
              as: PolicyAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Te Rm", date_of_birth: "1960-06-15", gender: "MALE", tobacco_use: false, state_code: "TX" }
              as: Underwriter
              captures: { app_person_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${app_person_id}", product_plan_id: "${plan_id}", requested_face_amount_cents: 1000000 }
              as: Underwriter
              captures: { application_id: $.data.id }
            - call: "POST /applications/${application_id}/questionnaire"
              payload: { terminal_illness: false, aids_hiv: false, nursing_home_confined: false, major_condition_last_2y: false }
              as: Underwriter
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: Underwriter
            - call: "POST /applications/${application_id}/submit"
              payload: {}
              as: Underwriter
            - call: "POST /applications/${application_id}/issue"
              payload: { policyholder_user_id: "ph_te" }
              as: PolicyAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2031-02-01T00:00:00Z" }
              as: PolicyAdmin
            - call: "POST /policies/${policy_id}/surrender"
              payload: {}
              as: PolicyAdmin
          trigger:
            - call: "POST /policies/${policy_id}/surrender"
              payload: {}
              as: PolicyAdmin
              captures: { err: $.data.error_id }
