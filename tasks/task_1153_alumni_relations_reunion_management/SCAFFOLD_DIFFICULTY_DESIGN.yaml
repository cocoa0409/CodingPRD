        grounds:
          - state_machines.AlumniRecord.ACTIVE_to_DECEASED
          - state_machines.CommitteeMembership.ACTIVE_to_ENDED
          - calculations.reunion_posture_calc
        distinguishing_aspect: |
          Depth-2 chain from POST /alumni/records/{id}/mark-deceased (different
          trigger than event cancel): record DECEASED -> the alumnus's ACTIVE
          CommitteeMembership ENDED with ended_reason=ALUMNUS_DECEASED (link 1);
