      - name: proof_validate_cascades_proof_then_registration_activation
        grounds:
          - state_machines.ProofOfPurchase.SUBMITTED_to_VALIDATED
          - state_machines.Registration.REGISTERED_to_ACTIVE
          - entities.Registration.fields.proof_status
        distinguishing_aspect: |
          Depth-2 chain from POST /proofs/{id}/validate: ProofOfPurchase -> VALIDATED (link1) CAUSES
          Registration.proof_status=VALIDATED and the REGISTERED -> ACTIVE transition (link2); a
