            - "SubsidyClaim for service_month 2026-09 with child_days {INFANT:100, TODDLER:200, PRESCHOOL:300} (base_amount_cents 2170000) is APPROVED under INTERIM at tier_multiplier_applied 1.3000 and PAID at reimbursement_cents 3046680."
