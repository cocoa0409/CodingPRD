              as_user_id: "${bacct}"
              captures: { bc1: $.data.id }
            - call: "POST /disputes"
              payload: { card_transaction_id: "${btx2}", error_type: "INCORRECT_AMOUNT", claim_amount_cents: 7000, claimed_report_delay_days: 5 }
              as: Cardholder
              as_user_id: "${bacct}"
              captures: { bc2: $.data.id }
            - call: "POST /disputes/${bc1}/classify"
              payload: { is_fraud_claim: false, verified_report_delay_days: 5 }
              as: DisputeInvestigator
            - call: "POST /disputes/${bc2}/classify"
