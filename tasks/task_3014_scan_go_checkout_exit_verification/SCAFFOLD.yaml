    code: 200
    input: []
    output: InstantSavingsOffer
    side_effects: []

  - method: GET
    path: "/instant-savings-offers"
    description: "List offers with optional filters"
    roles: [Member, Associate, LossPreventionOfficer, ClubManager, PlatformAdmin]
    code: 200
    input: ["club_id?", "catalog_item_id?", "limit?", "offset?"]
    output: "InstantSavingsOffer[]"
    side_effects: []

  # --- Members ---
  - method: POST
    path: "/members"
    description: "Register a member"
    roles: [PlatformAdmin]
    code: 201
    input: ["tier", "birth_year", "home_club_id", "tender_status?"]
    output: Member
    side_effects: ["status ACTIVE; balances/strikes 0"]

  - method: GET
    path: "/members/{id}"
    description: "Get a member"
    roles: [Member, Associate, LossPreventionOfficer, ClubManager, PlatformAdmin]
    code: 200
    input: []
    output: Member
    side_effects: []

  - method: GET
    path: "/members"
    description: "List members with optional filters"
    roles: [Member, Associate, LossPreventionOfficer, ClubManager, PlatformAdmin]
    code: 200
    input: ["home_club_id?", "tier?", "status?", "limit?", "offset?"]
    output: "Member[]"
    side_effects: []

  - method: GET
    path: "/members/{id}/scan-sessions"
    description: "List scan sessions of a member"
    roles: [Member, Associate, LossPreventionOfficer, ClubManager, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ScanSession[]"
    side_effects: []

  - method: POST
    path: "/members/{id}/reinstate"
    description: "Reinstate a SUSPENDED member; resets strikes to 0"
    roles: [LossPreventionOfficer]
    code: 200
    input: []
    output: Member
    side_effects: ["status -> ACTIVE; unscanned_strikes := 0"]

  - method: POST
    path: "/members/{id}/rewards/settle"
    description: "Post pending rewards to posted for all unsettled non-VOIDED paid sessions of the member"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Member
    side_effects: ["cash_rewards_posted_cents += sum over unsettled valid sessions; rewards_settled flipped"]

  # --- Scan sessions ---
  - method: POST
    path: "/scan-sessions"
    description: "Start a scan-and-go session; member taken from X-User-ID"
    roles: [Member]
    code: 201
    input: ["club_id"]
    output: ScanSession
    side_effects: ["status OPEN; provisional_total_cents 0"]

  - method: GET
    path: "/scan-sessions/{id}"
    description: "Get a scan session"
    roles: [Member, Associate, LossPreventionOfficer, ClubManager, PlatformAdmin]
    code: 200
    input: []
    output: ScanSession
    side_effects: []

  - method: GET
    path: "/scan-sessions"
    description: "List scan sessions with optional filters"
    roles: [Member, Associate, LossPreventionOfficer, ClubManager, PlatformAdmin]
    code: 200
    input: ["club_id?", "member_id?", "status?", "limit?", "offset?"]
    output: "ScanSession[]"
    side_effects: []

  - method: POST
    path: "/scan-sessions/{id}/lines"
    description: "Scan an item into the session; restricted items create an INTERCEPTED line + PENDING intercept and hold the session"
    roles: [Member]
    code: 201
    input: ["catalog_item_id", "quantity?", "weight_grams?"]
    output: ScanLine
    side_effects:
      - "scan_seq assigned; price snapshots captured"
      - "line_gross_cents, offer application, line_total_cents computed"
      - "session provisional_total_cents and scanned_item_count recomputed"
      - "restricted item: line INTERCEPTED, RestrictedIntercept PENDING created, session -> REVIEW_HOLD"

  - method: GET
    path: "/scan-sessions/{id}/lines"
    description: "List lines of a session"
    roles: [Member, Associate, LossPreventionOfficer, ClubManager, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ScanLine[]"
    side_effects: []

  - method: GET
    path: "/scan-lines/{id}"
    description: "Get a scan line"
    roles: [Member, Associate, LossPreventionOfficer, ClubManager, PlatformAdmin]
    code: 200
    input: []
    output: ScanLine
    side_effects: []

  - method: POST
    path: "/scan-lines/{id}/remove"
    description: "Remove a line from an unpaid session"
    roles: [Member]
    code: 200
    input: []
    output: ScanLine
    side_effects: ["line -> REMOVED; session totals recomputed; offer redemption released"]

  - method: POST
    path: "/scan-sessions/{id}/pay"
    description: "Pay the cart total in-app with the membership-linked tender"
    roles: [Member]
    code: 200
    input: []
    output: ScanSession
    side_effects:
      - "final_total_cents computed (variant per connectivity); receipt_code minted; paid_at set"
      - "Member.lifetime_charged_cents += final_total_cents"
      - "PLUS: pending rewards accrue from qualifying_cents"

  - method: POST
    path: "/scan-sessions/{id}/void-payment"
    description: "Void a paid session with full compensating refund"
    roles: [LossPreventionOfficer]
    code: 200
    input: []
    output: ScanSession
    side_effects:
      - "status -> VOIDED; refunded_cents := final_total_cents"
      - "Member.lifetime_charged_cents -= final_total_cents; pending rewards clawed back"
      - "PENDING ExitVerifications -> EXPIRED; receipt code invalidated"

  - method: POST
    path: "/scan-sessions/{id}/exit-scan"
    description: "Begin exit verification; creates a PENDING ExitVerification"
    roles: [Member]
    code: 201
    input: ["method?"]
    output: ExitVerification
    side_effects: ["session PAID -> EXIT_PENDING; expected_item_count snapshot"]

  - method: POST
    path: "/scan-sessions/{id}/abandon"
    description: "Abandon an unpaid session"
    roles: [Member]
    code: 200
    input: []
    output: ScanSession
    side_effects: ["status -> ABANDONED; lines REMOVED; PENDING intercepts EXPIRED"]

  # --- Restricted intercepts ---
  - method: GET
    path: "/scan-sessions/{id}/intercepts"
    description: "List intercepts of a session"
    roles: [Member, Associate, LossPreventionOfficer, ClubManager, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "RestrictedIntercept[]"
    side_effects: []

  - method: GET
    path: "/intercepts/{id}"
    description: "Get an intercept"
    roles: [Member, Associate, LossPreventionOfficer, ClubManager, PlatformAdmin]
    code: 200
    input: []
    output: RestrictedIntercept
    side_effects: []

  - method: GET
    path: "/intercepts"
    description: "List intercepts with optional filters"
    roles: [Member, Associate, LossPreventionOfficer, ClubManager, PlatformAdmin]
    code: 200
    input: ["session_id?", "scan_line_id?", "club_id?", "status?", "limit?", "offset?"]
    output: "RestrictedIntercept[]"
    side_effects: []

  - method: POST
    path: "/intercepts/{id}/resolve"
    description: "Associate approves or denies a restricted intercept (age/pharmacist checks apply)"
    roles: [Associate]
    code: 200
    input: ["decision", "birth_year_verified?", "pharmacist_note?"]
    output: RestrictedIntercept
    side_effects:
      - "APPROVE: line INTERCEPTED -> CLEARED"
      - "DENY: line INTERCEPTED -> REMOVED; session totals recomputed"
      - "Session reopens when no PENDING intercepts remain"

  # --- Exit verifications ---
  - method: GET
    path: "/scan-sessions/{id}/exit-verifications"
    description: "List exit verifications of a session"
    roles: [Member, Associate, LossPreventionOfficer, ClubManager, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ExitVerification[]"
    side_effects: []

  - method: GET
    path: "/exit-verifications/{id}"
    description: "Get an exit verification"
    roles: [Member, Associate, LossPreventionOfficer, ClubManager, PlatformAdmin]
    code: 200
    input: []
    output: ExitVerification
    side_effects: []

  - method: GET
    path: "/exit-verifications"
    description: "List exit verifications with optional filters"
    roles: [Member, Associate, LossPreventionOfficer, ClubManager, PlatformAdmin]
    code: 200
    input: ["session_id?", "club_id?", "status?", "limit?", "offset?"]
    output: "ExitVerification[]"
    side_effects: []

  - method: POST
    path: "/exit-verifications/{id}/verify-receipt"
    description: "Door associate scans the receipt code; wrong code flips verification to MISMATCH"
    roles: [Associate]
    code: 200
    input: ["receipt_code"]
    output: ExitVerification
    side_effects:
      - "match: VERIFIED; session -> EXITED"
      - "mismatch: MISMATCH; session -> FLAGGED; LP case CV_MISMATCH (unscanned_count 0); strikes/suspension cascade"

  - method: POST
    path: "/exit-verifications/{id}/cv-report"
    description: "CV arch gateway reports the observed physical item count"
    roles: [Associate]
    code: 200
    input: ["observed_item_count"]
    output: ExitVerification
    side_effects:
      - "unscanned >= club.lp_unscanned_threshold: MISMATCH; session FLAGGED; LP case opened; strikes/suspension cascade"
      - "else VERIFIED; session -> EXITED"

  - method: POST
    path: "/exit-verifications/{id}/resolve-mismatch"
    description: "Resolve a MISMATCH verification: CLEAR (verify + exit), CONFIRM (stand by for LP), or RESCAN (new verification)"
    roles: [Associate]
    code: 200
    input: ["action"]
    output: ExitVerification
    side_effects:
      - "CLEAR: verification -> VERIFIED; session FLAGGED -> EXITED (requires session's LP cases RESOLVED)"
      - "CONFIRM: verification -> CONFIRMED; session stays FLAGGED"
      - "RESCAN: new PENDING verification created; session FLAGGED -> EXIT_PENDING"

  # --- Loss prevention cases ---
  - method: GET
    path: "/loss-prevention-cases/{id}"
    description: "Get an LP case"
    roles: [Member, Associate, LossPreventionOfficer, ClubManager, PlatformAdmin]
    code: 200
    input: []
    output: LossPreventionCase
    side_effects: []

  - method: GET
    path: "/loss-prevention-cases"
    description: "List LP cases with optional filters"
    roles: [Member, Associate, LossPreventionOfficer, ClubManager, PlatformAdmin]
    code: 200
    input: ["session_id?", "member_id?", "club_id?", "status?", "limit?", "offset?"]
    output: "LossPreventionCase[]"
    side_effects: []

  - method: POST
    path: "/loss-prevention-cases/{id}/acknowledge"
    description: "Acknowledge an OPEN or escalate-ready LP case"
    roles: [LossPreventionOfficer]
    code: 200
    input: []
    output: LossPreventionCase
    side_effects: ["OPEN -> ACKNOWLEDGED"]

  - method: POST
    path: "/loss-prevention-cases/{id}/escalate"
    description: "Escalate an LP case"
    roles: [LossPreventionOfficer]
    code: 200
    input: []
    output: LossPreventionCase
    side_effects: ["OPEN|ACKNOWLEDGED -> ESCALATED"]

  - method: POST
    path: "/loss-prevention-cases/{id}/resolve"
    description: "Resolve an LP case (segregation of duties: resolver != flagging associate)"
    roles: [LossPreventionOfficer]
    code: 200
    input: ["outcome"]
    output: LossPreventionCase
    side_effects: ["-> RESOLVED; outcome recorded; DISMISSED decrements member strikes (floor 0)"]

  # --- Curbside orders ---
  - method: POST
    path: "/clubs/{id}/curbside-orders"
    description: "Place a curbside pickup order"
    roles: [Member]
    code: 201
    input: ["item_count"]
    output: CurbsideOrder
    side_effects: ["status PLACED; member from X-User-ID"]

  - method: GET
    path: "/curbside-orders/{id}"
    description: "Get a curbside order"
    roles: [Member, Associate, LossPreventionOfficer, ClubManager, PlatformAdmin]
    code: 200
    input: []
    output: CurbsideOrder
    side_effects: []

  - method: GET
    path: "/curbside-orders"
    description: "List curbside orders with optional filters"
    roles: [Member, Associate, LossPreventionOfficer, ClubManager, PlatformAdmin]
    code: 200
    input: ["club_id?", "member_id?", "status?", "limit?", "offset?"]
    output: "CurbsideOrder[]"
    side_effects: []

  - method: GET
    path: "/clubs/{id}/curbside-orders"
    description: "List curbside orders of a club"
    roles: [Member, Associate, LossPreventionOfficer, ClubManager, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "CurbsideOrder[]"
    side_effects: []

  - method: POST
    path: "/curbside-orders/{id}/stage"
    description: "Stage a PLACED order into a slot and pickup window (half-open, capacity-gated)"
    roles: [Associate]
    code: 200
    input: ["staging_slot_label", "window_start_iso", "window_end_iso"]
    output: CurbsideOrder
    side_effects: ["PLACED -> STAGING; slot occupancy +1"]

  - method: POST
    path: "/curbside-orders/{id}/mark-staged"
    description: "Mark a STAGING order as physically staged"
    roles: [Associate]
    code: 200
    input: []
    output: CurbsideOrder
    side_effects: ["STAGING -> STAGED; staged_by_associate_id recorded"]

  - method: POST
    path: "/curbside-orders/{id}/pickup"
    description: "Member picks up a STAGED order"
    roles: [Member]
    code: 200
    input: []
    output: CurbsideOrder
    side_effects: ["STAGED -> PICKED_UP; slot occupancy -1"]

  - method: POST
    path: "/curbside-orders/{id}/cancel"
    description: "Cancel a non-terminal curbside order"
    roles: [Member]
    code: 200
    input: []
    output: CurbsideOrder
    side_effects: ["-> CANCELLED; slot occupancy -1 if staged/staging"]

  - method: POST
    path: "/curbside-orders/{id}/reschedule"
    description: "Member reschedules slot/window (OCC-guarded); STAGED orders demote to STAGING; increments CurbsideOrder.version"
    roles: [Member]
    code: 200
    input: ["staging_slot_label", "window_start_iso", "window_end_iso", "expected_curbside_order_version"]
    output: CurbsideOrder
    side_effects: ["slot/window replaced; increments CurbsideOrder.version by 1"]

  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is exactly 2026-09-01T00:00:00Z; the clock never falls back to wall-clock time"
    roles: [PlatformAdmin]
    code: 200
    input: ["to_iso8601"]
    output: null
    side_effects: ["logical clock advanced"]

# =============================================================================
# Table 6: Error Code Catalog (§1.6)
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, or role not a declared role" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_FORBIDDEN_RESOURCE_OWNERSHIP, http: 403, condition: "Member-scoped action attempted on another member's session or curbside order" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing/invalid required field, type mismatch, pricing-mode-inconsistent fields, missing pharmacist_note on PHARMACY approval" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent entity's current version (OCC)" }
  - { id: ERR_CLUB_NOT_FOUND, http: 404, condition: "Club id does not exist" }
  - { id: ERR_MEMBER_NOT_FOUND, http: 404, condition: "Member id does not exist" }
  - { id: ERR_CATALOG_ITEM_NOT_FOUND, http: 404, condition: "Catalog item id does not exist, is DELISTED, or belongs to a different club than the session" }
  - { id: ERR_OFFER_NOT_FOUND, http: 404, condition: "Instant savings offer id does not exist" }
  - { id: ERR_SCAN_SESSION_NOT_FOUND, http: 404, condition: "Scan session id does not exist" }
  - { id: ERR_SCAN_LINE_NOT_FOUND, http: 404, condition: "Scan line id does not exist" }
  - { id: ERR_INTERCEPT_NOT_FOUND, http: 404, condition: "Restricted intercept id does not exist" }
  - { id: ERR_EXIT_VERIFICATION_NOT_FOUND, http: 404, condition: "Exit verification id does not exist" }
  - { id: ERR_LP_CASE_NOT_FOUND, http: 404, condition: "Loss prevention case id does not exist" }
  - { id: ERR_CURBSIDE_ORDER_NOT_FOUND, http: 404, condition: "Curbside order id does not exist" }
  - { id: ERR_CLUB_SCAN_GO_DISABLED, http: 409, condition: "club.scan_go_enabled is false; no new scan sessions" }
  - { id: ERR_CLUB_OFFLINE, http: 409, condition: "Club connectivity_posture is OFFLINE_FALLBACK; no new scan sessions" }
  - { id: ERR_MEMBER_INACTIVE, http: 409, condition: "Member is SUSPENDED; session creation and payment blocked" }
  - { id: ERR_SESSION_ALREADY_ACTIVE, http: 409, condition: "Member already has a non-terminal scan session at this club" }
  - { id: ERR_SESSION_NOT_OPEN, http: 409, condition: "Session not in a state allowing the operation (scan requires OPEN/REVIEW_HOLD/OFFLINE_PAUSED; pay requires OPEN/REVIEW_HOLD or OFFLINE_PAUSED with club fallback enabled; abandon/void constraints)" }
  - { id: ERR_EARLY_HOURS_NOT_ELIGIBLE, http: 403, condition: "Non-PLUS member attempting to create a session during the early-shopping window or before it" }
  - { id: ERR_RESTRICTED_BLOCKED_OFFLINE, http: 409, condition: "Restricted item cannot be scanned while club connectivity is OFFLINE_FALLBACK (no associate channel)" }
  - { id: ERR_RESTRICTED_BLOCKED_EARLY_HOURS, http: 409, condition: "Restricted item cannot be scanned during the early-shopping window" }
  - { id: ERR_AGE_VERIFICATION_FAILED, http: 403, condition: "ALCOHOL/TOBACCO approval without birth_year_verified=true, or member age < 21 at current clock year" }
  - { id: ERR_INTERCEPT_PENDING, http: 409, condition: "Payment attempted while a RestrictedIntercept is still PENDING for the session" }
  - { id: ERR_INTERCEPT_NOT_PENDING, http: 409, condition: "Resolve attempted on a non-PENDING intercept" }
  - { id: ERR_INVALID_QUANTITY, http: 400, condition: "quantity missing for UNIT item, or quantity < 1" }
  - { id: ERR_INVALID_WEIGHT, http: 400, condition: "weight_grams missing for WEIGHTED item, or weight_grams <= 0" }
  - { id: ERR_EMPTY_CART, http: 409, condition: "Payment attempted with zero non-REMOVED lines" }
  - { id: ERR_TENDER_DECLINED, http: 402, condition: "Member's membership-linked tender_status is DECLINED" }
  - { id: ERR_SESSION_NOT_PAID, http: 409, condition: "exit-scan attempted before the session is PAID" }
  - { id: ERR_SESSION_NOT_VOIDABLE, http: 409, condition: "void-payment attempted on a session not in {PAID, EXIT_PENDING, FLAGGED}" }
  - { id: ERR_VERIFICATION_METHOD_NOT_ENABLED, http: 409, condition: "Requested verification method not enabled by club.exit_verification_mode, or method/endpoint mismatch" }
  - { id: ERR_VERIFICATION_NOT_PENDING, http: 409, condition: "verify-receipt or cv-report attempted on a non-PENDING verification" }
  - { id: ERR_VERIFICATION_NOT_MISMATCHED, http: 409, condition: "resolve-mismatch attempted on a verification not in MISMATCH" }
  - { id: ERR_LP_CASE_NOT_OPEN, http: 409, condition: "acknowledge/escalate/resolve attempted on a RESOLVED case; also raised when CLEAR is blocked by an unresolved case" }
  - { id: ERR_SO_DUTY_VIOLATION, http: 403, condition: "LP case resolver's X-User-ID equals the case's flagging_associate_id (segregation of duties)" }
  - { id: ERR_SLOT_WINDOW_INVALID, http: 400, condition: "Curbside window_end_iso <= window_start_iso" }
  - { id: ERR_SLOT_CAPACITY_EXCEEDED, http: 409, condition: "Staging slot occupancy for the overlapping half-open window already equals club.staging_slot_capacity" }
  - { id: ERR_CURBSIDE_NOT_STAGED, http: 409, condition: "pickup attempted on an order not in STAGED" }
  - { id: ERR_CURBSIDE_NOT_CANCELLABLE, http: 409, condition: "cancel attempted on a terminal curbside order (PICKED_UP/CANCELLED/EXPIRED)" }
  - { id: ERR_OFFER_WINDOW_INVALID, http: 400, condition: "Offer valid_to_iso < valid_from_iso" }
  - { id: ERR_OFFER_WINDOW_CONFLICT, http: 409, condition: "Offer window (closed interval) overlaps an existing offer for the same club and catalog item, including touching endpoints" }

# =============================================================================
# Table 7: RBAC Matrix (§1.7)
# =============================================================================
roles:
  - name: Member
    description: "Club member shopping via Scan-and-Go; identity is the Member entity id"
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /scan-sessions — start session (X-User-ID becomes member_id)"
      - "POST /scan-sessions/{id}/lines — scan items into own session"
      - "POST /scan-lines/{id}/remove — remove own line"
      - "POST /scan-sessions/{id}/pay — pay own session"
      - "POST /scan-sessions/{id}/exit-scan — begin exit verification for own session"
      - "POST /scan-sessions/{id}/abandon — abandon own session"
      - "POST /clubs/{id}/curbside-orders — place curbside order"
      - "POST /curbside-orders/{id}/pickup — pick up own order"
      - "POST /curbside-orders/{id}/cancel — cancel own order"
      - "POST /curbside-orders/{id}/reschedule — reschedule own order (OCC)"
    shared_operations:
      - "All GET endpoints"

  - name: Associate
    description: "Club associate staffing restricted-item interception, the exit arch/door, and curbside staging; identity is an opaque operator id recorded on intercepts, verifications, cases, and staged orders"
    identity: "opaque"
    exclusive_operations:
      - "POST /intercepts/{id}/resolve — resolve restricted intercepts"
      - "POST /exit-verifications/{id}/verify-receipt — receipt-code door check"
      - "POST /exit-verifications/{id}/cv-report — CV arch observation gateway"
      - "POST /exit-verifications/{id}/resolve-mismatch — mismatch handling"
      - "POST /curbside-orders/{id}/stage — stage curbside order"
      - "POST /curbside-orders/{id}/mark-staged — mark staged"
    shared_operations:
      - "All GET endpoints"

  - name: LossPreventionOfficer
    description: "Loss prevention officer; owns LP case lifecycle, payment voids, and member reinstatement; identity is an opaque operator id"
    identity: "opaque"
    exclusive_operations:
      - "POST /scan-sessions/{id}/void-payment — void paid session"
      - "POST /loss-prevention-cases/{id}/acknowledge"
      - "POST /loss-prevention-cases/{id}/escalate"
      - "POST /loss-prevention-cases/{id}/resolve (subject to segregation of duties)"
      - "POST /members/{id}/reinstate"
    shared_operations:
      - "All GET endpoints"

  - name: ClubManager
    description: "Club manager; owns club configuration, connectivity posture, offers, and ops closeout; identity is an opaque operator id"
    identity: "opaque"
    exclusive_operations:
      - "PATCH /clubs/{id} — update club config (OCC)"
      - "POST /clubs/{id}/connectivity — set connectivity posture"
      - "POST /clubs/{id}/run-closeout — ops checkpoint"
      - "POST /clubs/{id}/instant-savings-offers — create offers"
    shared_operations:
      - "All GET endpoints"

  - name: PlatformAdmin
    description: "Platform administrator; owns club creation, catalog, member registration, rewards settlement, and the logical clock; identity is an opaque operator id"
    identity: "opaque"
    exclusive_operations:
      - "POST /clubs — create club"
      - "POST /clubs/{id}/catalog-items — create catalog item"
      - "PATCH /catalog-items/{id} — reprice/delist item"
      - "POST /members — register member"
      - "POST /members/{id}/rewards/settle — post rewards"
      - "POST /_clock/set_current_utc — set logical clock"
    shared_operations:
      - "All GET endpoints"
