              captures: { dc_d1: $.data.id }
            - call: "POST /dmv/documents"
              payload: { transaction_id: "${dc_txn}", checklist_code: "INSURANCE", file_ref: "f2" }
              as: IntakeClerk
              captures: { dc_d2: $.data.id }
            - call: "POST /dmv/documents/${dc_d1}/verify"
              payload: { decision: "VERIFIED" }
              as: IntakeClerk
            - call: "POST /dmv/documents/${dc_d2}/verify"
              payload: { decision: "VERIFIED" }
              as: IntakeClerk
            - call: "POST /dmv/transactions/${dc_txn}/verify-documents"
              payload: {}
              as: IntakeClerk
