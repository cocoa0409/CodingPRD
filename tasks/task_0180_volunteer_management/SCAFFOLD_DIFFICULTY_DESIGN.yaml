# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# task_0180_volunteer_management (Expert)
# 9 rule_ids x 2 instances = 18 instances.
# All setup_api_calls use the flat /vm topology; every ${var} is captured.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: provisional_vs_verified_hours_diverge_on_signup
        grounds:
          - calculations.provisional_hours
          - calculations.verified_hours
          - state_machines.Signup.CONFIRMED_to_ATTENDED
          - state_machines.Signup.HOURS_LOGGED_to_HOURS_VERIFIED
          - entities.Signup.fields.provisional_hours
          - entities.Signup.fields.verified_hours
        distinguishing_aspect: "On the SAME Signup, provisional_hours (full scheduled 3.50h) and verified_hours (logged 3.00h capped at scheduled) differ: provisional_hours==3.50 while verified_hours==3.00 — dual-variant on the Signup domain."
        test_recipe:
          setup:
            - "Org ACTIVE; one Volunteer ACTIVE; PUBLISHED Opportunity with no gates; one Shift 2026-07-01T09:00Z..12:30Z (3.5h) capacity 1; the Volunteer has a RESERVED then CONFIRMED Signup; clock advanced past starts_at; Signup checked-in (ATTENDED, provisional_hours set)."
          setup_api_calls:
            - call: "POST /vm/organizations"
              payload: { name: "Helping Hands" }
              as: ShiftCoordinator
              captures: { org_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: ShiftCoordinator
            - call: "POST /vm/volunteers"
              payload: { organization_id: "${org_id}", full_name: "Ann V", email: "ann@x.com" }
              as: ShiftCoordinator
              captures: { vol_id: $.data.id }
            - call: "POST /vm/opportunities"
              payload: { organization_id: "${org_id}", title: "Park Cleanup" }
              as: ShiftCoordinator
              captures: { opp_id: $.data.id }
            - call: "POST /vm/shifts"
              payload: { opportunity_id: "${opp_id}", starts_at: "2026-07-01T09:00:00Z", ends_at: "2026-07-01T12:30:00Z", capacity: 1 }
              as: ShiftCoordinator
              captures: { shift_id: $.data.id, shift_v: $.data.version }
            - call: "POST /vm/opportunities/${opp_id}/publish"
              payload: {}
              as: ShiftCoordinator
            - call: "POST /vm/shifts/${shift_id}/signups"
              payload: { volunteer_id: "${vol_id}", expected_shift_version: "${shift_v}" }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { signup_id: $.data.id }
            - call: "POST /vm/signups/${signup_id}/confirm"
              payload: {}
              as: Volunteer
              as_user_id: "${vol_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T09:30:00Z" }
              as: ShiftCoordinator
            - call: "POST /vm/signups/${signup_id}/check-in"
              payload: {}
              as: ShiftCoordinator
              captures: { prov: $.data.provisional_hours }
          trigger:
            - call: "POST /vm/signups/${signup_id}/log-hours"
              payload: { logged_hours: 3.0 }
              as: Volunteer
              as_user_id: "${vol_id}"
            - call: "POST /vm/signups/${signup_id}/verify-hours"
              payload: {}
              as: ShiftCoordinator
              captures: { ver: $.data.verified_hours }
          assert:
            - "Signup.${signup_id}.provisional_hours == 3.50"
            - "Signup.${signup_id}.verified_hours == 3.00"
            - "Signup.${signup_id}.provisional_hours != Signup.${signup_id}.verified_hours"

      - name: bg_tier_before_vs_after_lazy_expiry_diverges_on_volunteer
        grounds:
          - calculations.bg_check_tier
          - state_machines.BackgroundCheck.IN_PROGRESS_to_CLEARED
          - state_machines.BackgroundCheck.CLEARED_to_EXPIRED
          - entities.Volunteer.fields.bg_check_tier
        distinguishing_aspect: "On the Volunteer domain, bg_check_tier computed ignoring expiry (STANDARD, the cleared requested_tier) differs from bg_check_tier after lazy expiry against a clock past valid_until (NONE) — the two valid evaluations diverge on the same Volunteer."
        test_recipe:
          setup:
            - "Org ACTIVE; Volunteer with one BackgroundCheck CLEARED at requested_tier STANDARD, validity_days 1, cleared at 2026-06-15T00:00:00Z so valid_until is 2026-06-16T00:00:00Z."
          setup_api_calls:
            - call: "POST /vm/organizations"
              payload: { name: "Helping Hands" }
              as: ComplianceOfficer
              captures: { org_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /vm/volunteers"
              payload: { organization_id: "${org_id}", full_name: "Bo V", email: "bo@x.com" }
              as: ComplianceOfficer
              captures: { vol_id: $.data.id }
            - call: "POST /vm/background-checks"
              payload: { volunteer_id: "${vol_id}", requested_tier: "STANDARD", validity_days: 1 }
              as: ComplianceOfficer
              captures: { chk_id: $.data.id }
            - call: "POST /vm/background-checks/${chk_id}/start"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /vm/volunteers/${vol_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { vol_v: $.data.version }
            - call: "POST /vm/background-checks/${chk_id}/decide"
              payload: { decision: "CLEARED", expected_volunteer_version: "${vol_v}" }
              as: ComplianceOfficer
          trigger:
            - call: "GET /vm/volunteers/${vol_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { tier_before: $.data.bg_check_tier }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-17T00:00:00Z" }
              as: ComplianceOfficer
            - call: "GET /vm/volunteers/${vol_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { tier_after: $.data.bg_check_tier }
          assert:
            - "first GET (clock 2026-06-15, before valid_until 2026-06-16) Volunteer.${vol_id}.bg_check_tier == STANDARD"
            - "second GET (clock 2026-06-17, past valid_until) Volunteer.${vol_id}.bg_check_tier == NONE"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: milestone_round_per_line_then_sum_pins_cents
        grounds:
          - calculations.milestone_total_hours
          - calculations.verified_hours
          - state_machines.Signup.HOURS_LOGGED_to_HOURS_VERIFIED
          - entities.Volunteer.fields.total_verified_hours
        distinguishing_aspect: "Mode (b) nested rounding: two HOURS_VERIFIED Signups with verified_hours 3.50 and 2.25 sum to total_verified_hours==5.75 under the pinned round-per-line-item-then-sum order; the order is explicit so cents are well-defined."
        test_recipe:
          setup:
            - "One Volunteer with two HOURS_VERIFIED Signups: shift A 09:00-12:30 (3.5h, logged 3.5) and shift B 13:00-15:15 (2.25h, logged 2.25); non-overlapping; clock advanced as needed."
          setup_api_calls:
            - call: "POST /vm/organizations"
              payload: { name: "Helping Hands" }
              as: ShiftCoordinator
              captures: { org_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: ShiftCoordinator
            - call: "POST /vm/volunteers"
              payload: { organization_id: "${org_id}", full_name: "Cy V", email: "cy@x.com" }
              as: ShiftCoordinator
              captures: { vol_id: $.data.id }
            - call: "POST /vm/opportunities"
              payload: { organization_id: "${org_id}", title: "Festival" }
              as: ShiftCoordinator
              captures: { opp_id: $.data.id }
            - call: "POST /vm/shifts"
              payload: { opportunity_id: "${opp_id}", starts_at: "2026-07-01T09:00:00Z", ends_at: "2026-07-01T12:30:00Z", capacity: 5 }
              as: ShiftCoordinator
              captures: { shift_a: $.data.id, shift_a_v: $.data.version }
            - call: "POST /vm/shifts"
              payload: { opportunity_id: "${opp_id}", starts_at: "2026-07-01T13:00:00Z", ends_at: "2026-07-01T15:15:00Z", capacity: 5 }
              as: ShiftCoordinator
              captures: { shift_b: $.data.id, shift_b_v: $.data.version }
            - call: "POST /vm/opportunities/${opp_id}/publish"
              payload: {}
              as: ShiftCoordinator
            - call: "POST /vm/shifts/${shift_a}/signups"
              payload: { volunteer_id: "${vol_id}", expected_shift_version: "${shift_a_v}" }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { su_a: $.data.id }
            - call: "POST /vm/shifts/${shift_b}/signups"
              payload: { volunteer_id: "${vol_id}", expected_shift_version: "${shift_b_v}" }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { su_b: $.data.id }
            - call: "POST /vm/signups/${su_a}/confirm"
              payload: {}
              as: Volunteer
              as_user_id: "${vol_id}"
            - call: "POST /vm/signups/${su_b}/confirm"
              payload: {}
              as: Volunteer
              as_user_id: "${vol_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T16:00:00Z" }
              as: ShiftCoordinator
            - call: "POST /vm/signups/${su_a}/check-in"
              payload: {}
              as: ShiftCoordinator
            - call: "POST /vm/signups/${su_b}/check-in"
              payload: {}
              as: ShiftCoordinator
            - call: "POST /vm/signups/${su_a}/log-hours"
              payload: { logged_hours: 3.5 }
              as: Volunteer
              as_user_id: "${vol_id}"
            - call: "POST /vm/signups/${su_b}/log-hours"
              payload: { logged_hours: 2.25 }
              as: Volunteer
              as_user_id: "${vol_id}"
            - call: "POST /vm/signups/${su_a}/verify-hours"
              payload: {}
              as: ShiftCoordinator
          trigger:
            - call: "POST /vm/signups/${su_b}/verify-hours"
              payload: {}
              as: ShiftCoordinator
            - call: "GET /vm/volunteers/${vol_id}"
              payload: {}
              as: ShiftCoordinator
              captures: { tvh: $.data.total_verified_hours }
          assert:
            - "Signup.${su_a}.verified_hours == 3.50"
            - "Signup.${su_b}.verified_hours == 2.25"
            - "Volunteer.${vol_id}.total_verified_hours == 5.75"

      - name: reliability_score_ratio_plus_penalty_nonlinear
        grounds:
          - calculations.reliability_score
          - state_machines.Signup.CONFIRMED_to_NO_SHOW
          - state_machines.Signup.HOURS_LOGGED_to_HOURS_VERIFIED
          - entities.Volunteer.fields.reliability_score
        distinguishing_aspect: "Mode (a) >=3-input non-linear formula: with V=1 verified and N=1 no-show, reliability_score == round(100*(1/2)) - 8*1 == 42, combining an attendance ratio with an additive per-no-show penalty (distinct from the milestone nested-rounding mode)."
        test_recipe:
          setup:
            - "One Volunteer with one HOURS_VERIFIED Signup and one NO_SHOW Signup on two distinct non-overlapping shifts."
          setup_api_calls:
            - call: "POST /vm/organizations"
              payload: { name: "Helping Hands", no_show_strike_limit: 5 }
              as: ShiftCoordinator
              captures: { org_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: ShiftCoordinator
            - call: "POST /vm/volunteers"
              payload: { organization_id: "${org_id}", full_name: "Di V", email: "di@x.com" }
              as: ShiftCoordinator
              captures: { vol_id: $.data.id }
            - call: "POST /vm/opportunities"
              payload: { organization_id: "${org_id}", title: "Soup Kitchen" }
              as: ShiftCoordinator
              captures: { opp_id: $.data.id }
            - call: "POST /vm/shifts"
              payload: { opportunity_id: "${opp_id}", starts_at: "2026-07-01T09:00:00Z", ends_at: "2026-07-01T12:00:00Z", capacity: 5 }
              as: ShiftCoordinator
              captures: { shift_a: $.data.id, shift_a_v: $.data.version }
            - call: "POST /vm/shifts"
              payload: { opportunity_id: "${opp_id}", starts_at: "2026-07-02T09:00:00Z", ends_at: "2026-07-02T12:00:00Z", capacity: 5 }
              as: ShiftCoordinator
              captures: { shift_b: $.data.id, shift_b_v: $.data.version }
            - call: "POST /vm/opportunities/${opp_id}/publish"
              payload: {}
              as: ShiftCoordinator
            - call: "POST /vm/shifts/${shift_a}/signups"
              payload: { volunteer_id: "${vol_id}", expected_shift_version: "${shift_a_v}" }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { su_a: $.data.id }
            - call: "POST /vm/shifts/${shift_b}/signups"
              payload: { volunteer_id: "${vol_id}", expected_shift_version: "${shift_b_v}" }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { su_b: $.data.id }
            - call: "POST /vm/signups/${su_a}/confirm"
              payload: {}
              as: Volunteer
              as_user_id: "${vol_id}"
            - call: "POST /vm/signups/${su_b}/confirm"
              payload: {}
              as: Volunteer
              as_user_id: "${vol_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T13:00:00Z" }
              as: ShiftCoordinator
            - call: "POST /vm/signups/${su_a}/check-in"
              payload: {}
              as: ShiftCoordinator
            - call: "POST /vm/signups/${su_a}/log-hours"
              payload: { logged_hours: 3.0 }
              as: Volunteer
              as_user_id: "${vol_id}"
            - call: "POST /vm/signups/${su_a}/verify-hours"
              payload: {}
              as: ShiftCoordinator
          trigger:
            - call: "POST /vm/signups/${su_b}/mark-no-show"
              payload: {}
              as: ShiftCoordinator
            - call: "GET /vm/volunteers/${vol_id}"
              payload: {}
              as: ShiftCoordinator
              captures: { rel: $.data.reliability_score }
          assert:
            - "Volunteer.${vol_id}.reliability_score == 42"
            - "Volunteer.${vol_id}.lifetime_no_show_count == 1"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: signup_hours_revision_cycle_logged_to_attended
        grounds:
          - state_machines.Signup.HOURS_LOGGED_to_ATTENDED
          - state_machines.Signup.ATTENDED_to_HOURS_LOGGED
          - entities.Signup.fields.logged_hours
        distinguishing_aspect: "Signup is non-linear via a cycle: HOURS_LOGGED -> ATTENDED (reject-hours, clears logged_hours) re-opens logging and the Volunteer can log again, returning to HOURS_LOGGED — a true revision loop on the Signup entity."
        test_recipe:
          setup:
            - "A Signup in HOURS_LOGGED state with logged_hours 2.0 on a 09:00-12:00 (3h) shift."
          setup_api_calls:
            - call: "POST /vm/organizations"
              payload: { name: "Helping Hands" }
              as: ShiftCoordinator
              captures: { org_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: ShiftCoordinator
            - call: "POST /vm/volunteers"
              payload: { organization_id: "${org_id}", full_name: "Ev V", email: "ev@x.com" }
              as: ShiftCoordinator
              captures: { vol_id: $.data.id }
            - call: "POST /vm/opportunities"
              payload: { organization_id: "${org_id}", title: "Library" }
              as: ShiftCoordinator
              captures: { opp_id: $.data.id }
            - call: "POST /vm/shifts"
              payload: { opportunity_id: "${opp_id}", starts_at: "2026-07-01T09:00:00Z", ends_at: "2026-07-01T12:00:00Z", capacity: 1 }
              as: ShiftCoordinator
              captures: { shift_id: $.data.id, shift_v: $.data.version }
            - call: "POST /vm/opportunities/${opp_id}/publish"
              payload: {}
              as: ShiftCoordinator
            - call: "POST /vm/shifts/${shift_id}/signups"
              payload: { volunteer_id: "${vol_id}", expected_shift_version: "${shift_v}" }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { signup_id: $.data.id }
            - call: "POST /vm/signups/${signup_id}/confirm"
              payload: {}
              as: Volunteer
              as_user_id: "${vol_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T12:30:00Z" }
              as: ShiftCoordinator
            - call: "POST /vm/signups/${signup_id}/check-in"
              payload: {}
              as: ShiftCoordinator
            - call: "POST /vm/signups/${signup_id}/log-hours"
              payload: { logged_hours: 2.0 }
              as: Volunteer
              as_user_id: "${vol_id}"
          trigger:
            - call: "POST /vm/signups/${signup_id}/reject-hours"
              payload: {}
              as: ShiftCoordinator
              captures: { st_after_reject: $.data.status, lh_after_reject: $.data.logged_hours }
            - call: "POST /vm/signups/${signup_id}/log-hours"
              payload: { logged_hours: 1.5 }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { st_after_relog: $.data.status }
          assert:
            - "after reject-hours Signup.${signup_id}.status == ATTENDED"
            - "after reject-hours Signup.${signup_id}.logged_hours == null"
            - "after re-log Signup.${signup_id}.status == HOURS_LOGGED"
            - "after re-log Signup.${signup_id}.logged_hours == 1.5"

      - name: background_check_branch_and_renewal_cycle
        grounds:
          - state_machines.BackgroundCheck.IN_PROGRESS_to_CLEARED
          - state_machines.BackgroundCheck.IN_PROGRESS_to_REJECTED
          - state_machines.BackgroundCheck.CLEARED_to_EXPIRED
          - state_machines.BackgroundCheck.EXPIRED_to_INITIATED
        distinguishing_aspect: "BackgroundCheck is non-linear on a different entity than Signup: IN_PROGRESS branches to {CLEARED, REJECTED} (fork) and CLEARED -> EXPIRED -> INITIATED forms a renewal cycle; renew returns an EXPIRED check to INITIATED."
        test_recipe:
          setup:
            - "A BackgroundCheck CLEARED (STANDARD, validity_days 1) at 2026-06-15T00:00:00Z; clock then advanced past valid_until so it lazily EXPIRES."
          setup_api_calls:
            - call: "POST /vm/organizations"
              payload: { name: "Helping Hands" }
              as: ComplianceOfficer
              captures: { org_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /vm/volunteers"
              payload: { organization_id: "${org_id}", full_name: "Fi V", email: "fi@x.com" }
              as: ComplianceOfficer
              captures: { vol_id: $.data.id }
            - call: "POST /vm/background-checks"
              payload: { volunteer_id: "${vol_id}", requested_tier: "STANDARD", validity_days: 1 }
              as: ComplianceOfficer
              captures: { chk_id: $.data.id }
            - call: "POST /vm/background-checks/${chk_id}/start"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /vm/volunteers/${vol_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { vol_v: $.data.version }
            - call: "POST /vm/background-checks/${chk_id}/decide"
              payload: { decision: "CLEARED", expected_volunteer_version: "${vol_v}" }
              as: ComplianceOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-17T00:00:00Z" }
              as: ComplianceOfficer
            - call: "GET /vm/background-checks/${chk_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { st_expired: $.data.status }
          trigger:
            - call: "POST /vm/background-checks/${chk_id}/renew"
              payload: {}
              as: ComplianceOfficer
              captures: { st_after_renew: $.data.status }
          assert:
            - "after clock advance GET BackgroundCheck.${chk_id}.status == EXPIRED"
            - "after renew BackgroundCheck.${chk_id}.status == INITIATED"
            - "after renew BackgroundCheck.${chk_id}.cleared_at == null"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: shift_complete_no_show_suspends_volunteer_depth3
        grounds:
          - state_machines.Shift.OPEN_to_COMPLETED
          - state_machines.Signup.CONFIRMED_to_NO_SHOW
          - calculations.reliability_score
          - entities.Volunteer.fields.status
        distinguishing_aspect: "Depth-3 cascade from Shift complete: complete(Shift) -> Signup CONFIRMED->NO_SHOW -> Volunteer.reliability_score recompute drops below threshold 40 -> Volunteer.status -> SUSPENDED; each hop is caused by the prior hop."
        test_recipe:
          setup:
            - "Org with reliability_suspension_threshold 40; a Volunteer with one CONFIRMED Signup on a single-seat shift whose ends_at is in the past relative to the clock; volunteer has zero prior verified signups (so one no-show => reliability 0)."
          setup_api_calls:
            - call: "POST /vm/organizations"
              payload: { name: "Strict Org", reliability_suspension_threshold: 40, no_show_strike_limit: 9 }
              as: ShiftCoordinator
              captures: { org_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: ShiftCoordinator
            - call: "POST /vm/volunteers"
              payload: { organization_id: "${org_id}", full_name: "Gu V", email: "gu@x.com" }
              as: ShiftCoordinator
              captures: { vol_id: $.data.id }
            - call: "POST /vm/opportunities"
              payload: { organization_id: "${org_id}", title: "Shelter" }
              as: ShiftCoordinator
              captures: { opp_id: $.data.id }
            - call: "POST /vm/shifts"
              payload: { opportunity_id: "${opp_id}", starts_at: "2026-07-01T09:00:00Z", ends_at: "2026-07-01T12:00:00Z", capacity: 1 }
              as: ShiftCoordinator
              captures: { shift_id: $.data.id, shift_v: $.data.version }
            - call: "POST /vm/opportunities/${opp_id}/publish"
              payload: {}
              as: ShiftCoordinator
            - call: "POST /vm/shifts/${shift_id}/signups"
              payload: { volunteer_id: "${vol_id}", expected_shift_version: "${shift_v}" }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { signup_id: $.data.id }
            - call: "POST /vm/signups/${signup_id}/confirm"
              payload: {}
              as: Volunteer
              as_user_id: "${vol_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T12:30:00Z" }
              as: ShiftCoordinator
          trigger:
            - call: "POST /vm/shifts/${shift_id}/complete"
              payload: {}
              as: ShiftCoordinator
            - call: "GET /vm/signups/${signup_id}"
              payload: {}
              as: ShiftCoordinator
              captures: { su_status: $.data.status }
            - call: "GET /vm/volunteers/${vol_id}"
              payload: {}
              as: ShiftCoordinator
              captures: { vol_status: $.data.status, rel: $.data.reliability_score }
          assert:
            - "Signup.${signup_id}.status == NO_SHOW"
            - "Volunteer.${vol_id}.reliability_score == 0"
            - "Volunteer.${vol_id}.status == SUSPENDED"

