  - rule_id: cross_entity_state_dependency
    instances:

      - name: billing_resume_blocked_when_linked_cmn_expired
        grounds:
          - state_machines.CertificateOfMedicalNecessity.ACTIVE_to_EXPIRED
          - state_machines.RentalContract[state_field=billing_status].ACCRUING_to_SUSPENDED
          - state_machines.RentalContract[state_field=billing_status].SUSPENDED_to_ACCRUING
          - validations[priority=63]
          - errors[ERR_CMN_NOT_ACTIVE]
          - calculations.recert_due_date
          - endpoints[POST /home-oxygen/_clock/set_current_utc]
        distinguishing_aspect: |
          Entity pair RentalContract -> CertificateOfMedicalNecessity: the contract's own
          billing_status transition SUSPENDED -> ACCRUING is legal on the contract's dimension yet
          must be refused with ERR_CMN_NOT_ACTIVE purely because the certificate row it points at
          has moved to EXPIRED, with nothing about the contract itself having changed.
