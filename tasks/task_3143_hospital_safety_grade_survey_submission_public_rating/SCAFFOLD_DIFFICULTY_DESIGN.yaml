              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: RatingAdmin
          trigger:
            - call: "POST /hospital-safety-rating/hospitals/${p0_id}/preliminary-results/${rev0_id}/corrections/${cor0_id}/decide"
              payload: { decision: "ACCEPT" }
