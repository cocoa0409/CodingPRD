                legal_name: "365 Day Supplier"
                ingredient_categories: ["DAIRY_BASE"]
                audit_frequency_days: 180
              as: QA_MANAGER
              captures: { sup365_id: $.data.id }
            - call: "POST /api/v1/suppliers"
