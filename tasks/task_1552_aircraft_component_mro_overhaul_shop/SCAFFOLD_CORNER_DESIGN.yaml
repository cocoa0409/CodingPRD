            - { call: "POST /mro/lease-agreements", payload: { customer_id: "${c_id}", unit_id: "${u_l}", start_date: "2026-08-10", end_date: "2026-08-14", daily_rate_cents: 100000, expected_unit_version: "${u_v}" }, as: CustomerServiceRep, captures: { ls: $.data.id } }
            - { call: "POST /mro/_clock/set_current_utc", payload: { to_iso8601: "2026-08-16T00:00:00Z" }, as: ShopManager }
