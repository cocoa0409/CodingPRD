scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:
      - name: create_account_returns_201_with_fields
        claim_type: Creation
        grounds: [entities.Account, endpoints]
        distinguishing_aspect: "POST /accounts with email+full_name returns 201 and an Account with id, version==1, monthly_premium_cents==0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /accounts"
              payload: { email: "c1@x.com", full_name: "C One" }
              as: Underwriter
              captures: { acct: $.data.id, v: $.data.version }
          assert:
            - "response status == 201"
            - "Account.${acct}.version == 1"
            - "Account.${acct}.monthly_premium_cents == 0"
            - "Account.${acct}.active_policy_count == 0"

      - name: get_account_not_found
        claim_type: Not Found
        grounds: [entities.Account]
        distinguishing_aspect: "GET /accounts/{nonexistent} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /accounts/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Underwriter
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 404"
            - "response error_id == ERR_NOT_FOUND"

      - name: create_policy_missing_required_field
        claim_type: Required Fields
        grounds: [entities.Policy, "validations[priority=13]"]
        distinguishing_aspect: "POST policy omitting reimbursement_rate_bps returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Account exists."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "c2@x.com", full_name: "C Two" }
              as: Underwriter
              captures: { acct: $.data.id }
          trigger:
            - call: "POST /accounts/${acct}/policies"
              payload: { pet_name: "Rex", species: "DOG", base_premium_cents: 4500, annual_deductible_cents: 25000, annual_cap_cents: 500000, effective_date: "2026-01-01T00:00:00Z" }
              as: Underwriter
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 400"
            - "response error_id == ERR_INVALID_REQUEST"

      - name: policy_waiting_period_default_applied
        claim_type: Defaults
        grounds: [entities.Policy.fields.waiting_period_days]
        distinguishing_aspect: "Omitting waiting_period_days defaults to 14."
        test_recipe:
          setup: ["Account exists."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "c3@x.com", full_name: "C Three" }
              as: Underwriter
              captures: { acct: $.data.id }
          trigger:
            - call: "POST /accounts/${acct}/policies"
              payload: { pet_name: "Rex", species: "DOG", base_premium_cents: 4500, annual_deductible_cents: 25000, reimbursement_rate_bps: 8000, annual_cap_cents: 500000, effective_date: "2026-01-01T00:00:00Z" }
              as: Underwriter
              captures: { pol: $.data.id }
          assert:
            - "Policy.${pol}.waiting_period_days == 14"
            - "Policy.${pol}.wellness_rider == false"
            - "Policy.${pol}.status == PENDING_PAYMENT"

      - name: create_policy_invalid_species_enum
        claim_type: Type Constraints
        grounds: [entities.Policy.fields.species, "validations[priority=13]"]
        distinguishing_aspect: "species not in {DOG,CAT} returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Account exists."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "c4@x.com", full_name: "C Four" }
              as: Underwriter
              captures: { acct: $.data.id }
          trigger:
            - call: "POST /accounts/${acct}/policies"
              payload: { pet_name: "Rex", species: "FERRET", base_premium_cents: 4500, annual_deductible_cents: 25000, reimbursement_rate_bps: 8000, annual_cap_cents: 500000, effective_date: "2026-01-01T00:00:00Z" }
              as: Underwriter
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 400"
            - "response error_id == ERR_INVALID_REQUEST"

      - name: account_system_fields_input_ignored
        claim_type: System Fields
        grounds: [entities.Account.fields.id]
        distinguishing_aspect: "Client-sent id/version/monthly_premium_cents are ignored; server mints id and sets version==1, premium==0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /accounts"
              payload: { email: "c5@x.com", full_name: "C Five" }
              as: PolicyHolder
              captures: { acct: $.data.id, v: $.data.version }
          assert:
            - "Account.${acct}.version == 1"
            - "Account.${acct}.monthly_premium_cents == 0"

      - name: condition_computed_exclusion_pre_existing
        claim_type: Computed Fields
        grounds: [entities.MedicalCondition.fields.exclusion_status, calculations.condition_exclusion]
        distinguishing_aspect: "Condition diagnosed before coverage_start gets exclusion_status==PRE_EXISTING on create."
        test_recipe:
          setup: ["ACTIVE policy effective 2026-01-01, waiting 14d -> coverage start 2026-01-15."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "c6@x.com", full_name: "C Six" }
              as: Underwriter
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/policies"
              payload: { pet_name: "Rex", species: "DOG", base_premium_cents: 4500, annual_deductible_cents: 25000, reimbursement_rate_bps: 8000, annual_cap_cents: 500000, waiting_period_days: 14, wellness_rider: false, effective_date: "2026-01-01T00:00:00Z" }
              as: Underwriter
              captures: { pol: $.data.id }
            - call: "POST /accounts/${acct}/policies/${pol}/activate"
              payload: {}
              as: Underwriter
          trigger:
            - call: "POST /accounts/${acct}/policies/${pol}/conditions"
              payload: { name: "old injury", first_diagnosed_date: "2026-01-05T00:00:00Z" }
              as: Underwriter
              captures: { cond: $.data.id, ex: $.data.exclusion_status }
          assert:
            - "MedicalCondition.${cond}.exclusion_status == PRE_EXISTING"

  # =========================================================================
  - section: state_machines
    instances:
      - name: activate_already_active_policy_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Policy.PENDING_PAYMENT_to_ACTIVE]
        distinguishing_aspect: "Activating an already-ACTIVE policy returns ERR_INVALID_STATE (409); no second PolicyYear created."
        test_recipe:
          setup: ["ACTIVE policy."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "c7@x.com", full_name: "C Seven" }
              as: Underwriter
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/policies"
              payload: { pet_name: "Rex", species: "DOG", base_premium_cents: 4500, annual_deductible_cents: 25000, reimbursement_rate_bps: 8000, annual_cap_cents: 500000, wellness_rider: false, effective_date: "2026-01-01T00:00:00Z" }
              as: Underwriter
              captures: { pol: $.data.id }
            - call: "POST /accounts/${acct}/policies/${pol}/activate"
              payload: {}
              as: Underwriter
          trigger:
            - call: "POST /accounts/${acct}/policies/${pol}/activate"
              payload: {}
              as: Underwriter
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 409"
            - "response error_id == ERR_INVALID_STATE"

      - name: cancel_cancelled_policy_terminal_lockdown
        claim_type: terminal_no_transition
        grounds: [state_machines.Policy.ACTIVE_to_CANCELLED]
        distinguishing_aspect: "From terminal CANCELLED, cancel again returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["ACTIVE policy then CANCELLED."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "c8@x.com", full_name: "C Eight" }
              as: Underwriter
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/policies"
              payload: { pet_name: "Rex", species: "DOG", base_premium_cents: 4500, annual_deductible_cents: 25000, reimbursement_rate_bps: 8000, annual_cap_cents: 500000, wellness_rider: false, effective_date: "2026-01-01T00:00:00Z" }
              as: Underwriter
              captures: { pol: $.data.id }
            - call: "POST /accounts/${acct}/policies/${pol}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /accounts/${acct}/policies/${pol}/cancel"
              payload: {}
              as: Underwriter
          trigger:
            - call: "POST /accounts/${acct}/policies/${pol}/cancel"
              payload: {}
              as: Underwriter
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 409"
            - "response error_id == ERR_INVALID_STATE"

      - name: claim_initial_state_is_draft
        claim_type: initial_state
        grounds: [state_machines.Claim, entities.Claim.fields.status]
        distinguishing_aspect: "A freshly created Claim starts in DRAFT with zeroed payable fields."
        test_recipe:
          setup: ["ACTIVE policy with a COVERED condition."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "c9@x.com", full_name: "C Nine" }
              as: Underwriter
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/policies"
              payload: { pet_name: "Rex", species: "DOG", base_premium_cents: 4500, annual_deductible_cents: 25000, reimbursement_rate_bps: 8000, annual_cap_cents: 500000, wellness_rider: false, effective_date: "2026-01-01T00:00:00Z" }
              as: Underwriter
              captures: { pol: $.data.id }
            - call: "POST /accounts/${acct}/policies/${pol}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /accounts/${acct}/policies/${pol}/conditions"
              payload: { name: "x", first_diagnosed_date: "2026-02-01T00:00:00Z" }
              as: Underwriter
              captures: { cond: $.data.id }
          trigger:
            - call: "POST /accounts/${acct}/policies/${pol}/claims"
              payload: { claim_type: "ILLNESS", incident_date: "2026-03-01T00:00:00Z", condition_id: "${cond}" }
              as: PolicyHolder
              as_user_id: "${acct}"
              captures: { cl: $.data.id }
          assert:
            - "Claim.${cl}.status == DRAFT"
            - "Claim.${cl}.reimbursed_cents == 0"

      - name: begin_review_from_draft_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Claim.SUBMITTED_to_IN_REVIEW]
        distinguishing_aspect: "begin-review on a DRAFT (not SUBMITTED) claim returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["DRAFT claim under an ACTIVE policy."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "c10@x.com", full_name: "C Ten" }
              as: Underwriter
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/policies"
              payload: { pet_name: "Rex", species: "DOG", base_premium_cents: 4500, annual_deductible_cents: 25000, reimbursement_rate_bps: 8000, annual_cap_cents: 500000, wellness_rider: false, effective_date: "2026-01-01T00:00:00Z" }
              as: Underwriter
              captures: { pol: $.data.id }
            - call: "POST /accounts/${acct}/policies/${pol}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /accounts/${acct}/policies/${pol}/conditions"
              payload: { name: "x", first_diagnosed_date: "2026-02-01T00:00:00Z" }
              as: Underwriter
              captures: { cond: $.data.id }
            - call: "POST /accounts/${acct}/policies/${pol}/claims"
              payload: { claim_type: "ILLNESS", incident_date: "2026-03-01T00:00:00Z", condition_id: "${cond}" }
              as: PolicyHolder
              as_user_id: "${acct}"
              captures: { cl: $.data.id }
          trigger:
            - call: "POST /claims/${cl}/begin-review"
              payload: {}
              as: ClaimsAdjuster
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 409"
            - "response error_id == ERR_INVALID_STATE"

      - name: ocr_low_mismatch_branches_to_ocr_done
        claim_type: side_effect
        grounds: [state_machines.InvoiceDocument.PENDING_OCR_to_OCR_DONE, entities.InvoiceDocument.fields.ocr_mismatch_bps]
        distinguishing_aspect: "OCR total within tolerance (250bps <= 500) sets ocr_status==OCR_DONE, not REVIEW_NEEDED."
        test_recipe:
          setup: ["DRAFT claim with one 40000c line and an invoice PENDING_OCR."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "c11@x.com", full_name: "C Eleven" }
              as: Underwriter
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/policies"
              payload: { pet_name: "Rex", species: "DOG", base_premium_cents: 4500, annual_deductible_cents: 25000, reimbursement_rate_bps: 8000, annual_cap_cents: 500000, wellness_rider: false, effective_date: "2026-01-01T00:00:00Z" }
              as: Underwriter
              captures: { pol: $.data.id }
            - call: "POST /accounts/${acct}/policies/${pol}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /accounts/${acct}/policies/${pol}/conditions"
              payload: { name: "x", first_diagnosed_date: "2026-02-01T00:00:00Z" }
              as: Underwriter
              captures: { cond: $.data.id }
            - call: "POST /accounts/${acct}/policies/${pol}/claims"
              payload: { claim_type: "ILLNESS", incident_date: "2026-03-01T00:00:00Z", condition_id: "${cond}" }
              as: PolicyHolder
              as_user_id: "${acct}"
              captures: { cl: $.data.id }
            - call: "POST /claims/${cl}/lines"
              payload: { description: "x", billed_amount_cents: 40000 }
              as: PolicyHolder
              as_user_id: "${acct}"
            - call: "POST /claims/${cl}/invoices"
              payload: { file_uri: "s3://inv/lo" }
              as: PolicyHolder
              as_user_id: "${acct}"
              captures: { inv: $.data.id }
          trigger:
            - call: "POST /claims/${cl}/invoices/${inv}/run-ocr"
              payload: { ocr_total_cents: 41000 }
              as: ClaimsAdjuster
              captures: { st: $.data.ocr_status, mm: $.data.ocr_mismatch_bps }
          assert:
            - "InvoiceDocument.${inv}.ocr_mismatch_bps == 250"
            - "InvoiceDocument.${inv}.ocr_status == OCR_DONE"

      - name: reject_from_ocr_done_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.InvoiceDocument.REVIEW_NEEDED_to_REJECTED]
        distinguishing_aspect: "reject is only valid from REVIEW_NEEDED; rejecting an OCR_DONE invoice returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Invoice in OCR_DONE (low mismatch)."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "c12@x.com", full_name: "C Twelve" }
              as: Underwriter
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/policies"
              payload: { pet_name: "Rex", species: "DOG", base_premium_cents: 4500, annual_deductible_cents: 25000, reimbursement_rate_bps: 8000, annual_cap_cents: 500000, wellness_rider: false, effective_date: "2026-01-01T00:00:00Z" }
              as: Underwriter
              captures: { pol: $.data.id }
            - call: "POST /accounts/${acct}/policies/${pol}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /accounts/${acct}/policies/${pol}/conditions"
              payload: { name: "x", first_diagnosed_date: "2026-02-01T00:00:00Z" }
              as: Underwriter
              captures: { cond: $.data.id }
            - call: "POST /accounts/${acct}/policies/${pol}/claims"
              payload: { claim_type: "ILLNESS", incident_date: "2026-03-01T00:00:00Z", condition_id: "${cond}" }
              as: PolicyHolder
              as_user_id: "${acct}"
              captures: { cl: $.data.id }
            - call: "POST /claims/${cl}/lines"
              payload: { description: "x", billed_amount_cents: 40000 }
              as: PolicyHolder
              as_user_id: "${acct}"
            - call: "POST /claims/${cl}/invoices"
              payload: { file_uri: "s3://inv/od" }
              as: PolicyHolder
              as_user_id: "${acct}"
              captures: { inv: $.data.id }
            - call: "POST /claims/${cl}/invoices/${inv}/run-ocr"
              payload: { ocr_total_cents: 40000 }
              as: ClaimsAdjuster
          trigger:
            - call: "POST /claims/${cl}/invoices/${inv}/reject"
              payload: {}
              as: ClaimsAdjuster
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 409"
            - "response error_id == ERR_INVALID_STATE"

      - name: pay_from_in_review_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Claim.APPROVED_to_PAID]
        distinguishing_aspect: "pay is only valid from APPROVED; paying an IN_REVIEW claim returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["IN_REVIEW claim (not yet adjudicated)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Underwriter
            - call: "POST /accounts"
              payload: { email: "c13@x.com", full_name: "C Thirteen" }
              as: Underwriter
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/policies"
              payload: { pet_name: "Rex", species: "DOG", base_premium_cents: 4500, annual_deductible_cents: 25000, reimbursement_rate_bps: 8000, annual_cap_cents: 500000, waiting_period_days: 14, wellness_rider: false, effective_date: "2026-01-01T00:00:00Z" }
              as: Underwriter
              captures: { pol: $.data.id }
            - call: "POST /accounts/${acct}/policies/${pol}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /accounts/${acct}/policies/${pol}/conditions"
              payload: { name: "x", first_diagnosed_date: "2026-02-01T00:00:00Z" }
              as: Underwriter
              captures: { cond: $.data.id }
            - call: "POST /accounts/${acct}/policies/${pol}/claims"
              payload: { claim_type: "ILLNESS", incident_date: "2026-03-01T00:00:00Z", condition_id: "${cond}" }
              as: PolicyHolder
              as_user_id: "${acct}"
              captures: { cl: $.data.id }
            - call: "POST /claims/${cl}/lines"
              payload: { description: "x", billed_amount_cents: 40000 }
              as: PolicyHolder
              as_user_id: "${acct}"
            - call: "POST /claims/${cl}/invoices"
              payload: { file_uri: "s3://inv/p" }
              as: PolicyHolder
              as_user_id: "${acct}"
              captures: { inv: $.data.id }
            - call: "POST /claims/${cl}/invoices/${inv}/run-ocr"
              payload: { ocr_total_cents: 40000 }
              as: ClaimsAdjuster
            - call: "POST /claims/${cl}/invoices/${inv}/accept"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /claims/${cl}/submit"
              payload: {}
              as: PolicyHolder
              as_user_id: "${acct}"
            - call: "POST /claims/${cl}/begin-review"
              payload: {}
              as: ClaimsAdjuster
          trigger:
            - call: "POST /claims/${cl}/pay"
              payload: {}
              as: ClaimsAdjuster
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 409"
            - "response error_id == ERR_INVALID_STATE"

      - name: wellness_claim_draws_bucket_not_deductible
        claim_type: side_effect
        grounds: [calculations.policy_year_ledger, entities.Claim.fields.wellness_paid_cents]
        distinguishing_aspect: "WELLNESS claim eligible 12000c on a rider policy pays wellness_paid_cents==12000, deductible_applied==0, reimbursed==0."
        test_recipe:
          setup: ["ACTIVE policy WITH wellness_rider; OPEN year; WELLNESS claim eligible 12000c past waiting period."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Underwriter
            - call: "POST /accounts"
              payload: { email: "c14@x.com", full_name: "C Fourteen" }
              as: Underwriter
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/policies"
              payload: { pet_name: "Rex", species: "DOG", base_premium_cents: 4500, annual_deductible_cents: 25000, reimbursement_rate_bps: 8000, annual_cap_cents: 500000, waiting_period_days: 14, wellness_rider: true, effective_date: "2026-01-01T00:00:00Z" }
              as: Underwriter
              captures: { pol: $.data.id }
            - call: "POST /accounts/${acct}/policies/${pol}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /accounts/${acct}/policies/${pol}/claims"
              payload: { claim_type: "WELLNESS", incident_date: "2026-03-01T00:00:00Z" }
              as: PolicyHolder
              as_user_id: "${acct}"
              captures: { cl: $.data.id }
            - call: "POST /claims/${cl}/lines"
              payload: { description: "vaccines", billed_amount_cents: 12000 }
              as: PolicyHolder
              as_user_id: "${acct}"
            - call: "POST /claims/${cl}/invoices"
              payload: { file_uri: "s3://inv/well" }
              as: PolicyHolder
              as_user_id: "${acct}"
              captures: { inv: $.data.id }
            - call: "POST /claims/${cl}/invoices/${inv}/run-ocr"
              payload: { ocr_total_cents: 12000 }
              as: ClaimsAdjuster
            - call: "POST /claims/${cl}/invoices/${inv}/accept"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /claims/${cl}/submit"
              payload: {}
              as: PolicyHolder
              as_user_id: "${acct}"
            - call: "POST /claims/${cl}/begin-review"
              payload: {}
              as: ClaimsAdjuster
            - call: "GET /accounts/${acct}/policies/${pol}/policy-years"
              payload: {}
              as: ClaimsAdjuster
              captures: { pyv: "$.data[0].version "}
          trigger:
            - call: "POST /claims/${cl}/adjudicate"
              payload: { decision: "APPROVE", expected_policy_year_version: "${pyv}" }
              as: ClaimsAdjuster
          assert:
            - "Claim.${cl}.wellness_paid_cents == 12000"
            - "Claim.${cl}.deductible_applied_cents == 0"
            - "Claim.${cl}.reimbursed_cents == 0"

  # =========================================================================
  - section: calculations
    instances:
      - name: line_exclusion_reduces_eligible_amount
        claim_type: input_set_filtering
        grounds: [calculations.claim_eligible_amount, state_machines.Claim.IN_REVIEW_to_APPROVED]
        distinguishing_aspect: "Excluding one of two 5000c lines via PATCH while IN_REVIEW drops eligible_amount_cents from 10000 to 5000."
        test_recipe:
          setup: ["IN_REVIEW claim with two 5000c lines; reviewer excludes the second line."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Underwriter
            - call: "POST /accounts"
              payload: { email: "c15@x.com", full_name: "C Fifteen" }
              as: Underwriter
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/policies"
