              as: Analyst
              as_user_id: "${an1_id}"
            - call: "POST /research/inquiry-requests"
              payload: { seat_id: "${seat_id}", topic_route: "CLOUD_COST", question_summary: "Inquiry two", requested_start_utc: "2026-09-05T10:00:00Z", duration_minutes: 45, preparation_notes: "Brief two." }
              as: SeatHolder
              as_user_id: "${seat_id}"
              captures: { inq2_id: $.data.id }
            - call: "POST /research/inquiry-requests"
