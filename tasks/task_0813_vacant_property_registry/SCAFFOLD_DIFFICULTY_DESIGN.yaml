      - name: schedule_inspection_existence_beats_temporal
        grounds:
          - validations[priority=3]
          - validations[priority=11]
          - errors[ERR_PROPERTY_NOT_FOUND]
          - errors[ERR_INSPECTOR_DOUBLE_BOOKED]
        distinguishing_aspect: |
          Category pair existence (priority 3, property must exist) vs business_temporal (priority
          11, inspector overlap): a request naming a non-existent property_id AND an overlapping
          inspector_badge returns ERR_PROPERTY_NOT_FOUND, not ERR_INSPECTOR_DOUBLE_BOOKED.
        test_recipe:
          setup:
            - "OWNER/VACANT property with a SCHEDULED inspection for inspector B11, window 2026-03-02T09:00-11:00."
          setup_api_calls:
