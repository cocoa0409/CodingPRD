# =============================================================================
# Section 1.9: Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over SCAFFOLD.yaml sections 1.1-1.7: entities, state machines,
# calculations, validations, endpoints, errors, RBAC, cross-cutting layers,
# consistency model. Instances already exercised by SCAFFOLD_DIFFICULTY_DESIGN
# are emitted as excluded_because stubs. All chains replay from empty-DB using
# only section 1.5 endpoints; all numeric asserts are literals.
# =============================================================================
scaffold_corner_design:
  # ------------------------------------------------------------- entities ---
  - section: entities
    instances:
      - name: project_creation_defaults_and_envelope
        claim_type: creation
        grounds: ["entities.FFEProject", "endpoints[POST /api/projects]"]
        distinguishing_aspect: "A project created with only required fields gets the documented defaults and the fixed response envelope."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/projects", payload: { name: "P-E1", hotel_name: "Hotel A", brand_program: "MARQUEE_SELECT", total_budget_cents: 10000000 }, as: PurchasingAgent, captures: { p_id: $.data.id } }
          assert:
            - "HTTP 201; envelope has meta.api_request_id, meta.api_request_timestamp, response_type == object"
            - "FFEProject.${p_id}: status == PLANNING, procurement_posture == OPEN, unallocated_contingency_cents == 0, default_crew_capacity_per_floor_day == 8, committed_cents == 0, actual_spend_cents == 0, sunk_fees_cents == 0, version == 1, created_at present"

      - name: spec_computed_and_system_fields
        claim_type: computed_fields
        grounds: [entities.SpecItem.fields.total_qty, entities.SpecItem.fields.attic_target_qty]
        distinguishing_aspect: "total_qty is derived (quantity_per_room x room_count) and attic_target_qty starts at 0 with no PO line; system fields are server-stamped."
        test_recipe:
          setup: ["Project exists"]
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "P-E2", hotel_name: "H", brand_program: "INDIE_SOFT", total_budget_cents: 5000000 }, as: PurchasingAgent, captures: { p_id: $.data.id } }
          trigger:
            - { call: "POST /api/spec-items", payload: { project_id: "${p_id}", category: "LIGHTING", description: "Sconce", brand_standard_ref: "IS-SC", quantity_per_room: 2, room_count: 20, unit_budget_cents: 8000 }, as: PurchasingAgent, captures: { s_id: $.data.id } }
          assert:
            - "SpecItem.${s_id}.total_qty == 40 (computed; client cannot set it)"
            - "SpecItem.${s_id}.attic_target_qty == 0 (no POLine exists yet)"
            - "SpecItem.${s_id}.required_lead_days == 21 and is_critical == false and attic_target_pct == 0.05 (defaults)"
            - "id is a UUID, created_at/version present, version == 1, status == DRAFT (initial state)"

      - name: project_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_PROJECT_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent project id returns the project-specific 404, not a generic error."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/projects/00000000-0000-0000-0000-000000000000", as: PurchasingAgent, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 404 with error_id == ERR_PROJECT_NOT_FOUND; envelope response_type == error and data.message present"

      - name: missing_required_total_budget_returns_400
        claim_type: required_fields
        grounds: ["errors[ERR_INVALID_REQUEST]", "entities.FFEProject.fields.total_budget_cents"]
        distinguishing_aspect: "Omitting the required input total_budget_cents is rejected as a format error before any business rule runs."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/projects", payload: { name: "P-E4", hotel_name: "H", brand_program: "MARQUEE_SELECT" }, as: PurchasingAgent, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 400 with error_id == ERR_INVALID_REQUEST; no project is created (GET /api/projects returns total_count == 0)"

      - name: invalid_brand_program_enum_returns_400
        claim_type: type_constraints
        grounds: ["entities.FFEProject.fields.brand_program", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "An enum value outside {MARQUEE_SELECT, MARQUEE_LUXE, INDIE_SOFT} is rejected."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/projects", payload: { name: "P-E5", hotel_name: "H", brand_program: "NOT_A_BRAND", total_budget_cents: 1000000 }, as: PurchasingAgent, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 400 with error_id == ERR_INVALID_REQUEST"

      - name: attic_movements_are_immutable_events
        claim_type: immutability
        grounds: [entities.AtticStockMovement, state_machines.AtticStockMovement]
        distinguishing_aspect: "AtticStockMovement has common_fields false: list rows expose id and created_at but no version/updated_at, and the API surface has no update endpoint for it."
        test_recipe:
          setup:
            - "Project in PROCUREMENT; FURNITURE budgeted 8000000c; spec (50 total) approved/awarded; PO line 50 x 10000c cube 10 shipped and received with 50 good units (qty_installable 50)"
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "P-E6", hotel_name: "H", brand_program: "MARQUEE_SELECT", total_budget_cents: 10000000 }, as: PurchasingAgent, captures: { p_id: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { project_id: "${p_id}", category: "FURNITURE", budgeted_cents: 8000000 }, as: PurchasingAgent }
            - { call: "POST /api/projects/${p_id}/lifecycle-transitions", payload: { to_status: "PROCUREMENT" }, as: PurchasingAgent }
            - { call: "POST /api/spec-items", payload: { project_id: "${p_id}", category: "FURNITURE", description: "Dresser", brand_standard_ref: "MS-DR", quantity_per_room: 1, room_count: 50, unit_budget_cents: 10000, attic_min_qty: 5, attic_max_qty: 40 }, as: PurchasingAgent, captures: { s_id: $.data.id } }
            - { call: "POST /api/spec-items/${s_id}/submit", as: PurchasingAgent }
            - { call: "POST /api/spec-items/${s_id}/brand-review", payload: { decision: "APPROVE" }, as: BrandApprover }
            - { call: "POST /api/bids", payload: { spec_item_id: "${s_id}", vendor_name: "VENDA", unit_price_cents: 10000, freight_estimate_cents: 0, lead_time_days: 7 }, as: Vendor, captures: { b_id: $.data.id } }
            - { call: "POST /api/bids/${b_id}/sample-decision", payload: { outcome: "APPROVED" }, as: PurchasingAgent }
            - { call: "POST /api/bids/${b_id}/award", as: PurchasingAgent }
            - { call: "POST /api/purchase-orders", payload: { project_id: "${p_id}", vendor_name: "VENDA" }, as: PurchasingAgent, captures: { po_id: $.data.id } }
            - { call: "POST /api/purchase-orders/${po_id}/lines", payload: { spec_item_id: "${s_id}", quantity_ordered: 50, declared_cube_m3: 10 }, as: PurchasingAgent, captures: { l_id: $.data.id } }
            - { call: "POST /api/purchase-orders/${po_id}/transitions", payload: { axis: "FULFILLMENT", to_status: "ACKNOWLEDGED" }, as: Vendor }
            - { call: "POST /api/purchase-orders/${po_id}/transitions", payload: { axis: "FULFILLMENT", to_status: "READY_TO_SHIP" }, as: Vendor }
            - { call: "POST /api/shipments", payload: { project_id: "${p_id}", carrier_name: "CARR" }, as: PurchasingAgent, captures: { sh_id: $.data.id } }
            - { call: "POST /api/shipments/${sh_id}/transitions", payload: { to_status: "CONSOLIDATING" }, as: PurchasingAgent }
            - { call: "POST /api/shipments/${sh_id}/purchase-orders", payload: { purchase_order_id: "${po_id}" }, as: PurchasingAgent }
            - { call: "POST /api/shipments/${sh_id}/transitions", payload: { to_status: "SEALED" }, as: PurchasingAgent }
            - { call: "POST /api/shipments/${sh_id}/transitions", payload: { to_status: "IN_TRANSIT" }, as: PurchasingAgent }
            - { call: "POST /api/receiving-events", payload: { shipment_id: "${sh_id}", lines: [ { po_line_id: "${l_id}", qty_received: 50, qty_damaged: 0 } ] }, as: WarehouseReceiver, captures: { ev_id: $.data.id } }
            - { call: "POST /api/receiving-events/${ev_id}/transitions", payload: { to_status: "POSTED" }, as: WarehouseReceiver }
            - { call: "GET /api/po-lines/${l_id}", as: WarehouseReceiver, captures: { l_v: $.data.version } }
            - { call: "POST /api/po-lines/${l_id}/attic-transfers", payload: { direction: "IN", quantity: 1, expected_po_line_version: "${l_v}" }, as: WarehouseReceiver, captures: { m_id: $.data.id } }
          trigger:
            - { call: "GET /api/po-lines/${l_id}/attic-movements", as: WarehouseReceiver }
          assert:
            - "List contains exactly 1 row for movement ${m_id} with direction == IN, quantity == 1, resulting_installable == 49, resulting_attic == 1"
            - "The row exposes id and created_at but carries no version and no updated_at keys (immutable event, common_fields false)"

  # -------------------------------------------------------- state machines ---
  - section: state_machines
    instances:
      - name: spec_submit_invalid_from_submitted
        claim_type: invalid_transition
        grounds: ["state_machines.SpecItem.DRAFT_to_SUBMITTED", "errors[ERR_SPEC_NOT_SUBMITTABLE]"]
        distinguishing_aspect: "Submit is legal only from DRAFT or BRAND_REJECTED; from SUBMITTED it is rejected and the spec stays SUBMITTED."
        test_recipe:
          setup: ["Project exists; spec created (starts DRAFT) and submitted once"]
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "P-S1", hotel_name: "H", brand_program: "INDIE_SOFT", total_budget_cents: 5000000 }, as: PurchasingAgent, captures: { p_id: $.data.id } }
            - { call: "POST /api/spec-items", payload: { project_id: "${p_id}", category: "TEXTILES", description: "Drapery", brand_standard_ref: "IS-D", quantity_per_room: 1, room_count: 10, unit_budget_cents: 5000 }, as: PurchasingAgent, captures: { s_id: $.data.id } }
            - { call: "POST /api/spec-items/${s_id}/submit", as: PurchasingAgent }
          trigger:
            - { call: "POST /api/spec-items/${s_id}/submit", as: PurchasingAgent, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 409 with error_id == ERR_SPEC_NOT_SUBMITTABLE"
            - "SpecItem.${s_id}.status remains SUBMITTED"

      - name: brand_review_from_draft_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.SpecItem.SUBMITTED_to_BRAND_APPROVED", "errors[ERR_SPEC_NOT_IN_REVIEW]"]
        distinguishing_aspect: "brand-review requires SUBMITTED; against a DRAFT spec it fails with ERR_SPEC_NOT_IN_REVIEW."
        test_recipe:
          setup: ["Project exists; spec created, never submitted"]
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "P-S2", hotel_name: "H", brand_program: "INDIE_SOFT", total_budget_cents: 5000000 }, as: PurchasingAgent, captures: { p_id: $.data.id } }
            - { call: "POST /api/spec-items", payload: { project_id: "${p_id}", category: "DECOR", description: "Artwork", brand_standard_ref: "IS-A", quantity_per_room: 1, room_count: 10, unit_budget_cents: 3000 }, as: PurchasingAgent, captures: { s_id: $.data.id } }
          trigger:
            - { call: "POST /api/spec-items/${s_id}/brand-review", payload: { decision: "APPROVE" }, as: BrandApprover, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 409 with error_id == ERR_SPEC_NOT_IN_REVIEW; status remains DRAFT"

      - name: award_selector_and_terminal_lockdown
        claim_type: valid_transition
        grounds: ["calculations.bid_evaluated_cost", "state_machines.VendorBid", "errors[ERR_BID_NOT_BEST_EVALUATED]", "errors[ERR_BID_NOT_SUBMITTED]"]
        distinguishing_aspect: "Only the top-ranked SAMPLE_APPROVED bid is awardable (evaluated 735000c vs 540000c); after award the loser cascades to REJECTED and the AWARDED bid no longer accepts sample decisions."
        test_recipe:
          setup:
            - "Project exists; spec (2/room x 20 rooms = 40 total, required_lead_days 21) BRAND_APPROVED"
            - "Bid A: 12000c unit, 30000c freight, 30d lead (evaluated 12000*40 + 30000 + 9*25000 = 735000c); Bid B: 13000c unit, 20000c freight, 20d lead (evaluated 520000 + 20000 + 0 = 540000c); both SAMPLE_APPROVED"
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "P-S5", hotel_name: "H", brand_program: "MARQUEE_SELECT", total_budget_cents: 10000000 }, as: PurchasingAgent, captures: { p_id: $.data.id } }
            - { call: "POST /api/spec-items", payload: { project_id: "${p_id}", category: "FURNITURE", description: "Guest chair", brand_standard_ref: "MS-GR-01", quantity_per_room: 2, room_count: 20, unit_budget_cents: 15000, required_lead_days: 21 }, as: PurchasingAgent, captures: { s_id: $.data.id } }
            - { call: "POST /api/spec-items/${s_id}/submit", as: PurchasingAgent }
            - { call: "POST /api/spec-items/${s_id}/brand-review", payload: { decision: "APPROVE" }, as: BrandApprover }
            - { call: "POST /api/bids", payload: { spec_item_id: "${s_id}", vendor_name: "VENDA", unit_price_cents: 12000, freight_estimate_cents: 30000, lead_time_days: 30 }, as: Vendor, captures: { ba_id: $.data.id } }
            - { call: "POST /api/bids", payload: { spec_item_id: "${s_id}", vendor_name: "VENDA", unit_price_cents: 13000, freight_estimate_cents: 20000, lead_time_days: 20 }, as: Vendor, captures: { bb_id: $.data.id } }
            - { call: "POST /api/bids/${ba_id}/sample-decision", payload: { outcome: "APPROVED" }, as: PurchasingAgent }
            - { call: "POST /api/bids/${bb_id}/sample-decision", payload: { outcome: "APPROVED" }, as: PurchasingAgent }
          trigger:
            - { call: "POST /api/bids/${ba_id}/award", as: PurchasingAgent, captures: { err1: $.data.error_id } }
            - { call: "POST /api/bids/${bb_id}/award", as: PurchasingAgent, captures: { award_status: $.data.status } }
            - { call: "GET /api/bids/${ba_id}", as: PurchasingAgent, captures: { a_status: $.data.status, a_eval: $.data.evaluated_cost_cents } }
            - { call: "POST /api/bids/${bb_id}/sample-decision", payload: { outcome: "APPROVED" }, as: PurchasingAgent, captures: { err2: $.data.error_id } }
          assert:
            - "Award of the worse bid A is rejected 409 with error_id == ERR_BID_NOT_BEST_EVALUATED (735000 > 540000)"
            - "Award of the top-ranked bid B succeeds: VendorBid.${bb_id}.status == AWARDED and evaluated_cost_cents == 540000"
            - "Sibling cascade: VendorBid.${ba_id}.status == REJECTED (conditional cascade on award); its evaluated_cost_cents == 735000"
            - "Terminal lockdown: sample-decision on the AWARDED bid B is rejected 409 with error_id == ERR_BID_NOT_SUBMITTED"

      - name: sample_round_cap_blocks_second_resubmit
        claim_type: invalid_transition
        grounds: ["state_machines.VendorBid.SAMPLE_REJECTED_to_SUBMITTED", "errors[ERR_SAMPLE_ROUNDS_EXHAUSTED]"]
        distinguishing_aspect: "The sample negotiation loop allows exactly one resubmit (rounds 1..2); a second resubmit after the round-2 rejection is rejected."
        test_recipe:
          setup: ["Project; spec BRAND_APPROVED; bid rejected in round 1, resubmitted (round 2), rejected again"]
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "P-S4", hotel_name: "H", brand_program: "MARQUEE_SELECT", total_budget_cents: 10000000 }, as: PurchasingAgent, captures: { p_id: $.data.id } }
            - { call: "POST /api/spec-items", payload: { project_id: "${p_id}", category: "FURNITURE", description: "Guest chair", brand_standard_ref: "MS-GR-01", quantity_per_room: 2, room_count: 20, unit_budget_cents: 15000 }, as: PurchasingAgent, captures: { s_id: $.data.id } }
            - { call: "POST /api/spec-items/${s_id}/submit", as: PurchasingAgent }
            - { call: "POST /api/spec-items/${s_id}/brand-review", payload: { decision: "APPROVE" }, as: BrandApprover }
            - { call: "POST /api/bids", payload: { spec_item_id: "${s_id}", vendor_name: "VENDA", unit_price_cents: 15000, freight_estimate_cents: 0, lead_time_days: 14 }, as: Vendor, captures: { b_id: $.data.id } }
            - { call: "POST /api/bids/${b_id}/sample-decision", payload: { outcome: "REJECTED" }, as: PurchasingAgent }
            - { call: "POST /api/bids/${b_id}/resubmit", payload: { unit_price_cents: 14500 }, as: Vendor, captures: { round2: $.data.sample_round } }
            - { call: "POST /api/bids/${b_id}/sample-decision", payload: { outcome: "REJECTED" }, as: PurchasingAgent }
          trigger:
            - { call: "POST /api/bids/${b_id}/resubmit", payload: { unit_price_cents: 14000 }, as: Vendor, captures: { err: $.data.error_id } }
          assert:
            - "First resubmit succeeded with sample_round == 2"
            - "Second resubmit is rejected 409 with error_id == ERR_SAMPLE_ROUNDS_EXHAUSTED; status remains SAMPLE_REJECTED"

      - name: claim_dispute_resubmit_cycle_with_invalid_resolve
        claim_type: valid_transition
        grounds: ["state_machines.DamageClaim.SUBMITTED_to_DISPUTED", "state_machines.DamageClaim.DISPUTED_to_SUBMITTED", "errors[ERR_INVALID_CLAIM_TRANSITION]"]
        distinguishing_aspect: "The negotiation cycle SUBMITTED -> DISPUTED -> SUBMITTED traverses in both directions; resolving from DISPUTED (skipping resubmission) is an invalid transition."
        test_recipe:
          setup:
            - "Project in PROCUREMENT, FURNITURE budgeted 8000000c; spec 40 x 15000c cube 10 awarded and ordered; shipment received with 40 received, 10 damaged"
            - "DAMAGE claim qty 5 claimed 50000c, SUBMITTED"
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "P-S6", hotel_name: "H", brand_program: "MARQUEE_SELECT", total_budget_cents: 10000000 }, as: PurchasingAgent, captures: { p_id: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { project_id: "${p_id}", category: "FURNITURE", budgeted_cents: 8000000 }, as: PurchasingAgent }
            - { call: "POST /api/projects/${p_id}/lifecycle-transitions", payload: { to_status: "PROCUREMENT" }, as: PurchasingAgent }
            - { call: "POST /api/spec-items", payload: { project_id: "${p_id}", category: "FURNITURE", description: "Guest chair", brand_standard_ref: "MS-GR-01", quantity_per_room: 2, room_count: 20, unit_budget_cents: 15000 }, as: PurchasingAgent, captures: { s_id: $.data.id } }
            - { call: "POST /api/spec-items/${s_id}/submit", as: PurchasingAgent }
            - { call: "POST /api/spec-items/${s_id}/brand-review", payload: { decision: "APPROVE" }, as: BrandApprover }
            - { call: "POST /api/bids", payload: { spec_item_id: "${s_id}", vendor_name: "VENDA", unit_price_cents: 15000, freight_estimate_cents: 0, lead_time_days: 14 }, as: Vendor, captures: { b_id: $.data.id } }
            - { call: "POST /api/bids/${b_id}/sample-decision", payload: { outcome: "APPROVED" }, as: PurchasingAgent }
            - { call: "POST /api/bids/${b_id}/award", as: PurchasingAgent }
            - { call: "POST /api/purchase-orders", payload: { project_id: "${p_id}", vendor_name: "VENDA" }, as: PurchasingAgent, captures: { po_id: $.data.id } }
            - { call: "POST /api/purchase-orders/${po_id}/lines", payload: { spec_item_id: "${s_id}", quantity_ordered: 40, declared_cube_m3: 10 }, as: PurchasingAgent, captures: { l_id: $.data.id } }
            - { call: "POST /api/purchase-orders/${po_id}/transitions", payload: { axis: "FULFILLMENT", to_status: "ACKNOWLEDGED" }, as: Vendor }
            - { call: "POST /api/purchase-orders/${po_id}/transitions", payload: { axis: "FULFILLMENT", to_status: "READY_TO_SHIP" }, as: Vendor }
            - { call: "POST /api/shipments", payload: { project_id: "${p_id}", carrier_name: "CARR" }, as: PurchasingAgent, captures: { sh_id: $.data.id } }
            - { call: "POST /api/shipments/${sh_id}/transitions", payload: { to_status: "CONSOLIDATING" }, as: PurchasingAgent }
            - { call: "POST /api/shipments/${sh_id}/purchase-orders", payload: { purchase_order_id: "${po_id}" }, as: PurchasingAgent }
            - { call: "POST /api/shipments/${sh_id}/transitions", payload: { to_status: "SEALED" }, as: PurchasingAgent }
            - { call: "POST /api/shipments/${sh_id}/transitions", payload: { to_status: "IN_TRANSIT" }, as: PurchasingAgent }
            - { call: "POST /api/receiving-events", payload: { shipment_id: "${sh_id}", lines: [ { po_line_id: "${l_id}", qty_received: 40, qty_damaged: 10 } ] }, as: WarehouseReceiver, captures: { ev_id: $.data.id } }
            - { call: "POST /api/receiving-events/${ev_id}/transitions", payload: { to_status: "POSTED" }, as: WarehouseReceiver }
            - { call: "POST /api/damage-claims", payload: { po_line_id: "${l_id}", claim_type: "DAMAGE", quantity: 5, claimed_credit_cents: 50000 }, as: PurchasingAgent, captures: { cl_id: $.data.id } }
            - { call: "POST /api/damage-claims/${cl_id}/transitions", payload: { to_status: "SUBMITTED" }, as: PurchasingAgent }
            - { call: "POST /api/damage-claims/${cl_id}/transitions", payload: { to_status: "DISPUTED" }, as: Vendor }
          trigger:
            - { call: "POST /api/damage-claims/${cl_id}/transitions", payload: { to_status: "RESOLVED_CREDIT", approved_credit_cents: 40000 }, as: PurchasingAgent, captures: { err: $.data.error_id } }
            - { call: "POST /api/damage-claims/${cl_id}/transitions", payload: { to_status: "SUBMITTED" }, as: PurchasingAgent, captures: { back: $.data.status } }
            - { call: "POST /api/damage-claims/${cl_id}/transitions", payload: { to_status: "RESOLVED_CREDIT", approved_credit_cents: 40000 }, as: PurchasingAgent, captures: { fin: $.data.status } }
          assert:
            - "Resolve from DISPUTED is rejected 409 with error_id == ERR_INVALID_CLAIM_TRANSITION"
            - "Resubmit closes the cycle: status back to SUBMITTED"
            - "Resolve from SUBMITTED succeeds: status == RESOLVED_CREDIT, approved_credit_cents == 40000"
            - "POLine.${l_id}.damage_credit_cents == 40000 and qty_damaged_credited == 5, qty_damaged_unresolved == 5"
      - name: window_start_without_tasks_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.InstallationWindow.RELEASED_to_IN_PROGRESS", "errors[ERR_WINDOW_NO_TASKS]"]
        distinguishing_aspect: "A RELEASED window with zero tasks cannot start; the guard fires before any stock check."
        test_recipe:
          setup: ["Project exists; window [2026-07-01, 2026-07-05) crew 1 created and released (no tasks)"]
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "P-S7", hotel_name: "H", brand_program: "MARQUEE_SELECT", total_budget_cents: 5000000 }, as: PurchasingAgent, captures: { p_id: $.data.id } }
            - { call: "POST /api/installation-windows", payload: { project_id: "${p_id}", floor_number: 2, start_date: "2026-07-01", end_date: "2026-07-05", crew_count: 1 }, as: InstallationManager, captures: { w_id: $.data.id } }
            - { call: "POST /api/installation-windows/${w_id}/transitions", payload: { to_status: "RELEASED" }, as: InstallationManager }
          trigger:
            - { call: "POST /api/installation-windows/${w_id}/transitions", payload: { to_status: "IN_PROGRESS" }, as: InstallationManager, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 409 with error_id == ERR_WINDOW_NO_TASKS; status remains RELEASED"
            - "FFEProject.${p_id}.procurement_posture remains OPEN"

      - name: lifecycle_skip_and_budget_gate
        claim_type: invalid_transition
        grounds: ["state_machines.FFEProject", "errors[ERR_NO_BUDGET_LINES]", "errors[ERR_INVALID_LIFECYCLE_TRANSITION]"]
        distinguishing_aspect: "PLANNING -> PROCUREMENT requires a budget line (ERR_NO_BUDGET_LINES), and PLANNING -> INSTALLATION is never a legal jump (ERR_INVALID_LIFECYCLE_TRANSITION) even when budget lines exist."
        test_recipe:
          setup: ["Project P1 with no budget lines; project P2 with one budget line"]
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "P-S8a", hotel_name: "H", brand_program: "MARQUEE_SELECT", total_budget_cents: 5000000 }, as: PurchasingAgent, captures: { p1_id: $.data.id } }
            - { call: "POST /api/projects", payload: { name: "P-S8b", hotel_name: "H", brand_program: "MARQUEE_SELECT", total_budget_cents: 5000000 }, as: PurchasingAgent, captures: { p2_id: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { project_id: "${p2_id}", category: "FURNITURE", budgeted_cents: 1000000 }, as: PurchasingAgent }
          trigger:
            - { call: "POST /api/projects/${p1_id}/lifecycle-transitions", payload: { to_status: "PROCUREMENT" }, as: PurchasingAgent, captures: { err1: $.data.error_id } }
            - { call: "POST /api/projects/${p2_id}/lifecycle-transitions", payload: { to_status: "INSTALLATION" }, as: PurchasingAgent, captures: { err2: $.data.error_id } }
          assert:
            - "P1 advance fails 409 ERR_NO_BUDGET_LINES (precondition, not generic invalid transition)"
            - "P2 skip-advance fails 409 ERR_INVALID_LIFECYCLE_TRANSITION"
            - "Both projects remain in PLANNING"

      - name: shipment_cancel_detaches_pos_and_seal_from_planned_invalid
        claim_type: compensation
        grounds: ["state_machines.Shipment.PLANNED_to_CANCELLED", "errors[ERR_INVALID_SHIPMENT_TRANSITION]"]
        distinguishing_aspect: "Cancelling a CONSOLIDATING shipment reverses the attach side effect (PO returns to READY_TO_SHIP, shipment_id cleared) with no drift in committed budget; sealing from PLANNED is an invalid transition."
        test_recipe:
          setup:
            - "Project in PROCUREMENT, FURNITURE budgeted 8000000c; spec 40 x 15000c cube 10 awarded and ordered; PO ACKNOWLEDGED then READY_TO_SHIP"
            - "Shipment S1 CONSOLIDATING with the PO attached (PO CONSOLIDATED); shipment S2 still PLANNED"
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "P-S9", hotel_name: "H", brand_program: "MARQUEE_SELECT", total_budget_cents: 10000000 }, as: PurchasingAgent, captures: { p_id: $.data.id } }
