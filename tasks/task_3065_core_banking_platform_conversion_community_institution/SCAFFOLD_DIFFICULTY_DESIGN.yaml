  - rule_id: transitive_cascade
    instances:

      - name: product_deactivate_cascades_account_then_gl_variance
        grounds:
          - state_machines.ProductType.ACTIVE_to_DRAFT
          - state_machines.Account.MAPPED_to_EXCEPTION
          - calculations.gl_variance
        distinguishing_aspect: |
          Depth-3 transitive chain: deactivate ProductType (link 1) flips its
          MAPPED Account to EXCEPTION (link 2, caused by the account's own
          product-deactivation rule, not by the deactivate call directly
          touching the GL), and that account transition itself re-triggers
          gl_variance recomputation on the GLAccount (link 3).
        test_recipe:
          setup:
            - "Clock 2026-09-01; project DISCOVERY; product DDA-STD ACTIVE; GL-1000; account L-6001 DEPOSIT principal 1000000 MAPPED; project advanced to MOCK_CONVERSION."
            - "Before deactivate: GL expected 1000000, converted 0 (no mock yet), variance -1000000."
            - "Deactivate is allowed in project status MOCK_CONVERSION? NO — precondition is {DISCOVERY, CONFIGURATION}; so this test deactivates while project is still DISCOVERY... but map requires DISCOVERY allowed (yes). Keep project in DISCOVERY: create product, activate, GL, account, map (project version -> 2), then deactivate."
          setup_api_calls:
            - call: "POST /api/v1/conversions"
              payload: { institution_name: "First Community Bank", incumbent_core_name: "LegacyCore", target_core_name: "Fiserv DNA" }
