          assert:
            - "Cycle.${c1}.points_earned == 500"
            - "${cash_back} == 49400"
            - "Refund.${refund_id}.restock_fee_cents == 600"
            - "${clawed} == 500"
            - "LoyaltyAccount.${loy_id}.points_balance == -500"
            - "exactly 3 PointsLedgerEntry rows exist with loyalty_account_id == ${loy_id}, with delta_points 500, -500 and -500"
            - "Cycle.${c1}.retained_cash_cents == 600"

      - name: registry_gift_units_conserved_across_pay_and_refund
        grounds:
          - conservation_invariants.registry_units_conserved
          - state_machines.RegistryItem.FULFILLED_to_PARTIALLY_FULFILLED
          - state_machines.GiftOrder.PAID_to_REFUNDED
          - entities.RegistryItem.fields.fulfilled_quantity
        distinguishing_aspect: |
          CONSERVED QUANTITY 3 — gifted UNITS on a registry item, neither money nor points. After
          two paid gifts of 2 and 1 packs bring fulfilled_quantity to 3 and the 2-pack gift is
          refunded, fulfilled_quantity is exactly 1 and still equals the summed quantity of every
          non-REFUNDED gift, while requested_quantity is untouched at 3.
        test_recipe:
          setup:
            - "Registry owner O with an OPEN registry carrying one item requesting 3 packs of a 1200-cent S2 SKU."
            - "Purchaser P buys and pays a 2-pack gift, moving the item to PARTIALLY_FULFILLED, then buys and pays a 1-pack gift, moving it to FULFILLED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /skus"
              payload: { code: "S2-STD-60", name: "Stage 2 Standard 60", stage: "S2", line: "STANDARD", pack_price_cents: 1200, pack_size_units: 60, allergen_tags: [], stock_packs: 50 }
              as: OpsAdmin
