              payload: { needs_assessment_id: "${na}", pricing_model: "FLAT_COHORT", delivery_mode: "ON_SITE", est_participant_count: 2, est_delivery_hours: 2, target_start_date: "2026-06-15T00:00:00Z", max_cohorts: 2 }
