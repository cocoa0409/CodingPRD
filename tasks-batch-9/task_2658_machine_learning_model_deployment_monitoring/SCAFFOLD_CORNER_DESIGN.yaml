  - section: endpoints
    instances:

      - name: revalidation_sweep_reports_created_skipped_and_staled_counts
        claim_type: Bulk action
        grounds:
          - endpoints.POST_ops_revalidation_sweep
          - calculations.revalidation_schedule
          - state_machines.RetrainingTrigger.ACKNOWLEDGED_to_STALE
          - entities.RevalidationTask.fields.swept_at
        distinguishing_aspect: |
          The sweep is the only bulk endpoint and it reports FOUR counters over TWO independent
          populations in one call. It is skip-not-fail: a version that already has a DUE task is counted
          under skipped_existing_count instead of erroring, so the same call is idempotent at a fixed
          clock (created_count 0 on the second run) and becomes productive again only when the clock
          advances past the next due date.
        setup_note: "clock walked 2026-08-01 -> 2026-08-02 -> 2026-10-30 -> 2026-10-31 so the two versions come due on different days and the trigger's stale_after (raise instant + 90 days) lands on the last step"
        test_recipe:
          setup:
            - "one Model with revalidation_interval_days 90 and one APPROVED snapshot"
            - "version 1.0.0 approved at 2026-08-01 -> revalidation_due_at 2026-10-30"
            - "version 1.0.1 approved at 2026-08-02 -> revalidation_due_at 2026-10-31"
            - "one ACKNOWLEDGED RetrainingTrigger raised by a FAIL_SKEW check at 2026-08-02, so stale_after == 2026-10-31"
