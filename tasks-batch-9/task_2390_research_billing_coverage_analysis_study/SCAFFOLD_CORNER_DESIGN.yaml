# ===========================================================================
# 1.9 Scaffold Corner Design - breadth walk of references/claim-extraction-guide.md
# against SCAFFOLD.yaml §1.1-§1.7. Depth lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml;
# every corner already asserted there is emitted here as an `excluded_because:` stub.
# ===========================================================================
scaffold_corner_design:

  # =========================================================================
  # SECTION 1 - entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_study_returns_201_with_every_declared_default
        claim_type: creation
        grounds:
          - endpoints[POST /research-billing/studies]
          - entities.Study.fields.lifecycle_status.default
          - entities.Study.fields.budget_status.default
          - entities.Study.fields.qct_determination.default
          - entities.Study.fields.billing_hold_posture.default
        distinguishing_aspect: "A protocol registered with only the six required inputs comes back with all 34 fields populated: five enum defaults (DRAFT, NOT_BUILT, UNDETERMINED, PAYER_BLOCKED, null qct_basis), every ledger rollup at 0, version 1 and created_at equal to the logical clock rather than wall-clock time."
        test_recipe:
          setup:
            - "Empty database with the logical clock pinned at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /research-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ResearchBillingManager
          trigger:
            - call: "POST /research-billing/studies"
              payload: { protocol_number: "AMC-2390-C01", title: "Corner creation probe", sponsor_name: "Northgate Therapeutics", funding_source: "INDUSTRY_SPONSORED", ind_ide_status: "IND_HELD", therapeutic_intent: true }
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { study_id: "$.data.id" }
          assert:
            - "trigger response 201"
            - "response lifecycle_status == \"DRAFT\", budget_status == \"NOT_BUILT\", qct_determination == \"UNDETERMINED\", qct_basis == null, billing_hold_posture == \"PAYER_BLOCKED\""
            - "response registry_number == null (omitted optional input takes its declared default)"
            - "response effective_indirect_rate_pct == null, indirect_rate_pct == null, budget_basis == null, budget_source_analysis_id == null"
            - "response per_patient_subtotal_cents == 0, per_patient_budget_cents == 0, invoiceable_subtotal_cents == 0, invoiceable_budget_cents == 0"
            - "response payer_billed_cents == 0, payer_refunded_cents == 0, sponsor_unbilled_cents == 0, sponsor_receivable_cents == 0, sponsor_collected_cents == 0, sponsor_written_off_cents == 0, improper_payer_exposure_cents == 0, delinquent_sponsor_cents == 0"
            - "response open_finding_count == 0, rebuild_required_calendar_count == 0"
            - "response version == 1 and created_at == \"2026-08-01T00:00:00.000Z\" (logical clock, never wall-clock)"
            - "response meta carries api_request_id and api_request_timestamp; response_type == \"object\""

      - name: get_study_returns_the_stored_record
        claim_type: retrieval
        grounds:
          - endpoints[GET /research-billing/studies/{id}]
          - entities.Study
        distinguishing_aspect: "A read-only GET returns the identical field values the create response reported and does NOT bump version - the study is still at version 1 after two reads."
        test_recipe:
          setup:
            - "One study registered at clock 2026-08-01T00:00:00Z with registry_number NCT10000101."
          setup_api_calls:
            - call: "POST /research-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ResearchBillingManager
            - call: "POST /research-billing/studies"
              payload: { protocol_number: "AMC-2390-C02", title: "Corner retrieval probe", sponsor_name: "Northgate Therapeutics", funding_source: "FEDERALLY_FUNDED", ind_ide_status: "NONE", therapeutic_intent: false, registry_number: "NCT10000101" }
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { study_id: "$.data.id" }
          trigger:
            - call: "GET /research-billing/studies/${study_id}"
              as: AuditLiaison
              as_user_id: "auditor_1"
          assert:
            - "trigger response 200 with id == ${study_id}"
            - "response protocol_number == \"AMC-2390-C02\", funding_source == \"FEDERALLY_FUNDED\", ind_ide_status == \"NONE\", therapeutic_intent == false, registry_number == \"NCT10000101\""
            - "response version == 1 - a GET is not a mutation"
            - "a second identical GET returns version == 1 again and the same updated_at"

      - name: list_coverage_analyses_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /research-billing/coverage-analyses]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "Two analyses exist across two studies; limit=1 returns exactly one element with total_count 2 and has_more true, and offset=1 returns the second element with has_more false. total_count reports the unpaginated match count, not the page size."
        test_recipe:
          setup:
            - "Two studies, each carrying exactly one DRAFT coverage analysis (one open analysis per study is the maximum allowed by priority 30)."
          setup_api_calls:
            - call: "POST /research-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ResearchBillingManager
            - call: "POST /research-billing/studies"
              payload: { protocol_number: "AMC-2390-C03A", title: "Corner listing probe A", sponsor_name: "Northgate Therapeutics", funding_source: "INDUSTRY_SPONSORED", ind_ide_status: "IND_HELD", therapeutic_intent: true }
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { study_a_id: "$.data.id", study_a_v1: "$.data.version" }
            - call: "POST /research-billing/studies"
              payload: { protocol_number: "AMC-2390-C03B", title: "Corner listing probe B", sponsor_name: "Northgate Therapeutics", funding_source: "INDUSTRY_SPONSORED", ind_ide_status: "IND_HELD", therapeutic_intent: true }
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { study_b_id: "$.data.id", study_b_v1: "$.data.version" }
            - call: "POST /research-billing/coverage-analyses"
              payload: { study_id: "${study_a_id}", expected_study_version: "${study_a_v1}" }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { analysis_a_id: "$.data.id" }
            - call: "POST /research-billing/coverage-analyses"
              payload: { study_id: "${study_b_id}", expected_study_version: "${study_b_v1}" }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { analysis_b_id: "$.data.id" }
          trigger:
            - call: "GET /research-billing/coverage-analyses?status=DRAFT&limit=1&offset=0"
              as: ComplianceReviewer
              as_user_id: "reviewer_1"
          assert:
            - "trigger response 200 with response_type == \"array\" and exactly 1 element"
            - "trigger response total_count == 2, has_more == true, limit == 1, offset == 0"
            - "GET /research-billing/coverage-analyses?status=DRAFT&limit=1&offset=1 returns the other analysis, total_count == 2, has_more == false"
            - "GET /research-billing/coverage-analyses?study_id=${study_a_id} returns total_count == 1 with the single element id == ${analysis_a_id}"
            - "GET /research-billing/coverage-analyses with no query params applies the declared defaults limit 10 / offset 0 and returns total_count == 2 with has_more == false"

      - name: get_charge_with_unknown_id_returns_charge_not_found
        claim_type: not_found
        grounds:
          - endpoints[GET /research-billing/charges/{id}]
          - errors[ERR_CHARGE_NOT_FOUND]
          - validations[priority 6]
        distinguishing_aspect: "A well-formed UUID that names no Charge row returns the charge-specific 404 code ERR_CHARGE_NOT_FOUND, not the generic ERR_STUDY_NOT_FOUND and not an empty 200 body."
        test_recipe:
          setup:
            - "Empty database apart from the logical clock; no Charge row has ever been created."
          setup_api_calls:
            - call: "POST /research-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ResearchBillingManager
          trigger:
            - call: "GET /research-billing/charges/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: ComplianceReviewer
              as_user_id: "reviewer_1"
              captures: { observed_error: "$.data.error_id" }
          assert:
            - "trigger response 404 with error_id == \"ERR_CHARGE_NOT_FOUND\""
            - "trigger response response_type == \"error\" and data.message is a non-empty string"
            - "GET /research-billing/charges (the list form) with the same empty database returns 200 with total_count == 0, so the 404 is specific to the by-id read"

      - name: create_study_missing_funding_source_returns_invalid_request
        claim_type: required_fields
        grounds:
          - endpoints[POST /research-billing/studies].input
          - validations[priority 3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "funding_source has source: input with no declared default, so omitting it is a 400 ERR_INVALID_REQUEST at priority 3 - ahead of every existence, state and business rule - and no Study row is created."
        test_recipe:
          setup:
            - "Empty database with the logical clock pinned at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /research-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ResearchBillingManager
          trigger:
            - call: "POST /research-billing/studies"
              payload: { protocol_number: "AMC-2390-C05", title: "Corner required-field probe", sponsor_name: "Northgate Therapeutics", ind_ide_status: "IND_HELD", therapeutic_intent: true }
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { observed_error: "$.data.error_id" }
          assert:
            - "trigger response 400 with error_id == \"ERR_INVALID_REQUEST\""
            - "GET /research-billing/studies returns total_count == 0 - the partial row was not persisted"
            - "the same call with funding_source \"INVESTIGATOR_INITIATED\" added returns 201"
            - "the same call with funding_source \"CHARITY_FUNDED\" (not a declared enum member) also returns 400 ERR_INVALID_REQUEST"

      - name: omitting_units_per_occurrence_defaults_to_one
        claim_type: defaults
        grounds:
          - entities.CoverageItem.fields.units_per_occurrence.default
          - entities.VisitChargeRoute.fields.occurrences.default
          - calculations.visit_route_expected_amount
        distinguishing_aspect: "Two independent declared defaults compose: an item created without units_per_occurrence stores 1, a route created without occurrences stores 1, and the route's expected_amount_cents is therefore exactly the item's negotiated_unit_cents (40000), not 0 and not null."
        test_recipe:
          setup:
            - "One study with an APPROVED analysis carrying one RESEARCH_PAID PER_PATIENT item at negotiated_unit_cents 40000, created WITHOUT units_per_occurrence, and a DRAFT calendar with one visit."
          setup_api_calls:
            - call: "POST /research-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ResearchBillingManager
            - call: "POST /research-billing/studies"
              payload: { protocol_number: "AMC-2390-C06", title: "Corner defaults probe", sponsor_name: "Northgate Therapeutics", funding_source: "INDUSTRY_SPONSORED", ind_ide_status: "IND_HELD", therapeutic_intent: true }
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { study_id: "$.data.id", study_v1: "$.data.version" }
            - call: "POST /research-billing/coverage-analyses"
              payload: { study_id: "${study_id}", expected_study_version: "${study_v1}" }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { analysis_id: "$.data.id", analysis_v1: "$.data.version" }
            - call: "POST /research-billing/coverage-items"
              payload: { coverage_analysis_id: "${analysis_id}", expected_coverage_analysis_version: "${analysis_v1}", item_code: "J9999", description: "Investigational infusion", classification: "RESEARCH_PAID", medicare_coverage_basis: "NOT_COVERED", budget_category: "PER_PATIENT", charge_master_unit_cents: 55000, negotiated_unit_cents: 40000, expected_occurrences: 1 }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { item_id: "$.data.id", stored_units: "$.data.units_per_occurrence" }
            - call: "POST /research-billing/coverage-analyses/${analysis_id}/submit"
              as: CoverageAnalyst
              as_user_id: "analyst_1"
            - call: "POST /research-billing/coverage-analyses/${analysis_id}/approve"
              as: ComplianceReviewer
              as_user_id: "reviewer_1"
            - call: "POST /research-billing/study-calendars"
              payload: { study_id: "${study_id}", source_analysis_id: "${analysis_id}" }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { calendar_id: "$.data.id" }
            - call: "POST /research-billing/calendar-visits"
              payload: { study_calendar_id: "${calendar_id}", visit_name: "Cycle 1 Day 1", sequence_index: 1, target_day_offset: 0, window_before_days: 0, window_after_days: 3 }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { visit_id: "$.data.id" }
          trigger:
            - call: "POST /research-billing/visit-charge-routes"
              payload: { calendar_visit_id: "${visit_id}", coverage_item_id: "${item_id}" }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
          assert:
            - "setup: stored_units == 1 - the item stored the declared default for the omitted units_per_occurrence"
            - "trigger response 201 with occurrences == 1 (declared default applied)"
            - "trigger response routing_target == \"SPONSOR\" and expected_amount_cents == 40000 (1 * 1 * 40000)"
            - "GET /research-billing/calendar-visits is not declared; GET /research-billing/study-calendars/${calendar_id}/visits shows the visit with expected_charge_total_cents == 40000"

      - name: coverage_item_billable_to_is_derived_from_classification
        claim_type: computed_fields
        grounds:
          - entities.CoverageItem.fields.billable_to
          - endpoints[POST /research-billing/coverage-items].side_effects
          - entities.CoverageAnalysis.fields.routine_care_item_count
        distinguishing_aspect: "billable_to is source: computed and never appears in the endpoint's input: ROUTINE_CARE yields PAYER, RESEARCH_PAID yields SPONSOR and PROMOTIONAL yields NONE on three items of one analysis, while the analysis' three classification counters land at 1/1/1."
        test_recipe:
          setup:
            - "One study with a DRAFT analysis; items are added one at a time because each add bumps the analysis version that the next add must present."
          setup_api_calls:
            - call: "POST /research-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ResearchBillingManager
            - call: "POST /research-billing/studies"
              payload: { protocol_number: "AMC-2390-C07", title: "Corner computed-field probe", sponsor_name: "Northgate Therapeutics", funding_source: "INDUSTRY_SPONSORED", ind_ide_status: "IND_HELD", therapeutic_intent: true }
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { study_id: "$.data.id", study_v1: "$.data.version" }
            - call: "POST /research-billing/coverage-analyses"
              payload: { study_id: "${study_id}", expected_study_version: "${study_v1}" }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { analysis_id: "$.data.id", analysis_v1: "$.data.version" }
            - call: "POST /research-billing/coverage-items"
              payload: { coverage_analysis_id: "${analysis_id}", expected_coverage_analysis_version: "${analysis_v1}", item_code: "80053", description: "Comprehensive metabolic panel", classification: "ROUTINE_CARE", medicare_coverage_basis: "STANDARD_OF_CARE", budget_category: "PER_PATIENT", charge_master_unit_cents: 9000, negotiated_unit_cents: 9000, units_per_occurrence: 1, expected_occurrences: 3 }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { routine_billable_to: "$.data.billable_to" }
            - call: "GET /research-billing/coverage-analyses/${analysis_id}"
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { analysis_v2: "$.data.version" }
            - call: "POST /research-billing/coverage-items"
              payload: { coverage_analysis_id: "${analysis_id}", expected_coverage_analysis_version: "${analysis_v2}", item_code: "J9999", description: "Investigational infusion", classification: "RESEARCH_PAID", medicare_coverage_basis: "NOT_COVERED", budget_category: "PER_PATIENT", charge_master_unit_cents: 55000, negotiated_unit_cents: 40000, units_per_occurrence: 1, expected_occurrences: 1 }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { research_billable_to: "$.data.billable_to" }
            - call: "GET /research-billing/coverage-analyses/${analysis_id}"
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { analysis_v3: "$.data.version" }
          trigger:
            - call: "POST /research-billing/coverage-items"
              payload: { coverage_analysis_id: "${analysis_id}", expected_coverage_analysis_version: "${analysis_v3}", item_code: "A0001", description: "Sponsor-supplied dosing diary", classification: "PROMOTIONAL", medicare_coverage_basis: "NOT_COVERED", budget_category: "NOT_BUDGETED", charge_master_unit_cents: 1500, negotiated_unit_cents: 0, units_per_occurrence: 1, expected_occurrences: 5 }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
          assert:
            - "setup: routine_billable_to == \"PAYER\" and research_billable_to == \"SPONSOR\""
            - "trigger response 201 with billable_to == \"NONE\" - PROMOTIONAL is billable to nobody"
            - "GET /research-billing/coverage-analyses/${analysis_id} shows item_count == 3, routine_care_item_count == 1, research_paid_item_count == 1, promotional_item_count == 1, qct_conditional_item_count == 0"
            - "the same GET shows version == 4 (one bump per item add) and status == \"DRAFT\""

      - name: charge_system_fields_are_server_stamped_from_the_logical_clock
        claim_type: system_fields
        grounds:
          - entities.Charge.fields.posted_by_user_id
          - entities.Charge.fields.unbilled_since
          - entities.Charge.fields.source
          - endpoints[POST /research-billing/charges].side_effects
        distinguishing_aspect: "An interface-posted charge has source INTERFACE_POSTED, posted_by_user_id equal to the caller's X-User-ID, unbilled_since equal to the logical clock instant (2026-08-07T11:00:00Z) and reviewed_by_user_id null - none of which the client can supply, because none appears in the endpoint's input list."
        test_recipe:
          setup:
            - "One study with an APPROVED analysis carrying item_code 80053; the logical clock is advanced to 2026-08-07T11:00:00Z immediately before the charge is posted."
          setup_api_calls:
            - call: "POST /research-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ResearchBillingManager
            - call: "POST /research-billing/studies"
              payload: { protocol_number: "AMC-2390-C08", title: "Corner system-field probe", sponsor_name: "Northgate Therapeutics", funding_source: "INDUSTRY_SPONSORED", ind_ide_status: "IND_HELD", therapeutic_intent: true }
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { study_id: "$.data.id", study_v1: "$.data.version" }
            - call: "POST /research-billing/coverage-analyses"
              payload: { study_id: "${study_id}", expected_study_version: "${study_v1}" }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { analysis_id: "$.data.id", analysis_v1: "$.data.version" }
            - call: "POST /research-billing/coverage-items"
              payload: { coverage_analysis_id: "${analysis_id}", expected_coverage_analysis_version: "${analysis_v1}", item_code: "80053", description: "Comprehensive metabolic panel", classification: "ROUTINE_CARE", medicare_coverage_basis: "STANDARD_OF_CARE", budget_category: "PER_PATIENT", charge_master_unit_cents: 9000, negotiated_unit_cents: 9000, units_per_occurrence: 1, expected_occurrences: 3 }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
            - call: "POST /research-billing/coverage-analyses/${analysis_id}/submit"
              as: CoverageAnalyst
              as_user_id: "analyst_1"
            - call: "POST /research-billing/coverage-analyses/${analysis_id}/approve"
              as: ComplianceReviewer
              as_user_id: "reviewer_1"
            - call: "POST /research-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-07T11:00:00Z" }
              as: ResearchBillingManager
          trigger:
            - call: "POST /research-billing/charges"
              payload: { study_id: "${study_id}", charge_code: "80053", service_date: "2026-08-07", amount_cents: 9000 }
              as: StudyCoordinator
              as_user_id: "coord_7"
              captures: { charge_id: "$.data.id" }
          assert:
            - "trigger response 201 with source == \"INTERFACE_POSTED\", routing_state == \"UNROUTED\", billing_state == \"UNBILLED\""
            - "response posted_by_user_id == \"coord_7\" and reviewed_by_user_id == null and reviewed_at == null"
            - "response unbilled_since == \"2026-08-07T11:00:00.000Z\" and created_at == \"2026-08-07T11:00:00.000Z\""
            - "response expected_routing_target == \"PAYER\" (computed from the current_effective analysis), improper_flag == false, hold_reason == \"NONE\", hold_applied_at == null"
            - "response aging_days == 0 and aging_bucket == \"CURRENT\" - the declared defaults, because no aging run has executed yet"
            - "response subject_visit_id == null, sponsor_invoice_id == null, replaces_charge_id == null, refunded_amount_cents == 0"

      - name: create_study_with_malformed_registry_number_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.Study.fields.registry_number.constraints
          - validations[priority 3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "registry_number is optional but format-constrained: NCT123 (three digits) fails the ^NCT[0-9]{8}$ pattern with a 400, while omitting the field entirely succeeds - so the constraint is on the value, not on presence."
        test_recipe:
          setup:
            - "Empty database with the logical clock pinned at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /research-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ResearchBillingManager
          trigger:
            - call: "POST /research-billing/studies"
              payload: { protocol_number: "AMC-2390-C09", title: "Corner type-constraint probe", sponsor_name: "Northgate Therapeutics", funding_source: "INDUSTRY_SPONSORED", ind_ide_status: "IND_HELD", therapeutic_intent: true, registry_number: "NCT123" }
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { observed_error: "$.data.error_id" }
          assert:
            - "trigger response 400 with error_id == \"ERR_INVALID_REQUEST\""
            - "GET /research-billing/studies returns total_count == 0"
            - "the identical call with registry_number \"NCT10000109\" returns 201 with registry_number == \"NCT10000109\""
            - "the identical call with registry_number omitted returns 201 with registry_number == null"

      - name: coverage_item_is_immutable_and_carries_no_version_field
        claim_type: immutability
        grounds:
          - entities.CoverageItem.common_fields
          - endpoints[GET /research-billing/coverage-analyses/{id}/items]
        distinguishing_aspect: "CoverageItem is declared common_fields: false, so §1.5 exposes no PUT/PATCH/DELETE for it and its rows carry only id and created_at - no version and no updated_at. A correction is expressed as a new analysis revision, never as an edit."
        test_recipe:
          setup:
            - "One study with a DRAFT analysis carrying a single item."
          setup_api_calls:
            - call: "POST /research-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ResearchBillingManager
            - call: "POST /research-billing/studies"
              payload: { protocol_number: "AMC-2390-C10", title: "Corner immutability probe", sponsor_name: "Northgate Therapeutics", funding_source: "INDUSTRY_SPONSORED", ind_ide_status: "IND_HELD", therapeutic_intent: true }
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { study_id: "$.data.id", study_v1: "$.data.version" }
            - call: "POST /research-billing/coverage-analyses"
              payload: { study_id: "${study_id}", expected_study_version: "${study_v1}" }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { analysis_id: "$.data.id", analysis_v1: "$.data.version" }
            - call: "POST /research-billing/coverage-items"
              payload: { coverage_analysis_id: "${analysis_id}", expected_coverage_analysis_version: "${analysis_v1}", item_code: "80053", description: "Comprehensive metabolic panel", classification: "ROUTINE_CARE", medicare_coverage_basis: "STANDARD_OF_CARE", budget_category: "PER_PATIENT", charge_master_unit_cents: 9000, negotiated_unit_cents: 9000, units_per_occurrence: 1, expected_occurrences: 3 }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { item_id: "$.data.id" }
          trigger:
            - call: "GET /research-billing/coverage-analyses/${analysis_id}/items"
              as: CoverageAnalyst
              as_user_id: "analyst_1"
          assert:
            - "trigger response 200 with total_count == 1 and the single element id == ${item_id}"
            - "the element carries id and created_at but NO version field and NO updated_at field"
            - "§1.5 declares no PUT, PATCH or DELETE on any /coverage-items path - the only mutation is creation"
            - "GET /research-billing/coverage-analyses/${analysis_id}/items?classification=RESEARCH_PAID returns total_count == 0, confirming the list filter without exposing an edit path"

      - name: coverage_item_with_unknown_analysis_returns_analysis_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority 7]
          - errors[ERR_ANALYSIS_NOT_FOUND]
          - entities.CoverageItem.fields.coverage_analysis_id
        distinguishing_aspect: "The body-carried FK is validated at priority 7 (404 ERR_ANALYSIS_NOT_FOUND) BEFORE the priority-8 optimistic-concurrency check, so a request naming a non-existent analysis returns 404 even though the expected_coverage_analysis_version it presents belongs to a real, current analysis."
        test_recipe:
          setup:
            - "One study with a real DRAFT analysis at version 1, whose version is captured and then presented alongside a UUID that names no analysis."
          setup_api_calls:
            - call: "POST /research-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ResearchBillingManager
            - call: "POST /research-billing/studies"
              payload: { protocol_number: "AMC-2390-C11", title: "Corner FK probe", sponsor_name: "Northgate Therapeutics", funding_source: "INDUSTRY_SPONSORED", ind_ide_status: "IND_HELD", therapeutic_intent: true }
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { study_id: "$.data.id", study_v1: "$.data.version" }
            - call: "POST /research-billing/coverage-analyses"
              payload: { study_id: "${study_id}", expected_study_version: "${study_v1}" }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { analysis_id: "$.data.id", analysis_v1: "$.data.version" }
          trigger:
            - call: "POST /research-billing/coverage-items"
              payload: { coverage_analysis_id: "11111111-2222-4333-8444-555555555555", expected_coverage_analysis_version: "${analysis_v1}", item_code: "80053", description: "Comprehensive metabolic panel", classification: "ROUTINE_CARE", medicare_coverage_basis: "STANDARD_OF_CARE", budget_category: "PER_PATIENT", charge_master_unit_cents: 9000, negotiated_unit_cents: 9000, units_per_occurrence: 1, expected_occurrences: 3 }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { observed_error: "$.data.error_id" }
          assert:
            - "trigger response 404 with error_id == \"ERR_ANALYSIS_NOT_FOUND\""
            - "trigger response error_id is NOT \"ERR_STALE_COVERAGE_ANALYSIS_VERSION\" - priority 7 runs before priority 8"
            - "GET /research-billing/coverage-analyses/${analysis_id} still shows item_count == 0 and version == 1 - the real analysis was untouched"
            - "the same call with coverage_analysis_id ${analysis_id} returns 201"

      - name: flat_topology_fk_integrity_on_visit_charge_routes
        claim_type: flat
        grounds:
          - complexity_profile.entity_topology
          - validations[priority 26]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / item_analysis_mismatch_beats_invoiceable_not_routable"
          rationale: "That instance already asserts ERR_ITEM_ANALYSIS_MISMATCH for a coverage_item_id belonging to a different analysis than the calendar's source_analysis_id, which is exactly the flat-topology cross-reference integrity claim."

  # =========================================================================
  # SECTION 2 - state_machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: new_coverage_analysis_starts_in_draft_revision_one
        claim_type: initial_state
        grounds:
          - state_machines.CoverageAnalysis.initial_state
          - state_machines.Study.transitions[LC-1]
          - entities.CoverageAnalysis.fields.revision_number
        distinguishing_aspect: "A first analysis lands in DRAFT with revision_number 1 (supersedes_analysis_id null), all five counters at 0 and prepared_by_user_id stamped from the header, while the SAME request drags the study from DRAFT to COVERAGE_PENDING and bumps Study.version to 2."
        test_recipe:
          setup:
            - "One freshly registered study at lifecycle_status DRAFT and version 1."
          setup_api_calls:
            - call: "POST /research-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ResearchBillingManager
            - call: "POST /research-billing/studies"
              payload: { protocol_number: "AMC-2390-C13", title: "Corner initial-state probe", sponsor_name: "Northgate Therapeutics", funding_source: "INDUSTRY_SPONSORED", ind_ide_status: "IND_HELD", therapeutic_intent: true }
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { study_id: "$.data.id", study_v1: "$.data.version", lifecycle_before: "$.data.lifecycle_status" }
          trigger:
            - call: "POST /research-billing/coverage-analyses"
              payload: { study_id: "${study_id}", expected_study_version: "${study_v1}" }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { analysis_id: "$.data.id" }
          assert:
            - "setup: lifecycle_before == \"DRAFT\" and study_v1 == 1"
            - "trigger response 201 with status == \"DRAFT\", revision_number == 1, supersedes_analysis_id == null, return_count == 0, version == 1"
            - "response item_count == 0, routine_care_item_count == 0, research_paid_item_count == 0, promotional_item_count == 0, qct_conditional_item_count == 0"
            - "response prepared_by_user_id == \"analyst_1\", approved_by_user_id == null, returned_by_user_id == null, approved_at == null, return_reason == null"
            - "GET /research-billing/studies/${study_id} now shows lifecycle_status == \"COVERAGE_PENDING\" and version == 2 (LC-1 fired inside the same request)"
            - "the same GET shows budget_status still \"NOT_BUILT\" - the second dimension did not move"

      - name: submit_moves_analysis_from_draft_to_under_review
        claim_type: valid_transition
        grounds:
          - state_machines.CoverageAnalysis.transitions[DRAFT -> UNDER_REVIEW]
          - endpoints[POST /research-billing/coverage-analyses/{id}/submit]
        distinguishing_aspect: "With item_count 1 the submit action returns 200 and status UNDER_REVIEW at version 3 - version 1 at creation, 2 after the item add, 3 after the transition - and the study's lifecycle_status stays COVERAGE_PENDING because approval, not submission, is what advances it."
        test_recipe:
          setup:
            - "One study whose DRAFT analysis carries exactly one item."
          setup_api_calls:
            - call: "POST /research-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ResearchBillingManager
            - call: "POST /research-billing/studies"
              payload: { protocol_number: "AMC-2390-C14", title: "Corner valid-transition probe", sponsor_name: "Northgate Therapeutics", funding_source: "INDUSTRY_SPONSORED", ind_ide_status: "IND_HELD", therapeutic_intent: true }
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { study_id: "$.data.id", study_v1: "$.data.version" }
            - call: "POST /research-billing/coverage-analyses"
              payload: { study_id: "${study_id}", expected_study_version: "${study_v1}" }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { analysis_id: "$.data.id", analysis_v1: "$.data.version" }
            - call: "POST /research-billing/coverage-items"
              payload: { coverage_analysis_id: "${analysis_id}", expected_coverage_analysis_version: "${analysis_v1}", item_code: "80053", description: "Comprehensive metabolic panel", classification: "ROUTINE_CARE", medicare_coverage_basis: "STANDARD_OF_CARE", budget_category: "PER_PATIENT", charge_master_unit_cents: 9000, negotiated_unit_cents: 9000, units_per_occurrence: 1, expected_occurrences: 3 }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
          trigger:
            - call: "POST /research-billing/coverage-analyses/${analysis_id}/submit"
              as: CoverageAnalyst
              as_user_id: "analyst_1"
          assert:
            - "trigger response 200 with status == \"UNDER_REVIEW\" and version == 3"
            - "response item_count == 1 and routine_care_item_count == 1"
            - "response approved_at == null and approved_by_user_id == null"
            - "GET /research-billing/studies/${study_id} still shows lifecycle_status == \"COVERAGE_PENDING\" and version == 2"

      - name: submitting_an_analysis_with_zero_items_is_refused
        claim_type: precondition_enforcement
        grounds:
          - state_machines.CoverageAnalysis.transitions[DRAFT -> UNDER_REVIEW].preconditions
          - validations[priority 10]
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "The status precondition holds (DRAFT) but the item_count >= 1 precondition does not, so the refusal is the generic 409 ERR_INVALID_STATE_TRANSITION rather than a not-editable code, and the analysis remains DRAFT at version 1."
        test_recipe:
          setup:
            - "One study whose DRAFT analysis has no items at all."
          setup_api_calls:
            - call: "POST /research-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ResearchBillingManager
            - call: "POST /research-billing/studies"
              payload: { protocol_number: "AMC-2390-C15", title: "Corner precondition probe", sponsor_name: "Northgate Therapeutics", funding_source: "INDUSTRY_SPONSORED", ind_ide_status: "IND_HELD", therapeutic_intent: true }
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { study_id: "$.data.id", study_v1: "$.data.version" }
            - call: "POST /research-billing/coverage-analyses"
              payload: { study_id: "${study_id}", expected_study_version: "${study_v1}" }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { analysis_id: "$.data.id", item_count_before: "$.data.item_count" }
          trigger:
            - call: "POST /research-billing/coverage-analyses/${analysis_id}/submit"
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { observed_error: "$.data.error_id" }
          assert:
            - "setup: item_count_before == 0"
            - "trigger response 409 with error_id == \"ERR_INVALID_STATE_TRANSITION\""
            - "GET /research-billing/coverage-analyses/${analysis_id} still shows status == \"DRAFT\" and version == 1"
            - "after adding one item the identical submit call returns 200 with status \"UNDER_REVIEW\""

      - name: visit_completion_drops_one_charge_per_visit_charge_route
        claim_type: side_effect_execution
        grounds:
          - state_machines.SubjectVisit.transitions[SCHEDULED -> OCCURRED].side_effects
          - calculations.visit_route_expected_amount
          - entities.SubjectVisit.fields.generated_charge_count
        distinguishing_aspect: "Completing one visit that carries two routes creates exactly two charges, in route created_at ASC order, at 27000 and 80000 cents - each priced from the route's own snapshot (charge master for the payer route, negotiated for the sponsor route), each UNROUTED / UNBILLED with source VISIT_CASCADE and no posted_by_user_id."
        test_recipe:
          setup:
            - "One INDUSTRY_SPONSORED study open to accrual with a PUBLISHED calendar whose single visit carries two routes: the ROUTINE_CARE 80053 item at 3 occurrences (charge master 9000) and the RESEARCH_PAID J9999 item at 1 occurrence (negotiated 40000, units_per_occurrence 2); one subject consented on 2026-09-01 with a visit scheduled for 2026-09-02."
          setup_api_calls:
            - call: "POST /research-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
