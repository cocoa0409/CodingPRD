            - "after revoke: certificate REVOKED; protection_status == UNPROTECTED; order SCHEDULED with blocked_reason == null"

      - name: allocation_release_success_path_covered
        claim_type: valid_transition
        grounds: [state_machines.FundAllocation.PLEDGED_to_RELEASED]
