            - call: "POST /accounts/${acct}/rfps/${rfp}/proposals/${prop}/accept"
              payload: {}
              as: SalesRep
            - call: "POST /accounts/${acct}/contracts"
              payload: { proposal_id: "${prop}", term_months: 12 }
              as: SalesRep
              captures: { ctr: "$.data.id" }
            - call: "POST /accounts/${acct}/contracts/${ctr}/sign"
