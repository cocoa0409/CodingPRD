# =============================================================================
# SCAFFOLD — task_0694_watersports_school
# Surf / Sailing / Watersports School
# Difficulty band: Expert (§0.4)
# Topology: FLAT (all entities are top-level collections; parent scope carried as
#           body field / query filter, never nested in the URL path).
# =============================================================================

scenario: |
  Surf / Sailing / Watersports School: course & level (lesson/certification),
  instructor-to-student ratio & equipment, session scheduling & tide/weather,
  waiver & swim/age requirement, rental & gear, package/membership & makeup,
  group/camp, certification card

domain_name: watersports-school
api_prefix: ""

# =============================================================================
# Complexity Profile (§0.3)
# =============================================================================
complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - scheduled_deferred_actions

  entity_topology: flat
  # All entities are peer top-level collections linked by foreign keys (school_id,
  # student_id, course_level_id, ...). No nesting in URL paths; scope is a body
  # field or a query filter on the flat list endpoint.

  state_machine_shape: parallel
  # Enrollment carries two INDEPENDENT dimensions (progress_status x payment_status);
  # Session adds a CYCLIC schedule loop (SCHEDULED<->WEATHER_HOLD); SessionBooking
  # adds a BRANCHING fork (ATTENDED|NO_SHOW) at session completion.

  relationship_patterns:
    - one_to_many       # School->Course, Course->CourseLevel, School->Session
    - many_to_many      # Enrollment (Student x CourseLevel), SessionBooking (Enrollment x Session)
    - cross_aggregate   # RentalAgreement references Student + EquipmentItem

  role_model: peer_roles
  # SchoolAdmin (opaque operator), Instructor (entity_backed), Student (entity_backed)
  # own non-overlapping mutation surfaces; reads are largely shared.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
