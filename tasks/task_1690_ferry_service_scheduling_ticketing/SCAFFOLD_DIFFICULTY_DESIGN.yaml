            - "after second confirm: Booking.status == CONFIRMED and final_fare_cents == 4200"

  # ---------------------------------------------------------------------------
  # Rule 4 — Transitive cascade chains from different triggers
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: sailing_cancel_cascade_depth3
        grounds:
          - state_machines.Sailing.OPEN_FOR_BOOKING_to_CANCELLED
          - state_machines.Booking.CONFIRMED_to_CANCELLED
          - state_machines.StandbyQueueEntry.WAITING_to_EXPIRED
          - state_machines.CrewAssignment.ASSIGNED_to_RELEASED
        distinguishing_aspect: |
          Depth-3 chain originating from POST /sailings/{id}/cancel: (1) Booking
          CONFIRMED -> CANCELLED credits Customer.refund_credit_cents; (2) that
          booking-cancellation sweep releases the sailing's queue -> StandbyQueue
          Entry WAITING -> EXPIRED; (3) the sailing-level release sweep releases
          CrewAssignments -> CrewMember drops back to AVAILABLE.
