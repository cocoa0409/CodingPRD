            - "The excess is 281250.0000 and the receiver mass is 210000, so the raw shares are 133928.5714, 40178.5714 and 107142.8571 for h1, h2 and h3"
            - "Those shares sum the four adjusted weights to 1309999.9999, i.e. 0.0001 short, so the drift repair adds +0.0001 to the FIRST receiver in created_at ASC order, which is ${hx1_id}"
            - "Final adjusted weights: ${hx1_id} 233928.5715, ${hx2_id} 70178.5714, ${hx3_id} 187142.8571, ${hx4_id} 818750.0000 - note only h1 carries the repaired 5th digit"
            - "${run21_mass} == 1310000.0000 exactly - identical to the pre-cap mass, so redistribution conserved the whole weight mass"
            - "usable_minutes are 350, 730, 60 and 900 and contributions are 56857.64, 35576.64, 7797.62 and 511718.75, summing to 611950.65"
            - "${run21_projected} == 611951 - the sum of the ALREADY-ROUNDED contributions, rounded once at the end"
            - "ProcessingRun.${run21_id}.limitation_disclosures == [WEIGHT_CAP_APPLIED] and .excluded_cell_count == 0"
