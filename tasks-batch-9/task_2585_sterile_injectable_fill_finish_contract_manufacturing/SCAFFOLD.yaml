# =============================================================================
# PRD-Bench Scaffold — Task 2585
# Sterile Injectable Fill-Finish Contract Manufacturing
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2585. Sterile Injectable Fill-Finish Contract Manufacturing (sterile contract manufacturing
  organization): client project intake with technology transfer, process characterization and
  analytical method transfer, aseptic process simulation with media fills and personnel
  qualification for the filling suite, batch scheduling across shared suites with changeover,
  cleaning validation and cross-contamination controls, component sourcing for vials, stoppers
  and syringes with sterilization validation, in-process controls including fill weight,
  container closure integrity and visual inspection, environmental monitoring with alert and
  action limits and investigation of excursions, batch record review, deviation investigation
  and quality release by the qualified person, regulatory inspection readiness and client audit
  hosting

domain_name: sterile-fill-finish-cmo
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation

  entity_topology: flat
  # Every entity is a peer addressed at its own top-level collection
  # (/client-projects, /filling-suites, /batch-orders, /component-lots, ...).
  # Relationships are expressed exclusively through FK body fields plus
  # filtered-list reads; no business resource is nested in a URL path except
  # the two append-only sub-resource reads (qp-release-decisions,
  # audit-engagements) whose children have no independent addressability.

  state_machine_shape: cyclic
  # BatchOrder carries two independent state axes (production_status ×
  # quality_status) and both axes admit backward edges: production
  # SUSPENDED -> SCHEDULED on suite requalification, quality QP_REVIEW ->
  # BR_REVIEW on an ACTION excursion demotion and QUARANTINED -> BR_REVIEW on
  # deviation closure. Deviation loops CAPA_PENDING -> UNDER_INVESTIGATION on
  # every CAPA rejection. FillingSuite loops INVALIDATED -> QUALIFIED.
  # MediaFill forks INCUBATING -> {PASSED, INVESTIGATION_REQUIRED, FAILED}
  # with divergent side-effect sets per branch.

  relationship_patterns:
    - one_to_many          # ClientProject -> BatchOrder, FillingSuite -> EmSample
    - many_to_many         # BatchOrder <-> ComponentLot via ComponentReservation
    - cross_aggregate      # BatchOrder gates on FillingSuite + PersonnelQualification + BatchRecordReview
    - polymorphic          # Deviation attaches to a BatchOrder and optionally to an EmSample

  role_model: segregation_of_duties
  # The Qualified Person who signs release MUST NOT be the QA user who signed
  # the batch record review, and the QA user who decides a CAPA MUST NOT be the
  # user who opened the deviation. Enforced on X-User-ID.

  consistency_model: immediate

difficulty_level: expert_plus
# 15 entities / 60 endpoints / 34 error codes / 12 calculations (3 of them
# dual-variant) / 11 state machines / 2 OCC rules. Density, not padding: every
# entity participates in at least one cross-entity gate or cascade hop.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================

entities:

  # ---------------------------------------------------------------------------
  - name: ClientProject
    parent: null
    common_fields: true
    fields:
      - name: client_name
        type: string
        source: input
        description: Sponsor company that owns the molecule.
        constraints: "1..120 chars, required"
      - name: molecule_name
        type: string
        source: input
        description: Drug substance name; drives changeover classification (same product vs product change).
        constraints: "1..80 chars, required"
      - name: dosage_form
        type: enum
        source: input
        description: Presentation being filled; selects the bill of components used by component_demand_units.
        constraints: "VIAL | PRESYRINGE"
      - name: primary_suite_id
        type: string
        source: input
        description: "FK -> FillingSuite.id; the suite whose aseptic qualification and operator roster feed project_readiness_score."
        constraints: "required, must reference an existing FillingSuite"
      - name: target_fill_weight_mg
        type: number
        source: input
        description: Nominal fill weight per container; the FILL_WEIGHT in-process control tolerance band is derived from it.
        constraints: "> 0"
      - name: historical_reject_rate_ppm
        type: integer
        source: input
        description: Sponsor-declared historical visual reject rate in parts per million; the ONLY input to the provisional (forward-looking) releasable-unit variant.
        constraints: ">= 0 and <= 100000"
      - name: reserved_unit_budget
        type: integer
        source: input
        description: Contractual ceiling on total component units the CMO may commit across all of this project's live batches.
        constraints: ">= 0"
      - name: tech_transfer_stage
        type: enum
        source: system
        description: Technology-transfer progress; advanced one step at a time by POST /client-projects/{id}/advance-tech-transfer.
        default: NOT_STARTED
        constraints: "NOT_STARTED | GAP_ASSESSMENT | ENGINEERING_RUN | COMPLETE"
      - name: analytical_method_transfer_status
        type: enum
        source: system
        description: Analytical method transfer state, set on each advance-tech-transfer call.
        default: NOT_STARTED
        constraints: "NOT_STARTED | IN_TRANSFER | VALIDATED"
      - name: status
        type: enum
        source: system
        description: Project lifecycle; ON_HOLD is entered only by the CRITICAL-deviation cascade and left only by POST /client-projects/{id}/release-hold.
        default: INTAKE
        constraints: "INTAKE | ACTIVE | ON_HOLD"
      - name: committed_demand_units
        type: integer
        source: computed
        description: "Derived ledger: sum of BatchOrder.component_demand_units over this project's BatchOrder rows whose production_status IN {SCHEDULED, SETUP, FILLING, FILLED}. Reconciled on every batch create / cancel / suspend."
        default: 0
      - name: open_deviation_risk_total
        type: integer
        source: computed
        description: "Derived ledger: sum of Deviation.risk_score over Deviations whose batch_order_id belongs to this project and whose status != CLOSED. Conserved quantity for the deviation compensating invariant."
        default: 0
      - name: last_client_audit_finding_count
        type: integer
        source: computed
        description: finding_count of the most recently hosted AuditEngagement for this project, ranked by hosted_at DESC with tie-break created_at DESC; 0 when none hosted.
        default: 0

  # ---------------------------------------------------------------------------
  - name: FillingSuite
    parent: null
    common_fields: true
    fields:
      - name: suite_code
        type: string
        source: input
        description: Human-readable suite identifier, unique across all suites.
        constraints: "1..20 chars, unique"
      - name: grade
        type: enum
        source: input
        description: EU GMP cleanroom grade of the critical zone; selects the environmental-monitoring alert/action limit table.
        constraints: "A | B | C"
      - name: changeover_minutes_same_product
        type: integer
        source: input
        description: Buffer minutes that must elapse after a batch's planned_end before the next batch of the SAME molecule may start.
        constraints: ">= 0"
      - name: changeover_minutes_product_change
        type: integer
        source: input
        description: Buffer minutes required after a batch's planned_end before the next batch of a DIFFERENT molecule may start; must be >= changeover_minutes_same_product.
        constraints: ">= changeover_minutes_same_product"
      - name: max_committed_minutes
        type: integer
        source: input
        description: Fiscal ceiling on the suite's committed occupancy minutes (fill window + applied changeover) across live batches.
        constraints: "> 0"
      - name: aseptic_qualification_status
        type: enum
        source: system
        description: Aseptic-process-simulation qualification state of the suite; driven exclusively by MediaFill read/adjudicate outcomes.
        default: NOT_QUALIFIED
        constraints: "NOT_QUALIFIED | QUALIFIED | INVALIDATED"
      - name: media_fill_valid_until
        type: datetime
        source: computed
        description: Expiry of the aseptic qualification, stamped as the PASSED media fill's read timestamp plus MEDIA_FILL_VALIDITY_DAYS; null while NOT_QUALIFIED or INVALIDATED.
        default: null
      - name: cleaning_validation_status
        type: enum
        source: system
        description: Cross-contamination control state, set by POST /filling-suites/{id}/cleaning-validation.
        default: NOT_VALIDATED
        constraints: "NOT_VALIDATED | VALIDATED | FAILED"
      - name: last_cleaned_molecule
        type: string
        source: system
        description: molecule_name recorded on the most recent VALIDATED cleaning validation; null until one passes.
        default: null
      - name: open_action_excursion_count
        type: integer
        source: computed
        description: "Count of EmSample rows with suite_id == this suite, classification == ACTION and investigation_status != CLOSED."
        default: 0
      - name: qualified_operator_count
        type: integer
        source: computed
        description: "Count of PersonnelQualification rows with suite_id == this suite, status == QUALIFIED and expires_on >= the logical clock."
        default: 0
      - name: committed_minutes
        type: integer
        source: computed
        description: "Derived ledger: suite occupancy minutes summed over BatchOrder rows in this suite whose production_status IN {SCHEDULED, SETUP, FILLING, FILLED}."
        default: 0
      - name: posture
        type: enum
        source: computed
        description: Derived gate over every child filling operation; recomputed after every mutation that touches aseptic_qualification_status, cleaning_validation_status, open_action_excursion_count, qualified_operator_count or the logical clock.
        default: RESTRICTED
        constraints: "OPEN | RESTRICTED | FROZEN"

  # ---------------------------------------------------------------------------
  - name: MediaFill
    parent: null
    common_fields: true
    fields:
      - name: suite_id
        type: string
        source: input
        description: "FK -> FillingSuite.id; the suite this aseptic process simulation qualifies."
        constraints: required
      - name: scheduled_run_date
        type: datetime
        source: input
        description: Planned execution instant of the media fill (ISO 8601 UTC).
        constraints: required
      - name: units_filled
        type: integer
        source: input
        description: Number of media-filled units actually produced; recorded by POST /media-fills/{id}/execute.
        default: null
      - name: contaminated_units
        type: integer
        source: input
        description: Number of turbid (contaminated) units found at incubation read-out; recorded by POST /media-fills/{id}/read.
        default: null
      - name: participating_operator_names
        type: array
        source: input
        description: Operator names who performed aseptic interventions during the run; a PersonnelQualification may only cite this media fill if its operator_name is in this list.
        default: []
      - name: status
        type: enum
        source: system
        description: Media-fill lifecycle; INCUBATING forks into PASSED / INVESTIGATION_REQUIRED / FAILED with divergent cascades.
        default: SCHEDULED
        constraints: "SCHEDULED | INCUBATING | INVESTIGATION_REQUIRED | PASSED | FAILED"
      - name: read_at
        type: datetime
        source: system
        description: Logical-clock instant at which POST /media-fills/{id}/read executed; null before read-out.
        default: null
      - name: outcome_reason
        type: string
        source: system
        description: Pinned explanation of the outcome branch taken (zero-contaminant pass, single-unit investigation, multi-unit failure, adjudicated).
        default: null

  # ---------------------------------------------------------------------------
  - name: PersonnelQualification
    parent: null
    common_fields: true
    fields:
      - name: operator_name
        type: string
        source: input
        description: Operator identity string; the operator temporal-overlap rule groups BatchOrder rows by this value across suites.
        constraints: "1..40 chars, required"
      - name: suite_id
        type: string
        source: input
        description: "FK -> FillingSuite.id; qualifications are suite-scoped, so one operator holds one record per suite."
        constraints: required
      - name: media_fill_id
        type: string
        source: input
        description: "FK -> MediaFill.id; the aseptic process simulation this qualification is evidenced by. Required for qualification_type ASEPTIC_INTERVENTION, optional otherwise."
        default: null
      - name: qualification_type
        type: enum
        source: input
        description: Scope of the qualification.
        constraints: "GOWNING | ASEPTIC_INTERVENTION | VISUAL_INSPECTION"
      - name: expires_on
        type: datetime
        source: input
        description: Instant at or after which the qualification is no longer effective; the clock-advance cascade flips QUALIFIED to LAPSED at this boundary.
        constraints: "required, must be strictly after the logical clock at creation"
      - name: status
        type: enum
        source: system
        description: Qualification lifecycle.
        default: PENDING
        constraints: "PENDING | QUALIFIED | LAPSED | REVOKED"
      - name: qualified_at
        type: datetime
        source: system
        description: Logical-clock instant of the PENDING -> QUALIFIED transition; null while PENDING.
        default: null

  # ---------------------------------------------------------------------------
  - name: BatchOrder
    parent: null
    common_fields: true
    fields:
      - name: client_project_id
        type: string
        source: input
        description: "FK -> ClientProject.id; owner of the molecule being filled."
        constraints: required
      - name: suite_id
        type: string
        source: input
        description: "FK -> FillingSuite.id; the shared suite this batch occupies for [planned_start, planned_end)."
        constraints: required
      - name: lead_operator_qualification_id
        type: string
        source: input
        description: "FK -> PersonnelQualification.id; the lead aseptic operator's qualification record. Its operator_name identifies the operator resource for the closed-interval double-booking rule."
        constraints: required
      - name: batch_number
        type: string
        source: input
        description: Sponsor batch number, unique per client_project_id.
        constraints: "1..30 chars"
      - name: planned_start
        type: datetime
        source: input
        description: Inclusive start of the suite occupancy window.
        constraints: required
      - name: planned_end
        type: datetime
        source: input
        description: Exclusive end of the suite occupancy window; must be strictly after planned_start.
        constraints: "> planned_start"
      - name: target_fill_units
        type: integer
        source: input
        description: Planned container count; the sole quantity input to component_demand_units.
        constraints: "> 0"
      - name: component_demand_units
        type: integer
        source: computed
        description: Total component units this batch commits, computed once at creation by the per-line-then-sum pack rounding rule; frozen thereafter.
        default: 0
      - name: changeover_minutes_applied
        type: integer
        source: computed
        description: Changeover buffer minutes selected at creation from the immediately preceding live batch in the same suite; frozen thereafter.
        default: 0
      - name: filled_unit_count
        type: integer
        source: input
        description: Containers actually filled, recorded by POST /batch-orders/{id}/complete-fill.
        default: null
      - name: quarantined_unit_count
        type: integer
        source: input
        description: Containers segregated during batch record review; subtracted only by the final releasable-unit variant.
        default: 0
      - name: production_status
        type: enum
        source: system
        description: First independent state axis — physical progress of the fill.
        default: SCHEDULED
        constraints: "SCHEDULED | SETUP | FILLING | FILLED | SUSPENDED | CANCELLED"
      - name: quality_status
        type: enum
        source: system
        description: Second independent state axis — quality disposition; evolves independently of production_status on the same row.
        default: PENDING
        constraints: "PENDING | IN_PROCESS_REVIEW | BR_REVIEW | QP_REVIEW | QUARANTINED | RELEASED | REJECTED"
      - name: provisional_releasable_units
        type: integer
        source: computed
        description: Forward-looking releasable-unit estimate stamped at FILLING -> FILLED using historical_reject_rate_ppm; never overwritten by the final variant.
        default: null
      - name: final_releasable_units
        type: integer
        source: computed
        description: Chronological releasable-unit figure stamped when quality_status enters QP_REVIEW using actual recorded inspection results.
        default: null
      - name: release_fee_cents
        type: integer
        source: computed
        description: QP release fee in cents, stamped on the RELEASE decision only; null for REJECT and QUARANTINE decisions.
        default: null

  # ---------------------------------------------------------------------------
  - name: ComponentLot
    parent: null
    common_fields: true
    fields:
      - name: client_project_id
        type: string
        source: input
        description: "FK -> ClientProject.id; component lots are project-dedicated, so a batch may only reserve lots of its own project."
        constraints: required
      - name: component_type
        type: enum
        source: input
        description: Primary-packaging component class.
        constraints: "VIAL | STOPPER | SYRINGE | PLUNGER"
      - name: lot_code
        type: string
        source: input
        description: Vendor lot code, unique per component_type.
        constraints: "1..30 chars"
      - name: quantity_received
        type: integer
        source: input
        description: Immutable count of units received; the conserved total for the component-unit invariant.
        constraints: "> 0"
      - name: quantity_available
        type: integer
        source: computed
        description: Units not currently held by a RESERVED or CONSUMED ComponentReservation; initialised to quantity_received.
        default: 0
      - name: sterilization_expiry
        type: datetime
        source: input
        description: Instant at or after which the depyrogenation/sterilization hold time lapses and the lot may no longer be reserved.
        constraints: required
      - name: sterilization_validation_status
        type: enum
        source: system
        description: Sterilization-validation dossier state, set by POST /component-lots/{id}/sterilization-validation.
        default: PENDING
        constraints: "PENDING | RELEASED | REJECTED"
      - name: status
        type: enum
        source: system
        description: Lot lifecycle; EXHAUSTED is reversible because releasing a reservation restores availability.
        default: QUARANTINE
        constraints: "QUARANTINE | RELEASED | EXHAUSTED | EXPIRED | REJECTED"

  # ---------------------------------------------------------------------------
  - name: ComponentReservation
    parent: null
    common_fields: true
    fields:
      - name: batch_order_id
        type: string
        source: input
        description: "FK -> BatchOrder.id; the batch holding the components."
        constraints: required
      - name: component_lot_id
        type: string
        source: input
        description: "FK -> ComponentLot.id; the lot the units are drawn from."
        constraints: required
      - name: quantity_reserved
        type: integer
        source: input
        description: Units withheld from the lot for this batch.
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        description: Reservation lifecycle; RELEASED restores the units to the lot, CONSUMED retires them permanently.
        default: RESERVED
        constraints: "RESERVED | CONSUMED | RELEASED"
      - name: released_reason
        type: string
        source: system
        description: Why a RESERVED reservation was released (batch cancellation or suite-freeze suspension cascade); null while RESERVED or CONSUMED.
        default: null

  # ---------------------------------------------------------------------------
  - name: InProcessCheck
    parent: null
    common_fields: true
    fields:
      - name: batch_order_id
        type: string
        source: input
        description: "FK -> BatchOrder.id; the batch under in-process control."
        constraints: required
      - name: check_type
        type: enum
        source: input
        description: In-process control performed.
        constraints: "FILL_WEIGHT | CCI | VISUAL_INSPECTION"
      - name: sample_size
        type: integer
        source: input
        description: Containers inspected; the denominator of the visual-inspection defect rate.
        constraints: "> 0"
      - name: reject_unit_count
        type: integer
        source: input
        description: Containers rejected by this control; the numerator of the visual-inspection defect rate and the only reject term in the final releasable-unit variant.
        default: 0
      - name: destructive_sample_units
        type: integer
        source: input
        description: Containers destroyed by the control itself; subtracted by BOTH releasable-unit variants.
        default: 0
      - name: measured_fill_weights_mg
        type: array
        source: input
        description: Individual fill-weight measurements in mg; required for check_type FILL_WEIGHT, must be empty otherwise.
        default: []
      - name: result
        type: enum
        source: computed
        description: Derived control verdict per the in_process_check_result rules for this check_type.
        constraints: "PASS | ALERT | FAIL"
      - name: max_absolute_deviation_pct
        type: number
        source: computed
        description: Largest absolute relative deviation of any measured fill weight from ClientProject.target_fill_weight_mg, 4 decimal places; 0 for non-FILL_WEIGHT checks.
        default: 0

  # ---------------------------------------------------------------------------
  - name: EmSample
    parent: null
    common_fields: true
    fields:
      - name: suite_id
        type: string
        source: input
        description: "FK -> FillingSuite.id; the monitored suite whose grade selects the alert/action limits."
        constraints: required
      - name: batch_order_id
        type: string
        source: input
        description: "FK -> BatchOrder.id; the batch in progress at sampling time, or null for a non-production sample. When present its suite_id MUST equal this sample's suite_id."
        default: null
      - name: sample_type
        type: enum
        source: input
        description: Environmental monitoring sample class; selects the limit row and the risk surcharge.
        constraints: "VIABLE_AIR | SURFACE | PERSONNEL_GLOVE"
      - name: cfu_count
        type: integer
        source: input
        description: Colony-forming units recovered.
        constraints: ">= 0"
      - name: alert_limit
        type: integer
        source: computed
        description: Alert limit selected from EM_LIMITS by (suite grade, sample_type); stamped at creation.
      - name: action_limit
        type: integer
        source: computed
        description: Action limit selected from EM_LIMITS by (suite grade, sample_type); stamped at creation.
      - name: classification
        type: enum
        source: computed
        description: Threshold verdict comparing cfu_count against the stamped limits, action checked before alert.
        constraints: "WITHIN_LIMIT | ALERT | ACTION"
      - name: risk_index
        type: integer
        source: computed
        description: Excursion risk index from the multi-input non-linear formula; 0 when classification is WITHIN_LIMIT.
        default: 0
      - name: investigation_status
        type: enum
        source: system
        description: Excursion investigation lifecycle; stamped NOT_REQUIRED for WITHIN_LIMIT samples and OPEN for ALERT/ACTION samples at creation.
        constraints: "NOT_REQUIRED | OPEN | INVESTIGATING | CLOSED"
      - name: root_cause
        type: string
        source: input
        description: Assigned root cause recorded when the investigation is closed; null before closure.
        default: null

  # ---------------------------------------------------------------------------
  - name: Deviation
    parent: null
    common_fields: true
    fields:
      - name: batch_order_id
        type: string
        source: input
        description: "FK -> BatchOrder.id; the batch the deviation is written against."
        constraints: required
      - name: em_sample_id
        type: string
        source: input
        description: "FK -> EmSample.id; the environmental excursion that spawned this deviation, or null for a process deviation."
        default: null
      - name: opened_by_user_id
        type: string
        source: system
        description: X-User-ID of the QaReviewer who created the deviation; the CAPA decision maker must differ from it.
      - name: summary
        type: string
        source: input
        description: One-line description of the deviation.
        constraints: "1..200 chars"
      - name: classification
        type: enum
        source: input
        description: GMP severity classification, assigned by POST /deviations/{id}/classify; null while OPEN.
        default: null
        constraints: "MINOR | MAJOR | CRITICAL"
      - name: capa_rejection_count
        type: integer
        source: computed
        description: Number of times a submitted CAPA has been rejected; each rejection re-enters UNDER_INVESTIGATION and raises risk_score.
        default: 0
      - name: risk_score
        type: integer
        source: computed
        description: Escalation-weighted risk points; recomputed on classify and on every CAPA rejection, and mirrored into ClientProject.open_deviation_risk_total.
        default: 0
      - name: status
        type: enum
        source: system
        description: Deviation lifecycle with a CAPA rejection loop back to UNDER_INVESTIGATION.
        default: OPEN
        constraints: "OPEN | UNDER_INVESTIGATION | CAPA_PENDING | CLOSED"
      - name: capa_summary
        type: string
        source: input
        description: Corrective/preventive action text submitted for QA decision; null before submission.
        default: null

  # ---------------------------------------------------------------------------
  - name: BatchRecordReview
    parent: null
    common_fields: true
    fields:
      - name: batch_order_id
        type: string
        source: input
        description: "FK -> BatchOrder.id; the batch whose executed record is under review. At most one review row per batch."
        constraints: "required, unique per batch_order_id"
      - name: reviewer_user_id
        type: string
        source: system
        description: X-User-ID of the QaReviewer who created the review; the Qualified Person who releases the batch must differ from it.
      - name: open_findings_count
        type: integer
        source: input
        description: Number of unresolved review findings; must reach 0 before the review may close.
        default: 0
      - name: status
        type: enum
        source: system
        description: Review lifecycle; a demotion cascade can reopen a CLOSED review into COMPLETE_WITH_FINDINGS.
        default: IN_PROGRESS
        constraints: "IN_PROGRESS | COMPLETE_WITH_FINDINGS | CLOSED"
      - name: closed_at
        type: datetime
        source: system
        description: Logical-clock instant at which the review most recently entered CLOSED; null while open.
        default: null

  # ---------------------------------------------------------------------------
  - name: QpReleaseDecision
    parent: null
    common_fields: false
    fields:
      - name: batch_order_id
        type: string
        source: input
        description: "FK -> BatchOrder.id; the batch being dispositioned."
        constraints: required
      - name: qp_user_id
        type: string
        source: system
        description: X-User-ID of the QualifiedPerson who signed the decision.
      - name: decision
        type: enum
        source: input
        description: Final disposition signed by the Qualified Person.
        constraints: "RELEASE | REJECT | QUARANTINE"
      - name: rationale
        type: string
        source: input
        description: Written justification, mandatory for every decision.
        constraints: "1..300 chars"
      - name: released_unit_count
        type: integer
        source: computed
        description: Copy of BatchOrder.final_releasable_units frozen into this append-only record; 0 for REJECT and QUARANTINE.
        default: 0
      - name: fee_cents
        type: integer
        source: computed
        description: Copy of BatchOrder.release_fee_cents frozen into this record; 0 for REJECT and QUARANTINE.
        default: 0

  # ---------------------------------------------------------------------------
  - name: AuditEngagement
    parent: null
    common_fields: true
    fields:
      - name: client_project_id
        type: string
        source: input
        description: "FK -> ClientProject.id; the project whose quality system is being audited."
        constraints: required
      - name: audit_kind
        type: enum
        source: input
        description: Whether the sponsor is auditing the CMO or the CMO is rehearsing a regulatory inspection.
        constraints: "CLIENT_AUDIT | INSPECTION_READINESS"
      - name: requested_window_start
        type: datetime
        source: input
        description: Earliest instant the requester can attend.
        constraints: required
      - name: status
        type: enum
        source: system
        description: Engagement lifecycle; DEFERRED can be re-hosted later.
        default: REQUESTED
        constraints: "REQUESTED | HOSTED | DEFERRED"
      - name: finding_count
        type: integer
        source: input
        description: Findings raised during the hosted engagement; recorded on the host call.
        default: 0
      - name: hosted_at
        type: datetime
        source: system
        description: Logical-clock instant the engagement entered HOSTED; null otherwise.
        default: null

# =============================================================================
# §1.2 State Machine Table
# =============================================================================

state_machines:

  # ---------------------------------------------------------------------------
  - entity: ClientProject
    state_field: status
    initial_state: INTAKE
    terminal_states: []
    shape: cyclic
    transitions:
      - from: INTAKE
        to: ACTIVE
        trigger: "POST /client-projects/{id}/advance-tech-transfer with to_stage=COMPLETE and analytical_method_transfer_status=VALIDATED"
        actor: ProgramManager
        preconditions:
          - "status == INTAKE"
          - "to_stage is the immediate successor of tech_transfer_stage in the ordered list [NOT_STARTED, GAP_ASSESSMENT, ENGINEERING_RUN, COMPLETE]"
          - "analytical_method_transfer_status supplied is not earlier than the stored value in the ordered list [NOT_STARTED, IN_TRANSFER, VALIDATED]"
        side_effects:
          - "tech_transfer_stage := COMPLETE"
          - "analytical_method_transfer_status := VALIDATED"
          - "status := ACTIVE"
          - "increments ClientProject.version by 1 and refreshes updated_at"
        note: "Intermediate advance calls (to GAP_ASSESSMENT, ENGINEERING_RUN) mutate tech_transfer_stage only and leave status == INTAKE."
      - from: ACTIVE
        to: ON_HOLD
        trigger: "system event — POST /deviations/{id}/classify assigns classification=CRITICAL to a Deviation on one of this project's BatchOrder rows"
        actor: system
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "status := ON_HOLD"
          - "every BatchOrder of this project whose production_status IN {SCHEDULED, SETUP} is set to production_status := SUSPENDED (cascade hop 3 of the CRITICAL-deviation chain)"
          - "increments ClientProject.version by 1 and refreshes updated_at"
      - from: ON_HOLD
        to: ACTIVE
        trigger: "POST /client-projects/{id}/release-hold"
        actor: QaReviewer
        preconditions:
          - "status == ON_HOLD"
          - "no Deviation whose batch_order_id belongs to this project has classification == CRITICAL and status != CLOSED"
        side_effects:
          - "status := ACTIVE"
          - "every BatchOrder of this project whose production_status == SUSPENDED and whose suite_id has posture != FROZEN is set to production_status := SCHEDULED"
          - "increments ClientProject.version by 1 and refreshes updated_at"
        note: "Backward edge: the project cycles ACTIVE -> ON_HOLD -> ACTIVE any number of times."

  # ---------------------------------------------------------------------------
  - entity: FillingSuite
    state_field: aseptic_qualification_status
    initial_state: NOT_QUALIFIED
    terminal_states: []
    shape: cyclic
    transitions:
      - from: NOT_QUALIFIED
        to: QUALIFIED
        trigger: "POST /media-fills/{id}/read yielding outcome PASSED, or POST /media-fills/{id}/adjudicate with outcome=PASSED"
        actor: system
        preconditions:
          - "the MediaFill's suite_id == this suite"
          - "aseptic_qualification_status IN {NOT_QUALIFIED, INVALIDATED}"
        side_effects:
          - "aseptic_qualification_status := QUALIFIED"
          - "media_fill_valid_until := MediaFill.read_at + MEDIA_FILL_VALIDITY_DAYS days"
          - "posture recomputed by the suite_posture rule"
          - "increments FillingSuite.version by 1 and refreshes updated_at"
      - from: QUALIFIED
        to: INVALIDATED
        trigger: "POST /media-fills/{id}/read yielding outcome FAILED, or POST /media-fills/{id}/adjudicate with outcome=FAILED"
        actor: system
        preconditions:
          - "the MediaFill's suite_id == this suite"
        side_effects:
          - "aseptic_qualification_status := INVALIDATED"
          - "media_fill_valid_until := null"
          - "posture recomputed to FROZEN by the suite_posture rule (hop 2 of the media-fill-failure cascade)"
          - "because posture became FROZEN, every BatchOrder in this suite whose production_status IN {SCHEDULED, SETUP} is set to production_status := SUSPENDED and, when its quality_status IS NOT IN {RELEASED, REJECTED}, quality_status := QUARANTINED (hop 3)"
          - "because those batches were quarantined, every ComponentReservation of each such batch with status == RESERVED is set to status := RELEASED, released_reason := 'SUITE_FREEZE_SUSPENSION', and its ComponentLot.quantity_available is increased by quantity_reserved (hop 4)"
          - "because a ComponentLot's quantity_available rose above 0, any such lot with status == EXHAUSTED is set to status := RELEASED (hop 5)"
          - "increments FillingSuite.version by 1 and refreshes updated_at"
        note: "Depth-5 transitive cascade. Each hop is caused by the previous hop's mutation, not by the read call itself."
      - from: INVALIDATED
        to: QUALIFIED
        trigger: "POST /media-fills/{id}/read yielding outcome PASSED for a later MediaFill in this suite"
        actor: system
        preconditions:
          - "the MediaFill's suite_id == this suite"
          - "the MediaFill's scheduled_run_date is strictly after the read_at of the media fill that invalidated the suite"
        side_effects:
          - "aseptic_qualification_status := QUALIFIED"
          - "media_fill_valid_until := MediaFill.read_at + MEDIA_FILL_VALIDITY_DAYS days"
          - "posture recomputed by the suite_posture rule"
          - "every BatchOrder in this suite whose production_status == SUSPENDED and whose ClientProject.status == ACTIVE is set to production_status := SCHEDULED"
          - "increments FillingSuite.version by 1 and refreshes updated_at"
        note: "Backward edge closing the requalification loop."

  # ---------------------------------------------------------------------------
  - entity: FillingSuite
    state_field: cleaning_validation_status
    initial_state: NOT_VALIDATED
    terminal_states: []
    shape: cyclic
    transitions:
      - from: NOT_VALIDATED
        to: VALIDATED
        trigger: "POST /filling-suites/{id}/cleaning-validation with residue_ug_per_swab <= CLEANING_RESIDUE_LIMIT_UG"
        actor: MicrobiologyAnalyst
        preconditions:
          - "cleaning_validation_status IN {NOT_VALIDATED, FAILED, VALIDATED}"
          - "no BatchOrder in this suite has production_status == FILLING"
        side_effects:
          - "cleaning_validation_status := VALIDATED"
          - "last_cleaned_molecule := the molecule_name supplied on the call"
          - "posture recomputed by the suite_posture rule"
          - "increments FillingSuite.version by 1 and refreshes updated_at"
      - from: NOT_VALIDATED
        to: FAILED
        trigger: "POST /filling-suites/{id}/cleaning-validation with residue_ug_per_swab > CLEANING_RESIDUE_LIMIT_UG"
        actor: MicrobiologyAnalyst
        preconditions:
          - "no BatchOrder in this suite has production_status == FILLING"
        side_effects:
          - "cleaning_validation_status := FAILED"
          - "last_cleaned_molecule unchanged"
          - "posture recomputed to FROZEN by the suite_posture rule"
          - "increments FillingSuite.version by 1 and refreshes updated_at"
      - from: VALIDATED
        to: FAILED
        trigger: "POST /filling-suites/{id}/cleaning-validation with residue_ug_per_swab > CLEANING_RESIDUE_LIMIT_UG"
        actor: MicrobiologyAnalyst
        preconditions:
          - "no BatchOrder in this suite has production_status == FILLING"
        side_effects:
          - "cleaning_validation_status := FAILED"
          - "posture recomputed to FROZEN by the suite_posture rule"
          - "increments FillingSuite.version by 1 and refreshes updated_at"
      - from: FAILED
        to: VALIDATED
        trigger: "POST /filling-suites/{id}/cleaning-validation with residue_ug_per_swab <= CLEANING_RESIDUE_LIMIT_UG"
        actor: MicrobiologyAnalyst
        preconditions:
          - "no BatchOrder in this suite has production_status == FILLING"
        side_effects:
          - "cleaning_validation_status := VALIDATED"
          - "last_cleaned_molecule := the molecule_name supplied on the call"
          - "posture recomputed by the suite_posture rule"
          - "increments FillingSuite.version by 1 and refreshes updated_at"
        note: "Second independent state axis on FillingSuite; it evolves without reference to aseptic_qualification_status."

  # ---------------------------------------------------------------------------
  - entity: MediaFill
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [PASSED, FAILED]
    shape: branching
    transitions:
      - from: SCHEDULED
        to: INCUBATING
        trigger: "POST /media-fills/{id}/execute"
        actor: MicrobiologyAnalyst
        preconditions:
          - "status == SCHEDULED"
          - "units_filled supplied >= MEDIA_FILL_MIN_UNITS"
          - "participating_operator_names supplied is non-empty"
          - "no BatchOrder in this suite has production_status == FILLING"
        side_effects:
          - "units_filled := supplied value"
          - "participating_operator_names := supplied value"
          - "status := INCUBATING"
          - "increments MediaFill.version by 1 and refreshes updated_at"
      - from: INCUBATING
        to: PASSED
        trigger: "POST /media-fills/{id}/read with contaminated_units == 0"
        actor: MicrobiologyAnalyst
        preconditions:
          - "status == INCUBATING"
        side_effects:
          - "contaminated_units := 0, read_at := logical clock, outcome_reason := 'ZERO_CONTAMINANT_PASS'"
          - "status := PASSED"
          - "the suite's aseptic_qualification_status transitions to QUALIFIED with media_fill_valid_until := read_at + MEDIA_FILL_VALIDITY_DAYS days"
          - "increments MediaFill.version by 1 and refreshes updated_at"
      - from: INCUBATING
        to: INVESTIGATION_REQUIRED
        trigger: "POST /media-fills/{id}/read with contaminated_units == 1"
        actor: MicrobiologyAnalyst
        preconditions:
          - "status == INCUBATING"
          - "units_filled >= MEDIA_FILL_MIN_UNITS"
        side_effects:
          - "contaminated_units := 1, read_at := logical clock, outcome_reason := 'SINGLE_UNIT_INVESTIGATION'"
          - "status := INVESTIGATION_REQUIRED"
          - "the suite's aseptic_qualification_status is left unchanged; posture is recomputed and the suite therefore stays RESTRICTED or FROZEN if it already was"
          - "increments MediaFill.version by 1 and refreshes updated_at"
        note: "Divergent branch: no suite qualification change, and no batch cascade."
      - from: INCUBATING
        to: FAILED
        trigger: "POST /media-fills/{id}/read with contaminated_units >= 2"
        actor: MicrobiologyAnalyst
        preconditions:
          - "status == INCUBATING"
        side_effects:
          - "contaminated_units := supplied value, read_at := logical clock, outcome_reason := 'MULTI_UNIT_FAILURE'"
          - "status := FAILED"
          - "the suite's aseptic_qualification_status transitions to INVALIDATED, which itself freezes the suite, which itself suspends and quarantines the suite's live batches, which itself releases those batches' reservations, which itself un-exhausts the affected lots"
          - "every PersonnelQualification whose media_fill_id == this media fill and whose status == QUALIFIED is set to status := REVOKED"
          - "increments MediaFill.version by 1 and refreshes updated_at"
        note: "Divergent branch: full depth-5 cascade plus operator revocation."
      - from: INVESTIGATION_REQUIRED
        to: PASSED
        trigger: "POST /media-fills/{id}/adjudicate with outcome=PASSED"
        actor: QaReviewer
        preconditions:
          - "status == INVESTIGATION_REQUIRED"
          - "adjudication_rationale is supplied"
        side_effects:
          - "outcome_reason := 'ADJUDICATED_PASS'"
          - "status := PASSED"
          - "the suite's aseptic_qualification_status transitions to QUALIFIED with media_fill_valid_until := MediaFill.read_at + MEDIA_FILL_VALIDITY_DAYS days"
          - "increments MediaFill.version by 1 and refreshes updated_at"
      - from: INVESTIGATION_REQUIRED
        to: FAILED
        trigger: "POST /media-fills/{id}/adjudicate with outcome=FAILED"
        actor: QaReviewer
        preconditions:
          - "status == INVESTIGATION_REQUIRED"
          - "adjudication_rationale is supplied"
        side_effects:
          - "outcome_reason := 'ADJUDICATED_FAILURE'"
          - "status := FAILED"
          - "the suite's aseptic_qualification_status transitions to INVALIDATED with the same depth-5 cascade as a direct multi-unit failure"
          - "every PersonnelQualification whose media_fill_id == this media fill and whose status == QUALIFIED is set to status := REVOKED"
          - "increments MediaFill.version by 1 and refreshes updated_at"
        note: "Fork-join: the two INVESTIGATION_REQUIRED exits carry disjoint side-effect sets."

  # ---------------------------------------------------------------------------
  - entity: PersonnelQualification
    state_field: status
    initial_state: PENDING
    terminal_states: [REVOKED]
    shape: branching
    transitions:
      - from: PENDING
        to: QUALIFIED
        trigger: "POST /personnel-qualifications/{id}/qualify"
        actor: MicrobiologyAnalyst
        preconditions:
          - "status == PENDING"
          - "expires_on > the logical clock"
          - "when qualification_type == ASEPTIC_INTERVENTION: media_fill_id is not null, the referenced MediaFill.status == PASSED, and operator_name is a member of that MediaFill.participating_operator_names"
        side_effects:
          - "status := QUALIFIED, qualified_at := logical clock"
          - "the suite's qualified_operator_count is recomputed and its posture is recomputed by the suite_posture rule"
          - "increments PersonnelQualification.version by 1 and refreshes updated_at"
      - from: QUALIFIED
        to: LAPSED
        trigger: "system event — POST /_clock/set_current_utc advances the logical clock to an instant >= expires_on"
        actor: system
        preconditions:
          - "status == QUALIFIED"
          - "expires_on <= the new logical clock"
        side_effects:
          - "status := LAPSED"
          - "the suite's qualified_operator_count is recomputed and its posture is recomputed by the suite_posture rule"
          - "increments PersonnelQualification.version by 1 and refreshes updated_at"
        note: "Processed in expires_on ASC order, tie-break created_at ASC, so posture recomputation is deterministic."
      - from: PENDING
        to: REVOKED
        trigger: "POST /personnel-qualifications/{id}/revoke"
        actor: MicrobiologyAnalyst
        preconditions:
          - "status == PENDING"
        side_effects:
          - "status := REVOKED"
          - "increments PersonnelQualification.version by 1 and refreshes updated_at"
      - from: QUALIFIED
        to: REVOKED
        trigger: "POST /personnel-qualifications/{id}/revoke, or system event when a MediaFill this qualification cites transitions to FAILED"
        actor: MicrobiologyAnalyst | system
        preconditions:
          - "status == QUALIFIED"
        side_effects:
          - "status := REVOKED"
          - "the suite's qualified_operator_count is recomputed and its posture is recomputed by the suite_posture rule"
          - "increments PersonnelQualification.version by 1 and refreshes updated_at"
      - from: LAPSED
        to: REVOKED
        trigger: "POST /personnel-qualifications/{id}/revoke"
        actor: MicrobiologyAnalyst
        preconditions:
          - "status == LAPSED"
        side_effects:
          - "status := REVOKED"
          - "increments PersonnelQualification.version by 1 and refreshes updated_at"

  # ---------------------------------------------------------------------------
  - entity: BatchOrder
    state_field: production_status
    initial_state: SCHEDULED
    terminal_states: [CANCELLED]
    shape: cyclic
    note: "First of two independent state axes on the same BatchOrder row. production_status and quality_status advance on disjoint triggers and neither is a function of the other."
    transitions:
      - from: SCHEDULED
        to: SETUP
        trigger: "POST /batch-orders/{id}/setup"
        actor: ProductionSupervisor
        preconditions:
          - "production_status == SCHEDULED"
          - "the suite's posture IS NOT FROZEN"
          - "the ClientProject.status == ACTIVE"
        side_effects:
          - "production_status := SETUP"
          - "increments BatchOrder.version by 1 and refreshes updated_at"
      - from: SETUP
        to: FILLING
        trigger: "POST /batch-orders/{id}/start-fill"
        actor: ProductionSupervisor
        preconditions:
          - "production_status == SETUP"
          - "the suite's posture == OPEN"
          - "the suite's media_fill_valid_until >= planned_end"
          - "the referenced PersonnelQualification has status == QUALIFIED and expires_on >= the logical clock"
          - "the suite's last_cleaned_molecule == the ClientProject.molecule_name and cleaning_validation_status == VALIDATED"
          - "the sum of quantity_reserved over this batch's ComponentReservation rows with status == RESERVED is >= component_demand_units"
        side_effects:
          - "production_status := FILLING"
          - "quality_status advances PENDING -> IN_PROCESS_REVIEW on the second axis"
          - "increments BatchOrder.version by 1 and refreshes updated_at"
      - from: FILLING
        to: FILLED
        trigger: "POST /batch-orders/{id}/complete-fill"
        actor: ProductionSupervisor
        preconditions:
          - "production_status == FILLING"
          - "filled_unit_count supplied is > 0 and <= target_fill_units"
        side_effects:
          - "filled_unit_count := supplied value"
          - "production_status := FILLED"
          - "every ComponentReservation of this batch with status == RESERVED is set to status := CONSUMED; ComponentLot.quantity_available is NOT changed because the units were already withheld at reservation time"
          - "provisional_releasable_units := batch_releasable_units variant PROVISIONAL_AT_FILL"
          - "increments BatchOrder.version by 1 and refreshes updated_at"
      - from: SCHEDULED
        to: SUSPENDED
        trigger: "system event — the suite's posture becomes FROZEN, or the ClientProject transitions ACTIVE -> ON_HOLD"
        actor: system
        preconditions:
          - "production_status == SCHEDULED"
        side_effects:
          - "production_status := SUSPENDED"
          - "when quality_status IS NOT IN {RELEASED, REJECTED}, quality_status := QUARANTINED on the second axis"
          - "because this batch was suspended, every ComponentReservation of it with status == RESERVED is set to status := RELEASED and its lot's quantity_available is increased by quantity_reserved"
          - "the ClientProject.committed_demand_units and the suite's committed_minutes are recomputed"
          - "increments BatchOrder.version by 1 and refreshes updated_at"
      - from: SETUP
        to: SUSPENDED
        trigger: "system event — the suite's posture becomes FROZEN, or the ClientProject transitions ACTIVE -> ON_HOLD"
        actor: system
        preconditions:
          - "production_status == SETUP"
        side_effects:
          - "production_status := SUSPENDED"
          - "when quality_status IS NOT IN {RELEASED, REJECTED}, quality_status := QUARANTINED on the second axis"
          - "because this batch was suspended, every ComponentReservation of it with status == RESERVED is set to status := RELEASED and its lot's quantity_available is increased by quantity_reserved"
          - "the ClientProject.committed_demand_units and the suite's committed_minutes are recomputed"
          - "increments BatchOrder.version by 1 and refreshes updated_at"
      - from: SUSPENDED
        to: SCHEDULED
        trigger: "system event — the suite's aseptic_qualification_status returns INVALIDATED -> QUALIFIED, or POST /client-projects/{id}/release-hold"
        actor: system
        preconditions:
          - "production_status == SUSPENDED"
          - "the suite's posture IS NOT FROZEN"
          - "the ClientProject.status == ACTIVE"
        side_effects:
          - "production_status := SCHEDULED"
          - "quality_status is NOT restored automatically; it stays QUARANTINED until the deviation-closure path moves it"
          - "the ClientProject.committed_demand_units and the suite's committed_minutes are recomputed"
          - "increments BatchOrder.version by 1 and refreshes updated_at"
        note: "Backward edge on the production axis."
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /batch-orders/{id}/cancel"
        actor: ProgramManager
        preconditions:
          - "production_status IN {SCHEDULED, SETUP, SUSPENDED}"
        side_effects:
          - "production_status := CANCELLED"
          - "every ComponentReservation of this batch with status == RESERVED is set to status := RELEASED, released_reason := 'BATCH_CANCELLED', and its ComponentLot.quantity_available is increased by quantity_reserved"
          - "because a lot's quantity_available rose above 0, any such lot with status == EXHAUSTED is set to status := RELEASED"
          - "the ClientProject.committed_demand_units decreases by component_demand_units and the suite's committed_minutes decreases by (planned_end - planned_start in minutes + changeover_minutes_applied)"
          - "quality_status := REJECTED when it was not already RELEASED or REJECTED"
          - "increments BatchOrder.version by 1 and refreshes updated_at"
      - from: SETUP
        to: CANCELLED
        trigger: "POST /batch-orders/{id}/cancel"
        actor: ProgramManager
        preconditions:
          - "production_status == SETUP"
        side_effects:
          - "identical to the SCHEDULED -> CANCELLED side-effect set"
          - "increments BatchOrder.version by 1 and refreshes updated_at"
      - from: SUSPENDED
        to: CANCELLED
        trigger: "POST /batch-orders/{id}/cancel"
        actor: ProgramManager
        preconditions:
          - "production_status == SUSPENDED"
        side_effects:
          - "identical to the SCHEDULED -> CANCELLED side-effect set, except that reservations were already RELEASED by the suspension so no further lot restoration occurs"
          - "increments BatchOrder.version by 1 and refreshes updated_at"

  # ---------------------------------------------------------------------------
  - entity: BatchOrder
    state_field: quality_status
    initial_state: PENDING
    terminal_states: [RELEASED, REJECTED]
    shape: cyclic
    note: "Second of two independent state axes on the same BatchOrder row."
    transitions:
      - from: PENDING
        to: IN_PROCESS_REVIEW
        trigger: "system event — production_status advances SETUP -> FILLING"
        actor: system
        preconditions:
          - "quality_status == PENDING"
        side_effects:
          - "quality_status := IN_PROCESS_REVIEW"
      - from: IN_PROCESS_REVIEW
        to: BR_REVIEW
        trigger: "POST /batch-record-reviews creating the review row for this batch"
        actor: QaReviewer
        preconditions:
          - "quality_status == IN_PROCESS_REVIEW"
          - "production_status == FILLED"
          - "this batch has at least one InProcessCheck row of EACH of check_type FILL_WEIGHT, CCI and VISUAL_INSPECTION"
          - "no InProcessCheck row of this batch has result == FAIL"
        side_effects:
          - "quality_status := BR_REVIEW"
          - "a BatchRecordReview row is created in IN_PROGRESS with reviewer_user_id := X-User-ID"
          - "open_findings_count on the new review := 1 for every Deviation of this batch with classification == MAJOR and status != CLOSED, summed"
          - "increments BatchOrder.version by 1 and refreshes updated_at"
      - from: BR_REVIEW
        to: QP_REVIEW
        trigger: "POST /batch-record-reviews/{id}/close"
        actor: QaReviewer
        preconditions:
          - "quality_status == BR_REVIEW"
          - "the review's status == COMPLETE_WITH_FINDINGS or IN_PROGRESS"
          - "the review's open_findings_count == 0"
        side_effects:
          - "quality_status := QP_REVIEW"
          - "final_releasable_units := batch_releasable_units variant FINAL_AT_QP_REVIEW"
          - "increments BatchOrder.version by 1 and refreshes updated_at"
      - from: QP_REVIEW
        to: BR_REVIEW
        trigger: "system event — a new EmSample with classification == ACTION drives the batch's suite posture to RESTRICTED"
        actor: system
        preconditions:
          - "quality_status == QP_REVIEW"
        side_effects:
          - "quality_status := BR_REVIEW"
          - "because this batch was demoted, its BatchRecordReview row is set to status := COMPLETE_WITH_FINDINGS and open_findings_count is increased by 1, and closed_at := null"
          - "final_releasable_units is left at its previously stamped value and is recomputed when the review closes again"
          - "increments BatchOrder.version by 1 and refreshes updated_at"
        note: "Backward edge on the quality axis; hop 3-4 of the ACTION-excursion cascade."
      - from: QP_REVIEW
        to: RELEASED
        trigger: "POST /batch-orders/{id}/qp-release with decision=RELEASE"
        actor: QualifiedPerson
        preconditions:
          - "quality_status == QP_REVIEW"
          - "production_status == FILLED"
          - "the batch's BatchRecordReview.status == CLOSED and open_findings_count == 0"
          - "no Deviation of this batch has classification == CRITICAL and status != CLOSED"
          - "X-User-ID != the BatchRecordReview.reviewer_user_id"
        side_effects:
          - "quality_status := RELEASED"
          - "release_fee_cents := qp_release_fee_cents"
          - "an immutable QpReleaseDecision row is appended with decision RELEASE, released_unit_count := final_releasable_units and fee_cents := release_fee_cents"
          - "increments BatchOrder.version by 1 and refreshes updated_at"
      - from: QP_REVIEW
        to: REJECTED
        trigger: "POST /batch-orders/{id}/qp-release with decision=REJECT"
        actor: QualifiedPerson
        preconditions:
          - "quality_status == QP_REVIEW"
          - "X-User-ID != the BatchRecordReview.reviewer_user_id"
        side_effects:
          - "quality_status := REJECTED"
          - "release_fee_cents stays null"
          - "an immutable QpReleaseDecision row is appended with decision REJECT, released_unit_count := 0 and fee_cents := 0"
          - "increments BatchOrder.version by 1 and refreshes updated_at"
      - from: QP_REVIEW
        to: QUARANTINED
        trigger: "POST /batch-orders/{id}/qp-release with decision=QUARANTINE"
        actor: QualifiedPerson
        preconditions:
          - "quality_status == QP_REVIEW"
          - "X-User-ID != the BatchRecordReview.reviewer_user_id"
        side_effects:
          - "quality_status := QUARANTINED"
          - "an immutable QpReleaseDecision row is appended with decision QUARANTINE, released_unit_count := 0 and fee_cents := 0"
          - "increments BatchOrder.version by 1 and refreshes updated_at"
      - from: IN_PROCESS_REVIEW
        to: QUARANTINED
        trigger: "system event — a Deviation on this batch is classified CRITICAL, or the batch's suite posture becomes FROZEN"
        actor: system
        preconditions:
          - "quality_status IS NOT IN {RELEASED, REJECTED}"
        side_effects:
          - "quality_status := QUARANTINED"
          - "increments BatchOrder.version by 1 and refreshes updated_at"
      - from: BR_REVIEW
        to: QUARANTINED
        trigger: "system event — a Deviation on this batch is classified CRITICAL, or the batch's suite posture becomes FROZEN"
        actor: system
        preconditions:
          - "quality_status == BR_REVIEW"
        side_effects:
          - "quality_status := QUARANTINED"
          - "the batch's BatchRecordReview row, when its status == CLOSED, is set to status := COMPLETE_WITH_FINDINGS with open_findings_count increased by 1 and closed_at := null"
          - "increments BatchOrder.version by 1 and refreshes updated_at"
      - from: QUARANTINED
        to: BR_REVIEW
        trigger: "system event — POST /deviations/{id}/decide-capa with outcome=APPROVED closes the last non-CLOSED Deviation of this batch"
        actor: system
        preconditions:
          - "quality_status == QUARANTINED"
          - "no Deviation of this batch has status != CLOSED"
          - "the batch's suite posture IS NOT FROZEN"
          - "production_status == FILLED"
        side_effects:
          - "quality_status := BR_REVIEW"
          - "increments BatchOrder.version by 1 and refreshes updated_at"
        note: "Backward edge closing the quarantine loop."

  # ---------------------------------------------------------------------------
  - entity: ComponentLot
    state_field: status
    initial_state: QUARANTINE
    terminal_states: [REJECTED, EXPIRED]
    shape: cyclic
    transitions:
      - from: QUARANTINE
        to: RELEASED
        trigger: "POST /component-lots/{id}/sterilization-validation with outcome=RELEASED"
        actor: MicrobiologyAnalyst
        preconditions:
          - "status == QUARANTINE"
          - "sterilization_expiry > the logical clock"
        side_effects:
          - "sterilization_validation_status := RELEASED"
          - "status := RELEASED"
          - "quantity_available := quantity_received"
          - "increments ComponentLot.version by 1 and refreshes updated_at"
      - from: QUARANTINE
        to: REJECTED
        trigger: "POST /component-lots/{id}/sterilization-validation with outcome=REJECTED"
        actor: MicrobiologyAnalyst
        preconditions:
          - "status == QUARANTINE"
        side_effects:
          - "sterilization_validation_status := REJECTED"
          - "status := REJECTED"
          - "quantity_available := 0"
          - "increments ComponentLot.version by 1 and refreshes updated_at"
      - from: RELEASED
        to: EXHAUSTED
        trigger: "system event — POST /component-reservations drives quantity_available to exactly 0"
        actor: system
        preconditions:
          - "status == RELEASED"
          - "quantity_available == 0 after the reservation is applied"
        side_effects:
          - "status := EXHAUSTED"
          - "increments ComponentLot.version by 1 and refreshes updated_at"
      - from: EXHAUSTED
        to: RELEASED
        trigger: "system event — a ComponentReservation against this lot transitions RESERVED -> RELEASED, restoring quantity_available above 0"
        actor: system
        preconditions:
          - "status == EXHAUSTED"
          - "quantity_available > 0 after the restoration"
        side_effects:
          - "status := RELEASED"
          - "increments ComponentLot.version by 1 and refreshes updated_at"
        note: "Backward edge; the terminal hop of the media-fill-failure and batch-cancellation cascades."
      - from: RELEASED
        to: EXPIRED
        trigger: "system event — POST /_clock/set_current_utc advances the logical clock to an instant >= sterilization_expiry"
        actor: system
        preconditions:
          - "status IN {RELEASED, EXHAUSTED}"
          - "sterilization_expiry <= the new logical clock"
        side_effects:
          - "status := EXPIRED"
          - "quantity_available := 0; existing RESERVED reservations are left untouched so the component-unit invariant still balances against quantity_received"
          - "increments ComponentLot.version by 1 and refreshes updated_at"
        note: "Processed in sterilization_expiry ASC order, tie-break created_at ASC."
      - from: EXHAUSTED
        to: EXPIRED
        trigger: "system event — POST /_clock/set_current_utc advances the logical clock to an instant >= sterilization_expiry"
        actor: system
        preconditions:
          - "status == EXHAUSTED"
          - "sterilization_expiry <= the new logical clock"
        side_effects:
          - "status := EXPIRED"
          - "increments ComponentLot.version by 1 and refreshes updated_at"

  # ---------------------------------------------------------------------------
  - entity: ComponentReservation
    state_field: status
    initial_state: RESERVED
    terminal_states: [CONSUMED, RELEASED]
    shape: branching
    transitions:
      - from: RESERVED
        to: CONSUMED
        trigger: "system event — the owning BatchOrder advances FILLING -> FILLED"
        actor: system
        preconditions:
          - "status == RESERVED"
          - "the owning BatchOrder.production_status == FILLING at the time of the call"
        side_effects:
          - "status := CONSUMED"
          - "ComponentLot.quantity_available unchanged"
          - "increments ComponentReservation.version by 1 and refreshes updated_at"
      - from: RESERVED
        to: RELEASED
        trigger: "system event — the owning BatchOrder is cancelled or suspended by a suite freeze or project hold"
        actor: system
        preconditions:
          - "status == RESERVED"
        side_effects:
          - "status := RELEASED, released_reason := 'BATCH_CANCELLED' or 'SUITE_FREEZE_SUSPENSION'"
          - "ComponentLot.quantity_available increases by quantity_reserved"
          - "increments ComponentReservation.version by 1 and refreshes updated_at"

  # ---------------------------------------------------------------------------
  - entity: EmSample
    state_field: investigation_status
    initial_state: OPEN
    terminal_states: [NOT_REQUIRED, CLOSED]
    shape: branching
    note: "The initial state is decided by the classification computed at creation: WITHIN_LIMIT rows are stamped NOT_REQUIRED (already terminal), ALERT and ACTION rows are stamped OPEN."
    transitions:
      - from: OPEN
        to: INVESTIGATING
        trigger: "POST /em-samples/{id}/investigate"
        actor: MicrobiologyAnalyst
        preconditions:
          - "investigation_status == OPEN"
        side_effects:
          - "investigation_status := INVESTIGATING"
          - "the suite's open_action_excursion_count is unchanged because INVESTIGATING is still not CLOSED"
          - "increments EmSample.version by 1 and refreshes updated_at"
      - from: INVESTIGATING
        to: CLOSED
        trigger: "POST /em-samples/{id}/close-investigation"
        actor: MicrobiologyAnalyst
        preconditions:
          - "investigation_status == INVESTIGATING"
          - "root_cause supplied is non-empty"
          - "when classification == ACTION: every Deviation whose em_sample_id == this sample has status == CLOSED"
        side_effects:
          - "root_cause := supplied value, investigation_status := CLOSED"
          - "the suite's open_action_excursion_count is recomputed, which recomputes the suite's posture and can return it to OPEN"
          - "increments EmSample.version by 1 and refreshes updated_at"

  # ---------------------------------------------------------------------------
  - entity: Deviation
    state_field: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    shape: cyclic
    transitions:
      - from: OPEN
        to: UNDER_INVESTIGATION
        trigger: "POST /deviations/{id}/classify"
        actor: QaReviewer
        preconditions:
          - "status == OPEN"
          - "classification supplied IN {MINOR, MAJOR, CRITICAL}"
        side_effects:
          - "classification := supplied value"
          - "risk_score := deviation_risk_score"
          - "the owning batch's ClientProject.open_deviation_risk_total increases by risk_score"
          - "status := UNDER_INVESTIGATION"
          - "when classification == CRITICAL: the owning BatchOrder's quality_status becomes QUARANTINED, which itself puts the ClientProject into ON_HOLD, which itself suspends every SCHEDULED or SETUP batch of that project"
          - "increments Deviation.version by 1 and refreshes updated_at"
      - from: UNDER_INVESTIGATION
        to: CAPA_PENDING
        trigger: "POST /deviations/{id}/submit-capa"
        actor: QaReviewer
        preconditions:
          - "status == UNDER_INVESTIGATION"
          - "capa_summary supplied is non-empty"
        side_effects:
          - "capa_summary := supplied value"
          - "status := CAPA_PENDING"
          - "increments Deviation.version by 1 and refreshes updated_at"
      - from: CAPA_PENDING
        to: UNDER_INVESTIGATION
        trigger: "POST /deviations/{id}/decide-capa with outcome=REJECTED"
        actor: QaReviewer
        preconditions:
          - "status == CAPA_PENDING"
          - "X-User-ID != opened_by_user_id"
        side_effects:
          - "capa_rejection_count increases by 1"
          - "risk_score := deviation_risk_score recomputed with the new capa_rejection_count"
          - "the ClientProject.open_deviation_risk_total is adjusted by exactly (new risk_score - old risk_score)"
          - "status := UNDER_INVESTIGATION"
          - "increments Deviation.version by 1 and refreshes updated_at"
        note: "Backward edge; the loop may run any number of times and each pass raises risk_score."
      - from: CAPA_PENDING
        to: CLOSED
        trigger: "POST /deviations/{id}/decide-capa with outcome=APPROVED"
        actor: QaReviewer
        preconditions:
          - "status == CAPA_PENDING"
          - "X-User-ID != opened_by_user_id"
        side_effects:
          - "status := CLOSED"
          - "the ClientProject.open_deviation_risk_total decreases by exactly this deviation's current risk_score, returning the ledger to its pre-classification value"
          - "when this was the last non-CLOSED Deviation of the batch and the batch's quality_status == QUARANTINED and production_status == FILLED and the suite posture IS NOT FROZEN, the batch's quality_status returns to BR_REVIEW"
          - "increments Deviation.version by 1 and refreshes updated_at"

  # ---------------------------------------------------------------------------
  - entity: BatchRecordReview
    state_field: status
    initial_state: IN_PROGRESS
    terminal_states: []
    shape: cyclic
    transitions:
      - from: IN_PROGRESS
        to: COMPLETE_WITH_FINDINGS
        trigger: "POST /batch-record-reviews/{id}/record-findings with open_findings_count > 0"
        actor: QaReviewer
        preconditions:
          - "status == IN_PROGRESS"
          - "open_findings_count supplied >= 0"
        side_effects:
          - "open_findings_count := supplied value"
          - "status := COMPLETE_WITH_FINDINGS"
          - "increments BatchRecordReview.version by 1 and refreshes updated_at"
      - from: COMPLETE_WITH_FINDINGS
        to: COMPLETE_WITH_FINDINGS
        trigger: "POST /batch-record-reviews/{id}/record-findings with any open_findings_count"
        actor: QaReviewer
        preconditions:
          - "status == COMPLETE_WITH_FINDINGS"
        side_effects:
          - "open_findings_count := supplied value"
          - "increments BatchRecordReview.version by 1 and refreshes updated_at"
        note: "Self-loop used to drive findings down to zero before closure."
      - from: IN_PROGRESS
        to: CLOSED
        trigger: "POST /batch-record-reviews/{id}/close"
        actor: QaReviewer
        preconditions:
          - "status == IN_PROGRESS"
          - "open_findings_count == 0"
          - "the owning BatchOrder.quality_status == BR_REVIEW"
        side_effects:
          - "status := CLOSED, closed_at := logical clock"
          - "the owning BatchOrder.quality_status advances BR_REVIEW -> QP_REVIEW and final_releasable_units is stamped"
          - "increments BatchRecordReview.version by 1 and refreshes updated_at"
      - from: COMPLETE_WITH_FINDINGS
        to: CLOSED
        trigger: "POST /batch-record-reviews/{id}/close"
        actor: QaReviewer
        preconditions:
          - "status == COMPLETE_WITH_FINDINGS"
          - "open_findings_count == 0"
          - "the owning BatchOrder.quality_status == BR_REVIEW"
        side_effects:
          - "status := CLOSED, closed_at := logical clock"
          - "the owning BatchOrder.quality_status advances BR_REVIEW -> QP_REVIEW and final_releasable_units is stamped"
          - "increments BatchRecordReview.version by 1 and refreshes updated_at"
      - from: CLOSED
        to: COMPLETE_WITH_FINDINGS
        trigger: "system event — the owning batch is demoted QP_REVIEW -> BR_REVIEW by an ACTION excursion, or quarantined from BR_REVIEW"
        actor: system
        preconditions:
          - "status == CLOSED"
        side_effects:
          - "status := COMPLETE_WITH_FINDINGS, open_findings_count increases by 1, closed_at := null"
          - "increments BatchRecordReview.version by 1 and refreshes updated_at"
        note: "Backward edge; hop 4 of the ACTION-excursion cascade."

  # ---------------------------------------------------------------------------
  - entity: AuditEngagement
    state_field: status
    initial_state: REQUESTED
    terminal_states: [HOSTED]
    shape: cyclic
    transitions:
      - from: REQUESTED
        to: HOSTED
        trigger: "POST /audit-engagements/{id}/host with outcome=HOSTED"
        actor: ProgramManager
        preconditions:
          - "status == REQUESTED"
          - "the ClientProject.status == ACTIVE"
          - "the ClientProject's primary_suite_id has posture != FROZEN"
        side_effects:
          - "finding_count := supplied value, hosted_at := logical clock, status := HOSTED"
          - "the ClientProject.last_client_audit_finding_count is recomputed"
          - "increments AuditEngagement.version by 1 and refreshes updated_at"
      - from: REQUESTED
        to: DEFERRED
        trigger: "POST /audit-engagements/{id}/host with outcome=DEFERRED"
        actor: ProgramManager
        preconditions:
          - "status == REQUESTED"
        side_effects:
          - "status := DEFERRED, hosted_at stays null, finding_count stays 0"
          - "increments AuditEngagement.version by 1 and refreshes updated_at"
      - from: DEFERRED
        to: HOSTED
        trigger: "POST /audit-engagements/{id}/host with outcome=HOSTED"
        actor: ProgramManager
        preconditions:
          - "status == DEFERRED"
          - "the ClientProject.status == ACTIVE"
          - "the ClientProject's primary_suite_id has posture != FROZEN"
        side_effects:
          - "finding_count := supplied value, hosted_at := logical clock, status := HOSTED"
          - "the ClientProject.last_client_audit_finding_count is recomputed"
          - "increments AuditEngagement.version by 1 and refreshes updated_at"
        note: "Backward-then-forward edge closing the deferral loop."

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================

concurrency_rules:
  - rule_id: batch-schedule-stale-suite
    parent_entity: FillingSuite
    write_endpoint: "POST /batch-orders"
    occ_field: "expected_suite_version"
    description: |
      Creating a BatchOrder against a FillingSuite whose version has advanced
      since the client last read it is rejected with a stale-version error. The
      product semantics legitimately allow a second batch to be scheduled into
      the same suite (different window, or a window that becomes legal after the
      first batch shifts the changeover baseline), so the second create is not
      excluded by any state precondition — the client's view of the suite's
      committed_minutes, posture and last_cleaned_molecule is simply out of
      date, and scheduling on that stale view would silently mis-derive
      changeover_minutes_applied.
    error_id: ERR_STALE_SUITE_VERSION
    http_status: 412

  - rule_id: reservation-create-stale-lot
    parent_entity: ComponentLot
    write_endpoint: "POST /component-reservations"
    occ_field: "expected_component_lot_version"
    description: |
      Creating a ComponentReservation against a ComponentLot whose version has
      advanced since the client last read it is rejected with a stale-version
      error. A second reservation against the same lot is legitimate product
      behaviour whenever quantity_available still covers it, so no state
      precondition excludes it; the rejection exists because the client computed
      its quantity_reserved from a quantity_available that has since changed.
    error_id: ERR_STALE_COMPONENT_LOT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================

calculations:

  # ---------------------------------------------------------------------------
  - name: em_sample_limits
    trigger: "POST /em-samples — stamps alert_limit and action_limit on the new row before classification"
    algorithm: threshold
    formula: |
      limits = EM_LIMITS[FillingSuite.grade][EmSample.sample_type]
      alert_limit  = limits.alert
      action_limit = limits.action
    input_set: "The FillingSuite referenced by EmSample.suite_id and the supplied sample_type. No other rows participate."
    constants:
      EM_LIMITS:
        A: { VIABLE_AIR: { alert: 1, action: 1 }, SURFACE: { alert: 1, action: 1 }, PERSONNEL_GLOVE: { alert: 1, action: 1 } }
        B: { VIABLE_AIR: { alert: 5, action: 10 }, SURFACE: { alert: 3, action: 5 }, PERSONNEL_GLOVE: { alert: 1, action: 5 } }
        C: { VIABLE_AIR: { alert: 50, action: 100 }, SURFACE: { alert: 15, action: 25 }, PERSONNEL_GLOVE: { alert: 5, action: 10 } }
    precision: "integer cfu counts, no rounding"

  # ---------------------------------------------------------------------------
  - name: em_sample_classification
    trigger: "POST /em-samples — immediately after em_sample_limits stamps the limits"
    algorithm: threshold
    formula: |
      # ACTION is evaluated FIRST. Grade A rows share alert == action == 1, so a
      # single colony is an ACTION excursion and never merely an ALERT.
      if cfu_count >= action_limit:      classification = "ACTION"
      elif cfu_count >= alert_limit:     classification = "ALERT"
      else:                              classification = "WITHIN_LIMIT"
      investigation_status = "NOT_REQUIRED" if classification == "WITHIN_LIMIT" else "OPEN"
    input_set: "Only the stamped alert_limit / action_limit of this row and the supplied cfu_count."
    precision: "integer comparison; both boundaries are inclusive (>=)"

  # ---------------------------------------------------------------------------
  - name: em_excursion_risk_index
    trigger: "POST /em-samples — after em_sample_classification, whenever classification != WITHIN_LIMIT"
    algorithm: weighted_scoring
    formula: |
      # Combinatorial mode (a): four inputs with non-linear interaction —
      # a ratio, a grade multiplier, a sample-type surcharge and a
      # state-conditional batch-exposure term, wrapped in nested min/max.
      if classification == "WITHIN_LIMIT":
          risk_index = 0
      else:
          ratio            = cfu_count / action_limit                       # exact rational
          grade_weight     = 3.0 if suite.grade == "A" else (2.0 if suite.grade == "B" else 1.0)
          type_surcharge   = 25 if sample_type == "PERSONNEL_GLOVE" else (10 if sample_type == "SURFACE" else 0)
          batch_exposure   = 20 if (batch_order_id is not null
                                    and BatchOrder[batch_order_id].production_status == "FILLING") else 0
          core             = round_half_up( min(100.0, max(0.0, ratio * 20 * grade_weight)) )   # to integer
          risk_index       = min(150, core + type_surcharge + batch_exposure)
    input_set: "The EmSample row itself, its FillingSuite (for grade), and — only when batch_order_id is non-null — that BatchOrder's production_status at the instant of the POST."
    constants:
      RISK_RATIO_SCALE: 20
      GRADE_WEIGHT: { A: 3.0, B: 2.0, C: 1.0 }
      TYPE_SURCHARGE: { VIABLE_AIR: 0, SURFACE: 10, PERSONNEL_GLOVE: 25 }
      BATCH_EXPOSURE_POINTS: 20
      CORE_CAP: 100
      RISK_CAP: 150
    precision: "the core term is rounded to an integer with round_half_up BEFORE the surcharges are added; the surcharges are never rounded"

  # ---------------------------------------------------------------------------
  - name: suite_posture
    trigger: "recomputed after every mutation that touches FillingSuite.aseptic_qualification_status, FillingSuite.cleaning_validation_status, any EmSample.investigation_status or classification in the suite, any PersonnelQualification in the suite, or the logical clock"
    algorithm: constraint_propagation
    formula: |
      # First matching branch wins: FROZEN > RESTRICTED > OPEN.
      if aseptic_qualification_status == "INVALIDATED" or cleaning_validation_status == "FAILED":
          posture = "FROZEN"
      elif (open_action_excursion_count >= 1
            or media_fill_valid_until is null
            or media_fill_valid_until < clock_now
            or qualified_operator_count < MIN_QUALIFIED_OPERATORS):
          posture = "RESTRICTED"
      else:
          posture = "OPEN"
      # where
      open_action_excursion_count = count(EmSample
                                          WHERE suite_id == this.id
                                            AND classification == "ACTION"
                                            AND investigation_status IN {OPEN, INVESTIGATING})
      qualified_operator_count    = count(PersonnelQualification
                                          WHERE suite_id == this.id
                                            AND status == "QUALIFIED"
                                            AND expires_on >= clock_now)
    input_set: "All EmSample rows of the suite with classification == ACTION and investigation_status IN {OPEN, INVESTIGATING}; all PersonnelQualification rows of the suite with status == QUALIFIED and expires_on >= clock_now. ALERT and WITHIN_LIMIT samples never restrict the suite."
    constants:
      MIN_QUALIFIED_OPERATORS: 2
    precision: "integer counts; the operator threshold is a strict less-than (< 2 restricts, exactly 2 does not)"

  # ---------------------------------------------------------------------------
  - name: changeover_minutes_applied
    trigger: "POST /batch-orders — stamped once at creation and frozen for the life of the row"
    algorithm: threshold
    formula: |
      # Fully pinned selector: filter, ranking, tie-break, empty fallback.
      candidates = BatchOrder rows WHERE suite_id == new.suite_id
                                    AND production_status IN {SCHEDULED, SETUP, FILLING, FILLED}
                                    AND planned_end <= new.planned_start
      prev = the single row of `candidates` with the greatest planned_end;
             tie-break: greatest created_at; second tie-break: none needed (created_at is unique per row)
      if candidates is empty:
          changeover_minutes_applied = SUITE_INITIAL_SETUP_MINUTES
      elif ClientProject[prev.client_project_id].molecule_name
             == ClientProject[new.client_project_id].molecule_name:
          changeover_minutes_applied = suite.changeover_minutes_same_product
      else:
          changeover_minutes_applied = suite.changeover_minutes_product_change
    input_set: "BatchOrder rows in the same suite whose production_status IN {SCHEDULED, SETUP, FILLING, FILLED} and whose planned_end <= the new batch's planned_start. SUSPENDED and CANCELLED batches are excluded."
    constants:
      SUITE_INITIAL_SETUP_MINUTES: 60
    precision: "integer minutes"

  # ---------------------------------------------------------------------------
  - name: component_demand_units
    trigger: "POST /batch-orders — stamped once at creation and frozen for the life of the row"
    algorithm: waterfall_allocation
    formula: |
      # Combinatorial mode (b): NESTED ROUNDING WHERE THE ORDER MATTERS.
      # PINNED ORDER: apply the pack-multiple ceiling PER COMPONENT LINE first,
      # then sum the rounded lines. The alternative order (sum the gross
      # requirements first, then apply a single pack-multiple ceiling) is
      # explicitly REJECTED and yields a different integer.
      lines = BILL_OF_COMPONENTS[ClientProject[client_project_id].dosage_form]
      total = 0
      for component_type in lines:                       # iterated in the order listed in BILL_OF_COMPONENTS
          gross_units = target_fill_units * (1 + OVERAGE_PCT[component_type])
          line_units  = ceil(gross_units / PACK_SIZE[component_type]) * PACK_SIZE[component_type]
          total      += line_units                       # ROUND PER LINE, THEN SUM
      component_demand_units = total
      # Worked check — target_fill_units = 10000, dosage_form = VIAL:
      #   VIAL    gross 10300.0 -> ceil(10300/480)=22  -> 22*480  = 10560
      #   STOPPER gross 10500.0 -> ceil(10500/1000)=11 -> 11*1000 = 11000
      #   component_demand_units = 21560
      #   (rejected sum-then-round order would give ceil(20800/1000)*1000 = 21000)
    input_set: "Only the new BatchOrder's target_fill_units and its ClientProject's dosage_form. No ComponentLot row participates — demand is a contractual figure, not an availability figure."
    constants:
      BILL_OF_COMPONENTS: { VIAL: [VIAL, STOPPER], PRESYRINGE: [SYRINGE, PLUNGER] }
      OVERAGE_PCT: { VIAL: 0.03, STOPPER: 0.05, SYRINGE: 0.03, PLUNGER: 0.05 }
      PACK_SIZE: { VIAL: 480, STOPPER: 1000, SYRINGE: 500, PLUNGER: 1000 }
    precision: "integer units; ceiling per line (never round-half-up), then integer summation"

  # ---------------------------------------------------------------------------
  - name: suite_committed_minutes
    trigger: "recomputed on POST /batch-orders, on any BatchOrder production_status transition into or out of {SCHEDULED, SETUP, FILLING, FILLED}, and on POST /batch-orders/{id}/cancel"
    algorithm: aggregation
    formula: |
      committed_minutes = sum over b in (BatchOrder WHERE b.suite_id == this.id
                                          AND b.production_status IN {SCHEDULED, SETUP, FILLING, FILLED})
                            of ( minutes_between(b.planned_start, b.planned_end)
                                 + b.changeover_minutes_applied )
      # Summation order: b.planned_start ASC, tie-break b.created_at ASC.
      # Integer minutes throughout, so the order cannot change the total; it is
      # pinned so the audit trail of the running total is reproducible.
    input_set: "BatchOrder rows of this suite with production_status IN {SCHEDULED, SETUP, FILLING, FILLED}, boundaries inclusive of both endpoint states. SUSPENDED and CANCELLED rows are excluded and release their minutes."
    precision: "integer minutes; minutes_between truncates nothing because all windows are whole minutes"

  # ---------------------------------------------------------------------------
  - name: in_process_check_result
    trigger: "POST /in-process-checks — stamps result and max_absolute_deviation_pct on the new row"
    algorithm: threshold
    formula: |
      if check_type == "FILL_WEIGHT":
          target = ClientProject[BatchOrder[batch_order_id].client_project_id].target_fill_weight_mg
          max_absolute_deviation_pct = round_half_up(
              max over w in measured_fill_weights_mg of abs(w - target) / target, 4 )
          if max_absolute_deviation_pct >  FILL_WEIGHT_REJECT_TOL:  result = "FAIL"
          elif max_absolute_deviation_pct >= FILL_WEIGHT_ALERT_TOL: result = "ALERT"
          else:                                                     result = "PASS"
      elif check_type == "CCI":
          max_absolute_deviation_pct = 0
          result = "FAIL" if reject_unit_count >= 1 else "PASS"      # zero-defect control
      else:  # VISUAL_INSPECTION
          max_absolute_deviation_pct = 0
          defect_rate = reject_unit_count / sample_size
          result = "FAIL" if defect_rate >= VISUAL_AQL_LIMIT else "PASS"
    input_set: "The single InProcessCheck row being created plus, for FILL_WEIGHT only, the ClientProject.target_fill_weight_mg reached through BatchOrder.client_project_id."
    constants:
      FILL_WEIGHT_ALERT_TOL: 0.0300
      FILL_WEIGHT_REJECT_TOL: 0.0500
      VISUAL_AQL_LIMIT: 0.0250
    precision: "max_absolute_deviation_pct at 4 decimal places, round_half_up, computed BEFORE the tolerance comparisons; the AQL comparison is exact rational (reject_unit_count / sample_size) and is NOT pre-rounded"

  # ---------------------------------------------------------------------------
  - name: media_fill_outcome
    trigger: "POST /media-fills/{id}/read"
    algorithm: threshold
    formula: |
      if units_filled < MEDIA_FILL_MIN_UNITS:
          reject the call with ERR_MEDIA_FILL_UNDERSIZED     # boundary: 5000 passes, 4999 does not
      if contaminated_units == 0:                            status = "PASSED"
      elif contaminated_units == 1:                          status = "INVESTIGATION_REQUIRED"
      else:                                                  status = "FAILED"
      # On PASSED (directly or by adjudication):
      #   suite.media_fill_valid_until = read_at + MEDIA_FILL_VALIDITY_DAYS days
    input_set: "Only this MediaFill row's units_filled (recorded at execute) and the contaminated_units supplied at read."
    constants:
      MEDIA_FILL_MIN_UNITS: 5000
      MEDIA_FILL_VALIDITY_DAYS: 183
    precision: "integer counts; the size gate is inclusive (>= 5000 is acceptable)"

  # ---------------------------------------------------------------------------
  - name: batch_releasable_units
    trigger: "the PROVISIONAL_AT_FILL variant on BatchOrder production_status FILLING -> FILLED; the FINAL_AT_QP_REVIEW variant on BatchOrder quality_status BR_REVIEW -> QP_REVIEW"
    algorithm: aggregation
    formula: |
      destructive_total = sum over c in (InProcessCheck WHERE c.batch_order_id == this.id)
                            of c.destructive_sample_units
      # Summation order: c.created_at ASC.

      # --- variant PROVISIONAL_AT_FILL (forward-looking) -------------------
      expected_reject_units        = ceil( filled_unit_count
                                           * ClientProject.historical_reject_rate_ppm / 1000000 )
      provisional_releasable_units = filled_unit_count - expected_reject_units - destructive_total

      # --- variant FINAL_AT_QP_REVIEW (chronological) -----------------------
      actual_reject_units      = sum over c in (InProcessCheck
                                                 WHERE c.batch_order_id == this.id
                                                   AND c.check_type == "VISUAL_INSPECTION")
                                   of c.reject_unit_count            # c.created_at ASC
      final_releasable_units   = filled_unit_count - actual_reject_units
                                                   - destructive_total
                                                   - quarantined_unit_count
      # Worked check — filled_unit_count 8500, historical_reject_rate_ppm 2500,
      # destructive_total 60 (FILL_WEIGHT 40 + CCI 20), VISUAL_INSPECTION
      # reject_unit_count 166, quarantined_unit_count 0:
      #   provisional = 8500 - ceil(21.25)=22 - 60 = 8418
      #   final       = 8500 - 166 - 60 - 0        = 8274
    input_set: "PROVISIONAL_AT_FILL reads only filled_unit_count, the project's historical_reject_rate_ppm, and destructive_sample_units of every InProcessCheck already recorded at the FILLED transition. FINAL_AT_QP_REVIEW ignores historical_reject_rate_ppm entirely and reads reject_unit_count of VISUAL_INSPECTION checks plus quarantined_unit_count."
    precision: "integer units; the provisional expected-reject term uses ceiling (never round_half_up)"
    variants:
      - name: PROVISIONAL_AT_FILL
        when: "stamped into provisional_releasable_units when production_status advances FILLING -> FILLED, before any visual inspection result exists"
        difference: "Projects rejects from the sponsor's historical_reject_rate_ppm and ignores quarantined_unit_count entirely, so it is systematically optimistic whenever the actual visual reject rate exceeds the historical figure."
      - name: FINAL_AT_QP_REVIEW
        when: "stamped into final_releasable_units when quality_status advances BR_REVIEW -> QP_REVIEW"
        difference: "Replays the actually recorded VISUAL_INSPECTION reject counts in created_at ASC order and additionally subtracts quarantined_unit_count; historical_reject_rate_ppm is not consulted. For identical stored data the two variants differ (8418 vs 8274 in the worked check) and provisional_releasable_units is never overwritten."

  # ---------------------------------------------------------------------------
  - name: qp_release_fee_cents
    trigger: "POST /batch-orders/{id}/qp-release with decision=RELEASE"
    algorithm: tiered_pricing
    formula: |
      # Combinatorial mode (c): the discount tier LOOKS circular because the
      # tier depends on a total and the total depends on the discount. The
      # evaluation order below is PINNED and the tier is selected exactly once,
      # from the step-3 pre-discount total, and is NEVER re-derived from the
      # step-5 result.
      step 1: subtotal_cents            = BASE_RELEASE_FEE_CENTS
                                          + final_releasable_units * PER_UNIT_FEE_CENTS
      step 2: deviation_surcharge_cents = round_half_up( subtotal_cents
                                          * DEVIATION_SURCHARGE_PCT[max_open_deviation_class] )
      step 3: pre_discount_total_cents  = subtotal_cents + deviation_surcharge_cents
      step 4: volume_discount_pct       = the first matching VOLUME_DISCOUNT_TIERS row,
                                          evaluated against pre_discount_total_cents
      step 5: release_fee_cents         = pre_discount_total_cents
                                          - round_half_up( pre_discount_total_cents
                                                           * volume_discount_pct )
      # where
      max_open_deviation_class = the greatest classification, ranked
          CRITICAL > MAJOR > MINOR, over Deviation rows WHERE batch_order_id == this.id
          AND status != CLOSED AND classification is not null; "NONE" when that set is empty.
      # Worked check — final_releasable_units 8274, one open MINOR deviation:
      #   subtotal            = 150000 + 8274*40 = 480960
      #   surcharge           = round_half_up(24048.0) = 24048
      #   pre_discount_total  = 505008   -> tier 0.03 (>= 500000)
      #   discount            = round_half_up(15150.24) = 15150
      #   release_fee_cents   = 489858
      #   (re-deriving the tier from 489858 would select 0.00 and yield 505008 —
      #    forbidden)
    input_set: "final_releasable_units of this batch and the non-CLOSED, classified Deviation rows of this batch. CRITICAL cannot occur here because it blocks the release transition outright."
    constants:
      BASE_RELEASE_FEE_CENTS: 150000
      PER_UNIT_FEE_CENTS: 40
      DEVIATION_SURCHARGE_PCT: { NONE: 0.00, MINOR: 0.05, MAJOR: 0.12, CRITICAL: 0.25 }
      VOLUME_DISCOUNT_TIERS:
        - { min_pre_discount_total_cents: 2000000, pct: 0.10 }
        - { min_pre_discount_total_cents: 1000000, pct: 0.06 }
        - { min_pre_discount_total_cents: 500000,  pct: 0.03 }
        - { min_pre_discount_total_cents: 0,       pct: 0.00 }
    precision: "integer cents; round_half_up applied independently at step 2 and step 5, never once over the composed expression"

  # ---------------------------------------------------------------------------
  - name: deviation_risk_score
    trigger: "POST /deviations/{id}/classify and every POST /deviations/{id}/decide-capa with outcome=REJECTED"
    algorithm: weighted_scoring
    formula: |
      base                  = DEVIATION_BASE_POINTS[classification]
      escalation_multiplier = 1 + ESCALATION_STEP * capa_rejection_count
      em_linkage_bonus      = EM_LINKAGE_BONUS if (em_sample_id is not null
                                and EmSample[em_sample_id].classification == "ACTION") else 0
      risk_score            = min( RISK_SCORE_CAP,
                                   round_half_up(base * escalation_multiplier) + em_linkage_bonus )
      # ClientProject.open_deviation_risk_total is adjusted by exactly
      # (new risk_score - previous risk_score) on every recomputation, and by
      # exactly (- current risk_score) on closure.
      # Worked check — MAJOR, capa_rejection_count 1, linked ACTION sample:
      #   round_half_up(20 * 1.5) = 30, + 15 = 45
    input_set: "The single Deviation row plus, when em_sample_id is non-null, that EmSample's classification. No other deviation participates."
    constants:
      DEVIATION_BASE_POINTS: { MINOR: 5, MAJOR: 20, CRITICAL: 50 }
      ESCALATION_STEP: 0.5
      EM_LINKAGE_BONUS: 15
      RISK_SCORE_CAP: 120
    precision: "the multiplied base is rounded to an integer with round_half_up BEFORE the linkage bonus is added; the cap is applied last"

  # ---------------------------------------------------------------------------
  - name: project_readiness_score
    trigger: "GET /client-projects/{id}/readiness-assessment (read-only; the variant is chosen by the required `variant` query parameter)"
    algorithm: weighted_scoring
    formula: |
      suite = FillingSuite[ClientProject.primary_suite_id]

      # --- variant INTAKE_FORECAST (forward-looking) -----------------------
      tech      = 30 if tech_transfer_stage IN {ENGINEERING_RUN, COMPLETE} else (0 if tech_transfer_stage == "NOT_STARTED" else 15)
      analytical= 25 if analytical_method_transfer_status IN {IN_TRANSFER, VALIDATED} else 0
      aseptic   = 25 if suite.aseptic_qualification_status == "QUALIFIED" else 0   # media_fill_valid_until IGNORED
      op_count  = count(PersonnelQualification WHERE suite_id == suite.id
                                                 AND status IN {PENDING, QUALIFIED, LAPSED})  # expires_on IGNORED
      operators = 20 if op_count >= MIN_QUALIFIED_OPERATORS
                     else round_half_up(20 * op_count / MIN_QUALIFIED_OPERATORS)
      readiness_score = tech + analytical + aseptic + operators

      # --- variant GMP_AUDIT (chronological, effective-as-of-clock) ---------
      tech      = { NOT_STARTED: 0, GAP_ASSESSMENT: 0, ENGINEERING_RUN: 15, COMPLETE: 30 }[tech_transfer_stage]
      analytical= { NOT_STARTED: 0, IN_TRANSFER: 12, VALIDATED: 25 }[analytical_method_transfer_status]
      if suite.aseptic_qualification_status != "QUALIFIED":        aseptic = 0
      elif suite.media_fill_valid_until is null
           or suite.media_fill_valid_until < clock_now:            aseptic = 10
      else:                                                        aseptic = 25
      op_count  = count(PersonnelQualification WHERE suite_id == suite.id
                                                 AND status == "QUALIFIED"
                                                 AND expires_on >= clock_now)
      operators = 20 if op_count >= MIN_QUALIFIED_OPERATORS
                     else round_half_up(20 * op_count / MIN_QUALIFIED_OPERATORS)
      readiness_score = tech + analytical + aseptic + operators
      # Worked check — tech_transfer_stage ENGINEERING_RUN,
      # analytical_method_transfer_status IN_TRANSFER, suite QUALIFIED with
      # media_fill_valid_until in the past, one effective QUALIFIED operator,
      # one LAPSED operator, one PENDING operator:
      #   INTAKE_FORECAST = 30 + 25 + 25 + 20 = 100
      #   GMP_AUDIT       = 15 + 12 + 10 + round_half_up(20*1/2)=10 = 47
    input_set: "The ClientProject row, the FillingSuite named by primary_suite_id, and every PersonnelQualification of that suite. BatchOrder and Deviation rows do NOT participate."
    constants:
      MIN_QUALIFIED_OPERATORS: 2
      WEIGHT_TECH_TRANSFER: 30
      WEIGHT_ANALYTICAL: 25
      WEIGHT_ASEPTIC: 25
      WEIGHT_OPERATORS: 20
    precision: "integer score in 0..100; the operator term is the only rounded term (round_half_up to integer) and is rounded before summation"
    variants:
      - name: INTAKE_FORECAST
        when: "requested with variant=INTAKE_FORECAST — the commercial view used during project intake"
        difference: "Grants full credit for any in-flight artifact (ENGINEERING_RUN scores the full 30, IN_TRANSFER the full 25), ignores media_fill_valid_until, and counts PENDING and LAPSED operator qualifications toward the roster."
      - name: GMP_AUDIT
        when: "requested with variant=GMP_AUDIT — the inspection-readiness view"
        difference: "Grants partial credit per an explicit stage table, scores an expired aseptic qualification at 10 instead of 25, and counts only operators whose status == QUALIFIED and whose expires_on >= the logical clock. For identical stored data the two variants differ (100 vs 47 in the worked check)."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; lowest number wins)
# =============================================================================

validations:

  # --- authentication ---------------------------------------------------------
  - priority: 10
    category: auth
    check: "Both X-User-Role and X-User-ID request headers are present and non-empty."
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: all
  - priority: 12
    category: auth
    check: "X-User-Role is one of the six roles declared in §1.7."
    error_id: ERR_UNKNOWN_ROLE
    http_status: 401
    applies_to: all

  # --- authorization ----------------------------------------------------------
  - priority: 20
    category: auth
    check: "The role in X-User-Role appears in the target endpoint's roles list."
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all
  - priority: 22
    category: auth
    check: "When X-User-Role == ClientRepresentative, X-User-ID equals the ClientProject.id reached by the request (directly for /client-projects/{id} paths, or via client_project_id for /audit-engagements and via BatchOrder.client_project_id for /batch-orders/{id})."
    error_id: ERR_PROJECT_ACCESS_DENIED
    http_status: 403
    applies_to: "GET /client-projects/{id}, GET /client-projects/{id}/readiness-assessment, GET /client-projects/{id}/audit-engagements, GET /batch-orders/{id}, GET /batch-orders/{id}/unit-accounting, POST /audit-engagements"

  # --- existence --------------------------------------------------------------
  - priority: 30
    category: existence
    check: "Every id in the request path resolves to an existing row, validated left-to-right."
    error_id: "ERR_CLIENT_PROJECT_NOT_FOUND | ERR_FILLING_SUITE_NOT_FOUND | ERR_MEDIA_FILL_NOT_FOUND | ERR_QUALIFICATION_NOT_FOUND | ERR_BATCH_ORDER_NOT_FOUND | ERR_COMPONENT_LOT_NOT_FOUND | ERR_RESERVATION_NOT_FOUND | ERR_EM_SAMPLE_NOT_FOUND | ERR_DEVIATION_NOT_FOUND | ERR_BR_REVIEW_NOT_FOUND | ERR_AUDIT_ENGAGEMENT_NOT_FOUND | ERR_IN_PROCESS_CHECK_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id"

  # --- request shape ----------------------------------------------------------
  - priority: 32
    category: business_constraint
    check: "Every field marked required in the endpoint's input is present and of the declared JSON type; numeric fields respect their declared range; array fields are arrays."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints"
  - priority: 34
    category: business_constraint
    check: "Every enum-typed input field carries a value from that field's declared constraint set."
    error_id: ERR_INVALID_ENUM_VALUE
    http_status: 422
    applies_to: "all POST endpoints with enum inputs, plus GET /client-projects/{id}/readiness-assessment and GET /batch-orders/{id}/unit-accounting"
  - priority: 36
    category: business_constraint
    check: "limit is an integer in 1..100 and offset is an integer >= 0."
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list GET endpoints"

  # --- referential existence of body foreign keys -----------------------------
  - priority: 38
    category: business_referential
    check: "Every foreign key supplied in the request body resolves to an existing row (primary_suite_id, suite_id, client_project_id, media_fill_id, batch_order_id, component_lot_id, em_sample_id, lead_operator_qualification_id)."
    error_id: "ERR_FILLING_SUITE_NOT_FOUND | ERR_CLIENT_PROJECT_NOT_FOUND | ERR_MEDIA_FILL_NOT_FOUND | ERR_BATCH_ORDER_NOT_FOUND | ERR_COMPONENT_LOT_NOT_FOUND | ERR_EM_SAMPLE_NOT_FOUND | ERR_QUALIFICATION_NOT_FOUND"
    http_status: 404
    applies_to: "POST /client-projects, POST /media-fills, POST /personnel-qualifications, POST /batch-orders, POST /component-lots, POST /component-reservations, POST /in-process-checks, POST /em-samples, POST /deviations, POST /batch-record-reviews, POST /audit-engagements"

  # --- optimistic concurrency -------------------------------------------------
  - priority: 40
    category: state
    check: "expected_suite_version equals the current FillingSuite.version."
    error_id: ERR_STALE_SUITE_VERSION
    http_status: 412
    applies_to: "POST /batch-orders"
  - priority: 41
    category: state
    check: "expected_component_lot_version equals the current ComponentLot.version."
    error_id: ERR_STALE_COMPONENT_LOT_VERSION
    http_status: 412
    applies_to: "POST /component-reservations"

  # --- state preconditions ----------------------------------------------------
  - priority: 43
    category: business_referential
    check: "The batch's BatchRecordReview exists, its status == CLOSED and its open_findings_count == 0 at Qualified-Person release. Deliberately ordered BEFORE the quality-axis state rule at priority 45: a Qualified Person who signs against a batch whose batch record has not been reviewed and closed must be told that, not merely that the state machine disagrees. A batch whose review IS closed and clean therefore still yields ERR_BATCH_QUALITY_STATE_INVALID at 45 when its quality_status is already terminal."
    error_id: ERR_BR_REVIEW_NOT_CLOSED
    http_status: 409
    applies_to: "POST /batch-orders/{id}/qp-release"
  - priority: 44
    category: state
    check: "The target BatchOrder.production_status is a declared `from:` state of the requested production transition."
    error_id: ERR_BATCH_PRODUCTION_STATE_INVALID
    http_status: 409
    applies_to: "POST /batch-orders/{id}/setup, POST /batch-orders/{id}/start-fill, POST /batch-orders/{id}/complete-fill, POST /batch-orders/{id}/cancel"
  - priority: 45
    category: state
    check: "The target BatchOrder.quality_status is a declared `from:` state of the requested quality transition."
    error_id: ERR_BATCH_QUALITY_STATE_INVALID
    http_status: 409
    applies_to: "POST /batch-record-reviews, POST /batch-record-reviews/{id}/close, POST /batch-orders/{id}/qp-release"
  - priority: 46
    category: state
    check: "The target MediaFill.status is a declared `from:` state of the requested transition."
    error_id: ERR_MEDIA_FILL_STATE_INVALID
    http_status: 409
    applies_to: "POST /media-fills/{id}/execute, POST /media-fills/{id}/read, POST /media-fills/{id}/adjudicate"
  - priority: 47
    category: state
    check: "The target PersonnelQualification.status is a declared `from:` state of the requested transition."
    error_id: ERR_QUALIFICATION_STATE_INVALID
    http_status: 409
    applies_to: "POST /personnel-qualifications/{id}/qualify, POST /personnel-qualifications/{id}/revoke"
  - priority: 48
    category: state
    check: "The target ComponentLot.status is a declared `from:` state of the requested transition, and a lot may only be reserved while status == RELEASED."
    error_id: ERR_COMPONENT_LOT_STATE_INVALID
    http_status: 409
    applies_to: "POST /component-lots/{id}/sterilization-validation, POST /component-reservations"
  - priority: 49
    category: state
    check: "The target EmSample.investigation_status is a declared `from:` state of the requested transition."
    error_id: ERR_EXCURSION_STATE_INVALID
    http_status: 409
    applies_to: "POST /em-samples/{id}/investigate, POST /em-samples/{id}/close-investigation"
  - priority: 50
    category: state
    check: "The target Deviation.status is a declared `from:` state of the requested transition."
    error_id: ERR_DEVIATION_STATE_INVALID
    http_status: 409
    applies_to: "POST /deviations/{id}/classify, POST /deviations/{id}/submit-capa, POST /deviations/{id}/decide-capa"
  - priority: 51
    category: state
    check: "The target BatchRecordReview.status is a declared `from:` state of the requested transition, and close requires open_findings_count == 0."
    error_id: ERR_BR_REVIEW_STATE_INVALID
    http_status: 409
    applies_to: "POST /batch-record-reviews/{id}/record-findings, POST /batch-record-reviews/{id}/close"
  - priority: 52
    category: state
    check: "The target AuditEngagement.status is a declared `from:` state of the requested transition."
    error_id: ERR_AUDIT_ENGAGEMENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /audit-engagements/{id}/host"
  - priority: 53
    category: state
    check: "The ClientProject.status permits the operation: scheduling, setup and audit hosting require ACTIVE; release-hold requires ON_HOLD; advance-tech-transfer requires INTAKE."
    error_id: ERR_PROJECT_STATE_INVALID
    http_status: 409
    applies_to: "POST /client-projects/{id}/advance-tech-transfer, POST /client-projects/{id}/release-hold, POST /batch-orders, POST /batch-orders/{id}/setup, POST /audit-engagements/{id}/host"

  # --- business rules: safety / GMP compliance --------------------------------
  - priority: 60
    category: business_safety
    check: "The FillingSuite.media_fill_valid_until is non-null and >= the batch's planned_end (scheduling) or >= the logical clock (filling): a batch may not occupy a suite whose aseptic process simulation lapses inside its window."
    error_id: ERR_MEDIA_FILL_QUALIFICATION_EXPIRED
    http_status: 409
    applies_to: "POST /batch-orders, POST /batch-orders/{id}/start-fill"
  - priority: 61
    category: business_safety
    check: "The FillingSuite.posture == OPEN when starting a fill, and != FROZEN when moving a batch into SETUP or hosting an audit."
    error_id: ERR_SUITE_NOT_OPEN
    http_status: 409
    applies_to: "POST /batch-orders/{id}/start-fill, POST /batch-orders/{id}/setup, POST /audit-engagements/{id}/host"
  - priority: 62
    category: business_safety
    check: "Cross-contamination control: the suite's cleaning_validation_status == VALIDATED and last_cleaned_molecule equals the batch's ClientProject.molecule_name."
    error_id: ERR_CLEANING_VALIDATION_REQUIRED
    http_status: 409
    applies_to: "POST /batch-orders/{id}/start-fill"
  - priority: 63
    category: business_safety
    check: "The PersonnelQualification referenced by lead_operator_qualification_id has status == QUALIFIED and expires_on >= the logical clock, and its suite_id equals the batch's suite_id."
    error_id: ERR_OPERATOR_NOT_QUALIFIED
    http_status: 409
    applies_to: "POST /batch-orders, POST /batch-orders/{id}/start-fill"
  - priority: 64
    category: business_safety
    check: "A PersonnelQualification of qualification_type ASEPTIC_INTERVENTION may only be qualified when media_fill_id is non-null, the referenced MediaFill.status == PASSED, and operator_name is a member of that MediaFill.participating_operator_names."
    error_id: ERR_MEDIA_FILL_NOT_PASSED
    http_status: 409
    applies_to: "POST /personnel-qualifications/{id}/qualify"
  - priority: 65
    category: business_safety
    check: "A media fill may only be read out when units_filled >= MEDIA_FILL_MIN_UNITS (5000); exactly 5000 is acceptable."
    error_id: ERR_MEDIA_FILL_UNDERSIZED
    http_status: 422
    applies_to: "POST /media-fills/{id}/execute, POST /media-fills/{id}/read"
  - priority: 66
    category: business_safety
    check: "The batch has at least one InProcessCheck row of EACH of check_type FILL_WEIGHT, CCI and VISUAL_INSPECTION before a batch record review may be opened."
    error_id: ERR_REQUIRED_IPC_MISSING
    http_status: 422
    applies_to: "POST /batch-record-reviews"
  - priority: 67
    category: business_safety
    check: "No InProcessCheck row of the batch has result == FAIL when opening a batch record review."
    error_id: ERR_IPC_FAILED
    http_status: 409
    applies_to: "POST /batch-record-reviews"
  - priority: 68
    category: business_safety
    check: "No Deviation of the batch has classification == CRITICAL with status != CLOSED at Qualified-Person release; and no Deviation on any BatchOrder of the project has classification == CRITICAL with status != CLOSED when releasing a project hold."
    error_id: ERR_OPEN_CRITICAL_DEVIATION
    http_status: 409
    applies_to: "POST /batch-orders/{id}/qp-release, POST /client-projects/{id}/release-hold"
  - priority: 69
    category: business_safety
    check: "The ComponentLot has sterilization_validation_status == RELEASED, its sterilization_expiry > the logical clock, AND its sterilization_expiry >= the owning BatchOrder.planned_end — a sterilised component must remain within its sterility hold time through the whole planned fill window."
    error_id: ERR_COMPONENT_STERILIZATION_INVALID
    http_status: 409
    applies_to: "POST /component-reservations"
  - priority: 70
    category: business_safety
    check: "Segregation of duties: the X-User-ID signing a Qualified-Person release differs from the BatchRecordReview.reviewer_user_id of that batch, and the X-User-ID deciding a CAPA differs from the Deviation.opened_by_user_id."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /batch-orders/{id}/qp-release, POST /deviations/{id}/decide-capa"

  # --- business rules: temporal constraints -----------------------------------
  - priority: 75
    category: business_temporal
    check: "planned_end is strictly after planned_start, and expires_on / requested_window_start are strictly after the logical clock where the field declares it."
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /batch-orders, POST /personnel-qualifications, POST /audit-engagements"
  - priority: 76
    category: business_temporal
    check: |
      Suite occupancy uses HALF-OPEN intervals [planned_start, planned_end) EXTENDED BY a
      directional changeover buffer. The new batch is rejected when there exists a live batch x
      in the same suite (production_status IN {SCHEDULED, SETUP, FILLING, FILLED}) with
        new.planned_start < x.planned_end + buffer(x, new)  AND
        x.planned_start   < new.planned_end + buffer(new, x)
      where buffer(a, b) = suite.changeover_minutes_same_product when the two batches' projects
      share molecule_name, else suite.changeover_minutes_product_change. Both comparisons are
      STRICT, so a new batch starting exactly at x.planned_end + buffer is ACCEPTED.
    error_id: ERR_SUITE_CHANGEOVER_CONFLICT
    http_status: 409
    applies_to: "POST /batch-orders"
  - priority: 77
    category: business_temporal
    check: |
      Lead-operator occupancy uses CLOSED intervals [planned_start, planned_end] with NO buffer,
      and spans every suite. The operator resource is resolved as
      PersonnelQualification[BatchOrder.lead_operator_qualification_id].operator_name. The new
      batch is rejected when there exists a live batch x (production_status IN {SCHEDULED, SETUP,
      FILLING, FILLED}) whose resolved operator_name equals the new batch's, with
        new.planned_start <= x.planned_end  AND  x.planned_start <= new.planned_end
      Both comparisons are NON-STRICT, so merely TOUCHING endpoints conflict — the opposite
      adjacency treatment from the suite rule above.
    error_id: ERR_OPERATOR_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /batch-orders"

  # --- business rules: referential coherence ----------------------------------
  - priority: 80
    category: business_referential
    check: "The ComponentLot.client_project_id equals the BatchOrder's client_project_id, and the ComponentLot.component_type is a member of BILL_OF_COMPONENTS[project.dosage_form]."
    error_id: ERR_COMPONENT_LOT_PROJECT_MISMATCH
    http_status: 409
    applies_to: "POST /component-reservations"
  - priority: 81
    category: business_referential
    check: "When an EmSample supplies batch_order_id, that BatchOrder.suite_id equals the sample's suite_id."
    error_id: ERR_EM_SAMPLE_SUITE_MISMATCH
    http_status: 409
    applies_to: "POST /em-samples"
  - priority: 83
    category: business_referential
    check: "The sum of quantity_reserved over the batch's ComponentReservation rows with status == RESERVED is >= component_demand_units before a fill may start."
    error_id: ERR_COMPONENTS_NOT_RESERVED
    http_status: 409
    applies_to: "POST /batch-orders/{id}/start-fill"

  # --- business rules: uniqueness / capacity constraints ----------------------
  - priority: 85
    category: business_constraint
    check: "batch_number is unique within a client_project_id."
    error_id: ERR_DUPLICATE_BATCH_NUMBER
    http_status: 409
    applies_to: "POST /batch-orders"
  - priority: 86
    category: business_constraint
    check: "lot_code is unique within a component_type."
    error_id: ERR_DUPLICATE_LOT_CODE
    http_status: 409
    applies_to: "POST /component-lots"
  - priority: 87
    category: business_constraint
    check: "suite_code is unique across all FillingSuite rows."
    error_id: ERR_DUPLICATE_SUITE_CODE
    http_status: 409
    applies_to: "POST /filling-suites"
  - priority: 88
    category: business_constraint
    check: "At most one BatchRecordReview row exists per batch_order_id."
    error_id: ERR_BR_REVIEW_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /batch-record-reviews"
  - priority: 89
    category: business_constraint
    check: "quantity_reserved is <= ComponentLot.quantity_available."
    error_id: ERR_COMPONENT_LOT_INSUFFICIENT
    http_status: 409
    applies_to: "POST /component-reservations"
  - priority: 90
    category: business_constraint
    check: "measured_fill_weights_mg is non-empty for check_type FILL_WEIGHT and empty for every other check_type; reject_unit_count <= sample_size."
    error_id: ERR_IPC_PAYLOAD_INCONSISTENT
    http_status: 422
    applies_to: "POST /in-process-checks"

  # --- business rules: fiscal / capacity ceilings (LAST) ----------------------
  - priority: 95
    category: business_fiscal
    check: "ClientProject.committed_demand_units + the new batch's component_demand_units <= ClientProject.reserved_unit_budget."
    error_id: ERR_PROJECT_UNIT_BUDGET_EXCEEDED
    http_status: 402
    applies_to: "POST /batch-orders"
  - priority: 96
    category: business_fiscal
    check: "FillingSuite.committed_minutes + minutes_between(planned_start, planned_end) + changeover_minutes_applied <= FillingSuite.max_committed_minutes."
    error_id: ERR_SUITE_CAPACITY_EXCEEDED
    http_status: 402
    applies_to: "POST /batch-orders"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================

endpoints:

  # --- ClientProject ----------------------------------------------------------
  - method: POST
    path: "/client-projects"
    description: "Client project intake: registers the sponsor, molecule, presentation, primary suite and the two contractual figures (historical_reject_rate_ppm, reserved_unit_budget)."
    roles: [ProgramManager]
    code: 201
    input: ["client_name", "molecule_name", "dosage_form", "primary_suite_id", "target_fill_weight_mg", "historical_reject_rate_ppm", "reserved_unit_budget"]
    output: ClientProject
    side_effects:
      - "status := INTAKE, tech_transfer_stage := NOT_STARTED, analytical_method_transfer_status := NOT_STARTED"
      - "committed_demand_units := 0, open_deviation_risk_total := 0, last_client_audit_finding_count := 0"
  - method: GET
    path: "/client-projects/{id}"
    description: "Read one client project including its two derived ledgers."
    roles: [ProgramManager, QaReviewer, QualifiedPerson, MicrobiologyAnalyst, ProductionSupervisor, ClientRepresentative]
    code: 200
    input: []
    output: ClientProject
    side_effects: []
  - method: GET
    path: "/client-projects"
    description: "Paginated, filterable list of client projects."
    roles: [ProgramManager, QaReviewer, QualifiedPerson]
    code: 200
    input: ["status?", "primary_suite_id?", "limit?", "offset?"]
    output: ClientProject[]
    side_effects: []
  - method: POST
    path: "/client-projects/{id}/advance-tech-transfer"
    description: "Advance technology transfer by exactly one stage and set the analytical method transfer status; reaching COMPLETE + VALIDATED flips the project INTAKE -> ACTIVE."
    roles: [ProgramManager]
    code: 200
    input: ["to_stage", "analytical_method_transfer_status"]
    output: ClientProject
    side_effects:
      - "tech_transfer_stage := to_stage, analytical_method_transfer_status := supplied value"
      - "status := ACTIVE when to_stage == COMPLETE and analytical_method_transfer_status == VALIDATED"
      - "increments ClientProject.version by 1"
  - method: POST
    path: "/client-projects/{id}/release-hold"
    description: "Return an ON_HOLD project to ACTIVE once no CRITICAL deviation remains open, restoring its SUSPENDED batches to SCHEDULED."
    roles: [QaReviewer]
    code: 200
    input: ["release_rationale"]
    output: ClientProject
    side_effects:
      - "status := ACTIVE"
      - "every SUSPENDED BatchOrder of this project whose suite posture != FROZEN returns to production_status SCHEDULED"
      - "the suite's committed_minutes and the project's committed_demand_units are recomputed"
      - "increments ClientProject.version by 1"
  - method: GET
    path: "/client-projects/{id}/readiness-assessment"
    description: "Computed read returning project_readiness_score under the requested variant (INTAKE_FORECAST or GMP_AUDIT) together with each weighted component."
    roles: [ProgramManager, QaReviewer, QualifiedPerson, ClientRepresentative]
    code: 200
    input: ["variant"]
    output: "{ client_project_id: string, variant: string, readiness_score: integer, tech_points: integer, analytical_points: integer, aseptic_points: integer, operator_points: integer, counted_operator_count: integer, assessed_at: datetime }"
    side_effects: []
  - method: GET
    path: "/client-projects/{id}/audit-engagements"
    description: "Sub-resource list of the audit engagements raised against this project, ordered created_at ASC."
    roles: [ProgramManager, QaReviewer, ClientRepresentative]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: AuditEngagement[]
    side_effects: []

  # --- FillingSuite -----------------------------------------------------------
  - method: POST
    path: "/filling-suites"
    description: "Register a shared aseptic filling suite with its grade, changeover buffers and occupancy ceiling."
    roles: [ProgramManager]
    code: 201
    input: ["suite_code", "grade", "changeover_minutes_same_product", "changeover_minutes_product_change", "max_committed_minutes"]
    output: FillingSuite
    side_effects:
      - "aseptic_qualification_status := NOT_QUALIFIED, cleaning_validation_status := NOT_VALIDATED"
      - "media_fill_valid_until := null, last_cleaned_molecule := null"
      - "committed_minutes := 0, open_action_excursion_count := 0, qualified_operator_count := 0"
      - "posture computed by suite_posture, which yields RESTRICTED for a brand-new suite"
  - method: GET
    path: "/filling-suites/{id}"
    description: "Read one filling suite including its derived posture and version (the OCC token for batch scheduling)."
    roles: [ProgramManager, ProductionSupervisor, MicrobiologyAnalyst, QaReviewer, QualifiedPerson]
    code: 200
    input: []
    output: FillingSuite
    side_effects: []
  - method: GET
    path: "/filling-suites"
    description: "Paginated, filterable list of filling suites."
    roles: [ProgramManager, ProductionSupervisor, MicrobiologyAnalyst, QaReviewer]
    code: 200
    input: ["posture?", "grade?", "limit?", "offset?"]
    output: FillingSuite[]
    side_effects: []
  - method: POST
    path: "/filling-suites/{id}/cleaning-validation"
    description: "Record a cleaning-validation swab result for the molecule the suite was just cleaned down from; residue above CLEANING_RESIDUE_LIMIT_UG (100) fails the suite and freezes it."
    roles: [MicrobiologyAnalyst]
    code: 200
    input: ["molecule_name", "residue_ug_per_swab"]
    output: FillingSuite
    side_effects:
      - "cleaning_validation_status := VALIDATED and last_cleaned_molecule := molecule_name when residue_ug_per_swab <= 100, else cleaning_validation_status := FAILED"
      - "posture recomputed by suite_posture"
      - "increments FillingSuite.version by 1"

  # --- MediaFill --------------------------------------------------------------
  - method: POST
    path: "/media-fills"
    description: "Schedule an aseptic process simulation (media fill) in a suite."
    roles: [MicrobiologyAnalyst]
    code: 201
    input: ["suite_id", "scheduled_run_date"]
    output: MediaFill
    side_effects:
      - "status := SCHEDULED, units_filled := null, contaminated_units := null, participating_operator_names := []"
  - method: GET
    path: "/media-fills/{id}"
    description: "Read one media fill."
    roles: [MicrobiologyAnalyst, QaReviewer, QualifiedPerson, ProgramManager]
    code: 200
    input: []
    output: MediaFill
    side_effects: []
  - method: GET
    path: "/media-fills"
    description: "Paginated, filterable list of media fills."
    roles: [MicrobiologyAnalyst, QaReviewer, QualifiedPerson, ProgramManager]
    code: 200
    input: ["suite_id?", "status?", "limit?", "offset?"]
    output: MediaFill[]
    side_effects: []
  - method: POST
    path: "/media-fills/{id}/execute"
    description: "Record execution of the simulation: how many units were media-filled and which operators intervened. Moves SCHEDULED -> INCUBATING."
    roles: [MicrobiologyAnalyst]
    code: 200
    input: ["units_filled", "participating_operator_names"]
    output: MediaFill
    side_effects:
      - "units_filled and participating_operator_names := supplied values"
      - "status := INCUBATING"
      - "increments MediaFill.version by 1"
  - method: POST
    path: "/media-fills/{id}/read"
    description: "Incubation read-out. contaminated_units 0 passes and qualifies the suite for MEDIA_FILL_VALIDITY_DAYS (183) days; exactly 1 forks to INVESTIGATION_REQUIRED; 2 or more fails and triggers the depth-5 suite-freeze cascade."
    roles: [MicrobiologyAnalyst]
    code: 200
    input: ["contaminated_units"]
    output: MediaFill
    side_effects:
      - "contaminated_units := supplied value, read_at := logical clock, outcome_reason stamped"
      - "status := PASSED | INVESTIGATION_REQUIRED | FAILED per media_fill_outcome"
      - "on PASSED: the suite's aseptic_qualification_status := QUALIFIED, media_fill_valid_until := read_at + 183 days, posture recomputed, and its SUSPENDED batches whose project is ACTIVE return to SCHEDULED"
      - "on FAILED: the suite's aseptic_qualification_status := INVALIDATED and posture := FROZEN, which suspends and quarantines its live batches, which releases those batches' RESERVED reservations back to their lots, which un-exhausts any EXHAUSTED lot; every QUALIFIED PersonnelQualification citing this media fill is REVOKED"
      - "increments MediaFill.version by 1"
  - method: POST
    path: "/media-fills/{id}/adjudicate"
    description: "QA adjudication of an INVESTIGATION_REQUIRED media fill into PASSED or FAILED, with the same branch side-effect sets as a direct read."
    roles: [QaReviewer]
    code: 200
    input: ["outcome", "adjudication_rationale"]
    output: MediaFill
    side_effects:
      - "status := PASSED or FAILED, outcome_reason := 'ADJUDICATED_PASS' or 'ADJUDICATED_FAILURE'"
      - "the same suite-level side effects as the corresponding read branch"
      - "increments MediaFill.version by 1"

  # --- PersonnelQualification -------------------------------------------------
  - method: POST
    path: "/personnel-qualifications"
    description: "Open a suite-scoped operator qualification record, optionally evidenced by a media fill."
    roles: [MicrobiologyAnalyst]
    code: 201
    input: ["operator_name", "suite_id", "qualification_type", "expires_on", "media_fill_id?"]
    output: PersonnelQualification
    side_effects:
      - "status := PENDING, qualified_at := null"
  - method: GET
    path: "/personnel-qualifications/{id}"
    description: "Read one operator qualification."
    roles: [MicrobiologyAnalyst, ProductionSupervisor, QaReviewer, ProgramManager]
    code: 200
    input: []
    output: PersonnelQualification
    side_effects: []
  - method: GET
    path: "/personnel-qualifications"
    description: "Paginated, filterable list of operator qualifications."
    roles: [MicrobiologyAnalyst, ProductionSupervisor, QaReviewer, ProgramManager]
    code: 200
    input: ["suite_id?", "media_fill_id?", "status?", "operator_name?", "limit?", "offset?"]
    output: PersonnelQualification[]
    side_effects: []
  - method: POST
    path: "/personnel-qualifications/{id}/qualify"
    description: "Grant the qualification; ASEPTIC_INTERVENTION requires a PASSED media fill that lists this operator."
    roles: [MicrobiologyAnalyst]
    code: 200
    input: []
    output: PersonnelQualification
    side_effects:
      - "status := QUALIFIED, qualified_at := logical clock"
      - "the suite's qualified_operator_count and posture are recomputed"
      - "increments PersonnelQualification.version by 1"
  - method: POST
    path: "/personnel-qualifications/{id}/revoke"
    description: "Revoke a PENDING, QUALIFIED or LAPSED qualification."
    roles: [MicrobiologyAnalyst]
    code: 200
    input: ["revoke_reason"]
    output: PersonnelQualification
    side_effects:
      - "status := REVOKED"
      - "the suite's qualified_operator_count and posture are recomputed"
      - "increments PersonnelQualification.version by 1"

  # --- ComponentLot -----------------------------------------------------------
  - method: POST
    path: "/component-lots"
    description: "Receive a project-dedicated primary-packaging lot into quarantine."
    roles: [ProgramManager]
    code: 201
    input: ["client_project_id", "component_type", "lot_code", "quantity_received", "sterilization_expiry"]
    output: ComponentLot
    side_effects:
      - "status := QUARANTINE, sterilization_validation_status := PENDING, quantity_available := 0"
  - method: GET
    path: "/component-lots/{id}"
    description: "Read one component lot including quantity_available and version (the OCC token for reservations)."
    roles: [ProgramManager, MicrobiologyAnalyst, ProductionSupervisor, QaReviewer]
    code: 200
    input: []
    output: ComponentLot
    side_effects: []
  - method: GET
    path: "/component-lots"
    description: "Paginated, filterable list of component lots."
    roles: [ProgramManager, MicrobiologyAnalyst, ProductionSupervisor, QaReviewer]
    code: 200
    input: ["client_project_id?", "component_type?", "status?", "limit?", "offset?"]
    output: ComponentLot[]
    side_effects: []
  - method: POST
    path: "/component-lots/{id}/sterilization-validation"
    description: "Record the sterilization/depyrogenation validation verdict; RELEASED opens quantity_available := quantity_received, REJECTED zeroes it."
    roles: [MicrobiologyAnalyst]
    code: 200
    input: ["outcome", "f0_minutes"]
    output: ComponentLot
    side_effects:
      - "sterilization_validation_status and status := RELEASED or REJECTED"
      - "quantity_available := quantity_received on RELEASED, 0 on REJECTED"
      - "increments ComponentLot.version by 1"

  # --- BatchOrder -------------------------------------------------------------
  - method: POST
    path: "/batch-orders"
    description: "Schedule a batch into a shared suite. Stamps component_demand_units (per-line pack rounding) and changeover_minutes_applied, and is guarded by optimistic concurrency on the suite version."
    roles: [ProgramManager]
    code: 201
    input: ["client_project_id", "suite_id", "lead_operator_qualification_id", "batch_number", "planned_start", "planned_end", "target_fill_units", "expected_suite_version"]
    output: BatchOrder
    side_effects:
      - "production_status := SCHEDULED, quality_status := PENDING"
      - "component_demand_units := component_demand_units calculation, changeover_minutes_applied := changeover_minutes_applied calculation"
      - "the ClientProject.committed_demand_units increases by component_demand_units"
      - "the FillingSuite.committed_minutes increases by minutes_between(planned_start, planned_end) + changeover_minutes_applied"
      - "increments FillingSuite.version by 1"
  - method: GET
    path: "/batch-orders/{id}"
    description: "Read one batch order including both state axes and both releasable-unit figures."
    roles: [ProgramManager, ProductionSupervisor, QaReviewer, QualifiedPerson, MicrobiologyAnalyst, ClientRepresentative]
    code: 200
    input: []
    output: BatchOrder
    side_effects: []
  - method: GET
    path: "/batch-orders"
    description: "Paginated, filterable list of batch orders across both state axes."
    roles: [ProgramManager, ProductionSupervisor, QaReviewer, QualifiedPerson, MicrobiologyAnalyst]
    code: 200
    input: ["client_project_id?", "suite_id?", "lead_operator_qualification_id?", "production_status?", "quality_status?", "limit?", "offset?"]
    output: BatchOrder[]
    side_effects: []
  - method: GET
    path: "/batch-orders/{id}/unit-accounting"
    description: "Computed read exposing both batch_releasable_units variants side by side together with their component terms and their delta."
    roles: [ProgramManager, QaReviewer, QualifiedPerson, ClientRepresentative]
    code: 200
    input: []
    output: "{ batch_order_id: string, filled_unit_count: integer, expected_reject_units: integer, actual_visual_reject_units: integer, destructive_total_units: integer, quarantined_unit_count: integer, provisional_releasable_units: integer, final_releasable_units: integer, variant_delta_units: integer }"
    side_effects: []
  - method: POST
    path: "/batch-orders/{id}/setup"
    description: "Move a scheduled batch into suite setup; blocked while the suite is FROZEN or the project is not ACTIVE."
    roles: [ProductionSupervisor]
    code: 200
    input: []
    output: BatchOrder
    side_effects:
      - "production_status := SETUP"
      - "increments BatchOrder.version by 1"
  - method: POST
    path: "/batch-orders/{id}/start-fill"
    description: "Start the aseptic fill. Requires suite posture OPEN, unexpired media-fill qualification covering planned_end, product-matched cleaning validation, an effective lead operator and fully reserved components."
    roles: [ProductionSupervisor]
    code: 200
    input: []
    output: BatchOrder
    side_effects:
      - "production_status := FILLING"
      - "quality_status advances PENDING -> IN_PROCESS_REVIEW on the second axis"
      - "increments BatchOrder.version by 1"
  - method: POST
    path: "/batch-orders/{id}/complete-fill"
    description: "Close the fill, consume the reservations and stamp the forward-looking provisional releasable-unit figure."
    roles: [ProductionSupervisor]
    code: 200
    input: ["filled_unit_count"]
    output: BatchOrder
    side_effects:
      - "filled_unit_count := supplied value, production_status := FILLED"
      - "every RESERVED ComponentReservation of this batch becomes CONSUMED with no change to quantity_available"
      - "provisional_releasable_units := batch_releasable_units variant PROVISIONAL_AT_FILL"
      - "increments BatchOrder.version by 1"
  - method: POST
    path: "/batch-orders/{id}/cancel"
    description: "Cancel a batch that has not started filling. Compensating action: releases every RESERVED reservation back to its lot and unwinds both derived ledgers by exactly the amounts the schedule action added."
    roles: [ProgramManager]
    code: 200
    input: ["cancellation_reason"]
    output: BatchOrder
    side_effects:
      - "production_status := CANCELLED and quality_status := REJECTED unless already RELEASED or REJECTED"
      - "every RESERVED ComponentReservation becomes RELEASED with released_reason 'BATCH_CANCELLED' and its lot's quantity_available increases by quantity_reserved"
      - "any EXHAUSTED lot whose quantity_available rose above 0 returns to RELEASED"
      - "the ClientProject.committed_demand_units decreases by component_demand_units and the suite's committed_minutes decreases by minutes_between(planned_start, planned_end) + changeover_minutes_applied"
      - "increments BatchOrder.version by 1"
  - method: GET
    path: "/batch-orders/{id}/qp-release-decisions"
    description: "Append-only sub-resource list of the Qualified-Person decisions signed against this batch, ordered created_at ASC."
    roles: [QaReviewer, QualifiedPerson, ProgramManager]
    code: 200
    input: ["limit?", "offset?"]
    output: QpReleaseDecision[]
    side_effects: []
  - method: POST
    path: "/batch-orders/{id}/qp-release"
    description: "Qualified-Person disposition of a batch in QP_REVIEW. RELEASE additionally stamps release_fee_cents from the pinned five-step tiered fee formula."
    roles: [QualifiedPerson]
    code: 201
    input: ["decision", "rationale"]
    output: QpReleaseDecision
    side_effects:
      - "quality_status := RELEASED | REJECTED | QUARANTINED"
      - "on RELEASE: release_fee_cents := qp_release_fee_cents and the appended decision copies final_releasable_units and the fee"
      - "an immutable QpReleaseDecision row is appended"
      - "increments BatchOrder.version by 1"

  # --- ComponentReservation ---------------------------------------------------
  - method: POST
    path: "/component-reservations"
    description: "Withhold units of a released, unexpired, project-matched lot for a batch. Guarded by optimistic concurrency on the lot version."
    roles: [ProgramManager, ProductionSupervisor]
    code: 201
    input: ["batch_order_id", "component_lot_id", "quantity_reserved", "expected_component_lot_version"]
    output: ComponentReservation
    side_effects:
      - "status := RESERVED, released_reason := null"
      - "the ComponentLot.quantity_available decreases by quantity_reserved"
      - "the ComponentLot transitions RELEASED -> EXHAUSTED when quantity_available reaches exactly 0"
      - "increments ComponentLot.version by 1"
  - method: GET
    path: "/component-reservations/{id}"
    description: "Read one component reservation."
    roles: [ProgramManager, ProductionSupervisor, QaReviewer, MicrobiologyAnalyst]
    code: 200
    input: []
    output: ComponentReservation
    side_effects: []
  - method: GET
    path: "/component-reservations"
    description: "Paginated, filterable list of component reservations."
    roles: [ProgramManager, ProductionSupervisor, QaReviewer, MicrobiologyAnalyst]
    code: 200
    input: ["batch_order_id?", "component_lot_id?", "status?", "limit?", "offset?"]
    output: ComponentReservation[]
    side_effects: []

  # --- InProcessCheck ---------------------------------------------------------
  - method: POST
    path: "/in-process-checks"
    description: "Record an in-process control (fill weight, container closure integrity or visual inspection) against a batch; result is derived by in_process_check_result."
    roles: [ProductionSupervisor, QaReviewer]
    code: 201
    input: ["batch_order_id", "check_type", "sample_size", "reject_unit_count", "destructive_sample_units", "measured_fill_weights_mg?"]
    output: InProcessCheck
    side_effects:
      - "result and max_absolute_deviation_pct := in_process_check_result"
  - method: GET
    path: "/in-process-checks/{id}"
    description: "Read one in-process control record."
    roles: [ProductionSupervisor, QaReviewer, QualifiedPerson, ProgramManager]
    code: 200
    input: []
    output: InProcessCheck
    side_effects: []
  - method: GET
    path: "/in-process-checks"
    description: "Paginated, filterable list of in-process control records."
    roles: [ProductionSupervisor, QaReviewer, QualifiedPerson, ProgramManager]
    code: 200
    input: ["batch_order_id?", "check_type?", "result?", "limit?", "offset?"]
    output: InProcessCheck[]
    side_effects: []

  # --- EmSample ---------------------------------------------------------------
  - method: POST
    path: "/em-samples"
    description: "Record an environmental monitoring result. Stamps the grade/type limit pair, the classification, the excursion risk index, and — for ALERT/ACTION — opens an investigation. An ACTION row restricts the suite and demotes its QP_REVIEW batches."
    roles: [MicrobiologyAnalyst]
    code: 201
    input: ["suite_id", "sample_type", "cfu_count", "batch_order_id?"]
    output: EmSample
    side_effects:
      - "alert_limit, action_limit, classification, risk_index and investigation_status stamped by em_sample_limits, em_sample_classification and em_excursion_risk_index"
      - "on classification ACTION: the suite's open_action_excursion_count increases, which recomputes posture to RESTRICTED, which demotes every QP_REVIEW batch of that suite to BR_REVIEW, which reopens each such batch's CLOSED BatchRecordReview into COMPLETE_WITH_FINDINGS with open_findings_count increased by 1"
      - "increments FillingSuite.version by 1 on ACTION"
  - method: GET
    path: "/em-samples/{id}"
    description: "Read one environmental monitoring sample including its stamped limits and risk index."
    roles: [MicrobiologyAnalyst, QaReviewer, QualifiedPerson, ProductionSupervisor]
    code: 200
    input: []
    output: EmSample
    side_effects: []
  - method: GET
    path: "/em-samples"
    description: "Paginated, filterable list of environmental monitoring samples."
    roles: [MicrobiologyAnalyst, QaReviewer, QualifiedPerson, ProductionSupervisor]
    code: 200
    input: ["suite_id?", "batch_order_id?", "classification?", "investigation_status?", "sample_type?", "limit?", "offset?"]
    output: EmSample[]
    side_effects: []
  - method: POST
    path: "/em-samples/{id}/investigate"
    description: "Open the formal excursion investigation on an OPEN sample."
    roles: [MicrobiologyAnalyst]
    code: 200
    input: ["investigator_note"]
    output: EmSample
    side_effects:
      - "investigation_status := INVESTIGATING; the suite's open_action_excursion_count is unchanged"
      - "increments EmSample.version by 1"
  - method: POST
    path: "/em-samples/{id}/close-investigation"
    description: "Close the excursion investigation with an assigned root cause; an ACTION sample may only close once every deviation linked to it is CLOSED."
    roles: [MicrobiologyAnalyst]
    code: 200
    input: ["root_cause"]
    output: EmSample
    side_effects:
      - "root_cause := supplied value, investigation_status := CLOSED"
      - "the suite's open_action_excursion_count is recomputed, which recomputes posture and can return it to OPEN"
      - "increments EmSample.version by 1 and FillingSuite.version by 1"

  # --- Deviation --------------------------------------------------------------
  - method: POST
    path: "/deviations"
    description: "Raise a deviation against a batch, optionally linked to an environmental excursion. Records the opening QA user for the segregation-of-duties check."
    roles: [QaReviewer]
    code: 201
    input: ["batch_order_id", "summary", "em_sample_id?"]
    output: Deviation
    side_effects:
      - "status := OPEN, classification := null, risk_score := 0, capa_rejection_count := 0"
      - "opened_by_user_id := X-User-ID"
  - method: GET
    path: "/deviations/{id}"
    description: "Read one deviation including its escalation-weighted risk score."
    roles: [QaReviewer, QualifiedPerson, ProgramManager, MicrobiologyAnalyst]
    code: 200
    input: []
    output: Deviation
    side_effects: []
  - method: GET
    path: "/deviations"
    description: "Paginated, filterable list of deviations."
    roles: [QaReviewer, QualifiedPerson, ProgramManager, MicrobiologyAnalyst]
    code: 200
    input: ["batch_order_id?", "em_sample_id?", "status?", "classification?", "limit?", "offset?"]
    output: Deviation[]
    side_effects: []
  - method: POST
    path: "/deviations/{id}/classify"
    description: "Assign the GMP severity classification, stamp risk_score and post it to the project's risk ledger. CRITICAL quarantines the batch, holds the project and suspends the project's unstarted batches."
    roles: [QaReviewer]
    code: 200
    input: ["classification", "classification_rationale"]
    output: Deviation
    side_effects:
      - "classification := supplied value, risk_score := deviation_risk_score, status := UNDER_INVESTIGATION"
      - "the ClientProject.open_deviation_risk_total increases by risk_score"
      - "on CRITICAL: the batch's quality_status := QUARANTINED, which puts the ClientProject into ON_HOLD, which suspends every SCHEDULED or SETUP batch of that project, which releases those batches' RESERVED reservations back to their lots"
      - "increments Deviation.version by 1"
  - method: POST
    path: "/deviations/{id}/submit-capa"
    description: "Submit the corrective and preventive action for QA decision."
    roles: [QaReviewer]
    code: 200
    input: ["capa_summary"]
    output: Deviation
    side_effects:
      - "capa_summary := supplied value, status := CAPA_PENDING"
      - "increments Deviation.version by 1"
  - method: POST
    path: "/deviations/{id}/decide-capa"
    description: "QA decision on the submitted CAPA by a user other than the one who opened the deviation. REJECTED loops back to UNDER_INVESTIGATION and raises risk_score; APPROVED closes the deviation and unwinds the risk ledger exactly."
    roles: [QaReviewer]
    code: 200
    input: ["outcome", "decision_note"]
    output: Deviation
    side_effects:
      - "on REJECTED: capa_rejection_count += 1, risk_score recomputed, the ClientProject.open_deviation_risk_total adjusted by exactly the score delta, status := UNDER_INVESTIGATION"
      - "on APPROVED: status := CLOSED and the ClientProject.open_deviation_risk_total decreases by exactly the current risk_score"
      - "on APPROVED closing the batch's last open deviation: the batch's quality_status returns QUARANTINED -> BR_REVIEW when production_status == FILLED and the suite posture is not FROZEN"
      - "increments Deviation.version by 1"

  # --- BatchRecordReview ------------------------------------------------------
  - method: POST
    path: "/batch-record-reviews"
    description: "Open the executed batch record review, which moves the batch's quality axis IN_PROCESS_REVIEW -> BR_REVIEW. Seeds open_findings_count from the batch's open MAJOR deviations and records the reviewing QA user for the segregation-of-duties check."
    roles: [QaReviewer]
    code: 201
    input: ["batch_order_id"]
    output: BatchRecordReview
    side_effects:
      - "status := IN_PROGRESS, reviewer_user_id := X-User-ID, closed_at := null"
      - "open_findings_count := the count of Deviation rows of this batch with classification == MAJOR and status != CLOSED"
      - "the BatchOrder.quality_status advances IN_PROCESS_REVIEW -> BR_REVIEW"
      - "increments BatchOrder.version by 1"
  - method: GET
    path: "/batch-record-reviews/{id}"
    description: "Read one batch record review."
    roles: [QaReviewer, QualifiedPerson, ProgramManager]
    code: 200
    input: []
    output: BatchRecordReview
    side_effects: []
  - method: GET
    path: "/batch-record-reviews"
    description: "Paginated, filterable list of batch record reviews."
    roles: [QaReviewer, QualifiedPerson, ProgramManager]
    code: 200
    input: ["batch_order_id?", "status?", "limit?", "offset?"]
    output: BatchRecordReview[]
    side_effects: []
  - method: POST
    path: "/batch-record-reviews/{id}/record-findings"
    description: "Set the outstanding findings count; a positive count moves the review to COMPLETE_WITH_FINDINGS and the self-loop is used to drive it back to zero."
    roles: [QaReviewer]
    code: 200
    input: ["open_findings_count", "findings_note"]
    output: BatchRecordReview
    side_effects:
      - "open_findings_count := supplied value, status := COMPLETE_WITH_FINDINGS"
      - "increments BatchRecordReview.version by 1"
  - method: POST
    path: "/batch-record-reviews/{id}/close"
    description: "Close the review once no findings remain, advancing the batch's quality axis BR_REVIEW -> QP_REVIEW and stamping the chronological final releasable-unit figure."
    roles: [QaReviewer]
    code: 200
    input: []
    output: BatchRecordReview
    side_effects:
      - "status := CLOSED, closed_at := logical clock"
      - "the BatchOrder.quality_status advances BR_REVIEW -> QP_REVIEW"
      - "final_releasable_units := batch_releasable_units variant FINAL_AT_QP_REVIEW"
      - "increments BatchRecordReview.version by 1 and BatchOrder.version by 1"

  # --- AuditEngagement --------------------------------------------------------
  - method: POST
    path: "/audit-engagements"
    description: "Request a sponsor audit or an internal regulatory-inspection-readiness rehearsal for a project."
    roles: [ClientRepresentative, ProgramManager]
    code: 201
    input: ["client_project_id", "audit_kind", "requested_window_start"]
    output: AuditEngagement
    side_effects:
      - "status := REQUESTED, finding_count := 0, hosted_at := null"
  - method: POST
    path: "/audit-engagements/{id}/host"
    description: "Host or defer the engagement. Hosting requires an ACTIVE project whose primary suite is not FROZEN, and records the findings raised."
    roles: [ProgramManager]
    code: 200
    input: ["outcome", "finding_count"]
    output: AuditEngagement
    side_effects:
      - "on HOSTED: finding_count := supplied value, hosted_at := logical clock, status := HOSTED, and the ClientProject.last_client_audit_finding_count is recomputed"
      - "on DEFERRED: status := DEFERRED with hosted_at left null"
      - "increments AuditEngagement.version by 1"

  # --- test-driving endpoint (§1.5 priority ladder rung 3) ---------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock, which every expiry, validity-window and timestamp rule reads. The clock's startup default is exactly 2026-08-01T00:00:00Z and it MUST NOT fall back to real wall-clock time before the first call. Advancing the clock lapses due operator qualifications and expires due component lots, recomputing every affected suite posture."
    roles: [ProgramManager, QaReviewer, MicrobiologyAnalyst, ProductionSupervisor, QualifiedPerson]
    code: 200
    input: ["to_iso8601"]
    output: "{ current_utc: datetime, lapsed_qualification_count: integer, expired_component_lot_count: integer }"
    side_effects:
      - "every QUALIFIED PersonnelQualification whose expires_on <= the new clock becomes LAPSED, processed expires_on ASC then created_at ASC"
      - "every RELEASED or EXHAUSTED ComponentLot whose sterilization_expiry <= the new clock becomes EXPIRED with quantity_available := 0, processed sterilization_expiry ASC then created_at ASC"
      - "every affected FillingSuite's qualified_operator_count and posture are recomputed"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================

errors:

  # --- authentication / role resolution (priority 10-12) ---------------------
  - id: ERR_MISSING_AUTH_HEADERS
    http: 401
    condition: "X-User-Role or X-User-ID absent or empty on any endpoint."
  - id: ERR_UNKNOWN_ROLE
    http: 401
    condition: "X-User-Role is not one of the six roles declared in §1.7."

  # --- authorization (priority 20-22, 70) ------------------------------------
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "The resolved role is not listed in the target endpoint's roles."
  - id: ERR_PROJECT_ACCESS_DENIED
    http: 403
    condition: "A ClientRepresentative acts on a resource whose owning ClientProject.id != X-User-ID."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The acting X-User-ID equals Deviation.opened_by_user_id on POST /deviations/{id}/decide-capa, or equals BatchRecordReview.reviewer_user_id on POST /batch-orders/{id}/qp-release."

  # --- existence: path ids and body foreign keys (priority 30, 38) ----------
  - id: ERR_CLIENT_PROJECT_NOT_FOUND
    http: 404
    condition: "No ClientProject with the given path id or client_project_id body value."
  - id: ERR_FILLING_SUITE_NOT_FOUND
    http: 404
    condition: "No FillingSuite with the given path id or suite_id / primary_suite_id body value."
  - id: ERR_MEDIA_FILL_NOT_FOUND
    http: 404
    condition: "No MediaFill with the given path id or media_fill_id body value."
  - id: ERR_QUALIFICATION_NOT_FOUND
    http: 404
    condition: "No PersonnelQualification with the given path id or lead_operator_qualification_id body value."
  - id: ERR_BATCH_ORDER_NOT_FOUND
    http: 404
    condition: "No BatchOrder with the given path id or batch_order_id body value."
  - id: ERR_COMPONENT_LOT_NOT_FOUND
    http: 404
    condition: "No ComponentLot with the given path id or component_lot_id body value."
  - id: ERR_RESERVATION_NOT_FOUND
    http: 404
    condition: "No ComponentReservation with the given path id."
  - id: ERR_IN_PROCESS_CHECK_NOT_FOUND
    http: 404
    condition: "No InProcessCheck with the given path id."
  - id: ERR_EM_SAMPLE_NOT_FOUND
    http: 404
    condition: "No EmSample with the given path id or em_sample_id body value."
  - id: ERR_DEVIATION_NOT_FOUND
    http: 404
    condition: "No Deviation with the given path id."
  - id: ERR_BR_REVIEW_NOT_FOUND
    http: 404
    condition: "No BatchRecordReview with the given path id."
  - id: ERR_AUDIT_ENGAGEMENT_NOT_FOUND
    http: 404
    condition: "No AuditEngagement with the given path id."

  # --- request shape (priority 32-36, 90) -----------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "A required input field is absent, null, of the wrong JSON type, or numerically out of range (negative counts, non-positive quantities, target_fill_weight_mg <= 0, historical_reject_rate_ppm outside 0..1000000)."
  - id: ERR_INVALID_ENUM_VALUE
    http: 422
    condition: "An enum-typed input carries a value outside its declared set (dosage_form, grade, qualification_type, component_type, check_type, sample_type, decision, classification, outcome, audit_kind, variant, to_stage, analytical_method_transfer_status)."
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside 1..100 or offset < 0 on any list endpoint."
  - id: ERR_IPC_PAYLOAD_INCONSISTENT
    http: 422
    condition: "On POST /in-process-checks: reject_unit_count > sample_size; check_type == FILL_WEIGHT with measured_fill_weights_mg absent or empty; or measured_fill_weights_mg non-empty for check_type CCI or VISUAL_INSPECTION."
  - id: ERR_INVALID_WINDOW
    http: 422
    condition: "planned_end <= planned_start on POST /batch-orders, requested_window_start earlier than the logical clock on POST /audit-engagements, or expires_on earlier than the logical clock on POST /personnel-qualifications."

  # --- optimistic concurrency (priority 40-41) ------------------------------
  - id: ERR_STALE_SUITE_VERSION
    http: 412
    condition: "expected_suite_version on POST /batch-orders != the target FillingSuite's current version."
  - id: ERR_STALE_COMPONENT_LOT_VERSION
    http: 412
    condition: "expected_component_lot_version on POST /component-reservations != the target ComponentLot's current version."

  # --- state-machine guards (priority 44-53) --------------------------------
  - id: ERR_BATCH_PRODUCTION_STATE_INVALID
    http: 409
    condition: "The requested production-axis transition is not declared from BatchOrder.production_status's current value (e.g. start-fill from SCHEDULED, complete-fill from SETUP, setup from CANCELLED, cancel from FILLING)."
  - id: ERR_BATCH_QUALITY_STATE_INVALID
    http: 409
    condition: "The requested quality-axis transition is not declared from BatchOrder.quality_status's current value (e.g. qp-release while the batch is BR_REVIEW, QUARANTINED, RELEASED or REJECTED)."
  - id: ERR_MEDIA_FILL_STATE_INVALID
    http: 409
    condition: "execute from a status other than SCHEDULED, read from a status other than INCUBATING, or adjudicate from a status other than INVESTIGATION_REQUIRED."
  - id: ERR_QUALIFICATION_STATE_INVALID
    http: 409
    condition: "qualify from a status other than PENDING or LAPSED, or revoke from REVOKED."
  - id: ERR_COMPONENT_LOT_STATE_INVALID
    http: 409
    condition: "sterilization-validation on a lot whose sterilization_validation_status is no longer PENDING."
  - id: ERR_EXCURSION_STATE_INVALID
    http: 409
    condition: "investigate from an investigation_status other than OPEN, or close-investigation from a status other than OPEN or INVESTIGATING."
  - id: ERR_DEVIATION_STATE_INVALID
    http: 409
    condition: "classify from a status other than OPEN, submit-capa from a status other than UNDER_INVESTIGATION, or decide-capa from a status other than CAPA_PENDING."
  - id: ERR_BR_REVIEW_STATE_INVALID
    http: 409
    condition: "record-findings or close on a BatchRecordReview whose status is already CLOSED and whose batch has left BR_REVIEW, or close while open_findings_count > 0."
  - id: ERR_AUDIT_ENGAGEMENT_STATE_INVALID
    http: 409
    condition: "host on an AuditEngagement whose status is already HOSTED."
  - id: ERR_PROJECT_STATE_INVALID
    http: 409
    condition: "advance-tech-transfer on a project whose status is not INTAKE or to a stage that is not the immediate successor of its current tech_transfer_stage; release-hold on a project whose status is not ON_HOLD; or POST /batch-orders, POST /batch-orders/{id}/setup and POST /audit-engagements/{id}/host on a project whose status is not ACTIVE."

  # --- aseptic / GMP business safety (priority 60-70) -----------------------
  - id: ERR_MEDIA_FILL_QUALIFICATION_EXPIRED
    http: 409
    condition: "The target FillingSuite has no media_fill_valid_until; or it is earlier than the batch's planned_end on POST /batch-orders; or it is earlier than the logical clock on POST /batch-orders/{id}/start-fill."
  - id: ERR_SUITE_NOT_OPEN
    http: 409
    condition: "The target FillingSuite's derived posture is not OPEN on POST /batch-orders/{id}/start-fill, or is FROZEN on POST /batch-orders/{id}/setup and POST /audit-engagements/{id}/host."
  - id: ERR_CLEANING_VALIDATION_REQUIRED
    http: 409
    condition: "The suite's cleaning_validation_status is not VALIDATED, or last_cleaned_molecule differs from the batch project's molecule_name, on POST /batch-orders/{id}/start-fill."
  - id: ERR_OPERATOR_NOT_QUALIFIED
    http: 409
    condition: "The batch's lead_operator_qualification_id does not point at a QUALIFIED ASEPTIC_INTERVENTION qualification for the batch's suite whose expires_on is later than the logical clock, on POST /batch-orders and POST /batch-orders/{id}/start-fill."
  - id: ERR_MEDIA_FILL_NOT_PASSED
    http: 409
    condition: "POST /personnel-qualifications/{id}/qualify for qualification_type ASEPTIC_INTERVENTION when the cited MediaFill is absent, not PASSED, or does not list operator_name in participating_operator_names."
  - id: ERR_MEDIA_FILL_UNDERSIZED
    http: 422
    condition: "units_filled < MEDIA_FILL_MIN_UNITS (5000) on POST /media-fills/{id}/execute, or a read-out attempted on a MediaFill whose recorded units_filled < 5000 on POST /media-fills/{id}/read."
  - id: ERR_REQUIRED_IPC_MISSING
    http: 422
    condition: "The batch lacks at least one InProcessCheck of every required check_type (FILL_WEIGHT, CCI, VISUAL_INSPECTION) on POST /batch-record-reviews."
  - id: ERR_IPC_FAILED
    http: 409
    condition: "The batch has an InProcessCheck with result FAIL on POST /batch-record-reviews."
  - id: ERR_OPEN_CRITICAL_DEVIATION
    http: 409
    condition: "The batch has a Deviation with classification CRITICAL and status != CLOSED on POST /batch-orders/{id}/qp-release, or the project has one on POST /client-projects/{id}/release-hold."
  - id: ERR_COMPONENT_STERILIZATION_INVALID
    http: 409
    condition: "On POST /component-reservations the lot's sterilization_validation_status is not RELEASED, or its sterilization_expiry is earlier than or equal to the logical clock, or its sterilization_expiry is earlier than the owning BatchOrder.planned_end. The lot-status arm is left to ERR_COMPONENT_LOT_STATE_INVALID at priority 48."

  # --- temporal / capacity / integrity (priority 76-96) ---------------------
  - id: ERR_SUITE_CHANGEOVER_CONFLICT
    http: 409
    condition: "On POST /batch-orders the requested [planned_start, planned_end) half-open window, widened at its front by the directional changeover buffer, overlaps a live batch's window in the same suite (strict inequality — touching at the buffer edge is legal)."
  - id: ERR_OPERATOR_DOUBLE_BOOKED
    http: 409
    condition: "On POST /batch-orders the operator behind lead_operator_qualification_id already leads a live batch in ANY suite whose [planned_start, planned_end] closed interval intersects the requested one (non-strict inequality — touching endpoints collide)."
  - id: ERR_COMPONENT_LOT_PROJECT_MISMATCH
    http: 409
    condition: "On POST /component-reservations the lot's client_project_id differs from the batch's client_project_id, or its component_type is not in the BILL_OF_COMPONENTS of the project's dosage_form."
  - id: ERR_EM_SAMPLE_SUITE_MISMATCH
    http: 409
    condition: "On POST /em-samples a batch_order_id is supplied whose BatchOrder.suite_id differs from the sample's suite_id."
  - id: ERR_BR_REVIEW_NOT_CLOSED
    http: 409
    condition: "POST /batch-orders/{id}/qp-release while the batch has no BatchRecordReview, or its status is not CLOSED, or its open_findings_count > 0."
  - id: ERR_COMPONENTS_NOT_RESERVED
    http: 409
    condition: "On POST /batch-orders/{id}/start-fill the sum of quantity_reserved over the batch's ComponentReservation rows with status == RESERVED is below component_demand_units."
  - id: ERR_COMPONENT_LOT_INSUFFICIENT
    http: 409
    condition: "quantity_reserved exceeds the lot's quantity_available on POST /component-reservations."
  - id: ERR_DUPLICATE_BATCH_NUMBER
    http: 409
    condition: "batch_number is already used by a non-CANCELLED BatchOrder of the same ClientProject."
  - id: ERR_DUPLICATE_LOT_CODE
    http: 409
    condition: "lot_code is already used by another ComponentLot of the same component_type."
  - id: ERR_DUPLICATE_SUITE_CODE
    http: 409
    condition: "suite_code is already used by another FillingSuite."
  - id: ERR_BR_REVIEW_ALREADY_EXISTS
    http: 409
    condition: "A BatchRecordReview already exists for the batch on POST /batch-record-reviews."
  - id: ERR_PROJECT_UNIT_BUDGET_EXCEEDED
    http: 402
    condition: "ClientProject.committed_demand_units + the new batch's component_demand_units exceeds reserved_unit_budget."
  - id: ERR_SUITE_CAPACITY_EXCEEDED
    http: 402
    condition: "FillingSuite.committed_minutes + the requested window length + changeover_minutes_applied exceeds max_committed_minutes."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================

roles:
  - name: ProgramManager
    description: "CMO-side technical project owner: intakes client projects, drives technology transfer, registers suites and component lots, schedules batches into shared suites, cancels batches, and hosts audits."
    identity: "opaque"
    exclusive_operations:
      - "POST /client-projects"
      - "POST /client-projects/{id}/advance-tech-transfer"
      - "POST /filling-suites"
      - "POST /component-lots"
      - "POST /batch-orders"
      - "POST /batch-orders/{id}/cancel"
      - "POST /audit-engagements/{id}/host"
    shared_operations:
      - "POST /component-reservations"
      - "POST /audit-engagements"
      - "GET /client-projects, GET /client-projects/{id}, GET /client-projects/{id}/readiness-assessment, GET /client-projects/{id}/audit-engagements"
      - "GET /filling-suites, GET /filling-suites/{id}"
      - "GET /media-fills, GET /media-fills/{id}"
      - "GET /personnel-qualifications, GET /personnel-qualifications/{id}"
      - "GET /batch-orders, GET /batch-orders/{id}, GET /batch-orders/{id}/unit-accounting, GET /batch-orders/{id}/qp-release-decisions"
      - "GET /component-lots, GET /component-lots/{id}"
      - "GET /component-reservations, GET /component-reservations/{id}"
      - "GET /in-process-checks, GET /in-process-checks/{id}"
      - "GET /deviations, GET /deviations/{id}"
      - "GET /batch-record-reviews, GET /batch-record-reviews/{id}"
      - "POST /_clock/set_current_utc"
  - name: ProductionSupervisor
    description: "Filling-suite production lead: runs the batch through setup, aseptic fill and fill completion, and records in-process controls."
    identity: "opaque"
    exclusive_operations:
      - "POST /batch-orders/{id}/setup"
      - "POST /batch-orders/{id}/start-fill"
      - "POST /batch-orders/{id}/complete-fill"
    shared_operations:
      - "POST /in-process-checks"
      - "POST /component-reservations"
      - "GET /filling-suites, GET /filling-suites/{id}"
      - "GET /personnel-qualifications, GET /personnel-qualifications/{id}"
      - "GET /batch-orders, GET /batch-orders/{id}"
      - "GET /component-lots, GET /component-lots/{id}"
      - "GET /component-reservations, GET /component-reservations/{id}"
      - "GET /in-process-checks, GET /in-process-checks/{id}"
      - "GET /em-samples, GET /em-samples/{id}"
      - "POST /_clock/set_current_utc"
  - name: MicrobiologyAnalyst
    description: "Sterility assurance / microbiology: schedules and reads media fills, qualifies and revokes operators, validates cleaning and component sterilization, and records and investigates environmental monitoring excursions."
    identity: "opaque"
