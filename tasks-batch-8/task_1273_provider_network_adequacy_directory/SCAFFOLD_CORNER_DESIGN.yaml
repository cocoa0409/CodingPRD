  # =================================================================
  # Section: calculations — correct results, boundaries, input-set filtering
  # =================================================================
  - section: calculations
    instances:
      - name: probe_wait_days_inclusive_threshold
        claim_type: boundary_edge
        grounds: [calculations.probe_wait_days, entities.AvailabilityProbe.fields.result]
        distinguishing_aspect: "ROUTINE limit 15 is inclusive: days == 15 PASSES, days == 16 FAILS; URGENT probe uses max_wait_days_urgent (2) — 3 days FAILS for URGENT while PASSING for ROUTINE."
        test_recipe:
          setup: ["LISTED listing; CARDIOLOGY/URBAN standard wait_routine=15, wait_urgent=2; three probes recorded at clock 2026-06-05"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: NetworkManager }
            - { call: "POST /network/regions", payload: { county_fips: "06069", name: "Ventura", geo_class: "URBAN", enrolled_member_count: 100 }, as: NetworkManager, captures: { reg: "$.data.id" } }
            - { call: "POST /network/standards", payload: { specialty: "CARDIOLOGY", geo_class: "URBAN", max_members_per_provider: 1200, max_travel_minutes: 30, max_travel_miles: 15, max_wait_days_routine: 15, max_wait_days_urgent: 2 }, as: NetworkManager }
            - { call: "POST /network/providers", payload: { npi: "1000000057", legal_name: "P57", specialty: "CARDIOLOGY", contract_effective_date: "2026-04-01" }, as: NetworkManager, captures: { prov: "$.data.id" } }
            - { call: "POST /network/locations", payload: { provider_id: "${prov}", region_id: "${reg}", address_line: "57 A St", panel_status: "OPEN", avg_travel_minutes: 8, avg_travel_miles: 4 }, as: NetworkManager, captures: { loc: "$.data.id" } }
            - { call: "POST /network/listings", payload: { provider_id: "${prov}", location_id: "${loc}", specialty: "CARDIOLOGY", display_name: "L57", phone: "555-0157", accepts_new_patients: true }, as: NetworkManager, captures: { lst: "$.data.id" } }
            - { call: "POST /network/listings/${lst}/publish", as: NetworkManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T09:00:00Z" }, as: NetworkManager }
            - { call: "POST /network/probes", payload: { listing_id: "${lst}", probe_type: "ROUTINE", requested_date: "2026-06-01" }, as: NetworkManager, captures: { pb15: "$.data.id" } }
            - { call: "POST /network/probes", payload: { listing_id: "${lst}", probe_type: "ROUTINE", requested_date: "2026-06-01" }, as: NetworkManager, captures: { pb16: "$.data.id" } }
            - { call: "POST /network/probes", payload: { listing_id: "${lst}", probe_type: "URGENT", requested_date: "2026-06-01" }, as: NetworkManager, captures: { pbu: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-17T00:00:00Z" }, as: NetworkManager }
          trigger:
            - { call: "POST /network/probes/${pb15}/record", payload: { outcome: "KEPT", offered_appointment_date: "2026-06-16" }, as: NetworkManager, captures: { r15: "$.data.result", d15: "$.data.days_to_appointment" } }
            - { call: "POST /network/probes/${pb16}/record", payload: { outcome: "KEPT", offered_appointment_date: "2026-06-17" }, as: NetworkManager, captures: { r16: "$.data.result" } }
            - { call: "POST /network/probes/${pbu}/record", payload: { outcome: "KEPT", offered_appointment_date: "2026-06-04" }, as: NetworkManager, captures: { ru: "$.data.result", du: "$.data.days_to_appointment" } }
          assert:
            - "15-day ROUTINE probe: days_to_appointment == 15, result == PASS (inclusive <=)"
            - "16-day ROUTINE probe: result == FAIL"
            - "3-day URGENT probe: days_to_appointment == 3, result == FAIL (urgent limit 2) — probe_type selects the threshold"

      - name: penalty_cap_binds_per_accrual_event
        claim_type: constants_applied
        grounds: [calculations.deficiency_penalty_accrual]
        distinguishing_aspect: "min(PENALTY_CAP_CENTS, raw) binds: 9999 * 364 days * 2.0 tier = 7,279,272 raw is capped to exactly 5000000 cents for one accrual event."
        test_recipe:
          setup: ["URBAN region enrolled 60000 (tier 2.0); DERMATOLOGY/URBAN std max 150000 (no providers so ratio deficient); period 2026-01-01..2026-12-31 (364 days)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: NetworkManager }
            - { call: "POST /network/regions", payload: { county_fips: "06071", name: "Yolo", geo_class: "URBAN", enrolled_member_count: 60000 }, as: NetworkManager, captures: { reg: "$.data.id" } }
            - { call: "POST /network/standards", payload: { specialty: "DERMATOLOGY", geo_class: "URBAN", max_members_per_provider: 150000, max_travel_minutes: 45, max_travel_miles: 30, max_wait_days_routine: 20, max_wait_days_urgent: 3 }, as: NetworkManager }
            - { call: "POST /network/evaluations", payload: { measurement_period: "CAP", period_start_date: "2026-01-01", period_end_date: "2026-12-31" }, as: NetworkManager, captures: { ev: "$.data.id" } }
          trigger:
            - { call: "POST /network/evaluations/${ev}/finalize", as: NetworkManager }
            - { call: "GET /network/deficiencies", payload: { evaluation_id: "${ev}", region_id: "${reg}" }, as: NetworkManager, captures: { d_last: "$.data[0].last_accrual_cents" } }
          assert:
            - "last_accrual_cents == 5000000 (raw 7279272 capped by PENALTY_CAP_CENTS)"

      - name: zero_member_region_with_no_providers_is_compliant
        claim_type: boundary_edge
        grounds: [calculations.network_ratio_headcount, entities.RegionSpecialtyResult.fields.overall_status]
        distinguishing_aspect: "Empty-set edge: enrolled_member_count == 0 yields overall COMPLIANT with ratio_members_per_provider null even though provider_count == 0 — the zero-member rule precedes the zero-provider deficiency rule."
        test_recipe:
          setup: ["URBAN region enrolled 0; CARDIOLOGY standard present; no providers"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: NetworkManager }
            - { call: "POST /network/regions", payload: { county_fips: "06073", name: "Yuba", geo_class: "URBAN", enrolled_member_count: 0 }, as: NetworkManager, captures: { reg: "$.data.id" } }
            - { call: "POST /network/standards", payload: { specialty: "CARDIOLOGY", geo_class: "URBAN", max_members_per_provider: 1200, max_travel_minutes: 30, max_travel_miles: 15, max_wait_days_routine: 15, max_wait_days_urgent: 2 }, as: NetworkManager }
            - { call: "POST /network/evaluations", payload: { measurement_period: "Z", period_start_date: "2026-06-01", period_end_date: "2026-06-11" }, as: NetworkManager, captures: { ev: "$.data.id" } }
          trigger:
            - { call: "POST /network/evaluations/${ev}/finalize", as: NetworkManager }
            - { call: "GET /network/results", payload: { evaluation_id: "${ev}", region_id: "${reg}" }, as: NetworkManager, captures: { r_overall: "$.data[0].overall_status", r_pc: "$.data[0].provider_count" } }
            - { call: "GET /network/deficiencies", payload: { evaluation_id: "${ev}", region_id: "${reg}" }, as: NetworkManager }
          assert:
            - "result overall_status == COMPLIANT, provider_count == 0, ratio_members_per_provider == null"
