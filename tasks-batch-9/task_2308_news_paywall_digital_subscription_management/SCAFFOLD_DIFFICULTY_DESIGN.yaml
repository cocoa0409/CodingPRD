              captures: { rB: "$.data.id" }
            - call: "POST /paywall/readers"
              payload: { email: "rc@mail.test", is_registered: true, propensity_band: "MEDIUM" }
              as: SubscriptionOpsAgent
              captures: { rC: "$.data.id" }
            - call: "POST /paywall/readers"
              payload: { email: "rd@mail.test", is_registered: true, propensity_band: "MEDIUM" }
              as: SubscriptionOpsAgent
              captures: { rD: "$.data.id" }
            - call: "POST /paywall/readers/${rB}/events"
              payload: { event_type: "COMMENT_POST", occurred_at: "2026-09-01T00:00:00Z" }
              as: Reader
              as_user_id: "${rB}"
            - call: "POST /paywall/readers/${rB}/events"
              payload: { event_type: "COMMENT_POST", occurred_at: "2026-09-01T00:00:00Z" }
              as: Reader
              as_user_id: "${rB}"
            - call: "POST /paywall/readers/${rC}/events"
              payload: { event_type: "COMMENT_POST", occurred_at: "2026-09-01T00:00:00Z" }
              as: Reader
              as_user_id: "${rC}"
            - call: "POST /paywall/readers/${rC}/events"
              payload: { event_type: "NEWSLETTER_OPEN", occurred_at: "2026-09-01T00:00:00Z" }
              as: Reader
              as_user_id: "${rC}"
            - call: "POST /paywall/readers/${rC}/events"
              payload: { event_type: "NEWSLETTER_OPEN", occurred_at: "2026-09-01T00:00:00Z" }
              as: Reader
              as_user_id: "${rC}"
            - call: "POST /paywall/readers/${rD}/events"
              payload: { event_type: "COMMENT_POST", occurred_at: "2026-08-02T00:00:00Z" }
              as: Reader
              as_user_id: "${rD}"
            - call: "POST /paywall/readers/${rD}/events"
              payload: { event_type: "COMMENT_POST", occurred_at: "2026-08-03T00:00:00Z" }
