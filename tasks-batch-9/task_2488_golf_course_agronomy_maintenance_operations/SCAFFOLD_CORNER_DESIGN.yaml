              payload: { course_id: "${course_id}", event_type: "HEAVY_RAIN", expected_clear_at: "2026-08-01T18:00:00Z", expected_course_version: "${cv1}" }
              as: Superintendent
              as_user_id: "super-1"
              captures: { wx_rain_id: $.data.id }
            - call: "GET /courses/${course_id}"
