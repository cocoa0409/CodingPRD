          setup_api_calls:
            - *c_clock
            - *c_agency
          trigger:
            - call: "GET /portal/agencies/${ag_id}"
              payload: {}
              as: Anonymous
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 403 and err_id == ERR_FORBIDDEN_FOR_ROLE"

  # ===========================================================================
  - section: cross_cutting
    instances:
      - name: occ_stale_agency_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[settlement-account-create-stale-agency]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "A settlement-account create carrying the agency's pre-mutation version (1) after a first account already bumped it to 2 is rejected 412 ERR_STALE_VERSION — the loser's view predates a committed structural change."
        test_recipe:
          setup:
            - "Agency created (version 1); one account already created against it (version now 2)."
          setup_api_calls:
            - *c_clock
            - *c_agency
            - *c_account
          trigger:
            - call: "POST /portal/settlement-accounts"
              payload: { agency_id: "${ag_id}", routing_number: "103000648", account_number_last4: "8888", effective_from: "2026-06-01T00:00:00Z", expected_agency_version: "${ag_v}" }
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 412 and err_id == ERR_STALE_VERSION (expected_agency_version 1 vs current 2)"
            - "GET /portal/agencies/${ag_id}/settlement-accounts returns exactly 1 row — the stale write created nothing"
            - "Agency.${ag_id}.version is still 2 (the rejected write did not bump it)"

      - name: occ_put_service_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[service-update-stale-version]
          - errors.ERR_STALE_VERSION
          - endpoints.PUT_/portal/services/{id}
        distinguishing_aspect: "PUT with the post-activation version 2 succeeds and bumps the service to 3; replaying the same PUT with version 2 is 412 ERR_STALE_VERSION."
        test_recipe:
          setup:
            - "CF agency base chain through the ACTIVE service (version 2 after activation)."
          setup_api_calls:
            - *c_clock
            - *c_agency
            - *c_account
            - *c_verify
            - *c_attest
            - *c_agency_on
            - *c_service
            - *c_authz
            - *c_authz_ok
            - *c_service_on
          trigger:
            - call: "PUT /portal/services/${svc_id}"
              payload: { max_amount_cents: 900000, expected_service_version: "${svc_v2}" }
              as: AgencyAdmin
              as_user_id: "aa-lead"
            - call: "PUT /portal/services/${svc_id}"
              payload: { max_amount_cents: 800000, expected_service_version: "${svc_v2}" }
              as: AgencyAdmin
              as_user_id: "aa-lead"
              captures: { err_id: $.data.error_id }
          assert:
            - "the first PUT returns 200 and ServiceCatalogItem.${svc_id}.max_amount_cents == 900000, version == 3"
            - "the second PUT returns 412 and err_id == ERR_STALE_VERSION; max_amount_cents stays 900000"

      - name: derived_fields_reconcile_after_refund_approval
        claim_type: derived_field_reconciliation
        grounds:
          - entities.PaymentTransaction.fields.refunded_cents
          - entities.PaymentTransaction.fields.remaining_refundable_cents
          - entities.SettlementBatch.fields.refund_debits_cents
        distinguishing_aspect: "One approval write reconciles two denormalized surfaces atomically: the transaction's refunded/remaining pair and the OPEN batch's refund_debits — both visible in the very next reads."
        test_recipe:
          setup:
            - "CF agency base chain; CAPTURED CARD 100000 transaction; OPEN batch; refund 30000 approved."
          setup_api_calls:
            - *c_clock
            - *c_agency
            - *c_account
            - *c_verify
            - *c_attest
            - *c_agency_on
            - *c_service
            - *c_authz
            - *c_authz_ok
            - *c_service_on
            - *c_payer
            - *c_card
            - *c_quote100k
            - *c_txn
            - *c_capture
            - call: "POST /portal/settlement-batches"
              payload: { agency_id: "${ag_id}", business_date: "2026-09-02" }
              as: PlatformAdmin
              captures: { batch_id: $.data.id }
            - call: "POST /portal/refunds"
              payload: { transaction_id: "${txn_id}", amount_cents: 30000, reason: "overpayment" }
              as: AgencyAdmin
              as_user_id: "aa-lead"
              captures: { ref_id: $.data.id }
          trigger:
            - call: "POST /portal/refunds/${ref_id}/decide"
              payload: { decision: "APPROVE" }
              as: AgencyAdmin
              as_user_id: "aa-peer"
            - call: "GET /portal/payment-transactions/${txn_id}"
              payload: {}
              as: PlatformAdmin
            - call: "GET /portal/settlement-batches/${batch_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "PaymentTransaction.${txn_id}: refunded_cents == 30000 and remaining_refundable_cents == 70000 in the immediate read"
            - "SettlementBatch.${batch_id}.refund_debits_cents == 30000 in the immediate read (still OPEN, not yet closed)"
            - "the transaction's version advanced on the refund approval cascade"

      - name: ops_run_second_period_close_advances_epoch
        claim_type: ops_run_checkpoint
        grounds:
          - calculations.portal_pool_sweep
          - calculations.portal_cost_recognition
          - entities.SelfFundingLedgerEntry
        distinguishing_aspect: "Period closes are epochs: 2026-09 with one 50000 ECHECK capture nets zero (fees 150 == costs 150), then an empty 2026-10 still accrues 200000 amortization while cash recovery stalls at 0 — remaining accrual 11600000 vs remaining cash 12000000."
        test_recipe:
          setup:
            - "CF agency base chain; one ECHECK 50000 transaction captured 2026-09-10; 2026-09 already closed."
          setup_api_calls:
            - *c_clock
            - *c_agency
            - *c_account
            - *c_verify
            - *c_attest
            - *c_agency_on
            - *c_service
            - *c_authz
            - *c_authz_ok
            - *c_service_on
            - *c_payer
            - *c_echeck
            - *c_echeck_ok
            - *c_clk10
            - *c_quote_ech50k
            - *c_txn_ech
            - call: "POST /portal/payment-transactions/${txn_ech}/capture"
              payload: {}
              as: AgencyAdmin
              as_user_id: "aa-lead"
            - call: "POST /portal/self-funding/close-period"
              payload: { period: "2026-09" }
              as: TreasuryOfficer
              captures: { entry_sep: $.data.id }
          trigger:
            - call: "POST /portal/self-funding/close-period"
              payload: { period: "2026-10" }
              as: TreasuryOfficer
              captures: { entry_oct: $.data.id }
          assert:
            - "September entry ${entry_sep}: fees_collected_cents == 150, processing_costs_cents == 150, cash_portal_recovery_cents == 0, surplus_remitted_cents == 0, pool_balance_after_cents == 0, portal_cost_remaining_accrual_cents == 11800000"
            - "October entry ${entry_oct}: fees_collected_cents == 0 and processing_costs_cents == 0 (no captures in the epoch)"
            - "October accrual_portal_recovery_cents == 200000 again while cash_portal_recovery_cents == 0 (empty pool)"
            - "portal_cost_remaining_accrual_cents == 11600000 and portal_cost_remaining_cash_cents == 12000000 — the two bases keep diverging per epoch"

  # ===========================================================================
  - section: consistency
    instances:
      - name: immediate_read_after_write_consistent
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.GET_/portal/payers/{id}
        distinguishing_aspect: "Immediate consistency: the create response and a subsequent GET return byte-identical business fields — no replication lag, no read-your-writes gap."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /portal/payers"
              payload: { full_name: "Pat Parker", email: "pat@example.com", billing_zip: "73102" }
              as: Anonymous
              captures: { payer_id: $.data.id }
            - call: "GET /portal/payers/${payer_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "the GET returns full_name == \"Pat Parker\", email == \"pat@example.com\", billing_zip == \"73102\", version == 1 — identical to the create response"
            - "created_at on the GET equals created_at from the create response exactly"
