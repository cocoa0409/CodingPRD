              captures: { actA_id: $.data.id }
            - call: "POST /ceu-activities/${actA_id}/review"
              payload: { outcome: "APPROVE", review_note: "documentation on file" }
              as: EligibilityReviewer
              as_user_id: "elr-3"
            - call: "POST /recertification-cycles/${cycleB_id}/ceu-activities"
              payload: { activity_date: "2026-07-15T00:00:00Z", category: "LIVE_INSTRUCTION", provider: "State Institute", contact_hours: 12 }
              as: Certificant
              as_user_id: "${candB_id}"
              captures: { errB: $.data.error_id }
          assert:
