      - name: publish_advertisement_from_draft_returns_invalid_state_transition
        claim_type: invalid_transitions
        grounds:
          - state_machines.Advertisement.APPROVED_to_PUBLISHED
          - validations[priority=11]
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: |
          DRAFT has no outgoing `publish` trigger (only `submissions`), so publishing a DRAFT
          advertisement returns 409 ERR_INVALID_STATE_TRANSITION - not the 422 disclosure or
          authority errors, which are never evaluated - and published_at stays null.
        test_recipe:
          setup:
            - "Originator 2200001 with one Advertisement in DRAFT (medium WEB, target CA)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /originators"
              payload: { nmls_unique_id: "2200001", legal_name: "Avery Lane", hire_date: "2024-01-15T00:00:00Z" }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { orig_id: $.data.id }
