- rule_id: priority_pair_validation_conflict
  instances:
  - name: finished_state_precedes_closed_period_on_post
    grounds:
    - validations[priority=5]
    - validations[priority=12]
    - errors[ERR_INVALID_TRANSITION]
    - errors[ERR_PERIOD_CLOSED]
    - endpoints.POST_/transactions/{transactionId}/post
    distinguishing_aspect: 'The dual-failure pair is state versus business_temporal on POST /transactions/{id}/post:
      a REJECTED entry whose value_effective_utc also falls inside a closed accounting period reports ERR_INVALID_TRANSITION
      (409) rather than ERR_PERIOD_CLOSED, because the state precondition is checked at priority 5 and the temporal
      rule at priority 12; the pair is deliberately a different error-category pair from the business_safety-versus-business_constraint
      pair of the sibling instance.'
    test_recipe:
      setup:
      - Logical clock 2026-09-03T00:00:00Z. One manual entry was posted then rejected, and the ledger's period 1
        has since been closed, so the entry violates both the state precondition and the closed-period rule.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
