  instances:
  - name: underwriting_case_failure_revision_loop
    grounds:
    - state_machines.UnderwritingCase.VALIDATING_to_FAILED
    - state_machines.UnderwritingCase.FAILED_to_VALIDATING
    - state_machines.UnderwritingCase.VALIDATED_to_FINALIZED
