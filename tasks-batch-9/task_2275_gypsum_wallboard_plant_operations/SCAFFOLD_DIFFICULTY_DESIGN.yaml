  - rule_id: cross_entity_state_dependency
    instances:

      - name: run_start_blocked_until_calciner_batch_completed
        grounds:
          - state_machines.ProductionRun.status.SCHEDULED_to_RUNNING
          - state_machines.CalcinerBatch.status.CALCINING_to_COMPLETED
          - validations[priority=8]
          - errors[ERR_INVALID_STATE]
          - endpoints[POST /plant-ops/production-runs/{runId}/start]
        distinguishing_aspect: |
          Entity pair ProductionRun -> CalcinerBatch. Scheduling accepts a batch in CALCINING, but
          START additionally requires batch.status == COMPLETED, so the identical start call fails
          with ERR_INVALID_STATE while the batch is still calcining and succeeds unchanged the
          moment a passing StuccoTest completes that batch — the run's own fields never change.
        test_recipe:
          setup:
            - "Plant GYP-1, LINE-1, REGULAR SKU; batch B1 COMPLETED so the silo holds 204.530 t."
            - "Batch B2 fed the rest of lot A and closed, so B2 sits in CALCINING with no stucco test."
            - "Run R2 references B2 and is SCHEDULED (schedule permits a CALCINING batch), reserving 67.500 t."
            - "The logical clock is advanced to the run window start so only the batch state can block the start."
          setup_api_calls:
            - call: "POST /plant-ops/plants"
              payload: { code: "GYP-1", name: "Front Range Wallboard", calciner_capacity_tph: 60, stucco_silo_capacity_tons: 1200, energy_price_per_mmbtu: 4.20, contribution_margin_per_msf: 38.50 }
