# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Municipal Stormwater Permit Program — 26 instances across the 9 rule_ids.
# Every numeric assert below was computed against the §1.3 formulas and their
# constants with Decimal / ROUND_HALF_UP, not estimated.
#
# Shared fixture used by most instances (empty DB -> ACTIVE permit term):
#   PermitTerm MS4-2026-A, 2026-01-01..2026-12-31, tmdl_applicable true,
#   TOTAL_PHOSPHORUS, wla 50.00 lb/yr, eru_sqft 3000; all six minimum control
#   measures; one outfall OF-01; activate. The logical clock is left at its
#   default 2026-08-01T00:00:00Z unless an instance sets it.
# =============================================================================

scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: credit_pool_interim_vs_final_billing_divergence
        grounds:
          - calculations.credit_adjusted_net_fee
          - calculations.stormwater_utility_fee
          - entities.StormwaterAccount.fields.total_credit_pct
          - entities.StormwaterAccount.fields.last_billed_credit_pct
          - entities.FeeCreditApplication.fields.requested_credit_pct
          - state_machines.FeeCreditApplication.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          This instance is the fee-credit variant pair: the INTERIM variant counts a
          still-SUBMITTED application at requested_credit_pct while the FINAL variant
          ignores it, so the same account bills 20485 under INTERIM and 21202 under
          FINAL — a 717-cent divergence produced by variant selection alone.
        test_recipe:
          setup:
            - "ACTIVE permit term MS4-2026-A with eru_sqft 3000 and all six control measures"
            - "one COMMERCIAL account with impervious_area_sqft 9020 -> eru_units 3.01, gross_billable_cents 29264"
            - "credit application A APPROVED at approved_credit_pct 0.2755"
            - "credit application B still SUBMITTED at requested_credit_pct 0.0245"
          setup_api_calls:
            - call: "POST /stormwater/permit-terms"
              payload: { permit_number: "MS4-2026-A", term_start_date: "2026-01-01", term_end_date: "2026-12-31", tmdl_applicable: true, tmdl_pollutant: "TOTAL_PHOSPHORUS", tmdl_wla_lb_per_year: 50.00, eru_sqft: 3000, funding_target_cents: 25000 }
              as: StormwaterProgramManager
              captures: { term_id: $.data.id }
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "PUBLIC_EDUCATION", measurable_goal_target: 12, weight: 1 }
              as: StormwaterProgramManager
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "ILLICIT_DISCHARGE", measurable_goal_target: 20, weight: 3 }
              as: StormwaterProgramManager
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "CONSTRUCTION_RUNOFF", measurable_goal_target: 30, weight: 2 }
              as: StormwaterProgramManager
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "POST_CONSTRUCTION", measurable_goal_target: 8, weight: 2 }
              as: StormwaterProgramManager
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "MUNICIPAL_OPERATIONS", measurable_goal_target: 20, weight: 1, salt_storage_covered: true, fleet_wash_recycle: true }
              as: StormwaterProgramManager
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "MONITORING", measurable_goal_target: 4, weight: 1 }
              as: StormwaterProgramManager
            - call: "POST /stormwater/outfalls"
              payload: { permit_term_id: "${term_id}", outfall_code: "OF-01", receiving_water: "Mill Creek", drainage_area_acres: 45.00, priority_tier: "HIGH", baseline_concentration_mg_per_l: 0.45, design_runoff_kl: 20000, sweeping_capacity_lane_miles_per_month: 40.00 }
              as: StormwaterProgramManager
            - call: "POST /stormwater/permit-terms/${term_id}/activate"
              payload: {}
              as: StormwaterProgramManager
            - call: "POST /stormwater/accounts"
              payload: { permit_term_id: "${term_id}", parcel_id: "P-9020", owner_name: "Harborline Retail LLC", parcel_class: "COMMERCIAL", impervious_area_sqft: 9020 }
              as: UtilityBillingClerk
              captures: { acct_a_id: $.data.id, acct_v1: $.data.version }
            - call: "POST /stormwater/fee-credit-applications"
              payload: { stormwater_account_id: "${acct_a_id}", requested_credit_pct: 0.2755, bmp_description: "Bioretention basin retrofit", expected_stormwater_account_version: "${acct_v1}" }
              as: UtilityBillingClerk
              captures: { app_a_id: $.data.id }
            - call: "GET /stormwater/accounts/${acct_a_id}"
              payload: {}
              as: UtilityBillingClerk
              captures: { acct_v2: $.data.version }
            - call: "POST /stormwater/fee-credit-applications/${app_a_id}/review"
              payload: { decision: "APPROVE", approved_credit_pct: 0.2755 }
              as: UtilityBillingClerk
            - call: "POST /stormwater/fee-credit-applications"
              payload: { stormwater_account_id: "${acct_a_id}", requested_credit_pct: 0.0245, bmp_description: "Permeable parking apron", expected_stormwater_account_version: "${acct_v2}" }
              as: UtilityBillingClerk
              captures: { app_b_id: $.data.id }
          trigger:
            - call: "POST /stormwater/permit-terms/${term_id}/billing-runs"
              payload: { run_type: "INTERIM", period_start: "2026-01-01", period_end: "2026-12-31" }
              as: UtilityBillingClerk
            - call: "POST /stormwater/permit-terms/${term_id}/billing-runs"
              payload: { run_type: "FINAL", period_start: "2026-01-01", period_end: "2026-12-31" }
              as: UtilityBillingClerk
          assert:
            - "INTERIM run response: billed_account_count == 1, total_gross_billable_cents == 29264, total_credit_cents == 8779, total_net_billed_cents == 20485"
            - "FINAL run response: total_gross_billable_cents == 29264, total_credit_cents == 8062, total_net_billed_cents == 21202"
            - "20485 != 21202: the INTERIM variant honours FeeCreditApplication.${app_b_id}.requested_credit_pct 0.0245 (applied pool 0.3000), the FINAL variant does not (applied pool 0.2755)"
            - "StormwaterAccount.${acct_a_id}.total_credit_pct == 0.2755 throughout: the SUBMITTED application never enters the persisted FINAL pool"
            - "StormwaterAccount.${acct_a_id}.last_billed_run_type == FINAL, last_billed_credit_pct == 0.2755, last_billed_net_cents == 21202"
            - "StormwaterAccount.${acct_a_id}.current_net_fee_cents == 21202"

      - name: pollutant_load_provisional_projects_owed_samples_final_does_not
        grounds:
          - calculations.outfall_annual_pollutant_load
          - calculations.sweeping_load_reduction_credit
          - entities.OutfallObservation.fields.sample_load_lb
          - entities.Outfall.fields.tmdl_status
          - state_machines.OutfallObservation.PENDING_to_VALIDATED
        distinguishing_aspect: |
          This instance is the monitoring variant pair on a different calculation and a
          different entity family: with 2 VALIDATED samples of the 4 required, PROVISIONAL
          values the 2 owed samples at 19.8416 lb each and reports gross 127.21 / net 110.21,
          while FINAL reports gross 87.52 / net 70.52 and is the only variant that persists
          Outfall.tmdl_status.
        test_recipe:
          setup:
            - "ACTIVE permit term with tmdl_applicable true and tmdl_wla_lb_per_year 50.00"
            - "outfall OF-01 with baseline_concentration_mg_per_l 0.45 and design_runoff_kl 20000"
            - "two VALIDATED wet-weather samples: 0.45 mg/L over 40000 kL (39.6832 lb) and 0.62 mg/L over 35000 kL (47.8403 lb)"
            - "20.00 lane miles swept in 2026 -> earned credit 17.00 lb"
          setup_api_calls:
            - call: "POST /stormwater/permit-terms"
              payload: { permit_number: "MS4-2026-A", term_start_date: "2026-01-01", term_end_date: "2026-12-31", tmdl_applicable: true, tmdl_pollutant: "TOTAL_PHOSPHORUS", tmdl_wla_lb_per_year: 50.00, eru_sqft: 3000, funding_target_cents: 25000 }
              as: StormwaterProgramManager
              captures: { term_id: $.data.id }
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "PUBLIC_EDUCATION", measurable_goal_target: 12, weight: 1 }
              as: StormwaterProgramManager
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "ILLICIT_DISCHARGE", measurable_goal_target: 20, weight: 3 }
              as: StormwaterProgramManager
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "CONSTRUCTION_RUNOFF", measurable_goal_target: 30, weight: 2 }
              as: StormwaterProgramManager
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "POST_CONSTRUCTION", measurable_goal_target: 8, weight: 2 }
              as: StormwaterProgramManager
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "MUNICIPAL_OPERATIONS", measurable_goal_target: 20, weight: 1, salt_storage_covered: true, fleet_wash_recycle: true }
              as: StormwaterProgramManager
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "MONITORING", measurable_goal_target: 4, weight: 1 }
              as: StormwaterProgramManager
            - call: "POST /stormwater/outfalls"
              payload: { permit_term_id: "${term_id}", outfall_code: "OF-01", receiving_water: "Mill Creek", drainage_area_acres: 45.00, priority_tier: "HIGH", baseline_concentration_mg_per_l: 0.45, design_runoff_kl: 20000, sweeping_capacity_lane_miles_per_month: 40.00 }
              as: StormwaterProgramManager
              captures: { of1_id: $.data.id }
            - call: "POST /stormwater/permit-terms/${term_id}/activate"
              payload: {}
              as: StormwaterProgramManager
            - call: "POST /stormwater/outfalls/${of1_id}/observations"
              payload: { observation_type: "WET_WEATHER_SAMPLE", observed_at: "2026-03-10T14:00:00Z", pollutant_concentration_mg_per_l: 0.45, runoff_volume_kl: 40000 }
              as: IDDEInvestigator
              as_user_id: "idde-01"
              captures: { s1_id: $.data.id }
            - call: "POST /stormwater/outfalls/${of1_id}/observations"
              payload: { observation_type: "WET_WEATHER_SAMPLE", observed_at: "2026-05-22T09:30:00Z", pollutant_concentration_mg_per_l: 0.62, runoff_volume_kl: 35000 }
              as: IDDEInvestigator
              as_user_id: "idde-01"
              captures: { s2_id: $.data.id }
            - call: "POST /stormwater/observations/${s1_id}/validate"
              payload: { decision: "VALIDATE" }
              as: MunicipalOperationsSupervisor
              as_user_id: "ops-01"
            - call: "POST /stormwater/observations/${s2_id}/validate"
              payload: { decision: "VALIDATE" }
              as: MunicipalOperationsSupervisor
              as_user_id: "ops-01"
            - call: "POST /stormwater/outfalls/${of1_id}/sweeping-runs"
              payload: { run_start_date: "2026-04-06", run_end_date: "2026-04-10", lane_miles_swept: 20.00 }
              as: MunicipalOperationsSupervisor
              as_user_id: "ops-01"
          trigger:
            - call: "POST /stormwater/outfalls/${of1_id}/load-assessments"
              payload: { variant: "PROVISIONAL", reporting_year: 2026 }
              as: StormwaterProgramManager
            - call: "POST /stormwater/outfalls/${of1_id}/load-assessments"
              payload: { variant: "FINAL", reporting_year: 2026 }
              as: StormwaterProgramManager
          assert:
            - "PROVISIONAL response: validated_sample_count == 2, projected_sample_count == 2, gross_load_lb == 127.21, sweeping_credit_lb == 17.00, net_load_lb == 110.21, tmdl_status == EXCEEDING"
            - "FINAL response: validated_sample_count == 2, projected_sample_count == 0, gross_load_lb == 87.52, sweeping_credit_lb == 17.00, net_load_lb == 70.52, tmdl_status == EXCEEDING"
            - "127.21 - 87.52 == 39.69 is exactly 2 * 19.8416 rounded into the gross: the projected-sample term is the whole variant difference"
            - "Outfall.${of1_id}.last_assessed_gross_load_lb == 87.52 and last_assessed_net_load_lb == 70.52: the PROVISIONAL call persisted nothing"
            - "Outfall.${of1_id}.tmdl_status == EXCEEDING and last_assessed_year == 2026"
            - "PermitTerm.${term_id}.exceeding_outfall_count == 1 and compliance_posture == AT_RISK after the FINAL call"

  - rule_id: combinatorial_formula
    instances:

      - name: esc_deficiency_score_severity_rainfall_and_acreage_interact
        grounds:
          - calculations.inspection_deficiency_score
          - entities.Inspection.fields.rainfall_trigger
          - entities.ConstructionSite.fields.disturbed_acres
          - state_machines.Inspection.DRAFT_to_FINALIZED
        distinguishing_aspect: |
          Mode (a): four inputs interact in one closed form — three severity counts, the
          rainfall multiplier and the large-site adder — and the multiplier MUST be applied
          before the adder: 1 MINOR + 2 MAJOR on a 6.00-acre site with rainfall scores
          round_half_up(52 * 1.20) + 12 = 74, whereas adder-first gives (52 + 12) * 1.20 = 77.
        test_recipe:
          setup:
            - "ACTIVE permit term with all six control measures"
            - "construction site SITE-BIG with disturbed_acres 6.00, plan_status APPROVED, field_status ACTIVE_DISTURBANCE"
            - "a DRAFT CONSTRUCTION_ESC inspection for 2026-07-01..2026-07-15 with rainfall_trigger true carrying 1 MINOR and 2 MAJOR findings"
          setup_api_calls:
            - call: "POST /stormwater/permit-terms"
              payload: { permit_number: "MS4-2026-A", term_start_date: "2026-01-01", term_end_date: "2026-12-31", tmdl_applicable: true, tmdl_pollutant: "TOTAL_PHOSPHORUS", tmdl_wla_lb_per_year: 50.00, eru_sqft: 3000, funding_target_cents: 25000 }
              as: StormwaterProgramManager
              captures: { term_id: $.data.id }
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "PUBLIC_EDUCATION", measurable_goal_target: 12, weight: 1 }
              as: StormwaterProgramManager
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "ILLICIT_DISCHARGE", measurable_goal_target: 20, weight: 3 }
              as: StormwaterProgramManager
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "CONSTRUCTION_RUNOFF", measurable_goal_target: 30, weight: 2 }
              as: StormwaterProgramManager
              captures: { cr_id: $.data.id }
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "POST_CONSTRUCTION", measurable_goal_target: 8, weight: 2 }
              as: StormwaterProgramManager
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "MUNICIPAL_OPERATIONS", measurable_goal_target: 20, weight: 1, salt_storage_covered: true, fleet_wash_recycle: true }
              as: StormwaterProgramManager
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "MONITORING", measurable_goal_target: 4, weight: 1 }
              as: StormwaterProgramManager
            - call: "POST /stormwater/outfalls"
              payload: { permit_term_id: "${term_id}", outfall_code: "OF-01", receiving_water: "Mill Creek", drainage_area_acres: 45.00, priority_tier: "HIGH", baseline_concentration_mg_per_l: 0.45, design_runoff_kl: 20000, sweeping_capacity_lane_miles_per_month: 40.00 }
              as: StormwaterProgramManager
            - call: "POST /stormwater/permit-terms/${term_id}/activate"
              payload: {}
              as: StormwaterProgramManager
            - call: "POST /stormwater/construction-sites"
              payload: { permit_term_id: "${term_id}", site_name: "SITE-BIG", operator_name: "Northline Builders", disturbed_acres: 6.00 }
              as: ConstructionInspector
              as_user_id: "insp-01"
              captures: { site_big_id: $.data.id }
            - call: "POST /stormwater/construction-sites/${site_big_id}/submit-esc-plan"
              payload: { esc_plan_reference: "ESC-BIG-1" }
              as: ConstructionInspector
              as_user_id: "insp-01"
            - call: "POST /stormwater/construction-sites/${site_big_id}/esc-review"
              payload: { decision: "APPROVE", review_notes: "Perimeter controls adequate" }
              as: ConstructionInspector
              as_user_id: "insp-01"
            - call: "POST /stormwater/inspections"
              payload: { inspection_type: "CONSTRUCTION_ESC", period_start: "2026-07-01", period_end: "2026-07-15", construction_site_id: "${site_big_id}", rainfall_trigger: true }
              as: ConstructionInspector
              as_user_id: "insp-01"
              captures: { insp_big_id: $.data.id }
            - call: "POST /stormwater/inspections/${insp_big_id}/findings"
              payload: { severity: "MINOR", description: "Tracking pad undersized" }
              as: ConstructionInspector
              as_user_id: "insp-01"
            - call: "POST /stormwater/inspections/${insp_big_id}/findings"
              payload: { severity: "MAJOR", description: "Silt fence undermined at east boundary" }
              as: ConstructionInspector
              as_user_id: "insp-01"
            - call: "POST /stormwater/inspections/${insp_big_id}/findings"
              payload: { severity: "MAJOR", description: "Concrete washout unlined" }
              as: ConstructionInspector
              as_user_id: "insp-01"
          trigger:
            - call: "POST /stormwater/inspections/${insp_big_id}/finalize"
              payload: {}
              as: ConstructionInspector
              as_user_id: "insp-01"
          assert:
            - "Inspection.${insp_big_id}.minor_finding_count == 1, major_finding_count == 2, critical_finding_count == 0"
            - "Inspection.${insp_big_id}.deficiency_score == 74 (base 8 + 44 = 52, round_half_up(52 * 1.20) = 62, plus LARGE_SITE_ADDER 12)"
            - "Inspection.${insp_big_id}.deficiency_score != 77, the adder-before-multiplier result"
            - "Inspection.${insp_big_id}.escalation_triggered == true and status == FINALIZED"
            - "ConstructionSite.${site_big_id}.field_status == STOP_WORK and open_deficiency_score == 74"
            - "ControlMeasure.${cr_id}.enforcement_count == 1"

      - name: utility_fee_rounds_each_tier_component_before_summing
        grounds:
          - calculations.stormwater_utility_fee
          - entities.StormwaterAccount.fields.eru_units
          - entities.StormwaterAccount.fields.gross_fee_cents
          - entities.StormwaterAccount.fields.class_surcharge_cents
        distinguishing_aspect: |
          Mode (b): rounding order is outcome-bearing. A COMMERCIAL parcel of 9020 sqft
          straddles tiers 1 and 2 at eru_units 3.01; rounding each tier component first
          yields gross_billable_cents 29264, while summing the raw products and rounding
          once at the end yields 29265.
        test_recipe:
          setup:
            - "ACTIVE permit term with eru_sqft 3000, RATE_TIER1 9633, RATE_TIER2 8207, RATE_TIER3 6541"
            - "no accounts yet"
          setup_api_calls:
            - call: "POST /stormwater/permit-terms"
              payload: { permit_number: "MS4-2026-A", term_start_date: "2026-01-01", term_end_date: "2026-12-31", tmdl_applicable: false, eru_sqft: 3000, funding_target_cents: 25000 }
              as: StormwaterProgramManager
              captures: { term_id: $.data.id }
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "PUBLIC_EDUCATION", measurable_goal_target: 12, weight: 1 }
              as: StormwaterProgramManager
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "ILLICIT_DISCHARGE", measurable_goal_target: 20, weight: 3 }
              as: StormwaterProgramManager
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "CONSTRUCTION_RUNOFF", measurable_goal_target: 30, weight: 2 }
              as: StormwaterProgramManager
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "POST_CONSTRUCTION", measurable_goal_target: 8, weight: 2 }
              as: StormwaterProgramManager
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "MUNICIPAL_OPERATIONS", measurable_goal_target: 20, weight: 1, salt_storage_covered: true, fleet_wash_recycle: true }
              as: StormwaterProgramManager
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "MONITORING", measurable_goal_target: 4, weight: 1 }
              as: StormwaterProgramManager
            - call: "POST /stormwater/permit-terms/${term_id}/activate"
              payload: {}
              as: StormwaterProgramManager
          trigger:
            - call: "POST /stormwater/accounts"
              payload: { permit_term_id: "${term_id}", parcel_id: "P-9020", owner_name: "Harborline Retail LLC", parcel_class: "COMMERCIAL", impervious_area_sqft: 9020 }
              as: UtilityBillingClerk
              captures: { acct_a_id: $.data.id }
            - call: "POST /stormwater/accounts"
              payload: { permit_term_id: "${term_id}", parcel_id: "P-15400", owner_name: "Ridge Academy", parcel_class: "INSTITUTIONAL", impervious_area_sqft: 15400 }
              as: UtilityBillingClerk
              captures: { acct_c_id: $.data.id }
          assert:
            - "StormwaterAccount.${acct_a_id}.eru_units == 3.01"
            - "StormwaterAccount.${acct_a_id}.gross_fee_cents == 26129 (9633 + 16496 + 0, each component rounded first)"
            - "StormwaterAccount.${acct_a_id}.class_surcharge_cents == 3135 and gross_billable_cents == 29264"
            - "StormwaterAccount.${acct_a_id}.gross_billable_cents != 29265, the sum-then-round-once result"
            - "StormwaterAccount.${acct_c_id}.eru_units == 5.13, gross_fee_cents == 41645 (9633 + 24621 + 7391), class_surcharge_cents == 3332, gross_billable_cents == 44977"
            - "PermitTerm.${term_id}.projected_annual_revenue_cents == 74241 (29264 + 44977) and funding_adequacy_status == ADEQUATE"

      - name: penalty_multiplier_excludes_the_escalating_action_itself
        grounds:
          - calculations.enforcement_penalty_assessment
          - entities.EnforcementAction.fields.prior_assessed_total_cents
          - entities.EnforcementAction.fields.escalation_multiplier
          - state_machines.EnforcementAction.ISSUED_to_ESCALATED
          - validations[priority=80]
        distinguishing_aspect: |
          Mode (c): the escalation multiplier reads the penalties of OTHER actions on the same
          subject only. Escalating the sole NOTICE_OF_VIOLATION (65000) on a site to
          ADMINISTRATIVE_ORDER with 25 violation days must recompute at multiplier 1.00 ->
          100000; including its own prior 65000 would select 1.50 -> 150000.
        test_recipe:
          setup:
            - "ACTIVE permit term with all six control measures"
            - "construction site SITE-A in field_status ACTIVE_DISTURBANCE with exactly one enforcement action"
            - "NOTICE_OF_VIOLATION issued at clock 2026-08-01T00:00:00Z with violation_days 20 -> penalty_cents 65000"
            - "clock advanced to 2026-08-16T00:00:00Z, 15 days later, clearing the 14-day cooling-off period"
          setup_api_calls:
            - call: "POST /stormwater/permit-terms"
              payload: { permit_number: "MS4-2026-A", term_start_date: "2026-01-01", term_end_date: "2026-12-31", tmdl_applicable: false, eru_sqft: 3000, funding_target_cents: 25000 }
              as: StormwaterProgramManager
              captures: { term_id: $.data.id }
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "PUBLIC_EDUCATION", measurable_goal_target: 12, weight: 1 }
              as: StormwaterProgramManager
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "ILLICIT_DISCHARGE", measurable_goal_target: 20, weight: 3 }
              as: StormwaterProgramManager
            - call: "POST /stormwater/control-measures"
