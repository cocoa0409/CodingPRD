            - call: "POST /racks"
              payload: { hall_id: "${hall_id}", containment_zone_id: "${zone1_id}", grid_row: "1", grid_col: 1, design_kw: 10.00, u_height: 45, required_feed_count: 2, cage_id: "${cage_id}", tenant_id: "${t1_id}" }
              as: FacilityPlanner
              captures: { rack1_id: $.data.id }
          trigger:
            - call: "GET /racks?hall_id=${hall_id}"
              payload: {}
