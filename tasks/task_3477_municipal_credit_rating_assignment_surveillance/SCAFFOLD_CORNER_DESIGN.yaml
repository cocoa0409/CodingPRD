        distinguishing_aspect: "The BBB anchor threshold at 3.0000 is inclusive: scores (3,3,3,3,3,3) land exactly on 3.0000 -> BBB, while (3,3,3,3,3,2) at 2.8500 falls to BB — the BBB/BB boundary complement of the §1.8 A-boundary instance."
