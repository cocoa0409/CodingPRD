              payload: { per_unit_monthly_fee_cents: 3495, property_revenue_share_bps: 1500, service_night_days: ["SUN", "MON", "TUE", "WED", "THU"], effective_from: "2026-09-01", effective_to: "2027-08-31", sla_missed_threshold_bps: 1000 }
              as: BillingAnalyst
              as_user_id: "analyst-drafter"
              captures: { contractA_id: $.data.id }
            - call: "POST /valet/properties/${propB_id}/contracts"
              payload: { per_unit_monthly_fee_cents: 2995, property_revenue_share_bps: 1000, service_night_days: ["MON", "WED", "FRI"], effective_from: "2026-09-01", effective_to: "2027-08-31", sla_missed_threshold_bps: 1500 }
