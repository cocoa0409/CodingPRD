  # =====================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: device_single_occupancy_halfopen_span
        grounds:
          - validations[priority=11]
          - state_machines.StreamSession.none_to_ACTIVE
          - errors[ERR_DEVICE_BUSY]
          - entities.StreamSession.fields.started_at_min
        distinguishing_aspect: "DEVICE-resource overlap with a forward half-open span [started_at_min, started_at_min + runtime): a second stream on the same device whose start minute falls inside the first session's projected interval is ERR_DEVICE_BUSY; a start exactly at interval end does NOT collide."
        test_recipe:
          setup:
            - "ACTIVE account, two profiles share one device; concurrent_stream_cap high enough; first session started at minute 720 on a 60-min title (interval [720,780))."
          setup_api_calls:
            - call: "POST /subscription-plans"
              payload: { tier: "PREMIUM", monthly_fee_cents: 1000, max_profiles: 6, concurrent_stream_cap: 4, max_registered_devices: 8, download_quota_per_profile: 10, ad_free: true, hd_offline_allowed: true }
