            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /incidents/${inc}/transition", payload: { to: "RESOLVED" }, as: SiteOperator, as_user_id: "op-bob" }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-13T00:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /incidents/${inc}/transition", payload: { to: "REOPENED" }, as: SiteOperator, as_user_id: "op-bob", captures: { rc: $.data.reopened_count } }
            - { call: "POST /incidents/${inc}/transition", payload: { to: "INVESTIGATING" }, as: SiteOperator, as_user_id: "op-alice" }
            - { call: "POST /incidents/${inc}/transition", payload: { to: "RESOLVED" }, as: SiteOperator, as_user_id: "op-bob" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-16T00:00:01Z" }, as: NetworkAdmin }
            - { call: "POST /incidents/${inc}/transition", payload: { to: "REOPENED" }, as: SiteOperator, as_user_id: "op-bob", captures: { err: $.data.error_id } }
