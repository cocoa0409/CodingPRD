# =============================================================================
# Task 2288 — Recreational Vehicle Assembly Plant
# Seed tables §1.0–§1.7. Difficulty band: beyond Expert (§0.4).
# All resources are root-level collections (flat/graph topology), so
# api_prefix is empty and every §1.5 path is absolute.
# =============================================================================

scenario: |
  2288. Recreational Vehicle Assembly Plant (recreational vehicle manufacturer): chassis receipt from suppliers with configuration matching to unit orders, floor plan and option complexity with dealer-ordered custom configurations, line-based assembly with sidewall lamination, roof installation and systems rough-in, appliance, plumbing and electrical installation with leak and functional testing before shipment, quality inspection with water test booth and pre-delivery inspection standards, dealer allocation, production slot assignment and floor plan financing interaction, warranty claim processing through dealers with parts supply and goodwill authority, recall administration on components sourced from suppliers

domain_name: rv-assembly-plant
api_prefix: ""

complexity_profile:
  primary_archetype: quota / allocation
  secondary_archetype: workflow orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy
    - ops_run_checkpoint

  entity_topology: graph
  # OptionItem references other OptionItem codes (requires/excludes closure);
  # ComponentInstallation is a UnitBuild x ComponentLot junction that a
  # RecallCampaign re-labels; UnitOrder / ProductionSlot / ChassisReceipt form a
  # cross-aggregate triangle. No URL nesting — every collection is root-level.

  state_machine_shape: parallel
  # UnitOrder carries two independent dimensions (status x financing_status);
  # UnitBuild.current_station is cyclic (water-test / PDI rework loops);
  # QualityInspection completion is branching (PASS / CONDITIONAL / FAIL with
  # divergent side-effect sets).

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Supplier
    parent: null
    common_fields: true
    fields:
      - name: supplier_code
        type: string
        source: input
        description: External supplier identifier
        constraints: "unique across Supplier; 3-16 chars"
      - name: name
        type: string
        source: input
        description: Legal supplier name
      - name: component_categories
        type: array
        source: input
        description: Categories this supplier is approved to ship
        constraints: "non-empty; members of {CHASSIS, APPLIANCE, PLUMBING, ELECTRICAL}"
      - name: quality_score
        type: number
        source: computed
        description: "ROLLING_90D variant of calculations.supplier_quality_score; recomputed on every penalty event and on every read of GET /suppliers/{id}/scorecard"
        default: 100.00
        constraints: "2 decimals, floor 0.00, ceiling 100.00"
      - name: supplier_status
        type: enum
        source: computed
        description: "Derived from quality_score thresholds (>=70 ACTIVE, 50.00-69.99 PROBATION, <50 SUSPENDED)"
        default: ACTIVE
        constraints: "ACTIVE | PROBATION | SUSPENDED"
      - name: open_recall_count
        type: integer
        source: computed
        description: Count of RecallCampaign rows for this supplier with status OPEN
        default: 0
      - name: penalty_event_count
        type: integer
        source: computed
        description: Count of penalty events (opened recalls + chargeback-bearing decided claims) attributed to this supplier, lifetime
        default: 0

  - name: FloorPlan
    parent: null
    common_fields: true
    fields:
      - name: model_code
        type: string
        source: input
        description: Model/floor-plan code printed on the build sheet
        constraints: "unique across FloorPlan"
      - name: chassis_class
        type: enum
        source: input
        description: Chassis family this floor plan is built on
        constraints: "CLASS_A | CLASS_C | TOWABLE"
      - name: length_ft
        type: integer
        source: input
        description: Overall coach length in feet, used by the freight formula
        constraints: "18-45"
      - name: base_msrp_cents
        type: integer
        source: input
        description: Base-unit MSRP in cents before options
        constraints: "> 0"
      - name: base_station_hours
        type: number
        source: input
        description: Standard direct labour hours for the base unit
        constraints: "> 0, 2 decimals"
      - name: base_dry_weight_lbs
        type: integer
        source: input
        description: Dry weight of the base unit
        constraints: "> 0"
      - name: gvwr_lbs
        type: integer
        source: input
        description: Gross vehicle weight rating
        constraints: "> base_dry_weight_lbs"
      - name: required_wheelbase_in
        type: integer
        source: input
        description: Exact chassis wheelbase this floor plan mounts on
        constraints: "> 0"
      - name: electrical_service_amps
        type: integer
        source: input
        description: Shore-power service rating in amps
        constraints: "30 | 50"
      - name: fresh_water_capacity_gal
        type: integer
        source: input
        description: Fresh-water tank capacity in gallons
        constraints: "> 0"
      - name: max_payload_lbs
        type: integer
        source: computed
        description: "gvwr_lbs - base_dry_weight_lbs"
      - name: status
        type: enum
        source: input
        description: Orderability of this floor plan
        default: ACTIVE
        constraints: "ACTIVE | RETIRED"

  - name: OptionItem
    parent: null
    common_fields: true
    fields:
      - name: option_code
        type: string
        source: input
        description: Option code on the dealer order sheet
        constraints: "unique across OptionItem"
      - name: category
        type: enum
        source: input
        description: Commercial/installation category, selects the dealer discount basis points
        constraints: "APPLIANCE | PLUMBING | ELECTRICAL | EXTERIOR | INTERIOR | CHASSIS_UPGRADE"
      - name: install_station
        type: enum
        source: input
        description: Assembly station where this option is installed
        constraints: "SIDEWALL_LAM | ROOF_SET | ROUGH_IN | APPLIANCE_INSTALL | FINISH"
      - name: price_cents
        type: integer
        source: input
        description: Option MSRP in cents
        constraints: ">= 0"
      - name: weight_lbs
        type: integer
        source: input
        description: Installed weight, consumed by the payload safety check
        constraints: ">= 0"
      - name: added_station_hours
        type: number
        source: input
        description: Incremental direct labour hours
        constraints: ">= 0, 2 decimals"
      - name: amp_draw
        type: integer
        source: input
        description: Steady-state amp draw on the shore-power service
        default: 0
      - name: water_demand_gal
        type: integer
        source: input
        description: Plumbed fresh-water demand in gallons
        default: 0
      - name: requires_option_codes
        type: array
        source: input
        description: "Self-referential: OptionItem.option_code values that MUST also be present when this option is selected (transitively closed by validations)"
        default: []
      - name: excludes_option_codes
        type: array
        source: input
        description: "Self-referential: OptionItem.option_code values that MUST NOT be present when this option is selected"
        default: []
      - name: status
        type: enum
        source: input
        description: Orderability of this option
        default: ACTIVE
        constraints: "ACTIVE | DISCONTINUED"

  - name: Dealer
    parent: null
    common_fields: true
    fields:
      - name: dealer_code
        type: string
        source: input
        description: Dealer identifier
        constraints: "unique across Dealer"
      - name: region
        type: enum
        source: input
        description: Freight/surcharge region
        constraints: "WEST | CENTRAL | EAST | SOUTH"
      - name: allocation_share_bp
        type: integer
        source: input
        description: Basis points of plant monthly station-hour capacity allocated to this dealer
        constraints: "1-10000"
      - name: floor_plan_credit_limit_cents
        type: integer
        source: input
        description: Floor-plan financing credit line in cents
        constraints: "> 0"
      - name: goodwill_budget_cents
        type: integer
        source: input
        description: Annual goodwill authority pool for this dealer's warranty claims
        constraints: ">= 0"
      - name: status
        type: enum
        source: input
        description: Dealer agreement lifecycle
        default: ACTIVE
        constraints: "ACTIVE | SUSPENDED"
      - name: financed_exposure_cents
        type: integer
        source: computed
        description: "calculations.dealer_credit_utilization: sum over this dealer's UnitOrder rows with financing_status IN {FLOOR_PLAN_FUNDED, CURTAILED} of (financed_principal_cents - curtailment_paid_cents)"
        default: 0
      - name: credit_utilization_bp
        type: integer
        source: computed
        description: "floor(financed_exposure_cents * 10000 / floor_plan_credit_limit_cents)"
        default: 0
      - name: credit_status
        type: enum
        source: computed
        description: "Threshold classification of credit_utilization_bp (<=8000 GOOD_STANDING, 8001-9500 WATCH, >9500 CREDIT_HOLD)"
        default: GOOD_STANDING
        constraints: "GOOD_STANDING | WATCH | CREDIT_HOLD"
      - name: goodwill_used_cents
        type: integer
        source: computed
        description: Sum of goodwill_authorized_cents over this dealer's WarrantyClaim rows with status IN {APPROVED, PAID}
        default: 0
      - name: entitlement_hours
        type: number
        source: computed
        description: "calculations.dealer_slot_entitlement monthly station-hour entitlement"
        default: 0.00
      - name: allocation_hours_consumed
        type: number
        source: computed
        description: Sum of station_hours_committed over this dealer's ProductionSlot rows with status IN {RESERVED, CONSUMED} whose slot_date falls in the current logical-clock calendar month
        default: 0.00
      - name: allocation_slots_reserved
        type: integer
        source: computed
        description: Count of this dealer's ProductionSlot rows with status IN {RESERVED, CONSUMED}
        default: 0

  - name: UnitOrder
    parent: null
    common_fields: true
    fields:
      - name: dealer_id
        type: string
        source: input
        description: "FK -> Dealer.id; the ordering dealer"
      - name: floor_plan_id
        type: string
        source: input
        description: "FK -> FloorPlan.id; the ordered floor plan"
      - name: order_type
        type: enum
        source: input
        description: Commercial order type, selects the base-unit discount and the pre-ship financing gate
        constraints: "STOCK | SOLD | DEMO"
      - name: customer_reference
        type: string
        source: input
        description: Retail customer reference for SOLD orders
        default: null
      - name: selected_option_ids
        type: array
        source: input
        description: Ordered list of OptionItem.id values selected by the dealer (duplicates rejected)
        default: []
      - name: requested_delivery_date
        type: datetime
        source: input
        description: Dealer-requested delivery date (date at 00:00:00Z)
      - name: status
        type: enum
        source: computed
        description: Build-progress dimension of the order
        default: DRAFT
        constraints: "DRAFT | CONFIG_VALIDATED | SLOTTED | IN_PRODUCTION | BUILT | SHIPPED | CANCELLED"
      - name: financing_status
        type: enum
        source: computed
        description: Floor-plan financing dimension of the order, independent of status
        default: NOT_FINANCED
        constraints: "NOT_FINANCED | FUNDING_REQUESTED | FLOOR_PLAN_FUNDED | CURTAILED | PAID_OFF"
      - name: option_price_total_cents
        type: integer
        source: computed
        description: Sum of price_cents over selected options at MSRP
        default: 0
      - name: config_weight_lbs
        type: integer
        source: computed
        description: "floor_plan.base_dry_weight_lbs + sum of selected option weight_lbs"
        default: 0
      - name: payload_remaining_lbs
        type: integer
        source: computed
        description: "floor_plan.gvwr_lbs - config_weight_lbs"
        default: 0
      - name: total_amp_draw
        type: integer
        source: computed
        description: Sum of amp_draw over selected options
        default: 0
      - name: total_water_demand_gal
        type: integer
        source: computed
        description: Sum of water_demand_gal over selected options
        default: 0
      - name: required_station_hours
        type: number
        source: computed
        description: "calculations.unit_order_configuration_totals output; the quantity a ProductionSlot commits"
        default: 0.00
      - name: provisional_invoice_cents
        type: integer
        source: computed
        description: "calculations.dealer_invoice_amount variant PROVISIONAL_AT_SUBMIT"
        default: 0
      - name: final_invoice_cents
        type: integer
        source: computed
        description: "calculations.dealer_invoice_amount variant FINAL_AT_SHIP; null until the order ships"
        default: null
      - name: locked_floor_plan_version
        type: integer
        source: computed
        description: FloorPlan.version pinned at submit
        default: null
      - name: locked_option_versions
        type: array
        source: computed
        description: "Array of { option_id, version, price_cents } pinned at submit; the FINAL invoice reprices from these pinned price_cents"
        default: []
      - name: financed_principal_cents
        type: integer
        source: computed
        description: Advance amount booked at funding approval
        default: 0
      - name: curtailment_paid_cents
        type: integer
        source: computed
        description: Cumulative curtailment principal paid down
        default: 0
      - name: curtailment_due_cents
        type: integer
        source: computed
        description: "calculations.floor_plan_curtailment_due at the current logical clock"
        default: 0
      - name: funded_at
        type: datetime
        source: computed
        description: Logical-clock instant of funding approval
        default: null
      - name: shipped_at
        type: datetime
        source: computed
        description: Logical-clock instant of shipment; warranty coverage runs from here
        default: null
      - name: ship_hold_reason
        type: enum
        source: computed
        description: Active shipment hold on this order
        default: NONE
        constraints: "NONE | RECALL_HOLD | QUALITY_HOLD"

  - name: ProductionLine
    parent: null
    common_fields: true
    fields:
      - name: line_code
        type: string
        source: input
        description: Line identifier
        constraints: "unique across ProductionLine"
      - name: chassis_class_supported
        type: enum
        source: input
        description: The single chassis class this line is tooled for
        constraints: "CLASS_A | CLASS_C | TOWABLE"
      - name: daily_station_hour_capacity
        type: number
        source: input
        description: Station hours available per calendar day on this line
        constraints: "> 0, 2 decimals"
      - name: max_units_per_day
        type: integer
        source: input
        description: Hard unit count cap per calendar day regardless of hours
        constraints: ">= 1"
      - name: status
        type: enum
        source: input
        description: Line running state; PAUSED blocks station advancement
        default: RUNNING
        constraints: "RUNNING | PAUSED"

  - name: ProductionSlot
    parent: null
    common_fields: true
    fields:
      - name: line_id
        type: string
        source: input
        description: "FK -> ProductionLine.id; the line this slot occupies"
      - name: unit_order_id
        type: string
        source: system
        description: "FK -> UnitOrder.id; the order this slot is reserved for (taken from the path, never from the body)"
      - name: slot_date
        type: datetime
        source: input
        description: Calendar day (00:00:00Z) the unit occupies the line
      - name: sequence_position
        type: integer
        source: computed
        description: "1-based build sequence within (line_id, slot_date): occupied_units + 1 at reservation time"
      - name: station_hours_committed
        type: number
        source: computed
        description: Copied from UnitOrder.required_station_hours at reservation
      - name: expires_at
        type: datetime
        source: computed
        description: "created_at + 72h; a RESERVED slot at or past this instant is released by POST /daily-close"
      - name: status
        type: enum
        source: computed
        description: Slot occupancy state
        default: RESERVED
        constraints: "RESERVED | CONSUMED | RELEASED"

  - name: ChassisReceipt
    parent: null
    common_fields: true
    fields:
      - name: supplier_id
        type: string
        source: input
        description: "FK -> Supplier.id; the chassis supplier"
      - name: chassis_serial
        type: string
        source: input
        description: Supplier chassis serial
        constraints: "unique across ChassisReceipt"
      - name: chassis_class
        type: enum
        source: input
        description: Chassis family as received
        constraints: "CLASS_A | CLASS_C | TOWABLE"
      - name: gvwr_lbs
        type: integer
        source: input
        description: Rated GVWR of the received chassis
        constraints: "> 0"
      - name: wheelbase_in
        type: integer
        source: input
        description: Wheelbase as received; must equal the floor plan's required_wheelbase_in to match
        constraints: "> 0"
      - name: received_at
        type: datetime
        source: computed
        description: Logical-clock instant of receipt; primary FIFO ranking key of the matching selector
      - name: matched_unit_order_id
        type: string
        source: computed
        description: "FK -> UnitOrder.id; set when the chassis is matched to an order, cleared when the order releases it"
        default: null
      - name: status
        type: enum
        source: computed
        description: Chassis intake state
        default: RECEIVED
        constraints: "RECEIVED | MATCHED | INSTALLED"

  - name: ComponentLot
    parent: null
    common_fields: true
    fields:
      - name: supplier_id
        type: string
        source: input
        description: "FK -> Supplier.id; the lot's supplier"
      - name: part_number
        type: string
        source: input
        description: Manufacturer part number
      - name: lot_code
        type: string
        source: input
        description: Supplier lot/date code, the unit of recall scope
        constraints: "unique per (supplier_id, part_number)"
      - name: category
        type: enum
        source: input
        description: Component category; must be a member of the supplier's component_categories
        constraints: "CHASSIS | APPLIANCE | PLUMBING | ELECTRICAL"
      - name: quantity_received
        type: integer
        source: input
        description: Pieces received in this lot
        constraints: "> 0"
      - name: quantity_available
        type: integer
        source: computed
        description: Pieces still installable
        default: 0
      - name: quantity_installed
        type: integer
        source: computed
        description: Pieces consumed by ComponentInstallation rows with status IN {INSTALLED, RECALL_AFFECTED, REMEDIED}
        default: 0
      - name: quantity_quarantined
        type: integer
        source: computed
        description: Pieces frozen by a recall campaign
        default: 0
      - name: status
        type: enum
        source: computed
        description: Lot availability state
        default: AVAILABLE
        constraints: "AVAILABLE | DEPLETED | QUARANTINED"

  - name: UnitBuild
    parent: null
    common_fields: true
    fields:
      - name: unit_order_id
        type: string
        source: system
        description: "FK -> UnitOrder.id; the order being built"
      - name: chassis_receipt_id
        type: string
        source: system
        description: "FK -> ChassisReceipt.id; the chassis consumed by this build"
      - name: vin
        type: string
        source: computed
        description: "floor_plan.model_code + '-' + build_sequence zero-padded to 6 digits"
      - name: build_sequence
        type: integer
        source: computed
        description: Plant-wide monotonic build counter, 1-based in UnitBuild creation order
      - name: current_station
        type: enum
        source: computed
        description: Position on the assembly line; rework moves it backwards
        default: CHASSIS_PREP
        constraints: "CHASSIS_PREP | SIDEWALL_LAM | ROOF_SET | ROUGH_IN | APPLIANCE_INSTALL | FINISH | WATER_TEST | PDI | READY_TO_SHIP | SHIPPED | SCRAPPED"
      - name: actual_station_hours
        type: number
        source: computed
        description: Cumulative station_hours_used reported by advancements, including rework loops
        default: 0.00
      - name: rework_count
        type: integer
        source: computed
        description: Number of failed inspections that pushed the unit backwards
        default: 0
      - name: defect_points_total
        type: integer
        source: computed
        description: Cumulative defect points over all COMPLETED inspections
        default: 0
      - name: water_test_passed
        type: boolean
        source: computed
        description: True when the latest COMPLETED WATER_TEST inspection resulted in PASS or CONDITIONAL
        default: false
      - name: pdi_passed
        type: boolean
        source: computed
        description: True when the latest COMPLETED PDI inspection resulted in PASS or CONDITIONAL
        default: false
      - name: recall_hold
        type: boolean
        source: computed
        description: True while any ComponentInstallation on this build has status RECALL_AFFECTED
        default: false

  - name: ComponentInstallation
    parent: null
    common_fields: true
    fields:
      - name: unit_build_id
        type: string
        source: input
        description: "FK -> UnitBuild.id; the build receiving the components"
      - name: component_lot_id
        type: string
        source: input
        description: "FK -> ComponentLot.id; the lot the pieces came from"
      - name: station
        type: enum
        source: input
        description: Station at which the pieces were installed
        constraints: "SIDEWALL_LAM | ROOF_SET | ROUGH_IN | APPLIANCE_INSTALL | FINISH"
      - name: quantity
        type: integer
        source: input
        description: Pieces installed
        constraints: ">= 1"
      - name: recall_campaign_id
        type: string
        source: computed
        description: "FK -> RecallCampaign.id; set when a campaign labels this installation"
        default: null
      - name: status
        type: enum
        source: computed
        description: Installation state
        default: INSTALLED
        constraints: "INSTALLED | REVERSED | RECALL_AFFECTED | REMEDIED"

  - name: TestBooth
    parent: null
    common_fields: true
    fields:
      - name: booth_code
        type: string
        source: input
        description: Booth identifier
        constraints: "unique across TestBooth"
      - name: booth_type
        type: enum
        source: input
        description: The single inspection type this booth serves
        constraints: "WATER_TEST | FUNCTIONAL"
      - name: bay_count
        type: integer
        source: input
        description: Count of bays the booth can hold occupied within one window
        constraints: ">= 1"
      - name: turnaround_minutes
        type: integer
        source: input
        description: Mandatory dry-out/turnaround minutes appended to every reservation before the bay frees up
        default: 30
        constraints: ">= 0"
      - name: status
        type: enum
        source: input
        description: Booth availability
        default: OPEN
        constraints: "OPEN | DOWN"

  - name: QualityInspection
    parent: null
    common_fields: true
    fields:
      - name: unit_build_id
        type: string
        source: input
        description: "FK -> UnitBuild.id; the inspected build"
      - name: test_booth_id
        type: string
        source: input
        description: "FK -> TestBooth.id; required for WATER_TEST and FUNCTIONAL, must be omitted for PDI"
        default: null
      - name: inspection_type
        type: enum
        source: input
        description: Inspection standard applied
        constraints: "WATER_TEST | FUNCTIONAL | PDI"
      - name: window_start
        type: datetime
        source: input
        description: Booth window start (inclusive); required for WATER_TEST and FUNCTIONAL
        default: null
      - name: window_end
        type: datetime
        source: input
        description: Booth window end (exclusive); required for WATER_TEST and FUNCTIONAL
        default: null
      - name: inspector_user_id
        type: string
        source: system
        description: X-User-ID of the QualityInspector who created the inspection
      - name: completed_by_user_id
        type: string
        source: system
        description: X-User-ID of the QualityInspector who completed the inspection
        default: null
      - name: defect_points
        type: integer
        source: input
        description: Defect points recorded at completion
        default: 0
        constraints: ">= 0"
      - name: leak_detected
        type: boolean
        source: input
        description: Water intrusion observed at completion
        default: false
      - name: result
        type: enum
        source: computed
        description: Graded outcome from defect_points and leak_detected per calculations.inspection_grade
        default: null
        constraints: "PASS | CONDITIONAL | FAIL"
      - name: status
        type: enum
        source: computed
        description: Inspection lifecycle
        default: SCHEDULED
        constraints: "SCHEDULED | COMPLETED"

  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - name: dealer_id
        type: string
        source: system
        description: "FK -> Dealer.id; taken from the submitting DealerPrincipal's X-User-ID"
      - name: unit_build_id
        type: string
        source: input
        description: "FK -> UnitBuild.id; the delivered unit being claimed against"
      - name: component_lot_id
        type: string
        source: input
        description: "FK -> ComponentLot.id; the failed part's lot, drives supplier chargeback; null when unknown"
        default: null
      - name: claim_type
        type: enum
        source: input
        description: Flat-rate labour schedule selector
        constraints: "APPLIANCE | PLUMBING | ELECTRICAL | STRUCTURAL | WATER_INTRUSION"
      - name: labor_hours
        type: number
        source: input
        description: Claimed labour hours, capped by LABOR_HOUR_CAP in the reimbursement formula
        constraints: "> 0, 2 decimals"
      - name: parts_cost_cents
        type: integer
        source: input
        description: Dealer parts cost in cents before handling uplift
        constraints: ">= 0"
      - name: goodwill_requested_cents
        type: integer
        source: input
        description: Goodwill amount the dealer asks for on top of schedule reimbursement
        default: 0
        constraints: ">= 0"
      - name: narrative
        type: string
        source: input
        description: Failure narrative
      - name: in_warranty
        type: boolean
        source: computed
        description: "clock_now - unit_order.shipped_at <= WARRANTY_DAYS"
        default: false
      - name: labor_reimbursement_cents
        type: integer
        source: computed
        description: Step 2 of calculations.warranty_claim_reimbursement
        default: 0
      - name: parts_reimbursement_cents
        type: integer
        source: computed
        description: Step 3 of calculations.warranty_claim_reimbursement
        default: 0
      - name: authority_tier
        type: enum
        source: computed
        description: Goodwill authority tier keyed on the schedule subtotal
        default: null
        constraints: "TIER_A | TIER_B | TIER_C"
      - name: goodwill_authorized_cents
        type: integer
        source: computed
        description: Step 5 of calculations.warranty_claim_reimbursement
        default: 0
      - name: total_reimbursement_cents
        type: integer
        source: computed
        description: Step 6 of calculations.warranty_claim_reimbursement
        default: 0
      - name: supplier_chargeback_cents
        type: integer
        source: computed
        description: Step 7 of calculations.warranty_claim_reimbursement
        default: 0
      - name: info_request_count
        type: integer
        source: computed
        description: Times the administrator has asked for more information
        default: 0
      - name: resubmission_count
        type: integer
        source: computed
        description: Times the dealer has resubmitted after an information request
        default: 0
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the WarrantyAdministrator who approved the claim
        default: null
      - name: paid_by_user_id
        type: string
        source: system
        description: X-User-ID of the WarrantyAdministrator who paid the claim; must differ from approved_by_user_id
        default: null
      - name: denial_reason
        type: string
        source: input
        description: Reason recorded on denial
        default: null
      - name: status
        type: enum
        source: computed
        description: Claim lifecycle
        default: SUBMITTED
        constraints: "SUBMITTED | INFO_REQUESTED | APPROVED | DENIED | PAID"

  - name: RecallCampaign
    parent: null
    common_fields: true
    fields:
      - name: supplier_id
        type: string
        source: input
        description: "FK -> Supplier.id; the supplier whose component is recalled"
      - name: campaign_code
        type: string
        source: input
        description: Campaign identifier filed with the regulator
        constraints: "unique across RecallCampaign"
      - name: part_number
        type: string
        source: input
        description: Recalled part number; scopes matching ComponentLot rows together with lot_codes
      - name: lot_codes
        type: array
        source: input
        description: Lot codes in scope; expandable while the campaign is OPEN
        constraints: "non-empty array of strings"
      - name: severity
        type: enum
        source: input
        description: Recall severity; SAFETY stops shipment of affected units
        constraints: "SAFETY | COMPLIANCE | ADVISORY"
      - name: opened_at
        type: datetime
        source: computed
        description: Logical-clock instant the campaign opened; the penalty event timestamp for supplier scoring
        default: null
      - name: affected_installation_count
        type: integer
        source: computed
        description: ComponentInstallation rows this campaign has labelled RECALL_AFFECTED or REMEDIED
        default: 0
      - name: remedied_installation_count
        type: integer
        source: computed
        description: Labelled installations that have since been remedied
        default: 0
      - name: quarantined_piece_count
        type: integer
        source: computed
        description: Pieces frozen across all lots in scope
        default: 0
      - name: ship_stop
        type: boolean
        source: computed
        description: "severity == SAFETY"
        default: false
      - name: status
        type: enum
        source: computed
        description: Campaign lifecycle
        default: DRAFT
        constraints: "DRAFT | OPEN | CLOSED"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: UnitOrder
    state_field: status
    initial_state: DRAFT
    terminal_states: [SHIPPED, CANCELLED]
    shape: cyclic
    transitions:
      - from: DRAFT
        to: CONFIG_VALIDATED
        trigger: "POST /unit-orders/{id}/submit"
        actor: DealerPrincipal
        preconditions:
          - "order.status == DRAFT"
          - "acting X-User-ID == order.dealer_id"
          - "floor_plan.status == ACTIVE"
          - "dealer.status == ACTIVE"
          - "every selected OptionItem.status == ACTIVE"
          - "selected_option_ids has no duplicate entries (an empty option set is a legal base unit)"
          - "transitive REQUIRES closure over selected options is satisfied"
          - "no EXCLUDES pair among selected options"
          - "config_weight_lbs <= floor_plan.gvwr_lbs"
          - "total_amp_draw <= floor_plan.electrical_service_amps"
          - "total_water_demand_gal <= round_half_up(floor_plan.fresh_water_capacity_gal * 5000 / 10000)"
        side_effects:
          - "recompute calculations.unit_order_configuration_totals: option_price_total_cents, config_weight_lbs, payload_remaining_lbs, total_amp_draw, total_water_demand_gal, required_station_hours"
          - "compute calculations.dealer_invoice_amount variant PROVISIONAL_AT_SUBMIT into provisional_invoice_cents"
          - "pin locked_floor_plan_version = floor_plan.version"
          - "pin locked_option_versions = [{ option_id, version, price_cents } for each selected option]"
          - "increments UnitOrder.version by 1"
      - from: CONFIG_VALIDATED
        to: DRAFT
        trigger: "PUT /unit-orders/{id}/configuration"
        actor: DealerPrincipal
        preconditions:
          - "order.status IN {DRAFT, CONFIG_VALIDATED}"
          - "acting X-User-ID == order.dealer_id"
        side_effects:
          - "replace selected_option_ids and requested_delivery_date with the request body values"
          - "recompute calculations.unit_order_configuration_totals"
          - "clear locked_floor_plan_version, locked_option_versions, provisional_invoice_cents (back to 0)"
          - "increments UnitOrder.version by 1"
        note: "Editing a validated configuration returns the order to DRAFT; this is the revision cycle CONFIG_VALIDATED -> DRAFT -> CONFIG_VALIDATED."
      - from: CONFIG_VALIDATED
        to: SLOTTED
        trigger: "POST /unit-orders/{id}/production-slots"
        actor: ProductionScheduler
        preconditions:
          - "order.status IN {CONFIG_VALIDATED, SLOTTED}"
          - "expected_unit_order_version == order.version (concurrency_rules[slot-reserve-stale-order])"
          - "line.chassis_class_supported == floor_plan.chassis_class"
          - "dealer.status == ACTIVE and dealer.credit_status != CREDIT_HOLD"
          - "no UnitOrder of this dealer has financing_status == CURTAILED with curtailment_due_cents > 0"
          - "calculations.line_day_slot_capacity admits required_station_hours on (line_id, slot_date)"
          - "calculations.dealer_slot_entitlement admits required_station_hours in slot_date's calendar month"
        side_effects:
          - "create ProductionSlot in RESERVED with station_hours_committed = order.required_station_hours, sequence_position = occupied_units + 1, expires_at = created_at + 72h"
          - "when the order already holds a RESERVED slot, that prior slot transitions RESERVED -> RELEASED FIRST, before the capacity check runs"
          - "recompute Dealer.allocation_slots_reserved and Dealer.allocation_hours_consumed"
          - "increments UnitOrder.version by 1"
      - from: SLOTTED
        to: CONFIG_VALIDATED
        trigger: "system: ProductionSlot RESERVED -> RELEASED during POST /daily-close expiry sweep"
        actor: system
        preconditions:
          - "the order's only non-RELEASED slot transitioned to RELEASED"
          - "order.status == SLOTTED"
        side_effects:
          - "clear the order's slot association (no slot row with status IN {RESERVED, CONSUMED} remains)"
          - "when a ChassisReceipt has matched_unit_order_id == order.id and status == MATCHED, it transitions MATCHED -> RECEIVED and matched_unit_order_id is cleared"
          - "recompute Dealer.allocation_slots_reserved and Dealer.allocation_hours_consumed"
          - "increments UnitOrder.version by 1"
        note: "Cascade hop 2 of transitive_cascade/daily_close_slot_expiry_releases_order_and_chassis."
      - from: SLOTTED
        to: IN_PRODUCTION
        trigger: "POST /unit-orders/{id}/release-to-line"
        actor: ProductionScheduler
        preconditions:
          - "order.status == SLOTTED"
          - "a ChassisReceipt exists with matched_unit_order_id == order.id and status == MATCHED"
          - "dealer.status == ACTIVE and dealer.credit_status != CREDIT_HOLD"
          - "floor_plan.version == order.locked_floor_plan_version"
          - "every entry of locked_option_versions matches the referenced OptionItem's current version"
          - "the order's slot has status RESERVED"
        side_effects:
          - "create UnitBuild at current_station CHASSIS_PREP with build_sequence = plant build counter + 1 and vin = model_code + '-' + zero-padded build_sequence"
          - "ChassisReceipt MATCHED -> INSTALLED"
          - "ProductionSlot RESERVED -> CONSUMED"
          - "increments UnitOrder.version by 1"
      - from: IN_PRODUCTION
        to: BUILT
        trigger: "system: UnitBuild PDI -> READY_TO_SHIP"
        actor: system
        preconditions:
          - "unit_build.current_station == READY_TO_SHIP"
        side_effects:
          - "increments UnitOrder.version by 1"
      - from: IN_PRODUCTION
        to: CANCELLED
        trigger: "system: UnitBuild reaches SCRAPPED after exceeding the rework limit"
        actor: system
        preconditions:
          - "unit_build.current_station == SCRAPPED"
        side_effects:
          - "ship_hold_reason = QUALITY_HOLD"
          - "increments UnitOrder.version by 1"
        note: "Cascade hop 3 of transitive_cascade/water_test_failure_rework_then_scrap_cancels_order."
      - from: BUILT
        to: SHIPPED
        trigger: "POST /unit-orders/{id}/ship"
        actor: ProductionScheduler
        preconditions:
          - "order.status == BUILT"
          - "order.ship_hold_reason == NONE"
          - "unit_build.recall_hold == false"
          - "unit_build.water_test_passed == true and unit_build.pdi_passed == true"
          - "dealer.status == ACTIVE and dealer.credit_status != CREDIT_HOLD"
          - "order_type != STOCK OR financing_status == FLOOR_PLAN_FUNDED"
        side_effects:
          - "shipped_at = logical clock now"
          - "compute calculations.dealer_invoice_amount variant FINAL_AT_SHIP into final_invoice_cents"
          - "UnitBuild READY_TO_SHIP -> SHIPPED"
          - "increments UnitOrder.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /unit-orders/{id}/cancel"
        actor: DealerPrincipal
        preconditions:
          - "order.status IN {DRAFT, CONFIG_VALIDATED, SLOTTED}"
          - "acting X-User-ID == order.dealer_id"
        side_effects:
          - "increments UnitOrder.version by 1"
      - from: CONFIG_VALIDATED
        to: CANCELLED
        trigger: "POST /unit-orders/{id}/cancel"
        actor: DealerPrincipal
        preconditions:
          - "order.status IN {DRAFT, CONFIG_VALIDATED, SLOTTED}"
          - "acting X-User-ID == order.dealer_id"
        side_effects:
          - "increments UnitOrder.version by 1"
      - from: SLOTTED
        to: CANCELLED
        trigger: "POST /unit-orders/{id}/cancel"
        actor: DealerPrincipal
        preconditions:
          - "order.status IN {DRAFT, CONFIG_VALIDATED, SLOTTED}"
          - "acting X-User-ID == order.dealer_id"
        side_effects:
          - "the order's ProductionSlot with status RESERVED transitions RESERVED -> RELEASED"
          - "a ChassisReceipt with matched_unit_order_id == order.id and status == MATCHED transitions MATCHED -> RECEIVED and matched_unit_order_id is cleared"
          - "recompute Dealer.allocation_slots_reserved and Dealer.allocation_hours_consumed"
          - "increments UnitOrder.version by 1"

  - entity: UnitOrder
    state_field: financing_status
    initial_state: NOT_FINANCED
    terminal_states: [PAID_OFF]
    shape: parallel
    note: "Second, independent state dimension on the same UnitOrder row. status and financing_status never gate each other's transitions except where a precondition says so explicitly."
    transitions:
      - from: NOT_FINANCED
        to: FUNDING_REQUESTED
        trigger: "POST /unit-orders/{id}/request-funding"
        actor: DealerPrincipal
        preconditions:
          - "financing_status == NOT_FINANCED"
          - "order.status IN {CONFIG_VALIDATED, SLOTTED, IN_PRODUCTION, BUILT}"
          - "acting X-User-ID == order.dealer_id"
          - "dealer.status == ACTIVE"
        side_effects:
          - "increments UnitOrder.version by 1"
      - from: FUNDING_REQUESTED
        to: FLOOR_PLAN_FUNDED
        trigger: "POST /unit-orders/{id}/funding-decision with decision APPROVED"
        actor: PlantAdmin
        preconditions:
          - "financing_status == FUNDING_REQUESTED"
          - "provisional_invoice_cents > 0"
        side_effects:
          - "financed_principal_cents = round_half_up(provisional_invoice_cents * 9000 / 10000)"
          - "funded_at = logical clock now"
          - "recompute Dealer.financed_exposure_cents, Dealer.credit_utilization_bp and Dealer.credit_status"
          - "increments UnitOrder.version by 1"
      - from: FUNDING_REQUESTED
        to: NOT_FINANCED
        trigger: "POST /unit-orders/{id}/funding-decision with decision DECLINED"
        actor: PlantAdmin
        preconditions:
          - "financing_status == FUNDING_REQUESTED"
        side_effects:
          - "increments UnitOrder.version by 1"
      - from: FLOOR_PLAN_FUNDED
        to: CURTAILED
        trigger: "system: POST /daily-close curtailment sweep"
        actor: system
        preconditions:
          - "financing_status == FLOOR_PLAN_FUNDED"
          - "calculations.floor_plan_curtailment_due yields curtailment_due_cents > 0"
        side_effects:
          - "curtailment_due_cents recomputed and persisted"
          - "increments UnitOrder.version by 1"
      - from: CURTAILED
        to: FLOOR_PLAN_FUNDED
        trigger: "POST /unit-orders/{id}/floor-plan-payment"
        actor: DealerPrincipal
        preconditions:
          - "financing_status IN {FLOOR_PLAN_FUNDED, CURTAILED}"
          - "acting X-User-ID == order.dealer_id"
          - "0 < amount_cents <= financed_principal_cents - curtailment_paid_cents"
          - "curtailment_paid_cents + amount_cents < financed_principal_cents"
        side_effects:
          - "curtailment_paid_cents += amount_cents"
          - "recompute curtailment_due_cents"
          - "recompute Dealer.financed_exposure_cents, Dealer.credit_utilization_bp and Dealer.credit_status"
          - "increments UnitOrder.version by 1"
        note: "Cycle: a curtailment payment that clears the amount due returns the order to FLOOR_PLAN_FUNDED, where a later sweep can curtail it again."
      - from: FLOOR_PLAN_FUNDED
        to: PAID_OFF
        trigger: "POST /unit-orders/{id}/floor-plan-payment paying the full remaining principal"
        actor: DealerPrincipal
        preconditions:
          - "financing_status IN {FLOOR_PLAN_FUNDED, CURTAILED}"
          - "acting X-User-ID == order.dealer_id"
          - "curtailment_paid_cents + amount_cents == financed_principal_cents"
        side_effects:
          - "curtailment_paid_cents = financed_principal_cents"
          - "curtailment_due_cents = 0"
          - "recompute Dealer.financed_exposure_cents (this order leaves the exposure set), Dealer.credit_utilization_bp and Dealer.credit_status"
          - "increments UnitOrder.version by 1"
      - from: CURTAILED
        to: PAID_OFF
        trigger: "POST /unit-orders/{id}/floor-plan-payment paying the full remaining principal"
        actor: DealerPrincipal
        preconditions:
          - "financing_status IN {FLOOR_PLAN_FUNDED, CURTAILED}"
          - "acting X-User-ID == order.dealer_id"
          - "curtailment_paid_cents + amount_cents == financed_principal_cents"
        side_effects:
          - "curtailment_paid_cents = financed_principal_cents"
          - "curtailment_due_cents = 0"
          - "recompute Dealer.financed_exposure_cents, Dealer.credit_utilization_bp and Dealer.credit_status"
          - "increments UnitOrder.version by 1"

  - entity: ProductionSlot
    state_field: status
    initial_state: RESERVED
    terminal_states: [RELEASED]
    shape: branching
    transitions:
      - from: RESERVED
        to: CONSUMED
        trigger: "system: POST /unit-orders/{id}/release-to-line"
        actor: system
        preconditions:
          - "slot.status == RESERVED"
          - "slot.unit_order_id == the released order"
        side_effects:
          - "increments ProductionSlot.version by 1"
      - from: RESERVED
        to: RELEASED
        trigger: "system: POST /daily-close expiry sweep, POST /unit-orders/{id}/cancel, or supersede by a new reservation on the same order"
        actor: system
        preconditions:
          - "slot.status == RESERVED"
          - "for the expiry sweep only: slot.expires_at <= logical clock now"
        side_effects:
          - "recompute Dealer.allocation_slots_reserved and Dealer.allocation_hours_consumed"
          - "the freed station hours are no longer counted by calculations.line_day_slot_capacity"
          - "increments ProductionSlot.version by 1"
        note: "Cascade hop 1 of transitive_cascade/daily_close_slot_expiry_releases_order_and_chassis."

  - entity: ChassisReceipt
    state_field: status
    initial_state: RECEIVED
    terminal_states: [INSTALLED]
    shape: cyclic
    transitions:
      - from: RECEIVED
        to: MATCHED
        trigger: "POST /unit-orders/{id}/match-chassis"
        actor: ProductionScheduler
        preconditions:
          - "chassis.status == RECEIVED"
          - "chassis is the winner of calculations.chassis_match_selection for this order"
          - "order.status IN {CONFIG_VALIDATED, SLOTTED}"
          - "no other ChassisReceipt already has matched_unit_order_id == order.id"
        side_effects:
          - "matched_unit_order_id = order.id"
          - "increments ChassisReceipt.version by 1"
      - from: MATCHED
        to: RECEIVED
        trigger: "system: the matched order releases its slot (POST /daily-close expiry sweep or POST /unit-orders/{id}/cancel)"
        actor: system
        preconditions:
          - "chassis.status == MATCHED"
          - "the order named by matched_unit_order_id left status SLOTTED without entering IN_PRODUCTION"
        side_effects:
          - "matched_unit_order_id = null"
          - "the chassis re-enters the candidate pool of calculations.chassis_match_selection"
          - "increments ChassisReceipt.version by 1"
        note: "Cascade hop 3 of transitive_cascade/daily_close_slot_expiry_releases_order_and_chassis."
      - from: MATCHED
        to: INSTALLED
        trigger: "system: POST /unit-orders/{id}/release-to-line"
        actor: system
        preconditions:
          - "chassis.status == MATCHED"
        side_effects:
          - "increments ChassisReceipt.version by 1"

  - entity: UnitBuild
    state_field: current_station
    initial_state: CHASSIS_PREP
    terminal_states: [SHIPPED, SCRAPPED]
    shape: cyclic
    note: "Forward moves are one station at a time via POST /unit-builds/{id}/advance. Backward moves are never requested by a client: they are side effects of a FAIL inspection grade."
    transitions:
      - from: CHASSIS_PREP
        to: SIDEWALL_LAM
        trigger: "POST /unit-builds/{id}/advance with to_station SIDEWALL_LAM"
        actor: LineSupervisor
        preconditions:
          - "to_station is the immediate successor of current_station"
          - "line.status == RUNNING for the line of the build's consumed slot"
          - "recall_hold == false"
        side_effects:
          - "actual_station_hours += station_hours_used"
          - "increments UnitBuild.version by 1"
      - from: SIDEWALL_LAM
        to: ROOF_SET
        trigger: "POST /unit-builds/{id}/advance with to_station ROOF_SET"
        actor: LineSupervisor
        preconditions:
          - "to_station is the immediate successor of current_station"
          - "line.status == RUNNING"
          - "recall_hold == false"
        side_effects:
          - "actual_station_hours += station_hours_used"
          - "increments UnitBuild.version by 1"
      - from: ROOF_SET
        to: ROUGH_IN
        trigger: "POST /unit-builds/{id}/advance with to_station ROUGH_IN"
        actor: LineSupervisor
        preconditions:
          - "to_station is the immediate successor of current_station"
          - "line.status == RUNNING"
          - "recall_hold == false"
        side_effects:
          - "actual_station_hours += station_hours_used"
          - "increments UnitBuild.version by 1"
      - from: ROUGH_IN
        to: APPLIANCE_INSTALL
        trigger: "POST /unit-builds/{id}/advance with to_station APPLIANCE_INSTALL"
        actor: LineSupervisor
        preconditions:
          - "to_station is the immediate successor of current_station"
          - "line.status == RUNNING"
          - "recall_hold == false"
        side_effects:
          - "actual_station_hours += station_hours_used"
          - "increments UnitBuild.version by 1"
      - from: APPLIANCE_INSTALL
        to: FINISH
        trigger: "POST /unit-builds/{id}/advance with to_station FINISH"
        actor: LineSupervisor
        preconditions:
          - "to_station is the immediate successor of current_station"
          - "line.status == RUNNING"
          - "recall_hold == false"
        side_effects:
          - "actual_station_hours += station_hours_used"
          - "increments UnitBuild.version by 1"
      - from: FINISH
        to: WATER_TEST
        trigger: "POST /unit-builds/{id}/advance with to_station WATER_TEST"
        actor: LineSupervisor
        preconditions:
          - "to_station is the immediate successor of current_station"
          - "line.status == RUNNING"
          - "recall_hold == false"
          - "for every category in {APPLIANCE, PLUMBING} present among the order's selected options, at least one ComponentInstallation on this build has status INSTALLED and a ComponentLot of that category"
        side_effects:
          - "actual_station_hours += station_hours_used"
          - "increments UnitBuild.version by 1"
      - from: WATER_TEST
        to: PDI
        trigger: "POST /unit-builds/{id}/advance with to_station PDI"
        actor: LineSupervisor
        preconditions:
          - "to_station is the immediate successor of current_station"
          - "line.status == RUNNING"
          - "recall_hold == false"
          - "water_test_passed == true"
        side_effects:
          - "actual_station_hours += station_hours_used"
          - "increments UnitBuild.version by 1"
      - from: PDI
        to: READY_TO_SHIP
        trigger: "POST /unit-builds/{id}/advance with to_station READY_TO_SHIP"
        actor: LineSupervisor
        preconditions:
          - "to_station is the immediate successor of current_station"
          - "line.status == RUNNING"
          - "recall_hold == false"
          - "pdi_passed == true"
        side_effects:
          - "actual_station_hours += station_hours_used"
          - "UnitOrder IN_PRODUCTION -> BUILT"
          - "increments UnitBuild.version by 1"
      - from: WATER_TEST
        to: ROUGH_IN
        trigger: "system: POST /quality-inspections/{id}/complete grading a WATER_TEST inspection FAIL"
        actor: system
        preconditions:
          - "current_station == WATER_TEST"
          - "inspection.result == FAIL"
          - "rework_count + 1 <= 2"
        side_effects:
          - "rework_count += 1"
          - "water_test_passed = false"
          - "increments UnitBuild.version by 1"
        note: "Rework cycle: WATER_TEST -> ROUGH_IN -> APPLIANCE_INSTALL -> FINISH -> WATER_TEST."
      - from: PDI
        to: FINISH
        trigger: "system: POST /quality-inspections/{id}/complete grading a PDI inspection FAIL"
        actor: system
        preconditions:
          - "current_station == PDI"
          - "inspection.result == FAIL"
          - "rework_count + 1 <= 2"
        side_effects:
          - "rework_count += 1"
          - "pdi_passed = false"
          - "increments UnitBuild.version by 1"
      - from: WATER_TEST
        to: SCRAPPED
        trigger: "system: POST /quality-inspections/{id}/complete grading FAIL when rework_count is already 2"
        actor: system
        preconditions:
          - "current_station == WATER_TEST"
          - "inspection.result == FAIL"
          - "rework_count + 1 > 2"
        side_effects:
          - "rework_count += 1"
          - "UnitOrder IN_PRODUCTION -> CANCELLED with ship_hold_reason = QUALITY_HOLD"
          - "increments UnitBuild.version by 1"
        note: "Cascade hop 2 of transitive_cascade/water_test_failure_rework_then_scrap_cancels_order."
      - from: PDI
        to: SCRAPPED
        trigger: "system: POST /quality-inspections/{id}/complete grading FAIL when rework_count is already 2"
        actor: system
        preconditions:
          - "current_station == PDI"
          - "inspection.result == FAIL"
          - "rework_count + 1 > 2"
        side_effects:
          - "rework_count += 1"
          - "UnitOrder IN_PRODUCTION -> CANCELLED with ship_hold_reason = QUALITY_HOLD"
          - "increments UnitBuild.version by 1"
      - from: READY_TO_SHIP
        to: SHIPPED
        trigger: "system: POST /unit-orders/{id}/ship"
        actor: system
        preconditions:
          - "current_station == READY_TO_SHIP"
          - "recall_hold == false"
        side_effects:
          - "increments UnitBuild.version by 1"

  - entity: QualityInspection
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED]
    shape: branching
    note: "Single forward transition whose side-effect set forks three ways on the computed grade."
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /quality-inspections/{id}/complete"
        actor: QualityInspector
        preconditions:
          - "inspection.status == SCHEDULED"
          - "for inspection_type WATER_TEST: unit_build.current_station == WATER_TEST"
          - "for inspection_type PDI: unit_build.current_station == PDI"
          - "for inspection_type FUNCTIONAL: unit_build.current_station IN {WATER_TEST, PDI}"
          - "for inspection_type PDI: X-User-ID != the completed_by_user_id of the build's latest COMPLETED WATER_TEST inspection"
        side_effects:
          - "result = calculations.inspection_grade output"
          - "completed_by_user_id = X-User-ID"
          - "UnitBuild.defect_points_total += defect_points"
          - "branch PASS or CONDITIONAL on WATER_TEST: UnitBuild.water_test_passed = true, station unchanged"
          - "branch PASS or CONDITIONAL on PDI: UnitBuild.pdi_passed = true, station unchanged"
          - "branch FAIL on WATER_TEST or PDI: UnitBuild takes the rework transition (or SCRAPPED past the rework limit)"
          - "branch any grade on FUNCTIONAL: only defect_points_total moves"
          - "increments QualityInspection.version by 1"

  - entity: ComponentInstallation
    state_field: status
    initial_state: INSTALLED
    terminal_states: [REVERSED, REMEDIED]
    shape: branching
    transitions:
      - from: INSTALLED
        to: REVERSED
        trigger: "POST /component-installations/{id}/reverse"
        actor: LineSupervisor
        preconditions:
          - "installation.status == INSTALLED"
          - "unit_build.current_station NOT IN {SHIPPED, SCRAPPED}"
        side_effects:
          - "ComponentLot.quantity_installed -= quantity and ComponentLot.quantity_available += quantity"
          - "ComponentLot DEPLETED -> AVAILABLE when quantity_available becomes > 0"
          - "increments ComponentInstallation.version by 1"
        note: "Compensating action for the install; conserves quantity_available + quantity_installed + quantity_quarantined == quantity_received."
      - from: INSTALLED
        to: RECALL_AFFECTED
        trigger: "system: POST /recall-campaigns/{id}/open or POST /recall-campaigns/{id}/expand quarantines the referenced lot"
        actor: system
        preconditions:
          - "installation.status == INSTALLED"
          - "the referenced ComponentLot just transitioned AVAILABLE or DEPLETED -> QUARANTINED under this campaign"
        side_effects:
          - "recall_campaign_id = campaign.id"
          - "UnitBuild.recall_hold = true"
          - "campaign.affected_installation_count += 1"
          - "increments ComponentInstallation.version by 1"
        note: "Cascade hop 2 of transitive_cascade/recall_open_quarantines_lot_holds_build_and_order."
      - from: RECALL_AFFECTED
        to: REMEDIED
        trigger: "POST /component-installations/{id}/remedy"
        actor: RecallCoordinator
        preconditions:
          - "installation.status == RECALL_AFFECTED"
          - "campaign.status == OPEN"
        side_effects:
          - "campaign.remedied_installation_count += 1"
          - "when no ComponentInstallation on the build remains RECALL_AFFECTED: UnitBuild.recall_hold = false and, if the order's ship_hold_reason == RECALL_HOLD, it is set back to NONE"
          - "increments ComponentInstallation.version by 1"

  - entity: ComponentLot
    state_field: status
    initial_state: AVAILABLE
    terminal_states: []
    shape: branching
    transitions:
      - from: AVAILABLE
        to: DEPLETED
        trigger: "system: POST /component-installations consumes the last available piece"
        actor: system
        preconditions:
          - "quantity_available - requested quantity == 0"
        side_effects:
          - "increments ComponentLot.version by 1"
      - from: DEPLETED
        to: AVAILABLE
        trigger: "system: POST /component-installations/{id}/reverse returns pieces"
        actor: system
        preconditions:
          - "quantity_available + returned quantity > 0"
        side_effects:
          - "increments ComponentLot.version by 1"
      - from: AVAILABLE
        to: QUARANTINED
        trigger: "system: POST /recall-campaigns/{id}/open or /expand brings this lot into scope"
        actor: system
        preconditions:
          - "lot.supplier_id == campaign.supplier_id"
          - "lot.part_number == campaign.part_number"
          - "lot.lot_code IN campaign.lot_codes"
        side_effects:
          - "quantity_quarantined += quantity_available, then quantity_available = 0"
          - "every ComponentInstallation of this lot with status INSTALLED transitions INSTALLED -> RECALL_AFFECTED"
          - "campaign.quarantined_piece_count += the frozen piece count"
          - "increments ComponentLot.version by 1"
        note: "Cascade hop 1 of transitive_cascade/recall_open_quarantines_lot_holds_build_and_order."
      - from: DEPLETED
        to: QUARANTINED
        trigger: "system: POST /recall-campaigns/{id}/open or /expand brings this lot into scope"
        actor: system
        preconditions:
          - "lot.supplier_id == campaign.supplier_id and lot.part_number == campaign.part_number and lot.lot_code IN campaign.lot_codes"
        side_effects:
          - "quantity_quarantined += quantity_available (zero), quantity_available = 0"
          - "every ComponentInstallation of this lot with status INSTALLED transitions INSTALLED -> RECALL_AFFECTED"
          - "increments ComponentLot.version by 1"

  - entity: WarrantyClaim
    state_field: status
    initial_state: SUBMITTED
    terminal_states: [DENIED, PAID]
    shape: cyclic
    transitions:
      - from: SUBMITTED
        to: INFO_REQUESTED
        trigger: "POST /warranty-claims/{id}/request-info"
        actor: WarrantyAdministrator
        preconditions:
          - "claim.status == SUBMITTED"
          - "claim.info_request_count < 2"
        side_effects:
          - "info_request_count += 1"
          - "increments WarrantyClaim.version by 1"
      - from: INFO_REQUESTED
        to: SUBMITTED
        trigger: "POST /warranty-claims/{id}/resubmit"
        actor: DealerPrincipal
        preconditions:
          - "claim.status == INFO_REQUESTED"
          - "acting X-User-ID == claim.dealer_id"
        side_effects:
          - "narrative, labor_hours and parts_cost_cents replaced by the request body values when supplied"
          - "resubmission_count += 1"
          - "recompute calculations.warranty_claim_reimbursement steps 1-4 and 7 (goodwill stays 0 until decision)"
          - "increments WarrantyClaim.version by 1"
        note: "Revision cycle SUBMITTED -> INFO_REQUESTED -> SUBMITTED, bounded by info_request_count < 2."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /warranty-claims/{id}/decide with decision APPROVED"
        actor: WarrantyAdministrator
        preconditions:
          - "claim.status == SUBMITTED"
          - "claim.in_warranty == true OR goodwill_authorized_cents > 0 is possible under the OUT_OF_WARRANTY_GOODWILL_ONLY variant"
          - "not (goodwill_authorized_request > 0 and dealer goodwill remaining == 0)"
        side_effects:
          - "run calculations.warranty_claim_reimbursement in the pinned step order; persist labor_reimbursement_cents, parts_reimbursement_cents, authority_tier, goodwill_authorized_cents, total_reimbursement_cents, supplier_chargeback_cents"
          - "approved_by_user_id = X-User-ID"
          - "Dealer.goodwill_used_cents += goodwill_authorized_cents"
          - "when supplier_chargeback_cents > 0: the claim becomes a penalty event for the lot's Supplier, so Supplier.penalty_event_count += 1 and Supplier.quality_score / supplier_status are recomputed"
          - "increments WarrantyClaim.version by 1"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /warranty-claims/{id}/decide with decision DENIED"
        actor: WarrantyAdministrator
        preconditions:
          - "claim.status == SUBMITTED"
          - "denial_reason is present"
        side_effects:
          - "goodwill_authorized_cents = 0 and total_reimbursement_cents = 0"
          - "increments WarrantyClaim.version by 1"
      - from: APPROVED
        to: PAID
        trigger: "POST /warranty-claims/{id}/pay"
        actor: WarrantyAdministrator
        preconditions:
          - "claim.status == APPROVED"
          - "X-User-ID != claim.approved_by_user_id"
        side_effects:
          - "paid_by_user_id = X-User-ID"
          - "increments WarrantyClaim.version by 1"

  - entity: RecallCampaign
    state_field: status
    initial_state: DRAFT
    terminal_states: [CLOSED]
    shape: linear
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /recall-campaigns/{id}/open"
        actor: RecallCoordinator
        preconditions:
          - "campaign.status == DRAFT"
          - "at least one ComponentLot matches (supplier_id, part_number, lot_code IN lot_codes)"
        side_effects:
          - "opened_at = logical clock now; ship_stop = (severity == SAFETY)"
          - "every matching ComponentLot transitions to QUARANTINED (cascade hop 1)"
          - "every INSTALLED ComponentInstallation of those lots transitions to RECALL_AFFECTED, which sets UnitBuild.recall_hold = true (cascade hop 2)"
          - "for every held UnitBuild whose current_station != SHIPPED, when ship_stop is true the owning UnitOrder.ship_hold_reason becomes RECALL_HOLD (cascade hop 3)"
          - "Supplier.open_recall_count += 1, Supplier.penalty_event_count += 1, Supplier.quality_score and supplier_status recomputed (cascade hop 4)"
          - "increments RecallCampaign.version by 1"
      - from: OPEN
        to: OPEN
        trigger: "POST /recall-campaigns/{id}/expand"
        actor: RecallCoordinator
        preconditions:
          - "campaign.status == OPEN"
          - "expected_recall_campaign_version == campaign.version (concurrency_rules[recall-expand-stale-campaign])"
          - "additional_lot_codes contains at least one code not already in lot_codes"
        side_effects:
          - "lot_codes = union(lot_codes, additional_lot_codes)"
          - "the same cascade hops 1-3 run for lots newly brought into scope; Supplier.open_recall_count is NOT incremented again"
          - "increments RecallCampaign.version by 1"
      - from: OPEN
        to: CLOSED
        trigger: "POST /recall-campaigns/{id}/close"
        actor: RecallCoordinator
        preconditions:
          - "campaign.status == OPEN"
          - "remedied_installation_count == affected_installation_count"
        side_effects:
          - "Supplier.open_recall_count -= 1 and Supplier.quality_score / supplier_status recomputed (a CLOSED campaign still counts as a penalty event)"
          - "lots stay QUARANTINED: recalled pieces are never returned to quantity_available"
          - "increments RecallCampaign.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: slot-reserve-stale-order
    parent_entity: UnitOrder
    write_endpoint: "POST /unit-orders/{id}/production-slots"
    occ_field: "expected_unit_order_version"
    description: |
      Reserving a production slot for a UnitOrder whose version has advanced
      since the scheduler last read it is rejected. Re-slotting is a legitimate
      operation that supersedes the order's prior RESERVED slot, so a second
      reservation would otherwise succeed and silently discard the slot the
      first reservation created; the stale-version check makes the scheduler
      re-read the order (including its new sequence_position and released
      predecessor) before it can supersede again.
    error_id: ERR_STALE_UNIT_ORDER_VERSION
    http_status: 412
  - rule_id: recall-expand-stale-campaign
    parent_entity: RecallCampaign
    write_endpoint: "POST /recall-campaigns/{id}/expand"
    occ_field: "expected_recall_campaign_version"
    description: |
      Expanding an OPEN campaign's lot-code scope against a campaign whose
      version has advanced since the coordinator last read it is rejected. Each
      expansion supersedes the prior scope and drags a fresh quarantine cascade
      behind it, so a coordinator working from a stale view would file a scope
      that omits lots a previous expansion already added and would misread
      affected_installation_count.
    error_id: ERR_STALE_RECALL_CAMPAIGN_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules
# =============================================================================
calculations:
  - name: unit_order_configuration_totals
    description: |
      Derives every physical and monetary roll-up of a dealer-ordered
      configuration from the floor plan baseline plus the selected option set:
      option price total, curb weight, remaining payload, electrical amp draw,
      fresh-water demand and required station hours. Station hours are the
      scheduling currency consumed by ProductionSlot, so this calculation feeds
      line_day_slot_capacity and dealer_slot_entitlement.
    trigger: "POST /unit-orders, PUT /unit-orders/{id}/configuration, POST /unit-orders/{id}/submit"
    inputs:
      - "FloorPlan.base_station_hours, base_dry_weight_lbs, gvwr_lbs, electrical_service_amps, fresh_water_capacity_gal, chassis_class"
      - "the selected OptionItem rows: price_cents, weight_lbs, added_station_hours, amp_draw, water_demand_gal, category"
    algorithm: aggregation
    formula: |
      # --- physical roll-ups (integers, exact) ---
      option_price_total_cents = sum(o.price_cents for o in options)
      option_weight_lbs        = sum(o.weight_lbs for o in options)
      config_weight_lbs        = floor_plan.base_dry_weight_lbs + option_weight_lbs
      payload_remaining_lbs    = floor_plan.gvwr_lbs - config_weight_lbs
      total_amp_draw           = sum(o.amp_draw for o in options)
      total_water_demand_gal   = sum(o.water_demand_gal for o in options)

      # --- required station hours (2 dp, ROUND_HALF_UP applied ONCE at the end) ---
      raw_hours = floor_plan.base_station_hours + sum(o.added_station_hours for o in options)

      n = count(options)
      if   n == 0:              complexity_factor = 1.00
      elif n <= 4:              complexity_factor = 1.00
      elif n <= 9:              complexity_factor = 1.05
      elif n <= 14:             complexity_factor = 1.12
      else:                     complexity_factor = 1.20

      class_factor = { TOWABLE: 1.00, CLASS_C: 1.10,
                       CLASS_A: 1.15 }[floor_plan.chassis_class]

      electrical_surcharge_hours = 4.00 if total_amp_draw > ELECTRICAL_SURCHARGE_AMP_THRESHOLD else 0.00

      required_station_hours = round_half_up(
          raw_hours * complexity_factor * class_factor + electrical_surcharge_hours, 2)

      # required_station_hours > MAX_SINGLE_UNIT_HOURS is rejected at submit
      # with ERR_STATION_HOURS_LIMIT_EXCEEDED (validation priority 13).
    constants:
      COMPLEXITY_FACTOR_TIER_1_MAX_OPTIONS: 4
      COMPLEXITY_FACTOR_TIER_2_MAX_OPTIONS: 9
      COMPLEXITY_FACTOR_TIER_3_MAX_OPTIONS: 14
      COMPLEXITY_FACTOR_TIER_1: 1.00
      COMPLEXITY_FACTOR_TIER_2: 1.05
      COMPLEXITY_FACTOR_TIER_3: 1.12
      COMPLEXITY_FACTOR_TIER_4: 1.20
      CLASS_FACTOR_TOWABLE: 1.00
      CLASS_FACTOR_CLASS_C: 1.10
      CLASS_FACTOR_CLASS_A: 1.15
      ELECTRICAL_SURCHARGE_AMP_THRESHOLD: 40
      ELECTRICAL_SURCHARGE_HOURS: 4.00
      MAX_SINGLE_UNIT_HOURS: 96.00
      WATER_DEMAND_RATIO_BP: 5000
    precision: "station hours 2 decimal places, round_half_up applied once to the final product; weights, amps, gallons and cents are integers"
    worked_example: |
      FP-3410 (CLASS_A, base_station_hours 46.00, base_dry_weight_lbs 22400,
      gvwr_lbs 26000, electrical_service_amps 50, fresh_water_capacity_gal 90)
      + options [OPT-AC2, OPT-WASH, OPT-SOLAR, OPT-INV, OPT-BATT]:
        install hours 2.50 + 3.00 + 4.00 + 1.50 + 2.00 = 13.00 -> raw_hours 59.00
        n = 5 -> complexity_factor 1.05 ; CLASS_A -> class_factor 1.15
        total_amp_draw = 16 + 12 + 0 + 0 + 0 = 28 -> 28 <= 40 -> surcharge 0.00
        59.00 * 1.05 * 1.15 = 71.2425 -> required_station_hours 71.24
        option_weight_lbs = 95 + 180 + 70 + 45 + 130 = 520
        config_weight_lbs = 22920 ; payload_remaining_lbs = 3080
        option_price_total_cents = 385000 + 245500 + 325000 + 165000 + 415000 = 1535500
        total_water_demand_gal = 0 -> water cap 45 not exceeded

  - name: dealer_invoice_amount
    description: |
      Money owed by the dealer for a unit. Line-level discounts are computed
      per option category, rounded per line, then summed — the rounding
      boundary is part of the contract and a sum-then-round implementation
      produces a different number. Runs twice in a unit's life under two
      variants that differ in which after-the-fact adjustments exist.
    trigger: "POST /unit-orders/{id}/submit (PROVISIONAL_AT_SUBMIT); POST /unit-orders/{id}/ship (FINAL_AT_SHIP)"
    inputs:
      - "FloorPlan.base_msrp_cents, length_ft"
      - "each selected OptionItem's price_cents and category"
      - "UnitOrder.order_type and Dealer.region"
      - "UnitBuild.actual_station_hours, rework_count, defect_points_total (FINAL variant only)"
      - "UnitOrder.required_station_hours (FINAL variant only)"
    algorithm: tiered_pricing
    formula: |
      # STEP 1 - build the discount line set. The base unit is line 0.
      lines = [ (BASE_UNIT, floor_plan.base_msrp_cents) ]   # bp from order_type
              + [ (o.category, o.price_cents) for o in options ]
                  ordered by OptionItem.option_code ASC

      # STEP 2 - discount each line INDEPENDENTLY and round each line to whole
      #          cents with ROUND_HALF_UP. Do not sum the raw products first.
      def line_net(category, gross):
          bp = (BASE_UNIT_DISCOUNT_BP[order.order_type] if category == BASE_UNIT
                else OPTION_DISCOUNT_BP[category])
          return round_half_up(gross * (10000 - bp) / 10000, 0)

      discounted_subtotal_cents = sum(line_net(c, g) for (c, g) in lines)

      # STEP 3 - freight, which is never discounted.
      freight_cents = FREIGHT_BASE_CENTS
                    + FREIGHT_PER_FOOT_CENTS * floor_plan.length_ft
                    + REGION_SURCHARGE_CENTS[dealer.region]

      # STEP 4 - variant-specific adjustments.
      # PROVISIONAL_AT_SUBMIT: no build exists yet, so all three are zero.
      # FINAL_AT_SHIP:
      overtime_hours = max(0, build.actual_station_hours - order.required_station_hours)
      overtime_surcharge_cents = round_half_up(overtime_hours * OT_RATE_CENTS_PER_HOUR, 0)
      rework_surcharge_cents   = build.rework_count * REWORK_SURCHARGE_CENTS
      quality_credit_cents     = min(build.defect_points_total * QUALITY_CREDIT_PER_POINT_CENTS,
                                     QUALITY_CREDIT_CAP_CENTS)

      # STEP 5 - assemble.
      invoice_cents = discounted_subtotal_cents + freight_cents
                    + overtime_surcharge_cents + rework_surcharge_cents
                    - quality_credit_cents
    constants:
      BASE_UNIT_DISCOUNT_BP_STOCK: 2200
      BASE_UNIT_DISCOUNT_BP_SOLD: 2050
      BASE_UNIT_DISCOUNT_BP_DEMO: 2600
      OPTION_DISCOUNT_BP_APPLIANCE: 1550
      OPTION_DISCOUNT_BP_PLUMBING: 1450
      OPTION_DISCOUNT_BP_ELECTRICAL: 1725
      OPTION_DISCOUNT_BP_EXTERIOR: 1600
      OPTION_DISCOUNT_BP_INTERIOR: 1350
      OPTION_DISCOUNT_BP_CHASSIS_UPGRADE: 1250
      FREIGHT_BASE_CENTS: 180000
      FREIGHT_PER_FOOT_CENTS: 4200
      REGION_SURCHARGE_CENTS_WEST: 95000
      REGION_SURCHARGE_CENTS_CENTRAL: 0
      REGION_SURCHARGE_CENTS_EAST: 60000
      REGION_SURCHARGE_CENTS_SOUTH: 35000
      OT_RATE_CENTS_PER_HOUR: 8500
      REWORK_SURCHARGE_CENTS: 45000
      QUALITY_CREDIT_PER_POINT_CENTS: 1500
      QUALITY_CREDIT_CAP_CENTS: 90000
    precision: "whole cents; ROUND_HALF_UP applied once per discount line (STEP 2) and once to the overtime product (STEP 4)"
    variants:
      - name: PROVISIONAL_AT_SUBMIT
        when: "POST /unit-orders/{id}/submit — no UnitBuild exists"
        difference: "overtime_surcharge_cents, rework_surcharge_cents and quality_credit_cents are all 0; the result is written to UnitOrder.provisional_invoice_cents and is the basis of floor-plan financing"
      - name: FINAL_AT_SHIP
        when: "POST /unit-orders/{id}/ship — the UnitBuild is complete"
        difference: "all three build-derived adjustments are applied from the finished UnitBuild; the result is written to UnitOrder.final_invoice_cents. financed_principal_cents is NOT recomputed, so the provisional-to-final delta is the dealer's cash settlement"
    worked_example: |
      Canonical order (FP-3410, base_msrp 18500000, length 34 ft, dealer region WEST,
      options [OPT-AC2 ELECTRICAL 385000, OPT-BATT ELECTRICAL 415000,
      OPT-INV ELECTRICAL 165000, OPT-SOLAR ELECTRICAL 325000,
      OPT-WASH APPLIANCE 245500]):
        BASE_UNIT (STOCK, 2200 bp) 18500000 * 7800/10000 = 14430000        -> 14430000
        OPT-AC2      385000 * 8275/10000 =   318587.5      ->   318588
        OPT-BATT     415000 * 8275/10000 =   343412.5      ->   343413
        OPT-INV      165000 * 8275/10000 =   136537.5      ->   136538
        OPT-SOLAR    325000 * 8275/10000 =   268937.5      ->   268938
        OPT-WASH     245500 * 8450/10000 =   207447.5      ->   207448
        discounted_subtotal_cents = 15704925
        (a sum-then-round implementation totals 15704922.5 -> 15704923, i.e. 2 cents low)
        freight = 180000 + 4200*34 + 95000 = 417800
        PROVISIONAL_AT_SUBMIT: 15704925 + 417800 = provisional_invoice_cents 16122725
        FINAL_AT_SHIP with actual_station_hours 75.00, rework_count 1,
        defect_points_total 9:
          overtime 75.00 - 71.24 = 3.76 h -> round_half_up(3.76 * 8500) = 31960
          rework 1 * 45000 = 45000 ; credit min(9*1500, 90000) = 13500
          final_invoice_cents = 15704925 + 417800 + 31960 + 45000 - 13500 = 16186185
          delta vs provisional = 63460

  - name: warranty_claim_reimbursement
    description: |
      What the plant pays a dealer for a warranty repair, and what it charges
      back to the component supplier. Seven steps that MUST execute in the
      written order: two of the caps read values produced by earlier steps, so
      reordering silently changes the payout.
    trigger: "POST /warranty-claims (steps 1-4 and 7 preview), POST /warranty-claims/{id}/resubmit, POST /warranty-claims/{id}/decide with decision APPROVED (all 7 steps, persisted)"
    inputs:
      - "WarrantyClaim.labor_hours, parts_cost_cents, claim_type, goodwill_requested_cents, in_warranty"
      - "Dealer.goodwill_budget_cents, goodwill_used_cents"
      - "Supplier.supplier_status of the claimed ComponentLot's supplier (null when component_lot_id is null)"
    algorithm: waterfall_allocation
    formula: |
      # STEP 1 - labour, capped in hours before it is priced.
      billable_hours = min(claim.labor_hours, LABOR_HOUR_CAP)
      labor_reimbursement_cents = round_half_up(
          billable_hours * LABOR_RATE_CENTS[claim.claim_type], 0)

      # STEP 2 - parts plus a handling uplift.
      parts_reimbursement_cents = round_half_up(
          claim.parts_cost_cents * (10000 + PARTS_HANDLING_BP) / 10000, 0)

      # STEP 3 - schedule subtotal.
      schedule_subtotal_cents = labor_reimbursement_cents + parts_reimbursement_cents

      # STEP 4 - authority tier is chosen FROM the subtotal (step 3), so it can
      #          never be decided before labour and parts are known.
      if   schedule_subtotal_cents <= TIER_A_MAX_CENTS:  authority_tier = TIER_A
      elif schedule_subtotal_cents <= TIER_B_MAX_CENTS:  authority_tier = TIER_B
      else:                                              authority_tier = TIER_C

      # STEP 5 - goodwill, throttled by three independent ceilings.
      tier_cap_cents    = GOODWILL_TIER_CAP_CENTS[authority_tier]
      pct_cap_cents     = round_half_up(schedule_subtotal_cents * GOODWILL_PCT_BP / 10000, 0)
      dealer_remaining  = dealer.goodwill_budget_cents - dealer.goodwill_used_cents
      goodwill_authorized_cents = min(claim.goodwill_requested_cents,
                                      tier_cap_cents, pct_cap_cents, dealer_remaining)

      # STEP 6 - total paid to the dealer.
      total_reimbursement_cents = schedule_subtotal_cents + goodwill_authorized_cents

      # STEP 7 - supplier chargeback, a percentage OF the step-6 total, scaled by
      #          how much the plant currently trusts the supplier.
      if claim.component_lot_id is null:
          supplier_chargeback_cents = 0
      else:
          bp = CHARGEBACK_BP[supplier.supplier_status]
          supplier_chargeback_cents = round_half_up(total_reimbursement_cents * bp / 10000, 0)
    constants:
      LABOR_HOUR_CAP: 8.0
      LABOR_RATE_CENTS_APPLIANCE: 7800
      LABOR_RATE_CENTS_PLUMBING: 8600
      LABOR_RATE_CENTS_ELECTRICAL: 9200
      LABOR_RATE_CENTS_STRUCTURAL: 10400
      LABOR_RATE_CENTS_WATER_INTRUSION: 11000
      PARTS_HANDLING_BP: 1500
      TIER_A_MAX_CENTS: 150000
      TIER_B_MAX_CENTS: 750000
      GOODWILL_TIER_CAP_CENTS_TIER_A: 75000
      GOODWILL_TIER_CAP_CENTS_TIER_B: 150000
      GOODWILL_TIER_CAP_CENTS_TIER_C: 0
      GOODWILL_PCT_BP: 2000
      OUT_OF_WARRANTY_GOODWILL_CAP_CENTS: 50000
      CHARGEBACK_BP_ACTIVE: 6000
      CHARGEBACK_BP_PROBATION: 8000
      CHARGEBACK_BP_SUSPENDED: 10000
      WARRANTY_DAYS: 365
      MAX_INFO_REQUESTS: 2
    precision: "whole cents; ROUND_HALF_UP at steps 1, 2, 5 (pct_cap) and 7"
    variants:
      - name: IN_WARRANTY_SCHEDULE
        when: "claim.in_warranty == true, i.e. the logical clock is within WARRANTY_DAYS of the shipped_at of the UnitOrder that owns the claimed UnitBuild"
        difference: "all seven steps run as written; labour and parts are both reimbursed"
      - name: OUT_OF_WARRANTY_GOODWILL_ONLY
        when: "claim.in_warranty == false"
        difference: "steps 1-3 still compute labor_reimbursement_cents and parts_reimbursement_cents for the record, but schedule_subtotal_cents is NOT paid: total_reimbursement_cents = goodwill_authorized_cents alone, and goodwill_authorized_cents takes a fourth ceiling OUT_OF_WARRANTY_GOODWILL_CAP_CENTS. The authority tier is still derived from the unpaid subtotal, so tier selection is identical across variants while the payout differs"
    worked_example: |
      IN_WARRANTY_SCHEDULE, claim_type APPLIANCE, labor_hours 3.50,
      parts_cost_cents 68000, goodwill_requested_cents 60000,
      dealer goodwill_budget 500000 / used 0, supplier ACTIVE:
        1) 3.50 <= 8.0 -> 3.50 * 7800 = 27300
        2) 68000 * 11500/10000 = 78200
        3) 27300 + 78200 = 105500
        4) 105500 <= 150000 -> TIER_A (tier_cap 75000)
        5) pct_cap = 105500 * 2000/10000 = 21100
           min(60000, 75000, 21100, 500000) = 21100
        6) 105500 + 21100 = 126600
        7) ACTIVE 6000 bp -> 126600 * 0.6 = 75960
      Same claim with the supplier in PROBATION: step 7 -> 101280.
      TIER_B example (STRUCTURAL, 8.0 h, parts 250000):
        1) 8.0 * 10400 = 83200  2) 250000*1.15 = 287500  3) 370700
        4) 370700 > 150000 -> TIER_B (tier_cap 150000)
        5) pct_cap 74140 -> goodwill 74140   6) 444840

  - name: supplier_quality_score
    description: |
      The 0-100 trust score that decides whether a supplier's chassis may be
      matched to orders and how hard warranty costs are charged back to it.
      Computed from weighted penalty events under two windowing variants.
    trigger: "POST /recall-campaigns/{id}/open, /expand, /close; POST /warranty-claims/{id}/decide when supplier_chargeback_cents > 0; GET /suppliers/{id}/scorecard; POST /daily-close"
    inputs:
      - "every RecallCampaign of the supplier with status IN {OPEN, CLOSED}: severity, opened_at"
      - "every APPROVED or PAID WarrantyClaim whose ComponentLot belongs to the supplier and whose supplier_chargeback_cents > 0: created_at"
      - "the logical clock"
    algorithm: decay_function
    formula: |
      events = [ (opened_at, RECALL_PENALTY_WEIGHT[c.severity]) for c in campaigns
                 if c.status IN {OPEN, CLOSED} and c.opened_at is not null ]
             + [ (claim.created_at, CHARGEBACK_CLAIM_PENALTY_WEIGHT) for claim in claims ]

      age_days(e) = floor((now - e.timestamp) / 86400 seconds)   # whole days

      # ROLLING_90D  -- hard cutoff, no decay
      penalty = sum(w for (t, w) in events if age_days < ROLLING_WINDOW_DAYS)

      # LIFETIME_CUMULATIVE -- nothing is ever dropped; older events decay once
      penalty = sum(w                        for (t, w) in events if age_days <  ROLLING_WINDOW_DAYS)
              + sum(w * LIFETIME_DECAY_FACTOR for (t, w) in events if age_days >= ROLLING_WINDOW_DAYS)

      score = round_half_up(max(0.00, SCORE_BASE - penalty), 2)

      # supplier_status is derived from the ROLLING_90D score only
      if   score >= SUPPLIER_ACTIVE_MIN_SCORE:      supplier_status = ACTIVE
      elif score >= SUPPLIER_PROBATION_MIN_SCORE:   supplier_status = PROBATION
      else:                                         supplier_status = SUSPENDED
    constants:
      SCORE_BASE: 100.00
      ROLLING_WINDOW_DAYS: 90
      LIFETIME_DECAY_FACTOR: 0.5
      RECALL_PENALTY_WEIGHT_SAFETY: 15.0
      RECALL_PENALTY_WEIGHT_COMPLIANCE: 10.0
      RECALL_PENALTY_WEIGHT_ADVISORY: 4.0
      CHARGEBACK_CLAIM_PENALTY_WEIGHT: 2.0
      SUPPLIER_ACTIVE_MIN_SCORE: 70.00
      SUPPLIER_PROBATION_MIN_SCORE: 50.00
    precision: "scores 2 decimal places, round_half_up, floored at 0.00; ages are whole days computed by floor division on the logical clock"
    variants:
      - name: ROLLING_90D
        when: "always — persisted to Supplier.quality_score and used for supplier_status, chassis eligibility and the warranty chargeback rate"
        difference: "an event whose age is exactly ROLLING_WINDOW_DAYS days is OUTSIDE the window and contributes nothing (the comparison is age_days < 90)"
      - name: LIFETIME_CUMULATIVE
        when: "GET /suppliers/{id}/scorecard, field lifetime_quality_score"
        difference: "no event is ever dropped; events at or past 90 days keep half their weight, so the lifetime score is always <= the rolling score whenever any event has aged out"
    worked_example: |
      Supplier SUP-CH with two SAFETY campaigns opened at 2026-08-01T00:00:00Z.
      At clock 2026-10-29T00:00:00Z (age 89 days):
        ROLLING_90D  penalty 30.0 -> 70.00 -> ACTIVE (70.00 >= 70.00)
        LIFETIME     penalty 30.0 -> 70.00
      At clock 2026-10-30T00:00:00Z (age exactly 90 days):
        ROLLING_90D  penalty  0.0 -> 100.00 -> ACTIVE
        LIFETIME     penalty 30.0 * 0.5 = 15.0 -> 85.00
      Adding one ADVISORY campaign inside the window: 30.0 + 4.0 = 34.0 -> 66.00 -> PROBATION.
      Four SAFETY campaigns inside the window: 60.0 -> 40.00 -> SUSPENDED.

  - name: dealer_credit_utilization
    description: |
      How much of a dealer's floor-plan credit line is committed, and whether
      new production commitments are blocked. The utilisation basis point value
      is compared against a threshold with strict inequality, so the exact
      boundary is observable.
    trigger: "POST /unit-orders/{id}/funding-decision, POST /unit-orders/{id}/floor-plan-payment, POST /daily-close, POST /dealers/{id}/status"
    inputs:
      - "every UnitOrder of the dealer with financing_status IN {FLOOR_PLAN_FUNDED, CURTAILED}: financed_principal_cents, curtailment_paid_cents"
      - "Dealer.floor_plan_credit_limit_cents"
    algorithm: threshold
    formula: |
      financed_exposure_cents = sum(o.financed_principal_cents - o.curtailment_paid_cents
                                    for o in dealer orders
                                    if o.financing_status IN {FLOOR_PLAN_FUNDED, CURTAILED})

      if dealer.floor_plan_credit_limit_cents == 0:
          credit_utilization_bp = 0
      else:
          credit_utilization_bp = floor(
              financed_exposure_cents * 10000 / dealer.floor_plan_credit_limit_cents)

      if   credit_utilization_bp > CREDIT_HOLD_BP:  credit_status = CREDIT_HOLD
      elif credit_utilization_bp > WATCH_BP:        credit_status = WATCH
      else:                                          credit_status = GOOD_STANDING
    constants:
      CREDIT_HOLD_BP: 9500
      WATCH_BP: 8000
      FLOOR_PLAN_ADVANCE_BP: 9000
    precision: "basis points are integers truncated toward zero (floor); both comparisons are strictly greater-than, so exactly 9500 bp is WATCH and 9501 bp is CREDIT_HOLD"
    worked_example: |
      provisional_invoice_cents 16122725 -> financed_principal_cents
      round_half_up(16122725 * 9000/10000) = 14510453 (14510452.5 rounds up).
        credit_limit 15274000 -> 14510453*10000/15274000 = 9500.09... -> 9500 bp -> WATCH
        credit_limit 15272000 -> 9501.33... -> 9501 bp -> CREDIT_HOLD
        credit_limit 15200000 -> 9546.35... -> 9546 bp -> CREDIT_HOLD

  - name: line_day_slot_capacity
    description: |
      Whether a production line can absorb one more unit on a given calendar
      day. Two independent ceilings apply — committed station hours and unit
      count — and both are evaluated against the day bucket AFTER any slot the
      same order previously held has been released.
    trigger: "POST /unit-orders/{id}/production-slots"
    inputs:
      - "every ProductionSlot on (line_id, slot_date) with status IN {RESERVED, CONSUMED}: station_hours_committed"
      - "ProductionLine.daily_station_hour_capacity, max_units_per_day"
      - "the requesting order's required_station_hours"
    algorithm: interval_merge
    formula: |
      # A slot occupies one whole calendar day bucket, keyed by slot_date (a date,
      # not an instant). Buckets never overlap; the interval semantics here are
      # closed day-bucket containment.
      def occupancy(line_id, slot_date, excluding_slot_id):
          rows = slots where line_id matches and slot_date matches
                 and status IN {RESERVED, CONSUMED} and id != excluding_slot_id
          return (sum(r.station_hours_committed for r in rows), count(rows))

      # On a re-slot the order's previous RESERVED slot is RELEASED first, so it
      # is excluded from both sums.
      committed_hours, occupied_units = occupancy(line_id, slot_date, prior_slot_id)

      if occupied_units + 1 > line.max_units_per_day:
          reject ERR_LINE_DAY_UNIT_CAP_EXCEEDED
      if committed_hours + order.required_station_hours > line.daily_station_hour_capacity:
          reject ERR_LINE_DAY_HOURS_EXCEEDED

      sequence_position = occupied_units + 1
      expires_at = created_at + SLOT_RESERVATION_TTL_HOURS hours
    constants:
      SLOT_RESERVATION_TTL_HOURS: 72
    precision: "station hours 2 decimal places; the hours ceiling is inclusive — committed_hours + required == daily_station_hour_capacity is admitted, +0.01 more is rejected"
    worked_example: |
      LINE-B has daily_station_hour_capacity 142.48 and max_units_per_day 4.
      Two canonical 71.24 h orders on 2026-09-14: 0.00 + 71.24 = 71.24 <= 142.48 (ok),
      then 71.24 + 71.24 = 142.48 <= 142.48 (ok, exact equality admitted).
      A third such order: 142.48 + 71.24 = 213.72 > 142.48 -> ERR_LINE_DAY_HOURS_EXCEEDED
      even though occupied_units 2 + 1 = 3 <= 4.
      On LINE-A (daily_station_hour_capacity 240.00, max_units_per_day 4) three 34 ft
      CLASS_A units fit on hours (213.72 <= 240.00); a fourth is stopped by hours,
      while four small units are stopped by ERR_LINE_DAY_UNIT_CAP_EXCEEDED first
      because the unit cap is checked before the hours cap.

  - name: booth_window_conflict
    description: |
      Whether a water-test or functional-test booth can accept a reservation window. Each
      reservation is a half-open instant interval extended by a mandatory
      turnaround buffer on its trailing edge; the booth admits up to bay_count
      overlapping extended intervals.
    trigger: "POST /quality-inspections"
    inputs:
      - "every QualityInspection on the booth with status IN {SCHEDULED, COMPLETED}: window_start, window_end"
      - "TestBooth.turnaround_minutes, bay_count, status"
      - "the requested window_start and window_end"
    algorithm: interval_merge
    formula: |
      MIN_TEST_MINUTES <= (window_end - window_start) in minutes <= MAX_TEST_MINUTES
      window_end > window_start   (strict)

      # Effective footprint: half-open on the left edge, buffer-extended on the right.
      eff(iv) = [ iv.window_start , iv.window_end + booth.turnaround_minutes )

      overlap(a, b)  <=>  a.start < b.effective_end AND b.start < a.effective_end

      concurrent = count(existing rows r where overlap(request, r))
      if concurrent + 1 > booth.bay_count:
          reject ERR_BOOTH_WINDOW_CONFLICT
    constants:
      MIN_TEST_MINUTES: 30
      MAX_TEST_MINUTES: 240
    precision: "whole minutes on the logical clock; intervals are half-open [start, end+buffer) so a new window starting exactly at a predecessor's buffered end is admitted"
    worked_example: |
      BOOTH-1: turnaround_minutes 30, bay_count 1.
      Existing SCHEDULED window 2026-09-14T09:00:00Z -> 10:00:00Z has effective end 10:30:00Z.
        new window starting 10:30:00Z -> admitted (10:30 is not < 10:30)
        new window starting 10:29:00Z -> ERR_BOOTH_WINDOW_CONFLICT
      A booth with bay_count 2 admits the 10:29 request and rejects only a third
      overlapping window.

  - name: chassis_match_selection
    description: |
      Picks which received chassis is assigned to a unit order. Eligibility is a
      five-part filter over the chassis and its supplier; ranking is a
      three-key deterministic ordering that never uses id as a tiebreak.
    trigger: "POST /unit-orders/{id}/match-chassis"
    inputs:
      - "every ChassisReceipt with status RECEIVED: chassis_class, wheelbase_in, gvwr_lbs, received_at, created_at, supplier_id"
      - "the referenced Supplier.supplier_status"
      - "the order's FloorPlan.chassis_class and required_wheelbase_in, and the order's config_weight_lbs"
    algorithm: chronological
    formula: |
      # --- eligibility (all five must hold) ---
      c.status == RECEIVED
      c.matched_unit_order_id is null
      c.chassis_class == floor_plan.chassis_class
      c.wheelbase_in == floor_plan.required_wheelbase_in            # exact match
      c.gvwr_lbs >= order.config_weight_lbs + CHASSIS_GVWR_MARGIN_LBS
      supplier(c).supplier_status IN {ACTIVE, PROBATION}           # SUSPENDED excluded

      # --- ranking (first key wins; each subsequent key breaks the previous tie) ---
      1. received_at ASC        # oldest inventory first
      2. gvwr_lbs ASC           # do not waste a heavier chassis on a light unit
      3. created_at ASC         # deterministic final tiebreak; id is never used

      if the eligible set is empty: reject ERR_NO_MATCHING_CHASSIS
    constants:
      CHASSIS_GVWR_MARGIN_LBS: 500
    precision: "integer inches and pounds; received_at and created_at compared at full instant precision"
    worked_example: |
      Canonical order needs CLASS_A, wheelbase 242, gvwr >= 22920 + 500 = 23420.
        CH-1  received_at 2026-08-03, gvwr 26000, wheelbase 242, ACTIVE     -> eligible
        CH-2  received_at 2026-08-02, gvwr 26000, wheelbase 240, ACTIVE     -> wheelbase mismatch
        CH-3  received_at 2026-08-02, gvwr 23000, wheelbase 242, ACTIVE     -> gvwr below 23420
        CH-4  received_at 2026-08-02, gvwr 27500, wheelbase 242, SUSPENDED  -> supplier excluded
        CH-5  received_at 2026-08-03, gvwr 24800, wheelbase 242, PROBATION  -> eligible
      Both survivors share received_at 2026-08-03, so key 2 decides:
      24800 < 26000 -> CH-5 wins, even though its supplier is on PROBATION.

  - name: floor_plan_curtailment_due
    description: |
      The principal reduction a dealer owes on a funded unit as it ages in
      inventory. A step schedule on days-since-funding: the required cumulative
      percentage jumps at three ages and the amount due is what is still unpaid
      against that cumulative requirement.
    trigger: "POST /daily-close, POST /unit-orders/{id}/floor-plan-payment, POST /_clock/set_current_utc"
    inputs:
      - "UnitOrder.funded_at, financed_principal_cents, curtailment_paid_cents"
      - "the logical clock"
    algorithm: threshold
    formula: |
      age_days = floor((now - funded_at) / 86400 seconds)

      if   age_days >= CURTAIL_STAGE_3_DAYS:  required_bp = CURTAIL_STAGE_3_BP
      elif age_days >= CURTAIL_STAGE_2_DAYS:  required_bp = CURTAIL_STAGE_2_BP
      elif age_days >= CURTAIL_STAGE_1_DAYS:  required_bp = CURTAIL_STAGE_1_BP
      else:                                    required_bp = 0

      required_cents = round_half_up(financed_principal_cents * required_bp / 10000, 0)
      curtailment_due_cents = max(0, required_cents - curtailment_paid_cents)
    constants:
      CURTAIL_STAGE_1_DAYS: 180
      CURTAIL_STAGE_2_DAYS: 270
      CURTAIL_STAGE_3_DAYS: 365
      CURTAIL_STAGE_1_BP: 1000
      CURTAIL_STAGE_2_BP: 2500
      CURTAIL_STAGE_3_BP: 5000
    precision: "whole cents, round_half_up; ages are whole days by floor division, and each stage boundary is inclusive (age_days == 180 already owes stage 1)"
    worked_example: |
      financed_principal_cents 14510453, funded_at 2026-08-01T00:00:00Z.
        clock 2027-01-27T00:00:00Z -> age 179 days -> required_bp 0    -> due 0, stays FLOOR_PLAN_FUNDED
        clock 2027-01-28T00:00:00Z -> age 180 days -> required_bp 1000 -> due 1451045 -> CURTAILED
        clock 2027-04-28T00:00:00Z -> age 270 days -> required_bp 2500 -> due 3627613
        clock 2027-08-01T00:00:00Z -> age 365 days -> required_bp 5000 -> due 7255227
      Paying 1451045 at age 180 returns the order to FLOOR_PLAN_FUNDED with
      curtailment_paid_cents 1451045 and remaining principal 13059408.

  - name: dealer_slot_entitlement
    description: |
      A dealer's monthly share of plant capacity, expressed in station hours,
      with a tolerance band that permits modest oversubscription. The
      entitlement moves whenever a production line is added or its daily hours
      change, so it is never a stored constant.
    trigger: "POST /unit-orders/{id}/production-slots"
    inputs:
      - "every ProductionLine with status IN {RUNNING, PAUSED}: daily_station_hour_capacity"
      - "Dealer.allocation_share_bp"
      - "every ProductionSlot of the dealer's orders with status IN {RESERVED, CONSUMED} whose slot_date falls in the requested slot_date's calendar month: station_hours_committed"
    algorithm: aggregation
    formula: |
      plant_month_hours = round_half_up(
          sum(l.daily_station_hour_capacity for l in lines if l.status IN {RUNNING, PAUSED})
          * WORKING_DAYS_PER_MONTH, 2)

      entitled_hours = round_half_up(
          plant_month_hours * dealer.allocation_share_bp / 10000, 2)

      tolerance_hours = round_half_up(
          entitled_hours * (10000 + OVERSUBSCRIPTION_TOLERANCE_BP) / 10000, 2)

      month_committed = sum(s.station_hours_committed for the dealer's slots in that
                            calendar month with status IN {RESERVED, CONSUMED},
                            excluding a prior slot released by this same request)

      if month_committed + order.required_station_hours > tolerance_hours:
          reject ERR_DEALER_ALLOCATION_EXCEEDED
    constants:
      WORKING_DAYS_PER_MONTH: 20
      OVERSUBSCRIPTION_TOLERANCE_BP: 500
    precision: "station hours 2 decimal places, round_half_up at each of the three steps; the tolerance ceiling is inclusive"
    worked_example: |
      LINE-A alone (daily_station_hour_capacity 240.00): plant_month_hours 4800.00.
        dealer allocation_share_bp 1500 -> entitled 720.00, tolerance 756.00
        dealer allocation_share_bp  100 -> entitled  48.00, tolerance  50.40
          -> a single canonical 71.24 h order already exceeds 50.40 and is rejected
             with ERR_DEALER_ALLOCATION_EXCEEDED
      Adding LINE-B (142.48): sum 382.48 -> plant_month_hours 7649.60
        share 1500 bp -> entitled 1147.44, tolerance 1204.81
      The same dealer therefore gains headroom purely because a second line exists.

  - name: inspection_grade
    description: |
      Turns an inspector's raw findings into the PASS / CONDITIONAL / FAIL grade
      that drives the UnitBuild station machine. Thresholds differ by
      inspection type, and any leak finding is an automatic FAIL regardless of
      the defect count.
    trigger: "POST /quality-inspections/{id}/complete"
    inputs:
      - "the request's defect_points and leak_detected"
      - "QualityInspection.inspection_type"
    algorithm: threshold
    formula: |
      if leak_detected:
          result = FAIL
      elif inspection_type IN {WATER_TEST, FUNCTIONAL}:
          if   defect_points >  WET_FAIL_MAX_POINTS:          result = FAIL
          elif defect_points >= WET_CONDITIONAL_MIN_POINTS:   result = CONDITIONAL
          else:                                               result = PASS
      else:  # PDI — tighter, because the unit is about to leave the plant
          if   defect_points >  PDI_FAIL_MAX_POINTS:          result = FAIL
          elif defect_points >= PDI_CONDITIONAL_MIN_POINTS:   result = CONDITIONAL
          else:                                               result = PASS
    constants:
      WET_CONDITIONAL_MIN_POINTS: 6
      WET_FAIL_MAX_POINTS: 12
      PDI_CONDITIONAL_MIN_POINTS: 4
      PDI_FAIL_MAX_POINTS: 8
      MAX_REWORK: 2
    precision: "integer defect points; thresholds are inclusive on the CONDITIONAL floor and exclusive on the FAIL floor (12 is CONDITIONAL, 13 is FAIL on a WATER_TEST)"
    worked_example: |
      WATER_TEST, defect_points 5, leak_detected false  -> PASS
      WATER_TEST, defect_points 6                       -> CONDITIONAL (water_test_passed still becomes true)
      WATER_TEST, defect_points 12                      -> CONDITIONAL
      WATER_TEST, defect_points 13                      -> FAIL -> build reworks to ROUGH_IN
      WATER_TEST, defect_points 0, leak_detected true   -> FAIL despite zero points
      PDI,        defect_points 4                       -> CONDITIONAL
      PDI,        defect_points 9                       -> FAIL -> build reworks to FINISH

# =============================================================================
# §1.4 Validation Rules — evaluated in ascending priority order. The FIRST
# violated rule determines the response; later rules are never reported even
# when they are also violated.
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
    description: "Missing or blank identity headers are rejected before the role is examined, so an unauthenticated call to an endpoint no role may reach still returns 401."
  - priority: 2
    category: auth
    check: "X-User-Role is one of the seven declared roles AND appears in the endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all
    description: "Authorisation precedes body parsing: a wrong-role call with a malformed body returns 403, never 400."
  - priority: 3
    category: existence
    check: "the request body parses, every required field is present, every field has the declared type, every enum value is a declared member, every money field is a non-negative integer, every hours field has at most 2 decimals, and no array field contains duplicates"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
    description: "Schema and enum validation. Also covers window_end <= window_start, a booth window shorter than MIN_TEST_MINUTES or longer than MAX_TEST_MINUTES, quantity <= 0, amount_cents <= 0, labor_hours <= 0, duplicate entries in selected_option_ids, pagination limit outside 1..100, test_booth_id absent for a WATER_TEST or FUNCTIONAL inspection or present for a PDI inspection, and a test_booth_id whose booth_type does not equal the requested inspection_type."
  - priority: 4
    category: existence
    check: "every {id} path segment resolves to an existing row of the addressed entity"
    error_id: ERR_UNIT_ORDER_NOT_FOUND
    http_status: 404
    applies_to: all
    description: "Path existence. The entity-specific code is used: ERR_UNIT_ORDER_NOT_FOUND, ERR_PRODUCTION_SLOT_NOT_FOUND, ERR_CHASSIS_RECEIPT_NOT_FOUND, ERR_COMPONENT_LOT_NOT_FOUND, ERR_UNIT_BUILD_NOT_FOUND, ERR_COMPONENT_INSTALLATION_NOT_FOUND, ERR_QUALITY_INSPECTION_NOT_FOUND, ERR_WARRANTY_CLAIM_NOT_FOUND, ERR_RECALL_CAMPAIGN_NOT_FOUND, ERR_DEALER_NOT_FOUND, ERR_SUPPLIER_NOT_FOUND, ERR_FLOOR_PLAN_NOT_FOUND, ERR_OPTION_ITEM_NOT_FOUND, ERR_PRODUCTION_LINE_NOT_FOUND, ERR_TEST_BOOTH_NOT_FOUND."
  - priority: 5
    category: existence
    check: "every foreign key supplied in the request BODY resolves to an existing row"
    error_id: ERR_FLOOR_PLAN_NOT_FOUND
    http_status: 404
    applies_to: ["POST /unit-orders", "PUT /unit-orders/{id}/configuration", "POST /unit-orders/{id}/production-slots", "POST /component-lots", "POST /chassis-receipts", "POST /component-installations", "POST /quality-inspections", "POST /warranty-claims", "POST /recall-campaigns", "POST /_inject/delivered-unit"]
    description: "Body foreign keys are checked after path ids, in the field order declared by the endpoint's input list, using the same per-entity NOT_FOUND codes as priority 4."
  - priority: 6
    category: auth
    check: "for a DealerPrincipal, X-User-ID equals the dealer_id of the addressed UnitOrder or WarrantyClaim (and equals the dealer_id supplied in the body on create)"
    error_id: ERR_DEALER_SCOPE_VIOLATION
    http_status: 403
    applies_to: ["POST /unit-orders", "PUT /unit-orders/{id}/configuration", "POST /unit-orders/{id}/submit", "POST /unit-orders/{id}/cancel", "POST /unit-orders/{id}/request-funding", "POST /unit-orders/{id}/floor-plan-payment", "GET /unit-orders/{id}", "POST /warranty-claims", "POST /warranty-claims/{id}/resubmit"]
    description: "Ownership is checked after existence, so a DealerPrincipal probing a non-existent order id gets 404 rather than a 403 that would leak the id space."
  - priority: 7
    category: state
    check: "the addressed entity is in a state from which the requested transition exists, and the required companion rows are in their required states"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all
    description: "Generic state gate. Specific codes take its place where the scaffold names one: ERR_ORDER_NOT_SUBMITTABLE, ERR_ORDER_NOT_SLOTTABLE, ERR_CHASSIS_NOT_MATCHED, ERR_STATION_SEQUENCE_VIOLATION, ERR_LINE_NOT_RUNNING, ERR_BOOTH_NOT_OPEN, ERR_LOT_QUANTITY_INSUFFICIENT, ERR_CLAIM_NOT_DECIDABLE, ERR_INFO_REQUEST_LIMIT_REACHED, ERR_CAMPAIGN_NOT_CLOSEABLE, ERR_ORDER_ALREADY_MATCHED, ERR_PAYMENT_EXCEEDS_PRINCIPAL."
  - priority: 8
    category: state
    check: "expected_unit_order_version / expected_recall_campaign_version equals the parent row's current version"
    error_id: ERR_STALE_UNIT_ORDER_VERSION
    http_status: 412
    applies_to: ["POST /unit-orders/{id}/production-slots", "POST /recall-campaigns/{id}/expand"]
    description: "Optimistic concurrency per §1.2.1. Placed AFTER the state gate: reserving a slot for a CANCELLED order returns 409 even when the supplied version is also stale, and placed BEFORE every business rule so a stale caller is never told about a capacity or credit problem it cannot yet see."
  - priority: 9
    category: business_safety
    check: "the unit is not under a recall ship-stop and has cleared the water test and the pre-delivery inspection"
    error_id: ERR_RECALL_SHIP_STOP
    http_status: 409
    applies_to: ["POST /unit-orders/{id}/ship", "POST /unit-builds/{id}/advance"]
    description: "Safety gates, in this internal order: ERR_RECALL_SHIP_STOP (unit_build.recall_hold is true or ship_hold_reason is RECALL_HOLD), then ERR_WATER_TEST_NOT_PASSED, then ERR_PDI_NOT_PASSED. A unit that is both recall-held and PDI-incomplete reports the recall."
  - priority: 9
    category: business_safety
    check: "the acting user is not the same person who performed the conflicting earlier step"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: ["POST /quality-inspections/{id}/complete", "POST /warranty-claims/{id}/pay"]
    description: "Two duty splits: the PDI inspector must differ from the completer of the build's latest WATER_TEST inspection, and the user paying a warranty claim must differ from claim.approved_by_user_id."
  - priority: 10
    category: business_safety
    check: "config_weight_lbs <= floor_plan.gvwr_lbs"
    error_id: ERR_PAYLOAD_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: ["POST /unit-orders/{id}/submit"]
    description: "The gross-weight ceiling is the first physical rule and outranks every option-compatibility rule: a configuration that is both overweight and missing a required companion option reports the weight."
  - priority: 11
    category: business_safety
    check: "total_amp_draw <= floor_plan.electrical_service_amps"
    error_id: ERR_ELECTRICAL_SERVICE_EXCEEDED
    http_status: 422
    applies_to: ["POST /unit-orders/{id}/submit"]
    description: "Shore-power service ceiling, checked after weight and before the water system."
  - priority: 12
    category: business_safety
    check: "total_water_demand_gal <= round_half_up(floor_plan.fresh_water_capacity_gal * WATER_DEMAND_RATIO_BP / 10000)"
    error_id: ERR_WATER_SYSTEM_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: ["POST /unit-orders/{id}/submit"]
    description: "Plumbed options may claim at most half the fresh-water tank."
  - priority: 13
    category: business_constraint
    check: "the selected option set is internally consistent and every member is orderable"
    error_id: ERR_OPTION_REQUIRES_MISSING
    http_status: 422
    applies_to: ["POST /unit-orders/{id}/submit"]
    description: "Option compatibility, in this internal order: ERR_OPTION_DISCONTINUED (an option whose status is DISCONTINUED), then ERR_OPTION_REQUIRES_MISSING (the transitive requires closure is unsatisfied), then ERR_OPTION_MUTUALLY_EXCLUSIVE (an excludes pair is present), then ERR_STATION_HOURS_LIMIT_EXCEEDED (required_station_hours > MAX_SINGLE_UNIT_HOURS)."
  - priority: 14
    category: business_constraint
    check: "referenced configuration and supply rows are still the ones the order was priced against"
    error_id: ERR_CONFIG_REFERENCE_STALE
    http_status: 409
    applies_to: ["POST /unit-orders/{id}/release-to-line", "POST /unit-orders/{id}/match-chassis", "POST /component-installations"]
    description: "Referential drift, in this internal order: ERR_CONFIG_REFERENCE_STALE (floor_plan.version or any locked option version has moved since submit), then ERR_NO_MATCHING_CHASSIS (chassis_match_selection's eligible set is empty), then ERR_LOT_QUARANTINED (the component lot is under a recall)."
  - priority: 15
    category: business_constraint
    check: "the requested time window and day bucket have capacity"
    error_id: ERR_BOOTH_WINDOW_CONFLICT
    http_status: 409
    applies_to: ["POST /quality-inspections", "POST /unit-orders/{id}/production-slots"]
    description: "Temporal capacity, in this internal order: ERR_BOOTH_WINDOW_CONFLICT on booth reservations; ERR_LINE_DAY_UNIT_CAP_EXCEEDED then ERR_LINE_DAY_HOURS_EXCEEDED on slot reservations."
  - priority: 16
    category: business_fiscal
    check: "the dealer's credit, allocation, curtailment and goodwill positions permit the commitment"
    error_id: ERR_DEALER_CREDIT_HOLD
    http_status: 422
    applies_to: ["POST /unit-orders/{id}/production-slots", "POST /unit-orders/{id}/release-to-line", "POST /unit-orders/{id}/ship", "POST /warranty-claims/{id}/decide"]
    description: "Fiscal gates, last of all and in this internal order: ERR_DEALER_CREDIT_HOLD (credit_status is CREDIT_HOLD), then ERR_DEALER_CURTAILMENT_DELINQUENT (some order of the dealer is CURTAILED with curtailment_due_cents > 0), then ERR_DEALER_ALLOCATION_EXCEEDED (dealer_slot_entitlement is exceeded), then ERR_FLOOR_PLAN_FUNDING_REQUIRED (shipping a STOCK order that is not FLOOR_PLAN_FUNDED), then ERR_GOODWILL_BUDGET_EXHAUSTED (goodwill is requested but the dealer's remaining budget is zero). Because this band is last, a slot request that both exceeds line capacity and sits behind a credit hold reports the capacity failure at priority 15."

# =============================================================================
# §1.5 API Endpoint Table
#
# Every path is absolute and root-level (api_prefix is the empty string).
# Every request carries X-User-ID and X-User-Role headers.
# List endpoints accept limit? / offset? and return the paginated envelope
# described in response_envelope.
# =============================================================================
endpoints:

  # --- reference data: suppliers -------------------------------------------
  - method: POST
    path: /suppliers
    description: Register a component or chassis supplier.
    roles: [PlantAdmin]
    code: 201
    input: [supplier_code, name, component_categories]
    output: Supplier
    side_effects:
      - "quality_score initialised to 100.00 and supplier_status to ACTIVE"
  - method: GET
    path: /suppliers/{id}
    description: Read one supplier.
    roles: [PlantAdmin, ProductionScheduler, WarrantyAdministrator, RecallCoordinator]
    code: 200
    input: []
    output: Supplier
    side_effects: []
  - method: GET
    path: /suppliers/{id}/scorecard
    description: Both windowing variants of calculations.supplier_quality_score side by side.
    roles: [PlantAdmin, ProductionScheduler, WarrantyAdministrator, RecallCoordinator]
    code: 200
    input: []
    output: "{ supplier_id: string, rolling_quality_score: number, lifetime_quality_score: number, supplier_status: string, open_recall_count: integer, penalty_event_count: integer, evaluated_at: datetime }"
    side_effects:
      - "recomputes and persists Supplier.quality_score and supplier_status from the ROLLING_90D variant at the current logical clock"

  # --- reference data: floor plans and options -----------------------------
  - method: POST
    path: /floor-plans
    description: Publish a floor plan (model) that dealers may order.
    roles: [PlantAdmin]
    code: 201
    input: [model_code, chassis_class, length_ft, base_msrp_cents, base_station_hours, base_dry_weight_lbs, gvwr_lbs, required_wheelbase_in, electrical_service_amps, fresh_water_capacity_gal, "status?"]
    output: FloorPlan
    side_effects:
      - "max_payload_lbs computed as gvwr_lbs - base_dry_weight_lbs"
  - method: GET
    path: /floor-plans/{id}
    description: Read one floor plan.
    roles: [PlantAdmin, DealerPrincipal, ProductionScheduler]
    code: 200
    input: []
    output: FloorPlan
    side_effects: []
  - method: PATCH
    path: /floor-plans/{id}
    description: Reprice or retire a floor plan.
    roles: [PlantAdmin]
    code: 200
    input: ["base_msrp_cents?", "status?"]
    output: FloorPlan
    side_effects:
      - "increments FloorPlan.version by 1, which invalidates locked_floor_plan_version on every already-submitted UnitOrder that references it"
      - "recomputes max_payload_lbs"
  - method: POST
    path: /option-items
    description: Publish a dealer-orderable option.
    roles: [PlantAdmin]
    code: 201
    input: [option_code, category, install_station, price_cents, weight_lbs, added_station_hours, "amp_draw?", "water_demand_gal?", "requires_option_codes?", "excludes_option_codes?", "status?"]
    output: OptionItem
    side_effects: []
  - method: GET
    path: /option-items/{id}
    description: Read one option.
    roles: [PlantAdmin, DealerPrincipal, ProductionScheduler]
    code: 200
    input: []
    output: OptionItem
    side_effects: []
  - method: PATCH
    path: /option-items/{id}
    description: Reprice or discontinue an option.
    roles: [PlantAdmin]
    code: 200
    input: ["price_cents?", "status?"]
    output: OptionItem
    side_effects:
      - "increments OptionItem.version by 1, which invalidates the matching entry of locked_option_versions on every already-submitted UnitOrder that selected it"

  # --- reference data: dealers ---------------------------------------------
  - method: POST
    path: /dealers
    description: Register a dealer with its capacity share, credit line and goodwill pool.
    roles: [PlantAdmin]
    code: 201
    input: [dealer_code, region, allocation_share_bp, floor_plan_credit_limit_cents, goodwill_budget_cents]
    output: Dealer
    side_effects:
      - "the created Dealer.id is the DealerPrincipal identity used in X-User-ID"
      - "credit_status initialised to GOOD_STANDING"
  - method: GET
    path: /dealers/{id}
    description: Read one dealer, including its derived credit and allocation position.
    roles: [PlantAdmin, DealerPrincipal, ProductionScheduler, WarrantyAdministrator]
    code: 200
    input: []
    output: Dealer
    side_effects:
      - "recomputes financed_exposure_cents, credit_utilization_bp, credit_status, goodwill_used_cents, entitlement_hours, allocation_hours_consumed and allocation_slots_reserved"
  - method: POST
    path: /dealers/{id}/status
    description: Suspend or reinstate a dealer agreement.
    roles: [PlantAdmin]
    code: 200
    input: [status]
    output: Dealer
    side_effects:
      - "a SUSPENDED dealer can no longer submit orders, reserve slots, be released to a line or receive a shipment"

  # --- reference data: lines and booths ------------------------------------
  - method: POST
    path: /production-lines
    description: Commission an assembly line with its daily hour and unit ceilings.
    roles: [PlantAdmin]
    code: 201
    input: [line_code, chassis_class_supported, daily_station_hour_capacity, max_units_per_day]
    output: ProductionLine
    side_effects:
      - "changes plant_month_hours, so every dealer's entitlement_hours moves"
  - method: GET
    path: /production-lines/{id}
    description: Read one production line.
    roles: [PlantAdmin, ProductionScheduler, LineSupervisor]
    code: 200
    input: []
    output: ProductionLine
    side_effects: []
  - method: POST
    path: /production-lines/{id}/status
    description: Pause or resume a line.
    roles: [PlantAdmin, ProductionScheduler]
    code: 200
    input: [status]
    output: ProductionLine
    side_effects:
      - "a PAUSED line blocks POST /unit-builds/{id}/advance for every build occupying it, while already-reserved slots keep their committed hours"
  - method: POST
    path: /test-booths
    description: Commission a water-test or functional-test booth.
    roles: [PlantAdmin]
    code: 201
    input: [booth_code, booth_type, bay_count, turnaround_minutes]
    output: TestBooth
    side_effects: []
  - method: GET
    path: /test-booths/{id}
    description: Read one test booth.
    roles: [PlantAdmin, QualityInspector]
    code: 200
    input: []
    output: TestBooth
    side_effects: []
  - method: POST
    path: /test-booths/{id}/status
    description: Take a booth down or return it to service.
    roles: [PlantAdmin]
    code: 200
    input: [status]
    output: TestBooth
    side_effects:
      - "a DOWN booth rejects new reservations with ERR_BOOTH_NOT_OPEN; already SCHEDULED windows are untouched"

  # --- supply intake -------------------------------------------------------
  - method: POST
    path: /chassis-receipts
    description: Receive a chassis from a supplier into the unmatched pool.
    roles: [PlantAdmin]
    code: 201
    input: [supplier_id, chassis_serial, chassis_class, gvwr_lbs, wheelbase_in]
    output: ChassisReceipt
    side_effects:
      - "received_at stamped from the logical clock, which is the primary ranking key of calculations.chassis_match_selection"
      - "status RECEIVED"
  - method: GET
    path: /chassis-receipts/{id}
    description: Read one chassis receipt.
    roles: [PlantAdmin, ProductionScheduler]
    code: 200
    input: []
    output: ChassisReceipt
    side_effects: []
  - method: GET
    path: /chassis-receipts
    description: List chassis receipts, filterable by supplier, matched order and state.
    roles: [PlantAdmin, ProductionScheduler]
    code: 200
    input: ["supplier_id?", "matched_unit_order_id?", "status?", "chassis_class?", "limit?", "offset?"]
    output: ChassisReceipt[]
    side_effects: []
  - method: POST
    path: /component-lots
    description: Receive a component lot from a supplier.
    roles: [PlantAdmin]
    code: 201
    input: [supplier_id, part_number, lot_code, category, quantity_received]
    output: ComponentLot
    side_effects:
      - "quantity_available = quantity_received; quantity_installed = 0; quantity_quarantined = 0; status AVAILABLE"
  - method: GET
    path: /component-lots/{id}
    description: Read one component lot with its three piece counters.
    roles: [PlantAdmin, LineSupervisor, RecallCoordinator]
    code: 200
    input: []
    output: ComponentLot
    side_effects: []
  - method: GET
    path: /component-lots
    description: List component lots, filterable by supplier, part number, lot code and state.
    roles: [PlantAdmin, LineSupervisor, RecallCoordinator]
    code: 200
    input: ["supplier_id?", "part_number?", "lot_code?", "status?", "limit?", "offset?"]
    output: ComponentLot[]
    side_effects: []

  # --- ops: logical clock, daily close, test-driving injection -------------
  - method: POST
    path: /_clock/set_current_utc
    description: Set the logical clock. All ages, windows and expiries are measured against it.
    roles: [PlantAdmin]
    code: 200
    input: [current_utc]
    output: "{ current_utc: datetime, previous_utc: datetime }"
    side_effects:
      - "the clock may only move forward; a value at or before the current clock is ERR_INVALID_REQUEST"
      - "recomputes curtailment_due_cents and in_warranty on read; does NOT itself release slots or curtail orders"
    note: "Default clock value before any call is 2026-08-01T00:00:00Z."
  - method: POST
    path: /daily-close
    description: Ops checkpoint. Releases expired slot reservations and curtails aged floor-plan advances.
    roles: [PlantAdmin]
    code: 200
    input: []
    output: "{ released_slot_count: integer, released_order_ids: string[], curtailed_order_count: integer, curtailed_order_ids: string[], evaluated_at: datetime }"
    side_effects:
      - "every ProductionSlot with status RESERVED and expires_at <= clock now transitions RESERVED -> RELEASED"
      - "each such release cascades: the owning UnitOrder SLOTTED -> CONFIG_VALIDATED, then its MATCHED ChassisReceipt -> RECEIVED, then Dealer.allocation_* recomputed"
      - "every UnitOrder with financing_status FLOOR_PLAN_FUNDED whose calculations.floor_plan_curtailment_due is positive transitions FLOOR_PLAN_FUNDED -> CURTAILED"
      - "Dealer.credit_utilization_bp and credit_status recomputed for every affected dealer"
      - "idempotent within one clock instant: a second call at the same clock value releases and curtails nothing further"
  - method: POST
    path: /_inject/delivered-unit
    description: |
      Test-driving endpoint. Materialises a finished, shipped unit for a dealer
      in one call so warranty and recall behaviour can be exercised without
      replaying the whole build path. Used only by instances whose subject is
      NOT the order-to-ship pipeline.
    roles: [PlantAdmin]
    code: 201
    input: [dealer_id, floor_plan_id, "shipped_at?"]
    output: UnitBuild
    side_effects:
      - "creates a UnitOrder with order_type SOLD, no options, status SHIPPED, financing_status NOT_FINANCED and shipped_at set to the supplied value or the current clock"
      - "creates a ChassisReceipt with status INSTALLED for a synthetic supplier-less serial"
      - "creates the returned UnitBuild at current_station SHIPPED with water_test_passed and pdi_passed true, rework_count 0 and defect_points_total 0"

  # --- unit orders ---------------------------------------------------------
  - method: POST
    path: /unit-orders
    description: Open a dealer order against a floor plan and an option set.
    roles: [DealerPrincipal]
    code: 201
    input: [dealer_id, floor_plan_id, order_type, selected_option_ids, requested_delivery_date, "customer_reference?"]
    output: UnitOrder
    side_effects:
      - "runs calculations.unit_order_configuration_totals; status DRAFT, financing_status NOT_FINANCED"
      - "no compatibility, weight, electrical or water rule is enforced yet — those are submit-time gates"
  - method: GET
    path: /unit-orders/{id}
    description: Read one unit order with both of its state dimensions and all money fields.
    roles: [PlantAdmin, DealerPrincipal, ProductionScheduler, LineSupervisor, WarrantyAdministrator]
    code: 200
    input: []
    output: UnitOrder
    side_effects:
      - "recomputes curtailment_due_cents at the current logical clock"
  - method: GET
    path: /unit-orders
    description: List unit orders, filterable by dealer, floor plan and either state dimension.
    roles: [PlantAdmin, DealerPrincipal, ProductionScheduler]
    code: 200
    input: ["dealer_id?", "floor_plan_id?", "status?", "financing_status?", "order_type?", "limit?", "offset?"]
    output: UnitOrder[]
    side_effects: []
  - method: PUT
    path: /unit-orders/{id}/configuration
    description: Replace the option set of a DRAFT or CONFIG_VALIDATED order.
    roles: [DealerPrincipal]
    code: 200
    input: [selected_option_ids, "requested_delivery_date?"]
    output: UnitOrder
    side_effects:
      - "recomputes calculations.unit_order_configuration_totals"
      - "returns a CONFIG_VALIDATED order to DRAFT and clears locked_floor_plan_version, locked_option_versions and provisional_invoice_cents"
  - method: POST
    path: /unit-orders/{id}/submit
    description: Validate the configuration, price it provisionally and pin the reference versions.
    roles: [DealerPrincipal]
    code: 200
    input: []
    output: UnitOrder
    side_effects:
      - "enforces validations priority 10 through 13 in order: payload, electrical, water, then option compatibility and the station-hour ceiling"
      - "writes provisional_invoice_cents from calculations.dealer_invoice_amount variant PROVISIONAL_AT_SUBMIT"
      - "pins locked_floor_plan_version and locked_option_versions"
      - "status DRAFT -> CONFIG_VALIDATED"
  - method: POST
    path: /unit-orders/{id}/cancel
    description: Cancel an order that has not yet reached BUILT.
    roles: [DealerPrincipal]
    code: 200
    input: ["cancel_reason?"]
    output: UnitOrder
    side_effects:
      - "releases a RESERVED ProductionSlot and returns a MATCHED ChassisReceipt to RECEIVED"
      - "recomputes Dealer.allocation_slots_reserved and allocation_hours_consumed"
  - method: POST
    path: /unit-orders/{id}/production-slots
    description: Reserve a production slot on a line for a calendar day.
    roles: [ProductionScheduler]
    code: 201
    input: [line_id, slot_date, expected_unit_order_version]
    output: ProductionSlot
    side_effects:
      - "OCC per §1.2.1 rule slot-reserve-stale-order on expected_unit_order_version"
      - "releases the order's prior RESERVED slot BEFORE evaluating calculations.line_day_slot_capacity"
      - "enforces calculations.line_day_slot_capacity then calculations.dealer_slot_entitlement"
      - "status RESERVED, expires_at = created_at + SLOT_RESERVATION_TTL_HOURS"
      - "UnitOrder CONFIG_VALIDATED -> SLOTTED and increments UnitOrder.version by 1"
  - method: GET
    path: /production-slots/{id}
    description: Read one production slot.
    roles: [PlantAdmin, ProductionScheduler]
    code: 200
    input: []
    output: ProductionSlot
    side_effects: []
  - method: GET
    path: /production-slots
    description: List production slots, filterable by line, order, day and state.
    roles: [PlantAdmin, ProductionScheduler]
    code: 200
    input: ["line_id?", "unit_order_id?", "slot_date?", "status?", "limit?", "offset?"]
    output: ProductionSlot[]
    side_effects: []
  - method: POST
    path: /unit-orders/{id}/match-chassis
    description: Assign the winning chassis from the received pool to this order.
    roles: [ProductionScheduler]
    code: 200
    input: []
    output: ChassisReceipt
    side_effects:
      - "runs calculations.chassis_match_selection; empty eligible set is ERR_NO_MATCHING_CHASSIS"
      - "the winner transitions RECEIVED -> MATCHED with matched_unit_order_id set"
  - method: POST
    path: /unit-orders/{id}/release-to-line
    description: "Start the build: consume the slot and the chassis and open a UnitBuild."
    roles: [ProductionScheduler]
    code: 201
    input: []
    output: UnitBuild
    side_effects:
      - "re-checks locked_floor_plan_version and locked_option_versions; drift is ERR_CONFIG_REFERENCE_STALE"
      - "ProductionSlot RESERVED -> CONSUMED; ChassisReceipt MATCHED -> INSTALLED"
      - "UnitOrder SLOTTED -> IN_PRODUCTION"
      - "creates the UnitBuild at CHASSIS_PREP with build_sequence and vin assigned"
  - method: POST
    path: /unit-orders/{id}/ship
    description: Ship a completed unit and settle the final invoice.
    roles: [ProductionScheduler]
    code: 200
    input: []
    output: UnitOrder
    side_effects:
      - "enforces the safety band (recall ship-stop, water test, PDI) then the fiscal band (credit hold, floor-plan funding for STOCK orders)"
      - "writes final_invoice_cents from calculations.dealer_invoice_amount variant FINAL_AT_SHIP"
      - "shipped_at stamped from the logical clock; UnitBuild READY_TO_SHIP -> SHIPPED"
      - "status BUILT -> SHIPPED"
  - method: POST
    path: /unit-orders/{id}/request-funding
    description: Ask the plant to floor-plan this unit.
    roles: [DealerPrincipal]
    code: 200
    input: []
    output: UnitOrder
    side_effects:
      - "financing_status NOT_FINANCED -> FUNDING_REQUESTED, leaving status untouched"
  - method: POST
    path: /unit-orders/{id}/funding-decision
    description: Approve or decline a floor-plan funding request.
    roles: [PlantAdmin]
    code: 200
    input: [decision, "decline_reason?"]
    output: UnitOrder
    side_effects:
      - "APPROVED: financed_principal_cents = round_half_up(provisional_invoice_cents * FLOOR_PLAN_ADVANCE_BP / 10000), funded_at stamped, financing_status -> FLOOR_PLAN_FUNDED"
      - "DECLINED: financing_status -> NOT_FINANCED"
      - "recomputes Dealer.financed_exposure_cents, credit_utilization_bp and credit_status"
  - method: POST
    path: /unit-orders/{id}/floor-plan-payment
    description: Pay down floor-plan principal, satisfying curtailment or retiring the advance.
    roles: [DealerPrincipal]
    code: 200
    input: [amount_cents]
    output: UnitOrder
    side_effects:
      - "curtailment_paid_cents += amount_cents; paying more than the remaining principal is ERR_PAYMENT_EXCEEDS_PRINCIPAL"
      - "recomputes curtailment_due_cents; a CURTAILED order whose due amount reaches 0 returns to FLOOR_PLAN_FUNDED"
      - "paying the full remaining principal moves financing_status to PAID_OFF and removes the unit from the dealer's exposure"
      - "recomputes Dealer.financed_exposure_cents, credit_utilization_bp and credit_status"

  # --- assembly ------------------------------------------------------------
  - method: GET
    path: /unit-builds/{id}
    description: Read one build with its station, hour, defect and hold state.
    roles: [PlantAdmin, ProductionScheduler, LineSupervisor, QualityInspector, WarrantyAdministrator]
    code: 200
    input: []
    output: UnitBuild
    side_effects: []
  - method: GET
    path: /unit-builds
    description: List builds, filterable by order, chassis and station.
    roles: [PlantAdmin, ProductionScheduler, LineSupervisor, QualityInspector]
    code: 200
    input: ["unit_order_id?", "chassis_receipt_id?", "current_station?", "recall_hold?", "limit?", "offset?"]
    output: UnitBuild[]
    side_effects: []
  - method: POST
    path: /unit-builds/{id}/advance
    description: Move a build to the next station, booking the hours the station consumed.
    roles: [LineSupervisor]
    code: 200
    input: [to_station, station_hours_used]
    output: UnitBuild
    side_effects:
      - "to_station must be the immediate successor of current_station, else ERR_STATION_SEQUENCE_VIOLATION"
      - "the occupied line must be RUNNING, else ERR_LINE_NOT_RUNNING; recall_hold blocks with ERR_RECALL_SHIP_STOP"
      - "actual_station_hours += station_hours_used, which feeds the overtime term of the FINAL_AT_SHIP invoice"
      - "WATER_TEST requires water_test_passed; PDI requires pdi_passed; entering READY_TO_SHIP moves UnitOrder IN_PRODUCTION -> BUILT"
  - method: POST
    path: /component-installations
    description: Install pieces from a component lot into a build at a station.
    roles: [LineSupervisor]
    code: 201
    input: [unit_build_id, component_lot_id, station, quantity]
    output: ComponentInstallation
    side_effects:
      - "a QUARANTINED lot is ERR_LOT_QUARANTINED; quantity above quantity_available is ERR_LOT_QUANTITY_INSUFFICIENT"
      - "ComponentLot.quantity_available -= quantity and quantity_installed += quantity, conserving the piece total"
      - "the lot becomes DEPLETED when quantity_available reaches 0"
  - method: GET
    path: /component-installations/{id}
    description: Read one installation.
    roles: [PlantAdmin, LineSupervisor, RecallCoordinator]
    code: 200
    input: []
    output: ComponentInstallation
    side_effects: []
  - method: GET
    path: /component-installations
    description: List installations, filterable by build, lot, campaign and state.
    roles: [PlantAdmin, LineSupervisor, RecallCoordinator]
    code: 200
    input: ["unit_build_id?", "component_lot_id?", "recall_campaign_id?", "status?", "limit?", "offset?"]
    output: ComponentInstallation[]
    side_effects: []
  - method: POST
    path: /component-installations/{id}/reverse
    description: Undo an installation, returning the pieces to the lot.
    roles: [LineSupervisor]
    code: 200
    input: ["reversal_reason?"]
    output: ComponentInstallation
    side_effects:
      - "status INSTALLED -> REVERSED"
      - "ComponentLot.quantity_installed -= quantity and quantity_available += quantity; a DEPLETED lot returns to AVAILABLE"
  - method: POST
    path: /component-installations/{id}/remedy
    description: Record that a recall-affected installation has been remedied.
    roles: [RecallCoordinator]
    code: 200
    input: ["remedy_note?"]
    output: ComponentInstallation
    side_effects:
      - "status RECALL_AFFECTED -> REMEDIED; campaign.remedied_installation_count += 1"
      - "when the build has no RECALL_AFFECTED installations left, UnitBuild.recall_hold becomes false and a RECALL_HOLD ship_hold_reason is cleared"

  # --- quality -------------------------------------------------------------
  - method: POST
    path: /quality-inspections
    description: Schedule a water test, functional test or pre-delivery inspection.
    roles: [QualityInspector]
    code: 201
    input: [unit_build_id, inspection_type, "test_booth_id?", "window_start?", "window_end?"]
    output: QualityInspection
    side_effects:
      - "WATER_TEST and FUNCTIONAL require test_booth_id, window_start and window_end and run calculations.booth_window_conflict; PDI requires all three be omitted"
      - "inspector_user_id set from X-User-ID; status SCHEDULED"
  - method: GET
    path: /quality-inspections/{id}
    description: Read one inspection.
    roles: [PlantAdmin, QualityInspector, LineSupervisor]
    code: 200
    input: []
    output: QualityInspection
    side_effects: []
  - method: GET
    path: /quality-inspections
    description: List inspections, filterable by build, booth, type and state.
    roles: [PlantAdmin, QualityInspector, LineSupervisor]
    code: 200
    input: ["unit_build_id?", "test_booth_id?", "inspection_type?", "status?", "result?", "limit?", "offset?"]
    output: QualityInspection[]
    side_effects: []
  - method: POST
    path: /quality-inspections/{id}/complete
    description: Record findings and grade the inspection, driving the build station machine.
    roles: [QualityInspector]
    code: 200
    input: [defect_points, leak_detected]
    output: QualityInspection
    side_effects:
      - "result graded by calculations.inspection_grade; completed_by_user_id set from X-User-ID"
      - "a PDI completed by the same user who completed the build's latest WATER_TEST is ERR_SEGREGATION_OF_DUTIES"
      - "UnitBuild.defect_points_total += defect_points, feeding the FINAL_AT_SHIP quality credit"
      - "PASS or CONDITIONAL sets water_test_passed / pdi_passed; FAIL reworks the build backwards, or SCRAPS it and CANCELS the order past MAX_REWORK"

  # --- warranty ------------------------------------------------------------
  - method: POST
    path: /warranty-claims
    description: A dealer files a warranty claim against a delivered unit.
    roles: [DealerPrincipal]
    code: 201
    input: [unit_build_id, claim_type, labor_hours, parts_cost_cents, narrative, "component_lot_id?", "goodwill_requested_cents?"]
    output: WarrantyClaim
    side_effects:
      - "dealer_id taken from X-User-ID, never from the body; a build belonging to another dealer is ERR_DEALER_SCOPE_VIOLATION"
      - "in_warranty computed from the owning order's shipped_at against WARRANTY_DAYS, selecting the reimbursement variant"
      - "previews steps 1 to 4 of calculations.warranty_claim_reimbursement; goodwill and chargeback stay 0 until the decision"
      - "status SUBMITTED"
  - method: GET
    path: /warranty-claims/{id}
    description: Read one claim with its full reimbursement breakdown.
    roles: [PlantAdmin, DealerPrincipal, WarrantyAdministrator]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []
  - method: GET
    path: /warranty-claims
    description: List claims, filterable by dealer, build, lot and state.
    roles: [PlantAdmin, DealerPrincipal, WarrantyAdministrator]
    code: 200
    input: ["dealer_id?", "unit_build_id?", "component_lot_id?", "status?", "claim_type?", "limit?", "offset?"]
    output: WarrantyClaim[]
    side_effects: []
  - method: POST
    path: /warranty-claims/{id}/request-info
    description: Send a claim back to the dealer for more information.
    roles: [WarrantyAdministrator]
    code: 200
    input: ["info_request_note?"]
    output: WarrantyClaim
    side_effects:
      - "info_request_count += 1; a third request is ERR_INFO_REQUEST_LIMIT_REACHED"
      - "status SUBMITTED -> INFO_REQUESTED"
  - method: POST
    path: /warranty-claims/{id}/resubmit
    description: Dealer answers an information request, optionally revising the claim.
    roles: [DealerPrincipal]
    code: 200
    input: ["labor_hours?", "parts_cost_cents?", "narrative?"]
    output: WarrantyClaim
    side_effects:
      - "supplied fields replace the stored values and the reimbursement preview is recomputed"
      - "resubmission_count += 1; status INFO_REQUESTED -> SUBMITTED"
  - method: POST
    path: /warranty-claims/{id}/decide
    description: Approve or deny a claim, fixing the payout and the supplier chargeback.
    roles: [WarrantyAdministrator]
    code: 200
    input: [decision, "denial_reason?"]
    output: WarrantyClaim
    side_effects:
      - "APPROVED runs all seven steps of calculations.warranty_claim_reimbursement in the pinned order and stores authority_tier, goodwill_authorized_cents, total_reimbursement_cents and supplier_chargeback_cents"
      - "approved_by_user_id set from X-User-ID; Dealer.goodwill_used_cents += goodwill_authorized_cents"
      - "a positive supplier_chargeback_cents is a penalty event: the lot's Supplier gains a penalty_event_count and is rescored"
      - "DENIED zeroes goodwill_authorized_cents and total_reimbursement_cents"
  - method: POST
    path: /warranty-claims/{id}/pay
    description: Pay an approved claim.
    roles: [WarrantyAdministrator]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects:
      - "paid_by_user_id set from X-User-ID and must differ from approved_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
      - "status APPROVED -> PAID"

  # --- recalls -------------------------------------------------------------
  - method: POST
    path: /recall-campaigns
    description: Draft a recall campaign scoped to a supplier part number and lot codes.
    roles: [RecallCoordinator]
    code: 201
    input: [supplier_id, campaign_code, part_number, lot_codes, severity]
    output: RecallCampaign
    side_effects:
      - "status DRAFT; ship_stop derived from severity; nothing is quarantined until the campaign opens"
  - method: GET
    path: /recall-campaigns/{id}
    description: Read one campaign with its affected and remedied counters.
    roles: [PlantAdmin, RecallCoordinator]
    code: 200
    input: []
    output: RecallCampaign
    side_effects: []
  - method: GET
    path: /recall-campaigns
    description: List campaigns, filterable by supplier, severity and state.
    roles: [PlantAdmin, RecallCoordinator]
    code: 200
    input: ["supplier_id?", "part_number?", "severity?", "status?", "limit?", "offset?"]
    output: RecallCampaign[]
    side_effects: []
  - method: POST
    path: /recall-campaigns/{id}/open
    description: Open the campaign, firing the quarantine and hold cascade.
    roles: [RecallCoordinator]
    code: 200
    input: []
    output: RecallCampaign
    side_effects:
      - "hop 1: every matching ComponentLot -> QUARANTINED with its available pieces frozen"
      - "hop 2: every INSTALLED ComponentInstallation of those lots -> RECALL_AFFECTED, setting UnitBuild.recall_hold"
      - "hop 3: for a SAFETY campaign, each held build's UnitOrder.ship_hold_reason -> RECALL_HOLD"
      - "hop 4: Supplier.open_recall_count and penalty_event_count increase and the supplier is rescored, which can drop it to PROBATION or SUSPENDED and thereby change chassis eligibility and the warranty chargeback rate"
  - method: POST
    path: /recall-campaigns/{id}/expand
    description: Add lot codes to an open campaign, rerunning the cascade for newly scoped lots.
    roles: [RecallCoordinator]
    code: 200
    input: [additional_lot_codes, expected_recall_campaign_version]
    output: RecallCampaign
    side_effects:
      - "OCC per §1.2.1 rule recall-expand-stale-campaign on expected_recall_campaign_version"
      - "lot_codes becomes the union with additional_lot_codes; hops 1 to 3 run for newly matched lots only"
      - "open_recall_count is NOT incremented again and no second penalty event is recorded"
      - "increments RecallCampaign.version by 1"
  - method: POST
    path: /recall-campaigns/{id}/close
    description: Close a fully remedied campaign.
    roles: [RecallCoordinator]
    code: 200
    input: []
    output: RecallCampaign
    side_effects:
      - "remedied_installation_count must equal affected_installation_count, else ERR_CAMPAIGN_NOT_CLOSEABLE"
      - "Supplier.open_recall_count -= 1 and the supplier is rescored; the penalty event survives the close"
      - "quarantined pieces are never returned to quantity_available"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---------------------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http_status: 401
    condition: "X-User-ID or X-User-Role header missing or empty"
    applies_to: [all]
  - id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    condition: "X-User-Role is unknown or is not listed in the endpoint's roles"
    applies_to: [all]
  - id: ERR_DEALER_SCOPE_VIOLATION
    http_status: 403
    condition: "a DealerPrincipal addresses a UnitOrder, UnitBuild or WarrantyClaim that belongs to another dealer, or supplies a dealer_id other than its own X-User-ID"
    applies_to: ["POST /unit-orders", "PUT /unit-orders/{id}/configuration", "POST /unit-orders/{id}/submit", "POST /unit-orders/{id}/cancel", "POST /unit-orders/{id}/request-funding", "POST /unit-orders/{id}/floor-plan-payment", "GET /unit-orders/{id}", "POST /warranty-claims", "POST /warranty-claims/{id}/resubmit", "GET /warranty-claims/{id}"]

  # --- schema -------------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http_status: 400
    condition: "unparseable body, missing required field, wrong type, undeclared enum member, negative or zero money/quantity/hours, duplicate entries in selected_option_ids, window_end <= window_start, booth window outside MIN_TEST_MINUTES..MAX_TEST_MINUTES, test_booth_id present for PDI or absent for WATER_TEST/FUNCTIONAL, booth_type != inspection_type, pagination limit outside 1..100, or a clock value not strictly after the current clock"
    applies_to: [all]

  # --- existence ----------------------------------------------------------
  - id: ERR_SUPPLIER_NOT_FOUND
    http_status: 404
    condition: "supplier id in the path or body does not exist"
    applies_to: ["GET /suppliers/{id}", "GET /suppliers/{id}/scorecard", "POST /chassis-receipts", "POST /component-lots", "POST /recall-campaigns"]
  - id: ERR_FLOOR_PLAN_NOT_FOUND
    http_status: 404
    condition: "floor plan id in the path or body does not exist"
    applies_to: ["GET /floor-plans/{id}", "PATCH /floor-plans/{id}", "POST /unit-orders", "POST /_inject/delivered-unit"]
  - id: ERR_OPTION_ITEM_NOT_FOUND
    http_status: 404
    condition: "an entry of selected_option_ids, or an option id in the path, does not exist"
    applies_to: ["GET /option-items/{id}", "PATCH /option-items/{id}", "POST /unit-orders", "PUT /unit-orders/{id}/configuration"]
  - id: ERR_DEALER_NOT_FOUND
    http_status: 404
    condition: "dealer id in the path or body does not exist"
    applies_to: ["GET /dealers/{id}", "POST /dealers/{id}/status", "POST /unit-orders", "POST /_inject/delivered-unit"]
  - id: ERR_PRODUCTION_LINE_NOT_FOUND
    http_status: 404
    condition: "line id in the path or body does not exist"
    applies_to: ["GET /production-lines/{id}", "POST /production-lines/{id}/status", "POST /unit-orders/{id}/production-slots"]
  - id: ERR_TEST_BOOTH_NOT_FOUND
    http_status: 404
    condition: "booth id in the path or body does not exist"
    applies_to: ["GET /test-booths/{id}", "POST /test-booths/{id}/status", "POST /quality-inspections"]
  - id: ERR_UNIT_ORDER_NOT_FOUND
    http_status: 404
    condition: "unit order id in the path does not exist"
    applies_to: ["GET /unit-orders/{id}", "PUT /unit-orders/{id}/configuration", "POST /unit-orders/{id}/submit", "POST /unit-orders/{id}/cancel", "POST /unit-orders/{id}/production-slots", "POST /unit-orders/{id}/match-chassis", "POST /unit-orders/{id}/release-to-line", "POST /unit-orders/{id}/ship", "POST /unit-orders/{id}/request-funding", "POST /unit-orders/{id}/funding-decision", "POST /unit-orders/{id}/floor-plan-payment"]
  - id: ERR_PRODUCTION_SLOT_NOT_FOUND
    http_status: 404
    condition: "production slot id in the path does not exist"
    applies_to: ["GET /production-slots/{id}"]
  - id: ERR_CHASSIS_RECEIPT_NOT_FOUND
    http_status: 404
    condition: "chassis receipt id in the path does not exist"
    applies_to: ["GET /chassis-receipts/{id}"]
  - id: ERR_COMPONENT_LOT_NOT_FOUND
    http_status: 404
    condition: "component lot id in the path or body does not exist"
    applies_to: ["GET /component-lots/{id}", "POST /component-installations", "POST /warranty-claims"]
  - id: ERR_UNIT_BUILD_NOT_FOUND
    http_status: 404
    condition: "unit build id in the path or body does not exist"
    applies_to: ["GET /unit-builds/{id}", "POST /unit-builds/{id}/advance", "POST /component-installations", "POST /quality-inspections", "POST /warranty-claims"]
  - id: ERR_COMPONENT_INSTALLATION_NOT_FOUND
    http_status: 404
    condition: "component installation id in the path does not exist"
    applies_to: ["GET /component-installations/{id}", "POST /component-installations/{id}/reverse", "POST /component-installations/{id}/remedy"]
  - id: ERR_QUALITY_INSPECTION_NOT_FOUND
    http_status: 404
    condition: "quality inspection id in the path does not exist"
    applies_to: ["GET /quality-inspections/{id}", "POST /quality-inspections/{id}/complete"]
  - id: ERR_WARRANTY_CLAIM_NOT_FOUND
    http_status: 404
    condition: "warranty claim id in the path does not exist"
    applies_to: ["GET /warranty-claims/{id}", "POST /warranty-claims/{id}/request-info", "POST /warranty-claims/{id}/resubmit", "POST /warranty-claims/{id}/decide", "POST /warranty-claims/{id}/pay"]
  - id: ERR_RECALL_CAMPAIGN_NOT_FOUND
    http_status: 404
    condition: "recall campaign id in the path does not exist"
    applies_to: ["GET /recall-campaigns/{id}", "POST /recall-campaigns/{id}/open", "POST /recall-campaigns/{id}/expand", "POST /recall-campaigns/{id}/close"]

  # --- state --------------------------------------------------------------
  - id: ERR_INVALID_STATE
    http_status: 409
    condition: "the requested transition does not exist from the entity's current state and no more specific state code applies"
    applies_to: [all]
  - id: ERR_ORDER_NOT_SUBMITTABLE
    http_status: 409
    condition: "submit attempted on an order whose status is not DRAFT — a second submit of an already CONFIG_VALIDATED order included — or configuration replacement attempted on an order whose status is not DRAFT or CONFIG_VALIDATED"
    applies_to: ["POST /unit-orders/{id}/submit", "PUT /unit-orders/{id}/configuration"]
  - id: ERR_ORDER_NOT_SLOTTABLE
    http_status: 409
    condition: "slot reservation attempted on an order whose status is not CONFIG_VALIDATED or SLOTTED"
    applies_to: ["POST /unit-orders/{id}/production-slots"]
  - id: ERR_ORDER_ALREADY_MATCHED
    http_status: 409
    condition: "match-chassis attempted on an order that already has a MATCHED or INSTALLED chassis"
    applies_to: ["POST /unit-orders/{id}/match-chassis"]
  - id: ERR_CHASSIS_NOT_MATCHED
    http_status: 409
    condition: "release-to-line attempted with no MATCHED ChassisReceipt for the order"
    applies_to: ["POST /unit-orders/{id}/release-to-line"]
  - id: ERR_DEALER_SUSPENDED
    http_status: 409
    condition: "the dealer's status is SUSPENDED at submit, slot reservation, release to line or shipment"
    applies_to: ["POST /unit-orders/{id}/submit", "POST /unit-orders/{id}/production-slots", "POST /unit-orders/{id}/release-to-line", "POST /unit-orders/{id}/ship", "POST /unit-orders/{id}/request-funding"]
  - id: ERR_FLOOR_PLAN_RETIRED
    http_status: 409
    condition: "submit attempted against a floor plan whose status is RETIRED"
    applies_to: ["POST /unit-orders/{id}/submit"]
  - id: ERR_STATION_SEQUENCE_VIOLATION
    http_status: 409
    condition: "to_station is not the immediate successor of the build's current_station, or the build is SHIPPED or SCRAPPED"
    applies_to: ["POST /unit-builds/{id}/advance"]
  - id: ERR_LINE_NOT_RUNNING
    http_status: 409
    condition: "the line occupied by the build has status PAUSED"
    applies_to: ["POST /unit-builds/{id}/advance"]
  - id: ERR_BOOTH_NOT_OPEN
    http_status: 409
    condition: "the requested test booth has status DOWN"
    applies_to: ["POST /quality-inspections"]
  - id: ERR_INSPECTION_STATION_MISMATCH
    http_status: 409
    condition: "the build is not standing at the station the inspection type requires (WATER_TEST needs WATER_TEST, PDI needs PDI, FUNCTIONAL needs either)"
    applies_to: ["POST /quality-inspections/{id}/complete"]
  - id: ERR_LOT_QUANTITY_INSUFFICIENT
    http_status: 409
    condition: "requested quantity exceeds ComponentLot.quantity_available"
    applies_to: ["POST /component-installations"]
  - id: ERR_CLAIM_NOT_DECIDABLE
    http_status: 409
    condition: "decide, request-info or resubmit attempted from a claim status that does not allow it, or pay attempted on a claim that is not APPROVED"
    applies_to: ["POST /warranty-claims/{id}/decide", "POST /warranty-claims/{id}/request-info", "POST /warranty-claims/{id}/resubmit", "POST /warranty-claims/{id}/pay"]
  - id: ERR_INFO_REQUEST_LIMIT_REACHED
    http_status: 409
    condition: "a third information request on the same claim (info_request_count already equals MAX_INFO_REQUESTS)"
    applies_to: ["POST /warranty-claims/{id}/request-info"]
  - id: ERR_CAMPAIGN_NOT_CLOSEABLE
    http_status: 409
    condition: "close attempted while remedied_installation_count < affected_installation_count"
    applies_to: ["POST /recall-campaigns/{id}/close"]
  - id: ERR_PAYMENT_EXCEEDS_PRINCIPAL
    http_status: 409
    condition: "amount_cents exceeds financed_principal_cents - curtailment_paid_cents"
    applies_to: ["POST /unit-orders/{id}/floor-plan-payment"]

  # --- optimistic concurrency --------------------------------------------
  - id: ERR_STALE_UNIT_ORDER_VERSION
    http_status: 412
    condition: "expected_unit_order_version != UnitOrder.version"
    applies_to: ["POST /unit-orders/{id}/production-slots"]
  - id: ERR_STALE_RECALL_CAMPAIGN_VERSION
    http_status: 412
    condition: "expected_recall_campaign_version != RecallCampaign.version"
    applies_to: ["POST /recall-campaigns/{id}/expand"]

  # --- safety -------------------------------------------------------------
  - id: ERR_RECALL_SHIP_STOP
    http_status: 409
    condition: "the build has recall_hold true, or the order has ship_hold_reason RECALL_HOLD"
    applies_to: ["POST /unit-orders/{id}/ship", "POST /unit-builds/{id}/advance"]
  - id: ERR_WATER_TEST_NOT_PASSED
    http_status: 409
    condition: "advancement past WATER_TEST or shipment attempted while water_test_passed is false"
    applies_to: ["POST /unit-builds/{id}/advance", "POST /unit-orders/{id}/ship"]
  - id: ERR_PDI_NOT_PASSED
    http_status: 409
    condition: "advancement past PDI or shipment attempted while pdi_passed is false"
    applies_to: ["POST /unit-builds/{id}/advance", "POST /unit-orders/{id}/ship"]
  - id: ERR_QUALITY_HOLD
    http_status: 409
    condition: "shipment attempted on an order whose ship_hold_reason is QUALITY_HOLD; this is the specific state code for an order that was cancelled by a scrapped build, and it is reported in place of the generic ERR_INVALID_STATE at validation priority 7"
    applies_to: ["POST /unit-orders/{id}/ship"]
  - id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    condition: "the PDI completer is the same user who completed the build's latest WATER_TEST, or the paying administrator is the claim's approved_by_user_id"
    applies_to: ["POST /quality-inspections/{id}/complete", "POST /warranty-claims/{id}/pay"]

  # --- physical configuration limits --------------------------------------
  - id: ERR_PAYLOAD_CAPACITY_EXCEEDED
    http_status: 422
    condition: "config_weight_lbs > floor_plan.gvwr_lbs"
    applies_to: ["POST /unit-orders/{id}/submit"]
  - id: ERR_ELECTRICAL_SERVICE_EXCEEDED
    http_status: 422
    condition: "total_amp_draw > floor_plan.electrical_service_amps"
    applies_to: ["POST /unit-orders/{id}/submit"]
  - id: ERR_WATER_SYSTEM_CAPACITY_EXCEEDED
    http_status: 422
    condition: "total_water_demand_gal exceeds WATER_DEMAND_RATIO_BP of fresh_water_capacity_gal"
    applies_to: ["POST /unit-orders/{id}/submit"]
  - id: ERR_OPTION_DISCONTINUED
    http_status: 422
    condition: "a selected option has status DISCONTINUED at submit"
    applies_to: ["POST /unit-orders/{id}/submit"]
  - id: ERR_OPTION_REQUIRES_MISSING
    http_status: 422
    condition: "the transitive requires closure of the selected options is not satisfied"
    applies_to: ["POST /unit-orders/{id}/submit"]
  - id: ERR_OPTION_MUTUALLY_EXCLUSIVE
    http_status: 422
    condition: "two selected options exclude each other"
    applies_to: ["POST /unit-orders/{id}/submit"]
  - id: ERR_STATION_HOURS_LIMIT_EXCEEDED
    http_status: 422
    condition: "required_station_hours > MAX_SINGLE_UNIT_HOURS"
    applies_to: ["POST /unit-orders/{id}/submit"]

  # --- referential drift and supply --------------------------------------
  - id: ERR_CONFIG_REFERENCE_STALE
    http_status: 409
    condition: "FloorPlan.version != locked_floor_plan_version, or a selected option's version != its locked_option_versions entry"
    applies_to: ["POST /unit-orders/{id}/release-to-line", "POST /unit-orders/{id}/match-chassis"]
  - id: ERR_NO_MATCHING_CHASSIS
    http_status: 422
    condition: "calculations.chassis_match_selection yields an empty eligible set"
    applies_to: ["POST /unit-orders/{id}/match-chassis"]
  - id: ERR_LOT_QUARANTINED
    http_status: 409
    condition: "the referenced ComponentLot has status QUARANTINED"
    applies_to: ["POST /component-installations"]
  - id: ERR_LINE_CLASS_MISMATCH
    http_status: 422
    condition: "line.chassis_class_supported != floor_plan.chassis_class"
    applies_to: ["POST /unit-orders/{id}/production-slots"]

  # --- temporal capacity --------------------------------------------------
  - id: ERR_BOOTH_WINDOW_CONFLICT
    http_status: 409
    condition: "buffer-extended overlapping reservations on the booth would exceed bay_count"
    applies_to: ["POST /quality-inspections"]
  - id: ERR_LINE_DAY_UNIT_CAP_EXCEEDED
    http_status: 409
    condition: "occupied_units + 1 > line.max_units_per_day on the requested slot_date"
    applies_to: ["POST /unit-orders/{id}/production-slots"]
  - id: ERR_LINE_DAY_HOURS_EXCEEDED
    http_status: 409
    condition: "committed_hours + required_station_hours > line.daily_station_hour_capacity on the requested slot_date"
    applies_to: ["POST /unit-orders/{id}/production-slots"]

  # --- fiscal -------------------------------------------------------------
  - id: ERR_DEALER_CREDIT_HOLD
    http_status: 422
    condition: "the dealer's credit_status is CREDIT_HOLD"
    applies_to: ["POST /unit-orders/{id}/production-slots", "POST /unit-orders/{id}/release-to-line", "POST /unit-orders/{id}/ship"]
  - id: ERR_DEALER_CURTAILMENT_DELINQUENT
    http_status: 422
    condition: "the dealer has a CURTAILED order with curtailment_due_cents > 0"
    applies_to: ["POST /unit-orders/{id}/production-slots", "POST /unit-orders/{id}/release-to-line"]
  - id: ERR_DEALER_ALLOCATION_EXCEEDED
    http_status: 422
    condition: "the dealer's committed station hours in the slot month plus this order exceed its tolerance-adjusted entitlement"
    applies_to: ["POST /unit-orders/{id}/production-slots"]
  - id: ERR_FLOOR_PLAN_FUNDING_REQUIRED
    http_status: 422
    condition: "shipment of a STOCK order whose financing_status is not FLOOR_PLAN_FUNDED"
    applies_to: ["POST /unit-orders/{id}/ship"]
  - id: ERR_GOODWILL_BUDGET_EXHAUSTED
    http_status: 422
    condition: "goodwill_requested_cents > 0 while the dealer's remaining goodwill budget is 0"
    applies_to: ["POST /warranty-claims/{id}/decide"]

# =============================================================================
# §1.7 RBAC Permission Matrix
# =============================================================================
roles:
  - name: PlantAdmin
    description: |
      Plant-side master data and finance. Owns suppliers, floor plans, options,
      dealers, lines, booths, supply intake, floor-plan funding decisions, the
      logical clock, the daily-close checkpoint and the test-driving injection
      endpoint. Deliberately cannot act inside the shop floor, quality,
      warranty or recall workflows.
    identity: opaque
    exclusive_operations:
      - "POST /suppliers"
      - "POST /floor-plans"
      - "PATCH /floor-plans/{id}"
      - "POST /option-items"
      - "PATCH /option-items/{id}"
      - "POST /dealers"
      - "POST /dealers/{id}/status"
      - "POST /production-lines"
      - "POST /test-booths"
      - "POST /test-booths/{id}/status"
      - "POST /chassis-receipts"
      - "POST /component-lots"
      - "POST /_clock/set_current_utc"
      - "POST /daily-close"
      - "POST /_inject/delivered-unit"
      - "POST /unit-orders/{id}/funding-decision"
    shared_operations:
      - "GET /suppliers/{id}, GET /suppliers/{id}/scorecard, GET /floor-plans/{id}, GET /option-items/{id}, GET /dealers/{id}, GET /production-lines/{id}, GET /test-booths/{id}"
      - "POST /production-lines/{id}/status (with ProductionScheduler)"
      - "every read-only list and single-resource GET in the table"
  - name: DealerPrincipal
    description: |
      The ordering dealer. X-User-ID is the Dealer.id, so every order, build and
      claim it touches must resolve to that dealer. Owns configuration, submit,
      cancel, funding requests, floor-plan payments, warranty filing and
      resubmission. Cannot schedule, build, inspect, decide claims or recall.
    identity: entity_backed:Dealer
    exclusive_operations:
      - "POST /unit-orders"
      - "PUT /unit-orders/{id}/configuration"
      - "POST /unit-orders/{id}/submit"
      - "POST /unit-orders/{id}/cancel"
      - "POST /unit-orders/{id}/request-funding"
      - "POST /unit-orders/{id}/floor-plan-payment"
      - "POST /warranty-claims"
      - "POST /warranty-claims/{id}/resubmit"
    shared_operations:
      - "GET /unit-orders/{id} and GET /unit-orders (own rows only)"
      - "GET /warranty-claims/{id} and GET /warranty-claims (own rows only)"
      - "GET /floor-plans/{id}, GET /option-items/{id}, GET /dealers/{id}"
  - name: ProductionScheduler
    description: |
      Owns capacity and the order-to-line handoff: slot reservation, chassis
      matching, release to line and shipment. Cannot price, fund, inspect or
      touch warranty and recall records.
    identity: opaque
    exclusive_operations:
      - "POST /unit-orders/{id}/production-slots"
      - "POST /unit-orders/{id}/match-chassis"
      - "POST /unit-orders/{id}/release-to-line"
      - "POST /unit-orders/{id}/ship"
    shared_operations:
      - "POST /production-lines/{id}/status (with PlantAdmin)"
      - "GET /unit-orders/{id}, GET /unit-orders, GET /production-slots, GET /production-slots/{id}, GET /chassis-receipts, GET /chassis-receipts/{id}, GET /unit-builds, GET /unit-builds/{id}"
      - "GET /suppliers/{id}, GET /suppliers/{id}/scorecard, GET /dealers/{id}, GET /floor-plans/{id}, GET /option-items/{id}, GET /production-lines/{id}"
  - name: LineSupervisor
    description: |
      Runs the assembly stations: advancement and component installation and
      its reversal. Cannot schedule, inspect, ship, or remedy recall-affected
      installations (that authority belongs to the RecallCoordinator).
    identity: opaque
    exclusive_operations:
      - "POST /unit-builds/{id}/advance"
      - "POST /component-installations"
      - "POST /component-installations/{id}/reverse"
    shared_operations:
      - "GET /unit-builds, GET /unit-builds/{id}, GET /component-installations, GET /component-installations/{id}, GET /component-lots, GET /component-lots/{id}, GET /quality-inspections, GET /quality-inspections/{id}, GET /unit-orders/{id}, GET /production-lines/{id}"
  - name: QualityInspector
    description: |
      Books booth windows and grades water tests, functional tests and
      pre-delivery inspections. Segregation of duties applies within the role:
      the individual who completed a build's water test may not complete that
      build's PDI.
    identity: opaque
    exclusive_operations:
      - "POST /quality-inspections"
      - "POST /quality-inspections/{id}/complete"
    shared_operations:
      - "GET /quality-inspections, GET /quality-inspections/{id}, GET /unit-builds, GET /unit-builds/{id}, GET /test-booths/{id}"
  - name: WarrantyAdministrator
    description: |
      Adjudicates dealer warranty claims: information requests, approval or
      denial, and payment. Segregation of duties applies within the role: the
      approver may not also pay.
    identity: opaque
    exclusive_operations:
      - "POST /warranty-claims/{id}/request-info"
      - "POST /warranty-claims/{id}/decide"
      - "POST /warranty-claims/{id}/pay"
    shared_operations:
      - "GET /warranty-claims, GET /warranty-claims/{id}, GET /unit-builds/{id}, GET /unit-orders/{id}, GET /dealers/{id}, GET /suppliers/{id}, GET /suppliers/{id}/scorecard"
  - name: RecallCoordinator
    description: |
      Files, opens, expands and closes supplier recall campaigns and records
      remedies on affected installations. Cannot install or reverse components,
      inspect, ship or adjudicate warranty claims.
    identity: opaque
    exclusive_operations:
      - "POST /recall-campaigns"
      - "POST /recall-campaigns/{id}/open"
      - "POST /recall-campaigns/{id}/expand"
      - "POST /recall-campaigns/{id}/close"
      - "POST /component-installations/{id}/remedy"
    shared_operations:
      - "GET /recall-campaigns, GET /recall-campaigns/{id}, GET /component-installations, GET /component-installations/{id}, GET /component-lots, GET /component-lots/{id}, GET /suppliers/{id}, GET /suppliers/{id}/scorecard"
