    description: "Lock a team roster (FORMING->LOCKED)."
    roles: [StudioAdmin]
    code: 200
    input: []
    output: CompetitionTeam
    side_effects: ["Team LOCKED; roster frozen"]
  - method: POST
    path: "/teams/{id}/memberships"
    description: "Roster a student onto a team (OCC-guarded on team.version); enforces roster cap + min_level."
    roles: [StudioAdmin]
    code: 201
    input: [student_id, expected_team_version]
    output: TeamMembership
    side_effects: ["TeamMembership ROSTERED; team.roster_count +=1; increments CompetitionTeam.version by 1"]
  - method: GET
    path: "/teams/{id}/memberships"
    description: "List a team's memberships (reverse-reachability for TeamMembership.team_id)."
    roles: [StudioAdmin, Parent]
    code: 200
    input: []
    output: TeamMembership[]
    side_effects: []
  - method: GET
    path: "/memberships"
    description: "List memberships; filter by student_id (reverse-reachability for TeamMembership.student_id)."
    roles: [StudioAdmin, Parent]
    code: 200
    input: ["student_id?", "team_id?", "limit?", "offset?"]
    output: TeamMembership[]
    side_effects: []
  - method: GET
    path: "/memberships/{id}"
    description: "Fetch a membership."
    roles: [StudioAdmin, Parent]
    code: 200
    input: []
    output: TeamMembership
    side_effects: []
  - method: POST
    path: "/memberships/{id}/release"
    description: "Release a rostered membership (frees a roster slot)."
    roles: [StudioAdmin]
    code: 200
    input: []
    output: TeamMembership
    side_effects: ["ROSTERED->RELEASED; team.roster_count -=1"]

  # ---- Trips ----
  - method: POST
    path: "/teams/{id}/trips"
    description: "Propose a travel trip for a team (PROPOSED)."
    roles: [StudioAdmin]
    code: 201
    input: [destination, depart_date, return_date, per_member_cost_cents, chaperone_ratio, "chaperone_count?"]
    output: TravelTrip
    side_effects: []
  - method: GET
    path: "/teams/{id}/trips"
    description: "List a team's trips (reverse-reachability for TravelTrip.team_id)."
    roles: [StudioAdmin, Parent]
    code: 200
    input: []
    output: TravelTrip[]
    side_effects: []
  - method: GET
    path: "/trips/{id}"
    description: "Fetch a trip."
    roles: [StudioAdmin, Parent]
    code: 200
    input: []
    output: TravelTrip
    side_effects: []
  - method: POST
    path: "/trips/{id}/participants"
    description: "Sign a rostered membership up for a trip (GOING)."
    roles: [StudioAdmin, Parent]
    code: 201
    input: [membership_id]
    output: TripParticipant
    side_effects: ["TripParticipant GOING; trip.participant_count +=1; family delinquency gate applies"]
  - method: GET
    path: "/trips/{id}/participants"
    description: "List a trip's participants (reverse-reachability for TripParticipant.trip_id)."
    roles: [StudioAdmin, Parent]
    code: 200
    input: []
    output: TripParticipant[]
    side_effects: []
  - method: GET
    path: "/participants"
    description: "List participants; filter by family_id or membership_id (reverse-reachability)."
    roles: [StudioAdmin, Parent]
    code: 200
    input: ["family_id?", "membership_id?", "trip_id?", "limit?", "offset?"]
    output: TripParticipant[]
    side_effects: []
  - method: GET
    path: "/participants/{id}"
    description: "Fetch a trip participant."
    roles: [StudioAdmin, Parent]
    code: 200
    input: []
    output: TripParticipant
    side_effects: []
  - method: POST
    path: "/participants/{id}/withdraw"
    description: "Withdraw a trip participant; refunds travel charge if trip CONFIRMED."
    roles: [StudioAdmin, Parent]
    code: 200
    input: []
    output: TripParticipant
    side_effects: ["GOING->WITHDRAWN; trip.participant_count -=1; refund if trip CONFIRMED"]
  - method: POST
    path: "/trips/{id}/confirm"
    description: "Confirm a trip (PROPOSED->CONFIRMED); enforces chaperone ratio; charges each family."
    roles: [StudioAdmin]
    code: 200
    input: []
    output: TravelTrip
    side_effects: ["Trip CONFIRMED; per_member_cost charged to each GOING participant's family (cascade)"]
  - method: POST
    path: "/trips/{id}/cancel"
    description: "Cancel a trip; refunds travel charges if it was CONFIRMED."
    roles: [StudioAdmin]
    code: 200
    input: []
    output: TravelTrip
    side_effects: ["Trip CANCELLED; participants WITHDRAWN; refunds if was CONFIRMED"]

  # ---- Invoices ----
  - method: POST
    path: "/invoices/generate"
    description: "Generate a monthly tuition invoice for a family+term+billing_month; snapshots BILLING_ACTIVE tuition, folds pending fees, applies account credit waterfall."
    roles: [StudioAdmin]
    code: 201
    input: [family_id, term_id, billing_month]
    output: Invoice
    side_effects: ["Invoice OPEN; tuition snapshot; credit waterfall; uniqueness enforced"]
  - method: GET
    path: "/invoices/{id}"
    description: "Fetch an invoice."
    roles: [StudioAdmin, Parent]
    code: 200
    input: []
    output: Invoice
    side_effects: []
  - method: GET
    path: "/invoices"
    description: "List invoices; filter by family_id or term_id (reverse-reachability for Invoice.family_id and Invoice.term_id)."
    roles: [StudioAdmin, Parent]
    code: 200
    input: ["family_id?", "term_id?", "status?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []
  - method: POST
    path: "/invoices/{id}/pay"
    description: "Pay an OPEN or PAST_DUE invoice; requires payment method; clears delinquency if last PAST_DUE."
    roles: [StudioAdmin, Parent]
    code: 200
    input: []
    output: Invoice
    side_effects: ["Invoice PAID; family DELINQUENT->ACTIVE if no other PAST_DUE remains"]
  - method: POST
    path: "/invoices/{id}/void"
    description: "Void an OPEN/PAST_DUE invoice; restores applied credit."
    roles: [StudioAdmin]
    code: 200
    input: []
    output: Invoice
    side_effects: ["Invoice VOID; credit_applied_cents returned to account_credit_cents"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or unrecognized X-User-Role on an endpoint that requires authentication"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Authenticated role not permitted for this endpoint"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "Parent acting on a resource whose owning Family.id != X-User-ID"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A referenced resource id does not resolve to a live resource"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition not defined from the resource's current state"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not match the parent's current version (OCC)"
  - id: ERR_LEVEL_TOO_LOW
    http: 422
    condition: "Student.level ordinal below the section's/team's required level"
  - id: ERR_AGE_OUT_OF_BAND
    http: 422
    condition: "Student.age_as_of_cutoff outside [section.min_age, section.max_age]"
  - id: ERR_ROOM_CONFLICT
    http: 409
    condition: "New session overlaps another section's session in the same room within the turnover buffer"
  - id: ERR_INSTRUCTOR_CONFLICT
    http: 409
    condition: "New session overlaps another of the instructor's sessions (no buffer)"
  - id: ERR_INSTRUCTOR_OVERLOADED
    http: 422
    condition: "Assigning the session would exceed the instructor's max_weekly_sessions"
  - id: ERR_ROSTER_FULL
    http: 422
    condition: "Team roster add would exceed roster_cap"
  - id: ERR_MAKEUP_INELIGIBLE
    http: 422
    condition: "Cited Attendance is not makeup_eligible or outside the makeup window"
  - id: ERR_RECITAL_SOLD_OUT
    http: 409
    condition: "Seat hold would push seats_sold above total_seats, or seat_label already taken"
  - id: ERR_FAMILY_DELINQUENT
    http: 402
    condition: "Family.status == DELINQUENT blocks new enrollment confirmation or trip signup"
  - id: ERR_NO_PAYMENT_METHOD
    http: 402
    condition: "Operation requires payment_method_on_file == true but none is set"
  - id: ERR_NOT_ENROLLED_IN_SECTION
    http: 422
    condition: "Costume order's linked enrollment is not CONFIRMED/WAITLIST_PROMOTED in the costume's section"
  - id: ERR_INSUFFICIENT_CHAPERONES
    http: 422
    condition: "Trip confirm fails ceil(participant_count/chaperone_ratio) <= chaperone_count"
  - id: ERR_DUPLICATE_INVOICE
    http: 409
    condition: "A non-VOID invoice already exists for (family_id, term_id, billing_month)"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, bad enum, or violated numeric bound"
  - id: ERR_CAPACITY_EXCEEDED
    http: 409
    condition: "Confirming an enrollment when section is already at effective capacity (defensive guard on the confirm path)"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: StudioAdmin
    description: "Studio operator: scheduling, pricing, terms, recitals, teams, trips, invoicing."
    identity: "opaque"
    exclusive_operations:
      - "Create/open/close terms, rooms, instructors, sections, sessions, costumes"
      - "Cancel sections; submit costume orders; open/complete recitals; lock teams; roster memberships"
      - "Confirm/cancel trips; generate/void invoices; grant account credit; pause/resume billing"
    shared_operations:
      - "Create families/students; create enrollments; drop enrollments; hold/purchase/release seats; pay invoices; create costume orders; trip signups/withdrawals (acting on any family)"
  - name: Instructor
    description: "Teaching staff: marks and amends attendance for their sessions; reads schedule and rosters."
    identity: "entity_backed:Instructor"
    exclusive_operations:
      - "Mark attendance (POST /enrollments/{id}/attendance); amend attendance"
    shared_operations:
      - "Read sections, sessions, students, teams, attendance"
  - name: Parent
    description: "Family account holder: manages own students, enrollments, costume sizing, tickets, trip signups, invoices."
    identity: "entity_backed:Family"
    exclusive_operations: []
    shared_operations:
      - "Create/read own students; create/drop own enrollments; add payment method; toggle own autopay"
      - "Create/cancel own costume orders; hold/purchase/release own seats; sign up/withdraw own trip participants; pay own invoices; read own families/invoices/attendance"
  - name: Anonymous
    description: "Unauthenticated visitor: may self-register a family only."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /families (self-registration)"
