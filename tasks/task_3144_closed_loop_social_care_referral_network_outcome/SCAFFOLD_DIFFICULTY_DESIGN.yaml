  # ===================================================================
  # Rule 3 — non_linear_state_machine (2 instances, different entities)
  # ===================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: referral_decline_reassign_cycle_with_counters
        grounds:
          - state_machines.Referral.ROUTED_to_DECLINED
          - state_machines.Referral.DECLINED_to_ROUTED
          - state_machines.Referral.ESCALATED_to_ROUTED
        distinguishing_aspect: |
          Referral machine is cyclic with escalation fork: ROUTED -> DECLINED
          -> ROUTED loops and ROUTED -> ESCALATED -> ROUTED loops, each loop
          incrementing different counters (reassignment_count on every cycle,
          reopen_count only on the ESCALATED branch) — after one decline cycle
          and one escalation cycle, reassignment_count == 2 while
          reopen_count == 1.
        test_recipe:
          setup:
            - "Two receivers R1, R2 both with ACTIVE FOOD offerings and ACTIVE agreements + consents with sender S"
            - "Referral RF routed to R1, then declined by R1, reassigned to R2, escalated after aging, then reassigned back to R1"
          setup_api_calls:
            - { call: "POST /care-network/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: NetworkCoordinator }
            - call: "POST /care-network/networks"
              payload: { name: "Net", coordinator_org_name: "Coord", auto_accept_window_hours: 72 }
              as: NetworkCoordinator
            - call: "POST /care-network/taxonomy"
              payload: { code: "FOOD", name: "Food" }
              as: NetworkCoordinator
            - call: "POST /care-network/organizations"
              payload: { name: "Sender S", org_type: "CLINIC", ein: "EIN-S" }
              as: NetworkCoordinator
              captures: { s_id: $.data.id }
            - call: "POST /care-network/organizations"
              payload: { name: "Receiver R1", org_type: "CBO", ein: "EIN-R1" }
              as: NetworkCoordinator
              captures: { r1_id: $.data.id }
            - call: "POST /care-network/organizations"
              payload: { name: "Receiver R2", org_type: "CBO", ein: "EIN-R2" }
              as: NetworkCoordinator
              captures: { r2_id: $.data.id }
            - { call: "POST /care-network/organizations/${s_id}/activate", payload: {}, as: NetworkCoordinator }
            - { call: "POST /care-network/organizations/${r1_id}/activate", payload: {}, as: NetworkCoordinator }
            - { call: "POST /care-network/organizations/${r2_id}/activate", payload: {}, as: NetworkCoordinator }
            - call: "POST /care-network/organizations/${r1_id}/offerings"
              payload: { category_code: "FOOD", description: "Meals R1", capacity_total: 5 }
              as: OrgAdmin
              as_user_id: "${r1_id}"
              captures: { o1_id: $.data.id }
            - call: "POST /care-network/organizations/${r2_id}/offerings"
              payload: { category_code: "FOOD", description: "Meals R2", capacity_total: 5 }
              as: OrgAdmin
              as_user_id: "${r2_id}"
              captures: { o2_id: $.data.id }
            - call: "POST /care-network/agreements"
              payload: { party_a_org_id: "${s_id}", party_b_org_id: "${r1_id}", effective_at: "2026-09-01T00:00:00Z" }
              as: NetworkCoordinator
              captures: { agr1: $.data.id }
            - call: "POST /care-network/agreements"
              payload: { party_a_org_id: "${s_id}", party_b_org_id: "${r2_id}", effective_at: "2026-09-01T00:00:00Z" }
              as: NetworkCoordinator
              captures: { agr2: $.data.id }
            - { call: "POST /care-network/agreements/${agr1}/approve", payload: {}, as: NetworkCoordinator }
            - { call: "POST /care-network/agreements/${agr2}/approve", payload: {}, as: NetworkCoordinator }
            - call: "POST /care-network/clients"
              payload: { full_name: "K", date_of_birth: "1990-01-01", zip_code: "94110", gender: "FEMALE" }
              as: CaseWorker
              as_user_id: "${s_id}"
              captures: { k_id: $.data.id }
            - call: "POST /care-network/clients/${k_id}/consents"
              payload: { sender_org_id: "${s_id}", receiver_org_id: "${r1_id}", scope: "FULL" }
              as: CaseWorker
              as_user_id: "${s_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /care-network/clients/${k_id}/consents"
              payload: { sender_org_id: "${s_id}", receiver_org_id: "${r2_id}", scope: "FULL" }
              as: CaseWorker
              as_user_id: "${s_id}"
              captures: { c2_id: $.data.id }
            - call: "POST /care-network/referrals"
              payload: { client_id: "${k_id}", sender_org_id: "${s_id}", receiver_org_id: "${r1_id}", service_offering_id: "${o1_id}", consent_id: "${c1_id}", category_code: "FOOD" }
              as: CaseWorker
              as_user_id: "${s_id}"
              captures: { rf_id: $.data.id }
            - { call: "POST /care-network/referrals/${rf_id}/route", payload: {}, as: CaseWorker, as_user_id: "${s_id}" }
            - { call: "POST /care-network/referrals/${rf_id}/decline", payload: { reason: "full" }, as: OrgAdmin, as_user_id: "${r1_id}" }
            - call: "GET /care-network/referrals/${rf_id}"
              payload: {}
              as: CaseWorker
              as_user_id: "${s_id}"
              captures: { rf_v1: $.data.version }
            - call: "POST /care-network/referrals/${rf_id}/reassign"
              payload: { new_receiver_org_id: "${r2_id}", new_service_offering_id: "${o2_id}", expected_referral_version: "${rf_v1}" }
              as: CaseWorker
              as_user_id: "${s_id}"
            - { call: "POST /care-network/_clock/set_current_utc", payload: { to_iso8601: "2026-09-05T00:00:00Z" }, as: NetworkCoordinator }
            - { call: "POST /care-network/referrals/${rf_id}/escalate", payload: {}, as: NetworkCoordinator }
          trigger:
            - call: "GET /care-network/referrals/${rf_id}"
              payload: {}
              as: NetworkCoordinator
              captures: { rf_v2: $.data.version }
            - call: "POST /care-network/referrals/${rf_id}/reassign"
              payload: { new_receiver_org_id: "${r1_id}", new_service_offering_id: "${o1_id}", expected_referral_version: "${rf_v2}" }
              as: NetworkCoordinator
          assert:
            - "Referral.${rf_id}.status == ROUTED"
            - "Referral.${rf_id}.receiver_org_id == ${r1_id}"
            - "Referral.${rf_id}.reassignment_count == 2"
            - "Referral.${rf_id}.reopen_count == 1"
            - "ServiceOffering.${o2_id}.capacity_consumed == 0 (released on re-route out of ESCALATED)"
            - "ServiceOffering.${o1_id}.capacity_consumed == 1 (re-reserved)"

      - name: org_suspension_reactivation_cycle_with_cascade
        grounds:
          - state_machines.Organization.ACTIVE_to_SUSPENDED
          - state_machines.Organization.SUSPENDED_to_ACTIVE
        distinguishing_aspect: |
          Organization machine cycles ACTIVE -> SUSPENDED -> ACTIVE (a
          different entity than Referral) and the cycle is NOT symmetric:
          suspension force-pauses all offerings, but reactivation does NOT
          resume them — after one full cycle the org is ACTIVE while its
          offering remains PAUSED, requiring an explicit resume.
        test_recipe:
          setup:
            - "Org R (CBO) ACTIVE with one ACTIVE offering O and no open claims/referrals"
          setup_api_calls:
            - { call: "POST /care-network/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: NetworkCoordinator }
            - call: "POST /care-network/networks"
              payload: { name: "Net", coordinator_org_name: "Coord" }
              as: NetworkCoordinator
            - call: "POST /care-network/taxonomy"
              payload: { code: "FOOD", name: "Food" }
              as: NetworkCoordinator
            - call: "POST /care-network/organizations"
              payload: { name: "Receiver R", org_type: "CBO", ein: "EIN-R" }
              as: NetworkCoordinator
              captures: { r_id: $.data.id }
            - { call: "POST /care-network/organizations/${r_id}/activate", payload: {}, as: NetworkCoordinator }
            - call: "POST /care-network/organizations/${r_id}/offerings"
              payload: { category_code: "FOOD", description: "Meals", capacity_total: 5 }
              as: OrgAdmin
              as_user_id: "${r_id}"
              captures: { o_id: $.data.id }
            - call: "GET /care-network/organizations/${r_id}"
              payload: {}
              as: NetworkCoordinator
              captures: { r_v: $.data.version }
          trigger:
            - call: "POST /care-network/organizations/${r_id}/suspend"
              payload: { suspension_reason: "audit", expected_org_version: "${r_v}" }
              as: NetworkCoordinator
            - { call: "POST /care-network/organizations/${r_id}/activate", payload: {}, as: NetworkCoordinator }
          assert:
            - "Organization.${r_id}.status == ACTIVE (cycle completed)"
            - "ServiceOffering.${o_id}.status == PAUSED (cascade down fired on suspend; no auto-resume on reactivation — asymmetric cycle)"

  # ===================================================================
  # Rule 4 — transitive_cascade (2 instances, different triggers, depth >= 3 / >= 2)
  # ===================================================================
  - rule_id: transitive_cascade
    instances:
      - name: agreement_termination_depth3_consent_referral_claim_escrow
        grounds:
          - state_machines.DataSharingAgreement.ACTIVE_to_TERMINATED
          - state_machines.Consent.ACTIVE_to_REVOKED
          - state_machines.PaymentClaim.SUBMITTED_to_VOIDED
        distinguishing_aspect: |
          Depth-4 cascade from agreement termination: Agreement TERMINATED ->
          Consent REVOKED -> ROUTED Referral CANCELLED -> the referral's
          SUBMITTED PaymentClaim VOIDED with clawback_reserve funded from
          CareNetwork.network_escrow_cents; each hop caused by the previous
          hop, not by the original call.
        test_recipe:
          setup:
            - "Referral RF OUTCOME_RECORDED would NOT cancel; so RF is left ROUTED — but claims need OUTCOME_RECORDED. Instead: RF1 ROUTED (will cancel), and a second completed referral RF2 with a SUBMITTED claim under the SAME consent so hop 3 hits the claim"
            - "Network escrow funded with 100000 cents; claim provisional 5000"
          setup_api_calls:
            - { call: "POST /care-network/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: NetworkCoordinator }
            - call: "POST /care-network/networks"
