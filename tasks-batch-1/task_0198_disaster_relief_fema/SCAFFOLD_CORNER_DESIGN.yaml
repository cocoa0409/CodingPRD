# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Disaster Relief & FEMA Case Management — Expert
# Breadth probe: every testable §1.1–§1.7 claim §1.8 does not already cover.
# Sections + claim_types are drawn from references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_declaration_returns_201_with_fields
        claim_type: Creation
        grounds: [entities.DisasterDeclaration, endpoints]
        distinguishing_aspect: "POST /declarations with all required fields returns 201 and a body carrying title, incident_start/end, ihp_max_grant_cents, status OPEN, and a server-minted id."
        test_recipe:
          setup: ["Empty DB; clock set to 2026-02-01."]
          setup_api_calls:
            - call: "POST /disaster-relief/_clock/set"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /disaster-relief/declarations"
              payload: { title: "DR-E1", incident_start: "2026-01-01T00:00:00Z", incident_end: "2026-02-28T23:59:59Z", ihp_max_grant_cents: 4250000, registration_deadline: "2026-03-31T23:59:59Z" }
              as: ProgramAdmin
              captures: { decl_id: $.data.id, st: $.data.status }
          assert:
            - "HTTP 201"
            - "data.status (st) == OPEN"
            - "data.id (decl_id) is a server-minted UUID with no type prefix"

      - name: get_declaration_returns_stored_entity
        claim_type: Retrieval
        grounds: [entities.DisasterDeclaration, endpoints]
        distinguishing_aspect: "GET /declarations/{id} returns the same fields persisted at create."
        test_recipe:
          setup: ["A declaration exists."]
          setup_api_calls:
            - call: "POST /disaster-relief/_clock/set"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /disaster-relief/declarations"
              payload: { title: "DR-E2", incident_start: "2026-01-01T00:00:00Z", incident_end: "2026-02-28T23:59:59Z", ihp_max_grant_cents: 4250000, registration_deadline: "2026-03-31T23:59:59Z" }
              as: ProgramAdmin
              captures: { decl_id: $.data.id }
          trigger:
            - call: "GET /disaster-relief/declarations/${decl_id}"
              payload: {}
              as: Caseworker
              as_user_id: "op-1"
              captures: { got_max: $.data.ihp_max_grant_cents }
          assert:
            - "HTTP 200"
            - "data.ihp_max_grant_cents (got_max) == 4250000"

      - name: list_declarations_paginated_envelope
        claim_type: Listing
        grounds: [endpoints, response_envelope]
        distinguishing_aspect: "GET /declarations returns response_type array with pagination fields total_count and has_more."
        test_recipe:
          setup: ["At least one declaration exists."]
          setup_api_calls:
            - call: "POST /disaster-relief/_clock/set"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /disaster-relief/declarations"
              payload: { title: "DR-E3", incident_start: "2026-01-01T00:00:00Z", incident_end: "2026-02-28T23:59:59Z", ihp_max_grant_cents: 4250000, registration_deadline: "2026-03-31T23:59:59Z" }
              as: ProgramAdmin
          trigger:
            - call: "GET /disaster-relief/declarations?limit=1&offset=0"
              payload: {}
              as: ProgramAdmin
          assert:
            - "HTTP 200; meta.total_count >= 1; has_more reflects whether more than 1 declaration exists; data is an array of length <= 1"

      - name: get_applicant_nonexistent_returns_404
        claim_type: Not Found
        grounds: [entities.Applicant, "errors[ERR_APPLICANT_NOT_FOUND]"]
        distinguishing_aspect: "GET /applicants/{nonexistent} returns ERR_APPLICANT_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /disaster-relief/applicants/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Caseworker
              as_user_id: "op-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "data.error_id (err) == ERR_APPLICANT_NOT_FOUND"

      - name: create_applicant_missing_required_field_422
        claim_type: Required Fields
        grounds: [entities.Applicant, "errors[ERR_INVALID_REQUEST]", "validations[priority=13]"]
        distinguishing_aspect: "POST /applicants omitting household_size (a required source:input field with no default) returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A declaration exists; clock within registration window."]
          setup_api_calls:
            - call: "POST /disaster-relief/_clock/set"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /disaster-relief/declarations"
              payload: { title: "DR-E5", incident_start: "2026-01-01T00:00:00Z", incident_end: "2026-02-28T23:59:59Z", ihp_max_grant_cents: 4250000, registration_deadline: "2026-03-31T23:59:59Z" }
              as: ProgramAdmin
              captures: { decl_id: $.data.id }
          trigger:
            - call: "POST /disaster-relief/applicants"
              payload: { declaration_id: "${decl_id}", household_name: "NoSize", annual_income_cents: 3000000, damage_date: "2026-01-15T00:00:00Z", reported_repair_cost_cents: 1000000, reported_personal_property_cents: 500000, reported_rental_months: 3 }
              as: Caseworker
              as_user_id: "op-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422"
            - "data.error_id (err) == ERR_INVALID_REQUEST"

      - name: inspector_travel_buffer_default_applied
        claim_type: Defaults
        grounds: [entities.Inspector.fields.travel_buffer_minutes, endpoints]
        distinguishing_aspect: "Creating an inspector without travel_buffer_minutes applies the default 30."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /disaster-relief/inspectors"
              payload: { full_name: "Default Insp", badge_number: "INS-DEF" }
              as: ProgramAdmin
              captures: { buf: $.data.travel_buffer_minutes }
          assert:
            - "HTTP 201"
            - "data.travel_buffer_minutes (buf) == 30"

      - name: applicant_total_dob_computed_ignores_client_input
        claim_type: Computed Fields
        grounds: [entities.Applicant.fields.total_dob_cents, endpoints]
        distinguishing_aspect: "total_dob_cents is computed (source: computed) and initializes to 0 at registration regardless of any client-supplied value."
        test_recipe:
          setup: ["A declaration exists within registration window."]
          setup_api_calls:
            - call: "POST /disaster-relief/_clock/set"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /disaster-relief/declarations"
              payload: { title: "DR-E7", incident_start: "2026-01-01T00:00:00Z", incident_end: "2026-02-28T23:59:59Z", ihp_max_grant_cents: 4250000, registration_deadline: "2026-03-31T23:59:59Z" }
              as: ProgramAdmin
              captures: { decl_id: $.data.id }
          trigger:
            - call: "POST /disaster-relief/applicants"
              payload: { declaration_id: "${decl_id}", household_name: "Comp Household", household_size: 2, annual_income_cents: 3000000, damage_date: "2026-01-15T00:00:00Z", reported_repair_cost_cents: 1000000, reported_personal_property_cents: 500000, reported_rental_months: 3 }
              as: Caseworker
              as_user_id: "op-1"
              captures: { tdob: $.data.total_dob_cents }
          assert:
            - "HTTP 201"
            - "data.total_dob_cents (tdob) == 0"

      - name: system_fields_generated_on_create
        claim_type: System Fields
        grounds: [entities.DisasterDeclaration, response_envelope]
        distinguishing_aspect: "id/created_at/updated_at/version are system-generated; version starts at 1; created_at is ISO 8601 UTC with three fractional digits."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /disaster-relief/declarations"
              payload: { title: "DR-E8", incident_start: "2026-01-01T00:00:00Z", incident_end: "2026-02-28T23:59:59Z", ihp_max_grant_cents: 4250000, registration_deadline: "2026-03-31T23:59:59Z" }
              as: ProgramAdmin
              captures: { ver: $.data.version }
          assert:
            - "HTTP 201"
            - "data.version (ver) == 1; data.id present; data.created_at is ISO 8601 UTC"

      - name: applicant_invalid_enum_source_type_on_dob_422
        claim_type: Type Constraints
        grounds: [entities.DobRecord.fields.source_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /dob-records with source_type not in {INSURANCE, SBA_LOAN, CHARITY, OTHER_FEDERAL} returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["An applicant exists."]
          setup_api_calls:
            - call: "POST /disaster-relief/_clock/set"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /disaster-relief/declarations"
              payload: { title: "DR-E9", incident_start: "2026-01-01T00:00:00Z", incident_end: "2026-02-28T23:59:59Z", ihp_max_grant_cents: 4250000, registration_deadline: "2026-03-31T23:59:59Z" }
              as: ProgramAdmin
              captures: { decl_id: $.data.id }
            - call: "POST /disaster-relief/applicants"
              payload: { declaration_id: "${decl_id}", household_name: "Enum Household", household_size: 2, annual_income_cents: 3000000, damage_date: "2026-01-15T00:00:00Z", reported_repair_cost_cents: 1000000, reported_personal_property_cents: 500000, reported_rental_months: 3 }
              as: Caseworker
              as_user_id: "op-1"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /disaster-relief/dob-records"
              payload: { applicant_id: "${app_id}", source_type: "LOTTERY", amount_cents: 100000, received_at: "2026-02-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422"
            - "data.error_id (err) == ERR_INVALID_REQUEST"

      - name: award_line_item_immutable_no_update_endpoint
        claim_type: Immutability
        grounds: [entities.AwardLineItem, endpoints]
        distinguishing_aspect: "AwardLineItem is mutated only by cascade (approve/appeal/recoupment); §1.5 exposes no client PUT/PATCH/DELETE — only GET reads. Discovered solely via the reverse-reachability list."
        test_recipe:
          setup: ["No setup."]
          setup_api_calls: []
          trigger:
            - call: "GET /disaster-relief/award-line-items?ihp_case_id=00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Caseworker
              as_user_id: "op-1"
          assert:
            - "HTTP 200; data is an empty array (no case); confirms award-line-items are read-only and discoverable only by the filtered-list GET"

      - name: applicant_requires_existing_declaration_parent
        claim_type: Parent Relationships
        grounds: [entities.Applicant.fields.declaration_id, "errors[ERR_DECLARATION_NOT_FOUND]"]
        distinguishing_aspect: "POST /applicants with a non-existent declaration_id returns ERR_DECLARATION_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /disaster-relief/_clock/set"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /disaster-relief/applicants"
              payload: { declaration_id: "00000000-0000-0000-0000-000000000000", household_name: "Orphan", household_size: 2, annual_income_cents: 3000000, damage_date: "2026-01-15T00:00:00Z", reported_repair_cost_cents: 1000000, reported_personal_property_cents: 500000, reported_rental_months: 3 }
              as: Caseworker
              as_user_id: "op-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "data.error_id (err) == ERR_DECLARATION_NOT_FOUND"

      - name: flat_fk_reverse_list_applicants_by_declaration
        claim_type: Creation
        grounds: [endpoints, entities.Applicant.fields.declaration_id]
        distinguishing_aspect: "Flat topology: GET /applicants?declaration_id resolves the FK reverse path and returns only that declaration's applicants."
        test_recipe:
          setup: ["A declaration with one applicant."]
          setup_api_calls:
            - call: "POST /disaster-relief/_clock/set"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /disaster-relief/declarations"
              payload: { title: "DR-FK", incident_start: "2026-01-01T00:00:00Z", incident_end: "2026-02-28T23:59:59Z", ihp_max_grant_cents: 4250000, registration_deadline: "2026-03-31T23:59:59Z" }
              as: ProgramAdmin
              captures: { decl_id: $.data.id }
            - call: "POST /disaster-relief/applicants"
              payload: { declaration_id: "${decl_id}", household_name: "Fk Household", household_size: 2, annual_income_cents: 3000000, damage_date: "2026-01-15T00:00:00Z", reported_repair_cost_cents: 1000000, reported_personal_property_cents: 500000, reported_rental_months: 3 }
              as: Caseworker
              as_user_id: "op-1"
              captures: { app_id: $.data.id }
          trigger:
            - call: "GET /disaster-relief/applicants?declaration_id=${decl_id}"
              payload: {}
              as: ProgramAdmin
              captures: { first_id: "$.data[0].id" }
          assert:
            - "HTTP 200; data is a non-empty array; every element has declaration_id == ${decl_id}"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: applicant_initial_state_registered
        claim_type: Initial State
        grounds: [state_machines.Applicant, entities.Applicant.fields.status]
        distinguishing_aspect: "A freshly registered applicant starts in REGISTERED."
        test_recipe:
          setup: ["A declaration exists within registration window."]
          setup_api_calls:
            - call: "POST /disaster-relief/_clock/set"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /disaster-relief/declarations"
              payload: { title: "DR-SM1", incident_start: "2026-01-01T00:00:00Z", incident_end: "2026-02-28T23:59:59Z", ihp_max_grant_cents: 4250000, registration_deadline: "2026-03-31T23:59:59Z" }
              as: ProgramAdmin
              captures: { decl_id: $.data.id }
          trigger:
            - call: "POST /disaster-relief/applicants"
              payload: { declaration_id: "${decl_id}", household_name: "Sm1 Household", household_size: 2, annual_income_cents: 3000000, damage_date: "2026-01-15T00:00:00Z", reported_repair_cost_cents: 1000000, reported_personal_property_cents: 500000, reported_rental_months: 3 }
              as: Caseworker
              as_user_id: "op-1"
              captures: { st: $.data.status }
          assert:
            - "HTTP 201"
            - "data.status (st) == REGISTERED"

      - name: verify_assessment_not_inspected_invalid_transition
        claim_type: Invalid Transitions
        grounds: [state_machines.DamageAssessment.SCHEDULED_to_INSPECTED, "errors[ERR_ASSESSMENT_NOT_INSPECTED]"]
        distinguishing_aspect: "Verifying a still-SCHEDULED (not INSPECTED) assessment is an invalid transition -> ERR_ASSESSMENT_NOT_INSPECTED (409); no side effects fire."
        test_recipe:
          setup: ["A SCHEDULED assessment (never inspected)."]
          setup_api_calls:
            - call: "POST /disaster-relief/_clock/set"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /disaster-relief/declarations"
              payload: { title: "DR-SM2", incident_start: "2026-01-01T00:00:00Z", incident_end: "2026-02-28T23:59:59Z", ihp_max_grant_cents: 4250000, registration_deadline: "2026-03-31T23:59:59Z" }
              as: ProgramAdmin
              captures: { decl_id: $.data.id }
            - call: "POST /disaster-relief/inspectors"
              payload: { full_name: "Sm2 Insp", badge_number: "INS-SM2" }
              as: ProgramAdmin
              captures: { insp_id: $.data.id }
            - call: "POST /disaster-relief/caseworkers"
              payload: { full_name: "Sm2 Cw", employee_id: "CW-SM2" }
              as: ProgramAdmin
              captures: { cw1_id: $.data.id }
            - call: "POST /disaster-relief/applicants"
              payload: { declaration_id: "${decl_id}", household_name: "Sm2 Household", household_size: 2, annual_income_cents: 3000000, damage_date: "2026-01-15T00:00:00Z", reported_repair_cost_cents: 1000000, reported_personal_property_cents: 500000, reported_rental_months: 3 }
              as: Caseworker
              as_user_id: "${cw1_id}"
              captures: { app_id: $.data.id }
            - call: "POST /disaster-relief/assessments"
              payload: { applicant_id: "${app_id}", inspector_id: "${insp_id}", scheduled_start: "2026-02-11T09:00:00Z", scheduled_end: "2026-02-11T10:00:00Z" }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { asm_id: $.data.id }
          trigger:
            - call: "POST /disaster-relief/assessments/${asm_id}/verify"
              payload: {}
              as: Caseworker
              as_user_id: "${cw1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "data.error_id (err) == ERR_ASSESSMENT_NOT_INSPECTED"

      - name: deny_case_already_approved_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.IhpCase.ELIGIBILITY_PENDING_to_DENIED, "errors[ERR_CASE_NOT_PENDING]"]
        distinguishing_aspect: "Denying a case that is already AWARD_APPROVED (no longer ELIGIBILITY_PENDING) -> ERR_CASE_NOT_PENDING (409)."
        test_recipe:
          setup: ["An AWARD_APPROVED case."]
          setup_api_calls:
            - call: "POST /disaster-relief/_clock/set"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /disaster-relief/declarations"
              payload: { title: "DR-SM3", incident_start: "2026-01-01T00:00:00Z", incident_end: "2026-02-28T23:59:59Z", ihp_max_grant_cents: 4250000, registration_deadline: "2026-03-31T23:59:59Z" }
              as: ProgramAdmin
              captures: { decl_id: $.data.id }
            - call: "POST /disaster-relief/inspectors"
              payload: { full_name: "Sm3 Insp", badge_number: "INS-SM3" }
              as: ProgramAdmin
              captures: { insp_id: $.data.id }
            - call: "POST /disaster-relief/caseworkers"
              payload: { full_name: "Sm3 Cw", employee_id: "CW-SM3" }
              as: ProgramAdmin
              captures: { cw1_id: $.data.id }
            - call: "POST /disaster-relief/applicants"
              payload: { declaration_id: "${decl_id}", household_name: "Sm3 Household", household_size: 2, annual_income_cents: 3000000, damage_date: "2026-01-15T00:00:00Z", reported_repair_cost_cents: 1000000, reported_personal_property_cents: 500000, reported_rental_months: 3 }
              as: Caseworker
              as_user_id: "${cw1_id}"
              captures: { app_id: $.data.id }
            - call: "POST /disaster-relief/assessments"
              payload: { applicant_id: "${app_id}", inspector_id: "${insp_id}", scheduled_start: "2026-02-11T09:00:00Z", scheduled_end: "2026-02-11T10:00:00Z" }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { asm_id: $.data.id }
            - call: "POST /disaster-relief/assessments/${asm_id}/inspect"
              payload: { habitability: "UNINHABITABLE", verified_repair_cost_cents: 1000000, verified_personal_property_cents: 500000, verified_rental_months: 3 }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /disaster-relief/assessments/${asm_id}/verify"
              payload: {}
              as: Caseworker
              as_user_id: "${cw1_id}"
            - call: "POST /disaster-relief/ihp-cases"
              payload: { applicant_id: "${app_id}", assessment_id: "${asm_id}", monthly_fmr_cents: 100000 }
              as: Caseworker
              as_user_id: "${cw1_id}"
              captures: { case_id: $.data.id }
            - call: "POST /disaster-relief/ihp-cases/${case_id}/approve"
              payload: {}
              as: Caseworker
              as_user_id: "${cw1_id}"
          trigger:
            - call: "POST /disaster-relief/ihp-cases/${case_id}/deny"
              payload: {}
              as: Caseworker
              as_user_id: "${cw1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "data.error_id (err) == ERR_CASE_NOT_PENDING"

      - name: reverse_already_reversed_dob_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: [state_machines.DobRecord, "errors[ERR_DOB_NOT_RECORDED]"]
        distinguishing_aspect: "A DobRecord in terminal REVERSED cannot be reversed again -> ERR_DOB_NOT_RECORDED (409)."
        test_recipe:
          setup: ["A RECORDED DOB that is then reversed once."]
          setup_api_calls:
            - call: "POST /disaster-relief/_clock/set"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /disaster-relief/declarations"
              payload: { title: "DR-SM4", incident_start: "2026-01-01T00:00:00Z", incident_end: "2026-02-28T23:59:59Z", ihp_max_grant_cents: 4250000, registration_deadline: "2026-03-31T23:59:59Z" }
              as: ProgramAdmin
              captures: { decl_id: $.data.id }
            - call: "POST /disaster-relief/applicants"
              payload: { declaration_id: "${decl_id}", household_name: "Sm4 Household", household_size: 2, annual_income_cents: 3000000, damage_date: "2026-01-15T00:00:00Z", reported_repair_cost_cents: 1000000, reported_personal_property_cents: 500000, reported_rental_months: 3 }
              as: Caseworker
              as_user_id: "op-1"
              captures: { app_id: $.data.id }
            - call: "POST /disaster-relief/dob-records"
              payload: { applicant_id: "${app_id}", source_type: "CHARITY", amount_cents: 200000, received_at: "2026-02-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { dob_id: $.data.id }
            - call: "POST /disaster-relief/dob-records/${dob_id}/reverse"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /disaster-relief/dob-records/${dob_id}/reverse"
              payload: {}
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "data.error_id (err) == ERR_DOB_NOT_RECORDED"

      - name: withdraw_applicant_cancels_scheduled_assessment_cascade
        claim_type: Side Effect Execution
        grounds: [state_machines.Applicant.INSPECTION_SCHEDULED_to_WITHDRAWN, state_machines.DamageAssessment.SCHEDULED_to_CANCELLED]
        distinguishing_aspect: "Withdrawing an applicant with a SCHEDULED assessment cascades the assessment to CANCELLED (cascade-down side effect)."
        test_recipe:
          setup: ["An applicant INSPECTION_SCHEDULED with one SCHEDULED assessment."]
          setup_api_calls:
            - call: "POST /disaster-relief/_clock/set"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /disaster-relief/declarations"
