scaffold_corner_design:

  - section: entities
    instances:
      - name: create_literary_property_returns_derived_defaults
        claim_type: creation
        grounds: ["entities.LiteraryProperty.fields.rights_chain_status", "entities.LiteraryProperty.fields.tracking_tier", "entities.LiteraryProperty.fields.encumbrance_count"]
        distinguishing_aspect: "A freshly created LiteraryProperty comes back 201 with rights_chain_status UNVERIFIED, verified_document_count 0, tracking_tier NONE, encumbrance_count 0 and version 1."
        test_recipe:
          setup: ["Empty database; logical clock left at its 2026-08-01T00:00:00Z default."]
          setup_api_calls:
            - call: "GET /_clock"
              payload: {}
              as: SlateAdmin
          trigger:
            - call: "POST /literary-properties"
              payload: { title: "First Light", material_type: "ORIGINAL_PITCH", source_author_name: "A. Okafor", genre: "DOCUMENTARY", logline: "A pitch with nothing behind it yet." }
              as: StoryEditor
              captures: { p_id: "$.data.id" }
          assert:
            - "HTTP status == 201"
            - "LiteraryProperty.${p_id}.rights_chain_status == UNVERIFIED"
            - "LiteraryProperty.${p_id}.verified_document_count == 0"
            - "LiteraryProperty.${p_id}.tracking_tier == NONE"
            - "LiteraryProperty.${p_id}.encumbrance_count == 0"
            - "LiteraryProperty.${p_id}.version == 1"
            - "response meta contains api_request_id and api_request_timestamp; response_type == object"

      - name: get_literary_property_unknown_id_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_PROPERTY_NOT_FOUND]", "validations[priority=30]"]
        distinguishing_aspect: "GET /literary-properties/{id} with a well-formed but unused UUID returns 404 ERR_PROPERTY_NOT_FOUND, not an empty object."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "GET /_clock"
              payload: {}
              as: SlateAdmin
          trigger:
            - call: "GET /literary-properties/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: StoryEditor
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 404"
            - "response data.error_id == ERR_PROPERTY_NOT_FOUND"
            - "response_type == error"

      - name: list_submissions_returns_pagination_envelope
        claim_type: listing
        grounds: ["endpoints.GET_/submissions", "entities.Submission.fields.status"]
        distinguishing_aspect: "GET /submissions with limit 2 and offset 1 over three submissions on one property returns exactly 2 rows with total_count 3 and has_more true."
        test_recipe:
          setup: ["One DRAMA property carries three AGENCY submissions, all in status RECEIVED."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SlateAdmin
            - call: "POST /literary-properties"
              payload: { title: "Three Submissions", material_type: "SPEC_SCRIPT", source_author_name: "P. Ruiz", genre: "DRAMA", logline: "Everyone sends it in." }
              as: StoryEditor
              captures: { p_id: "$.data.id" }
            - call: "POST /submissions"
              payload: { property_id: "${p_id}", submitting_agency: "CAA", submitter_contact_email: "a@caa.example", submitted_via: "AGENCY" }
              as: Submitter
            - call: "POST /submissions"
              payload: { property_id: "${p_id}", submitting_agency: "WME", submitter_contact_email: "b@wme.example", submitted_via: "AGENCY" }
              as: Submitter
            - call: "POST /submissions"
              payload: { property_id: "${p_id}", submitting_agency: "UTA", submitter_contact_email: "c@uta.example", submitted_via: "AGENCY" }
              as: Submitter
          trigger:
            - call: "GET /submissions"
              payload: { property_id: "${p_id}", limit: 2, offset: 1 }
              as: StoryEditor
          assert:
            - "HTTP status == 200"
            - "response_type == array"
            - "the returned data array length == 2"
            - "meta/pagination total_count == 3"
            - "has_more == false"
            - "limit == 2 and offset == 1 are echoed"

      - name: create_submission_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: ["validations[priority=40]", "errors[ERR_INVALID_REQUEST]", "endpoints.POST_/submissions"]
        distinguishing_aspect: "Omitting submitted_via - an input field with no default - returns 400 ERR_INVALID_REQUEST and persists no Submission row."
        test_recipe:
          setup: ["One DRAMA property exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SlateAdmin
            - call: "POST /literary-properties"
              payload: { title: "Missing Field", material_type: "SPEC_SCRIPT", source_author_name: "D. Rossi", genre: "DRAMA", logline: "Half a form." }
              as: StoryEditor
              captures: { p_id: "$.data.id" }
          trigger:
            - call: "POST /submissions"
              payload: { property_id: "${p_id}", submitting_agency: "CAA", submitter_contact_email: "a@caa.example" }
              as: Submitter
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 400"
            - "response data.error_id == ERR_INVALID_REQUEST"
            - "GET /submissions filtered by property_id == ${p_id} returns total_count 0"

      - name: submission_priority_flag_defaults_to_standard_seventy_two_hours
        claim_type: defaults
        grounds: ["entities.Submission.fields.priority_flag", "calculations.coverage_turnaround_due"]
        distinguishing_aspect: "Omitting priority_flag applies the STANDARD default, so coverage_due_at is received_at + 72h == 2026-09-04T00:00:00.000Z."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z; one FAMILY property exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SlateAdmin
            - call: "POST /literary-properties"
              payload: { title: "Default Priority", material_type: "BOOK", source_author_name: "E. Haddad", genre: "FAMILY", logline: "No rush." }
              as: StoryEditor
              captures: { p_id: "$.data.id" }
          trigger:
            - call: "POST /submissions"
              payload: { property_id: "${p_id}", submitting_agency: "GERSH", submitter_contact_email: "lit@gersh.example", submitted_via: "AGENCY" }
              as: Submitter
              captures: { s_id: "$.data.id" }
          assert:
            - "Submission.${s_id}.priority_flag == STANDARD"
            - "Submission.${s_id}.received_at == 2026-09-01T00:00:00.000Z"
            - "Submission.${s_id}.coverage_due_at == 2026-09-04T00:00:00.000Z"
            - "Submission.${s_id}.status == RECEIVED"
            - "Submission.${s_id}.decision == PENDING"

      - name: create_reader_computed_counters_input_ignored
        claim_type: computed_fields
        grounds: ["entities.Reader.fields.active_assignment_count", "entities.Reader.fields.completed_report_count", "entities.Reader.fields.calibration_bias"]
        distinguishing_aspect: "Client-supplied active_assignment_count / completed_report_count / calibration_bias on POST /readers are ignored; the row comes back with 0, 0 and 0.00."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SlateAdmin
          trigger:
            - call: "POST /readers"
              payload: { display_name: "R Sneaky", specialty_genre: "DRAMA", weekly_capacity: 3, employment_type: "STAFF", active_assignment_count: 99, completed_report_count: 42, calibration_bias: -4.00 }
              as: SlateAdmin
              captures: { r_id: "$.data.id" }
          assert:
            - "HTTP status == 201"
            - "Reader.${r_id}.active_assignment_count == 0"
            - "Reader.${r_id}.completed_report_count == 0"
            - "Reader.${r_id}.calibration_bias == 0.00"
            - "Reader.${r_id}.weekly_capacity == 3"

      - name: create_submission_system_fields_input_ignored
        claim_type: system_fields
        grounds: ["entities.Submission.fields.received_at", "entities.Submission.fields.status", "entities.Submission.fields.release_form_required"]
        distinguishing_aspect: "Client-supplied id / received_at / status / release_form_required on POST /submissions are ignored: id is a fresh server-minted UUID with no type prefix, received_at is the logical clock, status is RECEIVED and release_form_required is derived."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z; one COMEDY property exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SlateAdmin
            - call: "POST /literary-properties"
              payload: { title: "System Fields", material_type: "SPEC_SCRIPT", source_author_name: "F. Novak", genre: "COMEDY", logline: "The client tries to set the server's fields." }
              as: StoryEditor
              captures: { p_id: "$.data.id" }
          trigger:
            - call: "POST /submissions"
              payload: { property_id: "${p_id}", submitting_agency: "Indie Lit Co", submitter_contact_email: "x@indie.example", submitted_via: "MANAGER", id: "11111111-1111-4111-8111-111111111111", received_at: "1999-01-01T00:00:00Z", status: "TRACKED", release_form_required: false }
              as: Submitter
              captures: { s_id: "$.data.id" }
          assert:
            - "Submission.${s_id}.id != 11111111-1111-4111-8111-111111111111"
            - "Submission.${s_id}.id is a bare UUID with no type prefix"
            - "Submission.${s_id}.received_at == 2026-09-01T00:00:00.000Z"
            - "Submission.${s_id}.status == RECEIVED"
            - "Submission.${s_id}.release_form_required == true"
            - "Submission.${s_id}.version == 1"

      - name: create_reader_weekly_capacity_zero_returns_value_out_of_range
        claim_type: type_constraints
        grounds: ["validations[priority=50]", "errors[ERR_VALUE_OUT_OF_RANGE]", "entities.Reader.fields.weekly_capacity"]
        distinguishing_aspect: "weekly_capacity 0 is below the declared 1..20 range and returns 422 ERR_VALUE_OUT_OF_RANGE with no Reader persisted."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SlateAdmin
          trigger:
            - call: "POST /readers"
              payload: { display_name: "R Zero", specialty_genre: "DRAMA", weekly_capacity: 0, employment_type: "STAFF" }
              as: SlateAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 422"
            - "response data.error_id == ERR_VALUE_OUT_OF_RANGE"
            - "GET /readers returns total_count 0"

      - name: patch_coverage_report_invalid_enum_recommendation_rejected
        claim_type: type_constraints
        grounds: ["validations[priority=45]", "errors[ERR_INVALID_ENUM_VALUE]", "entities.CoverageReport.fields.recommendation"]
        distinguishing_aspect: "recommendation \"MAYBE\" is outside the declared enum and returns 422 ERR_INVALID_ENUM_VALUE, distinct from the 422 ERR_VALUE_OUT_OF_RANGE raised by an out-of-band numeric score."
        test_recipe:
          setup: ["Reader R1 (DRAMA, STAFF, capacity 2) holds an ASSIGNED assignment on an INTAKE_CLEARED submission whose DRAFT report is empty."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SlateAdmin
            - call: "POST /literary-properties"
              payload: { title: "Enum Guard", material_type: "SPEC_SCRIPT", source_author_name: "G. Sandoval", genre: "DRAMA", logline: "A form with a closed list." }
              as: StoryEditor
              captures: { p_id: "$.data.id" }
            - call: "POST /readers"
              payload: { display_name: "R1 Solberg", specialty_genre: "DRAMA", weekly_capacity: 2, employment_type: "STAFF" }
              as: SlateAdmin
              captures: { r1_id: "$.data.id" }
            - call: "POST /submissions"
              payload: { property_id: "${p_id}", submitting_agency: "CAA", submitter_contact_email: "desk@caa.example", submitted_via: "AGENCY" }
              as: Submitter
              captures: { s_id: "$.data.id" }
            - call: "POST /submissions/${s_id}/clear-intake"
              payload: {}
              as: StoryEditor
              as_user_id: "editor-assign-1"
            - call: "POST /submissions/${s_id}/assign-reader"
              payload: { reader_id: "${r1_id}", window_start: "2026-09-01T00:00:00Z", window_due: "2026-09-04T00:00:00Z" }
              as: StoryEditor
              as_user_id: "editor-assign-1"
              captures: { ca_id: "$.data.id" }
            - call: "GET /coverage-reports"
              payload: { assignment_id: "${ca_id}" }
              as: StoryEditor
              as_user_id: "editor-assign-1"
              captures: { rep_id: "$.data[0].id" }
          trigger:
            - call: "PATCH /coverage-reports/${rep_id}"
              payload: { recommendation: "MAYBE" }
              as: Reader
              as_user_id: "${r1_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 422"
            - "response data.error_id == ERR_INVALID_ENUM_VALUE"
            - "CoverageReport.${rep_id}.recommendation == null"
            - "CoverageReport.${rep_id}.status == DRAFT"

      - name: rights_chain_document_is_immutable_no_version_no_update_endpoint
        claim_type: immutability
        grounds: ["entities.RightsChainDocument", "endpoints.GET_/rights-chain-documents/{id}"]
        distinguishing_aspect: "RightsChainDocument declares common_fields false, so its read carries id and created_at but no version and no updated_at, and §1.5 exposes no PATCH or DELETE for it."
        test_recipe:
          setup: ["One property carries a single verified CHAIN_OF_TITLE document."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SlateAdmin
            - call: "POST /literary-properties"
              payload: { title: "Append Only", material_type: "BOOK", source_author_name: "H. Kaur", genre: "DOCUMENTARY", logline: "The record does not change." }
              as: StoryEditor
              captures: { p_id: "$.data.id" }
            - call: "POST /literary-properties/${p_id}/rights-documents"
              payload: { doc_type: "CHAIN_OF_TITLE", executed_on: "2026-01-15", verified: true }
              as: BusinessAffairs
              captures: { d_id: "$.data.id" }
          trigger:
            - call: "GET /rights-chain-documents/${d_id}"
              payload: {}
              as: BusinessAffairs
          assert:
            - "HTTP status == 200"
            - "the returned document exposes id and created_at"
            - "the returned document exposes no version field and no updated_at field"
            - "RightsChainDocument.${d_id}.superseded == false"
            - "LiteraryProperty.${p_id}.rights_chain_status == PARTIAL"
            - "LiteraryProperty.${p_id}.verified_document_count == 1"

      - name: create_submission_with_unknown_property_id_returns_not_found
        claim_type: parent_relationships
        grounds: ["validations[priority=35]", "errors[ERR_PROPERTY_NOT_FOUND]"]
        distinguishing_aspect: "A body foreign key that resolves to nothing fails at priority 35 with 404 ERR_PROPERTY_NOT_FOUND before any schema-shape or business rule runs."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SlateAdmin
          trigger:
            - call: "POST /submissions"
              payload: { property_id: "00000000-0000-4000-8000-0000000000ff", submitting_agency: "CAA", submitter_contact_email: "desk@caa.example", submitted_via: "AGENCY" }
              as: Submitter
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 404"
            - "response data.error_id == ERR_PROPERTY_NOT_FOUND"

      - name: rights_document_self_referential_supersede_marks_predecessor
        claim_type: creation
        grounds: ["entities.RightsChainDocument.fields.supersedes_document_id", "entities.RightsChainDocument.fields.superseded", "calculations.rights_chain_status_derivation"]
        distinguishing_aspect: "The self-referential FK works end to end: filing a replacement CHAIN_OF_TITLE that supersedes the original sets the predecessor's superseded flag to true and leaves verified_document_count at 1, not 2."
        test_recipe:
          setup: ["One property carries a single verified CHAIN_OF_TITLE document; rights_chain_status is PARTIAL and verified_document_count is 1."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SlateAdmin
            - call: "POST /literary-properties"
              payload: { title: "Replacement Papers", material_type: "PLAY", source_author_name: "I. Moreau", genre: "DRAMA", logline: "The lawyers redo the paperwork." }
              as: StoryEditor
              captures: { p_id: "$.data.id" }
            - call: "POST /literary-properties/${p_id}/rights-documents"
              payload: { doc_type: "CHAIN_OF_TITLE", executed_on: "2026-01-15", verified: true, notes: "Original." }
              as: BusinessAffairs
              captures: { d1_id: "$.data.id" }
          trigger:
            - call: "POST /literary-properties/${p_id}/rights-documents"
              payload: { doc_type: "CHAIN_OF_TITLE", executed_on: "2026-04-01", verified: true, supersedes_document_id: "${d1_id}", notes: "Corrected chain." }
              as: BusinessAffairs
              captures: { d2_id: "$.data.id" }
          assert:
            - "RightsChainDocument.${d1_id}.superseded == true"
            - "RightsChainDocument.${d2_id}.superseded == false"
            - "RightsChainDocument.${d2_id}.supersedes_document_id == ${d1_id}"
            - "LiteraryProperty.${p_id}.verified_document_count == 1"
            - "LiteraryProperty.${p_id}.rights_chain_status == PARTIAL"
            - "GET /rights-chain-documents filtered by supersedes_document_id == ${d1_id} returns exactly one row whose id == ${d2_id}"

  - section: state_machines
    instances:
      - name: assign_reader_from_received_state_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.Submission.INTAKE_CLEARED_to_READER_ASSIGNED", "validations[priority=70]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "assign-reader is declared only from INTAKE_CLEARED; firing it on a RECEIVED submission returns 409 ERR_INVALID_STATE and creates no assignment, even though a perfectly eligible reader exists."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z; a DRAMA property carries an AGENCY submission still in RECEIVED, and Reader R1 (DRAMA, STAFF, capacity 3) is idle."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SlateAdmin
            - call: "POST /literary-properties"
              payload: { title: "Too Early", material_type: "SPEC_SCRIPT", source_author_name: "J. Falk", genre: "DRAMA", logline: "Coverage before intake." }
              as: StoryEditor
              captures: { p_id: "$.data.id" }
            - call: "POST /readers"
              payload: { display_name: "R1 Solberg", specialty_genre: "DRAMA", weekly_capacity: 3, employment_type: "STAFF" }
              as: SlateAdmin
              captures: { r1_id: "$.data.id" }
            - call: "POST /submissions"
              payload: { property_id: "${p_id}", submitting_agency: "CAA", submitter_contact_email: "desk@caa.example", submitted_via: "AGENCY" }
              as: Submitter
              captures: { s_id: "$.data.id" }
          trigger:
            - call: "POST /submissions/${s_id}/assign-reader"
              payload: { reader_id: "${r1_id}", window_start: "2026-09-01T00:00:00Z", window_due: "2026-09-04T00:00:00Z" }
              as: StoryEditor
              as_user_id: "editor-assign-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 409"
            - "response data.error_id == ERR_INVALID_STATE"
            - "Submission.${s_id}.status == RECEIVED"
            - "Reader.${r1_id}.active_assignment_count == 0"

      - name: clear_intake_on_release_pending_submission_returns_invalid_state
        claim_type: precondition_enforcement
        grounds: ["state_machines.Submission.RECEIVED_to_INTAKE_CLEARED", "validations[priority=70]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "clear-intake is declared only from RECEIVED with release_form_required false; on a RELEASE_PENDING unsolicited submission it returns 409 ERR_INVALID_STATE and the release form stays REQUIRED."
        test_recipe:
          setup: ["An UNSOLICITED submission has an open ReleaseForm in status REQUIRED, so the submission is RELEASE_PENDING."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SlateAdmin
            - call: "POST /literary-properties"
              payload: { title: "Over The Transom", material_type: "SPEC_SCRIPT", source_author_name: "K. Duarte", genre: "THRILLER", logline: "It arrived unasked." }
              as: StoryEditor
              captures: { p_id: "$.data.id" }
            - call: "POST /submissions"
              payload: { property_id: "${p_id}", submitting_agency: "Self-submitted", submitter_contact_email: "kd@mail.example", submitted_via: "UNSOLICITED" }
              as: Submitter
              captures: { s_id: "$.data.id" }
            - call: "POST /submissions/${s_id}/release-forms"
              payload: { expires_at: "2026-10-01T00:00:00Z" }
              as: StoryEditor
              as_user_id: "editor-assign-1"
              captures: { rf_id: "$.data.id" }
          trigger:
            - call: "POST /submissions/${s_id}/clear-intake"
              payload: {}
              as: StoryEditor
              as_user_id: "editor-assign-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 409"
            - "response data.error_id == ERR_INVALID_STATE"
            - "Submission.${s_id}.status == RELEASE_PENDING"
            - "Submission.${s_id}.release_form_required == true"
            - "ReleaseForm.${rf_id}.status == REQUIRED"

      - name: release_form_initial_state_is_required_and_send_moves_to_sent
        claim_type: initial_state
        grounds: ["state_machines.ReleaseForm.REQUIRED_to_SENT", "entities.ReleaseForm.fields.status"]
        distinguishing_aspect: "A newly opened ReleaseForm is created in REQUIRED with signed_at null, and POST /release-forms/{id}/send is the only declared way out to SENT."
        test_recipe:
          setup: ["An UNSOLICITED submission is RELEASE_PENDING with a REQUIRED ReleaseForm expiring 2026-10-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SlateAdmin
            - call: "POST /literary-properties"
              payload: { title: "Paper Trail", material_type: "SPEC_SCRIPT", source_author_name: "L. Aziz", genre: "COMEDY", logline: "Sign here." }
              as: StoryEditor
              captures: { p_id: "$.data.id" }
            - call: "POST /submissions"
              payload: { property_id: "${p_id}", submitting_agency: "Self-submitted", submitter_contact_email: "la@mail.example", submitted_via: "UNSOLICITED" }
              as: Submitter
              captures: { s_id: "$.data.id" }
            - call: "POST /submissions/${s_id}/release-forms"
              payload: { expires_at: "2026-10-01T00:00:00Z" }
              as: StoryEditor
              as_user_id: "editor-assign-1"
              captures: { rf_id: "$.data.id" }
          trigger:
            - call: "POST /release-forms/${rf_id}/send"
              payload: {}
              as: StoryEditor
              as_user_id: "editor-assign-1"
          assert:
            - "ReleaseForm.${rf_id}.status == SENT"
