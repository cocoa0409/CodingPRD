      - name: markup_audit_skips_a_member_whose_letter_lacks_pricing_scope
        claim_type: conditional_validation
        grounds:
          - calculations.markup_overbilling
          - entities.AuthorizationLetter.fields.scope
          - endpoints["POST /purchase-batches/{batch_id}/audit-markup"]
        distinguishing_aspect: |
          Auditability is conditional on the LINE's member holding an ACTIVE
          letter with scope PURCHASE_DATA_AND_PRICING for THIS distributor. Two
          otherwise identical lines therefore diverge: the pricing-authorized
          member's line is overbilled 300 while the PURCHASE_DATA_ONLY member's
          line is forced to 0 even though its invoice exceeds the allowed markup
          by 2 cents per case. The batch total must be 300, not 380.
        test_recipe:
          setup:
            - "Distributor METRO-01, contracted_markup_bps 900; ELITE caps at 700, so allowed_markup_bps == 700 for both members."
