  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_fiscal_on_batch_commit
        grounds:
          - validations[priority=4]
          - validations[priority=9]
          - state_machines.ProductionBatch.SCHEDULED_to_COMMITTED
        distinguishing_aspect: |
          Category pair state vs business_fiscal: a batch-commit request where the
          batch is already CANCELLED (state violation) AND the commit would exceed
          hub capacity (fiscal violation) MUST return ERR_INVALID_STATE (409),
          because priority 4 state beats priority 9 business_fiscal.
        test_recipe:
          setup:
            - "Network N9, hub H9 (cap 100, region R9), line L9 OPERATIONAL"
            - "Batch B9 planned 150 (would exceed remaining capacity 100) and already CANCELLED while SCHEDULED"
          setup_api_calls:
            - call: "POST /networks"
              payload: { network_code: "N9", display_name: "Net Nine" }
              as: NetworkAdmin
              captures: { n9: $.data.id }
            - call: "POST /networks/${n9}/hubs"
              payload: { hub_code: "H9", daily_capacity_dozens: 100, territory_region: "R9" }
              as: NetworkAdmin
              captures: { h9: $.data.id, h9_v: $.data.version }
            - call: "POST /networks/${n9}/hubs/${h9}/lines"
              payload: { line_kind: "CONTINUOUS_FRYER", rated_dozens_per_hour: 100, service_interval_hours: 100 }
              as: HubManager
              captures: { l9: $.data.id }
            - call: "POST /networks/${n9}/hubs/${h9}/batches"
              payload: { equipment_line_id: "${l9}", production_date: "2026-09-01", planned_dozens: 150 }
              as: HubManager
              captures: { b9: $.data.id }
            - call: "POST /networks/${n9}/hubs/${h9}/batches/${b9}/cancel"
              payload: {}
              as: HubManager
          trigger:
            - call: "POST /networks/${n9}/hubs/${h9}/batches/${b9}/commit"
              payload: { expected_hub_version: "${h9_v}" }
              as: HubManager
              captures: { commit_err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (state priority 4 beats fiscal priority 9 even though capacity would also fail: 150 > 100)"
            - "http status == 409"

      - name: safety_vs_temporal_on_hot_light_ignite
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - state_machines.HotLightWindow.SCHEDULED_to_LIT
        distinguishing_aspect: |
          Category pair business_safety vs business_temporal: igniting a hot-light
          window when no fresh batch exists (safety violation) on a door that also
          has an overlapping window definition (temporal violation) MUST return
          ERR_FRESHNESS_VIOLATION (422), because priority 5 safety beats
          priority 6 temporal.
        test_recipe:
          setup:
            - "Network N10, THEATER COMPANY door D10 (region R10); hub H10 exists but has NO completed batch today (no fresh goods)"
            - "HotLightWindow W10a 06:00-08:00 and W10b 07:00-09:00 (overlapping definitions would violate temporal validation at creation — create only W10a, then ignite while a second LIT/EXTENDED window is absent but no fresh batch exists)"
          setup_api_calls:
            - call: "POST /networks"
              payload: { network_code: "N10", display_name: "Net Ten" }
              as: NetworkAdmin
              captures: { n10: $.data.id }
            - call: "POST /networks/${n10}/hubs"
              payload: { hub_code: "H10", daily_capacity_dozens: 500, territory_region: "R10" }
              as: NetworkAdmin
            - call: "POST /networks/${n10}/doors"
              payload: { door_kind: "THEATER", ownership: "COMPANY", territory_region: "R10" }
              as: NetworkAdmin
              captures: { d10: $.data.id }
            - call: "POST /networks/${n10}/doors/${d10}/hot-light-windows"
              payload: { lit_start: "2026-09-01T06:00:00Z", lit_end: "2026-09-01T08:00:00Z" }
              as: DoorManager
              as_user_id: "${d10}"
              captures: { w10: $.data.id }
          trigger:
            - call: "POST /networks/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T07:00:00Z" }
              as: NetworkAdmin
            - call: "POST /networks/${n10}/doors/${d10}/hot-light-windows/${w10}/ignite"
              payload: {}
              as: DoorManager
              as_user_id: "${d10}"
              captures: { ignite_err: $.data.error_id }
          assert:
            - "error_id == ERR_FRESHNESS_VIOLATION (no COMPLETED batch with fresh_until in future — safety precondition on the transition)"
            - "Window remains SCHEDULED"

