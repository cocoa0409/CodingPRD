  - rule_id: cross_entity_state_dependency
    instances:
      - name: cross_connect_approval_and_activation_track_contract_state_both_ways
        grounds:
          - state_machines.CrossConnectOrder.ROUTE_PROPOSED_to_APPROVED
          - state_machines.CrossConnectOrder.INSTALLED_to_ACTIVE
          - state_machines.Contract.ACTIVE_to_SUSPENDED
          - validations.priority_18_ERR_CONTRACT_NOT_ACTIVE
          - entities.Contract.fields.active_cross_connect_count
        distinguishing_aspect: |
          Two DIFFERENT transitions of the same order are guarded by the state of a different
          aggregate, and the guard is re-evaluated each time rather than latched at intake: the
          order is created while the contract is ACTIVE, refused approval while it is SUSPENDED,
          approved after reinstatement, allowed to reach INSTALLED even after a second
          suspension (that hop carries no contract guard), and then refused activation until the
          contract is reinstated once more — after which active_cross_connect_count moves 0 to 1.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Contract ACTIVE with cross_connect_cap 4; cabinet C01 INSTALLED in row HE/R1; MEET_ME cabinet Z01 in row HE/R2; one FREE SMF port per side."
            - "One SMF order created by user eng-1 and already driven to ROUTE_PROPOSED on PP-A/1 -> PP-Z/1."
          setup_api_calls:
            - call: "POST /colocation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FacilityManager
            - call: "POST /colocation/customers"
              payload: { legal_name: "Northwind Peering", account_code: "NWP" }
              as: FacilityManager
              captures: { cust_id: $.data.id }
            - call: "POST /colocation/contacts"
              payload: { customer_id: "${cust_id}", full_name: "Petra Requester", authorization_scopes: ["REMOTE_HANDS", "SITE_ACCESS"], access_level: "UNESCORTED" }
              as: SecurityOfficer
              captures: { con_id: $.data.id }
            - call: "POST /colocation/rows"
              payload: { hall_code: "HE", row_code: "R1", cabinet_slot_count: 8, design_density_kw_per_cabinet: 25.0, max_row_power_kw: 200.0, cooling_capacity_kw: 60.0, escort_slot_count: 1, decommission_flag: false }
              as: FacilityManager
              captures: { row_a_id: $.data.id }
            - call: "POST /colocation/rows"
              payload: { hall_code: "HE", row_code: "R2", cabinet_slot_count: 8, design_density_kw_per_cabinet: 25.0, max_row_power_kw: 200.0, cooling_capacity_kw: 60.0, escort_slot_count: 1, decommission_flag: false }
              as: FacilityManager
              captures: { row_z_id: $.data.id }
            - call: "POST /colocation/contracts"
              payload: { customer_id: "${cust_id}", contract_number: "C-9014", billing_mode: "COMMITTED_ONLY", committed_cabinet_count: 1, power_commit_kw: 20.0, committed_bandwidth_mbps: 1000, cross_connect_cap: 4, term_start_date: "2026-07-01T00:00:00Z", term_end_date: "2027-06-30T00:00:00Z", committed_cage_sqft: 0, redundancy_requirement: "N", cross_connect_allowance: 0, remote_hands_included_minutes: 0 }
              as: BillingOperator
              captures: { ctr_id: $.data.id }
            - call: "POST /colocation/contracts/${ctr_id}/state"
              payload: { to_state: "PENDING_ACTIVATION" }
              as: FacilityManager
            - call: "POST /colocation/cabinets"
              payload: { row_id: "${row_a_id}", cabinet_code: "C01", rated_power_kw: 20.0, footprint_type: "CABINET", u_height: 42 }
              as: FacilityManager
              captures: { cab_a_id: $.data.id }
            - call: "POST /colocation/cabinets"
              payload: { row_id: "${row_z_id}", cabinet_code: "Z01", rated_power_kw: 10.0, footprint_type: "MEET_ME", u_height: 42 }
              as: FacilityManager
              captures: { cab_z_id: $.data.id }
            - call: "POST /colocation/cabinets/${cab_a_id}/state"
              payload: { to_state: "RESERVED", contract_id: "${ctr_id}" }
              as: FacilityManager
            - call: "POST /colocation/contracts/${ctr_id}/state"
              payload: { to_state: "ACTIVE" }
              as: FacilityManager
            - call: "POST /colocation/cabinets/${cab_a_id}/state"
              payload: { to_state: "INSTALLED" }
              as: FacilityManager
            - call: "POST /colocation/patch-panel-ports"
              payload: { row_id: "${row_a_id}", panel_code: "PP-A", port_number: 1, media_type: "SMF" }
              as: FacilityManager
              captures: { pa1_id: $.data.id }
            - call: "POST /colocation/patch-panel-ports"
              payload: { row_id: "${row_z_id}", panel_code: "PP-Z", port_number: 1, media_type: "SMF" }
              as: FacilityManager
              captures: { pz1_id: $.data.id }
            - call: "GET /colocation/contracts/${ctr_id}"
              as: BillingOperator
              captures: { cv1: $.data.version }
            - call: "POST /colocation/cross-connect-orders"
              payload: { contract_id: "${ctr_id}", requested_by_contact_id: "${con_id}", a_end_cabinet_id: "${cab_a_id}", z_end_cabinet_id: "${cab_z_id}", cable_type: "SMF", expected_contract_version: "${cv1}" }
              as: ProvisioningEngineer
              as_user_id: "eng-1"
              captures: { ord_id: $.data.id }
            - call: "POST /colocation/cross-connect-orders/${ord_id}/propose-route"
              payload: { a_end_port_id: "${pa1_id}", z_end_port_id: "${pz1_id}", path_hops: ["PP-A", "PP-Z"] }
              as: ProvisioningEngineer
              as_user_id: "eng-1"
          trigger:
            - call: "POST /colocation/contracts/${ctr_id}/state"
              payload: { to_state: "SUSPENDED" }
              as: BillingOperator
            - call: "POST /colocation/cross-connect-orders/${ord_id}/state"
              payload: { to_state: "APPROVED" }
              as: FacilityManager
              as_user_id: "fm-1"
            - call: "POST /colocation/contracts/${ctr_id}/state"
              payload: { to_state: "ACTIVE" }
              as: BillingOperator
            - call: "POST /colocation/cross-connect-orders/${ord_id}/state"
              payload: { to_state: "APPROVED" }
              as: FacilityManager
              as_user_id: "fm-1"
            - call: "POST /colocation/contracts/${ctr_id}/state"
              payload: { to_state: "SUSPENDED" }
              as: BillingOperator
            - call: "POST /colocation/cross-connect-orders/${ord_id}/state"
              payload: { to_state: "INSTALLED" }
              as: ProvisioningEngineer
              as_user_id: "eng-1"
            - call: "POST /colocation/cross-connect-orders/${ord_id}/state"
              payload: { to_state: "ACTIVE" }
              as: FacilityManager
              as_user_id: "fm-1"
            - call: "POST /colocation/contracts/${ctr_id}/state"
              payload: { to_state: "ACTIVE" }
              as: BillingOperator
            - call: "POST /colocation/cross-connect-orders/${ord_id}/state"
              payload: { to_state: "ACTIVE" }
              as: FacilityManager
              as_user_id: "fm-1"
          assert:
            - "Approval attempt while the contract is SUSPENDED returns 409 ERR_CONTRACT_NOT_ACTIVE and leaves CrossConnectOrder.${ord_id}.status == ROUTE_PROPOSED with approved_by_user_id == null"
            - "The same approval after reinstatement returns 200 with status == APPROVED and approved_by_user_id == fm-1"
            - "The APPROVED to INSTALLED hop succeeds while the contract is SUSPENDED, proving that hop carries no contract guard: status == INSTALLED and both ports are ASSIGNED"
            - "Activation while the contract is SUSPENDED returns 409 ERR_CONTRACT_NOT_ACTIVE, leaving status == INSTALLED, activated_at == null and Contract.${ctr_id}.active_cross_connect_count == 0"
            - "Activation after the second reinstatement returns 200: CrossConnectOrder.${ord_id}.status == ACTIVE and activated_at == 2026-08-01T00:00:00Z"
            - "Contract.${ctr_id}.active_cross_connect_count == 1 and Contract.${ctr_id}.status == ACTIVE"
            - "PatchPanelPort.${pa1_id}.status == ASSIGNED and PatchPanelPort.${pz1_id}.status == ASSIGNED"

      - name: cabinet_space_and_power_both_follow_the_row_decommission_flag
        grounds:
          - endpoints.PATCH_colocation_rows_row_id
          - validations.priority_19_ERR_ROW_NOT_ACCEPTING_SPACE
          - state_machines.Cabinet.AVAILABLE_to_RESERVED
          - state_machines.PowerCircuit.APPROVED_to_ENERGIZED
          - calculations.row_capacity_and_posture
        distinguishing_aspect: |
          A single PATCH that touches no cabinet and no circuit flips the row to DECOMMISSIONING
          and in one step closes THREE unrelated doors — cabinet creation, cabinet
          reservation and circuit energization all return ERR_ROW_NOT_ACCEPTING_SPACE — and
          clearing the same flag re-opens all three, proving the dependency is read live from
          the parent row rather than copied onto the child at creation time.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Row HF/R1: design_density_kw_per_cabinet 25.0, max_row_power_kw 200.0, cooling_capacity_kw 60.0, decommission_flag false, row_status OPEN."
            - "Contract ACTIVE with committed_cabinet_count 2 and power_commit_kw 20.0."
            - "Cabinet C01 INSTALLED on the contract carrying one APPROVED 50A/240V/SINGLE PRIMARY circuit (derated 9.600); cabinet C02 created but still AVAILABLE."
          setup_api_calls:
            - call: "POST /colocation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FacilityManager
            - call: "POST /colocation/customers"
              payload: { legal_name: "Ironbark Hosting", account_code: "IRB" }
              as: FacilityManager
              captures: { cust_id: $.data.id }
            - call: "POST /colocation/rows"
              payload: { hall_code: "HF", row_code: "R1", cabinet_slot_count: 8, design_density_kw_per_cabinet: 25.0, max_row_power_kw: 200.0, cooling_capacity_kw: 60.0, escort_slot_count: 1, decommission_flag: false }
              as: FacilityManager
              captures: { row_id: $.data.id }
            - call: "POST /colocation/contracts"
              payload: { customer_id: "${cust_id}", contract_number: "C-9015", billing_mode: "COMMITTED_ONLY", committed_cabinet_count: 2, power_commit_kw: 20.0, committed_bandwidth_mbps: 1000, cross_connect_cap: 4, term_start_date: "2026-07-01T00:00:00Z", term_end_date: "2027-06-30T00:00:00Z", committed_cage_sqft: 0, redundancy_requirement: "N", cross_connect_allowance: 0, remote_hands_included_minutes: 0 }
              as: BillingOperator
              captures: { ctr_id: $.data.id }
            - call: "POST /colocation/contracts/${ctr_id}/state"
              payload: { to_state: "PENDING_ACTIVATION" }
              as: FacilityManager
            - call: "POST /colocation/cabinets"
              payload: { row_id: "${row_id}", cabinet_code: "C01", rated_power_kw: 20.0, footprint_type: "CABINET", u_height: 42 }
              as: FacilityManager
              captures: { cab1_id: $.data.id }
            - call: "POST /colocation/cabinets"
              payload: { row_id: "${row_id}", cabinet_code: "C02", rated_power_kw: 20.0, footprint_type: "CABINET", u_height: 42 }
              as: FacilityManager
              captures: { cab2_id: $.data.id }
            - call: "POST /colocation/cabinets/${cab1_id}/state"
              payload: { to_state: "RESERVED", contract_id: "${ctr_id}" }
              as: FacilityManager
            - call: "POST /colocation/contracts/${ctr_id}/state"
              payload: { to_state: "ACTIVE" }
              as: FacilityManager
            - call: "POST /colocation/cabinets/${cab1_id}/state"
              payload: { to_state: "INSTALLED" }
              as: FacilityManager
            - call: "POST /colocation/power-circuits"
              payload: { cabinet_id: "${cab1_id}", circuit_code: "A-1", feed_side: "A", redundancy_role: "PRIMARY", breaker_amps: 50, volts: 240, phase: "SINGLE" }
              as: ProvisioningEngineer
              captures: { cir_id: $.data.id }
            - call: "POST /colocation/power-circuits/${cir_id}/state"
              payload: { to_state: "APPROVED" }
              as: FacilityManager
          trigger:
            - call: "PATCH /colocation/rows/${row_id}"
              payload: { decommission_flag: true }
              as: FacilityManager
            - call: "POST /colocation/cabinets"
              payload: { row_id: "${row_id}", cabinet_code: "C03", rated_power_kw: 20.0, footprint_type: "CABINET", u_height: 42 }
              as: FacilityManager
            - call: "POST /colocation/cabinets/${cab2_id}/state"
              payload: { to_state: "RESERVED", contract_id: "${ctr_id}" }
              as: FacilityManager
            - call: "GET /colocation/rows/${row_id}"
              as: FacilityManager
              captures: { rv1: $.data.version }
            - call: "POST /colocation/power-circuits/${cir_id}/energize"
              payload: { expected_row_version: "${rv1}" }
              as: ProvisioningEngineer
            - call: "PATCH /colocation/rows/${row_id}"
              payload: { decommission_flag: false }
