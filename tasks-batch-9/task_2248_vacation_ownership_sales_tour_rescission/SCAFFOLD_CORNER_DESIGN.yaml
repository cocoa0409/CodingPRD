          setup:
            - "Logical clock pinned to 2026-08-01T00:00:00Z."
            - "One FL all-cash agreement executed 2026-08-14T09:00:00Z with purchase_price 3200000 and down_payment 3200000."
            - "Clock advanced to 2026-08-25T00:00:00Z, one millisecond-plus past the FL deadline 2026-08-24T23:59:59.999Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
