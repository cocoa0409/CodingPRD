            - call: "POST /tms/shipments/${ship1_id}/tenders"
              payload: { tender_minute: 100 }
              as: ShipperOps
              captures: { tender1_id: $.data.id }
            - call: "POST /tms/tenders/${tender1_id}/accept"
              payload: {}
              as: CarrierOps
            - call: "POST /tms/orders"
              payload: { customer_ref: "C2", origin_zone: "Z1", dest_zone: "Z2", weight_lbs: 4000, declared_value_cents: 200000 }
              as: ShipperOps
              captures: { order2_id: $.data.id }
            - call: "POST /tms/shipments"
              payload: { order_id: "${order2_id}", mode: "TL", distance_miles: 300, weight_lbs: 4000, promised_eta_minute: 500 }
              as: ShipperOps
              captures: { ship2_id: $.data.id }
            - call: "POST /tms/shipments/${ship2_id}/tenders"
              payload: { tender_minute: 100 }
              as: ShipperOps
              captures: { tender2_id: $.data.id }
            - call: "POST /tms/tenders/${tender2_id}/accept"
              payload: {}
              as: CarrierOps
            - call: "POST /tms/loads"
              payload: { carrier_id: "${carrier_a_id}", planned_capacity_lbs: 10000 }
              as: DockOps
              captures: { load_id: $.data.id, load_v: $.data.version }
            - call: "POST /tms/loads/${load_id}/shipments"
              payload: { shipment_id: "${ship1_id}", expected_load_version: "${load_v}" }
              as: DockOps
              captures: { load_v2: $.data.version }
          trigger:
            - call: "POST /tms/loads/${load_id}/shipments"
              payload: { shipment_id: "${ship2_id}", expected_load_version: "${load_v2}" }
              as: DockOps
              captures: { consolidated: $.data.consolidated_weight_lbs }
          assert:
            - "Load.${load_id}.consolidated_weight_lbs == 10000"
            - "response.http_status == 200"

      - name: dock_halfopen_touching_boundary_not_overlap
        grounds:
          - validations[priority=10]
          - entities.DockAppointment.fields.start_minute
          - entities.DockAppointment.fields.end_minute
        distinguishing_aspect: |
          Half-open interval boundary on POST /tms/dock-appointments (a different
          metric and endpoint than load capacity): an appointment [60,120) on
          door D1 does NOT overlap an existing [0,60) on D1 because they touch
          only at minute 60 (end == start). The second appointment is accepted.
        test_recipe:
          setup:
            - "Two loads on carrier A; door D1 has a SCHEDULED appointment [0,60)."
          setup_api_calls:
            - call: "POST /tms/carriers"
              payload: { name: "Acme TL", scac: "ACME", mode: "TL" }
              as: CarrierOps
              captures: { carrier_a_id: $.data.id }
            - call: "POST /tms/loads"
              payload: { carrier_id: "${carrier_a_id}", planned_capacity_lbs: 10000 }
              as: DockOps
              captures: { load1_id: $.data.id }
            - call: "POST /tms/loads"
              payload: { carrier_id: "${carrier_a_id}", planned_capacity_lbs: 10000 }
              as: DockOps
              captures: { load2_id: $.data.id }
            - call: "POST /tms/dock-appointments"
