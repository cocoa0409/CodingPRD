  # =========================================================================
  # Rule 9 — compensating_invariant (lot panel conservation; lane-day board conservation)
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: laminate_reserve_release_conservation
        grounds:
          - state_machines.LaminateReservation.RESERVED_to_RELEASED
          - entities.LaminateLot.fields.panels_available
        distinguishing_aspect: |
          Conserved quantity: lot panels. Invariant panels_total == panels_reserved +
          panels_consumed + panels_available must hold after the forward action
          (reserve 34: 100 == 34+0+66) and after its compensating action (release:
          100 == 0+0+100) — zero drift in either direction.
        test_recipe:
          setup:
            - "Order AWAITING_LAMINATE with RELEASED array; lot LOT-Q1 QUALIFIED with panels_total 100, untouched"
          setup_api_calls:
            - { call: "POST /pcb/customers", payload: { company_name: "Rho Circuits", contact_email: "ops@rho.example", credit_limit_cents: 1000000, tax_exempt: false }, as: FabAdmin, captures: { cust: $.data.id } }
            - { call: "POST /pcb/fab-orders", payload: { customer_id: "${cust}", service_lane: "STANDARD", board_x_mils: 2000, board_y_mils: 3000, layer_count: 2, surface_finish: "HASL", quantity_boards: 100, requested_ship_date: "2026-08-10T00:00:00Z" }, as: Customer, as_user_id: "${cust}", captures: { ord: $.data.id } }
            - { call: "POST /pcb/fab-orders/${ord}/stackups", payload: { revision: 1, total_thickness_mils: 62, dielectric_material: "FR4_TG170", copper_weight_oz: 1, impedance_controlled: false }, as: CAMOperator, captures: { stk: $.data.id } }
            - { call: "POST /pcb/stackups/${stk}/lock", payload: {}, as: ProcessEngineer }
            - { call: "POST /pcb/fab-orders/${ord}/submit-dfm", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /pcb/fab-orders/${ord}/dfm-approve", payload: {}, as: ProcessEngineer, captures: { ord_v: $.data.version } }
            - { call: "POST /pcb/fab-orders/${ord}/panel-arrays", payload: { array_x: 2, array_y: 2, panel_width_mils: 5000, panel_height_mils: 7000, expected_fab_order_version: "${ord_v}" }, as: CAMOperator, captures: { arr: $.data.id } }
            - { call: "POST /pcb/panel-arrays/${arr}/release", payload: {}, as: CAMOperator }
            - { call: "POST /pcb/laminate-lots", payload: { material_code: "FR4_TG170", lot_code: "LOT-Q1", manufacture_date: "2025-09-01T00:00:00Z", panels_total: 100 }, as: ProcessEngineer, captures: { lot: $.data.id } }
            - { call: "POST /pcb/laminate-lots/${lot}/qualify", payload: {}, as: QualityInspector, captures: { lot_v: $.data.version } }
          trigger:
            - { call: "POST /pcb/laminate-reservations", payload: { fab_order_id: "${ord}", panel_array_id: "${arr}", laminate_lot_id: "${lot}", panels_allocated: 34, expected_laminate_lot_version: "${lot_v}" }, as: ProductionPlanner, captures: { res: $.data.id } }
            - { call: "GET /pcb/laminate-lots/${lot}", payload: {}, as: ProductionPlanner, captures: { mid_reserved: $.data.panels_reserved, mid_available: $.data.panels_available } }
            - { call: "POST /pcb/laminate-reservations/${res}/release", payload: {}, as: ProductionPlanner }
            - { call: "GET /pcb/laminate-lots/${lot}", payload: {}, as: ProductionPlanner, captures: { fin_reserved: $.data.panels_reserved, fin_available: $.data.panels_available, fin_consumed: $.data.panels_consumed } }
          assert:
            - "mid-state: panels_reserved == 34 and panels_available == 66 (100 == 34 + 0 + 66)"
            - "final state: panels_reserved == 0, panels_consumed == 0, panels_available == 100 (100 == 0 + 0 + 100) — reserve+release conserves the lot exactly"
            - "GET LaminateReservation.${res}.status == RELEASED"
      - name: lane_commit_release_conservation
        grounds:
          - calculations.lane_capacity_commitment
          - state_machines.FabOrder.RELEASED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: per-day committed boards on a quick-turn lane (different
          quantity than lot panels). Releasing a qty-300 order moves committed from 0
          to 300; the compensating cancel returns it to exactly 0 — no residual
          commitment drift.
        test_recipe:
          setup:
            - "QUICK_TURN order qty 300 on lane QT3, ship 2026-08-10, prepared through AWAITING_LAMINATE with 100 panels reserved"
          setup_api_calls:
            - { call: "POST /pcb/quick-turn-lanes", payload: { lane_code: "QT3", turn_days: 3, capacity_boards_per_day: 500, premium_multiplier: 1.50, active: true }, as: FabAdmin, captures: { lane: $.data.id } }
            - { call: "POST /pcb/customers", payload: { company_name: "Sigma Circuits", contact_email: "ops@sigma.example", credit_limit_cents: 100000000, tax_exempt: false }, as: FabAdmin, captures: { cust: $.data.id } }
            - { call: "POST /pcb/fab-orders", payload: { customer_id: "${cust}", service_lane: "QUICK_TURN", quick_turn_lane_id: "${lane}", board_x_mils: 2000, board_y_mils: 3000, layer_count: 2, surface_finish: "HASL", quantity_boards: 300, requested_ship_date: "2026-08-10T00:00:00Z" }, as: Customer, as_user_id: "${cust}", captures: { ord: $.data.id } }
            - { call: "POST /pcb/fab-orders/${ord}/stackups", payload: { revision: 1, total_thickness_mils: 62, dielectric_material: "FR4_TG170", copper_weight_oz: 1, impedance_controlled: false }, as: CAMOperator, captures: { stk: $.data.id } }
            - { call: "POST /pcb/stackups/${stk}/lock", payload: {}, as: ProcessEngineer }
            - { call: "POST /pcb/fab-orders/${ord}/submit-dfm", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /pcb/fab-orders/${ord}/dfm-approve", payload: {}, as: ProcessEngineer, captures: { ord_v: $.data.version } }
            - { call: "POST /pcb/fab-orders/${ord}/panel-arrays", payload: { array_x: 2, array_y: 2, panel_width_mils: 5000, panel_height_mils: 7000, expected_fab_order_version: "${ord_v}" }, as: CAMOperator, captures: { arr: $.data.id } }
            - { call: "POST /pcb/panel-arrays/${arr}/release", payload: {}, as: CAMOperator }
            - { call: "POST /pcb/fab-orders/${ord}/drill-programs", payload: { revision: 1, min_hole_mils: 8, hole_count: 1200 }, as: CAMOperator, as_user_id: "cam_1", captures: { drl: $.data.id } }
            - { call: "POST /pcb/drill-programs/${drl}/submit", payload: {}, as: CAMOperator, as_user_id: "cam_1" }
            - { call: "POST /pcb/drill-programs/${drl}/approve", payload: {}, as: ProcessEngineer, as_user_id: "eng_1" }
            - { call: "POST /pcb/laminate-lots", payload: { material_code: "FR4_TG170", lot_code: "LOT-S1", manufacture_date: "2025-09-01T00:00:00Z", panels_total: 200 }, as: ProcessEngineer, captures: { lot: $.data.id } }
            - { call: "POST /pcb/laminate-lots/${lot}/qualify", payload: {}, as: QualityInspector, captures: { lot_v: $.data.version } }
            - { call: "POST /pcb/laminate-reservations", payload: { fab_order_id: "${ord}", panel_array_id: "${arr}", laminate_lot_id: "${lot}", panels_allocated: 100, expected_laminate_lot_version: "${lot_v}" }, as: ProductionPlanner }
            - { call: "POST /pcb/fab-orders/${ord}/release", payload: {}, as: ProductionPlanner }
          trigger:
            - { call: "GET /pcb/quick-turn-lanes/${lane}/slots", payload: { ship_date: "2026-08-10" }, as: ProductionPlanner, captures: { mid_committed: "$.data[0].committed_boards" } }
            - { call: "POST /pcb/fab-orders/${ord}/cancel", payload: { reason: "customer cancelled" }, as: ProductionPlanner }
            - { call: "GET /pcb/quick-turn-lanes/${lane}/slots", payload: { ship_date: "2026-08-10" }, as: ProductionPlanner, captures: { fin_committed: "$.data[0].committed_boards" } }
          assert:
            - "after release: committed_boards == 300 for ship_date 2026-08-10"
            - "after the compensating cancel: committed_boards == 0 — release+cancel conserves the lane-day commitment exactly"

  # =========================================================================
