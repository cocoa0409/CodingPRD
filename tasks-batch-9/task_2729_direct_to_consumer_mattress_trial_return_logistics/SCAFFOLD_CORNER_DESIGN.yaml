            - "TrialOrder.${order_id}.trial_status == RETURN_REQUESTED and fulfillment_status == DELIVERED"
            - "Customer.${cust_id}.completed_return_count == 0 and signal_count == 0; GET /customers/${cust_id}/abuse-signals returns total_count == 0"

      - name: trial_order_listing_combines_a_status_filter_with_limit_and_offset
        claim_type: Standard CRUD
        grounds:
          - endpoints[GET /trial-orders]
          - response_envelope.pagination_fields
        distinguishing_aspect: "Filtering happens before paging: with three orders on one customer of which two are DELIVERED, a fulfillment_status filter plus limit 1 / offset 1 returns total_count 2 (the filtered population, not 3), one row, and has_more false because the window reaches the end of the filtered set."
        test_recipe:
          setup:
            - "One QUEEN MattressModel and one Customer."
