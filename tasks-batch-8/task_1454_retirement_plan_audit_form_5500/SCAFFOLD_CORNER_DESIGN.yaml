# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# Retirement Plan Audit & Form 5500 (ERISA). Breadth walk over
# claim-extraction-guide sections against SCAFFOLD.yaml §1.1–§1.7.
# Names are unique across this file and SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: engagement_create_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Engagement, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /plan-audit/engagements without plan_year_start is rejected with ERR_INVALID_REQUEST before any persistence."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /plan-audit/engagements"
              payload: { sponsor_ein: "12-3456789", plan_number: "101", plan_name: "NoStart Plan", plan_year_end: "2026-01-01", plan_type: "DC_401K", funding_arrangement: "TRUST", prior_year_schedule_type: "I" }
              as: SponsorAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == \"ERR_INVALID_REQUEST\""
            - "HTTP status == 400"

      - name: engagement_computed_fields_input_ignored
        claim_type: computed_fields
        grounds: [entities.Engagement.fields.audit_required, entities.Engagement.fields.posture]
        distinguishing_aspect: "Client-supplied audit_required/posture values in the create body are ignored; server returns computed defaults (null audit_required, ON_TRACK posture)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /plan-audit/engagements"
              payload: { sponsor_ein: "12-3456789", plan_number: "102", plan_name: "Computed Plan", plan_year_start: "2025-01-01", plan_year_end: "2026-01-01", plan_type: "DC", funding_arrangement: "TRUST", prior_year_schedule_type: "I", audit_required: true, posture: "BLOCKED" }
              as: SponsorAdmin
              captures: { eng: $.data.id }
          assert:
            - "Engagement.${eng}.audit_required == null"
            - "Engagement.${eng}.posture == \"ON_TRACK\""
            - "Engagement.${eng}.status == \"DRAFT\""

      - name: participant_default_status_active
        claim_type: defaults
        grounds: [entities.Participant.fields.status]
        distinguishing_aspect: "Omitting status on participant create yields the documented default ACTIVE."
        test_recipe:
          setup: ["engagement 103 exists"]
          setup_api_calls:
            - call: "POST /plan-audit/engagements"
              payload: { sponsor_ein: "12-3456789", plan_number: "103", plan_name: "Defaults Plan", plan_year_start: "2025-01-01", plan_year_end: "2026-01-01", plan_type: "DC", funding_arrangement: "TRUST", prior_year_schedule_type: "I" }
              as: SponsorAdmin
              captures: { eng: $.data.id }
          trigger:
            - call: "POST /plan-audit/participants"
              payload: { engagement_id: "${eng}", external_ref: "P-001", eligibility_date: "2024-06-01", entry_date: "2024-07-01", is_eligible: true, is_hce: false, compensation_cy_cents: 5000000, deferral_amount_cy_cents: 0, opening_balance_cents: 0 }
              as: SponsorAdmin
              captures: { p1: $.data.id }
          assert:
            - "Participant.${p1}.status == \"ACTIVE\""
            - "Participant.${p1}.account_balance_cents == 0"

      - name: get_nonexistent_participant_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but unknown participant id returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /plan-audit/participants/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: Any
              captures: { err: $.data.error_id }
          assert:
            - "error_id == \"ERR_NOT_FOUND\""
            - "HTTP status == 404"

      - name: list_participants_pagination_envelope
        claim_type: listing
        grounds: [response_envelope, entities.Participant]
        distinguishing_aspect: "List endpoint honors limit/offset and returns total_count/has_more per the fixed envelope."
        test_recipe:
          setup: ["engagement 104 with 3 participants"]
          setup_api_calls:
            - call: "POST /plan-audit/engagements"
              payload: { sponsor_ein: "12-3456789", plan_number: "104", plan_name: "Paged Plan", plan_year_start: "2025-01-01", plan_year_end: "2026-01-01", plan_type: "DC", funding_arrangement: "TRUST", prior_year_schedule_type: "I" }
              as: SponsorAdmin
              captures: { eng: $.data.id }
            - call: "POST /plan-audit/participants/bulk-import"
              payload: { engagement_id: "${eng}", count: 3, external_ref_prefix: "PG", template: { eligibility_date: "2024-06-01", entry_date: "2024-07-01", is_eligible: true, is_hce: false, compensation_cy_cents: 5000000, deferral_amount_cy_cents: 0, opening_balance_cents: 0 } }
              as: SponsorAdmin
          trigger:
            - call: "GET /plan-audit/participants"
              payload: { engagement_id: "${eng}", limit: 2, offset: 0 }
              as: Any
          assert:
            - "response body has 2 data rows"
            - "total_count == 3"
            - "has_more == true"

      - name: contribution_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.Contribution.fields.type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Contribution type outside {ELECTIVE_DEFERRAL, EMPLOYER_MATCH, EMPLOYER_PROFIT_SHARING, ROLLOVER} is rejected."
        test_recipe:
          setup: ["engagement 105 with participant P"]
          setup_api_calls:
            - call: "POST /plan-audit/engagements"
              payload: { sponsor_ein: "12-3456789", plan_number: "105", plan_name: "Enum Plan", plan_year_start: "2025-01-01", plan_year_end: "2026-01-01", plan_type: "DC", funding_arrangement: "TRUST", prior_year_schedule_type: "I" }
              as: SponsorAdmin
              captures: { eng: $.data.id }
            - call: "POST /plan-audit/participants"
              payload: { engagement_id: "${eng}", external_ref: "P-001", eligibility_date: "2024-06-01", entry_date: "2024-07-01", is_eligible: true, is_hce: false, compensation_cy_cents: 5000000, deferral_amount_cy_cents: 0, opening_balance_cents: 0 }
              as: SponsorAdmin
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /plan-audit/contributions"
              payload: { engagement_id: "${eng}", participant_id: "${p1}", type: "EMPLOYER_SAFE_HARBOR", payroll_date: "2025-06-16", deposit_date: "2025-06-20", amount_cents: 1000 }
              as: SponsorAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == \"ERR_INVALID_REQUEST\""
            - "HTTP status == 400"

      - name: version_increments_on_mutation
        claim_type: system_fields
        grounds: [entities.Engagement]
        distinguishing_aspect: "Engagement.version starts at 1 and increments by exactly 1 on a state transition (activate)."
        test_recipe:
          setup: ["engagement 106 in DRAFT with version 1"]
          setup_api_calls:
            - call: "POST /plan-audit/engagements"
              payload: { sponsor_ein: "12-3456789", plan_number: "106", plan_name: "Version Plan", plan_year_start: "2025-01-01", plan_year_end: "2026-01-01", plan_type: "DC", funding_arrangement: "TRUST", prior_year_schedule_type: "I" }
              as: SponsorAdmin
              captures: { eng: $.data.id, v0: $.data.version }
          trigger:
            - call: "POST /plan-audit/engagements/${eng}/activate"
              payload: {}
              as: SponsorAdmin
          assert:
            - "Engagement.${eng}.version == ${v0} + 1"
            - "Engagement.${eng}.status == \"DATA_COLLECTION\""

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: engagement_terminal_completed_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Engagement, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "A COMPLETED engagement rejects further transitions (activate) with ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup:
            - "Engagement 201 walked DRAFT -> DATA_COLLECTION -> TESTING -> FIELDWORK -> REPORT_ISSUED -> COMPLETED (small plan, filing accepted, no findings)"
          setup_api_calls:
            - call: "POST /plan-audit/engagements"
              payload: { sponsor_ein: "12-3456789", plan_number: "201", plan_name: "Terminal Plan", plan_year_start: "2025-01-01", plan_year_end: "2026-01-01", plan_type: "DC", funding_arrangement: "TRUST", prior_year_schedule_type: "I" }
              as: SponsorAdmin
              captures: { eng: $.data.id }
            - call: "POST /plan-audit/participants"
              payload: { engagement_id: "${eng}", external_ref: "P-001", eligibility_date: "2024-06-01", entry_date: "2024-07-01", is_eligible: true, is_hce: false, compensation_cy_cents: 5000000, deferral_amount_cy_cents: 0, opening_balance_cents: 0 }
              as: SponsorAdmin
            - call: "POST /plan-audit/engagements/${eng}/recompute_participant_count"
              payload: {}
              as: TPASpecialist
            - call: "POST /plan-audit/engagements/${eng}/activate"
              payload: {}
              as: SponsorAdmin
            - call: "POST /plan-audit/engagements/${eng}/begin_testing"
              payload: {}
              as: TPASpecialist
            - call: "POST /plan-audit/engagements/${eng}/begin_fieldwork"
              payload: {}
              as: PlanAuditor
            - call: "POST /plan-audit/engagements/${eng}/issue_report"
              payload: {}
              as: PlanAuditor
            - call: "POST /plan-audit/filings"
              payload: { engagement_id: "${eng}" }
              as: TPASpecialist
              as_user_id: "u-tpa-1"
              captures: { fil: $.data.id }
            - call: "POST /plan-audit/schedule-entries"
              payload: { filing_id: "${fil}", schedule_type: "I", line_item: "I-1 total assets", amount_cents: 0 }
              as: TPASpecialist
              captures: { se: $.data.id }
            - call: "POST /plan-audit/schedule-entries/${se}/verify"
              payload: {}
              as: PlanAuditor
            - call: "POST /plan-audit/filings/${fil}/mark_schedules_complete"
              payload: {}
              as: TPASpecialist
            - call: "POST /plan-audit/filings/${fil}/mark_ready"
              payload: {}
              as: EngagementManager
              as_user_id: "u-mgr-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T00:00:00Z" }
              as: System
            - call: "POST /plan-audit/filings/${fil}/submit"
              payload: {}
              as: EngagementManager
              as_user_id: "u-mgr-1"
            - call: "POST /plan-audit/filings/${fil}/record_disposition"
              payload: { outcome: "ACCEPTED" }
              as: System
            - call: "POST /plan-audit/engagements/${eng}/complete"
              payload: {}
              as: EngagementManager
          trigger:
            - call: "POST /plan-audit/engagements/${eng}/activate"
              payload: {}
              as: SponsorAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == \"ERR_INVALID_STATE_TRANSITION\""
            - "Engagement.${eng}.status == \"COMPLETED\""

      - name: engagement_complete_with_open_findings_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.Engagement.REPORT_ISSUED_to_COMPLETED, "errors[ERR_OPEN_FINDINGS_REMAIN]"]
        distinguishing_aspect: "Completion is rejected while any finding is not VERIFIED_CLOSED or WAIVED."
        test_recipe:
          setup: ["engagement 202 in REPORT_ISSUED with filing ACCEPTED; one OPEN manual finding"]
          setup_api_calls:
            - call: "POST /plan-audit/engagements"
              payload: { sponsor_ein: "12-3456789", plan_number: "202", plan_name: "OpenFindings Plan", plan_year_start: "2025-01-01", plan_year_end: "2026-01-01", plan_type: "DC", funding_arrangement: "TRUST", prior_year_schedule_type: "I" }
              as: SponsorAdmin
              captures: { eng: $.data.id }
            - call: "POST /plan-audit/participants"
              payload: { engagement_id: "${eng}", external_ref: "P-001", eligibility_date: "2024-06-01", entry_date: "2024-07-01", is_eligible: true, is_hce: false, compensation_cy_cents: 5000000, deferral_amount_cy_cents: 0, opening_balance_cents: 0 }
              as: SponsorAdmin
            - call: "POST /plan-audit/engagements/${eng}/recompute_participant_count"
              payload: {}
              as: TPASpecialist
            - call: "POST /plan-audit/engagements/${eng}/activate"
              payload: {}
              as: SponsorAdmin
            - call: "POST /plan-audit/engagements/${eng}/begin_testing"
              payload: {}
              as: TPASpecialist
            - call: "POST /plan-audit/engagements/${eng}/begin_fieldwork"
              payload: {}
              as: PlanAuditor
            - call: "POST /plan-audit/engagements/${eng}/issue_report"
              payload: {}
              as: PlanAuditor
            - call: "POST /plan-audit/findings"
              payload: { engagement_id: "${eng}", category: "FILING_DEFECT", severity: "LOW", description: "typo on schedule" }
              as: PlanAuditor
              captures: { f1: $.data.id }
          trigger:
            - call: "POST /plan-audit/engagements/${eng}/complete"
              payload: {}
              as: EngagementManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == \"ERR_OPEN_FINDINGS_REMAIN\""
            - "Engagement.${eng}.status == \"REPORT_ISSUED\""
            - "AuditFinding.${f1}.status == \"OPEN\""

      - name: waive_high_severity_finding_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.AuditFinding.OPEN_to_WAIVED, "errors[ERR_WAIVER_NOT_ALLOWED]"]
        distinguishing_aspect: "HIGH findings cannot be waived regardless of justification; MEDIUM/LOW can."
        test_recipe:
          setup: ["engagement 203 with one HIGH manual finding and one LOW manual finding"]
          setup_api_calls:
            - call: "POST /plan-audit/engagements"
              payload: { sponsor_ein: "12-3456789", plan_number: "203", plan_name: "Waiver Plan", plan_year_start: "2025-01-01", plan_year_end: "2026-01-01", plan_type: "DC", funding_arrangement: "TRUST", prior_year_schedule_type: "I" }
              as: SponsorAdmin
              captures: { eng: $.data.id }
            - call: "POST /plan-audit/findings"
              payload: { engagement_id: "${eng}", category: "LATE_REMITTANCE", severity: "HIGH", description: "chronic late remittance" }
              as: PlanAuditor
              captures: { f_high: $.data.id }
            - call: "POST /plan-audit/findings"
              payload: { engagement_id: "${eng}", category: "FILING_DEFECT", severity: "LOW", description: "cosmetic" }
              as: PlanAuditor
              captures: { f_low: $.data.id }
          trigger:
            - call: "POST /plan-audit/findings/${f_high}/waive"
              payload: { justification: "immaterial" }
              as: EngagementManager
              captures: { err: $.data.error_id }
            - call: "POST /plan-audit/findings/${f_low}/waive"
              payload: { justification: "immaterial and corrected informally" }
              as: EngagementManager
          assert:
            - "err == \"ERR_WAIVER_NOT_ALLOWED\""
            - "AuditFinding.${f_high}.status == \"OPEN\""
            - "AuditFinding.${f_low}.status == \"WAIVED\""

      - name: invalid_transition_scan_fresh_engagement_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Contribution, "errors[ERR_PARTICIPANT_COUNT_REQUIRED]"]
        distinguishing_aspect: "late-deposit-scan before any recompute_participant_count is rejected because remittance_standard_days is null."
        test_recipe:
          setup: ["engagement 204 with one contribution but no participant-count recompute"]
          setup_api_calls:
            - call: "POST /plan-audit/engagements"
              payload: { sponsor_ein: "12-3456789", plan_number: "204", plan_name: "NoCount Plan", plan_year_start: "2025-01-01", plan_year_end: "2026-01-01", plan_type: "DC", funding_arrangement: "TRUST", prior_year_schedule_type: "I" }
              as: SponsorAdmin
              captures: { eng: $.data.id }
            - call: "POST /plan-audit/participants"
              payload: { engagement_id: "${eng}", external_ref: "P-001", eligibility_date: "2024-06-01", entry_date: "2024-07-01", is_eligible: true, is_hce: false, compensation_cy_cents: 5000000, deferral_amount_cy_cents: 100000, opening_balance_cents: 0 }
              as: SponsorAdmin
              captures: { p1: $.data.id }
            - call: "POST /plan-audit/contributions"
              payload: { engagement_id: "${eng}", participant_id: "${p1}", type: "ELECTIVE_DEFERRAL", payroll_date: "2025-06-16", deposit_date: "2025-06-30", amount_cents: 100000 }
              as: SponsorAdmin
          trigger:
            - call: "POST /plan-audit/engagements/${eng}/late-deposit-scan"
              payload: {}
              as: TPASpecialist
              captures: { err: $.data.error_id }
          assert:
            - "error_id == \"ERR_PARTICIPANT_COUNT_REQUIRED\""

      - name: begin_fieldwork_without_participant_count_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.Engagement.TESTING_to_FIELDWORK, "errors[ERR_PARTICIPANT_COUNT_REQUIRED]"]
        distinguishing_aspect: "Fieldwork cannot begin until the participant count has been computed."
        test_recipe:
          setup: ["engagement 205 in TESTING without recompute"]
          setup_api_calls:
            - call: "POST /plan-audit/engagements"
              payload: { sponsor_ein: "12-3456789", plan_number: "205", plan_name: "SkipCount Plan", plan_year_start: "2025-01-01", plan_year_end: "2026-01-01", plan_type: "DC", funding_arrangement: "TRUST", prior_year_schedule_type: "I" }
              as: SponsorAdmin
              captures: { eng: $.data.id }
            - call: "POST /plan-audit/engagements/${eng}/activate"
              payload: {}
              as: SponsorAdmin
            - call: "POST /plan-audit/engagements/${eng}/begin_testing"
              payload: {}
              as: TPASpecialist
          trigger:
            - call: "POST /plan-audit/engagements/${eng}/begin_fieldwork"
              payload: {}
              as: PlanAuditor
              captures: { err: $.data.error_id }
          assert:
            - "error_id == \"ERR_PARTICIPANT_COUNT_REQUIRED\""
            - "Engagement.${eng}.status == \"TESTING\""

      - name: issue_report_with_computed_test_result_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.Engagement.FIELDWORK_to_REPORT_ISSUED, "errors[ERR_TEST_NOT_FINAL]"]
        distinguishing_aspect: "A test result stuck in COMPUTED blocks report issuance (ERR_TEST_NOT_FINAL); only FINAL or SUPERSEDED results allow the report to issue."
        test_recipe:
          setup: ["engagement 206 in FIELDWORK with count computed and one ADP result COMPUTED (never finalized)"]
          setup_api_calls:
            - call: "POST /plan-audit/engagements"
              payload: { sponsor_ein: "12-3456789", plan_number: "206", plan_name: "PendingTest Plan", plan_year_start: "2025-01-01", plan_year_end: "2026-01-01", plan_type: "DC", funding_arrangement: "TRUST", prior_year_schedule_type: "I" }
              as: SponsorAdmin
              captures: { eng: $.data.id, eng_v: $.data.version }
            - call: "POST /plan-audit/participants"
              payload: { engagement_id: "${eng}", external_ref: "P-001", eligibility_date: "2024-06-01", entry_date: "2024-07-01", is_eligible: true, is_hce: false, compensation_cy_cents: 5000000, deferral_amount_cy_cents: 100000, opening_balance_cents: 0 }
              as: SponsorAdmin
            - call: "POST /plan-audit/engagements/${eng}/recompute_participant_count"
              payload: {}
              as: TPASpecialist
            - call: "POST /plan-audit/engagements/${eng}/activate"
              payload: {}
              as: SponsorAdmin
            - call: "POST /plan-audit/engagements/${eng}/begin_testing"
              payload: {}
              as: TPASpecialist
            - call: "POST /plan-audit/engagements/${eng}/begin_fieldwork"
              payload: {}
              as: PlanAuditor
            - call: "GET /plan-audit/engagements/${eng}"
              payload: {}
              as: Any
              captures: { eng_v2: $.data.version }
            - call: "POST /plan-audit/test-results"
              payload: { engagement_id: "${eng}", test_type: "ADP", expected_engagement_version: "${eng_v2}" }
              as: TPASpecialist
              captures: { tr: $.data.id }
          trigger:
            - call: "POST /plan-audit/engagements/${eng}/issue_report"
              payload: {}
              as: PlanAuditor
              captures: { err: $.data.error_id }
          assert:
            - "error_id == \"ERR_TEST_NOT_FINAL\""
            - "Engagement.${eng}.status == \"FIELDWORK\""
            - "NondiscriminationTestResult.${tr}.status == \"COMPUTED\""

      - name: correction_program_filing_resubmit_cycle
        claim_type: cyclic
        grounds: [state_machines.CorrectionProgramFiling]
        distinguishing_aspect: "VFCP program filing walks DRAFTED -> SUBMITTED -> REJECTED -> SUBMITTED -> APPROVED, exercising the resubmit cycle; submit requires all linked findings CORRECTED or VERIFIED_CLOSED."
        test_recipe:
          setup: ["engagement 209; HIGH finding fully corrected and VERIFIED_CLOSED via a QNEC deposit chain"]
          setup_api_calls:
            - call: "POST /plan-audit/engagements"
              payload: { sponsor_ein: "12-3456789", plan_number: "209", plan_name: "Program Plan", plan_year_start: "2025-01-01", plan_year_end: "2026-01-01", plan_type: "DC", funding_arrangement: "TRUST", prior_year_schedule_type: "I" }
              as: SponsorAdmin
              captures: { eng: $.data.id }
            - call: "POST /plan-audit/participants"
              payload: { engagement_id: "${eng}", external_ref: "P-001", eligibility_date: "2024-06-01", entry_date: "2024-07-01", is_eligible: true, is_hce: false, compensation_cy_cents: 5000000, deferral_amount_cy_cents: 0, opening_balance_cents: 0 }
              as: SponsorAdmin
              captures: { p1: $.data.id }
            - call: "POST /plan-audit/findings"
              payload: { engagement_id: "${eng}", category: "NONDISCRIMINATION_FAILURE", severity: "HIGH", description: "ADP failure" }
              as: PlanAuditor
              captures: { f1: $.data.id }
            - call: "POST /plan-audit/findings/${f1}/acknowledge"
              payload: {}
              as: SponsorAdmin
              as_user_id: "u-sponsor-1"
            - call: "POST /plan-audit/corrective-actions"
              payload: { engagement_id: "${eng}", finding_id: "${f1}", action_type: "QNEC_CONTRIBUTION", principal_cents: 8000, planned_execution_date: "2026-03-01", participant_id: "${p1}" }
              as: SponsorAdmin
              as_user_id: "u-sponsor-1"
              captures: { ca: $.data.id }
            - call: "POST /plan-audit/corrective-actions/${ca}/approve"
              payload: {}
              as: EngagementManager
              as_user_id: "u-mgr-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: System
            - call: "POST /plan-audit/corrective-actions/${ca}/execute"
              payload: {}
              as: SponsorAdmin
              as_user_id: "u-sponsor-1"
            - call: "POST /plan-audit/corrective-actions/${ca}/verify"
              payload: {}
              as: PlanAuditor
            - call: "POST /plan-audit/findings/${f1}/verify_close"
              payload: {}
              as: PlanAuditor
            - call: "POST /plan-audit/correction-program-filings"
              payload: { engagement_id: "${eng}", program: "EPCRS_VCP", linked_finding_ids: ["${f1}"], government_fee_cents: 150000 }
              as: EngagementManager
              captures: { cpf: $.data.id }
          trigger:
