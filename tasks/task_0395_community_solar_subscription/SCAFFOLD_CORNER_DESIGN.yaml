  # Note: ERR_IMMUTABLE_RESOURCE guards mutation of the common_fields:false
  # CarveOutAdjustment, but §1.5 declares no transition/update endpoint for that
  # entity, so the error is not reachable through any declared endpoint and no
  # corner instance can trigger it. Immutability itself is covered structurally
  # by the entities-section corner carve_out_adjustment_immutable_append_only_resource.

  # ===========================================================================
  # Section: rbac
  # ===========================================================================
  - section: rbac
    instances:
      - name: subscriber_cannot_create_project_returns_forbidden
        claim_type: peer_roles
        grounds:
          - roles.Subscriber
          - roles.GridOperator
          - endpoints.POST./projects
          - validations[priority=2]
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "POST /projects is GridOperator-exclusive; a Subscriber calling it → 403 ERR_FORBIDDEN (peer-role isolation)."
        test_recipe:
          setup:
            - "A subscriber exists to supply an X-User-ID."
          setup_api_calls:
            - call: "POST /subscribers"
              payload: { full_name: "No Op", utility_account_no: "ACC-C28", state_code: "NY", annual_usage_kwh: 50000 }
              as: ProgramAdmin
              captures: { sub_id: $.data.id }
          trigger:
            - call: "POST /projects"
              payload: { name: "X", state_code: "NY", nameplate_capacity_kw: 100, credit_rate_cents_per_kwh: 10 }
              as: Subscriber
              as_user_id: "${sub_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response 403 with data.error_id == ERR_FORBIDDEN; no project created"

      - name: grid_operator_cannot_approve_enrollment_returns_forbidden
        claim_type: peer_roles
        grounds:
          - roles.GridOperator
          - roles.ProgramAdmin
          - endpoints.POST./enrollments/{id}/approve
          - validations[priority=2]
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "POST /enrollments/{id}/approve is ProgramAdmin-exclusive; a GridOperator calling it → 403 ERR_FORBIDDEN."
        test_recipe:
          setup:
            - "A SUBMITTED enrollment on an OPEN project."
          setup_api_calls:
