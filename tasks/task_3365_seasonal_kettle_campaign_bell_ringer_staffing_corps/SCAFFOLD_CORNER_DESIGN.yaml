      - name: canteen_deployment_cost_tiered_marginal_surge
        claim_type: constants_applied
        grounds:
          - calculations.canteen_deployment_cost
          - state_machines.DisasterDeployment.DEPLOYED_to_DEMOBILIZED
          - entities.Unit.fields.canteen_pool_size
        distinguishing_aspect: |
          A TYPE_3 deployment of 2 canteens billed over 20 days costs 1689600 cents: 14 regular days
          at 48000 per canteen-day plus 6 surge days at 60 percent of that rate, so both the
          command-level tier constant and the marginal surge multiplier are exercised.
        test_recipe:
          setup:
            - "logical clock at 2026-11-01T00:00:00Z with one CORPS unit holding a 6-canteen pool"
            - "one deployment TYPE_3 requesting 2 canteens, approved, staged and deployed"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/units"
              payload: { name: "Corps 41", unit_type: "CORPS", territory_code: "NT", canteen_pool_size: 6 }
              as: PlatformAdmin
              captures: { unit_id: "$.data.id" }
            - call: "POST /api/disaster-deployments"
              payload: { unit_id: "${unit_id}", incident_name: "Prairie Ridge Wildfire", incident_command_level: "TYPE_3", requested_canteens: 2, command_authority: "IC Dana Whitmore" }
              as: DisasterServicesCoordinator
              captures: { dep: "$.data.id", dep_v: "$.data.version" }
            - call: "POST /api/disaster-deployments/${dep}/approve"
              payload: { decision: "APPROVE" }
              as: TerritorialCommander
              captures: { assigned: "$.data.assigned_canteen_count" }
            - call: "POST /api/disaster-deployments/${dep}/stage"
              payload: {}
              as: DisasterServicesCoordinator
            - call: "POST /api/disaster-deployments/${dep}/deploy"
              payload: {}
              as: DisasterServicesCoordinator
          trigger:
            - call: "POST /api/disaster-deployments/${dep}/demobilize"
              payload: { demobilized_at: "2026-11-21T00:00:00Z" }
              as: DisasterServicesCoordinator
              captures: { cost: "$.data.deployment_cost_cents", dep_status: "$.data.status" }
          assert:
            - "DisasterDeployment.${dep}.assigned_canteen_count == 2"
            - "DisasterDeployment.${dep}.status == DEMOBILIZED"
            - "DisasterDeployment.${dep}.deployment_cost_cents == 1689600"
            - "the cost equals 2 * (14 * 48000 + 6 * 48000 * 0.6), so 6 billed days are surge-priced"

      - name: program_capacity_allocation_waterfall_waitlist_promotion
        claim_type: waterfall_allocation
        grounds:
          - calculations.program_capacity_allocation
          - state_machines.CorpsProgram.PLANNED_to_ACTIVE
          - entities.CorpsProgram.fields.waitlist_enabled
        distinguishing_aspect: |
          A capacity-2 program with waitlisting enabled accepts two participants and waitlists the
          third by arrival order, then promotes the earliest waitlisted participant when a seat
          frees — a waterfall over the enrollment log rather than a rejection.
        test_recipe:
          setup:
            - "logical clock at 2026-11-15T00:00:00Z with one CORPS unit and one PLANNED program of capacity 2"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/units"
              payload: { name: "Corps 41", unit_type: "CORPS", territory_code: "NT", canteen_pool_size: 4 }
              as: PlatformAdmin
              captures: { unit_id: "$.data.id" }
            - call: "POST /api/corps-programs"
              payload: { unit_id: "${unit_id}", name: "Sunbeam Youth Club", category: "YOUTH", capacity: 2, waitlist_enabled: true, meeting_pattern: "Tuesdays 16:00" }
              as: ProgramDirector
              captures: { prog: "$.data.id" }
          trigger:
            - call: "POST /api/corps-programs/${prog}/enroll"
              payload: { participant_name: "Alice Nguyen", participant_type: "YOUTH" }
              as: ProgramDirector
              captures: { enrolled_1: "$.data.enrolled_count" }
            - call: "POST /api/corps-programs/${prog}/enroll"
              payload: { participant_name: "Bruno Salas", participant_type: "YOUTH" }
              as: ProgramDirector
            - call: "POST /api/corps-programs/${prog}/enroll"
              payload: { participant_name: "Chloe Adeyemi", participant_type: "YOUTH" }
              as: ProgramDirector
              captures: { enrolled_3: "$.data.enrolled_count", waitlist_3: "$.data.waitlist_count", prog_status: "$.data.status" }
            - call: "POST /api/corps-programs/${prog}/withdraw"
              payload: { participant_name: "Alice Nguyen" }
              as: ProgramDirector
              captures: { enrolled_4: "$.data.enrolled_count", waitlist_4: "$.data.waitlist_count" }
          assert:
            - "after three enrollments enrolled_count == 2 and waitlist_count == 1"
            - "the program status became ACTIVE on the first enrollment"
            - "after withdrawing Alice Nguyen enrolled_count == 2 and waitlist_count == 0"
            - "Chloe Adeyemi, the earliest waitlisted participant, holds the freed seat"

