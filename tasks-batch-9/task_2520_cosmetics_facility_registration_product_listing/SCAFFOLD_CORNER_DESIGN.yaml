            - call: "POST /cosmetics/adverse-events/${ae_up}/reclassify"
              payload: { seriousness: "SERIOUS", outcome_code: "HOSPITALIZATION" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { up_status: $.data.report_status, up_deadline: $.data.deadline_at }
            - call: "POST /cosmetics/adverse-events/${ae_up}/reclassify"
              payload: { seriousness: "NON_SERIOUS", outcome_code: "NONE" }
              as: EnforcementOfficer
              as_user_id: "OFF-1"
              captures: { err_officer: $.data.error_id }
          assert:
            - "${down_status} == \"RETAINED\" and ${down_deadline} is null — the reviewer's downgrade cleared the reporting obligation"
            - "${up_status} == \"REPORT_DUE\" and ${up_deadline} == \"2026-08-20T23:59:59.999Z\" (15 days from the 2026-08-05T08:00:00Z reclassification instant)"
            - "${err_officer} == \"ERR_FORBIDDEN_ROLE\" with HTTP 403 — the shared operation is shared by exactly two roles"
            - "Facility ${fac_id}.open_serious_event_count == 1 — one upgrade in, one downgrade out"
            - "AdverseEvent ${ae_up}.seriousness is still \"SERIOUS\" after the officer's refused call"

      - name: the_officer_who_accepted_the_plan_may_not_verify_the_effectiveness
        claim_type: segregation_of_duties
        grounds:
          - segregation_rules.recall-plan-decider-may-not-verify-effectiveness
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - validations[priority=30]
        distinguishing_aspect: |
          Same role, same permissions, different user: OFF-1 accepted the corrective plan, so OFF-1 is
          barred from the verified effectiveness check with ERR_SEGREGATION_OF_DUTIES (403) while OFF-2
          runs the identical payload and closes the withdrawal at 95.00. The bar is recorded state
          (plan_decision_user_id), not a claim in the request.
        test_recipe:
          setup:
            - "one REGISTERED facility, one listing with a 1000-unit record, a plan accepted by OFF-1, a withdrawal with that record produced and a 950-unit VERIFIED_RETURN posted"
          setup_api_calls:
            - call: "POST /cosmetics/facilities"
              payload: { facility_name: "Aster Labs Newark", owner_operator_name: "Aster Holdings LLC", facility_type: "MANUFACTURER", country_code: "US", state_or_province: "NJ" }
              as: FacilityRegistrant
