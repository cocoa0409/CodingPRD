      - name: corner_analyze_rejected_without_both_count_periods
        claim_type: precondition_enforcement
        grounds:
          - errors.ERR_INSUFFICIENT_COUNT_COVERAGE
          - state_machines.WarrantStudy.COUNTING_to_ANALYZED
          - validations.ERR_INSUFFICIENT_COUNT_COVERAGE
        distinguishing_aspect: |
          A study holding a single AM_ARRIVAL session satisfies "at least 2 sessions" only
          after a second is added, and satisfies "one of each period" only if that second
          session is PM_DISMISSAL. Analyzing with one AM session returns
          ERR_INSUFFICIENT_COUNT_COVERAGE (422) and leaves the study in COUNTING with a
