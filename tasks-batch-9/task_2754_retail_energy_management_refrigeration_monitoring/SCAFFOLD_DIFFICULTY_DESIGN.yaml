            - call: "POST /energy-ops/utility-accounts/${acct_2_id}/demand-response-events"
              payload: { program_code: "CPP-2026", curtailment_start_iso: "2026-08-05T14:30:00Z", curtailment_end_iso: "2026-08-05T15:30:00Z", target_reduction_kw: 150.0 }
              as: EnergyManager
              captures: { event_b_id: "$.data.id" }
            - call: "POST /energy-ops/demand-response-events/${event_a_id}/notify"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/demand-response-events/${event_b_id}/notify"
              payload: {}
              as: EnergyManager
              captures: { event_b_notified: "$.data.event_state" }
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T14:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /energy-ops/demand-response-events/${event_a_id}/activate"
              payload: {}
              as: EnergyManager
              captures: { event_a_state: "$.data.event_state" }
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T14:30:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/demand-response-events/${event_b_id}/activate"
              payload: {}
              as: EnergyManager
              captures: { hold_error: "$.data.error_id" }
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T15:00:00Z" }
              as: PlatformAdmin
              captures: { swept: "$.data.dr_events_completed", postures: "$.data.stores_posture_recomputed" }
            - call: "POST /energy-ops/demand-response-events/${event_b_id}/activate"
              payload: {}
              as: EnergyManager
              captures: { event_b_state: "$.data.event_state" }
          assert:
            - "${posture_start} == NORMAL"
            - "${event_b_notified} == NOTIFIED"
            - "${event_a_state} == ACTIVE"
            - "Store.${store_id}.energy_posture == CURTAILED after event A activates"
            - "${hold_error} == ERR_FOOD_SAFETY_HOLD"
            - "the blocked activation returns HTTP 409 and DemandResponseEvent.${event_b_id}.event_state stays NOTIFIED"
            - "${swept} == 1"
            - "${postures} == 1"
            - "DemandResponseEvent.${event_a_id}.event_state == COMPLETED"
            - "Store.${store_id}.energy_posture == NORMAL immediately after the sweep"
            - "${event_b_state} == ACTIVE"
            - "Store.${store_id}.energy_posture == CURTAILED again after event B activates"
            - "UtilityAccount.${acct_2_id}.dr_optout_count == 0"

      - name: bill_adjustment_blocked_by_pending_tariff_switch
        grounds:
          - validations[priority=94]
          - errors.ERR_TARIFF_SWITCH_IN_PROGRESS
          - state_machines.UtilityBill.transitions.bill_adjust
          - calculations.tariff_switch_projection
          - entities.UtilityAccount.fields.tariff_state
        distinguishing_aspect: |
          A different entity pair (UtilityBill, UtilityAccount) with the dependency
          pointing at the immediate parent rather than a grandparent, and gated on a
          non-posture field: a DISPUTED bill that satisfies every one of its own
          preconditions is still refused while its account sits in PENDING_SWITCH,
          because a rate change in flight would invalidate the adjustment
          arithmetic. The account only enters PENDING_SWITCH when
          tariff_switch_projection returns switch_recommended == true.
        test_recipe:
          setup:
            - "one MIXED / SUPERCENTER store with BMS ACTIVE and one TOU_DEMAND account whose candidate schedule is 0.1100 / 0.0700 / 11.00 TOU_DEMAND"
            - "one on-peak 1310.5 interval in June and one in July, ratchet_peak_kw 1500.0"
            - "the June bill is billed at exactly 99996.04, so variance 0.00 makes it the VALIDATED reference bill"
            - "the July bill is billed at 102500.00, so variance 2.50 flags it and it is then DISPUTED by u_analyst_ce2"
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/stores"
              payload: { code: "STR-CE2", climate_zone: "MIXED", store_format: "SUPERCENTER", floor_area_sqft: 120000 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id", store_v1: "$.data.version" }
            - call: "POST /energy-ops/setpoint-standards"
              payload: { climate_zone: "MIXED", store_format: "SUPERCENTER", season: "SUMMER", cooling_setpoint_f: 74.0, heating_setpoint_f: 68.0, deadband_f: 2.0, lighting_lux_target: 750 }
              as: EnergyManager
              captures: { std_id: "$.data.id" }
            - call: "POST /energy-ops/setpoint-standards/${std_id}/publish"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-commissioning"
              payload: { standard_id: "${std_id}", expected_store_version: "${store_v1}" }
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-activation"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/utility-accounts"
              payload: { utility_name: "Midland Power", rate_schedule_code: "TOU-GS3", rate_family: "TOU_DEMAND", demand_charge_per_kw: 14.50, rate_on_peak: 0.1450, rate_off_peak: 0.0800, ratchet_peak_kw: 1500.0, candidate_rate_schedule_code: "TOU-GS4", candidate_rate_family: "TOU_DEMAND", candidate_demand_charge_per_kw: 11.00, candidate_rate_on_peak: 0.1100, candidate_rate_off_peak: 0.0700 }
              as: EnergyManager
              captures: { acct_id: "$.data.id", tariff_state_initial: "$.data.tariff_state" }
            - call: "POST /energy-ops/utility-accounts/${acct_id}/demand-intervals"
              payload: { intervals: [ { interval_start_iso: "2026-06-10T18:00:00Z", kw_demand: 1310.5, is_on_peak: true }, { interval_start_iso: "2026-07-10T18:00:00Z", kw_demand: 1310.5, is_on_peak: true } ] }
              as: EnergyAnalyst
            - call: "POST /energy-ops/utility-accounts/${acct_id}/utility-bills"
              payload: { period_start_iso: "2026-06-01T00:00:00Z", period_end_iso: "2026-07-01T00:00:00Z", on_peak_kwh: 240000, off_peak_kwh: 518000, billed_kwh: 758000, billed_peak_kw: 1310.5, billed_amount_usd: 99996.04 }
              as: EnergyAnalyst
              captures: { bill_1_id: "$.data.id" }
            - call: "POST /energy-ops/utility-bills/${bill_1_id}/recompute"
              payload: {}
              as: EnergyAnalyst
              as_user_id: "u_analyst_ce2"
              captures: { bill_1_state: "$.data.validation_state", bill_1_variance: "$.data.variance_pct" }
            - call: "POST /energy-ops/utility-accounts/${acct_id}/utility-bills"
              payload: { period_start_iso: "2026-07-01T00:00:00Z", period_end_iso: "2026-08-01T00:00:00Z", on_peak_kwh: 240000, off_peak_kwh: 518000, billed_kwh: 758000, billed_peak_kw: 1310.5, billed_amount_usd: 102500.00 }
              as: EnergyAnalyst
              captures: { bill_2_id: "$.data.id" }
            - call: "POST /energy-ops/utility-bills/${bill_2_id}/recompute"
              payload: {}
              as: EnergyAnalyst
              as_user_id: "u_analyst_ce2"
              captures: { bill_2_state: "$.data.validation_state", bill_2_variance: "$.data.variance_pct" }
            - call: "POST /energy-ops/utility-bills/${bill_2_id}/dispute"
              payload: { dispute_reason: "on-peak kWh double counted by the utility" }
              as: EnergyAnalyst
              as_user_id: "u_analyst_ce2"
              captures: { bill_2_disputed: "$.data.validation_state" }
            - call: "GET /energy-ops/utility-accounts/${acct_id}/tariff-comparison"
              payload: {}
              as: EnergyAnalyst
              captures: { ref_bill: "$.data.reference_bill_id", current_annual: "$.data.current_annual_cost_usd", candidate_annual: "$.data.candidate_annual_cost_usd", annual_delta: "$.data.annual_delta_usd", recommended: "$.data.switch_recommended", cand_basis: "$.data.candidate_peak_basis" }
            - call: "GET /energy-ops/utility-accounts/${acct_id}"
              payload: {}
              as: EnergyManager
              captures: { acct_v: "$.data.version" }
          trigger:
            - call: "POST /energy-ops/utility-accounts/${acct_id}/tariff-switch"
              payload: { effective_from_iso: "2026-09-01T00:00:00Z", expected_utility_account_version: "${acct_v}" }
              as: EnergyManager
              captures: { tariff_state_after: "$.data.tariff_state" }
            - call: "POST /energy-ops/utility-bills/${bill_2_id}/adjustment"
              payload: { adjusted_amount_usd: 99996.04 }
              as: EnergyManager
              as_user_id: "u_manager_ce2"
              captures: { switch_error: "$.data.error_id" }
          assert:
            - "${tariff_state_initial} == STABLE"
            - "${bill_1_state} == VALIDATED"
            - "${bill_1_variance} == 0.00"
            - "${bill_2_state} == VARIANCE_FLAGGED"
            - "${bill_2_variance} == 2.50"
            - "${bill_2_disputed} == DISPUTED"
            - "${ref_bill} == ${bill_1_id}"
            - "${current_annual} == 1199952.48"
            - "${candidate_annual} == 970383.84"
            - "${annual_delta} == -229568.64"
            - "${recommended} == true"
            - "${cand_basis} == COINCIDENT_PEAK"
            - "${tariff_state_after} == PENDING_SWITCH"
            - "UtilityAccount.${acct_id}.tariff_switch_effective_from_iso == 2026-09-01T00:00:00Z"
            - "${switch_error} == ERR_TARIFF_SWITCH_IN_PROGRESS"
            - "the adjustment returns HTTP 409 even though u_manager_ce2 != u_analyst_ce2 and the bill is DISPUTED"
            - "UtilityBill.${bill_2_id}.validation_state == DISPUTED"
            - "UtilityBill.${bill_2_id}.adjusted_amount_usd == null"

  - rule_id: resource_temporal_overlap
    instances:
      - name: override_half_open_window_adjacency_admitted_overlap_rejected
        grounds:
          - validations[priority=101]
          - errors.ERR_OVERRIDE_WINDOW_CONFLICT
          - entities.LightingOverride.fields.zone
          - calculations.lighting_override_projection
        distinguishing_aspect: |
          Resource = (store, lighting zone); interval semantics = HALF-OPEN
          [start_iso, end_iso). A window that starts exactly when another ends is
          admitted (00:00-08:00 then 08:00-16:00 on SALES_FLOOR), a window that
          straddles that instant is rejected (07:00-09:00), and the identical
          straddling window on the PARKING zone is admitted because the zone is part
          of the resource key.
        test_recipe:
          setup:
            - "one MIXED / SUPERCENTER store with BMS ACTIVE, override_budget_kwh_month 500.0, clock 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/stores"
              payload: { code: "STR-RT1", climate_zone: "MIXED", store_format: "SUPERCENTER", floor_area_sqft: 120000, override_budget_kwh_month: 500.0 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id", store_v1: "$.data.version" }
            - call: "POST /energy-ops/setpoint-standards"
              payload: { climate_zone: "MIXED", store_format: "SUPERCENTER", season: "SUMMER", cooling_setpoint_f: 74.0, heating_setpoint_f: 68.0, deadband_f: 2.0, lighting_lux_target: 750 }
              as: EnergyManager
              captures: { std_id: "$.data.id" }
            - call: "POST /energy-ops/setpoint-standards/${std_id}/publish"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-commissioning"
              payload: { standard_id: "${std_id}", expected_store_version: "${store_v1}" }
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-activation"
              payload: {}
              as: EnergyManager
          trigger:
            - call: "POST /energy-ops/stores/${store_id}/lighting-overrides"
              payload: { zone: "SALES_FLOOR", override_type: "SCHEDULE_EXTEND", start_iso: "2026-08-10T00:00:00Z", end_iso: "2026-08-10T08:00:00Z", zone_load_kw: 37.5, requested_reason: "night crew A" }
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { ovr_a_id: "$.data.id", kwh_a: "$.data.projected_kwh" }
            - call: "POST /energy-ops/stores/${store_id}/lighting-overrides"
              payload: { zone: "SALES_FLOOR", override_type: "SCHEDULE_EXTEND", start_iso: "2026-08-10T08:00:00Z", end_iso: "2026-08-10T16:00:00Z", zone_load_kw: 12.5, requested_reason: "day crew adjacency" }
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { ovr_b_id: "$.data.id", kwh_b: "$.data.projected_kwh" }
            - call: "POST /energy-ops/stores/${store_id}/lighting-overrides"
              payload: { zone: "SALES_FLOOR", override_type: "SCHEDULE_EXTEND", start_iso: "2026-08-10T07:00:00Z", end_iso: "2026-08-10T09:00:00Z", zone_load_kw: 10.0, requested_reason: "straddles the boundary" }
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { overlap_error: "$.data.error_id" }
            - call: "POST /energy-ops/stores/${store_id}/lighting-overrides"
              payload: { zone: "PARKING", override_type: "SCHEDULE_EXTEND", start_iso: "2026-08-10T07:00:00Z", end_iso: "2026-08-10T09:00:00Z", zone_load_kw: 10.0, requested_reason: "different zone, same window" }
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { ovr_d_id: "$.data.id", kwh_d: "$.data.projected_kwh" }
          assert:
            - "${kwh_a} == 300.00"
            - "${kwh_b} == 100.00"
            - "LightingOverride.${ovr_b_id}.state == SCHEDULED"
            - "${overlap_error} == ERR_OVERRIDE_WINDOW_CONFLICT"
            - "the straddling request returns HTTP 409, and its 20.00 kWh would have fit the 500.0 budget, so the rejection is temporal and not fiscal"
            - "${kwh_d} == 20.00"
            - "LightingOverride.${ovr_d_id}.zone == PARKING"
            - "Store.${store_id}.override_kwh_used_month == 420.00"
            - "GET /energy-ops/stores/${store_id}/lighting-overrides returns exactly 3 rows"

      - name: dr_event_closed_window_with_recovery_gap_rejected
        grounds:
          - validations[priority=102]
          - errors.ERR_DR_WINDOW_CONFLICT
          - entities.DemandResponseEvent.fields.curtailment_start_iso
          - entities.DemandResponseEvent.fields.curtailment_end_iso
        distinguishing_aspect: |
          A different resource (utility account rather than lighting zone) with the
          OPPOSITE interval semantics: DR windows are CLOSED
          [curtailment_start_iso, curtailment_end_iso] AND carry a mandatory
          DR_RECOVERY_GAP_MINUTES (240) separation. So the adjacency that the
          lighting rule admits (a window starting exactly when another ends) is
          rejected here, and only a start at or after end + 240 minutes - exactly
          19:00Z after a 15:00Z end - is admitted.
        test_recipe:
          setup:
            - "one COLD / EXPRESS store with BMS ACTIVE and one TOU_DEMAND account"
            - "one SCHEDULED event A for 2026-08-05T14:00Z-15:00Z on that account"
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/stores"
              payload: { code: "STR-RT2", climate_zone: "COLD", store_format: "EXPRESS", floor_area_sqft: 14000 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id", store_v1: "$.data.version" }
            - call: "POST /energy-ops/setpoint-standards"
              payload: { climate_zone: "COLD", store_format: "EXPRESS", season: "SUMMER", cooling_setpoint_f: 74.0, heating_setpoint_f: 69.0, deadband_f: 2.0, lighting_lux_target: 600 }
              as: EnergyManager
              captures: { std_id: "$.data.id" }
            - call: "POST /energy-ops/setpoint-standards/${std_id}/publish"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-commissioning"
              payload: { standard_id: "${std_id}", expected_store_version: "${store_v1}" }
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-activation"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/utility-accounts"
              payload: { utility_name: "Northern Grid", rate_schedule_code: "TOU-GS1", rate_family: "TOU_DEMAND", demand_charge_per_kw: 12.00, rate_on_peak: 0.1400, rate_off_peak: 0.0790 }
              as: EnergyManager
              captures: { acct_id: "$.data.id" }
            - call: "POST /energy-ops/utility-accounts/${acct_id}/demand-response-events"
              payload: { program_code: "CPP-2026", curtailment_start_iso: "2026-08-05T14:00:00Z", curtailment_end_iso: "2026-08-05T15:00:00Z", target_reduction_kw: 200.0 }
              as: EnergyManager
              captures: { event_a_id: "$.data.id", event_a_state: "$.data.event_state" }
          trigger:
            - call: "POST /energy-ops/utility-accounts/${acct_id}/demand-response-events"
              payload: { program_code: "CPP-2026", curtailment_start_iso: "2026-08-05T15:00:00Z", curtailment_end_iso: "2026-08-05T16:00:00Z", target_reduction_kw: 150.0 }
              as: EnergyManager
              captures: { adjacency_error: "$.data.error_id" }
            - call: "POST /energy-ops/utility-accounts/${acct_id}/demand-response-events"
              payload: { program_code: "CPP-2026", curtailment_start_iso: "2026-08-05T18:59:00Z", curtailment_end_iso: "2026-08-05T19:59:00Z", target_reduction_kw: 150.0 }
              as: EnergyManager
              captures: { gap_error: "$.data.error_id" }
            - call: "POST /energy-ops/utility-accounts/${acct_id}/demand-response-events"
              payload: { program_code: "CPP-2026", curtailment_start_iso: "2026-08-05T19:00:00Z", curtailment_end_iso: "2026-08-05T20:00:00Z", target_reduction_kw: 150.0 }
              as: EnergyManager
              captures: { event_c_id: "$.data.id", event_c_state: "$.data.event_state" }
          assert:
            - "${event_a_state} == SCHEDULED"
            - "${adjacency_error} == ERR_DR_WINDOW_CONFLICT"
            - "the 15:00Z-16:00Z request returns HTTP 409 - closed-interval touching is a conflict here, unlike the half-open lighting rule"
            - "${gap_error} == ERR_DR_WINDOW_CONFLICT"
            - "the 18:59Z request returns HTTP 409 because 239 minutes < DR_RECOVERY_GAP_MINUTES 240"
            - "${event_c_state} == SCHEDULED"
            - "DemandResponseEvent.${event_c_id}.curtailment_start_iso == 2026-08-05T19:00:00Z (exactly 240 minutes after 15:00Z, admitted)"
            - "GET /energy-ops/utility-accounts/${acct_id}/demand-response-events returns exactly 2 rows"

      - name: work_order_aggregate_capacity_exceeded_at_third_overlap
        grounds:
          - validations[priority=121]
          - errors.ERR_WORK_ORDER_CAPACITY_EXCEEDED
          - state_machines.MaintenanceWorkOrder.transitions.work_order_schedule
          - calculations.fault_score
        distinguishing_aspect: |
          A third resource with AGGREGATE rather than pairwise semantics: the
          resource is the store's technician capacity, not a single equipment_ref, so
          three windows on three DIFFERENT equipment refs never trip
          validations[priority=103] yet the third mutual overlap exceeds
          WORK_ORDER_STORE_CAPACITY 2. Two overlapping windows are legal; the third
          is refused; moving it to a disjoint day is accepted.
        test_recipe:
          setup:
            - "one HOT_HUMID / SUPERCENTER store with BMS ACTIVE, clock 2026-08-01T00:00:00Z"
            - "three HVAC faults (MAJOR, occurrence_count 3, affected_load_kw 30.0) on equipment refs RTU-1, RTU-2 and RTU-3, each scoring 62.1 and each triaged into a ROUTINE work order so bms_status stays ACTIVE"
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/stores"
              payload: { code: "STR-RT3", climate_zone: "HOT_HUMID", store_format: "SUPERCENTER", floor_area_sqft: 130000 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id", store_v1: "$.data.version" }
            - call: "POST /energy-ops/setpoint-standards"
              payload: { climate_zone: "HOT_HUMID", store_format: "SUPERCENTER", season: "SUMMER", cooling_setpoint_f: 75.0, heating_setpoint_f: 69.0, deadband_f: 2.0, lighting_lux_target: 750 }
              as: EnergyManager
              captures: { std_id: "$.data.id" }
            - call: "POST /energy-ops/setpoint-standards/${std_id}/publish"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-commissioning"
              payload: { standard_id: "${std_id}", expected_store_version: "${store_v1}" }
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-activation"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/fault-diagnostics"
              payload: { equipment_ref: "RTU-1", equipment_class: "HVAC", fault_code: "ECON_DAMPER_STUCK", severity: "MAJOR", occurrence_count: 3, affected_load_kw: 30.0 }
              as: MaintenanceTech
              captures: { fault_1_id: "$.data.id", score_1: "$.data.fault_score" }
            - call: "POST /energy-ops/stores/${store_id}/fault-diagnostics"
              payload: { equipment_ref: "RTU-2", equipment_class: "HVAC", fault_code: "ECON_DAMPER_STUCK", severity: "MAJOR", occurrence_count: 3, affected_load_kw: 30.0 }
              as: MaintenanceTech
              captures: { fault_2_id: "$.data.id" }
            - call: "POST /energy-ops/stores/${store_id}/fault-diagnostics"
              payload: { equipment_ref: "RTU-3", equipment_class: "HVAC", fault_code: "ECON_DAMPER_STUCK", severity: "MAJOR", occurrence_count: 3, affected_load_kw: 30.0 }
              as: MaintenanceTech
              captures: { fault_3_id: "$.data.id" }
            - call: "POST /energy-ops/fault-diagnostics/${fault_1_id}/triage"
              payload: { outcome: "WORK_ORDER" }
              as: MaintenanceTech
              captures: { wo_1_id: "$.data.work_order_id", wo_1_priority: "$.data.work_order_priority", bms_1: "$.data.store_bms_status" }
            - call: "POST /energy-ops/fault-diagnostics/${fault_2_id}/triage"
              payload: { outcome: "WORK_ORDER" }
              as: MaintenanceTech
              captures: { wo_2_id: "$.data.work_order_id" }
            - call: "POST /energy-ops/fault-diagnostics/${fault_3_id}/triage"
              payload: { outcome: "WORK_ORDER" }
              as: MaintenanceTech
              captures: { wo_3_id: "$.data.work_order_id", urgent_count: "$.data.urgent_work_order_count" }
          trigger:
            - call: "POST /energy-ops/work-orders/${wo_1_id}/schedule"
              payload: { scheduled_start_iso: "2026-08-20T08:00:00Z", scheduled_end_iso: "2026-08-20T12:00:00Z" }
              as: MaintenanceTech
              captures: { wo_1_state: "$.data.state" }
            - call: "POST /energy-ops/work-orders/${wo_2_id}/schedule"
              payload: { scheduled_start_iso: "2026-08-20T09:00:00Z", scheduled_end_iso: "2026-08-20T13:00:00Z" }
              as: MaintenanceTech
              captures: { wo_2_state: "$.data.state" }
            - call: "POST /energy-ops/work-orders/${wo_3_id}/schedule"
              payload: { scheduled_start_iso: "2026-08-20T10:00:00Z", scheduled_end_iso: "2026-08-20T11:00:00Z" }
              as: MaintenanceTech
              captures: { capacity_error: "$.data.error_id" }
            - call: "POST /energy-ops/work-orders/${wo_3_id}/schedule"
              payload: { scheduled_start_iso: "2026-08-21T08:00:00Z", scheduled_end_iso: "2026-08-21T10:00:00Z" }
              as: MaintenanceTech
              captures: { wo_3_state: "$.data.state", wo_3_start: "$.data.scheduled_start_iso" }
          assert:
            - "${score_1} == 62.1"
            - "${wo_1_priority} == ROUTINE"
            - "${bms_1} == ACTIVE"
            - "${urgent_count} == 0"
            - "${wo_1_state} == SCHEDULED"
            - "${wo_2_state} == SCHEDULED"
            - "${capacity_error} == ERR_WORK_ORDER_CAPACITY_EXCEEDED"
            - "the third schedule returns HTTP 422, not the 409 of validations[priority=103], because RTU-3 shares no equipment_ref with RTU-1 or RTU-2"
            - "${wo_3_state} == SCHEDULED"
            - "${wo_3_start} == 2026-08-21T08:00:00Z"
            - "Store.${store_id}.energy_posture == NORMAL throughout"
            - "Store.${store_id}.bms_status == ACTIVE throughout"

  - rule_id: compensating_invariant
    instances:
      - name: dr_incentive_ledger_conserved_on_settlement_reversal
        grounds:
          - state_machines.DemandResponseEvent.transitions.dr_settle
          - state_machines.DemandResponseEvent.transitions.dr_reverse_settlement
          - entities.UtilityAccount.fields.dr_incentive_accrued_usd
          - calculations.dr_event_settlement
        distinguishing_aspect: |
          Conserved quantity: the account's demand-response incentive ledger in USD.
          The invariant is dr_incentive_accrued_usd == sum of incentive_usd over the
          account's events whose settlement_state == SETTLED. Settling credits
          exactly 87.17, reversing debits exactly 87.17 back to 0.00 - not a
          recomputation from scratch and not a partial write-down - while the event
          keeps incentive_usd 87.17 and performance_pct 103.8 as audit evidence, so
          the ledger and the evidence deliberately disagree after compensation.
        test_recipe:
          setup:
            - "one MIXED / SUPERCENTER store with BMS ACTIVE and one TOU_DEMAND account"
            - "baseline intervals 1290.5, 1275.0, 1245.0 giving baseline_kw 1270.17"
            - "an event for 2026-08-05T14:00Z-15:00Z with target_reduction_kw 200.0 whose in-window intervals are 1050.0, 1020.5, 1100.0 and 1080.0 - an over-performing run"
            - "notified, activated at 14:00Z and completed by the 15:00Z clock sweep"
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/stores"
              payload: { code: "STR-CI1", climate_zone: "MIXED", store_format: "SUPERCENTER", floor_area_sqft: 120000 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id", store_v1: "$.data.version" }
            - call: "POST /energy-ops/setpoint-standards"
              payload: { climate_zone: "MIXED", store_format: "SUPERCENTER", season: "SUMMER", cooling_setpoint_f: 74.0, heating_setpoint_f: 68.0, deadband_f: 2.0, lighting_lux_target: 750 }
              as: EnergyManager
              captures: { std_id: "$.data.id" }
            - call: "POST /energy-ops/setpoint-standards/${std_id}/publish"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-commissioning"
              payload: { standard_id: "${std_id}", expected_store_version: "${store_v1}" }
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-activation"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/utility-accounts"
              payload: { utility_name: "Midland Power", rate_schedule_code: "TOU-GS3", rate_family: "TOU_DEMAND", demand_charge_per_kw: 14.50, rate_on_peak: 0.1450, rate_off_peak: 0.0800 }
              as: EnergyManager
              captures: { acct_id: "$.data.id", accrued_initial: "$.data.dr_incentive_accrued_usd" }
            - call: "POST /energy-ops/utility-accounts/${acct_id}/demand-intervals"
              payload: { intervals: [ { interval_start_iso: "2026-08-04T14:00:00Z", kw_demand: 1290.5, is_on_peak: true }, { interval_start_iso: "2026-08-04T15:00:00Z", kw_demand: 1275.0, is_on_peak: true }, { interval_start_iso: "2026-08-04T16:00:00Z", kw_demand: 1245.0, is_on_peak: true }, { interval_start_iso: "2026-08-05T14:00:00Z", kw_demand: 1050.0, is_on_peak: true, is_dr_event_day: true }, { interval_start_iso: "2026-08-05T14:15:00Z", kw_demand: 1020.5, is_on_peak: true, is_dr_event_day: true }, { interval_start_iso: "2026-08-05T14:30:00Z", kw_demand: 1100.0, is_on_peak: true, is_dr_event_day: true }, { interval_start_iso: "2026-08-05T14:45:00Z", kw_demand: 1080.0, is_on_peak: true, is_dr_event_day: true } ] }
              as: EnergyAnalyst
            - call: "POST /energy-ops/utility-accounts/${acct_id}/demand-response-events"
              payload: { program_code: "CPP-2026", curtailment_start_iso: "2026-08-05T14:00:00Z", curtailment_end_iso: "2026-08-05T15:00:00Z", target_reduction_kw: 200.0 }
              as: EnergyManager
              captures: { event_id: "$.data.id" }
            - call: "POST /energy-ops/demand-response-events/${event_id}/notify"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T14:00:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/demand-response-events/${event_id}/activate"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T15:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /energy-ops/demand-response-events/${event_id}/settle"
              payload: {}
              as: EnergyAnalyst
              captures: { incentive: "$.data.incentive_usd", perf: "$.data.performance_pct", reduction: "$.data.total_reduction_kwh" }
            - call: "GET /energy-ops/utility-accounts/${acct_id}"
              payload: {}
              as: EnergyAnalyst
              captures: { accrued_after_settle: "$.data.dr_incentive_accrued_usd" }
            - call: "POST /energy-ops/demand-response-events/${event_id}/reverse-settlement"
              payload: { reversal_reason: "interval data restated by the utility" }
              as: EnergyManager
              captures: { reversed_incentive: "$.data.incentive_usd", reversed_settlement: "$.data.settlement_state" }
            - call: "GET /energy-ops/utility-accounts/${acct_id}"
              payload: {}
              as: EnergyAnalyst
              captures: { accrued_after_reversal: "$.data.dr_incentive_accrued_usd" }
          assert:
            - "${accrued_initial} == 0.0"
            - "${reduction} == 207.54"
            - "${perf} == 103.8"
            - "${incentive} == 87.17"
            - "${accrued_after_settle} == 87.17"
            - "${reversed_settlement} == REVERSED"
            - "${reversed_incentive} == 87.17"
            - "${accrued_after_reversal} == 0.00"
            - "DemandResponseEvent.${event_id}.performance_pct == 103.8 after the reversal"
            - "DemandResponseEvent.${event_id}.penalty_usd == 0.00"
            - "DemandResponseEvent.${event_id}.event_state == COMPLETED"
            - "the debit equals the original credit exactly, so dr_incentive_accrued_usd is 0.00 and never negative and never 87.17 - 0.01"

      - name: verified_savings_ledger_conserved_on_verification_revocation
        grounds:
          - state_machines.RetrofitProject.transitions.retrofit_measure_verified
          - state_machines.RetrofitProject.transitions.retrofit_revoke_verification
          - entities.Store.fields.verified_savings_kwh_ytd
          - entities.Store.fields.portfolio_realization_rate
          - calculations.measured_savings_verification
        distinguishing_aspect: |
          A different conserved quantity in different units: the store's verified
          energy-savings ledger in kWh, whose invariant is
          verified_savings_kwh_ytd == sum of measured_savings_kwh over that store's
          VERIFIED projects. Revoking a verification debits exactly the 104000.00 kWh
          that was credited, returning the ledger to 0.00, while
          measured_savings_kwh and realization_rate 0.8111 survive on the project and
          portfolio_realization_rate stays 0.8111 because SHORTFALL_REVIEW projects
          remain in that mean.
        test_recipe:
          setup:
            - "one HOT_HUMID / SUPERCENTER store with BMS ACTIVE, blended_rate_usd_per_kwh 0.11 and no refrigeration faults"
            - "clock 2026-08-01T00:00:00Z"
            - "one retrofit project proposed by u_analyst_ci2 with capex_usd 240240.00 and projected_annual_savings_kwh 520000.00, approved by u_manager_ci2"
            - "a measurement of baseline_period_kwh 300000.00, post_period_kwh 220000.00 over mv_period_days 90, installed 2026-05-01"
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/stores"
              payload: { code: "STR-CI2", climate_zone: "HOT_HUMID", store_format: "SUPERCENTER", floor_area_sqft: 128000 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id", store_v1: "$.data.version", ytd_initial: "$.data.verified_savings_kwh_ytd", portfolio_initial: "$.data.portfolio_realization_rate" }
            - call: "POST /energy-ops/setpoint-standards"
              payload: { climate_zone: "HOT_HUMID", store_format: "SUPERCENTER", season: "SUMMER", cooling_setpoint_f: 75.0, heating_setpoint_f: 69.0, deadband_f: 2.0, lighting_lux_target: 750 }
              as: EnergyManager
              captures: { std_id: "$.data.id" }
            - call: "POST /energy-ops/setpoint-standards/${std_id}/publish"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-commissioning"
              payload: { standard_id: "${std_id}", expected_store_version: "${store_v1}" }
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-activation"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/retrofit-projects"
              payload: { measure_type: "HVAC_RTU_REPLACEMENT", capex_usd: 240240.00, projected_annual_savings_kwh: 520000.00 }
              as: EnergyAnalyst
              as_user_id: "u_analyst_ci2"
              captures: { proj_id: "$.data.id", score_proposed: "$.data.priority_score" }
            - call: "POST /energy-ops/retrofit-projects/${proj_id}/approve"
              payload: { decision: "APPROVE" }
              as: EnergyManager
              as_user_id: "u_manager_ci2"
              captures: { score_approved: "$.data.priority_score", basis_approved: "$.data.priority_basis" }
          trigger:
            - call: "POST /energy-ops/retrofit-projects/${proj_id}/submit-measurement"
              payload: { install_completed_iso: "2026-05-01T00:00:00Z", baseline_period_kwh: 300000.00, post_period_kwh: 220000.00, mv_period_days: 90 }
              as: EnergyAnalyst
              as_user_id: "u_analyst_ci2"
              captures: { verified_state: "$.data.state", adjusted_baseline: "$.data.adjusted_baseline_kwh", measured: "$.data.measured_savings_kwh", rr: "$.data.realization_rate" }
            - call: "GET /energy-ops/stores/${store_id}"
              payload: {}
              as: EnergyAnalyst
              captures: { ytd_after_verify: "$.data.verified_savings_kwh_ytd", portfolio_after_verify: "$.data.portfolio_realization_rate" }
            - call: "POST /energy-ops/retrofit-projects/${proj_id}/revoke-verification"
              payload: { revocation_reason: "sub-metering error found in the post period" }
              as: EnergyManager
              as_user_id: "u_manager_ci2"
              captures: { revoked_state: "$.data.state", measured_after_revoke: "$.data.measured_savings_kwh", rr_after_revoke: "$.data.realization_rate" }
            - call: "GET /energy-ops/stores/${store_id}"
              payload: {}
              as: EnergyAnalyst
              captures: { ytd_after_revoke: "$.data.verified_savings_kwh_ytd", portfolio_after_revoke: "$.data.portfolio_realization_rate" }
          assert:
            - "${ytd_initial} == 0.0"
            - "${portfolio_initial} == 0.85"
            - "${score_proposed} == 58.0"
            - "${score_approved} == 50.6"
            - "${basis_approved} == RISK_ADJUSTED"
            - "${verified_state} == VERIFIED"
            - "${adjusted_baseline} == 324000.00"
            - "${measured} == 104000.00"
            - "${rr} == 0.8111"
            - "${ytd_after_verify} == 104000.00"
            - "${portfolio_after_verify} == 0.8111"
            - "${revoked_state} == SHORTFALL_REVIEW"
            - "${measured_after_revoke} == 104000.00"
            - "${rr_after_revoke} == 0.8111"
            - "${ytd_after_revoke} == 0.00"
            - "${portfolio_after_revoke} == 0.8111"
            - "RetrofitProject.${proj_id}.revocation_reason == sub-metering error found in the post period"
            - "the debit equals the credit exactly: 104000.00 in, 104000.00 out, ledger 0.00 with no rounding drift"
