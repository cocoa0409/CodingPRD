scenario: "593. Security Guard Services (Allied Universal style): post/site & coverage schedule, guard licensing & assignment, shift clock-in & tour/checkpoint (NFC), incident report & escalation, bill-rate vs pay-rate margin, overtime & relief/no-show, client invoice & post orders, training/cert tracking"
domain_name: security-guard-services
api_prefix: "/"

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - version_pinning_on_approval
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - self_referential      # CoverageShift.relief_for_shift_id -> CoverageShift.id
    - cross_aggregate       # InvoiceLine.shift_id crosses the Client/Invoice aggregate into the Post/Shift aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_level: Expert

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Client
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Legal name of the contracting client company.
        constraints: non-empty, max 120 chars
      - name: margin_floor_pct
        type: number
        source: input
        description: Minimum gross margin percentage an invoice must reach before it may be issued to this client.
        default: 20.0
        constraints: 0.0 <= margin_floor_pct <= 100.0
      - name: outstanding_balance_cents
        type: integer
        source: computed
        description: Sum of Invoice.total_cents over this client's invoices whose status IN {ISSUED, DISPUTED, ADJUSTED}. Recomputed on every Invoice transition.
        default: 0
      - name: paid_to_date_cents
        type: integer
        source: computed
        description: Sum of Invoice.total_cents over this client's invoices whose status == PAID. Recomputed on every Invoice transition.
        default: 0

  - name: Site
    parent: null
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; the client that owns this guarded site."
      - name: name
        type: string
        source: input
        description: Site display name.
        constraints: non-empty
      - name: coverage_status
        type: enum
        source: computed
        description: >-
          AT_RISK when at least one CoverageShift on any Post of this Site has status == OPEN_UNFILLED and
          scheduled_start_at in [current_utc, current_utc + 48h); otherwise COVERED. Recomputed on every
          CoverageShift create/assign/unassign/status transition and on every compliance sweep.
        default: COVERED
        constraints: "one of {COVERED, AT_RISK}"

  - name: Post
    parent: null
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: "FK -> Site.id; the site this guard post belongs to."
      - name: name
        type: string
        source: input
        description: Post display name (e.g. "North Lobby").
      - name: bill_rate_cents_per_hour
        type: integer
        source: input
        description: Contracted client bill rate for this post, in cents per hour.
        constraints: ">= 1"
      - name: max_concurrent_guards
        type: integer
        source: input
        description: Aggregate capacity of this post — how many non-cancelled shifts may occupy any single instant.
        default: 1
        constraints: ">= 1"
      - name: required_cert_codes
        type: array
        source: input
        description: Training/certification codes a guard must hold (VERIFIED and unexpired) to be assigned or confirmed on this post.
        default: []
        constraints: array of uppercase strings
      - name: checkpoint_tag_uids
        type: array
        source: input
        description: Ordered list of NFC checkpoint tag UIDs that make up this post's guard tour. May be empty (post has no tour).
        default: []
        constraints: array of unique non-empty strings
      - name: tour_compliance_floor_pct
        type: number
        source: input
        description: Tour compliance percentage at or above which no SLA service credit is applied to the shift's final bill.
        default: 80.0
        constraints: 0.0 <= tour_compliance_floor_pct <= 100.0

  - name: PostOrder
    parent: null
    common_fields: true
    fields:
      - name: post_id
        type: string
        source: input
        description: "FK -> Post.id; the post these written post orders govern."
      - name: body_text
        type: string
        source: input
        description: The written post-order instructions handed to the guard on duty.
        constraints: non-empty
      - name: revision_label
        type: string
        source: input
        description: Human revision label supplied by the account manager (e.g. "REV-C").
      - name: status
        type: enum
        source: system
        description: Lifecycle status of this post-order document.
        default: DRAFT
        constraints: "one of {DRAFT, PUBLISHED, SUPERSEDED}"
      - name: published_at
        type: datetime
        source: system
        description: Logical-clock instant at which this post order was published; null while DRAFT.
        default: null

  - name: Guard
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Guard's full legal name.
      - name: employee_code
        type: string
        source: input
        description: Employer-assigned code; unique across all guards.
        constraints: unique, non-empty
      - name: pay_rate_cents_per_hour
        type: integer
        source: input
        description: Base hourly pay rate for this guard, in cents per hour.
        constraints: ">= 1"
      - name: employment_status
        type: enum
        source: system
        description: Employment dimension of the guard's parallel state machine.
        default: APPLICANT
        constraints: "one of {APPLICANT, ACTIVE, SUSPENDED, TERMINATED}"
      - name: license_status
        type: enum
        source: computed
        description: >-
          Licensing dimension of the guard's parallel state machine, derived from this guard's LICENSE credentials.
          Recomputed ONLY on credential create, credential verify, and compliance sweep — never lazily on read.
        default: UNLICENSED
        constraints: "one of {UNLICENSED, PENDING_VERIFICATION, LICENSED, EXPIRED}"
      - name: no_show_count
        type: integer
        source: computed
        description: Count of this guard's shifts with status == NO_SHOW (provisional input set, see calculation guard_reliability_score).
        default: 0
      - name: late_clock_in_count
        type: integer
        source: computed
        description: Count of this guard's shifts whose actual_clock_in_at exceeds scheduled_start_at by more than 5 minutes (provisional input set).
        default: 0
      - name: missed_checkpoint_count
        type: integer
        source: computed
        description: Sum over this guard's shifts of (post checkpoint count - distinct checkpoint tags scanned on that shift), provisional input set.
        default: 0
      - name: strike_waiver_count
        type: integer
        source: system
        description: no_show_count snapshot taken at the last REINSTATE; no-shows up to this count are forgiven by the reliability score.
        default: 0
      - name: reliability_score
        type: number
        source: computed
        description: Provisional reliability score (0.0–100.0). See calculation guard_reliability_score, variant PROVISIONAL.
        default: 100.0
      - name: verified_reliability_score
        type: number
        source: computed
        description: Confirmed reliability score (0.0–100.0) counting only VERIFIED and NO_SHOW shifts. See calculation guard_reliability_score, variant CONFIRMED.
        default: 100.0
      - name: committed_hours
        type: number
        source: computed
        description: Sum of scheduled_hours over this guard's shifts with status IN {SCHEDULED, CONFIRMED, IN_PROGRESS}. 2 decimal places.
        default: 0.0

  - name: Credential
    parent: null
    common_fields: true
    fields:
      - name: guard_id
        type: string
        source: input
        description: "FK -> Guard.id; the guard who holds this credential."
      - name: kind
        type: enum
        source: input
        description: Whether this credential is a state guard license or a training certification.
        constraints: "one of {LICENSE, CERTIFICATION}"
      - name: code
        type: string
        source: input
        description: License class or certification code (e.g. "GUARD_CARD", "CPR").
        constraints: non-empty, uppercase
      - name: credential_number
        type: string
        source: input
        description: Issuing-authority document number.
      - name: expires_at
        type: datetime
        source: input
        description: Expiry instant (ISO 8601 UTC).
      - name: status
        type: enum
        source: system
        description: Verification/expiry status of this credential.
        default: PENDING_VERIFICATION
        constraints: "one of {PENDING_VERIFICATION, VERIFIED, EXPIRED}"
      - name: verified_by_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the ComplianceOfficer who verified this credential; null while PENDING_VERIFICATION.
        default: null

  - name: CoverageShift
    parent: null
    common_fields: true
    fields:
      - name: post_id
        type: string
        source: input
        description: "FK -> Post.id; the post this shift covers."
      - name: guard_id
        type: string
        source: system
        description: "FK -> Guard.id; the currently assigned guard; null while OPEN_UNFILLED."
        default: null
      - name: relief_for_shift_id
        type: string
        source: input
        description: "FK -> CoverageShift.id; set when this shift was created to relieve an uncovered shift on the same post."
        default: null
      - name: pinned_post_order_id
        type: string
        source: system
        description: "FK -> PostOrder.id; the PUBLISHED post order pinned at CONFIRM time; null before confirmation."
        default: null
      - name: pinned_post_order_version
        type: integer
        source: system
        description: PostOrder.version captured at CONFIRM time, so later republication does not retroactively change what the guard was briefed on.
        default: null
      - name: scheduled_start_at
        type: datetime
        source: input
        description: Scheduled start instant (ISO 8601 UTC), interval start (inclusive).
      - name: scheduled_end_at
        type: datetime
        source: input
        description: Scheduled end instant (ISO 8601 UTC), interval end (exclusive).
        constraints: must be strictly after scheduled_start_at
      - name: planned_break_minutes
        type: integer
        source: input
        description: Unpaid, unbilled break minutes deducted from both scheduled and actual hours.
        default: 30
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: Shift lifecycle state.
        default: OPEN_UNFILLED
        constraints: "one of {OPEN_UNFILLED, SCHEDULED, CONFIRMED, IN_PROGRESS, COMPLETED, VERIFIED, NO_SHOW, CANCELLED}"
      - name: bill_rate_cents_per_hour
        type: integer
        source: system
        description: Snapshot of Post.bill_rate_cents_per_hour taken at shift creation.
      - name: pay_rate_cents_per_hour
        type: integer
        source: system
        description: Snapshot of Guard.pay_rate_cents_per_hour taken at assignment; null while OPEN_UNFILLED.
        default: null
      - name: actual_clock_in_at
        type: datetime
        source: system
        description: Logical-clock instant of clock-in; null before clock-in.
        default: null
      - name: actual_clock_out_at
        type: datetime
        source: system
        description: Logical-clock instant of clock-out; null before clock-out.
        default: null
      - name: scheduled_hours
        type: number
        source: computed
        description: (scheduled_end_at - scheduled_start_at) in hours minus planned_break_minutes/60, 2 decimal places.
        default: 0.0
      - name: billable_hours
        type: number
        source: computed
        description: Client-billable hours after quarter-hour ceiling and overrun cap; null before clock-out.
        default: null
      - name: paid_hours
        type: number
        source: computed
        description: Guard-payable hours after quarter-hour half-up rounding; null before clock-out.
        default: null
      - name: provisional_billable_cents
        type: integer
        source: computed
        description: Estimated client charge computed at shift creation from scheduled_hours (variant PROVISIONAL of shift_billable_amount).
        default: 0
      - name: final_billable_cents
        type: integer
        source: computed
        description: Final client charge computed at clock-out from actual hours less SLA credit (variant FINAL of shift_billable_amount); null before clock-out.
        default: null
      - name: sla_credit_cents
        type: integer
        source: computed
        description: Service credit deducted from the final bill when tour_compliance_pct falls below the post's tour_compliance_floor_pct.
        default: 0
      - name: pay_cents
        type: integer
        source: computed
        description: Guard pay for this shift including night differential and weekly overtime premium; null before clock-out.
        default: null
      - name: margin_cents
        type: integer
        source: computed
        description: final_billable_cents - pay_cents; null before clock-out.
        default: null
      - name: overtime_hours
        type: number
        source: computed
        description: Portion of paid_hours that fell beyond the 40.00h weekly regular threshold for this guard, per the chronological weekly sweep.
        default: 0.0
      - name: tour_compliance_pct
        type: number
        source: computed
        description: Percentage of the post's checkpoint tags scanned at least once during this shift; 100.0 when the post has no checkpoints. Null before clock-out.
        default: null
      - name: verified_at
        type: datetime
        source: system
        description: Logical-clock instant at which a FieldSupervisor verified the completed shift for billing; null otherwise.
        default: null

  - name: TourScan
    parent: null
    common_fields: false
    fields:
      - name: shift_id
        type: string
        source: input
        description: "FK -> CoverageShift.id; the in-progress shift during which the NFC tag was tapped."
      - name: checkpoint_tag_uid
        type: string
        source: input
        description: NFC tag UID tapped by the guard; must be a member of the post's checkpoint_tag_uids.
      - name: scanned_at
        type: datetime
        source: system
        description: Logical-clock instant at which the scan was recorded.
      - name: is_duplicate
        type: boolean
        source: computed
        description: True when this shift already had a scan for the same checkpoint_tag_uid; duplicates are stored but do not add to distinct coverage.
        default: false

  - name: IncidentReport
    parent: null
    common_fields: true
    fields:
      - name: shift_id
        type: string
        source: input
        description: "FK -> CoverageShift.id; the shift during which the incident occurred."
      - name: severity
        type: enum
        source: input
        description: Reported severity of the incident.
        constraints: "one of {LOW, MEDIUM, HIGH, CRITICAL}"
      - name: narrative
        type: string
        source: input
        description: Guard's written account of the incident.
        constraints: non-empty
      - name: status
        type: enum
        source: system
        description: Incident review lifecycle state.
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, UNDER_REVIEW, INFO_REQUESTED, ESCALATED, RESOLVED, CLOSED}"
      - name: escalation_level
        type: integer
        source: system
        description: Number of times this incident has been escalated; incremented on every ESCALATE.
        default: 0
      - name: escalated_by_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the FieldSupervisor who performed the most recent ESCALATE; null if never escalated.
        default: null
      - name: resolution_note
        type: string
        source: system
        description: Supervisor's resolution text captured on RESOLVE.
        default: null
      - name: closed_by_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the FieldSupervisor who closed the incident; null until CLOSED.
        default: null

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; the client being billed."
      - name: period_start
        type: datetime
        source: input
        description: Billing period start (inclusive).
      - name: period_end
        type: datetime
        source: input
        description: Billing period end (exclusive); must be strictly after period_start.
      - name: status
        type: enum
        source: system
        description: Invoice lifecycle state.
        default: DRAFT
        constraints: "one of {DRAFT, ISSUED, DISPUTED, ADJUSTED, PAID, VOID}"
      - name: subtotal_cents
        type: integer
        source: computed
        description: Sum of InvoiceLine.amount_cents over this invoice's lines.
        default: 0
      - name: admin_fee_pct
        type: number
        source: computed
        description: Administrative fee percentage selected by the tier keyed on subtotal_cents (never on total_cents).
        default: 0.0
      - name: admin_fee_cents
        type: integer
        source: computed
        description: round_half_up(subtotal_cents * admin_fee_pct / 100).
        default: 0
      - name: total_cents
        type: integer
        source: computed
        description: subtotal_cents + admin_fee_cents.
        default: 0
      - name: pay_cost_cents
        type: integer
        source: computed
        description: Sum of InvoiceLine.pay_cost_cents over this invoice's lines — the payroll cost behind the billed shifts.
        default: 0
      - name: margin_pct
        type: number
        source: computed
        description: round_half_up(100 * (subtotal_cents - pay_cost_cents) / subtotal_cents, 2); 0.0 when subtotal_cents == 0.
        default: 0.0
      - name: dispute_reason
        type: string
        source: system
        description: Reason text captured on DISPUTE; null otherwise.
        default: null
      - name: issued_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent ISSUE; null while DRAFT.
        default: null

  - name: InvoiceLine
    parent: null
    common_fields: true
    fields:
      - name: invoice_id
        type: string
        source: input
        description: "FK -> Invoice.id; the invoice this line belongs to."
      - name: shift_id
        type: string
        source: input
        description: "FK -> CoverageShift.id; the VERIFIED shift this line bills."
      - name: hours
        type: number
        source: computed
        description: Copy of CoverageShift.billable_hours at line generation.
      - name: rate_cents_per_hour
        type: integer
        source: computed
        description: Copy of CoverageShift.bill_rate_cents_per_hour at line generation.
      - name: gross_amount_cents
        type: integer
        source: computed
        description: Copy of CoverageShift.final_billable_cents at line generation (already includes any SLA credit deduction).
      - name: credit_cents
        type: integer
        source: computed
        description: Cumulative credits applied to this line via invoice CREDIT actions.
        default: 0
      - name: amount_cents
        type: integer
        source: computed
        description: gross_amount_cents - credit_cents.
      - name: pay_cost_cents
        type: integer
        source: computed
        description: Copy of CoverageShift.pay_cents at line generation; used for margin, never billed.

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: CoverageShift
    initial_state: OPEN_UNFILLED
    terminal_states: [VERIFIED, CANCELLED]
    shape: cyclic
    transitions:
      - from: OPEN_UNFILLED
        to: SCHEDULED
        trigger: "POST /shifts/{id}/assignments"
        actor: Scheduler
        preconditions:
          - "payload expected_shift_version == CoverageShift.version (else ERR_STALE_VERSION)"
          - "Guard.employment_status == ACTIVE (else ERR_GUARD_NOT_ACTIVE)"
          - "Guard.license_status == LICENSED (else ERR_GUARD_NOT_LICENSED)"
          - "Guard holds a VERIFIED, unexpired CERTIFICATION Credential for every code in Post.required_cert_codes (else ERR_GUARD_CERT_MISSING)"
          - "No other CoverageShift of this guard with status NOT IN {CANCELLED, NO_SHOW} has [scheduled_start_at, scheduled_end_at) strictly intersecting this shift's interval (else ERR_GUARD_DOUBLE_BOOKED)"
          - "No other CoverageShift of this guard with status NOT IN {CANCELLED, NO_SHOW} intersects this shift's interval widened by REST_BUFFER_MINUTES=480 on both ends (else ERR_GUARD_REST_PERIOD_VIOLATION)"
        side_effects:
          - "sets CoverageShift.guard_id = payload guard_id"
          - "snapshots CoverageShift.pay_rate_cents_per_hour = Guard.pay_rate_cents_per_hour"
          - "increments CoverageShift.version by 1"
          - "recomputes Guard.committed_hours for the newly assigned guard (calculation guard_committed_hours)"
          - "recomputes Site.coverage_status for the shift's site (calculation site_coverage_status)"
      - from: SCHEDULED
        to: SCHEDULED
        trigger: "POST /shifts/{id}/assignments (reassignment — the new assignment legitimately supersedes the prior one)"
        actor: Scheduler
        preconditions:
          - "payload expected_shift_version == CoverageShift.version (else ERR_STALE_VERSION)"
          - "same guard eligibility and interval preconditions as OPEN_UNFILLED -> SCHEDULED"
        side_effects:
          - "replaces CoverageShift.guard_id and CoverageShift.pay_rate_cents_per_hour with the new guard's values"
          - "increments CoverageShift.version by 1"
          - "recomputes Guard.committed_hours for BOTH the previous guard (decreases) and the new guard (increases)"
        note: "This is the CREATE-with-supersede pattern behind concurrency_rules[shift-assign-stale-shift]."
      - from: SCHEDULED
        to: OPEN_UNFILLED
        trigger: "POST /shifts/{id}/actions {action: UNASSIGN}"
        actor: Scheduler
        preconditions:
          - "CoverageShift.guard_id is not null (else ERR_SHIFT_NOT_ASSIGNED)"
        side_effects:
          - "clears CoverageShift.guard_id and CoverageShift.pay_rate_cents_per_hour to null"
          - "recomputes Guard.committed_hours for the released guard — the compensating half of the assign/unassign invariant"
          - "recomputes Site.coverage_status for the shift's site"
      - from: CONFIRMED
        to: OPEN_UNFILLED
        trigger: "POST /shifts/{id}/actions {action: UNASSIGN}"
        actor: Scheduler
        preconditions:
          - "CoverageShift.guard_id is not null (else ERR_SHIFT_NOT_ASSIGNED)"
        side_effects:
          - "clears CoverageShift.guard_id, CoverageShift.pay_rate_cents_per_hour, CoverageShift.pinned_post_order_id and CoverageShift.pinned_post_order_version to null"
          - "recomputes Guard.committed_hours for the released guard"
          - "recomputes Site.coverage_status for the shift's site"
      - from: SCHEDULED
        to: CONFIRMED
        trigger: "POST /shifts/{id}/actions {action: CONFIRM}"
        actor: Scheduler | Guard
        preconditions:
          - "CoverageShift.guard_id is not null (else ERR_SHIFT_NOT_ASSIGNED)"
          - "acting Guard, when the actor role is Guard, must be CoverageShift.guard_id (else ERR_NOT_SHIFT_OWNER)"
          - "Guard.employment_status == ACTIVE (else ERR_GUARD_NOT_ACTIVE)"
          - "Guard.license_status == LICENSED (else ERR_GUARD_NOT_LICENSED)"
          - "Guard holds every code in Post.required_cert_codes (else ERR_GUARD_CERT_MISSING)"
          - "The shift's Post has exactly one PostOrder with status == PUBLISHED (else ERR_POST_ORDER_NOT_PUBLISHED)"
        side_effects:
          - "pins CoverageShift.pinned_post_order_id to the post's PUBLISHED PostOrder.id"
          - "pins CoverageShift.pinned_post_order_version to that PostOrder.version — later republication does not mutate this pin"
      - from: CONFIRMED
        to: IN_PROGRESS
        trigger: "POST /shifts/{id}/clock-in"
        actor: Guard
        preconditions:
          - "X-User-ID == CoverageShift.guard_id (else ERR_NOT_SHIFT_OWNER)"
          - "Guard.employment_status == ACTIVE (else ERR_GUARD_NOT_ACTIVE)"
          - "Guard.license_status == LICENSED (else ERR_GUARD_NOT_LICENSED)"
        side_effects:
          - "sets CoverageShift.actual_clock_in_at = current logical clock"
          - "recomputes Guard.late_clock_in_count (a clock-in later than scheduled_start_at + LATE_GRACE_MINUTES=5 adds one)"
          - "recomputes Guard.reliability_score and Guard.verified_reliability_score (calculation guard_reliability_score)"
          - "if the recomputed Guard.reliability_score < 50 and Guard.employment_status == ACTIVE, auto-suspends the guard (see Guard state machine ACTIVE -> SUSPENDED)"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /shifts/{id}/clock-out"
        actor: Guard
        preconditions:
          - "X-User-ID == CoverageShift.guard_id (else ERR_NOT_SHIFT_OWNER)"
        side_effects:
          - "sets CoverageShift.actual_clock_out_at = current logical clock"
          - "computes CoverageShift.tour_compliance_pct (calculation tour_compliance)"
          - "computes CoverageShift.billable_hours, sla_credit_cents and final_billable_cents (calculation shift_billable_amount, variant FINAL)"
          - "computes CoverageShift.paid_hours, overtime_hours and pay_cents (calculation guard_weekly_pay)"
          - "computes CoverageShift.margin_cents = final_billable_cents - pay_cents"
          - "recomputes Guard.missed_checkpoint_count, Guard.reliability_score and Guard.verified_reliability_score"
          - "recomputes Guard.committed_hours (the shift leaves the {SCHEDULED, CONFIRMED, IN_PROGRESS} set)"
      - from: COMPLETED
        to: VERIFIED
        trigger: "POST /shifts/{id}/actions {action: VERIFY}"
        actor: FieldSupervisor
        preconditions:
          - "CoverageShift.actual_clock_out_at is not null"
        side_effects:
          - "sets CoverageShift.verified_at = current logical clock"
          - "recomputes Guard.verified_reliability_score — the shift now enters the CONFIRMED variant input set"
          - "makes the shift eligible for InvoiceLine generation"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /shifts/{id}/actions {action: NO_SHOW}"
        actor: FieldSupervisor
        preconditions:
          - "CoverageShift.guard_id is not null (else ERR_SHIFT_NOT_ASSIGNED)"
          - "current logical clock >= scheduled_start_at + NO_SHOW_GRACE_MINUTES=15 (else ERR_INVALID_STATE)"
        side_effects:
          - "CASCADE HOP 1: recomputes Guard.no_show_count for the assigned guard (the shift now counts as a NO_SHOW)"
          - "CASCADE HOP 2: the changed no_show_count forces a recompute of Guard.reliability_score and Guard.verified_reliability_score"
          - "CASCADE HOP 3: the recomputed reliability_score, if < 50 while Guard.employment_status == ACTIVE, drives Guard ACTIVE -> SUSPENDED"
          - "CASCADE HOP 4: that suspension releases every other shift of the guard with status IN {SCHEDULED, CONFIRMED} and scheduled_start_at >= current clock back to OPEN_UNFILLED, clearing guard_id/pay_rate/pin and recomputing Guard.committed_hours"
          - "CASCADE HOP 5: each released shift forces a recompute of Site.coverage_status on its site, which flips to AT_RISK when the released shift starts within 48h"
          - "recomputes Guard.committed_hours (this shift leaves the committed set)"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /shifts/{id}/actions {action: NO_SHOW}"
        actor: FieldSupervisor
        preconditions:
          - "current logical clock >= scheduled_start_at + NO_SHOW_GRACE_MINUTES=15 (else ERR_INVALID_STATE)"
        side_effects:
          - "identical cascade to SCHEDULED -> NO_SHOW"
          - "clears CoverageShift.pinned_post_order_id and CoverageShift.pinned_post_order_version"
      - from: NO_SHOW
        to: OPEN_UNFILLED
        trigger: "POST /shifts/{id}/actions {action: UNASSIGN} (relief workflow — releases the no-show shift so it can be re-crewed)"
        actor: Scheduler
        preconditions:
          - "CoverageShift.guard_id is not null (else ERR_SHIFT_NOT_ASSIGNED)"
        side_effects:
          - "clears CoverageShift.guard_id and CoverageShift.pay_rate_cents_per_hour"
          - "the shift's NO_SHOW record is retained on the guard: Guard.no_show_count is recomputed from shifts that ARE currently NO_SHOW, so releasing the shift also clears the strike"
        note: "Cycle edge: NO_SHOW -> OPEN_UNFILLED -> SCHEDULED. The scheduler normally leaves the no-show shift alone and creates a relief shift instead (POST /shifts with relief_for_shift_id)."
      - from: OPEN_UNFILLED
        to: CANCELLED
        trigger: "POST /shifts/{id}/actions {action: CANCEL}"
        actor: Scheduler
        preconditions: []
        side_effects:
          - "recomputes Site.coverage_status (a cancelled shift no longer counts as an uncovered gap)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /shifts/{id}/actions {action: CANCEL}"
        actor: Scheduler
        preconditions: []
        side_effects:
          - "clears CoverageShift.guard_id and CoverageShift.pay_rate_cents_per_hour"
          - "recomputes Guard.committed_hours and Site.coverage_status"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /shifts/{id}/actions {action: CANCEL}"
        actor: Scheduler
        preconditions: []
        side_effects:
          - "clears CoverageShift.guard_id, CoverageShift.pay_rate_cents_per_hour and the post-order pin"
          - "recomputes Guard.committed_hours and Site.coverage_status"

  - entity: Guard
    initial_state: "APPLICANT (employment dimension) × UNLICENSED (license dimension)"
    terminal_states: [TERMINATED]
    shape: parallel
    note: >-
      Guard carries TWO independent state dimensions on one row: employment_status and license_status.
      They evolve through different triggers and neither is a function of the other; assignment
      eligibility is the conjunction (ACTIVE ∧ LICENSED).
    transitions:
      - from: "employment_status=APPLICANT"
        to: "employment_status=ACTIVE"
        trigger: "POST /guards/{id}/status {action: ACTIVATE}"
        actor: ComplianceOfficer
        preconditions:
          - "Guard.license_status == LICENSED (else ERR_GUARD_NOT_LICENSED)"
        side_effects:
          - "guard becomes eligible for shift assignment"
      - from: "employment_status=ACTIVE"
        to: "employment_status=SUSPENDED"
        trigger: "POST /guards/{id}/status {action: SUSPEND}, or system auto-suspension when Guard.reliability_score < 50 after any recompute"
        actor: ComplianceOfficer | system
        preconditions: []
        side_effects:
          - "releases every shift of this guard with status IN {SCHEDULED, CONFIRMED} whose scheduled_start_at >= current logical clock: status -> OPEN_UNFILLED, guard_id/pay_rate/post-order pin cleared"
          - "recomputes Guard.committed_hours"
          - "recomputes Site.coverage_status for every site touched by a released shift"
      - from: "employment_status=SUSPENDED"
        to: "employment_status=ACTIVE"
        trigger: "POST /guards/{id}/status {action: REINSTATE}"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "sets Guard.strike_waiver_count = Guard.no_show_count (amnesty snapshot)"
          - "recomputes Guard.reliability_score and Guard.verified_reliability_score — the waiver lifts the score back above the suspension threshold"
      - from: "employment_status IN {ACTIVE, SUSPENDED}"
        to: "employment_status=TERMINATED"
        trigger: "POST /guards/{id}/status {action: TERMINATE}"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "releases every shift of this guard with status IN {SCHEDULED, CONFIRMED} whose scheduled_start_at >= current logical clock back to OPEN_UNFILLED"
          - "recomputes Guard.committed_hours and Site.coverage_status"
      - from: "license_status=UNLICENSED"
        to: "license_status=PENDING_VERIFICATION"
        trigger: "POST /credentials {kind: LICENSE}"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "recomputes Guard.license_status (calculation guard_license_status)"
      - from: "license_status=PENDING_VERIFICATION"
        to: "license_status=LICENSED"
        trigger: "POST /credentials/{id}/verify on a LICENSE credential"
        actor: ComplianceOfficer
        preconditions:
          - "Credential.status == PENDING_VERIFICATION (else ERR_INVALID_STATE)"
          - "Credential.expires_at > current logical clock (else ERR_INVALID_STATE)"
        side_effects:
          - "Credential.status -> VERIFIED, Credential.verified_by_user_id = X-User-ID"
          - "recomputes Guard.license_status"
      - from: "license_status=LICENSED"
        to: "license_status=EXPIRED"
        trigger: "POST /compliance-sweeps (system sweep: LICENSE credential with expires_at <= current logical clock)"
        actor: ComplianceOfficer
        preconditions:
          - "Credential.status == VERIFIED and Credential.expires_at <= current logical clock"
        side_effects:
          - "CASCADE HOP 1: Credential.status VERIFIED -> EXPIRED"
          - "CASCADE HOP 2: the expired credential forces a recompute of Guard.license_status, which becomes EXPIRED"
          - "CASCADE HOP 3: the changed license_status releases every shift of this guard with status IN {SCHEDULED, CONFIRMED} and scheduled_start_at >= current clock to OPEN_UNFILLED (guard_id, pay_rate and post-order pin cleared), and recomputes Guard.committed_hours"
          - "CASCADE HOP 4: each released shift forces a recompute of Site.coverage_status, flipping the site to AT_RISK when the released shift starts within 48h of the current clock"
      - from: "license_status=EXPIRED"
        to: "license_status=LICENSED"
        trigger: "POST /credentials/{id}/verify on a fresh LICENSE credential with a future expires_at"
        actor: ComplianceOfficer
        preconditions:
          - "the new Credential has status == PENDING_VERIFICATION and expires_at > current logical clock"
        side_effects:
          - "recomputes Guard.license_status back to LICENSED"
        note: "Cycle edge on the license dimension: LICENSED -> EXPIRED -> LICENSED."

  - entity: IncidentReport
    initial_state: DRAFT
    terminal_states: [CLOSED]
    shape: branching_with_cycles
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /incidents/{id}/actions {action: SUBMIT}"
        actor: Guard
        preconditions:
          - "X-User-ID == CoverageShift.guard_id of IncidentReport.shift_id (else ERR_NOT_SHIFT_OWNER)"
          - "the referenced CoverageShift.status IN {IN_PROGRESS, COMPLETED, VERIFIED} (else ERR_INVALID_STATE)"
        side_effects: []
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /incidents/{id}/actions {action: REVIEW}"
        actor: FieldSupervisor
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: ESCALATED
        trigger: "POST /incidents/{id}/actions {action: ESCALATE}"
        actor: FieldSupervisor
        preconditions:
          - "IncidentReport.severity IN {HIGH, CRITICAL} (else ERR_INVALID_STATE)"
        side_effects:
          - "increments IncidentReport.escalation_level by 1"
          - "sets IncidentReport.escalated_by_user_id = X-User-ID (the segregation-of-duties anchor for CLOSE)"
      - from: ESCALATED
        to: UNDER_REVIEW
        trigger: "POST /incidents/{id}/actions {action: REVIEW}"
        actor: FieldSupervisor
        preconditions: []
        side_effects: []
        note: "Cycle edge: an escalated incident can be pulled back into review and escalated again, incrementing escalation_level."
      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /incidents/{id}/actions {action: REQUEST_INFO}"
        actor: FieldSupervisor
        preconditions: []
        side_effects: []
      - from: INFO_REQUESTED
        to: SUBMITTED
        trigger: "POST /incidents/{id}/actions {action: SUBMIT}"
        actor: Guard
        preconditions:
          - "X-User-ID == CoverageShift.guard_id of IncidentReport.shift_id (else ERR_NOT_SHIFT_OWNER)"
        side_effects: []
        note: "Cycle edge: SUBMITTED -> UNDER_REVIEW -> INFO_REQUESTED -> SUBMITTED."
      - from: UNDER_REVIEW
        to: RESOLVED
        trigger: "POST /incidents/{id}/actions {action: RESOLVE, note: ...}"
        actor: FieldSupervisor
        preconditions:
          - "payload note is a non-empty string (else ERR_VALIDATION)"
        side_effects:
          - "sets IncidentReport.resolution_note = payload note"
      - from: ESCALATED
        to: RESOLVED
        trigger: "POST /incidents/{id}/actions {action: RESOLVE, note: ...}"
        actor: FieldSupervisor
        preconditions:
          - "payload note is a non-empty string (else ERR_VALIDATION)"
        side_effects:
          - "sets IncidentReport.resolution_note = payload note"
      - from: RESOLVED
        to: CLOSED
        trigger: "POST /incidents/{id}/actions {action: CLOSE}"
        actor: FieldSupervisor
        preconditions:
          - "if IncidentReport.escalated_by_user_id is not null, X-User-ID != IncidentReport.escalated_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "sets IncidentReport.closed_by_user_id = X-User-ID"

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [PAID, VOID]
    shape: cyclic
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /invoices/{id}/actions {action: ISSUE}"
        actor: AccountManager
        preconditions:
          - "the invoice has >= 1 InvoiceLine (else ERR_INVOICE_NO_BILLABLE_SHIFTS)"
          - "Invoice.margin_pct >= Client.margin_floor_pct (else ERR_MARGIN_BELOW_FLOOR)"
        side_effects:
          - "recomputes subtotal_cents, admin_fee_pct, admin_fee_cents, total_cents, pay_cost_cents and margin_pct (calculation invoice_total)"
          - "sets Invoice.issued_at = current logical clock"
          - "recomputes Client.outstanding_balance_cents and Client.paid_to_date_cents (calculation client_balances)"
      - from: ADJUSTED
        to: ISSUED
        trigger: "POST /invoices/{id}/actions {action: ISSUE} (re-issue after credit)"
        actor: AccountManager
        preconditions:
          - "the invoice has >= 1 InvoiceLine (else ERR_INVOICE_NO_BILLABLE_SHIFTS)"
          - "Invoice.margin_pct >= Client.margin_floor_pct (else ERR_MARGIN_BELOW_FLOOR)"
        side_effects:
          - "same as DRAFT -> ISSUED"
        note: "Cycle edge: ISSUED -> DISPUTED -> ADJUSTED -> ISSUED."
      - from: ISSUED
        to: DISPUTED
        trigger: "POST /invoices/{id}/actions {action: DISPUTE, dispute_reason: ...}"
        actor: AccountManager
        preconditions:
          - "payload dispute_reason is a non-empty string (else ERR_VALIDATION)"
        side_effects:
          - "sets Invoice.dispute_reason"
          - "recomputes Client.outstanding_balance_cents (DISPUTED invoices remain outstanding)"
      - from: DISPUTED
        to: ADJUSTED
        trigger: "POST /invoices/{id}/actions {action: CREDIT, line_id: ..., credit_cents: ...}"
        actor: AccountManager
        preconditions:
          - "the referenced InvoiceLine belongs to this invoice (else ERR_INVOICE_LINE_NOT_FOUND)"
          - "1 <= credit_cents <= InvoiceLine.amount_cents (else ERR_CREDIT_EXCEEDS_LINE)"
        side_effects:
          - "CASCADE HOP 1: InvoiceLine.credit_cents += credit_cents, and InvoiceLine.amount_cents = gross_amount_cents - credit_cents"
          - "CASCADE HOP 2: the changed line amount forces a recompute of Invoice.subtotal_cents, which re-selects Invoice.admin_fee_pct from the subtotal tier, recomputes admin_fee_cents, total_cents and margin_pct (calculation invoice_total)"
          - "CASCADE HOP 3: the changed Invoice.total_cents forces a recompute of Client.outstanding_balance_cents"
      - from: ISSUED
        to: PAID
        trigger: "POST /invoices/{id}/actions {action: PAY}"
        actor: AccountManager
        preconditions: []
        side_effects:
          - "recomputes Client.outstanding_balance_cents (drops this invoice) and Client.paid_to_date_cents (gains this invoice's total_cents)"
      - from: DRAFT
        to: VOID
        trigger: "POST /invoices/{id}/actions {action: VOID}"
        actor: AccountManager
        preconditions: []
        side_effects:
          - "recomputes Client.outstanding_balance_cents and Client.paid_to_date_cents"
          - "releases the invoice's shifts back into the eligible pool for a future invoice"
      - from: ISSUED
        to: VOID
        trigger: "POST /invoices/{id}/actions {action: VOID}"
        actor: AccountManager
        preconditions: []
        side_effects:
          - "recomputes Client.outstanding_balance_cents — the compensating half of the ISSUE/VOID money invariant, restoring the pre-issue balance exactly"
          - "releases the invoice's shifts back into the eligible pool"
      - from: DISPUTED
        to: VOID
        trigger: "POST /invoices/{id}/actions {action: VOID}"
        actor: AccountManager
        preconditions: []
        side_effects:
          - "recomputes Client.outstanding_balance_cents and releases the invoice's shifts"
      - from: ADJUSTED
        to: VOID
        trigger: "POST /invoices/{id}/actions {action: VOID}"
        actor: AccountManager
        preconditions: []
        side_effects:
          - "recomputes Client.outstanding_balance_cents and releases the invoice's shifts"

  - entity: PostOrder
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    shape: linear
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /post-orders/{id}/publish"
        actor: AccountManager
        preconditions:
          - "PostOrder.status == DRAFT (else ERR_INVALID_STATE)"
        side_effects:
          - "sets PostOrder.published_at = current logical clock"
          - "any other PostOrder on the same post whose status == PUBLISHED transitions to SUPERSEDED"
          - "CoverageShifts already CONFIRMED keep their pinned_post_order_id / pinned_post_order_version — the pin is NOT rewritten"
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system: another PostOrder on the same post is published"
        actor: system
        preconditions: []
        side_effects:
          - "the superseded document remains readable via GET /post-orders and remains the pinned document of any shift that pinned it"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC only)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: shift-assign-stale-shift
    parent_entity: CoverageShift
    write_endpoint: "POST /shifts/{id}/assignments"
    occ_field: "expected_shift_version"
    description: |
      Assigning a guard to a CoverageShift whose version has advanced since the client last observed
      it is rejected. A CoverageShift already in SCHEDULED may legitimately be reassigned (the new
      assignment supersedes the prior one per the SCHEDULED -> SCHEDULED transition), so a stale
      assignment request cannot be caught by any state precondition — the client's view of the shift
      is simply out of date and the version check is what rejects it.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: post-order-create-stale-post
    parent_entity: Post
    write_endpoint: "POST /post-orders"
    occ_field: "expected_post_version"
    description: |
      Creating a PostOrder against a Post whose version has advanced since the client last observed it
      is rejected. A post legitimately accepts successive post-order revisions (each new publication
      supersedes the prior document), so a second create against a stale post version is not blocked
      by any state precondition — the version check is what rejects it.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: shift_scheduled_hours
    trigger: "POST /shifts (creation); re-read on every shift response"
    algorithm: aggregation
    formula: |
      raw_hours = (scheduled_end_at - scheduled_start_at) / 3600 seconds
      scheduled_hours = round_half_up(raw_hours - planned_break_minutes / 60, 2)
    input_set: "the shift's own scheduled interval and planned_break_minutes"
    constants: {}
    precision: "2 decimal places, round_half_up"

  - name: shift_billable_amount
    trigger: "PROVISIONAL on POST /shifts (creation); FINAL on POST /shifts/{id}/clock-out"
    algorithm: threshold
    formula: |
      # ---- variant PROVISIONAL (client-facing estimate, computed at shift creation) ----
      provisional_billable_cents = round_half_up(scheduled_hours * bill_rate_cents_per_hour)
      # no quarter-hour ceiling, no overrun cap, no SLA credit

      # ---- variant FINAL (computed at clock-out) ----
      raw_worked = (actual_clock_out_at - actual_clock_in_at) / 3600 - planned_break_minutes / 60
      # BILLING rounds UP to the quarter hour (client is billed the started quarter):
      ceiled = ceil(raw_worked / BILLING_INCREMENT_HOURS) * BILLING_INCREMENT_HOURS
      billable_hours = round_half_up(min(ceiled, scheduled_hours + OVERRUN_GRACE_HOURS), 2)
      base_cents = round_half_up(billable_hours * bill_rate_cents_per_hour)
      if tour_compliance_pct < Post.tour_compliance_floor_pct:
          sla_credit_cents = round_half_up(base_cents * SLA_CREDIT_PCT / 100)
      else:
          sla_credit_cents = 0
      final_billable_cents = base_cents - sla_credit_cents
      # Rounding order is pinned: round the HOURS first (to 2dp), then multiply by the rate and
      # round the CENTS. Never multiply un-rounded hours by the rate.
    input_set: "the shift itself; tour_compliance_pct from calculation tour_compliance; rates snapshotted on the shift row, never re-read from Post"
    constants:
      BILLING_INCREMENT_HOURS: 0.25
      OVERRUN_GRACE_HOURS: 0.5
      SLA_CREDIT_PCT: 10.0
    precision: "hours to 2 decimal places; cents are integers, round_half_up"
    variants:
      - name: PROVISIONAL
        when: "at shift creation, from scheduled_hours only"
        difference: "uses scheduled hours with no quarter-hour ceiling, no overrun cap and no SLA credit; a shift that runs 12 minutes long and misses a checkpoint therefore bills a different amount than its provisional estimate"
      - name: FINAL
        when: "at clock-out, from actual clocked hours"
        difference: "ceils actual hours to the quarter hour, caps at scheduled_hours + 0.5h, then deducts a 10% SLA credit when tour compliance falls below the post's floor"

  - name: guard_weekly_pay
    trigger: "POST /shifts/{id}/clock-out (recomputes the whole week for that guard); GET /guards/{id}/payroll-summary (read-only recompute)"
    algorithm: chronological
    formula: |
      # ISO week window: Monday 00:00:00Z inclusive -> the following Monday 00:00:00Z exclusive,
      # keyed on the shift's scheduled_start_at (NOT on actual_clock_in_at).
      week_shifts = [s for s in Guard's shifts
                     if s.status IN {COMPLETED, VERIFIED}
                     and week_start <= s.scheduled_start_at < week_start + 7 days]
      sort week_shifts by (scheduled_start_at ASC, created_at ASC)

      prior_hours = 0.0
      weekly_pay_cents = 0
      for s in week_shifts:
          raw_worked = (s.actual_clock_out_at - s.actual_clock_in_at) / 3600 - s.planned_break_minutes / 60
          # PAY rounds HALF-UP to the quarter hour (billing ceils — the two diverge on purpose):
          s.paid_hours = round_half_up(raw_worked / PAY_INCREMENT_HOURS) * PAY_INCREMENT_HOURS

          hour_utc = UTC hour component of s.scheduled_start_at
          if hour_utc >= NIGHT_START_HOUR_UTC or hour_utc < NIGHT_END_HOUR_UTC:
              effective_rate = round_half_up(s.pay_rate_cents_per_hour * NIGHT_DIFF_MULTIPLIER)
          else:
              effective_rate = s.pay_rate_cents_per_hour

          regular_hours = max(0.0, min(s.paid_hours, OT_WEEKLY_THRESHOLD_HOURS - prior_hours))
          s.overtime_hours = round_half_up(s.paid_hours - regular_hours, 2)
          s.pay_cents = round_half_up(regular_hours * effective_rate) \
                      + round_half_up(s.overtime_hours * effective_rate * OT_MULTIPLIER)
          prior_hours = prior_hours + s.paid_hours
          weekly_pay_cents = weekly_pay_cents + s.pay_cents   # per-shift round, THEN sum
    input_set: "the guard's COMPLETED and VERIFIED shifts whose scheduled_start_at falls in the ISO week; IN_PROGRESS, NO_SHOW, CANCELLED, SCHEDULED and OPEN_UNFILLED shifts are excluded"
    constants:
      PAY_INCREMENT_HOURS: 0.25
      OT_WEEKLY_THRESHOLD_HOURS: 40.0
      OT_MULTIPLIER: 1.5
      NIGHT_DIFF_MULTIPLIER: 1.10
      NIGHT_START_HOUR_UTC: 22
      NIGHT_END_HOUR_UTC: 6
    precision: "hours to 2 decimal places; cents are integers, round_half_up; the effective night rate is rounded to whole cents BEFORE being multiplied by hours"
    note: >-
      Combinatorial mode (a): four interacting inputs (paid hours, prior weekly accumulator, night-window
      flag, overtime multiplier) with nested min/max and a conditional rate branch. The 40.00h threshold is
      strict: regular hours are consumed only while prior_hours < 40.00, and a shift straddling the
      threshold splits into regular + overtime portions.

  - name: guard_reliability_score
    trigger: "recomputed on shift clock-in, clock-out, NO_SHOW, VERIFY, and on guard REINSTATE"
    algorithm: weighted_scoring
    formula: |
      # counts are taken over an input set that DIFFERS by variant (see variants below)
      effective_no_shows = max(0, no_show_count - strike_waiver_count)
      score = 100
             - NO_SHOW_PENALTY        * effective_no_shows
             - LATE_PENALTY           * late_clock_in_count
             - MISSED_CHECKPOINT_PENALTY * missed_checkpoint_count
      score = round_half_up(max(0.0, min(100.0, score)), 2)

      # Auto-suspension gate (applies to the PROVISIONAL variant only):
      if reliability_score < SUSPENSION_SCORE_THRESHOLD and Guard.employment_status == ACTIVE:
          suspend the guard (Guard ACTIVE -> SUSPENDED, with its release cascade)
      # Boundary is strict: a score of exactly 50.00 does NOT suspend.
    input_set: "PROVISIONAL counts shifts with status IN {IN_PROGRESS, COMPLETED, VERIFIED, NO_SHOW}; CONFIRMED counts shifts with status IN {VERIFIED, NO_SHOW} only"
    constants:
      NO_SHOW_PENALTY: 30
      LATE_PENALTY: 5
      MISSED_CHECKPOINT_PENALTY: 2
      SUSPENSION_SCORE_THRESHOLD: 50
    precision: "2 decimal places, round_half_up; floored at 0.0 and capped at 100.0"
    variants:
      - name: PROVISIONAL
        when: "stored in Guard.reliability_score; drives the auto-suspension gate"
        difference: "includes lateness and missed checkpoints from shifts that are merely IN_PROGRESS or COMPLETED but not yet supervisor-VERIFIED"
      - name: CONFIRMED
        when: "stored in Guard.verified_reliability_score; used for reporting only, never for suspension"
        difference: "ignores COMPLETED-but-unverified and IN_PROGRESS shifts entirely, so a guard who missed checkpoints on a completed-but-unverified shift has a strictly higher verified_reliability_score than reliability_score"

  - name: tour_compliance
    trigger: "POST /shifts/{id}/clock-out"
    algorithm: aggregation
    formula: |
      total = len(Post.checkpoint_tag_uids)
      if total == 0:
          tour_compliance_pct = 100.0        # empty-set convention: a post with no tour is fully compliant
          missed_on_this_shift = 0
      else:
          distinct_scanned = count of distinct TourScan.checkpoint_tag_uid values
                             for TourScan rows with shift_id == this shift
          tour_compliance_pct = round_half_up(100.0 * distinct_scanned / total, 2)
          missed_on_this_shift = total - distinct_scanned
    input_set: "all TourScan rows on this shift (duplicates collapse to one distinct tag); the post's checkpoint_tag_uids list snapshot at read time"
    constants: {}
    precision: "2 decimal places, round_half_up"

  - name: invoice_total
    trigger: "POST /invoices (line generation); POST /invoices/{id}/actions {ISSUE | CREDIT}"
    algorithm: tiered_pricing
    formula: |
      # EVALUATION ORDER IS PINNED — the fee tier is keyed on the SUBTOTAL, never on the total.
      # (A naive reading — 'total = subtotal + fee, fee = tier(total) * subtotal' — is circular;
      #  this scaffold resolves it by fixing the tier lookup on subtotal_cents.)
      # step 1: per-line amounts (integers already; no rounding happens at line level)
      for line in invoice.lines:
          line.amount_cents = line.gross_amount_cents - line.credit_cents
      # step 2: subtotal
      subtotal_cents = sum(line.amount_cents for line in invoice.lines)
      # step 3: tier lookup on subtotal_cents
      if   subtotal_cents <  150000: admin_fee_pct = 8.0
      elif subtotal_cents <  500000: admin_fee_pct = 5.0
      else:                          admin_fee_pct = 3.0
      # step 4: fee, rounded once
      admin_fee_cents = round_half_up(subtotal_cents * admin_fee_pct / 100)
      # step 5: total
      total_cents = subtotal_cents + admin_fee_cents
      # step 6: margin over payroll cost
      pay_cost_cents = sum(line.pay_cost_cents for line in invoice.lines)
      margin_pct = 0.0 if subtotal_cents == 0 else \
                   round_half_up(100.0 * (subtotal_cents - pay_cost_cents) / subtotal_cents, 2)
    input_set: >-
      Lines are generated at POST /invoices from CoverageShifts with status == VERIFIED whose post belongs
      to a Site of this Client, whose scheduled_start_at falls in [period_start, period_end), and which are
      not already carried by an InvoiceLine on an invoice whose status != VOID. Lines are created in
      (scheduled_start_at ASC, created_at ASC) order.
    constants:
      ADMIN_FEE_TIER_1_MAX_CENTS: 150000
      ADMIN_FEE_TIER_1_PCT: 8.0
      ADMIN_FEE_TIER_2_MAX_CENTS: 500000
      ADMIN_FEE_TIER_2_PCT: 5.0
      ADMIN_FEE_TIER_3_PCT: 3.0
    precision: "cents are integers; admin_fee_cents rounded half-up once; margin_pct to 2 decimal places"
    note: >-
      Combinatorial mode (c): circular-looking dependency between total and fee, resolved by pinning the
      tier lookup on subtotal_cents. Because the tiers are descending, a credit that lowers the subtotal
      across a tier boundary can RAISE admin_fee_cents while lowering total_cents.

  - name: client_balances
    trigger: "every Invoice transition (ISSUE, DISPUTE, CREDIT, PAY, VOID)"
    algorithm: aggregation
    formula: |
      outstanding_balance_cents = sum(i.total_cents for i in Client's invoices
                                      if i.status IN {ISSUED, DISPUTED, ADJUSTED})
      paid_to_date_cents        = sum(i.total_cents for i in Client's invoices
                                      if i.status == PAID)
      # Conserved quantity (money):
      #   outstanding_balance_cents + paid_to_date_cents
      #     == sum(i.total_cents for i in Client's invoices if i.status IN {ISSUED, DISPUTED, ADJUSTED, PAID})
      # ISSUE followed by VOID on the same invoice therefore restores both fields exactly.
    input_set: "the client's invoices, filtered by the status sets above; DRAFT and VOID invoices contribute nothing"
    constants: {}
    precision: "integer cents"

  - name: guard_committed_hours
    trigger: "shift assignment, unassignment, cancellation, no-show, clock-out, guard suspension/termination, compliance sweep"
    algorithm: aggregation
    formula: |
      committed_hours = round_half_up(
          sum(s.scheduled_hours for s in Guard's shifts
              if s.status IN {SCHEDULED, CONFIRMED, IN_PROGRESS}), 2)
      # Conserved quantity (committed labour hours):
      #   an assignment followed by its compensating unassignment on the same shift returns
      #   committed_hours to its exact pre-assignment value, and leaves the shift back in
      #   OPEN_UNFILLED with guard_id == null and pay_rate_cents_per_hour == null.
    input_set: "the guard's shifts with status IN {SCHEDULED, CONFIRMED, IN_PROGRESS}; OPEN_UNFILLED, COMPLETED, VERIFIED, NO_SHOW and CANCELLED shifts are excluded"
    constants: {}
    precision: "2 decimal places, round_half_up"

  - name: site_coverage_status
    trigger: "any CoverageShift create/assign/unassign/status transition on a post of the site; POST /compliance-sweeps"
    algorithm: threshold
    formula: |
      gap_exists = any(s.status == OPEN_UNFILLED
                       and current_utc <= s.scheduled_start_at < current_utc + AT_RISK_WINDOW_HOURS hours
                       for s in shifts on posts of this site)
      coverage_status = AT_RISK if gap_exists else COVERED
    input_set: "shifts on all posts of the site with status == OPEN_UNFILLED; shifts starting in the past or more than 48h out are ignored"
    constants:
      AT_RISK_WINDOW_HOURS: 48
    precision: "n/a (enum)"

  - name: guard_license_status
    trigger: "POST /credentials (kind LICENSE); POST /credentials/{id}/verify; POST /compliance-sweeps"
    algorithm: projection
    formula: |
      licenses = [c for c in Guard's credentials if c.kind == LICENSE]
      if any(c.status == VERIFIED and c.expires_at > current_utc for c in licenses):
          license_status = LICENSED
      elif any(c.status == PENDING_VERIFICATION for c in licenses):
          license_status = PENDING_VERIFICATION
      elif any(c.status == EXPIRED for c in licenses):
          license_status = EXPIRED
      else:
          license_status = UNLICENSED
      # Deliberate design pin: this projection runs ONLY on the three triggers above. A VERIFIED
      # license whose expires_at has passed but which no compliance sweep has touched still yields
      # LICENSED — expiry is swept, never lazily evaluated on read.
    input_set: "the guard's LICENSE credentials; CERTIFICATION credentials never affect license_status"
    constants: {}
    precision: "n/a (enum)"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "The acting role is permitted for this endpoint and, on the multi-action endpoints, for the specific action value (CONFIRM/UNASSIGN/CANCEL: Scheduler, plus Guard for CONFIRM; NO_SHOW/VERIFY: FieldSupervisor; SUBMIT: Guard; REVIEW/ESCALATE/REQUEST_INFO/RESOLVE/CLOSE: FieldSupervisor; all invoice actions: AccountManager)"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: business_constraint
    check: "Request body/query schema: required fields present, enum members valid, integers/numbers in range, scheduled_end_at > scheduled_start_at, period_end > period_start, limit in [1,100], offset >= 0, non-empty narrative/note/dispute_reason"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: all

  - priority: 4
    category: existence
    check: "Every referenced id (path first, then body, left-to-right in declaration order) resolves to an existing resource"
    error_id: ERR_CLIENT_NOT_FOUND | ERR_SITE_NOT_FOUND | ERR_POST_NOT_FOUND | ERR_POST_ORDER_NOT_FOUND | ERR_GUARD_NOT_FOUND | ERR_CREDENTIAL_NOT_FOUND | ERR_SHIFT_NOT_FOUND | ERR_INCIDENT_NOT_FOUND | ERR_INVOICE_NOT_FOUND | ERR_INVOICE_LINE_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 5
    category: business_referential
    check: "When the acting role is Guard, X-User-ID equals the guard_id of the shift being clocked/scanned/reported on (or the guard_id of the incident's shift)"
    error_id: ERR_NOT_SHIFT_OWNER
    http_status: 403
    applies_to: "POST /shifts/{id}/actions (action CONFIRM by a Guard), POST /shifts/{id}/clock-in, POST /shifts/{id}/clock-out, POST /shifts/{id}/scans, POST /incidents, POST /incidents/{id}/actions (action SUBMIT)"

  - priority: 6
    category: state
    check: "expected_shift_version / expected_post_version equals the current version of the parent entity"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /shifts/{id}/assignments, POST /post-orders"

  - priority: 7
    category: state
    check: "The target resource's current status admits the requested transition (see §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /shifts/{id}/assignments, POST /shifts/{id}/actions, POST /shifts/{id}/clock-in, POST /shifts/{id}/clock-out, POST /shifts/{id}/scans, POST /post-orders/{id}/publish, POST /credentials/{id}/verify, POST /guards/{id}/status, POST /incidents/{id}/actions, POST /invoices/{id}/actions"

  - priority: 8
    category: state
    check: "The shift has an assigned guard when the action requires one (CONFIRM, UNASSIGN, NO_SHOW)"
    error_id: ERR_SHIFT_NOT_ASSIGNED
    http_status: 409
    applies_to: "POST /shifts/{id}/actions"

  - priority: 9
    category: business_safety
    check: "Guard.employment_status == ACTIVE"
    error_id: ERR_GUARD_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /shifts/{id}/assignments, POST /shifts/{id}/actions (CONFIRM), POST /shifts/{id}/clock-in"

  - priority: 10
    category: business_safety
    check: "Guard.license_status == LICENSED"
    error_id: ERR_GUARD_NOT_LICENSED
    http_status: 409
    applies_to: "POST /shifts/{id}/assignments, POST /shifts/{id}/actions (CONFIRM), POST /shifts/{id}/clock-in, POST /guards/{id}/status (ACTIVATE)"

  - priority: 11
    category: business_safety
    check: "Guard holds a VERIFIED, unexpired CERTIFICATION credential for every code in Post.required_cert_codes"
    error_id: ERR_GUARD_CERT_MISSING
    http_status: 409
    applies_to: "POST /shifts/{id}/assignments, POST /shifts/{id}/actions (CONFIRM)"

  - priority: 12
    category: business_safety
    check: "The shift's post has a PostOrder with status == PUBLISHED at CONFIRM time"
    error_id: ERR_POST_ORDER_NOT_PUBLISHED
    http_status: 409
    applies_to: "POST /shifts/{id}/actions (CONFIRM)"

  - priority: 13
    category: business_referential
    check: "The scanned checkpoint_tag_uid is a member of the shift's Post.checkpoint_tag_uids"
    error_id: ERR_UNKNOWN_CHECKPOINT_TAG
    http_status: 422
    applies_to: "POST /shifts/{id}/scans"

  - priority: 14
    category: business_temporal
    check: "The guard has no other shift (status NOT IN {CANCELLED, NO_SHOW}) whose half-open interval [scheduled_start_at, scheduled_end_at) strictly intersects this shift's interval; touching endpoints (end == start) do NOT intersect"
    error_id: ERR_GUARD_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /shifts/{id}/assignments"

  - priority: 15
    category: business_temporal
    check: "The guard has no other shift (status NOT IN {CANCELLED, NO_SHOW}) intersecting this shift's interval widened by REST_BUFFER_MINUTES=480 at both ends — i.e. at least 8 hours of rest must separate the two intervals; exactly 480 minutes of gap is compliant, 479 is not"
    error_id: ERR_GUARD_REST_PERIOD_VIOLATION
    http_status: 409
    applies_to: "POST /shifts/{id}/assignments"

  - priority: 16
    category: business_temporal
    check: "The count of existing shifts on this post with status NOT IN {CANCELLED, NO_SHOW} whose half-open interval strictly intersects the new shift's interval — excluding the shift named by relief_for_shift_id — is < Post.max_concurrent_guards; adjacency (end == start) is allowed with zero buffer"
    error_id: ERR_POST_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /shifts"

  - priority: 17
    category: business_constraint
    check: "Guard.employee_code is unique across all guards"
    error_id: ERR_DUPLICATE_EMPLOYEE_CODE
    http_status: 409
    applies_to: "POST /guards"

  - priority: 18
    category: business_constraint
    check: "The FieldSupervisor closing an escalated incident (X-User-ID) is not the same operator who escalated it (IncidentReport.escalated_by_user_id)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /incidents/{id}/actions (action CLOSE)"

  - priority: 19
    category: business_fiscal
    check: "The invoice carries at least one InvoiceLine"
    error_id: ERR_INVOICE_NO_BILLABLE_SHIFTS
    http_status: 422
    applies_to: "POST /invoices/{id}/actions (action ISSUE)"

  - priority: 20
    category: business_fiscal
    check: "1 <= credit_cents <= InvoiceLine.amount_cents"
    error_id: ERR_CREDIT_EXCEEDS_LINE
    http_status: 422
    applies_to: "POST /invoices/{id}/actions (action CREDIT)"

  - priority: 21
    category: business_fiscal
    check: "Invoice.margin_pct >= Client.margin_floor_pct (>= is inclusive: exactly the floor passes)"
    error_id: ERR_MARGIN_BELOW_FLOOR
    http_status: 422
    applies_to: "POST /invoices/{id}/actions (action ISSUE)"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  - method: POST
    path: "/clients"
    description: "Register a contracting client."
    roles: [AccountManager]
    code: 201
    input: [name, "margin_floor_pct?"]
    output: Client
    side_effects: ["initializes outstanding_balance_cents and paid_to_date_cents to 0"]

  - method: GET
    path: "/clients/{id}"
    description: "Read a client, including the derived outstanding_balance_cents and paid_to_date_cents ledger fields."
    roles: [AccountManager, PlatformAdmin]
    code: 200
    input: []
    output: Client
    side_effects: []

  - method: POST
    path: "/sites"
    description: "Create a guarded site under a client."
    roles: [AccountManager]
    code: 201
    input: [client_id, name]
    output: Site
    side_effects: ["coverage_status initialized to COVERED"]

  - method: GET
    path: "/sites"
    description: "List sites, optionally filtered by client."
    roles: [AccountManager, Scheduler, FieldSupervisor, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["client_id?", "coverage_status?", "limit?", "offset?"]
    output: Site[]
    side_effects: []
  - method: GET
    path: "/sites/{id}"
    description: "Read one site, including its derived coverage_status."
    roles: [AccountManager, Scheduler, FieldSupervisor, ComplianceOfficer, Guard, PlatformAdmin]
    code: 200
    input: []
    output: Site
    side_effects: []

  - method: POST
    path: "/posts"
    description: "Create a guard post at a site, with its bill rate, required certs and NFC checkpoint tour."
    roles: [AccountManager]
    code: 201
    input: [site_id, name, bill_rate_cents_per_hour, "max_concurrent_guards?", "required_cert_codes?", "checkpoint_tag_uids?", "tour_compliance_floor_pct?"]
    output: Post
    side_effects: []

  - method: GET
    path: "/posts"
    description: "List posts, optionally filtered by site."
    roles: [AccountManager, Scheduler, FieldSupervisor, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["site_id?", "limit?", "offset?"]
    output: Post[]
    side_effects: []
  - method: GET
    path: "/posts/{id}"
    description: "Read one guard post, including its bill rate, required certs and NFC checkpoint tour."
    roles: [AccountManager, Scheduler, FieldSupervisor, ComplianceOfficer, Guard, PlatformAdmin]
    code: 200
    input: []
    output: Post
    side_effects: []

  - method: POST
    path: "/post-orders"
    description: "Draft a post-order revision for a post. Requires the client's last observed Post.version (OCC)."
    roles: [AccountManager]
    code: 201
    input: [post_id, expected_post_version, body_text, revision_label]
    output: PostOrder
    side_effects:
      - "increments Post.version by 1"
      - "creates the PostOrder in DRAFT"

  - method: POST
    path: "/post-orders/{id}/publish"
    description: "Publish a drafted post order; the previously PUBLISHED document on the same post becomes SUPERSEDED."
    roles: [AccountManager]
    code: 200
    input: []
    output: PostOrder
    side_effects:
      - "PostOrder DRAFT -> PUBLISHED, published_at stamped from the logical clock"
      - "any other PUBLISHED PostOrder on the same post -> SUPERSEDED"
      - "already-CONFIRMED shifts keep their pinned_post_order_id / pinned_post_order_version"

  - method: GET
    path: "/post-orders"
    description: "List post orders, optionally filtered by post and status."
    roles: [AccountManager, Scheduler, FieldSupervisor, Guard, PlatformAdmin]
    code: 200
    input: ["post_id?", "status?", "limit?", "offset?"]
    output: PostOrder[]
    side_effects: []
  - method: GET
    path: "/post-orders/{id}"
    description: "Read one post-order document."
    roles: [AccountManager, Scheduler, FieldSupervisor, ComplianceOfficer, Guard, PlatformAdmin]
    code: 200
    input: []
    output: PostOrder
    side_effects: []

  - method: POST
    path: "/guards"
    description: "Create a guard record (employment_status APPLICANT, license_status UNLICENSED)."
    roles: [ComplianceOfficer]
    code: 201
    input: [full_name, employee_code, pay_rate_cents_per_hour]
    output: Guard
    side_effects: ["reliability_score and verified_reliability_score initialized to 100.0"]

  - method: GET
    path: "/guards/{id}"
    description: "Read a guard, including both state dimensions, the two reliability scores and committed_hours."
    roles: [ComplianceOfficer, Scheduler, FieldSupervisor, AccountManager, Guard, PlatformAdmin]
    code: 200
    input: []
    output: Guard
    side_effects: []

  - method: POST
    path: "/guards/{id}/status"
    description: "Drive the guard's employment dimension: ACTIVATE, SUSPEND, REINSTATE or TERMINATE."
    roles: [ComplianceOfficer]
    code: 200
    input: [action]
    output: Guard
    side_effects:
      - "SUSPEND/TERMINATE release the guard's future SCHEDULED and CONFIRMED shifts to OPEN_UNFILLED and recompute Guard.committed_hours and Site.coverage_status"
      - "REINSTATE sets strike_waiver_count = no_show_count and recomputes both reliability scores"

  - method: GET
    path: "/guards/{id}/payroll-summary"
    description: "Recompute and return the guard's weekly payroll for the ISO week containing week_start (Monday 00:00:00Z)."
    roles: [ComplianceOfficer, Scheduler, AccountManager, PlatformAdmin]
    code: 200
    input: [week_start]
    output: { guard_id: string, week_start: datetime, shift_count: integer, total_paid_hours: number, regular_hours: number, overtime_hours: number, weekly_pay_cents: integer }
    side_effects: []

  - method: POST
    path: "/credentials"
    description: "Record a guard license or training certification (status PENDING_VERIFICATION)."
    roles: [ComplianceOfficer]
    code: 201
    input: [guard_id, kind, code, credential_number, expires_at]
    output: Credential
    side_effects: ["recomputes Guard.license_status when kind == LICENSE"]

  - method: POST
    path: "/credentials/{id}/verify"
    description: "Verify a pending credential; an unexpired LICENSE flips the guard's license dimension to LICENSED."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Credential
    side_effects:
      - "Credential PENDING_VERIFICATION -> VERIFIED, verified_by_user_id = X-User-ID"
      - "recomputes Guard.license_status"

  - method: GET
    path: "/credentials"
    description: "List credentials, optionally filtered by guard, kind and status."
    roles: [ComplianceOfficer, Scheduler, FieldSupervisor, PlatformAdmin]
    code: 200
    input: ["guard_id?", "kind?", "status?", "limit?", "offset?"]
    output: Credential[]
    side_effects: []
  - method: GET
    path: "/credentials/{id}"
    description: "Read one licence or certification credential."
    roles: [ComplianceOfficer, Scheduler, FieldSupervisor, PlatformAdmin]
    code: 200
    input: []
    output: Credential
    side_effects: []

  - method: POST
    path: "/compliance-sweeps"
    description: "Run the licensing/certification expiry sweep against the current logical clock. Expires VERIFIED credentials past their expires_at and cascades through license_status, shift release and site coverage."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: { swept_at: datetime, expired_credential_count: integer, unassigned_shift_count: integer, at_risk_site_count: integer }
    side_effects:
      - "Credential VERIFIED -> EXPIRED for every credential with expires_at <= current logical clock"
      - "recomputes Guard.license_status for every affected guard"
      - "releases future SCHEDULED/CONFIRMED shifts of every guard whose license_status left LICENSED"
      - "recomputes Guard.committed_hours and Site.coverage_status for every affected guard and site"

  - method: POST
    path: "/shifts"
    description: "Create a coverage shift on a post (status OPEN_UNFILLED). Pass relief_for_shift_id to create a relief shift for an uncovered shift on the same post."
    roles: [Scheduler]
    code: 201
    input: [post_id, scheduled_start_at, scheduled_end_at, "planned_break_minutes?", "relief_for_shift_id?"]
    output: CoverageShift
    side_effects:
      - "snapshots bill_rate_cents_per_hour from the post"
      - "computes scheduled_hours (calculation shift_scheduled_hours) and provisional_billable_cents (calculation shift_billable_amount, variant PROVISIONAL)"
      - "enforces post aggregate capacity (ERR_POST_CAPACITY_EXCEEDED), excluding relief_for_shift_id from the candidate set"
      - "recomputes Site.coverage_status"

  - method: POST
    path: "/shifts/{id}/assignments"
    description: "Assign (or reassign) a guard to a shift. Requires the client's last observed CoverageShift.version (OCC)."
    roles: [Scheduler]
    code: 200
    input: [guard_id, expected_shift_version]
    output: CoverageShift
    side_effects:
      - "increments CoverageShift.version by 1"
      - "sets guard_id, snapshots pay_rate_cents_per_hour, moves OPEN_UNFILLED -> SCHEDULED (or supersedes the prior assignment from SCHEDULED)"
      - "recomputes Guard.committed_hours for the new guard and for any superseded guard"
      - "recomputes Site.coverage_status"

  - method: POST
    path: "/shifts/{id}/actions"
    description: "Drive the shift lifecycle: CONFIRM, UNASSIGN, NO_SHOW, VERIFY or CANCEL."
    roles: [Scheduler, FieldSupervisor, Guard]
    code: 200
    input: [action]
    output: CoverageShift
    side_effects:
      - "CONFIRM pins the post's PUBLISHED PostOrder id and version onto the shift"
      - "NO_SHOW runs the no-show cascade: guard no_show_count -> reliability_score -> possible auto-suspension -> release of the guard's other future shifts -> site coverage recompute"
      - "VERIFY stamps verified_at and recomputes Guard.verified_reliability_score"
      - "UNASSIGN/CANCEL clear the assignment and recompute Guard.committed_hours and Site.coverage_status"

  - method: POST
    path: "/shifts/{id}/clock-in"
    description: "Guard clocks in at the current logical clock; CONFIRMED -> IN_PROGRESS."
    roles: [Guard]
    code: 200
    input: []
    output: CoverageShift
    side_effects:
      - "stamps actual_clock_in_at from the logical clock"
      - "recomputes Guard.late_clock_in_count and both reliability scores; may auto-suspend the guard"

  - method: POST
    path: "/shifts/{id}/clock-out"
    description: "Guard clocks out; IN_PROGRESS -> COMPLETED. Computes tour compliance, the FINAL billable amount, the weekly-overtime-aware pay and the margin."
    roles: [Guard]
    code: 200
    input: []
    output: CoverageShift
    side_effects:
      - "stamps actual_clock_out_at from the logical clock"
      - "computes tour_compliance_pct (calculation tour_compliance)"
      - "computes billable_hours, sla_credit_cents and final_billable_cents (calculation shift_billable_amount, variant FINAL)"
      - "computes paid_hours, overtime_hours and pay_cents for the whole ISO week (calculation guard_weekly_pay)"
      - "computes margin_cents"
      - "recomputes Guard.missed_checkpoint_count, both reliability scores and Guard.committed_hours"

  - method: POST
    path: "/shifts/{id}/scans"
    description: "Record an NFC checkpoint tap during an in-progress shift."
    roles: [Guard]
    code: 201
    input: [checkpoint_tag_uid]
    output: TourScan
    side_effects:
      - "stamps scanned_at from the logical clock and marks is_duplicate when the tag was already scanned on this shift"

  - method: GET
    path: "/shifts"
    description: "List coverage shifts with filters."
    roles: [Scheduler, FieldSupervisor, AccountManager, ComplianceOfficer, Guard, PlatformAdmin]
    code: 200
    input: ["post_id?", "guard_id?", "relief_for_shift_id?", "pinned_post_order_id?", "status?", "limit?", "offset?"]
    output: CoverageShift[]
    side_effects: []
  - method: GET
    path: "/shifts/{id}"
    description: "Read one coverage shift, including all computed billing, pay, margin and tour-compliance fields."
    roles: [AccountManager, Scheduler, FieldSupervisor, ComplianceOfficer, Guard, PlatformAdmin]
    code: 200
    input: []
    output: CoverageShift
    side_effects: []

  - method: GET
    path: "/scans"
    description: "List NFC tour scans, optionally filtered by shift."
    roles: [Scheduler, FieldSupervisor, AccountManager, Guard, PlatformAdmin]
    code: 200
    input: ["shift_id?", "checkpoint_tag_uid?", "limit?", "offset?"]
    output: TourScan[]
    side_effects: []
  - method: GET
    path: "/scans/{id}"
    description: "Read one NFC tour scan."
    roles: [Scheduler, FieldSupervisor, AccountManager, Guard, PlatformAdmin]
    code: 200
    input: []
    output: TourScan
    side_effects: []

  - method: POST
    path: "/incidents"
    description: "File an incident report against a shift (status DRAFT)."
    roles: [Guard]
    code: 201
    input: [shift_id, severity, narrative]
    output: IncidentReport
    side_effects: []

  - method: POST
    path: "/incidents/{id}/actions"
    description: "Drive the incident lifecycle: SUBMIT, REVIEW, ESCALATE, REQUEST_INFO, RESOLVE or CLOSE."
    roles: [Guard, FieldSupervisor]
    code: 200
    input: [action, "note?"]
    output: IncidentReport
    side_effects:
      - "ESCALATE increments escalation_level and records escalated_by_user_id"
      - "RESOLVE stores the note as resolution_note"
      - "CLOSE records closed_by_user_id and enforces segregation of duties against escalated_by_user_id"

  - method: GET
    path: "/incidents"
    description: "List incident reports, optionally filtered by shift and status."
    roles: [Guard, FieldSupervisor, AccountManager, PlatformAdmin]
    code: 200
    input: ["shift_id?", "status?", "limit?", "offset?"]
    output: IncidentReport[]
    side_effects: []
  - method: GET
    path: "/incidents/{id}"
    description: "Read one incident report."
    roles: [Guard, FieldSupervisor, AccountManager, PlatformAdmin]
    code: 200
    input: []
    output: IncidentReport
    side_effects: []

  - method: POST
    path: "/invoices"
    description: "Open a DRAFT invoice for a client and generate one InvoiceLine per eligible VERIFIED shift in the period."
    roles: [AccountManager]
    code: 201
    input: [client_id, period_start, period_end]
    output: Invoice
    side_effects:
      - "generates InvoiceLines from VERIFIED shifts on the client's posts in [period_start, period_end) not already billed on a non-VOID invoice, ordered by (scheduled_start_at ASC, created_at ASC)"
      - "computes subtotal_cents, admin_fee_pct, admin_fee_cents, total_cents, pay_cost_cents and margin_pct (calculation invoice_total)"

  - method: POST
    path: "/invoices/{id}/actions"
    description: "Drive the invoice lifecycle: ISSUE, DISPUTE, CREDIT, PAY or VOID."
    roles: [AccountManager]
    code: 200
    input: [action, "dispute_reason?", "line_id?", "credit_cents?"]
    output: Invoice
    side_effects:
      - "ISSUE enforces the line-count and margin-floor gates, stamps issued_at and recomputes Client balances"
      - "CREDIT lowers a line's amount, re-selects the admin-fee tier from the new subtotal, recomputes the total and the client's outstanding balance"
      - "PAY/VOID recompute Client.outstanding_balance_cents and Client.paid_to_date_cents"

  - method: GET
    path: "/invoices"
    description: "List invoices, optionally filtered by client and status."
    roles: [AccountManager, PlatformAdmin]
    code: 200
    input: ["client_id?", "status?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []
  - method: GET
    path: "/invoices/{id}"
    description: "Read one invoice, including subtotal, admin fee tier, total, payroll cost and margin."
    roles: [AccountManager, PlatformAdmin]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: GET
    path: "/invoice-lines"
    description: "List invoice lines, optionally filtered by invoice and shift."
    roles: [AccountManager, PlatformAdmin]
    code: 200
    input: ["invoice_id?", "shift_id?", "limit?", "offset?"]
    output: InvoiceLine[]
    side_effects: []
  - method: GET
    path: "/invoice-lines/{id}"
    description: "Read one invoice line."
    roles: [AccountManager, PlatformAdmin]
    code: 200
    input: []
    output: InvoiceLine
    side_effects: []

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical clock. The clock's startup default is exactly 2026-05-01T00:00:00Z and never falls back to real wall-clock time; every timestamp the server stamps (clock-in, clock-out, scans, publication, verification, sweeps, issuance) reads from this logical clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["advances the logical clock; does NOT by itself expire credentials or recompute coverage — run POST /compliance-sweeps for that"]

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or the role is not one of the declared roles"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The acting role is not permitted for this endpoint or for the requested action value"
  - id: ERR_VALIDATION
    http: 422
    condition: "Malformed request: missing required field, invalid enum member, out-of-range number, scheduled_end_at <= scheduled_start_at, period_end <= period_start, limit outside [1,100], empty narrative/note/dispute_reason"
  - id: ERR_CLIENT_NOT_FOUND
    http: 404
    condition: "client_id does not resolve"
  - id: ERR_SITE_NOT_FOUND
    http: 404
    condition: "site_id does not resolve"
  - id: ERR_POST_NOT_FOUND
    http: 404
    condition: "post_id does not resolve"
  - id: ERR_POST_ORDER_NOT_FOUND
    http: 404
    condition: "post-order id in the path does not resolve"
  - id: ERR_GUARD_NOT_FOUND
    http: 404
    condition: "guard_id does not resolve"
  - id: ERR_CREDENTIAL_NOT_FOUND
    http: 404
    condition: "credential id in the path does not resolve"
  - id: ERR_SHIFT_NOT_FOUND
    http: 404
    condition: "shift id in the path, or shift_id / relief_for_shift_id in a body, does not resolve"
  - id: ERR_INCIDENT_NOT_FOUND
    http: 404
    condition: "incident id in the path does not resolve"
  - id: ERR_INVOICE_NOT_FOUND
    http: 404
    condition: "invoice id in the path does not resolve"
  - id: ERR_INVOICE_LINE_NOT_FOUND
    http: 404
    condition: "line_id supplied to a CREDIT action does not resolve, or belongs to a different invoice"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_shift_version != CoverageShift.version on assignment, or expected_post_version != Post.version on post-order creation"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The resource's current status does not admit the requested transition — including NO_SHOW declared before scheduled_start_at + 15 minutes, ESCALATE on a LOW/MEDIUM incident, verifying an already-VERIFIED or expired credential, and scanning on a shift that is not IN_PROGRESS"
  - id: ERR_SHIFT_NOT_ASSIGNED
    http: 409
    condition: "CONFIRM, UNASSIGN or NO_SHOW requested on a shift whose guard_id is null"
  - id: ERR_GUARD_NOT_ACTIVE
    http: 409
    condition: "The guard's employment_status is not ACTIVE at assignment, confirmation or clock-in"
  - id: ERR_GUARD_NOT_LICENSED
    http: 409
    condition: "The guard's license_status is not LICENSED at assignment, confirmation, clock-in, or at ACTIVATE"
  - id: ERR_GUARD_CERT_MISSING
    http: 409
    condition: "The guard lacks a VERIFIED, unexpired CERTIFICATION credential for a code listed in Post.required_cert_codes"
  - id: ERR_POST_ORDER_NOT_PUBLISHED
    http: 409
    condition: "CONFIRM requested on a shift whose post has no PUBLISHED PostOrder"
  - id: ERR_GUARD_DOUBLE_BOOKED
    http: 409
    condition: "The guard's half-open shift interval strictly intersects another of that guard's non-cancelled, non-no-show shifts"
  - id: ERR_GUARD_REST_PERIOD_VIOLATION
    http: 409
    condition: "The guard's shift falls within 480 minutes of another of that guard's non-cancelled, non-no-show shifts (adjacent but under-rested)"
  - id: ERR_POST_CAPACITY_EXCEEDED
    http: 409
    condition: "Creating the shift would put more than Post.max_concurrent_guards non-cancelled shifts on the post at some instant"
  - id: ERR_NOT_SHIFT_OWNER
    http: 403
    condition: "A Guard acts on a shift (confirm, clock-in, clock-out, scan, incident) that is not assigned to them"
  - id: ERR_UNKNOWN_CHECKPOINT_TAG
    http: 422
    condition: "The scanned checkpoint_tag_uid is not one of the post's checkpoint_tag_uids"
  - id: ERR_DUPLICATE_EMPLOYEE_CODE
    http: 409
    condition: "A guard already exists with the supplied employee_code"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The FieldSupervisor closing an escalated incident is the same operator (X-User-ID) who escalated it"
  - id: ERR_INVOICE_NO_BILLABLE_SHIFTS
    http: 422
    condition: "ISSUE requested on an invoice with zero InvoiceLines"
  - id: ERR_CREDIT_EXCEEDS_LINE
    http: 422
    condition: "credit_cents is below 1 or above the line's current amount_cents"
  - id: ERR_MARGIN_BELOW_FLOOR
    http: 422
    condition: "ISSUE requested on an invoice whose margin_pct is strictly below the client's margin_floor_pct"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: AccountManager
    description: "Owns the client-facing surface: clients, sites, posts, post orders and invoices."
    identity: opaque
    exclusive_operations:
      - "POST /clients"
      - "POST /sites"
      - "POST /posts"
      - "POST /post-orders"
      - "POST /post-orders/{id}/publish"
      - "POST /invoices"
      - "POST /invoices/{id}/actions (ISSUE, DISPUTE, CREDIT, PAY, VOID)"
      - "GET /clients/{id}"
      - "GET /invoices"
      - "GET /invoice-lines"
    shared_operations:
      - "GET /sites"
      - "GET /posts"
      - "GET /post-orders"
      - "GET /shifts"
      - "GET /scans"
      - "GET /incidents"
      - "GET /guards/{id}"
      - "GET /guards/{id}/payroll-summary"
      - "GET /sites/{id}"
      - "GET /posts/{id}"
      - "GET /post-orders/{id}"
      - "GET /shifts/{id}"
      - "GET /scans/{id}"
      - "GET /incidents/{id}"
      - "GET /invoices/{id}"
      - "GET /invoice-lines/{id}"

  - name: Scheduler
    description: "Builds the coverage schedule and assigns guards to posts."
    identity: opaque
    exclusive_operations:
      - "POST /shifts"
      - "POST /shifts/{id}/assignments"
      - "POST /shifts/{id}/actions (UNASSIGN, CANCEL)"
    shared_operations:
      - "POST /shifts/{id}/actions (CONFIRM — also allowed to the assigned Guard)"
      - "GET /shifts"
      - "GET /sites"
      - "GET /posts"
      - "GET /post-orders"
      - "GET /guards/{id}"
      - "GET /guards/{id}/payroll-summary"
      - "GET /credentials"
      - "GET /scans"
      - "GET /sites/{id}"
      - "GET /posts/{id}"
      - "GET /post-orders/{id}"
      - "GET /credentials/{id}"
      - "GET /shifts/{id}"
      - "GET /scans/{id}"

  - name: Guard
    description: "The security officer on the ground: confirms, clocks in/out, taps NFC checkpoints, files incidents."
    identity: "entity_backed:Guard"
    exclusive_operations:
      - "POST /shifts/{id}/clock-in"
      - "POST /shifts/{id}/clock-out"
      - "POST /shifts/{id}/scans"
      - "POST /incidents"
      - "POST /incidents/{id}/actions (SUBMIT)"
    shared_operations:
      - "POST /shifts/{id}/actions (CONFIRM — on their own shift only)"
      - "GET /shifts"
      - "GET /shifts/{id}"
      - "GET /scans"
      - "GET /scans/{id}"
      - "GET /incidents"
      - "GET /incidents/{id}"
      - "GET /post-orders"
      - "GET /post-orders/{id}"
      - "GET /guards/{id}"

  - name: FieldSupervisor
    description: "Field oversight: declares no-shows, verifies completed shifts, reviews and escalates incidents."
    identity: opaque
    exclusive_operations:
      - "POST /shifts/{id}/actions (NO_SHOW, VERIFY)"
      - "POST /incidents/{id}/actions (REVIEW, ESCALATE, REQUEST_INFO, RESOLVE, CLOSE)"
    shared_operations:
      - "GET /shifts"
      - "GET /scans"
      - "GET /incidents"
      - "GET /sites"
      - "GET /posts"
      - "GET /post-orders"
      - "GET /credentials"
      - "GET /guards/{id}"
      - "GET /sites/{id}"
      - "GET /posts/{id}"
      - "GET /post-orders/{id}"
      - "GET /credentials/{id}"
      - "GET /shifts/{id}"
      - "GET /scans/{id}"
      - "GET /incidents/{id}"

  - name: ComplianceOfficer
    description: "Owns guard records, licensing, training certifications and the expiry sweep."
    identity: opaque
    exclusive_operations:
      - "POST /guards"
      - "POST /guards/{id}/status"
      - "POST /credentials"
      - "POST /credentials/{id}/verify"
      - "POST /compliance-sweeps"
    shared_operations:
      - "GET /guards/{id}"
      - "GET /guards/{id}/payroll-summary"
      - "GET /credentials"
      - "GET /shifts"
      - "GET /sites"
      - "GET /posts"
      - "GET /sites/{id}"
      - "GET /posts/{id}"
      - "GET /credentials/{id}"
      - "GET /shifts/{id}"

  - name: PlatformAdmin
    description: "Operations role for the logical clock and read-only oversight; holds no business write powers."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET /clients/{id}"
      - "GET /sites"
      - "GET /posts"
      - "GET /post-orders"
      - "GET /guards/{id}"
      - "GET /guards/{id}/payroll-summary"
      - "GET /credentials"
      - "GET /shifts"
      - "GET /scans"
      - "GET /incidents"
      - "GET /invoices"
      - "GET /invoice-lines"
      - "GET /sites/{id}"
      - "GET /posts/{id}"
      - "GET /post-orders/{id}"
      - "GET /credentials/{id}"
      - "GET /shifts/{id}"
      - "GET /scans/{id}"
      - "GET /incidents/{id}"
      - "GET /invoices/{id}"
      - "GET /invoice-lines/{id}"
