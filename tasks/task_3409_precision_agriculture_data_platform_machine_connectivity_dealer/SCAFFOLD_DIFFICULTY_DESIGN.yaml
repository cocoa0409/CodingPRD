          - errors.ERR_MACHINE_POSTURE_BLOCKED
          - endpoints.POST_/agdata/prescriptions/{id}/send-to-machine
        distinguishing_aspect: "Entity pair Prescription -> Machine: the send transition is legal only while the target machine's derived connectivity_posture is CONNECTED; suspending the plan (a DataPlan mutation) blocks the send, resuming it unblocks."
        test_recipe:
          setup:
            - "Fully connected machine; a single-zone APPROVED prescription targeting it (no SECTION_CONTROL license needed for one zone)."
          setup_api_calls:
            - *d_clock
            - *d_org
            - *d_dealer
            - *d_machine
            - *d_prov_begin
            - *d_prov_ok
            - *d_plan_std
            - *d_plan_act
            - *d_mact
            - *d_field
            - *d_field_act
            - *d_rx
            - call: "POST /agdata/prescriptions/${rx_id}/approve"
              payload: {}
              as: GrowerManager
              as_user_id: "${org_id}"
          trigger:
            - call: "POST /agdata/data-plans/${plan_id}/suspend"
              payload: {}
              as: GrowerManager
              as_user_id: "${org_id}"
            - call: "POST /agdata/prescriptions/${rx_id}/send-to-machine"
              payload: {}
              as: GrowerManager
              as_user_id: "${org_id}"
              captures: { error_id: $.data.error_id }
            - call: "POST /agdata/data-plans/${plan_id}/resume"
              payload: {}
              as: GrowerManager
              as_user_id: "${org_id}"
            - call: "POST /agdata/prescriptions/${rx_id}/send-to-machine"
              payload: {}
              as: GrowerManager
              as_user_id: "${org_id}"
              captures: { rx_status: $.data.status }
          assert:
            - "the first send returns 409 and error_id == ERR_MACHINE_POSTURE_BLOCKED (posture PLAN_SUSPENDED)"
            - "the second send succeeds and rx_status == SENT after the plan resumed (posture CONNECTED)"

      - name: session_create_gated_by_ticket_state
        grounds:
          - state_machines.DiagnosticSession
          - state_machines.ConsentTicket
          - endpoints.POST_/agdata/diagnostic-sessions
          - errors.ERR_INVALID_STATE_TRANSITION
        distinguishing_aspect: "Entity pair DiagnosticSession -> ConsentTicket: opening a session requires the ticket to be GRANTED; a REQUESTED (never granted) ticket fails with ERR_INVALID_STATE_TRANSITION and consumes nothing."
        test_recipe:
          setup:
            - "Connected machine; a REMOTE_DIAGNOSTIC ticket in REQUESTED (grower has not responded)."
          setup_api_calls:
            - *d_clock
            - *d_org
            - *d_dealer
            - *d_machine
            - *d_prov_begin
            - *d_prov_ok
            - *d_plan_std
            - *d_plan_act
            - *d_diag_ticket
          trigger:
            - call: "POST /agdata/diagnostic-sessions"
              payload: { machine_id: "${machine_id}", consent_ticket_id: "${dticket_id}" }
              as: DealerTechnician
              as_user_id: "${dealer_id}"
              captures: { error_id: $.data.error_id }
            - call: "GET /agdata/diagnostic-sessions"
              payload: { machine_id: "${machine_id}" }
              as: GrowerManager
              as_user_id: "${org_id}"
              captures: { sess_rows: $.data }
            - call: "GET /agdata/consent-tickets/${dticket_id}"
              payload: {}
              as: GrowerManager
              as_user_id: "${org_id}"
              captures: { ticket_status: $.data.status }
          assert:
            - "the create returns 409 and error_id == ERR_INVALID_STATE_TRANSITION"
            - "sess_rows is empty (no session persisted)"
            - "ticket_status == \"REQUESTED\" (the failed open did not consume or mutate the ticket)"

      - name: machine_activate_gated_by_plan_state
        grounds:
          - state_machines.Machine.REGISTERED_to_ACTIVATED
          - state_machines.DataPlan
          - errors.ERR_PLAN_NOT_ACTIVE
          - endpoints.POST_/agdata/machines/{id}/activate
        distinguishing_aspect: "Entity pair Machine -> DataPlan: dealer activation requires an ACTIVE plan on the machine; with the modem PROVISIONED but the plan still PENDING the activation fails with ERR_PLAN_NOT_ACTIVE, distinct from the modem gate."
        test_recipe:
          setup:
            - "Machine with modem PROVISIONED; a plan created but never activated (PENDING)."
          setup_api_calls:
            - *d_clock
            - *d_org
            - *d_dealer
            - *d_machine
            - *d_prov_begin
            - *d_prov_ok
            - *d_plan_std
          trigger:
            - call: "POST /agdata/machines/${machine_id}/activate"
              payload: {}
              as: DealerTechnician
              as_user_id: "${dealer_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_PLAN_NOT_ACTIVE"
            - "Machine.${machine_id}.lifecycle_status remains REGISTERED"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: diagnostic_session_exclusive_machine_lock_half_open
        grounds:
          - validations[priority=8]
          - errors.ERR_MACHINE_SESSION_ACTIVE
          - endpoints.POST_/agdata/diagnostic-sessions
          - endpoints.POST_/agdata/diagnostic-sessions/{id}/close
        distinguishing_aspect: "Resource Machine with an exclusive half-open lock: a second OPEN session is rejected while one is open, but a session may open the instant the previous one closes (adjacency allowed, no buffer period)."
        test_recipe:
          setup:
            - "Connected machine; two granted REMOTE_DIAGNOSTIC tickets T1 and T2 for the machine; session S1 open on T1."
          setup_api_calls:
            - *d_clock
            - *d_org
            - *d_dealer
            - *d_machine
            - *d_prov_begin
            - *d_prov_ok
            - *d_plan_std
            - *d_plan_act
            - *d_diag_ticket
            - call: "POST /agdata/consent-tickets/${dticket_id}/grant"
              payload: {}
              as: GrowerManager
              as_user_id: "${org_id}"
            - *d_session
            - call: "POST /agdata/consent-tickets"
              payload: { organization_id: "${org_id}", machine_id: "${machine_id}", ticket_type: "REMOTE_DIAGNOSTIC", requester_ref_id: "${dealer_id}" }
              as: DealerTechnician
              as_user_id: "${dealer_id}"
              captures: { dticket2_id: $.data.id }
            - call: "POST /agdata/consent-tickets/${dticket2_id}/grant"
              payload: {}
              as: GrowerManager
              as_user_id: "${org_id}"
          trigger:
            - call: "POST /agdata/diagnostic-sessions"
              payload: { machine_id: "${machine_id}", consent_ticket_id: "${dticket2_id}" }
              as: DealerTechnician
              as_user_id: "${dealer_id}"
              captures: { error_id: $.data.error_id }
            - call: "POST /agdata/diagnostic-sessions/${session_id}/close"
              payload: { fault_found: true }
              as: DealerTechnician
              as_user_id: "${dealer_id}"
            - call: "POST /agdata/diagnostic-sessions"
              payload: { machine_id: "${machine_id}", consent_ticket_id: "${dticket2_id}" }
              as: DealerTechnician
              as_user_id: "${dealer_id}"
              captures: { session2_id: $.data.id, sess2_level: $.data.diagnostic_detail_level }
          assert:
            - "the first overlapping create returns 409 and error_id == ERR_MACHINE_SESSION_ACTIVE"
            - "after closing S1 the identical create succeeds (half-open lock released with no gap requirement)"
            - "sess2_level == \"EXTENDED\" (dealer session) and ConsentTicket.${dticket2_id}.status == CONSUMED"

      - name: grant_window_closed_interval_overlap
        grounds:
          - validations[priority=8]
          - errors.ERR_GRANT_WINDOW_OVERLAP
          - endpoints.POST_/agdata/data-share-grants
        distinguishing_aspect: "Different interval semantics than the session lock: grant validity windows are CLOSED date intervals on the composite resource (organization, grantee_type, grantee_ref_id, scope), so a new grant starting exactly on the existing grant's inclusive end date conflicts, while one starting the next day is accepted — and a window overlapping on a disjoint scope set is also accepted."
        test_recipe:
          setup:
            - "Organization with grant G1 to agron-ada covering [TELEMATICS], closed window 2026-01-01T00:00:00Z through 2026-03-31T00:00:00Z."
          setup_api_calls:
            - *d_clock
            - *d_org
            - *d_grant_agr
          trigger:
            - call: "POST /agdata/data-share-grants"
              payload: { organization_id: "${org_id}", grantee_type: "AGRONOMIST", grantee_ref_id: "agron-ada", scopes: ["TELEMATICS"], valid_from: "2026-02-01T00:00:00Z", valid_until: "2026-04-30T00:00:00Z" }
              as: GrowerManager
              as_user_id: "${org_id}"
              captures: { err_mid: $.data.error_id }
            - call: "POST /agdata/data-share-grants"
              payload: { organization_id: "${org_id}", grantee_type: "AGRONOMIST", grantee_ref_id: "agron-ada", scopes: ["TELEMATICS"], valid_from: "2026-03-31T00:00:00Z", valid_until: "2026-06-30T00:00:00Z" }
              as: GrowerManager
              as_user_id: "${org_id}"
              captures: { err_touch: $.data.error_id }
            - call: "POST /agdata/data-share-grants"
              payload: { organization_id: "${org_id}", grantee_type: "AGRONOMIST", grantee_ref_id: "agron-ada", scopes: ["TELEMATICS"], valid_from: "2026-04-01T00:00:00Z", valid_until: "2026-06-30T00:00:00Z" }
              as: GrowerManager
              as_user_id: "${org_id}"
              captures: { grant2_id: $.data.id }
            - call: "POST /agdata/data-share-grants"
              payload: { organization_id: "${org_id}", grantee_type: "AGRONOMIST", grantee_ref_id: "agron-ada", scopes: ["DIAGNOSTICS"], valid_from: "2026-02-01T00:00:00Z", valid_until: "2026-04-30T00:00:00Z" }
              as: GrowerManager
              as_user_id: "${org_id}"
              captures: { grant3_id: $.data.id }
          assert:
            - "err_mid == ERR_GRANT_WINDOW_OVERLAP (interior overlap)"
            - "err_touch == ERR_GRANT_WINDOW_OVERLAP (closed intervals: starting exactly on G1's inclusive end date conflicts)"
            - "grant2_id is a created id (2026-04-01 start is the first non-overlapping day)"
            - "grant3_id is a created id (overlapping window but disjoint scope set)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: dealer_reserve_submit_deny_roundtrip
        grounds:
          - state_machines.WarrantyClaim.DRAFT_to_SUBMITTED
          - state_machines.WarrantyClaim.SUBMITTED_to_DENIED
          - entities.Dealer.fields.warranty_reserve_cents
        distinguishing_aspect: "Conserved quantity: dealer warranty reserve money. Invariant warranty_reserve_cents == sum of claim_amount_cents over the dealer's claims in SUBMITTED or APPROVED; the forward action (submit, +1000000) paired with its compensation (decide DENY, -1000000) returns the reserve to exactly 0 with paid untouched."
        test_recipe:
          setup:
            - "Dealer with reserve 0; IN_SERVICE machine with 648 filled hour-buckets (coverage 90.0); a 1000000-cent claim created and submitted."
          setup_api_calls:
            - *d_clock
            - *d_org
            - *d_dealer
            - *d_machine
            - *d_prov_begin
            - *d_prov_ok
            - *d_plan_std
            - *d_plan_act
            - *d_mact
            - call: "POST /agdata/_clock/set_current_utc"
              payload: { current_utc: "2026-09-30T00:00:00Z" }
              as: PlatformAdmin
            - *d_ingest648
            - *d_claim
          trigger:
            - *d_claim_submit
            - call: "GET /agdata/dealers/${dealer_id}"
              payload: {}
              as: DealerTechnician
              as_user_id: "${dealer_id}"
              captures: { reserve_mid: $.data.warranty_reserve_cents }
            - call: "POST /agdata/warranty-claims/${claim_id}/decide"
              payload: { decision: "DENY" }
              as: PlatformAdmin
            - call: "GET /agdata/dealers/${dealer_id}"
              payload: {}
              as: DealerTechnician
              as_user_id: "${dealer_id}"
              captures: { reserve_end: $.data.warranty_reserve_cents, paid_end: $.data.warranty_paid_cents }
          assert:
            - "reserve_mid == 1000000 (submit reserved the claim amount)"
            - "reserve_end == 0 and paid_end == 0 (the DENY compensation exactly undid the reservation)"
            - "WarrantyClaim.${claim_id}.status == DENIED and payout_cents is null"

      - name: machine_license_count_purchase_revoke_roundtrip
        grounds:
          - state_machines.FeatureLicense.PURCHASED_to_REVOKED
          - entities.Machine.fields.active_license_count
          - endpoints.POST_/agdata/feature-licenses
        distinguishing_aspect: "Conserved quantity: a license count, not money. Invariant Machine.active_license_count == count of its FeatureLicenses in PURCHASED/ACTIVATED/SUSPENDED; purchase (+1) paired with revoke (-1) returns the count to exactly 0 and the revoked license no longer gates anything."
        test_recipe:
          setup:
            - "Organization with a machine that has no licenses (active_license_count 0, version 1)."
          setup_api_calls:
            - *d_clock
            - *d_org
            - *d_dealer
            - *d_machine
          trigger:
            - *d_get_machine
            - call: "POST /agdata/feature-licenses"
              payload: { machine_id: "${machine_id}", feature_code: "TELEMATICS_PREMIUM", license_type: "PERPETUAL", expected_machine_version: "${m_v1}" }
              as: GrowerManager
              as_user_id: "${org_id}"
              captures: { lic_id: $.data.id }
            - call: "GET /agdata/machines/${machine_id}"
              payload: {}
              as: GrowerManager
              as_user_id: "${org_id}"
              captures: { count_mid: $.data.active_license_count }
            - call: "POST /agdata/feature-licenses/${lic_id}/revoke"
              payload: {}
              as: PlatformAdmin
            - call: "GET /agdata/machines/${machine_id}"
              payload: {}
              as: GrowerManager
              as_user_id: "${org_id}"
              captures: { count_end: $.data.active_license_count }
          assert:
            - "count_mid == 1 (purchase incremented the conserved count)"
            - "count_end == 0 (revoke compensated it exactly)"
            - "FeatureLicense.${lic_id}.status == REVOKED"
