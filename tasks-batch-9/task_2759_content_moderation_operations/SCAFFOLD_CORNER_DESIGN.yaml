      - name: clock_cannot_move_backwards
        claim_type: violation_to_error
        grounds:
          - validations[priority=69]
          - errors.ERR_CLOCK_NOT_MONOTONIC
        distinguishing_aspect: "The logical clock is monotonic non-decreasing: an earlier timestamp is refused while an equal one is accepted, which pins the comparison as >= rather than >."
        test_recipe:
          setup:
            - "The logical clock has been set to 2026-08-01T12:00:00Z."
          setup_api_calls:
            - call: "POST /moderation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T12:00:00Z" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
          trigger:
            - call: "POST /moderation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:59:59Z" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
            - call: "POST /moderation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T12:00:00Z" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
            - call: "POST /moderation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T12:00:01Z" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
          assert:
            - "the backwards move returns HTTP 422 with data.error_id == ERR_CLOCK_NOT_MONOTONIC"
            - "the equal-timestamp move returns HTTP 200 — the rule is to_iso8601 >= current, not strictly greater"
            - "the forward move returns HTTP 200 and a content item created afterwards carries posted_at == 2026-08-01T12:00:01Z, proving the failed call left the clock at 12:00:00Z"
