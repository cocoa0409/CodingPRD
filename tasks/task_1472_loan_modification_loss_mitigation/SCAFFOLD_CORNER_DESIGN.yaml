scaffold_corner_design:
  # =====================================================================
  # Section: entities
  # =====================================================================
  - section: entities
    instances:
      - name: borrower_creation_defaults_and_common_fields
        claim_type: creation_defaults
        grounds: ["entities.Borrower"]
        distinguishing_aspect: "POST /borrowers with only required fields applies defaults (mailing_address null, status ACTIVE) and stamps common fields (id, created_at, updated_at, version == 1)."
        test_recipe:
          setup: ["empty database; clock at default 2026-08-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - { call: "POST /borrowers", payload: { full_name: "Default Dan", email: "dan@x.com" }, as: ServicingAdmin, captures: { b_id: $.data.id, b_v: $.data.version } }
          assert:
            - "Borrower.${b_id}.status == ACTIVE and mailing_address is null (defaults applied)"
            - "version == 1; id is a server-minted UUID; created_at == 2026-08-01T00:00:00Z (logical clock default)"

      - name: loan_creation_computed_fields_and_initial_state
        claim_type: computed_fields
        grounds: ["entities.Loan.fields.current_pi_cents", "entities.Loan.fields.workout_status"]
        distinguishing_aspect: "POST /loans computes current_pi_cents (annuity 20000000 @ 600bp x 240 = 143286) and initializes workout_status DELINQUENT iff delinquency_days > 0, else PERFORMING."
        test_recipe:
          setup: ["borrower exists"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { full_name: "Eve E", email: "eve@x.com" }, as: ServicingAdmin, captures: { b_id: $.data.id } }
          trigger:
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-ENT1A", property_state_code: "CA", unpaid_principal_balance_cents: 20000000, interest_rate_bp: 600, remaining_term_months: 240, arrears_cents: 1200000, escrow_balance_cents: 30000, escrow_monthly_cents: 30000, delinquency_days: 150 }, as: ServicingAdmin, captures: { l1: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-ENT1B", property_state_code: "CA", unpaid_principal_balance_cents: 20000000, interest_rate_bp: 600, remaining_term_months: 240 }, as: ServicingAdmin, captures: { l2: $.data.id } }
          assert:
            - "Loan.${l1}: current_pi_cents == 143286, workout_status == DELINQUENT, foreclosure_status == NONE, suspense_cents == 0, deferred_principal_cents == 0"
            - "Loan.${l2}: workout_status == PERFORMING, arrears_cents == 0, escrow_balance_cents == 0 (input defaults)"

      - name: loan_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_LOAN_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but absent UUID returns the typed 404 error, not a generic 400/500."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /loans/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: ServicingAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_LOAN_NOT_FOUND, http 404, response_type == error"

      - name: application_initial_state_and_computed_checklist
        claim_type: initial_state
        grounds: ["entities.LossMitApplication"]
        distinguishing_aspect: "A fresh application starts SUBMITTED with all three categories outstanding, verified income 0, completed_at null, and acknowledgement_due_at == created_at + 5 days."
        test_recipe:
          setup: ["borrower + loan boarded at default clock"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { full_name: "Fay F", email: "fay@x.com" }, as: ServicingAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-ENT2", property_state_code: "CA", unpaid_principal_balance_cents: 20000000, interest_rate_bp: 600, remaining_term_months: 240, delinquency_days: 150 }, as: ServicingAdmin, captures: { loan_id: $.data.id, loan_v: $.data.version } }
          trigger:
            - { call: "POST /loans/${loan_id}/applications", payload: { expected_loan_version: "${loan_v}", hardship_type: "DISASTER", stated_monthly_income_cents: 300000 }, as: Borrower, as_user_id: "${b_id}", captures: { app_id: $.data.id } }
          assert:
            - "LossMitApplication.${app_id}.status == SUBMITTED"
            - "outstanding_doc_categories == [INCOME_PROOF, HARDSHIP_AFFIDAVIT, BANK_STATEMENT]; verified_monthly_income_cents == 0; completed_at is null"
            - "acknowledgement_due_at == 2026-08-06T00:00:00Z (created 2026-08-01 + 5 days)"

      - name: evaluation_step_result_immutable_event_rows
        claim_type: immutability
        grounds: ["entities.EvaluationStepResult"]
        distinguishing_aspect: "EvaluationStepResult has common_fields false: rows expose id and created_at but no version/updated_at, and no endpoint mutates them."
        test_recipe:
          setup:
            - "Fixture B evaluation produced one step row"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { full_name: "Gus G", email: "gus@x.com" }, as: ServicingAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-ENT3", property_state_code: "TX", unpaid_principal_balance_cents: 30000000, interest_rate_bp: 600, remaining_term_months: 240, arrears_cents: 6000000, escrow_balance_cents: 0, escrow_monthly_cents: 0, delinquency_days: 150 }, as: ServicingAdmin, captures: { loan_id: $.data.id, loan_v: $.data.version } }
            - { call: "POST /program-options", payload: { code: "STD_MOD", waterfall_rank: 1, target_dti_bp: 3100, rate_floor_bp: 200, rate_step_bp: 25, max_term_months: 480, max_forbearance_pct_bp: 3000, min_delinquency_days: 61, max_delinquency_days: 720 }, as: ServicingAdmin }
            - { call: "POST /loans/${loan_id}/applications", payload: { expected_loan_version: "${loan_v}", hardship_type: "UNEMPLOYMENT", stated_monthly_income_cents: 322581 }, as: Borrower, as_user_id: "${b_id}", captures: { app_id: $.data.id } }
            - { call: "POST /applications/${app_id}/acknowledge", as: LossMitAgent }
            - { call: "POST /applications/${app_id}/documents", payload: { doc_type: "PAYSTUB", gross_per_period_cents: 322581, pay_frequency: "MONTHLY", pay_period_end_date: "2026-07-31" }, as: Borrower, as_user_id: "${b_id}", captures: { d_pay: $.data.id } }
            - { call: "POST /applications/${app_id}/documents", payload: { doc_type: "HARDSHIP_AFFIDAVIT" }, as: Borrower, as_user_id: "${b_id}", captures: { d_aff: $.data.id } }
            - { call: "POST /applications/${app_id}/documents", payload: { doc_type: "BANK_STATEMENT" }, as: Borrower, as_user_id: "${b_id}", captures: { d_bank: $.data.id } }
            - { call: "POST /documents/${d_pay}/accept", as: LossMitAgent }
            - { call: "POST /documents/${d_aff}/accept", as: LossMitAgent }
            - { call: "POST /documents/${d_bank}/accept", as: LossMitAgent }
            - { call: "GET /applications/${app_id}", as: Underwriter, captures: { app_v: $.data.version } }
            - { call: "POST /applications/${app_id}/evaluations", payload: { expected_application_version: "${app_v}" }, as: Underwriter, as_user_id: "uw_1", captures: { ev_id: $.data.id } }
          trigger:
            - { call: "GET /evaluations/${ev_id}/steps", as: Underwriter }
          assert:
            - "each step row exposes id and created_at and does NOT expose version or updated_at (common_fields false)"
            - "step row fields: program_code STD_MOD, step_rank 1, eligible true, achieved_pi_cents 100000, met_target true, selected true"

      - name: fk_reverse_reachability_subresource_and_filtered_list
        claim_type: parent_relationship
        grounds: ["entities.LossMitApplication.fields.loan_id", "entities.Loan.fields.borrower_id"]
        distinguishing_aspect: "Children are discoverable from parents in both declared forms: sub-resource GET /loans/{id}/applications and filtered list GET /loans?borrower_id=."
        test_recipe:
          setup: ["borrower with one loan and one application"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { full_name: "Hal H", email: "hal@x.com" }, as: ServicingAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-ENT4", property_state_code: "CA", unpaid_principal_balance_cents: 20000000, interest_rate_bp: 600, remaining_term_months: 240, delinquency_days: 150 }, as: ServicingAdmin, captures: { loan_id: $.data.id, loan_v: $.data.version } }
            - { call: "POST /loans/${loan_id}/applications", payload: { expected_loan_version: "${loan_v}", hardship_type: "OTHER", stated_monthly_income_cents: 100000 }, as: Borrower, as_user_id: "${b_id}", captures: { app_id: $.data.id } }
          trigger:
            - { call: "GET /loans/${loan_id}/applications", as: ServicingAdmin, captures: { found_app: "$.data[0].id" } }
            - { call: "GET /loans?borrower_id=${b_id}", as: ServicingAdmin, captures: { found_loan: "$.data[0].id" } }
          assert:
            - "found_app == ${app_id} (sub-resource form)"
            - "found_loan == ${loan_id} (filtered-list form)"

  # =====================================================================
  # Section: state_machines
  # =====================================================================
  - section: state_machines
    instances:
      - name: acknowledge_twice_rejected_invalid_transition
        claim_type: invalid_transition
        grounds: ["state_machines.LossMitApplication.SUBMITTED_to_ACKNOWLEDGED", "errors[ERR_APPLICATION_STATE_INVALID]"]
        distinguishing_aspect: "Acknowledge is only legal from SUBMITTED; the second call is a same-trigger idempotency violation rejected with ERR_APPLICATION_STATE_INVALID."
        test_recipe:
          setup: ["application SUBMITTED"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { full_name: "Ida I", email: "ida@x.com" }, as: ServicingAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-SM1", property_state_code: "CA", unpaid_principal_balance_cents: 20000000, interest_rate_bp: 600, remaining_term_months: 240, delinquency_days: 150 }, as: ServicingAdmin, captures: { loan_id: $.data.id, loan_v: $.data.version } }
            - { call: "POST /loans/${loan_id}/applications", payload: { expected_loan_version: "${loan_v}", hardship_type: "MEDICAL", stated_monthly_income_cents: 100000 }, as: Borrower, as_user_id: "${b_id}", captures: { app_id: $.data.id } }
            - { call: "POST /applications/${app_id}/acknowledge", as: LossMitAgent }
          trigger:
            - { call: "POST /applications/${app_id}/acknowledge", as: LossMitAgent, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_APPLICATION_STATE_INVALID, http 409; acknowledged_at unchanged from the first call"

      - name: withdraw_from_trial_active_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.LossMitApplication", "errors[ERR_APPLICATION_STATE_INVALID]"]
        distinguishing_aspect: "Withdrawal is deliberately NOT available from TRIAL_ACTIVE (borrower must not escape a running trial); rejected while every earlier state allows it."
        test_recipe:
          setup:
            - "Fixture A through accepted trial plan (application TRIAL_ACTIVE)"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { full_name: "Jay J", email: "jay@x.com" }, as: ServicingAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-SM2", property_state_code: "CA", unpaid_principal_balance_cents: 20000000, interest_rate_bp: 600, remaining_term_months: 240, arrears_cents: 1200000, escrow_balance_cents: 30000, escrow_monthly_cents: 30000, delinquency_days: 150 }, as: ServicingAdmin, captures: { loan_id: $.data.id, loan_v: $.data.version } }
            - { call: "POST /program-options", payload: { code: "STD_MOD", waterfall_rank: 1, target_dti_bp: 3100, rate_floor_bp: 200, rate_step_bp: 25, max_term_months: 480, max_forbearance_pct_bp: 3000, min_delinquency_days: 61, max_delinquency_days: 720 }, as: ServicingAdmin }
            - { call: "POST /loans/${loan_id}/applications", payload: { expected_loan_version: "${loan_v}", hardship_type: "INCOME_REDUCTION", stated_monthly_income_cents: 480000 }, as: Borrower, as_user_id: "${b_id}", captures: { app_id: $.data.id } }
            - { call: "POST /applications/${app_id}/acknowledge", as: LossMitAgent }
            - { call: "POST /applications/${app_id}/documents", payload: { doc_type: "PAYSTUB", gross_per_period_cents: 200000, pay_frequency: "BIWEEKLY", pay_period_end_date: "2026-07-31" }, as: Borrower, as_user_id: "${b_id}", captures: { d_pay: $.data.id } }
            - { call: "POST /applications/${app_id}/documents", payload: { doc_type: "HARDSHIP_AFFIDAVIT" }, as: Borrower, as_user_id: "${b_id}", captures: { d_aff: $.data.id } }
            - { call: "POST /applications/${app_id}/documents", payload: { doc_type: "BANK_STATEMENT" }, as: Borrower, as_user_id: "${b_id}", captures: { d_bank: $.data.id } }
            - { call: "POST /documents/${d_pay}/accept", as: LossMitAgent }
            - { call: "POST /documents/${d_aff}/accept", as: LossMitAgent }
            - { call: "POST /documents/${d_bank}/accept", as: LossMitAgent }
            - { call: "GET /applications/${app_id}", as: Underwriter, captures: { app_v: $.data.version } }
            - { call: "POST /applications/${app_id}/evaluations", payload: { expected_application_version: "${app_v}" }, as: Underwriter, as_user_id: "uw_1" }
            - { call: "GET /trial-plans?application_id=${app_id}", as: ServicingOps, captures: { plan_id: "$.data[0].id" } }
            - { call: "POST /trial-plans/${plan_id}/accept", as: Borrower, as_user_id: "${b_id}" }
          trigger:
            - { call: "POST /applications/${app_id}/withdraw", as: Borrower, as_user_id: "${b_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_APPLICATION_STATE_INVALID, http 409; status remains TRIAL_ACTIVE"

      - name: accept_already_resolved_document_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.PackageDocument.SUBMITTED_to_ACCEPTED", "errors[ERR_DOCUMENT_ALREADY_RESOLVED]"]
        distinguishing_aspect: "Document resolution is one-shot: ACCEPTED -> accept again is rejected (no re-entrant transitions on a terminal-ish resolved state)."
        test_recipe:
          setup: ["application with one ACCEPTED paystub"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { full_name: "Kim K", email: "kim@x.com" }, as: ServicingAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-SM3", property_state_code: "CA", unpaid_principal_balance_cents: 20000000, interest_rate_bp: 600, remaining_term_months: 240, delinquency_days: 150 }, as: ServicingAdmin, captures: { loan_id: $.data.id, loan_v: $.data.version } }
            - { call: "POST /loans/${loan_id}/applications", payload: { expected_loan_version: "${loan_v}", hardship_type: "MEDICAL", stated_monthly_income_cents: 100000 }, as: Borrower, as_user_id: "${b_id}", captures: { app_id: $.data.id } }
            - { call: "POST /applications/${app_id}/acknowledge", as: LossMitAgent }
            - { call: "POST /applications/${app_id}/documents", payload: { doc_type: "PAYSTUB", gross_per_period_cents: 100000, pay_frequency: "MONTHLY", pay_period_end_date: "2026-07-31" }, as: Borrower, as_user_id: "${b_id}", captures: { d_pay: $.data.id } }
            - { call: "POST /documents/${d_pay}/accept", as: LossMitAgent }
          trigger:
            - { call: "POST /documents/${d_pay}/accept", as: LossMitAgent, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DOCUMENT_ALREADY_RESOLVED, http 409; status stays ACCEPTED"

      - name: trial_plan_terminal_lockdown_pay_and_finalize
        claim_type: terminal_lockdown
        grounds: ["state_machines.TrialPaymentPlan", "errors[ERR_TRIAL_PLAN_NOT_ACTIVE]", "errors[ERR_TRIAL_PAYMENT_RESOLVED]"]
        distinguishing_aspect: "From terminal COMPLETED: re-paying a resolved payment fails with ERR_TRIAL_PAYMENT_RESOLVED and finalize fails with ERR_TRIAL_PLAN_NOT_ACTIVE — no transitions leave a terminal state."
        test_recipe:
          setup:
            - "Fixture A plan COMPLETED (3 on-time payments)"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { full_name: "Lou L", email: "lou@x.com" }, as: ServicingAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-SM4", property_state_code: "CA", unpaid_principal_balance_cents: 20000000, interest_rate_bp: 600, remaining_term_months: 240, arrears_cents: 1200000, escrow_balance_cents: 30000, escrow_monthly_cents: 30000, delinquency_days: 150 }, as: ServicingAdmin, captures: { loan_id: $.data.id, loan_v: $.data.version } }
            - { call: "POST /program-options", payload: { code: "STD_MOD", waterfall_rank: 1, target_dti_bp: 3100, rate_floor_bp: 200, rate_step_bp: 25, max_term_months: 480, max_forbearance_pct_bp: 3000, min_delinquency_days: 61, max_delinquency_days: 720 }, as: ServicingAdmin }
            - { call: "POST /loans/${loan_id}/applications", payload: { expected_loan_version: "${loan_v}", hardship_type: "INCOME_REDUCTION", stated_monthly_income_cents: 480000 }, as: Borrower, as_user_id: "${b_id}", captures: { app_id: $.data.id } }
            - { call: "POST /applications/${app_id}/acknowledge", as: LossMitAgent }
            - { call: "POST /applications/${app_id}/documents", payload: { doc_type: "PAYSTUB", gross_per_period_cents: 200000, pay_frequency: "BIWEEKLY", pay_period_end_date: "2026-07-31" }, as: Borrower, as_user_id: "${b_id}", captures: { d_pay: $.data.id } }
            - { call: "POST /applications/${app_id}/documents", payload: { doc_type: "HARDSHIP_AFFIDAVIT" }, as: Borrower, as_user_id: "${b_id}", captures: { d_aff: $.data.id } }
            - { call: "POST /applications/${app_id}/documents", payload: { doc_type: "BANK_STATEMENT" }, as: Borrower, as_user_id: "${b_id}", captures: { d_bank: $.data.id } }
            - { call: "POST /documents/${d_pay}/accept", as: LossMitAgent }
            - { call: "POST /documents/${d_aff}/accept", as: LossMitAgent }
            - { call: "POST /documents/${d_bank}/accept", as: LossMitAgent }
            - { call: "GET /applications/${app_id}", as: Underwriter, captures: { app_v: $.data.version } }
            - { call: "POST /applications/${app_id}/evaluations", payload: { expected_application_version: "${app_v}" }, as: Underwriter, as_user_id: "uw_1" }
            - { call: "GET /trial-plans?application_id=${app_id}", as: ServicingOps, captures: { plan_id: "$.data[0].id" } }
            - { call: "POST /trial-plans/${plan_id}/accept", as: Borrower, as_user_id: "${b_id}" }
            - { call: "GET /trial-plans/${plan_id}/payments", as: ServicingOps, captures: { p1: "$.data[0].id", p2: "$.data[1].id", p3: "$.data[2].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-04T00:00:00Z" }, as: ServicingAdmin }
            - { call: "POST /trial-payments/${p1}/pay", payload: { amount_cents: 178842 }, as: Borrower, as_user_id: "${b_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-04T00:00:00Z" }, as: ServicingAdmin }
            - { call: "POST /trial-payments/${p2}/pay", payload: { amount_cents: 178842 }, as: Borrower, as_user_id: "${b_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-03T00:00:00Z" }, as: ServicingAdmin }
            - { call: "POST /trial-payments/${p3}/pay", payload: { amount_cents: 178842 }, as: Borrower, as_user_id: "${b_id}" }
          trigger:
            - { call: "POST /trial-payments/${p1}/pay", payload: { amount_cents: 178842 }, as: Borrower, as_user_id: "${b_id}", captures: { err1: $.data.error_id } }
            - { call: "POST /trial-plans/${plan_id}/finalize", as: ServicingOps, captures: { err2: $.data.error_id } }
          assert:
            - "err1 == ERR_TRIAL_PAYMENT_RESOLVED (payment terminal)"
            - "err2 == ERR_TRIAL_PLAN_NOT_ACTIVE (plan terminal); plan stays COMPLETED"

      - name: appeal_double_decision_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.Appeal", "errors[ERR_APPEAL_ALREADY_DECIDED]"]
        distinguishing_aspect: "A decided appeal is terminal; a second decision (even the opposite outcome) is rejected."
        test_recipe:
          setup:
            - "Fixture C denial 2026-08-10, appeal submitted 2026-08-12, AFFIRMED by rev_1"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { full_name: "Meg M", email: "meg@x.com" }, as: ServicingAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-SM5", property_state_code: "TX", unpaid_principal_balance_cents: 30000000, interest_rate_bp: 600, remaining_term_months: 240, arrears_cents: 6000000, escrow_balance_cents: 0, escrow_monthly_cents: 0, delinquency_days: 150 }, as: ServicingAdmin, captures: { loan_id: $.data.id, loan_v: $.data.version } }
            - { call: "POST /program-options", payload: { code: "STD_MOD", waterfall_rank: 1, target_dti_bp: 3100, rate_floor_bp: 200, rate_step_bp: 25, max_term_months: 480, max_forbearance_pct_bp: 3000, min_delinquency_days: 61, max_delinquency_days: 720 }, as: ServicingAdmin }
            - { call: "POST /loans/${loan_id}/applications", payload: { expected_loan_version: "${loan_v}", hardship_type: "UNEMPLOYMENT", stated_monthly_income_cents: 100000 }, as: Borrower, as_user_id: "${b_id}", captures: { app_id: $.data.id } }
            - { call: "POST /applications/${app_id}/acknowledge", as: LossMitAgent }
            - { call: "POST /applications/${app_id}/documents", payload: { doc_type: "PAYSTUB", gross_per_period_cents: 100000, pay_frequency: "MONTHLY", pay_period_end_date: "2026-07-31" }, as: Borrower, as_user_id: "${b_id}", captures: { d_pay: $.data.id } }
            - { call: "POST /applications/${app_id}/documents", payload: { doc_type: "HARDSHIP_AFFIDAVIT" }, as: Borrower, as_user_id: "${b_id}", captures: { d_aff: $.data.id } }
            - { call: "POST /applications/${app_id}/documents", payload: { doc_type: "BANK_STATEMENT" }, as: Borrower, as_user_id: "${b_id}", captures: { d_bank: $.data.id } }
            - { call: "POST /documents/${d_pay}/accept", as: LossMitAgent }
            - { call: "POST /documents/${d_aff}/accept", as: LossMitAgent }
            - { call: "POST /documents/${d_bank}/accept", as: LossMitAgent }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: ServicingAdmin }
            - { call: "GET /applications/${app_id}", as: Underwriter, captures: { app_v: $.data.version } }
            - { call: "POST /applications/${app_id}/evaluations", payload: { expected_application_version: "${app_v}" }, as: Underwriter, as_user_id: "uw_1" }
            - { call: "GET /applications/${app_id}/denial-notices", as: Underwriter, captures: { notice_id: "$.data[0].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T00:00:00Z" }, as: ServicingAdmin }
