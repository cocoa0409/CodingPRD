            - { call: "POST /respite/claims/${clm}/submit", as: Provider, as_user_id: "${prov}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-04T22:00:00Z" }, as: FunderAdmin }
            - { call: "POST /respite/claims/${clm}/adjudicate", payload: { decision: "DENY", reason: "documentation gap" }, as: FunderAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-04T22:00:00Z" }, as: FunderAdmin }
          trigger:
            - { call: "POST /respite/claims/${clm}/appeal", payload: { reason: "too late" }, as: Provider, as_user_id: "${prov}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_APPEAL_WINDOW_CLOSED"
            - "Claim.${clm}.status == DENIED"

      - name: booking_beyond_voucher_expiry_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=17]", "errors[ERR_BOOKING_BEYOND_VOUCHER_EXPIRY]"]
        distinguishing_aspect: "A booking ending 2026-08-05 against a voucher expiring 2026-07-30T00:00:00Z (issued 2026-05-01 + 90 days) is rejected with ERR_BOOKING_BEYOND_VOUCHER_EXPIRY while the voucher is still ISSUED."
        test_recipe:
          setup: ["Caregiver ACTIVE; provider ACTIVE with window 2026-08-03..2026-08-07; voucher 10h ISSUED at default clock (expires 2026-07-30T00:00:00Z); clock NOT advanced"]
          setup_api_calls:
            - { call: "POST /respite/programs", payload: { name: "Respite FY26", fiscal_year_start: "2026-01-01", total_budget_cents: 50000000, quarterly_cap_hours: 80, annual_cap_hours: 320, standard_rate_cents_per_hour: 3000, emergency_reserve_hours: 200 }, as: FunderAdmin, captures: { prog: $.data.id } }
