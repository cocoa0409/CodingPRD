# =====================================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2721 — Deposit Insurance Determination & Failed Institution Resolution
#
# Every literal in every `assert:` below was produced by executing the §1.3 formulas as
# code against the pinned setup inputs. Nine rule_id blocks x 2 instances = 18 instances.
# =====================================================================================
scaffold_difficulty_design:

  # ===================================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: alice_category_pooled_vs_per_account_insured_divergence
        grounds:
          - calculations.depositor_insurance_determination
          - entities.InsuranceDetermination.fields.method_variant
          - state_machines.InsuranceDetermination.REVISION_REQUESTED_to_PREPARED
          - validations[priority=61]
        distinguishing_aspect: |
          This dual variant lives on the DepositorRecord / InsuranceDetermination domain: pooling two
          SINGLE accounts into one category bucket before the SMDIA cap yields insured 25000000 /
          uninsured 4000001, while capping each account independently yields insured 29000001 /
          uninsured 0 on byte-identical account data.
        test_recipe:
          setup:
            - "Institution 34567 (book_asset_value_cents 25000000) is CLOSED_IN_RECEIVERSHIP with a STANDARDIZED readiness package."
            - "Depositor Alice owns exactly two SINGLE accounts: S-0001 = 20000000 cents (opened 2024-03-01) and S-0002 = 9000001 cents (opened 2024-06-15); both are FROZEN_FOR_DETERMINATION."
            - "Alice's determination has been prepared once under AGGREGATE_BY_CATEGORY by user agent-001 and is PREPARED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ClosingManager
            - call: "POST /institutions"
              payload: { cert_number: "34567", legal_name: "First Cascade Savings Bank", charter_state: "WA", book_asset_value_cents: 25000000, estimated_liquidation_recovery_cents: 18000000 }
              as: ClosingManager
              captures: { inst_id: $.data.id }
            - call: "POST /institutions/${inst_id}/depositor-records"
              payload: { tin_hash: "TIN-ALICE-01", legal_name: "Alice Nakamura", depositor_type: "NATURAL_PERSON", contact_email: "alice@example.com" }
              as: ClaimsAgent
              captures: { alice_id: $.data.id }
            - call: "POST /deposit-accounts"
              payload: { institution_id: "${inst_id}", primary_depositor_id: "${alice_id}", account_number: "S-0001", ownership_category: "SINGLE", balance_cents: 20000000, accrued_interest_cents: 0, opened_at: "2024-03-01T00:00:00Z" }
              as: ClaimsAgent
              captures: { acct1_id: $.data.id }
            - call: "POST /deposit-accounts"
              payload: { institution_id: "${inst_id}", primary_depositor_id: "${alice_id}", account_number: "S-0002", ownership_category: "SINGLE", balance_cents: 9000001, accrued_interest_cents: 0, opened_at: "2024-06-15T00:00:00Z" }
              as: ClaimsAgent
              captures: { acct2_id: $.data.id }
            - call: "POST /institutions/${inst_id}/readiness-submissions"
              payload: { file_format: "FDIC_STANDARD_V2", record_count: 200, malformed_record_count: 4, reported_deposit_total_cents: 29000001 }
              as: ClosingManager
              captures: { sub_id: $.data.id }
            - call: "POST /readiness-submissions/${sub_id}/standardize"
              payload: {}
              as: ClosingManager
            - call: "POST /institutions/${inst_id}/close"
              payload: {}
              as: ClosingManager
            - call: "GET /depositor-records/${alice_id}"
              as: ClaimsAgent
              captures: { alice_v: $.data.version }
            - call: "POST /insurance-determinations"
              payload: { depositor_record_id: "${alice_id}", expected_depositor_record_version: "${alice_v}" }
              as: ClaimsAgent
              captures: { det_id: $.data.id }
            - call: "POST /insurance-determinations/${det_id}/prepare"
              payload: { method_variant: "AGGREGATE_BY_CATEGORY" }
              as: ClaimsAgent
              as_user_id: "agent-001"
            - call: "POST /insurance-determinations/${det_id}/submit-review"
              payload: {}
              as: ClaimsAgent
              as_user_id: "agent-001"
          trigger:
            - call: "GET /insurance-determinations/${det_id}"
              as: ClaimsAgent
            - call: "POST /insurance-determinations/${det_id}/request-revision"
              payload: { revision_reason: "Re-run under the provisional per-account method for comparison" }
              as: ClaimsCertifier
              as_user_id: "certifier-001"
            - call: "POST /insurance-determinations/${det_id}/prepare"
              payload: { method_variant: "PER_ACCOUNT_PROVISIONAL" }
              as: ClaimsAgent
              as_user_id: "agent-001"
            - call: "GET /insurance-determinations/${det_id}"
              as: ClaimsAgent
          assert:
            - "trigger[0] response data.method_variant == AGGREGATE_BY_CATEGORY, data.insured_amount_cents == 25000000, data.uninsured_amount_cents == 4000001, data.attributed_total_cents == 29000001"
            - "trigger[0] response data.category_breakdown.SINGLE.limit_cents == 25000000 and data.category_breakdown.SINGLE.attributed_cents == 29000001"
            - "trigger[3] response data.method_variant == PER_ACCOUNT_PROVISIONAL, data.insured_amount_cents == 29000001, data.uninsured_amount_cents == 0, data.attributed_total_cents == 29000001"
            - "the two variants diverge by exactly 4000001 cents of insured_amount_cents on identical DepositAccount data"
            - "InsuranceDetermination.${det_id}.revision_round == 1 and InsuranceDetermination.${det_id}.status == PREPARED"
            - "DepositAccount.${acct1_id}.attributed_amount_cents == 20000000 and DepositAccount.${acct2_id}.attributed_amount_cents == 9000001 under both variants"

      - name: bid_evaluation_variant_flips_least_cost_winner
        grounds:
          - calculations.bid_evaluated_cost
          - entities.Institution.fields.least_cost_test_variant
          - state_machines.Bid.SUBMITTED_to_CONFORMING
          - entities.Bid.fields.evaluated_cost_cents
        distinguishing_aspect: |
          This dual variant lives on the Bid / Institution resolution-cost domain, not on depositor
          insurance: with the identical two-bid set, EXPECTED_LOSS_SHARE scores WHOLE_BANK bid A at
          5630001 and LOSS_SHARE bid C at 7397153 (A cheapest), while RETENTION_ADJUSTED scores C at
          5161465 against the unchanged 5630001 (C cheapest) — the variant, not the bids, picks the winner.
        test_recipe:
          setup:
            - "Two institutions 40001 and 40002 are byte-identical: book_asset_value_cents 25000000, one depositor, SINGLE accounts of 20000000 and 9000001, total_deposit_balance_cents 29000001, both CLOSED_IN_RECEIVERSHIP with franchise marketing OPEN and bid_deadline_at 2026-09-30T00:00:00Z."
            - "Bidders Cascade Union (tier1 1400 bps, CAMELS 2) and Puget Federal (tier1 1600 bps, CAMELS 1) are both QUALIFIED."
            - "On each institution both bidders have SUBMITTED the same pair of bids: bid A = WHOLE_BANK_PA deposit_premium_bps 300 / asset_discount_bps 1000 / no retention; bid C = LOSS_SHARE_PA deposit_premium_bps 1379 / asset_discount_bps 1000 / loss_share_pct_bps 6000 / asset_retention_pool_cents 2000000."
            - "No determination has been certified on either institution, so aggregate_insured_cents is 0 and only the total-deposit base drives the cost."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ClosingManager
            - call: "POST /institutions"
              payload: { cert_number: "40001", legal_name: "Elliott Bay Trust", charter_state: "WA", book_asset_value_cents: 25000000, estimated_liquidation_recovery_cents: 18000000 }
              as: ClosingManager
              captures: { x_inst_id: $.data.id }
            - call: "POST /institutions/${x_inst_id}/depositor-records"
              payload: { tin_hash: "TIN-X-01", legal_name: "Xavier Holt", depositor_type: "NATURAL_PERSON", contact_email: "x@example.com" }
              as: ClaimsAgent
              captures: { x_dep_id: $.data.id }
            - call: "POST /deposit-accounts"
              payload: { institution_id: "${x_inst_id}", primary_depositor_id: "${x_dep_id}", account_number: "X-0001", ownership_category: "SINGLE", balance_cents: 20000000, accrued_interest_cents: 0, opened_at: "2024-03-01T00:00:00Z" }
              as: ClaimsAgent
            - call: "POST /deposit-accounts"
              payload: { institution_id: "${x_inst_id}", primary_depositor_id: "${x_dep_id}", account_number: "X-0002", ownership_category: "SINGLE", balance_cents: 9000001, accrued_interest_cents: 0, opened_at: "2024-06-15T00:00:00Z" }
              as: ClaimsAgent
            - call: "POST /institutions/${x_inst_id}/readiness-submissions"
              payload: { file_format: "FDIC_STANDARD_V2", record_count: 200, malformed_record_count: 4, reported_deposit_total_cents: 29000001 }
              as: ClosingManager
              captures: { x_sub_id: $.data.id }
            - call: "POST /readiness-submissions/${x_sub_id}/standardize"
              payload: {}
              as: ClosingManager
            - call: "POST /institutions/${x_inst_id}/close"
              payload: {}
              as: ClosingManager
            - call: "POST /institutions/${x_inst_id}/franchise-marketing"
              payload: { marketing_action: "OPEN", bid_deadline_at: "2026-09-30T00:00:00Z" }
              as: ResolutionAnalyst
            - call: "POST /institutions"
              payload: { cert_number: "40002", legal_name: "Rainier Mutual", charter_state: "WA", book_asset_value_cents: 25000000, estimated_liquidation_recovery_cents: 18000000 }
              as: ClosingManager
              captures: { y_inst_id: $.data.id }
            - call: "POST /institutions/${y_inst_id}/depositor-records"
              payload: { tin_hash: "TIN-Y-01", legal_name: "Yara Osman", depositor_type: "NATURAL_PERSON", contact_email: "y@example.com" }
              as: ClaimsAgent
              captures: { y_dep_id: $.data.id }
            - call: "POST /deposit-accounts"
              payload: { institution_id: "${y_inst_id}", primary_depositor_id: "${y_dep_id}", account_number: "Y-0001", ownership_category: "SINGLE", balance_cents: 20000000, accrued_interest_cents: 0, opened_at: "2024-03-01T00:00:00Z" }
              as: ClaimsAgent
            - call: "POST /deposit-accounts"
              payload: { institution_id: "${y_inst_id}", primary_depositor_id: "${y_dep_id}", account_number: "Y-0002", ownership_category: "SINGLE", balance_cents: 9000001, accrued_interest_cents: 0, opened_at: "2024-06-15T00:00:00Z" }
              as: ClaimsAgent
            - call: "POST /institutions/${y_inst_id}/readiness-submissions"
              payload: { file_format: "FDIC_STANDARD_V2", record_count: 200, malformed_record_count: 4, reported_deposit_total_cents: 29000001 }
              as: ClosingManager
              captures: { y_sub_id: $.data.id }
            - call: "POST /readiness-submissions/${y_sub_id}/standardize"
              payload: {}
              as: ClosingManager
            - call: "POST /institutions/${y_inst_id}/close"
              payload: {}
              as: ClosingManager
            - call: "POST /institutions/${y_inst_id}/franchise-marketing"
              payload: { marketing_action: "OPEN", bid_deadline_at: "2026-09-30T00:00:00Z" }
              as: ResolutionAnalyst
            - call: "POST /bidders"
              payload: { legal_name: "Cascade Union Bank", cert_number: "51001", tier1_capital_ratio_bps: 1400, camels_composite: 2 }
              as: ResolutionAnalyst
              captures: { bidder1_id: $.data.id }
            - call: "POST /bidders/${bidder1_id}/qualification"
              payload: { decision: "QUALIFY" }
              as: ResolutionAnalyst
            - call: "POST /bidders"
              payload: { legal_name: "Puget Federal Bank", cert_number: "51002", tier1_capital_ratio_bps: 1600, camels_composite: 1 }
              as: ResolutionAnalyst
              captures: { bidder2_id: $.data.id }
            - call: "POST /bidders/${bidder2_id}/qualification"
              payload: { decision: "QUALIFY" }
              as: ResolutionAnalyst
            - call: "POST /bids"
              payload: { institution_id: "${x_inst_id}", bidder_id: "${bidder1_id}", structure: "WHOLE_BANK_PA", deposit_premium_bps: 300, asset_discount_bps: 1000, loss_share_pct_bps: 0, asset_retention_pool_cents: 0, data_room_window_start: "2026-09-01T09:00:00Z", data_room_window_end: "2026-09-01T12:00:00Z" }
              as: Bidder
              as_user_id: "${bidder1_id}"
              captures: { x_bid_a_id: $.data.id }
            - call: "POST /bids"
              payload: { institution_id: "${x_inst_id}", bidder_id: "${bidder2_id}", structure: "LOSS_SHARE_PA", deposit_premium_bps: 1379, asset_discount_bps: 1000, loss_share_pct_bps: 6000, asset_retention_pool_cents: 2000000, data_room_window_start: "2026-09-01T16:00:00Z", data_room_window_end: "2026-09-01T18:00:00Z" }
              as: Bidder
              as_user_id: "${bidder2_id}"
              captures: { x_bid_c_id: $.data.id }
            - call: "POST /bids"
              payload: { institution_id: "${y_inst_id}", bidder_id: "${bidder1_id}", structure: "WHOLE_BANK_PA", deposit_premium_bps: 300, asset_discount_bps: 1000, loss_share_pct_bps: 0, asset_retention_pool_cents: 0, data_room_window_start: "2026-09-01T09:00:00Z", data_room_window_end: "2026-09-01T12:00:00Z" }
              as: Bidder
              as_user_id: "${bidder1_id}"
              captures: { y_bid_a_id: $.data.id }
            - call: "POST /bids"
              payload: { institution_id: "${y_inst_id}", bidder_id: "${bidder2_id}", structure: "LOSS_SHARE_PA", deposit_premium_bps: 1379, asset_discount_bps: 1000, loss_share_pct_bps: 6000, asset_retention_pool_cents: 2000000, data_room_window_start: "2026-09-01T16:00:00Z", data_room_window_end: "2026-09-01T18:00:00Z" }
              as: Bidder
              as_user_id: "${bidder2_id}"
              captures: { y_bid_c_id: $.data.id }
          trigger:
            - call: "POST /institutions/${x_inst_id}/least-cost-test/evaluate"
              payload: { test_variant: "EXPECTED_LOSS_SHARE" }
              as: ResolutionAnalyst
            - call: "POST /institutions/${y_inst_id}/least-cost-test/evaluate"
              payload: { test_variant: "RETENTION_ADJUSTED" }
              as: ResolutionAnalyst
          assert:
            - "Bid.${x_bid_a_id}.evaluated_cost_cents == 5630001 and Bid.${x_bid_a_id}.pre_fee_cost_cents == 5630001 and Bid.${x_bid_a_id}.loss_share_fee_cents == 0"
            - "Bid.${x_bid_c_id}.pre_fee_cost_cents == 4900901, Bid.${x_bid_c_id}.loss_share_fee_cents == 12252, Bid.${x_bid_c_id}.expected_loss_share_reimbursement_cents == 2484000, Bid.${x_bid_c_id}.evaluated_cost_cents == 7397153"
            - "Bid.${y_bid_a_id}.evaluated_cost_cents == 5630001 — unchanged by the variant switch"
            - "Bid.${y_bid_c_id}.pre_fee_cost_cents == 5140901, Bid.${y_bid_c_id}.loss_share_fee_cents == 20564, Bid.${y_bid_c_id}.expected_loss_share_reimbursement_cents == 0, Bid.${y_bid_c_id}.evaluated_cost_cents == 5161465"
            - "under EXPECTED_LOSS_SHARE the cheapest bid is ${x_bid_a_id} (5630001 < 7397153); under RETENTION_ADJUSTED the cheapest bid is ${y_bid_c_id} (5161465 < 5630001) — the winner flips on identical bid inputs"
            - "Institution.${x_inst_id}.least_cost_test_variant == EXPECTED_LOSS_SHARE and Institution.${y_inst_id}.least_cost_test_variant == RETENTION_ADJUSTED, both with conforming_bid_count == 2 and least_cost_status == EVALUATED"

  # ===================================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: dividend_rounds_per_certificate_before_summation_mode_b
        grounds:
          - calculations.dividend_waterfall_allocation
          - state_machines.DividendDistribution.DECLARED_to_SETTLED
          - state_machines.ReceivershipCertificate.ISSUED_to_PARTIALLY_PAID
          - concurrency_rules[dividend-declare-stale-institution]
        distinguishing_aspect: |
          Mode (b) — nested rounding where the order changes the cents: rounding each certificate's
          3333 bps share first (1333200 + 666600) totals 1999800, whereas summing the faces
          (6000002) and rounding once totals 1999801; the scaffold pins round-per-certificate-then-sum
          and the settled total MUST be 1999800.
        test_recipe:
          setup:
            - "Institution 34568 is CLOSED_IN_RECEIVERSHIP with a STANDARDIZED readiness package covering 300 records (6 malformed) and a reported total of 56000002 cents."
            - "Alice holds SINGLE accounts of 20000000 and 9000001 (certified first, uninsured 4000001); Bob holds a SINGLE account of 27000001 (certified second, uninsured 2000001)."
            - "Two ReceivershipCertificates exist in status ISSUED with cumulative_dividends_cents 0: Alice's face 4000001 (earlier created_at) and Bob's face 2000001."
            - "A single asset-pool disposition has been booked: gross 5000000, expense 1000000, so receivership_cash_cents == 4000000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ClosingManager
            - call: "POST /institutions"
              payload: { cert_number: "34568", legal_name: "Sound Federal Bank", charter_state: "WA", book_asset_value_cents: 25000000, estimated_liquidation_recovery_cents: 18000000 }
              as: ClosingManager
              captures: { inst3_id: $.data.id }
            - call: "POST /institutions/${inst3_id}/depositor-records"
              payload: { tin_hash: "TIN-ALICE-03", legal_name: "Alice Nakamura", depositor_type: "NATURAL_PERSON", contact_email: "alice3@example.com" }
              as: ClaimsAgent
              captures: { a3_id: $.data.id }
            - call: "POST /institutions/${inst3_id}/depositor-records"
              payload: { tin_hash: "TIN-BOB-03", legal_name: "Bob Serrano", depositor_type: "NATURAL_PERSON", contact_email: "bob3@example.com" }
              as: ClaimsAgent
              captures: { b3_id: $.data.id }
            - call: "POST /deposit-accounts"
              payload: { institution_id: "${inst3_id}", primary_depositor_id: "${a3_id}", account_number: "S-0001", ownership_category: "SINGLE", balance_cents: 20000000, accrued_interest_cents: 0, opened_at: "2024-03-01T00:00:00Z" }
              as: ClaimsAgent
            - call: "POST /deposit-accounts"
              payload: { institution_id: "${inst3_id}", primary_depositor_id: "${a3_id}", account_number: "S-0002", ownership_category: "SINGLE", balance_cents: 9000001, accrued_interest_cents: 0, opened_at: "2024-06-15T00:00:00Z" }
              as: ClaimsAgent
            - call: "POST /deposit-accounts"
              payload: { institution_id: "${inst3_id}", primary_depositor_id: "${b3_id}", account_number: "B-0001", ownership_category: "SINGLE", balance_cents: 27000001, accrued_interest_cents: 0, opened_at: "2024-05-01T00:00:00Z" }
              as: ClaimsAgent
            - call: "POST /institutions/${inst3_id}/readiness-submissions"
              payload: { file_format: "FDIC_STANDARD_V2", record_count: 300, malformed_record_count: 6, reported_deposit_total_cents: 56000002 }
              as: ClosingManager
              captures: { sub3_id: $.data.id }
            - call: "POST /readiness-submissions/${sub3_id}/standardize"
              payload: {}
              as: ClosingManager
            - call: "POST /institutions/${inst3_id}/close"
              payload: {}
              as: ClosingManager
            - call: "GET /depositor-records/${a3_id}"
              as: ClaimsAgent
              captures: { a3_v: $.data.version }
            - call: "POST /insurance-determinations"
              payload: { depositor_record_id: "${a3_id}", expected_depositor_record_version: "${a3_v}" }
              as: ClaimsAgent
              captures: { a3_det_id: $.data.id }
            - call: "POST /insurance-determinations/${a3_det_id}/prepare"
              payload: { method_variant: "AGGREGATE_BY_CATEGORY" }
              as: ClaimsAgent
              as_user_id: "agent-001"
            - call: "POST /insurance-determinations/${a3_det_id}/submit-review"
              payload: {}
              as: ClaimsAgent
              as_user_id: "agent-001"
            - call: "POST /insurance-determinations/${a3_det_id}/certify"
              payload: {}
              as: ClaimsCertifier
              as_user_id: "certifier-001"
            - call: "GET /depositor-records/${b3_id}"
              as: ClaimsAgent
              captures: { b3_v: $.data.version }
            - call: "POST /insurance-determinations"
              payload: { depositor_record_id: "${b3_id}", expected_depositor_record_version: "${b3_v}" }
              as: ClaimsAgent
              captures: { b3_det_id: $.data.id }
            - call: "POST /insurance-determinations/${b3_det_id}/prepare"
              payload: { method_variant: "AGGREGATE_BY_CATEGORY" }
              as: ClaimsAgent
              as_user_id: "agent-001"
            - call: "POST /insurance-determinations/${b3_det_id}/submit-review"
              payload: {}
              as: ClaimsAgent
              as_user_id: "agent-001"
            - call: "POST /insurance-determinations/${b3_det_id}/certify"
              payload: {}
              as: ClaimsCertifier
              as_user_id: "certifier-001"
            - call: "POST /institutions/${inst3_id}/receivership-proceeds"
              payload: { asset_pool_code: "POOL-A", gross_proceeds_cents: 5000000, disposition_expense_cents: 1000000 }
              as: ReceivershipTrustee
            - call: "GET /receivership-certificates"
              payload: { depositor_record_id: "${a3_id}" }
              as: ReceivershipTrustee
              captures: { a3_cert_id: "$.data[0].id" }
            - call: "GET /receivership-certificates"
              payload: { depositor_record_id: "${b3_id}" }
              as: ReceivershipTrustee
              captures: { b3_cert_id: "$.data[0].id" }
          trigger:
            - call: "GET /institutions/${inst3_id}"
              as: ReceivershipTrustee
              captures: { inst3_v: $.data.version }
            - call: "POST /institutions/${inst3_id}/dividend-distributions"
              payload: { priority_class: "GENERAL_UNSECURED", declared_rate_bps: 3333, expected_institution_version: "${inst3_v}" }
              as: ReceivershipTrustee
              captures: { dist3_id: $.data.id }
            - call: "POST /dividend-distributions/${dist3_id}/settle"
              payload: {}
              as: ReceivershipTrustee
          assert:
            - "DividendDistribution.${dist3_id}.total_distributed_cents == 1999800"
            - "DividendDistribution.${dist3_id}.total_distributed_cents != 1999801 — the sum-then-round order is forbidden"
            - "DividendDistribution.${dist3_id}.certificate_count == 2 and DividendDistribution.${dist3_id}.status == SETTLED and DividendDistribution.${dist3_id}.distribution_round == 1"
            - "ReceivershipCertificate.${a3_cert_id}.face_amount_cents == 4000001, cumulative_dividends_cents == 1333200, last_dividend_amount_cents == 1333200, last_dividend_round == 1, status == PARTIALLY_PAID"
            - "ReceivershipCertificate.${b3_cert_id}.face_amount_cents == 2000001, cumulative_dividends_cents == 666600, last_dividend_amount_cents == 666600, last_dividend_round == 1, status == PARTIALLY_PAID"
            - "Institution.${inst3_id}.receivership_cash_cents == 2000200"
            - "GET /institutions/${inst3_id}/insurance-summary returns data.cash_conservation_delta_cents == 0 and data.conservation_delta_cents == 0"

      - name: loss_share_fee_tier_keyed_on_pre_fee_cost_mode_c
        grounds:
          - calculations.bid_evaluated_cost
          - entities.Bid.fields.pre_fee_cost_cents
          - entities.Bid.fields.loss_share_fee_cents
          - state_machines.Bid.SUBMITTED_to_CONFORMING
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with a pinned evaluation order: the loss-share fee is
          tier-selected from a cost figure that itself contains the fee, and the scaffold pins the tier
          key to pre_fee_cost_cents (4900901 -> tier A, 25 bps -> 12252). Keying the tier on the final
          evaluated_cost_cents (7397153, tier B at 40 bps) would yield 19604, which must not appear.
        test_recipe:
          setup:
