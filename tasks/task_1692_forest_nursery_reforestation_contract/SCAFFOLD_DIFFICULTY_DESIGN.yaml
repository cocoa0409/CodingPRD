            - { call: "POST /reforestation/crews", payload: { crew_code: "CR-1", capacity_per_day: 5000 }, as: ContractOfficer, captures: { crew_id: $.data.id } }
            - { call: "POST /reforestation/crew-assignments", payload: { crew_id: "${crew_id}", planting_contract_id: "${c_1}", start_date: "2027-04-01", end_date: "2027-04-05", planned_seedlings: 20000 }, as: ContractOfficer, captures: { a_1: $.data.id } }
          trigger:
            - { call: "POST /reforestation/crew-assignments", payload: { crew_id: "${crew_id}", planting_contract_id: "${c_1}", start_date: "2027-04-06", end_date: "2027-04-07", planned_seedlings: 6000 }, as: ContractOfficer, captures: { a_2_err: $.data.error_id } }
            - { call: "POST /reforestation/crew-assignments/${a_1}/release", payload: {}, as: ContractOfficer, captures: { a_1_status: $.data.status } }
            - { call: "POST /reforestation/crew-assignments", payload: { crew_id: "${crew_id}", planting_contract_id: "${c_1}", start_date: "2027-04-01", end_date: "2027-04-05", planned_seedlings: 20000 }, as: ContractOfficer, captures: { a_3: $.data.id } }
          assert:
            - "a_2_err == ERR_CREW_CAPACITY_EXCEEDED (ceil(6000/1) = 6000 > 5000 free on 2027-04-06)"
            - "a_1_status == RELEASED (compensating action)"
            - "a_3 is created: the full 5000/day capacity is restored after release (ceil(20000/4) = 5000 == capacity, equality passes)"
