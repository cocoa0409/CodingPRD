      - name: credit_limit_equality_boundary
        grounds:
          - calculations.renter_credit_recompute
          - entities.Renter.fields.credit_hold
          - errors[ERR_CREDIT_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Money metric through POST /reservations/{id}/confirm (a different metric and endpoint
          than the run-weeks boundary): credit_hold uses STRICTLY-greater, so outstanding ==
          credit_limit (8000 == 8000) lets confirm succeed, while dropping the limit by one cent
          (8000 > 7999) makes the identical confirm fail with ERR_CREDIT_LIMIT_EXCEEDED.
        test_recipe:
          setup:
            - "RC published; item with 3 units; renter ACTIVE, credit_limit 8000; production CONFIRMED"
            - "Reservation R1 qty 1 Sep 1-10 CONFIRMED (quote 8000), pull list dispatched, invoice ISSUED (outstanding 8000 == limit, hold false)"
