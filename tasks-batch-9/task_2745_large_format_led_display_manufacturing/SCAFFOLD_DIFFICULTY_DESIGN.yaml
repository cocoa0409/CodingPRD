            - "DisplayProject.${pj}.contract_amount_cents == 9557316"
            - "ServiceContract.${sc}.spare_required_count == 6"
            - "ServiceContract.${sc}.gross_fee_cents == 1975910"
            - "ServiceContract.${sc}.subtotal_fee_cents == 2002910"
            - "ServiceContract.${sc}.volume_discount_pct == 0.04"
            - "ServiceContract.${sc}.annual_fee_cents == 1922794"
            - "ServiceContract.${sc}.annual_fee_cents != 2002910   # discount must be applied"
            - "ServiceContract.${sc}.volume_discount_pct != 0.00   # tier must not be re-derived from the post-discount figure"
            - "ServiceContract.${sc}.response_hours == 8 and ServiceContract.${sc}.contract_state == PENDING"

  - rule_id: non_linear_state_machine
    instances:
      - name: module_rework_self_loop_bounded_then_scrapped
        grounds:
          - state_machines.Module.MANUFACTURED_to_REWORK
          - state_machines.Module.REWORK_to_REWORK
          - state_machines.Module.REWORK_to_SCRAPPED
          - calculations.module_rework_cycle_accounting
          - entities.Module.fields.rework_cycles
        distinguishing_aspect: |
          A true self-loop on Module: the same endpoint with the same failing
          payload keeps the entity in REWORK while a monotonic counter climbs,
          and the loop is bounded — the third failure diverts to the terminal
          SCRAPPED state instead of looping again, after which the same call is
          rejected outright. Different entity from the two multi-dimension /
          fork machines in this rule block.
        test_recipe:
          setup:
            - "FP10-IN display model exists with module_dead_pixel_max 3 and module_cluster_max 1; MAX_REWORK_CYCLES = 2."
            - "One MANUFACTURED module M-9 exists on that model with rework_cycles 0."
          setup_api_calls:
            - call: "POST /display-models"
              payload: { name: "FP10-IN", pixel_pitch_mm: 10.0, rated_brightness_nits: 5000, environmental_rating: "IP43_INDOOR", module_width_mm: 320, module_height_mm: 320, module_pixel_cols: 32, module_pixel_rows: 32, cabinet_width_mm: 320, cabinet_height_mm: 320, modules_per_cabinet: 1, cabinet_weight_kg: 10.24, price_per_sqm_cents: 1000000, dead_pixel_ppm_limit: 976.56, module_dead_pixel_max: 3, module_cluster_max: 1, reference_color_x: 0.3128, reference_color_y: 0.3290, burn_in_hours_required: 24, max_drive_pct: 90 }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { dm: $.data.id }
            - call: "POST /modules"
              payload: { display_model_id: "${dm}", serial_no: "M-9" }
              as: ProductionOperator
              as_user_id: "op-1"
              captures: { m9: $.data.id }
          trigger:
            - call: "POST /modules/${m9}/pixel-test"
              payload: { dead_pixel_count: 5, max_cluster_size: 1 }
              as: ProductionOperator
              as_user_id: "op-1"
            - call: "POST /modules/${m9}/pixel-test"
              payload: { dead_pixel_count: 5, max_cluster_size: 1 }
              as: ProductionOperator
              as_user_id: "op-1"
            - call: "POST /modules/${m9}/pixel-test"
              payload: { dead_pixel_count: 5, max_cluster_size: 1 }
              as: ProductionOperator
              as_user_id: "op-1"
            - call: "POST /modules/${m9}/pixel-test"
              payload: { dead_pixel_count: 1, max_cluster_size: 1 }
              as: ProductionOperator
              as_user_id: "op-1"
          assert:
            - "after trigger call 1: Module.${m9}.module_state == REWORK and Module.${m9}.rework_cycles == 1"
            - "after trigger call 2: Module.${m9}.module_state == REWORK and Module.${m9}.rework_cycles == 2   # self-loop, state unchanged"
            - "after trigger call 3: Module.${m9}.module_state == SCRAPPED and Module.${m9}.rework_cycles == 3"
            - "trigger call 4 -> 409 ERR_INVALID_MODULE_STATE   # SCRAPPED is terminal, a passing retest cannot revive it"
            - "Module.${m9}.rework_cycles == 3 after trigger call 4   # the counter never decreases and the rejected call does not bump it"
            - "Module.${m9}.cabinet_id is null and Module.${m9}.slot_index is null"

      - name: project_engineering_and_production_dimensions_advance_independently
        grounds:
          - state_machines.DisplayProject.engineering_state
          - state_machines.DisplayProject.production_state
          - state_machines.DisplayProject.REJECTED_to_UNDER_REVIEW
          - entities.DisplayProject.fields.approved_revision_number
          - validations.priority_17
        distinguishing_aspect: |
          One entity carrying two independent state fields: the engineering
          dimension loops DRAFT -> UNDER_REVIEW -> REJECTED -> UNDER_REVIEW ->
          APPROVED (revision_number is the loop counter) while production_state
          sits at NOT_STARTED throughout, and then production advances to
          IN_ASSEMBLY without disturbing the now-terminal engineering value.
          Different entity and different shape (parallel + cyclic) from the
          Module self-loop and the ServiceCase fork.
        test_recipe:
          setup:
            - "FP10-IN display model exists (required_load_kg_per_sqm 100.00)."
            - "A 1x1 RETAIL project on it, engineering_state DRAFT, production_state NOT_STARTED."
            - "One CALIBRATED module M-1 exists on the model; one PLANNED cabinet at (1,1) exists on the project."
          setup_api_calls:
            - call: "POST /display-models"
              payload: { name: "FP10-IN", pixel_pitch_mm: 10.0, rated_brightness_nits: 5000, environmental_rating: "IP43_INDOOR", module_width_mm: 320, module_height_mm: 320, module_pixel_cols: 32, module_pixel_rows: 32, cabinet_width_mm: 320, cabinet_height_mm: 320, modules_per_cabinet: 1, cabinet_weight_kg: 10.24, price_per_sqm_cents: 1000000, dead_pixel_ppm_limit: 976.56, module_dead_pixel_max: 3, module_cluster_max: 1, reference_color_x: 0.3128, reference_color_y: 0.3290, burn_in_hours_required: 24, max_drive_pct: 90 }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { dm: $.data.id }
            - call: "POST /projects"
              payload: { customer_name: "Retail Three", install_environment: "RETAIL", site_region_code: "NA-W", display_model_id: "${dm}", cabinet_grid_cols: 1, cabinet_grid_rows: 1, min_viewing_distance_m: 10.0, target_brightness_nits: 5000, redundancy_mode: "NONE", output_port_count: 1, port_bandwidth_mbps: 1000, color_depth_bits: 10, refresh_rate_hz: 60, player_count: 1 }
              as: DesignEngineer
              as_user_id: "eng-1"
              captures: { pj: $.data.id }
            - call: "POST /drawing-revisions"
              payload: { project_id: "${pj}", structural_load_kg_per_sqm: 100.00, wind_load_kph: 100, mounting_type: "WALL", service_access_side: "FRONT" }
              as: DesignEngineer
              as_user_id: "eng-1"
              captures: { rev1: $.data.id }
            - call: "POST /drawing-revisions/${rev1}/review"
