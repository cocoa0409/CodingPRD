              as: FinanceOfficer
              as_user_id: "finance-filer-1"
              captures: { lf_v_fresh: $.data.version, cert1: $.data.certified_airspace_cy }
            - call: "POST /closure-cost-estimates"
              payload: { landfill_id: "${lf_id}", estimate_year: 2026, closure_unit_cost_per_sf: 1.855, post_closure_annual_cost: 95000.00, inflation_pct: 0.03, post_closure_years: 30, expected_landfill_version: "${lf_v_fresh}" }
              as: FinanceOfficer
