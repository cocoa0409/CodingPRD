            - call: "POST /esy/compensatory-awards/${aw_id}/propose"
              payload: { proposed_minutes: 85 }
              as: CaseManager
              as_user_id: "cm-001"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-08-02T00:00:00Z" }
              as: CaseManager
            - call: "POST /esy/compensatory-awards/${aw_id}/parent-response"
              payload: { response: "AGREE" }
              as: ParentGuardian
              as_user_id: "${s1_id}"
            - call: "GET /esy/compensatory-awards/${aw_id}"
              payload: {}
