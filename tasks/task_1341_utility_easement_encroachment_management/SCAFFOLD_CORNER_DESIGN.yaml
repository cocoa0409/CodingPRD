              as: RightOfWayAgent
              captures: { cid: $.data.id }
            - call: "POST /easement-cases/${cid}/documents"
              payload: { doc_kind: "DEED", instrument_number: "INST-CM1", recording_date: "2026-07-01T00:00:00Z", grantor_name: "S", grantee_name: "CU", gis_polygon_wkt: "POLYGON((0 0,1 0,1 1,0 1,0 0))", width_ft: 50 }
              as: TitleExaminer
              captures: { did: $.data.id }
            - call: "POST /easement-cases/${cid}/title-searches"
              payload: { search_scope: "FULL_CHAIN" }
              as: TitleExaminer
              captures: { tid: $.data.id }
            - call: "POST /easement-cases/${cid}/title-searches/${tid}/begin"
              payload: {}
              as: TitleExaminer
            - call: "POST /easement-cases/${cid}/title-searches/${tid}/complete"
              payload: { liens_found: 0, defects_found: 0, chain_of_title_json: { links: [] } }
              as: TitleExaminer
            - call: "POST /easement-cases/${cid}/documents/${did}/record"
              payload: {}
              as: TitleExaminer
            - call: "POST /easement-cases/${cid}/begin-mapping"
              payload: {}
              as: RightOfWayAgent
            - call: "POST /easement-cases/${cid}/activate-monitoring"
              payload: {}
              as: RightOfWayAgent
            - call: "POST /easement-cases/${cid}/offers"
              payload: { landowner_name: "I", landowner_contact: "i@x.com", offered_area_sqft: 1000, severance_damages_cents: 0 }
              as: RightOfWayAgent
              captures: { oid: $.data.id }
            - call: "GET /easement-cases/${cid}"
              payload: {}
              as: RightOfWayAgent
              captures: { cv: $.data.version }
          trigger:
            - call: "POST /easement-cases/${cid}/offers/${oid}/tender"
              payload: { expected_case_version: "${cv}" }
              as: RightOfWayAgent
            - call: "GET /easement-cases/${cid}"
              payload: {}
              as: RightOfWayAgent
          assert:
            - "EasementCase.${cid}.compensation_committed_cents == 1000000"
            - "EasementCase.${cid}.compensation_balance_cents == 49000000"
