# =============================================================================
# task_2793 — International Film Sales & Pre-Sale Financing
# §1.9 Scaffold Corner Design — the BREADTH walk over §1.1–§1.7.
#
# Taxonomy source: skills/prd-bench-scaffold-generator/references/
# claim-extraction-guide.md. The nine `section:` values and every `claim_type:`
# below are taken from that guide; no category is invented here.
#
# Conventions shared by every recipe in this file:
#   * the logical clock is pinned with POST /film-sales/_clock/set_current_utc
#     before anything else; the mandatory default is 2026-08-01T00:00:00Z
#   * the unknown-id literal is 00000000-0000-0000-0000-000000000000
#   * every numeric assertion is a literal computed against the §1.3 formulas
#   * §1.8 already covers many corners; those appear here as `excluded_because:`
#     stubs naming the covering SCAFFOLD_DIFFICULTY_DESIGN.yaml instance
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: film_create_returns_every_declared_field_and_zeroed_slate_counters
        claim_type: creation
        grounds:
          - entities.Film.fields.sales_status
          - entities.Film.fields.total_mg_committed_usd
          - entities.Film.fields.financing_gap_usd
          - entities.Film.fields.published_territory_count
          - "endpoints[POST /film-sales/films]"
        distinguishing_aspect: |
          A single POST with every required field returns 201 and the full Film shape: the six
          computed/system fields are present and seeded (sales_status DEVELOPMENT,
          total_mg_committed_usd 0.00, financing_gap_usd equal to the whole 24000000.00 budget,
          both territory counters 0) rather than absent or null.
        test_recipe:
          setup:
            - "Empty DB; clock pinned at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /film-sales/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /film-sales/films"
              payload: { title: "Northern Lights", genre: "ACTION", production_budget_usd: 24000000.00, principal_cast_score: 88, estimated_delivery_date: "2027-02-28T00:00:00Z", theatrical_release_date: "2027-04-15T00:00:00Z", completion_status: "IN_PRODUCTION" }
              as: PlatformAdmin
              captures: { film_id: $.data.id }
          assert:
            - "HTTP 201 and response_type == object"
            - "Film.${film_id}.title == Northern Lights and genre == ACTION"
            - "Film.${film_id}.completion_status == IN_PRODUCTION (the supplied value, not the SCRIPT default)"
            - "Film.${film_id}.sales_status == DEVELOPMENT"
            - "Film.${film_id}.total_mg_committed_usd == 0.00 and total_mg_collected_usd == 0.00"
            - "Film.${film_id}.financing_gap_usd == 24000000.00"
            - "Film.${film_id}.published_territory_count == 0 and licensed_territory_count == 0"
            - "Film.${film_id}.version == 1"

      - name: film_retrieval_returns_the_stored_row_byte_for_byte
        claim_type: retrieval
        grounds:
          - "endpoints[GET /film-sales/films/{id}]"
          - entities.Film.fields.principal_cast_score
        distinguishing_aspect: |
          GET /film-sales/films/{id} returns the same field values the create call returned —
          principal_cast_score 88, production_budget_usd 24000000.00, version still 1 — proving the
          read path does not recompute or mutate anything.
        test_recipe:
          setup:
            - "One film registered at clock 2026-08-01T00:00:00Z; no other rows."
          setup_api_calls:
            - call: "POST /film-sales/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /film-sales/films"
              payload: { title: "Northern Lights", genre: "ACTION", production_budget_usd: 24000000.00, principal_cast_score: 88, estimated_delivery_date: "2027-02-28T00:00:00Z", theatrical_release_date: "2027-04-15T00:00:00Z" }
              as: PlatformAdmin
              captures: { film_id: $.data.id }
          trigger:
            - call: "GET /film-sales/films/${film_id}"
              payload: {}
              as: SalesAgent
              captures: { read_version: $.data.version }
          assert:
            - "HTTP 200 and Film.${film_id}.principal_cast_score == 88"
            - "Film.${film_id}.production_budget_usd == 24000000.00"
            - "Film.${film_id}.completion_status == SCRIPT"
            - "${read_version} == 1: a read does not advance version"

      - name: film_listing_paginates_with_total_count_has_more_and_a_genre_filter
        claim_type: listing
        grounds:
          - "endpoints[GET /film-sales/films]"
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          Three films exist; limit 2 offset 0 returns 2 rows with total_count 3 and has_more true,
          limit 2 offset 2 returns 1 row with has_more false, and genre=ACTION returns total_count 2 —
          so the filter is applied BEFORE the window, not after it.
        test_recipe:
          setup:
            - "Three films created in order Alpha (ACTION), Beta (DRAMA), Gamma (ACTION); list order is created_at DESC then id ASC."
          setup_api_calls:
            - call: "POST /film-sales/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /film-sales/films"
              payload: { title: "Alpha", genre: "ACTION", production_budget_usd: 10000000.00, principal_cast_score: 60, estimated_delivery_date: "2027-02-28T00:00:00Z", theatrical_release_date: "2027-04-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /film-sales/films"
              payload: { title: "Beta", genre: "DRAMA", production_budget_usd: 8000000.00, principal_cast_score: 55, estimated_delivery_date: "2027-03-28T00:00:00Z", theatrical_release_date: "2027-05-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /film-sales/films"
              payload: { title: "Gamma", genre: "ACTION", production_budget_usd: 12000000.00, principal_cast_score: 72, estimated_delivery_date: "2027-04-28T00:00:00Z", theatrical_release_date: "2027-06-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /film-sales/films"
              payload: { limit: 2, offset: 0 }
              as: SalesAgent
            - call: "GET /film-sales/films"
              payload: { limit: 2, offset: 2 }
              as: SalesAgent
            - call: "GET /film-sales/films"
              payload: { genre: "ACTION" }
              as: SalesAgent
          assert:
            - "call 1: data has exactly 2 elements, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "call 2: data has exactly 1 element, total_count == 3, has_more == false"
            - "call 3: data has exactly 2 elements, total_count == 2, and every element has genre == ACTION"
            - "call 3: limit == 10 and offset == 0 — the declared pagination defaults are applied when omitted"

      - name: film_read_with_an_unknown_uuid_returns_film_not_found
        claim_type: not_found
        grounds:
          - errors.ERR_FILM_NOT_FOUND
          - validations[priority=30]
        distinguishing_aspect: |
          A syntactically valid but unregistered UUID on GET /film-sales/films/{id} returns the
          domain-specific ERR_FILM_NOT_FOUND at HTTP 404 — not a generic 404 body and not
          ERR_INVALID_REQUEST.
        test_recipe:
          setup:
            - "Clock pinned; exactly one unrelated film exists so the collection is non-empty."
          setup_api_calls:
            - call: "POST /film-sales/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /film-sales/films"
              payload: { title: "Northern Lights", genre: "ACTION", production_budget_usd: 24000000.00, principal_cast_score: 88, estimated_delivery_date: "2027-02-28T00:00:00Z", theatrical_release_date: "2027-04-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /film-sales/films/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: SalesAgent
              captures: { err_film: $.data.error_id }
          assert:
            - "HTTP 404, response_type == error"
            - "${err_film} == ERR_FILM_NOT_FOUND"

      - name: market_create_missing_required_inventory_fields_returns_invalid_request
        claim_type: required_fields
        grounds:
          - "endpoints[POST /film-sales/markets]"
          - errors.ERR_INVALID_REQUEST
          - validations[priority=42]
        distinguishing_aspect: |
          POST /film-sales/markets omitting screening_room_count and meeting_table_count — two
          `source: input` fields with NO declared default — returns ERR_INVALID_REQUEST at HTTP 400
          rather than silently defaulting the inventory to 0 or 1.
        test_recipe:
          setup:
            - "Clock pinned at 2026-08-01T00:00:00Z; no markets exist."
          setup_api_calls:
            - call: "POST /film-sales/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /film-sales/markets"
              payload: { name: "EFM Berlin", city: "Berlin", start_date: "2027-02-11T00:00:00Z", end_date: "2027-02-17T00:00:00Z" }
              as: PlatformAdmin
              captures: { err_req: $.data.error_id }
          assert:
            - "HTTP 400 and ${err_req} == ERR_INVALID_REQUEST"
            - "no Market row is persisted: GET /film-sales/markets returns total_count == 0"

      - name: creation_defaults_apply_on_film_buyer_comparable_and_facility
        claim_type: defaults
        grounds:
          - entities.Film.fields.completion_status
          - entities.Buyer.fields.status
          - entities.ComparableTitle.fields.verified
          - entities.BankingFacility.fields.completion_bond_required
        distinguishing_aspect: |
          Four distinct declared defaults are exercised in one chain by OMITTING each optional input:
          Film.completion_status becomes SCRIPT, Buyer.status becomes ACTIVE, ComparableTitle.verified
          becomes false, and BankingFacility.completion_bond_required becomes true — the last is the
          only default whose value is `true`, so a blanket "default to false/null" implementation
          fails exactly one of the four assertions.
        test_recipe:
          setup:
            - "Clock pinned at 2026-08-01T00:00:00Z; one territory DE exists to hang the buyer and comparable off."
          setup_api_calls:
            - call: "POST /film-sales/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /film-sales/territories"
              payload: { code: "DE", name: "Germany", region: "EMEA", market_tier: 1, currency_code: "EUR", base_value_index: 1.20 }
              as: PlatformAdmin
              captures: { terr_de_id: $.data.id }
          trigger:
            - call: "POST /film-sales/films"
              payload: { title: "Northern Lights", genre: "ACTION", production_budget_usd: 24000000.00, principal_cast_score: 88, estimated_delivery_date: "2027-02-28T00:00:00Z", theatrical_release_date: "2027-04-15T00:00:00Z" }
              as: PlatformAdmin
              captures: { film_id: $.data.id }
            - call: "POST /film-sales/territories/${terr_de_id}/buyers"
              payload: { company_name: "Rhein Films", credit_rating: "AAA", exposure_limit_usd: 3000000.00 }
              as: PlatformAdmin
              captures: { buyer_de_id: $.data.id }
            - call: "POST /film-sales/territories/${terr_de_id}/comparable-titles"
              payload: { name: "Comp Alpha", genre: "ACTION", cast_score: 80, gross_license_fee_usd: 800000.00, release_year: 2022 }
              as: PlatformAdmin
              captures: { comp_a_id: $.data.id }
            - call: "POST /film-sales/films/${film_id}/banking-facilities"
              payload: { lender_name: "Rialto Bank", discount_rate_pct: 0.08, advance_rate_pct: 0.80, facility_cap_usd: 1000000.00 }
              as: Lender
              captures: { fac_id: $.data.id }
          assert:
            - "Film.${film_id}.completion_status == SCRIPT"
            - "Buyer.${buyer_de_id}.status == ACTIVE with outstanding_exposure_usd == 0.00 and net_unpaid_exposure_usd == 0.00"
            - "ComparableTitle.${comp_a_id}.verified == false"
            - "BankingFacility.${fac_id}.completion_bond_required == true and completion_bond_posted == false"
            - "BankingFacility.${fac_id}.status == PROPOSED with eligible_collateral_usd == 0.00, advance_amount_usd == 0.00 and drawn_amount_usd == 0.00"

      - name: film_create_computed_and_system_field_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.Film.fields.sales_status
          - entities.Film.fields.financing_gap_usd
          - "endpoints[POST /film-sales/films]"
        distinguishing_aspect: |
          The create body smuggles sales_status IN_MARKET, financing_gap_usd 1.00 and version 99 —
          none of which is declared in POST /film-sales/films `input:`. The server ignores all three
          and still returns sales_status DEVELOPMENT, financing_gap_usd 24000000.00 and version 1.
        test_recipe:
          setup:
            - "Clock pinned at 2026-08-01T00:00:00Z; empty slate."
          setup_api_calls:
            - call: "POST /film-sales/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /film-sales/films"
              payload: { title: "Northern Lights", genre: "ACTION", production_budget_usd: 24000000.00, principal_cast_score: 88, estimated_delivery_date: "2027-02-28T00:00:00Z", theatrical_release_date: "2027-04-15T00:00:00Z", sales_status: "IN_MARKET", financing_gap_usd: 1.00, version: 99 }
              as: PlatformAdmin
              captures: { film_id: $.data.id }
          assert:
            - "Film.${film_id}.sales_status == DEVELOPMENT, not IN_MARKET"
            - "Film.${film_id}.financing_gap_usd == 24000000.00, not 1.00"
            - "Film.${film_id}.version == 1, not 99"
            - "Film.${film_id}.published_territory_count == 0 and licensed_territory_count == 0"

      - name: film_system_fields_are_server_generated_and_version_advances_on_write

        claim_type: system_fields
        grounds:
          - "endpoints[PATCH /film-sales/films/{id}]"
          - entities.Film.fields.sales_status
        distinguishing_aspect: |
          id, created_at, updated_at and version are stamped by the server at creation (version 1),
          and the first PATCH advances version to exactly 2 while created_at stays fixed — so version
          is a write counter, not a wall-clock echo.
        test_recipe:
          setup:
            - "One film registered at clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /film-sales/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /film-sales/films"
              payload: { title: "Northern Lights", genre: "ACTION", production_budget_usd: 24000000.00, principal_cast_score: 88, estimated_delivery_date: "2027-02-28T00:00:00Z", theatrical_release_date: "2027-04-15T00:00:00Z" }
              as: PlatformAdmin
              captures: { film_id: $.data.id, created_version: $.data.version, created_stamp: $.data.created_at }
          trigger:
            - call: "POST /film-sales/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "PATCH /film-sales/films/${film_id}"
              payload: { completion_status: "POST" }
              as: PlatformAdmin
              captures: { patched_version: $.data.version }
          assert:
            - "${created_version} == 1 and ${patched_version} == 2"
            - "Film.${film_id}.created_at == ${created_stamp} — unchanged by the PATCH"
            - "Film.${film_id}.updated_at == 2026-08-02T00:00:00Z"
            - "Film.${film_id}.completion_status == POST"

      - name: entity_field_type_and_range_constraints_are_rejected_at_creation
        claim_type: type_constraints
        grounds:
          - entities.Film.fields.genre
          - entities.Film.fields.principal_cast_score
          - entities.Territory.fields.base_value_index
          - entities.SalesAgencyAgreement.fields.commission_pct
          - entities.SalesAgencyAgreement.fields.term_months
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: |
          Five different constraint KINDS all collapse to ERR_INVALID_REQUEST at priority 42: an
          out-of-set enum (genre SCI_FI), an integer above its inclusive upper bound
          (principal_cast_score 101), a number above its declared range (base_value_index 3.00), an
          exclusive-upper-bound rate (commission_pct 0.30 > 0.25), and an end instant not strictly
          after its start (Market end_date == start_date).
        test_recipe:
          setup:
            - "Clock pinned; one valid film exists so the agency-agreement path is reachable."
          setup_api_calls:
            - call: "POST /film-sales/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /film-sales/films"
              payload: { title: "Northern Lights", genre: "ACTION", production_budget_usd: 24000000.00, principal_cast_score: 88, estimated_delivery_date: "2027-02-28T00:00:00Z", theatrical_release_date: "2027-04-15T00:00:00Z" }
              as: PlatformAdmin
              captures: { film_id: $.data.id }
          trigger:
            - call: "POST /film-sales/films"
              payload: { title: "Bad Genre", genre: "SCI_FI", production_budget_usd: 1000000.00, principal_cast_score: 50, estimated_delivery_date: "2027-02-28T00:00:00Z", theatrical_release_date: "2027-04-15T00:00:00Z" }
              as: PlatformAdmin
              captures: { err_enum: $.data.error_id }
            - call: "POST /film-sales/films"
              payload: { title: "Bad Cast", genre: "ACTION", production_budget_usd: 1000000.00, principal_cast_score: 101, estimated_delivery_date: "2027-02-28T00:00:00Z", theatrical_release_date: "2027-04-15T00:00:00Z" }
              as: PlatformAdmin
              captures: { err_range: $.data.error_id }
            - call: "POST /film-sales/territories"
              payload: { code: "FR", name: "France", region: "EMEA", market_tier: 1, currency_code: "EUR", base_value_index: 3.00 }
              as: PlatformAdmin
              captures: { err_index: $.data.error_id }
            - call: "POST /film-sales/films/${film_id}/agency-agreements"
              payload: { commission_pct: 0.30, expense_cap_usd: 75000.00, term_months: 24, term_start_date: "2026-08-01T00:00:00Z" }
              as: HeadOfSales
              captures: { err_pct: $.data.error_id }
            - call: "POST /film-sales/markets"
              payload: { name: "EFM Berlin", city: "Berlin", start_date: "2027-02-11T00:00:00Z", end_date: "2027-02-11T00:00:00Z", screening_room_count: 3, meeting_table_count: 4 }
              as: PlatformAdmin
              captures: { err_window: $.data.error_id }
          assert:
            - "${err_enum} == ERR_INVALID_REQUEST and HTTP 400"
            - "${err_range} == ERR_INVALID_REQUEST and HTTP 400"
            - "${err_index} == ERR_INVALID_REQUEST and HTTP 400"
            - "${err_pct} == ERR_INVALID_REQUEST and HTTP 400"
            - "${err_window} == ERR_INVALID_REQUEST and HTTP 400"
            - "GET /film-sales/films returns total_count == 1: none of the five rejected bodies persisted"

      - name: territory_and_comparable_title_are_immutable_rows_without_version
        claim_type: immutability
        grounds:
          - entities.Territory.common_fields
          - entities.ComparableTitle.common_fields
          - entities.DistributionRun.common_fields
        distinguishing_aspect: |
          Territory, ComparableTitle and DistributionRun are declared `common_fields: false`: their
          read payloads carry NO version and NO updated_at, and §1.5 declares no PATCH, PUT or DELETE
          on /film-sales/territories/{id} or on any comparable-title or distribution-run path. Every
          other entity in §1.1 carries version.
        test_recipe:
          setup:
            - "Clock pinned; territory DE with one comparable title."
          setup_api_calls:
            - call: "POST /film-sales/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /film-sales/territories"
              payload: { code: "DE", name: "Germany", region: "EMEA", market_tier: 1, currency_code: "EUR", base_value_index: 1.20 }
              as: PlatformAdmin
              captures: { terr_de_id: $.data.id }
            - call: "POST /film-sales/territories/${terr_de_id}/comparable-titles"
              payload: { name: "Comp Alpha", genre: "ACTION", cast_score: 80, gross_license_fee_usd: 800000.00, release_year: 2022, verified: true }
              as: PlatformAdmin
          trigger:
            - call: "GET /film-sales/territories/${terr_de_id}"
              payload: {}
              as: SalesAgent
            - call: "GET /film-sales/territories/${terr_de_id}/comparable-titles"
              payload: {}
              as: SalesAgent
          assert:
            - "the Territory payload contains code, name, region, market_tier, currency_code, base_value_index and id — and no version key and no updated_at key"
            - "each ComparableTitle element contains no version key and no updated_at key"
            - "§1.5 declares no PATCH, PUT or DELETE whose path starts with /film-sales/territories/{id}"
            - "Territory.${terr_de_id}.base_value_index == 1.20 is therefore unchangeable for the life of the row"

      - name: child_creation_against_an_unknown_parent_returns_that_parents_not_found_code
        claim_type: parent_relationships
        grounds:
          - validations[priority=30]
          - validations[priority=31]
          - validations[priority=32]
          - errors.ERR_MARKET_NOT_FOUND
        distinguishing_aspect: |
          On POST /film-sales/screening-slots the existence ladder is ordered film (30) then market
          (32): a valid film with an unknown market_id yields ERR_MARKET_NOT_FOUND while an unknown
          film_id with a valid market yields ERR_FILM_NOT_FOUND — and both outrank the
          ERR_FILM_NOT_IN_MARKET state check at priority 52, which the DEVELOPMENT film would
          otherwise trip.
        test_recipe:
          setup:
            - "Clock pinned; one DEVELOPMENT film, one PLANNED market, one territory DE."
          setup_api_calls:
            - call: "POST /film-sales/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /film-sales/films"
              payload: { title: "Northern Lights", genre: "ACTION", production_budget_usd: 24000000.00, principal_cast_score: 88, estimated_delivery_date: "2027-02-28T00:00:00Z", theatrical_release_date: "2027-04-15T00:00:00Z" }
              as: PlatformAdmin
              captures: { film_id: $.data.id }
            - call: "POST /film-sales/markets"
              payload: { name: "EFM Berlin", city: "Berlin", start_date: "2027-02-11T00:00:00Z", end_date: "2027-02-17T00:00:00Z", screening_room_count: 3, meeting_table_count: 4 }
              as: PlatformAdmin
              captures: { market_id: $.data.id }
          trigger:
            - call: "POST /film-sales/screening-slots"
              payload: { market_id: "00000000-0000-0000-0000-000000000000", film_id: "${film_id}", room_number: 1, start_at: "2027-02-12T09:00:00Z", end_at: "2027-02-12T11:00:00Z", slot_type: "BUYER_SCREENING", capacity: 60 }
              as: SalesAgent
              captures: { err_market: $.data.error_id }
            - call: "POST /film-sales/screening-slots"
              payload: { market_id: "${market_id}", film_id: "00000000-0000-0000-0000-000000000000", room_number: 1, start_at: "2027-02-12T09:00:00Z", end_at: "2027-02-12T11:00:00Z", slot_type: "BUYER_SCREENING", capacity: 60 }
              as: SalesAgent
              captures: { err_film: $.data.error_id }
            - call: "POST /film-sales/territories/00000000-0000-0000-0000-000000000000/comparable-titles"
              payload: { name: "Orphan Comp", genre: "ACTION", cast_score: 80, gross_license_fee_usd: 800000.00, release_year: 2022, verified: true }
              as: PlatformAdmin
              captures: { err_terr: $.data.error_id }
          assert:
            - "${err_market} == ERR_MARKET_NOT_FOUND at HTTP 404"
            - "${err_film} == ERR_FILM_NOT_FOUND at HTTP 404, not ERR_FILM_NOT_IN_MARKET"
            - "${err_terr} == ERR_TERRITORY_NOT_FOUND at HTTP 404"
            - "no ScreeningSlot and no ComparableTitle row is persisted by any of the three calls"

      - name: valuation_creation_validates_both_foreign_keys_in_declared_priority_order
        claim_type: cross_reference_integrity
        grounds:
          - "endpoints[POST /film-sales/territory-valuations]"
          - validations[priority=30]
          - validations[priority=31]
        distinguishing_aspect: |
          The flat topology means TerritoryValuation carries two independent FKs in its body. With
          BOTH the film and the territory unknown the response is ERR_FILM_NOT_FOUND, because
          priority 30 strictly precedes 31 — a scaffold that checks the territory first returns the
          wrong code on this exact call.
        test_recipe:
          setup:
            - "Clock pinned; one film and one territory DE exist."
          setup_api_calls:
            - call: "POST /film-sales/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /film-sales/films"
              payload: { title: "Northern Lights", genre: "ACTION", production_budget_usd: 24000000.00, principal_cast_score: 88, estimated_delivery_date: "2027-02-28T00:00:00Z", theatrical_release_date: "2027-04-15T00:00:00Z" }
              as: PlatformAdmin
              captures: { film_id: $.data.id }
            - call: "POST /film-sales/territories"
              payload: { code: "DE", name: "Germany", region: "EMEA", market_tier: 1, currency_code: "EUR", base_value_index: 1.20 }
              as: PlatformAdmin
              captures: { terr_de_id: $.data.id }
          trigger:
            - call: "POST /film-sales/territory-valuations"
              payload: { film_id: "${film_id}", territory_id: "00000000-0000-0000-0000-000000000000", method: "CAST_ADJUSTED" }
              as: SalesAgent
              captures: { err_terr: $.data.error_id }
            - call: "POST /film-sales/territory-valuations"
              payload: { film_id: "00000000-0000-0000-0000-000000000000", territory_id: "00000000-0000-0000-0000-000000000000", method: "CAST_ADJUSTED" }
              as: SalesAgent
              captures: { err_both: $.data.error_id }
          assert:
            - "${err_terr} == ERR_TERRITORY_NOT_FOUND at HTTP 404"
            - "${err_both} == ERR_FILM_NOT_FOUND — priority 30 wins over priority 31 when both FKs dangle"
            - "GET /film-sales/territory-valuations returns total_count == 0"

      - name: territory_code_uniqueness_rejects_a_second_row_with_the_same_code
        claim_type: type_constraints
        grounds:
          - entities.Territory.fields.code
          - errors.ERR_TERRITORY_CODE_TAKEN
          - validations[priority=98]
        distinguishing_aspect: |
          Territory.code is declared unique; the second POST with code DE returns
          ERR_TERRITORY_CODE_TAKEN at HTTP 409 (a conflict, not the 400 ERR_INVALID_REQUEST that a
          malformed code would raise) and the first row's name is left untouched.
        test_recipe:
          setup:
            - "Clock pinned; territory DE 'Germany' already registered."
          setup_api_calls:
            - call: "POST /film-sales/_clock/set_current_utc"
