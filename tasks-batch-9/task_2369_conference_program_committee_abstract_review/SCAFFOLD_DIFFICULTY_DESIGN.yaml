# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Scenario 2369. Conference Program Committee & Abstract Review
#
# Every instance grounds ONLY in elements already declared in SCAFFOLD.yaml
# §1.1-§1.7. Deleting this file leaves the declared behaviour identical.
#
# Logical clock: POST /_clock/set_current_utc exists in §1.5 and the default
# clock is 2026-08-01T00:00:00Z, so EVERY chain below sets the clock explicitly
# as its first call rather than relying on the default.
#
# Nine rule_id blocks, 27 instances (3 per rule).
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  # RULE 1 — dual_variant_calc  (3 instances, three different entity domains:
  #          Abstract review scores / ProgramChangeRequest money /
  #          Conference CME minute credits)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: consensus_provisional_unweighted_vs_final_confidence_weighted_on_abstract
        grounds:
          - calculations.abstract_consensus_score
          - calculations.review_weighted_score
          - entities.Abstract.fields.provisional_score
          - entities.Abstract.fields.final_score
          - entities.Review.fields.confidence
          - state_machines.Conference.REVIEW_OPEN_to_REVIEW_CLOSED
        distinguishing_aspect: |
          The dual variant lives in the Abstract review-score domain: over the
          identical two-review input set the provisional variant ignores
          Review.confidence and yields 3.50 while the final variant applies
          CONFIDENCE_WEIGHT and yields 3.60, so provisional_score != final_score
          on the same row.
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z, well before abstract_deadline_utc."
            - "One Conference GOS26 driven to REVIEW_OPEN."
            - "One SubmissionCategory EDU with min_reviews_required 2 and discrepancy_threshold 4.00 so no DiscrepancyCase can open and block REVIEW_CLOSED."
            - "One Abstract by author Ada with two SUBMITTED reviews: weighted_score 4.00 at confidence HIGH and weighted_score 3.00 at confidence MEDIUM."
            - "Abstract already SCORED with provisional_score 3.50 and final_score still null."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: ConferenceAdmin
            - call: "POST /conferences"
              payload: { name: "Global Oncology Summit 2026", code: "GOS26", event_start_utc: "2026-09-01T08:00:00Z", event_end_utc: "2026-09-03T18:00:00Z", abstract_deadline_utc: "2026-03-01T23:59:00Z", review_deadline_utc: "2026-05-01T23:59:00Z", program_freeze_utc: "2026-08-15T00:00:00Z", oral_slot_capacity: 3, poster_slot_capacity: 2, workshop_slot_capacity: 1, cme_minutes_pool_total: 600 }
              as: ConferenceAdmin
              captures: { conf_id: "$.data.id" }
            - call: "POST /categories"
              payload: { conference_id: "${conf_id}", code: "EDU", name: "Education Research", max_word_count: 300, allowed_formats: ["ORAL", "POSTER"], requires_structured_body: false, min_reviews_required: 2, discrepancy_threshold: 4.00, cme_eligible: true }
              as: ConferenceAdmin
              captures: { cat_edu_id: "$.data.id" }
            - call: "POST /authors"
              payload: { full_name: "Ada Rivera", email: "ada@lab.example", affiliation: "Northline University" }
              as: ConferenceAdmin
              captures: { au_ada_id: "$.data.id" }
            - call: "POST /committee-members"
              payload: { conference_id: "${conf_id}", full_name: "Cho Bekele", email: "cho@panel.example", member_role: "CHAIR", expertise_keywords: ["oncology", "immunotherapy"], max_review_load: 4, calibration_bias: 0.00 }
              as: ConferenceAdmin
              captures: { mb_chair_id: "$.data.id" }
            - call: "POST /conflict-declarations"
              payload: { member_id: "${mb_chair_id}", conflict_subject_type: "NONE", conflict_type: "NONE" }
              as: ConferenceAdmin
            - call: "POST /committee-members/${mb_chair_id}/status-transitions"
              payload: { to_status: "ACTIVE" }
              as: ConferenceAdmin
            - call: "POST /committee-members"
              payload: { conference_id: "${conf_id}", full_name: "Rui Alvarez", email: "rui@panel.example", member_role: "REVIEWER", expertise_keywords: ["oncology", "imaging"], max_review_load: 4, calibration_bias: 0.00 }
              as: ConferenceAdmin
              captures: { mb_r1_id: "$.data.id" }
            - call: "POST /conflict-declarations"
              payload: { member_id: "${mb_r1_id}", conflict_subject_type: "NONE", conflict_type: "NONE" }
              as: ConferenceAdmin
            - call: "POST /committee-members/${mb_r1_id}/status-transitions"
              payload: { to_status: "ACTIVE" }
              as: ConferenceAdmin
            - call: "POST /committee-members"
              payload: { conference_id: "${conf_id}", full_name: "Mei Osei", email: "mei@panel.example", member_role: "REVIEWER", expertise_keywords: ["oncology", "immunotherapy"], max_review_load: 4, calibration_bias: 0.00 }
              as: ConferenceAdmin
              captures: { mb_r2_id: "$.data.id" }
            - call: "POST /conflict-declarations"
              payload: { member_id: "${mb_r2_id}", conflict_subject_type: "NONE", conflict_type: "NONE" }
              as: ConferenceAdmin
            - call: "POST /committee-members/${mb_r2_id}/status-transitions"
              payload: { to_status: "ACTIVE" }
              as: ConferenceAdmin
            - call: "POST /conferences/${conf_id}/status-transitions"
              payload: { to_status: "CFA_OPEN" }
              as: ConferenceAdmin
            - call: "POST /abstracts"
              payload: { conference_id: "${conf_id}", category_id: "${cat_edu_id}", submitting_author_id: "${au_ada_id}", title: "Immunotherapy response imaging", body_word_count: 280, requested_format: "ORAL", keywords: ["oncology", "immunotherapy", "imaging"], body_structured: true, coauthor_emails: ["ben@lab.example"], is_newsworthy: false }
              as: Author
              as_user_id: "${au_ada_id}"
              captures: { ab1_id: "$.data.id" }
            - call: "POST /conferences/${conf_id}/status-transitions"
              payload: { to_status: "CFA_CLOSED" }
              as: ConferenceAdmin
            - call: "POST /conferences/${conf_id}/status-transitions"
              payload: { to_status: "REVIEW_OPEN" }
              as: ConferenceAdmin
            - call: "POST /abstracts/${ab1_id}/review-assignments"
              payload: { reviewer_member_id: "${mb_r1_id}" }
              as: ProgramChair
              as_user_id: "${mb_chair_id}"
              captures: { rv1a_id: "$.data.id" }
            - call: "POST /abstracts/${ab1_id}/review-assignments"
              payload: { reviewer_member_id: "${mb_r2_id}" }
              as: ProgramChair
              as_user_id: "${mb_chair_id}"
              captures: { rv1b_id: "$.data.id" }
            - call: "POST /reviews/${rv1a_id}/submission"
              payload: { score_originality: 4, score_methodology: 4, score_relevance: 4, score_clarity: 4, confidence: "HIGH", recommended_format: "ORAL" }
              as: Reviewer
              as_user_id: "${mb_r1_id}"
            - call: "POST /reviews/${rv1b_id}/submission"
              payload: { score_originality: 3, score_methodology: 3, score_relevance: 3, score_clarity: 3, confidence: "MEDIUM", recommended_format: "POSTER" }
              as: Reviewer
              as_user_id: "${mb_r2_id}"
          trigger:
            - call: "POST /conferences/${conf_id}/status-transitions"
              payload: { to_status: "REVIEW_CLOSED" }
              as: ConferenceAdmin
          assert:
            - "Review.${rv1a_id}.weighted_score == 4.00"
            - "Review.${rv1b_id}.weighted_score == 3.00"
            - "Abstract.${ab1_id}.provisional_score == 3.50"
            - "Abstract.${ab1_id}.final_score == 3.60"
            - "Abstract.${ab1_id}.provisional_score != Abstract.${ab1_id}.final_score"
            - "Abstract.${ab1_id}.status == SCORED"
            - "Conference.${conf_id}.status == REVIEW_CLOSED"

      - name: change_fee_pre_freeze_estimate_vs_post_freeze_final_on_change_request
        grounds:
          - calculations.program_change_fee
          - entities.ProgramChangeRequest.fields.estimated_fee_cents
          - entities.ProgramChangeRequest.fields.final_fee_cents
          - entities.ProgramChangeRequest.fields.rush_pct_applied
          - state_machines.ProgramChangeRequest.PENDING_to_APPLIED
        distinguishing_aspect: |
          The dual variant lives in the ProgramChangeRequest money domain, not
          the score domain: for one SUBSTITUTE_PRESENTER request with
          days_to_event 5 submitted after program_freeze_utc, estimated_fee_cents
          is 3125 (ESTIMATE_RUSH_PCT 25, no surcharge) while final_fee_cents is
          5250 (FINAL_RUSH_PCT 50 plus POST_FREEZE_SURCHARGE_CENTS 1500).
        test_recipe:
          setup:
            - "Conference GOS26 driven to DECISIONS_RELEASED with one ACCEPTED-then-CONFIRMED ORAL abstract by Ada, coauthor email ben@lab.example."
            - "Author Ben Okafor exists with email ben@lab.example so he is an eligible substitute presenter."
            - "One PLANNED Session in room HALL-A 09:00-10:00 on event day 1 holding one SCHEDULED SessionSlot for the abstract, created while the clock is still before program_freeze_utc."
            - "Clock then advanced to 2026-08-27T08:00:00Z: after program_freeze_utc 2026-08-15 and exactly 5 days before event_start_utc 2026-09-01T08:00:00Z."
