              payload: { practice_id: "${prac_id}", full_name: "Val Verifier", role_type: "ANESTHESIA_MONITOR" }
              as: PracticeAdministrator
              captures: { verifier_id: $.data.id }
            - call: "POST /patients"
              payload: { practice_id: "${prac_id}", full_name: "Pat Stale", date_of_birth: "1980-03-15T00:00:00Z", asa_class: 2, airway_class: 2, weight_kg: 80 }
              as: SchedulingCoordinator
