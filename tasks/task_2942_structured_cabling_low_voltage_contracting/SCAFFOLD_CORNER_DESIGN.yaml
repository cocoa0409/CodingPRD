        distinguishing_aspect: "Priority 105 has two limbs and both are exercised on one link: a sequence_index 2 route on an unrelated root segment is refused because that segment's upstream_segment_id is not the segment at index 1, and a second sequence_index 2 route on the correct segment is refused as a duplicate index."
