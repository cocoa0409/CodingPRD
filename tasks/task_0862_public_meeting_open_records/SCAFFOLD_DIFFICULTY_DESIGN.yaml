            - "RecordsRequest.${req_id}.amount_paid_cents == 2000"
            - "RecordsRequest.${req_id}.fee_balance_cents == 0"

      - name: vote_tally_conservation_ballots
        grounds:
          - calculations.vote_tally
          - entities.Motion.fields.ballots
          - entities.Motion.fields.ballot_count
        distinguishing_aspect: "Conserved quantity = ballots: a member re-casts (YEA->NAY, an upsert not a new ballot), then a second member votes; yea+nay+abstain+recused always equals ballot_count (==2 distinct members), never double-counting the re-cast."
