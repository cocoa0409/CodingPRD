  # =======================================================================
  # CROSS-CUTTING COMPLEXITY LAYERS
  # =======================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: occ_stale_route_day_version_on_second_booking
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[appointment-create-stale-route-day]
          - validations[priority=29]
          - errors[ERR_STALE_ROUTE_DAY_VERSION]
        distinguishing_aspect: "Booking the first stop advances RouteDay.version, so a second strictly sequential booking still quoting the original version is rejected with 412 ERR_STALE_ROUTE_DAY_VERSION."
        test_recipe:
          setup: ["Two assessed UPRIGHT instruments at two ZONE_A addresses of one client, plus an APPRENTICE technician with an OPEN 2026-05-04 route day whose version was read before any booking."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { display_name: "OCC Client", email: "occ@example.com", phone: "555-0380", home_zone_code: "ZONE_A" }
              as: ShopManager
              captures: { cl_id: "$.data.id" }
            - call: "POST /locations"
              payload: { client_id: "${cl_id}", label: "A", zone_code: "ZONE_A", address_key: "occ-a", distance_miles_from_shop: 3.0 }
              as: ShopManager
              captures: { loc_a: "$.data.id" }
            - call: "POST /locations"
              payload: { client_id: "${cl_id}", label: "B", zone_code: "ZONE_A", address_key: "occ-b", distance_miles_from_shop: 4.0 }
              as: ShopManager
              captures: { loc_b: "$.data.id" }
