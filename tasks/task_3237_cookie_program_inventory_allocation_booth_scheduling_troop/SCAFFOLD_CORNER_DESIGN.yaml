              payload: { to_iso8601: "2027-01-10T00:00:00Z" }
              as: CouncilAdmin
            - call: "POST /cookie-program/seasons/${s_id}/orders"
              payload: { troop_id: "${t1}", kind: "INITIAL" }
              as: TroopLeader
              as_user_id: "${t1}"
              captures: { o_a: $.data.id }
            - call: "POST /cookie-program/seasons/${s_id}/orders/${o_a}/lines"
              payload: { product_id: "${p_tm}", package_qty: 40 }
              as: TroopLeader
              as_user_id: "${t1}"
            - call: "POST /cookie-program/seasons/${s_id}/orders/${o_a}/submit"
              payload: {}
              as: TroopLeader
              as_user_id: "${t1}"
            - call: "POST /cookie-program/seasons/${s_id}/orders/${o_a}/confirm"
              payload: {}
              as: CouncilAdmin
          trigger:
            - call: "GET /cookie-program/seasons/${s_id}"
              payload: {}
              as: CouncilAdmin
          assert:
            - "CookieSeason.${s_id}.initial_commit_units == 40 immediately after confirm"
            - "CookieSeason.${s_id}.pending_commit_units == 0 immediately after confirm"
            - "CookieSeason.${s_id}.remaining_units == 160"
