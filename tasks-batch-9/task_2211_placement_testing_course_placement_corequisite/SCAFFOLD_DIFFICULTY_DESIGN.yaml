              payload: { decision: "GRANT", decision_note: "Appeal granted by the reviewer of record." }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { app_state5: $.data.state, minted: $.data.minted_determination_id, decided5: $.data.decided_at }
          assert:
            - "${det_base} == 31.3 and ${det_owner} == \"staff-1\" (setup)"
            - "${app_state1} == \"UNDER_REVIEW\" and ${app_reviewer} == \"registrar-1\" (setup)"
            - "${err_pair} == \"ERR_APPEAL_NOT_ENDORSED\" with HTTP 409 — priority 8 wins over priority 11"
            - "${err_pair} != \"ERR_NOT_APPEAL_REVIEWER\" — hoisting the identity check above the state gate is the failure this instance detects"
            - "${err_state_alone} == \"ERR_APPEAL_NOT_ENDORSED\" with HTTP 409 — priority 8 in isolation, correct actor"
            - "${app_state2} == \"UNDER_REVIEW\" and ${app_decided2} == null — neither rejected decide wrote a decision"
            - "${app_state3} == \"INSTRUCTOR_ENDORSED\" and ${app_endorser} == \"instructor-1\""
            - "${err_binding_alone} == \"ERR_NOT_APPEAL_REVIEWER\" with HTTP 403 — priority 11 in isolation, once priority 8 is satisfied"
            - "${app_state4} == \"INSTRUCTOR_ENDORSED\" — the 403 is not a transition"
            - "${app_state5} == \"GRANTED\" and ${minted} != null and ${decided5} == \"2026-08-02T00:00:00Z\" — both rules satisfied"
            - "PlacementDetermination.${minted}.placed_course_id == \"${c_100}\" and PlacementDetermination.${det}.placement_state == \"SUPERSEDED\""

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: confidence_verify_threshold_seventy_exact_versus_one_tenth_below
        metric: "confidence_score (1 decimal place) against CONFIDENCE_VERIFY_MIN = 70.0, INCLUSIVE lower bound"
        endpoint: "POST /placement-determinations"
        grounds:
          - calculations.placement_base_confidence_score
          - calculations.placement_validity_window
          - entities.PlacementDetermination.fields.evidence_state
          - entities.PlacementDetermination.fields.validity_days
        distinguishing_aspect: |
          Two students separated by 0.01 of high-school GPA straddle the verify
          threshold, and the whole downstream shape flips with them. GPA 2.07
          gives a weighted transcript term of 25.875, which round_half_up at two
          decimals makes 25.88 and hence base 69.9 -> validity_days 180 and
          evidence UNVERIFIED; GPA 2.08 gives exactly 26.00 and hence base 70.0
          -> validity_days 365 and evidence VERIFIED, because the threshold is
          INCLUSIVE. Round-half-even, or rounding once at the end instead of
          per weighted term, or an exclusive comparison, each move the boundary.
        test_recipe:
          setup:
            - "Logical clock left at its startup default 2026-08-01T00:00:00Z."
            - "Course MATH-100 and exactly one ACTIVE PlacementRule TRANSCRIPT_GPA -> MATH-100 (min_hs_gpa 2.0, V1). No TEST_SCORE rule exists, so measure_type_used is TRANSCRIPT_GPA for both students even though both have a scored attempt."
            - "Session T01, proctor-1, 2026-08-01T00:00:00Z-02:00:00Z, seat_capacity 5, OPEN."
            - "Student SN: hs_gpa 2.07 VERIFIED, transcript_recorded_at 2025-06-01T00:00:00Z, self_guided_pathway BSTEM, one attempt raw_score 160 -> scaled_score 1000."
            - "Student SO: identical except hs_gpa 2.08."
            - "Component arithmetic for SN: t = round(2.07/4*100, 2) = 51.75; s = round(1000/1000*100, 2) = 100.00; g = 60.0. wt = round(25.875, 2) = 25.88; ws = 35.00; wg = 9.00; base = round(69.88, 1) = 69.9."
            - "Component arithmetic for SO: t = 52.00; wt = 26.00; ws = 35.00; wg = 9.00; base = round(70.00, 1) = 70.0."
            - "Staleness for SN: validity_days 180 -> expires_at 2027-01-28T00:00:00Z -> d = 606 < 1095 -> penalty 0.0. For SO: validity_days 365 -> expires_at 2027-08-01T00:00:00Z -> d = 791 < 1095 -> penalty 0.0. Both confidence_scores therefore equal their base."
          setup_api_calls:
            - call: "POST /courses"
              payload: { course_code: "MATH-100", title: "College Algebra", subject_area: "MATH", level_rank: 100, units: 4.0, is_support_course: false, transfer_level: true }
              as: SystemAdmin
              as_user_id: "admin-1"
