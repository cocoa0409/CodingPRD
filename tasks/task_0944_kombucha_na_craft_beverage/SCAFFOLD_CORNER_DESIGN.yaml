        grounds:
          - entities.Vessel
          - endpoints[POST /vessels/{id}/cip-start]
          - endpoints[POST /vessels/{id}/cip-complete]
        distinguishing_aspect: "A freshly created Vessel is at version 1; cip-start takes it to 2 and cip-complete to 3, one increment per mutating call and none for reads."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /vessels"
              payload: { code: "FV-32", capacity_liters: 250.0 }
              as: ProductionOperator
              captures: { v_id: $.data.id, v0: $.data.version }
          trigger:
            - call: "POST /vessels/${v_id}/cip-start"
              payload: {}
              as: ProductionOperator
              captures: { v1: $.data.version }
            - call: "POST /vessels/${v_id}/cip-complete"
              payload: {}
              as: ProductionOperator
              captures: { v2: $.data.version }
            - call: "GET /vessels/${v_id}"
              payload: {}
              as: ProductionOperator
          assert:
            - "the created Vessel's version == 1"
            - "after cip-start, Vessel.${v_id}.version == 2 and state == CIP_IN_PROGRESS"
            - "after cip-complete, Vessel.${v_id}.version == 3 and state == SANITIZED"
            - "the trailing GET leaves Vessel.${v_id}.version at 3"

