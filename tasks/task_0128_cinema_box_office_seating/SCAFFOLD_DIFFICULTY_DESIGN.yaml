            - call: "POST /showtimes/${stx_id}/orders"
              payload: { member_id: "${m_id}", seat_ids: ["${sx0}"], expected_showtime_version: "${stx_v}" }
              as: BoxOfficeAgent
              captures: { ordx: "$.data.id" }
          trigger:
            - call: "POST /showtimes/${sty_id}/orders"
              payload: { member_id: "${m_id}", seat_ids: ["${sy0}"], expected_showtime_version: "${sty_v}" }
              as: BoxOfficeAgent
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_MEMBER_DOUBLE_BOOKED"
            - "HTTP status 409 (showtimes 20:00–21:45 and 20:30–22:15 overlap, zero buffer)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: seat_count_conserved_across_pay_then_refund
        grounds:
          - state_machines.Order.HELD_to_PAID
          - state_machines.Order.PAID_to_REFUNDED
          - entities.Showtime.fields.seats_sold
          - entities.Seat.fields.occupancy
        distinguishing_aspect: |
          Conserved quantity = seat-map cardinality: for any showtime,
          (count FREE seats) + seats_held + seats_sold == auditorium.seat_count at
          all times. A pay (forward) then refund (compensating) on the same order
          leaves the showtime with seats_sold == 0 and FREE seat count == seat_count.
        test_recipe:
          setup:
            - "Auditorium of 4 seats; one order on 2 seats paid then refunded"
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "Acme Films", minimum_guarantee_cents: 0 }
              as: CinemaManager
              captures: { dist_id: "$.data.id" }
            - call: "POST /films"
              payload: { title: "F", runtime_minutes: 90, distributor_id: "${dist_id}", release_date: "2026-06-01T00:00:00.000Z", split_schedule: [ { week_index: 0, distributor_pct: 0.70 } ] }
              as: CinemaManager
              captures: { film_id: "$.data.id" }
            - call: "POST /auditoriums"
              payload: { name: "Hall 1", seat_count: 4, turnaround_minutes: 20 }
              as: CinemaManager
              captures: { aud_id: "$.data.id" }
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-02T09:00:00.000Z" }
              as: CinemaManager
            - call: "POST /auditoriums/${aud_id}/showtimes"
              payload: { film_id: "${film_id}", starts_at: "2026-06-10T20:00:00.000Z", pricing_profile: "STANDARD", base_price_cents: 1000 }
              as: CinemaManager
              captures: { st_id: "$.data.id" }
            - call: "POST /showtimes/${st_id}/open"
              payload: {}
              as: CinemaManager
              captures: { st_v: "$.data.version" }
            - call: "GET /showtimes/${st_id}/seats"
              payload: {}
              as: CinemaManager
              captures: { sa: "$.data[0].id", sb: "$.data[1].id" }
            - call: "POST /members"
              payload: { email: "m@x.com", full_name: "M" }
              as: CinemaManager
              captures: { m_id: "$.data.id" }
            - call: "POST /showtimes/${st_id}/orders"
              payload: { member_id: "${m_id}", seat_ids: ["${sa}", "${sb}"], expected_showtime_version: "${st_v}" }
              as: BoxOfficeAgent
              captures: { ord_id: "$.data.id" }
            - call: "POST /orders/${ord_id}/pay"
              payload: {}
              as: BoxOfficeAgent
          trigger:
            - call: "POST /orders/${ord_id}/refund"
              payload: { refund_destination: "ORIGINAL" }
              as: BoxOfficeAgent
          assert:
            - "GET /showtimes/${st_id}: seats_sold == 0 and seats_held == 0"
            - "GET /showtimes/${st_id}/seats: all 4 seats occupancy == FREE"

      - name: loyalty_points_conserved_across_accrue_then_reverse
        grounds:
          - calculations.loyalty_accrual_and_tier
          - state_machines.Order.HELD_to_PAID
          - state_machines.Order.PAID_to_REFUNDED
          - entities.Member.fields.loyalty_points
        distinguishing_aspect: |
          Conserved quantity = loyalty points (a different conserved quantity than
          seat-map cardinality): paying an order accrues +N points and refunding
          it subtracts exactly N, so the member's loyalty_points returns to its
          pre-order value (0 here) with zero drift.
        test_recipe:
          setup:
            - "Member M at 0 points; one order on 2 STANDARD seats base 2500 (subtotal 5000 -> +50), paid then refunded"
          setup_api_calls:
            - call: "POST /distributors"
