# =============================================================================
# Retail Loss Prevention & Shrink Case Management — benchmark seed tables
# =============================================================================

scenario: |
  Retail Loss Prevention & Shrink Case Management (retailer LP department): exception-based
  transaction alerting, case creation & interview documentation, civil demand & restitution,
  organized-retail-crime linkage across stores, evidence & video retention chain, employee vs
  external case routing, shrink accrual & physical inventory variance, law-enforcement
  referral packet.

domain_name: retail-loss-prevention
api_prefix: /

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: branching   # case fork + referral-packet cycle + group escalation cycle + payment reversal
  relationship_patterns:
    - one_to_many
    - many_to_many        # CaseLink junction between Case and OrcGroup
    - self_referential    # Case.merged_into_case_id
    - cross_aggregate     # case loss postings into ShrinkPeriod; alert -> case conversion
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Store
    parent: null
    common_fields: true
    fields:
      - { name: store_number, type: string, source: input, description: "Public store number; unique across the enterprise" }
      - { name: name, type: string, source: input, description: "Store display name" }
      - { name: region_code, type: string, source: input, description: "Region grouping used for ORC cross-store analysis" }
      - { name: status, type: enum, source: system, description: "ACTIVE | CLOSED" }
      - { name: total_adjudicated_loss_cents, type: integer, source: computed, description: "Sum of loss amounts posted by SUBSTANTIATED adjudications of cases at this store, net of reopen reversals" }
      - { name: restitution_collected_cents, type: integer, source: computed, description: "Sum over this store's demands of (POSTED payment amounts minus RETURNED payment amounts)" }

  - name: Employee
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; home store of the associate" }
      - { name: employee_ref, type: string, source: input, description: "Badge / HR reference; unique across the enterprise" }
      - { name: full_name, type: string, source: input, description: "Employee legal name" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | TERMINATED" }
      - { name: prior_substantiated_count, type: integer, source: computed, description: "Count of cases CLOSED_SUBSTANTIATED against this employee, net of reopen reversals" }

  - name: PosExceptionEvent
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; store where the exception occurred" }
      - { name: register_ref, type: string, source: input, description: "Register / lane identifier" }
      - { name: employee_id, type: string, source: input, description: "FK -> Employee.id; cashier of record, null for self-checkout or unattributed events", required: false }
      - { name: txn_ref, type: string, source: input, description: "POS transaction reference" }
      - { name: exception_type, type: enum, source: input, description: "REFUND_NO_RECEIPT | HIGH_VALUE_VOID | PRICE_OVERRIDE | NO_SALE_DRAWER | SUSPEND_CANCEL | SWEETHEART_SCAN | SELF_CHECKOUT_MISMATCH" }
      - { name: amount_cents, type: integer, source: input, description: "Transaction exception value; must be > 0" }
      - { name: occurred_at, type: datetime, source: input, description: "POS timestamp of the exception (feed-provided)" }
      - { name: status, type: enum, source: system, description: "UNAGGREGATED | AGGREGATED" }

  - name: Alert
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: system, description: "FK -> Store.id; store whose events aggregated into this alert" }
      - { name: employee_id, type: string, source: system, description: "FK -> Employee.id; grouping key employee, null for unattributed group", required: false }
      - { name: subject_type, type: enum, source: computed, description: "EMPLOYEE when employee_id set, else UNKNOWN" }
      - { name: score, type: number, source: computed, description: "Weighted exception score, 2 decimal places" }
      - { name: event_count, type: integer, source: computed, description: "Number of member events" }
      - { name: total_amount_cents, type: integer, source: computed, description: "Sum of member event amount_cents" }
      - { name: window_start, type: datetime, source: computed, description: "Earliest member event occurred_at" }
      - { name: window_end, type: datetime, source: computed, description: "Latest member event occurred_at" }
      - { name: status, type: enum, source: system, description: "OPEN | ESCALATED | CONVERTED | DISMISSED" }
      - { name: case_id, type: string, source: system, description: "FK -> Case.id; set when converted", required: false }
      - { name: dismiss_reason, type: string, source: input, description: "Reason recorded at dismissal", required: false }

  - name: Case
    parent: null
    common_fields: true
    fields:
      - { name: case_number, type: string, source: system, description: "Server-minted display number: LP-<store_number>-<zero-padded per-store sequence>" }
      - { name: store_id, type: string, source: system, description: "FK -> Store.id; originating store (input on manual create, derived from alert on convert)" }
      - { name: source, type: enum, source: system, description: "ALERT | MANUAL | SHRINK_VARIANCE" }
      - { name: subject_type, type: enum, source: input, description: "EMPLOYEE | EXTERNAL | UNKNOWN" }
      - { name: employee_id, type: string, source: input, description: "FK -> Employee.id; required iff subject_type=EMPLOYEE, must be null otherwise", required: false }
      - { name: status, type: enum, source: system, description: "OPEN | INVESTIGATING | READY_FOR_INTERVIEW | INTERVIEWED | ADJUDICATING | CLOSED_SUBSTANTIATED | CLOSED_UNSUBSTANTIATED | CLOSED_REFERRED | MERGED" }
      - { name: created_by, type: string, source: system, description: "X-User-ID of the creator (segregation-of-duties anchor)" }
      - { name: assigned_analyst_id, type: string, source: system, description: "Opaque LPAnalyst user id assigned by LPManager", required: false }
      - { name: manual_loss_cents, type: integer, source: input, description: "Analyst-estimated loss for MANUAL cases; 0 for alert-sourced cases; |variance| for shrink cases" }
      - { name: recovered_value_cents, type: integer, source: input, description: "Recovered merchandise value recorded at advance" }
      - { name: total_loss_cents, type: integer, source: computed, description: "max(0, member-alert event sum + manual_loss_cents - recovered_value_cents)" }
      - { name: priority, type: enum, source: computed, description: "STANDARD | HIGH — HIGH when any source alert ESCALATED or any CONFIRMED link to an ACTIVE_MONITORING group" }
      - { name: restitution_status, type: enum, source: computed, description: "NONE | OUTSTANDING | SETTLED — NONE when no issued demand or restitution waived; else derived from demand outstanding" }
      - { name: loss_posted_period_id, type: string, source: system, description: "FK -> ShrinkPeriod.id; period the adjudicated loss posted to", required: false }
      - { name: loss_posted_cents, type: integer, source: system, description: "Loss amount posted to shrink period at SUBSTANTIATED adjudication; 0 until posted or after reopen reversal" }
      - { name: adjudicated_at, type: datetime, source: system, description: "Logical-clock timestamp of adjudication decision", required: false }
      - { name: adjudicated_by, type: string, source: system, description: "X-User-ID of adjudicator", required: false }
      - { name: closed_at, type: datetime, source: system, description: "Logical-clock timestamp of closure (any CLOSED_* state)", required: false }
      - { name: merged_into_case_id, type: string, source: system, description: "FK -> Case.id; surviving case when MERGED", required: false }

  - name: Interview
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; case under investigation" }
      - { name: interviewer_id, type: string, source: input, description: "Opaque LPAnalyst user id who will conduct the interview" }
      - { name: subject_employee_id, type: string, source: input, description: "FK -> Employee.id; employee being interviewed (employee-subject cases)", required: false }
      - { name: scheduled_start, type: datetime, source: input, description: "Interview window start (half-open interval start)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Interview window end (exclusive); must be after scheduled_start" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | HELD | NO_SHOW | CANCELLED | DOCUMENTED" }
      - { name: outcome, type: enum, source: input, description: "ADMITTED | DENIED | PARTIAL — recorded at outcome capture", required: false }
      - { name: conducted_at, type: datetime, source: system, description: "Logical-clock timestamp when outcome recorded", required: false }
      - { name: notes, type: string, source: input, description: "Documentation notes filed at document step", required: false }
      - { name: documented_at, type: datetime, source: system, description: "Logical-clock timestamp when documented", required: false }
      - { name: doc_stale, type: boolean, source: computed, description: "true when documented_at - conducted_at > 72 hours (strictly greater)" }

  - name: EvidenceItem
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; case the evidence supports" }
      - { name: evidence_type, type: enum, source: input, description: "VIDEO_CLIP | TRANSACTION_LOG | PHOTO | WRITTEN_STATEMENT | AUDIO" }
      - { name: captured_at, type: datetime, source: input, description: "When the evidence was captured" }
      - { name: retention_class, type: enum, source: input, description: "STANDARD (90d) | EXTENDED (365d) | CASE_HOLD (case.closed_at + 30d, never while case open)" }
      - { name: retention_until, type: datetime, source: computed, description: "Earliest expiry instant per retention_class rules" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SEALED | RELEASED | EXPIRED | PURGED" }
      - { name: sealed_by, type: string, source: system, description: "X-User-ID that sealed the item", required: false }
      - { name: legal_hold, type: boolean, source: system, description: "true while a ReferralPacket for the case is SUBMITTED or ACKNOWLEDGED" }

  - name: CustodyEvent
    parent: null
    common_fields: false
    fields:
      - { name: evidence_id, type: string, source: input, description: "FK -> EvidenceItem.id; evidence item whose chain is extended" }
      - { name: action, type: enum, source: input, description: "COLLECTED | SEALED | ACCESSED | TRANSFERRED | RELEASED_TO_LE | RETURNED_FROM_LE" }
      - { name: actor_id, type: string, source: system, description: "X-User-ID performing the custody action" }
      - { name: note, type: string, source: input, description: "Free-text custody note", required: false }

  - name: CivilDemand
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; case the demand arises from" }
      - { name: basis, type: enum, source: input, description: "STATUTORY | ACTUAL_LOSS — ACTUAL_LOSS only basis allowed for EMPLOYEE-subject cases" }
      - { name: priors_offense_count, type: integer, source: input, description: "Recorded prior offenses for EXTERNAL subjects (EMPLOYEE subjects derive it from Employee.prior_substantiated_count)", default: 0 }
      - { name: recovery_cost_cents, type: integer, source: input, description: "Documented recovery costs added to the demand", default: 0 }
      - { name: merchandise_loss_cents, type: integer, source: computed, description: "Snapshot of Case.total_loss_cents at issuance" }
      - { name: statutory_penalty_cents, type: integer, source: computed, description: "Tiered statutory penalty after prior-offense multiplier; 0 for ACTUAL_LOSS basis" }
      - { name: amount_due_cents, type: integer, source: computed, description: "merchandise_loss + statutory_penalty + recovery_cost (ACTUAL_LOSS: merchandise_loss + recovery_cost)" }
      - { name: fees_incurred_cents, type: integer, source: computed, description: "2500 cents per RETURNED payment" }
      - { name: paid_to_date_cents, type: integer, source: computed, description: "Sum of POSTED payment amounts minus sum of RETURNED payment amounts" }
      - { name: outstanding_cents, type: integer, source: computed, description: "amount_due_cents + fees_incurred_cents - paid_to_date_cents" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | PARTIALLY_PAID | PAID_IN_FULL | WRITTEN_OFF | CANCELLED" }
      - { name: created_by, type: string, source: system, description: "X-User-ID of the drafting analyst (segregation-of-duties anchor)" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock timestamp of issuance", required: false }

  - name: RestitutionPayment
    parent: null
    common_fields: true
    fields:
      - { name: demand_id, type: string, source: input, description: "FK -> CivilDemand.id; demand the payment applies to" }
      - { name: amount_cents, type: integer, source: input, description: "Tendered amount; must be > 0 and <= demand outstanding at posting" }
      - { name: method, type: enum, source: input, description: "CASH | CARD | MONEY_ORDER | PAYROLL_DEDUCT" }
      - { name: status, type: enum, source: system, description: "RECEIVED | POSTED | RETURNED" }
      - { name: applied_fees_cents, type: integer, source: computed, description: "Waterfall allocation to NSF fees at posting" }
      - { name: applied_penalty_cents, type: integer, source: computed, description: "Waterfall allocation to statutory penalty at posting" }
      - { name: applied_merch_cents, type: integer, source: computed, description: "Waterfall allocation to merchandise loss + recovery cost at posting" }

  - name: OrcGroup
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Group moniker; unique across the enterprise" }
      - { name: description, type: string, source: input, description: "Free-text modus operandi notes", required: false }
      - { name: status, type: enum, source: system, description: "IDENTIFIED | ACTIVE_MONITORING | DISRUPTED | DISMISSED" }
      - { name: confirmed_case_count, type: integer, source: computed, description: "Count of CONFIRMED CaseLinks" }
      - { name: distinct_store_count, type: integer, source: computed, description: "Count of distinct Store ids among CONFIRMED-linked cases" }
      - { name: exposure_cents, type: integer, source: computed, description: "Sum of total_loss_cents over CONFIRMED-linked cases" }

  - name: CaseLink
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; case being linked" }
      - { name: orc_group_id, type: string, source: input, description: "FK -> OrcGroup.id; group the case is linked to" }
      - { name: link_score, type: integer, source: input, description: "Analyst confidence 0-100" }
      - { name: status, type: enum, source: system, description: "PROPOSED | CONFIRMED | REJECTED" }

  - name: ShrinkPeriod
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; store whose inventory period this is" }
      - { name: period_start, type: datetime, source: input, description: "Period start date (closed interval start, 00:00:00Z)" }
      - { name: period_end, type: datetime, source: input, description: "Period end date (closed interval end, 23:59:59Z); must be >= period_start" }
      - { name: book_inventory_cents, type: integer, source: input, description: "Book inventory value at period end per merchandising feed; must be > 0" }
      - { name: period_sales_cents, type: integer, source: input, description: "Net sales for the period; must be >= 0" }
      - { name: counted_inventory_cents, type: integer, source: system, description: "Physical count value recorded at record-count", required: false }
      - { name: counted_at, type: datetime, source: system, description: "Logical-clock timestamp of latest accepted count", required: false }
      - { name: known_loss_posted_cents, type: integer, source: computed, description: "Sum of case loss postings to this period, net of reopen reversals" }
      - { name: accrual_case_basis_cents, type: integer, source: computed, description: "Accrual variant A: equals known_loss_posted_cents" }
      - { name: accrual_sales_basis_cents, type: integer, source: computed, description: "Accrual variant B: round_half_up(period_sales_cents * 0.0125)" }
      - { name: variance_cents, type: integer, source: computed, description: "counted_inventory_cents - (book_inventory_cents - known_loss_posted_cents); snapshot at reconcile" }
      - { name: variance_pct, type: number, source: computed, description: "variance_cents / book_inventory_cents, 4 decimal places", required: false }
      - { name: status, type: enum, source: system, description: "OPEN | COUNTED | RECONCILED | CLOSED" }
      - { name: auto_case_id, type: string, source: system, description: "FK -> Case.id; shrink-investigation case auto-created on variance breach", required: false }

  - name: ReferralPacket
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; case being referred to law enforcement" }
      - { name: jurisdiction_code, type: string, source: input, description: "Law-enforcement jurisdiction identifier" }
      - { name: status, type: enum, source: system, description: "DRAFT | SEALED | SUBMITTED | ACKNOWLEDGED | RETURNED" }
      - { name: packet_exposure_cents, type: integer, source: computed, description: "Case.total_loss_cents snapshot at seal time" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock timestamp of submission", required: false }
      - { name: return_reason, type: string, source: input, description: "LE rationale when outcome=RETURNED at acknowledge", required: false }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Store
    field: status
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /stores/{store_id}/close"
        actor: LPAdmin
        preconditions:
          - "Store must be ACTIVE (ERR_INVALID_STATE_TRANSITION)"
          - "No ShrinkPeriod for this store in OPEN or COUNTED status (ERR_PERIOD_LOCKED)"
        side_effects:
          - "Blocks creation of employees, events, cases, periods for this store (ERR_STORE_CLOSED)"

  - entity: Employee
    field: status
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /employees/{employee_id}/suspend"
        actor: HRPartner
        preconditions:
          - "Employee must be ACTIVE (ERR_INVALID_STATE_TRANSITION)"
        side_effects: []

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /employees/{employee_id}/reinstate"
        actor: HRPartner
        preconditions:
          - "Employee must be SUSPENDED (ERR_INVALID_STATE_TRANSITION)"
        side_effects: []

      - from: ACTIVE
        to: TERMINATED
        trigger: "system (Case adjudicated SUBSTANTIATED with employment_action=TERMINATE)"
        actor: system
        preconditions: []
        side_effects:
          - "Blocks new EMPLOYEE-subject cases and new interviews for this employee (ERR_EMPLOYEE_NOT_ACTIVE)"

      - from: SUSPENDED
        to: TERMINATED
        trigger: "system (Case adjudicated SUBSTANTIATED with employment_action=TERMINATE)"
        actor: system
        preconditions: []
        side_effects:
          - "Same as ACTIVE -> TERMINATED"

  - entity: Alert
    field: status
    initial_state: OPEN
    terminal_states: [CONVERTED, DISMISSED]
    transitions:
      - from: OPEN
        to: ESCALATED
        trigger: "system (score recomputed >= 75.00 after event attach, or alert created with candidate score >= 75.00)"
        actor: system
        preconditions:
          - "score >= 75.00 (boundary is inclusive)"
        side_effects:
          - "Dismissal of this alert now requires LPManager"
          - "Any Case later converted from this alert is computed priority HIGH"

      - from: OPEN
        to: DISMISSED
        trigger: "POST /alerts/{alert_id}/dismiss"
        actor: LPAnalyst
        preconditions:
          - "Alert must be OPEN (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "All member PosExceptionEvents revert AGGREGATED -> UNAGGREGATED (released for re-aggregation)"

      - from: ESCALATED
        to: DISMISSED
        trigger: "POST /alerts/{alert_id}/dismiss"
        actor: LPManager
        preconditions:
          - "Alert must be ESCALATED (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "All member PosExceptionEvents revert AGGREGATED -> UNAGGREGATED"

      - from: OPEN
        to: CONVERTED
        trigger: "POST /alerts/{alert_id}/convert"
        actor: LPAnalyst
        preconditions:
          - "Alert must be OPEN or ESCALATED (ERR_INVALID_STATE_TRANSITION)"
          - "Store must be ACTIVE (ERR_STORE_CLOSED)"
          - "subject_type=EMPLOYEE requires alert.employee_id non-null, payload employee_id equal to alert.employee_id, and that employee not TERMINATED (ERR_SUBJECT_MISMATCH / ERR_EMPLOYEE_NOT_ACTIVE)"
        side_effects:
          - "Creates Case (source=ALERT, store_id=alert.store_id); alert.case_id set"
          - "Each additional_alert_ids alert (must be OPEN|ESCALATED, same store) also -> CONVERTED pointing at the new case"
          - "Member events stay AGGREGATED (now owned by the case's loss computation)"

      - from: ESCALATED
        to: CONVERTED
        trigger: "POST /alerts/{alert_id}/convert"
        actor: LPAnalyst
        preconditions:
          - "Same as OPEN -> CONVERTED"
        side_effects:
          - "Same as OPEN -> CONVERTED; resulting Case.priority is HIGH"

  - entity: Case
    field: status
    initial_state: OPEN
    terminal_states: [CLOSED_REFERRED, MERGED]
    transitions:
      - from: OPEN
        to: INVESTIGATING
        trigger: "POST /cases/{case_id}/assign"
        actor: LPManager
        preconditions:
          - "Case must be OPEN (ERR_INVALID_STATE_TRANSITION)"
          - "assigned analyst_id must differ from case.created_by is NOT required; assignee becomes the investigating analyst"
        side_effects:
          - "assigned_analyst_id set"

      - from: INVESTIGATING
        to: READY_FOR_INTERVIEW
        trigger: "POST /cases/{case_id}/advance"
        actor: LPAnalyst
        preconditions:
          - "Actor must equal assigned_analyst_id (ERR_NOT_CASE_ASSIGNEE)"
          - "Case must be INVESTIGATING (ERR_INVALID_STATE_TRANSITION)"
          - "At least one EvidenceItem for the case with status ACTIVE or SEALED (ERR_NO_ACTIVE_EVIDENCE)"
          - "recovered_value_cents <= member-alert event sum + manual_loss_cents (ERR_RECOVERED_EXCEEDS_LOSS)"
        side_effects:
          - "recovered_value_cents recorded; total_loss_cents recomputed"

      - from: READY_FOR_INTERVIEW
        to: INTERVIEWED
        trigger: "system (an Interview on this case reaches DOCUMENTED)"
        actor: system
        preconditions:
          - "The documenting interview belongs to this case and reaches DOCUMENTED"
        side_effects: []

      - from: INTERVIEWED
        to: ADJUDICATING
        trigger: "POST /cases/{case_id}/advance"
        actor: LPAnalyst
        preconditions:
          - "Actor must equal assigned_analyst_id (ERR_NOT_CASE_ASSIGNEE)"
          - "Case must be INTERVIEWED (ERR_INVALID_STATE_TRANSITION) — reachable only via a DOCUMENTED interview, so the documentation gate is structural"
          - "subject_type must be EMPLOYEE or EXTERNAL (ERR_SUBJECT_UNRESOLVED)"
        side_effects: []

      - from: ADJUDICATING
        to: CLOSED_SUBSTANTIATED
        trigger: "POST /cases/{case_id}/adjudicate with decision=SUBSTANTIATED"
        actor: "HRPartner (EMPLOYEE subject) | LPManager (EXTERNAL subject)"
        preconditions:
          - "Role routing: EMPLOYEE-subject cases adjudicated only by HRPartner, EXTERNAL only by LPManager (ERR_FORBIDDEN_FOR_ROLE)"
          - "Actor must not equal the interviewer_id of any DOCUMENTED interview on this case (ERR_SOD_INTERVIEWER_ADJUDICATOR)"
          - "Actor must not equal case.created_by (ERR_SOD_CASE_CREATOR)"
          - "Latest DOCUMENTED interview must have doc_stale=false unless documentation_override=true (ERR_INTERVIEW_DOC_STALE)"
          - "A CivilDemand for the case must exist in DRAFT, ISSUED, PARTIALLY_PAID, or PAID_IN_FULL status unless restitution_waived=true (ERR_DEMAND_REQUIRED)"
        side_effects:
          - "adjudicated_at/adjudicated_by/closed_at stamped"
          - "loss_posted_cents = total_loss_cents; posted to the store's ShrinkPeriod whose [period_start, period_end] contains now with status OPEN or COUNTED; none eligible -> ERR_NO_OPEN_PERIOD; that period's known_loss_posted_cents increases (link 1)"
          - "That period's accrual_case_basis_cents recomputes (link 2)"
          - "Store.total_adjudicated_loss_cents increases by loss_posted_cents (link 3)"
          - "If EMPLOYEE subject: Employee.prior_substantiated_count += 1; employment_action=TERMINATE -> Employee -> TERMINATED; SUSPEND -> Employee -> SUSPENDED"
          - "restitution_status -> OUTSTANDING unless waived (then NONE)"

      - from: ADJUDICATING
        to: CLOSED_UNSUBSTANTIATED
        trigger: "POST /cases/{case_id}/adjudicate with decision=UNSUBSTANTIATED"
        actor: "HRPartner (EMPLOYEE subject) | LPManager (EXTERNAL subject)"
        preconditions:
          - "Same role routing and SoD preconditions as SUBSTANTIATED"
          - "Latest DOCUMENTED interview must have doc_stale=false unless documentation_override=true (ERR_INTERVIEW_DOC_STALE)"
        side_effects:
          - "adjudicated_at/adjudicated_by/closed_at stamped"
          - "Any DRAFT CivilDemand for the case -> CANCELLED"

      - from: INVESTIGATING
        to: CLOSED_UNSUBSTANTIATED
        trigger: "POST /cases/{case_id}/dismiss"
        actor: LPManager
        preconditions:
          - "Case must be INVESTIGATING (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "closed_at stamped (early closure for insufficient evidence; no interview or demand required)"

      - from: CLOSED_SUBSTANTIATED
        to: INVESTIGATING
        trigger: "POST /cases/{case_id}/reopen"
        actor: LPManager
        preconditions:
          - "Case must be CLOSED_SUBSTANTIATED or CLOSED_UNSUBSTANTIATED (ERR_INVALID_STATE_TRANSITION)"
          - "now <= closed_at + 30 days (ERR_REOPEN_WINDOW_CLOSED)"
          - "If loss_posted_period_id set: that period must be OPEN or COUNTED (ERR_PERIOD_LOCKED)"
          - "No RestitutionPayment with status POSTED on any demand of the case (ERR_CASE_HAS_PAYMENTS)"
        side_effects:
          - "If loss_posted_cents > 0: ShrinkPeriod.known_loss_posted_cents -= loss_posted_cents (link 1), accrual_case_basis_cents recomputes (link 2), Store.total_adjudicated_loss_cents -= loss_posted_cents (link 3); loss_posted_cents reset to 0"
          - "If EMPLOYEE subject: Employee.prior_substantiated_count -= 1"
          - "Any DRAFT CivilDemand -> CANCELLED; ISSUED/PARTIALLY_PAID demands remain"
          - "closed_at cleared; restitution_status recomputed"

      - from: CLOSED_UNSUBSTANTIATED
        to: INVESTIGATING
        trigger: "POST /cases/{case_id}/reopen"
        actor: LPManager
        preconditions:
          - "Same as CLOSED_SUBSTANTIATED -> INVESTIGATING except no loss-posting reversal applies (none was posted)"
        side_effects:
          - "closed_at cleared"

      - from: CLOSED_SUBSTANTIATED
        to: CLOSED_REFERRED
        trigger: "POST /cases/{case_id}/close-referred"
        actor: LPManager
        preconditions:
          - "Case must be CLOSED_SUBSTANTIATED (ERR_INVALID_STATE_TRANSITION)"
          - "A ReferralPacket for this case must be ACKNOWLEDGED (ERR_CASE_NOT_REFERRABLE)"
        side_effects: []

      - from: INVESTIGATING
        to: MERGED
        trigger: "POST /cases/{case_id}/merge"
        actor: LPManager
        preconditions:
          - "Source case must be INVESTIGATING or READY_FOR_INTERVIEW (ERR_MERGE_NOT_ALLOWED)"
          - "target_case_id must exist, differ from source id, and be non-terminal and not MERGED (ERR_MERGE_NOT_ALLOWED)"
        side_effects:
          - "merged_into_case_id = target; source alerts re-pointed (Alert.case_id = target)"
          - "Source EvidenceItems re-parented to target (case_id rewritten)"
          - "Source SCHEDULED interviews -> CANCELLED; HELD/DOCUMENTED interviews remain on source for audit"
          - "Source DRAFT CivilDemands -> CANCELLED"
          - "Target.manual_loss_cents += source.manual_loss_cents; target.recovered_value_cents += source.recovered_value_cents; target.total_loss_cents recomputed"

      - from: READY_FOR_INTERVIEW
        to: MERGED
        trigger: "POST /cases/{case_id}/merge"
        actor: LPManager
        preconditions:
          - "Same as INVESTIGATING -> MERGED"
        side_effects:
          - "Same as INVESTIGATING -> MERGED"

    note: "POST /cases/{case_id}/resolve-subject updates subject_type/employee_id without a status change (allowed from INVESTIGATING or READY_FOR_INTERVIEW); it is how UNKNOWN-subject cases (e.g., SHRINK_VARIANCE auto-cases) become adjudicable."

  - entity: Interview
    field: status
    initial_state: SCHEDULED
    terminal_states: [NO_SHOW, CANCELLED, DOCUMENTED]
    transitions:
      - from: SCHEDULED
        to: HELD
        trigger: "POST /interviews/{interview_id}/record-outcome with outcome in {ADMITTED, DENIED, PARTIAL}"
        actor: LPAnalyst
        preconditions:
          - "Actor must equal interview.interviewer_id (ERR_INTERVIEWER_MISMATCH)"
          - "Interview must be SCHEDULED (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "conducted_at stamped from logical clock"

      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /interviews/{interview_id}/record-outcome with outcome=NO_SHOW"
        actor: LPAnalyst
        preconditions:
          - "Actor must equal interviewer_id (ERR_INTERVIEWER_MISMATCH)"
          - "Interview must be SCHEDULED (ERR_INVALID_STATE_TRANSITION)"
        side_effects: []

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /interviews/{interview_id}/cancel OR system (source case MERGED)"
        actor: "LPAnalyst | system"
        preconditions:
          - "Manual: interview must be SCHEDULED (ERR_INVALID_STATE_TRANSITION)"
        side_effects: []

      - from: HELD
        to: DOCUMENTED
        trigger: "POST /interviews/{interview_id}/document"
        actor: LPAnalyst
        preconditions:
          - "Actor must equal interviewer_id (ERR_INTERVIEWER_MISMATCH)"
          - "Interview must be HELD (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "documented_at stamped; doc_stale computed (>72h strictly)"
          - "If case is READY_FOR_INTERVIEW: case -> INTERVIEWED"

  - entity: EvidenceItem
    field: status
    initial_state: ACTIVE
    terminal_states: [RELEASED, PURGED]
    transitions:
      - from: ACTIVE
        to: SEALED
        trigger: "POST /evidence-items/{evidence_id}/seal"
        actor: LPAnalyst
        preconditions:
          - "Evidence must be ACTIVE (ERR_INVALID_STATE_TRANSITION)"
          - "A CustodyEvent with action=COLLECTED must exist for this item (ERR_CUSTODY_GAP)"
        side_effects:
          - "sealed_by stamped; a SEALED CustodyEvent is appended automatically"

      - from: SEALED
        to: ACTIVE
        trigger: "POST /evidence-items/{evidence_id}/unseal"
        actor: LPManager
        preconditions:
          - "Evidence must be SEALED (ERR_INVALID_STATE_TRANSITION)"
          - "legal_hold must be false (ERR_LEGAL_HOLD_ACTIVE)"
        side_effects: []

      - from: SEALED
        to: RELEASED
        trigger: "POST /evidence-items/{evidence_id}/release"
        actor: LPManager
        preconditions:
          - "Evidence must be SEALED (ERR_INVALID_STATE_TRANSITION)"
          - "The case must have a ReferralPacket in ACKNOWLEDGED status (ERR_CASE_NOT_REFERRABLE)"
        side_effects:
          - "A RELEASED_TO_LE CustodyEvent is appended automatically"

      - from: ACTIVE
        to: EXPIRED
        trigger: "system (POST /ops/retention-sweep)"
        actor: system
        preconditions:
          - "status ACTIVE; now > retention_until (strictly greater); parent case in a terminal or CLOSED_* state; legal_hold false"
        side_effects: []

      - from: EXPIRED
        to: PURGED
        trigger: "system (POST /ops/retention-sweep — only items already EXPIRED at sweep start)"
        actor: system
        preconditions:
          - "status EXPIRED at sweep start"
        side_effects:
          - "Item logically destroyed; custody log retained"

  - entity: CivilDemand
    field: status
    initial_state: DRAFT
    terminal_states: [PAID_IN_FULL, WRITTEN_OFF, CANCELLED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /civil-demands/{demand_id}/issue"
        actor: LPManager
        preconditions:
          - "Demand must be DRAFT (ERR_INVALID_STATE_TRANSITION)"
          - "Case must be INTERVIEWED or ADJUDICATING (ERR_INVALID_STATE_TRANSITION)"
          - "Actor must not equal demand.created_by (ERR_SOD_DEMAND_ISSUER)"
          - "If case.adjudicated_at set: now <= adjudicated_at + 60 days (ERR_DEMAND_WINDOW_CLOSED)"
        side_effects:
          - "merchandise_loss_cents/statutory_penalty_cents/amount_due_cents snapshotted per civil_demand_amount"
          - "issued_at stamped; case.restitution_status -> OUTSTANDING"

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /civil-demands/{demand_id}/cancel OR system (superseded by a newer draft, case adjudicated UNSUBSTANTIATED, source case MERGED, case reopened)"
        actor: "LPManager | system"
        preconditions:
          - "Manual: demand must be DRAFT (ERR_INVALID_STATE_TRANSITION)"
        side_effects: []

      - from: ISSUED
        to: PARTIALLY_PAID
        trigger: "system (a payment posts and 0 < paid_to_date_cents < amount_due_cents + fees_incurred_cents)"
        actor: system
        preconditions: []
        side_effects: []

      - from: PARTIALLY_PAID
        to: PAID_IN_FULL
        trigger: "system (a payment posts and outstanding_cents becomes exactly 0)"
        actor: system
        preconditions: []
        side_effects:
          - "Case.restitution_status -> SETTLED if no other issued demand on the case has outstanding_cents > 0"

      - from: ISSUED
        to: PAID_IN_FULL
        trigger: "system (first posted payment covers outstanding exactly: outstanding_cents becomes 0)"
        actor: system
        preconditions: []
        side_effects:
          - "Case.restitution_status -> SETTLED"

      - from: PAID_IN_FULL
        to: PARTIALLY_PAID
        trigger: "system (a POSTED payment is RETURNED; outstanding_cents becomes > 0)"
        actor: system
        preconditions: []
        side_effects:
          - "Case.restitution_status -> OUTSTANDING"

      - from: PARTIALLY_PAID
        to: ISSUED
        trigger: "system (all posted payments returned; paid_to_date_cents returns to 0)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ISSUED
        to: WRITTEN_OFF
        trigger: "POST /civil-demands/{demand_id}/write-off"
        actor: LPManager
        preconditions:
          - "Demand must be ISSUED or PARTIALLY_PAID (ERR_INVALID_STATE_TRANSITION)"
          - "outstanding_cents <= 50000 (ERR_WRITE_OFF_CAP_EXCEEDED)"
        side_effects:
          - "Case.restitution_status recomputed (NONE if this was the last collectible demand)"

      - from: PARTIALLY_PAID
        to: WRITTEN_OFF
        trigger: "POST /civil-demands/{demand_id}/write-off"
        actor: LPManager
        preconditions:
          - "Same as ISSUED -> WRITTEN_OFF"
        side_effects:
          - "Same as ISSUED -> WRITTEN_OFF"

  - entity: RestitutionPayment
    field: status
    initial_state: RECEIVED
    terminal_states: [RETURNED]
    transitions:
      - from: RECEIVED
        to: POSTED
        trigger: "POST /restitution-payments/{payment_id}/post"
        actor: LPAnalyst
        preconditions:
          - "Payment must be RECEIVED (ERR_INVALID_STATE_TRANSITION)"
          - "Demand must be ISSUED or PARTIALLY_PAID (ERR_DEMAND_NOT_PAYABLE)"
          - "amount_cents <= demand.outstanding_cents (ERR_PAYMENT_EXCEEDS_OUTSTANDING)"
        side_effects:
          - "Waterfall allocation computed (fees -> penalty -> merchandise) and applied_* fields set"
          - "Demand paid_to_date_cents += amount; outstanding_cents recomputed (link 1)"
          - "Demand status flips per outstanding (link 2)"
          - "Case.restitution_status recomputed (link 3)"
          - "Store.restitution_collected_cents += amount (link 4)"

      - from: POSTED
        to: RETURNED
        trigger: "POST /restitution-payments/{payment_id}/return"
        actor: LPAnalyst
        preconditions:
          - "Payment must be POSTED (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "Demand.fees_incurred_cents += 2500 (NSF fee)"
          - "Demand.paid_to_date_cents -= amount; waterfall allocations reversed; outstanding_cents recomputed (link 1)"
          - "Demand status flips (PAID_IN_FULL -> PARTIALLY_PAID, or PARTIALLY_PAID -> ISSUED when paid_to_date returns to 0) (link 2)"
          - "Case.restitution_status recomputed (link 3)"
          - "Store.restitution_collected_cents -= amount (link 4)"

  - entity: OrcGroup
    field: status
    initial_state: IDENTIFIED
    terminal_states: [DISRUPTED, DISMISSED]
    transitions:
      - from: IDENTIFIED
        to: ACTIVE_MONITORING
        trigger: "system (a CaseLink confirmation makes confirmed_case_count >= 3 AND distinct_store_count >= 2 AND exposure_cents >= 500000 — all boundaries inclusive)"
        actor: system
        preconditions: []
        side_effects:
          - "Every CONFIRMED-linked Case recomputes priority -> HIGH"

      - from: ACTIVE_MONITORING
        to: IDENTIFIED
        trigger: "system (a CONFIRMED-linked case is MERGED into another case; recomputed counters make at least one escalation conjunct false)"
        actor: system
        preconditions: []
        side_effects:
          - "Every still-CONFIRMED-linked Case recomputes priority (HIGH only if some other ACTIVE_MONITORING group links it or a source alert is ESCALATED)"

      - from: ACTIVE_MONITORING
        to: DISRUPTED
        trigger: "POST /orc-groups/{group_id}/disrupt"
        actor: LPManager
        preconditions:
          - "Group must be ACTIVE_MONITORING (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "PROPOSED links -> REJECTED; CONFIRMED links retained for audit"

      - from: IDENTIFIED
        to: DISMISSED
        trigger: "POST /orc-groups/{group_id}/dismiss"
        actor: LPManager
        preconditions:
          - "Group must be IDENTIFIED (ERR_INVALID_STATE_TRANSITION)"
          - "No PROPOSED links (ERR_GROUP_HAS_PROPOSED_LINKS)"
          - "confirmed_case_count == 0 (ERR_GROUP_NOT_LINKABLE)"
        side_effects: []

      - from: ACTIVE_MONITORING
        to: DISMISSED
        trigger: "POST /orc-groups/{group_id}/dismiss"
        actor: LPManager
        preconditions:
          - "No PROPOSED links (ERR_GROUP_HAS_PROPOSED_LINKS)"
          - "confirmed_case_count == 0 (ERR_GROUP_NOT_LINKABLE)"
        side_effects: []

  - entity: CaseLink
    field: status
    initial_state: PROPOSED
    terminal_states: [CONFIRMED, REJECTED]
    transitions:
      - from: PROPOSED
        to: CONFIRMED
        trigger: "POST /case-links/{link_id}/confirm"
        actor: LPManager
        preconditions:
          - "Link must be PROPOSED (ERR_INVALID_STATE_TRANSITION)"
          - "Case must be non-terminal and not MERGED (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "OrcGroup confirmed_case_count/distinct_store_count/exposure_cents recomputed (link 1)"
          - "Group escalation evaluated, may flip IDENTIFIED -> ACTIVE_MONITORING (link 2)"
          - "If escalation flips, every CONFIRMED-linked case priority recomputed (link 3)"

      - from: PROPOSED
        to: REJECTED
        trigger: "POST /case-links/{link_id}/reject"
        actor: LPManager
        preconditions:
          - "Link must be PROPOSED (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "Group counters unaffected (link was never counted)"
          - "(On group DISRUPTED, system rejects all PROPOSED links — same end state)"

  - entity: ShrinkPeriod
    field: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: COUNTED
        trigger: "POST /shrink-periods/{period_id}/record-count"
        actor: LPAdmin
        preconditions:
          - "Period must be OPEN or COUNTED (ERR_PERIOD_LOCKED)"
          - "expected_shrink_period_version must match current version (ERR_STALE_PERIOD_VERSION)"
        side_effects:
          - "counted_inventory_cents/counted_at recorded; increments ShrinkPeriod.version by 1"

      - from: COUNTED
        to: COUNTED
        trigger: "POST /shrink-periods/{period_id}/record-count (recount supersedes the prior count)"
        actor: LPAdmin
        preconditions:
          - "Same as OPEN -> COUNTED"
        side_effects:
          - "counted_inventory_cents/counted_at overwritten; increments ShrinkPeriod.version by 1"

      - from: COUNTED
        to: RECONCILED
        trigger: "POST /shrink-periods/{period_id}/reconcile"
        actor: LPAdmin
        preconditions:
          - "Period must be COUNTED (ERR_COUNT_REQUIRED when OPEN)"
        side_effects:
          - "variance_cents/variance_pct snapshotted (link 1)"
          - "If |variance_pct| >= 0.0200: system creates a Case (source=SHRINK_VARIANCE, subject_type=UNKNOWN, manual_loss_cents = max(0, -variance_cents), status=OPEN) and sets auto_case_id (link 2)"
          - "That auto-case participates in normal pipeline; its later loss posting targets the period containing the posting date, NOT this reconciled period (link 3 ordering pin)"

      - from: RECONCILED
        to: CLOSED
        trigger: "POST /shrink-periods/{period_id}/close"
        actor: LPAdmin
        preconditions:
          - "Period must be RECONCILED (ERR_INVALID_STATE_TRANSITION)"
        side_effects: []

  - entity: ReferralPacket
    field: status
    initial_state: DRAFT
    terminal_states: [ACKNOWLEDGED]
    transitions:
      - from: DRAFT
        to: SEALED
        trigger: "POST /referral-packets/{packet_id}/seal"
        actor: LPAnalyst
        preconditions:
          - "Packet must be DRAFT (ERR_INVALID_STATE_TRANSITION)"
          - "Every EvidenceItem of the case with status ACTIVE must be SEALED first (ERR_EVIDENCE_UNSEALED); items EXPIRED/PURGED are excluded from the packet"
          - "Every SEALED EvidenceItem must have a COLLECTED custody event (ERR_CUSTODY_GAP)"
        side_effects:
          - "packet_exposure_cents = case.total_loss_cents snapshot"

      - from: SEALED
        to: SUBMITTED
        trigger: "POST /referral-packets/{packet_id}/submit"
        actor: LPManager
        preconditions:
          - "Packet must be SEALED (ERR_INVALID_STATE_TRANSITION)"
          - "Case must be CLOSED_SUBSTANTIATED (ERR_PACKET_NOT_READY)"
          - "No CivilDemand for the case in DRAFT (ERR_PACKET_NOT_READY)"
        side_effects:
          - "submitted_at stamped"
          - "Every SEALED/ACTIVE EvidenceItem of the case gets legal_hold = true (link 1)"
          - "Legal hold blocks unseal and retention expiry (link 2)"

      - from: SUBMITTED
        to: ACKNOWLEDGED
        trigger: "POST /referral-packets/{packet_id}/acknowledge with outcome=ACKNOWLEDGED"
        actor: LPManager
        preconditions:
          - "Packet must be SUBMITTED (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "legal_hold remains true; evidence release to LE now permitted"

      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /referral-packets/{packet_id}/acknowledge with outcome=RETURNED"
        actor: LPManager
        preconditions:
          - "Packet must be SUBMITTED (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "return_reason recorded; legal_hold cleared on all case evidence (link 1)"

      - from: RETURNED
        to: DRAFT
        trigger: "POST /referral-packets/{packet_id}/revise"
        actor: LPAnalyst
        preconditions:
          - "Packet must be RETURNED (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "Packet may be corrected and re-sealed; cycle DRAFT->SEALED->SUBMITTED->RETURNED->DRAFT is allowed without limit"

# =============================================================================
# Concurrency Rules (OCC — see SKILL.md §1.2.1)
# =============================================================================
concurrency_rules:
  - rule_id: demand-create-stale-case
    parent_entity: Case
    write_endpoint: "POST /civil-demands"
    occ_field: "expected_case_version"
    description: |
      Creating a CivilDemand against a Case whose version has advanced since the
      client last observed it is rejected. A fresh draft legitimately supersedes a
      prior DRAFT (the prior draft is auto-CANCELLED), so a second request carrying
      a current version succeeds; only a stale expected_case_version fails.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412

  - rule_id: count-record-stale-period
    parent_entity: ShrinkPeriod
    write_endpoint: "POST /shrink-periods/{period_id}/record-count"
    occ_field: "expected_shrink_period_version"
    description: |
      Recording a physical count against a ShrinkPeriod whose version has advanced
      since the client last observed it is rejected. A recount on a COUNTED period
      legitimately supersedes the prior count, so a request carrying the current
      version succeeds; only a stale expected_shrink_period_version fails.
    error_id: ERR_STALE_PERIOD_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: alert_score
    trigger: "PosExceptionEvent creation (candidate-set evaluation, alert creation, or attach-recompute)"
    algorithm: weighted_scoring
    description: "Weighted sum over member events; tiered thresholds gate alert creation and escalation"
    formula: |
      band_mult(amount_cents) = 1.0 if amount_cents < 5000
                                1.5 if 5000 <= amount_cents < 20000
                                2.0 if amount_cents >= 20000
      score = round_half_up( SUM over member events of weight(exception_type) * band_mult(amount_cents), 2 )
      Alert creation: candidate set = UNAGGREGATED events with same (store_id, employee_id) and
        occurred_at in [new_event.occurred_at - 30 days, new_event.occurred_at]; create alert iff score(candidate set) >= 40.00
      Attach: if an alert with status OPEN|ESCALATED exists for the (store_id, employee_id) group,
        the new event attaches to it instead of forming a new alert (selector: that group's alert with
        status in {OPEN, ESCALATED}; at most one can exist per group by construction; score recomputed)
      Escalation: score >= 75.00 (inclusive) -> ESCALATED; score < 75.00 stays OPEN
    input_set: "PosExceptionEvents with same (store_id, employee_id); status UNAGGREGATED for new-alert evaluation, or all members of the existing alert plus the new event on attach"
    constants:
      WEIGHT_REFUND_NO_RECEIPT: 10
      WEIGHT_HIGH_VALUE_VOID: 14
      WEIGHT_PRICE_OVERRIDE: 8
      WEIGHT_NO_SALE_DRAWER: 6
      WEIGHT_SUSPEND_CANCEL: 8
      WEIGHT_SWEETHEART_SCAN: 12
      WEIGHT_SELF_CHECKOUT_MISMATCH: 9
      BAND1_MAX_CENTS: 5000
      BAND2_MAX_CENTS: 20000
      OPEN_THRESHOLD: 40.00
      ESCALATE_THRESHOLD: 75.00
      WINDOW_DAYS: 30
    precision: "2 decimal places, round_half_up"

  - name: civil_demand_amount
    trigger: "CivilDemand issuance (POST /civil-demands/{id}/issue) — snapshotted at that instant"
    algorithm: tiered_pricing
    description: "Statutory penalty tier + prior-offense multiplier + recovery costs; rounding order pinned"
    formula: |
      Evaluation order (pinned, non-negotiable):
      1. tier_penalty(loss):
           loss <= 50000                  -> 10000
           50000 < loss <= 150000         -> 25000 + round_half_up(0.10 * (loss - 50000))
           loss > 150000                  -> min(100000, 50000 + round_half_up(0.20 * (loss - 150000)))
      2. multiplier = 1.0 + 0.5 * min(priors, 4); hard cap 3.0
      3. statutory_penalty_cents = round_half_up(tier_penalty * multiplier)   # round AFTER multiply, tier value already integral
      4. amount_due_cents = merchandise_loss_cents + statutory_penalty_cents + recovery_cost_cents
      priors = Employee.prior_substantiated_count at issuance for EMPLOYEE subjects;
               priors_offense_count input for EXTERNAL subjects.
    input_set: "Case.total_loss_cents snapshot at issuance; priors per subject kind; recovery_cost_cents input"
    constants:
      TIER1_MAX_CENTS: 50000
      TIER1_PENALTY_CENTS: 10000
      TIER2_MAX_CENTS: 150000
      TIER2_BASE_CENTS: 25000
      TIER2_RATE: 0.10
      TIER3_BASE_CENTS: 50000
      TIER3_RATE: 0.20
      PENALTY_CAP_CENTS: 100000
      PRIOR_STEP: 0.5
      PRIOR_MAX_COUNTED: 4
      MULTIPLIER_CAP: 3.0
    precision: "integer cents; round_half_up at each marked rounding step"
    variants:
      - name: STATUTORY
        when: "EXTERNAL-subject cases (and the only basis carrying a penalty)"
        difference: "Includes tiered statutory_penalty_cents after multiplier; amount_due = loss + penalty + recovery_cost"
      - name: ACTUAL_LOSS
        when: "EMPLOYEE-subject cases (mandatory basis) or EXTERNAL cases where LP elects actual-loss only"
        difference: "statutory_penalty_cents = 0 regardless of priors; amount_due = merchandise_loss + recovery_cost only"

  - name: restitution_waterfall
    trigger: "RestitutionPayment posting (POST /restitution-payments/{id}/post)"
    algorithm: waterfall_allocation
    description: "Payment allocated across ordered buckets; exact-equality boundary flips PAID_IN_FULL"
    formula: |
      remaining = payment.amount_cents
      applied_fees_cents     = min(remaining, fees_incurred_cents - fees_paid_cents);        remaining -= applied_fees_cents
      applied_penalty_cents  = min(remaining, statutory_penalty_cents - penalty_paid_cents); remaining -= applied_penalty_cents
      applied_merch_cents    = min(remaining, (merchandise_loss_cents + recovery_cost_cents) - merch_paid_cents); remaining -= applied_merch_cents
      Precondition (validated before application): amount_cents <= outstanding_cents (ERR_PAYMENT_EXCEEDS_OUTSTANDING)
      After application: outstanding_cents == 0  <=>  PAID_IN_FULL (exact equality; overpayment impossible by precondition)
      On return: allocations of that payment are subtracted back out of each bucket's paid counter,
        fees_incurred_cents += 2500, paid_to_date_cents -= amount_cents.
      Invariant (must hold after every post and every return):
        outstanding_cents == amount_due_cents + fees_incurred_cents - paid_to_date_cents
    input_set: "The target CivilDemand's bucket counters and the posting payment"
    constants:
      NSF_FEE_CENTS: 2500
    precision: "integer cents"

  - name: case_total_loss
    trigger: "alert convert, advance (recovered value), merge, adjudication snapshot read"
    algorithm: aggregation
    description: "Attributed loss per case with a zero floor; conserved across merge"
    formula: |
      raw = SUM(amount_cents over PosExceptionEvents AGGREGATED to alerts with case_id = this case)
            + manual_loss_cents - recovered_value_cents
      total_loss_cents = max(0, raw)
      Merge conservation: target inherits source's alerts (re-pointed), manual_loss_cents, and
        recovered_value_cents; because recovered_value_cents <= event sum + manual_loss_cents is
        enforced at advance (ERR_RECOVERED_EXCEEDS_LOSS), raw >= 0 per case and therefore
        total_loss_target_after == total_loss_target_before + total_loss_source_before exactly.
    input_set: "Alerts with case_id = this case (status CONVERTED); their AGGREGATED member events; case manual/recovered fields"
    precision: "integer cents"

  - name: orc_escalation
    trigger: "CaseLink confirmation or rejection (recompute); also on merge recompute of a linked case's loss"
    algorithm: threshold
    description: "Three-input conjunctive threshold; all boundaries inclusive"
    formula: |
      confirmed_case_count  = COUNT(links where status=CONFIRMED)
      distinct_store_count  = COUNT(DISTINCT case.store_id over CONFIRMED-linked cases)
      exposure_cents        = SUM(case.total_loss_cents over CONFIRMED-linked cases)
      escalate   when confirmed_case_count >= 3 AND distinct_store_count >= 2 AND exposure_cents >= 500000
      de-escalate (ACTIVE_MONITORING -> IDENTIFIED) when any conjunct becomes false
    input_set: "CaseLinks of the group with status CONFIRMED; their cases (excluding MERGED sources — a MERGED case contributes via its surviving target only)"
    constants:
      MIN_CONFIRMED_CASES: 3
      MIN_DISTINCT_STORES: 2
      MIN_EXPOSURE_CENTS: 500000
    precision: "integer cents and counts"

  - name: shrink_accrual
    trigger: "known_loss_posted_cents change; period read; reconcile"
    algorithm: aggregation
    description: "Two sanctioned accrual bases produce different accrual values for identical period data; CASE basis is the reported pre-reconcile accrual"
    formula: |
      accrual_case_basis_cents  = known_loss_posted_cents
      accrual_sales_basis_cents = round_half_up(period_sales_cents * 0.0125)
      Reported accrual while OPEN/COUNTED = accrual_case_basis_cents (CASE_POSTED basis).
    input_set: "The ShrinkPeriod's own fields only"
    constants:
      SALES_ACCRUAL_RATE: 0.0125
    precision: "integer cents, round_half_up"
    variants:
      - name: CASE_POSTED
        when: "Official reported accrual before reconcile; equals posted case losses"
        difference: "Moves only when a case adjudicates or reopens against this period"
      - name: SALES_RATIO
        when: "Comparative estimate exposed alongside; never the reported accrual"
        difference: "round_half_up(period_sales_cents * 0.0125), independent of case activity"

  - name: shrink_variance
    trigger: "POST /shrink-periods/{id}/reconcile"
    algorithm: aggregation
    description: "Counted vs loss-adjusted book; circular-looking feedback pinned by evaluation order"
    formula: |
      variance_cents = counted_inventory_cents - (book_inventory_cents - known_loss_posted_cents)
      variance_pct   = round_half_up(variance_cents / book_inventory_cents, 4)   # 4 decimal places
      Breach: |variance_pct| >= 0.0200 (inclusive) -> auto-create shrink-investigation Case
        (source=SHRINK_VARIANCE, subject_type=UNKNOWN, manual_loss_cents = max(0, -variance_cents))
      Evaluation-order pin (breaks the apparent cycle):
        (1) variance snapshot uses known_loss_posted_cents live at the reconcile call;
        (2) the period transitions to RECONCILED and stops accepting postings;
        (3) the auto-case's eventual adjudication posts its loss to the period containing the
            adjudication date with status OPEN|COUNTED — NEVER retroactively to this reconciled period.
    input_set: "The ShrinkPeriod's own fields at reconcile instant"
    constants:
      VARIANCE_BREACH_PCT: 0.0200
    precision: "variance_cents integer; variance_pct 4 decimal places round_half_up"

  - name: evidence_retention
    trigger: "POST /ops/retention-sweep (also recomputed on case close/reopen for CASE_HOLD items)"
    algorithm: threshold
    description: "Per-class retention horizon; strict-greater expiry comparison; two-phase sweep"
    formula: |
      retention_until =
        STANDARD  : captured_at + 90 days
        EXTENDED  : captured_at + 365 days
        CASE_HOLD : case.closed_at + 30 days while case is in any CLOSED_* terminal-ish state;
                    not eligible for expiry at all while the case is non-closed
      Expiry eligibility (all conjuncts): status == ACTIVE; now > retention_until (strictly greater —
        at the exact retention_until instant the item is retained); case.status in
        {CLOSED_SUBSTANTIATED, CLOSED_UNSUBSTANTIATED, CLOSED_REFERRED}; legal_hold == false.
      Sweep phases within one call: first purge items already EXPIRED at sweep start -> PURGED;
        then expire eligible ACTIVE items -> EXPIRED. An item expiring in this sweep is NOT purged
        until a later sweep.
    input_set: "EvidenceItems joined to their parent case status"
    constants:
      STANDARD_DAYS: 90
      EXTENDED_DAYS: 365
      CASE_HOLD_DAYS_AFTER_CLOSE: 30
    precision: "datetime comparison at second precision"

  - name: interview_doc_sla
    trigger: "POST /interviews/{id}/document"
    algorithm: threshold
    description: "Documentation staleness boolean; strictly-greater 72h comparison"
    formula: |
      doc_stale = (documented_at - conducted_at) > 72 hours   # strictly greater; exactly 72h00m00s is NOT stale
      Adjudication gate: at least one DOCUMENTED interview with doc_stale = false, unless the
      adjudicator passes documentation_override = true.
    input_set: "The interview's conducted_at and the logical clock at document time"
    constants:
      DOC_SLA_HOURS: 72
    precision: "second precision on the duration comparison"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority — first match wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; X-User-Role must be one of the six declared roles"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Role must be permitted for this endpoint per §1.5 roles (includes context routing: EMPLOYEE-subject adjudication requires HRPartner, EXTERNAL requires LPManager)"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: auth
    check: "Ownership: actor equals case.assigned_analyst_id on assignee-scoped case operations (advance, evidence attach, interview schedule, demand draft, packet draft/seal); actor equals interview.interviewer_id on record-outcome/document"
    error_id: "ERR_NOT_CASE_ASSIGNEE | ERR_INTERVIEWER_MISMATCH"
    http_status: 403
    applies_to: "POST /cases/{id}/advance, POST /evidence-items, POST /interviews, POST /civil-demands, POST /referral-packets, POST /referral-packets/{id}/seal, POST /referral-packets/{id}/revise, POST /interviews/{id}/record-outcome, POST /interviews/{id}/document"

  - priority: 4
    category: existence
    check: "Request body well-formed: required fields present, types correct, enums in domain, amounts > 0 where required, scheduled_end > scheduled_start, period_end >= period_start, pagination limit in [1,100], offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints"

  - priority: 5
    category: existence
    check: "Path and body-referenced resources exist, validated left-to-right (path ids first, then body FKs in declared input order)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 6
    category: state
    check: "Target entity's own state machine permits the transition"
    error_id: "ERR_INVALID_STATE_TRANSITION | ERR_DEMAND_NOT_PAYABLE"
    http_status: 409
    applies_to: "all action/transition endpoints"

  - priority: 7
    category: state
    check: "Cross-entity state guards: store ACTIVE (ERR_STORE_CLOSED), employee not TERMINATED (ERR_EMPLOYEE_NOT_ACTIVE), loss-posting/reopen period not RECONCILED|CLOSED and store close blocked by OPEN|COUNTED period (ERR_PERIOD_LOCKED), group IDENTIFIED|ACTIVE_MONITORING for new links (ERR_GROUP_NOT_LINKABLE), ACKNOWLEDGED packet for close-referred/release (ERR_CASE_NOT_REFERRABLE), interview creation requires case INVESTIGATING|READY_FOR_INTERVIEW and evidence creation requires case INVESTIGATING|READY_FOR_INTERVIEW|INTERVIEWED|ADJUDICATING and demand drafting requires case INTERVIEWED|ADJUDICATING and packet drafting requires case CLOSED_SUBSTANTIATED (all ERR_INVALID_STATE_TRANSITION)"
    error_id: "ERR_STORE_CLOSED | ERR_EMPLOYEE_NOT_ACTIVE | ERR_PERIOD_LOCKED | ERR_GROUP_NOT_LINKABLE | ERR_CASE_NOT_REFERRABLE | ERR_INVALID_STATE_TRANSITION"
    http_status: 409
    applies_to: "child-creating and guarded transition endpoints"

  - priority: 8
    category: state
    check: "OCC: expected_case_version / expected_shrink_period_version must equal the parent entity's current version"
    error_id: "ERR_STALE_CASE_VERSION | ERR_STALE_PERIOD_VERSION"
    http_status: 412
    applies_to: "POST /civil-demands, POST /shrink-periods/{id}/record-count"

  - priority: 9
    category: business_safety
    check: "Compliance: segregation of duties (interviewer or creator cannot adjudicate; demand drafter cannot issue); sealed evidence immutable (no custody ACCESSED/TRANSFERRED while SEALED); legal hold blocks unseal; seal requires prior COLLECTED custody event"
    error_id: "ERR_SOD_INTERVIEWER_ADJUDICATOR | ERR_SOD_CASE_CREATOR | ERR_SOD_DEMAND_ISSUER | ERR_EVIDENCE_SEALED_IMMUTABLE | ERR_LEGAL_HOLD_ACTIVE | ERR_CUSTODY_GAP"
    http_status: 409
    applies_to: "adjudicate, issue, custody-events, seal, unseal"

  - priority: 10
    category: business_temporal
    check: "Temporal rules: interview windows for the same employee must not overlap (half-open, adjacency allowed); shrink periods for the same store must be strictly disjoint (touching endpoints conflict); interview doc SLA staleness; demand issue within adjudication + 60d; reopen within closed_at + 30d"
    error_id: "ERR_INTERVIEW_OVERLAP | ERR_PERIOD_OVERLAP | ERR_INTERVIEW_DOC_STALE | ERR_DEMAND_WINDOW_CLOSED | ERR_REOPEN_WINDOW_CLOSED"
    http_status: 409
    applies_to: "POST /interviews, POST /shrink-periods, adjudicate, issue, reopen"

  - priority: 11
    category: business_referential
    check: "Referential/aggregate gates: unique store_number/employee_ref/group name; one non-REJECTED link per (case, group); subject consistency on convert/manual-create/resolve-subject/interview-schedule; non-empty evidence gate; demand-required gate; packet-readiness gate; count-required gate; no-POSTED-payments gate; no-PROPOSED-links and zero-confirmed gate on group dismiss; merge eligibility; open-period existence"
    error_id: "ERR_DUPLICATE_STORE_NUMBER | ERR_DUPLICATE_EMPLOYEE_REF | ERR_DUPLICATE_GROUP_NAME | ERR_LINK_EXISTS | ERR_SUBJECT_MISMATCH | ERR_SUBJECT_UNRESOLVED | ERR_NO_ACTIVE_EVIDENCE | ERR_DEMAND_REQUIRED | ERR_PACKET_NOT_READY | ERR_COUNT_REQUIRED | ERR_CASE_HAS_PAYMENTS | ERR_GROUP_HAS_PROPOSED_LINKS | ERR_MERGE_NOT_ALLOWED | ERR_NO_OPEN_PERIOD | ERR_EVIDENCE_UNSEALED"
    http_status: 409
    applies_to: "create and gate-checked action endpoints"

  - priority: 12
    category: business_fiscal
    check: "Fiscal rules last: payment amount <= demand outstanding; write-off outstanding <= 50000; recovered value <= attributable loss; STATUTORY basis forbidden on EMPLOYEE cases"
    error_id: "ERR_PAYMENT_EXCEEDS_OUTSTANDING | ERR_WRITE_OFF_CAP_EXCEEDED | ERR_RECOVERED_EXCEEDS_LOSS | ERR_BASIS_NOT_ALLOWED"
    http_status: 409
    applies_to: "payments post, demand write-off, case advance, demand create"

# =============================================================================
# Response Envelope (FIXED — verbatim per SKILL.md §1.0)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Test-driving / ops ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Startup default is exactly 2026-08-01T00:00:00Z; before any call the clock reads this default and never falls back to wall-clock time."
    roles: [LPAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["Logical clock advanced; no entity mutation"]

  - method: POST
    path: "/ops/retention-sweep"
    description: "Run the two-phase evidence retention sweep (purge EXPIRED, then expire eligible ACTIVE)"
    roles: [LPAdmin]
    code: 200
    input: []
    output: { purged_count: integer, expired_count: integer }
    side_effects: ["EXPIRED evidence -> PURGED; eligible ACTIVE evidence -> EXPIRED per evidence_retention"]

  # --- Store ---
  - method: POST
    path: "/stores"
    description: "Create a store"
    roles: [LPAdmin]
    code: 201
    input: [store_number, name, region_code]
    output: Store
    side_effects: ["status=ACTIVE; computed totals initialized to 0"]

  - method: GET
    path: "/stores"
    description: "List stores"
    roles: [LPAnalyst, LPManager, HRPartner, LPAdmin, Auditor, PosFeed]
    code: 200
    input: ["region_code?", "status?", "limit?", "offset?"]
    output: Store[]
    side_effects: []

  - method: GET
    path: "/stores/{store_id}"
    description: "Get a store"
    roles: [LPAnalyst, LPManager, HRPartner, LPAdmin, Auditor, PosFeed]
    code: 200
    input: []
    output: Store
    side_effects: []

  - method: POST
    path: "/stores/{store_id}/close"
    description: "Close a store (requires no OPEN/COUNTED shrink periods)"
    roles: [LPAdmin]
    code: 200
    input: []
    output: Store
    side_effects: ["status -> CLOSED"]

  # --- Employee ---
  - method: POST
    path: "/employees"
    description: "Register an employee"
    roles: [HRPartner]
    code: 201
    input: [store_id, employee_ref, full_name]
    output: Employee
    side_effects: ["status=ACTIVE; prior_substantiated_count=0"]

  - method: GET
    path: "/employees"
    description: "List employees"
    roles: [LPAnalyst, LPManager, HRPartner, LPAdmin, Auditor, PosFeed]
    code: 200
    input: ["store_id?", "status?", "limit?", "offset?"]
    output: Employee[]
    side_effects: []

  - method: GET
    path: "/employees/{employee_id}"
    description: "Get an employee"
    roles: [LPAnalyst, LPManager, HRPartner, LPAdmin, Auditor, PosFeed]
    code: 200
    input: []
    output: Employee
    side_effects: []

  - method: POST
    path: "/employees/{employee_id}/suspend"
    description: "Suspend an ACTIVE employee"
    roles: [HRPartner]
    code: 200
    input: []
    output: Employee
    side_effects: ["status -> SUSPENDED"]

  - method: POST
    path: "/employees/{employee_id}/reinstate"
    description: "Reinstate a SUSPENDED employee"
    roles: [HRPartner]
    code: 200
    input: []
    output: Employee
    side_effects: ["status -> ACTIVE"]

  # --- POS exception events ---
  - method: POST
    path: "/exception-events"
    description: "Ingest a POS exception event; runs alert aggregation (attach or create) and escalation evaluation"
    roles: [PosFeed]
    code: 201
    input: [store_id, register_ref, txn_ref, exception_type, amount_cents, occurred_at, "employee_id?"]
    output: PosExceptionEvent
    side_effects:
      - "Event created UNAGGREGATED; alert_score evaluated"
      - "Attach to the group's OPEN|ESCALATED alert (score recomputed; may escalate) or create a new Alert when candidate score >= 40.00 (members -> AGGREGATED)"

  - method: GET
    path: "/exception-events"
    description: "List exception events"
    roles: [LPAnalyst, LPManager, HRPartner, LPAdmin, Auditor, PosFeed]
    code: 200
    input: ["store_id?", "employee_id?", "status?", "exception_type?", "limit?", "offset?"]
    output: PosExceptionEvent[]
    side_effects: []

  - method: GET
    path: "/exception-events/{event_id}"
    description: "Get an exception event"
    roles: [LPAnalyst, LPManager, HRPartner, LPAdmin, Auditor, PosFeed]
    code: 200
    input: []
    output: PosExceptionEvent
    side_effects: []

  # --- Alerts ---
  - method: GET
    path: "/alerts"
    description: "List alerts"
    roles: [LPAnalyst, LPManager, HRPartner, LPAdmin, Auditor, PosFeed]
    code: 200
    input: ["store_id?", "employee_id?", "case_id?", "status?", "subject_type?", "min_score?", "limit?", "offset?"]
    output: Alert[]
    side_effects: []

  - method: GET
    path: "/alerts/{alert_id}"
    description: "Get an alert"
    roles: [LPAnalyst, LPManager, HRPartner, LPAdmin, Auditor, PosFeed]
    code: 200
    input: []
    output: Alert
    side_effects: []

  - method: POST
    path: "/alerts/{alert_id}/dismiss"
    description: "Dismiss an alert (LPAnalyst for OPEN; LPManager for OPEN or ESCALATED); releases member events to UNAGGREGATED"
    roles: [LPAnalyst, LPManager]
    code: 200
    input: [reason]
    output: Alert
    side_effects: ["status -> DISMISSED; member events -> UNAGGREGATED; dismiss_reason recorded"]

  - method: POST
    path: "/alerts/{alert_id}/convert"
    description: "Convert an alert (optionally bundling same-store OPEN/ESCALATED alerts) into a new Case"
    roles: [LPAnalyst]
    code: 201
    input: [subject_type, "employee_id?", "additional_alert_ids?"]
    output: Case
    side_effects: ["Case created (source=ALERT); this and additional alerts -> CONVERTED with case_id set"]

  # --- Cases ---
  - method: POST
    path: "/cases"
    description: "Create a manual case (source=MANUAL); subject_type=EMPLOYEE requires employee_id of a non-TERMINATED employee, other subject types require null employee_id"
    roles: [LPAnalyst]
    code: 201
    input: [store_id, subject_type, "employee_id?", "manual_loss_cents?"]
    output: Case
    side_effects: ["status=OPEN; created_by stamped from X-User-ID"]

  - method: GET
    path: "/cases"
    description: "List cases"
    roles: [LPAnalyst, LPManager, HRPartner, LPAdmin, Auditor, PosFeed]
    code: 200
    input: ["store_id?", "employee_id?", "status?", "subject_type?", "source?", "merged_into_case_id?", "loss_posted_period_id?", "priority?", "limit?", "offset?"]
    output: Case[]
    side_effects: []

  - method: GET
    path: "/cases/{case_id}"
    description: "Get a case"
    roles: [LPAnalyst, LPManager, HRPartner, LPAdmin, Auditor, PosFeed]
    code: 200
    input: []
    output: Case
    side_effects: []

  - method: GET
    path: "/cases/{case_id}/summary"
    description: "Computed case read: totals, evidence/interview/demand/link rollups"
    roles: [LPAnalyst, LPManager, HRPartner, LPAdmin, Auditor, PosFeed]
    code: 200
    input: []
    output: { case_id: string, total_loss_cents: integer, evidence_count: integer, sealed_evidence_count: integer, documented_interview_count: integer, demand_outstanding_cents: integer, confirmed_link_count: integer, restitution_status: string }
    side_effects: []

  - method: POST
    path: "/cases/{case_id}/assign"
    description: "Assign an analyst; OPEN -> INVESTIGATING"
    roles: [LPManager]
    code: 200
    input: [analyst_id]
    output: Case
    side_effects: ["assigned_analyst_id set; status -> INVESTIGATING"]

  - method: POST
    path: "/cases/{case_id}/advance"
    description: "Step the case forward: INVESTIGATING->READY_FOR_INTERVIEW (evidence gate) or INTERVIEWED->ADJUDICATING (subject-resolved gate). No transition exists from READY_FOR_INTERVIEW via this endpoint."
    roles: [LPAnalyst]
    code: 200
    input: ["recovered_value_cents?"]
    output: Case
    side_effects: ["Status transition per state machine; total_loss_cents recomputed"]

  - method: POST
    path: "/cases/{case_id}/dismiss"
    description: "Early closure: INVESTIGATING -> CLOSED_UNSUBSTANTIATED"
    roles: [LPManager]
    code: 200
    input: [reason]
    output: Case
    side_effects: ["status -> CLOSED_UNSUBSTANTIATED; closed_at stamped"]

  - method: POST
    path: "/cases/{case_id}/adjudicate"
    description: "Adjudicate an ADJUDICATING case (HRPartner for EMPLOYEE subjects, LPManager for EXTERNAL)"
    roles: [LPManager, HRPartner]
    code: 200
    input: [decision, "employment_action?", "restitution_waived?", "documentation_override?"]
    output: Case
    side_effects: ["Status -> CLOSED_SUBSTANTIATED or CLOSED_UNSUBSTANTIATED; loss posting cascade per state machine"]

  - method: POST
    path: "/cases/{case_id}/reopen"
    description: "Reopen a CLOSED_SUBSTANTIATED/CLOSED_UNSUBSTANTIATED case within 30 days"
    roles: [LPManager]
    code: 200
    input: [reason]
    output: Case
    side_effects: ["status -> INVESTIGATING; loss posting reversed; DRAFT demands cancelled"]

  - method: POST
    path: "/cases/{case_id}/merge"
    description: "Merge this case into a surviving target case"
    roles: [LPManager]
    code: 200
    input: [target_case_id]
    output: Case
    side_effects: ["source -> MERGED; alerts re-pointed; evidence re-parented; SCHEDULED interviews cancelled; DRAFT demands cancelled; target totals recomputed"]

  - method: POST
    path: "/cases/{case_id}/resolve-subject"
    description: "Set or correct subject_type/employee_id while the case is INVESTIGATING or READY_FOR_INTERVIEW (no status change)"
    roles: [LPManager]
    code: 200
    input: [subject_type, "employee_id?"]
    output: Case
    side_effects: ["subject_type/employee_id updated; subject consistency and employee-not-terminated rules enforced"]

  - method: POST
    path: "/cases/{case_id}/close-referred"
    description: "Close a substantiated case as referred after packet acknowledgement"
    roles: [LPManager]
    code: 200
    input: []
    output: Case
    side_effects: ["status -> CLOSED_REFERRED"]

  # --- Interviews ---
  - method: POST
    path: "/interviews"
    description: "Schedule an interview (assignee only; case must be INVESTIGATING or READY_FOR_INTERVIEW; employee-subject overlap rules apply)"
    roles: [LPAnalyst]
    code: 201
    input: [case_id, interviewer_id, scheduled_start, scheduled_end, "subject_employee_id?"]
    output: Interview
    side_effects: ["status=SCHEDULED"]

  - method: GET
    path: "/interviews"
    description: "List interviews"
    roles: [LPAnalyst, LPManager, HRPartner, LPAdmin, Auditor, PosFeed]
    code: 200
    input: ["case_id?", "interviewer_id?", "subject_employee_id?", "status?", "limit?", "offset?"]
    output: Interview[]
    side_effects: []

  - method: GET
    path: "/interviews/{interview_id}"
    description: "Get an interview"
    roles: [LPAnalyst, LPManager, HRPartner, LPAdmin, Auditor, PosFeed]
    code: 200
    input: []
    output: Interview
    side_effects: []

  - method: POST
    path: "/interviews/{interview_id}/record-outcome"
    description: "Record interview outcome (interviewer only); outcome ADMITTED|DENIED|PARTIAL -> HELD, NO_SHOW -> NO_SHOW"
    roles: [LPAnalyst]
    code: 200
    input: [outcome]
    output: Interview
    side_effects: ["status -> HELD or NO_SHOW; conducted_at stamped"]

  - method: POST
    path: "/interviews/{interview_id}/document"
    description: "File documentation for a HELD interview (interviewer only)"
    roles: [LPAnalyst]
    code: 200
    input: [notes]
    output: Interview
    side_effects: ["status -> DOCUMENTED; documented_at stamped; doc_stale computed; case READY_FOR_INTERVIEW -> INTERVIEWED"]

  - method: POST
    path: "/interviews/{interview_id}/cancel"
    description: "Cancel a SCHEDULED interview"
    roles: [LPAnalyst]
    code: 200
    input: []
    output: Interview
    side_effects: ["status -> CANCELLED"]

  # --- Evidence ---
  - method: POST
    path: "/evidence-items"
    description: "Attach evidence to a case (assignee only; case must be INVESTIGATING, READY_FOR_INTERVIEW, INTERVIEWED, or ADJUDICATING)"
    roles: [LPAnalyst]
    code: 201
    input: [case_id, evidence_type, captured_at, retention_class]
    output: EvidenceItem
    side_effects: ["status=ACTIVE; retention_until computed; legal_hold=false"]

  - method: GET
    path: "/evidence-items"
    description: "List evidence items"
    roles: [LPAnalyst, LPManager, HRPartner, LPAdmin, Auditor, PosFeed]
    code: 200
    input: ["case_id?", "status?", "evidence_type?", "retention_class?", "limit?", "offset?"]
    output: EvidenceItem[]
    side_effects: []

  - method: GET
    path: "/evidence-items/{evidence_id}"
    description: "Get an evidence item"
    roles: [LPAnalyst, LPManager, HRPartner, LPAdmin, Auditor, PosFeed]
    code: 200
    input: []
    output: EvidenceItem
    side_effects: []

  - method: POST
    path: "/evidence-items/{evidence_id}/seal"
    description: "Seal evidence (requires a prior COLLECTED custody event); appends a SEALED custody event"
    roles: [LPAnalyst]
    code: 200
    input: []
    output: EvidenceItem
    side_effects: ["status -> SEALED; sealed_by stamped; SEALED CustodyEvent appended"]

  - method: POST
    path: "/evidence-items/{evidence_id}/unseal"
    description: "Unseal evidence (blocked while legal_hold)"
    roles: [LPManager]
    code: 200
    input: []
    output: EvidenceItem
    side_effects: ["status -> ACTIVE"]

  - method: POST
    path: "/evidence-items/{evidence_id}/release"
    description: "Release sealed evidence to law enforcement (requires an ACKNOWLEDGED packet on the case)"
    roles: [LPManager]
    code: 200
    input: []
    output: EvidenceItem
    side_effects: ["status -> RELEASED; RELEASED_TO_LE CustodyEvent appended"]

  - method: POST
    path: "/evidence-items/{evidence_id}/custody-events"
    description: "Append a custody event; ACCESSED/TRANSFERRED forbidden while SEALED"
    roles: [LPAnalyst, LPManager]
    code: 201
    input: [action, "note?"]
    output: CustodyEvent
    side_effects: ["actor_id stamped from X-User-ID"]

  - method: GET
    path: "/custody-events"
    description: "List custody events (chain-of-custody read)"
    roles: [LPAnalyst, LPManager, HRPartner, LPAdmin, Auditor, PosFeed]
    code: 200
    input: ["evidence_id?", "action?", "limit?", "offset?"]
    output: CustodyEvent[]
    side_effects: []

  - method: GET
    path: "/custody-events/{custody_event_id}"
    description: "Get a single custody event"
    roles: [LPAnalyst, LPManager, HRPartner, LPAdmin, Auditor, PosFeed]
    code: 200
    input: []
    output: CustodyEvent
    side_effects: []

  # --- Civil demands ---
  - method: POST
    path: "/civil-demands"
    description: "Draft a civil demand (assignee only; case must be INTERVIEWED or ADJUDICATING; OCC on case version; supersedes any existing DRAFT which is auto-CANCELLED)"
    roles: [LPAnalyst]
    code: 201
    input: [case_id, basis, expected_case_version, "priors_offense_count?", "recovery_cost_cents?"]
    output: CivilDemand
    side_effects: ["status=DRAFT; created_by stamped; prior DRAFT for the case -> CANCELLED; increments Case.version by 1"]

  - method: GET
    path: "/civil-demands"
    description: "List civil demands"
    roles: [LPAnalyst, LPManager, HRPartner, LPAdmin, Auditor, PosFeed]
    code: 200
    input: ["case_id?", "status?", "basis?", "limit?", "offset?"]
    output: CivilDemand[]
    side_effects: []

  - method: GET
    path: "/civil-demands/{demand_id}"
    description: "Get a civil demand"
    roles: [LPAnalyst, LPManager, HRPartner, LPAdmin, Auditor, PosFeed]
    code: 200
    input: []
    output: CivilDemand
    side_effects: []

  - method: POST
    path: "/civil-demands/{demand_id}/issue"
    description: "Issue a DRAFT demand (issuer must differ from drafter; snapshots amounts)"
    roles: [LPManager]
    code: 200
    input: []
    output: CivilDemand
    side_effects: ["status -> ISSUED; amounts snapshotted; issued_at stamped"]

  - method: POST
    path: "/civil-demands/{demand_id}/write-off"
    description: "Write off an issued demand with outstanding <= 50000"
    roles: [LPManager]
    code: 200
    input: []
    output: CivilDemand
    side_effects: ["status -> WRITTEN_OFF"]

  - method: POST
    path: "/civil-demands/{demand_id}/cancel"
    description: "Cancel a DRAFT demand"
    roles: [LPManager]
    code: 200
    input: []
    output: CivilDemand
    side_effects: ["status -> CANCELLED"]

  # --- Restitution payments ---
  - method: POST
    path: "/restitution-payments"
    description: "Record a payment against a demand (RECEIVED)"
    roles: [LPAnalyst]
    code: 201
    input: [demand_id, amount_cents, method]
    output: RestitutionPayment
    side_effects: ["status=RECEIVED"]

  - method: GET
    path: "/restitution-payments"
    description: "List restitution payments"
    roles: [LPAnalyst, LPManager, HRPartner, LPAdmin, Auditor, PosFeed]
    code: 200
    input: ["demand_id?", "status?", "method?", "limit?", "offset?"]
    output: RestitutionPayment[]
    side_effects: []

  - method: GET
    path: "/restitution-payments/{payment_id}"
    description: "Get a restitution payment"
    roles: [LPAnalyst, LPManager, HRPartner, LPAdmin, Auditor, PosFeed]
    code: 200
    input: []
    output: RestitutionPayment
    side_effects: []

  - method: POST
    path: "/restitution-payments/{payment_id}/post"
    description: "Post a RECEIVED payment (waterfall allocation; amount must not exceed outstanding)"
    roles: [LPAnalyst]
    code: 200
    input: []
    output: RestitutionPayment
    side_effects: ["status -> POSTED; waterfall applied; demand/store/case rollups recomputed"]

  - method: POST
    path: "/restitution-payments/{payment_id}/return"
    description: "Return a POSTED payment (NSF); adds 2500 fee and reverses allocations"
    roles: [LPAnalyst]
    code: 200
    input: []
    output: RestitutionPayment
    side_effects: ["status -> RETURNED; NSF fee added; allocations reversed; demand/store/case rollups recomputed"]

  # --- ORC groups & links ---
  - method: POST
    path: "/orc-groups"
    description: "Create an ORC group"
    roles: [LPManager]
    code: 201
    input: [name, "description?"]
    output: OrcGroup
    side_effects: ["status=IDENTIFIED; counters 0"]

  - method: GET
    path: "/orc-groups"
    description: "List ORC groups"
    roles: [LPAnalyst, LPManager, HRPartner, LPAdmin, Auditor, PosFeed]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: OrcGroup[]
    side_effects: []

  - method: GET
    path: "/orc-groups/{group_id}"
    description: "Get an ORC group"
    roles: [LPAnalyst, LPManager, HRPartner, LPAdmin, Auditor, PosFeed]
    code: 200
    input: []
    output: OrcGroup
    side_effects: []

  - method: POST
    path: "/orc-groups/{group_id}/disrupt"
    description: "Mark an ACTIVE_MONITORING group disrupted; PROPOSED links auto-rejected"
    roles: [LPManager]
    code: 200
    input: []
    output: OrcGroup
    side_effects: ["status -> DISRUPTED; PROPOSED links -> REJECTED"]

  - method: POST
    path: "/orc-groups/{group_id}/dismiss"
    description: "Dismiss a group with no PROPOSED links and zero CONFIRMED links"
    roles: [LPManager]
    code: 200
    input: []
    output: OrcGroup
    side_effects: ["status -> DISMISSED"]

  - method: POST
    path: "/case-links"
    description: "Propose a link between a case and an ORC group"
    roles: [LPAnalyst]
    code: 201
    input: [case_id, orc_group_id, link_score]
    output: CaseLink
    side_effects: ["status=PROPOSED"]

  - method: GET
    path: "/case-links"
    description: "List case links"
    roles: [LPAnalyst, LPManager, HRPartner, LPAdmin, Auditor, PosFeed]
    code: 200
    input: ["case_id?", "orc_group_id?", "status?", "limit?", "offset?"]
    output: CaseLink[]
    side_effects: []

  - method: GET
    path: "/case-links/{link_id}"
    description: "Get a case link"
    roles: [LPAnalyst, LPManager, HRPartner, LPAdmin, Auditor, PosFeed]
    code: 200
    input: []
    output: CaseLink
    side_effects: []

  - method: POST
    path: "/case-links/{link_id}/confirm"
    description: "Confirm a PROPOSED link; recomputes group counters and may escalate the group"
    roles: [LPManager]
    code: 200
    input: []
    output: CaseLink
    side_effects: ["status -> CONFIRMED; group counters recomputed; escalation evaluated; case priority recomputed"]

  - method: POST
    path: "/case-links/{link_id}/reject"
    description: "Reject a PROPOSED link"
    roles: [LPManager]
    code: 200
    input: []
    output: CaseLink
    side_effects: ["status -> REJECTED"]

  # --- Shrink periods ---
  - method: POST
    path: "/shrink-periods"
    description: "Create a shrink period for a store (strictly disjoint closed intervals per store)"
    roles: [LPAdmin]
    code: 201
    input: [store_id, period_start, period_end, book_inventory_cents, period_sales_cents]
    output: ShrinkPeriod
    side_effects: ["status=OPEN; known_loss_posted_cents=0"]

  - method: GET
    path: "/shrink-periods"
    description: "List shrink periods"
    roles: [LPAnalyst, LPManager, HRPartner, LPAdmin, Auditor, PosFeed]
    code: 200
    input: ["store_id?", "status?", "auto_case_id?", "limit?", "offset?"]
    output: ShrinkPeriod[]
    side_effects: []

  - method: GET
    path: "/shrink-periods/{period_id}"
    description: "Get a shrink period"
    roles: [LPAnalyst, LPManager, HRPartner, LPAdmin, Auditor, PosFeed]
    code: 200
    input: []
    output: ShrinkPeriod
    side_effects: []

  - method: POST
    path: "/shrink-periods/{period_id}/record-count"
    description: "Record or supersede the physical count (OCC on period version)"
    roles: [LPAdmin]
    code: 200
    input: [counted_inventory_cents, expected_shrink_period_version]
    output: ShrinkPeriod
    side_effects: ["status OPEN->COUNTED (or recount in place); counted_at stamped; increments ShrinkPeriod.version by 1"]

  - method: POST
    path: "/shrink-periods/{period_id}/reconcile"
    description: "Reconcile a COUNTED period; snapshots variance; breach auto-creates a shrink case"
    roles: [LPAdmin]
    code: 200
    input: []
    output: ShrinkPeriod
    side_effects: ["status -> RECONCILED; variance snapshot; auto-case on |variance_pct| >= 0.0200"]

  - method: POST
    path: "/shrink-periods/{period_id}/close"
    description: "Close a RECONCILED period"
    roles: [LPAdmin]
    code: 200
    input: []
    output: ShrinkPeriod
    side_effects: ["status -> CLOSED"]

  # --- Referral packets ---
  - method: POST
    path: "/referral-packets"
    description: "Draft a law-enforcement referral packet for a case (assignee only; case must be CLOSED_SUBSTANTIATED)"
    roles: [LPAnalyst]
    code: 201
    input: [case_id, jurisdiction_code]
    output: ReferralPacket
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/referral-packets"
    description: "List referral packets"
    roles: [LPAnalyst, LPManager, HRPartner, LPAdmin, Auditor, PosFeed]
    code: 200
    input: ["case_id?", "status?", "limit?", "offset?"]
    output: ReferralPacket[]
    side_effects: []

  - method: GET
    path: "/referral-packets/{packet_id}"
    description: "Get a referral packet"
    roles: [LPAnalyst, LPManager, HRPartner, LPAdmin, Auditor, PosFeed]
    code: 200
    input: []
    output: ReferralPacket
    side_effects: []

  - method: POST
    path: "/referral-packets/{packet_id}/seal"
    description: "Seal a DRAFT packet (all case ACTIVE evidence must be SEALED with complete custody)"
    roles: [LPAnalyst]
    code: 200
    input: []
    output: ReferralPacket
    side_effects: ["status -> SEALED; packet_exposure_cents snapshot"]

  - method: POST
    path: "/referral-packets/{packet_id}/submit"
    description: "Submit a SEALED packet to LE (case must be CLOSED_SUBSTANTIATED, no DRAFT demand); sets legal hold"
    roles: [LPManager]
    code: 200
    input: []
    output: ReferralPacket
    side_effects: ["status -> SUBMITTED; submitted_at stamped; case evidence legal_hold = true"]

  - method: POST
    path: "/referral-packets/{packet_id}/acknowledge"
    description: "Record LE response: outcome ACKNOWLEDGED or RETURNED (RETURNED clears legal hold)"
    roles: [LPManager]
    code: 200
    input: [outcome, "return_reason?"]
    output: ReferralPacket
    side_effects: ["status -> ACKNOWLEDGED or RETURNED; legal_hold cleared on RETURNED"]

  - method: POST
    path: "/referral-packets/{packet_id}/revise"
    description: "Return a RETURNED packet to DRAFT for corrections (assignee only)"
    roles: [LPAnalyst]
    code: 200
    input: []
    output: ReferralPacket
    side_effects: ["status -> DRAFT"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID or X-User-Role header missing, malformed, or role value not one of the six declared roles"
  - id: ERR_FORBIDDEN_FOR_ROLE
    http: 403
    condition: "Role not permitted for this endpoint, including subject-type routing on adjudicate"
  - id: ERR_NOT_CASE_ASSIGNEE
    http: 403
    condition: "Actor is not the case's assigned_analyst_id on an assignee-scoped operation"
  - id: ERR_INTERVIEWER_MISMATCH
    http: 403
    condition: "Actor is not the interview's interviewer_id on record-outcome/document"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body, missing required field, enum outside domain, non-positive amount, scheduled_end <= scheduled_start, period_end < period_start, limit outside [1,100], offset < 0"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path or body-referenced resource id does not exist"
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "Target entity's own state machine rejects the transition from its current state"
  - id: ERR_DEMAND_NOT_PAYABLE
    http: 409
    condition: "Payment posting attempted on a demand not in ISSUED or PARTIALLY_PAID"
  - id: ERR_STORE_CLOSED
    http: 409
    condition: "Child creation (employee, event, case, period) references a CLOSED store"
  - id: ERR_EMPLOYEE_NOT_ACTIVE
    http: 409
    condition: "Employee is TERMINATED and the operation (convert EMPLOYEE case, manual EMPLOYEE case creation, resolve-subject to EMPLOYEE, schedule interview) requires a non-terminated employee"
  - id: ERR_PERIOD_LOCKED
    http: 409
    condition: "Shrink period is RECONCILED or CLOSED where the operation (record-count, reopen reversal, store close with OPEN/COUNTED period) requires otherwise"
  - id: ERR_GROUP_NOT_LINKABLE
    http: 409
    condition: "ORC group is DISRUPTED/DISMISSED for new links, or dismiss attempted with confirmed_case_count > 0"
  - id: ERR_CASE_NOT_REFERRABLE
    http: 409
    condition: "close-referred or evidence release requires an ACKNOWLEDGED referral packet on the case"
  - id: ERR_STALE_CASE_VERSION
    http: 412
    condition: "expected_case_version does not match the Case's current version"
  - id: ERR_STALE_PERIOD_VERSION
    http: 412
    condition: "expected_shrink_period_version does not match the ShrinkPeriod's current version"
  - id: ERR_SOD_INTERVIEWER_ADJUDICATOR
    http: 409
    condition: "Adjudicator conducted a DOCUMENTED interview on this case"
  - id: ERR_SOD_CASE_CREATOR
    http: 409
    condition: "Adjudicator is the analyst who created the case"
  - id: ERR_SOD_DEMAND_ISSUER
    http: 409
    condition: "Demand issuer is the analyst who drafted the demand"
  - id: ERR_EVIDENCE_SEALED_IMMUTABLE
    http: 409
    condition: "Custody ACCESSED/TRANSFERRED attempted on SEALED evidence"
  - id: ERR_LEGAL_HOLD_ACTIVE
    http: 409
    condition: "Unseal attempted while a SUBMITTED/ACKNOWLEDGED referral packet holds the evidence"
  - id: ERR_CUSTODY_GAP
    http: 409
    condition: "Seal attempted with no COLLECTED custody event on the item (or on the packet: a sealed item lacks one)"
  - id: ERR_INTERVIEW_OVERLAP
    http: 409
    condition: "New interview window [scheduled_start, scheduled_end) overlaps another SCHEDULED/HELD interview for the same employee; touching endpoints allowed"
  - id: ERR_PERIOD_OVERLAP
    http: 409
    condition: "New shrink period's closed interval [period_start, period_end] intersects or touches another period of the same store"
  - id: ERR_INTERVIEW_DOC_STALE
    http: 409
    condition: "Adjudication attempted when the latest DOCUMENTED interview has doc_stale=true and documentation_override is not true"
  - id: ERR_DEMAND_WINDOW_CLOSED
    http: 409
    condition: "Issue attempted more than 60 days after case adjudication"
  - id: ERR_REOPEN_WINDOW_CLOSED
    http: 409
    condition: "Reopen attempted more than 30 days after closed_at"
  - id: ERR_DUPLICATE_STORE_NUMBER
    http: 409
    condition: "store_number already exists"
  - id: ERR_DUPLICATE_EMPLOYEE_REF
    http: 409
    condition: "employee_ref already exists"
  - id: ERR_DUPLICATE_GROUP_NAME
    http: 409
    condition: "OrcGroup name already exists"
  - id: ERR_LINK_EXISTS
    http: 409
    condition: "A non-REJECTED CaseLink already exists for this (case_id, orc_group_id)"
  - id: ERR_SUBJECT_MISMATCH
    http: 409
    condition: "subject_type=EMPLOYEE requires employee_id equal to the alert's employee_id; EXTERNAL/UNKNOWN require null employee_id"
  - id: ERR_SUBJECT_UNRESOLVED
    http: 409
    condition: "Advance to ADJUDICATING attempted with subject_type=UNKNOWN"
  - id: ERR_NO_ACTIVE_EVIDENCE
    http: 409
    condition: "Advance to READY_FOR_INTERVIEW attempted with zero evidence items in ACTIVE or SEALED status"
  - id: ERR_DEMAND_REQUIRED
    http: 409
    condition: "SUBSTANTIATED adjudication requires a DRAFT or ISSUED civil demand unless restitution_waived=true"
  - id: ERR_PACKET_NOT_READY
    http: 409
    condition: "Packet submit requires case CLOSED_SUBSTANTIATED and no DRAFT civil demand on the case"
  - id: ERR_COUNT_REQUIRED
    http: 409
    condition: "Reconcile attempted while period is still OPEN (no count recorded)"
  - id: ERR_CASE_HAS_PAYMENTS
    http: 409
    condition: "Reopen attempted while any demand of the case has a POSTED payment"
  - id: ERR_GROUP_HAS_PROPOSED_LINKS
    http: 409
    condition: "Group dismiss attempted with PROPOSED links outstanding"
  - id: ERR_MERGE_NOT_ALLOWED
    http: 409
    condition: "Source not in INVESTIGATING/READY_FOR_INTERVIEW, target terminal/MERGED, or target equals source"
  - id: ERR_NO_OPEN_PERIOD
    http: 409
    condition: "SUBSTANTIATED adjudication found no ShrinkPeriod for the store containing today's date with status OPEN or COUNTED"
  - id: ERR_EVIDENCE_UNSEALED
    http: 409
    condition: "Packet seal attempted while a case evidence item is still ACTIVE"
  - id: ERR_PAYMENT_EXCEEDS_OUTSTANDING
    http: 409
    condition: "Payment amount_cents exceeds demand outstanding_cents"
  - id: ERR_WRITE_OFF_CAP_EXCEEDED
    http: 409
    condition: "Write-off attempted with outstanding_cents > 50000"
  - id: ERR_RECOVERED_EXCEEDS_LOSS
    http: 409
    condition: "recovered_value_cents would exceed member-event sum + manual_loss_cents"
  - id: ERR_BASIS_NOT_ALLOWED
    http: 409
    condition: "STATUTORY basis on an EMPLOYEE-subject case"

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: LPAnalyst
    description: "Store-level loss-prevention analyst: triages alerts, builds cases, conducts interviews, drafts demands and packets, records payments"
    identity: opaque
    exclusive_operations:
      - "POST /alerts/{id}/convert"
      - "POST /cases (manual create)"
      - "POST /cases/{id}/advance"
      - "POST /interviews, POST /interviews/{id}/record-outcome, POST /interviews/{id}/document, POST /interviews/{id}/cancel"
      - "POST /evidence-items, POST /evidence-items/{id}/seal"
      - "POST /civil-demands"
      - "POST /restitution-payments, POST /restitution-payments/{id}/post, POST /restitution-payments/{id}/return"
      - "POST /case-links"
      - "POST /referral-packets, POST /referral-packets/{id}/seal, POST /referral-packets/{id}/revise"
    shared_operations:
      - "POST /alerts/{id}/dismiss (OPEN alerts only; shared with LPManager)"
      - "POST /evidence-items/{id}/custody-events (shared with LPManager)"
      - "All GET endpoints (shared with all roles)"

  - name: LPManager
    description: "Regional LP manager: assigns and adjudicates external cases, issues demands, confirms ORC links, manages groups, submits referrals"
    identity: opaque
    exclusive_operations:
      - "POST /cases/{id}/assign, /dismiss, /reopen, /merge, /close-referred"
      - "POST /cases/{id}/adjudicate for EXTERNAL-subject cases"
      - "POST /civil-demands/{id}/issue, /write-off, /cancel"
      - "POST /evidence-items/{id}/unseal, /release"
      - "POST /orc-groups, /orc-groups/{id}/disrupt, /orc-groups/{id}/dismiss"
      - "POST /case-links/{id}/confirm, /reject"
      - "POST /referral-packets/{id}/submit, /acknowledge"
      - "POST /alerts/{id}/dismiss on ESCALATED alerts (role gating by alert status)"
    shared_operations:
      - "POST /alerts/{id}/dismiss, POST /evidence-items/{id}/custody-events, all GET endpoints"

  - name: HRPartner
    description: "Human-resources partner: owns the employee registry and adjudicates EMPLOYEE-subject cases"
    identity: opaque
    exclusive_operations:
      - "POST /employees, POST /employees/{id}/suspend, POST /employees/{id}/reinstate"
      - "POST /cases/{id}/adjudicate for EMPLOYEE-subject cases"
    shared_operations:
      - "All GET endpoints"

  - name: LPAdmin
    description: "LP system administrator: store registry, shrink periods and counts, reconciliation, retention sweeps, logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /stores, POST /stores/{id}/close"
      - "POST /shrink-periods, /record-count, /reconcile, /close"
      - "POST /ops/retention-sweep"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"

  - name: Auditor
    description: "Read-only oversight role"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "All GET endpoints"

  - name: PosFeed
    description: "Machine account that ingests POS exception events"
    identity: opaque
    exclusive_operations:
      - "POST /exception-events"
    shared_operations:
      - "All GET endpoints"
