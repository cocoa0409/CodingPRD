            - "LiveEvent.${evt_b_id}.status == PLANNED"
            - "LiveEvent.${evt_b_id}.reserved_ccu_at_approval == 0"
            - "CapacityCluster.${cluster_id}.reserved_ccu == 6000 immediately after the rejected approval"
