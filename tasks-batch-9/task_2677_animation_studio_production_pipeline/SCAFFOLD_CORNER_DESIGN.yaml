      - name: render_reservation_beyond_allowance_rejects
        claim_type: triggerable_error
        grounds:
          - errors[ERR_RENDER_BUDGET_EXCEEDED]
          - validations[priority=34]
        distinguishing_aspect: |
          The render allowance is its own 402 ceiling, independent of budget_cents and of pool capacity: with
          an allowance of 500 cents an 840-cent reservation is refused even though 100 cores are free, and a
          7-cent single-frame reservation on the same pool and window is admitted.
