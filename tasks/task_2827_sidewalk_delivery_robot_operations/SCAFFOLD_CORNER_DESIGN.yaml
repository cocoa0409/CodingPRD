  - section: cross_cutting_complexity_layers
    instances:
      - name: bay_reservation_create_rejects_a_stale_bay_version
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[bay-reservation-create-stale-bay]"
          - "errors.ERR_STALE_BAY_VERSION"
          - "entities.DepotBay.fields.committed_minutes"
          - "entities.ServiceZone.fields.reserved_bay_minutes"
        distinguishing_aspect: >-
          The bay OCC pins the ledger the client reasoned about, not the row it wrote: the first reservation
          advances the bay to version 2 by committing 60 minutes, so a second, perfectly non-overlapping
          window that still carries version 1 is refused with 412 ERR_STALE_BAY_VERSION, and the identical
          body succeeds once the client re-reads the version - which is how both ledgers reach 120 minutes.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T09:00:00.000Z"
            - "ServiceZone Z1 PERMITTED with one APPROVED segment and reserved_bay_minutes 0"
            - "DepotBay B1 is a CHARGE bay in state OPEN with committed_minutes 0 and version 1"
            - "Robot R1 is AVAILABLE in the same zone"
            - "the version 1 of B1 was captured into b_v at creation, before any reservation existed"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /service-zones"
              payload: { name: "Mission District", municipality_code: "SF", ordinance_min_clearance_cm: 90.0, ordinance_max_speed_cm_s: 160, operating_window_start_utc_hhmm: "0700", operating_window_end_utc_hhmm: "2100", max_concurrent_robots: 2, planning_haul_m: 800.0, planning_crossings: 2, remedy_budget_cents: 50000 }
              as: PlatformAdmin
              captures: { z: $.data.id }
            - call: "POST /sidewalk-segments"
              payload: { zone_id: "${z}", segment_code: "S1", segment_type: "WALKWAY", length_m: 320.0, measured_clearance_cm: 118.0, surface_grade_pct: 2.0, sightline_m: 40.0, pedestrian_flow_per_min: 5.0, curb_ramp_present: true }
              as: PlatformAdmin
              captures: { s1: $.data.id }
            - call: "POST /sidewalk-segments/${s1}/transitions"
              payload: { action: "SURVEY" }
              as: PlatformAdmin
            - call: "POST /sidewalk-segments/${s1}/transitions"
              payload: { action: "APPROVE" }
              as: PlatformAdmin
            - call: "POST /service-zones/${z}/permit-transitions"
              payload: { action: "ACTIVATE_PERMIT" }
              as: PlatformAdmin
            - call: "POST /robots"
              payload: { zone_id: "${z}", asset_tag: "RBT-001", width_cm: 78.0, container_capacity_liters: 60.0, max_speed_cm_s: 150 }
              as: PlatformAdmin
              captures: { r: $.data.id }
            - call: "POST /robots/${r}/duty-transitions"
              payload: { action: "STAGE" }
              as: FleetDispatcher
            - call: "POST /robots/${r}/duty-transitions"
              payload: { action: "MAKE_AVAILABLE" }
              as: FleetDispatcher
            - call: "POST /depot-bays"
              payload: { zone_id: "${z}", bay_code: "B1", bay_type: "CHARGE", power_kw: 22.0, state: "OPEN" }
              as: PlatformAdmin
              captures: { b: $.data.id, b_v: $.data.version }
          trigger:
            - call: "POST /bay-reservations"
              payload: { bay_id: "${b}", robot_id: "${r}", reservation_type: "CHARGE", window_start_utc: "2026-08-03T10:00:00.000Z", window_end_utc: "2026-08-03T11:00:00.000Z", expected_depot_bay_version: "${b_v}" }
              as: FleetDispatcher
              captures: { res1: $.data.id }
            - call: "POST /bay-reservations"
              payload: { bay_id: "${b}", robot_id: "${r}", reservation_type: "CHARGE", window_start_utc: "2026-08-03T13:00:00.000Z", window_end_utc: "2026-08-03T14:00:00.000Z", expected_depot_bay_version: "${b_v}" }
              as: FleetDispatcher
              captures: { res2: $.data.id }
            - call: "GET /depot-bays/${b}"
              as: FleetDispatcher
              captures: { b_v2: $.data.version }
            - call: "POST /bay-reservations"
              payload: { bay_id: "${b}", robot_id: "${r}", reservation_type: "CHARGE", window_start_utc: "2026-08-03T13:00:00.000Z", window_end_utc: "2026-08-03T14:00:00.000Z", expected_depot_bay_version: "${b_v2}" }
              as: FleetDispatcher
              captures: { res3: $.data.id }
          assert:
            - "the first reservation returns 201 with BayReservation.${res1}.state == HELD and window_minutes == 60"
            - "DepotBay.${b}.committed_minutes == 60 and DepotBay.${b}.version == 2"
            - "the second reservation returns 412 with error_id ERR_STALE_BAY_VERSION"
            - "DepotBay.${b}.committed_minutes == 60 and ServiceZone.${z}.reserved_bay_minutes == 60 after that refusal"
            - "the re-read reports version 2, and the retry with it returns 201 with window_minutes == 60"
            - "DepotBay.${b}.committed_minutes == 120, DepotBay.${b}.version == 3 and ServiceZone.${z}.reserved_bay_minutes == 120"
