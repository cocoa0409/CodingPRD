              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_TIMELY_FILING_EXPIRED (temporal, priority 7)"
            - "error_id != ERR_ATTACHMENT_REQUIREMENT_UNMET (constraint, priority 10) even though CLINICAL_NOTES is missing"
            - "appeal remains LETTER_GENERATED; denial remains IN_APPEAL (in-flight appeal is not swept)"

      - name: writeoff_approve_sod_beats_fiscal
        grounds:
          - validations[priority=9]
          - validations[priority=11]
        distinguishing_aspect: |
          Category pair business_safety x business_fiscal: a manager whose user id
          equals the requester's id approving an ESCALATED-tier request hits
          ERR_SEGREGATION_OF_DUTIES (priority 9), never ERR_APPROVAL_LIMIT_EXCEEDED
          (priority 11). Third distinct category pairing.
        test_recipe:
          setup:
            - "Payer A with level-1 policy; code CO-16; denial CLM-911 (denied 4000000) triaged and assigned"
            - "WriteOffRequest W for 4000000 created by user spec-9 -> ESCALATED_DIRECTOR"
          setup_api_calls:
