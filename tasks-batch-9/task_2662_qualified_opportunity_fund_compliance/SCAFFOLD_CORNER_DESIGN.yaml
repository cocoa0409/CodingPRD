            - call: "POST /qof/wcsh-plans"
              payload: { qoz_business_id: "${biz_id}", window_start: "2026-01-01T00:00:00Z", covered_amount: 300000.00, written_plan_reference: "WP-2662-SHELTER-1", schedule_month_count: 3, spend_schedule: [ { month_index: 1, planned_amount: 100000.00 }, { month_index: 2, planned_amount: 100000.00 }, { month_index: 3, planned_amount: 100000.00 } ] }
              as: FundManager
