        distinguishing_aspect: "Fiscal check is <= semantics: order total exactly equal to the credit limit confirms cleanly; one cent over fails with 402. (The §1.8 priority instance only asserts this error loses to state; here it must actually fire.)"
        test_recipe:
          setup: ["customer A limit 10000 with order total 10000; customer B limit 9999 with order total 10000"]
          setup_api_calls:
            - call: "POST /motion/products"
              payload: { sku: "BRG-6041", description: "b", family: "BEARING", list_price_cents: 10000 }
              as: PricingAnalyst
              captures: { p_id: $.data.id }
