      - name: bid_acceptance_cascade_spawns_production_reviews_and_posture
        grounds:
          - state_machines.Bid.SUBMITTED_to_ACCEPTED
          - calculations.capacity_posture
          - entities.Production.fields.required_review_scopes
        distinguishing_aspect: |
          Depth-3 cascade from bid acceptance (different trigger than CO
          approval or strike): accept creates the Production; the production
          creation materializes required_review_scopes [STRUCTURAL, AUTOMATION]
