scenario: "Tattoo & Piercing Studio: artist portfolio/booking, non-refundable deposit toward session, hourly vs piece pricing, consent/medical waiver, age/ID verification, aftercare/touch-up policy, flash vs custom design queue, reschedule forfeiture"
domain_name: tattoo-piercing-studio
api_prefix: /studio

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: peer_roles
  consistency_model: immediate

# ===========================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# ===========================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ===========================================================================
# §1.1 Entity-Relationship Table
# ===========================================================================
entities:
  - name: Artist
    parent: null
    common_fields: true
    fields:
      - name: display_name
        type: string
        source: input
        description: Public portfolio name of the tattoo/piercing artist.
      - name: discipline
        type: enum
        source: input
        description: "Artist specialty."
        constraints: "one of {TATTOO, PIERCING, BOTH}"
      - name: hourly_rate_cents
        type: integer
        source: input
        description: Default hourly labor rate in cents for HOURLY-priced sessions.
        constraints: ">= 1000"
      - name: commission_pct
        type: number
        source: input
        description: Fraction of session gross paid out to this artist (studio keeps remainder).
        default: 0.70
        constraints: "0 < commission_pct <= 1"
      - name: accepting_custom
        type: boolean
        source: input
        description: Whether this artist currently accepts new CustomDesignRequest entries into their queue.
        default: true
      - name: completed_session_count
        type: integer
        source: computed
        description: Count of Appointment rows for this artist in terminal state COMPLETED. Updated on each completion.
        default: 0
      - name: artist_cancel_count
        type: integer
        source: computed
        description: Count of Appointment rows this artist moved to CANCELLED via artist-initiated cancel. Updated on each artist cancel.
        default: 0
      - name: late_reschedule_count
        type: integer
        source: computed
        description: Count of Appointment reschedules that fell inside the forfeiture window (deposit forfeited). Updated on each forfeiting reschedule.
        default: 0
      - name: reliability_score
        type: integer
        source: computed
        description: "STRICT-variant reliability score (see calculations.artist_reliability_score). Recomputed on completion, artist cancel, and forfeiting reschedule."
        default: 100

  - name: Client
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Legal name of the client as it appears on their ID document.
      - name: email
        type: string
        source: input
        description: Contact email; unique across all Client rows.
        constraints: "unique"
      - name: date_of_birth
        type: string
        source: input
        description: "ISO 8601 date (YYYY-MM-DD) used for age computation at booking time."
      - name: id_status
        type: enum
        source: computed
        description: "Identity/age verification posture. Starts UNVERIFIED; set by verification submission and review."
        default: UNVERIFIED
        constraints: "one of {UNVERIFIED, PENDING_REVIEW, VERIFIED, REJECTED}"
      - name: id_document_type
        type: enum
        source: input
        description: "Type of government ID submitted during verification. Null until a verification is submitted."
        constraints: "one of {DRIVERS_LICENSE, PASSPORT, STATE_ID} or null"
      - name: verified_age_years
        type: integer
        source: computed
        description: "Whole-year age computed from date_of_birth at the moment verification is APPROVED. Null until VERIFIED."

  - name: FlashDesign
    parent: null
    common_fields: true
    fields:
      - name: artist_id
        type: string
        source: input
        description: "FK -> Artist.id; the artist who drew and owns this pre-drawn flash piece."
      - name: title
        type: string
        source: input
        description: Name of the flash design.
      - name: piece_price_cents
        type: integer
        source: input
        description: Fixed piece price in cents charged when this flash is tattooed (PIECE pricing).
        constraints: ">= 1000"
      - name: estimated_minutes
        type: integer
        source: input
        description: Artist estimate of session length in minutes; used for deposit-minimum and chair-slot length.
        constraints: ">= 15"
      - name: status
        type: enum
        source: computed
        description: "Availability lifecycle of the flash piece."
        default: AVAILABLE
        constraints: "one of {AVAILABLE, RESERVED, RETIRED}"

  - name: CustomDesignRequest
    parent: null
    common_fields: true
    fields:
      - name: artist_id
        type: string
        source: input
        description: "FK -> Artist.id; the artist whose custom queue this request joins."
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; the client requesting the custom piece."
      - name: brief
        type: string
        source: input
        description: Free-text description of the desired custom design.
      - name: quoted_price_cents
        type: integer
        source: input
        description: "Quoted PIECE price in cents, set by the artist when moving the request to QUOTED. Null while PENDING."
        constraints: ">= 1000 when set"
      - name: quoted_hourly_rate_cents
        type: integer
        source: input
        description: "Quoted hourly rate in cents for HOURLY pricing of this custom piece. Null while PENDING."
        constraints: ">= 1000 when set"
      - name: estimated_minutes
        type: integer
        source: input
        description: "Artist estimate of session length in minutes, set at QUOTED. Used for deposit-minimum and chair-slot length."
        constraints: ">= 15 when set"
      - name: status
        type: enum
        source: computed
        description: "Position in the custom design queue / approval cycle."
        default: PENDING
        constraints: "one of {PENDING, QUOTED, REVISION_REQUESTED, APPROVED, DECLINED, CONVERTED}"

  - name: Appointment
    parent: null
    common_fields: true
    fields:
      - name: artist_id
        type: string
        source: input
        description: "FK -> Artist.id; the artist performing the session."
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; the client receiving the work."
      - name: chair_id
        type: string
        source: input
        description: "FK -> Chair.id; the physical station reserved for this session."
      - name: flash_design_id
        type: string
        source: input
        description: "FK -> FlashDesign.id; set when this session tattoos a flash piece. Mutually exclusive with custom_request_id."
      - name: custom_request_id
        type: string
        source: input
        description: "FK -> CustomDesignRequest.id; set when this session executes an APPROVED custom piece. Mutually exclusive with flash_design_id."
      - name: pricing_mode
        type: enum
        source: input
        description: "Whether the session is billed HOURLY (rate x time) or by fixed PIECE price."
        constraints: "one of {HOURLY, PIECE}"
      - name: piece_price_cents
        type: integer
        source: input
        description: "Fixed price in cents for PIECE mode; copied from the flash/custom source. Null for HOURLY."
        constraints: ">= 1000 when set"
      - name: hourly_rate_cents
        type: integer
        source: input
        description: "Labor rate in cents/hour for HOURLY mode. Null for PIECE."
        constraints: ">= 1000 when set"
      - name: estimated_minutes
        type: integer
        source: input
        description: Estimated session length in minutes; drives deposit-minimum and chair-slot end time.
        constraints: ">= 15"
      - name: start_at
        type: datetime
        source: input
        description: "ISO 8601 UTC session start. Half-open interval start for artist-slot and chair-slot overlap checks."
      - name: end_at
        type: datetime
        source: input
        description: "ISO 8601 UTC session end. Half-open interval end; must be after start_at."
      - name: actual_minutes
        type: integer
        source: input
        description: "Actual chair time in minutes, supplied at completion; drives HOURLY gross. Null until completion."
        constraints: ">= 1 when set"
      - name: required_deposit_cents
        type: integer
        source: computed
        description: "Minimum deposit in cents required to confirm this appointment (see calculations.required_deposit). Set at hold creation."
      - name: deposit_paid_cents
        type: integer
        source: computed
        description: "Sum of CONFIRMED Deposit.amount_cents applied to this appointment. Updated when a deposit is paid or forfeited."
        default: 0
      - name: gross_cents
        type: integer
        source: computed
        description: "Session gross in cents (see calculations.session_gross). Set at completion."
      - name: balance_due_cents
        type: integer
        source: computed
        description: "Amount still owed after deposit credit and tax (see calculations.session_final_balance). Set at completion."
      - name: status
        type: enum
        source: computed
        description: "Appointment lifecycle state."
        default: HELD
        constraints: "one of {HELD, CONFIRMED, COMPLETED, CANCELLED, NO_SHOW}"

  - name: Chair
    parent: null
    common_fields: true
    fields:
      - name: label
        type: string
        source: input
        description: Human label for the physical station (e.g. "Station 1").
      - name: cleanup_buffer_minutes
        type: integer
        source: input
        description: Minimum sanitation gap in minutes required between two sessions on this chair.
        default: 30
        constraints: ">= 0"
      - name: active
        type: boolean
        source: input
        description: Whether the chair is in service and can be reserved.
        default: true

  - name: Deposit
    parent: null
    common_fields: true
    fields:
      - name: appointment_id
        type: string
        source: input
        description: "FK -> Appointment.id; the appointment this non-refundable deposit is applied toward."
      - name: amount_cents
        type: integer
        source: input
        description: Deposit amount in cents tendered by the client.
        constraints: ">= 1"
      - name: status
        type: enum
        source: computed
        description: "Deposit lifecycle. CONFIRMED on payment; FORFEITED on late reschedule/no-show; APPLIED when credited to a completed session."
        default: CONFIRMED
        constraints: "one of {CONFIRMED, FORFEITED, APPLIED}"

  - name: ConsentWaiver
    parent: null
    common_fields: false
    fields:
      - name: appointment_id
        type: string
        source: input
        description: "FK -> Appointment.id; the session this signed consent/medical waiver authorizes."
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; the client who signed."
      - name: medical_flags
        type: array
        source: input
        description: "List of disclosed medical conditions (e.g. ['DIABETES','BLOOD_THINNER']). Empty array means none disclosed."
      - name: aftercare_acknowledged
        type: boolean
        source: input
        description: Whether the client acknowledged the aftercare instructions; must be true for the waiver to be valid.
      - name: signed_at
        type: datetime
        source: system
        description: "ISO 8601 UTC timestamp the waiver was recorded; equals created_at."

  - name: TouchUp
    parent: null
    common_fields: true
    fields:
      - name: parent_appointment_id
        type: string
        source: input
        description: "FK -> Appointment.id; the original COMPLETED session this touch-up corrects (self-referential through Appointment)."
      - name: requested_at
        type: datetime
        source: system
        description: "ISO 8601 UTC time the touch-up was requested; equals created_at."
      - name: fee_cents
        type: integer
        source: computed
        description: "Charge for the touch-up (see calculations.touchup_fee). 0 when within the free-touch-up window, else the studio touch-up flat fee."
      - name: status
        type: enum
        source: computed
        description: "Touch-up lifecycle."
        default: REQUESTED
        constraints: "one of {REQUESTED, SCHEDULED, DENIED}"

  - name: PortfolioItem
    parent: null
    common_fields: true
    fields:
      - name: artist_id
        type: string
        source: input
        description: "FK -> Artist.id; the artist who owns this portfolio showcase entry."
      - name: appointment_id
        type: string
        source: input
        description: "FK -> Appointment.id; the COMPLETED session whose work this entry showcases."
      - name: caption
        type: string
        source: input
        description: Public caption shown beside the portfolio image.
      - name: visibility
        type: enum
        source: computed
        description: "Whether the entry is publicly listed. DRAFT until published; HIDDEN after takedown."
        default: DRAFT
        constraints: "one of {DRAFT, PUBLISHED, HIDDEN}"

# ===========================================================================
# §1.2 State Machine Table
# ===========================================================================
state_machines:
  - entity: Client
    initial_state: UNVERIFIED
    terminal_states: []
    transitions:
      - from: UNVERIFIED
        to: PENDING_REVIEW
        trigger: "POST /clients/{id}/id-verification"
        actor: Client
        preconditions:
          - "client.id_status == UNVERIFIED or client.id_status == REJECTED"
          - "id_document_type is a valid enum member"
        side_effects:
          - "set Client.id_document_type from request"
        note: "Submitting an ID document for review."
      - from: PENDING_REVIEW
        to: VERIFIED
        trigger: "POST /clients/{id}/id-verification/approve"
        actor: StudioManager
        preconditions:
          - "client.id_status == PENDING_REVIEW"
          - "computed whole-year age at approval date >= MIN_AGE_YEARS"
        side_effects:
          - "set Client.verified_age_years = whole-year age at approval date"
        note: "Manager approves the identity/age check. Age gate enforced here."
      - from: PENDING_REVIEW
        to: REJECTED
        trigger: "POST /clients/{id}/id-verification/reject"
        actor: StudioManager
        preconditions:
          - "client.id_status == PENDING_REVIEW"
        side_effects:
          - "leave verified_age_years null"
        note: "Branch: review forks to VERIFIED or REJECTED with divergent side-effect sets."

  - entity: CustomDesignRequest
    initial_state: PENDING
    terminal_states: [DECLINED, CONVERTED]
    transitions:
      - from: PENDING
        to: QUOTED
        trigger: "POST /custom-requests/{id}/quote"
        actor: Artist
        preconditions:
          - "request.status == PENDING"
          - "quoted_price_cents or quoted_hourly_rate_cents provided"
          - "estimated_minutes provided and >= 15"
        side_effects:
          - "set quoted_price_cents, quoted_hourly_rate_cents, estimated_minutes from request"
      - from: QUOTED
        to: REVISION_REQUESTED
        trigger: "POST /custom-requests/{id}/request-revision"
        actor: Client
        preconditions:
          - "request.status == QUOTED"
        side_effects: []
        note: "Cycle: client bounces the quote back for rework."
      - from: REVISION_REQUESTED
        to: QUOTED
        trigger: "POST /custom-requests/{id}/quote"
        actor: Artist
        preconditions:
          - "request.status == REVISION_REQUESTED"
          - "quoted_price_cents or quoted_hourly_rate_cents provided"
          - "estimated_minutes provided and >= 15"
        side_effects:
          - "overwrite quoted_price_cents, quoted_hourly_rate_cents, estimated_minutes from request"
        note: "Cycle close: QUOTED -> REVISION_REQUESTED -> QUOTED (negotiation rounds)."
      - from: QUOTED
        to: APPROVED
        trigger: "POST /custom-requests/{id}/approve"
        actor: Client
        preconditions:
          - "request.status == QUOTED"
        side_effects: []
      - from: PENDING
        to: DECLINED
        trigger: "POST /custom-requests/{id}/decline"
        actor: Artist
        preconditions:
          - "request.status == PENDING or request.status == REVISION_REQUESTED"
        side_effects: []
      - from: REVISION_REQUESTED
        to: DECLINED
        trigger: "POST /custom-requests/{id}/decline"
        actor: Artist
        preconditions:
          - "request.status == PENDING or request.status == REVISION_REQUESTED"
        side_effects: []
      - from: APPROVED
        to: CONVERTED
        trigger: "POST /appointments (with custom_request_id)"
        actor: Client
        preconditions:
          - "request.status == APPROVED"
        side_effects:
          - "the new Appointment is HELD and references this request"
        note: "Cross-entity: booking an APPROVED custom request converts it."

  - entity: Appointment
    initial_state: HELD
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: HELD
        to: CONFIRMED
        trigger: "POST /appointments/{id}/confirm"
        actor: Client
        preconditions:
          - "appointment.status == HELD"
          - "client.id_status == VERIFIED (cross-entity: Appointment -> Client)"
          - "a valid ConsentWaiver exists for this appointment (aftercare_acknowledged == true)"
          - "appointment.deposit_paid_cents >= appointment.required_deposit_cents"
        side_effects:
          - "if flash_design_id set: FlashDesign.status -> RESERVED"
          - "if custom_request_id set: CustomDesignRequest.status -> CONVERTED"
        note: "Confirmation gate is the central compliance checkpoint."
      - from: HELD
        to: CANCELLED
        trigger: "POST /appointments/{id}/cancel"
        actor: Client
        preconditions:
          - "appointment.status == HELD or appointment.status == CONFIRMED"
        side_effects:
          - "all CONFIRMED Deposit rows for this appointment -> FORFEITED; recompute Appointment.deposit_paid_cents to 0"
          - "if flash_design_id set: FlashDesign.status -> AVAILABLE"
          - "if custom_request_id set and request was CONVERTED: leave CONVERTED (one-way)"
        note: "Client cancel forfeits deposit (non-refundable)."
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /appointments/{id}/cancel-by-artist"
        actor: Artist
        preconditions:
          - "appointment.status == HELD or appointment.status == CONFIRMED"
        side_effects:
          - "all CONFIRMED Deposit rows for this appointment -> FORFEITED is NOT applied; instead Deposit rows -> APPLIED? No — artist cancel REFUNDS: Deposit -> FORFEITED is skipped, deposits stay CONFIRMED and Appointment.deposit_paid_cents preserved for transfer"
          - "Artist.artist_cancel_count += 1"
          - "recompute Artist.reliability_score (STRICT)"
          - "if flash_design_id set: FlashDesign.status -> AVAILABLE"
        note: "Branch with divergent side effects vs client cancel: artist cancel debits the artist's reliability and does NOT forfeit the client's deposit."
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /appointments/{id}/complete"
        actor: Artist
        preconditions:
          - "appointment.status == CONFIRMED"
          - "actual_minutes provided and >= 1 when pricing_mode == HOURLY"
        side_effects:
          - "compute Appointment.gross_cents (calculations.session_gross)"
          - "compute Appointment.balance_due_cents (calculations.session_final_balance)"
          - "all CONFIRMED Deposit rows for this appointment -> APPLIED"
          - "Artist.completed_session_count += 1"
          - "recompute Artist.reliability_score (STRICT)"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /appointments/{id}/no-show"
        actor: Artist
        preconditions:
          - "appointment.status == CONFIRMED"
          - "current clock >= appointment.start_at"
        side_effects:
          - "all CONFIRMED Deposit rows for this appointment -> FORFEITED; recompute Appointment.deposit_paid_cents to 0"
          - "if flash_design_id set: FlashDesign.status -> AVAILABLE"
        note: "No-show forfeits deposit; client must pay a fresh deposit to rebook."

  - entity: TouchUp
    initial_state: REQUESTED
    terminal_states: [SCHEDULED, DENIED]
    transitions:
      - from: REQUESTED
        to: SCHEDULED
        trigger: "POST /touchups/{id}/schedule"
        actor: StudioManager
        preconditions:
          - "touchup.status == REQUESTED"
          - "parent Appointment.status == COMPLETED (cross-entity: TouchUp -> Appointment)"
        side_effects: []
      - from: REQUESTED
        to: DENIED
        trigger: "POST /touchups/{id}/deny"
        actor: StudioManager
        preconditions:
          - "touchup.status == REQUESTED"
        side_effects: []

  - entity: PortfolioItem
    initial_state: DRAFT
    terminal_states: [HIDDEN]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /portfolio-items/{id}/publish"
        actor: Artist
        preconditions:
          - "portfolio_item.visibility == DRAFT"
          - "the linked Appointment.status == COMPLETED (cross-entity: PortfolioItem -> Appointment)"
        side_effects: []
      - from: PUBLISHED
        to: HIDDEN
        trigger: "POST /portfolio-items/{id}/takedown"
        actor: Artist
        preconditions:
          - "portfolio_item.visibility == PUBLISHED"
        side_effects: []

concurrency_rules:
  - rule_id: appointment-hold-stale-chair
    parent_entity: Chair
    write_endpoint: "POST /appointments"
    occ_field: "expected_chair_version"
    description: |
      Creating an Appointment hold against a Chair whose version has advanced
      since the client last observed it is rejected. A prior hold legitimately
      reserved an overlapping slot on the same chair and bumped the chair's
      version; the current writer's view of chair availability is therefore
      stale and the hold is refused on the version mismatch.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: deposit-pay-stale-appointment
    parent_entity: Appointment
    write_endpoint: "POST /appointments/{id}/deposits"
    occ_field: "expected_appointment_version"
    description: |
      Paying a Deposit against an Appointment whose version has advanced since
      the client last observed it is rejected. A prior deposit (or a forfeiting
      reschedule) legitimately mutated the appointment and bumped its version;
      the current writer's deposit attempt carries a stale appointment view and
      is refused on the version mismatch.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ===========================================================================
# §1.3 Calculation Rules Table
# ===========================================================================
calculations:
  - name: required_deposit
    trigger: "on POST /appointments (hold creation)"
    algorithm: threshold
    formula: |
      estimate_cents =
        if pricing_mode == PIECE: piece_price_cents
        else (HOURLY): ceil(estimated_minutes / 60) * hourly_rate_cents
      raw = estimate_cents * DEPOSIT_RATE
      # round UP to a whole dollar (100 cents): single rounding step, applied
      # AFTER the full estimate is multiplied (sum-then-round), never per-component.
      required_deposit_cents = ceil(raw / 100) * 100
    input_set: "single appointment at creation; estimate_cents derived from its own pricing fields"
    constants:
      DEPOSIT_RATE: 0.20
    precision: "whole cents; final ceil to whole dollar (100 cents)"
    variants: []

  - name: session_gross
    trigger: "on appointment CONFIRMED -> COMPLETED"
    algorithm: tiered_pricing
    formula: |
      if pricing_mode == PIECE:
        gross_cents = piece_price_cents
      else (HOURLY):
        # bill in 15-minute increments, rounding the actual time UP to the next
        # whole increment, then charge per-increment = hourly_rate_cents / 4.
        increments = ceil(actual_minutes / 15)
        per_increment_cents = hourly_rate_cents / 4    # hourly_rate_cents is divisible by 4 by validation
        gross_cents = increments * per_increment_cents
    input_set: "the single appointment being completed"
    constants:
      INCREMENT_MINUTES: 15
    precision: "whole cents"
    variants:
      - name: hourly
        when: "pricing_mode == HOURLY"
        difference: "gross = ceil(actual_minutes/15) * (hourly_rate_cents/4); depends on actual_minutes"
      - name: piece
        when: "pricing_mode == PIECE"
        difference: "gross = piece_price_cents flat; actual_minutes ignored"

  - name: session_final_balance
    trigger: "on appointment CONFIRMED -> COMPLETED (after session_gross)"
    algorithm: waterfall_allocation
    formula: |
      # Evaluation order is PINNED to resolve the circular-looking dependency
      # between deposit credit and tax:
      #   step 1: pre_tax_balance = max(0, gross_cents - deposit_paid_cents)
      #   step 2: tax_cents       = round_half_up(pre_tax_balance * TAX_RATE)
      #   step 3: balance_due_cents = pre_tax_balance + tax_cents
      # Tax is charged on the post-deposit balance, NOT on gross. The deposit is
      # non-refundable and is consumed first (waterfall), so any deposit excess
      # over gross is NOT returned (pre_tax_balance floors at 0).
      pre_tax_balance = max(0, gross_cents - deposit_paid_cents)
      tax_cents = round_half_up(pre_tax_balance * TAX_RATE)
      balance_due_cents = pre_tax_balance + tax_cents
    input_set: "the single appointment being completed; deposit_paid_cents = sum of its CONFIRMED/APPLIED deposits at completion"
    constants:
      TAX_RATE: 0.08
    precision: "2 decimal places equivalent in cents, round_half_up at the tax step"
    variants: []

  - name: artist_reliability_score
    trigger: "on appointment COMPLETED, on artist cancel (CONFIRMED->CANCELLED), and on forfeiting reschedule"
    algorithm: weighted_scoring
    formula: |
      # STRICT variant is persisted to Artist.reliability_score and gates booking.
      # LENIENT variant is computed on read for portfolio display only.
      cancel_penalty   = CANCEL_WEIGHT * artist_cancel_count
      resched_penalty  = RESCHED_WEIGHT * late_reschedule_count
      strict_score  = max(SCORE_FLOOR, 100 - cancel_penalty - resched_penalty)
      lenient_score = max(SCORE_FLOOR, 100 - cancel_penalty)
    input_set: "the single Artist's own counters (artist_cancel_count, late_reschedule_count)"
    constants:
      CANCEL_WEIGHT: 5
      RESCHED_WEIGHT: 10
      SCORE_FLOOR: 0
    precision: "integer"
    variants:
      - name: strict
        when: "persisted reliability_score and the booking-eligibility gate"
        difference: "subtracts both cancel and late-reschedule penalties"
      - name: lenient
        when: "GET /artists/{id} portfolio display field reliability_score_lenient"
        difference: "subtracts only the cancel penalty; ignores late reschedules"

  - name: artist_payout
    trigger: "on GET /appointments/{id}/payout for a COMPLETED appointment"
    algorithm: weighted_scoring
    formula: |
      # >=3 inputs (gross_cents, commission_pct, SUPPLY_FEE_CENTS) with a
      # non-linear floor: the supply fee is deducted from the commission cut and
      # the result floored at 0; studio keeps the remainder.
      artist_cut_cents = max(0, round_half_up(gross_cents * commission_pct) - SUPPLY_FEE_CENTS)
      studio_cut_cents = gross_cents - artist_cut_cents
    input_set: "the COMPLETED appointment and its artist's commission_pct"
    constants:
      SUPPLY_FEE_CENTS: 3500
    precision: "whole cents, round_half_up on the commission multiply"
    variants: []

  - name: touchup_fee
    trigger: "on POST /appointments/{id}/touchups (touch-up request creation)"
    algorithm: threshold
    formula: |
      days_since = floor((request_clock - parent.completed_at_equiv) / 86400 seconds)
      # parent.completed_at_equiv is the parent Appointment.updated_at at the
      # moment it reached COMPLETED. Free touch-up if requested on or before the
      # 90th day (days_since <= FREE_WINDOW_DAYS) AND the original session's
      # ConsentWaiver had aftercare_acknowledged == true.
      if days_since <= FREE_WINDOW_DAYS and aftercare_acknowledged:
        fee_cents = 0
      else:
        fee_cents = TOUCHUP_FLAT_FEE_CENTS
    input_set: "the parent COMPLETED appointment, its waiver, and the request clock"
    constants:
      FREE_WINDOW_DAYS: 90
      TOUCHUP_FLAT_FEE_CENTS: 6000
    precision: "whole cents; days_since floored to whole days"
    variants: []

# ===========================================================================
# §1.4 Validation Rules Table (ordered by priority)
# ===========================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /clients and GET endpoints marked Anonymous"

  - priority: 2
    category: auth
    check: "role permitted for this operation per §1.7 RBAC"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all role-gated endpoints"

  - priority: 3
    category: existence
    check: "all path/body referenced resources exist (validated left-to-right in path, then body FKs)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids or FK body fields"

  - priority: 4
    category: state
    check: "target resource is in a valid state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 5
    category: business_safety
    check: "acting Client.id_status == VERIFIED before an appointment may be confirmed"
    error_id: ERR_CLIENT_NOT_VERIFIED
    http_status: 422
    applies_to: "POST /appointments/{id}/confirm"

  - priority: 6
    category: business_safety
    check: "computed whole-year client age at approval date >= MIN_AGE_YEARS (18) when approving verification"
    error_id: ERR_UNDERAGE
    http_status: 422
    applies_to: "POST /clients/{id}/id-verification/approve"

  - priority: 7
    category: business_safety
    check: "a valid ConsentWaiver (aftercare_acknowledged == true) exists for the appointment before confirm"
    error_id: ERR_WAIVER_MISSING
    http_status: 422
    applies_to: "POST /appointments/{id}/confirm"

  - priority: 8
    category: business_constraint
    check: "appointment specifies exactly one of flash_design_id / custom_request_id; pricing fields match the chosen mode (PIECE needs piece_price_cents, HOURLY needs hourly_rate_cents divisible by 4)"
    error_id: ERR_INVALID_PRICING
    http_status: 422
    applies_to: "POST /appointments"

  - priority: 9
    category: business_constraint
    check: "custom_request_id, if supplied, references a CustomDesignRequest in status APPROVED"
    error_id: ERR_REQUEST_NOT_APPROVED
    http_status: 422
    applies_to: "POST /appointments"

  - priority: 10
    category: business_temporal
    check: "end_at strictly after start_at"
    error_id: ERR_INVALID_INTERVAL
    http_status: 422
    applies_to: "POST /appointments"

  - priority: 11
    category: business_temporal
    check: "no half-open [start_at,end_at) overlap with another non-terminal Appointment for the same artist_id"
    error_id: ERR_ARTIST_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /appointments"

  - priority: 12
    category: business_temporal
    check: "no overlap (buffered by Chair.cleanup_buffer_minutes on each side) with another non-terminal Appointment on the same chair_id"
    error_id: ERR_CHAIR_UNAVAILABLE
    http_status: 409
    applies_to: "POST /appointments"

  - priority: 13
    category: business_fiscal
    check: "deposit amount keeps deposit_paid_cents <= required_deposit_cents is NOT required; but a deposit on a CANCELLED/COMPLETED appointment is rejected (state) — fiscal check: a deposit may not be paid after the appointment is no longer HELD/CONFIRMED"
    error_id: ERR_DEPOSIT_NOT_PAYABLE
    http_status: 422
    applies_to: "POST /appointments/{id}/deposits"

  - priority: 14
    category: business_temporal
    check: "reschedule new start_at is still strictly after current clock"
    error_id: ERR_INVALID_INTERVAL
    http_status: 422
    applies_to: "POST /appointments/{id}/reschedule"

# ===========================================================================
# §1.5 API Endpoint Table
# ===========================================================================
endpoints:
  # ---- Artist ----
  - method: POST
    path: "/studio/artists"
    description: "Register an artist."
    roles: [StudioManager]
    code: 201
    input: ["display_name", "discipline", "hourly_rate_cents", "commission_pct?", "accepting_custom?"]
    output: Artist
    side_effects: []

  - method: GET
    path: "/studio/artists/{id}"
    description: "Fetch an artist; response includes computed reliability_score (STRICT) and reliability_score_lenient (LENIENT variant)."
    roles: [StudioManager, Artist, Client]
    code: 200
    input: []
    output: Artist
    side_effects: []

  - method: GET
    path: "/studio/artists"
    description: "List artists (paginated)."
    roles: [StudioManager, Artist, Client]
    code: 200
    input: ["discipline?", "limit?", "offset?"]
    output: Artist[]
    side_effects: []

  - method: GET
    path: "/studio/artists/{id}/flash-designs"
    description: "List a given artist's flash designs (FK reverse-reachability for FlashDesign.artist_id)."
    roles: [StudioManager, Artist, Client]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: FlashDesign[]
    side_effects: []

  - method: GET
    path: "/studio/artists/{id}/custom-requests"
    description: "List the custom-design queue for an artist (FK reverse-reachability for CustomDesignRequest.artist_id)."
    roles: [StudioManager, Artist]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CustomDesignRequest[]
    side_effects: []

  # ---- Client ----
  - method: POST
    path: "/studio/clients"
    description: "Register a client. Anonymous (self-signup)."
    roles: [Anonymous]
    code: 201
    input: [full_name, email, date_of_birth]
    output: Client
    side_effects: []

  - method: GET
    path: "/studio/clients/{id}"
    description: "Fetch a client."
    roles: [StudioManager, Client]
    code: 200
    input: []
    output: Client
    side_effects: []

  - method: GET
    path: "/studio/clients/{id}/waivers"
    description: "List the consent/medical waivers a client has signed (FK reverse-reachability for ConsentWaiver.client_id)."
    roles: [StudioManager, Client]
    code: 200
    input: ["limit?", "offset?"]
    output: ConsentWaiver[]
    side_effects: []

  - method: POST
    path: "/studio/clients/{id}/id-verification"
    description: "Submit a government ID document for age/identity review."
    roles: [Client]
    code: 200
    input: [id_document_type]
    output: Client
    side_effects: ["Client.id_status UNVERIFIED/REJECTED -> PENDING_REVIEW", "set Client.id_document_type"]

  - method: POST
    path: "/studio/clients/{id}/id-verification/approve"
    description: "Manager approves the identity/age check (age gate enforced here)."
    roles: [StudioManager]
    code: 200
    input: []
    output: Client
    side_effects: ["Client.id_status PENDING_REVIEW -> VERIFIED", "set Client.verified_age_years"]

  - method: POST
    path: "/studio/clients/{id}/id-verification/reject"
    description: "Manager rejects the identity/age check."
    roles: [StudioManager]
    code: 200
    input: ["reason?"]
    output: Client
    side_effects: ["Client.id_status PENDING_REVIEW -> REJECTED"]

  # ---- FlashDesign ----
  - method: POST
    path: "/studio/flash-designs"
    description: "Artist publishes a pre-drawn flash design."
    roles: [Artist]
    code: 201
    input: [artist_id, title, piece_price_cents, estimated_minutes]
    output: FlashDesign
    side_effects: []

  - method: GET
    path: "/studio/flash-designs/{id}"
    description: "Fetch a flash design."
    roles: [StudioManager, Artist, Client]
    code: 200
    input: []
    output: FlashDesign
    side_effects: []

  - method: POST
    path: "/studio/flash-designs/{id}/retire"
    description: "Retire a flash design so it can no longer be booked."
    roles: [Artist]
    code: 200
    input: []
    output: FlashDesign
    side_effects: ["FlashDesign.status AVAILABLE -> RETIRED (only when not RESERVED)"]

  # ---- CustomDesignRequest ----
  - method: POST
    path: "/studio/custom-requests"
    description: "Client submits a custom design brief to an artist's queue."
    roles: [Client]
    code: 201
    input: [artist_id, client_id, brief]
    output: CustomDesignRequest
    side_effects: ["request created in PENDING"]

  - method: GET
    path: "/studio/custom-requests/{id}"
    description: "Fetch a custom design request."
    roles: [StudioManager, Artist, Client]
    code: 200
    input: []
    output: CustomDesignRequest
    side_effects: []

  - method: GET
    path: "/studio/custom-requests"
    description: "List custom requests, filterable by client_id (FK reverse-reachability for CustomDesignRequest.client_id)."
    roles: [StudioManager, Artist, Client]
    code: 200
    input: ["client_id?", "artist_id?", "status?", "limit?", "offset?"]
    output: CustomDesignRequest[]
    side_effects: []

  - method: POST
    path: "/studio/custom-requests/{id}/quote"
    description: "Artist quotes a price (PENDING or REVISION_REQUESTED -> QUOTED)."
    roles: [Artist]
    code: 200
    input: ["quoted_price_cents?", "quoted_hourly_rate_cents?", "estimated_minutes"]
    output: CustomDesignRequest
    side_effects: ["status -> QUOTED", "set quote fields"]

  - method: POST
    path: "/studio/custom-requests/{id}/request-revision"
    description: "Client bounces a quote back (QUOTED -> REVISION_REQUESTED)."
    roles: [Client]
    code: 200
    input: []
    output: CustomDesignRequest
    side_effects: ["status -> REVISION_REQUESTED"]

  - method: POST
    path: "/studio/custom-requests/{id}/approve"
    description: "Client accepts the quote (QUOTED -> APPROVED)."
    roles: [Client]
    code: 200
    input: []
    output: CustomDesignRequest
    side_effects: ["status -> APPROVED"]

  - method: POST
    path: "/studio/custom-requests/{id}/decline"
    description: "Artist declines a request (PENDING/REVISION_REQUESTED -> DECLINED)."
    roles: [Artist]
    code: 200
    input: []
    output: CustomDesignRequest
    side_effects: ["status -> DECLINED"]

  # ---- Chair ----
  - method: POST
    path: "/studio/chairs"
    description: "Add a physical station."
    roles: [StudioManager]
    code: 201
    input: ["label", "cleanup_buffer_minutes?", "active?"]
    output: Chair
    side_effects: []

  - method: GET
    path: "/studio/chairs/{id}"
    description: "Fetch a chair."
    roles: [StudioManager, Artist, Client]
    code: 200
    input: []
    output: Chair
    side_effects: []

  - method: GET
    path: "/studio/chairs"
    description: "List chairs."
    roles: [StudioManager, Artist, Client]
    code: 200
    input: ["active?", "limit?", "offset?"]
    output: Chair[]
    side_effects: []

  # ---- Appointment ----
  - method: POST
    path: "/studio/appointments"
    description: "Create an appointment HOLD. Validates pricing, interval, artist double-booking, and chair-buffer overlap. OCC on chair version."
    roles: [Client]
    code: 201
    input: ["artist_id", "client_id", "chair_id", "expected_chair_version", "pricing_mode", "estimated_minutes", "start_at", "end_at", "flash_design_id?", "custom_request_id?", "piece_price_cents?", "hourly_rate_cents?"]
    output: Appointment
    side_effects: ["compute required_deposit_cents", "Chair.version += 1", "if custom_request_id provided and APPROVED: it is consumed at confirm not here"]

  - method: GET
    path: "/studio/appointments/{id}"
    description: "Fetch an appointment with computed deposit_paid_cents, required_deposit_cents, and (when COMPLETED) gross_cents/balance_due_cents."
    roles: [StudioManager, Artist, Client]
    code: 200
    input: []
    output: Appointment
    side_effects: []

  - method: GET
    path: "/studio/appointments"
    description: "List appointments, filterable by artist_id, client_id, chair_id, flash_design_id, custom_request_id (FK reverse-reachability)."
    roles: [StudioManager, Artist, Client]
    code: 200
    input: ["artist_id?", "client_id?", "chair_id?", "flash_design_id?", "custom_request_id?", "status?", "limit?", "offset?"]
    output: Appointment[]
    side_effects: []

  - method: POST
    path: "/studio/appointments/{id}/deposits"
    description: "Pay a non-refundable deposit toward the appointment. OCC on appointment version."
    roles: [Client]
    code: 201
    input: [amount_cents, expected_appointment_version]
    output: Deposit
    side_effects: ["Deposit created CONFIRMED", "Appointment.deposit_paid_cents += amount_cents", "Appointment.version += 1"]

  - method: GET
    path: "/studio/appointments/{id}/deposits"
    description: "List deposits for an appointment (FK reverse-reachability for Deposit.appointment_id)."
    roles: [StudioManager, Artist, Client]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Deposit[]
    side_effects: []

  - method: POST
    path: "/studio/appointments/{id}/waiver"
    description: "Record the signed consent/medical waiver for the appointment."
    roles: [Client]
    code: 201
    input: [client_id, medical_flags, aftercare_acknowledged]
    output: ConsentWaiver
    side_effects: []

  - method: GET
    path: "/studio/appointments/{id}/waiver"
    description: "List the waiver(s) recorded for an appointment (FK reverse-reachability for ConsentWaiver.appointment_id)."
    roles: [StudioManager, Artist, Client]
    code: 200
    input: ["limit?", "offset?"]
    output: ConsentWaiver[]
    side_effects: []

  - method: POST
    path: "/studio/appointments/{id}/confirm"
    description: "Confirm a HELD appointment (compliance gate: verified client + valid waiver + deposit met)."
    roles: [Client]
    code: 200
    input: []
    output: Appointment
    side_effects: ["status -> CONFIRMED", "flash -> RESERVED or custom -> CONVERTED"]

  - method: POST
    path: "/studio/appointments/{id}/cancel"
    description: "Client cancels (HELD/CONFIRMED -> CANCELLED); deposit forfeited."
    roles: [Client]
    code: 200
    input: []
    output: Appointment
    side_effects: ["status -> CANCELLED", "deposits -> FORFEITED", "deposit_paid_cents -> 0", "flash -> AVAILABLE"]

  - method: POST
    path: "/studio/appointments/{id}/cancel-by-artist"
    description: "Artist cancels (HELD/CONFIRMED -> CANCELLED); deposit preserved, artist reliability debited."
    roles: [Artist]
    code: 200
    input: []
    output: Appointment
    side_effects: ["status -> CANCELLED", "Artist.artist_cancel_count += 1", "recompute reliability_score", "flash -> AVAILABLE"]

  - method: POST
    path: "/studio/appointments/{id}/reschedule"
    description: "Reschedule a HELD/CONFIRMED appointment to a new start/end. If inside the forfeiture window, the deposit is forfeited and a fresh deposit becomes required."
    roles: [Client]
    code: 200
    input: ["start_at", "end_at", "chair_id?", "expected_chair_version?"]
    output: Appointment
    side_effects: ["update start_at/end_at", "if inside forfeiture window: deposits -> FORFEITED, deposit_paid_cents -> 0, Artist.late_reschedule_count += 1, recompute reliability_score"]

  - method: POST
    path: "/studio/appointments/{id}/complete"
    description: "Mark a CONFIRMED appointment COMPLETED; computes gross and balance, applies deposit, bumps artist completion count."
    roles: [Artist]
    code: 200
    input: ["actual_minutes?"]
    output: Appointment
    side_effects: ["status -> COMPLETED", "compute gross_cents/balance_due_cents", "deposits -> APPLIED", "Artist.completed_session_count += 1", "recompute reliability_score"]

  - method: POST
    path: "/studio/appointments/{id}/no-show"
    description: "Artist marks a CONFIRMED appointment NO_SHOW (after start time); deposit forfeited."
    roles: [Artist]
    code: 200
    input: []
    output: Appointment
    side_effects: ["status -> NO_SHOW", "deposits -> FORFEITED", "deposit_paid_cents -> 0", "flash -> AVAILABLE"]

  - method: GET
    path: "/studio/appointments/{id}/payout"
    description: "Computed read: artist vs studio payout split for a COMPLETED appointment."
    roles: [StudioManager, Artist]
    code: 200
    input: []
    output: "{ artist_cut_cents: integer, studio_cut_cents: integer, gross_cents: integer }"
    side_effects: []

  # ---- TouchUp ----
  - method: POST
    path: "/studio/appointments/{id}/touchups"
    description: "Request an aftercare touch-up on a COMPLETED session; fee computed by free-window policy."
    roles: [Client]
    code: 201
    input: []
    output: TouchUp
    side_effects: ["compute fee_cents"]

  - method: GET
    path: "/studio/appointments/{id}/touchups"
    description: "List touch-ups for a parent appointment (FK reverse-reachability for TouchUp.parent_appointment_id)."
    roles: [StudioManager, Artist, Client]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: TouchUp[]
    side_effects: []

  - method: GET
    path: "/studio/touchups/{id}"
    description: "Fetch a touch-up."
    roles: [StudioManager, Artist, Client]
    code: 200
    input: []
    output: TouchUp
    side_effects: []

  - method: POST
    path: "/studio/touchups/{id}/schedule"
    description: "Manager schedules a requested touch-up (parent must be COMPLETED)."
    roles: [StudioManager]
    code: 200
    input: []
    output: TouchUp
    side_effects: ["status -> SCHEDULED"]

  - method: POST
    path: "/studio/touchups/{id}/deny"
    description: "Manager denies a requested touch-up."
    roles: [StudioManager]
    code: 200
    input: []
    output: TouchUp
    side_effects: ["status -> DENIED"]

  # ---- PortfolioItem ----
  - method: POST
    path: "/studio/portfolio-items"
    description: "Artist publishes a completed session to their portfolio as a DRAFT entry. Parent appointment must be COMPLETED."
    roles: [Artist]
    code: 201
    input: [artist_id, appointment_id, caption]
    output: PortfolioItem
    side_effects: ["PortfolioItem created in DRAFT"]

  - method: GET
    path: "/studio/portfolio-items/{id}"
    description: "Fetch a portfolio item."
    roles: [StudioManager, Artist, Client]
    code: 200
    input: []
    output: PortfolioItem
    side_effects: []

  - method: GET
    path: "/studio/portfolio-items"
    description: "List portfolio items, filterable by appointment_id (FK reverse-reachability for PortfolioItem.appointment_id)."
    roles: [StudioManager, Artist, Client]
    code: 200
    input: ["appointment_id?", "artist_id?", "visibility?", "limit?", "offset?"]
    output: PortfolioItem[]
    side_effects: []

  - method: GET
    path: "/studio/artists/{id}/portfolio-items"
    description: "List an artist's portfolio items (FK reverse-reachability for PortfolioItem.artist_id)."
    roles: [StudioManager, Artist, Client]
    code: 200
    input: ["visibility?", "limit?", "offset?"]
    output: PortfolioItem[]
    side_effects: []

  - method: POST
    path: "/studio/portfolio-items/{id}/publish"
    description: "Publish a DRAFT portfolio item (parent appointment must be COMPLETED)."
    roles: [Artist]
    code: 200
    input: []
    output: PortfolioItem
    side_effects: ["visibility -> PUBLISHED"]

  - method: POST
    path: "/studio/portfolio-items/{id}/takedown"
    description: "Take down a PUBLISHED portfolio item."
    roles: [Artist]
    code: 200
    input: []
    output: PortfolioItem
    side_effects: ["visibility -> HIDDEN"]

  # ---- Test-driving ----
  - method: POST
    path: "/studio/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's current UTC clock for deterministic time-gated tests."
    roles: [StudioManager]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["server clock set to to_iso8601"]

# ===========================================================================
# §1.6 Error Code Catalog
# ===========================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/invalid X-User-Role or X-User-ID header on a protected endpoint."
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted for this operation per RBAC."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced resource (path id or body FK) does not exist."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body, missing required field, or invalid enum/type."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Resource is not in a valid state for the requested transition."
  - id: ERR_CLIENT_NOT_VERIFIED
    http: 422
    condition: "Confirming an appointment whose client is not VERIFIED."
  - id: ERR_UNDERAGE
    http: 422
    condition: "Approving verification for a client whose whole-year age at approval date < MIN_AGE_YEARS (18)."
  - id: ERR_WAIVER_MISSING
    http: 422
    condition: "Confirming an appointment with no valid ConsentWaiver (aftercare_acknowledged != true)."
  - id: ERR_INVALID_PRICING
    http: 422
    condition: "Appointment does not specify exactly one source (flash/custom), or pricing fields do not match pricing_mode (HOURLY rate not divisible by 4, PIECE price missing)."
  - id: ERR_REQUEST_NOT_APPROVED
    http: 422
    condition: "Appointment references a CustomDesignRequest not in APPROVED status."
  - id: ERR_INVALID_INTERVAL
    http: 422
    condition: "end_at not strictly after start_at, or reschedule start_at not after current clock."
  - id: ERR_ARTIST_DOUBLE_BOOKED
    http: 409
    condition: "Half-open [start,end) overlap with another non-terminal appointment for the same artist."
  - id: ERR_CHAIR_UNAVAILABLE
    http: 409
    condition: "Buffered overlap with another non-terminal appointment on the same chair, or chair is inactive."
  - id: ERR_DEPOSIT_NOT_PAYABLE
    http: 422
    condition: "Deposit attempted on an appointment that is not HELD or CONFIRMED."
  - id: ERR_DEPOSIT_NOT_MET
    http: 422
    condition: "Confirming an appointment whose deposit_paid_cents < required_deposit_cents."
  - id: ERR_TOUCHUP_PARENT_NOT_COMPLETED
    http: 422
    condition: "Touch-up requested or scheduled against a parent appointment that is not COMPLETED."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "OCC: expected_*_version does not match the current parent entity version."
  - id: ERR_VALIDATION
    http: 422
    condition: "Generic business-rule violation not covered by a more specific code (e.g. quote missing both price fields)."

# ===========================================================================
# §1.7 RBAC Matrix
# ===========================================================================
roles:
  - name: StudioManager
    description: "Studio operator: manages artists, chairs, identity verification approvals, and touch-up scheduling."
    identity: "opaque"
    exclusive_operations:
      - "POST /studio/artists"
      - "POST /studio/chairs"
      - "POST /studio/clients/{id}/id-verification/approve"
      - "POST /studio/clients/{id}/id-verification/reject"
      - "POST /studio/touchups/{id}/schedule"
      - "POST /studio/touchups/{id}/deny"
      - "POST /studio/_clock/set_current_utc"
    shared_operations:
      - "GET (most read endpoints)"
      - "GET /studio/appointments/{id}/payout"

  - name: Artist
    description: "Tattoo/piercing artist: publishes flash, quotes custom work, performs and completes sessions, cancels own appointments."
    identity: "entity_backed:Artist"
    exclusive_operations:
      - "POST /studio/flash-designs"
      - "POST /studio/flash-designs/{id}/retire"
      - "POST /studio/custom-requests/{id}/quote"
      - "POST /studio/custom-requests/{id}/decline"
      - "POST /studio/appointments/{id}/complete"
      - "POST /studio/appointments/{id}/cancel-by-artist"
      - "POST /studio/appointments/{id}/no-show"
      - "POST /studio/portfolio-items"
      - "POST /studio/portfolio-items/{id}/publish"
      - "POST /studio/portfolio-items/{id}/takedown"
    shared_operations:
      - "GET (read endpoints)"
      - "GET /studio/appointments/{id}/payout"

  - name: Client
    description: "Studio client: registers, verifies ID, books/holds appointments, pays deposits, signs waivers, requests custom work and touch-ups."
    identity: "entity_backed:Client"
    exclusive_operations:
      - "POST /studio/clients/{id}/id-verification"
      - "POST /studio/custom-requests"
      - "POST /studio/custom-requests/{id}/request-revision"
      - "POST /studio/custom-requests/{id}/approve"
      - "POST /studio/appointments"
      - "POST /studio/appointments/{id}/deposits"
      - "POST /studio/appointments/{id}/waiver"
      - "POST /studio/appointments/{id}/confirm"
      - "POST /studio/appointments/{id}/cancel"
      - "POST /studio/appointments/{id}/reschedule"
      - "POST /studio/appointments/{id}/touchups"
    shared_operations:
      - "GET (read endpoints)"

  - name: Anonymous
    description: "Unauthenticated self-signup surface."
    identity: "opaque"
    exclusive_operations:
      - "POST /studio/clients"
    shared_operations: []
