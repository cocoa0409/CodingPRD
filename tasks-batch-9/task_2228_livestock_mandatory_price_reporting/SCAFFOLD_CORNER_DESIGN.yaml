            - "ReportingEntity.${ent_a}: assessed_penalty_cents == 1000000, outstanding_penalty_cents == 1000000, paid_penalty_cents == 0, delinquency_points == 8"
            - "${e_blocked} == ERR_OUTSTANDING_PENALTY_BLOCKS_ACTIVATION with HTTP 409 and Registration.${reg_a}.status stays DETERMINED"
            - "${e_partial} == ERR_PAYMENT_AMOUNT_MISMATCH with HTTP 422; PenaltyAssessment.${pen_1}.status stays ASSESSED and settled_at stays null"
