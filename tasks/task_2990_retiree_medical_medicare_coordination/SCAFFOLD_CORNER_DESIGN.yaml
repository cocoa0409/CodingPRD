  - section: rbac
    instances:
      - name: role_cannot_perform_another_roles_exclusive_operation_unauthorized
        claim_type: Cannot perform other roles exclusive operations
        grounds:
          - validations[priority=2]
          - errors.ERR_UNAUTHORIZED
          - roles.BenefitsAdmin.exclusive_operations
          - roles.EligibilityAnalyst.exclusive_operations
          - roles.Actuary.exclusive_operations
          - roles.ComplianceOfficer.exclusive_operations
          - complexity_profile.role_model
        distinguishing_aspect: |
          Under segregation_of_duties there is no super-role: BenefitsAdmin is
          refused the Actuary's attest and the ComplianceOfficer's subsidy
          certification just as bluntly as the Retiree is refused plan-year
          creation. The refusal is 403 ERR_UNAUTHORIZED rather than 404, even
          when the caller could not otherwise know the resource exists, and the
          Retiree role is additionally absent from the retiree LIST endpoint
          while still being allowed the by-id read.
