      - name: one_weather_call_cascades_four_levels_and_the_release_re_gates_each_area_separately
        claim_type: cascading_side_effects
        grounds:
          - endpoints[POST /mountain-ops/day-plans/{id}/weather]
          - state_machines.Lift.OPEN_to_WIND_HOLD
          - state_machines.Lift.WIND_HOLD_to_OPEN
          - state_machines.SnowmakingSession.SCHEDULED_to_ABORTED
          - validations[priority=26]
          - entities.SeasonConfig.fields.water_reserved_af
        distinguishing_aspect: |
          The cascade out is unconditional and four levels deep - lift, then terrain, then sessions, then
          the season water ledger - but the cascade BACK is per-area and conditional. Two areas on the same
          lift are groomed six hours apart, so when the hold is released at 18:00 exactly one of them still
          satisfies the groom-freshness gate: T2 returns to OPEN and T1 stays in PATROL_HOLD from the same
