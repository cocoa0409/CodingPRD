  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: missing_auth_header_returns_400
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_MISSING_OR_INVALID_CONTEXT_HEADER]
        distinguishing_aspect: "A request without X-User-Role / X-User-ID headers is rejected before any role, existence, or state check."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - { call: "POST /om/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EmergencyDirector }
          trigger:
            - { call: "GET /om/storm-events", payload: {}, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "Request sent with both headers absent: ${err} == ERR_MISSING_OR_INVALID_CONTEXT_HEADER (http 400), response_type == \"error\""

      - name: role_forbidden_for_telemetry_gateway_on_outage_create
        claim_type: violation_to_error
        grounds:
          - validations[priority=2]
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "TelemetryGateway is not in the roles of POST /om/outages; rejection is 403 ERR_FORBIDDEN_ROLE even with a valid body."
        test_recipe:
          setup: ["Event ACTIVE; feeder exists"]
          setup_api_calls:
            - { call: "POST /om/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EmergencyDirector }
            - call: "POST /om/storm-events"
              payload: { event_name: "Storm V2", event_type: "HURRICANE" }
              as: EmergencyDirector
              captures: { ev_id: $.data.id }
            - { call: "POST /om/storm-events/${ev_id}/activate", payload: {}, as: EmergencyDirector }
            - call: "POST /om/feeders"
              payload: { feeder_code: "FDR-1", county_code: "C1", service_customer_count: 1000 }
              as: EmergencyDirector
              captures: { fd_id: $.data.id }
          trigger:
            - { call: "POST /om/outages", payload: { storm_event_id: "${ev_id}", feeder_id: "${fd_id}" }, as: TelemetryGateway, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_FORBIDDEN_ROLE (http 403); no outage created"

      - name: referential_cross_event_link_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=6]
          - errors[ERR_CROSS_EVENT_LINK]
        distinguishing_aspect: "A nested outage whose parent belongs to a DIFFERENT storm event is rejected with ERR_CROSS_EVENT_LINK."
        test_recipe:
          setup: ["Two ACTIVE events; parent outage on event 1"]
          setup_api_calls:
            - { call: "POST /om/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EmergencyDirector }
            - call: "POST /om/storm-events"
              payload: { event_name: "Storm V3a", event_type: "HURRICANE" }
              as: EmergencyDirector
              captures: { ev1: $.data.id }
            - call: "POST /om/storm-events"
              payload: { event_name: "Storm V3b", event_type: "TORNADO" }
              as: EmergencyDirector
              captures: { ev2: $.data.id }
            - { call: "POST /om/storm-events/${ev1}/activate", payload: {}, as: EmergencyDirector }
            - { call: "POST /om/storm-events/${ev2}/activate", payload: {}, as: EmergencyDirector }
            - call: "POST /om/feeders"
