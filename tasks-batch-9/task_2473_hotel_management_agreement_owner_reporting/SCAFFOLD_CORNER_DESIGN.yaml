          assert:
            - "all four list reads return HTTP 200 with pagination.total_count == 1 and the same single row ${or_bud}"
            - "no role receives a redacted or filtered projection — the field set is identical across all four"
            - "the detail read as OwnerRep returns HTTP 200 with OperatingBudget.${or_bud}.status == DRAFT, budgeted_agop_cents == 86500000 and revision_round == 0"
            - "the roles carry identity: opaque, so no read is scoped by the acting user id"

      - name: segregation_of_duties_on_the_budget_decision
        claim_type: standard_crud
        grounds:
          - validations[priority=30]
