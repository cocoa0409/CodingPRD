  - rule_id: transitive_cascade
    instances:
      - name: order_cancel_cascade_depth3_assignment_reservation_instrument
        grounds:
          - state_machines.SurveyOrder.FIELD_READY_to_CANCELLED
          - state_machines.FieldAssignment.SCHEDULED_to_CANCELLED
          - entities.InstrumentReservation.fields.status
          - entities.Instrument.fields.status
        distinguishing_aspect: |
          Depth-3 chain triggered by SurveyOrder cancel: order CANCELLED -> each SCHEDULED FieldAssignment
          CANCELLED -> each HELD InstrumentReservation RELEASED -> each freed Instrument RESERVED->AVAILABLE;
          each hop is caused by the prior hop, not directly by the cancel.
        test_recipe:
          setup:
            - "A FIELD_READY order with one SCHEDULED FieldAssignment holding one Instrument (reservation HELD, instrument RESERVED)."
          setup_api_calls:
