  # ------------------------------------------------------- consistency model
  - section: consistency_model
    instances:
      - name: deposit_immediately_visible_in_response
        claim_type: immediate
        grounds: ["endpoints", "calculations.prepay_balance"]
        distinguishing_aspect: "POST /nutrition/students/{id}/deposit returns the updated balance_cents and account_status in the same response (immediate consistency)."
        test_recipe:
          setup: ["A student with threshold 500 and balance 0."]
          setup_api_calls:
            - { call: "POST /nutrition/sites", payload: { name: "Imm", site_code: "IMM-1" }, as: PlatformAdmin, captures: { site_id: "$.data.id" } }
            - { call: "POST /nutrition/students", payload: { site_id: "${site_id}", first_name: "Im", last_name: "Ed", grade: "GRADES_9_12", eligibility_category: "PAID", low_balance_threshold_cents: 500 }, as: PlatformAdmin, captures: { stu_id: "$.data.id" } }
          trigger:
            - { call: "POST /nutrition/students/${stu_id}/deposit", payload: { amount_cents: 1000 }, as: POSClerk, captures: { bal: "$.data.balance_cents", st: "$.data.account_status" } }
          assert:
            - "Student.${stu_id}.balance_cents == 1000"
            - "Student.${stu_id}.account_status == ACTIVE"
