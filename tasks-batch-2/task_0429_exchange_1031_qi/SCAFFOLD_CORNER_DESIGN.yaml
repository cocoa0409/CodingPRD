  # =====================================================================
  # Errors
  # =====================================================================
  - section: errors
    instances:
      - name: stale_trust_version_on_disbursement_create
        claim_type: violation_to_error
        grounds:
          - concurrency_rules[disbursement-create-stale-trust]
          - errors[ERR_STALE_TRUST_VERSION]
        distinguishing_aspect: "Creating a disbursement with an expected_qualified_trust_version one less than the current trust version returns ERR_STALE_TRUST_VERSION (412)."
        test_recipe:
          setup: ["FORWARD exchange closed; one QI_FEE disbursement already SETTLED so trust.version has advanced past the captured value"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: QICoordinator
            - call: "POST /exchangers"
              payload: { legal_name: "Stale TP", taxpayer_id: "TP-STL-1", email: "stl@x.com" }
              as: QICoordinator
              captures: { exr_id: $.data.id }
            - call: "POST /exchanges"
              payload: { exchanger_id: "${exr_id}", exchange_type: "FORWARD" }
              as: QICoordinator
              as_user_id: "coord-stl"
              captures: { ex_id: $.data.id }
            - call: "POST /exchanges/${ex_id}/relinquished-properties"
              payload: { address: "St St", fair_market_value: 500000, selling_expenses: 30000, mortgage_payoff: 120000, adjusted_basis: 180000 }
              as: QICoordinator
            - call: "POST /exchanges/${ex_id}/trust"
              payload: {}
              as: QICoordinator
              captures: { tr_id: $.data.id }
            - call: "POST /exchanges/${ex_id}/close-relinquished"
              payload: {}
              as: QICoordinator
            - call: "GET /exchanges/${ex_id}/trust"
              payload: {}
              as: QICoordinator
              captures: { tr_v0: "$.data[0].version" }
            - call: "POST /disbursements"
              payload: { exchange_id: "${ex_id}", purpose: "QI_FEE", amount: 1500, expected_qualified_trust_version: "${tr_v0}" }
              as: QICoordinator
              captures: { dis_id: $.data.id }
            - call: "POST /disbursements/${dis_id}/approve"
              payload: {}
              as: SettlementOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /disbursements"
              payload: { exchange_id: "${ex_id}", purpose: "ACQUISITION", amount: 1000, expected_qualified_trust_version: "${tr_v0}" }
              as: QICoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_TRUST_VERSION (the approve bumped trust.version above tr_v0)"
            - "HTTP status == 412"

      - name: terminate_exchange_with_funded_trust_invalid_state
        claim_type: violation_to_error
        grounds:
          - state_machines.Exchange.DRAFT_to_TERMINATED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Terminating an exchange whose trust has available_balance > 0 (after close) returns ERR_INVALID_STATE (exchange is no longer DRAFT and trust is funded)."
        test_recipe:
          setup: ["FORWARD exchange closed (ACTIVE, trust 350000)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: QICoordinator
            - call: "POST /exchangers"
              payload: { legal_name: "TermF TP", taxpayer_id: "TP-TF-1", email: "tf@x.com" }
              as: QICoordinator
              captures: { exr_id: $.data.id }
            - call: "POST /exchanges"
              payload: { exchanger_id: "${exr_id}", exchange_type: "FORWARD" }
              as: QICoordinator
              as_user_id: "coord-tf"
              captures: { ex_id: $.data.id }
            - call: "POST /exchanges/${ex_id}/relinquished-properties"
              payload: { address: "TF St", fair_market_value: 500000, selling_expenses: 30000, mortgage_payoff: 120000, adjusted_basis: 180000 }
              as: QICoordinator
            - call: "POST /exchanges/${ex_id}/trust"
              payload: {}
              as: QICoordinator
            - call: "POST /exchanges/${ex_id}/close-relinquished"
              payload: {}
              as: QICoordinator
          trigger:
            - call: "POST /exchanges/${ex_id}/terminate"
              payload: {}
              as: QICoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE (exchange ACTIVE, not DRAFT)"
            - "Exchange.${ex_id}.status == ACTIVE (unchanged)"

  # =====================================================================
  # RBAC
  # =====================================================================
  - section: rbac
    instances:
      - name: settlement_officer_cannot_create_exchange
        claim_type: exclusive_operation_denied
        grounds:
          - roles
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "SettlementOfficer calling POST /exchanges (a QICoordinator-exclusive op) returns ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["one registered exchanger"]
          setup_api_calls:
            - call: "POST /exchangers"
              payload: { legal_name: "Rbac TP", taxpayer_id: "TP-RB-1", email: "rb@x.com" }
              as: QICoordinator
              captures: { exr_id: $.data.id }
          trigger:
            - call: "POST /exchanges"
              payload: { exchanger_id: "${exr_id}", exchange_type: "FORWARD" }
              as: SettlementOfficer
              as_user_id: "officer-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHORIZED"
            - "HTTP status == 403"

