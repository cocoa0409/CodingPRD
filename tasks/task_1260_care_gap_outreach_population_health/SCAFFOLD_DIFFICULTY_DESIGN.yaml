  # -------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # -------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: attempt_plus_reversal_conserves_attempt_count
        grounds:
          - entities.CareGap.fields.attempt_count
          - entities.OutreachAttempt.fields.outcome
          - state_machines.CareGap.OUTREACH_IN_PROGRESS_to_OUTREACH_IN_PROGRESS
        distinguishing_aspect: |
          Conserved quantity: CareGap.attempt_count. A forward attempt
          (outcome != REVERSED) followed by a REVERSED attempt (a compensating
          action recorded as another OutreachAttempt row) must leave
          CareGap.attempt_count unchanged from its pre-forward-attempt value.
        test_recipe:
          setup:
            - "Registry, measure, cohort, panel, member, CALL campaign ACTIVE"
            - "CareGap in OUTREACH_IN_PROGRESS with attempt_count = 1"
          setup_api_calls:
            - call: "POST /population-health/registries"
              payload: { name: "RCI1", program_year: 2026 }
              as: ProgramAdministrator
              captures: { reg_id: $.data.id }
            - call: "POST /population-health/registries/${reg_id}/measure-definitions"
              payload: { measure_code: "SCR", measure_domain: "SCREENING", lookback_days: 365 }
              as: ProgramAdministrator
              captures: { meas_id: $.data.id }
            - call: "POST /population-health/measure-definitions/${meas_id}/publish"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /population-health/registries/${reg_id}/cohort-definitions"
              payload: { cohort_code: "C", min_age: 50, max_age: 75, risk_tier_filter: "ANY" }
              as: ProgramAdministrator
              captures: { coh_id: $.data.id }
            - call: "POST /population-health/cohort-definitions/${coh_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /population-health/registries/${reg_id}/members"
              payload: { mrn: "M", date_of_birth: "1960-01-01T00:00:00Z", risk_tier: "LOW" }
              as: ProgramAdministrator
            - call: "POST /population-health/registries/${reg_id}/registry-panels"
              payload: { cohort_id: "${coh_id}", measure_id: "${meas_id}", panel_manager_id: "pm_1" }
              as: ProgramAdministrator
              captures: { panel_id: $.data.id }
            - call: "POST /population-health/registry-panels/${panel_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /population-health/registries/${reg_id}/outreach-campaigns"
              payload:
                panel_id: "${panel_id}"
                measure_id: "${meas_id}"
                name: "C"
                channel: "CALL"
                starts_at: "2026-05-01T00:00:00Z"
                ends_at: "2026-12-31T23:59:59Z"
                min_attempt_interval_hours: 1
              as: ProgramAdministrator
              captures: { camp_id: $.data.id }
            - call: "POST /population-health/outreach-campaigns/${camp_id}/schedule"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /population-health/outreach-campaigns/${camp_id}/launch"
              payload: {}
              as: ProgramAdministrator
            - call: "GET /population-health/registry-panels/${panel_id}/care-gaps"
              payload: {}
              as: ProgramAdministrator
              captures: { gap_id: $.data.0.id, gap_v: $.data.0.version }
            - call: "POST /population-health/care-gaps/${gap_id}/outreach-attempts"
              payload: { campaign_id: "${camp_id}", channel: "CALL", outcome: "CONTACTED", expected_care_gap_version: "${gap_v}" }
              as: PanelManager
              as_user_id: "pm_1"
            - call: "POST /population-health/_clock/set_current_utc"
              payload: { registry_id: "${reg_id}", to_iso8601: "2026-05-01T02:00:00Z" }
              as: ProgramAdministrator
            - call: "GET /population-health/care-gaps/${gap_id}"
              payload: {}
              as: ProgramAdministrator
              captures: { gap_v2: $.data.version, cnt_pre: $.data.attempt_count }
          trigger:
            # forward attempt
            - call: "POST /population-health/care-gaps/${gap_id}/outreach-attempts"
              payload: { campaign_id: "${camp_id}", channel: "CALL", outcome: "NO_ANSWER", expected_care_gap_version: "${gap_v2}" }
              as: PanelManager
              as_user_id: "pm_1"
            - call: "GET /population-health/care-gaps/${gap_id}"
              payload: {}
              as: ProgramAdministrator
              captures: { gap_v3: $.data.version }
            # compensating reversal
            - call: "POST /population-health/care-gaps/${gap_id}/outreach-attempts"
              payload: { campaign_id: "${camp_id}", channel: "CALL", outcome: "REVERSED", reversal_reason: "wrong number", expected_care_gap_version: "${gap_v3}" }
              as: PanelManager
              as_user_id: "pm_1"
          assert:
            - "CareGap.${gap_id}.attempt_count == ${cnt_pre}  # conserved"

      - name: exclusion_approve_revoke_conserves_denominator
        grounds:
          - entities.MeasurePerformanceReport.fields.denominator_count
          - state_machines.ExclusionRequest.APPROVED_to_REVOKED
        distinguishing_aspect: |
          Conserved quantity: MeasurePerformanceReport.denominator_count on
          the PROVISIONAL variant. ExclusionRequest approve subtracts; a
          subsequent revoke adds back, leaving denominator_count unchanged
          from its pre-approve value. Different conserved quantity than
          attempt_count.
        test_recipe:
          setup:
            - "Registry, measure, cohort, panel, member; CareGap OPEN"
            - "PROVISIONAL report generated; denominator_count = 1"
            - "ExclusionRequest for member/measure UNDER_REVIEW"
          setup_api_calls:
            - call: "POST /population-health/registries"
              payload: { name: "RCI2", program_year: 2026 }
              as: ProgramAdministrator
              captures: { reg_id: $.data.id }
            - call: "POST /population-health/registries/${reg_id}/measure-definitions"
              payload: { measure_code: "SCR", measure_domain: "SCREENING", lookback_days: 365, exclusion_window_days: 90 }
              as: ProgramAdministrator
              captures: { meas_id: $.data.id }
            - call: "POST /population-health/measure-definitions/${meas_id}/publish"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /population-health/registries/${reg_id}/cohort-definitions"
              payload: { cohort_code: "C", min_age: 50, max_age: 75, risk_tier_filter: "ANY" }
              as: ProgramAdministrator
              captures: { coh_id: $.data.id }
            - call: "POST /population-health/cohort-definitions/${coh_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /population-health/registries/${reg_id}/members"
              payload: { mrn: "M", date_of_birth: "1960-01-01T00:00:00Z", risk_tier: "LOW" }
              as: ProgramAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /population-health/registries/${reg_id}/registry-panels"
              payload: { cohort_id: "${coh_id}", measure_id: "${meas_id}", panel_manager_id: "pm_1" }
              as: ProgramAdministrator
              captures: { panel_id: $.data.id }
            - call: "POST /population-health/registry-panels/${panel_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /population-health/measure-definitions/${meas_id}/measure-performance-reports"
              payload: { period_key: "2026-06" }
              as: ProgramAdministrator
              captures: { rep_id: $.data.id, denom_pre: $.data.denominator_count }
            - call: "POST /population-health/members/${m_id}/exclusion-requests"
              payload: { measure_id: "${meas_id}", exclusion_kind: "MEMBER_REFUSAL", justification: "member declined" , effective_from: "2026-05-01T00:00:00Z" }
              as: PanelManager
              as_user_id: "pm_1"
              captures: { exr_id: $.data.id }
            - call: "POST /population-health/exclusion-requests/${exr_id}/start-review"
              payload: {}
              as: QualityReviewer
              as_user_id: "qr_1"
          trigger:
            - call: "POST /population-health/exclusion-requests/${exr_id}/approve"
              payload: {}
              as: QualityReviewer
              as_user_id: "qr_1"
            - call: "POST /population-health/exclusion-requests/${exr_id}/revoke"
              payload: { reason: "member re-engaged" }
              as: QualityReviewer
              as_user_id: "qr_1"
            - call: "GET /population-health/measure-performance-reports/${rep_id}"
              payload: {}
              as: ProgramAdministrator
              captures: { denom_post: $.data.denominator_count }
          assert:
            - "${denom_pre} == ${denom_post}  # conserved quantity"
