      - name: board_approve_cascades_fund_posture_to_sibling_contribution_to_candidate
        grounds:
          - state_machines.PacContribution.transitions[PENDING_BOARD->BOARD_APPROVED]
          - state_machines.SegregatedFund.transitions[OPEN->RESTRICTED]
          - state_machines.PacContribution.transitions[PENDING_BOARD->SUSPENDED]
          - entities.Candidate.fields.pending_support_cents
        distinguishing_aspect: |
          Approving contribution X reaches a DIFFERENT candidate's accumulator through three hops it never names:
          X's approval lowers the fund's available balance below min_reserve, the posture flip suspends the unrelated
          sibling Y, and Y leaving PENDING_BOARD drains candidate B's pending_support_cents to zero - all inside the
          single board-approve request on X.
