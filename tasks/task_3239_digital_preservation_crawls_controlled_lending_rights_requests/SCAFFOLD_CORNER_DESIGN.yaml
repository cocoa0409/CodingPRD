      - name: credential_self_decision_rejected
        claim_type: precondition_enforcement
        grounds:
          - validations[priority=5]
          - state_machines.AccessibilityCredential.PENDING_REVIEW_to_VERIFIED
          - errors.ERR_SO_DUTY_VIOLATION
        distinguishing_aspect: "An AccessibilityOfficer whose X-User-ID equals the credential's patron_id cannot VERIFY that credential."
        test_recipe:
          setup:
            - "Patron P-AC submitted credential C-AC; officer's user id collides with P-AC's id."
          setup_api_calls:
            - call: "POST /archive/patrons"
