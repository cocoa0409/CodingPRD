scaffold_corner_design:
  # ===================================================================
  # Section: entities
  # ===================================================================
  - section: entities
    instances:
      - name: entity_client_creation_returns_system_fields
        claim_type: creation
        grounds: [entities.Client, "endpoints.POST /api/clients"]
        distinguishing_aspect: "POST /api/clients with all required fields returns 201 with server-minted id, version 1, and created_at populated."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /api/clients", payload: { name: "Acme Foods", home_market_code: "US_FDA" }, as: PlatformAdmin, captures: { cid: $.data.id, cver: $.data.version, cname: $.data.name, chm: $.data.home_market_code } }
          trigger: []
          assert:
            - "cid is a non-null UUID string"
            - "cver == 1 and cname == 'Acme Foods' and chm == US_FDA"
            - "Client.${cid}.created_at is an ISO8601 UTC timestamp with three fractional digits"

      - name: entity_product_get_not_found_returns_404
        claim_type: not_found
        grounds: [entities.Product, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET on a non-existent product id returns 404 ERR_NOT_FOUND in the standard error envelope."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/products/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NOT_FOUND and HTTP status == 404"
            - "error envelope carries data.error_id and data.message with response_type == error"

      - name: entity_recipe_create_missing_required_lines
        claim_type: required_fields
        grounds: [entities.Recipe.fields.lines, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting the required lines array on recipe creation returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["client + product exist"]
          setup_api_calls:
            - { call: "POST /api/clients", payload: { name: "Acme Foods", home_market_code: "US_FDA" }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /api/clients/${cid}/products", payload: { name: "Cookie", product_category: "BAKED_GOOD", net_weight_g: 110, total_surface_area_sq_in: 30.0, pdp_area_sq_in: 6.0, household_unit_name: "piece", household_unit_weight_g: 27.5 }, as: ClientRep, as_user_id: "${cid}", captures: { pid: $.data.id } }
          trigger:
            - { call: "POST /api/products/${pid}/recipes", payload: { name: "v1" }, as: ClientRep, as_user_id: "${cid}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST and HTTP status == 400"

      - name: entity_product_create_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.Product.fields.product_category, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "product_category outside the declared enum is rejected with 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["client exists"]
          setup_api_calls:
            - { call: "POST /api/clients", payload: { name: "Acme Foods", home_market_code: "US_FDA" }, as: PlatformAdmin, captures: { cid: $.data.id } }
          trigger:
            - { call: "POST /api/clients/${cid}/products", payload: { name: "Pastry", product_category: "PASTRIES", net_weight_g: 110, total_surface_area_sq_in: 30.0, pdp_area_sq_in: 6.0 }, as: ClientRep, as_user_id: "${cid}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST and HTTP status == 400"

      - name: entity_defaults_applied_on_create
        claim_type: defaults
        grounds: [entities.Ingredient.fields.allergen_tags, entities.Recipe.fields.yield_factor, entities.ArtworkAudit.fields.scoring_method]
        distinguishing_aspect: "Omitting defaulted fields applies documented defaults: allergen_tags [], yield_factor 1.0."
        test_recipe:
          setup: ["client + product exist"]
          setup_api_calls:
            - { call: "POST /api/clients", payload: { name: "Acme Foods", home_market_code: "US_FDA" }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /api/clients/${cid}/products", payload: { name: "Cookie", product_category: "BAKED_GOOD", net_weight_g: 110, total_surface_area_sq_in: 30.0, pdp_area_sq_in: 6.0 }, as: ClientRep, as_user_id: "${cid}", captures: { pid: $.data.id } }
            - { call: "POST /api/clients/${cid}/ingredients", payload: { name: "Wheat Flour", kcal_per_100g: 360, fat_g_per_100g: 2.0, satfat_g_per_100g: 0.3, chol_mg_per_100g: 0, sodium_mg_per_100g: 5, carb_g_per_100g: 75, fiber_g_per_100g: 3.0, sugar_g_per_100g: 1.0, protein_g_per_100g: 10 }, as: ClientRep, as_user_id: "${cid}", captures: { i_flour: $.data.id, i_tags: $.data.allergen_tags } }
          trigger:
            - { call: "POST /api/products/${pid}/recipes", payload: { name: "v1", lines: [ { ingredient_id: "${i_flour}", quantity_g: 100 } ] }, as: ClientRep, as_user_id: "${cid}", captures: { r_yield: $.data.yield_factor, r_status: $.data.status } }
          assert:
            - "i_tags == [] (default applied)"
            - "r_yield == 1.0 (default applied)"
            - "r_status == DRAFT"

      - name: entity_racc_create_extra_field_rejected
        claim_type: computed_fields
        grounds: [entities.RaccAssignment.fields.serving_size_g, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Client-supplied values for computed fields are rejected: posting serving_size_g to the racc-assignments endpoint returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["client + product exist"]
          setup_api_calls:
            - { call: "POST /api/clients", payload: { name: "Acme Foods", home_market_code: "US_FDA" }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /api/clients/${cid}/products", payload: { name: "Cookie", product_category: "BAKED_GOOD", net_weight_g: 110, total_surface_area_sq_in: 30.0, pdp_area_sq_in: 6.0, household_unit_name: "piece", household_unit_weight_g: 27.5 }, as: ClientRep, as_user_id: "${cid}", captures: { pid: $.data.id } }
          trigger:
            - { call: "POST /api/products/${pid}/racc-assignments", payload: { market_code: "US_FDA", serving_size_g: 55 }, as: LabelAnalyst, as_user_id: "analyst-1", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST and HTTP status == 400"

  # ===================================================================
  # Section: state_machines
  # ===================================================================
  - section: state_machines
    instances:
      - name: sm_recipe_lock_from_locked_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Recipe.DRAFT_to_LOCKED, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "Second lock on an already-LOCKED recipe is rejected with ERR_INVALID_STATE_TRANSITION; no supersede side effects fire."
        test_recipe:
          setup: ["client, product, single-ingredient recipe LOCKED"]
          setup_api_calls:
            - { call: "POST /api/clients", payload: { name: "Acme Foods", home_market_code: "US_FDA" }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /api/clients/${cid}/products", payload: { name: "Cookie", product_category: "BAKED_GOOD", net_weight_g: 110, total_surface_area_sq_in: 30.0, pdp_area_sq_in: 6.0 }, as: ClientRep, as_user_id: "${cid}", captures: { pid: $.data.id } }
            - { call: "POST /api/clients/${cid}/ingredients", payload: { name: "Wafers", kcal_per_100g: 400, fat_g_per_100g: 8.0, satfat_g_per_100g: 2.0, chol_mg_per_100g: 0, sodium_mg_per_100g: 200, carb_g_per_100g: 70, fiber_g_per_100g: 2.0, sugar_g_per_100g: 20.0, protein_g_per_100g: 5.0 }, as: ClientRep, as_user_id: "${cid}", captures: { i_waf: $.data.id } }
            - { call: "POST /api/products/${pid}/recipes", payload: { name: "v1", lines: [ { ingredient_id: "${i_waf}", quantity_g: 100 } ] }, as: ClientRep, as_user_id: "${cid}", captures: { rid: $.data.id } }
            - { call: "POST /api/recipes/${rid}/lock", as: ClientRep, as_user_id: "${cid}" }
          trigger:
            - { call: "POST /api/recipes/${rid}/lock", as: ClientRep, as_user_id: "${cid}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE_TRANSITION and HTTP status == 409"
            - "Recipe.${rid}.status == LOCKED"

      - name: sm_lab_review_terminal_lockdown
        claim_type: terminal_lockdown
        grounds: [state_machines.LabAnalysis.SUBMITTED_to_REJECTED, "errors[ERR_LAB_REVIEW_ALREADY_DECIDED]"]
        distinguishing_aspect: "A REJECTED (terminal) lab analysis rejects any further review with ERR_LAB_REVIEW_ALREADY_DECIDED."
        test_recipe:
          setup: ["client, product, LOCKED recipe, lab analysis REJECTED"]
          setup_api_calls:
            - { call: "POST /api/clients", payload: { name: "Acme Foods", home_market_code: "US_FDA" }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /api/clients/${cid}/products", payload: { name: "Cookie", product_category: "BAKED_GOOD", net_weight_g: 110, total_surface_area_sq_in: 30.0, pdp_area_sq_in: 6.0 }, as: ClientRep, as_user_id: "${cid}", captures: { pid: $.data.id } }
            - { call: "POST /api/clients/${cid}/ingredients", payload: { name: "Wafers", kcal_per_100g: 400, fat_g_per_100g: 8.0, satfat_g_per_100g: 2.0, chol_mg_per_100g: 0, sodium_mg_per_100g: 200, carb_g_per_100g: 70, fiber_g_per_100g: 2.0, sugar_g_per_100g: 20.0, protein_g_per_100g: 5.0 }, as: ClientRep, as_user_id: "${cid}", captures: { i_waf: $.data.id } }
            - { call: "POST /api/products/${pid}/recipes", payload: { name: "v1", lines: [ { ingredient_id: "${i_waf}", quantity_g: 100 } ] }, as: ClientRep, as_user_id: "${cid}", captures: { rid: $.data.id } }
            - { call: "POST /api/recipes/${rid}/lock", as: ClientRep, as_user_id: "${cid}" }
            - { call: "POST /api/recipes/${rid}/lab-analyses", payload: { lab_report_ref: "LR-1", kcal_per_100g: 350.0, fat_g_per_100g: 1.4, satfat_g_per_100g: 0.2, chol_mg_per_100g: 0, sodium_mg_per_100g: 3.5, carb_g_per_100g: 80.0, fiber_g_per_100g: 2.2, sugar_g_per_100g: 24.0, protein_g_per_100g: 7.4 }, as: ClientRep, as_user_id: "${cid}", captures: { lab: $.data.id } }
            - { call: "POST /api/lab-analyses/${lab}/review", payload: { outcome: "REJECTED" }, as: RegulatoryReviewer, as_user_id: "reviewer-1" }
          trigger:
            - { call: "POST /api/lab-analyses/${lab}/review", payload: { outcome: "VALIDATED" }, as: RegulatoryReviewer, as_user_id: "reviewer-1", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_LAB_REVIEW_ALREADY_DECIDED and HTTP status == 409"
            - "LabAnalysis.${lab}.status == REJECTED"

      - name: sm_approve_from_draft_returns_not_in_review
        claim_type: invalid_transition
        grounds: [state_machines.LabelVersion.review_status=IN_REVIEW_to_review_status=APPROVED, "errors[ERR_LABEL_NOT_IN_REVIEW]"]
        distinguishing_aspect: "Approving a label still in DRAFT fails with ERR_LABEL_NOT_IN_REVIEW."
        test_recipe:
          setup: ["client, product, LOCKED recipe, DATABASE panel, US_FDA RACC, DRAFT label"]
          setup_api_calls:
            - { call: "POST /api/clients", payload: { name: "Acme Foods", home_market_code: "US_FDA" }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /api/clients/${cid}/products", payload: { name: "Cookie", product_category: "BAKED_GOOD", net_weight_g: 110, total_surface_area_sq_in: 30.0, pdp_area_sq_in: 6.0, household_unit_name: "piece", household_unit_weight_g: 27.5 }, as: ClientRep, as_user_id: "${cid}", captures: { pid: $.data.id, pver: $.data.version } }
            - { call: "POST /api/clients/${cid}/ingredients", payload: { name: "Wafers", kcal_per_100g: 400, fat_g_per_100g: 8.0, satfat_g_per_100g: 2.0, chol_mg_per_100g: 0, sodium_mg_per_100g: 200, carb_g_per_100g: 70, fiber_g_per_100g: 2.0, sugar_g_per_100g: 20.0, protein_g_per_100g: 5.0 }, as: ClientRep, as_user_id: "${cid}", captures: { i_waf: $.data.id } }
            - { call: "POST /api/products/${pid}/recipes", payload: { name: "v1", lines: [ { ingredient_id: "${i_waf}", quantity_g: 100 } ] }, as: ClientRep, as_user_id: "${cid}", captures: { rid: $.data.id } }
            - { call: "POST /api/recipes/${rid}/lock", as: ClientRep, as_user_id: "${cid}" }
            - { call: "POST /api/recipes/${rid}/nutrient-panels", payload: { method: "DATABASE" }, as: LabelAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /api/products/${pid}/racc-assignments", payload: { market_code: "US_FDA" }, as: LabelAnalyst, as_user_id: "analyst-1", captures: { ra: $.data.id } }
            - { call: "POST /api/products/${pid}/label-versions", payload: { market_code: "US_FDA", nutrient_basis: "DATABASE", racc_assignment_id: "${ra}", declared_format: "TABULAR", declared_type_size_in: 0.0625, ingredient_statement_text: "Wafers", contains_text: "Contains: None.", expected_product_version: "${pver}" }, as: LabelAnalyst, as_user_id: "analyst-1", captures: { lv: $.data.id } }
          trigger:
            - { call: "POST /api/label-versions/${lv}/approve", as: RegulatoryReviewer, as_user_id: "reviewer-1", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_LABEL_NOT_IN_REVIEW and HTTP status == 409"

      - name: sm_withdraw_from_draft_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.LabelVersion.release_status=RELEASED_to_release_status=WITHDRAWN, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "Withdraw requires release_status == RELEASED; withdrawing a NOT_RELEASED label fails with ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup: ["client, product, LOCKED recipe, panel, RACC, DRAFT label"]
          setup_api_calls:
            - { call: "POST /api/clients", payload: { name: "Acme Foods", home_market_code: "US_FDA" }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /api/clients/${cid}/products", payload: { name: "Cookie", product_category: "BAKED_GOOD", net_weight_g: 110, total_surface_area_sq_in: 30.0, pdp_area_sq_in: 6.0, household_unit_name: "piece", household_unit_weight_g: 27.5 }, as: ClientRep, as_user_id: "${cid}", captures: { pid: $.data.id, pver: $.data.version } }
            - { call: "POST /api/clients/${cid}/ingredients", payload: { name: "Wafers", kcal_per_100g: 400, fat_g_per_100g: 8.0, satfat_g_per_100g: 2.0, chol_mg_per_100g: 0, sodium_mg_per_100g: 200, carb_g_per_100g: 70, fiber_g_per_100g: 2.0, sugar_g_per_100g: 20.0, protein_g_per_100g: 5.0 }, as: ClientRep, as_user_id: "${cid}", captures: { i_waf: $.data.id } }
            - { call: "POST /api/products/${pid}/recipes", payload: { name: "v1", lines: [ { ingredient_id: "${i_waf}", quantity_g: 100 } ] }, as: ClientRep, as_user_id: "${cid}", captures: { rid: $.data.id } }
            - { call: "POST /api/recipes/${rid}/lock", as: ClientRep, as_user_id: "${cid}" }
            - { call: "POST /api/recipes/${rid}/nutrient-panels", payload: { method: "DATABASE" }, as: LabelAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /api/products/${pid}/racc-assignments", payload: { market_code: "US_FDA" }, as: LabelAnalyst, as_user_id: "analyst-1", captures: { ra: $.data.id } }
            - { call: "POST /api/products/${pid}/label-versions", payload: { market_code: "US_FDA", nutrient_basis: "DATABASE", racc_assignment_id: "${ra}", declared_format: "TABULAR", declared_type_size_in: 0.0625, ingredient_statement_text: "Wafers", contains_text: "Contains: None.", expected_product_version: "${pver}" }, as: LabelAnalyst, as_user_id: "analyst-1", captures: { lv: $.data.id } }
          trigger:
            - { call: "POST /api/label-versions/${lv}/withdraw", payload: { reason: "too early" }, as: QualityManager, as_user_id: "${cid}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE_TRANSITION and HTTP status == 409"

      - name: sm_market_variant_retire_from_draft_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.MarketVariant.ACTIVE_to_RETIRED, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "Retire requires ACTIVE; retiring a DRAFT variant fails with ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup: ["client, product, LOCKED recipe, panel, RACC, DRAFT label with CA_CFIA variant"]
          setup_api_calls:
            - { call: "POST /api/clients", payload: { name: "Acme Foods", home_market_code: "US_FDA" }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /api/clients/${cid}/products", payload: { name: "Cookie", product_category: "BAKED_GOOD", net_weight_g: 110, total_surface_area_sq_in: 30.0, pdp_area_sq_in: 6.0, household_unit_name: "piece", household_unit_weight_g: 27.5 }, as: ClientRep, as_user_id: "${cid}", captures: { pid: $.data.id, pver: $.data.version } }
            - { call: "POST /api/clients/${cid}/ingredients", payload: { name: "Wafers", kcal_per_100g: 400, fat_g_per_100g: 8.0, satfat_g_per_100g: 2.0, chol_mg_per_100g: 0, sodium_mg_per_100g: 200, carb_g_per_100g: 70, fiber_g_per_100g: 2.0, sugar_g_per_100g: 20.0, protein_g_per_100g: 5.0 }, as: ClientRep, as_user_id: "${cid}", captures: { i_waf: $.data.id } }
            - { call: "POST /api/products/${pid}/recipes", payload: { name: "v1", lines: [ { ingredient_id: "${i_waf}", quantity_g: 100 } ] }, as: ClientRep, as_user_id: "${cid}", captures: { rid: $.data.id } }
            - { call: "POST /api/recipes/${rid}/lock", as: ClientRep, as_user_id: "${cid}" }
            - { call: "POST /api/recipes/${rid}/nutrient-panels", payload: { method: "DATABASE" }, as: LabelAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /api/products/${pid}/racc-assignments", payload: { market_code: "US_FDA" }, as: LabelAnalyst, as_user_id: "analyst-1", captures: { ra: $.data.id } }
            - { call: "POST /api/products/${pid}/label-versions", payload: { market_code: "US_FDA", nutrient_basis: "DATABASE", racc_assignment_id: "${ra}", declared_format: "TABULAR", declared_type_size_in: 0.0625, ingredient_statement_text: "Wafers", contains_text: "Contains: None.", expected_product_version: "${pver}" }, as: LabelAnalyst, as_user_id: "analyst-1", captures: { lv: $.data.id } }
            - { call: "POST /api/label-versions/${lv}/market-variants", payload: { market_code: "CA_CFIA", effective_start: "2026-09-01T00:00:00Z", effective_end: "2027-03-01T00:00:00Z" }, as: LabelAnalyst, as_user_id: "analyst-1", captures: { mv: $.data.id } }
          trigger:
            - { call: "POST /api/market-variants/${mv}/retire", as: QualityManager, as_user_id: "${cid}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE_TRANSITION and HTTP status == 409"

      - name: sm_audit_close_from_scheduled_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.ArtworkAudit.FINDINGS_LOGGED_to_CLOSED, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "Closing an audit with zero findings (still SCHEDULED) fails; only FINDINGS_LOGGED can close."
        test_recipe:
          setup: ["client with RELEASED label; audit scheduled, no findings"]
          setup_api_calls:
            - { call: "POST /api/clients", payload: { name: "Acme Foods", home_market_code: "US_FDA" }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /api/clients/${cid}/products", payload: { name: "Cookie", product_category: "BAKED_GOOD", net_weight_g: 110, total_surface_area_sq_in: 30.0, pdp_area_sq_in: 6.0, household_unit_name: "piece", household_unit_weight_g: 27.5 }, as: ClientRep, as_user_id: "${cid}", captures: { pid: $.data.id, pver: $.data.version } }
            - { call: "POST /api/clients/${cid}/ingredients", payload: { name: "Wafers", kcal_per_100g: 400, fat_g_per_100g: 8.0, satfat_g_per_100g: 2.0, chol_mg_per_100g: 0, sodium_mg_per_100g: 200, carb_g_per_100g: 70, fiber_g_per_100g: 2.0, sugar_g_per_100g: 20.0, protein_g_per_100g: 5.0 }, as: ClientRep, as_user_id: "${cid}", captures: { i_waf: $.data.id } }
            - { call: "POST /api/products/${pid}/recipes", payload: { name: "v1", lines: [ { ingredient_id: "${i_waf}", quantity_g: 100 } ] }, as: ClientRep, as_user_id: "${cid}", captures: { rid: $.data.id } }
            - { call: "POST /api/recipes/${rid}/lock", as: ClientRep, as_user_id: "${cid}" }
            - { call: "POST /api/recipes/${rid}/nutrient-panels", payload: { method: "DATABASE" }, as: LabelAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /api/products/${pid}/racc-assignments", payload: { market_code: "US_FDA" }, as: LabelAnalyst, as_user_id: "analyst-1", captures: { ra: $.data.id } }
            - { call: "POST /api/products/${pid}/label-versions", payload: { market_code: "US_FDA", nutrient_basis: "DATABASE", racc_assignment_id: "${ra}", declared_format: "TABULAR", declared_type_size_in: 0.0625, ingredient_statement_text: "Wafers", contains_text: "Contains: None.", expected_product_version: "${pver}" }, as: LabelAnalyst, as_user_id: "analyst-1", captures: { lv: $.data.id } }
            - { call: "POST /api/label-versions/${lv}/submit-review", as: LabelAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /api/label-versions/${lv}/approve", as: RegulatoryReviewer, as_user_id: "reviewer-1" }
            - { call: "GET /api/products/${pid}", as: PlatformAdmin, captures: { pver2: $.data.version } }
            - { call: "POST /api/label-versions/${lv}/release", payload: { expected_product_version: "${pver2}" }, as: QualityManager, as_user_id: "${cid}" }
            - { call: "POST /api/clients/${cid}/artwork-audits", payload: { product_id: "${pid}", label_version_id: "${lv}", facility_code: "F1", scheduled_start: "2026-09-10T00:00:00Z", scheduled_end: "2026-09-12T00:00:00Z", scoring_method: "WEIGHTED" }, as: ComplianceAuditor, as_user_id: "auditor-1", captures: { a1: $.data.id } }
          trigger:
            - { call: "POST /api/artwork-audits/${a1}/close", as: ComplianceAuditor, as_user_id: "auditor-1", captures: { err: $.data.error_id } }
          assert:
