  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: boundary_evidence_score_exactly_at_the_deactivation_floor
        grounds:
          - calculations.deactivation_decision_criteria.constants.SCORE_DEACTIVATION
          - calculations.evidence_admissibility_score
          - entities.SafetyIncident.fields.decision_evidence_score
          - endpoints.POST_/safety/incidents/{incidentId}/decision
        distinguishing_aspect: |
          A numeric threshold crossing pinned exactly at its constant: four DISPOSITIVE
          TRIP_DATA items clamp the evidence score to exactly 4.00 with a single distinct
          source, and the >= comparison engages the deactivation branch at that exact value
          rather than one hundredth later.
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. R1 policy with sd_floor_severity S4."
            - "One ACTIVE rider account carrying no prior S3 or S4 incident, so the SAFETY_VIOLATION category floor is NO_ACTION."
            - "One S2 SAFETY_VIOLATION incident held and investigating, with four DISPOSITIVE TRIP_DATA evidence rows, all four accepted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /safety/platform-policies"
              payload: { region_code: "R1", sd_floor_severity: "S4" }
              as: PlatformAdmin
            - call: "POST /safety/accounts"
              payload: { account_type: "RIDER", home_region_code: "R1", legal_name: "Pia Lindqvist", contact_email: "pia.lindqvist@example.com" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /safety/trips"
              payload: { rider_account_id: "${acct_id}", driver_account_id: "${acct_id}", region_code: "R1", requested_at: "2026-09-29T00:00:00Z", in_app_message_count: 6 }
              as: PlatformAdmin
              captures: { trip_id: $.data.id }
            - call: "POST /safety/incidents"
              payload: { account_id: "${acct_id}", referenced_trip_id: "${trip_id}", reporter_type: "RIDER", reporter_account_id: "${acct_id}", incident_category: "SAFETY_VIOLATION" }
              as: SafetyInvestigator
              captures: { inc_id: $.data.id, inc_v: $.data.version }
            - call: "POST /safety/incidents/${inc_id}/hold"
              payload: {}
              as: SafetyInvestigator
            - call: "POST /safety/incidents/${inc_id}/evidence"
              payload: { evidence_type: "TRIP_DATA", source_entity_id: "${trip_id}", evidence_weight: "DISPOSITIVE" }
              as: SafetyInvestigator
              captures: { ev1: $.data.id }
            - call: "POST /safety/incidents/${inc_id}/evidence"
              payload: { evidence_type: "TRIP_DATA", source_entity_id: "${trip_id}", evidence_weight: "DISPOSITIVE" }
              as: SafetyInvestigator
              captures: { ev2: $.data.id }
            - call: "POST /safety/incidents/${inc_id}/evidence"
              payload: { evidence_type: "TRIP_DATA", source_entity_id: "${trip_id}", evidence_weight: "DISPOSITIVE" }
              as: SafetyInvestigator
              captures: { ev3: $.data.id }
            - call: "POST /safety/incidents/${inc_id}/evidence"
              payload: { evidence_type: "TRIP_DATA", source_entity_id: "${trip_id}", evidence_weight: "DISPOSITIVE" }
              as: SafetyInvestigator
              captures: { ev4: $.data.id }
            - call: "POST /safety/incidents/${inc_id}/evidence/accept"
              payload: { evidence_id: "${ev1}", accepted: true }
              as: SafetyInvestigator
            - call: "POST /safety/incidents/${inc_id}/evidence/accept"
              payload: { evidence_id: "${ev2}", accepted: true }
              as: SafetyInvestigator
            - call: "POST /safety/incidents/${inc_id}/evidence/accept"
              payload: { evidence_id: "${ev3}", accepted: true }
              as: SafetyInvestigator
            - call: "POST /safety/incidents/${inc_id}/evidence/accept"
              payload: { evidence_id: "${ev4}", accepted: true }
              as: SafetyInvestigator
              captures: { inc_v_ready: $.data.version }
          trigger:
