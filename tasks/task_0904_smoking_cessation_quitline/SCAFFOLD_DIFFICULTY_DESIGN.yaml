# =============================================================================
# Task 0904 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rule_ids x 2 instances = 18 instances. Every ground resolves into SCAFFOLD.yaml.
# =============================================================================
scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: incentive_provisional_vs_final_payout
        grounds:
          - calculations.incentive_payout
          - calculations.incentive_completion_bonus
          - entities.Enrollment.fields.incentive_earned_cents
        distinguishing_aspect: |
          On a COMPLETED enrollment the FINAL variant adds the completion bonus so
          final_payout_cents (10751) != provisional_earned_cents (10000); this is the
          incentive/Enrollment entity domain.
        test_recipe:
          setup:
            - "Clock 2026-06-01. Sponsored program (budget 100000) with EN participant cpd=10, enrollment ACTIVE (ENROLLMENT award 1000)."
            - "Quit attempt set 2026-06-02 (QUIT_DATE_SET 1500). 7-day abstinent 2026-06-09 (SEVEN 2500, QuitAttempt QUIT_ACHIEVED). 30-day abstinent 2026-07-02 (THIRTY 5000, enrollment COMPLETED, EARNED->PAID)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /employer-programs"
              payload: { name: "Acme", budget_total_cents: 100000, nrt_courses_allotted: 3 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /participants"
              payload: { full_name: "P1", email: "p1@x.com", primary_language: "EN", cigarettes_per_day: 10, employer_program_id: "${prog_id}" }
              as: CaseManager
              captures: { part_id: $.data.id }
            - call: "POST /participants/${part_id}/enrollments"
              payload: {}
              as: CaseManager
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/readiness-assessments"
              payload: { motivation_score: 6, confidence_score: 6, prior_quit_attempts: 0 }
              as: CaseManager
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: CaseManager
            - call: "POST /enrollments/${enr_id}/quit-attempts"
              payload: { quit_date: "2026-06-02T00:00:00Z", method: "COLD_TURKEY" }
              as: CaseManager
              captures: { qa_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-09T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /enrollments/${enr_id}/follow-up-outcomes"
              payload: { day: 7, abstinent: true }
              as: CaseManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /enrollments/${enr_id}/follow-up-outcomes"
              payload: { day: 30, abstinent: true }
              as: CaseManager
          trigger:
            - call: "GET /enrollments/${enr_id}/incentive-summary"
              as: CaseManager
          assert:
            - "incentive_summary.provisional_earned_cents == 10000"
            - "incentive_summary.completion_bonus_cents == 751"
            - "incentive_summary.final_payout_cents == 10751"

      - name: abstinence_point_prevalence_vs_continuous_rate
        grounds:
          - calculations.abstinence_outcome_rate
          - entities.FollowUpOutcome.fields.abstinent
        distinguishing_aspect: |
          Same program cohort (n=2, same denominator): point_prevalence_7day_rate==100.0
          but continuous_30day_rate==50.0 — reporting/program-cohort domain, distinct from
          the incentive/Enrollment dual-variant.
        test_recipe:
          setup:
            - "Program with two sponsored EN participants; both quit-date 2026-06-02, both 7-day abstinent."
            - "P1 also 30-day abstinent (continuous); P2 30-day NOT abstinent. Clock advanced past 2026-07-02 so both are in the >=quit_date+30 cohort."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /employer-programs"
              payload: { name: "Rpt", budget_total_cents: 1000000, nrt_courses_allotted: 3 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /participants"
              payload: { full_name: "P1", email: "p1@x.com", primary_language: "EN", cigarettes_per_day: 10, employer_program_id: "${prog_id}" }
              as: CaseManager
              captures: { p1_id: $.data.id }
            - call: "POST /participants/${p1_id}/enrollments"
              payload: {}
              as: CaseManager
              captures: { e1_id: $.data.id }
            - call: "POST /enrollments/${e1_id}/readiness-assessments"
              payload: { motivation_score: 6, confidence_score: 6, prior_quit_attempts: 0 }
              as: CaseManager
            - call: "POST /enrollments/${e1_id}/activate"
              payload: {}
              as: CaseManager
            - call: "POST /enrollments/${e1_id}/quit-attempts"
              payload: { quit_date: "2026-06-02T00:00:00Z", method: "COLD_TURKEY" }
              as: CaseManager
            - call: "POST /participants"
              payload: { full_name: "P2", email: "p2@x.com", primary_language: "EN", cigarettes_per_day: 10, employer_program_id: "${prog_id}" }
              as: CaseManager
              captures: { p2_id: $.data.id }
            - call: "POST /participants/${p2_id}/enrollments"
              payload: {}
              as: CaseManager
              captures: { e2_id: $.data.id }
            - call: "POST /enrollments/${e2_id}/readiness-assessments"
              payload: { motivation_score: 6, confidence_score: 6, prior_quit_attempts: 0 }
              as: CaseManager
            - call: "POST /enrollments/${e2_id}/activate"
              payload: {}
              as: CaseManager
            - call: "POST /enrollments/${e2_id}/quit-attempts"
              payload: { quit_date: "2026-06-02T00:00:00Z", method: "COLD_TURKEY" }
              as: CaseManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-09T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /enrollments/${e1_id}/follow-up-outcomes"
              payload: { day: 7, abstinent: true }
              as: CaseManager
            - call: "POST /enrollments/${e2_id}/follow-up-outcomes"
              payload: { day: 7, abstinent: true }
              as: CaseManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /enrollments/${e1_id}/follow-up-outcomes"
              payload: { day: 30, abstinent: true }
              as: CaseManager
            - call: "POST /enrollments/${e2_id}/follow-up-outcomes"
              payload: { day: 30, abstinent: false }
              as: CaseManager
          trigger:
            - call: "GET /employer-programs/${prog_id}/outcome-report"
              as: ProgramAdmin
          assert:
            - "outcome_report.cohort_size == 2"
            - "outcome_report.point_prevalence_7day_rate == 100.0"
            - "outcome_report.continuous_30day_rate == 50.0"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: readiness_score_tiered_nonlinear
        grounds:
          - calculations.readiness_score
          - entities.ReadinessAssessment.fields.readiness_score
        distinguishing_aspect: |
          Mode (a): 4 inputs with tiered prior_bonus and dependence_penalty branches —
          motivation 8 + confidence 8 + prior_bonus(3->2) - dependence_penalty(cpd25->2) == 16.
        test_recipe:
          setup:
            - "Participant cpd=25 (heavy => penalty 2); enrollment PENDING_ASSESSMENT."
          setup_api_calls:
            - call: "POST /participants"
              payload: { full_name: "H", email: "h@x.com", primary_language: "EN", cigarettes_per_day: 25 }
              as: CaseManager
              captures: { part_id: $.data.id }
            - call: "POST /participants/${part_id}/enrollments"
              payload: {}
              as: CaseManager
              captures: { enr_id: $.data.id }
          trigger:
            - call: "POST /enrollments/${enr_id}/readiness-assessments"
              payload: { motivation_score: 8, confidence_score: 8, prior_quit_attempts: 3 }
              as: CaseManager
              captures: { ra_id: $.data.id }
          assert:
            - "ReadinessAssessment.${ra_id}.readiness_score == 16"
            - "ReadinessAssessment.${ra_id}.result == PASS"

      - name: completion_bonus_per_award_rounding_order
        grounds:
          - calculations.incentive_completion_bonus
          - entities.IncentiveAward.fields.amount_cents
        distinguishing_aspect: |
          Mode (b): rounding order pinned. Per-award round_half_up(0.075*amt) over
          {1000,1500,2500,5000} sums to 751; sum-then-round yields 750. Scaffold pins 751.
        test_recipe:
          setup:
            - "Identical COMPLETED enrollment as incentive_provisional_vs_final_payout (awards 1000/1500/2500/5000, all PAID)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /employer-programs"
              payload: { name: "Bonus", budget_total_cents: 100000, nrt_courses_allotted: 3 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /participants"
              payload: { full_name: "P", email: "p@x.com", primary_language: "EN", cigarettes_per_day: 10, employer_program_id: "${prog_id}" }
              as: CaseManager
              captures: { part_id: $.data.id }
            - call: "POST /participants/${part_id}/enrollments"
              payload: {}
              as: CaseManager
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/readiness-assessments"
              payload: { motivation_score: 6, confidence_score: 6, prior_quit_attempts: 0 }
              as: CaseManager
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: CaseManager
            - call: "POST /enrollments/${enr_id}/quit-attempts"
              payload: { quit_date: "2026-06-02T00:00:00Z", method: "COLD_TURKEY" }
              as: CaseManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-09T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /enrollments/${enr_id}/follow-up-outcomes"
              payload: { day: 7, abstinent: true }
              as: CaseManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /enrollments/${enr_id}/follow-up-outcomes"
              payload: { day: 30, abstinent: true }
              as: CaseManager
          trigger:
            - call: "GET /enrollments/${enr_id}/incentive-summary"
              as: CaseManager
          assert:
            - "incentive_summary.completion_bonus_cents == 751"
            - "incentive_summary.completion_bonus_cents != 750"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: quit_attempt_relapse_recommit_cycle
        grounds:
          - state_machines.QuitAttempt.COMMITTED_to_RELAPSED
          - state_machines.QuitAttempt.RELAPSED_to_COMMITTED
          - entities.QuitAttempt.fields.status
        distinguishing_aspect: |
          Cycle on one entity: QuitAttempt COMMITTED->RELAPSED->COMMITTED, and the recommit
          updates quit_date to 2026-06-15.
        test_recipe:
          setup:
            - "ACTIVE non-sponsored enrollment with one COMMITTED QuitAttempt (quit_date 2026-06-02)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /participants"
              payload: { full_name: "C", email: "c@x.com", primary_language: "EN", cigarettes_per_day: 10 }
              as: CaseManager
              captures: { part_id: $.data.id }
            - call: "POST /participants/${part_id}/enrollments"
              payload: {}
              as: CaseManager
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/readiness-assessments"
              payload: { motivation_score: 6, confidence_score: 6, prior_quit_attempts: 0 }
              as: CaseManager
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: CaseManager
            - call: "POST /enrollments/${enr_id}/quit-attempts"
              payload: { quit_date: "2026-06-02T00:00:00Z", method: "COLD_TURKEY" }
              as: CaseManager
              captures: { qa_id: $.data.id }
          trigger:
            - call: "POST /quit-attempts/${qa_id}/transition"
              payload: { to_status: "RELAPSED" }
              as: CaseManager
            - call: "POST /quit-attempts/${qa_id}/transition"
              payload: { to_status: "COMMITTED", quit_date: "2026-06-15T00:00:00Z" }
              as: CaseManager
          assert:
            - "QuitAttempt.${qa_id}.status == COMMITTED"
            - "QuitAttempt.${qa_id}.quit_date == 2026-06-15T00:00:00Z"

      - name: enrollment_branch_disenroll_divergent_side_effects
        grounds:
          - state_machines.Enrollment.ACTIVE_to_DISENROLLED
          - state_machines.Enrollment.ACTIVE_to_COMPLETED
          - entities.Enrollment.fields.status
        distinguishing_aspect: |
          Branching fork on a different entity (Enrollment): the DISENROLLED branch abandons
          the quit attempt, cancels the scheduled call and closes the referral, whereas the
          COMPLETED branch pays awards — divergent side-effect sets from the same ACTIVE state.
        test_recipe:
          setup:
            - "ACTIVE non-sponsored enrollment with a COMMITTED quit attempt, a SCHEDULED coaching call (coach EN), and an OPEN referral."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /coaches"
              payload: { full_name: "Coach EN", languages: ["EN"] }
              as: ProgramAdmin
              captures: { coach_id: $.data.id }
            - call: "POST /participants"
              payload: { full_name: "B", email: "b@x.com", primary_language: "EN", cigarettes_per_day: 10 }
              as: CaseManager
              captures: { part_id: $.data.id }
            - call: "POST /participants/${part_id}/enrollments"
              payload: {}
              as: CaseManager
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/readiness-assessments"
              payload: { motivation_score: 6, confidence_score: 6, prior_quit_attempts: 0 }
              as: CaseManager
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: CaseManager
            - call: "POST /enrollments/${enr_id}/quit-attempts"
              payload: { quit_date: "2026-06-02T00:00:00Z", method: "COLD_TURKEY" }
              as: CaseManager
              captures: { qa_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/coaching-calls"
              payload: { coach_id: "${coach_id}", scheduled_start: "2026-06-02T10:00:00Z", duration_minutes: 30 }
              as: CaseManager
              captures: { call_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/referrals"
              payload: { referral_type: "PROVIDER", target_name: "Dr Lung" }
              as: CaseManager
              captures: { ref_id: $.data.id }
          trigger:
            - call: "POST /enrollments/${enr_id}/disenroll"
              payload: {}
              as: CaseManager
          assert:
            - "Enrollment.${enr_id}.status == DISENROLLED"
            - "QuitAttempt.${qa_id}.status == ABANDONED"
            - "CoachingCall.${call_id}.status == CANCELED"
            - "Referral.${ref_id}.status == CLOSED"

  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: disenroll_forfeits_awards_credits_budget_depth4
        grounds:
          - state_machines.Enrollment.ACTIVE_to_DISENROLLED
          - state_machines.QuitAttempt.QUIT_ACHIEVED_to_ABANDONED
          - entities.EmployerProgram.fields.budget_remaining_cents
          - entities.Enrollment.fields.incentive_earned_cents
        distinguishing_aspect: |
          4-hop chain: disenroll -> QuitAttempt ABANDONED -> QUIT_DATE_SET(1500)+SEVEN(2500)
          awards FORFEITED -> program budget credited back 4000 (99000). Each hop caused by the prior.
        test_recipe:
          setup:
            - "Sponsored program budget 100000. ACTIVE enrollment with ENROLLMENT(1000)+QUIT_DATE_SET(1500) awards, then 7-day abstinent SEVEN(2500), QuitAttempt QUIT_ACHIEVED. incentive_earned 5000, budget_remaining 95000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /employer-programs"
              payload: { name: "Casc", budget_total_cents: 100000, nrt_courses_allotted: 3 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /participants"
              payload: { full_name: "P", email: "p@x.com", primary_language: "EN", cigarettes_per_day: 10, employer_program_id: "${prog_id}" }
              as: CaseManager
              captures: { part_id: $.data.id }
            - call: "POST /participants/${part_id}/enrollments"
              payload: {}
              as: CaseManager
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/readiness-assessments"
              payload: { motivation_score: 6, confidence_score: 6, prior_quit_attempts: 0 }
              as: CaseManager
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: CaseManager
            - call: "POST /enrollments/${enr_id}/quit-attempts"
              payload: { quit_date: "2026-06-02T00:00:00Z", method: "COLD_TURKEY" }
              as: CaseManager
              captures: { qa_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-09T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /enrollments/${enr_id}/follow-up-outcomes"
              payload: { day: 7, abstinent: true }
              as: CaseManager
          trigger:
            - call: "POST /enrollments/${enr_id}/disenroll"
              payload: {}
              as: CaseManager
          assert:
            - "Enrollment.${enr_id}.status == DISENROLLED"
            - "QuitAttempt.${qa_id}.status == ABANDONED"
            - "Enrollment.${enr_id}.incentive_earned_cents == 1000"
            - "EmployerProgram.${prog_id}.budget_remaining_cents == 99000"

      - name: nrt_delivery_increments_used_flips_exhausted_depth3
        grounds:
          - state_machines.NRTShipment.SHIPPED_to_DELIVERED
          - entities.Enrollment.fields.nrt_courses_used
          - entities.Enrollment.fields.nrt_eligibility
        distinguishing_aspect: |
          Different trigger (shipment DELIVERED): DELIVERED -> nrt_courses_used 1 ->
          nrt_eligibility EXHAUSTED (allotment 1). Each hop caused by the prior recompute.
        test_recipe:
          setup:
            - "Sponsored program nrt_courses_allotted=1. ACTIVE enrollment with a COMMITTED quit attempt and one shipment REQUESTED->APPROVED->SHIPPED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /employer-programs"
              payload: { name: "Nrt1", budget_total_cents: 100000, nrt_courses_allotted: 1 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /participants"
              payload: { full_name: "P", email: "p@x.com", primary_language: "EN", cigarettes_per_day: 15, employer_program_id: "${prog_id}" }
              as: CaseManager
              captures: { part_id: $.data.id }
            - call: "POST /participants/${part_id}/enrollments"
              payload: {}
              as: CaseManager
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/readiness-assessments"
              payload: { motivation_score: 6, confidence_score: 6, prior_quit_attempts: 0 }
              as: CaseManager
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: CaseManager
            - call: "POST /enrollments/${enr_id}/quit-attempts"
              payload: { quit_date: "2026-06-02T00:00:00Z", method: "NRT_ASSISTED" }
              as: CaseManager
            - call: "POST /enrollments/${enr_id}/nrt-shipments"
              payload: { medication_type: "PATCH", course_start_date: "2026-06-02T00:00:00Z", course_end_date: "2026-06-30T00:00:00Z" }
              as: CaseManager
              captures: { ship_id: $.data.id }
            - call: "POST /nrt-shipments/${ship_id}/transition"
              payload: { to_status: "APPROVED" }
              as: CaseManager
            - call: "POST /nrt-shipments/${ship_id}/transition"
              payload: { to_status: "SHIPPED" }
              as: CaseManager
          trigger:
            - call: "POST /nrt-shipments/${ship_id}/transition"
              payload: { to_status: "DELIVERED" }
              as: CaseManager
          assert:
            - "NRTShipment.${ship_id}.status == DELIVERED"
            - "Enrollment.${enr_id}.nrt_courses_used == 1"
            - "Enrollment.${enr_id}.nrt_courses_remaining == 0"
            - "Enrollment.${enr_id}.nrt_eligibility == EXHAUSTED"

  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_manual_award
        grounds:
          - validations[priority=4]
          - validations[priority=9]
          - errors[ERR_ENROLLMENT_NOT_ACTIVE]
          - errors[ERR_PROGRAM_BUDGET_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair {state, business_fiscal}: a manual award on a DISENROLLED
          enrollment whose amount also exceeds budget returns ERR_ENROLLMENT_NOT_ACTIVE (p4),
          not ERR_PROGRAM_BUDGET_EXCEEDED (p9).
        test_recipe:
          setup:
            - "Sponsored enrollment activated then disenrolled (status DISENROLLED). Program version read fresh (=2)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /employer-programs"
              payload: { name: "Pri", budget_total_cents: 100000, nrt_courses_allotted: 3 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /participants"
              payload: { full_name: "P", email: "p@x.com", primary_language: "EN", cigarettes_per_day: 10, employer_program_id: "${prog_id}" }
              as: CaseManager
              captures: { part_id: $.data.id }
            - call: "POST /participants/${part_id}/enrollments"
              payload: {}
              as: CaseManager
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/readiness-assessments"
              payload: { motivation_score: 6, confidence_score: 6, prior_quit_attempts: 0 }
              as: CaseManager
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: CaseManager
            - call: "POST /enrollments/${enr_id}/disenroll"
              payload: {}
              as: CaseManager
            - call: "GET /employer-programs/${prog_id}"
              as: CaseManager
              captures: { prog_v_now: $.data.version }
          trigger:
            - call: "POST /enrollments/${enr_id}/incentive-awards"
              payload: { milestone_type: "DISCRETIONARY", amount_cents: 999999999, expected_employer_program_version: "${prog_v_now}" }
              as: CaseManager
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_ENROLLMENT_NOT_ACTIVE"

      - name: referential_beats_temporal_on_schedule_call
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_COACH_LANGUAGE_MISMATCH]
          - errors[ERR_SCHEDULE_WINDOW_INVALID]
        distinguishing_aspect: |
          Error-category pair {business_referential, business_temporal}: scheduling with a
          language-mismatched coach AND a past slot returns ERR_COACH_LANGUAGE_MISMATCH (p6),
          not ERR_SCHEDULE_WINDOW_INVALID (p7).
        test_recipe:
          setup:
            - "ACTIVE EN enrollment; coach speaks only ES; requested slot 2026-05-01 (in the past relative to clock 2026-06-01)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /coaches"
              payload: { full_name: "Coach ES", languages: ["ES"] }
              as: ProgramAdmin
              captures: { coach_id: $.data.id }
            - call: "POST /participants"
              payload: { full_name: "P", email: "p@x.com", primary_language: "EN", cigarettes_per_day: 10 }
              as: CaseManager
              captures: { part_id: $.data.id }
            - call: "POST /participants/${part_id}/enrollments"
              payload: {}
              as: CaseManager
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/readiness-assessments"
              payload: { motivation_score: 6, confidence_score: 6, prior_quit_attempts: 0 }
              as: CaseManager
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: CaseManager
          trigger:
            - call: "POST /enrollments/${enr_id}/coaching-calls"
              payload: { coach_id: "${coach_id}", scheduled_start: "2026-05-01T00:00:00Z", duration_minutes: 30 }
              as: CaseManager
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_COACH_LANGUAGE_MISMATCH"

  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: readiness_threshold_exactly_12_passes
        grounds:
          - calculations.readiness_score
          - entities.ReadinessAssessment.fields.result
        distinguishing_aspect: |
          readiness_score == READINESS_PASS_THRESHOLD (12) yields PASS via >= (not >), on the
          readiness-assessments endpoint.
        test_recipe:
          setup:
            - "Participant cpd=10 (penalty 0); enrollment PENDING_ASSESSMENT."
          setup_api_calls:
            - call: "POST /participants"
              payload: { full_name: "P", email: "p@x.com", primary_language: "EN", cigarettes_per_day: 10 }
              as: CaseManager
              captures: { part_id: $.data.id }
            - call: "POST /participants/${part_id}/enrollments"
              payload: {}
              as: CaseManager
              captures: { enr_id: $.data.id }
          trigger:
            - call: "POST /enrollments/${enr_id}/readiness-assessments"
              payload: { motivation_score: 6, confidence_score: 6, prior_quit_attempts: 0 }
              as: CaseManager
              captures: { ra_id: $.data.id }
          assert:
            - "ReadinessAssessment.${ra_id}.readiness_score == 12"
            - "ReadinessAssessment.${ra_id}.result == PASS"

      - name: outcome_report_empty_cohort_returns_zero
        grounds:
          - calculations.abstinence_outcome_rate
          - entities.EmployerProgram.fields.budget_total_cents
        distinguishing_aspect: |
          Empty-collection edge on a different metric/endpoint: a program with zero cohort
          enrollments returns rates 0.0 (no divide-by-zero) on outcome-report.
        test_recipe:
          setup:
            - "Fresh sponsored program with no enrollments."
          setup_api_calls:
            - call: "POST /employer-programs"
              payload: { name: "Empty", budget_total_cents: 100000, nrt_courses_allotted: 3 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
          trigger:
            - call: "GET /employer-programs/${prog_id}/outcome-report"
              as: ProgramAdmin
          assert:
            - "outcome_report.cohort_size == 0"
            - "outcome_report.point_prevalence_7day_rate == 0.0"
            - "outcome_report.continuous_30day_rate == 0.0"

  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: coaching_call_create_requires_enrollment_active
        grounds:
          - entities.Enrollment.fields.status
          - errors[ERR_ENROLLMENT_NOT_ACTIVE]
        distinguishing_aspect: |
          Pair CoachingCall->Enrollment: scheduling a call requires Enrollment.status==ACTIVE;
          a PENDING_ASSESSMENT enrollment rejects with ERR_ENROLLMENT_NOT_ACTIVE.
        test_recipe:
          setup:
            - "Enrollment PENDING_ASSESSMENT (never activated); coach EN; clock 2026-06-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /coaches"
              payload: { full_name: "Coach EN", languages: ["EN"] }
              as: ProgramAdmin
              captures: { coach_id: $.data.id }
            - call: "POST /participants"
              payload: { full_name: "P", email: "p@x.com", primary_language: "EN", cigarettes_per_day: 10 }
              as: CaseManager
              captures: { part_id: $.data.id }
            - call: "POST /participants/${part_id}/enrollments"
              payload: {}
              as: CaseManager
              captures: { enr_id: $.data.id }
          trigger:
            - call: "POST /enrollments/${enr_id}/coaching-calls"
              payload: { coach_id: "${coach_id}", scheduled_start: "2026-06-02T10:00:00Z", duration_minutes: 30 }
              as: CaseManager
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_ENROLLMENT_NOT_ACTIVE"

      - name: nrt_approval_requires_committed_quit_attempt
        grounds:
          - state_machines.NRTShipment.REQUESTED_to_APPROVED
          - entities.QuitAttempt.fields.status
          - errors[ERR_NO_COMMITTED_QUIT_ATTEMPT]
        distinguishing_aspect: |
          Pair NRTShipment->QuitAttempt: approving a shipment requires a QuitAttempt in
          {COMMITTED, QUIT_ACHIEVED}; with none, approval rejects ERR_NO_COMMITTED_QUIT_ATTEMPT.
        test_recipe:
          setup:
            - "ACTIVE enrollment with NO quit attempt; one shipment REQUESTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /participants"
              payload: { full_name: "P", email: "p@x.com", primary_language: "EN", cigarettes_per_day: 15 }
              as: CaseManager
              captures: { part_id: $.data.id }
            - call: "POST /participants/${part_id}/enrollments"
              payload: {}
              as: CaseManager
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/readiness-assessments"
              payload: { motivation_score: 6, confidence_score: 6, prior_quit_attempts: 0 }
              as: CaseManager
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: CaseManager
            - call: "POST /enrollments/${enr_id}/nrt-shipments"
              payload: { medication_type: "PATCH", course_start_date: "2026-06-05T00:00:00Z", course_end_date: "2026-06-30T00:00:00Z" }
              as: CaseManager
              captures: { ship_id: $.data.id }
          trigger:
            - call: "POST /nrt-shipments/${ship_id}/transition"
              payload: { to_status: "APPROVED" }
              as: CaseManager
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_NO_COMMITTED_QUIT_ATTEMPT"

  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: coach_double_booked_within_buffer
        grounds:
          - errors[ERR_COACH_DOUBLE_BOOKED]
          - entities.CoachingCall.fields.scheduled_start
          - entities.CoachingCall.fields.coach_id
        distinguishing_aspect: |
          Coach resource, half-open minute intervals with a 15-minute buffer: call1 10:00-10:30
          and call2 starting 10:40 leave only a 10-min gap (<15) => ERR_COACH_DOUBLE_BOOKED.
        test_recipe:
          setup:
            - "ACTIVE EN enrollment; coach EN with one SCHEDULED call 2026-06-02 10:00-10:30."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /coaches"
              payload: { full_name: "Coach EN", languages: ["EN"] }
              as: ProgramAdmin
              captures: { coach_id: $.data.id }
            - call: "POST /participants"
              payload: { full_name: "P", email: "p@x.com", primary_language: "EN", cigarettes_per_day: 10 }
              as: CaseManager
              captures: { part_id: $.data.id }
            - call: "POST /participants/${part_id}/enrollments"
              payload: {}
              as: CaseManager
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/readiness-assessments"
              payload: { motivation_score: 6, confidence_score: 6, prior_quit_attempts: 0 }
              as: CaseManager
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: CaseManager
            - call: "POST /enrollments/${enr_id}/coaching-calls"
              payload: { coach_id: "${coach_id}", scheduled_start: "2026-06-02T10:00:00Z", duration_minutes: 30 }
              as: CaseManager
              captures: { call1_id: $.data.id }
          trigger:
            - call: "POST /enrollments/${enr_id}/coaching-calls"
              payload: { coach_id: "${coach_id}", scheduled_start: "2026-06-02T10:40:00Z", duration_minutes: 30 }
              as: CaseManager
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_COACH_DOUBLE_BOOKED"

      - name: nrt_course_date_adjacency_overlap
        grounds:
          - errors[ERR_NRT_COURSE_OVERLAP]
          - entities.NRTShipment.fields.course_start_date
          - entities.NRTShipment.fields.course_end_date
        distinguishing_aspect: |
          Enrollment resource, closed inclusive date intervals where adjacency counts as
          overlap: course1 [06-10, 06-24] and course2 [06-24, 07-01] share the 06-24 endpoint
          => ERR_NRT_COURSE_OVERLAP. Different interval semantics from the coach buffer rule.
        test_recipe:
          setup:
            - "ACTIVE enrollment (allotment 3) with a REQUESTED shipment course [2026-06-10, 2026-06-24]."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /participants"
              payload: { full_name: "P", email: "p@x.com", primary_language: "EN", cigarettes_per_day: 15 }
              as: CaseManager
              captures: { part_id: $.data.id }
            - call: "POST /participants/${part_id}/enrollments"
              payload: {}
              as: CaseManager
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/readiness-assessments"
              payload: { motivation_score: 6, confidence_score: 6, prior_quit_attempts: 0 }
              as: CaseManager
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: CaseManager
            - call: "POST /enrollments/${enr_id}/nrt-shipments"
              payload: { medication_type: "PATCH", course_start_date: "2026-06-10T00:00:00Z", course_end_date: "2026-06-24T00:00:00Z" }
              as: CaseManager
              captures: { ship1_id: $.data.id }
          trigger:
            - call: "POST /enrollments/${enr_id}/nrt-shipments"
              payload: { medication_type: "GUM", course_start_date: "2026-06-24T00:00:00Z", course_end_date: "2026-07-01T00:00:00Z" }
              as: CaseManager
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_NRT_COURSE_OVERLAP"

  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: incentive_budget_conserved_on_forfeit
        grounds:
          - state_machines.Enrollment.ACTIVE_to_DISENROLLED
          - entities.EmployerProgram.fields.budget_remaining_cents
          - entities.Enrollment.fields.incentive_earned_cents
        distinguishing_aspect: |
          Conserved quantity = program budget cents. After forfeiting QUIT_DATE_SET(1500)+
          SEVEN(2500), budget_remaining_cents (99000) + sum(EARNED/PAID awards = 1000) ==
          budget_total_cents (100000). No drift.
        test_recipe:
          setup:
            - "Same as disenroll_forfeits_awards_credits_budget_depth4: sponsored ACTIVE enrollment with ENROLLMENT+QUIT_DATE_SET+SEVEN awards (earned 5000, budget 95000), then disenroll."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /employer-programs"
              payload: { name: "Inv", budget_total_cents: 100000, nrt_courses_allotted: 3 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /participants"
              payload: { full_name: "P", email: "p@x.com", primary_language: "EN", cigarettes_per_day: 10, employer_program_id: "${prog_id}" }
              as: CaseManager
              captures: { part_id: $.data.id }
            - call: "POST /participants/${part_id}/enrollments"
              payload: {}
              as: CaseManager
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/readiness-assessments"
              payload: { motivation_score: 6, confidence_score: 6, prior_quit_attempts: 0 }
              as: CaseManager
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: CaseManager
            - call: "POST /enrollments/${enr_id}/quit-attempts"
              payload: { quit_date: "2026-06-02T00:00:00Z", method: "COLD_TURKEY" }
              as: CaseManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-09T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /enrollments/${enr_id}/follow-up-outcomes"
              payload: { day: 7, abstinent: true }
              as: CaseManager
          trigger:
            - call: "POST /enrollments/${enr_id}/disenroll"
              payload: {}
              as: CaseManager
          assert:
            - "EmployerProgram.${prog_id}.budget_remaining_cents == 99000"
            - "Enrollment.${enr_id}.incentive_earned_cents == 1000"
            - "EmployerProgram.${prog_id}.budget_remaining_cents + Enrollment.${enr_id}.incentive_earned_cents == 100000"

      - name: nrt_course_count_conserved_on_return
        grounds:
          - state_machines.NRTShipment.DELIVERED_to_RETURNED
          - entities.Enrollment.fields.nrt_courses_used
          - entities.Enrollment.fields.nrt_courses_remaining
        distinguishing_aspect: |
          Conserved quantity = NRT course count. After DELIVERED then RETURNED,
          nrt_courses_used (0) + nrt_courses_remaining (3) == nrt_courses_allotted (3). No drift.
        test_recipe:
          setup:
            - "Sponsored program allotment 3. ACTIVE enrollment, committed quit attempt, one shipment driven REQUESTED->APPROVED->SHIPPED->DELIVERED (used 1, remaining 2)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /employer-programs"
              payload: { name: "Ret", budget_total_cents: 100000, nrt_courses_allotted: 3 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /participants"
              payload: { full_name: "P", email: "p@x.com", primary_language: "EN", cigarettes_per_day: 15, employer_program_id: "${prog_id}" }
              as: CaseManager
              captures: { part_id: $.data.id }
            - call: "POST /participants/${part_id}/enrollments"
              payload: {}
              as: CaseManager
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/readiness-assessments"
              payload: { motivation_score: 6, confidence_score: 6, prior_quit_attempts: 0 }
              as: CaseManager
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: CaseManager
            - call: "POST /enrollments/${enr_id}/quit-attempts"
              payload: { quit_date: "2026-06-02T00:00:00Z", method: "NRT_ASSISTED" }
              as: CaseManager
            - call: "POST /enrollments/${enr_id}/nrt-shipments"
              payload: { medication_type: "PATCH", course_start_date: "2026-06-02T00:00:00Z", course_end_date: "2026-06-30T00:00:00Z" }
              as: CaseManager
              captures: { ship_id: $.data.id }
            - call: "POST /nrt-shipments/${ship_id}/transition"
              payload: { to_status: "APPROVED" }
              as: CaseManager
            - call: "POST /nrt-shipments/${ship_id}/transition"
              payload: { to_status: "SHIPPED" }
              as: CaseManager
            - call: "POST /nrt-shipments/${ship_id}/transition"
              payload: { to_status: "DELIVERED" }
              as: CaseManager
          trigger:
            - call: "POST /nrt-shipments/${ship_id}/transition"
              payload: { to_status: "RETURNED" }
              as: CaseManager
          assert:
            - "Enrollment.${enr_id}.nrt_courses_used == 0"
            - "Enrollment.${enr_id}.nrt_courses_remaining == 3"
            - "Enrollment.${enr_id}.nrt_courses_used + Enrollment.${enr_id}.nrt_courses_remaining == 3"
