# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe across §1.1–§1.7 claims not already covered by §1.8.
# 34 active instances + 3 excluded_because stubs.
# Error-catalog coverage: every one of the 28 error ids is triggered by at
# least one active instance here or in §1.8 (see per-instance asserts).
# =============================================================================
scaffold_corner_design:
  # ------------------------------------------------------------- entities ----
  - section: entities
    instances:
      - name: job_created_with_system_defaults
        claim_type: creation
        grounds: ["entities.PackOutJob.fields.status", "entities.PackOutJob.fields.structure_status", "entities.PackOutJob.fields.billing_status"]
        distinguishing_aspect: "A freshly created job exposes the pinned defaults: status INTAKE, structure_status PENDING, billing_status ACCUMULATING, accrued_storage_total_cents 0, version 1."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/pack-out-jobs", payload: { claim_number: "CLM-EN1", property_address: "40 Fir St", carrier_name: "Acme Mutual", policy_coverage_type: "ACV" }, as: ProjectManager, captures: { job: $.data.id, jstatus: $.data.status, jstruct: $.data.structure_status, jbill: $.data.billing_status, jaccr: $.data.accrued_storage_total_cents, jv: $.data.version } }
          assert:
            - "status == INTAKE (initial state)"
            - "structure_status == PENDING and billing_status == ACCUMULATING (defaults)"
            - "accrued_storage_total_cents == 0 and version == 1"
      - name: get_item_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "response_envelope"]
        distinguishing_aspect: "GET on a non-existent item id returns the §1.0 error envelope with response_type 'error' and data.error_id ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/items/00000000-0000-0000-0000-000000000000", payload: {}, as: ProjectManager, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 404; error_id == ERR_NOT_FOUND"
            - "response envelope: response_type == 'error', meta.api_request_id present, data.message present"
      - name: create_item_missing_required_barcode_returns_400
        claim_type: required_fields
        grounds: ["entities.Item.fields.barcode", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting the required input field barcode on item registration fails schema validation with ERR_VALIDATION (400) before any business logic."
        test_recipe:
          setup: ["one job with one room"]
          setup_api_calls:
            - { call: "POST /api/pack-out-jobs", payload: { claim_number: "CLM-EN3", property_address: "42 Elm St", carrier_name: "Acme Mutual", policy_coverage_type: "ACV" }, as: ProjectManager, captures: { job: $.data.id } }
            - { call: "POST /api/pack-out-jobs/${job}/rooms", payload: { name: "Den", room_type: "LIVING" }, as: ProjectManager, captures: { room: $.data.id } }
          trigger:
            - { call: "POST /api/rooms/${room}/items", payload: { description: "No barcode", item_category: "GENERAL", declared_value_cents: 100, volume_cu_ft: 5 }, as: InventoryTechnician, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 400; error_id == ERR_VALIDATION"
            - "GET /api/items?room_id=${room} returns empty array (nothing persisted)"
      - name: custody_event_immutable_no_version_field
        claim_type: immutability
        grounds: ["entities.CustodyEvent"]
        distinguishing_aspect: "CustodyEvent has common_fields: false — its read objects carry id and created_at but no version/updated_at, and no update endpoint exists (append-only chain of custody)."
        test_recipe:
          setup: ["one ARTWORK item with a DISPATCHED referral and one custody event"]
          setup_api_calls:
            - { call: "POST /api/subcontractors", payload: { name: "DocDry", specialty_types: ["DOCUMENT_FREEZE_DRYING"], max_concurrent_referrals: 3 }, as: ProjectManager, captures: { sub: $.data.id } }
            - { call: "POST /api/pack-out-jobs", payload: { claim_number: "CLM-EN4", property_address: "44 Ash St", carrier_name: "Acme Mutual", policy_coverage_type: "ACV" }, as: ProjectManager, captures: { job: $.data.id } }
            - { call: "POST /api/pack-out-jobs/${job}/rooms", payload: { name: "Study", room_type: "OTHER" }, as: ProjectManager, captures: { room: $.data.id } }
            - { call: "POST /api/rooms/${room}/items", payload: { barcode: "BC-EN4", description: "Ledger books", item_category: "DOCUMENT", declared_value_cents: 2000, volume_cu_ft: 4 }, as: InventoryTechnician, captures: { item: $.data.id, item_v: $.data.version } }
            - { call: "POST /api/items/${item}/triage", payload: { determination: "SALVAGEABLE", expected_item_version: "${item_v}" }, as: InventoryTechnician }
            - { call: "POST /api/items/${item}/specialty-referrals", payload: { subcontractor_id: "${sub}", specialty_type: "DOCUMENT_FREEZE_DRYING", quoted_cost_cents: 8000 }, as: ProjectManager, captures: { ref: $.data.id } }
            - { call: "POST /api/specialty-referrals/${ref}/transition", payload: { action: "DISPATCH" }, as: ProjectManager }
            - { call: "POST /api/specialty-referrals/${ref}/custody-events", payload: { event_type: "PICKED_UP", event_at: "2026-08-05T10:00:00Z", actor_name: "tech-1" }, as: InventoryTechnician, captures: { ev_seq: $.data.sequence } }
          trigger:
            - { call: "GET /api/specialty-referrals/${ref}/custody-events", payload: {}, as: ProjectManager }
          assert:
            - "each returned CustodyEvent object contains id, created_at, referral_id, event_type, event_at, actor_name, sequence"
            - "each returned CustodyEvent object has NO 'version' and NO 'updated_at' key (common_fields: false)"
            - "created event sequence == 1"
      - name: item_computed_is_high_value_threshold
        claim_type: computed_fields
        grounds: ["entities.Item.fields.is_high_value"]
        excluded_because:
          difficulty_instance: high_value_threshold_exact_boundary
          rationale: "The computed flag is asserted both at exactly 1000000 (true) and 999999 (false) in that §1.8 instance's setup captures and asserts."

  # --------------------------------------------------------- state_machines ----
  - section: state_machines
    instances:
      - name: terminal_item_rejects_triage
        claim_type: terminal_lockdown
        grounds: ["state_machines.Item.condition_triage", "errors[ERR_ITEM_TERMINAL]"]
        distinguishing_aspect: "A DISPOSED item (terminal processing_status) rejects further triage with ERR_ITEM_TERMINAL; no state or field changes occur."
        test_recipe:
          setup: ["item fully disposed: NON_SALVAGEABLE -> DRAFT disposal -> DOCUMENTED -> VERIFIED (item DISPOSED)"]
          setup_api_calls:
            - { call: "POST /api/pack-out-jobs", payload: { claim_number: "CLM-SM1", property_address: "46 Birch St", carrier_name: "Acme Mutual", policy_coverage_type: "ACV" }, as: ProjectManager, captures: { job: $.data.id } }
            - { call: "POST /api/pack-out-jobs/${job}/rooms", payload: { name: "Shed", room_type: "GARAGE" }, as: ProjectManager, captures: { room: $.data.id } }
            - { call: "POST /api/rooms/${room}/items", payload: { barcode: "BC-SM1", description: "Soaked sofa", item_category: "FURNITURE", declared_value_cents: 4000, volume_cu_ft: 30 }, as: InventoryTechnician, captures: { item: $.data.id, item_v1: $.data.version } }
            - { call: "POST /api/items/${item}/triage", payload: { determination: "NON_SALVAGEABLE", expected_item_version: "${item_v1}" }, as: InventoryTechnician }
            - { call: "GET /api/items/${item}/disposal-record", payload: {}, as: InventoryTechnician, captures: { drec: "$.data[0].id" } }
            - { call: "POST /api/disposal-records/${drec}/transition", payload: { action: "DOCUMENT", disposal_method: "LANDFILL", facility_name: "City Landfill" }, as: InventoryTechnician, as_user_id: "tech-1" }
            - { call: "POST /api/disposal-records/${drec}/transition", payload: { action: "VERIFY" }, as: ProjectManager, as_user_id: "pm-9" }
            - { call: "GET /api/items/${item}", payload: {}, as: InventoryTechnician, captures: { item_v_now: $.data.version } }
          trigger:
            - { call: "POST /api/items/${item}/triage", payload: { determination: "SALVAGEABLE", expected_item_version: "${item_v_now}" }, as: InventoryTechnician, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ITEM_TERMINAL (DISPOSED is terminal)"
            - "Item.${item}.processing_status remains DISPOSED and condition_triage remains NON_SALVAGEABLE"
      - name: cleaning_start_twice_returns_invalid_transition
        claim_type: invalid_transition
        grounds: ["state_machines.CleaningTask.SCHEDULED_to_IN_PROGRESS", "errors[ERR_INVALID_TRANSITION]"]
        distinguishing_aspect: "START on an already IN_PROGRESS task is not a declared transition — rejected with ERR_INVALID_TRANSITION (idempotency of the action endpoint)."
        test_recipe:
          setup: ["one cleaning task already IN_PROGRESS"]
          setup_api_calls:
            - { call: "POST /api/pack-out-jobs", payload: { claim_number: "CLM-SM2", property_address: "48 Cedar St", carrier_name: "Acme Mutual", policy_coverage_type: "ACV" }, as: ProjectManager, captures: { job: $.data.id } }
            - { call: "POST /api/pack-out-jobs/${job}/rooms", payload: { name: "Kitchen", room_type: "KITCHEN" }, as: ProjectManager, captures: { room: $.data.id } }
            - { call: "POST /api/rooms/${room}/items", payload: { barcode: "BC-SM2", description: "Blender", item_category: "APPLIANCE", declared_value_cents: 3000, volume_cu_ft: 2 }, as: InventoryTechnician, captures: { item: $.data.id, item_v: $.data.version } }
            - { call: "POST /api/items/${item}/triage", payload: { determination: "SALVAGEABLE", expected_item_version: "${item_v}" }, as: InventoryTechnician }
            - { call: "POST /api/items/${item}/cleaning-tasks", payload: {}, as: InventoryTechnician, captures: { task: $.data.id } }
            - { call: "POST /api/cleaning-tasks/${task}/transition", payload: { action: "START" }, as: InventoryTechnician }
          trigger:
            - { call: "POST /api/cleaning-tasks/${task}/transition", payload: { action: "START" }, as: InventoryTechnician, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_TRANSITION (IN_PROGRESS has no START edge)"
            - "CleaningTask.${task}.status remains IN_PROGRESS"
      - name: room_compound_status_bubble_up
        claim_type: side_effect_execution
        grounds: ["state_machines.Room.OPEN_to_INVENTORIED", "entities.Room.fields.status"]
        distinguishing_aspect: "Room.status is a compound of its children: OPEN while the only item is PENDING triage, INVENTORIED once triaged, CLEARED once the item leaves on-site states (IN_STORAGE)."
        test_recipe:
          setup: ["one room with one item driven through triage -> cleaning -> placement"]
          setup_api_calls:
            - { call: "POST /api/pack-out-jobs", payload: { claim_number: "CLM-SM3", property_address: "50 Poplar St", carrier_name: "Acme Mutual", policy_coverage_type: "ACV" }, as: ProjectManager, captures: { job: $.data.id } }
            - { call: "POST /api/pack-out-jobs/${job}/rooms", payload: { name: "Bedroom", room_type: "BEDROOM" }, as: ProjectManager, captures: { room: $.data.id } }
            - { call: "POST /api/rooms/${room}/items", payload: { barcode: "BC-SM3", description: "Headboard", item_category: "FURNITURE", declared_value_cents: 9000, volume_cu_ft: 12 }, as: InventoryTechnician, captures: { item: $.data.id, item_v: $.data.version } }
            - { call: "GET /api/pack-out-jobs/${job}/rooms", payload: {}, as: ProjectManager, captures: { room_st0: "$.data[0].status" } }
            - { call: "POST /api/items/${item}/triage", payload: { determination: "SALVAGEABLE", expected_item_version: "${item_v}" }, as: InventoryTechnician }
            - { call: "GET /api/pack-out-jobs/${job}/rooms", payload: {}, as: ProjectManager, captures: { room_st1: "$.data[0].status" } }
            - { call: "POST /api/items/${item}/cleaning-tasks", payload: {}, as: InventoryTechnician, captures: { task: $.data.id } }
            - { call: "POST /api/cleaning-tasks/${task}/transition", payload: { action: "START" }, as: InventoryTechnician }
            - { call: "POST /api/cleaning-tasks/${task}/transition", payload: { action: "QA_PASS" }, as: InventoryTechnician }
            - { call: "POST /api/vaults", payload: { code: "V-SM3", climate_class: "STANDARD", capacity_cu_ft: 1000, monthly_rate_cents_per_cu_ft: 100 }, as: ProjectManager, captures: { vault: $.data.id } }
          trigger:
            - { call: "POST /api/items/${item}/placements", payload: { vault_id: "${vault}" }, as: InventoryTechnician }
            - { call: "GET /api/pack-out-jobs/${job}/rooms", payload: {}, as: ProjectManager, captures: { room_st2: "$.data[0].status" } }
          assert:
            - "room status was OPEN while item triage PENDING"
            - "room status became INVENTORIED after the item was triaged SALVAGEABLE"
            - "room status became CLEARED once the item reached IN_STORAGE (bubble-up recompute)"
      - name: claim_appeal_cycle_reopens_review
        claim_type: valid_transition
        grounds: ["state_machines.HandlingClaim.DENIED_to_UNDER_REVIEW"]
        distinguishing_aspect: "The claim machine is cyclic: DENIED -> UNDER_REVIEW via APPEAL, restoring reviewability without clearing filed data."
        test_recipe:
          setup: ["a claim denied by adj-1"]
          setup_api_calls:
            - { call: "POST /api/pack-out-jobs", payload: { claim_number: "CLM-SM4", property_address: "52 Spruce St", carrier_name: "Acme Mutual", policy_coverage_type: "ACV" }, as: ProjectManager, captures: { job: $.data.id } }
            - { call: "POST /api/pack-out-jobs/${job}/rooms", payload: { name: "Den", room_type: "LIVING" }, as: ProjectManager, captures: { room: $.data.id } }
            - { call: "POST /api/rooms/${room}/items", payload: { barcode: "BC-SM4", description: "TV", item_category: "ELECTRONICS", declared_value_cents: 60000, volume_cu_ft: 4 }, as: InventoryTechnician, captures: { item: $.data.id } }
            - { call: "POST /api/items/${item}/handling-claims", payload: { claim_type: "DAMAGE", description: "Screen cracked", replacement_cost_cents: 60000, item_age_years: 3 }, as: ProjectManager, as_user_id: "pm-1", captures: { claim: $.data.id } }
            - { call: "POST /api/handling-claims/${claim}/transition", payload: { action: "SUBMIT_REVIEW" }, as: ClaimsAdjuster, as_user_id: "adj-1" }
            - { call: "POST /api/handling-claims/${claim}/transition", payload: { action: "DENY" }, as: ClaimsAdjuster, as_user_id: "adj-1" }
          trigger:
            - { call: "POST /api/handling-claims/${claim}/transition", payload: { action: "APPEAL" }, as: ClaimsAdjuster, as_user_id: "adj-2", captures: { cst: $.data.status } }
          assert:
            - "HandlingClaim.${claim}.status == UNDER_REVIEW after APPEAL (DENIED -> UNDER_REVIEW cycle)"
            - "settlement_amount_cents remains null (no approval has occurred)"
      - name: schedule_reschedule_frees_crew_window
        claim_type: side_effect_execution
        grounds: ["state_machines.PackBackSchedule.CONFIRMED_to_REQUESTED", "entities.PackBackSchedule.fields.reschedule_count"]
        distinguishing_aspect: "RESCHEDULE moves CONFIRMED -> REQUESTED, increments reschedule_count, and frees the crew window so a different schedule can CONFIRM into the vacated [8,12) slot."
        test_recipe:
          setup: ["job structure COMPLETE; one IN_STORAGE item; schedule A CONFIRMED for crew-3 on 2026-09-10 08-12"]
          setup_api_calls:
            - { call: "POST /api/pack-out-jobs", payload: { claim_number: "CLM-SM5", property_address: "54 Alder St", carrier_name: "Acme Mutual", policy_coverage_type: "ACV" }, as: ProjectManager, captures: { job: $.data.id } }
            - { call: "POST /api/pack-out-jobs/${job}/rooms", payload: { name: "Lounge", room_type: "LIVING" }, as: ProjectManager, captures: { room: $.data.id } }
            - { call: "POST /api/rooms/${room}/items", payload: { barcode: "BC-SM5", description: "Loveseat", item_category: "FURNITURE", declared_value_cents: 15000, volume_cu_ft: 14 }, as: InventoryTechnician, captures: { item: $.data.id, item_v: $.data.version } }
            - { call: "POST /api/items/${item}/triage", payload: { determination: "SALVAGEABLE", expected_item_version: "${item_v}" }, as: InventoryTechnician }
            - { call: "POST /api/items/${item}/cleaning-tasks", payload: {}, as: InventoryTechnician, captures: { task: $.data.id } }
            - { call: "POST /api/cleaning-tasks/${task}/transition", payload: { action: "START" }, as: InventoryTechnician }
            - { call: "POST /api/cleaning-tasks/${task}/transition", payload: { action: "QA_PASS" }, as: InventoryTechnician }
            - { call: "POST /api/vaults", payload: { code: "V-SM5", climate_class: "STANDARD", capacity_cu_ft: 1000, monthly_rate_cents_per_cu_ft: 100 }, as: ProjectManager, captures: { vault: $.data.id } }
            - { call: "POST /api/items/${item}/placements", payload: { vault_id: "${vault}" }, as: InventoryTechnician }
            - { call: "POST /api/pack-out-jobs/${job}/transition", payload: { action: "STRUCTURE_START" }, as: ProjectManager }
            - { call: "POST /api/pack-out-jobs/${job}/transition", payload: { action: "STRUCTURE_COMPLETE" }, as: ProjectManager }
            - { call: "POST /api/pack-out-jobs/${job}/pack-back-schedules", payload: { crew_id: "crew-3", service_date: "2026-09-10", window_start_hour: 8, window_end_hour: 12 }, as: ProjectManager, captures: { sch_a: $.data.id } }
            - { call: "POST /api/pack-back-schedules/${sch_a}/transition", payload: { action: "CONFIRM" }, as: ProjectManager }
          trigger:
            - { call: "POST /api/pack-back-schedules/${sch_a}/transition", payload: { action: "RESCHEDULE", service_date: "2026-09-11", window_start_hour: 14, window_end_hour: 16 }, as: ProjectManager, captures: { ast: $.data.status, arc: $.data.reschedule_count } }
            - { call: "POST /api/pack-out-jobs/${job}/pack-back-schedules", payload: { crew_id: "crew-3", service_date: "2026-09-10", window_start_hour: 8, window_end_hour: 12 }, as: ProjectManager, captures: { sch_b: $.data.id } }
            - { call: "POST /api/pack-back-schedules/${sch_b}/transition", payload: { action: "CONFIRM" }, as: ProjectManager, captures: { bst: $.data.status } }
          assert:
            - "schedule A: status REQUESTED, reschedule_count == 1, new window 2026-09-11 14-16"
            - "schedule B CONFIRMED into the freed 2026-09-10 08-12 slot (REQUESTED occupies no window)"
      - name: disposal_verify_completes_item
        claim_type: valid_transition
        grounds: ["state_machines.DisposalRecord.DOCUMENTED_to_VERIFIED", "state_machines.Item.AWAITING_DISPOSAL_to_DISPOSED"]
        distinguishing_aspect: "VERIFY (by a different user than the documenter) flips the record to VERIFIED and drives the item to terminal DISPOSED."
        test_recipe:
          setup: ["item NON_SALVAGEABLE with DOCUMENTED disposal record (documented_by tech-1)"]
          setup_api_calls:
            - { call: "POST /api/pack-out-jobs", payload: { claim_number: "CLM-SM6", property_address: "56 Willow St", carrier_name: "Acme Mutual", policy_coverage_type: "ACV" }, as: ProjectManager, captures: { job: $.data.id } }
            - { call: "POST /api/pack-out-jobs/${job}/rooms", payload: { name: "Basement", room_type: "BASEMENT" }, as: ProjectManager, captures: { room: $.data.id } }
            - { call: "POST /api/rooms/${room}/items", payload: { barcode: "BC-SM6", description: "Moldy boxes", item_category: "GENERAL", declared_value_cents: 200, volume_cu_ft: 6 }, as: InventoryTechnician, captures: { item: $.data.id, item_v: $.data.version } }
            - { call: "POST /api/items/${item}/triage", payload: { determination: "NON_SALVAGEABLE", expected_item_version: "${item_v}" }, as: InventoryTechnician }
            - { call: "GET /api/items/${item}/disposal-record", payload: {}, as: InventoryTechnician, captures: { drec: "$.data[0].id" } }
            - { call: "POST /api/disposal-records/${drec}/transition", payload: { action: "DOCUMENT", disposal_method: "RECYCLE", facility_name: "GreenCycle" }, as: InventoryTechnician, as_user_id: "tech-1" }
          trigger:
            - { call: "POST /api/disposal-records/${drec}/transition", payload: { action: "VERIFY" }, as: ProjectManager, as_user_id: "pm-9", captures: { dst: $.data.status, dvb: $.data.verified_by_user_id } }
          assert:
            - "DisposalRecord.${drec}.status == VERIFIED and verified_by_user_id == pm-9"
            - "Item.${item}.processing_status == DISPOSED"
      - name: statement_supersede_voids_prior
        claim_type: side_effect_execution
        grounds: ["state_machines.StorageStatement.PROVISIONAL_to_VOIDED", "entities.StorageStatement.fields.supersedes_statement_id"]
        distinguishing_aspect: "Create-with-supersede: a new statement naming the job's current PROVISIONAL statement voids it atomically; the superseding statement becomes the sole PROVISIONAL."
        test_recipe:
          setup: ["job with PROVISIONAL statement S1 for [2026-08-01, 2026-09-01)"]
          setup_api_calls:
            - { call: "POST /api/pack-out-jobs", payload: { claim_number: "CLM-SM7", property_address: "58 Beech St", carrier_name: "Acme Mutual", policy_coverage_type: "ACV" }, as: ProjectManager, captures: { job: $.data.id, job_v1: $.data.version } }
            - { call: "POST /api/pack-out-jobs/${job}/storage-statements", payload: { period_start: "2026-08-01", period_end: "2026-09-01", expected_job_version: "${job_v1}" }, as: BillingClerk, captures: { s1: $.data.id } }
            - { call: "GET /api/pack-out-jobs/${job}", payload: {}, as: BillingClerk, captures: { job_v2: $.data.version } }
          trigger:
            - { call: "POST /api/pack-out-jobs/${job}/storage-statements", payload: { period_start: "2026-08-01", period_end: "2026-09-01", supersedes_statement_id: "${s1}", expected_job_version: "${job_v2}" }, as: BillingClerk, captures: { s2: $.data.id, s2st: $.data.status } }
            - { call: "GET /api/storage-statements/${s1}", payload: {}, as: BillingClerk, captures: { s1st: $.data.status } }
          assert:
            - "S2 status == PROVISIONAL"
            - "S1 status == VOIDED (superseded by S2 via supersedes_statement_id)"
            - "GET /api/storage-statements?supersedes_statement_id=${s1} returns array containing exactly S2"

      - name: invoice_dispute_resubmit_cycle
        claim_type: valid_transition
        grounds: ["state_machines.CarrierInvoice.SUBMITTED_to_DISPUTED", "entities.PackOutJob.fields.billing_status"]
        distinguishing_aspect: "The invoice machine is cyclic: SUBMITTED -> DISPUTED -> SUBMITTED (resubmission); job.billing_status derives DISPUTED while the dispute is open and returns to INVOICED after resubmission."
        test_recipe:
          setup: ["SUBMITTED invoice (statement final 0 + adjustment 500 -> fee 25 -> total 525)"]
          setup_api_calls:
            - { call: "POST /api/pack-out-jobs", payload: { claim_number: "CLM-SM8", property_address: "104 Walnut St", carrier_name: "Acme Mutual", policy_coverage_type: "ACV" }, as: ProjectManager, captures: { job: $.data.id, job_v1: $.data.version } }
            - { call: "POST /api/pack-out-jobs/${job}/storage-statements", payload: { period_start: "2026-08-01", period_end: "2026-09-01", expected_job_version: "${job_v1}" }, as: BillingClerk }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: BillingClerk }
            - { call: "POST /api/billing-runs", payload: {}, as: BillingClerk }
            - { call: "POST /api/pack-out-jobs/${job}/carrier-invoices", payload: { adjustment_cents: 500 }, as: BillingClerk, captures: { inv: $.data.id } }
            - { call: "POST /api/carrier-invoices/${inv}/transition", payload: { action: "SUBMIT" }, as: BillingClerk }
          trigger:
            - { call: "POST /api/carrier-invoices/${inv}/transition", payload: { action: "DISPUTE", dispute_reason: "storage line mismatch" }, as: CarrierRepresentative, captures: { ist1: $.data.status } }
            - { call: "GET /api/pack-out-jobs/${job}", payload: {}, as: BillingClerk, captures: { jb1: $.data.billing_status } }
            - { call: "POST /api/carrier-invoices/${inv}/transition", payload: { action: "SUBMIT" }, as: BillingClerk, captures: { ist2: $.data.status } }
            - { call: "GET /api/pack-out-jobs/${job}", payload: {}, as: BillingClerk, captures: { jb2: $.data.billing_status } }
          assert:
            - "after DISPUTE: invoice status == DISPUTED and job.billing_status == DISPUTED"
            - "after resubmission: invoice status == SUBMITTED and job.billing_status == INVOICED (cycle DISPUTED -> SUBMITTED)"

  # ---------------------------------------------------------- calculations ----
  - section: calculations
    instances:
      - name: cleaning_fee_deodorization_adder
        claim_type: constants_applied
        grounds: ["calculations.cleaning_task_fee", "entities.CleaningTask.fields.fee_cents"]
        distinguishing_aspect: "A smoke-damaged item's passed task bills CLEANING_BASE 12000 + DEODORIZATION_ADDER 4000 = 16000 cents; the flag is snapshotted at task creation."
        test_recipe:
          setup: ["one GENERAL smoke-damaged item driven through cleaning"]
          setup_api_calls:
            - { call: "POST /api/pack-out-jobs", payload: { claim_number: "CLM-CA1", property_address: "60 Cherry St", carrier_name: "Acme Mutual", policy_coverage_type: "ACV" }, as: ProjectManager, captures: { job: $.data.id } }
            - { call: "POST /api/pack-out-jobs/${job}/rooms", payload: { name: "Kitchen", room_type: "KITCHEN" }, as: ProjectManager, captures: { room: $.data.id } }
            - { call: "POST /api/rooms/${room}/items", payload: { barcode: "BC-CA1", description: "Smoke sofa", item_category: "GENERAL", declared_value_cents: 3000, volume_cu_ft: 20, smoke_damage_flag: true }, as: InventoryTechnician, captures: { item: $.data.id, item_v: $.data.version } }
            - { call: "POST /api/items/${item}/triage", payload: { determination: "SALVAGEABLE", expected_item_version: "${item_v}" }, as: InventoryTechnician }
            - { call: "POST /api/items/${item}/cleaning-tasks", payload: {}, as: InventoryTechnician, captures: { task: $.data.id, deo: $.data.deodorization_required } }
            - { call: "POST /api/cleaning-tasks/${task}/transition", payload: { action: "START" }, as: InventoryTechnician }
          trigger:
            - { call: "POST /api/cleaning-tasks/${task}/transition", payload: { action: "QA_PASS" }, as: InventoryTechnician, captures: { fee: $.data.fee_cents } }
          assert:
            - "deodorization_required == true (snapshotted from item.smoke_damage_flag)"
            - "CleaningTask.${task}.fee_cents == 16000 (12000 + 4000)"
      - name: specialty_billed_cost_rounding
        claim_type: precision
        grounds: ["calculations.specialty_billed_cost", "entities.SpecialtyReferral.fields.billed_cost_cents"]
        distinguishing_aspect: "quoted 10001 with markup 15% -> round_half_up(11501.15) = 11501 cents, rounded exactly once at QA_ACCEPT (banker's or double rounding would differ)."
        test_recipe:
          setup: ["ARTWORK item with referral quoted_cost_cents 10001, default markup_pct 15, moved DISPATCHED -> IN_CUSTODY -> RETURNED"]
          setup_api_calls:
            - { call: "POST /api/subcontractors", payload: { name: "FineArt Pros", specialty_types: ["ART_CONSERVATION"], max_concurrent_referrals: 5 }, as: ProjectManager, captures: { sub: $.data.id } }
            - { call: "POST /api/pack-out-jobs", payload: { claim_number: "CLM-CA2", property_address: "62 Walnut St", carrier_name: "Acme Mutual", policy_coverage_type: "ACV" }, as: ProjectManager, captures: { job: $.data.id } }
            - { call: "POST /api/pack-out-jobs/${job}/rooms", payload: { name: "Gallery", room_type: "LIVING" }, as: ProjectManager, captures: { room: $.data.id } }
            - { call: "POST /api/rooms/${room}/items", payload: { barcode: "BC-CA2", description: "Canvas", item_category: "ARTWORK", declared_value_cents: 300000, volume_cu_ft: 2 }, as: InventoryTechnician, captures: { item: $.data.id, item_v: $.data.version } }
            - { call: "POST /api/items/${item}/triage", payload: { determination: "SALVAGEABLE", expected_item_version: "${item_v}" }, as: InventoryTechnician }
            - { call: "POST /api/items/${item}/specialty-referrals", payload: { subcontractor_id: "${sub}", specialty_type: "ART_CONSERVATION", quoted_cost_cents: 10001 }, as: ProjectManager, captures: { ref: $.data.id } }
            - { call: "POST /api/specialty-referrals/${ref}/transition", payload: { action: "DISPATCH" }, as: ProjectManager }
            - { call: "POST /api/specialty-referrals/${ref}/transition", payload: { action: "RECEIVE" }, as: SubcontractorContact, as_user_id: "${sub}" }
            - { call: "POST /api/specialty-referrals/${ref}/transition", payload: { action: "RETURN" }, as: SubcontractorContact, as_user_id: "${sub}" }
          trigger:
            - { call: "POST /api/specialty-referrals/${ref}/transition", payload: { action: "QA_ACCEPT" }, as: ProjectManager, captures: { billed: $.data.billed_cost_cents, rst: $.data.status } }
          assert:
            - "SpecialtyReferral.${ref}.billed_cost_cents == 11501 (round_half_up(10001 * 115 / 100))"
            - "SpecialtyReferral.${ref}.status == QA_ACCEPTED and item processing_status == CLEANED"
      - name: provisional_excludes_released_placements
        claim_type: input_set_filtering
        grounds: ["calculations.storage_charge_accrual", "entities.StorageStatement.fields.provisional_total_cents"]
        distinguishing_aspect: "The provisional variant's input set is placements ACTIVE at computation time: a placement released BEFORE statement creation contributes 0 even though it occupied days inside the period."
        test_recipe:
          setup: ["item placed 2026-08-01 (default clock) and released 2026-08-10; statement for [2026-08-01, 2026-09-01) created afterwards"]
          setup_api_calls:
            - { call: "POST /api/pack-out-jobs", payload: { claim_number: "CLM-CA3", property_address: "64 Locust St", carrier_name: "Acme Mutual", policy_coverage_type: "ACV" }, as: ProjectManager, captures: { job: $.data.id } }
            - { call: "POST /api/pack-out-jobs/${job}/rooms", payload: { name: "Den", room_type: "LIVING" }, as: ProjectManager, captures: { room: $.data.id } }
            - { call: "POST /api/rooms/${room}/items", payload: { barcode: "BC-CA3", description: "Rug", item_category: "GENERAL", declared_value_cents: 1500, volume_cu_ft: 10 }, as: InventoryTechnician, captures: { item: $.data.id, item_v: $.data.version } }
            - { call: "POST /api/items/${item}/triage", payload: { determination: "SALVAGEABLE", expected_item_version: "${item_v}" }, as: InventoryTechnician }
            - { call: "POST /api/items/${item}/cleaning-tasks", payload: {}, as: InventoryTechnician, captures: { task: $.data.id } }
            - { call: "POST /api/cleaning-tasks/${task}/transition", payload: { action: "START" }, as: InventoryTechnician }
            - { call: "POST /api/cleaning-tasks/${task}/transition", payload: { action: "QA_PASS" }, as: InventoryTechnician }
            - { call: "POST /api/vaults", payload: { code: "V-CA3", climate_class: "CLIMATE_CONTROLLED", capacity_cu_ft: 1000, monthly_rate_cents_per_cu_ft: 150 }, as: ProjectManager, captures: { vault: $.data.id } }
            - { call: "POST /api/items/${item}/placements", payload: { vault_id: "${vault}" }, as: InventoryTechnician, captures: { plc: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: BillingClerk }
            - { call: "POST /api/storage-placements/${plc}/release", payload: {}, as: InventoryTechnician }
            - { call: "GET /api/pack-out-jobs/${job}", payload: {}, as: BillingClerk, captures: { job_v: $.data.version } }
          trigger:
            - { call: "POST /api/pack-out-jobs/${job}/storage-statements", payload: { period_start: "2026-08-01", period_end: "2026-09-01", expected_job_version: "${job_v}" }, as: BillingClerk, captures: { prov: $.data.provisional_total_cents } }
          assert:
            - "provisional_total_cents == 0 — the RELEASED placement is excluded from the forward-looking input set"
      - name: final_includes_released_placement_days
        claim_type: input_set_filtering
        grounds: ["calculations.storage_charge_accrual"]
        excluded_because:
          difficulty_instance: storage_accrual_provisional_vs_final_divergence
          rationale: "That §1.8 instance's final_total_cents == 4137 is exactly the assertion that a placement released 2026-08-31 still bills its 21 occupied days under the final variant."

  # ------------------------------------------------------------ validations ----
  - section: validations
    instances:
      - name: unauthenticated_missing_auth_header_returns_401
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request without X-User-Role/X-User-ID is rejected at priority 1 before role, existence, or business checks."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/pack-out-jobs", payload: { claim_number: "CLM-V1", property_address: "66 Maple St", carrier_name: "Acme Mutual", policy_coverage_type: "ACV" }, as: Anonymous, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 401; error_id == ERR_UNAUTHENTICATED (Anonymous means: send no auth headers)"
      - name: climate_gate_textile_into_standard_vault
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_CLIMATE_CLASS_INCOMPATIBLE]"]
        distinguishing_aspect: "TEXTILE is a climate-required category: placement into a STANDARD vault fails with ERR_CLIMATE_CLASS_INCOMPATIBLE; the same item into a CLIMATE_CONTROLLED vault succeeds (satisfaction passes)."
        test_recipe:
          setup: ["one cleaned TEXTILE item; one STANDARD vault and one CLIMATE_CONTROLLED vault, both with capacity"]
          setup_api_calls:
            - { call: "POST /api/pack-out-jobs", payload: { claim_number: "CLM-V2", property_address: "68 Oak St", carrier_name: "Acme Mutual", policy_coverage_type: "ACV" }, as: ProjectManager, captures: { job: $.data.id } }
            - { call: "POST /api/pack-out-jobs/${job}/rooms", payload: { name: "Bedroom", room_type: "BEDROOM" }, as: ProjectManager, captures: { room: $.data.id } }
            - { call: "POST /api/rooms/${room}/items", payload: { barcode: "BC-V2", description: "Wardrobe textiles", item_category: "TEXTILE", declared_value_cents: 2500, volume_cu_ft: 8 }, as: InventoryTechnician, captures: { item: $.data.id, item_v: $.data.version } }
            - { call: "POST /api/items/${item}/triage", payload: { determination: "SALVAGEABLE", expected_item_version: "${item_v}" }, as: InventoryTechnician }
            - { call: "POST /api/items/${item}/cleaning-tasks", payload: {}, as: InventoryTechnician, captures: { task: $.data.id } }
            - { call: "POST /api/cleaning-tasks/${task}/transition", payload: { action: "START" }, as: InventoryTechnician }
            - { call: "POST /api/cleaning-tasks/${task}/transition", payload: { action: "QA_PASS" }, as: InventoryTechnician }
            - { call: "POST /api/vaults", payload: { code: "V-V2S", climate_class: "STANDARD", capacity_cu_ft: 1000, monthly_rate_cents_per_cu_ft: 100 }, as: ProjectManager, captures: { vault_s: $.data.id } }
            - { call: "POST /api/vaults", payload: { code: "V-V2C", climate_class: "CLIMATE_CONTROLLED", capacity_cu_ft: 1000, monthly_rate_cents_per_cu_ft: 150 }, as: ProjectManager, captures: { vault_c: $.data.id } }
          trigger:
            - { call: "POST /api/items/${item}/placements", payload: { vault_id: "${vault_s}" }, as: InventoryTechnician, captures: { err: $.data.error_id } }
            - { call: "POST /api/items/${item}/placements", payload: { vault_id: "${vault_c}" }, as: InventoryTechnician, captures: { plc: $.data.id, pst: $.data.status } }
          assert:
            - "STANDARD vault attempt: error_id == ERR_CLIMATE_CLASS_INCOMPATIBLE"
            - "CLIMATE_CONTROLLED vault attempt: placement ACTIVE (violation absent -> pass)"
      - name: custody_event_out_of_order_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_CUSTODY_EVENT_OUT_OF_ORDER]", "entities.CustodyEvent.fields.event_at"]
        distinguishing_aspect: "Chain-of-custody temporal validation: an event_at equal to or earlier than the referral's latest event_at is rejected; strictly increasing only."
        test_recipe:
          setup: ["DISPATCHED referral with one custody event at 2026-08-10T10:00:00Z"]
          setup_api_calls:
            - { call: "POST /api/subcontractors", payload: { name: "FineArt Pros", specialty_types: ["ART_CONSERVATION"], max_concurrent_referrals: 5 }, as: ProjectManager, captures: { sub: $.data.id } }
            - { call: "POST /api/pack-out-jobs", payload: { claim_number: "CLM-V3", property_address: "70 Pine St", carrier_name: "Acme Mutual", policy_coverage_type: "ACV" }, as: ProjectManager, captures: { job: $.data.id } }
            - { call: "POST /api/pack-out-jobs/${job}/rooms", payload: { name: "Gallery", room_type: "LIVING" }, as: ProjectManager, captures: { room: $.data.id } }
            - { call: "POST /api/rooms/${room}/items", payload: { barcode: "BC-V3", description: "Sculpture", item_category: "ARTWORK", declared_value_cents: 200000, volume_cu_ft: 3 }, as: InventoryTechnician, captures: { item: $.data.id, item_v: $.data.version } }
            - { call: "POST /api/items/${item}/triage", payload: { determination: "SALVAGEABLE", expected_item_version: "${item_v}" }, as: InventoryTechnician }
            - { call: "POST /api/items/${item}/specialty-referrals", payload: { subcontractor_id: "${sub}", specialty_type: "ART_CONSERVATION", quoted_cost_cents: 9000 }, as: ProjectManager, captures: { ref: $.data.id } }
            - { call: "POST /api/specialty-referrals/${ref}/transition", payload: { action: "DISPATCH" }, as: ProjectManager }
            - { call: "POST /api/specialty-referrals/${ref}/custody-events", payload: { event_type: "PICKED_UP", event_at: "2026-08-10T10:00:00Z", actor_name: "tech-1" }, as: InventoryTechnician }
          trigger:
            - { call: "POST /api/specialty-referrals/${ref}/custody-events", payload: { event_type: "IN_TRANSIT", event_at: "2026-08-10T09:00:00Z", actor_name: "tech-2" }, as: InventoryTechnician, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CUSTODY_EVENT_OUT_OF_ORDER (09:00 <= prior 10:00)"
            - "GET /api/specialty-referrals/${ref}/custody-events still returns exactly 1 event (rejected append left no trace)"
      - name: schedule_window_invalid_on_create
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_WINDOW_INVALID]"]
        distinguishing_aspect: "window_end_hour <= window_start_hour fails at creation time (12 -> 8 is backwards); the schedule is not persisted."
        test_recipe:
          setup: ["one job"]
          setup_api_calls:
            - { call: "POST /api/pack-out-jobs", payload: { claim_number: "CLM-V4", property_address: "72 Elm St", carrier_name: "Acme Mutual", policy_coverage_type: "ACV" }, as: ProjectManager, captures: { job: $.data.id } }
          trigger:
            - { call: "POST /api/pack-out-jobs/${job}/pack-back-schedules", payload: { crew_id: "crew-4", service_date: "2026-09-20", window_start_hour: 12, window_end_hour: 8 }, as: ProjectManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_WINDOW_INVALID (end 8 <= start 12)"
            - "GET /api/pack-out-jobs/${job}/pack-back-schedules returns empty array"
      - name: invoice_create_blocked_by_provisional_statement
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_STATEMENT_PERIOD_OPEN]"]
        distinguishing_aspect: "Cross-entity referential gate: a job with a PROVISIONAL (un-finalized) statement cannot produce a carrier invoice — ERR_STATEMENT_PERIOD_OPEN."
        test_recipe:
          setup: ["job with one PROVISIONAL statement for [2026-08-01, 2026-09-01); clock still 2026-08-01 so no billing run can have finalized it"]
          setup_api_calls:
            - { call: "POST /api/pack-out-jobs", payload: { claim_number: "CLM-V5", property_address: "74 Ash St", carrier_name: "Acme Mutual", policy_coverage_type: "ACV" }, as: ProjectManager, captures: { job: $.data.id, job_v1: $.data.version } }
            - { call: "POST /api/pack-out-jobs/${job}/storage-statements", payload: { period_start: "2026-08-01", period_end: "2026-09-01", expected_job_version: "${job_v1}" }, as: BillingClerk }
          trigger:
            - { call: "POST /api/pack-out-jobs/${job}/carrier-invoices", payload: {}, as: BillingClerk, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_STATEMENT_PERIOD_OPEN"
            - "GET /api/pack-out-jobs/${job}/carrier-invoices returns empty array"
      - name: reconcile_requires_exactly_zero_balance
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_INVOICE_BALANCE_OUTSTANDING]", "state_machines.CarrierInvoice.SUBMITTED_to_RECONCILED"]
        distinguishing_aspect: "Boundary on money: RECONCILE passes only at balance_cents == 0 exactly; with 1050 outstanding it fails, and after a payment of exactly 1050 it succeeds."
        test_recipe:
          setup: ["SUBMITTED invoice: FINALIZED statement (final 0) + adjustment 1000 -> total 1050, balance 1050, no claims"]
          setup_api_calls:
            - { call: "POST /api/pack-out-jobs", payload: { claim_number: "CLM-V6", property_address: "76 Birch St", carrier_name: "Acme Mutual", policy_coverage_type: "ACV" }, as: ProjectManager, captures: { job: $.data.id, job_v1: $.data.version } }
            - { call: "POST /api/pack-out-jobs/${job}/storage-statements", payload: { period_start: "2026-08-01", period_end: "2026-09-01", expected_job_version: "${job_v1}" }, as: BillingClerk }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: BillingClerk }
            - { call: "POST /api/billing-runs", payload: {}, as: BillingClerk }
            - { call: "POST /api/pack-out-jobs/${job}/carrier-invoices", payload: { adjustment_cents: 1000 }, as: BillingClerk, captures: { inv: $.data.id } }
            - { call: "POST /api/carrier-invoices/${inv}/transition", payload: { action: "SUBMIT" }, as: BillingClerk, captures: { bal0: $.data.balance_cents } }
          trigger:
            - { call: "POST /api/carrier-invoices/${inv}/transition", payload: { action: "RECONCILE" }, as: CarrierRepresentative, captures: { err: $.data.error_id } }
            - { call: "POST /api/carrier-invoices/${inv}/transition", payload: { action: "RECORD_PAYMENT", amount_cents: 1050 }, as: BillingClerk, captures: { bal1: $.data.balance_cents } }
            - { call: "POST /api/carrier-invoices/${inv}/transition", payload: { action: "RECONCILE" }, as: CarrierRepresentative, captures: { ist: $.data.status } }
          assert:
            - "first RECONCILE: error_id == ERR_INVOICE_BALANCE_OUTSTANDING (balance 1050 != 0)"
            - "after RECORD_PAYMENT 1050: balance_cents == 0"
            - "second RECONCILE succeeds: status == RECONCILED (boundary == 0 inclusive)"
      - name: disposal_verify_same_user_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_SEGREGATION_OF_DUTIES]", "entities.DisposalRecord.fields.documented_by_user_id"]
        distinguishing_aspect: "Segregation of duties: the user who documented a disposal cannot verify it — VERIFY with the same X-User-ID fails with 403 even under the ProjectManager role."
        test_recipe:
          setup: ["NON_SALVAGEABLE item with disposal record DOCUMENTED by user tech-1"]
          setup_api_calls:
            - { call: "POST /api/pack-out-jobs", payload: { claim_number: "CLM-V7", property_address: "78 Cedar St", carrier_name: "Acme Mutual", policy_coverage_type: "ACV" }, as: ProjectManager, captures: { job: $.data.id } }
            - { call: "POST /api/pack-out-jobs/${job}/rooms", payload: { name: "Shed", room_type: "GARAGE" }, as: ProjectManager, captures: { room: $.data.id } }
            - { call: "POST /api/rooms/${room}/items", payload: { barcode: "BC-V7", description: "Contaminated chair", item_category: "FURNITURE", declared_value_cents: 1000, volume_cu_ft: 10 }, as: InventoryTechnician, captures: { item: $.data.id, item_v: $.data.version } }
            - { call: "POST /api/items/${item}/triage", payload: { determination: "NON_SALVAGEABLE", expected_item_version: "${item_v}" }, as: InventoryTechnician }
            - { call: "GET /api/items/${item}/disposal-record", payload: {}, as: InventoryTechnician, captures: { drec: "$.data[0].id" } }
            - { call: "POST /api/disposal-records/${drec}/transition", payload: { action: "DOCUMENT", disposal_method: "LANDFILL", facility_name: "City Landfill" }, as: InventoryTechnician, as_user_id: "tech-1" }
          trigger:
            - { call: "POST /api/disposal-records/${drec}/transition", payload: { action: "VERIFY" }, as: ProjectManager, as_user_id: "tech-1", captures: { err: $.data.error_id } }
          assert:
            - "HTTP 403; error_id == ERR_SEGREGATION_OF_DUTIES (verifier tech-1 == documenter tech-1)"
            - "DisposalRecord.${drec}.status remains DOCUMENTED"
      - name: duplicate_barcode_rejected_within_job
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_DUPLICATE_BARCODE]", "entities.Item.fields.barcode"]
        distinguishing_aspect: "Barcode uniqueness is scoped to the job: second use inside the same job fails with ERR_DUPLICATE_BARCODE; the same barcode under a DIFFERENT job succeeds."
        test_recipe:
          setup: ["job A room with item barcode BC-DUP; job B room empty"]
          setup_api_calls:
            - { call: "POST /api/pack-out-jobs", payload: { claim_number: "CLM-V8A", property_address: "80 Spruce St", carrier_name: "Acme Mutual", policy_coverage_type: "ACV" }, as: ProjectManager, captures: { job_a: $.data.id } }
            - { call: "POST /api/pack-out-jobs/${job_a}/rooms", payload: { name: "Den", room_type: "LIVING" }, as: ProjectManager, captures: { room_a: $.data.id } }
            - { call: "POST /api/rooms/${room_a}/items", payload: { barcode: "BC-DUP", description: "First", item_category: "GENERAL", declared_value_cents: 100, volume_cu_ft: 2 }, as: InventoryTechnician }
            - { call: "POST /api/pack-out-jobs", payload: { claim_number: "CLM-V8B", property_address: "82 Alder St", carrier_name: "Acme Mutual", policy_coverage_type: "RCV" }, as: ProjectManager, captures: { job_b: $.data.id } }
            - { call: "POST /api/pack-out-jobs/${job_b}/rooms", payload: { name: "Den", room_type: "LIVING" }, as: ProjectManager, captures: { room_b: $.data.id } }
          trigger:
            - { call: "POST /api/rooms/${room_a}/items", payload: { barcode: "BC-DUP", description: "Second same-job", item_category: "GENERAL", declared_value_cents: 200, volume_cu_ft: 2 }, as: InventoryTechnician, captures: { err: $.data.error_id } }
            - { call: "POST /api/rooms/${room_b}/items", payload: { barcode: "BC-DUP", description: "Other-job reuse", item_category: "GENERAL", declared_value_cents: 200, volume_cu_ft: 2 }, as: InventoryTechnician, captures: { ok_item: $.data.id } }
          assert:
            - "same-job duplicate: error_id == ERR_DUPLICATE_BARCODE (409)"
            - "different-job reuse succeeds (201) — uniqueness is per-job, not global"

      - name: job_close_with_nonterminal_items_rejected
        claim_type: precondition_enforcement
        grounds: ["validations[priority=7]", "errors[ERR_JOB_ITEMS_NOT_TERMINAL]", "state_machines.PackOutJob.transitions"]
        distinguishing_aspect: "Job CLOSE is vetoed while any item is non-terminal: one CLEANED item (not DELIVERED/DISPOSED/CLAIM_SETTLED) forces ERR_JOB_ITEMS_NOT_TERMINAL."
        test_recipe:
          setup: ["job with one item triaged SALVAGEABLE and cleaned to CLEANED (non-terminal)"]
          setup_api_calls:
            - { call: "POST /api/pack-out-jobs", payload: { claim_number: "CLM-V9", property_address: "100 Fir St", carrier_name: "Acme Mutual", policy_coverage_type: "ACV" }, as: ProjectManager, captures: { job: $.data.id } }
            - { call: "POST /api/pack-out-jobs/${job}/rooms", payload: { name: "Den", room_type: "LIVING" }, as: ProjectManager, captures: { room: $.data.id } }
