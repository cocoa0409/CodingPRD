            - call: "POST /entry-permits"
              payload: { vessel_id: "${vu}", ticket_id: "${t15b}", entrant_technician_id: "${tt10}", window_start: "2026-08-10T12:00:00Z", window_end: "2026-08-10T14:00:00Z" }
              as: SafetyOfficer
              captures: { p15: $.data.id }
          assert:
            - "Permit window 10:30-12:00 (gap 0.5 h < 2 h buffer) rejected with ERR_VESSEL_DOWNTIME_CONFLICT"
            - "Permit window 12:00-14:00 (gap exactly 2 h) accepted: status == DRAFT"
            - "The accepted permit ${p15} is the only permit for ticket ${t15b}"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: receive_then_void_restores_inventory_mass
        grounds:
          - calculations.current_inventory_tons
          - state_machines.ReplenishmentOrder.DISPATCHED_to_RECEIVED
          - state_machines.ReplenishmentOrder.RECEIVED_to_VOIDED
        distinguishing_aspect: |
          Conserved quantity is vessel MASS: current_inventory_tons ==
          anchor_inventory + sum(delivered_tons of RECEIVED orders after the
          anchor). Receive (+25.0 t) followed by its void returns the vessel to
          exactly the anchor value 25.0 t with zero drift.
        test_recipe:
          setup:
            - "Site S16. Vessel VV capacity 100 reorder 30 target 90 TARGET_FILL, opening_inventory_tons 0. Reading 25.0 at 2026-08-02 anchors inventory 25.0 and auto-creates an order (65.0 t), which is dispatched."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Site Sixteen", state_code: "TX" }
              as: ServiceManager
              captures: { s16: $.data.id }
            - call: "POST /vessels"
              payload: { site_id: "${s16}", name: "SILO-V", vessel_kind: "SILO", capacity_tons: 100, material_name: "cement", reorder_point_pct: 30, target_fill_pct: 90, opening_inventory_tons: 0 }
              as: ServiceManager
              captures: { vv: $.data.id }
            - call: "POST /level-readings"
              payload: { vessel_id: "${vv}", measured_at: "2026-08-02T00:00:00Z", level_pct: 25.0 }
              as: PlantOperator
              as_user_id: "${s16}"
            - call: "GET /replenishment-orders"
              payload: { vessel_id: "${vv}", status: "TRIGGERED" }
              as: ServiceManager
              captures: { o16: "$.data[0].id" }
            - call: "POST /replenishment-orders/${o16}/dispatch"
              payload: {}
              as: ServiceManager
          trigger:
            - call: "POST /replenishment-orders/${o16}/receive"
              payload: { delivered_tons: 25.0, received_at: "2026-08-03T00:00:00Z" }
              as: PlantOperator
              as_user_id: "${s16}"
            - call: "POST /replenishment-orders/${o16}/void"
              payload: {}
              as: ServiceManager
          assert:
            - "After receive: GET /vessels/${vv} current_inventory_tons == 50.0 (anchor 25.0 + 25.0; received_at 2026-08-03 > anchor measured_at 2026-08-02)"
            - "After void: GET /vessels/${vv} current_inventory_tons == 25.0 exactly (order left the RECEIVED set)"
            - "order ${o16} status == VOIDED"
            - "After void: vessel flow_posture == NORMAL and site site_posture == NORMAL (open-order set empty)"

      - name: schedule_then_complete_restores_technician_hours
        grounds:
          - calculations.technician_remaining_hours
          - state_machines.ServiceTicket.APPROVED_to_SCHEDULED
          - state_machines.ServiceTicket.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: |
          Conserved quantity is technician LABOR-HOURS (different from vessel
          mass above): remaining_capacity_hours == weekly_capacity_hours -
          sum(est_hours of SCHEDULED/IN_PROGRESS tickets). Scheduling (-8.0 h)
          then completing restores exactly 40.0 h with zero drift.
        test_recipe:
          setup:
            - "Site S17. Vessel VW. Technician TT11 weekly_capacity_hours 40. INSPECTION ticket est_hours 8 crew 1, APPROVED."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Site Seventeen", state_code: "TX" }
              as: ServiceManager
              captures: { s17: $.data.id }
            - call: "POST /vessels"
              payload: { site_id: "${s17}", name: "BIN-W", vessel_kind: "BIN", capacity_tons: 50, material_name: "salt", reorder_point_pct: 30 }
              as: ServiceManager
              captures: { vw: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Tech Eleven", weekly_capacity_hours: 40 }
              as: ServiceManager
              captures: { tt11: $.data.id }
            - call: "POST /service-tickets"
              payload: { site_id: "${s17}", vessel_id: "${vw}", job_type: "INSPECTION", requires_entry: false, est_hours: 8, crew_size: 1 }
              as: ServiceManager
              captures: { t17: $.data.id }
            - call: "POST /service-tickets/${t17}/quote"
              payload: {}
              as: ServiceManager
            - call: "POST /service-tickets/${t17}/approve"
              payload: {}
              as: PlantOperator
              as_user_id: "${s17}"
          trigger:
            - call: "POST /service-tickets/${t17}/schedule"
              payload: { technician_id: "${tt11}", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-10T16:00:00Z" }
              as: ServiceManager
            - call: "POST /service-tickets/${t17}/start"
              payload: {}
              as: Technician
              as_user_id: "${tt11}"
            - call: "POST /service-tickets/${t17}/complete"
              payload: { actual_hours: 8, mileage_miles: 0, disposal_tons: 0 }
              as: Technician
              as_user_id: "${tt11}"
          assert:
            - "Before schedule: GET /technicians/${tt11} remaining_capacity_hours == 40.0"
            - "After schedule (SCHEDULED): remaining_capacity_hours == 32.0 (40 - 8)"
            - "After start (IN_PROGRESS): remaining_capacity_hours == 32.0 (still allocated)"
            - "After complete (COMPLETED): remaining_capacity_hours == 40.0 exactly (released)"
