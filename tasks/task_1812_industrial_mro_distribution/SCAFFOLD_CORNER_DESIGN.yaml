      - name: credit_limit_exact_equality_allowed
        claim_type: satisfaction_pass
        grounds: ["validations[priority=11]", calculations.credit_exposure]
        distinguishing_aspect: "The fiscal gate rejects only when exposure + total is strictly greater than the limit: total exactly equal to credit_limit_cents confirms successfully."
        test_recipe:
          setup: ["Customer credit limit exactly 5,000; STOCKED item list 5,000 stocked 1; WILL_CALL order total exactly 5,000"]
          setup_api_calls:
            - call: "POST /mro/customers"
