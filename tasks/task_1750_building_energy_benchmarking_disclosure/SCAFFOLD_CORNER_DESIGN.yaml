          setup: ["verified fixture with 1200000 kWh (score 46, label D, completeness 90.00 via consents u1+u2)"]
          setup_api_calls:
            - { call: "POST /v1/owners", payload: { name: "Owner X5", contact_email: "ox5@x.com" }, as: ComplianceOfficer, as_user_id: "officer-1", captures: { o1: $.data.id } }
