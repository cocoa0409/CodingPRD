      - name: sm_screening_draft_to_in_progress_on_patch
        claim_type: valid_transition
        grounds: [state_machines.ScreeningSession.transitions.DRAFT_to_IN_PROGRESS, "endpoints.PATCH /screening-sessions/{id}"]
        distinguishing_aspect: "PATCH on a DRAFT screening must move it to IN_PROGRESS and store all five measurement fields, while the parent Patient sits in SCREENING_IN_PROGRESS from the create call and does not advance further."
        test_recipe:
          setup:
            - "POLICY_CA + Patient; a DRAFT screening created."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /state-policies", payload: { state_code: "CA", otc_sales_permitted: true, telehealth_fitting_permitted: true, min_age_years: 18, trial_period_days: 45, restocking_fee_mode: "FLAT_PCT", restocking_fee_pct: 0.1, restocking_fee_cap_cents: 0, shipping_refundable: false, referral_validity_days: 180, waiver_required: false, max_loss_damage_claims: 2 }, as: PlatformAdmin, captures: { pol_ca: "$.data.id" } }
            - { call: "POST /patients", payload: { state_policy_id: "${pol_ca}", email: "vt@x.test", full_name: "Vt One", age_years: 70 }, as: CareOpsAgent, captures: { pat_v: "$.data.id" } }
            - { call: "POST /patients/${pat_v}/screening-sessions", payload: {}, as: Patient, as_user_id: "${pat_v}", captures: { scr_v: "$.data.id" } }
          trigger:
            - { call: "PATCH /screening-sessions/${scr_v}", payload: { pure_tone_avg_db: 40.0, asymmetry_db: 5.0, self_reported_difficulty_score: 20, speech_in_noise_pct: 70.0, symptom_codes: [] }, as: Patient, as_user_id: "${pat_v}" }
          assert:
            - "HTTP 200"
            - "data.status == \"IN_PROGRESS\""
            - "data.pure_tone_avg_db == 40.0"
            - "data.asymmetry_db == 5.0"
            - "data.self_reported_difficulty_score == 20"
            - "data.speech_in_noise_pct == 70.0"
            - "data.screening_outcome == \"PENDING\""
            - "data.version == 2"
            - "GET /patients/${pat_v} returns data.status == \"SCREENING_IN_PROGRESS\""

      - name: sm_patient_red_flag_submit_runs_cascade_b_all_four_hops
        claim_type: cascade_down
        grounds: [state_machines.Patient.transitions.CANDIDATE_APPROVED_to_REFERRAL_REQUIRED, state_machines.DeviceOrder.fulfillment_status.transitions.PENDING_FIT_CONFIRM_to_MEDICAL_HOLD, state_machines.RemoteFittingSession.transitions.SCHEDULED_to_CANCELLED, calculations.provider_daily_capacity]
        distinguishing_aspect: "A retake screening scored RED_FLAG must run all four CASCADE-B hops inside the one submit request: referral opened, the PENDING_FIT_CONFIRM order held, its SCHEDULED session cancelled with a zero fee, and the provider's booked minutes rolled back to 0."
        test_recipe:
          setup:
            - "POLICY_CA + Patient with a PASS screening (CANDIDATE_APPROVED); an order in PENDING_FIT_CONFIRM; a 30-minute INITIAL_FIT session booked with a CA-licensed TELECARE_FITTER on 2026-08-10; then a retake screening measured with the SUDDEN_LOSS symptom."
