  - rule_id: compensating_invariant
    instances:
      - name: ledger_sum_restored_after_provisional_accrual_is_reversed
        grounds:
          - calculations.royalty_share_split
          - calculations.per_use_compensation
          - state_machines.GeneratedPerformance.SUBMITTED_to_REJECTED
          - entities.CompensationEntry
        distinguishing_aspect: >-
          Conserved quantity is MONEY: sum(CompensationEntry.amount_cents) over the grant must equal
          ConsentGrant.total_compensation_cents and Talent.lifetime_compensation_cents at every
          instant, and each of the three share columns must reconcile independently. The ledger is
          append-only (CompensationEntry has common_fields false), so the undo is a negation row, not
          an edit — after submit-then-reject the totals are byte-for-byte back at 300000 while the
          ledger has grown by two rows.
        test_recipe:
          setup:
            - "CA law profile and the SAG_AFTRA/ADVERTISING union row exist"
            - "Talent with an ACTIVE grant (INITIAL_CREATION 300000 already booked) and one APPROVED_FOR_USE replica"
            - "No performances yet"
