        distinguishing_aspect: |
          Metric: classifier confidence against the two per-rule thresholds, probed on
          POST /ad-policy/ad-creatives/{ad_creative_id}/screening-runs. Both thresholds are
          inclusive lower bounds, so 0.90 auto-disapproves while 0.89 only routes to manual
          review, and 0.55 routes to manual review while 0.54 falls below and lets the run
          auto-approve. One hundredth of a point flips the run outcome, the creative's
          review_status, whether a DisapprovalNotice exists at all, and the per-row
          assessed_points audit value (10.80 vs 10.68, 4.95-worth of findings vs none).
