      - name: resolve_denies_refund_when_purchaser_blocked
        grounds:
          - state_machines.ReturnCase.FIT_REVIEW_to_RESOLVED_DENIED
          - calculations.customer_abuse_and_policy_class
          - calculations.return_refund_and_restocking_fee
          - calculations.return_case_cost_postings
          - entities.CustomerProfile.fields.abuse_status
        distinguishing_aspect: |
          A different entity pair, CustomerProfile -> ReturnCase: resolving a FIT_REVIEW case whose
          purchaser is BLOCKED lands in RESOLVED_DENIED with refund_amount_cents 0, writes only the
          two unavoidable cost components (795 + 558 = 1353) and leaves the OrderLine KEPT instead
          of RETURNED.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "One LISTED TOPS item priced 2295 cents and a TOPS category-default policy with window_days 30, restocking_applies true, non_refundable_shipping false, effective from 2026-01-01."
            - "One shopper with four delivered lines of 1 unit each, all delivered 2026-05-20."
            - "Open cases on lines 1, 2 and 3 push return_case_count to 3 over purchase_line_count 4, i.e. return_rate_bp 7500 with 4 lines, so abuse_status is BLOCKED."
            - "The line-1 case is classified FIT_TOO_SMALL into FIT_REVIEW by auditor-1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
