scaffold_corner_design:

  # ===================================================================
  # Entities — creation, required fields, defaults, computed/system, not-found
  # ===================================================================
  - section: entities
    instances:
      - name: create_shop_mints_drawer_and_defaults
        claim_type: Creation
        grounds:
          - entities.PawnShop.fields.cash_drawer_id
          - entities.PawnShop.fields.police_reporting_enabled
          - entities.CashDrawer.fields.balance_cents
        distinguishing_aspect: "POST /pawn/shops returns 201 with police_reporting_enabled defaulting true and a CashDrawer (balance 0) reachable via GET /pawn/shops/{id}/drawer."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls:
            - call: "POST /pawn/shops"
              payload: { name: "Default Shop", state_code: "TX" }
              as: ShopManager
              captures: { shop_id: $.data.id, pre: $.data.police_reporting_enabled }
          trigger:
            - call: "GET /pawn/shops/${shop_id}/drawer"
              payload: {}
              as: ShopManager
              captures: { bal: "$.data[0].balance_cents" }
          assert:
            - "PawnShop.${shop_id}.police_reporting_enabled == true"
            - "GET /pawn/shops/{id}/drawer returns exactly one CashDrawer with balance_cents == 0"

      - name: create_loan_missing_storage_bin_id_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - endpoints
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /pawn/loans without storage_bin_id (a required input) returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup:
            - "An APPRAISED item ready to pledge, but the origination omits storage_bin_id."
          setup_api_calls:
            - call: "POST /pawn/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: ShopManager
            - call: "POST /pawn/state-schedules"
              payload: { state_code: "FL", monthly_interest_bps: 1000, monthly_storage_fee_cents: 500, setup_fee_cents: 200, term_days: 30, grace_days: 30, max_principal_cents: 5000000, max_periods_total: 4, loan_to_value_bps: 5000, layaway_buffer_days: 7 }
              as: ShopManager
            - call: "POST /pawn/shops"
              payload: { name: "FL Branch", state_code: "FL", police_reporting_enabled: false }
              as: ShopManager
              captures: { shop_id: $.data.id }
            - call: "POST /pawn/customers"
              payload: { full_name: "V Borrower", gov_id_number: "ID-V1" }
              as: LoanOfficer
              captures: { cust_id: $.data.id }
            - call: "POST /pawn/items"
              payload: { shop_id: "${shop_id}", customer_id: "${cust_id}", description: "Ring" }
              as: LoanOfficer
              captures: { item_id: $.data.id }
            - call: "POST /pawn/items/${item_id}/appraise"
              payload: { appraised_value_cents: 40000 }
              as: Appraiser
              as_user_id: "appraiser-1"
          trigger:
            - call: "POST /pawn/loans"
              payload: { shop_id: "${shop_id}", pawn_item_id: "${item_id}" }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "error_id == ERR_INVALID_REQUEST"

      - name: appraise_sets_appraised_by_user_id_system_field
        claim_type: System Fields
        grounds:
          - entities.PawnItem.fields.appraised_by_user_id
          - state_machines.PawnItem.INTAKE_to_APPRAISED
        distinguishing_aspect: "appraise stamps appraised_by_user_id from X-User-ID (system-sourced, not from the body) and moves the item to APPRAISED."
        test_recipe:
          setup:
            - "An INTAKE item."
          setup_api_calls:
            - call: "POST /pawn/shops"
              payload: { name: "FL Branch", state_code: "FL", police_reporting_enabled: false }
              as: ShopManager
              captures: { shop_id: $.data.id }
            - call: "POST /pawn/customers"
              payload: { full_name: "W Borrower", gov_id_number: "ID-W1" }
              as: LoanOfficer
              captures: { cust_id: $.data.id }
            - call: "POST /pawn/items"
              payload: { shop_id: "${shop_id}", customer_id: "${cust_id}", description: "Ring" }
              as: LoanOfficer
              captures: { item_id: $.data.id }
          trigger:
            - call: "POST /pawn/items/${item_id}/appraise"
              payload: { appraised_value_cents: 12345 }
              as: Appraiser
              as_user_id: "appraiser-77"
              captures: { st: $.data.status, ab: $.data.appraised_by_user_id, av: $.data.appraised_value_cents }
          assert:
            - "PawnItem.${item_id}.status == APPRAISED"
            - "PawnItem.${item_id}.appraised_value_cents == 12345"
            - "PawnItem.${item_id}.appraised_by_user_id == appraiser-77"

      - name: get_loan_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - validations[priority=3]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /pawn/loans/{id} with a random UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /pawn/loans/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: LoanOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "error_id == ERR_NOT_FOUND"

      - name: duplicate_gov_id_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Customer.fields.gov_id_number
          - errors[ERR_DUPLICATE_GOV_ID]
        distinguishing_aspect: "A second customer with the same gov_id_number returns ERR_DUPLICATE_GOV_ID (409)."
        test_recipe:
          setup:
            - "One customer already registered with gov_id_number ID-DUP."
          setup_api_calls:
            - call: "POST /pawn/customers"
              payload: { full_name: "First", gov_id_number: "ID-DUP" }
              as: LoanOfficer
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /pawn/customers"
              payload: { full_name: "Second", gov_id_number: "ID-DUP" }
              as: LoanOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_DUPLICATE_GOV_ID"

      - name: duplicate_state_schedule_rejected
        claim_type: Type Constraints
        grounds:
          - entities.StateRateSchedule.fields.state_code
          - errors[ERR_DUPLICATE_SCHEDULE]
        distinguishing_aspect: "A second StateRateSchedule for an already-configured state_code returns ERR_DUPLICATE_SCHEDULE (409)."
        test_recipe:
          setup:
            - "A CA schedule already exists."
          setup_api_calls:
            - call: "POST /pawn/state-schedules"
              payload: { state_code: "CA", monthly_interest_bps: 250, monthly_storage_fee_cents: 0, setup_fee_cents: 0, term_days: 120, grace_days: 10, max_principal_cents: 250000, max_periods_total: 1, loan_to_value_bps: 5000, layaway_buffer_days: 3 }
              as: ShopManager
          trigger:
            - call: "POST /pawn/state-schedules"
              payload: { state_code: "CA", monthly_interest_bps: 300, monthly_storage_fee_cents: 0, setup_fee_cents: 0, term_days: 120, grace_days: 10, max_principal_cents: 250000, max_periods_total: 1, loan_to_value_bps: 5000, layaway_buffer_days: 3 }
              as: ShopManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_DUPLICATE_SCHEDULE"

      - name: loan_amount_capped_to_state_max_principal
        claim_type: Computed Fields
        grounds:
          - calculations.loan_amount_from_appraisal
          - entities.Loan.fields.principal_cents
          - entities.StateRateSchedule.fields.max_principal_cents
        distinguishing_aspect: "CA cap: appraised 600000 -> floor(0.5)=300000 -> clamped to max_principal_cents 250000; principal_cents == 250000."
        test_recipe:
          setup:
            - "CA schedule (max_principal 250000, ltv 5000); item appraised at 600000."
          setup_api_calls:
            - call: "POST /pawn/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: ShopManager
            - call: "POST /pawn/state-schedules"
              payload: { state_code: "CA", monthly_interest_bps: 250, monthly_storage_fee_cents: 0, setup_fee_cents: 0, term_days: 120, grace_days: 10, max_principal_cents: 250000, max_periods_total: 1, loan_to_value_bps: 5000, layaway_buffer_days: 3 }
              as: ShopManager
            - call: "POST /pawn/shops"
              payload: { name: "CA Branch", state_code: "CA", police_reporting_enabled: false }
              as: ShopManager
              captures: { shop_id: $.data.id }
            - call: "POST /pawn/storage-bins"
              payload: { shop_id: "${shop_id}", label: "C-1", capacity: 5 }
              as: ShopManager
              captures: { bin_id: $.data.id }
            - call: "POST /pawn/customers"
              payload: { full_name: "Cal Borrower", gov_id_number: "ID-CA1" }
              as: LoanOfficer
              captures: { cust_id: $.data.id }
            - call: "POST /pawn/items"
              payload: { shop_id: "${shop_id}", customer_id: "${cust_id}", description: "Rolex" }
              as: LoanOfficer
              captures: { item_id: $.data.id }
            - call: "POST /pawn/items/${item_id}/appraise"
              payload: { appraised_value_cents: 600000 }
              as: Appraiser
              as_user_id: "appraiser-1"
          trigger:
            - call: "POST /pawn/loans"
              payload: { shop_id: "${shop_id}", pawn_item_id: "${item_id}", storage_bin_id: "${bin_id}" }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { loan_id: $.data.id, princ: $.data.principal_cents }
          assert:
            - "the originated Loan.principal_cents == 250000 (LTV 300000 clamped to cap 250000)"

  # ===================================================================
  # State machines — invalid transitions, terminal lockdown, initial state
  # ===================================================================
  - section: state_machines
    instances:
      - name: redeem_from_redeemed_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Loan.ACTIVE_to_REDEEMED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A second redeem on an already-REDEEMED loan (terminal) returns ERR_INVALID_STATE (409); no side effects."
        test_recipe:
          setup:
            - "FL loan redeemed once at day 30 (terminal REDEEMED)."
          setup_api_calls:
            - call: "POST /pawn/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: ShopManager
            - call: "POST /pawn/state-schedules"
              payload: { state_code: "FL", monthly_interest_bps: 1000, monthly_storage_fee_cents: 500, setup_fee_cents: 200, term_days: 30, grace_days: 30, max_principal_cents: 5000000, max_periods_total: 4, loan_to_value_bps: 5000, layaway_buffer_days: 7 }
              as: ShopManager
            - call: "POST /pawn/shops"
              payload: { name: "FL Branch", state_code: "FL", police_reporting_enabled: false }
              as: ShopManager
              captures: { shop_id: $.data.id }
            - call: "POST /pawn/storage-bins"
              payload: { shop_id: "${shop_id}", label: "A-1", capacity: 5 }
              as: ShopManager
              captures: { bin_id: $.data.id }
            - call: "POST /pawn/customers"
              payload: { full_name: "X Borrower", gov_id_number: "ID-X1" }
              as: LoanOfficer
              captures: { cust_id: $.data.id }
            - call: "POST /pawn/items"
              payload: { shop_id: "${shop_id}", customer_id: "${cust_id}", description: "Ring" }
              as: LoanOfficer
              captures: { item_id: $.data.id }
            - call: "POST /pawn/items/${item_id}/appraise"
              payload: { appraised_value_cents: 40000 }
              as: Appraiser
              as_user_id: "appraiser-1"
            - call: "POST /pawn/loans"
              payload: { shop_id: "${shop_id}", pawn_item_id: "${item_id}", storage_bin_id: "${bin_id}" }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { loan_id: $.data.id }
            - call: "POST /pawn/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-31T00:00:00.000Z" }
              as: ShopManager
            - call: "POST /pawn/loans/${loan_id}/redeem"
              payload: {}
              as: LoanOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /pawn/loans/${loan_id}/redeem"
              payload: {}
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_INVALID_STATE"

      - name: forfeit_before_grace_returns_grace_not_elapsed
        claim_type: precondition_violation
        grounds:
          - state_machines.Loan.IN_GRACE_to_FORFEITED
          - validations[priority=10]
          - errors[ERR_GRACE_NOT_ELAPSED]
        distinguishing_aspect: "forfeit at day 45 (term passed -> IN_GRACE, but before grace_end day 60) returns ERR_GRACE_NOT_ELAPSED (409)."
        test_recipe:
          setup:
            - "FL loan IN_GRACE at 2026-02-15 (day 45); grace_end is day 60 (2026-03-02)."
          setup_api_calls:
            - call: "POST /pawn/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: ShopManager
            - call: "POST /pawn/state-schedules"
              payload: { state_code: "FL", monthly_interest_bps: 1000, monthly_storage_fee_cents: 500, setup_fee_cents: 200, term_days: 30, grace_days: 30, max_principal_cents: 5000000, max_periods_total: 4, loan_to_value_bps: 5000, layaway_buffer_days: 7 }
              as: ShopManager
            - call: "POST /pawn/shops"
              payload: { name: "FL Branch", state_code: "FL", police_reporting_enabled: false }
              as: ShopManager
              captures: { shop_id: $.data.id }
            - call: "POST /pawn/storage-bins"
              payload: { shop_id: "${shop_id}", label: "A-1", capacity: 5 }
              as: ShopManager
              captures: { bin_id: $.data.id }
            - call: "POST /pawn/customers"
              payload: { full_name: "Y Borrower", gov_id_number: "ID-Y1" }
              as: LoanOfficer
              captures: { cust_id: $.data.id }
            - call: "POST /pawn/items"
              payload: { shop_id: "${shop_id}", customer_id: "${cust_id}", description: "Ring" }
              as: LoanOfficer
              captures: { item_id: $.data.id }
            - call: "POST /pawn/items/${item_id}/appraise"
              payload: { appraised_value_cents: 40000 }
              as: Appraiser
              as_user_id: "appraiser-1"
            - call: "POST /pawn/loans"
              payload: { shop_id: "${shop_id}", pawn_item_id: "${item_id}", storage_bin_id: "${bin_id}" }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { loan_id: $.data.id }
            - call: "POST /pawn/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-15T00:00:00.000Z" }
              as: ShopManager
          trigger:
            - call: "POST /pawn/loans/${loan_id}/forfeit"
              payload: {}
              as: ShopManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_GRACE_NOT_ELAPSED"

      - name: void_after_extension_returns_already_serviced
        claim_type: precondition_violation
        grounds:
          - state_machines.Loan.ACTIVE_to_VOIDED
          - validations[priority=12]
          - errors[ERR_LOAN_ALREADY_SERVICED]
        distinguishing_aspect: "void after an EXTENSION_FEE transaction exists returns ERR_LOAN_ALREADY_SERVICED (409)."
        test_recipe:
          setup:
            - "FL loan extended once (EXTENSION_FEE recorded), still ACTIVE."
          setup_api_calls:
            - call: "POST /pawn/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: ShopManager
            - call: "POST /pawn/state-schedules"
              payload: { state_code: "FL", monthly_interest_bps: 1000, monthly_storage_fee_cents: 500, setup_fee_cents: 200, term_days: 30, grace_days: 30, max_principal_cents: 5000000, max_periods_total: 4, loan_to_value_bps: 5000, layaway_buffer_days: 7 }
              as: ShopManager
            - call: "POST /pawn/shops"
              payload: { name: "FL Branch", state_code: "FL", police_reporting_enabled: false }
              as: ShopManager
              captures: { shop_id: $.data.id }
            - call: "POST /pawn/storage-bins"
              payload: { shop_id: "${shop_id}", label: "A-1", capacity: 5 }
              as: ShopManager
              captures: { bin_id: $.data.id }
            - call: "POST /pawn/customers"
              payload: { full_name: "Z Borrower", gov_id_number: "ID-Z1" }
              as: LoanOfficer
              captures: { cust_id: $.data.id }
            - call: "POST /pawn/items"
              payload: { shop_id: "${shop_id}", customer_id: "${cust_id}", description: "Ring" }
              as: LoanOfficer
              captures: { item_id: $.data.id }
            - call: "POST /pawn/items/${item_id}/appraise"
              payload: { appraised_value_cents: 40000 }
              as: Appraiser
              as_user_id: "appraiser-1"
            - call: "POST /pawn/loans"
              payload: { shop_id: "${shop_id}", pawn_item_id: "${item_id}", storage_bin_id: "${bin_id}" }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { loan_id: $.data.id, v1: $.data.version }
            - call: "POST /pawn/loans/${loan_id}/extend"
              payload: { expected_loan_version: "${v1}" }
              as: LoanOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /pawn/loans/${loan_id}/void"
              payload: {}
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_LOAN_ALREADY_SERVICED"

      - name: extend_past_period_cap_returns_cap_exceeded
        claim_type: precondition_violation
        grounds:
          - state_machines.Loan.ACTIVE_to_ACTIVE
          - validations[priority=11]
          - errors[ERR_PERIOD_CAP_EXCEEDED]
        distinguishing_aspect: "On a CA loan (max_periods_total 1), a first extend succeeds (periods_charged 0->1) and a second extend returns ERR_PERIOD_CAP_EXCEEDED (409)."
        test_recipe:
          setup:
            - "CA loan principal 250000, version tracked; one extension already applied (periods_charged 1, cap 1)."
          setup_api_calls:
            - call: "POST /pawn/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: ShopManager
            - call: "POST /pawn/state-schedules"
              payload: { state_code: "CA", monthly_interest_bps: 250, monthly_storage_fee_cents: 0, setup_fee_cents: 0, term_days: 120, grace_days: 10, max_principal_cents: 250000, max_periods_total: 1, loan_to_value_bps: 5000, layaway_buffer_days: 3 }
              as: ShopManager
            - call: "POST /pawn/shops"
              payload: { name: "CA Branch", state_code: "CA", police_reporting_enabled: false }
              as: ShopManager
              captures: { shop_id: $.data.id }
            - call: "POST /pawn/storage-bins"
              payload: { shop_id: "${shop_id}", label: "C-1", capacity: 5 }
              as: ShopManager
              captures: { bin_id: $.data.id }
            - call: "POST /pawn/customers"
              payload: { full_name: "Cap Borrower", gov_id_number: "ID-CAP" }
              as: LoanOfficer
              captures: { cust_id: $.data.id }
            - call: "POST /pawn/items"
              payload: { shop_id: "${shop_id}", customer_id: "${cust_id}", description: "Rolex" }
              as: LoanOfficer
              captures: { item_id: $.data.id }
            - call: "POST /pawn/items/${item_id}/appraise"
              payload: { appraised_value_cents: 600000 }
              as: Appraiser
              as_user_id: "appraiser-1"
            - call: "POST /pawn/loans"
              payload: { shop_id: "${shop_id}", pawn_item_id: "${item_id}", storage_bin_id: "${bin_id}" }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { loan_id: $.data.id, v1: $.data.version }
            - call: "POST /pawn/loans/${loan_id}/extend"
              payload: { expected_loan_version: "${v1}" }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { v2: $.data.version }
          trigger:
            - call: "POST /pawn/loans/${loan_id}/extend"
              payload: { expected_loan_version: "${v2}" }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_PERIOD_CAP_EXCEEDED"

      - name: initial_loan_state_is_active
        claim_type: initial_state
        grounds:
          - state_machines.Loan.initial_state
          - entities.Loan.fields.status
        distinguishing_aspect: "A freshly originated loan has status ACTIVE, version 1, periods_charged 0, renewal_count 0."
        test_recipe:
          setup:
            - "FL appraised item ready to pledge at 2026-01-01."
          setup_api_calls:
            - call: "POST /pawn/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: ShopManager
            - call: "POST /pawn/state-schedules"
              payload: { state_code: "FL", monthly_interest_bps: 1000, monthly_storage_fee_cents: 500, setup_fee_cents: 200, term_days: 30, grace_days: 30, max_principal_cents: 5000000, max_periods_total: 4, loan_to_value_bps: 5000, layaway_buffer_days: 7 }
              as: ShopManager
            - call: "POST /pawn/shops"
              payload: { name: "FL Branch", state_code: "FL", police_reporting_enabled: false }
              as: ShopManager
              captures: { shop_id: $.data.id }
            - call: "POST /pawn/storage-bins"
              payload: { shop_id: "${shop_id}", label: "A-1", capacity: 5 }
              as: ShopManager
              captures: { bin_id: $.data.id }
            - call: "POST /pawn/customers"
              payload: { full_name: "Init Borrower", gov_id_number: "ID-INI" }
              as: LoanOfficer
              captures: { cust_id: $.data.id }
            - call: "POST /pawn/items"
              payload: { shop_id: "${shop_id}", customer_id: "${cust_id}", description: "Ring" }
              as: LoanOfficer
              captures: { item_id: $.data.id }
            - call: "POST /pawn/items/${item_id}/appraise"
              payload: { appraised_value_cents: 40000 }
              as: Appraiser
              as_user_id: "appraiser-1"
          trigger:
            - call: "POST /pawn/loans"
              payload: { shop_id: "${shop_id}", pawn_item_id: "${item_id}", storage_bin_id: "${bin_id}" }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { st: $.data.status, ver: $.data.version, pc: $.data.periods_charged, rc: $.data.renewal_count }
          assert:
            - "Loan.status == ACTIVE"
            - "Loan.version == 1"
            - "Loan.periods_charged == 0 and Loan.renewal_count == 0"

      - name: renewal_resets_baseline_and_increments_count
        claim_type: valid_transition
        grounds:
          - state_machines.Loan.IN_GRACE_to_ACTIVE
          - calculations.redemption_payoff.variants.renewal_fee
