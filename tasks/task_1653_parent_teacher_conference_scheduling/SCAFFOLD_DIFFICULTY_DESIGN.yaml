            - { call: "POST /conf/windows/${w}/generate-slots", payload: { expected_window_version: "${w_v2}" }, as: SchoolAdmin }
            - { call: "GET /conf/windows/${w}/slots", as: SchoolAdmin, captures: { s0: "$.data[0].id" } }
            - { call: "POST /conf/windows/${w}/open-booking", payload: {}, as: SchoolAdmin }
            - { call: "POST /conf/interpreters", payload: { full_name: "I One", languages: ["es"], max_consecutive_minutes: 120, base_minutes_per_window: 600, hourly_rate_cents: 6000 }, as: SchoolAdmin, captures: { interp: $.data.id } }
            - { call: "PATCH /conf/interpreters/${interp}", payload: { status: "INACTIVE" }, as: SchoolAdmin }
            - { call: "POST /conf/families", payload: { primary_guardian_name: "G1", email: "f1@x.com", preferred_language: "es" }, as: FrontOfficeStaff, captures: { f1: $.data.id } }
            - { call: "POST /conf/families/${f1}/students", payload: { full_name: "A", grade_level: 3 }, as: FrontOfficeStaff, captures: { stA: $.data.id } }
            - { call: "POST /conf/students/${stA}/teacher-links", payload: { teacher_id: "${t1}", is_homeroom: true }, as: FrontOfficeStaff }
            - { call: "POST /conf/bookings", payload: { slot_id: "${s0}", student_id: "${stA}", channel: "IN_PERSON", interpreter_language: "es" }, as: FamilyGuardian, as_user_id: "${f1}", captures: { bk: $.data.id } }
            - { call: "GET /conf/interpreter-requests", payload: { booking_id: "${bk}" }, as: FrontOfficeStaff, captures: { r: "$.data[0].id" } }
          trigger:
            - { call: "POST /conf/interpreter-requests/${r}/assign", payload: { interpreter_id: "${interp}" }, as: FrontOfficeStaff, captures: { err: $.data.error_id } }
            - { call: "PATCH /conf/interpreters/${interp}", payload: { status: "ACTIVE" }, as: SchoolAdmin }
            - { call: "POST /conf/interpreter-requests/${r}/assign", payload: { interpreter_id: "${interp}" }, as: FrontOfficeStaff, captures: { r_status: $.data.status, r_interp: $.data.interpreter_id } }
          assert:
            - "assign while interpreter INACTIVE rejected with error_id == ERR_INVALID_STATE"
            - "after reactivation the identical assign succeeds: status ASSIGNED, interpreter_id == ${interp}"

  - rule_id: resource_temporal_overlap
    instances:
      - name: interpreter_half_open_adjacency_allowed_overlap_rejected
        grounds:
          - calculations.interpreter_fatigue_run
          - validations[priority=10]
          - errors[ERR_INTERPRETER_OVERLAP]
        distinguishing_aspect: |
          Interval semantics half-open [start, end) on the Interpreter resource: two
          assignments where one starts exactly when the other ends (15:00-15:20 and
          15:20-15:40) do NOT overlap and both assign; an identical-interval third
          assignment (15:00-15:20 again) DOES overlap and is rejected.
        test_recipe:
          setup:
            - "SECONDARY window Z, buffer 0, day 15:00-16:20 (4 adjacent slots per teacher), BOOKING_OPEN"
            - "Teachers TA, TB; interpreter I (base 200, max_consecutive 120, es)"
            - "F1 sA booked TA slot 0 es -> r1; F2 sB1 booked TB slot 1 es -> r2; F2 sB2 booked TB slot 0 es -> r3"
            - "r1 ASSIGNED to I"
          setup_api_calls:
            - { call: "POST /conf/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: SchoolAdmin }
            - call: "POST /conf/windows"
              payload: { name: "ZeroBuf", term_label: "2026-FALL", format: "SECONDARY", slot_length_minutes: 20, buffer_minutes: 0, travel_minutes: 30, day_windows: [{ date: "2026-10-05", start_at: "2026-10-05T15:00:00Z", end_at: "2026-10-05T16:20:00Z" }], booking_open_at: "2026-09-01T00:00:00Z", booking_close_at: "2026-10-01T00:00:00Z", teacher_daily_conf_cap: 6, family_conf_cap: 8, cancel_cutoff_hours: 24, waitlist_offer_ttl_hours: 24, no_show_strike_threshold: 3, auto_no_show_grace_hours: 24 }
