scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # Required: >= 2 instances on different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: claim_base_period_standard_vs_alternate
        grounds:
          - calculations.base_period_wage_calculation
          - entities.Claim.fields.base_period_variant
          - entities.Claim.fields.base_period_total_wages_cents
        distinguishing_aspect: |
          Operates on the Claim/WageRecord entity domain. For a claimant whose
          wages are concentrated in the lag quarter, STANDARD base period
          (quarters t-5..t-2, drops lag) yields total_wages BELOW the
          MIN_BASE_PERIOD_WAGES_CENTS floor, while ALTERNATE (quarters
          t-4..t-1, includes lag) yields total_wages ABOVE the floor — same
          claimant, two valid base-period algorithms, different
          monetary-eligibility outcome and different base_period_variant.
        test_recipe:
          setup:
            - "Set SystemClock.now = 2026-04-15T10:00:00Z so filing_quarter = (2026, 2); STANDARD = 2024-Q4..2025-Q3, ALTERNATE = 2025-Q1..2025-Q4."
            - "Create Claimant C1 and Employer E1."
            - "POST one WageRecord(C1,E1,2024,Q4,wages_cents=0)."
            - "POST one WageRecord(C1,E1,2025,Q1,wages_cents=0)."
            - "POST one WageRecord(C1,E1,2025,Q2,wages_cents=0)."
            - "POST one WageRecord(C1,E1,2025,Q3,wages_cents=100000)  # $1000 (below $1500 floor)."
            - "POST one WageRecord(C1,E1,2025,Q4,wages_cents=400000)  # $4000 (lag quarter only counted by ALTERNATE)."
            - "POST /claimants/{C1}/claims -> Claim K1 (DRAFT)."
          trigger:
            - "POST /claims/{K1}/submit"
          assert:
            - "Claim.base_period_variant == 'ALTERNATE'"
            - "Claim.base_period_total_wages_cents == 500000  # 100000 + 400000 from STANDARD would be only 100000 — fails floor; ALTERNATE picks 100000+400000+0+0 = 500000"
            - "Claim.high_quarter_wages_cents == 400000"

      - name: employer_rate_charge_active_vs_relieved
        grounds:
          - calculations.employer_experience_rate
          - calculations.employer_experience_rate.variants
          - state_machines.EmployerCharge_status_active_to_relieved
          - entities.Employer.fields.experience_rate_bps
        distinguishing_aspect: |
          Operates on the Employer entity domain (different from Claim above).
          The same EmployerCharge row produces two different
          experience_rate_bps values depending on whether it is counted as
          ACTIVE (added to net_charges, reducing reserve, raising rate) or
          RELIEVED (subtracted back out, restoring reserve, lowering rate).
          Same inputs, two algorithmic interpretations of the charge ledger,
          different result on Employer.experience_rate_bps.
        test_recipe:
          setup:
            - "POST /employers with reserve_ratio_basis_cents=1000000 ($10000) and taxable_payroll_cents=10000000 ($100000) -> Employer E1."
            - "Assert E1.experience_rate_bps == 100  # ratio=0.10 hits floor tier"
            - "Set up a fully approved WeeklyCertification whose employer_charge_allocation produces exactly one ACTIVE EmployerCharge of charge_cents=300000 ($3000) against E1."
          trigger:
            - "GET /employers/{E1} -> read experience_rate_bps with charge ACTIVE"
            - "POST /employers/{E1}/charges/{charge_id}/relieve"
            - "GET /employers/{E1} -> read experience_rate_bps with charge RELIEVED"
          assert:
            - "Before relief: E1.experience_rate_bps == 180  # net=300000, adjusted_reserve=700000, ratio=0.07 -> tier 180"
            - "After relief:  E1.experience_rate_bps == 100  # net=0,      adjusted_reserve=1000000, ratio=0.10 -> tier 100"
            - "Same EmployerCharge row, two valid charge_active/charge_relieved variants, different experience_rate_bps"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes (a/b/c)
  # Required: >= 2 instances in DIFFERENT modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: weekly_payable_amount_mode_a_nested_min_max
        grounds:
          - calculations.weekly_payable_amount
          - calculations.weekly_benefit_amount
          - entities.WeeklyCertification.fields.payable_amount_cents
        distinguishing_aspect: |
          Mode (a): non-linear interaction of >=3 inputs. payable_amount
          requires nesting two max() operations around a floored disregard:
          disregard=floor(WBA*25/100); offset=max(0, earnings-disregard);
          payable=max(0, WBA-offset). The combination of three inputs
          (WBA, earnings_reported, EARNINGS_DISREGARD_PCT) with nested
          max/floor produces non-linear breakpoints at earnings=disregard
          and at earnings=disregard+WBA. (Mode a — combinatorial formula
          on payment calculation.)
        test_recipe:
          setup:
            - "Create a Claim K1 already in MONETARILY_ELIGIBLE with weekly_benefit_amount_cents=30000 (high_quarter=780000)."
            - "Create a Claimant Cl with 3 WorkSearchEntry rows attached to upcoming cert."
          trigger:
            - "POST /claims/{K1}/weekly-certifications {week_ending_date='<a Saturday>', earnings_reported_cents=10000, able_and_available=true, work_search_entries=[3 entries]}"
          assert:
            - "WeeklyCertification.payable_amount_cents == 27500  # disregard=floor(30000*25/100)=7500; offset=max(0,10000-7500)=2500; payable=max(0,30000-2500)=27500"
            - "BenefitPayment.amount_cents == 27500"

      - name: employer_charge_allocation_mode_b_rounding_order
        grounds:
          - calculations.employer_charge_allocation
          - entities.EmployerCharge.fields.charge_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. The scaffold PINS
          the rounding order — round each employer's raw share first
          (round_half_up), then reconcile residual cents in descending
          wage order with tie-break by Employer.id ASC. The alternative
          interpretation ("sum then round, then prorate") would produce
          different per-employer cents. The scaffold's pinned order
          guarantees sum(EmployerCharge.charge_cents) == BenefitPayment.amount_cents.
        test_recipe:
          setup:
            - "Create Employers E_A and E_B with E_A.id < E_B.id (lexically)."
            - "Create Claimant Cl with WageRecord(Cl,E_A,...,wages=1000000) and WageRecord(Cl,E_B,...,wages=1000000) in chosen base period; total=2000000."
            - "Bring Claim K1 to a state where the next APPROVED cert produces BenefitPayment.amount_cents=10001 (odd-cent payment via earnings reduction)."
          trigger:
            - "POST /claims/{K1}/weekly-certifications producing an APPROVED cert with payable_amount_cents=10001"
          assert:
            - "raw_each = 10001 * 0.5 = 5000.5; round_half_up each -> 5001 each; sum=10002; residual = -1"
            - "Tie on wages_cents=1000000 -> tie-break by Employer.id ASC: subtract 1 from E_A"
            - "EmployerCharge(employer=E_A).charge_cents == 5000"
            - "EmployerCharge(employer=E_B).charge_cents == 5001"
            - "sum(EmployerCharge.charge_cents) == 10001 == BenefitPayment.amount_cents (conservation)"

      - name: max_weeks_eligibility_mode_a_tiered_with_caps
        grounds:
          - calculations.max_weeks_of_eligibility
          - calculations.weekly_benefit_amount
          - entities.Claim.fields.max_weeks_of_eligibility
        distinguishing_aspect: |
          Mode (a): three inputs (base_period_total_wages, weekly_benefit_amount,
          WEEKS_DENOMINATOR_FACTOR) interact non-linearly with both a floor and
          a ceiling clamp (MIN/MAX_REGULAR_WEEKS). The result depends on which
          clamp (min, raw, or max) wins for the specific (total, WBA) combination
          — a different non-linear mode-(a) shape than the nested max/floor of
          weekly_payable_amount above.
        test_recipe:
          setup:
            - "Stage WageRecords so Claim has base_period_total_wages_cents=520000 ($5200) and high_quarter_wages_cents=260000 ($2600)."
          trigger:
            - "POST /claims/{K1}/submit"
          assert:
            - "weekly_benefit_amount_cents == floor(260000/26) == 10000 ($100)"
            - "potential_weeks = floor(520000 / (10000 * 3)) = floor(17.333) = 17"
            - "max_weeks_of_eligibility == 17  # raw value wins; neither floor 13 nor ceiling 26 active"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # Required: >= 2 instances on DIFFERENT entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: claim_exhausted_cycle_via_audit_revert
        grounds:
          - state_machines.Claim
          - state_machines.WeeklyCertification.APPROVED_to_OVERPAID
        distinguishing_aspect: |
          CYCLE on Claim entity: ACTIVE -> EXHAUSTED -> ACTIVE.
          When a Claim reaches EXHAUSTED (weeks_paid == max_weeks_of_eligibility)
          and an Adjudicator later audits one APPROVED certification to OVERPAID,
          weeks_paid decrements and the Claim transitions back from EXHAUSTED to
          ACTIVE (a true revert cycle, not a linear pipeline).
        test_recipe:
          setup:
            - "Create Claim K1 with max_weeks_of_eligibility=2 (manufactured via small base-period wages)."
            - "Submit and approve 2 weekly certifications WC1 (week_ending=2026-04-04), WC2 (week_ending=2026-04-11)."
            - "Assert Claim.status == EXHAUSTED, weeks_paid == 2, weeks_remaining == 0."
          trigger:
            - "POST /weekly-certifications/{WC2}/audit {classification:NON_FRAUD, reason:'work_search_log fake'}"
          assert:
            - "WeeklyCertification.WC2.status == OVERPAID"
            - "Claim.status == ACTIVE  # reverted from EXHAUSTED"
            - "Claim.weeks_paid == 1"
            - "Claim.weeks_remaining == 1"

      - name: appeal_branching_fork_at_filed
        grounds:
          - state_machines.Appeal
          - state_machines.Appeal.FILED_to_DISMISSED_LATE
          - state_machines.Appeal.FILED_to_IN_HEARING
          - state_machines.Appeal.FILED_to_WITHDRAWN
        distinguishing_aspect: |
          BRANCHING fork on Appeal entity (different entity from Claim above):
          from FILED the appeal can go to {IN_HEARING (officer starts hearing),
          WITHDRAWN (claimant withdraws), DISMISSED_LATE (clock crosses
          deadline)}, with three divergent side-effect sets. IN_HEARING leads
          to {SUSTAINED, REVERSED} with different downstream cascades on the
          subject. This is a fan-out fork, not a linear pipeline.
        test_recipe:
          setup:
            - "Create three Appeals A1, A2, A3, each on a distinct DENIED Claim's MONETARY_DETERMINATION."
            - "For A1: AppealOfficer (distinct from adjudicator) acts."
            - "For A2: Claimant acts."
            - "For A3: SystemClock advanced past deadline_at."
          trigger:
            - "POST /appeals/{A1}/start-hearing  -> IN_HEARING"
            - "POST /appeals/{A2}/withdraw       -> WITHDRAWN"
            - "POST /_clock/advance to push beyond A3.deadline_at, then GET /appeals/{A3}  -> DISMISSED_LATE"
          assert:
            - "A1.status == 'IN_HEARING'"
            - "A2.status == 'WITHDRAWN'"
            - "A3.status == 'DISMISSED_LATE'"
            - "All three originated from the same FILED state — branching fan-out, not linear"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # Required: >= 2 cascades, one depth>=3 and one depth>=2, different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: audit_overpaid_cascade_depth_4
        grounds:
          - state_machines.WeeklyCertification.APPROVED_to_OVERPAID
          - calculations.employer_experience_rate
          - calculations.overpayment_recovery_balance
          - entities.Overpayment
          - entities.EmployerCharge
          - entities.Employer.fields.experience_rate_bps
          - entities.Claimant.fields.lifetime_overpayment_balance_cents
        distinguishing_aspect: |
          Cascade depth >= 4 triggered by POST /weekly-certifications/{id}/audit:
          (1) WC.APPROVED -> OVERPAID itself triggers (2) BenefitPayment.status
          ISSUED -> REVERSED, which itself triggers (3) the linked EmployerCharge
          ACTIVE -> REVERSED, which itself triggers (4) Employer.experience_rate_bps
          recomputation via employer_experience_rate (charge_active variant).
          Each link is CAUSED BY the previous link (not by the original action
          fanning out). Trigger is the audit action — distinct from cascade B below.
        test_recipe:
          setup:
            - "Establish Employer E1 with reserve_ratio_basis_cents=1000000, taxable_payroll_cents=10000000 (initial experience_rate_bps=100)."
            - "Approve a weekly certification under Claim K1 such that one EmployerCharge of charge_cents=300000 is created against E1; assert E1.experience_rate_bps == 180."
          trigger:
            - "POST /weekly-certifications/{WC1}/audit {classification:NON_FRAUD, reason:'audit'}"
          assert:
            - "Link 1: WC1.status == 'OVERPAID'"
            - "Link 2 (caused by Link 1): BenefitPayment.status == 'REVERSED'"
            - "Link 3 (caused by Link 2): EmployerCharge.status == 'REVERSED'"
            - "Link 4 (caused by Link 3): E1.experience_rate_bps == 100  # back to floor tier"
            - "Side branch from Link 1: Overpayment created with principal_cents == BenefitPayment.amount_cents"
            - "Claimant.lifetime_overpayment_balance_cents == Overpayment.principal_cents"

      - name: appeal_reversed_cascade_depth_3
        grounds:
          - state_machines.Appeal.IN_HEARING_to_REVERSED
          - state_machines.WeeklyCertification.SUBMITTED_to_APPROVED
          - calculations.employer_charge_allocation
          - calculations.employer_experience_rate
        distinguishing_aspect: |
          Cascade depth >= 3 triggered by POST /appeals/{id}/decide
          decision='REVERSED' on a WEEKLY_DENIAL subject (DIFFERENT TRIGGER
          from audit above): (1) Appeal.IN_HEARING -> REVERSED causes
          (2) WeeklyCertification.DENIED -> APPROVED, which itself causes
          (3) BenefitPayment created AND EmployerCharge rows created AND
          Employer.experience_rate_bps recomputed. Each link is caused by
          the previous link.
        test_recipe:
          setup:
            - "Create Employer E1 with initial experience_rate_bps=100."
            - "Create Claim K1 in MONETARILY_ELIGIBLE; submit WC1 with insufficient work_search -> auto DENIED."
            - "Claimant files Appeal A1 on WC1 (subject_type=WEEKLY_DENIAL); officer (distinct id from adjudicator) starts hearing."
          trigger:
            - "POST /appeals/{A1}/decide {decision:'REVERSED'}"
          assert:
            - "Link 1: A1.status == 'REVERSED'"
            - "Link 2 (caused by Link 1): WC1.status == 'APPROVED'"
            - "Link 3 (caused by Link 2): a BenefitPayment exists with status='ISSUED' and EmployerCharge created and E1.experience_rate_bps recomputed away from 100"

  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # Required: >= 2 instances with different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_segregation
        grounds:
          - validations[priority=5]
          - validations[priority=6]
        distinguishing_aspect: |
          Pair: state (ERR_INVALID_STATE, priority 5) vs business_safety
          (ERR_SEGREGATION_OF_DUTIES_VIOLATION, priority 6). When an
          Appeal in WITHDRAWN state has /start-hearing invoked by the
          same X-User-ID who decided the subject, BOTH checks would fail.
          Priority 5 < 6 so ERR_INVALID_STATE wins.
        test_recipe:
          setup:
            - "Create DENIED Claim K1 adjudicated by adjudicator U_A."
            - "Claimant files Appeal A1 with assigned_appeal_officer_id = U_A (same as adjudicator)."
            - "Claimant POST /appeals/{A1}/withdraw -> A1.status == WITHDRAWN."
          trigger:
            - "POST /appeals/{A1}/start-hearing with X-User-Role=AppealOfficer, X-User-ID=U_A"
          assert:
            - "HTTP 409"
            - "error_id == 'ERR_INVALID_STATE'  # priority 5 wins over priority 6"

      - name: business_temporal_vs_business_fiscal_overpayment
        grounds:
          - validations[priority=13]
          - validations[priority=19]
        distinguishing_aspect: |
          Pair: business_temporal (ERR_STATUTE_NOT_REACHED, priority 19) vs
          business_fiscal (ERR_REPAY_EXCEEDS_BALANCE, priority 13). On
          POST /overpayments/{id}/repay with amount > balance, the fiscal
          check fires at priority 13. (Distinct error-category pair from
          above: fiscal vs temporal, not state vs safety.) Comparing
          via two endpoints — repay (fiscal) vs write-off (temporal) —
          forces a different priority ordering than the segregation case.
        test_recipe:
          setup:
            - "Create Overpayment O1 with balance_cents=500."
            - "SystemClock.now is 1 day after O1.created_at."
          trigger:
            - "POST /overpayments/{O1}/repay {amount_cents: 100000}  # exceeds balance"
            - "Separately: POST /overpayments/{O1}/write-off  # statute not reached"
          assert:
            - "First call: error_id == 'ERR_REPAY_EXCEEDS_BALANCE', http_status == 409"
            - "Second call: error_id == 'ERR_STATUTE_NOT_REACHED', http_status == 409"
            - "Distinct error-category pair (business_fiscal vs business_temporal) — not the state/safety pairing above"

  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # Required: >= 2 instances on different metrics AND different endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: experience_rate_tier_boundary_exact_010
        grounds:
          - calculations.employer_experience_rate
          - entities.Employer.fields.experience_rate_bps
          - endpoints["GET /employers/{id}"]
        distinguishing_aspect: |
          Numeric threshold boundary on reserve_ratio at exactly 0.10
          (boundary is >=, NOT >). Metric: Employer.experience_rate_bps.
          Endpoint: GET /employers/{id}. Tests that ratio == 0.10 lands
          at tier 100 bps (the >= side), and ratio = 0.09999... lands at
          tier 180 bps. Different metric and endpoint from boundary #2.
        test_recipe:
          setup:
            - "POST /employers with reserve_ratio_basis_cents=1000000 and taxable_payroll_cents=10000000 (ratio=0.10 exact) -> E_A. Expect E_A.experience_rate_bps == 100."
            - "POST /employers with reserve_ratio_basis_cents=999999  and taxable_payroll_cents=10000000 (ratio<0.10)  -> E_B."
          trigger:
            - "GET /employers/{E_A}"
            - "GET /employers/{E_B}"
          assert:
            - "E_A.experience_rate_bps == 100  # ratio == 0.10 (boundary inclusive)"
            - "E_B.experience_rate_bps == 180  # ratio == 0.0999999 < 0.10, next tier"

      - name: work_search_zero_count_boundary
        grounds:
          - validations[priority=12]
          - state_machines.WeeklyCertification.SUBMITTED_to_DENIED
          - entities.WeeklyCertification.fields.work_search_count
          - endpoints["POST /claims/{cid}/weekly-certifications"]
        distinguishing_aspect: |
          Empty-collection / count boundary: MIN_WORK_SEARCH_CONTACTS == 3.
          work_search_count == 2 (just below threshold) -> auto-DENIED;
          work_search_count == 3 (exactly threshold) -> APPROVED.
          Different metric (count of WorkSearchEntry) and different endpoint
          (POST /claims/{cid}/weekly-certifications) from the experience-rate
          boundary above.
        test_recipe:
          setup:
            - "Set up Claim K1 in MONETARILY_ELIGIBLE with weekly_benefit_amount_cents=30000."
          trigger:
            - "POST /claims/{K1}/weekly-certifications with work_search_entries=[2 entries], earnings=0, able_and_available=true"
            - "POST /claims/{K1}/weekly-certifications (different Saturday) with work_search_entries=[3 entries], earnings=0, able_and_available=true"
          assert:
            - "First cert: status == 'DENIED' (work_search_count=2 < 3)"
            - "Second cert: status == 'APPROVED' (work_search_count=3 == 3, inclusive >=) and BenefitPayment.amount_cents == 30000"

  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # Required: >= 2 dependencies crossing different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: weeklycert_depends_on_claim_status
        grounds:
          - state_machines.WeeklyCertification.SUBMITTED_to_APPROVED
          - state_machines.Claim
        distinguishing_aspect: |
          Pair: WeeklyCertification -> Claim. A WeeklyCertification cannot
          transition SUBMITTED -> APPROVED unless Claim.status IN
          {MONETARILY_ELIGIBLE, ACTIVE, EXTENDED}. If Claim is EXHAUSTED
          (without extension) or CLOSED, the same SUBMITTED cert cannot
          progress. This is one entity pair (WC depends on Claim).
        test_recipe:
          setup:
            - "Claim K1 driven to EXHAUSTED (weeks_paid == max_weeks_of_eligibility)."
          trigger:
            - "POST /claims/{K1}/weekly-certifications {valid body with 3 work_search entries}"
          assert:
            - "HTTP 409"
            - "error_id == 'ERR_INVALID_STATE' (Claim not in {MONETARILY_ELIGIBLE,ACTIVE,EXTENDED})"

      - name: appeal_decide_depends_on_subject_version
        grounds:
          - state_machines.Appeal.IN_HEARING_to_REVERSED
          - state_machines.Appeal.IN_HEARING_to_SUSTAINED
          - entities.Appeal.fields.subject_locked_version
        distinguishing_aspect: |
          Different entity pair: Appeal -> { Claim | WeeklyCertification |
          Overpayment } depending on subject_type. Appeal cannot transition
          IN_HEARING -> {SUSTAINED, REVERSED} unless the subject's current
          version equals Appeal.subject_locked_version. This is a cross-entity
          state dependency on a DIFFERENT pair than WC->Claim above.
        test_recipe:
          setup:
            - "DENIED Claim K1 (decided by adjudicator U_A, Claim.version=V_pin)."
            - "Claimant files Appeal A1 on K1 monetary determination; Appeal.subject_locked_version = V_pin."
            - "Officer (different X-User-ID from U_A) POST /appeals/{A1}/start-hearing -> IN_HEARING."
            - "Adjudicator does any side action that bumps Claim.version (e.g., another adjudicate retraction path increments version) — for test purposes simulate a Claim mutation between filing and decide."
          trigger:
            - "POST /appeals/{A1}/decide {decision:'REVERSED'}"
          assert:
            - "HTTP 409"
            - "error_id == 'ERR_STALE_APPEAL_SUBJECT'"
            - "Appeal.status remains 'IN_HEARING'; Claim.status unchanged"

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # Required: >= 2 rules with different interval semantics on different resources
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: weekly_certification_week_uniqueness_strict_after
        grounds:
          - validations[priority=10]
          - validations[priority=11]
          - concurrency_rules[scenario contains "same week_ending_date"]
          - entities.WeeklyCertification.fields.week_ending_date
        distinguishing_aspect: |
          Resource: WeeklyCertification on a Claim. Interval semantics:
          each Saturday is a POINT covering the open 7-day interval
          ending at that Saturday; certifications occupy NON-ADJACENT
          weekly points with STRICT > ordering (next cert's
          week_ending_date must be strictly later than the latest
          APPROVED cert's week_ending_date) AND uniqueness at the
          point (no duplicate (claim_id, week_ending_date) row).
          This is a POINT-OCCUPATION interval semantic — overlap means
          same Saturday point.
        test_recipe:
          setup:
            - "Claim K1 in MONETARILY_ELIGIBLE; week_ending_date 2026-04-04 is a Saturday."
            - "POST first WeeklyCertification (week_ending=2026-04-04, 3 work_search entries, earnings=0) -> APPROVED."
          trigger:
            - "POST another WeeklyCertification (week_ending=2026-04-04, valid body) -> duplicate"
            - "POST another WeeklyCertification (week_ending=2026-03-28, valid body) -> earlier week"
          assert:
            - "Second POST: HTTP 409 error_id == 'ERR_DUPLICATE_WEEK'  # same point"
            - "Third POST: HTTP 409 error_id == 'ERR_WEEK_OUT_OF_RANGE'  # strict > on week_ending_date violated"

      - name: pandemic_extension_window_inclusive_endpoints
        grounds:
          - validations[priority=16]
          - entities.PandemicExtension.fields.effective_start
          - entities.PandemicExtension.fields.effective_end
          - state_machines.PandemicExtension
        distinguishing_aspect: |
          Different resource (PandemicExtension) AND different interval
          semantics: PandemicExtension's [effective_start, effective_end]
          is a CLOSED interval (BOTH endpoints inclusive); the program
          is ACTIVE iff effective_start <= SystemClock.now <= effective_end.
          Apply-extension at exactly effective_end SUCCEEDS (inclusive),
          but the moment after effective_end the program EXPIRES and
          apply-extension yields ERR_NO_ACTIVE_EXTENSION. This is a
          closed-interval semantic, distinct from the point-occupation
          semantic of WeeklyCertification.
        test_recipe:
          setup:
            - "Create PandemicExtension P1 with effective_start=2026-05-01T00:00:00Z, effective_end=2026-05-31T23:59:59Z, extra_weeks=13."
            - "Claim K1 in EXHAUSTED with extension_id IS NULL."
            - "Set SystemClock.now = 2026-05-31T23:59:59Z (exactly the end boundary)."
          trigger:
            - "POST /claims/{K1}/apply-extension {extension_id: P1.id}  -> expect success at boundary"
            - "POST /_clock/advance {seconds: 1}  -> now > effective_end"
            - "POST /claims/{K2}/apply-extension on a different EXHAUSTED claim with the same P1 -> expect failure"
          assert:
            - "First call: HTTP 200, Claim.status == 'EXTENDED', Claim.extension_id == P1.id (inclusive endpoint)"
            - "Second call: HTTP 409, error_id == 'ERR_NO_ACTIVE_EXTENSION' (program now EXPIRED)"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # Required: >= 2 invariants on different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: weeks_paid_round_trip_invariant
        grounds:
          - state_machines.WeeklyCertification.APPROVED_to_OVERPAID
          - entities.Claim.fields.weeks_paid
          - entities.Claim.fields.weeks_remaining
        distinguishing_aspect: |
          Conserved quantity: weeks_paid + weeks_remaining ==
          max_weeks_of_eligibility + pandemic_extension_weeks_granted.
          Forward action: weekly cert APPROVED (weeks_paid+=1, weeks_remaining-=1).
          Compensating action: audit OVERPAID (weeks_paid-=1, weeks_remaining+=1).
          After the round-trip, weeks_paid is exactly back to the original
          and the invariant holds (no drift).
        test_recipe:
          setup:
            - "Claim K1 with max_weeks_of_eligibility=10, weeks_paid=0, weeks_remaining=10."
          trigger:
            - "POST one valid weekly-certifications request -> APPROVED (weeks_paid=1, weeks_remaining=9)"
            - "POST /weekly-certifications/{WC1}/audit -> OVERPAID (weeks_paid=0, weeks_remaining=10)"
          assert:
            - "After approval: Claim.weeks_paid == 1 AND Claim.weeks_remaining == 9; sum == 10"
            - "After audit: Claim.weeks_paid == 0 AND Claim.weeks_remaining == 10; sum == 10"
            - "Invariant weeks_paid + weeks_remaining == 10 (max_weeks_of_eligibility + pandemic_extension_weeks_granted) holds throughout"

      - name: payment_dollar_conservation_invariant
        grounds:
          - calculations.employer_charge_allocation
          - calculations.overpayment_recovery_balance
          - entities.BenefitPayment.fields.amount_cents
          - entities.EmployerCharge.fields.charge_cents
          - entities.Overpayment.fields.principal_cents
          - state_machines.WeeklyCertification.APPROVED_to_OVERPAID
        distinguishing_aspect: |
          Different conserved quantity: DOLLARS. For every BenefitPayment,
          sum(EmployerCharge.charge_cents WHERE payment_id == BP.id AND
          status IN {ACTIVE, REVERSED}) == BenefitPayment.amount_cents
          (allocation conservation). And for an audited cert, the
          compensating action creates an Overpayment with
          principal_cents == BenefitPayment.amount_cents, and the
          combined invariant
          (BenefitPayment.amount_cents - Overpayment.principal_cents - 0)
          == 0 holds for the audited cert.
          Distinct conserved quantity from the weeks-count invariant above
          (dollar cents vs week count).
        test_recipe:
          setup:
            - "Claim K1 in MONETARILY_ELIGIBLE with two employers E_A and E_B in base period (wages 1000000 each)."
            - "Approve WC1 with payable_amount_cents=10001 producing EmployerCharges E_A=5000, E_B=5001 (per Rule 2 mode-b example)."
          trigger:
            - "POST /weekly-certifications/{WC1}/audit"
          assert:
            - "Before audit: sum(EmployerCharge.charge_cents for ACTIVE) == 10001 == BenefitPayment.amount_cents"
            - "After audit: BenefitPayment.status == 'REVERSED'; all linked EmployerCharge.status == 'REVERSED'; sum(charge_cents over ACTIVE+REVERSED) == 10001 (still equals payment.amount_cents — allocation rows still account for the dollars)"
            - "After audit: Overpayment.principal_cents == 10001 == BenefitPayment.amount_cents"
            - "Invariant: BenefitPayment.amount_cents - Overpayment.principal_cents == 0 (dollars conserved)"
