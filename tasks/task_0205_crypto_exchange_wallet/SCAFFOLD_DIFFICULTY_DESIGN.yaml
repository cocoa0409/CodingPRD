# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# crypto-exchange-wallet — 9 rule_ids x >=2 instances = 19 instances
# Every grounds[] resolves into SCAFFOLD.yaml §1.1-§1.7. Every setup_api_calls
# chain drives empty-DB -> the setup state using only §1.5 endpoints.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: cost_basis_fifo_vs_hifo_lot_depletion
        grounds:
          - calculations.realized_gain_on_disposal
          - entities.CostBasisLot.fields.remaining_quantity
          - entities.CostBasisLot.fields.status
          - entities.Account.fields.cost_basis_method
          - state_machines.Withdrawal.APPROVED_to_BROADCAST
        distinguishing_aspect: |
          Two accounts with identical ETH lots (1.0@1500 acquired first, 1.0@2500 acquired
          later) each dispose 1.0 ETH; the FIFO account DEPLETES the 1500 lot while the HIFO
          account DEPLETES the 2500 lot — the divergence lives on the CostBasisLot/Account
          domain, distinct from the Trade/Order fee divergence in trade_fee.
        test_recipe:
          setup:
            - "ETH asset: decimals 8, required_confirmations 2, spot 2000, min_withdrawal 0.001, network_fee 0.001"
            - "FIFO account at TIER_2 with two CREDITED ETH lots: 1.0@1500 (older), 1.0@2500 (newer); one ACTIVE ETH whitelist address"
            - "HIFO account at TIER_2 with the identical two lots and an ACTIVE address"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Operator
            - call: "POST /assets"
              payload: { symbol: "ETH", decimals: 8, required_confirmations: 2, is_fiat: false, min_withdrawal_amount: 0.001, network_fee: 0.001, spot_price_usd: 2000 }
              as: Operator
              captures: { eth_id: $.data.id }
            # ---- FIFO account ----
            - call: "POST /accounts"
              payload: { email: "fifo@x.com", full_name: "FIFO Trader", residence_country: "US", cost_basis_method: "FIFO" }
              as: Anonymous
              captures: { acc_f: $.data.id }
            - call: "POST /accounts/${acc_f}/kyc-applications"
              payload: { requested_tier: "TIER_1" }
              as: Trader
              as_user_id: "${acc_f}"
            - call: "POST /accounts/${acc_f}/kyc-decisions"
              payload: { decision: "APPROVE" }
              as: Operator
            - call: "POST /accounts/${acc_f}/kyc-applications"
              payload: { requested_tier: "TIER_2" }
              as: Trader
              as_user_id: "${acc_f}"
            - call: "POST /accounts/${acc_f}/kyc-decisions"
              payload: { decision: "APPROVE" }
              as: Operator
            - call: "POST /deposits"
              payload: { account_id: "${acc_f}", asset: "ETH", amount: 1.0, unit_cost_usd: 1500 }
              as: Operator
              captures: { dep_f1: $.data.id }
            - call: "POST /deposits/${dep_f1}/confirmations"
              payload: { delta: 2 }
              as: Operator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-02T00:00:00Z" }
              as: Operator
            - call: "POST /deposits"
              payload: { account_id: "${acc_f}", asset: "ETH", amount: 1.0, unit_cost_usd: 2500 }
              as: Operator
              captures: { dep_f2: $.data.id }
            - call: "POST /deposits/${dep_f2}/confirmations"
              payload: { delta: 2 }
              as: Operator
            - call: "GET /accounts/${acc_f}"
              as: Trader
              as_user_id: "${acc_f}"
              captures: { v_f: $.data.version }
            - call: "POST /withdrawal-addresses"
              payload: { account_id: "${acc_f}", asset: "ETH", chain_address: "0xFIFO", label: "out", expected_account_version: "${v_f}" }
              as: Trader
              as_user_id: "${acc_f}"
              captures: { addr_f: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-03T00:00:00Z" }
              as: Operator
            - call: "POST /withdrawal-addresses/${addr_f}/activate"
              payload: {}
              as: Trader
              as_user_id: "${acc_f}"
            # ---- HIFO account (mirror) ----
            - call: "POST /accounts"
              payload: { email: "hifo@x.com", full_name: "HIFO Trader", residence_country: "US", cost_basis_method: "HIFO" }
              as: Anonymous
              captures: { acc_h: $.data.id }
            - call: "POST /accounts/${acc_h}/kyc-applications"
              payload: { requested_tier: "TIER_1" }
              as: Trader
              as_user_id: "${acc_h}"
            - call: "POST /accounts/${acc_h}/kyc-decisions"
              payload: { decision: "APPROVE" }
              as: Operator
            - call: "POST /accounts/${acc_h}/kyc-applications"
              payload: { requested_tier: "TIER_2" }
              as: Trader
              as_user_id: "${acc_h}"
            - call: "POST /accounts/${acc_h}/kyc-decisions"
              payload: { decision: "APPROVE" }
              as: Operator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Operator
            - call: "POST /deposits"
              payload: { account_id: "${acc_h}", asset: "ETH", amount: 1.0, unit_cost_usd: 1500 }
              as: Operator
              captures: { dep_h1: $.data.id }
            - call: "POST /deposits/${dep_h1}/confirmations"
              payload: { delta: 2 }
              as: Operator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-02T00:00:00Z" }
              as: Operator
            - call: "POST /deposits"
              payload: { account_id: "${acc_h}", asset: "ETH", amount: 1.0, unit_cost_usd: 2500 }
              as: Operator
              captures: { dep_h2: $.data.id }
            - call: "POST /deposits/${dep_h2}/confirmations"
              payload: { delta: 2 }
              as: Operator
            - call: "GET /accounts/${acc_h}"
              as: Trader
              as_user_id: "${acc_h}"
              captures: { v_h: $.data.version }
            - call: "POST /withdrawal-addresses"
              payload: { account_id: "${acc_h}", asset: "ETH", chain_address: "0xHIFO", label: "out", expected_account_version: "${v_h}" }
              as: Trader
              as_user_id: "${acc_h}"
              captures: { addr_h: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-03T00:00:00Z" }
              as: Operator
            - call: "POST /withdrawal-addresses/${addr_h}/activate"
              payload: {}
              as: Trader
              as_user_id: "${acc_h}"
          trigger:
            # dispose 1.0 ETH from each account via a full withdrawal lifecycle to BROADCAST
            - call: "POST /withdrawals"
              payload: { account_id: "${acc_f}", withdrawal_address_id: "${addr_f}", amount: 1.0 }
              as: Trader
              as_user_id: "${acc_f}"
              captures: { wd_f: $.data.id }
            - call: "POST /withdrawals/${wd_f}/screen"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /withdrawals/${wd_f}/screen-result"
              payload: { result: "CLEAR" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /withdrawals/${wd_f}/broadcast"
              payload: {}
              as: Operator
            - call: "POST /withdrawals"
              payload: { account_id: "${acc_h}", withdrawal_address_id: "${addr_h}", amount: 1.0 }
              as: Trader
              as_user_id: "${acc_h}"
              captures: { wd_h: $.data.id }
            - call: "POST /withdrawals/${wd_h}/screen"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /withdrawals/${wd_h}/screen-result"
              payload: { result: "CLEAR" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /withdrawals/${wd_h}/broadcast"
              payload: {}
              as: Operator
            - call: "GET /cost-basis-lots"
              payload: { account_id: "${acc_f}", asset: "ETH" }
              as: Trader
              as_user_id: "${acc_f}"
            - call: "GET /cost-basis-lots"
              payload: { account_id: "${acc_h}", asset: "ETH" }
              as: Trader
              as_user_id: "${acc_h}"
          assert:
            - "FIFO account: the lot with unit_cost_usd==1500 has status==DEPLETED and remaining_quantity==0"
            - "FIFO account: the lot with unit_cost_usd==2500 has status==OPEN and remaining_quantity==1.0"
            - "HIFO account: the lot with unit_cost_usd==2500 has status==DEPLETED and remaining_quantity==0"
            - "HIFO account: the lot with unit_cost_usd==1500 has status==OPEN and remaining_quantity==1.0"

      - name: maker_taker_fee_diverges_same_notional
        grounds:
          - calculations.trade_fee
          - entities.Trade.fields.maker_fee
          - entities.Trade.fields.taker_fee
          - state_machines.Order.OPEN_to_FILLED
        distinguishing_aspect: |
          On one Trade with notional 40000 USD, the resting maker pays 40.00 USD (10 bps) and
          the aggressing taker pays 120.00 USD (30 bps) — same notional, different output on
          the Trade/Order domain, structurally distinct from the CostBasisLot/Account FIFO-HIFO
          divergence.
        test_recipe:
          setup:
            - "USD fiat asset (spot 1) and BTC asset (spot 40000); TIER_BASE fee schedule maker 10 bps / taker 30 bps"
            - "Seller account holds 1.0 BTC available; buyer account holds 60000 USD available; both TIER_1"
            - "Seller rests a SELL LIMIT 1.0 BTC @ 40000 USD; buyer sends a BUY MARKET 1.0 BTC that crosses"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: Operator
            - call: "POST /assets"
              payload: { symbol: "USD", decimals: 2, required_confirmations: 0, is_fiat: true, min_withdrawal_amount: 1, network_fee: 0, spot_price_usd: 1 }
              as: Operator
            - call: "POST /assets"
              payload: { symbol: "BTC", decimals: 8, required_confirmations: 1, is_fiat: false, min_withdrawal_amount: 0.0001, network_fee: 0.0001, spot_price_usd: 40000 }
              as: Operator
            - call: "POST /fee-schedules"
              payload: { tier_name: "TIER_BASE", min_taker_volume_30d_usd: 0, maker_fee_bps: 10, taker_fee_bps: 30 }
              as: Operator
            # seller
            - call: "POST /accounts"
              payload: { email: "seller@x.com", full_name: "Seller", residence_country: "US" }
              as: Anonymous
              captures: { acc_s: $.data.id }
            - call: "POST /accounts/${acc_s}/kyc-applications"
              payload: { requested_tier: "TIER_1" }
              as: Trader
              as_user_id: "${acc_s}"
            - call: "POST /accounts/${acc_s}/kyc-decisions"
              payload: { decision: "APPROVE" }
              as: Operator
            - call: "POST /deposits"
              payload: { account_id: "${acc_s}", asset: "BTC", amount: 1.0, unit_cost_usd: 35000 }
              as: Operator
              captures: { dep_s: $.data.id }
            - call: "POST /deposits/${dep_s}/confirmations"
              payload: { delta: 1 }
              as: Operator
            # buyer
            - call: "POST /accounts"
              payload: { email: "buyer@x.com", full_name: "Buyer", residence_country: "US" }
              as: Anonymous
              captures: { acc_b: $.data.id }
            - call: "POST /accounts/${acc_b}/kyc-applications"
              payload: { requested_tier: "TIER_1" }
              as: Trader
              as_user_id: "${acc_b}"
            - call: "POST /accounts/${acc_b}/kyc-decisions"
              payload: { decision: "APPROVE" }
              as: Operator
            - call: "POST /deposits"
              payload: { account_id: "${acc_b}", asset: "USD", amount: 60000, unit_cost_usd: 1 }
              as: Operator
              captures: { dep_b: $.data.id }
            - call: "POST /deposits/${dep_b}/confirmations"
              payload: { delta: 0 }
              as: Operator
            # seller rests the maker order
            - call: "GET /accounts/${acc_s}"
              as: Trader
              as_user_id: "${acc_s}"
              captures: { v_s: $.data.version }
            - call: "POST /orders"
              payload: { account_id: "${acc_s}", base_asset: "BTC", quote_asset: "USD", side: "SELL", order_type: "LIMIT", quantity: 1.0, limit_price: 40000, time_in_force: "GTC", expected_account_version: "${v_s}" }
              as: Trader
              as_user_id: "${acc_s}"
              captures: { maker_oid: $.data.id }
          trigger:
            - call: "GET /accounts/${acc_b}"
              as: Trader
              as_user_id: "${acc_b}"
              captures: { v_b: $.data.version }
            - call: "POST /orders"
              payload: { account_id: "${acc_b}", base_asset: "BTC", quote_asset: "USD", side: "BUY", order_type: "MARKET", quantity: 1.0, time_in_force: "IOC", expected_account_version: "${v_b}" }
              as: Trader
              as_user_id: "${acc_b}"
              captures: { taker_oid: $.data.id }
            - call: "GET /trades"
              payload: {}
              as: Trader
              as_user_id: "${acc_b}"
          assert:
            - "Exactly one Trade exists with maker_order_id==${maker_oid} and taker_order_id==${taker_oid}"
            - "Trade.price == 40000 and Trade.quantity == 1.0 and Trade.notional_usd == 40000"
            - "Trade.maker_fee == 40.00"
            - "Trade.taker_fee == 120.00"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: market_buy_reserve_nested_min_max_tier
        grounds:
          - calculations.order_reserve_amount
          - entities.Order.fields.reserved_remaining
          - entities.Balance.fields.reserved_amount
          - validations[priority=17]
        distinguishing_aspect: |
          Mode (a): the MARKET BUY reserve nests best-ask selection (min over resting asks),
          a slippage multiplier (1.05), and a worst-case taker-fee multiplier (1.003) into one
          formula with >=3 interacting inputs — 1.0 * 40000 * 1.05 * 1.003 = 42126.00 USD
          reserved.
        test_recipe:
          setup:
            - "USD(spot 1) and BTC(spot 40000); TIER_BASE fees 10/30 bps"
            - "Resting SELL LIMIT 1.0 BTC @ 40000 from a seller; best ask = 40000"
            - "Buyer TIER_1 holds 50000 USD available, about to place MARKET BUY 1.0 BTC"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: Operator
            - call: "POST /assets"
              payload: { symbol: "USD", decimals: 2, required_confirmations: 0, is_fiat: true, min_withdrawal_amount: 1, network_fee: 0, spot_price_usd: 1 }
              as: Operator
            - call: "POST /assets"
              payload: { symbol: "BTC", decimals: 8, required_confirmations: 1, is_fiat: false, min_withdrawal_amount: 0.0001, network_fee: 0.0001, spot_price_usd: 40000 }
              as: Operator
            - call: "POST /fee-schedules"
              payload: { tier_name: "TIER_BASE", min_taker_volume_30d_usd: 0, maker_fee_bps: 10, taker_fee_bps: 30 }
              as: Operator
            - call: "POST /accounts"
              payload: { email: "rsell@x.com", full_name: "RSeller", residence_country: "US" }
              as: Anonymous
              captures: { acc_rs: $.data.id }
            - call: "POST /accounts/${acc_rs}/kyc-applications"
              payload: { requested_tier: "TIER_1" }
              as: Trader
              as_user_id: "${acc_rs}"
            - call: "POST /accounts/${acc_rs}/kyc-decisions"
              payload: { decision: "APPROVE" }
              as: Operator
            - call: "POST /deposits"
              payload: { account_id: "${acc_rs}", asset: "BTC", amount: 1.0, unit_cost_usd: 35000 }
              as: Operator
              captures: { dep_rs: $.data.id }
            - call: "POST /deposits/${dep_rs}/confirmations"
              payload: { delta: 1 }
              as: Operator
            - call: "GET /accounts/${acc_rs}"
              as: Trader
              as_user_id: "${acc_rs}"
              captures: { v_rs: $.data.version }
            - call: "POST /orders"
              payload: { account_id: "${acc_rs}", base_asset: "BTC", quote_asset: "USD", side: "SELL", order_type: "LIMIT", quantity: 1.0, limit_price: 40000, time_in_force: "GTC", expected_account_version: "${v_rs}" }
              as: Trader
              as_user_id: "${acc_rs}"
            - call: "POST /accounts"
              payload: { email: "rbuy@x.com", full_name: "RBuyer", residence_country: "US" }
              as: Anonymous
              captures: { acc_rb: $.data.id }
            - call: "POST /accounts/${acc_rb}/kyc-applications"
              payload: { requested_tier: "TIER_1" }
              as: Trader
              as_user_id: "${acc_rb}"
            - call: "POST /accounts/${acc_rb}/kyc-decisions"
              payload: { decision: "APPROVE" }
              as: Operator
            - call: "POST /deposits"
              payload: { account_id: "${acc_rb}", asset: "USD", amount: 50000, unit_cost_usd: 1 }
              as: Operator
              captures: { dep_rb: $.data.id }
            - call: "POST /deposits/${dep_rb}/confirmations"
              payload: { delta: 0 }
              as: Operator
          trigger:
            - call: "GET /accounts/${acc_rb}"
              as: Trader
              as_user_id: "${acc_rb}"
              captures: { v_rb: $.data.version }
            - call: "POST /orders"
              payload: { account_id: "${acc_rb}", base_asset: "BTC", quote_asset: "USD", side: "BUY", order_type: "MARKET", quantity: 1.0, time_in_force: "GTC", expected_account_version: "${v_rb}" }
              as: Trader
              as_user_id: "${acc_rb}"
              captures: { mb_oid: $.data.id }
            - call: "GET /balances"
              payload: { account_id: "${acc_rb}", asset: "USD" }
              as: Trader
              as_user_id: "${acc_rb}"
          assert:
            - "At placement, the BUY MARKET reserve computed = 1.0 * 40000 * 1.05 * 1.003 = 42126.00 USD before matching consumes it"
            - "Order fully fills 1.0 BTC at 40000 (best ask), so post-fill the USD Balance available_amount == 50000 - 40000 - 120.00 (taker fee) == 9880.00 and reserved_amount == 0"

      - name: taker_volume_30d_round_then_sum_order_pinned
        grounds:
          - calculations.account_30d_taker_volume
          - entities.Account.fields.taker_volume_30d_usd
          - entities.Trade.fields.notional_usd
        distinguishing_aspect: |
          Mode (b): three taker trades each notional 100.005 USD are rounded to 100.01 FIRST
          then summed = 300.03, NOT summed (300.015) then rounded (300.02); the pinned
          round-then-sum order yields 300.03, distinguishing it from the nested-multiplier
          mode (a) of the reserve formula.
        test_recipe:
          setup:
            - "USD(spot 1, decimals 2) and a token TKN(decimals 8, spot 1)"
            - "TIER_BASE fees; a maker rests three SELL LIMIT lots of 1.00005 TKN @ price 100.00; a taker fills each in a separate MARKET BUY"
            - "Each fill notional_usd == 1.00005 * 100.00 * 1 == 100.005 (the half-cent lives in quantity, price stays 2-dp clean)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: Operator
            - call: "POST /assets"
              payload: { symbol: "USD", decimals: 2, required_confirmations: 0, is_fiat: true, min_withdrawal_amount: 1, network_fee: 0, spot_price_usd: 1 }
              as: Operator
            - call: "POST /assets"
              payload: { symbol: "TKN", decimals: 8, required_confirmations: 1, is_fiat: false, min_withdrawal_amount: 0.001, network_fee: 0.001, spot_price_usd: 1 }
              as: Operator
            - call: "POST /fee-schedules"
              payload: { tier_name: "TIER_BASE", min_taker_volume_30d_usd: 0, maker_fee_bps: 10, taker_fee_bps: 30 }
              as: Operator
            - call: "POST /accounts"
              payload: { email: "vmak@x.com", full_name: "VMaker", residence_country: "US" }
              as: Anonymous
              captures: { acc_vm: $.data.id }
            - call: "POST /accounts/${acc_vm}/kyc-applications"
              payload: { requested_tier: "TIER_1" }
              as: Trader
              as_user_id: "${acc_vm}"
            - call: "POST /accounts/${acc_vm}/kyc-decisions"
              payload: { decision: "APPROVE" }
              as: Operator
            - call: "POST /deposits"
              payload: { account_id: "${acc_vm}", asset: "TKN", amount: 3000, unit_cost_usd: 1 }
              as: Operator
              captures: { dep_vm: $.data.id }
            - call: "POST /deposits/${dep_vm}/confirmations"
              payload: { delta: 1 }
              as: Operator
            - call: "POST /accounts"
              payload: { email: "vtak@x.com", full_name: "VTaker", residence_country: "US" }
              as: Anonymous
              captures: { acc_vt: $.data.id }
            - call: "POST /accounts/${acc_vt}/kyc-applications"
              payload: { requested_tier: "TIER_1" }
              as: Trader
              as_user_id: "${acc_vt}"
            - call: "POST /accounts/${acc_vt}/kyc-decisions"
              payload: { decision: "APPROVE" }
              as: Operator
            - call: "POST /deposits"
              payload: { account_id: "${acc_vt}", asset: "USD", amount: 1000, unit_cost_usd: 1 }
              as: Operator
              captures: { dep_vt: $.data.id }
            - call: "POST /deposits/${dep_vt}/confirmations"
              payload: { delta: 0 }
              as: Operator
            # three resting SELL LIMITs of 1.00005 TKN @ 100.00 USD/TKN => notional 100.005 each
            - call: "GET /accounts/${acc_vm}"
              as: Trader
              as_user_id: "${acc_vm}"
              captures: { v_vm1: $.data.version }
            - call: "POST /orders"
              payload: { account_id: "${acc_vm}", base_asset: "TKN", quote_asset: "USD", side: "SELL", order_type: "LIMIT", quantity: 1.00005, limit_price: 100.00, time_in_force: "GTC", expected_account_version: "${v_vm1}" }
              as: Trader
              as_user_id: "${acc_vm}"
            - call: "GET /accounts/${acc_vm}"
              as: Trader
              as_user_id: "${acc_vm}"
              captures: { v_vm2: $.data.version }
            - call: "POST /orders"
              payload: { account_id: "${acc_vm}", base_asset: "TKN", quote_asset: "USD", side: "SELL", order_type: "LIMIT", quantity: 1.00005, limit_price: 100.00, time_in_force: "GTC", expected_account_version: "${v_vm2}" }
              as: Trader
              as_user_id: "${acc_vm}"
            - call: "GET /accounts/${acc_vm}"
              as: Trader
              as_user_id: "${acc_vm}"
              captures: { v_vm3: $.data.version }
            - call: "POST /orders"
              payload: { account_id: "${acc_vm}", base_asset: "TKN", quote_asset: "USD", side: "SELL", order_type: "LIMIT", quantity: 1.00005, limit_price: 100.00, time_in_force: "GTC", expected_account_version: "${v_vm3}" }
              as: Trader
              as_user_id: "${acc_vm}"
          trigger:
            - call: "GET /accounts/${acc_vt}"
              as: Trader
              as_user_id: "${acc_vt}"
              captures: { v_vt1: $.data.version }
            - call: "POST /orders"
              payload: { account_id: "${acc_vt}", base_asset: "TKN", quote_asset: "USD", side: "BUY", order_type: "MARKET", quantity: 1.00005, time_in_force: "IOC", expected_account_version: "${v_vt1}" }
              as: Trader
