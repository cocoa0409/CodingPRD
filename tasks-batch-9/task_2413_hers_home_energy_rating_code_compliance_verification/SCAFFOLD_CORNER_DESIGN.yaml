              as: CertifiedRater
              as_user_id: "${w_r1}"
              captures: { w_pm1: $.data.id }
            - call: "POST /homes"
              payload: { subdivision_id: "${w_sd1}", plan_model_id: "${w_pm1}", lot_number: "L-7701", permit_date: "2026-08-05" }
              as: BuilderRep
              as_user_id: "${w_b1}"
              captures: { w_h1a: $.data.id }
            - call: "POST /homes"
              payload: { subdivision_id: "${w_sd1}", plan_model_id: "${w_pm1}", lot_number: "L-7702", permit_date: "2026-08-06" }
