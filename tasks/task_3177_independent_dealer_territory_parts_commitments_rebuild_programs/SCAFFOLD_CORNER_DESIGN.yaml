              payload: { commitment_id: "${cm_id}", product_family: "EXCAVATION", requested_units: 10, core_units: 2, core_return_required: false, requested_at: "2026-08-28T00:00:00Z" }
              as: PartsManager
              captures: { bt_id: $.data.id }
            - call: "POST /dealer-network/parts-order-batches/${bt_id}/place-order"
              payload: {}
              as: PartsManager
            - call: "POST /dealer-network/parts-order-batches/${bt_id}/receive"
