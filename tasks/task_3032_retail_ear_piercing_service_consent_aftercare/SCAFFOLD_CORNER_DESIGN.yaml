        claim_type: Priority Ordering
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - errors[ERR_GUARDIAN_VERIFICATION_REQUIRED]
        distinguishing_aspect: "A consent that is both unverified and identification-mismatched must surface the guardian error, because priority 8 precedes priority 9."
