            - "${zres2} == 1 and ${zav2} == 1 - the one APPROVED case reserved a slot out of the capacity of 2, and the drawing and window did not consume any"

      - name: the_punch_item_runs_open_to_verified_and_waived_and_only_closes_at_settlement
        claim_type: valid_transition
        grounds:
          - state_machines.PunchItem.status
          - state_machines.ExhibitProject.CLOSEOUT_to_WARRANTY_CLOSED
          - calculations.project_readiness_posture
          - validations.priority_4
          - validations.priority_54
          - errors.ERR_INVALID_PUNCH_STATE
          - errors.ERR_BLOCKING_PUNCH_ITEMS_OPEN
        distinguishing_aspect: |
          PunchItem is the only machine whose terminal state is reached exclusively by
          a bubble-up from another entity: nothing closes a punch item except the
          project's settlement, and settlement closes BOTH the VERIFIED and the
          WAIVED items in one sweep. Layered on top are two asymmetries. First,
          severity gates the trigger, not the state: a BLOCKING item is OPEN exactly
          like a MINOR one, yet waive is refused for it while verify is allowed.
          Second, blocking_punch_count only counts BLOCKING items that are still
          OPEN, so verifying the blocking item - not waiving it - is what unblocks
          the COMMISSIONING to CLOSEOUT advance. Verification is also segregated:
          the raiser cannot verify their own item.
        test_recipe:
          setup:
            - "project driven all the way to phase COMMISSIONING with committed_fabrication_cents 4837500 and interactive INT-STRATA commissioned"
            - "three punch items raised by ops-01: P-BLOCK (BLOCKING), P-MAJOR (MAJOR) and P-MINOR (MINOR)"
