      - name: fresh_published_entry_is_not_renewable_until_the_sweep_moves_it
        claim_type: Error Triggerability
        grounds:
          - errors[ERR_CATALOG_ENTRY_NOT_RENEWABLE]
          - validations[priority=15]
          - endpoints[POST /compliance-sweeps]
        distinguishing_aspect: |
          Reauthorization has a hard dependency on the sweep: a still-fresh PUBLISHED entry
          is 409 ERR_CATALOG_ENTRY_NOT_RENEWABLE, and the identical call succeeds only after
          the sweep has moved it to EXPIRING_SOON. An implementation that treats PUBLISHED
          as renewable lets a district renew an authorization eleven months early.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; the canonical chain clears review REV on Application A of Vendor V."
            - "Entry E is published over [2026-08-01T00:00:00Z, 2027-08-01T00:00:00Z) and is still PUBLISHED."
