      - name: largest_remainder_targets_always_sum_to_the_assignable_total
        claim_type: waterfall_allocation
        grounds:
          - calculations.carrier_quota_target_units
          - entities.Carrier.fields.quota_target_units
          - entities.PlanPeriod.fields.total_assignable_units
          - endpoints[POST /plan/applications/{id}/certification].side_effects
        distinguishing_aspect: |
          Apportionment is recomputed on every certification, and the whole-unit targets must sum
          exactly to total_assignable_units at each step - no unit is lost to flooring and none is
          invented. With shares 6000 / 4000 the first certification gives exacts 0.6 / 0.4 and
          hands the single leftover unit to the larger remainder (1 / 0); the second gives exacts
          1.2 / 0.8 and hands its leftover to the SMALLER share, because 0.8 beats 0.2 (1 / 1).
        test_recipe:
