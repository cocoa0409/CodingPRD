              payload: { store_id: "${store_a}", price_change_line_id: "${line_1}", aisle_id: "${aisle_a1}", assigned_associate_id: "${la2}", scheduled_start_at: "2026-08-02T09:00:00Z", scheduled_end_at: "2026-08-02T10:00:00Z", expected_price_change_file_version: "${file_a_v}" }
