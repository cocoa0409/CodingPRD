            - "PlanningCycle.${cyc_id}.pipeline_fte == 0.00"

      - name: hiring_class_graduate_mints_expected_graduate_agents
        claim_type: side_effect_execution
        grounds:
          - state_machines.HiringClass.IN_TRAINING_to_GRADUATED
          - endpoints.POST_hiring-classes_id_graduate
          - calculations.cycle_headcount_and_pipeline
        distinguishing_aspect: |
          Graduation is the scaffold's widest single side-effect fan-out: exactly
          expected_graduates = 21 Agent rows are minted with the class's agreement, skill and
          graduate pay, employee_code CLASS-A-001..CLASS-A-021, and in the SAME request the class
          leaves cycle.pipeline_fte (10.50 -> 0.00) while its graduates enter
          cycle.headcount_active (0 -> 21). An implementation that mints seats (24) instead of
          expected_graduates, or that leaves the class counted in the pipeline, fails.
        test_recipe:
          setup:
            - "One LaborAgreement, one OPEN cycle 2026-09-07..2026-09-13."
            - "One class CLASS-A: start_date 2026-09-06, training_weeks 1, nesting_weeks 1, so nesting_from_date 2026-09-13 == horizon_end_date and productive_from_date 2026-09-20; 24 seats at 12.5% attrition -> expected_graduates 21 and effective_fte_at_horizon_end 21 * 0.5 = 10.50."
            - "The class is walked to IN_TRAINING with the logical clock at 2026-09-13T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: CapacityPlanner
            - call: "POST /labor-agreements"
              payload: { code: "LA-CORE", min_rest_hours: 11, max_weekly_hours: 45, max_consecutive_days: 6, vto_min_notice_hours: 12, preference_honor_floor_pct: 0.50, ot_premium_multiplier: 1.00 }
              as: CapacityPlanner
              captures: { la_id: "$.data.id" }
            - call: "POST /planning-cycles"
              payload: { name: "W37-GRAD", horizon_start_date: "2026-09-07", horizon_end_date: "2026-09-13", interval_minutes: 30, requirement_basis: "MAX_OF_BOTH", ot_budget_cents: 1000000, intraday_alert_short_threshold: 99 }
              as: CapacityPlanner
              captures: { cyc_id: "$.data.id" }
            - call: "POST /hiring-classes"
              payload: { planning_cycle_id: "${cyc_id}", labor_agreement_id: "${la_id}", cohort_name: "CLASS-A", skill_code: "VOICE_EN", start_date: "2026-09-06", seats: 24, training_weeks: 1, nesting_weeks: 1, expected_attrition_pct: 0.125, graduate_hourly_rate_cents: 2000, graduate_weekly_hours: 37.5 }
              as: CapacityPlanner
              captures: { hc_id: "$.data.id", got_graduates: "$.data.expected_graduates" }
            - call: "POST /hiring-classes/${hc_id}/status"
              payload: { target_status: "CHARTERED" }
              as: CapacityPlanner
              captures: { fte_chartered: "$.data.effective_fte_at_horizon_end" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-13T00:00:00Z" }
              as: CapacityPlanner
            - call: "POST /hiring-classes/${hc_id}/status"
              payload: { target_status: "IN_TRAINING" }
              as: CapacityPlanner
            - call: "GET /planning-cycles/${cyc_id}"
              payload: {}
              as: CapacityPlanner
              captures: { pipeline_before: "$.data.pipeline_fte", headcount_before: "$.data.headcount_active" }
          trigger:
            - call: "POST /hiring-classes/${hc_id}/graduate"
              payload: {}
              as: CapacityPlanner
              captures: { got_status: "$.data.status", got_count: "$.data.graduated_agent_count" }
            - call: "GET /agents"
              payload: { hiring_class_id: "${hc_id}", limit: 100, offset: 0 }
              as: SchedulingManager
              captures: { minted_total: "$.data[0].id" }
          assert:
            - "got_graduates == 21 and fte_chartered == 10.50"
            - "pipeline_before == 10.50 and headcount_before == 0"
            - "got_status == \"GRADUATED\" and got_count == 21"
            - "the agent list carries total_count 21 and has_more false"
            - "the 21 minted employee_code values are exactly the set CLASS-A-001, CLASS-A-002, ..., CLASS-A-021 (zero-padded to three digits)"
            - "every minted agent has status \"ACTIVE\", skills == [\"VOICE_EN\"], labor_agreement_id == ${la_id}, hourly_rate_cents == 2000 and weekly_contracted_hours == 37.5"
            - "minted_total is a non-null id (the list is non-empty)"
            - "LaborAgreement.${la_id}.enrolled_agent_count == 21"
            - "PlanningCycle.${cyc_id}.pipeline_fte == 0.00 because a GRADUATED class leaves the pipeline set"
            - "PlanningCycle.${cyc_id}.headcount_active == 21"
            - "HiringClass.${hc_id}.effective_fte_at_horizon_end is still 10.50 (the ramp value is not zeroed by graduation)"

      - name: planning_cycle_open_to_schedule_published_returns_invalid_state
        claim_type: invalid_transitions
        grounds:
          - state_machines.PlanningCycle
          - validations.priority_80
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: |
          SCHEDULE_PUBLISHED is reachable only from REQUIREMENTS_LOCKED. Requesting it straight
          from OPEN is an undeclared edge and must answer 409 ERR_INVALID_STATE with the posture
          and version both unchanged -- not a silent double hop through REQUIREMENTS_LOCKED.
        test_recipe:
          setup:
            - "One freshly created OPEN cycle."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: CapacityPlanner
            - call: "POST /planning-cycles"
              payload: { name: "W37-SKIP", horizon_start_date: "2026-09-07", horizon_end_date: "2026-09-13", interval_minutes: 30, requirement_basis: "MAX_OF_BOTH", ot_budget_cents: 1000000, intraday_alert_short_threshold: 99 }
              as: CapacityPlanner
              captures: { cyc_id: "$.data.id", v_before: "$.data.version" }
          trigger:
            - call: "POST /planning-cycles/${cyc_id}/posture"
              payload: { target_posture: "SCHEDULE_PUBLISHED" }
              as: CapacityPlanner
              captures: { err_id: "$.data.error_id" }
          assert:
            - "the response is 409 and err_id == \"ERR_INVALID_STATE\""
            - "PlanningCycle.${cyc_id}.posture == \"OPEN\""
            - "PlanningCycle.${cyc_id}.version == v_before (a refused transition is not a write)"
            - "PlanningCycle.${cyc_id}.published_at is null"

      - name: bid_round_starts_in_draft_with_zero_ledgers
        claim_type: initial_state
        grounds:
          - state_machines.BidRound.initial_state
          - entities.BidRound
        distinguishing_aspect: |
          A newly created round is DRAFT with reopen_count 0, the default max_reopen_count 2, a
          null preference_honor_rate (not 0.0000, which would be indistinguishable from a run that
          honoured nobody) and both bid counters at 0.
        test_recipe:
          setup:
            - "One OPEN cycle with one ShiftTemplate."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SchedulingManager
            - call: "POST /planning-cycles"
              payload: { name: "W37-INIT", horizon_start_date: "2026-09-07", horizon_end_date: "2026-09-13", interval_minutes: 30, requirement_basis: "MAX_OF_BOTH", ot_budget_cents: 1000000, intraday_alert_short_threshold: 99 }
              as: CapacityPlanner
              captures: { cyc_id: "$.data.id" }
