      - name: corner_execute_fee_disposition_conveys_site_and_converts_period
        claim_type: side_effect_execution
        grounds:
          - state_machines.JointDevelopmentAgreement.BOARD_APPROVED_to_EXECUTED
          - state_machines.AgencySite.UNDER_AGREEMENT_to_CONVEYED
          - state_machines.ExclusiveNegotiationPeriod.ACTIVE_to_CONVERTED
          - endpoints[POST /jda/agreements/{id}/execute]
          - calculations.consideration_value
        distinguishing_aspect: |
          Execution of a FEE_DISPOSITION agreement fires all three declared side effects at once:
          negotiation_status EXECUTED with execution_date 2026-08-25, AgencySite CONVEYED (the GROUND_LEASE
          branch would have left it UNDER_AGREEMENT) and the governing period CONVERTED — and the site's
          federal_approval_status was NOT_REQUIRED from creation because federal_interest_pct is 0.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z"
            - "LOCAL_ONLY AgencySite with federal_interest_pct 0, certified score 70.25 (tier READY), awarded to a FEE_DISPOSITION proposal"
            - "CERTIFIED FMV_STRICT valuation at 42000000 cents, so permissible_floor_cents == 42000000"
            - "BOARD_APPROVED FEE_DISPOSITION agreement with purchase_price_cents 42000000 and federal_approval_status NOT_REQUIRED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
