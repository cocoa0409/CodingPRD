      - name: aggregate_bay_capacity_counted_across_overlapping_slots
        claim_type: Aggregate validation
        grounds:
          - validations.priority_62_ERR_BAY_CAPACITY_CONFLICT
        distinguishing_aspect: |
          Each individual slot is legal, and only the collective overlap count exceeds the bay's
          concurrent_capacity; adjacency at a shared endpoint must not count.
        excluded_because:
          difficulty_instance: work_bay_aggregate_capacity_half_open_adjacency_allowed
          rationale: |
            §1.8 fills BAY-2 to its capacity of 2, proves the third overlapping slot is refused, and
            then shows an adjacent slot starting exactly on the incumbent's end_date is accepted —
            the aggregate claim plus its half-open boundary in one instance.

  # =========================================================================
  # 5. From Table 5 (Endpoints)
  # =========================================================================
  # No endpoint in §1.5 accepts a collection of items, so the guide's "Bulk action"
  # row has no applicable instance in this scaffold.
  - section: endpoints
    instances:

      - name: work_bay_create_read_list_and_set_status_round_trip
        claim_type: Standard CRUD
        grounds:
          - endpoints.POST_/upfit/work-bays
          - endpoints.GET_/upfit/work-bays/{work_bay_id}
          - endpoints.GET_/upfit/work-bays
          - endpoints.POST_/upfit/work-bays/{work_bay_id}/set-status
        distinguishing_aspect: |
          WorkBay is the only catalog entity with a mutating write besides its create, so the CRUD
          round trip has a real update leg: set-status must flip ACTIVE to DOWN, bump version, and
          leave the array-valued supported_body_types untouched. The list leg is checked with the
          status filter AND paging at once (limit 1, offset 1) so that a filter applied after
          pagination — the classic ordering bug — is visible in total_count.
        test_recipe:
          setup:
            - "Three work bays exist: BAY-1 (capacity 1, SERVICE + FLATBED), BAY-2 (capacity 2, SERVICE + DUMP + FLATBED + VAN) and BAY-3 (capacity 1, VAN)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
            - call: "POST /upfit/work-bays"
              payload: { code: "BAY-1", concurrent_capacity: 1, supported_body_types: ["SERVICE", "FLATBED"] }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { bay1: "$.data.id" }
            - call: "POST /upfit/work-bays"
              payload: { code: "BAY-2", concurrent_capacity: 2, supported_body_types: ["SERVICE", "DUMP", "FLATBED", "VAN"] }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { bay2: "$.data.id" }
            - call: "POST /upfit/work-bays"
              payload: { code: "BAY-3", concurrent_capacity: 1, supported_body_types: ["VAN"] }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { bay3: "$.data.id", bay3_v: "$.data.version" }
          trigger:
            - call: "POST /upfit/work-bays/${bay3}/set-status"
              payload: { status: "DOWN" }
              as: PlantAdmin
              as_user_id: "adm-1"
          assert:
            - "the create leg returned 201 with status \"ACTIVE\" (the declared default), a generated id, created_at, updated_at and version 1"
            - "GET /upfit/work-bays/${bay1} as InstallTechnician tech-1 returns 200 with code \"BAY-1\", concurrent_capacity 1 and supported_body_types == [\"SERVICE\", \"FLATBED\"] in the stored order"
            - "the trigger returns 200 with WorkBay.${bay3}.status == \"DOWN\", version ${bay3_v} + 1 and supported_body_types still [\"VAN\"]"
            - "GET /upfit/work-bays?status=ACTIVE reports total_count 2 and lists only BAY-1 and BAY-2"
            - "GET /upfit/work-bays?status=ACTIVE&limit=1&offset=1 returns exactly one row, has_more false and total_count still 2 — the filter is applied before the window, not after"
            - "GET /upfit/work-bays?status=DOWN returns BAY-3 alone"

      - name: allocate_chassis_links_the_order_and_the_unit_in_both_directions
        claim_type: Cross-reference link
        grounds:
          - endpoints.POST_/upfit/upfit-orders/{upfit_order_id}/allocate-chassis
          - validations.priority_83_ERR_CHASSIS_MODEL_MISMATCH
          - entities.Chassis.fields.allocated_upfit_order_id
        distinguishing_aspect: |
          The link is a cross-reference between two independent roots, and BOTH must exist and agree
          on their chassis model: an F450 unit cannot be bound to an order whose configuration is
          drawn on the F550. Once the correct unit is bound the association has to be visible from
          both ends AND change the unit's commercial status — a CUSTOMER_SPECIFIC allocation restamps
          ownership from POOL_STOCK to CUSTOMER_ASSIGNED, which a one-directional link update misses.
        test_recipe:
          setup:
            - "A CUSTOMER_SPECIFIC service order on a CFG-SVC-A configuration drawn on F550-DRW-84CA, one inspected F450-SRW-60CA unit and one inspected F550-DRW-84CA unit, both POOL_STOCK."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
