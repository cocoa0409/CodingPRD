            - "after the third trigger call Milestone.${ms1_id}.status == RELEASED and released_by_user_id == mgr-release-14"
            - "Appointment.${ap_id}.fulfillment_status == NO_SHOW and scheduling_status == CANCELLED"
            - "Appointment.${ap_id}.cancellation_fee_cents == 25200 and ServiceOrder.${so_id}.deposit_forfeited_cents == 25000"
            - "Client.${cl_id}.account_credit_cents == 174800"

  # =========================================================================
  # RULE 8 - resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: route_day_half_open_intervals_allow_touching_stops
        grounds:
          - validations[priority=49]
          - calculations.appointment_travel_buffer
          - calculations.route_day_committed_minutes
          - errors[ERR_APPOINTMENT_OVERLAP]
          - entities.RouteDay.fields.committed_minutes
        distinguishing_aspect: |
          The resource is a RouteDay and the interval semantics are HALF-OPEN
          [start, start + total_block_minutes): a stop beginning at the exact minute the
          previous stop ends is ACCEPTED, while a stop beginning one minute earlier is
          rejected. Touching is legal here and illegal in the MoveJob rule.
        test_recipe:
          setup:
            - "The clock sits at its startup default 2026-05-01T00:00:00Z."
            - "One client with three ZONE_A locations carrying three DIFFERENT address_keys, and three UPRIGHT instruments, one at each address."
            - "One APPRENTICE technician serving ZONE_A holds an OPEN route day for 2026-05-04 with the default 480-minute capacity."
            - "Instrument 1 already occupies 09:00 to 10:25 (60 service minutes plus a 25-minute in-zone travel buffer)."
          setup_api_calls:
            - call: "POST /clients"
              payload: { display_name: "Trilogy Trust", email: "trilogy@example.com", phone: "555-0240", home_zone_code: "ZONE_A", client_type: "INDIVIDUAL" }
              as: ShopManager
              captures: { cl_id: "$.data.id" }
            - call: "POST /locations"
              payload: { client_id: "${cl_id}", label: "Site 1", zone_code: "ZONE_A", address_key: "site-one", distance_miles_from_shop: 4.0, stair_flights: 0 }
              as: ShopManager
              captures: { loc1: "$.data.id" }
            - call: "POST /locations"
              payload: { client_id: "${cl_id}", label: "Site 2", zone_code: "ZONE_A", address_key: "site-two", distance_miles_from_shop: 5.0, stair_flights: 0 }
              as: ShopManager
              captures: { loc2: "$.data.id" }
            - call: "POST /locations"
              payload: { client_id: "${cl_id}", label: "Site 3", zone_code: "ZONE_A", address_key: "site-three", distance_miles_from_shop: 6.0, stair_flights: 0 }
              as: ShopManager
              captures: { loc3: "$.data.id" }
            - call: "POST /instruments"
              payload: { client_id: "${cl_id}", current_location_id: "${loc1}", make: "Yamaha", model: "b1", serial_number: "SN-D15-0001", instrument_class: "UPRIGHT", usage_tier: "HOME" }
              as: ShopManager
              captures: { inst1: "$.data.id" }
            - call: "POST /instruments"
              payload: { client_id: "${cl_id}", current_location_id: "${loc2}", make: "Yamaha", model: "b2", serial_number: "SN-D15-0002", instrument_class: "UPRIGHT", usage_tier: "HOME" }
              as: ShopManager
              captures: { inst2: "$.data.id" }
            - call: "POST /instruments"
              payload: { client_id: "${cl_id}", current_location_id: "${loc3}", make: "Yamaha", model: "b3", serial_number: "SN-D15-0003", instrument_class: "UPRIGHT", usage_tier: "HOME" }
              as: ShopManager
              captures: { inst3: "$.data.id" }
            - call: "POST /technicians"
              payload: { display_name: "Tech A15", certification_level: "APPRENTICE", zone_codes: ["ZONE_A"] }
              as: PlatformAdmin
              captures: { tech_id: "$.data.id" }
            - call: "POST /route-days"
              payload: { technician_id: "${tech_id}", service_date: "2026-05-04" }
              as: ShopManager
              captures: { rd_id: "$.data.id", rd_v0: "$.data.version" }
            - call: "POST /appointments"
              payload: { instrument_id: "${inst1}", route_day_id: "${rd_id}", location_id: "${loc1}", scheduled_start_utc: "2026-05-04T09:00:00Z", service_type: "TUNE", expected_route_day_version: "${rd_v0}" }
              as: ShopManager
              captures: { ap1: "$.data.id" }
            - call: "GET /route-days/${rd_id}"
              payload: {}
              as: ShopManager
              captures: { rd_v1: "$.data.version" }
          trigger:
            - call: "POST /appointments"
              payload: { instrument_id: "${inst2}", route_day_id: "${rd_id}", location_id: "${loc2}", scheduled_start_utc: "2026-05-04T10:25:00Z", service_type: "TUNE", expected_route_day_version: "${rd_v1}" }
              as: ShopManager
              captures: { ap2: "$.data.id" }
            - call: "GET /route-days/${rd_id}"
              payload: {}
              as: ShopManager
              captures: { rd_v2: "$.data.version" }
            - call: "POST /appointments"
              payload: { instrument_id: "${inst3}", route_day_id: "${rd_id}", location_id: "${loc3}", scheduled_start_utc: "2026-05-04T10:24:00Z", service_type: "TUNE", expected_route_day_version: "${rd_v2}" }
              as: ShopManager
              captures: { err_overlap: "$.data.error_id" }
          assert:
            - "Appointment.${ap1}.service_minutes == 60, travel_buffer_minutes == 25 and total_block_minutes == 85"
            - "Appointment.${ap2} was created: its interval starts at the exact minute ${ap1} ends, and half-open intervals do not intersect when they merely touch"
            - "Appointment.${ap2}.same_address_chained == false and travel_buffer_minutes == 25"
            - "the third trigger call returns HTTP 409 with error_id ERR_APPOINTMENT_OVERLAP"
            - "RouteDay.${rd_id}.committed_minutes == 170 and stop_count == 2"

      - name: move_window_buffered_closed_interval_rejects_a_sixty_minute_gap
        grounds:
          - validations[priority=51]
          - errors[ERR_MOVE_WINDOW_CONFLICT]
          - entities.MoveJob.fields.scheduled_window_start_utc
          - entities.MoveJob.fields.scheduled_window_end_utc
        distinguishing_aspect: |
          The resource is an Instrument's move calendar and the interval semantics are a
          CLOSED interval widened by MOVE_WINDOW_BUFFER_MINUTES (90) on both sides, so
          touching endpoints DO collide - the exact opposite of the half-open route-day
          rule. A second window starting 90 minutes after the first ends still collides,
          and only 91 minutes clears it.
        test_recipe:
          setup:
            - "One client with two ZONE_A locations and one GRAND instrument."
            - "One move job already occupies 2026-05-10T09:00:00Z to 2026-05-10T11:00:00Z."
          setup_api_calls:
            - call: "POST /clients"
              payload: { display_name: "Winward Hall", email: "winward@example.com", phone: "555-0250", home_zone_code: "ZONE_A", client_type: "INDIVIDUAL" }
              as: ShopManager
              captures: { cl_id: "$.data.id" }
            - call: "POST /locations"
              payload: { client_id: "${cl_id}", label: "Origin", zone_code: "ZONE_A", address_key: "70-winward", distance_miles_from_shop: 10.0, stair_flights: 0 }
              as: ShopManager
              captures: { loc_o: "$.data.id" }
            - call: "POST /locations"
              payload: { client_id: "${cl_id}", label: "Destination", zone_code: "ZONE_A", address_key: "71-winward", distance_miles_from_shop: 12.0, stair_flights: 0 }
              as: ShopManager
              captures: { loc_d: "$.data.id" }
            - call: "POST /instruments"
              payload: { client_id: "${cl_id}", current_location_id: "${loc_o}", make: "Bluthner", model: "Model 6", serial_number: "SN-D16-0001", instrument_class: "GRAND", usage_tier: "PERFORMANCE" }
              as: ShopManager
              captures: { inst_id: "$.data.id" }
            - call: "POST /move-jobs"
              payload: { instrument_id: "${inst_id}", origin_location_id: "${loc_o}", destination_location_id: "${loc_d}", distance_miles: 12.0, scheduled_window_start_utc: "2026-05-10T09:00:00Z", scheduled_window_end_utc: "2026-05-10T11:00:00Z" }
              as: MoveCoordinator
              captures: { mj1: "$.data.id" }
          trigger:
            - call: "POST /move-jobs"
              payload: { instrument_id: "${inst_id}", origin_location_id: "${loc_d}", destination_location_id: "${loc_o}", distance_miles: 12.0, scheduled_window_start_utc: "2026-05-10T12:30:00Z", scheduled_window_end_utc: "2026-05-10T14:30:00Z" }
              as: MoveCoordinator
              captures: { err_window: "$.data.error_id" }
            - call: "POST /move-jobs"
              payload: { instrument_id: "${inst_id}", origin_location_id: "${loc_d}", destination_location_id: "${loc_o}", distance_miles: 12.0, scheduled_window_start_utc: "2026-05-10T12:31:00Z", scheduled_window_end_utc: "2026-05-10T14:31:00Z" }
              as: MoveCoordinator
              captures: { mj2: "$.data.id" }
          assert:
            - "the first trigger call returns HTTP 409 with error_id ERR_MOVE_WINDOW_CONFLICT because widening its start by 90 minutes lands it exactly on 11:00:00Z, the closed end of ${mj1}"
            - "the second trigger call succeeds: widening its start by 90 minutes lands on 11:01:00Z, one minute clear of ${mj1}"
            - "MoveJob.${mj2}.distance_band == LOCAL and MoveJob.${mj2}.distance_variant == FLAT_LOCAL"
            - "MoveJob.${mj2}.total_cents == 74000"
            - "GET /move-jobs with instrument_id=${inst_id} returns exactly 2 rows"

  # =========================================================================
  # RULE 9 - compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: parts_lot_unit_conservation_across_allocate_and_release
        grounds:
          - conservation_invariants[parts-quantity-conservation]
          - calculations.parts_allocation_resolution
          - state_machines.PartsAllocation.status.RESERVED_to_RELEASED
          - state_machines.PartsLot.status.DEPLETED_to_OPEN
          - entities.PartsLot.fields.on_hand_qty
          - entities.PartsLot.fields.allocated_qty
          - entities.PartsLot.fields.consumed_qty
        distinguishing_aspect: |
          The conserved quantity is PHYSICAL PART UNITS:
          on_hand_qty + allocated_qty + consumed_qty equals initial_qty (4) both after the
          forward reserve and after its compensating release, and the lot's own status
          returns from DEPLETED to OPEN with zero drift.
        test_recipe:
          setup:
            - "One INDIVIDUAL client, one UPRIGHT instrument at REBUILD_REQUIRED, one MASTER technician."
            - "An approved REBUILD quote has produced a PENDING service order."
            - "One HAMMER_SET parts lot has been received with initial_qty 4, so on_hand_qty is 4, allocated_qty 0 and consumed_qty 0."
          setup_api_calls:
            - call: "POST /clients"
              payload: { display_name: "Aldwin Trust", email: "aldwin@example.com", phone: "555-0260", home_zone_code: "ZONE_A", client_type: "INDIVIDUAL" }
              as: ShopManager
              captures: { cl_id: "$.data.id" }
            - call: "POST /locations"
              payload: { client_id: "${cl_id}", label: "Hall", zone_code: "ZONE_A", address_key: "90-aldwin", distance_miles_from_shop: 3.0, stair_flights: 0 }
              as: ShopManager
              captures: { loc_id: "$.data.id" }
            - call: "POST /instruments"
              payload: { client_id: "${cl_id}", current_location_id: "${loc_id}", make: "Estonia", model: "L168", serial_number: "SN-D17-0001", instrument_class: "UPRIGHT", usage_tier: "HOME" }
              as: ShopManager
              captures: { inst_id: "$.data.id" }
            - call: "POST /technicians"
              payload: { display_name: "Tech M17", certification_level: "MASTER", zone_codes: ["ZONE_A"] }
              as: PlatformAdmin
              captures: { tech_id: "$.data.id" }
            - call: "POST /instruments/${inst_id}/pitch-assessments"
              payload: { reference_pitch_hz: 440.0, measured_deviation_cents: 60.0 }
              as: ShopManager
            - call: "POST /instruments/${inst_id}/condition-transitions"
              payload: { to_condition_status: "REBUILD_REQUIRED", note: "pinblock failure" }
              as: ShopManager
            - call: "GET /instruments/${inst_id}"
              payload: {}
              as: ShopManager
              captures: { inst_v: "$.data.version" }
            - call: "POST /quotes"
              payload: { instrument_id: "${inst_id}", service_type: "REBUILD", expected_instrument_version: "${inst_v}" }
              as: ShopManager
              captures: { q_id: "$.data.id" }
            - call: "POST /quotes/${q_id}/issue"
              payload: {}
              as: ShopManager
            - call: "POST /quotes/${q_id}/approve"
              payload: {}
              as: Client
              as_user_id: "${cl_id}"
            - call: "POST /service-orders"
              payload: { quote_id: "${q_id}", assigned_technician_id: "${tech_id}" }
              as: ShopManager
              captures: { so_id: "$.data.id" }
            - call: "POST /parts-lots"
              payload: { part_type: "HAMMER_SET", lot_code: "LOT-D17-A", initial_qty: 4 }
              as: ShopManager
              captures: { lot_id: "$.data.id", lot_v: "$.data.version" }
          trigger:
            - call: "POST /service-orders/${so_id}/parts-allocations"
              payload: { parts_lot_id: "${lot_id}", requested_qty: 4, expected_parts_lot_version: "${lot_v}" }
              as: ShopManager
              captures: { alloc_id: "$.data.id" }
            - call: "POST /parts-allocations/${alloc_id}/release"
              payload: {}
              as: ShopManager
          assert:
            - "after the first trigger call PartsAllocation.${alloc_id}.status == RESERVED and allocated_qty == 4"
            - "after the first trigger call PartsLot.${lot_id} reads on_hand_qty 0, allocated_qty 4, consumed_qty 0 and status DEPLETED, so 0 + 4 + 0 == initial_qty 4"
            - "after the second trigger call PartsAllocation.${alloc_id}.status == RELEASED"
            - "after the second trigger call PartsLot.${lot_id} reads on_hand_qty 4, allocated_qty 0, consumed_qty 0 and status OPEN, so 4 + 0 + 0 == initial_qty 4"
            - "PartsLot.${lot_id}.initial_qty is still 4 - the compensating action restored the pool with zero drift"

      - name: client_ledger_conservation_across_credit_and_reversal
        grounds:
          - conservation_invariants[client-ledger-conservation]
          - calculations.client_balance
          - state_machines.Warranty.status.ACTIVE_to_VOIDED
          - state_machines.WarrantyClaim.status.SUBMITTED_to_DENIED
          - entities.LedgerEntry.fields.reverses_entry_id
