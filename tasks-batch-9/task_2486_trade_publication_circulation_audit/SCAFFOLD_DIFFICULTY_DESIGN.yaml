  - rule_id: priority_pair_validation_conflict
    instances:
      - name: certify_filed_statement_by_preparer_rejects_not_draft_over_sod
        grounds:
          - validations[priority=30]
          - validations[priority=40]
          - entities.CirculationStatement.fields.prepared_by_user_id
          - entities.CirculationStatement.fields.certified_by_user_id
        distinguishing_aspect: |
          One request violates a `state` rule (priority 30, statement no longer DRAFT) and a
          `business_safety` rule (priority 40, the preparer certifying its own statement)
          simultaneously; the lower priority number must win, so the response is
          ERR_STATEMENT_NOT_DRAFT and never ERR_SEGREGATION_OF_DUTIES. Category pair: state vs
          business_safety.
        test_recipe:
          setup:
            - "publication with no recipients (all copy counters 0, audit_posture OPEN)"
            - "clock at the default 2026-08-01T00:00:00Z, so the period [2026-01-01, 2026-04-01) has closed"
            - "a statement for that period prepared by user mgr-01 and already certified by exec-01, hence FILED"
          setup_api_calls:
            - call: "POST /circulation/publications"
              payload: { name: "Trade Compliance Monthly", frequency: "MONTHLY", industry_code: "LOGISTICS" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { pub_id: $.data.id }
            - call: "GET /circulation/publications/${pub_id}"
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { pub_ver_1: $.data.version }
            - call: "POST /circulation/statements"
              payload: { publication_id: "${pub_id}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z", basis: "AS_OF_PERIOD_END", expected_publication_version: "${pub_ver_1}" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { st_id: $.data.id }
            - call: "POST /circulation/statements/${st_id}/certify"
              payload: { certification_note: "Q1 statement" }
              as: PublisherExecutive
              as_user_id: "exec-01"
          trigger:
            - call: "POST /circulation/statements/${st_id}/certify"
              payload: { certification_note: "preparer tries to re-certify" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { err: $.data.error_id }
          assert:
            - "the trigger returns HTTP 409 with ${err} == ERR_STATEMENT_NOT_DRAFT"
            - "${err} != ERR_SEGREGATION_OF_DUTIES even though X-User-ID equals prepared_by_user_id"
            - "CirculationStatement.${st_id}.status is still FILED and certified_by_user_id is still exec-01"
            - "CirculationStatement.${st_id}.declared_total_copies == 0 (unchanged by the rejected call)"

      - name: verify_with_purged_doc_and_low_score_rejects_purged_over_threshold
        grounds:
          - validations[priority=50]
          - validations[priority=70]
          - calculations.qualification_score
          - entities.SourceDocument.fields.purge_status
        distinguishing_aspect: |
          A different category pair from the other instance: `business_referential` (priority 50,
          purged source documentation) against `business_constraint` (priority 70, computed_score 65
          below the 70 threshold). Both are violated by the same verify call, and the referential
          failure must be reported, proving evidence integrity is adjudicated before scoring.
        test_recipe:
          setup:
            - "publication with source_doc_retention_months 1 and all three qualification rules (JOB_FUNCTION 45 mandatory, INDUSTRY 30, PURCHASING_AUTHORITY 25)"
            - "a recipient whose attested purchasing authority is outside the allowed values, so base points are 75"
            - "a request signed 2025-06-01 through the TELEPHONE channel, already reviewed, whose computed_score is 65"
            - "the source document captured 2026-07-15 has passed its one-month retention and has been purged at clock 2026-08-20"
          setup_api_calls:
            - call: "POST /circulation/publications"
              payload: { name: "Short Retention Gazette", frequency: "MONTHLY", industry_code: "MANUFACTURING", source_doc_retention_months: 1 }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { pub_id: $.data.id }
            - call: "POST /circulation/publications/${pub_id}/qualification-rules"
              payload: { dimension: "JOB_FUNCTION", allowed_values: ["ENGINEERING_MGMT"], points: 45, is_mandatory: true }
              as: CirculationManager
              as_user_id: "mgr-01"
            - call: "POST /circulation/publications/${pub_id}/qualification-rules"
              payload: { dimension: "INDUSTRY", allowed_values: ["MANUFACTURING"], points: 30, is_mandatory: false }
              as: CirculationManager
              as_user_id: "mgr-01"
            - call: "POST /circulation/publications/${pub_id}/qualification-rules"
              payload: { dimension: "PURCHASING_AUTHORITY", allowed_values: ["APPROVES"], points: 25, is_mandatory: false }
              as: CirculationManager
              as_user_id: "mgr-01"
            - call: "POST /circulation/subscribers"
              payload: { publication_id: "${pub_id}", company_name: "Halcyon Machining", contact_email: "h@halcyon.test", job_function_code: "ENGINEERING_MGMT", industry_code: "MANUFACTURING", purchasing_authority_level: "NONE", subscription_class: "CONTROLLED", copies: 40 }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { sub_h_id: $.data.id, sub_h_ver: $.data.version }
            - call: "POST /circulation/subscribers/${sub_h_id}/source-documents"
              payload: { doc_type: "TELEPHONE_SCRIPT_LOG", captured_at: "2026-07-15T00:00:00Z", storage_ref: "s3://circ/h-log" }
              as: QualificationSpecialist
              as_user_id: "qs-01"
              captures: { doc_h_id: $.data.id }
            - call: "POST /circulation/qualification-requests"
              payload: { subscriber_id: "${sub_h_id}", source_document_id: "${doc_h_id}", request_channel: "TELEPHONE", signed_at: "2025-06-01T00:00:00Z", attested_job_function_code: "ENGINEERING_MGMT", attested_industry_code: "MANUFACTURING", attested_purchasing_authority: "NONE", expected_subscriber_version: "${sub_h_ver}" }
              as: QualificationSpecialist
              as_user_id: "qs-01"
              captures: { req_h_id: $.data.id }
            - call: "POST /circulation/qualification-requests/${req_h_id}/review"
              payload: { review_note: "stale signature, weak authority" }
              as: QualificationSpecialist
              as_user_id: "qs-01"
              captures: { score_at_review: $.data.computed_score }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: CirculationManager
              as_user_id: "mgr-01"
            - call: "POST /circulation/source-documents/${doc_h_id}/purge"
              payload: { purge_reason: "one-month retention elapsed" }
              as: CirculationManager
              as_user_id: "mgr-01"
          trigger:
            - call: "POST /circulation/qualification-requests/${req_h_id}/verify"
              payload: { decision_reason: "attempt to verify on purged evidence" }
              as: QualificationSpecialist
              as_user_id: "qs-01"
              captures: { err: $.data.error_id }
          assert:
            - "${score_at_review} == 65 (base 45 + 30 + 0, TELEPHONE bonus 0, staleness penalty 10 for a 14-month-old signature)"
            - "the trigger returns HTTP 422 with ${err} == ERR_SOURCE_DOCUMENT_PURGED"
            - "${err} != ERR_QUALIFICATION_SCORE_BELOW_THRESHOLD even though 65 < 70"
            - "QualificationRequest.${req_h_id}.status is still UNDER_REVIEW and Subscriber.${sub_h_id}.qualification_status is still PENDING_QUALIFICATION"
            - "SourceDocument.${doc_h_id}.purge_status == PURGED and purged_at == 2026-08-20T00:00:00Z"

  - rule_id: boundary_precision_check
    instances:
      - name: qualification_score_exactly_at_threshold_boundary
        grounds:
          - calculations.qualification_score
          - validations[priority=70]
          - entities.QualificationRequest.fields.computed_score
          - entities.Subscriber.fields.qualification_expires_at
        distinguishing_aspect: |
          Metric: computed_score against QUALIFY_SCORE_THRESHOLD on POST
          /circulation/qualification-requests/{id}/verify. A 13-month-old signature scores exactly 70
          (75 base minus a 5-point staleness penalty) and MUST qualify, while a 14-month-old
          signature scores 65 and MUST be refused — the comparison is >=, and one month of signature
          age is the smallest step that moves it.
        test_recipe:
          setup:
            - "publication with all three qualification rules (JOB_FUNCTION 45 mandatory, INDUSTRY 30, PURCHASING_AUTHORITY 25) and default qualification_validity_months 36"
            - "recipient SF with a TELEPHONE request signed 2025-07-01, reviewed, attested authority outside allowed_values so base is 75"
            - "recipient SG identical except the request is signed 2025-06-01"
