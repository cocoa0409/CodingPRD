            - "the first OFFER returns 422 with data.error_id == \"ERR_RENEWAL_REQUIRES_ANALYSIS\""
            - "GET /carriage/agreements/${ac_id} after that call still returns renewal_status == \"RENEWAL_ANALYSIS\""
            - "the analysis POST returns 201 with data.variant == \"BASE_CASE\" and data.latest_accepted_report_id == ${r1_id}"
            - "the second OFFER returns 200 with data.renewal_status == \"RENEWAL_OFFERED\" and data.lifecycle_status == \"EXECUTED\""

      - name: audit_engagement_fieldwork_branch_selection
        claim_type: invalid_transitions
        grounds:
          - state_machines.AuditEngagement.FIELDWORK_to_FINDINGS_ISSUED
          - state_machines.AuditEngagement.FIELDWORK_to_CLOSED_NO_FINDING
          - errors[ERR_FINDINGS_PRESENT_CANNOT_CLOSE]
          - errors[ERR_NO_AUDIT_FINDINGS]
        excluded_because:
          difficulty_instance: audit_fieldwork_forks_on_presence_of_findings
          rationale: >-
            The §1.8 non_linear_state_machine instance already drives FIELDWORK down
            both forks from identical setups and pins the mutually exclusive
            rejections ERR_NO_AUDIT_FINDINGS and ERR_FINDINGS_PRESENT_CANNOT_CLOSE,
            so a breadth restatement here would duplicate its assertions verbatim.

      - name: accepted_report_cycle_through_audit_adjusted
        claim_type: idempotency
        grounds:
          - state_machines.SubscriberReport.ACCEPTED_to_AUDIT_ADJUSTED
          - state_machines.SubscriberReport.AUDIT_ADJUSTED_to_ACCEPTED
          - entities.SubscriberReport.fields.audit_adjustment_cents
        excluded_because:
          difficulty_instance: accepted_report_reenters_accepted_after_audit_adjustment
          rationale: >-
            The §1.8 non_linear instance already asserts the cyclic return to
            ACCEPTED and, crucially, that the second arrival is NOT idempotent with
            the first — audit_adjustment_cents is non-zero and
            consecutive_compliant_periods does not double-count — which is exactly
            what this corner would test.

  # ===========================================================================
  # SECTION 3 — calculations
