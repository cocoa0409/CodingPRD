  - section: RBAC
    instances:
      - name: participant_admin_performs_its_exclusive_and_shared_operations
        claim_type: Exclusive and shared operations permitted
        grounds:
          - roles.ParticipantAdmin.exclusive_operations
          - roles.ParticipantAdmin.shared_operations
          - state_machines.Participant.APPLIED_to_WITHDRAWN
          - endpoints.GET_/hie/participants/{id}/scorecard
        distinguishing_aspect: |
          ParticipantAdmin is entity_backed:Participant, so every one of its permitted operations must
          work when X-User-ID equals the participant's own id: the two exclusive onboarding actions
          (SUBMIT_FOR_LEGAL_REVIEW and WITHDRAW) and three shared operations (scheduling a conformance
          test, contributing a patient record, reading the scorecard). The chain also pins WITHDRAW's
          declared side effect - a RUNNING ConformanceTest is force-FAILED with failure_categories
          [TRANSPORT] - which distinguishes a real transition from a bare status overwrite.
        test_recipe:
          setup:
            - "A PROBABILISTIC_ONLY generation is ACTIVE. One participant is freshly APPLIED and has no data feeds."
          setup_api_calls:
            - call: "POST /hie/match-threshold-configs"
              payload: { config_label: "REF-PROB-R1", auto_link_threshold: 0.9200, review_lower_bound: 0.7500, score_variant_mode: "PROBABILISTIC_ONLY", weight_family_name: 0.20, weight_given_name: 0.12, weight_birth_date: 0.25, weight_ssn_last4: 0.28, weight_postal_code: 0.08, weight_phone_digits: 0.07, partial_credit_factor: 0.50 }
              as: PrivacyOfficer
              as_user_id: "privacy-tuner-1"
              captures: { cfgR1_id: $.data.id }
            - call: "POST /hie/match-threshold-configs/${cfgR1_id}/activation"
              payload: {}
              as: PrivacyOfficer
              as_user_id: "privacy-tuner-1"
            - call: "POST /hie/participants"
              payload: { legal_name: "Westbrook Family Health Center", org_type: "CLINIC", declared_annual_patient_volume: 30000, primary_contact_email: "hie@westbrook.example" }
              as: HieAdmin
              captures: { pR1_id: $.data.id }
          trigger:
            - call: "POST /hie/participants/${pR1_id}/onboarding-transitions"
              payload: { action: "SUBMIT_FOR_LEGAL_REVIEW" }
              as: ParticipantAdmin
              as_user_id: "${pR1_id}"
              captures: { pR1_s1: $.data.onboarding_status }
            - call: "POST /hie/participants/${pR1_id}/onboarding-transitions"
              payload: { action: "EXECUTE_AGREEMENT", agreement_version: "DURSA-2026.1", signed_at: "2026-08-01T00:00:00Z" }
              as: HieAdmin
              as_user_id: "admin-legal-1"
              captures: { pR1_s2: $.data.onboarding_status }
            - call: "POST /hie/participants/${pR1_id}/conformance-tests"
              payload: { profile: "ADT_PUBLISHER", scheduled_start: "2026-08-01T00:00:00Z", scheduled_end: "2026-08-01T06:00:00Z" }
              as: ParticipantAdmin
              as_user_id: "${pR1_id}"
              captures: { ctR1_id: $.data.id, ctR1_status: $.data.status }
            - call: "POST /hie/participants/${pR1_id}/patient-records"
              payload: { source_mrn: "R1-0001", given_name: "Winifred", family_name: "Baptiste", birth_date: "1994-03-30", sex: "F", ssn_last4: "5512", postal_code: "04101", phone_digits: "2075550122" }
              as: ParticipantAdmin
              as_user_id: "${pR1_id}"
              captures: { recR1_id: $.data.id, recR1_state: $.data.match_state }
            - call: "GET /hie/participants/${pR1_id}/scorecard"
              payload: {}
              as: ParticipantAdmin
              as_user_id: "${pR1_id}"
              captures: { scR1_samples: $.data.samples_counted, scR1_score: $.data.quality_score, scR1_grade: $.data.grade }
            - call: "POST /hie/participants/${pR1_id}/onboarding-transitions"
              payload: { action: "WITHDRAW", reason: "Board vote reversed the participation decision" }
              as: ParticipantAdmin
              as_user_id: "${pR1_id}"
              captures: { pR1_s3: $.data.onboarding_status }
            - call: "GET /hie/conformance-tests/${ctR1_id}"
              payload: {}
              as: HieAdmin
              captures: { ctR1_status_after: $.data.status, ctR1_categories: "$.data.failure_categories[0]" }
          assert:
            - "${pR1_s1} == LEGAL_REVIEW"
            - "${pR1_s2} == CONFORMANCE_TESTING"
            - "${ctR1_status} == RUNNING"
            - "${recR1_state} == CLUSTERED"
            - "${scR1_samples} == 0"
            - "${scR1_score} == null"
            - "${scR1_grade} == UNGRADED"
            - "${pR1_s3} == WITHDRAWN"
            - "${ctR1_status_after} == FAILED"
            - "${ctR1_categories} == TRANSPORT"
      - name: each_role_is_refused_the_other_roles_exclusive_operations
        claim_type: Other roles exclusive operations denied
        grounds:
          - errors.ERR_ROLE_NOT_PERMITTED
          - validations.priority_2
          - roles.HieAdmin.exclusive_operations
          - roles.PrivacyOfficer.exclusive_operations
          - roles.Clinician.exclusive_operations
        distinguishing_aspect: |
          Priority 2 rejects a role that is absent from the endpoint's roles list, and it must fire for
          every direction of the peer matrix rather than only for the obvious "non-admin attempts admin"
          case: PrivacyOfficer cannot register a participant, Clinician cannot author a consent policy,
          ParticipantAdmin cannot move the logical clock, PublicHealthOfficer cannot break the glass,
          HieAdmin cannot claim a privacy review, and Clinician cannot read a raw patient record even
          though it may read the cluster the record belongs to. Every one of these six is refused before
          any body or state check, so all six payloads are otherwise perfectly valid.
        test_recipe:
          setup:
            - "No entities are required; all six requests are refused at priority 2 before any lookup."
          setup_api_calls: []
          trigger:
            - call: "POST /hie/participants"
              payload: { legal_name: "Yellowpine Health Alliance", org_type: "HOSPITAL", declared_annual_patient_volume: 40000, primary_contact_email: "hie@yellowpine.example" }
              as: PrivacyOfficer
              as_user_id: "privacy-policy-1"
              captures: { errR2_a: $.data.error_id }
            - call: "POST /hie/consent-policies"
              payload: { policy_version: "R2-ATTEMPT", model: "OPT_IN", sensitive_categories_segmented: [], default_share_for_treatment: false, effective_from: "2026-01-01T00:00:00Z" }
              as: Clinician
              as_user_id: "clin-r2-1"
              captures: { errR2_b: $.data.error_id }
            - call: "POST /hie/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ParticipantAdmin
              as_user_id: "00000000-0000-4000-8000-0000000000ff"
              captures: { errR2_c: $.data.error_id }
            - call: "POST /hie/break-glass-accesses"
              payload: { cluster_id: "00000000-0000-4000-8000-0000000000fe", invoking_participant_id: "00000000-0000-4000-8000-0000000000ff", emergency_category: "LIFE_THREATENING", justification_text: "Unresponsive patient in the field; medication and allergy history required immediately." }
              as: PublicHealthOfficer
              as_user_id: "00000000-0000-4000-8000-0000000000ff"
              captures: { errR2_d: $.data.error_id }
            - call: "POST /hie/break-glass-accesses/00000000-0000-4000-8000-0000000000fd/review-claim"
              payload: {}
              as: HieAdmin
              captures: { errR2_e: $.data.error_id }
            - call: "GET /hie/patient-records/00000000-0000-4000-8000-0000000000fc"
              payload: {}
              as: Clinician
              as_user_id: "clin-r2-1"
              captures: { errR2_f: $.data.error_id }
          assert:
            - "${errR2_a} == ERR_ROLE_NOT_PERMITTED"
            - "${errR2_b} == ERR_ROLE_NOT_PERMITTED"
            - "${errR2_c} == ERR_ROLE_NOT_PERMITTED"
            - "${errR2_d} == ERR_ROLE_NOT_PERMITTED"
            - "${errR2_e} == ERR_ROLE_NOT_PERMITTED"
            - "${errR2_f} == ERR_ROLE_NOT_PERMITTED"
            - "all six responses carry HTTP 403 and none of them is a 404, even though four of them name ids that do not exist"
      - name: the_agreement_signatory_may_not_certify_the_same_participant
        claim_type: Segregation of duties
        grounds:
          - errors.ERR_SOD_CERTIFIER_IS_SIGNATORY
          - validations.priority_16
          - state_machines.Participant.CONFORMANCE_TESTING_to_CERTIFIED
          - entities.Participant.fields.agreement_executed_by_user_id
          - entities.Participant.fields.certified_by_user_id
        distinguishing_aspect: |
          The role_model is segregation_of_duties keyed on X-User-ID, not on role: both calls are HieAdmin
          and both are otherwise fully satisfied (all three required profiles PASSED), so the only
          difference is the operator identity. admin-legal-1, who signed the agreement, is refused with
          ERR_SOD_CERTIFIER_IS_SIGNATORY; admin-cert-1 certifies the identical participant one call
          later. The refusal must leave onboarding_status at CONFORMANCE_TESTING and certified_at null.
        test_recipe:
          setup:
            - "One participant reached CONFORMANCE_TESTING with EXECUTE_AGREEMENT performed by admin-legal-1, and has PASSED ADT_PUBLISHER, DOCUMENT_SOURCE and QUERY_RESPONDER."
          setup_api_calls:
            - call: "POST /hie/participants"
              payload: { legal_name: "Zephyr Point Medical Center", org_type: "HOSPITAL", declared_annual_patient_volume: 96000, primary_contact_email: "hie@zephyrpoint.example" }
              as: HieAdmin
              captures: { pR3_id: $.data.id }
            - call: "POST /hie/participants/${pR3_id}/onboarding-transitions"
              payload: { action: "SUBMIT_FOR_LEGAL_REVIEW" }
              as: ParticipantAdmin
              as_user_id: "${pR3_id}"
            - call: "POST /hie/participants/${pR3_id}/onboarding-transitions"
              payload: { action: "EXECUTE_AGREEMENT", agreement_version: "DURSA-2026.1", signed_at: "2026-08-01T00:00:00Z" }
              as: HieAdmin
              as_user_id: "admin-legal-1"
              captures: { pR3_signatory: $.data.agreement_executed_by_user_id }
            - call: "POST /hie/participants/${pR3_id}/conformance-tests"
              payload: { profile: "ADT_PUBLISHER", scheduled_start: "2026-08-01T00:00:00Z", scheduled_end: "2026-08-01T06:00:00Z" }
              as: HieAdmin
              captures: { ctR3_1: $.data.id }
            - call: "POST /hie/conformance-tests/${ctR3_1}/results"
              payload: { assertions_total: 200, assertions_passed: 200 }
              as: HieAdmin
            - call: "POST /hie/participants/${pR3_id}/conformance-tests"
              payload: { profile: "DOCUMENT_SOURCE", scheduled_start: "2026-08-01T00:00:00Z", scheduled_end: "2026-08-01T06:00:00Z" }
              as: HieAdmin
              captures: { ctR3_2: $.data.id }
            - call: "POST /hie/conformance-tests/${ctR3_2}/results"
              payload: { assertions_total: 200, assertions_passed: 200 }
              as: HieAdmin
            - call: "POST /hie/participants/${pR3_id}/conformance-tests"
              payload: { profile: "QUERY_RESPONDER", scheduled_start: "2026-08-01T00:00:00Z", scheduled_end: "2026-08-01T06:00:00Z" }
              as: HieAdmin
              captures: { ctR3_3: $.data.id }
            - call: "POST /hie/conformance-tests/${ctR3_3}/results"
              payload: { assertions_total: 200, assertions_passed: 200 }
              as: HieAdmin
          trigger:
            - call: "POST /hie/participants/${pR3_id}/onboarding-transitions"
              payload: { action: "CERTIFY" }
              as: HieAdmin
              as_user_id: "admin-legal-1"
              captures: { errR3: $.data.error_id }
            - call: "GET /hie/participants/${pR3_id}"
              payload: {}
              as: HieAdmin
              captures: { pR3_status_mid: $.data.onboarding_status, pR3_certified_at_mid: $.data.certified_at }
            - call: "POST /hie/participants/${pR3_id}/onboarding-transitions"
              payload: { action: "CERTIFY" }
              as: HieAdmin
              as_user_id: "admin-cert-1"
              captures: { pR3_status_after: $.data.onboarding_status, pR3_certifier: $.data.certified_by_user_id, pR3_certified_at: $.data.certified_at }
          assert:
            - "${pR3_signatory} == admin-legal-1"
            - "${errR3} == ERR_SOD_CERTIFIER_IS_SIGNATORY"
            - "${pR3_status_mid} == CONFORMANCE_TESTING"
            - "${pR3_certified_at_mid} == null"
            - "${pR3_status_after} == CERTIFIED"
            - "${pR3_certifier} == admin-cert-1"
            - "${pR3_certified_at} == 2026-08-01T00:00:00Z"
      - name: the_officer_who_activated_the_generation_may_not_steward_its_links
        claim_type: Segregation of duties
        grounds:
          - errors.ERR_SOD_STEWARD_IS_TUNER
          - validations.priority_18
          - entities.MatchThresholdConfig.fields.activated_by_user_id
          - entities.MatchLink.fields.threshold_config_id
          - state_machines.MatchLink.PENDING_REVIEW_to_LINKED
        distinguishing_aspect: |
          The second segregation-of-duties axis is keyed on the generation pinned into the link, not on
          the currently ACTIVE generation: privacy-tuner-1 activated the generation that scored this
          0.7700 link, so its CONFIRM is refused with ERR_SOD_STEWARD_IS_TUNER while privacy-steward-1
          confirms the identical request - same role, same expected_cluster_version, same decision. The
          refusal must not consume the version, which is why the successful call can reuse it.
        test_recipe:
          setup:
            - "privacy-tuner-1 created AND activated a PROBABILISTIC_ONLY generation with review_lower_bound 0.7500 and auto_link_threshold 0.9200."
            - "Two CONFORMANCE_TESTING participants each contributed one record, and the pair scores 0.7700: exact birth_date (0.25), exact ssn_last4 (0.28), exact postal_code (0.08), partial family_name (0.20 x 0.50 = 0.10), partial given_name (0.12 x 0.50 = 0.06), no phone agreement (0.00). The second contribution therefore left a PENDING_REVIEW MatchLink."
          setup_api_calls:
            - call: "POST /hie/match-threshold-configs"
              payload: { config_label: "R4-TUNED-BY-TUNER-1", auto_link_threshold: 0.9200, review_lower_bound: 0.7500, score_variant_mode: "PROBABILISTIC_ONLY", weight_family_name: 0.20, weight_given_name: 0.12, weight_birth_date: 0.25, weight_ssn_last4: 0.28, weight_postal_code: 0.08, weight_phone_digits: 0.07, partial_credit_factor: 0.50 }
