              payload: {}
              as: Underwriter
            - call: "POST /policies/${pol_id}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /claims"
              payload: { policy_id: "${pol_id}", claimant_id: "h-sd", date_of_loss: "2026-04-10T00:00:00Z", building_loss: 5000 }
              as: PolicyHolder
              as_user_id: "h-sd"
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/open-review"
              payload: {}
              as: Adjuster
              captures: { cv_stale: $.data.version }
            - call: "POST /proofs-of-loss"
              payload: { claim_id: "${claim_id}", documented_building_loss: 5000 }
