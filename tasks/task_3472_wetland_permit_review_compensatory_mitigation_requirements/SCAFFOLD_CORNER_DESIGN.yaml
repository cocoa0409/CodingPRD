            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-02T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /wetland-permits/applications/${app_id}/advance-to-decision", payload: {}, as: Reviewer, as_user_id: "rev-1", captures: { pir: "$.data.pir_score", pout: "$.data.pir_outcome" } }
