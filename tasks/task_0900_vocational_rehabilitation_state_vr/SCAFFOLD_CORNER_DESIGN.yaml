          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "Approving with expected_case_version one behind the current Case.version returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Case SERVICES_ACTIVE with a REQUESTED authorization; the client holds a case version one behind current."]
          setup_api_calls:
            - call: "POST /vr/counselors"
              payload: { name: "C1", email: "c1@vr.gov", unit: "U1" }
              as: VRAdmin
              captures: { counselor_id: $.data.id }
            - call: "POST /vr/supervisors"
              payload: { name: "S1", email: "s1@vr.gov" }
              as: VRAdmin
              captures: { supervisor_id: $.data.id }
            - call: "POST /vr/providers"
              payload: { name: "P1", service_categories: ["TRAINING"], max_concurrent_authorizations: 3 }
              as: VRAdmin
              captures: { provider_id: $.data.id }
            - call: "POST /vr/priority-categories"
              payload: { rank: 1, label: "MSD", slot_capacity: 5 }
              as: VRAdmin
              captures: { cat1_id: $.data.id }
            - call: "POST /vr/cases"
              payload: { consumer_full_name: "Al Ray", consumer_dob: "1990-01-01", disability_type: "PHYSICAL", referral_source: "DR", monthly_income_cents: 150000, budget_allocated_cents: 500000 }
              as: Counselor
              as_user_id: "${counselor_id}"
              captures: { case_id: $.data.id }
            - call: "POST /vr/cases/${case_id}/application"
              payload: {}
              as: Counselor
              as_user_id: "${counselor_id}"
            - call: "POST /vr/cases/${case_id}/eligibility"
              payload: { decision: "ELIGIBLE", disability_significance: "MSD" }
              as: Counselor
              as_user_id: "${counselor_id}"
            - call: "POST /vr/ipes"
              payload: { case_id: "${case_id}", employment_goal: "Clerk", goal_wage_target_cents: 60000 }
              as: Counselor
              as_user_id: "${counselor_id}"
              captures: { ipe_id: $.data.id }
            - call: "POST /vr/ipes/${ipe_id}/submit"
              payload: {}
              as: Counselor
              as_user_id: "${counselor_id}"
            - call: "POST /vr/ipes/${ipe_id}/approve"
              payload: {}
              as: Supervisor
              as_user_id: "${supervisor_id}"
            - call: "POST /vr/authorizations"
              payload: { case_id: "${case_id}", ipe_id: "${ipe_id}", provider_id: "${provider_id}", service_category: "TRAINING", authorized_amount_cents: 100000, comparable_benefit_cents: 0, service_period_start: "2026-05-01", service_period_end: "2026-05-31" }
              as: Counselor
              as_user_id: "${counselor_id}"
              captures: { auth_id: $.data.id }
            - call: "GET /vr/cases/${case_id}"
              payload: {}
              as: Supervisor
              as_user_id: "${supervisor_id}"
              captures: { case_v: $.data.version }
          trigger:
            - call: "POST /vr/authorizations/${auth_id}/approve"
              payload: { expected_case_version: "${case_v} - 1" }
              as: Supervisor
              as_user_id: "${supervisor_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_VERSION"
            - "ServiceAuthorization.${auth_id}.status == REQUESTED (unchanged)"

