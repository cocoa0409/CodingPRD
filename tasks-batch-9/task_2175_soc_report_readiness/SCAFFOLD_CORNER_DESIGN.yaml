              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { sd: $.data.id }
            - call: "POST /soc/boundary-components"
              payload: { system_description_id: "${sd}", component_type: "SOFTWARE", name: "Core API" }
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { bc: $.data.id }
            - call: "POST /soc/system-descriptions/${sd}/transitions"
              payload: { action: "SUBMIT_REVIEW" }
              as: ComplianceLead
              as_user_id: "cl-1"
            - call: "POST /soc/system-descriptions/${sd}/transitions"
              payload: { action: "APPROVE" }
              as: Auditor
              as_user_id: "aud-1"
            - call: "POST /soc/system-descriptions/${sd}/lock-boundary"
              payload: {}
              as: ComplianceLead
              as_user_id: "cl-1"
          trigger:
            - call: "POST /soc/boundary-components"
              payload: { system_description_id: "${sd}", component_type: "DATA", name: "Late addition" }
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { err_add: $.data.error_id }
            - call: "POST /soc/boundary-components/${bc}/set-scope"
              payload: { scope_status: "EXCLUDED", exclusion_rationale: "Reconsidered" }
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { err_scope: $.data.error_id }
          assert:
            - "${err_add} == ERR_BOUNDARY_LOCKED with HTTP status 409"
            - "${err_scope} == ERR_BOUNDARY_LOCKED with HTTP status 409"
            - "SystemDescription.${sd}.in_scope_component_count == 1"
            - "BoundaryComponent.${bc}.scope_status == IN_SCOPE"
            - "Engagement.${eng}.boundary_locked == true"

