# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Companion to SCAFFOLD.yaml for task_2475_customer_success_renewal_health_scoring.
#
# Logical clock: every instance below relies on the mandatory default
# 2026-08-01T00:00:00Z unless it calls POST /_clock/set_current_utc explicitly.
#
# All numeric asserts were executed against the §1.3 formulas with Python
# Decimal / ROUND_HALF_UP before being written here as literals.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: account_health_snapshot_variant_diverges_from_trended_variant
        grounds:
          - calculations.account_health_score
          - calculations.adoption_index
          - calculations.usage_row_index
          - entities.Account.fields.snapshot_health_score
          - entities.Account.fields.trended_health_score
        distinguishing_aspect: |
          Two variants of the SAME weighted health formula disagree because the
          adoption term differs: snapshot_health uses only the newest usage row
          (86.00) while trended_health uses the recency-weighted mean of the
          trailing three rows (67.00), producing 73.85 versus 67.20 on identical
          stored signals, a delta of exactly 6.65.
        test_recipe:
          setup:
            - "One ACTIVE HIGH_TOUCH Csm with capacity_units_total 17."
            - "One ENTERPRISE Account, arr_cents 30000000, term 2026-01-01..2026-12-31, lifecycle ONBOARDING, coverage_posture RESTRICTED (no COMMITTED assignment yet)."
            - "Exactly three USAGE_PERIOD signals whose usage_row_index values are 36.00 (2026-05-31), 56.00 (2026-06-30) and 86.00 (2026-07-31)."
            - "No SUPPORT_TICKET signals, no SponsorContact, no OutcomeGoal, so support_component = 100.00, exec_engagement_score = 25.00 and outcome_attainment_index = 60.00."
          setup_api_calls:
            - call: "POST /csms"
              payload: { full_name: "Ada Lovelace", coverage_specialty: "HIGH_TOUCH", capacity_units_total: 17 }
              as: CsOpsAdmin
              captures: { csm_a_id: $.data.id }
            - call: "POST /accounts"
              payload: { name: "Northwind Traders", arr_cents: 30000000, segment_band: "ENTERPRISE", contract_start_date: "2026-01-01", contract_end_date: "2026-12-31" }
              as: CsOpsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/signals"
              payload: { signal_kind: "USAGE_PERIOD", period_end_date: "2026-05-31", weekly_active_users: 40, licensed_seats: 100, feature_depth_pct: 30.00 }
              as: CsmUser
              as_user_id: "${csm_a_id}"
            - call: "POST /accounts/${acct_id}/signals"
              payload: { signal_kind: "USAGE_PERIOD", period_end_date: "2026-06-30", weekly_active_users: 60, licensed_seats: 100, feature_depth_pct: 50.00 }
              as: CsmUser
              as_user_id: "${csm_a_id}"
            - call: "POST /accounts/${acct_id}/signals"
              payload: { signal_kind: "USAGE_PERIOD", period_end_date: "2026-07-31", weekly_active_users: 90, licensed_seats: 100, feature_depth_pct: 80.00 }
              as: CsmUser
              as_user_id: "${csm_a_id}"
          trigger:
            - call: "GET /accounts/${acct_id}/health-summary"
              payload: {}
              as: CsmUser
              as_user_id: "${csm_a_id}"
          assert:
            - "Account.${acct_id}.adoption_index == 67.00"
            - "Account.${acct_id}.snapshot_health_score == 73.85"
            - "Account.${acct_id}.trended_health_score == 67.20"
            - "GET /accounts/${acct_id}/health-summary data.variant_delta == 6.65"
            - "Account.${acct_id}.health_tier == \"AMBER\"  (derived from the SNAPSHOT variant only)"
            - "Account.${acct_id}.support_risk_penalty == 0.00 and exec_engagement_score == 25.00 and outcome_attainment_index == 60.00"

      - name: renewal_amount_cs_bottom_up_variant_diverges_from_finance_top_down
        grounds:
          - calculations.renewal_forecast_amounts
          - calculations.forecast_variance_reconciliation
          - calculations.renewal_likelihood
          - entities.RenewalForecast.fields.cs_amount_cents
          - entities.RenewalForecast.fields.finance_amount_cents
        distinguishing_aspect: |
          A different entity domain from the health instance: this dual variant
          lives on RenewalForecast money, where cs_bottom_up weights ARR by the
          account's renewal_likelihood (UPSIDE 0.70 -> 21000000) and
          finance_top_down weights the same ARR by a flat ENTERPRISE retention
          rate (0.90 -> 27000000), a 6000000-cent delta that trips the 500 bp
          variance tolerance.
        test_recipe:
          setup:
            - "The health-instance account, extended: coverage_tier HIGH_TOUCH after segmentation and one COMMITTED CoverageAssignment of 17 load_units, so coverage_posture is OPEN."
            - "Account.renewal_likelihood == UPSIDE (trended_health_score 67.20 >= 60.00 and 152 days to renewal > 60)."
          setup_api_calls:
            - call: "POST /csms"
              payload: { full_name: "Ada Lovelace", coverage_specialty: "HIGH_TOUCH", capacity_units_total: 17 }
              as: CsOpsAdmin
              captures: { csm_a_id: $.data.id }
            - call: "POST /accounts"
              payload: { name: "Northwind Traders", arr_cents: 30000000, segment_band: "ENTERPRISE", contract_start_date: "2026-01-01", contract_end_date: "2026-12-31" }
              as: CsOpsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/signals"
              payload: { signal_kind: "USAGE_PERIOD", period_end_date: "2026-05-31", weekly_active_users: 40, licensed_seats: 100, feature_depth_pct: 30.00 }
              as: CsmUser
              as_user_id: "${csm_a_id}"
            - call: "POST /accounts/${acct_id}/signals"
              payload: { signal_kind: "USAGE_PERIOD", period_end_date: "2026-06-30", weekly_active_users: 60, licensed_seats: 100, feature_depth_pct: 50.00 }
              as: CsmUser
              as_user_id: "${csm_a_id}"
            - call: "POST /accounts/${acct_id}/signals"
              payload: { signal_kind: "USAGE_PERIOD", period_end_date: "2026-07-31", weekly_active_users: 90, licensed_seats: 100, feature_depth_pct: 80.00 }
              as: CsmUser
              as_user_id: "${csm_a_id}"
            - call: "POST /accounts/${acct_id}/segmentation"
              payload: {}
              as: CsOpsAdmin
              captures: { acct_v_seg: $.data.version }
            - call: "POST /coverage-assignments"
              payload: { account_id: "${acct_id}", expected_account_version: "${acct_v_seg}", csm_id: "${csm_a_id}" }
              as: CsOpsAdmin
              captures: { ca1_id: $.data.id }
          trigger:
            - call: "POST /renewal-forecasts"
              payload: { account_id: "${acct_id}", fiscal_period: "2026Q4" }
              as: CsmUser
              as_user_id: "${csm_a_id}"
              captures: { fc_id: $.data.id }
            - call: "POST /renewal-forecasts/${fc_id}/submit"
              payload: {}
              as: CsmUser
              as_user_id: "${csm_a_id}"
            - call: "POST /renewal-forecasts/${fc_id}/reconcile"
              payload: { action: "RECONCILE" }
              as: FinanceAnalyst
          assert:
            - "RenewalForecast.${fc_id}.likelihood_category == \"UPSIDE\""
            - "RenewalForecast.${fc_id}.cs_amount_cents == 21000000"
            - "RenewalForecast.${fc_id}.finance_amount_cents == 27000000"
            - "RenewalForecast.${fc_id}.variance_cents == 6000000"
            - "RenewalForecast.${fc_id}.finance_state == \"VARIANCE_FLAGGED\""
            - "RenewalForecast.${fc_id}.cs_state == \"SUBMITTED\"  (the finance axis moved without touching the cs axis)"

      - name: time_to_value_contractual_variant_diverges_from_activation_variant
        grounds:
          - calculations.time_to_value_days
          - state_machines.OnboardingMilestone.PENDING_to_COMPLETED
          - state_machines.Account.ONBOARDING_to_ADOPTING
          - entities.Account.fields.contractual_ttv_days
          - entities.Account.fields.activation_ttv_days
        distinguishing_aspect: |
          A third, non-monetary and non-score domain: onboarding elapsed time.
          Both variants read the same GO_LIVE completion date but different
          baselines - contract_start_date gives 78 days while KICKOFF completion
          gives 59 days, and the 19-day gap is exactly the pre-kickoff customer
          lag that the activation variant deliberately excludes.
        test_recipe:
          setup:
            - "An ENTERPRISE Account with contract_start_date 2026-01-01, coverage_posture OPEN via a COMMITTED assignment."
            - "Four OnboardingMilestone rows: KICKOFF/1 due 2026-01-15, DATA_INTEGRATION/2 due 2026-02-15, FIRST_VALUE/3 due 2026-03-01, GO_LIVE/4 due 2026-03-15, all PENDING."
          setup_api_calls:
            - call: "POST /csms"
              payload: { full_name: "Ada Lovelace", coverage_specialty: "HIGH_TOUCH", capacity_units_total: 17 }
              as: CsOpsAdmin
              captures: { csm_a_id: $.data.id }
            - call: "POST /accounts"
              payload: { name: "Northwind Traders", arr_cents: 30000000, segment_band: "ENTERPRISE", contract_start_date: "2026-01-01", contract_end_date: "2026-12-31" }
              as: CsOpsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/segmentation"
              payload: {}
              as: CsOpsAdmin
              captures: { acct_v_seg: $.data.version }
            - call: "POST /coverage-assignments"
              payload: { account_id: "${acct_id}", expected_account_version: "${acct_v_seg}", csm_id: "${csm_a_id}" }
              as: CsOpsAdmin
              captures: { ca1_id: $.data.id }
            - call: "POST /accounts/${acct_id}/onboarding-milestones"
              payload: { milestone_code: "KICKOFF", sequence_index: 1, due_date: "2026-01-15" }
              as: CsOpsAdmin
              captures: { ms_kickoff_id: $.data.id }
            - call: "POST /accounts/${acct_id}/onboarding-milestones"
              payload: { milestone_code: "DATA_INTEGRATION", sequence_index: 2, due_date: "2026-02-15" }
              as: CsOpsAdmin
              captures: { ms_data_id: $.data.id }
            - call: "POST /accounts/${acct_id}/onboarding-milestones"
              payload: { milestone_code: "FIRST_VALUE", sequence_index: 3, due_date: "2026-03-01" }
              as: CsOpsAdmin
              captures: { ms_value_id: $.data.id }
            - call: "POST /accounts/${acct_id}/onboarding-milestones"
              payload: { milestone_code: "GO_LIVE", sequence_index: 4, due_date: "2026-03-15" }
              as: CsOpsAdmin
              captures: { ms_golive_id: $.data.id }
          trigger:
            - call: "POST /onboarding-milestones/${ms_kickoff_id}/transition"
              payload: { action: "COMPLETE", completed_date: "2026-01-20" }
              as: CsmUser
              as_user_id: "${csm_a_id}"
            - call: "POST /onboarding-milestones/${ms_data_id}/transition"
              payload: { action: "COMPLETE", completed_date: "2026-02-20" }
              as: CsmUser
              as_user_id: "${csm_a_id}"
            - call: "POST /onboarding-milestones/${ms_value_id}/transition"
              payload: { action: "COMPLETE", completed_date: "2026-03-05" }
              as: CsmUser
              as_user_id: "${csm_a_id}"
            - call: "POST /onboarding-milestones/${ms_golive_id}/transition"
              payload: { action: "COMPLETE", completed_date: "2026-03-20" }
              as: CsmUser
              as_user_id: "${csm_a_id}"
          assert:
            - "Account.${acct_id}.contractual_ttv_days == 78"
            - "Account.${acct_id}.activation_ttv_days == 59"
            - "OnboardingMilestone.${ms_golive_id}.days_late == 5"
            - "OnboardingMilestone.${ms_kickoff_id}.days_late == 5"
            - "Account.${acct_id}.lifecycle_state == \"ADOPTING\""
            - "Account.${acct_id}.ttv_breach_flag == false"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: coverage_load_units_four_factor_interaction_with_one_terminal_ceil
        grounds:
          - calculations.coverage_load_units
          - calculations.coverage_tier_assignment
          - calculations.csm_capacity_conservation
          - entities.CoverageAssignment.fields.load_units
        distinguishing_aspect: |
          MODE (a): four inputs interacting non-linearly - BASE_UNITS keyed on
          coverage_tier, SEGMENT_MULTIPLIER, RISK_MULTIPLIER and a step
          ARR_SURCHARGE - with exactly one ceil taken after both multipliers.
          Two accounts differing ONLY in segment_band yield 17 and 12 load_units
          (round2(9*1.50*1.10)=14.85 +2 = 16.85 -> 17 versus
          round2(9*1.00*1.10)=9.90 +2 = 11.90 -> 12).
        test_recipe:
          setup:
            - "One ACTIVE HIGH_TOUCH Csm with capacity_units_total 40."
            - "Account A: ENTERPRISE, arr_cents 30000000; Account B: MIDMARKET, arr_cents 30000000. Both carry the identical three USAGE_PERIOD signals, so both are health_tier AMBER (snapshot 73.85)."
            - "Both accounts segmented to coverage_tier HIGH_TOUCH (arr_cents >= 25000000)."
          setup_api_calls:
            - call: "POST /csms"
              payload: { full_name: "Ada Lovelace", coverage_specialty: "HIGH_TOUCH", capacity_units_total: 40 }
              as: CsOpsAdmin
              captures: { csm_a_id: $.data.id }
            - call: "POST /accounts"
              payload: { name: "Northwind Traders", arr_cents: 30000000, segment_band: "ENTERPRISE", contract_start_date: "2026-01-01", contract_end_date: "2026-12-31" }
              as: CsOpsAdmin
              captures: { acct_a_id: $.data.id }
            - call: "POST /accounts"
              payload: { name: "Contoso Retail", arr_cents: 30000000, segment_band: "MIDMARKET", contract_start_date: "2026-01-01", contract_end_date: "2026-12-31" }
              as: CsOpsAdmin
              captures: { acct_b_id: $.data.id }
            - call: "POST /accounts/${acct_a_id}/signals"
              payload: { signal_kind: "USAGE_PERIOD", period_end_date: "2026-05-31", weekly_active_users: 40, licensed_seats: 100, feature_depth_pct: 30.00 }
              as: CsmUser
              as_user_id: "${csm_a_id}"
            - call: "POST /accounts/${acct_a_id}/signals"
              payload: { signal_kind: "USAGE_PERIOD", period_end_date: "2026-06-30", weekly_active_users: 60, licensed_seats: 100, feature_depth_pct: 50.00 }
              as: CsmUser
              as_user_id: "${csm_a_id}"
            - call: "POST /accounts/${acct_a_id}/signals"
              payload: { signal_kind: "USAGE_PERIOD", period_end_date: "2026-07-31", weekly_active_users: 90, licensed_seats: 100, feature_depth_pct: 80.00 }
              as: CsmUser
              as_user_id: "${csm_a_id}"
            - call: "POST /accounts/${acct_b_id}/signals"
              payload: { signal_kind: "USAGE_PERIOD", period_end_date: "2026-05-31", weekly_active_users: 40, licensed_seats: 100, feature_depth_pct: 30.00 }
              as: CsmUser
              as_user_id: "${csm_a_id}"
            - call: "POST /accounts/${acct_b_id}/signals"
              payload: { signal_kind: "USAGE_PERIOD", period_end_date: "2026-06-30", weekly_active_users: 60, licensed_seats: 100, feature_depth_pct: 50.00 }
              as: CsmUser
              as_user_id: "${csm_a_id}"
            - call: "POST /accounts/${acct_b_id}/signals"
              payload: { signal_kind: "USAGE_PERIOD", period_end_date: "2026-07-31", weekly_active_users: 90, licensed_seats: 100, feature_depth_pct: 80.00 }
              as: CsmUser
              as_user_id: "${csm_a_id}"
            - call: "POST /accounts/${acct_a_id}/segmentation"
              payload: {}
              as: CsOpsAdmin
              captures: { acct_a_v: $.data.version }
            - call: "POST /accounts/${acct_b_id}/segmentation"
              payload: {}
              as: CsOpsAdmin
              captures: { acct_b_v: $.data.version }
          trigger:
            - call: "POST /coverage-assignments"
              payload: { account_id: "${acct_a_id}", expected_account_version: "${acct_a_v}", csm_id: "${csm_a_id}" }
              as: CsOpsAdmin
              captures: { ca_a_id: $.data.id }
            - call: "POST /coverage-assignments"
              payload: { account_id: "${acct_b_id}", expected_account_version: "${acct_b_v}", csm_id: "${csm_a_id}" }
              as: CsOpsAdmin
              captures: { ca_b_id: $.data.id }
          assert:
            - "CoverageAssignment.${ca_a_id}.load_units == 17  (NOT 18, which is what ceiling the 13.50 sub-product first would give)"
            - "CoverageAssignment.${ca_b_id}.load_units == 12"
            - "CoverageAssignment.${ca_a_id}.coverage_tier == \"HIGH_TOUCH\" and CoverageAssignment.${ca_b_id}.coverage_tier == \"HIGH_TOUCH\""
            - "CoverageAssignment.${ca_a_id}.state == \"COMMITTED\" and CoverageAssignment.${ca_b_id}.state == \"COMMITTED\""
            - "Csm.${csm_a_id}.capacity_units_committed == 29"
            - "Csm.${csm_a_id}.capacity_units_available == 11"

      - name: outcome_attainment_rounds_per_goal_before_aggregating
        grounds:
          - calculations.outcome_attainment_index
          - calculations.account_health_score
          - entities.OutcomeGoal.fields.attainment_pct
          - entities.Account.fields.outcome_attainment_index
        distinguishing_aspect: |
          MODE (b): nested rounding where the order changes the answer. Rounding
          each goal's weighted contribution to 2 dp first and then summing gives
          30.00 + 6.67 = 36.67, whereas summing the unrounded products
          (29.997 + 6.667) and rounding once gives 36.66. The scaffold pins the
          per-goal order, so 36.67 is the only correct index.
        test_recipe:
          setup:
            - "The three-usage-row ENTERPRISE Account (snapshot adoption term 86.00, trended 67.00), no sponsors, no tickets."
            - "No OutcomeGoal rows yet, so outcome_attainment_index sits at the OUTCOME_EMPTY_SUBSTITUTE of 60.00."
          setup_api_calls:
            - call: "POST /csms"
              payload: { full_name: "Ada Lovelace", coverage_specialty: "HIGH_TOUCH", capacity_units_total: 17 }
              as: CsOpsAdmin
              captures: { csm_a_id: $.data.id }
            - call: "POST /accounts"
              payload: { name: "Northwind Traders", arr_cents: 30000000, segment_band: "ENTERPRISE", contract_start_date: "2026-01-01", contract_end_date: "2026-12-31" }
              as: CsOpsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/signals"
              payload: { signal_kind: "USAGE_PERIOD", period_end_date: "2026-05-31", weekly_active_users: 40, licensed_seats: 100, feature_depth_pct: 30.00 }
              as: CsmUser
              as_user_id: "${csm_a_id}"
            - call: "POST /accounts/${acct_id}/signals"
              payload: { signal_kind: "USAGE_PERIOD", period_end_date: "2026-06-30", weekly_active_users: 60, licensed_seats: 100, feature_depth_pct: 50.00 }
              as: CsmUser
              as_user_id: "${csm_a_id}"
            - call: "POST /accounts/${acct_id}/signals"
              payload: { signal_kind: "USAGE_PERIOD", period_end_date: "2026-07-31", weekly_active_users: 90, licensed_seats: 100, feature_depth_pct: 80.00 }
              as: CsmUser
              as_user_id: "${csm_a_id}"
          trigger:
            - call: "POST /accounts/${acct_id}/outcome-goals"
              payload: { title: "Ticket deflection ratio", target_value: 3, weight_bp: 9000, actual_value: 1 }
              as: CsmUser
              as_user_id: "${csm_a_id}"
              captures: { goal_a_id: $.data.id }
            - call: "POST /accounts/${acct_id}/outcome-goals"
              payload: { title: "Executive scorecard adoption", target_value: 3, weight_bp: 1000, actual_value: 2 }
              as: CsmUser
              as_user_id: "${csm_a_id}"
              captures: { goal_b_id: $.data.id }
          assert:
            - "OutcomeGoal.${goal_a_id}.attainment_pct == 33.33"
            - "OutcomeGoal.${goal_b_id}.attainment_pct == 66.67"
            - "Account.${acct_id}.outcome_attainment_index == 36.67  (NOT 36.66, which aggregating before rounding would give)"
            - "Account.${acct_id}.snapshot_health_score == 68.02"
            - "Account.${acct_id}.trended_health_score == 61.37"
            - "Account.${acct_id}.health_tier == \"AMBER\""

      - name: escalation_credit_tier_is_keyed_on_the_total_it_then_discounts
        grounds:
          - calculations.escalation_settlement_credit
          - calculations.remediation_credit_conservation
          - state_machines.EscalationCase.COMMITTED_to_RESOLVED
          - entities.EscalationCase.fields.final_credit_cents
        distinguishing_aspect: |
          MODE (c): a circular-looking dependency with a pinned evaluation order.
          The discount tier is selected from pre_reduction_total (base_credit
          450000 + delivered commitments 600000 = 1050000 -> 2000 bp), and that
          same total is then reduced, giving 840000. Keying the tier off
          base_credit alone would select 1000 bp and yield 945000, so the order
          is observable.
        test_recipe:
          setup:
            - "ENTERPRISE Account, arr_cents 30000000, health_tier AMBER, coverage_posture OPEN via a COMMITTED assignment."
            - "One ACTIVE SavePlay, so the account carries open_save_play_count 1."
            - "One CXO SponsorContact who is the ACTIVE economic buyer, added AFTER the save play was activated."
            - "One EscalationCase at severity HIGH in state COMMITTED, with a single RemediationCommitment of 600000 cents in state DELIVERED."
          setup_api_calls:
            - call: "POST /csms"
              payload: { full_name: "Ada Lovelace", coverage_specialty: "HIGH_TOUCH", capacity_units_total: 17 }
              as: CsOpsAdmin
              captures: { csm_a_id: $.data.id }
            - call: "POST /accounts"
              payload: { name: "Northwind Traders", arr_cents: 30000000, segment_band: "ENTERPRISE", contract_start_date: "2026-01-01", contract_end_date: "2026-12-31" }
              as: CsOpsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/signals"
              payload: { signal_kind: "USAGE_PERIOD", period_end_date: "2026-05-31", weekly_active_users: 40, licensed_seats: 100, feature_depth_pct: 30.00 }
              as: CsmUser
              as_user_id: "${csm_a_id}"
            - call: "POST /accounts/${acct_id}/signals"
              payload: { signal_kind: "USAGE_PERIOD", period_end_date: "2026-06-30", weekly_active_users: 60, licensed_seats: 100, feature_depth_pct: 50.00 }
              as: CsmUser
              as_user_id: "${csm_a_id}"
            - call: "POST /accounts/${acct_id}/signals"
              payload: { signal_kind: "USAGE_PERIOD", period_end_date: "2026-07-31", weekly_active_users: 90, licensed_seats: 100, feature_depth_pct: 80.00 }
              as: CsmUser
              as_user_id: "${csm_a_id}"
            - call: "POST /accounts/${acct_id}/segmentation"
              payload: {}
              as: CsOpsAdmin
              captures: { acct_v_seg: $.data.version }
            - call: "POST /coverage-assignments"
              payload: { account_id: "${acct_id}", expected_account_version: "${acct_v_seg}", csm_id: "${csm_a_id}" }
              as: CsOpsAdmin
              captures: { ca1_id: $.data.id }
            - call: "POST /save-plays"
              payload: { account_id: "${acct_id}", owner_csm_id: "${csm_a_id}", risk_code: "SUPPORT_ESCALATION", play_type: "COMMERCIAL_CONCESSION", window_start_date: "2026-08-01", window_end_date: "2026-09-30" }
              as: CsmUser
