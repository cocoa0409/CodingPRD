  - rule_id: priority_pair_validation_conflict
    instances:
      - name: award_by_forbidden_role_beats_cycle_state
        grounds:
          - validations[priority=2]
          - validations[priority=10]
          - state_machines.RatingCycle.OBSERVATION_FINALIZED_to_AWARDED
          - entities.RatingCycle.fields.status
        distinguishing_aspect: |
          This conflict is the error-category pair auth (priority 2, ERR_FORBIDDEN_ROLE, 403)
          versus state (priority 10, ERR_CYCLE_STATE_INVALID, 409): a Provider-role caller
          awards a cycle that is still DRAFT, so both checks fail and the response MUST be
          403 ERR_FORBIDDEN_ROLE, never 409 ERR_CYCLE_STATE_INVALID.
        test_recipe:
          setup:
            - "logical clock pinned at 2026-08-01T00:00:00Z"
            - "one Provider in ENROLLED status (application approved), version captured from the approval response"
            - "one RatingCycle of that provider in DRAFT (no SelfAssessment, no observation, never awarded)"
            - "POST /rating-cycles/{id}/award declares roles [StateAdministrator] only, so a Provider caller is off-list"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StateAdministrator
              as_user_id: "admin-1"
            - call: "POST /providers"
              payload: { legal_name: "Bright Start Center", license_number: "LIC-PP1-0001", county_code: "C001", region_code: "URBAN", licensed_capacity: 60, active_staff_fte: 12.00, weekly_onsite_cap_hours: 12.0 }
              as: StateAdministrator
              as_user_id: "admin-1"
              captures: { prov_id: $.data.id }
            - call: "POST /providers/${prov_id}/enrollment-decisions"
              payload: { decision: "APPROVE" }
              as: StateAdministrator
              as_user_id: "admin-1"
              captures: { prov_v: $.data.version }
            - call: "POST /providers/${prov_id}/rating-cycles"
              payload: { cycle_type: "INITIAL", expected_provider_version: "${prov_v}" }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { cyc_id: $.data.id }
          trigger:
            - call: "POST /rating-cycles/${cyc_id}/award"
              payload: { score_variant: "FINAL" }
              as: Provider
              as_user_id: "${prov_id}"
          assert:
            - "response HTTP status == 403"
            - "response error id == ERR_FORBIDDEN_ROLE"
            - "response error id != ERR_CYCLE_STATE_INVALID"
            - "RatingCycle.${cyc_id}.status == DRAFT"
            - "RatingCycle.${cyc_id}.awarded_tier == null"
            - "RatingCycle.${cyc_id}.awarded_on == null"

      - name: path_not_found_beats_body_schema_on_visit_scheduling
        grounds:
          - validations[priority=3]
          - validations[priority=6]
          - entities.ObservationVisit.fields.secondary_observer_id
          - entities.ObservationVisit.fields.window_end
        distinguishing_aspect: |
          This conflict is the error-category pair existence (priority 3,
          ERR_RATING_ARTIFACT_NOT_FOUND, 404) versus business_constraint (priority 6,
          ERR_VALIDATION, 422): the path rating_cycle_id does not exist AND the body puts the
          same observer in both observer slots with window_end before window_start, so the
          response MUST be 404 ERR_RATING_ARTIFACT_NOT_FOUND, never 422 ERR_VALIDATION.
        test_recipe:
          setup:
            - "logical clock pinned at 2026-08-01T00:00:00Z"
            - "one RELIABLE Observer exists, so the body observer FK resolves and priority 7 cannot fire"
            - "no RatingCycle with id 00000000-0000-4000-8000-0000000000ff exists (empty-DB has none and setup creates none)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StateAdministrator
              as_user_id: "admin-1"
            - call: "POST /observers"
