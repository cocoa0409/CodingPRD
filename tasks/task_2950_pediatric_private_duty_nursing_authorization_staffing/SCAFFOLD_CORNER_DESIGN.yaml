  - section: errors
    instances:
      - name: every_path_parameter_reports_its_own_not_found_code
        claim_type: Triggerable Error Code
        grounds:
          - validations[priority 5 path existence]
          - errors[ERR_PLAN_OF_CARE_NOT_FOUND]
          - errors[ERR_AUTHORIZATION_NOT_FOUND]
          - errors[ERR_NURSE_NOT_FOUND]
          - errors[ERR_COMPETENCY_NOT_FOUND]
          - errors[ERR_CASE_NOT_FOUND]
          - errors[ERR_SHIFT_NOT_FOUND]
          - errors[ERR_ASSIGNMENT_NOT_FOUND]
          - errors[ERR_TIMESHEET_NOT_FOUND]
          - errors[ERR_INCIDENT_NOT_FOUND]
          - errors[ERR_DISPUTE_NOT_FOUND]
        distinguishing_aspect: >-
          Ten different path parameters each yield their own distinct 404 code rather than one generic
          not-found code, and the unknown id is always the same literal
          00000000-0000-4000-8000-000000000000 so nothing but the route differs between the calls.
        test_recipe:
          setup:
            - "No domain data is needed: every call targets an id that was never minted."
          setup_api_calls:
            - call: "POST /pdn/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00Z" }
              as: AgencyAdmin
              as_user_id: "admin-001"
          trigger:
            - call: "GET /pdn/plans-of-care/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CaseManager
              as_user_id: "cm-001"
            - call: "GET /pdn/authorizations/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CaseManager
              as_user_id: "cm-001"
            - call: "GET /pdn/nurses/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: AgencyAdmin
              as_user_id: "admin-001"
            - call: "POST /pdn/nurse-competencies/00000000-0000-4000-8000-000000000000/revoke"
              payload: { revoked_reason: "targeting a competency that does not exist" }
              as: ClinicalSupervisor
              as_user_id: "sup-001"
            - call: "GET /pdn/cases/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CaseManager
              as_user_id: "cm-001"
            - call: "GET /pdn/shifts/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Scheduler
              as_user_id: "sch-001"
            - call: "GET /pdn/shift-assignments/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Scheduler
              as_user_id: "sch-001"
            - call: "GET /pdn/timesheets/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Scheduler
              as_user_id: "sch-001"
            - call: "GET /pdn/incident-reports/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ClinicalSupervisor
              as_user_id: "sup-001"
            - call: "GET /pdn/authorization-disputes/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CaseManager
              as_user_id: "cm-001"
          assert:
            - "the plans-of-care read returns HTTP 404 with error_id ERR_PLAN_OF_CARE_NOT_FOUND"
            - "the authorizations read returns HTTP 404 with error_id ERR_AUTHORIZATION_NOT_FOUND"
            - "the nurses read returns HTTP 404 with error_id ERR_NURSE_NOT_FOUND"
            - "the competency revoke returns HTTP 404 with error_id ERR_COMPETENCY_NOT_FOUND"
            - "the cases read returns HTTP 404 with error_id ERR_CASE_NOT_FOUND"
            - "the shifts read returns HTTP 404 with error_id ERR_SHIFT_NOT_FOUND"
            - "the shift-assignments read returns HTTP 404 with error_id ERR_ASSIGNMENT_NOT_FOUND"
            - "the timesheets read returns HTTP 404 with error_id ERR_TIMESHEET_NOT_FOUND"
            - "the incident-reports read returns HTTP 404 with error_id ERR_INCIDENT_NOT_FOUND"
            - "the authorization-disputes read returns HTTP 404 with error_id ERR_DISPUTE_NOT_FOUND"

      - name: an_accepted_timesheet_refuses_a_second_decision_and_any_edit
        claim_type: Triggerable Error Code
        grounds:
          - errors[ERR_TIMESHEET_ALREADY_BILLED]
          - validations[priority 39 ERR_TIMESHEET_ALREADY_BILLED]
          - endpoints[POST /pdn/timesheets/{id}/billing-decision]
        distinguishing_aspect: >-
          Once the timesheet is BILL_ACCEPTED both a second billing-decision and a nurse PATCH report
          ERR_TIMESHEET_ALREADY_BILLED, and Case.billed_units_to_date is credited exactly once.
        test_recipe:
          setup:
            - "A GPS-verified worked shift on 2026-08-05 08:00-16:00 whose timesheet has been"
            - "submitted and accepted for billing."
          setup_api_calls:
            - call: "POST /pdn/_clock/set_current_utc"
