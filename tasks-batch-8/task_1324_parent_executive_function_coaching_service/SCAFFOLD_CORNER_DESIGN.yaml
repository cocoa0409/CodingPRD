  - section: endpoints
    instances:
      - name: family_list_pagination_defaults_and_params
        claim_type: listing
        grounds: [response_envelope, endpoints]
        distinguishing_aspect: "The list endpoint honors the fixed envelope: default limit 10; explicit limit 1 returns total_count 2 with has_more true, and offset 1 returns the second family."
        test_recipe:
          setup: ["two families created in order"]
          setup_api_calls:
            - { call: "POST /api/families", payload: { account_name: "Fam P1", primary_email: "p1@x.com" }, as: PracticeAdmin, captures: { f1_id: "$.data.id" } }
            - { call: "POST /api/families", payload: { account_name: "Fam P2", primary_email: "p2@x.com" }, as: PracticeAdmin, captures: { f2_id: "$.data.id" } }
          trigger:
            - { call: "GET /api/families", payload: { limit: 1, offset: 0 }, as: PracticeAdmin, captures: { page1_first: "$.data[0].id" } }
            - { call: "GET /api/families", payload: { limit: 1, offset: 1 }, as: PracticeAdmin, captures: { page2_first: "$.data[0].id" } }
          assert:
            - "page1_first == f1_id (created_at ASC ordering)"
            - "page2_first == f2_id"
            - "both responses carry meta.api_request_id and the pagination fields limit/offset/total_count/has_more with total_count == 2 and has_more == true on page 1"

      - name: sessions_reverse_lookup_under_plan
        claim_type: retrieval
        grounds: [entities.Session.fields.plan_id, endpoints]
