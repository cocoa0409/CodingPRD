scenario: "2199. Employee Handbook & Policy Acknowledgment (corporate HR policy team): policy authoring & legal review by jurisdiction, state-specific addendum management, version release & effective date, distribution & electronic acknowledgment tracking, non-acknowledgment escalation, policy exception request & approval, translation & accessibility, retention of acknowledgment records for disputes"
domain_name: "employee-handbook-policy-acknowledgment"
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - version_pinning_on_approval
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - scheduled_deferred_actions
  entity_topology: graph
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_level: expert_plus
  difficulty_notes: |
    Density beyond Expert: 15 entities, 7 state machines (one cyclic, one with two
    independent parallel dimensions on the same row, two branching), 8 calculations
    (two dual-variant on different subjects, one pinned nested-rounding order, one
    pinned evaluation order for a circular-looking dependency), 2 OCC races on two
    different parent entities, and two conserved-quantity invariants (an append-only
    signed ledger and a denormalized counter) that must survive compensating actions.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Jurisdiction
    parent: null
    common_fields: true
    fields:
      - name: state_code
        type: string
        source: input
        description: "Two-letter US state / territory code identifying the jurisdiction"
        constraints: "uppercase, exactly 2 chars, globally unique"
      - name: display_name
        type: string
        source: input
        description: "Human-readable jurisdiction name"
      - name: min_legal_review_days
        type: integer
        source: input
        description: "Minimum whole days that must elapse between the last APPROVED LegalReview decision for this jurisdiction and a PolicyVersion effective_date"
        constraints: ">= 0, <= 120"
      - name: ack_deadline_days
        type: integer
        source: input
        description: "Whole days after effective_date by which an employee in this jurisdiction must acknowledge"
        constraints: ">= 1, <= 180"
      - name: esign_permitted
        type: boolean
        source: input
        description: "Whether ESIGN acknowledgment method is legally permitted in this jurisdiction"
        default: true
      - name: proxy_ack_permitted
        type: boolean
        source: input
        description: "Whether an HRComplianceAdmin may record an ATTESTED acknowledgment on behalf of an employee"
        default: false
      - name: retention_years
        type: integer
        source: input
        description: "Whole years an acknowledgment record must be retained after the acknowledgment date"
        constraints: ">= 1, <= 30"
      - name: required_language_codes
        type: array
        source: input
        description: "Language codes (BCP-47 primary subtags) in which a PolicyVersion must be PUBLISHED before it may be released into this jurisdiction"
        constraints: "non-empty, each 2 lowercase chars, must contain 'en'"
      - name: ack_window_buffer_days
        type: integer
        source: input
        description: "Mandatory cooling buffer in whole days that must separate two acknowledgment windows of the same policy category for the same employee in this jurisdiction"
        default: 3
        constraints: ">= 0, <= 30"

  - name: LegalReviewer
    parent: null
    common_fields: true
    fields:
      - name: jurisdiction_id
        type: string
        source: input
        description: "FK -> Jurisdiction.id; the jurisdiction this reviewer is licensed to sign off on"
      - name: full_name
        type: string
        source: input
        description: "Reviewer display name"
      - name: bar_number
        type: string
        source: input
        description: "Bar registration number, unique per jurisdiction_id"
        constraints: "unique together with jurisdiction_id"
      - name: concurrent_review_limit
        type: integer
        source: input
        description: "Maximum number of LegalReview rows whose [assigned_at, due_at] windows may overlap for this reviewer"
        default: 2
        constraints: ">= 1, <= 10"
      - name: open_review_count
        type: integer
        source: computed
        description: "Count of LegalReview rows for this reviewer whose status IN {REQUESTED, IN_PROGRESS}"
        default: 0
      - name: is_active
        type: boolean
        source: input
        description: "Whether the reviewer may receive new review requests"
        default: true

  - name: Employee
    parent: null
    common_fields: true
    fields:
      - name: jurisdiction_id
        type: string
        source: input
        description: "FK -> Jurisdiction.id; work-location jurisdiction that governs deadlines and retention"
      - name: manager_id
        type: string
        source: input
        description: "FK -> Employee.id; self-referential people-manager link, null for the top of the chain"
        default: null
      - name: work_email
        type: string
        source: input
        description: "Login identity, globally unique"
        constraints: "unique, contains '@'"
      - name: full_name
        type: string
        source: input
        description: "Employee display name"
      - name: preferred_language_code
        type: string
        source: input
        description: "Language the employee must be served the policy body in"
        default: "en"
        constraints: "2 lowercase chars"
      - name: needs_accessible_format
        type: boolean
        source: input
        description: "When true, an assignment may only be DELIVERED if the matching Translation.a11y_index >= A11Y_ACCESSIBLE_MIN"
        default: false
      - name: employment_status
        type: enum
        source: input
        description: "Current employment state"
        default: "ACTIVE"
        constraints: "one of ACTIVE, ON_LEAVE, TERMINATED"
      - name: open_ack_count
        type: integer
        source: computed
        description: "Denormalized count of DistributionAssignment rows for this employee whose ack_state IN {UNDELIVERED, PENDING}; conserved quantity for the assignment-counter invariant"
        default: 0
      - name: open_escalation_count
        type: integer
        source: computed
        description: "Denormalized count of EscalationCase rows for this employee whose status IN {OPEN, NOTIFIED, ESCALATED_HR}"
        default: 0

  - name: PolicyDocument
    parent: null
    common_fields: true
    fields:
      - name: title
        type: string
        source: input
        description: "Handbook policy title, globally unique"
        constraints: "unique, 3..160 chars"
      - name: category
        type: enum
        source: input
        description: "Policy category; drives the per-employee acknowledgment-window buffer scope"
        constraints: "one of CODE_OF_CONDUCT, LEAVE, SAFETY, COMPENSATION, DATA_PRIVACY"
      - name: owner_user_id
        type: string
        source: input
        description: "Opaque X-User-ID of the PolicyAuthor who owns the document; never compared to any entity id"
      - name: current_published_version_id
        type: string
        source: computed
        description: "FK -> PolicyVersion.id; the single PolicyVersion of this document whose status == PUBLISHED, null when none"
        default: null
      - name: latest_version_no
        type: integer
        source: computed
        description: "Highest version_no minted under this document"
        default: 0
      - name: max_ack_deadline_days
        type: integer
        source: input
        description: "Category-level cap on the acknowledgment deadline in whole days, applied as an upper bound over Jurisdiction.ack_deadline_days"
        default: 30
        constraints: ">= 1, <= 180"

  - name: PolicyVersion
    parent: PolicyDocument
    common_fields: true
    fields:
      - name: policy_document_id
        type: string
        source: input
        description: "FK -> PolicyDocument.id; owning handbook policy"
      - name: version_no
        type: integer
        source: system
        description: "Monotonic per-document version number starting at 1"
      - name: body_text
        type: string
        source: input
        description: "Canonical English policy body"
        constraints: "non-empty"
      - name: section_count
        type: integer
        source: input
        description: "Number of numbered sections in body_text; the accessibility index is averaged over exactly this many section scores"
        constraints: ">= 1, <= 40"
      - name: status
        type: enum
        source: system
        description: "Authoring lifecycle state"
        default: "DRAFT"
        constraints: "one of DRAFT, IN_LEGAL_REVIEW, APPROVED, PUBLISHED, SUPERSEDED, WITHDRAWN"
      - name: required_jurisdiction_ids
        type: array
        source: input
        description: "Jurisdiction ids that must each have an APPROVED JurisdictionAddendum and an APPROVED LegalReview before this version may be APPROVED"
        constraints: "non-empty array of Jurisdiction.id values"
      - name: effective_date
        type: datetime
        source: system
        description: "Instant the version becomes binding; copied from the releasing ReleasePackage.effective_date at RELEASED time, null before that"
        default: null
      - name: window_end_date
        type: datetime
        source: computed
        description: "Exclusive upper bound of this version's effective window; set to the successor version's effective_date when this version is SUPERSEDED, else null meaning open-ended"
        default: null
      - name: revision_round
        type: integer
        source: computed
        description: "Increments by 1 each time the version returns to DRAFT from IN_LEGAL_REVIEW"
        default: 0
      - name: approved_at
        type: datetime
        source: system
        description: "Logical-clock instant the version entered APPROVED; cleared to null on re-open to DRAFT"
        default: null
      - name: pinned_addendum_ids
        type: array
        source: computed
        description: "JurisdictionAddendum ids frozen at APPROVED time; a later addendum mutation invalidates approval"
        default: []

  - name: JurisdictionAddendum
    parent: PolicyVersion
    common_fields: true
    fields:
      - name: policy_version_id
        type: string
        source: input
        description: "FK -> PolicyVersion.id; the version this state-specific addendum amends"
      - name: jurisdiction_id
        type: string
        source: input
        description: "FK -> Jurisdiction.id; the state the addendum applies to"
        constraints: "unique together with policy_version_id"
      - name: body_text
        type: string
        source: input
        description: "State-specific amending text appended after the canonical body"
        constraints: "non-empty"
      - name: status
        type: enum
        source: system
        description: "Addendum approval state"
        default: "DRAFT"
        constraints: "one of DRAFT, APPROVED, RETIRED"
      - name: approved_by_reviewer_id
        type: string
        source: system
        description: "FK -> LegalReviewer.id; reviewer who approved this addendum, null while DRAFT"
        default: null

  - name: LegalReview
    parent: PolicyVersion
    common_fields: true
    fields:
      - name: policy_version_id
        type: string
        source: input
        description: "FK -> PolicyVersion.id; version under review"
      - name: jurisdiction_id
        type: string
        source: input
        description: "FK -> Jurisdiction.id; jurisdiction whose law this review certifies"
      - name: reviewer_id
        type: string
        source: input
        description: "FK -> LegalReviewer.id; assigned reviewer"
      - name: assigned_at
        type: datetime
        source: system
        description: "Logical-clock instant the review was requested; inclusive lower bound of the reviewer occupation interval"
      - name: due_at
        type: datetime
        source: input
        description: "Inclusive upper bound of the reviewer occupation interval; reviewer capacity is measured over closed [assigned_at, due_at]"
      - name: status
        type: enum
        source: system
        description: "Review state; CHANGES_REQUESTED can return to REQUESTED, forming a revision cycle"
        default: "REQUESTED"
        constraints: "one of REQUESTED, IN_PROGRESS, APPROVED, CHANGES_REQUESTED, WITHDRAWN"
      - name: decided_at
        type: datetime
        source: system
        description: "Logical-clock instant of the latest decision, null while undecided"
        default: null
      - name: round_no
        type: integer
        source: computed
        description: "Number of times this review has been (re-)requested; starts at 1"
        default: 1
      - name: comment
        type: string
        source: input
        description: "Reviewer note supplied with a decision"
        default: null

  - name: Translation
    parent: PolicyVersion
    common_fields: true
    fields:
      - name: policy_version_id
        type: string
        source: input
        description: "FK -> PolicyVersion.id; version being localized"
      - name: language_code
        type: string
        source: input
        description: "Target language primary subtag"
        constraints: "2 lowercase chars, unique together with policy_version_id"
      - name: status
        type: enum
        source: system
        description: "Localization lifecycle; A11Y_REVIEW may return to IN_TRANSLATION when the index is below the gate"
        default: "PENDING"
        constraints: "one of PENDING, IN_TRANSLATION, A11Y_REVIEW, PUBLISHED, ABANDONED"
      - name: section_scores
        type: array
        source: input
        description: "Per-section accessibility sub-scores in [0, 1] with up to 6 decimal digits, exactly PolicyVersion.section_count entries, index order is document order"
        default: []
      - name: a11y_index
        type: number
        source: computed
        description: "Accessibility index in [0, 100] produced by calculation translation_accessibility_index; null until submit-a11y runs"
        default: null
      - name: a11y_round_no
        type: integer
        source: computed
        description: "Number of completed A11Y_REVIEW attempts"
        default: 0
      - name: conformance_level
        type: enum
        source: computed
        description: "Derived WCAG band from a11y_index; FAIL below 90.00, AA in [90.00, 96.00), AAA at >= 96.00"
        default: null
        constraints: "one of FAIL, AA, AAA"

  - name: ReleasePackage
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Release label, globally unique"
        constraints: "unique"
      - name: effective_date
        type: datetime
        source: input
        description: "Instant every PolicyVersion in the package becomes binding"
      - name: scope_jurisdiction_ids
        type: array
        source: input
        description: "Jurisdiction ids the release distributes into; employees outside this set receive no assignment"
        constraints: "non-empty array of Jurisdiction.id values"
      - name: status
        type: enum
        source: system
        description: "Release lifecycle state"
        default: "DRAFT"
        constraints: "one of DRAFT, SCHEDULED, RELEASED, CLOSED, CANCELLED"
      - name: scheduled_at
        type: datetime
        source: system
        description: "Logical-clock instant the package entered SCHEDULED, null before that"
        default: null
      - name: released_at
        type: datetime
        source: system
        description: "Logical-clock instant the package entered RELEASED, null before that"
        default: null
      - name: legal_review_deadline
        type: datetime
        source: computed
        description: "Latest instant all required LegalReview rows must be APPROVED by, produced by calculation legal_review_deadline"
        default: null
      - name: roster_snapshot_size
        type: integer
        source: computed
        description: "Number of DistributionAssignment rows minted at RELEASED time; frozen denominator of the snapshot coverage variant"
        default: 0
      - name: coverage_snapshot_pct
        type: number
        source: computed
        description: "Coverage percentage under variant snapshot_roster of calculation distribution_coverage_rate, 2 decimals"
        default: null
      - name: coverage_live_pct
        type: number
        source: computed
        description: "Coverage percentage under variant live_roster of calculation distribution_coverage_rate, 2 decimals"
        default: null

  - name: ReleaseItem
    parent: ReleasePackage
    common_fields: false
    fields:
      - name: release_package_id
        type: string
        source: input
        description: "FK -> ReleasePackage.id; owning release"
      - name: policy_version_id
        type: string
        source: input
        description: "FK -> PolicyVersion.id; version carried by the release"
        constraints: "unique together with release_package_id"
      - name: supersedes_version_id
        type: string
        source: computed
        description: "FK -> PolicyVersion.id; the previously PUBLISHED version of the same document that this item supersedes at RELEASED time, null when the document had none"
        default: null

  - name: DistributionAssignment
    parent: ReleasePackage
    common_fields: true
    fields:
      - name: release_package_id
        type: string
        source: system
        description: "FK -> ReleasePackage.id; release that minted this assignment"
      - name: policy_version_id
        type: string
        source: system
        description: "FK -> PolicyVersion.id; version the employee must acknowledge"
      - name: employee_id
        type: string
        source: system
        description: "FK -> Employee.id; assignee"
      - name: jurisdiction_id
        type: string
        source: system
        description: "FK -> Jurisdiction.id; jurisdiction snapshot taken from Employee.jurisdiction_id at mint time"
      - name: ack_state
        type: enum
        source: system
        description: "Acknowledgment dimension; evolves independently of escalation_state on the same row"
        default: "UNDELIVERED"
        constraints: "one of UNDELIVERED, PENDING, ACKNOWLEDGED, EXEMPT, VOIDED"
      - name: escalation_state
        type: enum
        source: system
        description: "Escalation dimension; evolves independently of ack_state on the same row"
        default: "NONE"
        constraints: "one of NONE, ESCALATING, RESOLVED, MOOT"
      - name: window_start_date
        type: datetime
        source: system
        description: "Inclusive start of the acknowledgment window, equal to ReleasePackage.effective_date"
      - name: due_date
        type: datetime
        source: computed
        description: "Inclusive end of the acknowledgment window, produced by calculation acknowledgment_due_date"
      - name: delivered_at
        type: datetime
        source: system
        description: "Logical-clock instant ack_state became PENDING, null while UNDELIVERED"
        default: null
      - name: acknowledged_at
        type: datetime
        source: system
        description: "Logical-clock instant of the currently EFFECTIVE Acknowledgment, null when none"
        default: null
      - name: days_overdue
        type: integer
        source: computed
        description: "Whole days between due_date and the logical clock, floor of (now - due_date) in days, 0 when not past due"
        default: 0
      - name: policy_category
        type: enum
        source: system
        description: "PolicyDocument.category snapshot used for the per-employee window buffer check"
        constraints: "one of CODE_OF_CONDUCT, LEAVE, SAFETY, COMPENSATION, DATA_PRIVACY"

  - name: Acknowledgment
    parent: DistributionAssignment
    common_fields: false
    fields:
      - name: assignment_id
        type: string
        source: input
        description: "FK -> DistributionAssignment.id; the assignment being acknowledged"
      - name: employee_id
        type: string
        source: system
        description: "FK -> Employee.id; acknowledging employee, copied from the assignment"
      - name: method
        type: enum
        source: input
        description: "How the acknowledgment was captured"
        constraints: "one of ESIGN, WET_SIGNATURE, ATTESTED"
      - name: language_code
        type: string
        source: input
        description: "Language of the rendition the employee actually read"
        constraints: "2 lowercase chars"
      - name: signature_text
        type: string
        source: input
        description: "Typed full name for ESIGN, scan reference for WET_SIGNATURE, attesting note for ATTESTED"
        constraints: "non-empty"
      - name: captured_at
        type: datetime
        source: system
        description: "Logical-clock instant the acknowledgment was recorded"
      - name: status
        type: enum
        source: system
        description: "EFFECTIVE until revoked; REVOKED rows stay on the append-only log"
        default: "EFFECTIVE"
        constraints: "one of EFFECTIVE, REVOKED"
      - name: revoked_at
        type: datetime
        source: system
        description: "Logical-clock instant of revocation, null while EFFECTIVE"
        default: null

  - name: EscalationCase
    parent: DistributionAssignment
    common_fields: true
    fields:
      - name: assignment_id
        type: string
        source: system
        description: "FK -> DistributionAssignment.id; the non-acknowledged assignment that opened the case"
        constraints: "at most one case per assignment whose status IN {OPEN, NOTIFIED, ESCALATED_HR}"
      - name: employee_id
        type: string
        source: system
        description: "FK -> Employee.id; subject of the escalation"
      - name: notified_manager_id
        type: string
        source: system
        description: "FK -> Employee.id; the subject's manager_id at case-open time, null when the subject has no manager"
        default: null
      - name: tier
        type: integer
        source: computed
        description: "Escalation tier produced by calculation escalation_tier, 1..3"
        default: 1
      - name: status
        type: enum
        source: system
        description: "Case lifecycle; branching close outcomes carry divergent side effects"
        default: "OPEN"
        constraints: "one of OPEN, NOTIFIED, ESCALATED_HR, CLOSED_ACKNOWLEDGED, CLOSED_MOOT, CLOSED_DISCIPLINARY"
      - name: opened_at
        type: datetime
        source: system
        description: "Logical-clock instant the case opened"
      - name: closed_at
        type: datetime
        source: system
        description: "Logical-clock instant the case closed, null while open"
        default: null
      - name: notice_count
        type: integer
        source: computed
        description: "Number of notify actions applied to this case"
        default: 0

  - name: PolicyException
    parent: null
    common_fields: true
    fields:
      - name: employee_id
        type: string
        source: input
        description: "FK -> Employee.id; requesting employee"
      - name: policy_version_id
        type: string
        source: input
        description: "FK -> PolicyVersion.id; version the exception is sought against"
      - name: assignment_id
        type: string
        source: system
        description: "FK -> DistributionAssignment.id; the requester's own assignment for policy_version_id, resolved at create time"
      - name: approving_manager_id
        type: string
        source: system
        description: "FK -> Employee.id; manager who recorded the manager decision, null before that"
        default: null
      - name: deciding_reviewer_id
        type: string
        source: system
        description: "FK -> LegalReviewer.id; reviewer who recorded the legal decision, null before that"
        default: null
      - name: reason_code
        type: enum
        source: input
        description: "Ground for the exception request"
        constraints: "one of RELIGIOUS, MEDICAL, COLLECTIVE_BARGAINING, ROLE_CONFLICT"
      - name: justification
        type: string
        source: input
        description: "Free-text justification"
        constraints: "non-empty, <= 2000 chars"
      - name: requested_days
        type: integer
        source: input
        description: "Requested number of whole days the acknowledgment obligation is suspended"
        constraints: ">= 1, <= 365"
      - name: prior_exception_count
        type: integer
        source: system
        description: "Number of PolicyException rows for the same employee_id whose status == GRANTED at create time; risk-score input"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Approval lifecycle; branches to DENIED from two different states with divergent side effects"
        default: "SUBMITTED"
        constraints: "one of SUBMITTED, MANAGER_APPROVED, GRANTED, DENIED, EXPIRED, REVOKED"
      - name: risk_score_conservative
        type: number
        source: computed
        description: "Risk score under variant conservative_ceiling of calculation exception_risk_score, 2 decimals"
        default: null
      - name: risk_score_aggregate
        type: number
        source: computed
        description: "Risk score under variant weighted_aggregate of calculation exception_risk_score, 2 decimals"
        default: null
      - name: expires_at
        type: datetime
        source: computed
        description: "GRANTED exception end instant = legal decision instant + requested_days days, null before GRANTED"
        default: null

  - name: RetentionRecord
    parent: null
    common_fields: false
    fields:
      - name: acknowledgment_id
        type: string
        source: system
        description: "FK -> Acknowledgment.id; the acknowledgment event this immutable retention row describes"
      - name: employee_id
        type: string
        source: system
        description: "FK -> Employee.id; subject of the retained record"
      - name: jurisdiction_id
        type: string
        source: system
        description: "FK -> Jurisdiction.id; jurisdiction whose retention_years governs this row"
      - name: record_kind
        type: enum
        source: system
        description: "CAPTURE rows carry signed_delta +1, REVOCATION rows carry signed_delta -1"
        constraints: "one of CAPTURE, REVOCATION"
      - name: signed_delta
        type: integer
        source: system
        description: "+1 for CAPTURE, -1 for REVOCATION; the ledger sum is the conserved acknowledgment quantity"
        constraints: "one of 1, -1"
      - name: retained_from
        type: datetime
        source: system
        description: "Logical-clock instant the row was written"
      - name: retention_until
        type: datetime
        source: computed
        description: "Earliest instant the row may be purged, produced by calculation retention_until"
      - name: legal_hold
        type: boolean
        source: system
        description: "When true the row is preserved past retention_until for a dispute"
        default: false
      - name: hold_reason
        type: string
        source: input
        description: "Dispute reference recorded when legal_hold is set"
        default: null

state_machines:
  - entity: PolicyVersion
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, WITHDRAWN]
    shape: cyclic
    transitions:
      - from: DRAFT
        to: IN_LEGAL_REVIEW
        trigger: "POST /policy-versions/{policy_version_id}/submit-for-review"
        actor: PolicyAuthor
        preconditions:
          - "PolicyVersion.status == DRAFT"
          - "for every jurisdiction_id in PolicyVersion.required_jurisdiction_ids there is exactly one JurisdictionAddendum with that jurisdiction_id and status IN {DRAFT, APPROVED}"
          - "for every jurisdiction_id in PolicyVersion.required_jurisdiction_ids there is exactly one LegalReview with that jurisdiction_id and status == REQUESTED"
        side_effects:
          - "PolicyVersion.status = IN_LEGAL_REVIEW"
          - "increments PolicyVersion.version by 1"
      - from: IN_LEGAL_REVIEW
        to: DRAFT
        trigger: "system: a LegalReview on this version records verdict CHANGES_REQUESTED via POST /legal-reviews/{legal_review_id}/decision"
        actor: system
        preconditions:
          - "PolicyVersion.status == IN_LEGAL_REVIEW"
        side_effects:
          - "PolicyVersion.status = DRAFT and PolicyVersion.revision_round += 1 (hop 1)"
          - "because the version left IN_LEGAL_REVIEW, every sibling LegalReview on this version with status IN {REQUESTED, IN_PROGRESS} is set to WITHDRAWN with decided_at = logical clock (hop 2)"
          - "because those reviews became WITHDRAWN, each affected LegalReviewer.open_review_count is decremented by 1 (hop 3)"
          - "because at least one LegalReviewer.open_review_count changed, every JurisdictionAddendum on this version with status == APPROVED is reset to DRAFT with approved_by_reviewer_id = null (hop 4)"
          - "increments PolicyVersion.version by 1"
        note: "Revision cycle: the version can re-enter IN_LEGAL_REVIEW after new REQUESTED reviews are raised, so DRAFT -> IN_LEGAL_REVIEW -> DRAFT repeats and revision_round counts the rounds."
      - from: IN_LEGAL_REVIEW
        to: APPROVED
        trigger: "POST /policy-versions/{policy_version_id}/approve"
        actor: HRComplianceAdmin
        preconditions:
          - "PolicyVersion.status == IN_LEGAL_REVIEW"
          - "for every jurisdiction_id in PolicyVersion.required_jurisdiction_ids the matching LegalReview.status == APPROVED"
          - "for every jurisdiction_id in PolicyVersion.required_jurisdiction_ids the matching JurisdictionAddendum.status == APPROVED"
        side_effects:
          - "PolicyVersion.status = APPROVED, approved_at = logical clock"
          - "PolicyVersion.pinned_addendum_ids = ids of all JurisdictionAddendum rows on this version with status == APPROVED, ordered by created_at ASC"
          - "increments PolicyVersion.version by 1"
      - from: APPROVED
        to: DRAFT
        trigger: "POST /policy-versions/{policy_version_id}/reopen"
        actor: PolicyAuthor
        preconditions:
          - "PolicyVersion.status == APPROVED"
          - "no ReleaseItem references this policy_version_id whose owning ReleasePackage.status IN {SCHEDULED, RELEASED, CLOSED}"
        side_effects:
          - "PolicyVersion.status = DRAFT, approved_at = null, pinned_addendum_ids = [], revision_round += 1"
          - "every LegalReview on this version with status == APPROVED is set to REQUESTED with round_no += 1, decided_at = null, and the owning LegalReviewer.open_review_count += 1"
          - "increments PolicyVersion.version by 1"
      - from: APPROVED
        to: PUBLISHED
        trigger: "system: POST /release-packages/{release_package_id}/release publishes every ReleaseItem version"
        actor: system
        preconditions:
          - "PolicyVersion.status == APPROVED"
        side_effects:
          - "PolicyVersion.status = PUBLISHED, effective_date = ReleasePackage.effective_date"
          - "PolicyDocument.current_published_version_id = this PolicyVersion.id and PolicyDocument.latest_version_no unchanged"
          - "increments PolicyVersion.version by 1"
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system: a later PolicyVersion of the same PolicyDocument enters PUBLISHED"
        actor: system
        preconditions:
          - "PolicyVersion.status == PUBLISHED"
          - "the successor PolicyVersion.policy_document_id equals this PolicyVersion.policy_document_id"
        side_effects:
          - "PolicyVersion.status = SUPERSEDED and window_end_date = successor.effective_date (hop 1)"
          - "because this version became SUPERSEDED, every DistributionAssignment with this policy_version_id whose ack_state IN {UNDELIVERED, PENDING} is set to ack_state = VOIDED (hop 2)"
          - "because those assignments became VOIDED, each owning Employee.open_ack_count is decremented by 1 (hop 3)"
          - "because those assignments became VOIDED, every EscalationCase on them with status IN {OPEN, NOTIFIED, ESCALATED_HR} is set to CLOSED_MOOT with closed_at = logical clock, the assignment escalation_state = MOOT, and each such Employee.open_escalation_count is decremented by 1 (hop 4)"
          - "increments PolicyVersion.version by 1"
      - from: PUBLISHED
        to: WITHDRAWN
        trigger: "POST /policy-versions/{policy_version_id}/withdraw"
        actor: HRComplianceAdmin
        preconditions:
          - "PolicyVersion.status == PUBLISHED"
        side_effects:
          - "PolicyVersion.status = WITHDRAWN, window_end_date = logical clock"
          - "every DistributionAssignment with this policy_version_id whose ack_state IN {UNDELIVERED, PENDING} is set to ack_state = VOIDED and the owning Employee.open_ack_count is decremented by 1"
          - "PolicyDocument.current_published_version_id = null"
          - "increments PolicyVersion.version by 1"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /policy-versions/{policy_version_id}/withdraw"
        actor: HRComplianceAdmin
        preconditions:
          - "PolicyVersion.status == DRAFT"
        side_effects:
          - "PolicyVersion.status = WITHDRAWN"
          - "every JurisdictionAddendum on this version is set to RETIRED"
          - "increments PolicyVersion.version by 1"

  - entity: LegalReview
    initial_state: REQUESTED
    terminal_states: [WITHDRAWN]
    shape: cyclic
    transitions:
      - from: REQUESTED
        to: IN_PROGRESS
        trigger: "POST /legal-reviews/{legal_review_id}/start"
        actor: LegalCounsel
        preconditions:
          - "LegalReview.status == REQUESTED"
          - "LegalReview.reviewer_id == X-User-ID"
          - "the owning PolicyVersion.status == IN_LEGAL_REVIEW"
        side_effects:
          - "LegalReview.status = IN_PROGRESS"
          - "increments LegalReview.version by 1"
      - from: IN_PROGRESS
        to: APPROVED
        trigger: "POST /legal-reviews/{legal_review_id}/decision with verdict == APPROVE"
        actor: LegalCounsel
        preconditions:
          - "LegalReview.status == IN_PROGRESS"
          - "LegalReview.reviewer_id == X-User-ID"
        side_effects:
          - "LegalReview.status = APPROVED, decided_at = logical clock"
          - "LegalReviewer.open_review_count -= 1"
          - "increments LegalReview.version by 1"
      - from: IN_PROGRESS
        to: CHANGES_REQUESTED
        trigger: "POST /legal-reviews/{legal_review_id}/decision with verdict == REQUEST_CHANGES"
        actor: LegalCounsel
        preconditions:
          - "LegalReview.status == IN_PROGRESS"
          - "LegalReview.reviewer_id == X-User-ID"
          - "comment is a non-empty string"
        side_effects:
          - "LegalReview.status = CHANGES_REQUESTED, decided_at = logical clock"
          - "LegalReviewer.open_review_count -= 1"
          - "triggers PolicyVersion IN_LEGAL_REVIEW -> DRAFT on the owning version and its four-hop cascade"
          - "increments LegalReview.version by 1"
      - from: CHANGES_REQUESTED
        to: REQUESTED
        trigger: "POST /legal-reviews/{legal_review_id}/re-request"
        actor: PolicyAuthor
        preconditions:
          - "LegalReview.status == CHANGES_REQUESTED"
          - "the owning PolicyVersion.status == DRAFT"
        side_effects:
          - "LegalReview.status = REQUESTED, round_no += 1, decided_at = null, assigned_at = logical clock, due_at = request due_at"
          - "LegalReviewer.open_review_count += 1"
          - "increments LegalReview.version by 1"
        note: "Closes the review cycle REQUESTED -> IN_PROGRESS -> CHANGES_REQUESTED -> REQUESTED."
      - from: REQUESTED
        to: WITHDRAWN
        trigger: "system: the owning PolicyVersion leaves IN_LEGAL_REVIEW for DRAFT"
        actor: system
        preconditions:
          - "LegalReview.status == REQUESTED"
        side_effects:
          - "LegalReview.status = WITHDRAWN, decided_at = logical clock"
          - "LegalReviewer.open_review_count -= 1"
      - from: IN_PROGRESS
        to: WITHDRAWN
        trigger: "system: the owning PolicyVersion leaves IN_LEGAL_REVIEW for DRAFT"
        actor: system
        preconditions:
          - "LegalReview.status == IN_PROGRESS"
        side_effects:
          - "LegalReview.status = WITHDRAWN, decided_at = logical clock"
          - "LegalReviewer.open_review_count -= 1"
      - from: APPROVED
        to: REQUESTED
        trigger: "system: POST /policy-versions/{policy_version_id}/reopen returns the version to DRAFT"
        actor: system
        preconditions:
          - "LegalReview.status == APPROVED"
        side_effects:
          - "LegalReview.status = REQUESTED, round_no += 1, decided_at = null"
          - "LegalReviewer.open_review_count += 1"

  - entity: JurisdictionAddendum
    initial_state: DRAFT
    terminal_states: [RETIRED]
    shape: branching_with_revert
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /addenda/{addendum_id}/approve"
        actor: LegalCounsel
        preconditions:
          - "JurisdictionAddendum.status == DRAFT"
          - "the acting LegalReviewer.id == X-User-ID and that reviewer's jurisdiction_id == JurisdictionAddendum.jurisdiction_id"
          - "the owning PolicyVersion.status IN {DRAFT, IN_LEGAL_REVIEW}"
        side_effects:
          - "JurisdictionAddendum.status = APPROVED, approved_by_reviewer_id = X-User-ID"
          - "increments JurisdictionAddendum.version by 1"
      - from: APPROVED
        to: DRAFT
        trigger: "system: hop 4 of the PolicyVersion IN_LEGAL_REVIEW -> DRAFT cascade"
        actor: system
        preconditions:
          - "JurisdictionAddendum.status == APPROVED"
        side_effects:
          - "JurisdictionAddendum.status = DRAFT, approved_by_reviewer_id = null"
      - from: DRAFT
        to: RETIRED
        trigger: "system: POST /policy-versions/{policy_version_id}/withdraw from DRAFT"
        actor: system
        preconditions:
          - "JurisdictionAddendum.status == DRAFT"
        side_effects:
          - "JurisdictionAddendum.status = RETIRED"
      - from: APPROVED
        to: RETIRED
        trigger: "system: POST /policy-versions/{policy_version_id}/withdraw from DRAFT"
        actor: system
        preconditions:
          - "JurisdictionAddendum.status == APPROVED"
        side_effects:
          - "JurisdictionAddendum.status = RETIRED"

  - entity: Translation
    initial_state: PENDING
    terminal_states: [PUBLISHED, ABANDONED]
    shape: cyclic
    transitions:
      - from: PENDING
        to: IN_TRANSLATION
        trigger: "POST /translations/{translation_id}/start"
        actor: LocalizationSpecialist
        preconditions:
          - "Translation.status == PENDING"
          - "the owning PolicyVersion.status IN {DRAFT, IN_LEGAL_REVIEW, APPROVED}"
        side_effects:
          - "Translation.status = IN_TRANSLATION"
          - "increments Translation.version by 1"
      - from: IN_TRANSLATION
        to: A11Y_REVIEW
        trigger: "POST /translations/{translation_id}/submit-a11y"
        actor: LocalizationSpecialist
        preconditions:
          - "Translation.status == IN_TRANSLATION"
          - "the submitted section_scores array length == the owning PolicyVersion.section_count"
        side_effects:
          - "Translation.section_scores = request section_scores"
          - "runs calculation translation_accessibility_index and writes Translation.a11y_index"
          - "Translation.conformance_level = FAIL when a11y_index < 90.00, AA when 90.00 <= a11y_index < 96.00, AAA when a11y_index >= 96.00"
          - "Translation.status = A11Y_REVIEW"
          - "increments Translation.version by 1"
      - from: A11Y_REVIEW
        to: IN_TRANSLATION
        trigger: "POST /translations/{translation_id}/rework"
        actor: LocalizationSpecialist
        preconditions:
          - "Translation.status == A11Y_REVIEW"
        side_effects:
          - "Translation.status = IN_TRANSLATION, a11y_round_no += 1"
          - "increments Translation.version by 1"
        note: "Closes the localization cycle IN_TRANSLATION -> A11Y_REVIEW -> IN_TRANSLATION."
      - from: A11Y_REVIEW
        to: PUBLISHED
        trigger: "POST /translations/{translation_id}/publish"
        actor: LocalizationSpecialist
        preconditions:
          - "Translation.status == A11Y_REVIEW"
          - "Translation.conformance_level IN {AA, AAA}"
        side_effects:
          - "Translation.status = PUBLISHED"
          - "increments Translation.version by 1"
      - from: PENDING
        to: ABANDONED
        trigger: "POST /translations/{translation_id}/abandon"
        actor: LocalizationSpecialist
        preconditions:
          - "Translation.status == PENDING"
        side_effects:
          - "Translation.status = ABANDONED"
          - "increments Translation.version by 1"
      - from: IN_TRANSLATION
        to: ABANDONED
        trigger: "POST /translations/{translation_id}/abandon"
        actor: LocalizationSpecialist
        preconditions:
          - "Translation.status == IN_TRANSLATION"
        side_effects:
          - "Translation.status = ABANDONED"
          - "increments Translation.version by 1"

  - entity: ReleasePackage
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    shape: branching_with_revert
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /release-packages/{release_package_id}/schedule"
        actor: HRComplianceAdmin
        preconditions:
          - "ReleasePackage.status == DRAFT"
          - "at least one ReleaseItem exists for this package"
          - "every ReleaseItem's PolicyVersion.status == APPROVED"
          - "ReleasePackage.effective_date > logical clock"
          - "for every ReleaseItem version V and every jurisdiction J in ReleasePackage.scope_jurisdiction_ids that also appears in V.required_jurisdiction_ids: V's LegalReview for J has decided_at + J.min_legal_review_days days <= ReleasePackage.effective_date (inclusive, so exact equality passes)"
          - "for every ReleaseItem version V and every jurisdiction J in ReleasePackage.scope_jurisdiction_ids: for every language L in J.required_language_codes there is a Translation on V with language_code == L and status == PUBLISHED"
        side_effects:
          - "ReleasePackage.status = SCHEDULED, scheduled_at = logical clock"
          - "runs calculation legal_review_deadline and writes ReleasePackage.legal_review_deadline"
          - "increments ReleasePackage.version by 1"
      - from: SCHEDULED
        to: DRAFT
        trigger: "POST /release-packages/{release_package_id}/unschedule"
        actor: HRComplianceAdmin
        preconditions:
          - "ReleasePackage.status == SCHEDULED"
        side_effects:
          - "ReleasePackage.status = DRAFT, scheduled_at = null, legal_review_deadline = null"
          - "increments ReleasePackage.version by 1"
      - from: SCHEDULED
        to: RELEASED
        trigger: "POST /release-packages/{release_package_id}/release"
        actor: HRComplianceAdmin
        preconditions:
          - "ReleasePackage.status == SCHEDULED"
          - "request expected_release_package_version == ReleasePackage.version"
          - "logical clock >= ReleasePackage.effective_date"
          - "every ReleaseItem's PolicyVersion.status == APPROVED"
        side_effects:
          - "ReleasePackage.status = RELEASED, released_at = logical clock"
          - "each ReleaseItem's PolicyVersion transitions APPROVED -> PUBLISHED, which cascades PUBLISHED -> SUPERSEDED on the document's prior published version and its downstream hops"
          - "ReleaseItem.supersedes_version_id = the prior PUBLISHED version id of the same document, or null"
          - "one DistributionAssignment is minted per (ReleaseItem, Employee) pair where Employee.jurisdiction_id IN ReleasePackage.scope_jurisdiction_ids AND Employee.employment_status IN {ACTIVE, ON_LEAVE}, ordered by Employee.created_at ASC then ReleaseItem policy_version_id's PolicyVersion.created_at ASC"
          - "each minted DistributionAssignment gets ack_state = UNDELIVERED, escalation_state = NONE, window_start_date = effective_date, and due_date from calculation acknowledgment_due_date"
          - "each assignee Employee.open_ack_count += 1 per minted assignment"
          - "ReleasePackage.roster_snapshot_size = number of minted assignments"
          - "runs calculation distribution_coverage_rate for both variants"
          - "increments ReleasePackage.version by 1"
      - from: RELEASED
        to: CLOSED
        trigger: "system: the last DistributionAssignment of the package leaves ack_state IN {UNDELIVERED, PENDING}"
        actor: system
        preconditions:
          - "ReleasePackage.status == RELEASED"
          - "count of DistributionAssignment rows for this package with ack_state IN {UNDELIVERED, PENDING} == 0"
        side_effects:
          - "ReleasePackage.status = CLOSED"
          - "runs calculation distribution_coverage_rate for both variants and writes coverage_snapshot_pct and coverage_live_pct"
          - "increments ReleasePackage.version by 1"
        note: "Also fires immediately at RELEASED time when zero assignments were minted, giving the empty-roster boundary."
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /release-packages/{release_package_id}/cancel"
        actor: HRComplianceAdmin
        preconditions:
          - "ReleasePackage.status == DRAFT"
        side_effects:
          - "ReleasePackage.status = CANCELLED"
          - "increments ReleasePackage.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /release-packages/{release_package_id}/cancel"
        actor: HRComplianceAdmin
        preconditions:
          - "ReleasePackage.status == SCHEDULED"
        side_effects:
          - "ReleasePackage.status = CANCELLED, legal_review_deadline = null"
          - "increments ReleasePackage.version by 1"

  - entity: DistributionAssignment
    initial_state: UNDELIVERED
    terminal_states: [VOIDED]
    shape: parallel
    parallel_dimensions:
      ack_state: [UNDELIVERED, PENDING, ACKNOWLEDGED, EXEMPT, VOIDED]
      escalation_state: [NONE, ESCALATING, RESOLVED, MOOT]
    note: "ack_state and escalation_state are two independent axes on the same row. A row may be (PENDING, ESCALATING) or (ACKNOWLEDGED, RESOLVED); an ack_state move never sets escalation_state directly except through the documented cross-dimension side effects."
    transitions:
      - dimension: ack_state
        from: UNDELIVERED
        to: PENDING
        trigger: "POST /assignments/{assignment_id}/deliver"
        actor: HRComplianceAdmin
        preconditions:
          - "DistributionAssignment.ack_state == UNDELIVERED"
          - "the owning ReleasePackage.status == RELEASED"
          - "the assignee Employee.employment_status IN {ACTIVE, ON_LEAVE}"
          - "there is a Translation on DistributionAssignment.policy_version_id with language_code == Employee.preferred_language_code and status == PUBLISHED"
          - "when Employee.needs_accessible_format is true, that Translation.a11y_index >= 96.00"
        side_effects:
          - "DistributionAssignment.ack_state = PENDING, delivered_at = logical clock"
          - "increments DistributionAssignment.version by 1"
      - dimension: ack_state
        from: PENDING
        to: ACKNOWLEDGED
        trigger: "POST /acknowledgments"
        actor: Employee
        preconditions:
          - "DistributionAssignment.ack_state == PENDING"
          - "the acting Employee.id == DistributionAssignment.employee_id, or the actor is HRComplianceAdmin with method == ATTESTED"
          - "the assignee Employee.employment_status IN {ACTIVE, ON_LEAVE}"
          - "when method == ESIGN the assignment's Jurisdiction.esign_permitted is true"
          - "when method == ATTESTED the assignment's Jurisdiction.proxy_ack_permitted is true"
          - "the request language_code equals a Translation on this policy_version_id with status == PUBLISHED"
        side_effects:
          - "an Acknowledgment row is appended with status = EFFECTIVE and captured_at = logical clock (hop 1)"
          - "because the Acknowledgment was appended, DistributionAssignment.ack_state = ACKNOWLEDGED and acknowledged_at = captured_at (hop 2)"
          - "because the assignment became ACKNOWLEDGED, a RetentionRecord is appended with record_kind = CAPTURE, signed_delta = +1 and retention_until from calculation retention_until, and Employee.open_ack_count -= 1 (hop 3)"
          - "because Employee.open_ack_count reached its new value, any EscalationCase on this assignment with status IN {OPEN, NOTIFIED, ESCALATED_HR} is closed as CLOSED_ACKNOWLEDGED, the assignment escalation_state = RESOLVED, and Employee.open_escalation_count -= 1 (hop 4)"
          - "when the owning ReleasePackage then has zero assignments with ack_state IN {UNDELIVERED, PENDING}, the package transitions RELEASED -> CLOSED (hop 5)"
          - "increments DistributionAssignment.version by 1"
      - dimension: ack_state
        from: ACKNOWLEDGED
        to: PENDING
        trigger: "POST /acknowledgments/{acknowledgment_id}/revoke"
        actor: HRComplianceAdmin
        preconditions:
          - "DistributionAssignment.ack_state == ACKNOWLEDGED"
          - "the target Acknowledgment.status == EFFECTIVE"
        side_effects:
          - "Acknowledgment.status = REVOKED, revoked_at = logical clock; the row is never deleted"
          - "a compensating RetentionRecord is appended with record_kind = REVOCATION, signed_delta = -1, same employee_id / jurisdiction_id / acknowledgment_id, and retention_until recomputed from calculation retention_until at the revocation instant"
          - "DistributionAssignment.ack_state = PENDING, acknowledged_at = null, Employee.open_ack_count += 1"
          - "DistributionAssignment.escalation_state is left unchanged; a CLOSED_ACKNOWLEDGED EscalationCase is NOT reopened"
          - "when the owning ReleasePackage.status == CLOSED it returns to RELEASED"
          - "increments DistributionAssignment.version by 1"
      - dimension: ack_state
        from: PENDING
        to: EXEMPT
        trigger: "system: a PolicyException on this assignment enters GRANTED"
        actor: system
        preconditions:
          - "DistributionAssignment.ack_state == PENDING"
        side_effects:
          - "DistributionAssignment.ack_state = EXEMPT"
          - "Employee.open_ack_count -= 1"
          - "any EscalationCase on this assignment with status IN {OPEN, NOTIFIED, ESCALATED_HR} is closed as CLOSED_MOOT, escalation_state = MOOT, Employee.open_escalation_count -= 1"
      - dimension: ack_state
        from: UNDELIVERED
        to: VOIDED
        trigger: "system: the assignment's PolicyVersion enters SUPERSEDED or WITHDRAWN"
        actor: system
        preconditions:
          - "DistributionAssignment.ack_state == UNDELIVERED"
        side_effects:
          - "DistributionAssignment.ack_state = VOIDED"
          - "Employee.open_ack_count -= 1"
      - dimension: ack_state
        from: PENDING
        to: VOIDED
        trigger: "system: the assignment's PolicyVersion enters SUPERSEDED or WITHDRAWN"
        actor: system
        preconditions:
          - "DistributionAssignment.ack_state == PENDING"
        side_effects:
          - "DistributionAssignment.ack_state = VOIDED"
          - "Employee.open_ack_count -= 1"
      - dimension: escalation_state
        from: NONE
        to: ESCALATING
        trigger: "system: POST /_ops/escalation-sweep observes days_overdue >= 1"
        actor: system
        preconditions:
          - "DistributionAssignment.ack_state == PENDING"
          - "DistributionAssignment.escalation_state == NONE"
          - "DistributionAssignment.days_overdue >= 1"
          - "no PolicyException on this assignment has status IN {SUBMITTED, MANAGER_APPROVED}"
        side_effects:
          - "DistributionAssignment.escalation_state = ESCALATING"
          - "an EscalationCase is created with status = OPEN, opened_at = logical clock, notified_manager_id = Employee.manager_id, and tier from calculation escalation_tier"
          - "Employee.open_escalation_count += 1"
          - "increments DistributionAssignment.version by 1"
      - dimension: escalation_state
        from: ESCALATING
        to: RESOLVED
        trigger: "system: hop 4 of the POST /acknowledgments cascade"
        actor: system
        preconditions:
          - "DistributionAssignment.escalation_state == ESCALATING"
        side_effects:
          - "DistributionAssignment.escalation_state = RESOLVED"
      - dimension: escalation_state
        from: ESCALATING
        to: MOOT
        trigger: "system: the assignment's ack_state becomes VOIDED or EXEMPT"
        actor: system
        preconditions:
          - "DistributionAssignment.escalation_state == ESCALATING"
        side_effects:
          - "DistributionAssignment.escalation_state = MOOT"

  - entity: EscalationCase
    initial_state: OPEN
    terminal_states: [CLOSED_ACKNOWLEDGED, CLOSED_MOOT, CLOSED_DISCIPLINARY]
    shape: branching
    transitions:
      - from: OPEN
        to: NOTIFIED
        trigger: "POST /escalations/{escalation_case_id}/notify"
        actor: HRComplianceAdmin
        preconditions:
          - "EscalationCase.status == OPEN"
          - "EscalationCase.notified_manager_id is not null"
        side_effects:
          - "EscalationCase.status = NOTIFIED, notice_count += 1"
          - "increments EscalationCase.version by 1"
      - from: NOTIFIED
        to: ESCALATED_HR
        trigger: "POST /escalations/{escalation_case_id}/escalate-hr"
        actor: HRComplianceAdmin
        preconditions:
          - "EscalationCase.status == NOTIFIED"
          - "EscalationCase.tier == 3"
        side_effects:
          - "EscalationCase.status = ESCALATED_HR"
          - "increments EscalationCase.version by 1"
      - from: ESCALATED_HR
        to: CLOSED_DISCIPLINARY
        trigger: "POST /escalations/{escalation_case_id}/close with outcome == DISCIPLINARY"
        actor: HRComplianceAdmin
        preconditions:
          - "EscalationCase.status == ESCALATED_HR"
          - "the linked DistributionAssignment.ack_state == PENDING"
        side_effects:
          - "EscalationCase.status = CLOSED_DISCIPLINARY, closed_at = logical clock"
          - "the linked DistributionAssignment.escalation_state = RESOLVED"
          - "Employee.open_escalation_count -= 1"
          - "increments EscalationCase.version by 1"
        note: "Divergent branch: the assignment stays PENDING and open_ack_count is untouched, unlike CLOSED_ACKNOWLEDGED and CLOSED_MOOT."
      - from: OPEN
        to: CLOSED_ACKNOWLEDGED
        trigger: "system: hop 4 of the POST /acknowledgments cascade"
        actor: system
        preconditions:
          - "EscalationCase.status == OPEN"
        side_effects:
          - "EscalationCase.status = CLOSED_ACKNOWLEDGED, closed_at = logical clock"
          - "Employee.open_escalation_count -= 1"
      - from: NOTIFIED
        to: CLOSED_ACKNOWLEDGED
        trigger: "system: hop 4 of the POST /acknowledgments cascade"
        actor: system
        preconditions:
          - "EscalationCase.status == NOTIFIED"
        side_effects:
          - "EscalationCase.status = CLOSED_ACKNOWLEDGED, closed_at = logical clock"
          - "Employee.open_escalation_count -= 1"
      - from: ESCALATED_HR
        to: CLOSED_ACKNOWLEDGED
        trigger: "system: hop 4 of the POST /acknowledgments cascade"
        actor: system
        preconditions:
          - "EscalationCase.status == ESCALATED_HR"
        side_effects:
          - "EscalationCase.status = CLOSED_ACKNOWLEDGED, closed_at = logical clock"
          - "Employee.open_escalation_count -= 1"
      - from: OPEN
        to: CLOSED_MOOT
        trigger: "system: the linked DistributionAssignment.ack_state becomes VOIDED or EXEMPT"
        actor: system
        preconditions:
          - "EscalationCase.status == OPEN"
        side_effects:
          - "EscalationCase.status = CLOSED_MOOT, closed_at = logical clock"
          - "Employee.open_escalation_count -= 1"
      - from: NOTIFIED
        to: CLOSED_MOOT
        trigger: "system: the linked DistributionAssignment.ack_state becomes VOIDED or EXEMPT"
        actor: system
        preconditions:
          - "EscalationCase.status == NOTIFIED"
        side_effects:
          - "EscalationCase.status = CLOSED_MOOT, closed_at = logical clock"
          - "Employee.open_escalation_count -= 1"
      - from: ESCALATED_HR
        to: CLOSED_MOOT
        trigger: "system: the linked DistributionAssignment.ack_state becomes VOIDED or EXEMPT"
        actor: system
        preconditions:
          - "EscalationCase.status == ESCALATED_HR"
        side_effects:
          - "EscalationCase.status = CLOSED_MOOT, closed_at = logical clock"
          - "Employee.open_escalation_count -= 1"

  - entity: PolicyException
    initial_state: SUBMITTED
    terminal_states: [DENIED, EXPIRED, REVOKED]
    shape: branching
    transitions:
      - from: SUBMITTED
        to: MANAGER_APPROVED
        trigger: "POST /policy-exceptions/{policy_exception_id}/manager-decision with decision == APPROVE"
        actor: PeopleManager
        preconditions:
          - "PolicyException.status == SUBMITTED"
          - "X-User-ID == the requesting Employee.manager_id"
          - "X-User-ID != PolicyException.employee_id (segregation of duties)"
          - "the linked DistributionAssignment.ack_state == PENDING"
        side_effects:
          - "PolicyException.status = MANAGER_APPROVED, approving_manager_id = X-User-ID"
          - "increments PolicyException.version by 1"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /policy-exceptions/{policy_exception_id}/manager-decision with decision == DENY"
        actor: PeopleManager
        preconditions:
          - "PolicyException.status == SUBMITTED"
          - "X-User-ID == the requesting Employee.manager_id"
        side_effects:
          - "PolicyException.status = DENIED, approving_manager_id = X-User-ID, deciding_reviewer_id stays null, expires_at stays null"
          - "the linked DistributionAssignment is left at ack_state == PENDING and Employee.open_ack_count is unchanged"
          - "increments PolicyException.version by 1"
        note: "Manager-deny branch writes no reviewer id and produces no assignment mutation."
      - from: MANAGER_APPROVED
        to: GRANTED
        trigger: "POST /policy-exceptions/{policy_exception_id}/legal-decision with decision == APPROVE"
        actor: LegalCounsel
        preconditions:
          - "PolicyException.status == MANAGER_APPROVED"
          - "the acting LegalReviewer.jurisdiction_id == the requesting Employee.jurisdiction_id"
          - "the acting LegalReviewer.id is not the approved_by_reviewer_id of any JurisdictionAddendum on PolicyException.policy_version_id and is not the reviewer_id of any LegalReview on PolicyException.policy_version_id with status == APPROVED (segregation of duties)"
          - "PolicyException.risk_score_conservative < 70.00"
        side_effects:
          - "PolicyException.status = GRANTED, deciding_reviewer_id = X-User-ID, expires_at = logical clock + PolicyException.requested_days days"
          - "the linked DistributionAssignment transitions ack_state PENDING -> EXEMPT, which decrements Employee.open_ack_count by 1 and moots any open EscalationCase"
          - "increments PolicyException.version by 1"
      - from: MANAGER_APPROVED
        to: DENIED
        trigger: "POST /policy-exceptions/{policy_exception_id}/legal-decision with decision == DENY"
        actor: LegalCounsel
        preconditions:
          - "PolicyException.status == MANAGER_APPROVED"
          - "the acting LegalReviewer.jurisdiction_id == the requesting Employee.jurisdiction_id"
        side_effects:
          - "PolicyException.status = DENIED, deciding_reviewer_id = X-User-ID, expires_at stays null"
          - "the linked DistributionAssignment is left at ack_state == PENDING"
          - "increments PolicyException.version by 1"
        note: "Legal-deny branch writes deciding_reviewer_id, unlike the manager-deny branch; the join at DENIED therefore carries branch-specific field state."
      - from: GRANTED
        to: EXPIRED
        trigger: "system: POST /_ops/escalation-sweep observes logical clock >= PolicyException.expires_at"
        actor: system
        preconditions:
          - "PolicyException.status == GRANTED"
          - "logical clock >= PolicyException.expires_at"
        side_effects:
          - "PolicyException.status = EXPIRED"
          - "the linked DistributionAssignment returns ack_state EXEMPT -> PENDING and Employee.open_ack_count += 1"
          - "DistributionAssignment.due_date = PolicyException.expires_at + the assignment Jurisdiction.ack_deadline_days days"
          - "increments PolicyException.version by 1"
      - from: GRANTED
        to: REVOKED
        trigger: "POST /policy-exceptions/{policy_exception_id}/revoke"
        actor: HRComplianceAdmin
        preconditions:
          - "PolicyException.status == GRANTED"
        side_effects:
          - "PolicyException.status = REVOKED"
          - "the linked DistributionAssignment returns ack_state EXEMPT -> PENDING and Employee.open_ack_count += 1"
          - "increments PolicyException.version by 1"

concurrency_rules:
  - rule_id: version-create-stale-document
    parent_entity: PolicyDocument
    write_endpoint: "POST /policy-documents/{policy_document_id}/versions"
    occ_field: "expected_policy_document_version"
    description: |
      Minting a new PolicyVersion under a PolicyDocument whose version has advanced
      since the client last read it is rejected. A newly minted version legitimately
      becomes the document's latest_version_no and, once released, supersedes the
      prior published version, so a client working from a stale document view would
      otherwise mint a version whose version_no and supersede target it never saw.
    error_id: ERR_STALE_POLICY_DOCUMENT_VERSION
    http_status: 412
  - rule_id: exception-create-stale-employee
    parent_entity: Employee
    write_endpoint: "POST /policy-exceptions"
    occ_field: "expected_employee_version"
    description: |
      Creating a PolicyException against an Employee whose version has advanced since
      the client last read it is rejected. A new exception legitimately supersedes the
      requester's prior GRANTED exception on the same policy_version_id and its
      prior_exception_count is read off the employee's current record, so a stale
      employee view would freeze the wrong risk-score input.
    error_id: ERR_STALE_EMPLOYEE_VERSION
    http_status: 412
  - rule_id: release-stale-package
    parent_entity: ReleasePackage
    write_endpoint: "POST /release-packages/{release_package_id}/release"
    occ_field: "expected_release_package_version"
    description: |
      Releasing a ReleasePackage whose version has advanced since the client last
      read it is rejected. Release legitimately supersedes each document's prior
      PUBLISHED version and mints the assignment roster, so a client working from a
      stale package view would release an item set or effective_date it never saw.
    error_id: ERR_STALE_RELEASE_PACKAGE_VERSION
    http_status: 412

calculations:
  - name: distribution_coverage_rate
    trigger: "On ReleasePackage SCHEDULED -> RELEASED, on RELEASED -> CLOSED, and on every GET /release-packages/{release_package_id}/coverage read"
    algorithm: aggregation
    formula: |
      numerator   = count(DistributionAssignment
                          where release_package_id == P.id
                            and ack_state IN {ACKNOWLEDGED, EXEMPT})
      # variant snapshot_roster
      denom_snap  = P.roster_snapshot_size                       # frozen at RELEASED time
      coverage_snapshot_pct = 100.00 if denom_snap == 0
                              else round(100 * numerator / denom_snap, 2)
      # variant live_roster
      denom_live  = count(DistributionAssignment
                          where release_package_id == P.id
                            and ack_state != VOIDED
                            and assignee Employee.employment_status IN {ACTIVE, ON_LEAVE})
      coverage_live_pct     = 100.00 if denom_live == 0
                              else round(100 * numerator / denom_live, 2)
    input_set: "All DistributionAssignment rows of the package. The snapshot denominator is the frozen mint count including rows later VOIDED and rows whose assignee has since become TERMINATED; the live denominator excludes VOIDED rows and rows whose assignee employment_status == TERMINATED. Numerator is identical for both variants."
    constants:
      EMPTY_DENOMINATOR_RESULT: 100.00
    precision: "2 decimal places, round_half_up"
    variants:
      - name: snapshot_roster
        when: "Written to ReleasePackage.coverage_snapshot_pct; the compliance-of-record number quoted in disputes"
        difference: "Denominator is the frozen roster_snapshot_size, so terminations and voids depress the number"
      - name: live_roster
        when: "Written to ReleasePackage.coverage_live_pct; the operational dashboard number"
        difference: "Denominator excludes VOIDED assignments and TERMINATED assignees, so the same numerator yields a higher percentage"

  - name: exception_risk_score
    trigger: "On POST /policy-exceptions creation, and recomputed on POST /policy-exceptions/{policy_exception_id}/manager-decision"
    algorithm: weighted_scoring
    formula: |
      f_reason   = REASON_FACTOR[PolicyException.reason_code]
      f_duration = round(min(100, PolicyException.requested_days * 100 / 180), 4)
      f_history  = min(100, PolicyException.prior_exception_count * 30)
      f_category = CATEGORY_FACTOR[PolicyDocument.category of PolicyException.policy_version_id]
      weighted   = 0.20*f_reason + 0.15*f_duration + 0.25*f_history + 0.40*f_category
      peak       = max(f_reason, f_duration, f_history, f_category)
      # variant weighted_aggregate
      risk_score_aggregate    = round(weighted, 2)
      # variant conservative_ceiling
      risk_score_conservative = round(0.60 * peak + 0.40 * weighted, 2)
    input_set: "Exactly the four factor inputs above, read at calculation time. prior_exception_count is frozen at creation (count of PolicyException rows for the same employee_id with status == GRANTED at that instant, excluding this row)."
    constants:
      REASON_FACTOR: { RELIGIOUS: 20, MEDICAL: 25, COLLECTIVE_BARGAINING: 45, ROLE_CONFLICT: 65 }
      CATEGORY_FACTOR: { SAFETY: 90, DATA_PRIVACY: 75, COMPENSATION: 55, CODE_OF_CONDUCT: 40, LEAVE: 25 }
      DURATION_DENOMINATOR_DAYS: 180
      GRANT_RISK_CEILING: 70.00
    precision: "f_duration to 4 decimals, both scores to 2 decimal places, round_half_up"
    variants:
      - name: weighted_aggregate
        when: "Written to PolicyException.risk_score_aggregate; reported in exception analytics"
        difference: "Pure weighted mean of the four factors; a single extreme factor is diluted by the weights"
      - name: conservative_ceiling
        when: "Written to PolicyException.risk_score_conservative; this is the variant the GRANT_RISK_CEILING gate reads"
        difference: "Blends 60% of the single highest factor with 40% of the weighted mean, so one extreme factor alone can block the grant"

  - name: translation_accessibility_index
    trigger: "On Translation IN_TRANSLATION -> A11Y_REVIEW via POST /translations/{translation_id}/submit-a11y"
    algorithm: weighted_scoring
    formula: |
      # EVALUATION ORDER IS PINNED: round each section, THEN sum, THEN divide, THEN round once.
      step 1: for k in 0 .. section_count-1:
                per_section_pct[k] = round(section_scores[k] * 100, 2)   # round_half_up, 2 dp
      step 2: rounded_sum = sum(per_section_pct[k]) over all k    # exact sum of the 2-dp values
      step 3: a11y_index  = round(rounded_sum / section_count, 2) # round_half_up, 2 dp
      # The forbidden alternative order -- round(sum(section_scores) * 100 / section_count, 2)
      # without step 1 -- is NOT the specified result. Example (section_count = 4,
      # scores [0.90125, 0.90375, 0.90625, 0.90875]): the pinned order gives
      # 90.13 + 90.38 + 90.63 + 90.88 = 362.02, / 4 = 90.505 -> 90.51, while the
      # forbidden order gives 362.00 / 4 = 90.50. Round per section FIRST.
      conformance_level = FAIL if a11y_index < 90.00
                          else AA if a11y_index < 96.00
                          else AAA
    input_set: "Exactly the section_scores array supplied on the submit-a11y request, in document order, of length equal to the owning PolicyVersion.section_count. No prior submission's scores are carried forward."
    constants:
      SECTION_ROUND_DP: 2
      INDEX_ROUND_DP: 2
      A11Y_AA_MIN: 90.00
      A11Y_AAA_MIN: 96.00
      A11Y_ACCESSIBLE_MIN: 96.00
    precision: "per-section 2 decimals then final index 2 decimals, both round_half_up; the per-section rounding happens strictly before the summation"

  - name: legal_review_deadline
    trigger: "On ReleasePackage DRAFT -> SCHEDULED via POST /release-packages/{release_package_id}/schedule"
    algorithm: constraint_propagation
    formula: |
      # EVALUATION ORDER IS PINNED -- three ordered steps, no re-derivation.
      step 1: base_days   = max(J.min_legal_review_days for J in P.scope_jurisdiction_ids)
      step 2: lead_days   = floor((P.effective_date - logical_clock_at_schedule) / 1 day)
              slack_days  = lead_days - base_days
              buffer_days = 7 if slack_days <= 0
                            else 3 if 1 <= slack_days <= 9
                            else 1
      step 3: legal_review_deadline = P.effective_date - (base_days + buffer_days) days
      # buffer_days is derived from slack_days, which is derived from base_days ONLY.
      # It MUST NOT be re-derived from the resulting legal_review_deadline (which would
      # itself shift slack_days) -- the dependency looks circular and the order above
      # is the single well-defined resolution.
    input_set: "Jurisdictions named in ReleasePackage.scope_jurisdiction_ids (all of them, regardless of whether any ReleaseItem version lists them in required_jurisdiction_ids), plus the logical clock at the instant of the schedule call."
    constants:
      BUFFER_NO_SLACK_DAYS: 7
      BUFFER_TIGHT_DAYS: 3
      BUFFER_COMFORTABLE_DAYS: 1
      SLACK_TIGHT_UPPER: 9
    precision: "whole days; all datetime arithmetic in UTC"

  - name: acknowledgment_due_date
    trigger: "On DistributionAssignment mint during ReleasePackage SCHEDULED -> RELEASED, and re-derived on PolicyException GRANTED -> EXPIRED"
    algorithm: threshold
    formula: |
      # FOUR ORDERED CLAMPS -- the order changes the answer.
      step 1: d = min(Jurisdiction.ack_deadline_days, PolicyDocument.max_ack_deadline_days)
      step 2: if Employee.employment_status == ON_LEAVE: d = d + ON_LEAVE_EXTENSION_DAYS
      step 3: if Employee.needs_accessible_format:       d = max(d, ACCESSIBLE_FLOOR_DAYS)
      step 4: if PolicyDocument.category == SAFETY:      d = min(d, SAFETY_CAP_DAYS)
      due_date = DistributionAssignment.window_start_date + d days
      # On PolicyException GRANTED -> EXPIRED the base is the exception expires_at
      # instead of window_start_date, and only Jurisdiction.ack_deadline_days is used
      # (no clamps), per the PolicyException EXPIRED side effect.
    input_set: "Jurisdiction of the assignment, PolicyDocument of the assignment's PolicyVersion, and the assignee Employee's employment_status and needs_accessible_format as of the mint instant."
    constants:
      ON_LEAVE_EXTENSION_DAYS: 14
      ACCESSIBLE_FLOOR_DAYS: 21
      SAFETY_CAP_DAYS: 7
    precision: "whole days; due_date is an instant, and the window is closed on both ends [window_start_date, due_date]"

  - name: escalation_tier
    trigger: "On DistributionAssignment escalation_state NONE -> ESCALATING (EscalationCase creation) and recomputed for every EscalationCase with status IN {OPEN, NOTIFIED} on each POST /_ops/escalation-sweep"
    algorithm: threshold
    formula: |
      d = DistributionAssignment.days_overdue
        = 0 if logical_clock <= due_date
          else floor((logical_clock - due_date) / 1 day)
      base_tier = 1 if 1 <= d < TIER2_MIN_DAYS
                  else 2 if TIER2_MIN_DAYS <= d < TIER3_MIN_DAYS
                  else 3
      tier = min(3, base_tier + 1) if PolicyDocument.category == SAFETY else base_tier
      # Boundaries are inclusive on the lower edge: d == 7 is tier 2 (not tier 1),
      # d == 14 is tier 3 (not tier 2), d == 13 is tier 2.
    input_set: "The assignment's days_overdue at the sweep instant and the PolicyDocument.category of its PolicyVersion. Assignments with ack_state != PENDING are excluded from the sweep entirely."
    constants:
      TIER2_MIN_DAYS: 7
      TIER3_MIN_DAYS: 14
      MAX_TIER: 3
    precision: "integer tier in 1..3; day differences are floor-truncated whole days"

  - name: retention_until
    trigger: "On RetentionRecord append during hop 3 of the POST /acknowledgments cascade and during the compensating append of POST /acknowledgments/{acknowledgment_id}/revoke"
    algorithm: threshold
    formula: |
      calendar_base = retained_from + Jurisdiction.retention_years calendar years
                      (same month and day; 29 Feb maps to 1 Mar of the target year)
      dispute_floor = retained_from + DISPUTE_FLOOR_DAYS days
      retention_until = max(calendar_base, dispute_floor)
    input_set: "The Jurisdiction referenced by the RetentionRecord.jurisdiction_id (snapshotted from the assignment, not re-read from the Employee at revocation time) and the logical clock at the append instant."
    constants:
      DISPUTE_FLOOR_DAYS: 1095
    precision: "instant precision to milliseconds; the retained_from time-of-day is preserved"

  - name: ack_ledger_balance
    trigger: "Invariant recomputed after every RetentionRecord append (both CAPTURE and REVOCATION) and asserted on GET /employees/{employee_id}"
    algorithm: aggregation
    formula: |
      ledger_balance(E) = sum(RetentionRecord.signed_delta
                              where employee_id == E.id)          # every row, no status filter
      effective_acks(E) = count(Acknowledgment
                                where employee_id == E.id
                                  and status == EFFECTIVE)
      INVARIANT: ledger_balance(E) == effective_acks(E) at all times
    input_set: "All RetentionRecord rows for the employee (append-only, never deleted, no time window) and all Acknowledgment rows for the employee with status == EFFECTIVE."
    constants:
      CAPTURE_DELTA: 1
      REVOCATION_DELTA: -1
    precision: "integers; the conserved quantity is the signed record count, not the row count"

  - name: open_ack_count_reconciliation
    trigger: "Invariant recomputed after every DistributionAssignment ack_state transition and after every ReleasePackage SCHEDULED -> RELEASED mint"
    algorithm: aggregation
    formula: |
      open_ack_count(E) = count(DistributionAssignment
                                where employee_id == E.id
                                  and ack_state IN {UNDELIVERED, PENDING})
      INVARIANT: Employee.open_ack_count == open_ack_count(E) after every request completes,
                 including after compensating actions (revoke, exception expiry, void).
    input_set: "All DistributionAssignment rows of the employee across every ReleasePackage, with the explicit ack_state filter above; no time window."
    constants:
      OPEN_ACK_STATES: [UNDELIVERED, PENDING]
    precision: "non-negative integer; the denormalized field must never drift from the recomputed count"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty (X-User-ID may be omitted only for the Anonymous-free surface: never, every endpoint requires it)"
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role is one of the six roles declared in the RBAC matrix"
    error_id: ERR_UNKNOWN_ROLE
    http_status: 401
    applies_to: "all"
  - priority: 3
    category: auth
    check: "For entity_backed roles, X-User-ID resolves to an existing row of the backing entity (Employee for Employee and PeopleManager, LegalReviewer for LegalCounsel)"
    error_id: ERR_ACTOR_IDENTITY_UNKNOWN
    http_status: 403
    applies_to: "all endpoints whose roles include Employee, PeopleManager or LegalCounsel"
  - priority: 4
    category: auth
    check: "X-User-Role appears in the endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"
  - priority: 5
    category: existence
    check: "Every path id resolves, validated left-to-right in path order"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path parameters"
  - priority: 6
    category: existence
    check: "Every foreign-key id supplied in the request body resolves to an existing row of the referenced entity"
    error_id: ERR_REFERENCED_ENTITY_NOT_FOUND
    http_status: 404
    applies_to: "all write endpoints accepting foreign-key fields"
  - priority: 7
    category: business_constraint
    check: "Request body conforms to the endpoint input schema: required fields present, types correct, enums in range, arrays non-empty where declared, integers inside declared bounds"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all write endpoints"
  - priority: 8
    category: business_constraint
    check: "limit is an integer in [1, 100] and offset is an integer >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list endpoints"
  - priority: 9
    category: auth
    check: "The acting Employee.id equals DistributionAssignment.employee_id when X-User-Role == Employee"
    error_id: ERR_NOT_ASSIGNMENT_OWNER
    http_status: 403
    applies_to: "POST /acknowledgments, POST /policy-exceptions"
  - priority: 10
    category: auth
    check: "The acting LegalReviewer.id equals LegalReview.reviewer_id"
    error_id: ERR_NOT_ASSIGNED_REVIEWER
    http_status: 403
    applies_to: "POST /legal-reviews/{legal_review_id}/start, POST /legal-reviews/{legal_review_id}/decision"
  - priority: 11
    category: auth
    check: "The acting LegalReviewer.jurisdiction_id equals the target JurisdictionAddendum.jurisdiction_id, or equals the requesting Employee.jurisdiction_id for a legal exception decision"
    error_id: ERR_REVIEWER_JURISDICTION_MISMATCH
    http_status: 403
    applies_to: "POST /addenda/{addendum_id}/approve, POST /policy-exceptions/{policy_exception_id}/legal-decision"
  - priority: 12
    category: business_safety
    check: "The acting PeopleManager X-User-ID equals the requesting Employee.manager_id and is not equal to PolicyException.employee_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /policy-exceptions/{policy_exception_id}/manager-decision"
  - priority: 13
    category: business_safety
    check: "The acting LegalReviewer is neither the approved_by_reviewer_id of any JurisdictionAddendum on the exception's policy_version_id nor the reviewer_id of any APPROVED LegalReview on that version"
    error_id: ERR_SOD_REVIEWER_CONFLICT
    http_status: 403
    applies_to: "POST /policy-exceptions/{policy_exception_id}/legal-decision"
  - priority: 14
    category: state
    check: "expected_policy_document_version equals PolicyDocument.version"
    error_id: ERR_STALE_POLICY_DOCUMENT_VERSION
    http_status: 412
    applies_to: "POST /policy-documents/{policy_document_id}/versions"
  - priority: 15
    category: state
    check: "expected_employee_version equals Employee.version"
    error_id: ERR_STALE_EMPLOYEE_VERSION
    http_status: 412
    applies_to: "POST /policy-exceptions"
  - priority: 16
    category: state
    check: "expected_release_package_version equals ReleasePackage.version"
    error_id: ERR_STALE_RELEASE_PACKAGE_VERSION
    http_status: 412
    applies_to: "POST /release-packages/{release_package_id}/release"
  - priority: 17
    category: state
    check: "PolicyVersion.status equals the from-state the requested transition declares in the PolicyVersion state machine"
    error_id: ERR_VERSION_INVALID_STATE
    http_status: 409
    applies_to: "POST /policy-versions/{policy_version_id}/submit-for-review, /approve, /reopen, /withdraw, POST /policy-versions/{policy_version_id}/addenda, POST /policy-versions/{policy_version_id}/legal-reviews"
  - priority: 18
    category: state
    check: "LegalReview.status equals the from-state the requested transition declares"
    error_id: ERR_REVIEW_INVALID_STATE
    http_status: 409
    applies_to: "POST /legal-reviews/{legal_review_id}/start, /decision, /re-request"
  - priority: 19
    category: state
    check: "JurisdictionAddendum.status == DRAFT"
    error_id: ERR_ADDENDUM_INVALID_STATE
    http_status: 409
    applies_to: "POST /addenda/{addendum_id}/approve"
  - priority: 20
    category: state
    check: "Translation.status equals the from-state the requested transition declares"
    error_id: ERR_TRANSLATION_INVALID_STATE
    http_status: 409
    applies_to: "POST /translations/{translation_id}/start, /submit-a11y, /rework, /publish, /abandon"
  - priority: 21
    category: state
    check: "ReleasePackage.status == DRAFT"
    error_id: ERR_RELEASE_NOT_DRAFT
    http_status: 409
    applies_to: "POST /release-packages/{release_package_id}/schedule, POST /release-packages/{release_package_id}/items"
  - priority: 22
    category: state
    check: "ReleasePackage.status == SCHEDULED"
    error_id: ERR_RELEASE_NOT_SCHEDULED
    http_status: 409
    applies_to: "POST /release-packages/{release_package_id}/release, POST /release-packages/{release_package_id}/unschedule"
  - priority: 23
    category: state
    check: "ReleasePackage.status IN {DRAFT, SCHEDULED}"
    error_id: ERR_RELEASE_NOT_CANCELLABLE
    http_status: 409
    applies_to: "POST /release-packages/{release_package_id}/cancel"
  - priority: 24
    category: state
    check: "DistributionAssignment.ack_state equals the from-state the requested transition declares (UNDELIVERED for deliver, PENDING for acknowledge and for exception creation, ACKNOWLEDGED for revoke)"
    error_id: ERR_ASSIGNMENT_INVALID_ACK_STATE
    http_status: 409
    applies_to: "POST /assignments/{assignment_id}/deliver, POST /acknowledgments, POST /acknowledgments/{acknowledgment_id}/revoke, POST /policy-exceptions"
  - priority: 25
    category: state
    check: "PolicyException.status equals the from-state the requested transition declares"
    error_id: ERR_EXCEPTION_INVALID_STATE
    http_status: 409
    applies_to: "POST /policy-exceptions/{policy_exception_id}/manager-decision, /legal-decision, /revoke"
  - priority: 26
    category: state
    check: "EscalationCase.status equals the from-state the requested transition declares"
    error_id: ERR_ESCALATION_INVALID_STATE
    http_status: 409
    applies_to: "POST /escalations/{escalation_case_id}/notify, /escalate-hr, /close"
  - priority: 27
    category: business_safety
    check: "For every jurisdiction_id in PolicyVersion.required_jurisdiction_ids there is a LegalReview on that version with status == APPROVED"
    error_id: ERR_LEGAL_REVIEW_INCOMPLETE
    http_status: 409
    applies_to: "POST /policy-versions/{policy_version_id}/approve"
  - priority: 28
    category: business_safety
    check: "The assignee Employee.employment_status IN {ACTIVE, ON_LEAVE}"
    error_id: ERR_EMPLOYEE_NOT_EMPLOYED
    http_status: 409
    applies_to: "POST /assignments/{assignment_id}/deliver, POST /acknowledgments, POST /policy-exceptions"
  - priority: 29
    category: business_safety
    check: "When method == ESIGN the assignment's Jurisdiction.esign_permitted is true"
    error_id: ERR_ESIGN_NOT_PERMITTED
    http_status: 409
    applies_to: "POST /acknowledgments"
  - priority: 30
    category: business_safety
    check: "When method == ATTESTED the assignment's Jurisdiction.proxy_ack_permitted is true and the actor is HRComplianceAdmin"
    error_id: ERR_PROXY_ACK_NOT_PERMITTED
    http_status: 409
    applies_to: "POST /acknowledgments"
  - priority: 31
    category: business_safety
    check: "PolicyException.risk_score_conservative < 70.00"
    error_id: ERR_EXCEPTION_RISK_TOO_HIGH
    http_status: 409
    applies_to: "POST /policy-exceptions/{policy_exception_id}/legal-decision with decision == APPROVE"
  - priority: 32
    category: business_safety
    check: "EscalationCase.tier == 3"
    error_id: ERR_ESCALATION_TIER_TOO_LOW
    http_status: 409
    applies_to: "POST /escalations/{escalation_case_id}/escalate-hr"
  - priority: 33
    category: business_referential
    check: "For every jurisdiction_id in PolicyVersion.required_jurisdiction_ids there is a JurisdictionAddendum on that version with status == APPROVED"
    error_id: ERR_ADDENDUM_NOT_APPROVED
    http_status: 409
    applies_to: "POST /policy-versions/{policy_version_id}/approve"
  - priority: 34
    category: business_referential
    check: "For every jurisdiction J in ReleasePackage.scope_jurisdiction_ids and every language L in J.required_language_codes, each ReleaseItem's PolicyVersion has a Translation with language_code == L and status == PUBLISHED"
    error_id: ERR_TRANSLATION_NOT_PUBLISHED
    http_status: 409
    applies_to: "POST /release-packages/{release_package_id}/schedule"
  - priority: 35
    category: business_referential
    check: "A Translation with language_code == Employee.preferred_language_code and status == PUBLISHED exists on the assignment's PolicyVersion; when Employee.needs_accessible_format is true that Translation.a11y_index >= 96.00"
    error_id: ERR_ACCESSIBLE_RENDITION_UNAVAILABLE
    http_status: 409
    applies_to: "POST /assignments/{assignment_id}/deliver"
  - priority: 36
    category: business_referential
    check: "The requesting Employee has exactly one DistributionAssignment on the given policy_version_id whose ack_state == PENDING; that assignment becomes PolicyException.assignment_id"
    error_id: ERR_NO_PENDING_ASSIGNMENT
    http_status: 409
    applies_to: "POST /policy-exceptions"
  - priority: 37
    category: business_referential
    check: "The request language_code matches a Translation on the assignment's PolicyVersion with status == PUBLISHED"
    error_id: ERR_RENDITION_LANGUAGE_UNKNOWN
    http_status: 409
    applies_to: "POST /acknowledgments"
  - priority: 38
    category: business_constraint
    check: "Uniqueness: Jurisdiction.state_code globally; LegalReviewer.bar_number per jurisdiction_id; Employee.work_email globally; PolicyDocument.title globally; ReleasePackage.name globally; JurisdictionAddendum (policy_version_id, jurisdiction_id); Translation (policy_version_id, language_code); ReleaseItem (release_package_id, policy_version_id); LegalReview (policy_version_id, jurisdiction_id)"
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: "POST /jurisdictions, POST /legal-reviewers, POST /employees, POST /policy-documents, POST /release-packages, POST /policy-versions/{policy_version_id}/addenda, POST /policy-versions/{policy_version_id}/translations, POST /release-packages/{release_package_id}/items, POST /policy-versions/{policy_version_id}/legal-reviews"
  - priority: 39
    category: business_constraint
    check: "At least one ReleaseItem exists for the package"
    error_id: ERR_RELEASE_EMPTY
    http_status: 409
    applies_to: "POST /release-packages/{release_package_id}/schedule"
  - priority: 40
    category: business_constraint
    check: "Effective-window overlap on PolicyDocument, half-open geometry with adjacency permitted: (a) the candidate ReleasePackage.effective_date must not fall inside the half-open occupied window [V.effective_date, V.window_end_date) of any sibling PolicyVersion of the same PolicyDocument whose status == SUPERSEDED; an effective_date exactly equal to such a sibling's window_end_date is adjacent, not overlapping, and passes clause (a); and (b) when a sibling PolicyVersion of the same document has status == PUBLISHED (open-ended window), the candidate effective_date must be strictly greater than that sibling's effective_date."
    error_id: ERR_EFFECTIVE_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /release-packages/{release_package_id}/schedule"
  - priority: 41
    category: business_constraint
    check: "Reviewer occupation capacity: the number of existing LegalReview rows for the requested reviewer_id with status IN {REQUESTED, IN_PROGRESS} whose CLOSED interval [assigned_at, due_at] intersects the candidate CLOSED interval [logical clock, requested due_at] must be strictly less than LegalReviewer.concurrent_review_limit. Touching endpoints count as an intersection: a candidate whose assigned_at equals an existing due_at overlaps."
    error_id: ERR_REVIEWER_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /policy-versions/{policy_version_id}/legal-reviews, POST /legal-reviews/{legal_review_id}/re-request"
  - priority: 42
    category: business_constraint
    check: "Acknowledgment-window buffer on Employee: for each candidate assignment about to be minted, no existing DistributionAssignment of the same employee_id and same policy_category with ack_state IN {UNDELIVERED, PENDING, ACKNOWLEDGED} may have a CLOSED window [window_start_date, due_date] whose distance to the candidate CLOSED window is strictly less than the employee's Jurisdiction.ack_window_buffer_days whole days. Adjacency is forbidden, and the required gap is measured between the earlier window's due_date and the later window's window_start_date."
    error_id: ERR_ACK_WINDOW_BUFFER_CONFLICT
    http_status: 409
    applies_to: "POST /release-packages/{release_package_id}/release"
  - priority: 43
    category: business_constraint
    check: "The submitted section_scores array length equals the owning PolicyVersion.section_count and every element is a number in [0, 1]"
    error_id: ERR_SECTION_SCORE_SHAPE
    http_status: 422
    applies_to: "POST /translations/{translation_id}/submit-a11y"
  - priority: 44
    category: business_constraint
    check: "Translation.conformance_level IN {AA, AAA}"
    error_id: ERR_A11Y_GATE_NOT_MET
    http_status: 409
    applies_to: "POST /translations/{translation_id}/publish"
  - priority: 45
    category: business_temporal
    check: "ReleasePackage.effective_date is strictly greater than the logical clock"
    error_id: ERR_EFFECTIVE_DATE_IN_PAST
    http_status: 409
    applies_to: "POST /release-packages/{release_package_id}/schedule"
  - priority: 46
    category: business_temporal
    check: "For every ReleaseItem version V and every jurisdiction J in ReleasePackage.scope_jurisdiction_ids that also appears in V.required_jurisdiction_ids, the matching LegalReview.decided_at plus J.min_legal_review_days whole days is less than or equal to ReleasePackage.effective_date (inclusive: exact equality passes)"
    error_id: ERR_LEGAL_REVIEW_LEAD_TIME_SHORT
    http_status: 409
    applies_to: "POST /release-packages/{release_package_id}/schedule"
  - priority: 47
    category: business_temporal
    check: "The logical clock is greater than or equal to ReleasePackage.effective_date"
    error_id: ERR_EFFECTIVE_DATE_NOT_REACHED
    http_status: 409
    applies_to: "POST /release-packages/{release_package_id}/release"
  - priority: 48
    category: business_referential
    check: "The requested LegalReviewer.is_active is true"
    error_id: ERR_REVIEWER_INACTIVE
    http_status: 409
    applies_to: "POST /policy-versions/{policy_version_id}/legal-reviews, POST /legal-reviews/{legal_review_id}/re-request"
  - priority: 49
    category: business_temporal
    check: "The requested to_iso8601 is greater than or equal to the current logical clock; the clock never moves backwards"
    error_id: ERR_CLOCK_REWIND
    http_status: 409
    applies_to: "POST /_clock/set_current_utc"

endpoints:
  - method: POST
    path: "/jurisdictions"
    description: "Register a jurisdiction with its review lead time, acknowledgment deadline, e-sign and proxy rules, retention period, required languages and window buffer"
    roles: [HRComplianceAdmin]
    code: 201
    input: [state_code, display_name, min_legal_review_days, ack_deadline_days, retention_years, required_language_codes, "esign_permitted?", "proxy_ack_permitted?", "ack_window_buffer_days?"]
    output: Jurisdiction
    side_effects: ["none"]
  - method: GET
    path: "/jurisdictions"
    description: "List jurisdictions"
    roles: [HRComplianceAdmin, PolicyAuthor, LegalCounsel, LocalizationSpecialist, PeopleManager, Employee]
    code: 200
    input: ["state_code?", "limit?", "offset?"]
    output: Jurisdiction[]
    side_effects: []
  - method: POST
    path: "/legal-reviewers"
    description: "Register a jurisdiction-licensed legal reviewer with a concurrent review capacity"
    roles: [HRComplianceAdmin]
    code: 201
    input: [jurisdiction_id, full_name, bar_number, "concurrent_review_limit?", "is_active?"]
    output: LegalReviewer
    side_effects: ["none"]
  - method: GET
    path: "/legal-reviewers"
    description: "List legal reviewers, filterable by jurisdiction_id (reverse reachability for LegalReviewer.jurisdiction_id)"
    roles: [HRComplianceAdmin, PolicyAuthor, LegalCounsel]
    code: 200
    input: ["jurisdiction_id?", "is_active?", "limit?", "offset?"]
    output: LegalReviewer[]
    side_effects: []
  - method: POST
    path: "/employees"
    description: "Create an employee record with jurisdiction, manager, language preference and accessibility need"
    roles: [HRComplianceAdmin]
    code: 201
    input: [jurisdiction_id, work_email, full_name, "manager_id?", "preferred_language_code?", "needs_accessible_format?", "employment_status?"]
    output: Employee
    side_effects: ["Employee.open_ack_count = 0", "Employee.open_escalation_count = 0"]
  - method: GET
    path: "/employees"
    description: "List employees, filterable by jurisdiction_id, manager_id (reverse reachability for Employee.jurisdiction_id and the self-referential Employee.manager_id) and employment_status"
    roles: [HRComplianceAdmin, PeopleManager, PolicyAuthor]
    code: 200
    input: ["jurisdiction_id?", "manager_id?", "employment_status?", "limit?", "offset?"]
    output: Employee[]
    side_effects: []
  - method: GET
    path: "/employees/{employee_id}"
    description: "Read one employee including the denormalized open_ack_count and open_escalation_count that the conservation invariants assert on"
    roles: [HRComplianceAdmin, PeopleManager, Employee]
    code: 200
    input: []
    output: Employee
    side_effects: []
  - method: PATCH
    path: "/employees/{employee_id}"
    description: "Update employment status, language preference, accessibility need or manager link"
    roles: [HRComplianceAdmin]
    code: 200
    input: ["employment_status?", "preferred_language_code?", "needs_accessible_format?", "manager_id?"]
    output: Employee
    side_effects: ["increments Employee.version by 1", "changes the live_roster denominator of calculation distribution_coverage_rate when employment_status becomes TERMINATED"]
  - method: POST
    path: "/policy-documents"
    description: "Create a handbook policy document; owner_user_id is set to the acting PolicyAuthor's opaque X-User-ID"
    roles: [PolicyAuthor]
    code: 201
    input: [title, category, "max_ack_deadline_days?"]
    output: PolicyDocument
    side_effects: ["PolicyDocument.latest_version_no = 0", "PolicyDocument.current_published_version_id = null"]
  - method: GET
    path: "/policy-documents"
    description: "List policy documents, filterable by category and by current_published_version_id (reverse reachability for PolicyDocument.current_published_version_id)"
    roles: [HRComplianceAdmin, PolicyAuthor, LegalCounsel, LocalizationSpecialist, PeopleManager, Employee]
    code: 200
    input: ["category?", "current_published_version_id?", "limit?", "offset?"]
    output: PolicyDocument[]
    side_effects: []
  - method: GET
    path: "/policy-documents/{policy_document_id}"
    description: "Read one policy document"
    roles: [HRComplianceAdmin, PolicyAuthor, LegalCounsel, LocalizationSpecialist, PeopleManager, Employee]
    code: 200
    input: []
    output: PolicyDocument
    side_effects: []
  - method: POST
    path: "/policy-documents/{policy_document_id}/versions"
    description: "Mint the next PolicyVersion of a document. OCC-guarded on the parent document's version"
    roles: [PolicyAuthor]
    code: 201
    input: [body_text, section_count, required_jurisdiction_ids, expected_policy_document_version]
    output: PolicyVersion
    side_effects: ["PolicyVersion.version_no = PolicyDocument.latest_version_no + 1", "PolicyVersion.status = DRAFT", "PolicyDocument.latest_version_no += 1", "increments PolicyDocument.version by 1"]
  - method: GET
    path: "/policy-versions"
    description: "List policy versions, filterable by policy_document_id (reverse reachability for PolicyVersion.policy_document_id) and status"
    roles: [HRComplianceAdmin, PolicyAuthor, LegalCounsel, LocalizationSpecialist, PeopleManager, Employee]
    code: 200
    input: ["policy_document_id?", "status?", "limit?", "offset?"]
    output: PolicyVersion[]
    side_effects: []
  - method: GET
    path: "/policy-versions/{policy_version_id}"
    description: "Read one policy version including status, revision_round, effective_date, window_end_date and pinned_addendum_ids"
    roles: [HRComplianceAdmin, PolicyAuthor, LegalCounsel, LocalizationSpecialist, PeopleManager, Employee]
    code: 200
    input: []
    output: PolicyVersion
    side_effects: []
  - method: POST
    path: "/policy-versions/{policy_version_id}/addenda"
    description: "Attach a state-specific addendum to a DRAFT or IN_LEGAL_REVIEW version"
    roles: [PolicyAuthor]
    code: 201
    input: [jurisdiction_id, body_text]
    output: JurisdictionAddendum
    side_effects: ["JurisdictionAddendum.status = DRAFT"]
  - method: GET
    path: "/addenda"
    description: "List addenda, filterable by policy_version_id, jurisdiction_id and approved_by_reviewer_id (reverse reachability for all three FKs)"
    roles: [HRComplianceAdmin, PolicyAuthor, LegalCounsel, LocalizationSpecialist]
    code: 200
    input: ["policy_version_id?", "jurisdiction_id?", "approved_by_reviewer_id?", "status?", "limit?", "offset?"]
    output: JurisdictionAddendum[]
    side_effects: []
  - method: POST
    path: "/addenda/{addendum_id}/approve"
    description: "Jurisdiction-licensed counsel approves the addendum; DRAFT -> APPROVED"
    roles: [LegalCounsel]
    code: 200
    input: []
    output: JurisdictionAddendum
    side_effects: ["JurisdictionAddendum.status = APPROVED", "JurisdictionAddendum.approved_by_reviewer_id = X-User-ID", "increments JurisdictionAddendum.version by 1"]
  - method: POST
    path: "/policy-versions/{policy_version_id}/legal-reviews"
    description: "Request a jurisdiction legal review from a specific reviewer with a closed occupation interval ending at due_at"
    roles: [PolicyAuthor]
    code: 201
    input: [jurisdiction_id, reviewer_id, due_at]
    output: LegalReview
    side_effects: ["LegalReview.status = REQUESTED, assigned_at = logical clock, round_no = 1", "LegalReviewer.open_review_count += 1"]
  - method: GET
    path: "/legal-reviews"
    description: "List legal reviews, filterable by policy_version_id, jurisdiction_id and reviewer_id (reverse reachability for all three FKs)"
    roles: [HRComplianceAdmin, PolicyAuthor, LegalCounsel]
    code: 200
    input: ["policy_version_id?", "jurisdiction_id?", "reviewer_id?", "status?", "limit?", "offset?"]
    output: LegalReview[]
    side_effects: []
  - method: POST
    path: "/legal-reviews/{legal_review_id}/start"
    description: "Assigned counsel takes the review; REQUESTED -> IN_PROGRESS"
    roles: [LegalCounsel]
    code: 200
    input: []
    output: LegalReview
    side_effects: ["LegalReview.status = IN_PROGRESS", "increments LegalReview.version by 1"]
  - method: POST
    path: "/legal-reviews/{legal_review_id}/decision"
    description: "Record APPROVE or REQUEST_CHANGES. REQUEST_CHANGES drives the four-hop PolicyVersion IN_LEGAL_REVIEW -> DRAFT cascade"
    roles: [LegalCounsel]
    code: 200
    input: [verdict, "comment?"]
    output: LegalReview
    side_effects: ["LegalReview.status = APPROVED or CHANGES_REQUESTED, decided_at = logical clock", "LegalReviewer.open_review_count -= 1", "on REQUEST_CHANGES: PolicyVersion -> DRAFT, sibling reviews -> WITHDRAWN, their reviewers' open_review_count -= 1, APPROVED addenda -> DRAFT", "increments LegalReview.version by 1"]
  - method: POST
    path: "/legal-reviews/{legal_review_id}/re-request"
    description: "Author re-raises a CHANGES_REQUESTED review with a fresh occupation interval; CHANGES_REQUESTED -> REQUESTED"
    roles: [PolicyAuthor]
    code: 200
    input: [due_at]
    output: LegalReview
    side_effects: ["LegalReview.status = REQUESTED, round_no += 1, assigned_at = logical clock, due_at = request due_at, decided_at = null", "LegalReviewer.open_review_count += 1", "increments LegalReview.version by 1"]
  - method: POST
    path: "/policy-versions/{policy_version_id}/submit-for-review"
    description: "Send a DRAFT version into jurisdiction legal review"
    roles: [PolicyAuthor]
    code: 200
    input: []
    output: PolicyVersion
    side_effects: ["PolicyVersion.status = IN_LEGAL_REVIEW", "increments PolicyVersion.version by 1"]
  - method: POST
    path: "/policy-versions/{policy_version_id}/approve"
    description: "Approve a fully reviewed version and pin its approved addendum ids"
    roles: [HRComplianceAdmin]
    code: 200
    input: []
    output: PolicyVersion
    side_effects: ["PolicyVersion.status = APPROVED, approved_at = logical clock", "PolicyVersion.pinned_addendum_ids = approved addendum ids ordered by created_at ASC", "increments PolicyVersion.version by 1"]
  - method: POST
    path: "/policy-versions/{policy_version_id}/reopen"
    description: "Return an APPROVED version to DRAFT, unpinning addenda and re-requesting every APPROVED legal review"
    roles: [PolicyAuthor]
    code: 200
    input: []
    output: PolicyVersion
    side_effects: ["PolicyVersion.status = DRAFT, approved_at = null, pinned_addendum_ids = [], revision_round += 1", "APPROVED LegalReview rows -> REQUESTED with round_no += 1 and reviewer open_review_count += 1", "increments PolicyVersion.version by 1"]
  - method: POST
    path: "/policy-versions/{policy_version_id}/withdraw"
    description: "Withdraw a DRAFT or PUBLISHED version; a PUBLISHED withdrawal voids its open assignments"
    roles: [HRComplianceAdmin]
    code: 200
    input: []
    output: PolicyVersion
    side_effects: ["PolicyVersion.status = WITHDRAWN", "from DRAFT: all addenda -> RETIRED", "from PUBLISHED: window_end_date = logical clock, open assignments -> VOIDED, each assignee Employee.open_ack_count -= 1, PolicyDocument.current_published_version_id = null", "increments PolicyVersion.version by 1"]
  - method: POST
    path: "/policy-versions/{policy_version_id}/translations"
    description: "Open a localization track for one language on a version"
    roles: [LocalizationSpecialist]
    code: 201
    input: [language_code]
    output: Translation
    side_effects: ["Translation.status = PENDING, section_scores = [], a11y_index = null, a11y_round_no = 0"]
  - method: GET
    path: "/translations"
    description: "List translations, filterable by policy_version_id (reverse reachability for Translation.policy_version_id), language_code and status"
    roles: [HRComplianceAdmin, PolicyAuthor, LocalizationSpecialist, LegalCounsel, Employee]
    code: 200
    input: ["policy_version_id?", "language_code?", "status?", "limit?", "offset?"]
    output: Translation[]
    side_effects: []
  - method: GET
    path: "/translations/{translation_id}"
    description: "Read one translation including a11y_index and conformance_level"
    roles: [HRComplianceAdmin, PolicyAuthor, LocalizationSpecialist, LegalCounsel, Employee]
    code: 200
    input: []
    output: Translation
    side_effects: []
  - method: POST
    path: "/translations/{translation_id}/start"
    description: "PENDING -> IN_TRANSLATION"
    roles: [LocalizationSpecialist]
    code: 200
    input: []
    output: Translation
    side_effects: ["Translation.status = IN_TRANSLATION", "increments Translation.version by 1"]
  - method: POST
    path: "/translations/{translation_id}/submit-a11y"
    description: "Submit per-section accessibility sub-scores; runs calculation translation_accessibility_index with the pinned round-then-sum order and derives conformance_level"
    roles: [LocalizationSpecialist]
    code: 200
    input: [section_scores]
    output: Translation
    side_effects: ["Translation.section_scores = request section_scores", "Translation.a11y_index = calculation translation_accessibility_index", "Translation.conformance_level derived from a11y_index", "Translation.status = A11Y_REVIEW", "increments Translation.version by 1"]
  - method: POST
    path: "/translations/{translation_id}/rework"
    description: "A11Y_REVIEW -> IN_TRANSLATION, closing the localization cycle"
    roles: [LocalizationSpecialist]
    code: 200
    input: []
    output: Translation
    side_effects: ["Translation.status = IN_TRANSLATION, a11y_round_no += 1", "increments Translation.version by 1"]
  - method: POST
    path: "/translations/{translation_id}/publish"
    description: "Publish a translation that cleared the WCAG AA gate; A11Y_REVIEW -> PUBLISHED"
    roles: [LocalizationSpecialist]
    code: 200
    input: []
    output: Translation
    side_effects: ["Translation.status = PUBLISHED", "increments Translation.version by 1"]
  - method: POST
    path: "/translations/{translation_id}/abandon"
    description: "Abandon a PENDING or IN_TRANSLATION localization track"
    roles: [LocalizationSpecialist]
    code: 200
    input: []
    output: Translation
    side_effects: ["Translation.status = ABANDONED", "increments Translation.version by 1"]
  - method: POST
    path: "/release-packages"
    description: "Create a release package with an effective_date and a jurisdiction distribution scope"
    roles: [HRComplianceAdmin]
    code: 201
    input: [name, effective_date, scope_jurisdiction_ids]
    output: ReleasePackage
    side_effects: ["ReleasePackage.status = DRAFT, roster_snapshot_size = 0, coverage_snapshot_pct = null, coverage_live_pct = null"]
  - method: GET
    path: "/release-packages"
    description: "List release packages"
    roles: [HRComplianceAdmin, PolicyAuthor, LegalCounsel]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ReleasePackage[]
    side_effects: []
  - method: GET
    path: "/release-packages/{release_package_id}"
    description: "Read one release package including version, legal_review_deadline and roster_snapshot_size"
    roles: [HRComplianceAdmin, PolicyAuthor, LegalCounsel]
    code: 200
    input: []
    output: ReleasePackage
    side_effects: []
  - method: POST
    path: "/release-packages/{release_package_id}/items"
    description: "Add an APPROVED policy version to a DRAFT release package"
    roles: [HRComplianceAdmin]
    code: 201
    input: [policy_version_id]
    output: ReleaseItem
    side_effects: ["ReleaseItem.supersedes_version_id = null until release", "increments ReleasePackage.version by 1"]
  - method: GET
    path: "/release-items"
    description: "List release items, filterable by release_package_id, policy_version_id and supersedes_version_id (reverse reachability for all three FKs)"
    roles: [HRComplianceAdmin, PolicyAuthor, LegalCounsel]
    code: 200
    input: ["release_package_id?", "policy_version_id?", "supersedes_version_id?", "limit?", "offset?"]
    output: ReleaseItem[]
    side_effects: []
  - method: POST
    path: "/release-packages/{release_package_id}/schedule"
    description: "Schedule a DRAFT package: enforces the empty-package check, the effective-window overlap rule, the translation coverage rule and the inclusive legal-review lead-time rule, then runs calculation legal_review_deadline"
    roles: [HRComplianceAdmin]
    code: 200
    input: []
    output: ReleasePackage
    side_effects: ["ReleasePackage.status = SCHEDULED, scheduled_at = logical clock", "ReleasePackage.legal_review_deadline = calculation legal_review_deadline", "increments ReleasePackage.version by 1"]
  - method: POST
    path: "/release-packages/{release_package_id}/unschedule"
    description: "Return a SCHEDULED package to DRAFT"
    roles: [HRComplianceAdmin]
    code: 200
    input: []
    output: ReleasePackage
    side_effects: ["ReleasePackage.status = DRAFT, scheduled_at = null, legal_review_deadline = null", "increments ReleasePackage.version by 1"]
  - method: POST
    path: "/release-packages/{release_package_id}/release"
    description: "Release a SCHEDULED package once the effective_date is reached. OCC-guarded on the package version. Publishes every item version, supersedes each document's prior published version with its downstream cascade, and mints the assignment roster"
    roles: [HRComplianceAdmin]
    code: 200
    input: [expected_release_package_version]
    output: ReleasePackage
    side_effects: ["ReleasePackage.status = RELEASED, released_at = logical clock", "each item PolicyVersion APPROVED -> PUBLISHED with effective_date = package effective_date", "prior PUBLISHED version of the same document -> SUPERSEDED, its open assignments -> VOIDED, assignee open_ack_count -= 1, their open EscalationCase rows -> CLOSED_MOOT with open_escalation_count -= 1", "ReleaseItem.supersedes_version_id set", "DistributionAssignment rows minted for in-scope non-TERMINATED employees ordered by Employee.created_at ASC then PolicyVersion.created_at ASC", "each minted assignment due_date = calculation acknowledgment_due_date", "each assignee Employee.open_ack_count += 1 per minted assignment", "ReleasePackage.roster_snapshot_size = minted count", "ReleasePackage.coverage_snapshot_pct and coverage_live_pct = calculation distribution_coverage_rate", "when zero assignments are minted the package immediately transitions RELEASED -> CLOSED", "increments ReleasePackage.version by 1"]
  - method: POST
    path: "/release-packages/{release_package_id}/cancel"
    description: "Cancel a DRAFT or SCHEDULED package"
    roles: [HRComplianceAdmin]
    code: 200
    input: []
    output: ReleasePackage
    side_effects: ["ReleasePackage.status = CANCELLED, legal_review_deadline = null", "increments ReleasePackage.version by 1"]
  - method: GET
    path: "/release-packages/{release_package_id}/coverage"
    description: "Computed read returning the package with both variants of calculation distribution_coverage_rate recomputed at read time"
    roles: [HRComplianceAdmin, PolicyAuthor]
    code: 200
    input: []
    output: ReleasePackage
    side_effects: ["recomputes and returns ReleasePackage.coverage_snapshot_pct and ReleasePackage.coverage_live_pct without mutating version"]
  - method: GET
    path: "/assignments"
    description: "List distribution assignments, filterable by release_package_id, policy_version_id, employee_id and jurisdiction_id (reverse reachability for all four FKs) plus both state dimensions"
    roles: [HRComplianceAdmin, PeopleManager, Employee, PolicyAuthor]
    code: 200
    input: ["release_package_id?", "policy_version_id?", "employee_id?", "jurisdiction_id?", "ack_state?", "escalation_state?", "limit?", "offset?"]
    output: DistributionAssignment[]
    side_effects: []
  - method: GET
    path: "/assignments/{assignment_id}"
    description: "Read one assignment including both state dimensions, due_date and days_overdue"
    roles: [HRComplianceAdmin, PeopleManager, Employee]
    code: 200
    input: []
    output: DistributionAssignment
    side_effects: []
  - method: POST
    path: "/assignments/{assignment_id}/deliver"
    description: "Deliver an UNDELIVERED assignment once a published rendition in the employee's language (and an accessible one when required) exists; UNDELIVERED -> PENDING"
    roles: [HRComplianceAdmin]
    code: 200
    input: []
    output: DistributionAssignment
    side_effects: ["DistributionAssignment.ack_state = PENDING, delivered_at = logical clock", "increments DistributionAssignment.version by 1"]
  - method: POST
    path: "/acknowledgments"
    description: "Append an electronic, wet-signature or attested acknowledgment. Drives the five-hop acknowledgment cascade"
    roles: [Employee, HRComplianceAdmin]
    code: 201
    input: [assignment_id, method, language_code, signature_text]
    output: Acknowledgment
    side_effects: ["Acknowledgment appended with status = EFFECTIVE and captured_at = logical clock", "DistributionAssignment.ack_state = ACKNOWLEDGED, acknowledged_at = captured_at", "RetentionRecord appended with record_kind = CAPTURE, signed_delta = +1, retention_until = calculation retention_until", "Employee.open_ack_count -= 1", "open EscalationCase -> CLOSED_ACKNOWLEDGED, assignment escalation_state = RESOLVED, Employee.open_escalation_count -= 1", "ReleasePackage RELEASED -> CLOSED when no open assignments remain, recomputing calculation distribution_coverage_rate"]
  - method: GET
    path: "/acknowledgments"
    description: "List acknowledgment events, filterable by assignment_id and employee_id (reverse reachability for both FKs)"
    roles: [HRComplianceAdmin, Employee, PeopleManager]
    code: 200
    input: ["assignment_id?", "employee_id?", "status?", "limit?", "offset?"]
    output: Acknowledgment[]
    side_effects: []
  - method: POST
    path: "/acknowledgments/{acknowledgment_id}/revoke"
    description: "Compensating action: mark an acknowledgment REVOKED and append a signed_delta = -1 RetentionRecord, leaving the append-only log intact"
    roles: [HRComplianceAdmin]
    code: 200
    input: ["reason?"]
    output: Acknowledgment
    side_effects: ["Acknowledgment.status = REVOKED, revoked_at = logical clock; row never deleted", "RetentionRecord appended with record_kind = REVOCATION, signed_delta = -1, retention_until = calculation retention_until", "DistributionAssignment.ack_state = PENDING, acknowledged_at = null, Employee.open_ack_count += 1", "ReleasePackage CLOSED -> RELEASED when applicable", "increments DistributionAssignment.version by 1"]
  - method: GET
    path: "/retention-records"
    description: "List immutable retention rows, filterable by acknowledgment_id, employee_id and jurisdiction_id (reverse reachability for all three FKs); the signed_delta sum is the conserved acknowledgment ledger"
    roles: [HRComplianceAdmin]
    code: 200
    input: ["acknowledgment_id?", "employee_id?", "jurisdiction_id?", "legal_hold?", "limit?", "offset?"]
    output: RetentionRecord[]
    side_effects: []
  - method: POST
    path: "/retention-records/{retention_record_id}/legal-hold"
    description: "Place a dispute legal hold on a retention row so it survives past retention_until"
    roles: [HRComplianceAdmin]
    code: 200
    input: [hold_reason]
    output: RetentionRecord
    side_effects: ["RetentionRecord.legal_hold = true, hold_reason = request hold_reason"]
  - method: GET
    path: "/escalations"
    description: "List escalation cases, filterable by assignment_id, employee_id and notified_manager_id (reverse reachability for all three FKs)"
    roles: [HRComplianceAdmin, PeopleManager]
    code: 200
    input: ["assignment_id?", "employee_id?", "notified_manager_id?", "status?", "tier?", "limit?", "offset?"]
    output: EscalationCase[]
    side_effects: []
  - method: POST
    path: "/escalations/{escalation_case_id}/notify"
    description: "Notify the subject's manager; OPEN -> NOTIFIED"
    roles: [HRComplianceAdmin]
    code: 200
    input: []
    output: EscalationCase
    side_effects: ["EscalationCase.status = NOTIFIED, notice_count += 1", "increments EscalationCase.version by 1"]
  - method: POST
    path: "/escalations/{escalation_case_id}/escalate-hr"
    description: "Escalate a tier-3 case to HR; NOTIFIED -> ESCALATED_HR"
    roles: [HRComplianceAdmin]
    code: 200
    input: []
    output: EscalationCase
    side_effects: ["EscalationCase.status = ESCALATED_HR", "increments EscalationCase.version by 1"]
  - method: POST
    path: "/escalations/{escalation_case_id}/close"
    description: "Close an ESCALATED_HR case with outcome DISCIPLINARY, leaving the assignment PENDING"
    roles: [HRComplianceAdmin]
    code: 200
    input: [outcome]
    output: EscalationCase
    side_effects: ["EscalationCase.status = CLOSED_DISCIPLINARY, closed_at = logical clock", "DistributionAssignment.escalation_state = RESOLVED", "Employee.open_escalation_count -= 1", "increments EscalationCase.version by 1"]
  - method: POST
    path: "/policy-exceptions"
    description: "Employee requests an exception against their own PENDING assignment. OCC-guarded on the requester's Employee version; runs both variants of calculation exception_risk_score"
    roles: [Employee]
    code: 201
    input: [policy_version_id, reason_code, justification, requested_days, expected_employee_version]
    output: PolicyException
    side_effects: ["PolicyException.status = SUBMITTED, employee_id = X-User-ID, assignment_id resolved from the requester's PENDING assignment", "PolicyException.prior_exception_count frozen from the requester's GRANTED exception count", "PolicyException.risk_score_conservative and risk_score_aggregate = calculation exception_risk_score", "increments Employee.version by 1"]
  - method: GET
    path: "/policy-exceptions"
    description: "List exceptions, filterable by employee_id, policy_version_id, assignment_id, approving_manager_id and deciding_reviewer_id (reverse reachability for all five FKs)"
    roles: [HRComplianceAdmin, PeopleManager, LegalCounsel, Employee]
    code: 200
    input: ["employee_id?", "policy_version_id?", "assignment_id?", "approving_manager_id?", "deciding_reviewer_id?", "status?", "limit?", "offset?"]
    output: PolicyException[]
    side_effects: []
  - method: GET
    path: "/policy-exceptions/{policy_exception_id}"
    description: "Read one exception including both risk-score variants and expires_at"
    roles: [HRComplianceAdmin, PeopleManager, LegalCounsel, Employee]
    code: 200
    input: []
    output: PolicyException
    side_effects: []
  - method: POST
    path: "/policy-exceptions/{policy_exception_id}/manager-decision"
    description: "The requester's direct manager approves or denies; segregation of duties forbids self-approval"
    roles: [PeopleManager]
    code: 200
    input: [decision, "note?"]
    output: PolicyException
    side_effects: ["PolicyException.status = MANAGER_APPROVED or DENIED, approving_manager_id = X-User-ID", "recomputes calculation exception_risk_score", "increments PolicyException.version by 1"]
  - method: POST
    path: "/policy-exceptions/{policy_exception_id}/legal-decision"
    description: "Jurisdiction counsel who did not review the version approves or denies; approval exempts the assignment"
    roles: [LegalCounsel]
    code: 200
    input: [decision, "note?"]
    output: PolicyException
    side_effects: ["PolicyException.status = GRANTED or DENIED, deciding_reviewer_id = X-User-ID", "on GRANTED: expires_at = logical clock + requested_days days, assignment ack_state PENDING -> EXEMPT, Employee.open_ack_count -= 1, open EscalationCase -> CLOSED_MOOT with open_escalation_count -= 1", "increments PolicyException.version by 1"]
  - method: POST
    path: "/policy-exceptions/{policy_exception_id}/revoke"
    description: "Revoke a GRANTED exception, returning the assignment to PENDING"
    roles: [HRComplianceAdmin]
    code: 200
    input: ["reason?"]
    output: PolicyException
    side_effects: ["PolicyException.status = REVOKED", "assignment ack_state EXEMPT -> PENDING, Employee.open_ack_count += 1", "increments PolicyException.version by 1"]
  - method: POST
    path: "/_ops/escalation-sweep"
    description: "Operator batch checkpoint: recomputes days_overdue for every PENDING assignment, opens EscalationCase rows for newly overdue ones, recomputes tier for OPEN and NOTIFIED cases, and expires GRANTED PolicyException rows whose expires_at has been reached. Processes assignments ordered by DistributionAssignment.created_at ASC"
    roles: [HRComplianceAdmin]
    code: 200
    input: []
    output: EscalationCase[]
    side_effects: ["for each PENDING assignment with days_overdue >= 1 and escalation_state == NONE: escalation_state = ESCALATING, EscalationCase created with tier = calculation escalation_tier, Employee.open_escalation_count += 1", "for each EscalationCase with status IN {OPEN, NOTIFIED}: tier = calculation escalation_tier", "for each GRANTED PolicyException with logical clock >= expires_at: status = EXPIRED, assignment ack_state EXEMPT -> PENDING, Employee.open_ack_count += 1, due_date re-derived"]
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint that moves the server's logical clock forward. The startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the logical clock reads that default and never falls back to real wall-clock time. The clock may not move backwards"
    roles: [HRComplianceAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["the logical clock used by every deadline, window, overdue and retention computation is set to to_iso8601"]

  - method: GET
    path: "/jurisdictions/{jurisdiction_id}"
    description: "Read one jurisdiction"
    roles: [HRComplianceAdmin, PolicyAuthor, LegalCounsel, LocalizationSpecialist, PeopleManager, Employee]
    code: 200
    input: []
    output: Jurisdiction
    side_effects: []
  - method: GET
    path: "/legal-reviewers/{legal_reviewer_id}"
    description: "Read one legal reviewer including open_review_count and concurrent_review_limit"
    roles: [HRComplianceAdmin, PolicyAuthor, LegalCounsel]
    code: 200
    input: []
    output: LegalReviewer
    side_effects: []
  - method: GET
    path: "/addenda/{addendum_id}"
    description: "Read one jurisdiction addendum"
    roles: [HRComplianceAdmin, PolicyAuthor, LegalCounsel, LocalizationSpecialist]
    code: 200
    input: []
    output: JurisdictionAddendum
    side_effects: []
  - method: GET
    path: "/legal-reviews/{legal_review_id}"
    description: "Read one legal review including round_no, assigned_at, due_at and decided_at"
    roles: [HRComplianceAdmin, PolicyAuthor, LegalCounsel]
    code: 200
    input: []
    output: LegalReview
    side_effects: []
  - method: GET
    path: "/release-items/{release_item_id}"
    description: "Read one release item including supersedes_version_id"
    roles: [HRComplianceAdmin, PolicyAuthor, LegalCounsel]
    code: 200
    input: []
    output: ReleaseItem
    side_effects: []
  - method: GET
    path: "/acknowledgments/{acknowledgment_id}"
    description: "Read one acknowledgment event"
    roles: [HRComplianceAdmin, Employee, PeopleManager]
    code: 200
    input: []
    output: Acknowledgment
    side_effects: []
  - method: GET
    path: "/retention-records/{retention_record_id}"
    description: "Read one immutable retention row including signed_delta, retention_until and legal_hold"
    roles: [HRComplianceAdmin]
    code: 200
    input: []
    output: RetentionRecord
    side_effects: []
  - method: GET
    path: "/escalations/{escalation_case_id}"
    description: "Read one escalation case including tier, notice_count and status"
    roles: [HRComplianceAdmin, PeopleManager]
    code: 200
    input: []
    output: EscalationCase
    side_effects: []

errors:
  - id: ERR_MISSING_AUTH_HEADERS
    http: 401
    condition: "X-User-Role or X-User-ID header absent or empty"
  - id: ERR_UNKNOWN_ROLE
    http: 401
    condition: "X-User-Role is not one of the six declared roles"
  - id: ERR_ACTOR_IDENTITY_UNKNOWN
    http: 403
    condition: "X-User-ID does not resolve to a row of the backing entity for an entity_backed role"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "The acting role is not listed in the endpoint's roles"
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "A path id does not resolve; path ids validated left-to-right"
  - id: ERR_REFERENCED_ENTITY_NOT_FOUND
    http: 404
    condition: "A foreign-key id in the request body does not resolve"
  - id: ERR_VALIDATION
    http: 422
    condition: "Request body fails the endpoint input schema: missing required field, wrong type, enum out of range, empty array where non-empty is required, integer outside declared bounds"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside [1, 100] or offset negative"
  - id: ERR_NOT_ASSIGNMENT_OWNER
    http: 403
    condition: "An Employee acts on a DistributionAssignment whose employee_id is not the acting employee id"
  - id: ERR_NOT_ASSIGNED_REVIEWER
    http: 403
    condition: "A LegalCounsel acts on a LegalReview whose reviewer_id is not the acting reviewer id"
  - id: ERR_REVIEWER_JURISDICTION_MISMATCH
    http: 403
    condition: "The acting reviewer's jurisdiction_id does not match the addendum jurisdiction or the exception requester's jurisdiction"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The acting PeopleManager is not the requester's manager_id, or is the requester themselves"
  - id: ERR_SOD_REVIEWER_CONFLICT
    http: 403
    condition: "The acting reviewer already approved an addendum or a legal review on the exception's policy version"
  - id: ERR_STALE_POLICY_DOCUMENT_VERSION
    http: 412
    condition: "expected_policy_document_version does not equal PolicyDocument.version"
  - id: ERR_STALE_EMPLOYEE_VERSION
    http: 412
    condition: "expected_employee_version does not equal Employee.version"
  - id: ERR_STALE_RELEASE_PACKAGE_VERSION
    http: 412
    condition: "expected_release_package_version does not equal ReleasePackage.version"
  - id: ERR_VERSION_INVALID_STATE
    http: 409
    condition: "PolicyVersion.status is not the from-state the requested transition needs"
  - id: ERR_REVIEW_INVALID_STATE
    http: 409
    condition: "LegalReview.status is not the from-state the requested transition needs"
  - id: ERR_ADDENDUM_INVALID_STATE
    http: 409
    condition: "JurisdictionAddendum.status is not DRAFT on an approve attempt"
  - id: ERR_TRANSLATION_INVALID_STATE
    http: 409
    condition: "Translation.status is not the from-state the requested transition needs"
  - id: ERR_RELEASE_NOT_DRAFT
    http: 409
    condition: "ReleasePackage.status is not DRAFT on a schedule or add-item attempt"
  - id: ERR_RELEASE_NOT_SCHEDULED
    http: 409
    condition: "ReleasePackage.status is not SCHEDULED on a release or unschedule attempt"
  - id: ERR_RELEASE_NOT_CANCELLABLE
    http: 409
    condition: "ReleasePackage.status is not DRAFT or SCHEDULED on a cancel attempt"
  - id: ERR_ASSIGNMENT_INVALID_ACK_STATE
    http: 409
    condition: "DistributionAssignment.ack_state is not the from-state the requested ack-dimension transition needs"
  - id: ERR_EXCEPTION_INVALID_STATE
    http: 409
    condition: "PolicyException.status is not the from-state the requested transition needs"
  - id: ERR_ESCALATION_INVALID_STATE
    http: 409
    condition: "EscalationCase.status is not the from-state the requested transition needs"
  - id: ERR_LEGAL_REVIEW_INCOMPLETE
    http: 409
    condition: "A required jurisdiction of the version has no APPROVED LegalReview at approve time"
  - id: ERR_EMPLOYEE_NOT_EMPLOYED
    http: 409
    condition: "The assignee Employee.employment_status == TERMINATED"
  - id: ERR_ESIGN_NOT_PERMITTED
    http: 409
    condition: "method == ESIGN while the assignment's Jurisdiction.esign_permitted is false"
  - id: ERR_PROXY_ACK_NOT_PERMITTED
    http: 409
    condition: "method == ATTESTED while the assignment's Jurisdiction.proxy_ack_permitted is false, or the actor is not HRComplianceAdmin"
  - id: ERR_EXCEPTION_RISK_TOO_HIGH
    http: 409
    condition: "risk_score_conservative >= 70.00 on a legal APPROVE decision"
  - id: ERR_ESCALATION_TIER_TOO_LOW
    http: 409
    condition: "escalate-hr attempted on a case whose tier is not 3"
  - id: ERR_ADDENDUM_NOT_APPROVED
    http: 409
    condition: "A required jurisdiction of the version has no APPROVED JurisdictionAddendum at approve time"
  - id: ERR_TRANSLATION_NOT_PUBLISHED
    http: 409
    condition: "A language required by a scope jurisdiction has no PUBLISHED Translation on a release item version at schedule time"
  - id: ERR_ACCESSIBLE_RENDITION_UNAVAILABLE
    http: 409
    condition: "No PUBLISHED Translation matches the employee's preferred_language_code, or the employee needs an accessible format and the matching translation's a11y_index is below 96.00"
  - id: ERR_RENDITION_LANGUAGE_UNKNOWN
    http: 409
    condition: "The acknowledgment language_code has no PUBLISHED Translation on the assignment's version"
  - id: ERR_NO_PENDING_ASSIGNMENT
    http: 409
    condition: "The exception requester has no PENDING DistributionAssignment on the given policy version"
  - id: ERR_DUPLICATE_RESOURCE
    http: 409
    condition: "A declared uniqueness constraint is violated"
  - id: ERR_RELEASE_EMPTY
    http: 409
    condition: "Schedule attempted on a package with zero ReleaseItem rows"
  - id: ERR_EFFECTIVE_WINDOW_OVERLAP
    http: 409
    condition: "The candidate effective_date falls inside a sibling version's half-open effective window on the same document"
  - id: ERR_REVIEWER_CAPACITY_EXCEEDED
    http: 409
    condition: "The reviewer already has concurrent_review_limit open reviews whose closed occupation intervals intersect the candidate interval"
  - id: ERR_ACK_WINDOW_BUFFER_CONFLICT
    http: 409
    condition: "A candidate assignment's closed acknowledgment window is separated from an existing same-category window for the same employee by fewer than ack_window_buffer_days whole days"
  - id: ERR_SECTION_SCORE_SHAPE
    http: 422
    condition: "section_scores length differs from PolicyVersion.section_count or an element is outside [0, 1]"
  - id: ERR_A11Y_GATE_NOT_MET
    http: 409
    condition: "Publish attempted while Translation.conformance_level == FAIL"
  - id: ERR_EFFECTIVE_DATE_IN_PAST
    http: 409
    condition: "Schedule attempted while ReleasePackage.effective_date is not strictly after the logical clock"
  - id: ERR_LEGAL_REVIEW_LEAD_TIME_SHORT
    http: 409
    condition: "A required jurisdiction's APPROVED review decided_at plus min_legal_review_days exceeds the package effective_date"
  - id: ERR_EFFECTIVE_DATE_NOT_REACHED
    http: 409
    condition: "Release attempted while the logical clock is strictly before ReleasePackage.effective_date"
  - id: ERR_REVIEWER_INACTIVE
    http: 409
    condition: "A review is requested from a LegalReviewer whose is_active is false"
  - id: ERR_CLOCK_REWIND
    http: 409
    condition: "to_iso8601 is strictly before the current logical clock"

roles:
  - name: HRComplianceAdmin
    description: "Corporate HR policy operations: jurisdictions, employees, reviewers, version approval, releases, delivery, escalations, retention holds and the operator sweep"
    identity: "opaque"
    exclusive_operations:
      - "POST /jurisdictions"
      - "POST /legal-reviewers"
      - "POST /employees"
      - "PATCH /employees/{employee_id}"
      - "POST /policy-versions/{policy_version_id}/approve"
      - "POST /policy-versions/{policy_version_id}/withdraw"
      - "POST /release-packages"
      - "POST /release-packages/{release_package_id}/items"
      - "POST /release-packages/{release_package_id}/schedule"
      - "POST /release-packages/{release_package_id}/unschedule"
      - "POST /release-packages/{release_package_id}/release"
      - "POST /release-packages/{release_package_id}/cancel"
      - "POST /assignments/{assignment_id}/deliver"
      - "POST /acknowledgments/{acknowledgment_id}/revoke"
      - "GET /retention-records"
      - "POST /retention-records/{retention_record_id}/legal-hold"
      - "POST /escalations/{escalation_case_id}/notify"
      - "POST /escalations/{escalation_case_id}/escalate-hr"
      - "POST /escalations/{escalation_case_id}/close"
      - "POST /policy-exceptions/{policy_exception_id}/revoke"
      - "POST /_ops/escalation-sweep"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET /jurisdictions"
      - "GET /employees"
      - "GET /employees/{employee_id}"
      - "GET /policy-documents"
      - "GET /policy-versions"
      - "GET /assignments"
      - "POST /acknowledgments"
      - "GET /release-packages/{release_package_id}/coverage"
      - "GET /policy-exceptions"
  - name: PolicyAuthor
    description: "Handbook author: creates documents and versions, drafts jurisdiction addenda, requests and re-requests legal reviews, submits for review and reopens approved versions"
    identity: "opaque"
    exclusive_operations:
      - "POST /policy-documents"
      - "POST /policy-documents/{policy_document_id}/versions"
      - "POST /policy-versions/{policy_version_id}/addenda"
      - "POST /policy-versions/{policy_version_id}/legal-reviews"
      - "POST /legal-reviews/{legal_review_id}/re-request"
      - "POST /policy-versions/{policy_version_id}/submit-for-review"
      - "POST /policy-versions/{policy_version_id}/reopen"
    shared_operations:
      - "GET /policy-documents"
      - "GET /policy-versions"
      - "GET /addenda"
      - "GET /legal-reviews"
      - "GET /release-packages"
      - "GET /release-packages/{release_package_id}/coverage"
      - "GET /assignments"
  - name: LegalCounsel
    description: "Jurisdiction-licensed counsel: starts and decides legal reviews, approves state addenda, and renders the legal decision on policy exceptions outside their own review scope"
    identity: "entity_backed:LegalReviewer"
    exclusive_operations:
      - "POST /legal-reviews/{legal_review_id}/start"
      - "POST /legal-reviews/{legal_review_id}/decision"
      - "POST /addenda/{addendum_id}/approve"
      - "POST /policy-exceptions/{policy_exception_id}/legal-decision"
    shared_operations:
      - "GET /jurisdictions"
      - "GET /legal-reviewers"
      - "GET /legal-reviews"
      - "GET /addenda"
      - "GET /policy-versions"
      - "GET /translations"
      - "GET /policy-exceptions"
  - name: LocalizationSpecialist
    description: "Translation and accessibility owner: opens localization tracks, submits per-section accessibility scores, reworks failures and publishes conforming renditions"
    identity: "opaque"
    exclusive_operations:
      - "POST /policy-versions/{policy_version_id}/translations"
      - "POST /translations/{translation_id}/start"
      - "POST /translations/{translation_id}/submit-a11y"
      - "POST /translations/{translation_id}/rework"
      - "POST /translations/{translation_id}/publish"
