            - "${s2} == 'SET' — the second set is admitted at exactly the limit"
            - "${err} == 'ERR_WEATHER_EXPOSURE_LIMIT' with HTTP 422 at 16:01, where ${m1} stands at 8.02 == round_half_up(481 / 60, 2)"
            - "${e2} == 8.02 — the curve stops at connected_at, and ${e3} == 8.02 a day later, so a closed module never accrues again"
            - "GET /modular/modules/${m3} still reports site_status == 'DELIVERED'"

      - name: crane_utilization_threshold_triple_at_eighty_five_percent
        claim_type: threshold
        grounds:
          - calculations.crane_pick_feasibility
          - validations[priority=62]
        excluded_because:
          difficulty_instance: boundary_precision_check / crane_utilization_exactly_85_percent_integer_cross_product_on_schedule_pick
          rationale: "That §1.8 instance pins the at-threshold and threshold+1 loads (81_600 vs 81_601 lb against a 96_000 lb chart row) and proves the gate uses the integer cross-product rather than the 2-decimal display value."

      - name: crane_wind_derate_constants_are_applied_before_the_gate
        claim_type: Constants Applied
        grounds:
          - calculations.crane_pick_feasibility
        excluded_because:
          difficulty_instance: combinatorial_formula / mode_a_crane_chart_lookup_then_derate_then_cross_multiplication
          rationale: "WIND_DERATE_GUST_MPH and WIND_DERATE_FACTOR, and the floor() applied to the chart capacity, are the subject of that instance's three-stage composition."

      - name: line_slot_adjacent_intervals_with_zero_gap
        claim_type: interval_merge
        grounds:
          - calculations.line_slot_schedule
