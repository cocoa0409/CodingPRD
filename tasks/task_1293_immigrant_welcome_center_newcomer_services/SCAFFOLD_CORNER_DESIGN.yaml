      - name: referral_ttl_expiry_at_exact_boundary
        claim_type: correct_result
        grounds: ["calculations.referral_slot_accounting", "state_machines.Referral.SENT_to_EXPIRED"]
        distinguishing_aspect: "A SENT referral with ttl_days 14 sent at 2026-08-01T00:00:00Z is still SENT at 2026-08-14T23:59:59Z and EXPIRED at exactly 2026-08-15T00:00:00Z (expiry condition sent_at + ttl <= now, inclusive); expiry releases the org slot."
        test_recipe:
          setup: ["client with REFERRAL_SHARE consent; case; org capacity 2; referral sent at default clock 2026-08-01T00:00:00Z (slots_used 1)"]
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "Mgr One", role_level: "CASE_MANAGER", clearance_level: 2, weekly_appointment_capacity: 10 }
              as: CenterAdmin
              captures: { mgr1_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Cato Client", preferred_language: "es", date_of_birth: "1987-07-07" }
              as: IntakeSpecialist
              captures: { cli_id: $.data.id }
            - call: "POST /consents"
              payload: { client_id: "${cli_id}", scope: "REFERRAL_SHARE" }
              as: CenterAdmin
            - call: "POST /cases"
              payload: { client_id: "${cli_id}", assigned_manager_id: "${mgr1_id}" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { case_id: $.data.id }
            - call: "POST /organizations"
              payload: { name: "Org T", service_categories: ["LEGAL"], referral_capacity: 2, contact_email: "t@org.test" }
              as: CenterAdmin
              captures: { org_id: $.data.id }
            - call: "POST /referrals"
              payload: { case_id: "${case_id}", organization_id: "${org_id}", service_category: "LEGAL", ttl_days: 14 }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/send"
              as: CaseManager
              as_user_id: "${mgr1_id}"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-14T23:59:59Z" }
              as: CenterAdmin
            - call: "POST /_sweeps/run"
              as: CenterAdmin
              captures: { exp_pre: $.data.referrals_expired }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: CenterAdmin
            - call: "POST /_sweeps/run"
              as: CenterAdmin
              captures: { exp_post: $.data.referrals_expired }
            - call: "GET /referrals/${ref_id}"
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { ref_stat: $.data.status }
            - call: "GET /organizations/${org_id}"
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { org_used: $.data.referral_slots_used }
          assert:
            - "Sweep at 2026-08-14T23:59:59Z expires 0 referrals (boundary not yet reached)"
            - "Sweep at exactly 2026-08-15T00:00:00Z expires 1 referral (inclusive boundary)"
            - "Referral.${ref_id}.status == EXPIRED and Organization.referral_slots_used == 0 (slot released by expiry)"

