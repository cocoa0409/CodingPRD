scaffold_corner_design:

  # =====================================================================
  - section: entities
    instances:
      - name: create_course_returns_201_with_all_fields
        claim_type: Creation
        grounds: [entities.Course, endpoints]
        distinguishing_aspect: "POST /golf/courses with all required fields returns 201 and echoes name, course_rating, slope_rating, fees; version==1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /golf/courses"
              payload: { name: "Augusta", course_rating: 76.2, slope_rating: 137, peak_fee_cents: 12000, offpeak_fee_cents: 8000 }
              as: ProShop
              captures: { c_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Course.${c_id}.course_rating == 76.2"
            - "Course.${c_id}.slope_rating == 137"
            - "Course.${c_id}.version == 1"

      - name: course_default_peak_window_and_discount_applied
        claim_type: Defaults
        grounds: [entities.Course.fields.peak_start_hour, entities.Course.fields.peak_end_hour, entities.Course.fields.member_discount_pct]
        distinguishing_aspect: "Omitting peak_start_hour/peak_end_hour/member_discount_pct applies defaults 7, 15, 0.20."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /golf/courses"
              payload: { name: "Defaults", course_rating: 70.0, slope_rating: 113, peak_fee_cents: 8000, offpeak_fee_cents: 5000 }
              as: ProShop
              captures: { c_id: $.data.id }
          assert:
            - "Course.${c_id}.peak_start_hour == 7"
            - "Course.${c_id}.peak_end_hour == 15"
            - "Course.${c_id}.member_discount_pct == 0.20"

      - name: golfer_default_membership_tier_public
        claim_type: Defaults
        grounds: [entities.Golfer.fields.membership_tier]
        distinguishing_aspect: "Omitting membership_tier defaults the Golfer to PUBLIC; handicap fields start NULL/0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /golf/golfers"
              payload: { full_name: "Defaulted" }
              as: ProShop
              captures: { g_id: $.data.id }
          assert:
            - "Golfer.${g_id}.membership_tier == PUBLIC"
            - "Golfer.${g_id}.handicap_index == null"
            - "Golfer.${g_id}.handicap_revision == 0"

      - name: score_differential_computed_and_immutable
        claim_type: Computed Fields
        grounds: [entities.Score.fields.score_differential, calculations.score_differential]
        distinguishing_aspect: "score_differential = round_half_up((113/130)*(95-72.0),1) = round(19.99..)=20.0 on slope 130 rating 72.0; client-supplied differential ignored."
        test_recipe:
          setup: ["Course slope=130, rating=72.0; one golfer."]
          setup_api_calls:
            - call: "POST /golf/courses"
              payload: { name: "DiffCourse", course_rating: 72.0, slope_rating: 130, peak_fee_cents: 8000, offpeak_fee_cents: 5000 }
              as: ProShop
              captures: { c_id: $.data.id }
            - call: "POST /golf/golfers"
              payload: { full_name: "DG", membership_tier: "PUBLIC" }
              as: ProShop
              captures: { g_id: $.data.id }
          trigger:
            - call: "POST /golf/scores"
              payload: { golfer_id: "${g_id}", course_id: "${c_id}", played_on: "2026-05-01", adjusted_gross_score: 95 }
              as: ProShop
              captures: { s_id: $.data.id }
          assert:
            - "Score.${s_id}.score_differential == 20.0"
            - "Score.${s_id}.status == POSTED"

      - name: teetime_capacity_derived_from_group_type
        claim_type: Computed Fields
        grounds: [entities.TeeTime.fields.capacity, entities.TeeTime.fields.group_type]
        distinguishing_aspect: "FOURSOME -> capacity 4, status OPEN, confirmed_count 0 at creation."
        test_recipe:
          setup: ["One course; clock 2026-06-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProShop
            - call: "POST /golf/courses"
              payload: { name: "CapCrs", course_rating: 70.0, slope_rating: 113, peak_fee_cents: 8000, offpeak_fee_cents: 5000 }
              as: ProShop
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /golf/tee-times"
              payload: { course_id: "${c_id}", start_utc: "2026-06-20T09:00:00Z", local_hour: 9, group_type: "FOURSOME" }
              as: ProShop
              captures: { tt_id: $.data.id }
          assert:
            - "TeeTime.${tt_id}.capacity == 4"
            - "TeeTime.${tt_id}.confirmed_count == 0"
            - "TeeTime.${tt_id}.status == OPEN"

      - name: get_golfer_not_found
        claim_type: Not Found
        grounds: [entities.Golfer, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /golf/golfers/{non-existent uuid} returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /golf/golfers/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProShop
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_course_missing_required_field
        claim_type: Required Fields
        grounds: [entities.Course.fields.slope_rating, "errors[ERR_VALIDATION]", "validations[priority=13]"]
        distinguishing_aspect: "POST /golf/courses omitting slope_rating returns 422 ERR_VALIDATION."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /golf/courses"
              payload: { name: "NoSlope", course_rating: 70.0, peak_fee_cents: 8000, offpeak_fee_cents: 5000 }
              as: ProShop
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_VALIDATION"

      - name: course_slope_out_of_range_rejected
        claim_type: Type Constraints
        grounds: [entities.Course.fields.slope_rating, "errors[ERR_VALIDATION]", "validations[priority=13]"]
        distinguishing_aspect: "slope_rating=200 (>155) returns 422 ERR_VALIDATION."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /golf/courses"
              payload: { name: "BadSlope", course_rating: 70.0, slope_rating: 200, peak_fee_cents: 8000, offpeak_fee_cents: 5000 }
              as: ProShop
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_VALIDATION"

      - name: course_peak_end_not_after_start_rejected
        claim_type: Type Constraints
        grounds: [entities.Course.fields.peak_end_hour, "errors[ERR_VALIDATION]", "validations[priority=13]"]
        distinguishing_aspect: "peak_end_hour(7) not > peak_start_hour(7) returns 422 ERR_VALIDATION."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /golf/courses"
              payload: { name: "BadWindow", course_rating: 70.0, slope_rating: 113, peak_fee_cents: 8000, offpeak_fee_cents: 5000, peak_start_hour: 7, peak_end_hour: 7 }
              as: ProShop
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_VALIDATION"

      - name: score_invalid_ags_range_rejected
        claim_type: Type Constraints
        grounds: [entities.Score.fields.adjusted_gross_score, "errors[ERR_VALIDATION]", "validations[priority=13]"]
        distinguishing_aspect: "adjusted_gross_score=40 (<50) returns 422 ERR_VALIDATION."
        test_recipe:
          setup: ["One course, one golfer."]
          setup_api_calls:
            - call: "POST /golf/courses"
              payload: { name: "AgsCourse", course_rating: 70.0, slope_rating: 113, peak_fee_cents: 8000, offpeak_fee_cents: 5000 }
              as: ProShop
              captures: { c_id: $.data.id }
            - call: "POST /golf/golfers"
              payload: { full_name: "AG", membership_tier: "PUBLIC" }
              as: ProShop
              captures: { g_id: $.data.id }
          trigger:
            - call: "POST /golf/scores"
              payload: { golfer_id: "${g_id}", course_id: "${c_id}", played_on: "2026-05-01", adjusted_gross_score: 40 }
              as: ProShop
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_VALIDATION"

      - name: handicaprevision_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.HandicapRevision]
        distinguishing_aspect: "HandicapRevision has common_fields:false — only id and created_at as system fields plus revision_number/effective_utc/golfer_count; no version field, no update endpoint."
        test_recipe:
          setup: ["One refresh exists."]
          setup_api_calls:
            - call: "POST /golf/handicap-revisions"
              payload: { effective_utc: "2026-03-31T00:00:00Z" }
              as: ProShop
              captures: { rev_id: $.data.id }
          trigger:
            - call: "GET /golf/handicap-revisions"
              payload: {}
              as: ProShop
          assert:
            - "response.status == 200"
            - "HandicapRevision.${rev_id}.revision_number == 1"

      - name: score_fk_course_not_found
        claim_type: Parent Relationships
        grounds: [entities.Score.fields.course_id, "errors[ERR_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "POST /golf/scores with a non-existent course_id returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["One golfer; no course with the supplied id."]
          setup_api_calls:
            - call: "POST /golf/golfers"
              payload: { full_name: "FK G", membership_tier: "PUBLIC" }
              as: ProShop
              captures: { g_id: $.data.id }
          trigger:
            - call: "POST /golf/scores"
              payload: { golfer_id: "${g_id}", course_id: "00000000-0000-0000-0000-000000000000", played_on: "2026-05-01", adjusted_gross_score: 90 }
              as: ProShop
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

  # =====================================================================
  - section: state_machines
    instances:
      - name: cancel_already_cancelled_booking_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Booking.CONFIRMED_to_CANCELLED, "errors[ERR_INVALID_STATE]", "validations[priority=5]"]
        distinguishing_aspect: "Owner cancels own CONFIRMED booking, then cancels it again -> 409 ERR_INVALID_STATE (already CANCELLED)."
        test_recipe:
          setup: ["FOURSOME slot; GA CONFIRMED then cancelled. Clock 2026-06-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProShop
            - call: "POST /golf/courses"
              payload: { name: "ISCourse", course_rating: 70.0, slope_rating: 113, peak_fee_cents: 8000, offpeak_fee_cents: 5000 }
              as: ProShop
              captures: { c_id: $.data.id }
            - call: "POST /golf/golfers"
              payload: { full_name: "GA", membership_tier: "PUBLIC" }
              as: ProShop
              captures: { ga: $.data.id }
            - call: "POST /golf/tee-times"
              payload: { course_id: "${c_id}", start_utc: "2026-06-21T09:00:00Z", local_hour: 9, group_type: "FOURSOME" }
              as: ProShop
              captures: { tt_id: $.data.id, v0: $.data.version }
            - call: "POST /golf/tee-times/${tt_id}/bookings"
              payload: { golfer_id: "${ga}", expected_tee_time_version: "${v0}" }
              as: Golfer
              as_user_id: "${ga}"
              captures: { bk_a: $.data.id }
            - call: "POST /golf/bookings/${bk_a}/cancel"
              payload: {}
              as: Golfer
              as_user_id: "${ga}"
          trigger:
            - call: "POST /golf/bookings/${bk_a}/cancel"
              payload: {}
              as: Golfer
              as_user_id: "${ga}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: void_already_void_score_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Score.POSTED_to_VOID, "errors[ERR_INVALID_STATE]", "validations[priority=5]"]
        distinguishing_aspect: "Voiding a Score twice -> second void returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["One score posted then voided."]
          setup_api_calls:
            - call: "POST /golf/courses"
              payload: { name: "VV", course_rating: 70.0, slope_rating: 113, peak_fee_cents: 8000, offpeak_fee_cents: 5000 }
              as: ProShop
              captures: { c_id: $.data.id }
            - call: "POST /golf/golfers"
              payload: { full_name: "VG", membership_tier: "PUBLIC" }
              as: ProShop
              captures: { g_id: $.data.id }
            - call: "POST /golf/scores"
              payload: { golfer_id: "${g_id}", course_id: "${c_id}", played_on: "2026-05-01", adjusted_gross_score: 85 }
              as: ProShop
              captures: { s_id: $.data.id }
            - call: "POST /golf/scores/${s_id}/void"
              payload: {}
              as: ProShop
          trigger:
            - call: "POST /golf/scores/${s_id}/void"
              payload: {}
              as: ProShop
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: close_already_closed_teetime_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.TeeTime.OPEN_to_CLOSED, "errors[ERR_INVALID_STATE]", "validations[priority=5]"]
        distinguishing_aspect: "Closing a CLOSED TeeTime returns 409 ERR_INVALID_STATE (CLOSED is terminal)."
        test_recipe:
          setup: ["One OPEN TeeTime, then closed. Clock 2026-06-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProShop
            - call: "POST /golf/courses"
              payload: { name: "ClCourse", course_rating: 70.0, slope_rating: 113, peak_fee_cents: 8000, offpeak_fee_cents: 5000 }
              as: ProShop
              captures: { c_id: $.data.id }
            - call: "POST /golf/tee-times"
              payload: { course_id: "${c_id}", start_utc: "2026-06-22T09:00:00Z", local_hour: 9, group_type: "TWOSOME" }
              as: ProShop
              captures: { tt_id: $.data.id }
            - call: "POST /golf/tee-times/${tt_id}/close"
              payload: {}
              as: ProShop
          trigger:
            - call: "POST /golf/tee-times/${tt_id}/close"
              payload: {}
              as: ProShop
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: book_closed_teetime_returns_closed_error
        claim_type: Precondition Enforcement
        grounds: [state_machines.TeeTime.OPEN_to_CLOSED, "errors[ERR_TEE_TIME_CLOSED]", "validations[priority=6]"]
        distinguishing_aspect: "Booking a CLOSED slot returns 409 ERR_TEE_TIME_CLOSED."
        test_recipe:
          setup: ["TWOSOME slot closed before any booking. Clock 2026-06-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProShop
            - call: "POST /golf/courses"
              payload: { name: "BkClosed", course_rating: 70.0, slope_rating: 113, peak_fee_cents: 8000, offpeak_fee_cents: 5000 }
              as: ProShop
              captures: { c_id: $.data.id }
            - call: "POST /golf/golfers"
              payload: { full_name: "GA", membership_tier: "PUBLIC" }
              as: ProShop
              captures: { ga: $.data.id }
            - call: "POST /golf/tee-times"
              payload: { course_id: "${c_id}", start_utc: "2026-06-23T09:00:00Z", local_hour: 9, group_type: "TWOSOME" }
              as: ProShop
              captures: { tt_id: $.data.id }
            - call: "POST /golf/tee-times/${tt_id}/close"
              payload: {}
              as: ProShop
              captures: { v_closed: $.data.version }
          trigger:
            - call: "POST /golf/tee-times/${tt_id}/bookings"
              payload: { golfer_id: "${ga}", expected_tee_time_version: "${v_closed}" }
              as: Golfer
              as_user_id: "${ga}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_TEE_TIME_CLOSED"

      - name: cancel_standby_rerank_no_promotion
        claim_type: Side Effect Execution
        grounds: [state_machines.Booking.STANDBY_to_CANCELLED, entities.Booking.fields.standby_rank]
        distinguishing_aspect: "FULL slot with two STANDBY (GC rank1, GD rank2); GC cancels -> GD re-ranks to 1; no CONFIRMED change."
        test_recipe:
          setup: ["TWOSOME GA+GB CONFIRMED (FULL); GC and GD STANDBY (both PUBLIC, GC created first). Clock 2026-06-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProShop
            - call: "POST /golf/courses"
              payload: { name: "SbCourse", course_rating: 70.0, slope_rating: 113, peak_fee_cents: 8000, offpeak_fee_cents: 5000 }
              as: ProShop
              captures: { c_id: $.data.id }
            - call: "POST /golf/golfers"
              payload: { full_name: "GA", membership_tier: "PUBLIC" }
              as: ProShop
              captures: { ga: $.data.id }
            - call: "POST /golf/golfers"
              payload: { full_name: "GB", membership_tier: "PUBLIC" }
              as: ProShop
              captures: { gb: $.data.id }
            - call: "POST /golf/golfers"
              payload: { full_name: "GC", membership_tier: "PUBLIC" }
              as: ProShop
              captures: { gc: $.data.id }
            - call: "POST /golf/golfers"
              payload: { full_name: "GD", membership_tier: "PUBLIC" }
              as: ProShop
              captures: { gd: $.data.id }
            - call: "POST /golf/tee-times"
              payload: { course_id: "${c_id}", start_utc: "2026-06-24T09:00:00Z", local_hour: 9, group_type: "TWOSOME" }
              as: ProShop
              captures: { tt_id: $.data.id, v0: $.data.version }
            - call: "POST /golf/tee-times/${tt_id}/bookings"
              payload: { golfer_id: "${ga}", expected_tee_time_version: "${v0}" }
              as: Golfer
              as_user_id: "${ga}"
              captures: { bk_a: $.data.id, v1: $.data.version }
            - call: "POST /golf/tee-times/${tt_id}/bookings"
              payload: { golfer_id: "${gb}", expected_tee_time_version: "${v1}" }
              as: Golfer
              as_user_id: "${gb}"
              captures: { bk_b: $.data.id, v2: $.data.version }
            - call: "POST /golf/tee-times/${tt_id}/bookings"
              payload: { golfer_id: "${gc}", expected_tee_time_version: "${v2}", join_standby: true }
              as: Golfer
              as_user_id: "${gc}"
              captures: { bk_c: $.data.id, v3: $.data.version }
            - call: "POST /golf/tee-times/${tt_id}/bookings"
              payload: { golfer_id: "${gd}", expected_tee_time_version: "${v3}", join_standby: true }
              as: Golfer
              as_user_id: "${gd}"
              captures: { bk_d: $.data.id }
          trigger:
            - call: "POST /golf/bookings/${bk_c}/cancel"
              payload: {}
              as: Golfer
              as_user_id: "${gc}"
            - call: "GET /golf/bookings/${bk_d}"
              payload: {}
              as: ProShop
          assert:
            - "Booking.${bk_d}.status == STANDBY"
            - "Booking.${bk_d}.standby_rank == 1"
            - "TeeTime.${tt_id}.confirmed_count == 2"

      - name: standby_promotion_picks_member_over_earlier_public
        claim_type: Side Effect Execution
        grounds: [calculations.standby_priority, state_machines.Booking.STANDBY_to_CONFIRMED]
        distinguishing_aspect: "Standby queue has PUBLIC GD (created first) then MEMBER GC; on a freed seat the MEMBER GC is promoted despite later created_at — membership priority beats created_at."
        test_recipe:
          setup: ["TWOSOME GA+GB CONFIRMED; GD (PUBLIC) joins standby first, then GC (MEMBER). Clock 2026-06-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProShop
            - call: "POST /golf/courses"
              payload: { name: "PriSb", course_rating: 70.0, slope_rating: 113, peak_fee_cents: 8000, offpeak_fee_cents: 5000 }
              as: ProShop
              captures: { c_id: $.data.id }
            - call: "POST /golf/golfers"
              payload: { full_name: "GA", membership_tier: "PUBLIC" }
              as: ProShop
              captures: { ga: $.data.id }
            - call: "POST /golf/golfers"
              payload: { full_name: "GB", membership_tier: "PUBLIC" }
              as: ProShop
              captures: { gb: $.data.id }
            - call: "POST /golf/golfers"
              payload: { full_name: "GD", membership_tier: "PUBLIC" }
              as: ProShop
              captures: { gd: $.data.id }
            - call: "POST /golf/golfers"
              payload: { full_name: "GC", membership_tier: "MEMBER" }
              as: ProShop
              captures: { gc: $.data.id }
            - call: "POST /golf/tee-times"
              payload: { course_id: "${c_id}", start_utc: "2026-06-25T09:00:00Z", local_hour: 9, group_type: "TWOSOME" }
              as: ProShop
              captures: { tt_id: $.data.id, v0: $.data.version }
            - call: "POST /golf/tee-times/${tt_id}/bookings"
              payload: { golfer_id: "${ga}", expected_tee_time_version: "${v0}" }
              as: Golfer
              as_user_id: "${ga}"
              captures: { bk_a: $.data.id, v1: $.data.version }
            - call: "POST /golf/tee-times/${tt_id}/bookings"
              payload: { golfer_id: "${gb}", expected_tee_time_version: "${v1}" }
              as: Golfer
              as_user_id: "${gb}"
              captures: { bk_b: $.data.id, v2: $.data.version }
            - call: "POST /golf/tee-times/${tt_id}/bookings"
              payload: { golfer_id: "${gd}", expected_tee_time_version: "${v2}", join_standby: true }
              as: Golfer
              as_user_id: "${gd}"
              captures: { bk_d: $.data.id, v3: $.data.version }
            - call: "POST /golf/tee-times/${tt_id}/bookings"
              payload: { golfer_id: "${gc}", expected_tee_time_version: "${v3}", join_standby: true }
              as: Golfer
              as_user_id: "${gc}"
              captures: { bk_c: $.data.id }
          trigger:
            - call: "POST /golf/bookings/${bk_a}/cancel"
