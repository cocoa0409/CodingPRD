      - name: schedule_double_booking_beats_credit_hold
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - errors[ERR_TECHNICIAN_DOUBLE_BOOKED]
          - errors[ERR_CREDIT_HOLD]
        distinguishing_aspect: |
          Error-category pair business_temporal vs business_fiscal (different
          from state-vs-safety above): scheduling a technician into an
          overlapping window on a credit-held site violates both rule 8 and
          rule 9; ERR_TECHNICIAN_DOUBLE_BOOKED (priority 8) MUST win over
