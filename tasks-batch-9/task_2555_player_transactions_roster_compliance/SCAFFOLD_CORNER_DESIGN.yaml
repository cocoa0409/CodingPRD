            - call: "POST /physical-exams"
              payload: { player_id: "${mw_p_id}", team_id: "${mw_a_id}", exam_type: "ENTRY_PHYSICAL", window_start_at: "2026-08-10T13:00:00Z", window_end_at: "2026-08-10T14:30:00Z", transaction_id: "${mw_txn_id}" }
              as: TeamMedicalOfficer
              as_user_id: "${mw_a_id}"
              captures: { mw_ex1_id: $.data.id }
            - call: "POST /physical-exams/${mw_ex1_id}/record-result"
              payload: { result: "PASSED", performed_at: "2026-08-10T14:00:00Z" }
              as: TeamMedicalOfficer
              as_user_id: "${mw_a_id}"
            - call: "POST /transactions/${mw_txn_id}/file"
              payload: {}
              as: TeamCapAnalyst
              as_user_id: "${mw_a_id}"
            - call: "POST /transactions/${mw_txn_id}/decide"
              payload: { decision: "APPROVE" }
              as: LeagueOfficer
