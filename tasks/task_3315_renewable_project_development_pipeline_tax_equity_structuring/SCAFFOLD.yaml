# =============================================================================
# SCAFFOLD — Renewable Project Development Pipeline & Tax Equity Structuring
# Task 3315 (NextEra-style). Sections 1.0-1.7 only; difficulty/corner designs
# live in sibling files.
# =============================================================================

scenario: |
  Renewable Project Development Pipeline & Tax Equity Structuring (NextEra Energy): site control through land options and easements with resource assessment and interconnection queue position, offtake contracting through power purchase agreements with utilities and corporate buyers including pricing and delivery terms, equipment procurement with turbine and module supply agreements, domestic content considerations and safe harbor timing, tax credit qualification requiring construction start milestones and continuous work documentation, tax equity partnership structuring with flip dates, allocation of credits and cash distribution waterfalls, construction financing conversion to term debt at commercial operation, interconnection upgrade cost allocation and study milestones, project handoff to operations with availability guarantees

domain_name: renewable-pipeline-tax-equity
api_prefix: /api

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - temporal_windowing
  entity_topology: hybrid
  state_machine_shape: branching   # plus cyclic sub-machines (negotiation, deficiency, rejection, cure loops)
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table (12 entities)
# =============================================================================
entities:
  - name: Project
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Project name" }
      - { name: technology, type: enum, source: input, description: "WIND | SOLAR | HYBRID" }
      - { name: target_capacity_mw, type: number, source: input, description: "Planned nameplate capacity in MW" }
      - { name: resource_class, type: enum, source: input, description: "Resource assessment class: A | B | C" }
      - { name: energy_community_eligible, type: boolean, source: input, description: "Sited in qualifying energy community (+10pp ITC adder)", default: false }
      - { name: domestic_content_certified, type: boolean, source: input, description: "Project-level domestic content certification (+10pp ITC adder when a certified supply agreement also exists)", default: false }
      - { name: availability_guarantee_pct, type: number, source: input, description: "Operations handoff availability guarantee, percent", default: 97.0 }
      - { name: status, type: enum, source: system, description: "PROSPECT | SITE_SECURED | DEVELOPMENT | READY_FOR_CONSTRUCTION | UNDER_CONSTRUCTION | COMMISSIONING | COMMERCIAL_OPERATION | OPERATIONAL | ABANDONED" }
      - { name: cod_date, type: datetime, source: system, description: "Commercial operation date, stamped from logical clock on COD cascade; null until then" }
      - { name: measured_availability_pct, type: number, source: input, description: "Measured availability supplied on transition to OPERATIONAL" }
      - { name: availability_ld_usd, type: number, source: computed, description: "Liquidated damages at handoff: round_half_up(max(0, availability_guarantee_pct - measured_availability_pct) * 25000, 2), capped at 500000.00; 0.00 when measured >= guarantee" }
      - { name: tax_credit_anchored, type: boolean, source: computed, description: "True while the project's TaxCreditQualification is SAFE_HARBOR_ESTABLISHED, CONTINUITY_MAINTAINED, CURED, or QUALIFIED" }
      - { name: total_itc_credits_usd, type: number, source: computed, description: "Mirrors TaxCreditQualification.qualified_credit_usd once QUALIFIED; 0.00 before" }

  - name: SiteControlInstrument
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id" }
      - { name: parcel_id, type: string, source: input, description: "Parcel identifier; option/easement overlap is evaluated per parcel_id" }
      - { name: instrument_type, type: enum, source: input, description: "LAND_OPTION | EASEMENT" }
      - { name: start_date, type: datetime, source: input, description: "Instrument window start; half-open interval [start_date, end_date)" }
      - { name: end_date, type: datetime, source: input, description: "Instrument window end (exclusive); must be strictly greater than start_date" }
      - { name: exercise_price_usd, type: number, source: input, description: "Price to exercise the option or perfect the easement" }
      - { name: status, type: enum, source: system, description: "DRAFT | EXECUTED | EXERCISED | RECORDED | EXPIRED | TERMINATED" }

  - name: InterconnectionRequest
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id" }
      - { name: cluster_id, type: string, source: input, description: "Interconnection queue cluster; queue positions and upgrade allocations are per cluster" }
      - { name: requested_capacity_mw, type: number, source: input, description: "Requested interconnection capacity in MW; drives upgrade cost allocation shares" }
      - { name: queue_position, type: integer, source: computed, description: "1-based position among non-WITHDRAWN requests in the cluster; assigned as max+1 on create, compacted on withdrawal; set to 0 when WITHDRAWN" }
      - { name: status, type: enum, source: system, description: "QUEUED | FEASIBILITY_STUDY | SYSTEM_IMPACT_STUDY | FACILITIES_STUDY | AGREEMENT_EXECUTED | IN_SERVICE | WITHDRAWN" }
      - { name: upgrade_allocated, type: boolean, source: computed, description: "True once an upgrade cost allocation has been run over this request's cluster" }
      - { name: upgrade_cost_share_usd, type: number, source: computed, description: "This request's allocated share of the cluster's last_upgrade_total_usd" }
      - { name: last_upgrade_total_usd, type: number, source: computed, description: "Cluster-wide upgrade total used for the most recent allocation; mirrored onto every request in the cluster and reused on withdrawal re-allocation", default: 0.0 }

  - name: InterconnectionStudy
    parent: InterconnectionRequest
    common_fields: true
    fields:
      - { name: request_id, type: string, source: system, description: "FK -> InterconnectionRequest.id" }
      - { name: phase, type: enum, source: input, description: "FEASIBILITY | SYSTEM_IMPACT | FACILITIES" }
      - { name: window_start, type: datetime, source: input, description: "Study window start (closed interval)" }
      - { name: window_end, type: datetime, source: input, description: "Study window end (closed interval); must be >= window_start" }
      - { name: status, type: enum, source: system, description: "SCOPED | IN_PROGRESS | DELIVERED | ACCEPTED | DEFICIENT" }
      - { name: rework_count, type: integer, source: computed, description: "Number of DEFICIENT -> IN_PROGRESS rework loops", default: 0 }

  - name: OfftakeAgreement
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id" }
      - { name: buyer_type, type: enum, source: input, description: "UTILITY | CORPORATE" }
      - { name: base_price_usd_mwh, type: number, source: input, description: "Base PPA price per MWh; must be >= PRICE_FLOOR_USD_MWH (20.00) at EXECUTED" }
      - { name: escalator_pct, type: number, source: input, description: "Annual price escalator, percent" }
      - { name: term_years, type: integer, source: input, description: "PPA delivery term in years" }
      - { name: delivery_start_date, type: datetime, source: input, description: "Contractual first delivery date" }
      - { name: status, type: enum, source: system, description: "NEGOTIATING | COUNTERED | EXECUTED | EFFECTIVE | EXPIRED | TERMINATED" }
      - { name: counter_count, type: integer, source: computed, description: "Number of counter-offer rounds (NEGOTIATING<->COUNTERED loops)", default: 0 }

  - name: SupplyAgreement
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id" }
      - { name: equipment_type, type: enum, source: input, description: "TURBINE | MODULE" }
      - { name: supplier_name, type: string, source: input, description: "Equipment supplier legal name" }
      - { name: total_contract_usd, type: number, source: input, description: "Total contract value; replaced by amendment_total_contract_usd when an amendment re-executes" }
      - { name: domestic_content_certified, type: boolean, source: input, description: "Supplier domestic content certification", default: false }
      - { name: status, type: enum, source: system, description: "DRAFT | EXECUTED | AMENDMENT_PENDING | DELIVERING | FULFILLED | TERMINATED" }
      - { name: amendment_count, type: integer, source: computed, description: "Number of EXECUTED -> AMENDMENT_PENDING -> EXECUTED amendment loops", default: 0 }

  - name: ProcurementOrder
    parent: SupplyAgreement
    common_fields: true
    fields:
      - { name: supply_agreement_id, type: string, source: system, description: "FK -> SupplyAgreement.id" }
      - { name: order_amount_usd, type: number, source: input, description: "Order value; included in ITC eligible basis once safe-harbor qualified" }
      - { name: safe_harbor_method, type: enum, source: input, description: "FIVE_PERCENT_COST | PHYSICAL_WORK — the two safe harbor qualification variants" }
      - { name: eligible_cost_basis_usd, type: number, source: input, description: "Total eligible cost basis against which the 5% test is measured" }
      - { name: deposit_paid_usd, type: number, source: computed, description: "Cumulative deposits paid via DEPOSIT_PAID transitions", default: 0.0 }
      - { name: safe_harbor_qualified, type: boolean, source: computed, description: "True once status reaches SAFE_HARBOR_QUALIFIED; reverts to false on clawback (CANCELLED from SAFE_HARBOR_QUALIFIED)", default: false }
      - { name: physical_work_evidence_uri, type: string, source: input, description: "Evidence URI required when safe_harbor_method = PHYSICAL_WORK at confirm time" }
      - { name: status, type: enum, source: system, description: "PLACED | DEPOSIT_PAID | SAFE_HARBOR_QUALIFIED | DELIVERED | ACCEPTED | CANCELLED" }

  - name: ConstructionMilestone
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id" }
      - { name: milestone_type, type: enum, source: input, description: "FOUNDATION | ERECTION | ENERGIZATION | SUBSTANTIAL_COMPLETION | COMMERCIAL_OPERATION | CONTINUOUS_WORK" }
      - { name: sequence_no, type: integer, source: input, description: "Ordering key; unique per project; certification of seq N requires all seq < N CERTIFIED" }
      - { name: planned_date, type: datetime, source: input, description: "Planned completion date" }
      - { name: evidence_uri, type: string, source: input, description: "Evidence document URI supplied at submit-evidence" }
      - { name: work_date, type: datetime, source: input, description: "Date the physical work occurred; drives continuity gap analysis for CONTINUOUS_WORK milestones" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the ConstructionManager who submitted evidence" }
      - { name: certified_by_user_id, type: string, source: system, description: "X-User-ID of the TaxCounsel who certified; must differ from submitted_by_user_id (segregation of duties)" }
      - { name: status, type: enum, source: system, description: "PLANNED | EVIDENCE_SUBMITTED | CERTIFIED | REJECTED" }

  - name: TaxCreditQualification
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; exactly one per project, auto-created at project creation" }
      - { name: status, type: enum, source: system, description: "NOT_ELIGIBLE | SAFE_HARBOR_ESTABLISHED | CONTINUITY_MAINTAINED | CONTINUITY_LAPSED | CURED | QUALIFIED | DISQUALIFIED" }
      - { name: continuity_variant, type: enum, source: input, description: "FOUR_YEAR_SAFE_HARBOR | FACTS_AND_CIRCUMSTANCES; pinned at SAFE_HARBOR_ESTABLISHED, immutable thereafter" }
      - { name: safe_harbor_established_date, type: datetime, source: system, description: "Logical-clock date when status first reached SAFE_HARBOR_ESTABLISHED" }
      - { name: lapse_date, type: datetime, source: system, description: "Logical-clock date of the most recent transition into CONTINUITY_LAPSED; cure window is lapse_date + 90 days" }
      - { name: lapse_count, type: integer, source: computed, description: "Number of lapses recorded", default: 0 }
      - { name: credit_rate_pct, type: number, source: computed, description: "ITC rate: 30.00 base + 10.00 domestic content adder (project.domestic_content_certified AND >=1 EXECUTED-or-later supply agreement with domestic_content_certified) + 10.00 energy community adder (project.energy_community_eligible)" }
      - { name: qualified_credit_usd, type: number, source: computed, description: "round_half_up(credit_rate_pct/100 * eligible basis, 2); eligible basis = sum of order_amount_usd over ProcurementOrders of the project whose status is SAFE_HARBOR_QUALIFIED, DELIVERED, or ACCEPTED" }

  - name: TaxEquityPartnership
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; at most one non-DISSOLVED partnership per project" }
      - { name: investor_name, type: string, source: input, description: "Tax equity investor legal name" }
      - { name: commitment_usd, type: number, source: input, description: "Total committed capital; contributions may not exceed this in aggregate" }
      - { name: target_irr_pct, type: number, source: input, description: "Investor target IRR; flip permitted only when investor_irr_pct >= target_irr_pct" }
      - { name: investor_pre_flip_share_pct, type: number, source: system, description: "Investor share of cash and credits before flip; fixed 99.00" , default: 99.0 }
      - { name: investor_post_flip_share_pct, type: number, source: system, description: "Investor share of cash and credits after flip; fixed 5.00", default: 5.0 }
      - { name: flip_date, type: datetime, source: system, description: "Logical-clock date of the FLIPPED transition; null before" }
      - { name: investor_irr_pct, type: number, source: computed, description: "round_half_up((((investor cash distributions + investor credit allocations) / investor contributions) - 1) * 100, 2); 0.00 when no contributions" }
      - { name: contributed_usd, type: number, source: computed, description: "Sum of CONTRIBUTION ledger entries" }
      - { name: retained_cash_usd, type: number, source: computed, description: "contributed_usd - sum of DISTRIBUTION_INVESTOR and DISTRIBUTION_DEVELOPER entries" }
      - { name: status, type: enum, source: system, description: "STRUCTURING | COMMITMENT_EXECUTED | FUNDING | FULLY_FUNDED | PRE_FLIP_OPERATING | FLIPPED | DISSOLVED" }

  - name: PartnershipLedgerEntry
    parent: TaxEquityPartnership
    common_fields: false
    fields:
      - { name: partnership_id, type: string, source: system, description: "FK -> TaxEquityPartnership.id" }
      - { name: entry_type, type: enum, source: system, description: "CONTRIBUTION | DISTRIBUTION_INVESTOR | DISTRIBUTION_DEVELOPER | CREDIT_ALLOCATION_INVESTOR | CREDIT_ALLOCATION_DEVELOPER" }
      - { name: amount_usd, type: number, source: system, description: "Entry amount in USD, 2dp round_half_up; distribution/credit amounts computed by the waterfall, never client-supplied per tier" }
      - { name: period_end_date, type: datetime, source: input, description: "Distribution/contribution accounting period end" }

  - name: DebtFacility
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; at most one non-RETIRED facility per project" }
      - { name: commitment_usd, type: number, source: input, description: "Lender commitment; cumulative draws may not exceed this" }
      - { name: drawn_usd, type: number, source: computed, description: "Cumulative draws via CONSTRUCTION_DRAWING transitions", default: 0.0 }
      - { name: interest_rate_pct, type: number, source: input, description: "Annual interest rate, percent" }
      - { name: projected_cfads_usd, type: number, source: input, description: "Projected annual cash flow available for debt service" }
      - { name: min_dscr, type: number, source: system, description: "Minimum debt service coverage ratio for term conversion; fixed 1.30", default: 1.30 }
      - { name: term_debt_usd, type: number, source: computed, description: "Set at TERM_REPAYMENT conversion: min(commitment_usd, drawn_usd, round_half_up(0.80 * eligible project cost, 2)) where eligible project cost = sum of order_amount_usd over the project's ProcurementOrders in SAFE_HARBOR_QUALIFIED, DELIVERED, or ACCEPTED" }
      - { name: status, type: enum, source: system, description: "COMMITMENT | CONSTRUCTION_DRAWING | CONVERSION_PENDING | TERM_REPAYMENT | RETIRED | DEFAULTED" }

# =============================================================================
# Table 2: State Machine Table (12 machines)
# =============================================================================
state_machines:
  - entity: Project
    initial_state: PROSPECT
    terminal_states: [OPERATIONAL, ABANDONED]
    transitions:
      - from: PROSPECT
        to: SITE_SECURED
        trigger: "POST /api/projects/{id}/transitions (to=SITE_SECURED)"
        actor: DeveloperAdmin
        preconditions:
          - "At least one SiteControlInstrument for the project in EXERCISED or RECORDED status"
        side_effects: []
      - from: SITE_SECURED
        to: DEVELOPMENT
        trigger: "POST /api/projects/{id}/transitions (to=DEVELOPMENT)"
        actor: DeveloperAdmin
        preconditions:
          - "At least one InterconnectionRequest for the project not in WITHDRAWN"
        side_effects: []
      - from: SITE_SECURED
        to: PROSPECT
        trigger: "POST /api/projects/{id}/transitions (to=PROSPECT)"
        actor: DeveloperAdmin
        preconditions: []
        side_effects: []
      - from: DEVELOPMENT
        to: READY_FOR_CONSTRUCTION
        trigger: "POST /api/projects/{id}/transitions (to=READY_FOR_CONSTRUCTION)"
        actor: DeveloperAdmin
        preconditions:
          - "At least one OfftakeAgreement for the project in EFFECTIVE (ERR_OFFTAKE_REQUIRED)"
          - "At least one InterconnectionRequest in AGREEMENT_EXECUTED or IN_SERVICE (ERR_INTERCONNECTION_NOT_EXECUTED)"
        side_effects: []
      - from: DEVELOPMENT
        to: SITE_SECURED
        trigger: "POST /api/projects/{id}/transitions (to=SITE_SECURED)"
        actor: DeveloperAdmin
        preconditions: []
        side_effects: []
      - from: READY_FOR_CONSTRUCTION
        to: UNDER_CONSTRUCTION
        trigger: "POST /api/projects/{id}/transitions (to=UNDER_CONSTRUCTION)"
        actor: DeveloperAdmin
        preconditions:
          - "TaxCreditQualification status in {SAFE_HARBOR_ESTABLISHED, CONTINUITY_MAINTAINED, CURED, QUALIFIED} (ERR_SAFE_HARBOR_NOT_QUALIFIED when NOT_ELIGIBLE, ERR_CREDIT_DISQUALIFIED when DISQUALIFIED)"
        side_effects:
          - "Project.tax_credit_anchored recomputed"
      - from: UNDER_CONSTRUCTION
        to: COMMISSIONING
        trigger: "POST /api/projects/{id}/transitions (to=COMMISSIONING)"
        actor: DeveloperAdmin
        preconditions:
          - "Milestones of types FOUNDATION, ERECTION, ENERGIZATION, SUBSTANTIAL_COMPLETION all exist and are CERTIFIED (ERR_COD_MILESTONE_PREREQUISITE)"
        side_effects: []
      - from: COMMISSIONING
        to: COMMERCIAL_OPERATION
        trigger: "system cascade only — certification of the COMMERCIAL_OPERATION milestone; direct transition attempt fails ERR_INVALID_STATE"
        actor: system
        preconditions:
          - "COMMERCIAL_OPERATION milestone certified while project in COMMISSIONING"
        side_effects:
          - "Project.status -> COMMERCIAL_OPERATION, cod_date := logical clock"
          - "TaxCreditQualification in CONTINUITY_MAINTAINED or CURED auto-transitions to QUALIFIED and recomputes credit_rate_pct and qualified_credit_usd; Project.total_itc_credits_usd updated"
          - "DebtFacility in CONSTRUCTION_DRAWING auto-transitions to CONVERSION_PENDING"
          - "TaxEquityPartnership in FULLY_FUNDED auto-transitions to PRE_FLIP_OPERATING"
      - from: COMMERCIAL_OPERATION
        to: OPERATIONAL
        trigger: "POST /api/projects/{id}/transitions (to=OPERATIONAL)"
        actor: DeveloperAdmin
        preconditions:
          - "measured_availability_pct present in payload (ERR_AVAILABILITY_MEASUREMENT_REQUIRED)"
        side_effects:
          - "availability_ld_usd computed per availability_ld rule (operations handoff with availability guarantee)"
      - from: "*"
        to: ABANDONED
        trigger: "POST /api/projects/{id}/transitions (to=ABANDONED)"
        actor: DeveloperAdmin
        preconditions:
          - "Current status is not OPERATIONAL (ERR_INVALID_STATE)"
        side_effects:
          - "Non-terminal SiteControlInstruments -> TERMINATED; non-terminal InterconnectionRequests -> WITHDRAWN (with queue reseat and upgrade re-allocation); non-terminal OfftakeAgreements -> TERMINATED; non-terminal SupplyAgreements -> TERMINATED; ProcurementOrders not in ACCEPTED -> CANCELLED (safe harbor clawback applies)"

  - entity: SiteControlInstrument
    initial_state: DRAFT
    terminal_states: [RECORDED, EXPIRED, TERMINATED]
    transitions:
      - from: DRAFT
        to: EXECUTED
        trigger: "POST /api/site-control-instruments/{id}/transitions (to=EXECUTED)"
        actor: DeveloperAdmin
        preconditions:
          - "No other SiteControlInstrument on the same parcel_id with status in {EXECUTED, EXERCISED, RECORDED} whose half-open window [start_date, end_date) overlaps this one; adjacency (other.end_date == this.start_date or this.end_date == other.start_date) is NOT an overlap (ERR_PARCEL_OVERLAP)"
        side_effects: []
      - from: EXECUTED
        to: EXERCISED
        trigger: "POST /api/site-control-instruments/{id}/transitions (to=EXERCISED)"
        actor: DeveloperAdmin
        preconditions:
          - "Logical clock <= end_date (ERR_OPTION_WINDOW_LAPSED; on failure the instrument auto-transitions to EXPIRED)"
        side_effects:
          - "Project site control posture re-evaluated"
      - from: EXERCISED
        to: RECORDED
        trigger: "POST /api/site-control-instruments/{id}/transitions (to=RECORDED)"
        actor: DeveloperAdmin
        preconditions: []
        side_effects: []
      - from: EXECUTED
        to: TERMINATED
        trigger: "POST /api/site-control-instruments/{id}/transitions (to=TERMINATED)"
        actor: DeveloperAdmin
        preconditions: []
        side_effects: []
      - from: EXERCISED
        to: TERMINATED
        trigger: "POST /api/site-control-instruments/{id}/transitions (to=TERMINATED)"
        actor: DeveloperAdmin
        preconditions: []
        side_effects:
          - "If no remaining instrument on the project's parcel is EXERCISED or RECORDED and project is SITE_SECURED, project reverts to PROSPECT"

  - entity: InterconnectionRequest
    initial_state: QUEUED
    terminal_states: [IN_SERVICE, WITHDRAWN]
    transitions:
      - from: QUEUED
        to: FEASIBILITY_STUDY
        trigger: "POST /api/interconnection-requests/{id}/transitions (to=FEASIBILITY_STUDY)"
        actor: OriginationManager
        preconditions: []
        side_effects: []
      - from: FEASIBILITY_STUDY
        to: SYSTEM_IMPACT_STUDY
        trigger: "POST /api/interconnection-requests/{id}/transitions (to=SYSTEM_IMPACT_STUDY)"
        actor: OriginationManager
        preconditions:
          - "Latest FEASIBILITY InterconnectionStudy (by created_at) for this request is ACCEPTED (ERR_PHASE_STUDY_NOT_ACCEPTED)"
        side_effects: []
      - from: SYSTEM_IMPACT_STUDY
        to: FACILITIES_STUDY
        trigger: "POST /api/interconnection-requests/{id}/transitions (to=FACILITIES_STUDY)"
        actor: OriginationManager
        preconditions:
          - "Latest SYSTEM_IMPACT InterconnectionStudy (by created_at) is ACCEPTED (ERR_PHASE_STUDY_NOT_ACCEPTED)"
          - "upgrade_allocated == true (ERR_UPGRADE_ALLOCATION_REQUIRED)"
        side_effects: []
      - from: FACILITIES_STUDY
        to: AGREEMENT_EXECUTED
        trigger: "POST /api/interconnection-requests/{id}/transitions (to=AGREEMENT_EXECUTED)"
        actor: OriginationManager
        preconditions:
          - "Latest FACILITIES InterconnectionStudy (by created_at) is ACCEPTED (ERR_PHASE_STUDY_NOT_ACCEPTED)"
        side_effects: []
      - from: AGREEMENT_EXECUTED
        to: IN_SERVICE
        trigger: "POST /api/interconnection-requests/{id}/transitions (to=IN_SERVICE)"
        actor: OriginationManager
        preconditions: []
        side_effects: []
      - from: "*"
        to: WITHDRAWN
        trigger: "POST /api/interconnection-requests/{id}/transitions (to=WITHDRAWN)"
        actor: OriginationManager
        preconditions:
          - "Current status not in {IN_SERVICE, WITHDRAWN} (ERR_INVALID_STATE)"
        side_effects:
          - "The withdrawn request's queue_position := 0"
          - "Reseat: every non-WITHDRAWN request in the same cluster with queue_position greater than the withdrawn position decrements by 1, processed in queue_position ASC order"
          - "Re-allocation: the reseat itself triggers recomputation of upgrade_cost_share_usd over the remaining non-WITHDRAWN cluster requests using last_upgrade_total_usd (skip when last_upgrade_total_usd == 0)"
          - "Curing effect: the share recomputation recomputes each remaining request's upgrade_allocated = true"

  - entity: InterconnectionStudy
    initial_state: SCOPED
    terminal_states: [ACCEPTED]
    transitions:
      - from: SCOPED
        to: IN_PROGRESS
        trigger: "POST /api/interconnection-studies/{id}/transitions (to=IN_PROGRESS)"
        actor: OriginationManager
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: DELIVERED
        trigger: "POST /api/interconnection-studies/{id}/transitions (to=DELIVERED)"
        actor: OriginationManager
        preconditions: []
        side_effects: []
      - from: DELIVERED
        to: ACCEPTED
        trigger: "POST /api/interconnection-studies/{id}/transitions (to=ACCEPTED)"
        actor: OriginationManager
        preconditions: []
        side_effects:
          - "Unblocks the parent InterconnectionRequest's next phase gate"
      - from: DELIVERED
        to: DEFICIENT
        trigger: "POST /api/interconnection-studies/{id}/transitions (to=DEFICIENT)"
        actor: OriginationManager
        preconditions: []
        side_effects: []
      - from: DEFICIENT
        to: IN_PROGRESS
        trigger: "POST /api/interconnection-studies/{id}/transitions (to=IN_PROGRESS)"
        actor: OriginationManager
        preconditions: []
        side_effects:
          - "rework_count += 1"

  - entity: OfftakeAgreement
    initial_state: NEGOTIATING
    terminal_states: [EXPIRED, TERMINATED]
    transitions:
      - from: NEGOTIATING
        to: COUNTERED
        trigger: "POST /api/offtake-agreements/{id}/transitions (to=COUNTERED)"
        actor: OriginationManager
        preconditions: []
        side_effects: ["counter_count += 1", "base_price_usd_mwh replaced when payload supplies it"]
      - from: COUNTERED
        to: NEGOTIATING
        trigger: "POST /api/offtake-agreements/{id}/transitions (to=NEGOTIATING)"
        actor: OriginationManager
        preconditions: []
        side_effects: ["counter_count += 1", "base_price_usd_mwh replaced when payload supplies it"]
      - from: NEGOTIATING
        to: EXECUTED
        trigger: "POST /api/offtake-agreements/{id}/transitions (to=EXECUTED)"
        actor: OriginationManager
        preconditions:
          - "base_price_usd_mwh >= 20.00 (ERR_PRICE_FLOOR_BREACH)"
          - "No other OfftakeAgreement for the same project in EXECUTED or EFFECTIVE (ERR_ACTIVE_OFFTAKE_EXISTS)"
        side_effects: []
      - from: COUNTERED
        to: EXECUTED
        trigger: "POST /api/offtake-agreements/{id}/transitions (to=EXECUTED)"
        actor: OriginationManager
        preconditions:
          - "base_price_usd_mwh >= 20.00 (ERR_PRICE_FLOOR_BREACH)"
          - "No other OfftakeAgreement for the same project in EXECUTED or EFFECTIVE (ERR_ACTIVE_OFFTAKE_EXISTS)"
        side_effects: []
      - from: EXECUTED
        to: EFFECTIVE
        trigger: "POST /api/offtake-agreements/{id}/transitions (to=EFFECTIVE)"
        actor: OriginationManager
        preconditions: []
        side_effects: []
      - from: EFFECTIVE
        to: EXPIRED
        trigger: "system: logical clock passes delivery_start_date + term_years"
        actor: system
        preconditions: []
        side_effects: []
      - from: "*"
        to: TERMINATED
        trigger: "POST /api/offtake-agreements/{id}/transitions (to=TERMINATED)"
        actor: OriginationManager
        preconditions:
          - "Current status not in {EXPIRED, TERMINATED} (ERR_INVALID_STATE)"
        side_effects:
          - "If the agreement was EFFECTIVE, the project can no longer satisfy the READY_FOR_CONSTRUCTION offtake gate"

  - entity: SupplyAgreement
    initial_state: DRAFT
    terminal_states: [FULFILLED, TERMINATED]
    transitions:
      - from: DRAFT
        to: EXECUTED
        trigger: "POST /api/supply-agreements/{id}/transitions (to=EXECUTED)"
        actor: ProcurementLead
        preconditions: []
        side_effects: []
      - from: EXECUTED
        to: AMENDMENT_PENDING
        trigger: "POST /api/supply-agreements/{id}/transitions (to=AMENDMENT_PENDING)"
        actor: ProcurementLead
        preconditions:
          - "amendment_total_contract_usd present in payload (ERR_VALIDATION)"
        side_effects: []
      - from: AMENDMENT_PENDING
        to: EXECUTED
        trigger: "POST /api/supply-agreements/{id}/transitions (to=EXECUTED)"
        actor: ProcurementLead
        preconditions: []
        side_effects:
          - "total_contract_usd replaced by the amendment value; amendment_count += 1"
      - from: EXECUTED
        to: DELIVERING
        trigger: "POST /api/supply-agreements/{id}/transitions (to=DELIVERING)"
        actor: ProcurementLead
        preconditions: []
        side_effects: []
      - from: DELIVERING
        to: FULFILLED
        trigger: "POST /api/supply-agreements/{id}/transitions (to=FULFILLED)"
        actor: ProcurementLead
        preconditions: []
        side_effects: []
      - from: DRAFT
        to: TERMINATED
        trigger: "POST /api/supply-agreements/{id}/transitions (to=TERMINATED)"
        actor: ProcurementLead
        preconditions: []
        side_effects:
          - "ProcurementOrders of this agreement not in {DELIVERED, ACCEPTED} -> CANCELLED (safe harbor clawback applies)"
      - from: EXECUTED
        to: TERMINATED
        trigger: "POST /api/supply-agreements/{id}/transitions (to=TERMINATED)"
        actor: ProcurementLead
        preconditions: []
        side_effects:
          - "ProcurementOrders of this agreement not in {DELIVERED, ACCEPTED} -> CANCELLED (safe harbor clawback applies)"

  - entity: ProcurementOrder
    initial_state: PLACED
    terminal_states: [ACCEPTED, CANCELLED]
    transitions:
      - from: PLACED
        to: DEPOSIT_PAID
        trigger: "POST /api/procurement-orders/{id}/transitions (to=DEPOSIT_PAID)"
        actor: ProcurementLead
        preconditions:
          - "deposit_amount_usd present and > 0 (ERR_VALIDATION)"
        side_effects:
          - "deposit_paid_usd += deposit_amount_usd"
      - from: DEPOSIT_PAID
        to: DEPOSIT_PAID
        trigger: "POST /api/procurement-orders/{id}/transitions (to=DEPOSIT_PAID)"
        actor: ProcurementLead
        preconditions:
          - "deposit_amount_usd present and > 0 (ERR_VALIDATION)"
        side_effects:
          - "deposit_paid_usd += deposit_amount_usd"
      - from: DEPOSIT_PAID
        to: SAFE_HARBOR_QUALIFIED
        trigger: "POST /api/procurement-orders/{id}/transitions (to=SAFE_HARBOR_QUALIFIED)"
        actor: ProcurementLead
        preconditions:
          - "Logical clock <= order created_at + 183 days (ERR_SAFE_HARBOR_WINDOW_LAPSED)"
          - "Parent SupplyAgreement in EXECUTED, AMENDMENT_PENDING, DELIVERING, or FULFILLED (ERR_SUPPLY_AGREEMENT_NOT_EXECUTED)"
          - "Project's TaxCreditQualification not DISQUALIFIED (ERR_CREDIT_DISQUALIFIED)"
          - "Method check: FIVE_PERCENT_COST requires deposit_paid_usd >= round_half_up(0.05 * eligible_cost_basis_usd, 2) (ERR_SAFE_HARBOR_TEST_FAILED); PHYSICAL_WORK requires physical_work_evidence_uri present in payload (ERR_VALIDATION when absent)"
        side_effects:
          - "safe_harbor_qualified := true"
      - from: SAFE_HARBOR_QUALIFIED
        to: DELIVERED
        trigger: "POST /api/procurement-orders/{id}/transitions (to=DELIVERED)"
        actor: ProcurementLead
        preconditions: []
        side_effects: []
      - from: DELIVERED
        to: ACCEPTED
        trigger: "POST /api/procurement-orders/{id}/transitions (to=ACCEPTED)"
        actor: ProcurementLead
        preconditions: []
        side_effects: []
      - from: PLACED
        to: CANCELLED
        trigger: "POST /api/procurement-orders/{id}/transitions (to=CANCELLED)"
        actor: ProcurementLead
        preconditions: []
        side_effects: []
      - from: DEPOSIT_PAID
        to: CANCELLED
        trigger: "POST /api/procurement-orders/{id}/transitions (to=CANCELLED)"
        actor: ProcurementLead
        preconditions: []
        side_effects: []
      - from: SAFE_HARBOR_QUALIFIED
        to: CANCELLED
        trigger: "POST /api/procurement-orders/{id}/transitions (to=CANCELLED)"
        actor: ProcurementLead
        preconditions: []
        side_effects:
          - "Clawback cascade (link 1 -> 2): safe_harbor_qualified := false; this loss of safe harbor mutates the project's TaxCreditQualification — if no other ProcurementOrder of the project remains SAFE_HARBOR_QUALIFIED/DELIVERED/ACCEPTED and the TaxCreditQualification is in SAFE_HARBOR_ESTABLISHED, it reverts to NOT_ELIGIBLE"
          - "Clawback cascade (link 2 -> 3): the TaxCreditQualification revert recomputes Project.tax_credit_anchored := false"

  - entity: ConstructionMilestone
    initial_state: PLANNED
    terminal_states: [CERTIFIED]
    transitions:
      - from: PLANNED
        to: EVIDENCE_SUBMITTED
        trigger: "POST /api/construction-milestones/{id}/submit-evidence"
        actor: ConstructionManager
        preconditions:
          - "evidence_uri and work_date present (ERR_MILESTONE_EVIDENCE_REQUIRED)"
        side_effects:
          - "submitted_by_user_id := X-User-ID of the caller"
      - from: REJECTED
        to: EVIDENCE_SUBMITTED
        trigger: "POST /api/construction-milestones/{id}/submit-evidence"
        actor: ConstructionManager
        preconditions:
          - "evidence_uri and work_date present (ERR_MILESTONE_EVIDENCE_REQUIRED)"
        side_effects:
          - "submitted_by_user_id := X-User-ID of the caller; evidence_uri and work_date replaced"
      - from: EVIDENCE_SUBMITTED
        to: CERTIFIED
        trigger: "POST /api/construction-milestones/{id}/certify (decision=CERTIFIED)"
        actor: TaxCounsel
        preconditions:
          - "X-User-ID of the caller != submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "Every other milestone of the same project with sequence_no < this sequence_no is CERTIFIED (ERR_MILESTONE_OUT_OF_ORDER)"
          - "For milestone_type COMMERCIAL_OPERATION: project in COMMISSIONING (ERR_COD_MILESTONE_PREREQUISITE)"
        side_effects:
          - "certified_by_user_id := X-User-ID of the caller"
          - "For milestone_type COMMERCIAL_OPERATION: fires the Project COMMISSIONING -> COMMERCIAL_OPERATION cascade (see Project machine), which itself advances the TaxCreditQualification to QUALIFIED, the DebtFacility to CONVERSION_PENDING, and the TaxEquityPartnership to PRE_FLIP_OPERATING"
      - from: EVIDENCE_SUBMITTED
        to: REJECTED
        trigger: "POST /api/construction-milestones/{id}/certify (decision=REJECTED)"
        actor: TaxCounsel
        preconditions:
          - "X-User-ID of the caller != submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "certified_by_user_id := X-User-ID of the caller"

  - entity: TaxCreditQualification
    initial_state: NOT_ELIGIBLE
    terminal_states: [DISQUALIFIED]
    transitions:
      - from: NOT_ELIGIBLE
        to: SAFE_HARBOR_ESTABLISHED
        trigger: "POST /api/tax-credit-qualifications/{id}/transitions (to=SAFE_HARBOR_ESTABLISHED)"
        actor: TaxCounsel
        preconditions:
          - "At least one ProcurementOrder of the project in SAFE_HARBOR_QUALIFIED, DELIVERED, or ACCEPTED (ERR_SAFE_HARBOR_NOT_QUALIFIED)"
          - "continuity_variant present in payload (ERR_VALIDATION)"
        side_effects:
          - "safe_harbor_established_date := logical clock; Project.tax_credit_anchored := true"
      - from: SAFE_HARBOR_ESTABLISHED
        to: CONTINUITY_MAINTAINED
        trigger: "POST /api/tax-credit-qualifications/{id}/transitions (to=CONTINUITY_MAINTAINED)"
        actor: TaxCounsel
        preconditions:
          - "Continuity assessment per continuity_window_assessment passes (on failure: status auto -> CONTINUITY_LAPSED, lapse_date := clock, lapse_count += 1, ERR_CONTINUITY_LAPSED)"
        side_effects: []
      - from: CURED
        to: CONTINUITY_MAINTAINED
        trigger: "POST /api/tax-credit-qualifications/{id}/transitions (to=CONTINUITY_MAINTAINED)"
        actor: TaxCounsel
        preconditions:
          - "Continuity assessment per continuity_window_assessment passes (on failure: status auto -> CONTINUITY_LAPSED, lapse_date := clock, lapse_count += 1, ERR_CONTINUITY_LAPSED)"
        side_effects: []
      - from: CONTINUITY_LAPSED
        to: CURED
        trigger: "POST /api/tax-credit-qualifications/{id}/transitions (to=CURED)"
        actor: TaxCounsel
        preconditions:
          - "Logical clock <= lapse_date + 90 days (ERR_CURE_WINDOW_EXPIRED; on failure status auto -> DISQUALIFIED)"
          - "At least one CERTIFIED CONTINUOUS_WORK milestone of the project with work_date >= lapse_date"
        side_effects: []
      - from: CONTINUITY_MAINTAINED
        to: QUALIFIED
        trigger: "POST /api/tax-credit-qualifications/{id}/transitions (to=QUALIFIED) or system cascade at project COD"
        actor: TaxCounsel
        preconditions:
          - "Project in COMMERCIAL_OPERATION or OPERATIONAL (ERR_INVALID_STATE)"
        side_effects:
          - "credit_rate_pct and qualified_credit_usd computed per itc_credit_amount; Project.total_itc_credits_usd := qualified_credit_usd"
      - from: SAFE_HARBOR_ESTABLISHED
        to: NOT_ELIGIBLE
        trigger: "system: safe harbor clawback cascade from ProcurementOrder CANCELLED"
        actor: system
        preconditions:
          - "No ProcurementOrder of the project remains SAFE_HARBOR_QUALIFIED, DELIVERED, or ACCEPTED"
        side_effects:
          - "Project.tax_credit_anchored := false"
      - from: CONTINUITY_LAPSED
        to: DISQUALIFIED
        trigger: "system: cure attempted after lapse_date + 90 days"
        actor: system
        preconditions: []
        side_effects:
          - "Project.tax_credit_anchored := false; terminal — no further qualification possible"

  - entity: TaxEquityPartnership
    initial_state: STRUCTURING
    terminal_states: [DISSOLVED]
    transitions:
      - from: STRUCTURING
        to: COMMITMENT_EXECUTED
        trigger: "POST /api/tax-equity-partnerships/{id}/transitions (to=COMMITMENT_EXECUTED)"
        actor: TaxCounsel
        preconditions:
          - "Project's TaxCreditQualification in {SAFE_HARBOR_ESTABLISHED, CONTINUITY_MAINTAINED, CURED, QUALIFIED} (ERR_SAFE_HARBOR_NOT_QUALIFIED)"
        side_effects: []
      - from: COMMITMENT_EXECUTED
        to: FUNDING
        trigger: "system: first CONTRIBUTION ledger entry posted"
        actor: system
        preconditions: []
        side_effects: []
      - from: FUNDING
        to: FULLY_FUNDED
        trigger: "system: contributed_usd == commitment_usd after a contribution"
        actor: system
        preconditions: []
        side_effects: []
      - from: FULLY_FUNDED
        to: PRE_FLIP_OPERATING
        trigger: "system cascade: project reaches COMMERCIAL_OPERATION"
        actor: system
        preconditions: []
        side_effects: []
      - from: PRE_FLIP_OPERATING
        to: FLIPPED
        trigger: "POST /api/tax-equity-partnerships/{id}/transitions (to=FLIPPED)"
        actor: TaxCounsel
        preconditions:
          - "expected_partnership_version matches current version (ERR_STALE_VERSION)"
          - "investor_irr_pct >= target_irr_pct, where investor_irr_pct is computed from the CURRENT ledger before any flip (evaluation order pinned per flip_allocation rule; ERR_TARGET_IRR_NOT_ACHIEVED)"
        side_effects:
          - "flip_date := logical clock; subsequent distributions use post-flip shares"
      - from: FLIPPED
        to: DISSOLVED
        trigger: "POST /api/tax-equity-partnerships/{id}/transitions (to=DISSOLVED)"
        actor: TaxCounsel
        preconditions: []
        side_effects: []

  - entity: DebtFacility
    initial_state: COMMITMENT
    terminal_states: [RETIRED, DEFAULTED]
    transitions:
      - from: COMMITMENT
        to: CONSTRUCTION_DRAWING
        trigger: "POST /api/debt-facilities/{id}/transitions (to=CONSTRUCTION_DRAWING)"
        actor: LenderAgent
        preconditions:
          - "draw_amount_usd present and > 0; drawn_usd + draw_amount_usd <= commitment_usd (ERR_DRAW_EXCEEDS_COMMITMENT)"
        side_effects:
          - "drawn_usd += draw_amount_usd"
      - from: CONSTRUCTION_DRAWING
        to: CONSTRUCTION_DRAWING
        trigger: "POST /api/debt-facilities/{id}/transitions (to=CONSTRUCTION_DRAWING)"
        actor: LenderAgent
        preconditions:
          - "draw_amount_usd present and > 0; drawn_usd + draw_amount_usd <= commitment_usd (ERR_DRAW_EXCEEDS_COMMITMENT)"
        side_effects:
          - "drawn_usd += draw_amount_usd"
      - from: CONSTRUCTION_DRAWING
        to: CONVERSION_PENDING
        trigger: "system cascade: project reaches COMMERCIAL_OPERATION"
        actor: system
        preconditions: []
        side_effects: []
      - from: CONVERSION_PENDING
        to: TERM_REPAYMENT
        trigger: "POST /api/debt-facilities/{id}/transitions (to=TERM_REPAYMENT)"
        actor: LenderAgent
        preconditions:
          - "DSCR check: projected_cfads_usd / (drawn_usd * interest_rate_pct / 100) >= 1.30 (ERR_DSCR_BELOW_MINIMUM); drawn_usd must be > 0 (ERR_VALIDATION)"
        side_effects:
          - "term_debt_usd computed per debt_conversion_sizing (construction financing converts to term debt at commercial operation)"
      - from: TERM_REPAYMENT
        to: RETIRED
        trigger: "POST /api/debt-facilities/{id}/transitions (to=RETIRED)"
        actor: LenderAgent
        preconditions: []
        side_effects: []
      - from: CONSTRUCTION_DRAWING
        to: DEFAULTED
        trigger: "POST /api/debt-facilities/{id}/transitions (to=DEFAULTED)"
        actor: LenderAgent
        preconditions: []
        side_effects: []
      - from: TERM_REPAYMENT
        to: DEFAULTED
        trigger: "POST /api/debt-facilities/{id}/transitions (to=DEFAULTED)"
        actor: LenderAgent
        preconditions: []
        side_effects: []

# =============================================================================
# Concurrency Rules (OCC on parent version — the only sanctioned mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: offtake-create-stale-project
    parent_entity: Project
    write_endpoint: "POST /api/projects/{id}/offtake-agreements"
    occ_field: expected_project_version
    description: |
      Creating an OfftakeAgreement against a Project whose version has advanced
      since the client last observed it is rejected. This captures the case where
      another writer has just executed or terminated an offtake on the project
      (legitimately changing the active-offtake set) and the current writer's
      view of the project is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: flip-election-stale-partnership
    parent_entity: TaxEquityPartnership
    write_endpoint: "POST /api/tax-equity-partnerships/{id}/transitions (to=FLIPPED)"
    occ_field: expected_partnership_version
    description: |
      Electing the flip against a TaxEquityPartnership whose version has advanced
      since the client last observed it is rejected. Contributions and
      distributions advance the partnership version, so a stale version means the
      IRR basis the client relied on is no longer current.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: safe_harbor_cost_test
    trigger: "ProcurementOrder transition DEPOSIT_PAID -> SAFE_HARBOR_QUALIFIED"
    algorithm: threshold
    formula: |
      FIVE_PERCENT_COST variant:
        required := round_half_up(0.05 * eligible_cost_basis_usd, 2)
        qualifies iff deposit_paid_usd >= required   (inclusive: deposit == required qualifies)
      PHYSICAL_WORK variant:
        qualifies iff physical_work_evidence_uri is present in the transition payload
    input_set: "The single ProcurementOrder being transitioned; no other orders are consulted"
    constants:
      SAFE_HARBOR_PCT: 0.05
      SAFE_HARBOR_WINDOW_DAYS: 183
    precision: "2 decimal places, round_half_up"
    variants:
      - name: FIVE_PERCENT_COST
        when: "safe_harbor_method == FIVE_PERCENT_COST"
        difference: "Pure cost test on deposit_paid_usd vs 5% of eligible_cost_basis_usd; evidence URI irrelevant"
      - name: PHYSICAL_WORK
        when: "safe_harbor_method == PHYSICAL_WORK"
        difference: "Cost amounts irrelevant; qualification turns entirely on presence of physical work evidence — an order with zero deposit can qualify, an order with 100% deposit but no evidence cannot"

  - name: continuity_window_assessment
    trigger: "TaxCreditQualification transition to CONTINUITY_MAINTAINED (from SAFE_HARBOR_ESTABLISHED or CURED)"
    algorithm: chronological
    formula: |
      Let works := CERTIFIED CONTINUOUS_WORK milestones of the project, ordered by work_date ASC, ties by created_at ASC.
      FOUR_YEAR_SAFE_HARBOR variant:
        passes iff logical clock <= safe_harbor_established_date + 4 years,
        OR project.status in {COMMERCIAL_OPERATION, OPERATIONAL}
      FACTS_AND_CIRCUMSTANCES variant:
        build the date series [safe_harbor_established_date] + [w.work_date for w in works] + [logical clock]
        passes iff every consecutive gap in the series is <= 365 days
      On failure: status auto -> CONTINUITY_LAPSED, lapse_date := clock, lapse_count += 1, ERR_CONTINUITY_LAPSED.
    input_set: "Only CERTIFIED CONTINUOUS_WORK milestones of the same project; PLANNED / EVIDENCE_SUBMITTED / REJECTED excluded"
    constants:
      FOUR_YEAR_WINDOW_DAYS: 1461   # 4 years incl. one leap day
      MAX_WORK_GAP_DAYS: 365
      CURE_WINDOW_DAYS: 90
    precision: "whole-day gap arithmetic on UTC dates"
    variants:
      - name: FOUR_YEAR_SAFE_HARBOR
        when: "continuity_variant == FOUR_YEAR_SAFE_HARBOR"
        difference: "Pass/fail turns on the calendar deadline (establish + 4 years) and project COD — internal work gaps are never examined"
      - name: FACTS_AND_CIRCUMSTANCES
        when: "continuity_variant == FACTS_AND_CIRCUMSTANCES"
        difference: "Calendar deadline irrelevant; pass/fail turns on the maximum consecutive work gap <= 365 days — identical work history and clock can pass under one variant and lapse under the other"

  - name: itc_credit_amount
    trigger: "TaxCreditQualification -> QUALIFIED (manual transition or COD cascade)"
    algorithm: threshold
    formula: |
      rate := 30.00
      if project.domestic_content_certified AND exists >=1 SupplyAgreement of the project
         with domestic_content_certified == true AND status in {EXECUTED, AMENDMENT_PENDING, DELIVERING, FULFILLED}:
        rate += 10.00
      if project.energy_community_eligible:
        rate += 10.00
      basis := sum(order_amount_usd) over ProcurementOrders of the project
               with status in {SAFE_HARBOR_QUALIFIED, DELIVERED, ACCEPTED}
      credit_rate_pct := rate
      qualified_credit_usd := round_half_up(rate / 100 * basis, 2)
      project.total_itc_credits_usd := qualified_credit_usd
    input_set: "ProcurementOrders of the project in SAFE_HARBOR_QUALIFIED / DELIVERED / ACCEPTED only; PLACED, DEPOSIT_PAID, CANCELLED excluded"
    constants:
      BASE_RATE_PCT: 30.00
      DOMESTIC_CONTENT_ADDER_PCT: 10.00
      ENERGY_COMMUNITY_ADDER_PCT: 10.00
    precision: "2 decimal places, round_half_up"

  - name: upgrade_cost_allocation
    trigger: "POST /api/interconnection-requests/{id}/allocate-upgrade-costs; re-run automatically on withdrawal reseat"
    algorithm: waterfall_allocation
    formula: |
      pool := non-WITHDRAWN InterconnectionRequests in the same cluster
      total_capacity := sum(requested_capacity_mw over pool)
      for each r in pool ordered by queue_position ASC:
        r.upgrade_cost_share_usd := round_half_up(total_upgrade_cost_usd * r.requested_capacity_mw / total_capacity, 2)
      remainder := total_upgrade_cost_usd - sum(shares)
      if remainder != 0: add remainder to the share of the pool request with the largest
        requested_capacity_mw; tie-break by earliest created_at (never by id)
      every r in pool: upgrade_allocated := true, last_upgrade_total_usd := total_upgrade_cost_usd
    input_set: "Non-WITHDRAWN InterconnectionRequests sharing the cluster_id; WITHDRAWN requests contribute no capacity and receive no share"
    constants: {}
    precision: "2 decimal places, round_half_up; remainder assigned to the largest-capacity request with earliest-created_at tie-break"

  - name: queue_reseat
    trigger: "InterconnectionRequest -> WITHDRAWN"
    algorithm: chronological
    formula: |
      withdrawn_pos := request.queue_position at withdrawal
      for each non-WITHDRAWN request r in the same cluster with r.queue_position > withdrawn_pos,
      processed in queue_position ASC order:
        r.queue_position -= 1
      Invariant: after reseat, the queue_positions of non-WITHDRAWN cluster requests are exactly the set {1..N} with N = count of non-WITHDRAWN requests.
    input_set: "Non-WITHDRAWN InterconnectionRequests in the same cluster with queue_position > withdrawn_pos"
    constants: {}
    precision: "integer positions"

  - name: waterfall_distribution
    trigger: "POST /api/tax-equity-partnerships/{id}/distributions"
    algorithm: waterfall_allocation
    formula: |
      Precondition: partnership status in {PRE_FLIP_OPERATING, FLIPPED}; amount_usd <= retained_cash_usd (ERR_DISTRIBUTION_EXCEEDS_CASH)
      investor_share_pct := 99.00 if status == PRE_FLIP_OPERATING else 5.00
      Rounding order is PINNED: round the INVESTOR tier first, developer tier takes the remainder.
        cash_investor  := round_half_up(amount_usd * investor_share_pct / 100, 2)
        cash_developer := amount_usd - cash_investor
      Credit tier (only when unallocated credits remain):
        unallocated := project.total_itc_credits_usd - sum(existing CREDIT_ALLOCATION_* entries)
        if unallocated > 0:
          credits_investor  := round_half_up(unallocated * investor_share_pct / 100, 2)
          credits_developer := unallocated - credits_investor
      Creates ledger entries: DISTRIBUTION_INVESTOR, DISTRIBUTION_DEVELOPER, and (when unallocated > 0)
      CREDIT_ALLOCATION_INVESTOR, CREDIT_ALLOCATION_DEVELOPER — 4 entries on the first run, 2 thereafter.
      Invariant: for every run and cumulatively,
        sum(CREDIT_ALLOCATION_INVESTOR) + sum(CREDIT_ALLOCATION_DEVELOPER) == project.total_itc_credits_usd
    input_set: "The partnership's existing PartnershipLedgerEntry rows and the parent project's total_itc_credits_usd"
    constants:
      PRE_FLIP_INVESTOR_PCT: 99.00
      POST_FLIP_INVESTOR_PCT: 5.00
    precision: "2 decimal places, round_half_up; investor tier rounded first, remainder to developer tier"

  - name: flip_allocation
    trigger: "TaxEquityPartnership transition PRE_FLIP_OPERATING -> FLIPPED"
    algorithm: threshold
    formula: |
      Pinned evaluation order (removes the circular dependency between flip and IRR):
        (1) cum_contributions := sum(CONTRIBUTION entries)
        (2) cum_investor_return := sum(DISTRIBUTION_INVESTOR) + sum(CREDIT_ALLOCATION_INVESTOR)
        (3) investor_irr_pct := round_half_up(((cum_investor_return / cum_contributions) - 1) * 100, 2)   [0.00 when cum_contributions == 0]
        (4) flip permitted iff investor_irr_pct >= target_irr_pct (ERR_TARGET_IRR_NOT_ACHIEVED)
        (5) only AFTER a successful flip do subsequent waterfall_distribution runs switch to post-flip shares
      The IRR snapshot in steps (1)-(3) NEVER includes hypothetical post-flip distributions.
    input_set: "All PartnershipLedgerEntry rows of the partnership at the moment of the flip attempt"
    constants: {}
    precision: "2 decimal places, round_half_up"

  - name: debt_conversion_sizing
    trigger: "DebtFacility transition CONVERSION_PENDING -> TERM_REPAYMENT"
    algorithm: threshold
    formula: |
      annual_service := drawn_usd * interest_rate_pct / 100
      dscr := projected_cfads_usd / annual_service            (drawn_usd must be > 0)
      require dscr >= 1.30 (inclusive) else ERR_DSCR_BELOW_MINIMUM
      eligible_project_cost := sum(order_amount_usd) over the project's ProcurementOrders
                               with status in {SAFE_HARBOR_QUALIFIED, DELIVERED, ACCEPTED}
      term_debt_usd := min(commitment_usd, drawn_usd, round_half_up(0.80 * eligible_project_cost, 2))
    input_set: "The DebtFacility itself plus the project's safe-harbor-qualified-or-later ProcurementOrders"
    constants:
      MIN_DSCR: 1.30
      MAX_ADVANCE_RATE: 0.80
    precision: "2 decimal places, round_half_up"

  - name: availability_ld
    trigger: "Project transition COMMERCIAL_OPERATION -> OPERATIONAL"
    algorithm: threshold
    formula: |
      shortfall := availability_guarantee_pct - measured_availability_pct
      if shortfall <= 0: availability_ld_usd := 0.00          (measured == guarantee exactly -> zero LD)
      else: availability_ld_usd := min(round_half_up(shortfall * 25000, 2), 500000.00)
    input_set: "The Project's availability_guarantee_pct and the measured_availability_pct supplied in the transition payload"
    constants:
      LD_PER_POINT_USD: 25000
      LD_CAP_USD: 500000.00
    precision: "2 decimal places, round_half_up"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and names a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "Role is permitted for the endpoint per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "Every id in the path exists and belongs to the declared parent chain, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints"
  - priority: 4
    category: business_constraint
    check: "Required payload fields present, types and enum values valid, start_date < end_date, window_start <= window_end, amounts positive where required"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all endpoints"
  - priority: 5
    category: business_constraint
    check: "OCC: expected_project_version (offtake create) / expected_partnership_version (flip) matches the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /api/projects/{id}/offtake-agreements; POST /api/tax-equity-partnerships/{id}/transitions"
  - priority: 6
    category: state
    check: "Target resource is in a valid from-state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 7
    category: business_safety
    check: "Segregation of duties: milestone certifier X-User-ID differs from submitted_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /api/construction-milestones/{id}/certify"
  - priority: 8
    category: business_temporal
    check: "Time-window rules: option exercise within [clock, end_date]; safe-harbor confirm within created_at + 183 days; continuity windows; cure within lapse_date + 90 days"
    error_id: "ERR_OPTION_WINDOW_LAPSED | ERR_SAFE_HARBOR_WINDOW_LAPSED | ERR_CONTINUITY_LAPSED | ERR_CURE_WINDOW_EXPIRED"
    http_status: 422
    applies_to: "site-control exercise, procurement safe-harbor confirm, TCQ transitions"
  - priority: 9
    category: business_constraint
    check: "Structural constraints: parcel half-open overlap; study-window closed-interval + 5-day buffer; single active offtake; milestone sequence ordering"
    error_id: "ERR_PARCEL_OVERLAP | ERR_STUDY_WINDOW_CONFLICT | ERR_ACTIVE_OFFTAKE_EXISTS | ERR_MILESTONE_OUT_OF_ORDER"
    http_status: 409
    applies_to: "site-control execute, study create, offtake execute, milestone certify"
  - priority: 10
    category: business_referential
    check: "Cross-entity state gates: offtake EFFECTIVE and interconnection AGREEMENT_EXECUTED for READY_FOR_CONSTRUCTION; supply agreement executed for safe-harbor confirm; accepted phase study for queue advance; upgrade allocated before FACILITIES_STUDY; certified prerequisite milestones for COMMISSIONING"
    error_id: "ERR_OFFTAKE_REQUIRED | ERR_INTERCONNECTION_NOT_EXECUTED | ERR_SUPPLY_AGREEMENT_NOT_EXECUTED | ERR_PHASE_STUDY_NOT_ACCEPTED | ERR_UPGRADE_ALLOCATION_REQUIRED | ERR_COD_MILESTONE_PREREQUISITE"
    http_status: 409
    applies_to: "project transitions, queue transitions, procurement confirm, study/queue gates"
  - priority: 11
    category: business_fiscal
    check: "Money rules: offtake price floor; safe-harbor 5% deposit sufficiency; contribution cap; distribution cash sufficiency; DSCR >= 1.30; IRR >= target at flip"
    error_id: "ERR_PRICE_FLOOR_BREACH | ERR_SAFE_HARBOR_TEST_FAILED | ERR_CONTRIBUTION_EXCEEDS_COMMITMENT | ERR_DISTRIBUTION_EXCEEDS_CASH | ERR_DSCR_BELOW_MINIMUM | ERR_TARGET_IRR_NOT_ACHIEVED"
    http_status: 422
    applies_to: "offtake execute, contributions, distributions, debt conversion, flip"
  - priority: 12
    category: state
    check: "Tax credit anchor state: TCQ must be anchored for partnership commitment and UNDER_CONSTRUCTION; TCQ must not be DISQUALIFIED for safe-harbor confirm"
    error_id: "ERR_SAFE_HARBOR_NOT_QUALIFIED | ERR_CREDIT_DISQUALIFIED"
    http_status: 409
    applies_to: "project transitions, partnership transitions, procurement confirm, TCQ establish"

