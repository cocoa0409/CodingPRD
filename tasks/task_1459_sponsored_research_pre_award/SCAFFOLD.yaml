# =============================================================================
# SCAFFOLD — Sponsored Research Pre-Award (university office of sponsored programs)
# =============================================================================

scenario: |
  Sponsored Research Pre-Award (university office of sponsored programs): funding opportunity intake & eligibility check, proposal budget development & F&A rate application, cost-share commitment & institutional approval, compliance ancillary reviews (IRB/IACUC/export/COI), internal deadline & sponsor submission portal, just-in-time & award negotiation, subrecipient commitment & risk assessment, award setup handoff

domain_name: sponsored-research-pre-award
api_prefix: /pre-award

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: FundingOpportunity
    parent: null
    common_fields: true
    fields:
      - { name: sponsor_code, type: string, source: input, description: "Sponsor identifier code (e.g., NSF, NIH)" }
      - { name: title, type: string, source: input, description: "Opportunity title" }
      - { name: activity_codes_allowed, type: array, source: input, description: "Allowed activity codes: RESEARCH_ON_CAMPUS | RESEARCH_OFF_CAMPUS | INSTRUCTION | OTHER_SPONSORED" }
      - { name: sponsor_deadline_at, type: datetime, source: input, description: "Sponsor portal deadline (ISO8601 UTC)" }
      - { name: internal_lead_days, type: integer, source: input, default: 5, description: "Days before sponsor deadline that internal routing must complete" }
      - { name: internal_deadline_at, type: datetime, source: computed, description: "= sponsor_deadline_at - internal_lead_days; submission allowed iff logical clock <= internal_deadline_at" }
      - { name: fa_rate_cap_pct, type: number, source: input, default: null, description: "Optional cap on applied F&A rate percent (null = uncapped)" }
      - { name: requires_cost_share, type: boolean, source: input, default: false, description: "Whether cost-share commitments are mandatory" }
      - { name: min_cost_share_pct_of_request, type: number, source: input, default: 0, description: "Minimum approved cost-share as percent of total_request_cents" }
      - { name: max_request_cents, type: integer, source: input, default: null, description: "Optional sponsor cap on total_request_cents (null = uncapped)" }
      - { name: max_proposals_per_pi, type: integer, source: input, default: null, description: "Optional per-PI cap of non-terminal proposals for this opportunity" }
      - { name: status, type: enum, source: system, description: "PUBLISHED -> INTAKE_CLOSED (clock sweep once sponsor_deadline_at < now)" }

  - name: PrincipalInvestigator
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "PI full name" }
      - { name: department_code, type: string, source: input, description: "Home department code" }
      - { name: rank, type: enum, source: input, description: "ASSISTANT | ASSOCIATE | FULL | RESEARCH_SCIENTIST" }
      - { name: delinquent_report_count, type: integer, source: input, default: 0, description: "Count of delinquent prior-award reports; 0 required for eligibility" }
      - { name: is_eligible, type: boolean, source: computed, description: "= (delinquent_report_count == 0)" }
      - { name: committed_effort_pct, type: number, source: computed, description: "Sum of pi_effort_pct over this PI's proposals in effort-contributing states whose project window overlaps; see pi_effort_capacity" }

  - name: Proposal
    parent: null
    common_fields: true
    fields:
      - { name: opportunity_id, type: string, source: input, description: "FK -> FundingOpportunity.id" }
      - { name: pi_id, type: string, source: input, description: "FK -> PrincipalInvestigator.id; must equal X-User-ID when created by PI role" }
      - { name: title, type: string, source: input, description: "Proposal title" }
      - { name: activity_code, type: enum, source: input, description: "RESEARCH_ON_CAMPUS | RESEARCH_OFF_CAMPUS | INSTRUCTION | OTHER_SPONSORED; maps 1:1 to FaRateAgreement.rate_type" }
      - { name: project_start_on, type: string, source: input, description: "Project start date YYYY-MM-DD; selects F&A rate window" }
      - { name: project_end_on, type: string, source: input, description: "Project end date YYYY-MM-DD; half-open window [start, end)" }
      - { name: pi_effort_pct, type: number, source: input, description: "PI committed effort percent on this proposal (0 < x <= 100)" }
      - { name: fa_base_type, type: enum, source: input, default: MTDC, description: "MTDC | TDC — selects indirect_cost variant" }
      - { name: current_snapshot_id, type: string, source: system, default: null, description: "FK -> BudgetSnapshot.id; the CURRENT snapshot (null until first finalize)" }
      - { name: pinned_budget_snapshot_id, type: string, source: system, default: null, description: "FK -> BudgetSnapshot.id pinned at institutional approval; handoff requires it to still be CURRENT" }
      - { name: total_direct_cents, type: integer, source: computed, default: 0, description: "Sum of non-cost-share BudgetLine.amount_cents on CURRENT snapshot (0 when none)" }
      - { name: total_indirect_cents, type: integer, source: computed, default: 0, description: "Sum of per-line indirect on CURRENT snapshot" }
      - { name: total_request_cents, type: integer, source: computed, default: 0, description: "= total_direct_cents + total_indirect_cents" }
      - { name: fa_rate_pct_applied, type: number, source: computed, default: null, description: "= min(selected rate, opportunity.fa_rate_cap_pct); null until first finalize" }
      - { name: applied_rate_source, type: enum, source: computed, default: null, description: "FINAL_RATE | PROVISIONAL_RATE; null until first finalize" }
      - { name: total_approved_cost_share_cents, type: integer, source: computed, default: 0, description: "Sum of CostShareCommitment.amount_cents in APPROVED status" }
      - { name: total_effective_cost_share_cents, type: integer, source: computed, default: 0, description: "Effective cost-share credit per cost_share_requirement (third-party discount + cap)" }
      - { name: is_cost_share_adequate, type: boolean, source: computed, default: false, description: "= total_effective_cost_share_cents >= required_min_cost_share_cents (true vacuously when opportunity.requires_cost_share == false)" }
      - { name: compliance_posture, type: enum, source: computed, default: CLEAR, description: "BLOCKED if any review DISAPPROVED; else REVIEW_PENDING if any review in PENDING|INFO_REQUESTED|EXPIRED; else CLEAR" }
      - { name: routed_by_user_id, type: string, source: system, default: null, description: "X-User-ID captured at route; segregation-of-duties check at approve-institutional" }
      - { name: budget_amended_since_approval, type: boolean, source: system, default: false, description: "True when a budget line mutated or finalize ran while JIT_REQUESTED; cleared by re-approval" }
      - { name: revision_count, type: integer, source: system, default: 0, description: "Increments each time proposal enters RETURNED_FOR_REVISION" }
      - { name: submitted_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of successful portal submission" }
      - { name: jit_due_at, type: datetime, source: system, default: null, description: "JIT response due timestamp = clock + due_in_days at jit-notices" }
      - { name: awarded_total_cents, type: integer, source: system, default: null, description: "Accepted offer amount; set on AWARDED" }
      - { name: status, type: enum, source: system, description: "DRAFT | BUDGET_LOCKED | ROUTED | RETURNED_FOR_REVISION | INSTITUTIONALLY_APPROVED | SUBMITTED | JIT_REQUESTED | NEGOTIATING | AWARDED | SETUP_COMPLETE | WITHDRAWN | DECLINED" }

  - name: BudgetLine
    parent: null
    common_fields: true
    fields:
      - { name: proposal_id, type: string, source: input, description: "FK -> Proposal.id" }
      - { name: category, type: enum, source: input, description: "PERSONNEL | EQUIPMENT | TRAVEL | PARTICIPANT_SUPPORT | MATERIALS | PUBLICATION | CONSULTANT | SUBAWARD | TUITION | OTHER_DIRECT" }
      - { name: description, type: string, source: input, description: "Line description" }
      - { name: fiscal_year, type: integer, source: input, description: "Fiscal year the cost falls in; drives MTDC subaward allowance ordering" }
      - { name: amount_cents, type: integer, source: input, description: "Line amount in cents; must be > 0" }
      - { name: is_cost_share, type: boolean, source: input, default: false, description: "Cost-share lines are excluded from sponsor request totals and IDC base" }
      - { name: subrecipient_commitment_id, type: string, source: input, default: null, description: "FK -> SubrecipientCommitment.id; required iff category == SUBAWARD" }
      - { name: counts_toward_mtdc, type: boolean, source: computed, description: "False for EQUIPMENT | TUITION | PARTICIPANT_SUPPORT; for SUBAWARD true only while cumulative per-commitment allowance remains; else true" }

  - name: BudgetSnapshot
    parent: null
    common_fields: true
    fields:
      - { name: proposal_id, type: string, source: system, description: "FK -> Proposal.id" }
      - { name: snapshot_index, type: integer, source: system, description: "Per-proposal ascending index starting at 1" }
      - { name: fa_base_type, type: enum, source: system, description: "MTDC | TDC copied from proposal at finalize" }
      - { name: rate_type, type: string, source: system, description: "Rate type resolved from activity_code" }
      - { name: selected_rate_pct, type: number, source: system, description: "Rate from selected FaRateAgreement before cap" }
      - { name: applied_rate_pct, type: number, source: system, description: "min(selected_rate_pct, fa_rate_cap_pct)" }
      - { name: rate_source, type: enum, source: system, description: "FINAL_RATE | PROVISIONAL_RATE" }
      - { name: mtdc_base_cents, type: integer, source: system, description: "MTDC-eligible base under the snapshot's fa_base_type (equals total_direct_cents when TDC)" }
      - { name: total_direct_cents, type: integer, source: system, description: "Sum of non-cost-share line amounts" }
      - { name: total_indirect_cents, type: integer, source: system, description: "Sum of per-line round_half_up(base_portion * applied_rate/100)" }
      - { name: total_request_cents, type: integer, source: system, description: "= total_direct_cents + total_indirect_cents" }
      - { name: per_line_indirect, type: array, source: system, description: "Array of { budget_line_id, base_portion_cents, indirect_cents } in pinned processing order" }
      - { name: status, type: enum, source: system, description: "CURRENT | SUPERSEDED; exactly one CURRENT per proposal" }

  - name: FaRateAgreement
    parent: null
    common_fields: true
    fields:
      - { name: rate_type, type: enum, source: input, description: "ON_CAMPUS_RESEARCH | OFF_CAMPUS_RESEARCH | INSTRUCTION | OTHER_SPONSORED" }
      - { name: rate_pct, type: number, source: input, description: "F&A rate percent (0 < x <= 100)" }
      - { name: effective_start_on, type: string, source: input, description: "Window start date YYYY-MM-DD (inclusive)" }
      - { name: effective_end_on, type: string, source: input, description: "Window end date YYYY-MM-DD (exclusive); half-open [start, end)" }
      - { name: status, type: enum, source: system, description: "PROVISIONAL -> FINAL (via finalize); only FINAL-vs-FINAL same-type overlap is rejected" }

  - name: CostShareCommitment
    parent: null
    common_fields: true
    fields:
      - { name: proposal_id, type: string, source: input, description: "FK -> Proposal.id" }
      - { name: source_type, type: enum, source: input, description: "DEPARTMENT | COLLEGE | CENTRAL_OFFICE | THIRD_PARTY_IN_KIND" }
      - { name: amount_cents, type: integer, source: input, description: "Committed amount in cents; must be > 0" }
      - { name: committed_by_user_id, type: string, source: system, description: "X-User-ID of creator; approver must differ (segregation of duties)" }
      - { name: approved_by_user_id, type: string, source: system, default: null, description: "X-User-ID of approver" }
      - { name: status, type: enum, source: system, description: "PLEDGED -> APPROVED -> RELEASED; PLEDGED -> WITHDRAWN" }

  - name: ComplianceReview
    parent: null
    common_fields: true
    fields:
      - { name: proposal_id, type: string, source: input, description: "FK -> Proposal.id" }
      - { name: review_type, type: enum, source: input, description: "IRB | IACUC | EXPORT_CONTROL | CONFLICT_OF_INTEREST" }
      - { name: disclosure_complete, type: boolean, source: input, default: false, description: "Required true to approve CONFLICT_OF_INTEREST reviews" }
      - { name: approved_until_at, type: datetime, source: system, default: null, description: "= approval clock time + validity_days; null until approved" }
      - { name: validity_days, type: integer, source: system, default: null, description: "Validity window applied at approval (defaults: IRB 365, IACUC 1095, EXPORT_CONTROL 730, CONFLICT_OF_INTEREST 365)" }
      - { name: status, type: enum, source: system, description: "PENDING | INFO_REQUESTED | APPROVED | EXPIRED | DISAPPROVED | CANCELLED; cycle PENDING->INFO_REQUESTED->PENDING" }

  - name: SubrecipientOrg
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Subrecipient legal name" }
      - { name: uei, type: string, source: input, description: "Unique Entity Identifier; globally unique" }
      - { name: is_foreign, type: boolean, source: input, default: false, description: "Foreign entity flag (+10 risk)" }
      - { name: single_audit_status, type: enum, source: input, description: "CURRENT | DELINQUENT | NOT_REQUIRED | MISSING" }
      - { name: audit_finding_count, type: integer, source: input, default: 0, description: "Findings on latest audit (>= 0)" }
      - { name: first_time_subrecipient, type: boolean, source: input, default: false, description: "Never held a subaward with this institution (+10 risk)" }
      - { name: risk_score, type: integer, source: computed, description: "Standard-variant score per subrecipient_risk_score" }
      - { name: risk_tier, type: enum, source: computed, description: "LOW (<25) | MEDIUM (25..49) | HIGH (>=50) under standard variant" }

  - name: SubrecipientCommitment
    parent: null
    common_fields: true
    fields:
      - { name: proposal_id, type: string, source: input, description: "FK -> Proposal.id" }
      - { name: subrecipient_org_id, type: string, source: input, description: "FK -> SubrecipientOrg.id" }
      - { name: subaward_amount_cents, type: integer, source: input, description: "Planned subaward amount in cents; must be > 0" }
      - { name: statement_of_work_received, type: boolean, source: input, default: false, description: "SOW document collected" }
      - { name: budget_received, type: boolean, source: input, default: false, description: "Sub budget collected" }
      - { name: enhanced_monitoring_acknowledged, type: boolean, source: input, default: false, description: "Required true at verify when org risk tier is HIGH" }
      - { name: verified_risk_snapshot_score, type: integer, source: system, default: null, description: "Risk score pinned at verification (variant per verification amount)" }
      - { name: monitoring_level, type: enum, source: system, default: null, description: "STANDARD | ENHANCED; ENHANCED when verified under HIGH tier" }
      - { name: status, type: enum, source: system, description: "DRAFT -> VERIFIED -> STALE -> VERIFIED (cycle); any -> VOIDED" }

  - name: NegotiationOffer
    parent: null
    common_fields: true
    fields:
      - { name: proposal_id, type: string, source: system, description: "FK -> Proposal.id (from path)" }
      - { name: round_index, type: integer, source: system, description: "Per-proposal ascending round number starting at 1" }
      - { name: origin, type: enum, source: input, description: "SPONSOR | INSTITUTION" }
      - { name: offered_total_cents, type: integer, source: input, description: "Offered total award in cents; must be > 0" }
      - { name: offered_fa_rate_pct, type: number, source: input, default: null, description: "Optional negotiated F&A rate" }
      - { name: note, type: string, source: input, default: null, description: "Optional negotiation note" }
      - { name: status, type: enum, source: system, description: "PROPOSED -> ACCEPTED | DECLINED | VOIDED; at most one PROPOSED per proposal" }

  - name: SubmissionPackage
    parent: null
    common_fields: false
    fields:
      - { name: proposal_id, type: string, source: system, description: "FK -> Proposal.id" }
      - { name: idempotency_key, type: string, source: input, description: "Client key; unique per proposal; replay with same key returns the original package" }
      - { name: portal_confirmation_code, type: string, source: system, description: "Server-minted portal confirmation code" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock submission timestamp" }
      - { name: status, type: enum, source: system, description: "ACCEPTED_BY_PORTAL" }

  - name: AwardHandoff
    parent: null
    common_fields: true
    fields:
      - { name: proposal_id, type: string, source: system, description: "FK -> Proposal.id; unique (1:1), auto-created when proposal reaches AWARDED" }
      - { name: budget_verified, type: boolean, source: system, default: false, description: "Checklist: pinned snapshot current and FINAL rate recomputed" }
      - { name: compliance_verified, type: boolean, source: system, default: false, description: "Checklist: all reviews APPROVED and unexpired" }
      - { name: subrecipient_verified, type: boolean, source: system, default: false, description: "Checklist: all non-VOIDED SubrecipientCommitments VERIFIED" }
      - { name: final_indirect_cents, type: integer, source: system, default: null, description: "Indirect recomputed under FINAL_BASIS rate at mark-ready" }
      - { name: final_total_cents, type: integer, source: system, default: null, description: "total_direct_cents + final_indirect_cents at mark-ready" }
      - { name: handoff_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of handoff" }
      - { name: status, type: enum, source: system, description: "DRAFT -> READY -> HANDED_OFF; READY -> BLOCKED (auto on review expiry); BLOCKED -> READY (re-mark-ready)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: FundingOpportunity
    initial_state: PUBLISHED
    terminal_states: [INTAKE_CLOSED]
    transitions:
      - from: PUBLISHED
        to: INTAKE_CLOSED
        trigger: "system (clock sweep on POST /pre-award/_clock/set_current_utc when sponsor_deadline_at < now)"
        actor: system
        preconditions: ["status == PUBLISHED", "sponsor_deadline_at < now"]
        side_effects:
          - "CASCADE link 1: every Proposal of this opportunity in {DRAFT, BUDGET_LOCKED, ROUTED, RETURNED_FOR_REVISION} transitions to WITHDRAWN (INSTITUTIONALLY_APPROVED survives the sweep; its submit is then blocked by ERR_OPPORTUNITY_CLOSED / ERR_INTERNAL_DEADLINE_PASSED)"
          - "CASCADE link 2 (per withdrawn Proposal): its ComplianceReviews in {PENDING, INFO_REQUESTED} -> CANCELLED; its CostShareCommitments PLEDGED -> WITHDRAWN and APPROVED -> RELEASED; its SubrecipientCommitments in {DRAFT, VERIFIED, STALE} -> VOIDED"
          - "CASCADE link 3: withdrawn Proposal.total_approved_cost_share_cents and total_effective_cost_share_cents recomputed (both become 0)"

  - entity: Proposal
    initial_state: DRAFT
    terminal_states: [SETUP_COMPLETE, WITHDRAWN, DECLINED]
    transitions:
      - from: DRAFT
        to: BUDGET_LOCKED
        trigger: "POST /pre-award/proposals/{id}/budget-finalizations"
        actor: PreAwardAnalyst
        preconditions:
          - "status in {DRAFT, BUDGET_LOCKED, JIT_REQUESTED} (ERR_PROPOSAL_INVALID_STATE)"
          - "expected_proposal_version == proposal.version (ERR_STALE_VERSION)"
          - "at least one non-cost-share BudgetLine exists (ERR_EMPTY_BUDGET)"
          - "an applicable FaRateAgreement covers project_start_on (ERR_NO_APPLICABLE_RATE)"
          - "total_request_cents <= opportunity.max_request_cents when set (ERR_REQUEST_EXCEEDS_CAP)"
        side_effects:
          - "create BudgetSnapshot (snapshot_index = prior max + 1, status CURRENT); prior CURRENT snapshot -> SUPERSEDED"
          - "copy snapshot totals onto Proposal (total_direct_cents, total_indirect_cents, total_request_cents, fa_rate_pct_applied, applied_rate_source, current_snapshot_id)"
          - "recompute cost-share adequacy fields"
          - "increments Proposal.version by 1"

      - from: BUDGET_LOCKED
        to: BUDGET_LOCKED
        trigger: "POST /pre-award/proposals/{id}/budget-finalizations (re-finalize supersedes the CURRENT snapshot)"
        actor: PreAwardAnalyst
        preconditions: ["same as DRAFT -> BUDGET_LOCKED"]
        side_effects: ["same as DRAFT -> BUDGET_LOCKED (status stays BUDGET_LOCKED)"]

      - from: JIT_REQUESTED
        to: JIT_REQUESTED
        trigger: "POST /pre-award/proposals/{id}/budget-finalizations (JIT revised budget)"
        actor: PreAwardAnalyst
        preconditions: ["same as DRAFT -> BUDGET_LOCKED"]
        side_effects:
          - "same snapshot side effects as DRAFT -> BUDGET_LOCKED"
          - "budget_amended_since_approval remains true until re-approval"
          - "status stays JIT_REQUESTED"

      - from: BUDGET_LOCKED
        to: DRAFT
        trigger: "system (automatic when a BudgetLine is added or deleted while BUDGET_LOCKED)"
        actor: system
        preconditions: []
        side_effects:
          - "CURRENT snapshot -> SUPERSEDED; current_snapshot_id = null"
          - "budget totals remain from last snapshot (stale-readable) but route requires status BUDGET_LOCKED"

      - from: BUDGET_LOCKED
        to: ROUTED
        trigger: "POST /pre-award/proposals/{id}/route"
        actor: PreAwardAnalyst
        preconditions:
          - "status == BUDGET_LOCKED (ERR_PROPOSAL_INVALID_STATE)"
          - "PI effort capacity: pi_effort_pct + sum(overlapping contributors) <= 100.00 (ERR_PI_EFFORT_EXCEEDED)"
          - "cost-share adequate when opportunity.requires_cost_share (ERR_COST_SHARE_INADEQUATE)"
        side_effects:
          - "routed_by_user_id = X-User-ID"
          - "increments Proposal.version by 1"

      - from: ROUTED
        to: INSTITUTIONALLY_APPROVED
        trigger: "POST /pre-award/proposals/{id}/approve-institutional"
        actor: OSPDirector
        preconditions:
          - "status == ROUTED (ERR_PROPOSAL_INVALID_STATE)"
          - "X-User-ID != routed_by_user_id (ERR_SELF_APPROVAL — segregation of duties)"
          - "opportunity.status == PUBLISHED (ERR_OPPORTUNITY_CLOSED)"
        side_effects:
          - "pinned_budget_snapshot_id = current_snapshot_id (version-pinning on approval)"
          - "increments Proposal.version by 1"

      - from: JIT_REQUESTED
        to: JIT_REQUESTED
        trigger: "POST /pre-award/proposals/{id}/approve-institutional (re-approval after JIT budget amendment)"
        actor: OSPDirector
        preconditions:
          - "status == JIT_REQUESTED and budget_amended_since_approval == true (ERR_PROPOSAL_INVALID_STATE otherwise)"
          - "opportunity.status == PUBLISHED (ERR_OPPORTUNITY_CLOSED)"
        side_effects:
          - "pinned_budget_snapshot_id = current_snapshot_id; budget_amended_since_approval = false"
          - "increments Proposal.version by 1"

      - from: AWARDED
        to: AWARDED
        trigger: "POST /pre-award/proposals/{id}/approve-institutional (re-pin after JIT budget amendment carried past award)"
        actor: OSPDirector
        preconditions:
          - "status == AWARDED and budget_amended_since_approval == true (ERR_PROPOSAL_INVALID_STATE otherwise)"
        side_effects:
          - "pinned_budget_snapshot_id = current_snapshot_id; budget_amended_since_approval = false"
          - "increments Proposal.version by 1"

      - from: ROUTED
        to: RETURNED_FOR_REVISION
        trigger: "POST /pre-award/proposals/{id}/return-for-revision"
        actor: OSPDirector
        preconditions:
          - "status == ROUTED (ERR_PROPOSAL_INVALID_STATE)"
        side_effects:
          - "revision_count += 1"
          - "CASCADE link: CostShareCommitments in APPROVED -> RELEASED (compensation); SubrecipientCommitments in VERIFIED -> STALE"
          - "CASCADE link: total_approved_cost_share_cents / total_effective_cost_share_cents / is_cost_share_adequate recomputed"
          - "increments Proposal.version by 1"

      - from: RETURNED_FOR_REVISION
        to: DRAFT
        trigger: "PATCH /pre-award/proposals/{id} (any successful edit resumes drafting)"
        actor: PI
        preconditions:
          - "status in {DRAFT, RETURNED_FOR_REVISION} (ERR_PROPOSAL_INVALID_STATE)"
          - "X-User-ID == pi_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "status -> DRAFT when it was RETURNED_FOR_REVISION"
          - "increments Proposal.version by 1"

      - from: DRAFT
        to: DRAFT
        trigger: "PATCH /pre-award/proposals/{id}"
        actor: PI
        preconditions: ["same as RETURNED_FOR_REVISION -> DRAFT"]
        side_effects: ["increments Proposal.version by 1"]

      - from: INSTITUTIONALLY_APPROVED
        to: SUBMITTED
        trigger: "POST /pre-award/proposals/{id}/submit"
        actor: OSPDirector
        preconditions:
          - "status == INSTITUTIONALLY_APPROVED (ERR_PROPOSAL_INVALID_STATE)"
          - "opportunity.status == PUBLISHED (ERR_OPPORTUNITY_CLOSED)"
          - "logical clock <= opportunity.internal_deadline_at (ERR_INTERNAL_DEADLINE_PASSED; boundary: exactly equal is allowed)"
          - "idempotency_key not previously used by another SubmissionPackage of this proposal (replay with same key returns original package)"
        side_effects:
          - "create SubmissionPackage (portal_confirmation_code minted, submitted_at = clock, status ACCEPTED_BY_PORTAL)"
          - "submitted_at = clock"
          - "increments Proposal.version by 1"

      - from: SUBMITTED
        to: JIT_REQUESTED
        trigger: "POST /pre-award/proposals/{id}/jit-notices"
        actor: OSPDirector
        preconditions: ["status == SUBMITTED (ERR_PROPOSAL_INVALID_STATE)"]
        side_effects:
          - "jit_due_at = clock + due_in_days (default 14)"
          - "increments Proposal.version by 1"

      - from: JIT_REQUESTED
        to: SUBMITTED
        trigger: "POST /pre-award/proposals/{id}/jit-responses"
        actor: OSPDirector
        preconditions: ["status == JIT_REQUESTED (ERR_PROPOSAL_INVALID_STATE)"]
        side_effects: ["increments Proposal.version by 1"]

      - from: SUBMITTED
        to: NEGOTIATING
        trigger: "POST /pre-award/proposals/{id}/negotiation-offers"
        actor: OSPDirector
        preconditions:
          - "status in {SUBMITTED, JIT_REQUESTED, NEGOTIATING} (ERR_PROPOSAL_INVALID_STATE)"
          - "expected_proposal_version == proposal.version (ERR_STALE_VERSION)"
        side_effects:
          - "create NegotiationOffer (round_index = prior max + 1, status PROPOSED)"
          - "prior PROPOSED offer (if any) -> VOIDED (supersede)"
          - "increments Proposal.version by 1"

      - from: JIT_REQUESTED
        to: NEGOTIATING
        trigger: "POST /pre-award/proposals/{id}/negotiation-offers"
        actor: OSPDirector
        preconditions: ["same as SUBMITTED -> NEGOTIATING"]
        side_effects: ["same as SUBMITTED -> NEGOTIATING"]

      - from: NEGOTIATING
        to: NEGOTIATING
        trigger: "POST /pre-award/proposals/{id}/negotiation-offers (next round supersedes open offer)"
        actor: OSPDirector
        preconditions: ["same as SUBMITTED -> NEGOTIATING"]
        side_effects: ["same as SUBMITTED -> NEGOTIATING (status stays NEGOTIATING)"]

      - from: NEGOTIATING
        to: AWARDED
        trigger: "POST /pre-award/negotiation-offers/{id}/accept"
        actor: OSPDirector
        preconditions:
          - "offer.status == PROPOSED (ERR_OFFER_INVALID_STATE)"
          - "offer.proposal's status == NEGOTIATING (ERR_PROPOSAL_INVALID_STATE)"
        side_effects:
          - "CASCADE link 1: offer -> ACCEPTED; proposal -> AWARDED; awarded_total_cents = offer.offered_total_cents"
          - "CASCADE link 2 (caused by proposal -> AWARDED): AwardHandoff auto-created (status DRAFT, all checklist flags false)"
          - "increments Proposal.version by 1"

      - from: NEGOTIATING
        to: DECLINED
        trigger: "POST /pre-award/negotiation-offers/{id}/decline"
        actor: OSPDirector
        preconditions:
          - "offer.status == PROPOSED (ERR_OFFER_INVALID_STATE)"
          - "offer.proposal's status == NEGOTIATING (ERR_PROPOSAL_INVALID_STATE)"
        side_effects:
          - "offer -> DECLINED"
          - "terminal cleanup cascade (same as withdraw): open reviews CANCELLED; PLEDGED cost-share WITHDRAWN; APPROVED cost-share RELEASED; non-VOIDED sub commitments VOIDED"
          - "increments Proposal.version by 1"

      - from: AWARDED
        to: SETUP_COMPLETE
        trigger: "POST /pre-award/award-handoffs/{id}/handoff"
        actor: OSPDirector
        preconditions: ["handoff.status == READY (ERR_HANDOFF_INVALID_STATE)"]
        side_effects:
          - "handoff -> HANDED_OFF; handoff_at = clock"
          - "increments Proposal.version by 1"

      - from: ANY_NON_TERMINAL
        to: WITHDRAWN
        trigger: "POST /pre-award/proposals/{id}/withdraw"
        actor: PI | OSPDirector
        preconditions:
          - "status in {DRAFT, BUDGET_LOCKED, ROUTED, RETURNED_FOR_REVISION, INSTITUTIONALLY_APPROVED, SUBMITTED, JIT_REQUESTED, NEGOTIATING} (ERR_PROPOSAL_INVALID_STATE; AWARDED and terminal states not withdrawable)"
          - "PI actor must satisfy X-User-ID == pi_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "terminal cleanup cascade: ComplianceReviews in {PENDING, INFO_REQUESTED} -> CANCELLED; CostShareCommitments PLEDGED -> WITHDRAWN, APPROVED -> RELEASED; SubrecipientCommitments in {DRAFT, VERIFIED, STALE} -> VOIDED; NegotiationOffers PROPOSED -> VOIDED"
          - "total_approved_cost_share_cents / total_effective_cost_share_cents recomputed"
          - "increments Proposal.version by 1"

  - entity: CostShareCommitment
    initial_state: PLEDGED
    terminal_states: [RELEASED, WITHDRAWN]
    transitions:
      - from: PLEDGED
        to: APPROVED
        trigger: "POST /pre-award/cost-share-commitments/{id}/approve"
        actor: DepartmentChair
        preconditions:
          - "status == PLEDGED (ERR_COMMITMENT_INVALID_STATE)"
          - "X-User-ID != committed_by_user_id (ERR_COST_SHARE_SELF_APPROVAL — segregation of duties)"
          - "proposal.status in {DRAFT, BUDGET_LOCKED, ROUTED, INSTITUTIONALLY_APPROVED, SUBMITTED, JIT_REQUESTED, NEGOTIATING, AWARDED} (ERR_PROPOSAL_INVALID_STATE)"
        side_effects:
          - "approved_by_user_id = X-User-ID"
          - "proposal.total_approved_cost_share_cents += amount_cents; effective credit and is_cost_share_adequate recomputed"
          - "increments Proposal.version by 1"
      - from: APPROVED
        to: RELEASED
        trigger: "POST /pre-award/cost-share-commitments/{id}/release"
        actor: DepartmentChair
        preconditions: ["status == APPROVED (ERR_COMMITMENT_INVALID_STATE)"]
        side_effects:
          - "proposal.total_approved_cost_share_cents -= amount_cents; effective credit and is_cost_share_adequate recomputed"
          - "increments Proposal.version by 1"
      - from: PLEDGED
        to: WITHDRAWN
        trigger: "POST /pre-award/cost-share-commitments/{id}/withdraw OR terminal cleanup cascade"
        actor: PreAwardAnalyst | system
        preconditions: ["status == PLEDGED (ERR_COMMITMENT_INVALID_STATE)"]
        side_effects: []

  - entity: ComplianceReview
    initial_state: PENDING
    terminal_states: [DISAPPROVED, CANCELLED]
    transitions:
      - from: PENDING
        to: INFO_REQUESTED
        trigger: "POST /pre-award/compliance-reviews/{id}/request-info"
        actor: ComplianceOfficer
        preconditions: ["status == PENDING (ERR_REVIEW_INVALID_STATE)"]
        side_effects: ["proposal.compliance_posture recomputed (stays REVIEW_PENDING)"]
      - from: INFO_REQUESTED
        to: PENDING
        trigger: "POST /pre-award/compliance-reviews/{id}/respond"
        actor: PI
        preconditions:
          - "status in {INFO_REQUESTED, EXPIRED} (ERR_REVIEW_INVALID_STATE)"
          - "X-User-ID == proposal.pi_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects: ["disclosure_complete updated when supplied in payload"]
      - from: EXPIRED
        to: PENDING
        trigger: "POST /pre-award/compliance-reviews/{id}/respond (renewal reopens the review)"
        actor: PI
        preconditions: ["same as INFO_REQUESTED -> PENDING"]
        side_effects: ["approved_until_at = null; validity_days = null"]
      - from: PENDING
        to: APPROVED
        trigger: "POST /pre-award/compliance-reviews/{id}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "status == PENDING (ERR_REVIEW_INVALID_STATE)"
          - "review_type == CONFLICT_OF_INTEREST requires disclosure_complete == true (ERR_COI_DISCLOSURE_INCOMPLETE)"
        side_effects:
          - "validity_days = payload override else default by type (IRB 365, IACUC 1095, EXPORT_CONTROL 730, CONFLICT_OF_INTEREST 365)"
          - "approved_until_at = clock + validity_days"
          - "proposal.compliance_posture recomputed"
      - from: PENDING
        to: DISAPPROVED
        trigger: "POST /pre-award/compliance-reviews/{id}/disapprove"
        actor: ComplianceOfficer
        preconditions: ["status in {PENDING, INFO_REQUESTED} (ERR_REVIEW_INVALID_STATE)"]
        side_effects:
          - "CASCADE link 1: proposal.compliance_posture -> BLOCKED; proposal in {ROUTED, INSTITUTIONALLY_APPROVED, SUBMITTED, JIT_REQUESTED, NEGOTIATING} -> RETURNED_FOR_REVISION with revision_count += 1"
          - "CASCADE link 2 (caused by proposal -> RETURNED_FOR_REVISION): CostShareCommitments APPROVED -> RELEASED; SubrecipientCommitments VERIFIED -> STALE"
          - "CASCADE link 3 (caused by RELEASED mutations): proposal.total_approved_cost_share_cents / total_effective_cost_share_cents / is_cost_share_adequate recomputed"
          - "increments Proposal.version by 1"
      - from: INFO_REQUESTED
        to: DISAPPROVED
        trigger: "POST /pre-award/compliance-reviews/{id}/disapprove"
        actor: ComplianceOfficer
        preconditions: ["same as PENDING -> DISAPPROVED"]
        side_effects: ["same as PENDING -> DISAPPROVED"]
      - from: APPROVED
        to: EXPIRED
        trigger: "system (clock sweep when approved_until_at < now)"
        actor: system
        preconditions: ["status == APPROVED", "approved_until_at < now"]
        side_effects:
          - "proposal.compliance_posture recomputed (-> REVIEW_PENDING)"
          - "BUBBLE UP: AwardHandoff of this proposal in READY -> BLOCKED"
      - from: PENDING
        to: CANCELLED
        trigger: "system (terminal cleanup cascade: proposal WITHDRAWN/DECLINED or opportunity intake closure sweep)"
        actor: system
        preconditions: ["status in {PENDING, INFO_REQUESTED}"]
        side_effects: ["proposal.compliance_posture recomputed"]
      - from: INFO_REQUESTED
        to: CANCELLED
        trigger: "system (terminal cleanup cascade)"
        actor: system
        preconditions: ["status in {PENDING, INFO_REQUESTED}"]
        side_effects: ["proposal.compliance_posture recomputed"]

  - entity: SubrecipientCommitment
    initial_state: DRAFT
    terminal_states: [VOIDED]
    transitions:
      - from: DRAFT
        to: VERIFIED
        trigger: "POST /pre-award/subrecipient-commitments/{id}/verify"
        actor: SubrecipientManager
        preconditions:
          - "status in {DRAFT, STALE} (ERR_COMMITMENT_INVALID_STATE)"
          - "statement_of_work_received == true and budget_received == true (ERR_SUBREC_DOCS_INCOMPLETE)"
          - "org risk tier HIGH requires enhanced_monitoring_acknowledged == true (ERR_SUBREC_HIGH_RISK_NOT_ACKED)"
        side_effects:
          - "verified_risk_snapshot_score = risk score under verification variant (enhanced when subaward_amount_cents >= 25000000)"
          - "monitoring_level = ENHANCED when verified tier HIGH else STANDARD"
      - from: STALE
        to: VERIFIED
        trigger: "POST /pre-award/subrecipient-commitments/{id}/verify"
        actor: SubrecipientManager
        preconditions: ["same as DRAFT -> VERIFIED"]
        side_effects: ["same as DRAFT -> VERIFIED"]
      - from: VERIFIED
        to: STALE
        trigger: "system (automatic when proposal enters RETURNED_FOR_REVISION)"
        actor: system
        preconditions: []
        side_effects: ["verified_risk_snapshot_score and monitoring_level retained (historical) until re-verify"]
      - from: ANY_NON_TERMINAL
        to: VOIDED
        trigger: "POST /pre-award/subrecipient-commitments/{id}/void OR terminal cleanup cascade"
        actor: SubrecipientManager | system
        preconditions: ["status in {DRAFT, VERIFIED, STALE} (ERR_COMMITMENT_INVALID_STATE)"]
        side_effects: []

  - entity: NegotiationOffer
    initial_state: PROPOSED
    terminal_states: [ACCEPTED, DECLINED, VOIDED]
    transitions:
      - from: PROPOSED
        to: ACCEPTED
        trigger: "POST /pre-award/negotiation-offers/{id}/accept"
        actor: OSPDirector
        preconditions: ["status == PROPOSED (ERR_OFFER_INVALID_STATE)", "proposal.status == NEGOTIATING (ERR_PROPOSAL_INVALID_STATE)"]
        side_effects: ["see Proposal NEGOTIATING -> AWARDED cascade"]
      - from: PROPOSED
        to: DECLINED
        trigger: "POST /pre-award/negotiation-offers/{id}/decline"
        actor: OSPDirector
        preconditions: ["status == PROPOSED (ERR_OFFER_INVALID_STATE)"]
        side_effects: ["see Proposal NEGOTIATING -> DECLINED cascade"]
      - from: PROPOSED
        to: VOIDED
        trigger: "system (superseded by a new offer on the same proposal, or terminal cleanup)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: FaRateAgreement
    initial_state: PROVISIONAL
    terminal_states: []
    transitions:
      - from: PROVISIONAL
        to: FINAL
        trigger: "POST /pre-award/fa-rate-agreements/{id}/finalize"
        actor: OSPDirector
        preconditions:
          - "status == PROVISIONAL (ERR_RATE_AGREEMENT_INVALID_STATE)"
          - "no other FINAL agreement of same rate_type with overlapping half-open window (ERR_FA_RATE_WINDOW_OVERLAP)"
        side_effects: []

  - entity: AwardHandoff
    initial_state: DRAFT
    terminal_states: [HANDED_OFF]
    transitions:
      - from: DRAFT
        to: READY
        trigger: "POST /pre-award/award-handoffs/{id}/mark-ready"
        actor: OSPDirector
        preconditions:
          - "handoff.status in {DRAFT, BLOCKED} (ERR_HANDOFF_INVALID_STATE)"
          - "proposal.status == AWARDED (ERR_PROPOSAL_INVALID_STATE)"
          - "no ComplianceReview of proposal in DISAPPROVED (ERR_COMPLIANCE_DISAPPROVED)"
          - "no ComplianceReview of proposal EXPIRED or approved_until_at < clock (ERR_COMPLIANCE_APPROVAL_EXPIRED)"
          - "no ComplianceReview of proposal in PENDING or INFO_REQUESTED (ERR_COMPLIANCE_REVIEW_PENDING)"
          - "pinned_budget_snapshot_id == proposal.current_snapshot_id (ERR_STALE_BUDGET_SNAPSHOT)"
          - "a FINAL FaRateAgreement covers project_start_on (ERR_RATE_NOT_FINAL)"
          - "all non-VOIDED SubrecipientCommitments of proposal are VERIFIED (ERR_SUBRECIPIENT_NOT_VERIFIED)"
          - "cost-share adequate under FINAL_BASIS totals (ERR_COST_SHARE_INADEQUATE)"
        side_effects:
          - "final_indirect_cents recomputed under FINAL_BASIS; final_total_cents = total_direct_cents + final_indirect_cents"
          - "budget_verified = compliance_verified = subrecipient_verified = true"
      - from: BLOCKED
        to: READY
        trigger: "POST /pre-award/award-handoffs/{id}/mark-ready"
        actor: OSPDirector
        preconditions: ["same as DRAFT -> READY"]
        side_effects: ["same as DRAFT -> READY"]
      - from: READY
        to: BLOCKED
        trigger: "system (automatic when a review of the proposal becomes EXPIRED or DISAPPROVED)"
        actor: system
        preconditions: []
        side_effects: ["compliance_verified = false"]
      - from: READY
        to: HANDED_OFF
        trigger: "POST /pre-award/award-handoffs/{id}/handoff"
        actor: OSPDirector
        preconditions: ["handoff.status == READY (ERR_HANDOFF_INVALID_STATE)"]
        side_effects: ["proposal -> SETUP_COMPLETE; handoff_at = clock"]

  - entity: SubmissionPackage
    initial_state: ACCEPTED_BY_PORTAL
    terminal_states: [ACCEPTED_BY_PORTAL]
    transitions: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: budget-finalize-stale-proposal
    parent_entity: Proposal
    write_endpoint: "POST /pre-award/proposals/{id}/budget-finalizations"
    occ_field: expected_proposal_version
    description: |
      Finalizing a budget against a Proposal whose version has advanced since the
      client last observed it is rejected. Re-finalization legitimately supersedes
      the CURRENT snapshot even from BUDGET_LOCKED, so a writer holding a stale
      version must be refused rather than silently supersede another writer's work.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: negotiation-offer-stale-proposal
    parent_entity: Proposal
    write_endpoint: "POST /pre-award/proposals/{id}/negotiation-offers"
    occ_field: expected_proposal_version
    description: |
      Creating a negotiation offer against a Proposal whose version has advanced
      since the client last observed it is rejected. Offer creation legitimately
      supersedes the open PROPOSED offer even while the proposal stays NEGOTIATING,
      so a stale-versioned writer must be refused with 412.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: indirect_cost
    trigger: "POST /pre-award/proposals/{id}/budget-finalizations; recomputed under FINAL_BASIS at award-handoffs mark-ready"
    algorithm: tiered_pricing
    formula: |
      # Evaluation order is pinned; do not reorder.
      # 1) Input set: BudgetLines of the proposal with is_cost_share == false.
      #    Cost-share lines are EXCLUDED from direct totals and from the IDC base.
      # 2) MTDC base portion per line (only when proposal.fa_base_type == MTDC):
      #      EQUIPMENT | TUITION | PARTICIPANT_SUPPORT -> 0
      #      SUBAWARD -> min(line.amount_cents, remaining allowance of its
      #        subrecipient_commitment_id), allowance = 2500000 cents per
      #        subrecipient_commitment_id, consumed in pinned processing order
      #      all other categories -> line.amount_cents
      #    TDC variant: base portion = line.amount_cents for every line.
      # 3) Processing order (order-sensitive for the SUBAWARD allowance):
      #      fiscal_year ASC, then created_at ASC. Never order by id.
      # 4) applied_rate_pct = min(selected_rate_pct, opportunity.fa_rate_cap_pct)
      #    (cap applied when fa_rate_cap_pct is not null; selected == cap is allowed).
      # 5) Per-line indirect = round_half_up(base_portion_cents * applied_rate_pct / 100)
      #    to integer cents. total_indirect_cents = SUM of per-line values.
      #    PINNED: round per line, THEN sum. (Sum-then-round is a different result
      #    and is NOT the spec.)
      # 6) total_direct_cents = SUM(non-cost-share amount_cents);
      #    total_request_cents = total_direct_cents + total_indirect_cents.
    input_set: "BudgetLines with is_cost_share == false; rate window containing project_start_on"
    constants:
      SUBAWARD_MTDC_ALLOWANCE_CENTS: 2500000
    precision: "integer cents, round_half_up per line then sum"
    variants:
      - name: MTDC
        when: "proposal.fa_base_type == MTDC"
        difference: "excludes EQUIPMENT/TUITION/PARTICIPANT_SUPPORT entirely and caps each subrecipient commitment's MTDC-eligible subaward portion at the first 2500000 cents"
      - name: TDC
        when: "proposal.fa_base_type == TDC"
        difference: "every non-cost-share line counts at full amount; no exclusions, no subaward cap"
      - name: PROVISIONAL_BASIS
        when: "budget-finalizations (pre-award planning)"
        difference: "rate selection prefers a FINAL agreement covering project_start_on, falls back to PROVISIONAL; ERR_NO_APPLICABLE_RATE when neither covers"
      - name: FINAL_BASIS
        when: "award-handoffs mark-ready (award-time verification)"
        difference: "only FINAL agreements are eligible; ERR_RATE_NOT_FINAL when none covers; same base portions, but a different selected rate yields different cents than the pinned snapshot"

  - name: cost_share_requirement
    trigger: "on any CostShareCommitment create/approve/release/withdraw, on finalize, and at mark-ready"
    algorithm: constraint_propagation
    formula: |
      # Circular-looking dependency with pinned evaluation order:
      # the third-party cap is keyed on required_min, which itself derives from
      # the budget totals. Evaluate strictly in this order:
      # 1) required_min_cost_share_cents = 0 when opportunity.requires_cost_share == false,
      #    else round_half_up(min_cost_share_pct_of_request * total_request_cents / 100).
      # 2) cash_approved = SUM(amount_cents) of commitments with status == APPROVED
      #    and source_type in {DEPARTMENT, COLLEGE, CENTRAL_OFFICE}.
      # 3) tp_approved = SUM(amount_cents) of APPROVED THIRD_PARTY_IN_KIND commitments.
      # 4) tp_effective = min(round_half_up(tp_approved * 0.5),
      #                       round_half_up(required_min_cost_share_cents * 0.25)).
      #    (Step 4 depends on step 1 — hence the pinned order.)
      # 5) total_effective_cost_share_cents = cash_approved + tp_effective.
      # 6) is_cost_share_adequate = (total_effective_cost_share_cents >= required_min_cost_share_cents).
      #    Boundary: exactly equal is adequate.
      # PLEDGED / WITHDRAWN / RELEASED commitments never contribute.
    input_set: "CostShareCommitments of the proposal with status == APPROVED"
    constants:
      THIRD_PARTY_CREDIT_FACTOR: 0.5
      THIRD_PARTY_CAP_OF_REQUIRED: 0.25
    precision: "integer cents, round_half_up at each rounding step"

  - name: subrecipient_risk_score
    trigger: "SubrecipientOrg create (standard variant); SubrecipientCommitment verify (variant selected by amount)"
    algorithm: weighted_scoring
    formula: |
      # >= 3 inputs with non-linear interaction (nested min + conditional branches):
      # base = {CURRENT: 10, NOT_REQUIRED: 20, MISSING: 45, DELINQUENT: 60}
      # findings_term = min(5 * audit_finding_count, 25)
      # foreign_term = 10 if is_foreign else 0
      # first_time_term = 10 if first_time_subrecipient else 0
      # score_standard = base + findings_term + foreign_term + first_time_term
      # tier(score): score < 25 -> LOW; 25 <= score <= 49 -> MEDIUM; score >= 50 -> HIGH.
      # Enhanced variant (applied at verify when subaward_amount_cents >= 25000000):
      #   score_enhanced = score_standard + 15, tiered with the same thresholds.
      # Boundary: amount exactly 25000000 selects the enhanced variant.
    input_set: "single SubrecipientOrg; enhanced variant also reads the commitment amount"
    constants:
      FINDINGS_CAP: 25
      FINDINGS_STEP: 5
      FOREIGN_PENALTY: 10
      FIRST_TIME_PENALTY: 10
      ENHANCED_AMOUNT_THRESHOLD_CENTS: 25000000
      ENHANCED_SURCHARGE: 15
      TIER_LOW_MAX: 24
      TIER_MEDIUM_MAX: 49
    precision: "integer points"
    variants:
      - name: standard
        when: "org creation and reads"
        difference: "score without the large-award surcharge"
      - name: enhanced
        when: "commitment verify with subaward_amount_cents >= 25000000"
        difference: "score_standard + 15 before tiering; same org data can verify as HIGH while org.risk_tier reads MEDIUM"

  - name: pi_effort_capacity
    trigger: "POST /pre-award/proposals/{id}/route"
    algorithm: aggregation
    formula: |
      # Aggregate capacity over overlapping half-open project windows.
      # Contributor set: OTHER proposals of the same pi_id with status in
      #   {ROUTED, INSTITUTIONALLY_APPROVED, SUBMITTED, JIT_REQUESTED, NEGOTIATING,
      #    AWARDED, SETUP_COMPLETE}
      # whose [project_start_on, project_end_on) overlaps the candidate's window:
      #   overlap iff candidate.start < other.end AND other.start < candidate.end.
      #   Adjacent windows (candidate.start == other.end or other.start == candidate.end)
      #   do NOT overlap.
      # committed = SUM(contributor.pi_effort_pct)
      # PASS iff candidate.pi_effort_pct + committed <= 100.00 (exactly 100.00 passes).
      # PI.committed_effort_pct (read model) uses the same contributor set evaluated
      # against the PI's own proposals' windows — for the PI entity read, it is the
      # sum over the contributor-state proposals regardless of window (portfolio load).
    input_set: "proposals of the same PI in contributor states"
    constants:
      MAX_EFFORT_PCT: 100.00
    precision: "2 decimal places"

  - name: internal_deadline
    trigger: "FundingOpportunity create; clock sweep; submit"
    algorithm: threshold
    formula: |
      internal_deadline_at = sponsor_deadline_at - internal_lead_days (exact datetime arithmetic).
      Submit is allowed iff logical clock <= internal_deadline_at (boundary inclusive).
      Sweep closes the opportunity when internal_deadline_at < now (strict).
    input_set: "single FundingOpportunity"
    constants:
      DEFAULT_INTERNAL_LEAD_DAYS: 5
    precision: "second precision on ISO8601 UTC"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; X-User-Role must be one of the seven declared roles"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role is listed on the endpoint; entity-backed ownership (PI role: X-User-ID == resource pi_id; PI may only create proposals with pi_id == X-User-ID)"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all"
    note: "Ownership failures on an existing resource return ERR_NOT_RESOURCE_OWNER (403) instead"
  - priority: 3
    category: existence
    check: "Path ids exist, validated left-to-right; body FK ids (opportunity_id, pi_id, subrecipient_org_id, subrecipient_commitment_id) exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"
  - priority: 4
    category: state
    check: "OCC: expected_proposal_version (when required by the endpoint) == current proposal.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /pre-award/proposals/{id}/budget-finalizations, POST /pre-award/proposals/{id}/negotiation-offers"
    note: "OCC is checked AFTER existence and BEFORE state/business logic"
  - priority: 5
    category: state
    check: "Target resource in an allowed status for the operation (per state machines)"
    error_id: ERR_PROPOSAL_INVALID_STATE | ERR_COMMITMENT_INVALID_STATE | ERR_REVIEW_INVALID_STATE | ERR_OFFER_INVALID_STATE | ERR_HANDOFF_INVALID_STATE | ERR_RATE_AGREEMENT_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 5.5
    category: state
    check: "Segregation of duties: institutional approver != routed_by_user_id; cost-share approver != committed_by_user_id"
    error_id: ERR_SELF_APPROVAL | ERR_COST_SHARE_SELF_APPROVAL
    http_status: 403
    applies_to: "POST approve-institutional, POST cost-share-commitments/{id}/approve"
  - priority: 6
    category: business_safety
    check: "Compliance gates: no DISAPPROVED review at mark-ready; COI disclosure complete before COI approval; PI eligible (delinquent_report_count == 0) at proposal creation"
    error_id: ERR_COMPLIANCE_DISAPPROVED | ERR_COI_DISCLOSURE_INCOMPLETE | ERR_PI_NOT_ELIGIBLE
    http_status: 409
    applies_to: "mark-ready, compliance approve, POST /pre-award/proposals"
    note: "ERR_COI_DISCLOSURE_INCOMPLETE and ERR_PI_NOT_ELIGIBLE return 422/403 respectively per error catalog"
  - priority: 7
    category: business_referential
    check: "Referenced parent entities in usable state: opportunity.status == PUBLISHED for proposal creation, approve-institutional, submit"
    error_id: ERR_OPPORTUNITY_CLOSED
    http_status: 409
    applies_to: "POST /pre-award/proposals, approve-institutional, submit"
  - priority: 8
    category: business_temporal
    check: "Deadline/expiry: submit clock <= internal_deadline_at; mark-ready has no expired approvals"
    error_id: ERR_INTERNAL_DEADLINE_PASSED | ERR_COMPLIANCE_APPROVAL_EXPIRED
    http_status: 422
    applies_to: "submit, mark-ready"
    note: "ERR_COMPLIANCE_APPROVAL_EXPIRED returns 409 per error catalog"
  - priority: 9
    category: business_constraint
    check: "Structural constraints: activity code allowed; per-PI proposal cap; duplicate active review per (proposal, review_type); FINAL rate window overlap; PI effort capacity; empty budget; applicable rate exists; compliance reviews all resolved (none PENDING/INFO_REQUESTED) at handoff; pinned snapshot current; FINAL rate exists at handoff; sub docs complete; HIGH risk acked; sub recipients verified; UEI uniqueness"
    error_id: ERR_ACTIVITY_CODE_NOT_ALLOWED | ERR_PI_PROPOSAL_LIMIT_EXCEEDED | ERR_DUPLICATE_ACTIVE_REVIEW | ERR_FA_RATE_WINDOW_OVERLAP | ERR_PI_EFFORT_EXCEEDED | ERR_EMPTY_BUDGET | ERR_NO_APPLICABLE_RATE | ERR_COMPLIANCE_REVIEW_PENDING | ERR_STALE_BUDGET_SNAPSHOT | ERR_RATE_NOT_FINAL | ERR_SUBREC_DOCS_INCOMPLETE | ERR_SUBREC_HIGH_RISK_NOT_ACKED | ERR_SUBRECIPIENT_NOT_VERIFIED | ERR_UEI_NOT_UNIQUE
    http_status: 409
    applies_to: "various"
    note: "422 vs 409 per error catalog entries"
  - priority: 10
    category: business_fiscal
    check: "Money checks last: total_request_cents <= max_request_cents; cost-share adequacy"
    error_id: ERR_REQUEST_EXCEEDS_CAP | ERR_COST_SHARE_INADEQUATE
    http_status: 422
    applies_to: "budget-finalizations, route, mark-ready"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving; default logical time 2026-08-01T00:00:00Z) ---
  - method: POST
    path: "/pre-award/_clock/set_current_utc"
    description: "Set the server logical clock. Before any call, the clock reads exactly 2026-08-01T00:00:00Z (never wall-clock). Setting the clock fires the sweep: opportunities whose sponsor_deadline_at < now -> INTAKE_CLOSED; their proposals in {DRAFT, BUDGET_LOCKED, ROUTED, RETURNED_FOR_REVISION} -> WITHDRAWN with cleanup cascade; APPROVED reviews with approved_until_at < now -> EXPIRED."
    roles: [OSPSystemAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["clock sweep cascades per FundingOpportunity/ComplianceReview machines"]

  # --- Funding Opportunities ---
  - method: POST
    path: "/pre-award/funding-opportunities"
    description: "Intake a funding opportunity; internal_deadline_at computed"
    roles: [OSPSystemAdmin]
    code: 201
    input: [sponsor_code, title, activity_codes_allowed, sponsor_deadline_at, "internal_lead_days?", "fa_rate_cap_pct?", "requires_cost_share?", "min_cost_share_pct_of_request?", "max_request_cents?", "max_proposals_per_pi?"]
    output: FundingOpportunity
    side_effects: ["status = PUBLISHED", "internal_deadline_at computed"]

  - method: GET
    path: "/pre-award/funding-opportunities/{id}"
    description: "Get a funding opportunity"
    roles: [PI, PreAwardAnalyst, DepartmentChair, ComplianceOfficer, SubrecipientManager, OSPDirector, OSPSystemAdmin]
    code: 200
    input: []
    output: FundingOpportunity
    side_effects: []

  # --- Principal Investigators ---
  - method: POST
    path: "/pre-award/principal-investigators"
    description: "Register a PI"
    roles: [OSPSystemAdmin]
    code: 201
    input: [full_name, department_code, rank, "delinquent_report_count?"]
    output: PrincipalInvestigator
    side_effects: ["is_eligible computed"]

  - method: GET
    path: "/pre-award/principal-investigators/{id}"
    description: "Get a PI (includes computed is_eligible, committed_effort_pct)"
    roles: [PI, PreAwardAnalyst, DepartmentChair, ComplianceOfficer, SubrecipientManager, OSPDirector, OSPSystemAdmin]
    code: 200
    input: []
    output: PrincipalInvestigator
    side_effects: []

  # --- F&A Rate Agreements ---
  - method: POST
    path: "/pre-award/fa-rate-agreements"
    description: "Create a rate agreement (status PROVISIONAL). FINAL-vs-FINAL same-type half-open window overlap is rejected; adjacency (end == start) is allowed."
    roles: [OSPDirector]
    code: 201
    input: [rate_type, rate_pct, effective_start_on, effective_end_on, "initial_status?"]
    output: FaRateAgreement
    side_effects: ["initial_status defaults PROVISIONAL; FINAL at create runs the overlap check"]

  - method: POST
    path: "/pre-award/fa-rate-agreements/{id}/finalize"
    description: "PROVISIONAL -> FINAL with FINAL-vs-FINAL overlap check"
    roles: [OSPDirector]
    code: 200
    input: []
    output: FaRateAgreement
    side_effects: []

  - method: GET
    path: "/pre-award/fa-rate-agreements/{id}"
    description: "Get a rate agreement"
    roles: [PI, PreAwardAnalyst, DepartmentChair, ComplianceOfficer, SubrecipientManager, OSPDirector, OSPSystemAdmin]
    code: 200
    input: []
    output: FaRateAgreement
    side_effects: []

  # --- Subrecipient Orgs ---
  - method: POST
    path: "/pre-award/subrecipient-orgs"
    description: "Register a subrecipient org; risk_score/risk_tier computed (standard variant)"
    roles: [SubrecipientManager]
    code: 201
    input: [legal_name, uei, "is_foreign?", single_audit_status, "audit_finding_count?", "first_time_subrecipient?"]
    output: SubrecipientOrg
    side_effects: ["risk_score and risk_tier computed"]

  - method: GET
    path: "/pre-award/subrecipient-orgs/{id}"
    description: "Get a subrecipient org"
    roles: [PI, PreAwardAnalyst, DepartmentChair, ComplianceOfficer, SubrecipientManager, OSPDirector, OSPSystemAdmin]
    code: 200
    input: []
    output: SubrecipientOrg
    side_effects: []

  - method: GET
    path: "/pre-award/subrecipient-orgs/{id}/subrecipient-commitments"
    description: "List commitments referencing this org (FK reverse)"
    roles: [PI, PreAwardAnalyst, DepartmentChair, ComplianceOfficer, SubrecipientManager, OSPDirector, OSPSystemAdmin]
    code: 200
    input: []
    output: "SubrecipientCommitment[]"
    side_effects: []

  # --- Proposals ---
  - method: POST
    path: "/pre-award/proposals"
    description: "Create a proposal (eligibility check: PI eligible, activity code allowed, per-PI cap)"
    roles: [PI]
    code: 201
    input: [opportunity_id, pi_id, title, activity_code, project_start_on, project_end_on, pi_effort_pct, "fa_base_type?"]
    output: Proposal
    side_effects: ["status = DRAFT", "version = 1"]

  - method: GET
    path: "/pre-award/proposals"
    description: "List proposals with filters and pagination"
    roles: [PI, PreAwardAnalyst, DepartmentChair, ComplianceOfficer, SubrecipientManager, OSPDirector, OSPSystemAdmin]
    code: 200
    input: ["opportunity_id?", "pi_id?", "status?", "current_snapshot_id?", "pinned_budget_snapshot_id?", "limit?", "offset?"]
    output: "Proposal[]"
    side_effects: []

  - method: GET
    path: "/pre-award/proposals/{id}"
    description: "Get a proposal (computed totals, posture, adequacy)"
    roles: [PI, PreAwardAnalyst, DepartmentChair, ComplianceOfficer, SubrecipientManager, OSPDirector, OSPSystemAdmin]
    code: 200
    input: []
    output: Proposal
    side_effects: []

  - method: PATCH
    path: "/pre-award/proposals/{id}"
    description: "Edit scalar fields while DRAFT or RETURNED_FOR_REVISION; RETURNED resumes to DRAFT"
    roles: [PI]
    code: 200
    input: ["title?", "project_start_on?", "project_end_on?", "pi_effort_pct?", "fa_base_type?"]
    output: Proposal
    side_effects: ["RETURNED_FOR_REVISION -> DRAFT", "increments Proposal.version by 1"]

  - method: POST
    path: "/pre-award/proposals/{id}/withdraw"
    description: "Withdraw a non-terminal, non-awarded proposal; terminal cleanup cascade"
    roles: [PI, OSPDirector]
    code: 200
    input: []
    output: Proposal
    side_effects: ["terminal cleanup cascade per Proposal machine", "increments Proposal.version by 1"]

  # --- Budget Lines ---
  - method: POST
    path: "/pre-award/proposals/{id}/budget-lines"
    description: "Add a budget line (proposal DRAFT | BUDGET_LOCKED | JIT_REQUESTED)"
    roles: [PreAwardAnalyst]
    code: 201
    input: [category, description, fiscal_year, amount_cents, "is_cost_share?", "subrecipient_commitment_id?"]
    output: BudgetLine
    side_effects:
      - "counts_toward_mtdc computed"
      - "when proposal BUDGET_LOCKED: CURRENT snapshot SUPERSEDED and proposal -> DRAFT"
      - "when proposal JIT_REQUESTED: CURRENT snapshot SUPERSEDED, budget_amended_since_approval = true, status unchanged"
      - "increments Proposal.version by 1"

  - method: GET
    path: "/pre-award/proposals/{id}/budget-lines"
    description: "List a proposal's budget lines (FK reverse)"
    roles: [PI, PreAwardAnalyst, DepartmentChair, ComplianceOfficer, SubrecipientManager, OSPDirector, OSPSystemAdmin]
    code: 200
    input: []
    output: "BudgetLine[]"
    side_effects: []

  - method: GET
    path: "/pre-award/budget-lines/{id}"
    description: "Get a budget line"
    roles: [PI, PreAwardAnalyst, DepartmentChair, ComplianceOfficer, SubrecipientManager, OSPDirector, OSPSystemAdmin]
    code: 200
    input: []
    output: BudgetLine
    side_effects: []

  - method: GET
    path: "/pre-award/budget-lines"
    description: "List budget lines filtered by FK (FK reverse)"
    roles: [PI, PreAwardAnalyst, DepartmentChair, ComplianceOfficer, SubrecipientManager, OSPDirector, OSPSystemAdmin]
    code: 200
    input: ["proposal_id?", "subrecipient_commitment_id?", "category?", "limit?", "offset?"]
    output: "BudgetLine[]"
    side_effects: []

  - method: DELETE
    path: "/pre-award/budget-lines/{id}"
    description: "Delete a budget line (same state rules as add)"
    roles: [PreAwardAnalyst]
    code: 204
    input: []
    output: null
    side_effects: ["same snapshot supersede rules as add", "increments Proposal.version by 1"]

  # --- Budget Finalization (snapshots) ---
  - method: POST
    path: "/pre-award/proposals/{id}/budget-finalizations"
    description: "Finalize budget: computes snapshot (indirect_cost), OCC-guarded. Allowed from DRAFT, BUDGET_LOCKED (re-finalize supersedes), JIT_REQUESTED (JIT revised budget)."
    roles: [PreAwardAnalyst]
    code: 201
    input: [expected_proposal_version]
    output: BudgetSnapshot
    side_effects: ["per Proposal finalize transitions", "increments Proposal.version by 1"]

  - method: GET
    path: "/pre-award/proposals/{id}/budget-snapshots"
    description: "List a proposal's budget snapshots (FK reverse)"
    roles: [PI, PreAwardAnalyst, DepartmentChair, ComplianceOfficer, SubrecipientManager, OSPDirector, OSPSystemAdmin]
    code: 200
    input: []
    output: "BudgetSnapshot[]"
    side_effects: []

  # --- Routing & Institutional Approval ---
  - method: POST
    path: "/pre-award/proposals/{id}/route"
    description: "Route for institutional approval (effort capacity + cost-share adequacy)"
    roles: [PreAwardAnalyst]
    code: 200
    input: []
    output: Proposal
    side_effects: ["routed_by_user_id = X-User-ID", "increments Proposal.version by 1"]

  - method: POST
    path: "/pre-award/proposals/{id}/approve-institutional"
    description: "Institutional approval from ROUTED (segregation of duties); re-pins the snapshot after a JIT budget amendment from JIT_REQUESTED or AWARDED (budget_amended_since_approval must be true)"
    roles: [OSPDirector]
    code: 200
    input: []
    output: Proposal
    side_effects: ["pinned_budget_snapshot_id = current_snapshot_id", "increments Proposal.version by 1"]

  - method: POST
    path: "/pre-award/proposals/{id}/return-for-revision"
    description: "Return a ROUTED proposal for revision; releases approved cost-share and stales verified sub commitments"
    roles: [OSPDirector]
    code: 200
    input: [reason]
    output: Proposal
    side_effects: ["RETURNED_FOR_REVISION cascade per Proposal machine", "increments Proposal.version by 1"]

  # --- Submission Portal ---
  - method: POST
    path: "/pre-award/proposals/{id}/submit"
    description: "Submit to sponsor portal; creates SubmissionPackage; idempotent on idempotency_key replay"
    roles: [OSPDirector]
    code: 201
    input: [idempotency_key]
    output: SubmissionPackage
    side_effects: ["proposal -> SUBMITTED, submitted_at = clock", "increments Proposal.version by 1"]

  - method: GET
    path: "/pre-award/proposals/{id}/submission-packages"
    description: "List submission packages (FK reverse; 0..1 entries)"
    roles: [PI, PreAwardAnalyst, DepartmentChair, ComplianceOfficer, SubrecipientManager, OSPDirector, OSPSystemAdmin]
    code: 200
    input: []
    output: "SubmissionPackage[]"
    side_effects: []

  # --- JIT ---
  - method: POST
    path: "/pre-award/proposals/{id}/jit-notices"
    description: "Record sponsor JIT request; SUBMITTED -> JIT_REQUESTED"
    roles: [OSPDirector]
    code: 200
    input: [sponsor_reference, "due_in_days?"]
    output: Proposal
    side_effects: ["jit_due_at = clock + due_in_days (default 14)", "increments Proposal.version by 1"]

  - method: POST
    path: "/pre-award/proposals/{id}/jit-responses"
    description: "Record JIT response submission; JIT_REQUESTED -> SUBMITTED"
    roles: [OSPDirector]
    code: 200
    input: [sponsor_reference]
    output: Proposal
    side_effects: ["increments Proposal.version by 1"]

  # --- Cost Share ---
  - method: POST
    path: "/pre-award/proposals/{id}/cost-share-commitments"
    description: "Pledge a cost-share commitment"
    roles: [PreAwardAnalyst]
    code: 201
    input: [source_type, amount_cents]
    output: CostShareCommitment
    side_effects: ["status = PLEDGED", "committed_by_user_id = X-User-ID"]

  - method: GET
    path: "/pre-award/proposals/{id}/cost-share-commitments"
    description: "List a proposal's cost-share commitments (FK reverse)"
    roles: [PI, PreAwardAnalyst, DepartmentChair, ComplianceOfficer, SubrecipientManager, OSPDirector, OSPSystemAdmin]
    code: 200
    input: []
    output: "CostShareCommitment[]"
    side_effects: []

  - method: POST
    path: "/pre-award/cost-share-commitments/{id}/approve"
    description: "Approve a pledge (segregation of duties: approver != committer)"
    roles: [DepartmentChair]
    code: 200
    input: []
    output: CostShareCommitment
    side_effects: ["proposal cost-share totals recomputed", "increments Proposal.version by 1"]

  - method: POST
    path: "/pre-award/cost-share-commitments/{id}/release"
    description: "Release an approved commitment (compensating action)"
    roles: [DepartmentChair]
    code: 200
    input: []
    output: CostShareCommitment
    side_effects: ["proposal cost-share totals recomputed", "increments Proposal.version by 1"]

  - method: POST
    path: "/pre-award/cost-share-commitments/{id}/withdraw"
    description: "Withdraw a pledge"
    roles: [PreAwardAnalyst]
    code: 200
    input: []
    output: CostShareCommitment
    side_effects: []

  # --- Compliance Reviews ---
  - method: POST
    path: "/pre-award/proposals/{id}/compliance-reviews"
    description: "Open an ancillary review; at most one non-terminal review per (proposal, review_type)"
    roles: [ComplianceOfficer]
    code: 201
    input: [review_type, "disclosure_complete?"]
    output: ComplianceReview
    side_effects: ["status = PENDING", "proposal.compliance_posture recomputed"]

  - method: GET
    path: "/pre-award/proposals/{id}/compliance-reviews"
    description: "List a proposal's compliance reviews (FK reverse)"
    roles: [PI, PreAwardAnalyst, DepartmentChair, ComplianceOfficer, SubrecipientManager, OSPDirector, OSPSystemAdmin]
    code: 200
    input: []
    output: "ComplianceReview[]"
    side_effects: []

  - method: POST
    path: "/pre-award/compliance-reviews/{id}/request-info"
    description: "PENDING -> INFO_REQUESTED"
    roles: [ComplianceOfficer]
    code: 200
    input: [question]
    output: ComplianceReview
    side_effects: []

  - method: POST
    path: "/pre-award/compliance-reviews/{id}/respond"
    description: "PI responds; INFO_REQUESTED -> PENDING; EXPIRED -> PENDING (renewal)"
    roles: [PI]
    code: 200
    input: ["response_note?", "disclosure_complete?"]
    output: ComplianceReview
    side_effects: ["EXPIRED renewal clears approved_until_at and validity_days"]

  - method: POST
    path: "/pre-award/compliance-reviews/{id}/approve"
    description: "PENDING -> APPROVED; sets approved_until_at = clock + validity_days"
    roles: [ComplianceOfficer]
    code: 200
    input: ["validity_days?"]
    output: ComplianceReview
    side_effects: ["proposal.compliance_posture recomputed"]

  - method: POST
    path: "/pre-award/compliance-reviews/{id}/disapprove"
    description: "PENDING | INFO_REQUESTED -> DISAPPROVED; fires the return-for-revision cascade"
    roles: [ComplianceOfficer]
    code: 200
    input: [reason]
    output: ComplianceReview
    side_effects: ["cascade per ComplianceReview disapprove transition", "increments Proposal.version by 1"]

  # --- Subrecipient Commitments ---
  - method: POST
    path: "/pre-award/proposals/{id}/subrecipient-commitments"
    description: "Attach a subrecipient commitment to a proposal"
    roles: [PreAwardAnalyst]
    code: 201
    input: [subrecipient_org_id, subaward_amount_cents, "statement_of_work_received?", "budget_received?", "enhanced_monitoring_acknowledged?"]
    output: SubrecipientCommitment
    side_effects: ["status = DRAFT"]

  - method: GET
    path: "/pre-award/proposals/{id}/subrecipient-commitments"
    description: "List a proposal's subrecipient commitments (FK reverse)"
    roles: [PI, PreAwardAnalyst, DepartmentChair, ComplianceOfficer, SubrecipientManager, OSPDirector, OSPSystemAdmin]
    code: 200
    input: []
    output: "SubrecipientCommitment[]"
    side_effects: []

  - method: POST
    path: "/pre-award/subrecipient-commitments/{id}/verify"
    description: "Verify a commitment (DRAFT | STALE -> VERIFIED); pins risk snapshot and monitoring level"
    roles: [SubrecipientManager]
    code: 200
    input: []
    output: SubrecipientCommitment
    side_effects: ["verified_risk_snapshot_score and monitoring_level set per subrecipient_risk_score variant"]

  - method: POST
    path: "/pre-award/subrecipient-commitments/{id}/void"
    description: "Void a commitment"
    roles: [SubrecipientManager]
    code: 200
    input: []
    output: SubrecipientCommitment
    side_effects: []

  # --- Negotiation Offers ---
  - method: POST
    path: "/pre-award/proposals/{id}/negotiation-offers"
    description: "Open a negotiation round (OCC-guarded); supersedes any PROPOSED offer; moves SUBMITTED | JIT_REQUESTED -> NEGOTIATING"
    roles: [OSPDirector]
    code: 201
    input: [expected_proposal_version, origin, offered_total_cents, "offered_fa_rate_pct?", "note?"]
    output: NegotiationOffer
    side_effects: ["prior PROPOSED offer -> VOIDED", "increments Proposal.version by 1"]

  - method: GET
    path: "/pre-award/proposals/{id}/negotiation-offers"
    description: "List a proposal's negotiation offers (FK reverse)"
    roles: [PI, PreAwardAnalyst, DepartmentChair, ComplianceOfficer, SubrecipientManager, OSPDirector, OSPSystemAdmin]
    code: 200
    input: []
    output: "NegotiationOffer[]"
    side_effects: []

  - method: POST
    path: "/pre-award/negotiation-offers/{id}/accept"
    description: "Accept the open offer; proposal -> AWARDED; AwardHandoff auto-created"
    roles: [OSPDirector]
    code: 200
    input: []
    output: NegotiationOffer
    side_effects: ["award cascade per Proposal machine", "increments Proposal.version by 1"]

  - method: POST
    path: "/pre-award/negotiation-offers/{id}/decline"
    description: "Decline the open offer; proposal -> DECLINED with terminal cleanup"
    roles: [OSPDirector]
    code: 200
    input: []
    output: NegotiationOffer
    side_effects: ["terminal cleanup cascade", "increments Proposal.version by 1"]

  # --- Award Handoff ---
  - method: GET
    path: "/pre-award/proposals/{id}/award-handoffs"
    description: "Get the proposal's handoff (FK reverse; 0..1 entries)"
    roles: [PI, PreAwardAnalyst, DepartmentChair, ComplianceOfficer, SubrecipientManager, OSPDirector, OSPSystemAdmin]
    code: 200
    input: []
    output: "AwardHandoff[]"
    side_effects: []

  - method: POST
    path: "/pre-award/award-handoffs/{id}/mark-ready"
    description: "Run the full readiness gate (compliance, pinned snapshot, FINAL rate, subs, cost-share) and recompute final totals under FINAL_BASIS"
    roles: [OSPDirector]
    code: 200
    input: []
    output: AwardHandoff
    side_effects: ["final_indirect_cents / final_total_cents computed", "checklist flags set"]

  - method: POST
    path: "/pre-award/award-handoffs/{id}/handoff"
    description: "Complete the award setup handoff; proposal -> SETUP_COMPLETE"
    roles: [OSPDirector]
    code: 200
    input: []
    output: AwardHandoff
    side_effects: ["handoff_at = clock", "proposal -> SETUP_COMPLETE", "increments Proposal.version by 1"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role missing, or role not one of the seven declared roles" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Entity-backed role acting on a resource it does not own (PI pi_id mismatch)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body-referenced FK does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed request: missing required field, type mismatch, invalid enum member, amount_cents <= 0, end before start, SUBAWARD line without subrecipient_commitment_id" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_proposal_version != current proposal.version on OCC-guarded writes" }
  - { id: ERR_PROPOSAL_INVALID_STATE, http: 409, condition: "Proposal status does not allow the operation" }
  - { id: ERR_COMMITMENT_INVALID_STATE, http: 409, condition: "Cost-share or subrecipient commitment status does not allow the operation" }
  - { id: ERR_REVIEW_INVALID_STATE, http: 409, condition: "Compliance review status does not allow the operation" }
  - { id: ERR_OFFER_INVALID_STATE, http: 409, condition: "Negotiation offer status does not allow the operation" }
  - { id: ERR_HANDOFF_INVALID_STATE, http: 409, condition: "Handoff status does not allow the operation" }
  - { id: ERR_RATE_AGREEMENT_INVALID_STATE, http: 409, condition: "Rate agreement not in PROVISIONAL for finalize" }
  - { id: ERR_SELF_APPROVAL, http: 403, condition: "Institutional approver equals routed_by_user_id (segregation of duties)" }
  - { id: ERR_COST_SHARE_SELF_APPROVAL, http: 403, condition: "Cost-share approver equals committed_by_user_id (segregation of duties)" }
  - { id: ERR_PI_NOT_ELIGIBLE, http: 403, condition: "PI has delinquent_report_count > 0 at proposal creation" }
  - { id: ERR_OPPORTUNITY_CLOSED, http: 409, condition: "Opportunity not in PUBLISHED status for create/approve/submit" }
  - { id: ERR_INTERNAL_DEADLINE_PASSED, http: 422, condition: "Logical clock is after opportunity.internal_deadline_at at submit" }
  - { id: ERR_COMPLIANCE_DISAPPROVED, http: 409, condition: "A review of the proposal is DISAPPROVED (mark-ready safety gate)" }
  - { id: ERR_COMPLIANCE_APPROVAL_EXPIRED, http: 409, condition: "A review of the proposal is EXPIRED or past approved_until_at (mark-ready temporal gate)" }
  - { id: ERR_COMPLIANCE_REVIEW_PENDING, http: 409, condition: "A review of the proposal is PENDING or INFO_REQUESTED at mark-ready" }
  - { id: ERR_COI_DISCLOSURE_INCOMPLETE, http: 422, condition: "CONFLICT_OF_INTEREST approve attempted with disclosure_complete == false" }
  - { id: ERR_ACTIVITY_CODE_NOT_ALLOWED, http: 422, condition: "Proposal activity_code not in opportunity.activity_codes_allowed" }
  - { id: ERR_PI_PROPOSAL_LIMIT_EXCEEDED, http: 409, condition: "PI already has max_proposals_per_pi non-terminal proposals for this opportunity" }
  - { id: ERR_DUPLICATE_ACTIVE_REVIEW, http: 409, condition: "A review of same (proposal, review_type) already exists in PENDING | INFO_REQUESTED | APPROVED" }
  - { id: ERR_FA_RATE_WINDOW_OVERLAP, http: 409, condition: "FINAL agreement window overlaps another FINAL agreement of the same rate_type (half-open; adjacency allowed)" }
  - { id: ERR_PI_EFFORT_EXCEEDED, http: 422, condition: "pi_effort_pct + overlapping committed effort > 100.00 at route" }
  - { id: ERR_EMPTY_BUDGET, http: 422, condition: "Finalize attempted with zero non-cost-share budget lines" }
  - { id: ERR_NO_APPLICABLE_RATE, http: 422, condition: "No FINAL or PROVISIONAL rate agreement covers project_start_on for the resolved rate_type" }
  - { id: ERR_RATE_NOT_FINAL, http: 409, condition: "Mark-ready: no FINAL rate agreement covers project_start_on" }
  - { id: ERR_STALE_BUDGET_SNAPSHOT, http: 409, condition: "Mark-ready: pinned_budget_snapshot_id != current_snapshot_id (budget amended since approval)" }
  - { id: ERR_SUBREC_DOCS_INCOMPLETE, http: 422, condition: "Verify attempted without statement_of_work_received and budget_received" }
  - { id: ERR_SUBREC_HIGH_RISK_NOT_ACKED, http: 422, condition: "Verify attempted on HIGH tier org without enhanced_monitoring_acknowledged" }
  - { id: ERR_SUBRECIPIENT_NOT_VERIFIED, http: 409, condition: "Mark-ready: a non-VOIDED SubrecipientCommitment is not VERIFIED" }
  - { id: ERR_UEI_NOT_UNIQUE, http: 409, condition: "SubrecipientOrg uei already registered" }
  - { id: ERR_REQUEST_EXCEEDS_CAP, http: 422, condition: "total_request_cents > opportunity.max_request_cents at finalize" }
  - { id: ERR_COST_SHARE_INADEQUATE, http: 422, condition: "total_effective_cost_share_cents < required_min_cost_share_cents at route or mark-ready" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PI
    description: "Principal Investigator; owns proposals where pi_id == X-User-ID"
    identity: "entity_backed:PrincipalInvestigator"
    exclusive_operations:
      - "POST /pre-award/proposals — create proposal (pi_id must equal X-User-ID)"
      - "PATCH /pre-award/proposals/{id} — edit own proposal in DRAFT | RETURNED_FOR_REVISION"
      - "POST /pre-award/compliance-reviews/{id}/respond — respond to own proposal's reviews"
    shared_operations:
      - "POST /pre-award/proposals/{id}/withdraw — shared with OSPDirector (PI limited to own)"
      - "All GET endpoints — shared with all roles"

  - name: PreAwardAnalyst
    description: "OSP pre-award analyst; builds budgets, finalizes, routes, pledges cost-share, attaches subrecipients"
    identity: "opaque"
    exclusive_operations:
      - "POST /pre-award/proposals/{id}/budget-lines"
      - "DELETE /pre-award/budget-lines/{id}"
      - "POST /pre-award/proposals/{id}/budget-finalizations"
      - "POST /pre-award/proposals/{id}/route"
      - "POST /pre-award/proposals/{id}/cost-share-commitments"
      - "POST /pre-award/cost-share-commitments/{id}/withdraw"
      - "POST /pre-award/proposals/{id}/subrecipient-commitments"
    shared_operations:
      - "All GET endpoints — shared with all roles"

  - name: DepartmentChair
    description: "Department chair; approves and releases cost-share commitments"
    identity: "opaque"
    exclusive_operations:
      - "POST /pre-award/cost-share-commitments/{id}/approve"
      - "POST /pre-award/cost-share-commitments/{id}/release"
    shared_operations:
      - "All GET endpoints — shared with all roles"

  - name: ComplianceOfficer
    description: "Compliance office reviewer; manages ancillary review lifecycle"
    identity: "opaque"
    exclusive_operations:
      - "POST /pre-award/proposals/{id}/compliance-reviews"
      - "POST /pre-award/compliance-reviews/{id}/request-info"
      - "POST /pre-award/compliance-reviews/{id}/approve"
      - "POST /pre-award/compliance-reviews/{id}/disapprove"
    shared_operations:
      - "All GET endpoints — shared with all roles"

  - name: SubrecipientManager
    description: "Subrecipient monitoring officer; maintains org registry and verifies commitments"
    identity: "opaque"
    exclusive_operations:
      - "POST /pre-award/subrecipient-orgs"
      - "POST /pre-award/subrecipient-commitments/{id}/verify"
      - "POST /pre-award/subrecipient-commitments/{id}/void"
    shared_operations:
      - "All GET endpoints — shared with all roles"

  - name: OSPDirector
    description: "Director of sponsored programs; institutional approval, submission, negotiation, handoff, rate agreements"
    identity: "opaque"
    exclusive_operations:
      - "POST /pre-award/fa-rate-agreements and /finalize"
      - "POST /pre-award/proposals/{id}/approve-institutional"
      - "POST /pre-award/proposals/{id}/return-for-revision"
      - "POST /pre-award/proposals/{id}/submit"
      - "POST /pre-award/proposals/{id}/jit-notices and /jit-responses"
      - "POST /pre-award/proposals/{id}/negotiation-offers"
      - "POST /pre-award/negotiation-offers/{id}/accept and /decline"
      - "POST /pre-award/award-handoffs/{id}/mark-ready and /handoff"
    shared_operations:
      - "POST /pre-award/proposals/{id}/withdraw — shared with PI"
      - "All GET endpoints — shared with all roles"

  - name: OSPSystemAdmin
    description: "System administrator; opportunity intake, PI registry, logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /pre-award/funding-opportunities"
      - "POST /pre-award/principal-investigators"
      - "POST /pre-award/_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints — shared with all roles"
