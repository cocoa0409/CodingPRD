      - name: request_missing_auth_returns_unauthenticated
        claim_type: Peer roles
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_AUTH_CONTEXT]"]
        distinguishing_aspect: "A request with no/invalid X-User-ID or X-User-Role headers returns ERR_MISSING_AUTH_CONTEXT (401) before any role or business check."
        test_recipe:
          setup: ["empty DB; the trigger is sent with absent auth headers"]
          setup_api_calls: []
          trigger:
            - call: "GET /patients/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Patient
              captures: { err: $.data.error_id }
          assert:
            - "with headers omitted the response error_id == ERR_MISSING_AUTH_CONTEXT"

  # ---------------------------------------------------------------------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: subscription_supersede_prior_marks_it_superseded
        claim_type: optimistic_concurrency
        grounds: ["state_machines.Subscription.ACTIVE_to_SUPERSEDED", "concurrency_rules[subscription-create-stale-patient]"]
        distinguishing_aspect: "Creating a second subscription (with the patient's current version) supersedes the first: prior -> SUPERSEDED, new -> ACTIVE (produces the SUPERSEDED member)."
        test_recipe:
          setup: ["patient with one ACTIVE subscription"]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Deb D", email: "debd@x.com", date_of_birth: "1970-04-04", state_code: "CA", billing_mode: "CASH", menopause_stage: "MENOPAUSE" }
              as: CareCoordinator
              captures: { pat_id: $.data.id, pat_v: $.data.version }
            - call: "POST /subscriptions"
              payload: { patient_id: "${pat_id}", plan_tier: "ESSENTIAL", expected_patient_version: "${pat_v}" }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { sub1_id: $.data.id }
            - call: "GET /patients/${pat_id}"
              payload: {}
              as: Patient
              as_user_id: "${pat_id}"
              captures: { pat_v2: $.data.version }
          trigger:
            - call: "POST /subscriptions"
              payload: { patient_id: "${pat_id}", plan_tier: "PLUS", expected_patient_version: "${pat_v2}" }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { sub2_status: $.data.status }
          assert:
            - "Subscription.${sub1_id}.status == SUPERSEDED"
            - "new subscription status == ACTIVE"

      - name: subscription_create_stale_patient_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[subscription-create-stale-patient]", "errors[ERR_STALE_PATIENT_VERSION]"]
        distinguishing_aspect: "A second create still carrying the pre-supersede expected_patient_version is rejected with ERR_STALE_PATIENT_VERSION (412) — two strictly sequential requests."
        test_recipe:
          setup: ["patient at version 1; first subscription created (patient advances to version 2)"]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Eli E", email: "elie@x.com", date_of_birth: "1970-05-05", state_code: "CA", billing_mode: "CASH", menopause_stage: "MENOPAUSE" }
              as: CareCoordinator
              captures: { pat_id: $.data.id, pat_v: $.data.version }
            - call: "POST /subscriptions"
              payload: { patient_id: "${pat_id}", plan_tier: "ESSENTIAL", expected_patient_version: "${pat_v}" }
              as: Patient
              as_user_id: "${pat_id}"
          trigger:
            - call: "POST /subscriptions"
              payload: { patient_id: "${pat_id}", plan_tier: "PLUS", expected_patient_version: "${pat_v}" }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { err: $.data.error_id }
          assert:
            - "second create (stale expected_patient_version) error_id == ERR_STALE_PATIENT_VERSION"

