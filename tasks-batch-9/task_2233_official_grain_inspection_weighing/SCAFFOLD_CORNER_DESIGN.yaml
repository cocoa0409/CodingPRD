          - "validations[priority=11]"
          - "errors[ERR_INSPECTOR_NOT_QUALIFIED]"
          - "calculations.inspector_performance_score"
        distinguishing_aspect: "Activation has two independent gates and the hours gate is inclusive: 23 filed hours is refused, the 24th hour flips the same call to success, and the licence must still be PROBATIONARY for either gate to matter."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T09:00:00Z."
            - "A DESIGNATED area with one PROBATIONARY inspector who has 23 filed training hours and an untouched performance_score of 100."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
