              as_user_id: "judge-1"
            - call: "POST /gc/appointments"
              payload: { case_id: "${case_id}", fiduciary_id: "${fid_id}" }
              as: Judge
              as_user_id: "judge-1"
              captures: { appt_id: $.data.id }
            - call: "GET /gc/bonds?appointment_id=${appt_id}"
              payload: {}
              as: Judge
              as_user_id: "judge-1"
              captures: { bond_id: "$.data[0].id" }
            - call: "POST /gc/bonds/${bond_id}/post"
              payload: { posted_amount_cents: 10000000, surety_name: "Acme" }
              as: Fiduciary
              as_user_id: "${fid_id}"
            - call: "POST /gc/bonds/${bond_id}/approve"
              payload: {}
              as: Judge
              as_user_id: "judge-1"
            - call: "POST /gc/appointments/${appt_id}/qualify"
