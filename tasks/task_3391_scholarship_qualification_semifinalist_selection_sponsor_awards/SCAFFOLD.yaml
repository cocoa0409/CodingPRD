scenario: "Scholarship Qualification, Semifinalist Selection & Sponsor Awards (National Merit Scholarship Corporation): qualification through a preliminary examination taken in a specific high school year with entry requirements, semifinalist selection using state-level score thresholds allocated by student population, finalist advancement requiring an application, endorsement, academic record and confirming examination score, scholarship categories including single-payment national awards, corporate-sponsored awards for employee children and college-sponsored renewable awards, corporate sponsor agreements defining eligibility criteria and award amounts with administration by the program, college sponsorship where an institution funds awards for finalists who indicate it as first choice, notification sequencing and publicity restrictions, scholarship payment administration and renewal verification"
domain_name: "merit-scholarship-awards"
api_prefix: "/api"

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  complexity_layers:
    - selector_policy
    - scheduled_deferred_actions
    - derived_field_reconciliation
    - optimistic_concurrency
  entity_topology: graph
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_note: |
    Deliberately harder than the Expert band: 13 entities, 41 endpoints, 32 error codes,
    10 state machines (one cyclic with a correction loop, one with parallel state
    dimensions, one posture-driven parent gating every child workflow), dual-variant
    apportionment, reservation-vs-cash pool accounting, waterfall award matching with
    a pinned selector policy, per-term rounding with remainder absorption, two OCC
    stale-version gates, embargo/sequence/publicity-gap notification compliance, and
    depth-4 transitive cascades on decline and on renewal rejection. Every deadline,
    embargo, and scheduled date is evaluated against the logical clock
    (POST /api/_clock/set_current_utc; startup default 2026-09-01T00:00:00Z), never
    against wall-clock time; created_at/updated_at are audit metadata only and MUST
    NOT drive business decisions.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: ProgramCycle
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Human label for the competition cycle, e.g. '2028 Competition'."
      - name: target_graduation_year
        type: integer
        source: input
        description: "High-school graduation year a Student must declare to enter this cycle."
      - name: total_semifinalist_slots
        type: integer
        source: input
        description: "Total semifinalist slots apportioned across states; >= 1."
      - name: national_award_slots
        type: integer
        source: input
        description: "Count of single-payment national awards granted per cycle; >= 0 (0 disables the national bucket)."
      - name: national_award_amount_cents
        type: integer
        source: input
        description: "Per-recipient amount of a national single-payment award, in cents; > 0."
      - name: confirming_floor
        type: integer
        source: input
        description: "Minimum confirming examination selection index required for finalist confirmation; 48..228."
        constraints: "48..228 inclusive"
      - name: application_deadline
        type: datetime
        source: input
        description: "Logical-clock instant after which finalist applications may no longer be created or submitted."
      - name: semifinalist_embargo_until
        type: datetime
        source: input
        description: "Embargo instant for SEMIFINALIST_NOTICE notifications of this cycle."
      - name: finalist_embargo_until
        type: datetime
        source: input
        description: "Embargo instant for FINALIST_NOTICE notifications of this cycle."
      - name: award_embargo_until
        type: datetime
        source: input
        description: "Embargo instant for AWARD_OFFER notifications of this cycle."
      - name: public_embargo_until
        type: datetime
        source: input
        description: "Embargo instant for PUBLIC_ANNOUNCEMENT notifications of this cycle."
      - name: status
        type: enum
        source: system
        description: "Posture of the cycle; gates all child workflows."
        default: SETUP
        constraints: "SETUP | ENTRY_OPEN | ENTRY_CLOSED | SEMIFINALISTS_SELECTED | FINALISTS_SELECTED | AWARDS_COMPLETED"
      - name: matching_run
        type: boolean
        source: system
        description: "True once run-award-matching has executed for this cycle."
        default: false

  - name: StateAllocation
    parent: ProgramCycle
    common_fields: true
    fields:
      - name: cycle_id
        type: string
        source: system
        description: "FK -> ProgramCycle.id; owning cycle, set at creation from the cycle's state_populations input."
      - name: state_code
        type: string
        source: input
        description: "Two-letter state/territory code this allocation row belongs to."
      - name: graduating_population
        type: integer
        source: input
        description: "Projected graduating-student population of the state for this cycle; >= 0."
      - name: quota_raw
        type: number
        source: computed
        description: "total_semifinalist_slots * graduating_population / sum(graduating_population over the cycle's states); unrounded."
      - name: slots_provisional
        type: integer
        source: computed
        description: "Provisional variant allocation: round_half_up(quota_raw) per state. Computed at close-entries; nullable until then."
      - name: slots_final
        type: integer
        source: computed
        description: "Final variant allocation: largest-remainder apportionment with MIN_STATE_SLOTS=1 guarantee. Computed at run-semifinalist-selection; nullable until then."
      - name: threshold_selection_index
        type: integer
        source: computed
        description: "Selection index of the k-th ranked SCORED entry in the state (k = min(slots_final, scored_count)); null when the state has zero SCORED entries."
      - name: selected_count
        type: integer
        source: computed
        description: "Count of entries in this state with status SELECTED_SEMIFINALIST; may exceed slots_final on a threshold tie."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Allocation lifecycle."
        default: PENDING
        constraints: "PENDING | PROVISIONAL | FINAL"

  - name: School
    parent: null
    common_fields: false
    fields:
      - name: name
        type: string
        source: input
        description: "Official school name."
      - name: school_code
        type: string
        source: input
        description: "Program-assigned school code; unique across all schools."
        constraints: "unique"
      - name: state_code
        type: string
        source: input
        description: "State where the school is located."

  - name: Student
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Student legal name."
      - name: school_id
        type: string
        source: input
        description: "FK -> School.id; school the student attends; drives endorsement routing."
      - name: state_code
        type: string
        source: input
        description: "State used for semifinalist allocation (state of attendance)."
      - name: graduation_year
        type: integer
        source: input
        description: "Declared high-school graduation year; must equal ProgramCycle.target_graduation_year at entry creation."
      - name: citizenship_status
        type: enum
        source: input
        description: "Entry-requirement citizenship classification; OTHER is ineligible."
        constraints: "US_CITIZEN | US_NATIONAL | LAWFUL_PERMANENT_RESIDENT | OTHER"
      - name: enrollment_status
        type: enum
        source: input
        description: "Entry-requirement enrollment classification; NOT_ENROLLED is ineligible."
        constraints: "ENROLLED_FULL_TIME | ENROLLED_PART_TIME | NOT_ENROLLED"
      - name: parent_sponsor_id
        type: string
        source: input
        description: "FK -> CorporateSponsor.id; optional — the corporate sponsor employing a parent; drives employee-children award eligibility. Null when not applicable."

  - name: Entry
    parent: null
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; the entrant. Unique per (student_id, cycle_id)."
      - name: cycle_id
        type: string
        source: input
        description: "FK -> ProgramCycle.id; the cycle entered."
      - name: exam_year_of_hs
        type: enum
        source: input
        description: "High-school year in which the preliminary examination was taken; only THIRD_YEAR satisfies entry requirements."
        constraints: "SECOND_YEAR | THIRD_YEAR"
      - name: reading_score
        type: integer
        source: input
        description: "Preliminary examination reading section score; null until scored; 8..38 when set."
        constraints: "8..38 inclusive when set"
      - name: writing_score
        type: integer
        source: input
        description: "Preliminary examination writing section score; null until scored; 8..38 when set."
        constraints: "8..38 inclusive when set"
      - name: math_score
        type: integer
        source: input
        description: "Preliminary examination math section score; null until scored; 8..38 when set."
        constraints: "8..38 inclusive when set"
      - name: selection_index
        type: integer
        source: computed
        description: "(reading_score + writing_score + math_score) * 2; range 48..228; null until scored. Any client-supplied value is ignored."
      - name: status
        type: enum
        source: system
        description: "Entry lifecycle."
        default: SUBMITTED
        constraints: "SUBMITTED | SCORED | SELECTED_SEMIFINALIST | NOT_SELECTED"
      - name: scored_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the score was recorded; null until scored."

  - name: FinalistApplication
    parent: null
    common_fields: true
    fields:
      - name: entry_id
        type: string
        source: input
        description: "FK -> Entry.id; the semifinalist entry this application advances; unique (at most one application per entry)."
      - name: student_id
        type: string
        source: system
        description: "FK -> Student.id; denormalized from Entry.student_id at creation."
      - name: first_choice_college_id
        type: string
        source: input
        description: "FK -> CollegeInstitution.id; optional — the institution the finalist names as first choice; drives college-sponsored matching. Null means no college preference declared."
      - name: gpa_scaled
        type: number
        source: input
        description: "Academic record: GPA on a 0.0-4.0 scale."
        constraints: "0.0..4.0 inclusive"
      - name: course_rigor
        type: enum
        source: input
        description: "Academic record: rigor of coursework."
        constraints: "STANDARD | ADVANCED | MOST_RIGOROUS"
      - name: confirming_selection_index
        type: integer
        source: input
        description: "Self-reported confirming examination selection index; must be >= ProgramCycle.confirming_floor at submit and at confirmation; 48..228."
        constraints: "48..228 inclusive"
      - name: endorsement_status
        type: enum
        source: system
        description: "School endorsement component of the finalist requirements."
        default: PENDING
        constraints: "PENDING | ENDORSED"
      - name: endorsed_by_school_id
        type: string
        source: system
        description: "FK -> School.id; school whose official endorsed the application; null until endorsed."
      - name: status
        type: enum
        source: system
        description: "Application lifecycle; supports the RETURNED_FOR_CORRECTION -> UNDER_REVIEW resubmission cycle."
        default: IN_PROGRESS
        constraints: "IN_PROGRESS | UNDER_REVIEW | RETURNED_FOR_CORRECTION | FINALIST_CONFIRMED | DENIED"
      - name: return_reason
        type: string
        source: system
        description: "Reviewer-supplied reason when RETURNED_FOR_CORRECTION; cleared on resubmission."
      - name: submitted_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent submit; used as the final selector tie-break (never id)."

  - name: CorporateSponsor
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Sponsor legal name."
      - name: sponsor_code
        type: string
        source: input
        description: "Program-assigned sponsor code; unique."
        constraints: "unique"

  - name: SponsorAgreement
    parent: null
    common_fields: true
    fields:
      - name: sponsor_id
        type: string
        source: system
        description: "FK -> CorporateSponsor.id; owning sponsor, taken from the creation path."
      - name: cycle_id
        type: string
        source: input
        description: "FK -> ProgramCycle.id; cycle whose finalists this agreement funds."
      - name: supersedes_agreement_id
        type: string
        source: system
        description: "FK -> SponsorAgreement.id; self-referential — set on the replacement agreement created by amend; null on originals."
      - name: award_amount_cents
        type: integer
        source: input
        description: "Per-award amount funded by this agreement (single-payment); > 0."
      - name: max_awards
        type: integer
        source: input
        description: "Maximum number of awards this agreement may grant; >= 1."
      - name: pool_total_cents
        type: integer
        source: input
        description: "Total funding pool; >= award_amount_cents."
      - name: employee_children_only
        type: boolean
        source: input
        description: "Eligibility criterion: when true, only students whose parent_sponsor_id equals sponsor_id are eligible."
        default: true
      - name: min_selection_index
        type: integer
        source: input
        description: "Optional extra eligibility criterion: minimum entry selection_index; null means no extra floor."
      - name: effective_start_date
        type: string
        source: input
        description: "Start of the agreement's effective window (ISO date); half-open interval [start, end)."
      - name: effective_end_date
        type: string
        source: input
        description: "End of the agreement's effective window (ISO date, exclusive); must be after effective_start_date."
      - name: pool_committed_cents
        type: integer
        source: computed
        description: "Reservation ledger: sum over this agreement's awards with recipient_status IN {OFFERED, ACCEPTED, ENROLLED, RENEWED} of (amount_cents - released disbursements). Recomputed on every award/disbursement mutation."
        default: 0
      - name: pool_paid_cents
        type: integer
        source: computed
        description: "Cash ledger: sum of RELEASED disbursement amounts funded by this agreement."
        default: 0
      - name: pool_available_reserved_cents
        type: integer
        source: computed
        description: "pool_total_cents - pool_committed_cents - pool_paid_cents. Reservation variant of availability; the matching gate uses this."
        default: 0
      - name: pool_available_cash_cents
        type: integer
        source: computed
        description: "pool_total_cents - pool_paid_cents. Cash variant of availability; reported for reconciliation only, never gates."
        default: 0
      - name: status
        type: enum
        source: system
        description: "ACTIVE while it can fund offers; EXHAUSTED (auto) when pool_available_reserved_cents < award_amount_cents or max_awards reached; SUPERSEDED by a successful amend; CLOSED when its cycle reaches AWARDS_COMPLETED."
        default: ACTIVE
        constraints: "ACTIVE | EXHAUSTED | SUPERSEDED | CLOSED"

  - name: CollegeInstitution
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Institution legal name."
      - name: college_code
        type: string
        source: input
        description: "Program-assigned institution code; unique."
        constraints: "unique"
      - name: award_amount_cents
        type: integer
        source: input
        description: "Per-academic-year amount of a college-sponsored renewable award; > 0."
      - name: renewable_years_total
        type: integer
        source: input
        description: "Number of academic years the award can be renewed; >= 2."
        constraints: ">= 2"
      - name: terms_per_year
        type: integer
        source: input
        description: "Disbursement terms per academic year; >= 1."
        constraints: ">= 1"
      - name: pool_total_cents
        type: integer
        source: input
        description: "Total funding pool across all cycles; >= award_amount_cents * renewable_years_total."
      - name: max_awards
        type: integer
        source: input
        description: "Maximum concurrently funded awards; >= 1."
      - name: pool_committed_cents
        type: integer
        source: computed
        description: "Reservation ledger (same formula as SponsorAgreement.pool_committed_cents) over this institution's awards."
        default: 0
      - name: pool_paid_cents
        type: integer
        source: computed
        description: "Cash ledger: sum of RELEASED disbursements funded by this institution."
        default: 0
      - name: pool_available_reserved_cents
        type: integer
        source: computed
        description: "pool_total_cents - pool_committed_cents - pool_paid_cents; gates college matching."
        default: 0
      - name: pool_available_cash_cents
        type: integer
        source: computed
        description: "pool_total_cents - pool_paid_cents; reporting only."
        default: 0
      - name: status
        type: enum
        source: system
        description: "ACTIVE while it can fund offers; EXHAUSTED (auto) when pool_available_reserved_cents < award_amount_cents * renewable_years_total or max_awards reached; returns to ACTIVE when a release frees enough pool."
        default: ACTIVE
        constraints: "ACTIVE | EXHAUSTED"

  - name: Award
    parent: null
    common_fields: true
    fields:
      - name: cycle_id
        type: string
        source: system
        description: "FK -> ProgramCycle.id; cycle in which the award was matched."
      - name: application_id
        type: string
        source: system
        description: "FK -> FinalistApplication.id; the confirmed application this award belongs to."
      - name: student_id
        type: string
        source: system
        description: "FK -> Student.id; denormalized from the application."
      - name: agreement_id
        type: string
        source: system
        description: "FK -> SponsorAgreement.id; set iff category == CORPORATE_SPONSORED, else null."
      - name: college_id
        type: string
        source: system
        description: "FK -> CollegeInstitution.id; set iff category == COLLEGE_SPONSORED, else null."
      - name: category
        type: enum
        source: system
        description: "Scholarship category assigned by the waterfall."
        constraints: "NATIONAL_SINGLE | CORPORATE_SPONSORED | COLLEGE_SPONSORED"
      - name: amount_cents
        type: integer
        source: computed
        description: "Total award obligation: national/corporate = the configured single payment; college = award_amount_cents * renewable_years_total."
      - name: terms_total
        type: integer
        source: computed
        description: "Disbursement term count: 1 for single-payment categories; renewable_years_total * terms_per_year for college awards."
      - name: renewable_years_total
        type: integer
        source: computed
        description: "1 for single-payment categories; the institution's renewable_years_total for college awards."
      - name: years_renewed
        type: integer
        source: system
        description: "Count of APPROVED renewal verifications; 0..renewable_years_total-1."
        default: 0
      - name: recipient_status
        type: enum
        source: system
        description: "Parallel state dimension 1: OFFERED -> ACCEPTED -> ENROLLED -> RENEWED -> COMPLETED; OFFERED -> DECLINED | EXPIRED; ENROLLED/RENEWED -> LAPSED."
        default: OFFERED
        constraints: "OFFERED | ACCEPTED | ENROLLED | RENEWED | COMPLETED | DECLINED | EXPIRED | LAPSED"
      - name: funding_status
        type: enum
        source: system
        description: "Parallel state dimension 2, evolving independently of recipient_status: PLEDGED -> COMMITTED -> PARTIALLY_DISBURSED -> FULLY_DISBURSED; any pre-terminal funding state -> RELEASED_BACK on decline/expiry/lapse."
        default: PLEDGED
        constraints: "PLEDGED | COMMITTED | PARTIALLY_DISBURSED | FULLY_DISBURSED | RELEASED_BACK"
      - name: selection_index_snapshot
        type: integer
        source: system
        description: "Entry selection_index at matching time; selector ranking snapshot."
      - name: offered_logical_at
        type: datetime
        source: system
        description: "Logical-clock instant of award creation (matching run or waitlist promotion)."
      - name: acceptance_deadline
        type: datetime
        source: computed
        description: "offered_logical_at + ACCEPTANCE_WINDOW_DAYS (30) days; an offer not accepted by this instant is swept to EXPIRED on the next clock advance."

  - name: Disbursement
    parent: null
    common_fields: true
    fields:
      - name: award_id
        type: string
        source: system
        description: "FK -> Award.id; owning award, set when the schedule is generated at accept."
      - name: term_index
        type: integer
        source: system
        description: "1-based term number within the award schedule; 1..terms_total."
      - name: academic_year_index
        type: integer
        source: system
        description: "1-based academic year the term belongs to: ceil(term_index / terms_per_year of the funding config); 1 for single-payment awards."
      - name: scheduled_date
        type: datetime
        source: computed
        description: "Logical date the term becomes payable: date(acceptance) + (term_index - 1) * TERM_INTERVAL_DAYS (180) days."
      - name: amount_cents
        type: integer
        source: computed
        description: "Per-term amount: round_half_up(award.amount_cents / terms_total) for terms 1..terms_total-1; the final term absorbs the remainder (award.amount_cents - sum of prior terms)."
      - name: status
        type: enum
        source: system
        description: "SCHEDULED when payable once due; HELD for year >= 2 terms until that year's renewal is APPROVED; RELEASED when paid; CANCELLED when the award lapses."
        constraints: "SCHEDULED | HELD | RELEASED | CANCELLED"
      - name: released_logical_at
        type: datetime
        source: system
        description: "Logical-clock instant of release; null until RELEASED."

  - name: RenewalVerification
    parent: null
    common_fields: true
    fields:
      - name: award_id
        type: string
        source: system
        description: "FK -> Award.id; renewable award being verified, taken from the creation path."
      - name: academic_year_index
        type: integer
        source: input
        description: "Academic year being verified; 2..renewable_years_total of the award."
      - name: reported_enrollment
        type: enum
        source: input
        description: "Enrollment status reported by the institution."
        constraints: "FULL_TIME | HALF_TIME | NOT_ENROLLED"
      - name: reported_gpa
        type: number
        source: input
        description: "GPA reported by the institution; renewal requires >= RENEWAL_MIN_GPA (2.5)."
        constraints: "0.0..4.0 inclusive"
      - name: status
        type: enum
        source: system
        description: "Verification lifecycle; SUBMITTED by the college, decided by the program (segregation of duties)."
        default: SUBMITTED
        constraints: "SUBMITTED | APPROVED | REJECTED"
      - name: submitted_by_college_id
        type: string
        source: system
        description: "Acting CollegeAdmin's X-User-ID (informational; validated to equal Award.college_id at creation). Authoritative linkage is RenewalVerification.award_id -> Award.college_id."
      - name: decided_logical_at
        type: datetime
        source: system
        description: "Logical-clock instant of the program's decision; null until decided."

  - name: Notification
    parent: null
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: system
        description: "FK -> Student.id; recipient student."
      - name: cycle_id
        type: string
        source: system
        description: "Program cycle this notice belongs to (informational; authoritative cycle reachability is via Student -> Entry -> ProgramCycle)."
      - name: notice_type
        type: enum
        source: system
        description: "Which stage notice this is."
        constraints: "SEMIFINALIST_NOTICE | FINALIST_NOTICE | AWARD_OFFER | PUBLIC_ANNOUNCEMENT"
      - name: sequence_number
        type: integer
        source: computed
        description: "Per-student release order: SEMIFINALIST_NOTICE=1, FINALIST_NOTICE=2, AWARD_OFFER=3, PUBLIC_ANNOUNCEMENT=4."
      - name: embargo_until
        type: datetime
        source: system
        description: "Logical-clock instant before which release is forbidden; copied from the cycle's per-type embargo field at creation."
      - name: status
        type: enum
        source: system
        description: "EMBARGOED until manually released; SUPERSEDED when its subject is withdrawn (decline/expiry) before release."
        default: EMBARGOED
        constraints: "EMBARGOED | RELEASED | SUPERSEDED"
      - name: released_logical_at
        type: datetime
        source: system
        description: "Logical-clock instant of release; null until RELEASED."

concurrency_rules:
  - rule_id: agreement-amend-stale-version
    parent_entity: SponsorAgreement
    write_endpoint: "POST /api/sponsor-agreements/{id}/amend"
    occ_field: "expected_sponsor_agreement_version"
    description: |
      Amending a SponsorAgreement whose version has advanced since the client
      last observed it is rejected. This captures the case where another writer
      has just amended the agreement (which legitimately supersedes it under the
      sponsor's administration of its own awards) or a matching/pool cascade has
      mutated the agreement, so the current writer's view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: application-review-stale-version
    parent_entity: FinalistApplication
    write_endpoint: "POST /api/finalist-applications/{id}/review"
    occ_field: "expected_finalist_application_version"
    description: |
      Reviewing a FinalistApplication whose version has advanced since the
      reviewer last observed it is rejected. This captures the case where a
      school endorsement or a resubmission landed after the reviewer's read,
      so the review would otherwise rest on stale requirement state.
    error_id: ERR_STALE_VERSION
    http_status: 412

state_machines:
  - entity: ProgramCycle
    initial_state: SETUP
    terminal_states: [AWARDS_COMPLETED]
    note: "Posture-driven: the cycle's status gates every child workflow (entries, scoring, applications, matching). All transitions except the final bubble-up are explicit ProgramAdmin actions."
    transitions:
      - from: SETUP
        to: ENTRY_OPEN
        trigger: "POST /api/program-cycles/{id}/open-entries"
        actor: ProgramAdmin
        preconditions: ["cycle.status == SETUP"]
        side_effects: ["ProgramCycle.version += 1"]
      - from: ENTRY_OPEN
        to: ENTRY_CLOSED
        trigger: "POST /api/program-cycles/{id}/close-entries"
        actor: ProgramAdmin
        preconditions: ["cycle.status == ENTRY_OPEN"]
        side_effects:
          - "For each StateAllocation of this cycle: compute quota_raw and slots_provisional (provisional variant of state_slot_allocation) and set status PENDING -> PROVISIONAL."
          - "ProgramCycle.version += 1"
      - from: ENTRY_CLOSED
        to: SEMIFINALISTS_SELECTED
        trigger: "POST /api/program-cycles/{id}/run-semifinalist-selection"
        actor: ProgramAdmin
        preconditions:
          - "cycle.status == ENTRY_CLOSED"
          - "zero Entries of this cycle in status SUBMITTED (else ERR_UNSCORED_ENTRIES_REMAIN)"
        side_effects:
          - "Compute slots_final for every StateAllocation (final variant of state_slot_allocation); status PROVISIONAL -> FINAL."
          - "Run semifinalist_threshold_and_selection per state: entries flip SCORED -> SELECTED_SEMIFINALIST or SCORED -> NOT_SELECTED; threshold_selection_index and selected_count recomputed."
          - "For each student with a newly SELECTED_SEMIFINALIST entry: create a Notification (SEMIFINALIST_NOTICE, sequence 1, embargo_until = cycle.semifinalist_embargo_until, EMBARGOED)."
          - "ProgramCycle.version += 1"
      - from: SEMIFINALISTS_SELECTED
        to: FINALISTS_SELECTED
        trigger: "POST /api/program-cycles/{id}/publish-finalists"
        actor: ProgramAdmin
        preconditions:
          - "cycle.status == SEMIFINALISTS_SELECTED"
          - "zero FinalistApplications of entries in this cycle in status UNDER_REVIEW or RETURNED_FOR_CORRECTION (else ERR_PENDING_APPLICATIONS_REMAIN)"
        side_effects:
          - "Every FinalistApplication still IN_PROGRESS flips to DENIED (auto-deny at the deadline of the process)."
          - "For each FINALIST_CONFIRMED application: create a Notification (FINALIST_NOTICE, sequence 2, embargo_until = cycle.finalist_embargo_until, EMBARGOED)."
          - "ProgramCycle.version += 1"
      - from: FINALISTS_SELECTED
        to: FINALISTS_SELECTED
        trigger: "POST /api/program-cycles/{id}/run-award-matching"
        actor: ProgramAdmin
        preconditions:
          - "cycle.status == FINALISTS_SELECTED"
          - "cycle.matching_run == false (else ERR_MATCHING_ALREADY_RUN)"
        side_effects:
          - "Run award_matching_waterfall: create Awards (recipient_status OFFERED, funding_status PLEDGED) and debit sponsor/college pool_committed_cents per award."
          - "For each created Award: create Notification (AWARD_OFFER, sequence 3, embargo_until = cycle.award_embargo_until) and Notification (PUBLIC_ANNOUNCEMENT, sequence 4, embargo_until = cycle.public_embargo_until), both EMBARGOED."
          - "cycle.matching_run = true; ProgramCycle.version += 1"
        note: "Self-transition: posture unchanged; matching runs exactly once. Waitlist promotions after declines/expirations/lapses reuse the same selector outside this transition."
      - from: FINALISTS_SELECTED
        to: AWARDS_COMPLETED
        trigger: "system (bubble-up): evaluated after every Award recipient_status change, every Disbursement status change, and every clock sweep"
        actor: system
        preconditions:
          - "cycle.matching_run == true"
          - "zero Awards of this cycle with recipient_status IN {OFFERED, ACCEPTED, ENROLLED, RENEWED}"
          - "zero Disbursements of this cycle's awards in status SCHEDULED or HELD"
        side_effects:
          - "Every SponsorAgreement with cycle_id == this cycle and status IN {ACTIVE, EXHAUSTED} flips to CLOSED."
          - "ProgramCycle.version += 1"

  - entity: StateAllocation
    initial_state: PENDING
    terminal_states: [FINAL]
    transitions:
      - from: PENDING
        to: PROVISIONAL
        trigger: "POST /api/program-cycles/{id}/close-entries (parent cascade)"
        actor: system
        preconditions: ["parent cycle transition ENTRY_OPEN -> ENTRY_CLOSED fires"]
        side_effects: ["slots_provisional := round_half_up(quota_raw)", "StateAllocation.version += 1"]
      - from: PROVISIONAL
        to: FINAL
        trigger: "POST /api/program-cycles/{id}/run-semifinalist-selection (parent cascade)"
        actor: system
        preconditions: ["parent cycle transition ENTRY_CLOSED -> SEMIFINALISTS_SELECTED fires"]
        side_effects:
          - "slots_final := largest-remainder apportionment with MIN_STATE_SLOTS guarantee"
          - "threshold_selection_index and selected_count computed by semifinalist_threshold_and_selection"
          - "StateAllocation.version += 1"

  - entity: Entry
    initial_state: SUBMITTED
    terminal_states: [NOT_SELECTED, SELECTED_SEMIFINALIST]
    note: "Branching fork at SCORED with divergent side-effect sets (selected branch spawns a notification; the other does not). SELECTED_SEMIFINALIST is terminal for the entry itself; advancement lives on FinalistApplication."
    transitions:
      - from: SUBMITTED
        to: SCORED
        trigger: "POST /api/entries/{id}/score"
        actor: ProgramAdmin
        preconditions:
          - "entry.status == SUBMITTED"
          - "entry.cycle.status == ENTRY_CLOSED (else ERR_CYCLE_NOT_CLOSED_FOR_SCORING)"
        side_effects:
          - "reading_score, writing_score, math_score stored; selection_index computed; scored_at := logical clock; Entry.version += 1"
      - from: SCORED
        to: SELECTED_SEMIFINALIST
        trigger: "POST /api/program-cycles/{id}/run-semifinalist-selection (parent cascade)"
        actor: system
        preconditions: ["entry.selection_index >= threshold_selection_index of the student's state allocation"]
        side_effects: ["StateAllocation.selected_count += 1", "Entry.version += 1"]
      - from: SCORED
        to: NOT_SELECTED
        trigger: "POST /api/program-cycles/{id}/run-semifinalist-selection (parent cascade)"
        actor: system
        preconditions: ["entry.selection_index < threshold_selection_index of the student's state allocation"]
        side_effects: ["Entry.version += 1"]

  - entity: FinalistApplication
    initial_state: IN_PROGRESS
    terminal_states: [DENIED, FINALIST_CONFIRMED]
    note: "Cyclic machine: UNDER_REVIEW -> RETURNED_FOR_CORRECTION -> UNDER_REVIEW may repeat without bound while the cycle stays SEMIFINALISTS_SELECTED."
    transitions:
      - from: IN_PROGRESS
        to: UNDER_REVIEW
        trigger: "POST /api/finalist-applications/{id}/submit"
        actor: Student
        preconditions:
          - "application.status == IN_PROGRESS"
          - "X-User-ID == application.student_id (else ERR_FORBIDDEN_OWNERSHIP)"
          - "cycle.status == SEMIFINALISTS_SELECTED (else ERR_CYCLE_POSTURE_INVALID)"
          - "logical clock <= cycle.application_deadline (else ERR_APPLICATION_WINDOW_CLOSED)"
          - "endorsement_status == ENDORSED (else ERR_APPLICATION_INCOMPLETE)"
          - "confirming_selection_index >= cycle.confirming_floor (else ERR_CONFIRMING_SCORE_BELOW_FLOOR)"
        side_effects: ["submitted_at := logical clock", "return_reason := null", "FinalistApplication.version += 1"]
      - from: RETURNED_FOR_CORRECTION
        to: UNDER_REVIEW
        trigger: "POST /api/finalist-applications/{id}/submit"
        actor: Student
        preconditions:
          - "application.status == RETURNED_FOR_CORRECTION"
          - "X-User-ID == application.student_id (else ERR_FORBIDDEN_OWNERSHIP)"
          - "cycle.status == SEMIFINALISTS_SELECTED (else ERR_CYCLE_POSTURE_INVALID)"
          - "logical clock <= cycle.application_deadline (else ERR_APPLICATION_WINDOW_CLOSED)"
          - "endorsement_status == ENDORSED (else ERR_APPLICATION_INCOMPLETE)"
          - "confirming_selection_index >= cycle.confirming_floor (else ERR_CONFIRMING_SCORE_BELOW_FLOOR)"
        side_effects: ["submitted_at := logical clock", "return_reason := null", "FinalistApplication.version += 1"]
        note: "The resubmission edge closing the correction cycle."
      - from: IN_PROGRESS
        to: IN_PROGRESS
        trigger: "POST /api/finalist-applications/{id}/endorse"
        actor: SchoolOfficial
        preconditions:
          - "application.status == IN_PROGRESS (else ERR_INVALID_STATE)"
          - "X-User-ID == student.school_id (else ERR_ENDORSEMENT_SCHOOL_MISMATCH)"
        side_effects: ["endorsement_status := ENDORSED", "endorsed_by_school_id := X-User-ID", "FinalistApplication.version += 1"]
        note: "Self-transition on the status axis; only the endorsement component mutates. Idempotency: endorsing an ENDORSED application returns ERR_INVALID_STATE because endorsement_status is already ENDORSED and status left IN_PROGRESS only once submitted — the preconditions pin endorsement to IN_PROGRESS."
      - from: UNDER_REVIEW
        to: FINALIST_CONFIRMED
        trigger: "POST /api/finalist-applications/{id}/review with decision=CONFIRM"
        actor: ProgramAdmin
        preconditions:
          - "application.status == UNDER_REVIEW (else ERR_INVALID_STATE)"
          - "expected_finalist_application_version == application.version (else ERR_STALE_VERSION)"
          - "endorsement_status == ENDORSED (else ERR_APPLICATION_INCOMPLETE)"
          - "confirming_selection_index >= cycle.confirming_floor (else ERR_CONFIRMING_SCORE_BELOW_FLOOR)"
          - "cycle.status == SEMIFINALISTS_SELECTED (else ERR_CYCLE_POSTURE_INVALID)"
        side_effects: ["FinalistApplication.version += 1"]
      - from: UNDER_REVIEW
        to: RETURNED_FOR_CORRECTION
        trigger: "POST /api/finalist-applications/{id}/review with decision=RETURN"
        actor: ProgramAdmin
        preconditions:
          - "application.status == UNDER_REVIEW (else ERR_INVALID_STATE)"
          - "expected_finalist_application_version == application.version (else ERR_STALE_VERSION)"
          - "return_reason payload field is non-empty (else ERR_INVALID_REQUEST)"
        side_effects: ["return_reason := payload value", "FinalistApplication.version += 1"]
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /api/finalist-applications/{id}/review with decision=DENY"
        actor: ProgramAdmin
        preconditions:
          - "application.status == UNDER_REVIEW (else ERR_INVALID_STATE)"
          - "expected_finalist_application_version == application.version (else ERR_STALE_VERSION)"
        side_effects: ["FinalistApplication.version += 1"]
      - from: IN_PROGRESS
        to: DENIED
        trigger: "POST /api/program-cycles/{id}/publish-finalists (parent cascade)"
        actor: system
        preconditions: ["parent cycle transition SEMIFINALISTS_SELECTED -> FINALISTS_SELECTED fires"]
        side_effects: ["FinalistApplication.version += 1"]
      - from: RETURNED_FOR_CORRECTION
        to: DENIED
        trigger: "POST /api/program-cycles/{id}/publish-finalists (parent cascade)"
        actor: system
        preconditions: ["none — publish-finalists refuses to fire while RETURNED_FOR_CORRECTION applications exist, so this edge is unreachable; kept for documentation of the cascade policy"]
        side_effects: []
        note: "Unreachable by construction (ERR_PENDING_APPLICATIONS_REMAIN gates publish); declared so the DENIED-from-RETURNED policy is explicit."

  - entity: SponsorAgreement
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED, CLOSED]
    note: "ACTIVE <-> EXHAUSTED is an automatic pool-driven loop; SUPERSEDED comes from amend; CLOSED from cycle completion."
    transitions:
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system (pool cascade): after any Award creation or pool release touching this agreement"
        actor: system
        preconditions: ["pool_available_reserved_cents < award_amount_cents OR granted award count == max_awards"]
        side_effects: ["SponsorAgreement.version += 1"]
      - from: EXHAUSTED
        to: ACTIVE
        trigger: "system (pool cascade): after a decline/expiry/lapse release raises pool_available_reserved_cents"
        actor: system
        preconditions: ["pool_available_reserved_cents >= award_amount_cents AND granted award count < max_awards"]
        side_effects: ["SponsorAgreement.version += 1", "triggers waitlist promotion for this agreement's candidate pool"]
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /api/sponsor-agreements/{id}/amend"
        actor: SponsorAdmin
        preconditions:
          - "agreement.status IN {ACTIVE, EXHAUSTED} (else ERR_INVALID_STATE)"
          - "X-User-ID == agreement.sponsor_id (else ERR_FORBIDDEN_OWNERSHIP)"
          - "expected_sponsor_agreement_version == agreement.version (else ERR_STALE_VERSION)"
        side_effects:
          - "A new SponsorAgreement is created (status ACTIVE, supersedes_agreement_id := this id) with the amended fields; unchanged fields copied."
          - "The new agreement's pool_committed_cents and pool_paid_cents start at 0; obligations on the old agreement stay on the old agreement."
          - "SponsorAgreement.version += 1 (on the superseded row)"
      - from: EXHAUSTED
        to: SUPERSEDED
        trigger: "POST /api/sponsor-agreements/{id}/amend"
        actor: SponsorAdmin
        preconditions:
          - "agreement.status IN {ACTIVE, EXHAUSTED} (else ERR_INVALID_STATE)"
          - "X-User-ID == agreement.sponsor_id (else ERR_FORBIDDEN_OWNERSHIP)"
          - "expected_sponsor_agreement_version == agreement.version (else ERR_STALE_VERSION)"
        side_effects:
          - "Same supersede side effects as ACTIVE -> SUPERSEDED."
      - from: ACTIVE
        to: CLOSED
        trigger: "system (bubble-up): parent cycle reaches AWARDS_COMPLETED"
        actor: system
        preconditions: ["cycle.status becomes AWARDS_COMPLETED"]
        side_effects: ["SponsorAgreement.version += 1"]
      - from: EXHAUSTED
        to: CLOSED
        trigger: "system (bubble-up): parent cycle reaches AWARDS_COMPLETED"
        actor: system
        preconditions: ["cycle.status becomes AWARDS_COMPLETED"]
        side_effects: ["SponsorAgreement.version += 1"]

  - entity: CollegeInstitution
    initial_state: ACTIVE
    terminal_states: []
    note: "ACTIVE <-> EXHAUSTED automatic pool-driven loop; institutions are not closed when a cycle completes (their pools span cycles)."
    transitions:
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system (pool cascade): after any Award creation or pool release touching this institution"
        actor: system
        preconditions: ["pool_available_reserved_cents < award_amount_cents * renewable_years_total OR funded award count == max_awards"]
        side_effects: ["CollegeInstitution.version += 1"]
      - from: EXHAUSTED
        to: ACTIVE
        trigger: "system (pool cascade): after a decline/expiry/lapse release raises pool_available_reserved_cents"
        actor: system
        preconditions: ["pool_available_reserved_cents >= award_amount_cents * renewable_years_total AND funded award count < max_awards"]
        side_effects: ["CollegeInstitution.version += 1", "triggers waitlist promotion for this institution's first-choice candidate pool"]

  - entity: Award
    initial_state: "recipient_status=OFFERED, funding_status=PLEDGED"
    terminal_states: ["recipient_status IN {COMPLETED, DECLINED, EXPIRED, LAPSED}; funding_status IN {FULLY_DISBURSED, RELEASED_BACK}"]
    note: "Parallel state dimensions on one row: recipient_status and funding_status evolve independently (e.g. recipient RENEWED coexists with funding PARTIALLY_DISBURSED). Creation is via award_matching_waterfall or waitlist promotion, not a direct POST."
    transitions:
      - from: "recipient_status=OFFERED"
        to: "recipient_status=ACCEPTED"
        trigger: "POST /api/awards/{id}/accept"
        actor: Student
        preconditions:
          - "award.recipient_status == OFFERED (else ERR_AWARD_NOT_OFFERED)"
          - "X-User-ID == award.student_id (else ERR_FORBIDDEN_OWNERSHIP)"
          - "logical clock <= award.acceptance_deadline (an expired offer has already been swept to EXPIRED by the clock advance, so the state gate fires first)"
        side_effects:
          - "funding_status PLEDGED -> COMMITTED"
          - "Generate the Disbursement schedule per disbursement_schedule calculation (year-1 terms SCHEDULED, year >= 2 terms HELD)."
          - "Award.version += 1"
      - from: "recipient_status=OFFERED"
        to: "recipient_status=DECLINED"
        trigger: "POST /api/awards/{id}/decline"
        actor: Student
        preconditions:
          - "award.recipient_status == OFFERED (else ERR_AWARD_NOT_OFFERED)"
          - "X-User-ID == award.student_id (else ERR_FORBIDDEN_OWNERSHIP)"
        side_effects:
          - "funding_status PLEDGED -> RELEASED_BACK"
          - "Cascade link 1: funding pool (SponsorAgreement for CORPORATE_SPONSORED, CollegeInstitution for COLLEGE_SPONSORED) pool_committed_cents -= amount_cents; for NATIONAL_SINGLE the cycle's live national count (awards in OFFERED/ACCEPTED/ENROLLED/RENEWED) decreases by 1."
          - "Cascade link 2: the release re-evaluates the freed pool's capacity — a SponsorAgreement or CollegeInstitution flips EXHAUSTED -> ACTIVE when capacity returns; for the national bucket, capacity returns when the live count drops below national_award_slots."
          - "Cascade link 3: returned capacity runs waitlist_promotion for that pool (agreement, institution, or national bucket), creating a new OFFERED Award for the next eligible finalist (if any)."
          - "Cascade link 4: a promoted award queues its own AWARD_OFFER and PUBLIC_ANNOUNCEMENT notifications (EMBARGOED)."
          - "This award's unreleased AWARD_OFFER and PUBLIC_ANNOUNCEMENT notifications flip EMBARGOED -> SUPERSEDED."
          - "Award.version += 1"
      - from: "recipient_status=OFFERED"
        to: "recipient_status=EXPIRED"
        trigger: "POST /api/_clock/set_current_utc (system sweep on clock advance)"
        actor: system
        preconditions: ["logical clock advanced past award.acceptance_deadline while recipient_status == OFFERED"]
        side_effects:
          - "funding_status PLEDGED -> RELEASED_BACK and the same four cascade links as DECLINED (pool release -> status re-evaluation -> waitlist promotion -> notifications; unreleased notifications SUPERSEDED)."
          - "Award.version += 1"
      - from: "recipient_status=ACCEPTED"
        to: "recipient_status=ENROLLED"
        trigger: "system: first Disbursement of this award reaches RELEASED"
        actor: system
        preconditions: ["a disbursement release on this award succeeds"]
        side_effects: ["Award.version += 1"]
      - from: "recipient_status=ENROLLED"
        to: "recipient_status=RENEWED"
        trigger: "POST /api/renewal-verifications/{id}/decision with decision=APPROVE (cascade)"
        actor: system
        preconditions: ["renewal verification for the next academic year is APPROVED"]
        side_effects:
          - "years_renewed += 1"
          - "That year's HELD Disbursements flip HELD -> SCHEDULED."
          - "Award.version += 1"
      - from: "recipient_status=RENEWED"
        to: "recipient_status=RENEWED"
        trigger: "POST /api/renewal-verifications/{id}/decision with decision=APPROVE (cascade, later years)"
        actor: system
        preconditions: ["renewal verification for the next academic year is APPROVED"]
        side_effects: ["years_renewed += 1", "that year's HELD Disbursements flip HELD -> SCHEDULED", "Award.version += 1"]
      - from: "recipient_status IN {ENROLLED, RENEWED}"
        to: "recipient_status=LAPSED"
        trigger: "POST /api/renewal-verifications/{id}/decision with decision=REJECT (cascade)"
        actor: system
        preconditions: ["renewal verification is REJECTED"]
        side_effects:
          - "Cascade link 1: award lapses; all remaining SCHEDULED/HELD Disbursements flip to CANCELLED."
          - "Cascade link 2: the funding pool's pool_committed_cents decreases by the outstanding (non-RELEASED, non-CANCELLED) amount."
          - "Cascade link 3: the pool release re-evaluates pool status (EXHAUSTED -> ACTIVE when capacity returns)."
          - "Cascade link 4: an EXHAUSTED -> ACTIVE flip runs waitlist_promotion, creating a new OFFERED Award and queueing its notifications."
          - "funding_status -> RELEASED_BACK; Award.version += 1"
      - from: "recipient_status IN {ACCEPTED, ENROLLED, RENEWED}"
        to: "recipient_status=COMPLETED"
        trigger: "system: final Disbursement of this award reaches RELEASED (funding_status becomes FULLY_DISBURSED)"
        actor: system
        preconditions: ["funding_status == FULLY_DISBURSED"]
        side_effects: ["Award.version += 1", "may bubble the cycle to AWARDS_COMPLETED"]
      - from: "funding_status=COMMITTED"
        to: "funding_status=PARTIALLY_DISBURSED"
        trigger: "POST /api/disbursements/{id}/release (cascade)"
        actor: system
        preconditions: ["a release succeeds and released terms < terms_total"]
        side_effects: ["Award.version += 1"]
      - from: "funding_status=PARTIALLY_DISBURSED"
        to: "funding_status=FULLY_DISBURSED"
        trigger: "POST /api/disbursements/{id}/release (cascade)"
        actor: system
        preconditions: ["the last non-CANCELLED term is RELEASED"]
        side_effects: ["Award.version += 1", "recipient_status -> COMPLETED"]
      - from: "funding_status IN {PLEDGED, COMMITTED, PARTIALLY_DISBURSED}"
        to: "funding_status=RELEASED_BACK"
        trigger: "system: decline / expiry sweep / lapse"
        actor: system
        preconditions: ["recipient_status transitioned to DECLINED, EXPIRED, or LAPSED"]
        side_effects: ["pool_committed_cents of the funding pool reduced accordingly", "Award.version += 1"]

  - entity: Disbursement
    initial_state: "SCHEDULED (academic_year_index == 1) or HELD (academic_year_index >= 2)"
    terminal_states: [RELEASED, CANCELLED]
    transitions:
      - from: HELD
        to: SCHEDULED
        trigger: "system: renewal verification for this disbursement's academic_year_index is APPROVED"
        actor: system
        preconditions: ["RenewalVerification(award_id, academic_year_index) status becomes APPROVED"]
        side_effects: ["Disbursement.version += 1"]
      - from: SCHEDULED
        to: RELEASED
        trigger: "POST /api/disbursements/{id}/release"
        actor: ProgramAdmin
        preconditions:
          - "disbursement.status == SCHEDULED (HELD yields ERR_DISBURSEMENT_HELD; terminal states yield ERR_INVALID_STATE)"
          - "logical clock >= disbursement.scheduled_date (else ERR_DISBURSEMENT_NOT_DUE)"
          - "award.recipient_status IN {ACCEPTED, ENROLLED, RENEWED} (else ERR_INVALID_STATE)"
        side_effects:
          - "released_logical_at := logical clock; funding pool: pool_committed_cents -= amount_cents, pool_paid_cents += amount_cents"
          - "Award funding_status re-evaluated (COMMITTED -> PARTIALLY_DISBURSED -> FULLY_DISBURSED); first release flips recipient ACCEPTED -> ENROLLED"
          - "Disbursement.version += 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system: award lapses (renewal REJECTED)"
        actor: system
        preconditions: ["award.recipient_status becomes LAPSED"]
        side_effects: ["Disbursement.version += 1"]
      - from: HELD
        to: CANCELLED
        trigger: "system: award lapses (renewal REJECTED)"
        actor: system
        preconditions: ["award.recipient_status becomes LAPSED"]
        side_effects: ["Disbursement.version += 1"]

  - entity: RenewalVerification
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED]
    note: "Segregation of duties: the CollegeAdmin submits, the ProgramAdmin decides; neither can perform the other's step."
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /api/renewal-verifications/{id}/decision with decision=APPROVE"
        actor: ProgramAdmin
        preconditions:
          - "verification.status == SUBMITTED (else ERR_INVALID_STATE)"
          - "reported_enrollment == FULL_TIME AND reported_gpa >= 2.5 (else ERR_RENEWAL_CRITERIA_UNMET)"
        side_effects:
          - "Award cascade: recipient_status ENROLLED -> RENEWED (or stays RENEWED), years_renewed += 1, that year's HELD disbursements -> SCHEDULED"
          - "RenewalVerification.version += 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /api/renewal-verifications/{id}/decision with decision=REJECT"
        actor: ProgramAdmin
        preconditions: ["verification.status == SUBMITTED (else ERR_INVALID_STATE)"]
        side_effects:
          - "Award lapse cascade (see Award LAPSED transition: disbursements CANCELLED, pool release, status re-evaluation, waitlist promotion, notifications)"
          - "RenewalVerification.version += 1"

  - entity: Notification
    initial_state: EMBARGOED
    terminal_states: [RELEASED, SUPERSEDED]
    note: "Release is manual-only (POST .../release); the clock never auto-releases. Sequencing, embargo, and publicity-gap rules are pinned in validations priorities 6-8."
    transitions:
      - from: EMBARGOED
        to: RELEASED
        trigger: "POST /api/notifications/{id}/release"
        actor: ProgramAdmin
        preconditions:
          - "notification.status == EMBARGOED (else ERR_INVALID_STATE)"
          - "every Notification of the same student with a lower sequence_number is RELEASED (else ERR_NOTIFICATION_SEQUENCE_VIOLATION)"
          - "logical clock >= embargo_until (else ERR_NOTIFICATION_EMBARGOED)"
          - "if notice_type == PUBLIC_ANNOUNCEMENT: logical clock >= max(released_logical_at over the cycle's RELEASED AWARD_OFFER notifications) + PUBLICITY_GAP_DAYS (2) (else ERR_PUBLICITY_WINDOW_TOO_EARLY)"
        side_effects: ["released_logical_at := logical clock", "Notification.version += 1"]
      - from: EMBARGOED
        to: SUPERSEDED
        trigger: "system: the underlying award is DECLINED or swept EXPIRED before release"
        actor: system
        preconditions: ["notification.notice_type IN {AWARD_OFFER, PUBLIC_ANNOUNCEMENT} AND its award's recipient_status became DECLINED or EXPIRED"]
        side_effects: ["Notification.version += 1"]

calculations:
  - name: selection_index
    trigger: "POST /api/entries/{id}/score (Entry SUBMITTED -> SCORED)"
    algorithm: weighted_scoring
    formula: |
      selection_index = (reading_score + writing_score + math_score) * SECTION_WEIGHT
      where SECTION_WEIGHT = 2 and each section score is an integer in [SECTION_MIN, SECTION_MAX].
      Client-supplied selection_index values are ignored; the server always recomputes.
    input_set: "the three section scores of the Entry being scored"
    constants:
      SECTION_WEIGHT: 2
      SECTION_MIN: 8
      SECTION_MAX: 38
    precision: "integer arithmetic, exact; range 48..228"

  - name: state_slot_allocation
    trigger: "close-entries (provisional variant) and run-semifinalist-selection (final variant)"
    algorithm: apportionment
    formula: |
      Let S = set of StateAllocations of the cycle, P_s = graduating_population, T = total_semifinalist_slots,
      POP = sum(P_s over S).
      quota_s = T * P_s / POP   (exact rational; stored as quota_raw, 4 decimal places, round_half_up)
      PROVISIONAL variant:  slots_provisional_s = round_half_up(quota_s).  Sum over states MAY differ from T.
      FINAL variant (largest remainder with minimum guarantee):
        base_s = if P_s > 0 then max(MIN_STATE_SLOTS, floor(quota_s)) else 0
        R = T - sum(base_s)   (R >= 0 whenever sum of guarantees <= T; cycle creation enforces T >= count(states with P_s > 0))
        Distribute R extra seats one at a time, each seat to the state with the largest
        fractional remainder (quota_s - floor(quota_s)); tie-break: larger P_s first, then state_code ASC.
        slots_final_s = base_s + extra_s.  Sum over states == T exactly.
    input_set: "all StateAllocation rows of the cycle (every declared state, regardless of entry counts)"
    constants:
      MIN_STATE_SLOTS: 1
    precision: "quota_raw to 4 decimal places round_half_up; slot integers exact"
    variants:
      - name: provisional
        when: "computed at close-entries (ENTRY_OPEN -> ENTRY_CLOSED); drives no selection decisions"
        difference: "per-state round_half_up(quota) with no reconciliation; the sum may exceed or fall short of total_semifinalist_slots"
      - name: final
        when: "computed at run-semifinalist-selection (ENTRY_CLOSED -> SEMIFINALISTS_SELECTED); the only allocation that selects students"
        difference: "largest-remainder apportionment with MIN_STATE_SLOTS=1 guarantee; sums to exactly total_semifinalist_slots; individual states may receive fewer slots than the provisional figure"

  - name: semifinalist_threshold_and_selection
    trigger: "run-semifinalist-selection, per state, after slots_final is fixed"
    algorithm: threshold
    formula: |
      Candidates = Entries of the cycle in status SCORED whose student's state_code == state.
      Rank candidates by: selection_index DESC, then math_score DESC, then reading_score DESC,
      then created_at ASC (never id).
      n = count(candidates); k = min(slots_final, n).
      If n == 0: threshold_selection_index = null, none selected.
      Else: threshold_selection_index = selection_index of the k-th ranked candidate.
      Every candidate with selection_index >= threshold_selection_index flips to SELECTED_SEMIFINALIST
      (boundary is INCLUSIVE: >=, so a tie at the threshold selects more than slots_final candidates);
      all others flip to NOT_SELECTED.  selected_count = count of SELECTED_SEMIFINALIST in the state.
    input_set: "SCORED entries only; SUBMITTED entries block the run (ERR_UNSCORED_ENTRIES_REMAIN); NOT_SELECTED/SELECTED entries from a prior run are impossible (single-run posture gate)"
    constants: {}
    precision: "integer comparison; the >= boundary is part of the spec"

  - name: sponsor_pool_availability
    trigger: "recomputed on every mutation of the pool's awards or disbursements (offer, accept, decline, expiry, lapse, release)"
    algorithm: aggregation
    formula: |
      committed = sum over Awards funded by this pool with recipient_status IN {OFFERED, ACCEPTED, ENROLLED, RENEWED}
                  of (amount_cents - sum of that award's RELEASED disbursement amounts)
      paid      = sum of RELEASED disbursement amounts funded by this pool
      available_reserved = pool_total_cents - committed - paid
      available_cash     = pool_total_cents - paid
      Matching and promotion gates use available_reserved ONLY.  available_cash is reported
      for reconciliation and MUST NOT gate anything.
    input_set: "Awards of this pool (SponsorAgreement: agreement_id; CollegeInstitution: college_id) in the listed recipient states, and their Disbursements in status RELEASED"
    constants: {}
    precision: "integer cents, exact"
    variants:
      - name: reservation
        when: "official gate: matching capacity, EXHAUSTED/ACTIVE evaluation, promotion capacity"
        difference: "subtracts outstanding OFFERED-but-unpaid commitments; stricter while offers are outstanding"
      - name: cash
        when: "reporting/reconciliation field pool_available_cash_cents only"
        difference: "subtracts only RELEASED disbursements; equals reservation variant only when no offer/commitment is outstanding"

  - name: award_matching_waterfall
    trigger: "POST /api/program-cycles/{id}/run-award-matching (once per cycle) and, per-pool only, by waitlist_promotion"
    algorithm: waterfall_allocation
    formula: |
      Candidates = FinalistApplications of this cycle in status FINALIST_CONFIRMED
                   with no existing Award (one award per finalist per cycle, hard rule).
      Bucket order is fixed: (1) NATIONAL_SINGLE, (2) CORPORATE_SPONSORED per ACTIVE SponsorAgreement
      of this cycle ordered by agreement created_at ASC, (3) COLLEGE_SPONSORED per ACTIVE
      CollegeInstitution ordered by college created_at ASC.
      Within every bucket the selector ranks candidates by: selection_index_snapshot DESC
      (entry selection_index), then confirming_selection_index DESC, then submitted_at ASC; never id.
      (1) National: grant to the top cycle.national_award_slots candidates; amount =
          cycle.national_award_amount_cents, terms_total 1, renewable_years_total 1.
      (2) Corporate per agreement: eligible iff (not employee_children_only OR
          student.parent_sponsor_id == agreement.sponsor_id) AND (min_selection_index is null OR
          entry selection_index >= min_selection_index). Grant up to
          min(max_awards - granted, floor(pool_available_reserved_cents / award_amount_cents)) candidates.
      (3) College per institution: eligible iff application.first_choice_college_id == college.id.
          Grant up to min(max_awards - granted,
          floor(pool_available_reserved_cents / (award_amount_cents * renewable_years_total))) candidates;
          each award's amount_cents = award_amount_cents * renewable_years_total,
          terms_total = renewable_years_total * terms_per_year.
      A candidate granted in an earlier bucket is removed from later buckets in the same run.
      Each grant debits the pool: pool_committed_cents += amount_cents (reservation at OFFER time).
      Empty candidate set in a bucket: skip silently (no error).
    input_set: "FINALIST_CONFIRMED applications of the cycle; ACTIVE SponsorAgreements with cycle_id == cycle; ACTIVE CollegeInstitutions"
    constants: {}
    precision: "integer cents; floor division for capacity"

  - name: disbursement_schedule
    trigger: "POST /api/awards/{id}/accept (recipient OFFERED -> ACCEPTED)"
    algorithm: per_term_split
    formula: |
      terms_total = award.terms_total.  T0 = logical-clock date at acceptance.
      For term i in 1..terms_total:
        scheduled_date_i = T0 + (i - 1) * TERM_INTERVAL_DAYS days
        amount_i = round_half_up(award.amount_cents / terms_total)   for i < terms_total
        amount_{terms_total} = award.amount_cents - sum(amount_1..amount_{terms_total-1})
      PINNED ROUNDING ORDER: round each non-final term first, then the final term absorbs the
      remainder; never round every term (sum would drift from amount_cents) and never sum-then-split.
      Status at creation: academic_year_index == 1 -> SCHEDULED; >= 2 -> HELD.
      academic_year_index_i = ceil(i / terms_per_year) where terms_per_year comes from the college
      config (1 for single-payment awards, so all their terms are year 1 and SCHEDULED).
    input_set: "the accepted Award and its funding configuration (agreement or college)"
    constants:
      TERM_INTERVAL_DAYS: 180
    precision: "integer cents; round_half_up on non-final terms only"

  - name: waitlist_promotion
    trigger: "system: a pool's EXHAUSTED -> ACTIVE flip caused by a decline, expiry sweep, or lapse release"
    algorithm: selector
    formula: |
      Runs per freed pool (one SponsorAgreement, one CollegeInstitution, or the cycle's national slot count).
      Eligibility filter: FinalistApplications of the cycle in status FINALIST_CONFIRMED with no existing
      Award, satisfying the pool's own criteria (national: none; corporate: the agreement's
      employee_children_only/min_selection_index; college: first_choice_college_id == college.id).
      Ranking: selection_index_snapshot DESC, then confirming_selection_index DESC, then submitted_at ASC
      (never id).  Grant exactly ONE award to the top-ranked candidate if capacity allows
      (national: freed slot count; corporate/college: floor(available_reserved / unit) >= 1),
      then re-evaluate pool status; repeat while capacity and candidates remain.
      Empty candidate set: no-op, pool stays ACTIVE.  A promotion creates the Award
      (OFFERED/PLEDGED, offered_logical_at := logical clock) and queues AWARD_OFFER +
      PUBLIC_ANNOUNCEMENT notifications with the cycle's embargo values.
    input_set: "FINALIST_CONFIRMED un-awarded applications of the cycle; the freed pool"
    constants:
      ACCEPTANCE_WINDOW_DAYS: 30
      PUBLICITY_GAP_DAYS: 2
    precision: "integer cents; single-award grant per iteration"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and names a declared role, and X-User-ID header present; missing/unknown -> reject before anything else, even when the path id does not exist."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "The declared role is listed in the endpoint's roles (RBAC matrix)."
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "Entity-backed ownership: Student may act only on own resources (X-User-ID == resource.student_id); SponsorAdmin only on own sponsor's agreements (X-User-ID == agreement.sponsor_id or path sponsor id); CollegeAdmin only on own college's awards (X-User-ID == award.college_id; when award.college_id is null — national or corporate awards — any CollegeAdmin passes this check and hits the renewable state gate instead)."
    error_id: ERR_FORBIDDEN_OWNERSHIP
    http_status: 403
    applies_to: "POST /api/entries, POST /api/finalist-applications, POST /api/finalist-applications/{id}/submit, POST /api/awards/{id}/accept, POST /api/awards/{id}/decline, POST /api/corporate-sponsors/{id}/agreements, POST /api/sponsor-agreements/{id}/amend, POST /api/awards/{id}/renewal-verifications"
  - priority: 3
    category: auth
    check: "School endorsement ownership: SchoolOfficial may endorse only applications whose student.school_id == X-User-ID."
    error_id: ERR_ENDORSEMENT_SCHOOL_MISMATCH
    http_status: 403
    applies_to: "POST /api/finalist-applications/{id}/endorse"
  - priority: 4
    category: existence
    check: "Path ids resolve left-to-right (cycle, school, student, entry, application, sponsor, agreement, college, award, disbursement, renewal, notification); a missing id -> 404 before any state or business check."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: existence
    check: "Body-referenced ids must exist (student_id, cycle_id, entry_id, school_id, first_choice_college_id, parent_sponsor_id); a missing referenced id -> 400, not 404."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST /api/students, POST /api/entries, POST /api/finalist-applications, POST /api/corporate-sponsors/{id}/agreements"
  - priority: 5
    category: state
    check: "OCC: expected_sponsor_agreement_version == agreement.version on amend; expected_finalist_application_version == application.version on review."
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /api/sponsor-agreements/{id}/amend, POST /api/finalist-applications/{id}/review"
  - priority: 6
    category: state
    check: "Cycle posture gates: entries only in ENTRY_OPEN; scoring only in ENTRY_CLOSED; application create/submit/review only in SEMIFINALISTS_SELECTED; publish only in SEMIFINALISTS_SELECTED; matching only in FINALISTS_SELECTED with matching_run == false."
    error_id: ERR_CYCLE_NOT_ACCEPTING_ENTRIES
    http_status: 409
    applies_to: "POST /api/entries (posture != ENTRY_OPEN)"
  - priority: 6
    category: state
    check: "Scoring posture gate."
    error_id: ERR_CYCLE_NOT_CLOSED_FOR_SCORING
    http_status: 409
    applies_to: "POST /api/entries/{id}/score (posture != ENTRY_CLOSED)"
  - priority: 6
    category: state
    check: "All other cycle posture gates (application create/submit/review, publish-finalists, run-award-matching in a wrong posture)."
    error_id: ERR_CYCLE_POSTURE_INVALID
    http_status: 409
    applies_to: "POST /api/finalist-applications, POST /api/finalist-applications/{id}/submit, POST /api/finalist-applications/{id}/review, POST /api/program-cycles/{id}/publish-finalists, POST /api/program-cycles/{id}/run-award-matching"
  - priority: 6
    category: state
    check: "Selection run requires zero SUBMITTED entries in the cycle."
    error_id: ERR_UNSCORED_ENTRIES_REMAIN
    http_status: 409
    applies_to: "POST /api/program-cycles/{id}/run-semifinalist-selection"
  - priority: 6
    category: state
    check: "Publish-finalists requires zero applications in UNDER_REVIEW or RETURNED_FOR_CORRECTION."
    error_id: ERR_PENDING_APPLICATIONS_REMAIN
    http_status: 409
    applies_to: "POST /api/program-cycles/{id}/publish-finalists"
  - priority: 6
    category: state
    check: "Matching runs at most once per cycle."
    error_id: ERR_MATCHING_ALREADY_RUN
    http_status: 409
    applies_to: "POST /api/program-cycles/{id}/run-award-matching"
  - priority: 6
    category: state
    check: "Entity state preconditions: score only SUBMITTED entries; endorse only IN_PROGRESS applications; submit only IN_PROGRESS/RETURNED_FOR_CORRECTION; review only UNDER_REVIEW; accept/decline only OFFERED awards; release only non-terminal disbursements (HELD gets its own error); renewal create only on ENROLLED/RENEWED renewable awards; notification release only EMBARGOED."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /api/entries/{id}/score, POST /api/finalist-applications/{id}/endorse, POST /api/finalist-applications/{id}/submit, POST /api/finalist-applications/{id}/review, POST /api/renewal-verifications/{id}/decision, POST /api/notifications/{id}/release, POST /api/disbursements/{id}/release, POST /api/program-cycles/{id}/open-entries, POST /api/program-cycles/{id}/close-entries"
  - priority: 6
    category: state
    check: "Accept/decline an award whose recipient_status != OFFERED (covers already-accepted, already-declined, expired-swept, lapsed)."
    error_id: ERR_AWARD_NOT_OFFERED
    http_status: 409
    applies_to: "POST /api/awards/{id}/accept, POST /api/awards/{id}/decline"
  - priority: 6
    category: state
    check: "Release a HELD disbursement (renewal pending) is a distinct state error."
    error_id: ERR_DISBURSEMENT_HELD
    http_status: 409
    applies_to: "POST /api/disbursements/{id}/release"
  - priority: 6
    category: state
    check: "Renewal verification only exists for renewable (college-sponsored) awards: award.renewable_years_total >= 2."
    error_id: ERR_NOT_RENEWABLE
    http_status: 409
    applies_to: "POST /api/awards/{id}/renewal-verifications"
  - priority: 7
    category: business_constraint
    check: "One entry per (student_id, cycle_id)."
    error_id: ERR_DUPLICATE_ENTRY
    http_status: 409
    applies_to: "POST /api/entries"
  - priority: 7
    category: business_constraint
    check: "One application per entry; entry must be SELECTED_SEMIFINALIST (ERR_ENTRY_NOT_SEMIFINALIST) before the duplicate-application check."
    error_id: ERR_ENTRY_NOT_SEMIFINALIST
    http_status: 409
    applies_to: "POST /api/finalist-applications"
  - priority: 7
    category: business_constraint
    check: "Duplicate application for the same entry."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST /api/finalist-applications"
  - priority: 7
    category: business_constraint
    check: "Entry requirements: citizenship_status != OTHER, enrollment_status IN {ENROLLED_FULL_TIME, ENROLLED_PART_TIME}, student.graduation_year == cycle.target_graduation_year, exam_year_of_hs == THIRD_YEAR."
    error_id: ERR_ENTRY_INELIGIBLE
    http_status: 422
    applies_to: "POST /api/entries"
  - priority: 7
    category: business_constraint
    check: "Submit/confirm requirements: endorsement_status == ENDORSED."
    error_id: ERR_APPLICATION_INCOMPLETE
    http_status: 422
    applies_to: "POST /api/finalist-applications/{id}/submit, POST /api/finalist-applications/{id}/review"
  - priority: 7
    category: business_constraint
    check: "Confirming examination: confirming_selection_index >= cycle.confirming_floor."
    error_id: ERR_CONFIRMING_SCORE_BELOW_FLOOR
    http_status: 422
    applies_to: "POST /api/finalist-applications/{id}/submit, POST /api/finalist-applications/{id}/review"
  - priority: 7
    category: business_constraint
    check: "One renewal verification per (award, academic_year_index); year must be 2..renewable_years_total and the immediately next unverified year."
    error_id: ERR_RENEWAL_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /api/awards/{id}/renewal-verifications"
  - priority: 7
    category: business_constraint
    check: "Renewal approval criteria: reported_enrollment == FULL_TIME and reported_gpa >= 2.5."
    error_id: ERR_RENEWAL_CRITERIA_UNMET
    http_status: 422
    applies_to: "POST /api/renewal-verifications/{id}/decision"
  - priority: 7
    category: business_constraint
    check: "Notification release order: all lower-sequence notifications of the same student must be RELEASED first."
    error_id: ERR_NOTIFICATION_SEQUENCE_VIOLATION
    http_status: 409
    applies_to: "POST /api/notifications/{id}/release"
  - priority: 8
    category: business_temporal
    check: "Application create and submit require logical clock <= cycle.application_deadline."
    error_id: ERR_APPLICATION_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /api/finalist-applications, POST /api/finalist-applications/{id}/submit"
  - priority: 8
    category: business_temporal
    check: "SponsorAgreement effective windows of the same sponsor for the same cycle must not overlap; half-open semantics [start, end): adjacency (a.end == b.start) is allowed; the agreement being superseded by an amend is excluded from the check."
    error_id: ERR_AGREEMENT_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /api/corporate-sponsors/{id}/agreements, POST /api/sponsor-agreements/{id}/amend"
  - priority: 8
    category: business_temporal
    check: "Disbursement release requires logical clock >= scheduled_date."
    error_id: ERR_DISBURSEMENT_NOT_DUE
    http_status: 422
    applies_to: "POST /api/disbursements/{id}/release"
  - priority: 8
    category: business_temporal
    check: "Notification release requires logical clock >= embargo_until."
    error_id: ERR_NOTIFICATION_EMBARGOED
    http_status: 422
    applies_to: "POST /api/notifications/{id}/release"
  - priority: 8
    category: business_temporal
    check: "PUBLIC_ANNOUNCEMENT release requires logical clock >= max(released_logical_at of the cycle's RELEASED AWARD_OFFER notifications) + 2 days."
    error_id: ERR_PUBLICITY_WINDOW_TOO_EARLY
    http_status: 422
    applies_to: "POST /api/notifications/{id}/release"
  - priority: 8
    category: business_temporal
    check: "The logical clock is monotonic: set_current_utc to an instant <= the current value is rejected."
    error_id: ERR_CLOCK_REGRESSION
    http_status: 422
    applies_to: "POST /api/_clock/set_current_utc"
  - priority: 9
    category: business_fiscal
    check: "Amend may not set pool_total_cents below the agreement's current pool_committed_cents + pool_paid_cents (obligations are preserved across amendment)."
    error_id: ERR_POOL_BELOW_COMMITTED
    http_status: 422
    applies_to: "POST /api/sponsor-agreements/{id}/amend"
  - priority: 10
    category: business_constraint
    check: "Field-shape validation: required fields present, enum members valid, integer ranges honored (section scores 8..38, gpa 0.0..4.0, confirming index 48..228, amounts > 0, dates ordered start < end). Checked last so domain errors surface first."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints"

endpoints:
  - method: POST
    path: "/api/program-cycles"
    description: "Create a competition cycle in SETUP posture together with its StateAllocation children (one per entry in state_populations)."
    roles: [ProgramAdmin]
    code: 201
    input: [name, target_graduation_year, total_semifinalist_slots, national_award_slots, national_award_amount_cents, confirming_floor, application_deadline, semifinalist_embargo_until, finalist_embargo_until, award_embargo_until, public_embargo_until, state_populations]
    output: ProgramCycle
    side_effects: ["StateAllocation children created (PENDING)", "ProgramCycle.version = 1"]
  - method: GET
    path: "/api/program-cycles/{id}"
    description: "Read one cycle (posture, config, matching_run, version)."
    roles: [ProgramAdmin, SchoolOfficial, Student, SponsorAdmin, CollegeAdmin]
    code: 200
    input: []
    output: ProgramCycle
    side_effects: []
  - method: GET
    path: "/api/program-cycles/{id}/state-allocations"
    description: "List the cycle's StateAllocation children, sorted state_code ASC; includes quota_raw, slots_provisional, slots_final, threshold_selection_index, selected_count."
    roles: [ProgramAdmin, SchoolOfficial, Student, SponsorAdmin, CollegeAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "StateAllocation[]"
    side_effects: []
  - method: POST
    path: "/api/program-cycles/{id}/open-entries"
    description: "SETUP -> ENTRY_OPEN."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: ProgramCycle
    side_effects: ["posture transition", "version += 1"]
  - method: POST
    path: "/api/program-cycles/{id}/close-entries"
    description: "ENTRY_OPEN -> ENTRY_CLOSED; computes provisional slot allocation for every state."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: ProgramCycle
    side_effects: ["state_slot_allocation provisional variant per state", "StateAllocation PENDING -> PROVISIONAL", "version += 1"]
  - method: POST
    path: "/api/program-cycles/{id}/run-semifinalist-selection"
    description: "ENTRY_CLOSED -> SEMIFINALISTS_SELECTED; computes final apportionment, thresholds, flips entries, queues SEMIFINALIST_NOTICE notifications."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: "{ selected_total: integer, states_finalized: integer }"
    side_effects: ["state_slot_allocation final variant", "semifinalist_threshold_and_selection per state", "entry flips", "SEMIFINALIST_NOTICE creation", "version += 1"]
  - method: POST
    path: "/api/program-cycles/{id}/publish-finalists"
    description: "SEMIFINALISTS_SELECTED -> FINALISTS_SELECTED; auto-denies IN_PROGRESS applications; queues FINALIST_NOTICE for confirmed finalists."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: ProgramCycle
    side_effects: ["auto-deny cascade", "FINALIST_NOTICE creation", "version += 1"]
  - method: POST
    path: "/api/program-cycles/{id}/run-award-matching"
    description: "Runs award_matching_waterfall exactly once per cycle (posture stays FINALISTS_SELECTED)."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: "{ awards_created: integer, national_granted: integer, corporate_granted: integer, college_granted: integer }"
    side_effects: ["award_matching_waterfall", "Award creation", "pool commits", "AWARD_OFFER + PUBLIC_ANNOUNCEMENT notifications", "matching_run = true", "version += 1"]
  - method: POST
    path: "/api/schools"
    description: "Register a school."
    roles: [ProgramAdmin]
    code: 201
    input: [name, school_code, state_code]
    output: School
    side_effects: []
  - method: POST
    path: "/api/students"
    description: "Register a student (program-side record creation)."
    roles: [ProgramAdmin]
    code: 201
    input: [full_name, school_id, state_code, graduation_year, citizenship_status, enrollment_status, "parent_sponsor_id?"]
    output: Student
    side_effects: []
  - method: GET
    path: "/api/students/{id}"
    description: "Read one student."
    roles: [ProgramAdmin, SchoolOfficial, Student, SponsorAdmin, CollegeAdmin]
    code: 200
    input: []
    output: Student
    side_effects: []
  - method: GET
    path: "/api/students"
    description: "List students with optional filters; sorted created_at ASC."
    roles: [ProgramAdmin, SchoolOfficial]
    code: 200
    input: ["school_id?", "parent_sponsor_id?", "state_code?", "limit?", "offset?"]
    output: "Student[]"
    side_effects: []
  - method: POST
    path: "/api/entries"
    description: "Create an entry for the cycle's preliminary examination; runs entry-requirement validation; created in SUBMITTED."
    roles: [Student]
    code: 201
    input: [student_id, cycle_id, exam_year_of_hs]
    output: Entry
    side_effects: ["Entry created SUBMITTED", "eligibility checks (ERR_ENTRY_INELIGIBLE)", "duplicate check (ERR_DUPLICATE_ENTRY)"]
  - method: GET
    path: "/api/entries/{id}"
    description: "Read one entry."
    roles: [ProgramAdmin, Student, SchoolOfficial]
    code: 200
    input: []
    output: Entry
    side_effects: []
  - method: GET
    path: "/api/entries"
    description: "List entries with optional filters; sorted created_at ASC."
    roles: [ProgramAdmin, SchoolOfficial]
    code: 200
    input: ["cycle_id?", "student_id?", "status?", "limit?", "offset?"]
    output: "Entry[]"
    side_effects: []
  - method: POST
    path: "/api/entries/{id}/score"
    description: "Record the preliminary examination section scores; computes selection_index; SUBMITTED -> SCORED; requires cycle ENTRY_CLOSED."
    roles: [ProgramAdmin]
    code: 200
    input: [reading_score, writing_score, math_score]
    output: Entry
    side_effects: ["selection_index computed", "scored_at := logical clock", "version += 1"]
  - method: POST
    path: "/api/finalist-applications"
    description: "Create a finalist application for a SELECTED_SEMIFINALIST entry (IN_PROGRESS)."
    roles: [Student]
    code: 201
    input: [entry_id, "first_choice_college_id?", gpa_scaled, course_rigor, confirming_selection_index]
    output: FinalistApplication
    side_effects: ["student_id denormalized from entry", "endorsement_status = PENDING"]
  - method: GET
    path: "/api/finalist-applications/{id}"
    description: "Read one finalist application."
    roles: [ProgramAdmin, Student, SchoolOfficial]
    code: 200
    input: []
    output: FinalistApplication
    side_effects: []
  - method: GET
    path: "/api/finalist-applications"
    description: "List finalist applications with optional filters; sorted created_at ASC."
    roles: [ProgramAdmin, SchoolOfficial, CollegeAdmin]
    code: 200
    input: ["entry_id?", "student_id?", "first_choice_college_id?", "endorsed_by_school_id?", "status?", "limit?", "offset?"]
    output: "FinalistApplication[]"
    side_effects: []
  - method: POST
    path: "/api/finalist-applications/{id}/endorse"
    description: "School official endorses the application of a student of their own school."
    roles: [SchoolOfficial]
    code: 200
    input: []
    output: FinalistApplication
    side_effects: ["endorsement_status := ENDORSED", "endorsed_by_school_id := X-User-ID", "version += 1"]
  - method: POST
    path: "/api/finalist-applications/{id}/submit"
    description: "Submit (or resubmit after RETURNED_FOR_CORRECTION) the application for review."
    roles: [Student]
    code: 200
    input: []
    output: FinalistApplication
    side_effects: ["status -> UNDER_REVIEW", "submitted_at := logical clock", "return_reason := null", "version += 1"]
  - method: POST
    path: "/api/finalist-applications/{id}/review"
    description: "Program decision on an UNDER_REVIEW application; OCC-guarded by the application version."
    roles: [ProgramAdmin]
    code: 200
    input: [decision, expected_finalist_application_version, "return_reason?"]
    output: FinalistApplication
    side_effects: ["status transition per decision (CONFIRM/RETURN/DENY)", "version += 1"]
  - method: POST
    path: "/api/corporate-sponsors"
    description: "Register a corporate sponsor."
    roles: [ProgramAdmin]
    code: 201
    input: [legal_name, sponsor_code]
    output: CorporateSponsor
    side_effects: []
  - method: POST
    path: "/api/corporate-sponsors/{id}/agreements"
    description: "Sponsor creates a per-cycle agreement defining eligibility criteria, award amount, and pool; window overlap (half-open) with the sponsor's other agreements for the same cycle is rejected."
    roles: [SponsorAdmin]
    code: 201
    input: [cycle_id, award_amount_cents, max_awards, pool_total_cents, effective_start_date, effective_end_date, "employee_children_only?", "min_selection_index?"]
    output: SponsorAgreement
    side_effects: ["SponsorAgreement created ACTIVE", "supersedes_agreement_id = null"]
  - method: GET
    path: "/api/sponsor-agreements/{id}"
    description: "Read one agreement incl. pool ledger fields (pool_committed_cents, pool_paid_cents, pool_available_reserved_cents, pool_available_cash_cents) and version."
    roles: [ProgramAdmin, SponsorAdmin]
    code: 200
    input: []
    output: SponsorAgreement
    side_effects: []
  - method: GET
    path: "/api/sponsor-agreements"
    description: "List agreements with optional filters; sorted created_at ASC."
    roles: [ProgramAdmin, SponsorAdmin]
    code: 200
    input: ["sponsor_id?", "cycle_id?", "supersedes_agreement_id?", "status?", "limit?", "offset?"]
    output: "SponsorAgreement[]"
    side_effects: []
  - method: POST
    path: "/api/sponsor-agreements/{id}/amend"
    description: "Sponsor amends its own agreement by superseding it with a new ACTIVE agreement; OCC-guarded; temporal overlap checked before the pool floor."
    roles: [SponsorAdmin]
    code: 201
    input: [expected_sponsor_agreement_version, "award_amount_cents?", "max_awards?", "pool_total_cents?", "effective_start_date?", "effective_end_date?", "employee_children_only?", "min_selection_index?"]
    output: SponsorAgreement
    side_effects: ["old agreement -> SUPERSEDED (version += 1)", "new agreement ACTIVE with supersedes_agreement_id set", "window-overlap and pool-floor validation"]
  - method: POST
    path: "/api/college-institutions"
    description: "Register a college institution with its sponsorship configuration (per-year amount, renewable years, terms per year, pool, max awards)."
    roles: [ProgramAdmin]
    code: 201
    input: [legal_name, college_code, award_amount_cents, renewable_years_total, terms_per_year, pool_total_cents, max_awards]
    output: CollegeInstitution
    side_effects: []
  - method: GET
    path: "/api/college-institutions/{id}"
    description: "Read one college institution incl. its pool ledger fields (pool_committed_cents, pool_paid_cents, pool_available_reserved_cents, pool_available_cash_cents) and status."
    roles: [ProgramAdmin, CollegeAdmin]
    code: 200
    input: []
    output: CollegeInstitution
    side_effects: []
  - method: GET
    path: "/api/awards/{id}"
    description: "Read one award (both parallel state dimensions, amounts, deadlines, version)."
    roles: [ProgramAdmin, Student, SponsorAdmin, CollegeAdmin]
    code: 200
    input: []
    output: Award
    side_effects: []
  - method: GET
    path: "/api/awards"
    description: "List awards with optional filters; sorted created_at ASC."
    roles: [ProgramAdmin, SponsorAdmin, CollegeAdmin, Student]
    code: 200
    input: ["cycle_id?", "application_id?", "student_id?", "agreement_id?", "college_id?", "category?", "recipient_status?", "limit?", "offset?"]
    output: "Award[]"
    side_effects: []
  - method: POST
    path: "/api/awards/{id}/accept"
    description: "Recipient accepts an OFFERED award; funding PLEDGED -> COMMITTED; disbursement schedule generated (year-1 SCHEDULED, later years HELD)."
    roles: [Student]
    code: 200
    input: []
    output: Award
    side_effects: ["recipient_status -> ACCEPTED", "funding_status -> COMMITTED", "disbursement_schedule generated", "version += 1"]
  - method: POST
    path: "/api/awards/{id}/decline"
    description: "Recipient declines an OFFERED award; triggers the release cascade: pool release -> pool status re-evaluation -> waitlist promotion -> notifications; unreleased offer/publicity notifications SUPERSEDED."
    roles: [Student]
    code: 200
    input: []
    output: Award
    side_effects: ["recipient_status -> DECLINED", "funding_status -> RELEASED_BACK", "pool release cascade", "notification supersede", "version += 1"]
  - method: GET
    path: "/api/awards/{id}/disbursements"
    description: "List an award's disbursement schedule, sorted term_index ASC."
    roles: [ProgramAdmin, Student, CollegeAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "Disbursement[]"
    side_effects: []
  - method: GET
    path: "/api/awards/{id}/renewal-verifications"
    description: "List an award's renewal verifications, sorted created_at ASC."
    roles: [ProgramAdmin, CollegeAdmin, Student]
    code: 200
    input: ["limit?", "offset?"]
    output: "RenewalVerification[]"
    side_effects: []
  - method: POST
    path: "/api/disbursements/{id}/release"
    description: "Release a due SCHEDULED disbursement; moves pool money committed -> paid; advances award funding_status; first release flips recipient ACCEPTED -> ENROLLED."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Disbursement
    side_effects: ["status -> RELEASED", "released_logical_at := logical clock", "pool ledger update", "award funding/recipient re-evaluation", "version += 1"]
  - method: POST
    path: "/api/awards/{id}/renewal-verifications"
    description: "College admin submits an enrollment/GPA verification for the next academic year of a renewable award funded by their institution."
    roles: [CollegeAdmin]
    code: 201
    input: [academic_year_index, reported_enrollment, reported_gpa]
    output: RenewalVerification
    side_effects: ["RenewalVerification created SUBMITTED", "submitted_by_college_id := X-User-ID"]
  - method: POST
    path: "/api/renewal-verifications/{id}/decision"
    description: "Program decides a SUBMITTED renewal; APPROVE renews the award and un-holds that year's terms; REJECT lapses the award (cancel remaining terms, release pool, waitlist promotion)."
    roles: [ProgramAdmin]
    code: 200
    input: [decision]
    output: RenewalVerification
    side_effects: ["status -> APPROVED | REJECTED", "award renewal or lapse cascade", "version += 1"]
  - method: GET
    path: "/api/students/{id}/notifications"
    description: "List a student's notifications, sorted sequence_number ASC."
    roles: [ProgramAdmin, Student]
    code: 200
    input: ["status?", "notice_type?", "limit?", "offset?"]
    output: "Notification[]"
    side_effects: []
  - method: POST
    path: "/api/notifications/{id}/release"
    description: "Manually lift the embargo on a notification; enforces per-student sequencing and the publicity gap on PUBLIC_ANNOUNCEMENT."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Notification
    side_effects: ["status -> RELEASED", "released_logical_at := logical clock", "version += 1"]
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the logical clock (monotonic; strictly increasing). Startup default before any call is exactly 2026-09-01T00:00:00Z. Side effect: sweep OFFERED awards whose acceptance_deadline passed -> EXPIRED with the full release cascade (pool release, status re-evaluation, waitlist promotion, notification supersede/queue). Never auto-releases notifications and never auto-releases disbursements."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string, expired_offer_ids: string[] }"
    side_effects: ["logical clock advanced", "offer-expiry sweep", "cycle AWARDS_COMPLETED bubble-up re-evaluation"]

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or role not declared in the RBAC matrix."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Authenticated role is not in the endpoint's roles list."
  - id: ERR_FORBIDDEN_OWNERSHIP
    http: 403
    condition: "Entity-backed identity mismatch: student acts on another student's resource, SponsorAdmin on another sponsor's agreements, CollegeAdmin on another college's awards."
  - id: ERR_ENDORSEMENT_SCHOOL_MISMATCH
    http: 403
    condition: "SchoolOfficial endorses an application whose student's school_id differs from X-User-ID."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A path id does not resolve (validated left-to-right)."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, invalid enum member, out-of-range number, unordered dates, or a body-referenced id that does not exist."
  - id: ERR_CYCLE_NOT_ACCEPTING_ENTRIES
    http: 409
    condition: "POST /api/entries while the cycle posture is not ENTRY_OPEN."
  - id: ERR_CYCLE_NOT_CLOSED_FOR_SCORING
    http: 409
    condition: "Scoring an entry while the cycle posture is not ENTRY_CLOSED."
  - id: ERR_CYCLE_POSTURE_INVALID
    http: 409
    condition: "Application create/submit/review, publish-finalists, or run-award-matching attempted in a posture that does not allow it."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Generic state-machine precondition failure (e.g., scoring a SCORED entry, reviewing a non-UNDER_REVIEW application, releasing a terminal disbursement, re-releasing a notification, deciding a decided renewal)."
  - id: ERR_UNSCORED_ENTRIES_REMAIN
    http: 409
    condition: "run-semifinalist-selection while any entry of the cycle is still SUBMITTED."
  - id: ERR_PENDING_APPLICATIONS_REMAIN
    http: 409
    condition: "publish-finalists while any application is UNDER_REVIEW or RETURNED_FOR_CORRECTION."
  - id: ERR_MATCHING_ALREADY_RUN
    http: 409
    condition: "run-award-matching attempted when cycle.matching_run is already true."
  - id: ERR_DUPLICATE_ENTRY
    http: 409
    condition: "Second entry for the same (student_id, cycle_id)."
  - id: ERR_ENTRY_INELIGIBLE
    http: 422
    condition: "Entry requirement failed: citizenship OTHER, NOT_ENROLLED, graduation_year mismatch, or exam not taken in THIRD_YEAR."
  - id: ERR_ENTRY_NOT_SEMIFINALIST
    http: 409
    condition: "Finalist application created for an entry not in SELECTED_SEMIFINALIST."
  - id: ERR_APPLICATION_WINDOW_CLOSED
    http: 422
    condition: "Application create or submit after the cycle's application_deadline (logical clock)."
  - id: ERR_APPLICATION_INCOMPLETE
    http: 422
    condition: "Submit or confirm without endorsement_status == ENDORSED."
  - id: ERR_CONFIRMING_SCORE_BELOW_FLOOR
    http: 422
    condition: "confirming_selection_index below the cycle's confirming_floor at submit or confirm."
  - id: ERR_AGREEMENT_WINDOW_OVERLAP
    http: 409
    condition: "Agreement effective window overlaps another non-superseded agreement of the same sponsor for the same cycle; half-open [start, end): touching endpoints are allowed."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_*_version does not match the parent's current version (OCC on amend and review)."
  - id: ERR_POOL_BELOW_COMMITTED
    http: 422
    condition: "Amend would set pool_total_cents below pool_committed_cents + pool_paid_cents."
  - id: ERR_AWARD_NOT_OFFERED
    http: 409
    condition: "Accept or decline when recipient_status is not OFFERED (includes already-decided, expired-swept, and lapsed awards)."
  - id: ERR_NOT_RENEWABLE
    http: 409
    condition: "Renewal verification created for an award with renewable_years_total == 1 (national or corporate single-payment)."
  - id: ERR_RENEWAL_ALREADY_EXISTS
    http: 409
    condition: "Renewal verification already exists for the award's next unverified academic year, or academic_year_index out of sequence."
  - id: ERR_RENEWAL_CRITERIA_UNMET
    http: 422
    condition: "APPROVE decision on a verification whose reported_enrollment != FULL_TIME or reported_gpa < 2.5."
  - id: ERR_DISBURSEMENT_NOT_DUE
    http: 422
    condition: "Release attempted while logical clock < scheduled_date."
  - id: ERR_DISBURSEMENT_HELD
    http: 409
    condition: "Release attempted on a HELD disbursement (its academic year's renewal is not yet APPROVED)."
  - id: ERR_NOTIFICATION_EMBARGOED
    http: 422
    condition: "Release attempted while logical clock < embargo_until."
  - id: ERR_NOTIFICATION_SEQUENCE_VIOLATION
    http: 409
    condition: "Release attempted while a lower-sequence notification of the same student is not yet RELEASED."
  - id: ERR_PUBLICITY_WINDOW_TOO_EARLY
    http: 422
    condition: "PUBLIC_ANNOUNCEMENT release attempted before max(released AWARD_OFFER release instants of the cycle) + 2 days."
  - id: ERR_CLOCK_REGRESSION
    http: 422
    condition: "set_current_utc to an instant less than or equal to the current logical clock."

roles:
  - name: ProgramAdmin
    description: "National program operator: runs cycles, scoring, selection, finalist review, matching, disbursement release, renewal decisions, notification release, and the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /api/program-cycles and all /api/program-cycles/{id}/* action endpoints"
      - "POST /api/schools, POST /api/students, POST /api/corporate-sponsors, POST /api/college-institutions"
      - "POST /api/entries/{id}/score"
      - "POST /api/finalist-applications/{id}/review"
      - "POST /api/disbursements/{id}/release"
      - "POST /api/renewal-verifications/{id}/decision"
      - "POST /api/notifications/{id}/release"
      - "POST /api/_clock/set_current_utc"
    shared_operations:
      - "all GET endpoints"
  - name: SchoolOfficial
    description: "Official of a registered school; endorses finalist applications of that school's students only."
    identity: "entity_backed:School"
    exclusive_operations:
      - "POST /api/finalist-applications/{id}/endorse"
    shared_operations:
      - "GET /api/students, GET /api/students/{id}, GET /api/entries, GET /api/entries/{id}, GET /api/finalist-applications, GET /api/finalist-applications/{id}, GET /api/program-cycles/{id}, GET /api/program-cycles/{id}/state-allocations"
  - name: Student
    description: "Entrant/scholarship recipient; acts only on own records."
    identity: "entity_backed:Student"
    exclusive_operations:
      - "POST /api/entries"
      - "POST /api/finalist-applications"
      - "POST /api/finalist-applications/{id}/submit"
      - "POST /api/awards/{id}/accept"
      - "POST /api/awards/{id}/decline"
    shared_operations:
      - "GET /api/students/{id}, GET /api/entries/{id}, GET /api/finalist-applications/{id}, GET /api/awards, GET /api/awards/{id}, GET /api/awards/{id}/disbursements, GET /api/awards/{id}/renewal-verifications, GET /api/students/{id}/notifications, GET /api/program-cycles/{id}, GET /api/program-cycles/{id}/state-allocations"
  - name: SponsorAdmin
    description: "Administrator of one corporate sponsor; defines and amends that sponsor's agreements (the program administers the awards themselves)."
    identity: "entity_backed:CorporateSponsor"
    exclusive_operations:
      - "POST /api/corporate-sponsors/{id}/agreements"
      - "POST /api/sponsor-agreements/{id}/amend"
    shared_operations:
      - "GET /api/sponsor-agreements, GET /api/sponsor-agreements/{id}, GET /api/awards, GET /api/awards/{id}, GET /api/students/{id}, GET /api/program-cycles/{id}, GET /api/program-cycles/{id}/state-allocations"
  - name: CollegeAdmin
    description: "Administrator of one college institution; submits renewal verifications for awards funded by that institution (decisions are the program's — segregation of duties)."
    identity: "entity_backed:CollegeInstitution"
    exclusive_operations:
      - "POST /api/awards/{id}/renewal-verifications"
    shared_operations:
      - "GET /api/finalist-applications, GET /api/awards, GET /api/awards/{id}, GET /api/awards/{id}/disbursements, GET /api/awards/{id}/renewal-verifications, GET /api/college-institutions/{id}, GET /api/students/{id}, GET /api/program-cycles/{id}, GET /api/program-cycles/{id}/state-allocations"
