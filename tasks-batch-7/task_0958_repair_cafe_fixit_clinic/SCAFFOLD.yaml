# =============================================================================
# Scaffold: Repair Café & Fix-It Clinic (nonprofit) — beyond-expert difficulty
# =============================================================================

scenario: |
  958. Repair Café & Fix-It Clinic (nonprofit): event & station
  (electronics/textile/bike), volunteer-fixer scheduling & skill, item intake &
  triage, parts/consumable, success/diversion tracking, waiver & safety,
  donation, reporting

domain_name: repair-cafe-fixit-clinic
api_prefix: /api

complexity_profile:
  primary_archetype: quota_allocation        # parts stock + station seats are finite pools: reserved, committed, released
  secondary_archetype: posture_driven_gating # RepairEvent.posture (derived from stations + incidents) gates intake
  complexity_layers:
    - optimistic_concurrency                 # OCC on RepairItem.version (re-triage) and PartStock.version (stock adjust)
    - cascading_side_effects                 # incident-suspension cascade (depth 4); event-cancel cascade (depth 3)
    - dual_variant_calculation               # diversion kg (verified vs projected); donation value (receipt vs campaign)
    - selector_policy                        # auto-assign picks one fixer from an eligible pool with pinned ranking
  entity_topology: flat                      # peer entities joined by foreign keys; no nested collection URLs
  state_machine_shape: cyclic                # RepairItem has IN_REPAIR→QUEUED loops + re-triage supersession; Station OPEN↔PAUSED
  relationship_patterns:
    - one_to_many
    - many_to_many                           # FixerSkill junction between FixerProfile and skill categories
    - self_referential                       # TriageRecord.superseded_by_id
    - cross_aggregate                        # RepairItem.assigned_fixer_id / assigned_station_id across aggregates
  role_model: segregation_of_duties          # outcome performer cannot verify own outcome; incident reporter cannot resolve it
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table (flat topology; FK -> X.id canonical prefix)
# =============================================================================
entities:
  - name: RepairEvent
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Human-readable event name" }
      - { name: starts_at, type: datetime, source: input, description: "Event window start (ISO 8601 UTC)" }
      - { name: ends_at, type: datetime, source: input, description: "Event window end (ISO 8601 UTC); must be after starts_at" }
      - { name: intake_item_cap, type: integer, source: input, description: "Maximum concurrent non-terminal RepairItems allowed (>= 1)" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | INTAKE_OPEN | REPAIR_ACTIVE | CLOSED | REPORTED | CANCELLED", constraints: "enum: DRAFT, PUBLISHED, INTAKE_OPEN, REPAIR_ACTIVE, CLOSED, REPORTED, CANCELLED" }
      - { name: posture, type: enum, source: computed, description: "ACCEPTING iff status==INTAKE_OPEN AND >=1 Station OPEN for this event AND no SafetyIncident with severity CRITICAL in status REPORTED for this event; otherwise RESTRICTED", constraints: "enum: ACCEPTING, RESTRICTED" }
      - { name: active_item_count, type: integer, source: computed, description: "Count of RepairItems with event_id = this event and status IN {REGISTERED, TRIAGED, QUEUED, ASSIGNED, IN_REPAIR, OUTCOME_RECORDED}" }
      - { name: diversion_kg_verified, type: number, source: computed, description: "Sum over VERIFIED RepairOutcomes of items of this event: FIXED contributes weight (weight_kg_actual if set else item.weight_kg_estimated), PARTIALLY_FIXED contributes 0.5*weight, NOT_REPAIRABLE contributes 0" }
      - { name: diversion_kg_projected, type: number, source: computed, description: "Same as diversion_kg_verified but ALSO includes outcomes with verification_status RECORDED (unverified), using weight_kg_actual if set else estimated" }
      - { name: parts_committed_cents, type: integer, source: computed, description: "Sum of cost_cents over PartReservations with status COMMITTED whose repair_item_id belongs to this event" }

  - name: Station
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> RepairEvent.id; event hosting this station" }
      - { name: category, type: enum, source: input, description: "Repair category served", constraints: "enum: ELECTRONICS, TEXTILE, BIKE" }
      - { name: label, type: string, source: input, description: "Human label, e.g. 'Electronics bench 1'" }
      - { name: capacity, type: integer, source: input, description: "Max number of fixers checked in at once (>= 1)" }
      - { name: status, type: enum, source: system, description: "SETUP | OPEN | PAUSED | CLOSED", constraints: "enum: SETUP, OPEN, PAUSED, CLOSED" }
      - { name: checked_in_fixer_count, type: integer, source: computed, description: "Count of FixerShifts with station_id = this station and status CHECKED_IN" }

  - name: FixerProfile
    parent: null
    common_fields: true
    fields:
      - { name: display_name, type: string, source: input, description: "Volunteer fixer display name" }
      - { name: email, type: string, source: input, description: "Contact email; unique across fixers" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | INACTIVE", constraints: "enum: ACTIVE, SUSPENDED, INACTIVE" }
      - { name: safety_induction_completed_at, type: datetime, source: input, description: "When the fixer completed safety induction; valid for 365 days" }
      - { name: reliability_score, type: integer, source: computed, description: "Starts at 100; NO_SHOW -15, LEFT_EARLY -5, COMPLETED +2; clamped to [0,100]" }

  - name: FixerSkill
    parent: null
    common_fields: false
    fields:
      - { name: fixer_id, type: string, source: input, description: "FK -> FixerProfile.id; owning fixer" }
      - { name: category, type: enum, source: input, description: "Skill category", constraints: "enum: ELECTRONICS, TEXTILE, BIKE" }
      - { name: level, type: integer, source: input, description: "Skill level 1..5", constraints: "1 <= level <= 5" }
      - { name: certified, type: boolean, source: input, default: false, description: "Whether the skill is certified" }
      # uniqueness: (fixer_id, category) unique -> ERR_SKILL_DUPLICATE

  - name: FixerShift
    parent: null
    common_fields: true
    fields:
      - { name: fixer_id, type: string, source: input, description: "FK -> FixerProfile.id; scheduled fixer" }
      - { name: station_id, type: string, source: input, description: "FK -> Station.id; station the shift serves" }
      - { name: event_id, type: string, source: input, description: "FK -> RepairEvent.id; MUST equal the station's event_id (ERR_EVENT_STATION_MISMATCH)" }
      - { name: start_time, type: datetime, source: input, description: "Shift start (ISO 8601 UTC)" }
      - { name: end_time, type: datetime, source: input, description: "Shift end; 0 < end_time - start_time <= 21600 seconds" }
      - { name: status, type: enum, source: system, description: "SIGNED_UP | CONFIRMED | CHECKED_IN | COMPLETED | LEFT_EARLY | CANCELLED | NO_SHOW", constraints: "enum: SIGNED_UP, CONFIRMED, CHECKED_IN, COMPLETED, LEFT_EARLY, CANCELLED, NO_SHOW" }
      - { name: checked_in_at, type: datetime, source: system, description: "Logical-clock timestamp of check-in; null until checked in" }

  - name: Visitor
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Visitor full name" }
      - { name: email, type: string, source: input, description: "Visitor email" }
      - { name: phone, type: string, source: input, default: "", description: "Optional phone" }

  - name: Waiver
    parent: null
    common_fields: true
    fields:
      - { name: visitor_id, type: string, source: input, description: "FK -> Visitor.id; signing visitor" }
      - { name: signed_at, type: datetime, source: system, description: "Logical-clock timestamp at signing" }
      - { name: safety_clause_accepted, type: boolean, source: input, default: false, description: "Whether the visitor accepted the hazardous-item safety clause" }
      - { name: status, type: enum, source: system, description: "ACTIVE | REVOKED | EXPIRED; a waiver is valid iff status==ACTIVE and signed_at + 365 days > current logical clock", constraints: "enum: ACTIVE, REVOKED, EXPIRED" }

  - name: RepairItem
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> RepairEvent.id; event the item was brought to" }
      - { name: visitor_id, type: string, source: input, description: "FK -> Visitor.id; owner of the item" }
      - { name: category, type: enum, source: input, description: "Item category", constraints: "enum: ELECTRONICS, TEXTILE, BIKE" }
      - { name: description, type: string, source: input, description: "Free-text problem description" }
      - { name: hazard_flag, type: boolean, source: input, default: false, description: "True if the item is hazardous (mains-powered, fuel, needles, etc.)" }
      - { name: weight_kg_estimated, type: number, source: input, description: "Estimated weight in kg (>= 0.1); used until an actual scale weight is recorded" }
      - { name: status, type: enum, source: system, description: "REGISTERED | TRIAGED | QUEUED | ASSIGNED | IN_REPAIR | OUTCOME_RECORDED | VERIFIED | WITHDRAWN", constraints: "enum: REGISTERED, TRIAGED, QUEUED, ASSIGNED, IN_REPAIR, OUTCOME_RECORDED, VERIFIED, WITHDRAWN" }
      - { name: assigned_station_id, type: string, source: system, description: "FK -> Station.id; station the item is assigned to; null unless ASSIGNED or IN_REPAIR" }
      - { name: assigned_fixer_id, type: string, source: system, description: "FK -> FixerProfile.id; fixer working the item; null unless ASSIGNED or IN_REPAIR" }
      - { name: priority_score, type: integer, source: computed, description: "From the current (non-superseded) TriageRecord: clamp(0,100, base(category) + 8*severity + 2*estimated_difficulty + (hazard_flag ? 15 : 0)); 0 before triage" }
      - { name: required_skill_level, type: integer, source: computed, description: "Equals estimated_difficulty of the current TriageRecord; 0 before triage" }

  - name: TriageRecord
    parent: null
    common_fields: false
    fields:
      - { name: item_id, type: string, source: input, description: "FK -> RepairItem.id; triaged item" }
      - { name: assessor_fixer_id, type: string, source: system, description: "FK -> FixerProfile.id; the acting Fixer (X-User-ID)" }
      - { name: severity, type: integer, source: input, description: "Problem severity 1..10", constraints: "1 <= severity <= 10" }
      - { name: estimated_difficulty, type: integer, source: input, description: "Repair difficulty 1..5; becomes item.required_skill_level", constraints: "1 <= estimated_difficulty <= 5" }
      - { name: diagnosis, type: string, source: input, description: "Free-text diagnosis" }
      - { name: superseded_by_id, type: string, source: system, description: "FK -> TriageRecord.id; the newer triage record that superseded this one; null while current" }
      - { name: is_current, type: boolean, source: computed, description: "True iff superseded_by_id is null" }

  - name: PartStock
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Stock keeping unit; unique" }
      - { name: name, type: string, source: input, description: "Part name" }
      - { name: category, type: enum, source: input, description: "Part category", constraints: "enum: ELECTRONICS, TEXTILE, BIKE, GENERIC" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Unit cost in cents (>= 0)" }
      - { name: quantity_on_hand, type: integer, source: input, description: "Physical units on hand (>= 0); decremented by reservation commit" }
      - { name: quantity_reserved, type: integer, source: computed, description: "Sum of quantity over PartReservations with part_stock_id = this stock and status RESERVED" }
      - { name: quantity_available, type: integer, source: computed, description: "quantity_on_hand - quantity_reserved" }

  - name: PartReservation
    parent: null
    common_fields: true
    fields:
      - { name: part_stock_id, type: string, source: input, description: "FK -> PartStock.id; reserved stock" }
      - { name: repair_item_id, type: string, source: input, description: "FK -> RepairItem.id; item the part is reserved for" }
      - { name: quantity, type: integer, source: input, description: "Units reserved (>= 1)" }
      - { name: unit_cost_cents, type: integer, source: system, description: "Snapshot of PartStock.unit_cost_cents at reservation time" }
      - { name: cost_cents, type: integer, source: computed, description: "quantity * unit_cost_cents" }
      - { name: status, type: enum, source: system, description: "RESERVED | COMMITTED | RELEASED | EXPIRED", constraints: "enum: RESERVED, COMMITTED, RELEASED, EXPIRED" }
      - { name: expires_at, type: datetime, source: system, description: "Expiry instant: ends_at of the repair item's event" }

  - name: RepairOutcome
    parent: null
    common_fields: true
    fields:
      - { name: item_id, type: string, source: system, description: "FK -> RepairItem.id; repaired item (path id)" }
      - { name: fixer_id, type: string, source: system, description: "FK -> FixerProfile.id; the fixer who performed the repair (X-User-ID)" }
      - { name: outcome, type: enum, source: input, description: "FIXED | PARTIALLY_FIXED | NOT_REPAIRABLE", constraints: "enum: FIXED, PARTIALLY_FIXED, NOT_REPAIRABLE" }
      - { name: weight_kg_actual, type: number, source: input, default: null, description: "Scale weight in kg; when null, diversion math falls back to item.weight_kg_estimated" }
      - { name: parts_cost_cents, type: integer, source: computed, description: "Sum of cost_cents over COMMITTED PartReservations for this item at recording time" }
      - { name: suggested_donation_cents, type: integer, source: computed, description: "Suggested donation per calculation suggested_donation (circular-looking dependency with pinned evaluation order)" }
      - { name: verification_status, type: enum, source: system, description: "RECORDED | VERIFIED | REJECTED", constraints: "enum: RECORDED, VERIFIED, REJECTED" }
      - { name: verified_by_user_id, type: string, source: system, description: "X-User-ID of the verifier; null until verified" }

  - name: SafetyIncident
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> RepairEvent.id; event where the incident occurred" }
      - { name: item_id, type: string, source: input, default: null, description: "FK -> RepairItem.id; involved item, if any" }
      - { name: fixer_id, type: string, source: input, default: null, description: "FK -> FixerProfile.id; subject fixer, if any" }
      - { name: reported_by_user_id, type: string, source: system, description: "X-User-ID of the reporter (opaque or fixer id); used by the segregation-of-duties rule on resolve" }
      - { name: severity, type: enum, source: input, description: "LOW | MEDIUM | HIGH | CRITICAL", constraints: "enum: LOW, MEDIUM, HIGH, CRITICAL" }
      - { name: description, type: string, source: input, description: "Free-text incident description" }
      - { name: status, type: enum, source: system, description: "REPORTED | RESOLVED | DISMISSED", constraints: "enum: REPORTED, RESOLVED, DISMISSED" }
      - { name: resolution_action, type: enum, source: system, description: "NONE | WARNING | SUSPENSION; set at resolve; null until then", constraints: "enum: NONE, WARNING, SUSPENSION" }

  - name: Donation
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, default: null, description: "FK -> RepairEvent.id; event attributed to, if any" }
      - { name: visitor_id, type: string, source: input, default: null, description: "FK -> Visitor.id; donor, if not anonymous" }
      - { name: donation_type, type: enum, source: input, description: "MONETARY (amount_cents required) | IN_KIND (in_kind_lines required, non-empty)", constraints: "enum: MONETARY, IN_KIND" }
      - { name: amount_cents, type: integer, source: input, default: null, description: "Monetary amount in cents; required iff donation_type == MONETARY (>= 1)" }
      - { name: in_kind_lines, type: array, source: input, default: null, description: "For IN_KIND: [{description, category, declared_value_cents, age_years}]; required non-empty iff donation_type == IN_KIND" }
      - { name: status, type: enum, source: system, description: "PLEDGED | RECEIVED | RECEIPTED | REFUNDED", constraints: "enum: PLEDGED, RECEIVED, RECEIPTED, REFUNDED" }
      - { name: received_at, type: datetime, source: system, description: "Logical-clock timestamp of the RECEIVED transition; null until received" }
      - { name: receipt_value_cents, type: integer, source: computed, description: "Tax-receipt value computed at RECEIVED per calculation donation_receipt_value (per-line round_half_up THEN sum)" }
      - { name: campaign_value_cents, type: integer, source: computed, description: "Campaign value computed at RECEIVED per calculation donation_campaign_value (monetary x2 inside event window; in-kind at full declared value)" }

  - name: EventReport
    parent: null
    common_fields: false
    fields:
      - { name: event_id, type: string, source: system, description: "FK -> RepairEvent.id; reported event (path id)" }
      - { name: generated_at, type: datetime, source: system, description: "Logical-clock timestamp of generation" }
      - { name: items_total, type: integer, source: computed, description: "Count of RepairItems of the event that have a VERIFIED RepairOutcome" }
      - { name: items_fixed, type: integer, source: computed, description: "VERIFIED outcomes with outcome FIXED" }
      - { name: items_partially_fixed, type: integer, source: computed, description: "VERIFIED outcomes with outcome PARTIALLY_FIXED" }
      - { name: items_not_repairable, type: integer, source: computed, description: "VERIFIED outcomes with outcome NOT_REPAIRABLE" }
      - { name: success_rate_strict, type: number, source: computed, description: "items_fixed / items_total; 0 when items_total == 0; 4-decimal round_half_up" }
      - { name: success_rate_lenient, type: number, source: computed, description: "(items_fixed + 0.5*items_partially_fixed) / items_total; 0 when items_total == 0; 4-decimal round_half_up" }
      - { name: diversion_kg_verified, type: number, source: computed, description: "Snapshot of event.diversion_kg_verified at generation time" }
      - { name: diversion_kg_projected, type: number, source: computed, description: "Snapshot of event.diversion_kg_projected at generation time" }
      - { name: parts_cost_total_cents, type: integer, source: computed, description: "Snapshot of event.parts_committed_cents at generation time" }
      - { name: donations_receipt_total_cents, type: integer, source: computed, description: "Sum of receipt_value_cents over Donations of this event with status RECEIPTED" }
      - { name: donations_campaign_total_cents, type: integer, source: computed, description: "Sum of campaign_value_cents over Donations of this event with status IN {RECEIVED, RECEIPTED}" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: RepairEvent
    initial_state: DRAFT
    terminal_states: [REPORTED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /api/repair-events/{id}/publish"
        actor: Coordinator
        preconditions:
          - "At least one Station with event_id = this event exists (ERR_EVENT_HAS_NO_STATIONS)"
        side_effects:
          - "increments RepairEvent.version by 1"
      - from: PUBLISHED
        to: INTAKE_OPEN
        trigger: "POST /api/repair-events/{id}/open-intake"
        actor: Coordinator
        preconditions:
          - "At least one Station with event_id = this event has status OPEN (ERR_NO_OPEN_STATION)"
        side_effects:
          - "increments RepairEvent.version by 1"
      - from: INTAKE_OPEN
        to: PUBLISHED
        trigger: "POST /api/repair-events/{id}/close-intake"
        actor: Coordinator
        preconditions:
          - "No RepairItem of this event in status ASSIGNED or IN_REPAIR (ERR_ITEMS_IN_FLIGHT)"
        side_effects:
          - "increments RepairEvent.version by 1"
      - from: INTAKE_OPEN
        to: REPAIR_ACTIVE
        trigger: "POST /api/repair-events/{id}/begin-repairs"
        actor: Coordinator
        preconditions: []
        side_effects:
          - "increments RepairEvent.version by 1"
      - from: REPAIR_ACTIVE
        to: CLOSED
        trigger: "POST /api/repair-events/{id}/close (ops-run checkpoint)"
        actor: Coordinator
        preconditions:
          - "All RepairItems of this event are terminal: status IN {VERIFIED, WITHDRAWN} (ERR_EVENT_NOT_CLOSABLE)"
        side_effects:
          - "Every FixerShift of this event in CONFIRMED becomes NO_SHOW; fixer.reliability_score -15 per shift"
          - "Every FixerShift of this event in CHECKED_IN becomes LEFT_EARLY; fixer.reliability_score -5 per shift"
          - "Every PartReservation still RESERVED on an item of this event becomes EXPIRED; PartStock.quantity_reserved recomputed"
          - "Every Station of this event in {SETUP, OPEN, PAUSED} becomes CLOSED"
          - "increments RepairEvent.version by 1"
      - from: CLOSED
        to: REPORTED
        trigger: "POST /api/repair-events/{id}/report"
        actor: Coordinator
        preconditions:
          - "No EventReport with event_id = this event exists yet (ERR_INVALID_EVENT_STATE)"
        side_effects:
          - "Creates EventReport snapshot entity (all metrics computed at generation)"
          - "increments RepairEvent.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /api/repair-events/{id}/cancel"
        actor: Coordinator
        preconditions: []
        side_effects:
          - "Cascade: see event_cancel_cascade — items -> WITHDRAWN, their RESERVED reservations -> RELEASED, PartStock recomputed, stations -> CLOSED, non-terminal shifts -> CANCELLED"
          - "increments RepairEvent.version by 1"
      - from: PUBLISHED
        to: CANCELLED
        trigger: "POST /api/repair-events/{id}/cancel"
        actor: Coordinator
        preconditions: []
        side_effects: ["Same cascade as DRAFT -> CANCELLED"]
      - from: INTAKE_OPEN
        to: CANCELLED
        trigger: "POST /api/repair-events/{id}/cancel"
        actor: Coordinator
        preconditions: []
        side_effects: ["Same cascade as DRAFT -> CANCELLED"]
      - from: REPAIR_ACTIVE
        to: CANCELLED
        trigger: "POST /api/repair-events/{id}/cancel"
        actor: Coordinator
        preconditions: []
        side_effects: ["Same cascade as DRAFT -> CANCELLED"]
      - from: CLOSED
        to: CANCELLED
        trigger: "POST /api/repair-events/{id}/cancel"
        actor: Coordinator
        preconditions: []
        side_effects: ["Same cascade as DRAFT -> CANCELLED"]

  - entity: Station
    initial_state: SETUP
    terminal_states: [CLOSED]
    transitions:
      - from: SETUP
        to: OPEN
        trigger: "POST /api/stations/{id}/open"
        actor: Coordinator
        preconditions:
          - "Parent RepairEvent.status IN {PUBLISHED, INTAKE_OPEN, REPAIR_ACTIVE} (ERR_INVALID_EVENT_STATE)"
          - "At least one FixerShift with station_id = this station has status CHECKED_IN and its fixer holds a FixerSkill whose category == station.category (ERR_NO_QUALIFIED_FIXER_CHECKED_IN)"
        side_effects:
          - "Parent event.posture recomputed (may flip RESTRICTED -> ACCEPTING)"
          - "increments Station.version by 1"
      - from: OPEN
        to: PAUSED
        trigger: "POST /api/stations/{id}/pause"
        actor: Coordinator
        preconditions:
          - "No RepairItem with assigned_station_id = this station in status IN_REPAIR (ERR_ITEMS_IN_FLIGHT)"
        side_effects:
          - "Parent event.posture recomputed"
          - "increments Station.version by 1"
      - from: PAUSED
        to: OPEN
        trigger: "POST /api/stations/{id}/resume"
        actor: Coordinator
        preconditions:
          - "At least one FixerShift with station_id = this station has status CHECKED_IN and its fixer holds a FixerSkill whose category == station.category (ERR_NO_QUALIFIED_FIXER_CHECKED_IN)"
        side_effects:
          - "Parent event.posture recomputed"
          - "increments Station.version by 1"
      - from: OPEN
        to: PAUSED
        trigger: "system (automatic when the last CHECKED_IN shift at this station checks out or is cancelled, leaving checked_in_fixer_count == 0)"
        actor: system
        preconditions:
          - "checked_in_fixer_count == 0 after the triggering shift transition"
        side_effects:
          - "Parent event.posture recomputed (may flip ACCEPTING -> RESTRICTED)"
      - from: SETUP
        to: CLOSED
        trigger: "POST /api/stations/{id}/close or system cascade from event close/cancel"
        actor: Coordinator
        preconditions: []
        side_effects:
          - "increments Station.version by 1"
      - from: OPEN
        to: CLOSED
        trigger: "POST /api/stations/{id}/close or system cascade"
        actor: Coordinator
        preconditions:
          - "No FixerShift with station_id = this station in status CHECKED_IN (ERR_STATION_HAS_CHECKED_IN_FIXERS)"
        side_effects:
          - "increments Station.version by 1"
      - from: PAUSED
        to: CLOSED
        trigger: "POST /api/stations/{id}/close or system cascade"
        actor: Coordinator
        preconditions: []
        side_effects:
          - "increments Station.version by 1"

  - entity: FixerShift
    initial_state: SIGNED_UP
    terminal_states: [COMPLETED, LEFT_EARLY, CANCELLED, NO_SHOW]
    transitions:
      - from: SIGNED_UP
        to: CONFIRMED
        trigger: "POST /api/fixer-shifts/{id}/confirm"
        actor: Coordinator
        preconditions: []
        side_effects:
          - "increments FixerShift.version by 1"
      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /api/fixer-shifts/{id}/check-in"
        actor: Fixer
        preconditions:
          - "Acting Fixer's X-User-ID == shift.fixer_id, OR actor is Coordinator (ERR_FORBIDDEN_OWNERSHIP)"
          - "FixerProfile.status == ACTIVE (ERR_FIXER_SUSPENDED)"
          - "Event of the shift has status IN {PUBLISHED, INTAKE_OPEN, REPAIR_ACTIVE} (ERR_EVENT_PHASE_FORBIDS)"
          - "safety_induction_completed_at + 365 days > current logical clock (ERR_INDUCTION_EXPIRED)"
          - "start_time <= now < end_time (ERR_SHIFT_NOT_IN_WINDOW)"
          - "Station.checked_in_fixer_count < station.capacity (ERR_STATION_AT_CAPACITY)"
        side_effects:
          - "checked_in_at := now; Station.checked_in_fixer_count +1 (computed)"
          - "increments FixerShift.version by 1"
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /api/fixer-shifts/{id}/check-out with completion=true"
        actor: Fixer
        preconditions:
          - "Acting Fixer's X-User-ID == shift.fixer_id, OR actor is Coordinator (ERR_FORBIDDEN_OWNERSHIP)"
        side_effects:
          - "Station.checked_in_fixer_count -1; if it reaches 0 the Station auto-transitions OPEN -> PAUSED"
          - "FixerProfile.reliability_score +2 (clamped at 100)"
          - "increments FixerShift.version by 1"
      - from: CHECKED_IN
        to: LEFT_EARLY
        trigger: "POST /api/fixer-shifts/{id}/check-out with completion=false, or system at event close"
        actor: Fixer
        preconditions: []
        side_effects:
          - "Station.checked_in_fixer_count -1; auto-pause on 0 as above"
          - "FixerProfile.reliability_score -5"
          - "increments FixerShift.version by 1"
      - from: SIGNED_UP
        to: CANCELLED
        trigger: "POST /api/fixer-shifts/{id}/cancel, or system cascade (event cancel / fixer suspension)"
        actor: Fixer
        preconditions: []
        side_effects:
          - "increments FixerShift.version by 1"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /api/fixer-shifts/{id}/cancel, or system cascade"
        actor: Fixer
        preconditions: []
        side_effects:
          - "increments FixerShift.version by 1"
      - from: CHECKED_IN
        to: CANCELLED
        trigger: "system cascade only (fixer suspension)"
        actor: system
        preconditions: []
        side_effects:
          - "Station.checked_in_fixer_count -1; auto-pause on 0 as above"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "system at event close checkpoint (shift never checked in)"
        actor: system
        preconditions: []
        side_effects:
          - "FixerProfile.reliability_score -15"

  - entity: RepairItem
    initial_state: REGISTERED
    terminal_states: [VERIFIED, WITHDRAWN]
    transitions:
      - from: REGISTERED
        to: TRIAGED
        trigger: "POST /api/repair-items/{id}/triage-records (first triage; OCC expected_item_version)"
        actor: Fixer
        preconditions:
          - "expected_item_version == RepairItem.version (ERR_STALE_VERSION)"
          - "Acting FixerProfile.status == ACTIVE (ERR_FIXER_SUSPENDED)"
        side_effects:
          - "Creates TriageRecord (is_current = true); item.priority_score and required_skill_level recomputed"
          - "If severity >= 8: auto-creates SafetyIncident (severity CRITICAL, item_id + event_id linked, reported_by_user_id = acting fixer id); event.posture recomputed"
          - "increments RepairItem.version by 1"
      - from: TRIAGED
        to: TRIAGED
        trigger: "POST /api/repair-items/{id}/triage-records (re-triage supersedes; OCC expected_item_version)"
        actor: Fixer
        preconditions:
          - "expected_item_version == RepairItem.version (ERR_STALE_VERSION)"
          - "Acting FixerProfile.status == ACTIVE (ERR_FIXER_SUSPENDED)"
        side_effects:
          - "New TriageRecord created; previous current record's superseded_by_id := new record id, is_current := false"
          - "item.priority_score and required_skill_level recomputed from the new record"
          - "If severity >= 8: auto-create CRITICAL SafetyIncident as above"
          - "increments RepairItem.version by 1"
      - from: QUEUED
        to: QUEUED
        trigger: "POST /api/repair-items/{id}/triage-records (re-triage while queued; OCC expected_item_version)"
        actor: Fixer
        preconditions:
          - "expected_item_version == RepairItem.version (ERR_STALE_VERSION)"
        side_effects:
          - "Same supersession + recompute side effects as TRIAGED -> TRIAGED"
          - "increments RepairItem.version by 1"
      - from: TRIAGED
        to: QUEUED
        trigger: "POST /api/repair-items/{id}/enqueue"
        actor: Coordinator
        preconditions: []
        side_effects:
          - "increments RepairItem.version by 1"
      - from: QUEUED
        to: ASSIGNED
        trigger: "POST /api/repair-items/{id}/assign (explicit fixer_id+station_id or auto-select)"
        actor: Coordinator
        preconditions:
          - "Event.status IN {INTAKE_OPEN, REPAIR_ACTIVE} (ERR_EVENT_PHASE_FORBIDS)"
          - "Target station.status == OPEN and station.category == item.category and station.event_id == item.event_id (ERR_STATION_NOT_OPEN / ERR_EVENT_STATION_MISMATCH)"
          - "Eligible fixer: shift CHECKED_IN at that station; FixerSkill category == item.category and level >= item.required_skill_level (ERR_SKILL_LEVEL_INSUFFICIENT); reliability_score >= 40 (ERR_RELIABILITY_TOO_LOW); FixerProfile.status == ACTIVE (ERR_FIXER_SUSPENDED); no other item with assigned_fixer_id == fixer in {ASSIGNED, IN_REPAIR} (ERR_FIXER_BUSY)"
          - "Auto-select when fixer_id omitted: rank eligible fixers by reliability_score DESC, tie-break by their shift's checked_in_at ASC; empty pool -> ERR_NO_ELIGIBLE_FIXER"
        side_effects:
          - "Sets assigned_fixer_id, assigned_station_id"
          - "increments RepairItem.version by 1"
      - from: ASSIGNED
        to: IN_REPAIR
        trigger: "POST /api/repair-items/{id}/start-repair"
        actor: Fixer
        preconditions:
          - "Acting Fixer's X-User-ID == item.assigned_fixer_id (ERR_NOT_ASSIGNED_FIXER)"
        side_effects:
          - "increments RepairItem.version by 1"
      - from: ASSIGNED
        to: QUEUED
        trigger: "POST /api/repair-items/{id}/unassign"
        actor: Coordinator
        preconditions: []
        side_effects:
          - "assigned_fixer_id := null, assigned_station_id := null"
          - "increments RepairItem.version by 1"
      - from: IN_REPAIR
        to: QUEUED
        trigger: "POST /api/repair-items/{id}/return-to-queue (e.g., waiting for parts), or system cascade from fixer suspension"
        actor: Fixer
        preconditions:
          - "Acting Fixer's X-User-ID == item.assigned_fixer_id, OR actor is Coordinator, OR system (ERR_NOT_ASSIGNED_FIXER)"
        side_effects:
          - "assigned_fixer_id := null, assigned_station_id := null; RESERVED PartReservations are KEPT (not released)"
          - "increments RepairItem.version by 1"
      - from: IN_REPAIR
        to: OUTCOME_RECORDED
        trigger: "POST /api/repair-items/{id}/outcomes"
        actor: Fixer
        preconditions:
          - "Acting Fixer's X-User-ID == item.assigned_fixer_id (ERR_NOT_ASSIGNED_FIXER)"
        side_effects:
          - "Creates RepairOutcome (verification_status RECORDED, fixer_id = acting fixer, parts_cost_cents + suggested_donation_cents computed)"
          - "Event.diversion_kg_projected recomputed"
          - "increments RepairItem.version by 1"
      - from: OUTCOME_RECORDED
        to: VERIFIED
        trigger: "POST /api/repair-outcomes/{id}/verify"
        actor: Coordinator
        preconditions:
          - "Outcome.verification_status == RECORDED (ERR_INVALID_OUTCOME_STATE)"
          - "If actor role is Fixer: X-User-ID != outcome.fixer_id (ERR_SELF_VERIFICATION_FORBIDDEN — segregation of duties)"
          - "No SafetyIncident with item_id == outcome.item_id in status REPORTED (ERR_SAFETY_HOLD)"
        side_effects:
          - "Outcome.verification_status := VERIFIED; verified_by_user_id := X-User-ID"
          - "Event.diversion_kg_verified recomputed"
          - "increments RepairItem.version by 1"
      - from: OUTCOME_RECORDED
        to: QUEUED
        trigger: "POST /api/repair-outcomes/{id}/reject"
        actor: Coordinator
        preconditions:
          - "Outcome.verification_status == RECORDED (ERR_INVALID_OUTCOME_STATE)"
        side_effects:
          - "Outcome.verification_status := REJECTED; item re-queued; assigned fields null"
          - "increments RepairItem.version by 1"
      - from: OUTCOME_RECORDED
        to: QUEUED
        trigger: "POST /api/repair-items/{id}/reopen (second opinion)"
        actor: Coordinator
        preconditions:
          - "Latest RepairOutcome for the item (by created_at) has outcome == NOT_REPAIRABLE and verification_status == RECORDED (ERR_INVALID_ITEM_STATE)"
        side_effects:
          - "Item re-queued; outcome record left RECORDED for audit"
          - "increments RepairItem.version by 1"
      - from: REGISTERED
        to: WITHDRAWN
        trigger: "POST /api/repair-items/{id}/withdraw or system cascade (event cancel)"
        actor: IntakeVolunteer
        preconditions: []
        side_effects:
          - "Any RESERVED PartReservations for this item -> RELEASED; PartStock.quantity_reserved recomputed"
          - "Event.active_item_count recomputed"
          - "increments RepairItem.version by 1"
      - from: TRIAGED
        to: WITHDRAWN
        trigger: "withdraw or system cascade"
        actor: IntakeVolunteer
        preconditions: []
        side_effects: ["Same as REGISTERED -> WITHDRAWN"]
      - from: QUEUED
        to: WITHDRAWN
        trigger: "withdraw or system cascade"
        actor: IntakeVolunteer
        preconditions: []
        side_effects: ["Same as REGISTERED -> WITHDRAWN"]
      - from: ASSIGNED
        to: WITHDRAWN
        trigger: "withdraw or system cascade"
        actor: IntakeVolunteer
        preconditions: []
        side_effects: ["Same as REGISTERED -> WITHDRAWN; assigned fields cleared"]
      - from: IN_REPAIR
        to: WITHDRAWN
        trigger: "withdraw or system cascade"
        actor: IntakeVolunteer
        preconditions: []
        side_effects: ["Same as REGISTERED -> WITHDRAWN; assigned fields cleared"]
      - from: OUTCOME_RECORDED
        to: WITHDRAWN
        trigger: "withdraw or system cascade"
        actor: IntakeVolunteer
        preconditions: []
        side_effects: ["Same as REGISTERED -> WITHDRAWN"]

  - entity: PartReservation
    initial_state: RESERVED
    terminal_states: [COMMITTED, RELEASED, EXPIRED]
    transitions:
      - from: RESERVED
        to: COMMITTED
        trigger: "POST /api/part-reservations/{id}/commit"
        actor: Fixer
        preconditions:
          - "Current logical clock <= reservation.expires_at (ERR_RESERVATION_EXPIRED)"
          - "No SafetyIncident with item_id == reservation.repair_item_id and severity IN {HIGH, CRITICAL} in status REPORTED (ERR_SAFETY_HOLD)"
        side_effects:
          - "PartStock.quantity_on_hand -= quantity; increments PartStock.version by 1"
          - "PartStock.quantity_reserved/quantity_available and event.parts_committed_cents recomputed"
          - "increments PartReservation.version by 1"
      - from: RESERVED
        to: RELEASED
        trigger: "POST /api/part-reservations/{id}/release, or system cascade (item withdraw / event cancel)"
        actor: Fixer
        preconditions: []
        side_effects:
          - "PartStock.quantity_reserved/quantity_available recomputed (quantity_on_hand unchanged)"
          - "increments PartReservation.version by 1"
      - from: RESERVED
        to: EXPIRED
        trigger: "system (event close checkpoint only; before close, a commit past expires_at fails with ERR_RESERVATION_EXPIRED without flipping status)"
        actor: system
        preconditions: []
        side_effects:
          - "PartStock.quantity_reserved/quantity_available recomputed"

  - entity: RepairOutcome
    initial_state: RECORDED
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: RECORDED
        to: VERIFIED
        trigger: "POST /api/repair-outcomes/{id}/verify"
        actor: Coordinator
        preconditions: ["See RepairItem OUTCOME_RECORDED -> VERIFIED"]
        side_effects: ["verified_by_user_id set; item -> VERIFIED; increments RepairOutcome.version by 1"]
      - from: RECORDED
        to: REJECTED
        trigger: "POST /api/repair-outcomes/{id}/reject"
        actor: Coordinator
        preconditions: []
        side_effects: ["Item -> QUEUED; increments RepairOutcome.version by 1"]

  - entity: Waiver
    initial_state: ACTIVE
    terminal_states: [REVOKED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /api/waivers/{id}/revoke"
        actor: SafetyOfficer
        preconditions: []
        side_effects:
          - "increments Waiver.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (lazily, when observed with signed_at + 365 days <= current logical clock)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: SafetyIncident
    initial_state: REPORTED
    terminal_states: [RESOLVED, DISMISSED]
    transitions:
      - from: REPORTED
        to: RESOLVED
        trigger: "POST /api/safety-incidents/{id}/resolve"
        actor: SafetyOfficer
        preconditions:
          - "Acting SafetyOfficer X-User-ID != incident.reported_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "resolution_action == SUSPENSION requires fixer_id non-null (ERR_VALIDATION)"
        side_effects:
          - "resolution_action recorded; event.posture recomputed (CRITICAL incident cleared)"
          - "If resolution_action == SUSPENSION — suspension cascade: FixerProfile.status := SUSPENDED (hop 1) -> every non-terminal FixerShift of that fixer -> CANCELLED (hop 2; CHECKED_IN shifts decrement their Station.checked_in_fixer_count) (hop 3) -> any Station whose count reaches 0 auto-transitions OPEN -> PAUSED (hop 4); additionally every RepairItem with assigned_fixer_id == that fixer in {ASSIGNED, IN_REPAIR} -> QUEUED with assigned fields cleared"
          - "increments SafetyIncident.version by 1"
      - from: REPORTED
        to: DISMISSED
        trigger: "POST /api/safety-incidents/{id}/dismiss"
        actor: SafetyOfficer
        preconditions:
          - "Acting SafetyOfficer X-User-ID != incident.reported_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "event.posture recomputed"
          - "increments SafetyIncident.version by 1"

  - entity: Donation
    initial_state: PLEDGED
    terminal_states: [RECEIPTED, REFUNDED]
    transitions:
      - from: PLEDGED
        to: RECEIVED
        trigger: "POST /api/donations/{id}/receive"
        actor: IntakeVolunteer
        preconditions: []
        side_effects:
          - "received_at := now; receipt_value_cents and campaign_value_cents computed and frozen"
          - "increments Donation.version by 1"
      - from: RECEIVED
        to: RECEIPTED
        trigger: "POST /api/donations/{id}/receipt"
        actor: IntakeVolunteer
        preconditions: []
        side_effects:
          - "increments Donation.version by 1"
      - from: RECEIVED
        to: REFUNDED
        trigger: "POST /api/donations/{id}/refund"
        actor: Coordinator
        preconditions: []
        side_effects:
          - "Compensation: donation removed from campaign totals; receipt never issued"
          - "increments Donation.version by 1"

  - entity: FixerProfile
    initial_state: ACTIVE
    terminal_states: [INACTIVE]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/fixer-profiles/{id}/suspend or system cascade from incident resolution"
        actor: SafetyOfficer
        preconditions: []
        side_effects:
          - "Non-terminal FixerShifts -> CANCELLED (with seat release and station auto-pause); assigned RepairItems -> QUEUED"
          - "increments FixerProfile.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/fixer-profiles/{id}/reinstate"
        actor: SafetyOfficer
        preconditions:
          - "reliability_score >= 40 (ERR_RELIABILITY_TOO_LOW)"
        side_effects:
          - "increments FixerProfile.version by 1"
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /api/fixer-profiles/{id}/deactivate"
        actor: Coordinator
        preconditions:
          - "No FixerShift in {SIGNED_UP, CONFIRMED, CHECKED_IN} and no RepairItem assigned in {ASSIGNED, IN_REPAIR} (ERR_ITEMS_IN_FLIGHT)"
        side_effects:
          - "increments FixerProfile.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: triage-create-stale-item
    parent_entity: RepairItem
    write_endpoint: "POST /api/repair-items/{id}/triage-records"
    occ_field: expected_item_version
    description: |
      Creating a TriageRecord against a RepairItem whose version has advanced
      since the client last observed it is rejected. Re-triage legitimately
      supersedes the prior current TriageRecord, so a writer holding a stale
      item version would silently supersede a record it never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: stock-adjust-stale-version
    parent_entity: PartStock
    write_endpoint: "PATCH /api/part-stocks/{id}"
    occ_field: expected_part_stock_version
    description: |
      Adjusting a PartStock whose version has advanced since the client last
      observed it is rejected. Reservation commits decrement quantity_on_hand
      and bump the version, so a stale adjustment would overwrite stock it
      never accounted for.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: triage_priority_score
    trigger: "On every TriageRecord creation (first triage or re-triage); result stored on RepairItem.priority_score"
    algorithm: weighted_scoring
    formula: |
      raw = BASE_BY_CATEGORY[item.category]
            + SEVERITY_WEIGHT * triage.severity
            + DIFFICULTY_WEIGHT * triage.estimated_difficulty
            + (item.hazard_flag ? HAZARD_BONUS : 0)
      priority_score = min(100, max(0, raw))
      required_skill_level = triage.estimated_difficulty
    input_set: "The RepairItem and the single TriageRecord with is_current == true for that item"
    constants:
      BASE_BY_CATEGORY: { ELECTRONICS: 10, TEXTILE: 5, BIKE: 7 }
      SEVERITY_WEIGHT: 8
      DIFFICULTY_WEIGHT: 2
      HAZARD_BONUS: 15
    precision: "integer; no rounding needed"

  - name: fixer_reliability_score
    trigger: "On FixerShift terminal transitions: NO_SHOW (-15), LEFT_EARLY (-5), COMPLETED (+2)"
    algorithm: decay_function
    formula: |
      score = clamp(0, 100, 100 - 15*count(NO_SHOW shifts) - 5*count(LEFT_EARLY shifts) + 2*count(COMPLETED shifts))
      Eligibility gate: score >= RELIABILITY_THRESHOLD for shift signup and item assignment.
    input_set: "All FixerShifts of the FixerProfile in terminal states {COMPLETED, LEFT_EARLY, NO_SHOW}"
    constants:
      INITIAL_SCORE: 100
      NO_SHOW_PENALTY: 15
      LEFT_EARLY_PENALTY: 5
      COMPLETION_BONUS: 2
      RELIABILITY_THRESHOLD: 40
    precision: "integer"

  - name: suggested_donation
    trigger: "On RepairOutcome creation; stored on RepairOutcome.suggested_donation_cents"
    algorithm: constraint_propagation
    formula: |
      # Circular-looking: parts_share rate is tiered by the "size of the job" while the
      # total includes parts_share. PINNED EVALUATION ORDER (rate keyed on base only):
      (1) base      = BASE_BY_CATEGORY[item.category]
      (2) rate      = base < 1000 ? 0.50 : (base < 1500 ? 0.60 : 0.75)   # keyed on base, NOT on total
      (3) share     = round_half_up(parts_cost_cents * rate)             # parts_cost_cents = sum of COMMITTED reservations for the item
      (4) total     = min(SUGGESTION_CAP_CENTS, base + share)
      suggested_donation_cents = total
    input_set: "The RepairItem's category and the RepairOutcome.parts_cost_cents (COMMITTED PartReservations for this item)"
    constants:
      BASE_BY_CATEGORY: { ELECTRONICS: 1500, TEXTILE: 800, BIKE: 1000 }
      SUGGESTION_CAP_CENTS: 5000
    precision: "integer cents; round_half_up at step (3) only"

  - name: donation_receipt_value
    trigger: "On Donation PLEDGED -> RECEIVED; frozen on Donation.receipt_value_cents"
    algorithm: aggregation
    formula: |
      if donation_type == MONETARY: receipt_value_cents = amount_cents
      if donation_type == IN_KIND:
        # PINNED ROUNDING ORDER: round EACH LINE to integer cents first, THEN sum.
        for each line: line_value = round_half_up(declared_value_cents * AGE_MULTIPLIER(line.age_years))
        receipt_value_cents = sum(line_value)
      AGE_MULTIPLIER(age) = age <= 1 ? 0.8 : (age <= 4 ? 0.5 : 0.2)
    input_set: "The Donation row itself (its lines)"
    constants:
      AGE_TIER_1_MAX: 1
      AGE_TIER_2_MAX: 4
      MULT_TIER_1: 0.8
      MULT_TIER_2: 0.5
      MULT_TIER_3: 0.2
    precision: "integer cents; round_half_up per line BEFORE summation"
    variants:
      - name: campaign_value
        when: "Computed alongside receipt value on the same RECEIVED transition, stored on campaign_value_cents"
        difference: "MONETARY: amount_cents * 2 when received_at falls inside [event.starts_at, event.ends_at] of the linked event, else amount_cents; IN_KIND: sum of declared_value_cents at full value (no depreciation, no per-line rounding)"

  - name: diversion_kg
    trigger: "On RepairOutcome creation (projected) and on outcome verify (verified); exposed as computed fields on RepairEvent and snapshotted onto EventReport"
    algorithm: aggregation
    formula: |
      weight(o) = o.weight_kg_actual if set else o.item.weight_kg_estimated
      contribution(o) = outcome FIXED -> weight(o); PARTIALLY_FIXED -> 0.5 * weight(o); NOT_REPAIRABLE -> 0
    input_set: "RepairOutcomes of RepairItems belonging to the event"
    constants: {}
    precision: "kg, 1 decimal place, round_half_up"
    variants:
      - name: verified
        when: "diversion_kg_verified — reporting to grant funders"
        difference: "Includes ONLY outcomes with verification_status == VERIFIED"
      - name: projected
        when: "diversion_kg_projected — live floor dashboard"
        difference: "Includes outcomes with verification_status IN {VERIFIED, RECORDED}; identical data otherwise — diverges from verified whenever any outcome is still unverified"

  - name: success_rate
    trigger: "On EventReport generation; snapshotted as success_rate_strict / success_rate_lenient"
    algorithm: aggregation
    formula: |
      items_total = count of items with a VERIFIED outcome
      strict  = items_fixed / items_total
      lenient = (items_fixed + 0.5 * items_partially_fixed) / items_total
      both 0 when items_total == 0
    input_set: "RepairItems of the event whose latest outcome is VERIFIED"
    constants: {}
    precision: "4 decimal places, round_half_up"

  - name: invariant_part_stock_conservation
    trigger: "Audited after every reserve / commit / release / PATCH on a PartStock"
    algorithm: aggregation
    formula: |
      CONSERVED: PartStock.quantity_on_hand
        == initial quantity_on_hand + sum(PATCH quantity_on_hand deltas) - sum(quantity of COMMITTED reservations)
      AND quantity_reserved == sum(quantity of reservations with status RESERVED)
      A reserve followed by its release MUST leave quantity_on_hand and quantity_reserved unchanged.
    input_set: "One PartStock and all its PartReservations"
    constants: {}
    precision: "integer units"

  - name: invariant_station_seat_conservation
    trigger: "Audited after every check-in / check-out / shift cancel"
    algorithm: aggregation
    formula: |
      CONSERVED: Station.checked_in_fixer_count == count(FixerShift with station_id = station.id AND status == CHECKED_IN)
      A check-in followed by its check-out MUST leave checked_in_fixer_count unchanged.
    input_set: "One Station and all its FixerShifts"
    constants: {}
    precision: "integer seats"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority; lower number fires first)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role permitted for this endpoint per §1.5 roles", error_id: ERR_UNAUTHORIZED_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Path ids and body FK ids exist, validated left-to-right (path first, then body fields in declared order)", error_id: ERR_EVENT_NOT_FOUND, http_status: 404, applies_to: "all (entity-specific ERR_*_NOT_FOUND per resource)" }
  - { priority: 4, category: state, check: "Target resource(s) in required state for the transition, INCLUDING derived posture gating (event.posture == ACCEPTING required at intake -> ERR_POSTURE_RESTRICTED)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints (entity-specific: ERR_INVALID_EVENT_STATE, ERR_INVALID_ITEM_STATE, ERR_INVALID_SHIFT_STATE, ERR_INVALID_OUTCOME_STATE, ERR_INVALID_RESERVATION_STATE, ERR_INVALID_DONATION_STATE, ERR_INVALID_WAIVER_STATE, ERR_INVALID_INCIDENT_STATE, ERR_INVALID_STATION_STATE, ERR_EVENT_NOT_ACCEPTING_INTAKE, ERR_EVENT_PHASE_FORBIDS, ERR_EVENT_NOT_CLOSABLE, ERR_STATION_NOT_OPEN, ERR_RESERVATION_EXPIRED)" }
  - { priority: 5, category: business_safety, check: "Waiver/safety gates: item intake requires a valid ACTIVE waiver for the visitor (ERR_WAIVER_REQUIRED; expired -> ERR_WAIVER_EXPIRED); hazard_flag=true additionally requires safety_clause_accepted (ERR_WAIVER_SAFETY_CLAUSE_REQUIRED); check-in requires unexpired safety induction (ERR_INDUCTION_EXPIRED); part commit and outcome verify blocked by open safety incidents (ERR_SAFETY_HOLD)", error_id: ERR_WAIVER_REQUIRED, http_status: 422, applies_to: "POST /api/repair-items, POST /api/fixer-shifts/{id}/check-in, POST /api/part-reservations/{id}/commit, POST /api/repair-outcomes/{id}/verify" }
  - { priority: 6, category: business_temporal, check: "Shift duration: 0 < end_time - start_time <= 21600 seconds (ERR_SHIFT_TOO_LONG)", error_id: ERR_SHIFT_TOO_LONG, http_status: 422, applies_to: "POST /api/fixer-shifts" }
  - { priority: 7, category: business_temporal, check: "Fixer double-booking: new shift interval [start_time, end_time) HALF-OPEN must not overlap any non-cancelled shift of the same fixer; adjacency (end == start) is ALLOWED", error_id: ERR_SHIFT_OVERLAP, http_status: 409, applies_to: "POST /api/fixer-shifts" }
  - { priority: 8, category: business_temporal, check: "Station interval capacity: count of non-cancelled shifts at the same station overlapping the new shift under CLOSED-interval semantics (touching endpoints count) must be < station.capacity", error_id: ERR_STATION_INTERVAL_CAPACITY_EXCEEDED, http_status: 409, applies_to: "POST /api/fixer-shifts" }
  - { priority: 9, category: business_temporal, check: "Check-in window: start_time <= now < end_time at the current logical clock", error_id: ERR_SHIFT_NOT_IN_WINDOW, http_status: 409, applies_to: "POST /api/fixer-shifts/{id}/check-in" }
  - { priority: 10, category: business_constraint, check: "Skill/role constraints: (fixer_id, category) unique on FixerSkill (ERR_SKILL_DUPLICATE); assign requires skill level >= required_skill_level (ERR_SKILL_LEVEL_INSUFFICIENT) and category match (ERR_SKILL_MISMATCH); reliability_score >= 40 at signup/assign (ERR_RELIABILITY_TOO_LOW); fixer ACTIVE (ERR_FIXER_SUSPENDED); fixer not busy on another item (ERR_FIXER_BUSY); segregation of duties: verifier != performer (ERR_SELF_VERIFICATION_FORBIDDEN), incident resolver != reporter (ERR_SEGREGATION_OF_DUTIES)", error_id: ERR_SKILL_DUPLICATE, http_status: 409, applies_to: "POST /api/fixer-skills, POST /api/fixer-shifts, POST /api/repair-items/{id}/assign, POST /api/repair-outcomes/{id}/verify, POST /api/safety-incidents/{id}/resolve" }
  - { priority: 11, category: business_referential, check: "Cross-FK consistency: shift.event_id == station.event_id (ERR_EVENT_STATION_MISMATCH); item category == station category at assign; reservation's item must belong to a non-terminal repair flow", error_id: ERR_EVENT_STATION_MISMATCH, http_status: 422, applies_to: "POST /api/fixer-shifts, POST /api/repair-items/{id}/assign, POST /api/part-reservations" }
  - { priority: 12, category: business_fiscal, check: "Capacity/quota LAST: intake_item_cap on non-terminal items (ERR_INTAKE_CAP_REACHED); station checked_in_fixer_count < capacity at check-in (ERR_STATION_AT_CAPACITY); stock quantity_available >= reservation quantity (ERR_INSUFFICIENT_STOCK); PATCH on_hand >= quantity_reserved (ERR_STOCK_BELOW_RESERVED)", error_id: ERR_INSUFFICIENT_STOCK, http_status: 409, applies_to: "POST /api/repair-items, POST /api/fixer-shifts/{id}/check-in, POST /api/part-reservations, PATCH /api/part-stocks/{id}" }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- logical clock (test-driving) ----
  - { method: POST, path: "/api/_clock/set_current_utc", description: "Advance the logical clock. Server startup default is 2026-05-01T00:00:00Z; before any call the clock reads exactly this default and never wall-clock time. New value must be >= current value (ERR_CLOCK_REGRESSION).", roles: [Coordinator], code: 200, input: [to_iso8601], output: null, side_effects: ["lazy waiver expiry and reservation expiry re-evaluated on next access"] }

  # ---- RepairEvent ----
  - { method: POST, path: "/api/repair-events", description: "Create event (DRAFT)", roles: [Coordinator], code: 201, input: [name, starts_at, ends_at, intake_item_cap], output: RepairEvent, side_effects: [] }
  - { method: GET, path: "/api/repair-events", description: "List events", roles: [Coordinator, IntakeVolunteer, Fixer, SafetyOfficer], code: 200, input: ["status?", "limit?", "offset?"], output: "RepairEvent[]", side_effects: [] }
  - { method: GET, path: "/api/repair-events/{id}", description: "Get event incl. computed posture/diversion fields", roles: [Coordinator, IntakeVolunteer, Fixer, SafetyOfficer], code: 200, input: [], output: RepairEvent, side_effects: [] }
  - { method: POST, path: "/api/repair-events/{id}/publish", description: "DRAFT -> PUBLISHED", roles: [Coordinator], code: 200, input: [], output: RepairEvent, side_effects: ["increments RepairEvent.version by 1"] }
  - { method: POST, path: "/api/repair-events/{id}/open-intake", description: "PUBLISHED -> INTAKE_OPEN", roles: [Coordinator], code: 200, input: [], output: RepairEvent, side_effects: ["increments RepairEvent.version by 1"] }
  - { method: POST, path: "/api/repair-events/{id}/close-intake", description: "INTAKE_OPEN -> PUBLISHED (revert)", roles: [Coordinator], code: 200, input: [], output: RepairEvent, side_effects: ["increments RepairEvent.version by 1"] }
  - { method: POST, path: "/api/repair-events/{id}/begin-repairs", description: "INTAKE_OPEN -> REPAIR_ACTIVE", roles: [Coordinator], code: 200, input: [], output: RepairEvent, side_effects: ["increments RepairEvent.version by 1"] }
  - { method: POST, path: "/api/repair-events/{id}/close", description: "REPAIR_ACTIVE -> CLOSED; ops-run checkpoint: NO_SHOW/LEFT_EARLY sweeps, reservation expiry, station close", roles: [Coordinator], code: 200, input: [], output: RepairEvent, side_effects: ["reliability penalties", "reservation expiry", "station close", "increments RepairEvent.version by 1"] }
  - { method: POST, path: "/api/repair-events/{id}/cancel", description: "Any non-terminal -> CANCELLED with full cascade", roles: [Coordinator], code: 200, input: [], output: RepairEvent, side_effects: ["event_cancel_cascade", "increments RepairEvent.version by 1"] }
  - { method: POST, path: "/api/repair-events/{id}/report", description: "CLOSED -> REPORTED; generate EventReport snapshot", roles: [Coordinator], code: 201, input: [], output: EventReport, side_effects: ["creates EventReport", "increments RepairEvent.version by 1"] }

  # ---- Station ----
  - { method: POST, path: "/api/stations", description: "Create station (SETUP)", roles: [Coordinator], code: 201, input: [event_id, category, label, capacity], output: Station, side_effects: [] }
  - { method: GET, path: "/api/stations", description: "List stations", roles: [Coordinator, IntakeVolunteer, Fixer, SafetyOfficer], code: 200, input: ["event_id?", "status?", "category?", "limit?", "offset?"], output: "Station[]", side_effects: [] }
  - { method: GET, path: "/api/stations/{id}", description: "Get station", roles: [Coordinator, IntakeVolunteer, Fixer, SafetyOfficer], code: 200, input: [], output: Station, side_effects: [] }
  - { method: POST, path: "/api/stations/{id}/open", description: "SETUP/PAUSED... SETUP -> OPEN", roles: [Coordinator], code: 200, input: [], output: Station, side_effects: ["posture recompute", "increments Station.version by 1"] }
  - { method: POST, path: "/api/stations/{id}/pause", description: "OPEN -> PAUSED", roles: [Coordinator], code: 200, input: [], output: Station, side_effects: ["posture recompute", "increments Station.version by 1"] }
  - { method: POST, path: "/api/stations/{id}/resume", description: "PAUSED -> OPEN", roles: [Coordinator], code: 200, input: [], output: Station, side_effects: ["posture recompute", "increments Station.version by 1"] }
  - { method: POST, path: "/api/stations/{id}/close", description: "Any non-terminal -> CLOSED", roles: [Coordinator], code: 200, input: [], output: Station, side_effects: ["increments Station.version by 1"] }

  # ---- FixerProfile ----
  - { method: POST, path: "/api/fixer-profiles", description: "Register fixer (ACTIVE, reliability 100)", roles: [Coordinator], code: 201, input: [display_name, email, safety_induction_completed_at], output: FixerProfile, side_effects: [] }
  - { method: GET, path: "/api/fixer-profiles", description: "List fixers", roles: [Coordinator, IntakeVolunteer, Fixer, SafetyOfficer], code: 200, input: ["status?", "limit?", "offset?"], output: "FixerProfile[]", side_effects: [] }
  - { method: GET, path: "/api/fixer-profiles/{id}", description: "Get fixer", roles: [Coordinator, IntakeVolunteer, Fixer, SafetyOfficer], code: 200, input: [], output: FixerProfile, side_effects: [] }
  - { method: POST, path: "/api/fixer-profiles/{id}/suspend", description: "ACTIVE -> SUSPENDED with cascade", roles: [SafetyOfficer], code: 200, input: [], output: FixerProfile, side_effects: ["shift cancel cascade", "item requeue", "increments FixerProfile.version by 1"] }
  - { method: POST, path: "/api/fixer-profiles/{id}/reinstate", description: "SUSPENDED -> ACTIVE (reliability >= 40)", roles: [SafetyOfficer], code: 200, input: [], output: FixerProfile, side_effects: ["increments FixerProfile.version by 1"] }
  - { method: POST, path: "/api/fixer-profiles/{id}/deactivate", description: "ACTIVE -> INACTIVE", roles: [Coordinator], code: 200, input: [], output: FixerProfile, side_effects: ["increments FixerProfile.version by 1"] }

  # ---- FixerSkill ----
  - { method: POST, path: "/api/fixer-skills", description: "Add skill; (fixer_id, category) unique", roles: [Coordinator], code: 201, input: [fixer_id, category, level, "certified?"], output: FixerSkill, side_effects: [] }
  - { method: GET, path: "/api/fixer-skills", description: "List skills", roles: [Coordinator, IntakeVolunteer, Fixer, SafetyOfficer], code: 200, input: ["fixer_id?", "category?", "limit?", "offset?"], output: "FixerSkill[]", side_effects: [] }
  - { method: GET, path: "/api/fixer-skills/{id}", description: "Get skill", roles: [Coordinator, IntakeVolunteer, Fixer, SafetyOfficer], code: 200, input: [], output: FixerSkill, side_effects: [] }
  - { method: DELETE, path: "/api/fixer-skills/{id}", description: "Remove a skill", roles: [Coordinator], code: 204, input: [], output: null, side_effects: [] }

  # ---- FixerShift ----
  - { method: POST, path: "/api/fixer-shifts", description: "Sign up a shift (SIGNED_UP). Fixer role may only create for self (fixer_id == X-User-ID)", roles: [Coordinator, Fixer], code: 201, input: [fixer_id, station_id, event_id, start_time, end_time], output: FixerShift, side_effects: [] }
  - { method: GET, path: "/api/fixer-shifts", description: "List shifts", roles: [Coordinator, IntakeVolunteer, Fixer, SafetyOfficer], code: 200, input: ["fixer_id?", "station_id?", "event_id?", "status?", "limit?", "offset?"], output: "FixerShift[]", side_effects: [] }
  - { method: GET, path: "/api/fixer-shifts/{id}", description: "Get shift", roles: [Coordinator, IntakeVolunteer, Fixer, SafetyOfficer], code: 200, input: [], output: FixerShift, side_effects: [] }
  - { method: POST, path: "/api/fixer-shifts/{id}/confirm", description: "SIGNED_UP -> CONFIRMED", roles: [Coordinator], code: 200, input: [], output: FixerShift, side_effects: ["increments FixerShift.version by 1"] }
  - { method: POST, path: "/api/fixer-shifts/{id}/check-in", description: "CONFIRMED -> CHECKED_IN", roles: [Coordinator, Fixer], code: 200, input: [], output: FixerShift, side_effects: ["checked_in_at := now", "station seat +1", "increments FixerShift.version by 1"] }
  - { method: POST, path: "/api/fixer-shifts/{id}/check-out", description: "CHECKED_IN -> COMPLETED (completion=true) or LEFT_EARLY (completion=false)", roles: [Coordinator, Fixer], code: 200, input: [completion], output: FixerShift, side_effects: ["station seat -1 + auto-pause", "reliability delta", "increments FixerShift.version by 1"] }
  - { method: POST, path: "/api/fixer-shifts/{id}/cancel", description: "SIGNED_UP/CONFIRMED -> CANCELLED", roles: [Coordinator, Fixer], code: 200, input: [], output: FixerShift, side_effects: ["increments FixerShift.version by 1"] }

  # ---- Visitor / Waiver ----
  - { method: POST, path: "/api/visitors", description: "Register visitor", roles: [IntakeVolunteer], code: 201, input: [full_name, email, "phone?"], output: Visitor, side_effects: [] }
  - { method: GET, path: "/api/visitors", description: "List visitors", roles: [Coordinator, IntakeVolunteer, Fixer, SafetyOfficer], code: 200, input: ["limit?", "offset?"], output: "Visitor[]", side_effects: [] }
  - { method: GET, path: "/api/visitors/{id}", description: "Get visitor", roles: [Coordinator, IntakeVolunteer, Fixer, SafetyOfficer], code: 200, input: [], output: Visitor, side_effects: [] }
  - { method: POST, path: "/api/waivers", description: "Sign waiver (ACTIVE, signed_at = logical clock)", roles: [IntakeVolunteer], code: 201, input: [visitor_id, "safety_clause_accepted?"], output: Waiver, side_effects: [] }
  - { method: GET, path: "/api/waivers", description: "List waivers", roles: [Coordinator, IntakeVolunteer, Fixer, SafetyOfficer], code: 200, input: ["visitor_id?", "status?", "limit?", "offset?"], output: "Waiver[]", side_effects: [] }
  - { method: GET, path: "/api/waivers/{id}", description: "Get waiver", roles: [Coordinator, IntakeVolunteer, Fixer, SafetyOfficer], code: 200, input: [], output: Waiver, side_effects: [] }
  - { method: POST, path: "/api/waivers/{id}/revoke", description: "ACTIVE -> REVOKED", roles: [Coordinator, SafetyOfficer], code: 200, input: [], output: Waiver, side_effects: ["increments Waiver.version by 1"] }

  # ---- RepairItem / Triage ----
  - { method: POST, path: "/api/repair-items", description: "Intake an item (REGISTERED); requires event INTAKE_OPEN + posture ACCEPTING + valid waiver", roles: [IntakeVolunteer], code: 201, input: [event_id, visitor_id, category, description, "hazard_flag?", weight_kg_estimated], output: RepairItem, side_effects: ["active_item_count +1"] }
  - { method: GET, path: "/api/repair-items", description: "List items", roles: [Coordinator, IntakeVolunteer, Fixer, SafetyOfficer], code: 200, input: ["event_id?", "visitor_id?", "assigned_station_id?", "assigned_fixer_id?", "status?", "limit?", "offset?"], output: "RepairItem[]", side_effects: [] }
  - { method: GET, path: "/api/repair-items/{id}", description: "Get item", roles: [Coordinator, IntakeVolunteer, Fixer, SafetyOfficer], code: 200, input: [], output: RepairItem, side_effects: [] }
  - { method: POST, path: "/api/repair-items/{id}/triage-records", description: "Create triage (first or superseding re-triage); OCC via expected_item_version; severity >= 8 auto-creates CRITICAL SafetyIncident", roles: [Fixer], code: 201, input: [severity, estimated_difficulty, diagnosis, expected_item_version], output: TriageRecord, side_effects: ["supersede prior current record", "priority_score recompute", "auto-incident on severity >= 8", "increments RepairItem.version by 1"] }
  - { method: GET, path: "/api/triage-records", description: "List triage records", roles: [Coordinator, IntakeVolunteer, Fixer, SafetyOfficer], code: 200, input: ["item_id?", "assessor_fixer_id?", "superseded_by_id?", "limit?", "offset?"], output: "TriageRecord[]", side_effects: [] }
  - { method: GET, path: "/api/triage-records/{id}", description: "Get triage record", roles: [Coordinator, IntakeVolunteer, Fixer, SafetyOfficer], code: 200, input: [], output: TriageRecord, side_effects: [] }
  - { method: POST, path: "/api/repair-items/{id}/enqueue", description: "TRIAGED -> QUEUED", roles: [Coordinator], code: 200, input: [], output: RepairItem, side_effects: ["increments RepairItem.version by 1"] }
  - { method: POST, path: "/api/repair-items/{id}/assign", description: "QUEUED -> ASSIGNED; omit fixer_id/station_id for auto-select (selector policy pinned in §1.2)", roles: [Coordinator], code: 200, input: ["fixer_id?", "station_id?"], output: RepairItem, side_effects: ["sets assigned_fixer_id/assigned_station_id", "increments RepairItem.version by 1"] }
  - { method: POST, path: "/api/repair-items/{id}/start-repair", description: "ASSIGNED -> IN_REPAIR (assigned fixer only)", roles: [Fixer], code: 200, input: [], output: RepairItem, side_effects: ["increments RepairItem.version by 1"] }
  - { method: POST, path: "/api/repair-items/{id}/return-to-queue", description: "IN_REPAIR -> QUEUED; keeps part reservations", roles: [Coordinator, Fixer], code: 200, input: [], output: RepairItem, side_effects: ["clears assigned fields", "increments RepairItem.version by 1"] }
  - { method: POST, path: "/api/repair-items/{id}/unassign", description: "ASSIGNED -> QUEUED", roles: [Coordinator], code: 200, input: [], output: RepairItem, side_effects: ["clears assigned fields", "increments RepairItem.version by 1"] }
  - { method: POST, path: "/api/repair-items/{id}/reopen", description: "OUTCOME_RECORDED (latest outcome NOT_REPAIRABLE) -> QUEUED for second opinion", roles: [Coordinator], code: 200, input: [], output: RepairItem, side_effects: ["increments RepairItem.version by 1"] }
  - { method: POST, path: "/api/repair-items/{id}/withdraw", description: "Any non-terminal -> WITHDRAWN; releases RESERVED reservations", roles: [Coordinator, IntakeVolunteer], code: 200, input: [], output: RepairItem, side_effects: ["reservation release cascade", "increments RepairItem.version by 1"] }

  # ---- RepairOutcome ----
  - { method: POST, path: "/api/repair-items/{id}/outcomes", description: "IN_REPAIR -> OUTCOME_RECORDED; creates RepairOutcome (RECORDED)", roles: [Fixer], code: 201, input: [outcome, "weight_kg_actual?"], output: RepairOutcome, side_effects: ["parts_cost_cents + suggested_donation_cents computed", "diversion_kg_projected recompute", "increments RepairItem.version by 1"] }
  - { method: GET, path: "/api/repair-outcomes", description: "List outcomes", roles: [Coordinator, IntakeVolunteer, Fixer, SafetyOfficer], code: 200, input: ["item_id?", "fixer_id?", "verification_status?", "limit?", "offset?"], output: "RepairOutcome[]", side_effects: [] }
  - { method: GET, path: "/api/repair-outcomes/{id}", description: "Get outcome", roles: [Coordinator, IntakeVolunteer, Fixer, SafetyOfficer], code: 200, input: [], output: RepairOutcome, side_effects: [] }
  - { method: POST, path: "/api/repair-outcomes/{id}/verify", description: "RECORDED -> VERIFIED; Fixer verifier must not be the performer", roles: [Coordinator, Fixer], code: 200, input: [], output: RepairOutcome, side_effects: ["item -> VERIFIED", "diversion_kg_verified recompute", "increments RepairOutcome.version by 1"] }
  - { method: POST, path: "/api/repair-outcomes/{id}/reject", description: "RECORDED -> REJECTED; item back to QUEUED", roles: [Coordinator], code: 200, input: [], output: RepairOutcome, side_effects: ["item -> QUEUED", "increments RepairOutcome.version by 1"] }

  # ---- Parts ----
  - { method: POST, path: "/api/part-stocks", description: "Create stock row", roles: [Coordinator], code: 201, input: [sku, name, category, unit_cost_cents, quantity_on_hand], output: PartStock, side_effects: [] }
  - { method: GET, path: "/api/part-stocks", description: "List stock", roles: [Coordinator, IntakeVolunteer, Fixer, SafetyOfficer], code: 200, input: ["category?", "sku?", "limit?", "offset?"], output: "PartStock[]", side_effects: [] }
  - { method: GET, path: "/api/part-stocks/{id}", description: "Get stock", roles: [Coordinator, IntakeVolunteer, Fixer, SafetyOfficer], code: 200, input: [], output: PartStock, side_effects: [] }
  - { method: PATCH, path: "/api/part-stocks/{id}", description: "Adjust stock; OCC via expected_part_stock_version; new on_hand must be >= quantity_reserved", roles: [Coordinator], code: 200, input: ["quantity_on_hand?", "unit_cost_cents?", expected_part_stock_version], output: PartStock, side_effects: ["increments PartStock.version by 1"] }
  - { method: POST, path: "/api/part-reservations", description: "Reserve parts for an item in ASSIGNED or IN_REPAIR; expires_at = event.ends_at", roles: [Coordinator, Fixer], code: 201, input: [part_stock_id, repair_item_id, quantity], output: PartReservation, side_effects: ["quantity_reserved recompute"] }
  - { method: GET, path: "/api/part-reservations", description: "List reservations", roles: [Coordinator, IntakeVolunteer, Fixer, SafetyOfficer], code: 200, input: ["part_stock_id?", "repair_item_id?", "status?", "limit?", "offset?"], output: "PartReservation[]", side_effects: [] }
  - { method: GET, path: "/api/part-reservations/{id}", description: "Get reservation", roles: [Coordinator, IntakeVolunteer, Fixer, SafetyOfficer], code: 200, input: [], output: PartReservation, side_effects: [] }
  - { method: POST, path: "/api/part-reservations/{id}/commit", description: "RESERVED -> COMMITTED; decrements on_hand; safety hold applies", roles: [Coordinator, Fixer], code: 200, input: [], output: PartReservation, side_effects: ["PartStock.quantity_on_hand -= quantity", "increments PartStock.version by 1", "increments PartReservation.version by 1"] }
  - { method: POST, path: "/api/part-reservations/{id}/release", description: "RESERVED -> RELEASED; frees availability", roles: [Coordinator, Fixer], code: 200, input: [], output: PartReservation, side_effects: ["quantity_reserved recompute", "increments PartReservation.version by 1"] }

  # ---- SafetyIncident ----
  - { method: POST, path: "/api/safety-incidents", description: "Report incident (REPORTED); reported_by_user_id := X-User-ID", roles: [Coordinator, Fixer, SafetyOfficer], code: 201, input: [event_id, "item_id?", "fixer_id?", severity, description], output: SafetyIncident, side_effects: ["posture recompute when severity CRITICAL"] }
  - { method: GET, path: "/api/safety-incidents", description: "List incidents", roles: [Coordinator, IntakeVolunteer, Fixer, SafetyOfficer], code: 200, input: ["event_id?", "item_id?", "fixer_id?", "status?", "limit?", "offset?"], output: "SafetyIncident[]", side_effects: [] }
  - { method: GET, path: "/api/safety-incidents/{id}", description: "Get incident", roles: [Coordinator, IntakeVolunteer, Fixer, SafetyOfficer], code: 200, input: [], output: SafetyIncident, side_effects: [] }
  - { method: POST, path: "/api/safety-incidents/{id}/resolve", description: "REPORTED -> RESOLVED; resolver != reporter; SUSPENSION triggers full cascade", roles: [SafetyOfficer], code: 200, input: [resolution_action], output: SafetyIncident, side_effects: ["suspension cascade when resolution_action == SUSPENSION", "posture recompute", "increments SafetyIncident.version by 1"] }
  - { method: POST, path: "/api/safety-incidents/{id}/dismiss", description: "REPORTED -> DISMISSED; dismisser != reporter", roles: [SafetyOfficer], code: 200, input: [], output: SafetyIncident, side_effects: ["posture recompute", "increments SafetyIncident.version by 1"] }

  # ---- Donation ----
  - { method: POST, path: "/api/donations", description: "Record pledge (PLEDGED)", roles: [IntakeVolunteer], code: 201, input: [donation_type, "event_id?", "visitor_id?", "amount_cents?", "in_kind_lines?"], output: Donation, side_effects: [] }
  - { method: GET, path: "/api/donations", description: "List donations", roles: [Coordinator, IntakeVolunteer, Fixer, SafetyOfficer], code: 200, input: ["event_id?", "visitor_id?", "status?", "limit?", "offset?"], output: "Donation[]", side_effects: [] }
  - { method: GET, path: "/api/donations/{id}", description: "Get donation", roles: [Coordinator, IntakeVolunteer, Fixer, SafetyOfficer], code: 200, input: [], output: Donation, side_effects: [] }
  - { method: POST, path: "/api/donations/{id}/receive", description: "PLEDGED -> RECEIVED; computes + freezes receipt_value_cents and campaign_value_cents", roles: [IntakeVolunteer], code: 200, input: [], output: Donation, side_effects: ["valuation computations", "increments Donation.version by 1"] }
  - { method: POST, path: "/api/donations/{id}/receipt", description: "RECEIVED -> RECEIPTED", roles: [IntakeVolunteer], code: 200, input: [], output: Donation, side_effects: ["increments Donation.version by 1"] }
  - { method: POST, path: "/api/donations/{id}/refund", description: "RECEIVED -> REFUNDED (compensation; not allowed once RECEIPTED)", roles: [Coordinator], code: 200, input: [], output: Donation, side_effects: ["increments Donation.version by 1"] }

  # ---- EventReport ----
  - { method: GET, path: "/api/event-reports", description: "List reports", roles: [Coordinator, IntakeVolunteer, Fixer, SafetyOfficer], code: 200, input: ["event_id?", "limit?", "offset?"], output: "EventReport[]", side_effects: [] }
  - { method: GET, path: "/api/event-reports/{id}", description: "Get report", roles: [Coordinator, IntakeVolunteer, Fixer, SafetyOfficer], code: 200, input: [], output: EventReport, side_effects: [] }

