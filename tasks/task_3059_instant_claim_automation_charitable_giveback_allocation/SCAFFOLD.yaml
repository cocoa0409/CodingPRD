  - method: GET
    path: "/cohorts"
    description: "List cohorts"
    roles: [PlatformAdmin, FinanceOps, UnderwritingAdmin, ClaimsAdjuster]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Cohort[]
    side_effects: []
  - method: GET
    path: "/cohorts/{id}"
    description: "Get a cohort with computed aggregates"
    roles: [PlatformAdmin, FinanceOps, UnderwritingAdmin, ClaimsAdjuster]
    code: 200
    input: []
    output: Cohort
    side_effects: []
  - method: POST
    path: "/cohorts/{id}/reinsurance"
    description: "Attach or replace the cohort's quota-share treaty (retroactive over ESCALATED reserves)"
