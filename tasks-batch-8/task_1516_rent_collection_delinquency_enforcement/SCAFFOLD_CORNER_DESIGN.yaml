            - { call: "POST /api/payment-plans", payload: { lease_id: "${lease}", charge_ids: ["${dc}"], installment_count: 2, first_installment_date: "2026-08-15", expected_lease_version: "${lv}" }, as: LeasingAgent, captures: { p1: $.data.id } }
            - { call: "POST /api/payment-plans", payload: { lease_id: "${lease}", charge_ids: ["${dc}"], installment_count: 3, first_installment_date: "2026-08-20", expected_lease_version: "${lv}" }, as: LeasingAgent, captures: { err: $.data.error_id } }
            - { call: "GET /api/leases/${lease}/payment-plans", as: PropertyManager }
          assert:
            - "first create succeeds (201)"
            - "captured err == ERR_STALE_VERSION with HTTP 412"
            - "exactly one plan exists on the lease and it remains DRAFT"

      - name: supersede_cancels_existing_draft_notice
        claim_type: side_effect_execution
        grounds: ["state_machines.DelinquencyNotice.DRAFT_to_CANCELLED", "entities.DelinquencyNotice.fields.cancel_reason"]
        distinguishing_aspect: "Creating a second notice cancels the first DRAFT with cancel_reason SUPERSEDED — the lease carries at most one DRAFT notice at any time."
        test_recipe:
          setup: ["property PA, ACTIVE lease, RENT 200000 due 2026-08-01; notice N1 DRAFT"]
          setup_api_calls:
            - { call: "POST /api/properties", payload: { name: "Maple Court", state_code: "CA", posting_priority_policy: "FEES_FIRST", late_fee_cap_cents: 5000, nsf_fee_cap_cents: 3500, monthly_waiver_cap_cents: 20000, min_partial_payment_percent: 25, collections_threshold_cents: 10000, notice_cure_period_days: 10, plan_cooling_off_days: 30, plan_setup_fee_cents: 2500, plan_setup_fee_threshold_cents: 20000 }, as: PropertyManager, captures: { prop: $.data.id } }
            - { call: "POST /api/tenants", payload: { full_name: "Terry Tenant", email: "terry@example.com" }, as: LeasingAgent, captures: { ten: $.data.id } }
            - { call: "POST /api/leases", payload: { property_id: "${prop}", primary_tenant_id: "${ten}", unit_label: "101", monthly_rent_cents: 200000, due_day: 1, grace_period_days: 5, late_fee_type: "FLAT", late_fee_flat_cents: 4000, term_start_date: "2026-08-01", term_end_date: "2027-07-31" }, as: PropertyManager, captures: { lease: $.data.id } }
            - { call: "POST /api/leases/${lease}/charges", payload: { kind: "RENT", period_start_date: "2026-08-01", period_end_date: "2026-08-31", due_date: "2026-08-01", amount_cents: 200000 }, as: LeasingAgent, captures: { rc: $.data.id } }
            - { call: "POST /api/leases/${lease}/transition", payload: { action: "ACTIVATE" }, as: PropertyManager }
            - { call: "GET /api/leases/${lease}", as: PropertyManager, captures: { lv: $.data.version } }
            - { call: "POST /api/notices", payload: { lease_id: "${lease}", charge_ids: ["${rc}"], expected_lease_version: "${lv}" }, as: PropertyManager, captures: { n1: $.data.id } }
            - { call: "GET /api/leases/${lease}", as: PropertyManager, captures: { lv2: $.data.version } }
          trigger:
            - { call: "POST /api/notices", payload: { lease_id: "${lease}", charge_ids: ["${rc}"], expected_lease_version: "${lv2}" }, as: PropertyManager, captures: { n2: $.data.id } }
            - { call: "GET /api/leases/${lease}/notices", as: PropertyManager }
          assert:
            - "notice list has 2 entries: ${n1} CANCELLED with cancel_reason SUPERSEDED; ${n2} DRAFT with cancel_reason null"
            - "each creation advanced the lease version by exactly 1 (lv2 == lv + 1)"

      - name: supersede_cancels_existing_draft_plan
        claim_type: side_effect_execution
        grounds: ["state_machines.PaymentPlan.DRAFT_to_CANCELLED", "entities.PaymentPlan.fields.cancel_reason"]
        distinguishing_aspect: "Creating a second plan cancels the first DRAFT plan with cancel_reason SUPERSEDED — at most one DRAFT plan per lease."
        test_recipe:
          setup: ["property PA, ACTIVE lease, DAMAGE_FEE 10000; plan P1 DRAFT"]
          setup_api_calls:
            - { call: "POST /api/properties", payload: { name: "Maple Court", state_code: "CA", posting_priority_policy: "FEES_FIRST", late_fee_cap_cents: 5000, nsf_fee_cap_cents: 3500, monthly_waiver_cap_cents: 20000, min_partial_payment_percent: 25, collections_threshold_cents: 10000, notice_cure_period_days: 10, plan_cooling_off_days: 30, plan_setup_fee_cents: 2500, plan_setup_fee_threshold_cents: 20000 }, as: PropertyManager, captures: { prop: $.data.id } }
            - { call: "POST /api/tenants", payload: { full_name: "Terry Tenant", email: "terry@example.com" }, as: LeasingAgent, captures: { ten: $.data.id } }
            - { call: "POST /api/leases", payload: { property_id: "${prop}", primary_tenant_id: "${ten}", unit_label: "101", monthly_rent_cents: 200000, due_day: 1, grace_period_days: 5, late_fee_type: "FLAT", late_fee_flat_cents: 4000, term_start_date: "2026-08-01", term_end_date: "2027-07-31" }, as: PropertyManager, captures: { lease: $.data.id } }
            - { call: "POST /api/leases/${lease}/charges", payload: { kind: "DAMAGE_FEE", period_start_date: "2026-08-01", period_end_date: "2026-08-31", due_date: "2026-08-01", amount_cents: 10000 }, as: LeasingAgent, captures: { dc: $.data.id } }
            - { call: "POST /api/leases/${lease}/transition", payload: { action: "ACTIVATE" }, as: PropertyManager }
            - { call: "GET /api/leases/${lease}", as: PropertyManager, captures: { lv: $.data.version } }
            - { call: "POST /api/payment-plans", payload: { lease_id: "${lease}", charge_ids: ["${dc}"], installment_count: 2, first_installment_date: "2026-08-15", expected_lease_version: "${lv}" }, as: LeasingAgent, captures: { p1: $.data.id } }
            - { call: "GET /api/leases/${lease}", as: PropertyManager, captures: { lv2: $.data.version } }
          trigger:
            - { call: "POST /api/payment-plans", payload: { lease_id: "${lease}", charge_ids: ["${dc}"], installment_count: 3, first_installment_date: "2026-08-20", expected_lease_version: "${lv2}" }, as: LeasingAgent, captures: { p2: $.data.id } }
            - { call: "GET /api/payment-plans/${p1}", as: PropertyManager, captures: { s1: $.data.status, r1: $.data.cancel_reason } }
            - { call: "GET /api/payment-plans/${p2}", as: PropertyManager, captures: { s2: $.data.status } }
          assert:
            - "captured s1 == CANCELLED with r1 == SUPERSEDED"
            - "captured s2 == DRAFT"

      - name: nsf_after_moveout_creates_pending_referral
        claim_type: cascade_chain
        grounds: ["state_machines.Payment.POSTED_to_RETURNED", "state_machines.Lease.ACTIVE_to_ENDED", "calculations.move_out_reconciliation"]
        distinguishing_aspect: "Move-out with a fully paid ledger creates NO referral (chronological balance 0 after netting the payment); a later NSF return on the ENDED lease is still accepted, restores the rent charge, and creates a PENDING referral carrying the prorated 122581 chronological balance."
        test_recipe:
          setup: ["property PA, lease ACTIVE with RENT 200000 period 2026-08-01..2026-08-31 due 2026-08-01; ACH payment 200000 POSTED 2026-08-01; move-out 2026-08-20; clock then 2026-08-21"]
          setup_api_calls:
            - { call: "POST /api/properties", payload: { name: "Maple Court", state_code: "CA", posting_priority_policy: "FEES_FIRST", late_fee_cap_cents: 5000, nsf_fee_cap_cents: 3500, monthly_waiver_cap_cents: 20000, min_partial_payment_percent: 25, collections_threshold_cents: 10000, notice_cure_period_days: 10, plan_cooling_off_days: 30, plan_setup_fee_cents: 2500, plan_setup_fee_threshold_cents: 20000 }, as: PropertyManager, captures: { prop: $.data.id } }
            - { call: "POST /api/tenants", payload: { full_name: "Terry Tenant", email: "terry@example.com" }, as: LeasingAgent, captures: { ten: $.data.id } }
            - { call: "POST /api/leases", payload: { property_id: "${prop}", primary_tenant_id: "${ten}", unit_label: "101", monthly_rent_cents: 200000, due_day: 1, grace_period_days: 5, late_fee_type: "FLAT", late_fee_flat_cents: 4000, term_start_date: "2026-08-01", term_end_date: "2027-07-31" }, as: PropertyManager, captures: { lease: $.data.id } }
            - { call: "POST /api/leases/${lease}/charges", payload: { kind: "RENT", period_start_date: "2026-08-01", period_end_date: "2026-08-31", due_date: "2026-08-01", amount_cents: 200000 }, as: LeasingAgent, captures: { rc: $.data.id } }
            - { call: "POST /api/leases/${lease}/transition", payload: { action: "ACTIVATE" }, as: PropertyManager }
            - { call: "POST /api/payments", payload: { lease_id: "${lease}", tenant_id: "${ten}", channel: "ACH", amount_cents: 200000, received_date: "2026-08-01" }, as: LeasingAgent, captures: { pay: $.data.id } }
            - { call: "POST /api/payments/${pay}/transition", payload: { action: "POST" }, as: LeasingAgent }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: SystemOps }
            - { call: "POST /api/leases/${lease}/transition", payload: { action: "MOVE_OUT", move_out_date: "2026-08-20" }, as: PropertyManager }
            - { call: "GET /api/leases/${lease}/collections-referrals", as: PropertyManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-21T00:00:00Z" }, as: SystemOps }
          trigger:
            - { call: "POST /api/payments/${pay}/transition", payload: { action: "RETURN", reason_code: "NSF", nsf_fee_cents: 3000 }, as: LeasingAgent, captures: { pst: $.data.status } }
            - { call: "GET /api/leases/${lease}/collections-referrals", as: PropertyManager, captures: { rbal: "$.data[0].referred_balance_cents", rst: "$.data[0].status" } }
            - { call: "GET /api/leases/${lease}/charges", as: PropertyManager }
          assert:
            - "before the return, the referrals list is empty (paid ledger => chronological balance 0 => no referral created)"
            - "captured pst == RETURNED (RETURN is legal on an ENDED lease)"
            - "captured rst == PENDING and rbal == 122581 (prorated August rent, payment now reversed; the 3000 NSF fee due 2026-08-21 is after the 2026-08-20 move-out and excluded from the chronological balance)"
            - "rent charge ${rc} is OPEN with outstanding 200000"

      - name: clock_default_applies_to_received_date
        claim_type: defaults
        grounds: ["endpoints['POST /api/_clock/set_current_utc']", "entities.Payment.fields.received_date"]
        distinguishing_aspect: "Without any clock-set call the logical clock is exactly 2026-08-01T00:00:00Z: a payment created with no received_date is stamped 2026-08-01, proving the fixed default rather than wall-clock time."
        test_recipe:
          setup: ["property PA, ACTIVE lease, RENT 200000 due 2026-08-01; no clock call made"]
          setup_api_calls:
            - { call: "POST /api/properties", payload: { name: "Maple Court", state_code: "CA", posting_priority_policy: "FEES_FIRST", late_fee_cap_cents: 5000, nsf_fee_cap_cents: 3500, monthly_waiver_cap_cents: 20000, min_partial_payment_percent: 25, collections_threshold_cents: 10000, notice_cure_period_days: 10, plan_cooling_off_days: 30, plan_setup_fee_cents: 2500, plan_setup_fee_threshold_cents: 20000 }, as: PropertyManager, captures: { prop: $.data.id } }
            - { call: "POST /api/tenants", payload: { full_name: "Terry Tenant", email: "terry@example.com" }, as: LeasingAgent, captures: { ten: $.data.id } }
            - { call: "POST /api/leases", payload: { property_id: "${prop}", primary_tenant_id: "${ten}", unit_label: "101", monthly_rent_cents: 200000, due_day: 1, grace_period_days: 5, late_fee_type: "FLAT", late_fee_flat_cents: 4000, term_start_date: "2026-08-01", term_end_date: "2027-07-31" }, as: PropertyManager, captures: { lease: $.data.id } }
            - { call: "POST /api/leases/${lease}/charges", payload: { kind: "RENT", period_start_date: "2026-08-01", period_end_date: "2026-08-31", due_date: "2026-08-01", amount_cents: 200000 }, as: LeasingAgent }
            - { call: "POST /api/leases/${lease}/transition", payload: { action: "ACTIVATE" }, as: PropertyManager }
          trigger:
            - { call: "POST /api/payments", payload: { lease_id: "${lease}", tenant_id: "${ten}", channel: "CARD", amount_cents: 200000 }, as: LeasingAgent, captures: { rd: $.data.received_date } }
          assert:
            - "captured rd == '2026-08-01' (default logical clock date applied)"

  - section: consistency_model
    instances:
      - name: immediate_read_after_write_consistency
        claim_type: immediate_consistency
        grounds: ["complexity_profile.consistency_model"]
        distinguishing_aspect: "The immediate model means a payment POST is fully visible in the very next reads: the payment shows POSTED and the charge shows the reduced outstanding with no delay or reconciliation lag."
        test_recipe:
          setup: ["property PA, ACTIVE lease, RENT 200000 due 2026-08-01; PENDING payment 50000"]
          setup_api_calls:
            - { call: "POST /api/properties", payload: { name: "Maple Court", state_code: "CA", posting_priority_policy: "FEES_FIRST", late_fee_cap_cents: 5000, nsf_fee_cap_cents: 3500, monthly_waiver_cap_cents: 20000, min_partial_payment_percent: 25, collections_threshold_cents: 10000, notice_cure_period_days: 10, plan_cooling_off_days: 30, plan_setup_fee_cents: 2500, plan_setup_fee_threshold_cents: 20000 }, as: PropertyManager, captures: { prop: $.data.id } }
            - { call: "POST /api/tenants", payload: { full_name: "Terry Tenant", email: "terry@example.com" }, as: LeasingAgent, captures: { ten: $.data.id } }
            - { call: "POST /api/leases", payload: { property_id: "${prop}", primary_tenant_id: "${ten}", unit_label: "101", monthly_rent_cents: 200000, due_day: 1, grace_period_days: 5, late_fee_type: "FLAT", late_fee_flat_cents: 4000, term_start_date: "2026-08-01", term_end_date: "2027-07-31" }, as: PropertyManager, captures: { lease: $.data.id } }
            - { call: "POST /api/leases/${lease}/charges", payload: { kind: "RENT", period_start_date: "2026-08-01", period_end_date: "2026-08-31", due_date: "2026-08-01", amount_cents: 200000 }, as: LeasingAgent, captures: { rc: $.data.id } }
            - { call: "POST /api/leases/${lease}/transition", payload: { action: "ACTIVATE" }, as: PropertyManager }
            - { call: "POST /api/payments", payload: { lease_id: "${lease}", tenant_id: "${ten}", channel: "CARD", amount_cents: 50000, received_date: "2026-08-01" }, as: LeasingAgent, captures: { pay: $.data.id } }
          trigger:
            - { call: "POST /api/payments/${pay}/transition", payload: { action: "POST" }, as: LeasingAgent, captures: { st: $.data.status } }
            - { call: "GET /api/payments/${pay}", as: PropertyManager, captures: { st2: $.data.status, pd: $.data.posted_date } }
            - { call: "GET /api/leases/${lease}/charges", as: PropertyManager, captures: { out: "$.data[0].outstanding_cents", cst: "$.data[0].status" } }
            - { call: "GET /api/allocations", payload: { payment_id: "${pay}" }, as: PropertyManager }
          assert:
            - "captured st == POSTED and the immediate re-read shows st2 == POSTED with pd == '2026-08-01'"
            - "charge read immediately after shows out == 150000 and cst == PARTIALLY_PAID"
            - "the APPLY allocation of 50000 is visible immediately"

  # ---- Exclusion stubs: corners already covered by §1.8 difficulty instances ----
  - section: calculations
    instances:
      - name: late_fee_formula_golden_value_covered
        claim_type: correct_result
        grounds: ["calculations.late_fee_assessment"]
        excluded_because:
          difficulty_instance: "combinatorial_formula / late_fee_min_max_branch_formula"
          rationale: "The FLAT/PERCENT_PLUS_DAILY golden values, cap clamp, and constants are asserted there with precomputed literals."

      - name: waterfall_golden_split_covered
        claim_type: correct_result
        grounds: ["calculations.payment_waterfall_allocation"]
        excluded_because:
          difficulty_instance: "dual_variant_calc / waterfall_fees_first_vs_rent_first"
          rationale: "Both waterfall policy variants are asserted with exact per-charge allocation literals there."

      - name: ledger_read_variants_covered
        claim_type: correct_result
        grounds: ["calculations.move_out_reconciliation", "endpoints['GET /api/leases/{id}/ledger']"]
        excluded_because:
          difficulty_instance: "dual_variant_calc / moveout_forward_vs_chronological_balance"
          rationale: "The computed read's forward and chronological values are asserted with literals (400000 vs 122581) there."

      - name: grace_boundary_covered
        claim_type: boundary_edge
        grounds: ["calculations.late_fee_assessment"]
        excluded_because:
          difficulty_instance: "boundary_precision_check / grace_period_last_day_no_fee"
          rationale: "The inclusive grace-edge (sweep on due+grace vs one day later) is the named boundary instance."
