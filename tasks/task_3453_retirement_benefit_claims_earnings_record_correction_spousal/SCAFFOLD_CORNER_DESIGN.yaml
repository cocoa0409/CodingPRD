- section: rbac
  instances:
  - name: rbac_employer_cannot_approve_claim
    claim_type: role_exclusive_denial
    grounds:
    - roles[ClaimsSpecialist]
    - errors[ERR_UNAUTHORIZED_ROLE]
    distinguishing_aspect: Claim approval is exclusive to ClaimsSpecialist; the Employer role is rejected with 403 before any state check.
    test_recipe:
      setup:
      - Worker wrb1 with a FILED claim
      setup_api_calls:
      - call: POST /ssa/workers
        payload:
          full_name: Rbac One
          birth_year: 1964
          birth_month: 6
        as: ClaimsSpecialist
        captures:
          wrb1: $.data.id
          wrb1_ver: $.data.version
      - call: POST /ssa/claims
        payload:
          worker_id: ${wrb1}
          claim_type: RETIREMENT
          entitlement_month: 2026-06
        as: Claimant
        as_user_id: ${wrb1}
        captures:
          crb1: $.data.id
      trigger:
      - call: POST /ssa/claims/${crb1}/approve
        payload: {}
        as: Employer
        captures:
          err: $.data.error_id
      assert:
      - Response is 403 ERR_UNAUTHORIZED_ROLE; claim remains FILED
  - name: rbac_claimant_cannot_verify_relationship
    claim_type: role_exclusive_denial
    grounds:
    - roles[ClaimsSpecialist]
    - errors[ERR_UNAUTHORIZED_ROLE]
    distinguishing_aspect: Relationship verification is ClaimsSpecialist-only; the Claimant who owns the record cannot self-verify.
    test_recipe:
      setup:
      - Workers wrb2/wrb3 with an ASSERTED relationship
      setup_api_calls:
      - call: POST /ssa/workers
        payload:
          full_name: Rbac Two
          birth_year: 1964
          birth_month: 6
        as: ClaimsSpecialist
        captures:
          wrb2: $.data.id
          wrb2_ver: $.data.version
      - call: POST /ssa/workers
        payload:
          full_name: Rbac Three
          birth_year: 1964
          birth_month: 6
        as: ClaimsSpecialist
        captures:
          wrb3: $.data.id
          wrb3_ver: $.data.version
      - call: POST /ssa/relationships
        payload:
          worker_id: ${wrb2}
          spouse_worker_id: ${wrb3}
          relationship_type: CURRENT_SPOUSE
          marriage_date: '2000-01-01'
        as: ClaimsSpecialist
        captures:
          relrb: $.data.id
      trigger:
      - call: POST /ssa/relationships/${relrb}/verify
        payload: {}
        as: Claimant
        as_user_id: ${wrb3}
        captures:
          err: $.data.error_id
      assert:
      - Response is 403 ERR_UNAUTHORIZED_ROLE; relationship remains ASSERTED
  - name: rbac_senior_adjudicator_cannot_deny_claim
    claim_type: role_exclusive_denial
    grounds:
    - roles[SeniorAdjudicator]
    - roles[ClaimsSpecialist]
    distinguishing_aspect: 'Segregation is bidirectional: the second-instance SeniorAdjudicator cannot perform the first-instance deny, which
      is exclusive to ClaimsSpecialist.'
    test_recipe:
      setup:
      - Worker wrb4 with a FILED claim
      setup_api_calls:
      - call: POST /ssa/workers
        payload:
          full_name: Rbac Four
          birth_year: 1964
          birth_month: 6
        as: ClaimsSpecialist
        captures:
          wrb4: $.data.id
          wrb4_ver: $.data.version
      - call: POST /ssa/claims
        payload:
          worker_id: ${wrb4}
          claim_type: RETIREMENT
          entitlement_month: 2026-06
        as: Claimant
        as_user_id: ${wrb4}
        captures:
          crb4: $.data.id
      trigger:
      - call: POST /ssa/claims/${crb4}/deny
        payload:
          denial_reason: overreach
        as: SeniorAdjudicator
        as_user_id: sen-1
        captures:
          err: $.data.error_id
      assert:
      - Response is 403 ERR_UNAUTHORIZED_ROLE; claim remains FILED
  - name: rbac_claimant_cannot_read_other_workers_record
    claim_type: ownership
    grounds:
    - roles[Claimant]
    - validations[priority=3]
    - errors[ERR_FORBIDDEN_OWNERSHIP]
    distinguishing_aspect: 'Entity-backed identity: a Claimant''s X-User-ID must equal the target worker id; reading another worker''s record
      is 403 ERR_FORBIDDEN_OWNERSHIP (not 404).'
    test_recipe:
      setup:
      - Workers wrb5 and wrb6 exist
      setup_api_calls:
      - call: POST /ssa/workers
        payload:
          full_name: Rbac Five
          birth_year: 1964
          birth_month: 6
        as: ClaimsSpecialist
        captures:
          wrb5: $.data.id
          wrb5_ver: $.data.version
      - call: POST /ssa/workers
        payload:
          full_name: Rbac Six
          birth_year: 1964
          birth_month: 6
        as: ClaimsSpecialist
        captures:
          wrb6: $.data.id
          wrb6_ver: $.data.version
      trigger:
      - call: GET /ssa/workers/${wrb6}
        payload: {}
        as: Claimant
        as_user_id: ${wrb5}
        captures:
          err: $.data.error_id
      assert:
      - Response is 403 ERR_FORBIDDEN_OWNERSHIP
      - The same read as ClaimsSpecialist would return 200
  - name: rbac_missing_auth_headers_returns_401
    claim_type: role_exclusive_denial
    grounds:
    - validations[priority=1]
    - errors[ERR_UNAUTHENTICATED]
    distinguishing_aspect: Requests without X-User-Role / X-User-ID headers fail authentication at priority 1 with 401 — before role, ownership,
      or existence checks. (The trigger call is sent with the auth headers stripped; the 'as' value is a placeholder for the harness, not a header.)
    test_recipe:
      setup:
      - A worker exists so that existence would otherwise pass
      setup_api_calls:
      - call: POST /ssa/workers
        payload:
          full_name: Rbac Seven
          birth_year: 1964
          birth_month: 6
        as: ClaimsSpecialist
        captures:
          wrb7: $.data.id
          wrb7_ver: $.data.version
      trigger:
      - call: GET /ssa/workers/${wrb7}
        payload: {}
        as: Anonymous
        captures:
          err: $.data.error_id
      assert:
      - Response is 401 ERR_UNAUTHENTICATED
- section: cross_cutting_layers
  instances:
  - name: occ_suspend_with_stale_version_after_recompute_returns_412
    claim_type: optimistic_concurrency
    grounds:
    - concurrency_rules[claim-suspend-stale-view]
    - errors[ERR_STALE_VERSION]
    distinguishing_aspect: Recording a pension (PATCH worker) cascades a WEP recomputation that bumps the claim's version from 2 to 3; a suspend
      carrying the pre-PATCH version 2 is rejected 412, while the fresh version suspends cleanly.
    test_recipe:
      setup:
      - Worker wl1 (3 years, RETIREMENT at FRA 2031-06, monthly 12510) ENTITLED; claim version 2 after approve
      setup_api_calls:
      - call: POST /ssa/workers
        payload:
          full_name: Occ Suspend
          birth_year: 1964
          birth_month: 6
        as: ClaimsSpecialist
        captures:
          wl1: $.data.id
          wl1_ver: $.data.version
      - call: POST /ssa/wage-reports
        payload:
          worker_id: ${wl1}
          employer_name: Acme Corp
          tax_year: 2021
          amount_cents: 1875000
        as: Employer
      - call: POST /ssa/wage-reports
        payload:
          worker_id: ${wl1}
          employer_name: Acme Corp
          tax_year: 2022
          amount_cents: 1900000
        as: Employer
      - call: POST /ssa/wage-reports
        payload:
          worker_id: ${wl1}
          employer_name: Acme Corp
          tax_year: 2023
          amount_cents: 1925000
        as: Employer
      - call: POST /ssa/claims
        payload:
          worker_id: ${wl1}
          claim_type: RETIREMENT
          entitlement_month: 2031-06
        as: Claimant
        as_user_id: ${wl1}
        captures:
          cl1: $.data.id
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2031-06-15T00:00:00Z'
        as: ProgramAdministrator
      - call: POST /ssa/claims/${cl1}/approve
        payload: {}
        as: ClaimsSpecialist
        captures:
          cl1_ver: $.data.version
      - call: PATCH /ssa/workers/${wl1}
        payload:
          noncovered_pension_monthly_cents: 60000
          noncovered_pension_start_month: 2030-01
          expected_worker_version: ${wl1_ver}
        as: ClaimsSpecialist
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2031-08-01T00:00:00Z'
        as: ProgramAdministrator
      trigger:
      - call: POST /ssa/claims/${cl1}/suspend
        payload:
          expected_claim_version: ${cl1_ver}
        as: Claimant
        as_user_id: ${wl1}
        captures:
          err: $.data.error_id
      - call: GET /ssa/claims/${cl1}
        payload: {}
        as: ClaimsSpecialist
        captures:
          cl1_fresh: $.data.version
      - call: POST /ssa/claims/${cl1}/suspend
        payload:
          expected_claim_version: ${cl1_fresh}
        as: Claimant
        as_user_id: ${wl1}
      assert:
      - 'Stale suspend: 412 ERR_STALE_VERSION (claim version advanced by the recomputation side effect)'
      - 'The pension PATCH also recomputed the benefit: monthly_benefit_cents == 5560 (WEP 0.40 factor, guarantee not binding)'
      - 'Fresh suspend succeeds: status == SUSPENDED'
  - name: occ_waiver_with_stale_version_returns_412
    claim_type: optimistic_concurrency
    grounds:
    - concurrency_rules[overpayment-waiver-stale-view]
    - errors[ERR_STALE_VERSION]
    distinguishing_aspect: A waiver request carrying expected_overpayment_version one behind the current version is rejected 412; the exact current
      version succeeds.
    test_recipe:
      setup:
      - Worker wl2 with FILED claim; overpayment case (version 1) in its 30-day window
      setup_api_calls:
      - call: POST /ssa/workers
        payload:
          full_name: Occ Waiver
          birth_year: 1964
          birth_month: 6
        as: ClaimsSpecialist
        captures:
          wl2: $.data.id
          wl2_ver: $.data.version
      - call: POST /ssa/claims
        payload:
          worker_id: ${wl2}
          claim_type: RETIREMENT
          entitlement_month: 2026-06
        as: Claimant
        as_user_id: ${wl2}
        captures:
          cl2: $.data.id
      - call: POST /ssa/overpayment-cases
        payload:
          claim_id: ${cl2}
          amount_cents: 8000
          period_start_month: 2026-06
          period_end_month: 2026-06
          reason: SYSTEM_ERROR
        as: ClaimsSpecialist
        captures:
          ocl2: $.data.id
          ocl2_ver: $.data.version
      trigger:
      - call: POST /ssa/overpayment-cases/${ocl2}/request-waiver
        payload:
          expected_overpayment_version: ${ocl2_ver} - 1
          waiver_grounds: stale view
        as: Claimant
        as_user_id: ${wl2}
        captures:
          err: $.data.error_id
      - call: POST /ssa/overpayment-cases/${ocl2}/request-waiver
        payload:
          expected_overpayment_version: ${ocl2_ver}
          waiver_grounds: without fault
        as: Claimant
        as_user_id: ${wl2}
      assert:
      - 'Stale request: 412 ERR_STALE_VERSION'
      - 'Fresh request: 200, OverpaymentCase.${ocl2}.status == WAIVER_REVIEW'
  - name: occ_worker_pension_patch_with_stale_version_returns_412
    claim_type: optimistic_concurrency
    grounds:
    - concurrency_rules[worker-pension-patch-stale-view]
    - errors[ERR_STALE_VERSION]
    distinguishing_aspect: 'Two sequential pension PATCHes: the first (expected_worker_version 1) succeeds and bumps the worker to version 2;
      the second, still carrying version 1, is rejected 412 — OCC resolves the stale write deterministically.'
    test_recipe:
      setup:
      - Worker wl3 freshly created (version 1)
      setup_api_calls:
      - call: POST /ssa/workers
        payload:
          full_name: Occ Patch
          birth_year: 1964
          birth_month: 6
        as: ClaimsSpecialist
        captures:
          wl3: $.data.id
          wl3_ver: $.data.version
      trigger:
      - call: PATCH /ssa/workers/${wl3}
        payload:
          noncovered_pension_monthly_cents: 40000
          noncovered_pension_start_month: 2025-01
          expected_worker_version: ${wl3_ver}
        as: ClaimsSpecialist
      - call: PATCH /ssa/workers/${wl3}
        payload:
          noncovered_pension_monthly_cents: 45000
          noncovered_pension_start_month: 2025-01
          expected_worker_version: ${wl3_ver}
        as: ClaimsSpecialist
        captures:
          err: $.data.error_id
      assert:
      - 'First PATCH: 200, worker.version == 2, pension 40000'
      - 'Second PATCH: 412 ERR_STALE_VERSION; pension stays 40000'
