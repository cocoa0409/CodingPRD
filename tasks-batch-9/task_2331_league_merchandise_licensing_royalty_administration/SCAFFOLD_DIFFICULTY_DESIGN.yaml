          setup:
            - "clock at the mandatory default 2026-08-01T00:00:00Z"
            - "MarkRight LEAGUE_SHIELD (LEAGUE, PRIMARY) and MarkRight CLUB_ATL_ROUNDEL (CLUB, SECONDARY, club ATL) both ACTIVE"
