  - rule_id: non_linear_state_machine
    instances:
      - name: cost_certification_returns_to_submitted_twice_and_locks_after_acceptance
        grounds:
          - state_machines.CostCertification.DRAFT_to_SUBMITTED
          - state_machines.CostCertification.SUBMITTED_to_RETURNED_FOR_REVISION
          - state_machines.CostCertification.RETURNED_FOR_REVISION_to_SUBMITTED
          - state_machines.CostCertification.SUBMITTED_to_ACCEPTED
          - entities.CostCertification.fields.submission_round
          - errors[ERR_COST_CERT_STATE_INVALID]
        distinguishing_aspect: |
          SUBMITTED is re-entered from RETURNED_FOR_REVISION, so the machine is
          not a forward-only line: the entity occupies the same state twice and
          the two visits are distinguishable only by submission_round (1 then 2),
          while ACCEPTED is terminal so a third submit from ACCEPTED is refused
          with ERR_COST_CERT_STATE_INVALID rather than looping again.
        test_recipe:
          setup:
            - "One ACTIVE sponsor and one PLANNING project (total_units 10, total_floor_space_sqft 8500, land 40,000,000, depreciable 360,000,000, election MIN_40_60)."
            - "One DRAFT cost certification with submission_round 0 filed at certified_land_cost_cents 40,000,000 and certified_depreciable_basis_cents 360,000,000."
            - "The project has no bond issue and therefore no funded draw proceeds."
          setup_api_calls:
            - call: "POST /developers"
              payload: { name: "Harborview Partners", tax_id: "81-1000001", contact_email: "ops@harborview.test" }
              as: HfaAllocationOfficer
              captures: { dev_id: $.data.id }
            - call: "POST /projects"
              payload: { developer_id: "${dev_id}", name: "Harborview Commons", total_units: 10, total_floor_space_sqft: 8500, land_cost_cents: 40000000, depreciable_basis_cents: 360000000, set_aside_election: "MIN_40_60" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { proj_id: $.data.id }
            - call: "POST /cost-certifications"
              payload: { project_id: "${proj_id}", certified_land_cost_cents: 40000000, certified_depreciable_basis_cents: 360000000, certified_eligible_basis_cents: 355000000, preparer_name: "Nolan CPA" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { cc_id: $.data.id }
          trigger:
            - call: "POST /cost-certifications/${cc_id}/submit"
              payload: {}
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /cost-certifications/${cc_id}/review"
              payload: { decision: "RETURN", deficiency_notes: "Developer fee schedule missing" }
              as: HfaAllocationOfficer
              as_user_id: "hfa-alloc-2"
            - call: "POST /cost-certifications/${cc_id}/submit"
              payload: { certified_land_cost_cents: 42000000, certified_depreciable_basis_cents: 358000000 }
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /cost-certifications/${cc_id}/review"
              payload: { decision: "ACCEPT" }
              as: HfaAllocationOfficer
              as_user_id: "hfa-alloc-2"
            - call: "POST /cost-certifications/${cc_id}/submit"
              payload: {}
              as: Developer
              as_user_id: "${dev_id}"
          assert:
            - "after the first submit, CostCertification.${cc_id}.status == SUBMITTED and submission_round == 1"
            - "after the RETURN review, CostCertification.${cc_id}.status == RETURNED_FOR_REVISION and deficiency_notes == \"Developer fee schedule missing\""
            - "after the second submit, CostCertification.${cc_id}.status == SUBMITTED and submission_round == 2"
            - "after the second submit, CostCertification.${cc_id}.certified_aggregate_basis_cents == 400000000"
            - "after the ACCEPT review, CostCertification.${cc_id}.status == ACCEPTED and reviewed_by_user_id == \"hfa-alloc-2\""
            - "the ACCEPT review writes Project.${proj_id}.final_fifty_percent_ratio_bps == 0 because no draw of this project has ever been funded"
            - "Project.${proj_id}.automatic_credit_triggered == false"
            - "the third submit returns HTTP 409 with error_id == ERR_COST_CERT_STATE_INVALID and submission_round stays 2"

      - name: volume_cap_allocation_reenters_pending_from_denied_and_from_deferred_with_a_rising_round
        grounds:
          - state_machines.VolumeCapAllocation.PENDING_to_DENIED
          - state_machines.VolumeCapAllocation.DENIED_to_PENDING
          - state_machines.VolumeCapAllocation.PENDING_to_DEFERRED
          - state_machines.VolumeCapAllocation.DEFERRED_to_PENDING
          - state_machines.VolumeCapAllocation.PENDING_to_AWARDED
          - entities.VolumeCapAllocation.fields.decision_round
          - entities.Project.fields.volume_cap_deferral_count
          - calculations.cap_pool_availability
          - concurrency_rules[award-decision-stale-cap-pool]
        distinguishing_aspect: |
          PENDING is re-entered along TWO different back-edges - from DENIED after
          a sponsor revision and from DEFERRED after the pool exhausted - so the
          state graph has cycles, and the second allocation's DEFERRED state is
          not requested by anyone but produced as a side effect of a DIFFERENT
          allocation's award, which no forward-only reading of the machine
          predicts.
        test_recipe:
          setup:
            - "One ACTIVE sponsor with two PLANNING projects, Harborview Commons and Cedar Yard."
            - "One 2026 cap pool with base_cap_cents 500,000,000 and no carryforward, so total_cap_cents is 500,000,000 and pool_status is OPEN."
