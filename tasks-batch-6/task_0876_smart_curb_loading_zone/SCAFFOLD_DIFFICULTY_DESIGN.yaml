            - { call: "POST /curb/permits", payload: { permittee_id: "${pm_id}", requested_designation: "LOADING", purpose: "A", zone_ids: ["${z3}"] }, as: Permittee, as_user_id: "${pm_id}", captures: { permit_a: $.data.id } }
            - { call: "POST /curb/permits/${permit_a}/submit", payload: {}, as: Permittee, as_user_id: "${pm_id}" }
            - { call: "POST /curb/permits/${permit_a}/review", payload: {}, as: CurbPlanner, as_user_id: "planner1" }
            - { call: "POST /curb/permits/${permit_a}/approve", payload: {}, as: PermitApprover, as_user_id: "approver1" }
