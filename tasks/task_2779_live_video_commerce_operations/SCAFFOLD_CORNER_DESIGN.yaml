          trigger:
            - call: "POST /disclosure-records/${d1}/acknowledge"
              payload: { script_code_spoken: "SCRIPT-PAID-01" }
              as: Host
              as_user_id: "${h2}"
              captures: { e_owner2: $.data.error_id }
          assert:
            - "HTTP 403 with ${e_owner2} == ERR_NOT_RESOURCE_OWNER"
            - "DisclosureRecord.${d1}: status == PENDING, acknowledged_at == null, acknowledged_late == false"

      - name: moderator_cannot_submit_interactions_or_list_carts
        claim_type: peer_role_boundary
        grounds:
          - validations[priority=2]
          - errors[ERR_ROLE_NOT_PERMITTED]
          - endpoints[POST /interactions]
          - endpoints[GET /carts]
        distinguishing_aspect: "The Moderator's authority is scoped to deciding on interactions, not to creating them or reading commerce data: both POST /interactions and GET /carts return 403 ERR_ROLE_NOT_PERMITTED, while the same moderator's moderate call on the viewer's chat succeeds."
        test_recipe:
          setup:
            - "Show LIVE at 18:10Z with one PENDING_MODERATION chat from viewer 1."
          setup_api_calls:
            - *k_clock_t0
            - *k_host
            - *k_cert
            - *k_viewer1
            - *k_product
            - *k_substantiate
            - *k_show
            - *k_booking
            - *k_confirm
            - *k_slot
            - *k_channel
            - *k_provision
            - *k_health_ok
            - *k_ready
            - *k_clock_prelive
            - *k_golive
            - *k_clock_live
            - call: "POST /interactions"
              payload: { show_id: "${sh1}", kind: "CHAT", body: "is it in stock?" }
              as: Viewer
              as_user_id: "${v1}"
              captures: { chP: $.data.id }
          trigger:
            - call: "POST /interactions"
              payload: { show_id: "${sh1}", kind: "CHAT", body: "moderator speaking" }
              as: Moderator
              captures: { e_role2: $.data.error_id }
            - call: "GET /carts"
              payload: { show_id: "${sh1}" }
              as: Moderator
              captures: { e_role3: $.data.error_id }
            - call: "POST /interactions/${chP}/moderate"
              payload: { action: "APPROVE" }
              as: Moderator
          assert:
            - "Both refusals return HTTP 403 with ${e_role2} == ${e_role3} == ERR_ROLE_NOT_PERMITTED"
            - "GET /interactions?show_id=${sh1} shows exactly one row (the viewer's), so the moderator's submit created nothing"
            - "The moderate call returns 200 with Interaction.${chP}.state == APPROVED and moderated_at == 2026-08-10T18:10:00Z"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: flash_offer_create_with_a_stale_lineup_slot_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.flash-offer-create-stale-slot
          - errors[ERR_STALE_LINEUP_SLOT_VERSION]
          - state_machines.FlashOffer.SCHEDULED_to_SUPERSEDED
        distinguishing_aspect: "Creating the first offer bumps LineupSlot.version, so a second create replaying the version the client originally read returns 412 ERR_STALE_LINEUP_SLOT_VERSION; re-reading the slot and resubmitting succeeds and supersedes the older offer."
        test_recipe:
          setup:
            - "One DRAFT show with a lineup slot; the version captured at slot creation is used for the first offer and then deliberately replayed."
          setup_api_calls:
            - *k_clock_t0
            - *k_product
            - *k_show
            - *k_slot
            - call: "POST /flash-offers"
              payload: { lineup_slot_id: "${sl1}", offer_price_cents: 3500, window_start_at: "2026-08-10T18:00:00Z", window_end_at: "2026-08-10T18:30:00Z", max_qty: 10, expected_lineup_slot_version: "${sl1_v}" }
              as: MerchandisingManager
              captures: { oC1: $.data.id }
          trigger:
            - call: "POST /flash-offers"
              payload: { lineup_slot_id: "${sl1}", offer_price_cents: 3300, window_start_at: "2026-08-10T18:35:00Z", window_end_at: "2026-08-10T19:00:00Z", max_qty: 8, expected_lineup_slot_version: "${sl1_v}" }
              as: MerchandisingManager
              captures: { e_stale: $.data.error_id }
            - call: "GET /lineup-slots/${sl1}"
              payload: {}
              as: MerchandisingManager
              captures: { sl1_v3: $.data.version }
            - call: "POST /flash-offers"
              payload: { lineup_slot_id: "${sl1}", offer_price_cents: 3300, window_start_at: "2026-08-10T18:35:00Z", window_end_at: "2026-08-10T19:00:00Z", max_qty: 8, expected_lineup_slot_version: "${sl1_v3}" }
              as: MerchandisingManager
              captures: { oC2: $.data.id }
          assert:
            - "Stale create: HTTP 412 with ${e_stale} == ERR_STALE_LINEUP_SLOT_VERSION; GET /flash-offers?lineup_slot_id=${sl1} still returns exactly 1 item"
            - "${sl1_v3} is greater than ${sl1_v} — the first create incremented the parent slot's version"
            - "Fresh create: HTTP 201; FlashOffer.${oC2}.status == SCHEDULED and FlashOffer.${oC1}.status == SUPERSEDED with superseded_by_offer_id == ${oC2}"

      - name: cart_version_increments_on_every_accepted_write_only
        claim_type: optimistic_concurrency
        grounds:
          - entities.Cart.fields.version
          - complexity_profile.complexity_layers[optimistic_concurrency]
        distinguishing_aspect: "Cart.version advances by exactly one per accepted write (add, abandon, recover) and is untouched by a rejected add, which is what makes the checkout OCC token meaningful."
        test_recipe:
          setup:
            - "Show LIVE at 18:10Z with an ACTIVE 3500-cent offer capped at 10 units and viewer 1's fresh OPEN cart."
          setup_api_calls:
            - *k_clock_t0
            - *k_host
            - *k_cert
            - *k_viewer1
            - *k_product
            - *k_substantiate
            - *k_show
            - *k_booking
            - *k_confirm
            - *k_slot
            - *k_offer
            - *k_channel
            - *k_provision
            - *k_health_ok
            - *k_ready
            - *k_clock_prelive
            - *k_golive
            - *k_clock_live
            - *k_activate
            - *k_cart1
            - call: "GET /carts/${ct1}"
              payload: {}
              as: Viewer
              as_user_id: "${v1}"
              captures: { ctv0: $.data.version }
          trigger:
            - call: "POST /carts/${ct1}/items"
              payload: { flash_offer_id: "${o1}", qty: 2 }
              as: Viewer
              as_user_id: "${v1}"
            - call: "GET /carts/${ct1}"
              payload: {}
              as: Viewer
              as_user_id: "${v1}"
              captures: { ctv1: $.data.version }
            - call: "POST /carts/${ct1}/items"
              payload: { flash_offer_id: "${o1}", qty: 11 }
              as: Viewer
              as_user_id: "${v1}"
              captures: { e_rej: $.data.error_id }
            - call: "GET /carts/${ct1}"
              payload: {}
              as: Viewer
              as_user_id: "${v1}"
              captures: { ctv2: $.data.version }
            - call: "POST /carts/${ct1}/abandon"
              payload: {}
              as: Viewer
              as_user_id: "${v1}"
            - call: "GET /carts/${ct1}"
              payload: {}
              as: Viewer
              as_user_id: "${v1}"
              captures: { ctv3: $.data.version }
            - call: "POST /carts/${ct1}/recover"
              payload: {}
              as: Viewer
              as_user_id: "${v1}"
            - call: "GET /carts/${ct1}"
              payload: {}
              as: Viewer
              as_user_id: "${v1}"
              captures: { ctv4: $.data.version }
          assert:
            - "${ctv1} == ${ctv0} + 1 (add-item)"
            - "The rejected add returns 422 with ${e_rej} == ERR_OFFER_QTY_EXCEEDED and ${ctv2} == ${ctv1} — no bump on failure"
            - "${ctv3} == ${ctv2} + 1 (abandon) and ${ctv4} == ${ctv3} + 1 (recover)"
            - "Cart.${ct1} finally: status == OPEN, recovered_count == 1, held_item_count == 1, pre_discount_subtotal_cents == 7000"

      - name: product_available_qty_reconciles_across_hold_adjustment_commit_and_release
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.inventory_pool_reconciliation
          - endpoints[POST /products/{product_id}/inventory-adjustments]
          - state_machines.Order.AUTHORIZED_to_VOIDED
        distinguishing_aspect: "available_qty is re-derived after four different kinds of write — a hold, a pure on-hand adjustment, a checkout that moves reserved to committed, and an order void that releases it — and INV-1 holds after each one."
        test_recipe:
          setup:
            - "Show LIVE at 18:10Z with an ACTIVE 3500-cent offer on a product holding 50 units; viewer 1 has an OPEN cart."
          setup_api_calls:
            - *k_clock_t0
            - *k_host
            - *k_cert
            - *k_viewer1
            - *k_product
            - *k_substantiate
            - *k_show
            - *k_booking
            - *k_confirm
            - *k_slot
            - *k_offer
            - *k_channel
            - *k_provision
            - *k_health_ok
            - *k_ready
            - *k_clock_prelive
            - *k_golive
            - *k_clock_live
            - *k_activate
            - *k_cart1
          trigger:
            - call: "POST /carts/${ct1}/items"
              payload: { flash_offer_id: "${o1}", qty: 2 }
              as: Viewer
              as_user_id: "${v1}"
              captures: { itD: $.data.id }
            - call: "POST /products/${p1}/inventory-adjustments"
              payload: { reason: "SHRINKAGE", on_hand_delta: -8 }
              as: MerchandisingManager
            - call: "GET /carts/${ct1}"
              payload: {}
              as: Viewer
              as_user_id: "${v1}"
              captures: { ct1_v: $.data.version }
            - call: "POST /carts/${ct1}/checkout"
              payload: { expected_cart_version: "${ct1_v}" }
              as: Viewer
              as_user_id: "${v1}"
              captures: { ordD: $.data.id }
            - call: "POST /orders/${ordD}/cancel"
              payload: { cancel_reason: "VIEWER_REMORSE" }
              as: MerchandisingManager
          assert:
            - "After the hold: Product.${p1} on_hand 50, reserved 2, committed 0, available 48; FlashOffer.${o1} held 2, sold 0, remaining 8"
            - "After the adjustment: on_hand 42, reserved 2, committed 0, available 40 — the adjustment touches neither reserved_qty nor the offer ledger"
            - "After the checkout: on_hand 42, reserved 0, committed 2, available 40 (unchanged by the commit); FlashOffer held 0, sold 2, remaining 8; Order.${ordD} merchandise 6650, tax 582, shipping 599, total 7831"
            - "After the void: on_hand 42, reserved 0, committed 0, available 42; FlashOffer held 0, sold 0, remaining 10; CartItem.${itD}.state == RELEASED"
            - "INV-1 (on_hand == available + reserved + committed) and INV-2 (max_qty == remaining + held + sold) hold after every one of the four writes"

      - name: interaction_listing_combines_filtering_with_pagination
        claim_type: pagination_with_filtering
        grounds:
          - endpoints[GET /interactions]
          - complexity_profile.complexity_layers[pagination_with_filtering]
        distinguishing_aspect: "kind, viewer_id and state filters compose with limit/offset: total_count reports the filtered population (3 chats) rather than all five interactions, and the two pages together return each row exactly once."
        test_recipe:
          setup:
            - "Show LIVE at 18:10Z carrying five interactions: two chats from viewer 1 (one APPROVED, one BLOCKED), one chat from viewer 2, one host poll and one question from viewer 1."
          setup_api_calls:
            - *k_clock_t0
            - *k_host
            - *k_cert
            - *k_viewer1
            - *k_viewer2
            - *k_product
            - *k_substantiate
            - *k_show
            - *k_booking
            - *k_confirm
            - *k_slot
            - *k_channel
            - *k_provision
            - *k_health_ok
            - *k_ready
            - *k_clock_prelive
            - *k_golive
            - *k_clock_live
            - call: "POST /interactions"
              payload: { show_id: "${sh1}", kind: "CHAT", body: "chat one" }
              as: Viewer
              as_user_id: "${v1}"
              captures: { g1: $.data.id }
            - call: "POST /interactions/${g1}/moderate"
              payload: { action: "APPROVE" }
              as: Moderator
            - call: "POST /interactions"
              payload: { show_id: "${sh1}", kind: "CHAT", body: "chat two" }
              as: Viewer
              as_user_id: "${v1}"
              captures: { g2: $.data.id }
            - call: "POST /interactions/${g2}/moderate"
              payload: { action: "BLOCK", blocked_reason: "SPAM" }
              as: Moderator
            - call: "POST /interactions"
              payload: { show_id: "${sh1}", kind: "CHAT", body: "chat three" }
              as: Viewer
              as_user_id: "${v2}"
              captures: { g3: $.data.id }
            - call: "POST /interactions"
              payload: { show_id: "${sh1}", kind: "POLL", body: "Ivory or onyx?", options: ["Ivory", "Onyx"] }
              as: Host
              as_user_id: "${h1}"
              captures: { g4: $.data.id }
            - call: "POST /interactions"
              payload: { show_id: "${sh1}", kind: "QUESTION", body: "Does it shrink?" }
              as: Viewer
              as_user_id: "${v1}"
              captures: { g5: $.data.id }
          trigger:
            - call: "GET /interactions"
              payload: { show_id: "${sh1}", kind: "CHAT", limit: 2, offset: 0 }
              as: Moderator
            - call: "GET /interactions"
              payload: { show_id: "${sh1}", kind: "CHAT", limit: 2, offset: 2 }
              as: Moderator
            - call: "GET /interactions"
              payload: { show_id: "${sh1}", viewer_id: "${v1}", kind: "CHAT" }
              as: Moderator
            - call: "GET /interactions"
              payload: { show_id: "${sh1}", state: "BLOCKED" }
              as: Moderator
            - call: "GET /interactions"
              payload: { show_id: "${sh1}", host_id: "${h1}" }
              as: Moderator
          assert:
            - "Page 1: 2 items, total_count == 3, has_more == true; page 2: 1 item, total_count == 3, has_more == false; the union is exactly {${g1}, ${g2}, ${g3}}"
            - "viewer_id + kind filter returns exactly {${g1}, ${g2}} with total_count == 2"
            - "state == BLOCKED returns exactly {${g2}} with blocked_reason == 'SPAM'; Viewer.${v1}.strike_count == 1 and chat_status == ACTIVE (one strike is below the mute threshold)"
            - "host_id filter returns exactly {${g4}} (the poll), so the unfiltered population of 5 is never leaked into a filtered total_count"

      - name: show_end_cascade_chain
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: show_end_cascade_depth_four
          rationale: "§1.8 verifies the full four-link show-end chain (show -> channels/bookings, offers -> EXPIRED, held cart lines -> RELEASED, fully released carts -> ABANDONED with the counters recomputed) end to end."

      - name: moderation_block_cascade_chain
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: chat_block_strike_mute_withdraw_cascade
          rationale: "§1.8 walks the block cascade from strike accrual through the mute to the withdrawal of the viewer's other in-flight interactions and the pending_question_count adjustment."

      - name: dual_variant_layer
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: show_margin_provisional_vs_final_diverge
          rationale: "§1.8 asserts both variants and the delta produced by switching at signoff, which is the layer's whole claim."

      - name: threshold_trigger_layer
        claim_type: rate_threshold_triggers
        excluded_because:
          difficulty_instance: go_live_readiness_index_70_passes_69_fails
          rationale: "§1.8 tests the GO_LIVE_MIN_INDEX trigger at exactly the threshold and one point below it, which is the boundary form of this layer."

      - name: cart_checkout_occ_layer
        claim_type: optimistic_concurrency
        excluded_because:
          difficulty_instance: checkout_stale_version_beats_empty_cart
          rationale: "§1.8 covers the cart-checkout-stale-cart rule, including its precedence over the empty-cart rule; the flash-offer OCC rule is covered here as a full recipe."

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: show_end_recomputes_denormalised_counters_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - entities.Show.fields.abandonment_rate_bp
          - entities.Show.fields.abandoned_cart_count
        distinguishing_aspect: "Consistency is immediate rather than eventual: the POST /shows/{show_id}/end response body itself already carries abandoned_cart_count 1, abandonment_rate_bp 10000 and margin_provisional_cents 0 produced by the cascade it just ran, and an immediate re-read returns byte-identical values (no lag window)."
        test_recipe:
          setup:
            - "Show LIVE at 18:10Z with an ACTIVE offer; viewer 1 holds 2 units and never checks out, so the show-end cascade must release the line and abandon the cart."
          setup_api_calls:
            - *k_clock_t0
            - *k_host
            - *k_cert
            - *k_viewer1
            - *k_product
            - *k_substantiate
            - *k_show
            - *k_booking
            - *k_confirm
            - *k_slot
            - *k_offer
            - *k_channel
            - *k_provision
            - *k_health_ok
            - *k_ready
            - *k_clock_prelive
            - *k_golive
            - *k_clock_live
            - *k_activate
            - *k_cart1
            - call: "POST /carts/${ct1}/items"
              payload: { flash_offer_id: "${o1}", qty: 2 }
              as: Viewer
              as_user_id: "${v1}"
              captures: { itZ: $.data.id }
          trigger:
            - call: "POST /shows/${sh1}/end"
              payload: {}
              as: ShowProducer
            - call: "GET /shows/${sh1}"
              payload: {}
              as: ShowProducer
            - call: "GET /cart-items/${itZ}"
              payload: {}
              as: ShowProducer
          assert:
            - "The end response (not a later read) already reports status == ENDED, ended_at == 2026-08-10T18:10:00Z, abandoned_cart_count == 1, abandonment_rate_bp == 10000, margin_provisional_cents == 0, gross_merchandise_cents == 0"
            - "The immediate GET /shows/${sh1} returns the same six values — nothing settles asynchronously"
            - "CartItem.${itZ}.state == RELEASED with released_reason == OFFER_EXPIRED, and Cart.${ct1}.status == ABANDONED with recovery_deadline_at == 2026-08-10T18:30:00Z"
            - "FlashOffer.${o1}.status == EXPIRED with held_qty 0 and remaining_qty 10; StreamChannel.${ch1}.status == ENDED; HostBooking.${b1}.status == COMPLETED"
