            - "Student.${st1_id}.fair_play_status == SANCTIONED and RosterSlot.${sl1_id}.participation_status == INELIGIBLE with ineligibility_reason FAIR_PLAY after trigger 3"

      - name: starter_capacity_is_satisfied_up_to_the_cap_and_sub_slots_are_exempt
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=57]
          - calculations[roster_slot_participation]
          - endpoints[POST /roster-slots]
          - entities.Season.fields.max_starters
        distinguishing_aspect: |
          The satisfaction side of the starter cap: the rule is `starter_slots_available
          >= 1`, so the third of three starters must be accepted at the exact boundary
          (available goes 3 -> 2 -> 1 -> 0), and it is scoped to `slot_role == STARTER`,
          so a SUB slot must still be accepted with available already at 0. An
          implementation that guards the cap with `>` or forgets the role scope passes
          every violation test and fails this one.
        test_recipe:
          setup:
            - "One district, one school, one CERTIFIED coach, an APPROVED title approval, one season on the default max_starters of 3, one empty team and four students"
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "Metro District", state_code: "CA" }
              as: LeagueAdmin
              captures: { d_id: $.data.id }
            - call: "POST /schools"
              payload: { district_id: "${d_id}", name: "North High", nces_code: "NCES-001" }
              as: LeagueAdmin
              captures: { s_id: $.data.id }
            - call: "POST /coaches"
              payload: { school_id: "${s_id}", full_name: "Dana Reed", email: "dana@north.k12" }
              as: LeagueAdmin
              captures: { c_id: $.data.id }
            - call: "POST /coaches/${c_id}/certification"
              payload: { action: "CERTIFY", background_check_expires_on: "2027-06-30" }
