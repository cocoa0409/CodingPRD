          assert:
            - "${e1} through ${e6} are all ERR_CONTRACT_NOT_OWNED with HTTP 403 — never 404, and never a 200 with fields blanked out"
            - "${e3} and ${e4} prove the one-hop and two-hop ownership walks (Nomination -> contract, GasMovementTicket -> nomination -> contract) are both implemented"
            - "${e5} is ERR_CONTRACT_NOT_OWNED and not ERR_STALE_CONTRACT_VERSION even though ${cv1} is stale by then (the nomination confirm bumped CN-1): priority 6 outranks priority 8"
