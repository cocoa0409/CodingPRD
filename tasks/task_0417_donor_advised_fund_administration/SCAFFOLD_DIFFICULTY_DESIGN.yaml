  # ===========================================================================
  # Rule 7 — Cross-entity state dependencies across DIFFERENT entity pairs
  #   instance 1 = GrantRecommendation depends on Charity.status (Grant->Charity)
  #   instance 2 = Contribution settle depends on DonorAccount.status (Contribution->DonorAccount)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: grant_approve_blocked_by_watchlisted_charity
        grounds:
          - state_machines.GrantRecommendation.SUBMITTED_to_APPROVED
          - state_machines.Charity.VETTED_to_WATCHLISTED
          - validations[priority=9]
          - entities.Charity.fields.status
        distinguishing_aspect: |
          Entity pair GrantRecommendation -> Charity: a SUBMITTED grant cannot transition to
          APPROVED while its referenced Charity.status == WATCHLISTED (not VETTED), returning
          ERR_CHARITY_NOT_VETTED — the grant's valid next-state depends on a different entity's state.
        test_recipe:
          setup:
            - "Sponsor; Charity vetted then WATCHLISTED; ACTIVE DonorAccount funded 1000000 cash; one SUBMITTED grant of 100000 cents to that charity."
          setup_api_calls:
            - call: "POST /daf/sponsors"
              payload: { name: "X7a Sponsor", ein: "13-4040404" }
              as: SponsorAdmin
              captures: { sponsor_id: $.data.id }
            - call: "POST /daf/charities"
              payload: { sponsor_id: "${sponsor_id}", legal_name: "Theatre", ein: "13-9000001", ntee_code: "A65", is_private_foundation: false }
              as: ComplianceOfficer
              captures: { charity_id: $.data.id }
            - call: "POST /daf/charities/${charity_id}/vet"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
            - call: "POST /daf/accounts"
              payload: { sponsor_id: "${sponsor_id}", account_name: "X7a Fund", primary_advisor_user_id: "adv-12" }
              as: SponsorAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /daf/contributions"
              payload: { donor_account_id: "${acct_id}", asset_type: "CASH", cash_amount_cents: 1000000 }
              as: DonorAdvisor
              as_user_id: "adv-12"
              captures: { contrib_id: $.data.id }
            - call: "POST /daf/contributions/${contrib_id}/settle"
              payload: {}
              as: ContributionAdmin
            - call: "GET /daf/accounts/${acct_id}"
              payload: {}
              as: DonorAdvisor
              as_user_id: "adv-12"
              captures: { ver1: $.data.version }
            - call: "POST /daf/grants"
              payload: { donor_account_id: "${acct_id}", charity_id: "${charity_id}", amount_cents: 100000, expected_account_version: "${ver1}" }
              as: DonorAdvisor
              as_user_id: "adv-12"
              captures: { grant_id: $.data.id }
            - call: "POST /daf/charities/${charity_id}/vet"
              payload: { decision: "WATCHLIST", vetting_note: "hold" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /daf/grants/${grant_id}/approve"
              payload: {}
              as: GrantOfficer
              as_user_id: "officer-7"
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_CHARITY_NOT_VETTED"
            - "GrantRecommendation.${grant_id}.status == SUBMITTED (unchanged)"

      - name: contribution_settle_blocked_by_wind_down_account
        grounds:
          - state_machines.Contribution.PENDING_to_SETTLED
          - state_machines.DonorAccount.ACTIVE_to_WIND_DOWN
          - validations[priority=6]
          - entities.DonorAccount.fields.status
        distinguishing_aspect: |
          Different entity pair Contribution -> DonorAccount: a PENDING contribution cannot settle
          while its DonorAccount.status == WIND_DOWN (not ACTIVE), returning ERR_ACCOUNT_NOT_ACTIVE.
          The contribution's settle transition depends on the account's lifecycle state.
        test_recipe:
          setup:
            - "Sponsor; ACTIVE DonorAccount with a CONFIRMED LEGACY_GRANTS SuccessionPlan, moved to WIND_DOWN; one PENDING CASH contribution of 200000 cents recorded before wind-down."
          setup_api_calls:
            - call: "POST /daf/sponsors"
              payload: { name: "X7b Sponsor", ein: "14-5050505" }
              as: SponsorAdmin
              captures: { sponsor_id: $.data.id }
            - call: "POST /daf/charities"
              payload: { sponsor_id: "${sponsor_id}", legal_name: "Legacy Charity", ein: "14-9000001", ntee_code: "T30", is_private_foundation: false }
              as: ComplianceOfficer
              captures: { ben_charity_id: $.data.id }
            - call: "POST /daf/charities/${ben_charity_id}/vet"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
            - call: "POST /daf/accounts"
              payload: { sponsor_id: "${sponsor_id}", account_name: "X7b Fund", primary_advisor_user_id: "adv-13" }
              as: SponsorAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /daf/contributions"
              payload: { donor_account_id: "${acct_id}", asset_type: "CASH", cash_amount_cents: 200000 }
              as: DonorAdvisor
              as_user_id: "adv-13"
              captures: { contrib_id: $.data.id }
            - call: "POST /daf/succession-plans"
              payload: { donor_account_id: "${acct_id}", plan_type: "LEGACY_GRANTS", beneficiaries: [ { charity_id: "${ben_charity_id}", share_bps: 10000 } ] }
              as: DonorAdvisor
              as_user_id: "adv-13"
              captures: { plan_id: $.data.id }
            - call: "POST /daf/succession-plans/${plan_id}/confirm"
              payload: {}
              as: DonorAdvisor
              as_user_id: "adv-13"
            - call: "POST /daf/accounts/${acct_id}/wind-down"
              payload: {}
              as: SponsorAdmin
          trigger:
            - call: "POST /daf/contributions/${contrib_id}/settle"
              payload: {}
              as: ContributionAdmin
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_ACCOUNT_NOT_ACTIVE"
            - "Contribution.${contrib_id}.status == PENDING (unchanged); no SubstantiationReceipt minted"

  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across DIFFERENT interval semantics
  #   instance 1 = NavPeriod half-open [from,to) on InvestmentPool — adjacency OK
  #   instance 2 = recurring grant CLOSED [from,to] on (account,charity) — adjacency collides
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: nav_period_half_open_adjacency_does_not_collide
        grounds:
          - calculations.nav_period_overlap
          - validations[priority=15]
          - entities.NavPeriod.fields.from_quarter
          - endpoints.POST /daf/nav-periods
        distinguishing_aspect: |
          Half-open interval semantics on InvestmentPool: NavPeriod [0,4) and [4,8) are ADJACENT
          (t1==f2==4) and do NOT collide (accepted), but [0,4) and [3,8) strictly overlap
          (f1<t2 AND f2<t1) and are rejected with ERR_NAV_PERIOD_OVERLAP. Touching boundaries pass.
        test_recipe:
          setup:
            - "Sponsor; one OPEN InvestmentPool; one ACTIVE NavPeriod [0,4) on the pool."
          setup_api_calls:
            - call: "POST /daf/sponsors"
              payload: { name: "Nav Sponsor", ein: "15-6060606" }
              as: SponsorAdmin
              captures: { sponsor_id: $.data.id }
            - call: "POST /daf/pools"
              payload: { sponsor_id: "${sponsor_id}", name: "Nav Pool", risk_tier: "BALANCED", nav_per_unit_cents: 2500, fee_bps: 50 }
              as: SponsorAdmin
              captures: { pool_id: $.data.id }
