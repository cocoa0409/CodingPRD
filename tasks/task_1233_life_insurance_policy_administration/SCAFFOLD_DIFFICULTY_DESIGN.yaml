scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: loan_interest_capitalizing_vs_non_capitalizing
        grounds:
          - calculations.policy_loan_interest_accrual
          - entities.PolicyLoan.fields.accrued_interest_cents
          - entities.PolicyLoan.fields.outstanding_principal_cents
        distinguishing_aspect: |
          Two interest-accrual variants on PolicyLoan produce different
          outstanding_principal_cents after the first anniversary: in the
          non_capitalizing variant interest accumulates in
          accrued_interest_cents and principal is unchanged; in the
          capitalizing variant interest is folded into principal at the
          anniversary, so the next period's interest base grows.
        test_recipe:
          setup:
            - "InsuredPerson ip_A and ProductTemplate tpl_WL (WHOLE_LIFE_NON_PARTICIPATING, allows_policy_loans=true, min_face=100_000_00, max_face=1_000_000_00, base_rate=50 cents per $1000 per month, coi_rate_table=[], surrender_charge_schedule=[])"
            - "PolicyApplication app_A approved with class=STANDARD_NON_TOBACCO and issued at 2026-05-01; initial premium paid"
            - "Policy pol_A has cash_value_cents = 100_000_00 (forced via premium payment sequence)"
            - "Loan loan_A of 50_000_00 originated on 2026-05-01; clock advanced 366 days to trigger two accrual periods"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /insured-persons"
              payload: { full_name: "Alice A", date_of_birth: "1990-01-01T00:00:00Z", tobacco_user: false, gender: "FEMALE" }
              as: Agent
              captures: { ip_a: $.data.id }
            - call: "POST /product-templates"
              payload: { product_code: "WL-NP-A", product_type: "WHOLE_LIFE_NON_PARTICIPATING", participating: false, allows_policy_loans: true, min_face_amount_cents: 10000000, max_face_amount_cents: 100000000, base_monthly_premium_rate_per_thousand_cents: 50, coi_rate_table: [], surrender_charge_schedule: [] }
              as: PlatformAdmin
              captures: { tpl_a: $.data.id }
            - call: "POST /applications"
              payload: { insured_person_id: "${ip_a}", product_template_id: "${tpl_a}", requested_face_amount_cents: 10000000, premium_mode: "ANNUAL" }
              as: Agent
              captures: { app_a: $.data.id }
            - call: "POST /applications/${app_a}/begin-review"
              payload: {}
              as: Underwriter
            - call: "POST /applications/${app_a}/approve"
              payload: { underwriting_class: "STANDARD_NON_TOBACCO" }
              as: Underwriter
            - call: "POST /applications/${app_a}/issue"
              payload: {}
              as: PolicyIssuer
              captures: { pol_a: $.data.id }
            # Force cash value up via a sequence of premium payments that the implementation credits
            - call: "POST /policies/${pol_a}/premium-payments"
              payload: { amount_cents: 10000000 }
              as: Agent
            - call: "POST /policies/${pol_a}/loans"
              payload: { requested_amount_cents: 5000000 }
              as: Policyholder
              as_user_id: "${ip_a}"
              captures: { loan_a: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-05-02T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /policies/${pol_a}/loans/${loan_a}/accrue-interest"
              payload: {}
              as: PlatformAdmin
              captures: { accrued_a: $.data.accrued_interest_cents, principal_a: $.data.outstanding_principal_cents }
          assert:
            - "PolicyLoan.${loan_a}.outstanding_principal_cents == 5000000  # non_capitalizing variant: principal unchanged"
            - "PolicyLoan.${loan_a}.accrued_interest_cents == 250068  # 5000000 * 0.05 * 366/365 = 250684.93 → computed via 365 + 1 split: first period 365 days = 250000, second 1 day = 68.49 → round half-up per period = 250000 + 68 = 250068"
            - "LoanInterestAccrual entries for loan total exactly 250068"

      - name: coi_end_of_month_vs_beginning_of_month
        grounds:
          - calculations.monthly_coi_charge
          - entities.Policy.fields.cash_value_cents
        distinguishing_aspect: |
          For UNIVERSAL_LIFE, the CoI charge depends on cash_value at the
          moment of charging. The end_of_month variant uses the cash value
          BEFORE this cycle's premium credit; the beginning_of_month variant
          uses cash value AFTER. The two variants produce a different
          coi_cents on the same data because net_amount_at_risk differs.
        test_recipe:
          setup:
            - "UNIVERSAL_LIFE template with coi_rate_table=[{attained_age:30, monthly_rate_per_thousand_cents:10}], single entry, applies to any attained age <= 30"
            - "Insured age 30 at charge date"
            - "Policy face = 500_000_00, cash_value at start = 50_000_00"
            - "This cycle's premium credit = 10_000_00"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /insured-persons"
              payload: { full_name: "Bob B", date_of_birth: "1996-05-01T00:00:00Z", tobacco_user: false, gender: "MALE" }
              as: Agent
              captures: { ip_b: $.data.id }
            - call: "POST /product-templates"
              payload: { product_code: "UL-B", product_type: "UNIVERSAL_LIFE", participating: false, allows_policy_loans: true, min_face_amount_cents: 10000000, max_face_amount_cents: 100000000, base_monthly_premium_rate_per_thousand_cents: 100, coi_rate_table: [{ attained_age: 30, monthly_rate_per_thousand_cents: 10 }], surrender_charge_schedule: [] }
              as: PlatformAdmin
              captures: { tpl_b: $.data.id }
            - call: "POST /applications"
              payload: { insured_person_id: "${ip_b}", product_template_id: "${tpl_b}", requested_face_amount_cents: 50000000, premium_mode: "MONTHLY" }
              as: Agent
              captures: { app_b: $.data.id }
            - call: "POST /applications/${app_b}/begin-review"
              payload: {}
              as: Underwriter
            - call: "POST /applications/${app_b}/approve"
              payload: { underwriting_class: "STANDARD_NON_TOBACCO" }
              as: Underwriter
            - call: "POST /applications/${app_b}/issue"
              payload: {}
              as: PolicyIssuer
              captures: { pol_b: $.data.id }
            # Force cash_value = 5000000 via a premium payment that posts in full
            - call: "POST /policies/${pol_b}/premium-payments"
              payload: { amount_cents: 5000000 }
              as: Agent
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /policies/${pol_b}/premium-payments"
              payload: { amount_cents: 1000000 }
              as: Agent
          assert:
            - "Latest CashValueLedgerEntry of entry_type=COI_DEBIT has amount_cents == -2000 (computed as: net_amount_at_risk = 50000000 - 5000000 = 45000000; 45000000 / 100000 * 10 = 4500; * class_mult 1.0 = 4500; end_of_month variant uses pre-credit cash_value)"
            - "Had beginning_of_month_deduction been applied, charge would be (50000000 - 6000000) / 100000 * 10 = 4400; the variant delta is 100 cents"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: modal_premium_nested_rounding
        grounds:
          - calculations.modal_premium_at_issue
        distinguishing_aspect: |
          Mode (b): nested rounding where the order matters. The formula
          rounds the monthly rate to integer cents BEFORE multiplying by
          mode_factor, then rounds again. Reverse order ("multiply then
          round") produces a different cents value. The scaffold pins the
          "round monthly first" order.
        test_recipe:
          setup:
            - "InsuredPerson ip_M (tobacco_user=true)"
            - "ProductTemplate tpl_M with base_monthly_premium_rate_per_thousand_cents = 33 (an amount that makes rounding order visible)"
            - "Application approved with class=STANDARD_TOBACCO, premium_mode=QUARTERLY, face=250_000_00"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /insured-persons"
              payload: { full_name: "Mary M", date_of_birth: "1985-03-15T00:00:00Z", tobacco_user: true, gender: "FEMALE" }
              as: Agent
              captures: { ip_m: $.data.id }
            - call: "POST /product-templates"
              payload: { product_code: "WL-M", product_type: "WHOLE_LIFE_NON_PARTICIPATING", participating: false, allows_policy_loans: true, min_face_amount_cents: 1000000, max_face_amount_cents: 100000000, base_monthly_premium_rate_per_thousand_cents: 33, coi_rate_table: [], surrender_charge_schedule: [] }
              as: PlatformAdmin
              captures: { tpl_m: $.data.id }
            - call: "POST /applications"
              payload: { insured_person_id: "${ip_m}", product_template_id: "${tpl_m}", requested_face_amount_cents: 25000000, premium_mode: "QUARTERLY" }
              as: Agent
              captures: { app_m: $.data.id }
            - call: "POST /applications/${app_m}/begin-review"
              payload: {}
              as: Underwriter
            - call: "POST /applications/${app_m}/approve"
              payload: { underwriting_class: "STANDARD_TOBACCO" }
              as: Underwriter
          trigger:
            - call: "POST /applications/${app_m}/issue"
              payload: {}
              as: PolicyIssuer
              captures: { pol_m: $.data.id, modal_premium: $.data.modal_premium_cents }
          assert:
            - "Policy.${pol_m}.modal_premium_cents == 13090  # computed: monthly_rate_cents = round_half_up(25000000/100000 * 33 * 1.80 / 100) = round_half_up(148.50) = 149 (NB: 25000000 cents face / 1000_00 per-thousand cents = 250 'thousands'; 250 * 33 * 1.80 = 14850 cents monthly pre-round, /100 to convert rate base = 148.50 → 149); 149 * 2.94 = 438.06 → round_half_up = 438. Wait — recheck formula: monthly_rate_cents = round_half_up(face/1000_00 * base_per_thousand_cents * class_mult * extra_factor / 100) = round_half_up(250 * 33 * 1.80 * 1 / 100) = round_half_up(148.5) = 149? Actually 250 * 33 = 8250; 8250 * 1.80 = 14850; 14850 / 100 = 148.5 → 149. Then modal = round_half_up(149 * 2.94) = round_half_up(438.06) = 438."

      - name: reduced_paid_up_age_tiered_threshold
        grounds:
          - calculations.reduced_paid_up_face_amount
        distinguishing_aspect: |
          Mode (a): a formula with >=3 inputs and non-linear interaction
          (age tier selection from a 4-bracket piecewise schedule ×
          substandard extra additive × net_available computed from cash
          value minus loan principal minus accrued interest minus
          surrender charge). Tier boundary at attained_age=40 flips the
          conversion rate from 0.30 to 0.40, producing different face
          amounts for the same cash value.
        test_recipe:
          setup:
            - "Insured age exactly 40 at election date (boundary)"
            - "WHOLE_LIFE policy with cash_value_cents = 200_000_00, no loans, no surrender charge"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /insured-persons"
              payload: { full_name: "Nora N", date_of_birth: "1986-05-01T00:00:00Z", tobacco_user: false, gender: "FEMALE" }
              as: Agent
              captures: { ip_n: $.data.id }
            - call: "POST /product-templates"
              payload: { product_code: "WL-N", product_type: "WHOLE_LIFE_NON_PARTICIPATING", participating: false, allows_policy_loans: true, min_face_amount_cents: 1000000, max_face_amount_cents: 100000000, base_monthly_premium_rate_per_thousand_cents: 50, coi_rate_table: [], surrender_charge_schedule: [] }
              as: PlatformAdmin
              captures: { tpl_n: $.data.id }
            - call: "POST /applications"
              payload: { insured_person_id: "${ip_n}", product_template_id: "${tpl_n}", requested_face_amount_cents: 50000000, premium_mode: "ANNUAL" }
              as: Agent
              captures: { app_n: $.data.id }
            - call: "POST /applications/${app_n}/begin-review"
              payload: {}
              as: Underwriter
            - call: "POST /applications/${app_n}/approve"
              payload: { underwriting_class: "STANDARD_NON_TOBACCO" }
              as: Underwriter
            - call: "POST /applications/${app_n}/issue"
              payload: {}
              as: PolicyIssuer
              captures: { pol_n: $.data.id }
            - call: "POST /policies/${pol_n}/premium-payments"
              payload: { amount_cents: 20000000 }
              as: Agent
          trigger:
            - call: "POST /policies/${pol_n}/nonforfeiture-elections"
              payload: { election_type: "REDUCED_PAID_UP" }
              as: Policyholder
              as_user_id: "${ip_n}"
              captures: { election_n: $.data.id, face_n: $.data.resulting_face_amount_cents }
          assert:
            - "NonforfeitureElection.${election_n}.resulting_face_amount_cents == 50000000  # attained_age=40 → rate=0.40; extra=0; 20000000 / 0.40 = 50000000"
            - "Policy.${pol_n}.form_status == REDUCED_PAID_UP"
            - "Policy.${pol_n}.face_amount_cents == 50000000"
            - "Had attained_age been 39 (one day earlier birthdate), rate would be 0.30 and resulting face would be 66666667 — boundary differs"

  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: policy_parallel_dimensions_independent
        grounds:
          - state_machines.Policy
          - entities.Policy.fields.premium_payment_status
          - entities.Policy.fields.form_status
        distinguishing_aspect: |
          Policy has two parallel state dimensions. premium_payment_status
          can cycle CURRENT → GRACE → LAPSED → REINSTATED_PENDING →
          CURRENT, while form_status remains IN_FORCE. The dimensions
          evolve independently: a reinstatement cycle leaves form_status
          unchanged, and a form change (e.g., REDUCED_PAID_UP) freezes
          premium_payment_status at PAID_UP.
        test_recipe:
          setup:
            - "Issued WHOLE_LIFE policy, premium_payment_status=CURRENT, form_status=IN_FORCE"
            - "Clock advanced past cycle end (grace), then past grace end (lapse)"
            - "Reinstatement request created, evidence submitted, back premium paid, approved"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /insured-persons"
              payload: { full_name: "Oscar O", date_of_birth: "1980-06-01T00:00:00Z", tobacco_user: false, gender: "MALE" }
              as: Agent
              captures: { ip_o: $.data.id }
            - call: "POST /product-templates"
              payload: { product_code: "WL-O", product_type: "WHOLE_LIFE_NON_PARTICIPATING", participating: false, allows_policy_loans: true, min_face_amount_cents: 1000000, max_face_amount_cents: 100000000, base_monthly_premium_rate_per_thousand_cents: 50, coi_rate_table: [], surrender_charge_schedule: [] }
              as: PlatformAdmin
              captures: { tpl_o: $.data.id }
            - call: "POST /applications"
              payload: { insured_person_id: "${ip_o}", product_template_id: "${tpl_o}", requested_face_amount_cents: 10000000, premium_mode: "MONTHLY" }
              as: Agent
              captures: { app_o: $.data.id }
            - call: "POST /applications/${app_o}/begin-review"
              payload: {}
              as: Underwriter
            - call: "POST /applications/${app_o}/approve"
              payload: { underwriting_class: "STANDARD_NON_TOBACCO" }
              as: Underwriter
            - call: "POST /applications/${app_o}/issue"
              payload: {}
              as: PolicyIssuer
              captures: { pol_o: $.data.id }
            # Advance clock past first cycle (assume cycle = 1 month) + grace 31 days → lapse
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-03T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /policies/${pol_o}/reinstatement-requests"
              payload: {}
              as: Agent
              captures: { rr_o: $.data.id }
            - call: "POST /policies/${pol_o}/reinstatement-requests/${rr_o}/request-evidence"
              payload: {}
              as: Underwriter
            - call: "POST /policies/${pol_o}/reinstatement-requests/${rr_o}/submit-evidence"
              payload: {}
              as: Agent
            - call: "POST /policies/${pol_o}/reinstatement-requests/${rr_o}/payments"
              payload: { amount_cents: 99999999 }
              as: Agent
            - call: "POST /policies/${pol_o}/reinstatement-requests/${rr_o}/approve"
              payload: {}
              as: Underwriter
          trigger:
            - call: "GET /policies/${pol_o}"
              payload: {}
              as: Agent
          assert:
            - "Policy.${pol_o}.premium_payment_status == CURRENT  # cycled back via reinstatement"
            - "Policy.${pol_o}.form_status == IN_FORCE  # unchanged throughout"

      - name: reinstatement_request_evidence_cycle
        grounds:
          - state_machines.ReinstatementRequest
        distinguishing_aspect: |
          ReinstatementRequest has a PENDING ↔ EVIDENCE_REQUIRED cycle:
          underwriter may request evidence, agent submits, underwriter
          requests again. Cycle count is unbounded, distinct from the
          Policy's premium_payment_status cycle (different entity).
        test_recipe:
          setup:
            - "Lapsed policy with reinstatement request created"
            - "Two full PENDING → EVIDENCE_REQUIRED → PENDING cycles"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /insured-persons"
              payload: { full_name: "Paul P", date_of_birth: "1982-04-01T00:00:00Z", tobacco_user: false, gender: "MALE" }
              as: Agent
              captures: { ip_p: $.data.id }
            - call: "POST /product-templates"
              payload: { product_code: "WL-P", product_type: "WHOLE_LIFE_NON_PARTICIPATING", participating: false, allows_policy_loans: true, min_face_amount_cents: 1000000, max_face_amount_cents: 100000000, base_monthly_premium_rate_per_thousand_cents: 50, coi_rate_table: [], surrender_charge_schedule: [] }
              as: PlatformAdmin
              captures: { tpl_p: $.data.id }
            - call: "POST /applications"
              payload: { insured_person_id: "${ip_p}", product_template_id: "${tpl_p}", requested_face_amount_cents: 10000000, premium_mode: "MONTHLY" }
              as: Agent
              captures: { app_p: $.data.id }
            - call: "POST /applications/${app_p}/begin-review"
              payload: {}
              as: Underwriter
            - call: "POST /applications/${app_p}/approve"
              payload: { underwriting_class: "STANDARD_NON_TOBACCO" }
              as: Underwriter
            - call: "POST /applications/${app_p}/issue"
              payload: {}
              as: PolicyIssuer
              captures: { pol_p: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-03T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /policies/${pol_p}/reinstatement-requests"
              payload: {}
              as: Agent
              captures: { rr_p: $.data.id }
            # First cycle
            - call: "POST /policies/${pol_p}/reinstatement-requests/${rr_p}/request-evidence"
              payload: {}
              as: Underwriter
            - call: "POST /policies/${pol_p}/reinstatement-requests/${rr_p}/submit-evidence"
              payload: {}
              as: Agent
            # Second cycle
            - call: "POST /policies/${pol_p}/reinstatement-requests/${rr_p}/request-evidence"
              payload: {}
              as: Underwriter
            - call: "POST /policies/${pol_p}/reinstatement-requests/${rr_p}/submit-evidence"
              payload: {}
              as: Agent
          trigger:
            - call: "GET /policies/${pol_p}/reinstatement-requests"
              payload: {}
              as: Agent
              captures: { rr_status: "$.data[0].status" }
          assert:
            - "ReinstatementRequest.${rr_p}.status == PENDING  # after two cycles, back to PENDING"
            - "ReinstatementRequest.${rr_p}.evidence_of_insurability == true"

  # ===========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: lapse_cascade_three_hop
        grounds:
          - state_machines.Policy
          - state_machines.PolicyLoan
          - state_machines.Rider
          - state_machines.PremiumBillingCycle
        distinguishing_aspect: |
          Depth-3 cascade triggered by a single clock advance: clock →
          PremiumBillingCycle GRACE→LAPSED → Policy
          premium_payment_status GRACE→LAPSED → PolicyLoan ACTIVE→FORECLOSED
          (and Rider ACTIVE→TERMINATED). Each hop is caused by the
          previous hop's mutation, not directly by the clock.
        test_recipe:
          setup:
            - "Issued WHOLE_LIFE policy with one ACTIVE loan and one ACTIVE rider"
            - "Premium unpaid through cycle end and grace end"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /insured-persons"
              payload: { full_name: "Quinn Q", date_of_birth: "1978-08-01T00:00:00Z", tobacco_user: false, gender: "FEMALE" }
              as: Agent
              captures: { ip_q: $.data.id }
            - call: "POST /product-templates"
              payload: { product_code: "WL-Q", product_type: "WHOLE_LIFE_NON_PARTICIPATING", participating: false, allows_policy_loans: true, min_face_amount_cents: 1000000, max_face_amount_cents: 100000000, base_monthly_premium_rate_per_thousand_cents: 50, coi_rate_table: [], surrender_charge_schedule: [] }
              as: PlatformAdmin
              captures: { tpl_q: $.data.id }
            - call: "POST /applications"
              payload: { insured_person_id: "${ip_q}", product_template_id: "${tpl_q}", requested_face_amount_cents: 10000000, premium_mode: "MONTHLY" }
              as: Agent
              captures: { app_q: $.data.id }
            - call: "POST /applications/${app_q}/begin-review"
              payload: {}
              as: Underwriter
            - call: "POST /applications/${app_q}/approve"
              payload: { underwriting_class: "STANDARD_NON_TOBACCO" }
              as: Underwriter
            - call: "POST /applications/${app_q}/issue"
              payload: {}
              as: PolicyIssuer
              captures: { pol_q: $.data.id }
            - call: "POST /policies/${pol_q}/premium-payments"
              payload: { amount_cents: 10000000 }
              as: Agent
            - call: "POST /policies/${pol_q}/loans"
              payload: { requested_amount_cents: 5000000 }
              as: Policyholder
              as_user_id: "${ip_q}"
              captures: { loan_q: $.data.id }
            - call: "POST /policies/${pol_q}/riders"
              payload: { rider_type: "ACCIDENTAL_DEATH_BENEFIT", rider_face_amount_cents: 1000000 }
              as: Agent
              captures: { rider_q: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: PlatformAdmin
          assert:
            - "Policy.${pol_q}.premium_payment_status == LAPSED"
            - "PolicyLoan.${loan_q}.status == FORECLOSED  # hop-3: caused by Policy lapse, not directly by clock"
            - "Rider.${rider_q}.status == TERMINATED  # hop-3"

      - name: reduced_paid_up_two_hop_cascade
        grounds:
          - state_machines.Policy
          - state_machines.PolicyLoan
          - state_machines.PremiumBillingCycle
        distinguishing_aspect: |
          Depth-2 cascade triggered by POST
          /policies/{id}/nonforfeiture-elections (REDUCED_PAID_UP):
          election creation → Policy.form_status IN_FORCE→REDUCED_PAID_UP
          AND Policy.face_amount updated → Policy.premium_payment_status
          →PAID_UP AND PremiumBillingCycles (all OPEN/PARTIALLY_PAID/GRACE)
          →WAIVED. Different trigger from clock-driven lapse cascade.
        test_recipe:
          setup:
