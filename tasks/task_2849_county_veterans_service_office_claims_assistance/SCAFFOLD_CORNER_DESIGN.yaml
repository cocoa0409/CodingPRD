              as: IntakeClerk
              captures: { doc_i: $.data.id }
            - call: "POST /cvso/discharge-documents/${doc_i}/review"
              payload: { action: "VERIFY" }
              as: CountyOfficer
              as_user_id: "${rep_a}"
            - call: "POST /cvso/powers-of-attorney"
              payload: { veteran_id: "${vet_i}", representative_id: "${rep_a}", form_type: "VA_21_22", scope: "ALL_BENEFITS", executed_on: "2026-08-01" }
              as: IntakeClerk
              captures: { poa_i: $.data.id }
            - call: "GET /cvso/veterans/${vet_i}"
              payload: {}
              as: IntakeClerk
              captures: { vet_i_v: $.data.version }
