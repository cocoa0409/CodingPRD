            - "after trigger call 1, GET /inspection-assignments?claim_id=${cl_a} returns meta.total_count == 0"
            - "trigger call 2 response HTTP status == 201, status == SCHEDULED, selection_reason == EXPLICIT_ADJUSTER, mode == FIELD"
            - "trigger call 2 response.data.report_submitted_at_utc == null and verified_damage_amount == null"
            - "Claim.${cl_a}.handling_status == INSPECTION_PENDING"
            - "GET /inspection-assignments?deployment_id=${dep_a} returns meta.total_count == 1"
            - "GET /inspection-assignments?deployment_id=${dep_b} returns meta.total_count == 0"
            - "GET /deployments?event_id=${ev_a} returns meta.total_count == 1 with id ${dep_a}"
            - "GET /deployments?event_id=${ev_b} returns meta.total_count == 1 with id ${dep_b}"
            - "GET /claims?event_id=${ev_a} returns meta.total_count == 1 and GET /claims?event_id=${ev_b} returns meta.total_count == 0"
            - "Adjuster.${adj_tx}.open_assignment_count == 1 and Adjuster.${adj_both}.open_assignment_count == 0"

  - section: state_machines
    instances:
      - name: corner_sm_initial_state_advance_issued_and_vendor_network_inactive
        claim_type: initial_state
        grounds:
          - state_machines.AdvancePayment.initial_state
          - state_machines.VendorFirm.initial_state
          - endpoints[POST /advance-payments]
          - endpoints[POST /vendor-firms]
        distinguishing_aspect: |
          Both machines start somewhere counter-intuitive. AdvancePayment has NO draft/pending state: the
          row is born ISSUED, so the money and the PAYMENT ledger entry exist the instant the POST returns
          201 — there is no approval hop. VendorFirm is born NETWORK_INACTIVE, i.e. a freshly created firm
          is unusable until it is activated for an event. An implementation that adds a DRAFT/PENDING first
          state to either machine, or that lets a brand-new firm take work, fails here.
        test_recipe:
          setup:
            - "Clock at the 2026-08-01T00:00:00Z startup default."
            - "One DECLARED CatastropheEvent 'CAT-2026-1101' (HAIL, TX, expected_severity_index 0.0000) and no regulatory bulletins, so mandate_floor is 0.00."
            - "One cat-coded Claim: reported 40000, one DWELLING line 100000 / 0 / 50000. Triage stamps severity 40.00*0.95 = 38.00 -> STANDARD and case_reserve max(40000, 50000) * 0.45 = 22500.00 (ReserveEntry #1 INITIAL_CASE)."
            - "advance_cap = round(round(50000*0.30, 2) * 0.60, 2) = round(15000.00*0.60, 2) = 9000.00, so a 500.00 request lands under the cap and amount == requested."
          setup_api_calls:
            - call: "POST /catastrophe-events"
              payload: { cat_code: "CAT-2026-1101", peril_type: "HAIL", jurisdiction_state: "TX", event_start_utc: "2026-07-26T00:00:00.000Z", exposure_count: 400, avg_insured_value: 150000, expected_severity_index: 0.0000 }
              as: CatastropheManager
              as_user_id: "cm_1"
              captures: { ev: $.data.id }
            - call: "POST /catastrophe-events/${ev}/declare"
              payload: {}
              as: CatastropheManager
              as_user_id: "cm_1"
            - call: "POST /claims"
              payload: { policy_number: "POL-1101A", loss_state: "TX", loss_date_utc: "2026-07-26T00:00:00.000Z", reported_loss_amount: 40000, coverage_lines: [{ coverage_code: "DWELLING", limit_amount: 100000, deductible_amount: 0, estimated_damage_amount: 50000 }], event_id: "${ev}" }
              as: ClaimsExaminer
              as_user_id: "ce_1"
              captures: { cl: $.data.id }
            - call: "POST /claims/${cl}/triage"
              payload: {}
              as: ClaimsExaminer
              as_user_id: "ce_1"
            - call: "POST /vendor-firms"
              payload: { firm_name: "Lone Star Tarp Co", vendor_type: "TARP", service_states: ["TX"], max_concurrent_jobs: 3, performance_score: 90.00 }
              as: VendorCoordinator
              as_user_id: "vc_1"
              captures: { vf: $.data.id, vf_status_at_create: $.data.status, vf_event_at_create: $.data.activated_for_event_id, vf_jobs_at_create: $.data.open_job_count }
          trigger:
            - call: "POST /advance-payments"
              payload: { claim_id: "${cl}", requested_amount: 500, basis: "STRUCTURE_PARTIAL" }
              as: ClaimsExaminer
