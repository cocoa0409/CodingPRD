  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: discharge_med_rec_safety_gate_beats_referential_delivery_gate
        grounds:
          - "validations[priority=28]"
          - "validations[priority=29]"
          - "validations[priority=30]"
          - state_machines.Episode.DISCHARGE_PENDING_to_DISCHARGED
        distinguishing_aspect: |
          Error-category pair business_safety (priority 28, ERR_MED_REC_UNSIGNED) versus
          business_referential (priorities 29 and 30, ERR_DELIVERY_NOT_TERMINAL and
          ERR_RECONCILIATION_INCOMPLETE): one discharge request violates all three rungs at once
          and must surface the priority-28 safety error, and after only that rung is satisfied
          the priority-29 referential error takes over.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T08:00:00Z."
            - "One CMS_WAIVER episode in DISCHARGE_PENDING with med_rec_signed still false."
            - "One AUTHORIZED (non-terminal) DeliveryOrder on the episode."
            - "One DeviceComponent left in PENDING_RECONCILIATION by the begin-discharge kit release."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /patients"
              payload: { mrn: "MRN-G1", full_name: "Gil Gate", home_distance_km: 3.0, primary_diagnosis_code: "CELLULITIS", diet_restriction: "NONE", broadband_verified: true, caregiver_present: true }
              as: AdmittingPhysician
              captures: { pat_g: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_g}", origin: "ED", qualifying_condition_code: "CELLULITIS", acuity: "STANDARD", referring_physician_user_id: "phys-1" }
              as: AdmittingPhysician
              captures: { ref_g: $.data.id }
            - call: "POST /eligibility-assessments"
              payload: { referral_id: "${ref_g}", in_person_eval_at: "2026-06-01T06:00:00Z", home_safety_outcome: "PASS", broadband_check: "PASS", caregiver_present_confirmed: true, consent_signed: true, assessor_user_id: "phys-1" }
              as: AdmittingPhysician
            - call: "POST /referrals/${ref_g}/mark-eligible"
              payload: {}
              as: AdmittingPhysician
            - call: "POST /episodes"
              payload: { patient_id: "${pat_g}", referral_id: "${ref_g}", program_track: "CMS_WAIVER" }
              as: AdmittingPhysician
              captures: { ep_g: $.data.id }
            - call: "POST /device-kits"
              payload: { asset_tag: "KIT-G1" }
              as: ProgramAdmin
              captures: { kit_g: $.data.id, kit_g_v: $.data.version }
            - call: "POST /device-kits/${kit_g}/components"
              payload: { component_type: "BP_CUFF", serial_number: "SN-G1", replacement_cost_usd: 90.00 }
              as: ProgramAdmin
              captures: { comp_g: $.data.id }
            - call: "POST /device-kits/${kit_g}/deploy"
              payload: { episode_id: "${ep_g}", expected_kit_version: "${kit_g_v}" }
              as: FieldNurse
            - call: "POST /delivery-orders"
              payload: { episode_id: "${ep_g}", order_kind: "DME", is_controlled: false, cold_chain_required: false, weight_kg: 1.5, requested_by_user_id: "log-1" }
              as: LogisticsCoordinator
              captures: { do_g: $.data.id }
            - call: "POST /delivery-orders/${do_g}/authorize"
              payload: {}
              as: PharmacyAuthorizer
              as_user_id: "pharm-9"
            - call: "POST /episodes/${ep_g}/begin-discharge"
              payload: {}
              as: AdmittingPhysician
          trigger:
            - call: "POST /episodes/${ep_g}/discharge"
              payload: {}
              as: AdmittingPhysician
              captures: { err_first: $.data.error_id }
            - call: "POST /episodes/${ep_g}/sign-med-rec"
              payload: {}
              as: AdmittingPhysician
            - call: "POST /episodes/${ep_g}/discharge"
              payload: {}
              as: AdmittingPhysician
              captures: { err_second: $.data.error_id }
          assert:
            - "the first discharge attempt returns error_id ERR_MED_REC_UNSIGNED with HTTP 409"
            - "the first discharge attempt does NOT return ERR_DELIVERY_NOT_TERMINAL or ERR_RECONCILIATION_INCOMPLETE even though DeliveryOrder.${do_g}.status == AUTHORIZED and DeviceComponent.${comp_g}.reconciliation_status == PENDING_RECONCILIATION"
            - "the second discharge attempt returns error_id ERR_DELIVERY_NOT_TERMINAL with HTTP 409"
            - "Episode.${ep_g}.med_rec_signed == true after the sign call"
            - "Episode.${ep_g}.status is still DISCHARGE_PENDING after both attempts"

      - name: occ_stale_kit_version_beats_kit_unavailable_capacity_rule
        grounds:
          - "validations[priority=8]"
          - "validations[priority=25]"
          - "concurrency_rules[kit-deploy-stale-kit]"
          - state_machines.DeviceKit.AVAILABLE_to_DEPLOYED
        distinguishing_aspect: |
          Error-category pair state (priority 8, ERR_STALE_VERSION at rung 6) versus
          business_constraint (priority 25, ERR_KIT_UNAVAILABLE at rung 14) — a different pair
          from the safety-versus-referential conflict: one deploy request carries a stale
          expected_kit_version AND targets a kit that is already DEPLOYED, and the priority-8
          concurrency error must win.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T08:00:00Z."
            - "Two ACTIVE CMS_WAIVER episodes, A and B."
            - "One DeviceKit already DEPLOYED to episode A, so its version has advanced past the value the client captured at creation."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /patients"
              payload: { mrn: "MRN-K1", full_name: "Kim Kit", home_distance_km: 3.0, primary_diagnosis_code: "CHF_EXAC", diet_restriction: "NONE", broadband_verified: true, caregiver_present: true }
              as: AdmittingPhysician
              captures: { pat_ka: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-K2", full_name: "Ken Kit", home_distance_km: 3.0, primary_diagnosis_code: "CHF_EXAC", diet_restriction: "NONE", broadband_verified: true, caregiver_present: true }
              as: AdmittingPhysician
              captures: { pat_kb: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_ka}", origin: "ED", qualifying_condition_code: "CHF_EXAC", acuity: "STANDARD", referring_physician_user_id: "phys-1" }
              as: AdmittingPhysician
              captures: { ref_ka: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_kb}", origin: "ED", qualifying_condition_code: "CHF_EXAC", acuity: "STANDARD", referring_physician_user_id: "phys-1" }
              as: AdmittingPhysician
              captures: { ref_kb: $.data.id }
            - call: "POST /eligibility-assessments"
              payload: { referral_id: "${ref_ka}", in_person_eval_at: "2026-06-01T06:00:00Z", home_safety_outcome: "PASS", broadband_check: "PASS", caregiver_present_confirmed: true, consent_signed: true, assessor_user_id: "phys-1" }
              as: AdmittingPhysician
            - call: "POST /eligibility-assessments"
              payload: { referral_id: "${ref_kb}", in_person_eval_at: "2026-06-01T06:00:00Z", home_safety_outcome: "PASS", broadband_check: "PASS", caregiver_present_confirmed: true, consent_signed: true, assessor_user_id: "phys-1" }
              as: AdmittingPhysician
            - call: "POST /referrals/${ref_ka}/mark-eligible"
              payload: {}
              as: AdmittingPhysician
            - call: "POST /referrals/${ref_kb}/mark-eligible"
              payload: {}
              as: AdmittingPhysician
            - call: "POST /episodes"
              payload: { patient_id: "${pat_ka}", referral_id: "${ref_ka}", program_track: "CMS_WAIVER" }
              as: AdmittingPhysician
              captures: { ep_ka: $.data.id }
            - call: "POST /episodes"
              payload: { patient_id: "${pat_kb}", referral_id: "${ref_kb}", program_track: "CMS_WAIVER" }
              as: AdmittingPhysician
              captures: { ep_kb: $.data.id }
            - call: "POST /device-kits"
              payload: { asset_tag: "KIT-K1" }
              as: ProgramAdmin
              captures: { kit_k: $.data.id, kit_k_v0: $.data.version }
            - call: "POST /device-kits/${kit_k}/deploy"
              payload: { episode_id: "${ep_ka}", expected_kit_version: "${kit_k_v0}" }
              as: FieldNurse
              captures: { kit_k_v1: $.data.version }
          trigger:
            - call: "POST /device-kits/${kit_k}/deploy"
              payload: { episode_id: "${ep_kb}", expected_kit_version: "${kit_k_v0}" }
              as: FieldNurse
              captures: { err_occ: $.data.error_id }
          assert:
            - "the second deploy returns error_id ERR_STALE_VERSION with HTTP 412"
            - "the second deploy does NOT return ERR_KIT_UNAVAILABLE even though DeviceKit.${kit_k}.status == DEPLOYED also violates priority 25"
            - "DeviceKit.${kit_k}.assigned_episode_id == ${ep_ka}"
            - "DeviceKit.${kit_k}.version == ${kit_k_v1} (the rejected request did not advance it)"

  # =========================================================================
  # RULE 6 — boundary-precision checks on different metrics and endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: service_radius_inclusive_at_40km_and_exclusive_at_40_1km
        grounds:
          - "validations[priority=13]"
          - entities.Patient.fields.home_distance_km
          - entities.Referral.fields.first_failed_gauntlet_rung
          - state_machines.Referral.SCREENING_to_ELIGIBLE
        distinguishing_aspect: |
          Numeric threshold crossing on the home_distance_km metric, reached through
          POST /referrals/{id}/mark-eligible: exactly 40.0 km passes because the SERVICE_RADIUS_KM
          bound is inclusive, and 40.1 km fails with ERR_OUTSIDE_SERVICE_RADIUS.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T08:00:00Z."
            - "Patient AT is exactly 40.0 km from the hub; Patient OVER is 40.1 km."
            - "Both referrals are ED / CHF_EXAC / STANDARD with an all-PASS assessment, so only the radius rung can differ."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /patients"
              payload: { mrn: "MRN-AT", full_name: "Ada AtBound", home_distance_km: 40.0, primary_diagnosis_code: "CHF_EXAC", diet_restriction: "NONE", broadband_verified: true, caregiver_present: true }
              as: AdmittingPhysician
              captures: { pat_at: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-OV", full_name: "Otto OverBound", home_distance_km: 40.1, primary_diagnosis_code: "CHF_EXAC", diet_restriction: "NONE", broadband_verified: true, caregiver_present: true }
              as: AdmittingPhysician
              captures: { pat_ov: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_at}", origin: "ED", qualifying_condition_code: "CHF_EXAC", acuity: "STANDARD", referring_physician_user_id: "phys-1" }
              as: AdmittingPhysician
              captures: { ref_at: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_ov}", origin: "ED", qualifying_condition_code: "CHF_EXAC", acuity: "STANDARD", referring_physician_user_id: "phys-1" }
              as: AdmittingPhysician
              captures: { ref_ov: $.data.id }
            - call: "POST /eligibility-assessments"
              payload: { referral_id: "${ref_at}", in_person_eval_at: "2026-06-01T06:00:00Z", home_safety_outcome: "PASS", broadband_check: "PASS", caregiver_present_confirmed: true, consent_signed: true, assessor_user_id: "phys-1" }
              as: AdmittingPhysician
            - call: "POST /eligibility-assessments"
              payload: { referral_id: "${ref_ov}", in_person_eval_at: "2026-06-01T06:00:00Z", home_safety_outcome: "PASS", broadband_check: "PASS", caregiver_present_confirmed: true, consent_signed: true, assessor_user_id: "phys-1" }
              as: AdmittingPhysician
          trigger:
            - call: "POST /referrals/${ref_at}/mark-eligible"
              payload: {}
              as: AdmittingPhysician
            - call: "POST /referrals/${ref_ov}/mark-eligible"
              payload: {}
              as: AdmittingPhysician
              captures: { err_radius: $.data.error_id }
          assert:
            - "Referral.${ref_at}.status == ELIGIBLE and Referral.${ref_at}.first_failed_gauntlet_rung is null"
            - "the second call returns error_id ERR_OUTSIDE_SERVICE_RADIUS with HTTP 422"
            - "Referral.${ref_ov}.status is still SCREENING"
            - "Referral.${ref_ov}.first_failed_gauntlet_rung == ERR_OUTSIDE_SERVICE_RADIUS"

      - name: zero_billable_days_blocks_claim_build_on_empty_compliant_set
        grounds:
          - "validations[priority=31]"
          - calculations.episode_day_ledger
          - entities.Episode.fields.billable_day_count
        distinguishing_aspect: |
          Zero-count / empty-collection edge on a different metric (the set of COMPLIANT
          DailyComplianceRecord rows) and a different endpoint (POST /billing-claims): a waiver
          episode whose only service day carved out has an empty billable set, and the claim build
          must fail with ERR_NO_BILLABLE_DAYS rather than build a 0.00 claim.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T08:00:00Z."
            - "One ACTIVE CMS_WAIVER episode with exactly one COMPLETED and ATTESTED RN_IN_PERSON visit on 2026-06-01 — one short of the waiver requirement of two."
            - "The single 2026-06-01 compliance day is finalized and lands on CARVED_OUT, leaving billable_day_count == 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /patients"
              payload: { mrn: "MRN-Z1", full_name: "Zed Zero", home_distance_km: 2.0, primary_diagnosis_code: "COPD_EXAC", diet_restriction: "NONE", broadband_verified: true, caregiver_present: true }
              as: AdmittingPhysician
              captures: { pat_z: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_z}", origin: "ED", qualifying_condition_code: "COPD_EXAC", acuity: "STANDARD", referring_physician_user_id: "phys-1" }
              as: AdmittingPhysician
              captures: { ref_z: $.data.id }
            - call: "POST /eligibility-assessments"
              payload: { referral_id: "${ref_z}", in_person_eval_at: "2026-06-01T06:00:00Z", home_safety_outcome: "PASS", broadband_check: "PASS", caregiver_present_confirmed: true, consent_signed: true, assessor_user_id: "phys-1" }
              as: AdmittingPhysician
            - call: "POST /referrals/${ref_z}/mark-eligible"
              payload: {}
              as: AdmittingPhysician
            - call: "POST /episodes"
              payload: { patient_id: "${pat_z}", referral_id: "${ref_z}", program_track: "CMS_WAIVER" }
              as: AdmittingPhysician
              captures: { ep_z: $.data.id }
            - call: "POST /visits"
              payload: { episode_id: "${ep_z}", visit_type: "RN_IN_PERSON", staff_user_id: "rn-1", service_date: "2026-06-01", scheduled_start_at: "2026-06-01T09:00:00Z", scheduled_end_at: "2026-06-01T09:45:00Z", distance_km: 2.0 }
              as: FieldNurse
              captures: { v_z: $.data.id }
            - call: "POST /visits/${v_z}/depart"
              payload: {}
              as: FieldNurse
            - call: "POST /visits/${v_z}/complete"
              payload: {}
              as: FieldNurse
            - call: "POST /visits/${v_z}/attest"
              payload: {}
              as: FieldNurse
            - call: "GET /episodes/${ep_z}/compliance-days"
              payload: { service_date: "2026-06-01" }
              as: ProgramAdmin
              captures: { cd_z: "$.data[0].id" }
            - call: "POST /compliance-days/${cd_z}/finalize"
              payload: {}
              as: ProgramAdmin
            - call: "GET /episodes/${ep_z}"
              payload: {}
              as: BillingAnalyst
              captures: { ep_z_v: $.data.version }
          trigger:
            - call: "POST /billing-claims"
              payload: { episode_id: "${ep_z}", expected_episode_version: "${ep_z_v}" }
              as: BillingAnalyst
              captures: { err_nobill: $.data.error_id }
          assert:
            - "the claim build returns error_id ERR_NO_BILLABLE_DAYS with HTTP 422"
            - "DailyComplianceRecord.${cd_z}.status == CARVED_OUT"
            - "Episode.${ep_z}.billable_day_count == 0, carved_out_day_count == 1, pending_day_count == 0, service_day_count == 1"
            - "Episode.${ep_z}.reimbursement_amount_usd == 0.00"
            - "GET /episodes/${ep_z}/billing-claims returns an empty array with total_count == 0"

  # =========================================================================
  # RULE 7 — cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: visit_creation_blocked_while_parent_episode_is_escalated
        grounds:
          - "validations[priority=10]"
          - state_machines.Episode.ACTIVE_to_ESCALATED
          - state_machines.EscalationEvent.TIER2_OPEN_to_TIER3_OPEN
          - "errors[ERR_EPISODE_NOT_ACTIVE]"
        distinguishing_aspect: |
          Entity pair Visit -> Episode: whether a Visit may be created depends entirely on the
          Episode's own status, and the tier-3 promotion of an unrelated EscalationEvent flips the
          Episode to ESCALATED, which makes the very same POST /visits body fail.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T08:00:00Z."
            - "One CMS_WAIVER STANDARD-acuity episode whose escalation has been promoted to TIER3_OPEN, so Episode.status == ESCALATED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /patients"
              payload: { mrn: "MRN-E1", full_name: "Elsa Escalate", home_distance_km: 6.0, primary_diagnosis_code: "CHF_EXAC", diet_restriction: "NONE", broadband_verified: true, caregiver_present: true }
              as: AdmittingPhysician
              captures: { pat_e: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_e}", origin: "ED", qualifying_condition_code: "CHF_EXAC", acuity: "STANDARD", referring_physician_user_id: "phys-1" }
              as: AdmittingPhysician
              captures: { ref_e: $.data.id }
            - call: "POST /eligibility-assessments"
              payload: { referral_id: "${ref_e}", in_person_eval_at: "2026-06-01T06:00:00Z", home_safety_outcome: "PASS", broadband_check: "PASS", caregiver_present_confirmed: true, consent_signed: true, assessor_user_id: "phys-1" }
              as: AdmittingPhysician
            - call: "POST /referrals/${ref_e}/mark-eligible"
              payload: {}
              as: AdmittingPhysician
            - call: "POST /episodes"
              payload: { patient_id: "${pat_e}", referral_id: "${ref_e}", program_track: "CMS_WAIVER" }
              as: AdmittingPhysician
              captures: { ep_e: $.data.id }
            - call: "POST /escalation-events"
              payload: { episode_id: "${ep_e}", reason: "VITALS_OUT_OF_RANGE", opened_by_user_id: "rn-1" }
              as: FieldNurse
              captures: { esc_e: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:11:00Z" }
              as: ProgramAdmin
            - call: "POST /escalation-events/${esc_e}/promote"
              payload: {}
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:32:00Z" }
              as: ProgramAdmin
            - call: "POST /escalation-events/${esc_e}/promote"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /visits"
              payload: { episode_id: "${ep_e}", visit_type: "RN_IN_PERSON", staff_user_id: "rn-1", service_date: "2026-06-01", scheduled_start_at: "2026-06-01T10:00:00Z", scheduled_end_at: "2026-06-01T10:45:00Z", distance_km: 6.0 }
              as: FieldNurse
              captures: { err_epi: $.data.error_id }
          assert:
            - "EscalationEvent.${esc_e}.status == TIER3_OPEN and EscalationEvent.${esc_e}.promotion_count == 2"
            - "Episode.${ep_e}.status == ESCALATED"
            - "the visit creation returns error_id ERR_EPISODE_NOT_ACTIVE with HTTP 409"
            - "GET /episodes/${ep_e}/visits returns an empty array with total_count == 0"

      - name: bed_return_conversion_blocked_when_reservation_has_expired
        grounds:
          - state_machines.EscalationEvent.TIER4_OPEN_to_BED_RETURN_CONVERTED
          - state_machines.BedReservation.HELD_to_EXPIRED
          - entities.BedReservation.fields.hold_expires_at
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: |
          Entity pair EscalationEvent -> BedReservation, a different pair from Visit -> Episode:
          the escalation is in a perfectly legal TIER4_OPEN state and the episode is ESCALATED,
          yet the conversion fails purely because the only BedReservation of the episode has
          lazily expired out of HELD.
        test_recipe:
          setup:
            - "One CMS_WAIVER STANDARD-acuity episode promoted to TIER4_OPEN on 2026-06-02."
            - "A 2-bed unit with one BedReservation held at 2026-06-02T09:32:00Z, so hold_expires_at is 2026-06-02T11:32:00Z."
            - "The clock is then advanced to 2026-06-02T11:33:00Z and the reservation is read, which lazily expires it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /patients"
              payload: { mrn: "MRN-X1", full_name: "Xena Expire", home_distance_km: 8.0, primary_diagnosis_code: "CHF_EXAC", diet_restriction: "NONE", broadband_verified: true, caregiver_present: true }
              as: AdmittingPhysician
              captures: { pat_x: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_x}", origin: "ED", qualifying_condition_code: "CHF_EXAC", acuity: "STANDARD", referring_physician_user_id: "phys-1" }
              as: AdmittingPhysician
              captures: { ref_x: $.data.id }
            - call: "POST /eligibility-assessments"
              payload: { referral_id: "${ref_x}", in_person_eval_at: "2026-06-02T07:00:00Z", home_safety_outcome: "PASS", broadband_check: "PASS", caregiver_present_confirmed: true, consent_signed: true, assessor_user_id: "phys-1" }
              as: AdmittingPhysician
            - call: "POST /referrals/${ref_x}/mark-eligible"
              payload: {}
              as: AdmittingPhysician
            - call: "POST /episodes"
              payload: { patient_id: "${pat_x}", referral_id: "${ref_x}", program_track: "CMS_WAIVER" }
              as: AdmittingPhysician
              captures: { ep_x: $.data.id }
            - call: "POST /escalation-events"
              payload: { episode_id: "${ep_x}", reason: "FALL", opened_by_user_id: "rn-1" }
              as: FieldNurse
              captures: { esc_x: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T09:11:00Z" }
              as: ProgramAdmin
            - call: "POST /escalation-events/${esc_x}/promote"
              payload: {}
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T09:32:00Z" }
              as: ProgramAdmin
            - call: "POST /escalation-events/${esc_x}/promote"
              payload: {}
              as: ProgramAdmin
            - call: "POST /inpatient-units"
              payload: { unit_code: "UNIT-X", total_beds: 2 }
              as: ProgramAdmin
