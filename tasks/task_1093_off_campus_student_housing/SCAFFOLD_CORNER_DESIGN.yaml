          assert:
            - "the first placement returns HTTP 200 and RoommateGroup.${g1}.status == PLACED"
            - "the stale-version placement returns HTTP 412 with error_id == ERR_STALE_VERSION and leaves RoommateGroup.${g2}.status == LOCKED"
            - "the fresh-version placement returns HTTP 200 with RoommateGroup.${g2}.status == PLACED"
            - "Unit.${unit1}.occupancy_status == FULLY_LEASED and Property.${prop1}.status == FULLY_COMMITTED"
            - "GET /leases?unit_id=${unit1} returns exactly 4 rows"

      - name: occ_stale_property_version_on_payout_create_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[payout-create-stale-property]
          - validations[priority=7]
          - errors[ERR_STALE_VERSION]
        excluded_because:
          difficulty_instance: payout_period_with_zero_collections_is_rejected
          rationale: "The §1.8 boundary instance and payout_settlement instances already read Property.version fresh via GET /properties before each POST /payouts; the stale-version negative on this same endpoint is a routine mirror of group-place-stale-unit and is asserted there."

  - section: rbac
    instances:
      - name: university_partner_cannot_terminate_a_lease
        claim_type: exclusive op denial
        grounds:
          - roles
          - endpoints[POST /leases/{id}/terminate]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "POST /leases/{id}/terminate is a PropertyManager exclusive operation; a UniversityPartner calling it is denied with HTTP 403 ERR_UNAUTHORIZED at priority 2, before ownership is considered."
        test_recipe:
          setup:
            - "University SU, LISTED property with a 4-bed unit; one VERIFIED student with an ACTIVE lease."
          setup_api_calls:
            - call: "POST /universities"
              payload: { name: "State University", code: "SU", partner_tier: "PREFERRED", verification_required: true, academic_year_start_date: "2026-08-15", academic_year_end_date: "2027-05-15", partner_admin_user_id: "uni-admin-su" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { uni_su: $.data.id }
            - call: "POST /properties"
              payload: { university_id: "${uni_su}", name: "Maple Commons", address_line: "12 Maple St", distance_to_campus_m: 800 }
              as: PropertyManager
              as_user_id: "mgr-1"
              captures: { prop1: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop1}", unit_number: "101", floorplan_code: "4x2", bedroom_count: 4, bathroom_count: 2, bed_labels: ["A", "B", "C", "D"], base_rent_cents_per_bed_monthly: 90000 }
              as: PropertyManager
              as_user_id: "mgr-1"
              captures: { unit1: $.data.id }
            - call: "POST /properties/${prop1}/list"
              payload: {}
              as: PropertyManager
              as_user_id: "mgr-1"
            - call: "POST /students"
              payload: { university_id: "${uni_su}", full_name: "Ava Lead", email: "ava@su.edu", credit_score_band: "GOOD", cleanliness_level: 4, noise_tolerance: 3, sleep_schedule: "EARLY", smoker: false }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { s1: $.data.id }
            - call: "POST /students/${s1}/verification-requests"
              payload: {}
              as: Student
              as_user_id: "${s1}"
            - call: "POST /students/${s1}/verification-decision"
              payload: { decision: "APPROVE" }
              as: UniversityPartner
              as_user_id: "uni-admin-su"
            - call: "POST /leases"
              payload: { student_id: "${s1}", unit_id: "${unit1}", bed_label: "A", term_start_date: "2026-08-15", term_end_date: "2027-08-01", installment_count: 10 }
              as: Student
              as_user_id: "${s1}"
              captures: { l1: $.data.id }
            - call: "POST /leases/${l1}/submit"
              payload: {}
              as: Student
              as_user_id: "${s1}"
            - call: "POST /leases/${l1}/sign"
              payload: {}
              as: Student
              as_user_id: "${s1}"
          trigger:
            - call: "POST /leases/${l1}/terminate"
              payload: { reason: "not my job" }
              as: UniversityPartner
              as_user_id: "uni-admin-su"
              captures: { role_err: $.data.error_id }
          assert:
            - "HTTP 403 with error_id == ERR_UNAUTHORIZED"
            - "Lease.${l1}.lease_status == ACTIVE (unchanged)"

  - section: consistency_model
    instances:
      - name: bed_reservation_visible_in_same_request_response
        claim_type: immediate
        grounds:
          - state_machines.Lease.DRAFT_to_PENDING_SIGNATURE
          - calculations.unit_occupancy_rollup
        excluded_because:
          difficulty_instance: bed_reservation_and_cancellation_conserve_unit_bed_partition
          rationale: "That §1.8 invariant instance already observes the Unit and Property rollups immediately after submit and after cancel within the same request chain, confirming the immediate-consistency model."
