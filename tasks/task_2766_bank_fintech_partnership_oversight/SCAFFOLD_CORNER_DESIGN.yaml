              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { plan_id: $.data.id, plan_status: $.data.status, plan_round: $.data.revision_round, plan_residual: $.data.residual_balance_cents }
            - call: "POST /oversight/wind-down-plans/${plan_id}/submit"
              payload: { submission_note: "Milestones agreed with the partner." }
              as: ProgramOfficer
              as_user_id: "po-alice"
            - call: "POST /oversight/wind-down-plans/${plan_id}/decide"
              payload: { decision: "APPROVE", decision_note: "Notice period and disposition acceptable." }
