    output: RetailerInvoice
    side_effects: []

  - method: POST
    path: /retailer-invoices/{id}/validate
    description: "Validates every line of an invoice against the resolved posted prices and the allowance caps."
    roles: [FilingAgent]
    success_code: 200
    input: []
    output: RetailerInvoice
    side_effects:
      - "recomputes every line per calculations invoice_line_net_price and off_posted_detection"
      - "recomputes the invoice rollups per calculation invoice_settlement_total"
      - "sets validation_status to FLAGGED when any line is off posted price, otherwise VALIDATED"
      - "increments RetailerInvoice.version by 1"

  - method: GET
    path: /retailer-invoices/{id}
    description: "Retrieves one retailer invoice including its settlement rollups."
    roles: [ComplianceOfficer, FilingAgent, CertifyingOfficer]
    success_code: 200
