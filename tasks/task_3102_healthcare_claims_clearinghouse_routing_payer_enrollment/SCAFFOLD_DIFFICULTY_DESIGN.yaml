              as_user_id: "${prov_a}"
              captures: { cred_a: $.data.id }
            - call: "POST /clearinghouse/providers/${prov_a}/credentials/${cred_a}/submit"
              payload: {}
              as: ProviderAdmin
              as_user_id: "${prov_a}"
            - call: "POST /clearinghouse/providers/${prov_a}/activate"
              payload: {}
              as: ClearinghouseOps
            - call: "POST /clearinghouse/payers"
              payload: { payer_id_code: "PAYIV", display_name: "Invariant Payer", claims_lead_time_days: 5, remittance_lead_time_days: 5, eligibility_lead_time_seconds: 60, pricing_model: "PROVIDER_FUNDED", monthly_minimum_cents: 0 }
              as: ClearinghouseOps
              captures: { pay_a: $.data.id }
            - call: "POST /clearinghouse/payers/${pay_a}/edit-rules"
              payload: { rule_code: "DX_REQUIRED", applies_to: "CLAIM_INTAKE", severity: "ERROR", expression: "diagnosis_codes.nonempty", effective_from: "2026-01-01T00:00:00Z" }
              as: ClearinghouseOps
            - call: "POST /clearinghouse/providers/${prov_a}/enrollments"
              payload: { payer_id: "${pay_a}", transaction_type: "CLAIMS_837" }
              as: ProviderAdmin
              as_user_id: "${prov_a}"
              captures: { enr_a: $.data.id }
            - call: "POST /clearinghouse/providers/${prov_a}/enrollments/${enr_a}/submit"
              payload: {}
              as: ProviderAdmin
              as_user_id: "${prov_a}"
            - call: "POST /clearinghouse/_enrollments/${enr_a}/advance-to-review"
              payload: {}
              as: ClearinghouseOps
            - call: "GET /clearinghouse/providers/${prov_a}/enrollments/${enr_a}"
              payload: {}
              as: ProviderAdmin
              as_user_id: "${prov_a}"
              captures: { enr_v: $.data.version }
            - call: "POST /clearinghouse/enrollments/${enr_a}/payer-decision"
              payload: { decision: "APPROVE", expected_enrollment_version: "${enr_v}" }
              as: PayerOperator
              as_user_id: "${pay_a}"
          trigger:
            - call: "POST /clearinghouse/providers/${prov_a}/claims"
              payload: { payer_id: "${pay_a}", submitter_credential_id: "${cred_a}", patient_control_number: "PCN-OK", idempotency_key: "IDEM-OK", service_date: "2026-09-01T00:00:00Z", total_charge_cents: 100, diagnosis_codes: ["Z00.0"], rendering_npi: "1343434348", subscriber_id: "MBR-IN", lines: [{ cpt_code: "99213", units: 1, unit_charge_cents: 100 }] }
              as: ProviderAdmin
              as_user_id: "${prov_a}"
              captures: { clm_ok: $.data.id }
            - call: "POST /clearinghouse/providers/${prov_a}/claims"
              payload: { payer_id: "${pay_a}", submitter_credential_id: "${cred_a}", patient_control_number: "PCN-BAD", idempotency_key: "IDEM-BAD", service_date: "2026-09-01T00:00:00Z", total_charge_cents: 100, diagnosis_codes: [], rendering_npi: "1343434348", subscriber_id: "MBR-IN", lines: [{ cpt_code: "99213", units: 1, unit_charge_cents: 100 }] }
