# =============================================================================
# task_0131_it_asset_license — SCAFFOLD.yaml  (§1.0–§1.7)
# IT Asset & Software License management — Expert difficulty
# =============================================================================

scenario: |
  IT Asset & Software License: hardware/software inventory, entitlement vs
  install true-up, assignment/checkout, warranty/lease expiry, renewal,
  per-seat/per-core compliance, depreciation, retirement/disposal

domain_name: it-asset-license
api_prefix: /assets

# Server-controlled wall clock: every time-dependent rule (warranty/lease expiry,
# depreciation as-of date, entitlement term boundaries, checkout intervals) reads
# the server clock, which a test sets via POST /_clock/set_current_utc. No real
# wall-clock waits are ever required.

complexity_profile:
  primary_archetype: "Ledger reconciliation"          # entitlement-vs-install true-up; provisional-vs-final depreciation
  secondary_archetype: "Quota / allocation"           # per-seat/per-core entitlement pool consumed by installs
  complexity_layers:
    - dual_variant_calculation                        # live vs audit true-up; book vs disposal depreciation
    - optimistic_concurrency                          # OCC on parent version for supersede-style creates
    - cascading_side_effects                          # disposal → uninstall → entitlement ledger
    - derived_field_reconciliation                    # consumed_units / net_book_value kept consistent on every mutation

  entity_topology: flat
  # Peer entities joined by foreign keys (no deep URL nesting). HardwareAsset,
  # SoftwareProduct, LicenseEntitlement, Employee are top-level collections;
  # children (installs, checkouts, coverage, disposals, renewals, findings)
  # reference them by FK in the body and are discovered via filtered-list GETs.

  state_machine_shape: cyclic
  # HardwareAsset cycles IN_STOCK↔ASSIGNED and IN_STOCK↔IN_REPAIR; LicenseEntitlement
  # and WarrantyLease cycle ACTIVE→RENEWED→ACTIVE; DisposalRequest is branching
  # (SUBMITTED→{APPROVED,REJECTED}) — non-linear on several entities.

  relationship_patterns:
    - one_to_many       # SoftwareProduct→LicenseEntitlement, HardwareAsset→WarrantyLease/InstallationRecord/AssignmentCheckout
    - cross_aggregate   # InstallationRecord ties a HardwareAsset to a SoftwareProduct/LicenseEntitlement
    - polymorphic       # RenewalOrder targets either a LicenseEntitlement or a WarrantyLease (exactly one FK set)

  role_model: segregation_of_duties
  # AssetManager submits a DisposalRequest; a *different* ComplianceOfficer must
  # approve it (same X-User-ID cannot both submit and approve). AssetManager owns
  # inventory CRUD; ComplianceOfficer owns true-up/compliance + disposal approval;
  # Employee is a read-only self-service identity.

  consistency_model: immediate
  # All cascades and derived-field recomputes are atomic within the triggering request.

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  # ---- Configuration ----
  - name: Vendor
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Vendor/supplier legal name" }
      - { name: vendor_type, type: enum, source: input, description: "HARDWARE | SOFTWARE | BOTH", constraints: "one of HARDWARE, SOFTWARE, BOTH" }
      - { name: support_email, type: string, source: input, description: "Support contact email" }
      - { name: active, type: boolean, source: input, default: true, description: "Whether vendor may be referenced by new assets/products" }

  - name: Employee
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Employee full name" }
      - { name: email, type: string, source: input, description: "Employee email (unique among non-OFFBOARDED employees)" }
      - { name: department, type: string, source: input, description: "Department/cost-center label" }
      - { name: max_assigned_assets, type: integer, source: input, default: 3, description: "Cap on simultaneously OPEN hardware checkouts for this employee", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | OFFBOARDED", default: "ACTIVE", constraints: "ACTIVE, SUSPENDED, OFFBOARDED" }
      - { name: open_checkout_count, type: integer, source: computed, default: 0, description: "Count of AssignmentCheckout in status OPEN for this employee" }

  - name: SoftwareProduct
    parent: null
    common_fields: true
    fields:
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id; publisher of the product" }
      - { name: name, type: string, source: input, description: "Product name" }
      - { name: license_model, type: enum, source: input, description: "PER_SEAT | PER_CORE — drives required-units math", constraints: "PER_SEAT or PER_CORE; immutable after create" }
      - { name: core_factor, type: number, source: input, default: 1.0, description: "Per-core multiplier applied to physical_cores (PER_CORE only)", constraints: ">= 0; ignored for PER_SEAT" }
      - { name: min_core_units, type: integer, source: input, default: 1, description: "Per-install minimum licensable core units (PER_CORE only)", constraints: ">= 1; ignored for PER_SEAT" }
      - { name: compliance_status, type: enum, source: computed, default: "COMPLIANT", description: "COMPLIANT | OVER_DEPLOYED | UNDER_REVIEW — last finalized true-up verdict for this product", constraints: "COMPLIANT, OVER_DEPLOYED, UNDER_REVIEW" }

  - name: HardwareAsset
    parent: null
    common_fields: true
    fields:
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id; manufacturer/supplier" }
      - { name: asset_tag, type: string, source: input, description: "Org-unique inventory tag (unique among non-DISPOSED assets)" }
      - { name: category, type: enum, source: input, description: "LAPTOP | DESKTOP | SERVER | MONITOR | MOBILE", constraints: "one of LAPTOP, DESKTOP, SERVER, MONITOR, MOBILE" }
      - { name: physical_cores, type: integer, source: input, default: 0, description: "CPU core count, used by PER_CORE entitlement math when software is installed", constraints: ">= 0" }
      - { name: purchase_cost_cents, type: integer, source: input, description: "Acquisition cost in cents (depreciation basis)", constraints: ">= 0" }
      - { name: in_service_date, type: datetime, source: input, description: "Date asset entered service; depreciation start (ISO 8601 UTC)" }
      - { name: useful_life_months, type: integer, source: input, default: 36, description: "Straight-line depreciation horizon in whole months", constraints: ">= 1" }
      - { name: salvage_value_cents, type: integer, source: input, default: 0, description: "Residual value floor for depreciation", constraints: ">= 0 and <= purchase_cost_cents" }
      - { name: status, type: enum, source: system, default: "IN_STOCK", description: "IN_STOCK | ASSIGNED | IN_REPAIR | RETIRED | DISPOSED", constraints: "IN_STOCK, ASSIGNED, IN_REPAIR, RETIRED, DISPOSED" }
      - { name: support_status, type: enum, source: computed, default: "UNCOVERED", description: "IN_WARRANTY | LEASED | OUT_OF_WARRANTY | UNCOVERED — derived from active WarrantyLease coverage vs server clock", constraints: "IN_WARRANTY, LEASED, OUT_OF_WARRANTY, UNCOVERED" }
      - { name: accumulated_depreciation_cents, type: integer, source: computed, default: 0, description: "Straight-line depreciation booked through the server clock's as-of date (provisional variant)" }
      - { name: net_book_value_cents, type: integer, source: computed, description: "= purchase_cost_cents - accumulated_depreciation_cents (floored at salvage_value_cents)" }
      - { name: disposal_proceeds_cents, type: integer, source: system, default: 0, description: "Sale proceeds recorded at DISPOSED; 0 until disposal completes", constraints: ">= 0" }
      - { name: disposal_gain_loss_cents, type: integer, source: computed, default: 0, description: "Final disposal gain/loss = disposal_proceeds_cents - net_book_value_at_disposal (signed; positive = gain)" }

  - name: WarrantyLease
    parent: null
    common_fields: true
    fields:
      - { name: hardware_asset_id, type: string, source: input, description: "FK -> HardwareAsset.id; the covered asset" }
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id; coverage provider" }
      - { name: coverage_type, type: enum, source: input, description: "WARRANTY | LEASE", constraints: "WARRANTY or LEASE" }
      - { name: coverage_start, type: datetime, source: input, description: "Coverage start (inclusive, ISO 8601 UTC)" }
      - { name: coverage_end, type: datetime, source: input, description: "Coverage end (inclusive, ISO 8601 UTC)" }
      - { name: monthly_cost_cents, type: integer, source: input, default: 0, description: "Lease monthly charge in cents (0 for warranty)", constraints: ">= 0" }
      - { name: auto_renew, type: boolean, source: input, default: false, description: "Whether coverage is eligible for renewal extension" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | EXPIRED | RENEWED | CANCELLED", constraints: "ACTIVE, EXPIRED, RENEWED, CANCELLED" }

  - name: LicenseEntitlement
    parent: null
    common_fields: true
    fields:
      - { name: software_product_id, type: string, source: input, description: "FK -> SoftwareProduct.id; product this entitlement licenses" }
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id; entitlement seller" }
      - { name: entitled_units, type: integer, source: input, description: "Purchased capacity: seats (PER_SEAT) or core-units (PER_CORE)", constraints: ">= 0" }
      - { name: unit_price_cents, type: integer, source: input, description: "Price per unit in cents (renewal cost basis)", constraints: ">= 0" }
      - { name: term_start, type: datetime, source: input, description: "Entitlement term start (inclusive, ISO 8601 UTC)" }
      - { name: term_end, type: datetime, source: input, description: "Entitlement term end (inclusive, ISO 8601 UTC)" }
      - { name: grace_days, type: integer, source: input, default: 0, description: "Days after term_end the entitlement still counts toward audit true-up", constraints: ">= 0" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | ACTIVE | SUSPENDED | EXPIRED | RENEWED", constraints: "DRAFT, ACTIVE, SUSPENDED, EXPIRED, RENEWED" }
      - { name: consumed_units, type: integer, source: computed, default: 0, description: "Live count of units consumed by ACTIVE InstallationRecords charged to this entitlement (per-seat: count; per-core: sum of required_core_units)" }
      - { name: available_units, type: integer, source: computed, description: "= entitled_units - consumed_units (may be negative when over-deployed)" }

  - name: InstallationRecord
    parent: null
    common_fields: true
    fields:
      - { name: software_product_id, type: string, source: input, description: "FK -> SoftwareProduct.id; product installed" }
      - { name: hardware_asset_id, type: string, source: input, description: "FK -> HardwareAsset.id; machine the software is installed on" }
      - { name: license_entitlement_id, type: string, source: input, description: "FK -> LicenseEntitlement.id; entitlement charged for this install" }
      - { name: required_core_units, type: integer, source: computed, default: 0, description: "Units this install consumes once ACTIVE (PER_SEAT: 1; PER_CORE: max(min_core_units, ceil(physical_cores * core_factor)))" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING | ACTIVE | UNINSTALLED | REJECTED", constraints: "PENDING, ACTIVE, UNINSTALLED, REJECTED" }
      - { name: activated_at, type: datetime, source: system, description: "Server clock when install moved PENDING→ACTIVE (null until activated)" }

  - name: AssignmentCheckout
    parent: null
    common_fields: true
    fields:
      - { name: hardware_asset_id, type: string, source: input, description: "FK -> HardwareAsset.id; asset checked out" }
      - { name: employee_id, type: string, source: input, description: "FK -> Employee.id; holder of the asset" }
      - { name: checkout_at, type: datetime, source: input, description: "Checkout start instant (inclusive, ISO 8601 UTC)" }
      - { name: expected_return_at, type: datetime, source: input, description: "Planned return instant (exclusive upper bound of the occupied interval)" }
      - { name: returned_at, type: datetime, source: system, description: "Actual return instant; null while OPEN" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | RETURNED | LOST", constraints: "OPEN, RETURNED, LOST" }

  - name: DisposalRequest
    parent: null
    common_fields: true
    fields:
      - { name: hardware_asset_id, type: string, source: input, description: "FK -> HardwareAsset.id; asset proposed for retirement/disposal" }
      - { name: submitted_by_user_id, type: string, source: input, description: "X-User-ID of the AssetManager who submitted (segregation-of-duties subject)" }
      - { name: reason, type: enum, source: input, description: "END_OF_LIFE | DAMAGED | LOST | SOLD", constraints: "END_OF_LIFE, DAMAGED, LOST, SOLD" }
      - { name: proposed_proceeds_cents, type: integer, source: input, default: 0, description: "Expected sale proceeds in cents (recorded as disposal_proceeds_cents on completion)", constraints: ">= 0" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of the ComplianceOfficer who approved; null until approved" }
      - { name: status, type: enum, source: system, default: "SUBMITTED", description: "SUBMITTED | APPROVED | REJECTED | COMPLETED | REVERSED", constraints: "SUBMITTED, APPROVED, REJECTED, COMPLETED, REVERSED" }

  - name: RenewalOrder
    parent: null
    common_fields: true
    fields:
      - { name: target_type, type: enum, source: input, description: "ENTITLEMENT | COVERAGE — which kind of resource is renewed", constraints: "ENTITLEMENT or COVERAGE" }
      - { name: license_entitlement_id, type: string, source: input, description: "FK -> LicenseEntitlement.id; set iff target_type=ENTITLEMENT, else null" }
      - { name: warranty_lease_id, type: string, source: input, description: "FK -> WarrantyLease.id; set iff target_type=COVERAGE, else null" }
      - { name: extend_months, type: integer, source: input, description: "Whole months to extend term_end/coverage_end on completion", constraints: ">= 1" }
      - { name: added_units, type: integer, source: input, default: 0, description: "Extra entitled_units added on completion (ENTITLEMENT only)", constraints: ">= 0" }
      - { name: quoted_cost_cents, type: integer, source: computed, default: 0, description: "Renewal cost computed at completion (see renewal_cost calculation)" }
      - { name: status, type: enum, source: system, default: "QUOTED", description: "QUOTED | COMPLETED | CANCELLED", constraints: "QUOTED, COMPLETED, CANCELLED" }

  - name: TrueUpReconciliation
    parent: null
    common_fields: true
    fields:
      - { name: software_product_id, type: string, source: input, description: "FK -> SoftwareProduct.id; product reconciled" }
      - { name: variant, type: enum, source: input, description: "LIVE | AUDIT — provisional vs final inclusion set", constraints: "LIVE or AUDIT" }
      - { name: as_of, type: datetime, source: input, description: "As-of instant for the reconciliation (defaults to server clock if omitted)" }
      - { name: total_entitled_units, type: integer, source: computed, default: 0, description: "Entitled units summed over in-scope entitlements for this variant" }
      - { name: total_consumed_units, type: integer, source: computed, default: 0, description: "Consumed units summed over in-scope installs for this variant" }
      - { name: position_units, type: integer, source: computed, default: 0, description: "= total_entitled_units - total_consumed_units (negative = over-deployed)" }
      - { name: verdict, type: enum, source: computed, default: "COMPLIANT", description: "COMPLIANT | OVER_DEPLOYED — position_units < 0 → OVER_DEPLOYED", constraints: "COMPLIANT, OVER_DEPLOYED" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | FINALIZED", constraints: "DRAFT, FINALIZED" }

  - name: ComplianceFinding
    parent: null
    common_fields: false
    fields:
      - { name: true_up_reconciliation_id, type: string, source: input, description: "FK -> TrueUpReconciliation.id; the run that produced this finding" }
      - { name: software_product_id, type: string, source: input, description: "FK -> SoftwareProduct.id; product the finding concerns" }
      - { name: finding_type, type: enum, source: system, description: "OVER_DEPLOYED | EXPIRED_IN_GRACE | NEGATIVE_AVAILABLE", constraints: "OVER_DEPLOYED, EXPIRED_IN_GRACE, NEGATIVE_AVAILABLE" }
      - { name: detail, type: string, source: system, description: "Human-readable finding detail captured at finalize time" }
      - { name: shortfall_units, type: integer, source: system, default: 0, description: "Units over-deployed at finalize time (>= 0)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---------------------------------------------------------------- HardwareAsset
  - entity: HardwareAsset
    initial_state: IN_STOCK
    terminal_states: [DISPOSED]
    transitions:
      - from: IN_STOCK
        to: ASSIGNED
        trigger: "POST /assets/hardware/{id}/checkout (creates AssignmentCheckout)"
        actor: AssetManager
        preconditions:
          - "asset.status == IN_STOCK (ERR_ASSET_NOT_AVAILABLE)"
          - "target Employee.status == ACTIVE (ERR_EMPLOYEE_NOT_ACTIVE)  # cross-entity: Checkout→Employee"
          - "Employee.open_checkout_count < Employee.max_assigned_assets (ERR_ASSIGNMENT_LIMIT_REACHED)"
          - "no existing OPEN AssignmentCheckout on this asset whose [checkout_at, expected_return_at) overlaps the new [checkout_at, expected_return_at) (ERR_CHECKOUT_OVERLAP)"
        side_effects:
          - "create AssignmentCheckout{status=OPEN}"
          - "Employee.open_checkout_count += 1"
          - "asset.status = ASSIGNED"
      - from: ASSIGNED
        to: IN_STOCK
        trigger: "POST /assets/checkouts/{id}/return"
        actor: AssetManager
        preconditions:
          - "checkout.status == OPEN (ERR_INVALID_STATE)"
        side_effects:
          - "checkout.status = RETURNED; checkout.returned_at = server clock"
          - "Employee.open_checkout_count -= 1"
          - "asset.status = IN_STOCK"
      - from: IN_STOCK
        to: IN_REPAIR
        trigger: "POST /assets/hardware/{id}/transition {to_status: IN_REPAIR}"
        actor: AssetManager
        preconditions:
          - "asset.status == IN_STOCK (ERR_INVALID_STATE)"
        side_effects: []
      - from: IN_REPAIR
        to: IN_STOCK
        trigger: "POST /assets/hardware/{id}/transition {to_status: IN_STOCK}"
        actor: AssetManager
        preconditions:
          - "asset.status == IN_REPAIR (ERR_INVALID_STATE)"
        side_effects: []
      - from: IN_STOCK
        to: RETIRED
        trigger: "POST /assets/disposal-requests/{id}/approve (DisposalRequest APPROVED side-effect)"
        actor: system
        preconditions:
          - "asset.status IN {IN_STOCK, IN_REPAIR} (ERR_ASSET_NOT_RETIREABLE)"
          - "no OPEN AssignmentCheckout on asset (ERR_ASSET_HAS_OPEN_CHECKOUT)  # cross-entity: DisposalRequest→AssignmentCheckout"
        side_effects:
          - "asset.status = RETIRED"
      - from: IN_REPAIR
        to: RETIRED
        trigger: "POST /assets/disposal-requests/{id}/approve (DisposalRequest APPROVED side-effect)"
        actor: system
        preconditions:
          - "asset.status IN {IN_STOCK, IN_REPAIR} (ERR_ASSET_NOT_RETIREABLE)"
          - "no OPEN AssignmentCheckout on asset (ERR_ASSET_HAS_OPEN_CHECKOUT)"
        side_effects:
          - "asset.status = RETIRED"
      - from: RETIRED
        to: DISPOSED
        trigger: "POST /assets/disposal-requests/{id}/complete"
        actor: ComplianceOfficer
        preconditions:
          - "asset.status == RETIRED (ERR_INVALID_STATE)"
          - "DisposalRequest.status == APPROVED (ERR_INVALID_STATE)"
        side_effects:
          - "finalize depreciation as of server clock; recompute net_book_value_cents (final variant)"
          - "asset.disposal_proceeds_cents = DisposalRequest.proposed_proceeds_cents"
          - "asset.disposal_gain_loss_cents = disposal_proceeds_cents - net_book_value_cents"
          - "asset.status = DISPOSED"
          - "every ACTIVE InstallationRecord on this asset → UNINSTALLED (cascade)"
          - "DisposalRequest.status = COMPLETED"
      - from: DISPOSED
        to: RETIRED
        trigger: "POST /assets/disposal-requests/{id}/reverse (compensating action)"
        actor: ComplianceOfficer
        preconditions:
          - "asset.status == DISPOSED (ERR_INVALID_STATE)"
          - "DisposalRequest.status == COMPLETED (ERR_INVALID_STATE)"
        side_effects:
          - "asset.disposal_proceeds_cents = 0; asset.disposal_gain_loss_cents = 0"
          - "recompute accumulated_depreciation_cents and net_book_value_cents from server clock (provisional variant) — restores pre-disposal book value"
          - "asset.status = RETIRED"
          - "DisposalRequest.status = REVERSED"
          - "NOTE: installs uninstalled by the disposal are NOT resurrected (compensation conserves total_net_book_value, not install graph)"

  # ---------------------------------------------------------------- LicenseEntitlement
  - entity: LicenseEntitlement
    initial_state: DRAFT
    terminal_states: [EXPIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /assets/entitlements/{id}/activate"
        actor: AssetManager
        preconditions:
          - "entitlement.status == DRAFT (ERR_INVALID_STATE)"
          - "SoftwareProduct exists and term_start <= term_end (ERR_INVALID_TERM_WINDOW)"
        side_effects:
          - "entitlement.status = ACTIVE"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /assets/entitlements/{id}/transition {to_status: SUSPENDED}"
        actor: ComplianceOfficer
        preconditions:
          - "entitlement.status == ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "entitlement.status = SUSPENDED"
          - "SoftwareProduct.compliance_status = UNDER_REVIEW (cascade up to product)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /assets/entitlements/{id}/transition {to_status: ACTIVE}"
        actor: ComplianceOfficer
        preconditions:
          - "entitlement.status == SUSPENDED (ERR_INVALID_STATE)"
        side_effects:
          - "entitlement.status = ACTIVE"
          - "SoftwareProduct.compliance_status = COMPLIANT (re-baselined; superseded by next finalized true-up)"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /assets/entitlements/{id}/transition {to_status: EXPIRED} OR server-clock past term_end+grace at true-up finalize"
        actor: ComplianceOfficer
        preconditions:
          - "entitlement.status IN {ACTIVE, SUSPENDED} (ERR_INVALID_STATE)"
          - "server clock > term_end (inclusive end; expiry only at/after the day after term_end) (ERR_TERM_NOT_ENDED)"
        side_effects:
          - "entitlement.status = EXPIRED"
          - "every ACTIVE InstallationRecord charged to this entitlement → UNINSTALLED (cascade); each decrements consumed_units"
      - from: ACTIVE
        to: RENEWED
        trigger: "POST /assets/renewal-orders/{id}/complete (RenewalOrder target ENTITLEMENT)"
        actor: ComplianceOfficer
        preconditions:
          - "entitlement.status IN {ACTIVE, SUSPENDED} (ERR_INVALID_STATE)"
          - "RenewalOrder.status == QUOTED (ERR_INVALID_STATE)"
        side_effects:
          - "entitlement.term_end += RenewalOrder.extend_months months"
          - "entitlement.entitled_units += RenewalOrder.added_units"
          - "recompute available_units"
          - "entitlement.status = ACTIVE  (RENEWED is recorded as the audit marker; entitlement remains usable as ACTIVE)"
        note: "Renewal extends the same entitlement row in place; the RENEWED enum marks that a renewal occurred. Status lands back on ACTIVE so installs continue against it (cyclic ACTIVE→RENEWED→ACTIVE)."

  # ---------------------------------------------------------------- WarrantyLease
  - entity: WarrantyLease
    initial_state: ACTIVE
    terminal_states: [EXPIRED, CANCELLED]
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /assets/coverage/{id}/transition {to_status: EXPIRED} OR server clock > coverage_end at support-status recompute"
        actor: AssetManager
        preconditions:
          - "coverage.status == ACTIVE (ERR_INVALID_STATE)"
          - "server clock > coverage_end (ERR_COVERAGE_NOT_ENDED)"
        side_effects:
          - "coverage.status = EXPIRED"
          - "recompute HardwareAsset.support_status (cascade: coverage→asset)"
      - from: ACTIVE
        to: RENEWED
        trigger: "POST /assets/renewal-orders/{id}/complete (RenewalOrder target COVERAGE)"
        actor: ComplianceOfficer
        preconditions:
          - "coverage.status == ACTIVE (ERR_INVALID_STATE)"
          - "coverage.auto_renew == true (ERR_RENEWAL_NOT_ELIGIBLE)"
          - "RenewalOrder.status == QUOTED (ERR_INVALID_STATE)"
        side_effects:
          - "coverage.coverage_end += RenewalOrder.extend_months months"
          - "coverage.status = ACTIVE (RENEWED marks the renewal; coverage stays usable)"
          - "recompute HardwareAsset.support_status"
        note: "Cyclic ACTIVE→RENEWED→ACTIVE, parallel to entitlement renewal."
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /assets/coverage/{id}/transition {to_status: CANCELLED}"
        actor: AssetManager
        preconditions:
          - "coverage.status == ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "coverage.status = CANCELLED"
          - "recompute HardwareAsset.support_status"

  # ---------------------------------------------------------------- InstallationRecord
  - entity: InstallationRecord
    initial_state: PENDING
    terminal_states: [UNINSTALLED, REJECTED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /assets/installations/{id}/activate"
        actor: AssetManager
        preconditions:
          - "install.status == PENDING (ERR_INVALID_STATE)"
          - "LicenseEntitlement.status == ACTIVE (ERR_ENTITLEMENT_NOT_ACTIVE)  # cross-entity: Install→Entitlement"
          - "HardwareAsset.status IN {IN_STOCK, ASSIGNED, IN_REPAIR} (ERR_ASSET_NOT_AVAILABLE)"
          - "entitlement.consumed_units + required_core_units <= entitlement.entitled_units (ERR_ENTITLEMENT_EXCEEDED)"
        side_effects:
          - "install.status = ACTIVE; install.activated_at = server clock"
          - "entitlement.consumed_units += install.required_core_units; recompute available_units"
      - from: PENDING
        to: REJECTED
        trigger: "POST /assets/installations/{id}/transition {to_status: REJECTED}"
        actor: AssetManager
        preconditions:
          - "install.status == PENDING (ERR_INVALID_STATE)"
        side_effects:
          - "install.status = REJECTED"
      - from: ACTIVE
        to: UNINSTALLED
        trigger: "POST /assets/installations/{id}/transition {to_status: UNINSTALLED} OR cascade from asset DISPOSED / entitlement EXPIRED"
        actor: AssetManager
        preconditions:
          - "install.status == ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "install.status = UNINSTALLED"
          - "entitlement.consumed_units -= install.required_core_units; recompute available_units (compensating: conserves consumed_units across install↔uninstall)"

  # ---------------------------------------------------------------- AssignmentCheckout
  - entity: AssignmentCheckout
    initial_state: OPEN
    terminal_states: [RETURNED, LOST]
    transitions:
      - from: OPEN
        to: RETURNED
        trigger: "POST /assets/checkouts/{id}/return"
        actor: AssetManager
        preconditions:
          - "checkout.status == OPEN (ERR_INVALID_STATE)"
        side_effects:
          - "checkout.returned_at = server clock; checkout.status = RETURNED"
          - "Employee.open_checkout_count -= 1; HardwareAsset.status = IN_STOCK"
      - from: OPEN
        to: LOST
        trigger: "POST /assets/checkouts/{id}/transition {to_status: LOST}"
        actor: AssetManager
        preconditions:
          - "checkout.status == OPEN (ERR_INVALID_STATE)"
        side_effects:
          - "checkout.status = LOST; checkout.returned_at = server clock"
          - "Employee.open_checkout_count -= 1; HardwareAsset.status = IN_STOCK (asset returns to inventory for disposal handling)"

  # ---------------------------------------------------------------- DisposalRequest (branching, segregation of duties)
  - entity: DisposalRequest
    initial_state: SUBMITTED
    terminal_states: [REJECTED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /assets/disposal-requests/{id}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "request.status == SUBMITTED (ERR_INVALID_STATE)"
          - "X-User-ID != DisposalRequest.submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)  # approver must differ from submitter"
          - "HardwareAsset.status IN {IN_STOCK, IN_REPAIR} (ERR_ASSET_NOT_RETIREABLE)"
          - "no OPEN AssignmentCheckout on the asset (ERR_ASSET_HAS_OPEN_CHECKOUT)"
        side_effects:
          - "request.approved_by_user_id = X-User-ID"
          - "request.status = APPROVED"
          - "HardwareAsset.status = RETIRED (cascade hop 1)"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /assets/disposal-requests/{id}/reject"
        actor: ComplianceOfficer
        preconditions:
          - "request.status == SUBMITTED (ERR_INVALID_STATE)"
          - "X-User-ID != DisposalRequest.submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "request.status = REJECTED"
      - from: APPROVED
        to: COMPLETED
        trigger: "POST /assets/disposal-requests/{id}/complete"
        actor: ComplianceOfficer
        preconditions:
          - "request.status == APPROVED (ERR_INVALID_STATE)"
          - "HardwareAsset.status == RETIRED (ERR_INVALID_STATE)"
        side_effects:
          - "HardwareAsset RETIRED→DISPOSED (see HardwareAsset machine: finalize depreciation, set proceeds + gain/loss, cascade uninstall installs → entitlement ledger)"
          - "request.status = COMPLETED"
      - from: COMPLETED
        to: REVERSED
        trigger: "POST /assets/disposal-requests/{id}/reverse"
        actor: ComplianceOfficer
        preconditions:
          - "request.status == COMPLETED (ERR_INVALID_STATE)"
        side_effects:
          - "HardwareAsset DISPOSED→RETIRED (restore provisional book value, zero out proceeds/gain-loss)"
          - "request.status = REVERSED"

  # ---------------------------------------------------------------- RenewalOrder
  - entity: RenewalOrder
    initial_state: QUOTED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: QUOTED
        to: COMPLETED
        trigger: "POST /assets/renewal-orders/{id}/complete"
        actor: ComplianceOfficer
        preconditions:
          - "order.status == QUOTED (ERR_INVALID_STATE)"
          - "if target_type==ENTITLEMENT: LicenseEntitlement.status IN {ACTIVE, SUSPENDED} (ERR_INVALID_STATE)"
          - "if target_type==COVERAGE: WarrantyLease.status == ACTIVE AND auto_renew==true (ERR_RENEWAL_NOT_ELIGIBLE)"
        side_effects:
          - "compute quoted_cost_cents (renewal_cost calculation)"
          - "apply renewal to the target (entitlement term/units OR coverage end) — see target machines"
          - "order.status = COMPLETED"
      - from: QUOTED
        to: CANCELLED
        trigger: "POST /assets/renewal-orders/{id}/transition {to_status: CANCELLED}"
        actor: ComplianceOfficer
        preconditions:
          - "order.status == QUOTED (ERR_INVALID_STATE)"
        side_effects:
          - "order.status = CANCELLED"

  # ---------------------------------------------------------------- TrueUpReconciliation
  - entity: TrueUpReconciliation
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /assets/true-ups/{id}/finalize"
        actor: ComplianceOfficer
        preconditions:
          - "reconciliation.status == DRAFT (ERR_INVALID_STATE)"
        side_effects:
          - "compute total_entitled_units, total_consumed_units, position_units, verdict (true_up_position calculation, per variant)"
          - "if verdict==OVER_DEPLOYED: create ComplianceFinding{finding_type=OVER_DEPLOYED, shortfall_units=-position_units}"
          - "SoftwareProduct.compliance_status = (verdict==OVER_DEPLOYED ? OVER_DEPLOYED : COMPLIANT) (cascade: true-up→product)"
          - "reconciliation.status = FINALIZED"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version — true races only)
# =============================================================================
concurrency_rules:
  - rule_id: install-create-stale-entitlement
    parent_entity: LicenseEntitlement
    write_endpoint: "POST /assets/installations"
    occ_field: "expected_entitlement_version"
    description: |
      Creating an InstallationRecord charged to a LicenseEntitlement whose
      version has advanced since the client last observed it is rejected on a
      stale version. This captures the case where another writer has already
      consumed capacity against the same entitlement (advancing its version),
      so the current writer's view of available_units is stale and the new
      install must re-read before charging the pool.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: renewal-complete-stale-entitlement
    parent_entity: LicenseEntitlement
    write_endpoint: "POST /assets/renewal-orders/{id}/complete"
    occ_field: "expected_entitlement_version"
    description: |
      Completing a RenewalOrder against a LicenseEntitlement whose version has
      advanced since the order was quoted is rejected on a stale version. A
      prior completion (or any mutation that bumped the entitlement) means the
      term/units baseline the renewal was quoted against no longer holds, so
      the renewal must be re-quoted against the current entitlement.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  # ---- Dual-variant #1 (HardwareAsset domain): depreciation book vs disposal ----
  - name: asset_depreciation
    trigger: "read of HardwareAsset (provisional, on every GET/recompute) AND HardwareAsset RETIRED→DISPOSED (final)"
    algorithm: forward_looking
    formula: |
      months_elapsed = whole_months_between(in_service_date, as_of)   # floor to whole months, min 0
      depreciable_base = purchase_cost_cents - salvage_value_cents
      straight_line_per_month = depreciable_base / useful_life_months   # exact rational, no rounding yet
      # PROVISIONAL (book) variant:
      accumulated = round_half_up( straight_line_per_month * min(months_elapsed, useful_life_months) )
      accumulated_depreciation_cents = min(accumulated, depreciable_base)
      net_book_value_cents = purchase_cost_cents - accumulated_depreciation_cents   # >= salvage_value_cents
    input_set: "single asset; as_of = server clock for provisional, disposal instant for final"
    constants:
      ROUNDING: round_half_up
    precision: "integer cents; round_half_up applied once to accumulated, never per-month"
    variants:
      - name: book_provisional
        when: "any read/recompute before disposal; as_of = current server clock"
        difference: "months_elapsed uses floor of whole months from in_service_date to current clock; floored at useful_life_months"
      - name: disposal_final
        when: "HardwareAsset RETIRED→DISPOSED"
        difference: |
          as_of = disposal instant. months_elapsed counts a partial final month as a WHOLE month
          (ceil of the partial month, still capped at useful_life_months) — so a mid-month disposal
          books one more month than the provisional floor would, yielding a different
          accumulated_depreciation_cents and net_book_value_cents for identical inputs.

  # ---- Dual-variant #2 (SoftwareProduct/LicenseEntitlement domain): true-up position ----
  - name: true_up_position
    trigger: "TrueUpReconciliation DRAFT→FINALIZE"
    algorithm: aggregation
    formula: |
      # Entitlements in scope (per variant) for this software_product_id:
      #   LIVE  : status == ACTIVE AND term_start <= as_of <= term_end
      #   AUDIT : status IN {ACTIVE, SUSPENDED, RENEWED}
      #           AND term_start <= as_of <= (term_end + grace_days days)   # grace window included
      total_entitled_units = sum(entitled_units over in-scope entitlements)
      # Installs in scope (per variant) charged to in-scope entitlements:
      #   LIVE  : status == ACTIVE
      #   AUDIT : status IN {ACTIVE, PENDING}     # in-flight installs reserved in audit
      total_consumed_units = sum(required_core_units over in-scope installs)
      position_units = total_entitled_units - total_consumed_units
      verdict = (position_units < 0) ? OVER_DEPLOYED : COMPLIANT
    input_set: "all entitlements + installs for the product; variant decides the status/time filters above"
    constants:
      OVER_DEPLOY_BOUNDARY: 0     # position_units < 0 (strictly) is OVER_DEPLOYED; position_units == 0 is COMPLIANT
    precision: "integer units; no rounding"
    variants:
      - name: live
        when: "variant == LIVE"
        difference: "excludes PENDING installs and SUSPENDED/grace entitlements; reflects only currently-active deployment"
      - name: audit
        when: "variant == AUDIT"
        difference: "includes PENDING installs (reserved) and entitlements still inside grace_days; deliberately stricter consumed set + broader entitled set → different position_units for identical data"

  # ---- Combinatorial mode (a): per-core required-units, >=3 inputs, nested min/max/ceil + branch on model ----
  - name: required_core_units
    trigger: "InstallationRecord creation (computed at create, frozen on the record)"
    algorithm: tiered_pricing
    formula: |
      if SoftwareProduct.license_model == PER_SEAT:
        required_core_units = 1
      else:   # PER_CORE — non-linear: ceil of a product, floored by a per-install minimum
        raw = ceil( HardwareAsset.physical_cores * SoftwareProduct.core_factor )
        required_core_units = max( SoftwareProduct.min_core_units, raw )
    input_set: "one install; inputs = license_model, physical_cores, core_factor, min_core_units (>=3 interacting inputs in PER_CORE branch)"
    constants:
      CEIL: ceiling
    precision: "integer units; ceil applied to (physical_cores * core_factor) before the max floor"
    variants:
      - name: per_seat
        when: "license_model == PER_SEAT"
        difference: "always 1 regardless of cores"
      - name: per_core
        when: "license_model == PER_CORE"
        difference: "max(min_core_units, ceil(physical_cores * core_factor)); core_factor may be fractional (e.g. 0.5 for hyperthread discounting)"

  # ---- Combinatorial mode (b): renewal cost, rounding order pinned (per-line round then sum) ----
  - name: renewal_cost
    trigger: "RenewalOrder QUOTED→COMPLETE"
    algorithm: tiered_pricing
    formula: |
      if target_type == ENTITLEMENT:
        # Two line items, each rounded to cents BEFORE summing (PINNED ORDER: round-then-sum):
        renewed_seats_line  = round_half_up( entitlement.entitled_units * entitlement.unit_price_cents * (extend_months / 12) )
        added_seats_line    = round_half_up( added_units * entitlement.unit_price_cents * (extend_months / 12) )
        quoted_cost_cents   = renewed_seats_line + added_seats_line
      else:   # COVERAGE
        quoted_cost_cents   = round_half_up( coverage.monthly_cost_cents * extend_months )
    input_set: "single renewal order + its target entitlement or coverage"
    constants:
      MONTHS_PER_YEAR: 12
      ROUNDING: round_half_up
    precision: |
      integer cents. ROUNDING ORDER IS PINNED: round EACH line item to whole cents, THEN sum.
      'sum the two raw products then round once' is the wrong order and can differ by 1 cent.

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and one of {AssetManager, ComplianceOfficer, Employee}; X-User-ID present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Acting role is permitted for the operation per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "All path ids and FK body ids resolve to existing entities (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, enum values legal, numeric constraints (>=0) hold; PER_CORE renewal/install fields consistent with model"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all mutating endpoints"

  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is legal"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition / action endpoints"

  - priority: 6
    category: state
    check: "OCC: expected_<parent>_version equals the parent entity's current version on supersede-style creates/completes"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /assets/installations, POST /assets/renewal-orders/{id}/complete"

  # ---- Business rules, domain-ordered: safety/compliance → referential → temporal → fiscal ----
  - priority: 7
    category: business_safety
    check: "Segregation of duties: DisposalRequest approver/rejector X-User-ID must differ from submitted_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /assets/disposal-requests/{id}/approve, /reject"

  - priority: 8
    category: business_safety
    check: "An asset with an OPEN AssignmentCheckout cannot be approved for retirement"
    error_id: ERR_ASSET_HAS_OPEN_CHECKOUT
    http_status: 409
    applies_to: "POST /assets/disposal-requests/{id}/approve"

  - priority: 9
    category: business_referential
    check: "Checkout target Employee.status must be ACTIVE"
    error_id: ERR_EMPLOYEE_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /assets/hardware/{id}/checkout"

  - priority: 10
    category: business_referential
    check: "Install activation requires its LicenseEntitlement.status == ACTIVE and HardwareAsset not RETIRED/DISPOSED"
    error_id: ERR_ENTITLEMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /assets/installations/{id}/activate"

  - priority: 11
    category: business_referential
    check: "Asset proposed for disposal must be RETIREABLE (status IN {IN_STOCK, IN_REPAIR})"
    error_id: ERR_ASSET_NOT_RETIREABLE
    http_status: 409
    applies_to: "POST /assets/disposal-requests/{id}/approve"

  - priority: 12
    category: business_temporal
    check: "New OPEN checkout interval [checkout_at, expected_return_at) must not overlap any existing OPEN checkout on the same asset (half-open intervals)"
    error_id: ERR_CHECKOUT_OVERLAP
    http_status: 409
    applies_to: "POST /assets/hardware/{id}/checkout"

  - priority: 13
    category: business_temporal
    check: "New WarrantyLease coverage window [coverage_start, coverage_end] must not overlap any ACTIVE/RENEWED coverage on the same asset (closed intervals; zero-gap adjacency allowed)"
    error_id: ERR_COVERAGE_OVERLAP
    http_status: 409
    applies_to: "POST /assets/coverage"

  - priority: 14
    category: business_temporal
    check: "Coverage/entitlement cannot be force-expired before the server clock passes its end (coverage_end / term_end)"
    error_id: ERR_COVERAGE_NOT_ENDED
    http_status: 409
    applies_to: "POST /assets/coverage/{id}/transition, POST /assets/entitlements/{id}/transition"

  - priority: 15
    category: business_constraint
    check: "asset_tag unique among non-DISPOSED HardwareAssets; Employee.email unique among non-OFFBOARDED employees"
    error_id: ERR_DUPLICATE_KEY
    http_status: 409
    applies_to: "POST /assets/hardware, POST /assets/employees"

  - priority: 16
    category: business_constraint
    check: "Employee.open_checkout_count < max_assigned_assets before a new checkout"
    error_id: ERR_ASSIGNMENT_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /assets/hardware/{id}/checkout"

  - priority: 17
    category: business_fiscal
    check: "Install activation: entitlement.consumed_units + required_core_units must not exceed entitled_units"
    error_id: ERR_ENTITLEMENT_EXCEEDED
    http_status: 409
    applies_to: "POST /assets/installations/{id}/activate"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---------------- Test-driving: server clock ----------------
  - method: POST
    path: "/assets/_clock/set_current_utc"
    description: "Set the server wall clock used by all time-dependent rules"
    roles: [AssetManager, ComplianceOfficer]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["server clock set; recomputes are evaluated against it on subsequent reads/transitions"]

  # ---------------- Vendor ----------------
  - method: POST
    path: "/assets/vendors"
    description: "Create a Vendor"
    roles: [AssetManager]
    code: 201
    input: [name, vendor_type, support_email, "active?"]
    output: Vendor
    side_effects: []
  - method: GET
    path: "/assets/vendors/{id}"
    description: "Get a Vendor"
    roles: [AssetManager, ComplianceOfficer]
    code: 200
    input: []
    output: Vendor
    side_effects: []

  # ---------------- Employee ----------------
  - method: POST
    path: "/assets/employees"
    description: "Create an Employee"
    roles: [AssetManager]
    code: 201
    input: [full_name, email, department, "max_assigned_assets?"]
    output: Employee
    side_effects: ["status=ACTIVE; open_checkout_count=0"]
  - method: GET
    path: "/assets/employees/{id}"
    description: "Get an Employee (with computed open_checkout_count)"
    roles: [AssetManager, ComplianceOfficer, Employee]
    code: 200
    input: []
    output: Employee
    side_effects: []
  - method: POST
    path: "/assets/employees/{id}/transition"
    description: "Transition Employee status (ACTIVE/SUSPENDED/OFFBOARDED)"
    roles: [AssetManager]
    code: 200
    input: [to_status]
    output: Employee
    side_effects: ["status set per request"]

  # ---------------- SoftwareProduct ----------------
  - method: POST
    path: "/assets/software-products"
    description: "Create a SoftwareProduct"
    roles: [AssetManager]
    code: 201
    input: [vendor_id, name, license_model, "core_factor?", "min_core_units?"]
    output: SoftwareProduct
    side_effects: ["compliance_status=COMPLIANT"]
  - method: GET
    path: "/assets/software-products/{id}"
    description: "Get a SoftwareProduct"
    roles: [AssetManager, ComplianceOfficer]
    code: 200
    input: []
    output: SoftwareProduct
    side_effects: []
  - method: GET
    path: "/assets/software-products"
    description: "List software products; filter by vendor_id (reverse-reachability for SoftwareProduct.vendor_id FK)"
    roles: [AssetManager, ComplianceOfficer]
    code: 200
    input: ["vendor_id?", "license_model?", "limit?", "offset?"]
    output: SoftwareProduct[]
    side_effects: []

  # ---------------- LicenseEntitlement ----------------
  - method: POST
    path: "/assets/entitlements"
    description: "Create a LicenseEntitlement (DRAFT)"
    roles: [AssetManager]
    code: 201
    input: [software_product_id, vendor_id, entitled_units, unit_price_cents, term_start, term_end, "grace_days?"]
    output: LicenseEntitlement
    side_effects: ["status=DRAFT; consumed_units=0; available_units=entitled_units"]
  - method: GET
    path: "/assets/entitlements/{id}"
    description: "Get a LicenseEntitlement (with computed consumed/available units)"
    roles: [AssetManager, ComplianceOfficer]
    code: 200
    input: []
    output: LicenseEntitlement
    side_effects: []
  - method: GET
    path: "/assets/entitlements"
    description: "List entitlements; filter by software_product_id and/or vendor_id"
    roles: [AssetManager, ComplianceOfficer]
    code: 200
    input: ["software_product_id?", "vendor_id?", "status?", "limit?", "offset?"]
    output: LicenseEntitlement[]
    side_effects: []
  - method: POST
    path: "/assets/entitlements/{id}/activate"
    description: "Activate a DRAFT entitlement"
    roles: [AssetManager]
    code: 200
    input: []
    output: LicenseEntitlement
    side_effects: ["status DRAFT→ACTIVE"]
  - method: POST
    path: "/assets/entitlements/{id}/transition"
    description: "Transition entitlement (SUSPENDED/ACTIVE/EXPIRED)"
    roles: [ComplianceOfficer]
    code: 200
    input: [to_status]
    output: LicenseEntitlement
    side_effects: ["per LicenseEntitlement state machine, incl. EXPIRED cascade uninstalling charged installs and product compliance cascade"]

  # ---------------- HardwareAsset ----------------
  - method: POST
    path: "/assets/hardware"
    description: "Create a HardwareAsset (IN_STOCK)"
    roles: [AssetManager]
    code: 201
    input: [vendor_id, asset_tag, category, "physical_cores?", purchase_cost_cents, in_service_date, "useful_life_months?", "salvage_value_cents?"]
    output: HardwareAsset
    side_effects: ["status=IN_STOCK; support_status=UNCOVERED; depreciation computed against clock"]
  - method: GET
    path: "/assets/hardware/{id}"
    description: "Get a HardwareAsset (with provisional depreciation + support_status against current clock)"
    roles: [AssetManager, ComplianceOfficer, Employee]
    code: 200
    input: []
    output: HardwareAsset
    side_effects: ["recompute provisional accumulated_depreciation_cents / net_book_value_cents / support_status"]
  - method: GET
    path: "/assets/hardware"
    description: "List hardware; filter by vendor_id, status, category"
    roles: [AssetManager, ComplianceOfficer]
    code: 200
    input: ["vendor_id?", "status?", "category?", "limit?", "offset?"]
    output: HardwareAsset[]
    side_effects: []
  - method: POST
    path: "/assets/hardware/{id}/transition"
    description: "Transition asset between IN_STOCK and IN_REPAIR"
    roles: [AssetManager]
    code: 200
    input: [to_status]
    output: HardwareAsset
    side_effects: ["status set per HardwareAsset machine (IN_STOCK↔IN_REPAIR only)"]
  - method: POST
    path: "/assets/hardware/{id}/checkout"
    description: "Check out an IN_STOCK asset to an employee (creates AssignmentCheckout)"
    roles: [AssetManager]
    code: 201
    input: [employee_id, checkout_at, expected_return_at]
    output: AssignmentCheckout
    side_effects: ["create AssignmentCheckout{OPEN}; Employee.open_checkout_count+=1; asset.status=ASSIGNED"]

  # ---------------- AssignmentCheckout ----------------
  - method: GET
    path: "/assets/checkouts/{id}"
    description: "Get an AssignmentCheckout"
    roles: [AssetManager, ComplianceOfficer, Employee]
    code: 200
    input: []
    output: AssignmentCheckout
    side_effects: []
  - method: GET
    path: "/assets/checkouts"
    description: "List checkouts; filter by hardware_asset_id and/or employee_id and/or status"
    roles: [AssetManager, ComplianceOfficer, Employee]
    code: 200
    input: ["hardware_asset_id?", "employee_id?", "status?", "limit?", "offset?"]
    output: AssignmentCheckout[]
    side_effects: []
  - method: POST
    path: "/assets/checkouts/{id}/return"
    description: "Return an OPEN checkout"
    roles: [AssetManager]
    code: 200
    input: []
    output: AssignmentCheckout
    side_effects: ["checkout RETURNED; Employee.open_checkout_count-=1; asset IN_STOCK"]
  - method: POST
    path: "/assets/checkouts/{id}/transition"
    description: "Transition checkout (LOST)"
    roles: [AssetManager]
    code: 200
    input: [to_status]
    output: AssignmentCheckout
    side_effects: ["checkout LOST; Employee.open_checkout_count-=1; asset IN_STOCK"]

  # ---------------- WarrantyLease (coverage) ----------------
  - method: POST
    path: "/assets/coverage"
    description: "Create a WarrantyLease coverage record on an asset"
    roles: [AssetManager]
    code: 201
    input: [hardware_asset_id, vendor_id, coverage_type, coverage_start, coverage_end, "monthly_cost_cents?", "auto_renew?"]
    output: WarrantyLease
    side_effects: ["status=ACTIVE; recompute HardwareAsset.support_status"]
  - method: GET
    path: "/assets/coverage/{id}"
    description: "Get a WarrantyLease"
    roles: [AssetManager, ComplianceOfficer]
    code: 200
    input: []
    output: WarrantyLease
    side_effects: []
  - method: GET
    path: "/assets/coverage"
    description: "List coverage; filter by hardware_asset_id and/or vendor_id and/or status"
    roles: [AssetManager, ComplianceOfficer]
    code: 200
    input: ["hardware_asset_id?", "vendor_id?", "status?", "limit?", "offset?"]
    output: WarrantyLease[]
    side_effects: []
  - method: POST
    path: "/assets/coverage/{id}/transition"
    description: "Transition coverage (EXPIRED/CANCELLED)"
    roles: [AssetManager]
    code: 200
    input: [to_status]
    output: WarrantyLease
    side_effects: ["per WarrantyLease machine; recompute HardwareAsset.support_status"]

  # ---------------- InstallationRecord ----------------
  - method: POST
    path: "/assets/installations"
    description: "Create an InstallationRecord (PENDING) charged to an entitlement; OCC on entitlement version"
    roles: [AssetManager]
    code: 201
    input: [software_product_id, hardware_asset_id, license_entitlement_id, expected_entitlement_version]
    output: InstallationRecord
    side_effects: ["status=PENDING; required_core_units computed (per-seat/per-core); increments LicenseEntitlement.version by 1"]
  - method: GET
    path: "/assets/installations/{id}"
    description: "Get an InstallationRecord"
    roles: [AssetManager, ComplianceOfficer]
    code: 200
    input: []
    output: InstallationRecord
    side_effects: []
  - method: GET
    path: "/assets/installations"
    description: "List installations; filter by software_product_id, hardware_asset_id, license_entitlement_id, status"
    roles: [AssetManager, ComplianceOfficer]
    code: 200
    input: ["software_product_id?", "hardware_asset_id?", "license_entitlement_id?", "status?", "limit?", "offset?"]
    output: InstallationRecord[]
    side_effects: []
  - method: POST
    path: "/assets/installations/{id}/activate"
    description: "Activate a PENDING install (charges entitlement capacity)"
    roles: [AssetManager]
    code: 200
    input: []
    output: InstallationRecord
    side_effects: ["status PENDING→ACTIVE; entitlement.consumed_units += required_core_units; recompute available_units"]
  - method: POST
    path: "/assets/installations/{id}/transition"
    description: "Transition install (REJECTED from PENDING, UNINSTALLED from ACTIVE)"
    roles: [AssetManager]
    code: 200
    input: [to_status]
    output: InstallationRecord
    side_effects: ["per InstallationRecord machine; UNINSTALLED decrements entitlement.consumed_units"]

  # ---------------- DisposalRequest (segregation of duties) ----------------
  - method: POST
    path: "/assets/disposal-requests"
    description: "Submit a DisposalRequest for a retireable asset"
    roles: [AssetManager]
    code: 201
    input: [hardware_asset_id, reason, "proposed_proceeds_cents?"]
    output: DisposalRequest
    side_effects: ["status=SUBMITTED; submitted_by_user_id = X-User-ID"]
  - method: GET
    path: "/assets/disposal-requests/{id}"
    description: "Get a DisposalRequest"
    roles: [AssetManager, ComplianceOfficer]
    code: 200
    input: []
    output: DisposalRequest
    side_effects: []
  - method: GET
    path: "/assets/disposal-requests"
    description: "List disposal requests; filter by hardware_asset_id and/or status"
    roles: [AssetManager, ComplianceOfficer]
    code: 200
    input: ["hardware_asset_id?", "status?", "limit?", "offset?"]
    output: DisposalRequest[]
    side_effects: []
  - method: POST
    path: "/assets/disposal-requests/{id}/approve"
    description: "Approve a SUBMITTED disposal (approver must differ from submitter); retires the asset"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: DisposalRequest
    side_effects: ["status SUBMITTED→APPROVED; approved_by_user_id=X-User-ID; HardwareAsset → RETIRED (cascade hop 1)"]
  - method: POST
    path: "/assets/disposal-requests/{id}/reject"
    description: "Reject a SUBMITTED disposal (rejector must differ from submitter)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: DisposalRequest
    side_effects: ["status SUBMITTED→REJECTED"]
  - method: POST
    path: "/assets/disposal-requests/{id}/complete"
    description: "Complete an APPROVED disposal; disposes asset, finalizes depreciation, cascades uninstalls"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: DisposalRequest
    side_effects: ["status APPROVED→COMPLETED; HardwareAsset RETIRED→DISPOSED (final depreciation, proceeds, gain/loss, cascade uninstall installs → entitlement ledger)"]
  - method: POST
    path: "/assets/disposal-requests/{id}/reverse"
    description: "Reverse a COMPLETED disposal (compensating action); restores book value, un-disposes asset"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: DisposalRequest
    side_effects: ["status COMPLETED→REVERSED; HardwareAsset DISPOSED→RETIRED; zero proceeds/gain-loss; restore provisional book value"]

  # ---------------- RenewalOrder ----------------
  - method: POST
    path: "/assets/renewal-orders"
    description: "Create a RenewalOrder (QUOTED) targeting an entitlement or a coverage"
    roles: [ComplianceOfficer]
    code: 201
    input: [target_type, "license_entitlement_id?", "warranty_lease_id?", extend_months, "added_units?"]
    output: RenewalOrder
    side_effects: ["status=QUOTED"]
  - method: GET
    path: "/assets/renewal-orders/{id}"
    description: "Get a RenewalOrder"
    roles: [AssetManager, ComplianceOfficer]
    code: 200
    input: []
    output: RenewalOrder
    side_effects: []
  - method: GET
    path: "/assets/renewal-orders"
    description: "List renewal orders; filter by license_entitlement_id and/or warranty_lease_id and/or status"
    roles: [AssetManager, ComplianceOfficer]
    code: 200
    input: ["license_entitlement_id?", "warranty_lease_id?", "status?", "limit?", "offset?"]
    output: RenewalOrder[]
    side_effects: []
  - method: POST
    path: "/assets/renewal-orders/{id}/complete"
    description: "Complete a QUOTED renewal; applies term/units/coverage extension; OCC on entitlement version for ENTITLEMENT target"
    roles: [ComplianceOfficer]
    code: 200
    input: ["expected_entitlement_version?"]
    output: RenewalOrder
    side_effects: ["compute quoted_cost_cents; apply to target; status QUOTED→COMPLETED; entitlement target: increments LicenseEntitlement.version by 1"]
  - method: POST
    path: "/assets/renewal-orders/{id}/transition"
    description: "Transition renewal order (CANCELLED)"
    roles: [ComplianceOfficer]
    code: 200
    input: [to_status]
    output: RenewalOrder
    side_effects: ["status QUOTED→CANCELLED"]

  # ---------------- TrueUpReconciliation + ComplianceFinding ----------------
  - method: POST
    path: "/assets/true-ups"
    description: "Create a TrueUpReconciliation (DRAFT) for a product + variant"
    roles: [ComplianceOfficer]
    code: 201
    input: [software_product_id, variant, "as_of?"]
    output: TrueUpReconciliation
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/assets/true-ups/{id}"
    description: "Get a TrueUpReconciliation"
    roles: [AssetManager, ComplianceOfficer]
    code: 200
    input: []
    output: TrueUpReconciliation
    side_effects: []
  - method: GET
    path: "/assets/true-ups"
    description: "List true-ups; filter by software_product_id and/or status"
    roles: [AssetManager, ComplianceOfficer]
    code: 200
    input: ["software_product_id?", "status?", "limit?", "offset?"]
    output: TrueUpReconciliation[]
    side_effects: []
  - method: POST
    path: "/assets/true-ups/{id}/finalize"
    description: "Finalize a DRAFT true-up; computes position + verdict, may emit a ComplianceFinding, cascades product compliance_status"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: TrueUpReconciliation
    side_effects: ["compute totals/position/verdict; if OVER_DEPLOYED create ComplianceFinding; SoftwareProduct.compliance_status cascade; status DRAFT→FINALIZED"]
  - method: GET
    path: "/assets/true-ups/{id}/findings"
    description: "List ComplianceFindings produced by a finalized true-up (reverse-reachability for true_up_reconciliation_id FK)"
    roles: [AssetManager, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: ComplianceFinding[]
    side_effects: []
  - method: GET
    path: "/assets/findings/{id}"
    description: "Get a single ComplianceFinding"
    roles: [AssetManager, ComplianceOfficer]
    code: 200
    input: []
    output: ComplianceFinding
    side_effects: []
  - method: GET
    path: "/assets/findings"
    description: "List ComplianceFindings; filter by software_product_id (reverse-reachability for software_product_id FK)"
    roles: [AssetManager, ComplianceOfficer]
    code: 200
    input: ["software_product_id?", "true_up_reconciliation_id?", "limit?", "offset?"]
    output: ComplianceFinding[]
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Acting role not permitted for this operation per RBAC" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or FK body id does not resolve to an existing entity" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Malformed body: missing required field, illegal enum, negative where >=0 required, model/field mismatch" }
  - { id: ERR_INVALID_TERM_WINDOW, http: 422, condition: "Entitlement term_start > term_end (or coverage_start > coverage_end)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state from which the requested transition is legal" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC: expected_<parent>_version does not equal the parent's current version" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Disposal approver/rejector X-User-ID equals the submitter's user id" }
  - { id: ERR_ASSET_NOT_AVAILABLE, http: 409, condition: "Asset not IN_STOCK for checkout, or RETIRED/DISPOSED when an install activation requires it available" }
  - { id: ERR_ASSET_NOT_RETIREABLE, http: 409, condition: "Asset status not in {IN_STOCK, IN_REPAIR} when disposal approval attempts retirement" }
  - { id: ERR_ASSET_HAS_OPEN_CHECKOUT, http: 409, condition: "Asset has an OPEN AssignmentCheckout and cannot be retired" }
  - { id: ERR_EMPLOYEE_NOT_ACTIVE, http: 409, condition: "Checkout target Employee.status is not ACTIVE" }
  - { id: ERR_ASSIGNMENT_LIMIT_REACHED, http: 409, condition: "Employee.open_checkout_count would exceed max_assigned_assets" }
  - { id: ERR_CHECKOUT_OVERLAP, http: 409, condition: "New OPEN checkout interval overlaps an existing OPEN checkout on the same asset (half-open)" }
  - { id: ERR_COVERAGE_OVERLAP, http: 409, condition: "New coverage window overlaps an ACTIVE/RENEWED coverage on the same asset (closed intervals)" }
  - { id: ERR_COVERAGE_NOT_ENDED, http: 409, condition: "Force-expire attempted before server clock passes coverage_end / term_end" }
  - { id: ERR_TERM_NOT_ENDED, http: 409, condition: "Entitlement force-expire attempted before server clock passes term_end" }
  - { id: ERR_ENTITLEMENT_NOT_ACTIVE, http: 409, condition: "Install activation requires its LicenseEntitlement.status == ACTIVE" }
  - { id: ERR_ENTITLEMENT_EXCEEDED, http: 409, condition: "consumed_units + required_core_units would exceed entitled_units on activation" }
  - { id: ERR_RENEWAL_NOT_ELIGIBLE, http: 409, condition: "Coverage renewal on a coverage with auto_renew=false or not ACTIVE" }
  - { id: ERR_DUPLICATE_KEY, http: 409, condition: "asset_tag duplicate among non-DISPOSED assets, or Employee.email duplicate among non-OFFBOARDED" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: AssetManager
    description: "Owns inventory lifecycle: vendors, employees, software products, entitlements (create/activate), hardware, coverage, checkouts, installs, and disposal submission. Submits disposal requests but cannot approve them (segregation of duties)."
    identity: "opaque"
    exclusive_operations:
      - "POST /assets/vendors — create vendor"
      - "POST /assets/employees — create employee"
      - "POST /assets/employees/{id}/transition — change employee status"
      - "POST /assets/software-products — create software product"
      - "POST /assets/entitlements — create entitlement"
      - "POST /assets/entitlements/{id}/activate — activate entitlement"
      - "POST /assets/hardware — create hardware asset"
      - "POST /assets/hardware/{id}/transition — IN_STOCK↔IN_REPAIR"
      - "POST /assets/hardware/{id}/checkout — check out asset"
      - "POST /assets/checkouts/{id}/return — return checkout"
      - "POST /assets/checkouts/{id}/transition — mark checkout LOST"
      - "POST /assets/coverage — create coverage"
      - "POST /assets/coverage/{id}/transition — expire/cancel coverage"
      - "POST /assets/installations — create install"
      - "POST /assets/installations/{id}/activate — activate install"
      - "POST /assets/installations/{id}/transition — reject/uninstall install"
      - "POST /assets/disposal-requests — submit disposal request"
    shared_operations:
      - "POST /assets/_clock/set_current_utc — set server clock"
      - "GET on vendors, employees, software-products, entitlements (and list), hardware (and list), coverage (and list), checkouts (and list), installations (and list), disposal-requests (and list), renewal-orders (and list), true-ups (and list), findings"

  - name: ComplianceOfficer
    description: "Owns compliance and approval surface: entitlement state changes (suspend/resume/expire), renewals, true-up reconciliation + finalize, and the approve/reject/complete/reverse of disposal requests. Cannot create inventory or submit disposals — enforcing that the approver is a different actor than the submitter."
    identity: "opaque"
    exclusive_operations:
      - "POST /assets/entitlements/{id}/transition — suspend/resume/expire entitlement"
      - "POST /assets/renewal-orders — create renewal order"
      - "POST /assets/renewal-orders/{id}/complete — complete renewal"
      - "POST /assets/renewal-orders/{id}/transition — cancel renewal"
      - "POST /assets/true-ups — create true-up"
      - "POST /assets/true-ups/{id}/finalize — finalize true-up"
      - "POST /assets/disposal-requests/{id}/approve — approve disposal"
      - "POST /assets/disposal-requests/{id}/reject — reject disposal"
      - "POST /assets/disposal-requests/{id}/complete — complete disposal"
      - "POST /assets/disposal-requests/{id}/reverse — reverse disposal"
    shared_operations:
      - "POST /assets/_clock/set_current_utc — set server clock"
      - "GET on vendors, employees, software-products, entitlements (and list), hardware (and list), coverage (and list), checkouts (and list), installations (and list), disposal-requests (and list), renewal-orders (and list), true-ups (and list), findings"

  - name: Employee
    description: "Read-only self-service identity. Can read employee records, hardware they may hold, and their own checkouts; cannot mutate anything."
    identity: "entity_backed:Employee"
    exclusive_operations: []
    shared_operations:
      - "GET /assets/employees/{id} — read employee"
      - "GET /assets/hardware/{id} — read a hardware asset"
      - "GET /assets/checkouts/{id} — read a checkout"
      - "GET /assets/checkouts — list checkouts (own employee_id)"
