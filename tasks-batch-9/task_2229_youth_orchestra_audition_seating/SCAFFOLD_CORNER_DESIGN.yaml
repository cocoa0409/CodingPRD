            - "trigger[23] -> 200 with data.aid_status == \"APPROVED\", data.aid_awarded_cents == 30000 and data.balance_cents == 93223 (123223 - 30000; granted exactly once)"

      - name: acceptance_cascade_touches_every_descendant_and_ancestor_once
        claim_type: cascading_side_effects
        grounds:
          - concurrency_rules
          - state_machines.Placement.transitions
          - state_machines.Season.transitions
        excluded_because:
          difficulty_instance: placement_accept_seats_to_season_cascade
          rationale: "The §1.8 instance already walks the full four-hop acceptance cascade hop by hop (SeatAssignment creation, SectionQuota fill, Ensemble roster_state, Season status) plus the Member and TuitionAccount side effects, and asserts each hop's counters exactly once; a breadth copy would add no new falsifier."

      - name: two_variants_of_one_formula_diverge_on_the_same_inputs
        claim_type: dual_variant_calculation
        grounds:
          - calculations.audition_composite
          - calculations.tuition_assessment
        excluded_because:
          difficulty_instance: audition_composite_provisional_vs_final_diverge
          rationale: "The §1.8 instance pins PROVISIONAL against FINAL on one identical sheet set (trimmed high/low vs plain mean) and its sibling tuition_preliminary_vs_final_assessment_diverge does the same for PRELIMINARY vs FINAL tuition, so both dual-variant surfaces are already covered at depth."

  # =========================================================================
  # Table 9 (Consistency model). §1.0 declares consistency_model: immediate.
  - section: consistency_model
    instances:
      - name: every_cascade_effect_is_visible_to_the_next_read_with_no_settling_step
        claim_type: immediate
        grounds:
          - consistency_model
          - state_machines.Placement.transitions
          - calculations.tuition_assessment
          - calculations.chair_ranking
        distinguishing_aspect: |
          The declared consistency model is immediate, so the single acceptance call and the
          eight reads that follow it need no sweep, no re-poll and no second mutation: the
          seat, the section fill, the roster state, the season counter, the member's
          enrollment dimension and the freshly minted tuition account are all already
          correct on the very next request. The falsifier is any value that only becomes
          right after an extra call - a null attendance-independent field, a stale
          filled_count, or an account that appears one read later.
        test_recipe:
          setup:
            - "Season 2026-27 in PLACEMENT with tuition_base_cents 123223; the Philharmonic"
            - "VIOLIN section is min 1 / target 1 / max 2 with principal_required true and"
            - "filled_count 0; Ada Strings holds an OFFERED placement and is still a PROSPECT"
            - "with no seat and no TuitionAccount. The clock reads 2026-08-05T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:00:00Z" }
              as: ArtisticDirector
            - call: "POST /seasons"
              payload: { name: "2026-2027 Season", year_label: "2026-27", audition_window_start: "2026-08-10T09:00:00Z", audition_window_end: "2026-08-20T18:00:00Z", tuition_base_cents: 123223, tuition_due_at: "2026-12-01T00:00:00Z", aid_budget_cents: 100000 }
              as: ArtisticDirector
              captures: { season_id: "$.data.id" }
            - call: "POST /ensembles"
              payload: { season_id: "${season_id}", name: "Philharmonic", tier: "PHILHARMONIC", min_total_size: 1, max_total_size: 4, rehearsal_weekday: "SAT" }
              as: ArtisticDirector
              captures: { ens_id: "$.data.id" }
            - call: "POST /section-quotas"
              payload: { ensemble_id: "${ens_id}", instrument: "VIOLIN", min_count: 1, target_count: 1, max_count: 2 }
              as: ArtisticDirector
              captures: { q_violin_id: "$.data.id" }
            - call: "POST /members"
              payload: { legal_name: "Ada Strings", primary_instrument: "VIOLIN", grade_level: 10, graduation_year: 2028, household_income_band: "BAND_B", years_in_org: 1, sibling_enrolled: false, alumni_engagement_opt_in: false }
              as: RegistrarStaff
              captures: { m1_id: "$.data.id" }
            - call: "POST /panelists"
              payload: { display_name: "Panel Violin 1", instrument_expertise: "VIOLIN" }
              as: ArtisticDirector
              captures: { p_violin_1: "$.data.id" }
            - call: "POST /panelists"
              payload: { display_name: "Panel Violin 2", instrument_expertise: "VIOLIN" }
              as: ArtisticDirector
              captures: { p_violin_2: "$.data.id" }
            - call: "POST /panelists"
              payload: { display_name: "Panel Violin 3", instrument_expertise: "VIOLIN" }
              as: ArtisticDirector
              captures: { p_violin_3: "$.data.id" }
            - call: "POST /seasons/${season_id}/advance-status"
              payload: { to_status: "AUDITIONS_OPEN" }
              as: ArtisticDirector
            - call: "POST /audition-slots"
              payload: { season_id: "${season_id}", room_code: "R1", start_at: "2026-08-12T10:00:00Z", end_at: "2026-08-12T11:00:00Z", panelist_ids: ["${p_violin_1}", "${p_violin_2}", "${p_violin_3}"], instrument_focus: "VIOLIN", quorum_required: 3, capacity: 8 }
