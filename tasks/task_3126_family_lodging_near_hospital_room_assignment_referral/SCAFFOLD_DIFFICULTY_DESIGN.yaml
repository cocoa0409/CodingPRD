            - call: "POST /api/stay-requests"
              payload: { family_id: "${fam_id}", house_id: "${house_id}", referral_id: "${ref_id}", expected_nights: 15, self_reported_acuity: "MODERATE", expected_family_version: "${fam_v}" }
