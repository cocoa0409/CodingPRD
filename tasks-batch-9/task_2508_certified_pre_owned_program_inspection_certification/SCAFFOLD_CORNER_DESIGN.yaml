              payload: { vehicle_id: "${v1}", inspection_id: "${i1}", expected_vehicle_version: "${ver2}", documents: [{ doc_type: "TITLE_HISTORY_REPORT", reference: "THR-2" }, { doc_type: "INSPECTION_WORKSHEET", reference: "IW-2" }, { doc_type: "CUSTOMER_DISCLOSURE", reference: "CD-2" }] }
              as: DealerPrincipal
