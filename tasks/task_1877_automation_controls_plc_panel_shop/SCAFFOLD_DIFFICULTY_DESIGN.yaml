      - name: sccr_weakest_link_conditional_raise_mode_a
        grounds:
          - calculations.sccr_panel_rating
          - entities.Panel.fields.sccr_rating_ka
        distinguishing_aspect: |
          Mode (a): non-linear interaction of >= 3 inputs (per-line class filter,
          nested min, conditional raise keyed on the presence of a current-limiting
          BRANCH_PROTECTIVE with sccr_ka >= 100). A chain {BPD 10, CONTACTOR 5,
          OVERLOAD 5, POWER_SUPPLY 10} rates 5 kA; swapping only the BPD to a 100 kA
          current-limiting device raises the CONTACTOR/OVERLOAD floor to 25 and the
          panel rating becomes min(100, 25, 25, 10) == 10 kA — the conditional
          branch flips the min-chain membership rather than applying a uniform factor.
        test_recipe:
          setup:
            - "Panel with BOM {BPD-10kA, CONTACTOR-5kA, OVERLOAD-5kA, PS-10kA} rating 5 kA"
            - "Catalog also holds BPD-100kA current-limiting device"
