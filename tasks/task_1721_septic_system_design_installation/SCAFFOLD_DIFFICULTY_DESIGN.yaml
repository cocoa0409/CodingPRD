  - rule_id: cross_entity_state_dependency
    instances:
      - name: design_submit_depends_on_science_record_states
        grounds:
          - state_machines.SystemDesign.DRAFT_to_SUBMITTED
          - state_machines.SoilEvaluation.RECORDED_to_SUPERSEDED
          - validations[priority=8]
        distinguishing_aspect: |
          Entity pair: SystemDesign -> SoilEvaluation/PercolationTest.
          SystemDesign's DRAFT -> SUBMITTED transition is legal only while
          BOTH pinned science records are in RECORDED state; superseding the
          perc test (not the evaluation) flips the pair's submit legality to
          ERR_STALE_SCIENCE.
        test_recipe:
          setup:
            - "Company/county WH; designer D1, manager M1, scientist SS1"
            - "Site S; E1/PT1 recorded; design D pins E1/PT1 (DRAFT)"
            - "PT1 superseded by recording PT2 (the evaluation stays RECORDED — only ONE leg of the pair goes stale)"
          setup_api_calls:
            - call: "POST /septic-ops/installer-companies"
              payload: { legal_name: "Clearwater Onsite LLC", license_number: "CW-100", county_codes: ["WH"] }
              as: PlatformAdmin
