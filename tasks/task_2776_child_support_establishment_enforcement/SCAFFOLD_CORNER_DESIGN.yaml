              as: FinanceOfficer
              captures: { e_partial: "$.data.error_id" }
            - call: "POST /child-support/charges/${ch1}/voidance"
              payload: {}
              as: FinanceOfficer
              captures: { v_status: "$.data.status" }
            - call: "GET /child-support/cases/${case_id}"
              as: FinanceOfficer
              captures: { after_tc: "$.data.total_charged_principal_cents", after_ap: "$.data.arrears_principal_cents", after_int: "$.data.interest_receivable_cents", after_col: "$.data.total_collected_principal_cents" }
            - call: "GET /child-support/charges/${ch2}"
