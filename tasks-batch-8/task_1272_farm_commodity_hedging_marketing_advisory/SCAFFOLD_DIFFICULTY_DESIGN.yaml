# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Farm Commodity Hedging & Marketing Advisory
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7; 2+ instances per §0.5 rule.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------- Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: expected_bushels_aph_vs_trend_diverge
        grounds:
          - calculations.expected_bushels
          - entities.ProductionBaseline.fields.expected_bushels
          - entities.GrowerOperation.fields.yield_method
        distinguishing_aspect: |
          Entity domain = ProductionBaseline (production sizing). Two operations with
          identical acres/yields but different yield_method produce different operative
          expected_bushels: APH selects 20000, TREND selects 20500 — the variant choice,
          not the inputs, drives the number.
        test_recipe:
          setup:
            - "Operation A (yield_method APH) and operation B (yield_method TREND), both CORN 2026 BALANCED, each with a baseline of planted_acres=100, aph_yield_bushels=200, trend_yield_bushels=205"
          setup_api_calls:
            - { call: "POST /advisory/operations", payload: { name: "Farm A", primary_commodity: CORN, crop_year: 2026, risk_profile: BALANCED, yield_method: APH }, as: CommodityAdvisor, captures: { op_a: $.data.id, op_a_v: $.data.version } }
            - { call: "POST /advisory/operations", payload: { name: "Farm B", primary_commodity: CORN, crop_year: 2026, risk_profile: BALANCED, yield_method: TREND }, as: CommodityAdvisor, captures: { op_b: $.data.id, op_b_v: $.data.version } }
            - { call: "POST /advisory/production-baselines", payload: { operation_id: "${op_a}", planted_acres: 100, aph_yield_bushels: 200, trend_yield_bushels: 205, expected_operation_version: "${op_a_v}" }, as: CommodityAdvisor, captures: { bl_a: $.data.id } }
            - { call: "POST /advisory/production-baselines", payload: { operation_id: "${op_b}", planted_acres: 100, aph_yield_bushels: 200, trend_yield_bushels: 205, expected_operation_version: "${op_b_v}" }, as: CommodityAdvisor, captures: { bl_b: $.data.id } }
          trigger:
            - { call: "GET /advisory/production-baselines/${bl_a}", as: CommodityAdvisor, captures: { a_aph: $.data.expected_bushels_aph, a_trend: $.data.expected_bushels_trend, a_sel: $.data.expected_bushels } }
            - { call: "GET /advisory/production-baselines/${bl_b}", as: CommodityAdvisor, captures: { b_aph: $.data.expected_bushels_aph, b_trend: $.data.expected_bushels_trend, b_sel: $.data.expected_bushels } }
          assert:
            - "Baseline.${bl_a}.expected_bushels_aph == 20000 AND Baseline.${bl_a}.expected_bushels_trend == 20500"
            - "Baseline.${bl_a}.expected_bushels == 20000 (APH variant selected)"
            - "Baseline.${bl_b}.expected_bushels == 20500 (TREND variant selected) — identical inputs, different operative result"
      - name: benchmark_marketing_year_vs_harvest_window
        grounds:
          - calculations.performance_benchmark
          - "endpoints: GET /advisory/operations/{operationId}/performance-report"
        distinguishing_aspect: |
          Entity domain = performance reporting (vs ProductionBaseline in the sibling
          instance). The same two priced trades benchmark at 331 bps against the
          marketing-year average but -163 bps against the October harvest-window
          average — sign reversal purely from the variant's input-set window.
        test_recipe:
          setup:
            - "AGGRESSIVE operation (cap 20000) with ACTIVE plan (max_priced_pct 1.00, expected 20000), an APPROVED buyer, FLAT_PRICE contract 10000 bu @4.55 and HTA contract 9550 bu fixed at 4.70"
            - "SETTLEMENT ticks CORN 2026-12: 2026-06-15 4.20, 2026-07-15 4.30, 2026-10-05 4.60, 2026-10-20 4.80, plus one QUOTE tick 9.99 on 2026-10-10 (must be excluded)"
          setup_api_calls:
            - { call: "POST /advisory/operations", payload: { name: "Bench Farm", primary_commodity: CORN, crop_year: 2026, risk_profile: AGGRESSIVE, yield_method: APH }, as: CommodityAdvisor, captures: { op_id: $.data.id, op_v: $.data.version } }
            - { call: "POST /advisory/production-baselines", payload: { operation_id: "${op_id}", planted_acres: 100, aph_yield_bushels: 200, trend_yield_bushels: 205, expected_operation_version: "${op_v}" }, as: CommodityAdvisor, captures: { bl_id: $.data.id } }
            - { call: "POST /advisory/production-baselines/${bl_id}/certify", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/advisory-agreements", payload: { operation_id: "${op_id}", fee_type: FLAT_ANNUAL, flat_annual_fee: 3000 }, as: CommodityAdvisor, captures: { ag_id: $.data.id } }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/submit", as: CommodityAdvisor }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/deliver-disclosure", as: CommodityAdvisor }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/acknowledge-disclosure", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/sign", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/marketing-plans", payload: { operation_id: "${op_id}", baseline_id: "${bl_id}", max_priced_pct: 1.00 }, as: CommodityAdvisor, captures: { plan_id: $.data.id } }
            - { call: "POST /advisory/marketing-plans/${plan_id}/activate", as: CommodityAdvisor }
            - { call: "POST /advisory/buyers", payload: { name: "Elevator Co", buyer_type: ELEVATOR, credit_rating: A }, as: CommodityAdvisor, captures: { buyer_id: $.data.id } }
            - { call: "POST /advisory/buyers/${buyer_id}/approve", as: ComplianceOfficer }
            - { call: "POST /advisory/sales-contracts", payload: { operation_id: "${op_id}", plan_id: "${plan_id}", buyer_id: "${buyer_id}", contract_type: FLAT_PRICE, bushels: 10000, fixed_price: 4.55, delivery_window_start: "2026-10-01", delivery_window_end: "2026-11-01" }, as: CommodityAdvisor, captures: { c1: $.data.id } }
            - { call: "POST /advisory/sales-contracts", payload: { operation_id: "${op_id}", plan_id: "${plan_id}", buyer_id: "${buyer_id}", contract_type: HTA, bushels: 9550, contract_month: "2026-12", delivery_window_start: "2026-11-01", delivery_window_end: "2026-12-01" }, as: CommodityAdvisor, captures: { c2: $.data.id } }
            - { call: "POST /advisory/sales-contracts/${c2}/fix-price", payload: { fixation_price: 4.70 }, as: CommodityAdvisor }
            - { call: "POST /advisory/market-ticks", payload: { commodity: CORN, contract_month: "2026-12", price: 4.20, kind: SETTLEMENT, price_date: "2026-06-15" }, as: PlatformAdmin }
            - { call: "POST /advisory/market-ticks", payload: { commodity: CORN, contract_month: "2026-12", price: 4.30, kind: SETTLEMENT, price_date: "2026-07-15" }, as: PlatformAdmin }
            - { call: "POST /advisory/market-ticks", payload: { commodity: CORN, contract_month: "2026-12", price: 4.60, kind: SETTLEMENT, price_date: "2026-10-05" }, as: PlatformAdmin }
            - { call: "POST /advisory/market-ticks", payload: { commodity: CORN, contract_month: "2026-12", price: 4.80, kind: SETTLEMENT, price_date: "2026-10-20" }, as: PlatformAdmin }
            - { call: "POST /advisory/market-ticks", payload: { commodity: CORN, contract_month: "2026-12", price: 9.99, kind: QUOTE, price_date: "2026-10-10" }, as: PlatformAdmin }
          trigger:
            - { call: "GET /advisory/operations/${op_id}/performance-report", as: Grower, as_user_id: "${op_id}", captures: { wap_y: $.data.weighted_avg_sale_price, bench_y: $.data.benchmark_price, bps_y: $.data.outperformance_bps, n_y: $.data.benchmark_tick_count } }
            - { call: "GET /advisory/operations/${op_id}/performance-report", payload: { benchmark_method: HARVEST_WINDOW_AVG }, as: Grower, as_user_id: "${op_id}", captures: { wap_h: $.data.weighted_avg_sale_price, bench_h: $.data.benchmark_price, bps_h: $.data.outperformance_bps, n_h: $.data.benchmark_tick_count } }
          assert:
            - "report(MARKETING_YEAR_AVG): weighted_avg_sale_price == 4.6233, benchmark_price == 4.4750, outperformance_bps == 331, benchmark_tick_count == 4"
            - "report(HARVEST_WINDOW_AVG): weighted_avg_sale_price == 4.6233, benchmark_price == 4.7000, outperformance_bps == -163, benchmark_tick_count == 2 (QUOTE tick excluded)"
            - "Same trades, different variant: 331 != -163"
      - name: advisory_fee_per_bushel_vs_flat
        grounds:
          - calculations.advisory_fee_statement
          - "endpoints: GET /advisory/advisory-agreements/{agreementId}/fee-statement"
        distinguishing_aspect: |
          Entity domain = AdvisoryAgreement (fee billing, vs production sizing and
          benchmark reporting in the sibling instances). An identical 19550-bushel
          confirmed delivery history bills 391.00 under PER_BUSHEL (0.02/bu) and
          5000.00 under FLAT_ANNUAL.
        test_recipe:
          setup:
            - "Operation (acres 100, aph 195.50 -> expected 19550) with PER_BUSHEL agreement A ACTIVE, plan auto-CLOSED after full delivery of a 19550-bu FLAT contract @4.00 (tickets 10000 + 9550 at 15.0% moisture), then agreement A TERMINATED and FLAT_ANNUAL agreement B (5000.00) ACTIVE"
          setup_api_calls:
            - { call: "POST /advisory/operations", payload: { name: "Fee Farm", primary_commodity: CORN, crop_year: 2026, risk_profile: AGGRESSIVE, yield_method: APH }, as: CommodityAdvisor, captures: { op_id: $.data.id, op_v: $.data.version } }
            - { call: "POST /advisory/production-baselines", payload: { operation_id: "${op_id}", planted_acres: 100, aph_yield_bushels: 195.50, trend_yield_bushels: 200, expected_operation_version: "${op_v}" }, as: CommodityAdvisor, captures: { bl_id: $.data.id } }
            - { call: "POST /advisory/production-baselines/${bl_id}/certify", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/advisory-agreements", payload: { operation_id: "${op_id}", fee_type: PER_BUSHEL, rate_per_bushel: 0.02 }, as: CommodityAdvisor, captures: { ag_a: $.data.id } }
            - { call: "POST /advisory/advisory-agreements/${ag_a}/submit", as: CommodityAdvisor }
            - { call: "POST /advisory/advisory-agreements/${ag_a}/deliver-disclosure", as: CommodityAdvisor }
            - { call: "POST /advisory/advisory-agreements/${ag_a}/acknowledge-disclosure", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/advisory-agreements/${ag_a}/sign", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/marketing-plans", payload: { operation_id: "${op_id}", baseline_id: "${bl_id}", max_priced_pct: 1.00 }, as: CommodityAdvisor, captures: { plan_id: $.data.id } }
            - { call: "POST /advisory/marketing-plans/${plan_id}/activate", as: CommodityAdvisor }
            - { call: "POST /advisory/buyers", payload: { name: "Processor Inc", buyer_type: PROCESSOR, credit_rating: B }, as: CommodityAdvisor, captures: { buyer_id: $.data.id } }
            - { call: "POST /advisory/buyers/${buyer_id}/approve", as: ComplianceOfficer }
            - { call: "POST /advisory/sales-contracts", payload: { operation_id: "${op_id}", plan_id: "${plan_id}", buyer_id: "${buyer_id}", contract_type: FLAT_PRICE, bushels: 19550, fixed_price: 4.00, delivery_window_start: "2026-10-01", delivery_window_end: "2026-11-01" }, as: CommodityAdvisor, captures: { c_id: $.data.id } }
            - { call: "POST /advisory/delivery-tickets", payload: { contract_id: "${c_id}", delivery_date: "2026-10-10", gross_bushels: 10000, moisture_pct: 15.0 }, as: Grower, as_user_id: "${op_id}", captures: { t1: $.data.id } }
            - { call: "POST /advisory/delivery-tickets", payload: { contract_id: "${c_id}", delivery_date: "2026-10-11", gross_bushels: 9550, moisture_pct: 15.0 }, as: Grower, as_user_id: "${op_id}", captures: { t2: $.data.id } }
            - { call: "POST /advisory/delivery-tickets/${t1}/confirm", as: CommodityAdvisor }
            - { call: "POST /advisory/delivery-tickets/${t2}/confirm", as: CommodityAdvisor }
            - { call: "PUT /advisory/advisory-agreements/${ag_a}", payload: { status_change: TERMINATE }, as: CommodityAdvisor }
            - { call: "POST /advisory/advisory-agreements", payload: { operation_id: "${op_id}", fee_type: FLAT_ANNUAL, flat_annual_fee: 5000 }, as: CommodityAdvisor, captures: { ag_b: $.data.id } }
            - { call: "POST /advisory/advisory-agreements/${ag_b}/submit", as: CommodityAdvisor }
            - { call: "POST /advisory/advisory-agreements/${ag_b}/deliver-disclosure", as: CommodityAdvisor }
            - { call: "POST /advisory/advisory-agreements/${ag_b}/acknowledge-disclosure", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/advisory-agreements/${ag_b}/sign", as: Grower, as_user_id: "${op_id}" }
          trigger:
            - { call: "GET /advisory/advisory-agreements/${ag_a}/fee-statement", payload: { period_start: "2026-10-01", period_end: "2026-10-31" }, as: CommodityAdvisor, captures: { fee_a: $.data.fee_dollars, billable_a: $.data.billable_bushels } }
            - { call: "GET /advisory/advisory-agreements/${ag_b}/fee-statement", payload: { period_start: "2026-10-01", period_end: "2026-10-31" }, as: CommodityAdvisor, captures: { fee_b: $.data.fee_dollars, billable_b: $.data.billable_bushels } }
          assert:
            - "Agreement A (PER_BUSHEL 0.02): billable_bushels == 19550, fee_dollars == 391.00"
            - "Agreement B (FLAT_ANNUAL): billable_bushels == 19550, fee_dollars == 5000.00"
            - "Same delivery history, different variant totals: 391.00 != 5000.00"

  # ---------------------------------------------------------------- Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: coverage_cap_nested_min_and_profile_branch
        grounds:
          - calculations.hedge_coverage_cap
          - state_machines.HedgeRecommendation.PROPOSED_to_ACCEPTED
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — cap = floor(expected *
          min(plan.max_priced_pct, RISK_COVERAGE_CAP[risk_profile])) combines a nested
          min (plan vs profile) with a conditional branch on risk_profile; a BALANCED
          operation whose plan sets max_priced_pct 0.70 caps at 14000 (plan binds),
          not 16000 (profile).
        test_recipe:
          setup:
            - "BALANCED operation, expected 20000, plan max_priced_pct 0.70 ACTIVE -> coverage_cap_bushels == 14000; two advisor recommendations 14000 bu and 1 bu"
          setup_api_calls:
            - { call: "POST /advisory/operations", payload: { name: "Cap Farm", primary_commodity: CORN, crop_year: 2026, risk_profile: BALANCED, yield_method: APH }, as: CommodityAdvisor, captures: { op_id: $.data.id, op_v: $.data.version } }
            - { call: "POST /advisory/production-baselines", payload: { operation_id: "${op_id}", planted_acres: 100, aph_yield_bushels: 200, trend_yield_bushels: 205, expected_operation_version: "${op_v}" }, as: CommodityAdvisor, captures: { bl_id: $.data.id } }
            - { call: "POST /advisory/production-baselines/${bl_id}/certify", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/advisory-agreements", payload: { operation_id: "${op_id}", fee_type: FLAT_ANNUAL, flat_annual_fee: 2500 }, as: CommodityAdvisor, captures: { ag_id: $.data.id } }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/submit", as: CommodityAdvisor }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/deliver-disclosure", as: CommodityAdvisor }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/acknowledge-disclosure", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/sign", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/marketing-plans", payload: { operation_id: "${op_id}", baseline_id: "${bl_id}", max_priced_pct: 0.70 }, as: CommodityAdvisor, captures: { plan_id: $.data.id } }
            - { call: "POST /advisory/marketing-plans/${plan_id}/activate", as: CommodityAdvisor }
            - { call: "POST /advisory/hedge-recommendations", payload: { plan_id: "${plan_id}", instrument: FUTURES_SHORT, contract_month: "2026-12", bushels: 14000 }, as: CommodityAdvisor, captures: { rec_big: $.data.id } }
            - { call: "POST /advisory/hedge-recommendations", payload: { plan_id: "${plan_id}", instrument: FUTURES_SHORT, contract_month: "2026-12", bushels: 1 }, as: CommodityAdvisor, captures: { rec_one: $.data.id } }
          trigger:
            - { call: "POST /advisory/hedge-recommendations/${rec_big}/accept", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/hedge-recommendations/${rec_one}/accept", as: Grower, as_user_id: "${op_id}", captures: { err: $.data.error_id } }
            - { call: "GET /advisory/marketing-plans/${plan_id}", as: CommodityAdvisor, captures: { cap: $.data.coverage_cap_bushels, hedged: $.data.hedged_bushels } }
          assert:
            - "Plan.coverage_cap_bushels == 14000 (plan max 0.70 binds over BALANCED 0.80)"
            - "Accept 14000-bu recommendation succeeds (14000 <= 14000, equality allowed); plan.hedged_bushels == 14000"
            - "Accept 1-bu recommendation rejected with ERR_COVERAGE_CAP_EXCEEDED (14001 > 14000)"
      - name: settlement_per_line_rounding_then_sum
        grounds:
          - calculations.contract_settlement_value
          - entities.SalesContract.fields.settled_value_dollars
        distinguishing_aspect: |
          Mode (b): nested rounding order — the scaffold pins round-per-ticket THEN
          sum; summing net bushels first and rounding once would give 89052.21, but
          the pinned order yields 89052.20. One cent of divergence is the testable
          fingerprint of the pinned order.
        test_recipe:
          setup:
            - "AGGRESSIVE operation (cap 20000), ACTIVE plan, APPROVED buyer, FLAT_PRICE contract 19550 bu @4.5551, window [2026-10-01, 2026-11-01)"
            - "Ticket 1: gross 10000 @ 16.5% moisture -> net 9820.000; Ticket 2: gross 10000 @ 17.25% -> net 9730.000 (total delivered 19550 <= floor(19550*1.02)=19941)"
          setup_api_calls:
            - { call: "POST /advisory/operations", payload: { name: "Round Farm", primary_commodity: CORN, crop_year: 2026, risk_profile: AGGRESSIVE, yield_method: APH }, as: CommodityAdvisor, captures: { op_id: $.data.id, op_v: $.data.version } }
            - { call: "POST /advisory/production-baselines", payload: { operation_id: "${op_id}", planted_acres: 100, aph_yield_bushels: 200, trend_yield_bushels: 205, expected_operation_version: "${op_v}" }, as: CommodityAdvisor, captures: { bl_id: $.data.id } }
            - { call: "POST /advisory/production-baselines/${bl_id}/certify", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/advisory-agreements", payload: { operation_id: "${op_id}", fee_type: FLAT_ANNUAL, flat_annual_fee: 1000 }, as: CommodityAdvisor, captures: { ag_id: $.data.id } }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/submit", as: CommodityAdvisor }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/deliver-disclosure", as: CommodityAdvisor }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/acknowledge-disclosure", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/sign", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/marketing-plans", payload: { operation_id: "${op_id}", baseline_id: "${bl_id}", max_priced_pct: 1.00 }, as: CommodityAdvisor, captures: { plan_id: $.data.id } }
            - { call: "POST /advisory/marketing-plans/${plan_id}/activate", as: CommodityAdvisor }
            - { call: "POST /advisory/buyers", payload: { name: "Exporter LLC", buyer_type: EXPORTER, credit_rating: A }, as: CommodityAdvisor, captures: { buyer_id: $.data.id } }
            - { call: "POST /advisory/buyers/${buyer_id}/approve", as: ComplianceOfficer }
            - { call: "POST /advisory/sales-contracts", payload: { operation_id: "${op_id}", plan_id: "${plan_id}", buyer_id: "${buyer_id}", contract_type: FLAT_PRICE, bushels: 19550, fixed_price: 4.5551, delivery_window_start: "2026-10-01", delivery_window_end: "2026-11-01" }, as: CommodityAdvisor, captures: { c_id: $.data.id } }
            - { call: "POST /advisory/delivery-tickets", payload: { contract_id: "${c_id}", delivery_date: "2026-10-12", gross_bushels: 10000, moisture_pct: 16.5 }, as: Grower, as_user_id: "${op_id}", captures: { t1: $.data.id, t1_net: $.data.net_bushels } }
            - { call: "POST /advisory/delivery-tickets", payload: { contract_id: "${c_id}", delivery_date: "2026-10-13", gross_bushels: 10000, moisture_pct: 17.25 }, as: Grower, as_user_id: "${op_id}", captures: { t2: $.data.id, t2_net: $.data.net_bushels } }
          trigger:
            - { call: "POST /advisory/delivery-tickets/${t1}/confirm", as: CommodityAdvisor, captures: { t1_val: $.data.ticket_value_dollars } }
            - { call: "POST /advisory/delivery-tickets/${t2}/confirm", as: CommodityAdvisor, captures: { t2_val: $.data.ticket_value_dollars } }
            - { call: "GET /advisory/sales-contracts/${c_id}", as: CommodityAdvisor, captures: { settled: $.data.settled_value_dollars, delivered: $.data.delivered_bushels } }
          assert:
            - "Ticket1.net_bushels == 9820.000 AND Ticket2.net_bushels == 9730.000"
            - "Ticket1.ticket_value_dollars == 44731.08 AND Ticket2.ticket_value_dollars == 44321.12 (per-line round half-up)"
            - "Contract.settled_value_dollars == 89052.20 — NOT 89052.21 (sum-then-round); Contract.delivered_bushels == 19550"
      - name: forced_liquidation_pinned_evaluation_order
        grounds:
          - calculations.forced_liquidation
          - state_machines.BrokeragePosition.OPEN_to_LIQUIDATED
          - state_machines.MarginAccount.CALL_OUTSTANDING_to_FUNDED
        distinguishing_aspect: |
          Mode (c): circular-looking dependency — the liquidation deficit depends on
          equity, but each liquidation changes equity; the scaffold pins (1) freeze
          settlement marks, (2) order candidates initial_margin DESC / created_at ASC,
          (3) stop when equity >= maintenance. Largest-first liquidates position A and
          spares B; smallest-first would have killed B instead — the pinned order is
          observable in the survivor set.
        test_recipe:
          setup:
            - "BALANCED operation expected 200000 (cap 160000), ACTIVE plan, margin account funded 20000"
            - "SETTLEMENT tick CORN 2026-12 @4.50 on 2026-06-01; position A 30000 bu (IM 9000) and position B 20000 bu (IM 6000) both OPEN at entry 4.50, A created before B"
          setup_api_calls:
            - { call: "POST /advisory/operations", payload: { name: "Liq Farm", primary_commodity: CORN, crop_year: 2026, risk_profile: BALANCED, yield_method: APH }, as: CommodityAdvisor, captures: { op_id: $.data.id, op_v: $.data.version } }
            - { call: "POST /advisory/production-baselines", payload: { operation_id: "${op_id}", planted_acres: 1000, aph_yield_bushels: 200, trend_yield_bushels: 205, expected_operation_version: "${op_v}" }, as: CommodityAdvisor, captures: { bl_id: $.data.id } }
            - { call: "POST /advisory/production-baselines/${bl_id}/certify", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/advisory-agreements", payload: { operation_id: "${op_id}", fee_type: FLAT_ANNUAL, flat_annual_fee: 1000 }, as: CommodityAdvisor, captures: { ag_id: $.data.id } }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/submit", as: CommodityAdvisor }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/deliver-disclosure", as: CommodityAdvisor }
