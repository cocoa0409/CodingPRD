      - name: pii_gate_priority_31_outranks_dataset_approval_priority_40_on_version_approve
        claim_type: Cascading validation
        grounds:
          - validations.priority_31
          - validations.priority_40
          - errors.ERR_PII_REVIEW_MISSING
          - errors.ERR_DATASET_NOT_APPROVED
          - state_machines.ModelVersion.PENDING_REVIEW_to_CHANGES_REQUESTED
        distinguishing_aspect: |
          One request violates TWO business rules at once — the snapshot's PII review has not passed
          (priority 31) AND the snapshot is not APPROVED (priority 40) — and the answer is the
          lower-numbered safety rule, ERR_PII_REVIEW_MISSING, never the referential one. The same
          snapshot state also blocks its own submit, which is why the two violations are inseparable
          here: pii_review_passed false makes APPROVED unreachable.
        test_recipe:
          setup:
            - "clock at its 2026-08-01T00:00:00Z startup default"
            - "one TrainingDataset created with pii_review_passed omitted, so the default false applies and it stays DRAFT"
            - "one fully documented ModelVersion on that snapshot, moved to PENDING_REVIEW"
          setup_api_calls:
            - call: "POST /models"
              payload: { name: "fraud-scorer", task_type: "CLASSIFICATION", owner_team: "risk-ml" }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { m_id: $.data.id }
            - call: "POST /training-datasets"
              payload: { name: "snap-2026-07", snapshot_uri: "s3://snaps/2026-07", row_count: 1000000, feature_hash: "fs-v1", baseline_bin_proportions: [0.20, 0.20, 0.20, 0.20, 0.20], baseline_positive_rate: 0.30, license_class: "RESTRICTED" }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { ds_id: $.data.id, pii: $.data.pii_review_passed, ds_state: $.data.approval_state }
            - call: "POST /model-versions"
              payload: { model_id: "${m_id}", training_dataset_id: "${ds_id}", semver: "1.0.0", artifact_digest: "sha256:aaa", feature_spec_hash: "fs-v1", baseline_accuracy: 0.82, baseline_positive_rate: 0.30, baseline_p95_latency_ms: 200, doc_sections: ["INTENDED_USE", "TRAINING_DATA", "EVALUATION", "LIMITATIONS"], repro_artifacts: ["TRAINING_CODE_COMMIT", "ENV_LOCKFILE_DIGEST", "RANDOM_SEED", "FEATURE_SPEC_HASH"] }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { v1_id: $.data.id, doc_pct: $.data.doc_completeness_pct }
            - call: "POST /model-versions/${v1_id}/submit-for-review"
              payload: {}
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { v1_state: $.data.approval_state }
          trigger:
            - call: "POST /training-datasets/${ds_id}/submit"
              payload: {}
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { ds_submit_err: $.data.error_id }
            - call: "POST /model-versions/${v1_id}/decision"
              payload: { decision: "APPROVE" }
              as: ModelApprover
              as_user_id: "u_appr_1"
              captures: { approve_err: $.data.error_id }
            - call: "GET /model-versions/${v1_id}"
              payload: {}
              as: ModelApprover
              as_user_id: "u_appr_1"
              captures: { after_state: $.data.approval_state, after_approved_at: $.data.approved_at }
            - call: "POST /model-versions/${v1_id}/decision"
              payload: { decision: "REQUEST_CHANGES", note: "attach the PII review before re-submitting" }
              as: ModelApprover
              as_user_id: "u_appr_1"
              captures: { cr_state: $.data.approval_state, cr_by: $.data.decided_by_user_id }
          assert:
            - "the snapshot took the default: pii_review_passed == false and approval_state == 'DRAFT'"
            - "the version still reached PENDING_REVIEW: the priority-30 documentation gate passed (doc_completeness_pct 80.00) and neither 31 nor 40 applies to submit-for-review"
            - "the snapshot's own submit is blocked first: HTTP 422 'ERR_PII_REVIEW_MISSING' (priority 31 on POST /training-datasets/{id}/submit), which is why APPROVED is unreachable"
            - "PRIORITY: the APPROVE decision violates both 31 (pii false) and 40 (dataset DRAFT) and answers HTTP 422 'ERR_PII_REVIEW_MISSING' — the safety rule, not 'ERR_DATASET_NOT_APPROVED'"
            - "the failed APPROVE wrote nothing: approval_state still 'PENDING_REVIEW', approved_at still null, revalidation_due_at still null"
            - "SATISFACTION: the same endpoint with decision REQUEST_CHANGES succeeds (approval_state 'CHANGES_REQUESTED', decided_by_user_id 'u_appr_1') — the two gates are APPROVE-only"

      - name: state_check_outranks_referential_check_on_version_approve
        claim_type: Priority conflict
        grounds:
          - validations.priority_15
          - validations.priority_40
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_priority_15_beats_referential_priority_40_on_version_approve
          rationale: "The named §1.8 instance sets up both violations at once and asserts ERR_INVALID_STATE, then repairs the state to expose ERR_DATASET_NOT_APPROVED."

      - name: safety_check_outranks_capacity_check_on_ramp
        claim_type: Priority conflict
        grounds:
