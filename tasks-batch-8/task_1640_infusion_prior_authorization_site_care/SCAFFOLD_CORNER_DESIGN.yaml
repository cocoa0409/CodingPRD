            - "Different drug_code: 201 with a new policy id"
      - name: dose_exceeds_max_at_create_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=7]"
          - "errors[ERR_DOSE_EXCEEDS_MAX]"
        distinguishing_aspect: "requested_dose_mg 1500 against max_dose_mg 1000 fails the safety check with ERR_DOSE_EXCEEDS_MAX (422); a dose exactly equal to max_dose_mg (1000) passes."
        test_recipe:
