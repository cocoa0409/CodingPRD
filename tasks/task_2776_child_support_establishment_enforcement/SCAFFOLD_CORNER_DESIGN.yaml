              payload: { installment_count: 3, expected_case_version: "${cvd9}" }
              as: FinanceOfficer
              captures: { e_risk: "$.data.error_id" }
            - call: "GET /child-support/compromise-offers"
              payload: { case_id: "${cased9}" }
              as: FinanceOfficer
              captures: { off_count: "$.meta.total_count" }
          assert:
            - "${monp9} == 75000 and ${pp9} == 150000 and ${ap9} == 150000 and ${up9} == 0  # a TANF case's arrears are entirely assigned"
            - "HTTP 409 and ${e_assigned} == ERR_ASSIGNED_ARREARS_NOT_COMPROMISABLE  # 150000 clears MIN_COMPROMISE_ARREARS_CENTS 100000 and the risk tier is MEDIUM, so the flag is the only obstacle"
            - "${mond9} == 5000 and ${capd9} == 0.65 and ${whd9} == 6000  # available income is 0 so the order is MINIMUM_ORDER_CENTS; 75000 >= 3 * 5000 triggers ARREARS_12_WEEK_BUMP, and floor(100000 * 0.65) == 65000 leaves room for the full 6000"
            - "${remd9} == DELINQUENT  # one lapse strictly after next_remittance_due_at 2026-08-15"
            - "${risk_c} == 77 and ${tier_c} == HIGH  # round_half_up((25*100 + 20*60 + 40*100 + 15*0) / 100) == round_half_up(77.0) == 77 and 77 >= 67"
            - "${risk_e} == 75 and ${tier_e} == HIGH  # round_half_up((40*100 + 25*60 + 20*100 + 10*0 + 5*0) / 100) == 75; identical data, different weights"
            - "${pd9} == 75000 and ${ud9} == 75000"
            - "HTTP 409 and ${e_risk} == ERR_COMPROMISE_RISK_TOO_HIGH  # this request ALSO violates priority 43 (75000 < 100000) but 39 < 43"
            - "${off_count} == 0  # neither refused request persisted a CompromiseOffer"

      - name: offer_acceptance_is_validated_against_siblings_and_the_live_ledger
        claim_type: cross_entity_validation
        grounds:
          - "validations[priority 35]"
          - "validations[priority 36]"
          - "validations[priority 27]"
          - "validations[priority 48]"
          - "errors[ERR_OFFER_SUPERSEDED]"
          - "errors[ERR_OFFER_SNAPSHOT_STALE]"
          - "errors[ERR_INSTALLMENT_NOT_YET_LATE]"
          - "errors[ERR_ACTIVE_OFFER_EXISTS]"
          - "state_machines.CompromiseOffer.PROPOSED -> SUPERSEDED"
        distinguishing_aspect: >
          Every refusal here is decided by a row OTHER than the one being written.
          Offer 1 is rejected because offer 2 exists; offer 2 is rejected because a
          10000 payment moved the case ledger out from under its snapshot even
          though the offer row itself never changed and its version is still
          current; offer 4 is rejected because offer 3 is ACCEPTED; and the default
          declaration on offer 3 is rejected because the clock has not passed a date
          stored on that offer. The snapshot check is the sharp one: it is a value
          comparison against case.arrears_principal_cents, not an optimistic-
          concurrency version check, so supplying the right expected_case_version
          does not save it.
        test_recipe:
          setup:
            - "Empty database. Clock starts at 2026-08-01T00:00:00Z, then advances to 2026-11-01T00:00:00Z."
            - "CP 200000 and NCP 300000 VERIFIED_WAGE_RECORD; ENTERED order, monthly 75000; DIRECT_APPLICATION so the arrears are unassigned and compromisable."
            - "Two CURRENT_SUPPORT charges of 75000, periods 2026-08-01..2026-09-01 and 2026-09-01..2026-10-01, due 2026-08-15 and 2026-09-15: arrears_principal_cents 150000."
            - "At 2026-11-01 the aggregate interest is 1875; after a 10000 payment against the oldest charge it is 1725 (snapshots 2026-08-31 over 65000, 09-30 and 10-31 over 140000)."
            - "The NCP's compromise_risk_tier is MEDIUM (44) so no risk gate interferes."
          setup_api_calls:
            - call: "POST /child-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /child-support/participants"
              payload: { role_type: "CUSTODIAL_PARTY", full_name: "Sunniva Petrakis", ssn_last4: "6225", residence_state_code: "MN", monthly_gross_income_cents: 200000, income_verification_source: "VERIFIED_WAGE_RECORD" }
              as: CaseWorker
              captures: { cpva: "$.data.id" }
            - call: "POST /child-support/participants"
              payload: { role_type: "NONCUSTODIAL_PARTY", full_name: "Loukas Petrakis", ssn_last4: "6226", residence_state_code: "MN", monthly_gross_income_cents: 300000, income_verification_source: "VERIFIED_WAGE_RECORD", supports_second_family: false, has_valid_drivers_license: true }
              as: CaseWorker
              captures: { ncpva: "$.data.id" }
            - call: "POST /child-support/participants/${ncpva}/locate-results"
              payload: { locate_outcome: "LOCATED" }
              as: CaseWorker
            - call: "POST /child-support/cases"
              payload: { case_type: "DIRECT_APPLICATION", custodial_party_id: "${cpva}", noncustodial_party_id: "${ncpva}", child_count: 2, tanf_assistance: false, good_cause_claim: false }
              as: CaseWorker
              captures: { caseva: "$.data.id" }
            - call: "POST /child-support/cases/${caseva}/paternity-actions"
              payload: { method: "PRESUMED_MARITAL" }
              as: CaseWorker
            - call: "POST /child-support/cases/${caseva}/orders"
              payload: { order_type: "CURRENT_SUPPORT", origin_state_code: "MN", effective_date: "2026-08-01" }
              as: CaseWorker
              captures: { orderva: "$.data.id" }
            - call: "POST /child-support/orders/${orderva}/guideline-calculation"
              payload: {}
              as: CaseWorker
            - call: "POST /child-support/orders/${orderva}/entry"
              payload: {}
              as: SupervisingAttorney
              captures: { monva: "$.data.monthly_obligation_cents" }
            - call: "POST /child-support/orders/${orderva}/charges"
              payload: { charge_type: "CURRENT_SUPPORT", period_start_date: "2026-08-01", period_end_date: "2026-09-01", due_date: "2026-08-15", amount_cents: 75000 }
              as: FinanceOfficer
            - call: "POST /child-support/orders/${orderva}/charges"
              payload: { charge_type: "CURRENT_SUPPORT", period_start_date: "2026-09-01", period_end_date: "2026-10-01", due_date: "2026-09-15", amount_cents: 75000 }
              as: FinanceOfficer
            - call: "POST /child-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "GET /child-support/cases/${caseva}"
              as: FinanceOfficer
              captures: { cva1: "$.data.version" }
            - call: "POST /child-support/cases/${caseva}/compromise-offers"
              payload: { installment_count: 3, expected_case_version: "${cva1}" }
              as: FinanceOfficer
              captures: { o1: "$.data.id", o1_p: "$.data.principal_due_snapshot_cents", o1_st: "$.data.status" }
            - call: "GET /child-support/cases/${caseva}"
              as: FinanceOfficer
              captures: { cva2: "$.data.version" }
            - call: "POST /child-support/cases/${caseva}/compromise-offers"
              payload: { installment_count: 6, expected_case_version: "${cva2}" }
              as: FinanceOfficer
              captures: { o2: "$.data.id", o2_p: "$.data.principal_due_snapshot_cents" }
            - call: "GET /child-support/compromise-offers/${o1}"
              as: FinanceOfficer
              captures: { o1_st2: "$.data.status" }
            - call: "POST /child-support/compromise-offers/${o1}/acceptance"
              payload: {}
              as: NoncustodialParty
              as_user_id: "${ncpva}"
              captures: { e_super: "$.data.error_id" }
            - call: "POST /child-support/cases/${caseva}/payments"
              payload: { source: "DIRECT_PAY", amount_cents: 10000 }
              as: FinanceOfficer
              captures: { pay_arr: "$.data.applied_arrears_cents", pay_cur: "$.data.applied_current_cents" }
            - call: "POST /child-support/compromise-offers/${o2}/acceptance"
              payload: {}
              as: NoncustodialParty
              as_user_id: "${ncpva}"
              captures: { e_stale: "$.data.error_id" }
            - call: "GET /child-support/cases/${caseva}"
              as: FinanceOfficer
              captures: { cva3: "$.data.version", p_now: "$.data.arrears_principal_cents", r_now: "$.data.interest_receivable_cents" }
            - call: "POST /child-support/cases/${caseva}/compromise-offers"
              payload: { installment_count: 3, expected_case_version: "${cva3}" }
              as: FinanceOfficer
              captures: { o3: "$.data.id", o3_p: "$.data.principal_due_snapshot_cents", o3_i: "$.data.interest_due_snapshot_cents", o3_tot: "$.data.settlement_total_cents", o3_mo: "$.data.monthly_installment_cents", o3_fin: "$.data.final_installment_cents" }
            - call: "POST /child-support/compromise-offers/${o3}/acceptance"
              payload: {}
              as: NoncustodialParty
              as_user_id: "${ncpva}"
              captures: { o3_st: "$.data.status", o3_due: "$.data.next_installment_due_date" }
            - call: "POST /child-support/compromise-offers/${o3}/default-declaration"
              payload: {}
              as: FinanceOfficer
              captures: { e_notlate: "$.data.error_id" }
            - call: "GET /child-support/cases/${caseva}"
              as: FinanceOfficer
              captures: { cva4: "$.data.version" }
            - call: "POST /child-support/cases/${caseva}/compromise-offers"
              payload: { installment_count: 3, expected_case_version: "${cva4}" }
              as: FinanceOfficer
              captures: { e_active: "$.data.error_id" }
          assert:
            - "${monva} == 75000 and ${o1_p} == 150000 and ${o1_st} == PROPOSED"
            - "${o2_p} == 150000  # both offers snapshot the same untouched ledger"
            - "${o1_st2} == SUPERSEDED  # creating offer 2 pushed offer 1 out of PROPOSED"
            - "HTTP 409 and ${e_super} == ERR_OFFER_SUPERSEDED  # the acceptance is refused because of a sibling row, and priority 10's status band deliberately excludes SUPERSEDED so this specific error is reachable"
            - "${pay_cur} == 0 and ${pay_arr} == 10000  # 2026-11-01 falls in neither charge's period window, so bucket 1 is empty and bucket 3 takes the oldest charge"
            - "HTTP 409 and ${e_stale} == ERR_OFFER_SNAPSHOT_STALE  # offer 2 is still PROPOSED and unmodified, but its principal_due_snapshot_cents 150000 no longer equals case.arrears_principal_cents 140000"
            - "${p_now} == 140000 and ${r_now} == 1725  # aggregate snapshots 2026-08-31 over 65000 (325) plus 09-30 and 10-31 over 140000 (700 each)"
            - "${o3_p} == 140000 and ${o3_i} == 1725  # offer 3 snapshots the moved ledger"
            - "${o3_tot} == 141294 and ${o3_mo} == 47098 and ${o3_fin} == 47098  # pre-waiver 141725 <= 500000 so the rate is 0.25; round_half_up(1725 * 0.25) == round_half_up(431.25) == 431; 141725 - 431 == 141294 divides exactly by 3"
            - "${o3_st} == ACCEPTED and ${o3_due} == 2026-12-01  # accepted_at plus one month"
            - "HTTP 409 and ${e_notlate} == ERR_INSTALLMENT_NOT_YET_LATE  # the clock date 2026-11-01 is not strictly past next_installment_due_date 2026-12-01"
            - "HTTP 409 and ${e_active} == ERR_ACTIVE_OFFER_EXISTS  # offer 3 is ACCEPTED, so no fourth offer may be created and the SUPERSEDED-on-create cascade does not apply"

      - name: deviation_request_at_exactly_ten_percent_of_guideline_is_accepted
        claim_type: satisfaction_to_pass
        grounds:
          - "validations[priority 34]"
          - "errors[ERR_DEVIATION_BELOW_MIN_PCT]"
          - "state_machines.SupportOrder.CALCULATED -> PENDING_DEVIATION_FINDINGS"
          - "state_machines.SupportOrder.PENDING_DEVIATION_FINDINGS -> ENTERED"
          - "entities.SupportOrder.fields.deviation_applied"
        distinguishing_aspect: >
          The rule is written as an integer cross-multiplication - abs(requested -
          guideline) * 100 >= guideline * MIN_DEVIATION_PCT - and the boundary is
          probed one cent either side of it on the same order. A request of 67501 is
          7499 below the 75000 guideline and 749900 < 750000, so it is refused with
          a 422; a request of 67500 is exactly 7500 below and 750000 >= 750000, so
          it is accepted and the order moves to PENDING_DEVIATION_FINDINGS.
          Approving the findings then enters the order at the deviated 67500 rather
          than at the guideline figure.
        test_recipe:
          setup:
            - "Empty database. Clock pinned to 2026-08-01T00:00:00Z."
            - "CP 200000 and NCP 300000 VERIFIED_WAGE_RECORD, two children: combined 500000 is band 2, basic round_half_up(500000 * 0.25) == 125000, ratio 0.6000, guideline_monthly_cents 75000."
            - "The order is left in CALCULATED - guideline-calculation has run but entry has not."
            - "MIN_DEVIATION_PCT is 10, so the smallest acceptable absolute deviation is 7500."
            - "guideline-calculation is posted by user-cw-v11 so the findings can be approved by a different user, satisfying priority 13."
          setup_api_calls:
            - call: "POST /child-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /child-support/participants"
              payload: { role_type: "CUSTODIAL_PARTY", full_name: "Malia Thorsgaard", ssn_last4: "6227", residence_state_code: "MN", monthly_gross_income_cents: 200000, income_verification_source: "VERIFIED_WAGE_RECORD" }
              as: CaseWorker
              captures: { cpvb: "$.data.id" }
            - call: "POST /child-support/participants"
              payload: { role_type: "NONCUSTODIAL_PARTY", full_name: "Bjorn Thorsgaard", ssn_last4: "6228", residence_state_code: "MN", monthly_gross_income_cents: 300000, income_verification_source: "VERIFIED_WAGE_RECORD", supports_second_family: false, has_valid_drivers_license: true }
              as: CaseWorker
              captures: { ncpvb: "$.data.id" }
            - call: "POST /child-support/participants/${ncpvb}/locate-results"
              payload: { locate_outcome: "LOCATED" }
              as: CaseWorker
            - call: "POST /child-support/cases"
              payload: { case_type: "DIRECT_APPLICATION", custodial_party_id: "${cpvb}", noncustodial_party_id: "${ncpvb}", child_count: 2, tanf_assistance: false, good_cause_claim: false }
              as: CaseWorker
              captures: { casevb: "$.data.id" }
            - call: "POST /child-support/cases/${casevb}/paternity-actions"
              payload: { method: "PRESUMED_MARITAL" }
              as: CaseWorker
            - call: "POST /child-support/cases/${casevb}/orders"
              payload: { order_type: "CURRENT_SUPPORT", origin_state_code: "MN", effective_date: "2026-08-01" }
              as: CaseWorker
              captures: { ordervb: "$.data.id" }
            - call: "POST /child-support/orders/${ordervb}/guideline-calculation"
              payload: {}
              as: CaseWorker
              as_user_id: "user-cw-v11"
              captures: { vb_g: "$.data.guideline_monthly_cents", vb_st: "$.data.status", vb_by: "$.data.drafted_by_user_id" }
          trigger:
            - call: "POST /child-support/orders/${ordervb}/deviation-request"
              payload: { deviation_requested_cents: 67501, deviation_reason: "SHARED_PARENTING" }
              as: CaseWorker
              captures: { e_dev: "$.data.error_id" }
            - call: "GET /child-support/orders/${ordervb}"
              as: CaseWorker
              captures: { vb_st2: "$.data.status", vb_dev0: "$.data.deviation_requested_cents", vb_rej: "$.data.deviation_rejection_count" }
            - call: "POST /child-support/orders/${ordervb}/deviation-request"
              payload: { deviation_requested_cents: 67500, deviation_reason: "SHARED_PARENTING" }
              as: CaseWorker
              captures: { vb_st3: "$.data.status", vb_dev: "$.data.deviation_requested_cents", vb_reason: "$.data.deviation_reason" }
            - call: "POST /child-support/orders/${ordervb}/deviation-findings"
              payload: { decision: "APPROVE" }
              as: SupervisingAttorney
              as_user_id: "user-sa-v11"
              captures: { vb_st4: "$.data.status", vb_applied: "$.data.deviation_applied", vb_mon: "$.data.monthly_obligation_cents", vb_appr: "$.data.findings_approved_by_user_id" }
            - call: "GET /child-support/cases/${casevb}"
              as: CaseWorker
              captures: { vb_case: "$.data.case_status" }
          assert:
            - "${vb_g} == 75000 and ${vb_st} == CALCULATED and ${vb_by} == user-cw-v11"
            - "HTTP 422 and ${e_dev} == ERR_DEVIATION_BELOW_MIN_PCT  # abs(67501 - 75000) * 100 == 749900 and guideline * 10 == 750000, so the non-strict >= still fails"
            - "${vb_st2} == CALCULATED and ${vb_dev0} == null and ${vb_rej} == 0  # the refused request stored nothing"
            - "${vb_st3} == PENDING_DEVIATION_FINDINGS and ${vb_dev} == 67500 and ${vb_reason} == SHARED_PARENTING  # one cent lower clears the identical comparison at exact equality"
            - "${vb_st4} == ENTERED and ${vb_applied} == true and ${vb_mon} == 67500  # the deviated figure, not the 75000 guideline, becomes the obligation"
            - "${vb_appr} == user-sa-v11  # different from drafted_by_user_id, so priority 13 is satisfied"
            - "${vb_case} == ENFORCEMENT  # entry through the deviation path drives the same case transition as a straight entry"

      - name: two_rules_fire_on_one_compromise_request
        claim_type: priority_conflict
        grounds:
          - "validations[priority 9]"
          - "validations[priority 43]"
          - "errors[ERR_STALE_CASE_VERSION]"
          - "errors[ERR_ARREARS_BELOW_COMPROMISE_MINIMUM]"
        excluded_because:
          difficulty_instance: stale_case_version_beats_arrears_below_compromise_minimum
          rationale: >
            That instance builds a single POST /cases/{case_id}/compromise-offers
            request that simultaneously carries a stale expected_case_version and an
            arrears balance under MIN_COMPROMISE_ARREARS_CENTS, then re-runs it with
            the version corrected to show the 412 giving way to the 409. Repeating the
            same two-rule collision here would add no new coverage; the ordinary
            priority_ordering behaviour is covered above by
            invalid_action_status_outranks_the_enforcement_stay and by
            assigned_arrears_and_high_risk_each_block_a_compromise_offer.

  # ====================================================================
  # Table 5 - Endpoints. §1.5 declares 72 endpoints over 12 entities: 24 reads
  # (12 single-row, 12 filtered lists), 47 writes and the clock control. Five
  # of the six declared endpoint patterns are exercised below; there is no
  # bulk_action row because §1.5 declares no endpoint that accepts a
  # collection of ids, every write acting on exactly one target row.
  # ====================================================================
  - section: endpoints
    instances:

      - name: ledger_read_reports_both_interest_variants_and_mutates_nothing
        claim_type: computed_read
        grounds:
          - "endpoints[GET /child-support/cases/{case_id}/ledger]"
          - "calculations.arrears_interest_accrual.variants"
          - "entities.SupportCase.fields.interest_receivable_cents"
          - "entities.SupportCase.fields.unassigned_arrears_cents"
        distinguishing_aspect: >
          The ledger is the one endpoint that publishes BOTH interest variants for
          the same data in the same response, so a single read exposes the 750-cent
          divergence (1125 statutory versus 1875 aggregate) that every other
          endpoint shows only one side of. The optional as_of_date rewinds the
          computation without touching stored state - at 2026-09-20 the two variants
          agree at 375 - and the case version is identical before and after all
          three reads, so the endpoint is a pure function of stored rows plus the
          requested instant.
