            - { call: "POST /aip/grants/${grant}/amendments", payload: { added_scope_cost: 200000, reason: "B fresh", expected_grant_version: "${gv2}" }, as: SponsorStaff, captures: { amd_b: $.data.id } }
          assert:
            - "Stale create fails HTTP 412 with error_id == ERR_STALE_VERSION"
            - "Grant.${grant}.version advanced by exactly 1 per successful amendment create (gv2 == gv1 + 1)"
            - "GrantAmendment.${amd_a}.status == SUPERSEDED and GrantAmendment.${amd_b}.status == PENDING"

