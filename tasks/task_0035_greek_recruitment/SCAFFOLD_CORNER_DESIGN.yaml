scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:

      - name: corner_chapter_create_success_returns_201_with_initial_computed_fields
        claim_type: creation
        grounds:
          - entities.Chapter.fields.risk_status
          - entities.Chapter.fields.risk_points
          - entities.Chapter.fields.pledged_count
          - entities.Chapter.fields.legacy_pledged_count
        distinguishing_aspect: |
          Newly created Chapter has risk_status=GOOD_STANDING, risk_points=0,
          pledged_count=0, legacy_pledged_count=0, version=1 — every
          source: computed field initialized to its zero-input baseline per §1.1.
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /rush/chapters"
              payload: { name: "Omega-1", greek_type: "FRATERNITY", quota_total: 4, dues_per_member_cents: 12345, legacy_priority_slots: 2 }
              as: PanhellenicAdmin
              captures: { ch: "$.data.id" }
          assert:
            - "HTTP status 201."
            - "Chapter.${ch}.risk_status == 'GOOD_STANDING'."
            - "Chapter.${ch}.risk_points == 0."
            - "Chapter.${ch}.pledged_count == 0."
            - "Chapter.${ch}.legacy_pledged_count == 0."
            - "Chapter.${ch}.version == 1."
            - "Chapter.${ch}.dues_per_member_cents == 12345 (verbatim input)."

      - name: corner_pnm_is_legacy_computed_from_legacy_chapter_id
        claim_type: computed_fields
        grounds:
          - entities.PNM.fields.is_legacy
          - entities.PNM.fields.legacy_chapter_id
        distinguishing_aspect: |
          PNM.is_legacy is computed: true iff legacy_chapter_id is non-null.
          Two registrations — one with legacy_chapter_id set, one without —
          produce is_legacy=true and is_legacy=false respectively, with no
          client input directly setting is_legacy.
        test_recipe:
          setup:
            - "One Chapter exists to be the legacy reference."
          setup_api_calls:
            - call: "POST /rush/chapters"
              payload: { name: "LegacyHost", greek_type: "SORORITY", quota_total: 5, dues_per_member_cents: 10000, legacy_priority_slots: 1 }
              as: PanhellenicAdmin
              captures: { ch_l: "$.data.id" }
          trigger:
            - call: "POST /rush/pnms/register"
              payload: { full_name: "LegacyPnm", gpa: 3.20, legacy_chapter_id: "${ch_l}" }
              as: Anonymous
              captures: { p_yes: "$.data.id" }
            - call: "POST /rush/pnms/register"
              payload: { full_name: "PlainPnm", gpa: 3.20 }
              as: Anonymous
              captures: { p_no: "$.data.id" }
          assert:
            - "PNM ${p_yes}.is_legacy == true AND PNM ${p_yes}.legacy_chapter_id == ${ch_l}."
            - "PNM ${p_no}.is_legacy == false AND PNM ${p_no}.legacy_chapter_id == null."

      - name: corner_chapter_get_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_RESOURCE_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: |
          GET /rush/chapters/{id} for a non-existent UUID returns 404 with
          ERR_RESOURCE_NOT_FOUND per priority-3 existence validation.
        test_recipe:
          setup:
            - "No chapter with the queried id exists."
          setup_api_calls: []
          trigger:
            - call: "GET /rush/chapters/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PanhellenicAdmin
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP status 404."
            - "err_id == 'ERR_RESOURCE_NOT_FOUND'."

      - name: corner_pnm_register_invalid_gpa_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.PNM.fields.gpa
          - validations[priority=16]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          PNM.gpa is constrained to 0.00 <= gpa <= 4.00. Submitting 5.50
          returns 400 ERR_INVALID_REQUEST at priority 16 (validation
          ordering: this is a type/range violation, not the priority-15
          ERR_GPA_BELOW_MINIMUM gate which only fires on activate).
        test_recipe:
          setup:
            - "No prior PNM."
          setup_api_calls: []
          trigger:
            - call: "POST /rush/pnms/register"
              payload: { full_name: "BadGpa", gpa: 5.50 }
              as: Anonymous
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP status 400."
            - "err_id == 'ERR_INVALID_REQUEST'."

  # =========================================================================
  - section: state_machines
    instances:

      - name: corner_party_open_from_completed_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Party.SCHEDULED_to_OPEN
          - state_machines.Party.OPEN_to_COMPLETED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          POST /rush/parties/{id}/open on a Party in COMPLETED state is an
          invalid transition (not in the §1.2 transition list); priority-5
          state guard fires with ERR_INVALID_STATE; no side effects.
        test_recipe:
          setup:
            - "A Party hosted by a GOOD_STANDING chapter has progressed SCHEDULED -> OPEN -> COMPLETED."
          setup_api_calls:
            - call: "POST /rush/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PanhellenicAdmin
            - call: "POST /rush/chapters"
              payload: { name: "OpenFromCompleted", greek_type: "SORORITY", quota_total: 3, dues_per_member_cents: 10000, legacy_priority_slots: 0 }
              as: PanhellenicAdmin
              captures: { ch: "$.data.id" }
            - call: "POST /rush/rounds"
              payload: { cycle_label: "Fall 2026 ofc", bid_day_at: "2026-09-15T12:00:00Z" }
              as: PanhellenicAdmin
              captures: { rnd: "$.data.id" }
            - call: "POST /rush/parties"
              payload: { round_id: "${rnd}", chapter_id: "${ch}", scheduled_start_utc: "2026-09-05T18:00:00Z", duration_minutes: 60, capacity: 5 }
              as: ChapterOfficer
              as_user_id: "${ch}"
              captures: { pt: "$.data.id" }
            - call: "POST /rush/parties/${pt}/open"
              payload: {}
              as: ChapterOfficer
              as_user_id: "${ch}"
            - call: "POST /rush/parties/${pt}/complete"
              payload: {}
              as: ChapterOfficer
              as_user_id: "${ch}"
          trigger:
            - call: "POST /rush/parties/${pt}/open"
              payload: {}
              as: ChapterOfficer
              as_user_id: "${ch}"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP status 409."
            - "err_id == 'ERR_INVALID_STATE'."
            - "Party ${pt}.status == COMPLETED (unchanged)."

      - name: corner_bid_match_decline_idempotent_rejection_from_declined
        claim_type: idempotency
        grounds:
          - state_machines.BidMatch.PROPOSED_to_DECLINED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          A second POST /bid-matches/{id}/decline against an already-DECLINED
          bid is rejected with ERR_INVALID_STATE; the system does NOT silently
          accept the duplicate.
        test_recipe:
          setup:
            - "A bid exists in DECLINED status from a prior decline."
          setup_api_calls:
            - call: "POST /rush/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PanhellenicAdmin
            - call: "POST /rush/chapters"
              payload: { name: "IdemChap", greek_type: "FRATERNITY", quota_total: 3, dues_per_member_cents: 10000, legacy_priority_slots: 0 }
              as: PanhellenicAdmin
              captures: { ch: "$.data.id" }
            - call: "POST /rush/rounds"
              payload: { cycle_label: "Fall 2026 idem", bid_day_at: "2026-09-15T12:00:00Z" }
              as: PanhellenicAdmin
              captures: { rnd: "$.data.id" }
            - call: "POST /rush/pnms/register"
              payload: { full_name: "IdemP", gpa: 3.50 }
              as: Anonymous
              captures: { p: "$.data.id" }
            - call: "POST /rush/pnms/${p}/activate"
              payload: {}
              as: RecruitmentChair
            - call: "POST /rush/parties"
              payload: { round_id: "${rnd}", chapter_id: "${ch}", scheduled_start_utc: "2026-09-05T18:00:00Z", duration_minutes: 60, capacity: 5 }
              as: ChapterOfficer
              as_user_id: "${ch}"
              captures: { pt: "$.data.id" }
            - call: "POST /rush/parties/${pt}/open"
              payload: {}
              as: ChapterOfficer
              as_user_id: "${ch}"
            - call: "POST /rush/invitations"
              payload: { party_id: "${pt}", pnm_id: "${p}" }
              as: ChapterOfficer
              as_user_id: "${ch}"
              captures: { inv: "$.data.id" }
            - call: "POST /rush/invitations/${inv}/accept"
              payload: {}
              as: PNM
              as_user_id: "${p}"
            - call: "POST /rush/parties/${pt}/complete"
              payload: {}
              as: ChapterOfficer
              as_user_id: "${ch}"
            - call: "POST /rush/rounds/${rnd}/advance"
              payload: {}
              as: RecruitmentChair
            - call: "POST /rush/preferences"
              payload: { round_id: "${rnd}", side: "PNM_TO_CHAPTER", pnm_id: "${p}", chapter_id: "${ch}", rank: 1 }
              as: PNM
              as_user_id: "${p}"
            - call: "POST /rush/preferences"
              payload: { round_id: "${rnd}", side: "CHAPTER_TO_PNM", pnm_id: "${p}", chapter_id: "${ch}", rank: 1 }
              as: ChapterOfficer
              as_user_id: "${ch}"
            - call: "POST /rush/rounds/${rnd}/advance"
              payload: {}
              as: RecruitmentChair
            - call: "GET /rush/pnms/${p}/bid-matches"
              payload: {}
              as: PanhellenicAdmin
              captures: { bid: "$.data[0].id" }
            - call: "POST /rush/bid-matches/${bid}/decline"
              payload: {}
              as: PNM
              as_user_id: "${p}"
          trigger:
            - call: "POST /rush/bid-matches/${bid}/decline"
              payload: {}
              as: PNM
              as_user_id: "${p}"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP status 409."
            - "err_id == 'ERR_INVALID_STATE'."
            - "BidMatch ${bid}.status == DECLINED (unchanged)."

  # =========================================================================
  - section: calculations
    instances:

      - name: corner_dvc_dues_snapshot_already_covered
        claim_type: variant_divergence
        grounds:
          - calculations.bid_acceptance_dues_snapshot
        excluded_because:
          difficulty_instance: dvc_dues_snapshot_vs_live_at_read
          rationale: "Variant-divergence for dues snapshot is the §1.8 dual_variant_calc instance B — same test surface."

      - name: corner_mutual_select_waterfall_pnm_already_matched_excluded_from_other_chapter
        claim_type: input_set_filtering
        grounds:
          - calculations.mutual_selection_match
        distinguishing_aspect: |
          The matcher's standard_pass removes any PNM already matched in
          legacy_pass from all OTHER chapters' candidate sets. A legacy PNM
          ranked rank=1 by chapter C2 still ends up matched to its legacy
          chapter C1, not C2 — input-set filtering by mutation-during-traversal.
        test_recipe:
          setup:
            - "Chapter C1 with legacy_priority_slots=1, quota_total=2."
            - "Chapter C2 with legacy_priority_slots=0, quota_total=2."
            - "PNM L is a legacy of C1 and is also ranked rank=1 by C2."
            - "L files PNM_TO_CHAPTER ranks (C1=1, C2=2)."
            - "Round advanced into MUTUAL_SELECTION; necessary attendance and prefs filed."
          setup_api_calls:
            - call: "POST /rush/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PanhellenicAdmin
            - call: "POST /rush/chapters"
              payload: { name: "C1", greek_type: "SORORITY", quota_total: 2, dues_per_member_cents: 10000, legacy_priority_slots: 1 }
              as: PanhellenicAdmin
              captures: { c1: "$.data.id" }
            - call: "POST /rush/chapters"
              payload: { name: "C2", greek_type: "SORORITY", quota_total: 2, dues_per_member_cents: 10000, legacy_priority_slots: 0 }
              as: PanhellenicAdmin
              captures: { c2: "$.data.id" }
            - call: "POST /rush/rounds"
              payload: { cycle_label: "Fall 2026 mw", bid_day_at: "2026-09-15T12:00:00Z" }
              as: PanhellenicAdmin
              captures: { rnd: "$.data.id" }
            - call: "POST /rush/pnms/register"
              payload: { full_name: "LX", gpa: 3.50, legacy_chapter_id: "${c1}" }
              as: Anonymous
              captures: { lx: "$.data.id" }
            - call: "POST /rush/pnms/${lx}/activate"
              payload: {}
              as: RecruitmentChair
            - call: "POST /rush/parties"
              payload: { round_id: "${rnd}", chapter_id: "${c1}", scheduled_start_utc: "2026-09-05T18:00:00Z", duration_minutes: 60, capacity: 10 }
              as: ChapterOfficer
              as_user_id: "${c1}"
              captures: { p1: "$.data.id" }
            - call: "POST /rush/parties"
              payload: { round_id: "${rnd}", chapter_id: "${c2}", scheduled_start_utc: "2026-09-06T18:00:00Z", duration_minutes: 60, capacity: 10 }
              as: ChapterOfficer
              as_user_id: "${c2}"
              captures: { p2: "$.data.id" }
            - call: "POST /rush/parties/${p1}/open"
              payload: {}
              as: ChapterOfficer
              as_user_id: "${c1}"
            - call: "POST /rush/parties/${p2}/open"
              payload: {}
              as: ChapterOfficer
              as_user_id: "${c2}"
            - call: "POST /rush/invitations"
              payload: { party_id: "${p1}", pnm_id: "${lx}" }
              as: ChapterOfficer
              as_user_id: "${c1}"
              captures: { i1: "$.data.id" }
            - call: "POST /rush/invitations"
              payload: { party_id: "${p2}", pnm_id: "${lx}" }
              as: ChapterOfficer
              as_user_id: "${c2}"
              captures: { i2: "$.data.id" }
            - call: "POST /rush/invitations/${i1}/accept"
              payload: {}
              as: PNM
              as_user_id: "${lx}"
            - call: "POST /rush/invitations/${i2}/accept"
              payload: {}
              as: PNM
              as_user_id: "${lx}"
            - call: "POST /rush/parties/${p1}/complete"
              payload: {}
              as: ChapterOfficer
              as_user_id: "${c1}"
            - call: "POST /rush/parties/${p2}/complete"
              payload: {}
              as: ChapterOfficer
              as_user_id: "${c2}"
            - call: "POST /rush/rounds/${rnd}/advance"
              payload: {}
              as: RecruitmentChair
            - call: "POST /rush/preferences"
              payload: { round_id: "${rnd}", side: "PNM_TO_CHAPTER", pnm_id: "${lx}", chapter_id: "${c1}", rank: 1 }
              as: PNM
              as_user_id: "${lx}"
            - call: "POST /rush/preferences"
              payload: { round_id: "${rnd}", side: "PNM_TO_CHAPTER", pnm_id: "${lx}", chapter_id: "${c2}", rank: 2 }
              as: PNM
              as_user_id: "${lx}"
            - call: "POST /rush/preferences"
              payload: { round_id: "${rnd}", side: "CHAPTER_TO_PNM", pnm_id: "${lx}", chapter_id: "${c1}", rank: 1 }
              as: ChapterOfficer
              as_user_id: "${c1}"
            - call: "POST /rush/preferences"
              payload: { round_id: "${rnd}", side: "CHAPTER_TO_PNM", pnm_id: "${lx}", chapter_id: "${c2}", rank: 1 }
              as: ChapterOfficer
              as_user_id: "${c2}"
          trigger:
            - call: "POST /rush/rounds/${rnd}/advance"
              payload: {}
              as: RecruitmentChair
          assert:
            - "Exactly one BidMatch for pnm_id=${lx} exists."
            - "That BidMatch has chapter_id == ${c1} (legacy_pass matched first; input-set filtering removed ${lx} from C2's candidate set)."
            - "BidMatch.priority_kind == LEGACY."
            - "No BidMatch for chapter_id=${c2} targeting ${lx}."

      - name: corner_risk_status_at_suspend_threshold_exact_boundary
        claim_type: threshold_boundary
        grounds:
          - calculations.risk_status_from_points
        distinguishing_aspect: |
          risk_points == 15 (== SUSPEND_THRESHOLD) -> SUSPENDED (>= boundary,
          not >). Pairs with the §1.8 PROBATION_THRESHOLD boundary; this is
          the OTHER threshold endpoint exhibited as a corner.
        test_recipe:
          setup:
            - "Chapter at risk_points=14 (one ACTIVE incident severity_points=14)."
          setup_api_calls:
            - call: "POST /rush/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PanhellenicAdmin
            - call: "POST /rush/chapters"
              payload: { name: "SuspBoundary", greek_type: "FRATERNITY", quota_total: 3, dues_per_member_cents: 10000, legacy_priority_slots: 0 }
              as: PanhellenicAdmin
              captures: { ch: "$.data.id" }
            - call: "POST /rush/risk-incidents"
              payload: { chapter_id: "${ch}", severity_points: 10, reason: "x" }
              as: RiskOfficer
            - call: "POST /rush/risk-incidents"
              payload: { chapter_id: "${ch}", severity_points: 4, reason: "y" }
              as: RiskOfficer
            - call: "GET /rush/chapters/${ch}"
              payload: {}
              as: PanhellenicAdmin
              captures: { pre_status: "$.data.risk_status", pre_points: "$.data.risk_points" }
          trigger:
            - call: "POST /rush/risk-incidents"
              payload: { chapter_id: "${ch}", severity_points: 1, reason: "z" }
              as: RiskOfficer
          assert:
            - "pre_points == 14 AND pre_status == 'PROBATION' (14 < 15 SUSPEND_THRESHOLD; 14 >= 6 PROBATION_THRESHOLD)."
            - "After trigger: Chapter ${ch}.risk_points == 15."
            - "After trigger: Chapter ${ch}.risk_status == 'SUSPENDED' (boundary >= 15)."

  # =========================================================================
  - section: validations
    instances:

      - name: corner_pnm_activate_below_min_gpa
        claim_type: violation_to_error
        grounds:
          - validations[priority=15]
          - errors[ERR_GPA_BELOW_MINIMUM]
          - state_machines.PNM.REGISTERED_to_ACTIVE
        distinguishing_aspect: |
          PNM.gpa=2.49 attempts activate; priority-15 gate fires
          ERR_GPA_BELOW_MINIMUM (422), distinct from the priority-16
          range-typing ERR_INVALID_REQUEST.
        test_recipe:
          setup:
            - "PNM registered with gpa = 2.49."
          setup_api_calls:
            - call: "POST /rush/pnms/register"
              payload: { full_name: "LowGpa", gpa: 2.49 }
              as: Anonymous
              captures: { p: "$.data.id" }
          trigger:
            - call: "POST /rush/pnms/${p}/activate"
              payload: {}
              as: RecruitmentChair
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP status 422."
            - "err_id == 'ERR_GPA_BELOW_MINIMUM'."
            - "PNM ${p}.status == REGISTERED (no transition)."

      - name: corner_duplicate_invitation_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=14]
          - errors[ERR_DUPLICATE_INVITATION]
        distinguishing_aspect: |
          A second POST /rush/invitations with the same (party_id, pnm_id)
          returns 409 ERR_DUPLICATE_INVITATION; the first invitation row
          remains untouched.
        test_recipe:
          setup:
            - "A party with one INVITED PNM."
          setup_api_calls:
            - call: "POST /rush/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PanhellenicAdmin
            - call: "POST /rush/chapters"
              payload: { name: "DupInv", greek_type: "SORORITY", quota_total: 3, dues_per_member_cents: 10000, legacy_priority_slots: 0 }
              as: PanhellenicAdmin
              captures: { ch: "$.data.id" }
            - call: "POST /rush/rounds"
              payload: { cycle_label: "Fall 2026 dup", bid_day_at: "2026-09-15T12:00:00Z" }
              as: PanhellenicAdmin
              captures: { rnd: "$.data.id" }
            - call: "POST /rush/pnms/register"
              payload: { full_name: "DupP", gpa: 3.50 }
              as: Anonymous
              captures: { p: "$.data.id" }
            - call: "POST /rush/pnms/${p}/activate"
              payload: {}
              as: RecruitmentChair
            - call: "POST /rush/parties"
              payload: { round_id: "${rnd}", chapter_id: "${ch}", scheduled_start_utc: "2026-09-05T18:00:00Z", duration_minutes: 60, capacity: 10 }
              as: ChapterOfficer
              as_user_id: "${ch}"
              captures: { pt: "$.data.id" }
            - call: "POST /rush/invitations"
              payload: { party_id: "${pt}", pnm_id: "${p}" }
              as: ChapterOfficer
              as_user_id: "${ch}"
              captures: { i1: "$.data.id" }
          trigger:
            - call: "POST /rush/invitations"
              payload: { party_id: "${pt}", pnm_id: "${p}" }
              as: ChapterOfficer
              as_user_id: "${ch}"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP status 409."
            - "err_id == 'ERR_DUPLICATE_INVITATION'."

      - name: corner_chapter_double_book_overlap_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=9]
          - errors[ERR_CHAPTER_DOUBLE_BOOK]
        distinguishing_aspect: |
          A second Party on the same chapter whose interval overlaps an
          existing party is rejected with ERR_CHAPTER_DOUBLE_BOOK at priority
          9 — different from the priority-8 PNM ACCEPT conflict.
        test_recipe:
          setup:
            - "One Party scheduled 18:00-19:00 on chapter D."
          setup_api_calls:
            - call: "POST /rush/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PanhellenicAdmin
            - call: "POST /rush/chapters"
              payload: { name: "DblBook", greek_type: "SORORITY", quota_total: 3, dues_per_member_cents: 10000, legacy_priority_slots: 0 }
              as: PanhellenicAdmin
              captures: { ch: "$.data.id" }
            - call: "POST /rush/rounds"
              payload: { cycle_label: "Fall 2026 db", bid_day_at: "2026-09-15T12:00:00Z" }
              as: PanhellenicAdmin
              captures: { rnd: "$.data.id" }
            - call: "POST /rush/parties"
              payload: { round_id: "${rnd}", chapter_id: "${ch}", scheduled_start_utc: "2026-09-05T18:00:00Z", duration_minutes: 60, capacity: 10 }
              as: ChapterOfficer
              as_user_id: "${ch}"
              captures: { p1: "$.data.id" }
          trigger:
            - call: "POST /rush/parties"
              payload: { round_id: "${rnd}", chapter_id: "${ch}", scheduled_start_utc: "2026-09-05T18:30:00Z", duration_minutes: 60, capacity: 10 }
              as: ChapterOfficer
              as_user_id: "${ch}"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP status 409."
            - "err_id == 'ERR_CHAPTER_DOUBLE_BOOK'."

      - name: corner_preference_rank_taken_returns_conflict
        claim_type: violation_to_error
        grounds:
          - validations[priority=11]
          - errors[ERR_PREFERENCE_RANK_TAKEN]
        distinguishing_aspect: |
          Filing two PNM_TO_CHAPTER preferences for the same PNM with the
          same rank value in the same round is rejected with
          ERR_PREFERENCE_RANK_TAKEN; the first preference row remains intact.
        test_recipe:
          setup:
            - "Two chapters and one ACTIVE PNM with ATTENDED parties at both."
