            - "Officer.${inv_a_id}.open_case_load == 1, Officer.${inv_b_id}.open_case_load == 1, Officer.${inv_c_id}.open_case_load == 0 and Officer.${cmdr_id}.open_case_load == 0"

      - name: the_statute_and_the_event_clock_are_compared_non_strictly
        claim_type: Temporal validation
        grounds:
          - validations[priority=11]
          - errors.ERR_STATUTE_EXPIRED
          - errors.ERR_EVENT_IN_FUTURE
          - endpoints["POST /complaints"]
        distinguishing_aspect: |
          Both temporal guards on the intake side of the domain are non-strict, and each is tested
          from both sides of its own edge. An incident exactly STATUTE_DAYS old is still filable
          while one day older is refused, and an activity event whose occurred_at equals the
          logical clock is accepted while one second later is refused. Testing only the far side
          of either edge would pass an implementation that used a strict comparison.
        test_recipe:
          setup:
            - "The logical clock stands at 2026-08-01T00:00:00Z, so the statute edge sits exactly at 2025-08-01T00:00:00Z."
            - "One INTERNAL_AFFAIRS unit and one PATROL_DIVISION unit with intake_enabled true exist; Sergeant Doyle and Officer Vance are on the patrol roster and Vance has no activity events."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /units"
              payload: { name: "Internal Affairs", unit_role: "INTERNAL_AFFAIRS", command_code: "IA", peer_group_code: "PG_IA", sworn_headcount: 12, intake_enabled: true }
              as: SystemAdmin
              captures: { ia_unit_id: $.data.id }
            - call: "POST /units"
              payload: { name: "Patrol North", unit_role: "PATROL_DIVISION", command_code: "PN", peer_group_code: "PG_NORTH", sworn_headcount: 60, intake_enabled: true }
              as: SystemAdmin
              captures: { patrol_unit_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${patrol_unit_id}", badge_number: "PN-010", full_name: "Sergeant Doyle", rank: "SERGEANT", assignment_type: "PATROL", annual_salary_cents: 10500000, demographic_code: "DG_A", hire_date: "2012-02-02T00:00:00Z" }
              as: SystemAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${patrol_unit_id}", badge_number: "PN-501", full_name: "Officer Vance", rank: "OFFICER", assignment_type: "PATROL", annual_salary_cents: 9100013, demographic_code: "DG_C", hire_date: "2019-09-16T00:00:00Z" }
              as: SystemAdmin
              captures: { subj_id: $.data.id }
          trigger:
            - call: "POST /complaints"
              payload: { intake_channel: "SUPERVISOR", narrative: "Stale incident reported far too late.", incident_datetime: "2025-07-31T00:00:00Z", alleged_injury: false, reported_allegation_types: ["NEGLECT_OF_DUTY"], subject_unit_id: "${patrol_unit_id}", complainant_name: "Sergeant Doyle", complainant_contact: "doyle@dept.gov", reporting_supervisor_officer_id: "${sup_id}" }
              as: Supervisor
              as_user_id: "${sup_id}"
              captures: { err_statute: "$.data.error_id" }
            - call: "POST /complaints"
              payload: { intake_channel: "SUPERVISOR", narrative: "Incident exactly one year old.", incident_datetime: "2025-08-01T00:00:00Z", alleged_injury: false, reported_allegation_types: ["NEGLECT_OF_DUTY"], subject_unit_id: "${patrol_unit_id}", complainant_name: "Sergeant Doyle", complainant_contact: "doyle@dept.gov", reporting_supervisor_officer_id: "${sup_id}" }
              as: Supervisor
              as_user_id: "${sup_id}"
              captures: { edge_complaint_id: $.data.id }
            - call: "POST /officers/${subj_id}/activity-events"
              payload: { event_type: "SICK_LEAVE_DAY", severity_code: "NA", occurred_at: "2026-08-01T00:00:01Z", source_reference: "SL-FUTURE" }
              as: Supervisor
              as_user_id: "${sup_id}"
              captures: { err_future: "$.data.error_id" }
            - call: "POST /officers/${subj_id}/activity-events"
              payload: { event_type: "SICK_LEAVE_DAY", severity_code: "NA", occurred_at: "2026-08-01T00:00:00Z", source_reference: "SL-NOW" }
              as: Supervisor
              as_user_id: "${sup_id}"
              captures: { edge_event_id: $.data.id }
          assert:
            - "call 1: HTTP 422 with ${err_statute} == ERR_STATUTE_EXPIRED (366 whole days is outside the 365-day statute)"
            - "call 2: HTTP 201 with Complaint.${edge_complaint_id}.status == CLASSIFIED and received_at == 2026-08-01T00:00:00Z - the edge itself is inside the statute, and a SUPERVISOR-channel intake needs no screening"
            - "call 3: HTTP 422 with ${err_future} == ERR_EVENT_IN_FUTURE (one second after the logical clock)"
            - "call 4: HTTP 201 with OfficerActivityEvent.${edge_event_id}.occurred_at == 2026-08-01T00:00:00Z, base_weight == 1.0, weekday_index == 5 and system_generated == false"
            - "Officer.${subj_id}.eis_score == 2.50 and eis_alert_level == NONE - exactly one event was recorded, so the refused ingest wrote nothing"
            - "the refused complaint created no Complaint row: a listing filtered by subject_unit_id reports total 1"

      - name: a_plan_cannot_close_while_any_child_check_in_is_still_pending
        claim_type: Aggregate validation
        grounds:
          - validations[priority=10]
          - errors.ERR_PENDING_CHECKINS
          - endpoints["POST /intervention-plans/{id}/close"]
          - calculations.plan_compliance_score
        distinguishing_aspect: |
          The close guard is an aggregate over the plan's children rather than a field on the plan:
          it must scan every MonitoringCheckIn and refuse while even one is still PENDING. The
          test closes the gap one check-in at a time, so the same endpoint is refused with one
          pending child and accepted with none, and the refusal must not compute a partial
          compliance_score or a closed_at.
        test_recipe:
          setup:
            - "The logical clock starts at 2026-08-01T00:00:00Z."
            - "One PATROL_DIVISION unit holds Sergeant Doyle and Officer Bell; three USE_OF_FORCE LEVEL_3 events put Bell at eis_score 55.00, an EIS run promoted the alert to PLAN_REQUIRED, and an ACTIVE plan with required_checkin_count 2 and duration_days 30 has check-ins due 2026-08-11T00:00:00Z and 2026-08-21T00:00:00Z."
