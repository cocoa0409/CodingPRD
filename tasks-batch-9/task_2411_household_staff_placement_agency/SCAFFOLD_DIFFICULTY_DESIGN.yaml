      asserts:
      - the existing VERIFIED reference covers 2023-01..2023-12
      - the proposed row starts 2023-06, which is earlier than the prior reference's 2023-12 end (violates priority
        71) and overlaps seven months of it (violates priority 90)
      - the trigger returns 422 with error_id == ERR_REFERENCE_CHAIN_MISMATCH
      - error_id is not ERR_REFERENCE_PERIOD_OVERLAP
      - GET /candidates/${cand_id}/reference-checks still returns exactly one row and the candidate's reference_coverage_months
        is still 12
- rule_id: boundary_precision_check
  instances:
  - name: fee_band_floor_is_inclusive_and_the_ceiling_is_exclusive
    grounds: calculations.fee_percent_resolution (half-open bands [floor, ceiling)); validations.fee_band_no_overlap;
      state_machines.RoleRequisition.SCOPING -> SOURCING
    mechanism: 'Two touching ESTATE_MANAGER bands share the value 15000000: [0, 15000000) at 2000 bps and [15000000,
      30000000) at 2233 bps. A requisition at exactly 15000000 resolves to the upper band and a requisition one cent
      lower resolves to the lower band, so the boundary value belongs to the band whose floor it is.'
    naive_implementation: Treat both bounds as inclusive (the boundary value then matches two bands and the answer
      depends on insertion order) or both as exclusive (15000000 matches nothing).
    distinguishing_aspect: Compensation 15000000 stamps 2233 bps and provisional_fee_cents 3349500 while 14999999
      stamps 2000 bps and 3000000 - a 349500-cent step across a single cent of compensation.
    test_recipe:
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        as: AgencyPrincipal
        payload:
          current_utc: '2026-08-01T00:00:00Z'
      - call: POST /clients
        as: AgencyPrincipal
        payload:
          household_name: Kelmscott House
          primary_contact_email: ops@kelmscott.example
          region_code: NY
        captures:
          client_id: $.data.id
      - call: POST /clients/${client_id}/confidentiality-agreement
        as: Client
        payload:
          action: SIGN
          signatory_name: T. Kelmscott
      - call: POST /clients/${client_id}/confidentiality-agreement
        as: AgencyPrincipal
        payload:
          action: COUNTERSIGN
      - call: POST /fee-schedules
        as: AgencyPrincipal
        payload:
          role_type: ESTATE_MANAGER
          comp_band_floor_cents: 0
          comp_band_ceiling_cents: 15000000
          fee_percent_bps: 2000
          guarantee_window_days: 90
          effective_from: '2026-01-01'
        captures:
          band_low_id: $.data.id
      - call: POST /fee-schedules
        as: AgencyPrincipal
        payload:
          role_type: ESTATE_MANAGER
          comp_band_floor_cents: 15000000
          comp_band_ceiling_cents: 30000000
          fee_percent_bps: 2233
          guarantee_window_days: 90
          effective_from: '2026-01-01'
        captures:
          band_high_id: $.data.id
      - call: POST /role-requisitions
        as: PlacementConsultant
        payload:
          client_id: ${client_id}
          role_type: ESTATE_MANAGER
          first_year_compensation_cents: 14999999
          schedule_pattern: FIVE_TWO
          live_in_required: false
        captures:
          req_low_id: $.data.id
      - call: POST /role-requisitions/${req_low_id}/scope
        as: PlacementConsultant
        payload:
          scope_note: One cent under the band boundary.
      - call: POST /role-requisitions/${req_low_id}/finalize-scope
        as: PlacementConsultant
        payload:
          note: Scope agreed with the household.
        captures:
          low_bps: $.data.fee_percent_bps
          low_fee: $.data.provisional_fee_cents
          low_band: $.data.resolved_fee_schedule_id
      - call: POST /role-requisitions
        as: PlacementConsultant
        payload:
          client_id: ${client_id}
          role_type: ESTATE_MANAGER
          first_year_compensation_cents: 15000000
          schedule_pattern: FIVE_TWO
          live_in_required: false
        captures:
          req_high_id: $.data.id
      - call: POST /role-requisitions/${req_high_id}/scope
        as: PlacementConsultant
        payload:
          scope_note: Exactly on the band boundary.
      trigger:
      - call: POST /role-requisitions/${req_high_id}/finalize-scope
        as: PlacementConsultant
        payload:
          note: Scope agreed at the boundary figure.
      asserts:
      - the 14999999 requisition stamped fee_percent_bps == 2000, provisional_fee_cents == 3000000 (ROUND_HALF_UP
        of 2999999.8) and resolved_fee_schedule_id == ${band_low_id}
      - the trigger returns 200 with fee_percent_bps == 2233, provisional_fee_cents == 3349500 and resolved_fee_schedule_id
        == ${band_high_id}
      - guarantee_window_days == 90 on both requisitions
      - the two bands were both accepted at creation - touching at 15000000 is not an overlap under the half-open
        reading
      - status == SOURCING on both requisitions after their finalize-scope calls
  - name: screening_score_of_seventy_books_the_trial_and_sixtynine_is_refused
