          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-12-02T00:00:00Z" }, as: SystemAdmin }
            - { call: "GET /wetland-permits/monitoring-reports/${rep1_id}", as: Reviewer, as_user_id: "rev-1", captures: { rep1_status: "$.data.status" } }
            - { call: "GET /wetland-permits/permits/${perm_id}", as: Reviewer, as_user_id: "rev-1", captures: { perm_status: "$.data.status" } }
            - { call: "GET /wetland-permits/enforcement-cases?responsible_applicant_id=${ap_id}", as: Reviewer, as_user_id: "rev-1", captures: { case_src: "$.data[0].case_source", case_status: "$.data[0].case_status", case_fill: "$.data[0].unauthorized_fill_acres" } }
