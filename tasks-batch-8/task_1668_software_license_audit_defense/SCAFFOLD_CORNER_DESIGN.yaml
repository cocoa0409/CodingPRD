# =============================================================================
# §1.9 Scaffold Corner Design — Software License Audit Defense
# Breadth coverage of every testable §1.1–§1.7 claim not already covered by
# §1.8. Clock default: 2026-08-01T00:00:00Z. All recipes start from empty DB.
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: product_creation_auto_creates_license_position
        claim_type: creation
        grounds: [entities.LicensePosition, entities.LicensePosition.fields.gap_severity]
        distinguishing_aspect: "Creating a Product synthesizes exactly one LicensePosition row with zeroed quantities, COMPLIANT severity, SELF_AUDIT basis."
        test_recipe:
          setup: ["Vendor V exists"]
          setup_api_calls:
            - call: "POST /sam/vendors"
              payload: { name: "Vendor A", vendor_code: "VND-A", default_license_metric: "PER_INSTALL", notice_response_deadline_days: 30 }
              as: SAMPlatformAdmin
              captures: { v_id: $.data.id }
            - call: "POST /sam/products"
              payload: { vendor_id: "${v_id}", name: "Prod", license_metric: "PER_INSTALL", unit_list_price_cents: 10000, support_rate_pct: 0.22 }
              as: SAMPlatformAdmin
              captures: { p_id: $.data.id }
          trigger:
            - call: "GET /sam/products/${p_id}/license-positions"
              as: SAMManager
              captures: { pos: "$.data[0].id", basis: "$.data[0].position_basis", sev: "$.data[0].gap_severity", gap: "$.data[0].gap_quantity" }
          assert:
            - "exactly one LicensePosition exists for ${p_id}"
            - "gap == 0 and sev == COMPLIANT and basis == SELF_AUDIT"

      - name: vendor_default_response_deadline_applied
        claim_type: defaults
        grounds: [entities.Vendor.fields.notice_response_deadline_days, calculations.response_deadline]
        distinguishing_aspect: "Omitting notice_response_deadline_days defaults to 30, and the audit case deadline is computed as notice + 30 days."
        test_recipe:
          setup: ["Vendor created WITHOUT notice_response_deadline_days"]
          setup_api_calls:
            - call: "POST /sam/vendors"
              payload: { name: "Vendor A", vendor_code: "VND-A", default_license_metric: "PER_INSTALL" }
              as: SAMPlatformAdmin
              captures: { v_id: $.data.id, days: $.data.notice_response_deadline_days }
            - call: "POST /sam/audit-cases"
              payload: { vendor_id: "${v_id}", audit_firm_name: "AuditCo LLP", notice_received_on: "2026-08-01T00:00:00Z" }
              as: LegalCounsel
              captures: { case_id: $.data.id, deadline: $.data.response_deadline_on }
          trigger:
            - call: "GET /sam/audit-cases/${case_id}"
              as: LegalCounsel
          assert:
            - "days == 30"
            - "deadline == 2026-08-31T00:00:00Z (notice 2026-08-01 + 30 days)"

      - name: product_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_PRODUCT_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but unknown product UUID returns ERR_PRODUCT_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /sam/products/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: SAMManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_PRODUCT_NOT_FOUND"

      - name: entitlement_create_missing_quantity_returns_invalid_request
        claim_type: required_fields
        grounds: ["validations[priority=3]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required field quantity on entitlement create is rejected with ERR_INVALID_REQUEST (400) before any business rule runs."
        test_recipe:
          setup: ["Vendor + product exist"]
          setup_api_calls:
            - call: "POST /sam/vendors"
              payload: { name: "Vendor A", vendor_code: "VND-A", default_license_metric: "PER_INSTALL" }
              as: SAMPlatformAdmin
              captures: { v_id: $.data.id }
            - call: "POST /sam/products"
              payload: { vendor_id: "${v_id}", name: "Prod", license_metric: "PER_INSTALL", unit_list_price_cents: 10000, support_rate_pct: 0.22 }
              as: SAMPlatformAdmin
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /sam/entitlements"
              payload: { product_id: "${p_id}", purchase_order_number: "PO-X", coverage_class: "PRODUCTION", effective_from: "2026-01-01T00:00:00Z", source: "MANUAL_IMPORT" }
              as: SAMManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: deployment_create_invalid_environment_enum
        claim_type: type_constraints
        grounds: ["validations[priority=3]", entities.DeploymentRecord.fields.environment]
        distinguishing_aspect: "environment 'STAGING' is not in {PRODUCTION, NON_PRODUCTION} and is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Vendor + product exist"]
          setup_api_calls:
            - call: "POST /sam/vendors"
              payload: { name: "Vendor A", vendor_code: "VND-A", default_license_metric: "PER_INSTALL" }
              as: SAMPlatformAdmin
              captures: { v_id: $.data.id }
            - call: "POST /sam/products"
              payload: { vendor_id: "${v_id}", name: "Prod", license_metric: "PER_INSTALL", unit_list_price_cents: 10000, support_rate_pct: 0.22 }
              as: SAMPlatformAdmin
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /sam/deployments"
              payload: { product_id: "${p_id}", measured_quantity: 5, environment: "STAGING", measurement_method: "SCAN", measured_on: "2026-07-15T00:00:00Z" }
              as: ITAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: vendor_create_client_supplied_id_input_ignored
        claim_type: system_fields
        grounds: ["validations[priority=3]"]
        distinguishing_aspect: "Client-supplied id/version fields are ignored (not rejected); the server mints its own UUID id and version starts at 1."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /sam/vendors"
              payload: { name: "Vendor A", vendor_code: "VND-A", default_license_metric: "PER_INSTALL", id: "11111111-1111-1111-1111-111111111111", version: 99 }
              as: SAMPlatformAdmin
              captures: { new_id: $.data.id, new_v: $.data.version }
          assert:
            - "new_id != 11111111-1111-1111-1111-111111111111 (server-minted UUID)"
            - "new_v == 1"

      - name: entitlement_active_immediately_when_effective_from_passed
        claim_type: computed_fields
        grounds: [state_machines.EntitlementRecord.create_to_ACTIVE, calculations.entitled_quantity]
        distinguishing_aspect: "An entitlement with effective_from in the past is created directly ACTIVE and immediately contributes to entitled_quantity."
        test_recipe:
          setup: ["Vendor + product exist"]
          setup_api_calls:
            - call: "POST /sam/vendors"
              payload: { name: "Vendor A", vendor_code: "VND-A", default_license_metric: "PER_INSTALL" }
              as: SAMPlatformAdmin
              captures: { v_id: $.data.id }
            - call: "POST /sam/products"
              payload: { vendor_id: "${v_id}", name: "Prod", license_metric: "PER_INSTALL", unit_list_price_cents: 10000, support_rate_pct: 0.22 }
              as: SAMPlatformAdmin
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /sam/entitlements"
              payload: { product_id: "${p_id}", purchase_order_number: "PO-1", quantity: 40, coverage_class: "PRODUCTION", effective_from: "2026-01-01T00:00:00Z", source: "MANUAL_IMPORT" }
              as: SAMManager
              captures: { e_id: $.data.id, e_status: $.data.status }
            - call: "GET /sam/products/${p_id}/license-positions"
              as: SAMManager
              captures: { entitled: "$.data[0].entitled_quantity" }
          assert:
            - "e_status == ACTIVE"
            - "entitled == 40"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: deployment_confirm_twice_rejected
        claim_type: invalid_transition
        grounds: [state_machines.DeploymentRecord.REPORTED_to_CONFIRMED, "errors[ERR_DEPLOYMENT_INVALID_STATE]"]
        distinguishing_aspect: "Second confirm of an already-CONFIRMED deployment is rejected; the confirm is not idempotent and no double-count occurs."
        test_recipe:
          setup: ["Product with one CONFIRMED deployment of 10 units; position deployed_quantity == 10"]
          setup_api_calls:
            - call: "POST /sam/vendors"
              payload: { name: "Vendor A", vendor_code: "VND-A", default_license_metric: "PER_INSTALL" }
              as: SAMPlatformAdmin
              captures: { v_id: $.data.id }
            - call: "POST /sam/products"
              payload: { vendor_id: "${v_id}", name: "Prod", license_metric: "PER_INSTALL", unit_list_price_cents: 10000, support_rate_pct: 0.22 }
              as: SAMPlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /sam/deployments"
              payload: { product_id: "${p_id}", measured_quantity: 10, environment: "PRODUCTION", measurement_method: "SCAN", measured_on: "2026-07-15T00:00:00Z" }
              as: ITAnalyst
              captures: { d_id: $.data.id }
            - call: "POST /sam/deployments/${d_id}/confirm"
              payload: {}
              as: SAMManager
          trigger:
            - call: "POST /sam/deployments/${d_id}/confirm"
              payload: {}
              as: SAMManager
              captures: { err: $.data.error_id }
            - call: "GET /sam/products/${p_id}/license-positions"
              as: SAMManager
              captures: { dep_qty: "$.data[0].deployed_quantity" }
          assert:
            - "err == ERR_DEPLOYMENT_INVALID_STATE"
            - "dep_qty == 10 (no double count from the rejected second confirm)"

      - name: deployment_reject_is_terminal
        claim_type: terminal_state_lockdown
        grounds: [state_machines.DeploymentRecord.REPORTED_to_REJECTED]
        distinguishing_aspect: "A REJECTED deployment accepts no further transitions: confirm afterwards fails with ERR_DEPLOYMENT_INVALID_STATE."
        test_recipe:
          setup: ["Product with one deployment in REPORTED, then rejected"]
          setup_api_calls:
            - call: "POST /sam/vendors"
              payload: { name: "Vendor A", vendor_code: "VND-A", default_license_metric: "PER_INSTALL" }
              as: SAMPlatformAdmin
              captures: { v_id: $.data.id }
            - call: "POST /sam/products"
              payload: { vendor_id: "${v_id}", name: "Prod", license_metric: "PER_INSTALL", unit_list_price_cents: 10000, support_rate_pct: 0.22 }
              as: SAMPlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /sam/deployments"
              payload: { product_id: "${p_id}", measured_quantity: 10, environment: "PRODUCTION", measurement_method: "SCAN", measured_on: "2026-07-15T00:00:00Z" }
              as: ITAnalyst
              captures: { d_id: $.data.id }
            - call: "POST /sam/deployments/${d_id}/reject"
              payload: { rejection_reason: "duplicate scan row" }
              as: SAMManager
              captures: { st: $.data.status }
          trigger:
            - call: "POST /sam/deployments/${d_id}/confirm"
              payload: {}
              as: SAMManager
              captures: { err: $.data.error_id }
          assert:
            - "st == REJECTED"
            - "err == ERR_DEPLOYMENT_INVALID_STATE"

      - name: case_withdraw_then_advance_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.AuditCase._any_non-terminal__to_WITHDRAWN, "errors[ERR_AUDIT_CASE_INVALID_STATE]"]
        distinguishing_aspect: "A WITHDRAWN audit case is terminal: any later advance is rejected with ERR_AUDIT_CASE_INVALID_STATE."
        test_recipe:
          setup: ["Case in NOTICE_RECEIVED, then withdrawn by the vendor"]
          setup_api_calls:
            - call: "POST /sam/vendors"
              payload: { name: "Vendor A", vendor_code: "VND-A", default_license_metric: "PER_INSTALL" }
              as: SAMPlatformAdmin
              captures: { v_id: $.data.id }
            - call: "POST /sam/audit-cases"
              payload: { vendor_id: "${v_id}", audit_firm_name: "AuditCo LLP", notice_received_on: "2026-08-01T00:00:00Z" }
              as: LegalCounsel
              captures: { case_id: $.data.id }
            - call: "POST /sam/audit-cases/${case_id}/withdraw"
              payload: {}
              as: VendorAuditor
              captures: { st: $.data.status }
          trigger:
            - call: "POST /sam/audit-cases/${case_id}/advance"
              payload: { to_state: "SCOPE_NEGOTIATION" }
              as: LegalCounsel
              captures: { err: $.data.error_id }
          assert:
            - "st == WITHDRAWN"
            - "err == ERR_AUDIT_CASE_INVALID_STATE"

      - name: remediation_cancel_after_complete_rejected
        claim_type: invalid_transition
        grounds: [state_machines.RemediationAction.IN_PROGRESS_to_COMPLETED, "errors[ERR_REMEDIATION_INVALID_STATE]"]
        distinguishing_aspect: "CANCELLED is only reachable from PLANNED/IN_PROGRESS; cancelling a COMPLETED remediation fails (the compensation path is fail-verification, not cancel)."
        test_recipe:
          setup: ["Product entitled 10 deployed 12 CONFIRMED (gap 2); PURCHASE_TRUE_UP remediation qty 2 completed"]
          setup_api_calls:
            - call: "POST /sam/vendors"
              payload: { name: "Vendor A", vendor_code: "VND-A", default_license_metric: "PER_INSTALL" }
              as: SAMPlatformAdmin
              captures: { v_id: $.data.id }
            - call: "POST /sam/products"
              payload: { vendor_id: "${v_id}", name: "Prod", license_metric: "PER_INSTALL", unit_list_price_cents: 10000, support_rate_pct: 0.22 }
              as: SAMPlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /sam/entitlements"
              payload: { product_id: "${p_id}", purchase_order_number: "PO-1", quantity: 10, coverage_class: "PRODUCTION", effective_from: "2026-01-01T00:00:00Z", source: "MANUAL_IMPORT" }
              as: SAMManager
            - call: "POST /sam/deployments"
              payload: { product_id: "${p_id}", measured_quantity: 12, environment: "PRODUCTION", measurement_method: "SCAN", measured_on: "2026-07-15T00:00:00Z" }
              as: ITAnalyst
              captures: { d1: $.data.id }
            - call: "POST /sam/deployments/${d1}/confirm"
              payload: {}
              as: SAMManager
            - call: "POST /sam/remediation-actions"
              payload: { product_id: "${p_id}", action_type: "PURCHASE_TRUE_UP", quantity: 2 }
              as: SAMManager
              captures: { ra: $.data.id }
            - call: "POST /sam/remediation-actions/${ra}/start"
              payload: {}
              as: SAMManager
            - call: "POST /sam/remediation-actions/${ra}/complete"
              payload: {}
              as: SAMManager
          trigger:
            - call: "POST /sam/remediation-actions/${ra}/cancel"
              payload: {}
              as: SAMManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_REMEDIATION_INVALID_STATE"

      - name: alert_suppress_twice_rejected
        claim_type: invalid_transition
        grounds: [state_machines.MonitoringAlert.OPEN_to_SUPPRESSED, "errors[ERR_ALERT_INVALID_STATE]"]
        distinguishing_aspect: "Suppress requires OPEN; a second suppress on the SUPPRESSED alert fails with ERR_ALERT_INVALID_STATE."
        test_recipe:
          setup: ["Product entitled 10 deployed 12 CONFIRMED; OVER_DEPLOYMENT alert OPEN, then suppressed"]
          setup_api_calls:
            - call: "POST /sam/vendors"
              payload: { name: "Vendor A", vendor_code: "VND-A", default_license_metric: "PER_INSTALL" }
              as: SAMPlatformAdmin
              captures: { v_id: $.data.id }
            - call: "POST /sam/products"
              payload: { vendor_id: "${v_id}", name: "Prod", license_metric: "PER_INSTALL", unit_list_price_cents: 10000, support_rate_pct: 0.22 }
              as: SAMPlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /sam/entitlements"
              payload: { product_id: "${p_id}", purchase_order_number: "PO-1", quantity: 10, coverage_class: "PRODUCTION", effective_from: "2026-01-01T00:00:00Z", source: "MANUAL_IMPORT" }
              as: SAMManager
            - call: "POST /sam/deployments"
              payload: { product_id: "${p_id}", measured_quantity: 12, environment: "PRODUCTION", measurement_method: "SCAN", measured_on: "2026-07-15T00:00:00Z" }
              as: ITAnalyst
              captures: { d1: $.data.id }
            - call: "POST /sam/deployments/${d1}/confirm"
              payload: {}
              as: SAMManager
            - call: "GET /sam/products/${p_id}/monitoring-alerts"
              as: SAMManager
              captures: { a1: "$.data[0].id" }
            - call: "POST /sam/monitoring-alerts/${a1}/suppress"
              payload: { suppression_reason: "order placed" }
              as: SAMManager
          trigger:
            - call: "POST /sam/monitoring-alerts/${a1}/suppress"
              payload: { suppression_reason: "second attempt" }
              as: SAMManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_ALERT_INVALID_STATE"

      - name: entitlement_void_twice_rejected
        claim_type: invalid_transition
        grounds: [state_machines.EntitlementRecord.ACTIVE_to_VOID, "errors[ERR_ENTITLEMENT_INVALID_STATE]"]
        distinguishing_aspect: "Void is terminal for the record; a second void fails with ERR_ENTITLEMENT_INVALID_STATE and the position is not debited twice."
        test_recipe:
          setup: ["Product with one ACTIVE entitlement of 40 units, then voided"]
          setup_api_calls:
            - call: "POST /sam/vendors"
              payload: { name: "Vendor A", vendor_code: "VND-A", default_license_metric: "PER_INSTALL" }
              as: SAMPlatformAdmin
              captures: { v_id: $.data.id }
            - call: "POST /sam/products"
              payload: { vendor_id: "${v_id}", name: "Prod", license_metric: "PER_INSTALL", unit_list_price_cents: 10000, support_rate_pct: 0.22 }
              as: SAMPlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /sam/entitlements"
              payload: { product_id: "${p_id}", purchase_order_number: "PO-1", quantity: 40, coverage_class: "PRODUCTION", effective_from: "2026-01-01T00:00:00Z", source: "MANUAL_IMPORT" }
              as: SAMManager
              captures: { e_id: $.data.id }
            - call: "POST /sam/entitlements/${e_id}/void"
              payload: {}
              as: SAMManager
              captures: { st: $.data.status }
          trigger:
            - call: "POST /sam/entitlements/${e_id}/void"
              payload: {}
              as: SAMManager
              captures: { err: $.data.error_id }
            - call: "GET /sam/products/${p_id}/license-positions"
              as: SAMManager
              captures: { entitled: "$.data[0].entitled_quantity" }
          assert:
            - "st == VOID"
            - "err == ERR_ENTITLEMENT_INVALID_STATE"
            - "entitled == 0 (single debit only)"

      - name: superseded_offer_cannot_be_accepted
        claim_type: invalid_transition
        grounds: [state_machines.SettlementOffer.TENDERED_to_SUPERSEDED, "errors[ERR_OFFER_INVALID_STATE]"]
        distinguishing_aspect: "Once a newer offer supersedes the pending one, accepting the SUPERSEDED offer fails with ERR_OFFER_INVALID_STATE."
        test_recipe:
          setup:
            - "Full audit flow to SETTLEMENT_NEGOTIATION: product entitled 50 deployed 60 (worst case 70000 after finding), case version captured"
            - "Offer O1 (CUSTOMER, 50000) tendered; offer O2 (VENDOR, 65000) tendered with the fresh case version, superseding O1"
          setup_api_calls:
            - call: "POST /sam/vendors"
              payload: { name: "Vendor A", vendor_code: "VND-A", default_license_metric: "PER_USER", notice_response_deadline_days: 30 }
              as: SAMPlatformAdmin
              captures: { v_id: $.data.id }
            - call: "POST /sam/products"
              payload: { vendor_id: "${v_id}", name: "Prod", license_metric: "PER_USER", unit_list_price_cents: 5000, support_rate_pct: 0.2 }
              as: SAMPlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /sam/entitlements"
              payload: { product_id: "${p_id}", purchase_order_number: "PO-1", quantity: 50, coverage_class: "PRODUCTION", effective_from: "2026-01-01T00:00:00Z", source: "MANUAL_IMPORT" }
              as: SAMManager
            - call: "POST /sam/deployments"
              payload: { product_id: "${p_id}", measured_quantity: 60, environment: "PRODUCTION", measurement_method: "SCAN", measured_on: "2026-07-15T00:00:00Z" }
              as: ITAnalyst
              captures: { d1: $.data.id }
            - call: "POST /sam/deployments/${d1}/confirm"
              payload: {}
              as: SAMManager
            - call: "POST /sam/audit-cases"
              payload: { vendor_id: "${v_id}", audit_firm_name: "AuditCo LLP", notice_received_on: "2026-08-01T00:00:00Z" }
              as: LegalCounsel
              captures: { case_id: $.data.id }
            - call: "POST /sam/audit-cases/${case_id}/advance"
              payload: { to_state: "SCOPE_NEGOTIATION" }
              as: LegalCounsel
            - call: "POST /sam/audit-scope-items"
              payload: { audit_case_id: "${case_id}", product_id: "${p_id}", inclusion_rationale: "in scope" }
              as: VendorAuditor
              captures: { si: $.data.id }
            - call: "POST /sam/audit-scope-items/${si}/confirm"
              payload: {}
              as: LegalCounsel
            - call: "POST /sam/audit-cases/${case_id}/advance"
              payload: { to_state: "EVIDENCE_COLLECTION" }
              as: LegalCounsel
            - call: "POST /sam/data-submissions"
              payload: { audit_case_id: "${case_id}", submission_label: "extract", covered_scope_item_ids: ["${si}"] }
              as: SAMManager
              as_user_id: "sam-mgr-1"
              captures: { sub: $.data.id }
            - call: "POST /sam/data-submissions/${sub}/submit-for-review"
              payload: {}
              as: SAMManager
            - call: "POST /sam/data-submissions/${sub}/approve"
              payload: {}
              as: LegalCounsel
              as_user_id: "counsel-1"
            - call: "POST /sam/data-submissions/${sub}/release"
              payload: {}
              as: LegalCounsel
              as_user_id: "counsel-1"
            - call: "POST /sam/audit-cases/${case_id}/advance"
              payload: { to_state: "FINDINGS_REVIEW" }
              as: LegalCounsel
            - call: "POST /sam/audit-scope-items/${si}/vendor-finding"
              payload: {}
              as: VendorAuditor
            - call: "POST /sam/audit-cases/${case_id}/advance"
              payload: { to_state: "SETTLEMENT_NEGOTIATION" }
              as: LegalCounsel
            - call: "GET /sam/audit-cases/${case_id}"
              as: LegalCounsel
              captures: { cv1: $.data.version }
            - call: "POST /sam/settlement-offers"
              payload: { audit_case_id: "${case_id}", offered_by: "CUSTOMER", amount_cents: 50000, expected_audit_case_version: "${cv1}" }
              as: ProcurementLead
              as_user_id: "proc-1"
              captures: { o1: $.data.id }
            - call: "GET /sam/audit-cases/${case_id}"
              as: LegalCounsel
              captures: { cv2: $.data.version }
            - call: "POST /sam/settlement-offers"
              payload: { audit_case_id: "${case_id}", offered_by: "VENDOR", amount_cents: 65000, expected_audit_case_version: "${cv2}" }
              as: VendorAuditor
              as_user_id: "aud-1"
              captures: { o2: $.data.id, o2_sup: $.data.supersedes_offer_id }
          trigger:
            - call: "POST /sam/settlement-offers/${o1}/accept"
              payload: {}
              as: VendorAuditor
              as_user_id: "aud-9"
              captures: { err: $.data.error_id }
          assert:
            - "o2_sup == o1 (chain link recorded on the newer offer)"
            - "err == ERR_OFFER_INVALID_STATE (O1 is SUPERSEDED; acceptor role VendorAuditor is correct for a CUSTOMER offer, so the state error is what fires)"

      - name: case_reopen_evidence_cycle
        claim_type: valid_transition
