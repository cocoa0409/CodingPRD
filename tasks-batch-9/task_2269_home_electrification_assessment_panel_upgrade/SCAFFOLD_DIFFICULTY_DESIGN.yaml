          Non-linearity on the ProjectMeasure aggregate, which is PARALLEL
          rather than cyclic-with-a-counter: two independent state dimensions
          advance on different triggers (install_status on the installation
          report, verification_status on the inspection result) and the
          verification dimension additionally loops REJECTED -> PENDING on
