  - rule_id: non_linear_state_machine
    instances:
      - name: application_return_resubmit_cycle
        grounds:
          - state_machines.GrantApplication.UNDER_REVIEW_to_RETURNED
          - state_machines.GrantApplication.RETURNED_to_UNDER_REVIEW
        distinguishing_aspect: |
          GrantApplication is cyclic with a branch: UNDER_REVIEW -> RETURNED -> (resubmit) ->
          UNDER_REVIEW loops the revision cycle, and the same UNDER_REVIEW node forks to
          OFFERED -> {ACCEPTED, DECLINED}; the loop is observable via status plus version drift.
        test_recipe:
          setup:
            - "Program ACCEPTED with one SELECTED project; application with all assurances certified, submitted once (UNDER_REVIEW, version 2)"
          setup_api_calls:
            - { call: "POST /aip/sponsors", payload: { sponsor_name: "Sponsor A", loc_id: "ZXY", airport_size_tier: "SMALL_HUB", npe_entitlement_total: 5000000 }, as: FAAManager, captures: { sp: $.data.id } }
