            - "EquipmentOrder.${order_early_id}: subtotal_cents == 42500, subsidy_cents == 0, net_equipment_cents == 42500, handling_fee_cents == 0, total_due_cents == 42500"
            - "the second place is 200, status == PLACED, and all five money fields are byte-identical to the DRAFT snapshot (subsidy_cents still 0)"
            - "EquipmentOrder.${order_late_id}: subtotal_cents == 42500, subsidy_cents == 42500, net_equipment_cents == 0, handling_fee_cents == 0, total_due_cents == 0"

      - name: terminal_deployment_links_store_and_terminal_and_needs_both_to_exist
