            - { call: "PATCH /licensing/license-agreements/${agr_id}", payload: { royalty_basis: "CASH", expected_agreement_version: "${agr_v1}" }, as: BrandProgramAdmin, captures: { err: $.data.error_id } }
            - { call: "GET /licensing/license-agreements/${agr_id}", payload: {}, as: BrandProgramAdmin, captures: { agr_v_now: $.data.version } }
            - { call: "PATCH /licensing/license-agreements/${agr_id}", payload: { royalty_basis: "CASH", expected_agreement_version: "${agr_v_now}" }, as: BrandProgramAdmin, captures: { basis_after: $.data.royalty_basis, v_after: $.data.version } }
