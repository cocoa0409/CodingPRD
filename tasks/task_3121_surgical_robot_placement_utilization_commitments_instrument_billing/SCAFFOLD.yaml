  - { id: ERR_INSUFFICIENT_UTILISATION_CREDIT, http: 402, condition: "Source account remaining credit units are below the requested procedure units" }
  - { id: ERR_IDN_POOL_SATURATED, http: 402, condition: "Aggregate utilisation reaches the IDN pool ceiling of 25 units" }
  - { id: ERR_PLACEMENT_CAP_EXCEEDED, http: 402, condition: "Submitting would push the account's non-terminal agreement count above placement_cap" }
  - { id: ERR_AGREEMENT_TERMS_INCOMPLETE, http: 422, condition: "Commercial term required by the arrangement type is absent or non-positive" }
  - { id: ERR_ACCEPTANCE_WINDOW_EXPIRED, http: 409, condition: "Acceptance attempted at or after acceptance_expires_utc" }
  - { id: ERR_CONTRACT_TEMPORALLY_INVALID, http: 422, condition: "Contract start precedes the system's installation instant, or the end is not strictly later than the start" }
  - { id: ERR_CONTRACT_TIER_UNRECOGNIZED, http: 422, condition: "Coverage tier does not map into the response-time ladder" }
  - { id: ERR_SERVICE_CONTRACT_REQUIRED, http: 409, condition: "Commission or restore-service attempted with no ACTIVE in-window ServiceContract on the system" }
  - { id: ERR_DEPLOYMENT_WINDOW_INVALID, http: 422, condition: "Deployment maintenance window starts before the deployment creation instant" }
  - { id: ERR_RELEASE_DOWNGRADE, http: 409, condition: "Deployment targets a release index not strictly above the system's installed index" }
  - { id: ERR_RELEASE_CONFIGURATION_MISMATCH, http: 409, condition: "Release belongs to a different system configuration than the target system" }
  - { id: ERR_DUPLICATE_SERIAL_NUMBER, http: 409, condition: "System serial number already used by another RobotSystem" }
  - { id: ERR_DUPLICATE_SITE_CODE, http: 409, condition: "site_code already used within the hospital account" }
  - { id: ERR_DUPLICATE_SURGEON_NPI, http: 409, condition: "surgeon_npi already used within the hospital account" }
  - { id: ERR_INVALID_WINDOW, http: 400, condition: "Declared window end is not strictly later than its start" }
  - { id: ERR_BULK_SCOPE_VIOLATION, http: 403, condition: "Bulk completion names a system outside the acting account identity's scope" }
  - { id: ERR_SURGEON_NOT_CREDENTIALED, http: 409, condition: "A procedure case names a training record whose training_path_eligibility step 5 (credential_valid) is false" }
  - { id: ERR_OWNERSHIP_MISMATCH, http: 403, condition: "An entity_backed role acts on a resource whose owning foreign key is not the acting identity" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version differs from the parent's current version" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:

  - name: PlatformAdmin
    description: "Manufacturer platform operator; owns configuration catalogs, ops runs, the logical clock, account closure and atomic test-driving surface"
    identity: opaque
    exclusive_operations:
      - "POST /api/system-configurations, PUT /api/system-configurations/{configId}"
      - "POST /api/system-configurations/{configId}/releases"
      - "POST /api/month-close/runs"
      - "POST /api/accounts/{accountId}/close"
      - "POST /api/_clock/set_current_utc"
      - "POST /api/placement-agreements/{agreementId}/suspend, POST /api/placement-agreements/{agreementId}/terminate"
      - "POST /api/robot-systems/{systemId}/decommission"
    shared_operations:
      - "GET reads across every collection"

  - name: RegionalSalesDirector
    description: "Commercial owner of a region; opens accounts, drafts agreements and owns system expansion planning"
    identity: opaque
    exclusive_operations:
      - "POST /api/accounts"
      - "POST /api/households/{accountId}/reactivate"
      - "POST /api/placement-agreements"
      - "POST /api/expansion-reviews"
      - "POST /api/placement-agreements/{agreementId}/reinstate"
      - "POST /api/training-records/{recordId}/begin-proctoring"
    shared_operations:
      - "GET reads across accounts, agreements, systems and expansion reviews in the role's own region_code"

  - name: ClinicalOperationsLead
    description: "Clinical readiness owner; submits site-readiness verdicts, drives installation and owns the surgeon training pathway"
    identity: opaque
    exclusive_operations:
      - "POST /api/accounts/{accountId}/readiness-reviews"
      - "POST /api/account-readiness-reviews/{reviewId}/submit-verdict"
      - "POST /api/account-readiness-reviews/{reviewId}/reject"
      - "POST /api/account-readiness-reviews/{reviewId}/return-to-review"
      - "POST /api/account-readiness-reviews/{reviewId}/readiness-checks"
      - "POST /api/robot-systems/{systemId}/install, POST /api/robot-systems/{systemId}/commission"
      - "POST /api/accounts/{accountId}/training-records"
      - "POST /api/training-records/{recordId}/complete-simulation"
      - "POST /api/training-records/{recordId}/trigger-reevaluation"
      - "POST /api/training-records/{recordId}/proctor-cases"
      - "POST /api/account-readiness-reviews/{reviewId}/activate"
    shared_operations:
      - "GET reads across readiness reviews, systems and training records"

  - name: HospitalProcurementOfficer
    description: "Hospital-side counterparty; accepts or rejects placement agreements on behalf of the facility"
    identity: opaque
    exclusive_operations:
      - "POST /api/placement-agreements/{agreementId}/accept"
      - "POST /api/placement-agreements/{agreementId}/reject"
      - "POST /api/procedure-cases/{caseId}/cancel"
    shared_operations:
      - "GET reads on agreements and systems"

  - name: ServiceEngineer
    description: "Field service engineer; sustains coverage contracts, opens service actions and resolves incidents"
    identity: opaque
    exclusive_operations:
      - "POST /api/service-contracts, POST /api/service-contracts/{contractId}/terminate"
      - "POST /api/robot-systems/{systemId}/open-service-action"
      - "POST /api/robot-systems/{systemId}/restore-service"
      - "POST /api/robot-systems/{systemId}/instrument-lives/decrement, POST /api/robot-systems/{systemId}/instrument-lives/reset"
      - "POST /api/robot-systems/{systemId}/software-deployments, POST /api/software-deployments/{deploymentId}/complete"
      - "POST /api/incident-service-requests"
      - "POST /api/incident-service-requests/{incidentId}/acknowledge, POST /api/incident-service-requests/{incidentId}/resolve"
      - "POST /api/loaner-dispatches, POST /api/loaner-dispatches/{dispatchId}/activate"
    shared_operations:
      - "GET reads across systems, contracts, incidents and dispatches"

  - name: ComplianceOfficer
    description: "Credentialing and commitment-compliance reviewer; approves proctor cases and decides expansion reviews"
    identity: opaque
    exclusive_operations:
      - "POST /api/proctor-cases/{proctorCaseId}/approve"
      - "POST /api/proctor-cases/{proctorCaseId}/reject"
      - "POST /api/credentialing-evidence/{evidenceId}/renew"
      - "POST /api/credentialing-evidence/{evidenceId}/revoke"
      - "POST /api/expansion-reviews/{reviewId}/approve"
      - "POST /api/expansion-reviews/{reviewId}/reject"
      - "POST /api/placement-agreements/{agreementId}/waive-shortfall"
    shared_operations:
      - "GET reads across training records, evidence, agreements and expansion reviews"

  - name: IDNCoordinator
    description: "Integrated delivery network planner; moves committed-procedure credit between member accounts"
    identity: opaque
    exclusive_operations:
      - "POST /api/accounts/{accountId}/consumption-ledgers"
      - "POST /api/utilisation-consumption-ledgers/{ledgerId}/bootstrap-decrement"
      - "POST /api/utilisation-transfer-transactions"
      - "POST /api/utilisation-transfer-transactions/{transactionId}/settle"
      - "POST /api/utilisation-transfer-transactions/{transactionId}/reverse"
    shared_operations:
      - "GET reads on accounts, ledgers and transfers across the shared idn_group_code"

  - name: AccountOwner
    description: "The hospital system itself acting as a first party; books its own cases and manages its own surgeons"
    identity: entity_backed:HospitalAccount
    exclusive_operations:
      - "POST /api/robot-systems/{systemId}/procedure-cases"
      - "POST /api/procedure-cases/{caseId}/reschedule"
      - "POST /api/procedure-cases/{caseId}/mark-completed"
      - "POST /api/procedure-cases/bulk-complete"
      - "POST /api/training-records/{recordId}/credentialing-evidence"
    shared_operations:
      - "POST /api/expansion-reviews/{reviewId}/submit"
      - "GET reads on the identity's own account and its children"

  - name: Surgeon
    description: "A credentialed operator acting on their own training record"
    identity: entity_backed:SurgeonTrainingRecord
    exclusive_operations: []
    shared_operations:
      - "GET /api/training-records/{recordId} for the identity's own record"
      - "GET /api/training-records/{recordId}/credentialing-evidence for the identity's own record"

  - name: Anonymous
    description: "Unauthenticated caller; permitted only on the logical-clock test-driving endpoint so fixtures can be driven from empty-DB"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /api/_clock/set_current_utc"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- Test-driving surface (§1.5 priority-ladder rung 3) ---------------------
  - { method: POST, path: "/api/_clock/set_current_utc", description: "Set the logical clock. Before any call the server's clock reads exactly the fixed startup default 2026-09-01T00:00:00Z and never falls back to real wall-clock time. All expiry, acceptance-window, ops-run and interval rules read this clock.", roles: [PlatformAdmin, Anonymous], code: 200, input: [to_iso8601], output: null, side_effects: ["logical clock advanced to to_iso8601; no entity version changes"] }

  # --- Hospital accounts ------------------------------------------------------
  - { method: POST, path: "/api/accounts", description: "Create a hospital system account in PROSPECT", roles: [RegionalSalesDirector], code: 201, input: [account_name, idn_group_code, region_code, placement_cap, maximum_procedure_commitment], output: HospitalAccount, side_effects: ["hospital_owner_user_id stamped from X-User-ID", "account_posture computed = ONBOARDING_GATE"] }
  - { method: GET, path: "/api/accounts", description: "List accounts, filterable by idn_group_code and account_status", roles: [PlatformAdmin, RegionalSalesDirector, IDNCoordinator, AccountOwner], code: 200, input: ["idn_group_code?", "account_status?", "limit?", "offset?"], output: "HospitalAccount[]", side_effects: [] }
  - { method: GET, path: "/api/accounts/{accountId}", description: "Retrieve one hospital account", roles: [PlatformAdmin, RegionalSalesDirector, IDNCoordinator, AccountOwner], code: 200, input: [], output: HospitalAccount, side_effects: [] }
  - { method: POST, path: "/api/accounts/{accountId}/close", description: "Close an account and cascade cancellation of its open cases and contracts", roles: [PlatformAdmin], code: 200, input: [expected_account_version], output: HospitalAccount, side_effects: ["account_status → CLOSED", "every non-terminal ProcedureCase on the account's systems → CANCELLED", "every ACTIVE ServiceContract on the account's systems → TERMINATED", "account_posture recomputed", "increments HospitalAccount.version by 1"] }
  - { method: POST, path: "/api/households/{accountId}/reactivate", description: "Reactivate a dormant account", roles: [RegionalSalesDirector], code: 200, input: [expected_account_version], output: HospitalAccount, side_effects: ["account_status → ACTIVE", "dormant_since_utc cleared", "account_posture recomputed", "increments HospitalAccount.version by 1"] }
  - { method: POST, path: "/api/account-readiness-reviews/{reviewId}/activate", description: "Move the account from PROSPECT to READINESS", roles: [ClinicalOperationsLead], code: 200, input: [expected_account_version], output: HospitalAccount, side_effects: ["account_status → READINESS", "account_posture recomputed", "increments HospitalAccount.version by 1"] }

  # --- Site readiness ---------------------------------------------------------
  - { method: POST, path: "/api/accounts/{accountId}/readiness-reviews", description: "Open a site-readiness review for a hospital site against a system configuration; the response carries computed_id, construction_uplift_fee_cents, conditional_clearance_count, review_round and readiness_status", roles: [ClinicalOperationsLead], code: 201, input: [site_code, operating_room_length_cm, operating_room_width_cm, table_throw_radius_cm, ceiling_clearance_cm, has_dedicated_power_circuit, has_dark_fiber_run, evaluated_configuration_id], output: SiteReadinessReview, side_effects: ["readiness_status initialized PENDING_REVIEW", "review_round initialized 1", "conditional_clearance_count computed against the evaluated configuration", "construction_uplift_fee computed"] }
  - { method: GET, path: "/api/accounts/{accountId}/readiness-reviews", description: "List a hospital account's readiness reviews", roles: [PlatformAdmin, RegionalSalesDirector, ClinicalOperationsLead], code: 200, input: ["readiness_status?", "site_code?", "limit?", "offset?"], output: "SiteReadinessReview[]", side_effects: [] }
  - { method: GET, path: "/api/account-readiness-reviews", description: "List readiness reviews by evaluating configuration", roles: [PlatformAdmin, ClinicalOperationsLead], code: 200, input: ["evaluated_configuration_id?", "limit?", "offset?", "hospital_account_id"], output: "SiteReadinessReview[]", side_effects: [] }
  - { method: GET, path: "/api/account-readiness-reviews/{reviewId}", description: "Retrieve one readiness review", roles: [PlatformAdmin, RegionalSalesDirector, ClinicalOperationsLead], code: 200, input: [], output: SiteReadinessReview, side_effects: [] }
  - { method: POST, path: "/api/account-readiness-reviews/{reviewId}/submit-verdict", description: "Submit the dimensional and integration verdict; passes when every check is an exact match, conditional otherwise", roles: [ClinicalOperationsLead], code: 200, input: [verdict, expected_review_version], output: SiteReadinessReview, side_effects: ["readiness_status → PASSED or CONDITIONAL", "account_posture recomputed", "increments SiteReadinessReview.version by 1"] }
  - { method: POST, path: "/api/account-readiness-reviews/{reviewId}/reject", description: "Reject a readiness review with a remediation note", roles: [ClinicalOperationsLead], code: 200, input: [remediation_note, expected_review_version], output: SiteReadinessReview, side_effects: ["readiness_status → REJECTED", "account_posture recomputed", "increments SiteReadinessReview.version by 1"] }
  - { method: POST, path: "/api/account-readiness-reviews/{reviewId}/return-to-review", description: "Return a rejected review to PENDING_REVIEW and advance the revision round", roles: [ClinicalOperationsLead], code: 200, input: ["remediation_note?", expected_review_version], output: SiteReadinessReview, side_effects: ["readiness_status → PENDING_REVIEW", "review_round += 1", "conditional_clearance_count recomputed", "account_posture recomputed", "increments SiteReadinessReview.version by 1"] }
  - { method: POST, path: "/api/account-readiness-reviews/{reviewId}/readiness-checks", description: "Re-measure one dimensional check on a review without changing its status", roles: [ClinicalOperationsLead], code: 200, input: [check_type, measured_value_cm, expected_review_version], output: SiteReadinessReview, side_effects: ["conditional_clearance_count recomputed", "increments SiteReadinessReview.version by 1"] }

  # --- System configurations (manufacturer catalog) ---------------------------
  - { method: POST, path: "/api/system-configurations", description: "Create a system configuration catalog entry", roles: [PlatformAdmin], code: 201, input: [model_code, base_placement_fee_cents, max_instrument_lives, feature_entitlements, requires_dark_fiber, requires_dedicated_power_circuit, integration_tier, min_operating_room_length_cm, min_operating_room_width_cm, min_table_throw_radius_cm, min_ceiling_clearance_cm], output: SystemConfiguration, side_effects: ["system_configuration_pricing recompute"] }
  - { method: GET, path: "/api/system-configurations", description: "List system configurations", roles: [PlatformAdmin, RegionalSalesDirector, ClinicalOperationsLead], code: 200, input: ["status?", "limit?", "offset?"], output: "SystemConfiguration[]", side_effects: [] }
  - { method: GET, path: "/api/system-configurations/{configId}", description: "Retrieve one system configuration", roles: [PlatformAdmin, RegionalSalesDirector, ClinicalOperationsLead], code: 200, input: [], output: SystemConfiguration, side_effects: [] }
  - { method: PUT, path: "/api/system-configurations/{configId}", description: "Update a system configuration's commercial or dimensional attributes", roles: [PlatformAdmin], code: 200, input: ["base_placement_fee_cents?", "integration_tier?", "max_instrument_lives?", "requires_dark_fiber?", "requires_dedicated_power_circuit?", "status?"], output: SystemConfiguration, side_effects: ["system_configuration_pricing recompute", "increments SystemConfiguration.version by 1"] }

  # --- Placement agreements ---------------------------------------------------
  - { method: POST, path: "/api/placement-agreements", description: "Draft a placement agreement against a passed readiness review", roles: [RegionalSalesDirector], code: 201, input: [hospital_account_id, system_configuration_id, site_readiness_review_id, arrangement_type, base_monthly_fee_cents, "minimum_procedures_per_cycle?", "interval_months?", "placement_fee_cents?", "lease_monthly_amount_cents?", "usage_rate_basis_points?"], output: PlacementAgreement, side_effects: ["agreement_status initialized DRAFT", "compliance_status initialized MEETS_COMMITMENT", "account_posture recomputed"] }
  - { method: GET, path: "/api/placement-agreements", description: "List agreements, filterable by account and status", roles: [PlatformAdmin, RegionalSalesDirector, ComplianceOfficer, IDNCoordinator], code: 200, input: ["hospital_account_id?", "agreement_status?", "limit?", "offset?", "system_configuration_id", "site_readiness_review_id"], output: "PlacementAgreement[]", side_effects: [] }
  - { method: GET, path: "/api/placement-agreements/{agreementId}", description: "Retrieve one placement agreement", roles: [PlatformAdmin, RegionalSalesDirector, ComplianceOfficer, IDNCoordinator, AccountOwner], code: 200, input: [], output: PlacementAgreement, side_effects: [] }
  - { method: POST, path: "/api/placement-agreements/{agreementId}/submit", description: "Submit a draft agreement; computes the placement fee and moves it to PENDING_ACCEPTANCE", roles: [RegionalSalesDirector], code: 200, input: [expected_agreement_version], output: PlacementAgreement, side_effects: ["agreement_status → PENDING_ACCEPTANCE", "placement_fee recompute", "acceptance_expires_utc stamped = logical clock + 30 days", "account_posture recomputed", "increments PlacementAgreement.version by 1"] }
  - { method: POST, path: "/api/placement-agreements/{agreementId}/accept", description: "Hospital acceptance; activates the agreement and synthesizes the installed system and its coverage contract; the response carries computed_id, agreement_status, activated_at_utc, cycle_start_utc, cycle_end_utc, placement_fee_cents, net_placement_fee_cents, synthesized_system_id, synthesized_system_version and synthesized_service_contract_id", roles: [HospitalProcurementOfficer], code: 200, input: [expected_agreement_version, expected_hospital_account_version], output: PlacementAgreement, side_effects: ["agreement_status → ACTIVE", "activated_at_utc and cycle_start_utc stamped from the logical clock", "cycle_end_utc recomputed", "a RobotSystem is synthesized in NOT_INSTALLED", "a ServiceContract is synthesized ACTIVE with coverage_tier COMPREHENSIVE and contract_months 1", "net_placement_fee_cents recomputed under the write_down_after_integration variant", "account_posture recomputed", "increments PlacementAgreement.version by 1", "increments HospitalAccount.version by 1"] }
  - { method: POST, path: "/api/placement-agreements/{agreementId}/suspend", description: "Suspend a non-compliant active agreement", roles: [PlatformAdmin], code: 200, input: [expected_agreement_version], output: PlacementAgreement, side_effects: ["agreement_status → SUSPENDED", "every system on the agreement → SERVICE_ACTION_REQUIRED", "the CONTRACT_EXPIRED reclaim wave reclaims this agreement's loaner dispatches", "account_posture recomputed", "increments PlacementAgreement.version by 1"] }
  - { method: POST, path: "/api/placement-agreements/{agreementId}/reinstate", description: "Reinstate a suspended agreement once its coverage contracts are in window", roles: [RegionalSalesDirector], code: 200, input: [expected_agreement_version], output: PlacementAgreement, side_effects: ["agreement_status → ACTIVE", "every system in SERVICE_ACTION_REQUIRED → IN_SERVICE", "placement_agreement_commitment_state recompute", "account_posture recomputed", "increments PlacementAgreement.version by 1"] }
  - { method: POST, path: "/api/placement-agreements/{agreementId}/reject", description: "Hospital rejection; returns the agreement to DRAFT", roles: [HospitalProcurementOfficer], code: 200, input: [expected_agreement_version], output: PlacementAgreement, side_effects: ["agreement_status → DRAFT", "cycle and acceptance stamps cleared", "account_posture recomputed", "increments PlacementAgreement.version by 1"] }
  - { method: POST, path: "/api/placement-agreements/{agreementId}/terminate", description: "Terminate an active or suspended agreement and cascade decommissioning", roles: [PlatformAdmin], code: 200, input: [expected_agreement_version], output: PlacementAgreement, side_effects: ["agreement_status → TERMINATED", "every non-terminal ProcedureCase on the agreement's systems → CANCELLED", "every ACTIVE ServiceContract on the agreement's systems → TERMINATED", "every system on the agreement → DECOMMISSIONED", "every PROGRAMMED or ACTIVATED loaner dispatch on the agreement's systems → CANCELLED", "account_posture recomputed", "increments PlacementAgreement.version by 1"] }
  - { method: POST, path: "/api/placement-agreements/{agreementId}/waive-shortfall", description: "Waive the current interval's commitment shortfall", roles: [ComplianceOfficer], code: 200, input: [reason], output: PlacementAgreement, side_effects: ["is_shortfall_waived = true", "shortfall_compliance_status recompute", "placement_agreement_commitment_state recompute", "increments PlacementAgreement.version by 1"] }
  - { method: GET, path: "/api/accounts/{accountId}/placement-agreements", description: "List a hospital account's placement agreements", roles: [PlatformAdmin, RegionalSalesDirector, ComplianceOfficer], code: 200, input: ["agreement_status?", "limit?", "offset?"], output: "PlacementAgreement[]", side_effects: [] }

  # --- Robot systems ----------------------------------------------------------
  - { method: GET, path: "/api/robot-systems", description: "List robot systems, filterable by account, agreement and service status", roles: [PlatformAdmin, RegionalSalesDirector, ServiceEngineer, AccountOwner], code: 200, input: ["hospital_account_id?", "placement_agreement_id?", "service_status?", "limit?", "offset?", "system_configuration_id", "site_readiness_review_id", "current_utilization_cycle_id?"], output: "RobotSystem[]", side_effects: [] }
  - { method: GET, path: "/api/robot-systems/{systemId}", description: "Retrieve one robot system", roles: [PlatformAdmin, RegionalSalesDirector, ServiceEngineer, AccountOwner, ClinicalOperationsLead], code: 200, input: [], output: RobotSystem, side_effects: [] }
  - { method: GET, path: "/api/placement-agreements/{agreementId}/robot-systems", description: "List the systems an agreement has placed", roles: [PlatformAdmin, RegionalSalesDirector, ServiceEngineer], code: 200, input: ["service_status?", "limit?", "offset?"], output: "RobotSystem[]", side_effects: [] }
  - { method: GET, path: "/api/accounts/{accountId}/robot-systems", description: "List a hospital account's systems", roles: [PlatformAdmin, RegionalSalesDirector, ServiceEngineer, AccountOwner], code: 200, input: ["service_status?", "limit?", "offset?"], output: "RobotSystem[]", side_effects: [] }
  - { method: POST, path: "/api/robot-systems/{systemId}/install", description: "Install a system at a site whose readiness review passed; the response carries service_status, current_utilization_cycle_id, instrument_lives_remaining and expansion_eligible", roles: [ClinicalOperationsLead], code: 200, input: [expected_robot_system_version], output: RobotSystem, side_effects: ["service_status → INSTALLED", "account_posture recomputed", "increments RobotSystem.version by 1"] }
  - { method: POST, path: "/api/robot-systems/{systemId}/commission", description: "Commission an installed system into service and open its first utilization cycle; the response carries service_status and current_utilization_cycle_id which the test must then read", roles: [ClinicalOperationsLead], code: 200, input: [expected_robot_system_version], output: RobotSystem, side_effects: ["service_status → IN_SERVICE", "a UtilizationCycle is taken for the system's current commitment interval (created if none exists for that interval, otherwise the existing row is reused as open)", "current_utilization_cycle_id stamped", "utilization_band recomputed = UNDERUTILIZED", "account_posture recomputed", "increments RobotSystem.version by 1"] }
  - { method: POST, path: "/api/robot-systems/{systemId}/open-service-action", description: "Place an in-service system into service-action-required and suspend non-compliant agreements", roles: [ServiceEngineer], code: 200, input: [expected_robot_system_version], output: RobotSystem, side_effects: ["service_status → SERVICE_ACTION_REQUIRED", "every ACTIVE agreement on the system with compliance_status NON_COMPLIANT → SUSPENDED", "account_posture recomputed", "increments RobotSystem.version by 1", "increments PlacementAgreement.version by 1"] }
  - { method: POST, path: "/api/robot-systems/{systemId}/restore-service", description: "Return a service-action system to service once every incident is resolved and coverage is in window", roles: [ServiceEngineer], code: 200, input: [expected_robot_system_version], output: RobotSystem, side_effects: ["service_status → IN_SERVICE", "account_posture recomputed", "increments RobotSystem.version by 1"] }
  - { method: POST, path: "/api/robot-systems/{systemId}/decommission", description: "Retire a system from service", roles: [PlatformAdmin], code: 200, input: [expected_robot_system_version], output: RobotSystem, side_effects: ["service_status → DECOMMISSIONED", "every ACTIVE ServiceContract on the system → TERMINATED", "account_posture recomputed", "increments RobotSystem.version by 1"] }
  - { method: POST, path: "/api/robot-systems/{systemId}/instrument-lives/decrement", description: "Post a manual instrument-and-accessory load against the system's accessory set", roles: [ServiceEngineer], code: 200, input: [approved_load], output: RobotSystem, side_effects: ["instrument_lives_remaining recompute", "an accessory load ledger entry is appended", "increments RobotSystem.version by 1"] }
  - { method: POST, path: "/api/robot-systems/{systemId}/instrument-lives/reset", description: "Provision a replacement instrument-and-accessory set, restoring the configuration's full life count", roles: [ServiceEngineer], code: 200, input: [expected_robot_system_version], output: RobotSystem, side_effects: ["instrument_lives_remaining recompute = configuration.max_instrument_lives", "increments RobotSystem.version by 1"] }
  - { method: POST, path: "/api/robot-systems/{systemId}/software-deployments", description: "Program a software release deployment into a maintenance window", roles: [ServiceEngineer], code: 201, input: [software_release_id, scheduled_window_start_utc, scheduled_window_end_utc], output: SoftwareReleaseDeployment, side_effects: ["deployment_status initialized PROGRAMMED", "release_entitlement_reconcile computed"] }
  - { method: GET, path: "/api/robot-systems/{systemId}/software-deployments", description: "List a system's software deployments", roles: [PlatformAdmin, ServiceEngineer], code: 200, input: ["deployment_status?", "limit?", "offset?"], output: "SoftwareReleaseDeployment[]", side_effects: [] }
