            - call: "POST /v1/efforts/${e2_up}/flags"
              payload: { reporter_id: "${q_cas}", reason: "IMPOSSIBLE_TIME" }
              as: Athlete
              as_user_id: "${q_cas}"
              captures: { fl2_up: $.data.id }
            - call: "POST /v1/efforts/${e3_up}/flags"
              payload: { reporter_id: "${q_cas}", reason: "IMPOSSIBLE_TIME" }
              as: Athlete
              as_user_id: "${q_cas}"
              captures: { fl3_up: $.data.id }
            - call: "POST /v1/flags/${fl1_up}/uphold"
