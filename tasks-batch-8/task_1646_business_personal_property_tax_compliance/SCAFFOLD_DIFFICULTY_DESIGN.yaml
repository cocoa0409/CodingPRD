  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: appeal_state_beats_protest_window
        grounds:
          - validations[priority=8]
          - validations[priority=15]
          - errors[ERR_NOTICE_NOT_APPEALABLE]
          - errors[ERR_PROTEST_WINDOW_CLOSED]
        distinguishing_aspect: |
          Error-category pair state vs business_temporal: the notice is
          FINALIZED (state failure, priority 8) AND the clock is past the
          protest deadline (temporal failure, priority 15); the higher-priority
          state error ERR_NOTICE_NOT_APPEALABLE (409) must win.
        test_recipe:
          setup:
            - "Jurisdiction JW (FULL_YEAR [100,100], de_minimis 0); client C with one classified asset cost 800000 acq 2026-01-05; rendition 2027 FILED on time"
            - "Notice 800000 with protest_deadline_date 2027-05-31 in RECEIVED"
            - "Logical clock advanced to 2027-06-15, which also auto-finalizes the notice (sweep: past protest deadline, not PROTESTED)"
          setup_api_calls:
            - call: "POST /bpp/clients"
              payload: { legal_name: "WinCo", contact_email: "win@x.com" }
              as: FirmAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /bpp/operators"
              payload: { display_name: "Ann Analyst", operator_role: "TAX_ANALYST" }
              as: FirmAdmin
              captures: { op_an: $.data.id }
            - call: "POST /bpp/jurisdictions"
              payload: { county_name: "Win County", state_code: "TX", base_deadline_mmdd: "04-15", max_extension_days: 30, late_penalty_pct_per_month: 2, max_late_penalty_pct: 10, penalty_base: "VALUE_BASE", tax_rate: 0.02, offered_exemption_types: ["FREEPORT"], max_exemption_pct: 50 }
              as: FirmAdmin
              captures: { j_w: $.data.id }
            - call: "POST /bpp/class-rules"
              payload: { jurisdiction_id: "${j_w}", category: "MACHINERY", is_taxable: true, depreciation_convention: "FULL_YEAR", percent_good_vector: [100, 100], percent_good_floor_pct: 10, de_minimis_line_cents: 0 }
              as: FirmAdmin
            - call: "POST /bpp/assets"
              payload: { client_id: "${cl_id}", jurisdiction_id: "${j_w}", asset_tag: "W1", category: "MACHINERY", acquisition_cost_cents: 800000, acquisition_date: "2026-01-05", in_service_date: "2026-01-10" }
              as: TaxAnalyst
              as_user_id: "${op_an}"
              captures: { a_w: $.data.id }
            - call: "POST /bpp/assets/${a_w}/classify"
              payload: { taxable_classification: "TAXABLE" }
              as: TaxAnalyst
              as_user_id: "${op_an}"
            - call: "POST /bpp/renditions"
              payload: { client_id: "${cl_id}", jurisdiction_id: "${j_w}", tax_year: 2027 }
              as: TaxAnalyst
              as_user_id: "${op_an}"
              captures: { r_w: $.data.id }
            - call: "POST /bpp/renditions/${r_w}/generate-lines"
              payload: {}
              as: TaxAnalyst
              as_user_id: "${op_an}"
            - call: "POST /bpp/renditions/${r_w}/file"
              payload: {}
              as: TaxAnalyst
              as_user_id: "${op_an}"
            - call: "POST /bpp/renditions/${r_w}/assessment-notices"
              payload: { notice_value_cents: 800000, received_date: "2027-05-01", protest_deadline_date: "2027-05-31" }
