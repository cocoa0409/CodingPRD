      - name: service_failure_dispute_eligibility_depends_on_hub_lockdown_posture
        grounds:
          - state_machines.ServiceFailure.transitions.DISPUTED_to_OPEN
          - state_machines.Hub.transitions.OPEN_to_LOCKDOWN
          - errors.ERR_REOPEN_POSTURE_BLOCKED
          - endpoints.POST_/airhub/failures/{failure_id}/reopen
        distinguishing_aspect: "The ServiceFailure -> Hub pair, distinct from the Package -> Aircraft pair: a DISPUTED failure may be reopened only while the hub's derived posture is OPEN or CONGESTED, so declaring the contingency freezes every reopen on the hub and clearing it thaws them, with no change to the failure itself."
        test_recipe:
          setup:
            - "Clock 1601. SDF hub with alternate IND, BANK_A with N701UP landed and unloaded, shift N-A, and one GENERAL package with a WEATHER-attributed failure (thus disputable) that has been moved to DISPUTED."
          setup_api_calls:
            - *k_clock
            - *k_alt_hub
            - *k_hub
            - *k_lane_p1
            - *k_lane_s1
            - *k_bank
            - *k_ac1
            - *k_shift
            - *k_clock1400
            - *k_ac1_depart
            - *k_ac1_land
            - *k_bank_unload
            - *k_ac1_begun
            - *k_ac1_done
            - call: "POST /airhub/packages"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac1_id}", tracking_number: "1Z-W-0001", commodity_class: "GENERAL", destination_hub_code: "LAX", service_level: "NEXT_DAY_AIR", planned_weight_grams: 30000, dimension_weight_grams: 30000 }
              as: SortOperator
              captures: { pkg_w: $.data.id }
            - call: "POST /airhub/failures"
              payload: { hub_id: "${hub_id}", package_id: "${pkg_w}", cause_code: "WEATHER", failure_minutes: 1500 }
              as: RefundAdjuster
              captures: { fail_w: $.data.id, w_role: $.data.attributed_role }
            - call: "POST /airhub/failures/${fail_w}/dispute"
              payload: {}
              as: RefundAdjuster
              captures: { w_disputed: $.data.status }
          trigger:
            - call: "POST /airhub/failures/${fail_w}/reopen"
              payload: {}
              as: RefundAdjuster
              captures: { reopen_while_open: $.data.status }
            - call: "POST /airhub/failures/${fail_w}/dispute"
              payload: {}
              as: RefundAdjuster
            - call: "POST /airhub/hubs/${hub_id}/declare-contingency"
              payload: {}
              as: WeatherOfficer
            - call: "POST /airhub/failures/${fail_w}/reopen"
              payload: {}
              as: RefundAdjuster
              captures: { err_locked: $.data.error_id }
            - call: "POST /airhub/hubs/${hub_id}/clear-contingency"
              payload: {}
              as: HubOpsManager
            - call: "POST /airhub/failures/${fail_w}/reopen"
              payload: {}
              as: RefundAdjuster
              captures: { reopen_after_clear: $.data.status }
          assert:
            - "the failure is WEATHER-attributed (${w_role} == WEATHER_EVENT) and was disputable at ${w_disputed} == DISPUTED"
            - "while the hub was OPEN the reopen succeeds: ${reopen_while_open} == OPEN"
            - "after the contingency declaration the same reopen is refused on the cross-entity gate: ${err_locked} == ERR_REOPEN_POSTURE_BLOCKED"
            - "ServiceFailure.${fail_w}.status == DISPUTED while the hub is locked, so the failure never advanced"
            - "after clearing the contingency the reopen succeeds again: ${reopen_after_clear} == OPEN"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: buildup_occupancy_interval_admits_an_exact_meeting_at_the_limit
        grounds:
          - state_machines.Buildup.transitions.OPEN_to_SEALED
          - calculations.buildup_reserve_tier
          - errors.ERR_BUILDUP_UNDER_CAPACITY
          - endpoints.POST_/airhub/buildups/{buildup_id}/seal
        distinguishing_aspect: "First interval semantics: capacity occupancy with a ZERO tolerance on the sealing side, where an exact meeting at the container limit is admitted (delta 0 seals) but any overshoot inside the breach band is not — a closed-on-the-lower-bound arithmetic distinct from the point-touching turnout rule."
        test_recipe:
          setup:
            - "Clock 1450. SDF hub with alternate IND, lane P-01 and S-01, BANK_A with N701UP landed and unloaded, N702UP the outbound aircraft, shift N-A, and three GENERAL packages rated 100000, 100100 and 400 grams that are inducted and secondary-sorted."
