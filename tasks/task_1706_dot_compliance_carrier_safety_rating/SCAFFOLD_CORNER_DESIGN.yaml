            - { call: "POST /safety/violation-categories", payload: { category_code: "UNSAFE_DRIVING", display_name: "UD", intervention_threshold: 65, benchmark_measure: 10.0 }, as: SafetyAdmin, captures: { cat_ud: $.data.id } }
