scaffold_corner_design:

  # ==========================================================================
  # Section: entities
  # ==========================================================================
  - section: entities
    instances:
      - name: artist_creation_returns_201_with_system_fields
        claim_type: creation
        grounds:
          - "entities.Artist"
          - "endpoints"
        distinguishing_aspect: "POST /artists with all required fields returns 201 and server-stamped id, created_at, updated_at, version=1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueManager
          trigger:
            - call: "POST /artists"
              payload: { legal_name: "Alpha", agency: "A", guarantee_floor_cents: 10000, deposit_pct: 0.25 }
              as: VenueManager
              captures: { a_id: $.data.id, a_v: $.data.version, a_created: $.data.created_at }
          assert:
            - "response has id, created_at, updated_at, version fields"
            - "version == 1"
            - "status == ACTIVE (default)"
            - "total_settled_shows == 0 (computed initial)"

      - name: artist_missing_required_field_returns_400
        claim_type: required_fields
        grounds:
          - "entities.Artist"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Omitting guarantee_floor_cents returns ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueManager
          trigger:
            - call: "POST /artists"
              payload: { legal_name: "Beta", agency: "B", deposit_pct: 0.25 }
              as: VenueManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: artist_get_nonexistent_returns_404
        claim_type: not_found
        grounds:
          - "entities.Artist"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /artists/{random-uuid} returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueManager
          trigger:
            - call: "GET /artists/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: VenueManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND"
            - "http status == 404"

      - name: show_list_pagination_defaults
        claim_type: listing
        grounds:
          - "entities.Show"
          - "response_envelope"
        distinguishing_aspect: "GET /shows returns envelope with limit=10, offset=0, total_count, has_more fields."
        test_recipe:
          setup: ["empty DB; one artist"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueManager
            - call: "POST /artists"
              payload: { legal_name: "L", agency: "A", guarantee_floor_cents: 10000, deposit_pct: 0.25 }
              as: VenueManager
              captures: { l_a: $.data.id }
            - call: "POST /booking-agents"
              payload: { display_name: "BA", agency_name: "A" }
              as: VenueManager
              captures: { l_agent: $.data.id }
            - call: "POST /shows"
              payload: { artist_id: "${l_a}", room: "MAIN_ROOM", show_date: "2026-12-20", doors_at_utc: "2026-12-20T19:00:00Z", curfew_at_utc: "2026-12-20T23:00:00Z", total_capacity: 100, on_sale_at_utc: "2026-09-01T10:00:00Z" }
              as: BookingAgent
              as_user_id: "${l_agent}"
          trigger:
            - call: "GET /shows"
              payload: {}
              as: VenueManager
          assert:
            - "response contains pagination fields limit, offset, total_count, has_more"
            - "total_count == 1"

      - name: ticket_sale_immutable_no_version_field
        claim_type: immutability
        grounds:
          - "entities.TicketSale"
        distinguishing_aspect: "TicketSale has common_fields=false so response has id + created_at but no version field."
        test_recipe:
          setup: ["Show ON_SALE with tier"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueManager
            - call: "POST /artists"
              payload: { legal_name: "IM", agency: "A", guarantee_floor_cents: 10000, deposit_pct: 0.0 }
              as: VenueManager
              captures: { im_a: $.data.id }
            - call: "POST /booking-agents"
              payload: { display_name: "BA", agency_name: "A" }
              as: VenueManager
              captures: { im_agent: $.data.id }
            - call: "POST /shows"
              payload: { artist_id: "${im_a}", room: "LOUNGE", show_date: "2026-12-22", doors_at_utc: "2026-12-22T19:00:00Z", curfew_at_utc: "2026-12-22T23:00:00Z", total_capacity: 100, on_sale_at_utc: "2026-08-10T10:00:00Z" }
              as: BookingAgent
              as_user_id: "${im_agent}"
              captures: { im_s: $.data.id }
            - call: "POST /shows/${im_s}/date-holds"
              payload: { priority: "P1", booked_by_agent_id: "${im_agent}" }
              as: BookingAgent
              as_user_id: "${im_agent}"
              captures: { im_h: $.data.id }
            - call: "GET /shows/${im_s}"
              payload: {}
              as: VenueManager
              captures: { im_v0: $.data.version }
            - call: "POST /shows/${im_s}/date-holds/${im_h}/confirm"
              payload: { expected_show_version: "${im_v0}" }
              as: BookingAgent
              as_user_id: "${im_agent}"
            - call: "POST /shows/${im_s}/offers"
              payload: { deal_kind: "FLAT_GUARANTEE", guarantee_cents: 10000, artist_split_pct: 0, versus_threshold_cents: 0, expense_budget_cents: 0, support_budget_cents: 0, bar_split_pct: 0, merch_split_pct: 0 }
              as: BookingAgent
              as_user_id: "${im_agent}"
              captures: { im_o: $.data.id }
            - call: "GET /shows/${im_s}"
              payload: {}
              as: VenueManager
              captures: { im_v1: $.data.version }
            - call: "POST /shows/${im_s}/offers/${im_o}/accept"
              payload: { expected_show_version: "${im_v1}" }
              as: VenueManager
            - call: "POST /shows/${im_s}/ticket-tiers"
              payload: { tier_name: "GA", face_price_cents: 1000, capacity: 100, tier_order: 1 }
              as: Promoter
              captures: { im_t: $.data.id }
            - call: "GET /shows/${im_s}"
              payload: {}
              as: Promoter
              captures: { im_v2: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T10:00:01Z" }
              as: VenueManager
            - call: "POST /shows/${im_s}/on-sale"
              payload: { expected_show_version: "${im_v2}" }
              as: Promoter
          trigger:
            - call: "POST /shows/${im_s}/ticket-sales"
              payload: { tier_id: "${im_t}", quantity: 1 }
              as: Promoter
              captures: { im_sale: $.data.id }
          assert:
            - "TicketSale response has id, created_at"
            - "TicketSale response does NOT have version or updated_at (common_fields: false)"

      - name: show_computed_tickets_sold_defaults_zero
        claim_type: computed_fields
        grounds:
          - "entities.Show.fields.tickets_sold"
        distinguishing_aspect: "Newly created Show has tickets_sold==0 and gross_ticket_revenue_cents==0 (computed fields with no source data)."
        test_recipe:
          setup: ["artist exists"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueManager
            - call: "POST /artists"
              payload: { legal_name: "CI", agency: "A", guarantee_floor_cents: 10000, deposit_pct: 0.25 }
              as: VenueManager
              captures: { ci_a: $.data.id }
            - call: "POST /booking-agents"
              payload: { display_name: "BA", agency_name: "A" }
              as: VenueManager
              captures: { ci_agent: $.data.id }
          trigger:
            - call: "POST /shows"
              payload: { artist_id: "${ci_a}", room: "MAIN_ROOM", show_date: "2026-12-25", doors_at_utc: "2026-12-25T19:00:00Z", curfew_at_utc: "2026-12-25T23:00:00Z", total_capacity: 100, on_sale_at_utc: "2026-09-01T10:00:00Z" }
              as: BookingAgent
              as_user_id: "${ci_agent}"
              captures: { ci_s: $.data.id, ci_sold: $.data.tickets_sold, ci_gross: $.data.gross_ticket_revenue_cents }
          assert:
            - "Show.tickets_sold == 0 (computed, no sales yet)"
            - "Show.gross_ticket_revenue_cents == 0"

  # ==========================================================================
  # Section: state_machines
  # ==========================================================================
  - section: state_machines
    instances:
      - name: offer_initial_state_pending
        claim_type: initial_state
        grounds:
          - "state_machines.Offer"
        distinguishing_aspect: "Newly created Offer has status=PENDING."
        test_recipe:
          setup: ["Show CONFIRMED"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueManager
            - call: "POST /artists"
              payload: { legal_name: "IS", agency: "A", guarantee_floor_cents: 10000, deposit_pct: 0.25 }
              as: VenueManager
              captures: { is_a: $.data.id }
            - call: "POST /booking-agents"
              payload: { display_name: "BA", agency_name: "A" }
              as: VenueManager
              captures: { is_agent: $.data.id }
            - call: "POST /shows"
              payload: { artist_id: "${is_a}", room: "MAIN_ROOM", show_date: "2027-01-05", doors_at_utc: "2027-01-05T19:00:00Z", curfew_at_utc: "2027-01-05T23:00:00Z", total_capacity: 100, on_sale_at_utc: "2026-09-01T10:00:00Z" }
              as: BookingAgent
              as_user_id: "${is_agent}"
              captures: { is_s: $.data.id }
            - call: "POST /shows/${is_s}/date-holds"
              payload: { priority: "P1", booked_by_agent_id: "${is_agent}" }
              as: BookingAgent
              as_user_id: "${is_agent}"
              captures: { is_h: $.data.id }
            - call: "GET /shows/${is_s}"
              payload: {}
              as: VenueManager
              captures: { is_v0: $.data.version }
            - call: "POST /shows/${is_s}/date-holds/${is_h}/confirm"
              payload: { expected_show_version: "${is_v0}" }
              as: BookingAgent
              as_user_id: "${is_agent}"
          trigger:
            - call: "POST /shows/${is_s}/offers"
              payload: { deal_kind: "FLAT_GUARANTEE", guarantee_cents: 50000, artist_split_pct: 0, versus_threshold_cents: 0, expense_budget_cents: 5000, support_budget_cents: 0, bar_split_pct: 0.10, merch_split_pct: 0.20 }
              as: BookingAgent
              as_user_id: "${is_agent}"
              captures: { is_o_status: $.data.status }
          assert:
            - "Offer.status == PENDING"
            - "Offer.round_number == 1"

      - name: date_hold_release_from_terminal_confirmed_fails
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.DateHold"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Once DateHold is CONFIRMED (terminal), release is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["DateHold CONFIRMED"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueManager
            - call: "POST /artists"
              payload: { legal_name: "TL", agency: "A", guarantee_floor_cents: 10000, deposit_pct: 0.25 }
              as: VenueManager
              captures: { tl_a: $.data.id }
            - call: "POST /booking-agents"
              payload: { display_name: "BA", agency_name: "A" }
              as: VenueManager
              captures: { tl_agent: $.data.id }
            - call: "POST /shows"
              payload: { artist_id: "${tl_a}", room: "MAIN_ROOM", show_date: "2027-01-10", doors_at_utc: "2027-01-10T19:00:00Z", curfew_at_utc: "2027-01-10T23:00:00Z", total_capacity: 100, on_sale_at_utc: "2026-09-01T10:00:00Z" }
              as: BookingAgent
              as_user_id: "${tl_agent}"
              captures: { tl_s: $.data.id }
            - call: "POST /shows/${tl_s}/date-holds"
              payload: { priority: "P1", booked_by_agent_id: "${tl_agent}" }
              as: BookingAgent
              as_user_id: "${tl_agent}"
              captures: { tl_h: $.data.id }
            - call: "GET /shows/${tl_s}"
              payload: {}
              as: VenueManager
              captures: { tl_v0: $.data.version }
            - call: "POST /shows/${tl_s}/date-holds/${tl_h}/confirm"
              payload: { expected_show_version: "${tl_v0}" }
              as: BookingAgent
              as_user_id: "${tl_agent}"
          trigger:
            - call: "POST /shows/${tl_s}/date-holds/${tl_h}/release"
              payload: {}
              as: BookingAgent
              as_user_id: "${tl_agent}"
              captures: { tl_err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (terminal CONFIRMED)"
            - "DateHold.${tl_h}.status remains CONFIRMED"

      - name: offer_reject_is_terminal_and_idempotent
        claim_type: idempotency
        grounds:
          - "state_machines.Offer"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Rejecting an already-REJECTED offer returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Offer REJECTED"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueManager
            - call: "POST /artists"
              payload: { legal_name: "ID", agency: "A", guarantee_floor_cents: 10000, deposit_pct: 0.25 }
              as: VenueManager
              captures: { id_a: $.data.id }
            - call: "POST /booking-agents"
              payload: { display_name: "BA", agency_name: "A" }
              as: VenueManager
              captures: { id_agent: $.data.id }
            - call: "POST /shows"
              payload: { artist_id: "${id_a}", room: "MAIN_ROOM", show_date: "2027-01-15", doors_at_utc: "2027-01-15T19:00:00Z", curfew_at_utc: "2027-01-15T23:00:00Z", total_capacity: 100, on_sale_at_utc: "2026-09-01T10:00:00Z" }
              as: BookingAgent
              as_user_id: "${id_agent}"
              captures: { id_s: $.data.id }
            - call: "POST /shows/${id_s}/date-holds"
              payload: { priority: "P1", booked_by_agent_id: "${id_agent}" }
              as: BookingAgent
              as_user_id: "${id_agent}"
              captures: { id_h: $.data.id }
            - call: "GET /shows/${id_s}"
              payload: {}
              as: VenueManager
              captures: { id_v0: $.data.version }
            - call: "POST /shows/${id_s}/date-holds/${id_h}/confirm"
              payload: { expected_show_version: "${id_v0}" }
              as: BookingAgent
              as_user_id: "${id_agent}"
            - call: "POST /shows/${id_s}/offers"
              payload: { deal_kind: "FLAT_GUARANTEE", guarantee_cents: 50000, artist_split_pct: 0, versus_threshold_cents: 0, expense_budget_cents: 5000, support_budget_cents: 0, bar_split_pct: 0.10, merch_split_pct: 0.20 }
              as: BookingAgent
              as_user_id: "${id_agent}"
              captures: { id_o: $.data.id }
            - call: "POST /shows/${id_s}/offers/${id_o}/reject"
              payload: {}
              as: VenueManager
          trigger:
            - call: "POST /shows/${id_s}/offers/${id_o}/reject"
              payload: {}
              as: VenueManager
              captures: { id_err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (already REJECTED)"

      - name: settlement_approve_segregation_of_duties
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.Settlement.SUBMITTED_to_APPROVED"
          - "validations[priority=19]"
          - "errors[ERR_SEGREGATION_OF_DUTIES]"
        distinguishing_aspect: "Accountant with same user id as Promoter submitter cannot approve; different Accountant user can."
        test_recipe:
          setup: ["Settlement SUBMITTED by Promoter with user_id 'prom_1'"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueManager
            - call: "POST /artists"
              payload: { legal_name: "SD", agency: "A", guarantee_floor_cents: 10000, deposit_pct: 0.0 }
              as: VenueManager
              captures: { sd_a: $.data.id }
            - call: "POST /booking-agents"
              payload: { display_name: "BA", agency_name: "A" }
              as: VenueManager
              captures: { sd_agent: $.data.id }
            - call: "POST /shows"
              payload: { artist_id: "${sd_a}", room: "MAIN_ROOM", show_date: "2026-12-30", doors_at_utc: "2026-12-30T19:00:00Z", curfew_at_utc: "2026-12-30T23:00:00Z", total_capacity: 100, on_sale_at_utc: "2026-08-10T10:00:00Z" }
              as: BookingAgent
              as_user_id: "${sd_agent}"
              captures: { sd_s: $.data.id }
            - call: "POST /shows/${sd_s}/date-holds"
              payload: { priority: "P1", booked_by_agent_id: "${sd_agent}" }
              as: BookingAgent
              as_user_id: "${sd_agent}"
              captures: { sd_h: $.data.id }
            - call: "GET /shows/${sd_s}"
              payload: {}
              as: VenueManager
              captures: { sd_v0: $.data.version }
            - call: "POST /shows/${sd_s}/date-holds/${sd_h}/confirm"
              payload: { expected_show_version: "${sd_v0}" }
              as: BookingAgent
              as_user_id: "${sd_agent}"
            - call: "POST /shows/${sd_s}/offers"
              payload: { deal_kind: "FLAT_GUARANTEE", guarantee_cents: 50000, artist_split_pct: 0, versus_threshold_cents: 0, expense_budget_cents: 5000, support_budget_cents: 0, bar_split_pct: 0.10, merch_split_pct: 0.20 }
              as: BookingAgent
              as_user_id: "${sd_agent}"
              captures: { sd_o: $.data.id }
            - call: "GET /shows/${sd_s}"
              payload: {}
              as: VenueManager
              captures: { sd_v1: $.data.version }
            - call: "POST /shows/${sd_s}/offers/${sd_o}/accept"
              payload: { expected_show_version: "${sd_v1}" }
              as: VenueManager
            - call: "POST /shows/${sd_s}/ticket-tiers"
              payload: { tier_name: "GA", face_price_cents: 2000, capacity: 100, tier_order: 1 }
              as: Promoter
            - call: "GET /shows/${sd_s}"
              payload: {}
              as: Promoter
              captures: { sd_v2: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T10:00:01Z" }
              as: VenueManager
            - call: "POST /shows/${sd_s}/on-sale"
              payload: { expected_show_version: "${sd_v2}" }
              as: Promoter
            - call: "POST /shows/${sd_s}/advance/items/hospitality/complete"
              payload: {}
              as: ProductionManager
            - call: "POST /shows/${sd_s}/advance/items/tech/complete"
              payload: {}
              as: ProductionManager
            - call: "POST /shows/${sd_s}/advance/items/backline/complete"
              payload: {}
              as: ProductionManager
            - call: "POST /shows/${sd_s}/advance/items/production_requirements/complete"
              payload: {}
              as: ProductionManager
            - call: "POST /shows/${sd_s}/advance/items/insurance_cert/complete"
              payload: {}
              as: ProductionManager
            - call: "POST /shows/${sd_s}/advance/items/w9/complete"
              payload: {}
              as: ProductionManager
            - call: "POST /shows/${sd_s}/advance/complete"
              payload: {}
              as: ProductionManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-30T20:00:00Z" }
              as: VenueManager
            - call: "POST /shows/${sd_s}/settlement"
              payload: {}
              as: Promoter
              captures: { sd_set: $.data.id }
            - call: "GET /shows/${sd_s}"
              payload: {}
              as: Promoter
              captures: { sd_v3: $.data.version }
            - call: "POST /shows/${sd_s}/settlement/submit"
              payload: { expected_show_version: "${sd_v3}" }
              as: Promoter
              as_user_id: "prom_1"
          trigger:
            - call: "POST /shows/${sd_s}/settlement/approve"
              payload: {}
              as: Accountant
              as_user_id: "prom_1"
              captures: { sd_err: $.data.error_id }
          assert:
            - "error_id == ERR_SEGREGATION_OF_DUTIES (same user cannot approve own submission)"
            - "Settlement.${sd_set}.status remains SUBMITTED"

      - name: cancel_postponed_show_no_double_refund
        claim_type: side_effect_execution
        grounds:
          - "state_machines.Show.POSTPONED_to_CANCELLED"
        distinguishing_aspect: "Cancelling an already-POSTPONED show does not refund tickets again."
        test_recipe:
          setup: ["Show POSTPONED (tickets already refunded at postpone)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueManager
            - call: "POST /artists"
              payload: { legal_name: "PP", agency: "A", guarantee_floor_cents: 10000, deposit_pct: 0.0 }
              as: VenueManager
              captures: { pp_a: $.data.id }
            - call: "POST /booking-agents"
              payload: { display_name: "BA", agency_name: "A" }
              as: VenueManager
              captures: { pp_agent: $.data.id }
            - call: "POST /shows"
              payload: { artist_id: "${pp_a}", room: "MAIN_ROOM", show_date: "2026-12-28", doors_at_utc: "2026-12-28T19:00:00Z", curfew_at_utc: "2026-12-28T23:00:00Z", total_capacity: 100, on_sale_at_utc: "2026-08-10T10:00:00Z" }
              as: BookingAgent
              as_user_id: "${pp_agent}"
              captures: { pp_s: $.data.id }
            - call: "POST /shows/${pp_s}/date-holds"
              payload: { priority: "P1", booked_by_agent_id: "${pp_agent}" }
              as: BookingAgent
              as_user_id: "${pp_agent}"
              captures: { pp_h: $.data.id }
            - call: "GET /shows/${pp_s}"
              payload: {}
              as: VenueManager
              captures: { pp_v0: $.data.version }
