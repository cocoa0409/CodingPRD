  - rule_id: cross_entity_state_dependency
    instances:
      - name: invitation_creation_gated_on_carrier_qualification_state
        entity_pair: "Invitation depends on Carrier"
        grounds:
          - validations.priority_10_business_safety
          - errors.ERR_CARRIER_NOT_QUALIFIED
          - state_machines.Carrier.SCREENING_to_QUALIFIED
          - endpoints.POST_bid_events_id_invitations
        distinguishing_aspect: |
          Entity pair Invitation -> Carrier: whether an invitation may be created at all is
          decided by the state of a different entity that the request only references by id.
          The event itself is perfectly ready (lanes locked), and nothing about the payload
          changes between the failing and succeeding call — only the carrier's lifecycle
          state moves from REGISTERED to QUALIFIED in between.
        test_recipe:
          setup:
            - "Carrier ALFL created and left in REGISTERED with no qualification review."
            - "One-lane event with the lane validated and locked, so the event is LANES_LOCKED and ready to invite."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProcurementAnalyst
            - call: "POST /freight-procurement/carriers"
              payload: { legal_name: "Alpha Freight Lines", scac_code: "ALFL", diversity_classification: "NONE", service_modes: ["DRY_VAN"], fleet_power_units: 120, auto_liability_limit_usd: 1000000.00, cargo_limit_usd: 250000.00, insurance_expiry_date: "2027-06-30T00:00:00Z" }
              as: ProcurementAnalyst
              captures: { carrier_a_id: $.data.id }
            - call: "POST /freight-procurement/bid-events"
              payload: { name: "Gated Invitation Event", cost_basis: "FORECAST", fuel_index_per_mile: 0.4800, accessorial_inflation_factor: 1.15, rate_floor_per_mile: 1.5000, rounds_allowed: 1, cost_weight: 0.55, service_weight: 0.20, capacity_weight: 0.15, diversity_weight: 0.10, diversity_min_pct: 0.00, max_award_share_pct: 100.00, max_carriers_per_lane: 1, contract_effective_from: "2026-09-01T00:00:00Z", contract_effective_to: "2027-09-01T00:00:00Z" }
              as: ProcurementAnalyst
              captures: { event_id: $.data.id }
            - call: "POST /freight-procurement/bid-events/${event_id}/lanes"
              payload: { lane_code: "L-1147", origin_zip3: "300", dest_zip3: "606", equipment_type: "DRY_VAN", mileage: 1147, annual_volume_loads: 550, service_days_required: 3, accessorial_history_usd_per_load: 137.55, trailing_12m_actual_loads: 480 }
              as: ProcurementAnalyst
              captures: { lane_a_id: $.data.id }
            - call: "POST /freight-procurement/lanes/${lane_a_id}/validate"
              payload: {}
              as: ProcurementAnalyst
            - call: "POST /freight-procurement/bid-events/${event_id}/lock-lanes"
              payload: {}
              as: ProcurementAnalyst
          trigger:
            - call: "POST /freight-procurement/bid-events/${event_id}/invitations"
              payload: { carrier_id: "${carrier_a_id}", nda_required: true }
              as: ProcurementAnalyst
              captures: { err_not_qualified: $.data.error_id }
            - call: "POST /freight-procurement/carriers/${carrier_a_id}/qualification-reviews"
              payload: { required_modes: ["DRY_VAN"], min_auto_liability_usd: 1000000.00, min_cargo_usd: 100000.00 }
              as: ComplianceOfficer
              captures: { review_a_id: $.data.id }
            - call: "POST /freight-procurement/bid-events/${event_id}/invitations"
              payload: { carrier_id: "${carrier_a_id}", nda_required: true }
              as: ProcurementAnalyst
              captures: { err_screening: $.data.error_id }
            - call: "POST /freight-procurement/qualification-reviews/${review_a_id}/insurance-verification"
              payload: { verified_auto_liability_usd: 1000000.00, verified_cargo_usd: 250000.00, verified_expiry_date: "2027-06-30T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /freight-procurement/qualification-reviews/${review_a_id}/capability-screening"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /freight-procurement/qualification-reviews/${review_a_id}/decision"
              payload: { outcome: "APPROVE" }
              as: ComplianceOfficer
            - call: "POST /freight-procurement/bid-events/${event_id}/invitations"
              payload: { carrier_id: "${carrier_a_id}", nda_required: true }
              as: ProcurementAnalyst
              captures: { invite_id: $.data.id }
          assert:
            - "with the carrier in REGISTERED the invitation attempt returns HTTP 409 with error_id ERR_CARRIER_NOT_QUALIFIED, and no Invitation row is created"
            - "with the carrier in SCREENING (review open, decision not recorded) the attempt still returns ERR_CARRIER_NOT_QUALIFIED — a mid-flight review is not standing"
            - "after the APPROVE decision the identical payload returns 201 with Invitation.status SENT, nda_required true, nda_signed false"
            - "Invitation.qualification_snapshot_score == 90.60 — the invitation snapshots the carrier's composite at invitation time"
            - "BidEvent.${event_id}.invited_carrier_count == 1 and accepted_invitation_count == 0"
            - "the failing and succeeding calls are byte-identical in path, payload and acting role: only Carrier.status differed"

      - name: rate_go_live_gated_on_contract_signature_state
        entity_pair: "RateRecord depends on Contract"
        grounds:
          - state_machines.RateRecord.LOADED_to_LIVE
          - state_machines.Contract.signature_status
          - validations.priority_9_state
          - errors.ERR_CONTRACT_NOT_FULLY_SIGNED
        distinguishing_aspect: |
          A different entity pair from Invitation -> Carrier, and the dependency points at a
          different kind of state: not a lifecycle status but one of Contract's parallel
          dimensions, signature_status. The rate record is fully ready in its own dimension
          (LOADED, inside its effective window) and only the parent's signature dimension
          blocks the cutover, so the gate cannot be satisfied by anything the child does.
        test_recipe:
          setup:
            - "Single-lane awarded event for ALFL; the award cascade minted the contract in DRAFT / PENDING_BOTH / NOT_STAGED."
            - "One PRIMARY rate record staged for [2026-09-01, 2027-09-01) and loaded, so RateRecord.status == LOADED and Contract.rate_load_status == LOADED, with signature_status still PENDING_BOTH."
            - "Logical clock advanced to 2026-09-01T00:00:00Z, exactly the inclusive start of the effective window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
