  - rule_id: non_linear_state_machine
    instances:
      - name: sustained_protest_remands_noticed_study_back_to_draft
        grounds:
          - state_machines.FeeStudy.NOTICE_PUBLISHED_to_DRAFT
          - state_machines.FeeStudy.NOTICE_PUBLISHED_to_PROTEST_CLEARED
          - entities.FeeStudy.fields.revision_round
          - entities.ProtestFiling.fields.status
          - entities.FeeProgram.fields.protest_threshold_bp
        distinguishing_aspect: |
          Cyclic, not linear: closing the protest window is a single trigger with two
          divergent targets, and the sustained branch returns a NOTICE_PUBLISHED
          study to DRAFT with revision_round 1, certified_by_user_id null, all notice
          fields null and both RECORDED filings VOIDED with the tally back at 0 -
          after which the same study can be certified again.
        test_recipe:
          setup:
            - "HARBOR program with protest_threshold_bp 5000 (default)."
            - "One PARKS facility standard and one DRAFT PLAN_BASED study with an allocated PARKS component and a SINGLE_FAMILY schedule line."
            - "Study certified by analyst-1 and noticed on 2026-01-15 with notice_days 30, so protest_window_ends_at is 2026-02-14T00:00:00Z."
            - "Two RECORDED protests carrying 3000bp and 2500bp, so protest_weight_bp is 5500 and protest_count is 2."
