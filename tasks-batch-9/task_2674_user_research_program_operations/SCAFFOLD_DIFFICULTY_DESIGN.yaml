            - "Logical clock at 2026-08-01T00:00:00Z"
            - "Pool with a 20000-cent budget, contact cap 2, three POWER_USER / en-US participants"
            - "INTERVIEW study fielded 2026-08-03..2026-08-21, incentive_amount_cents 5000, target 3"
            - "Three invites: 5000 + 5000 + 5250 reserved (the third invite reads a pre-state utilization of exactly 0.50 and takes the 5 percent surcharge tier)"
            - "A FORWARD_ESTIMATE settlement is run while all three recruitments are still INVITED"
            - "Recruitment 1 screens in, is scheduled and COMPLETED; recruitment 2 screens in, is scheduled and then NO_SHOW; recruitment 3 screens out at 50.00"
            - "Fielding closed, so the study sits in ANALYSIS and a binding settlement is permitted"
