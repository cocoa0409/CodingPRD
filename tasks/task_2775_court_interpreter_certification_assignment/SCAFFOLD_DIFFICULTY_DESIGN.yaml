              payload: { assignment_id: "${a1}" }
              as: FiscalOfficer
              captures: { pc1: "$.data[0].id", pc1_prov: "$.data[0].provisional_total_cents" }
          trigger:
            - call: "POST /assignments/${a1}/cancel"
