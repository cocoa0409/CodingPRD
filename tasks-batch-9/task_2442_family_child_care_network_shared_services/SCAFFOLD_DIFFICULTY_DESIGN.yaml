            - "the third attempt returns 201 with ${pred} == ${e1} and ${sc_new} == true"
            - "Enrollment.${e1}.status == TRANSFERRED and exit_on == 2026-08-20T00:00:00Z"
            - "Enrollment.${e_new}.provider_id == ${p2} and child_ref == CH-1 and subsidy_certified == true and start_on == 2026-08-20T00:00:00Z"
