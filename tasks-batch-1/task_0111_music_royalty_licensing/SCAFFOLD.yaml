# =============================================================================
# Music Royalty & Licensing — benchmark seed tables (SCAFFOLD.yaml)
# §1.0–§1.7. Difficulty design and corner design live in sibling files.
# =============================================================================

scenario: |
  Music Royalty & Licensing: composition/recording split (writer/publisher), PRO
  (ASCAP/BMI) performance royalty, mechanical (streaming/physical), sync license
  quote, statement/payout, advance recoupment, territory/term rights

domain_name: music-royalty-licensing
api_prefix: ""   # top-level peer collections (graph topology); no single nesting root

complexity_profile:
  primary_archetype: Ledger reconciliation        # advance recoupment: gross earnings vs recouped balance, two ledger views
  secondary_archetype: Pricing engine             # mechanical statutory tiers + sync quote multi-dimensional pricing
  complexity_layers:
    - dual_variant_calculation                    # provisional (estimated) vs final (statement-locked) royalty
    - cascading_side_effects                       # usage post -> recording earnings -> work earnings -> rightsholder ledger -> advance recoupment
    - rate_threshold_triggers                      # mechanical penny-rate floor crossing; sync term-length tier
    - derived_field_reconciliation                # recouped_cents / unrecouped_balance_cents on Advance and Rightsholder
    - optimistic_concurrency                       # OCC on Statement.version when finalizing; on Work.version when registering shares

  entity_topology: graph
  # Work and Recording are peers joined many-to-many through shares to Rightsholder;
  # usage/sync/advance reference works/recordings by FK; no strict ownership tree.

  state_machine_shape: cyclic
  # Statement DRAFT->FINALIZED with a reopen cycle (FINALIZED->DRAFT); SyncQuote
  # negotiation loop (COUNTERED->DRAFT); plus branching on SyncQuote acceptance.

  relationship_patterns:
    - many_to_many        # Work <-> Rightsholder via CompositionShare; Recording <-> Rightsholder via RecordingShare
    - cross_aggregate     # UsageEvent references Recording; Recording references Work; Advance references Rightsholder
    - polymorphic         # LedgerEntry.source_type references one of {UsageEvent, SyncLicense, Advance, Statement}

  role_model: peer_roles
  # Administrator (catalog/registration), RoyaltyOperator (usage ingest, statements,
  # payouts), Licensee (sync quote requests/accept), Rightsholder (read own ledger).

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Rightsholder
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: legal_name, type: string, source: input, description: "Payee legal name" }
      - { name: party_type, type: enum, source: input, description: "WRITER | PUBLISHER | LABEL", constraints: "one of WRITER, PUBLISHER, LABEL" }
      - { name: payee_country, type: string, source: input, description: "ISO 3166-1 alpha-2 country of the payee (e.g. US, GB, DE)" }
      - { name: minimum_payout_cents, type: integer, source: input, default: 5000, description: "Payout threshold; period net below this is carried forward, not paid", constraints: ">= 0" }
      - { name: withholding_pct, type: number, source: input, default: 0, description: "Foreign tax withholding rate applied at payout, 0.0–0.30", constraints: "0 <= x <= 0.30" }
      - { name: lifetime_earned_cents, type: integer, source: computed, description: "Sum of LedgerEntry.amount_cents (type=EARNING) across all finalized statements for this rightsholder" }
      - { name: unrecouped_balance_cents, type: integer, source: computed, description: "Sum over this rightsholder's ACTIVE advances of (advance.principal_cents - advance.recouped_cents); floored at 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED — SUSPENDED blocks payouts", default: ACTIVE }

  - name: Work
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Composition title" }
      - { name: iswc, type: string, source: input, description: "International Standard Musical Work Code; unique across works" }
      - { name: pro_affiliation, type: enum, source: input, description: "ASCAP | BMI | NONE — the PRO collecting performance royalties for this composition", constraints: "one of ASCAP, BMI, NONE" }
      - { name: duration_seconds, type: integer, source: input, description: "Composition running time in seconds", constraints: "> 0" }
      - { name: shares_locked, type: boolean, source: system, description: "True once composition splits sum to exactly 100% and Work is registered", default: false }
      - { name: split_total_bps, type: integer, source: computed, description: "Sum of all CompositionShare.split_bps for this work in basis points (10000 = 100%)" }

  - name: CompositionShare
    parent: null
    common_fields: true
    fields:
      - { name: work_id, type: string, source: input, description: "FK -> Work.id; the composition this share belongs to" }
      - { name: rightsholder_id, type: string, source: input, description: "FK -> Rightsholder.id; the writer or publisher holding this share" }
      - { name: role, type: enum, source: input, description: "WRITER | PUBLISHER", constraints: "one of WRITER, PUBLISHER" }
      - { name: split_bps, type: integer, source: input, description: "Ownership share in basis points (10000 = 100%)", constraints: "1 <= x <= 10000" }

  - name: Recording
    parent: null
    common_fields: true
    fields:
      - { name: work_id, type: string, source: input, description: "FK -> Work.id; the composition embodied by this master recording" }
      - { name: isrc, type: string, source: input, description: "International Standard Recording Code; unique across recordings" }
      - { name: title, type: string, source: input, description: "Recording (master) title" }
      - { name: release_type, type: enum, source: input, description: "STREAMING | PHYSICAL — drives mechanical rate basis", constraints: "one of STREAMING, PHYSICAL" }
      - { name: duration_seconds, type: integer, source: input, description: "Recording running time in seconds; drives mechanical penny-rate for durations over 5 minutes", constraints: "> 0" }
      - { name: shares_locked, type: boolean, source: system, description: "True once recording splits sum to exactly 100%", default: false }
      - { name: split_total_bps, type: integer, source: computed, description: "Sum of all RecordingShare.split_bps for this recording in basis points" }

  - name: RecordingShare
    parent: null
    common_fields: true
    fields:
      - { name: recording_id, type: string, source: input, description: "FK -> Recording.id; the master this share belongs to" }
      - { name: rightsholder_id, type: string, source: input, description: "FK -> Rightsholder.id; the label or party holding this master share" }
      - { name: split_bps, type: integer, source: input, description: "Master ownership share in basis points (10000 = 100%)", constraints: "1 <= x <= 10000" }

  - name: RightsWindow
    parent: null
    common_fields: true
    fields:
      - { name: recording_id, type: string, source: input, description: "FK -> Recording.id; the master whose territory/term rights this window grants" }
      - { name: territory, type: string, source: input, description: "ISO 3166-1 alpha-2 territory code, or 'WW' for worldwide" }
      - { name: rights_type, type: enum, source: input, description: "SYNC | MECHANICAL | PERFORMANCE — which exploitation this window authorizes", constraints: "one of SYNC, MECHANICAL, PERFORMANCE" }
      - { name: term_start, type: datetime, source: input, description: "Inclusive UTC start of the rights term" }
      - { name: term_end, type: datetime, source: input, description: "Exclusive UTC end of the rights term (half-open interval [start, end))" }
      - { name: status, type: enum, source: system, description: "ACTIVE | REVOKED", default: ACTIVE }

  - name: UsageEvent
    parent: null
    common_fields: true
    fields:
      - { name: recording_id, type: string, source: input, description: "FK -> Recording.id; the master that was exploited" }
      - { name: usage_type, type: enum, source: input, description: "PERFORMANCE | MECHANICAL — performance routes to the PRO, mechanical to statutory rate", constraints: "one of PERFORMANCE, MECHANICAL" }
      - { name: territory, type: string, source: input, description: "ISO 3166-1 alpha-2 territory where the usage occurred" }
      - { name: occurred_at, type: datetime, source: input, description: "UTC instant the usage occurred; must fall inside an ACTIVE RightsWindow of the matching rights_type" }
      - { name: quantity, type: integer, source: input, description: "Stream/spin/unit count for the usage", constraints: ">= 1" }
      - { name: gross_revenue_cents, type: integer, source: input, description: "Gross revenue reported by the source for PERFORMANCE usage; ignored for MECHANICAL (statutory rate used instead)", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "INGESTED | ALLOCATED | VOIDED", default: INGESTED }
      - { name: royalty_cents, type: integer, source: computed, description: "Total royalty computed for this event (performance pool or mechanical statutory); 0 until ALLOCATED" }
      - { name: allocated_holder_count, type: integer, source: computed, description: "Number of distinct rightsholders that received an EARNING ledger entry from this event; 0 until ALLOCATED" }

  - name: SyncLicense
    parent: null
    common_fields: true
    fields:
      - { name: recording_id, type: string, source: input, description: "FK -> Recording.id; the master to be synchronized" }
      - { name: licensee_id, type: string, source: input, description: "FK -> Rightsholder.id; the requesting party (party_type LABEL acting as licensee)" }
      - { name: media_type, type: enum, source: input, description: "FILM | TV | AD | GAME — base fee tier driver", constraints: "one of FILM, TV, AD, GAME" }
      - { name: territory, type: string, source: input, description: "Requested territory (alpha-2 or 'WW'); must be covered by an ACTIVE SYNC RightsWindow" }
      - { name: term_months, type: integer, source: input, description: "Requested license term length in months; drives the term multiplier tier", constraints: ">= 1" }
      - { name: base_fee_cents, type: integer, source: input, description: "Operator-proposed base fee before multipliers", constraints: ">= 0" }
      - { name: quoted_fee_cents, type: integer, source: computed, description: "Computed quote = base_fee_cents * media multiplier * term multiplier * territory multiplier, rounded per §1.3" }
      - { name: status, type: enum, source: system, description: "DRAFT | COUNTERED | ACCEPTED | EXECUTED | DECLINED", default: DRAFT }
      - { name: counter_fee_cents, type: integer, source: input, description: "Licensee counter-offer fee; set on COUNTER", default: 0 }

  - name: Advance
    parent: null
    common_fields: true
    fields:
      - { name: rightsholder_id, type: string, source: input, description: "FK -> Rightsholder.id; the recipient whose future earnings recoup this advance" }
      - { name: principal_cents, type: integer, source: input, description: "Advance principal paid out up front", constraints: ">= 1" }
      - { name: recoupment_pct, type: number, source: input, description: "Fraction of each period's gross earning withheld to recoup, 0.0–1.0", default: 1.0, constraints: "0 < x <= 1.0" }
      - { name: recouped_cents, type: integer, source: computed, description: "Cumulative amount recouped from finalized statements; 0..principal_cents" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RECOUPED | WRITTEN_OFF", default: ACTIVE }

  - name: Statement
    parent: Rightsholder
    common_fields: true
    fields:
      - { name: rightsholder_id, type: string, source: system, description: "FK -> Rightsholder.id; the payee this statement settles" }
      - { name: period_start, type: datetime, source: input, description: "Inclusive UTC start of the statement royalty period" }
      - { name: period_end, type: datetime, source: input, description: "Exclusive UTC end of the statement period (half-open [start, end))" }
      - { name: gross_earnings_cents, type: integer, source: computed, description: "Sum of LedgerEntry.amount_cents (type=EARNING) attached to this statement" }
      - { name: recoupment_applied_cents, type: integer, source: computed, description: "Amount of this period's gross applied to outstanding advances on finalize" }
      - { name: withholding_cents, type: integer, source: computed, description: "Foreign tax withheld at finalize" }
      - { name: net_payable_cents, type: integer, source: computed, description: "gross - recoupment - withholding, floored at 0" }
      - { name: carried_forward_cents, type: integer, source: computed, description: "net_payable carried to next period when below rightsholder.minimum_payout_cents at finalize" }
      - { name: status, type: enum, source: system, description: "DRAFT | FINALIZED | PAID", default: DRAFT }

  - name: LedgerEntry
    parent: Statement
    common_fields: false   # id + created_at only; append-only audit row
    fields:
      - { name: statement_id, type: string, source: system, description: "FK -> Statement.id; the statement this entry rolls up into (authoritative link; reach the payee through statement.rightsholder_id)" }
      - { name: rightsholder_id, type: string, source: system, description: "Denormalized copy of the parent statement's rightsholder_id for fast ledger reads; equals Statement.rightsholder_id (not an independent FK)" }
      - { name: entry_type, type: enum, source: system, description: "EARNING | RECOUPMENT | WITHHOLDING — sign and meaning of amount_cents", constraints: "one of EARNING, RECOUPMENT, WITHHOLDING" }
      - { name: source_type, type: enum, source: system, description: "USAGE_EVENT | SYNC_LICENSE | ADVANCE | STATEMENT — polymorphic source kind", constraints: "one of USAGE_EVENT, SYNC_LICENSE, ADVANCE, STATEMENT" }
      - { name: source_id, type: string, source: system, description: "Polymorphic id of the source row named by source_type (UsageEvent / SyncLicense / Advance / Statement)" }
      - { name: amount_cents, type: integer, source: system, description: "Signed cents: positive for EARNING, negative for RECOUPMENT and WITHHOLDING" }

  - name: Payout
    parent: null
    common_fields: true
    fields:
      - { name: statement_id, type: string, source: input, description: "FK -> Statement.id; the FINALIZED statement being paid (authoritative link; reach the payee through statement.rightsholder_id)" }
      - { name: rightsholder_id, type: string, source: system, description: "Denormalized copy of the paid statement's rightsholder_id; equals Statement.rightsholder_id (not an independent FK)" }
      - { name: amount_cents, type: integer, source: computed, description: "Equals statement.net_payable_cents at the moment of payout" }
      - { name: status, type: enum, source: system, description: "PENDING | SETTLED | REVERSED", default: PENDING }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Work
    field: shares_locked
    note: |
      Work has no full lifecycle enum; shares_locked is a boolean gate. Set true by
      POST /works/{id}/register only when split_total_bps == 10000 (all CompositionShare
      sum to exactly 100%). Once true, CompositionShare creation is rejected.

  - entity: SyncLicense
    initial_state: DRAFT
    terminal_states: [EXECUTED, DECLINED]
    transitions:
      - from: DRAFT
        to: COUNTERED
        trigger: "POST /sync-licenses/{id}/counter"
        actor: Licensee
        preconditions:
          - "SyncLicense.status == DRAFT (ERR_INVALID_STATE)"
          - "acting Licensee.id == SyncLicense.licensee_id (ERR_NOT_RESOURCE_OWNER)"
          - "counter_fee_cents >= 1 (ERR_INVALID_REQUEST)"
        side_effects:
          - "SyncLicense.counter_fee_cents set to request value"
          - "increments SyncLicense.version by 1"
      - from: COUNTERED
        to: DRAFT
        trigger: "POST /sync-licenses/{id}/requote"
        actor: RoyaltyOperator
        preconditions:
          - "SyncLicense.status == COUNTERED (ERR_INVALID_STATE)"
        side_effects:
          - "SyncLicense.base_fee_cents reset to request value"
          - "SyncLicense.quoted_fee_cents recomputed via sync_quote_fee (negotiation loop COUNTERED->DRAFT)"
          - "increments SyncLicense.version by 1"
      - from: DRAFT
        to: ACCEPTED
        trigger: "POST /sync-licenses/{id}/accept"
        actor: Licensee
        preconditions:
          - "SyncLicense.status == DRAFT (ERR_INVALID_STATE)"
          - "acting Licensee.id == SyncLicense.licensee_id (ERR_NOT_RESOURCE_OWNER)"
          - "an ACTIVE RightsWindow exists for the recording with rights_type=SYNC, status=ACTIVE, whose territory covers SyncLicense.territory (ERR_RIGHTS_NOT_AVAILABLE)"
        side_effects:
          - "increments SyncLicense.version by 1"
      - from: COUNTERED
        to: ACCEPTED
        trigger: "POST /sync-licenses/{id}/accept"
        actor: RoyaltyOperator
        preconditions:
          - "SyncLicense.status == COUNTERED (ERR_INVALID_STATE)"
          - "an ACTIVE RightsWindow exists for the recording with rights_type=SYNC covering territory (ERR_RIGHTS_NOT_AVAILABLE)"
        side_effects:
          - "SyncLicense.quoted_fee_cents set to SyncLicense.counter_fee_cents (operator accepts the counter)"
          - "increments SyncLicense.version by 1"
      - from: ACCEPTED
        to: EXECUTED
        trigger: "POST /sync-licenses/{id}/execute"
        actor: RoyaltyOperator
        preconditions:
          - "SyncLicense.status == ACCEPTED (ERR_INVALID_STATE)"
          - "the recording's Work.shares_locked == true AND Recording.shares_locked == true (ERR_SHARES_NOT_LOCKED)"
          - "every RecordingShare holder has a DRAFT Statement whose [period_start, period_end) contains the server clock current UTC (ERR_NO_OPEN_STATEMENT)"
        side_effects:
          - "EARNING distribution: a LedgerEntry (entry_type=EARNING, source_type=SYNC_LICENSE, source_id=this SyncLicense.id) is created for each RecordingShare holder, amount_cents = round_half_up(quoted_fee_cents * share.split_bps / 10000); the pool total quoted_fee_cents is rounded once at quote time, then each holder allocation is rounded once here"
          - "each holder's EARNING entry attaches to that holder's DRAFT Statement whose half-open [period_start, period_end) contains the server clock current UTC; if no such DRAFT statement exists, allocation fails with ERR_NO_OPEN_STATEMENT (operator must open the period statement first)"
          - "cascade: each affected Statement.gross_earnings_cents recomputed; each affected DRAFT Statement.version increments by 1 (lifetime_earned_cents is only recomputed at finalize, not here)"
          - "increments SyncLicense.version by 1"
      - from: DRAFT
        to: DECLINED
        trigger: "POST /sync-licenses/{id}/decline"
        actor: RoyaltyOperator
        preconditions:
          - "SyncLicense.status in {DRAFT, COUNTERED} (ERR_INVALID_STATE)"
        side_effects:
          - "increments SyncLicense.version by 1"
      - from: COUNTERED
        to: DECLINED
        trigger: "POST /sync-licenses/{id}/decline"
        actor: RoyaltyOperator
        preconditions:
          - "SyncLicense.status in {DRAFT, COUNTERED} (ERR_INVALID_STATE)"
        side_effects:
          - "increments SyncLicense.version by 1"

  - entity: UsageEvent
    initial_state: INGESTED
    terminal_states: [VOIDED]
    transitions:
      - from: INGESTED
        to: ALLOCATED
        trigger: "POST /usage-events/{id}/allocate"
        actor: RoyaltyOperator
        preconditions:
          - "UsageEvent.status == INGESTED (ERR_INVALID_STATE)"
          - "the recording's Work.shares_locked == true AND Recording.shares_locked == true (ERR_SHARES_NOT_LOCKED)"
          - "an ACTIVE RightsWindow exists for the recording whose rights_type matches usage_type's licensing class (PERFORMANCE->PERFORMANCE, MECHANICAL->MECHANICAL), status=ACTIVE, territory covers UsageEvent.territory, and term covers occurred_at (ERR_RIGHTS_NOT_AVAILABLE)"
          - "every distribution-target holder has a DRAFT Statement whose [period_start, period_end) contains occurred_at (ERR_NO_OPEN_STATEMENT)"
        side_effects:
          - "UsageEvent.royalty_cents computed: PERFORMANCE via performance_pool_royalty, MECHANICAL via mechanical_statutory_royalty"
          - "cascade L1: for PERFORMANCE, distribute royalty_cents across the Work's CompositionShare holders by split_bps; for MECHANICAL, distribute across the Recording's RecordingShare holders by split_bps; one LedgerEntry (entry_type=EARNING, source_type=USAGE_EVENT, source_id=this UsageEvent.id) per holder attached to that holder's DRAFT Statement whose half-open [period_start, period_end) contains occurred_at; if any holder has no such DRAFT statement, allocation fails with ERR_NO_OPEN_STATEMENT and nothing is written"
          - "cascade L2: each affected Statement.gross_earnings_cents recomputed from its EARNING ledger entries; each affected DRAFT Statement.version increments by 1"
          - "UsageEvent.allocated_holder_count set to the number of distinct holders that received an EARNING entry"
          - "UsageEvent.status -> ALLOCATED"
      - from: INGESTED
        to: VOIDED
        trigger: "POST /usage-events/{id}/void"
        actor: RoyaltyOperator
        preconditions:
          - "UsageEvent.status == INGESTED (ERR_INVALID_STATE); an ALLOCATED event cannot be voided once it is on a statement"
        side_effects:
          - "UsageEvent.status -> VOIDED"

  - entity: Statement
    initial_state: DRAFT
    terminal_states: [PAID]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /statements/{id}/finalize"
        actor: RoyaltyOperator
        preconditions:
          - "Statement.status == DRAFT (ERR_INVALID_STATE)"
          - "request expected_statement_version matches Statement.version (ERR_STALE_VERSION, 412)"
          - "the Rightsholder has no INGESTED (unallocated) UsageEvent whose occurred_at falls in [period_start, period_end) and whose distribution targets this rightsholder (ERR_UNALLOCATED_USAGE_IN_PERIOD)"
        side_effects:
          - "compute recoupment_applied_cents via advance_recoupment over the rightsholder's ACTIVE advances (chronological by Advance.created_at)"
          - "cascade L1: each recouped Advance.recouped_cents increased; an Advance reaching recouped_cents == principal_cents transitions ACTIVE->RECOUPED"
          - "cascade L2: a RECOUPMENT LedgerEntry (source_type=ADVANCE) is appended for each advance touched; Statement.recoupment_applied_cents recomputed"
          - "compute withholding_cents = round_half_up((gross_earnings_cents - recoupment_applied_cents) * rightsholder.withholding_pct); append a WITHHOLDING LedgerEntry (source_type=STATEMENT)"
          - "compute net_payable_cents = max(0, gross_earnings_cents - recoupment_applied_cents - withholding_cents)"
          - "cascade L3: Rightsholder.lifetime_earned_cents recomputed (sum of EARNING entries over FINALIZED statements); Rightsholder.unrecouped_balance_cents recomputed from ACTIVE advances"
          - "if net_payable_cents < rightsholder.minimum_payout_cents: carried_forward_cents = net_payable_cents, net_payable_cents -> 0"
          - "Statement.status -> FINALIZED"
          - "increments Statement.version by 1"
      - from: FINALIZED
        to: DRAFT
        trigger: "POST /statements/{id}/reopen"
        actor: RoyaltyOperator
        preconditions:
          - "Statement.status == FINALIZED (ERR_INVALID_STATE)"
          - "no SETTLED Payout references this statement (ERR_PAYOUT_EXISTS)"
          - "request expected_statement_version matches Statement.version (ERR_STALE_VERSION, 412)"
        side_effects:
          - "compensation: each RECOUPMENT LedgerEntry for this statement is reversed — the corresponding Advance.recouped_cents is decreased by the reversed amount and a RECOUPED advance reverts to ACTIVE if recouped_cents < principal_cents"
          - "compensation: the WITHHOLDING LedgerEntry is removed; recoupment_applied_cents, withholding_cents, net_payable_cents, carried_forward_cents reset to 0"
          - "cascade: Rightsholder.lifetime_earned_cents and unrecouped_balance_cents recomputed (cyclic reopen loop FINALIZED->DRAFT)"
          - "Statement.status -> DRAFT"
          - "increments Statement.version by 1"
      - from: FINALIZED
        to: PAID
        trigger: "POST /payouts (creates Payout referencing this statement)"
        actor: RoyaltyOperator
        preconditions:
          - "Statement.status == FINALIZED (ERR_INVALID_STATE)"
          - "Rightsholder.status == ACTIVE (ERR_RIGHTSHOLDER_SUSPENDED)"
          - "Statement.net_payable_cents >= 1 (ERR_NOTHING_PAYABLE)"
        side_effects:
          - "Payout created with amount_cents = Statement.net_payable_cents, status PENDING"
          - "Statement.status -> PAID"
          - "increments Statement.version by 1"

  - entity: Advance
    initial_state: ACTIVE
    terminal_states: [RECOUPED, WRITTEN_OFF]
    transitions:
      - from: ACTIVE
        to: RECOUPED
        trigger: "system: statement finalize recoups remaining principal"
        actor: system
        preconditions:
          - "Advance.recouped_cents == Advance.principal_cents after a finalize cascade"
        side_effects:
          - "Advance.status -> RECOUPED"
      - from: ACTIVE
        to: WRITTEN_OFF
        trigger: "POST /advances/{id}/write-off"
        actor: Administrator
        preconditions:
          - "Advance.status == ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "remaining unrecouped principal is forgiven; Rightsholder.unrecouped_balance_cents recomputed (excludes WRITTEN_OFF advances)"
          - "Advance.status -> WRITTEN_OFF"
      - from: RECOUPED
        to: ACTIVE
        trigger: "system: statement reopen reverses recoupment below principal"
        actor: system
        preconditions:
          - "a reopen compensation drops Advance.recouped_cents below principal_cents"
        side_effects:
          - "Advance.status -> ACTIVE"

  - entity: Payout
    initial_state: PENDING
    terminal_states: [REVERSED]
    transitions:
      - from: PENDING
        to: SETTLED
        trigger: "POST /payouts/{id}/settle"
        actor: RoyaltyOperator
        preconditions:
          - "Payout.status == PENDING (ERR_INVALID_STATE)"
        side_effects:
          - "Payout.status -> SETTLED"
      - from: PENDING
        to: REVERSED
        trigger: "POST /payouts/{id}/reverse"
        actor: RoyaltyOperator
        preconditions:
          - "Payout.status == PENDING (ERR_INVALID_STATE); a SETTLED payout cannot be reversed"
        side_effects:
          - "Payout.status -> REVERSED"
          - "referenced Statement.status reverts PAID->FINALIZED so it can be re-paid or reopened"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: statement-finalize-stale-version
    parent_entity: Statement
    write_endpoint: "POST /statements/{id}/finalize"
    occ_field: "expected_statement_version"
    description: |
      Finalizing a Statement whose version has advanced since the client last
      observed it is rejected. A prior writer may have allocated additional
      usage into the same DRAFT statement (bumping its version via the
      gross_earnings recompute) so the current finalizer's view of the
      statement total is stale; the finalize is rejected with a stale-version
      error rather than locking in an out-of-date gross.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: statement-reopen-stale-version
    parent_entity: Statement
    write_endpoint: "POST /statements/{id}/reopen"
    occ_field: "expected_statement_version"
    description: |
      Reopening a Statement whose version has advanced (e.g. it was just paid,
      moving FINALIZED->PAID and bumping version) against a stale client view is
      rejected. The reopen carries the version the client last read; if it no
      longer matches, the reopen is rejected so a stale actor cannot unwind a
      statement whose downstream state has already moved on.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: performance_pool_royalty
    trigger: "UsageEvent INGESTED->ALLOCATED for usage_type=PERFORMANCE"
    algorithm: weighted_scoring
    formula: |
      # Performance royalty: the PRO pays a pool keyed on affiliation and
      # weighted by the composition's duration relative to a 3-minute baseline.
      pro_rate = PRO_RATE[work.pro_affiliation]            # cents per "stream-minute", per PRO
      if work.pro_affiliation == NONE: royalty_cents = 0   # NONE earns no performance royalty
      duration_weight = min(work.duration_seconds / 180.0, DURATION_CAP)   # cap long works
      raw = gross_revenue_cents * POOL_SHARE + quantity * pro_rate * duration_weight
      royalty_cents = round_half_up(raw)                   # ONE rounding, at the pool total (sum-then-round)
      # Distributed afterward to CompositionShare holders: per-holder
      #   share_cents = round_half_up(royalty_cents * share.split_bps / 10000)
      # NOTE: rounding order is fixed — round the pool total first (above),
      #       THEN allocate to holders with a second per-holder round_half_up.
    input_set: "single UsageEvent (usage_type=PERFORMANCE); work resolved via recording.work_id"
    constants:
      PRO_RATE: { ASCAP: 12, BMI: 11, NONE: 0 }
      POOL_SHARE: 0.50
      DURATION_CAP: 3.0
    precision: "integer cents, round_half_up; pool total rounded once, then per-holder allocation rounded once each"
    variants:
      - name: provisional
        when: "UsageEvent.status == ALLOCATED but its Statement is still DRAFT"
        difference: "royalty_cents is an estimate exposed on the event but NOT yet counted in Rightsholder.lifetime_earned_cents (which only sums EARNING entries on FINALIZED statements)"
      - name: final
        when: "the holder's Statement transitions DRAFT->FINALIZED"
        difference: "the same EARNING ledger entries now count toward lifetime_earned_cents; the number does not change, but its accounting status flips provisional->final"

  - name: mechanical_statutory_royalty
    trigger: "UsageEvent INGESTED->ALLOCATED for usage_type=MECHANICAL"
    algorithm: tiered_pricing
    formula: |
      # Mechanical statutory: penny-rate per unit, with a long-song uplift.
      # Penny-rate tier is keyed on recording.duration_seconds, threshold at 300s (5:00):
      if recording.duration_seconds <= 300:
          rate = BASE_PENNY_RATE                                  # <= 5:00 : flat baseline
      else:
          # > 5:00 : PER_MINUTE_RATE per STARTED minute, floored at the baseline
          rate = max(BASE_PENNY_RATE, PER_MINUTE_RATE * ceil(recording.duration_seconds / 60.0))
      # release_type basis:
      if recording.release_type == PHYSICAL:
          royalty_cents = round_half_up(rate * quantity)          # physical units
      else: # STREAMING
          royalty_cents = round_half_up(rate * quantity * STREAM_FACTOR)
      # Pool total (royalty_cents) rounded ONCE above, THEN distributed to
      # RecordingShare holders by split_bps with a second per-holder round_half_up:
      #   holder_cents = round_half_up(royalty_cents * share.split_bps / 10000)
    input_set: "single UsageEvent (usage_type=MECHANICAL); recording resolved via recording_id"
    constants:
      BASE_PENNY_RATE: 12     # 12.0 cents per unit baseline (<= 5:00)
      PER_MINUTE_RATE: 2      # 2.0 cents per started minute for long songs
      STREAM_FACTOR: 0.01     # streams pay 1% of the physical penny-rate per stream
    precision: "integer cents, round_half_up; threshold at duration_seconds 300 (>300 enters per-minute tier)"
    variants:
      - name: physical_basis
        when: "recording.release_type == PHYSICAL"
        difference: "royalty = rate * quantity (full penny-rate per physical unit)"
      - name: streaming_basis
        when: "recording.release_type == STREAMING"
        difference: "royalty = rate * quantity * STREAM_FACTOR (1% of physical rate per stream)"

  - name: sync_quote_fee
    trigger: "POST /sync-licenses (create) and POST /sync-licenses/{id}/requote"
    algorithm: tiered_pricing
    formula: |
      # Sync quote: base fee scaled by three independent multipliers, with a
      # CIRCULAR-LOOKING dependency resolved by a pinned evaluation order:
      #   the territory multiplier depends on the post-media-scaled subtotal tier,
      #   so media scaling is applied FIRST, then territory tier is selected from
      #   that subtotal, then term multiplier is applied last.
      media_mult = MEDIA_MULT[media_type]                # FILM 2.0, TV 1.5, AD 3.0, GAME 1.25
      subtotal = base_fee_cents * media_mult             # step 1 (no rounding yet)
      # step 2: territory tier keyed on subtotal magnitude (>= boundaries)
      if territory == "WW":           terr_mult = 2.5
      elif subtotal >= 500000:        terr_mult = 1.0    # large single-territory deals: no surcharge
      else:                           terr_mult = 1.2    # small single-territory deals: surcharge
      # step 3: term multiplier tier on term_months (>= boundaries)
      if   term_months >= 36: term_mult = 1.6
      elif term_months >= 12: term_mult = 1.3
      else:                   term_mult = 1.0
      quoted_fee_cents = round_half_up(subtotal * terr_mult * term_mult)   # single final round
    input_set: "single SyncLicense (uses base_fee_cents, media_type, territory, term_months)"
    constants:
      MEDIA_MULT: { FILM: 2.0, TV: 1.5, AD: 3.0, GAME: 1.25 }
      TERR_WW_MULT: 2.5
      TERR_SMALL_DEAL_MULT: 1.2
      TERR_LARGE_DEAL_MULT: 1.0
      LARGE_DEAL_SUBTOTAL_CENTS: 500000
    precision: "integer cents, round_half_up applied ONCE to the full product (subtotal * terr_mult * term_mult)"
    variants:
      - name: worldwide
        when: "territory == 'WW'"
        difference: "terr_mult is a flat 2.5 regardless of subtotal tier"
      - name: single_territory
        when: "territory != 'WW'"
        difference: "terr_mult is selected from the subtotal tier (1.0 if subtotal >= 500000 else 1.2) — the circular-looking dependency"

  - name: advance_recoupment
    trigger: "Statement DRAFT->FINALIZED"
    algorithm: chronological
    formula: |
      # Recoup this period's gross against the rightsholder's ACTIVE advances,
      # OLDEST FIRST (Advance.created_at ASC; tie-break Advance.created_at then
      # never id). Each advance recoups up to recoupment_pct of the *remaining*
      # gross at its turn:
      remaining_gross = statement.gross_earnings_cents
      recoupment_applied = 0
      for adv in active_advances_sorted_by_created_at_asc:
          outstanding = adv.principal_cents - adv.recouped_cents
          if outstanding <= 0: continue
          eligible = floor(remaining_gross * adv.recoupment_pct)   # this period's withholdable share
          take = min(outstanding, eligible)
          adv.recouped_cents += take
          recoupment_applied += take
          remaining_gross -= take                                  # later advances see reduced gross
      statement.recoupment_applied_cents = recoupment_applied
    input_set: "rightsholder's advances with status==ACTIVE; chronological by created_at ASC"
    constants:
      ROUNDING: "floor on the per-advance eligible share so total recoupment never exceeds gross"
    precision: "integer cents; floor on eligible; processing order created_at ASC (NOT id)"
    variants:
      - name: full_recoupment_view
        when: "remaining_gross fully absorbs all outstanding principal"
        difference: "every touched advance reaches RECOUPED; recoupment_applied == sum of outstanding; net floors at gross - recoupment"
      - name: partial_recoupment_view
        when: "outstanding principal exceeds eligible gross"
        difference: "advances stay ACTIVE with recouped_cents < principal_cents; recoupment_applied == eligible portion; remainder rolls to future periods"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "acting role is permitted for this operation per §1.7 RBAC"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "every resource named in the path exists (left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 4
    category: business_referential
    check: "every FK in the request body resolves to an existing entity (recording_id, work_id, rightsholder_id, licensee_id, statement_id)"
    error_id: ERR_FK_NOT_FOUND
    http_status: 422
    applies_to: "all POST/PATCH with FK body fields"
  - priority: 5
    category: business_constraint
    check: "request body is well-formed: required fields present, enums in range, integers within declared constraints (split_bps 1..10000, quantity>=1, term_months>=1, withholding_pct in [0,0.30])"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 6
    category: state
    check: "target resource is in a state from which the requested transition is defined in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 7
    category: business_referential
    check: "the acting entity_backed user owns the resource where ownership is required (Licensee == SyncLicense.licensee_id; Rightsholder == own ledger/statement)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "Licensee sync actions; Rightsholder reads of own statements"
  - priority: 8
    category: business_constraint
    check: "ISWC is unique across works on Work create; ISRC is unique across recordings on Recording create"
    error_id: ERR_DUPLICATE_CODE
    http_status: 409
    applies_to: "POST /works, POST /recordings"
  - priority: 9
    category: business_constraint
    check: "adding a CompositionShare/RecordingShare would not push the parent's split_total_bps above 10000; on Work register / Recording lock-shares split_total_bps must equal exactly 10000"
    error_id: ERR_SPLIT_TOTAL_INVALID
    http_status: 422
    applies_to: "POST /composition-shares, POST /recording-shares, POST /works/{id}/register, POST /recordings/{id}/lock-shares"
  - priority: 10
    category: business_constraint
    check: "shares cannot be added once shares_locked == true on the referenced parent Work/Recording"
    error_id: ERR_SHARES_LOCKED
    http_status: 409
    applies_to: "POST /composition-shares, POST /recording-shares"
  - priority: 11
    category: business_referential
    check: "the recording's Work.shares_locked == true (and Recording.shares_locked too) before usage allocation or sync execution"
    error_id: ERR_SHARES_NOT_LOCKED
    http_status: 409
    applies_to: "POST /usage-events/{id}/allocate, POST /sync-licenses/{id}/execute"
  - priority: 12
    category: business_temporal
    check: "an ACTIVE RightsWindow of the matching rights_type covers the requested territory AND (for usage) the occurred_at instant within its half-open [term_start, term_end)"
    error_id: ERR_RIGHTS_NOT_AVAILABLE
    http_status: 422
    applies_to: "POST /usage-events/{id}/allocate, POST /sync-licenses/{id}/accept"
  - priority: 13
    category: state
    check: "every distribution-target holder has a DRAFT Statement whose [period_start, period_end) contains the usage occurred_at (allocate) or the server clock current UTC (sync execute)"
    error_id: ERR_NO_OPEN_STATEMENT
    http_status: 409
    applies_to: "POST /usage-events/{id}/allocate, POST /sync-licenses/{id}/execute"
  - priority: 14
    category: business_temporal
    check: "a new RightsWindow of the same rights_type on the same recording+territory must not overlap an existing ACTIVE window. Interval arithmetic: SYNC windows require a strict 1-day (86400s) COOLDOWN BUFFER between windows (new.term_start must be >= existing.term_end + 86400s, or new.term_end + 86400s <= existing.term_start), whereas MECHANICAL/PERFORMANCE use plain half-open [start,end) non-overlap where touching boundaries (new.term_start == existing.term_end) are ALLOWED"
    error_id: ERR_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /rights-windows"
  - priority: 15
    category: business_temporal
    check: "a new Statement's [period_start, period_end) must not overlap any existing non-PAID Statement (status in {DRAFT, FINALIZED}) for the same rightsholder. Interval arithmetic: plain half-open overlap with NO buffer — touching boundaries (new.period_start == existing.period_end) are ALLOWED; any interior overlap is rejected. This differs from RightsWindow's buffered SYNC arithmetic."
    error_id: ERR_STATEMENT_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /statements"
  - priority: 16
    category: state
    check: "a statement cannot finalize while an INGESTED UsageEvent whose distribution targets this rightsholder falls inside the statement period"
    error_id: ERR_UNALLOCATED_USAGE_IN_PERIOD
    http_status: 409
    applies_to: "POST /statements/{id}/finalize"
  - priority: 17
    category: business_constraint
    check: "OCC: expected_statement_version equals Statement.version on finalize/reopen"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /statements/{id}/finalize, POST /statements/{id}/reopen"
  - priority: 18
    category: state
    check: "a FINALIZED statement referenced by a SETTLED payout cannot be reopened"
    error_id: ERR_PAYOUT_EXISTS
    http_status: 409
    applies_to: "POST /statements/{id}/reopen"
  - priority: 19
    category: business_fiscal
    check: "rightsholder.status == ACTIVE before a payout is created"
    error_id: ERR_RIGHTSHOLDER_SUSPENDED
    http_status: 409
    applies_to: "POST /payouts"
  - priority: 20
    category: business_fiscal
    check: "statement.net_payable_cents >= 1 before a payout is created"
    error_id: ERR_NOTHING_PAYABLE
    http_status: 409
    applies_to: "POST /payouts"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Rightsholders ----
  - method: POST
    path: "/rightsholders"
    description: "Create a payee party"
    roles: [Administrator]
    code: 201
    input: [legal_name, party_type, payee_country, "minimum_payout_cents?", "withholding_pct?"]
    output: Rightsholder
    side_effects: ["status defaults ACTIVE; lifetime_earned_cents=0; unrecouped_balance_cents=0"]
  - method: GET
    path: "/rightsholders/{id}"
    description: "Read a rightsholder (computed ledger fields included)"
    roles: [Administrator, RoyaltyOperator, Rightsholder]
    code: 200
    input: []
    output: Rightsholder
    side_effects: []
  - method: POST
    path: "/rightsholders/{id}/suspend"
    description: "Suspend a rightsholder (blocks payouts)"
    roles: [Administrator]
    code: 200
    input: []
    output: Rightsholder
    side_effects: ["Rightsholder.status -> SUSPENDED; increments version"]

  # ---- Works + composition shares (shares are a flat collection) ----
  - method: POST
    path: "/works"
    description: "Register a composition (shares not yet locked)"
    roles: [Administrator]
    code: 201
    input: [title, iswc, pro_affiliation, duration_seconds]
    output: Work
    side_effects: ["shares_locked=false; split_total_bps=0; ERR_DUPLICATE_CODE on duplicate iswc"]
  - method: GET
    path: "/works/{id}"
    description: "Read a work"
    roles: [Administrator, RoyaltyOperator, Rightsholder, Licensee]
    code: 200
    input: []
    output: Work
    side_effects: []
  - method: POST
    path: "/works/{id}/register"
    description: "Lock composition shares once they sum to exactly 100%"
    roles: [Administrator]
    code: 200
    input: []
    output: Work
    side_effects: ["requires split_total_bps==10000 else ERR_SPLIT_TOTAL_INVALID; Work.shares_locked->true; increments version"]
  - method: POST
    path: "/composition-shares"
    description: "Add a writer/publisher share to a composition"
    roles: [Administrator]
    code: 201
    input: [work_id, rightsholder_id, role, split_bps]
    output: CompositionShare
    side_effects: ["parent Work.split_total_bps recomputed; ERR_SHARES_LOCKED if locked; ERR_SPLIT_TOTAL_INVALID if total would exceed 10000; ERR_FK_NOT_FOUND if work_id/rightsholder_id missing"]
  - method: GET
    path: "/composition-shares/{id}"
    description: "Read a single composition share"
    roles: [Administrator, RoyaltyOperator]
    code: 200
    input: []
    output: CompositionShare
    side_effects: []
  - method: GET
    path: "/composition-shares"
    description: "List composition shares; filter by work_id (reverse-reach CompositionShare.work_id) or rightsholder_id (reverse-reach CompositionShare.rightsholder_id)"
    roles: [Administrator, RoyaltyOperator]
    code: 200
    input: ["work_id?", "rightsholder_id?", "role?", "limit?", "offset?"]
    output: CompositionShare[]
    side_effects: []

  # ---- Recordings + recording shares (flat collection) ----
  - method: POST
    path: "/recordings"
    description: "Register a master recording embodying a work"
    roles: [Administrator]
    code: 201
    input: [work_id, isrc, title, release_type, duration_seconds]
    output: Recording
    side_effects: ["shares_locked=false; ERR_FK_NOT_FOUND if work_id missing; ERR_DUPLICATE_CODE on duplicate isrc"]
  - method: GET
    path: "/recordings/{id}"
    description: "Read a recording"
    roles: [Administrator, RoyaltyOperator, Licensee]
    code: 200
    input: []
    output: Recording
    side_effects: []
  - method: GET
    path: "/recordings"
    description: "List recordings; filter by work_id (reverse-reach Recording.work_id)"
    roles: [Administrator, RoyaltyOperator, Licensee]
    code: 200
    input: ["work_id?", "release_type?", "limit?", "offset?"]
    output: Recording[]
    side_effects: []
  - method: POST
    path: "/recordings/{id}/lock-shares"
    description: "Lock recording shares once they sum to exactly 100%"
    roles: [Administrator]
    code: 200
    input: []
    output: Recording
    side_effects: ["requires split_total_bps==10000 else ERR_SPLIT_TOTAL_INVALID; Recording.shares_locked->true; increments version"]
  - method: POST
    path: "/recording-shares"
    description: "Add a master share to a recording"
    roles: [Administrator]
    code: 201
    input: [recording_id, rightsholder_id, split_bps]
    output: RecordingShare
    side_effects: ["parent Recording.split_total_bps recomputed; ERR_SHARES_LOCKED if locked; ERR_SPLIT_TOTAL_INVALID if total would exceed 10000; ERR_FK_NOT_FOUND if recording_id/rightsholder_id missing"]
  - method: GET
    path: "/recording-shares/{id}"
    description: "Read a single recording share"
    roles: [Administrator, RoyaltyOperator]
    code: 200
    input: []
    output: RecordingShare
    side_effects: []
  - method: GET
    path: "/recording-shares"
    description: "List recording shares; filter by recording_id (reverse-reach RecordingShare.recording_id) or rightsholder_id (reverse-reach RecordingShare.rightsholder_id)"
    roles: [Administrator, RoyaltyOperator]
    code: 200
    input: ["recording_id?", "rightsholder_id?", "limit?", "offset?"]
    output: RecordingShare[]
    side_effects: []

  # ---- Rights windows ----
  - method: POST
    path: "/rights-windows"
    description: "Grant a territory/term rights window on a recording"
    roles: [Administrator]
    code: 201
    input: [recording_id, territory, rights_type, term_start, term_end]
    output: RightsWindow
    side_effects: ["status defaults ACTIVE; ERR_WINDOW_OVERLAP if it collides with an ACTIVE same-type window per §1.4 priority 14; ERR_FK_NOT_FOUND if recording_id missing"]
  - method: GET
    path: "/rights-windows/{id}"
    description: "Read a single rights window"
    roles: [Administrator, RoyaltyOperator, Licensee]
    code: 200
    input: []
    output: RightsWindow
    side_effects: []
  - method: GET
    path: "/rights-windows"
    description: "List rights windows; filter by recording_id (reverse-reach RightsWindow.recording_id)"
    roles: [Administrator, RoyaltyOperator, Licensee]
    code: 200
    input: ["recording_id?", "rights_type?", "status?", "limit?", "offset?"]
    output: RightsWindow[]
    side_effects: []
  - method: POST
    path: "/rights-windows/{id}/revoke"
    description: "Revoke a rights window"
    roles: [Administrator]
    code: 200
    input: []
    output: RightsWindow
    side_effects: ["RightsWindow.status -> REVOKED; increments version"]

  # ---- Usage events ----
  - method: POST
    path: "/usage-events"
    description: "Ingest a raw usage event (PERFORMANCE or MECHANICAL)"
    roles: [RoyaltyOperator]
    code: 201
    input: [recording_id, usage_type, territory, occurred_at, quantity, "gross_revenue_cents?"]
    output: UsageEvent
    side_effects: ["status defaults INGESTED; royalty_cents=0; ERR_FK_NOT_FOUND if recording_id missing"]
  - method: GET
    path: "/usage-events/{id}"
    description: "Read a usage event"
    roles: [Administrator, RoyaltyOperator]
    code: 200
    input: []
    output: UsageEvent
    side_effects: []
  - method: GET
    path: "/usage-events"
    description: "List usage events; filter by recording_id (reverse-reach UsageEvent.recording_id)"
    roles: [Administrator, RoyaltyOperator]
    code: 200
    input: ["recording_id?", "status?", "usage_type?", "limit?", "offset?"]
    output: UsageEvent[]
    side_effects: []
  - method: POST
    path: "/usage-events/{id}/allocate"
    description: "Compute royalty and distribute EARNING entries to holders' DRAFT statements"
    roles: [RoyaltyOperator]
    code: 200
    input: []
    output: UsageEvent
    side_effects: ["royalty_cents computed; EARNING ledger entries created per holder; affected statements' gross recomputed and version bumped; status->ALLOCATED (cascade depth 2)"]
  - method: POST
    path: "/usage-events/{id}/void"
    description: "Void an unallocated usage event"
    roles: [RoyaltyOperator]
    code: 200
    input: []
    output: UsageEvent
    side_effects: ["status->VOIDED (only from INGESTED)"]

  # ---- Sync licenses ----
  - method: POST
    path: "/sync-licenses"
    description: "Create a sync license quote (fee computed via sync_quote_fee)"
    roles: [RoyaltyOperator]
    code: 201
    input: [recording_id, licensee_id, media_type, territory, term_months, base_fee_cents]
    output: SyncLicense
    side_effects: ["quoted_fee_cents computed; status DRAFT; ERR_FK_NOT_FOUND if recording_id/licensee_id missing"]
  - method: GET
    path: "/sync-licenses/{id}"
    description: "Read a sync license"
    roles: [Administrator, RoyaltyOperator, Licensee]
    code: 200
    input: []
    output: SyncLicense
    side_effects: []
  - method: GET
    path: "/sync-licenses"
    description: "List sync licenses; filter by licensee_id (reverse-reach SyncLicense.licensee_id) or recording_id (reverse-reach SyncLicense.recording_id)"
    roles: [Administrator, RoyaltyOperator, Licensee]
    code: 200
    input: ["licensee_id?", "recording_id?", "status?", "limit?", "offset?"]
    output: SyncLicense[]
    side_effects: []
  - method: POST
    path: "/sync-licenses/{id}/counter"
    description: "Licensee counters the quote"
    roles: [Licensee]
    code: 200
    input: [counter_fee_cents]
    output: SyncLicense
    side_effects: ["counter_fee_cents set; status->COUNTERED; increments version"]
  - method: POST
    path: "/sync-licenses/{id}/requote"
    description: "Operator re-quotes with a new base fee (COUNTERED->DRAFT negotiation loop)"
    roles: [RoyaltyOperator]
    code: 200
    input: [base_fee_cents]
    output: SyncLicense
    side_effects: ["base_fee_cents reset; quoted_fee_cents recomputed; status->DRAFT; increments version"]
  - method: POST
    path: "/sync-licenses/{id}/accept"
    description: "Accept the quote (Licensee from DRAFT, Operator from COUNTERED)"
    roles: [Licensee, RoyaltyOperator]
    code: 200
    input: []
    output: SyncLicense
    side_effects: ["status->ACCEPTED; ERR_RIGHTS_NOT_AVAILABLE if no covering SYNC window; increments version"]
  - method: POST
    path: "/sync-licenses/{id}/execute"
    description: "Execute the license: distribute quoted_fee to master holders"
    roles: [RoyaltyOperator]
    code: 200
    input: []
    output: SyncLicense
    side_effects: ["EARNING ledger entries per RecordingShare holder; affected statements' gross recomputed and version bumped; status->EXECUTED; ERR_SHARES_NOT_LOCKED / ERR_NO_OPEN_STATEMENT guards"]
  - method: POST
    path: "/sync-licenses/{id}/decline"
    description: "Operator declines the quote (DRAFT or COUNTERED -> DECLINED)"
    roles: [RoyaltyOperator]
    code: 200
    input: []
    output: SyncLicense
    side_effects: ["status->DECLINED"]

  # ---- Advances ----
  - method: POST
    path: "/advances"
    description: "Issue a recoupable advance to a rightsholder"
    roles: [Administrator]
    code: 201
    input: [rightsholder_id, principal_cents, "recoupment_pct?"]
    output: Advance
    side_effects: ["status ACTIVE; recouped_cents=0; Rightsholder.unrecouped_balance_cents recomputed; ERR_FK_NOT_FOUND if rightsholder missing"]
  - method: GET
    path: "/advances/{id}"
    description: "Read an advance"
    roles: [Administrator, RoyaltyOperator, Rightsholder]
    code: 200
    input: []
    output: Advance
    side_effects: []
  - method: GET
    path: "/advances"
    description: "List advances; filter by rightsholder_id (reverse-reach Advance.rightsholder_id)"
    roles: [Administrator, RoyaltyOperator, Rightsholder]
    code: 200
    input: ["rightsholder_id?", "status?", "limit?", "offset?"]
    output: Advance[]
    side_effects: []
  - method: POST
    path: "/advances/{id}/write-off"
    description: "Write off the remaining unrecouped principal"
    roles: [Administrator]
    code: 200
    input: []
    output: Advance
    side_effects: ["status->WRITTEN_OFF; Rightsholder.unrecouped_balance_cents recomputed"]

  # ---- Statements ----
  - method: POST
    path: "/statements"
    description: "Open a DRAFT statement for a rightsholder + period"
    roles: [RoyaltyOperator]
    code: 201
    input: [rightsholder_id, period_start, period_end]
    output: Statement
    side_effects: ["status DRAFT; all computed totals 0; ERR_FK_NOT_FOUND if rightsholder missing; ERR_STATEMENT_PERIOD_OVERLAP if period overlaps an existing non-PAID statement for the rightsholder"]
  - method: GET
    path: "/statements/{id}"
    description: "Read a statement (computed totals included)"
    roles: [Administrator, RoyaltyOperator, Rightsholder]
    code: 200
    input: []
    output: Statement
    side_effects: []
  - method: GET
    path: "/statements"
    description: "List statements; filter by rightsholder_id (reverse-reach Statement.rightsholder_id)"
    roles: [Administrator, RoyaltyOperator, Rightsholder]
    code: 200
    input: ["rightsholder_id?", "status?", "limit?", "offset?"]
    output: Statement[]
    side_effects: []
  - method: GET
    path: "/statements/{id}/ledger"
    description: "List LedgerEntry rows attached to a statement (reverse-reach LedgerEntry.statement_id)"
    roles: [Administrator, RoyaltyOperator, Rightsholder]
    code: 200
    input: ["entry_type?", "limit?", "offset?"]
    output: LedgerEntry[]
    side_effects: []
  - method: POST
    path: "/statements/{id}/finalize"
    description: "Finalize: recoup advances, withhold tax, compute net payable"
    roles: [RoyaltyOperator]
    code: 200
    input: [expected_statement_version]
    output: Statement
    side_effects: ["advance_recoupment runs; RECOUPMENT/WITHHOLDING entries appended; net_payable computed; lifetime/unrecouped recomputed; status->FINALIZED; increments Statement.version by 1 (cascade depth 3)"]
  - method: POST
    path: "/statements/{id}/reopen"
    description: "Reopen a finalized statement (reverses recoupment + withholding)"
    roles: [RoyaltyOperator]
    code: 200
    input: [expected_statement_version]
    output: Statement
    side_effects: ["recoupment reversed; advances revert RECOUPED->ACTIVE; withholding removed; totals reset to 0; status->DRAFT; increments Statement.version by 1"]

  # ---- Payouts ----
  - method: POST
    path: "/payouts"
    description: "Create a payout against a FINALIZED statement"
    roles: [RoyaltyOperator]
    code: 201
    input: [statement_id]
    output: Payout
    side_effects: ["amount_cents=statement.net_payable_cents; status PENDING; Statement.status->PAID and version bumped; ERR_RIGHTSHOLDER_SUSPENDED / ERR_NOTHING_PAYABLE guard"]
  - method: GET
    path: "/payouts/{id}"
    description: "Read a payout"
    roles: [Administrator, RoyaltyOperator, Rightsholder]
    code: 200
    input: []
    output: Payout
    side_effects: []
  - method: GET
    path: "/statements/{id}/payouts"
    description: "List payouts for a statement (reverse-reach Payout.statement_id)"
    roles: [Administrator, RoyaltyOperator, Rightsholder]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Payout[]
    side_effects: []
  - method: POST
    path: "/payouts/{id}/settle"
    description: "Mark a payout settled"
    roles: [RoyaltyOperator]
    code: 200
    input: []
    output: Payout
    side_effects: ["status->SETTLED"]
  - method: POST
    path: "/payouts/{id}/reverse"
    description: "Reverse a pending payout"
    roles: [RoyaltyOperator]
    code: 200
    input: []
    output: Payout
    side_effects: ["status->REVERSED; referenced Statement reverts PAID->FINALIZED and version bumped"]

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's current UTC instant for deterministic period/term tests"
    roles: [Administrator]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["server clock pinned to to_iso8601"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "missing or malformed X-User-Role / X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "acting role not permitted for this operation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "a path-referenced resource does not exist" }
  - { id: ERR_FK_NOT_FOUND, http: 422, condition: "a foreign-key field in the body references a non-existent entity" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "missing required field, bad enum, or numeric out of declared constraint range" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "requested transition not defined from the resource's current state" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "entity_backed actor is not the owner of the targeted resource" }
  - { id: ERR_DUPLICATE_CODE, http: 409, condition: "ISWC or ISRC already exists" }
  - { id: ERR_SPLIT_TOTAL_INVALID, http: 422, condition: "share addition would exceed 10000 bps, or register attempted when total != 10000" }
  - { id: ERR_SHARES_LOCKED, http: 409, condition: "share creation attempted after the parent Work/Recording shares are locked" }
  - { id: ERR_SHARES_NOT_LOCKED, http: 409, condition: "usage allocation or sync execution attempted before the relevant shares are locked" }
  - { id: ERR_RIGHTS_NOT_AVAILABLE, http: 422, condition: "no ACTIVE RightsWindow of the matching rights_type covers the requested territory and (for usage) the occurred_at instant" }
  - { id: ERR_NO_OPEN_STATEMENT, http: 409, condition: "a distribution-target holder has no DRAFT statement whose period contains the usage instant / sync execution clock instant" }
  - { id: ERR_WINDOW_OVERLAP, http: 409, condition: "a new RightsWindow collides with an existing ACTIVE same-type window per the buffered/half-open interval rule" }
  - { id: ERR_STATEMENT_PERIOD_OVERLAP, http: 409, condition: "a new Statement's period overlaps an existing non-PAID statement for the same rightsholder (plain half-open non-overlap)" }
  - { id: ERR_UNALLOCATED_USAGE_IN_PERIOD, http: 409, condition: "an INGESTED usage event targeting this rightsholder falls inside the statement period on finalize" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_statement_version does not match the statement's current version" }
  - { id: ERR_PAYOUT_EXISTS, http: 409, condition: "reopen attempted on a statement referenced by a SETTLED payout" }
  - { id: ERR_RIGHTSHOLDER_SUSPENDED, http: 409, condition: "payout attempted for a SUSPENDED rightsholder" }
  - { id: ERR_NOTHING_PAYABLE, http: 409, condition: "payout attempted when statement net_payable_cents < 1" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Administrator
    description: "Catalog and party management: rightsholders, works/recordings, shares, rights windows, advances"
    identity: opaque
    exclusive_operations:
      - "POST /rightsholders, POST /rightsholders/{id}/suspend"
      - "POST /works, POST /works/{id}/register"
      - "POST /recordings, POST /recordings/{id}/lock-shares"
      - "POST /composition-shares, POST /recording-shares"
      - "POST /rights-windows, POST /rights-windows/{id}/revoke"
      - "POST /advances, POST /advances/{id}/write-off"
    shared_operations:
      - "GET reads on rightsholders, works, recordings, composition-shares, recording-shares, rights-windows, advances, statements, ledger, payouts"
  - name: RoyaltyOperator
    description: "Royalty operations: usage ingest/allocate, sync quoting/execution, statements, payouts"
    identity: opaque
    exclusive_operations:
      - "POST /usage-events, POST /usage-events/{id}/allocate, POST /usage-events/{id}/void"
      - "POST /sync-licenses, POST /sync-licenses/{id}/requote, POST /sync-licenses/{id}/execute, POST /sync-licenses/{id}/decline"
      - "POST /statements, POST /statements/{id}/finalize, POST /statements/{id}/reopen"
      - "POST /payouts, POST /payouts/{id}/settle, POST /payouts/{id}/reverse"
    shared_operations:
      - "POST /sync-licenses/{id}/accept (also allowed to Licensee from DRAFT)"
      - "GET reads on works, recordings, usage-events, sync-licenses, statements, payouts"
  - name: Licensee
    description: "Sync licensee: requests quotes, counters, accepts from DRAFT; reads own sync licenses"
    identity: "entity_backed:Rightsholder"
    exclusive_operations:
      - "POST /sync-licenses/{id}/counter"
    shared_operations:
      - "POST /sync-licenses/{id}/accept (from DRAFT, on own license)"
      - "GET /sync-licenses (own, filtered by own licensee_id), GET /recordings, GET /works, GET /rights-windows"
    note: "X-User-ID is the Rightsholder.id acting as licensee; ownership checked against SyncLicense.licensee_id"
  - name: Rightsholder
    description: "Payee: reads own statements, ledger, advances, payouts"
    identity: "entity_backed:Rightsholder"
    exclusive_operations: []
    shared_operations:
      - "GET /rightsholders/{id} (own), GET /statements (own, filtered by own rightsholder_id), GET /statements/{id} (own)"
      - "GET /statements/{id}/ledger (own), GET /advances (own), GET /statements/{id}/payouts (own)"
    note: "X-User-ID is the Rightsholder.id; reads scoped to own resources via ERR_NOT_RESOURCE_OWNER"
