# =============================================================================
# Multi-State Payroll & Tax Withholding — Scaffold Difficulty Design
# Single top-level key: scaffold_difficulty_design
# Each rule_id maps verbatim to a §0.5 Difficulty Rule; ≥2 instances per rule.
# Every `grounds:` ref resolves to an element declared in SCAFFOLD.yaml §1.1–§1.6.
# Every `assert:` literal numeric value was computed against the formulas in
# SCAFFOLD.yaml §1.3 with the constants declared there.
# =============================================================================

scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: paycheck_withholding_supplemental_vs_aggregate_on_retro_pay
        grounds:
          - calculations.paycheck_withholding
          - calculations.paycheck_withholding.variants.standard_aggregate_method
          - calculations.paycheck_withholding.variants.supplemental_flat_rate_for_retro
          - entities.PayrollItem.fields.retro_adjustment_cents
          - entities.Paycheck.fields.federal_withholding_cents
        distinguishing_aspect: |
          Two valid IRS-approved approaches on a Paycheck whose PayrollItem has a non-zero
          retro_adjustment_cents produce different federal_withholding_cents: the supplemental
          flat-rate method (22% on retro, standard annualization on the rest) yields a
          different cents figure from naive aggregation that adds retro to gross and
          re-annualizes the combined amount.
        test_recipe:
          setup:
            - "Seed FEDERAL TaxBracketTables for SINGLE filing status tax_year 2024 with brackets {0..1100000@10%, 1100000..4475000@12%, 4475000..9525000@22%, 9525000..null@24%}"
            - "Create Employee (work_state=TX, work_locality=NONE, hourly_rate_cents=12500, hire_date 2024-01-01)"
            - "Create W4Profile (filing_status=SINGLE, all other W-4 fields 0)"
            - "Create PayPeriod (period_start=2024-06-03, period_end=2024-06-16, pay_date=2024-06-21)"
            - "Create PayrollItem (regular_hours=16, overtime_hours=0, double_hours=0, retro_adjustment_cents=100000) — note 16 hrs × 12500 cents = 200000 cents non-retro gross"
          trigger:
            - "POST /paychecks/{id}/calculate as PayrollSpecialist"
          assert:
            - "Paycheck.gross_wages_cents == 300000"
            - "Paycheck.federal_withholding_cents == 38738   # 16738 from standard portion + 22000 supplemental on retro"
            - "Paycheck.federal_withholding_cents != 36181   # the aggregated alternative; differs by 2557 cents"

      - name: paycheck_withholding_per_period_vs_ytd_reconciliation_on_voided_history
        grounds:
          - calculations.paycheck_withholding
          - calculations.ytd_reconciliation_withholding
          - state_machines.Paycheck.APPROVED_to_VOIDED
          - entities.YTDLedgerEntry.fields.entry_kind
          - entities.Paycheck.fields.federal_withholding_cents
        distinguishing_aspect: |
          For identical inputs (same gross, same W-4) the system picks
          ytd_reconciliation_withholding (cumulative true-up against ledger) instead of
          paycheck_withholding (independent per-paycheck annualization) on the FIRST
          paycheck calculated after a prior paycheck in the same tax_year was VOIDED.
          The two variants are different calculation entries on a different entity
          domain (Employee YTD ledger) than the dual_variant on retro pay above.
        test_recipe:
          setup:
            - "Seed federal brackets as in instance 1; create Employee+W4Profile (SINGLE) identical to instance 1"
            - "Create PayPeriod A (pay_date=2024-06-21); create PayrollItem A with regular_hours=16, no retro"
            - "POST /paychecks/{A}/calculate; assert federal_withholding_cents == 16738"
            - "POST /paychecks/{A}/approve as a different X-User-ID (SOD)"
            - "POST /paychecks/{A}/mark-paid as a third X-User-ID (SOD)"
            - "POST /paychecks/{A}/issue-correction with target_pay_period_id=B (a new PayPeriod with pay_date=2024-07-05) — Paycheck A becomes VOIDED, YTDLedgerEntry(REVERSAL) appended, Employee.ytd_gross_wages_cents back to 0, a new DRAFT correction Paycheck attached to B"
          trigger:
            - "POST /paychecks/{correction.id}/calculate as PayrollSpecialist"
          assert:
            - "Paycheck.federal_withholding_cents == 9308   # ytd_reconciliation_withholding: cum_taxable = 200000 - prorated_std(2/26 * 1390000 = 106923) = 93077; tier1 only = 9308"
            - "Paycheck.federal_withholding_cents != 16738   # the per-period variant value the system would have produced absent VOIDED history"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: garnishment_waterfall_three_input_nonlinear_min_chain
        grounds:
          - calculations.garnishment_waterfall_allocation
          - entities.GarnishmentOrder.fields.cap_pct_of_disposable
          - entities.GarnishmentOrder.fields.priority_rank
          - entities.GarnishmentOrder.fields.total_owed_cents
          - entities.Paycheck.fields.garnishment_total_cents
        distinguishing_aspect: |
          Mode (a): a formula with three nonlinear inputs interacting via nested
          min — per-order cap, remaining_owed, and remaining_pool. Combinatorial
          because the active mix of CHILD_SUPPORT vs other order types changes
          ccpa_cap from 25% to 50%, and the global pool cap can shrink any
          single-order allocation below its per-order cap.
        test_recipe:
          setup:
            - "Employee (work_state=TX, work_locality=NONE, hourly_rate=12500); PayPeriod with pay_date=2024-08-23"
            - "PayrollItem with regular_hours=16, no retro; W4Profile SINGLE"
            - "Create GarnishmentOrder G1 (order_type=CHILD_SUPPORT → priority_rank=1, cap_pct_of_disposable=20, total_owed_cents=500000, effective_pay_date=2024-01-01)"
            - "Create GarnishmentOrder G2 (order_type=CREDITOR → priority_rank=4, cap_pct_of_disposable=15, total_owed_cents=500000, effective_pay_date=2024-01-01)"
          trigger:
            - "POST /paychecks/{id}/calculate as PayrollSpecialist"
          assert:
            - "Paycheck.gross_wages_cents == 200000"
            - "Paycheck.federal_withholding_cents == 16738"
            - "Paycheck.social_security_cents == 12400"
            - "Paycheck.medicare_base_cents == 2900"
            - "Paycheck.garnishment_total_cents == 58786   # disposable=167962; CCPA pool = round(167962*0.50)=83981; G1=min(round(167962*0.20)=33592, 500000, 83981)=33592; G2=min(round(167962*0.15)=25194, 500000, remaining=50389)=25194; sum=58786"
            - "Paycheck.net_pay_cents == 109176"

      - name: fica_ss_cap_with_explicit_pinned_rounding_order_then_sum
        grounds:
          - calculations.fica_social_security
          - calculations.medicare_additional_threshold
          - calculations.remittance_aggregation
          - entities.Paycheck.fields.social_security_cents
          - entities.RemittancePeriod.fields.total_social_security_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. Per-paycheck SS, Medicare base,
          and Medicare additional each round_half_up to whole cents BEFORE being summed,
          and the employer-side multiplier (×2 for SS and Medicare base, ×1 for Medicare
          additional) is applied AFTER the integer cents per-paycheck. Reversing this
          order ("sum then round, then double") produces a different RemittancePeriod
          total in the cent. The scaffold pins the order so the test value is well-defined.
        test_recipe:
          setup:
            - "Employee with ytd_social_security_wages_cents = 16830000 - 50000 = 16780000 (precondition seeded by a prior PAID paycheck that approached the cap)"
            - "Tax_year 2024; PayPeriod with pay_date=2024-11-29; PayrollItem regular_hours=16 (gross=200000)"
            - "W4Profile SINGLE; no garnishments"
          trigger:
            - "POST /paychecks/{id}/calculate, then approve+mark-paid with distinct X-User-IDs"
            - "POST /remittance-periods with (tax_year=2024, tax_month=11); POST /remittance-periods/{id}/finalize"
          assert:
            - "Paycheck.social_security_cents == 3100   # taxable_ss = min(200000, 16830000-16780000=50000) = 50000; 50000*0.062 = 3100 exactly"
            - "Paycheck.medicare_base_cents == 2900   # 200000 * 0.0145 = 2900 exactly"
            - "Paycheck.medicare_additional_cents == 0   # ytd Medicare wages below 20000000 threshold"
            - "RemittancePeriod.total_social_security_cents == 6200   # 3100 (employee) * 2 (employer match) — multiplier AFTER per-paycheck rounding"
            - "RemittancePeriod.total_medicare_cents == 5800   # 2900 * 2"
            - "RemittancePeriod.total_medicare_additional_cents == 0   # no employer match on additional 0.9%"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: paycheck_calculated_to_draft_revert_cycle
        grounds:
          - state_machines.Paycheck.CALCULATED_to_DRAFT
          - state_machines.Paycheck.DRAFT_to_CALCULATED
          - entities.PayrollItem.fields.locked
        distinguishing_aspect: |
          Paycheck state machine has a cycle DRAFT → CALCULATED → DRAFT
          (via /recalculate) — not a linear pipeline. Sits on Paycheck entity.
        test_recipe:
          setup:
            - "Employee, W4Profile, PayPeriod, PayrollItem, Paycheck calculated once"
          trigger:
            - "POST /paychecks/{id}/recalculate"
            - "Edit PayrollItem hours via PUT /payroll-items/{id}"
            - "POST /paychecks/{id}/calculate a second time"
          assert:
            - "Paycheck.status transitions DRAFT → CALCULATED → DRAFT → CALCULATED"
            - "After /recalculate, PayrollItem.locked == false (edits permitted)"
            - "Paycheck.gross_wages_cents reflects the second hours value, not the first"

      - name: remittance_amended_to_remitted_cycle
        grounds:
          - state_machines.RemittancePeriod.REMITTED_to_AMENDED
          - state_machines.RemittancePeriod.AMENDED_to_REMITTED
          - state_machines.RemittancePeriod.FINALIZED_to_REMITTED
        distinguishing_aspect: |
          A different entity (RemittancePeriod) — not Paycheck — has a non-linear
          cycle REMITTED → AMENDED → REMITTED reachable any number of times when
          retroactive paycheck corrections land in an already-remitted month. This
          satisfies the "different entities" clause of the rule.
        test_recipe:
          setup:
            - "RemittancePeriod fully through DRAFT → FINALIZED → REMITTED for (2024, 6)"
            - "A PAID paycheck in June 2024 is then corrected via /issue-correction; correction lands in July with a backdated PayPeriod pay_date in June (created via test endpoint)"
          trigger:
            - "POST /remittance-periods/{id}/amend"
            - "POST /remittance-periods/{id}/remit (with a Treasurer different from the prior finalizer/amender)"
          assert:
            - "RemittancePeriod.status sequence: REMITTED → AMENDED → REMITTED"
            - "RemittancePeriod.total_federal_withholding_cents differs between the two REMITTED states"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: paycheck_void_chain_employee_ytd_then_garnishment_then_order_status
        grounds:
          - state_machines.Paycheck.PAID_to_VOIDED
          - state_machines.Paycheck.APPROVED_to_VOIDED
          - state_machines.GarnishmentOrder.SATISFIED_to_ACTIVE
          - entities.Employee.fields.ytd_gross_wages_cents
          - entities.YTDLedgerEntry.fields.entry_kind
          - calculations.garnishment_amount_collected_recompute
        distinguishing_aspect: |
          Depth ≥ 3 cascade. Trigger: POST /paychecks/{id}/issue-correction.
          Link 1: the void appends a YTDLedgerEntry(REVERSAL). Link 2 (caused by
          link 1, not by the original action): Employee.ytd_* counters recompute
          from the revised ledger. Link 3 (caused by link 2's recompute hooking
          into the garnishment recompute): a GarnishmentOrder previously
          SATISFIED can transition back to ACTIVE because its amount_collected_cents
          dropped below total_owed_cents.
        test_recipe:
          setup:
            - "Employee + W4Profile + PayPeriod1 with a paycheck whose garnishment allocation pushed an order's amount_collected_cents to its total_owed_cents, causing it to SATISFY"
            - "Confirm GarnishmentOrder.status == SATISFIED after approve+mark-paid"
          trigger:
            - "POST /paychecks/{source.id}/issue-correction"
          assert:
            - "Source Paycheck.status == VOIDED"
            - "A YTDLedgerEntry with entry_kind == REVERSAL exists referencing the voided paycheck"
            - "Employee.ytd_gross_wages_cents decreased by the voided paycheck's gross"
            - "GarnishmentOrder.status == ACTIVE  # transitive: ledger reversal → ytd recompute → garnishment recompute → status flip"

      - name: pay_period_close_chain_from_mark_paid_through_aggregated_state
        grounds:
          - state_machines.Paycheck.APPROVED_to_PAID
          - state_machines.PayPeriod.LOCKED_to_CLOSED
          - state_machines.PayPeriod.OPEN_to_LOCKED
          - entities.PayPeriod.fields.status
        distinguishing_aspect: |
          Depth ≥ 2 cascade originating from a DIFFERENT triggering transition
          (POST /paychecks/{id}/mark-paid, not /issue-correction). Link 1: paycheck
          becomes PAID. Link 2 (caused by link 1, not by the original action):
          if every paycheck in the now-LOCKED period is in PAID or VOIDED, the
          PayPeriod auto-transitions from LOCKED → CLOSED. The cause-effect chain
          is distinct from the previous instance, exercising a different
          propagation pattern (bubble-up aggregation vs ledger recompute).
        test_recipe:
          setup:
            - "Single-employee PayPeriod with one Paycheck approved and the PayPeriod already LOCKED"
          trigger:
            - "POST /paychecks/{id}/mark-paid"
          assert:
            - "Paycheck.status == PAID"
            - "PayPeriod.status == CLOSED  # cascade caused by paycheck PAID transition triggering the LOCKED→CLOSED auto-transition"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: terminated_employee_vs_no_w4_state_vs_referential
        grounds:
          - validations[priority=5]
          - validations[priority=8]
          - errors.ERR_TERMINATED_EMPLOYEE
          - errors.ERR_NO_W4
          - state_machines.Paycheck.DRAFT_to_CALCULATED
        distinguishing_aspect: |
          Two simultaneously-failing checks: (a) the employee is TERMINATED outside
          the final-settlement window (state-category error ERR_TERMINATED_EMPLOYEE
          at priority 5/checks at calculate trigger) AND (b) no active W4Profile
          exists for the target pay period (business_referential error ERR_NO_W4
          at priority 8). The pair is `state` vs `business_referential`.
        test_recipe:
          setup:
            - "Employee created without any W4Profile"
            - "Terminate employee, advance clock 30 days past termination_date"
            - "Create PayPeriod (pay_date well after termination + 7 day window)"
            - "Create PayrollItem for this employee (creates DRAFT Paycheck)"
          trigger:
            - "POST /paychecks/{id}/calculate"
          assert:
            - "HTTP 409 with data.error_id == 'ERR_TERMINATED_EMPLOYEE'   # state precedes business_referential by priority"

      - name: sod_violation_vs_negative_net_pay_safety_vs_fiscal
        grounds:
          - validations[priority=7]
          - validations[priority=15]
          - errors.ERR_SEGREGATION_OF_DUTIES
          - errors.ERR_NEGATIVE_NET_PAY
          - state_machines.Paycheck.CALCULATED_to_APPROVED
        distinguishing_aspect: |
          A DIFFERENT error-category pair: business_safety (SOD) vs business_fiscal
          (negative net pay). Configure a paycheck where (a) the approver X-User-ID
          equals the calculator's X-User-ID AND (b) the gross is so low that
          withholdings plus garnishment cap would drive net_pay_cents below zero.
          SOD wins because its priority (7) precedes the fiscal check (15).
        test_recipe:
          setup:
            - "Employee, W4Profile, PayPeriod, PayrollItem with very low regular_hours (e.g., 1 hour at 12500 = 12500 cents gross)"
            - "Active GarnishmentOrder with cap_pct_of_disposable=100 and total_owed_cents=99999999"
            - "POST /paychecks/{id}/calculate as X-User-ID=user_A"
          trigger:
            - "POST /paychecks/{id}/approve as X-User-ID=user_A (same as calculator)"
          assert:
            - "HTTP 403 with data.error_id == 'ERR_SEGREGATION_OF_DUTIES'   # safety check (priority 7) wins over fiscal check (priority 15)"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: ss_wage_base_equality_zero_room_at_calculate
        grounds:
          - calculations.fica_social_security
          - entities.Employee.fields.ytd_social_security_wages_cents
          - entities.Paycheck.fields.social_security_cents
          - endpoints.[POST /paychecks/{paycheckId}/calculate]
        distinguishing_aspect: |
          Boundary `>=` vs `>` on a numeric threshold (SS wage base 16,830,000).
          When ytd_social_security_wages_cents equals the cap EXACTLY, remaining
          room is 0 and social_security_cents must be 0; one cent below the cap,
          room is 1 cent and SS withholding must round up. Reachable via
          POST /paychecks/{id}/calculate.
        test_recipe:
          setup:
            - "Employee with ytd_social_security_wages_cents seeded to exactly 16830000 by prior PAID paycheck history"
            - "New PayPeriod (pay_date=2024-12-13); PayrollItem regular_hours=16 (gross=200000)"
          trigger:
            - "POST /paychecks/{id}/calculate"
          assert:
            - "Paycheck.social_security_cents == 0   # ytd at cap exactly → remaining_room = 0 → taxable_ss = 0"
            - "Paycheck.medicare_base_cents == 2900   # Medicare is uncapped; arithmetic continues"

      - name: empty_paycheck_set_zero_totals_at_remittance_finalize
        grounds:
          - calculations.remittance_aggregation
          - entities.RemittancePeriod.fields.total_federal_withholding_cents
          - entities.RemittancePeriod.fields.state_breakdown
          - state_machines.RemittancePeriod.DRAFT_to_FINALIZED
        distinguishing_aspect: |
          A DIFFERENT boundary (empty-collection / zero-count rather than numeric
          equality), on a DIFFERENT metric (RemittancePeriod totals rather than
          per-paycheck SS), reachable through a DIFFERENT endpoint
          (POST /remittance-periods/{id}/finalize, not /paychecks/{id}/calculate).
          When no non-VOIDED Paycheck has a pay_date in (tax_year, tax_month) —
          either because the month had zero paychecks or every paycheck for the
          month was VOIDED — every total_* must be exactly 0 (not null, not
          omitted) and state_breakdown must be an empty array.
        test_recipe:
          setup:
            - "Create RemittancePeriod (tax_year=2024, tax_month=2) — a calendar month with no PayPeriods and no Paychecks at all (the precondition ERR_UNAPPROVED_PAYCHECKS_IN_MONTH must be vacuously satisfied — no DRAFT/CALCULATED items because no items at all)"
          trigger:
            - "POST /remittance-periods/{id}/finalize as PayrollManager"
          assert:
            - "RemittancePeriod.status == 'FINALIZED'"
            - "RemittancePeriod.total_federal_withholding_cents == 0"
            - "RemittancePeriod.total_state_withholding_cents == 0"
            - "RemittancePeriod.total_local_withholding_cents == 0"
            - "RemittancePeriod.total_social_security_cents == 0"
            - "RemittancePeriod.total_medicare_cents == 0"
            - "RemittancePeriod.total_medicare_additional_cents == 0"
            - "RemittancePeriod.state_breakdown == []"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: paycheck_calculate_depends_on_pay_period_status
        grounds:
          - state_machines.Paycheck.DRAFT_to_CALCULATED
          - state_machines.PayPeriod.OPEN_to_LOCKED
          - validations[priority=4]
          - errors.ERR_PAY_PERIOD_NOT_OPEN
        distinguishing_aspect: |
          Paycheck's valid transition DRAFT→CALCULATED depends on PayPeriod's state
          (must be OPEN). Entity pair: Paycheck ↔ PayPeriod.
        test_recipe:
          setup:
            - "PayPeriod, PayrollItem, DRAFT Paycheck; then POST /pay-periods/{id}/lock — but lock requires already-calculated items; arrange this by creating two items, calculating one, leaving the other DRAFT, then locking will fail. Instead: alternative path — manually drive the PayPeriod via the lock endpoint with all items calculated, then call /pay-periods/{id}/lock to enter LOCKED; then POST /paychecks/{other_id}/recalculate to send a paycheck back to DRAFT (this is permitted if PayPeriod is still OPEN). Set up the test so the PayPeriod reaches LOCKED while at least one paycheck is in DRAFT (by issuing an /issue-correction whose new draft paycheck attaches to a LOCKED period via test path)."
            - "Final state: PayPeriod.status == LOCKED, Paycheck.status == DRAFT"
          trigger:
            - "POST /paychecks/{id}/calculate"
          assert:
            - "HTTP 409 with data.error_id == 'ERR_PAY_PERIOD_NOT_OPEN'"

      - name: remittance_finalize_depends_on_pay_period_and_paycheck_states
        grounds:
          - state_machines.RemittancePeriod.DRAFT_to_FINALIZED
          - state_machines.PayPeriod.LOCKED_to_CLOSED
          - state_machines.Paycheck.CALCULATED_to_APPROVED
          - validations[priority=14]
          - errors.ERR_UNAPPROVED_PAYCHECKS_IN_MONTH
          - errors.ERR_OPEN_PAY_PERIODS_IN_MONTH
        distinguishing_aspect: |
          A DIFFERENT entity pair: RemittancePeriod ↔ PayPeriod (and indirectly
          ↔ Paycheck). RemittancePeriod's DRAFT→FINALIZED is blocked when ANY
          PayPeriod with pay_date in the (tax_year, tax_month) window is not yet
          CLOSED, or any included Paycheck is still in DRAFT/CALCULATED.
        test_recipe:
          setup:
            - "Create RemittancePeriod (tax_year=2024, tax_month=6)"
            - "Create at least one June 2024 PayPeriod with a CALCULATED (not yet APPROVED) Paycheck"
          trigger:
            - "POST /remittance-periods/{id}/finalize as PayrollManager"
          assert:
            - "HTTP 409 with data.error_id == 'ERR_UNAPPROVED_PAYCHECKS_IN_MONTH'   # the cross-entity dependency"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: pay_period_duplicate_paycheck_per_employee_inclusive_interval
        grounds:
          - concurrency_rules[duplicate_paycheck_for_employee]
          - validations[priority=13]
          - errors.ERR_DUPLICATE_PAYCHECK_FOR_EMPLOYEE
          - entities.PayPeriod
          - entities.Paycheck
        distinguishing_aspect: |
          The "interval" here is a PayPeriod's inclusive [period_start, period_end]
          range as occupied by an employee — a half-OPEN/closed interval semantic
          treating each PayPeriod as a single atomic time bucket: no two
          non-correction Paychecks for the same employee may share the same
          PayPeriod (point-in-bucket overlap, not date-arithmetic overlap).
          Resource entity: PayPeriod ↔ Employee bucket.
        test_recipe:
          setup:
            - "Employee, PayPeriod"
            - "POST /pay-periods/{id}/payroll-items {employee_id=E1, regular_hours=16}"
          trigger:
            - "POST /pay-periods/{id}/payroll-items {employee_id=E1, regular_hours=16}  # second attempt for same employee in same period"
          assert:
            - "HTTP 409 with data.error_id == 'ERR_DUPLICATE_PAYCHECK_FOR_EMPLOYEE'"

      - name: garnishment_order_effective_date_open_interval_against_pay_date
        grounds:
          - entities.GarnishmentOrder.fields.effective_pay_date
          - calculations.garnishment_waterfall_allocation
          - entities.PayPeriod.fields.pay_date
          - entities.Paycheck.fields.garnishment_total_cents
        distinguishing_aspect: |
          A DIFFERENT interval semantic: a GarnishmentOrder is "in effect" on a
          Paycheck iff PayPeriod.pay_date >= effective_pay_date (one-sided
          half-open interval extending forward from the effective date). This is
          point-vs-half-line overlap geometry — not bucket equality. Sits on a
          DIFFERENT resource entity (GarnishmentOrder vs PayPeriod).
        test_recipe:
          setup:
            - "Employee, W4Profile, PayPeriod (pay_date=2024-08-23)"
            - "GarnishmentOrder G_FUTURE with effective_pay_date=2024-09-01 (after PayPeriod.pay_date) and cap_pct=20, total_owed=500000, order_type=CREDITOR"
            - "GarnishmentOrder G_NOW with effective_pay_date=2024-08-23 (equal to pay_date — boundary case for >=) and cap_pct=15, total_owed=500000, order_type=CREDITOR"
            - "PayrollItem regular_hours=16, gross=200000"
          trigger:
            - "POST /paychecks/{id}/calculate"
          assert:
            - "Paycheck.garnishment_total_cents == 25194   # only G_NOW applies; equal-date IS included (>= boundary); G_FUTURE excluded"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: ytd_gross_wages_conserved_after_issue_correction_then_recalc_then_approve
        grounds:
          - state_machines.Paycheck.APPROVED_to_VOIDED
          - state_machines.Paycheck.CALCULATED_to_APPROVED
          - entities.Employee.fields.ytd_gross_wages_cents
          - entities.YTDLedgerEntry.fields.gross_wages_delta_cents
          - entities.YTDLedgerEntry.fields.entry_kind
        distinguishing_aspect: |
          Conserved quantity: Employee.ytd_gross_wages_cents. Forward action:
          /approve appends ACCRUAL +X. Compensating action: /issue-correction
          appends REVERSAL -X then a NEW correction paycheck whose /approve
          appends ACCRUAL +X' (where X' equals X when hours/W-4 unchanged).
          Pinned invariant: Employee.ytd_gross_wages_cents AFTER (approve →
          issue-correction → calculate → approve) == Employee.ytd_gross_wages_cents
          AFTER (approve alone), iff the corrected paycheck has identical inputs.
        test_recipe:
          setup:
            - "Employee, W4Profile, PayPeriod1 with paycheck P1 (gross=200000) calculated+approved → Employee.ytd_gross_wages_cents == 200000"
            - "Capture snapshot S = Employee.ytd_gross_wages_cents = 200000"
          trigger:
            - "POST /paychecks/{P1.id}/issue-correction with target_pay_period_id=PayPeriod2 (pay_date same year)"
            - "POST /paychecks/{P1_corr.id}/calculate (identical inputs)"
            - "POST /paychecks/{P1_corr.id}/approve as different X-User-ID"
          assert:
            - "Employee.ytd_gross_wages_cents == 200000   # equal to snapshot S — conserved across compensating action"
            - "len(YTDLedgerEntry for employee in tax_year) == 3   # ACCRUAL + REVERSAL + ACCRUAL"
            - "sum(YTDLedgerEntry.gross_wages_delta_cents) == 200000   # the conserved quantity equals its accrual residual"

      - name: garnishment_amount_collected_conserved_after_void_then_reapproved_correction
        grounds:
          - state_machines.Paycheck.APPROVED_to_VOIDED
          - state_machines.GarnishmentOrder.SATISFIED_to_ACTIVE
          - state_machines.GarnishmentOrder.ACTIVE_to_SATISFIED
          - calculations.garnishment_amount_collected_recompute
          - entities.GarnishmentOrder.fields.amount_collected_cents
        distinguishing_aspect: |
          DIFFERENT type of conserved quantity — GarnishmentOrder.amount_collected_cents
          (not an Employee YTD sum but a per-order ledger). The compensating
          action chain MUST leave this quantity unchanged when corrected with
          identical inputs. Pinned formula:
              amount_collected_cents
            = sum_over(APPROVED_or_PAID) allocations[order]
            - sum_over(VOIDED) allocations[order]
        test_recipe:
          setup:
            - "Employee, W4Profile, GarnishmentOrder G1 (cap_pct=20, total_owed=500000, CREDITOR)"
            - "PayPeriod P1 → Paycheck PC1 calculated, approved → G1.amount_collected_cents increases by 25194 (from earlier instance computation pattern); record snapshot S = G1.amount_collected_cents"
          trigger:
            - "POST /paychecks/{PC1.id}/issue-correction with PayPeriod2 target"
            - "POST /paychecks/{PC1_corr.id}/calculate (identical inputs)"
            - "POST /paychecks/{PC1_corr.id}/approve"
          assert:
            - "G1.amount_collected_cents == S   # conservation: -25194 (reversal) +25194 (new accrual) net zero"
            - "G1.status unchanged between snapshot and post-cycle (no spurious SATISFIED/ACTIVE flips)"
