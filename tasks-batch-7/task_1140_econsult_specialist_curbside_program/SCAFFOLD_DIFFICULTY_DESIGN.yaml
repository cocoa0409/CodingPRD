            - "after close: status == CLOSED and billing_status == CLAIMED (unchanged)"
            - "the two axes moved on disjoint transitions — parallel dimensions on one entity"

      - name: membership_standing_good_probation_good_cycle
        grounds:
          - state_machines.PanelMembership
          - calculations.panel_quality_score_bps
          - entities.PanelMembership.fields.standing
        distinguishing_aspect: |
          PanelMembership.standing is cyclic (GOOD_STANDING -> PROBATION ->
          GOOD_STANDING via score recovery), on a different entity than the
          ConsultRequest sibling instance. A composite-4000 REBUKE drops the
          blend to 6400 (< 7000 demotion); a subsequent 10000 PASS lifts the
          review average to 7000 and the blend to 8200 (>= 7500 recovery),
          closing the loop.
        test_recipe:
          setup:
            - "Track CARDIOLOGY standard; membership window; consult answered on time"
          setup_api_calls:
            - { call: "POST /econsult/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /econsult/specialty-tracks", payload: { specialty_code: CARDIOLOGY, response_time_target_hours: 48, urgent_target_hours: 12, base_response_fee_cents: 10000, conversion_response_fee_cents: 8000, clarification_fee_cents: 2500, late_penalty_cents: 3000, monthly_billing_cap_cents: 1000000 }, as: ProgramCoordinator, captures: { track_id: $.data.id } }
            - { call: "POST /econsult/referring-providers", payload: { full_name: "Dr. Priya Primary", npi: "1000000051" }, as: ProgramCoordinator, captures: { prov_id: $.data.id } }
            - { call: "POST /econsult/specialists", payload: { full_name: "Dr. Sam Specialist", npi: "2000000051" }, as: ProgramCoordinator, captures: { spec_id: $.data.id } }
            - { call: "POST /econsult/specialists", payload: { full_name: "Dr. Quinn Reviewer", npi: "2000000052" }, as: ProgramCoordinator, captures: { rev_id: $.data.id } }
            - { call: "POST /econsult/panel-memberships", payload: { specialist_id: "${spec_id}", specialty_track_id: "${track_id}" }, as: ProgramCoordinator, captures: { memb_id: $.data.id } }
            - { call: "POST /econsult/specialist-availability-windows", payload: { membership_id: "${memb_id}", window_start: "2026-05-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z" }, as: Specialist, as_user_id: "${spec_id}" }
            - { call: "POST /econsult/consult-requests", payload: { patient_ref: "PAT-NL2", specialty_track_id: "${track_id}", question_text: "Murmur on exam, asymptomatic; asks if echo needed before clearing for marathon training.", icd10_primary: "R01", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${prov_id}", captures: { cons_id: $.data.id } }
            - { call: "POST /econsult/consult-requests/${cons_id}/responses", payload: { disposition: "MANAGE_WITH_PLAN", recommendation_text: "Order transthoracic echo before clearance; no restriction until results reviewed." }, as: Specialist, as_user_id: "${spec_id}", captures: { resp_id: $.data.id } }
          trigger:
            - { call: "POST /econsult/quality-reviews", payload: { response_id: "${resp_id}" }, as: QualityReviewer, as_user_id: "${rev_id}", captures: { rev_1: $.data.id } }
            - { call: "POST /econsult/quality-reviews/${rev_1}/complete", payload: { timeliness_score: 2, appropriateness_score: 1, clarity_score: 4, verdict: "REBUKE" }, as: QualityReviewer, as_user_id: "${rev_id}" }
            - { call: "GET /econsult/panel-memberships/${memb_id}", as: ProgramCoordinator, captures: { standing_mid: $.data.standing, score_mid: $.data.quality_score_bps } }
            - { call: "POST /econsult/consult-responses/${resp_id}/revise", payload: { recommendation_text: "Order TTE within 2 weeks and cardiology follow-up; avoid maximal exertion until echo result is reviewed." }, as: Specialist, as_user_id: "${spec_id}" }
            - { call: "POST /econsult/quality-reviews", payload: { response_id: "${resp_id}" }, as: QualityReviewer, as_user_id: "${rev_id}", captures: { rev_2: $.data.id } }
            - { call: "POST /econsult/quality-reviews/${rev_2}/complete", payload: { timeliness_score: 5, appropriateness_score: 5, clarity_score: 5, verdict: "PASS" }, as: QualityReviewer, as_user_id: "${rev_id}" }
            - { call: "GET /econsult/panel-memberships/${memb_id}", as: ProgramCoordinator, captures: { standing_end: $.data.standing, score_end: $.data.quality_score_bps } }
          assert:
            - "composite of first review == 4000 bps ((1*50 + 2*25 + 4*25)/5 = 40 -> 4000), verdict REBUKE consistent (< 6000)"
            - "after first review: standing == PROBATION and quality_score_bps == 6400 (0.6*4000 + 0.4*10000)"
            - "revise returns response to SUBMITTED with revision_count == 1 (cycle REBUKED -> SUBMITTED also exercised)"
            - "after second review: review average == 7000 ((4000+10000)/2), quality_score_bps == 8200 (0.6*7000 + 0.4*10000)"
            - "after second review: standing == GOOD_STANDING (8200 >= 7500 recovery threshold) — cycle closed"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: rebuke_cascades_review_response_ledger_standing
        grounds:
          - state_machines.QualityReview.PENDING_to_COMPLETED
          - state_machines.ConsultResponse.SUBMITTED_to_REBUKED
          - state_machines.PanelMembership.GOOD_STANDING_to_PROBATION
          - entities.CompensationEntry.fields.posture
        distinguishing_aspect: |
          Depth-4 chain from trigger POST /quality-reviews/{id}/complete:
          [1] review COMPLETED (verdict REBUKE) causes [2] ConsultResponse
          SUBMITTED -> REBUKED, which causes [3] the PROVISIONAL RESPONSE_FEE
          CompensationEntry -> REVERSED and rebuke_count += 1, which causes
          [4] quality recompute 8500 -> 6400 driving standing GOOD_STANDING ->
          PROBATION. Each link is caused by the previous link, not by the trigger.
        test_recipe:
          setup:
            - "Track CARDIOLOGY standard; membership window; consult answered on time (provisional fee 10000)"
          setup_api_calls:
            - { call: "POST /econsult/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /econsult/specialty-tracks", payload: { specialty_code: CARDIOLOGY, response_time_target_hours: 48, urgent_target_hours: 12, base_response_fee_cents: 10000, conversion_response_fee_cents: 8000, clarification_fee_cents: 2500, late_penalty_cents: 3000, monthly_billing_cap_cents: 1000000 }, as: ProgramCoordinator, captures: { track_id: $.data.id } }
            - { call: "POST /econsult/referring-providers", payload: { full_name: "Dr. Priya Primary", npi: "1000000061" }, as: ProgramCoordinator, captures: { prov_id: $.data.id } }
            - { call: "POST /econsult/specialists", payload: { full_name: "Dr. Sam Specialist", npi: "2000000061" }, as: ProgramCoordinator, captures: { spec_id: $.data.id } }
            - { call: "POST /econsult/specialists", payload: { full_name: "Dr. Quinn Reviewer", npi: "2000000062" }, as: ProgramCoordinator, captures: { rev_id: $.data.id } }
            - { call: "POST /econsult/panel-memberships", payload: { specialist_id: "${spec_id}", specialty_track_id: "${track_id}" }, as: ProgramCoordinator, captures: { memb_id: $.data.id } }
            - { call: "POST /econsult/specialist-availability-windows", payload: { membership_id: "${memb_id}", window_start: "2026-05-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z" }, as: Specialist, as_user_id: "${spec_id}" }
            - { call: "POST /econsult/consult-requests", payload: { patient_ref: "PAT-TC1", specialty_track_id: "${track_id}", question_text: "Requesting cath referral for atypical symptoms with negative stress test; appropriateness check.", icd10_primary: "R07", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${prov_id}", captures: { cons_id: $.data.id } }
            - { call: "POST /econsult/consult-requests/${cons_id}/responses", payload: { disposition: "MANAGE_IN_PRIMARY_CARE", recommendation_text: "No cath indicated; optimize risk factors and repeat stress imaging only if symptoms change." }, as: Specialist, as_user_id: "${spec_id}", captures: { resp_id: $.data.id } }
            - { call: "POST /econsult/quality-reviews", payload: { response_id: "${resp_id}" }, as: QualityReviewer, as_user_id: "${rev_id}", captures: { rev_1: $.data.id } }
          trigger:
            - { call: "POST /econsult/quality-reviews/${rev_1}/complete", payload: { timeliness_score: 2, appropriateness_score: 1, clarity_score: 4, verdict: "REBUKE" }, as: QualityReviewer, as_user_id: "${rev_id}", captures: { rev_verdict: $.data.verdict, rev_composite: $.data.composite_score_bps } }
            - { call: "GET /econsult/consult-responses/${resp_id}", as: ProgramCoordinator, captures: { resp_status: $.data.status } }
            - { call: "GET /econsult/compensation-entries", payload: { consult_id: "${cons_id}" }, as: ProgramCoordinator, captures: { fee_posture: "$.data[0].posture" } }
            - { call: "GET /econsult/panel-memberships/${memb_id}", as: ProgramCoordinator, captures: { m_standing: $.data.standing, m_score: $.data.quality_score_bps, m_rebukes: $.data.rebuke_count, m_prov: $.data.provisional_balance_cents } }
          assert:
            - "link 1: QualityReview.${rev_1}.status == COMPLETED, composite_score_bps == 4000, verdict == REBUKE"
            - "link 2: ConsultResponse.${resp_id}.status == REBUKED"
            - "link 3: the RESPONSE_FEE CompensationEntry posture == REVERSED and PanelMembership.rebuke_count == 1 and provisional_balance_cents == 0"
            - "link 4: PanelMembership.quality_score_bps == 6400 and standing == PROBATION"

      - name: clock_sweep_expiry_cascades_to_membership_counters
        grounds:
          - state_machines.ConsultRequest.ASSIGNED_to_EXPIRED
          - state_machines.ConsultRequest.QUEUED_to_EXPIRED
          - entities.PanelMembership.fields.expired_count
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (POST /_clock/set_current_utc,
          not a review): [1] clock advance past sla_due_at + 24h grace moves the
          ASSIGNED consult to EXPIRED, which causes [2] membership.expired_count
          += 1 and open_consult_count -= 1 and billing_status -> VOID. A second
          QUEUED consult on a paneless track expires in the same sweep via the
          72h queue TTL, showing two expiry branches off one trigger.
