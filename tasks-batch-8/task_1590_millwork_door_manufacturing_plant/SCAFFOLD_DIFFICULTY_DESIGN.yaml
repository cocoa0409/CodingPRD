          assert:
            - "captured ${avail2} == 1 (3 - 2 after first issue)"
            - "captured ${avail3} == 0 (boundary: second issue consumed exactly the last serial)"
            - "LabelAllocation.${alloc2}.status == ISSUED (count == available succeeded)"
            - "captured ${err} == ERR_INSUFFICIENT_LABEL_SERIALS (count 1 > available 0 fails)"
      - name: truck_leaf_capacity_exact_boundary
        grounds:
          - calculations.trip_load_accounting
          - errors[ERR_TRUCK_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Metric = committed leaf count, endpoint = POST
          /millwork/delivery-trips/{id}/assign. committed + leaf_count ==
