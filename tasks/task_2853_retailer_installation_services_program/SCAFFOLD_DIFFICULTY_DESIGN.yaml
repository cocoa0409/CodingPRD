              payload: { customer_id: "${cust_id}", service_category_id: "${cat_id}", jurisdiction_id: "${jur_id}", site_address: "5 Beacon Row", estimated_units: 420.00, requested_install_date: "2026-08-25T13:00:00.000Z" }
              as: ProjectCoordinator
              captures: { pc_id: $.data.id }
            - call: "POST /projects/${pc_id}/permit/apply"
              payload: { permit_application_reference: "MC-2026-0003" }
              as: ProjectCoordinator
            - call: "POST /projects/${pc_id}/permit/issue"
              payload: { permit_fee_cents: 18500, permit_issued_on: "2026-08-01T00:00:00.000Z" }
              as: ProjectCoordinator
          trigger:
            - call: "POST /projects/${pc_id}/inspection-slot"
              payload: { inspection_slot_start: "2026-08-10T11:00:00.000Z", inspection_slot_end: "2026-08-10T13:00:00.000Z" }
              as: ProjectCoordinator
            - call: "POST /projects/${pc_id}/inspection-slot"
              payload: { inspection_slot_start: "2026-08-10T11:00:01.000Z", inspection_slot_end: "2026-08-10T13:00:00.000Z" }
              as: ProjectCoordinator
          assert:
            - "First attempt: HTTP 409 ERR_INSPECTION_CAPACITY_FULL — the closed interval starting at 11:00:00 touches PA's end AND overlaps PB, so 2 other INSPECTION_SCHEDULED projects intersect and 2 is not strictly less than max_concurrent_inspections 2"
            - "After the refusal, Project.${pc_id}.permit_status is still ISSUED and inspection_slot_start is null"
            - "Second attempt succeeds: Project.${pc_id}.permit_status == INSPECTION_SCHEDULED AND inspection_slot_start == 2026-08-10T11:00:01.000Z AND inspection_slot_end == 2026-08-10T13:00:00.000Z — one second later only PB intersects, and 1 < 2"
            - "Project.${pa_id}.permit_status == INSPECTION_SCHEDULED and Project.${pb_id}.permit_status == INSPECTION_SCHEDULED, untouched by either attempt"
            - "All three projects have permit_responsibility == RETAILER AND permit_fee_cents_billed == 18500 AND inspection_attempt_count == 0"
            - "All three projects have fulfillment_status == MEASURED and financial_status == QUOTED — the inspection dimension moved on its own"

  # ===========================================================================
  # RULE 9 — compensating_invariant
  # Two DIFFERENT conserved quantities, each broken and restored by an undo:
  #   Project.deposit_paid_cents  == held + applied + refunded + forfeited
  #   Installer.committed_minutes == sum of duration_minutes over the
  #                                  {HELD, CONFIRMED, IN_PROGRESS, COMPLETED} set
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: deposit_four_bucket_total_is_conserved_through_cancel_and_reinstate
        grounds:
          - calculations.project_total_due.conservation_invariant
          - calculations.cancellation_settlement.formula.STEP7
          - state_machines.Project.financial_status.DEPOSIT_HELD_to_PARTIALLY_REFUNDED
          - state_machines.Project.financial_status.PARTIALLY_REFUNDED_to_DEPOSIT_HELD
          - state_machines.Project.fulfillment_status.CANCELLED_to_MEASURED
          - concurrency_rules.project-reinstate-stale-project
          - endpoints[POST /projects/{id}/cancel]
          - endpoints[POST /projects/{id}/reinstate]
        distinguishing_aspect: |
          Conserved quantity: Project.deposit_paid_cents, which must always equal
          deposit_held_cents + deposit_applied_cents + deposit_refunded_cents +
          deposit_forfeited_cents. The cancellation moves 29751 into the
          forfeited bucket and 29251 into the refunded bucket, and the
          reinstatement inside the 72-hour window must move the WHOLE of both
          back into held and zero them, landing on 59002 / 0 / 0 / 0 with
          deposit_paid_cents untouched at 59002. An implementation that re-derives
          the held amount from a fresh settlement, or that forgets the forfeited
          bucket, drifts off 59002 and fails.
        test_recipe:
          setup:
            - "Logical clock starts at 2026-08-01T00:00:00.000Z, which is therefore Project.created_at."
            - "ServiceCategory FLOOR-DIRECT (measurement_required false, permit_policy NEVER) and Jurisdiction METRO-01 with inspection_required false."
            - "One Customer whose project_count stays at 1, so the GOODWILL tier T4 cannot match."
            - "One Installer ACTIVE with a VERIFIED FLOORING credential."
            - "One Project with estimated_units 420.00, quoted_labor_cents 196673, deposit_required_cents 59002, that deposit paid: buckets are 59002 paid / 59002 held / 0 applied / 0 refunded / 0 forfeited."
            - "One MaterialDelivery moved to IN_TRANSIT (material_cost_cents 250000) and one HELD InstallerAssignment for 480 minutes, so fulfillment_status is SCHEDULED and Installer.committed_minutes is 480."
            - "The clock is then moved to 2026-08-11T00:00:00.000Z — 10 days after creation, so the COOLING_OFF tier T2 cannot match either, and the cancellation is done by the Customer so T1 cannot match."
          setup_api_calls:
            - call: "POST /service-categories"
              payload: { code: "FLOOR-DIRECT", name: "Direct-Ship Flooring Install", trade_code: "FLOORING", unit_of_measure: "SQFT", base_labor_rate_cents_per_unit: 425, minimum_billable_units: 150.00, measurement_required: false, permit_policy: "NEVER", deposit_pct: 0.30, status: "ACTIVE" }
              as: ProgramAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /jurisdictions"
              payload: { code: "METRO-01", name: "Metro County", permit_required_trades: ["FLOORING", "HVAC", "ROOFING"], permit_responsible_party: "RETAILER", inspection_required: false, min_liability_coverage_cents: 100000000, permit_unit_threshold: 250.00, inspection_lead_days: 3, max_concurrent_inspections: 2, background_check_recency_days: 365, license_required: true, labor_complexity_multiplier: 1.15, status: "ACTIVE" }
              as: ProgramAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Dana Reyes", email: "dana@example.com", jurisdiction_id: "${jur_id}" }
              as: ProgramAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /installers"
              payload: { legal_name: "Northside Flooring LLC", contact_email: "ops@northside.example", primary_trade_code: "FLOORING", liability_coverage_cents: 200000000, insurance_expires_on: "2027-06-30T00:00:00.000Z" }
              as: NetworkManager
              captures: { inst_id: $.data.id }
            - call: "POST /installers/${inst_id}/credentials"
              payload: { jurisdiction_id: "${jur_id}", trade_code: "FLOORING", license_number: "FL-99213", license_expires_on: "2027-05-31T00:00:00.000Z", permit_pulling_authorized: true }
              as: NetworkManager
              captures: { cred_id: $.data.id }
            - call: "POST /installer-credentials/${cred_id}/verify"
              payload: { verification_decision: "VERIFY" }
              as: NetworkManager
            - call: "POST /installers/${inst_id}/background-check"
              payload: { result: "PASS", completed_at: "2026-07-15T00:00:00.000Z" }
              as: NetworkManager
            - call: "POST /installers/${inst_id}/activate"
              payload: {}
              as: NetworkManager
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", service_category_id: "${cat_id}", jurisdiction_id: "${jur_id}", site_address: "18 Larch Way", estimated_units: 420.00, requested_install_date: "2026-08-25T13:00:00.000Z" }
              as: ProjectCoordinator
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/deposit"
              payload: { amount_cents: 59002 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { pv_after_deposit: $.data.version, paid_before: $.data.deposit_paid_cents }
            - call: "POST /projects/${proj_id}/material-deliveries"
              payload: { promised_window_start: "2026-08-22T08:00:00.000Z", promised_window_end: "2026-08-24T08:00:00.000Z", sku_count: 6, material_cost_cents: 250000 }
              as: ProjectCoordinator
              captures: { deliv_id: $.data.id }
            - call: "POST /installer-assignments"
              payload: { project_id: "${proj_id}", installer_id: "${inst_id}", window_start: "2026-08-25T08:00:00.000Z", window_end: "2026-08-25T16:00:00.000Z", expected_project_version: "${pv_after_deposit}" }
              as: ProjectCoordinator
              captures: { asg_id: $.data.id }
            - call: "POST /material-deliveries/${deliv_id}/status"
              payload: { new_status: "IN_TRANSIT" }
              as: ProjectCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-11T00:00:00.000Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /projects/${proj_id}/cancel"
              payload: { cancel_reason: "Customer is moving out of state" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { pv_after_cancel: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-12T00:00:00.000Z" }
              as: ProgramAdmin
            - call: "POST /projects/${proj_id}/reinstate"
              payload: { expected_project_version: "${pv_after_cancel}", reinstate_note: "Move fell through; customer wants the original install" }
              as: ProjectCoordinator
          assert:
            - "After the cancel: labor_forfeit_cents 14751 (round_half_up(59002 * 0.25)) plus restocking 15000 (round_half_up(250000 * 0.06)) gives gross 29751, tier NONE, so deposit_forfeited_cents == 29751 and deposit_refunded_cents == 29251"
            - "After the cancel: deposit_held_cents == 0 AND deposit_applied_cents == 0 AND financial_status == PARTIALLY_REFUNDED AND fulfillment_status == CANCELLED AND cancelled_at == 2026-08-11T00:00:00.000Z"
            - "Invariant after the cancel: deposit_paid_cents == 59002 == 0 + 0 + 29251 + 29751"
            - "After the cancel: InstallerAssignment.${asg_id}.status == RELEASED with release_reason PROJECT_CANCELLED, Installer.${inst_id}.committed_minutes == 0, MaterialDelivery.${deliv_id}.status == RETURNED"
            - "After the reinstate (24 hours later, strictly inside the 72-hour window): deposit_held_cents == 59002 AND deposit_refunded_cents == 0 AND deposit_forfeited_cents == 0 AND deposit_applied_cents == 0"
            - "Invariant after the reinstate: deposit_paid_cents is still exactly 59002 == 59002 + 0 + 0 + 0 — no drift, and quoted_labor_cents is still 196673"
            - "After the reinstate: financial_status == DEPOSIT_HELD AND fulfillment_status == MEASURED AND cancelled_at == null AND cancel_reason == null"
            - "History is NOT rewound: InstallerAssignment.${asg_id}.status is still RELEASED and MaterialDelivery.${deliv_id}.status is still RETURNED"

      - name: installer_committed_minutes_are_conserved_through_release_and_rebooking
        grounds:
          - calculations.installer_capacity_and_overlap.constants.MAX_COMMITTED_MINUTES
          - entities.Installer.fields.committed_minutes
          - entities.InstallerAssignment.fields.duration_minutes
          - state_machines.InstallerAssignment.HELD_to_RELEASED
          - state_machines.InstallerAssignment.IN_PROGRESS_to_COMPLETED
          - endpoints[POST /installer-assignments/{id}/release]
        distinguishing_aspect: |
          A DIFFERENT conserved quantity: Installer.committed_minutes, which must
          always equal the sum of duration_minutes over that installer's
          assignments in {HELD, CONFIRMED, IN_PROGRESS, COMPLETED} — RELEASED
          assignments contribute nothing even though their duration_minutes is
          still stored. The release of a 480-minute hold must return exactly 480
          (leaving 0, not 480 and not -480), and the later 240-minute booking must
          leave exactly 240 both while live and after it reaches COMPLETED.
        test_recipe:
          setup:
            - "Logical clock starts at 2026-08-01T00:00:00.000Z."
            - "ServiceCategory FLOOR-DIRECT (measurement_required false, permit_policy NEVER) and Jurisdiction METRO-01 with inspection_required false."
            - "One Installer ACTIVE with a VERIFIED FLOORING credential, committed_minutes 0."
            - "One Project with estimated_units 420.00 and its 59002 deposit paid."
            - "One MaterialDelivery with promised_window_end 2026-08-24T08:00:00.000Z."
            - "One InstallerAssignment A1 HELD for [2026-08-20T08:00:00.000Z, 2026-08-20T16:00:00.000Z), i.e. 480 minutes, so committed_minutes is 480 and fulfillment_status is SCHEDULED."
          setup_api_calls:
            - call: "POST /service-categories"
              payload: { code: "FLOOR-DIRECT", name: "Direct-Ship Flooring Install", trade_code: "FLOORING", unit_of_measure: "SQFT", base_labor_rate_cents_per_unit: 425, minimum_billable_units: 150.00, measurement_required: false, permit_policy: "NEVER", deposit_pct: 0.30, status: "ACTIVE" }
              as: ProgramAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /jurisdictions"
              payload: { code: "METRO-01", name: "Metro County", permit_required_trades: ["FLOORING", "HVAC", "ROOFING"], permit_responsible_party: "RETAILER", inspection_required: false, min_liability_coverage_cents: 100000000, permit_unit_threshold: 250.00, inspection_lead_days: 3, max_concurrent_inspections: 2, background_check_recency_days: 365, license_required: true, labor_complexity_multiplier: 1.15, status: "ACTIVE" }
              as: ProgramAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Dana Reyes", email: "dana@example.com", jurisdiction_id: "${jur_id}" }
              as: ProgramAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /installers"
              payload: { legal_name: "Northside Flooring LLC", contact_email: "ops@northside.example", primary_trade_code: "FLOORING", liability_coverage_cents: 200000000, insurance_expires_on: "2027-06-30T00:00:00.000Z" }
              as: NetworkManager
              captures: { inst_id: $.data.id }
            - call: "POST /installers/${inst_id}/credentials"
              payload: { jurisdiction_id: "${jur_id}", trade_code: "FLOORING", license_number: "FL-99213", license_expires_on: "2027-05-31T00:00:00.000Z", permit_pulling_authorized: true }
              as: NetworkManager
              captures: { cred_id: $.data.id }
            - call: "POST /installer-credentials/${cred_id}/verify"
              payload: { verification_decision: "VERIFY" }
              as: NetworkManager
            - call: "POST /installers/${inst_id}/background-check"
              payload: { result: "PASS", completed_at: "2026-07-15T00:00:00.000Z" }
              as: NetworkManager
            - call: "POST /installers/${inst_id}/activate"
              payload: {}
              as: NetworkManager
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", service_category_id: "${cat_id}", jurisdiction_id: "${jur_id}", site_address: "18 Larch Way", estimated_units: 420.00, requested_install_date: "2026-08-25T13:00:00.000Z" }
              as: ProjectCoordinator
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/deposit"
              payload: { amount_cents: 59002 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { pv1: $.data.version }
            - call: "POST /projects/${proj_id}/material-deliveries"
              payload: { promised_window_start: "2026-08-22T08:00:00.000Z", promised_window_end: "2026-08-24T08:00:00.000Z", sku_count: 6, material_cost_cents: 250000 }
              as: ProjectCoordinator
              captures: { deliv_id: $.data.id }
            - call: "POST /installer-assignments"
              payload: { project_id: "${proj_id}", installer_id: "${inst_id}", window_start: "2026-08-20T08:00:00.000Z", window_end: "2026-08-20T16:00:00.000Z", expected_project_version: "${pv1}" }
              as: ProjectCoordinator
              captures: { a1_id: $.data.id, a1_duration: $.data.duration_minutes }
          trigger:
            - call: "POST /installer-assignments/${a1_id}/release"
              payload: { release_reason: "Crew reassigned to a storm-damage backlog" }
              as: ServiceManager
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: ProjectCoordinator
              captures: { pv2: $.data.version }
            - call: "POST /installer-assignments"
              payload: { project_id: "${proj_id}", installer_id: "${inst_id}", window_start: "2026-08-25T08:00:00.000Z", window_end: "2026-08-25T12:00:00.000Z", expected_project_version: "${pv2}" }
              as: ProjectCoordinator
              captures: { a2_id: $.data.id }
            - call: "POST /installer-assignments/${a2_id}/confirm"
              payload: {}
              as: ProjectCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T08:00:00.000Z" }
              as: ProgramAdmin
            - call: "POST /installer-assignments/${a2_id}/start"
              payload: {}
              as: Installer
              as_user_id: "${inst_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T11:30:00.000Z" }
              as: ProgramAdmin
            - call: "POST /installer-assignments/${a2_id}/complete"
              payload: { completed_at: "2026-08-25T11:30:00.000Z" }
              as: Installer
              as_user_id: "${inst_id}"
          assert:
            - "Before the release: InstallerAssignment.${a1_id}.duration_minutes == 480 AND Installer.${inst_id}.committed_minutes == 480"
            - "After the release: Installer.${inst_id}.committed_minutes == 0 exactly, while InstallerAssignment.${a1_id}.status == RELEASED still reports duration_minutes 480 with release_reason set"
            - "After the release: Project.${proj_id}.fulfillment_status == MEASURED (the release reverted the schedule) and version == ${pv2}"
            - "After A2 is created: InstallerAssignment.${a2_id}.duration_minutes == 240 AND Installer.${inst_id}.committed_minutes == 240 — the freed 480 was not double-counted"
            - "After A2 confirms (delivery slack floor(86400 / 3600) == 24): status == CONFIRMED and committed_minutes is still 240"
            - "After A2 completes: InstallerAssignment.${a2_id}.status == COMPLETED AND on_time == true AND Installer.${inst_id}.committed_minutes == 240, because COMPLETED assignments stay inside the committed set"
            - "Project.${proj_id}.final_labor_cents == 196673 AND total_due_cents == 196673 AND deposit_applied_cents == 59002 AND balance_due_cents == 137671 AND financial_status == BALANCE_DUE"
            - "Installer.${inst_id}.completed_project_count == 1 AND rolling_event_count == 1 (one ON_TIME_COMPLETION event) AND status == ACTIVE"
