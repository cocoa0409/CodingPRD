  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      # --- #1: bare interval overlap (half-open, buffer 0) ---
      - name: shift_overlap_half_open_no_buffer
        grounds:
          - state_machines.VolunteerShift.OPEN_to_BOOKED
          - validations[priority=11]
          - errors[ERR_SHIFT_OVERLAP]
          - entities.VolunteerShift.fields.setup_buffer_minutes
        distinguishing_aspect: |
          With setup_buffer_minutes 0 on BOTH shifts, two shifts overlap when
          their half-open intervals intersect: [09:00,12:00) and [11:00,13:00)
          overlap at 11:00-12:00 -> second book rejected. Adjacency at exactly
          12:00 (next instance) does NOT. Interval semantics: pure half-open
          intersection, no buffer.
        test_recipe:
          setup:
            - "ACTIVE EVENT campaign, 1 seller (for activation), 1 volunteer; shift A [09:00,12:00) BOOKED for the volunteer; shift B [11:00,13:00) OPEN, buffer 0."
          setup_api_calls:
