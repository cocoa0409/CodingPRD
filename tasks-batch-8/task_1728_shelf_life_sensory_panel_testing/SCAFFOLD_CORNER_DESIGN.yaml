      - name: correlation_insufficient_pairs_rejected
        claim_type: correct_result
        grounds: [calculations.micro_sensory_correlation, "errors[ERR_INSUFFICIENT_CORRELATION_PAIRS]"]
        distinguishing_aspect: "Fewer than 3 paired time points (here: zero ANALYZED sessions, so 0 pairs) -> ERR_INSUFFICIENT_CORRELATION_PAIRS (422), no coefficient emitted."
        test_recipe:
          setup: ["REAL_TIME study IN_PROGRESS with 1 control arm, tp0, and one PH result posted (no ANALYZED session exists)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: LabDirector }
