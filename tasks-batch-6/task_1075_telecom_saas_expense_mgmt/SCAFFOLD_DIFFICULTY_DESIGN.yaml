scaffold_difficulty_design:
  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: invoice_line_expected_provisional_vs_final
        grounds:
          - calculations.invoice_line_expected_amount
          - entities.InvoiceLineItem.fields.expected_amount_cents
        distinguishing_aspect: |
          On InvoiceLineItem the provisional expected (contracted_quantity=60, tier 0.10, proration 1.0 -> 113000)
          diverges from the final expected computed at review (billed_quantity=45, tier 0.05, proration 1.0 -> 90500).
        test_recipe:
          setup:
            - "SAAS vendor + ACTIVE contract (volume_tier_enabled true); service unit_rate_cents=2000, contracted_quantity=60; invoice RECEIVED with one line billed_quantity=45, full-month half-open period."
          setup_api_calls:
            - call: "POST /vendors"
              payload: { name: "Acme SaaS", vendor_type: "SAAS" }
              as: Sourcing
              captures: { v_id: $.data.id }
            - call: "POST /contracts"
              payload: { vendor_id: "${v_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2026-12-31T00:00:00Z", renewal_notice_days: 60, volume_tier_enabled: true }
              as: Sourcing
              captures: { c_id: $.data.id }
            - call: "POST /contracts/${c_id}/activate"
              payload: {}
              as: Sourcing
            - call: "POST /services"
              payload: { contract_id: "${c_id}", service_type: "SAAS_SUBSCRIPTION", license_type: "PER_SEAT", unit_rate_cents: 2000, contracted_quantity: 60, active_quantity: 42 }
              as: Sourcing
              captures: { s_id: $.data.id }
            - call: "POST /invoices"
              payload: { contract_id: "${c_id}", period_start: "2026-06-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z" }
              as: Analyst
              captures: { inv_id: $.data.id }
            - call: "POST /invoices/${inv_id}/line-items"
              payload: { service_id: "${s_id}", billing_period_start: "2026-06-01T00:00:00Z", billing_period_end: "2026-07-01T00:00:00Z", billed_quantity: 45, billed_amount_cents: 100000 }
              as: Analyst
              captures: { li_id: $.data.id, li_exp_provisional: $.data.expected_amount_cents }
          trigger:
            - call: "POST /invoices/${inv_id}/review"
              payload: {}
              as: Analyst
              captures: { inv_status: $.data.status }
          assert:
            - "li_exp_provisional == 113000"
            - "InvoiceLineItem.${li_id}.expected_amount_cents == 90500 after review"
            - "InvoiceLineItem.${li_id}.variance_cents == 9500 after review"

      - name: rightsizing_projected_vs_realized
        grounds:
          - calculations.rightsizing_savings
          - entities.Recommendation.fields.projected_savings_cents
          - entities.Recommendation.fields.realized_savings_cents
        distinguishing_aspect: |
          On Recommendation the projected savings annualize over 12 months (15*2000*12 = 360000) while the realized
          savings prorate over the 7 months remaining to term_end from the implementation clock (15*2000*7 = 210000).
        test_recipe:
          setup:
            - "ACTIVE contract term_end 2026-12-31; service unit_rate_cents=2000, contracted_quantity=60, active_quantity=42; logical clock 2026-06-01; PROPOSED DOWNGRADE_SEATS rec target_quantity=45."
          setup_api_calls:
            - call: "POST /vendors"
              payload: { name: "Acme SaaS", vendor_type: "SAAS" }
              as: Sourcing
              captures: { v_id: $.data.id }
            - call: "POST /contracts"
              payload: { vendor_id: "${v_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2026-12-31T00:00:00Z", renewal_notice_days: 60 }
              as: Sourcing
              captures: { c_id: $.data.id }
            - call: "POST /contracts/${c_id}/activate"
              payload: {}
              as: Sourcing
            - call: "POST /services"
              payload: { contract_id: "${c_id}", service_type: "SAAS_SUBSCRIPTION", license_type: "PER_SEAT", unit_rate_cents: 2000, contracted_quantity: 60, active_quantity: 42 }
              as: Sourcing
              captures: { s_id: $.data.id, s_ver: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /services/${s_id}/recommendations"
              payload: { rec_type: "DOWNGRADE_SEATS", target_quantity: 45, expected_service_version: "${s_ver}" }
              as: Analyst
              captures: { r_id: $.data.id, r_projected: $.data.projected_savings_cents }
          trigger:
            - call: "POST /recommendations/${r_id}/implement"
              payload: {}
              as: FinanceApprover
              as_user_id: "fa_1"
              captures: { r_realized: $.data.realized_savings_cents }
          assert:
            - "r_projected == 360000"
            - "r_realized == 210000"
            - "Service.${s_id}.contracted_quantity == 45 after implement"

  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: invoice_expected_tier_proration_fee_mode_a
        grounds:
          - calculations.invoice_line_expected_amount
          - entities.InvoiceLineItem.fields.expected_amount_cents
        distinguishing_aspect: |
          Mode (a): the final expected combines >=3 interacting inputs -- tier discount 0.05 (billed_quantity=45),
          proration 0.5 (15-day half-open period / 30), and the SAAS platform fee branch -> round_half_up(90000*0.95*0.5)+5000 = 47750.
        test_recipe:
          setup:
            - "SAAS ACTIVE contract; service unit_rate_cents=2000; invoice line billed_quantity=45 over a 15-day half-open period; reviewed."
          setup_api_calls:
            - call: "POST /vendors"
              payload: { name: "Acme SaaS", vendor_type: "SAAS" }
              as: Sourcing
              captures: { v_id: $.data.id }
            - call: "POST /contracts"
              payload: { vendor_id: "${v_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2026-12-31T00:00:00Z", renewal_notice_days: 60, volume_tier_enabled: true }
              as: Sourcing
              captures: { c_id: $.data.id }
            - call: "POST /contracts/${c_id}/activate"
              payload: {}
              as: Sourcing
            - call: "POST /services"
              payload: { contract_id: "${c_id}", service_type: "SAAS_SUBSCRIPTION", license_type: "PER_SEAT", unit_rate_cents: 2000, contracted_quantity: 60, active_quantity: 42 }
              as: Sourcing
              captures: { s_id: $.data.id }
            - call: "POST /invoices"
              payload: { contract_id: "${c_id}", period_start: "2026-06-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z" }
              as: Analyst
              captures: { inv_id: $.data.id }
            - call: "POST /invoices/${inv_id}/line-items"
              payload: { service_id: "${s_id}", billing_period_start: "2026-06-01T00:00:00Z", billing_period_end: "2026-06-16T00:00:00Z", billed_quantity: 45, billed_amount_cents: 50000 }
              as: Analyst
              captures: { li_id: $.data.id }
          trigger:
            - call: "POST /invoices/${inv_id}/review"
              payload: {}
              as: Analyst
          assert:
            - "InvoiceLineItem.${li_id}.expected_amount_cents == 47750 after review"
            - "InvoiceLineItem.${li_id}.variance_cents == 2250 after review"

      - name: chargeback_rounding_remainder_top_weight_mode_b
        grounds:
          - calculations.chargeback_allocation
          - entities.Allocation.fields.amount_cents
        distinguishing_aspect: |
          Mode (b): shares are round_half_up per weight THEN the signed remainder is assigned to the single top-weight
          allocation; for net 90500 split 33.33/33.33/33.34 the raw sum rounds to 90501 so the -1 remainder lands on the
          33.34 share -> {30164, 30164, 30172}. "sum-then-round" would not produce these cents.
        test_recipe:
          setup:
            - "A BILLED line with net_amount_cents=90500 and three cost centers A/B/C."
          setup_api_calls:
            - call: "POST /vendors"
              payload: { name: "Acme SaaS", vendor_type: "SAAS" }
              as: Sourcing
              captures: { v_id: $.data.id }
            - call: "POST /contracts"
              payload: { vendor_id: "${v_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2026-12-31T00:00:00Z", renewal_notice_days: 60 }
              as: Sourcing
              captures: { c_id: $.data.id }
            - call: "POST /contracts/${c_id}/activate"
              payload: {}
              as: Sourcing
            - call: "POST /services"
              payload: { contract_id: "${c_id}", service_type: "SAAS_SUBSCRIPTION", license_type: "PER_SEAT", unit_rate_cents: 2000, contracted_quantity: 60, active_quantity: 42 }
              as: Sourcing
              captures: { s_id: $.data.id }
            - call: "POST /invoices"
              payload: { contract_id: "${c_id}", period_start: "2026-06-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z" }
              as: Analyst
              captures: { inv_id: $.data.id }
            - call: "POST /invoices/${inv_id}/line-items"
              payload: { service_id: "${s_id}", billing_period_start: "2026-06-01T00:00:00Z", billing_period_end: "2026-07-01T00:00:00Z", billed_quantity: 60, billed_amount_cents: 90500 }
              as: Analyst
              captures: { li_id: $.data.id }
            - call: "POST /cost-centers"
              payload: { code: "CC-A", gl_account: "6000", owner_user_id: "own_a" }
              as: SystemAdmin
              captures: { cc_a: $.data.id }
            - call: "POST /cost-centers"
              payload: { code: "CC-B", gl_account: "6001", owner_user_id: "own_b" }
              as: SystemAdmin
              captures: { cc_b: $.data.id }
            - call: "POST /cost-centers"
              payload: { code: "CC-C", gl_account: "6002", owner_user_id: "own_c" }
              as: SystemAdmin
              captures: { cc_c: $.data.id }
          trigger:
            - call: "POST /invoice-line-items/${li_id}/allocations"
              payload: { allocations: [ { cost_center_id: "${cc_a}", weight_pct: 33.33 }, { cost_center_id: "${cc_b}", weight_pct: 33.33 }, { cost_center_id: "${cc_c}", weight_pct: 33.34 } ] }
              as: Analyst
              captures: { alloc_a: "$.data[0].amount_cents", alloc_c: "$.data[2].amount_cents"}
          assert:
            - "alloc_a == 30164"
            - "alloc_c == 30172"
            - "sum of the three Allocation.amount_cents for line ${li_id} == 90500"

  # =================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: dispute_negotiation_cycle
        grounds:
          - state_machines.Dispute.VENDOR_RESPONDED_to_RESUBMITTED
          - state_machines.Dispute.RESUBMITTED_to_VENDOR_RESPONDED
          - entities.Dispute.fields.round_count
        distinguishing_aspect: |
          Dispute loops VENDOR_RESPONDED -> RESUBMITTED -> VENDOR_RESPONDED (round_count increments to 1, offered rises
          6000 -> 8000); this back-edge cycle cannot occur in a linear pipeline.
        test_recipe:
          setup:
            - "Invoice UNDER_REVIEW with a line billed 100000; a SUBMITTED dispute claimed 9500; vendor first response PARTIAL offered 6000 (VENDOR_RESPONDED)."
          setup_api_calls:
            - call: "POST /vendors"
              payload: { name: "Acme SaaS", vendor_type: "SAAS" }
              as: Sourcing
              captures: { v_id: $.data.id }
            - call: "POST /contracts"
              payload: { vendor_id: "${v_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2026-12-31T00:00:00Z", renewal_notice_days: 60 }
              as: Sourcing
              captures: { c_id: $.data.id }
            - call: "POST /contracts/${c_id}/activate"
              payload: {}
              as: Sourcing
            - call: "POST /services"
              payload: { contract_id: "${c_id}", service_type: "SAAS_SUBSCRIPTION", license_type: "PER_SEAT", unit_rate_cents: 2000, contracted_quantity: 60, active_quantity: 42 }
              as: Sourcing
              captures: { s_id: $.data.id }
            - call: "POST /invoices"
              payload: { contract_id: "${c_id}", period_start: "2026-06-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z" }
              as: Analyst
              captures: { inv_id: $.data.id }
            - call: "POST /invoices/${inv_id}/line-items"
              payload: { service_id: "${s_id}", billing_period_start: "2026-06-01T00:00:00Z", billing_period_end: "2026-07-01T00:00:00Z", billed_quantity: 60, billed_amount_cents: 100000 }
              as: Analyst
              captures: { li_id: $.data.id }
            - call: "POST /invoices/${inv_id}/review"
              payload: {}
              as: Analyst
            - call: "POST /invoice-line-items/${li_id}/disputes"
              payload: { disputed_amount_cents: 9500, claimed_credit_cents: 9500 }
              as: Analyst
              captures: { d_id: $.data.id }
            - call: "POST /disputes/${d_id}/respond"
              payload: { response_type: "PARTIAL", offered_credit_cents: 6000 }
              as: Vendor
              as_user_id: "${v_id}"
          trigger:
            - call: "POST /disputes/${d_id}/resubmit"
              payload: { claimed_credit_cents: 9500 }
              as: Analyst
              captures: { d_status_1: $.data.status, d_round: $.data.round_count }
            - call: "POST /disputes/${d_id}/respond"
              payload: { response_type: "PARTIAL", offered_credit_cents: 8000 }
              as: Vendor
              as_user_id: "${v_id}"
              captures: { d_status_2: $.data.status, d_offered: $.data.offered_credit_cents }
          assert:
            - "d_status_1 == RESUBMITTED"
            - "d_round == 1"
            - "d_status_2 == VENDOR_RESPONDED"
            - "d_offered == 8000"

      - name: invoice_dispute_revert_branch
        grounds:
          - state_machines.Invoice.UNDER_REVIEW_to_DISPUTED
          - state_machines.Invoice.DISPUTED_to_UNDER_REVIEW
          - state_machines.InvoiceLineItem.DISPUTED_to_BILLED
        distinguishing_aspect: |
          Invoice branches UNDER_REVIEW -> DISPUTED then reverts DISPUTED -> UNDER_REVIEW on dispute withdrawal (a revert
          edge on a different entity than Dispute), which a strictly linear pipeline cannot express.
        test_recipe:
          setup:
            - "Invoice UNDER_REVIEW with one line; a SUBMITTED dispute drives the invoice to DISPUTED."
          setup_api_calls:
            - call: "POST /vendors"
              payload: { name: "Acme SaaS", vendor_type: "SAAS" }
              as: Sourcing
              captures: { v_id: $.data.id }
            - call: "POST /contracts"
              payload: { vendor_id: "${v_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2026-12-31T00:00:00Z", renewal_notice_days: 60 }
              as: Sourcing
              captures: { c_id: $.data.id }
            - call: "POST /contracts/${c_id}/activate"
              payload: {}
              as: Sourcing
            - call: "POST /services"
              payload: { contract_id: "${c_id}", service_type: "SAAS_SUBSCRIPTION", license_type: "PER_SEAT", unit_rate_cents: 2000, contracted_quantity: 60, active_quantity: 42 }
              as: Sourcing
              captures: { s_id: $.data.id }
            - call: "POST /invoices"
              payload: { contract_id: "${c_id}", period_start: "2026-06-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z" }
              as: Analyst
              captures: { inv_id: $.data.id }
            - call: "POST /invoices/${inv_id}/line-items"
              payload: { service_id: "${s_id}", billing_period_start: "2026-06-01T00:00:00Z", billing_period_end: "2026-07-01T00:00:00Z", billed_quantity: 60, billed_amount_cents: 100000 }
              as: Analyst
              captures: { li_id: $.data.id }
            - call: "POST /invoices/${inv_id}/review"
              payload: {}
              as: Analyst
            - call: "POST /invoice-line-items/${li_id}/disputes"
              payload: { disputed_amount_cents: 9500, claimed_credit_cents: 9500 }
              as: Analyst
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /disputes/${d_id}/withdraw"
              payload: {}
              as: Analyst
              captures: { d_status: $.data.status }
          assert:
            - "Invoice.${inv_id}.status == UNDER_REVIEW after withdraw"
            - "InvoiceLineItem.${li_id}.status == BILLED after withdraw"
            - "d_status == WITHDRAWN"

  # =================================================================
  - rule_id: transitive_cascade
    instances:
      - name: accept_dispute_cascade_depth3
        grounds:
          - state_machines.Dispute.VENDOR_RESPONDED_to_ACCEPTED
          - state_machines.InvoiceLineItem.DISPUTED_to_CREDITED
          - state_machines.Allocation.POSTED_to_REVERSED
          - entities.Contract.fields.total_recovered_cents
        distinguishing_aspect: |
          Accepting the dispute chains four caused hops: accept -> Credit ISSUED (B) -> line net_amount reduced + contract
          total_recovered raised (C) -> POSTED allocation REVERSED and invoice reverts DISPUTED -> UNDER_REVIEW (D). Each
          hop is caused by the prior, not by the accept directly.
        test_recipe:
          setup:
            - "Invoice UNDER_REVIEW; line billed 100000 with one POSTED allocation (weight 100, amount 100000); a dispute claimed 8000 with vendor offered 8000 (VENDOR_RESPONDED)."
          setup_api_calls:
            - call: "POST /vendors"
              payload: { name: "Acme SaaS", vendor_type: "SAAS" }
              as: Sourcing
              captures: { v_id: $.data.id }
            - call: "POST /contracts"
              payload: { vendor_id: "${v_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2026-12-31T00:00:00Z", renewal_notice_days: 60 }
              as: Sourcing
              captures: { c_id: $.data.id }
            - call: "POST /contracts/${c_id}/activate"
              payload: {}
              as: Sourcing
            - call: "POST /services"
              payload: { contract_id: "${c_id}", service_type: "SAAS_SUBSCRIPTION", license_type: "PER_SEAT", unit_rate_cents: 2000, contracted_quantity: 60, active_quantity: 42 }
              as: Sourcing
              captures: { s_id: $.data.id }
            - call: "POST /invoices"
              payload: { contract_id: "${c_id}", period_start: "2026-06-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z" }
              as: Analyst
              captures: { inv_id: $.data.id }
            - call: "POST /invoices/${inv_id}/line-items"
              payload: { service_id: "${s_id}", billing_period_start: "2026-06-01T00:00:00Z", billing_period_end: "2026-07-01T00:00:00Z", billed_quantity: 60, billed_amount_cents: 100000 }
              as: Analyst
              captures: { li_id: $.data.id }
            - call: "POST /invoices/${inv_id}/review"
              payload: {}
              as: Analyst
            - call: "POST /cost-centers"
              payload: { code: "OPS", gl_account: "6000", owner_user_id: "own_ops" }
              as: SystemAdmin
              captures: { cc_id: $.data.id }
            - call: "POST /invoice-line-items/${li_id}/allocations"
              payload: { allocations: [ { cost_center_id: "${cc_id}", weight_pct: 100.00 } ] }
              as: Analyst
              captures: { al_id: "$.data[0].id"}
            - call: "POST /allocations/${al_id}/approve"
              payload: {}
              as: CostCenterOwner
              as_user_id: "own_ops"
            - call: "POST /invoice-line-items/${li_id}/disputes"
              payload: { disputed_amount_cents: 8000, claimed_credit_cents: 8000 }
              as: Analyst
              captures: { d_id: $.data.id }
            - call: "POST /disputes/${d_id}/respond"
              payload: { response_type: "PARTIAL", offered_credit_cents: 8000 }
              as: Vendor
              as_user_id: "${v_id}"
          trigger:
            - call: "POST /disputes/${d_id}/accept"
              payload: {}
              as: Analyst
              captures: { d_status: $.data.status }
          assert:
            - "InvoiceLineItem.${li_id}.credited_amount_cents == 8000"
            - "InvoiceLineItem.${li_id}.net_amount_cents == 92000"
            - "Contract.${c_id}.total_recovered_cents == 8000"
            - "Allocation.${al_id}.status == REVERSED"
            - "Invoice.${inv_id}.status == UNDER_REVIEW after accept"
            - "d_status == ACCEPTED"

      - name: implement_recommendation_cascade_depth2
        grounds:
          - state_machines.Recommendation.PROPOSED_to_IMPLEMENTED
          - state_machines.Service.ACTIVE_to_RIGHTSIZED
          - entities.Contract.fields.monthly_committed_cost_cents
        distinguishing_aspect: |
          Implement chains implement -> Service contracted_quantity/status/version updated (B) -> parent Contract
          monthly_committed_cost_cents recomputed 120000 -> 90000 (C). Different trigger from accept_dispute.
        test_recipe:
          setup:
            - "ACTIVE contract; service unit_rate_cents=2000 contracted_quantity=60 active_quantity=42 (committed 120000); clock 2026-06-01; PROPOSED DOWNGRADE_SEATS target 45."
          setup_api_calls:
            - call: "POST /vendors"
              payload: { name: "Acme SaaS", vendor_type: "SAAS" }
              as: Sourcing
              captures: { v_id: $.data.id }
            - call: "POST /contracts"
              payload: { vendor_id: "${v_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2026-12-31T00:00:00Z", renewal_notice_days: 60 }
              as: Sourcing
              captures: { c_id: $.data.id }
            - call: "POST /contracts/${c_id}/activate"
              payload: {}
              as: Sourcing
            - call: "POST /services"
              payload: { contract_id: "${c_id}", service_type: "SAAS_SUBSCRIPTION", license_type: "PER_SEAT", unit_rate_cents: 2000, contracted_quantity: 60, active_quantity: 42 }
              as: Sourcing
              captures: { s_id: $.data.id, s_ver: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /services/${s_id}/recommendations"
              payload: { rec_type: "DOWNGRADE_SEATS", target_quantity: 45, expected_service_version: "${s_ver}" }
              as: Analyst
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /recommendations/${r_id}/implement"
              payload: {}
              as: FinanceApprover
              as_user_id: "fa_1"
          assert:
            - "Service.${s_id}.contracted_quantity == 45 after implement"
            - "Service.${s_id}.status == RIGHTSIZED after implement"
            - "Contract.${c_id}.monthly_committed_cost_cents == 90000 after implement"
            - "Recommendation.${r_id}.realized_savings_cents == 210000"

  # =================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: dispute_state_beats_fiscal_line_not_disputable
        grounds:
          - validations[priority=5]
          - validations[priority=9]
          - errors[ERR_LINE_NOT_DISPUTABLE]
          - errors[ERR_CREDIT_EXCEEDS_BILLED]
        distinguishing_aspect: |
          On dispute-open the state check (invoice RECEIVED -> line not disputable, priority 5) outranks the fiscal check
          (claimed_credit 999999 > billed 100000, priority 9); the response is ERR_LINE_NOT_DISPUTABLE, not ERR_CREDIT_EXCEEDS_BILLED.
        test_recipe:
          setup:
            - "Invoice still RECEIVED (never reviewed) with a line billed 100000; a dispute-open request that also over-claims."
          setup_api_calls:
            - call: "POST /vendors"
              payload: { name: "Acme SaaS", vendor_type: "SAAS" }
              as: Sourcing
              captures: { v_id: $.data.id }
            - call: "POST /contracts"
              payload: { vendor_id: "${v_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2026-12-31T00:00:00Z", renewal_notice_days: 60 }
