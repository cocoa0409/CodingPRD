            - call: "POST /lending/lien-waivers"
              payload: { loan_id: "${loan1}", contractor_id: "${c2}", waiver_type: "PARTIAL_UNCONDITIONAL", amount_covered_cents: 2000000, through_date: "2026-09-30" }
              as: Contractor
              as_user_id: "${c2}"
            - call: "POST /lending/loans/${loan1}/draw-requests"
              payload: { line_allocations: [{ rehab_line_item_id: "${l_elec}", claimed_percent_complete: 0.70 }], verification_method: "PHOTO", expected_loan_version: "${loan1_v}" }
              as: Borrower
              as_user_id: "${b1}"
