          Entity pair (Offer, Festival): the offer rows are individually flawless and the gate lives
          entirely on the parent's derived lineup_posture. The freeze is reached through the
          committed_ratio >= 1.00 clause of festival_lineup_posture (not through GA_ONSALE and not
