              as: FinanceClerk
              captures: { na_id: $.data.id }
            - call: "GET /franchise/brands/${brand_id}"
              payload: {}
              as: FinanceClerk
              captures: { brand_v: $.data.version }
          trigger:
            - call: "POST /franchise/national-accounts/${na_id}/distribute"
              payload: { expected_brand_version: "${brand_v}" }
              as: FinanceClerk
          assert:
            - "NationalAccount.${na_id}.status == DISTRIBUTED"
            - "rebate share for VendorAuthorization ${auth_id} == 1000000"

      - name: occ_writeoff_stale_version_conflict
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[writeoff-stale-brand]
          - state_machines.RoyaltyStatement.OVERDUE_to_WRITTEN_OFF
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: |
          A write-off carrying an expected_brand_version one less than the brand's current version
          (stale, because an intervening close-period bumped Brand.version) is rejected with ERR_STALE_VERSION
          (412); the statement stays OVERDUE.
        test_recipe:
          setup:
            - "Brand; OPEN unit; ISSUED statement (basis 1000000) driven OVERDUE; the client holds a stale Brand.version captured before a later close-period bumped it."
          setup_api_calls:
            - call: "POST /franchise/brands"
              payload: { name: "B" }
              as: Franchisor
              captures: { brand_id: $.data.id }
            - call: "POST /franchise/territories"
              payload: { brand_id: "${brand_id}", code: "T", name: "T" }
              as: Franchisor
              captures: { terr_id: $.data.id }
            - call: "POST /franchise/franchisees"
              payload: { brand_id: "${brand_id}", legal_name: "FZ", owner_user_id: "u_fz" }
              as: Franchisor
              captures: { fz_id: $.data.id }
            - call: "POST /franchise/franchisees/${fz_id}/approve"
              payload: {}
              as: Franchisor
            - call: "POST /franchise/territories/${terr_id}/assign"
              payload: { franchisee_id: "${fz_id}" }
              as: Franchisor
            - call: "POST /franchise/units"
              payload: { franchisee_id: "${fz_id}", territory_id: "${terr_id}", address: "U1" }
              as: Franchisor
              captures: { unit_id: $.data.id }
            - call: "POST /franchise/units/${unit_id}/open"
              payload: {}
              as: Franchisee
              as_user_id: "u_fz"
            - call: "POST /franchise/sales-reports"
              payload: { unit_id: "${unit_id}", period_index: 0, gross_sales_cents: 1000000, discounts_cents: 0 }
              as: Franchisor
              captures: { sr_id: $.data.id }
            - call: "POST /franchise/sales-reports/${sr_id}/accept"
              payload: {}
              as: FinanceClerk
            - call: "POST /franchise/royalty-statements"
              payload: { unit_id: "${unit_id}", period_index: 0 }
              as: FinanceClerk
              captures: { rs_id: $.data.id }
            - call: "POST /franchise/royalty-statements/${rs_id}/issue"
              payload: {}
              as: FinanceClerk
            - call: "POST /franchise/brands/${brand_id}/close-period"
              payload: {}
              as: Franchisor
            - call: "POST /franchise/brands/${brand_id}/close-period"
              payload: {}
              as: Franchisor
              captures: { brand_v: $.data.version }
            - call: "POST /franchise/brands/${brand_id}/close-period"
              payload: {}
              as: Franchisor
          trigger:
            - call: "POST /franchise/royalty-statements/${rs_id}/write-off"
              payload: { expected_brand_version: "${brand_v}" }
              as: FinanceClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_VERSION"
            - "RoyaltyStatement.${rs_id}.status == OVERDUE   # unchanged after rejected write-off"

  # -------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: immediate_consistency_unit_open_reflects_in_same_response
        claim_type: immediate
        grounds:
          - state_machines.Unit.PLANNED_to_OPEN
          - state_machines.Franchisee.APPROVED_to_ACTIVE
        distinguishing_aspect: |
          Opening the franchisee's first unit immediately reflects operational_status=OPEN in the response
          and the franchisee is immediately ACTIVE (cascaded APPROVED→ACTIVE in the same request).
        test_recipe:
          setup:
            - "Brand; APPROVED franchisee holding an ASSIGNED territory; one PLANNED unit."
          setup_api_calls:
            - call: "POST /franchise/brands"
              payload: { name: "B" }
              as: Franchisor
              captures: { brand_id: $.data.id }
            - call: "POST /franchise/territories"
              payload: { brand_id: "${brand_id}", code: "T", name: "T" }
              as: Franchisor
              captures: { terr_id: $.data.id }
            - call: "POST /franchise/franchisees"
              payload: { brand_id: "${brand_id}", legal_name: "FZ", owner_user_id: "u_fz" }
              as: Franchisor
              captures: { fz_id: $.data.id }
            - call: "POST /franchise/franchisees/${fz_id}/approve"
              payload: {}
              as: Franchisor
            - call: "POST /franchise/territories/${terr_id}/assign"
              payload: { franchisee_id: "${fz_id}" }
              as: Franchisor
            - call: "POST /franchise/units"
              payload: { franchisee_id: "${fz_id}", territory_id: "${terr_id}", address: "U1" }
              as: Franchisor
              captures: { unit_id: $.data.id }
          trigger:
            - call: "POST /franchise/units/${unit_id}/open"
              payload: {}
              as: Franchisee
              as_user_id: "u_fz"
          assert:
            - "response.data.operational_status == OPEN"
            - "Franchisee.${fz_id}.status == ACTIVE   # cascaded immediately on first unit open"

  # -------------------------------------------------------------------------
  # Stubs: corners already exercised by §1.8 difficulty instances.
  # -------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: stub_audit_fail_suspends_unit
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Unit.GOOD_STANDING_to_SUSPENDED
        excluded_because:
          difficulty_instance: non_linear_state_machine / unit_parallel_operational_and_compliance_dimensions
          rationale: "FAIL audit → Unit SUSPENDED (operational stays OPEN) is asserted by that §1.8 instance."

      - name: stub_agreement_transfer_branch
        claim_type: Valid Transition
        grounds:
          - state_machines.FranchiseAgreement.RENEWAL_PENDING_to_TRANSFERRED
        excluded_because:
          difficulty_instance: combinatorial_formula / royalty_aggregate_basis_then_tier_vs_per_report_order
          rationale: "Transfer-branch units/territory reassignment is exercised indirectly; the transfer fee floor path is covered by the §1.9 transfer_fee_floor_applies_for_new_operator corner and §1.8 priority-pair transfer instance."

  - section: errors
    instances:
      - name: stub_err_territory_conflict
        claim_type: violation_to_error
        grounds:
          - errors[ERR_TERRITORY_CONFLICT]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / territory_exclusivity_single_holder
          rationale: "ERR_TERRITORY_CONFLICT is asserted as the failure path of that §1.8 instance."

      - name: stub_err_audit_in_progress
        claim_type: violation_to_error
        grounds:
          - errors[ERR_AUDIT_IN_PROGRESS]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / audit_active_lifetime_capacity_one_per_unit
          rationale: "ERR_AUDIT_IN_PROGRESS is asserted as the failure path of that §1.8 instance."

      - name: stub_err_unit_not_open
        claim_type: violation_to_error
        grounds:
          - errors[ERR_UNIT_NOT_OPEN]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / audit_start_requires_unit_operational_open
          rationale: "ERR_UNIT_NOT_OPEN is asserted as the failure path of that §1.8 instance."

      - name: stub_err_territory_not_held
        claim_type: violation_to_error
        grounds:
          - errors[ERR_TERRITORY_NOT_HELD]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / unit_open_requires_territory_assigned_to_franchisee
          rationale: "ERR_TERRITORY_NOT_HELD is asserted as the failure path of that §1.8 instance."

      - name: stub_err_not_resource_owner
        claim_type: violation_to_error
        grounds:
          - errors[ERR_NOT_RESOURCE_OWNER]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / vendor_authorization_owner_vs_vendor_not_approved
          rationale: "ERR_NOT_RESOURCE_OWNER is the winning error in that §1.8 priority-pair instance."

      - name: stub_err_outstanding_obligations
        claim_type: violation_to_error
        grounds:
          - errors[ERR_OUTSTANDING_OBLIGATIONS]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / agreement_transfer_state_vs_outstanding_obligations
          rationale: "ERR_OUTSTANDING_OBLIGATIONS is the suppressed lower-priority error in that §1.8 instance; its standalone trigger is structurally identical with the agreement already RENEWAL_PENDING."

      - name: stub_err_stale_version_distribute
        claim_type: violation_to_error
        grounds:
          - errors[ERR_STALE_VERSION]
        excluded_because:
          difficulty_instance: compensating_invariant / rebate_pool_conservation_sum_of_shares_equals_pool
          rationale: "The distribute OCC happy path underpins that §1.8 instance; the stale-version distribute failure is the symmetric negative of the §1.9 occ_writeoff_stale_version_conflict corner."
