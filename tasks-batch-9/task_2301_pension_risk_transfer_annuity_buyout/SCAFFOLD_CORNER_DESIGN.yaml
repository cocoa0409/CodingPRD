              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
              captures: { p1_id: $.data.id }
          trigger:
            - call: "GET /prt/plans/${plan_id}"
              payload: {}
              as: Regulator
              as_user_id: "regulator-01"
              captures: { read_plan_state: $.data.plan_status }
            - call: "GET /prt/participants"
              payload: { plan_id: "${plan_id}" }
              as: Regulator
              as_user_id: "regulator-01"
              captures: { read_first_participant: "$.data[0].id" }
            - call: "GET /prt/plans/${plan_id}/funded-status"
              payload: {}
              as: Regulator
              as_user_id: "regulator-01"
              captures: { read_bp: $.data.accounting_funded_status_bp }
            - call: "POST /prt/plans/${plan_id}/participants"
              payload: { participant_reference: "AC-1302", cohort: "DEFERRED_VESTED", stated_monthly_benefit_cents: 100000, final_average_monthly_earnings_cents: 250000, credited_service_months: 320, date_of_birth: "1968-04-04" }
              as: Regulator
              as_user_id: "regulator-01"
            - call: "POST /prt/plans/${plan_id}/settlement-amendment"
              payload: { amendment_action: "ADOPT", amendment_scope: "BUYOUT_ONLY", amendment_effective_date: "2026-08-01T00:00:00Z" }
              as: Regulator
