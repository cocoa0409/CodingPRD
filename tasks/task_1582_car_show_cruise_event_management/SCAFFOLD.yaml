scenario: |
  Car Show & Cruise-In Event Management (local car club show): registration by class & pre-registration vs day-of pricing, vehicle placement/parking layout & arrival flow, judging criteria & ballot tabulation (judged vs people's choice), award class structure & tie-break, vendor/sponsor booth allocation, sound/music & noise ordinance compliance, insurance & liability waivers, weather contingency & refund policy

domain_name: "car-show-event-management"
api_prefix: ""

complexity_profile:
  primary_archetype: posture_driven_gating   # Event lifecycle x weather posture gates all child operations
  secondary_archetype: quota_allocation      # class capacity, zone spots, booth spaces
  complexity_layers:
    - optimistic_concurrency                 # OCC on Event.version (finalize) and Award.version (override)
    - cascading_side_effects                 # weather cancel -> refunds -> ballot voiding -> award revert; sheet submit -> class completion -> event tabulation -> sheet lock
    - rate_threshold_triggers                # noise exceedance count suspends sound permit at threshold 3
    - selector_policy                        # lowest-free-spot assignment; award winner ranking with 5-level tie-break chain
  entity_topology: hybrid                    # Event tree + flat FK references (registrations, sheets, ballots, awards)
  state_machine_shape: posture_driven        # Event lifecycle_status x weather_posture gate children; parallel dims on Event
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties          # tabulation finalizer cannot override winners; judges cannot score own class entries
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Event
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Event display name" }
      - { name: event_date, type: string, source: input, description: "Show date YYYY-MM-DD" }
      - { name: gates_open_at, type: datetime, source: input, description: "Gates open instant (UTC); withdrawal refund windows measure hours before this" }
      - { name: judging_start_at, type: datetime, source: input, description: "Judging window open (inclusive)" }
      - { name: judging_end_at, type: datetime, source: input, description: "Judging window close (exclusive)" }
      - { name: ballot_close_at, type: datetime, source: input, description: "People's choice ballot close (exclusive); ballot window is [gates_open_at, ballot_close_at)" }
      - { name: prereg_deadline, type: datetime, source: input, description: "Pre-registration deadline; clock < deadline => PREREG tier, else DAY_OF" }
      - { name: curfew_start, type: string, source: input, description: "Noise curfew window start, local wall-clock HH:MM; curfew window is [curfew_start, curfew_end) half-open and may wrap midnight" }
      - { name: curfew_end, type: string, source: input, description: "Noise curfew window end, HH:MM, exclusive" }
      - { name: liability_policy_number, type: string, source: input, description: "Insurance liability policy number; must be non-empty before publish", default: "" }
      - { name: tabulation_method, type: enum, source: input, description: "Judged score aggregation variant", default: STRAIGHT_AVERAGE, constraints: "STRAIGHT_AVERAGE | DROP_EXTREMES" }
      - { name: lifecycle_status, type: enum, source: system, description: "DRAFT | PUBLISHED | REGISTRATION_OPEN | REGISTRATION_LOCKED | JUDGING | TABULATING | FINALIZED | CLOSED" }
      - { name: weather_posture, type: enum, source: system, description: "NORMAL | WATCH | POSTPONED | CANCELLED; independent dimension from lifecycle_status" }
      - { name: sound_permit_status, type: enum, source: system, description: "ACTIVE | SUSPENDED; auto-suspends at EXCEEDANCE_SUSPENSION_THRESHOLD exceedances" }
      - { name: treasury_cents, type: integer, source: computed, description: "Sum of SUCCEEDED fee payments (ENTRY_FEE, BOOTH_FEE) minus SUCCEEDED REFUND payments for this event; recomputed immediately on every Payment mutation" }
      - { name: noise_exceedance_count, type: integer, source: computed, description: "Count of NoiseReading rows with is_exceedance=true for this event" }
      - { name: finalized_by_user_id, type: string, source: system, description: "X-User-ID of the Organizer who most recently ran tabulations/finalize; used for segregation-of-duties on override-winner", default: "" }

  - name: ShowClass
    parent: Event
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> Event.id" }
      - { name: code, type: string, source: input, description: "Class code, unique within the event (e.g. MUSCLE_75)" }
      - { name: name, type: string, source: input, description: "Display name" }
      - { name: min_year, type: integer, source: input, description: "Earliest eligible vehicle model year (inclusive)" }
      - { name: max_year, type: integer, source: input, description: "Latest eligible vehicle model year (inclusive); must be >= min_year" }
      - { name: prereg_fee_cents, type: integer, source: input, description: "Base entry fee when pricing_tier is PREREG; >= 0" }
      - { name: day_of_fee_cents, type: integer, source: input, description: "Flat entry fee when pricing_tier is DAY_OF; >= 0" }
      - { name: capacity, type: integer, source: input, description: "Max registrations in non-terminal states (PENDING_PAYMENT, CONFIRMED, CHECKED_IN); >= 1" }
      - { name: judging_mode, type: enum, source: input, description: "JUDGED | PEOPLES_CHOICE | BOTH" }
      - { name: award_depth, type: integer, source: input, description: "Number of CLASS_PLACE award rows (1..3) created for judged classes at start-judging" }
      - { name: confirmed_count, type: integer, source: computed, description: "Count of Registrations in this class with status in {PENDING_PAYMENT, CONFIRMED, CHECKED_IN}" }

  - name: Zone
    parent: Event
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> Event.id" }
      - { name: name, type: string, source: input, description: "Zone name (e.g. Show Field A, Vendor Row)" }
      - { name: zone_type, type: enum, source: input, description: "SHOW_FIELD | OVERFLOW | VENDOR_ROW; vehicle check-in allowed only into SHOW_FIELD/OVERFLOW; booth assignment only into VENDOR_ROW" }
      - { name: capacity, type: integer, source: input, description: "Vehicle spots (SHOW_FIELD/OVERFLOW) or booth spaces (VENDOR_ROW); >= 1" }
      - { name: has_power, type: boolean, source: input, description: "Whether powered booths can be placed here", default: false }
      - { name: arrival_window_start, type: datetime, source: input, description: "Check-in arrival window open (inclusive); null means no window", default: null }
      - { name: arrival_window_end, type: datetime, source: input, description: "Check-in arrival window close (exclusive)", default: null }
      - { name: assigned_count, type: integer, source: computed, description: "SHOW_FIELD/OVERFLOW: count of Registrations with assigned_zone_id = this zone and status CHECKED_IN; VENDOR_ROW: count of occupied booth spaces" }

  - name: Registrant
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Participant full name" }
      - { name: email, type: string, source: input, description: "Unique email; also used to detect judge conflict-of-interest against Judge.email" }
      - { name: club_member, type: boolean, source: input, description: "Club membership flag; drives member fee discount and ballot weight 2", default: false }
      - { name: is_minor, type: boolean, source: input, description: "If true, waiver requires guardian_name", default: false }

  - name: Vehicle
    parent: Registrant
    common_fields: true
    fields:
      - { name: registrant_id, type: string, source: input, description: "FK -> Registrant.id" }
      - { name: year, type: integer, source: input, description: "Model year; must fall within [class.min_year, class.max_year] to register" }
      - { name: make, type: string, source: input, description: "Manufacturer" }
      - { name: model, type: string, source: input, description: "Model" }

  - name: Registration
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> Event.id" }
      - { name: registrant_id, type: string, source: input, description: "FK -> Registrant.id" }
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id" }
      - { name: class_id, type: string, source: input, description: "FK -> ShowClass.id" }
      - { name: pricing_tier, type: enum, source: computed, description: "PREREG if logical clock < event.prereg_deadline at creation, else DAY_OF; client input ignored" }
      - { name: fee_cents, type: integer, source: computed, description: "Entry fee per entry_fee_calc; frozen at creation" }
      - { name: status, type: enum, source: system, description: "PENDING_PAYMENT | CONFIRMED | CHECKED_IN | COMPLETED | WITHDRAWN | REFUND_REQUESTED | REFUNDED | NO_SHOW" }
      - { name: paid_cents, type: integer, source: computed, description: "Sum of SUCCEEDED ENTRY_FEE payments for this registration" }
      - { name: refunded_cents, type: integer, source: computed, description: "Sum of SUCCEEDED REFUND payments for this registration" }
      - { name: assigned_zone_id, type: string, source: system, description: "FK -> Zone.id; nullable, set at check-in", default: null }
      - { name: spot_number, type: integer, source: system, description: "Lowest free spot integer in the assigned zone at check-in time; null until checked in", default: null }
      - { name: checked_in_at, type: datetime, source: system, description: "Logical-clock timestamp of check-in; used as tie-break (earlier wins)", default: null }
      - { name: withdrawn_at, type: datetime, source: system, description: "Logical-clock timestamp when withdrawal was requested; withdrawal refund tier measured from this instant to gates_open_at", default: null }

  - name: Payment
    parent: null
    common_fields: false
    fields:
      - { name: registration_id, type: string, source: input, description: "FK -> Registration.id; nullable, exactly one of registration_id / booth_application_id is set", default: null }
      - { name: booth_application_id, type: string, source: input, description: "FK -> BoothApplication.id; nullable", default: null }
      - { name: kind, type: enum, source: input, description: "ENTRY_FEE | BOOTH_FEE | REFUND" }
      - { name: amount_cents, type: integer, source: input, description: "Positive for fees, positive magnitude for REFUND (subtracted from treasury)" }
      - { name: method, type: enum, source: input, description: "CASH | CARD | CHECK" }
      - { name: status, type: enum, source: system, description: "Always SUCCEEDED at record time; payments are an append-only ledger (no update endpoint)" }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID of the recording actor" }

  - name: Waiver
    parent: null
    common_fields: false
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> Event.id" }
      - { name: registrant_id, type: string, source: input, description: "FK -> Registrant.id" }
      - { name: signature_name, type: string, source: input, description: "Typed legal signature" }
      - { name: guardian_name, type: string, source: input, description: "Required when registrant.is_minor is true", default: null }
      - { name: signed_at, type: datetime, source: system, description: "Logical-clock timestamp of signing; waiver is immutable once created" }

  - name: BoothApplication
    parent: Event
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> Event.id" }
      - { name: business_name, type: string, source: input, description: "Vendor or sponsor business name" }
      - { name: contact_email, type: string, source: input, description: "Vendor contact email" }
      - { name: booth_tier, type: enum, source: input, description: "SINGLE (1 space) | DOUBLE (2 contiguous spaces) | SPONSOR (3 contiguous spaces)" }
      - { name: power_requested, type: boolean, source: input, description: "Whether the booth needs power; requires target zone has_power at assign", default: false }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | REJECTED | PAID | ASSIGNED | CANCELLED" }
      - { name: fee_cents, type: integer, source: computed, description: "Computed at approval per booth_fee_calc (tier fee + power fee)" }
      - { name: paid_cents, type: integer, source: computed, description: "Sum of SUCCEEDED BOOTH_FEE payments minus REFUND payments for this application" }
      - { name: assigned_zone_id, type: string, source: system, description: "FK -> Zone.id; nullable, set at assign", default: null }
      - { name: assigned_spaces, type: array, source: system, description: "Space integers occupied in the assigned zone", default: [] }

  - name: Judge
    parent: Event
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> Event.id" }
      - { name: name, type: string, source: input, description: "Judge display name" }
      - { name: email, type: string, source: input, description: "Judge email; conflict-of-interest when it matches a Registrant.email with a registration in the same class" }
      - { name: assigned_class_ids, type: array, source: input, description: "ShowClass ids this judge may score; empty array means no assignments" }
      - { name: submitted_sheet_count, type: integer, source: computed, description: "Count of this judge's ScoreSheets with status in {SUBMITTED, LOCKED}" }

  - name: ScoreSheet
    parent: null
    common_fields: true
    fields:
      - { name: judge_id, type: string, source: system, description: "FK -> Judge.id; taken from X-User-ID of the Judge actor" }
      - { name: registration_id, type: string, source: input, description: "FK -> Registration.id of the scored vehicle entry" }
      - { name: criteria_scores, type: array, source: input, description: "Exactly five items {criterion, points}; criterion in {EXTERIOR, INTERIOR, ENGINE, AUTHENTICITY, CONDITION}; points integer 0..10" }
      - { name: sheet_total, type: number, source: computed, description: "round_half_up(sum(points * criterion_weight), 1 decimal) per score_tabulation_calc" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | LOCKED" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock timestamp of first submission", default: null }

  - name: Ballot
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> Event.id" }
      - { name: registration_id, type: string, source: input, description: "FK -> Registration.id of the voted entry" }
      - { name: voter_registrant_id, type: string, source: system, description: "FK -> Registrant.id; taken from X-User-ID of the Participant actor; one ballot per (event_id, voter_registrant_id)" }
      - { name: weight, type: integer, source: computed, description: "MEMBER_BALLOT_WEIGHT (2) when voter.club_member else 1" }
      - { name: status, type: enum, source: system, description: "VALID | VOID; VOID when the voted registration leaves CHECKED_IN before finalize" }

  - name: Award
    parent: Event
    common_fields: true
    fields:
      - { name: event_id, type: string, source: system, description: "FK -> Event.id" }
      - { name: class_id, type: string, source: system, description: "FK -> ShowClass.id; null only for BEST_OF_SHOW", default: null }
      - { name: award_kind, type: enum, source: system, description: "CLASS_PLACE | PEOPLES_CHOICE | BEST_OF_SHOW" }
      - { name: place, type: integer, source: system, description: "1..award_depth for CLASS_PLACE; null otherwise", default: null }
      - { name: status, type: enum, source: system, description: "PENDING | COMPUTED | FINALIZED | PRESENTED" }
      - { name: winner_registration_id, type: string, source: computed, description: "FK -> Registration.id; null when class has insufficient entries or no valid ballots", default: null }
      - { name: winner_score, type: number, source: computed, description: "Class score (judged) or ballot tally (people's choice) of the winner; null when no winner", default: null }
      - { name: tie_break_log, type: string, source: computed, description: "Audit string: which tie-break level decided, or NO_VALID_BALLOTS / INSUFFICIENT_ENTRIES / MANUAL_OVERRIDE", default: "" }
      - { name: overridden, type: boolean, source: computed, description: "True once override-winner sets a manual winner; overridden awards are never recomputed by finalize", default: false }

  - name: NoiseReading
    parent: Event
    common_fields: false
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> Event.id" }
      - { name: recorded_at, type: datetime, source: input, description: "Reading instant; defaults to logical clock now when omitted", default: null }
      - { name: reading_db, type: number, source: input, description: "Measured decibels, 1 decimal; > 0" }
      - { name: source, type: enum, source: input, description: "STAGE | PA_SYSTEM | EXHAUST | CROWD" }
      - { name: is_curfew, type: boolean, source: computed, description: "True when recorded_at local time falls in [curfew_start, curfew_end) half-open (window may wrap midnight)" }
      - { name: limit_db, type: number, source: computed, description: "CURFEW_LIMIT_DB (85.0) when is_curfew else DAY_LIMIT_DB (95.0)" }
      - { name: is_exceedance, type: boolean, source: computed, description: "reading_db > limit_db (strictly greater; exactly at limit is compliant)" }

  - name: SoundSlot
    parent: Event
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> Event.id" }
      - { name: performer_name, type: string, source: input, description: "Band / DJ / announcement label" }
      - { name: slot_start, type: datetime, source: input, description: "Slot open (inclusive); must be before slot_end" }
      - { name: slot_end, type: datetime, source: input, description: "Slot close (exclusive)" }
      - { name: expected_db, type: number, source: input, description: "Declared expected volume; informational" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | CANCELLED | COMPLETED; COMPLETED when logical clock advances past slot_end; CANCELLED when permit suspends before slot_start or via cancel" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Event
    initial_state: "lifecycle_status=DRAFT, weather_posture=NORMAL, sound_permit_status=ACTIVE"
    terminal_states: ["lifecycle_status=CLOSED", "weather_posture=CANCELLED"]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /events/{id}/publish"
        actor: Organizer
        preconditions:
          - "lifecycle_status == DRAFT"
          - "liability_policy_number non-empty (else ERR_INSURANCE_POLICY_MISSING)"
          - ">= 1 ShowClass and >= 1 Zone exist for the event (else ERR_VALIDATION)"
          - "prereg_deadline < gates_open_at and gates_open_at <= judging_start_at < judging_end_at (else ERR_VALIDATION)"
        side_effects: ["increments Event.version by 1"]
      - from: PUBLISHED
        to: REGISTRATION_OPEN
        trigger: "POST /events/{id}/open-registration"
        actor: Organizer
        preconditions: ["lifecycle_status == PUBLISHED", "weather_posture in {NORMAL, WATCH}"]
        side_effects: ["increments Event.version by 1"]
      - from: REGISTRATION_OPEN
        to: REGISTRATION_LOCKED
        trigger: "POST /events/{id}/lock-registration"
        actor: Organizer
        preconditions: ["lifecycle_status == REGISTRATION_OPEN"]
        side_effects: ["increments Event.version by 1"]
      - from: REGISTRATION_LOCKED
        to: JUDGING
        trigger: "POST /events/{id}/start-judging"
        actor: Organizer
        preconditions: ["lifecycle_status == REGISTRATION_LOCKED", "weather_posture != CANCELLED"]
        side_effects:
          - "every Registration in CONFIRMED transitions to NO_SHOW (gate never arrived)"
          - "create Award rows in PENDING: for each class with judging_mode in {JUDGED, BOTH}, award_depth CLASS_PLACE rows (place 1..award_depth); for each class with judging_mode in {PEOPLES_CHOICE, BOTH}, one PEOPLES_CHOICE row; exactly one BEST_OF_SHOW row with class_id null"
          - "if at least one judged class exists and every judged class is already complete (no CHECKED_IN registration lacks a {SUBMITTED, LOCKED} sheet from any assigned judge), auto-transition JUDGING -> TABULATING immediately"
          - "increments Event.version by 1"
      - from: JUDGING
        to: TABULATING
        trigger: "system: auto when the last required ScoreSheet is submitted (class completion bubble-up)"
        actor: system
        preconditions:
          - "the event has at least one class with judging_mode in {JUDGED, BOTH}"
          - "for every class with judging_mode in {JUDGED, BOTH}: every Registration with status CHECKED_IN in that class has a ScoreSheet in {SUBMITTED, LOCKED} from every Judge whose assigned_class_ids contains that class"
        side_effects:
          - "every ScoreSheet in SUBMITTED for this event transitions to LOCKED"
          - "increments Event.version by 1"
      - from: TABULATING
        to: FINALIZED
        trigger: "POST /events/{id}/tabulations/finalize"
        actor: Organizer
        preconditions:
          - "lifecycle_status in {TABULATING, FINALIZED}, or lifecycle_status == JUDGING when the event has no class with judging_mode in {JUDGED, BOTH} (people's-choice-only events never auto-advance)"
          - "expected_event_version == Event.version (OCC, else ERR_STALE_VERSION)"
        side_effects:
          - "recompute every non-overridden Award in {PENDING, COMPUTED}: CLASS_PLACE winners per judged_score_tabulation + class_ranking_tiebreak; PEOPLES_CHOICE per peoples_choice_tally (VALID ballots whose registration is CHECKED_IN; zero valid ballots => winner null, tie_break_log NO_VALID_BALLOTS; fewer scored entries than place => winner null, tie_break_log INSUFFICIENT_ENTRIES); BEST_OF_SHOW = highest-scoring CLASS_PLACE place-1 winner across judged classes, ties resolved by the same tie-break chain"
          - "each recomputed Award transitions PENDING -> COMPUTED -> FINALIZED within the same request"
          - "sets finalized_by_user_id to the caller's X-User-ID"
          - "increments Event.version by 1"
      - from: FINALIZED
        to: FINALIZED
        trigger: "POST /events/{id}/tabulations/finalize (re-finalization of PENDING awards, e.g. after a winner withdrawal reverted an award)"
        actor: Organizer
        preconditions: ["lifecycle_status in {TABULATING, FINALIZED} (or JUDGING for people's-choice-only events)", "expected_event_version == Event.version (OCC, else ERR_STALE_VERSION)"]
        side_effects: ["same recompute as TABULATING -> FINALIZED, restricted to non-overridden Awards in {PENDING, COMPUTED}", "increments Event.version by 1"]
      - from: FINALIZED
        to: CLOSED
        trigger: "POST /events/{id}/close"
        actor: Organizer
        preconditions: ["lifecycle_status == FINALIZED OR weather_posture == CANCELLED"]
        side_effects:
          - "every Registration in CHECKED_IN transitions to COMPLETED"
          - "increments Event.version by 1"
      - from: "weather_posture NORMAL"
        to: WATCH
        trigger: "POST /events/{id}/weather-decision {posture: WATCH}"
        actor: Organizer
        preconditions: ["weather_posture == NORMAL"]
        side_effects: ["increments Event.version by 1"]
      - from: WATCH
        to: NORMAL
        trigger: "POST /events/{id}/weather-decision {posture: NORMAL}"
        actor: Organizer
        preconditions: ["weather_posture == WATCH"]
        side_effects: ["increments Event.version by 1"]
      - from: "weather_posture in {NORMAL, WATCH}"
        to: POSTPONED
        trigger: "POST /events/{id}/weather-decision {posture: POSTPONED}"
        actor: Organizer
        preconditions: ["weather_posture in {NORMAL, WATCH}"]
        side_effects:
          - "for every Registration in {CONFIRMED, CHECKED_IN}: create Payment kind=REFUND amount = round_half_up(paid_cents * POSTPONE_CREDIT_PCT) per weather_refund_calc postponement variant, add to refunded_cents, debit treasury_cents"
          - "increments Event.version by 1"
      - from: POSTPONED
        to: NORMAL
        trigger: "POST /events/{id}/weather-decision {posture: NORMAL}"
        actor: Organizer
        preconditions: ["weather_posture == POSTPONED"]
        side_effects: ["increments Event.version by 1"]
      - from: "weather_posture in {NORMAL, WATCH, POSTPONED}"
        to: CANCELLED
        trigger: "POST /events/{id}/weather-decision {posture: CANCELLED}"
        actor: Organizer
        preconditions: ["weather_posture != CANCELLED"]
        side_effects:
          - "L1: every Registration in {CONFIRMED, CHECKED_IN} transitions to REFUND_REQUESTED"
          - "L2 (caused by L1): for each such Registration, auto-create Payment kind=REFUND per weather_refund_calc cancellation variant with two-pass pro-rata cap against the treasury snapshot taken before the batch"
          - "L3 (caused by each REFUND Payment SUCCEEDED): debit Event.treasury_cents, add to Registration.refunded_cents, transition Registration REFUND_REQUESTED -> REFUNDED"
          - "L4 (caused by each Registration -> REFUNDED): Ballots voting for it transition VALID -> VOID; Awards in {COMPUTED, FINALIZED} with winner_registration_id = it revert to PENDING (tie_break_log cleared); if it was CHECKED_IN, assigned Zone.assigned_count decremented and spot freed"
          - "increments Event.version by 1"
      - from: "sound_permit_status ACTIVE"
        to: SUSPENDED
        trigger: "system: a NoiseReading with is_exceedance=true raises noise_exceedance_count to EXCEEDANCE_SUSPENSION_THRESHOLD (3)"
        actor: system
        preconditions: ["noise_exceedance_count reaches 3"]
        side_effects:
          - "every SoundSlot in SCHEDULED with slot_start > clock-now transitions to CANCELLED"
          - "increments Event.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /events/{id}/weather-decision {posture: NORMAL} also reinstates the permit (organizer all-clear)"
        actor: Organizer
        preconditions: ["weather_posture in {WATCH, POSTPONED} when reinstating via that call; direct reinstatement only via weather-decision posture NORMAL"]
        side_effects: ["sound_permit_status := ACTIVE", "increments Event.version by 1"]

  - entity: Registration
    initial_state: PENDING_PAYMENT
    terminal_states: [WITHDRAWN, REFUNDED, NO_SHOW, COMPLETED]
    transitions:
      - from: PENDING_PAYMENT
        to: CONFIRMED
        trigger: "POST /registrations/{id}/payments with amount_cents == fee_cents"
        actor: Participant | RegistrationDesk
        preconditions:
          - "status == PENDING_PAYMENT"
          - "amount_cents == fee_cents (else ERR_PAYMENT_AMOUNT_MISMATCH)"
          - "Event.lifecycle_status == REGISTRATION_OPEN and weather_posture in {NORMAL, WATCH}"
        side_effects:
          - "create Payment kind=ENTRY_FEE status=SUCCEEDED"
          - "paid_cents += amount_cents; Event.treasury_cents += amount_cents (increments Event.version)"
          - "increments Registration.version by 1"
      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /registrations/{id}/check-in"
        actor: RegistrationDesk
        preconditions:
          - "status == CONFIRMED (state, priority before safety)"
          - "Event.lifecycle_status in {REGISTRATION_OPEN, REGISTRATION_LOCKED} and weather_posture != CANCELLED"
          - "a Waiver exists for (registrant_id, event_id) (else ERR_WAIVER_NOT_SIGNED; guardian_name present when registrant.is_minor else ERR_GUARDIAN_SIGNATURE_REQUIRED)"
          - "clock-now within assigned zone's [arrival_window_start, arrival_window_end) when the zone declares a window (else ERR_OUTSIDE_ARRIVAL_WINDOW)"
          - "target zone zone_type in {SHOW_FIELD, OVERFLOW} (else ERR_ZONE_TYPE_INELIGIBLE)"
          - "zone.assigned_count < zone.capacity (else ERR_ZONE_FULL)"
        side_effects:
          - "assigned_zone_id := zone; spot_number := lowest free spot integer in that zone (1..capacity)"
          - "checked_in_at := clock-now; zone.assigned_count += 1"
          - "increments Registration.version by 1"
      - from: CONFIRMED
        to: REFUND_REQUESTED
        trigger: "POST /registrations/{id}/withdraw when withdrawal_refund_calc percentage > 0"
        actor: Participant | RegistrationDesk
        preconditions: ["status == CONFIRMED", "weather_posture != CANCELLED"]
        side_effects: ["withdrawn_at := clock-now", "increments Registration.version by 1"]
      - from: CONFIRMED
        to: WITHDRAWN
        trigger: "POST /registrations/{id}/withdraw when withdrawal_refund_calc percentage == 0 (inside 48h of gates_open_at)"
        actor: Participant | RegistrationDesk
        preconditions: ["status == CONFIRMED", "weather_posture != CANCELLED"]
        side_effects: ["withdrawn_at := clock-now", "Ballots voting for this registration transition VALID -> VOID", "ShowClass.confirmed_count decremented", "increments Registration.version by 1"]
      - from: PENDING_PAYMENT
        to: WITHDRAWN
        trigger: "POST /registrations/{id}/withdraw"
        actor: Participant | RegistrationDesk
        preconditions: ["status == PENDING_PAYMENT"]
        side_effects: ["withdrawn_at := clock-now", "ShowClass.confirmed_count decremented", "increments Registration.version by 1"]
      - from: CHECKED_IN
        to: WITHDRAWN
        trigger: "POST /registrations/{id}/withdraw (day-of pull-out; never refundable)"
        actor: Participant | RegistrationDesk
        preconditions: ["status == CHECKED_IN", "Event.lifecycle_status != FINALIZED or award revert handled per side effects"]
        side_effects:
          - "zone.assigned_count -= 1; spot_number freed (reusable as lowest-free-spot); assigned_zone_id stays for audit"
          - "Ballots voting for this registration transition VALID -> VOID"
          - "Awards in {COMPUTED, FINALIZED} with winner_registration_id = this registration revert to PENDING (not PRESENTED)"
          - "increments Registration.version by 1"
      - from: REFUND_REQUESTED
        to: REFUNDED
        trigger: "POST /registrations/{id}/refund-decision {decision: APPROVE}"
        actor: Organizer
        preconditions:
          - "status == REFUND_REQUESTED"
          - "refund amount := explicit amount_cents when provided, else round_half_up(net_paid_cents * pct) per withdrawal_refund_calc measured at withdrawn_at (net_paid_cents = paid_cents - refunded_cents); the amount must be <= net_paid_cents (else ERR_REFUND_EXCEEDS_PAID)"
        side_effects:
          - "create Payment kind=REFUND status=SUCCEEDED amount = computed refund"
          - "refunded_cents += refund; Event.treasury_cents -= refund (increments Event.version)"
          - "Ballots voting for this registration transition VALID -> VOID; ShowClass.confirmed_count decremented"
          - "increments Registration.version by 1"
      - from: REFUND_REQUESTED
        to: CONFIRMED
        trigger: "POST /registrations/{id}/refund-decision {decision: DENY}"
        actor: Organizer
        preconditions: ["status == REFUND_REQUESTED"]
        side_effects: ["withdrawn_at := null", "increments Registration.version by 1"]
      - from: REFUND_REQUESTED
        to: REFUNDED
        trigger: "system: weather CANCELLED cascade auto-approves (see Event weather cascade L2-L4)"
        actor: system
        preconditions: ["Event.weather_posture transitions to CANCELLED"]
        side_effects: ["REFUND payment created per weather_refund_calc cancellation variant", "refunded_cents updated", "cascade L4 side effects (ballots VOID, award revert, zone release)"]
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "system: POST /events/{id}/start-judging flips all remaining CONFIRMED registrations"
        actor: system
        preconditions: ["Event transitions REGISTRATION_LOCKED -> JUDGING"]
        side_effects: ["ShowClass.confirmed_count decremented"]
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "system: POST /events/{id}/close"
        actor: system
        preconditions: ["Event.lifecycle_status transitions to CLOSED"]
        side_effects: []

  - entity: ScoreSheet
    initial_state: DRAFT
    terminal_states: [LOCKED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /score-sheets/{id}/submit"
        actor: Judge
        preconditions:
          - "status == DRAFT"
          - "acting Judge owns the sheet (judge_id == X-User-ID)"
          - "Event.lifecycle_status == JUDGING (else ERR_INVALID_EVENT_STATE)"
          - "clock-now within [judging_start_at, judging_end_at) (else ERR_JUDGING_WINDOW_CLOSED; temporal priority before constraint)"
          - "judge assigned to the sheet's class (else ERR_JUDGE_NOT_ASSIGNED)"
        side_effects:
          - "submitted_at := clock-now on first submission; Judge.submitted_sheet_count := count of this judge's sheets in {SUBMITTED, LOCKED} (submit +1, reopen -1, resubmit +1)"
          - "L1: recompute class completion; when the submitting sheet completes the last outstanding (registration x judge) pair of the last incomplete judged class, L2: Event auto-transitions JUDGING -> TABULATING; L3 (caused by L2): every SUBMITTED ScoreSheet for the event transitions to LOCKED"
          - "increments ScoreSheet.version by 1"
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /score-sheets/{id}/reopen"
        actor: Organizer
        preconditions: ["status == SUBMITTED", "Event.lifecycle_status == JUDGING (else ERR_INVALID_EVENT_STATE)"]
        side_effects: ["Judge.submitted_sheet_count -= 1", "increments ScoreSheet.version by 1"]
      - from: SUBMITTED
        to: LOCKED
        trigger: "system: Event enters TABULATING"
        actor: system
        preconditions: ["Event.lifecycle_status transitions JUDGING -> TABULATING"]
        side_effects: []

  - entity: BoothApplication
    initial_state: SUBMITTED
    terminal_states: [REJECTED, CANCELLED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /booth-applications/{id}/approve"
        actor: Organizer
        preconditions: ["status == SUBMITTED", "Event.lifecycle_status != CLOSED"]
        side_effects: ["fee_cents computed per booth_fee_calc", "increments BoothApplication.version by 1"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /booth-applications/{id}/reject"
        actor: Organizer
        preconditions: ["status == SUBMITTED"]
        side_effects: ["increments BoothApplication.version by 1"]
      - from: APPROVED
        to: PAID
        trigger: "POST /booth-applications/{id}/payments with amount_cents == fee_cents"
        actor: Vendor | Organizer
        preconditions: ["status == APPROVED", "amount_cents == fee_cents (else ERR_PAYMENT_AMOUNT_MISMATCH)"]
        side_effects:
          - "create Payment kind=BOOTH_FEE status=SUCCEEDED"
          - "paid_cents += amount_cents; Event.treasury_cents += amount_cents (increments Event.version)"
          - "increments BoothApplication.version by 1"
      - from: PAID
        to: ASSIGNED
        trigger: "POST /booth-applications/{id}/assign"
        actor: Organizer
        preconditions:
          - "status == PAID (else ERR_INVALID_BOOTH_STATE)"
          - "target zone zone_type == VENDOR_ROW (else ERR_ZONE_TYPE_INELIGIBLE)"
          - "power_requested implies zone.has_power (else ERR_POWER_NOT_AVAILABLE)"
          - "spaces count matches tier (SINGLE 1, DOUBLE 2, SPONSOR 3) and are contiguous ascending integers (else ERR_BOOTH_SPACES_NOT_CONTIGUOUS)"
          - "no requested space intersects assigned_spaces of any other ASSIGNED application in that zone (else ERR_BOOTH_SPACE_CONFLICT)"
        side_effects: ["assigned_zone_id, assigned_spaces set; zone.assigned_count += len(spaces)", "increments BoothApplication.version by 1"]
      - from: "APPROVED or PAID or ASSIGNED"
        to: CANCELLED
        trigger: "POST /booth-applications/{id}/cancel"
        actor: Organizer | Vendor
        preconditions: ["status in {APPROVED, PAID, ASSIGNED}"]
        side_effects:
          - "if paid_cents > 0: create Payment kind=REFUND amount = paid_cents, debit Event.treasury_cents, zero paid_cents"
          - "if ASSIGNED: release assigned_spaces, zone.assigned_count -= len(spaces)"
          - "increments BoothApplication.version by 1"

  - entity: Award
    initial_state: PENDING
    terminal_states: [PRESENTED]
    transitions:
      - from: PENDING
        to: COMPUTED
        trigger: "system: tabulations/finalize computes the award"
        actor: system
        preconditions: ["finalize runs on the parent Event"]
        side_effects: ["winner_registration_id, winner_score, tie_break_log set per tabulation calcs", "increments Award.version by 1"]
      - from: COMPUTED
        to: FINALIZED
        trigger: "system: same finalize request, second hop"
        actor: system
        preconditions: ["award computed in this finalize pass"]
        side_effects: ["increments Award.version by 1"]
      - from: "COMPUTED or FINALIZED"
        to: PENDING
        trigger: "system: winner Registration becomes WITHDRAWN or REFUNDED"
        actor: system
        preconditions: ["award not overridden", "status != PRESENTED"]
        side_effects: ["winner_registration_id := null, winner_score := null, tie_break_log := ''", "increments Award.version by 1"]
      - from: "COMPUTED or FINALIZED"
        to: FINALIZED
        trigger: "POST /awards/{id}/override-winner"
        actor: Organizer
        preconditions:
          - "status in {COMPUTED, FINALIZED}"
          - "expected_award_version == Award.version (OCC, else ERR_STALE_VERSION)"
          - "caller X-User-ID != Event.finalized_by_user_id (segregation of duties, else ERR_SEGREGATION_OF_DUTIES)"
          - "winner_registration_id references a CHECKED_IN Registration in the award's class (for BEST_OF_SHOW: any judged class) else ERR_VALIDATION"
        side_effects: ["winner_registration_id := input, overridden := true, tie_break_log := 'MANUAL_OVERRIDE'", "increments Award.version by 1"]
      - from: FINALIZED
        to: PRESENTED
        trigger: "POST /awards/{id}/present"
        actor: Organizer
        preconditions: ["status == FINALIZED"]
        side_effects: ["increments Award.version by 1"]

  - entity: Ballot
    initial_state: VALID
    terminal_states: [VOID]
    transitions:
      - from: VALID
        to: VOID
        trigger: "system: voted Registration becomes WITHDRAWN or REFUNDED"
        actor: system
        preconditions: ["status == VALID"]
        side_effects: ["increments Ballot.version by 1"]

  - entity: SoundSlot
    initial_state: SCHEDULED
    terminal_states: [CANCELLED, COMPLETED]
    transitions:
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /sound-slots/{id}/cancel OR system permit suspension (slot_start > clock-now)"
        actor: Organizer | system
        preconditions: ["status == SCHEDULED"]
        side_effects: ["increments SoundSlot.version by 1"]
      - from: SCHEDULED
        to: COMPLETED
        trigger: "system: logical clock advances past slot_end (evaluated on POST /_clock/set_current_utc)"
        actor: system
        preconditions: ["status == SCHEDULED", "clock-now >= slot_end"]
        side_effects: ["increments SoundSlot.version by 1"]

# =============================================================================
# Concurrency Rules (OCC only; see SKILL 1.2.1)
# =============================================================================
concurrency_rules:
  - rule_id: finalize-stale-event
    parent_entity: Event
    write_endpoint: "POST /events/{id}/tabulations/finalize"
    occ_field: "expected_event_version"
    description: |
      Finalizing tabulation against an Event whose version has advanced since the
      caller last observed it is rejected. Finalization is naturally repeatable
      (re-finalization recomputes reverted awards), so a sequential second call
      would otherwise legitimately succeed; the OCC check makes the stale view fail.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: override-stale-award
    parent_entity: Award
    write_endpoint: "POST /awards/{id}/override-winner"
    occ_field: "expected_award_version"
    description: |
      Overriding an Award winner with an expected_award_version that no longer
      matches the Award's current version is rejected. Overrides legitimately
      supersede the stored winner, so a stale view must fail rather than silently
      re-supersede a winner set by a more recent override or recompute.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: entry_fee_calc
    trigger: "POST /registrations (at creation; fee_cents and pricing_tier frozen on the row)"
    algorithm: tiered_pricing
    formula: |
      tier := (clock_now < event.prereg_deadline) ? PREREG : DAY_OF
      if tier == DAY_OF:
          fee_cents := class.day_of_fee_cents            # flat; no member or multi-vehicle discount
      else:
          prior := count of the registrant's OTHER registrations for this event
                   with status in {PENDING_PAYMENT, CONFIRMED, CHECKED_IN}
                   created before this one (order by created_at ASC)
          multi := prior >= 1
          fee_cents := round_half_up(class.prereg_fee_cents
                                     * (registrant.club_member ? 1 - MEMBER_DISCOUNT_PCT : 1)
                                     * (multi ? 1 - MULTI_VEHICLE_DISCOUNT_PCT : 1), 0 decimals)
    input_set: "the new Registration's class, registrant, and the registrant's pre-existing non-terminal registrations for the same event"
    constants:
      MEMBER_DISCOUNT_PCT: 0.10
      MULTI_VEHICLE_DISCOUNT_PCT: 0.25
    precision: "0 decimal places (integer cents), round_half_up, single rounding at the final multiply"
    variants:
      - name: prereg
        when: "clock_now < prereg_deadline"
        difference: "applies member 10% discount and 25% multi-vehicle discount on the 2nd and later vehicle"
      - name: day_of
        when: "clock_now >= prereg_deadline"
        difference: "flat class.day_of_fee_cents; member and multi-vehicle discounts do NOT apply, so identical inputs yield a higher fee"

  - name: judged_score_tabulation
    trigger: "POST /events/{id}/tabulations/finalize (for classes with judging_mode in {JUDGED, BOTH})"
    algorithm: weighted_scoring
    formula: |
      Per ScoreSheet:
        sheet_total := round_half_up(EXTERIOR*1.0 + INTERIOR*0.75 + ENGINE*1.5
                                     + AUTHENTICITY*2.0 + CONDITION*1.25, 1 decimal)
      Per Registration (class score), input set = its ScoreSheets in status LOCKED:
        if event.tabulation_method == STRAIGHT_AVERAGE or sheet_count < 3:
            class_score := round_half_up(avg(sheet_total), 2 decimals)
        else (DROP_EXTREMES and sheet_count >= 3):
            drop exactly one highest and one lowest sheet_total,
            class_score := round_half_up(avg(remaining sheet_totals), 2 decimals)
      Rounding order is pinned: per-sheet rounding to 1 decimal FIRST, then average,
      then round to 2 decimals. Averaging unrounded weighted sums and rounding once
      at the end is a different (forbidden) order and yields different scores.
    input_set: "ScoreSheets with status LOCKED belonging to Registrations with status CHECKED_IN in the class"
    constants:
      W_EXTERIOR: 1.0
      W_INTERIOR: 0.75
      W_ENGINE: 1.5
      W_AUTHENTICITY: 2.0
      W_CONDITION: 1.25
    precision: "sheet_total: 1 decimal round_half_up; class_score: 2 decimals round_half_up"
    variants:
      - name: straight_average
        when: "event.tabulation_method == STRAIGHT_AVERAGE"
        difference: "averages all sheet_totals"
      - name: drop_extremes
        when: "event.tabulation_method == DROP_EXTREMES"
        difference: "with >= 3 sheets, discards one highest and one lowest sheet_total before averaging; identical sheets yield a different class_score than straight_average (e.g. 55.0/49.3/51.3 -> 51.30 vs 51.87)"

  - name: class_ranking_tiebreak
    trigger: "POST /events/{id}/tabulations/finalize, after judged_score_tabulation, to assign CLASS_PLACE places 1..award_depth"
    algorithm: aggregation
    formula: |
      Rank the class's CHECKED_IN Registrations that have >= 1 LOCKED sheet by:
        1. class_score DESC
        2. condition_avg DESC  (avg of CONDITION points across the registration's LOCKED sheets, 2 decimals round_half_up)
        3. sheet_count DESC    (number of LOCKED sheets)
        4. checked_in_at ASC   (earlier arrival wins)
        5. vehicle.year DESC   (newer vehicle wins)
      Places are assigned in that order; ranks beyond the scored-entry count leave
      remaining places with winner null and tie_break_log 'INSUFFICIENT_ENTRIES'.
    input_set: "CHECKED_IN Registrations of the class with >= 1 LOCKED ScoreSheet"
    constants: {}
    precision: "condition_avg at 2 decimals round_half_up"

  - name: peoples_choice_tally
    trigger: "POST /events/{id}/tabulations/finalize (for classes with judging_mode in {PEOPLES_CHOICE, BOTH})"
    algorithm: weighted_scoring
    formula: |
      Per Registration in the class:
        tally := sum(ballot.weight) over Ballots with status VALID
                 AND voted registration status == CHECKED_IN at finalize time
        member_ballots := count of those ballots with weight == MEMBER_BALLOT_WEIGHT
      Winner ranking:
        1. tally DESC
        2. member_ballots DESC
        3. checked_in_at ASC
        4. vehicle.year DESC
      Zero valid ballots class-wide => award winner null, tie_break_log 'NO_VALID_BALLOTS'.
    input_set: "Ballots with status VALID whose registration is CHECKED_IN, grouped per registration within one class"
    constants:
      MEMBER_BALLOT_WEIGHT: 2
    precision: "integer tally"

  - name: withdrawal_refund_calc
    trigger: "POST /registrations/{id}/withdraw (tier selection at withdrawn_at) and POST /registrations/{id}/refund-decision APPROVE (amount computation)"
    algorithm: threshold
    formula: |
      hours_before := (event.gates_open_at - withdrawn_at) in hours, fractional allowed
      pct := 1.00 if hours_before >= REFUND_FULL_HOURS
             else 0.50 if hours_before >= REFUND_HALF_HOURS
             else 0.00
      Boundary is inclusive: exactly 168.0 hours => 100%; exactly 48.0 => 50%.
      refund := round_half_up(net_paid_cents * pct, 0 decimals)
      where net_paid_cents := paid_cents - refunded_cents at decision time.
      pct == 0 => withdraw transitions straight to WITHDRAWN with no REFUND_REQUESTED.
    input_set: "the withdrawing Registration's paid_cents/refunded_cents and the Event gates_open_at"
    constants:
      REFUND_FULL_HOURS: 168
      REFUND_HALF_HOURS: 48
    precision: "0 decimals, round_half_up"

  - name: weather_refund_calc
    trigger: "POST /events/{id}/weather-decision with posture POSTPONED or CANCELLED"
    algorithm: waterfall_allocation
    formula: |
      POSTPONED variant (goodwill credit):
        per Registration in {CONFIRMED, CHECKED_IN}:
          refund := round_half_up(paid_cents * POSTPONE_CREDIT_PCT, 0)   # gross basis
      CANCELLED variant (full refund):
        per Registration in {CONFIRMED, CHECKED_IN}, processed in created_at ASC order:
          policy_refund_i := paid_cents                                  # gross basis, 100%
        Two-pass evaluation order (pinned, resolves the circular dependency between
        individual refunds and the treasury they draw from):
          pass 1: compute all policy_refund_i against the treasury snapshot
                  T0 := treasury_cents BEFORE any of this batch's refunds
          pass 2: if sum(policy_refund_i) > T0:
                    base_i := floor(policy_refund_i * T0 / sum(policy_refund_i))
                    remainder := T0 - sum(base_i)
                    distribute remainder one cent at a time to registrations in
                    created_at ASC order until exhausted
                  else: base_i := policy_refund_i
    input_set: "Registrations of the event in {CONFIRMED, CHECKED_IN} at decision time, ordered by created_at ASC"
    constants:
      POSTPONE_CREDIT_PCT: 0.25
    precision: "0 decimals; pass-2 scaling uses floor with created_at-ordered cent remainder"
    variants:
      - name: postponement_credit
        when: "posture POSTPONED"
        difference: "25% of gross paid as goodwill; registrations stay active"
      - name: cancellation_refund
        when: "posture CANCELLED"
        difference: "100% of gross paid with pro-rata cap when the treasury snapshot cannot cover the batch; registrations terminate REFUNDED"

  - name: booth_fee_calc
    trigger: "POST /booth-applications/{id}/approve"
    algorithm: tiered_pricing
    formula: |
      fee_cents := TIER_FEE[booth_tier] + (power_requested ? POWER_FEE_CENTS : 0)
    input_set: "the BoothApplication's tier and power flag"
    constants:
      TIER_FEE_SINGLE: 7500
      TIER_FEE_DOUBLE: 14000
      TIER_FEE_SPONSOR: 25000
      POWER_FEE_CENTS: 1500
    precision: "integer cents, no rounding"

  - name: noise_compliance_eval
    trigger: "POST /events/{id}/noise-readings"
    algorithm: threshold
    formula: |
      t := recorded_at HH:MM taken in UTC (single-timezone deployment: UTC stands in for
      venue local time); curfew window [curfew_start, curfew_end) is
      half-open and may wrap midnight (e.g. 22:00-07:00):
        is_curfew := t >= curfew_start OR t < curfew_end when wrapping,
                     else curfew_start <= t < curfew_end
      limit_db := is_curfew ? CURFEW_LIMIT_DB : DAY_LIMIT_DB
      is_exceedance := reading_db > limit_db        # strictly greater; exactly equal is compliant
      On is_exceedance: Event.noise_exceedance_count += 1; when the count reaches
      EXCEEDANCE_SUSPENSION_THRESHOLD (exactly at 3, not above), sound_permit_status
      ACTIVE -> SUSPENDED and future-scheduled SoundSlots are CANCELLED.
    input_set: "the new NoiseReading and the Event curfew configuration"
    constants:
      DAY_LIMIT_DB: 95.0
      CURFEW_LIMIT_DB: 85.0
      EXCEEDANCE_SUSPENSION_THRESHOLD: 3
    precision: "reading_db and limits at 1 decimal"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present; role recognized", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role is in the endpoint's roles list", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "Entity-backed ownership: Participant acts only on own registrations/vehicles/waivers/ballots; Judge only on own score sheets; Vendor only on own booth application", error_id: ERR_OWNERSHIP_VIOLATION, http_status: 403, applies_to: "own-resource endpoints" }
  - { priority: 4, category: existence, check: "Request body shape: required fields present, enums in range, numbers in range, criteria_scores exactly five known criteria with points 0..10, class code unique per event (ERR_DUPLICATE_CLASS_CODE)", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all" }
  - { priority: 5, category: existence, check: "Path ids then body FK targets exist, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 6, category: state, check: "Target entity state precondition for the transition (incl. OCC expected_*_version match -> ERR_STALE_VERSION 412); within this layer the target entity's own state is checked before cross-entity state (e.g. a LOCKED sheet yields ERR_INVALID_SCORE_SHEET_STATE even when the event also left JUDGING)", error_id: ERR_INVALID_EVENT_STATE, http_status: 409, applies_to: "state-transition endpoints" }
  - { priority: 7, category: business_safety, check: "Waiver signed before check-in (ERR_WAIVER_NOT_SIGNED); guardian signature for minors (ERR_GUARDIAN_SIGNATURE_REQUIRED); liability policy before publish (ERR_INSURANCE_POLICY_MISSING); sound permit ACTIVE before new sound slots (ERR_SOUND_PERMIT_SUSPENDED)", error_id: ERR_WAIVER_NOT_SIGNED, http_status: 422, applies_to: "check-in, publish, waiver create, sound-slot create" }
  - { priority: 8, category: business_temporal, check: "Window membership: judging window for sheet create/submit (ERR_JUDGING_WINDOW_CLOSED); ballot window [gates_open_at, ballot_close_at) (ERR_BALLOT_WINDOW_CLOSED); zone arrival window for check-in (ERR_OUTSIDE_ARRIVAL_WINDOW)", error_id: ERR_JUDGING_WINDOW_CLOSED, http_status: 422, applies_to: "score-sheet create/submit, ballot create, check-in" }
  - { priority: 9, category: business_constraint, check: "Capacity/eligibility/uniqueness/overlap: class capacity (ERR_CLASS_FULL), zone capacity (ERR_ZONE_FULL) and zone type (ERR_ZONE_TYPE_INELIGIBLE), vehicle year in class range (ERR_VEHICLE_CLASS_INELIGIBLE), one registration per vehicle per event (ERR_DUPLICATE_REGISTRATION), one ballot per voter per event (ERR_DUPLICATE_BALLOT), one sheet per judge per registration (ERR_DUPLICATE_SCORE_SHEET), judge class assignment (ERR_JUDGE_NOT_ASSIGNED) and conflict-of-interest (ERR_JUDGE_CONFLICT_OF_INTEREST), ballot target class mode (ERR_VOTE_INELIGIBLE_CLASS), sound-slot half-open overlap (ERR_SOUND_SLOT_OVERLAP), booth space conflict/contiguity/power (ERR_BOOTH_SPACE_CONFLICT, ERR_BOOTH_SPACES_NOT_CONTIGUOUS, ERR_POWER_NOT_AVAILABLE), override segregation of duties (ERR_SEGREGATION_OF_DUTIES)", error_id: ERR_CLASS_FULL, http_status: 409, applies_to: "domain write endpoints" }
  - { priority: 10, category: business_fiscal, check: "Payment amount equals fee (ERR_PAYMENT_AMOUNT_MISMATCH); approved refund does not exceed net paid (ERR_REFUND_EXCEEDS_PAID)", error_id: ERR_PAYMENT_AMOUNT_MISMATCH, http_status: 422, applies_to: "payment and refund-decision endpoints" }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  - { method: POST, path: "/events", description: "Create event in DRAFT", roles: [Organizer], code: 201, input: ["name", "event_date", "gates_open_at", "judging_start_at", "judging_end_at", "ballot_close_at", "prereg_deadline", "curfew_start", "curfew_end", "liability_policy_number?", "tabulation_method?"], output: "Event", side_effects: [initialize treasury_cents=0, noise_exceedance_count=0, weather_posture=NORMAL, sound_permit_status=ACTIVE] }
  - { method: GET, path: "/events", description: "List events", roles: [Organizer, RegistrationDesk, Participant, Judge, Vendor], code: 200, input: ["lifecycle_status?", "limit?", "offset?"], output: "Event[]", side_effects: [] }
  - { method: GET, path: "/events/{id}", description: "Get event", roles: [Organizer, RegistrationDesk, Participant, Judge, Vendor], code: 200, input: [], output: "Event", side_effects: [] }
  - { method: PATCH, path: "/events/{id}", description: "Update event config; DRAFT only", roles: [Organizer], code: 200, input: ["name?", "event_date?", "gates_open_at?", "judging_start_at?", "judging_end_at?", "ballot_close_at?", "prereg_deadline?", "curfew_start?", "curfew_end?", "liability_policy_number?", "tabulation_method?"], output: "Event", side_effects: [increments Event.version by 1] }
  - { method: POST, path: "/events/{id}/publish", description: "DRAFT -> PUBLISHED", roles: [Organizer], code: 200, input: [], output: "Event", side_effects: [increments Event.version by 1] }
  - { method: POST, path: "/events/{id}/open-registration", description: "PUBLISHED -> REGISTRATION_OPEN", roles: [Organizer], code: 200, input: [], output: "Event", side_effects: [increments Event.version by 1] }
  - { method: POST, path: "/events/{id}/lock-registration", description: "REGISTRATION_OPEN -> REGISTRATION_LOCKED", roles: [Organizer], code: 200, input: [], output: "Event", side_effects: [increments Event.version by 1] }
  - { method: POST, path: "/events/{id}/start-judging", description: "REGISTRATION_LOCKED -> JUDGING; flips non-arrived CONFIRMED to NO_SHOW; creates PENDING award rows; may auto-advance to TABULATING when nothing to judge", roles: [Organizer], code: 200, input: [], output: "Event", side_effects: [Registration CONFIRMED -> NO_SHOW, create Award PENDING rows, increments Event.version by 1] }
  - { method: POST, path: "/events/{id}/weather-decision", description: "Drive weather_posture transitions (WATCH/NORMAL/POSTPONED/CANCELLED); POSTPONED issues 25% goodwill refunds; CANCELLED runs the refund cascade; posture NORMAL also reinstates a SUSPENDED sound permit", roles: [Organizer], code: 200, input: ["posture", "reason?"], output: "Event", side_effects: [weather cascade per state machine, increments Event.version by 1] }
  - { method: POST, path: "/events/{id}/tabulations/finalize", description: "TABULATING|FINALIZED -> FINALIZED; computes award winners; OCC on expected_event_version; records finalized_by_user_id", roles: [Organizer], code: 200, input: ["expected_event_version"], output: "Event", side_effects: [run judged_score_tabulation, class_ranking_tiebreak, peoples_choice_tally; Award PENDING -> COMPUTED -> FINALIZED; increments Event.version by 1] }
  - { method: POST, path: "/events/{id}/close", description: "FINALIZED -> CLOSED (or any lifecycle when posture CANCELLED); CHECKED_IN registrations -> COMPLETED", roles: [Organizer], code: 200, input: [], output: "Event", side_effects: [Registration CHECKED_IN -> COMPLETED, increments Event.version by 1] }
  - { method: GET, path: "/events/{id}/summary", description: "Computed read of event aggregates", roles: [Organizer, RegistrationDesk], code: 200, input: [], output: { treasury_cents: integer, refunded_cents_total: integer, registration_count: integer, checked_in_count: integer, noise_exceedance_count: integer, sound_permit_status: string, lifecycle_status: string, weather_posture: string }, side_effects: [] }
  - { method: POST, path: "/events/{id}/classes", description: "Create show class; event must be DRAFT or PUBLISHED", roles: [Organizer], code: 201, input: ["code", "name", "min_year", "max_year", "prereg_fee_cents", "day_of_fee_cents", "capacity", "judging_mode", "award_depth"], output: "ShowClass", side_effects: [] }
  - { method: GET, path: "/events/{id}/classes", description: "List classes of an event", roles: [Organizer, RegistrationDesk, Participant, Judge, Vendor], code: 200, input: ["limit?", "offset?"], output: "ShowClass[]", side_effects: [] }
  - { method: POST, path: "/events/{id}/zones", description: "Create zone; event must be DRAFT or PUBLISHED", roles: [Organizer], code: 201, input: ["name", "zone_type", "capacity", "has_power?", "arrival_window_start?", "arrival_window_end?"], output: "Zone", side_effects: [] }
  - { method: GET, path: "/events/{id}/zones", description: "List zones of an event", roles: [Organizer, RegistrationDesk, Participant, Judge, Vendor], code: 200, input: ["limit?", "offset?"], output: "Zone[]", side_effects: [] }
  - { method: POST, path: "/events/{id}/judges", description: "Add judge with assigned classes; event not CLOSED", roles: [Organizer], code: 201, input: ["name", "email", "assigned_class_ids"], output: "Judge", side_effects: [] }
  - { method: GET, path: "/events/{id}/judges", description: "List judges of an event", roles: [Organizer, RegistrationDesk, Participant, Judge, Vendor], code: 200, input: ["limit?", "offset?"], output: "Judge[]", side_effects: [] }
  - { method: POST, path: "/events/{id}/sound-slots", description: "Schedule a stage/DJ slot; requires sound_permit ACTIVE and no half-open overlap with existing SCHEDULED slots", roles: [Organizer], code: 201, input: ["performer_name", "slot_start", "slot_end", "expected_db"], output: "SoundSlot", side_effects: [] }
  - { method: GET, path: "/events/{id}/sound-slots", description: "List sound slots of an event", roles: [Organizer, RegistrationDesk, Participant, Judge, Vendor], code: 200, input: ["status?", "limit?", "offset?"], output: "SoundSlot[]", side_effects: [] }
  - { method: POST, path: "/sound-slots/{id}/cancel", description: "SCHEDULED -> CANCELLED", roles: [Organizer], code: 200, input: [], output: "SoundSlot", side_effects: [increments SoundSlot.version by 1] }
  - { method: POST, path: "/events/{id}/noise-readings", description: "Record a dB reading; computes is_curfew/limit_db/is_exceedance; on exceedance increments count and may suspend the permit", roles: [Organizer, RegistrationDesk], code: 201, input: ["reading_db", "source", "recorded_at?"], output: "NoiseReading", side_effects: [noise_compliance_eval; at threshold 3 suspend permit and cancel future SCHEDULED SoundSlots] }
  - { method: GET, path: "/events/{id}/noise-readings", description: "List noise readings of an event", roles: [Organizer, RegistrationDesk], code: 200, input: ["is_exceedance?", "limit?", "offset?"], output: "NoiseReading[]", side_effects: [] }
  - { method: POST, path: "/registrants", description: "Create a participant profile", roles: [Participant, RegistrationDesk, Organizer], code: 201, input: ["full_name", "email", "club_member?", "is_minor?"], output: "Registrant", side_effects: [] }
  - { method: GET, path: "/registrants/{id}", description: "Get a registrant; Participant may read only own profile", roles: [Participant, RegistrationDesk, Organizer], code: 200, input: [], output: "Registrant", side_effects: [] }
  - { method: POST, path: "/registrants/{id}/vehicles", description: "Add a vehicle to a registrant; Participant only for self", roles: [Participant, RegistrationDesk, Organizer], code: 201, input: ["year", "make", "model"], output: "Vehicle", side_effects: [] }
  - { method: GET, path: "/registrants/{id}/vehicles", description: "List a registrant's vehicles", roles: [Participant, RegistrationDesk, Organizer], code: 200, input: ["limit?", "offset?"], output: "Vehicle[]", side_effects: [] }
  - { method: POST, path: "/waivers", description: "Sign liability waiver for (registrant, event); guardian_name required for minors; immutable once created; one waiver per (registrant_id, event_id)", roles: [Participant, RegistrationDesk], code: 201, input: ["event_id", "registrant_id", "signature_name", "guardian_name?"], output: "Waiver", side_effects: [] }
  - { method: GET, path: "/waivers", description: "List waivers with filters", roles: [Organizer, RegistrationDesk, Participant], code: 200, input: ["event_id?", "registrant_id?", "limit?", "offset?"], output: "Waiver[]", side_effects: [] }
  - { method: GET, path: "/waivers/{id}", description: "Get a waiver", roles: [Organizer, RegistrationDesk, Participant], code: 200, input: [], output: "Waiver", side_effects: [] }
  - { method: POST, path: "/registrations", description: "Create registration; pricing_tier derived from logical clock; Participant only for own registrant_id", roles: [Participant, RegistrationDesk], code: 201, input: ["event_id", "registrant_id", "vehicle_id", "class_id"], output: "Registration", side_effects: [entry_fee_calc; ShowClass.confirmed_count += 1] }
  - { method: GET, path: "/registrations", description: "List registrations with filters", roles: [Organizer, RegistrationDesk, Participant, Judge], code: 200, input: ["event_id?", "registrant_id?", "vehicle_id?", "class_id?", "assigned_zone_id?", "status?", "limit?", "offset?"], output: "Registration[]", side_effects: [] }
  - { method: GET, path: "/registrations/{id}", description: "Get a registration", roles: [Organizer, RegistrationDesk, Participant, Judge], code: 200, input: [], output: "Registration", side_effects: [] }
  - { method: POST, path: "/registrations/{id}/payments", description: "Record entry-fee payment; amount must equal fee_cents; PENDING_PAYMENT -> CONFIRMED", roles: [Participant, RegistrationDesk], code: 201, input: ["amount_cents", "method"], output: "Payment", side_effects: [Registration -> CONFIRMED; treasury_cents += amount; increments Event.version and Registration.version] }
  - { method: GET, path: "/registrations/{id}/payments", description: "List payments of a registration", roles: [Organizer, RegistrationDesk, Participant], code: 200, input: ["limit?", "offset?"], output: "Payment[]", side_effects: [] }
  - { method: POST, path: "/registrations/{id}/check-in", description: "Gate arrival: assigns lowest free spot in the chosen SHOW_FIELD/OVERFLOW zone; requires signed waiver and arrival window", roles: [RegistrationDesk], code: 200, input: ["zone_id"], output: "Registration", side_effects: [spot assignment; zone.assigned_count += 1; checked_in_at set; increments Registration.version] }
  - { method: POST, path: "/registrations/{id}/withdraw", description: "Withdraw a registration; refund tier measured from withdrawn_at to gates_open_at", roles: [Participant, RegistrationDesk], code: 200, input: ["reason?"], output: "Registration", side_effects: [status -> REFUND_REQUESTED or WITHDRAWN; ballots VOID; class count release; award revert when checked-in] }
  - { method: POST, path: "/registrations/{id}/refund-decision", description: "Organizer approves (creates REFUND payment; amount defaults to the withdrawal_refund_calc policy amount, optional explicit amount_cents for partial goodwill) or denies (back to CONFIRMED)", roles: [Organizer], code: 200, input: ["decision", "amount_cents?", "note?"], output: "Registration", side_effects: [on APPROVE: REFUND payment, treasury debit, Registration -> REFUNDED; on DENY: Registration -> CONFIRMED] }
  - { method: POST, path: "/score-sheets", description: "Judge creates a DRAFT score sheet for a CHECKED_IN registration in an assigned class during the judging window", roles: [Judge], code: 201, input: ["registration_id", "criteria_scores"], output: "ScoreSheet", side_effects: [sheet_total computed] }
  - { method: GET, path: "/score-sheets", description: "List score sheets with filters", roles: [Judge, Organizer], code: 200, input: ["judge_id?", "registration_id?", "status?", "limit?", "offset?"], output: "ScoreSheet[]", side_effects: [] }
  - { method: GET, path: "/score-sheets/{id}", description: "Get a score sheet", roles: [Judge, Organizer], code: 200, input: [], output: "ScoreSheet", side_effects: [] }
  - { method: POST, path: "/score-sheets/{id}/submit", description: "DRAFT -> SUBMITTED; may complete the class and bubble the event to TABULATING, locking all submitted sheets", roles: [Judge], code: 200, input: [], output: "ScoreSheet", side_effects: [Judge.submitted_sheet_count += 1; class completion recompute; Event JUDGING -> TABULATING; ScoreSheet SUBMITTED -> LOCKED cascade] }
  - { method: POST, path: "/score-sheets/{id}/reopen", description: "SUBMITTED -> DRAFT; only while event still JUDGING", roles: [Organizer], code: 200, input: ["reason?"], output: "ScoreSheet", side_effects: [Judge.submitted_sheet_count -= 1] }
  - { method: POST, path: "/ballots", description: "Cast a people's-choice ballot; one per voter per event; voter taken from X-User-ID", roles: [Participant], code: 201, input: ["event_id", "registration_id"], output: "Ballot", side_effects: [weight computed from voter club_member] }
  - { method: GET, path: "/ballots", description: "List ballots with filters", roles: [Organizer, RegistrationDesk], code: 200, input: ["event_id?", "registration_id?", "voter_registrant_id?", "status?", "limit?", "offset?"], output: "Ballot[]", side_effects: [] }
  - { method: GET, path: "/ballots/{id}", description: "Get a ballot", roles: [Organizer, RegistrationDesk], code: 200, input: [], output: "Ballot", side_effects: [] }
  - { method: GET, path: "/awards", description: "List awards with filters", roles: [Organizer, RegistrationDesk, Participant, Judge, Vendor], code: 200, input: ["event_id?", "class_id?", "winner_registration_id?", "status?", "limit?", "offset?"], output: "Award[]", side_effects: [] }
  - { method: GET, path: "/awards/{id}", description: "Get an award", roles: [Organizer, RegistrationDesk, Participant, Judge, Vendor], code: 200, input: [], output: "Award", side_effects: [] }
  - { method: POST, path: "/awards/{id}/override-winner", description: "Manually set winner on a COMPUTED/FINALIZED award; OCC on expected_award_version; caller must differ from finalized_by_user_id", roles: [Organizer], code: 200, input: ["winner_registration_id", "expected_award_version", "reason?"], output: "Award", side_effects: [overridden=true; tie_break_log=MANUAL_OVERRIDE; increments Award.version by 1] }
  - { method: POST, path: "/awards/{id}/present", description: "FINALIZED -> PRESENTED", roles: [Organizer], code: 200, input: [], output: "Award", side_effects: [increments Award.version by 1] }
  - { method: POST, path: "/booth-applications", description: "Create vendor/sponsor booth application (SUBMITTED)", roles: [Organizer], code: 201, input: ["event_id", "business_name", "contact_email", "booth_tier", "power_requested?"], output: "BoothApplication", side_effects: [] }
  - { method: GET, path: "/booth-applications", description: "List booth applications with filters; Vendor sees only own (id == X-User-ID)", roles: [Organizer, Vendor, RegistrationDesk], code: 200, input: ["event_id?", "assigned_zone_id?", "status?", "limit?", "offset?"], output: "BoothApplication[]", side_effects: [] }
  - { method: GET, path: "/booth-applications/{id}", description: "Get a booth application", roles: [Organizer, Vendor, RegistrationDesk], code: 200, input: [], output: "BoothApplication", side_effects: [] }
  - { method: POST, path: "/booth-applications/{id}/approve", description: "SUBMITTED -> APPROVED; computes fee_cents", roles: [Organizer], code: 200, input: [], output: "BoothApplication", side_effects: [booth_fee_calc] }
  - { method: POST, path: "/booth-applications/{id}/reject", description: "SUBMITTED -> REJECTED", roles: [Organizer], code: 200, input: [], output: "BoothApplication", side_effects: [] }
  - { method: POST, path: "/booth-applications/{id}/payments", description: "Record booth fee payment; amount must equal fee_cents; APPROVED -> PAID", roles: [Vendor, Organizer], code: 201, input: ["amount_cents", "method"], output: "Payment", side_effects: [BoothApplication -> PAID; treasury_cents += amount; increments Event.version] }
  - { method: GET, path: "/booth-applications/{id}/payments", description: "List payments of a booth application", roles: [Vendor, Organizer], code: 200, input: ["limit?", "offset?"], output: "Payment[]", side_effects: [] }
  - { method: POST, path: "/booth-applications/{id}/assign", description: "PAID -> ASSIGNED; validates zone type, power, space count/contiguity, and space conflicts", roles: [Organizer], code: 200, input: ["zone_id", "spaces"], output: "BoothApplication", side_effects: [zone.assigned_count += len(spaces)] }
  - { method: POST, path: "/booth-applications/{id}/cancel", description: "APPROVED/PAID/ASSIGNED -> CANCELLED; refunds paid booth fee and releases spaces", roles: [Organizer, Vendor], code: 200, input: ["reason?"], output: "BoothApplication", side_effects: [REFUND payment when paid_cents > 0; space release] }
  - { method: POST, path: "/_clock/set_current_utc", description: "Test-driving endpoint: set the logical clock. Startup default is exactly 2026-08-01T00:00:00Z and the clock never falls back to wall-clock time. Side effect: SoundSlots with slot_end <= new time become COMPLETED.", roles: [Organizer], code: 200, input: ["to_iso8601"], output: { current_utc: string }, side_effects: [SoundSlot SCHEDULED -> COMPLETED for elapsed slots] }

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unrecognized X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_OWNERSHIP_VIOLATION, http: 403, condition: "Entity-backed actor (Participant/Judge/Vendor) acts on a resource owned by someone else" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed request: missing required field, enum out of range, bad criteria list, min_year > max_year, invalid spaces shape" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or referenced body FK target does not exist (left-to-right)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC expected_*_version does not match the parent entity's current version" }
  - { id: ERR_INVALID_EVENT_STATE, http: 409, condition: "Event lifecycle_status or weather_posture does not allow the operation" }
  - { id: ERR_INVALID_REGISTRATION_STATE, http: 409, condition: "Registration status does not allow the operation" }
  - { id: ERR_INVALID_SCORE_SHEET_STATE, http: 409, condition: "ScoreSheet status does not allow the operation (e.g. submit on SUBMITTED/LOCKED)" }
  - { id: ERR_INVALID_BOOTH_STATE, http: 409, condition: "BoothApplication status does not allow the operation (e.g. assign before PAID)" }
  - { id: ERR_INVALID_AWARD_STATE, http: 409, condition: "Award status does not allow the operation (e.g. present on PENDING, override on PRESENTED)" }
  - { id: ERR_CLASS_FULL, http: 409, condition: "Class confirmed_count >= capacity; exactly-at-capacity is still allowed for the next create only up to capacity" }
  - { id: ERR_ZONE_FULL, http: 409, condition: "Zone assigned_count >= capacity at check-in" }
  - { id: ERR_ZONE_TYPE_INELIGIBLE, http: 422, condition: "Check-in into a VENDOR_ROW zone or booth assign into a SHOW_FIELD/OVERFLOW zone" }
  - { id: ERR_DUPLICATE_REGISTRATION, http: 409, condition: "Same vehicle already has a non-terminal registration for the event" }
  - { id: ERR_DUPLICATE_BALLOT, http: 409, condition: "Voter already cast a ballot for this event" }
  - { id: ERR_DUPLICATE_SCORE_SHEET, http: 409, condition: "Judge already has a score sheet for this registration" }
  - { id: ERR_DUPLICATE_CLASS_CODE, http: 409, condition: "Class code already exists within the event" }
  - { id: ERR_SOUND_SLOT_OVERLAP, http: 409, condition: "Requested slot [slot_start, slot_end) intersects an existing SCHEDULED slot; back-to-back adjacency is allowed" }
  - { id: ERR_BOOTH_SPACE_CONFLICT, http: 409, condition: "Requested booth spaces intersect spaces of another ASSIGNED application in the zone" }
  - { id: ERR_BOOTH_SPACES_NOT_CONTIGUOUS, http: 422, condition: "DOUBLE/SPONSOR tiers require 2/3 contiguous ascending space integers" }
  - { id: ERR_POWER_NOT_AVAILABLE, http: 422, condition: "power_requested but target zone has_power is false" }
  - { id: ERR_WAIVER_NOT_SIGNED, http: 422, condition: "No waiver exists for (registrant, event) at check-in" }
  - { id: ERR_GUARDIAN_SIGNATURE_REQUIRED, http: 422, condition: "Waiver for a minor registrant lacks guardian_name" }
  - { id: ERR_INSURANCE_POLICY_MISSING, http: 422, condition: "Publish attempted with empty liability_policy_number" }
  - { id: ERR_SOUND_PERMIT_SUSPENDED, http: 422, condition: "Sound permit SUSPENDED; new sound slots rejected" }
  - { id: ERR_JUDGING_WINDOW_CLOSED, http: 422, condition: "Score-sheet create/submit outside [judging_start_at, judging_end_at)" }
  - { id: ERR_BALLOT_WINDOW_CLOSED, http: 422, condition: "Ballot cast outside [gates_open_at, ballot_close_at) or while event not JUDGING" }
  - { id: ERR_OUTSIDE_ARRIVAL_WINDOW, http: 422, condition: "Check-in outside the zone's [arrival_window_start, arrival_window_end)" }
  - { id: ERR_VEHICLE_CLASS_INELIGIBLE, http: 422, condition: "Vehicle year outside [class.min_year, class.max_year]" }
  - { id: ERR_JUDGE_NOT_ASSIGNED, http: 422, condition: "Judge's assigned_class_ids does not contain the sheet's class" }
  - { id: ERR_JUDGE_CONFLICT_OF_INTEREST, http: 422, condition: "Judge email matches a Registrant with a non-terminal registration in the same class" }
  - { id: ERR_VOTE_INELIGIBLE_CLASS, http: 422, condition: "Ballot target registration's class judging_mode is JUDGED (not PEOPLES_CHOICE/BOTH)" }
  - { id: ERR_PAYMENT_AMOUNT_MISMATCH, http: 422, condition: "Payment amount_cents != the registration/booth fee_cents" }
  - { id: ERR_REFUND_EXCEEDS_PAID, http: 422, condition: "Approved refund amount (explicit amount_cents or policy amount) would exceed net paid (paid_cents - refunded_cents)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 422, condition: "override-winner caller equals the Event's finalized_by_user_id" }

# =============================================================================
# Table 7: RBAC Permission Matrix
# =============================================================================
roles:
  - name: Organizer
    description: "Club event staff with full administrative control"
    identity: opaque
    exclusive_operations:
      - "event lifecycle transitions (publish, open-registration, lock-registration, start-judging, close, weather-decision)"
      - "tabulations/finalize and awards override-winner / present (override requires caller != finalized_by_user_id)"
      - "classes, zones, judges, sound-slots management; booth approve/reject/assign; refund-decision; score-sheet reopen; logical clock"
    shared_operations: [read events/classes/zones/judges/awards/summary/noise-readings, record noise readings, record booth payments, cancel booth applications]
  - name: RegistrationDesk
    description: "Gate and desk staff handling day-of operations"
    identity: opaque
    exclusive_operations: [check-in, "record entry-fee payments for any registrant"]
    shared_operations: [create registrants/vehicles, create registrations, sign waivers on-site, withdraw registrations, read operational resources, record noise readings]
  - name: Participant
    description: "Car club member or public entrant"
    identity: "entity_backed:Registrant"
    exclusive_operations: [cast ballot, "sign own waiver electronically"]
    shared_operations: [create own profile/vehicles/registrations, pay own registration, withdraw own registration, read public event config and awards]
  - name: Judge
    description: "Rostered judge; scores only assigned classes and may not score a class they compete in"
    identity: "entity_backed:Judge"
    exclusive_operations: [create and submit own score sheets]
    shared_operations: [read registrations, classes, own sheets, awards]
  - name: Vendor
    description: "Booth applicant; X-User-ID equals the BoothApplication id"
    identity: "entity_backed:BoothApplication"
    exclusive_operations: [pay own booth fee, cancel own application]
    shared_operations: [read own application, read public event config]
