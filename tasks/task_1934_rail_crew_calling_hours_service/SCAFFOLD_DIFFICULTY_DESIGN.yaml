              as: CrewManager
            - call: "POST /api/jobs"
              payload: { job_symbol: "M-CHISTL-09", craft: "ENGINEER", origin_terminal: "CHI", report_time: "2026-08-01T00:00:00Z", crew_required: 1 }
              as: CrewManager
              captures: { job1_id: $.data.id, job1_v0: $.data.version }
            - call: "POST /api/jobs/${job1_id}/calls"
              payload: {}
              as: CrewCaller
              captures: { call1_id: $.data.id }
            - call: "POST /api/calls/${call1_id}/accept"
              payload: { expected_job_version: "${job1_v0}" }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { asg1_id: $.data.id }
            - call: "POST /api/assignments/${asg1_id}/on-duty"
              payload: {}
              as: Employee
              as_user_id: "${emp_id}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T07:00:00Z" }
              as: CrewManager
            - call: "POST /api/assignments/${asg1_id}/tie-up"
              payload: {}
              as: Employee
              as_user_id: "${emp_id}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T17:00:00Z" }
              as: CrewManager
            - call: "POST /api/employees/${emp_id}/mark-up"
              payload: {}
              as: Employee
              as_user_id: "${emp_id}"
            - call: "POST /api/jobs"
              payload: { job_symbol: "M-CHISTL-10", craft: "ENGINEER", origin_terminal: "CHI", report_time: "2026-08-12T20:00:00Z", crew_required: 1 }
              as: CrewManager
