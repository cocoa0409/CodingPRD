      - name: per_acre_payment_three_band_pinned_rounding
        grounds:
          - calculations.grower_payment_amount
          - entities.GrowerPayment.fields.gross_amount_cents
          - entities.GrowerPayment.fields.holdback_cents
          - entities.GrowerPayment.fields.net_amount_cents
          - endpoints[POST /enrollments/{enrollment_id}/accrue-payment]
        distinguishing_aspect: |
          gross_amount_cents is a three-band waterfall (500.00 acres at 1.000, the next 1500.00
          at 0.925, the remainder at 0.850) whose per-band lines must each be rounded to whole
          cents BEFORE summation, and the result is then reduced by a commitment-tenure holdback
          percentage. 2000.50 acres at 1234.50 cents/acre gives 617250 + 1712869 + 525 =
          2330644 per-band, but 2330643 if the raw products are summed and rounded once - a
          one-cent fingerprint that no other assertion in the suite exposes.
