              as: Attorney
              as_user_id: "${att_pv2r}"
            # Now PATCH to exceed limit (still allowed in READY? PATCH restricted to DRAFT/IN_REVIEW — so construct over-limit differently)
            # Simpler: directly create another brief with over-limit and skip approve; test is on efile gate, so put brief in READY via separate court with high limit, then update court. Skip; instead:
