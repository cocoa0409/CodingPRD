            - "the second decide returns 409 with error_id == ERR_INVALID_STATE"
            - "error_id != ERR_NO_NEW_EVIDENCE"
            - "AccountSanction.${san_denied}.status == ACTIVE"

      - name: restatement_of_a_decided_decision_audit_is_invalid_state
        claim_type: "Violation to Error"
        grounds:
          - errors[ERR_INVALID_STATE]
          - state_machines.ContentDecision.AUDITED_to_REVISED
          - state_machines.ContentDecision.AUDITED_to_SETTLED
        distinguishing_aspect: "Auditing the same decision twice is refused once the row has left RECORDED, so ERR_INVALID_STATE comes from the transition list rather than from the cross-power flag."
