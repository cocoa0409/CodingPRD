        distinguishing_aspect: "A 2024-02-29 hire is observed on 2028-02-28 (non-leap year 2028... 2028 IS a leap year; use 2026: hire 2024-02-29, scan 2026-02-28 in non-leap 2026 reaches the 2-year milestone); scanning on 2026-02-27 processes nothing."
