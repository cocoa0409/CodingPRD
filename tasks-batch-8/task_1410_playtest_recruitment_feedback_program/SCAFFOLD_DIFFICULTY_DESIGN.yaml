          tier multiplier branch (1.5 at >=3), base scales linearly, and a
          passed-survey bonus adds on top: 3 ATTENDED + 1 passed survey pins
          amount_provisional_cents at 23500.
        test_recipe:
          setup:
            - "Participant P enrolled in study S; three REMOTE sessions on 2026-08-10 (10:00-11:00, 12:00-13:00, 14:00-15:00) all ATTENDED by P; one passed survey submitted for the first session"
