  # ===========================================================================
  - section: calculations
    instances:

      - name: charge_estimate_legacy_charger_derate
        claim_type: correct_result
        grounds:
          - calculations.charge_time_estimate
        distinguishing_aspect: "Charger interoperability math: same-platform pairing caps the rate at min(charger, pack), and a charger one generation behind the pack runs at LEGACY_CHARGE_DERATE 0.5 — 60 minutes legacy vs 30 minutes same-generation for a 100 Wh / 200 W pack."
        test_recipe:
          setup: ["Logical clock 2026-09-01. Platform; gen-1 pack CERTIFIED (ratchet); gen-2 pack (100 Wh, max 200 W). Chargers: C-OLD gen 1 (400 W) and C-NEW gen 2 (400 W)."]
          setup_api_calls:
            - *k_clock
            - *k_platform
            - *k_pack_design
            - *k_submit_pack
            - *k_certify_pack
            - call: "POST /battery-ecosystem/battery-packs"
              payload: { platform_id: "${pf}", sku: "P-G2", pack_generation: 2, cell_supplier_code: "SAM", cell_format: "C21700", rated_capacity_wh: 100, max_charge_rate_w: 200, replacement_price_cents: 26000, warranty_days: 720, free_replacement_days: 90 }
              as: ProductEngineer
              as_user_id: "pe-ana"
              captures: { pk2: $.data.id }
            - call: "POST /battery-ecosystem/chargers"
              payload: { platform_id: "${pf}", model_code: "C-OLD", charger_generation: 1, max_charge_rate_w: 400 }
              as: ProductEngineer
              as_user_id: "pe-ana"
              captures: { ch_old: $.data.id }
            - call: "POST /battery-ecosystem/chargers"
              payload: { platform_id: "${pf}", model_code: "C-NEW", charger_generation: 2, max_charge_rate_w: 400 }
              as: ProductEngineer
              as_user_id: "pe-ana"
              captures: { ch_new: $.data.id }
          trigger:
            - call: "GET /battery-ecosystem/battery-packs/${pk2}"
              payload: { charger_id: "${ch_old}" }
              as: ProductEngineer
            - call: "GET /battery-ecosystem/battery-packs/${pk2}"
              payload: { charger_id: "${ch_new}" }
              as: ProductEngineer
          assert:
            - "legacy charger: charger_compatible == true and charge_estimate_minutes == 60 (min(400,200)=200 derated to 100 W; 100 Wh / 100 W * 60)"
            - "same-generation charger: charge_estimate_minutes == 30 (full 200 W)"

      - name: charge_estimate_cross_platform_rejected
        claim_type: violation_to_error
        grounds:
          - calculations.charge_time_estimate
          - errors.ERR_INCOMPATIBLE_PAIRING
        distinguishing_aspect: "Charger interoperability stops at the platform boundary: a charger from another platform is not a slower charge, it is ERR_INCOMPATIBLE_PAIRING (409)."
        test_recipe:
          setup: ["Logical clock 2026-09-01. Platforms MX18 and MX12; a pack on MX18; a charger on MX12."]
          setup_api_calls:
            - *k_clock
            - *k_platform
            - *k_pack_design
            - call: "POST /battery-ecosystem/battery-platforms"
              payload: { code: "MX12", interface_key: "INTERFACE_B", chemistry_family: "LFP", backward_commitment_years: 8, forward_commitment_generations: 2 }
              as: PlatformAdmin
              captures: { pf2: $.data.id }
            - call: "POST /battery-ecosystem/chargers"
              payload: { platform_id: "${pf2}", model_code: "C-12", charger_generation: 1, max_charge_rate_w: 200 }
              as: ProductEngineer
              as_user_id: "pe-ana"
              captures: { ch: $.data.id }
          trigger:
            - call: "GET /battery-ecosystem/battery-packs/${pk}"
              payload: { charger_id: "${ch}" }
              as: ProductEngineer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INCOMPATIBLE_PAIRING and the response status is 409"

      - name: warranty_age_at_exactly_warranty_days_is_prorated_zero
        claim_type: correct_result
        grounds:
          - calculations.warranty_age_and_credit
          - errors.ERR_WARRANTY_EXPIRED
        distinguishing_aspect: "The PRORATED band's upper boundary is inclusive: age_days == warranty_days is still PRORATED with remaining_full_months 0 and credit 0, while age_days == warranty_days + 1 is OUT_OF_WARRANTY and APPROVE fails with ERR_WARRANTY_EXPIRED."
        test_recipe:
          setup: ["Logical clock 2026-09-01. Pack: price 12000, warranty_days 360, free 30. Two battery assets manufactured 2025-09-06 (age 360 at adjudication) and 2025-09-05 (age 361)."]
          setup_api_calls:
            - *k_clock
            - *k_platform
            - call: "POST /battery-ecosystem/battery-packs"
              payload: { platform_id: "${pf}", sku: "P-WB", pack_generation: 1, cell_supplier_code: "SAM", cell_format: "C18650", rated_capacity_wh: 80, max_charge_rate_w: 150, replacement_price_cents: 12000, warranty_days: 360, free_replacement_days: 30 }
              as: ProductEngineer
              as_user_id: "pe-ana"
              captures: { pk: $.data.id }
            - *k_submit_pack
            - *k_certify_pack
            - *k_center_a
            - *k_account_std
            - call: "POST /battery-ecosystem/tracked-assets"
              payload: { account_id: "${ac}", subject_type: "BATTERY", battery_pack_id: "${pk}", serial_number: "SN-WB-1", manufactured_at: "2025-09-06T00:00:00Z" }
              as: AccountManager
              as_user_id: "${ac}"
              captures: { a1: $.data.id }
            - call: "POST /battery-ecosystem/tracked-assets"
              payload: { account_id: "${ac}", subject_type: "BATTERY", battery_pack_id: "${pk}", serial_number: "SN-WB-2", manufactured_at: "2025-09-05T00:00:00Z" }
              as: AccountManager
              as_user_id: "${ac}"
              captures: { a2: $.data.id }
            - call: "POST /battery-ecosystem/warranty-claims"
              payload: { tracked_asset_id: "${a1}", claim_type: "BATTERY_REPLACEMENT", fault_code: "F1", service_date: "2026-09-01" }
              as: AccountManager
              as_user_id: "${ac}"
              captures: { c1: $.data.id, c1_center: $.data.service_center_id }
            - call: "POST /battery-ecosystem/warranty-claims"
              payload: { tracked_asset_id: "${a2}", claim_type: "BATTERY_REPLACEMENT", fault_code: "F2", service_date: "2026-09-01" }
              as: AccountManager
              as_user_id: "${ac}"
              captures: { c2: $.data.id }
          trigger:
            - call: "POST /battery-ecosystem/warranty-claims/${c1}/adjudicate"
              payload: { decision: "APPROVED" }
              as: ServiceAgent
              as_user_id: "${c1_center}"
            - call: "POST /battery-ecosystem/warranty-claims/${c2}/adjudicate"
              payload: { decision: "APPROVED" }
              as: ServiceAgent
              as_user_id: "${c1_center}"
              captures: { err_exp: $.data.error_id }
          assert:
            - "claim at age 360: adjudication_status == APPROVED, coverage == PRORATED, credit_cents == 0 (remaining full months floor(0/30) == 0)"
            - "claim at age 361: APPROVE rejected with error_id ERR_WARRANTY_EXPIRED; the claim remains SUBMITTED"

      - name: runtime_estimate_precision
        claim_type: precision
        grounds: [calculations.runtime_estimate]
        excluded_because:
          difficulty_instance: combinatorial_formula / runtime_estimate_generation_gap_floor_and_launch_gate
          rationale: "The 1-decimal round_half_up precision and the capped derate are asserted there (12.0 / 11.4 / 10.8 minutes)."

  # ===========================================================================
  - section: validations
    instances:

      - name: missing_auth_header_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations.priority_1
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "Priority 1: a request without X-User-Role fails with 401 ERR_UNAUTHENTICATED before role, existence, or state checks — even though the payload is otherwise perfectly valid."
        test_recipe:
          setup: ["Logical clock 2026-09-01. One platform exists."]
          setup_api_calls:
            - *k_clock
            - *k_platform
          trigger:
            - call: "POST /battery-ecosystem/battery-packs"
              payload: { platform_id: "${pf}", sku: "P-AUTH", pack_generation: 1, cell_supplier_code: "SAM", cell_format: "C21700", rated_capacity_wh: 100, max_charge_rate_w: 200, replacement_price_cents: 20000, warranty_days: 720, free_replacement_days: 90 }
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHENTICATED and the response status is 401 (no X-User-Role header sent)"

      - name: validation_priority_ordering_existence_beats_temporal
        claim_type: priority_ordering
        grounds: [validations.priority_4, validations.priority_19]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / claim_create_state_error_beats_capacity_fiscal_error
          rationale: "Priority-ordering mechanics are exercised by the two rule-5 difficulty instances (state>fiscal, safety>constraint); this row would only re-probe the same mechanism."

      - name: claim_create_with_past_service_date_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_19
          - errors.ERR_SERVICE_DATE_PAST
        distinguishing_aspect: "service_date earlier than the logical clock's current date is a 422 ERR_SERVICE_DATE_PAST; the same-day date is accepted (past means strictly before today)."
        test_recipe:
          setup: ["Logical clock 2026-09-10. Platform, CERTIFIED pack, account with an ACTIVE battery asset, center with capacity."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
            - *k_platform
            - *k_pack_design
            - *k_submit_pack
            - *k_certify_pack
            - *k_center_a
            - *k_account_std
            - call: "POST /battery-ecosystem/tracked-assets"
              payload: { account_id: "${ac}", subject_type: "BATTERY", battery_pack_id: "${pk}", serial_number: "SN-DATE-1", manufactured_at: "2026-06-01T00:00:00Z" }
              as: AccountManager
              as_user_id: "${ac}"
              captures: { a1: $.data.id }
          trigger:
            - call: "POST /battery-ecosystem/warranty-claims"
              payload: { tracked_asset_id: "${a1}", claim_type: "BATTERY_REPLACEMENT", fault_code: "F1", service_date: "2026-09-09" }
              as: AccountManager
              as_user_id: "${ac}"
              captures: { err: $.data.error_id }
            - call: "POST /battery-ecosystem/warranty-claims"
              payload: { tracked_asset_id: "${a1}", claim_type: "BATTERY_REPLACEMENT", fault_code: "F1", service_date: "2026-09-10" }
              as: AccountManager
              as_user_id: "${ac}"
              captures: { c1: $.data.id }
          assert:
            - "service_date 2026-09-09 (yesterday) fails with error_id ERR_SERVICE_DATE_PAST"
            - "service_date 2026-09-10 (same day) is accepted: WarrantyClaim.${c1} exists"

      - name: asset_create_duplicate_serial_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_11
          - errors.ERR_DUPLICATE_SERIAL
        distinguishing_aspect: "serial_number uniqueness is global across accounts: the second registration of SN-DUP-1 fails even though a different account owns it."
        test_recipe:
          setup: ["Logical clock 2026-09-01. Platform, pack, two accounts; first account already registered SN-DUP-1."]
          setup_api_calls:
            - *k_clock
            - *k_platform
            - *k_pack_design
            - *k_account_std
            - call: "POST /battery-ecosystem/asset-accounts"
              payload: { org_name: "Second Co", tier: "STANDARD" }
              as: PlatformAdmin
              captures: { ac2: $.data.id }
            - call: "POST /battery-ecosystem/tracked-assets"
              payload: { account_id: "${ac}", subject_type: "BATTERY", battery_pack_id: "${pk}", serial_number: "SN-DUP-1", manufactured_at: "2026-08-01T00:00:00Z" }
              as: AccountManager
              as_user_id: "${ac}"
          trigger:
            - call: "POST /battery-ecosystem/tracked-assets"
              payload: { account_id: "${ac2}", subject_type: "BATTERY", battery_pack_id: "${pk}", serial_number: "SN-DUP-1", manufactured_at: "2026-08-02T00:00:00Z" }
              as: AccountManager
              as_user_id: "${ac2}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE_SERIAL and the response status is 409"

      - name: pack_create_future_generation_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_12
          - errors.ERR_PACK_GENERATION_VIOLATION
          - calculations.platform_current_generation
        distinguishing_aspect: "The generation ratchet: with current_generation 0 (nothing CERTIFIED yet), only generation 1 may be created; generation 2 jumps the ratchet and fails."
        test_recipe:
          setup: ["Logical clock 2026-09-01. Platform with no packs."]
          setup_api_calls:
            - *k_clock
            - *k_platform
          trigger:
            - call: "POST /battery-ecosystem/battery-packs"
              payload: { platform_id: "${pf}", sku: "P-SKIP", pack_generation: 2, cell_supplier_code: "SAM", cell_format: "C21700", rated_capacity_wh: 100, max_charge_rate_w: 200, replacement_price_cents: 20000, warranty_days: 720, free_replacement_days: 90 }
              as: ProductEngineer
              as_user_id: "pe-ana"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PACK_GENERATION_VIOLATION (2 > current_generation 0 + 1)"

      - name: tool_create_beyond_forward_commitment_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_12
          - errors.ERR_FORWARD_COMMITMENT_EXCEEDED
        distinguishing_aspect: "The forward compatibility commitment caps tool windows: max_pack_generation may reach current_generation + forward_commitment_generations (0 + 2) but not one more."
        test_recipe:
          setup: ["Logical clock 2026-09-01. Platform (forward_commitment_generations 2) with no CERTIFIED packs."]
          setup_api_calls:
            - *k_clock
            - *k_platform
          trigger:
            - call: "POST /battery-ecosystem/tool-models"
              payload: { platform_id: "${pf}", model_code: "T-FWD", trade: "HVAC", category: "DRILL", tier: "PROFESSIONAL", corded_conversion: false, avg_power_draw_w: 300, min_pack_generation: 1, max_pack_generation: 3, replacement_price_cents: 20000, warranty_days: 360, free_replacement_days: 60, torque_min_nm: 5, torque_max_nm: 120 }
              as: ProductEngineer
              as_user_id: "pe-ana"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORWARD_COMMITMENT_EXCEEDED (3 > 0 + 2)"
            - "the same create with max_pack_generation 2 would be accepted (boundary is inclusive at current + forward)"

      - name: counterfeit_confirm_threshold_is_inclusive
        claim_type: violation_to_error
        grounds:
          - state_machines.CounterfeitCase.REPORTED_to_CONFIRMED
          - errors.ERR_EVIDENCE_INSUFFICIENT
        distinguishing_aspect: "evidence_score 69 (one below the threshold) cannot CONFIRM; evidence_score exactly 70 (COUNTERFEIT_CONFIRM_THRESHOLD) can — the threshold is inclusive."
        test_recipe:
          setup: ["Logical clock 2026-09-01. Platform; CERTIFIED pack; two counterfeit cases reported by different users."]
          setup_api_calls:
            - *k_clock
            - *k_platform
            - *k_pack_design
            - *k_submit_pack
            - *k_certify_pack
            - call: "POST /battery-ecosystem/counterfeit-cases"
              payload: { battery_pack_id: "${pk}", reported_serial: "FAKE-69", detection_method: "PHYSICAL_INSPECTION" }
              as: AccountManager
              as_user_id: "rep-1"
              captures: { c69: $.data.id }
            - call: "POST /battery-ecosystem/counterfeit-cases"
              payload: { battery_pack_id: "${pk}", reported_serial: "FAKE-70", detection_method: "PHYSICAL_INSPECTION" }
              as: AccountManager
              as_user_id: "rep-2"
              captures: { c70: $.data.id }
          trigger:
            - call: "POST /battery-ecosystem/counterfeit-cases/${c69}/resolve"
              payload: { verdict: "CONFIRMED", evidence_score: 69 }
              as: ComplianceEngineer
              as_user_id: "ce-bob"
              captures: { err: $.data.error_id }
            - call: "POST /battery-ecosystem/counterfeit-cases/${c70}/resolve"
              payload: { verdict: "CONFIRMED", evidence_score: 70 }
              as: ComplianceEngineer
              as_user_id: "ce-bob"
          assert:
            - "score 69: error_id == ERR_EVIDENCE_INSUFFICIENT and the case remains REPORTED"
            - "score 70: CounterfeitCase.${c70}.status == CONFIRMED (inclusive threshold)"
            - "pack safety_hold is true after the 70-point confirmation"

      - name: claim_create_type_mismatch_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_10
          - errors.ERR_CLAIM_TYPE_MISMATCH
        distinguishing_aspect: "claim_type must agree with the asset's subject_type: TOOL_REPAIR against a BATTERY asset fails with ERR_CLAIM_TYPE_MISMATCH (409), before any capacity or date check."
        test_recipe:
          setup: ["Logical clock 2026-09-01. Platform, CERTIFIED pack, account with a BATTERY asset, center."]
          setup_api_calls:
            - *k_clock
            - *k_platform
            - *k_pack_design
            - *k_submit_pack
            - *k_certify_pack
            - *k_center_a
            - *k_account_std
            - call: "POST /battery-ecosystem/tracked-assets"
              payload: { account_id: "${ac}", subject_type: "BATTERY", battery_pack_id: "${pk}", serial_number: "SN-MM-1", manufactured_at: "2026-06-01T00:00:00Z" }
              as: AccountManager
              as_user_id: "${ac}"
              captures: { a1: $.data.id }
          trigger:
            - call: "POST /battery-ecosystem/warranty-claims"
              payload: { tracked_asset_id: "${a1}", claim_type: "TOOL_REPAIR", fault_code: "F1", service_date: "2026-09-10" }
              as: AccountManager
              as_user_id: "${ac}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_CLAIM_TYPE_MISMATCH (TOOL_REPAIR requires a TOOL asset)"

      - name: pack_decide_by_submitting_user_returns_forbidden
        claim_type: violation_to_error
        grounds:
          - validations.priority_7
          - errors.ERR_SEGREGATION_OF_DUTIES
        distinguishing_aspect: "Segregation of duties is user-scoped, not role-scoped: a ComplianceEngineer whose X-User-ID equals the submitter's is rejected with 403 ERR_SEGREGATION_OF_DUTIES even though the role is correct."
        test_recipe:
          setup: ["Logical clock 2026-09-01. Platform; pack SUBMITTED by user shared-user."]
          setup_api_calls:
            - *k_clock
            - *k_platform
            - *k_pack_design
            - call: "POST /battery-ecosystem/battery-packs/${pk}/submit-certification"
              payload: {}
              as: ProductEngineer
              as_user_id: "shared-user"
          trigger:
            - call: "POST /battery-ecosystem/battery-packs/${pk}/decide-certification"
              payload: { decision: "CERTIFIED" }
              as: ComplianceEngineer
              as_user_id: "shared-user"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SEGREGATION_OF_DUTIES and the response status is 403"
            - "BatteryPack.${pk}.certification_status remains SUBMITTED"

      - name: counterfeit_resolve_by_reporting_user_returns_forbidden
        claim_type: violation_to_error
        grounds:
          - validations.priority_7
          - errors.ERR_SEGREGATION_OF_DUTIES
        distinguishing_aspect: "The reporter of a counterfeit case may not resolve it: same X-User-ID across report and resolve fails with ERR_SEGREGATION_OF_DUTIES even across different roles."
        test_recipe:
          setup: ["Logical clock 2026-09-01. Platform; CERTIFIED pack; case reported by user dup-user."]
          setup_api_calls:
            - *k_clock
            - *k_platform
            - *k_pack_design
            - *k_submit_pack
            - *k_certify_pack
            - call: "POST /battery-ecosystem/counterfeit-cases"
              payload: { battery_pack_id: "${pk}", reported_serial: "FAKE-DUP", detection_method: "SERIAL_MISMATCH" }
              as: AccountManager
              as_user_id: "dup-user"
              captures: { cc: $.data.id }
          trigger:
            - call: "POST /battery-ecosystem/counterfeit-cases/${cc}/resolve"
              payload: { verdict: "CLEARED", evidence_score: 10 }
              as: ComplianceEngineer
              as_user_id: "dup-user"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SEGREGATION_OF_DUTIES (applies to both verdicts, not only CONFIRMED)"

  # ===========================================================================
  - section: endpoints
    instances:

      - name: single_object_envelope_shape
        claim_type: response_envelope
        grounds:
          - response_envelope
          - endpoints.GET_/battery-ecosystem/battery-packs/{id}
        distinguishing_aspect: "A single-object GET wraps data in the fixed envelope: response_type == object, meta.api_request_id and meta.api_request_timestamp present, and no pagination fields on object responses."
