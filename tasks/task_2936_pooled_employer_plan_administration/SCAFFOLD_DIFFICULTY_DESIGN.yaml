      - name: exit_reversal_restores_headcount_control_delta_to_zero
        grounds:
          - state_machines.ExitTransfer.SETTLED_to_REVERSED
          - calculations.plan_control_totals
          - entities.PlanDocument.fields.headcount_control_delta
          - entities.PlanDocument.fields.cumulative_enrolled_participant_count
        distinguishing_aspect: |
          Settlement moves headcount out of participant_count and into
          transferred_out_participant_count while the cumulative enrolment accumulator stands
          still, and simultaneously converts an employer balance into transferred_out_cents
          plus expense_recovered_cents. Reversal must run all of that backwards on two separate
          control equations at once — the headcount identity and the cents identity — including
          the census restatement that happened before the exit, and it must leave the monotone
          accumulator untouched in both directions. Zeroing the employer balance is destructive,
          so a naive implementation cannot recover the pre-settlement figure.
