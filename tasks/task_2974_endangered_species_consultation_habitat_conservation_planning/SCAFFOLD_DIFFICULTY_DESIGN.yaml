          - entities.Consultation.fields.consultation_type
          - endpoints["POST /project-actions/{id}/effect-determination"]
        distinguishing_aspect: >-
          Mode (a) — A SINGLE FORMULA COMBINING THREE INDEPENDENT INPUTS
          NON-LINEARLY. Two actions produce the identical rounded overlap_pct of
          5.00 from the identical 10.00 acres over the identical 200.00-acre
          footprint, yet one is NLAA and the other LAA, because the ladder also
          reads max_rank (THREATENED 2 vs ENDANGERED 3) and confirmed_present.
          No single input predicts the output: percentage alone is a tie, rank
          alone would misclassify a database-only ENDANGERED row, and
          confirmed_present alone is true in both. This instance involves no
          money, no tier table and no rounding order.
