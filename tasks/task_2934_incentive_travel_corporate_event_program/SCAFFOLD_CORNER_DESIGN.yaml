      - The 4 + 4 == 8 air request is rejected with ERR_DEVIATION_LIMIT_EXCEEDED and HTTP 422 because
        8 > DEVIATION_MAX_DAYS_TOTAL 7, and GET /registrations/${rb_id} still shows air_status "NOT_REQUESTED"
        with air_deviation_fee_cents 0.
      - The 4 + 3 == 7 request returns 200 with air_status "REQUESTED" and air_deviation_fee_cents 47500;
        the TICKET returns 200 with air_status "TICKETED" and air_change_count 0.
      - 'The CHANGE back to 4 + 4 is rejected with ERR_DEVIATION_LIMIT_EXCEEDED and HTTP 422: the precondition
        is re-evaluated against the REVISED values, so an already-ticketed itinerary cannot be pushed
        over the ceiling. air_status stays "TICKETED" and the stored deviation days stay 4 and 3.'
      - The confirm is rejected with ERR_STAY_WINDOW_VIOLATION and HTTP 422 — arrival_date 2026-11-07
        is before stay_start_at 2026-11-08 and departure_date 2026-11-14 is after stay_end_at 2026-11-13,
        neither of which was checkable at creation time.
      - 'After the failed confirm, GET /registrations/${rb_id} shows attendance_status "ACCEPTED", room_nights
        0 and GET /supplier-contracts/${c1_id} shows room_nights_confirmed 0: no partial ledger update
        leaked from the rejected transition.'
      - The zero-length activity is rejected with ERR_INVALID_REQUEST's sibling ERR_INVALID_DATE_RANGE
        and HTTP 400 because end_at is not strictly greater than start_at.
      - The same-day registration is rejected with ERR_INVALID_DATE_RANGE and HTTP 400 because departure_date
        must be strictly greater than arrival_date — a zero-night stay is not a stay.
      - The zero-length sales period is rejected with ERR_INVALID_DATE_RANGE and HTTP 400, proving the
        rule spans all three declared date pairs and not just the registration one.
  - name: deposit_schedule_aggregate_limit_is_checked_on_append_and_re_checked_at_execution
    claim_type: aggregate_validation
    grounds:
    - §1.4 priority 28 ERR_DEPOSIT_SCHEDULE_EXCEEDS_CONTRACT_VALUE
    - §1.5 POST /deposit-milestones, POST /supplier-contracts/{contract_id}/execute
    - §1.2 SupplierContract DRAFT -> PROPOSED -> COUNTERED -> PROPOSED -> EXECUTED
    distinguishing_aspect: |
      The aggregate pattern is "each item individually valid, the collective over the limit", and
      priority 28 is the only such rule in §1.4. What makes it worth a full recipe rather than a
      one-line probe is its second enforcement point: the limit is a function of the contract
      terms, and those terms keep changing during negotiation, so a schedule that was legal when
      appended can be made illegal by a later re-negotiated nightly rate. The instance therefore
      walks append-time rejection, the exact-equality acceptance, execution-time re-rejection
      after the contract value shrinks, and finally execution once the rate is negotiated back.
      It shares the negotiation cycle with the §1.8 non_linear_state_machine instance but asserts
      the fiscal aggregate rather than the round-count ceiling.
    test_recipe:
      setup: 'Empty database. A 5000000-cent program at SOURCING owns a DRAFT hotel contract for 12 rooms
        x 5 nights at 38500 per night, so its contract value is 2310000 cents. Two milestones already
        exist: sequence 1 for 577500 and sequence 2 for 577500, leaving exactly 1155000 of headroom. Users
        sm-01 (SourcingManager), ca-02 and ca-01 (ContractApprovers) are distinct.'
      setup_api_calls:
      - call: POST /programs
        payload:
          name: FY26 Presidents Circle
          fiscal_year: 2026
          qualification_metric: NET_REVENUE_CENTS
