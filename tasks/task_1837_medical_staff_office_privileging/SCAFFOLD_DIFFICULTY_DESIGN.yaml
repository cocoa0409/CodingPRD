              payload: { member_id: "${w1_id}", application_kind: "INITIAL", expected_member_version: "${w1_v}" }
              as: MedicalStaffCoordinator
              captures: { appW_id: $.data.id }
            - call: "POST /mso/verification-items"
              payload: { application_id: "${appW_id}", item_kind: "NPDB_QUERY", is_primary_source: true }
              as: MedicalStaffCoordinator
              captures: { viW_id: $.data.id }
            - call: "POST /mso/applications/${appW_id}/submit"
              payload: {}
              as: MedicalStaffCoordinator
            - call: "POST /mso/verification-items/${viW_id}/mark-received"
              payload: {}
              as: MedicalStaffCoordinator
            - call: "POST /mso/npdb-reports"
              payload: { member_id: "${w1_id}", report_kind: "QUERY_INITIAL" }
              as: MedicalStaffCoordinator
            - call: "POST /mso/verification-items/${viW_id}/verify"
              payload: {}
              as: MedicalStaffCoordinator
          trigger:
            - call: "POST /mso/verification-items/${viW_id}/waive"
              payload: { waiver_justification: "attempting to waive a verified primary source item" }
              as: CredentialsCommitteeChair
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_VERIFICATION_NOT_WAIVABLE (state, priority 5, wins over business_safety priority 7)"
            - "http status == 409"
            - "VerificationItem.${viW_id}.item_status == VERIFIED (unchanged)"

      - name: safety_vs_temporal_on_temp_activate
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_SPONSOR_NOT_QUALIFIED]
          - errors[ERR_TEMP_WINDOW_TOO_LONG]
        distinguishing_aspect: |
          Error-category pair business_safety vs business_temporal (different pair than
          instance 1's state-vs-safety): a single temp-privilege ACTIVATE violates both the
          safety gate (sponsor is APPLICANT, not ACTIVE/FULL -> ERR_SPONSOR_NOT_QUALIFIED,
          priority 7) and the temporal gate (window 183 days > 120-day TEMPORARY cap ->
          ERR_TEMP_WINDOW_TOO_LONG, priority 8). Safety priority wins, so the response must
          be ERR_SPONSOR_NOT_QUALIFIED (403), never the temporal error.
        test_recipe:
          setup:
            - "Recipient member T1 (APPLICANT); sponsor T2 also APPLICANT (never credentialed — fails ACTIVE/FULL)"
            - "Temp privilege row created with window 2026-08-02T00:00:00Z .. 2027-02-01T00:00:00Z (183 days, over the 120-day TEMPORARY cap); create-time referential checks pass because sponsor != recipient"
          setup_api_calls:
            - call: "POST /mso/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MedicalStaffCoordinator
            - call: "POST /mso/members"
              payload: { full_name: "Dr. T1", npdb_subject_id: "NPDB-T1", primary_specialty_code: "EMED" }
              as: MedicalStaffCoordinator
              captures: { t1_id: $.data.id }
            - call: "POST /mso/members"
              payload: { full_name: "Dr. T2", npdb_subject_id: "NPDB-T2", primary_specialty_code: "EMED" }
              as: MedicalStaffCoordinator
              captures: { t2_id: $.data.id }
            - call: "POST /mso/temporary-privileges"
              payload: { member_id: "${t1_id}", sponsor_member_id: "${t2_id}", temp_kind: "TEMPORARY", privilege_line: "EMED-GEN", window_start: "2026-08-02T00:00:00Z", window_end: "2027-02-01T00:00:00Z" }
              as: MedicalStaffCoordinator
              captures: { tpT_id: $.data.id }
          trigger:
            - call: "POST /mso/temporary-privileges/${tpT_id}/activate"
              payload: {}
              as: CredentialsCommitteeChair
              captures: { err_pri: $.data.error_id }
          assert:
            - "error_id == ERR_SPONSOR_NOT_QUALIFIED (business_safety priority 7 beats business_temporal priority 8)"
            - "http status == 403 (not 409 — proves the temporal check never fired)"
            - "TemporaryPrivilege.${tpT_id}.temp_status == PENDING_SPONSOR (unchanged)"

