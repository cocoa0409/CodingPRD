            - "${p_post} == 0 and ${tc_post} == 75000"
            - "${r_post} == 0 and ${ic_post} == 0  # the 375 disappeared by retroactive exclusion, not by collection - aggregate interest recomputes to 0 because the input set is now empty"
            - "${cl_st} == CLOSED and ${cl_reason} == ARREARS_SATISFIED and ${cl_at} == 2026-09-20T00:00:00Z  # the identical payload that failed three calls earlier now passes"

      - name: invalid_action_status_outranks_the_enforcement_stay
        claim_type: priority_ordering
        grounds:
          - "validations[priority 20]"
          - "validations[priority 37]"
          - "validations[priority 42]"
          - "validations[priority 10 ERR_INVALID_ACTION_STATUS]"
          - "errors[ERR_CONTEST_WINDOW_OPEN]"
          - "errors[ERR_ENFORCEMENT_STAYED]"
          - "errors[ERR_INVALID_ACTION_STATUS]"
          - "state_machines.CompromiseOffer.PROPOSED -> ACCEPTED"
        distinguishing_aspect: >
          Three requests are each eligible for two different errors and the lower
          priority number wins every time. A PROPERTY_LIEN creation is both stayed
          (37) and under its 500000 threshold (42) and reports
          ERR_ENFORCEMENT_STAYED; a notice on the cascade-RELEASED action is both a
          bad status (10) and stayed (37) and reports ERR_INVALID_ACTION_STATUS. The
          chain also shows the two interest variants side by side on one case: the
          certified figure is 151125 (statutory_per_charge) while the same instant's
          settlement snapshot is 1875 of interest on top of 150000
          (aggregate_month_end).
        test_recipe:
          setup:
            - "Empty database. Clock starts at 2026-08-01T00:00:00Z, then advances to 2026-11-01T00:00:00Z."
            - "CP 200000 and NCP 300000 VERIFIED_WAGE_RECORD; ENTERED order, monthly_obligation_cents 75000; DIRECT_APPLICATION so arrears are unassigned."
            - "Two CURRENT_SUPPORT charges of 75000, periods 2026-08-01..2026-09-01 and 2026-09-01..2026-10-01, due 2026-08-15 and 2026-09-15."
            - "At 2026-11-01 statutory_per_charge interest is 750 + 375 == 1125 and aggregate_month_end interest is 375 + 750 + 750 == 1875."
            - "ENFORCEMENT_THRESHOLDS: CREDIT_BUREAU_REPORT 100000, PROPERTY_LIEN 500000; the second gate needs certified >= 2 * 75000 == 150000."
            - "The NCP's compromise_risk_score is 44 (MEDIUM), so offer creation is not blocked: arrears_component 16, payment_history_component 100, everything else 0."
          setup_api_calls:
            - call: "POST /child-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /child-support/participants"
              payload: { role_type: "CUSTODIAL_PARTY", full_name: "Odalys Brennan", ssn_last4: "6219", residence_state_code: "MN", monthly_gross_income_cents: 200000, income_verification_source: "VERIFIED_WAGE_RECORD" }
              as: CaseWorker
              captures: { cpv8: "$.data.id" }
            - call: "POST /child-support/participants"
              payload: { role_type: "NONCUSTODIAL_PARTY", full_name: "Tomas Brennan", ssn_last4: "6220", residence_state_code: "MN", monthly_gross_income_cents: 300000, income_verification_source: "VERIFIED_WAGE_RECORD", supports_second_family: false, has_valid_drivers_license: true }
              as: CaseWorker
              captures: { ncpv8: "$.data.id" }
            - call: "POST /child-support/participants/${ncpv8}/locate-results"
              payload: { locate_outcome: "LOCATED" }
              as: CaseWorker
            - call: "POST /child-support/cases"
              payload: { case_type: "DIRECT_APPLICATION", custodial_party_id: "${cpv8}", noncustodial_party_id: "${ncpv8}", child_count: 2, tanf_assistance: false, good_cause_claim: false }
              as: CaseWorker
              captures: { casev8: "$.data.id" }
            - call: "POST /child-support/cases/${casev8}/paternity-actions"
              payload: { method: "PRESUMED_MARITAL" }
              as: CaseWorker
            - call: "POST /child-support/cases/${casev8}/orders"
              payload: { order_type: "CURRENT_SUPPORT", origin_state_code: "MN", effective_date: "2026-08-01" }
              as: CaseWorker
              captures: { orderv8: "$.data.id" }
            - call: "POST /child-support/orders/${orderv8}/guideline-calculation"
              payload: {}
              as: CaseWorker
            - call: "POST /child-support/orders/${orderv8}/entry"
              payload: {}
              as: SupervisingAttorney
              captures: { monv8: "$.data.monthly_obligation_cents" }
            - call: "POST /child-support/orders/${orderv8}/charges"
              payload: { charge_type: "CURRENT_SUPPORT", period_start_date: "2026-08-01", period_end_date: "2026-09-01", due_date: "2026-08-15", amount_cents: 75000 }
              as: FinanceOfficer
            - call: "POST /child-support/orders/${orderv8}/charges"
              payload: { charge_type: "CURRENT_SUPPORT", period_start_date: "2026-09-01", period_end_date: "2026-10-01", due_date: "2026-09-15", amount_cents: 75000 }
              as: FinanceOfficer
            - call: "POST /child-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /child-support/cases/${casev8}/enforcement-actions"
              payload: { action_type: "CREDIT_BUREAU_REPORT" }
              as: CaseWorker
              captures: { a8: "$.data.id", a8_st: "$.data.status", a8_cert: "$.data.arrears_certified_snapshot_cents", a8_thr: "$.data.eligibility_threshold_cents" }
            - call: "POST /child-support/enforcement-actions/${a8}/notice"
              payload: {}
              as: CaseWorker
              captures: { a8_st2: "$.data.status", a8_dl: "$.data.contest_deadline_at" }
            - call: "POST /child-support/enforcement-actions/${a8}/activation"
              payload: {}
              as: CaseWorker
              captures: { e_window: "$.data.error_id" }
            - call: "GET /child-support/cases/${casev8}"
              as: FinanceOfficer
              captures: { cv8: "$.data.version", p8: "$.data.arrears_principal_cents", r8: "$.data.interest_receivable_cents" }
            - call: "POST /child-support/cases/${casev8}/compromise-offers"
              payload: { installment_count: 3, expected_case_version: "${cv8}" }
              as: FinanceOfficer
              captures: { off8: "$.data.id", off8_p: "$.data.principal_due_snapshot_cents", off8_i: "$.data.interest_due_snapshot_cents", off8_pre: "$.data.pre_waiver_total_cents", off8_tier: "$.data.waiver_tier_pct", off8_wv: "$.data.interest_waiver_cents", off8_tot: "$.data.settlement_total_cents", off8_mo: "$.data.monthly_installment_cents", off8_fin: "$.data.final_installment_cents" }
            - call: "POST /child-support/compromise-offers/${off8}/acceptance"
              payload: {}
              as: NoncustodialParty
              as_user_id: "${ncpv8}"
              captures: { off8_st: "$.data.status" }
            - call: "GET /child-support/cases/${casev8}"
              as: FinanceOfficer
              captures: { post8: "$.data.enforcement_posture", wo8: "$.data.interest_written_off_cents", r8b: "$.data.interest_receivable_cents" }
            - call: "GET /child-support/enforcement-actions/${a8}"
              as: CaseWorker
              captures: { a8_st3: "$.data.status", a8_rel: "$.data.release_reason", a8_remedy: "$.data.remedy_applied" }
            - call: "POST /child-support/cases/${casev8}/enforcement-actions"
              payload: { action_type: "PROPERTY_LIEN" }
              as: CaseWorker
              captures: { e_stayed: "$.data.error_id" }
            - call: "POST /child-support/enforcement-actions/${a8}/notice"
              payload: {}
              as: CaseWorker
              captures: { e_actstatus: "$.data.error_id" }
          assert:
            - "${monv8} == 75000 and ${p8} == 150000"
            - "${a8_cert} == 151125 and ${a8_thr} == 100000 and ${a8_st} == PROPOSED  # certified uses statutory_per_charge: 150000 + round_half_up(75000 * 0.005 * 2) + round_half_up(75000 * 0.005 * 1) == 150000 + 750 + 375; both gates clear because 151125 >= 100000 and 151125 >= 150000"
            - "${a8_st2} == NOTICE_SENT and ${a8_dl} == 2026-12-01T00:00:00Z  # notice_sent_at 2026-11-01 plus CONTEST_WINDOW_DAYS 30"
            - "HTTP 409 and ${e_window} == ERR_CONTEST_WINDOW_OPEN  # the clock is not yet strictly past the deadline"
            - "${r8} == 1875  # the ledger reads aggregate_month_end (snapshots 2026-08-31, 09-30, 10-31 over balances 75000, 150000, 150000), which is 750 MORE than the certified figure's interest component"
            - "${off8_p} == 150000 and ${off8_i} == 1875 and ${off8_pre} == 151875  # the settlement snapshot deliberately uses the aggregate variant"
            - "${off8_tier} == 0.25 and ${off8_wv} == 469  # 151875 <= 500000 selects the first waiver band; round_half_up(1875 * 0.25) == round_half_up(468.75) == 469"
            - "${off8_tot} == 151406 and ${off8_mo} == 50468 and ${off8_fin} == 50470  # floor(151406 / 3) == 50468 and the remainder lands on the last installment: 50468 * 2 + 50470 == 151406"
            - "${off8_st} == ACCEPTED and ${post8} == STAYED and ${wo8} == 469 and ${r8b} == 1406  # 1875 - 469 written off - 0 collected"
            - "${a8_st3} == RELEASED and ${a8_rel} == COMPROMISE_ACCEPTED and ${a8_remedy} == false  # acceptance cascades into the NOTICE_SENT action"
            - "HTTP 409 and ${e_stayed} == ERR_ENFORCEMENT_STAYED  # PROPERTY_LIEN also violates priority 42 (151125 < 500000) but 37 < 42, so the stay is reported"
            - "HTTP 409 and ${e_actstatus} == ERR_INVALID_ACTION_STATUS  # this request violates both priority 10 and priority 37 and the status band wins"

