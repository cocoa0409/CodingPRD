  output: MigrationBatch
  side_effects:
  - set extracted_at
- method: POST
  path: /programs/migration-batches/{id}/cleanse
  description: EXTRACTED -> CLEANSED; resolutions maps legacy_primary_key -> { issue_code, resolution } for flagged records
  roles:
  - DataMigrationLead
