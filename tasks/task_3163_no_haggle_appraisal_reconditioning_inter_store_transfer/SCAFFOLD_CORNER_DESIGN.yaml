          - errors.ERR_VEHICLE_ALREADY_HELD
          - errors.ERR_FINANCING_NOT_ACCEPTED
          - errors.ERR_CROSS_ENTITY_STATE
        distinguishing_aspect: "Trigger coverage for the catalog is complete via §1.8 and earlier §1.9 instances: ERR_APPRAISAL_EXPIRED (cross_entity_state_dependency), ERR_VEHICLE_ALREADY_HELD and ERR_CROSS_ENTITY_STATE (resource_temporal_overlap), ERR_FINANCING_NOT_ACCEPTED (cross_entity_state_dependency #2), ERR_STALE_VERSION (occ corner), ERR_VALIDATION/ERR_NOT_FOUND/ERR_UNAUTHORIZED_ROLE/ERR_UNKNOWN_IDENTITY/ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (validation corners), ERR_SEGREGATION_OF_DUTIES, ERR_INVALID_STATE, ERR_LINE_ITEMS_UNRESOLVED, ERR_VEHICLE_NOT_LISTED, ERR_AUCTION_ROUNDS_EXHAUSTED, ERR_HAMMER_BELOW_RESERVE_INVALID, ERR_FINANCING_DECLINED, ERR_APPRAISAL_CUSTOMER_MISMATCH, ERR_WINDOW_CLOSED (financing expiry corner), ERR_RETURN_WINDOW_CLOSED — the last is asserted in the day-seven boundary instance's approve path and the remaining ones each have a named instance."
        excluded_because:
          difficulty_instance: boundary_precision_check / return_window_day_seven_exactly
          rationale: "ERR_RETURN_WINDOW_CLOSED is exercised by the §1.8 day-seven boundary instance's approve path; all other error codes have dedicated corner or difficulty instances named in this stub's distinguishing_aspect."

