  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: restatement_supersedes_and_recomputes_dscr
        claim_type: input_set_filtering
        grounds: [calculations.dscr_computation, state_machines.FinancialStatement.SPREAD_to_FINAL, entities.FinancialStatement.fields.restatement_of_id]
        distinguishing_aspect: "The DSCR input set is exactly the latest FINAL statement per period: finalizing restatement S2 (ebitda 15,000,000) supersedes S1 and the EXCEPTION_REVIEW recompute lifts dscr_standard from 1.2982 to 1.5579 and dscr_stress from 0.7010 to 1.2463, resolving the OPEN stress exception by change."
        test_recipe:
          setup:
            - "Application in EXCEPTION_REVIEW (Beacon shape: requested 30,000,000/60; S1 FINAL with ebitda 11,000,000, revenue 20,000,000, addbacks 3,000,000, distributions 800,000, capex 450,000, existing ds 2,500,000 => dscr_standard 1.2982, dscr_stress 0.7010, OPEN STRESS_DSCR_MINIMUM LOW)"
          setup_api_calls:
            - { call: "POST /credit/bank-officers", payload: { full_name: "Rita RM" }, as: BankAdmin, captures: { rm: $.data.id } }
            - { call: "POST /credit/bank-officers", payload: { full_name: "Andy Analyst" }, as: BankAdmin, captures: { an: $.data.id } }
            - { call: "POST /credit/bank-officers", payload: { full_name: "Polly Policy" }, as: BankAdmin, captures: { po: $.data.id } }
            - { call: "POST /credit/borrowers", payload: { legal_name: "Beacon Holdings LLC", naics_code: "332710", relationship_since: "2018-01-01" }, as: RelationshipManager, as_user_id: "${rm}", captures: { bor: $.data.id } }
            - { call: "POST /credit/loan-applications", payload: { borrower_id: "${bor}", product_type: CRE_TERM, requested_amount_cents: 30000000, term_months: 60 }, as: RelationshipManager, as_user_id: "${rm}", captures: { app: $.data.id } }
            - { call: "POST /credit/financial-statements", payload: { loan_application_id: "${app}", period_end_date: "2025-12-31", revenue_cents: 20000000, ebitda_cents: 11000000, addbacks_cents: 3000000, distributions_cents: 800000, maintenance_capex_cents: 450000, existing_annual_debt_service_cents: 2500000, total_assets_cents: 80000000, total_liabilities_cents: 40000000 }, as: CreditAnalyst, as_user_id: "${an}", captures: { s1: $.data.id } }
            - { call: "POST /credit/loan-applications/${app}/submit", payload: {}, as: RelationshipManager, as_user_id: "${rm}" }
            - { call: "POST /credit/financial-statements/${s1}/spread", payload: {}, as: CreditAnalyst, as_user_id: "${an}" }
            - { call: "POST /credit/financial-statements/${s1}/finalize", payload: {}, as: CreditAnalyst, as_user_id: "${an}" }
            - { call: "POST /credit/loan-applications/${app}/finalize-spreads", payload: {}, as: CreditAnalyst, as_user_id: "${an}", captures: { d_old: $.data.dscr_standard } }
            - { call: "POST /credit/financial-statements", payload: { loan_application_id: "${app}", period_end_date: "2025-12-31", revenue_cents: 20000000, ebitda_cents: 15000000, addbacks_cents: 0, distributions_cents: 0, maintenance_capex_cents: 0, existing_annual_debt_service_cents: 2500000, total_assets_cents: 80000000, total_liabilities_cents: 40000000, restatement_of_id: "${s1}" }, as: CreditAnalyst, as_user_id: "${an}", captures: { s2: $.data.id } }
            - { call: "POST /credit/financial-statements/${s2}/spread", payload: {}, as: CreditAnalyst, as_user_id: "${an}" }
          trigger:
            - { call: "POST /credit/financial-statements/${s2}/finalize", payload: {}, as: CreditAnalyst, as_user_id: "${an}", captures: { s2_st: $.data.status } }
            - { call: "GET /credit/financial-statements/${s1}", as: CreditAnalyst, as_user_id: "${an}", captures: { s1_st: $.data.status } }
            - { call: "GET /credit/loan-applications/${app}", as: CreditAnalyst, as_user_id: "${an}", captures: { d_new: $.data.dscr_standard, s_new: $.data.dscr_stress } }
            - { call: "GET /credit/loan-applications/${app}/policy-exceptions?rule_code=STRESS_DSCR_MINIMUM", as: CreditPolicyOfficer, as_user_id: "${po}", captures: { exc_st: "$.data[0].status" } }
            - { call: "POST /credit/loan-applications/${app}/clear-exceptions", payload: {}, as: CreditPolicyOfficer, as_user_id: "${po}", captures: { app_st: $.data.status } }
          assert:
            - "FinancialStatement.${s1}.status == SUPERSEDED and FinancialStatement.${s2}.status == FINAL (self-referential restatement cycle)"
            - "LoanApplication.${app}.dscr_standard == 1.5579 (recomputed from S2 ONLY: 15,000,000 / 9,628,432 — the SUPERSEDED S1 is excluded from the input set)"
            - "LoanApplication.${app}.dscr_stress == 1.2463 ((15,000,000 - 3,000,000) / 9,628,432 >= 1.0000)"
            - "the previously OPEN STRESS_DSCR_MINIMUM exception is now RESOLVED_BY_CHANGE (cured by the recompute; never resurrected)"
            - "clear-exceptions now succeeds: LoanApplication.${app}.status == APPRAISAL_REVIEW (zero OPEN exceptions)"

      - name: tenure_and_leverage_tier_boundaries_drive_rating
        claim_type: correct_result
        grounds: [calculations.risk_rating_model, entities.Borrower.fields.relationship_since, entities.LoanApplication.fields.risk_rating]
        distinguishing_aspect: "Two rating factors pinned at inclusive tier edges: leverage 0.7500 exactly earns 60 points (<= inclusive), and a relationship_since exactly 5.000 years before the default clock earns 75 tenure points while one day less earns 50 — moving the provisional score from 71.88 (band 3) to 68.75 (band 4)."
        test_recipe:
          setup:
            - "Two borrowers identical except relationship_since (2021-08-01 vs 2021-08-02; default clock 2026-08-01 => 5 years 0 days vs 4 years 364 days)"
            - "Both applications: requested 30,000,000/60 CRE_TERM; statement revenue 20,000,000, ebitda 13,479,805, addbacks/distributions/capex 0, existing ds 2,500,000, assets 80,000,000, liabilities 60,000,000 (leverage ratio exactly 0.7500) => dscr_standard 1.4000 (80 pts), dscr_stress 1.0884 (no exceptions)"
          setup_api_calls:
            - { call: "POST /credit/bank-officers", payload: { full_name: "Rita RM" }, as: BankAdmin, captures: { rm: $.data.id } }
            - { call: "POST /credit/bank-officers", payload: { full_name: "Andy Analyst" }, as: BankAdmin, captures: { an: $.data.id } }
            - { call: "POST /credit/borrowers", payload: { legal_name: "Tenure Exact LLC", naics_code: "332710", relationship_since: "2021-08-01" }, as: RelationshipManager, as_user_id: "${rm}", captures: { bor1: $.data.id } }
            - { call: "POST /credit/borrowers", payload: { legal_name: "Tenure Short LLC", naics_code: "332710", relationship_since: "2021-08-02" }, as: RelationshipManager, as_user_id: "${rm}", captures: { bor2: $.data.id } }
            - { call: "POST /credit/loan-applications", payload: { borrower_id: "${bor1}", product_type: CRE_TERM, requested_amount_cents: 30000000, term_months: 60 }, as: RelationshipManager, as_user_id: "${rm}", captures: { app1: $.data.id } }
            - { call: "POST /credit/financial-statements", payload: { loan_application_id: "${app1}", period_end_date: "2025-12-31", revenue_cents: 20000000, ebitda_cents: 13479805, addbacks_cents: 0, distributions_cents: 0, maintenance_capex_cents: 0, existing_annual_debt_service_cents: 2500000, total_assets_cents: 80000000, total_liabilities_cents: 60000000 }, as: CreditAnalyst, as_user_id: "${an}", captures: { stmt1: $.data.id } }
            - { call: "POST /credit/loan-applications/${app1}/submit", payload: {}, as: RelationshipManager, as_user_id: "${rm}" }
            - { call: "POST /credit/financial-statements/${stmt1}/spread", payload: {}, as: CreditAnalyst, as_user_id: "${an}" }
            - { call: "POST /credit/financial-statements/${stmt1}/finalize", payload: {}, as: CreditAnalyst, as_user_id: "${an}" }
            - { call: "POST /credit/loan-applications", payload: { borrower_id: "${bor2}", product_type: CRE_TERM, requested_amount_cents: 30000000, term_months: 60 }, as: RelationshipManager, as_user_id: "${rm}", captures: { app2: $.data.id } }
            - { call: "POST /credit/financial-statements", payload: { loan_application_id: "${app2}", period_end_date: "2025-12-31", revenue_cents: 20000000, ebitda_cents: 13479805, addbacks_cents: 0, distributions_cents: 0, maintenance_capex_cents: 0, existing_annual_debt_service_cents: 2500000, total_assets_cents: 80000000, total_liabilities_cents: 60000000 }, as: CreditAnalyst, as_user_id: "${an}", captures: { stmt2: $.data.id } }
            - { call: "POST /credit/loan-applications/${app2}/submit", payload: {}, as: RelationshipManager, as_user_id: "${rm}" }
            - { call: "POST /credit/financial-statements/${stmt2}/spread", payload: {}, as: CreditAnalyst, as_user_id: "${an}" }
            - { call: "POST /credit/financial-statements/${stmt2}/finalize", payload: {}, as: CreditAnalyst, as_user_id: "${an}" }
          trigger:
            - { call: "POST /credit/loan-applications/${app1}/finalize-spreads", payload: {}, as: CreditAnalyst, as_user_id: "${an}", captures: { r1: $.data.risk_rating, d1: $.data.dscr_standard } }
            - { call: "POST /credit/loan-applications/${app2}/finalize-spreads", payload: {}, as: CreditAnalyst, as_user_id: "${an}", captures: { r2: $.data.risk_rating, d2: $.data.dscr_standard } }
          assert:
            - "both dscr_standard == 1.4000 (13,479,805 / 9,628,432) -> 80 dscr points; both leverage ratios == 0.7500 -> 60 points (inclusive <= 0.75 tier)"
            - "LoanApplication.${app1}.risk_rating == 3: tenure 5.000 years -> 75 points; score (0.4*80 + 0.3*60 + 0.1*75)/0.80 == 71.88 >= 70"
            - "LoanApplication.${app2}.risk_rating == 4: tenure 4 years 364 days -> floor 4 -> 50 points; score (0.4*80 + 0.3*60 + 0.1*50)/0.80 == 68.75 < 70"
            - "both applications land in APPRAISAL_REVIEW (dscr 1.4000 >= 1.2500 and stress 1.0884 >= 1.0000: no exceptions)"

      - name: full_vs_provisional_basis_diverges_on_coverage
