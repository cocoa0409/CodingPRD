            - call: "POST /permit-applications"
              payload: { applicant_org: "Org H", venue_id: "${venue_id}", event_kind: "FESTIVAL", expected_attendance: 3000, occupy_start: "2026-06-10T10:00:00Z", occupy_end: "2026-06-10T14:00:00Z" }
              as: Applicant
              as_user_id: "${app_user_id}"
              captures: { app_id: $.data.id }
            - call: "POST /permit-applications/${app_id}/coi"
              payload: { carrier: "Cheap Ins", coverage_amount: 500000, expires_at: "2026-06-01T00:00:00Z" }
              as: Applicant
              as_user_id: "${app_user_id}"
              captures: { coi_id: $.data.id }
          trigger:
            - call: "POST /permit-applications/${app_id}/coi/${coi_id}/accept"
              payload: {}
              as: PermitOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_COI_EXPIRES_BEFORE_EVENT (priority 12 wins over 13)"
            - "HTTP status == 409"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: attendance_tier_boundary_1000_vs_1001
        grounds:
          - calculations.application_fee_calc
          - calculations.permit_class_derivation
          - entities.PermitApplication.fields.application_fee
        distinguishing_aspect: |
          At exactly 1000 attendees the marginal surcharge is 0 (fee 150.00, SMALL);
          at 1001 the surcharge picks up one head (fee 400.20, MEDIUM) — the numeric
          threshold boundary, reachable via POST /permit-applications, distinct from
          the empty/gap boundary below.
        test_recipe:
          setup:
            - "Two DRAFT apps with zero segments: one attendance 1000, one attendance 1001, on a large venue."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V8", venue_type: "STADIUM", max_capacity: 20000 }
              as: PermitOfficer
              captures: { venue_id: $.data.id }
            - call: "POST /applicants"
              payload: { org_name: "Org I", contact_email: "i@x.com" }
              as: PermitOfficer
              captures: { app_user_id: $.data.id }
            - call: "POST /permit-applications"
              payload: { applicant_org: "Org I", venue_id: "${venue_id}", event_kind: "RACE", expected_attendance: 1000, occupy_start: "2026-06-11T10:00:00Z", occupy_end: "2026-06-11T14:00:00Z" }
              as: Applicant
              as_user_id: "${app_user_id}"
              captures: { app_lo: $.data.id }
          trigger:
            - call: "POST /permit-applications"
              payload: { applicant_org: "Org I", venue_id: "${venue_id}", event_kind: "RACE", expected_attendance: 1001, occupy_start: "2026-06-12T10:00:00Z", occupy_end: "2026-06-12T14:00:00Z" }
              as: Applicant
              as_user_id: "${app_user_id}"
              captures: { app_hi: $.data.id }
          assert:
            - "PermitApplication.${app_lo}.permit_class == SMALL and application_fee == 150.00"
            - "PermitApplication.${app_hi}.permit_class == MEDIUM and application_fee == 400.20 (400 base + 1*0.20)"

      - name: empty_route_plan_blocks_submit
        grounds:
          - validations[priority=7]
          - errors[ERR_ROUTE_PLAN_EMPTY]
          - state_machines.PermitApplication.DRAFT_to_UNDER_REVIEW
        distinguishing_aspect: |
          Zero-cardinality boundary: an application with exactly zero RouteSegment
          children is rejected at submit-for-review with ERR_ROUTE_PLAN_EMPTY;
          reachable via POST /permit-applications/{id}/submit-for-review — an
          empty-collection edge distinct from the numeric attendance boundary.
        test_recipe:
          setup:
            - "A DRAFT app with no route segments, ready to submit."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V9", venue_type: "PARK", max_capacity: 6000 }
              as: PermitOfficer
              captures: { venue_id: $.data.id, venue_v0: $.data.version }
            - call: "POST /applicants"
              payload: { org_name: "Org J", contact_email: "j@x.com" }
              as: PermitOfficer
              captures: { app_user_id: $.data.id }
            - call: "POST /permit-applications"
              payload: { applicant_org: "Org J", venue_id: "${venue_id}", event_kind: "RALLY", expected_attendance: 500, occupy_start: "2026-06-13T10:00:00Z", occupy_end: "2026-06-13T14:00:00Z" }
              as: Applicant
              as_user_id: "${app_user_id}"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /permit-applications/${app_id}/submit-for-review"
              payload: { expected_venue_version: "${venue_v0}" }
              as: Applicant
              as_user_id: "${app_user_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ROUTE_PLAN_EMPTY"
            - "HTTP status == 409"
            - "PermitApplication.${app_id}.status == DRAFT (unchanged)"

