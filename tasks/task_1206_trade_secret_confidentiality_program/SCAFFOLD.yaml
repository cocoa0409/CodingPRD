# =============================================================================
# SCAFFOLD.yaml — task_1206_trade_secret_confidentiality_program
# Trade Secret & Confidentiality Program (corporate IP counsel)
# =============================================================================

scenario: |
  generate task hard than expert level! 1206. Trade Secret & Confidentiality Program (corporate IP counsel): trade secret inventory & reasonable-measures documentation, NDA lifecycle & obligation tracking by counterparty, employee onboarding/offboarding acknowledgment & exit interview, access restriction & need-to-know provisioning, third-party disclosure approval & marking protocol, departing-employee forensic review & demand letter, litigation readiness & evidence preservation, training & clean-desk audit

domain_name: trade-secret-confidentiality-program
api_prefix: /api

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency        # OCC on SecretAsset.version and on superseded NdaAgreement.version
    - cascading_side_effects        # audit→measure→posture→disclosure; publish→ack supersede→re-issue; bar→NDA terminate→obligation due-date anchoring
    - version_pinning_on_approval   # DisclosureRequest pins asset/NDA versions at SUBMITTED; APPROVED re-validates pins
    - derived_field_reconciliation  # protection_posture, risk_tier, training_current, active_grant_count recomputed from children

  entity_topology: flat             # 16 peer entities joined by FK references; no nested URL ownership
  state_machine_shape: cyclic       # headline shape: NDA breach loop, disclosure revision loop, grant suspend loop, measure lapse-reverify loop, interview no-show loop

  relationship_patterns:
    - one_to_many                   # Employee→Acknowledgment, NdaAgreement→NdaObligation, etc.
    - self_referential              # NdaAgreement.supersedes_id (amendment chain)
    - cross_aggregate               # DisclosureRequest references Employee + SecretAsset + NdaAgreement; PreservationNotice carries id arrays

  role_model: segregation_of_duties # measure implementer ≠ verifier; letter drafter ≠ approver; disclosure requester ≠ approver; ack signed by the employee themself
  consistency_model: immediate      # every mutation + its cascades visible in the same response / subsequent read

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (16 entities, flat topology)
# common_fields: true everywhere → id, created_at, updated_at, version implied.
# =============================================================================
entities:
  - name: SecretAsset
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Human-readable asset title" }
      - { name: description, type: string, source: input, description: "What the trade secret is (no secret content itself)" }
      - { name: classification, type: enum, source: input, description: "INTERNAL | CONFIDENTIAL | RESTRICTED | CROWN_JEWEL (ascending sensitivity)", constraints: "enum; ordering INTERNAL < CONFIDENTIAL < RESTRICTED < CROWN_JEWEL" }
      - { name: owner_department, type: string, source: input, description: "Department accountable for the asset" }
      - { name: exposure_estimate_cents, type: integer, source: input, description: "Estimated economic exposure if misappropriated, integer cents >= 0; input to demand-letter damages" }
      - { name: status, type: enum, source: system, description: "DRAFT | REGISTERED | SUSPENDED | RETIRED", default: DRAFT }
      - { name: score_operational, type: number, source: computed, description: "reasonable_measures_score operational variant: VERIFIED measures count 1.0x weight, IMPLEMENTED 0.6x, others 0" }
      - { name: score_documentary, type: number, source: computed, description: "reasonable_measures_score documentary variant: only VERIFIED measures count (1.0x)" }
      - { name: protection_posture, type: enum, source: computed, description: "DEFICIENT | ADEQUATE | STRONG derived from score_operational vs thresholds", constraints: "STRONG when score_operational >= 70; ADEQUATE when >= 40; else DEFICIENT" }
      - { name: active_grant_count, type: integer, source: computed, description: "Count of AccessGrant rows for this asset with status IN {APPROVED, PROVISIONED, SUSPENDED}" }

  - name: ReasonableMeasure
    parent: null
    common_fields: true
    fields:
      - { name: asset_id, type: string, source: input, description: "FK -> SecretAsset.id; the protected asset" }
      - { name: measure_type, type: enum, source: input, description: "POLICY | TRAINING | PHYSICAL | CONTRACTUAL | TECHNICAL" }
      - { name: title, type: string, source: input, description: "Measure title" }
      - { name: evidence_uri, type: string, source: input, description: "URI of documentary evidence; REQUIRED before PLANNED -> IMPLEMENTED" , constraints: "may be empty at creation; must be non-empty to implement" }
      - { name: status, type: enum, source: system, description: "PLANNED | IMPLEMENTED | VERIFIED | LAPSED | ABANDONED", default: PLANNED }
      - { name: implemented_by_user_id, type: string, source: system, description: "X-User-ID of the actor who ran the IMPLEMENT transition" }
      - { name: verified_by_user_id, type: string, source: system, description: "X-User-ID of the actor who ran the VERIFY transition (must differ from implemented_by_user_id)" }
      - { name: weight_points, type: integer, source: computed, description: "Constant by measure_type: POLICY 10, TRAINING 10, PHYSICAL 15, CONTRACTUAL 20, TECHNICAL 25" }
      - { name: points_effective, type: number, source: computed, description: "weight_points x status multiplier: VERIFIED 1.0, IMPLEMENTED 0.6, PLANNED/LAPSED/ABANDONED 0" }

  - name: Counterparty
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Counterparty legal name" }
      - { name: counterparty_type, type: enum, source: input, description: "VENDOR | PARTNER | CUSTOMER | CONSULTANT" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | BARRED", default: ACTIVE }
      - { name: exposure_index_trailing, type: number, source: computed, description: "counterparty_exposure_index trailing_12m variant (capped 100)" }
      - { name: exposure_index_lifetime, type: number, source: computed, description: "counterparty_exposure_index lifetime variant (capped 100)" }
      - { name: risk_tier, type: enum, source: computed, description: "LOW | MEDIUM | HIGH from exposure_index_trailing: <30 LOW, 30..59 MEDIUM, >=60 HIGH", constraints: "boundary: exactly 30 is MEDIUM; exactly 60 is HIGH" }

  - name: NdaAgreement
    parent: null
    common_fields: true
    fields:
      - { name: counterparty_id, type: string, source: input, description: "FK -> Counterparty.id; the signing organization" }
      - { name: supersedes_id, type: string, source: system, description: "FK -> NdaAgreement.id; set when created via the amendments endpoint, null otherwise" }
      - { name: template_version, type: string, source: input, description: "NDA template identifier" }
      - { name: governing_law, type: string, source: input, description: "Governing law string" }
      - { name: effective_date, type: datetime, source: input, description: "Start of the NDA window (closed interval start)" }
      - { name: expiry_date, type: datetime, source: input, description: "End of the NDA window (closed interval end; must be > effective_date)" }
      - { name: survival_months, type: integer, source: input, description: "Confidentiality survival after expiry/termination, months >= 0" }
      - { name: classification_ceiling, type: enum, source: input, description: "Highest SecretAsset.classification shareable under this NDA: INTERNAL | CONFIDENTIAL | RESTRICTED | CROWN_JEWEL" }
      - { name: status, type: enum, source: system, description: "DRAFT | SENT | EXECUTED | ACTIVE | BREACH_ALLEGED | SUPERSEDED | TERMINATED | EXPIRED", default: DRAFT }
      - { name: terminated_at, type: datetime, source: system, description: "Timestamp of TERMINATED transition, null otherwise" }
      - { name: confidentiality_end, type: datetime, source: computed, description: "expiry_date + survival_months (calendar months)" }
      - { name: obligations_total_count, type: integer, source: computed, description: "Count of NdaObligation rows for this NDA (all statuses)" }
      - { name: obligations_open_count, type: integer, source: computed, description: "Obligations with status IN {PENDING, OVERDUE, ESCALATED}" }
      - { name: obligations_fulfilled_count, type: integer, source: computed, description: "Obligations with status FULFILLED" }
      - { name: obligations_waived_count, type: integer, source: computed, description: "Obligations with status WAIVED" }

  - name: NdaObligation
    parent: null
    common_fields: true
    fields:
      - { name: nda_id, type: string, source: input, description: "FK -> NdaAgreement.id; the NDA this obligation belongs to" }
      - { name: obligation_type, type: enum, source: input, description: "NON_DISCLOSURE | NON_USE | RETURN_OR_DESTROY | NO_REVERSE_ENGINEERING | AUDIT_RIGHT" }
      - { name: due_at, type: datetime, source: input, description: "Optional deadline; RETURN_OR_DESTROY rows are created with due_at null and get anchored at NDA termination/expiry (anchor + 30 days)" , constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "PENDING | FULFILLED | WAIVED | OVERDUE | ESCALATED", default: PENDING }
      - { name: fulfilled_at, type: datetime, source: system, description: "Timestamp of FULFILLED transition, null otherwise" }
      - { name: escalated_at, type: datetime, source: system, description: "Timestamp of the most recent ESCALATED transition, null otherwise" }

  - name: Employee
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Employee full name" }
      - { name: email, type: string, source: input, description: "Employee email (unique)", constraints: "unique across employees" }
      - { name: department, type: string, source: input, description: "Department" }
      - { name: role_title, type: string, source: input, description: "Job title" }
      - { name: access_clearance, type: enum, source: input, description: "STANDARD | ELEVATED | PRIVILEGED; gates AccessGrant by asset classification" }
      - { name: hired_at, type: datetime, source: input, description: "Hire timestamp; BASIC_TS auto-assignment due_at = hired_at + 30 days" }
      - { name: status, type: enum, source: system, description: "PREBOARDING | ACTIVE | NOTICE | DEPARTED", default: PREBOARDING }
      - { name: departure_type, type: enum, source: system, description: "VOLUNTARY | INVOLUNTARY, set by the NOTICE transition payload; null before" , constraints: "nullable" }
      - { name: notice_given_at, type: datetime, source: system, description: "Timestamp of NOTICE transition, null otherwise" }
      - { name: departed_at, type: datetime, source: system, description: "Timestamp of DEPARTED transition, null otherwise" }
      - { name: training_current, type: boolean, source: computed, description: "true iff no TrainingAssignment IN {OVERDUE, ESCALATED} AND a COMPLETED BASIC_TS exists with completed_at within trailing 365 days" }

  - name: Acknowledgment
    parent: null
    common_fields: true
    fields:
      - { name: employee_id, type: string, source: input, description: "FK -> Employee.id; the signing employee" }
      - { name: policy_version, type: string, source: system, description: "Program current_policy_version at creation time" }
      - { name: due_at, type: datetime, source: computed, description: "created_at + 10 days (ACK_WINDOW_DAYS); PENDING rows past due_at become EXPIRED on sweep" }
      - { name: signed_at, type: datetime, source: system, description: "Sign timestamp, null while unsigned" }
      - { name: status, type: enum, source: system, description: "PENDING | SIGNED | SUPERSEDED | EXPIRED", default: PENDING }

  - name: ExitInterview
    parent: null
    common_fields: true
    fields:
      - { name: employee_id, type: string, source: input, description: "FK -> Employee.id; the departing employee" }
      - { name: scheduled_start, type: datetime, source: input, description: "Interview window start (half-open interval start)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Interview window end (must be > scheduled_start)" }
      - { name: conducted_at, type: datetime, source: system, description: "Timestamp of CONDUCTED transition, null otherwise" }
      - { name: return_certification, type: boolean, source: input, description: "Employee certified return of all materials (set via PATCH)", default: false }
      - { name: obligations_reiterated, type: boolean, source: input, description: "Counsel reiterated surviving NDA obligations (set via PATCH)", default: false }
      - { name: no_show_count, type: integer, source: system, description: "Increments on every CONDUCT/NO_SHOW failure (NO_SHOW transitions)", default: 0 }
      - { name: status, type: enum, source: system, description: "SCHEDULED | CONDUCTED | NO_SHOW | CERTIFIED | ESCALATED | CANCELLED", default: SCHEDULED }

  - name: AccessGrant
    parent: null
    common_fields: true
    fields:
      - { name: employee_id, type: string, source: input, description: "FK -> Employee.id; grant subject" }
      - { name: asset_id, type: string, source: input, description: "FK -> SecretAsset.id; grant target" }
      - { name: justification, type: string, source: input, description: "Need-to-know justification" }
      - { name: expires_at, type: datetime, source: input, description: "Grant expiry; must be > now and <= now + 365 days" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | DENIED | PROVISIONED | SUSPENDED | REVOKED | EXPIRED", default: REQUESTED }
      - { name: requester_user_id, type: string, source: system, description: "X-User-ID at creation (the employee's own id)" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of approver, null until APPROVED" }

  - name: DisclosureRequest
    parent: null
    common_fields: true
    fields:
      - { name: requester_employee_id, type: string, source: system, description: "FK -> Employee.id; set from X-User-ID at creation" }
      - { name: asset_id, type: string, source: input, description: "FK -> SecretAsset.id; asset to disclose" }
      - { name: nda_id, type: string, source: input, description: "FK -> NdaAgreement.id; governing NDA" }
      - { name: purpose, type: string, source: input, description: "Business purpose of the disclosure" }
      - { name: marking_protocol, type: enum, source: input, description: "STAMPED_CONFIDENTIAL | ORAL_WITH_FOLLOWUP | ENCRYPTED_DELIVERY" }
      - { name: planned_disclosure_date, type: datetime, source: input, description: "Planned disclosure date" }
      - { name: pinned_asset_version, type: integer, source: system, description: "SecretAsset.version captured at SUBMITTED; re-validated at APPROVED" }
      - { name: pinned_nda_version, type: integer, source: system, description: "NdaAgreement.version captured at SUBMITTED; re-validated at APPROVED" }
      - { name: risk_score_provisional, type: number, source: computed, description: "disclosure_risk_score provisional variant, computed at SUBMITTED" , constraints: "nullable until SUBMITTED" }
      - { name: risk_score_final, type: number, source: computed, description: "disclosure_risk_score final variant, computed at APPROVED", constraints: "nullable until APPROVED" }
      - { name: senior_endorsed, type: boolean, source: system, description: "true once SeniorCounsel runs the endorse endpoint", default: false }
      - { name: marking_evidence_uri, type: string, source: system, description: "Marked-copy URI, set at EXECUTED", constraints: "nullable until EXECUTED" }
      - { name: marking_sha256, type: string, source: system, description: "SHA-256 of the marked copy, set at EXECUTED", constraints: "nullable until EXECUTED" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | UNDER_REVIEW | APPROVED | REJECTED | RETURNED | WITHDRAWN | EXECUTED", default: DRAFT }

  - name: ForensicReview
    parent: null
    common_fields: true
    fields:
      - { name: employee_id, type: string, source: input, description: "FK -> Employee.id; reviewed (departing/departed) employee" }
      - { name: trigger_reason, type: enum, source: input, description: "VOLUNTARY_DEPARTURE | INVOLUNTARY_DEPARTURE | POLICY | LITIGATION" }
      - { name: status, type: enum, source: system, description: "OPENED | IMAGING | FINDINGS_DRAFTED | COUNSEL_REVIEW | CLOSED_NO_ACTION | ESCALATED", default: OPENED }
      - { name: exfil_indicator_count, type: integer, source: input, description: "Count of exfiltration indicators found (set via PATCH while IMAGING/FINDINGS_DRAFTED)", default: 0 }
      - { name: findings_notes, type: string, source: input, description: "Findings narrative (set via PATCH)", default: "" }
      - { name: reviewed_by_counsel_id, type: string, source: system, description: "X-User-ID of counsel who moved the review to COUNSEL_REVIEW", constraints: "nullable" }

  - name: DemandLetter
    parent: null
    common_fields: true
    fields:
      - { name: forensic_review_id, type: string, source: input, description: "FK -> ForensicReview.id; source review (must be ESCALATED)" }
      - { name: employee_id, type: string, source: system, description: "FK -> Employee.id; denormalized from the review at creation (letter target)" }
      - { name: claim_lines, type: array, source: input, description: "Array of {asset_id, claim_type}; claim_type IN {CEASE_AND_DESIST, RETURN_OF_PROPERTY, PRESERVATION}; at least one line" }
      - { name: response_deadline_days, type: integer, source: input, description: "Days from issue until the letter auto-escalates to IGNORED on sweep; must be > 0" }
      - { name: damages_estimate_cents, type: integer, source: computed, description: "demand_letter_damages: per-line round_half_up to cents then sum (pinned rounding order)" }
      - { name: drafted_by_user_id, type: string, source: system, description: "X-User-ID of drafting IPCounsel" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of approving SeniorCounsel (must differ from drafted_by_user_id)", constraints: "nullable" }
      - { name: issued_at, type: datetime, source: system, description: "Issue timestamp, null until ISSUED" }
      - { name: response_deadline, type: datetime, source: computed, description: "issued_at + response_deadline_days, null until ISSUED" }
      - { name: status, type: enum, source: system, description: "DRAFTED | COUNSEL_APPROVED | ISSUED | ACKNOWLEDGED | COMPLIED | IGNORED | LITIGATION | WITHDRAWN", default: DRAFTED }

  - name: PreservationNotice
    parent: null
    common_fields: true
    fields:
      - { name: legal_matter_ref, type: string, source: input, description: "Litigation matter reference" }
      - { name: asset_ids, type: array, source: input, description: "Array of SecretAsset ids in scope (may be empty)" }
      - { name: employee_ids, type: array, source: input, description: "Array of Employee ids in scope (may be empty)" }
      - { name: review_ids, type: array, source: input, description: "Array of ForensicReview ids in scope (may be empty)" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | ACTIVE | RELEASED", default: DRAFT }

  - name: EvidenceItem
    parent: null
    common_fields: true
    fields:
      - { name: review_id, type: string, source: input, description: "FK -> ForensicReview.id; owning review. Exactly one of review_id / disclosure_id must be set", constraints: "nullable" }
      - { name: disclosure_id, type: string, source: system, description: "FK -> DisclosureRequest.id; set when the item is the sealed marked copy produced by disclosure EXECUTED", constraints: "nullable" }
      - { name: source, type: enum, source: input, description: "FORENSIC_IMAGE | EMAIL_EXPORT | ACCESS_LOG | DEVICE_IMAGE | MARKED_COPY" }
      - { name: sha256, type: string, source: input, description: "Lowercase 64-hex content hash", constraints: "regex ^[0-9a-f]{64}$" }
      - { name: byte_size, type: integer, source: input, description: "Size in bytes >= 0" }
      - { name: sealed_at, type: datetime, source: system, description: "Seal timestamp, null until SEALED" }
      - { name: status, type: enum, source: system, description: "COLLECTED | SEALED | RELEASED", default: COLLECTED }

  - name: TrainingAssignment
    parent: null
    common_fields: true
    fields:
      - { name: employee_id, type: string, source: input, description: "FK -> Employee.id; assigned employee" }
      - { name: module, type: enum, source: input, description: "BASIC_TS | CLEAN_DESK | ADVANCED_IP" }
      - { name: due_at, type: datetime, source: input, description: "Due timestamp; auto-created BASIC_TS rows use hired_at + 30 days" }
      - { name: completed_at, type: datetime, source: system, description: "Completion timestamp, null until COMPLETED" }
      - { name: status, type: enum, source: system, description: "ASSIGNED | COMPLETED | OVERDUE | ESCALATED | EXCUSED", default: ASSIGNED }

  - name: CleanDeskAudit
    parent: null
    common_fields: true
    fields:
      - { name: department, type: string, source: input, description: "Department audited (temporal-buffer resource)" }
      - { name: window_start, type: datetime, source: input, description: "Audit window start" }
      - { name: window_end, type: datetime, source: input, description: "Audit window end (must be > window_start)" }
      - { name: findings_count, type: integer, source: system, description: "Total findings, set by the CONDUCT transition payload", constraints: "nullable until CONDUCTED" }
      - { name: critical_findings, type: integer, source: system, description: "Critical findings, set by the CONDUCT transition payload", constraints: "nullable until CONDUCTED" }
      - { name: resolved_critical_count, type: integer, source: system, description: "Critical findings remediated; set by the CLOSE transition payload", constraints: "nullable until close" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | CONDUCTED | REPORTED | REMEDIATING | CLOSED | CANCELLED", default: SCHEDULED }

# =============================================================================
# §1.2 State Machine Table
# Cascade processing order rule (applies everywhere): when one transition
# mutates many rows of the same entity type, process them in created_at ASC
# order (never by id).
# =============================================================================
state_machines:
  - entity: SecretAsset
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: REGISTERED
        trigger: "POST /api/assets/{id}/state to_status=REGISTERED"
        actor: IPCounsel
        preconditions:
          - "classification is set"
        side_effects:
          - "recompute reasonable_measures_score (both variants) and protection_posture"
      - from: REGISTERED
        to: SUSPENDED
        trigger: "POST /api/assets/{id}/state to_status=SUSPENDED"
        actor: IPCounsel
        preconditions: []
        side_effects: []
        note: "SUSPENDED blocks new AccessGrant creation and DisclosureRequest creation for this asset"
      - from: SUSPENDED
        to: REGISTERED
        trigger: "POST /api/assets/{id}/state to_status=REGISTERED"
        actor: IPCounsel
        preconditions: []
        side_effects: []
        note: "reactivation loop REGISTERED <-> SUSPENDED"
      - from: REGISTERED
        to: RETIRED
        trigger: "POST /api/assets/{id}/state to_status=RETIRED"
        actor: IPCounsel
        preconditions:
          - "active_grant_count == 0 (ERR_ACTIVE_GRANTS_REMAIN)"
          - "no DisclosureRequest for this asset IN {SUBMITTED, UNDER_REVIEW, APPROVED} (ERR_INVALID_STATE)"
          - "no PreservationNotice with status IN {DRAFT, ISSUED, ACTIVE} lists this asset id in asset_ids (ERR_PRESERVATION_HOLD_ACTIVE)"
        side_effects:
          - "all ReasonableMeasure rows for this asset IN {PLANNED, IMPLEMENTED, VERIFIED, LAPSED} -> ABANDONED (created_at ASC)"
          - "recompute reasonable_measures_score (both variants -> 0) and protection_posture"
      - from: SUSPENDED
        to: RETIRED
        trigger: "POST /api/assets/{id}/state to_status=RETIRED"
        actor: IPCounsel
        preconditions:
          - "same preconditions as REGISTERED -> RETIRED"
        side_effects:
          - "same cascade as REGISTERED -> RETIRED"

  - entity: ReasonableMeasure
    initial_state: PLANNED
    terminal_states: [ABANDONED]
    transitions:
      - from: PLANNED
        to: IMPLEMENTED
        trigger: "POST /api/measures/{id}/state to_status=IMPLEMENTED"
        actor: "SecurityOfficer | IPCounsel"
        preconditions:
          - "evidence_uri non-empty (ERR_MEASURE_EVIDENCE_REQUIRED)"
          - "parent SecretAsset status IN {DRAFT, REGISTERED} (ERR_INVALID_STATE)"
        side_effects:
          - "implemented_by_user_id = X-User-ID"
          - "recompute points_effective; recompute parent asset reasonable_measures_score + protection_posture"
      - from: IMPLEMENTED
        to: VERIFIED
        trigger: "POST /api/measures/{id}/state to_status=VERIFIED"
        actor: IPCounsel
        preconditions:
          - "X-User-ID != implemented_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "verified_by_user_id = X-User-ID"
          - "recompute points_effective; recompute parent asset reasonable_measures_score + protection_posture"
      - from: VERIFIED
        to: LAPSED
        trigger: "POST /api/measures/{id}/state to_status=LAPSED, or CleanDeskAudit CONDUCT cascade"
        actor: "IPCounsel | system"
        preconditions: []
        side_effects:
          - "recompute points_effective (0); recompute parent asset reasonable_measures_score + protection_posture"
          - "if parent asset protection_posture becomes DEFICIENT: every DisclosureRequest for that asset with status UNDER_REVIEW -> RETURNED (created_at ASC)"
      - from: IMPLEMENTED
        to: LAPSED
        trigger: "POST /api/measures/{id}/state to_status=LAPSED, or CleanDeskAudit CONDUCT cascade"
        actor: "IPCounsel | system"
        preconditions: []
        side_effects:
          - "same recompute cascade as VERIFIED -> LAPSED"
      - from: LAPSED
        to: IMPLEMENTED
        trigger: "POST /api/measures/{id}/state to_status=IMPLEMENTED"
        actor: "SecurityOfficer | IPCounsel"
        preconditions:
          - "evidence_uri non-empty (ERR_MEASURE_EVIDENCE_REQUIRED)"
          - "parent SecretAsset status IN {DRAFT, REGISTERED} (ERR_INVALID_STATE)"
        side_effects:
          - "implemented_by_user_id = X-User-ID (remediation loop LAPSED -> IMPLEMENTED -> VERIFIED)"
          - "recompute points_effective + parent scores/posture"
      - from: PLANNED
        to: ABANDONED
        trigger: "POST /api/measures/{id}/state to_status=ABANDONED"
        actor: IPCounsel
        preconditions: []
        side_effects: ["recompute parent scores/posture"]
      - from: LAPSED
        to: ABANDONED
        trigger: "POST /api/measures/{id}/state to_status=ABANDONED"
        actor: IPCounsel
        preconditions: []
        side_effects: ["recompute parent scores/posture"]

  - entity: Counterparty
    initial_state: ACTIVE
    terminal_states: [BARRED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/counterparties/{id}/state to_status=SUSPENDED"
        actor: IPCounsel
        preconditions: []
        side_effects: []
        note: "SUSPENDED blocks new NDAs and new DisclosureRequests referencing this counterparty"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/counterparties/{id}/state to_status=ACTIVE"
        actor: IPCounsel
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: BARRED
        trigger: "POST /api/counterparties/{id}/state to_status=BARRED"
        actor: IPCounsel
        preconditions: []
        side_effects:
          - "every NdaAgreement of this counterparty with status IN {DRAFT, SENT, EXECUTED, ACTIVE, BREACH_ALLEGED} -> TERMINATED with terminated_at = now (created_at ASC)"
          - "each such termination anchors its PENDING RETURN_OR_DESTROY obligations: due_at = terminated_at + 30 days (RETURN_WINDOW_DAYS)"
          - "every DisclosureRequest whose nda_id belongs to this counterparty with status IN {DRAFT, SUBMITTED, UNDER_REVIEW} -> REJECTED"
          - "recompute exposure indexes (both variants) and risk_tier"
      - from: SUSPENDED
        to: BARRED
        trigger: "POST /api/counterparties/{id}/state to_status=BARRED"
        actor: IPCounsel
        preconditions: []
        side_effects: ["same cascade as ACTIVE -> BARRED"]

  - entity: NdaAgreement
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, TERMINATED, EXPIRED]
    transitions:
      - from: DRAFT
        to: SENT
        trigger: "POST /api/ndas/{id}/state to_status=SENT"
        actor: IPCounsel
        preconditions: []
        side_effects: []
      - from: SENT
        to: EXECUTED
        trigger: "POST /api/ndas/{id}/state to_status=EXECUTED"
        actor: CounterpartyRep
        preconditions:
          - "X-User-ID == counterparty_id of this NDA (ERR_OWNERSHIP_REQUIRED)"
        side_effects: []
      - from: EXECUTED
        to: ACTIVE
        trigger: "POST /api/ndas/{id}/state to_status=ACTIVE"
        actor: IPCounsel
        preconditions: []
        side_effects:
          - "if supersedes_id is set: the superseded NdaAgreement -> SUPERSEDED"
      - from: ACTIVE
        to: BREACH_ALLEGED
        trigger: "POST /api/ndas/{id}/state to_status=BREACH_ALLEGED"
        actor: IPCounsel
        preconditions: []
        side_effects: []
      - from: BREACH_ALLEGED
        to: ACTIVE
        trigger: "POST /api/ndas/{id}/state to_status=ACTIVE (allegation unfounded)"
        actor: IPCounsel
        preconditions: []
        side_effects: []
        note: "cycle ACTIVE -> BREACH_ALLEGED -> ACTIVE; obligations and disclosures are untouched by the loop"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /api/ndas/{id}/state to_status=TERMINATED"
        actor: IPCounsel
        preconditions: []
        side_effects:
          - "terminated_at = now"
          - "PENDING RETURN_OR_DESTROY obligations: due_at = terminated_at + 30 days (RETURN_WINDOW_DAYS)"
          - "recompute counterparty exposure indexes + risk_tier"
      - from: BREACH_ALLEGED
        to: TERMINATED
        trigger: "POST /api/ndas/{id}/state to_status=TERMINATED (allegation founded)"
        actor: IPCounsel
        preconditions: []
        side_effects: ["same as ACTIVE -> TERMINATED"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /api/program/sweep (system: current clock > expiry_date)"
        actor: system
        preconditions:
          - "current clock strictly greater than expiry_date (at exactly expiry_date the NDA stays ACTIVE)"
        side_effects:
          - "PENDING RETURN_OR_DESTROY obligations: due_at = expiry_date + 30 days"
          - "recompute counterparty exposure indexes + risk_tier"

  - entity: NdaObligation
    initial_state: PENDING
    terminal_states: [FULFILLED, WAIVED]
    transitions:
      - from: PENDING
        to: FULFILLED
        trigger: "POST /api/obligations/{id}/state to_status=FULFILLED"
        actor: CounterpartyRep
        preconditions:
          - "X-User-ID == counterparty_id of the parent NDA (ERR_OWNERSHIP_REQUIRED)"
        side_effects: ["fulfilled_at = now; recompute parent NDA obligation counts; recompute counterparty exposure indexes + risk_tier"]
      - from: OVERDUE
        to: FULFILLED
        trigger: "POST /api/obligations/{id}/state to_status=FULFILLED"
        actor: CounterpartyRep
        preconditions:
          - "X-User-ID == counterparty_id of the parent NDA (ERR_OWNERSHIP_REQUIRED)"
        side_effects: ["fulfilled_at = now; recompute parent NDA obligation counts; recompute counterparty exposure indexes + risk_tier"]
      - from: ESCALATED
        to: FULFILLED
        trigger: "POST /api/obligations/{id}/state to_status=FULFILLED"
        actor: CounterpartyRep
        preconditions:
          - "X-User-ID == counterparty_id of the parent NDA (ERR_OWNERSHIP_REQUIRED)"
        side_effects: ["fulfilled_at = now; recompute parent NDA obligation counts; recompute counterparty exposure indexes + risk_tier"]
      - from: PENDING
        to: WAIVED
        trigger: "POST /api/obligations/{id}/state to_status=WAIVED"
        actor: IPCounsel
        preconditions: []
        side_effects: ["recompute parent NDA obligation counts"]
      - from: OVERDUE
        to: WAIVED
        trigger: "POST /api/obligations/{id}/state to_status=WAIVED"
        actor: IPCounsel
        preconditions: []
        side_effects: ["recompute parent NDA obligation counts"]
      - from: PENDING
        to: OVERDUE
        trigger: "POST /api/program/sweep (system: due_at non-null AND current clock > due_at)"
        actor: system
        preconditions:
          - "due_at strictly less than current clock (at exactly due_at the obligation stays PENDING)"
        side_effects: ["recompute counterparty exposure indexes + risk_tier"]
      - from: OVERDUE
        to: ESCALATED
        trigger: "POST /api/obligations/{id}/state to_status=ESCALATED"
        actor: IPCounsel
        preconditions: []
        side_effects: ["escalated_at = now; recompute counterparty exposure indexes + risk_tier"]

  - entity: Employee
    initial_state: PREBOARDING
    terminal_states: [DEPARTED]
    transitions:
      - from: PREBOARDING
        to: ACTIVE
        trigger: "POST /api/employees/{id}/state to_status=ACTIVE"
        actor: HRPartner
        preconditions:
          - "exists an Acknowledgment for this employee with status SIGNED and policy_version == program current_policy_version (ERR_ACK_REQUIRED)"
        side_effects: []
      - from: ACTIVE
        to: NOTICE
        trigger: "POST /api/employees/{id}/state to_status=NOTICE with departure_type"
        actor: HRPartner
        preconditions:
          - "departure_type payload IN {VOLUNTARY, INVOLUNTARY} (ERR_INVALID_REQUEST)"
        side_effects:
          - "notice_given_at = now; departure_type stored"
          - "if departure_type == INVOLUNTARY: auto-create ForensicReview(employee_id, trigger_reason=INVOLUNTARY_DEPARTURE) in OPENED"
        note: "NOTICE deliberately does NOT revoke access grants; revocation is an explicit SecurityOfficer/IPCounsel action so the DEPARTED zero-grant gate is reachable"
      - from: NOTICE
        to: DEPARTED
        trigger: "POST /api/employees/{id}/state to_status=DEPARTED"
        actor: HRPartner
        preconditions:
          - "exists an ExitInterview for this employee with status CERTIFIED (ERR_EXIT_INTERVIEW_NOT_CERTIFIED)"
          - "no AccessGrant for this employee with status IN {REQUESTED, APPROVED, PROVISIONED, SUSPENDED} (ERR_ACTIVE_GRANTS_REMAIN)"
          - "every ForensicReview for this employee has status IN {CLOSED_NO_ACTION, ESCALATED} (ERR_REVIEW_NOT_CONCLUDED)"
        side_effects:
          - "departed_at = now"

  - entity: Acknowledgment
    initial_state: PENDING
    terminal_states: [SUPERSEDED, EXPIRED]
    transitions:
      - from: PENDING
        to: SIGNED
        trigger: "POST /api/acknowledgments/{id}/sign"
        actor: Employee
        preconditions:
          - "X-User-ID == employee_id of this acknowledgment (ERR_OWNERSHIP_REQUIRED)"
          - "policy_version == program current_policy_version (ERR_POLICY_VERSION_STALE)"
        side_effects: ["signed_at = now"]
      - from: SIGNED
        to: SUPERSEDED
        trigger: "POST /api/program/policy/publish (cascade)"
        actor: system
        preconditions: []
        side_effects: []
        note: "PENDING acknowledgments are NOT superseded by publish; they stay PENDING at the old policy_version and fail signing with ERR_POLICY_VERSION_STALE (or expire via sweep)"
      - from: PENDING
        to: EXPIRED
        trigger: "POST /api/program/sweep (system: current clock > due_at)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ExitInterview
    initial_state: SCHEDULED
    terminal_states: [CERTIFIED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CONDUCTED
        trigger: "POST /api/exit-interviews/{id}/state to_status=CONDUCTED"
        actor: HRPartner
        preconditions: []
        side_effects: ["conducted_at = now"]
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /api/exit-interviews/{id}/state to_status=NO_SHOW"
        actor: HRPartner
        preconditions: []
        side_effects: ["no_show_count += 1"]
      - from: NO_SHOW
        to: SCHEDULED
        trigger: "POST /api/exit-interviews/{id}/state to_status=SCHEDULED with new window"
        actor: HRPartner
        preconditions:
          - "new window does not overlap another SCHEDULED/CONDUCTED interview for this employee (ERR_INTERVIEW_OVERLAP)"
        side_effects: []
        note: "reschedule loop SCHEDULED -> NO_SHOW -> SCHEDULED"
      - from: NO_SHOW
        to: ESCALATED
        trigger: "POST /api/exit-interviews/{id}/state to_status=ESCALATED"
        actor: HRPartner
        preconditions:
          - "no_show_count >= 2 (ERR_INVALID_STATE)"
        side_effects: []
      - from: CONDUCTED
        to: CERTIFIED
        trigger: "POST /api/exit-interviews/{id}/state to_status=CERTIFIED"
        actor: HRPartner
        preconditions:
          - "return_certification == true AND obligations_reiterated == true (ERR_INVALID_REQUEST)"
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/exit-interviews/{id}/state to_status=CANCELLED"
        actor: HRPartner
        preconditions: []
        side_effects: []
      - from: NO_SHOW
        to: CANCELLED
        trigger: "POST /api/exit-interviews/{id}/state to_status=CANCELLED"
        actor: HRPartner
        preconditions: []
        side_effects: []

  - entity: AccessGrant
    initial_state: REQUESTED
    terminal_states: [DENIED, REVOKED, EXPIRED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /api/grants/{id}/state to_status=APPROVED"
        actor: "SecurityOfficer | IPCounsel"
        preconditions:
          - "if parent SecretAsset classification == CROWN_JEWEL, actor role must be IPCounsel (ERR_UNAUTHORIZED_ROLE)"
          - "parent SecretAsset status == REGISTERED (ERR_INVALID_STATE)"
          - "parent Employee status == ACTIVE (ERR_INVALID_STATE)"
          - "parent Employee training_current == true (ERR_TRAINING_NOT_CURRENT)"
          - "X-User-ID != requester_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "approved_by_user_id = X-User-ID"
          - "recompute SecretAsset.active_grant_count (+1)"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /api/grants/{id}/state to_status=DENIED"
        actor: "SecurityOfficer | IPCounsel"
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: PROVISIONED
        trigger: "POST /api/grants/{id}/state to_status=PROVISIONED"
        actor: SecurityOfficer
        preconditions:
          - "current clock <= expires_at (ERR_INVALID_STATE)"
        side_effects: []
      - from: APPROVED
        to: REVOKED
        trigger: "POST /api/grants/{id}/state to_status=REVOKED"
        actor: "SecurityOfficer | IPCounsel"
        preconditions: []
        side_effects: ["recompute SecretAsset.active_grant_count (-1)"]
      - from: PROVISIONED
        to: SUSPENDED
        trigger: "POST /api/grants/{id}/state to_status=SUSPENDED"
        actor: SecurityOfficer
        preconditions: []
        side_effects: []
        note: "SUSPENDED still counts toward active_grant_count (compensating invariant)"
      - from: SUSPENDED
        to: PROVISIONED
        trigger: "POST /api/grants/{id}/state to_status=PROVISIONED"
        actor: SecurityOfficer
        preconditions:
          - "current clock <= expires_at (ERR_INVALID_STATE)"
        side_effects: []
      - from: PROVISIONED
        to: REVOKED
        trigger: "POST /api/grants/{id}/state to_status=REVOKED"
        actor: "SecurityOfficer | IPCounsel"
        preconditions: []
        side_effects: ["recompute SecretAsset.active_grant_count (-1)"]
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /api/grants/{id}/state to_status=REVOKED"
        actor: "SecurityOfficer | IPCounsel"
        preconditions: []
        side_effects: ["recompute SecretAsset.active_grant_count (-1)"]
      - from: APPROVED
        to: EXPIRED
        trigger: "POST /api/program/sweep (system: current clock > expires_at)"
        actor: system
        preconditions: []
        side_effects: ["recompute SecretAsset.active_grant_count (-1)"]
      - from: PROVISIONED
        to: EXPIRED
        trigger: "POST /api/program/sweep (system: current clock > expires_at)"
        actor: system
        preconditions: []
        side_effects: ["recompute SecretAsset.active_grant_count (-1)"]

  - entity: DisclosureRequest
    initial_state: DRAFT
    terminal_states: [REJECTED, WITHDRAWN, EXECUTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/disclosures/{id}/state to_status=SUBMITTED"
        actor: Employee
        preconditions:
          - "X-User-ID == requester_employee_id (ERR_OWNERSHIP_REQUIRED)"
          - "requester Employee status IN {PREBOARDING, ACTIVE, NOTICE} (ERR_INVALID_STATE)"
          - "parent SecretAsset status == REGISTERED (ERR_INVALID_STATE)"
        side_effects:
          - "pinned_asset_version = SecretAsset.version; pinned_nda_version = NdaAgreement.version"
          - "risk_score_provisional = disclosure_risk_score provisional variant"
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /api/disclosures/{id}/state to_status=UNDER_REVIEW"
        actor: IPCounsel
        preconditions:
          - "referenced NdaAgreement status == ACTIVE (ERR_NDA_NOT_ACTIVE)"
          - "referenced Counterparty status == ACTIVE (ERR_COUNTERPARTY_NOT_ACTIVE)"
          - "NDA classification_ceiling >= asset classification (ERR_CLASSIFICATION_CEILING_EXCEEDED)"
        side_effects: []
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /api/disclosures/{id}/state to_status=APPROVED"
        actor: IPCounsel
        preconditions:
          - "SecretAsset.protection_posture IN {ADEQUATE, STRONG} (ERR_POSTURE_DEFICIENT)"
          - "SecretAsset.version == pinned_asset_version AND NdaAgreement.version == pinned_nda_version (ERR_STALE_REFERENCE)"
          - "NDA still ACTIVE and counterparty still ACTIVE (ERR_NDA_NOT_ACTIVE / ERR_COUNTERPARTY_NOT_ACTIVE)"
          - "risk_score_final computed here; if risk_score_final >= 80 then senior_endorsed == true (ERR_ENDORSEMENT_REQUIRED); if risk_score_final >= 95 then approval is forbidden (ERR_DISCLOSURE_RISK_TOO_HIGH)"
          - "X-User-ID != requester_employee_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "risk_score_final = disclosure_risk_score final variant"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /api/disclosures/{id}/state to_status=REJECTED"
        actor: IPCounsel
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: RETURNED
        trigger: "POST /api/disclosures/{id}/state to_status=RETURNED"
        actor: IPCounsel
        preconditions: []
        side_effects: []
      - from: RETURNED
        to: DRAFT
        trigger: "POST /api/disclosures/{id}/state to_status=DRAFT"
        actor: Employee
        preconditions:
          - "X-User-ID == requester_employee_id (ERR_OWNERSHIP_REQUIRED)"
        side_effects:
          - "pinned_asset_version = null; pinned_nda_version = null; senior_endorsed = false"
        note: "revision loop DRAFT -> SUBMITTED -> UNDER_REVIEW -> RETURNED -> DRAFT"
      - from: APPROVED
        to: EXECUTED
        trigger: "POST /api/disclosures/{id}/state to_status=EXECUTED with marking_evidence_uri + marking_sha256"
        actor: IPCounsel
        preconditions:
          - "marking_evidence_uri non-empty AND marking_sha256 matches ^[0-9a-f]{64}$ (ERR_MARKING_EVIDENCE_REQUIRED)"
          - "current clock <= planned_disclosure_date + 30 days (ERR_INVALID_STATE: stale approval)"
        side_effects:
          - "create EvidenceItem(source=MARKED_COPY, disclosure_id=this, review_id=null, sha256=marking_sha256) directly in SEALED with sealed_at = now"
          - "recompute counterparty exposure indexes + risk_tier"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /api/disclosures/{id}/state to_status=WITHDRAWN"
        actor: Employee
        preconditions: ["X-User-ID == requester_employee_id (ERR_OWNERSHIP_REQUIRED)"]
        side_effects: []
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /api/disclosures/{id}/state to_status=WITHDRAWN"
        actor: Employee
        preconditions: ["X-User-ID == requester_employee_id (ERR_OWNERSHIP_REQUIRED)"]
        side_effects: []
      - from: RETURNED
        to: WITHDRAWN
        trigger: "POST /api/disclosures/{id}/state to_status=WITHDRAWN"
        actor: Employee
        preconditions: ["X-User-ID == requester_employee_id (ERR_OWNERSHIP_REQUIRED)"]
        side_effects: []

  - entity: ForensicReview
    initial_state: OPENED
    terminal_states: [CLOSED_NO_ACTION, ESCALATED]
    transitions:
      - from: OPENED
        to: IMAGING
        trigger: "POST /api/forensic-reviews/{id}/state to_status=IMAGING"
        actor: SecurityOfficer
        preconditions: []
        side_effects: []
      - from: IMAGING
        to: FINDINGS_DRAFTED
        trigger: "POST /api/forensic-reviews/{id}/state to_status=FINDINGS_DRAFTED"
        actor: SecurityOfficer
        preconditions:
          - "at least one EvidenceItem with review_id == this and status IN {COLLECTED, SEALED} (ERR_INVALID_STATE)"
        side_effects: []
      - from: FINDINGS_DRAFTED
        to: COUNSEL_REVIEW
        trigger: "POST /api/forensic-reviews/{id}/state to_status=COUNSEL_REVIEW"
        actor: IPCounsel
        preconditions: []
        side_effects: ["reviewed_by_counsel_id = X-User-ID"]
      - from: COUNSEL_REVIEW
        to: FINDINGS_DRAFTED
        trigger: "POST /api/forensic-reviews/{id}/state to_status=FINDINGS_DRAFTED (counsel kicks back)"
        actor: IPCounsel
        preconditions: []
        side_effects: []
        note: "cycle FINDINGS_DRAFTED <-> COUNSEL_REVIEW"
      - from: COUNSEL_REVIEW
        to: CLOSED_NO_ACTION
        trigger: "POST /api/forensic-reviews/{id}/state to_status=CLOSED_NO_ACTION"
        actor: IPCounsel
        preconditions: []
        side_effects: []
      - from: COUNSEL_REVIEW
        to: ESCALATED
        trigger: "POST /api/forensic-reviews/{id}/state to_status=ESCALATED"
        actor: IPCounsel
        preconditions:
          - "exfil_indicator_count >= 1 (ERR_INVALID_STATE: nothing to escalate)"
        side_effects: []

  - entity: DemandLetter
    initial_state: DRAFTED
    terminal_states: [COMPLIED, LITIGATION, WITHDRAWN]
    transitions:
      - from: DRAFTED
        to: COUNSEL_APPROVED
        trigger: "POST /api/demand-letters/{id}/state to_status=COUNSEL_APPROVED"
        actor: SeniorCounsel
        preconditions:
          - "X-User-ID != drafted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["approved_by_user_id = X-User-ID"]
      - from: COUNSEL_APPROVED
        to: ISSUED
        trigger: "POST /api/demand-letters/{id}/state to_status=ISSUED"
        actor: SeniorCounsel
        preconditions: []
        side_effects: ["issued_at = now; response_deadline = issued_at + response_deadline_days"]
      - from: ISSUED
        to: ACKNOWLEDGED
        trigger: "POST /api/demand-letters/{id}/state to_status=ACKNOWLEDGED"
        actor: IPCounsel
        preconditions: []
        side_effects: []
      - from: ACKNOWLEDGED
        to: COMPLIED
        trigger: "POST /api/demand-letters/{id}/state to_status=COMPLIED"
        actor: IPCounsel
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: IGNORED
        trigger: "POST /api/program/sweep (system: current clock > response_deadline)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACKNOWLEDGED
        to: IGNORED
        trigger: "POST /api/program/sweep (system: current clock > response_deadline)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IGNORED
        to: LITIGATION
        trigger: "POST /api/demand-letters/{id}/state to_status=LITIGATION"
        actor: SeniorCounsel
        preconditions: []
        side_effects:
          - "auto-create PreservationNotice(legal_matter_ref='AUTO:'+letter id, review_ids=[forensic_review_id], asset_ids=claim asset ids, employee_ids=[employee_id]) directly in ISSUED"
      - from: DRAFTED
        to: WITHDRAWN
        trigger: "POST /api/demand-letters/{id}/state to_status=WITHDRAWN"
        actor: IPCounsel
        preconditions: []
        side_effects: []
      - from: COUNSEL_APPROVED
        to: WITHDRAWN
        trigger: "POST /api/demand-letters/{id}/state to_status=WITHDRAWN"
        actor: IPCounsel
        preconditions: []
        side_effects: []

  - entity: PreservationNotice
    initial_state: DRAFT
    terminal_states: [RELEASED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /api/preservation-notices/{id}/state to_status=ISSUED"
        actor: IPCounsel
        preconditions:
          - "at least one of asset_ids / employee_ids / review_ids is non-empty (ERR_INVALID_REQUEST)"
        side_effects: []
      - from: ISSUED
        to: ACTIVE
        trigger: "POST /api/preservation-notices/{id}/state to_status=ACTIVE"
        actor: IPCounsel
        preconditions: []
        side_effects: []
        note: "while ACTIVE: covered SecretAssets cannot RETIRE; EvidenceItems of covered reviews cannot RELEASE"
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /api/preservation-notices/{id}/state to_status=RELEASED"
        actor: SeniorCounsel
        preconditions:
          - "no DemandLetter with status LITIGATION references a review in review_ids (ERR_INVALID_STATE)"
        side_effects: []

  - entity: EvidenceItem
    initial_state: COLLECTED
    terminal_states: [RELEASED]
    transitions:
      - from: COLLECTED
        to: SEALED
        trigger: "POST /api/evidence-items/{id}/state to_status=SEALED"
        actor: SecurityOfficer
        preconditions: []
        side_effects: ["sealed_at = now"]
      - from: SEALED
        to: RELEASED
        trigger: "POST /api/evidence-items/{id}/state to_status=RELEASED"
        actor: IPCounsel
        preconditions:
          - "if review_id is set: no PreservationNotice with status IN {ISSUED, ACTIVE} lists that review id in review_ids (ERR_PRESERVATION_HOLD_ACTIVE)"
          - "if disclosure_id is set: no PreservationNotice with status IN {ISSUED, ACTIVE} lists the parent review of that disclosure chain in review_ids"
        side_effects: []

  - entity: TrainingAssignment
    initial_state: ASSIGNED
    terminal_states: [COMPLETED, EXCUSED]
    transitions:
      - from: ASSIGNED
        to: COMPLETED
        trigger: "POST /api/training-assignments/{id}/state to_status=COMPLETED"
        actor: Employee
        preconditions:
          - "X-User-ID == employee_id of this assignment (ERR_OWNERSHIP_REQUIRED)"
        side_effects: ["completed_at = now; recompute Employee.training_current"]
      - from: OVERDUE
        to: COMPLETED
        trigger: "POST /api/training-assignments/{id}/state to_status=COMPLETED"
        actor: Employee
        preconditions:
          - "X-User-ID == employee_id of this assignment (ERR_OWNERSHIP_REQUIRED)"
        side_effects: ["completed_at = now; recompute Employee.training_current"]
      - from: ESCALATED
        to: COMPLETED
        trigger: "POST /api/training-assignments/{id}/state to_status=COMPLETED"
        actor: Employee
        preconditions:
          - "X-User-ID == employee_id of this assignment (ERR_OWNERSHIP_REQUIRED)"
        side_effects: ["completed_at = now; recompute Employee.training_current"]
      - from: ASSIGNED
        to: OVERDUE
        trigger: "POST /api/program/sweep (system: current clock > due_at)"
        actor: system
        preconditions:
          - "due_at strictly less than current clock (at exactly due_at the assignment stays ASSIGNED)"
        side_effects: ["recompute Employee.training_current"]
      - from: OVERDUE
        to: ESCALATED
        trigger: "POST /api/training-assignments/{id}/state to_status=ESCALATED"
        actor: HRPartner
        preconditions: []
        side_effects: ["recompute Employee.training_current"]
      - from: ASSIGNED
        to: EXCUSED
        trigger: "POST /api/training-assignments/{id}/state to_status=EXCUSED"
        actor: HRPartner
        preconditions: []
        side_effects: ["recompute Employee.training_current"]
      - from: OVERDUE
        to: EXCUSED
        trigger: "POST /api/training-assignments/{id}/state to_status=EXCUSED"
        actor: HRPartner
        preconditions: []
        side_effects: ["recompute Employee.training_current"]

  - entity: CleanDeskAudit
    initial_state: SCHEDULED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CONDUCTED
        trigger: "POST /api/clean-desk-audits/{id}/state to_status=CONDUCTED with findings_count, critical_findings, linked_measure_ids"
        actor: SecurityOfficer
        preconditions:
          - "findings_count >= critical_findings >= 0 (ERR_INVALID_REQUEST)"
        side_effects:
          - "if critical_findings > 0: every ReasonableMeasure whose id is in linked_measure_ids and whose status IN {IMPLEMENTED, VERIFIED} -> LAPSED (created_at ASC); each lapse recomputes its asset scores + protection_posture; any asset dropping to DEFICIENT cascades its UNDER_REVIEW DisclosureRequests -> RETURNED"
      - from: CONDUCTED
        to: REPORTED
        trigger: "POST /api/clean-desk-audits/{id}/state to_status=REPORTED"
        actor: SecurityOfficer
        preconditions: []
        side_effects: []
      - from: REPORTED
        to: REMEDIATING
        trigger: "POST /api/clean-desk-audits/{id}/state to_status=REMEDIATING"
        actor: SecurityOfficer
        preconditions:
          - "critical_findings > 0 (ERR_INVALID_STATE: non-critical audits close directly)"
        side_effects: []
      - from: REPORTED
        to: CLOSED
        trigger: "POST /api/clean-desk-audits/{id}/state to_status=CLOSED"
        actor: SecurityOfficer
        preconditions:
          - "critical_findings == 0 (ERR_INVALID_STATE: critical findings require remediation)"
        side_effects: []
      - from: REMEDIATING
        to: CLOSED
        trigger: "POST /api/clean-desk-audits/{id}/state to_status=CLOSED with resolved_critical_count"
        actor: SecurityOfficer
        preconditions:
          - "resolved_critical_count == critical_findings (ERR_INVALID_STATE)"
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/clean-desk-audits/{id}/state to_status=CANCELLED"
        actor: SecurityOfficer
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: asset-update-stale-version
    parent_entity: SecretAsset
    write_endpoint: "PATCH /api/assets/{id}"
    occ_field: "expected_asset_version"
    description: |
      Updating a SecretAsset whose version has advanced since the client last
      observed it is rejected. A descriptive-field update on a REGISTERED asset
      is otherwise legitimate for any later writer, so the stale view — not a
      state precondition — is the only thing that can reject it.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: nda-amend-stale-supersede
    parent_entity: NdaAgreement
    write_endpoint: "POST /api/ndas/{id}/amendments"
    occ_field: "expected_superseded_nda_version"
    description: |
      Creating an amendment NDA against a superseded NdaAgreement whose version
      has advanced since the client last observed it (e.g. a BREACH_ALLEGED loop
      was recorded in the meantime) is rejected. Amendment legitimately
      supersedes the prior agreement, so a stale basis must be refused.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: reasonable_measures_score
    trigger: "any ReasonableMeasure state change (incl. audit cascade), asset registration, asset retirement"
    algorithm: weighted_scoring
    formula: |
      WEIGHT = { POLICY: 10, TRAINING: 10, PHYSICAL: 15, CONTRACTUAL: 20, TECHNICAL: 25 }
      For each variant, sum over ReasonableMeasure rows of the asset:
        operational:  score_operational  = Σ weight_points × mult where
                      mult = 1.0 if VERIFIED, 0.6 if IMPLEMENTED, else 0
        documentary:  score_documentary  = Σ weight_points × 1.0 if VERIFIED else 0
      protection_posture (uses the OPERATIONAL variant only):
        STRONG   when score_operational >= 70
        ADEQUATE when 40 <= score_operational < 70
        DEFICIENT when score_operational < 40
    input_set: "all ReasonableMeasure rows with asset_id == asset, any status; PLANNED/LAPSED/ABANDONED contribute 0 via multiplier"
    constants:
      W_POLICY: 10
      W_TRAINING: 10
      W_PHYSICAL: 15
      W_CONTRACTUAL: 20
      W_TECHNICAL: 25
      MULT_VERIFIED: 1.0
      MULT_IMPLEMENTED: 0.6
      THRESHOLD_STRONG: 70
      THRESHOLD_ADEQUATE: 40
    precision: "2 decimal places, round_half_up (all weights integers so products are exact)"
    variants:
      - name: operational
        when: "drives protection_posture and all gating (disclosure approval, internal dashboards)"
        difference: "IMPLEMENTED measures count at 0.6x weight"
      - name: documentary
        when: "litigation-readiness reporting (GET /api/assets/{id}/posture-report)"
        difference: "IMPLEMENTED measures count 0 — only VERIFIED measures are court-presentable; identical rows yield a lower-or-equal score than operational"

  - name: counterparty_exposure_index
    trigger: "obligation ESCALATED / FULFILLED / WAIVED / OVERDUE transitions, NDA TERMINATED/EXPIRED, disclosure EXECUTED, counterparty state changes, sweep"
    algorithm: aggregation
    formula: |
      Let W = 365 days trailing window [now - 365d, now] (inclusive both ends).
      points(ob) = 25 if ob.status == ESCALATED and ob.escalated_at in window
                 + 10 if ob.status == OVERDUE (counted at 'now', no window)
      points(disc) = 5 per DisclosureRequest with nda_id in counterparty's NDAs,
                     status == EXECUTED and updated_at (execution time) in window
      trailing_12m = min(100, Σ over obligations of counterparty's NDAs + Σ over disclosures)
      lifetime     = same sums with no time window (all escalated_at / executed_at regardless of age)
      risk_tier    = LOW if trailing_12m < 30; MEDIUM if 30 <= trailing_12m < 60; HIGH if >= 60
    input_set: "NdaObligation rows whose parent NDA.counterparty_id == counterparty; DisclosureRequest rows whose nda_id belongs to that NDA set; OVERDUE term counts current OVERDUE regardless of timestamps"
    constants:
      PTS_ESCALATED: 25
      PTS_OVERDUE_NOW: 10
      PTS_DISCLOSURE_EXECUTED: 5
      CAP: 100
      TIER_MEDIUM_MIN: 30
      TIER_HIGH_MIN: 60
      WINDOW_DAYS: 365
    precision: "integer points; no rounding"
    variants:
      - name: trailing_12m
        when: "drives risk_tier and disclosure_risk_score TIER_MULT"
        difference: "only events inside the trailing 365-day window count"
      - name: lifetime
        when: "reported alongside for counsel review"
        difference: "no window — identical counterparty history yields a higher-or-equal index than trailing_12m once any event is older than 365 days"

  - name: disclosure_risk_score
    trigger: "provisional at DisclosureRequest DRAFT -> SUBMITTED; final at UNDER_REVIEW -> APPROVED"
    algorithm: weighted_scoring
    formula: |
      CLASS_BASE = { INTERNAL: 10, CONFIDENTIAL: 30, RESTRICTED: 60, CROWN_JEWEL: 90 }
      TIER_MULT  = { LOW: 1.0, MEDIUM: 1.25, HIGH: 1.5 }   # counterparty.risk_tier at evaluation time
      MARKING_CREDIT = { STAMPED_CONFIDENTIAL: 10, ORAL_WITH_FOLLOWUP: 0, ENCRYPTED_DELIVERY: 20 }
      provisional = CLASS_BASE[classification] - MARKING_CREDIT[marking_protocol]
      final       = clamp(CLASS_BASE[classification] * TIER_MULT[risk_tier] - MARKING_CREDIT[marking_protocol], 0, 100)
      Routing on final: final >= 80 requires senior_endorsed == true; final >= 95 forbids approval.
    input_set: "the DisclosureRequest row + its SecretAsset (classification) + its NDA's Counterparty (risk_tier from trailing_12m)"
    constants:
      CB_INTERNAL: 10
      CB_CONFIDENTIAL: 30
      CB_RESTRICTED: 60
      CB_CROWN_JEWEL: 90
      TM_LOW: 1.0
      TM_MEDIUM: 1.25
      TM_HIGH: 1.5
      MC_STAMPED: 10
      MC_ORAL: 0
      MC_ENCRYPTED: 20
      ENDORSEMENT_MIN: 80
      REJECT_MIN: 95
    precision: "1 decimal place, round_half_up"
    variants:
      - name: provisional
        when: "at SUBMITTED — requester-visible estimate"
        difference: "no counterparty tier multiplier (mult = 1.0 implicitly)"
      - name: final
        when: "at APPROVED — enforcement value"
        difference: "applies TIER_MULT and clamp; identical request data yields a different number whenever risk_tier != LOW"

  - name: demand_letter_damages
    trigger: "DemandLetter creation (POST /api/demand-letters)"
    algorithm: aggregation
    formula: |
      CLAIM_FACTOR = { CEASE_AND_DESIST: 0.30, RETURN_OF_PROPERTY: 0.20, PRESERVATION: 0.15 }
      PINNED ROUNDING ORDER (mode b): round each line first, then sum.
      line_cents(asset, claim) = round_half_up(asset.exposure_estimate_cents * CLAIM_FACTOR[claim]) to integer cents
      damages_estimate_cents = Σ line_cents over claim_lines (in request order)
      (The alternative — sum raw products then round once — is explicitly NOT used;
       e.g. exposure 10001 with all three claims: per-line 3000+2000+1500 = 6500,
       sum-then-round would give 6501.)
    input_set: "claim_lines array; each asset_id must exist (ERR_NOT_FOUND) and may be in any asset status"
    constants:
      CF_CEASE_AND_DESIST: 0.30
      CF_RETURN_OF_PROPERTY: 0.20
      CF_PRESERVATION: 0.15
    precision: "integer cents; per-line round_half_up BEFORE summation"

  - name: return_obligation_anchor
    trigger: "NdaAgreement -> TERMINATED (manual or counterparty-bar cascade) or -> EXPIRED (sweep)"
    algorithm: constraint_propagation
    formula: |
      RETURN_WINDOW_DAYS = 30
      On TERMINATED: for each PENDING RETURN_OR_DESTROY obligation of the NDA with due_at == null:
        due_at = terminated_at + 30 days
      On EXPIRED: same rows anchored at expiry_date instead:
        due_at = expiry_date + 30 days
    input_set: "NdaObligation rows of the NDA with obligation_type == RETURN_OR_DESTROY AND status == PENDING AND due_at == null"
    constants:
      RETURN_WINDOW_DAYS: 30
    precision: "datetime, second precision"

  - name: training_current
    trigger: "any TrainingAssignment transition, employee read that surfaces training_current, AccessGrant create/approve"
    algorithm: aggregation
    formula: |
      training_current = (count(TrainingAssignment of employee with status IN {OVERDUE, ESCALATED}) == 0)
                         AND (count(TrainingAssignment of employee with module == BASIC_TS AND status == COMPLETED
                                    AND completed_at within [now - 365d, now]) >= 1)
    input_set: "TrainingAssignment rows with employee_id == employee"
    constants:
      TRAINING_VALIDITY_DAYS: 365
    precision: "boolean"

  - name: active_grant_count
    trigger: "AccessGrant APPROVED / REVOKED / EXPIRED transitions (incl. employee NOTICE cascade and sweep)"
    algorithm: aggregation
    formula: |
      asset.active_grant_count = count(AccessGrant with asset_id == asset AND status IN {APPROVED, PROVISIONED, SUSPENDED})
      Invariant: a forward APPROVE (+1) paired with its compensating REVOKE (-1) returns the count
      to its prior value; SUSPEND/UNSUSPEND never change it; DENIED/EXPIRED-after-APPROVED are the
      only other decrements.
    input_set: "AccessGrant rows with asset_id == asset"
    constants: {}
    precision: "integer count"

  - name: nda_obligation_counts
    trigger: "NdaObligation creation and every obligation transition"
    algorithm: aggregation
    formula: |
      obligations_total_count     = count(all obligations of the NDA)
      obligations_open_count      = count(status IN {PENDING, OVERDUE, ESCALATED})
      obligations_fulfilled_count = count(status == FULFILLED)
      obligations_waived_count    = count(status == WAIVED)
      Invariant: open + fulfilled + waived == total at all times; FULFILL and WAIVE move a row
      between buckets without changing total.
    input_set: "NdaObligation rows with nda_id == NDA"
    constants: {}
    precision: "integer counts"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; lower number wins when a
# request violates several rules)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Acting role is in the endpoint's roles list (incl. per-transition role gates, e.g. CROWN_JEWEL grant approval needs IPCounsel, letter approval needs SeniorCounsel)"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "Ownership / segregation-of-duties identity rules: sign own acknowledgment, submit/withdraw own disclosure, complete own training, counterparty executes/fulfills only its own NDA rows; implementer != verifier; drafter != approver; requester != approver"
    error_id: ERR_OWNERSHIP_REQUIRED / ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "sign, complete, execute, fulfill, approve, verify transitions"

  - priority: 4
    category: existence
    check: "Every path id and every FK id in the body exists (asset, employee, NDA, obligation, review, letter, notice, evidence, training, audit, measure, disclosure, counterparty)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with ids"

  - priority: 5
    category: state
    check: "OCC: expected_asset_version / expected_superseded_nda_version matches the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "PATCH /api/assets/{id}, POST /api/ndas/{id}/amendments"

  - priority: 6
    category: state
    check: "State-machine precondition: transition is defined from the current state; entity-level state gates (asset REGISTERED for grants/submits, employee ACTIVE for grant approval, review ESCALATED for letter creation, interview CONDUCTED before CERTIFIED, etc.)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state endpoints and state-gated creates"

  - priority: 7
    category: business_safety
    check: "Classification / need-to-know / preservation gates: employee clearance >= classification requirement; NDA classification_ceiling >= asset classification; asset protection_posture != DEFICIENT for approval; no ACTIVE/ISSUED preservation block; evidence not modified after seal; disclosure risk < 95"
    error_id: "ERR_NEED_TO_KNOW_VIOLATION / ERR_CLASSIFICATION_CEILING_EXCEEDED / ERR_POSTURE_DEFICIENT / ERR_PRESERVATION_HOLD_ACTIVE / ERR_DISCLOSURE_RISK_TOO_HIGH / ERR_ENDORSEMENT_REQUIRED"
    http_status: 409
    applies_to: "grant create/approve, disclosure review/approve, asset retire, evidence release"

  - priority: 8
    category: business_temporal
    check: "Time-window rules: expiry_date > effective_date; scheduled_end > scheduled_start; window_end > window_start; grant expires_at > now and <= now+365d; forensic review opened within 90 days of departed_at; NDA window overlap (closed intervals); audit 7-day buffer; interview half-open overlap"
    error_id: "ERR_DATE_ORDER / ERR_EXPIRY_IN_PAST / ERR_REVIEW_WINDOW_EXPIRED / ERR_NDA_WINDOW_OVERLAP / ERR_AUDIT_WINDOW_CONFLICT / ERR_INTERVIEW_OVERLAP"
    http_status: 422
    applies_to: "creates and reschedules with datetimes"

  - priority: 9
    category: business_referential
    check: "Referenced-entity state: NDA ACTIVE for disclosure review; counterparty ACTIVE for NDA create and disclosure review; pinned versions current at approval; acknowledgment SIGNED and on current policy for activation; exit interview CERTIFIED and zero active grants for departure; review concluded for departure"
    error_id: "ERR_NDA_NOT_ACTIVE / ERR_COUNTERPARTY_NOT_ACTIVE / ERR_STALE_REFERENCE / ERR_ACK_REQUIRED / ERR_POLICY_VERSION_STALE / ERR_EXIT_INTERVIEW_NOT_CERTIFIED / ERR_ACTIVE_GRANTS_REMAIN / ERR_REVIEW_NOT_CONCLUDED"
    http_status: 409
    applies_to: "cross-entity gated transitions"

  - priority: 10
    category: business_constraint
    check: "Aggregate/constraint rules: employee.training_current == true for grant approval; measure evidence present before IMPLEMENTED; findings_count >= critical_findings; resolved_critical_count == critical_findings on close; claim_lines non-empty; sha256 format; unique employee email"
    error_id: "ERR_TRAINING_NOT_CURRENT / ERR_MEASURE_EVIDENCE_REQUIRED / ERR_MARKING_EVIDENCE_REQUIRED / ERR_INVALID_HASH / ERR_INVALID_REQUEST / ERR_DUPLICATE_EMAIL"
    http_status: "409 | 422 | 400"
    applies_to: "various"

# =============================================================================
# §1.5 API Endpoint Table
# State endpoints take `to_status` plus transition-specific optional fields.
# =============================================================================
endpoints:
  # --- Logical clock (test-driving) ---
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the server logical clock. Before any call, the clock reads exactly 2026-05-01T00:00:00Z (never wall-clock). All deadline/expiry/window rules evaluate against this clock."
    roles: [IPCounsel]
    code: 200
    input: [to_iso8601]
    output: "{ now_iso8601: string }"
    side_effects: []

  # --- Program-level ---
  - method: GET
    path: "/api/program/status"
    description: "Computed read: current_policy_version (starts at \"v1\" at server init), current logical clock (default 2026-05-01T00:00:00Z until set), per-entity status counts"
    roles: [IPCounsel, SeniorCounsel, HRPartner, SecurityOfficer]
    code: 200
    input: []
    output: "{ current_policy_version: string, now_iso8601: string, counts: object }"
    side_effects: []

  - method: POST
    path: "/api/program/policy/publish"
    description: "Publish a new confidentiality policy version; supersedes old acknowledgments and issues fresh PENDING ones"
    roles: [IPCounsel]
    code: 200
    input: [new_version]
    output: "{ current_policy_version: string, superseded_count: integer, reissued_count: integer }"
    side_effects:
      - "new_version must differ from current_policy_version (ERR_INVALID_REQUEST)"
      - "every Acknowledgment with status SIGNED and policy_version != new_version -> SUPERSEDED (created_at ASC); PENDING rows are left in place (they become unsignable via ERR_POLICY_VERSION_STALE)"
      - "for every Employee with status IN {PREBOARDING, ACTIVE, NOTICE} (created_at ASC): create a new PENDING Acknowledgment with policy_version = new_version, due_at = now + 10 days"
      - "current_policy_version = new_version"

  - method: POST
    path: "/api/program/sweep"
    description: "Ops-run checkpoint: advance all clock-driven transitions in a fixed order (1 NDAs expire, 2 obligations overdue, 3 grants expire, 4 training overdue, 5 acknowledgments expire, 6 demand letters ignored). Within each class rows process in created_at ASC."
    roles: [IPCounsel, SecurityOfficer]
    code: 200
    input: []
    output: "{ ndas_expired: integer, obligations_overdue: integer, grants_expired: integer, trainings_overdue: integer, acks_expired: integer, letters_ignored: integer }"
    side_effects:
      - "NdaAgreement ACTIVE with now > expiry_date -> EXPIRED (RETURN_OR_DESTROY anchoring per return_obligation_anchor)"
      - "NdaObligation PENDING with due_at non-null and now > due_at -> OVERDUE"
      - "AccessGrant IN {APPROVED, PROVISIONED} with now > expires_at -> EXPIRED (active_grant_count -1 each)"
      - "TrainingAssignment ASSIGNED with now > due_at -> OVERDUE (training_current recompute)"
      - "Acknowledgment PENDING with now > due_at -> EXPIRED"
      - "DemandLetter IN {ISSUED, ACKNOWLEDGED} with response_deadline non-null and now > response_deadline -> IGNORED"

  # --- SecretAsset ---
  - method: POST
    path: "/api/assets"
    description: "Register a new trade secret asset (starts DRAFT)"
    roles: [IPCounsel]
    code: 201
    input: [title, description, classification, owner_department, exposure_estimate_cents]
    output: SecretAsset
    side_effects: ["status=DRAFT; scores 0; protection_posture=DEFICIENT; active_grant_count=0"]

  - method: GET
    path: "/api/assets"
    description: "List assets with filters and pagination"
    roles: [IPCounsel, SeniorCounsel, SecurityOfficer]
    code: 200
    input: ["classification?", "status?", "protection_posture?", "limit?", "offset?"]
    output: "SecretAsset[]"
    side_effects: []

  - method: GET
    path: "/api/assets/{id}"
    description: "Get one asset (includes both score variants, posture, active_grant_count)"
    roles: [IPCounsel, SeniorCounsel, SecurityOfficer]
    code: 200
    input: []
    output: SecretAsset
    side_effects: []

  - method: PATCH
    path: "/api/assets/{id}"
    description: "Update asset descriptive fields / classification / exposure estimate; OCC-guarded"
    roles: [IPCounsel]
    code: 200
    input: [expected_asset_version, "title?", "description?", "classification?", "exposure_estimate_cents?"]
    output: SecretAsset
    side_effects:
      - "increments SecretAsset.version by 1"
      - "if classification changed: recompute disclosure_risk_score relevance; existing pins go stale via version bump (approval revalidates)"

  - method: POST
    path: "/api/assets/{id}/state"
    description: "Asset lifecycle transitions (REGISTERED / SUSPENDED / RETIRED)"
    roles: [IPCounsel]
    code: 200
    input: [to_status]
    output: SecretAsset
    side_effects: ["per SecretAsset state machine incl. retire cascade"]

  - method: GET
    path: "/api/assets/{id}/posture-report"
    description: "Litigation-readiness computed read: both score variants, posture, per-measure breakdown with weight_points and points_effective"
    roles: [IPCounsel, SeniorCounsel]
    code: 200
    input: []
    output: "{ asset_id: string, score_operational: number, score_documentary: number, protection_posture: string, measures: array }"
    side_effects: []

  # --- ReasonableMeasure ---
  - method: POST
    path: "/api/measures"
    description: "Document a reasonable-measure item for an asset (starts PLANNED)"
    roles: [SecurityOfficer, IPCounsel]
    code: 201
    input: [asset_id, measure_type, title, "evidence_uri?"]
    output: ReasonableMeasure
    side_effects: ["status=PLANNED; recompute parent asset scores/posture"]

  - method: GET
    path: "/api/measures"
    description: "List measures (filterable by asset_id, status, measure_type)"
    roles: [IPCounsel, SeniorCounsel, SecurityOfficer]
    code: 200
    input: ["asset_id?", "status?", "measure_type?", "limit?", "offset?"]
    output: "ReasonableMeasure[]"
    side_effects: []

  - method: GET
    path: "/api/measures/{id}"
    description: "Get one measure"
    roles: [IPCounsel, SeniorCounsel, SecurityOfficer]
    code: 200
    input: []
    output: ReasonableMeasure
    side_effects: []

  - method: POST
    path: "/api/measures/{id}/state"
