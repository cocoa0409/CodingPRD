            - { call: "POST /api/placements/${p}/confirm", payload: {}, as: IntegratorAdmin }
            - { call: "POST /api/flocks/${f}/feed-deliveries", payload: { delivered_date: "2026-08-05", feed_lbs: 1000, feed_type: STARTER, ticket_no: "FT-V3" }, as: IntegratorAdmin }
          trigger:
            - { call: "POST /api/contracts/${c}/terminate", payload: {}, as: IntegratorAdmin, captures: { err: $.data.error_id } }
          assert:
            - "terminate rejected with ERR_FLOCKS_IN_FLIGHT 409; contract remains ACTIVE"

      - name: loan_terms_out_of_range_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=16]", "errors[ERR_LOAN_TERMS_INVALID]"]
        distinguishing_aspect: "recovery_pct 51 (>50) rejected with ERR_LOAN_TERMS_INVALID."
