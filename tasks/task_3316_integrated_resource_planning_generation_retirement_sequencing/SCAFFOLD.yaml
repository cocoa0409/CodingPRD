# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing or role not declared" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for endpoint, or entity_backed ownership violated (intervenor acting on another's testimony), or segregation-of-duties breach (commitment issuer awarding own commitment)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed payload: missing required field, wrong type, empty body string, delta_pct outside [-0.50, +0.50], negative MW, decision not in {APPROVE, APPROVE_WITH_CONDITIONS, REJECT}, APPROVE_WITH_CONDITIONS with empty conditions[], baseline_load_mw == 0 for deviation report" }
  - { id: ERR_PLAN_NOT_FOUND, http: 404, condition: "planId does not exist" }
  - { id: ERR_FORECAST_NOT_FOUND, http: 404, condition: "forecastId does not exist under the plan" }
  - { id: ERR_PORTFOLIO_NOT_FOUND, http: 404, condition: "portfolioId does not exist (or not under the path's plan)" }
  - { id: ERR_RESOURCE_NOT_FOUND, http: 404, condition: "resourceId does not exist" }
  - { id: ERR_CANDIDATE_NOT_FOUND, http: 404, condition: "candidate_id does not exist" }
  - { id: ERR_SNAPSHOT_NOT_FOUND, http: 404, condition: "snapshot_id does not exist, or no snapshot exists for report_year when filing a deviation report" }
  - { id: ERR_ANALYSIS_NOT_FOUND, http: 404, condition: "analysisId does not exist" }
  - { id: ERR_COMMENT_NOT_FOUND, http: 404, condition: "commentId does not exist under the plan" }
  - { id: ERR_TESTIMONY_NOT_FOUND, http: 404, condition: "testimonyId does not exist" }
  - { id: ERR_INTERVENOR_NOT_FOUND, http: 404, condition: "intervenor_id does not exist" }
  - { id: ERR_COMMITMENT_NOT_FOUND, http: 404, condition: "commitmentId does not exist" }
  - { id: ERR_CONDITION_NOT_FOUND, http: 404, condition: "a condition id in condition_discharge_ids does not exist or belongs to a different plan" }
  - { id: ERR_PLAN_NOT_DRAFT, http: 409, condition: "Operation requires plan status == DRAFT (forecast/portfolio/position edits, retire plan reference, analysis reopen, cancel-retirement plan gate)" }
  - { id: ERR_PLAN_NOT_OPEN_FOR_COMMENT, http: 409, condition: "Comment create/acknowledge requires plan status == OPEN_FOR_COMMENT" }
  - { id: ERR_PLAN_NOT_UNDER_REVIEW, http: 409, condition: "Testimony file/withdraw/refile and commission-review require plan status == UNDER_REVIEW" }
  - { id: ERR_PLAN_NOT_APPROVED, http: 409, condition: "Commitment issue/award or deviation report requires plan status in {APPROVED, APPROVED_WITH_CONDITIONS}" }
  - { id: ERR_PORTFOLIO_FROZEN, http: 409, condition: "Position add or remove on a FROZEN portfolio (snapshot compute is permitted on FROZEN portfolios)" }
  - { id: ERR_FORECAST_LOCKED, http: 409, condition: "Update to a locked forecast row (plan left DRAFT)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic state precondition failure not covered by a more specific error (e.g., retire on non-ACTIVE resource, withdraw on non-FILED testimony)" }
  - { id: ERR_COMMITMENT_NOT_ISSUABLE, http: 409, condition: "Award/cancel on a commitment not in ISSUED" }
  - { id: ERR_CONDITION_ALREADY_DISCHARGED, http: 409, condition: "Cancel a commitment whose listed condition is already DISCHARGED" }
  - { id: ERR_COMMENT_WINDOW_CLOSED, http: 422, condition: "Comment filed when logical-clock date is outside [comment_window_opens_on, comment_window_closes_on] inclusive" }
  - { id: ERR_COMMENT_WINDOW_OPEN, http: 422, condition: "submit-for-review attempted before logical-clock date reaches comment_window_closes_on" }
  - { id: ERR_RETIREMENT_TOO_EARLY, http: 422, condition: "retirement_year < logical-clock year + MIN_RETIREMENT_LEAD_YEARS (2)" }
  - { id: ERR_CYCLE_DEADLINE_MISSED, http: 422, condition: "open-comment would set submitted_on after September 1 of cycle_year" }
  - { id: ERR_DUPLICATE_SNAPSHOT, http: 409, condition: "Snapshot for (portfolio_id, forecast_year) already exists and is not retire-flagged" }
  - { id: ERR_DUPLICATE_REPORT, http: 409, condition: "Deviation report for (plan_id, report_year) already exists" }
  - { id: ERR_DUPLICATE_FORECAST, http: 409, condition: "Forecast for (plan_id, scenario_tag, forecast_year) already exists" }
  - { id: ERR_PREFERRED_PORTFOLIO_CONFLICT, http: 409, condition: "Second portfolio with preferred_flag == true in the same plan" }
  - { id: ERR_DUPLICATE_CANDIDATE_NAME, http: 409, condition: "candidate_name already registered (case-sensitive)" }
  - { id: ERR_DUPLICATE_INTERVENOR, http: 409, condition: "Intervenor legal_name already registered" }
  - { id: ERR_NAMEPLATE_EXCEEDED, http: 409, condition: "Aggregate committed_mw across ISSUED/AWARDED commitments (or a position committed_mw) exceeds candidate nameplate_mw" }
  - { id: ERR_DUPLICATE_POSITION, http: 409, condition: "A selected position for (portfolio_id, candidate_id) already exists" }
  - { id: ERR_NO_ELIGIBLE_CANDIDATE, http: 422, condition: "auto_select waterfall found no feasible candidate or insufficient remaining nameplate" }
  - { id: ERR_SNAPSHOT_PLAN_MISMATCH, http: 422, condition: "snapshot_id belongs to a portfolio of a different plan than the analysis/sensitivity being created" }
  - { id: ERR_INTERVENOR_NO_STANDING, http: 422, condition: "intervenor_id exists but standing_approved == false, or X-User-ID != intervenor_id" }
  - { id: ERR_REFERENTIAL_INTEGRITY, http: 422, condition: "Other cross-entity referential failure (e.g., retire plan_id points to a SUPERSEDED plan)" }
  - { id: ERR_NO_PREFERRED_PORTFOLIO, http: 422, condition: "submit-for-review with no preferred_flag == true portfolio" }
  - { id: ERR_RELIABILITY_NOT_MET, http: 422, condition: "Approve/approve-with-conditions when the preferred portfolio has no non-retire-flagged snapshot with meets_requirement == true" }
  - { id: ERR_PLAN_REOPEN_LIMIT, http: 422, condition: "reopen when reopen_count == 2" }
  - { id: ERR_PLAN_MISSING_BASE_FORECAST, http: 422, condition: "open-comment with no BASE-scenario forecast row" }
  - { id: ERR_PLAN_MISSING_PORTFOLIO, http: 422, condition: "open-comment with no portfolio" }
  - { id: ERR_STALE_PLAN_VERSION, http: 412, condition: "expected_plan_version != current ResourcePlan.version at commission-review" }
  - { id: ERR_STALE_PORTFOLIO_VERSION, http: 412, condition: "expected_portfolio_version != current ResourcePortfolio.version at snapshot compute" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: UtilityPlanner
    description: "Utility resource-planning staff; builds plans, forecasts, portfolios, fleet decisions, analyses; issues commitments"
    identity: opaque
    exclusive_operations:
      - "POST /plans, plan lifecycle transitions (open-comment, submit-for-review, reopen)"
      - "LoadForecast create/update"
      - "Resource register/retire/cancel-retirement/mothball"
      - "Portfolio/Position management; snapshot compute"
      - "Candidate registration"
      - "RetirementAnalysis create/finalize/reopen"
      - "Comment acknowledge"
      - "Sensitivity analysis create"
      - "ProcurementCommitment issue/cancel; deviation report filing"
    shared_operations:
      - "GET read endpoints"
      - "POST /plans/{planId}/comments (planner may also file comments)"
      - "POST /_clock/set_current_utc"

  - name: Commissioner
    description: "Utility commission reviewer; decides plans and awards commitments"
    identity: opaque
    exclusive_operations:
      - "POST /plans/{planId}/commission-review"
      - "POST /procurement-commitments/{commitmentId}/award"
    shared_operations:
      - "GET read endpoints"

  - name: Intervener
    description: "Registered intervening party; files/withdraws testimony as itself"
    identity: "entity_backed:Intervenor"
    exclusive_operations:
      - "POST /plans/{planId}/testimonies"
      - "POST /testimonies/{testimonyId}/withdraw"
      - "POST /testimonies/{testimonyId}/refile"
    shared_operations:
      - "GET read endpoints"

  - name: PublicCommenter
    description: "Member of the public; files comments during the comment window"
    identity: opaque
    exclusive_operations:
      - "POST /plans/{planId}/comments"
    shared_operations:
      - "GET read endpoints on plans/forecasts/portfolios/comments"

  - name: PlatformAdmin
    description: "Operator; registers intervenors and drives the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /intervenors"
    shared_operations:
      - "GET read endpoints"
      - "POST /_clock/set_current_utc"

# Statutory constants referenced across tables (documentation anchor)
domain_constants:
  MIN_RETIREMENT_LEAD_YEARS: 2
  REOPEN_LIMIT: 2
  COMMENT_WINDOW_DAYS: 30
  CYCLE_DEADLINE_MONTH_DAY: "09-01"
