          - endpoints.GET_/nonprofits/funder-research/prospects
        distinguishing_aspect: "The prospect list is ranked match_score DESC, then historical_giving_cents DESC, then organization.created_at ASC — a pinned three-key ordering with no UUID anywhere in the comparison."
