# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors: &errors

  # --- Authentication and authorization ------------------------------------
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID or X-User-Role header missing, or the role is not one of the six declared roles"
  - id: ERR_INSUFFICIENT_PERMISSIONS
    http: 403
    condition: "The acting role is not listed in the endpoint's roles in §1.5"

  # --- Not found -----------------------------------------------------------
  - id: ERR_PROGRAM_NOT_FOUND
    http: 404
    condition: "No Program with the supplied id"
  - id: ERR_PATIENT_NOT_FOUND
    http: 404
    condition: "No Patient with the supplied id"
  - id: ERR_DOSE_ORDER_NOT_FOUND
    http: 404
    condition: "No DoseOrder with the supplied id"
  - id: ERR_DOSE_NOT_FOUND
    http: 404
    condition: "No DoseDispense with the supplied id"
  - id: ERR_PRIVILEGE_NOT_FOUND
    http: 404
    condition: "No TakeHomePrivilege with the supplied id"
  - id: ERR_EXCEPTION_NOT_FOUND
    http: 404
    condition: "No TakeHomeException with the supplied id"
  - id: ERR_LOT_NOT_FOUND
    http: 404
    condition: "No InventoryLot with the supplied id"
  - id: ERR_TRANSACTION_NOT_FOUND
    http: 404
    condition: "No InventoryTransaction with the supplied id"
  - id: ERR_INSPECTION_NOT_FOUND
    http: 404
    condition: "No ComplianceInspection with the supplied id"
  - id: ERR_FINDING_NOT_FOUND
    http: 404
    condition: "No ComplianceFinding with the supplied id"
  - id: ERR_DIVERSION_CASE_NOT_FOUND
    http: 404
    condition: "No DiversionCase with the supplied id"
  - id: ERR_ACTION_NOT_FOUND
    http: 404
    condition: "No CorrectiveAction with the supplied id"
  - id: ERR_ARRANGEMENT_NOT_FOUND
    http: 404
    condition: "No GuestDosingArrangement with the supplied id"
  - id: ERR_USER_NOT_FOUND
    http: 404
    condition: "No User with the supplied id"
  - id: ERR_SESSION_NOT_FOUND
    http: 404
    condition: "No CounselingSession with the supplied id"
  - id: ERR_REVIEW_NOT_FOUND
    http: 404
    condition: "No TreatmentPlanReview with the supplied id"
  - id: ERR_LEDGER_NOT_FOUND
    http: 404
    condition: "No TakeHomeCarryLedger with the supplied id"
  - id: ERR_CARRY_LEDGER_NOT_FOUND
    http: 404
    condition: "No CarryQuotaLedger exists for the program"

  # --- Optimistic concurrency ---------------------------------------------
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not equal the parent entity's current version at the time the write is applied"

  # --- State preconditions -------------------------------------------------
  - id: ERR_PROGRAM_ALREADY_SUSPENDED
    http: 409
    condition: "Program is already SUSPENDED"
  - id: ERR_PROGRAM_NOT_SUSPENDED
    http: 409
    condition: "Program is not SUSPENDED, so it cannot be resumed"
  - id: ERR_PATIENT_NOT_PENDING_ADMISSION
    http: 409
    condition: "Patient is not PENDING_ADMISSION"
  - id: ERR_PATIENT_NOT_ADMITTED
    http: 409
    condition: "Patient is not ADMITTED, so the dose order cannot activate"
  - id: ERR_PATIENT_NOT_ACTIVE
    http: 409
    condition: "Patient is not ACTIVE"
  - id: ERR_PATIENT_NOT_DOSABLE
    http: 409
    condition: "Patient is in a status that cannot receive a verified dose"
  - id: ERR_PATIENT_NOT_SUSPENDED
    http: 409
    condition: "Patient is not SUSPENDED_NON_COMPLIANT, so reinstatement is not applicable"
  - id: ERR_PATIENT_NOT_DISCHARGEABLE
    http: 409
    condition: "Patient is already in a terminal status"
  - id: ERR_DOSE_ORDER_NOT_DRAFT
    http: 409
    condition: "DoseOrder is not DRAFT (and not SUSPENDED re-activation)"
  - id: ERR_DOSE_ORDER_NOT_ACTIVE
    http: 409
    condition: "DoseOrder is not ACTIVE"
  - id: ERR_DOSE_ORDER_NOT_DISCONTINUABLE
    http: 409
    condition: "DoseOrder is already DISCONTINUED"
  - id: ERR_DOSE_NOT_SCHEDULED
    http: 409
    condition: "DoseDispense is not SCHEDULED"
  - id: ERR_DOSE_NOT_ARRIVED
    http: 409
    condition: "DoseDispense is not ARRIVED_AT_CLINIC"
  - id: ERR_DOSE_NOT_VERIFIED
    http: 409
    condition: "DoseDispense is not NURSE_VERIFIED"
  - id: ERR_DOSE_NOT_DISPENSED
    http: 409
    condition: "DoseDispense is not DISPENSED"
  - id: ERR_DOSE_NOT_REFUSABLE
    http: 409
    condition: "DoseDispense is in a status from which refusal is not declared"
  - id: ERR_DOSE_NOT_CANCELLABLE
    http: 409
    condition: "DoseDispense is already in a terminal status"
  - id: ERR_TAKE_HOME_NOT_CHECKED_IN
    http: 409
    condition: "A take-home issuance dose was sent to the check-in endpoint"
  - id: ERR_DOSE_ORDER_CHANGED
    http: 409
    condition: "The dose's frozen ordered milligrams no longer match the dose order snapshot"
  - id: ERR_PRIVILEGE_NOT_PENDING
    http: 409
    condition: "TakeHomePrivilege is not PENDING_REVIEW"
  - id: ERR_PRIVILEGE_NOT_DENIED
    http: 409
    condition: "TakeHomePrivilege is not DENIED, so no exception can attach to it"
  - id: ERR_PRIVILEGE_NOT_ACTIVE
    http: 409
    condition: "TakeHomePrivilege is not APPROVED or APPROVED_WITH_EXCEPTION"
  - id: ERR_REISSUE_SOURCE_NOT_REVOKED
    http: 409
    condition: "reissued_from_privilege_id names a privilege that is not REVOKED"
  - id: ERR_EXCEPTION_NOT_REQUESTED
    http: 409
    condition: "TakeHomeException is not REQUESTED"
  - id: ERR_EXCEPTION_NOT_AWAITING_SUPERVISOR
    http: 409
    condition: "TakeHomeException is not SUPERVISOR_REVIEW"
  - id: ERR_EXCEPTION_NOT_GRANTED
    http: 409
    condition: "TakeHomeException is not GRANTED"
  - id: ERR_ARRANGEMENT_NOT_DRAFT
    http: 409
    condition: "GuestDosingArrangement is not DRAFT"
  - id: ERR_ARRANGEMENT_NOT_PENDING_ACK
    http: 409
    condition: "GuestDosingArrangement is not PENDING_RECEIVING_ACK"
  - id: ERR_ARRANGEMENT_NOT_ACTIVE
    http: 409
    condition: "GuestDosingArrangement is not ACTIVE"
  - id: ERR_ARRANGEMENT_NOT_CANCELLABLE
    http: 409
    condition: "GuestDosingArrangement is already terminal"
  - id: ERR_LOT_NOT_QUARANTINABLE
    http: 409
    condition: "InventoryLot is not RECEIVED or IN_USE"
  - id: ERR_LOT_NOT_QUARANTINED
    http: 409
    condition: "InventoryLot is not QUARANTINED"
  - id: ERR_LOT_NOT_EMPTY
    http: 409
    condition: "InventoryLot still holds milligrams, so it cannot be destroyed"
  - id: ERR_INSPECTION_NOT_SCHEDULED
    http: 409
    condition: "ComplianceInspection is not SCHEDULED"
  - id: ERR_INSPECTION_NOT_IN_PROGRESS
    http: 409
    condition: "ComplianceInspection is not IN_PROGRESS"
  - id: ERR_DIVERSION_CASE_NOT_OPEN
    http: 409
    condition: "DiversionCase is not OPEN"
  - id: ERR_DIVERSION_CASE_NOT_UNDER_REVIEW
    http: 409
    condition: "DiversionCase is not UNDER_REVIEW"
  - id: ERR_DIVERSION_CASE_NOT_CLOSABLE
    http: 409
    condition: "DiversionCase is neither CONFIRMED nor UNSUBSTANTIATED"
  - id: ERR_ACTION_NOT_OPEN
    http: 409
    condition: "CorrectiveAction is not OPEN"
  - id: ERR_ACTION_NOT_IMPLEMENTED
    http: 409
    condition: "CorrectiveAction is not IMPLEMENTED"
  - id: ERR_CRITICAL_FINDING_OPEN
    http: 409
    condition: "An inspection cannot complete while one of its CRITICAL findings is OPEN"
  - id: ERR_NOT_IN_WITHDRAWAL_PHASE
    http: 409
    condition: "Patient is not in MEDICAL_WITHDRAWAL"
  - id: ERR_OPEN_DOSES_REMAIN
    http: 409
    condition: "Patient still has non-terminal dose rows"
  - id: ERR_GUEST_TOKEN_ALREADY_CONSUMED
    http: 409
    condition: "The guest dosing authorization token has already been redeemed"
  - id: ERR_TRAVEL_WINDOW_NOT_ENDED
    http: 409
    condition: "The logical clock has not passed travel_end_date"
  - id: ERR_REINSTATEMENT_DENIAL_STREAK
    http: 409
    condition: "missed_dose_streak is still 3 or more at reinstatement time"

  # --- Safety and compliance ----------------------------------------------
  - id: ERR_PROGRAM_OPERATIONALLY_BLOCKED
    http: 409
    condition: "Program.posture is FROZEN, or is not NORMAL where NORMAL is required"
  - id: ERR_PROGRAM_POSTURE_RESTRICTED
    http: 403
    condition: "Program.posture is RESTRICTED and the operation is a carry or admission operation"
  - id: ERR_DIVERSIONS_OR_FINDINGS_OPEN
    http: 403
    condition: "Patient.diversion_standing is CONFIRMED_DIVERSION and the operation would grant or continue medication"
  - id: ERR_PATIENT_FLAGGED_FOR_DIVERSION
    http: 403
    condition: "Patient has an open DiversionCase (status OPEN or UNDER_REVIEW)"
  - id: ERR_DUAL_ENROLLMENT_DETECTED
    http: 409
    condition: "The time-in-treatment tracker reports dual_enrollment_flag true for this patient"
  - id: ERR_WITNESS_REQUIRED
    http: 422
    condition: "A wasted or destroyed quantity has no witness, or the witness equals the acting staff member"
  - id: ERR_STABILITY_BELOW_THRESHOLD
    http: 422
    condition: "The DIRECTION_B_TAKE_HOME_READINESS reading is below the phase floor"
  - id: ERR_SELF_REVIEW_FORBIDDEN
    http: 400
    condition: "Segregation of duties violated: the acting user, requesting physician, supervisor or witness ids collide"
  - id: ERR_NURSE_NOT_IN_PROGRAM
    http: 403
    condition: "Acting Nurse.program_id differs from the resource's program"
  - id: ERR_PHYSICIAN_NOT_IN_PROGRAM
    http: 403
    condition: "Acting Physician.program_id differs from the patient's program"
  - id: ERR_GUEST_DOSING_NOT_ENABLED
    http: 409
    condition: "Receiving program has guest_dosing_enabled false"
  - id: ERR_COUNSELING_CADENCE_BREACHED
    http: 403
    condition: "Patient.counseling_standing is COUNSELING_DEFICIENT and the operation requires current counseling standing"

  # --- Referential ----------------------------------------------------------
  - id: ERR_ARRANGEMENT_PROGRAM_MISMATCH
    http: 409
    condition: "originating_program_id does not equal Patient.program_id"
  - id: ERR_SAME_PROGRAM_GUEST_DOSING
    http: 409
    condition: "receiving_program_id equals originating_program_id"
  - id: ERR_GUEST_TOKEN_INVALID
    http: 409
    condition: "The guest dosing token is absent, not minted, or does not belong to the arrangement"
  - id: ERR_NO_OVERLAPPING_VISIT_WINDOW
    http: 409
    condition: "The travel window and the receiving clinic's open days and hours never overlap"
  - id: ERR_GUEST_DOSING_WINDOW_CLOSED
    http: 409
    condition: "The logical clock falls outside [travel_start_date, travel_end_date]"

  # --- Temporal -------------------------------------------------------------
  - id: ERR_OUTSIDE_CLINIC_HOURS
    http: 409
    condition: "The instant is outside the clinic window plus the check-in grace period"
  - id: ERR_NOT_AN_OPEN_DAY
    http: 409
    condition: "The dose date is not one of the program's open_days"
  - id: ERR_NO_DOSE_CAPACITY
    http: 409
    condition: "The open day already holds max_daily_dose_slots non-terminal doses"
  - id: ERR_DUPLICATE_ACTIVE_DOSE
    http: 409
    condition: "The patient already has a non-terminal dose on this dose_date"
  - id: ERR_LOT_EXPIRED
    http: 409
    condition: "The lot's expiration_date is on or before the dispensing date"
  - id: ERR_LOT_QUARANTINED
    http: 409
    condition: "The lot is QUARANTINED"

  # --- Constraint -----------------------------------------------------------
  - id: ERR_DOSE_MASS_MISMATCH
    http: 422
    condition: "dispensed_mg + wasted_mg + returned_mg does not equal ordered_mg"
  - id: ERR_PARTIAL_EXCEEDS_ORDERED
    http: 422
    condition: "The cumulative movement on a dose would exceed ordered_mg"
  - id: ERR_DOSE_TITRATION_TOO_FAST
    http: 422
    condition: "ordered_daily_mg exceeds previous_ordered_daily_mg by more than 10.0 mg"
  - id: ERR_DOSE_EXCEEDS_MEDICATION_CEILING
    http: 422
    condition: "ordered_daily_mg exceeds the program's medication ceiling for this medication"
  - id: ERR_INVALID_DISCHARGE_REASON
    http: 400
    condition: "reason_code is not one of TRANSFER, REGULATORY, NON_PAYMENT, BEHAVIORAL"
  - id: ERR_INVALID_DIAGNOSIS_CODE
    http: 400
    condition: "diagnosis_code is not in the F11 ICD-10 opioid dependence block"
  - id: ERR_JUSTIFICATION_TOO_SHORT
    http: 400
    condition: "clinical_justification, plan_text or outcome_summary is below its declared minimum length"
  - id: ERR_EXCEPTION_CARRIES_EXCEED_CAP
    http: 422
    condition: "granted_carries exceeds the applicable carry-table cap for the patient's time in treatment"
  - id: ERR_TIME_IN_TREATMENT_INSUFFICIENT
    http: 422
    condition: "time_in_treatment_days is below 90 for the non-exception carry path"
  - id: ERR_TIMETABLE_LOOKAHEAD_FAILED
    http: 422
    condition: "timetable_reconciled is false for the day immediately before evaluation"
  - id: ERR_ACTIVE_DENIAL_HISTORY
    http: 422
    condition: "denial_count_12mo exceeds 2"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body, missing required field, wrong type, or an out-of-enum value on any declared enum field"

  # --- Fiscal ---------------------------------------------------------------
  - id: ERR_PROGRAM_CARRY_QUOTA_EXHAUSTED
    http: 402
    condition: "The program's carry pool remainder is zero or negative, so no carry can be granted"
  - id: ERR_INVENTORY_CEILING_EXCEEDED
    http: 402
    condition: "The requested milligrams exceed the selected lot's running_on_hand_mg"
  - id: ERR_NO_ELIGIBLE_LOT
    http: 409
    condition: "The otp_lot_selector candidate set is empty for this dose, medication and source type"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles: &roles
  - name: ProgramAdministrator
    description: "Clinic operations administrator. Owns intake, scheduling, inventory custody, guest-dosing paperwork and corrective-action paperwork. Deliberately has no authority to confirm diagnoses, authorise doses or grant carries."
    identity: "opaque"
    exclusive_operations:
      - "POST /otp/programs — Create a program"
      - "POST /otp/programs/{id}/carry-quota — Open the carry quota ledger"
      - "POST /otp/users — Register a staff member"
      - "POST /otp/inventory-lots — Receive a lot"
      - "POST /otp/inventory-lots/{lotId}/release-quarantine — Release a quarantine"
      - "POST /otp/inventory-lots/{lotId}/destroy — Destroy an emptied lot"
      - "POST /otp/inventory-reconciliations/{period}/close — Close a reconciliation period"
      - "POST /otp/guest-dosing-arrangements — Open a guest arrangement"
      - "POST /otp/guest-dosing-arrangements/{arrangementId}/transmit — Transmit a guest arrangement"
      - "POST /otp/guest-dosing-arrangements/{arrangementId}/close — Close a guest arrangement"
      - "POST /otp/guest-dosing-arrangements/{arrangementId}/cancel — Cancel a guest arrangement"
      - "POST /otp/corrective-actions — Open a corrective action"
      - "POST /otp/corrective-actions/{actionId}/implement — Implement a corrective action"
      - "POST /otp/treatment-plan-reviews — Record a plan review (shared)"
    shared_operations:
      - "POST /otp/dose-dispenses — Schedule a dose"
      - "POST /otp/dose-dispenses/{doseId}/reschedule — Reschedule a dose"
      - "POST /otp/inventory-transactions — Record a manual inventory movement"
      - "POST /otp/inventory-lots/{lotId}/quarantine — Quarantine a lot"
      - "POST /otp/counseling-sessions — Schedule counseling"
      - "POST /otp/diversion-cases — Open a diversion case"
      - "All GET endpoints"

  - name: Physician
    description: "Prescribing physician. Confirms diagnoses, owns dose orders, signs exception requests and plan reviews. Has no inventory custody and cannot grant carries."
    identity: "entity_backed:User"
    exclusive_operations:
      - "POST /otp/patients — Register a patient (shared)"
      - "POST /otp/patients/{patientId}/confirm-diagnosis — Confirm the diagnosis"
      - "POST /otp/patients/{patientId}/discharge — Discharge the patient"
      - "POST /otp/dose-orders — Create a dose order"
      - "POST /otp/dose-orders/{doseOrderId}/activate — Activate a dose order"
      - "POST /otp/dose-orders/{doseOrderId}/suspend — Suspend a dose order"
      - "POST /otp/dose-orders/{doseOrderId}/discontinue — Discontinue a dose order"
      - "POST /otp/take-home-exceptions — Open an exception request"
      - "POST /otp/take-home-exceptions/{exceptionId}/route — Route to the medical director"
      - "POST /otp/dose-dispenses/{doseId}/mark-missed — Mark a dose missed (shared)"
      - "PATCH /otp/patients/{patientId}/treatment-phase — Move treatment phase (shared)"
    shared_operations:
      - "POST /otp/treatment-plan-reviews — Record a plan review"
      - "POST /otp/dose-dispenses/{doseId}/cancel — Cancel a dose"
      - "All GET endpoints"

  - name: Nurse
    description: "Dispensing nurse. Owns the observed-dose pipeline from check-in through dispense, witnesses waste, and acknowledges inbound guest dosing. Cannot verify a dose for a patient outside the nurse's own program."
    identity: "entity_backed:User"
    exclusive_operations:
      - "POST /otp/dose-dispenses — Schedule a dose (shared with the administrator)"
      - "POST /otp/dose-dispenses/{doseId}/check-in — Check in"
      - "POST /otp/dose-dispenses/{doseId}/verify — Verify identity and order"
      - "POST /otp/dose-dispenses/{doseId}/dispense — Thread the dose from inventory"
      - "POST /otp/dose-dispenses/{doseId}/complete — Complete the dose"
      - "POST /otp/dose-dispenses/{doseId}/refuse — Record a refusal"
      - "POST /otp/guest-dosing-arrangements/{arrangementId}/acknowledge — Acknowledge inbound guest dosing"
      - "POST /otp/guest-dosing-arrangements/{arrangementId}/reject — Reject inbound guest dosing"
    shared_operations:
      - "POST /otp/inventory-transactions — Record a manual inventory movement"
      - "POST /otp/dose-dispenses/{doseId}/cancel — Cancel a dose"
      - "POST /otp/dose-dispenses/{doseId}/mark-missed — Mark a dose missed"
      - "POST /otp/diversion-cases — Open a diversion case"
      - "All GET endpoints"

  - name: Counselor
    description: "Counselor. Owns the counseling cadence that feeds the counseling standing dimension. Has no medication, carry or inspection authority."
    identity: "entity_backed:User"
    exclusive_operations:
      - "POST /otp/counseling-sessions — Schedule counseling (shared with the administrator)"
      - "POST /otp/counseling-sessions/{sessionId}/complete — Complete a session with attended minutes"
      - "POST /otp/counseling-sessions/{sessionId}/no-show — Record a no-show"
    shared_operations:
      - "All GET endpoints"

  - name: MedicalDirector
    description: "Medical director. Sole authority to grant or revoke take-home privileges, to decide exception requests and to reinstate a suspended patient. By segregation of duties a director may never decide an exception the director authored."
    identity: "entity_backed:User"
    exclusive_operations:
      - "POST /otp/patients/{patientId}/reinstate — Reinstate a suspended patient"
      - "POST /otp/patients/{patientId}/complete-withdrawal — Close a withdrawal"
      - "POST /otp/take-home-privileges — Open a privilege request"
      - "POST /otp/take-home-privileges/{privilegeId}/evaluate — Evaluate a privilege against the carry tables"
      - "POST /otp/take-home-privileges/{privilegeId}/revoke — Revoke a privilege"
      - "POST /otp/take-home-exceptions/{exceptionId}/decision — Grant or deny an exception"
      - "POST /otp/take-home-exceptions/{exceptionId}/revoke — Revoke an exception"
      - "POST /otp/corrective-actions/{actionId}/cancel — Cancel a corrective action"
    shared_operations:
      - "POST /otp/treatment-plan-reviews — Record a plan review"
      - "PATCH /otp/patients/{patientId}/treatment-phase — Move treatment phase"
      - "All GET endpoints"

  - name: RegulatoryAuditor
    description: "External regulator and diversion-control auditor. Suspends and resumes programs, runs inspections, records findings and drives diversion cases to disposition. Cannot dispense, prescribe or grant carries."
    identity: "opaque"
    exclusive_operations:
      - "POST /otp/programs/{id}/suspend — Suspend a program"
      - "POST /otp/programs/{id}/resume — Resume a program"
      - "POST /otp/inventory-lots/{lotId}/quarantine — Quarantine a lot (shared with the administrator)"
      - "POST /otp/compliance-inspections — Announce an inspection"
      - "POST /otp/compliance-inspections/{inspectionId}/begin — Begin an inspection"
      - "POST /otp/compliance-inspections/{inspectionId}/complete — Complete an inspection"
      - "POST /otp/compliance-inspections/{inspectionId}/cancel — Cancel an inspection"
      - "POST /otp/compliance-findings — Record a finding"
      - "POST /otp/corrective-actions/{actionId}/verify — Verify corrective-action closure"
      - "POST /otp/diversion-cases/{caseId}/begin-review — Begin case review"
      - "POST /otp/diversion-cases/{caseId}/confirm — Confirm diversion"
      - "POST /otp/diversion-cases/{caseId}/unsubstantiate — Unsubstantiate"
      - "POST /otp/diversion-cases/{caseId}/close — Close a case"
      - "POST /otp/take-home-privileges/{privilegeId}/revoke — Revoke a privilege (shared)"
    shared_operations:
      - "POST /otp/inventory-reconciliations/{period}/close — Close a reconciliation period"
      - "POST /otp/_clock/set_current_utc — Drive the logical clock"
      - "All GET endpoints"

# =============================================================================
# §0.5 rule anchors — the nine Difficulty Rules and where they ground
# =============================================================================
difficulty_rule_anchors:
  dual_variant_calc:
    - "stability_score_direction_a vs take_home_readiness_direction_b — different entity domain (Patient read publication vs carry gating)"
    - "otp_dose_tariff per-component vs sum_then_round — different entity domain (DoseDispense charge posting)"
  combinatorial_formula:
    - "carry_cap_waterfall — mode (a), nested min/max over three caps"
    - "otp_dose_tariff — mode (b), nested rounding with the order pinned"
    - "stability_score_direction_b — mode (c), evaluation order pinned against the Direction A channel"
  non_linear_state_machine:
    - "TakeHomePrivilege — cyclic (APPROVED -> REVOKED -> PENDING_REVIEW -> APPROVED)"
    - "Patient — parallel dimensions (counseling_standing x diversion_standing) plus revert arc"
    - "DoseDispense — branching fork-join (ARRIVED_AT_CLINIC -> {NURSE_VERIFIED, VERIFICATION_FAILED, REFUSED, CANCELLED})"
    - "Program — posture_driven"
  transitive_cascade:
    - "diversion confirm depth 3: DiversionCase -> TakeHomePrivilege -> DoseDispense -> InventoryLot"
    - "exception grant depth 4: TakeHomeException -> TakeHomePrivilege -> DoseDispense -> CarryQuotaLedger -> Patient"
    - "dose miss depth 4: DoseDispense -> Patient -> DoseOrder -> DoseDispense(cancel) -> TakeHomeCarryLedger"
    - "inventory destruction depth 3: InventoryLot -> InventoryTransaction -> InventoryLot"
  priority_pair_validation_conflict:
    - "state (priority 7) vs business_safety (priority 8) — a re-activated dose in a FROZEN program"
    - "business_temporal (priority 13) vs business_fiscal (priority 21) — an over-capacity day on an under-stocked inventory"
    - "business_referential (priority 18) vs business_safety (priority 19) — insufficient time in treatment on a below-floor patient"
  boundary_precision_check:
    - "diversion_variance_flag — strict greater-than against max(50, 2 percent)"
    - "take_home_readiness_direction_b — inclusive floor comparison at 70.0 / 75.0"
    - "patient_stability_risk_tier — inclusive >= at 25.0 and 12.0"
    - "NoDoseCapacity — the max_daily_dose_slots occupant count"
  cross_entity_state_dependency:
    - "DoseDispense check-in depends on Program.status (posture FROZEN)"
    - "TakeHomePrivilege evaluation depends on Patient.counseling_standing"
    - "TakeHomeException decision depends on TakeHomePrivilege.decision"
  resource_temporal_overlap:
    - "clinic dose slot occupancy on Program per open day — count semantics with EQUALITY allowed"
    - "daily dose permit uniqueness on Patient per dose_date — adjacency allowed, EQUALITY forbidden"
    - "guest travel window intersection with Program open days — half-open interval semantics"
  compensating_invariant:
    - "C1 carry quota conservation — allotted_carries = granted_carries + available_carries"
    - "C2 carried milligram conservation — carried_issued_mg = carried_voided_mg + carried_consumed_mg + carried_balance_mg"
    - "C3 inventory milligram conservation — reconciled_on_hand_mg = quantity_received_mg + sum(quantity_mg on RECONCILED rows)"
