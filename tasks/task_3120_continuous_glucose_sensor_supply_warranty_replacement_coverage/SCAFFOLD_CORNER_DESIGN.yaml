scaffold_corner_design:
  # ===========================================================================
  # §1.9 — Corner design: enumerative coverage of every testable claim in
  # §1.1–§1.7 not already covered by §1.8 difficulty instances.
  # ===========================================================================

  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: patient_creation_returns_201_with_server_minted_fields
        claim_type: creation
        grounds:
          - "entities.Patient"
        distinguishing_aspect: "POST /cgm/patients with all required fields returns 201 and id/created_at/updated_at/version are server-minted"
        test_recipe:
          setup: ["empty DB; clock at default 2026-09-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - call: "POST /cgm/patients"
              payload: { full_name: "PT1", date_of_birth: "1980-01-01", state_code: "TX" }
              as: PlatformAdmin
              captures: { pt: $.data.id, pt_v: $.data.version }
          assert:
            - "response 201"
            - "Patient.${pt}.version == 1"
            - "Patient.${pt}.status == ACTIVE"

      - name: patient_missing_required_state_code_returns_invalid_request
        claim_type: required_fields
        grounds:
          - "entities.Patient.fields.state_code"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Omitting required state_code produces ERR_INVALID_REQUEST (400)"
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /cgm/patients"
              payload: { full_name: "PT2", date_of_birth: "1980-01-01" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response 400"
            - "error_id == ERR_INVALID_REQUEST"

      - name: patient_default_status_active
        claim_type: defaults
        grounds:
          - "entities.Patient.fields.status"
        distinguishing_aspect: "Omitting status field on creation yields default ACTIVE"
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /cgm/patients"
              payload: { full_name: "PT3", date_of_birth: "1980-01-01", state_code: "NY" }
              as: PlatformAdmin
              captures: { pt: $.data.id }
          assert:
            - "Patient.${pt}.status == ACTIVE"

      - name: sensor_lot_computed_complaint_count_starts_at_zero
        claim_type: computed_fields
        grounds:
          - "entities.SensorLot.fields.complaint_count"
          - "entities.SensorLot.fields.complaint_posture"
        distinguishing_aspect: "New lot has complaint_count=0 and complaint_posture=NORMAL without caller supplying them"
        test_recipe:
          setup: ["PlatformAdmin has created a SensorProduct"]
          setup_api_calls:
            - call: "POST /cgm/sensor-products"
              payload: { sku: "P-C1", generation: 3, wear_days: 14, reader_channel: "HYBRID", compatible_prior_generations: [], list_price_cents: 8900 }
              as: PlatformAdmin
              captures: { prod: $.data.id }
          trigger:
            - call: "POST /cgm/sensor-products/${prod}/sensor-lots"
              payload: { lot_code: "LC1", quantity_manufactured: 5, manufacture_date: "2026-08-01", expiry_date: "2027-08-01" }
              as: PlatformAdmin
              captures: { lot: $.data.id }
          assert:
            - "SensorLot.${lot}.complaint_count == 0"
            - "SensorLot.${lot}.complaint_posture == NORMAL"

      - name: patient_not_found_returns_404
        claim_type: not_found
        grounds:
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET on a non-existent patient UUID returns 404 ERR_NOT_FOUND"
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /cgm/patients/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Any
              captures: { err: $.data.error_id }
          assert:
            - "response 404"
            - "error_id == ERR_NOT_FOUND"

      - name: invalid_enum_value_for_insulin_use_rejected
        claim_type: type_constraints
        grounds:
          - "entities.Prescription.fields.insulin_use"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Prescription with insulin_use='SOMETIMES' (not in enum) returns ERR_INVALID_REQUEST"
        test_recipe:
          setup: ["Patient + Prescriber + Product exist"]
          setup_api_calls:
            - call: "POST /cgm/patients"
              payload: { full_name: "PT4", date_of_birth: "1980-01-01", state_code: "TX" }
              as: PlatformAdmin
              captures: { pt: $.data.id, pt_v: $.data.version }
            - call: "POST /cgm/prescribers"
              payload: { full_name: "DR4", npi: "1234567808", specialty: "ENDOCRINOLOGY" }
              as: PlatformAdmin
              captures: { dr: $.data.id }
            - call: "POST /cgm/sensor-products"
              payload: { sku: "P-C2", generation: 3, wear_days: 14, reader_channel: "HYBRID", compatible_prior_generations: [], list_price_cents: 8900 }
              as: PlatformAdmin
              captures: { prod: $.data.id }
          trigger:
            - call: "POST /cgm/patients/${pt}/prescriptions"
              payload: { prescriber_id: "${dr}", product_id: "${prod}", diagnosis_code: "E11.9", insulin_use: "SOMETIMES", documentation_attached: true, quantity_per_fill: 1, fills_authorized: 12, written_on: "2026-08-15", expected_patient_version: "${pt_v}" }
              as: Prescriber
              as_user_id: "${dr}"
              captures: { err: $.data.error_id }
          assert:
            - "response 400"
            - "error_id == ERR_INVALID_REQUEST"

      - name: patient_list_pagination_default_limit_10
        claim_type: listing
        grounds:
          - "response_envelope.pagination_defaults"
        distinguishing_aspect: "Default pagination limit is 10; has_more correctly reflects total_count"
        test_recipe:
          setup: ["12 patients registered"]
          setup_api_calls:
            - call: "POST /cgm/patients"
              payload: { full_name: "PN1", date_of_birth: "1980-01-01", state_code: "TX" }
              as: PlatformAdmin
            - call: "POST /cgm/patients"
              payload: { full_name: "PN2", date_of_birth: "1980-01-01", state_code: "TX" }
              as: PlatformAdmin
            - call: "POST /cgm/patients"
              payload: { full_name: "PN3", date_of_birth: "1980-01-01", state_code: "TX" }
              as: PlatformAdmin
            - call: "POST /cgm/patients"
              payload: { full_name: "PN4", date_of_birth: "1980-01-01", state_code: "TX" }
              as: PlatformAdmin
            - call: "POST /cgm/patients"
              payload: { full_name: "PN5", date_of_birth: "1980-01-01", state_code: "TX" }
              as: PlatformAdmin
            - call: "POST /cgm/patients"
              payload: { full_name: "PN6", date_of_birth: "1980-01-01", state_code: "TX" }
              as: PlatformAdmin
            - call: "POST /cgm/patients"
              payload: { full_name: "PN7", date_of_birth: "1980-01-01", state_code: "TX" }
              as: PlatformAdmin
            - call: "POST /cgm/patients"
              payload: { full_name: "PN8", date_of_birth: "1980-01-01", state_code: "TX" }
              as: PlatformAdmin
            - call: "POST /cgm/patients"
              payload: { full_name: "PN9", date_of_birth: "1980-01-01", state_code: "TX" }
              as: PlatformAdmin
            - call: "POST /cgm/patients"
              payload: { full_name: "PN10", date_of_birth: "1980-01-01", state_code: "TX" }
              as: PlatformAdmin
            - call: "POST /cgm/patients"
              payload: { full_name: "PN11", date_of_birth: "1980-01-01", state_code: "TX" }
              as: PlatformAdmin
            - call: "POST /cgm/patients"
              payload: { full_name: "PN12", date_of_birth: "1980-01-01", state_code: "TX" }
              as: PlatformAdmin
          trigger:
            - call: "GET /cgm/patients"
              payload: {}
              as: Any
          assert:
            - "response contains exactly 10 items"
            - "total_count == 12"
            - "has_more == true"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: prescription_initial_state_active
        claim_type: initial_state
        grounds:
          - "state_machines.Prescription"
        distinguishing_aspect: "Newly created prescription starts in ACTIVE state"
        test_recipe:
          setup: ["Patient, prescriber, product exist"]
          setup_api_calls:
            - call: "POST /cgm/patients"
              payload: { full_name: "SM1", date_of_birth: "1980-01-01", state_code: "TX" }
              as: PlatformAdmin
              captures: { pt: $.data.id, pt_v: $.data.version }
            - call: "POST /cgm/prescribers"
              payload: { full_name: "DRSM", npi: "1234567809", specialty: "ENDOCRINOLOGY" }
              as: PlatformAdmin
              captures: { dr: $.data.id }
            - call: "POST /cgm/sensor-products"
              payload: { sku: "P-SM1", generation: 3, wear_days: 14, reader_channel: "HYBRID", compatible_prior_generations: [], list_price_cents: 8900 }
              as: PlatformAdmin
              captures: { prod: $.data.id }
          trigger:
            - call: "POST /cgm/patients/${pt}/prescriptions"
              payload: { prescriber_id: "${dr}", product_id: "${prod}", diagnosis_code: "E11.9", insulin_use: "INTENSIVE", documentation_attached: true, quantity_per_fill: 1, fills_authorized: 12, written_on: "2026-08-15", expected_patient_version: "${pt_v}" }
              as: Prescriber
              as_user_id: "${dr}"
              captures: { rx: $.data.id }
          assert:
            - "Prescription.${rx}.status == ACTIVE"

      - name: prescription_terminal_state_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.Prescription"
          - "errors[ERR_PRESCRIPTION_NOT_ACTIVE]"
        distinguishing_aspect: "Once CANCELLED, no further transitions are possible — second cancel rejected"
        test_recipe:
          setup: ["Prescription exists and has been cancelled once"]
          setup_api_calls:
            - call: "POST /cgm/patients"
              payload: { full_name: "SM2", date_of_birth: "1980-01-01", state_code: "TX" }
              as: PlatformAdmin
              captures: { pt: $.data.id, pt_v: $.data.version }
            - call: "POST /cgm/prescribers"
              payload: { full_name: "DRSM2", npi: "1234567810", specialty: "ENDOCRINOLOGY" }
              as: PlatformAdmin
              captures: { dr: $.data.id }
            - call: "POST /cgm/sensor-products"
              payload: { sku: "P-SM2", generation: 3, wear_days: 14, reader_channel: "HYBRID", compatible_prior_generations: [], list_price_cents: 8900 }
              as: PlatformAdmin
              captures: { prod: $.data.id }
            - call: "POST /cgm/patients/${pt}/prescriptions"
              payload: { prescriber_id: "${dr}", product_id: "${prod}", diagnosis_code: "E11.9", insulin_use: "INTENSIVE", documentation_attached: true, quantity_per_fill: 1, fills_authorized: 12, written_on: "2026-08-15", expected_patient_version: "${pt_v}" }
              as: Prescriber
              as_user_id: "${dr}"
              captures: { rx: $.data.id }
            - call: "POST /cgm/prescriptions/${rx}/cancel"
              payload: {}
              as: Prescriber
              as_user_id: "${dr}"
          trigger:
            - call: "POST /cgm/prescriptions/${rx}/cancel"
              payload: {}
              as: Prescriber
              as_user_id: "${dr}"
              captures: { err: $.data.error_id }
          assert:
            - "second cancel rejected with error_id == ERR_PRESCRIPTION_NOT_ACTIVE"

      - name: coverage_verification_decide_twice_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.CoverageVerification"
          - "errors[ERR_VERIFICATION_ALREADY_DECIDED]"
        distinguishing_aspect: "Deciding an already-decided verification returns ERR_VERIFICATION_ALREADY_DECIDED"
        test_recipe:
          setup: ["Verification already APPROVED once"]
          setup_api_calls:
            - call: "POST /cgm/patients"
              payload: { full_name: "SM3", date_of_birth: "1980-01-01", state_code: "TX" }
              as: PlatformAdmin
              captures: { pt: $.data.id, pt_v: $.data.version }
            - call: "POST /cgm/prescribers"
              payload: { full_name: "DRSM3", npi: "1234567811", specialty: "ENDOCRINOLOGY" }
              as: PlatformAdmin
              captures: { dr: $.data.id }
            - call: "POST /cgm/sensor-products"
              payload: { sku: "P-SM3", generation: 3, wear_days: 14, reader_channel: "HYBRID", compatible_prior_generations: [], list_price_cents: 8900 }
              as: PlatformAdmin
              captures: { prod: $.data.id }
            - call: "POST /cgm/payers"
              payload: { name: "PYSM3", plan_code: "PSM3", benefit_route: "PHARMACY", cgm_coverage_policy: "STANDARD", pharmacy_copay_pct: 0.20, dme_coinsurance_pct: 0.0, deductible_cap_cents: 0 }
              as: PlatformAdmin
              captures: { py: $.data.id }
            - call: "POST /cgm/patients/${pt}/prescriptions"
              payload: { prescriber_id: "${dr}", product_id: "${prod}", diagnosis_code: "E11.9", insulin_use: "INTENSIVE", documentation_attached: true, quantity_per_fill: 1, fills_authorized: 12, written_on: "2026-08-15", expected_patient_version: "${pt_v}" }
              as: Prescriber
              as_user_id: "${dr}"
              captures: { rx: $.data.id }
            - call: "POST /cgm/prescriptions/${rx}/coverage-verifications"
              payload: { payer_id: "${py}" }
              as: CoverageReviewer
              captures: { cv: $.data.id }
            - call: "POST /cgm/coverage-verifications/${cv}/decide"
              payload: { decision: "APPROVED" }
              as: CoverageReviewer
          trigger:
            - call: "POST /cgm/coverage-verifications/${cv}/decide"
              payload: { decision: "DENIED", denial_reason: "MISSING_DOCUMENTATION" }
              as: CoverageReviewer
              captures: { err: $.data.error_id }
          assert:
            - "second decide rejected with error_id == ERR_VERIFICATION_ALREADY_DECIDED"

      - name: sensor_order_terminal_delivered_no_further_transitions
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.SensorOrder"
          - "errors[ERR_ORDER_NOT_CANCELLABLE]"
        distinguishing_aspect: "Once DELIVERED, cancel is rejected"
        test_recipe:
          setup: ["Order fully delivered"]
          setup_api_calls:
            - call: "POST /cgm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cgm/patients"
              payload: { full_name: "SM4", date_of_birth: "1980-01-01", state_code: "TX" }
              as: PlatformAdmin
              captures: { pt: $.data.id, pt_v: $.data.version }
            - call: "POST /cgm/prescribers"
              payload: { full_name: "DRSM4", npi: "1234567812", specialty: "ENDOCRINOLOGY" }
              as: PlatformAdmin
              captures: { dr: $.data.id }
            - call: "POST /cgm/sensor-products"
              payload: { sku: "P-SM4", generation: 3, wear_days: 14, reader_channel: "HYBRID", compatible_prior_generations: [], list_price_cents: 8900 }
              as: PlatformAdmin
              captures: { prod: $.data.id }
            - call: "POST /cgm/sensor-products/${prod}/sensor-lots"
              payload: { lot_code: "LSM4", quantity_manufactured: 10, manufacture_date: "2026-08-01", expiry_date: "2027-08-01" }
              as: PlatformAdmin
              captures: { lot: $.data.id }
            - call: "POST /cgm/sensor-lots/${lot}/sensor-units"
              payload: { serial_number: "SN-SM4" }
              as: PlatformAdmin
            - call: "POST /cgm/payers"
              payload: { name: "PYSM4", plan_code: "PSM4", benefit_route: "PHARMACY", cgm_coverage_policy: "STANDARD", pharmacy_copay_pct: 0.20, dme_coinsurance_pct: 0.0, deductible_cap_cents: 0 }
              as: PlatformAdmin
              captures: { py: $.data.id }
            - call: "POST /cgm/patients/${pt}/prescriptions"
              payload: { prescriber_id: "${dr}", product_id: "${prod}", diagnosis_code: "E11.9", insulin_use: "INTENSIVE", documentation_attached: true, quantity_per_fill: 1, fills_authorized: 12, written_on: "2026-08-15", expected_patient_version: "${pt_v}" }
              as: Prescriber
              as_user_id: "${dr}"
              captures: { rx: $.data.id }
            - call: "POST /cgm/prescriptions/${rx}/coverage-verifications"
              payload: { payer_id: "${py}" }
              as: CoverageReviewer
              captures: { cv: $.data.id }
            - call: "POST /cgm/coverage-verifications/${cv}/decide"
              payload: { decision: "APPROVED" }
              as: CoverageReviewer
            - call: "POST /cgm/patients/${pt}/sensor-orders"
              payload: { prescription_id: "${rx}", coverage_verification_id: "${cv}", lot_id: "${lot}", quantity: 1 }
              as: FulfillmentAgent
              captures: { ord: $.data.id, ord_v: $.data.version }
            - call: "POST /cgm/sensor-orders/${ord}/adjudicate"
              payload: { expected_order_version: "${ord_v}" }
              as: BillingAgent
            - call: "POST /cgm/sensor-orders/${ord}/pick"
              payload: {}
              as: FulfillmentAgent
            - call: "POST /cgm/sensor-orders/${ord}/ship"
              payload: {}
              as: FulfillmentAgent
            - call: "POST /cgm/sensor-orders/${ord}/deliver"
              payload: {}
              as: FulfillmentAgent
          trigger:
            - call: "POST /cgm/sensor-orders/${ord}/cancel"
              payload: {}
              as: FulfillmentAgent
              captures: { err: $.data.error_id }
          assert:
            - "cancel on DELIVERED order rejected with error_id == ERR_ORDER_NOT_CANCELLABLE"

      - name: warranty_claim_begin_review_rejected_when_device_data_missing
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.WarrantyClaim.SUBMITTED_to_DATA_REVIEW"
          - "errors[ERR_DEVICE_DATA_REQUIRED]"
        distinguishing_aspect: "begin-review requires device_data_attached=true; without it ERR_DEVICE_DATA_REQUIRED"
        test_recipe:
          setup: ["Warranty claim with device_data_attached=false"]
          setup_api_calls:
            - call: "POST /cgm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cgm/patients"
              payload: { full_name: "SM5", date_of_birth: "1980-01-01", state_code: "TX" }
              as: PlatformAdmin
              captures: { pt: $.data.id, pt_v: $.data.version }
            - call: "POST /cgm/prescribers"
              payload: { full_name: "DRSM5", npi: "1234567813", specialty: "ENDOCRINOLOGY" }
              as: PlatformAdmin
              captures: { dr: $.data.id }
            - call: "POST /cgm/sensor-products"
              payload: { sku: "P-SM5", generation: 3, wear_days: 14, reader_channel: "HYBRID", compatible_prior_generations: [], list_price_cents: 8900 }
              as: PlatformAdmin
              captures: { prod: $.data.id }
            - call: "POST /cgm/sensor-products/${prod}/sensor-lots"
              payload: { lot_code: "LSM5", quantity_manufactured: 10, manufacture_date: "2026-08-01", expiry_date: "2027-08-01" }
              as: PlatformAdmin
              captures: { lot: $.data.id }
            - call: "POST /cgm/sensor-lots/${lot}/sensor-units"
              payload: { serial_number: "SN-SM5" }
              as: PlatformAdmin
              captures: { u1: $.data.id }
            - call: "POST /cgm/payers"
              payload: { name: "PYSM5", plan_code: "PSM5", benefit_route: "PHARMACY", cgm_coverage_policy: "STANDARD", pharmacy_copay_pct: 0.20, dme_coinsurance_pct: 0.0, deductible_cap_cents: 0 }
              as: PlatformAdmin
              captures: { py: $.data.id }
            - call: "POST /cgm/patients/${pt}/prescriptions"
              payload: { prescriber_id: "${dr}", product_id: "${prod}", diagnosis_code: "E11.9", insulin_use: "INTENSIVE", documentation_attached: true, quantity_per_fill: 1, fills_authorized: 12, written_on: "2026-08-15", expected_patient_version: "${pt_v}" }
              as: Prescriber
              as_user_id: "${dr}"
              captures: { rx: $.data.id }
            - call: "POST /cgm/prescriptions/${rx}/coverage-verifications"
              payload: { payer_id: "${py}" }
              as: CoverageReviewer
              captures: { cv: $.data.id }
            - call: "POST /cgm/coverage-verifications/${cv}/decide"
              payload: { decision: "APPROVED" }
              as: CoverageReviewer
            - call: "POST /cgm/patients/${pt}/sensor-orders"
              payload: { prescription_id: "${rx}", coverage_verification_id: "${cv}", lot_id: "${lot}", quantity: 1 }
              as: FulfillmentAgent
              captures: { ord: $.data.id, ord_v: $.data.version }
            - call: "POST /cgm/sensor-orders/${ord}/adjudicate"
              payload: { expected_order_version: "${ord_v}" }
              as: BillingAgent
            - call: "POST /cgm/sensor-orders/${ord}/pick"
              payload: {}
              as: FulfillmentAgent
            - call: "POST /cgm/sensor-orders/${ord}/ship"
              payload: {}
              as: FulfillmentAgent
            - call: "POST /cgm/sensor-orders/${ord}/deliver"
              payload: {}
              as: FulfillmentAgent
            - call: "POST /cgm/patients/${pt}/device-bindings"
              payload: { sensor_unit_id: "${u1}", channel: "READER" }
              as: Patient
              as_user_id: "${pt}"
            - call: "POST /cgm/sensor-units/${u1}/report-early-failure"
              payload: {}
              as: Patient
              as_user_id: "${pt}"
            - call: "POST /cgm/sensor-units/${u1}/warranty-claims"
              payload: { reported_failure_day_index: 3, failure_category: "SENSOR_ERROR", device_data_attached: false }
              as: Patient
              as_user_id: "${pt}"
              captures: { wc: $.data.id }
          trigger:
            - call: "POST /cgm/warranty-claims/${wc}/begin-review"
              payload: {}
              as: WarrantyReviewer
              captures: { err: $.data.error_id }
          assert:
            - "begin-review rejected with error_id == ERR_DEVICE_DATA_REQUIRED"

  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: lot_complaint_posture_inclusive_threshold_watch
        claim_type: correct_result
        grounds:
          - "calculations.lot_complaint_posture_rule"
        distinguishing_aspect: "complaint_count == 3 lands in WATCH (>= boundary is inclusive)"
        test_recipe:
          setup: ["Lot with 3 CLOSED_SUBSTANTIATED AERs"]
          setup_api_calls:
            - call: "POST /cgm/patients"
              payload: { full_name: "CAL1", date_of_birth: "1980-01-01", state_code: "TX" }
              as: PlatformAdmin
              captures: { pt: $.data.id }
            - call: "POST /cgm/sensor-products"
              payload: { sku: "P-CAL1", generation: 3, wear_days: 14, reader_channel: "HYBRID", compatible_prior_generations: [], list_price_cents: 8900 }
              as: PlatformAdmin
              captures: { prod: $.data.id }
            - call: "POST /cgm/sensor-products/${prod}/sensor-lots"
              payload: { lot_code: "LCAL1", quantity_manufactured: 10, manufacture_date: "2026-08-01", expiry_date: "2027-08-01" }
              as: PlatformAdmin
              captures: { lot: $.data.id }
            - call: "POST /cgm/sensor-lots/${lot}/sensor-units"
              payload: { serial_number: "SN-CAL1A" }
              as: PlatformAdmin
              captures: { u1: $.data.id }
            - call: "POST /cgm/sensor-lots/${lot}/sensor-units"
              payload: { serial_number: "SN-CAL1B" }
              as: PlatformAdmin
              captures: { u2: $.data.id }
            - call: "POST /cgm/sensor-lots/${lot}/sensor-units"
              payload: { serial_number: "SN-CAL1C" }
              as: PlatformAdmin
              captures: { u3: $.data.id }
            - call: "POST /cgm/sensor-lots/${lot}/adverse-event-reports"
              payload: { sensor_unit_id: "${u1}", patient_id: "${pt}", severity: "HIGH", event_type: "SKIN_IRRITATION" }
              as: QualityEngineer
