# =============================================================================
# Pet Food Subscription Box — SCAFFOLD.yaml
# §1.0 Response Envelope through §1.7 RBAC Matrix
# (Difficulty design lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml — sibling file.)
# =============================================================================

scenario: |
  Pet food subscription box: pet profile (breed / allergies / preferences) with
  species and breed, age and weight, activity level, allergy and intolerance
  list, dietary preference and aversion, health-condition tags
  (kidney/diabetes/dental), and pet-photo gallery; subscription plan
  customization with delivery-frequency configuration (weekly/biweekly/monthly),
  portion-size calculation based on weight and activity, multi-pet households
  handling, plan-modification window, and trial-pack option; recipe
  recommendation with formula-database (protein/grain/supplement composition),
  nutritional-requirement matching by life stage, allergen exclusion,
  vet-prescribed-diet flagging, ingredient-rotation rules to avoid monotony,
  and recommendation-explanation surfacing; order generation and shipping with
  cycle-based order auto-creation, pre-shipment confirmation window,
  shipping-address verification, batch-and-expiration-date assignment from
  inventory, multi-warehouse fulfillment routing, and tracking-number sync;
  skip / pause / cancel with skip-cycle button with deadline, pause-with-duration
  option, cancel-with-reason survey, retention-offer rules, and reactivation
  workflow; feedback-driven recipe adjustment with per-shipment feedback
  collection (palatability/stool quality/coat condition/weight change),
  structured feedback aggregation, adjustment-suggestion engine,
  vet-consultation escalation for adverse signals, and adjustment-history
  archiving on the pet profile; event-driven synchronization with payment,
  logistics, IM, and veterinary-consultation systems; audit logging for plan
  changes and feedback-driven adjustments.

domain_name: pet-food-subscription
api_prefix: /subscriptions

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: event_sourcing
  complexity_layers:
    - cascading_side_effects
    - scheduled_deferred_actions
    - selector_policy
    - dual_variant_calculation

  entity_topology: hybrid
  state_machine_shape: parallel       # Subscription has cyclic; Order carries parallel payment × fulfillment
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: saga

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  # ----- Customer (account-holder; persisted user) -----
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Account email; unique per Customer" }
      - { name: display_name, type: string, source: input, description: "Customer display name" }
      - { name: default_shipping_address, type: object, source: input,
          description: "Shape: {line1, line2?, city, region, postal_code, country, verified}; verified=false until address verification call",
          constraints: "country in ISO 3166-1 alpha-2" }
      - { name: total_charged_cents, type: integer, source: computed,
          description: "Running sum of all cents charged across this Customer's Orders (Payment events)" }
      - { name: total_refunded_cents, type: integer, source: computed,
          description: "Running sum of all cents refunded across this Customer's Orders (compensation events)" }

  # ----- Pet (profile under a Customer) -----
  - name: Pet
    parent: Customer
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: system, description: "Owning Customer.id" }
      - { name: name, type: string, source: input, description: "Pet display name" }
      - { name: species, type: enum, source: input,
          description: "Species tag", constraints: "DOG | CAT" }
      - { name: breed, type: string, source: input, description: "Free-text breed label" }
      - { name: birthdate, type: string, source: input,
          description: "ISO date YYYY-MM-DD; used to derive life_stage" }
      - { name: weight_kg, type: number, source: input,
          description: "Current weight in kilograms; > 0; updated by feedback weight_change",
          constraints: "0 < weight_kg <= 100" }
      - { name: activity_level, type: enum, source: input,
          description: "Drives portion calculation",
          constraints: "LOW | MODERATE | HIGH" }
      - { name: allergies, type: array, source: input,
          description: "Array of allergen tokens, e.g. CHICKEN, BEEF, FISH, GRAIN, DAIRY, EGG, SOY" }
      - { name: intolerances, type: array, source: input,
          description: "Array of intolerance tokens (same vocabulary as allergies; treated less strictly)" }
      - { name: dietary_preferences, type: array, source: input,
          description: "Preferred ingredient tokens (positive list)" }
      - { name: dietary_aversions, type: array, source: input,
          description: "Disliked ingredient tokens (negative-soft list; penalize score, do not block)" }
      - { name: health_conditions, type: array, source: input,
          description: "Subset of {KIDNEY, DIABETES, DENTAL}; gates vet-prescribed-diet flagging" }
      - { name: life_stage, type: enum, source: computed,
          description: "Derived from species + age_months; recomputed on Pet write and on _clock advance",
          constraints: "PUPPY_KITTEN | ADULT | SENIOR" }
      - { name: photo_gallery, type: array, source: system,
          description: "Append-only array of {photo_id, url, uploaded_at}" }
      - { name: status, type: enum, source: system,
          description: "ACTIVE | VET_HOLD | ARCHIVED",
          default: "ACTIVE" }
      - { name: adjustment_history, type: array, source: system,
          description: "Append-only summaries of every RecipeAdjustment whose status flipped to APPLIED for this pet; each entry {adjustment_id, applied_at, summary}" }

  # ----- Subscription (one per Pet OR aggregating multiple Pets in same household plan) -----
  - name: Subscription
    parent: Customer
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: system, description: "Owning Customer.id" }
      - { name: pet_ids, type: array, source: input,
          description: "Non-empty list of Pet.id values; multi-pet households allowed; all pets MUST belong to customer_id",
          constraints: "min length 1; unique values" }
      - { name: frequency, type: enum, source: input,
          description: "Delivery cadence",
          constraints: "WEEKLY | BIWEEKLY | MONTHLY" }
      - { name: cycle_days, type: integer, source: computed,
          description: "Derived: WEEKLY=7, BIWEEKLY=14, MONTHLY=30" }
      - { name: shipping_address, type: object, source: input,
          description: "Same shape as Customer.default_shipping_address; copied at create; verified flag" }
      - { name: is_trial, type: boolean, source: input, default: false,
          description: "If true, the FIRST order is a discounted trial pack and frequency is forced to a single one-off cycle" }
      - { name: status, type: enum, source: system,
          description: "DRAFT | ACTIVE | PAUSED | CANCELLED | REACTIVATING",
          default: "DRAFT" }
      - { name: paused_until, type: datetime, source: system,
          description: "Set when transitioning ACTIVE→PAUSED; null otherwise; auto-resume when _clock advances past this point" }
      - { name: cancel_reason, type: enum, source: system,
          description: "Set when CANCELLED",
          constraints: "PRICE | QUALITY | PET_NO_LONGER | OTHER | null" }
      - { name: retention_offer_applied, type: boolean, source: system, default: false,
          description: "True once an automatic retention offer was issued during cancel flow" }
      - { name: scheduled_order_count, type: integer, source: computed, default: 0,
          description: "Total Orders the cycle scheduler has emitted for this subscription (excluding skipped)" }
      - { name: skipped_count, type: integer, source: computed, default: 0,
          description: "Count of cycles skipped via skip endpoint" }
      - { name: total_cycles_elapsed, type: integer, source: computed, default: 0,
          description: "Conserved invariant: scheduled_order_count + skipped_count == total_cycles_elapsed at all times" }
      - { name: modification_deadline_hours, type: integer, source: system, default: 48,
          description: "Hours before an Order's scheduled_ship_at during which plan modifications and skip are still permitted" }
      - { name: next_cycle_at, type: datetime, source: computed,
          description: "Wall-clock when next Order will be auto-created; null if PAUSED/CANCELLED" }

  # ----- Recipe (configuration catalog; immutable per-version) -----
  - name: Recipe
    parent: null
    common_fields: false   # immutable catalog: only id + created_at
    fields:
      - { name: code, type: string, source: input, description: "Stable human code, e.g. SALMON-ADULT-GRAIN-FREE" }
      - { name: target_species, type: enum, source: input,
          constraints: "DOG | CAT",
          description: "Species this recipe is formulated for" }
      - { name: target_life_stage, type: enum, source: input,
          constraints: "PUPPY_KITTEN | ADULT | SENIOR | ALL",
          description: "Eligible life stage; ALL matches every stage" }
      - { name: protein_sources, type: array, source: input,
          description: "Ingredient tokens, e.g. [CHICKEN, EGG]" }
      - { name: grain_sources, type: array, source: input,
          description: "Ingredient tokens; empty for grain-free" }
      - { name: supplement_sources, type: array, source: input,
          description: "Ingredient tokens, e.g. [OMEGA3, GLUCOSAMINE]" }
      - { name: kcal_per_gram, type: number, source: input,
          description: "Energy density; used by portion calculation",
          constraints: "0 < kcal_per_gram <= 10" }
      - { name: unit_price_cents_per_100g, type: integer, source: input,
          description: "Price in cents per 100 grams of finished food; drives Order.items[].line_total_cents",
          constraints: ">= 1" }
      - { name: vet_prescribed, type: boolean, source: input, default: false,
          description: "If true, recipe may only be applied when a Pet carries a matching health_condition" }
      - { name: prescribed_for, type: array, source: input,
          description: "Required-condition tokens when vet_prescribed=true; subset of {KIDNEY, DIABETES, DENTAL}" }
      - { name: monotony_class, type: string, source: input,
          description: "Rotation grouping label; two consecutive shipments to the same Pet MUST NOT share monotony_class" }
      - { name: trial_eligible, type: boolean, source: input, default: true,
          description: "Whether the recipe can be used for a trial-pack order" }

  # ----- RecipeRecommendation (snapshot tied to a Subscription cycle; immutable once frozen) -----
  - name: RecipeRecommendation
    parent: Subscription
    common_fields: true
    fields:
      - { name: subscription_id, type: string, source: system, description: "Owning Subscription" }
      - { name: pet_id, type: string, source: system, description: "Specific Pet within subscription" }
      - { name: cycle_index, type: integer, source: system, description: "Which cycle (1-based)" }
      - { name: recipe_id, type: string, source: computed,
          description: "Selected Recipe.id by selector policy in §1.3 recipe_selector" }
      - { name: match_score, type: number, source: computed,
          description: "Score in [0, 100]; tie-break sort key" }
      - { name: explanation, type: array, source: computed,
          description: "Append-only ordered tokens explaining why this recipe was chosen (e.g. LIFE_STAGE_MATCH, ALLERGEN_CLEAR, PREFERRED_PROTEIN_HIT, ROTATION_OK)" }
      - { name: status, type: enum, source: system,
          description: "FROZEN once Order generated; SUPERSEDED if regenerated before order generation",
          constraints: "PENDING | FROZEN | SUPERSEDED",
          default: "PENDING" }

  # ----- Warehouse (fulfillment node + inventory capacity) -----
  - name: Warehouse
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique warehouse code, e.g. WH-EAST" }
      - { name: serves_regions, type: array, source: input,
          description: "Region tokens this warehouse can ship to; selector matches on shipping_address.region" }
      - { name: priority_rank, type: integer, source: input,
          description: "Smaller is preferred when multiple warehouses serve a region",
          constraints: "1..100" }
      - { name: daily_outbound_capacity, type: integer, source: input,
          description: "Max Orders that may carry scheduled_ship_at on the same UTC day from this warehouse",
          constraints: ">= 1" }
      - { name: status, type: enum, source: system,
          description: "ONLINE | OFFLINE; OFFLINE warehouses are excluded from routing",
          default: "ONLINE" }

  # ----- InventoryLot (batch + expiration per (warehouse, recipe)) -----
  - name: InventoryLot
    parent: Warehouse
    common_fields: true
    fields:
      - { name: warehouse_id, type: string, source: system, description: "Holding warehouse" }
      - { name: recipe_id, type: string, source: input, description: "Recipe this lot stocks" }
      - { name: batch_code, type: string, source: input, description: "Manufacturer batch code; uniqueness per (warehouse_id, recipe_id, batch_code)" }
      - { name: expiration_date, type: string, source: input, description: "ISO date; lot is unusable on or after this date" }
      - { name: quantity_grams, type: integer, source: input,
          description: "Grams currently available; decremented on Order shipment; never below 0",
          constraints: ">= 0" }

  # ----- Order (cycle-scheduled fulfillment unit; parallel state dimensions) -----
  - name: Order
    parent: Subscription
    common_fields: true
    fields:
      - { name: subscription_id, type: string, source: system }
      - { name: customer_id, type: string, source: system, description: "Denormalized for query" }
      - { name: cycle_index, type: integer, source: system, description: "1-based cycle number this Order represents" }
      - { name: scheduled_ship_at, type: datetime, source: system,
          description: "When the cycle was placed for shipment; modification_deadline is scheduled_ship_at - subscription.modification_deadline_hours" }
      - { name: items, type: array, source: computed,
          description: "Array of {pet_id, recipe_id, portion_grams_per_day, total_grams, unit_price_cents, line_total_cents}; one element per pet in subscription.pet_ids" }
      - { name: warehouse_id, type: string, source: computed,
          description: "Selected by warehouse_selector at confirmation time" }
      - { name: assigned_lots, type: array, source: computed,
          description: "Array of {item_index, lot_id, batch_code, expiration_date, grams_drawn}; assigned at confirmation" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of items[].line_total_cents" }
      - { name: shipping_fee_cents, type: integer, source: computed, description: "From shipping_fee calc" }
      - { name: total_cents, type: integer, source: computed, description: "subtotal_cents + shipping_fee_cents" }
      - { name: payment_status, type: enum, source: system,
          description: "Parallel dimension: PENDING | PAID | REFUNDED | FAILED",
          default: "PENDING" }
      - { name: fulfillment_status, type: enum, source: system,
          description: "Parallel dimension: SCHEDULED | CONFIRMED | SKIPPED | SHIPPED | DELIVERED | CANCELLED",
          default: "SCHEDULED" }
      - { name: tracking_number, type: string, source: system,
          description: "Synced from logistics event; null until SHIPPED" }
      - { name: shipping_address_snapshot, type: object, source: system,
          description: "Snapshot of Subscription.shipping_address at confirmation; verified flag must be true" }
      - { name: is_trial_pack, type: boolean, source: system, default: false,
          description: "True if this Order is the trial-pack order" }

  # ----- ShipmentFeedback (per-Order feedback record) -----
  - name: ShipmentFeedback
    parent: Order
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system }
      - { name: pet_id, type: string, source: input, description: "Which pet this feedback relates to; must belong to subscription.pet_ids" }
      - { name: palatability, type: integer, source: input,
          description: "1..5 (1=refused, 5=loved)",
          constraints: "1..5" }
      - { name: stool_quality, type: integer, source: input,
          description: "1..5 (1=poor, 5=ideal)",
          constraints: "1..5" }
      - { name: coat_condition, type: integer, source: input,
          description: "1..5",
          constraints: "1..5" }
      - { name: weight_change_grams, type: integer, source: input,
          description: "Signed integer; applied to Pet.weight_kg on submission (divided by 1000)" }
      - { name: notes, type: string, source: input, description: "Optional free-text" }
      - { name: adverse_flag, type: boolean, source: computed,
          description: "True if palatability <= 2 OR stool_quality <= 2; surfaces vet-consult escalation" }

  # ----- RecipeAdjustment (suggestion engine output; staged then applied) -----
  - name: RecipeAdjustment
    parent: Pet
    common_fields: true
    fields:
      - { name: pet_id, type: string, source: system }
      - { name: subscription_id, type: string, source: system }
      - { name: based_on_feedback_ids, type: array, source: system,
          description: "Feedback ids that fed the aggregation that produced this suggestion" }
      - { name: suggestion_type, type: enum, source: computed,
          description: "ROTATE_PROTEIN | INCREASE_PORTION | DECREASE_PORTION | SWAP_RECIPE_FAMILY | VET_ESCALATE",
          constraints: "five enum values exhaustively produced by suggestion_engine" }
      - { name: target_recipe_id, type: string, source: computed,
          description: "For SWAP_RECIPE_FAMILY suggestions; null otherwise" }
      - { name: portion_delta_pct, type: integer, source: computed,
          description: "Percentage change; signed; null when suggestion_type not INCREASE/DECREASE_PORTION" }
      - { name: status, type: enum, source: system,
          description: "SUGGESTED | APPLIED | DISMISSED | VET_PENDING | VET_APPROVED | VET_REJECTED",
          default: "SUGGESTED" }
      - { name: applied_at, type: datetime, source: system, description: "Set when status→APPLIED" }
      - { name: rationale, type: array, source: computed,
          description: "Ordered tokens explaining why this adjustment was generated" }

  # ----- AuditLog (append-only event log of plan changes & adjustments) -----
  - name: AuditLog
    parent: null
    common_fields: false  # immutable append-only
    fields:
      - { name: actor_role, type: string, source: system, description: "Role of the principal causing the change" }
      - { name: actor_id, type: string, source: system, description: "X-User-ID of the principal" }
      - { name: entity_type, type: string, source: system, description: "Subscription | Pet | RecipeAdjustment | Order" }
      - { name: entity_id, type: string, source: system }
      - { name: event_type, type: string, source: system,
          description: "PLAN_MODIFIED | SKIPPED | PAUSED | RESUMED | CANCELLED | REACTIVATED | ADJUSTMENT_APPLIED | ADJUSTMENT_DISMISSED | VET_ESCALATED" }
      - { name: before, type: object, source: system, description: "Snapshot of mutated fields before" }
      - { name: after, type: object, source: system, description: "Snapshot of mutated fields after" }
      - { name: ts, type: datetime, source: system, description: "Logical clock time at write" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ----- Subscription (CYCLIC: ACTIVE ↔ PAUSED, plus CANCELLED→REACTIVATING→ACTIVE) -----
  - entity: Subscription
    initial_state: DRAFT
    terminal_states: []     # no terminal — CANCELLED can be reactivated
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /subscriptions/{subId}/activate"
        actor: Customer
        preconditions:
          - "Subscription.shipping_address.verified == true (ERR_ADDRESS_NOT_VERIFIED)"
          - "Every Pet in pet_ids has status == ACTIVE (ERR_PET_NOT_ACTIVE)"
        side_effects:
          - "next_cycle_at := now + cycle_days"
          - "Compute initial RecipeRecommendation per pet (status PENDING)"
          - "AuditLog event PLAN_MODIFIED appended"
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /subscriptions/{subId}/pause"
        actor: Customer
        preconditions:
          - "Subscription.status == ACTIVE (ERR_INVALID_SUBSCRIPTION_STATE)"
          - "No Order currently in SHIPPED-but-not-DELIVERED fulfillment state for this subscription (ERR_PAUSE_BLOCKED_IN_TRANSIT)"
          - "pause_until > now (ERR_INVALID_PAUSE_WINDOW)"
          - "Pause window [now, pause_until) must not overlap an existing pause window for this subscription (ERR_PAUSE_WINDOW_OVERLAP) — half-open interval"
        side_effects:
          - "paused_until := request.pause_until"
          - "next_cycle_at := null"
          - "All SCHEDULED+PENDING Orders for this subscription with scheduled_ship_at < paused_until → fulfillment_status=CANCELLED, payment_status remains PENDING"
          - "AuditLog event PAUSED appended"
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /_clock/advance (now >= paused_until) OR POST /subscriptions/{subId}/resume"
        actor: system | Customer
        preconditions:
          - "Subscription.status == PAUSED (ERR_INVALID_SUBSCRIPTION_STATE)"
        side_effects:
          - "paused_until := null"
          - "next_cycle_at := now + cycle_days"
          - "AuditLog event RESUMED appended"
      - from: [ACTIVE, PAUSED]
        to: CANCELLED
        trigger: "POST /subscriptions/{subId}/cancel"
        actor: Customer
        preconditions:
          - "cancel_reason in {PRICE, QUALITY, PET_NO_LONGER, OTHER} (ERR_INVALID_CANCEL_REASON)"
        side_effects:
          - "If cancel_reason == PRICE AND retention_offer_applied == false: retention_offer_applied := true, status remains ACTIVE/PAUSED, transition aborted with HTTP 200 returning the offer (a single one-cycle 50% discount) — caller may re-POST to force cancellation"
          - "Otherwise: status := CANCELLED, next_cycle_at := null"
          - "All non-terminal Orders for this subscription → fulfillment_status=CANCELLED (parallel dimension; payment_status untouched)"
          - "All PENDING/FROZEN RecipeRecommendations for this subscription → SUPERSEDED"
          - "AuditLog event CANCELLED appended"
      - from: CANCELLED
        to: REACTIVATING
        trigger: "POST /subscriptions/{subId}/reactivate"
        actor: Customer
        preconditions:
          - "Subscription.status == CANCELLED (ERR_INVALID_SUBSCRIPTION_STATE)"
          - "All pets in pet_ids still exist with status == ACTIVE (ERR_PET_NOT_ACTIVE)"
        side_effects:
          - "Customer must re-verify shipping address before next ACTIVE transition"
      - from: REACTIVATING
        to: ACTIVE
        trigger: "POST /subscriptions/{subId}/activate (second activate after reactivate)"
        actor: Customer
        preconditions:
          - "Subscription.shipping_address.verified == true (ERR_ADDRESS_NOT_VERIFIED)"
        side_effects:
          - "next_cycle_at := now + cycle_days"
          - "retention_offer_applied := false (reset for a new lifecycle)"
          - "AuditLog event REACTIVATED appended"

  # ----- Order — parallel dimensions: payment_status × fulfillment_status -----
  - entity: Order
    field: payment_status
    initial_state: PENDING
    terminal_states: [REFUNDED]
    transitions:
      - from: PENDING
        to: PAID
        trigger: "POST /orders/{orderId}/events/payment (event_type=PAYMENT_CAPTURED)"
        actor: system
        preconditions:
          - "fulfillment_status in {SCHEDULED, CONFIRMED} (ERR_INVALID_ORDER_STATE)"
        side_effects:
          - "Customer.total_charged_cents += Order.total_cents"
      - from: PENDING
        to: FAILED
        trigger: "POST /orders/{orderId}/events/payment (event_type=PAYMENT_FAILED)"
        actor: system
        preconditions: []
        side_effects:
          - "fulfillment_status := CANCELLED if fulfillment_status in {SCHEDULED, CONFIRMED}"
      - from: PAID
        to: REFUNDED
        trigger: "POST /orders/{orderId}/events/payment (event_type=PAYMENT_REFUNDED) — system, after fulfillment_status=CANCELLED on a PAID order"
        actor: system
        preconditions:
          - "fulfillment_status == CANCELLED (ERR_INVALID_ORDER_STATE)"
        side_effects:
          - "Customer.total_refunded_cents += Order.total_cents"

  - entity: Order
    field: fulfillment_status
    initial_state: SCHEDULED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CONFIRMED
        trigger: "POST /orders/{orderId}/confirm (Customer) OR _clock advance past (scheduled_ship_at - modification_deadline_hours) auto-confirms"
        actor: Customer | system
        preconditions:
          - "Subscription.status == ACTIVE (ERR_INVALID_SUBSCRIPTION_STATE)"
          - "shipping_address_snapshot.verified == true (ERR_ADDRESS_NOT_VERIFIED)"
          - "Warehouse selector returns a non-empty candidate set (ERR_NO_WAREHOUSE_AVAILABLE)"
          - "All items assigned non-expired InventoryLot with sufficient quantity (ERR_INSUFFICIENT_INVENTORY)"
        side_effects:
          - "warehouse_id := warehouse_selector output"
          - "assigned_lots := lot_selector output"
          - "InventoryLot.quantity_grams decremented per item's total_grams"
          - "Warehouse daily_outbound_capacity for scheduled_ship_at UTC date debited by 1"
      - from: SCHEDULED
        to: SKIPPED
        trigger: "POST /orders/{orderId}/skip"
        actor: Customer
        preconditions:
          - "now < scheduled_ship_at - modification_deadline_hours (ERR_MODIFICATION_DEADLINE_PASSED)"
        side_effects:
          - "Subscription.scheduled_order_count -= 1 (the just-generated order is no longer counted as scheduled)"
          - "Subscription.skipped_count += 1"
          - "Subscription.total_cycles_elapsed is UNCHANGED (the cycle was already counted at generation time)"
          - "Subscription.next_cycle_at := next_cycle_at + cycle_days"
          - "AuditLog event SKIPPED appended"
      - from: CONFIRMED
        to: SHIPPED
        trigger: "POST /orders/{orderId}/events/logistics (event_type=SHIPMENT_DISPATCHED)"
        actor: system
        preconditions:
          - "payment_status == PAID (ERR_INVALID_ORDER_STATE)"
        side_effects:
          - "tracking_number := event.tracking_number"
      - from: SHIPPED
        to: DELIVERED
        trigger: "POST /orders/{orderId}/events/logistics (event_type=DELIVERY_CONFIRMED)"
        actor: system
        preconditions: []
        side_effects:
          - "Opens feedback collection window for this Order"
      - from: [SCHEDULED, CONFIRMED]
        to: CANCELLED
        trigger: "system (subscription pause/cancel cascade) OR payment_status=FAILED cascade"
        actor: system
        preconditions: []
        side_effects:
          - "If assigned_lots non-empty: restore InventoryLot.quantity_grams"
          - "If warehouse_id set: refund warehouse daily_outbound_capacity"

  # ----- RecipeAdjustment lifecycle -----
  - entity: RecipeAdjustment
    initial_state: SUGGESTED
    terminal_states: [APPLIED, DISMISSED, VET_REJECTED]
    transitions:
      - from: SUGGESTED
        to: APPLIED
        trigger: "POST /pets/{petId}/recipe-adjustments/{adjId}/apply"
        actor: Customer
        preconditions:
          - "RecipeAdjustment.status == SUGGESTED (ERR_INVALID_ADJUSTMENT_STATE)"
          - "RecipeAdjustment.suggestion_type != VET_ESCALATE (those require vet approval first)"
          - "Pet.status != VET_HOLD (ERR_PET_NOT_ACTIVE)"
          - "The Pet's next non-terminal Order (SCHEDULED) has time-to-ship > modification_deadline (ERR_MODIFICATION_DEADLINE_PASSED)"
        side_effects:
          - "Apply adjustment to Subscription's next RecipeRecommendation for this pet (regenerate recommendation, supersede the prior PENDING one)"
          - "Pet.adjustment_history appended"
          - "AuditLog event ADJUSTMENT_APPLIED appended"
      - from: SUGGESTED
        to: DISMISSED
        trigger: "POST /pets/{petId}/recipe-adjustments/{adjId}/dismiss"
        actor: Customer
        preconditions: []
        side_effects:
          - "AuditLog event ADJUSTMENT_DISMISSED appended"
      - from: SUGGESTED
        to: VET_PENDING
        trigger: "system (suggestion_type == VET_ESCALATE on creation) OR POST /pets/{petId}/recipe-adjustments/{adjId}/escalate"
        actor: system | Customer
        preconditions: []
        side_effects:
          - "Pet.status := VET_HOLD"
          - "AuditLog event VET_ESCALATED appended"
      - from: VET_PENDING
        to: VET_APPROVED
        trigger: "POST /pets/{petId}/recipe-adjustments/{adjId}/events/vet (event_type=VET_APPROVED)"
        actor: system
        preconditions: []
        side_effects:
          - "Pet.status := ACTIVE"
      - from: VET_APPROVED
        to: APPLIED
        trigger: "POST /pets/{petId}/recipe-adjustments/{adjId}/apply"
        actor: Customer
        preconditions:
          - "Pet.status == ACTIVE (ERR_PET_NOT_ACTIVE)"
        side_effects:
          - "Apply adjustment (same chain as the SUGGESTED→APPLIED path above)"
          - "Pet.adjustment_history appended"
          - "AuditLog event ADJUSTMENT_APPLIED appended"
      - from: VET_PENDING
        to: VET_REJECTED
        trigger: "POST /pets/{petId}/recipe-adjustments/{adjId}/events/vet (event_type=VET_REJECTED)"
        actor: system
        preconditions: []
        side_effects:
          - "Pet.status := ACTIVE"
          - "AuditLog event ADJUSTMENT_DISMISSED appended (rationale='vet rejected')"

  # ----- RecipeRecommendation lifecycle -----
  - entity: RecipeRecommendation
    initial_state: PENDING
    terminal_states: [FROZEN, SUPERSEDED]
    transitions:
      - from: PENDING
        to: FROZEN
        trigger: "system (Order auto-generation cycle uses this recommendation)"
        actor: system
        preconditions: []
        side_effects:
          - "Recommendation becomes immutable; its recipe_id pinned into the resulting Order.items[].recipe_id"
      - from: PENDING
        to: SUPERSEDED
        trigger: "system (RecipeAdjustment.APPLIED regenerates a fresh recommendation; subscription cancel)"
        actor: system
        preconditions: []
        side_effects: []

# ----- Concurrency Rules -----
concurrency_rules:
  - scenario: "Customer skip and system auto-confirm fire on the same Order simultaneously"
    guarantee: "Exactly one outcome: skip wins if its deadline check passes; otherwise auto-confirm proceeds and skip rejected"
    error_id: ERR_INVALID_ORDER_STATE
    http_status: 409
    serialization: "First-writer-wins on Order.fulfillment_status"
  - scenario: "Two pause requests on the same Subscription with overlapping windows"
    guarantee: "First request wins; second receives overlap error"
    error_id: ERR_PAUSE_WINDOW_OVERLAP
    http_status: 409
    serialization: "First-writer-wins on Subscription.status"
  - scenario: "Two concurrent applies of competing RecipeAdjustments for the same Pet's next cycle"
    guarantee: "First-writer-wins; loser sees state-conflict"
    error_id: ERR_INVALID_ADJUSTMENT_STATE
    http_status: 409
    serialization: "First-writer-wins on RecipeAdjustment.status"
  - scenario: "Two Orders confirm against the last gram of the same InventoryLot"
    guarantee: "First-writer-wins; second rejected"
    error_id: ERR_INSUFFICIENT_INVENTORY
    http_status: 409
    serialization: "First-writer-wins on InventoryLot.quantity_grams (no negative balances)"
  - scenario: "Two Orders confirm against the last unit of a Warehouse's daily capacity"
    guarantee: "First-writer-wins; second sees capacity overlap rejection"
    error_id: ERR_WAREHOUSE_CAPACITY_EXCEEDED
    http_status: 409
    serialization: "First-writer-wins on Warehouse daily ledger"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: life_stage_derivation
    trigger: "Pet create, Pet update, _clock advance"
    algorithm: threshold
    formula: |
      months = floor((now_utc_date - Pet.birthdate) / 30 days)
      if species == DOG:
          if months < 12:  life_stage = PUPPY_KITTEN
          elif months < 84: life_stage = ADULT
          else:            life_stage = SENIOR
      else:  # CAT
          if months < 12:  life_stage = PUPPY_KITTEN
          elif months < 120: life_stage = ADULT
          else:            life_stage = SENIOR
    constants:
      DOG_PUPPY_MAX_MONTHS: 12
      DOG_ADULT_MAX_MONTHS: 84
      CAT_PUPPY_MAX_MONTHS: 12
      CAT_ADULT_MAX_MONTHS: 120

  - name: portion_grams_per_day
    trigger: "Order generation; RecipeAdjustment APPLIED with portion_delta_pct"
    algorithm: weighted_scoring
    formula: |
      # Base RER (Resting Energy Requirement) kcal/day:
      RER = 70 * (weight_kg ** 0.75)
      # Activity multiplier:
      activity_factor = { LOW: 1.2, MODERATE: 1.6, HIGH: 2.0 }[activity_level]
      # Life-stage multiplier:
      life_stage_factor = { PUPPY_KITTEN: 1.8, ADULT: 1.0, SENIOR: 0.8 }[life_stage]
      daily_kcal = RER * activity_factor * life_stage_factor
      # Convert to grams given recipe's kcal_per_gram:
      grams_raw = daily_kcal / recipe.kcal_per_gram
      # Round half-up to nearest integer gram:
      portion_grams_per_day = round_half_up(grams_raw)
    constants:
      RER_COEFFICIENT: 70
      RER_EXPONENT: 0.75
    precision: "Integer grams, round_half_up"
    variants:
      - name: provisional
        when: "At Order auto-generation, using Pet.weight_kg as currently recorded"
        difference: "Uses live Pet.weight_kg; result lands in Order.items[].portion_grams_per_day"
      - name: feedback_adjusted
        when: "At RecipeAdjustment APPLIED with portion_delta_pct != null"
        difference: |
          Apply RecipeAdjustment.portion_delta_pct to the provisional value
          BEFORE the recipe lookup, then re-round. Same Pet at same wall-time
          can therefore yield a different gram value than the provisional path.

  - name: order_total
    trigger: "Order auto-generation, RecipeAdjustment apply that regenerates a pending Order's items"
    algorithm: tiered_pricing
    formula: |
      # PER-ITEM: unit_price_cents is recipe-specific (recipe.unit_price_cents_per_100g).
      # For each item:
      #   item.total_grams = item.portion_grams_per_day * cycle_days
      #   item.line_total_cents = round_half_up(
      #       (item.total_grams / 100.0) * recipe.unit_price_cents_per_100g
      #   )                                       # ROUND PER LINE — order matters
      # subtotal_cents = sum over items of item.line_total_cents
      # If Order.is_trial_pack == true:
      #     subtotal_cents = round_half_up(subtotal_cents * TRIAL_DISCOUNT)
      # shipping_fee_cents = shipping_fee_calc(subtotal_cents)
      # total_cents = subtotal_cents + shipping_fee_cents
    constants:
      TRIAL_DISCOUNT: 0.5
    precision: "Integer cents, round_half_up applied PER LINE then summed (NOT sum-then-round)"
    note: |
      Evaluation order pinned: per-line round → sum → trial-discount round → add shipping.
      Reversing 'round per line' and 'sum' produces different cents on subtotals where
      multiple items contribute fractional cents.

  - name: shipping_fee_cents
    trigger: "Order auto-generation, recompute on items change"
    algorithm: tiered_pricing
    formula: |
      if subtotal_cents >= FREE_THRESHOLD_CENTS:
          shipping_fee_cents = 0
      elif subtotal_cents >= MID_THRESHOLD_CENTS:
          shipping_fee_cents = MID_FEE_CENTS
      else:
          shipping_fee_cents = HIGH_FEE_CENTS
    constants:
      FREE_THRESHOLD_CENTS: 8000     # $80.00
      MID_THRESHOLD_CENTS: 4000      # $40.00
      MID_FEE_CENTS: 499             # $4.99
      HIGH_FEE_CENTS: 999            # $9.99
    note: "Tier boundary >= (inclusive). 8000 cents → free; 7999 → 4.99; 3999 → 9.99."

  - name: recipe_match_score
    trigger: "RecipeRecommendation generation"
    algorithm: weighted_scoring
    formula: |
      For each candidate Recipe:
        score = 0
        # Hard gates first (eligibility); failures eliminate candidate:
        if recipe.target_species != pet.species: ELIMINATE
        if recipe.target_life_stage not in [pet.life_stage, "ALL"]: ELIMINATE
        if any token in pet.allergies appears in (protein_sources ∪ grain_sources ∪ supplement_sources): ELIMINATE  # strict
        if recipe.vet_prescribed:
            if no token in recipe.prescribed_for matches pet.health_conditions: ELIMINATE
            score += VET_PRESCRIBED_BONUS
        # Soft scoring:
        score += LIFE_STAGE_MATCH                                if recipe.target_life_stage == pet.life_stage
        score += PREFERRED_INGREDIENT_WEIGHT * |dietary_preferences ∩ (protein_sources ∪ supplement_sources)|
        score -= AVERSION_PENALTY            * |dietary_aversions ∩ (protein_sources ∪ grain_sources ∪ supplement_sources)|
        score -= INTOLERANCE_PENALTY         * |intolerances     ∩ (protein_sources ∪ grain_sources ∪ supplement_sources)|
        # Rotation rule — see ingredient_rotation calc.
    constants:
      VET_PRESCRIBED_BONUS: 40
      LIFE_STAGE_MATCH: 30
      PREFERRED_INGREDIENT_WEIGHT: 10
      AVERSION_PENALTY: 5
      INTOLERANCE_PENALTY: 15
    variants:
      - name: strict
        when: "Pet has at least one health_condition tag"
        difference: |
          Hard gate: only vet_prescribed recipes whose prescribed_for matches a Pet condition
          are eligible. Non-prescribed recipes are eliminated even if they would otherwise score high.
      - name: relaxed
        when: "Pet has empty health_conditions"
        difference: |
          Vet_prescribed recipes are ELIMINATED entirely (a healthy pet must not be put on a
          prescription diet); regular recipes compete on score normally.

  - name: recipe_selector
    trigger: "RecipeRecommendation generation"
    algorithm: weighted_scoring
    formula: |
      eligibility_filter:
        - recipe.target_species == pet.species
        - recipe.target_life_stage in {pet.life_stage, ALL}
        - allergen_clear (see recipe_match_score)
        - vet_prescribed gate per strict/relaxed variant
        - if subscription.is_trial AND cycle_index == 1: recipe.trial_eligible == true
        - rotation: recipe.monotony_class MUST NOT equal the monotony_class of the previous
                    Order's item.recipe for this pet (when previous Order exists)
      ranking: descending recipe_match_score
      tie_break:
        primary: recipe.code ASCII ascending
        secondary: recipe.id ASCII ascending
      empty_fallback: error ERR_NO_RECIPE_AVAILABLE
    constants: {}

  - name: ingredient_rotation_check
    trigger: "recipe_selector eligibility, Order generation"
    algorithm: aggregation
    formula: |
      previous_order = latest Order for subscription where fulfillment_status in {CONFIRMED, SHIPPED, DELIVERED}
                       ORDER BY cycle_index DESC, id ASCII DESC tie-break
      if previous_order exists AND any item where pet_id == this_pet has recipe.monotony_class == candidate.monotony_class:
          eliminate candidate
    constants: {}
    note: "Inclusive of all non-CANCELLED, non-SKIPPED orders. SKIPPED and CANCELLED do NOT count toward rotation history."

  - name: warehouse_selector
    trigger: "Order CONFIRMED"
    algorithm: weighted_scoring
    formula: |
      eligibility_filter:
        - warehouse.status == ONLINE
        - shipping_address_snapshot.region in warehouse.serves_regions
        - for each item: there exists at least one InventoryLot at this warehouse for item.recipe_id with
            expiration_date > scheduled_ship_at AND quantity_grams >= item.total_grams
        - warehouse's daily_outbound_capacity for the scheduled_ship_at UTC date NOT yet exhausted
      ranking: ascending warehouse.priority_rank
      tie_break: warehouse.code ASCII ascending
      empty_fallback: error ERR_NO_WAREHOUSE_AVAILABLE
    constants: {}

  - name: lot_selector
    trigger: "Order CONFIRMED"
    algorithm: chronological
    formula: |
      For each item, among InventoryLots at the chosen warehouse for item.recipe_id satisfying
      expiration_date > scheduled_ship_at AND quantity_grams >= item.total_grams:
        ranking: ascending expiration_date (FEFO — First Expire First Out)
        tie_break: batch_code ASCII ascending, then id ASCII ascending
        empty_fallback: error ERR_INSUFFICIENT_INVENTORY (this should be impossible after warehouse_selector — but check defensively)
      Selected lot's quantity_grams decremented by item.total_grams atomically.

  - name: feedback_aggregation
    trigger: "Listing the suggestion-engine inputs; runs on every ShipmentFeedback create for the same Pet"
    algorithm: aggregation
    formula: |
      Inputs: ShipmentFeedback rows where pet_id == target_pet ordered by created_at ASC,
              within the WINDOW most recent N feedbacks (N = AGGREGATION_WINDOW).
      If count < MIN_FEEDBACKS_FOR_SUGGESTION: emit no suggestion (empty-set fallback).
      avg_palatability = mean(palatability) rounded to 2 decimal places, round_half_up
      avg_stool        = mean(stool_quality) rounded to 2 decimal places, round_half_up
      avg_coat         = mean(coat_condition) rounded to 2 decimal places, round_half_up
      total_weight_change_grams = sum(weight_change_grams)  # signed integer
      adverse_count = count rows where palatability <= 2 OR stool_quality <= 2
    constants:
      AGGREGATION_WINDOW: 3
      MIN_FEEDBACKS_FOR_SUGGESTION: 2
    note: "Aggregation window is rolling on the most-recent N. With <2 feedbacks the engine emits nothing."

  - name: suggestion_engine
    trigger: "ShipmentFeedback create (after feedback_aggregation runs)"
    algorithm: threshold
    formula: |
      # Priority-ordered branches (evaluate top-down, first hit wins):
      # 1. Vet escalation (highest priority, hard rule)
      if adverse_count >= 2:
          suggestion_type = VET_ESCALATE; status = VET_PENDING (auto-escalate)
          rationale appends "adverse_stool_or_palatability"
          return
      # 2. Coat decline AND weight loss → swap recipe family
      if avg_coat <= 2.50 AND total_weight_change_grams < 0:
          suggestion_type = SWAP_RECIPE_FAMILY
          target_recipe_id = recipe_selector run with ROTATION FORCED to ON (must change monotony_class)
          rationale appends "coat_and_weight_decline"
          return
      # 3. Weight gain above tolerance → decrease portion 10%
      if total_weight_change_grams > WEIGHT_GAIN_THRESHOLD_GRAMS:
          suggestion_type = DECREASE_PORTION; portion_delta_pct = -10
          rationale appends "weight_gain_above_tolerance"
          return
      # 4. Weight loss above tolerance → increase portion 10%
      if total_weight_change_grams < -WEIGHT_GAIN_THRESHOLD_GRAMS:
          suggestion_type = INCREASE_PORTION; portion_delta_pct = +10
          rationale appends "weight_loss_above_tolerance"
          return
      # 5. Low palatability but no adverse stool → protein rotation
      if avg_palatability <= 3.00:
          suggestion_type = ROTATE_PROTEIN
          target_recipe_id = recipe_selector run with FORCED protein_source rotation
          rationale appends "low_palatability_rotation"
          return
      # else: no suggestion
    constants:
      WEIGHT_GAIN_THRESHOLD_GRAMS: 500

  - name: address_verification
    trigger: "POST /customers/{customerId}/shipping-address/verify, POST /subscriptions/{subId}/shipping-address/verify"
    algorithm: threshold
    formula: |
      Mark verified=true on the address object iff:
        - country in {US, CA, UK, AU, DE, FR, JP, CN}
        - postal_code matches the country's regex (US: ^\d{5}(-\d{4})?$ ; others: non-empty string)
        - line1 non-empty
        - city non-empty
      Else verified stays false and ERR_ADDRESS_VERIFICATION_FAILED is raised.
    constants: {}

  - name: cycle_scheduler
    trigger: "POST /_clock/advance"
    algorithm: chronological
    formula: |
      For every Subscription with status == ACTIVE and next_cycle_at <= now:
        cycle_index = scheduled_order_count + 1
        Generate Order with:
            scheduled_ship_at = now + SHIP_LEAD_TIME_HOURS hours
            items computed from each pet's FROZEN RecipeRecommendation (regenerate PENDING ones first)
            payment_status = PENDING, fulfillment_status = SCHEDULED
        scheduled_order_count += 1
        total_cycles_elapsed += 1
        next_cycle_at = next_cycle_at + cycle_days
        If subscription.is_trial AND cycle_index == 1: Order.is_trial_pack = true
        Auto-emit at most ONE Order per cycle even if multiple cycles elapsed —
        catch-up cycles are deferred to subsequent _clock advances.
    constants:
      SHIP_LEAD_TIME_HOURS: 72
    note: "One Order per advance per subscription. Catch-up requires further advances."

  - name: conserved_cycle_invariant
    trigger: "Post-condition assertion at every Subscription mutation"
    algorithm: aggregation
    formula: |
      INVARIANT: Subscription.scheduled_order_count + Subscription.skipped_count == Subscription.total_cycles_elapsed
      Any mutation that violates this is a compensating-action failure.
      Counter movement summary:
        cycle_scheduler emits an Order:  scheduled_order_count++, total_cycles_elapsed++ (invariant preserved)
        Order skipped:                   scheduled_order_count--, skipped_count++         (invariant preserved)
        Order cancelled via cascade:     no counter movement (the cycle still counts as scheduled-then-cancelled)
    constants: {}
    note: "Implementation MUST keep the three counters in lock-step. The skip path is the compensating action for cycle_scheduler with respect to the conserved cycle quantity."

  - name: conserved_money_invariant
    trigger: "Post-condition assertion at every Order payment mutation"
    algorithm: aggregation
    formula: |
      INVARIANT: For every Customer, sum(Order.total_cents WHERE payment_status==PAID) == Customer.total_charged_cents,
                 and sum(Order.total_cents WHERE payment_status==REFUNDED) == Customer.total_refunded_cents.
    constants: {}
    note: "Refund follows fulfillment cancel on a PAID order — both counters must move in lockstep."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and have permitted values"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role must be permitted for this endpoint per RBAC"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path resource ids must exist (validated left-to-right: customerId, subId, orderId, petId, adjId, recipeId, warehouseId, lotId)"
    error_id: "ERR_CUSTOMER_NOT_FOUND | ERR_SUBSCRIPTION_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_PET_NOT_FOUND | ERR_ADJUSTMENT_NOT_FOUND | ERR_RECIPE_NOT_FOUND | ERR_WAREHOUSE_NOT_FOUND | ERR_LOT_NOT_FOUND | ERR_FEEDBACK_NOT_FOUND"
    http_status: 404
    applies_to: "all nested resource endpoints"

  - priority: 4
    category: state
    check: "Subscription must be in ACTIVE state for order auto-generation, skip, recipe-adjustment apply"
    error_id: ERR_INVALID_SUBSCRIPTION_STATE
    http_status: 409
    applies_to: "POST /subscriptions/{id}/orders/auto-generate, /orders/{id}/skip, /pets/{id}/recipe-adjustments/{adjId}/apply"

  - priority: 5
    category: state
    check: "Target resource must be in the correct state for the requested transition (e.g., Order SCHEDULED for skip; Adjustment SUGGESTED for apply)"
    error_id: "ERR_INVALID_ORDER_STATE | ERR_INVALID_SUBSCRIPTION_STATE | ERR_INVALID_ADJUSTMENT_STATE"
    http_status: 409
    applies_to: "state-transition endpoints"

  - priority: 6
    category: business_safety
    check: "Allergen exclusion: Recipe selected for a Pet must not share any token with Pet.allergies in protein/grain/supplement sources"
    error_id: ERR_ALLERGEN_PROHIBITED
    http_status: 422
    applies_to: "Order auto-generation, RecipeAdjustment apply"

  - priority: 7
    category: business_safety
    check: "Vet-prescribed recipe gate: a Pet without matching health_condition cannot be assigned a vet_prescribed recipe; conversely a Pet WITH a health_condition cannot receive a non-vet-prescribed recipe."
    error_id: ERR_VET_PRESCRIBED_REQUIRED
    http_status: 422
    applies_to: "Order auto-generation, RecipeAdjustment apply"

  - priority: 8
    category: business_temporal
    check: "Modification window: skip / apply RecipeAdjustment require now < (next Order.scheduled_ship_at - subscription.modification_deadline_hours). Boundary is STRICT LESS-THAN — equality at exactly the cutoff is REJECTED."
    error_id: ERR_MODIFICATION_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /orders/{id}/skip, /pets/{petId}/recipe-adjustments/{adjId}/apply, PATCH /subscriptions/{id}"

  - priority: 9
    category: business_referential
    check: "Recipe being applied via RecipeAdjustment.target_recipe_id must exist and pass current eligibility for the Pet (life_stage, species, allergen, rotation)"
    error_id: ERR_RECIPE_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /pets/{petId}/recipe-adjustments/{adjId}/apply"

  - priority: 10
    category: business_temporal
    check: "Pause window must not overlap an existing pause window for the same Subscription (half-open interval [now, paused_until))"
    error_id: ERR_PAUSE_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /subscriptions/{id}/pause"

  - priority: 11
    category: business_constraint
    check: "Warehouse daily_outbound_capacity for scheduled_ship_at UTC date must not be exceeded (closed-closed interval on UTC date — orders sharing the date with full warehouse rejected)"
    error_id: ERR_WAREHOUSE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /orders/{id}/confirm"

  - priority: 12
    category: business_constraint
    check: "Shipping address must be verified (verified == true) before activation, confirmation, and reactivation"
    error_id: ERR_ADDRESS_NOT_VERIFIED
    http_status: 422
    applies_to: "POST /subscriptions/{id}/activate, /orders/{id}/confirm"

  - priority: 13
    category: business_constraint
    check: "Ingredient rotation: candidate recipe's monotony_class differs from previous shipped/confirmed Order's monotony_class for this Pet"
    error_id: ERR_ROTATION_VIOLATION
    http_status: 422
    applies_to: "Order auto-generation, RecipeAdjustment apply"

  - priority: 14
    category: business_constraint
    check: "Inventory: at least one InventoryLot at chosen warehouse with expiration_date > scheduled_ship_at and quantity_grams >= required grams"
    error_id: ERR_INSUFFICIENT_INVENTORY
    http_status: 409
    applies_to: "POST /orders/{id}/confirm"

  - priority: 15
    category: business_constraint
    check: "Subscription pet_ids must (a) be non-empty (length >= 1), (b) all belong to the requesting Customer, (c) all be ACTIVE (not ARCHIVED, not VET_HOLD)"
    error_id: "ERR_INVALID_PET_LIST | ERR_PET_NOT_ACTIVE"
    http_status: 422
    applies_to: "POST /customers/{id}/subscriptions, PATCH /subscriptions/{id}"

  - priority: 16
    category: business_constraint
    check: "Feedback rating fields (palatability, stool_quality, coat_condition) must be integers in [1,5]; weight_change_grams must be an integer"
    error_id: ERR_INVALID_FEEDBACK_PAYLOAD
    http_status: 422
    applies_to: "POST /orders/{id}/feedback"

  - priority: 17
    category: business_constraint
    check: "Request body shape: required fields present and typed correctly per endpoint contract"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST/PATCH endpoints"

  - priority: 18
    category: business_constraint
    check: "Address verification calc: country in supported set; postal_code matches the country's regex; line1 and city non-empty"
    error_id: ERR_ADDRESS_VERIFICATION_FAILED
    http_status: 422
    applies_to: "POST /customers/{id}/shipping-address/verify, POST /subscriptions/{id}/shipping-address/verify"

  - priority: 19
    category: business_referential
    check: "Recipe selector candidate pool is non-empty after all eligibility filters (species, life_stage, allergen, vet_prescribed, rotation, trial_eligible)"
    error_id: ERR_NO_RECIPE_AVAILABLE
    http_status: 422
    applies_to: "cycle_scheduler-driven Order auto-generation, RecipeAdjustment apply with SWAP_RECIPE_FAMILY"

  - priority: 20
    category: business_constraint
    check: "Optimistic concurrency: when PATCH includes a `version` field, it must equal the current entity.version"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "PATCH /subscriptions/{id}, PATCH /customers/{id}/pets/{petId}, PATCH /warehouses/{id}"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ----- Customer -----
  - { method: POST,  path: "/customers", description: "Create a Customer",
      roles: [Customer, AdminOps], code: 201,
      input: [email, display_name, "default_shipping_address?"], output: Customer,
      side_effects: ["status implicit ACTIVE; address.verified initialized to false"] }
  - { method: GET,   path: "/customers/{customerId}", description: "Get a Customer",
      roles: [Customer, AdminOps], code: 200, input: [], output: Customer, side_effects: [] }
  - { method: POST,  path: "/customers/{customerId}/shipping-address/verify",
      description: "Run address verification on default_shipping_address",
      roles: [Customer], code: 200, input: [], output: Customer,
      side_effects: ["address_verification calc → sets default_shipping_address.verified"] }

  # ----- Pet -----
  - { method: POST,  path: "/customers/{customerId}/pets", description: "Create a Pet",
      roles: [Customer], code: 201,
      input: [name, species, breed, birthdate, weight_kg, activity_level, "allergies?", "intolerances?", "dietary_preferences?", "dietary_aversions?", "health_conditions?"],
      output: Pet,
      side_effects: ["life_stage computed", "status=ACTIVE", "photo_gallery=[]", "adjustment_history=[]"] }
  - { method: GET,   path: "/customers/{customerId}/pets", description: "List a customer's Pets",
      roles: [Customer, AdminOps], code: 200, input: ["limit?", "offset?"], output: "Pet[]", side_effects: [] }
  - { method: GET,   path: "/customers/{customerId}/pets/{petId}", description: "Get a Pet",
      roles: [Customer, AdminOps], code: 200, input: [], output: Pet, side_effects: [] }
  - { method: PATCH, path: "/customers/{customerId}/pets/{petId}", description: "Update Pet profile fields",
      roles: [Customer], code: 200,
      input: ["weight_kg?", "activity_level?", "allergies?", "intolerances?", "dietary_preferences?", "dietary_aversions?", "health_conditions?", "version?"],
      output: Pet,
      side_effects: ["life_stage recomputed if birthdate effectively changed (no — birthdate immutable)", "version++"] }
  - { method: POST,  path: "/customers/{customerId}/pets/{petId}/photos", description: "Append a photo to the gallery",
      roles: [Customer], code: 201, input: [url], output: Pet,
      side_effects: ["photo_gallery appended; immutable thereafter"] }

  # ----- Subscription -----
  - { method: POST,  path: "/customers/{customerId}/subscriptions", description: "Create a Subscription (DRAFT)",
      roles: [Customer], code: 201,
      input: [pet_ids, frequency, shipping_address, "is_trial?"], output: Subscription,
      side_effects: ["status=DRAFT", "cycle_days derived", "shipping_address.verified=false until verify endpoint runs"] }
  - { method: GET,   path: "/subscriptions/{subId}", description: "Get a Subscription",
      roles: [Customer, AdminOps], code: 200, input: [], output: Subscription, side_effects: [] }
  - { method: PATCH, path: "/subscriptions/{subId}", description: "Modify Subscription (frequency, pet_ids, shipping_address); subject to modification_deadline if ACTIVE",
      roles: [Customer], code: 200,
      input: ["frequency?", "pet_ids?", "shipping_address?", "version?"], output: Subscription,
      side_effects: ["next_cycle_at recomputed if frequency changed", "shipping_address.verified=false on change", "AuditLog event PLAN_MODIFIED"] }
  - { method: POST,  path: "/subscriptions/{subId}/shipping-address/verify",
      description: "Verify Subscription.shipping_address",
      roles: [Customer], code: 200, input: [], output: Subscription, side_effects: ["address_verification calc"] }
  - { method: POST,  path: "/subscriptions/{subId}/activate", description: "Activate from DRAFT or REACTIVATING",
      roles: [Customer], code: 200, input: [], output: Subscription, side_effects: ["state machine transition", "PENDING RecipeRecommendations generated"] }
  - { method: POST,  path: "/subscriptions/{subId}/pause", description: "Pause subscription until pause_until",
      roles: [Customer], code: 200, input: [pause_until], output: Subscription, side_effects: ["state machine transition + cascade"] }
  - { method: POST,  path: "/subscriptions/{subId}/resume", description: "Resume from PAUSED early (manual override)",
      roles: [Customer], code: 200, input: [], output: Subscription, side_effects: ["state machine transition"] }
  - { method: POST,  path: "/subscriptions/{subId}/cancel", description: "Cancel — first call may return retention offer instead of cancelling",
      roles: [Customer], code: 200, input: [cancel_reason, "force?"], output: Subscription,
      side_effects: ["retention-offer branch OR full cancel cascade"] }
  - { method: POST,  path: "/subscriptions/{subId}/reactivate", description: "Reactivate a CANCELLED subscription (moves to REACTIVATING)",
      roles: [Customer], code: 200, input: [], output: Subscription, side_effects: [] }

  # ----- Order -----
  - { method: GET,   path: "/subscriptions/{subId}/orders", description: "List orders for a subscription",
      roles: [Customer, AdminOps], code: 200, input: ["limit?", "offset?", "fulfillment_status?", "payment_status?"], output: "Order[]", side_effects: [] }
  - { method: GET,   path: "/orders/{orderId}", description: "Get an Order",
      roles: [Customer, AdminOps], code: 200, input: [], output: Order, side_effects: [] }
  - { method: POST,  path: "/orders/{orderId}/confirm", description: "Pre-shipment confirmation: pick warehouse + lots",
      roles: [Customer], code: 200, input: [], output: Order, side_effects: ["warehouse_selector + lot_selector + inventory debit"] }
  - { method: POST,  path: "/orders/{orderId}/skip", description: "Skip this cycle (subject to modification_deadline)",
      roles: [Customer], code: 200, input: [], output: Order, side_effects: ["counters update + AuditLog SKIPPED"] }
  - { method: POST,  path: "/orders/{orderId}/feedback", description: "Submit ShipmentFeedback (one per pet per order; DELIVERED required)",
      roles: [Customer], code: 201,
      input: [pet_id, palatability, stool_quality, coat_condition, weight_change_grams, "notes?"], output: ShipmentFeedback,
      side_effects: ["Pet.weight_kg += weight_change_grams/1000", "feedback_aggregation runs", "suggestion_engine may emit a RecipeAdjustment"] }
  - { method: POST,  path: "/orders/{orderId}/events/payment", description: "Payment-system event ingress",
      roles: [PaymentAdapter], code: 200, input: [event_type, "amount_cents?"], output: Order,
      side_effects: ["payment_status transitions per state machine; conserved_money_invariant maintained"] }
  - { method: POST,  path: "/orders/{orderId}/events/logistics", description: "Logistics-system event ingress",
      roles: [LogisticsAdapter], code: 200, input: [event_type, "tracking_number?"], output: Order,
      side_effects: ["fulfillment_status transitions per state machine; tracking_number persisted"] }

  # ----- RecipeAdjustment -----
  - { method: GET,   path: "/pets/{petId}/recipe-adjustments", description: "List recipe adjustments for a pet",
      roles: [Customer, AdminOps], code: 200, input: ["limit?", "offset?", "status?"], output: "RecipeAdjustment[]", side_effects: [] }
  - { method: GET,   path: "/pets/{petId}/recipe-adjustments/{adjId}", description: "Get a single recipe adjustment",
      roles: [Customer, AdminOps], code: 200, input: [], output: RecipeAdjustment, side_effects: [] }
  - { method: POST,  path: "/pets/{petId}/recipe-adjustments/{adjId}/apply", description: "Apply a SUGGESTED or VET_APPROVED adjustment",
      roles: [Customer], code: 200, input: [], output: RecipeAdjustment, side_effects: ["RecipeRecommendation regenerated, Pet.adjustment_history appended, AuditLog ADJUSTMENT_APPLIED"] }
  - { method: POST,  path: "/pets/{petId}/recipe-adjustments/{adjId}/dismiss", description: "Dismiss a suggestion",
      roles: [Customer], code: 200, input: [], output: RecipeAdjustment, side_effects: ["AuditLog ADJUSTMENT_DISMISSED"] }
  - { method: POST,  path: "/pets/{petId}/recipe-adjustments/{adjId}/escalate", description: "Manually escalate to vet",
      roles: [Customer], code: 200, input: [], output: RecipeAdjustment, side_effects: ["Pet.status=VET_HOLD, AuditLog VET_ESCALATED"] }
  - { method: POST,  path: "/pets/{petId}/recipe-adjustments/{adjId}/events/vet", description: "Veterinary-consultation system event ingress",
      roles: [VetAdapter], code: 200, input: [event_type], output: RecipeAdjustment,
      side_effects: ["status moves to VET_APPROVED or VET_REJECTED; Pet.status restored to ACTIVE"] }

  # ----- Recipe catalog (read + admin create) -----
  - { method: POST,  path: "/recipes", description: "Create a Recipe (catalog admin)",
      roles: [AdminOps], code: 201,
      input: [code, target_species, target_life_stage, protein_sources, grain_sources, supplement_sources, kcal_per_gram, "vet_prescribed?", "prescribed_for?", monotony_class, "trial_eligible?", "unit_price_cents_per_100g"],
      output: Recipe,
      side_effects: [] }
  - { method: GET,   path: "/recipes", description: "List recipes",
      roles: [Customer, AdminOps], code: 200,
      input: ["limit?", "offset?", "target_species?", "target_life_stage?", "vet_prescribed?"], output: "Recipe[]", side_effects: [] }
  - { method: GET,   path: "/recipes/{recipeId}", description: "Get a Recipe",
      roles: [Customer, AdminOps], code: 200, input: [], output: Recipe, side_effects: [] }
  - { method: GET,   path: "/pets/{petId}/recipe-recommendations", description: "List a Pet's RecipeRecommendations (all cycles)",
      roles: [Customer, AdminOps], code: 200, input: ["limit?", "offset?"], output: "RecipeRecommendation[]", side_effects: [] }

  # ----- Warehouse + Inventory (admin) -----
  - { method: POST,  path: "/warehouses", description: "Create a Warehouse",
      roles: [AdminOps], code: 201,
      input: [code, serves_regions, priority_rank, daily_outbound_capacity], output: Warehouse,
      side_effects: ["status=ONLINE"] }
  - { method: GET,   path: "/warehouses", description: "List warehouses",
      roles: [AdminOps], code: 200, input: ["limit?", "offset?"], output: "Warehouse[]", side_effects: [] }
  - { method: PATCH, path: "/warehouses/{warehouseId}", description: "Update warehouse (status, capacity)",
      roles: [AdminOps], code: 200, input: ["status?", "daily_outbound_capacity?", "priority_rank?", "version?"], output: Warehouse,
      side_effects: [] }
  - { method: POST,  path: "/warehouses/{warehouseId}/inventory-lots", description: "Add an InventoryLot to a warehouse",
      roles: [AdminOps], code: 201,
      input: [recipe_id, batch_code, expiration_date, quantity_grams], output: InventoryLot,
      side_effects: [] }
  - { method: GET,   path: "/warehouses/{warehouseId}/inventory-lots", description: "List a warehouse's lots",
      roles: [AdminOps], code: 200,
      input: ["limit?", "offset?", "recipe_id?"], output: "InventoryLot[]", side_effects: [] }

  # ----- Audit log read -----
  - { method: GET,   path: "/audit-logs", description: "List audit log entries (admin)",
      roles: [AdminOps], code: 200,
      input: ["limit?", "offset?", "entity_type?", "entity_id?", "event_type?"], output: "AuditLog[]", side_effects: [] }

  # ----- Test-driver endpoints (required for reachability per testability principle) -----
  - { method: POST,  path: "/_clock/advance", description: "Advance the logical clock; runs cycle_scheduler, auto-resume PAUSED subscriptions whose paused_until elapsed, and auto-confirm Orders past their modification_deadline",
      roles: [AdminOps], code: 200, input: ["to?", "by_hours?"], output: "object",
      side_effects: ["cycle_scheduler runs", "auto-resume runs", "auto-confirm runs"] }
  - { method: POST,  path: "/_events/emit", description: "Test-only: emit a synchronization event (payment/logistics/IM/vet) directly; used by tests when not addressing a specific Order/Adjustment",
      roles: [AdminOps], code: 200, input: [system, event_type, "payload?"], output: "object", side_effects: ["routed to the corresponding adapter"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role missing or invalid" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS,               http: 403, condition: "Role lacks permission for the endpoint" }

  # --- Not Found ---
  - { id: ERR_CUSTOMER_NOT_FOUND,     http: 404, condition: "Customer.id does not exist" }
  - { id: ERR_PET_NOT_FOUND,          http: 404, condition: "Pet.id does not exist" }
  - { id: ERR_SUBSCRIPTION_NOT_FOUND, http: 404, condition: "Subscription.id does not exist" }
  - { id: ERR_ORDER_NOT_FOUND,        http: 404, condition: "Order.id does not exist" }
  - { id: ERR_RECIPE_NOT_FOUND,       http: 404, condition: "Recipe.id does not exist" }
  - { id: ERR_ADJUSTMENT_NOT_FOUND,   http: 404, condition: "RecipeAdjustment.id does not exist" }
  - { id: ERR_WAREHOUSE_NOT_FOUND,    http: 404, condition: "Warehouse.id does not exist" }
  - { id: ERR_LOT_NOT_FOUND,          http: 404, condition: "InventoryLot.id does not exist" }
  - { id: ERR_FEEDBACK_NOT_FOUND,     http: 404, condition: "ShipmentFeedback.id does not exist" }

  # --- Request shape ---
  - { id: ERR_INVALID_REQUEST,           http: 400, condition: "Malformed body, type errors, missing required fields" }
  - { id: ERR_INVALID_FEEDBACK_PAYLOAD,  http: 422, condition: "palatability/stool_quality/coat_condition not in [1,5] or weight_change_grams not an integer" }
  - { id: ERR_INVALID_PET_LIST,          http: 422, condition: "Subscription.pet_ids empty, duplicates, or contains pets from another Customer" }
  - { id: ERR_INVALID_CANCEL_REASON,     http: 400, condition: "cancel_reason not in {PRICE, QUALITY, PET_NO_LONGER, OTHER}" }
  - { id: ERR_INVALID_PAUSE_WINDOW,      http: 422, condition: "pause_until <= now" }

  # --- State conflicts ---
  - { id: ERR_INVALID_SUBSCRIPTION_STATE, http: 409, condition: "Subscription not in the required state for this op" }
  - { id: ERR_INVALID_ORDER_STATE,        http: 409, condition: "Order not in the required payment/fulfillment state" }
  - { id: ERR_INVALID_ADJUSTMENT_STATE,   http: 409, condition: "RecipeAdjustment not in the required state" }
  - { id: ERR_PET_NOT_ACTIVE,             http: 409, condition: "Pet.status is VET_HOLD or ARCHIVED" }
  - { id: ERR_PAUSE_BLOCKED_IN_TRANSIT,   http: 409, condition: "Cannot pause a subscription with an Order in SHIPPED state" }

  # --- Temporal/window ---
  - { id: ERR_MODIFICATION_DEADLINE_PASSED, http: 409, condition: "now >= next Order.scheduled_ship_at - modification_deadline_hours" }
  - { id: ERR_PAUSE_WINDOW_OVERLAP,         http: 409, condition: "Requested pause window overlaps an existing pause window for this subscription" }

  # --- Business / referential ---
  - { id: ERR_ADDRESS_VERIFICATION_FAILED, http: 422, condition: "Address fails country/postal_code regex or required-field checks" }
  - { id: ERR_ADDRESS_NOT_VERIFIED,        http: 422, condition: "Operation requires shipping_address.verified == true" }
  - { id: ERR_ALLERGEN_PROHIBITED,         http: 422, condition: "Selected recipe contains an allergen tagged on the Pet" }
  - { id: ERR_VET_PRESCRIBED_REQUIRED,     http: 422, condition: "Vet-prescribed gate fails (mismatch between vet_prescribed status and Pet.health_conditions)" }
  - { id: ERR_RECIPE_NOT_ELIGIBLE,         http: 422, condition: "Recipe fails species / life_stage / allergen / vet-prescribed / rotation check" }
  - { id: ERR_ROTATION_VIOLATION,          http: 422, condition: "Candidate recipe's monotony_class equals previous shipment's monotony_class for this pet" }
  - { id: ERR_NO_RECIPE_AVAILABLE,         http: 422, condition: "Recipe selector candidate pool empty after all filters" }

  # --- Capacity / inventory ---
  - { id: ERR_NO_WAREHOUSE_AVAILABLE,       http: 409, condition: "Warehouse selector candidate pool empty" }
  - { id: ERR_WAREHOUSE_CAPACITY_EXCEEDED,  http: 409, condition: "Warehouse's daily_outbound_capacity for the ship date is exhausted" }
  - { id: ERR_INSUFFICIENT_INVENTORY,       http: 409, condition: "No InventoryLot has expiration_date > scheduled_ship_at and quantity_grams >= required grams" }

  # --- Optimistic concurrency ---
  - { id: ERR_VERSION_CONFLICT, http: 409, condition: "PATCH provided a `version` that did not match the current entity version" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Customer
    description: "End user managing their pets, subscriptions, orders, and adjustments."
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /customers/{id}/pets — create own pets"
      - "PATCH /customers/{id}/pets/{petId} — edit own pets"
      - "POST /customers/{id}/pets/{petId}/photos"
      - "POST /customers/{id}/subscriptions — create own subscription"
      - "PATCH /subscriptions/{id} — modify own subscription"
      - "POST /subscriptions/{id}/shipping-address/verify"
      - "POST /customers/{id}/shipping-address/verify"
      - "POST /subscriptions/{id}/activate"
      - "POST /subscriptions/{id}/pause"
      - "POST /subscriptions/{id}/resume"
      - "POST /subscriptions/{id}/cancel"
      - "POST /subscriptions/{id}/reactivate"
      - "POST /orders/{id}/confirm"
      - "POST /orders/{id}/skip"
      - "POST /orders/{id}/feedback"
      - "POST /pets/{id}/recipe-adjustments/{adjId}/apply"
      - "POST /pets/{id}/recipe-adjustments/{adjId}/dismiss"
      - "POST /pets/{id}/recipe-adjustments/{adjId}/escalate"
    shared_operations:
      - "GET /customers/{id} (own only)"
      - "GET .../pets (own only)"
      - "GET /subscriptions/{id} (own only)"
      - "GET /subscriptions/{id}/orders (own only)"
      - "GET /orders/{id} (own only)"
      - "GET /pets/{id}/recipe-adjustments (own only)"
      - "GET /pets/{id}/recipe-recommendations (own only)"
      - "GET /recipes, /recipes/{id} (read-only)"
    note: "Customer ownership check: for any path containing {customerId}, X-User-ID MUST equal that customerId; for resources under a Subscription/Pet/Order, the underlying Customer.id MUST equal X-User-ID."

  - name: AdminOps
    description: "Platform operations — creates Recipe catalog, Warehouses, InventoryLots; reads audit logs; drives test-driver endpoints."
    identity: "opaque"
    exclusive_operations:
      - "POST /recipes"
      - "POST /warehouses"
      - "PATCH /warehouses/{id}"
      - "POST /warehouses/{id}/inventory-lots"
      - "GET /audit-logs"
      - "POST /_clock/advance"
      - "POST /_events/emit"
    shared_operations:
      - "GET (catalog reads on /recipes, /warehouses, /warehouses/{id}/inventory-lots)"
      - "GET (read-only on all customer-owned resources for support)"

  - name: PaymentAdapter
    description: "External payment system synchronization — ingests PAYMENT_CAPTURED / PAYMENT_FAILED / PAYMENT_REFUNDED events."
    identity: "opaque"
    exclusive_operations:
      - "POST /orders/{id}/events/payment"
    shared_operations: []

  - name: LogisticsAdapter
    description: "External logistics/shipping system — ingests SHIPMENT_DISPATCHED / DELIVERY_CONFIRMED events."
    identity: "opaque"
    exclusive_operations:
      - "POST /orders/{id}/events/logistics"
    shared_operations: []

  - name: VetAdapter
    description: "External veterinary-consultation system — ingests VET_APPROVED / VET_REJECTED events."
    identity: "opaque"
    exclusive_operations:
      - "POST /pets/{petId}/recipe-adjustments/{adjId}/events/vet"
    shared_operations: []
