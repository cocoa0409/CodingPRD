# =============================================================================
# PRD Benchmark Seed Tables — task_2768
# Pool Service Route Brokerage & Account Transfer (Pool Route Sales)
#
# §1.0–§1.7 live in this file. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml and
# §1.9 in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Pool Service Route Brokerage & Account Transfer (Pool Route Sales): route
  valuation by monthly recurring billing multiple and account age, account list
  due diligence with billing history verification, buyer financing and escrow
  structure, account retention guarantee period with replacement or
  purchase-price adjustment, customer introduction sequencing and
  non-solicitation by the seller, chemical and repair revenue separation in the
  valuation, license and permit transfer by state, post-close attrition
  tracking and clawback settlement.

domain_name: pool-route-brokerage

# Flat topology: every business collection is a top-level sibling under the
# root. There is no owning collection to nest the others beneath, so the
# api_prefix is the root itself and foreign keys (never URL nesting) express
# every relationship.
api_prefix: "/"

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities linked purely by foreign keys. Seller, Buyer,
  # StateLicenseProfile, RouteListing, ServiceAccount, BillingHistoryRecord,
  # RouteValuation, Deal, EscrowAccount, LicenseTransfer, AttritionEvent and
  # ClawbackSettlement are all top-level collections; ServiceAccount also
  # references itself (replaced_account_id) for the retention-replacement pair.

  state_machine_shape: cyclic
  # Deal negotiates in rounds (OFFER_SUBMITTED <-> COUNTERED) and can be thrown
  # back to the table by a diligence-driven revaluation
  # (ACCEPTED/DILIGENCE_CLEARED -> REPRICE_REQUIRED -> OFFER_SUBMITTED).
  # ServiceAccount carries two independent state dimensions; LicenseTransfer
  # forks APPROVED/DENIED and loops back through APPLIED; ClawbackSettlement
  # loops PROPOSED <-> DISPUTED.

  relationship_patterns:
    - one_to_many          # RouteListing -> ServiceAccount, Deal -> LicenseTransfer
    - self_referential     # ServiceAccount.replaced_account_id -> ServiceAccount.id
    - cross_aggregate      # ServiceAccount.deal_id crosses the listing aggregate

  role_model: segregation_of_duties
  # The EscrowAgent user id that funded an escrow may never be the user id that
  # releases the holdback or settles a clawback against it. Layered on top of
  # peer ownership: Seller owns listings/accounts, Buyer owns deals/licence
  # applications, Broker runs diligence and closing, PlatformAdmin acts as the
  # state licensing authority.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: StateLicenseProfile
    parent: null
    common_fields: true
    fields:
      - name: state_code
        type: string
        source: input
        description: "Two-letter state code; unique across StateLicenseProfile."
        constraints: "exactly 2 uppercase letters; unique"
      - name: required_permit_types
        type: array
        source: input
        description: "Permit types a buyer must hold in this state before a route may close."
        constraints: "non-empty array of {PESTICIDE_APPLICATOR, CONTRACTOR, BUSINESS_TAX}; no duplicates"
      - name: reciprocity_states
        type: array
        source: input
        description: "State codes whose licence a buyer may carry in lieu of applying here."
        constraints: "array of 2-letter codes; may be empty"
      - name: transfer_processing_days
        type: integer
        source: input
        description: "Length in days of the regulator's processing window opened by an application."
        constraints: ">= 1 and <= 180"
      - name: cooling_off_days
        type: integer
        source: input
        description: "Days that must elapse after a denial before the same permit may be re-applied for."
        constraints: ">= 0 and <= 180"
      - name: provisional_operation_allowed
        type: boolean
        source: input
        description: "Whether a buyer holding no licence anywhere may still file an application here."

  - name: Seller
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Legal name of the route-owning entity."
        constraints: "1..120 chars"
      - name: state_code
        type: string
        source: input
        description: "State the seller currently operates the route in."
        constraints: "exactly 2 uppercase letters"
      - name: license_number
        type: string
        source: input
        description: "Seller's operating licence number, recorded for the transfer packet."
        constraints: "1..40 chars"
      - name: status
        type: enum
        source: system
        description: "Seller standing. ACTIVE at creation; SUSPENDED by POST /sellers/{id}/suspend."
        default: ACTIVE
        constraints: "ACTIVE | SUSPENDED"
      - name: suspension_reason_code
        type: string
        source: system
        description: "reason_code recorded by the suspend action; null while ACTIVE."
        default: null

  - name: Buyer
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Legal name of the acquiring entity."
        constraints: "1..120 chars"
      - name: state_code
        type: string
        source: input
        description: "State whose licence the buyer already holds (or intends to hold)."
        constraints: "exactly 2 uppercase letters"
      - name: license_status
        type: enum
        source: input
        description: "Buyer's current licensure: LICENSED anywhere, PENDING an application, or NONE at all."
        constraints: "LICENSED | PENDING | NONE"
      - name: prequalified_amount_cents
        type: integer
        source: input
        description: "Lender-prequalified financing ceiling in cents."
        constraints: ">= 0"
      - name: qualification_status
        type: enum
        source: system
        default: PENDING
        description: "Brokerage's own qualification decision, moved only by POST /buyers/{id}/qualify. Allowed moves: PENDING -> APPROVED, PENDING -> REJECTED. APPROVED and REJECTED are terminal; a second qualify call is refused with ERR_INVALID_BUYER_TRANSITION."
        constraints: "PENDING | APPROVED | REJECTED"
      - name: qualified_on
        type: string
        source: system
        default: null
        description: "Logical-clock date (YYYY-MM-DD) on which qualification_status left PENDING; null while PENDING."

  - name: RouteListing
    parent: null
    common_fields: true
    fields:
      - name: seller_id
        type: string
        source: input
        description: "FK -> Seller.id; the route owner engaging the brokerage."
      - name: region_code
        type: string
        source: input
        description: "Brokerage service-region code; exclusivity is scoped per (seller_id, region_code)."
        constraints: "1..20 chars"
      - name: state_code
        type: string
        source: input
        description: "State the route operates in; selects the StateLicenseProfile used at closing."
        constraints: "exactly 2 uppercase letters"
      - name: asking_price_cents
        type: integer
        source: input
        description: "Seller's asking price in cents."
        constraints: ">= 1"
      - name: listed_mrr_cents
        type: integer
        source: input
        description: "Seller-claimed monthly recurring billing for the whole route, in cents; the denominator of the diligence shortfall test."
        constraints: ">= 1"
      - name: listed_account_count
        type: integer
        source: input
        description: "Seller-claimed number of accounts on the route."
        constraints: ">= 1"
      - name: exclusive_start_date
        type: string
        source: input
        description: "First date (inclusive) of the brokerage's exclusive listing interval; ISO date."
        constraints: "YYYY-MM-DD"
      - name: exclusive_end_date
        type: string
        source: input
        description: "End of the exclusive listing interval, EXCLUSIVE; ISO date, strictly after exclusive_start_date."
        constraints: "YYYY-MM-DD; > exclusive_start_date"
      - name: status
        type: enum
        source: system
        description: "Listing lifecycle; see §1.2 RouteListing."
        default: DRAFT
        constraints: "DRAFT | LISTED | UNDER_CONTRACT | CLOSED | WITHDRAWN"
      - name: claimed_recurring_mrr_cents
        type: integer
        source: computed
        description: "Sum of ServiceAccount.claimed_recurring_mrr_cents over accounts of this listing whose verification_status != EXCLUDED."
        default: 0
      - name: claimed_repair_mrr_cents
        type: integer
        source: computed
        description: "Sum of ServiceAccount.avg_monthly_repair_cents over accounts of this listing whose verification_status != EXCLUDED."
        default: 0
      - name: claimed_account_count
        type: integer
        source: computed
        description: "Count of accounts of this listing whose verification_status != EXCLUDED."
        default: 0
      - name: verified_recurring_mrr_cents
        type: integer
        source: computed
        description: "Sum of ServiceAccount.verified_recurring_mrr_cents over accounts of this listing whose verification_status == VERIFIED (each account already rounded to whole cents)."
        default: 0
      - name: verified_repair_mrr_cents
        type: integer
        source: computed
        description: "Sum of ServiceAccount.verified_repair_mrr_cents over accounts of this listing whose verification_status == VERIFIED."
        default: 0
      - name: verified_account_count
        type: integer
        source: computed
        description: "Count of accounts of this listing whose verification_status == VERIFIED."
        default: 0
      - name: verification_posture
        type: enum
        source: computed
        description: "EMPTY when no account of this listing has verification_status == VERIFIED; INCOMPLETE when any account is UNVERIFIED or DISPUTED; COMPLETE only when every account is VERIFIED or EXCLUDED and verified_account_count >= 1."
        default: EMPTY
        constraints: "EMPTY | INCOMPLETE | COMPLETE"
      - name: introductions_completed_count
        type: integer
        source: computed
        description: "Count of accounts of this listing with transfer_status in {INTRODUCED, TRANSFERRED, LOST, REPLACED}; drives introduction_sequence_no."
        default: 0
      - name: withdrawal_reason_code
        type: string
        source: system
        description: "reason_code recorded by POST /route-listings/{id}/withdraw; null otherwise."
        default: null

  - name: ServiceAccount
    parent: null
    common_fields: true
    fields:
      - name: listing_id
        type: string
        source: input
        description: "FK -> RouteListing.id; the route this customer account belongs to."
      - name: deal_id
        type: string
        source: system
        description: "FK -> Deal.id; stamped when the account is introduced to a buyer; null before that."
        default: null
      - name: replaced_account_id
        type: string
        source: system
        description: "FK -> ServiceAccount.id; set on a replacement account created by POST /service-accounts/{id}/replace and pointing at the lost account it substitutes; null on ordinary accounts."
        default: null
      - name: customer_ref
        type: string
        source: input
        description: "Seller's customer reference for the pool being serviced."
        constraints: "1..60 chars; unique per listing_id"
      - name: service_start_date
        type: string
        source: input
        description: "Date service began for this customer; ISO date. Drives account_age_months."
        constraints: "YYYY-MM-DD"
      - name: route_day
        type: enum
        source: input
        description: "Weekday the technician services this pool; primary sort key of the introduction sequence (MON=1 .. FRI=5)."
        constraints: "MON | TUE | WED | THU | FRI"
      - name: monthly_service_fee_cents
        type: integer
        source: input
        description: "Recurring service invoice in cents; interpreted per billing_frequency (a QUARTERLY account bills this amount every three months)."
        constraints: ">= 1"
      - name: avg_monthly_chemical_cents
        type: integer
        source: input
        description: "Average monthly chemical billing in cents; counts as recurring revenue only when chemical_billing_method == INCLUDED."
        constraints: ">= 0"
      - name: avg_monthly_repair_cents
        type: integer
        source: input
        description: "Average monthly repair billing in cents; always valued separately from recurring revenue."
        constraints: ">= 0"
      - name: chemical_billing_method
        type: enum
        source: input
        description: "INCLUDED folds chemicals into the recurring base; PASS_THROUGH bills them at cost and excludes them from the multiple."
        constraints: "INCLUDED | PASS_THROUGH"
      - name: billing_frequency
        type: enum
        source: input
        description: "MONTHLY or QUARTERLY invoicing cadence for monthly_service_fee_cents."
        constraints: "MONTHLY | QUARTERLY"
      - name: claimed_recurring_mrr_cents
        type: integer
        source: computed
        description: "Seller-claimed recurring MRR: see calculations.account_claimed_recurring_mrr."
      - name: verified_recurring_mrr_cents
        type: integer
        source: computed
        description: "Bank-verified recurring MRR from BillingHistoryRecord; null until POST /service-accounts/{id}/verify runs."
        default: null
      - name: verified_repair_mrr_cents
        type: integer
        source: computed
        description: "Bank-verified repair MRR from BillingHistoryRecord; null until verification runs."
        default: null
      - name: verification_variance
        type: number
        source: computed
        description: "abs(verified_recurring_mrr_cents - claimed_recurring_mrr_cents) / claimed_recurring_mrr_cents, 4 decimal places, round_half_up; null until verification runs."
        default: null
      - name: verification_status
        type: enum
        source: system
        description: "Diligence dimension of the account state machine; see §1.2 ServiceAccount/verification_status."
        default: UNVERIFIED
        constraints: "UNVERIFIED | VERIFIED | DISPUTED | EXCLUDED"
      - name: transfer_status
        type: enum
        source: system
        description: "Transfer dimension of the account state machine, evolving independently of verification_status; see §1.2 ServiceAccount/transfer_status."
        default: PENDING
        constraints: "PENDING | INTRODUCED | TRANSFERRED | LOST | REPLACED"
      - name: account_age_months
        type: integer
        source: computed
        description: "Whole months from service_start_date to the logical clock: (clock.year-start.year)*12 + (clock.month-start.month) - (1 if clock.day < start.day else 0); floored at 0."
      - name: introduction_sequence_no
        type: integer
        source: system
        description: "1-based position at which this account was introduced to the buyer; null until introduced."
        default: null
      - name: introduced_on
        type: string
        source: system
        description: "introduction_date supplied to POST /service-accounts/{id}/introduce; ISO date, null until introduced."
        default: null
      - name: current_mrr_cents
        type: integer
        source: computed
        description: "Post-close recurring MRR still on the books: verified_recurring_mrr_cents at close, then reduced by every AttritionEvent.mrr_delta_cents recorded against this account (floored at 0); null before the owning deal closes."
        default: null
      - name: exclusion_reason_code
        type: string
        source: system
        description: "reason_code recorded by POST /service-accounts/{id}/exclude; cleared to null on reinstate."
        default: null

  - name: BillingHistoryRecord
    parent: null
    common_fields: false
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> ServiceAccount.id; the account this month of billing belongs to."
      - name: period_month
        type: string
        source: input
        description: "Calendar month of the billing period, YYYY-MM."
        constraints: "YYYY-MM; unique per (account_id, period_month, source)"
      - name: billed_service_cents
        type: integer
        source: input
        description: "Service amount invoiced that month, in cents."
        constraints: ">= 0"
      - name: billed_chemical_cents
        type: integer
        source: input
        description: "Chemical amount invoiced that month, in cents."
        constraints: ">= 0"
      - name: billed_repair_cents
        type: integer
        source: input
        description: "Repair amount invoiced that month, in cents."
        constraints: ">= 0"
      - name: collected_cents
        type: integer
        source: input
        description: "Cash actually collected against that month's invoices, in cents."
        constraints: ">= 0 and <= billed_service_cents + billed_chemical_cents + billed_repair_cents"
      - name: source
        type: enum
        source: input
        description: "SELLER_UPLOAD is the seller's own export; BANK_VERIFIED is a broker-attested deposit trace and is the only source the verification calculation reads."
        constraints: "SELLER_UPLOAD | BANK_VERIFIED"
      - name: collection_rate
        type: number
        source: computed
        description: "collected_cents / (billed_service_cents + billed_chemical_cents + billed_repair_cents), 4 decimal places, round_half_up; 0.0000 when nothing was billed."
      - name: recurring_collected_cents
        type: integer
        source: computed
        description: "round_half_up((billed_service_cents + (billed_chemical_cents if the account's chemical_billing_method == INCLUDED else 0)) * collection_rate)."
      - name: repair_collected_cents
        type: integer
        source: computed
        description: "round_half_up(billed_repair_cents * collection_rate)."

  - name: RouteValuation
    parent: null
    common_fields: true
    fields:
      - name: listing_id
        type: string
        source: input
        description: "FK -> RouteListing.id; the route valued by this snapshot."
      - name: basis
        type: enum
        source: input
        description: "LISTED_BASIS values the seller's claimed figures; VERIFIED_BASIS values only bank-verified accounts."
        constraints: "LISTED_BASIS | VERIFIED_BASIS"
      - name: recurring_mrr_cents
        type: integer
        source: computed
        description: "Recurring MRR of the basis input set; see calculations.route_valuation."
      - name: repair_mrr_cents
        type: integer
        source: computed
        description: "Repair MRR of the basis input set."
      - name: account_count
        type: integer
        source: computed
        description: "Number of accounts in the basis input set."
      - name: weighted_avg_account_age_months
        type: integer
        source: computed
        description: "Recurring-MRR-weighted average account age in whole months, floored."
      - name: base_multiple
        type: number
        source: computed
        description: "Tier multiple selected by recurring_mrr_cents."
      - name: age_adjustment
        type: number
        source: computed
        description: "Adjustment added to base_multiple from weighted_avg_account_age_months."
      - name: effective_multiple
        type: number
        source: computed
        description: "clamp(base_multiple + age_adjustment, MULTIPLE_FLOOR, MULTIPLE_CAP), 1 decimal place."
      - name: recurring_component_cents
        type: integer
        source: computed
        description: "round_half_up(recurring_mrr_cents * effective_multiple)."
      - name: repair_component_cents
        type: integer
        source: computed
        description: "round_half_up(repair_mrr_cents * REPAIR_MULTIPLE)."
      - name: valuation_cents
        type: integer
        source: computed
        description: "recurring_component_cents + repair_component_cents."
      - name: is_superseded
        type: boolean
        source: system
        description: "true once a newer valuation of the same basis exists for the listing."
        default: false
      - name: computed_from_clock_utc
        type: datetime
        source: system
        description: "Logical clock reading used for the account-age inputs of this snapshot."

  - name: Deal
    parent: null
    common_fields: true
    fields:
      - name: listing_id
        type: string
        source: input
        description: "FK -> RouteListing.id; the route being bought."
      - name: buyer_id
        type: string
        source: input
        description: "FK -> Buyer.id; the acquiring party."
      - name: offer_round
        type: integer
        source: system
        description: "Negotiation round counter; 1 at creation, +1 on every counter-offer and on every revised offer."
        default: 1
      - name: current_offer_price_cents
        type: integer
        source: system
        description: "Price currently on the table in cents; rewritten by each offer/counter-offer and frozen at accept."
      - name: financing_type
        type: enum
        source: input
        description: "CASH, SELLER_NOTE, BANK_LOAN or SBA; selects MIN_DOWN_PCT."
        constraints: "CASH | SELLER_NOTE | BANK_LOAN | SBA"
      - name: down_payment_cents
        type: integer
        source: input
        description: "Cash the buyer will place into escrow at closing, in cents."
        constraints: ">= 0"
      - name: note_principal_cents
        type: integer
        source: input
        description: "Financed principal in cents; must be 0 for CASH."
        constraints: ">= 0"
      - name: lender_name
        type: string
        source: system
        description: "Lender recorded by POST /deals/{id}/approve-financing; null before approval."
        default: null
      - name: approved_amount_cents
        type: integer
        source: system
        description: "Financing amount approved at POST /deals/{id}/approve-financing; null before approval."
        default: null
      - name: retention_guarantee_days
        type: integer
        source: input
        description: "Length of the seller's account-retention guarantee, in days from closing."
        constraints: ">= 30 and <= 365"
      - name: status
        type: enum
        source: system
        description: "Deal lifecycle; see §1.2 Deal."
        default: OFFER_SUBMITTED
        constraints: "OFFER_SUBMITTED | COUNTERED | REPRICE_REQUIRED | ACCEPTED | DILIGENCE_CLEARED | FINANCING_APPROVED | ESCROW_FUNDED | CLOSED | GUARANTEE_CLOSED | TERMINATED"
      - name: clawback_status
        type: enum
        source: system
        description: "Retention-guarantee ledger state. NOT_APPLICABLE until closing; MONITORING from closing; CLAWBACK_TRIGGERED once net attrition exceeds the free allowance; SETTLED once a ClawbackSettlement settles."
        default: NOT_APPLICABLE
        constraints: "NOT_APPLICABLE | MONITORING | CLAWBACK_TRIGGERED | SETTLED"
      - name: accepted_on
        type: string
        source: system
        description: "Logical-clock date on which the seller accepted; opens the introduction window. Null before acceptance."
        default: null
      - name: closed_at_utc
        type: datetime
        source: system
        description: "Logical clock reading at closing; null before closing."
        default: null
      - name: guarantee_start_utc
        type: datetime
        source: system
        description: "== closed_at_utc; start of the retention guarantee window (inclusive)."
        default: null
      - name: guarantee_end_utc
        type: datetime
        source: system
        description: "guarantee_start_utc + retention_guarantee_days, EXCLUSIVE end of the retention guarantee window."
        default: null
      - name: replacement_deadline_utc
        type: datetime
        source: system
        description: "guarantee_end_utc + REPLACEMENT_GRACE_DAYS; last instant a replacement account may be offered."
        default: null
      - name: holdback_release_utc
        type: datetime
        source: system
        description: "== guarantee_end_utc; earliest instant the escrow holdback may be released. Null before closing."
        default: null
      - name: effective_multiple_at_close
        type: number
        source: system
        description: "effective_multiple of the non-superseded VERIFIED_BASIS RouteValuation of the listing at closing; the per-MRR price used by REPLACEMENT_BASIS clawback math."
        default: null
      - name: commission_cents
        type: integer
        source: computed
        description: "Brokerage commission fixed at closing; see calculations.broker_commission."
        default: null
      - name: holdback_cents
        type: integer
        source: computed
        description: "Retention holdback fixed at acceptance; see calculations.deal_escrow_structure."
        default: null
      - name: escrow_target_amount_cents
        type: integer
        source: computed
        description: "down_payment_cents + holdback_cents; the EscrowAccount funding target."
        default: null
      - name: clawback_cap_cents
        type: integer
        source: computed
        description: "round_half_up(current_offer_price_cents * CLAWBACK_CAP_PCT) fixed at closing; ceiling on any settlement adjustment."
        default: null
      - name: guaranteed_mrr_cents
        type: integer
        source: computed
        description: "Sum of verified_recurring_mrr_cents over accounts of this deal with transfer_status == TRANSFERRED at the instant of closing; conserved thereafter."
        default: null
      - name: attrited_mrr_cents
        type: integer
        source: computed
        description: "Gross recurring MRR lost inside the guarantee window after RECOVERED offsets; see calculations.deal_attrition_ledger."
        default: 0
      - name: retained_mrr_cents
        type: integer
        source: computed
        description: "guaranteed_mrr_cents - attrited_mrr_cents; the conserved half of the retention invariant."
        default: null
      - name: replacement_mrr_cents
        type: integer
        source: computed
        description: "Sum of claimed_recurring_mrr_cents over replacement accounts of this deal (replaced_account_id != null, transfer_status == TRANSFERRED)."
        default: 0
      - name: net_attrition_mrr_cents
        type: integer
        source: computed
        description: "Attrition after RECOVERED offsets and capped replacement credit, before the free allowance; see calculations.deal_attrition_ledger."
        default: 0
      - name: allowance_mrr_cents
        type: integer
        source: computed
        description: "round_half_up(guaranteed_mrr_cents * FREE_ALLOWANCE_PCT); natural attrition inside this band is not compensable."
        default: null
      - name: attrition_pct
        type: number
        source: computed
        description: "net_attrition_mrr_cents / guaranteed_mrr_cents, 4 decimal places, round_half_up; 0.0000 before closing."
        default: 0
      - name: non_solicitation_executed_on
        type: string
        source: system
        description: "executed_on date of the seller's non-solicitation covenant; null until acceptance stamps it."
        default: null
      - name: non_solicitation_end_date
        type: string
        source: system
        description: "non_solicitation_executed_on plus covenant_term_months whole months; null until the covenant is executed."
        default: null
      - name: repricing_reason_code
        type: string
        source: system
        description: "Set to VERIFIED_VALUATION_BELOW_OFFER when the diligence cascade forces REPRICE_REQUIRED; null otherwise."
        default: null
      - name: termination_reason_code
        type: string
        source: system
        description: "reason_code recorded by POST /deals/{id}/terminate; null otherwise."
        default: null

  - name: EscrowAccount
    parent: null
    common_fields: true
    fields:
      - name: deal_id
        type: string
        source: system
        description: "FK -> Deal.id; the deal whose funds this escrow holds. Created by the deal-acceptance cascade, never by a direct POST."
      - name: target_amount_cents
        type: integer
        source: computed
        description: "Deal.escrow_target_amount_cents at acceptance; recomputed to 0 when the deal is thrown back to REPRICE_REQUIRED."
      - name: funded_amount_cents
        type: integer
        source: computed
        description: "Sum of accepted deposit amounts, in cents."
        default: 0
      - name: holdback_amount_cents
        type: integer
        source: computed
        description: "Deal.holdback_cents at acceptance; the slice withheld at closing."
      - name: holdback_balance_cents
        type: integer
        source: computed
        description: "Holdback still sitting in escrow; equals holdback_amount_cents from closing until a settlement or holdback release draws it down."
        default: 0
      - name: undisbursed_balance_cents
        type: integer
        source: computed
        description: "Cash still sitting in escrow that has NOT yet been assigned to any bucket: equals funded_amount_cents from the first deposit until the closing disbursement (or the terminate refund) drives it to 0. Exists so that calculations.escrow_conservation_invariant is a total identity at every instant, including the FUNDED-but-not-yet-closed window."
        default: 0
      - name: disbursed_to_broker_cents
        type: integer
        source: computed
        description: "Cumulative commission paid out of escrow."
        default: 0
      - name: disbursed_to_seller_cents
        type: integer
        source: computed
        description: "Cumulative proceeds paid to the seller out of escrow."
        default: 0
      - name: disbursed_to_buyer_cents
        type: integer
        source: computed
        description: "Cumulative amount returned to the buyer (clawback draw or full refund)."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Escrow lifecycle; see §1.2 EscrowAccount."
        default: OPEN
        constraints: "OPEN | FUNDED | PARTIALLY_RELEASED | RELEASED | REFUNDED"
      - name: funded_by_user_id
        type: string
        source: system
        description: "X-User-ID of the EscrowAgent that recorded the first deposit; the segregation-of-duties counterparty. Opaque operator id, never an entity id."
        default: null
      - name: deposits_blocked
        type: boolean
        source: system
        description: "true while the deal sits in REPRICE_REQUIRED or TERMINATED; deposits are refused."
        default: false
      - name: holdback_release_blocked
        type: boolean
        source: system
        description: "true once the deal's clawback_status becomes CLAWBACK_TRIGGERED; a plain holdback release is refused until the settlement settles."
        default: false
      - name: scheduled_holdback_release_utc
        type: datetime
        source: system
        description: "Deal.holdback_release_utc copied at closing; cleared to null when holdback_release_blocked flips true."
        default: null

  - name: LicenseTransfer
    parent: null
    common_fields: true
    fields:
      - name: deal_id
        type: string
        source: system
        description: "FK -> Deal.id; the deal this permit belongs to. Created by the deal-acceptance cascade, never by a direct POST."
      - name: state_profile_id
        type: string
        source: system
        description: "FK -> StateLicenseProfile.id; the profile whose required_permit_types produced this row."
      - name: permit_type
        type: enum
        source: system
        description: "One entry of the profile's required_permit_types."
        constraints: "PESTICIDE_APPLICATOR | CONTRACTOR | BUSINESS_TAX"
      - name: status
        type: enum
        source: system
        description: "Permit transfer lifecycle; see §1.2 LicenseTransfer."
        default: NOT_STARTED
        constraints: "NOT_STARTED | APPLIED | APPROVED | DENIED | WAIVED | CANCELLED"
      - name: applied_on
        type: string
        source: system
        description: "applied_on date of the current attempt; ISO date, null before the first application."
        default: null
      - name: processing_window_end
        type: string
        source: computed
        description: "applied_on + StateLicenseProfile.transfer_processing_days, INCLUSIVE last day of the regulator's window; null while not APPLIED."
        default: null
      - name: decided_on
        type: string
        source: system
        description: "decided_on date of the regulator's decision; ISO date, null until decided."
        default: null
      - name: denial_reason_code
        type: string
        source: system
        description: "reason_code of the last denial; retained across a retry."
        default: null
      - name: attempt_count
        type: integer
        source: system
        description: "Number of applications filed on this permit."
        default: 0
      - name: waiver_basis
        type: string
        source: system
        description: "RECIPROCITY_<state_code> recorded when the permit is waived; null otherwise."
        default: null

  - name: AttritionEvent
    parent: null
    common_fields: false
    fields:
      - name: deal_id
        type: string
        source: input
        description: "FK -> Deal.id; the closed deal whose guarantee window this event falls in."
      - name: account_id
        type: string
        source: input
        description: "FK -> ServiceAccount.id; the transferred account that moved."
      - name: event_type
        type: enum
        source: input
        description: "CANCELLED loses the whole account; DOWNGRADED loses part of its billing; RECOVERED gives billing back."
        constraints: "CANCELLED | DOWNGRADED | RECOVERED"
      - name: effective_date
        type: string
        source: input
        description: "Date the change took effect; ISO date, must fall inside the deal's guarantee window."
        constraints: "YYYY-MM-DD"
      - name: mrr_delta_cents
        type: integer
        source: input
        description: "Signed change in recurring MRR: negative for CANCELLED and DOWNGRADED, positive for RECOVERED."
        constraints: "!= 0; < 0 for CANCELLED/DOWNGRADED; > 0 for RECOVERED"
      - name: attributed_to
        type: enum
        source: input
        description: "NATURAL churn, SELLER_SOLICITATION (a breach of the covenant, penalised and denied the free allowance) or BUYER_SERVICE_FAILURE (excluded from all compensation)."
        constraints: "NATURAL | SELLER_SOLICITATION | BUYER_SERVICE_FAILURE"
      - name: recorded_by_role
        type: enum
        source: system
        description: "X-User-Role of the caller that appended this event."
        constraints: "Buyer | Broker"

  - name: ClawbackSettlement
    parent: null
    common_fields: true
    fields:
      - name: deal_id
        type: string
        source: input
        description: "FK -> Deal.id; the deal being settled."
      - name: remedy_basis
        type: enum
        source: input
        description: "REPLACEMENT_BASIS prices compensable MRR at the deal's closing multiple; PRICE_ADJUSTMENT_BASIS pro-rates the closing price by the compensable attrition percentage."
        constraints: "REPLACEMENT_BASIS | PRICE_ADJUSTMENT_BASIS"
      - name: status
        type: enum
        source: system
        description: "Settlement lifecycle; see §1.2 ClawbackSettlement."
        default: DRAFT
        constraints: "DRAFT | PROPOSED | DISPUTED | SETTLED"
      - name: computed_from_clock_utc
        type: datetime
        source: system
        description: "Logical clock reading of the last (re)computation of this settlement."
      - name: guaranteed_mrr_cents
        type: integer
        source: computed
        description: "Deal.guaranteed_mrr_cents snapshotted into the settlement."
      - name: lost_natural_mrr_cents
        type: integer
        source: computed
        description: "Natural attrition after RECOVERED offsets (n1 in calculations.clawback_settlement)."
      - name: lost_solicited_mrr_cents
        type: integer
        source: computed
        description: "Seller-solicited attrition after RECOVERED offsets (s1)."
      - name: lost_buyer_fault_mrr_cents
        type: integer
        source: computed
        description: "Attrition attributed to BUYER_SERVICE_FAILURE; reported but never compensable."
      - name: recovered_mrr_cents
        type: integer
        source: computed
        description: "Sum of RECOVERED deltas inside the window."
      - name: replacement_credit_cap_cents
        type: integer
        source: computed
        description: "round_half_up(REPLACEMENT_CAP_PCT * (lost_natural_mrr_cents + lost_solicited_mrr_cents))."
      - name: replacement_credit_mrr_cents
        type: integer
        source: computed
        description: "min(Deal.replacement_mrr_cents, replacement_credit_cap_cents)."
      - name: allowance_mrr_cents
        type: integer
        source: computed
        description: "Deal.allowance_mrr_cents snapshotted into the settlement."
      - name: compensable_natural_mrr_cents
        type: integer
        source: computed
        description: "Natural attrition after credit and allowance (n3)."
      - name: compensable_solicited_mrr_cents
        type: integer
        source: computed
        description: "Solicited attrition after credit, with no allowance (s2)."
      - name: raw_adjustment_cents
        type: integer
        source: computed
        description: "Basis-specific adjustment before the clawback cap."
      - name: adjustment_cents
        type: integer
        source: computed
        description: "min(raw_adjustment_cents, Deal.clawback_cap_cents); the amount the buyer is owed."
      - name: from_holdback_cents
        type: integer
        source: computed
        description: "First waterfall bucket: min(adjustment_cents, EscrowAccount.holdback_balance_cents)."
      - name: from_note_principal_cents
        type: integer
        source: computed
        description: "Second bucket: min(adjustment_cents - from_holdback_cents, Deal.note_principal_cents)."
      - name: seller_direct_due_cents
        type: integer
        source: computed
        description: "Third bucket: the remainder the seller owes in cash."
      - name: holdback_release_to_seller_cents
        type: integer
        source: computed
        description: "EscrowAccount.holdback_balance_cents - from_holdback_cents; released to the seller at settlement."
      - name: dispute_reason_code
        type: string
        source: system
        description: "dispute_reason_code recorded by POST /clawback-settlements/{id}/dispute; retained across a re-proposal."
        default: null
      - name: settled_at_utc
        type: datetime
        source: system
        description: "Logical clock reading at settlement; null until SETTLED."
        default: null

# =============================================================================
# §1.2 State Machine Table
#
# Five machines over four entities. ServiceAccount carries TWO independent
# dimensions (verification_status x transfer_status) on the same row, so it
# appears twice with an explicit `state_field:`.
# =============================================================================
state_machines:

  - entity: RouteListing
    state_field: status
    initial_state: DRAFT
    terminal_states: [CLOSED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: LISTED
        trigger: "POST /route-listings/{id}/publish"
        actor: Broker
        preconditions:
          - "claimed_account_count >= 1"
          - "a RouteValuation exists for this listing with basis == LISTED_BASIS and is_superseded == false"
          - "Seller.status == ACTIVE for the listing's seller_id"
        side_effects:
          - "RouteListing.status = LISTED"
          - "increments RouteListing.version by 1"
      - from: LISTED
        to: UNDER_CONTRACT
        trigger: "system, cascaded from POST /deals/{id}/accept"
        actor: system
        preconditions:
          - "the accepting Deal.listing_id == this listing"
        side_effects:
          - "RouteListing.status = UNDER_CONTRACT"
          - "increments RouteListing.version by 1"
      - from: UNDER_CONTRACT
        to: LISTED
        trigger: "system, cascaded from POST /deals/{id}/terminate"
        actor: system
        preconditions:
          - "no other Deal on this listing has status in {ACCEPTED, DILIGENCE_CLEARED, FINANCING_APPROVED, ESCROW_FUNDED}"
        side_effects:
          - "RouteListing.status = LISTED (the route returns to the market — cyclic)"
          - "increments RouteListing.version by 1"
        note: "Cycle LISTED -> UNDER_CONTRACT -> LISTED."
      - from: UNDER_CONTRACT
        to: CLOSED
        trigger: "system, cascaded from POST /deals/{id}/close"
        actor: system
        preconditions:
          - "the closing Deal.listing_id == this listing"
        side_effects:
          - "RouteListing.status = CLOSED"
          - "increments RouteListing.version by 1"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /route-listings/{id}/withdraw"
        actor: Broker | Seller
        preconditions:
          - "acting Seller (when the actor is a Seller) owns the listing"
        side_effects:
          - "RouteListing.status = WITHDRAWN; withdrawal_reason_code = reason_code"
          - "increments RouteListing.version by 1"
      - from: LISTED
        to: WITHDRAWN
        trigger: "POST /route-listings/{id}/withdraw"
        actor: Broker | Seller
        preconditions:
          - "no Deal on this listing has status in {ACCEPTED, DILIGENCE_CLEARED, FINANCING_APPROVED, ESCROW_FUNDED}"
        side_effects:
          - "RouteListing.status = WITHDRAWN; withdrawal_reason_code = reason_code"
          - "every Deal on this listing with status in {OFFER_SUBMITTED, COUNTERED, REPRICE_REQUIRED} moves to TERMINATED with termination_reason_code = LISTING_WITHDRAWN (conditional cascade: terminal deals are untouched)"
          - "increments RouteListing.version by 1"

  - entity: ServiceAccount
    state_field: verification_status
    initial_state: UNVERIFIED
    terminal_states: []
    transitions:
      - from: UNVERIFIED
        to: VERIFIED
        trigger: "POST /service-accounts/{id}/verify"
        actor: Broker
        preconditions:
          - "at least VERIFICATION_TRAILING_MONTHS BillingHistoryRecord rows with source == BANK_VERIFIED exist for this account, one per month of the trailing window defined in calculations.account_billing_verification"
          - "verification_variance computed by that calculation <= VERIFY_TOLERANCE"
        side_effects:
          - "writes ServiceAccount.verified_recurring_mrr_cents, verified_repair_mrr_cents, verification_variance"
          - "ServiceAccount.verification_status = VERIFIED"
          - "recomputes RouteListing.verified_recurring_mrr_cents, verified_repair_mrr_cents, verified_account_count and verification_posture on the parent listing, and increments RouteListing.version by 1"
      - from: UNVERIFIED
        to: DISPUTED
        trigger: "POST /service-accounts/{id}/verify"
        actor: Broker
        preconditions:
          - "the trailing window is complete (same as above)"
          - "verification_variance > VERIFY_TOLERANCE"
        side_effects:
          - "writes verified_recurring_mrr_cents, verified_repair_mrr_cents, verification_variance"
          - "ServiceAccount.verification_status = DISPUTED"
          - "recomputes the parent listing's verification_posture to INCOMPLETE and increments RouteListing.version by 1"
      - from: DISPUTED
        to: VERIFIED
        trigger: "POST /service-accounts/{id}/verify"
        actor: Broker
        preconditions:
          - "fresh BANK_VERIFIED BillingHistoryRecord rows now bring verification_variance <= VERIFY_TOLERANCE"
        side_effects:
          - "same recompute as UNVERIFIED -> VERIFIED (cycle DISPUTED -> VERIFIED)"
      - from: VERIFIED
        to: DISPUTED
        trigger: "POST /service-accounts/{id}/verify"
        actor: Broker
        preconditions:
          - "a re-run over the current trailing window yields verification_variance > VERIFY_TOLERANCE"
        side_effects:
          - "ServiceAccount.verification_status = DISPUTED; the account leaves the listing's verified set, so RouteListing.verified_recurring_mrr_cents and verification_posture are recomputed and RouteListing.version increments by 1"
      - from: UNVERIFIED
        to: EXCLUDED
        trigger: "POST /service-accounts/{id}/exclude"
        actor: Broker
        preconditions:
          - "the parent RouteListing.status is not CLOSED and not WITHDRAWN"
        side_effects:
          - "ServiceAccount.verification_status = EXCLUDED; exclusion_reason_code = reason_code"
          - "recomputes the parent listing's claimed_* rollups, verified_* rollups and verification_posture; increments RouteListing.version by 1"
      - from: DISPUTED
        to: EXCLUDED
        trigger: "POST /service-accounts/{id}/exclude"
        actor: Broker
        preconditions:
          - "the parent RouteListing.status is not CLOSED and not WITHDRAWN"
        side_effects:
          - "ServiceAccount.verification_status = EXCLUDED; exclusion_reason_code = reason_code"
          - "recomputes the parent listing's rollups; verification_posture can now reach COMPLETE; increments RouteListing.version by 1"
      - from: VERIFIED
        to: EXCLUDED
        trigger: "POST /service-accounts/{id}/exclude"
        actor: Broker
        preconditions:
          - "the parent RouteListing.status is not CLOSED and not WITHDRAWN"
        side_effects:
          - "HOP 1: ServiceAccount.verification_status = EXCLUDED; exclusion_reason_code = reason_code"
          - "HOP 2: because the account left the verified set, RouteListing.verified_recurring_mrr_cents / verified_repair_mrr_cents / verified_account_count / claimed_* / verification_posture are recomputed and RouteListing.version increments by 1"
          - "HOP 3: because RouteListing.verified_recurring_mrr_cents changed, the listing's non-superseded VERIFIED_BASIS RouteValuation (if any) gets is_superseded = true and a fresh VERIFIED_BASIS RouteValuation is created from the new verified set via calculations.route_valuation"
          - "HOP 4: because a new VERIFIED_BASIS valuation exists, every Deal on this listing with status in {ACCEPTED, DILIGENCE_CLEARED} whose current_offer_price_cents fails calculations.reprice_trigger_test moves to REPRICE_REQUIRED with repricing_reason_code = VERIFIED_VALUATION_BELOW_OFFER, and Deal.version increments by 1"
          - "HOP 5: because that Deal left ACCEPTED/DILIGENCE_CLEARED, its EscrowAccount (status OPEN) has target_amount_cents recomputed to 0 and deposits_blocked = true, and EscrowAccount.version increments by 1"
        note: "The depth-5 diligence cascade. Each hop is caused by the previous hop's mutation, not by the original exclude call."
      - from: EXCLUDED
        to: UNVERIFIED
        trigger: "POST /service-accounts/{id}/reinstate"
        actor: Broker
        preconditions:
          - "the parent RouteListing.status is not CLOSED and not WITHDRAWN"
        side_effects:
          - "ServiceAccount.verification_status = UNVERIFIED; exclusion_reason_code = null; verified_* fields and verification_variance are cleared to null"
          - "recomputes the parent listing's claimed_* rollups and verification_posture; increments RouteListing.version by 1"
        note: "Compensating action for exclude; cycle EXCLUDED -> UNVERIFIED. Restores RouteListing.claimed_recurring_mrr_cents exactly."

  - entity: ServiceAccount
    state_field: transfer_status
    initial_state: PENDING
    terminal_states: [REPLACED]
    transitions:
      - from: PENDING
        to: INTRODUCED
        trigger: "POST /service-accounts/{id}/introduce"
        actor: Broker | Seller
        preconditions:
          - "Deal.status == ACCEPTED or DILIGENCE_CLEARED or FINANCING_APPROVED or ESCROW_FUNDED for the deal_id in the body"
          - "Deal.non_solicitation_executed_on != null"
          - "ServiceAccount.verification_status != EXCLUDED"
          - "ServiceAccount.listing_id == Deal.listing_id"
          - "this account is the head of the introduction queue defined in calculations.introduction_sequence_selector"
          - "introduction_date lies inside the deal's introduction window and the per-date capacity is not exhausted (§1.4 priorities 47 and 48)"
        side_effects:
          - "ServiceAccount.transfer_status = INTRODUCED; deal_id = body deal_id; introduced_on = introduction_date; introduction_sequence_no = RouteListing.introductions_completed_count + 1"
          - "increments RouteListing.introductions_completed_count by 1 and RouteListing.version by 1"
      - from: INTRODUCED
        to: TRANSFERRED
        trigger: "system, cascaded from POST /deals/{id}/close"
        actor: system
        preconditions:
          - "ServiceAccount.deal_id == the closing deal"
        side_effects:
          - "ServiceAccount.transfer_status = TRANSFERRED; current_mrr_cents = verified_recurring_mrr_cents"
      - from: TRANSFERRED
        to: LOST
        trigger: "system, cascaded from POST /attrition-events with event_type == CANCELLED"
        actor: system
        preconditions:
          - "the event's effective_date lies inside the deal's guarantee window"
        side_effects:
          - "HOP 1: ServiceAccount.transfer_status = LOST; current_mrr_cents = 0"
          - "HOP 2: because the account left the retained set, Deal.attrited_mrr_cents / retained_mrr_cents / net_attrition_mrr_cents / attrition_pct are recomputed by calculations.deal_attrition_ledger and Deal.version increments by 1"
          - "HOP 3: because net_attrition_mrr_cents now exceeds Deal.allowance_mrr_cents, Deal.clawback_status = CLAWBACK_TRIGGERED and the deal's EscrowAccount gets holdback_release_blocked = true (EscrowAccount.version increments by 1)"
          - "HOP 4: because holdback_release_blocked flipped true, EscrowAccount.scheduled_holdback_release_utc is cleared to null so the holdback can only leave escrow through a ClawbackSettlement"
        note: "The depth-4 post-close attrition cascade; a different trigger from the diligence cascade."
      - from: TRANSFERRED
        to: TRANSFERRED
        trigger: "system, cascaded from POST /attrition-events with event_type == DOWNGRADED"
        actor: system
        preconditions:
          - "the event's effective_date lies inside the deal's guarantee window"
        side_effects:
          - "ServiceAccount.current_mrr_cents = max(0, current_mrr_cents - abs(mrr_delta_cents)); transfer_status is unchanged"
          - "recomputes the Deal attrition ledger (same HOP 2..HOP 4 chain when the allowance is breached)"
      - from: LOST
        to: TRANSFERRED
        trigger: "system, cascaded from POST /attrition-events with event_type == RECOVERED"
        actor: system
        preconditions:
          - "the account's transfer_status == LOST and the event's effective_date lies inside the guarantee window"
        side_effects:
          - "ServiceAccount.transfer_status = TRANSFERRED; current_mrr_cents = min(verified_recurring_mrr_cents, current_mrr_cents + mrr_delta_cents)"
          - "recomputes the Deal attrition ledger; when net_attrition_mrr_cents falls back to or below Deal.allowance_mrr_cents, Deal.clawback_status returns to MONITORING and the escrow's holdback_release_blocked returns to false with scheduled_holdback_release_utc restored to Deal.holdback_release_utc"
        note: "Compensating action for the CANCELLED cascade; cycle TRANSFERRED -> LOST -> TRANSFERRED."
      - from: LOST
        to: REPLACED
        trigger: "POST /service-accounts/{id}/replace"
        actor: Seller | Broker
        preconditions:
          - "the logical clock is at or before Deal.replacement_deadline_utc (inclusive of the deadline instant; §1.4 priority 63)"
          - "Deal.status == CLOSED"
        side_effects:
          - "the lost account's transfer_status = REPLACED"
          - "a new ServiceAccount is created on the same listing_id with replaced_account_id = the lost account, deal_id = the deal, route_day = the supplied route_day, verification_status = VERIFIED, transfer_status = TRANSFERRED, verified_recurring_mrr_cents = claimed_recurring_mrr_cents of the replacement inputs"
          - "recomputes Deal.replacement_mrr_cents, net_attrition_mrr_cents and attrition_pct; increments Deal.version by 1"
          - "when the recomputed net_attrition_mrr_cents falls back to or below Deal.allowance_mrr_cents, Deal.clawback_status returns to MONITORING and the escrow's holdback_release_blocked returns to false with scheduled_holdback_release_utc restored to Deal.holdback_release_utc (the exact mirror of the AttritionEvent HOP 3 / HOP 4 pair)"

  - entity: Deal
    state_field: status
    initial_state: OFFER_SUBMITTED
    terminal_states: [GUARANTEE_CLOSED, TERMINATED]
    transitions:
      - from: OFFER_SUBMITTED
        to: COUNTERED
        trigger: "POST /deals/{id}/counter-offers"
        actor: Seller
        preconditions:
          - "acting Seller owns the listing (RouteListing.seller_id == X-User-ID)"
          - "counter_price_cents > current_offer_price_cents (a seller counter must move the price up; equal or lower is ERR_COUNTER_NOT_IMPROVED)"
        side_effects:
          - "Deal.current_offer_price_cents = counter_price_cents; offer_round += 1; status = COUNTERED"
          - "increments Deal.version by 1"
      - from: COUNTERED
        to: OFFER_SUBMITTED
        trigger: "POST /deals/{id}/offers"
        actor: Buyer
        preconditions:
          - "acting Buyer owns the deal (Deal.buyer_id == X-User-ID)"
          - "down_payment_cents + note_principal_cents == offer_price_cents"
          - "offer_price_cents < current_offer_price_cents (a buyer re-offer must move the price down)"
        side_effects:
          - "Deal.current_offer_price_cents = offer_price_cents; down_payment_cents / note_principal_cents rewritten; offer_round += 1; status = OFFER_SUBMITTED"
          - "increments Deal.version by 1"
        note: "Negotiation cycle OFFER_SUBMITTED -> COUNTERED -> OFFER_SUBMITTED, unbounded in rounds."
      - from: OFFER_SUBMITTED
        to: ACCEPTED
        trigger: "POST /deals/{id}/accept"
        actor: Seller
        preconditions:
          - "acting Seller owns the listing"
          - "RouteListing.status == LISTED"
          - "down_payment_cents >= round_half_up(current_offer_price_cents * MIN_DOWN_PCT[financing_type])"
        side_effects:
          - "Deal.status = ACCEPTED; accepted_on = the logical clock's date"
          - "computes Deal.holdback_cents and escrow_target_amount_cents via calculations.deal_escrow_structure"
          - "creates exactly one EscrowAccount for this deal with status OPEN, target_amount_cents = Deal.escrow_target_amount_cents, holdback_amount_cents = Deal.holdback_cents"
          - "creates one LicenseTransfer with status NOT_STARTED per entry of the StateLicenseProfile.required_permit_types matching RouteListing.state_code (fan-out, not a transitive cascade)"
          - "cascades RouteListing.status LISTED -> UNDER_CONTRACT"
          - "every OTHER Deal on the listing with status in {OFFER_SUBMITTED, COUNTERED, REPRICE_REQUIRED} moves to TERMINATED with termination_reason_code = COMPETING_OFFER_ACCEPTED"
          - "increments Deal.version by 1"
      - from: ACCEPTED
        to: REPRICE_REQUIRED
        trigger: "system, HOP 4 of the ServiceAccount VERIFIED -> EXCLUDED cascade"
        actor: system
        preconditions:
          - "the listing's fresh VERIFIED_BASIS valuation fails calculations.reprice_trigger_test against current_offer_price_cents"
        side_effects:
          - "Deal.status = REPRICE_REQUIRED; repricing_reason_code = VERIFIED_VALUATION_BELOW_OFFER"
          - "cascades into the deal's EscrowAccount (HOP 5): target_amount_cents = 0, deposits_blocked = true"
          - "increments Deal.version by 1"
      - from: DILIGENCE_CLEARED
        to: REPRICE_REQUIRED
        trigger: "system, HOP 4 of the ServiceAccount VERIFIED -> EXCLUDED cascade"
        actor: system
        preconditions:
          - "same as above"
        side_effects:
          - "same as ACCEPTED -> REPRICE_REQUIRED"
      - from: REPRICE_REQUIRED
        to: OFFER_SUBMITTED
        trigger: "POST /deals/{id}/offers"
        actor: Buyer
        preconditions:
          - "acting Buyer owns the deal"
          - "down_payment_cents + note_principal_cents == offer_price_cents"
        side_effects:
          - "Deal.current_offer_price_cents = offer_price_cents; offer_round += 1; status = OFFER_SUBMITTED; repricing_reason_code = null"
          - "the deal's EscrowAccount returns to deposits_blocked = false with target_amount_cents = 0 until the next acceptance recomputes it"
          - "cascades RouteListing.status UNDER_CONTRACT -> LISTED"
          - "increments Deal.version by 1"
        note: "Revision cycle: the diligence cascade throws an accepted deal back to the negotiating table."
      - from: ACCEPTED
        to: DILIGENCE_CLEARED
        trigger: "POST /deals/{id}/clear-diligence"
        actor: Broker
        preconditions:
          - "the body's valuation_id names a RouteValuation whose listing_id == Deal.listing_id, basis == VERIFIED_BASIS and is_superseded == false"
          - "RouteListing.verification_posture == COMPLETE (cross-entity)"
          - "RouteListing.verified_recurring_mrr_cents >= round_half_up(MIN_VERIFIED_RATIO * RouteListing.listed_mrr_cents)"
        side_effects:
          - "Deal.status = DILIGENCE_CLEARED"
          - "increments Deal.version by 1"
      - from: DILIGENCE_CLEARED
        to: FINANCING_APPROVED
        trigger: "POST /deals/{id}/approve-financing"
        actor: Broker
        preconditions:
          - "approved_amount_cents == note_principal_cents"
          - "approved_amount_cents <= Buyer.prequalified_amount_cents (cross-entity)"
        side_effects:
          - "Deal.status = FINANCING_APPROVED; lender_name and approved_amount_cents written"
          - "increments Deal.version by 1"
      - from: FINANCING_APPROVED
        to: ESCROW_FUNDED
        trigger: "system, cascaded from POST /escrow-accounts/{id}/deposits"
        actor: system
        preconditions:
          - "EscrowAccount.funded_amount_cents == EscrowAccount.target_amount_cents after the deposit"
        side_effects:
          - "EscrowAccount.status = FUNDED"
          - "Deal.status = ESCROW_FUNDED"
          - "increments Deal.version by 1"
      - from: ESCROW_FUNDED
        to: CLOSED
        trigger: "POST /deals/{id}/close"
        actor: Broker
        preconditions:
          - "every LicenseTransfer of this deal has status in {APPROVED, WAIVED} (cross-entity fork-join)"
          - "every ServiceAccount of the listing with verification_status != EXCLUDED has transfer_status == INTRODUCED"
          - "EscrowAccount.funded_amount_cents >= EscrowAccount.target_amount_cents"
        side_effects:
          - "Deal.closed_at_utc = guarantee_start_utc = the logical clock; guarantee_end_utc = holdback_release_utc = clock + retention_guarantee_days; replacement_deadline_utc = guarantee_end_utc + REPLACEMENT_GRACE_DAYS"
          - "Deal.commission_cents computed by calculations.broker_commission; clawback_cap_cents = round_half_up(current_offer_price_cents * CLAWBACK_CAP_PCT); effective_multiple_at_close copied from the listing's non-superseded VERIFIED_BASIS RouteValuation"
          - "every ServiceAccount of this deal moves INTRODUCED -> TRANSFERRED and gets current_mrr_cents = verified_recurring_mrr_cents"
          - "Deal.guaranteed_mrr_cents = sum of those accounts' verified_recurring_mrr_cents; retained_mrr_cents = guaranteed_mrr_cents; attrited_mrr_cents = 0; allowance_mrr_cents = round_half_up(guaranteed_mrr_cents * FREE_ALLOWANCE_PCT); clawback_status = MONITORING"
          - "the EscrowAccount disburses per calculations.close_disbursement_waterfall: disbursed_to_broker_cents, disbursed_to_seller_cents, holdback_balance_cents = holdback_amount_cents, undisbursed_balance_cents = 0, status = PARTIALLY_RELEASED, scheduled_holdback_release_utc = Deal.holdback_release_utc"
          - "cascades RouteListing.status UNDER_CONTRACT -> CLOSED"
          - "Deal.status = CLOSED; increments Deal.version by 1"
      - from: CLOSED
        to: GUARANTEE_CLOSED
        trigger: "system, cascaded from POST /escrow-accounts/{id}/holdback-releases or POST /clawback-settlements/{id}/settle"
        actor: system
        preconditions:
          - "EscrowAccount.holdback_balance_cents == 0 after the release or settlement"
        side_effects:
          - "Deal.status = GUARANTEE_CLOSED"
          - "increments Deal.version by 1"
      - from: OFFER_SUBMITTED
        to: TERMINATED
        trigger: "POST /deals/{id}/terminate"
        actor: Broker | Seller | Buyer
        preconditions:
          - "the acting Seller owns the listing, or the acting Buyer owns the deal, or the actor is a Broker"
        side_effects:
          - "Deal.status = TERMINATED; termination_reason_code = reason_code"
          - "increments Deal.version by 1"
      - from: COUNTERED
        to: TERMINATED
        trigger: "POST /deals/{id}/terminate"
        actor: Broker | Seller | Buyer
        preconditions:
          - "same ownership rule"
        side_effects:
          - "Deal.status = TERMINATED; termination_reason_code = reason_code"
      - from: REPRICE_REQUIRED
        to: TERMINATED
        trigger: "POST /deals/{id}/terminate"
        actor: Broker | Seller | Buyer
        preconditions:
          - "same ownership rule"
        side_effects:
          - "Deal.status = TERMINATED; termination_reason_code = reason_code"
          - "the deal's EscrowAccount (OPEN or FUNDED) refunds every funded cent: disbursed_to_buyer_cents += funded_amount_cents, undisbursed_balance_cents = 0, status = REFUNDED"
          - "cascades RouteListing.status UNDER_CONTRACT -> LISTED when no other non-terminal accepted deal remains"
      - from: ACCEPTED
        to: TERMINATED
        trigger: "POST /deals/{id}/terminate"
        actor: Broker | Seller | Buyer
        preconditions:
          - "same ownership rule"
        side_effects:
          - "Deal.status = TERMINATED; termination_reason_code = reason_code"
          - "the deal's EscrowAccount refunds every funded cent to the buyer: disbursed_to_buyer_cents += funded_amount_cents, holdback_balance_cents = 0, undisbursed_balance_cents = 0, status = REFUNDED"
          - "every LicenseTransfer of this deal with status in {NOT_STARTED, APPLIED, DENIED} moves to CANCELLED"
          - "every ServiceAccount of this deal with transfer_status == INTRODUCED returns to PENDING with deal_id = null, introduced_on = null, introduction_sequence_no = null, and RouteListing.introductions_completed_count is recomputed"
          - "cascades RouteListing.status UNDER_CONTRACT -> LISTED"
      - from: DILIGENCE_CLEARED
        to: TERMINATED
        trigger: "POST /deals/{id}/terminate"
        actor: Broker | Seller | Buyer
        preconditions:
          - "same ownership rule"
        side_effects:
          - "identical to ACCEPTED -> TERMINATED"
      - from: FINANCING_APPROVED
        to: TERMINATED
        trigger: "POST /deals/{id}/terminate"
        actor: Broker | Seller | Buyer
        preconditions:
          - "same ownership rule"
        side_effects:
          - "identical to ACCEPTED -> TERMINATED"
      - from: ESCROW_FUNDED
        to: TERMINATED
        trigger: "POST /deals/{id}/terminate"
        actor: Broker | Seller | Buyer
        preconditions:
          - "same ownership rule"
        side_effects:
          - "identical to ACCEPTED -> TERMINATED; the full funded_amount_cents (down payment plus holdback) returns to the buyer, which is the compensating action of the escrow-conservation invariant"

  - entity: EscrowAccount
    state_field: status
    initial_state: OPEN
    terminal_states: [RELEASED, REFUNDED]
    transitions:
      - from: OPEN
        to: FUNDED
        trigger: "POST /escrow-accounts/{id}/deposits"
        actor: EscrowAgent
        preconditions:
          - "deposits_blocked == false"
          - "funded_amount_cents + amount_cents <= target_amount_cents"
          - "the deposit brings funded_amount_cents exactly to target_amount_cents"
        side_effects:
          - "funded_amount_cents += amount_cents; undisbursed_balance_cents += amount_cents; funded_by_user_id = X-User-ID when this is the first deposit"
          - "EscrowAccount.status = FUNDED"
          - "cascades Deal.status FINANCING_APPROVED -> ESCROW_FUNDED"
          - "increments EscrowAccount.version by 1"
      - from: OPEN
        to: OPEN
        trigger: "POST /escrow-accounts/{id}/deposits (partial)"
        actor: EscrowAgent
        preconditions:
          - "deposits_blocked == false"
          - "funded_amount_cents + amount_cents < target_amount_cents"
        side_effects:
          - "funded_amount_cents += amount_cents; undisbursed_balance_cents += amount_cents; funded_by_user_id = X-User-ID when this is the first deposit"
          - "increments EscrowAccount.version by 1"
      - from: FUNDED
        to: PARTIALLY_RELEASED
        trigger: "system, cascaded from POST /deals/{id}/close"
        actor: system
        preconditions:
          - "the deal closed successfully"
        side_effects:
          - "disburses commission and seller proceeds per calculations.close_disbursement_waterfall; holdback_balance_cents = holdback_amount_cents; undisbursed_balance_cents = 0"
          - "EscrowAccount.status = PARTIALLY_RELEASED; scheduled_holdback_release_utc = Deal.holdback_release_utc"
      - from: PARTIALLY_RELEASED
        to: RELEASED
        trigger: "POST /escrow-accounts/{id}/holdback-releases"
        actor: EscrowAgent
        preconditions:
          - "X-User-ID != funded_by_user_id (segregation of duties)"
          - "Deal.status == CLOSED"
          - "the logical clock is at or after scheduled_holdback_release_utc"
          - "holdback_release_blocked == false"
        side_effects:
          - "disbursed_to_seller_cents += holdback_balance_cents; holdback_balance_cents = 0"
          - "EscrowAccount.status = RELEASED"
          - "cascades Deal.status CLOSED -> GUARANTEE_CLOSED"
      - from: PARTIALLY_RELEASED
        to: RELEASED
        trigger: "system, cascaded from POST /clawback-settlements/{id}/settle"
        actor: system
        preconditions:
          - "the settlement reached SETTLED"
        side_effects:
          - "disbursed_to_buyer_cents += ClawbackSettlement.from_holdback_cents; disbursed_to_seller_cents += ClawbackSettlement.holdback_release_to_seller_cents; holdback_balance_cents = 0"
          - "EscrowAccount.status = RELEASED"
          - "cascades Deal.status CLOSED -> GUARANTEE_CLOSED"
        note: "Branching join: PARTIALLY_RELEASED reaches RELEASED by two paths with different disbursement splits."
      - from: OPEN
        to: REFUNDED
        trigger: "system, cascaded from POST /deals/{id}/terminate"
        actor: system
        preconditions:
          - "the deal moved to TERMINATED"
        side_effects:
          - "disbursed_to_buyer_cents += funded_amount_cents; undisbursed_balance_cents = 0; EscrowAccount.status = REFUNDED"
      - from: FUNDED
        to: REFUNDED
        trigger: "system, cascaded from POST /deals/{id}/terminate"
        actor: system
        preconditions:
          - "the deal moved to TERMINATED"
        side_effects:
          - "disbursed_to_buyer_cents += funded_amount_cents; holdback_balance_cents = 0; undisbursed_balance_cents = 0; EscrowAccount.status = REFUNDED"
        note: "Compensating action of the escrow-conservation invariant."

  - entity: LicenseTransfer
    state_field: status
    initial_state: NOT_STARTED
    terminal_states: [APPROVED, WAIVED, CANCELLED]
    transitions:
      - from: NOT_STARTED
        to: APPLIED
        trigger: "POST /license-transfers/{id}/apply"
        actor: Buyer
        preconditions:
          - "acting Buyer owns the deal"
          - "Buyer.license_status != NONE, or StateLicenseProfile.provisional_operation_allowed == true"
          - "no other LicenseTransfer of the same Buyer, state_profile_id and permit_type is APPLIED with an overlapping processing window (§1.4 priority 46)"
        side_effects:
          - "LicenseTransfer.status = APPLIED; applied_on = body applied_on; processing_window_end = applied_on + StateLicenseProfile.transfer_processing_days; attempt_count += 1"
      - from: APPLIED
        to: APPROVED
        trigger: "POST /license-transfers/{id}/decide with decision == APPROVE"
        actor: PlatformAdmin
        preconditions:
          - "decided_on >= applied_on"
        side_effects:
          - "LicenseTransfer.status = APPROVED; decided_on written"
      - from: APPLIED
        to: DENIED
        trigger: "POST /license-transfers/{id}/decide with decision == DENY"
        actor: PlatformAdmin
        preconditions:
          - "decided_on >= applied_on"
          - "denial_reason_code is present"
        side_effects:
          - "LicenseTransfer.status = DENIED; decided_on and denial_reason_code written"
        note: "Fork: APPROVE and DENY write different fields and open different futures."
      - from: DENIED
        to: APPLIED
        trigger: "POST /license-transfers/{id}/apply"
        actor: Buyer
        preconditions:
          - "applied_on >= decided_on + StateLicenseProfile.cooling_off_days (§1.4 priority 46)"
        side_effects:
          - "LicenseTransfer.status = APPLIED; applied_on and processing_window_end rewritten; attempt_count += 1; denial_reason_code retained"
        note: "Retry cycle APPLIED -> DENIED -> APPLIED behind a cooling-off buffer."
      - from: NOT_STARTED
        to: WAIVED
        trigger: "POST /license-transfers/{id}/waive"
        actor: Broker
        preconditions:
          - "Buyer.license_status == LICENSED"
          - "Buyer.state_code is a member of StateLicenseProfile.reciprocity_states"
        side_effects:
          - "LicenseTransfer.status = WAIVED; waiver_basis = 'RECIPROCITY_' + Buyer.state_code"
      - from: NOT_STARTED
        to: CANCELLED
        trigger: "system, cascaded from POST /deals/{id}/terminate"
        actor: system
        preconditions:
          - "the deal moved to TERMINATED"
        side_effects:
          - "LicenseTransfer.status = CANCELLED"
      - from: APPLIED
        to: CANCELLED
        trigger: "system, cascaded from POST /deals/{id}/terminate"
        actor: system
        preconditions:
          - "the deal moved to TERMINATED"
        side_effects:
          - "LicenseTransfer.status = CANCELLED; the processing window it occupied is freed for a new application"
      - from: DENIED
        to: CANCELLED
        trigger: "system, cascaded from POST /deals/{id}/terminate"
        actor: system
        preconditions:
          - "the deal moved to TERMINATED"
        side_effects:
          - "LicenseTransfer.status = CANCELLED"

  - entity: ClawbackSettlement
    state_field: status
    initial_state: DRAFT
    terminal_states: [SETTLED]
    transitions:
      - from: DRAFT
        to: PROPOSED
        trigger: "POST /clawback-settlements/{id}/propose"
        actor: Broker
        preconditions:
          - "Deal.clawback_status == CLAWBACK_TRIGGERED"
          - "adjustment_cents > 0"
        side_effects:
          - "recomputes every figure via calculations.clawback_settlement against the current ledger and logical clock; computed_from_clock_utc rewritten"
          - "ClawbackSettlement.status = PROPOSED"
      - from: PROPOSED
        to: DISPUTED
        trigger: "POST /clawback-settlements/{id}/dispute"
        actor: Seller
        preconditions:
          - "acting Seller owns the listing behind the deal"
        side_effects:
          - "ClawbackSettlement.status = DISPUTED; dispute_reason_code written"
      - from: DISPUTED
        to: PROPOSED
        trigger: "POST /clawback-settlements/{id}/propose"
        actor: Broker
        preconditions:
          - "Deal.clawback_status == CLAWBACK_TRIGGERED"
          - "adjustment_cents > 0 after the recompute"
        side_effects:
          - "recomputes every figure against the ledger as it now stands (replacements and RECOVERED events appended since the dispute change the numbers); status = PROPOSED"
        note: "Negotiation cycle PROPOSED -> DISPUTED -> PROPOSED."
      - from: PROPOSED
        to: SETTLED
        trigger: "POST /clawback-settlements/{id}/settle"
        actor: EscrowAgent
        preconditions:
          - "X-User-ID != EscrowAccount.funded_by_user_id (segregation of duties)"
          - "EscrowAccount.status == PARTIALLY_RELEASED"
        side_effects:
          - "HOP 1: ClawbackSettlement.status = SETTLED; settled_at_utc = the logical clock"
          - "HOP 2: because the settlement settled, the EscrowAccount pays from_holdback_cents to the buyer and holdback_release_to_seller_cents to the seller, sets holdback_balance_cents = 0 and moves PARTIALLY_RELEASED -> RELEASED"
          - "HOP 3: because the escrow holdback balance reached 0, Deal.status CLOSED -> GUARANTEE_CLOSED and Deal.clawback_status = SETTLED"
        note: "Depth-3 settlement cascade."

# =============================================================================
# §1.2.1 Concurrency Rules  (OCC on the parent's `version`, per §1.2.1)
# =============================================================================
concurrency_rules:
  - rule_id: valuation-supersede-stale-listing
    parent_entity: RouteListing
    write_endpoint: "POST /route-listings/{id}/valuations"
    occ_field: "expected_listing_version"
    description: |
      Creating a RouteValuation supersedes the listing's previous non-superseded
      valuation of the same basis, so a second creation is legitimate on its own
      terms. The guard is therefore a stale-version check: a creation whose
      expected_listing_version no longer equals RouteListing.version is rejected,
      because the caller's view of the account roll-ups the valuation is derived
      from is out of date.
    error_id: ERR_STALE_LISTING_VERSION
    http_status: 412

  - rule_id: attrition-append-stale-deal
    parent_entity: Deal
    write_endpoint: "POST /attrition-events"
    occ_field: "expected_deal_version"
    description: |
      The attrition log is append-only, so appending another event is always
      legitimate under the product semantics and cannot be rejected by any state
      precondition. The guard is a stale-version check on the parent Deal: an
      append whose expected_deal_version no longer equals Deal.version is
      rejected, because the ledger the caller measured its delta against has
      already been recomputed by an earlier append, replacement or recovery.
    error_id: ERR_STALE_DEAL_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
#
# All money is integer cents. Every rounding step is round_half_up unless the
# formula says otherwise. `clock` is the logical clock (default
# 2026-08-01T00:00:00Z until POST /_clock/set_current_utc moves it).
# =============================================================================
calculations:

  - name: account_claimed_recurring_mrr
    trigger: "On POST /service-accounts, and re-evaluated whenever the account's input fields are read by another calculation"
    algorithm: aggregation
    formula: |
      divisor = 1 if billing_frequency == MONTHLY else 3       # QUARTERLY invoices cover three months
      service_component = round_half_up(monthly_service_fee_cents / divisor)
      chemical_component = avg_monthly_chemical_cents if chemical_billing_method == INCLUDED else 0
      claimed_recurring_mrr_cents = service_component + chemical_component
      # avg_monthly_repair_cents NEVER enters the recurring base: repair revenue
      # is valued separately at REPAIR_MULTIPLE.
    input_set: "The account's own input fields only."
    constants:
      QUARTERLY_DIVISOR: 3
    precision: "integer cents; the division rounds first (round_half_up), then the chemical component is added"

  - name: account_billing_verification
    trigger: "POST /service-accounts/{id}/verify (ServiceAccount UNVERIFIED|DISPUTED|VERIFIED -> VERIFIED|DISPUTED)"
    algorithm: chronological
    formula: |
      # 1. Trailing window: the VERIFICATION_TRAILING_MONTHS most recent COMPLETE
      #    calendar months strictly before the logical clock's own month.
      #    clock 2026-08-01T00:00:00Z -> window = ["2026-05", "2026-06", "2026-07"].
      window = the 3 month labels immediately preceding format(clock, "YYYY-MM"), ascending
      rows   = BillingHistoryRecord where account_id == this account
                                     and source == BANK_VERIFIED
                                     and period_month IN window
      if the number of distinct period_month values in rows < 3:
          reject with ERR_INSUFFICIENT_BILLING_HISTORY
      if two rows share a period_month (impossible: uniqueness per (account_id, period_month, source))
      # 2. Per-month, ROUND FIRST. This order is pinned:
      for each month m in window (ascending):
          billed_m  = billed_service_cents + billed_chemical_cents + billed_repair_cents
          rate_m    = round_half_up(collected_cents / billed_m, 4 decimals)     # 0.0000 when billed_m == 0
          recurring_billed_m = billed_service_cents + (billed_chemical_cents if chemical_billing_method == INCLUDED else 0)
          recurring_collected_m = round_half_up(recurring_billed_m * rate_m)     # whole cents, per month
          repair_collected_m    = round_half_up(billed_repair_cents * rate_m)    # whole cents, per month
      # 3. THEN average the already-rounded monthly cents:
      verified_recurring_mrr_cents = round_half_up(sum(recurring_collected_m for m in window) / 3)
      verified_repair_mrr_cents    = round_half_up(sum(repair_collected_m    for m in window) / 3)
      # The alternative order — sum the raw billed amounts, average, then apply an
      # average collection rate once — yields different cents. It is NOT used.
      # 4. Variance and outcome:
      claimed = claimed_recurring_mrr_cents
      verification_variance = round_half_up(abs(verified_recurring_mrr_cents - claimed) / claimed, 4 decimals)   if claimed > 0
                            = 0.0000 if claimed == 0 and verified_recurring_mrr_cents == 0
                            = 1.0000 if claimed == 0 and verified_recurring_mrr_cents > 0
      verification_status = VERIFIED if verification_variance <= VERIFY_TOLERANCE else DISPUTED
    input_set: "Only BillingHistoryRecord rows with source == BANK_VERIFIED whose period_month is in the trailing window. SELLER_UPLOAD rows are ignored entirely, as are BANK_VERIFIED rows outside the window."
    constants:
      VERIFICATION_TRAILING_MONTHS: 3
      VERIFY_TOLERANCE: 0.0500
    precision: "collection_rate at 4 decimals round_half_up; monthly cents rounded before averaging; variance at 4 decimals round_half_up; the VERIFY_TOLERANCE comparison is <= (inclusive)"

  - name: route_valuation
    trigger: "POST /route-listings/{id}/valuations, and re-run as HOP 3 of the ServiceAccount VERIFIED -> EXCLUDED cascade"
    algorithm: tiered_pricing
    formula: |
      # input_set depends on the basis (see variants), and each account contributes
      # (recurring_i, repair_i, age_i).
      recurring_mrr_cents = sum(recurring_i over the input set)
      repair_mrr_cents    = sum(repair_i    over the input set)
      account_count       = count(input set)
      if account_count == 0: reject with ERR_NO_VALUATION_INPUTS (both bases)
      # Age is weighted by each account's recurring contribution, then FLOORED:
      if recurring_mrr_cents == 0:
          weighted_avg_account_age_months = 0
      else:
          weighted_avg_account_age_months = floor(sum(recurring_i * age_i) / recurring_mrr_cents)
      # Tier on the recurring base (three-way, non-linear):
      base_multiple = 9.0  if recurring_mrr_cents <  MRR_TIER_1_CENTS
                    = 10.0 if MRR_TIER_1_CENTS <= recurring_mrr_cents < MRR_TIER_2_CENTS
                    = 11.0 if recurring_mrr_cents >= MRR_TIER_2_CENTS
      age_adjustment = +1.0 if weighted_avg_account_age_months >= 60
                     = +0.5 if 36 <= weighted_avg_account_age_months <= 59
                     =  0.0 if 24 <= weighted_avg_account_age_months <= 35
                     = -1.0 if weighted_avg_account_age_months <= 23
      effective_multiple = min(MULTIPLE_CAP, max(MULTIPLE_FLOOR, base_multiple + age_adjustment))
      recurring_component_cents = round_half_up(recurring_mrr_cents * effective_multiple)
      repair_component_cents    = round_half_up(repair_mrr_cents * REPAIR_MULTIPLE)
      valuation_cents = recurring_component_cents + repair_component_cents
      # age_i = ServiceAccount.account_age_months measured against the logical
      # clock at the moment the snapshot is computed (computed_from_clock_utc).
    input_set: "Per variant, below. Accounts are never partially included: an account either contributes both its recurring and its repair figure, or neither."
    constants:
      MRR_TIER_1_CENTS: 30000
      MRR_TIER_2_CENTS: 100000
      MULTIPLE_FLOOR: 6.0
      MULTIPLE_CAP: 12.0
      REPAIR_MULTIPLE: 3.0
    precision: "effective_multiple at 1 decimal; components rounded independently to whole cents (round per component, THEN sum)"
    variants:
      - name: LISTED_BASIS
        when: "basis == LISTED_BASIS — the market-facing number the listing is published on"
        difference: "Input set = ServiceAccounts of the listing with verification_status != EXCLUDED. recurring_i = claimed_recurring_mrr_cents, repair_i = avg_monthly_repair_cents. Seller-claimed figures are taken at face value; unverified and disputed accounts count."
      - name: VERIFIED_BASIS
        when: "basis == VERIFIED_BASIS — the diligence number that gates closing and prices the clawback"
        difference: "Input set = ServiceAccounts of the listing with verification_status == VERIFIED only. recurring_i = verified_recurring_mrr_cents, repair_i = verified_repair_mrr_cents. Because the two bases differ in BOTH the membership filter and the per-account amounts, the same listing yields two different valuation_cents, two different base_multiple tiers and two different weighted ages."

  - name: reprice_trigger_test
    trigger: "HOP 4 of the ServiceAccount VERIFIED -> EXCLUDED cascade, evaluated once per Deal on the listing"
    algorithm: threshold
    formula: |
      threshold_cents = round_half_up(Deal.current_offer_price_cents * PRICE_TOLERANCE_PCT)
      fails = (fresh VERIFIED_BASIS RouteValuation.valuation_cents < threshold_cents)
      # Strict `<`: a valuation exactly equal to the threshold does NOT reprice.
    input_set: "Deals on the listing whose status is ACCEPTED or DILIGENCE_CLEARED. Deals in FINANCING_APPROVED, ESCROW_FUNDED, CLOSED, GUARANTEE_CLOSED, TERMINATED, OFFER_SUBMITTED, COUNTERED or REPRICE_REQUIRED are never repriced."
    constants:
      PRICE_TOLERANCE_PCT: 0.90
    precision: "integer cents; comparison is strict <"

  - name: deal_escrow_structure
    trigger: "POST /deals/{id}/accept (Deal OFFER_SUBMITTED -> ACCEPTED)"
    algorithm: waterfall_allocation
    formula: |
      price = Deal.current_offer_price_cents
      min_down_pct = MIN_DOWN_PCT[Deal.financing_type]
      required_down_cents = round_half_up(price * min_down_pct)
      if Deal.down_payment_cents < required_down_cents: reject with ERR_DOWN_PAYMENT_INSUFFICIENT
      holdback_cents = min(round_half_up(price * HOLDBACK_PCT), HOLDBACK_MAX_CENTS)
      escrow_target_amount_cents = Deal.down_payment_cents + holdback_cents
    input_set: "The deal's own price and financing fields at the instant of acceptance."
    constants:
      MIN_DOWN_PCT: { CASH: 1.00, SELLER_NOTE: 0.30, BANK_LOAN: 0.20, SBA: 0.10 }
      HOLDBACK_PCT: 0.15
      HOLDBACK_MAX_CENTS: 200000
    precision: "integer cents; the percentage is rounded BEFORE the min() against HOLDBACK_MAX_CENTS"

  - name: broker_commission
    trigger: "POST /deals/{id}/close (Deal ESCROW_FUNDED -> CLOSED)"
    algorithm: tiered_pricing
    formula: |
      # Evaluation order is pinned, because the tier looks circular: the fee is a
      # percentage of a price, the seller's net is that price minus the fee, and a
      # floor applies. Steps run exactly in this order:
      # STEP 1 — gross is the accepted price, never the net of anything:
      gross = Deal.current_offer_price_cents
      # STEP 2 — tier selection reads GROSS only:
      rate = 0.10 if gross <  COMMISSION_TIER_1_CENTS
           = 0.08 if COMMISSION_TIER_1_CENTS <= gross < COMMISSION_TIER_2_CENTS
           = 0.06 if gross >= COMMISSION_TIER_2_CENTS
      # STEP 3 — round the percentage fee to whole cents:
      raw_commission_cents = round_half_up(gross * rate)
      # STEP 4 — apply the floor AFTER rounding (never re-tier on the floored value):
      commission_cents = max(raw_commission_cents, MIN_COMMISSION_CENTS)
      # STEP 5 — the seller's net is a consequence, never an input to STEP 2:
      net_to_seller_cents = gross - commission_cents - Deal.holdback_cents
    input_set: "The deal's frozen current_offer_price_cents and holdback_cents at closing."
    constants:
      COMMISSION_TIER_1_CENTS: 1500000
      COMMISSION_TIER_2_CENTS: 4000000
      MIN_COMMISSION_CENTS: 50000
    precision: "integer cents; round at STEP 3, floor at STEP 4"

  - name: close_disbursement_waterfall
    trigger: "POST /deals/{id}/close, applied to the deal's EscrowAccount"
    algorithm: waterfall_allocation
    formula: |
      # Buckets are filled strictly in this order out of the funded escrow.
      available = EscrowAccount.funded_amount_cents - EscrowAccount.holdback_amount_cents
      # BUCKET 1 — brokerage commission:
      to_broker = min(available, Deal.commission_cents)
      available = available - to_broker
      # BUCKET 2 — seller proceeds (the remainder):
      to_seller = available
      # BUCKET 3 — retention holdback stays in escrow:
      holdback_balance_cents = EscrowAccount.holdback_amount_cents
      disbursed_to_broker_cents += to_broker
      disbursed_to_seller_cents += to_seller
      # BUCKET 4 — nothing may remain unassigned once the waterfall has run:
      undisbursed_balance_cents = 0
    input_set: "The escrow's funded_amount_cents and holdback_amount_cents plus the deal's commission_cents, all frozen at closing."
    constants: {}
    precision: "integer cents; no rounding occurs (all inputs are already whole cents)"

  - name: deal_attrition_ledger
    trigger: "POST /attrition-events (any event_type) and POST /service-accounts/{id}/replace; recomputed from scratch on every append"
    algorithm: aggregation
    formula: |
      # Window is half-open: [Deal.guarantee_start_utc, Deal.guarantee_end_utc).
      # An event's effective_date is taken at 00:00:00Z of that date.
      E = AttritionEvent where deal_id == this deal and effective_date is in the window
      lost_natural       = sum(abs(mrr_delta_cents)) over E with event_type IN {CANCELLED, DOWNGRADED} and attributed_to == NATURAL
      lost_solicited     = sum(abs(mrr_delta_cents)) over E with event_type IN {CANCELLED, DOWNGRADED} and attributed_to == SELLER_SOLICITATION
      lost_buyer_fault   = sum(abs(mrr_delta_cents)) over E with event_type IN {CANCELLED, DOWNGRADED} and attributed_to == BUYER_SERVICE_FAILURE
      recovered          = sum(mrr_delta_cents)      over E with event_type == RECOVERED
      # STEP 1 — RECOVERED offsets NATURAL first, then SOLICITED (pinned order):
      n1 = max(0, lost_natural - recovered)
      r1 = max(0, recovered - lost_natural)
      s1 = max(0, lost_solicited - r1)
      attrited_mrr_cents      = n1 + s1 + lost_buyer_fault
      retained_mrr_cents      = Deal.guaranteed_mrr_cents - attrited_mrr_cents
      # STEP 2 — replacement credit, capped, offsets NATURAL first then SOLICITED:
      replacement_mrr_cents   = sum(claimed_recurring_mrr_cents) over ServiceAccounts with
                                  deal_id == this deal and replaced_account_id != null and transfer_status == TRANSFERRED
      credit_cap              = round_half_up(REPLACEMENT_CAP_PCT * (n1 + s1))
      credit                  = min(replacement_mrr_cents, credit_cap)
      n2 = max(0, n1 - credit)
      c1 = max(0, credit - n1)
      s2 = max(0, s1 - c1)
      net_attrition_mrr_cents = n2 + s2                      # BUYER_SERVICE_FAILURE never enters
      allowance_mrr_cents     = round_half_up(Deal.guaranteed_mrr_cents * FREE_ALLOWANCE_PCT)
      attrition_pct           = round_half_up(net_attrition_mrr_cents / Deal.guaranteed_mrr_cents, 4 decimals)
      # STEP 3 — the trigger is STRICTLY greater than the allowance:
      clawback_status = CLAWBACK_TRIGGERED if net_attrition_mrr_cents > allowance_mrr_cents else MONITORING
      # (clawback_status stays SETTLED once a settlement has settled.)
    input_set: "All AttritionEvent rows of the deal whose effective_date falls in the half-open guarantee window, plus the deal's replacement accounts. Events dated on guarantee_end_utc's date are OUTSIDE the window and are rejected at write time."
    constants:
      REPLACEMENT_CAP_PCT: 0.50
      FREE_ALLOWANCE_PCT: 0.05
    precision: "integer cents; attrition_pct at 4 decimals round_half_up; the allowance comparison is strict >"

  - name: clawback_settlement
    trigger: "POST /clawback-settlements (DRAFT snapshot) and re-run on POST /clawback-settlements/{id}/propose"
    algorithm: weighted_scoring
    formula: |
      # Inputs n2/s2/n3 come from calculations.deal_attrition_ledger, recomputed
      # at this instant:
      n3 = max(0, n2 - allowance_mrr_cents)        # the free allowance shelters NATURAL churn only
      compensable_natural_mrr_cents   = n3
      compensable_solicited_mrr_cents = s2         # covenant breaches get no allowance
      # Basis-specific money (see variants):
      raw_adjustment_cents = <per variant>
      adjustment_cents     = min(raw_adjustment_cents, Deal.clawback_cap_cents)
      # Settlement waterfall, strictly in this order:
      from_holdback_cents             = min(adjustment_cents, EscrowAccount.holdback_balance_cents)
      from_note_principal_cents       = min(adjustment_cents - from_holdback_cents, Deal.note_principal_cents)
      seller_direct_due_cents         = adjustment_cents - from_holdback_cents - from_note_principal_cents
      holdback_release_to_seller_cents = EscrowAccount.holdback_balance_cents - from_holdback_cents
    input_set: "The deal's attrition ledger as it stands at the moment of the call, its escrow holdback_balance_cents, and its frozen effective_multiple_at_close / current_offer_price_cents / clawback_cap_cents."
    constants:
      SOLICITATION_PENALTY_FACTOR: 1.5
    precision: "integer cents; each variant rounds its two terms SEPARATELY and then adds them"
    variants:
      - name: REPLACEMENT_BASIS
        when: "remedy_basis == REPLACEMENT_BASIS — the buyer is made whole per lost MRR dollar at the price actually paid for MRR"
        difference: |
          raw_adjustment_cents = round_half_up(compensable_natural_mrr_cents * Deal.effective_multiple_at_close)
                               + round_half_up(compensable_solicited_mrr_cents * Deal.effective_multiple_at_close * SOLICITATION_PENALTY_FACTOR)
          Prices attrition off the closing MULTIPLE, so the answer moves with the
          route's age/tier profile and is blind to the repair component of the price.
      - name: PRICE_ADJUSTMENT_BASIS
        when: "remedy_basis == PRICE_ADJUSTMENT_BASIS — the purchase price is pro-rated by the compensable attrition share"
        difference: |
          natural_pct   = round_half_up(compensable_natural_mrr_cents   / Deal.guaranteed_mrr_cents, 4 decimals)
          solicited_pct = round_half_up(compensable_solicited_mrr_cents / Deal.guaranteed_mrr_cents, 4 decimals)
          raw_adjustment_cents = round_half_up(Deal.current_offer_price_cents * natural_pct)
                               + round_half_up(Deal.current_offer_price_cents * solicited_pct * SOLICITATION_PENALTY_FACTOR)
          Pro-rates the WHOLE price (recurring plus repair components) through a
          4-decimal percentage, so identical attrition yields a different number
          from REPLACEMENT_BASIS on the same deal.

  - name: introduction_sequence_selector
    trigger: "POST /service-accounts/{id}/introduce — decides whether the targeted account is the one that may be introduced now"
    algorithm: topological
    formula: |
      # Eligibility filter (explicit predicate, no adjectives):
      queue = ServiceAccount where listing_id == Deal.listing_id
                              and verification_status IN {UNVERIFIED, VERIFIED, DISPUTED}   # EXCLUDED accounts are skipped entirely
                              and transfer_status == PENDING
      # Ranking expression (all fields, no random ids):
      order by ROUTE_DAY_RANK[route_day] ASC,      # MON=1, TUE=2, WED=3, THU=4, FRI=5
               service_start_date ASC,             # older customers meet the buyer first
               created_at ASC                      # final tie-break; `id` is NEVER used
      head = queue[0]
      if queue is empty: the call cannot occur (the target account would not be PENDING) -> ERR_ACCOUNT_NOT_INTRODUCIBLE
      if target_account.id != head.id: reject with ERR_INTRODUCTION_OUT_OF_SEQUENCE
    input_set: "PENDING, non-EXCLUDED accounts of the deal's listing. Accounts already INTRODUCED/TRANSFERRED/LOST/REPLACED have left the queue."
    constants:
      ROUTE_DAY_RANK: { MON: 1, TUE: 2, WED: 3, THU: 4, FRI: 5 }
      MAX_INTRODUCTIONS_PER_DATE: 2
    precision: "not applicable; the ordering is total because created_at carries millisecond precision"

  - name: escrow_conservation_invariant
    trigger: "Asserted after every EscrowAccount mutation (deposit, close disbursement, holdback release, settlement, refund)"
    algorithm: aggregation
    formula: |
      EscrowAccount.funded_amount_cents
        == EscrowAccount.disbursed_to_broker_cents
         + EscrowAccount.disbursed_to_seller_cents
         + EscrowAccount.disbursed_to_buyer_cents
         + EscrowAccount.holdback_balance_cents
         + EscrowAccount.undisbursed_balance_cents
      # Conserved quantity: escrow CASH. Every forward action (deposit, close
      # disbursement, holdback release, settlement draw) and every compensating
      # action (terminate -> full refund) must preserve this identity exactly;
      # no cent may be created or destroyed.
    input_set: "One EscrowAccount row; no cross-entity inputs."
    constants: {}
    precision: "exact integer equality; no tolerance"

  - name: retention_mrr_conservation_invariant
    trigger: "Asserted after every AttritionEvent append and every POST /service-accounts/{id}/replace"
    algorithm: aggregation
    formula: |
      Deal.retained_mrr_cents + Deal.attrited_mrr_cents == Deal.guaranteed_mrr_cents
      # Conserved quantity: the recurring MRR guaranteed at closing. A CANCELLED
      # event moves MRR from retained to attrited; its compensating RECOVERED
      # event moves exactly the same amount back, so the sum never drifts and
      # Deal.guaranteed_mrr_cents itself is immutable after closing.
    input_set: "One Deal row after its ledger recompute."
    constants: {}
    precision: "exact integer equality; no tolerance"

  - name: listing_claimed_mrr_conservation_invariant
    trigger: "Asserted after every POST /service-accounts/{id}/exclude and POST /service-accounts/{id}/reinstate"
    algorithm: aggregation
    formula: |
      RouteListing.claimed_recurring_mrr_cents
        == sum(ServiceAccount.claimed_recurring_mrr_cents) over accounts of the listing
           with verification_status != EXCLUDED
      # Conserved quantity: the listing's claimed recurring MRR roll-up. exclude
      # removes exactly one account's contribution; reinstate — its compensating
      # action — restores exactly the same contribution, so an exclude/reinstate
      # pair leaves the roll-up byte-identical to its pre-exclude value.
    input_set: "The listing's accounts; EXCLUDED accounts contribute nothing."
    constants: {}
    precision: "exact integer equality; no tolerance"

# =============================================================================
# §1.4 Validation Rules Table — evaluated in ascending `priority`. The FIRST
# rule whose check fails determines the response; no later rule is evaluated.
# Two deliberately co-violable pairs are documented in
# SCAFFOLD_DIFFICULTY_DESIGN.yaml (rule_id: priority_pair_validation_conflict).
# =============================================================================
validations:

  # ---- auth (1-4) -----------------------------------------------------------
  - priority: 1
    category: auth
    check: "The X-Role request header is present, non-empty, and equal to one of PlatformAdmin, Broker, Seller, Buyer, EscrowAgent"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
    description: "Absent, empty, or unrecognised X-Role. Checked before anything else, so an unauthenticated call to a non-existent id still returns 401, never 404."

  - priority: 2
    category: auth
    check: "X-Role is listed in the endpoint's authorized_roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
    description: "Known role but not permitted on this endpoint. Precedes existence, so a Buyer probing an unknown listing id gets 403 rather than 404."

  - priority: 3
    category: auth
    check: "For the entity_backed roles: when X-Role == Seller the X-User-ID header must equal the Seller.id that owns the addressed listing/account/deal; when X-Role == Buyer it must equal the Buyer.id on the addressed deal"
    error_id: ERR_ACTOR_NOT_OWNER
    http_status: 403
    applies_to: "all Seller-authorized and Buyer-authorized endpoints"
    description: "Cross-tenant reach: seller S2 cannot verify accounts on seller S1's listing even though the Seller role is authorized on that endpoint."

  - priority: 4
    category: auth
    check: "Segregation of duties, three clauses: (a) the X-User-ID that recorded any AttritionEvent on a deal may not propose that deal's ClawbackSettlement; (b) the X-User-ID that verified a ServiceAccount may not clear diligence on a deal covering that account; (c) the X-User-ID equal to EscrowAccount.funded_by_user_id may not release the holdback or settle a clawback out of that escrow"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: ["POST /clawback-settlements/{id}/propose", "POST /deals/{id}/clear-diligence", "POST /escrow-accounts/{id}/holdback-releases", "POST /clawback-settlements/{id}/settle"]
    description: "role_model == segregation_of_duties. The role is correct and the actor owns the resource; only the human identity collides."

  # ---- request shape (5-6) --------------------------------------------------

  - priority: 5
    category: business_constraint
    check: "The request body contains every required field, no field has the wrong JSON type, every enum value is a member of its declared set, every *_cents field is an integer >= 0 (the one declared exception is AttritionEvent.mrr_delta_cents, which is signed: != 0, < 0 for CANCELLED/DOWNGRADED, > 0 for RECOVERED), every date/datetime field parses as ISO-8601 (dates as YYYY-MM-DD, datetimes with a trailing Z), and every scalar field satisfies the numeric range, string-length and date-ordering bound declared in its §1.1 field constraints"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all write endpoints"
    description: "Single structural gate. Runs before existence, so a malformed body aimed at an unknown parent id returns 400."

  - priority: 6
    category: business_constraint
    check: "Pagination inputs satisfy 1 <= limit <= 100 and offset >= 0 and both are integers"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all list endpoints"
    description: "limit=0, limit=101, offset=-1 and non-numeric values are all rejected; omitting them applies limit=10, offset=0."

  # ---- existence (7-17) ----------------------------------------------------

  - priority: 7
    category: existence
    check: "Every RouteListing id in the path or body resolves to an existing listing"
    error_id: ERR_LISTING_NOT_FOUND
    http_status: 404
    applies_to: ["GET /route-listings/{id}", "PATCH /route-listings/{id}", "POST /route-listings/{id}/publish", "POST /route-listings/{id}/valuations", "POST /route-listings/{id}/withdraw", "POST /service-accounts", "POST /deals"]
    description: "Also covers a well-formed but unused UUID."

  - priority: 8
    category: existence
    check: "Every ServiceAccount id in the path or body resolves to an existing account"
    error_id: ERR_ACCOUNT_NOT_FOUND
    http_status: 404
    applies_to: ["GET /service-accounts/{id}", "POST /service-accounts/{id}/verify", "POST /service-accounts/{id}/exclude", "POST /service-accounts/{id}/reinstate", "POST /service-accounts/{id}/introduce", "POST /service-accounts/{id}/replace", "POST /billing-history-records", "POST /attrition-events"]
    description: ""

  - priority: 9
    category: existence
    check: "Every Deal id in the path or body resolves to an existing deal"
    error_id: ERR_DEAL_NOT_FOUND
    http_status: 404
    applies_to: ["GET /deals/{id}", "POST /deals/{id}/counter-offers", "POST /deals/{id}/offers", "POST /deals/{id}/accept", "POST /deals/{id}/clear-diligence", "POST /deals/{id}/approve-financing", "POST /deals/{id}/close", "POST /deals/{id}/terminate", "POST /attrition-events", "POST /clawback-settlements", "POST /service-accounts/{id}/introduce", "POST /service-accounts/{id}/replace"]
    description: ""

  - priority: 10
    category: existence
    check: "Every EscrowAccount id in the path resolves to an existing escrow account"
    error_id: ERR_ESCROW_NOT_FOUND
    http_status: 404
    applies_to: ["GET /escrow-accounts/{id}", "POST /escrow-accounts/{id}/deposits", "POST /escrow-accounts/{id}/holdback-releases"]
    description: ""

  - priority: 11
    category: existence
    check: "Every ClawbackSettlement id in the path resolves to an existing settlement"
    error_id: ERR_SETTLEMENT_NOT_FOUND
    http_status: 404
    applies_to: ["GET /clawback-settlements/{id}", "POST /clawback-settlements/{id}/propose", "POST /clawback-settlements/{id}/dispute", "POST /clawback-settlements/{id}/settle"]
    description: ""

  - priority: 12
    category: existence
    check: "Every Seller id and Buyer id in a path or body resolves to an existing party"
    error_id: ERR_PARTY_NOT_FOUND
    http_status: 404
    applies_to: ["GET /sellers/{id}", "GET /buyers/{id}", "POST /buyers/{id}/qualify", "POST /route-listings", "POST /deals"]
    description: "Covers seller_id on listing creation and buyer_id on deal creation."

  - priority: 13
    category: existence
    check: "The StateLicenseProfile id in the path resolves to an existing profile"
    error_id: ERR_LICENSE_PROFILE_NOT_FOUND
    http_status: 404
    applies_to: ["GET /state-license-profiles/{id}"]
    description: ""

  - priority: 14
    category: existence
    check: "The LicenseTransfer id in the path resolves to an existing transfer"
    error_id: ERR_LICENSE_TRANSFER_NOT_FOUND
    http_status: 404
    applies_to: ["GET /license-transfers/{id}", "POST /license-transfers/{id}/apply", "POST /license-transfers/{id}/decide", "POST /license-transfers/{id}/waive"]
    description: ""

  - priority: 15
    category: existence
    check: "The RouteValuation id in the path resolves to an existing valuation"
    error_id: ERR_VALUATION_NOT_FOUND
    http_status: 404
    applies_to: ["GET /route-valuations/{id}"]
    description: ""

  - priority: 16
    category: existence
    check: "The BillingHistoryRecord id in the path resolves to an existing record"
    error_id: ERR_BILLING_RECORD_NOT_FOUND
    http_status: 404
    applies_to: ["GET /billing-history-records/{id}"]
    description: ""

  - priority: 17
    category: existence
    check: "The AttritionEvent id in the path resolves to an existing event"
    error_id: ERR_ATTRITION_EVENT_NOT_FOUND
    http_status: 404
    applies_to: ["GET /attrition-events/{id}"]
    description: ""

  # ---- optimistic concurrency (18-19) --------------------------------------

  - priority: 18
    category: state
    check: "expected_listing_version equals the addressed RouteListing's current version"
    error_id: ERR_STALE_LISTING_VERSION
    http_status: 412
    applies_to: ["POST /route-listings/{id}/valuations"]
    description: "§1.2.1 concurrency rule valuation-supersede-stale-listing. Checked after existence and before any state precondition, so a stale version against a WITHDRAWN listing returns 412."

  - priority: 19
    category: state
    check: "expected_deal_version equals the referenced Deal's current version"
    error_id: ERR_STALE_DEAL_VERSION
    http_status: 412
    applies_to: ["POST /attrition-events"]
    description: "§1.2.1 concurrency rule attrition-append-stale-deal."

  # ---- state (20-33) -------------------------------------------------------

  - priority: 20
    category: state
    check: "The RouteListing is in LISTED for offer submission, and in DRAFT or LISTED for account and valuation writes"
    error_id: ERR_LISTING_NOT_LISTED
    http_status: 409
    applies_to: ["POST /service-accounts", "POST /route-listings/{id}/valuations", "POST /deals"]
    description: "UNDER_CONTRACT, CLOSED and WITHDRAWN listings reject all of these."

  - priority: 21
    category: state
    check: "The addressed ServiceAccount is not EXCLUDED"
    error_id: ERR_ACCOUNT_EXCLUDED
    http_status: 409
    applies_to: ["POST /service-accounts/{id}/verify", "POST /service-accounts/{id}/introduce", "POST /billing-history-records"]
    description: "reinstate is the only operation an EXCLUDED account accepts."

  - priority: 22
    category: state
    check: "The addressed ServiceAccount has transfer_status == PENDING for introduce and == LOST for replace"
    error_id: ERR_ACCOUNT_NOT_INTRODUCIBLE
    http_status: 409
    applies_to: ["POST /service-accounts/{id}/introduce", "POST /service-accounts/{id}/replace"]
    description: "Also makes introduce non-idempotent: the second call on the same account fails here, because the first moved it to INTRODUCED."

  - priority: 23
    category: state
    check: "The Deal is in ESCROW_FUNDED"
    error_id: ERR_DEAL_NOT_FUNDED
    http_status: 409
    applies_to: ["POST /deals/{id}/close"]
    description: "PAIR A member (state). Deliberately co-violable with priority 51 ERR_ESCROW_UNDERFUNDED: a deal still in FINANCING_APPROVED whose escrow is short violates both, and 409/ERR_DEAL_NOT_FUNDED must win."

  - priority: 24
    category: state
    check: "The requested Deal transition exists in the Deal state machine for the deal's current status"
    error_id: ERR_INVALID_DEAL_TRANSITION
    http_status: 409
    applies_to: ["POST /deals/{id}/counter-offers", "POST /deals/{id}/offers", "POST /deals/{id}/accept", "POST /deals/{id}/clear-diligence", "POST /deals/{id}/approve-financing"]
    description: "Covers accept-from-CLOSED, clear-diligence-from-OFFER_SUBMITTED, approve-financing-from-ACCEPTED, counter-offers-from-COUNTERED and every other undeclared edge."

  - priority: 25
    category: state
    check: "The Deal is not in a terminal status (CLOSED for offer edits, GUARANTEE_CLOSED or TERMINATED for anything)"
    error_id: ERR_DEAL_TERMINAL
    http_status: 409
    applies_to: ["POST /deals/{id}/terminate", "POST /attrition-events", "POST /clawback-settlements", "POST /escrow-accounts/{id}/deposits"]
    description: "Terminal-state lockdown for the two absorbing Deal states."

  - priority: 26
    category: state
    check: "A Deal in REPRICE_REQUIRED is accepted only by POST /deals/{id}/offers and POST /deals/{id}/terminate; every other progression endpoint refuses that status"
    error_id: ERR_REPRICE_REQUIRED
    http_status: 409
    applies_to: ["POST /deals/{id}/accept", "POST /deals/{id}/clear-diligence", "POST /deals/{id}/approve-financing", "POST /deals/{id}/close"]
    description: "The cascade-induced status forces the parties back through the counter cycle before the deal can move on."

  - priority: 27
    category: state
    check: "The EscrowAccount is OPEN with deposits_blocked == false for a deposit, and PARTIALLY_RELEASED for a holdback release"
    error_id: ERR_ESCROW_NOT_OPEN
    http_status: 409
    applies_to: ["POST /escrow-accounts/{id}/deposits", "POST /escrow-accounts/{id}/holdback-releases"]
    description: "FUNDED rejects further deposits, and RELEASED or REFUNDED is terminal and rejects every mutation. deposits_blocked is set by the reprice cascade (HOP 5); the holdback_release_blocked flag set by the attrition cascade (HOP 3) is owned by priority 58 instead, so the two blocked flags surface as two different errors."

  - priority: 28
    category: state
    check: "The ClawbackSettlement is DRAFT or DISPUTED for propose (a disputed settlement is re-proposed through the same endpoint), PROPOSED for dispute, and PROPOSED for settle"
    error_id: ERR_SETTLEMENT_NOT_PROPOSED
    http_status: 409
    applies_to: ["POST /clawback-settlements/{id}/propose", "POST /clawback-settlements/{id}/dispute", "POST /clawback-settlements/{id}/settle"]
    description: "SETTLED is terminal; a second settle fails here."

  - priority: 29
    category: state
    check: "The LicenseTransfer is NOT_STARTED or DENIED for apply, APPLIED for decide, and NOT_STARTED for waive"
    error_id: ERR_LICENSE_TRANSFER_NOT_PENDING
    http_status: 409
    applies_to: ["POST /license-transfers/{id}/apply", "POST /license-transfers/{id}/decide", "POST /license-transfers/{id}/waive"]
    description: "Encodes the DENIED -> APPLIED retry edge: DENIED accepts apply, APPROVED does not. APPROVED, WAIVED and CANCELLED are terminal."

  - priority: 30
    category: state
    check: "The requested RouteListing transition exists for the listing's current status: publish only from DRAFT, withdraw only from DRAFT or LISTED, PATCH only from DRAFT or LISTED"
    error_id: ERR_INVALID_LISTING_TRANSITION
    http_status: 409
    applies_to: ["POST /route-listings/{id}/publish", "POST /route-listings/{id}/withdraw", "PATCH /route-listings/{id}"]
    description: "Publishing an already LISTED listing, publishing a CLOSED one, or withdrawing a WITHDRAWN one all land here; CLOSED and WITHDRAWN are terminal. Withdrawing an UNDER_CONTRACT listing is also refused, because a live accepted deal holds it."

  - priority: 31
    category: state
    check: "The requested ServiceAccount verification transition exists: exclude only from UNVERIFIED, VERIFIED or DISPUTED, reinstate only from EXCLUDED"
    error_id: ERR_INVALID_ACCOUNT_TRANSITION
    http_status: 409
    applies_to: ["POST /service-accounts/{id}/exclude", "POST /service-accounts/{id}/reinstate"]
    description: "Reinstating a VERIFIED account and excluding an already EXCLUDED one are both refused, which also makes exclude non-idempotent."

  - priority: 32
    category: state
    check: "The Deal has reached CLOSED or GUARANTEE_CLOSED before any AttritionEvent, replacement or ClawbackSettlement is written"
    error_id: ERR_GUARANTEE_NOT_STARTED
    http_status: 409
    applies_to: ["POST /attrition-events", "POST /service-accounts/{id}/replace", "POST /clawback-settlements"]
    description: "There is no retention guarantee before closing, so the whole post-close subsystem is unreachable from a pre-close deal."

  - priority: 33
    category: state
    check: "The addressed RouteValuation is the deal's frozen VERIFIED_BASIS snapshot and has not been superseded"
    error_id: ERR_VALUATION_SUPERSEDED
    http_status: 409
    applies_to: ["POST /deals/{id}/clear-diligence"]
    description: "A newer valuation on the listing invalidates the one the deal was cleared against."

  # ---- business_referential (34-37) ---------------------------------------

  - priority: 34
    category: business_referential
    check: "The ServiceAccount's listing_id equals the Deal's listing_id"
    error_id: ERR_ACCOUNT_LISTING_MISMATCH
    http_status: 422
    applies_to: ["POST /service-accounts/{id}/introduce", "POST /attrition-events", "POST /service-accounts/{id}/replace"]
    description: "flat topology cross-reference integrity: both rows exist, but they belong to different routes."

  - priority: 35
    category: business_referential
    check: "When escrow_id is supplied on POST /clawback-settlements it resolves to an EscrowAccount whose deal_id equals the addressed deal, and the escrow that a close, holdback release or settlement draw resolves belongs to the Deal being processed"
    error_id: ERR_ESCROW_DEAL_MISMATCH
    http_status: 422
    applies_to: ["POST /clawback-settlements", "POST /escrow-accounts/{id}/holdback-releases", "POST /clawback-settlements/{id}/settle"]
    description: ""

  - priority: 36
    category: business_referential
    check: "A RouteValuation with basis == VERIFIED_BASIS exists for the deal's listing and was computed at or after the deal's created_at"
    error_id: ERR_VERIFIED_VALUATION_MISSING
    http_status: 422
    applies_to: ["POST /deals/{id}/clear-diligence"]
    description: "A LISTED_BASIS valuation alone can never clear diligence."

  - priority: 37
    category: business_referential
    check: "A StateLicenseProfile row exists for the listing's state_code, and the LicenseTransfer's permit_type is a member of that profile's required_permit_types"
    error_id: ERR_STATE_PROFILE_MISSING
    http_status: 422
    applies_to: ["POST /route-listings/{id}/publish"]
    description: "A route in a state with no seeded profile cannot be published at all, because acceptance would have no permit list to fan out from."

  # ---- business_safety (38-44) --------------------------------------------

  - priority: 38
    category: business_safety
    check: "Every LicenseTransfer required for the deal (one per required_permit_types entry of the listing's state profile) is in APPROVED or WAIVED"
    error_id: ERR_LICENSE_NOT_TRANSFERRED
    http_status: 422
    applies_to: ["POST /service-accounts/{id}/introduce", "POST /deals/{id}/close"]
    description: "PAIR B member (business_safety). Deliberately co-violable with priority 47 ERR_INTRODUCTION_WINDOW_CLOSED: an out-of-window introduction on a deal whose pesticide permit is still APPLIED violates both, and ERR_LICENSE_NOT_TRANSFERRED must win. Unlicensed chemical application is the safety hazard the ordering encodes."

  - priority: 39
    category: business_safety
    check: "The Deal's Buyer has qualification_status == APPROVED"
    error_id: ERR_BUYER_NOT_QUALIFIED
    http_status: 422
    applies_to: ["POST /deals", "POST /deals/{id}/accept"]
    description: "PENDING, REJECTED and EXPIRED buyers cannot bid."

  - priority: 40
    category: business_safety
    check: "The listing's fresh VERIFIED_BASIS recurring_mrr_cents is >= round_half_up(MIN_VERIFIED_RATIO * RouteListing.listed_mrr_cents)"
    error_id: ERR_VERIFIED_MRR_SHORTFALL
    http_status: 422
    applies_to: ["POST /deals/{id}/clear-diligence"]
    description: "MIN_VERIFIED_RATIO = 0.70. Guards the buyer against a route whose books do not substantiate the advertised recurring base."

  - priority: 41
    category: business_safety
    check: "The account has at least VERIFICATION_TRAILING_MONTHS distinct BANK_VERIFIED BillingHistoryRecord months inside the trailing window"
    error_id: ERR_INSUFFICIENT_BILLING_HISTORY
    http_status: 422
    applies_to: ["POST /service-accounts/{id}/verify"]
    description: "SELLER_UPLOAD rows never count towards the three months."

  - priority: 42
    category: business_safety
    check: "The valuation input set is non-empty for the requested basis"
    error_id: ERR_NO_VALUATION_INPUTS
    http_status: 422
    applies_to: ["POST /route-listings/{id}/valuations"]
    description: "VERIFIED_BASIS with zero VERIFIED accounts, and LISTED_BASIS with every account EXCLUDED, are both refused rather than valued at zero."

  - priority: 43
    category: business_safety
    check: "Deal.retention_guarantee_days is between 60 and 365 inclusive at acceptance, so the retention guarantee and the derived seller non-solicitation period are both long enough to be meaningful"
    error_id: ERR_COVENANT_TERMS_INSUFFICIENT
    http_status: 422
    applies_to: ["POST /deals/{id}/accept"]
    description: "Boundary: 59 days is refused, exactly 60 passes, exactly 365 passes, 366 is refused. Acceptance stamps non_solicitation_executed_on and non_solicitation_end_date from this value."

  - priority: 44
    category: business_safety
    check: "The replacement account's claimed_recurring_mrr_cents is > 0 and its route_day equals the replaced account's route_day"
    error_id: ERR_REPLACEMENT_TARGET_INVALID
    http_status: 422
    applies_to: ["POST /service-accounts/{id}/replace"]
    description: "A replacement stop must be serviceable on the same route day as the stop it replaces."

  # ---- business_temporal (45-50) ------------------------------------------

  - priority: 45
    category: business_temporal
    check: "The listing's [exclusive_start_date, exclusive_end_date) half-open interval does not overlap any other non-WITHDRAWN listing for the same (seller_id, region_code)"
    error_id: ERR_LISTING_EXCLUSIVITY_OVERLAP
    http_status: 409
    applies_to: ["POST /route-listings", "PATCH /route-listings/{id}", "POST /route-listings/{id}/publish"]
    description: "Half-open: a new interval starting exactly at an existing interval's end is allowed. Scope is (seller, region); the same window in another region is fine."

  - priority: 46
    category: business_temporal
    check: "The licence application's [applied_on, processing_window_end] CLOSED interval does not overlap, and does not sit within the state profile's cooling_off_days of, any other non-CANCELLED LicenseTransfer for the same (buyer, state_code, permit_type) triple"
    error_id: ERR_LICENSE_WINDOW_CONFLICT
    http_status: 409
    applies_to: ["POST /license-transfers/{id}/apply"]
    description: "processing_window_end = applied_on + StateLicenseProfile.transfer_processing_days. A DENIED transfer may only be re-applied once cooling_off_days have elapsed since its own denied_on, which this same rule enforces because the denied application's closed window plus the cooling-off gap still covers the retry. Closed interval plus a cooling_off_days gap: touching endpoints DO conflict, and a gap of cooling_off_days - 1 also conflicts, while exactly cooling_off_days is allowed. Deliberately different interval semantics from priority 45, which is half-open with adjacency permitted."

  - priority: 47
    category: business_temporal
    check: "The logical clock is inside the half-open window [Deal.accepted_on 00:00:00Z, Deal.accepted_on 00:00:00Z + INTRO_WINDOW_DAYS)"
    error_id: ERR_INTRODUCTION_WINDOW_CLOSED
    http_status: 422
    applies_to: ["POST /service-accounts/{id}/introduce"]
    description: "PAIR B member (business_temporal). INTRO_WINDOW_DAYS = 45."

  - priority: 48
    category: business_temporal
    check: "At most MAX_INTRODUCTIONS_PER_DATE accounts of the same deal may be introduced with the same introduced_on date"
    error_id: ERR_INTRODUCTION_LIMIT_REACHED
    http_status: 422
    applies_to: ["POST /service-accounts/{id}/introduce"]
    description: "MAX_INTRODUCTIONS_PER_DATE = 2. Aggregate validation: each introduction is individually valid but the third on one date exceeds the daily cap."

  - priority: 49
    category: business_temporal
    check: "The AttritionEvent's effective_date falls inside the half-open window [Deal.guarantee_start_utc, Deal.guarantee_end_utc)"
    error_id: ERR_ATTRITION_OUTSIDE_GUARANTEE
    http_status: 422
    applies_to: ["POST /attrition-events"]
    description: "An event dated exactly on guarantee_end_utc's date is OUTSIDE the window and is rejected; the day before is accepted."

  - priority: 50
    category: business_temporal
    check: "A BillingHistoryRecord's period_month is strictly before the logical clock's own month"
    error_id: ERR_TEMPORAL_WINDOW_VIOLATION
    http_status: 422
    applies_to: ["POST /billing-history-records"]
    description: "A billing month that has not finished may not be relied upon as verification evidence; the current month is refused and the immediately preceding one is accepted."

  # ---- business_fiscal (51-58) --------------------------------------------

  - priority: 51
    category: business_fiscal
    check: "EscrowAccount.funded_amount_cents >= EscrowAccount.target_amount_cents"
    error_id: ERR_ESCROW_UNDERFUNDED
    http_status: 422
    applies_to: ["POST /deals/{id}/close"]
    description: "PAIR A member (business_fiscal). Loses to priority 23 ERR_DEAL_NOT_FUNDED when both are violated."

  - priority: 52
    category: business_fiscal
    check: "Deal.down_payment_cents >= round_half_up(current_offer_price_cents * MIN_DOWN_PCT[financing_type])"
    error_id: ERR_DOWN_PAYMENT_INSUFFICIENT
    http_status: 422
    applies_to: ["POST /deals/{id}/accept"]
    description: "CASH 100%, SELLER_NOTE 30%, BANK_LOAN 20%, SBA 10%. Tested at the exact required cent and one cent below."

  - priority: 53
    category: business_fiscal
    check: "Deal.current_offer_price_cents <= Buyer.prequalified_amount_cents"
    error_id: ERR_BUYER_PREQUAL_EXCEEDED
    http_status: 422
    applies_to: ["POST /deals", "POST /deals/{id}/offers", "POST /deals/{id}/counter-offers"]
    description: "Inclusive: an offer exactly at the prequalified amount is accepted."

  - priority: 54
    category: business_fiscal
    check: "A COUNTERED offer strictly improves on the standing price in the counterparty's direction: a Seller counter must be > current_offer_price_cents, a Buyer counter must be < it"
    error_id: ERR_COUNTER_NOT_IMPROVED
    http_status: 422
    applies_to: ["POST /deals/{id}/counter-offers", "POST /deals/{id}/offers"]
    description: "Terminates the OFFER_SUBMITTED <-> COUNTERED cycle: repeating the same price is refused, so the loop cannot spin forever."

  - priority: 55
    category: business_fiscal
    check: "deposit_amount_cents does not push funded_amount_cents above target_amount_cents"
    error_id: ERR_ESCROW_OVERFUNDED
    http_status: 422
    applies_to: ["POST /escrow-accounts/{id}/deposits"]
    description: "Escrow accepts partial deposits up to the target exactly; the cent that would overshoot is refused."

  - priority: 56
    category: business_fiscal
    check: "The deal's clawback_status is CLAWBACK_TRIGGERED"
    error_id: ERR_NO_CLAWBACK_DUE
    http_status: 422
    applies_to: ["POST /clawback-settlements"]
    description: "Net attrition at or below the free allowance leaves nothing to settle."

  - priority: 57
    category: business_fiscal
    check: "The proposed adjustment_cents equals the recomputed capped adjustment for the settlement's remedy_basis and is <= Deal.clawback_cap_cents"
    error_id: ERR_SETTLEMENT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: ["POST /clawback-settlements/{id}/propose", "POST /clawback-settlements/{id}/settle"]
    description: "A settlement may not be talked up or down: the number must be the one the formula produces at proposal time."

  - priority: 58
    category: business_fiscal
    check: "For a holdback release the logical clock is at or after EscrowAccount.scheduled_holdback_release_utc, and that field is non-null, and EscrowAccount.holdback_release_blocked == false"
    error_id: ERR_HOLDBACK_NOT_RELEASABLE
    http_status: 422
    applies_to: ["POST /escrow-accounts/{id}/holdback-releases"]
    description: "scheduled_holdback_release_utc is copied from Deal.holdback_release_utc at closing, which itself equals Deal.guarantee_end_utc. A release one second early is refused, exactly on the instant is allowed, and an open attrition ledger keeps holdback_release_blocked true no matter how late it gets."

  # ---- business_constraint (59-64) ----------------------------------------

  - priority: 59
    category: business_constraint
    check: "(account_id, period_month, source) is unique across BillingHistoryRecord"
    error_id: ERR_DUPLICATE_BILLING_PERIOD
    http_status: 409
    applies_to: ["POST /billing-history-records"]
    description: "A BANK_VERIFIED and a SELLER_UPLOAD row for the same month coexist; two BANK_VERIFIED rows do not."

  - priority: 60
    category: business_constraint
    check: "At most one ClawbackSettlement per deal is in DRAFT, PROPOSED or DISPUTED"
    error_id: ERR_DUPLICATE_ACTIVE_SETTLEMENT
    http_status: 409
    applies_to: ["POST /clawback-settlements"]
    description: "A SETTLED settlement does not block a later one if the ledger triggers again."

  - priority: 61
    category: business_constraint
    check: "Every non-EXCLUDED ServiceAccount of the deal's listing has transfer_status == INTRODUCED or TRANSFERRED"
    error_id: ERR_INTRODUCTIONS_INCOMPLETE
    http_status: 422
    applies_to: ["POST /deals/{id}/close"]
    description: "A route cannot close with a stop the buyer has never been walked to; excluded stops are ignored, so excluding the laggard is the legitimate way past this."

  - priority: 62
    category: business_constraint
    check: "The account being introduced is the head of the introduction queue produced by calculations.introduction_sequence_selector"
    error_id: ERR_INTRODUCTION_OUT_OF_SEQUENCE
    http_status: 422
    applies_to: ["POST /service-accounts/{id}/introduce"]
    description: "Route day rank, then service_start_date, then created_at. Introducing a Wednesday stop before the untouched Tuesday stops is refused."

  - priority: 63
    category: business_constraint
    check: "The logical clock is at or before Deal.replacement_deadline_utc"
    error_id: ERR_REPLACEMENT_DEADLINE_PASSED
    http_status: 422
    applies_to: ["POST /service-accounts/{id}/replace"]
    description: "replacement_deadline_utc == guarantee_end_utc + REPLACEMENT_GRACE_DAYS (14). Exactly on the deadline instant a replacement is still accepted; one second later the seller owes the cash adjustment instead of a substitute stop."

  - priority: 64
    category: business_constraint
    check: "The logical clock may only move forward: the requested current_utc is >= the current clock value"
    error_id: ERR_CLOCK_REWIND
    http_status: 422
    applies_to: ["POST /_clock/set_current_utc"]
    description: "Setting the clock to its present value is a no-op and succeeds; an earlier instant is refused so that no already-computed snapshot becomes retroactively inconsistent."

  # ---- cross-entity party status (65-66) -----------------------------------

  - priority: 65
    category: business_referential
    check: "The listing's Seller has status == ACTIVE"
    error_id: ERR_SELLER_SUSPENDED
    http_status: 422
    applies_to: ["POST /route-listings/{id}/publish", "POST /route-listings/{id}/valuations", "POST /deals/{id}/accept", "POST /service-accounts/{id}/introduce"]
    description: "Cross-entity state dependency: nothing about the listing changes when the seller is suspended, yet four listing-scoped operations stop working until POST /sellers/{id}/suspend is reversed by a fresh ACTIVE seller."

  - priority: 66
    category: business_referential
    check: "The Buyer's qualification_status is PENDING when POST /buyers/{id}/qualify is called"
    error_id: ERR_INVALID_BUYER_TRANSITION
    http_status: 409
    applies_to: ["POST /buyers/{id}/qualify"]
    description: "APPROVED and REJECTED are terminal; re-qualifying is refused rather than silently re-decided."

  # ---- financing arithmetic and seed integrity (67-69) ---------------------

  - priority: 67
    category: business_fiscal
    check: "down_payment_cents + note_principal_cents == the offer price the same request establishes (offer_price_cents on POST /deals and POST /deals/{id}/offers, current_offer_price_cents at acceptance)"
    error_id: ERR_FINANCING_SPLIT_MISMATCH
    http_status: 422
    applies_to: ["POST /deals", "POST /deals/{id}/offers", "POST /deals/{id}/accept"]
    description: "COMPENSATING INVARIANT (conserved quantity: the offer price is exactly partitioned into cash down plus carried note). A CASH deal must therefore submit note_principal_cents == 0. Checked after priority 53 so that an over-prequal offer reports the prequal error first."

  - priority: 68
    category: business_constraint
    check: "state_code is unique across StateLicenseProfile"
    error_id: ERR_DUPLICATE_STATE_PROFILE
    http_status: 409
    applies_to: ["POST /state-license-profiles"]
    description: "One licensing regime per state; a second seed for the same state is refused rather than merged."

  - priority: 69
    category: business_referential
    check: "For a reciprocity waiver the Buyer.license_status == LICENSED and Buyer.state_code is a member of the LicenseTransfer's StateLicenseProfile.reciprocity_states"
    error_id: ERR_RECIPROCITY_NOT_AVAILABLE
    http_status: 422
    applies_to: ["POST /license-transfers/{id}/waive"]
    description: "Cross-entity state dependency: whether a permit can be waived depends entirely on two fields of two other entities, and nothing about the LicenseTransfer itself changes when the answer flips."

  # ---- publication readiness (70) ------------------------------------------

  - priority: 70
    category: business_safety
    check: "At publication the RouteListing has claimed_account_count >= 1 and at least one RouteValuation with basis == LISTED_BASIS and is_superseded == false"
    error_id: ERR_LISTING_NOT_PUBLISHABLE
    http_status: 422
    applies_to: ["POST /route-listings/{id}/publish"]
    description: "The two remaining DRAFT -> LISTED preconditions of §1.2. An empty account list and a listing whose only LISTED_BASIS valuation has been superseded by a newer one both land here."

# =============================================================================
# §1.5 API Endpoint Table
#
# api_prefix is "/", so every collection sits at the document root. Every
# entity in §1.1 is reachable through `GET /<segment>/{id}` returning the
# scalar entity, and every foreign key in §1.1 is reachable backwards through
# a filtered list that accepts the FK column as an optional query parameter.
#
# Conventions:
#   * ids are UUID strings; a well-formed id that does not exist is 404, a
#     malformed one is ERR_VALIDATION (400).
#   * every list endpoint accepts limit? / offset? and answers with
#     total_count and has_more in meta.
#   * all money is integer cents; all `*_utc` values are ISO-8601 Z instants
#     with second precision; all `*_date` / `*_on` values are YYYY-MM-DD.
#   * mutating endpoints that carry an `expected_*_version` field are the two
#     OCC sites declared in §1.2.1; nothing else takes a version.
# =============================================================================

endpoints:

  # ---- logical clock (2) ---------------------------------------------------

  - method: POST
    path: /_clock/set_current_utc
    description: "Move the deterministic logical clock forward. Every age, window, deadline and guarantee test in this domain reads this clock rather than wall time."
    roles: [PlatformAdmin]
    input: [current_utc]
    output: { current_utc: datetime, previous_utc: datetime }
    success_status: 200
    side_effects:
      - "no entity is mutated; account_age_months, verification windows, introduction windows, guarantee windows, replacement deadlines and holdback release gates are all re-evaluated lazily against the new value"
      - "moving the clock backwards is refused by §1.4 priority 64 ERR_CLOCK_REWIND"

  - method: GET
    path: /_clock
    description: "Read the current logical clock."
    roles: [PlatformAdmin, Broker, Seller, Buyer, EscrowAgent]
    input: []
    output: { current_utc: datetime }
    success_status: 200
    side_effects: []

  # ---- state licence profiles (3) -----------------------------------------

  - method: POST
    path: /state-license-profiles
    description: "Seed the licensing regime of one state: which permits a route buyer must hold, which states it recognises, how long a transfer application takes and how long a denied applicant must wait."
    roles: [PlatformAdmin]
    input: [state_code, required_permit_types, reciprocity_states, transfer_processing_days, cooling_off_days, provisional_operation_allowed]
    output: StateLicenseProfile
    success_status: 201
    side_effects:
      - "state_code is unique; a second profile for the same state is ERR_DUPLICATE_STATE_PROFILE"

  - method: GET
    path: /state-license-profiles/{id}
    description: "Read one state licensing profile."
    roles: [PlatformAdmin, Broker, Seller, Buyer]
    input: []
    output: StateLicenseProfile
    success_status: 200
    side_effects: []

  - method: GET
    path: /state-license-profiles
    description: "List state licensing profiles."
