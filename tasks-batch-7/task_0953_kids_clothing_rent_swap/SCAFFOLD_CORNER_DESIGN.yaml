      - name: corner_ccl_threshold_boundary_at_exactly_the_delinquency_line
        claim_type: rate_threshold_triggers
        grounds: ["calculations.delinquency_evaluation", "state_machines.Member.ACTIVE_to_DELINQUENT", "global_constants.DELINQUENCY_THRESHOLD_CENTS"]
        distinguishing_aspect: "The comparators are asymmetric: an outstanding balance of exactly 15000 RAISES delinquency (>=), and clearing it requires falling strictly below, so a partial waiver leaving exactly 15000 keeps the member DELINQUENT."
        test_recipe:
          setup: ["One ACTIVE member with a 14999-cent charge, just under the threshold, and a second 1-cent charge about to cross it."]
          setup_api_calls:
            - call: "POST /kidswear/plans"
              payload: { tier: "CORE", slots_per_box: 1, swaps_per_cycle: 1, monthly_fee_cents: 5000 }
              as: PlatformAdmin
              captures: { t1_plan: $.data.id }
