              as: BatchScheduler
              captures: { bj10: $.data.id, bj10_v: $.data.version }
            - call: "POST /toll-operations/customers/${c10}/batch-jobs/${bj10}/release"
              payload: { expected_batch_job_version: "${bj10_v}" }
