              captures: { contrib_g2: $.data.id, contrib_g2_v: $.data.version }
            - call: "POST /freelance-desk/contributors/${contrib_g2}/rate-agreements"
              payload: { pricing_mode: "FLAT", flat_fee_cents: 50000, kill_fee_pct_num: 25, rights_default: "FIRST", effective_from: "2026-08-01T00:00:00Z", expected_contributor_version: "${contrib_g2_v}" }
              as: DeskAdmin
            - call: "POST /freelance-desk/contributors/${contrib_g2}/tax-documents"
              payload: { doc_kind: "W9", tin_last4: "4321" }
              as: Contributor
              as_user_id: "${contrib_g2}"
