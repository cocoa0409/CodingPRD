    roles: [AthleticTrainer]
    code: 201
    input: [protocol_type, expected_injury_version]
    output: ReturnToPlayProtocol
    side_effects:
      - "status = ACTIVE, current_stage = 1, stage_entered_at = now, clearance_authority_required computed"
      - "Prior ACTIVE protocol on this injury -> TERMINATED (supersede)"
      - "Injury UNDER_CARE|RTP_IN_PROGRESS -> RTP_IN_PROGRESS; increments InjuryEvaluation.version by 1"
      - "athlete posture recompute"
  - method: GET
    path: "/rtp-protocols"
    description: "List RTP protocols"
    roles: [SystemAdmin, AthleticTrainer, AthleticDirector, SchoolNurse, Physician]
    code: 200
    input: ["injury_id?", "athlete_id?", "cleared_by_staff_id?", "status?", "limit?", "offset?"]
    output: "ReturnToPlayProtocol[]"
