  # =====================================================================
  # Rule 4 — transitive_cascade (different triggers, depth >= 3 and >= 2)
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: revoke_cascade_cert_to_bonus_to_budget_to_risk
        grounds:
          - state_machines.Certification.CURRENT_to_REVOKED
          - state_machines.CertificationBonus.PAID_to_CLAWED_BACK
          - calculations.calc_budget_commitment
        distinguishing_aspect: |
          Depth-3 chain triggered by certification revoke: Certification REVOKED
          -> its PAID bonus flips CLAWED_BACK (mutation 1) -> that bonus mutation
          recomputes BudgetLine.committed_cents (mutation 2) -> and separately
          recomputes Nurse.retention_risk_score (mutation 3); each hop is caused
          by the previous mutation, not the original revoke.
        test_recipe:
          setup:
            - "Clock 2026-08-01; budget line ICU-4W FY2027 exists with ample allocation"
            - "Nurse R holds SPECIALTY certification (first-time, tenure 5y) -> bonus 150000 ACCRUED then PAID"
            - "committed_cents after pay == 0 (paid bonus leaves committed pool)"
          setup_api_calls:
            - call: "POST /clinical-ladder/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /clinical-ladder/budget-lines"
              payload: { unit: "ICU-4W", fiscal_year: 2027, allocated_cents: 9000000 }
              as: ProgramAdmin
              captures: { rbl_id: $.data.id }
            - call: "POST /clinical-ladder/nurses"
              payload: { employee_code: "RN-RC", full_name: "Nurse R", hire_date: "2021-08-01T00:00:00Z", home_unit: "ICU-4W" }
              as: ProgramAdmin
              captures: { nr_id: $.data.id }
            - call: "POST /clinical-ladder/certifications"
              payload: { nurse_id: "${nr_id}", track: "SPECIALTY", certifying_body: "ANCC", exam_fee_cents: 100000, obtained_on: "2026-07-01T00:00:00Z", expires_on: "2031-07-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { rc_id: $.data.id }
            - call: "GET /clinical-ladder/certifications/${rc_id}/certification-bonuses"
              payload: {}
              as: ProgramAdmin
              captures: { rb_id: "$.data[0].id" }
            - call: "POST /clinical-ladder/certification-bonuses/${rb_id}/pay"
              payload: {}
              as: PayrollOfficer
            - call: "GET /clinical-ladder/budget-lines/${rbl_id}"
              payload: {}
              as: ProgramAdmin
              captures: { rbl_committed_pre: $.data.committed_cents }
          trigger:
            - call: "POST /clinical-ladder/certifications/${rc_id}/revoke"
              payload: {}
              as: ProgramAdmin
            - call: "GET /clinical-ladder/certifications/${rc_id}/certification-bonuses"
              payload: {}
              as: ProgramAdmin
              captures: { rb_status: "$.data[0].status" }
            - call: "GET /clinical-ladder/budget-lines/${rbl_id}"
              payload: {}
              as: ProgramAdmin
              captures: { rbl_committed_post: $.data.committed_cents }
            - call: "GET /clinical-ladder/nurses/${nr_id}"
              payload: {}
              as: ProgramAdmin
              captures: { nr_risk: $.data.retention_risk_score }
          assert:
            - "rb_status == CLAWED_BACK"
            - "rbl_committed_pre == 0 and rbl_committed_post == 0 (paid-then-clawed-back nets to zero drift)"
            - "nr_risk == 5 (single clawback bump)"

