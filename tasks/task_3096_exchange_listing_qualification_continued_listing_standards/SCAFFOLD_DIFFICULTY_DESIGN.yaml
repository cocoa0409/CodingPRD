          assert:
            - "the delisting fill created an ANNUAL FeeAssessment for 2027 with delisted_mid_year == true"
            - "FeeAssessment.${fill_fee_id}.shares_outstanding == 20000000 (sourced from the approving application's unrestricted_publicly_held_shares)"
            - "FeeAssessment.${fill_fee_id}.amount_cents == 1800000 — CAPITAL top bracket clamps 20000000 to the bracket max 800000 FIRST, then the flat 1000000 mid-year surcharge is added (800000 + 1000000)"
            - "FeeAssessment.${fill_fee_id}.amount_cents != 800000 — the surcharge is never bracket-clamped away"
            - "FeeAssessment.${fill_fee_id}.status == INVOICED (the fill invoices immediately inside the delisting request)"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: deficiency_regain_redeficiency_cycle
        grounds:
          - state_machines.Deficiency.OPEN_to_REGAINED
          - calculations.deficiency_streak_detection
          - endpoints.POST_/issuers/{issuerId}/deficiency-monitor/run
        distinguishing_aspect: "Cyclic machine on Deficiency: OPEN → REGAINED (via 10 compliant days), then a fresh 30-day slide re-enters the same issuer into a NEW OPEN deficiency — the cycle closes on the same entity type with a new row, and each regain mints a ComplianceRecord."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Issuer APP5 LISTED on CAPITAL. 30 snapshots at 90 cents (deficiency #1 detected OPEN), then 10 snapshots at 150 cents."
