  - rule_id: non_linear_state_machine
    instances:
      - name: reservation_compliance_dimension_degrades_while_booking_dimension_holds
        grounds:
          - state_machines.Reservation.VERIFIED_to_DEFICIENT
          - state_machines.HealthDocument.UNDER_REVIEW_to_REJECTED
          - entities.Reservation.fields.booking_status
          - entities.Reservation.fields.compliance_status
        distinguishing_aspect: |
          PARALLEL shape on Reservation: booking_status and compliance_status are two independent state
          dimensions on one row, and rejecting a second document drives compliance_status VERIFIED -> DEFICIENT
          and the animal TRAVEL_READY -> SCREENED while booking_status stays CONFIRMED.
        test_recipe:
          setup:
            - "Fully compliant CHECKED itinerary: reservation CONFIRMED, compliance_status VERIFIED, animal TRAVEL_READY, one RESERVED segment, HEALTH_CERTIFICATE VERIFIED"
            - "A second document (VACCINATION_RECORD) is submitted and put UNDER_REVIEW; because compliance_status is already VERIFIED the start-review edge does not move it back to IN_REVIEW"
          setup_api_calls:
            - { call: "POST /species-profiles", payload: { species_code: "DOG", common_name: "Dog", acceptance_class: "ACCEPTED_ALL_ROUTINGS", max_cabin_weight_kg: 12, min_age_weeks: 16 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { sp_dog: $.data.id } }
