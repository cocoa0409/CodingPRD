scenario: |
  Film and TV production management system: project planning with script breakdown, scene-shot list,
  production schedule baseline, and milestone tracking; casting management with role description,
  audition record, agency contact, contract signing, and casting status workflow; shooting location
  scheduling with location reservation, permit tracking, weather-dependent rescheduling, and multi-unit
  parallel shooting coordination; actor availability conflict detection with cross-project schedule
  check, scene call-sheet conflict validation, travel-time buffer, and substitution arrangement; props
  and equipment list with category management, rental and purchase records, on-set check-in/check-out,
  loss and damage reporting, and return tracking; budget control with category-level budget allocation,
  actual vs. planned tracking, change-order approval, overspend alerts, and reserve fund management;
  wrap settlement with crew payroll calculation, vendor invoice reconciliation, equipment return
  verification, residual budget handling, and final account closing; event-driven synchronization with
  payment, contract, and finance systems; audit logging for schedule changes and budget adjustments.

domain_name: film-tv-production
api_prefix: /productions

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
    - scheduled_deferred_actions
  entity_topology: hybrid
  state_machine_shape: posture_driven
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
    - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Production
    parent: null
    common_fields: true
    fields:
      - name: title
        type: string
        source: input
        description: Project title
        constraints: 1..200 chars, unique within active productions
      - name: production_type
        type: enum
        source: input
        description: Project type
        constraints: "values: FILM, TV_SERIES, DOCUMENTARY, COMMERCIAL"
      - name: shoot_window_start
        type: datetime
        source: input
        description: Earliest scheduled shoot date (inclusive)
      - name: shoot_window_end
        type: datetime
        source: input
        description: Latest scheduled shoot date (inclusive)
      - name: total_budget_cents
        type: integer
        source: input
        description: Total approved budget in cents
        constraints: ">= 0"
      - name: reserve_fund_cents
        type: integer
        source: input
        description: Reserve fund earmarked from total budget
        constraints: "0 <= reserve_fund_cents <= total_budget_cents"
      - name: status
        type: enum
        source: computed
        description: Production lifecycle status
        constraints: "values: PLANNING, IN_PRODUCTION, WRAP_PENDING, WRAPPED, CANCELLED"
      - name: posture
        type: enum
        source: computed
        description: Aggregate posture derived from budget and milestone health
        constraints: "values: GREEN, YELLOW, RED, FROZEN"
      - name: schedule_baseline_locked_at
        type: datetime
        source: computed
        description: When the production schedule baseline was locked; null if not yet locked
        default: null
      - name: spent_cents
        type: integer
        source: computed
        description: Cumulative actual spend across all categories (denormalized)
        default: 0
      - name: committed_cents
        type: integer
        source: computed
        description: Cumulative committed (allocated but not yet paid) across categories (denormalized)
        default: 0
      - name: residual_cents
        type: integer
        source: computed
        description: total_budget_cents - spent_cents - committed_cents at wrap
        default: 0

  - name: Scene
    parent: Production
    common_fields: true
    fields:
      - name: production_id
        type: string
        source: input
        description: FK to Production.id
      - name: scene_number
        type: string
        source: input
        description: Script scene identifier
        constraints: unique within production
      - name: int_ext
        type: enum
        source: input
        description: Interior or exterior
        constraints: "values: INT, EXT, INT_EXT"
      - name: planned_duration_minutes
        type: integer
        source: input
        description: Estimated shoot duration on a single shoot day
        constraints: ">= 1, <= 720"
      - name: required_actor_role_ids
        type: array
        source: input
        description: List of Role.id IDs required on the call sheet
      - name: required_equipment_categories
        type: array
        source: input
        description: List of equipment category strings required (e.g., CAMERA, LIGHTING)
      - name: weather_dependent
        type: boolean
        source: input
        description: Whether scene requires acceptable weather window
        default: false
      - name: status
        type: enum
        source: computed
        description: Scene scheduling lifecycle
        constraints: "values: BREAKDOWN, SCHEDULED, RESCHEDULING, SHOT, OMITTED"

  - name: Role
    parent: Production
    common_fields: true
    fields:
      - name: production_id
        type: string
        source: input
        description: FK to Production.id
      - name: role_name
        type: string
        source: input
        description: Character / role name
        constraints: unique within production
      - name: description
        type: string
        source: input
        description: Free-text role description
      - name: union_tier
        type: enum
        source: input
        description: Union tier governing day rate floors
        constraints: "values: PRINCIPAL, SUPPORTING, FEATURED_BACKGROUND"
      - name: day_rate_cents
        type: integer
        source: input
        description: Contracted day rate in cents
        constraints: ">= 0"
      - name: casting_status
        type: enum
        source: computed
        description: Casting workflow state
        constraints: "values: OPEN, AUDITIONING, SHORTLISTED, OFFERED, SIGNED, RECAST"
      - name: signed_actor_id
        type: string
        source: computed
        description: Actor.id of signed actor, null until SIGNED
        default: null
      - name: signed_at
        type: datetime
        source: computed
        description: Contract signing timestamp; null until SIGNED
        default: null

  - name: Actor
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Actor legal name
      - name: agency_contact_email
        type: string
        source: input
        description: Talent agency contact email
      - name: travel_origin_zone
        type: string
        source: input
        description: Geographic zone identifier (used for travel buffer lookups)
      - name: active
        type: boolean
        source: computed
        description: Whether the actor record is active (used for soft archival)
        default: true

  - name: Audition
    parent: Role
    common_fields: false
    fields:
      - name: role_id
        type: string
        source: input
        description: FK to Role.id
      - name: actor_id
        type: string
        source: input
        description: FK to Actor.id
      - name: audition_at
        type: datetime
        source: input
        description: Scheduled audition datetime
      - name: outcome
        type: enum
        source: input
        description: Audition outcome
        constraints: "values: PASS, REJECT, CALLBACK"
      - name: notes
        type: string
        source: input
        description: Free-text panel notes

  - name: Location
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Location name
      - name: zone
        type: string
        source: input
        description: Geographic zone identifier (matches Actor.travel_origin_zone semantics)
      - name: requires_permit
        type: boolean
        source: input
        description: Whether shooting at this location requires a permit
        default: false
      - name: max_parallel_units
        type: integer
        source: input
        description: Maximum number of distinct shooting units that may operate simultaneously at this location
        default: 1
        constraints: ">= 1"

  - name: LocationReservation
    parent: Location
    common_fields: true
    fields:
      - name: location_id
        type: string
        source: input
        description: FK to Location.id
      - name: production_id
        type: string
        source: input
        description: FK to Production.id
      - name: scene_id
        type: string
        source: input
        description: FK to Scene.id (the scene to be shot in this reservation)
      - name: unit_label
        type: string
        source: input
        description: Shooting unit label (e.g., MAIN, B_UNIT, SECOND)
        constraints: unique per (location_id, time-overlap)
      - name: start_at
        type: datetime
        source: input
        description: Reservation start (inclusive)
      - name: end_at
        type: datetime
        source: input
        description: Reservation end (exclusive)
      - name: permit_status
        type: enum
        source: computed
        description: Permit tracking state
        constraints: "values: NOT_REQUIRED, PENDING, APPROVED, REJECTED, EXPIRED"
      - name: weather_status
        type: enum
        source: computed
        description: Weather window evaluation
        constraints: "values: UNKNOWN, ACCEPTABLE, BLOCKED"
      - name: status
        type: enum
        source: computed
        description: Reservation lifecycle
        constraints: "values: HELD, CONFIRMED, RESCHEDULING, RELEASED, FULFILLED"

  - name: BudgetCategory
    parent: Production
    common_fields: true
    fields:
      - name: production_id
        type: string
        source: input
        description: FK to Production.id
      - name: code
        type: enum
        source: input
        description: Standard category code
        constraints: "values: CAST, CREW, EQUIPMENT, LOCATION, POST, MISC"
      - name: planned_cents
        type: integer
        source: input
        description: Allocated planned amount for this category
        constraints: ">= 0; sum of planned_cents across categories <= Production.total_budget_cents - Production.reserve_fund_cents"
      - name: committed_cents
        type: integer
        source: computed
        description: Sum of committed (open change orders + open contracts/PO) under this category
        default: 0
      - name: actual_cents
        type: integer
        source: computed
        description: Sum of paid/closed expenses under this category
        default: 0
      - name: alert_state
        type: enum
        source: computed
        description: Threshold-based alert posture (rate_threshold_triggers)
        constraints: "values: OK, WARN, OVER"

  - name: ChangeOrder
    parent: BudgetCategory
    common_fields: true
    fields:
      - name: production_id
        type: string
        source: input
        description: FK to Production.id
      - name: category_id
        type: string
        source: input
        description: FK to BudgetCategory.id
      - name: delta_cents
        type: integer
        source: input
        description: Amount to add (positive) or release (negative) into category planned_cents
      - name: justification
        type: string
        source: input
        description: Free-text justification
      - name: requested_by
        type: string
        source: input
        description: Identifier (X-User-ID) of requesting LineProducer
      - name: approved_by
        type: string
        source: computed
        description: Identifier (X-User-ID) of approving FinanceController
        default: null
      - name: source
        type: enum
        source: input
        description: Funding source for delta
        constraints: "values: REALLOCATION, RESERVE_DRAW"
      - name: status
        type: enum
        source: computed
        description: Change-order state
        constraints: "values: PENDING, APPROVED, REJECTED, CANCELLED"

  - name: Equipment
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Equipment item name
      - name: category
        type: enum
        source: input
        description: Equipment category code
        constraints: "values: CAMERA, LIGHTING, SOUND, GRIP, WARDROBE, PROPS, MISC"
      - name: acquisition_mode
        type: enum
        source: input
        description: How the item is sourced
        constraints: "values: RENTAL, PURCHASE"
      - name: vendor_id
        type: string
        source: input
        description: Vendor identifier (free-form opaque string for purchase/rental vendor)
      - name: unit_cost_cents
        type: integer
        source: input
        description: Daily rental cost (RENTAL) or purchase price (PURCHASE) in cents
        constraints: ">= 0"
      - name: status
        type: enum
        source: computed
        description: Inventory lifecycle
        constraints: "values: AVAILABLE, CHECKED_OUT, DAMAGED, LOST, RETURNED, DECOMMISSIONED"
      - name: last_check_event_id
        type: string
        source: computed
        description: Last EquipmentEvent.id (denormalized cursor)
        default: null

  - name: EquipmentEvent
    parent: Equipment
    common_fields: false
    fields:
      - name: equipment_id
        type: string
        source: input
        description: FK to Equipment.id
      - name: production_id
        type: string
        source: input
        description: FK to Production.id (which production the event belongs to)
      - name: event_type
        type: enum
        source: input
        description: Event type
        constraints: "values: CHECK_OUT, CHECK_IN, REPORT_DAMAGE, REPORT_LOSS, RETURN_VERIFIED"
      - name: occurred_at
        type: datetime
        source: input
        description: Timestamp the event was recorded
      - name: actor_user_id
        type: string
        source: input
        description: X-User-ID of operator who recorded the event
      - name: damage_charge_cents
        type: integer
        source: input
        description: Damage/loss charge in cents (0 unless REPORT_DAMAGE or REPORT_LOSS)
        default: 0

  - name: CrewAssignment
    parent: Production
    common_fields: true
    fields:
      - name: production_id
        type: string
        source: input
        description: FK to Production.id
      - name: crew_user_id
        type: string
        source: input
        description: X-User-ID of crew member
      - name: role_label
        type: string
        source: input
        description: Crew role label (e.g., DP, GAFFER, PA)
      - name: day_rate_cents
        type: integer
        source: input
        description: Contracted daily rate in cents
        constraints: ">= 0"
      - name: scheduled_days
        type: integer
        source: input
        description: Scheduled number of shoot days
        constraints: ">= 0"
      - name: actual_days
        type: integer
        source: computed
        description: Actual days logged at wrap settlement
        default: 0
      - name: payroll_cents
        type: integer
        source: computed
        description: Computed payroll amount at wrap
        default: 0
      - name: status
        type: enum
        source: computed
        description: Assignment lifecycle
        constraints: "values: BOOKED, ACTIVE, RELEASED, SETTLED"

  - name: VendorInvoice
    parent: Production
    common_fields: true
    fields:
      - name: production_id
        type: string
        source: input
        description: FK to Production.id
      - name: vendor_id
        type: string
        source: input
        description: Vendor identifier
      - name: category_code
        type: enum
        source: input
        description: BudgetCategory.code this invoice is charged against
        constraints: "values: CAST, CREW, EQUIPMENT, LOCATION, POST, MISC"
      - name: gross_cents
        type: integer
        source: input
        description: Gross invoice amount in cents
        constraints: ">= 0"
      - name: deduction_cents
        type: integer
        source: computed
        description: Damage/loss deductions reconciled from EquipmentEvents tied to vendor
        default: 0
      - name: net_cents
        type: integer
        source: computed
        description: gross_cents - deduction_cents
        default: 0
      - name: status
        type: enum
        source: computed
        description: Invoice lifecycle
        constraints: "values: SUBMITTED, RECONCILED, PAID, DISPUTED"

  - name: AuditLog
    parent: null
    common_fields: false
    fields:
      - name: production_id
        type: string
        source: input
        description: FK to Production.id
      - name: actor_user_id
        type: string
        source: input
        description: X-User-ID who performed the action
      - name: action
        type: enum
        source: input
        description: Audited action type
        constraints: "values: SCHEDULE_CHANGE, BUDGET_ADJUSTMENT, RESERVE_DRAW, CONTRACT_SIGNED, EQUIPMENT_LOSS, WRAP_CLOSE"
      - name: subject_entity
        type: string
        source: input
        description: Entity name affected
      - name: subject_id
        type: string
        source: input
        description: id of affected entity
      - name: before_json
        type: object
        source: input
        description: Pre-mutation snapshot
      - name: after_json
        type: object
        source: input
        description: Post-mutation snapshot
      - name: occurred_at
        type: datetime
        source: input
        description: Mutation timestamp

  - name: Clock
    parent: null
    common_fields: false
    fields:
      - name: now
        type: datetime
        source: system
        description: Current logical time advanced via POST /_clock/advance

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: Production
    initial_state: PLANNING
    terminal_states: [WRAPPED, CANCELLED]
    transitions:
      - from: PLANNING
        to: IN_PRODUCTION
        trigger: "POST /productions/{id}/lock-baseline"
        actor: LineProducer
        preconditions:
          - "schedule_baseline_locked_at is null"
          - "at least one Scene exists with status SCHEDULED"
          - "sum of BudgetCategory.planned_cents <= total_budget_cents - reserve_fund_cents"
        side_effects:
          - "set schedule_baseline_locked_at = Clock.now"
          - "recompute Production.posture (cascade to evaluate_production_posture)"
          - "AuditLog action=SCHEDULE_CHANGE"
      - from: IN_PRODUCTION
        to: WRAP_PENDING
        trigger: "POST /productions/{id}/begin-wrap"
        actor: LineProducer
        preconditions:
          - "all Scene status in {SHOT, OMITTED}"
          - "all LocationReservation in {FULFILLED, RELEASED}"
          - "no Equipment in CHECKED_OUT for this production"
        side_effects:
          - "freeze posture: posture := FROZEN"
          - "transition all CrewAssignment from ACTIVE to RELEASED"
          - "AuditLog action=SCHEDULE_CHANGE"
      - from: WRAP_PENDING
        to: WRAPPED
        trigger: "POST /productions/{id}/close-account"
        actor: FinanceController
        preconditions:
          - "all CrewAssignment in {RELEASED, SETTLED}"
          - "all VendorInvoice in {PAID, DISPUTED}"
          - "all CrewAssignment.payroll_cents have been computed"
        side_effects:
          - "compute residual_cents = total_budget_cents - spent_cents - committed_cents"
          - "transition all CrewAssignment in RELEASED to SETTLED"
          - "emit finance.production.closed event"
          - "AuditLog action=WRAP_CLOSE"
      - from: PLANNING
        to: CANCELLED
        trigger: "POST /productions/{id}/cancel"
        actor: ExecutiveProducer
        preconditions:
          - "no signed Role contracts (no Role.casting_status == SIGNED)"
        side_effects:
          - "release all LocationReservation in HELD/CONFIRMED to RELEASED"
          - "transition all Role from any non-terminal to RECAST"
          - "AuditLog action=SCHEDULE_CHANGE"
      - from: IN_PRODUCTION
        to: CANCELLED
        trigger: "POST /productions/{id}/cancel"
        actor: ExecutiveProducer
        preconditions:
          - "X-Override-Reason header present and non-empty"
        side_effects:
          - "cascade: release all LocationReservation; demote all CrewAssignment ACTIVE→RELEASED; mark all open ChangeOrder as CANCELLED"
          - "AuditLog action=SCHEDULE_CHANGE with override_reason"

  - entity: Role
    initial_state: OPEN
    terminal_states: [SIGNED, RECAST]
    transitions:
      - from: OPEN
        to: AUDITIONING
        trigger: "POST /productions/{pid}/roles/{rid}/auditions (first audition created)"
        actor: CastingDirector
        preconditions:
          - "Production.status == PLANNING"
        side_effects:
          - "AuditLog action=SCHEDULE_CHANGE"
      - from: AUDITIONING
        to: SHORTLISTED
        trigger: "POST /productions/{pid}/roles/{rid}/shortlist"
        actor: CastingDirector
        preconditions:
          - "at least one Audition with outcome == PASS"
        side_effects: []
      - from: SHORTLISTED
        to: OFFERED
        trigger: "POST /productions/{pid}/roles/{rid}/offer"
        actor: CastingDirector
        preconditions:
          - "request body actor_id refers to an Audition.outcome == PASS for this role"
        side_effects: []
      - from: OFFERED
        to: SIGNED
        trigger: "POST /productions/{pid}/roles/{rid}/sign"
        actor: LineProducer
        preconditions:
          - "no actor schedule conflict at any Scene call sheet referencing this Role"
          - "BudgetCategory.code=CAST has planned_cents - committed_cents - actual_cents >= projected_cast_commit"
        side_effects:
          - "set Role.signed_actor_id, signed_at"
          - "increment BudgetCategory(CAST).committed_cents by projected_cast_commit (calc: cast_commit_estimate)"
          - "emit contract.role.signed event"
          - "recompute Production.posture (cascade through budget alert)"
          - "AuditLog action=CONTRACT_SIGNED"
      - from: AUDITIONING
        to: RECAST
        trigger: "POST /productions/{pid}/roles/{rid}/recast"
        actor: CastingDirector
        preconditions: []
        side_effects: []
      - from: SHORTLISTED
        to: AUDITIONING
        trigger: "POST /productions/{pid}/roles/{rid}/reopen-auditions"
        actor: CastingDirector
        preconditions:
          - "Production.status == PLANNING"
        side_effects:
          - "AuditLog action=SCHEDULE_CHANGE"
      - from: SIGNED
        to: RECAST
        trigger: "POST /productions/{pid}/roles/{rid}/substitute"
        actor: LineProducer
        preconditions:
          - "request body replacement_actor_id is a different Actor with no scheduling conflicts"
          - "Production.status in {PLANNING, IN_PRODUCTION}"
        side_effects:
          - "decrement BudgetCategory(CAST).committed_cents by previous projected_cast_commit"
          - "create a new Role record (parent of the substitution chain) and immediately SIGN it with replacement_actor_id; new Role.committed_cents added"
          - "emit contract.role.substituted event"
          - "AuditLog action=CONTRACT_SIGNED"

  - entity: Scene
    initial_state: BREAKDOWN
    terminal_states: [SHOT, OMITTED]
    transitions:
      - from: BREAKDOWN
        to: SCHEDULED
        trigger: "POST /productions/{pid}/scenes/{sid}/schedule (with reservation_id)"
        actor: LineProducer
        preconditions:
          - "LocationReservation exists with status in {HELD, CONFIRMED} and scene_id matches"
          - "no actor conflict (validation #14, #15) for any required_actor_role with cast SIGNED"
          - "weather_dependent == false OR LocationReservation.weather_status == ACCEPTABLE"
        side_effects:
          - "AuditLog action=SCHEDULE_CHANGE"
      - from: SCHEDULED
        to: RESCHEDULING
        trigger: "POST /productions/{pid}/scenes/{sid}/mark-weather-blocked"
        actor: ProductionCoordinator
        preconditions:
          - "scene weather_dependent == true"
          - "linked LocationReservation.weather_status == BLOCKED"
        side_effects:
          - "linked LocationReservation transitions CONFIRMED→RESCHEDULING"
          - "AuditLog action=SCHEDULE_CHANGE"
      - from: RESCHEDULING
        to: SCHEDULED
        trigger: "POST /productions/{pid}/scenes/{sid}/reschedule (with new reservation_id)"
        actor: ProductionCoordinator
        preconditions:
          - "new LocationReservation in {HELD, CONFIRMED} with weather_status ACCEPTABLE"
          - "old LocationReservation released or transitioned RESCHEDULING→RELEASED"
        side_effects:
          - "old LocationReservation: RESCHEDULING→RELEASED (cascade)"
          - "new LocationReservation: HELD/CONFIRMED→CONFIRMED"
          - "AuditLog action=SCHEDULE_CHANGE"
      - from: SCHEDULED
        to: SHOT
        trigger: "POST /productions/{pid}/scenes/{sid}/mark-shot"
        actor: ProductionCoordinator
        preconditions:
          - "Production.status == IN_PRODUCTION"
          - "linked LocationReservation.status == CONFIRMED"
        side_effects:
          - "linked LocationReservation: CONFIRMED→FULFILLED"
          - "AuditLog action=SCHEDULE_CHANGE"
      - from: BREAKDOWN
        to: OMITTED
        trigger: "POST /productions/{pid}/scenes/{sid}/omit"
        actor: LineProducer
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: OMITTED
        trigger: "POST /productions/{pid}/scenes/{sid}/omit"
        actor: LineProducer
        preconditions:
          - "Production.status == PLANNING"
        side_effects:
          - "linked LocationReservation released (CONFIRMED→RELEASED)"
          - "AuditLog action=SCHEDULE_CHANGE"

  - entity: LocationReservation
    initial_state: HELD
    terminal_states: [RELEASED, FULFILLED]
    transitions:
      - from: HELD
        to: CONFIRMED
        trigger: "POST /location-reservations/{id}/confirm"
        actor: ProductionCoordinator
        preconditions:
          - "if Location.requires_permit then permit_status == APPROVED"
          - "weather_status != BLOCKED"
        side_effects: []
      - from: HELD
        to: RELEASED
        trigger: "POST /location-reservations/{id}/release"
        actor: ProductionCoordinator
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: RESCHEDULING
        trigger: "Scene transitions SCHEDULED→RESCHEDULING (cascade)"
        actor: system
        preconditions:
          - "linked Scene.weather_dependent == true and weather_status == BLOCKED"
        side_effects: []
      - from: RESCHEDULING
        to: RELEASED
        trigger: "POST /productions/{pid}/scenes/{sid}/reschedule (cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: FULFILLED
        trigger: "Scene mark-shot (cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ChangeOrder
    initial_state: PENDING
    terminal_states: [APPROVED, REJECTED, CANCELLED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /change-orders/{id}/approve"
        actor: FinanceController
        preconditions:
          - "approving FinanceController.X-User-ID != requested_by (segregation of duties)"
          - "if source == REALLOCATION: |delta_cents| <= sum of source-category slack (out of scope of this scaffold; treat as request-body validated)"
          - "if source == RESERVE_DRAW and delta_cents > 0: Production.reserve_fund_cents - already_drawn >= delta_cents"
          - "Production.status in {PLANNING, IN_PRODUCTION}"
        side_effects:
          - "BudgetCategory.planned_cents += delta_cents (the target category)"
          - "if source == RESERVE_DRAW: Production.reserve_fund_cents -= delta_cents (reserve depletes)"
          - "recompute BudgetCategory.alert_state via category_alert_state calc"
          - "recompute Production.posture (cascade)"
          - "AuditLog action=BUDGET_ADJUSTMENT (and RESERVE_DRAW if applicable)"
      - from: PENDING
        to: REJECTED
        trigger: "POST /change-orders/{id}/reject"
        actor: FinanceController
        preconditions:
          - "approving FinanceController.X-User-ID != requested_by"
        side_effects: []
      - from: PENDING
        to: CANCELLED
        trigger: "POST /change-orders/{id}/cancel"
        actor: LineProducer
        preconditions:
          - "X-User-ID == requested_by"
        side_effects: []

  - entity: Equipment
    initial_state: AVAILABLE
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: AVAILABLE
        to: CHECKED_OUT
        trigger: "POST /equipment/{id}/events (event_type=CHECK_OUT)"
        actor: ProductionCoordinator
        preconditions:
          - "no other Equipment record for this id is currently CHECKED_OUT"
          - "Production.status in {PLANNING, IN_PRODUCTION}"
        side_effects:
          - "BudgetCategory(EQUIPMENT).committed_cents += unit_cost_cents (RENTAL only)"
      - from: CHECKED_OUT
        to: AVAILABLE
        trigger: "POST /equipment/{id}/events (event_type=CHECK_IN)"
        actor: ProductionCoordinator
        preconditions: []
        side_effects:
          - "BudgetCategory(EQUIPMENT).committed_cents -= last CHECK_OUT's unit_cost_cents (RENTAL only); BudgetCategory(EQUIPMENT).actual_cents += unit_cost_cents"
      - from: CHECKED_OUT
        to: DAMAGED
        trigger: "POST /equipment/{id}/events (event_type=REPORT_DAMAGE)"
        actor: ProductionCoordinator
        preconditions:
          - "request body damage_charge_cents > 0"
        side_effects:
          - "BudgetCategory(EQUIPMENT).committed_cents += damage_charge_cents"
          - "AuditLog action=EQUIPMENT_LOSS"
      - from: CHECKED_OUT
        to: LOST
        trigger: "POST /equipment/{id}/events (event_type=REPORT_LOSS)"
        actor: ProductionCoordinator
        preconditions:
          - "request body damage_charge_cents > 0"
        side_effects:
          - "BudgetCategory(EQUIPMENT).committed_cents += damage_charge_cents"
          - "AuditLog action=EQUIPMENT_LOSS"
      - from: DAMAGED
        to: RETURNED
        trigger: "POST /equipment/{id}/events (event_type=RETURN_VERIFIED)"
        actor: FinanceController
        preconditions:
          - "previous event was REPORT_DAMAGE or REPORT_LOSS"
          - "vendor invoice for this equipment.vendor_id has not yet reconciled this charge"
        side_effects:
          - "linked VendorInvoice.deduction_cents += damage_charge_cents (compensating: invoice reconciliation reduces gross by this much; see below)"
          - "BudgetCategory(EQUIPMENT).committed_cents -= damage_charge_cents (the deducted portion is no longer payable)"
          - "AuditLog action=EQUIPMENT_LOSS"
      - from: LOST
        to: RETURNED
        trigger: "POST /equipment/{id}/events (event_type=RETURN_VERIFIED)"
        actor: FinanceController
        preconditions:
          - "previous event was REPORT_LOSS and the lost item was located"
        side_effects:
          - "linked VendorInvoice.deduction_cents += damage_charge_cents"
          - "BudgetCategory(EQUIPMENT).committed_cents -= damage_charge_cents"
      - from: AVAILABLE
        to: DECOMMISSIONED
        trigger: "POST /equipment/{id}/decommission"
        actor: FinanceController
        preconditions:
          - "no open EquipmentEvent (last event must be CHECK_IN, RETURN_VERIFIED, or none)"
        side_effects: []

  - entity: VendorInvoice
    initial_state: SUBMITTED
    terminal_states: [PAID, DISPUTED]
    transitions:
      - from: SUBMITTED
        to: RECONCILED
        trigger: "POST /vendor-invoices/{id}/reconcile"
        actor: FinanceController
        preconditions:
          - "all linked Equipment with status in {DAMAGED, LOST} have been transitioned to RETURNED, OR submitter accepts deduction snapshot"
          - "net_cents == gross_cents - deduction_cents has been recomputed"
        side_effects:
          - "set net_cents = gross_cents - deduction_cents"
          - "BudgetCategory(category_code).committed_cents -= net_cents; BudgetCategory(category_code).actual_cents += net_cents"
      - from: RECONCILED
        to: PAID
        trigger: "POST /vendor-invoices/{id}/pay"
        actor: FinanceController
        preconditions:
          - "Production.status in {IN_PRODUCTION, WRAP_PENDING}"
        side_effects:
          - "emit payment.invoice.paid event"
          - "Production.spent_cents += net_cents (denormalized aggregator)"
      - from: SUBMITTED
        to: DISPUTED
        trigger: "POST /vendor-invoices/{id}/dispute"
        actor: FinanceController
        preconditions: []
        side_effects: []

  - entity: CrewAssignment
    initial_state: BOOKED
    terminal_states: [SETTLED]
    transitions:
      - from: BOOKED
        to: ACTIVE
        trigger: "Production transitions PLANNING→IN_PRODUCTION (cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "BudgetCategory(CREW).committed_cents += day_rate_cents * scheduled_days"
      - from: ACTIVE
        to: RELEASED
        trigger: "Production transitions IN_PRODUCTION→WRAP_PENDING (cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RELEASED
        to: SETTLED
        trigger: "Production transitions WRAP_PENDING→WRAPPED (cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "compute payroll_cents via crew_payroll_calc; BudgetCategory(CREW).committed_cents -= day_rate_cents * scheduled_days; BudgetCategory(CREW).actual_cents += payroll_cents"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two LocationReservations created with overlapping intervals at the same Location once max_parallel_units saturated"
    guarantee: "Only the first reservation that takes the last available unit slot succeeds; subsequent overlapping create rejected"
    error_id: ERR_LOCATION_OVER_CAPACITY
    http_status: 409
    serialization: "First-writer-wins on (location_id, time-overlap, unit_label)"

  - scenario: "Two casting offers signed for the same Role concurrently"
    guarantee: "At most one Role.signed_actor_id is set; second sign rejected"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Role.casting_status OFFERED→SIGNED"

  - scenario: "Reserve draw approved by two FinanceControllers concurrently when reserve fund is insufficient for both"
    guarantee: "Whichever change-order approval lands first wins; the second fails with ERR_RESERVE_INSUFFICIENT"
    error_id: ERR_RESERVE_INSUFFICIENT
    http_status: 409
    serialization: "First-writer-wins on Production.reserve_fund_cents debit"

  - scenario: "Two CHECK_OUT events submitted on the same Equipment.id at the same time"
    guarantee: "Only the first CHECK_OUT succeeds; second rejected"
    error_id: ERR_EQUIPMENT_UNAVAILABLE
    http_status: 409
    serialization: "First-writer-wins on Equipment.status AVAILABLE→CHECKED_OUT"

  - scenario: "Sign Role and Cancel Production submitted concurrently"
    guarantee: "Exactly one operation succeeds; loser sees ERR_INVALID_STATE"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Production.status mutation"

  - scenario: "Two ChangeOrder.approve calls land on the same PENDING change-order"
    guarantee: "First approval transitions PENDING→APPROVED; second rejected"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on ChangeOrder.status"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: cast_commit_estimate
    trigger: "Role transitions OFFERED→SIGNED"
    algorithm: forward_looking
    formula: |
      # Estimate the cast cost commitment when contracting an actor.
      # Sum over all Scenes in this production that list this Role in required_actor_role_ids
      # and have status in {BREAKDOWN, SCHEDULED, RESCHEDULING}; compute distinct shoot days.
      #
      # A shoot day = ceil(planned_duration_minutes / 480) for each scene; the sum across the
      # role's scenes is the projected work-days, capped at max_days_cap_by_tier[union_tier].
      #
      # PRINCIPAL cap = 60 days, SUPPORTING = 30, FEATURED_BACKGROUND = 10.
      #
      # commit = min(cap, sum_over_scenes_in_status_set( ceil(scene.planned_duration_minutes / 480) ))
      #          * Role.day_rate_cents
      total_days = 0
      for scene in production.scenes:
          if Role.id in scene.required_actor_role_ids and scene.status in {BREAKDOWN, SCHEDULED, RESCHEDULING}:
              total_days += ceil(scene.planned_duration_minutes / 480)
      capped = min(total_days, CAP_BY_TIER[Role.union_tier])
      commit_cents = capped * Role.day_rate_cents
    input_set: "Scene.status in {BREAKDOWN, SCHEDULED, RESCHEDULING} (excludes SHOT and OMITTED)"
    constants:
      CAP_BY_TIER:
        PRINCIPAL: 60
        SUPPORTING: 30
        FEATURED_BACKGROUND: 10
      MINUTES_PER_SHOOT_DAY: 480
    precision: "integer cents (no rounding step beyond ceil(minutes/480))"
    variants:
      - name: at_offer_time
        when: "Computed for posture display while Role.casting_status == OFFERED (read-only forecast)"
        difference: "Includes ALL scenes regardless of status (forecast view, larger total)"
      - name: at_sign_time
        when: "Persisted as committed_cents delta on OFFERED→SIGNED transition"
        difference: "Excludes SHOT and OMITTED scenes (locked-in subset, smaller total). The delta written to BudgetCategory(CAST).committed_cents uses this variant."

  - name: crew_payroll_calc
    trigger: "CrewAssignment transitions RELEASED→SETTLED (cascaded by Production WRAP_PENDING→WRAPPED)"
    algorithm: tiered_pricing
    formula: |
      # Daily payroll with tiered overtime.
      # base_days = min(actual_days, scheduled_days)
      # overtime_days = max(0, actual_days - scheduled_days)
      # Tiered overtime rate: first OT_TIER_BREAK days at OT_FIRST_MULT, beyond at OT_SECOND_MULT.
      # Per-line-item rounding: round_half_up each component (cents) BEFORE summing.
      base_pay_cents = base_days * day_rate_cents     # always integer (day_rate_cents is integer)
      ot_first = min(overtime_days, OT_TIER_BREAK)
      ot_second = max(0, overtime_days - OT_TIER_BREAK)
      ot_first_cents = round_half_up(ot_first * day_rate_cents * OT_FIRST_MULT)   # round per component
      ot_second_cents = round_half_up(ot_second * day_rate_cents * OT_SECOND_MULT) # round per component
      payroll_cents = base_pay_cents + ot_first_cents + ot_second_cents
    input_set: "CrewAssignment for production where Production.status == WRAPPED at settlement time"
    constants:
      OT_TIER_BREAK: 5
      OT_FIRST_MULT: 1.50
      OT_SECOND_MULT: 1.75
      ROUND_MODE: round_half_up
      ROUND_ORDER: per_component_then_sum
    precision: "integer cents; per-component rounding applied before summation; the ROUND_ORDER is the load-bearing distinction vs the forecast variant"
    variants:
      - name: per_component_rounding
        when: "Authoritative settlement variant"
        difference: "Round each of {ot_first_cents, ot_second_cents} BEFORE adding (this is the pinned variant)"
      - name: total_then_round
        when: "Display-only forecast on GET /productions/{id}/wrap-preview"
        difference: "Sum all components in cents-fractional first, round_half_up at the end. NOTE: For tests, results may differ by 1 cent vs the authoritative variant; the persisted CrewAssignment.payroll_cents MUST use per_component_rounding."

  - name: residual_budget
    trigger: "Production transitions WRAP_PENDING→WRAPPED"
    algorithm: aggregation
    formula: |
      residual_cents = total_budget_cents
                       - sum(BudgetCategory.actual_cents for category in this production)
                       - sum(BudgetCategory.committed_cents for category in this production)
      # All categories' committed_cents MUST be 0 at this point because all assignments
      # transitioned to SETTLED and all VendorInvoices to PAID; if not, abort with
      # ERR_OPEN_OBLIGATIONS.
    input_set: "BudgetCategory rows for this production"
    precision: "integer cents"
    variants:
      - name: provisional_at_wrap_pending
        when: "GET /productions/{id}/wrap-preview while status WRAP_PENDING"
        difference: "Includes still-committed_cents in subtraction (forecast subtotal)"
      - name: final_at_wrapped
        when: "Persisted at WRAP_PENDING→WRAPPED"
        difference: "Authoritative; requires committed_cents == 0 across categories. Persists Production.residual_cents."

  - name: category_alert_state
    trigger: "Any side-effect that mutates BudgetCategory.{committed_cents, actual_cents, planned_cents}"
    algorithm: threshold
    formula: |
      utilization = (committed_cents + actual_cents) / planned_cents   if planned_cents > 0 else 0
      if utilization > 1.00:
          alert_state = OVER
      elif utilization >= WARN_THRESHOLD:
          alert_state = WARN
      else:
          alert_state = OK
    input_set: "Single BudgetCategory row"
    constants:
      WARN_THRESHOLD: 0.90
    precision: "decimal comparison; thresholds are exact: utilization >= 0.90 triggers WARN; > 1.00 triggers OVER (1.00 itself is WARN, not OVER)"
    variants:
      - name: post_change_order
        when: "After ChangeOrder.approve"
        difference: "Recompute on the target category only"
      - name: post_invoice_reconcile
        when: "After VendorInvoice.reconcile or pay"
        difference: "Recompute on the invoice's category_code"

  - name: evaluate_production_posture
    trigger: "Any of: ChangeOrder approve, VendorInvoice reconcile/pay, Equipment damage/loss, baseline lock, contract sign"
    algorithm: weighted_scoring
    formula: |
      # Posture is a derived gate on child operations.
      # Inputs: any_category_alert_state == OVER ? RED
      #         else: any category WARN ? YELLOW
      #         else: GREEN
      # Once Production.status == WRAP_PENDING, posture is forced to FROZEN until WRAPPED.
      if Production.status == WRAP_PENDING:
          return FROZEN
      if any(category.alert_state == OVER): return RED
      if any(category.alert_state == WARN): return YELLOW
      return GREEN
      # Posture RED additionally blocks new ChangeOrder source=RESERVE_DRAW unless approver
      # supplies X-Override-Reason header.
    input_set: "All BudgetCategory rows for this production + Production.status"
    precision: "categorical"
    variants:
      - name: read_only_eval
        when: "Returned by GET /productions/{id}"
        difference: "Snapshot, not persisted"
      - name: persisted_eval
        when: "Written to Production.posture after qualifying side-effects"
        difference: "Authoritative; fires AuditLog action=BUDGET_ADJUSTMENT when transitioning to RED"

  - name: travel_buffer_minutes
    trigger: "Validation #14 (actor scene-call-sheet conflict) and validation #15 (cross-project conflict)"
    algorithm: threshold
    formula: |
      # Required travel buffer between two consecutive Scene/LocationReservation pairings
      # for the same Actor depends on whether prior_zone == next_zone.
      if prior_location.zone == next_location.zone:
          required_buffer_minutes = SAME_ZONE_BUFFER
      else:
          required_buffer_minutes = CROSS_ZONE_BUFFER
      # The buffer is required AFTER the prior reservation's end_at (exclusive)
      # and BEFORE the next reservation's start_at (inclusive).
      # Conflict iff next.start_at < prior.end_at + required_buffer_minutes.
    input_set: "Pair of LocationReservation rows for adjacent scenes featuring the same Actor"
    constants:
      SAME_ZONE_BUFFER: 60
      CROSS_ZONE_BUFFER: 240
    precision: "minutes; comparison: strict less-than"
    variants:
      - name: within_production
        when: "Both reservations belong to same production"
        difference: "Detected on Scene.schedule and Role.sign"
      - name: cross_production
        when: "Reservations belong to different productions for the same signed Actor"
        difference: "Detected at Role.sign and Scene.schedule via cross-production lookup; uses same buffers"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present"
    error_id: ERR_AUTH_REQUIRED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role authorized for endpoint per RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path resources exist (Production, Scene, Role, Audition, Location, LocationReservation, BudgetCategory, ChangeOrder, Equipment, EquipmentEvent, VendorInvoice, CrewAssignment, Actor) — validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: state
    check: "Resource version (if provided) matches current version (OCC)"
    error_id: ERR_VERSION_MISMATCH
    http_status: 409
    applies_to: "all PATCH/PUT mutations and state-changing POSTs that accept version"

  - priority: 5
    category: state
    check: "Target entity is in a state that permits the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state transitions"

  - priority: 6
    category: state
    check: "Production.posture != FROZEN gates non-wrap operations; Production.posture != RED gates RESERVE_DRAW change-orders unless X-Override-Reason header present"
    error_id: ERR_POSTURE_BLOCKED
    http_status: 409
    applies_to: "all mutations except wrap-progression endpoints"

  - priority: 7
    category: business_safety
    check: "ChangeOrder.approve segregation of duties: approver X-User-ID != requested_by"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /change-orders/{id}/approve"

  - priority: 8
    category: business_referential
    check: "Foreign key references resolve and belong to expected scope (e.g., Scene.production_id matches path /productions/{pid}; LocationReservation.scene_id production matches reservation production)"
    error_id: ERR_REFERENCE_MISMATCH
    http_status: 422
    applies_to: "all create/update endpoints with FK fields"

  - priority: 9
    category: business_constraint
    check: "LocationReservation interval semantics: start_at < end_at; both within Production.shoot_window_start..shoot_window_end"
    error_id: ERR_INVALID_INTERVAL
    http_status: 422
    applies_to: "POST /location-reservations, PATCH /location-reservations/{id}"

  - priority: 10
    category: business_constraint
    check: "Permit required: Location.requires_permit == true ⇒ LocationReservation.confirm rejected unless permit_status == APPROVED"
    error_id: ERR_PERMIT_REQUIRED
    http_status: 409
    applies_to: "POST /location-reservations/{id}/confirm"

  - priority: 11
    category: business_constraint
    check: "Location capacity: count of overlapping LocationReservations at the same Location.id (intervals [start_at, end_at) overlap, status in {HELD, CONFIRMED, RESCHEDULING}) MUST be < Location.max_parallel_units; unit_label MUST be unique among overlapping reservations"
    error_id: ERR_LOCATION_OVER_CAPACITY
    http_status: 409
    applies_to: "POST /location-reservations, POST /location-reservations/{id}/confirm"

  - priority: 12
    category: business_constraint
    check: "Weather-blocked scene cannot be scheduled into a reservation with weather_status != ACCEPTABLE"
    error_id: ERR_WEATHER_BLOCKED
    http_status: 409
    applies_to: "POST /productions/{pid}/scenes/{sid}/schedule, /reschedule"

  - priority: 13
    category: business_constraint
    check: "Audition.outcome == PASS exists for actor_id before Role.offer (offered actor must have a passing audition)"
    error_id: ERR_AUDITION_NOT_PASSED
    http_status: 422
    applies_to: "POST /productions/{pid}/roles/{rid}/offer"

  - priority: 14
    category: business_temporal
    check: "Same-production scene call-sheet conflict: two Scenes both featuring the same signed Actor (via Role) cannot have overlapping LocationReservations; even when non-overlapping, the gap MUST satisfy travel_buffer_minutes (variant within_production)"
    error_id: ERR_ACTOR_CALLSHEET_CONFLICT
    http_status: 409
    applies_to: "POST /productions/{pid}/scenes/{sid}/schedule, /reschedule"

  - priority: 15
    category: business_temporal
    check: "Cross-project actor scheduling conflict: actor signed on Role in another active Production (Production.status in {PLANNING, IN_PRODUCTION}); their LocationReservations across productions MUST NOT overlap and MUST satisfy travel_buffer_minutes (variant cross_production)"
    error_id: ERR_CROSS_PROJECT_CONFLICT
    http_status: 409
    applies_to: "POST /productions/{pid}/roles/{rid}/sign, POST /productions/{pid}/scenes/{sid}/schedule"

  - priority: 16
    category: business_constraint
    check: "Equipment availability: cannot CHECK_OUT an Equipment whose current status != AVAILABLE"
    error_id: ERR_EQUIPMENT_UNAVAILABLE
    http_status: 409
    applies_to: "POST /equipment/{id}/events (event_type=CHECK_OUT)"

  - priority: 17
    category: business_constraint
    check: "Equipment damage/loss event MUST include damage_charge_cents > 0; CHECK_OUT/CHECK_IN MUST have damage_charge_cents == 0"
    error_id: ERR_INVALID_EVENT_PAYLOAD
    http_status: 422
    applies_to: "POST /equipment/{id}/events"

  - priority: 18
    category: business_fiscal
    check: "BudgetCategory.planned_cents adjustment: sum across categories + Production.reserve_fund_cents <= Production.total_budget_cents"
    error_id: ERR_BUDGET_OVERALLOCATED
    http_status: 422
    applies_to: "POST /productions/{pid}/budget-categories, POST /change-orders/{id}/approve"

  - priority: 19
    category: business_fiscal
    check: "ChangeOrder source=RESERVE_DRAW: delta_cents <= Production.reserve_fund_cents (remaining)"
    error_id: ERR_RESERVE_INSUFFICIENT
    http_status: 409
    applies_to: "POST /change-orders/{id}/approve"

  - priority: 20
    category: business_fiscal
    check: "Wrap close requires no open obligations: every BudgetCategory.committed_cents == 0; every Equipment for production not in {DAMAGED, LOST, CHECKED_OUT}; every CrewAssignment in {RELEASED, SETTLED}; every VendorInvoice in {PAID, DISPUTED}"
    error_id: ERR_OPEN_OBLIGATIONS
    http_status: 409
    applies_to: "POST /productions/{id}/close-account"

  - priority: 21
    category: business_constraint
    check: "Pagination params within bounds (limit in [1, 100], offset >= 0)"
    error_id: ERR_INVALID_PAGINATION
    http_status: 422
    applies_to: "all GET list endpoints"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Production lifecycle ---
  - method: POST
    path: "/productions"
    description: "Create production"
    roles: [ExecutiveProducer]
    code: 201
    input: [title, production_type, shoot_window_start, shoot_window_end, total_budget_cents, reserve_fund_cents]
    output: Production
    side_effects: ["initialize Production with status=PLANNING, posture=GREEN"]

  - method: GET
    path: "/productions/{id}"
    description: "Get production with derived posture (read-only)"
    roles: [ExecutiveProducer, LineProducer, FinanceController, CastingDirector, ProductionCoordinator]
    code: 200
    input: []
    output: Production

  - method: GET
    path: "/productions"
    description: "List productions (filter by status, production_type)"
    roles: [ExecutiveProducer, LineProducer, FinanceController, CastingDirector, ProductionCoordinator]
    code: 200
    input: ["status?", "production_type?", "limit?", "offset?"]
    output: "Production[]"

  - method: POST
    path: "/productions/{id}/lock-baseline"
    description: "Lock the production schedule baseline (PLANNING→IN_PRODUCTION)"
    roles: [LineProducer]
    code: 200
    input: ["version?"]
    output: Production
    side_effects: ["set schedule_baseline_locked_at; cascade CrewAssignment BOOKED→ACTIVE"]

  - method: POST
    path: "/productions/{id}/begin-wrap"
    description: "Begin wrap (IN_PRODUCTION→WRAP_PENDING)"
    roles: [LineProducer]
    code: 200
    input: ["version?"]
    output: Production
    side_effects: ["posture forced FROZEN; cascade CrewAssignment ACTIVE→RELEASED"]

  - method: POST
    path: "/productions/{id}/close-account"
    description: "Close production account (WRAP_PENDING→WRAPPED)"
    roles: [FinanceController]
    code: 200
    input: ["version?"]
    output: Production
    side_effects: ["compute residual_cents (residual_budget calc, final_at_wrapped variant); cascade CrewAssignment RELEASED→SETTLED with crew_payroll_calc; emit finance.production.closed event"]

  - method: POST
    path: "/productions/{id}/cancel"
    description: "Cancel production (PLANNING|IN_PRODUCTION→CANCELLED)"
    roles: [ExecutiveProducer]
    code: 200
    input: ["version?"]
    output: Production
    side_effects: ["release reservations; recast roles; cancel pending change-orders"]

  - method: GET
    path: "/productions/{id}/wrap-preview"
    description: "Provisional residual & payroll preview (residual_budget provisional_at_wrap_pending; crew_payroll_calc total_then_round variant for forecast)"
    roles: [LineProducer, FinanceController]
    code: 200
    input: []
    output: "object"

  # --- Scenes ---
  - method: POST
    path: "/productions/{pid}/scenes"
    description: "Create scene (script breakdown entry)"
    roles: [LineProducer]
    code: 201
    input: [scene_number, int_ext, planned_duration_minutes, required_actor_role_ids, required_equipment_categories, weather_dependent]
    output: Scene

  - method: GET
    path: "/productions/{pid}/scenes"
    description: "List scenes for production (filter by status)"
    roles: [ExecutiveProducer, LineProducer, FinanceController, CastingDirector, ProductionCoordinator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Scene[]"

  - method: POST
    path: "/productions/{pid}/scenes/{sid}/schedule"
    description: "Schedule a scene to a LocationReservation (BREAKDOWN→SCHEDULED)"
    roles: [LineProducer]
    code: 200
    input: [reservation_id, "version?"]
    output: Scene
    side_effects: ["validate actor call-sheet & cross-project conflicts; reservation HELD→CONFIRMED if not already"]

  - method: POST
    path: "/productions/{pid}/scenes/{sid}/mark-weather-blocked"
    description: "Mark scene as blocked by weather (SCHEDULED→RESCHEDULING)"
    roles: [ProductionCoordinator]
    code: 200
    input: ["version?"]
    output: Scene
    side_effects: ["cascade reservation CONFIRMED→RESCHEDULING"]

  - method: POST
    path: "/productions/{pid}/scenes/{sid}/reschedule"
    description: "Reschedule scene to a new reservation (RESCHEDULING→SCHEDULED)"
    roles: [ProductionCoordinator]
    code: 200
    input: [new_reservation_id, "version?"]
    output: Scene
    side_effects: ["old reservation RESCHEDULING→RELEASED; new reservation HELD→CONFIRMED"]

  - method: POST
    path: "/productions/{pid}/scenes/{sid}/mark-shot"
    description: "Mark scene shot (SCHEDULED→SHOT)"
    roles: [ProductionCoordinator]
    code: 200
    input: ["version?"]
    output: Scene
    side_effects: ["reservation CONFIRMED→FULFILLED"]

  - method: POST
    path: "/productions/{pid}/scenes/{sid}/omit"
    description: "Omit scene"
    roles: [LineProducer]
    code: 200
    input: ["version?"]
    output: Scene

  # --- Roles & Casting ---
  - method: POST
    path: "/productions/{pid}/roles"
    description: "Create casting role"
    roles: [CastingDirector]
    code: 201
    input: [role_name, description, union_tier, day_rate_cents]
    output: Role

  - method: POST
    path: "/productions/{pid}/roles/{rid}/auditions"
    description: "Record audition (auto-transitions Role OPEN→AUDITIONING on first)"
    roles: [CastingDirector]
    code: 201
    input: [actor_id, audition_at, outcome, notes]
    output: Audition

  - method: GET
    path: "/productions/{pid}/roles/{rid}/auditions"
    description: "List auditions"
    roles: [CastingDirector, LineProducer]
    code: 200
    input: ["limit?", "offset?"]
    output: "Audition[]"

  - method: POST
    path: "/productions/{pid}/roles/{rid}/shortlist"
    description: "Shortlist role (AUDITIONING→SHORTLISTED)"
    roles: [CastingDirector]
    code: 200
    input: ["version?"]
    output: Role

  - method: POST
    path: "/productions/{pid}/roles/{rid}/reopen-auditions"
    description: "Reopen auditions (SHORTLISTED→AUDITIONING) — non-linear cycle"
    roles: [CastingDirector]
    code: 200
    input: ["version?"]
    output: Role

  - method: POST
    path: "/productions/{pid}/roles/{rid}/offer"
    description: "Offer role to actor (SHORTLISTED→OFFERED)"
    roles: [CastingDirector]
    code: 200
    input: [actor_id, "version?"]
    output: Role

  - method: POST
    path: "/productions/{pid}/roles/{rid}/sign"
    description: "Sign role contract (OFFERED→SIGNED) — triggers cast_commit_estimate at_sign_time variant"
    roles: [LineProducer]
    code: 200
    input: ["version?"]
    output: Role
    side_effects: ["BudgetCategory(CAST).committed_cents += cast_commit_estimate; emit contract.role.signed; recompute posture"]

  - method: POST
    path: "/productions/{pid}/roles/{rid}/recast"
    description: "Mark role recast (AUDITIONING→RECAST)"
    roles: [CastingDirector]
    code: 200
    input: ["version?"]
    output: Role

  - method: POST
    path: "/productions/{pid}/roles/{rid}/substitute"
    description: "Substitute signed actor (SIGNED→RECAST + spawn replacement Role)"
    roles: [LineProducer]
    code: 200
    input: [replacement_actor_id, replacement_role_name, replacement_day_rate_cents, "version?"]
    output: Role
    side_effects: ["old Role RECAST; new Role created and SIGNED in-line; cast committed_cents adjusted"]

  # --- Actors ---
  - method: POST
    path: "/actors"
    description: "Create actor record"
    roles: [CastingDirector]
    code: 201
    input: [legal_name, agency_contact_email, travel_origin_zone]
    output: Actor

  - method: GET
    path: "/actors/{id}"
    description: "Get actor"
    roles: [CastingDirector, LineProducer]
    code: 200
    input: []
    output: Actor

  # --- Locations & reservations ---
  - method: POST
    path: "/locations"
    description: "Create location"
    roles: [ProductionCoordinator]
    code: 201
    input: [name, zone, requires_permit, max_parallel_units]
    output: Location

  - method: POST
    path: "/location-reservations"
    description: "Create location reservation (HELD)"
    roles: [ProductionCoordinator]
    code: 201
    input: [location_id, production_id, scene_id, unit_label, start_at, end_at]
    output: LocationReservation

  - method: POST
    path: "/location-reservations/{id}/confirm"
    description: "Confirm reservation (HELD→CONFIRMED)"
    roles: [ProductionCoordinator]
    code: 200
    input: ["version?"]
    output: LocationReservation

  - method: POST
    path: "/location-reservations/{id}/release"
    description: "Release reservation (HELD→RELEASED)"
    roles: [ProductionCoordinator]
    code: 200
    input: ["version?"]
    output: LocationReservation

  - method: PATCH
    path: "/location-reservations/{id}/permit-status"
    description: "Set permit status (PENDING→APPROVED/REJECTED/EXPIRED)"
    roles: [ProductionCoordinator]
    code: 200
    input: [permit_status, "version?"]
    output: LocationReservation

  - method: PATCH
    path: "/location-reservations/{id}/weather-status"
    description: "Set weather status (UNKNOWN→ACCEPTABLE/BLOCKED)"
    roles: [ProductionCoordinator]
    code: 200
    input: [weather_status, "version?"]
    output: LocationReservation

  # --- Budget ---
  - method: POST
    path: "/productions/{pid}/budget-categories"
    description: "Create budget category"
    roles: [FinanceController]
    code: 201
    input: [code, planned_cents]
    output: BudgetCategory

  - method: GET
    path: "/productions/{pid}/budget-categories"
    description: "List budget categories with alert state"
    roles: [LineProducer, FinanceController]
    code: 200
    input: []
    output: "BudgetCategory[]"

  - method: POST
    path: "/change-orders"
    description: "Submit change order (PENDING)"
    roles: [LineProducer]
    code: 201
    input: [production_id, category_id, delta_cents, justification, source]
    output: ChangeOrder

  - method: POST
    path: "/change-orders/{id}/approve"
    description: "Approve change order (PENDING→APPROVED) — segregation of duties enforced"
    roles: [FinanceController]
    code: 200
    input: ["version?", "X-Override-Reason?"]
    output: ChangeOrder
    side_effects: ["BudgetCategory.planned_cents adjusted; reserve_fund_cents debited if RESERVE_DRAW; alert_state recomputed; posture recomputed"]

  - method: POST
    path: "/change-orders/{id}/reject"
    description: "Reject change order (PENDING→REJECTED)"
    roles: [FinanceController]
    code: 200
    input: ["version?"]
    output: ChangeOrder

  - method: POST
    path: "/change-orders/{id}/cancel"
    description: "Cancel change order (PENDING→CANCELLED) — only requester"
    roles: [LineProducer]
    code: 200
    input: ["version?"]
    output: ChangeOrder

  # --- Equipment ---
  - method: POST
    path: "/equipment"
    description: "Register equipment item"
    roles: [ProductionCoordinator]
    code: 201
    input: [name, category, acquisition_mode, vendor_id, unit_cost_cents]
    output: Equipment

  - method: GET
    path: "/equipment"
    description: "List equipment (filter by status, category)"
    roles: [ProductionCoordinator, LineProducer, FinanceController]
    code: 200
    input: ["status?", "category?", "limit?", "offset?"]
    output: "Equipment[]"

  - method: POST
    path: "/equipment/{id}/events"
    description: "Record equipment event (CHECK_OUT/CHECK_IN/REPORT_DAMAGE/REPORT_LOSS/RETURN_VERIFIED)"
    roles: [ProductionCoordinator, FinanceController]
    code: 201
    input: [production_id, event_type, occurred_at, damage_charge_cents]
    output: EquipmentEvent
    side_effects: ["state transition on Equipment; budget category committed/actual adjustments"]

  - method: POST
    path: "/equipment/{id}/decommission"
    description: "Decommission equipment (AVAILABLE→DECOMMISSIONED)"
    roles: [FinanceController]
    code: 200
    input: ["version?"]
    output: Equipment

  # --- Crew & Vendor ---
  - method: POST
    path: "/productions/{pid}/crew-assignments"
    description: "Create crew assignment (BOOKED)"
    roles: [LineProducer]
    code: 201
    input: [crew_user_id, role_label, day_rate_cents, scheduled_days]
    output: CrewAssignment

  - method: PATCH
    path: "/productions/{pid}/crew-assignments/{cid}/actual-days"
    description: "Set actual_days (used by payroll calc on settlement)"
    roles: [LineProducer]
    code: 200
    input: [actual_days, "version?"]
    output: CrewAssignment

  - method: POST
    path: "/vendor-invoices"
    description: "Submit vendor invoice"
    roles: [FinanceController]
    code: 201
    input: [production_id, vendor_id, category_code, gross_cents]
    output: VendorInvoice

  - method: POST
    path: "/vendor-invoices/{id}/reconcile"
    description: "Reconcile vendor invoice (SUBMITTED→RECONCILED): apply equipment loss/damage deductions"
    roles: [FinanceController]
    code: 200
    input: ["version?"]
    output: VendorInvoice

  - method: POST
    path: "/vendor-invoices/{id}/pay"
    description: "Pay invoice (RECONCILED→PAID)"
    roles: [FinanceController]
    code: 200
    input: ["version?"]
    output: VendorInvoice
    side_effects: ["emit payment.invoice.paid; Production.spent_cents += net_cents"]

  - method: POST
    path: "/vendor-invoices/{id}/dispute"
    description: "Dispute invoice (SUBMITTED→DISPUTED)"
    roles: [FinanceController]
    code: 200
    input: ["version?"]
    output: VendorInvoice

  # --- Audit log read ---
  - method: GET
    path: "/productions/{pid}/audit-logs"
    description: "List audit log entries (filter by action)"
    roles: [ExecutiveProducer, FinanceController]
    code: 200
    input: ["action?", "limit?", "offset?"]
    output: "AuditLog[]"

  # --- Test-driving endpoints ---
  - method: POST
    path: "/_clock/advance"
    description: "Advance the logical clock (test-only). Pinned now value used by validations and timestamps."
    roles: [ExecutiveProducer]
    code: 200
    input: [to_iso8601]
    output: Clock

  - method: POST
    path: "/_events/emit"
    description: "Emit external event simulator (e.g., weather forecast update, payment system ack); used to drive event-driven side-effects in tests."
    roles: [ExecutiveProducer]
    code: 200
    input: [event_type, payload]
    output: "object"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_AUTH_REQUIRED
    http: 401
    condition: "X-User-ID or X-User-Role header missing/blank"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not authorized for endpoint"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path resource does not exist"
  - id: ERR_VERSION_MISMATCH
    http: 409
    condition: "OCC version on request does not match current"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target entity not in a state that permits the requested transition"
  - id: ERR_POSTURE_BLOCKED
    http: 409
    condition: "Production posture FROZEN/RED gates this operation"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "ChangeOrder approver same as requester"
  - id: ERR_REFERENCE_MISMATCH
    http: 422
    condition: "FK reference resolves but is out of expected scope"
  - id: ERR_INVALID_INTERVAL
    http: 422
    condition: "start_at >= end_at, or out of production shoot window"
  - id: ERR_PERMIT_REQUIRED
    http: 409
    condition: "Confirm reservation while permit_status != APPROVED on permit-required location"
  - id: ERR_LOCATION_OVER_CAPACITY
    http: 409
    condition: "Location parallel-unit cap exceeded by overlapping reservations"
  - id: ERR_WEATHER_BLOCKED
    http: 409
    condition: "Scheduling weather-dependent scene against reservation with weather_status != ACCEPTABLE"
  - id: ERR_AUDITION_NOT_PASSED
    http: 422
    condition: "Offer made to actor with no PASS audition for this role"
  - id: ERR_ACTOR_CALLSHEET_CONFLICT
    http: 409
    condition: "Same-production scene call-sheet conflict (overlap or insufficient travel buffer)"
  - id: ERR_CROSS_PROJECT_CONFLICT
    http: 409
    condition: "Cross-production conflict for signed actor"
  - id: ERR_EQUIPMENT_UNAVAILABLE
    http: 409
    condition: "CHECK_OUT attempted on Equipment whose status != AVAILABLE"
  - id: ERR_INVALID_EVENT_PAYLOAD
    http: 422
    condition: "EquipmentEvent payload (damage_charge_cents) violates event_type constraints"
  - id: ERR_BUDGET_OVERALLOCATED
    http: 422
    condition: "Sum of category planned_cents + reserve_fund_cents would exceed total_budget_cents"
  - id: ERR_RESERVE_INSUFFICIENT
    http: 409
    condition: "RESERVE_DRAW change-order delta exceeds Production.reserve_fund_cents remaining"
  - id: ERR_OPEN_OBLIGATIONS
    http: 409
    condition: "Wrap close attempted while open commitments remain"
  - id: ERR_INVALID_PAGINATION
    http: 422
    condition: "limit/offset out of bounds"
  - id: ERR_VALIDATION
    http: 422
    condition: "Generic request-body shape/type validation failure (missing required fields, wrong types)"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ExecutiveProducer
    description: "Top-level role; authorizes production creation, cancellation, audit log read, and clock/event simulators."
    identity: opaque
    exclusive_operations:
      - "POST /productions"
      - "POST /productions/{id}/cancel"
      - "POST /_clock/advance"
      - "POST /_events/emit"
    shared_operations:
      - "GET /productions, GET /productions/{id}"
      - "GET /productions/{pid}/scenes"
      - "GET /productions/{pid}/audit-logs"

  - name: LineProducer
    description: "Day-to-day producer; manages scenes, baseline lock, casting sign, change-order submission, crew assignments."
    identity: opaque
    exclusive_operations:
      - "POST /productions/{id}/lock-baseline"
      - "POST /productions/{id}/begin-wrap"
      - "POST /productions/{pid}/scenes"
      - "POST /productions/{pid}/scenes/{sid}/schedule"
      - "POST /productions/{pid}/scenes/{sid}/omit"
      - "POST /productions/{pid}/roles/{rid}/sign"
      - "POST /productions/{pid}/roles/{rid}/substitute"
      - "POST /change-orders"
      - "POST /change-orders/{id}/cancel"
      - "POST /productions/{pid}/crew-assignments"
      - "PATCH /productions/{pid}/crew-assignments/{cid}/actual-days"
    shared_operations:
      - "GET /productions, GET /productions/{id}, GET /productions/{id}/wrap-preview"
      - "GET /productions/{pid}/budget-categories"
      - "GET /productions/{pid}/roles/{rid}/auditions"
      - "GET /equipment"
      - "GET /actors/{id}"

  - name: FinanceController
    description: "Owns budget approval, vendor invoices, equipment financial ops, and account closure. Cannot submit change-orders (segregation)."
    identity: opaque
    exclusive_operations:
      - "POST /productions/{id}/close-account"
      - "POST /productions/{pid}/budget-categories"
      - "POST /change-orders/{id}/approve"
      - "POST /change-orders/{id}/reject"
      - "POST /vendor-invoices"
      - "POST /vendor-invoices/{id}/reconcile"
      - "POST /vendor-invoices/{id}/pay"
      - "POST /vendor-invoices/{id}/dispute"
      - "POST /equipment/{id}/decommission"
    shared_operations:
      - "GET /productions, GET /productions/{id}, GET /productions/{id}/wrap-preview"
      - "GET /productions/{pid}/budget-categories"
      - "GET /productions/{pid}/audit-logs"
      - "GET /equipment"
      - "POST /equipment/{id}/events (RETURN_VERIFIED)"

  - name: CastingDirector
    description: "Owns casting workflow: roles, auditions, shortlist/offer/recast/reopen-auditions; creates Actor records."
    identity: opaque
    exclusive_operations:
      - "POST /productions/{pid}/roles"
      - "POST /productions/{pid}/roles/{rid}/auditions"
      - "POST /productions/{pid}/roles/{rid}/shortlist"
      - "POST /productions/{pid}/roles/{rid}/reopen-auditions"
      - "POST /productions/{pid}/roles/{rid}/offer"
      - "POST /productions/{pid}/roles/{rid}/recast"
      - "POST /actors"
    shared_operations:
      - "GET /productions, GET /productions/{id}"
      - "GET /productions/{pid}/scenes"
      - "GET /productions/{pid}/roles/{rid}/auditions"
      - "GET /actors/{id}"

  - name: ProductionCoordinator
    description: "Operational role: locations, reservations, weather/permit updates, scene shoot tracking, equipment events (non-financial)."
    identity: opaque
    exclusive_operations:
      - "POST /locations"
      - "POST /location-reservations"
      - "POST /location-reservations/{id}/confirm"
      - "POST /location-reservations/{id}/release"
      - "PATCH /location-reservations/{id}/permit-status"
      - "PATCH /location-reservations/{id}/weather-status"
      - "POST /productions/{pid}/scenes/{sid}/mark-weather-blocked"
      - "POST /productions/{pid}/scenes/{sid}/reschedule"
      - "POST /productions/{pid}/scenes/{sid}/mark-shot"
      - "POST /equipment"
      - "POST /equipment/{id}/events (CHECK_OUT/CHECK_IN/REPORT_DAMAGE/REPORT_LOSS)"
    shared_operations:
      - "GET /productions, GET /productions/{id}"
      - "GET /productions/{pid}/scenes"
      - "GET /equipment"
