            - "SecurityRiskAssessment.${sra_40_id}.residual_risk_score == 100.00"
            - "SecurityRiskAssessment.${sra_40_id}.risk_tier == CRITICAL"

      - name: topological_derivation_walk_of_six_hops_rejected
        claim_type: topological
        grounds: ["calculations.chd_classification.constants.MAX_INFERENCE_DEPTH", "validations[priority=21]", "errors[ERR_INFERENCE_DEPTH_EXCEEDED]"]
        distinguishing_aspect: "A walk of exactly MAX_INFERENCE_DEPTH = 5 hops is admitted, and the element that would sit at hop 6 is refused with ERR_INFERENCE_DEPTH_EXCEEDED, leaving the chain six rows long."
        test_recipe:
          setup: ["logical clock at 2026-08-01T00:00:00Z", "one AppProduct holding a derivation chain of six elements at inference_depth 0 through 5"]
          setup_api_calls:
            - call: "POST /health-data/app-products"
              payload: { product_name: "SleepSense", company_legal_name: "SleepSense Inc", primary_state_code: "WA", consumer_count: 40000, annual_revenue_cents: 900000000, hipaa_covered_transaction_ratio: 0.10 }
              as: PlatformAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /health-data/data-elements"
