scaffold_corner_design:

  # =========================================================================
  # Entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_service_request_returns_201_with_snapshots
        claim_type: Creation
        grounds:
          - entities.ServiceRequest
          - endpoints
        distinguishing_aspect: "POST /service-requests with all required fields returns 201; status INTAKE; zone_code snapshotted from Customer.home_zone_code (Z3) and fleet_account_id snapshotted (null for retail)."
        test_recipe:
          setup:
            - "Customer C1 in zone Z3, no fleet."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c1@x.com", full_name: "C One", home_zone_code: "Z3" }
              as: PlatformAdmin
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /service-requests"
              payload: { customer_id: "${c1}", vehicle_vin: "1HGCM82633A100001", symptom_text: "won't start", severity: "URGENT" }
              as: Customer
              as_user_id: "${c1}"
              captures: { sr: $.data.id }
          assert:
            - "response code == 201"
            - "ServiceRequest.${sr}.status == INTAKE"
            - "ServiceRequest.${sr}.zone_code == Z3"
            - "ServiceRequest.${sr}.fleet_account_id == null"
            - "ServiceRequest.${sr}.severity == URGENT"

      - name: get_service_request_returns_stored
        claim_type: Retrieval
        grounds:
          - entities.ServiceRequest
          - endpoints
        distinguishing_aspect: "GET /service-requests/{id} returns the stored request with matching id and version 1 right after creation."
        test_recipe:
          setup:
            - "Customer C2 Z1; one fresh INTAKE request."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c2@x.com", full_name: "C Two", home_zone_code: "Z1" }
              as: PlatformAdmin
              captures: { c2: $.data.id }
            - call: "POST /service-requests"
              payload: { customer_id: "${c2}", vehicle_vin: "1HGCM82633A100002", symptom_text: "x" }
              as: Customer
              as_user_id: "${c2}"
              captures: { sr: $.data.id }
          trigger:
            - call: "GET /service-requests/${sr}"
              payload: {}
              as: Customer
              as_user_id: "${c2}"
          assert:
            - "response data id == ${sr}"
            - "ServiceRequest.${sr}.version == 1"
            - "ServiceRequest.${sr}.estimate_total_cents == null"

      - name: list_customer_service_requests_paginated
        claim_type: Listing
        grounds:
          - entities.ServiceRequest
          - endpoints
        distinguishing_aspect: "GET /customers/{id}/service-requests returns a paginated array envelope with total_count and has_more for the owning customer's requests."
        test_recipe:
          setup:
            - "Customer C3 Z1 with 2 requests."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c3@x.com", full_name: "C Three", home_zone_code: "Z1" }
              as: PlatformAdmin
              captures: { c3: $.data.id }
            - call: "POST /service-requests"
              payload: { customer_id: "${c3}", vehicle_vin: "1HGCM82633A100003", symptom_text: "a" }
              as: Customer
              as_user_id: "${c3}"
            - call: "POST /service-requests"
              payload: { customer_id: "${c3}", vehicle_vin: "1HGCM82633A100004", symptom_text: "b" }
              as: Customer
              as_user_id: "${c3}"
          trigger:
            - call: "GET /customers/${c3}/service-requests"
              payload: { limit: 10, offset: 0 }
              as: Customer
              as_user_id: "${c3}"
          assert:
            - "response_type == array"
            - "meta/pagination total_count == 2"
            - "has_more == false"

      - name: get_service_request_not_found
        claim_type: Not Found
        grounds:
          - entities.ServiceRequest
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /service-requests/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Empty DB except one admin-seeded mechanic for header use is not needed; opaque dispatcher reads."
          setup_api_calls: []
          trigger:
            - call: "GET /service-requests/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND, http 404"

      - name: create_service_request_missing_required_field
        claim_type: Required Fields
        grounds:
          - entities.ServiceRequest.fields.vehicle_vin
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /service-requests missing the required vehicle_vin returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "Customer C4 Z1."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c4@x.com", full_name: "C Four", home_zone_code: "Z1" }
              as: PlatformAdmin
              captures: { c4: $.data.id }
          trigger:
            - call: "POST /service-requests"
              payload: { customer_id: "${c4}", symptom_text: "no vin" }
              as: Customer
              as_user_id: "${c4}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST, http 400"

      - name: create_service_request_invalid_vin_length
        claim_type: Type Constraints
        grounds:
          - entities.ServiceRequest.fields.vehicle_vin
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /service-requests with vehicle_vin length != 17 returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "Customer C5 Z1."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c5@x.com", full_name: "C Five", home_zone_code: "Z1" }
              as: PlatformAdmin
              captures: { c5: $.data.id }
          trigger:
            - call: "POST /service-requests"
              payload: { customer_id: "${c5}", vehicle_vin: "SHORTVIN", symptom_text: "bad vin" }
              as: Customer
              as_user_id: "${c5}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST, http 400"

      - name: create_service_request_default_severity_routine
        claim_type: Defaults
        grounds:
          - entities.ServiceRequest.fields.severity
        distinguishing_aspect: "Omitting severity on POST /service-requests applies the default ROUTINE."
        test_recipe:
          setup:
            - "Customer C6 Z1."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c6@x.com", full_name: "C Six", home_zone_code: "Z1" }
              as: PlatformAdmin
              captures: { c6: $.data.id }
          trigger:
            - call: "POST /service-requests"
              payload: { customer_id: "${c6}", vehicle_vin: "1HGCM82633A100006", symptom_text: "x" }
              as: Customer
              as_user_id: "${c6}"
              captures: { sr: $.data.id }
          assert:
            - "ServiceRequest.${sr}.severity == ROUTINE"

      - name: catalog_part_no_version_field_immutable
        claim_type: Immutability
        grounds:
          - entities.CatalogPart
        distinguishing_aspect: "CatalogPart has common_fields:false — its read carries id and created_at but no version field and there is no update endpoint."
        test_recipe:
          setup:
            - "One catalog part."
          setup_api_calls:
            - call: "POST /catalog-parts"
              payload: { sku: "IMM1", name: "Filter", wholesale_cost_cents: 1500 }
              as: PlatformAdmin
              captures: { cp: $.data.id }
          trigger:
            - call: "GET /catalog-parts/${cp}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "response data has no version field"
            - "response data sku == IMM1 and wholesale_cost_cents == 1500"

      - name: part_line_unit_cost_snapshot_is_system
        claim_type: System Fields
        grounds:
          - entities.PartLine.fields.unit_cost_cents
        distinguishing_aspect: "PartLine.unit_cost_cents is system-snapshotted from CatalogPart.wholesale_cost_cents at sourcing; a client-supplied value is ignored (only catalog_part_id and quantity are inputs)."
        test_recipe:
          setup:
            - "Customer C7 Z1; Mechanic K Z1 TIER2 rate 9000; CatalogPart wholesale 4000; SR in IN_PROGRESS ON_SITE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /catalog-parts"
              payload: { sku: "SNP1", name: "Pad", wholesale_cost_cents: 4000 }
              as: PlatformAdmin
              captures: { cp: $.data.id }
            - call: "POST /customers"
              payload: { email: "c7@x.com", full_name: "C Seven", home_zone_code: "Z1" }
              as: PlatformAdmin
              captures: { c7: $.data.id }
            - call: "POST /mechanics"
              payload: { full_name: "K S", zone_code: "Z1", skill_tier: "TIER2", labor_rate_cents_per_hour: 9000 }
              as: PlatformAdmin
              captures: { k: $.data.id }
            - call: "POST /service-requests"
              payload: { customer_id: "${c7}", vehicle_vin: "1HGCM82633A100007", symptom_text: "x" }
              as: Customer
              as_user_id: "${c7}"
              captures: { sr: $.data.id }
            - call: "POST /service-requests/${sr}/quotes"
              payload: { diagnosis_text: "d", estimated_labor_hours: 1.0, estimated_parts_cents: 0, labor_rate_cents_per_hour: 9000, tow_fee_cents: 0 }
              as: Mechanic
              as_user_id: "${k}"
              captures: { q: $.data.id }
            - call: "GET /service-requests/${sr}"
              payload: {}
              as: Dispatcher
              captures: { v1: $.data.version }
            - call: "POST /quotes/${q}/approve"
              payload: { expected_service_request_version: "${v1}" }
              as: Customer
              as_user_id: "${c7}"
            - call: "GET /service-requests/${sr}"
              payload: {}
              as: Dispatcher
              captures: { v2: $.data.version }
            - call: "POST /service-requests/${sr}/dispatch"
              payload: { mechanic_id: "${k}", routing_mode: "ON_SITE", scheduled_start_utc: "2026-04-02T09:00:00Z", scheduled_end_utc: "2026-04-02T10:00:00Z", expected_service_request_version: "${v2}" }
              as: Dispatcher
              captures: { jv: $.data.id }
            - call: "POST /job-visits/${jv}/depart"
              payload: {}
              as: Mechanic
              as_user_id: "${k}"
            - call: "POST /job-visits/${jv}/start-work"
              payload: {}
              as: Mechanic
              as_user_id: "${k}"
          trigger:
            - call: "POST /service-requests/${sr}/part-lines"
              payload: { catalog_part_id: "${cp}", quantity: 1 }
              as: Mechanic
              as_user_id: "${k}"
              captures: { pl: $.data.id }
          assert:
            - "PartLine.${pl}.unit_cost_cents == 4000 (snapshot from catalog)"
            - "PartLine.${pl}.unit_price_cents == 5800"

      - name: create_service_request_unknown_customer_fk_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.ServiceRequest.fields.customer_id
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "POST /service-requests whose customer_id FK does not resolve returns ERR_NOT_FOUND (404) — flat-topology FK integrity."
        test_recipe:
          setup:
            - "No customer with the given id exists."
          setup_api_calls: []
          trigger:
            - call: "POST /service-requests"
              payload: { customer_id: "00000000-0000-4000-8000-000000000abc", vehicle_vin: "1HGCM82633A100008", symptom_text: "x" }
              as: Customer
              as_user_id: "00000000-0000-4000-8000-000000000abc"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND, http 404"

  # =========================================================================
  # State Machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: approve_quote_from_intake_request_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.ServiceRequest.QUOTED_to_APPROVED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Attempting to approve when there is no SENT quote / request is INTAKE is undefined; approve targets a non-existent quote and the request is not QUOTED — covered via approving a REJECTED quote which is no longer SENT."
        test_recipe:
          setup:
            - "Customer C8 Z1; Mechanic K Z1; SR QUOTED then quote REJECTED."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c8@x.com", full_name: "C Eight", home_zone_code: "Z1" }
              as: PlatformAdmin
              captures: { c8: $.data.id }
            - call: "POST /mechanics"
              payload: { full_name: "K8", zone_code: "Z1", skill_tier: "TIER2", labor_rate_cents_per_hour: 9000 }
              as: PlatformAdmin
              captures: { k: $.data.id }
            - call: "POST /service-requests"
              payload: { customer_id: "${c8}", vehicle_vin: "1HGCM82633A100009", symptom_text: "x" }
              as: Customer
              as_user_id: "${c8}"
              captures: { sr: $.data.id }
            - call: "POST /service-requests/${sr}/quotes"
              payload: { diagnosis_text: "d", estimated_labor_hours: 1.0, estimated_parts_cents: 0, labor_rate_cents_per_hour: 9000, tow_fee_cents: 0 }
              as: Mechanic
              as_user_id: "${k}"
              captures: { q: $.data.id }
            - call: "POST /quotes/${q}/reject"
              payload: {}
              as: Customer
              as_user_id: "${c8}"
            - call: "GET /service-requests/${sr}"
              payload: {}
              as: Dispatcher
              captures: { v: $.data.version }
          trigger:
            - call: "POST /quotes/${q}/approve"
              payload: { expected_service_request_version: "${v}" }
              as: Customer
              as_user_id: "${c8}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE, http 409"
            - "Quote.${q}.status == REJECTED"

      - name: dispatch_from_intake_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.ServiceRequest.APPROVED_to_DISPATCHED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "POST /service-requests/{id}/dispatch on an INTAKE (un-approved) request is rejected with ERR_INVALID_STATE because dispatch is only defined from APPROVED."
        test_recipe:
          setup:
            - "Customer C9 Z1; Mechanic K9 Z1 TIER2; SR fresh INTAKE."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c9@x.com", full_name: "C Nine", home_zone_code: "Z1" }
              as: PlatformAdmin
              captures: { c9: $.data.id }
            - call: "POST /mechanics"
              payload: { full_name: "K9", zone_code: "Z1", skill_tier: "TIER2", labor_rate_cents_per_hour: 9000 }
              as: PlatformAdmin
              captures: { k: $.data.id }
            - call: "POST /service-requests"
              payload: { customer_id: "${c9}", vehicle_vin: "1HGCM82633A100010", symptom_text: "x" }
              as: Customer
              as_user_id: "${c9}"
              captures: { sr: $.data.id }
            - call: "GET /service-requests/${sr}"
              payload: {}
              as: Dispatcher
              captures: { v: $.data.version }
          trigger:
            - call: "POST /service-requests/${sr}/dispatch"
              payload: { mechanic_id: "${k}", routing_mode: "ON_SITE", scheduled_start_utc: "2026-04-02T09:00:00Z", scheduled_end_utc: "2026-04-02T10:00:00Z", expected_service_request_version: "${v}" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE, http 409"
            - "ServiceRequest.${sr}.status == INTAKE"

      - name: cancel_completed_request_invalid_state
        claim_type: terminal_lockdown
        grounds:
          - state_machines.ServiceRequest.INTAKE_to_CANCELLED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Cancel is only defined from {INTAKE,QUOTED,APPROVED}; cancelling a COMPLETED (terminal) request is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "A COMPLETED retail ServiceRequest SR exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { email: "c10@x.com", full_name: "C Ten", home_zone_code: "Z1" }
              as: PlatformAdmin
              captures: { c10: $.data.id }
            - call: "POST /mechanics"
              payload: { full_name: "K10", zone_code: "Z1", skill_tier: "TIER2", labor_rate_cents_per_hour: 9000 }
              as: PlatformAdmin
              captures: { k: $.data.id }
            - call: "POST /service-requests"
              payload: { customer_id: "${c10}", vehicle_vin: "1HGCM82633A100011", symptom_text: "x" }
              as: Customer
              as_user_id: "${c10}"
              captures: { sr: $.data.id }
            - call: "POST /service-requests/${sr}/quotes"
              payload: { diagnosis_text: "d", estimated_labor_hours: 1.0, estimated_parts_cents: 0, labor_rate_cents_per_hour: 9000, tow_fee_cents: 0 }
              as: Mechanic
              as_user_id: "${k}"
              captures: { q: $.data.id }
            - call: "GET /service-requests/${sr}"
              payload: {}
              as: Dispatcher
              captures: { v1: $.data.version }
            - call: "POST /quotes/${q}/approve"
              payload: { expected_service_request_version: "${v1}" }
              as: Customer
              as_user_id: "${c10}"
            - call: "GET /service-requests/${sr}"
              payload: {}
              as: Dispatcher
              captures: { v2: $.data.version }
            - call: "POST /service-requests/${sr}/dispatch"
              payload: { mechanic_id: "${k}", routing_mode: "ON_SITE", scheduled_start_utc: "2026-04-02T09:00:00Z", scheduled_end_utc: "2026-04-02T10:00:00Z", expected_service_request_version: "${v2}" }
              as: Dispatcher
              captures: { jv: $.data.id }
            - call: "POST /job-visits/${jv}/depart"
              payload: {}
              as: Mechanic
              as_user_id: "${k}"
            - call: "POST /job-visits/${jv}/start-work"
              payload: {}
              as: Mechanic
              as_user_id: "${k}"
            - call: "POST /job-visits/${jv}/finish"
              payload: { logged_labor_hours: 1.0, payment_method: "CARD" }
              as: Mechanic
              as_user_id: "${k}"
          trigger:
            - call: "POST /service-requests/${sr}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${c10}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE, http 409"
            - "ServiceRequest.${sr}.status == COMPLETED"

      - name: cancel_quoted_request_supersedes_sent_quote
        claim_type: side_effect_execution
        grounds:
          - state_machines.ServiceRequest.INTAKE_to_CANCELLED
          - entities.Quote.fields.status
        distinguishing_aspect: "Cancel from QUOTED supersedes the outstanding SENT quote (Quote -> SUPERSEDED) and moves request -> CANCELLED."
        test_recipe:
          setup:
            - "Customer C11 Z1; Mechanic K11 Z1; SR QUOTED with quote SENT."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c11@x.com", full_name: "C Eleven", home_zone_code: "Z1" }
              as: PlatformAdmin
              captures: { c11: $.data.id }
            - call: "POST /mechanics"
              payload: { full_name: "K11", zone_code: "Z1", skill_tier: "TIER2", labor_rate_cents_per_hour: 9000 }
              as: PlatformAdmin
              captures: { k: $.data.id }
            - call: "POST /service-requests"
              payload: { customer_id: "${c11}", vehicle_vin: "1HGCM82633A100012", symptom_text: "x" }
              as: Customer
              as_user_id: "${c11}"
              captures: { sr: $.data.id }
            - call: "POST /service-requests/${sr}/quotes"
              payload: { diagnosis_text: "d", estimated_labor_hours: 1.0, estimated_parts_cents: 0, labor_rate_cents_per_hour: 9000, tow_fee_cents: 0 }
              as: Mechanic
              as_user_id: "${k}"
              captures: { q: $.data.id }
          trigger:
            - call: "POST /service-requests/${sr}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${c11}"
          assert:
            - "ServiceRequest.${sr}.status == CANCELLED"
            - "Quote.${q}.status == SUPERSEDED"

      - name: tow_branch_start_work_reaches_at_shop
        claim_type: branch_path
        grounds:
          - state_machines.JobVisit.EN_ROUTE_to_AT_SHOP
        distinguishing_aspect: "TOW_TO_SHOP branch: start-work moves a TOW visit EN_ROUTE -> AT_SHOP (not ON_SITE_WORKING), and drives the request DISPATCHED -> IN_PROGRESS; requires a TIER3 mechanic."
        test_recipe:
          setup:
            - "Customer C12 Z1; Mechanic K12 Z1 TIER3 rate 12000; SR approved & dispatched TOW_TO_SHOP; visit EN_ROUTE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { email: "c12@x.com", full_name: "C Twelve", home_zone_code: "Z1" }
              as: PlatformAdmin
              captures: { c12: $.data.id }
            - call: "POST /mechanics"
              payload: { full_name: "K12", zone_code: "Z1", skill_tier: "TIER3", labor_rate_cents_per_hour: 12000 }
              as: PlatformAdmin
              captures: { k: $.data.id }
            - call: "POST /service-requests"
              payload: { customer_id: "${c12}", vehicle_vin: "1HGCM82633A100013", symptom_text: "tow" }
              as: Customer
              as_user_id: "${c12}"
              captures: { sr: $.data.id }
            - call: "POST /service-requests/${sr}/quotes"
              payload: { diagnosis_text: "d", estimated_labor_hours: 1.0, estimated_parts_cents: 0, labor_rate_cents_per_hour: 12000, tow_fee_cents: 15000 }
              as: Mechanic
              as_user_id: "${k}"
              captures: { q: $.data.id }
            - call: "GET /service-requests/${sr}"
              payload: {}
              as: Dispatcher
              captures: { v1: $.data.version }
            - call: "POST /quotes/${q}/approve"
              payload: { expected_service_request_version: "${v1}" }
              as: Customer
              as_user_id: "${c12}"
            - call: "GET /service-requests/${sr}"
              payload: {}
              as: Dispatcher
              captures: { v2: $.data.version }
            - call: "POST /service-requests/${sr}/dispatch"
              payload: { mechanic_id: "${k}", routing_mode: "TOW_TO_SHOP", scheduled_start_utc: "2026-04-02T09:00:00Z", scheduled_end_utc: "2026-04-02T12:00:00Z", expected_service_request_version: "${v2}" }
              as: Dispatcher
              captures: { jv: $.data.id }
            - call: "POST /job-visits/${jv}/depart"
              payload: {}
              as: Mechanic
              as_user_id: "${k}"
          trigger:
            - call: "POST /job-visits/${jv}/start-work"
              payload: {}
              as: Mechanic
              as_user_id: "${k}"
          assert:
            - "JobVisit.${jv}.visit_status == AT_SHOP"
            - "ServiceRequest.${sr}.status == IN_PROGRESS"

      - name: error_addons_unresolved_excluded
        claim_type: invalid_transition
        grounds:
          - errors[ERR_ADDONS_UNRESOLVED]
        excluded_because:
          difficulty_instance: boundary_precision_check / finish_with_unresolved_findings_empty_set_edge
          rationale: "The finish-with-PROPOSED-findings rejection is the asserted failure of the named §1.8 boundary instance."

      - name: stale_version_dispatch_excluded
        claim_type: invalid_transition
        grounds:
          - concurrency_rules[dispatch-stale-request]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / onsite_dispatch_half_open_overlap_rejected
