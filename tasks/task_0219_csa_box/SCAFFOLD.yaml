    input: []
    output: WorkShareShift
    side_effects: ["status SCHEDULED→NO_SHOW"]

  # ---- LedgerEntry ----
  - method: GET
    path: "/subscriptions/{id}/ledger-entries"
    description: "List a subscription's ledger entries (append-only)."
    roles: [FarmManager, DeliveryCoordinator, Member, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "entry_type?"]
    output: LedgerEntry[]
    side_effects: []
  - method: POST
    path: "/subscriptions/{id}/payments"
    description: "Apply a member payment to the subscription (posts a PAYMENT ledger entry)."
    roles: [Member, FarmManager]
    code: 201
    input: ["amount_cents", "memo?"]
    output: LedgerEntry
    side_effects: ["post PAYMENT (negative amount); recompute outstanding_balance_cents"]

  # ---- Test-driving (clock) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the simulated current UTC time (drives temporal windows and clock-based system transitions)."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects:
      - "advance system clock; fire clock-based transitions: HELD boxes past delivery date →SKIPPED (holds →CONSUMED), OFFERED waitlist entries past offer_expires_at →EXPIRED"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or malformed auth headers on a protected endpoint."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Acting role is not permitted for this operation."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "Member acts on a Subscription/Hold/Waitlist/Box they do not own."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A path or FK-referenced resource does not exist."
  - id: ERR_SEASON_MISMATCH
    http: 409
    condition: "A referenced ShareType/PickupSite/AddOn belongs to a different Season than the subscription/waitlist."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Transition is not defined from the resource's current state."
  - id: ERR_SIGNUP_CLOSED
    http: 409
    condition: "Confirm attempted after Season.signup_close_date."
  - id: ERR_HOLD_WINDOW_PASSED
    http: 409
    condition: "Placing or releasing a hold at/after the held box's delivery date."
  - id: ERR_INVALID_SWAP_TARGET
    http: 422
    condition: "swap_target_box_id not in same subscription, not later than held week, or not SCHEDULED."
  - id: ERR_OFFER_EXPIRED
    http: 409
    condition: "Accepting an OFFERED waitlist entry after offer_expires_at."
  - id: ERR_ADDON_SUPPLY_EXHAUSTED
    http: 409
    condition: "Attaching an add-on whose committed_count has reached weekly_supply_cap."
  - id: ERR_NOT_WORKING_SHARE
    http: 409
    condition: "Work-share operation on a subscription with working_share_opt_in == false."
  - id: ERR_SITE_CAPACITY_FULL
    http: 409
    condition: "Confirm/promotion would exceed a PickupSite.weekly_capacity."
  - id: ERR_SEASON_CAPACITY_FULL
    http: 409
    condition: "Confirm would exceed Season.total_share_capacity."
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "Missing required field, bad enum, or out-of-range numeric."
  - id: ERR_DUPLICATE_EMAIL
    http: 409
    condition: "Member email already registered (case-insensitive)."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not match the parent's current version."
  - id: ERR_VALIDATION_PAGINATION
    http: 422
    condition: "limit/offset out of allowed bounds (limit 1..100, offset >= 0)."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: FarmManager
    description: "Configures the season (share types, add-ons), confirms subscriptions, and runs weekly fulfillment (pack/deliver, work-share completion)."
    identity: opaque
    exclusive_operations:
      - "POST /seasons, /seasons/{id}/open, /seasons/{id}/close"
      - "POST /share-types, /add-ons"
      - "POST /subscriptions/{id}/confirm"
      - "POST /weekly-boxes/{id}/pack, /weekly-boxes/{id}/deliver"
      - "POST /work-share-shifts/{id}/complete, /work-share-shifts/{id}/mark-no-show"
    shared_operations:
      - "POST /subscriptions/{id}/work-share-shifts (with Member)"
      - "POST /subscriptions/{id}/payments (with Member)"
      - "all GET reads"

  - name: DeliveryCoordinator
    description: "Owns pickup sites / delivery zones and runs waitlist promotion."
    identity: opaque
    exclusive_operations:
      - "POST /pickup-sites"
      - "POST /seasons/{id}/promote-waitlist"
    shared_operations:
      - "all GET reads"

  - name: Member
    description: "A subscribing household; owns its subscriptions, holds, add-ons, and waitlist entries."
    identity: entity_backed:Member
    exclusive_operations:
      - "POST /subscriptions"
      - "POST /subscriptions/{id}/cancel"
      - "POST /subscription-add-ons, DELETE /subscription-add-ons/{id}"
      - "POST /vacation-holds, /vacation-holds/{id}/release"
      - "POST /waitlist-entries/{id}/accept, /waitlist-entries/{id}/decline"
    shared_operations:
      - "POST /subscriptions/{id}/work-share-shifts (with FarmManager)"
      - "POST /subscriptions/{id}/payments (with FarmManager)"
      - "GET reads of own resources"

  - name: PlatformAdmin
    description: "Operational role: advances the simulated clock and reads anything for support."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "all GET reads"

  - name: Anonymous
    description: "Unauthenticated public surface for member registration and joining a waitlist."
    identity: opaque
    exclusive_operations:
      - "POST /members"
      - "POST /waitlist-entries"
    shared_operations: []
