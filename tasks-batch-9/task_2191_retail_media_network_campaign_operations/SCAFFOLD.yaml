  - method: GET
    path: "/rmn/campaigns"
    description: "Lists campaigns, filterable by advertiser, funding plan and either parallel status dimension."
    roles: [NetworkAdmin, AccountManager, MeasurementAnalyst, BillingOps, AdvertiserUser]
    code: 200
    input: ["advertiser_id?", "budget_plan_id?", "delivery_status?", "billing_status?", "channel_mix?", "limit?", "offset?"]
    output: Campaign[]
    side_effects: []
  - method: GET
    path: "/rmn/campaigns/{id}"
    description: "Reads one campaign including both parallel status dimensions and its closed-loop measurement fields."
    roles: [NetworkAdmin, AccountManager, MeasurementAnalyst, BillingOps, AdvertiserUser]
    code: 200
    input: []
    output: Campaign
    side_effects: []
  - method: PATCH
    path: "/rmn/campaigns/{id}"
    description: "Amends a DRAFT or PENDING_REVIEW campaign's flight, pacing, cap or attribution settings."
    roles: [NetworkAdmin, AccountManager, AdvertiserUser]
    code: 200
    input: ["name?", "flight_start_at?", "flight_end_at?", "allocated_budget_cents?", "pacing_mode?", "daily_cap_cents?", "attribution_model?", "attribution_window_days?", "channel_mix?"]
    output: Campaign
    side_effects: ["increments Campaign.version by 1"]
  - method: POST
    path: "/rmn/campaigns/{id}/submit-for-review"
    description: "Submits a DRAFT campaign for network review, checking plan headroom, channel-mix completeness and window containment."
    roles: [NetworkAdmin, AccountManager, AdvertiserUser]
    code: 200
    input: ["submission_note?"]
    output: Campaign
    side_effects: ["sets delivery_status=PENDING_REVIEW", "sets submitted_for_review_by_user_id to the acting X-User-ID", "increments Campaign.version by 1"]
  - method: POST
    path: "/rmn/campaigns/{id}/review-decision"
    description: "Branching review fork from PENDING_REVIEW: APPROVE -> SCHEDULED with the budget reserved, REJECT -> REJECTED with nothing reserved."
    roles: [NetworkAdmin, AccountManager]
    code: 200
    input: ["decision", "decision_note?"]
    output: Campaign
    side_effects: ["APPROVE sets delivery_status=SCHEDULED and moves allocated_budget_cents from BudgetPlan.available_cents into BudgetPlan.reserved_cents", "REJECT sets delivery_status=REJECTED, reserves nothing and terminates every DRAFT, PENDING_ELIGIBILITY or ELIGIBLE LineItem", "sets review_decided_by_user_id to the acting X-User-ID (must differ from submitted_for_review_by_user_id)", "increments Campaign.version by 1"]
  - method: POST
    path: "/rmn/campaigns/{id}/activate"
    description: "Starts delivery on a SCHEDULED campaign once the logical clock has reached flight_start_at."
    roles: [NetworkAdmin, AccountManager, AdvertiserUser]
    code: 200
    input: []
    output: Campaign
    side_effects: ["sets delivery_status=DELIVERING and billing_status=ACCRUING", "promotes BudgetPlan APPROVED -> ACTIVE when needed", "runs campaign_pacing_allowance to seed pacing_index", "increments Campaign.version by 1"]
  - method: POST
    path: "/rmn/campaigns/{id}/pause"
    description: "Pauses a DELIVERING campaign, cascading the pause to every serving line item."
    roles: [NetworkAdmin, AccountManager, AdvertiserUser]
    code: 200
    input: ["pause_reason"]
    output: Campaign
    side_effects: ["sets delivery_status=PAUSED", "L1: every SERVING LineItem -> MANUAL_PAUSED with the given pause_reason", "L2: each paused line item releases reserved_cents to BudgetPlan.available_cents and decrements PlacementSlot.occupancy_count", "increments Campaign.version by 1"]
  - method: POST
    path: "/rmn/campaigns/{id}/resume"
    description: "Returns a PAUSED campaign to DELIVERING when the plan is ACTIVE, the advertiser is ACTIVE and headroom remains."
    roles: [NetworkAdmin, AccountManager, AdvertiserUser]
    code: 200
    input: []
    output: Campaign
    side_effects: ["sets delivery_status=DELIVERING", "line items stay paused until individually resumed", "increments Campaign.version by 1"]
  - method: POST
    path: "/rmn/campaigns/{id}/complete"
    description: "Completes a DELIVERING or PAUSED campaign whose flight has elapsed and hands it to billing."
    roles: [NetworkAdmin, AccountManager, BillingOps]
    code: 200
    input: []
    output: Campaign
    side_effects: ["sets delivery_status=COMPLETED and billing_status=PENDING_INVOICE", "ends every non-ENDED LineItem, releasing its reservation and slot occupancy", "returns unconsumed reserved_cents to BudgetPlan.available_cents", "increments Campaign.version by 1"]
  - method: POST
    path: "/rmn/campaigns/{id}/archive"
    description: "Archives a SCHEDULED, REJECTED or COMPLETED campaign; archiving a SCHEDULED campaign is the compensating release of its untouched reservation."
    roles: [NetworkAdmin, AccountManager]
    code: 200
    input: ["archive_reason?"]
    output: Campaign
    side_effects: ["sets delivery_status=ARCHIVED", "a SCHEDULED campaign returns its full allocated_budget_cents from BudgetPlan.reserved_cents to BudgetPlan.available_cents and reverts billing_status to UNBILLED", "increments Campaign.version by 1"]
  - method: POST
    path: "/rmn/campaigns/{id}/offsite-reconciliation"
    description: "Loads the partner-reported off-site spend for the campaign and runs offsite_spend_reconciliation to pick the billable basis."
    roles: [NetworkAdmin, BillingOps, MeasurementAnalyst]
    code: 200
    input: ["offsite_reported_spend_cents", "reporting_partner_code"]
    output: Campaign
    side_effects: ["sets offsite_reported_spend_cents and offsite_variance_pct", "records the selected reconciliation basis for invoice_settlement_waterfall", "increments Campaign.version by 1"]
  - method: GET
    path: "/rmn/campaigns/{id}/performance-summary"
    description: "Computed read returning delivered spend, attributed revenue, incremental revenue, roas, iroas and pacing_index for the campaign."
    roles: [NetworkAdmin, AccountManager, MeasurementAnalyst, BillingOps, AdvertiserUser]
    code: 200
    input: []
    output: Campaign
    side_effects: []
