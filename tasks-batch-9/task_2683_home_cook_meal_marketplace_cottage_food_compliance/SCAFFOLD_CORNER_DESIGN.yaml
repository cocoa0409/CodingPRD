          assert:
            - "${x_label} == COMPLIANT and ${y_label} == MISSING_FIELDS: label_compliance_status is computed at creation from the state's label_required_fields, independently of the allergen rule"
            - "all three items reached UNDER_REVIEW: neither rule is enforced at POST /menu-items or at submit"
            - "${e_allergen} == ERR_ALLERGEN_DISCLOSURE_MISSING with HTTP 422 (empty allergens and allergen_free_attested false)"
            - "${e_label} == ERR_LABEL_FIELDS_INCOMPLETE with HTTP 422 (net_weight missing from label_fields)"
            - "${e_both} == ERR_ALLERGEN_DISCLOSURE_MISSING, NOT ERR_LABEL_FIELDS_INCOMPLETE: priority 25 beats priority 30"
            - "${x_status} == REVISION_REQUESTED and ${x_round} == 1: a rejected approval leaves the item reviewable, and the reviewer's own REVISION_REQUEST decision is the way out"
            - "no item has approved_by_user_id set after the three failed approvals"

      - name: refund_creation_payment_state_and_amount_violations_rejected
        claim_type: violation_to_error
