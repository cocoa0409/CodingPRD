                inv_total: "$.data[0].total_cents"
          assert:
            - "inv_feed == 2000 and inv_health == 5000 (steps (1) and (3) of the pinned order)"
            - "inv_hd == 19 and inv_yard == 855 (step (2): 10 head on 08-01 + 9 head on 08-02, death on 08-02 reduces from that date forward)"
            - "inv_death == 140745 (step (4): 140000 in-cost/head + 745 pre-loss accrual/head; final-cost evaluation would wrongly give 140786)"
            - "inv_credit == 140745 (step (5): recovery netted LAST, after the death charge is fixed)"
            - "inv_total == 7855"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: lot_market_fail_sale_cycle
        grounds:
          - state_machines.Lot.OPEN_to_MARKETED
          - state_machines.Lot.MARKETED_to_OPEN
        distinguishing_aspect: |
          Lot executes the cycle OPEN -> MARKETED -> OPEN -> MARKETED (a sale
          falls through and the lot is re-marketed) with no drift in head
          counts or cost accumulators; a cyclic shape on the Lot entity,
          distinct from the InsuranceClaim appeal loop.
        test_recipe:
          setup:
            - "Lot L-601: 5 steers, 3500 lbs in, purchase 700000c, arrival 2026-08-01"
          setup_api_calls:
            - call: "POST /feedlot/owners"
              payload: { owner_name: "O-600", billing_email: "o600@x.com" }
              as: FeedyardManager
              captures: { o_id: $.data.id }
            - call: "POST /feedlot/lots"
              payload: { owner_id: "${o_id}", lot_number: "L-601", sex_class: "STEER", head_count_in: 5, in_weight_total_lbs: 3500, purchase_cost_cents: 700000, arrival_date: "2026-08-01" }
              as: FeedyardManager
              captures: { l_id: $.data.id }
          trigger:
            - call: "POST /feedlot/lots/${l_id}/market"
              as: FeedyardManager
              captures: { s1: $.data.status }
            - call: "POST /feedlot/lots/${l_id}/fail-sale"
              as: FeedyardManager
              captures: { s2: $.data.status }
            - call: "POST /feedlot/lots/${l_id}/market"
              as: FeedyardManager
              captures: { s3: $.data.status }
            - call: "GET /feedlot/lots/${l_id}"
              as: Any
              captures: { hc: $.data.head_count_current }
          assert:
            - "s1 == MARKETED"
            - "s2 == OPEN (cycle back: sale fell through)"
            - "s3 == MARKETED (lot can be marketed again after the loop)"
            - "hc == 5 (the cycle has no side effects on head counts)"

      - name: insurance_claim_appeal_cycle
        grounds:
          - state_machines.InsuranceClaim.UNDER_REVIEW_to_DENIED
          - state_machines.InsuranceClaim.DENIED_to_UNDER_REVIEW
        distinguishing_aspect: |
          InsuranceClaim executes the cycle UNDER_REVIEW -> DENIED ->
          UNDER_REVIEW -> APPROVED -> PAID (appeal loop on a different entity
          than the Lot marketing cycle); appeal_count increments exactly once
          and the recovery credit is only created at PAID.
        test_recipe:
          setup:
            - "Lot L-602: 5 steers, 3500 lbs, purchase 700000c, arrival 2026-08-01; death loss on 2026-08-02 of 1 insured head (loss value 140000c = 700000/5, zero accrued costs); claim for 100000c"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: FeedyardManager
            - call: "POST /feedlot/owners"
              payload: { owner_name: "O-602", billing_email: "o602@x.com" }
              as: FeedyardManager
              captures: { o_id: $.data.id }
            - call: "POST /feedlot/lots"
              payload: { owner_id: "${o_id}", lot_number: "L-602", sex_class: "STEER", head_count_in: 5, in_weight_total_lbs: 3500, purchase_cost_cents: 700000, arrival_date: "2026-08-01" }
              as: FeedyardManager
              captures: { l_id: $.data.id }
            - call: "POST /feedlot/death-losses"
              payload: { lot_id: "${l_id}", loss_date: "2026-08-02", head_count: 1, cause: "RESPIRATORY", insured: true }
              as: CattleHealthTech
              captures: { d_id: $.data.id }
            - call: "POST /feedlot/insurance-claims"
              payload: { death_loss_id: "${d_id}", claimed_amount_cents: 100000 }
              as: CattleHealthTech
              captures: { c_id: $.data.id, s0: $.data.status }
          trigger:
            - call: "POST /feedlot/insurance-claims/${c_id}/decide"
              payload: { decision: "DENY" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
              captures: { s1: $.data.status }
            - call: "POST /feedlot/insurance-claims/${c_id}/appeal"
              as: ClaimsAdjuster
              as_user_id: "adj-1"
              captures: { s2: $.data.status, ac: $.data.appeal_count }
            - call: "POST /feedlot/insurance-claims/${c_id}/decide"
              payload: { decision: "APPROVE", approved_amount_cents: 90000 }
              as: ClaimsAdjuster
              as_user_id: "adj-2"
              captures: { s3: $.data.status, appr: $.data.approved_amount_cents }
            - call: "POST /feedlot/insurance-claims/${c_id}/pay"
              as: ClaimsTreasurer
              as_user_id: "tre-1"
              captures: { s4: $.data.status }
            - call: "GET /feedlot/lots/${l_id}"
              as: Any
              captures: { pend: $.data.insurance_credit_pending_cents }
          assert:
            - "s0 == UNDER_REVIEW (initial state at filing)"
            - "s1 == DENIED"
            - "s2 == UNDER_REVIEW and ac == 1 (appeal loop re-enters review exactly once)"
            - "s3 == APPROVED and appr == 90000 (approved amount may be below claimed)"
            - "s4 == PAID"
            - "pend == 90000 (recovery parked on the lot until an invoice exists)"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: death_loss_cascade_lot_assignment_pen
        grounds:
          - endpoints[POST /feedlot/death-losses]
          - entities.DeathLoss.fields.allocations
        distinguishing_aspect: |
          Depth-3 cascade from the death-loss trigger (different trigger than
          closeout_confirm_cascade): death loss -> Lot counters/costs (link 1)
          -> the lot's PenAssignment head_count waterfall-reduced oldest-first
          (link 2, mutation of the assignment caused by link 1) -> Pen
          occupancy recompute and OCCUPIED -> EMPTY flip (link 3, caused by
          link 2).
        test_recipe:
          setup:
            - "Lot L-701: 10 steers, 7000 lbs, purchase 1400000c, arrival 2026-08-01; split across pen D-01 (6 head, assignment created first) and pen D-02 (4 head, created second); one health event 2026-08-01 cost 5000c withdrawal 0"
            - "Clock 2026-08-02"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
