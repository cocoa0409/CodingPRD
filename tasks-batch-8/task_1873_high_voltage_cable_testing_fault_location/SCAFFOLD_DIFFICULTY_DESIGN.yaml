            - { call: "POST /cable-diagnostics/outage-windows/${w}/activate", as: NetworkPlanner }
            - { call: "POST /cable-diagnostics/test-jobs/${j}/start", as: TestSupervisor }
          trigger:
            - { call: "POST /cable-diagnostics/test-jobs/${j}/suspend", as: TestSupervisor }
            - { call: "POST /cable-diagnostics/test-jobs/${j}/resume", as: TestSupervisor }
            - { call: "POST /cable-diagnostics/test-jobs/${j}/suspend", as: TestSupervisor }
            - { call: "POST /cable-diagnostics/test-jobs/${j}/resume", as: TestSupervisor, captures: { st: "$.data.status", ver: "$.data.version" } }
          assert:
            - "TestJob.${j}.status == IN_PROGRESS after two full suspend/resume loops"
            - "TestJob.${j}.version == 7 (create=1, plan=2, start=3, suspend=4, resume=5, suspend=6, resume=7)"

  # ------------------------------------------------------------------ Rule 4
  - rule_id: transitive_cascade
    instances:
      - name: splice_accept_cascade_closes_fault_and_advances_job
        grounds:
          - state_machines.RepairSplice.COMPLETED_to_ACCEPTED
          - state_machines.FaultRecord.RETESTING_to_CLOSED_VERIFIED
          - state_machines.TestJob.IN_PROGRESS_to_EVALUATION
          - state_machines.CableCircuit.UNDER_TEST_to_TEST_COMPLETE
        distinguishing_aspect: |
          Depth-3 cascade from POST repair-splices/{id}/accept: splice ACCEPTED ->
          fault RETESTING->CLOSED_VERIFIED (closed_at set, circuit unresolved -1,
          resolved_24m +1, splice_count +1) -> circuit counter mutation satisfies the job
          gate -> job IN_PROGRESS->EVALUATION -> circuit UNDER_TEST->TEST_COMPLETE.
          Each hop is caused by the previous hop, not by the original request.
        test_recipe:
          setup:
            - "Circuit C (KV_15, length 1000); job budget 800000; FAIL series evaluated and ACCEPTED (customer acknowledges failed diagnostic); fault pinpointed; excavation IN_PROGRESS; splice COMPLETED at 2026-08-11T10:00Z; passing retest series ACCEPTED (fault RETESTING). Job still IN_PROGRESS."
          setup_api_calls:
            - { call: "POST /cable-diagnostics/circuits", payload: { circuit_ref: "CKT-TC1", voltage_class: "KV_15", length_m: 1000, installation_year: 2015 }, as: SystemAdmin, captures: { c: "$.data.id" } }
            - { call: "POST /cable-diagnostics/outage-windows", payload: { circuit_id: "${c}", kind: "PLANNED_DIAGNOSTIC", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-12T12:00:00Z" }, as: NetworkPlanner, captures: { w: "$.data.id" } }
            - { call: "POST /cable-diagnostics/outage-windows/${w}/approve", as: NetworkPlanner }
            - { call: "POST /cable-diagnostics/test-jobs", payload: { circuit_id: "${c}", outage_window_id: "${w}", requested_methods: ["VLF_TAN_DELTA"], approved_budget_cents: 800000 }, as: NetworkPlanner, captures: { j: "$.data.id" } }
            - { call: "POST /cable-diagnostics/test-jobs/${j}/plan", as: NetworkPlanner }
