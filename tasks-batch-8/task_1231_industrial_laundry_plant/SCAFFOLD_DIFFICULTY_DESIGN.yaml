  # ===========================================================================
  # Rule 4 — transitive_cascade (two instances, different triggers)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: discrepancy_approve_to_customer_balance_chain
        grounds:
          - state_machines.Discrepancy.APPROVED_to_CREDITED
          - calculations.invoice_total
          - entities.Customer.fields.account_balance_cents
        distinguishing_aspect: |
          Depth-3 chain triggered by POST .../discrepancies/{id}/apply-credit:
          (1) Discrepancy → CREDITED and Invoice.credits_cents += credit_cents;
          (2) the Invoice mutation recomputes Invoice.total_due_cents;
          (3) the credit application mutates Customer.account_balance_cents
          (-= credit_cents) and bumps Customer.version. Each hop is caused by
          the previous hop — each mutation is caused by the preceding mutation, not fan-out from the original trigger.
        test_recipe:
          setup:
            - "Plant P; category TOWEL replacement_cost_cents=500; RENTAL customer C, chip off, credit_limit 1000000"
            - "Stop picked up, delivery manifested 10 promised, delivered 8 → shortfall 2"
            - "CustomerContact files dispute claiming 2; CSR starts review, approves 2 → credit_cents = round(2*500*0.60) = 600"
            - "DRAFT invoice I generated for C (rental linen charges 0 because no par rows → total 0 before credit)"
          setup_api_calls:
            - call: "POST /plants"
              payload: { name: "P", reject_rate_alert_pct: 25.0, par_shortage_alert_pieces: 5, utility_baseline_kwh_per_lb: 1.0, utility_baseline_gal_per_lb: 2.0 }
              as: PlantAdmin
