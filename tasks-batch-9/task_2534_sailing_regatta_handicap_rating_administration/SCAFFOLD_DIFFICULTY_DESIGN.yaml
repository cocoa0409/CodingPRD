  - rule_id: non_linear_state_machine
    instances:

      - name: race_general_recall_cycle_reaches_black_flag_then_ocs
        grounds:
          - state_machines.Race.start_status.SEQUENCE_STARTED_to_GENERAL_RECALLED
          - state_machines.Race.start_status.GENERAL_RECALLED_to_SEQUENCE_STARTED
          - state_machines.Race.scoring_status.NOT_SCORED_to_PROVISIONAL
          - entities.Race.fields.general_recall_count
          - entities.Race.fields.black_flag_active
          - entities.RecallEvent.fields.black_flag_applied
        distinguishing_aspect: |
          The Race start dimension is genuinely cyclic and the loop is not idempotent: the race walks
          PENDING -> SEQUENCE_STARTED -> GENERAL_RECALLED -> SEQUENCE_STARTED -> GENERAL_RECALLED ->
          SEQUENCE_STARTED -> STARTED, returning twice to a state it already occupied, yet
          general_recall_count climbs 0 -> 1 -> 2 and never resets, so the second lap through
          SEQUENCE_STARTED runs under black_flag_active true while the first did not. The observable
          proof is that an INDIVIDUAL recall on the first lap would mint nothing, while the one signalled
          after the valid start mints a non-discardable OCS result and pushes scoring_status to
          PROVISIONAL - a different outcome from the same trigger in the same state label.
        test_recipe:
          setup:
            - "Ten club members and three ISSUED TOD_PHRF certificates: A 171.3, B 218.8, D 200.9."
            - "A LOW_POINT / NONE-discard regatta racing on 2026-08-05, division A CONFIRMED with the three entries ACCEPTED, a SEATED jury panel, status RACING, three CONFIRMED whole-regatta duties."
            - "Race 1 exists at 14:00 over 6.0 nm with start_status PENDING, general_recall_count 0 and black_flag_active false."
            - "The logical clock sits at 2026-08-05T13:50:00Z."
