scenario: "2001. Industrial Byproduct & Beneficial-Reuse Brokerage (industrial byproduct broker): byproduct characterization & regulatory reuse eligibility, generator supply agreement & offtake commitment, transport logistics & freight cost sharing, market price index & revenue-share, quality specification & rejection at destination, storage & seasonality buffering, permit/notification by state, sustainability credit reporting"
domain_name: industrial-byproduct-brokerage
api_prefix: /api

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Generator
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Legal name of the generating company" }
      - { name: hq_state_code, type: string, source: input, description: "2-letter US state code of headquarters" }
      - { name: contact_email, type: string, source: input, description: "Primary contact email" }
      - { name: total_credits, type: number, source: computed, default: 0.0, description: "Sum of ACCRUAL credits minus sum of REVERSAL credits over SustainabilityCreditEntry where generator_id = this id; 2 decimal places" }
      - { name: credit_tier, type: enum, source: computed, default: STANDARD, constraints: "{STANDARD, SILVER, GOLD}", description: "Derived from total_credits via credit_tier_assignment thresholds" }

  - name: Offtaker
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Legal name of the beneficial-reuse buyer" }
      - { name: hq_state_code, type: string, source: input, description: "2-letter US state code of headquarters" }
      - { name: receiving_state_codes, type: array, source: input, description: "List of 2-letter state codes where this offtaker can receive material" }

  - name: ByproductStream
    parent: Generator
    common_fields: true
    fields:
      - { name: generator_id, type: string, source: input, description: "FK -> Generator.id; owning generator" }
      - { name: material_type, type: enum, source: input, constraints: "{FLY_ASH, SLAG, GYPSUM, FOUNDRY_SAND, BIOSOLIDS}", description: "Material class of the byproduct" }
      - { name: declared_moisture_pct, type: number, source: input, description: "Generator-declared typical moisture percentage" }
      - { name: expected_tons_per_month, type: integer, source: input, description: "Expected monthly production tonnage" }
      - { name: status, type: enum, source: system, default: DRAFT, constraints: "{DRAFT, CHARACTERIZED, ACTIVE}", description: "DRAFT until a characterization is VERIFIED; ACTIVE once any eligibility determination is APPROVED" }

  - name: CharacterizationProfile
    parent: ByproductStream
    common_fields: true
    fields:
      - { name: stream_id, type: string, source: system, description: "FK -> ByproductStream.id; taken from the URL path" }
      - { name: lab_name, type: string, source: input, description: "Name of the testing laboratory" }
      - { name: sampled_on, type: string, source: input, description: "ISO date the sample was taken" }
      - { name: ph, type: number, source: input, description: "Measured pH" }
      - { name: arsenic_ppm, type: number, source: input, description: "Measured arsenic concentration ppm" }
      - { name: lead_ppm, type: number, source: input, description: "Measured lead concentration ppm" }
      - { name: moisture_pct_measured, type: number, source: input, description: "Lab-measured moisture percentage" }
      - { name: status, type: enum, source: system, default: SUBMITTED, constraints: "{SUBMITTED, VERIFIED, REJECTED}", description: "Broker verification outcome" }
      - { name: rejection_reason, type: string, source: system, description: "Set when REJECTED; null otherwise", default: null }

  - name: ReuseEligibility
    parent: ByproductStream
    common_fields: true
    fields:
      - { name: stream_id, type: string, source: system, description: "FK -> ByproductStream.id; taken from the URL path" }
      - { name: state_code, type: string, source: input, description: "2-letter state code this determination applies to" }
      - { name: use_case, type: enum, source: input, constraints: "{CEMENT_ADDITIVE, ROAD_BASE, SOIL_AMENDMENT, MINE_RECLAMATION}", description: "Beneficial-reuse use case" }
      - { name: valid_from, type: string, source: input, description: "ISO date, inclusive window start" }
      - { name: valid_until, type: string, source: input, description: "ISO date, exclusive window end; must be after valid_from" }
      - { name: filed_by_user_id, type: string, source: system, description: "X-User-ID of the ComplianceOfficer who created the DRAFT" }
      - { name: approved_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the approving ComplianceOfficer; must differ from filed_by_user_id" }
      - { name: status, type: enum, source: system, default: DRAFT, constraints: "{DRAFT, SUBMITTED, APPROVED, DENIED, SUSPENDED, EXPIRED}", description: "EXPIRED applied lazily when logical clock date >= valid_until while APPROVED or SUSPENDED" }
      - { name: decision_reason, type: string, source: system, default: null, description: "Set on DENIED; null otherwise" }

  - name: StatePermit
    parent: null
    common_fields: true
    fields:
      - { name: state_code, type: string, source: input, description: "2-letter state code of the regulated activity" }
      - { name: material_type, type: enum, source: input, constraints: "{FLY_ASH, SLAG, GYPSUM, FOUNDRY_SAND, BIOSOLIDS}", description: "Material class covered" }
      - { name: regime, type: enum, source: input, constraints: "{PERMIT, NOTIFICATION}", description: "Whether the state requires a permit or only a notification" }
      - { name: permit_number, type: string, source: input, description: "Regulator-issued permit or notification number" }
      - { name: issued_on, type: string, source: input, description: "ISO date of issuance" }
      - { name: expires_on, type: string, source: input, description: "ISO date, inclusive last valid day; must be >= issued_on" }
      - { name: status, type: enum, source: system, default: FILED, constraints: "{FILED, ACTIVE, REVOKED, EXPIRED}", description: "EXPIRED applied lazily when logical clock date > expires_on while ACTIVE" }

  - name: SupplyAgreement
    parent: null
    common_fields: true
    fields:
      - { name: generator_id, type: string, source: input, description: "FK -> Generator.id; supplying generator (must equal acting Generator user id)" }
      - { name: stream_id, type: string, source: input, description: "FK -> ByproductStream.id; covered stream" }
      - { name: committed_monthly_tons, type: integer, source: input, description: "Maximum tons bookable per calendar month" }
      - { name: revenue_share_pct_to_generator, type: number, source: input, constraints: "0 < value < 1", description: "Fraction of final gross revenue paid to the generator" }
      - { name: freight_share_pct_to_generator, type: number, source: input, constraints: "0 <= value <= 1", description: "Fraction of freight cost absorbed by the generator" }
      - { name: term_start, type: string, source: input, description: "ISO date, inclusive term start" }
      - { name: term_end, type: string, source: input, description: "ISO date, inclusive term end; must be >= term_start" }
      - { name: booked_month_to_date_tons, type: number, source: computed, default: 0, description: "Gross tons BOOKED in counter_month (see monthly_counter_rollover); incremented on booking, decremented on cancel/auto-cancel" }
      - { name: delivered_month_to_date_tons, type: number, source: computed, default: 0, description: "Net billable tons ACCEPTED in counter_month; incremented on accept, decremented on void" }
      - { name: counter_month, type: string, source: system, description: "YYYY-MM logical month the month-to-date counters belong to" }
      - { name: fulfillment_status, type: enum, source: computed, default: UNMET, constraints: "{UNMET, MET}", description: "MET when delivered_month_to_date_tons >= committed_monthly_tons, else UNMET" }
      - { name: status, type: enum, source: system, default: DRAFT, constraints: "{DRAFT, ACTIVE, SUSPENDED, TERMINATED}", description: "Lifecycle of the agreement" }

  - name: OfftakeCommitment
    parent: null
    common_fields: true
    fields:
      - { name: offtaker_id, type: string, source: input, description: "FK -> Offtaker.id; buying offtaker (must equal acting Offtaker user id)" }
      - { name: stream_id, type: string, source: input, description: "FK -> ByproductStream.id; covered stream" }
      - { name: destination_state_code, type: string, source: input, description: "2-letter state code of the receiving site; must be in offtaker.receiving_state_codes" }
      - { name: committed_monthly_tons, type: integer, source: input, description: "Maximum tons receivable per calendar month; also basis of the rejection tolerance" }
      - { name: max_moisture_pct, type: number, source: input, description: "Quality spec: maximum acceptable destination moisture percentage" }
      - { name: max_arsenic_ppm, type: number, source: input, description: "Quality spec: maximum acceptable destination arsenic ppm" }
      - { name: accepted_month_to_date_tons, type: number, source: computed, default: 0, description: "Net billable tons ACCEPTED in counter_month; incremented on accept, decremented on void" }
      - { name: cumulative_rejected_tons, type: number, source: computed, default: 0, description: "Lifetime gross tons rejected at destination; drives auto-suspension" }
      - { name: counter_month, type: string, source: system, description: "YYYY-MM logical month the accepted_month_to_date counter belongs to" }
      - { name: status, type: enum, source: system, default: DRAFT, constraints: "{DRAFT, ACTIVE, SUSPENDED, TERMINATED}", description: "SUSPENDED can be entered automatically via rejection_tolerance_posture" }

  - name: Shipment
    parent: null
    common_fields: true
    fields:
      - { name: supply_agreement_id, type: string, source: input, description: "FK -> SupplyAgreement.id; agreement the load is booked against" }
      - { name: offtake_commitment_id, type: string, source: input, description: "FK -> OfftakeCommitment.id; receiving commitment" }
      - { name: pickup_date, type: string, source: input, description: "ISO date of scheduled pickup" }
      - { name: distance_miles, type: integer, source: input, constraints: ">= 0", description: "One-way haul distance in miles" }
      - { name: gross_tons, type: number, source: input, constraints: "> 0", description: "Gross loaded tons" }
      - { name: loading_moisture_pct, type: number, source: input, description: "Moisture percentage measured at loading" }
      - { name: destination_moisture_pct, type: number, source: system, default: null, description: "Moisture percentage measured at destination (set by deliver/redeliver)" }
      - { name: destination_arsenic_ppm, type: number, source: system, default: null, description: "Arsenic ppm spot check at destination (set by deliver/redeliver)" }
      - { name: price_at_pickup_cents_per_ton, type: integer, source: computed, description: "MarketPriceIndex price selected at booking for pickup_date" }
      - { name: price_at_acceptance_cents_per_ton, type: integer, source: system, default: null, description: "MarketPriceIndex price selected at acceptance; falls back to price_at_pickup_cents_per_ton when no entry is effective" }
      - { name: freight_total_cents, type: integer, source: computed, description: "Tiered freight cost computed at booking via freight_cost_allocation" }
      - { name: generator_freight_share_cents, type: integer, source: computed, description: "Generator-absorbed freight portion (capped)" }
      - { name: broker_freight_share_cents, type: integer, source: computed, description: "freight_total_cents minus generator_freight_share_cents" }
      - { name: provisional_settlement_cents, type: integer, source: computed, description: "round_half_up(gross_tons x price_at_pickup_cents_per_ton) at booking" }
      - { name: moisture_deduction_pct, type: number, source: computed, default: null, description: "max(0, destination_moisture_pct - commitment.max_moisture_pct) at acceptance" }
      - { name: net_billable_tons, type: number, source: computed, default: null, description: "round_half_up(gross_tons x (1 - moisture_deduction_pct/100), 3) at acceptance" }
      - { name: final_gross_revenue_cents, type: integer, source: computed, default: null, description: "Final-variant gross revenue at acceptance" }
      - { name: final_generator_share_cents, type: integer, source: computed, default: null, description: "Generator revenue share at acceptance" }
      - { name: final_broker_share_cents, type: integer, source: computed, default: null, description: "Residual revenue to broker (gross minus generator share)" }
      - { name: generator_net_payout_cents, type: integer, source: computed, default: null, description: "final_generator_share_cents minus generator_freight_share_cents" }
      - { name: status, type: enum, source: system, default: BOOKED, constraints: "{BOOKED, DISPATCHED, DELIVERED, ACCEPTED, REJECTED, RECONDITIONING, VOIDED, CANCELLED, DISPOSED}", description: "Load lifecycle; RECONDITIONING loops back to DELIVERED" }
      - { name: rejection_reason, type: string, source: system, default: null, description: "Set on REJECTED" }
      - { name: void_reason, type: string, source: system, default: null, description: "Set on VOIDED" }

  - name: StorageFacility
    parent: null
    common_fields: true
    fields:
      - { name: state_code, type: string, source: input, description: "2-letter state code of the facility" }
      - { name: material_types_allowed, type: array, source: input, description: "Material classes the facility accepts" }
      - { name: capacity_tons, type: integer, source: input, constraints: "> 0", description: "Maximum simultaneous stored tonnage" }
      - { name: current_inventory_tons, type: number, source: computed, default: 0, description: "Sum of tons over reservations of this facility with status CHECKED_IN" }

  - name: StorageReservation
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> StorageFacility.id; reserved facility" }
      - { name: stream_id, type: string, source: input, description: "FK -> ByproductStream.id; material to be stored" }
      - { name: start_date, type: string, source: input, description: "ISO date, inclusive window start" }
      - { name: end_date, type: string, source: input, description: "ISO date, exclusive window end; must be after start_date" }
      - { name: tons, type: number, source: input, constraints: "> 0", description: "Tons of capacity committed" }
      - { name: status, type: enum, source: system, default: RESERVED, constraints: "{RESERVED, CHECKED_IN, RELEASED, CANCELLED}", description: "Reservation lifecycle" }

  - name: MarketPriceIndex
    parent: null
    common_fields: false
    fields:
      - { name: material_type, type: enum, source: input, constraints: "{FLY_ASH, SLAG, GYPSUM, FOUNDRY_SAND, BIOSOLIDS}", description: "Material class priced" }
      - { name: region_code, type: string, source: input, description: "2-letter state code the price applies to" }
      - { name: effective_from, type: string, source: input, description: "ISO date the price becomes effective" }
      - { name: price_cents_per_ton, type: integer, source: input, constraints: "> 0", description: "Index price in cents per ton" }
      - { name: published_by_user_id, type: string, source: system, description: "X-User-ID of the publishing BrokerOps user" }

  - name: SustainabilityCreditEntry
    parent: null
    common_fields: false
    fields:
      - { name: generator_id, type: string, source: system, description: "FK -> Generator.id; credited generator" }
      - { name: shipment_id, type: string, source: system, description: "FK -> Shipment.id; originating shipment" }
      - { name: entry_type, type: enum, source: system, constraints: "{ACCRUAL, REVERSAL}", description: "ACCRUAL posted on acceptance; REVERSAL posted on void" }
      - { name: period, type: string, source: system, description: "YYYY-MM logical month of posting" }
      - { name: tons_credited, type: number, source: system, description: "Net billable tons the entry is based on" }
      - { name: credits, type: number, source: system, description: "Credit amount; positive for ACCRUAL and REVERSAL rows (sign carried by entry_type); 2 decimal places" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ByproductStream
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: CHARACTERIZED
        trigger: "POST /api/characterizations/{id}/verify (bubble up on first VERIFIED characterization)"
        actor: BrokerOps
        preconditions: ["characterization.status == SUBMITTED", "characterization.stream_id == stream.id"]
        side_effects: ["stream.status := CHARACTERIZED", "stream.updated_at refreshed", "stream.version += 1"]
      - from: CHARACTERIZED
        to: ACTIVE
        trigger: "POST /api/eligibility-determinations/{id}/approve (bubble up on first APPROVED determination)"
        actor: ComplianceOfficer
        preconditions: ["determination.stream_id == stream.id", "determination.status == SUBMITTED"]
        side_effects: ["stream.status := ACTIVE", "stream.updated_at refreshed", "stream.version += 1"]

  - entity: CharacterizationProfile
    initial_state: SUBMITTED
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /api/characterizations/{id}/verify"
        actor: BrokerOps
        preconditions: ["characterization.status == SUBMITTED"]
        side_effects: ["owning ByproductStream transitions DRAFT -> CHARACTERIZED when still DRAFT"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /api/characterizations/{id}/reject"
        actor: BrokerOps
        preconditions: ["characterization.status == SUBMITTED"]
        side_effects: ["rejection_reason := payload.reason"]

  - entity: ReuseEligibility
    initial_state: DRAFT
    terminal_states: [EXPIRED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/eligibility-determinations/{id}/submit"
        actor: ComplianceOfficer
        preconditions:
          - "determination.status == DRAFT"
          - "at least one CharacterizationProfile of determination.stream_id has status VERIFIED (else ERR_STREAM_NOT_CHARACTERIZED)"
          - "no other determination of the same (stream_id, state_code) with status IN {SUBMITTED, APPROVED, SUSPENDED} has a half-open window overlapping [valid_from, valid_until) (else ERR_ELIGIBILITY_WINDOW_OVERLAP)"
        side_effects: []
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /api/eligibility-determinations/{id}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "determination.status == SUBMITTED"
          - "acting X-User-ID != determination.filed_by_user_id (segregation of duties, else ERR_SEGREGATION_OF_DUTIES)"
          - "valid_until > current logical date (else ERR_ELIGIBILITY_WINDOW_PAST)"
          - "no overlapping window among {SUBMITTED, APPROVED, SUSPENDED} peers for same (stream_id, state_code) (else ERR_ELIGIBILITY_WINDOW_OVERLAP)"
        side_effects:
          - "approved_by_user_id := acting X-User-ID"
          - "owning ByproductStream transitions CHARACTERIZED -> ACTIVE when still CHARACTERIZED"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /api/eligibility-determinations/{id}/deny"
        actor: ComplianceOfficer
        preconditions:
          - "determination.status == SUBMITTED"
          - "acting X-User-ID != determination.filed_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["decision_reason := payload.reason"]
      - from: DENIED
        to: DRAFT
        trigger: "POST /api/eligibility-determinations/{id}/revise"
        actor: ComplianceOfficer
        preconditions: ["determination.status == DENIED"]
        side_effects: ["decision_reason := null", "approved_by_user_id := null"]
        note: "Revision loop: a denied determination can be reworked and resubmitted."
      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /api/eligibility-determinations/{id}/suspend"
        actor: ComplianceOfficer
        preconditions: ["determination.status == APPROVED"]
        side_effects: []
      - from: SUSPENDED
        to: APPROVED
        trigger: "POST /api/eligibility-determinations/{id}/reinstate"
        actor: ComplianceOfficer
        preconditions:
          - "determination.status == SUSPENDED"
          - "valid_until > current logical date (else ERR_ELIGIBILITY_WINDOW_PAST)"
          - "no overlapping window among {SUBMITTED, APPROVED, SUSPENDED} peers for same (stream_id, state_code) (else ERR_ELIGIBILITY_WINDOW_OVERLAP)"
        side_effects: []
      - from: APPROVED
        to: EXPIRED
        trigger: "system: lazy transition applied whenever the determination is read or referenced and current logical date >= valid_until"
        actor: system
        preconditions: ["current logical date >= valid_until"]
        side_effects: []
      - from: SUSPENDED
        to: EXPIRED
        trigger: "system: lazy transition applied whenever the determination is read or referenced and current logical date >= valid_until"
        actor: system
        preconditions: ["current logical date >= valid_until"]
        side_effects: []

  - entity: StatePermit
    initial_state: FILED
    terminal_states: [REVOKED, EXPIRED]
    transitions:
      - from: FILED
        to: ACTIVE
        trigger: "POST /api/state-permits/{id}/activate"
        actor: ComplianceOfficer
        preconditions:
          - "permit.status == FILED"
          - "no other permit with same (state_code, material_type) has status ACTIVE (else ERR_DUPLICATE_PERMIT)"
        side_effects: []
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /api/state-permits/{id}/revoke"
        actor: ComplianceOfficer
        preconditions: ["permit.status == ACTIVE"]
        side_effects: []
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: lazy transition applied whenever the permit is read or referenced and current logical date > expires_on"
        actor: system
        preconditions: ["current logical date > expires_on"]
        side_effects: []

  - entity: SupplyAgreement
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /api/supply-agreements/{id}/activate"
        actor: BrokerOps
        preconditions:
          - "agreement.status == DRAFT"
          - "stream referenced by agreement.stream_id has status IN {CHARACTERIZED, ACTIVE} (else ERR_STREAM_NOT_CHARACTERIZED)"
        side_effects: ["counter_month := current logical month"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/supply-agreements/{id}/suspend"
        actor: BrokerOps
        preconditions: ["agreement.status == ACTIVE"]
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/supply-agreements/{id}/resume"
        actor: BrokerOps
        preconditions: ["agreement.status == SUSPENDED"]
        side_effects: []
      - from: DRAFT
        to: TERMINATED
        trigger: "POST /api/supply-agreements/{id}/terminate"
        actor: BrokerOps
        preconditions: ["agreement.status == DRAFT"]
        side_effects: []
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /api/supply-agreements/{id}/terminate"
        actor: BrokerOps
        preconditions: ["agreement.status == ACTIVE"]
        side_effects: []
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /api/supply-agreements/{id}/terminate"
        actor: BrokerOps
        preconditions: ["agreement.status == SUSPENDED"]
        side_effects: []

  - entity: OfftakeCommitment
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /api/offtake-commitments/{id}/activate"
        actor: BrokerOps
        preconditions:
          - "commitment.status == DRAFT"
          - "stream referenced by commitment.stream_id has status IN {CHARACTERIZED, ACTIVE} (else ERR_STREAM_NOT_CHARACTERIZED)"
        side_effects: ["counter_month := current logical month"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: rejection_tolerance_posture fires inside POST /api/shipments/{id}/reject cascade"
        actor: system
        preconditions: ["cumulative_rejected_tons > round_half_up(committed_monthly_tons x 0.20, 3) after the current rejection is added"]
        side_effects:
          - "every Shipment with offtake_commitment_id == commitment.id and status == BOOKED auto-transitions to CANCELLED (conditional cascade: DISPATCHED or later shipments are NOT affected)"
          - "each auto-cancelled Shipment decrements its SupplyAgreement.booked_month_to_date_tons by its gross_tons (after rollover) and bumps that agreement.version += 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/offtake-commitments/{id}/resume"
        actor: BrokerOps
        preconditions: ["commitment.status == SUSPENDED"]
        side_effects: []
      - from: DRAFT
        to: TERMINATED
        trigger: "POST /api/offtake-commitments/{id}/terminate"
        actor: BrokerOps
        preconditions: ["commitment.status == DRAFT"]
        side_effects: []
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /api/offtake-commitments/{id}/terminate"
        actor: BrokerOps
        preconditions: ["commitment.status == ACTIVE"]
        side_effects: []
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /api/offtake-commitments/{id}/terminate"
        actor: BrokerOps
        preconditions: ["commitment.status == SUSPENDED"]
        side_effects: []

  - entity: Shipment
    initial_state: BOOKED
    terminal_states: [VOIDED, CANCELLED, DISPOSED]
    transitions:
      - from: BOOKED
        to: DISPATCHED
        trigger: "POST /api/shipments/{id}/dispatch"
        actor: Generator
        preconditions:
          - "shipment.status == BOOKED (else ERR_INVALID_STATE)"
          - "shipment.supply_agreement_id's agreement.status == ACTIVE (else ERR_AGREEMENT_NOT_ACTIVE)"
          - "shipment.offtake_commitment_id's commitment.status == ACTIVE (else ERR_COMMITMENT_NOT_ACTIVE)"
          - "exists ReuseEligibility of the agreement's stream_id with state_code == commitment.destination_state_code, status == APPROVED, valid_from <= current logical date < valid_until (else ERR_REUSE_NOT_ELIGIBLE; SUSPENDED/EXPIRED do not qualify)"
          - "exists StatePermit with state_code == commitment.destination_state_code, material_type == stream.material_type, status == ACTIVE, issued_on <= current logical date <= expires_on (else ERR_PERMIT_REQUIRED)"
          - "agreement.term_start <= current logical date <= agreement.term_end (else ERR_OUTSIDE_AGREEMENT_TERM)"
        side_effects: []
      - from: DISPATCHED
        to: DELIVERED
        trigger: "POST /api/shipments/{id}/deliver"
        actor: Offtaker
        preconditions: ["shipment.status == DISPATCHED (else ERR_INVALID_STATE)"]
        side_effects: ["destination_moisture_pct := payload.destination_moisture_pct", "destination_arsenic_ppm := payload.destination_arsenic_ppm"]
      - from: DELIVERED
        to: ACCEPTED
        trigger: "POST /api/shipments/{id}/accept"
        actor: Offtaker
        preconditions:
          - "shipment.status == DELIVERED (else ERR_INVALID_STATE)"
          - "destination_moisture_pct <= commitment.max_moisture_pct + 2.0 AND destination_arsenic_ppm <= commitment.max_arsenic_ppm (else ERR_QUALITY_OUT_OF_SPEC)"
        side_effects:
          - "run shipment_settlement final variant: moisture_deduction_pct, net_billable_tons, price_at_acceptance_cents_per_ton, final_gross_revenue_cents, final_generator_share_cents, final_broker_share_cents, generator_net_payout_cents"
          - "agreement.delivered_month_to_date_tons += net_billable_tons (after monthly_counter_rollover); agreement.fulfillment_status recomputed; agreement.version += 1"
          - "commitment.accepted_month_to_date_tons += net_billable_tons (after monthly_counter_rollover); commitment.version += 1"
          - "create SustainabilityCreditEntry{entry_type: ACCRUAL, generator_id: agreement.generator_id, shipment_id: shipment.id, period: current logical YYYY-MM, tons_credited: net_billable_tons, credits: round_half_up(net_billable_tons x 1.0, 2)}"
          - "that entry creation recomputes Generator.total_credits = (sum ACCRUAL credits) - (sum REVERSAL credits)"
          - "that total_credits recompute re-derives Generator.credit_tier via credit_tier_assignment (>= 250 GOLD, >= 100 SILVER, else STANDARD)"
      - from: DELIVERED
        to: REJECTED
        trigger: "POST /api/shipments/{id}/reject"
        actor: Offtaker
        preconditions: ["shipment.status == DELIVERED (else ERR_INVALID_STATE)"]
        side_effects:
          - "rejection_reason := payload.reason"
          - "commitment.cumulative_rejected_tons += shipment.gross_tons; commitment.version += 1"
          - "if commitment was ACTIVE and cumulative_rejected_tons > round_half_up(commitment.committed_monthly_tons x 0.20, 3): commitment auto-transitions ACTIVE -> SUSPENDED"
          - "that auto-suspension then cancels every BOOKED shipment of the commitment (see OfftakeCommitment ACTIVE -> SUSPENDED side effects), and each cancellation decrements its agreement.booked_month_to_date_tons by its gross_tons and bumps that agreement.version += 1"
      - from: REJECTED
        to: RECONDITIONING
        trigger: "POST /api/shipments/{id}/recondition"
        actor: Generator
        preconditions: ["shipment.status == REJECTED (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: RECONDITIONING
        to: DELIVERED
        trigger: "POST /api/shipments/{id}/redeliver"
        actor: Generator
        preconditions: ["shipment.status == RECONDITIONING (else ERR_INVALID_STATE)"]
        side_effects: ["destination_moisture_pct := payload.destination_moisture_pct", "destination_arsenic_ppm := payload.destination_arsenic_ppm"]
        note: "Cyclic loop: reconditioned loads re-enter DELIVERED and may be accepted or rejected again; each rejection adds gross_tons to cumulative_rejected_tons again."
      - from: REJECTED
        to: DISPOSED
        trigger: "POST /api/shipments/{id}/dispose"
        actor: Generator
        preconditions: ["shipment.status == REJECTED (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /api/shipments/{id}/cancel"
        actor: Generator
        preconditions: ["shipment.status == BOOKED (else ERR_INVALID_STATE)"]
        side_effects: ["agreement.booked_month_to_date_tons -= shipment.gross_tons (after monthly_counter_rollover; floor 0); agreement.version += 1"]
      - from: ACCEPTED
        to: VOIDED
        trigger: "POST /api/shipments/{id}/void"
        actor: BrokerOps
        preconditions: ["shipment.status == ACCEPTED (else ERR_INVALID_STATE)"]
        side_effects:
          - "void_reason := payload.reason"
          - "create SustainabilityCreditEntry{entry_type: REVERSAL, generator_id, shipment_id, period: current logical YYYY-MM, tons_credited: shipment.net_billable_tons, credits: equal to the original ACCRUAL credits of this shipment}"
          - "that entry creation recomputes Generator.total_credits = (sum ACCRUAL credits) - (sum REVERSAL credits)"
          - "that total_credits recompute re-derives Generator.credit_tier via credit_tier_assignment (may downgrade)"
          - "agreement.delivered_month_to_date_tons -= shipment.net_billable_tons (after rollover; floor 0); agreement.fulfillment_status recomputed; agreement.version += 1"
          - "commitment.accepted_month_to_date_tons -= shipment.net_billable_tons (after rollover; floor 0); commitment.version += 1"

  - entity: StorageReservation
    initial_state: RESERVED
    terminal_states: [RELEASED, CANCELLED]
    transitions:
      - from: RESERVED
        to: CHECKED_IN
        trigger: "POST /api/storage-reservations/{id}/check-in"
        actor: BrokerOps
        preconditions:
          - "reservation.status == RESERVED (else ERR_INVALID_STATE)"
          - "reservation.start_date <= current logical date < reservation.end_date (else ERR_RESERVATION_WINDOW_INVALID)"
        side_effects: ["facility.current_inventory_tons += reservation.tons; facility.version += 1"]
      - from: CHECKED_IN
        to: RELEASED
        trigger: "POST /api/storage-reservations/{id}/release"
        actor: BrokerOps
        preconditions: ["reservation.status == CHECKED_IN (else ERR_INVALID_STATE)"]
        side_effects: ["facility.current_inventory_tons -= reservation.tons; facility.version += 1"]
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /api/storage-reservations/{id}/cancel"
        actor: BrokerOps
        preconditions: ["reservation.status == RESERVED (else ERR_INVALID_STATE)"]
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: shipment-create-stale-agreement-version
    parent_entity: SupplyAgreement
    write_endpoint: "POST /api/shipments"
    occ_field: "expected_supply_agreement_version"
    description: |
      Creating a Shipment against a SupplyAgreement whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just booked or cancelled a load (which mutates
      booked_month_to_date_tons and advances agreement.version) and the current
      writer's quota view is therefore stale.
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: freight_cost_allocation
    trigger: "POST /api/shipments (booking), before quota side effects"
    algorithm: tiered_pricing
    formula: |
      freight_total_cents = BASE_FEE_CENTS
        + min(distance_miles, TIER1_LIMIT_MI) * TIER1_RATE_CENTS_PER_MI
        + max(0, min(distance_miles, TIER2_LIMIT_MI) - TIER1_LIMIT_MI) * TIER2_RATE_CENTS_PER_MI
        + max(0, distance_miles - TIER2_LIMIT_MI) * TIER3_RATE_CENTS_PER_MI
      generator_freight_share_cents = min(round_half_up(freight_total_cents * agreement.freight_share_pct_to_generator), MAX_GENERATOR_FREIGHT_SHARE_CENTS)
      broker_freight_share_cents = freight_total_cents - generator_freight_share_cents
    input_set: "the new Shipment's distance_miles; its SupplyAgreement.freight_share_pct_to_generator"
    constants:
      BASE_FEE_CENTS: 15000
      TIER1_LIMIT_MI: 100
      TIER1_RATE_CENTS_PER_MI: 450
      TIER2_LIMIT_MI: 300
      TIER2_RATE_CENTS_PER_MI: 320
      TIER3_RATE_CENTS_PER_MI: 210
      MAX_GENERATOR_FREIGHT_SHARE_CENTS: 60000
    precision: "integer cents, round_half_up applied only to the share multiplication"

  - name: shipment_settlement
    trigger: "provisional variant at POST /api/shipments; final variant at POST /api/shipments/{id}/accept"
    algorithm: aggregation
    formula: |
      # Final variant (acceptance) — pinned evaluation and rounding order:
      # (1) moisture_deduction_pct = max(0, destination_moisture_pct - commitment.max_moisture_pct)
      # (2) net_billable_tons = round_half_up(gross_tons * (1 - moisture_deduction_pct/100), 3)
      # (3) price = market_price_selection(stream.material_type, commitment.destination_state_code, current logical date);
      #     if no entry is effective, price = shipment.price_at_pickup_cents_per_ton (fallback)
      # (4) final_gross_revenue_cents = round_half_up(net_billable_tons * price)   <-- round AFTER 3dp ton rounding, never multiply unrounded tons
      # (5) final_generator_share_cents = round_half_up(final_gross_revenue_cents * agreement.revenue_share_pct_to_generator)
      # (6) final_broker_share_cents = final_gross_revenue_cents - final_generator_share_cents   (residual absorbs rounding)
      # (7) generator_net_payout_cents = final_generator_share_cents - generator_freight_share_cents
      # Provisional variant (booking):
      # provisional_settlement_cents = round_half_up(gross_tons * price_at_pickup_cents_per_ton)
      # (uses gross tons with no moisture deduction and the pickup-date price)
    input_set: "the Shipment being priced; its SupplyAgreement (shares); its OfftakeCommitment (spec, destination_state_code)"
    constants:
      MOISTURE_TOLERANCE_PCT: 2.0
    precision: "tons 3 decimal places round_half_up; money integer cents round_half_up"
    variants:
      - name: provisional
        when: "at booking"
        difference: "prices gross_tons (no moisture deduction) at the index effective on pickup_date"
      - name: final
        when: "at acceptance"
        difference: "prices moisture-adjusted net_billable_tons at the index effective on the acceptance date (pickup price fallback); identical shipment data therefore yields different cents whenever the index moved or moisture deduction > 0"

  - name: market_price_selection
    trigger: "inside shipment_settlement (both variants)"
    algorithm: chronological
    formula: |
      candidates = MarketPriceIndex where material_type == stream.material_type
                     AND region_code == commitment.destination_state_code
                     AND effective_from <= pricing_date
      if candidates empty at booking -> ERR_PRICE_INDEX_GAP
      if candidates empty at acceptance -> use shipment.price_at_pickup_cents_per_ton
      else winner = sort candidates by effective_from DESC, tie-break created_at DESC; take first
    input_set: "MarketPriceIndex entries matching material_type and destination_state_code with effective_from <= pricing date"
    precision: "date comparison at day granularity against the logical clock"
    variants: []

  - name: sustainability_credit_accrual
    trigger: "standard variant: posted per acceptance/void; attested variant: computed on GET /api/generators/{id}/credit-summary"
    algorithm: aggregation
    formula: |
      # Standard (ledger) variant:
      #   ACCRUAL entry: credits = round_half_up(net_billable_tons * STANDARD_CREDIT_PER_TON, 2)
      #   REVERSAL entry: credits = original ACCRUAL credits of the same shipment
      #   Generator.total_credits = sum(ACCRUAL.credits) - sum(REVERSAL.credits) over all its entries
      #   standard_credits (summary, period P) = sum over entries with period == P of signed credits
      # Attested (regulatory) variant, period P:
      #   eligible = Shipments of this generator with status == ACCEPTED (never voided) accepted in P
      #   attested_credits = round_half_up(sum(eligible.net_billable_tons) * ATTESTED_FACTOR, 2)
      #   total_net_tons (summary) = sum over eligible of net_billable_tons  (attested basis tonnage)
    input_set: "SustainabilityCreditEntry rows of the generator (standard); Shipment rows with status ACCEPTED in the period (attested)"
    constants:
      STANDARD_CREDIT_PER_TON: 1.0
      ATTESTED_FACTOR: 0.92
    precision: "2 decimal places, round_half_up"
    variants:
      - name: standard
        when: "monthly ledger accrual"
        difference: "ledger-derived, factor 1.0 per net ton, voided shipments offset by REVERSAL rows"
      - name: attested
        when: "annual/regulatory reporting via credit-summary"
        difference: "shipment-derived over shipments still ACCEPTED (voided excluded entirely, not offset), factor 0.92; identical diversion history yields a lower number than standard"

  - name: credit_tier_assignment
    trigger: "whenever Generator.total_credits is recomputed (ACCRUAL or REVERSAL posting)"
    algorithm: threshold
    formula: |
      if total_credits >= GOLD_THRESHOLD_CREDITS -> GOLD
      elif total_credits >= SILVER_THRESHOLD_CREDITS -> SILVER
      else -> STANDARD
    input_set: "the single Generator whose total_credits changed"
    constants:
      SILVER_THRESHOLD_CREDITS: 100
      GOLD_THRESHOLD_CREDITS: 250
    precision: "boundary is inclusive (>=): exactly 100.00 credits yields SILVER"

  - name: monthly_counter_rollover
    trigger: "lazy: at the start of any read or mutation that touches booked_month_to_date_tons / delivered_month_to_date_tons (SupplyAgreement) or accepted_month_to_date_tons (OfftakeCommitment)"
    algorithm: aggregation
    formula: |
      if entity.counter_month != current logical YYYY-MM:
        entity.counter_month := current logical YYYY-MM
        booked_month_to_date_tons := 0 (SupplyAgreement)
        delivered_month_to_date_tons := 0 (SupplyAgreement)
        accepted_month_to_date_tons := 0 (OfftakeCommitment)
      cumulative_rejected_tons NEVER resets (lifetime counter)
      # Lazy rollover reconciliation is a derived-field refresh, not a business
      # mutation: it does NOT increment version or refresh updated_at.
    input_set: "the agreement or commitment being read/mutated"
    precision: "YYYY-MM string comparison against the logical clock"

  - name: rejection_tolerance_posture
    trigger: "inside POST /api/shipments/{id}/reject after cumulative_rejected_tons is incremented"
    algorithm: threshold
    formula: |
      tolerance_tons = round_half_up(commitment.committed_monthly_tons * REJECTION_TOLERANCE_PCT, 3)
      if commitment.status == ACTIVE AND cumulative_rejected_tons > tolerance_tons:
        commitment transitions ACTIVE -> SUSPENDED (see state machine side effects)
    input_set: "the commitment of the rejected shipment"
    constants:
      REJECTION_TOLERANCE_PCT: 0.20
    precision: "strictly-greater comparison: cumulative exactly equal to tolerance does NOT suspend"

  - name: storage_overlap_capacity
    trigger: "POST /api/storage-reservations"
    algorithm: interval_merge
    formula: |
      for each calendar day d in [new.start_date, new.end_date)  (half-open):
        overlapping = reservations of new.facility_id with status IN {RESERVED, CHECKED_IN}
                      whose [start_date, end_date) contains d
        if sum(overlapping.tons) + new.tons > facility.capacity_tons -> ERR_STORAGE_CAPACITY_EXCEEDED
      adjacency: a reservation ending on day X and another starting on day X do NOT overlap
    input_set: "StorageReservation rows of the facility with status RESERVED or CHECKED_IN"
    precision: "day-granularity half-open intervals; capacity comparison allows equality"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and X-User-Role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "acting role is listed in the endpoint's roles", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "entity-backed ownership: Generator endpoints require X-User-ID == owning generator_id; Offtaker endpoints require X-User-ID == owning offtaker_id", error_id: ERR_OWNERSHIP_MISMATCH, http_status: 403, applies_to: "Generator/Offtaker write endpoints" }
  - { priority: 3, category: auth, check: "segregation of duties: approve/deny require acting X-User-ID != determination.filed_by_user_id", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: ["POST /api/eligibility-determinations/{id}/approve", "POST /api/eligibility-determinations/{id}/deny"] }
  - { priority: 4, category: existence, check: "request body well-formed: required fields present, enum values in declared sets, numeric ranges respected, dates ISO; unknown computed/system fields in input are ignored (not rejected)", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 5, category: existence, check: "every path-parameter resource exists", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 6, category: existence, check: "every body-referenced FK (generator_id, stream_id, supply_agreement_id, offtake_commitment_id, facility_id) resolves to an existing entity", error_id: ERR_FK_NOT_FOUND, http_status: 422, applies_to: "creation endpoints with body FKs" }
  - { priority: 7, category: state, check: "OCC: expected_supply_agreement_version == agreement.version", error_id: ERR_STALE_AGREEMENT_VERSION, http_status: 412, applies_to: ["POST /api/shipments"] }
  - { priority: 8, category: state, check: "target resource is in a state from which the requested transition is declared", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 8, category: state, check: "booking/dispatch: agreement.status == ACTIVE", error_id: ERR_AGREEMENT_NOT_ACTIVE, http_status: 409, applies_to: ["POST /api/shipments", "POST /api/shipments/{id}/dispatch"] }
  - { priority: 8, category: state, check: "booking/dispatch: commitment.status == ACTIVE", error_id: ERR_COMMITMENT_NOT_ACTIVE, http_status: 409, applies_to: ["POST /api/shipments", "POST /api/shipments/{id}/dispatch"] }
  - { priority: 9, category: business_safety, check: "dispatch: APPROVED ReuseEligibility for (stream, destination_state) with valid_from <= today < valid_until", error_id: ERR_REUSE_NOT_ELIGIBLE, http_status: 422, applies_to: ["POST /api/shipments/{id}/dispatch"] }
  - { priority: 9, category: business_safety, check: "dispatch: ACTIVE StatePermit for (destination_state, material_type) with issued_on <= today <= expires_on", error_id: ERR_PERMIT_REQUIRED, http_status: 422, applies_to: ["POST /api/shipments/{id}/dispatch"] }
  - { priority: 10, category: business_temporal, check: "booking: term_start <= pickup_date <= term_end; dispatch: term_start <= today <= term_end", error_id: ERR_OUTSIDE_AGREEMENT_TERM, http_status: 422, applies_to: ["POST /api/shipments", "POST /api/shipments/{id}/dispatch"] }
  - { priority: 10, category: business_temporal, check: "eligibility submit/approve/reinstate: half-open window overlap for same (stream_id, state_code) among {SUBMITTED, APPROVED, SUSPENDED}", error_id: ERR_ELIGIBILITY_WINDOW_OVERLAP, http_status: 409, applies_to: ["POST /api/eligibility-determinations/{id}/submit", "POST /api/eligibility-determinations/{id}/approve", "POST /api/eligibility-determinations/{id}/reinstate"] }
  - { priority: 10, category: business_temporal, check: "approve/reinstate: valid_until > today", error_id: ERR_ELIGIBILITY_WINDOW_PAST, http_status: 422, applies_to: ["POST /api/eligibility-determinations/{id}/approve", "POST /api/eligibility-determinations/{id}/reinstate"] }
  - { priority: 10, category: business_temporal, check: "reservation: end_date > start_date at creation; check-in requires start_date <= today < end_date", error_id: ERR_RESERVATION_WINDOW_INVALID, http_status: 422, applies_to: ["POST /api/storage-reservations", "POST /api/storage-reservations/{id}/check-in"] }
  - { priority: 11, category: business_constraint, check: "permit creation/activation: at most one permit with status IN {FILED, ACTIVE} per (state_code, material_type)", error_id: ERR_DUPLICATE_PERMIT, http_status: 409, applies_to: ["POST /api/state-permits", "POST /api/state-permits/{id}/activate"] }
  - { priority: 11, category: business_constraint, check: "reservation: stream.material_type in facility.material_types_allowed", error_id: ERR_MATERIAL_NOT_ACCEPTED, http_status: 422, applies_to: ["POST /api/storage-reservations"] }
  - { priority: 11, category: business_constraint, check: "reservation: storage_overlap_capacity per-day aggregate <= capacity_tons", error_id: ERR_STORAGE_CAPACITY_EXCEEDED, http_status: 422, applies_to: ["POST /api/storage-reservations"] }
  - { priority: 11, category: business_constraint, check: "accept: destination_moisture_pct <= max_moisture_pct + 2.0 AND destination_arsenic_ppm <= max_arsenic_ppm", error_id: ERR_QUALITY_OUT_OF_SPEC, http_status: 422, applies_to: ["POST /api/shipments/{id}/accept"] }
  - { priority: 12, category: business_referential, check: "eligibility filing (create): at least one VERIFIED CharacterizationProfile exists for the stream", error_id: ERR_STREAM_NOT_CHARACTERIZED, http_status: 422, applies_to: ["POST /api/streams/{id}/eligibility-determinations"] }
  - { priority: 12, category: business_referential, check: "agreement/commitment activation: stream.status IN {CHARACTERIZED, ACTIVE}", error_id: ERR_STREAM_NOT_CHARACTERIZED, http_status: 422, applies_to: ["POST /api/supply-agreements/{id}/activate", "POST /api/offtake-commitments/{id}/activate"] }
  - { priority: 12, category: business_referential, check: "commitment creation: destination_state_code in offtaker.receiving_state_codes", error_id: ERR_DESTINATION_NOT_SERVED, http_status: 422, applies_to: ["POST /api/offtake-commitments"] }
  - { priority: 12, category: business_referential, check: "booking: agreement.stream_id == commitment.stream_id", error_id: ERR_STREAM_MISMATCH, http_status: 422, applies_to: ["POST /api/shipments"] }
  - { priority: 13, category: business_fiscal, check: "booking: agreement.booked_month_to_date_tons (post-rollover) + gross_tons <= committed_monthly_tons AND commitment.accepted_month_to_date_tons (post-rollover) + gross_tons <= commitment.committed_monthly_tons", error_id: ERR_COMMITMENT_EXCEEDED, http_status: 422, applies_to: ["POST /api/shipments"] }
  - { priority: 13, category: business_fiscal, check: "booking: a MarketPriceIndex entry is effective for (material_type, destination_state_code) on pickup_date", error_id: ERR_PRICE_INDEX_GAP, http_status: 422, applies_to: ["POST /api/shipments"] }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  - { method: POST, path: "/api/generators", description: "Register a generator organization", roles: [BrokerOps], code: 201, input: [legal_name, hq_state_code, contact_email], output: Generator, side_effects: ["total_credits 0.0, credit_tier STANDARD"] }
  - { method: GET, path: "/api/generators", description: "List generators", roles: [Generator, Offtaker, BrokerOps, ComplianceOfficer, PlatformAdmin], code: 200, input: ["limit?", "offset?"], output: "Generator[]", side_effects: [] }
  - { method: GET, path: "/api/generators/{id}", description: "Read one generator incl. total_credits and credit_tier", roles: [Generator, Offtaker, BrokerOps, ComplianceOfficer, PlatformAdmin], code: 200, input: [], output: Generator, side_effects: [] }
  - { method: POST, path: "/api/offtakers", description: "Register an offtaker organization", roles: [BrokerOps], code: 201, input: [legal_name, hq_state_code, receiving_state_codes], output: Offtaker, side_effects: [] }
  - { method: GET, path: "/api/offtakers", description: "List offtakers", roles: [Generator, Offtaker, BrokerOps, ComplianceOfficer, PlatformAdmin], code: 200, input: ["limit?", "offset?"], output: "Offtaker[]", side_effects: [] }
  - { method: POST, path: "/api/streams", description: "Register a byproduct stream (generator_id must equal acting Generator id)", roles: [Generator], code: 201, input: [generator_id, material_type, declared_moisture_pct, expected_tons_per_month], output: ByproductStream, side_effects: ["status DRAFT"] }
  - { method: GET, path: "/api/streams", description: "List streams", roles: [Generator, Offtaker, BrokerOps, ComplianceOfficer, PlatformAdmin], code: 200, input: ["generator_id?", "status?", "material_type?", "limit?", "offset?"], output: "ByproductStream[]", side_effects: [] }
  - { method: GET, path: "/api/streams/{id}", description: "Read one stream", roles: [Generator, Offtaker, BrokerOps, ComplianceOfficer, PlatformAdmin], code: 200, input: [], output: ByproductStream, side_effects: [] }
  - { method: POST, path: "/api/streams/{id}/characterizations", description: "Submit a lab characterization for a stream (stream must belong to acting Generator)", roles: [Generator], code: 201, input: [lab_name, sampled_on, ph, arsenic_ppm, lead_ppm, moisture_pct_measured], output: CharacterizationProfile, side_effects: ["status SUBMITTED"] }
  - { method: GET, path: "/api/streams/{id}/characterizations", description: "List characterizations of a stream", roles: [Generator, Offtaker, BrokerOps, ComplianceOfficer, PlatformAdmin], code: 200, input: ["limit?", "offset?"], output: "CharacterizationProfile[]", side_effects: [] }
  - { method: POST, path: "/api/characterizations/{id}/verify", description: "Verify a submitted characterization; bubbles stream DRAFT -> CHARACTERIZED", roles: [BrokerOps], code: 200, input: [], output: CharacterizationProfile, side_effects: ["ByproductStream DRAFT -> CHARACTERIZED"] }
  - { method: POST, path: "/api/characterizations/{id}/reject", description: "Reject a submitted characterization", roles: [BrokerOps], code: 200, input: [reason], output: CharacterizationProfile, side_effects: ["rejection_reason set"] }
  - { method: POST, path: "/api/streams/{id}/eligibility-determinations", description: "File a DRAFT reuse-eligibility determination for a state; filed_by_user_id := acting ComplianceOfficer", roles: [ComplianceOfficer], code: 201, input: [state_code, use_case, valid_from, valid_until], output: ReuseEligibility, side_effects: ["filed_by_user_id stamped from X-User-ID"] }
  - { method: GET, path: "/api/streams/{id}/eligibility-determinations", description: "List eligibility determinations of a stream", roles: [Generator, Offtaker, BrokerOps, ComplianceOfficer, PlatformAdmin], code: 200, input: ["limit?", "offset?"], output: "ReuseEligibility[]", side_effects: ["lazy EXPIRED applied"] }
  - { method: POST, path: "/api/eligibility-determinations/{id}/submit", description: "Submit a DRAFT determination for decision", roles: [ComplianceOfficer], code: 200, input: [], output: ReuseEligibility, side_effects: [] }
  - { method: POST, path: "/api/eligibility-determinations/{id}/revise", description: "Reopen a DENIED determination to DRAFT", roles: [ComplianceOfficer], code: 200, input: [], output: ReuseEligibility, side_effects: ["decision_reason and approved_by_user_id cleared"] }
  - { method: POST, path: "/api/eligibility-determinations/{id}/approve", description: "Approve a SUBMITTED determination; approver must differ from filer; bubbles stream CHARACTERIZED -> ACTIVE", roles: [ComplianceOfficer], code: 200, input: [], output: ReuseEligibility, side_effects: ["approved_by_user_id stamped", "ByproductStream CHARACTERIZED -> ACTIVE"] }
  - { method: POST, path: "/api/eligibility-determinations/{id}/deny", description: "Deny a SUBMITTED determination; denier must differ from filer", roles: [ComplianceOfficer], code: 200, input: [reason], output: ReuseEligibility, side_effects: ["decision_reason set"] }
  - { method: POST, path: "/api/eligibility-determinations/{id}/suspend", description: "Suspend an APPROVED determination", roles: [ComplianceOfficer], code: 200, input: [], output: ReuseEligibility, side_effects: [] }
  - { method: POST, path: "/api/eligibility-determinations/{id}/reinstate", description: "Reinstate a SUSPENDED determination to APPROVED", roles: [ComplianceOfficer], code: 200, input: [], output: ReuseEligibility, side_effects: [] }
  - { method: POST, path: "/api/state-permits", description: "File a state permit/notification for a (state, material) pair", roles: [ComplianceOfficer], code: 201, input: [state_code, material_type, regime, permit_number, issued_on, expires_on], output: StatePermit, side_effects: ["status FILED"] }
  - { method: GET, path: "/api/state-permits", description: "List state permits", roles: [Generator, Offtaker, BrokerOps, ComplianceOfficer, PlatformAdmin], code: 200, input: ["state_code?", "material_type?", "status?", "limit?", "offset?"], output: "StatePermit[]", side_effects: ["lazy EXPIRED applied"] }
  - { method: POST, path: "/api/state-permits/{id}/activate", description: "Activate a FILED permit", roles: [ComplianceOfficer], code: 200, input: [], output: StatePermit, side_effects: [] }
  - { method: POST, path: "/api/state-permits/{id}/revoke", description: "Revoke an ACTIVE permit", roles: [ComplianceOfficer], code: 200, input: [], output: StatePermit, side_effects: [] }
  - { method: POST, path: "/api/supply-agreements", description: "Create a supply agreement (generator_id must equal acting Generator id)", roles: [Generator], code: 201, input: [generator_id, stream_id, committed_monthly_tons, revenue_share_pct_to_generator, freight_share_pct_to_generator, term_start, term_end], output: SupplyAgreement, side_effects: ["status DRAFT; counters 0; fulfillment_status UNMET"] }
  - { method: GET, path: "/api/supply-agreements", description: "List supply agreements", roles: [Generator, Offtaker, BrokerOps, ComplianceOfficer, PlatformAdmin], code: 200, input: ["generator_id?", "stream_id?", "status?", "limit?", "offset?"], output: "SupplyAgreement[]", side_effects: ["monthly_counter_rollover applied lazily"] }
  - { method: GET, path: "/api/supply-agreements/{id}", description: "Read one supply agreement", roles: [Generator, Offtaker, BrokerOps, ComplianceOfficer, PlatformAdmin], code: 200, input: [], output: SupplyAgreement, side_effects: ["monthly_counter_rollover applied lazily"] }
  - { method: POST, path: "/api/supply-agreements/{id}/activate", description: "Activate a DRAFT agreement (stream must be CHARACTERIZED or ACTIVE)", roles: [BrokerOps], code: 200, input: [], output: SupplyAgreement, side_effects: ["counter_month initialized"] }
  - { method: POST, path: "/api/supply-agreements/{id}/suspend", description: "Suspend an ACTIVE agreement", roles: [BrokerOps], code: 200, input: [], output: SupplyAgreement, side_effects: [] }
  - { method: POST, path: "/api/supply-agreements/{id}/resume", description: "Resume a SUSPENDED agreement", roles: [BrokerOps], code: 200, input: [], output: SupplyAgreement, side_effects: [] }
  - { method: POST, path: "/api/supply-agreements/{id}/terminate", description: "Terminate an agreement from DRAFT, ACTIVE, or SUSPENDED", roles: [BrokerOps], code: 200, input: [], output: SupplyAgreement, side_effects: [] }
  - { method: POST, path: "/api/offtake-commitments", description: "Create an offtake commitment with embedded quality spec (offtaker_id must equal acting Offtaker id)", roles: [Offtaker], code: 201, input: [offtaker_id, stream_id, destination_state_code, committed_monthly_tons, max_moisture_pct, max_arsenic_ppm], output: OfftakeCommitment, side_effects: ["status DRAFT; counters 0"] }
  - { method: GET, path: "/api/offtake-commitments", description: "List offtake commitments", roles: [Generator, Offtaker, BrokerOps, ComplianceOfficer, PlatformAdmin], code: 200, input: ["offtaker_id?", "stream_id?", "status?", "limit?", "offset?"], output: "OfftakeCommitment[]", side_effects: ["monthly_counter_rollover applied lazily"] }
  - { method: GET, path: "/api/offtake-commitments/{id}", description: "Read one offtake commitment", roles: [Generator, Offtaker, BrokerOps, ComplianceOfficer, PlatformAdmin], code: 200, input: [], output: OfftakeCommitment, side_effects: ["monthly_counter_rollover applied lazily"] }
  - { method: POST, path: "/api/offtake-commitments/{id}/activate", description: "Activate a DRAFT commitment (stream must be CHARACTERIZED or ACTIVE)", roles: [BrokerOps], code: 200, input: [], output: OfftakeCommitment, side_effects: ["counter_month initialized"] }
  - { method: POST, path: "/api/offtake-commitments/{id}/resume", description: "Resume a SUSPENDED commitment", roles: [BrokerOps], code: 200, input: [], output: OfftakeCommitment, side_effects: [] }
  - { method: POST, path: "/api/offtake-commitments/{id}/terminate", description: "Terminate a commitment from DRAFT, ACTIVE, or SUSPENDED", roles: [BrokerOps], code: 200, input: [], output: OfftakeCommitment, side_effects: [] }
  - { method: POST, path: "/api/shipments", description: "Book a load against an agreement+commitment; OCC-guarded on agreement.version", roles: [Generator], code: 201, input: [supply_agreement_id, offtake_commitment_id, pickup_date, distance_miles, gross_tons, loading_moisture_pct, expected_supply_agreement_version], output: Shipment, side_effects: ["freight_cost_allocation computed", "price_at_pickup selected via market_price_selection (ERR_PRICE_INDEX_GAP if none)", "provisional_settlement_cents computed", "agreement.booked_month_to_date_tons += gross_tons (post-rollover)", "increments SupplyAgreement.version by 1"] }
  - { method: GET, path: "/api/shipments", description: "List shipments", roles: [Generator, Offtaker, BrokerOps, ComplianceOfficer, PlatformAdmin], code: 200, input: ["supply_agreement_id?", "offtake_commitment_id?", "status?", "limit?", "offset?"], output: "Shipment[]", side_effects: [] }
  - { method: GET, path: "/api/shipments/{id}", description: "Read one shipment", roles: [Generator, Offtaker, BrokerOps, ComplianceOfficer, PlatformAdmin], code: 200, input: [], output: Shipment, side_effects: [] }
  - { method: POST, path: "/api/shipments/{id}/dispatch", description: "Dispatch a BOOKED load; enforces eligibility, permit, term", roles: [Generator], code: 200, input: [], output: Shipment, side_effects: [] }
  - { method: POST, path: "/api/shipments/{id}/deliver", description: "Record destination arrival and spot-check measurements", roles: [Offtaker], code: 200, input: [destination_moisture_pct, destination_arsenic_ppm], output: Shipment, side_effects: ["destination measurements stamped"] }
  - { method: POST, path: "/api/shipments/{id}/accept", description: "Accept a DELIVERED load; runs final settlement and credit accrual cascade", roles: [Offtaker], code: 200, input: [], output: Shipment, side_effects: ["shipment_settlement final variant", "counters incremented", "SustainabilityCreditEntry ACCRUAL created", "Generator.total_credits and credit_tier recomputed"] }
  - { method: POST, path: "/api/shipments/{id}/reject", description: "Reject a DELIVERED load; runs rejection-tolerance cascade", roles: [Offtaker], code: 200, input: [reason], output: Shipment, side_effects: ["cumulative_rejected_tons += gross_tons", "possible commitment auto-SUSPENDED", "BOOKED sibling shipments auto-CANCELLED"] }
  - { method: POST, path: "/api/shipments/{id}/recondition", description: "Send a REJECTED load to reconditioning", roles: [Generator], code: 200, input: [], output: Shipment, side_effects: [] }
  - { method: POST, path: "/api/shipments/{id}/redeliver", description: "Redeliver a RECONDITIONING load with fresh destination measurements", roles: [Generator], code: 200, input: [destination_moisture_pct, destination_arsenic_ppm], output: Shipment, side_effects: ["destination measurements re-stamped"] }
  - { method: POST, path: "/api/shipments/{id}/dispose", description: "Dispose of a REJECTED load (terminal)", roles: [Generator], code: 200, input: [], output: Shipment, side_effects: [] }
  - { method: POST, path: "/api/shipments/{id}/cancel", description: "Cancel a BOOKED load; releases booked tonnage", roles: [Generator], code: 200, input: [], output: Shipment, side_effects: ["agreement.booked_month_to_date_tons -= gross_tons", "agreement.version += 1"] }
  - { method: POST, path: "/api/shipments/{id}/void", description: "Void an ACCEPTED load; posts credit reversal and unwinds counters", roles: [BrokerOps], code: 200, input: [reason], output: Shipment, side_effects: ["SustainabilityCreditEntry REVERSAL created", "Generator.total_credits and credit_tier recomputed", "agreement/commitment counters decremented"] }
  - { method: GET, path: "/api/shipments/{id}/credit-entries", description: "List credit entries of a shipment", roles: [Generator, Offtaker, BrokerOps, ComplianceOfficer, PlatformAdmin], code: 200, input: ["limit?", "offset?"], output: "SustainabilityCreditEntry[]", side_effects: [] }
  - { method: POST, path: "/api/storage-facilities", description: "Register a buffer-storage facility", roles: [BrokerOps], code: 201, input: [state_code, material_types_allowed, capacity_tons], output: StorageFacility, side_effects: ["current_inventory_tons 0"] }
  - { method: GET, path: "/api/storage-facilities/{id}", description: "Read one facility incl. current_inventory_tons", roles: [Generator, Offtaker, BrokerOps, ComplianceOfficer, PlatformAdmin], code: 200, input: [], output: StorageFacility, side_effects: [] }
  - { method: POST, path: "/api/storage-reservations", description: "Reserve storage capacity for a half-open [start_date, end_date) window", roles: [BrokerOps], code: 201, input: [facility_id, stream_id, start_date, end_date, tons], output: StorageReservation, side_effects: ["storage_overlap_capacity enforced"] }
  - { method: GET, path: "/api/storage-reservations", description: "List storage reservations", roles: [Generator, Offtaker, BrokerOps, ComplianceOfficer, PlatformAdmin], code: 200, input: ["facility_id?", "stream_id?", "status?", "limit?", "offset?"], output: "StorageReservation[]", side_effects: [] }
  - { method: GET, path: "/api/storage-reservations/{id}", description: "Read one storage reservation", roles: [Generator, Offtaker, BrokerOps, ComplianceOfficer, PlatformAdmin], code: 200, input: [], output: StorageReservation, side_effects: [] }
  - { method: POST, path: "/api/storage-reservations/{id}/check-in", description: "Check material into storage within the reservation window; inventory += tons", roles: [BrokerOps], code: 200, input: [], output: StorageReservation, side_effects: ["facility.current_inventory_tons += tons", "facility.version += 1"] }
  - { method: POST, path: "/api/storage-reservations/{id}/release", description: "Release checked-in material; inventory -= tons", roles: [BrokerOps], code: 200, input: [], output: StorageReservation, side_effects: ["facility.current_inventory_tons -= tons", "facility.version += 1"] }
  - { method: POST, path: "/api/storage-reservations/{id}/cancel", description: "Cancel a RESERVED reservation (no inventory effect)", roles: [BrokerOps], code: 200, input: [], output: StorageReservation, side_effects: [] }
  - { method: POST, path: "/api/price-index-entries", description: "Publish an append-only market price index entry", roles: [BrokerOps], code: 201, input: [material_type, region_code, effective_from, price_cents_per_ton], output: MarketPriceIndex, side_effects: ["published_by_user_id stamped from X-User-ID"] }
  - { method: GET, path: "/api/price-index-entries", description: "List price index entries", roles: [Generator, Offtaker, BrokerOps, ComplianceOfficer, PlatformAdmin], code: 200, input: ["material_type?", "region_code?", "limit?", "offset?"], output: "MarketPriceIndex[]", side_effects: [] }
  - { method: GET, path: "/api/generators/{id}/credit-entries", description: "List credit entries of a generator", roles: [Generator, Offtaker, BrokerOps, ComplianceOfficer, PlatformAdmin], code: 200, input: ["limit?", "offset?"], output: "SustainabilityCreditEntry[]", side_effects: [] }
  - { method: GET, path: "/api/generators/{id}/credit-summary", description: "Computed read: standard vs attested credit variants for a period (default current logical YYYY-MM)", roles: [Generator, Offtaker, BrokerOps, ComplianceOfficer, PlatformAdmin], code: 200, input: ["period?"], output: "{ standard_credits: number, attested_credits: number, total_net_tons: number, credit_tier: string }", side_effects: [] }
  - { method: POST, path: "/api/_clock/set_current_utc", description: "Test-driving endpoint: set the logical clock. Server default before any call is exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time. All date comparisons (terms, windows, counters, expiry) use this clock.", roles: [PlatformAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["logical clock advanced"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role / X-User-ID missing or role not declared" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_OWNERSHIP_MISMATCH, http: 403, condition: "Entity-backed role acting on a resource owned by another organization" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Eligibility approver/denier equals the determination's filer" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum value, negative/non-positive number, malformed date" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-parameter resource does not exist" }
  - { id: ERR_FK_NOT_FOUND, http: 422, condition: "Body-referenced foreign key does not resolve" }
  - { id: ERR_STALE_AGREEMENT_VERSION, http: 412, condition: "expected_supply_agreement_version != agreement.version at booking" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition not declared from the resource's current state (incl. terminal states)" }
  - { id: ERR_AGREEMENT_NOT_ACTIVE, http: 409, condition: "Booking or dispatch while agreement is DRAFT/SUSPENDED/TERMINATED" }
  - { id: ERR_COMMITMENT_NOT_ACTIVE, http: 409, condition: "Booking or dispatch while commitment is DRAFT/SUSPENDED/TERMINATED" }
  - { id: ERR_REUSE_NOT_ELIGIBLE, http: 422, condition: "Dispatch without an APPROVED eligibility determination covering the destination state on the current logical date" }
  - { id: ERR_PERMIT_REQUIRED, http: 422, condition: "Dispatch without an ACTIVE, unexpired state permit for (destination_state, material_type)" }
  - { id: ERR_OUTSIDE_AGREEMENT_TERM, http: 422, condition: "pickup_date (booking) or current date (dispatch) outside [term_start, term_end]" }
  - { id: ERR_ELIGIBILITY_WINDOW_OVERLAP, http: 409, condition: "Half-open validity window overlaps a peer determination for the same (stream_id, state_code)" }
  - { id: ERR_ELIGIBILITY_WINDOW_PAST, http: 422, condition: "Approve/reinstate when valid_until is not after the current logical date" }
  - { id: ERR_RESERVATION_WINDOW_INVALID, http: 422, condition: "end_date <= start_date at creation, or check-in outside [start_date, end_date)" }
  - { id: ERR_DUPLICATE_PERMIT, http: 409, condition: "A permit with status FILED or ACTIVE already exists for (state_code, material_type)" }
  - { id: ERR_MATERIAL_NOT_ACCEPTED, http: 422, condition: "Facility does not accept the stream's material_type" }
  - { id: ERR_STORAGE_CAPACITY_EXCEEDED, http: 422, condition: "Per-day aggregate of overlapping reservation tons would exceed facility.capacity_tons" }
  - { id: ERR_QUALITY_OUT_OF_SPEC, http: 422, condition: "Accept with destination_moisture_pct > max_moisture_pct + 2.0 or destination_arsenic_ppm > max_arsenic_ppm" }
  - { id: ERR_STREAM_NOT_CHARACTERIZED, http: 422, condition: "Stream lacks a VERIFIED characterization (filing) or is not CHARACTERIZED/ACTIVE (activation)" }
  - { id: ERR_DESTINATION_NOT_SERVED, http: 422, condition: "destination_state_code not in offtaker.receiving_state_codes" }
  - { id: ERR_STREAM_MISMATCH, http: 422, condition: "agreement.stream_id != commitment.stream_id at booking" }
  - { id: ERR_COMMITMENT_EXCEEDED, http: 422, condition: "Booking would push agreement booked or commitment accepted month-to-date over committed_monthly_tons" }
  - { id: ERR_PRICE_INDEX_GAP, http: 422, condition: "No MarketPriceIndex entry effective for (material_type, destination_state_code) on pickup_date" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Generator
    description: "Byproduct-generating plant; owns streams, characterizations, supply agreements, and its shipments"
    identity: "entity_backed:Generator"
    exclusive_operations:
      - "POST /api/streams"
      - "POST /api/streams/{id}/characterizations"
      - "POST /api/supply-agreements"
      - "POST /api/shipments"
      - "POST /api/shipments/{id}/dispatch"
      - "POST /api/shipments/{id}/recondition"
      - "POST /api/shipments/{id}/redeliver"
      - "POST /api/shipments/{id}/dispose"
      - "POST /api/shipments/{id}/cancel"
    shared_operations: ["all GET endpoints"]
  - name: Offtaker
    description: "Beneficial-reuse buyer; owns offtake commitments; receives and quality-gates deliveries"
    identity: "entity_backed:Offtaker"
    exclusive_operations:
      - "POST /api/offtake-commitments"
      - "POST /api/shipments/{id}/deliver"
      - "POST /api/shipments/{id}/accept"
      - "POST /api/shipments/{id}/reject"
    shared_operations: ["all GET endpoints"]
  - name: BrokerOps
    description: "Brokerage operator; runs verification, contracting, freight, storage, pricing, and voids"
    identity: opaque
    exclusive_operations:
      - "POST /api/generators"
      - "POST /api/offtakers"
      - "POST /api/characterizations/{id}/verify"
      - "POST /api/characterizations/{id}/reject"
      - "POST /api/supply-agreements/{id}/activate|suspend|resume|terminate"
      - "POST /api/offtake-commitments/{id}/activate|resume|terminate"
      - "POST /api/shipments/{id}/void"
      - "POST /api/storage-facilities"
      - "POST /api/storage-reservations and check-in/release/cancel"
      - "POST /api/price-index-entries"
    shared_operations: ["all GET endpoints"]
  - name: ComplianceOfficer
    description: "Regulatory affairs officer; files and adjudicates eligibility determinations and state permits; approval must come from a different officer than the filer"
    identity: opaque
    exclusive_operations:
      - "POST /api/streams/{id}/eligibility-determinations"
      - "POST /api/eligibility-determinations/{id}/submit|revise|approve|deny|suspend|reinstate"
      - "POST /api/state-permits"
      - "POST /api/state-permits/{id}/activate|revoke"
    shared_operations: ["all GET endpoints"]
  - name: PlatformAdmin
    description: "Platform operator; controls the logical clock only"
    identity: opaque
    exclusive_operations:
      - "POST /api/_clock/set_current_utc"
    shared_operations: ["all GET endpoints"]
