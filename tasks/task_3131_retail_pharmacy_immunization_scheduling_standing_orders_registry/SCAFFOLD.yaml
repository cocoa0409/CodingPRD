    side_effects: []

  - method: GET
    path: "/immunization/patients"
    description: "List patients"
    roles: [PharmacyTechnician, Pharmacist, ComplianceOfficer]
    code: 200
    input: ["state_code?", "insurance_plan_id?", "limit?", "offset?"]
    output: "Patient[]"
    side_effects: []

  # --- Vaccine Lots ---
  - method: POST
    path: "/immunization/stores/{storeId}/lots"
    description: "Receive a vaccine lot into a store"
    roles: [StoreManager]
    code: 201
    input: [vaccine_product_id, lot_number, expiration_date, doses_received]
    output: VaccineLot
    side_effects: ["doses_available initialized to doses_received; status RELEASED"]

  - method: GET
    path: "/immunization/stores/{storeId}/lots"
    description: "List lots at a store"
    roles: [StoreManager, Pharmacist, PharmacyTechnician, Immunizer, ComplianceOfficer]
    code: 200
    input: ["vaccine_product_id?", "status?", "limit?", "offset?"]
    output: "VaccineLot[]"
    side_effects: []

  - method: GET
    path: "/immunization/lots/{lotId}"
    description: "Get one lot"
    roles: [StoreManager, Pharmacist, PharmacyTechnician, Immunizer, ComplianceOfficer]
    code: 200
    input: []
    output: VaccineLot
    side_effects: []

  - method: GET
    path: "/immunization/lots"
    description: "List lots across stores (filtered)"
    roles: [StoreManager, Pharmacist, PharmacyTechnician, Immunizer, ComplianceOfficer]
    code: 200
    input: ["vaccine_product_id?", "store_id?", "status?", "limit?", "offset?"]
    output: "VaccineLot[]"
    side_effects: []

  - method: POST
    path: "/immunization/lots/{lotId}/temperature-readings"
    description: "Post a refrigerator temperature reading for a lot"
    roles: [StoreManager, PharmacyTechnician]
    code: 201
    input: [recorded_at, temperature_c]
    output: TemperatureReading
    side_effects: ["is_excursion computed; if true → lot auto-QUARANTINED (reason EXCURSION) and excursion severity tier computed"]

  - method: GET
    path: "/immunization/lots/{lotId}/temperature-readings"
    description: "List temperature readings for a lot"
    roles: [StoreManager, Pharmacist, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "TemperatureReading[]"
    side_effects: []

  - method: POST
    path: "/immunization/lots/{lotId}/quarantine"
    description: "Manually quarantine a lot"
    roles: [StoreManager]
    code: 200
    input: []
    output: VaccineLot
    side_effects: ["status → QUARANTINED; quarantine_reason = MANUAL"]

  - method: POST
    path: "/immunization/lots/{lotId}/release"
    description: "Release a quarantined lot after excursion review. excursion_disposition must be RELEASE_OK (keep peak-delta severity tier) or RELEASE_OK_CUMULATIVE (recompute last_excursion_severity_tier via the cumulative_excursion_minutes variant)."
    roles: [StoreManager]
    code: 200
    input: [excursion_disposition]
    output: VaccineLot
    side_effects: ["status → RELEASED; quarantine_reason cleared; if excursion_disposition = RELEASE_OK_CUMULATIVE, last_excursion_severity_tier recomputed by cumulative variant; increments VaccineLot.version by 1"]

  - method: POST
    path: "/immunization/lots/{lotId}/retire"
    description: "Retire a lot (write off remaining doses)"
    roles: [StoreManager]
    code: 200
    input: []
    output: VaccineLot
    side_effects: ["status → RETIRED; doses_available → 0; PLANNED ClinicEvents using this lot auto-cancel"]

  # --- Appointments ---
  - method: POST
    path: "/immunization/appointments"
    description: "Book an appointment (scheduled or walk-in)"
    roles: [PharmacyTechnician, Pharmacist, Patient]
    code: 201
    input: [store_id, patient_id, vaccine_product_id, slot_start, "is_walk_in?"]
    output: ImmunizationAppointment
    side_effects: ["state_protocol_id resolved from (store.state_code, product); dose_number computed; eligibility pre-checks (series, age at slot date, slot overlap for non-walk-ins)"]

  - method: GET
    path: "/immunization/appointments"
    description: "List appointments"
    roles: [StoreManager, Pharmacist, PharmacyTechnician, Immunizer, ComplianceOfficer]
    code: 200
    input: ["store_id?", "patient_id?", "vaccine_product_id?", "state_protocol_id?", "status?", "limit?", "offset?"]
    output: "ImmunizationAppointment[]"
    side_effects: []

  - method: GET
    path: "/immunization/appointments/{appointmentId}"
    description: "Get one appointment"
    roles: [StoreManager, Pharmacist, PharmacyTechnician, Immunizer, ComplianceOfficer, Patient]
    code: 200
    input: []
    output: ImmunizationAppointment
    side_effects: []

  - method: GET
    path: "/immunization/appointments/{appointmentId}/price-quote"
    description: "Provisional price quote (runs adjudicated_charge variant provisional_quote without consuming deductible)"
    roles: [PharmacyTechnician, Pharmacist, Patient]
    code: 200
    input: []
    output: "{ quoted_charge_cents: integer, billing_channel: string }"
    side_effects: []

  - method: POST
    path: "/immunization/appointments/{appointmentId}/check-in"
    description: "Check the patient in at the counter"
    roles: [PharmacyTechnician, Pharmacist]
    code: 200
    input: []
    output: ImmunizationAppointment
    side_effects: ["status → CHECKED_IN; increments ImmunizationAppointment.version by 1"]

  - method: POST
    path: "/immunization/appointments/{appointmentId}/questionnaire"
    description: "Submit the prescreening questionnaire"
    roles: [PharmacyTechnician]
    code: 201
    input: [answers]
    output: PrescreeningQuestionnaire
    side_effects: ["Appointment → SCREENED; contraindication_detected computed"]

  - method: GET
    path: "/immunization/appointments/{appointmentId}/questionnaire"
    description: "Get the questionnaire for an appointment (array of 0 or 1)"
    roles: [Pharmacist, PharmacyTechnician, ComplianceOfficer]
    code: 200
    input: []
    output: "PrescreeningQuestionnaire[]"
    side_effects: []

  - method: POST
    path: "/immunization/appointments/{appointmentId}/review-consent"
    description: "Pharmacist contraindication review and consent capture"
    roles: [Pharmacist]
    code: 200
    input: [expected_appointment_version, outcome]
    output: ImmunizationAppointment
    side_effects: ["outcome=CLEAR → CONSENTED; outcome=REFER_OUT → CANCELLED with questionnaire.review_outcome=REFERRED_OUT; increments ImmunizationAppointment.version by 1"]

  - method: POST
    path: "/immunization/appointments/{appointmentId}/administer"
    description: "Administer the vaccine from a specific lot"
    roles: [Immunizer]
    code: 201
    input: [lot_id, expected_lot_version, "clinic_event_id?"]
    output: ImmunizationRecord
    side_effects: ["Appointment → VACCINATED; lot.doses_available −= 1 and lot version bumped; ImmunizationRecord created with adjudicated_charge; RegistrySubmission created PENDING; ObservationSession created IN_PROGRESS; clinic event doses_administered incremented when attached"]

  - method: POST
    path: "/immunization/appointments/{appointmentId}/cancel"
    description: "Cancel a SCHEDULED or CHECKED_IN appointment"
    roles: [PharmacyTechnician, Pharmacist, Patient]
    code: 200
    input: []
    output: ImmunizationAppointment
    side_effects: ["status → CANCELLED"]

  # --- Immunization Records / Registry ---
  - method: GET
    path: "/immunization/immunization-records/{recordId}"
    description: "Get one immunization record"
    roles: [Pharmacist, Immunizer, ComplianceOfficer, PharmacyTechnician]
    code: 200
    input: []
    output: ImmunizationRecord
    side_effects: []

  - method: GET
    path: "/immunization/immunization-records"
    description: "List immunization records (filtered)"
    roles: [Pharmacist, Immunizer, ComplianceOfficer, PharmacyTechnician]
    code: 200
    input: ["patient_id?", "lot_id?", "status?", "limit?", "offset?"]
    output: "ImmunizationRecord[]"
    side_effects: []

  - method: POST
    path: "/immunization/immunization-records/{recordId}/void"
    description: "Void an administration before its registry submission is transmitted (compensation: restores the lot dose, pulls the submission from the queue, closes any open observation session)"
    roles: [Pharmacist]
    code: 200
    input: [reason]
    output: ImmunizationRecord
    side_effects: ["Record → VOIDED; lot.doses_available += 1 and lot version bumped; PENDING/REJECTED RegistrySubmission removed from queue; IN_PROGRESS ObservationSession auto-completes; clinic event doses_administered decremented when attached"]

  - method: GET
    path: "/immunization/appointments/{appointmentId}/immunization-records"
    description: "List immunization records for an appointment (0 or 1)"
    roles: [Pharmacist, Immunizer, ComplianceOfficer, PharmacyTechnician]
    code: 200
    input: []
    output: "ImmunizationRecord[]"
    side_effects: []

  - method: GET
    path: "/immunization/immunization-records/{recordId}/registry-submissions"
    description: "List registry submissions for a record"
    roles: [ComplianceOfficer, Pharmacist]
    code: 200
    input: []
    output: "RegistrySubmission[]"
    side_effects: []

  - method: GET
    path: "/immunization/registry-submissions/{submissionId}"
    description: "Get one registry submission"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: RegistrySubmission
    side_effects: []

  - method: GET
    path: "/immunization/registry-submissions"
    description: "List registry submissions (compliance audit)"
    roles: [ComplianceOfficer]
    code: 200
    input: ["status?", "is_late?", "payload_format?", "limit?", "offset?"]
    output: "RegistrySubmission[]"
    side_effects: []

  - method: POST
    path: "/immunization/registry-submissions/{submissionId}/submit"
    description: "Transmit a submission to the state registry"
    roles: [ComplianceOfficer]
    code: 200
    input: ["corrected_payload?"]
    output: RegistrySubmission
    side_effects: ["status → SUBMITTED; submitted_at set"]

  - method: POST
    path: "/immunization/registry-submissions/{submissionId}/acknowledge"
    description: "Record registry acknowledgement"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: RegistrySubmission
    side_effects: ["status → ACKNOWLEDGED; acknowledged_at set; is_late computed"]

  - method: POST
    path: "/immunization/registry-submissions/{submissionId}/reject"
    description: "Record registry rejection"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: RegistrySubmission
    side_effects: ["status → REJECTED"]

  # --- Observation ---
  - method: GET
    path: "/immunization/immunization-records/{recordId}/observation-sessions"
    description: "List observation sessions for a record (0 or 1)"
    roles: [ObservationMonitor, Pharmacist, ComplianceOfficer]
    code: 200
    input: []
    output: "ObservationSession[]"
    side_effects: []

  - method: POST
    path: "/immunization/observation-sessions/{sessionId}/complete"
    description: "Complete an observation session (no reaction)"
    roles: [ObservationMonitor]
    code: 200
    input: []
    output: ObservationSession
    side_effects: ["status → COMPLETED; ended_at set"]

  - method: POST
    path: "/immunization/observation-sessions/{sessionId}/escalate"
    description: "Escalate an observation session for an adverse reaction"
    roles: [ObservationMonitor, Pharmacist]
    code: 200
    input: [adverse_reaction, reaction_notes]
    output: ObservationSession
    side_effects: ["status → ESCALATED; adverse-event audit flag written to parent record"]

  # --- Clinic Events ---
  - method: POST
    path: "/immunization/clinic-events"
    description: "Plan an off-site / employer clinic event with mobile inventory checkout"
    roles: [StoreManager]
    code: 201
    input: [store_id, employer_name, event_start, event_end, mobile_lot_id, doses_reserved]
    output: ClinicEvent
    side_effects: []

  - method: GET
    path: "/immunization/stores/{storeId}/clinic-events"
    description: "List clinic events for a store"
    roles: [StoreManager, Pharmacist, ComplianceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ClinicEvent[]"
    side_effects: []

  - method: GET
    path: "/immunization/clinic-events/{eventId}"
    description: "Get one clinic event"
    roles: [StoreManager, Pharmacist, ComplianceOfficer]
    code: 200
    input: []
    output: ClinicEvent
    side_effects: []

  - method: GET
    path: "/immunization/clinic-events"
    description: "List clinic events (filtered)"
    roles: [StoreManager, Pharmacist, ComplianceOfficer]
    code: 200
    input: ["store_id?", "mobile_lot_id?", "status?", "limit?", "offset?"]
    output: "ClinicEvent[]"
    side_effects: []

  - method: POST
    path: "/immunization/clinic-events/{eventId}/cancel"
    description: "Cancel a PLANNED clinic event"
    roles: [StoreManager]
    code: 200
    input: []
    output: ClinicEvent
    side_effects: []

  - method: POST
    path: "/immunization/clinic-events/{eventId}/close"
    description: "Close an ACTIVE clinic event and reconcile mobile inventory"
    roles: [StoreManager]
    code: 200
    input: []
    output: ClinicEvent
    side_effects: ["status → CLOSED; unused reserved doses returned to mobile lot"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role unrecognized" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-segment resource id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required request field missing or malformed (bad enum, bad date, end<=start)" }
  - { id: ERR_STALE_LOT_VERSION, http: 412, condition: "expected_lot_version does not match VaccineLot.version at administer" }
  - { id: ERR_STALE_APPOINTMENT_VERSION, http: 412, condition: "expected_appointment_version does not match ImmunizationAppointment.version at review-consent" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic state precondition failure on an action endpoint" }
  - { id: ERR_STORE_SUSPENDED, http: 409, condition: "Store is SUSPENDED; booking/check-in/administration blocked" }
  - { id: ERR_APPOINTMENT_NOT_SCHEDULED, http: 409, condition: "Check-in attempted on a non-SCHEDULED appointment" }
  - { id: ERR_APPOINTMENT_NOT_CHECKED_IN, http: 409, condition: "Questionnaire submitted for a non-CHECKED_IN appointment" }
  - { id: ERR_APPOINTMENT_NOT_SCREENED, http: 409, condition: "Review-consent attempted on a non-SCREENED appointment" }
  - { id: ERR_APPOINTMENT_NOT_CONSENTED, http: 409, condition: "Administer attempted on a non-CONSENTED appointment" }
  - { id: ERR_APPOINTMENT_NOT_CANCELLABLE, http: 409, condition: "Cancel attempted on an appointment past CHECKED_IN or terminal" }
  - { id: ERR_CHECKIN_WINDOW_MISSED, http: 409, condition: "Non-walk-in check-in outside [slot_start − 30min, slot_start + 60min]" }
  - { id: ERR_SLOT_CONFLICT, http: 409, condition: "Non-walk-in slot overlaps an existing SCHEDULED/CHECKED_IN appointment's 15-minute half-open interval at the store" }
  - { id: ERR_QUESTIONNAIRE_ALREADY_EXISTS, http: 409, condition: "Second questionnaire submitted for the same appointment" }
  - { id: ERR_CONTRAINDICATION_DETECTED, http: 422, condition: "Questionnaire contraindication flag true at review-consent CLEAR" }
  - { id: ERR_PROTOCOL_NOT_ACTIVE, http: 409, condition: "Governing StateProtocol is RETIRED (or authority_type PRESCRIPTION_REQUIRED for a walk-in)" }
  - { id: ERR_PATIENT_UNDER_MIN_AGE, http: 422, condition: "Patient age at slot date < max(protocol.min_patient_age_years, product.min_patient_age_years)" }
  - { id: ERR_DAILY_DOSE_LIMIT_REACHED, http: 422, condition: "Patient already at protocol.max_doses_per_patient_per_day VACCINATED records at this store today" }
  - { id: ERR_SERIES_ALREADY_COMPLETE, http: 422, condition: "Patient already completed the product's dose series" }
  - { id: ERR_MIN_INTERVAL_NOT_MET, http: 422, condition: "Prior dose administered fewer than product.min_interval_days before slot_start" }
  - { id: ERR_NO_ELIGIBLE_LOT, http: 409, condition: "No RELEASED, unexpired lot with doses_available > 0 for the product at this store (and no active clinic event with reserved doses)" }
  - { id: ERR_LOT_NOT_ADMINISTERABLE, http: 409, condition: "Target lot is QUARANTINED/RETIRED, expired, or product-mismatched" }
  - { id: ERR_LOT_DEPLETED, http: 409, condition: "Target lot doses_available == 0" }
  - { id: ERR_LOT_PRODUCT_MISMATCH, http: 409, condition: "Lot's vaccine_product_id != appointment's vaccine_product_id" }
  - { id: ERR_LOT_NOT_RELEASED, http: 409, condition: "Quarantine attempted on a non-RELEASED lot" }
  - { id: ERR_LOT_NOT_QUARANTINED, http: 409, condition: "Release attempted on a non-QUARANTINED lot" }
  - { id: ERR_LOT_NOT_RETIRABLE, http: 409, condition: "Retire attempted on a RETIRED lot" }
  - { id: ERR_EXCURSION_DISPOSITION_REQUIRED, http: 400, condition: "Release of a quarantined lot without excursion_disposition in {RELEASE_OK, RELEASE_OK_CUMULATIVE}" }
  - { id: ERR_SEGREGATION_OF_DUTIES_VIOLATION, http: 409, condition: "Same X-User-ID performed consecutive segregated steps on one appointment (check-in → review, or review → administer)" }
  - { id: ERR_OBSERVATION_TOO_EARLY, http: 409, condition: "Complete attempted before started_at + required_minutes" }
  - { id: ERR_REACTION_MUST_ESCALATE, http: 409, condition: "Complete attempted on a session with adverse_reaction = true" }
  - { id: ERR_REACTION_NOTES_REQUIRED, http: 400, condition: "Escalate with adverse_reaction true but empty reaction_notes" }
  - { id: ERR_NOT_ASSIGNED_OBSERVER, http: 403, condition: "Observation session's observer_id != caller X-User-ID" }
  - { id: ERR_SESSION_NOT_IN_PROGRESS, http: 409, condition: "Complete/escalate attempted on a terminal ObservationSession" }
  - { id: ERR_SUBMISSION_NOT_SUBMITTABLE, http: 409, condition: "Submit attempted on a submission not in PENDING/REJECTED/LATE_UNRESOLVED" }
  - { id: ERR_SUBMISSION_NOT_SUBMITTED, http: 409, condition: "Acknowledge/reject attempted on a non-SUBMITTED submission" }
  - { id: ERR_CORRECTED_PAYLOAD_REQUIRED, http: 400, condition: "Re-submit of a REJECTED submission without corrected_payload" }
  - { id: ERR_RECORD_VOIDED, http: 409, condition: "Registry submit attempted against a VOIDED ImmunizationRecord" }
  - { id: ERR_EVENT_NOT_CANCELLABLE, http: 409, condition: "Cancel attempted on a non-PLANNED clinic event" }
  - { id: ERR_EVENT_NOT_ACTIVE, http: 409, condition: "Close attempted on a non-ACTIVE clinic event" }
  - { id: ERR_EVENT_STILL_RUNNING, http: 409, condition: "Close attempted before event_end, or event window malformed at creation" }
  - { id: ERR_INSUFFICIENT_DOSES, http: 422, condition: "Clinic event doses_reserved > mobile lot doses_available" }
  - { id: ERR_RECONCILIATION_OVERFLOW, http: 422, condition: "Clinic close with doses_administered > doses_reserved" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: StoreManager
    description: "Store operator; manages store profile, lots, excursions, clinic events"
    identity: "opaque"
    exclusive_operations:
      - "POST /immunization/stores"
      - "PUT /immunization/stores/{storeId}"
      - "POST /immunization/stores/{storeId}/lots"
      - "POST /immunization/lots/{lotId}/quarantine"
      - "POST /immunization/lots/{lotId}/release"
      - "POST /immunization/lots/{lotId}/retire"
      - "POST /immunization/clinic-events"
      - "POST /immunization/clinic-events/{eventId}/cancel"
      - "POST /immunization/clinic-events/{eventId}/close"
    shared_operations:
      - "GET endpoints for stores, lots, appointments, clinic events"
      - "POST /immunization/lots/{lotId}/temperature-readings"
      - "POST /immunization/_clock/set_current_utc"

  - name: Pharmacist
    description: "Licensed pharmacist; performs contraindication review and consent capture under state protocol authority"
    identity: "opaque"
    exclusive_operations:
      - "POST /immunization/appointments/{appointmentId}/review-consent"
    shared_operations:
      - "POST /immunization/appointments (booking)"
      - "POST /immunization/appointments/{appointmentId}/check-in"
      - "POST /immunization/appointments/{appointmentId}/cancel"
      - "POST /immunization/patients"
      - "POST /immunization/observation-sessions/{sessionId}/escalate"
      - "GET endpoints"

  - name: PharmacyTechnician
    description: "Counter staff; books appointments, checks patients in, administers questionnaires"
    identity: "opaque"
    exclusive_operations:
      - "POST /immunization/appointments/{appointmentId}/questionnaire"
    shared_operations:
      - "POST /immunization/appointments"
      - "POST /immunization/appointments/{appointmentId}/check-in"
      - "POST /immunization/appointments/{appointmentId}/cancel"
      - "POST /immunization/patients"
      - "POST /immunization/lots/{lotId}/temperature-readings"
      - "GET endpoints"

  - name: Immunizer
    description: "Certified immunizing staff (may be a pharmacist or technician with certification, modeled as a distinct role for segregation of duties); administers doses"
    identity: "opaque"
    exclusive_operations:
      - "POST /immunization/appointments/{appointmentId}/administer"
    shared_operations:
      - "GET endpoints"

  - name: ObservationMonitor
    description: "Staff member assigned to staff a post-vaccination observation session"
    identity: "opaque"
    exclusive_operations:
      - "POST /immunization/observation-sessions/{sessionId}/complete"
    shared_operations:
      - "POST /immunization/observation-sessions/{sessionId}/escalate"
      - "GET endpoints"

  - name: ComplianceOfficer
    description: "Regulatory/compliance operator; manages protocols, products, insurance plans, and registry submissions"
    identity: "opaque"
    exclusive_operations:
      - "POST /immunization/state-protocols"
      - "PUT /immunization/state-protocols/{protocolId}"
      - "POST /immunization/vaccine-products"
      - "POST /immunization/insurance-plans"
      - "POST /immunization/registry-submissions/{submissionId}/submit"
      - "POST /immunization/registry-submissions/{submissionId}/acknowledge"
      - "POST /immunization/registry-submissions/{submissionId}/reject"
    shared_operations:
      - "GET endpoints"
      - "POST /immunization/_clock/set_current_utc"

  - name: Patient
    description: "The patient; may book and cancel own appointments and view own price quote"
    identity: "entity_backed:Patient"
    exclusive_operations: []
    shared_operations:
      - "POST /immunization/appointments (self-booking only: patient_id must equal X-User-ID)"
      - "POST /immunization/appointments/{appointmentId}/cancel (own appointments only)"
      - "GET /immunization/appointments/{appointmentId}"
      - "GET /immunization/appointments/{appointmentId}/price-quote"
