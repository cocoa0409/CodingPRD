        claim_type: violation_to_error
        grounds:
          - "state_machines.ApplicatorQualification.transitions.SUSPENDED_to_CERTIFIED"
          - "errors[ERR_REINSTATE_LIMIT_EXCEEDED]"
        distinguishing_aspect: "After three suspend/reinstate cycles (suspension_count reaches 3), a fourth reinstate attempt is rejected 409 ERR_REINSTATE_LIMIT_EXCEEDED — the suspension_count precondition gate is triggerable."
        test_recipe:
          setup:
            - "applicator CERTIFIED via a program with min_quality_history_score 0 (so score never blocks reinstate) and streak 0, no training/audit"
            - "suspend + reinstate three times so suspension_count == 3, leaving the qualification CERTIFIED; then suspend a fourth time to reach SUSPENDED with suspension_count == 3"
