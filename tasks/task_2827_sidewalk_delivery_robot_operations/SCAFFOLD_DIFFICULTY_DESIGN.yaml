      - name: hard_closure_closed_interval_no_buffer
        grounds:
          - "validations[priority=85]"
          - "entities.SegmentClosure.fields.starts_at_utc"
          - "entities.SegmentClosure.fields.closure_kind"
          - "state_machines.SegmentClosure.SCHEDULED_to_ACTIVE"
        distinguishing_aspect: >-
          The contended resource is a SidewalkSegment and its interval semantics are the opposite of the
          bay's: the closure window is fully closed [starts_at_utc, ends_at_utc] with no buffer and the
          exclusion is scoped to closure_kind == HARD, so a HARD closure starting at the exact instant an
          existing HARD closure ends conflicts (409 ERR_HARD_CLOSURE_OVERLAP), one starting one minute
          later is accepted, and an ADVISORY closure over the identical contested window never conflicts.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T09:00:00.000Z"
            - "ServiceZone Z1 PERMITTED with segment S1 APPROVED"
            - "SegmentClosure CL1 on S1, closure_kind HARD, cause CONSTRUCTION, closed interval 2026-08-03T08:00:00.000Z..2026-08-03T10:00:00.000Z, state SCHEDULED"
            - "no other closure exists on S1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /service-zones"
              payload: { name: "Mission District", municipality_code: "SF", ordinance_min_clearance_cm: 90.0, ordinance_max_speed_cm_s: 160, operating_window_start_utc_hhmm: "0700", operating_window_end_utc_hhmm: "2100", max_concurrent_robots: 2, planning_haul_m: 800.0, planning_crossings: 2, remedy_budget_cents: 50000 }
              as: PlatformAdmin
              captures: { z: $.data.id }
            - call: "POST /sidewalk-segments"
              payload: { zone_id: "${z}", segment_code: "S1", segment_type: "WALKWAY", length_m: 320.0, measured_clearance_cm: 118.0, surface_grade_pct: 3.0, sightline_m: 40.0, pedestrian_flow_per_min: 6.0, curb_ramp_present: true }
              as: PlatformAdmin
              captures: { s1: $.data.id }
            - call: "POST /sidewalk-segments/${s1}/transitions"
              payload: { action: "SURVEY" }
              as: PlatformAdmin
            - call: "POST /sidewalk-segments/${s1}/transitions"
              payload: { action: "APPROVE" }
              as: PlatformAdmin
            - call: "POST /service-zones/${z}/permit-transitions"
              payload: { action: "ACTIVATE_PERMIT" }
              as: PlatformAdmin
            - call: "POST /segment-closures"
              payload: { segment_id: "${s1}", closure_kind: "HARD", cause: "CONSTRUCTION", starts_at_utc: "2026-08-03T08:00:00.000Z", ends_at_utc: "2026-08-03T10:00:00.000Z" }
              as: PlatformAdmin
              captures: { cl1: $.data.id }
          trigger:
            - call: "POST /segment-closures"
              payload: { segment_id: "${s1}", closure_kind: "HARD", cause: "EVENT", starts_at_utc: "2026-08-03T10:00:00.000Z", ends_at_utc: "2026-08-03T11:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /segment-closures"
              payload: { segment_id: "${s1}", closure_kind: "ADVISORY", cause: "EVENT", starts_at_utc: "2026-08-03T10:00:00.000Z", ends_at_utc: "2026-08-03T11:00:00.000Z" }
              as: PlatformAdmin
              captures: { cl_adv: $.data.id }
            - call: "POST /segment-closures"
              payload: { segment_id: "${s1}", closure_kind: "HARD", cause: "EVENT", starts_at_utc: "2026-08-03T10:01:00.000Z", ends_at_utc: "2026-08-03T11:00:00.000Z" }
              as: PlatformAdmin
              captures: { cl3: $.data.id }
          assert:
            - "the HARD closure starting exactly at 10:00:00.000Z returns 409 with error_id ERR_HARD_CLOSURE_OVERLAP"
            - "the ADVISORY closure over the same 10:00..11:00 window returns 201 and SegmentClosure.${cl_adv}.state == SCHEDULED"
            - "the HARD closure starting at 10:01:00.000Z returns 201 and SegmentClosure.${cl3}.state == SCHEDULED"
            - "GET /segment-closures?segment_id=${s1}&closure_kind=HARD returns exactly 2 rows"
            - "SidewalkSegment.${s1}.status == APPROVED because no closure has been activated yet"
  - rule_id: compensating_invariant
    instances:
      - name: bay_minutes_ledger_restored_by_cancel
        grounds:
          - "calculations.bay_minutes_ledger"
          - "state_machines.BayReservation.HELD_to_CANCELLED"
          - "entities.DepotBay.fields.committed_minutes"
          - "entities.ServiceZone.fields.reserved_bay_minutes"
        distinguishing_aspect: >-
          The conserved quantity is bay capacity in whole minutes: every create adds exactly
          window_minutes to both DepotBay.committed_minutes and ServiceZone.reserved_bay_minutes and every
          CANCEL subtracts exactly the same window_minutes, so the ledger walks 0 -> 60 -> 105 -> 60 -> 0
          and returns to its pre-create value with no drift even though the two windows have different
          lengths.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T09:00:00.000Z"
            - "ServiceZone Z1 PERMITTED, Robot R1 AVAILABLE, DepotBay B1 bay_type CHARGE state OPEN"
            - "BayReservation X for [10:00, 11:00) with window_minutes 60, state HELD"
            - "BayReservation Y for [11:15, 12:00) with window_minutes 45, state HELD"
            - "at this point DepotBay.committed_minutes == 105 and ServiceZone.reserved_bay_minutes == 105"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /service-zones"
              payload: { name: "Mission District", municipality_code: "SF", ordinance_min_clearance_cm: 90.0, ordinance_max_speed_cm_s: 160, operating_window_start_utc_hhmm: "0700", operating_window_end_utc_hhmm: "2100", max_concurrent_robots: 2, planning_haul_m: 800.0, planning_crossings: 2, remedy_budget_cents: 50000 }
              as: PlatformAdmin
              captures: { z: $.data.id }
            - call: "POST /sidewalk-segments"
              payload: { zone_id: "${z}", segment_code: "S1", segment_type: "WALKWAY", length_m: 320.0, measured_clearance_cm: 118.0, surface_grade_pct: 3.0, sightline_m: 40.0, pedestrian_flow_per_min: 6.0, curb_ramp_present: true }
              as: PlatformAdmin
              captures: { s1: $.data.id }
            - call: "POST /sidewalk-segments/${s1}/transitions"
              payload: { action: "SURVEY" }
              as: PlatformAdmin
            - call: "POST /sidewalk-segments/${s1}/transitions"
              payload: { action: "APPROVE" }
              as: PlatformAdmin
            - call: "POST /service-zones/${z}/permit-transitions"
              payload: { action: "ACTIVATE_PERMIT" }
              as: PlatformAdmin
            - call: "POST /robots"
              payload: { zone_id: "${z}", asset_tag: "RBT-001", width_cm: 78.0, container_capacity_liters: 60.0, max_speed_cm_s: 150 }
              as: PlatformAdmin
              captures: { r: $.data.id }
            - call: "POST /robots/${r}/duty-transitions"
              payload: { action: "STAGE" }
              as: FleetDispatcher
            - call: "POST /robots/${r}/duty-transitions"
              payload: { action: "MAKE_AVAILABLE" }
              as: FleetDispatcher
            - call: "POST /depot-bays"
              payload: { zone_id: "${z}", bay_code: "B1", bay_type: "CHARGE", power_kw: 22.0, state: "OPEN" }
              as: PlatformAdmin
              captures: { b: $.data.id, b_v: $.data.version }
            - call: "POST /bay-reservations"
              payload: { bay_id: "${b}", robot_id: "${r}", reservation_type: "CHARGE", window_start_utc: "2026-08-03T10:00:00.000Z", window_end_utc: "2026-08-03T11:00:00.000Z", expected_depot_bay_version: "${b_v}" }
              as: FleetDispatcher
              captures: { resx: $.data.id }
            - call: "GET /depot-bays/${b}"
              as: FleetDispatcher
              captures: { b_v2: $.data.version }
            - call: "POST /bay-reservations"
              payload: { bay_id: "${b}", robot_id: "${r}", reservation_type: "CHARGE", window_start_utc: "2026-08-03T11:15:00.000Z", window_end_utc: "2026-08-03T12:00:00.000Z", expected_depot_bay_version: "${b_v2}" }
              as: FleetDispatcher
              captures: { resy: $.data.id }
          trigger:
            - call: "POST /bay-reservations/${resy}/transitions"
              payload: { action: "CANCEL" }
              as: FleetDispatcher
            - call: "POST /bay-reservations/${resx}/transitions"
              payload: { action: "CANCEL" }
              as: FleetDispatcher
          assert:
            - "after cancelling Y: BayReservation.${resy}.state == CANCELLED, DepotBay.${b}.committed_minutes == 60 and ServiceZone.${z}.reserved_bay_minutes == 60"
            - "after cancelling X: BayReservation.${resx}.state == CANCELLED, DepotBay.${b}.committed_minutes == 0 and ServiceZone.${z}.reserved_bay_minutes == 0"
            - "BayReservation.${resx}.window_minutes == 60 and BayReservation.${resy}.window_minutes == 45 are unchanged by the cancellations"
            - "GET /bay-reservations?bay_id=${b}&state=HELD returns 0 rows"
            - "DepotBay.${b}.committed_minutes equals the sum of window_minutes over that bay's HELD or ACTIVE reservations, which is 0"
      - name: merchant_fee_buckets_conserved_across_cancel
        grounds:
          - "calculations.merchant_fee_ledger"
          - "state_machines.DeliveryOrder.RECEIVED_to_CANCELLED"
          - "state_machines.DeliveryOrder.IN_TRANSIT_to_DELIVERED"
          - "entities.Merchant.fields.escrowed_fee_cents"
          - "entities.Merchant.fields.released_fee_cents"
          - "entities.Merchant.fields.recognized_fee_cents"
        distinguishing_aspect: >-
          The conserved quantity is money in integer cents, not capacity: escrowed_fee_cents +
          recognized_fee_cents + released_fee_cents always equals the sum of quoted_fee_cents over every
          order the merchant ever created (850 + 812 == 1662), so a cancel moves 812 from escrowed to
          released and a delivery moves 850 from escrowed to recognized while the total never changes and
          settlement_variance_cents absorbs the -33 quote-to-settlement difference outside the invariant.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T09:00:00.000Z"
            - "ServiceZone Z1 PERMITTED with planning_haul_m 800.0 and planning_crossings 2"
            - "Merchant M1 ACTIVE PREFERRED; order O1 22.0 L urgent quoted at 850 and order O_LARGE 40.0 L non-urgent quoted at 812"
            - "both orders are RECEIVED, so escrowed_fee_cents == 1662, recognized_fee_cents == 0 and released_fee_cents == 0"
            - "Robot R1 AVAILABLE for the delivery leg of the trigger"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /service-zones"
              payload: { name: "Mission District", municipality_code: "SF", ordinance_min_clearance_cm: 90.0, ordinance_max_speed_cm_s: 160, operating_window_start_utc_hhmm: "0700", operating_window_end_utc_hhmm: "2100", max_concurrent_robots: 2, planning_haul_m: 800.0, planning_crossings: 2, remedy_budget_cents: 50000 }
              as: PlatformAdmin
              captures: { z: $.data.id }
            - call: "POST /sidewalk-segments"
              payload: { zone_id: "${z}", segment_code: "S1", segment_type: "WALKWAY", length_m: 320.0, measured_clearance_cm: 118.0, surface_grade_pct: 3.0, sightline_m: 40.0, pedestrian_flow_per_min: 6.0, curb_ramp_present: true }
              as: PlatformAdmin
              captures: { s1: $.data.id }
            - call: "POST /sidewalk-segments/${s1}/transitions"
              payload: { action: "SURVEY" }
              as: PlatformAdmin
            - call: "POST /sidewalk-segments/${s1}/transitions"
              payload: { action: "APPROVE" }
              as: PlatformAdmin
            - call: "POST /sidewalk-segments"
              payload: { zone_id: "${z}", segment_code: "S2", segment_type: "CROSSING", crossing_control: "SIGNALIZED", length_m: 14.0, measured_clearance_cm: 150.0, surface_grade_pct: 1.5, sightline_m: 35.0, pedestrian_flow_per_min: 10.0, curb_ramp_present: true, connected_segment_ids: ["${s1}"] }
              as: PlatformAdmin
              captures: { s2: $.data.id }
            - call: "POST /sidewalk-segments/${s2}/transitions"
              payload: { action: "SURVEY" }
              as: PlatformAdmin
            - call: "POST /sidewalk-segments/${s2}/transitions"
              payload: { action: "APPROVE" }
              as: PlatformAdmin
            - call: "POST /sidewalk-segments"
              payload: { zone_id: "${z}", segment_code: "S3", segment_type: "WALKWAY", length_m: 260.0, measured_clearance_cm: 104.0, surface_grade_pct: 4.0, sightline_m: 25.0, pedestrian_flow_per_min: 12.0, curb_ramp_present: false, connected_segment_ids: ["${s2}"] }
              as: PlatformAdmin
              captures: { s3: $.data.id }
            - call: "POST /sidewalk-segments/${s3}/transitions"
              payload: { action: "SURVEY" }
              as: PlatformAdmin
            - call: "POST /sidewalk-segments/${s3}/transitions"
              payload: { action: "APPROVE" }
              as: PlatformAdmin
            - call: "POST /sidewalk-segments"
              payload: { zone_id: "${z}", segment_code: "S5", segment_type: "WALKWAY", length_m: 180.0, measured_clearance_cm: 92.0, surface_grade_pct: 6.5, sightline_m: 30.0, pedestrian_flow_per_min: 5.0, curb_ramp_present: true, connected_segment_ids: ["${s3}"] }
              as: PlatformAdmin
              captures: { s5: $.data.id }
            - call: "POST /sidewalk-segments/${s5}/transitions"
              payload: { action: "SURVEY" }
              as: PlatformAdmin
            - call: "POST /sidewalk-segments/${s5}/transitions"
              payload: { action: "APPROVE" }
              as: PlatformAdmin
            - call: "POST /service-zones/${z}/permit-transitions"
              payload: { action: "ACTIVATE_PERMIT" }
              as: PlatformAdmin
            - call: "POST /merchants"
