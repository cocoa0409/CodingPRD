          - call: "POST /direct-selling/income-disclosure-statements"
            payload: { commission_run_id: "${run_id}", population_basis: "ALL_ENROLLED", expected_commission_run_version: "${run_ver_paid}" }
            as: CommissionAnalyst
            as_user_id: "ANALYST-1"
            captures: { e_stale: "$.data.error_id" }
          - call: "GET /direct-selling/commission-runs/${run_id}"
            as: CommissionAnalyst
            as_user_id: "ANALYST-1"
            captures: { r_ver_now: "$.data.version", r_status: "$.data.status" }
          - call: "POST /direct-selling/income-disclosure-statements"
            payload: { commission_run_id: "${run_id}", population_basis: "ALL_ENROLLED", expected_commission_run_version: "${r_ver_now}" }
            as: CommissionAnalyst
            as_user_id: "ANALYST-1"
            captures: { d2_id: "$.data.id", d2_n: "$.data.population_count" }
          assert:
            - "the first draft succeeds with d1_n == 1"
            - "e_stale == ERR_STALE_RUN_VERSION with HTTP 412 for the identical second request, because creating a disclosure increments the run's version as a side effect"
            - "r_ver_now == the version after that increment and r_status is still PAID: the OCC token moved even though nothing about the run's state or money changed"
            - "the retry with the refreshed token succeeds, d2_id differs from d1_id and d2_n == 1: two coexisting DRAFT disclosures of the same run are legal, and only publication supersedes"
            - "this is the deliberate reason two analysts cannot blind-draft the same disclosure concurrently: the loser is told to re-read"

