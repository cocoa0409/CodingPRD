              payload: { program_id: "${prog_id}", from_store_id: "${s1_id}", to_store_id: "${s3_id}", item_id: "${item_id}", units: 999, expected_from_position_version: "${p1_v1}" }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { ex8: $.data.error_id }
            - call: "GET /allocation/store-positions/${p1_id}"
              payload: {}
              as: Allocator
              captures: { p1_v2: $.data.version }
            - call: "POST /allocation/transfer-recommendations"
              payload: { program_id: "${prog_id}", from_store_id: "${s1_id}", to_store_id: "${s1_id}", item_id: "${item_id}", units: 999, expected_from_position_version: "${p1_v2}" }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { ex9: $.data.error_id }
            - call: "POST /allocation/transfer-recommendations"
              payload: { program_id: "${prog_id}", from_store_id: "${s1_id}", to_store_id: "${s3_id}", item_id: "${item_id}", units: 999, expected_from_position_version: "${p1_v2}" }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { ex10: $.data.error_id }
            - call: "POST /allocation/transfer-recommendations"
              payload: { program_id: "${prog_id}", from_store_id: "${s1_id}", to_store_id: "${s4_id}", item_id: "${item_id}", units: 999, expected_from_position_version: "${p1_v2}" }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { ex11: $.data.error_id }
            - call: "POST /allocation/transfer-recommendations"
              payload: { program_id: "${prog_id}", from_store_id: "${s1_id}", to_store_id: "${s2_id}", item_id: "${item_id}", units: 999, expected_from_position_version: "${p1_v2}" }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { ex12: $.data.error_id }
            - call: "POST /allocation/transfer-recommendations"
              payload: { program_id: "${prog_id}", from_store_id: "${s1_id}", to_store_id: "${s2_id}", item_id: "${item_id}", units: 6, expected_from_position_version: "${p1_v2}" }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { t1_id: $.data.id }
          assert:
            - "Rung 1: the call with NO auth headers returns 401 ERR_UNAUTHENTICATED even though its role would also be wrong, its units are 0, both store ids are unknown and the two stores are identical"
            - "Rung 2: the identical body sent as StoreOperator returns 403 ERR_FORBIDDEN_ROLE - the role gate reads only X-User-Role and never looks at the body"
            - "Rung 4: the identical body sent as Allocator returns 400 ERR_INVALID_REQUEST for units = 0 (declared range is >= 1), NOT 404 for the two unknown stores - shape precedes existence"
            - "Rung 6a: with units repaired to 6 the same call returns 404 ERR_STORE_NOT_FOUND, keyed on from_store_id because body FKs are validated left to right in declaration order"
            - "Rung 6b: with real stores but a fabricated item_id the call returns 404 ERR_ITEM_NOT_FOUND"
            - "Rung 7: with from_store_id = store 0201 of the OTHER program the call returns 422 ERR_CROSS_PROGRAM_REFERENCE - the row exists, so rung 6 is satisfied and rung 7 is reached"
            - "Rung 9: while the program is LOCKED a body that is also same-store and over-donated returns 409 ERR_PROGRAM_LOCKED - the parent state check outranks both business rules"
            - "Rung 11: after unlocking and bumping the donor position with a PATCH, the pre-PATCH version ${p1_v1} returns 412 ERR_STALE_POSITION_VERSION, even though units 999 exceeds the donor and store 0103 is CLOSING"
            - "Rung 21: with the fresh version ${p1_v2} and from_store_id == to_store_id the call returns 422 ERR_SAME_STORE_TRANSFER, not the donor-sufficiency 409 that units 999 also earns"
            - "Rung 26: two distinct stores with the CLOSING store 0103 as receiver returns 409 ERR_STORE_NOT_ELIGIBLE, still ahead of the donor-sufficiency failure"
            - "Rung 29: an ACTIVE receiver 0104 whose position is COMPLETE returns 422 ERR_TRANSFER_SIZE_INFEASIBLE - no CORE size is out at the receiver, so the split has no candidate, and this is checked before the units are compared to the donor"
            - "Rung 33: receiver 0102 (core S and XL out) with units 999 finally returns 409 ERR_INSUFFICIENT_DONOR_UNITS because the donor holds only 20"
            - "Repairing the last rung succeeds: units 6 creates a PROPOSED recommendation with size_split == [{S:4},{XL:2}], landed_cost_usd == 51.63 (freight max(45.00, 41.00 + 6 x 0.85) = 46.10 at 1200bp), benefit_usd == 69.86 and benefit_ratio_bp == 13531"
            - "The create is NOT gated on benefit_ratio_bp: 13531 is below the program default transfer_min_ratio_bp of 15000, yet the recommendation is created - that gate lives on approve, at rung 34"
            - "No side effect leaked from any rejected call: StorePosition.${p1_id}.reserved_out_units == 0 until the successful create and the program ledger is untouched"
      - name: freight_worthiness_gate_applies_to_rebalance_and_skips_consolidation
        claim_type: conditional_validation
        grounds:
          - validations[priority:34]
          - calculations.transfer_benefit_ratio_bp
          - errors.ERR_BENEFIT_RATIO_BELOW_THRESHOLD
          - entities.TransferRecommendation.fields.source_reason
        distinguishing_aspect: |
          The freight-worthiness gate is conditional on source_reason, and the only way to prove it is a
          conditional rather than a threshold is to make the EXEMPT transfer the uneconomic one. The
          system-created consolidation moves 4 units at a ratio of 9240 - less than half the program's
          20000bp bar - and is approved; the operator-created rebalance moves 6 units at 15536, nearly
          seventy percent better, and is refused. Both share the same landed cost of 50.40, so the contrast
          cannot be explained by cost. The two transfers also differ in who proposed them (system versus
          u-alloc-1) without either tripping segregation of duties, and the rejected approve must leave the
          recommendation PROPOSED with its frozen economics intact.
        test_recipe:
          setup:
            - "Program FA26 ACTIVE with transfer_min_ratio_bp explicitly set to 20000 (the default 15000 would be too lenient to make the point)"
            - "Store 0101 grade A, freight_flat 41.00, sell-through 6500, shelf capacity 48 / pmin 12"
            - "Store 0102 grade B, freight_flat 38.00, sell-through 5800, shelf capacity 24 / pmin 8"
            - "SKU-1001 SEASONAL, retail 36.50, on TOP-4SZ (S 2000 / M 3500 / L 3000 / XL 1500)"
            - "Position 0101 holds 4 units (M 3 / L 1) so core S and XL are out -> BROKEN with available 4"
            - "Position 0102 holds 20 units (S 5 / M 7 / L 6 / XL 2) -> COMPLETE with headroom 24 - 20 = 4, exactly the 4 units the detection sweep will want to move"
            - "The logical clock is 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
            - call: "POST /allocation/programs"
              payload: { name: "FA26 Core Tops", season_code: "FA26", banner_code: "NORTH", transfer_min_ratio_bp: 20000 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { prog_id: $.data.id }
            - call: "POST /allocation/stores"
              payload: { program_id: "${prog_id}", store_code: "0101", grade: "A", grade_index_bp: 13000, cluster_code: "URBAN", freight_flat_usd: 41.00, historical_sell_through_bp: 6500 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { s1_id: $.data.id }
            - call: "POST /allocation/stores"
              payload: { program_id: "${prog_id}", store_code: "0102", grade: "B", grade_index_bp: 10000, cluster_code: "URBAN", freight_flat_usd: 38.00, historical_sell_through_bp: 5800 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { s2_id: $.data.id }
            - call: "POST /allocation/fixture-plans"
              payload: { store_id: "${s1_id}", item_class: "APPAREL_TOP", effective_from: "2026-07-01T00:00:00Z", fixture_count: 4, facings_per_fixture: 3, units_per_facing: 4, presentation_min_units: 12 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
            - call: "POST /allocation/fixture-plans"
              payload: { store_id: "${s2_id}", item_class: "APPAREL_TOP", effective_from: "2026-07-01T00:00:00Z", fixture_count: 2, facings_per_fixture: 3, units_per_facing: 4, presentation_min_units: 8 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
            - call: "POST /allocation/size-profiles"
              payload: { program_id: "${prog_id}", profile_code: "TOP-4SZ", item_class: "APPAREL_TOP", size_curve: [{ size_code: "S", share_bp: 2000 }, { size_code: "M", share_bp: 3500 }, { size_code: "L", share_bp: 3000 }, { size_code: "XL", share_bp: 1500 }] }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
