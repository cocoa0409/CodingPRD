  - section: errors
    instances:
      - name: corner_repair_order_create_with_unknown_operating_permit_returns_not_found
        claim_type: Violation to Error
        grounds:
          - errors[ERR_OPERATING_PERMIT_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: "The body foreign key operating_permit_id is validated before any business rule, so an unknown id yields ERR_OPERATING_PERMIT_NOT_FOUND 404 and no RepairOrder row."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /repair-orders"
              payload: { operating_permit_id: "00000000-0000-4000-8000-000000000004", failure_type: "BACKUP", reported_on: "2026-05-01T00:00:00Z" }
              as: EnvironmentalHealthSpecialist
              as_user_id: "u-ehs-field"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_OPERATING_PERMIT_NOT_FOUND with HTTP 404"
            - "GET /repair-orders returns total_count == 0"

      - name: corner_error_contractor_schedule_conflict_is_triggerable
        claim_type: Violation to Error
        grounds:
          - errors[ERR_CONTRACTOR_SCHEDULE_CONFLICT]
        excluded_because:
          difficulty_instance: contractor_calendar_half_open_window_with_trailing_travel_buffer
          rationale: "That instance triggers the error directly and asserts both the rejected 10:44 booking and the accepted 10:45 booking."

      - name: corner_error_permit_window_conflict_is_triggerable
        claim_type: Violation to Error
        grounds:
          - errors[ERR_PERMIT_WINDOW_CONFLICT]
        excluded_because:
          difficulty_instance: parcel_construction_window_closed_interval_rejects_exact_endpoint_touch
          rationale: "That instance asserts the error on the exact endpoint touch and the 201 on the day-later window."

      - name: corner_error_design_flow_exceeds_parcel_cap_is_triggerable
        claim_type: Violation to Error
        grounds:
          - errors[ERR_DESIGN_FLOW_EXCEEDS_PARCEL_CAP]
        excluded_because:
          difficulty_instance: design_not_approved_state_gate_outranks_parcel_flow_cap_fiscal_gate
          rationale: "The second trigger call of that instance surfaces the fiscal error once the state gate is satisfied."

      - name: corner_error_contractor_not_active_is_triggerable
        claim_type: Violation to Error
        grounds:
          - errors[ERR_CONTRACTOR_NOT_ACTIVE]
        excluded_because:
          difficulty_instance: cover_inspection_pass_gated_on_contractor_effective_status_active
          rationale: "That instance asserts the error under a SUSPENDED licence and success after reinstatement."

      - name: corner_error_setback_violation_is_triggerable
        claim_type: Violation to Error
        grounds:
          - errors[ERR_SETBACK_VIOLATION]
        excluded_because:
          difficulty_instance: setback_safety_gate_outranks_parcel_window_temporal_gate_on_permit_issue
          rationale: "That instance asserts ERR_SETBACK_VIOLATION wins over the window conflict on POST /construction-permits."

      - name: corner_error_operating_permit_not_active_is_triggerable
        claim_type: Violation to Error
        grounds:
          - errors[ERR_OPERATING_PERMIT_NOT_ACTIVE]
        excluded_because:
          difficulty_instance: transfer_certification_gated_on_operating_permit_status_active
          rationale: "That instance asserts the error once the operating permit has EXPIRED under the advancing clock."

