  - section: validations
    instances:
      - name: window_locked_gate_blocks_order_mutation
        claim_type: violation_to_error
        grounds:
          - errors[ERR_WINDOW_LOCKED]
          - validations[priority=16]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / window_locked_preempts_cutoff_passed_on_line_add
          rationale: "Asserted as the winning error of that dual-failure instance."

      - name: cutoff_passed_on_line_add
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CUTOFF_PASSED]
          - validations[priority=17]
        excluded_because:
          difficulty_instance: boundary_precision_check / cutoff_instant_is_strictly_exclusive_on_line_add
          rationale: "Asserted at the exact cutoff instant there."

      - name: units_capacity_exceeded_on_line_add
        claim_type: violation_to_error
        grounds:
          - errors[ERR_UNITS_CAPACITY_EXCEEDED]
          - validations[priority=53]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / max_lines_rung_preempts_units_capacity_rung
          rationale: "The 11-unit control call in that instance isolates this rung."

      - name: max_lines_or_quantity_range_exceeded
        claim_type: violation_to_error
        grounds:
          - errors[ERR_MAX_LINES_EXCEEDED]
          - validations[priority=34]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / max_lines_rung_preempts_units_capacity_rung
          rationale: "Asserted as the winning error of that dual-failure instance."

      - name: batch_slot_capacity_exceeded
        claim_type: violation_to_error
        grounds:
          - errors[ERR_BATCH_SLOT_CAPACITY_EXCEEDED]
          - validations[priority=54]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / batch_slot_ceiling_is_per_menu_item_not_per_window_total
          rationale: "Triggered by the second 25-unit line there."

      - name: subscription_reserve_share_exceeded
        claim_type: violation_to_error
        grounds:
          - errors[ERR_SUBSCRIPTION_RESERVE_SHARE_EXCEEDED]
          - validations[priority=52]
        excluded_because:
          difficulty_instance: boundary_precision_check / subscription_reserve_share_admits_exactly_the_cap
          rationale: "Triggered by the fourth cycle there."

      - name: product_class_not_dtc_eligible
        claim_type: violation_to_error
        grounds:
          - errors[ERR_PRODUCT_CLASS_NOT_DTC_ELIGIBLE]
          - validations[priority=25]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / stale_window_version_preempts_product_class_gate
          rationale: "The fresh-version control call in that instance isolates this rung."

      - name: recipe_not_published_on_line_add
        claim_type: violation_to_error
        grounds:
          - errors[ERR_RECIPE_NOT_PUBLISHED]
          - validations[priority=26]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / order_line_add_blocked_by_recipe_in_revising
          rationale: "Asserted directly there."

      - name: label_superseded_blocks_handoff
        claim_type: violation_to_error
        grounds:
          - errors[ERR_LABEL_SUPERSEDED]
          - validations[priority=35]
        excluded_because:
          difficulty_instance: transitive_cascade / recipe_republish_supersedes_labels_and_blocks_handoff_depth_three
          rationale: "Asserted as hop 3's observable consequence there."

      - name: stale_offer_window_version_on_line_add
        claim_type: violation_to_error
        grounds:
          - errors[ERR_STALE_OFFER_WINDOW_VERSION]
          - concurrency_rules[line-add-stale-offer-window]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / stale_window_version_preempts_product_class_gate
          rationale: "Asserted as the winning 412 there."

