    input: [refund_amount_cents, refund_destination]
    output: Order
    side_effects: ["settlement_status -> PARTIALLY_REFUNDED/REFUNDED; refunded_cents += amount; wallet credit; points clawback cascade"]

  - method: POST
    path: "/loyalty-challenges"
    description: "Enroll a customer in a loyalty challenge."
    roles: [PlatformAdmin, Customer]
    code: 201
    input: [customer_id, target_order_count, bonus_points]
    output: LoyaltyChallenge
    side_effects: ["status = IN_PROGRESS; progress_count 0"]

  - method: GET
    path: "/loyalty-challenges/{id}"
    description: "Read a single loyalty challenge including progress_count and status."
    roles: [Customer, StoreManager, PlatformAdmin]
    code: 200
    input: []
    output: LoyaltyChallenge
    side_effects: []

  - method: GET
    path: "/loyalty-challenges"
    description: "List loyalty challenges; filter by customer_id (reverse-reachability)."
    roles: [Customer, StoreManager, PlatformAdmin]
    code: 200
    input: ["customer_id?", "limit?", "offset?"]
    output: LoyaltyChallenge[]
    side_effects: []

  - method: POST
    path: "/loyalty-challenges/{id}/start-round"
    description: "Begin a new challenge round; ROUND_COMPLETE -> IN_PROGRESS, progress reset."
    roles: [Customer]
    code: 200
    input: []
    output: LoyaltyChallenge
    side_effects: ["status -> IN_PROGRESS; progress_count reset to 0"]

  - method: POST
    path: "/loyalty-challenges/{id}/expire"
    description: "Expire an in-progress challenge; forfeit progress."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: LoyaltyChallenge
    side_effects: ["status -> EXPIRED"]

  - method: POST
    path: "/_inject/place_n_orders"
    description: "Test-driving endpoint: create and place `count` minimal one-line COUNTER/LOCKER orders (each by a distinct fresh customer) against a slot, to saturate reserved_count for throughput/queue tests. Honors capacity/locker gates."
    roles: [PlatformAdmin]
    code: 201
    input: [store_id, menu_item_id, pickup_slot_id, count]
    output: PickupSlot
    side_effects: ["PickupSlot.reserved_count increased by count; Store.queue_status recomputed; slot version bumped per placement"]

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the logical clock. Server startup default is 2026-03-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["Logical clock advanced; queue_status / subscription lapse windows reference it"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/invalid X-User-Role or X-User-ID headers on a protected endpoint."
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted for the endpoint, or entity_backed role acting on a resource it does not own."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A path or FK-referenced resource does not exist."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required body field, wrong type, or enum value outside declared set."
  - id: ERR_MODIFIER_MISMATCH
    http: 422
    condition: "A modifier does not belong to the line's menu item, or the item does not belong to the order's store."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition is not defined from the entity's current state (any state axis)."
  - id: ERR_ALLERGEN_BLOCKED
    http: 422
    condition: "An order line's effective allergens intersect the customer's allergen blocklist."
  - id: ERR_SLOT_UNAVAILABLE
    http: 422
    condition: "Chosen pickup slot is closed, expired (clock_now >= window_end_utc), or channel mismatched."
  - id: ERR_SLOT_CAPACITY_EXCEEDED
    http: 409
    condition: "PickupSlot.reserved_count has reached Store.throughput_capacity_per_slot."
  - id: ERR_NO_LOCKER_AVAILABLE
    http: 409
    condition: "LOCKER channel order but no free locker (non-terminal LOCKER orders >= Store.locker_count)."
  - id: ERR_INSUFFICIENT_POINTS
    http: 422
    condition: "points_redeemed exceeds LoyaltyAccount.points_balance."
  - id: ERR_REFUND_EXCEEDS_CHARGE
    http: 422
    condition: "make-it-right refund_amount_cents <= 0 or exceeds remaining refundable (total_cents - refunded_cents)."
  - id: ERR_STALE_SLOT_VERSION
    http: 412
    condition: "expected_pickup_slot_version does not match current PickupSlot.version at placement (OCC)."
  - id: ERR_EMPTY_ORDER
    http: 422
    condition: "Placing an order with zero order lines."
  - id: ERR_ITEM_UNAVAILABLE
    http: 422
    condition: "Adding a line for a MenuItem whose is_available == false, or store/menu not active."
  - id: ERR_PAYMENT_FAILED
    http: 402
    condition: "Subscription payment outcome is not SUCCEEDED."
  - id: ERR_DUPLICATE_EMAIL
    http: 409
    condition: "Registering a customer with an email already in use."
  - id: ERR_INVALID_QUANTITY
    http: 422
    condition: "OrderLine quantity < 1."
  - id: ERR_CHALLENGE_NOT_READY
    http: 409
    condition: "start-round called on a challenge not in ROUND_COMPLETE status."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Customer
    description: "End user who places orders, manages own loyalty/subscription/challenges."
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /orders (own customer_id)"
      - "POST /orders/{id}/lines (own order)"
      - "PATCH /order-lines/{id} (own order)"
      - "POST /orders/{id}/place (own order)"
      - "POST /orders/{id}/cancel (own order)"
      - "POST /subscriptions (own customer_id)"
      - "POST /subscriptions/{id}/pay (own subscription)"
      - "POST /subscriptions/{id}/cancel (own subscription)"
      - "POST /loyalty-challenges/{id}/start-round (own challenge)"
    shared_operations:
      - "POST /customers (self-register)"
      - "POST /loyalty-challenges (self or admin)"
      - "GET reads on own resources, menu, stores, slots"

  - name: StoreManager
    description: "Operates a store: kitchen progression, completion, make-it-right refunds, slot management."
    identity: "opaque"
    exclusive_operations:
      - "POST /orders/{id}/advance"
      - "POST /orders/{id}/complete"
      - "POST /orders/{id}/make-it-right"
    shared_operations:
      - "POST /pickup-slots (with admin)"
      - "POST /pickup-slots/{id}/close (with admin)"
      - "POST /customers/{id}/wallet/adjustments (with admin)"
      - "GET reads on stores, orders, loyalty, slots"

  - name: PlatformAdmin
    description: "Configures menu, plans, slots, clock; lifecycle operators for subscription lapse / challenge expiry."
    identity: "opaque"
    exclusive_operations:
      - "POST /stores"
      - "POST /menu-items"
      - "POST /modifiers"
      - "POST /subscription-plans"
      - "POST /subscriptions/{id}/lapse"
      - "POST /loyalty-challenges/{id}/expire"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /pickup-slots (with store manager)"
      - "POST /pickup-slots/{id}/close (with store manager)"
      - "POST /customers/{id}/wallet/adjustments (with store manager)"
      - "POST /loyalty-challenges (self or customer)"
      - "GET reads (all)"
