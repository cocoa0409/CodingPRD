    code: 200
    input: [outcome, "outcome_note?"]
    output: QualityRiskEscalation
    side_effects: ["SUBSTANTIATED: expedited due recompute cascade; possible RESPONSE_BREACH + auto ReportableEvent"]

  # --- ReportableEvent ---
  - method: POST
