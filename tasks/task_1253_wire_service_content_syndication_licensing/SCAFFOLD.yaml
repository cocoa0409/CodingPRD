# =============================================================================
# Task 1253 — Wire Service & Content Syndication Licensing
# AP-style wire service: packages, subscriber tiers, distribution feeds,
# entitlement enforcement, usage reporting & audit, embargo/takedown,
# member contribution credits, circulation-based pricing, photo/video rights
# carve-outs, and renewal/termination notices.
# =============================================================================

scenario: |
  1253. Wire Service & Content Syndication Licensing (AP style wire service):
  content package & subscriber tier definition, distribution feed configuration
  & entitlement enforcement, usage reporting & audit of subscriber
  republication, embargo enforcement & takedown, member contribution model &
  credit rules, pricing by circulation/audience size, rights carve-out for
  photos/video, renewal & termination notice.

domain_name: wire-service-syndication
api_prefix: /wire

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: access_control_matrix
  complexity_layers:
    - optimistic_concurrency
    - derived_field_reconciliation
    - rate_threshold_triggers
    - scheduled_actions
    - cascading_side_effects

  entity_topology: hybrid
  state_machine_shape: branching

  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate

  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: ContentPackage
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique wire service code (e.g. NATIONAL_NEWS_PLUS)" }
      - { name: display_name, type: string, source: input, description: "Human readable package name" }
      - { name: media_rights, type: enum, source: input, description: "TEXT_ONLY | TEXT_AND_PHOTO | TEXT_PHOTO_VIDEO — which asset classes a subscription to this package may republish" }
      - { name: base_monthly_fee_cents, type: integer, source: input, description: "Base list price per calendar month before circulation multiplier" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED" }

  - name: SubscriberTier
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique tier code (METRO | REGIONAL | COMMUNITY | DIGITAL)" }
      - { name: min_audience, type: integer, source: input, description: "Inclusive lower bound of average circulation/audience this tier applies to" }
      - { name: max_audience, type: integer, source: input, description: "Exclusive upper bound; null means unbounded above" }
      - { name: circulation_multiplier_basis_points, type: integer, source: input, description: "10000 = 1.0x; applied to base fee" }
      - { name: monthly_republish_quota, type: integer, source: input, description: "Hard cap of republications per calendar month included" }
      - { name: overage_per_article_cents, type: integer, source: input, description: "Charge per republication beyond quota" }
      - { name: member_discount_pct, type: integer, source: input, default: 0, description: "Percentage (0-90) discount granted when subscriber is an active contributing member" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED" }

  - name: Feed
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique feed code (e.g. WIRE-NATIONAL, WIRE-SPORTS)" }
      - { name: topic, type: enum, source: input, description: "NATIONAL | WORLD | BUSINESS | SPORTS | FEATURES" }
      - { name: embargo_window_minutes, type: integer, source: input, description: "Standard embargo applied to articles routed to this feed when no explicit embargo_until is set" }
      - { name: status, type: enum, source: system, description: "LIVE | SUSPENDED" }

  - name: Subscriber
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Publication legal entity name" }
      - { name: billing_email, type: string, source: input, description: "Billing contact email" }
      - { name: declared_audience, type: integer, source: input, description: "Self-declared average circulation/audience, drives tier resolution" }
      - { name: is_member, type: boolean, source: input, default: false, description: "Whether the subscriber is a contributing wire-service member" }
      - { name: member_credit_balance_cents, type: integer, source: computed, description: "Accumulated credit from accepted member contributions; decremented when applied to invoices" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | TERMINATED" }
      - { name: termination_notice_at, type: datetime, source: system, description: "When termination notice was given (for 30-day notice rule)" }
      - { name: termination_effective_at, type: datetime, source: system, description: "When TERMINATED status becomes effective" }

  - name: Subscription
    parent: Subscriber
    common_fields: true
    fields:
      - { name: subscriber_id, type: string, source: system, description: "FK -> Subscriber.id" }
      - { name: package_id, type: string, source: input, description: "FK -> ContentPackage.id" }
      - { name: tier_id, type: string, source: computed, description: "FK -> SubscriberTier.id; resolved at activation from subscriber.declared_audience" }
      - { name: monthly_price_cents, type: integer, source: computed, description: "Final monthly price after tier multiplier and member discount" }
      - { name: start_at, type: datetime, source: input, description: "Subscription start (UTC)" }
      - { name: renewal_due_at, type: datetime, source: computed, description: "start_at + 12 months" }
      - { name: renewal_notice_sent_at, type: datetime, source: system, description: "Timestamp renewal notice was dispatched (must be >= 60 days before renewal_due_at)" }
      - { name: months_used_current_period, type: integer, source: system, default: 0, description: "Months consumed since start or last renewal" }
      - { name: republish_count_current_month, type: integer, source: system, default: 0, description: "Counter for quota tracking in current calendar month" }
      - { name: current_month_bucket, type: string, source: system, description: "YYYY-MM bucket republish_count_current_month belongs to" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | SUSPENDED | EXPIRED | CANCELLED" }

  - name: Entitlement
    parent: Subscription
    common_fields: true
    fields:
      - { name: subscription_id, type: string, source: system, description: "FK -> Subscription.id" }
      - { name: feed_id, type: string, source: input, description: "FK -> Feed.id" }
      - { name: granted_at, type: datetime, source: system, description: "When this entitlement became effective" }
      - { name: revoked_at, type: datetime, source: system, description: "Set when entitlement was revoked (null while live)" }
      - { name: status, type: enum, source: system, description: "LIVE | REVOKED" }

  - name: Article
    parent: null
    common_fields: true
    fields:
      - { name: feed_id, type: string, source: input, description: "FK -> Feed.id this article is routed to" }
      - { name: headline, type: string, source: input, description: "Headline text" }
      - { name: body_word_count, type: integer, source: input, description: "Word count of body" }
      - { name: slug, type: string, source: input, description: "Unique slug" }
      - { name: published_at, type: datetime, source: system, description: "Timestamp moved to PUBLISHED" }
      - { name: embargo_until, type: datetime, source: system, description: "Computed from published_at + feed.embargo_window_minutes unless explicit embargo action set it later" }
      - { name: embargo_status, type: enum, source: system, description: "CLEAR | EMBARGOED | EMBARGO_LIFTED" }
      - { name: contributing_member_subscriber_id, type: string, source: input, description: "FK -> Subscriber.id of the member that originated this article (null for staff copy)" }
      - { name: member_credit_cents, type: integer, source: computed, description: "Credit granted to contributing member for this article (set on acceptance)" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | WITHDRAWN | TAKEN_DOWN" }

  - name: Asset
    parent: Article
    common_fields: true
    fields:
      - { name: article_id, type: string, source: system, description: "FK -> Article.id" }
      - { name: kind, type: enum, source: input, description: "PHOTO | VIDEO" }
      - { name: rights_scope, type: enum, source: input, description: "WIRE | EDITORIAL_ONLY | MEMBER_ONLY — carve-out classes; EDITORIAL_ONLY and MEMBER_ONLY are excluded from syndication under certain packages/tiers" }
      - { name: file_ref, type: string, source: input, description: "Storage reference" }
      - { name: status, type: enum, source: system, description: "ACTIVE | TAKEN_DOWN" }

  - name: Publication
    parent: Subscriber
    common_fields: true
    fields:
      - { name: subscriber_id, type: string, source: system, description: "FK -> Subscriber.id that republished" }
      - { name: subscription_id, type: string, source: system, description: "FK -> Subscription.id used" }
      - { name: article_id, type: string, source: input, description: "FK -> Article.id" }
      - { name: republished_at, type: datetime, source: system, description: "Server-stamped time of republication" }
      - { name: billed_amount_cents, type: integer, source: computed, description: "0 if within quota; overage_per_article_cents otherwise" }
      - { name: within_quota, type: boolean, source: computed, description: "true when republish_count_current_month <= tier.monthly_republish_quota at time of publication" }
      - { name: status, type: enum, source: system, description: "RECORDED | AUDIT_FLAGGED | DISMISSED" }

  - name: Invoice
    parent: Subscriber
    common_fields: true
    fields:
      - { name: subscriber_id, type: string, source: system, description: "FK -> Subscriber.id" }
      - { name: subscription_id, type: string, source: input, description: "FK -> Subscription.id" }
      - { name: billing_month, type: string, source: input, description: "YYYY-MM being billed" }
      - { name: base_fee_cents, type: integer, source: computed, description: "monthly_price_cents snapshotted from subscription" }
      - { name: overage_cents, type: integer, source: computed, description: "Sum of billed_amount_cents for Publications of this subscription in billing_month where within_quota=false" }
      - { name: member_credit_applied_cents, type: integer, source: computed, description: "Amount of member_credit_balance_cents consumed against this invoice" }
      - { name: total_due_cents, type: integer, source: computed, description: "base_fee_cents + overage_cents - member_credit_applied_cents; never below 0" }
      - { name: provisional_total_due_cents, type: integer, source: computed, description: "Provisional variant: base + accrued overage, ignoring member credit" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | PAID | VOIDED" }

  - name: ClockCheckpoint
    parent: null
    common_fields: false
    fields:
      - { name: current_utc, type: datetime, source: system, description: "Logical clock; default 2026-05-01T00:00:00Z at server start; advanced by /_clock/set_current_utc" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Article
    initial_state: DRAFT
    terminal_states: [TAKEN_DOWN]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /wire/articles/{id}/publish"
        actor: Editor
        preconditions:
          - "Article.status == DRAFT"
          - "Article.feed_id resolves to a Feed with status == LIVE"
        side_effects:
          - "published_at set to current logical clock"
          - "embargo_until = published_at + Feed.embargo_window_minutes"
          - "embargo_status = EMBARGOED if embargo_until > published_at else CLEAR"
      - from: PUBLISHED
        to: PUBLISHED
        trigger: "POST /wire/articles/{id}/embargo (extend embargo)"
        actor: Editor
        preconditions:
          - "Article.status == PUBLISHED"
          - "payload.new_embargo_until > current embargo_until"
        side_effects:
          - "embargo_until = new_embargo_until"
          - "embargo_status = EMBARGOED"
      - from: PUBLISHED
        to: PUBLISHED
        trigger: "POST /wire/articles/{id}/lift-embargo"
        actor: Editor
        preconditions:
          - "Article.status == PUBLISHED"
          - "Article.embargo_status == EMBARGOED"
        side_effects:
          - "embargo_status = EMBARGO_LIFTED"
      - from: PUBLISHED
        to: WITHDRAWN
        trigger: "POST /wire/articles/{id}/withdraw"
        actor: Editor
        preconditions:
          - "Article.status == PUBLISHED"
        side_effects:
          - "Publication rows referencing this article with status == RECORDED flip to AUDIT_FLAGGED"
          - "Subscribers whose Publication was AUDIT_FLAGGED receive audit review marker"
      - from: WITHDRAWN
        to: PUBLISHED
        trigger: "POST /wire/articles/{id}/republish"
        actor: Editor
        preconditions:
          - "Article.status == WITHDRAWN"
          - "No outstanding TAKEDOWN request on this article"
        side_effects:
          - "published_at refreshed to current logical clock"
          - "embargo_until recomputed from feed"
          - "embargo_status reset to EMBARGOED or CLEAR"
      - from: PUBLISHED
        to: TAKEN_DOWN
        trigger: "POST /wire/articles/{id}/takedown"
        actor: Legal
        preconditions:
          - "Article.status == PUBLISHED or WITHDRAWN"
        side_effects:
          - "All Assets of this article flip to TAKEN_DOWN"
          - "All Publication rows referencing this article flip to AUDIT_FLAGGED"
          - "If article had a contributing_member_subscriber_id, that member's member_credit_balance_cents is decremented by member_credit_cents (floor 0)"
      - from: WITHDRAWN
        to: TAKEN_DOWN
        trigger: "POST /wire/articles/{id}/takedown"
        actor: Legal
        preconditions: []
        side_effects:
          - "Same cascade as PUBLISHED→TAKEN_DOWN"

  - entity: Subscription
    initial_state: DRAFT
    terminal_states: [CANCELLED, EXPIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /wire/subscriptions/{id}/activate"
        actor: SalesOps
        preconditions:
          - "Subscription.status == DRAFT"
          - "Subscriber.status == ACTIVE"
          - "Package referenced by package_id has status == ACTIVE"
          - "Exactly one ACTIVE SubscriberTier matches subscriber.declared_audience"
        side_effects:
          - "tier_id resolved by tier-resolution rule"
          - "monthly_price_cents computed via price_monthly_subscription"
          - "renewal_due_at = start_at + 12 months"
          - "current_month_bucket set to start_at's YYYY-MM"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /wire/subscriptions/{id}/suspend"
        actor: SalesOps
        preconditions:
          - "Subscription.status == ACTIVE"
          - "Subscriber.status == ACTIVE"
        side_effects:
          - "All Entitlements of this subscription flip to REVOKED with revoked_at set"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /wire/subscriptions/{id}/reinstate"
        actor: SalesOps
        preconditions:
          - "Subscription.status == SUSPENDED"
          - "Subscriber.status == ACTIVE"
        side_effects:
          - "Entitlements previously REVOKED remain REVOKED; new Entitlements must be granted explicitly"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (logical clock reaches renewal_due_at without renewal action)"
        actor: system
        preconditions:
          - "Subscription.status == ACTIVE"
          - "current_utc >= renewal_due_at"
        side_effects:
          - "All Entitlements flip to REVOKED"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /wire/subscriptions/{id}/cancel"
        actor: SalesOps
        preconditions:
          - "Subscription.status == ACTIVE"
          - "Subscriber.status == ACTIVE or SUSPENDED"
          - "months_used_current_period >= 3 (minimum commitment)"
        side_effects:
          - "All Entitlements flip to REVOKED"
      - from: SUSPENDED
        to: CANCELLED
        trigger: "POST /wire/subscriptions/{id}/cancel"
        actor: SalesOps
        preconditions:
          - "months_used_current_period >= 3"
        side_effects: []

  - entity: Subscriber
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /wire/subscribers/{id}/suspend"
        actor: SalesOps
        preconditions:
          - "Subscriber.status == ACTIVE"
        side_effects:
          - "Cascade: all ACTIVE or DRAFT Subscriptions of this subscriber flip to SUSPENDED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /wire/subscribers/{id}/reinstate"
        actor: SalesOps
        preconditions:
          - "Subscriber.status == SUSPENDED"
        side_effects:
          - "Does NOT auto-reinstate subscriptions (manual only)"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /wire/subscribers/{id}/terminate"
        actor: SalesOps
        preconditions:
          - "Subscriber.status == ACTIVE"
          - "Logical clock >= termination_notice_at + 30 days (30-day notice rule)"
        side_effects:
          - "All Subscriptions (any non-terminal state) flip to CANCELLED"
          - "All outstanding DRAFT Invoices flip to VOIDED"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /wire/subscribers/{id}/terminate"
        actor: SalesOps
        preconditions:
          - "Logical clock >= termination_notice_at + 30 days"
        side_effects:
          - "Same cascade as ACTIVE→TERMINATED"

  - entity: Entitlement
    initial_state: LIVE
    terminal_states: [REVOKED]
    transitions:
      - from: LIVE
        to: REVOKED
        trigger: "POST /wire/entitlements/{id}/revoke OR cascaded from Subscription suspend/cancel/expire"
        actor: SalesOps | system
        preconditions:
          - "Entitlement.status == LIVE"
        side_effects:
          - "revoked_at = current logical clock"

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [PAID, VOIDED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /wire/invoices/{id}/issue"
        actor: Billing
        preconditions:
          - "Invoice.status == DRAFT"
          - "Subscription referenced by subscription_id is not DRAFT"
        side_effects:
          - "member_credit_applied_cents is computed (consuming member_credit_balance_cents up to total_due)"
          - "Subscriber.member_credit_balance_cents decremented by member_credit_applied_cents"
      - from: ISSUED
        to: PAID
        trigger: "POST /wire/invoices/{id}/pay"
        actor: Billing
        preconditions:
          - "Invoice.status == ISSUED"
        side_effects: []
      - from: DRAFT
        to: VOIDED
        trigger: "POST /wire/invoices/{id}/void OR cascade from Subscriber terminate"
        actor: Billing | system
        preconditions:
          - "Invoice.status == DRAFT"
        side_effects: []

  - entity: Publication
    initial_state: RECORDED
    terminal_states: [AUDIT_FLAGGED, DISMISSED]
    transitions:
      - from: RECORDED
        to: AUDIT_FLAGGED
        trigger: "system (cascade from Article withdraw or takedown) OR POST /wire/publications/{id}/flag"
        actor: Auditor | system
        preconditions:
          - "Publication.status == RECORDED"
        side_effects: []
      - from: AUDIT_FLAGGED
        to: DISMISSED
        trigger: "POST /wire/publications/{id}/dismiss"
        actor: Auditor
        preconditions:
          - "Publication.status == AUDIT_FLAGGED"
        side_effects:
          - "If billed_amount_cents > 0, that amount is credited back to subscriber.member_credit_balance_cents"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: subscription-activation-stale-subscriber
    parent_entity: Subscriber
    write_endpoint: "POST /wire/subscriptions/{id}/activate"
    occ_field: "expected_subscriber_version"
    description: |
      Activating a Subscription against a Subscriber whose version has advanced
      since the client last read it is rejected. Captures the case where a
      parallel SalesOps or member-credit writer modified the subscriber (e.g.
      member_credit_balance_cents, declared_audience) between the read and the
      activation, and the client is acting on stale tier-resolution inputs.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: article-republish-stale-article
    parent_entity: Article
    write_endpoint: "POST /wire/articles/{id}/republish"
    occ_field: "expected_article_version"
    description: |
      Republishing an Article whose version has advanced since the client last
      read it is rejected. Captures the case where another writer published an
      embargo extension or metadata change between the read and the republish.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: price_monthly_subscription
    trigger: "POST /wire/subscriptions/{id}/activate"
    algorithm: tiered_pricing
    formula: |
      tier = lookup SubscriberTier where status == ACTIVE
             AND subscriber.declared_audience >= min_audience
             AND (max_audience IS NULL OR subscriber.declared_audience < max_audience)
      base = ContentPackage.base_monthly_fee_cents
      multiplier_bp = tier.circulation_multiplier_basis_points
      gross_cents = round_half_up(base * multiplier_bp / 10000)
      discount_bp = (subscriber.is_member AND tier.member_discount_pct > 0)
                    ? round_half_up(gross_cents * tier.member_discount_pct / 100)
                    : 0
      monthly_price_cents = gross_cents - discount_bp
    input_set: "ContentPackage referenced by subscription.package_id; Subscriber owning the subscription; SubscriberTier with status == ACTIVE whose audience window matches"
    constants:
      BASIS_POINTS_DENOM: 10000
      ROUNDING: round_half_up
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional
        when: "When computing Invoice.provisional_total_due_cents (draft invoice preview)"
        difference: "Recomputes gross from Package.base_monthly_fee_cents * tier.circulation_multiplier_basis_points / 10000, ignoring BOTH member_discount_pct AND member_credit_balance; result differs from final variant whenever the subscriber is a member with member_discount_pct > 0"
      - name: final
        when: "When activating a subscription (writes monthly_price_cents) and when issuing an invoice (writes total_due_cents after applying member_credit)"
        difference: "Applies tier multiplier AND member_discount_pct; invoice issue additionally decrements member_credit_balance_cents"

  - name: tier_resolution
    trigger: "POST /wire/subscriptions/{id}/activate"
    algorithm: threshold
    formula: |
      candidates = SubscriberTier where status == ACTIVE
                   AND min_audience <= subscriber.declared_audience
                   AND (max_audience IS NULL OR subscriber.declared_audience < max_audience)
      if len(candidates) == 0 → ERR_NO_MATCHING_TIER
      if len(candidates) > 1 → ERR_AMBIGUOUS_TIER
      return candidates[0]
    input_set: "All SubscriberTier rows with status == ACTIVE"
    constants: {}
    precision: "boundary at min_audience is INCLUSIVE; boundary at max_audience is EXCLUSIVE"

  - name: compute_overage_cents
    trigger: "POST /wire/subscriptions/{subscription_id}/invoices (issue draft) AND on POST /wire/publications"
    algorithm: aggregation
    formula: |
      # Publication-side: at the moment of republication
      if subscription.current_month_bucket != current_utc_YYYY_MM:
        subscription.republish_count_current_month = 0
        subscription.current_month_bucket = current_utc_YYYY_MM
      subscription.republish_count_current_month += 1
      within_quota = (republish_count_current_month <= tier.monthly_republish_quota)
      billed_amount_cents = within_quota ? 0 : tier.overage_per_article_cents

      # Invoice-side: sum over all Publication rows of this subscription in
      # billing_month with status in {RECORDED, AUDIT_FLAGGED}
      overage_cents = sum(p.billed_amount_cents for p in publications
                          where p.subscription_id == sub.id
                          AND p.republished_at in billing_month
                          AND p.status in {RECORDED, AUDIT_FLAGGED})
    input_set: "Publications of this subscription whose republished_at falls in the target YYYY-MM (inclusive of month boundary [month_start, next_month_start)); status in {RECORDED, AUDIT_FLAGGED}; DISMISSED rows excluded"
    constants: {}
    precision: "integer cents"

  - name: member_credit_grant
    trigger: "POST /wire/articles/{id}/publish when article.contributing_member_subscriber_id is not null AND that subscriber.is_member == true"
    algorithm: weighted_scoring
    formula: |
      # Piecewise by word count, plus per-asset bonus, plus member-tier bonus
      base_by_words =
        if body_word_count < 400: 2000
        elif body_word_count < 900: 5000
        elif body_word_count < 1500: 9000
        else: 14000
      asset_bonus = 1500 * count(Asset where article_id == id AND kind == 'PHOTO')
                  + 4000 * count(Asset where article_id == id AND kind == 'VIDEO')
      # Round per-component then sum (rounding order is pinned: each bonus
      # is rounded to integer cents, then summed, no post-rounding)
      member_credit_cents = base_by_words + asset_bonus
    input_set: "Article fields; Assets of this article regardless of status at time of publish"
    constants:
      WORD_BRACKET_LOW_CENTS: 2000
      WORD_BRACKET_MID_CENTS: 5000
      WORD_BRACKET_HIGH_CENTS: 9000
      WORD_BRACKET_FEATURE_CENTS: 14000
      PHOTO_BONUS_CENTS: 1500
      VIDEO_BONUS_CENTS: 4000
    precision: "integer cents"

  - name: member_credit_apply_to_invoice
    trigger: "POST /wire/invoices/{id}/issue"
    algorithm: waterfall_allocation
    formula: |
      gross_due = base_fee_cents + overage_cents
      credit_available = subscriber.member_credit_balance_cents
      applied = min(credit_available, gross_due)
      member_credit_applied_cents = applied
      total_due_cents = gross_due - applied
      # side effect: subscriber.member_credit_balance_cents -= applied
    input_set: "Invoice DRAFT fields; Subscriber.member_credit_balance_cents at issue time"
    constants: {}
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role is declared in §1.7", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role permitted to invoke this endpoint per §1.5 roles[]", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Every path id and request-body FK resolves to an existing entity", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 4, category: state, check: "State machine precondition (e.g. Article.status == DRAFT before publish; Subscription.status == DRAFT before activate)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all transition endpoints" }
  - { priority: 5, category: business_temporal, check: "Embargo / notice timing rules (embargo_until in future for republication, termination notice >= 30 days before effective)", error_id: ERR_TEMPORAL_VIOLATION, http_status: 422, applies_to: "republication + terminate + embargo endpoints" }
  - { priority: 6, category: business_safety, check: "Article not TAKEN_DOWN; Asset rights_scope compatible with package.media_rights", error_id: ERR_RIGHTS_VIOLATION, http_status: 422, applies_to: "POST /wire/publications" }
  - { priority: 7, category: business_referential, check: "Subscriber owning the referenced subscription matches X-User-ID when role == SubscriberRep", error_id: ERR_FORBIDDEN_CROSS_ACCOUNT, http_status: 403, applies_to: "subscriber-scoped endpoints" }
  - { priority: 8, category: business_constraint, check: "Tier resolution unique (exactly one ACTIVE tier matches declared_audience)", error_id: ERR_AMBIGUOUS_TIER, http_status: 422, applies_to: "POST /wire/subscriptions/{id}/activate" }
  - { priority: 9, category: business_constraint, check: "No ACTIVE tier matches declared_audience", error_id: ERR_NO_MATCHING_TIER, http_status: 422, applies_to: "POST /wire/subscriptions/{id}/activate" }
  - { priority: 10, category: business_constraint, check: "Entitlement for (subscription, article.feed) exists with status == LIVE", error_id: ERR_NO_ENTITLEMENT, http_status: 422, applies_to: "POST /wire/publications" }
  - { priority: 11, category: business_constraint, check: "Subscription minimum commitment met (months_used_current_period >= 3) before cancel", error_id: ERR_MIN_COMMITMENT_NOT_MET, http_status: 422, applies_to: "POST /wire/subscriptions/{id}/cancel" }
  - { priority: 12, category: business_fiscal, check: "Invoice total_due_cents >= 0; member_credit_applied_cents <= subscriber.member_credit_balance_cents", error_id: ERR_FISCAL_INCONSISTENCY, http_status: 422, applies_to: "POST /wire/invoices/{id}/issue" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Logical clock (test-driving) ---
  - { method: POST, path: "/wire/_clock/set_current_utc", description: "Advance logical clock. Server starts at 2026-05-01T00:00:00Z before any call.", roles: [PlatformAdmin], code: 200, input: [to_iso8601], output: ClockCheckpoint, side_effects: ["May trigger Subscription ACTIVE→EXPIRED sweep"] }

  # --- ContentPackage ---
  - { method: POST, path: "/wire/packages", description: "Create content package", roles: [PlatformAdmin], code: 201, input: [code, display_name, media_rights, base_monthly_fee_cents], output: ContentPackage, side_effects: [] }
  - { method: GET, path: "/wire/packages", description: "List packages", roles: [PlatformAdmin, SalesOps, Auditor, Billing], code: 200, input: ["status?", "limit?", "offset?"], output: "ContentPackage[]", side_effects: [] }
  - { method: GET, path: "/wire/packages/{id}", description: "Get package by id", roles: [PlatformAdmin, SalesOps, Auditor, Billing], code: 200, input: [], output: ContentPackage, side_effects: [] }
  - { method: POST, path: "/wire/packages/{id}/retire", description: "Retire package (no new subscriptions)", roles: [PlatformAdmin], code: 200, input: [], output: ContentPackage, side_effects: [] }

  # --- SubscriberTier ---
  - { method: POST, path: "/wire/tiers", description: "Create subscriber tier", roles: [PlatformAdmin], code: 201, input: [code, min_audience, max_audience, circulation_multiplier_basis_points, monthly_republish_quota, overage_per_article_cents, "member_discount_pct?"], output: SubscriberTier, side_effects: [] }
  - { method: GET, path: "/wire/tiers", description: "List tiers", roles: [PlatformAdmin, SalesOps, Auditor, Billing], code: 200, input: ["status?", "limit?", "offset?"], output: "SubscriberTier[]", side_effects: [] }
  - { method: GET, path: "/wire/tiers/{id}", description: "Get tier", roles: [PlatformAdmin, SalesOps, Auditor, Billing], code: 200, input: [], output: SubscriberTier, side_effects: [] }
  - { method: POST, path: "/wire/tiers/{id}/retire", description: "Retire tier", roles: [PlatformAdmin], code: 200, input: [], output: SubscriberTier, side_effects: [] }

  # --- Feed ---
  - { method: POST, path: "/wire/feeds", description: "Create feed", roles: [PlatformAdmin], code: 201, input: [code, topic, embargo_window_minutes], output: Feed, side_effects: [] }
  - { method: GET, path: "/wire/feeds", description: "List feeds", roles: [PlatformAdmin, SalesOps, Editor, Auditor], code: 200, input: ["status?", "limit?", "offset?"], output: "Feed[]", side_effects: [] }
  - { method: GET, path: "/wire/feeds/{id}", description: "Get feed", roles: [PlatformAdmin, SalesOps, Editor, Auditor], code: 200, input: [], output: Feed, side_effects: [] }

  # --- Subscriber ---
  - { method: POST, path: "/wire/subscribers", description: "Register subscriber", roles: [SalesOps], code: 201, input: [legal_name, billing_email, declared_audience, "is_member?"], output: Subscriber, side_effects: [] }
  - { method: GET, path: "/wire/subscribers", description: "List subscribers", roles: [PlatformAdmin, SalesOps, Auditor, Billing], code: 200, input: ["status?", "is_member?", "limit?", "offset?"], output: "Subscriber[]", side_effects: [] }
  - { method: GET, path: "/wire/subscribers/{id}", description: "Get subscriber", roles: [PlatformAdmin, SalesOps, Auditor, Billing], code: 200, input: [], output: Subscriber, side_effects: [] }
  - { method: POST, path: "/wire/subscribers/{id}/suspend", description: "Suspend subscriber (cascades to subscriptions)", roles: [SalesOps], code: 200, input: [], output: Subscriber, side_effects: ["Subscriptions flip to SUSPENDED"] }
  - { method: POST, path: "/wire/subscribers/{id}/reinstate", description: "Reinstate subscriber", roles: [SalesOps], code: 200, input: [], output: Subscriber, side_effects: [] }
  - { method: POST, path: "/wire/subscribers/{id}/give-termination-notice", description: "Record 30-day termination notice", roles: [SalesOps], code: 200, input: [], output: Subscriber, side_effects: ["termination_notice_at set to current clock", "termination_effective_at = notice + 30 days"] }
  - { method: POST, path: "/wire/subscribers/{id}/terminate", description: "Terminate subscriber (after 30-day notice)", roles: [SalesOps], code: 200, input: [], output: Subscriber, side_effects: ["All non-terminal Subscriptions → CANCELLED", "DRAFT Invoices → VOIDED"] }

  # --- Subscription ---
  - { method: POST, path: "/wire/subscribers/{id}/subscriptions", description: "Create draft subscription for subscriber", roles: [SalesOps], code: 201, input: [package_id, start_at], output: Subscription, side_effects: [] }
  - { method: GET, path: "/wire/subscribers/{id}/subscriptions", description: "List subscriptions for subscriber", roles: [PlatformAdmin, SalesOps, Auditor, Billing], code: 200, input: ["status?", "limit?", "offset?"], output: "Subscription[]", side_effects: [] }
  - { method: GET, path: "/wire/subscriptions", description: "List subscriptions (filtered)", roles: [PlatformAdmin, SalesOps, Auditor, Billing], code: 200, input: ["subscriber_id?", "package_id?", "tier_id?", "status?", "limit?", "offset?"], output: "Subscription[]", side_effects: [] }
  - { method: GET, path: "/wire/subscriptions/{id}", description: "Get subscription", roles: [PlatformAdmin, SalesOps, Auditor, Billing, SubscriberRep], code: 200, input: [], output: Subscription, side_effects: [] }
  - { method: POST, path: "/wire/subscriptions/{id}/activate", description: "Activate subscription; resolves tier and price; OCC via expected_subscriber_version", roles: [SalesOps], code: 200, input: [expected_subscriber_version], output: Subscription, side_effects: ["tier_id resolved", "monthly_price_cents computed", "Subscriber.version incremented by 1"] }
  - { method: POST, path: "/wire/subscriptions/{id}/suspend", description: "Suspend subscription (cascades entitlements to REVOKED)", roles: [SalesOps], code: 200, input: [], output: Subscription, side_effects: ["Entitlements flip to REVOKED"] }
  - { method: POST, path: "/wire/subscriptions/{id}/reinstate", description: "Reinstate subscription (does not auto-restore entitlements)", roles: [SalesOps], code: 200, input: [], output: Subscription, side_effects: [] }
  - { method: POST, path: "/wire/subscriptions/{id}/cancel", description: "Cancel subscription (>=3 month minimum)", roles: [SalesOps], code: 200, input: [], output: Subscription, side_effects: ["Entitlements → REVOKED"] }
  - { method: POST, path: "/wire/subscriptions/{id}/renew", description: "Renew for another 12 months", roles: [SalesOps], code: 200, input: [], output: Subscription, side_effects: ["renewal_due_at extended by 12 months", "months_used_current_period reset to 0"] }
  - { method: POST, path: "/wire/subscriptions/{id}/send-renewal-notice", description: "Send renewal notice (must be >= 60 days before renewal_due_at)", roles: [SalesOps], code: 200, input: [], output: Subscription, side_effects: ["renewal_notice_sent_at = current clock"] }

  # --- Entitlement ---
  - { method: POST, path: "/wire/subscriptions/{id}/entitlements", description: "Grant entitlement to a feed for a subscription", roles: [SalesOps], code: 201, input: [feed_id], output: Entitlement, side_effects: [] }
  - { method: GET, path: "/wire/subscriptions/{id}/entitlements", description: "List entitlements for subscription", roles: [PlatformAdmin, SalesOps, Auditor, Billing, SubscriberRep], code: 200, input: ["status?", "limit?", "offset?"], output: "Entitlement[]", side_effects: [] }
  - { method: GET, path: "/wire/entitlements", description: "List entitlements (filtered)", roles: [PlatformAdmin, SalesOps, Auditor, Billing], code: 200, input: ["subscription_id?", "feed_id?", "status?", "limit?", "offset?"], output: "Entitlement[]", side_effects: [] }
  - { method: GET, path: "/wire/entitlements/{id}", description: "Get entitlement", roles: [PlatformAdmin, SalesOps, Auditor, Billing, SubscriberRep], code: 200, input: [], output: Entitlement, side_effects: [] }
  - { method: POST, path: "/wire/entitlements/{id}/revoke", description: "Revoke entitlement", roles: [SalesOps], code: 200, input: [], output: Entitlement, side_effects: [] }

  # --- Article ---
  - { method: POST, path: "/wire/articles", description: "Create draft article", roles: [Editor], code: 201, input: [feed_id, headline, body_word_count, slug, "contributing_member_subscriber_id?"], output: Article, side_effects: [] }
  - { method: GET, path: "/wire/articles", description: "List articles", roles: [PlatformAdmin, Editor, Auditor, Legal], code: 200, input: ["feed_id?", "status?", "embargo_status?", "contributing_member_subscriber_id?", "limit?", "offset?"], output: "Article[]", side_effects: [] }
  - { method: GET, path: "/wire/articles/{id}", description: "Get article", roles: [PlatformAdmin, Editor, Auditor, Legal, SubscriberRep], code: 200, input: [], output: Article, side_effects: [] }
  - { method: POST, path: "/wire/articles/{id}/publish", description: "Publish article; sets published_at and embargo_until", roles: [Editor], code: 200, input: [], output: Article, side_effects: ["embargo_until computed", "If contributing member, member_credit_cents computed and credited to subscriber.member_credit_balance_cents"] }
  - { method: POST, path: "/wire/articles/{id}/embargo", description: "Extend embargo", roles: [Editor], code: 200, input: [new_embargo_until], output: Article, side_effects: ["embargo_until updated"] }
  - { method: POST, path: "/wire/articles/{id}/lift-embargo", description: "Lift embargo early", roles: [Editor], code: 200, input: [], output: Article, side_effects: ["embargo_status = EMBARGO_LIFTED"] }
  - { method: POST, path: "/wire/articles/{id}/withdraw", description: "Withdraw article (Publications flip to AUDIT_FLAGGED)", roles: [Editor], code: 200, input: [], output: Article, side_effects: ["Publications flip RECORDED → AUDIT_FLAGGED"] }
  - { method: POST, path: "/wire/articles/{id}/republish", description: "Republish a withdrawn article; OCC via expected_article_version", roles: [Editor], code: 200, input: [expected_article_version], output: Article, side_effects: ["published_at refreshed", "embargo_until recomputed", "Article.version incremented by 1"] }
  - { method: POST, path: "/wire/articles/{id}/takedown", description: "Legal takedown; cascades to assets and publications; debits member credit", roles: [Legal], code: 200, input: [], output: Article, side_effects: ["Assets → TAKEN_DOWN", "Publications → AUDIT_FLAGGED", "contributing member's credit balance debited by member_credit_cents"] }

  # --- Asset ---
  - { method: POST, path: "/wire/articles/{id}/assets", description: "Attach photo or video asset to article", roles: [Editor], code: 201, input: [kind, rights_scope, file_ref], output: Asset, side_effects: [] }
  - { method: GET, path: "/wire/articles/{id}/assets", description: "List assets of article", roles: [PlatformAdmin, Editor, Auditor, Legal], code: 200, input: ["kind?", "status?", "limit?", "offset?"], output: "Asset[]", side_effects: [] }
  - { method: GET, path: "/wire/assets", description: "List assets (filtered)", roles: [PlatformAdmin, Editor, Auditor, Legal], code: 200, input: ["article_id?", "kind?", "status?", "limit?", "offset?"], output: "Asset[]", side_effects: [] }

  # --- Publication (republication event) ---
  - { method: POST, path: "/wire/publications", description: "Record a subscriber republication; enforces entitlement, embargo, rights", roles: [SubscriberRep], code: 201, input: [subscription_id, article_id], output: Publication, side_effects: ["republish_count_current_month incremented", "billed_amount_cents computed", "within_quota computed"] }
  - { method: GET, path: "/wire/publications", description: "List publications (filter by subscriber_id, subscription_id, article_id, status)", roles: [PlatformAdmin, Auditor, Billing, SubscriberRep], code: 200, input: ["subscriber_id?", "subscription_id?", "article_id?", "status?", "limit?", "offset?"], output: "Publication[]", side_effects: [] }
  - { method: GET, path: "/wire/publications/{id}", description: "Get publication", roles: [PlatformAdmin, Auditor, Billing, SubscriberRep], code: 200, input: [], output: Publication, side_effects: [] }
  - { method: POST, path: "/wire/publications/{id}/flag", description: "Flag publication for audit", roles: [Auditor], code: 200, input: [], output: Publication, side_effects: [] }
  - { method: POST, path: "/wire/publications/{id}/dismiss", description: "Dismiss audit flag; refunds billed_amount to member credit balance", roles: [Auditor], code: 200, input: [], output: Publication, side_effects: ["If billed_amount_cents > 0, subscriber.member_credit_balance_cents += billed_amount_cents"] }

  # --- Invoice ---
  - { method: POST, path: "/wire/subscriptions/{id}/invoices", description: "Generate draft invoice for billing_month", roles: [Billing], code: 201, input: [billing_month], output: Invoice, side_effects: ["base_fee_cents snapshotted", "overage_cents computed", "provisional_total_due_cents computed"] }
  - { method: GET, path: "/wire/subscriptions/{id}/invoices", description: "List invoices for subscription", roles: [PlatformAdmin, Billing, Auditor, SubscriberRep], code: 200, input: ["status?", "limit?", "offset?"], output: "Invoice[]", side_effects: [] }
  - { method: GET, path: "/wire/invoices", description: "List invoices (filtered)", roles: [PlatformAdmin, Billing, Auditor], code: 200, input: ["subscriber_id?", "subscription_id?", "status?", "limit?", "offset?"], output: "Invoice[]", side_effects: [] }
  - { method: GET, path: "/wire/invoices/{id}", description: "Get invoice", roles: [PlatformAdmin, Billing, Auditor, SubscriberRep], code: 200, input: [], output: Invoice, side_effects: [] }
  - { method: POST, path: "/wire/invoices/{id}/issue", description: "Issue invoice (applies member credit)", roles: [Billing], code: 200, input: [], output: Invoice, side_effects: ["member_credit_applied_cents computed and deducted from subscriber balance"] }
  - { method: POST, path: "/wire/invoices/{id}/pay", description: "Mark invoice paid", roles: [Billing], code: 200, input: [], output: Invoice, side_effects: [] }
  - { method: POST, path: "/wire/invoices/{id}/void", description: "Void draft invoice", roles: [Billing], code: 200, input: [], output: Invoice, side_effects: [] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or malformed auth headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced id or FK not found" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "State machine precondition failed (wrong from-state)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC version mismatch on parent entity" }
  - { id: ERR_TEMPORAL_VIOLATION, http: 422, condition: "Embargo, notice, or renewal timing rule violated" }
  - { id: ERR_RIGHTS_VIOLATION, http: 422, condition: "Article TAKEN_DOWN or asset rights_scope incompatible with package.media_rights" }
  - { id: ERR_FORBIDDEN_CROSS_ACCOUNT, http: 403, condition: "SubscriberRep attempting to act on another subscriber's resource" }
  - { id: ERR_AMBIGUOUS_TIER, http: 422, condition: "More than one ACTIVE tier matches subscriber.declared_audience" }
  - { id: ERR_NO_MATCHING_TIER, http: 422, condition: "No ACTIVE tier matches subscriber.declared_audience" }
  - { id: ERR_NO_ENTITLEMENT, http: 422, condition: "No LIVE entitlement for (subscription, feed) at time of republication" }
  - { id: ERR_MIN_COMMITMENT_NOT_MET, http: 422, condition: "Attempted cancel before 3-month minimum" }
  - { id: ERR_FISCAL_INCONSISTENCY, http: 422, condition: "Invoice arithmetic would result in negative total_due_cents or over-application of credit" }
  - { id: ERR_VALIDATION, http: 400, condition: "Required field missing or malformed value (enum, range)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Wire service operator; configures packages, tiers, feeds; can drive logical clock"
    identity: opaque
    exclusive_operations: ["Create/retire packages, tiers, feeds", "Set logical clock"]
    shared_operations: ["Read all entities"]

  - name: SalesOps
    description: "Manages subscribers, subscriptions, entitlements"
    identity: opaque
    exclusive_operations: ["Register/suspend/reinstate/terminate subscribers", "Create/activate/suspend/cancel/renew subscriptions", "Grant/revoke entitlements"]
    shared_operations: ["Read subscribers, subscriptions, invoices, packages, tiers"]

  - name: Editor
    description: "Editorial staff; publishes, embargoes, withdraws articles; attaches assets"
    identity: opaque
    exclusive_operations: ["Create/publish/embargo/withdraw/republish articles", "Attach assets"]
    shared_operations: ["Read articles, feeds"]

  - name: Legal
    description: "Legal; issues takedowns"
    identity: opaque
    exclusive_operations: ["Article takedown"]
    shared_operations: ["Read articles, assets, publications"]

  - name: Auditor
    description: "Reviews republication audit; flags/dismisses"
    identity: opaque
    exclusive_operations: ["Flag publication", "Dismiss flagged publication"]
    shared_operations: ["Read publications, subscribers, subscriptions, invoices"]

  - name: Billing
    description: "Generates and issues invoices"
    identity: opaque
    exclusive_operations: ["Create/issue/pay/void invoices"]
    shared_operations: ["Read subscriptions, invoices, publications"]

  - name: SubscriberRep
    description: "External subscriber representative; records republications and reads own data"
    identity: "entity_backed:Subscriber"
    exclusive_operations: ["Record publication (POST /wire/publications)"]
    shared_operations: ["Read own subscription, publications, invoices, articles"]
