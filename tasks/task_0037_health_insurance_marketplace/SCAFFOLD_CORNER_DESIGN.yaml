        distinguishing_aspect: "A LOSS_OF_COVERAGE SEP submitted on the 20th (after the 15th cutoff) yields effective_date the 1st of the month AFTER next (submitted 2026-06-20 -> 2026-08-01), distinct from BIRTH retroactivity and from the on-or-before-15th rule."
