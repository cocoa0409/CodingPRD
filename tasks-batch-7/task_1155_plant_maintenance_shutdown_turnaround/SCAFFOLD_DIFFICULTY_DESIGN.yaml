          Error-category pair business_safety (priority 9) vs business_temporal
          (priority 10) — a different pair than state-vs-fiscal: assigning a
          SUSPENDED worker to a shift that would also violate the 10h rest gap
          MUST return ERR_BADGE_NOT_CLEARED, not ERR_REST_PERIOD_VIOLATION.
        test_recipe:
