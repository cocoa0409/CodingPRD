      - name: enrollment_file_reparse_after_dispute_recomputes_match_status
        claim_type: projection
        grounds:
          - calculations.enrollment_row_matching
          - state_machines.EnrollmentFile.DISPUTED_to_RECEIVED
          - calculations.capitation_posture_derivation
        distinguishing_aspect: |
          Row matching is a projection over the file's rows that must be
          recomputed from scratch on every RECEIVED -> PARSED pass, not cached
          from the first pass. After a dispute rewinds the file, every row reads
          UNMATCHED and matched_row_count / claimed_capitation_cents are 0; the
          re-parse must project them back to MATCHED / 1 / 20000, and the
          re-reconcile must mint a SECOND CapitationRemittance rather than
          reopening the DISPUTED one. The late-event corner: because the DISPUTED
          remittance is retained as history, capitation_posture stays WITHHELD
          even after the new remittance reconciles — an implementation that
          derives posture from only the newest remittance wrongly reports CURRENT.
        test_recipe:
          setup:
            - "Agreement AGR_C6 ACTIVE with one enrollee C6-0001 (gross 20000) assigned to an ACTIVE physician; file 2026-07 has one matching row and has been driven RECEIVED -> PARSED -> RECONCILED -> DISPUTED -> RECEIVED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: IpaAdmin
            - call: "POST /ipa/delegation-agreements"
              payload: { payer_name: "Corner Reparse Health", payer_tax_id: "94-3000057", delegation_scope: "FULL_RISK", base_pmpm_cents: 20000, reconciliation_method: "ROSTER_SNAPSHOT", ibnr_method: "COMPLETION_FACTOR", ibnr_completion_factor_bps: 8000, target_claims_pmpm_cents: 15000, professional_pool_share_bps: 10000, institutional_pool_share_bps: 0, quality_withhold_bps: 0, stop_loss_attachment_cents: 5000000, reinsurance_recovery_bps: 9000, max_panel_size: 5 }
