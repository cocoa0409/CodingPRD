  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: hearing_window_buffered_closed_interval_touching_rejected
        grounds:
          - validations[ERR_HEARING_WINDOW_CONFLICT].check
          - entities.HearingSession.fields.window_start_at
          - endpoints[POST /siting/hearing-sessions]
        distinguishing_aspect: |
          Resource = the docket calendar of one SitingApplication (HearingSession rows). Interval
          semantics = CLOSED intervals with a 120-minute buffer applied to the NEW session only, and
          touching endpoints count as intersecting: against an existing 09:00-12:00 session, a
          14:00-16:00 session buffers to [12:00, 18:00] and is refused because 12:00 touches, while
          14:01-16:01 buffers to [12:01, 18:01] and is accepted. One minute separates the two outcomes.
