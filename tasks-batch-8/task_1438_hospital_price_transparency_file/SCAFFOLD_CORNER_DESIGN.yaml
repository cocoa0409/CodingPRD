            - { call: "POST /transparency/service-items", payload: { facility_id: "${fac}", code: "70551", code_type: "CPT", description: "MRI", service_class: "SHOPPABLE", gross_charge_cents: 100000 }, as: TransparencyOfficer, captures: { si: $.data.id } }
            - { call: "POST /transparency/publication-cycles", payload: { facility_id: "${fac}", cycle_type: "MONTHLY", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", schema_version: "v2.0.0" }, as: TransparencyOfficer, captures: { cy: $.data.id } }
            - { call: "POST /transparency/standard-charge-records", payload: { facility_id: "${fac}", publication_cycle_id: "${cy}", service_item_id: "${si}", discounted_cash_cents: 50000 }, as: TransparencyOfficer, captures: { r1: $.data.id } }
          trigger:
            - { call: "POST /transparency/standard-charge-records", payload: { facility_id: "${fac}", publication_cycle_id: "${cy}", service_item_id: "${si}", discounted_cash_cents: 49000, supersedes_id: "${r1}" }, as: TransparencyOfficer, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_SUPERSEDE_TARGET_INVALID (http 422) — R1 is DRAFT, not PUBLISHED/FLAGGED"]

      - name: sod_approver_must_differ_from_proposer
        claim_type: conditional_validation
        grounds: ["validations[priority=5]", "errors[ERR_SOD_SAME_USER]", "state_machines.DiscrepancyReport.CORRECTION_PROPOSED_to_CORRECTION_APPROVED"]
        distinguishing_aspect: "Segregation of duties, step 1: the officer who proposed (officer-a) cannot approve their own correction; the same payload from officer-b succeeds."
        test_recipe:
          setup: ["Facility F; contract+rate ACTIVE; item SI; cycle PUBLISHED with record R1; discrepancy D CONFIRMED; correction proposed by officer-a"]
          setup_api_calls:
            - { call: "POST /transparency/facilities", payload: { name: "F", cms_certification_number: "CCN-H8", bed_count: 50 }, as: PlatformAdmin, captures: { fac: $.data.id } }
