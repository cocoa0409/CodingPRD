            - "after the refusal GET /irrigation-runs?pump_station_id=${pump_id} returns total_count == 0 and PumpStation.${pump_id}.withdrawn_today_gal == 0"
            - "the retry returns HTTP 201 with ${allotted} == 341.0 (10 * 5.5 * 6.2, posture factor 1.00, headroom 50000) and ${flow} == 5.68 (341.0 / 60 rounded half-up from 5.68333)"
            - "IrrigationRun.${run_id}.status == SCHEDULED, volume_gal == 0 and version == 1, and PumpStation.${pump_id}.version is still 3: scheduling a run does not itself write the station"

      - name: every_write_increments_the_entity_version
        claim_type: optimistic_concurrency
        grounds:
          - complexity_profile.complexity_layers
          - endpoints[PATCH /courses/{id}/water-allocation]
        distinguishing_aspect: "Two successive allocation revisions that change different fields each bump Course.version by exactly one, and a revision that leaves the derived posture where it was still counts as a write — version is a write counter, not a change detector."
        test_recipe:
          setup:
            - "One course with a 500000 gal allocation and no water use."
          setup_api_calls:
            - call: "POST /courses"
              payload: { name: "Cedar Ridge GC", region_code: "OR", annual_water_allocation_gal: 500000 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { course_id: $.data.id, v_create: $.data.version }
          trigger:
            - call: "PATCH /courses/${course_id}/water-allocation"
              payload: { annual_water_allocation_gal: 400000 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { v_first: $.data.version, posture_first: $.data.water_posture }
            - call: "PATCH /courses/${course_id}/water-allocation"
              payload: { water_restricted_threshold_pct: 75 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { v_second: $.data.version, posture_second: $.data.water_posture }
            - call: "GET /courses/${course_id}"
              payload: {}
              as: Superintendent
              as_user_id: "super-1"
              captures: { v_read: $.data.version }
          assert:
            - "${v_create} == 1, ${v_first} == 2 and ${v_second} == 3: one increment per write, never two"
            - "${posture_first} == OPEN and ${posture_second} == OPEN: with water_used_gal == 0 the posture cannot move, yet the version still advanced"
            - "${v_read} == 3: the read does not increment the version"
            - "Course.${course_id}.annual_water_allocation_gal == 400000 and water_restricted_threshold_pct == 75: each PATCH touched only the field it named"

      - name: cumulative_service_threshold_fires_at_exactly_the_interval_and_resets
        claim_type: rate_threshold_triggers
        grounds:
          - state_machines.EquipmentUnit.IN_SERVICE_to_DOWN_FOR_SERVICE
          - state_machines.EquipmentUnit.DOWN_FOR_SERVICE_to_IN_SERVICE
          - calculations.equipment_replacement_score
          - validations[priority=22]
        distinguishing_aspect: "The cumulative meter threshold is exercised on both sides of its inclusive boundary (249 h stays IN_SERVICE, 250 h auto-transitions) and then RESET by a service, after which a second 250 h accrual re-fires it — proving hours_since_service, not engine_hours, is the trigger, while both replacement-score variants keep tracking the ever-growing engine meter."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z, so 152 whole days remain to the 12-31 fiscal year end."
            - "One course and two identical current-model-year triplex mowers: 6000 h design life, 250 h service interval, 3.5 h average day, no initial hours."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: Superintendent
              as_user_id: "super-1"
            - call: "POST /courses"
              payload: { name: "Cedar Ridge GC", region_code: "OR", annual_water_allocation_gal: 500000 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { course_id: $.data.id }
            - call: "POST /equipment-units"
              payload: { course_id: "${course_id}", unit_type: "TRIPLEX_GREENS_MOWER", model_year: 2026, purchase_cost: 48000, expected_life_hours: 6000, service_interval_hours: 250, avg_daily_hours: 3.5 }
              as: EquipmentTechnician
              as_user_id: "tech-1"
              captures: { unit_a_id: $.data.id }
            - call: "POST /equipment-units"
              payload: { course_id: "${course_id}", unit_type: "TRIPLEX_GREENS_MOWER", model_year: 2026, purchase_cost: 48000, expected_life_hours: 6000, service_interval_hours: 250, avg_daily_hours: 3.5 }
              as: EquipmentTechnician
              as_user_id: "tech-1"
              captures: { unit_b_id: $.data.id }
          trigger:
            - call: "POST /equipment-units/${unit_a_id}/log-hours"
              payload: { hours_added: 250 }
              as: EquipmentTechnician
              as_user_id: "tech-1"
              captures: { a_status: $.data.status, a_score: $.data.replacement_score, a_proj: $.data.replacement_score_projected, a_flag: $.data.replacement_flag }
            - call: "POST /equipment-units/${unit_b_id}/log-hours"
              payload: { hours_added: 249 }
              as: EquipmentTechnician
              as_user_id: "tech-1"
              captures: { b_status: $.data.status, b_score: $.data.replacement_score, b_proj: $.data.replacement_score_projected }
            - call: "POST /equipment-units/${unit_a_id}/service"
              payload: { service_note: "Reels backlapped, oil and filters." }
              as: EquipmentTechnician
              as_user_id: "tech-1"
              captures: { a_status_after: $.data.status, a_hss_after: $.data.hours_since_service, a_score_after: $.data.replacement_score }
            - call: "POST /equipment-units/${unit_a_id}/log-hours"
              payload: { hours_added: 250 }
              as: EquipmentTechnician
              as_user_id: "tech-1"
              captures: { a_status_refire: $.data.status, a_score_refire: $.data.replacement_score, a_proj_refire: $.data.replacement_score_projected }
          assert:
            - "${a_status} == DOWN_FOR_SERVICE: hours_since_service 250 meets the 250 h interval and the threshold is inclusive"
            - "${a_score} == 21.9 (100 * (0.45 * 250/6000 + 0.35 * 0/10 + 0.20 * 1.0) = 21.875, half-up at one decimal) and ${a_proj} == 25.9 (projected hours 250 + 3.5 * 152 = 782)"
            - "${a_flag} == false: 25.9 is below REPLACEMENT_FLAG_THRESHOLD 70, and the flag reads the projection, never the point-in-time score"
            - "${b_status} == IN_SERVICE at 249 h: one hour below the interval does not fire"
            - "${b_score} == 21.8 (21.7875) and ${b_proj} == 25.8 (25.7775): the two units differ by a single logged hour"
            - "${a_status_after} == IN_SERVICE, ${a_hss_after} == 0, EquipmentUnit.${unit_a_id}.engine_hours_at_last_service == 250 and engine_hours == 250: the service resets the interval counter without touching the lifetime meter"
            - "${a_score_after} == 1.9 (the overdue term collapses to 0, leaving 100 * 0.45 * 250/6000 = 1.875)"
            - "${a_status_refire} == DOWN_FOR_SERVICE: after the reset a second 250 h accrual re-fires the same threshold at engine_hours 500"
            - "${a_score_refire} == 23.8 (23.75) and ${a_proj_refire} == 27.7 (27.74, projected hours 1032)"
            - "a service attempt on the IN_SERVICE unit B returns 409 ERR_EQUIPMENT_STATE_INVALID"

      - name: instantaneous_threshold_boundary_is_inclusive
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers
          - validations[priority=32]
        excluded_because:
          difficulty_instance: boundary_precision_check / window_start_exactly_at_rei_expiry_is_admitted
          rationale: "That §1.8 instance is the instantaneous half of this layer: it puts a crew window one minute inside, exactly on and one minute past the restricted-entry expiry instant, so the inclusive-at-the-boundary claim is already asserted there (and the product wind limit is covered again in the validations section)."

      - name: cascading_side_effect_chain_verified_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
          - state_machines.WeatherEvent
          - state_machines.MaintenanceWindow
          - state_machines.PlanTask
        excluded_because:
          difficulty_instance: transitive_cascade / frost_declaration_defers_window_reverts_task_and_debits_ledger
          rationale: "That §1.8 instance walks the full three-hop chain (weather -> window -> task -> plan ledger) and asserts every intermediate row, which is exactly this layer's end-to-end claim; ordering sensitivity is covered by compensating_invariant / nitrogen_ledger_returns_to_its_exact_value_after_defer_and_reschedule."

      - name: both_calculation_variants_produce_their_expected_results
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
          - calculations.turf_nitrogen_load
          - calculations.equipment_replacement_score
        excluded_because:
          difficulty_instance: dual_variant_calc / turf_nitrogen_applied_actual_vs_planned_commitment
          rationale: "That §1.8 instance asserts both variants on one TurfArea at the same instant and the delta when a schedule and an application move them apart; the equipment pair is asserted by dual_variant_calc / equipment_replacement_score_now_vs_fiscal_year_projection."

  # =========================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_of_every_recomputed_field_in_the_same_request
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /plan-tasks/{id}/schedule]
          - calculations.plan_nitrogen_commitment_lb
          - calculations.turf_nitrogen_load
        distinguishing_aspect: "consistency_model is immediate, so the four side effects of a single schedule call — the task's own transition, the plan ledger, the turf projection and the window's back-reference — are all readable with no intervening write and no settling delay; the response body itself already carries the transitioned task rather than a queued acknowledgement."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One course with a 5500 sq ft GREEN on hole 12."
            - "One ACTIVE 2026 plan with a 40.00 lb budget carrying one PLANNED FERTILITY task at 0.85 lb/1000, and one SCHEDULED two-hour window on that green."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: Superintendent
              as_user_id: "super-1"
            - call: "POST /courses"
              payload: { name: "Cedar Ridge GC", region_code: "OR", annual_water_allocation_gal: 500000 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { course_id: $.data.id }
            - call: "POST /turf-areas"
              payload: { course_id: "${course_id}", area_type: "GREEN", hole_number: 12, area_sq_ft: 5500, mowing_height_mm: 3.2, distance_to_water_ft: 60, soil_type: "SAND_USGA" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { green12_id: $.data.id }
            - call: "POST /agronomic-plans"
              payload: { course_id: "${course_id}", plan_year: 2026, nitrogen_budget_lb: 40.00 }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { plan_id: $.data.id }
            - call: "POST /plan-tasks"
              payload: { plan_id: "${plan_id}", turf_area_id: "${green12_id}", task_type: "FERTILITY", nitrogen_lb_per_1000: 0.85, planned_window_start: "2026-08-01T00:00:00Z", planned_window_end: "2026-08-31T00:00:00Z" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { task_id: $.data.id }
            - call: "POST /maintenance-windows"
              payload: { course_id: "${course_id}", turf_area_id: "${green12_id}", task_type: "FERTILITY", window_start: "2026-08-10T06:00:00Z", window_end: "2026-08-10T08:00:00Z", crew_size: 3 }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { window_id: $.data.id }
            - call: "POST /agronomic-plans/${plan_id}/submit"
              payload: {}
              as: Agronomist
              as_user_id: "agro-1"
              captures: { plan_v_submitted: $.data.version }
            - call: "POST /agronomic-plans/${plan_id}/approve"
              payload: { expected_plan_version: "${plan_v_submitted}" }
              as: Superintendent
              as_user_id: "super-1"
              captures: { plan_v_active: $.data.version }
          trigger:
            - call: "POST /plan-tasks/${task_id}/schedule"
              payload: { maintenance_window_id: "${window_id}", expected_plan_version: "${plan_v_active}" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { resp_status: $.data.status, resp_version: $.data.version, resp_commitment: $.data.commitment_lb }
            - call: "GET /agronomic-plans/${plan_id}"
              payload: {}
              as: Agronomist
              as_user_id: "agro-1"
              captures: { committed_now: $.data.committed_nitrogen_lb, plan_v_now: $.data.version }
            - call: "GET /turf-areas/${green12_id}"
              payload: {}
              as: Agronomist
              as_user_id: "agro-1"
              captures: { projected_now: $.data.nitrogen_projected_lb_per_1000, applied_now: $.data.nitrogen_applied_lb_per_1000_ytd, turf_v_now: $.data.version }
            - call: "GET /maintenance-windows/${window_id}"
              payload: {}
              as: Agronomist
              as_user_id: "agro-1"
              captures: { window_task: $.data.plan_task_id, window_v_now: $.data.version, window_crew_hours: $.data.crew_hours }
          assert:
            - "${resp_status} == SCHEDULED, ${resp_version} == 2 and ${resp_commitment} == 4.68: the transition is already reflected in the very response that caused it"
            - "${committed_now} == 4.68 and ${plan_v_now} == 4 on the first read after the call, with no second write needed to settle the ledger"
            - "${projected_now} == 0.850 and ${turf_v_now} == 3: the projection was recomputed at task creation (version 2) and again by the schedule (version 3), and its value is unchanged because PLANNED and SCHEDULED tasks both count"
            - "${applied_now} == 0.000: nothing is in the ground yet, so the applied_actual variant does not move with the schedule"
            - "${window_task} == ${task_id}, ${window_v_now} == 2 and ${window_crew_hours} == 6.00 (3 crew x 2 h)"
            - "every one of the four assertions above holds on the first read; no value is observed to change on a repeated read"

      - name: cascade_side_effects_are_visible_immediately_after_the_declaring_call
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.WeatherEvent
        excluded_because:
          difficulty_instance: transitive_cascade / frost_declaration_defers_window_reverts_task_and_debits_ledger
          rationale: "That §1.8 instance reads the window, the task and the plan ledger straight after the declaring POST /weather-events and requires all three hops to be already applied, which is the immediate-consistency claim for a multi-entity cascade."

