        distinguishing_aspect: |
          Metric: drawer balance vs drawer_limit_cents; endpoint: sell-to-vault
          (a different metric and endpoint than the CTR boundary). A sell that
          would leave the drawer AT the limit (== 100000) is rejected; leaving
          it one cent below (99999) succeeds.
        test_recipe:
          setup:
            - "Branch B with drawer_limit_cents 100000; teller T with OPEN drawer; account A"
            - "A 150000 cash deposit has pushed the drawer to 150000 (over the limit)"
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "B", drawer_limit_cents: 100000, vault_cash_cents: 50000000, over_short_investigation_threshold_cents: 1000 }
