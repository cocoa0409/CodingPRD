            - { call: "POST /awareness/phishing-templates/${t_bad}/block", payload: { blocked_reason: "Second block attempt." }, as: ProgramAdmin }
            - { call: "POST /awareness/phishing-templates/${t_bad}/approve-for-use", payload: {}, as: CampaignApprover, as_user_id: "approver-1" }
          assert:
            - "the second approve-for-use returns HTTP 409 with error_id ERR_TEMPLATE_STATE_INVALID"
            - "PhishingTemplate.${t_ok}.version is still ${t_ok_v} and review_state is still APPROVED_FOR_USE"
            - "the second block returns HTTP 409 ERR_TEMPLATE_STATE_INVALID and the original blocked_reason is preserved"
            - "approving the BLOCKED template also returns HTTP 409 ERR_TEMPLATE_STATE_INVALID: BLOCKED is not a route back to usable"

