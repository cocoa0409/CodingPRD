# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3292_sponsored_job_budget_pacing_employer_signals_apply
#
# Machine-readable index of every difficulty feature the §1.1–§1.7 scaffold
# claims to exhibit, cross-referenced against the nine Difficulty Rules (§0.5).
# This file is transcribed verbatim into pytest fixtures by the downstream
# unit-test-generator; every `${var}` resolves to a `captures:` line earlier in
# the same instance, and every call resolves to a §1.5 endpoint.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual_variant_calc (>= 2 instances, different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: pacing_multiplier_scheduled_vs_realized_diverge_for_fresh_campaign
        grounds:
          - calculations.campaign_pacing_multiplier
          - calculations.realized_pacing_multiplier
          - entities.SponsoredJob.fields.scheduled_pacing_multiplier
          - entities.SponsoredJob.fields.realized_pacing_multiplier
          - endpoints.POST_/api/_clock/set_current_utc
        distinguishing_aspect: "For identical campaign spend data (daily_spent_cents 0 of daily_budget_cents 100000) at the same instant (18:00Z, elapsed_fraction 0.75), the scheduled multiplier is 1.75 while the realized multiplier is 1.0 — the two variants operate on the SponsoredJob domain and strand 3-decimal values 32 hours apart."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One ACTIVE employer, one ACTIVE CPC campaign with daily_budget_cents 100000 and total_budget_cents 1000000. One ACTIVE posting. No spend yet."
          setup_api_calls:
            - call: "POST /api/employers"
              payload: { legal_name: "PaceCo", domain: "pace.example", ats_provider: "GREENHOUSE" }
              as: PlatformAdmin
              captures: { emp_p: $.data.id }
            - call: "POST /api/campaigns"
              payload: { employer_id: "${emp_p}", name: "Always-On Engineering", pricing_model: "CPC", daily_budget_cents: 100000, total_budget_cents: 1000000 }
              as: Employer
              as_user_id: "${emp_p}"
              captures: { camp_p: $.data.id }
            - call: "POST /api/campaigns/${camp_p}/activate"
              payload: {}
              as: Employer
              as_user_id: "${emp_p}"
            - call: "POST /api/job-postings"
              payload: { employer_id: "${emp_p}", title: "Staff Site Reliability Engineer", location: "Austin, TX", description_text: "Own reliability for the job marketplace.", apply_mode: "HOSTED" }
              as: Employer
              as_user_id: "${emp_p}"
              captures: { post_p: $.data.id }
            - call: "POST /api/sponsored-jobs"
              payload: { campaign_id: "${camp_p}", job_posting_id: "${post_p}", cpc_bid_cents: 200, cpa_bid_cents: 900 }
              as: Employer
              as_user_id: "${emp_p}"
              captures: { sj_p: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T18:00:00Z" }
              as: PlatformAdmin
              captures: { camp_v_p: $.data.day_open_date }
          trigger:
            - call: "GET /api/sponsored-jobs/${sj_p}"
              payload: {}
              as: Employer
              as_user_id: "${emp_p}"
          assert:
            - "SponsoredJob.${sj_p}.scheduled_pacing_multiplier == 1.75"
            - "SponsoredJob.${sj_p}.realized_pacing_multiplier == 1.0"
            - "the two multipliers differ; scheduled is 0.75 above realized for the same spend data"
            - "Campaign.${camp_p}.daily_spent_cents == 0 and daily_budget_cents == 100000"

      - name: quality_signal_dual_variant_same_history_two_scores
        grounds:
          - calculations.employer_quality_signal
          - entities.Employer.fields.quality_score
          - entities.Employer.fields.response_rate_bps
          - state_machines.Application.COMPLETED_to_CLOSED
        distinguishing_aspect: "An employer with one responded application (REVIEWED) and one completed-but-unanswered application scores 100 while that second application is still COMPLETED, and 70 the moment it is CLOSED without a response — the response-rate-only tier (5000 bps -> tier 70) diverges from the all-responsive snapshot (10000 bps -> tier 100) for the same underlying applications."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One ACTIVE employer, one ACTIVE posting, two seekers, two applications: app A COMPLETED then dispositioned REVIEWED; app B COMPLETED and still unanswered."
          setup_api_calls:
            - call: "POST /api/employers"
              payload: { legal_name: "SignalCo", domain: "signal.example", ats_provider: "LEVER" }
              as: PlatformAdmin
              captures: { emp_q: $.data.id }
            - call: "POST /api/job-seekers"
              payload: { email: "qa@seek.example", full_name: "Quinn A", location: "Austin, TX" }
              as: PlatformAdmin
              captures: { seek_q: $.data.id }
            - call: "POST /api/job-postings"
              payload: { employer_id: "${emp_q}", title: "Data Platform Engineer", location: "Austin, TX", description_text: "Build the jobs data platform.", apply_mode: "HOSTED" }
              as: Employer
              as_user_id: "${emp_q}"
              captures: { post_q: $.data.id }
            - call: "POST /api/applications"
              payload: { job_posting_id: "${post_q}", job_seeker_id: "${seek_q}" }
              as: JobSeeker
              as_user_id: "${seek_q}"
              captures: { appl_a: $.data.id }
            - call: "POST /api/applications/${appl_a}/complete"
              payload: {}
              as: JobSeeker
              as_user_id: "${seek_q}"
            - call: "POST /api/applications/${appl_a}/disposition"
              payload: { disposition: "REVIEWED" }
              as: Employer
              as_user_id: "${emp_q}"
            - call: "POST /api/applications"
              payload: { job_posting_id: "${post_q}", job_seeker_id: "${seek_q}" }
              as: JobSeeker
              as_user_id: "${seek_q}"
              captures: { appl_b: $.data.id }
            - call: "POST /api/applications/${appl_b}/complete"
              payload: {}
              as: JobSeeker
              as_user_id: "${seek_q}"
            - call: "GET /api/employers/${emp_q}"
              payload: {}
              as: PlatformAdmin
              captures: { q_before: $.data.quality_score, rr_before: $.data.response_rate_bps }
          trigger:
            - call: "POST /api/applications/${appl_b}/close"
              payload: {}
              as: Employer
              as_user_id: "${emp_q}"
          assert:
            - "before the close, ${q_before} == 100 and ${rr_before} == 10000"
            - "after the close, Employer.${emp_q}.response_rate_bps == 5000"
            - "after the close, Employer.${emp_q}.quality_score == 70"
            - "the score diverges by 30 between the two variants for the same pair of applications"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (>= 2 instances, different modes a/b/c)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: auction_clearing_price_gsp_with_quality_tilt_mode_a
        grounds:
          - calculations.auction_clearing_price
          - calculations.employer_quality_signal
          - entities.Employer.fields.quality_score
        distinguishing_aspect: "Mode (a): the clearing price has four inputs (runner-up effective bid, bidder quality_score, bidder bid, ceiling) interacting non-linearly through rank = effective_bid * quality/100 and a two-sided min/max clamp; with a runner-up rank of 210 and bidder quality 100 the price is min(max(ceil(210+1),1),500) == 211, not the 300+1 that a quality-blind second-price rule would charge."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Employer A (quality 100) and Employer B (quality 70 after one closed-unanswered application) each own an ACTIVE CPC campaign; two ELIGIBLE sponsored jobs with cpc_bid 300. The clearing event runs on employer A's campaign."
          setup_api_calls:
            - call: "POST /api/employers"
              payload: { legal_name: "AuctionA", domain: "a.example", ats_provider: "NONE" }
              as: PlatformAdmin
              captures: { emp_ca: $.data.id }
            - call: "POST /api/employers"
              payload: { legal_name: "AuctionB", domain: "b.example", ats_provider: "NONE" }
              as: PlatformAdmin
              captures: { emp_cb: $.data.id }
            - call: "POST /api/job-seekers"
              payload: { email: "cc@seek.example", full_name: "Casey C", location: "Austin, TX" }
              as: PlatformAdmin
              captures: { seek_c: $.data.id }
            - call: "POST /api/job-postings"
              payload: { employer_id: "${emp_ca}", title: "Backend Engineer", location: "Austin, TX", description_text: "Build auction services.", apply_mode: "HOSTED" }
              as: Employer
              as_user_id: "${emp_ca}"
              captures: { post_ca: $.data.id }
            - call: "POST /api/job-postings"
              payload: { employer_id: "${emp_cb}", title: "Backend Engineer", location: "Austin, TX", description_text: "Build auction services.", apply_mode: "HOSTED" }
              as: Employer
              as_user_id: "${emp_cb}"
              captures: { post_cb: $.data.id }
            - call: "POST /api/campaigns"
              payload: { employer_id: "${emp_ca}", name: "CA", pricing_model: "CPC", daily_budget_cents: 300000, total_budget_cents: 3000000 }
              as: Employer
              as_user_id: "${emp_ca}"
              captures: { camp_ca: $.data.id }
            - call: "POST /api/campaigns"
              payload: { employer_id: "${emp_cb}", name: "CB", pricing_model: "CPC", daily_budget_cents: 300000, total_budget_cents: 3000000 }
              as: Employer
              as_user_id: "${emp_cb}"
              captures: { camp_cb: $.data.id }
            - call: "POST /api/campaigns/${camp_ca}/activate"
              payload: {}
              as: Employer
              as_user_id: "${emp_ca}"
            - call: "POST /api/campaigns/${camp_cb}/activate"
              payload: {}
              as: Employer
              as_user_id: "${emp_cb}"
            - call: "POST /api/sponsored-jobs"
              payload: { campaign_id: "${camp_ca}", job_posting_id: "${post_ca}", cpc_bid_cents: 300, cpa_bid_cents: 900 }
              as: Employer
              as_user_id: "${emp_ca}"
              captures: { sj_ca: $.data.id }
            - call: "POST /api/sponsored-jobs"
              payload: { campaign_id: "${camp_cb}", job_posting_id: "${post_cb}", cpc_bid_cents: 300, cpa_bid_cents: 900 }
              as: Employer
              as_user_id: "${emp_cb}"
              captures: { sj_cb: $.data.id }
            - call: "POST /api/applications"
              payload: { job_posting_id: "${post_cb}", job_seeker_id: "${seek_c}" }
              as: JobSeeker
              as_user_id: "${seek_c}"
              captures: { appl_c: $.data.id }
            - call: "POST /api/applications/${appl_c}/complete"
              payload: {}
              as: JobSeeker
              as_user_id: "${seek_c}"
            - call: "POST /api/applications/${appl_c}/close"
              payload: {}
              as: Employer
              as_user_id: "${emp_cb}"
            - call: "GET /api/campaigns/${camp_ca}"
              payload: {}
              as: Employer
              as_user_id: "${emp_ca}"
              captures: { camp_ca_v: $.data.version }
            - call: "GET /api/employers/${emp_cb}"
              payload: {}
              as: PlatformAdmin
              captures: { q_b: $.data.quality_score }
          trigger:
            - call: "POST /api/events"
              payload: { campaign_id: "${camp_ca}", sponsored_job_id: "${sj_ca}", event_type: "CLICK", device_fingerprint: "fp-ca-1", ip_hash: "ip-ca-1", expected_campaign_version: "${camp_ca_v}" }
              as: PlatformAdmin
          assert:
            - "Employer.${emp_cb}.quality_score == 70"
            - "the runner-up rank is 210 (cpc_bid_cents 300 * 70/100)"
            - "the SponsorEvent cost_cents == 211"
            - "the cost is below both the bidder bid of 300 and the ceiling of 500, proving the quality tilt lowered the clearing price"

      - name: budget_commit_split_waterfall_rounding_order_mode_b
        grounds:
          - calculations.budget_commit_split
          - calculations.auction_clearing_price
          - entities.BudgetLedger.fields.amount_cents
        distinguishing_aspect: "Mode (b): the cleared charge is allocated across ACTIVE pacing holds oldest-first (created_at ASC) with the remainder committed directly; the 401-cent charge consumes a 200-cent hold and a second 200-cent hold and then commits the 1-cent remainder as a third ledger entry, so the split order and per-hold remainder — not a single rounded total — determine the ledger rows."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One ACTIVE CPC campaign; two ACTIVE pacing holds of 400 cents each on two sponsored jobs; the campaign is ACTIVE with expected_campaign_version available."
          setup_api_calls:
            - call: "POST /api/employers"
              payload: { legal_name: "WaterfallCo", domain: "wf.example", ats_provider: "NONE" }
              as: PlatformAdmin
              captures: { emp_w: $.data.id }
            - call: "POST /api/job-postings"
              payload: { employer_id: "${emp_w}", title: "Platform Engineer", location: "Remote", description_text: "Own the platform.", apply_mode: "HOSTED" }
              as: Employer
              as_user_id: "${emp_w}"
              captures: { post_w1: $.data.id }
            - call: "POST /api/job-postings"
              payload: { employer_id: "${emp_w}", title: "Platform Engineer II", location: "Remote", description_text: "Own the platform two.", apply_mode: "HOSTED" }
              as: Employer
              as_user_id: "${emp_w}"
              captures: { post_w2: $.data.id }
            - call: "POST /api/campaigns"
              payload: { employer_id: "${emp_w}", name: "WF", pricing_model: "CPC", daily_budget_cents: 300000, total_budget_cents: 3000000 }
              as: Employer
              as_user_id: "${emp_w}"
              captures: { camp_w: $.data.id }
            - call: "POST /api/campaigns/${camp_w}/activate"
              payload: {}
              as: Employer
              as_user_id: "${emp_w}"
            - call: "POST /api/sponsored-jobs"
              payload: { campaign_id: "${camp_w}", job_posting_id: "${post_w1}", cpc_bid_cents: 500, cpa_bid_cents: 900 }
              as: Employer
              as_user_id: "${emp_w}"
              captures: { sj_w1: $.data.id }
            - call: "POST /api/sponsored-jobs"
              payload: { campaign_id: "${camp_w}", job_posting_id: "${post_w2}", cpc_bid_cents: 400, cpa_bid_cents: 900 }
              as: Employer
              as_user_id: "${emp_w}"
              captures: { sj_w2: $.data.id }
            - call: "POST /api/sponsored-jobs/${sj_w1}/pacing-holds"
              payload: { amount_cents: 200 }
              as: Employer
              as_user_id: "${emp_w}"
              captures: { hold_w1: $.data.id }
            - call: "POST /api/sponsored-jobs/${sj_w2}/pacing-holds"
              payload: { amount_cents: 200 }
              as: Employer
              as_user_id: "${emp_w}"
              captures: { hold_w2: $.data.id }
            - call: "GET /api/campaigns/${camp_w}"
              payload: {}
              as: Employer
              as_user_id: "${emp_w}"
              captures: { camp_w_v: $.data.version }
          trigger:
            - call: "POST /api/events"
              payload: { campaign_id: "${camp_w}", sponsored_job_id: "${sj_w1}", event_type: "CLICK", device_fingerprint: "fp-w-1", ip_hash: "ip-w-1", expected_campaign_version: "${camp_w_v}" }
              as: PlatformAdmin
          assert:
            - "the SponsorEvent cost_cents == 401 (second-price: runner-up rank 400, bidder quality 100 -> 400+1)"
            - "PacingHold.${hold_w1}.status == COMMITTED and PacingHold.${hold_w2}.status == COMMITTED"
            - "Campaign.${camp_w}.spent_cents == 401 and held_cents == 0"
            - "the BudgetLedger holds three COMMIT entries of 200, 200 and 1 in created_at order"
            - "the third COMMIT entry is the direct remainder beyond the reserved holds, not a rounded share of the total"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (>= 2 instances, different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: campaign_budget_cycle_returns_to_active_and_completes
        grounds:
          - state_machines.Campaign.ACTIVE_to_PACING_HOLD
          - state_machines.Campaign.PACING_HOLD_to_ACTIVE
          - state_machines.Campaign.PACING_HOLD_to_COMPLETED
          - state_machines.Campaign.PAUSED_to_ACTIVE
        distinguishing_aspect: "The Campaign machine is cyclic and branch-convergent: ACTIVE -> PACING_HOLD -> (ACTIVE on day rollover, or PAUSED, or COMPLETED on total exhaustion) -> ACTIVE, so the same entity re-enters ACTIVE three distinct ways rather than moving along a linear pipeline."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One ACTIVE employer and one ACTIVE CPC campaign with daily_budget_cents 6000 and total_budget_cents 10000; one ACTIVE posting and one ELIGIBLE sponsored job."
          setup_api_calls:
            - call: "POST /api/employers"
              payload: { legal_name: "CycleCo", domain: "cycle.example", ats_provider: "NONE" }
              as: PlatformAdmin
              captures: { emp_cy: $.data.id }
            - call: "POST /api/job-postings"
              payload: { employer_id: "${emp_cy}", title: "Cyclic Engineer", location: "Austin, TX", description_text: "Cycle the budget.", apply_mode: "HOSTED" }
              as: Employer
              as_user_id: "${emp_cy}"
              captures: { post_cy: $.data.id }
            - call: "POST /api/campaigns"
              payload: { employer_id: "${emp_cy}", name: "CY", pricing_model: "CPC", daily_budget_cents: 6000, total_budget_cents: 10000 }
              as: Employer
              as_user_id: "${emp_cy}"
              captures: { camp_cy: $.data.id }
            - call: "POST /api/campaigns/${camp_cy}/activate"
              payload: {}
              as: Employer
              as_user_id: "${emp_cy}"
            - call: "POST /api/sponsored-jobs"
              payload: { campaign_id: "${camp_cy}", job_posting_id: "${post_cy}", cpc_bid_cents: 6000, cpa_bid_cents: 900 }
              as: Employer
              as_user_id: "${emp_cy}"
              captures: { sj_cy: $.data.id }
            - call: "GET /api/campaigns/${camp_cy}"
              payload: {}
              as: Employer
              as_user_id: "${emp_cy}"
              captures: { camp_cy_v: $.data.version }
          trigger:
            - call: "POST /api/events"
              payload: { campaign_id: "${camp_cy}", sponsored_job_id: "${sj_cy}", event_type: "CLICK", device_fingerprint: "fp-cy-1", ip_hash: "ip-cy-1", expected_campaign_version: "${camp_cy_v}" }
              as: PlatformAdmin
            - call: "GET /api/campaigns/${camp_cy}"
              payload: {}
              as: Employer
              as_user_id: "${emp_cy}"
              captures: { cy_status_spent: $.data.status, cy_daily_after: $.data.daily_spent_cents }
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /api/campaigns/${camp_cy}"
              payload: {}
              as: Employer
              as_user_id: "${emp_cy}"
              captures: { cy_status_rolled: $.data.status, cy_daily_rolled: $.data.daily_spent_cents, camp_cy_v2: $.data.version }
            - call: "POST /api/events"
              payload: { campaign_id: "${camp_cy}", sponsored_job_id: "${sj_cy}", event_type: "CLICK", device_fingerprint: "fp-cy-2", ip_hash: "ip-cy-2", expected_campaign_version: "${camp_cy_v2}" }
              as: PlatformAdmin
          assert:
            - "after the first click ${cy_status_spent} == \"PACING_HOLD\" and ${cy_daily_after} == 6000 == daily_budget_cents"
            - "after the 2026-09-02T00:00:00Z rollover ${cy_status_rolled} == \"ACTIVE\" and ${cy_daily_rolled} == 0"
            - "after the second click Campaign.${camp_cy}.spent_cents == 12000 >= total_budget_cents 10000"
            - "Campaign.${camp_cy}.status == COMPLETED"
            - "the campaign re-entered ACTIVE once via the day rollover and reached terminal COMPLETED once"

      - name: job_posting_state_reexpires_and_revives_via_supersession
        grounds:
          - state_machines.JobPosting.ACTIVE_to_EXPIRED
          - state_machines.JobPosting.DRAFT_to_ACTIVE
          - calculations.posting_freshness
        distinguishing_aspect: "JobPosting.state is compound and non-linear: it is derived from the newest JobPostingVersion.freshness, so an ACTIVE posting decays ACTIVE -> STALE -> EXPIRED and a fresh re-ingestion revives it back to ACTIVE — the entity revisits ACTIVE after being EXPIRED rather than following a one-way pipeline."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One ACTIVE employer; one ACTIVE posting ingested with a FRESH first version."
          setup_api_calls:
            - call: "POST /api/employers"
              payload: { legal_name: "ReviveCo", domain: "revive.example", ats_provider: "WORKDAY" }
              as: PlatformAdmin
              captures: { emp_rv: $.data.id }
            - call: "POST /api/job-postings"
              payload: { employer_id: "${emp_rv}", title: "Lifecycle Engineer", location: "Boise, ID", description_text: "Freshness matters.", apply_mode: "HOSTED", external_posting_id: "REV-1" }
              as: Employer
              as_user_id: "${emp_rv}"
              captures: { post_rv: $.data.id }
          trigger:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-11-05T00:00:00Z" }
              as: PlatformAdmin
          assert:
            - "after the clock advances 65 days, JobPosting.${post_rv}.current_freshness == EXPIRED"
            - "JobPosting.${post_rv}.state == EXPIRED"
            - "a POST /api/job-postings/${post_rv}/versions with new content at this instant re-derives current_freshness == FRESH"
            - "JobPosting.${post_rv}.state == ACTIVE again, proving the entity revisits ACTIVE after EXPIRED"

  # ===========================================================================
  # Rule 4 — transitive_cascade (>= 2 instances; one depth >= 3, one depth >= 2)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: spend_commit_cascade_reaches_sponsored_job_and_pacing_holds
        grounds:
          - state_machines.Campaign.ACTIVE_to_COMPLETED
          - state_machines.Campaign.PACING_HOLD_to_COMPLETED
          - state_machines.SponsoredJob.ELIGIBLE_to_PAUSED
          - state_machines.SponsoredJob.ELIGIBLE_to_BUDGET_HOLD
        distinguishing_aspect: "A depth-3 chain from one transition: committing the total budget (link 1) completes the Campaign, which pauses every SponsoredJob (link 2), which releases that SponsoredJob's ACTIVE PacingHold (link 3) — each hop is caused by the previous hop, not by the original event."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One ACTIVE CPC campaign with daily_budget_cents 20000 and total_budget_cents 1000; one ELIGIBLE sponsored job holding 1000 ACTIVE, and one ELIGIBLE sponsored job holding 900 ACTIVE; the campaign is ACTIVE."
          setup_api_calls:
            - call: "POST /api/employers"
              payload: { legal_name: "ChainCo", domain: "chain.example", ats_provider: "NONE" }
              as: PlatformAdmin
              captures: { emp_ch: $.data.id }
            - call: "POST /api/job-postings"
              payload: { employer_id: "${emp_ch}", title: "Chain Engineer", location: "Austin, TX", description_text: "Chain one.", apply_mode: "HOSTED" }
              as: Employer
              as_user_id: "${emp_ch}"
              captures: { post_ch1: $.data.id }
            - call: "POST /api/job-postings"
              payload: { employer_id: "${emp_ch}", title: "Chain Engineer II", location: "Austin, TX", description_text: "Chain two.", apply_mode: "HOSTED" }
              as: Employer
              as_user_id: "${emp_ch}"
              captures: { post_ch2: $.data.id }
            - call: "POST /api/campaigns"
              payload: { employer_id: "${emp_ch}", name: "CH", pricing_model: "CPC", daily_budget_cents: 20000, total_budget_cents: 1000 }
              as: Employer
              as_user_id: "${emp_ch}"
              captures: { camp_ch: $.data.id }
            - call: "POST /api/campaigns/${camp_ch}/activate"
              payload: {}
              as: Employer
              as_user_id: "${emp_ch}"
            - call: "POST /api/sponsored-jobs"
              payload: { campaign_id: "${camp_ch}", job_posting_id: "${post_ch1}", cpc_bid_cents: 1000, cpa_bid_cents: 900 }
              as: Employer
              as_user_id: "${emp_ch}"
              captures: { sj_ch1: $.data.id }
