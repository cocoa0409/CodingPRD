      - name: provisional_and_certified_measures_diverge_while_a_challenge_is_open
        claim_type: variant_divergence
        excluded_because:
          difficulty_instance: "dual_variant_calc / basic_score_provisional_vs_certified_diverge_while_challenge_open"
          rationale: |
            The §1.8 instance already drives both variants off one dataset (provisional keeps the
            challenged 15.0, certified drops it) and asserts the full delta plus which variant each
            read surface uses, so a §1.9 breadth copy would duplicate it exactly.

      - name: certified_measure_and_quota_reconciled_when_a_challenge_is_withdrawn
        claim_type: reconciliation
        excluded_because:
          difficulty_instance: "compensating_invariant / challenge_quota_and_certified_measure_restored_by_withdraw"
          rationale: |
            Reconciliation on the provisional -> certified switch back is exactly the withdraw
            compensation asserted there (certified restored to 2.000 / 80.0, quota back to 0,
            accepted and resolved counts back to 0).

      - name: iss_contributions_rounded_per_category_before_summation
        claim_type: weighted_scoring
        excluded_because:
          difficulty_instance: "combinatorial_formula / iss_contribution_rounded_per_category_before_summation"
          rationale: |
            The depth instance pins the four category weights, forces two contributions that only
            match if each is rounded to 2dp BEFORE summation, and shows the 0.01 drift produced by
            rounding once at the end; nothing is left for a breadth probe.

      - name: alert_status_at_exactly_the_monitor_and_intervention_percentiles
        claim_type: threshold
        excluded_because:
          difficulty_instance: "boundary_precision_check / alert_status_exactly_at_monitor_then_intervention_percentile"
          rationale: |
            Percentiles of exactly 50.0 and exactly 65.0 (and the 49.9 / 64.9 neighbours) are already
            asserted there against MONITOR and ALERT, which is the whole content of this row.

      - name: measure_denominator_matrix_across_utilization_tiers
        claim_type: tiered_pricing
        excluded_because:
          difficulty_instance: "combinatorial_formula / basic_measure_utilization_tier_times_category_denominator_matrix"
          rationale: |
            The utilization-factor tiers (0.8 / 1.0 / 1.2) crossed with the three denominator formulas
            are enumerated in that instance, including the tier boundaries at exactly 20,000 and
            exactly 80,000 VMT per power unit.

