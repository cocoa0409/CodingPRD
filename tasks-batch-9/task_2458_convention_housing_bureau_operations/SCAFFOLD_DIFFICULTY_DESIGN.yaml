  # =====================================================================================
  # RULE 5 — validation priority conflicts on DIFFERENT error-category pairs
  #   instance 1: state (50) vs business_fiscal (80)
  #   instance 2: business_safety (60) vs business_referential (70)
  # =====================================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: rejected_sub_block_state_beats_night_capacity_exceeded
        grounds:
          - validations[priority=50]
          - validations[priority=80]
          - errors[ERR_INVALID_SUB_BLOCK_STATE]
          - errors[ERR_SUB_BLOCK_NIGHT_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Category pair state (priority 50) vs business_fiscal (priority 80): the target VIP
          sub-block is REJECTED and its allotted_rooms is 0, so the booking violates both the
          sub-block state rule and the night-capacity rule (0 + 1 > 0) in the same request; the
          response must be ERR_INVALID_SUB_BLOCK_STATE, never ERR_SUB_BLOCK_NIGHT_CAPACITY_EXCEEDED.
