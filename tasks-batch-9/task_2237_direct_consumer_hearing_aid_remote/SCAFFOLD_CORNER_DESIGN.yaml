      - name: sm_compliance_override_approve_resets_patient_and_mints_draft_screening
        claim_type: cross_entity
        grounds: [state_machines.ComplianceOverride.transitions.PENDING_to_APPROVED, state_machines.Patient.transitions.MEDICALLY_DISQUALIFIED_to_SCREENING_IN_PROGRESS]
        distinguishing_aspect: "Approval by a second officer must reach across three entities in one call: the override APPROVED, the patient back to SCREENING_IN_PROGRESS with both flag aggregates zeroed, the old SCORED screening INVALIDATED with reason PROVIDER_OVERRIDE, and a brand-new DRAFT screening at attempt_ordinal 2."
        test_recipe:
          setup:
            - "Patient screened RED_FLAG (SUDDEN_LOSS) on 2026-08-01; the resulting referral is evaluated on 2026-08-03 and the audiologist returns clearance_outcome NOT_CLEARED, so the patient is MEDICALLY_DISQUALIFIED; officer co-1 files an override."
