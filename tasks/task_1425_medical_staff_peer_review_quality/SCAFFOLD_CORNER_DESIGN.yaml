            - { call: "POST /peer-review/cases/${case1}/screen", payload: { decision: "SCREEN_IN" }, as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/cases/${case1}/assignments", payload: { reviewer_id: "${m_b}", expected_case_version: "${case_v}" }, as: PeerReviewCoordinator, captures: { asg_b: $.data.id } }
            - { call: "GET /peer-review/cases/${case1}", as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/cases/${case1}/assignments", payload: { reviewer_id: "${m_c}", expected_case_version: "${case_v}" }, as: PeerReviewCoordinator, captures: { asg_c: $.data.id } }
            - { call: "GET /peer-review/cases/${case1}", as: QualityDirector, captures: { v_pre: $.data.version } }
            - { call: "POST /peer-review/assignments/${asg_b}/submit", payload: { care_appropriateness_score: 4, expected_case_version: "${v_pre}" }, as: CommitteeMember, as_user_id: "${m_b}" }
          trigger:
            - { call: "POST /peer-review/assignments/${asg_c}/submit", payload: { care_appropriateness_score: 4, expected_case_version: "${v_pre}" }, as: CommitteeMember, as_user_id: "${m_c}", captures: { err: $.data.error_id } }
            - { call: "GET /peer-review/cases/${case1}", as: QualityDirector, captures: { v_fresh: $.data.version } }
            - { call: "POST /peer-review/assignments/${asg_c}/submit", payload: { care_appropriateness_score: 4, expected_case_version: "${v_fresh}" }, as: CommitteeMember, as_user_id: "${m_c}", captures: { c_st: $.data.status } }
          assert:
            - "error_id == 'ERR_STALE_VERSION' with HTTP 412 — B's submission advanced case.version past the observed ${v_pre}"
            - "after the 412 the assignment was still PENDING; resubmitting C with the freshly read version succeeds: response status == 'SUBMITTED' (200)"

      - name: occ_stale_assignment_create_returns_412
        claim_type: stale_version_conflict
        grounds: ["concurrency_rules[assignment-create-stale-case]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Assignment create carrying the case version observed before another create bumped it -> ERR_STALE_VERSION 412; no second assignment is persisted."
        test_recipe:
          setup: ["screened-in case; client holds version v observed right after screening"]
          setup_api_calls:
            - { call: "POST /peer-review/providers", payload: { full_name: "Subj OCC2", specialty: "PEDIATRICS" }, as: QualityDirector, captures: { p_sub: $.data.id } }
            - { call: "POST /peer-review/providers", payload: { full_name: "Rev B", specialty: "PEDIATRICS" }, as: QualityDirector, captures: { p_b: $.data.id } }
            - { call: "POST /peer-review/providers", payload: { full_name: "Rev C", specialty: "SURGERY" }, as: QualityDirector, captures: { p_c: $.data.id } }
            - { call: "POST /peer-review/committee-members", payload: { provider_id: "${p_b}", member_role: "MEMBER" }, as: QualityDirector, captures: { m_b: $.data.id } }
            - { call: "POST /peer-review/committee-members", payload: { provider_id: "${p_c}", member_role: "MEMBER" }, as: QualityDirector, captures: { m_c: $.data.id } }
            - { call: "POST /peer-review/cases", payload: { subject_provider_id: "${p_sub}", referral_source: "OTHER", referred_at: "2026-07-20T00:00:00Z", description: "occ case 2" }, as: PeerReviewCoordinator, captures: { case1: $.data.id } }
            - { call: "POST /peer-review/cases/${case1}/screen", payload: { decision: "SCREEN_IN" }, as: QualityDirector, captures: { v_pre: $.data.version } }
            - { call: "POST /peer-review/cases/${case1}/assignments", payload: { reviewer_id: "${m_b}", expected_case_version: "${v_pre}" }, as: PeerReviewCoordinator, captures: { asg_b: $.data.id } }
          trigger:
            - { call: "POST /peer-review/cases/${case1}/assignments", payload: { reviewer_id: "${m_c}", expected_case_version: "${v_pre}" }, as: PeerReviewCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == 'ERR_STALE_VERSION' with HTTP 412 — the first create advanced case.version past ${v_pre}"
            - "GET /peer-review/cases/${case1}/assignments lists exactly 1 row (${asg_b})"

