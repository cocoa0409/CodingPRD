# =============================================================================
# SCAFFOLD — Charity Thrift Store Operations (task_1592)
# §1.0–§1.7 seed tables. Difficulty design (§1.8) and corner design (§1.9)
# live in SCAFFOLD_DIFFICULTY_DESIGN.yaml / SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Charity Thrift Store Operations (Goodwill/ReStore style shop): donation intake,
  sorting & pricing guidelines, salable vs recycle/salvage decision & bale revenue,
  store merchandising & rotation/markdown cadence, volunteer & transitional-employment
  staffing, cash handling & shrink controls, donation pickup route for large items,
  tax receipt issuance to donors, revenue transfer to mission programs

domain_name: charity-thrift-store
api_prefix: /api

complexity_profile:
  primary_archetype: workflow_orchestration      # donation item pipeline with branch + cadence
  secondary_archetype: compliance_audit          # till SoD, shrink gating, tax receipt thresholds
  complexity_layers:
    - optimistic_concurrency      # OCC on DonationBatch.version (revalue) and WeeklyCycle.version (transfer create)
    - cascading_side_effects      # markdown-run pull cascade; sale-void restore cascade; stop-complete batch creation
    - ops_run_checkpoint          # WeeklyCycle run-markdown / close epoch advances rotation, shrink posture, revenue snapshot
    - rate_threshold_triggers     # markdown rounds, variance auto-approve, bale seal weight, receipt $250/$500/$5000, hour caps
  entity_topology: flat                          # peer resources joined by FKs; nested creation only as convenience
  state_machine_shape: branching                 # triage fork; till auto/pending fork; hold & void cycles layered on
  relationship_patterns: [one_to_many, many_to_many, self_referential, cross_aggregate]
  role_model: segregation_of_duties              # cashier != counter != variance approver; transfer preparer != approver
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# common_fields: true  => id (UUID, no prefix), created_at, updated_at, version (int, start 1, +1 per mutation)
# All FK fields carry the canonical `FK -> <Entity>.id` description prefix.
# =============================================================================
entities:
  - name: Donor
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Donor full name" }
      - { name: email, type: string, source: input, required: false, description: "Contact email" }
      - { name: address_line, type: string, source: input, required: false, description: "Mailing address line (required on receipts with total >= 50000 cents)" }
      - { name: city, type: string, source: input, required: false, description: "City" }
      - { name: state, type: string, source: input, required: false, description: "State" }
      - { name: postal_code, type: string, source: input, required: false, description: "Postal code" }
      - { name: status, type: enum, source: input, default: ACTIVE, description: "ACTIVE | INACTIVE (PATCH-toggleable); INACTIVE donors cannot start batches or pickup stops" }
      - { name: lifetime_donation_count, type: integer, source: computed, default: 0, description: "Count of DonationBatch rows for this donor that reached CLOSED; +1 on batch close" }
      - { name: tier, type: enum, source: computed, default: STANDARD, description: "STANDARD | FREQUENT; FREQUENT when lifetime_donation_count >= 10 (DONOR_FREQUENT_THRESHOLD)" }

  - name: DonationBatch
    parent: null
    common_fields: true
    fields:
      - { name: donor_id, type: string, source: input, description: "FK -> Donor.id; donating donor (must be ACTIVE at creation)" }
      - { name: source, type: enum, source: input, description: "WALK_IN | DONATION_DRIVE via API; PICKUP_STOP is system-set when auto-created by pickup-stop completion" }
      - { name: pickup_stop_id, type: string, source: system, required: false, description: "FK -> PickupStop.id; set only when source == PICKUP_STOP" }
      - { name: receipt_requested, type: boolean, source: input, default: false, description: "Whether donor wants a tax receipt; true forces receipt before close" }
      - { name: status, type: enum, source: system, description: "OPEN -> SORTING -> SORTED -> CLOSED; OPEN -> CANCELLED" }
      - { name: item_count, type: integer, source: computed, default: 0, description: "Count of DonationItem rows with batch_id == this batch" }
      - { name: untriaged_count, type: integer, source: computed, default: 0, description: "Items of this batch still in RECEIVED" }
      - { name: provisional_value_cents, type: integer, source: computed, default: 0, description: "Sum of item.provisional_value_cents over all items in batch" }
      - { name: sold_item_count, type: integer, source: computed, default: 0, description: "Items of this batch currently in SOLD" }
      - { name: closed_at, type: datetime, source: system, required: false, description: "Set on close" }

  - name: DonationItem
    parent: null
    common_fields: true
    fields:
      - { name: batch_id, type: string, source: system, description: "FK -> DonationBatch.id; owning batch (from creation path)" }
      - { name: category, type: enum, source: input, description: "CLOTHING | FURNITURE | ELECTRONICS | HOUSEWARES | BOOKS_MEDIA | TOYS | COLLECTIBLES" }
      - { name: condition, type: enum, source: input, description: "NEW_WITH_TAGS | GOOD | FAIR | POOR" }
      - { name: description, type: string, source: input, required: false, description: "Free-text item description" }
      - { name: weight_lbs, type: number, source: input, required: false, description: "Item weight; REQUIRED at triage when decision=RECYCLE; defaulted from CATEGORY_AVG_WEIGHT_LBS when pulled to salvage without one" }
      - { name: salvage_category, type: enum, source: system, required: false, description: "TEXTILES | PAPER | EWASTE | BULK; input at RECYCLE triage, derived via CATEGORY_TO_SALVAGE map on pull-to-salvage" }
      - { name: appraisal_confirmed, type: boolean, source: input, default: false, description: "Set true at triage for high-value items; receipt blocks when any item provisional >= 500000 and this is false" }
      - { name: provisional_value_cents, type: integer, source: computed, description: "calc_provisional_item_value at creation; adjustable afterwards only via POST /donation-batches/{id}/revalue" }
      - { name: base_price_cents, type: integer, source: computed, required: false, description: "calc_suggested_price result at pricing (round-0 price)" }
      - { name: current_price_cents, type: integer, source: computed, required: false, description: "Current sell price after markdown rounds (calc_markdown_price); restored exactly on sale void" }
      - { name: markdown_round, type: integer, source: system, default: 0, description: "0..3; increments once per cycle run-markdown while eligible" }
      - { name: status, type: enum, source: system, description: "RECEIVED | SALABLE | PRICED | ON_FLOOR | ON_HOLD | SOLD | RECYCLE | PULLED_TO_SALVAGE | BALED | SALVAGE | DISPOSED | SHRUNK" }
      - { name: floor_cycle_id, type: string, source: system, required: false, description: "FK -> WeeklyCycle.id; cycle in which the item entered the floor" }
      - { name: tag_color, type: enum, source: system, required: false, description: "RED | BLUE | GREEN | YELLOW; copied from floor cycle rotation_color at to-floor" }
      - { name: hold_expires_at, type: datetime, source: system, required: false, description: "clock + 72h at hold; cleared on release" }
      - { name: value_at_shrink_cents, type: integer, source: system, required: false, description: "current_price_cents if set else provisional_value_cents, snapshot at shrink" }
      - { name: shrunk_cycle_id, type: string, source: system, required: false, description: "FK -> WeeklyCycle.id; open cycle at shrink time" }
      - { name: shrink_reason, type: enum, source: system, required: false, description: "THEFT | DAMAGE | LOSS" }
      - { name: sale_id, type: string, source: system, required: false, description: "FK -> SalesTransaction.id; set while SOLD, cleared on void" }
      - { name: bale_id, type: string, source: system, required: false, description: "FK -> SalvageBale.id; ACCUMULATING bale this item feeds" }
      - { name: priced_at, type: datetime, source: system, required: false, description: "Clock time of pricing" }
      - { name: sold_at, type: datetime, source: system, required: false, description: "Clock time of sale" }

  - name: PricingGuideline
    parent: null
    common_fields: true
    fields:
      - { name: category, type: enum, source: input, description: "Item category this guideline prices (same enum as DonationItem.category)" }
      - { name: base_cents, type: integer, source: input, description: "Base price for category before condition/demand multipliers; > 0" }
      - { name: demand_multiplier, type: number, source: input, default: 1.0, description: "Store demand adjustment; > 0" }
      - { name: version_no, type: integer, source: system, description: "Per-category version sequence, starts at 1" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED; creating a guideline RETIRES the prior ACTIVE one for the same category" }
      - { name: supersedes_id, type: string, source: system, required: false, description: "FK -> PricingGuideline.id; prior ACTIVE guideline this one replaced" }

  - name: SalvageVendor
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Vendor name" }
      - { name: rates, type: array, source: input, description: "Per-category marginal brackets: [{category: TEXTILES|PAPER|EWASTE|BULK, brackets: [{up_to_lbs: number|null, rate_cents_per_lb: number}]}]; brackets ascending, final up_to_lbs null = unbounded" }

  - name: SalvageBale
    parent: null
    common_fields: true
    fields:
      - { name: category, type: enum, source: system, description: "TEXTILES | PAPER | EWASTE | BULK; one ACCUMULATING bale per category (auto-created on first assignment)" }
      - { name: status, type: enum, source: system, description: "ACCUMULATING -> SEALED -> SHIPPED -> SETTLED" }
      - { name: vendor_id, type: string, source: system, required: false, description: "FK -> SalvageVendor.id; assigned at seal from seal input" }
      - { name: weight_lbs, type: number, source: computed, default: 0, description: "Sum of weight_lbs over items with bale_id == this bale" }
      - { name: item_count, type: integer, source: computed, default: 0, description: "Items assigned to this bale" }
      - { name: estimated_revenue_cents, type: integer, source: computed, default: 0, description: "calc_bale_revenue estimate variant: pre-seal DEFAULT_EST_RATE_CENTS[category] x weight; post-seal vendor average-rate at achieved tier" }
      - { name: actual_weight_lbs, type: number, source: input, required: false, description: "Scale weight reported at settlement" }
      - { name: settled_revenue_cents, type: integer, source: computed, required: false, description: "calc_bale_revenue settlement variant (marginal brackets, per-bracket rounding) on actual_weight_lbs" }
      - { name: settled_cycle_id, type: string, source: system, required: false, description: "FK -> WeeklyCycle.id; open cycle at settle time" }
      - { name: sealed_at, type: datetime, source: system, required: false, description: "Set at seal" }
      - { name: shipped_at, type: datetime, source: system, required: false, description: "Set at ship" }
      - { name: settled_at, type: datetime, source: system, required: false, description: "Set at settle" }

  - name: SalesTransaction
    parent: null
    common_fields: true
    fields:
      - { name: till_session_id, type: string, source: input, description: "FK -> TillSession.id; session the sale runs on (must be OPEN and owned by acting cashier)" }
      - { name: payment_method, type: enum, source: input, description: "CASH | CARD; only CASH affects expected_cash_cents" }
      - { name: item_ids, type: array, source: input, description: "Non-empty array of DonationItem ids; every item must be ON_FLOOR" }
      - { name: line_count, type: integer, source: computed, description: "Number of lines" }
      - { name: total_cents, type: integer, source: computed, description: "Sum of current_price_cents over lines (prices already markdown-rounded; no further rounding)" }
      - { name: status, type: enum, source: system, description: "COMPLETED -> VOIDED" }
      - { name: voided_by_user_id, type: string, source: system, required: false, description: "X-User-ID that voided" }
      - { name: voided_at, type: datetime, source: system, required: false, description: "Set on void" }
      - { name: void_reason, type: string, source: input, required: false, description: "Optional void reason" }

  - name: TillSession
    parent: null
    common_fields: true
    fields:
      - { name: cashier_worker_id, type: string, source: system, description: "FK -> Worker.id; taken from the acting Cashier's X-User-ID at creation" }
      - { name: opening_float_cents, type: integer, source: input, description: "Starting drawer cash; >= 0" }
      - { name: opened_at, type: datetime, source: system, description: "Clock time at open" }
      - { name: cash_sales_cents, type: integer, source: computed, default: 0, description: "Sum of total_cents over COMPLETED CASH sales in this session" }
      - { name: card_sales_cents, type: integer, source: computed, default: 0, description: "Sum of total_cents over COMPLETED CARD sales in this session" }
      - { name: expected_cash_cents, type: integer, source: computed, description: "calc_till_reconciliation: opening_float_cents + cash_sales_cents" }
      - { name: counted_cash_cents, type: integer, source: input, required: false, description: "Blind count entered at count" }
      - { name: over_short_cents, type: integer, source: computed, required: false, description: "counted_cash_cents - expected_cash_cents (negative = short)" }
      - { name: status, type: enum, source: system, description: "OPEN -> RECONCILED (|over_short| <= 500) | PENDING_APPROVAL (|over_short| >= 501) -> RECONCILED -> CLOSED" }
      - { name: counted_by_user_id, type: string, source: system, required: false, description: "X-User-ID (StoreManager) that entered the count" }
      - { name: variance_approved_by_user_id, type: string, source: system, required: false, description: "X-User-ID (FinanceClerk) that approved the variance; must differ from counted_by_user_id" }
      - { name: closed_at, type: datetime, source: system, required: false, description: "Set on close" }

  - name: PickupRoute
    parent: null
    common_fields: true
    fields:
      - { name: route_date, type: string, source: input, description: "ISO date (YYYY-MM-DD) the route runs" }
      - { name: driver_worker_id, type: string, source: input, description: "FK -> Worker.id; referenced worker must be ACTIVE and employment_type == STAFF" }
      - { name: truck_capacity_cuft, type: number, source: input, description: "Truck volume capacity; > 0" }
      - { name: status, type: enum, source: system, description: "DRAFT -> PUBLISHED -> IN_PROGRESS -> COMPLETED; PUBLISHED -> DRAFT (unpublish); DRAFT|PUBLISHED -> CANCELLED" }
      - { name: stop_count, type: integer, source: computed, default: 0, description: "Stops on this route" }
      - { name: total_volume_cuft, type: number, source: computed, default: 0, description: "Sum of estimated_volume_cuft over stops in SCHEDULED | EN_ROUTE" }

  - name: PickupStop
    parent: null
    common_fields: true
    fields:
      - { name: route_id, type: string, source: system, description: "FK -> PickupRoute.id; owning route (from creation path)" }
      - { name: donor_id, type: string, source: input, description: "FK -> Donor.id; pickup donor (must be ACTIVE)" }
      - { name: window_start, type: datetime, source: input, description: "Promised window start (ISO8601 UTC)" }
      - { name: window_end, type: datetime, source: input, description: "Promised window end; must be > window_start" }
      - { name: estimated_volume_cuft, type: number, source: input, description: "Estimated item volume; > 0" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> EN_ROUTE -> COMPLETED | NO_SHOW; SCHEDULED -> CANCELLED (cascade on route cancel)" }
      - { name: completed_batch_id, type: string, source: system, required: false, description: "FK -> DonationBatch.id; batch auto-created on stop completion" }

  - name: Worker
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Worker name" }
      - { name: employment_type, type: enum, source: input, description: "VOLUNTEER | TRANSITIONAL | STAFF; drivers must be STAFF; hour caps apply to TRANSITIONAL only" }
      - { name: email, type: string, source: input, required: false, description: "Contact email" }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE | CAP_REACHED; ACTIVE<->INACTIVE via PATCH; CAP_REACHED auto at program cap; CAP_REACHED -> ACTIVE via cap extension PATCH" }
      - { name: credited_hours, type: number, source: computed, default: 0, description: "Sum of shift durations (hours) over COMPLETED assignments" }
      - { name: program_cap_hours, type: number, source: input, default: 480, description: "TRANSITIONAL program hour cap; > 0" }
      - { name: cap_extension_hours, type: number, source: input, default: 0, description: "Manager-granted extra hours; effective cap = program_cap_hours + cap_extension_hours; >= 0" }

  - name: Shift
    parent: null
    common_fields: true
    fields:
      - { name: role_type, type: enum, source: input, description: "SORTER | PRICER | CASHIER | DRIVER | FLOOR | INTAKE" }
      - { name: starts_at, type: datetime, source: input, description: "Shift start (ISO8601 UTC)" }
      - { name: ends_at, type: datetime, source: input, description: "Shift end; must be > starts_at" }
      - { name: required_headcount, type: integer, source: input, description: "Seat capacity; >= 1" }
      - { name: assigned_count, type: integer, source: computed, default: 0, description: "Assignments in ASSIGNED | CONFIRMED" }

  - name: ShiftAssignment
    parent: null
    common_fields: true
    fields:
      - { name: shift_id, type: string, source: system, description: "FK -> Shift.id; shift (from creation path)" }
      - { name: worker_id, type: string, source: input, description: "FK -> Worker.id; assigned worker" }
      - { name: status, type: enum, source: system, description: "ASSIGNED -> CONFIRMED -> COMPLETED; ASSIGNED|CONFIRMED -> NO_SHOW | CANCELLED" }
      - { name: credited_hours_applied, type: number, source: computed, required: false, description: "Hours credited to the worker when this assignment completed (shift duration, 2dp)" }

  - name: WeeklyCycle
    parent: null
    common_fields: true
    fields:
      - { name: sequence_number, type: integer, source: system, description: "1-based cycle sequence; increments per cycle" }
      - { name: rotation_color, type: enum, source: computed, description: "RED | BLUE | GREEN | YELLOW by sequence_number mod 4 (1=RED, 2=BLUE, 3=GREEN, 0=YELLOW); items floored in this cycle get this tag" }
      - { name: status, type: enum, source: system, description: "OPEN -> CLOSED; at most one OPEN cycle exists" }
      - { name: opened_at, type: datetime, source: system, description: "Clock time at open" }
      - { name: closed_at, type: datetime, source: system, required: false, description: "Clock time at close" }
      - { name: markdown_runs_count, type: integer, source: system, default: 0, description: "run-markdown invocations this cycle; max 1 per cycle" }
      - { name: gross_sales_cents, type: integer, source: computed, required: false, description: "At close: sum of total_cents over sales COMPLETED with created_at in [opened_at, closed_at)" }
      - { name: salvage_revenue_cents, type: integer, source: computed, required: false, description: "At close: sum of settled_revenue_cents over bales with settled_cycle_id == this cycle" }
      - { name: net_revenue_cents, type: integer, source: computed, required: false, description: "gross_sales_cents + salvage_revenue_cents" }
      - { name: shrink_value_cents, type: integer, source: computed, required: false, description: "Sum of value_at_shrink_cents over items with shrunk_cycle_id == this cycle" }
      - { name: shrink_rate_bp, type: integer, source: computed, required: false, description: "calc_shrink_rate in basis points; 0 when denominator is 0" }
      - { name: shrink_alert_active, type: boolean, source: computed, default: false, description: "Copied at open from previous cycle's close: previous shrink_rate_bp >= 300 (SHRINK_ALERT_BP); gates high-value pricing by non-managers" }

  - name: MissionTransfer
    parent: null
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: system, description: "FK -> WeeklyCycle.id; CLOSED cycle whose net revenue funds the transfer (from creation path)" }
      - { name: prepared_by_user_id, type: string, source: system, description: "X-User-ID (FinanceClerk) that created the transfer" }
      - { name: allocations, type: array, source: input, description: "[{program: JOB_TRAINING|YOUTH_SERVICES|HOUSING_SUPPORT|GENERAL_FUND, pct: number (0 < pct <= 100, up to 3 decimals)}]; pct must sum to exactly 100" }
      - { name: gross_pool_cents, type: integer, source: computed, description: "calc_mission_pool: snapshot of cycle.net_revenue_cents" }
      - { name: reserve_pct, type: number, source: computed, description: "Flat reserve tier keyed on gross_pool_cents: <100000 -> 10; [100000,500000) -> 15; >=500000 -> 20" }
      - { name: reserve_cents, type: integer, source: computed, description: "round_half_up(gross_pool_cents x reserve_pct / 100)" }
      - { name: net_pool_cents, type: integer, source: computed, description: "gross_pool_cents - reserve_cents" }
      - { name: allocation_amounts, type: array, source: computed, description: "[{program, pct, amount_cents}]; amount = round_half_down(net_pool_cents x pct/100); remainder added to the LAST line in request order so amounts sum exactly to net_pool_cents" }
      - { name: status, type: enum, source: system, description: "DRAFT -> APPROVED -> DISBURSED; DRAFT -> CANCELLED (superseded by a new transfer for the same cycle)" }
      - { name: approved_by_user_id, type: string, source: system, required: false, description: "X-User-ID (StoreManager) approver; must differ from prepared_by_user_id" }
      - { name: disbursed_at, type: datetime, source: system, required: false, description: "Set on disburse" }

  - name: TaxReceipt
    parent: null
    common_fields: true
    fields:
      - { name: batch_id, type: string, source: system, description: "FK -> DonationBatch.id; receipted batch (from creation path)" }
      - { name: donor_id, type: string, source: system, description: "FK -> Donor.id; denormalized from the batch for donor receipt lookups" }
      - { name: receipt_number, type: string, source: system, description: "RCT-<zero-padded sequence>, unique" }
      - { name: total_value_cents, type: integer, source: computed, description: "Sum of provisional_value_cents over ALL items of the batch (any disposition)" }
      - { name: itemized_required, type: boolean, source: computed, description: "true when total_value_cents >= 25000 ($250 written-acknowledgment threshold)" }
      - { name: form_8283_required, type: boolean, source: computed, description: "true when total_value_cents >= 50000 ($500 noncash charitable threshold)" }
      - { name: status, type: enum, source: system, description: "ISSUED -> VOIDED" }
      - { name: issued_at, type: datetime, source: system, description: "Clock time at issuance" }
      - { name: voided_at, type: datetime, source: system, required: false, description: "Set on void; void allowed only while the batch is not CLOSED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: DonationBatch
    initial_state: OPEN
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: OPEN
        to: SORTING
        trigger: "POST /api/donation-batches/{batch_id}/begin-sort"
        actor: IntakeAttendant
        preconditions:
          - "item_count >= 1 (else ERR_BATCH_INVALID_STATE)"
        side_effects:
          - "DonationBatch.version += 1"
      - from: SORTING
        to: SORTED
        trigger: "POST /api/donation-batches/{batch_id}/complete-sort"
        actor: IntakeAttendant
        preconditions:
          - "untriaged_count == 0 — every item left RECEIVED (else ERR_BATCH_HAS_UNTRIAGED_ITEMS)"
        side_effects:
          - "DonationBatch.version += 1"
      - from: SORTED
        to: CLOSED
        trigger: "POST /api/donation-batches/{batch_id}/close"
        actor: IntakeAttendant
        preconditions:
          - "if receipt_requested == true, an ISSUED TaxReceipt for this batch exists (else ERR_BATCH_RECEIPT_MISSING)"
        side_effects:
          - "closed_at = clock; DonationBatch.version += 1"
          - "Donor.lifetime_donation_count += 1 (mutation caused by the close)"
          - "Donor.tier recomputed: FREQUENT iff lifetime_donation_count >= 10 (mutation caused by the count change)"
          - "any ISSUED TaxReceipt for this batch becomes locked: later void attempts fail with ERR_RECEIPT_LOCKED"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /api/donation-batches/{batch_id}/cancel"
        actor: IntakeAttendant
        preconditions:
          - "item_count == 0 (else ERR_BATCH_INVALID_STATE)"
        side_effects:
          - "DonationBatch.version += 1"

  - entity: DonationItem
    initial_state: RECEIVED
    terminal_states: [BALED, DISPOSED, SHRUNK]   # SOLD is reversible via sale void
    transitions:
      - from: RECEIVED
        to: SALABLE
        trigger: "POST /api/items/{item_id}/triage with decision=SALABLE"
        actor: IntakeAttendant
        preconditions:
          - "owning DonationBatch.status == SORTING (else ERR_BATCH_INVALID_STATE)"
        side_effects:
          - "appraisal_confirmed set from triage input (default false)"
          - "batch.untriaged_count -= 1; batch.version += 1"
      - from: RECEIVED
        to: RECYCLE
        trigger: "POST /api/items/{item_id}/triage with decision=RECYCLE"
        actor: IntakeAttendant
        preconditions:
          - "owning DonationBatch.status == SORTING (else ERR_BATCH_INVALID_STATE)"
          - "salvage_category provided in input (else ERR_INVALID_REQUEST)"
          - "weight_lbs present (input here or at creation) (else ERR_INVALID_REQUEST)"
        side_effects:
          - "salvage_category set from input"
          - "bale assignment: the ACCUMULATING SalvageBale of this salvage_category (auto-created if none) gains the item: bale.item_count += 1, bale.weight_lbs += item.weight_lbs, item.bale_id = bale.id"
          - "bale.estimated_revenue_cents recomputed (calc_bale_revenue estimate variant, DEFAULT_EST_RATE pre-seal)"
          - "batch.untriaged_count -= 1; batch.version += 1"
      - from: RECEIVED
        to: SALVAGE
        trigger: "POST /api/items/{item_id}/triage with decision=SALVAGE"
        actor: IntakeAttendant
        preconditions:
          - "owning DonationBatch.status == SORTING (else ERR_BATCH_INVALID_STATE)"
        side_effects:
          - "batch.untriaged_count -= 1; batch.version += 1"
      - from: SALABLE
        to: PRICED
        trigger: "POST /api/items/{item_id}/price"
        actor: Pricer | StoreManager
        preconditions:
          - "an ACTIVE PricingGuideline exists for item.category (else ERR_GUIDELINE_MISSING)"
          - "shrink gate: if the OPEN WeeklyCycle has shrink_alert_active == true and the computed price >= 10000 cents, actor must be StoreManager (Pricer gets ERR_HIGH_VALUE_NEEDS_MANAGER)"
        side_effects:
          - "base_price_cents = current_price_cents = calc_suggested_price; priced_at = clock; markdown_round = 0"
      - from: PRICED
        to: ON_FLOOR
        trigger: "POST /api/items/{item_id}/to-floor"
        actor: Pricer
        preconditions:
          - "an OPEN WeeklyCycle exists (else ERR_NO_OPEN_CYCLE)"
        side_effects:
          - "floor_cycle_id = current OPEN cycle; tag_color = that cycle's rotation_color"
      - from: ON_FLOOR
        to: ON_HOLD
        trigger: "POST /api/items/{item_id}/hold"
        actor: Pricer
        preconditions: []
        side_effects:
          - "hold_expires_at = clock + 72h"
      - from: ON_HOLD
        to: ON_FLOOR
        trigger: "POST /api/items/{item_id}/release-hold"
        actor: Pricer
        preconditions: []
        side_effects:
          - "hold_expires_at cleared"
      - from: ON_HOLD
        to: ON_FLOOR
        trigger: "system: POST /api/cycles/{cycle_id}/run-markdown auto-release"
        actor: system
        preconditions:
          - "hold_expires_at <= clock at run-markdown time"
        side_effects:
          - "hold_expires_at cleared; item is EXEMPT from markdown in this same run (no round change)"
      - from: ON_FLOOR
        to: ON_FLOOR
        trigger: "system: POST /api/cycles/{cycle_id}/run-markdown markdown step"
        actor: system
        preconditions:
          - "floor cycle's sequence_number < running cycle's sequence_number (floored in an earlier cycle; strict <)"
          - "markdown_round < 3"
        side_effects:
          - "markdown_round += 1; current_price_cents recomputed via calc_markdown_price"
      - from: ON_FLOOR
        to: PULLED_TO_SALVAGE
        trigger: "system: POST /api/cycles/{cycle_id}/run-markdown pull step"
        actor: system
        preconditions:
          - "floor cycle's sequence_number < running cycle's sequence_number"
          - "markdown_round == 3"
        side_effects:
          - "salvage_category derived from category via CATEGORY_TO_SALVAGE; weight_lbs defaulted from CATEGORY_AVG_WEIGHT_LBS when unset"
          - "cascade link 2: item assigned to the ACCUMULATING SalvageBale of that salvage_category (auto-created if none): bale.item_count += 1, bale.weight_lbs += weight"
          - "cascade link 3: that weight mutation triggers bale.estimated_revenue_cents recompute (calc_bale_revenue estimate variant)"
      - from: ON_FLOOR
        to: SOLD
        trigger: "POST /api/sales (item listed in item_ids)"
        actor: Cashier
        preconditions:
          - "sale preconditions in §1.4 (session OPEN+owned, etc.); ON_HOLD items are NOT sellable"
        side_effects:
          - "sale_id = sale.id; sold_at = clock"
          - "cascade link 2: owning DonationBatch.sold_item_count += 1 (and -= 1 of untriaged... no: only sold_item_count), batch.version += 1"
          - "till session totals updated per payment_method; expected_cash_cents recomputed (calc_till_reconciliation)"
      - from: SOLD
        to: ON_FLOOR
        trigger: "POST /api/sales/{sale_id}/void (compensation)"
        actor: Cashier | StoreManager
        preconditions:
          - "void preconditions in §1.4"
        side_effects:
          - "sale_id cleared; current_price_cents and markdown_round restored exactly as at sale time (they are immutable while SOLD)"
          - "cascade link 2: owning DonationBatch.sold_item_count -= 1, batch.version += 1"
      - from: SALABLE
        to: SHRUNK
        trigger: "POST /api/items/{item_id}/shrink"
        actor: StoreManager
        preconditions: ["an OPEN WeeklyCycle exists (else ERR_NO_OPEN_CYCLE)"]
        side_effects: ["value_at_shrink_cents = provisional_value_cents; shrunk_cycle_id = open cycle; shrink_reason set"]
      - from: PRICED
        to: SHRUNK
        trigger: "POST /api/items/{item_id}/shrink"
        actor: StoreManager
        preconditions: ["an OPEN WeeklyCycle exists (else ERR_NO_OPEN_CYCLE)"]
        side_effects: ["value_at_shrink_cents = current_price_cents; shrunk_cycle_id = open cycle; shrink_reason set"]
      - from: ON_FLOOR
        to: SHRUNK
        trigger: "POST /api/items/{item_id}/shrink"
        actor: StoreManager
        preconditions: ["an OPEN WeeklyCycle exists (else ERR_NO_OPEN_CYCLE)"]
        side_effects: ["value_at_shrink_cents = current_price_cents; shrunk_cycle_id = open cycle; shrink_reason set"]
      - from: ON_HOLD
        to: SHRUNK
        trigger: "POST /api/items/{item_id}/shrink"
        actor: StoreManager
        preconditions: ["an OPEN WeeklyCycle exists (else ERR_NO_OPEN_CYCLE)"]
        side_effects: ["value_at_shrink_cents = current_price_cents; hold_expires_at cleared; shrunk_cycle_id = open cycle; shrink_reason set"]
      - from: RECYCLE
        to: BALED
        trigger: "system: POST /api/salvage-bales/{bale_id}/seal cascade"
        actor: system
        preconditions: ["item.bale_id == the sealed bale"]
        side_effects: []
      - from: PULLED_TO_SALVAGE
        to: BALED
        trigger: "system: POST /api/salvage-bales/{bale_id}/seal cascade"
        actor: system
        preconditions: ["item.bale_id == the sealed bale"]
        side_effects: []
      - from: SALVAGE
        to: DISPOSED
        trigger: "system: POST /api/cycles/{cycle_id}/close cascade"
        actor: system
        preconditions: []
        side_effects: []

  - entity: TillSession
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: RECONCILED
        trigger: "POST /api/till-sessions/{session_id}/count"
        actor: StoreManager
        preconditions:
          - "branch condition: |counted_cash_cents - expected_cash_cents| <= 500 (AUTO_RECONCILE_MAX_CENTS)"
        side_effects:
          - "counted_cash_cents stored; counted_by_user_id = X-User-ID; over_short_cents computed (calc_till_reconciliation)"
          - "TillSession.version += 1"
      - from: OPEN
        to: PENDING_APPROVAL
        trigger: "POST /api/till-sessions/{session_id}/count"
        actor: StoreManager
        preconditions:
          - "branch condition: |counted_cash_cents - expected_cash_cents| >= 501"
        side_effects:
          - "counted_cash_cents stored; counted_by_user_id = X-User-ID; over_short_cents computed"
          - "TillSession.version += 1"
      - from: PENDING_APPROVAL
        to: RECONCILED
        trigger: "POST /api/till-sessions/{session_id}/approve-variance"
        actor: FinanceClerk
        preconditions:
          - "segregation of duties: X-User-ID != counted_by_user_id (else ERR_SOD_APPROVER_IS_COUNTER)"
        side_effects:
          - "variance_approved_by_user_id = X-User-ID; TillSession.version += 1"
      - from: RECONCILED
        to: CLOSED
        trigger: "POST /api/till-sessions/{session_id}/close"
        actor: StoreManager
        preconditions: []
        side_effects:
          - "closed_at = clock; TillSession.version += 1"

  - entity: SalesTransaction
    initial_state: COMPLETED
    terminal_states: [VOIDED]
    transitions:
      - from: COMPLETED
        to: VOIDED
        trigger: "POST /api/sales/{sale_id}/void"
        actor: Cashier | StoreManager
        preconditions:
          - "Cashier actor: sale's session is OPEN and session.cashier_worker_id == X-User-ID (else ERR_FORBIDDEN_OWNERSHIP / ERR_TILL_INVALID_STATE)"
          - "StoreManager actor: session not CLOSED"
          - "void window: void clock UTC date == sale.created_at UTC date AND sale's session.status != CLOSED (else ERR_SALE_VOID_WINDOW_CLOSED)"
        side_effects:
          - "voided_by_user_id / voided_at / void_reason recorded"
          - "cascade link 1: every line item SOLD -> ON_FLOOR with current_price_cents/markdown_round restored; sale_id cleared"
          - "cascade link 2: each restored item's DonationBatch.sold_item_count -= 1, batch.version += 1"
          - "session totals: cash_sales_cents or card_sales_cents -= total_cents; expected_cash_cents recomputed (calc_till_reconciliation)"

  - entity: SalvageBale
    initial_state: ACCUMULATING
    terminal_states: [SETTLED]
    transitions:
      - from: ACCUMULATING
        to: SEALED
        trigger: "POST /api/salvage-bales/{bale_id}/seal"
        actor: StoreManager
        preconditions:
          - "weight_lbs >= 100.0 (BALE_MIN_SEAL_LBS; else ERR_BALE_UNDERWEIGHT) — evaluated BEFORE vendor checks"
          - "vendor_id input references an existing SalvageVendor that declares rates for bale.category (else ERR_VENDOR_RATE_MISSING)"
        side_effects:
          - "vendor_id set; sealed_at = clock"
          - "estimated_revenue_cents recomputed with vendor average-rate variant"
          - "cascade: all items with bale_id == this bale and status in {RECYCLE, PULLED_TO_SALVAGE} -> BALED"
      - from: SEALED
        to: SHIPPED
        trigger: "POST /api/salvage-bales/{bale_id}/ship"
        actor: StoreManager
        preconditions: []
        side_effects: ["shipped_at = clock"]
      - from: SHIPPED
        to: SETTLED
        trigger: "POST /api/salvage-bales/{bale_id}/settle"
        actor: FinanceClerk
        preconditions:
          - "an OPEN WeeklyCycle exists (else ERR_NO_OPEN_CYCLE)"
        side_effects:
          - "settled_revenue_cents = calc_bale_revenue settlement variant on actual_weight_lbs; settled_at = clock; settled_cycle_id = open cycle"
          - "that cycle's salvage_revenue_cents will include this bale at cycle close"

  - entity: PickupRoute
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /api/pickup-routes/{route_id}/publish"
        actor: StoreManager
        preconditions:
          - "at least one stop in SCHEDULED (else ERR_ROUTE_EMPTY)"
        side_effects: ["PickupRoute.version += 1"]
      - from: PUBLISHED
        to: DRAFT
        trigger: "POST /api/pickup-routes/{route_id}/unpublish"
        actor: StoreManager
        preconditions:
          - "every stop still SCHEDULED (none EN_ROUTE/COMPLETED/NO_SHOW; else ERR_ROUTE_INVALID_STATE)"
        side_effects: ["PickupRoute.version += 1"]
      - from: PUBLISHED
        to: IN_PROGRESS
        trigger: "POST /api/pickup-routes/{route_id}/start"
        actor: StoreManager
        preconditions: []
        side_effects: ["PickupRoute.version += 1"]
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /api/pickup-routes/{route_id}/complete"
        actor: StoreManager
        preconditions:
          - "every stop terminal (COMPLETED | NO_SHOW | CANCELLED; else ERR_ROUTE_INVALID_STATE)"
        side_effects: ["PickupRoute.version += 1"]
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /api/pickup-routes/{route_id}/cancel"
        actor: StoreManager
        preconditions: []
        side_effects:
          - "cascade: stops in SCHEDULED -> CANCELLED"
          - "PickupRoute.version += 1"
      - from: PUBLISHED
        to: CANCELLED
        trigger: "POST /api/pickup-routes/{route_id}/cancel"
        actor: StoreManager
        preconditions: []
        side_effects:
          - "cascade: stops in SCHEDULED -> CANCELLED"
          - "PickupRoute.version += 1"

  - entity: PickupStop
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: EN_ROUTE
        trigger: "POST /api/pickup-stops/{stop_id}/depart"
        actor: Driver
        preconditions:
          - "route.status == IN_PROGRESS (else ERR_ROUTE_INVALID_STATE)"
          - "X-User-ID == route.driver_worker_id (else ERR_FORBIDDEN_OWNERSHIP)"
          - "sequencing: every other stop on the route with window_start < this.window_start is terminal (else ERR_STOP_OUT_OF_SEQUENCE)"
        side_effects: []
      - from: EN_ROUTE
        to: COMPLETED
        trigger: "POST /api/pickup-stops/{stop_id}/complete"
        actor: Driver
        preconditions:
          - "X-User-ID == route.driver_worker_id (else ERR_FORBIDDEN_OWNERSHIP)"
        side_effects:
          - "cascade link 1: auto-create DonationBatch { donor_id = stop.donor_id, source = PICKUP_STOP, pickup_stop_id = stop.id, receipt_requested = true, status = OPEN }"
          - "completed_batch_id set to the new batch id"
      - from: EN_ROUTE
        to: NO_SHOW
        trigger: "POST /api/pickup-stops/{stop_id}/no-show"
        actor: Driver
        preconditions:
          - "X-User-ID == route.driver_worker_id (else ERR_FORBIDDEN_OWNERSHIP)"
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system: route cancel cascade"
        actor: system
        preconditions: ["owning route cancelled"]
        side_effects: []
      # NO_SHOW is terminal for the stop itself; POST /api/pickup-stops/{stop_id}/reschedule
      # creates a NEW SCHEDULED stop on a target route (no transition out of NO_SHOW).

  - entity: Worker
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "PATCH /api/workers/{worker_id} with status=INACTIVE"
        actor: VolunteerCoordinator
        preconditions: []
        side_effects: ["Worker.version += 1"]
      - from: INACTIVE
        to: ACTIVE
        trigger: "PATCH /api/workers/{worker_id} with status=ACTIVE"
        actor: VolunteerCoordinator
        preconditions: []
        side_effects: ["Worker.version += 1"]
      - from: ACTIVE
        to: CAP_REACHED
        trigger: "system: shift-assignment completion credit"
        actor: system
        preconditions:
          - "employment_type == TRANSITIONAL and credited_hours >= program_cap_hours + cap_extension_hours after the credit"
        side_effects: ["Worker.version += 1"]
      - from: CAP_REACHED
        to: ACTIVE
        trigger: "PATCH /api/workers/{worker_id} raising cap_extension_hours so effective cap > credited_hours"
        actor: StoreManager
        preconditions: []
        side_effects: ["Worker.version += 1"]

  - entity: ShiftAssignment
    initial_state: ASSIGNED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: ASSIGNED
        to: CONFIRMED
        trigger: "POST /api/shift-assignments/{assignment_id}/confirm"
        actor: Volunteer | VolunteerCoordinator
        preconditions:
          - "Volunteer actor: X-User-ID == assignment.worker_id (else ERR_FORBIDDEN_OWNERSHIP)"
        side_effects: ["ShiftAssignment.version += 1"]
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /api/shift-assignments/{assignment_id}/complete"
        actor: VolunteerCoordinator
        preconditions: []
        side_effects:
          - "credited_hours_applied = shift duration hours (2dp, round_half_up)"
          - "cascade: Worker.credited_hours += credited_hours_applied"
          - "cascade: if worker TRANSITIONAL and credited_hours >= program_cap_hours + cap_extension_hours -> worker CAP_REACHED"
          - "Shift.assigned_count -= 1 (COMPLETED no longer holds a seat)"
      - from: ASSIGNED
        to: NO_SHOW
        trigger: "POST /api/shift-assignments/{assignment_id}/no-show"
        actor: VolunteerCoordinator
        preconditions: []
        side_effects: ["Shift.assigned_count -= 1"]
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /api/shift-assignments/{assignment_id}/no-show"
        actor: VolunteerCoordinator
        preconditions: []
        side_effects: ["Shift.assigned_count -= 1"]
      - from: ASSIGNED
        to: CANCELLED
        trigger: "POST /api/shift-assignments/{assignment_id}/cancel"
        actor: Volunteer | VolunteerCoordinator
        preconditions:
          - "Volunteer actor: X-User-ID == assignment.worker_id (else ERR_FORBIDDEN_OWNERSHIP)"
        side_effects: ["Shift.assigned_count -= 1"]
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /api/shift-assignments/{assignment_id}/cancel"
        actor: Volunteer | VolunteerCoordinator
        preconditions:
          - "Volunteer actor: X-User-ID == assignment.worker_id (else ERR_FORBIDDEN_OWNERSHIP)"
        side_effects: ["Shift.assigned_count -= 1"]

  - entity: WeeklyCycle
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: OPEN
        trigger: "POST /api/cycles/{cycle_id}/run-markdown"
        actor: StoreManager
        preconditions:
          - "markdown_runs_count == 0 (at most one markdown run per cycle; else ERR_CYCLE_INVALID_STATE)"
        side_effects:
          - "step 1 auto-release: items ON_HOLD with hold_expires_at <= clock -> ON_FLOOR (exempt from markdown this run)"
          - "step 2 markdown: items ON_FLOOR with floor-cycle sequence < this sequence and markdown_round < 3 -> round += 1, price recompute"
          - "step 3 pull: items ON_FLOOR with floor-cycle sequence < this sequence and markdown_round == 3 -> PULLED_TO_SALVAGE (see DonationItem pull cascade: bale assignment then bale estimate recompute)"
          - "markdown_runs_count = 1; WeeklyCycle.version += 1"
      - from: OPEN
        to: CLOSED
        trigger: "POST /api/cycles/{cycle_id}/close"
        actor: StoreManager
        preconditions:
          - "no TillSession in OPEN | PENDING_APPROVAL | RECONCILED (else ERR_TILL_SESSIONS_UNCLOSED)"
        side_effects:
          - "cascade A: every item in SALVAGE -> DISPOSED"
          - "closed_at = clock; gross_sales_cents / salvage_revenue_cents / net_revenue_cents / shrink_value_cents / shrink_rate_bp computed (calc_cycle_close_revenue, calc_shrink_rate)"
          - "cascade B: create the next WeeklyCycle (sequence_number + 1, rotation_color advanced, shrink_alert_active = (closed cycle's shrink_rate_bp >= 300), status OPEN, opened_at = clock)"
          - "WeeklyCycle.version += 1"

  - entity: MissionTransfer
    initial_state: DRAFT
    terminal_states: [DISBURSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /api/mission-transfers/{transfer_id}/approve"
        actor: StoreManager
        preconditions:
          - "segregation of duties: X-User-ID != prepared_by_user_id (else ERR_SOD_APPROVER_IS_PREPARER)"
        side_effects: ["approved_by_user_id = X-User-ID; MissionTransfer.version += 1"]
      - from: APPROVED
        to: DISBURSED
        trigger: "POST /api/mission-transfers/{transfer_id}/disburse"
        actor: FinanceClerk
        preconditions: []
        side_effects: ["disbursed_at = clock"]
      - from: DRAFT
        to: CANCELLED
        trigger: "system: superseded by a new POST /api/cycles/{cycle_id}/mission-transfers for the same cycle"
        actor: system
        preconditions: []
        side_effects: []

  - entity: TaxReceipt
    initial_state: ISSUED
    terminal_states: [VOIDED]
    transitions:
      - from: ISSUED
        to: VOIDED
        trigger: "POST /api/tax-receipts/{receipt_id}/void"
        actor: StoreManager
        preconditions:
          - "owning DonationBatch.status != CLOSED (batch close locks receipts; else ERR_RECEIPT_LOCKED)"
        side_effects: ["voided_at = clock"]

# =============================================================================
# §1.2.1 Concurrency Rules (true races only, OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: batch-revalue-stale-version
    parent_entity: DonationBatch
    write_endpoint: "POST /api/donation-batches/{batch_id}/revalue"
    occ_field: "expected_batch_version"
    description: |
      Revaluing a DonationBatch whose version has advanced since the client last
      observed it is rejected. Revalue legitimately supersedes the prior valuation
      (latest wins), so a writer holding a stale version would silently discard
      intervening intake/valuation mutations; the stale expected_batch_version is
      rejected with ERR_STALE_BATCH_VERSION.
    error_id: ERR_STALE_BATCH_VERSION
    http_status: 412
  - rule_id: transfer-create-stale-cycle
    parent_entity: WeeklyCycle
    write_endpoint: "POST /api/cycles/{cycle_id}/mission-transfers"
    occ_field: "expected_cycle_version"
    description: |
      Creating a MissionTransfer for a WeeklyCycle whose version has advanced since
      the client last observed it is rejected. A new DRAFT legitimately supersedes
      the prior DRAFT for the cycle, so a writer holding a stale cycle version would
      supersede a transfer it never saw; the stale expected_cycle_version is rejected
      with ERR_STALE_CYCLE_VERSION.
    error_id: ERR_STALE_CYCLE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: calc_provisional_item_value
    trigger: "DonationItem creation (POST /api/donation-batches/{batch_id}/items)"
    algorithm: aggregation
    formula: |
      provisional_value_cents = round_half_up(CATEGORY_FMV_CENTS[category] * CONDITION_VALUE_MULT[condition])
      Rounded to whole cents (integer) at this single step.
    input_set: "the new item's category + condition (state filter n/a)"
    constants:
      CATEGORY_FMV_CENTS: { CLOTHING: 800, FURNITURE: 4500, ELECTRONICS: 3000, HOUSEWARES: 1200, BOOKS_MEDIA: 300, TOYS: 600, COLLECTIBLES: 5000 }
      CONDITION_VALUE_MULT: { NEW_WITH_TAGS: 1.0, GOOD: 0.7, FAIR: 0.4, POOR: 0.15 }
    precision: "0 decimal places (integer cents), round_half_up"
    variants:
      - name: provisional_intake
        when: "item creation; also the value basis for TaxReceipt.total_value_cents"
        difference: "uses the flat CATEGORY_FMV table only — ignores the store's ACTIVE PricingGuideline"
      - name: final_price
        when: "pricing (see calc_suggested_price)"
        difference: "guideline base_cents x condition price multiplier x demand_multiplier with clamps — a different algorithm on the same item yielding a different value"

  - name: calc_suggested_price
    trigger: "POST /api/items/{item_id}/price"
    algorithm: weighted_scoring
    formula: |
      mult = CONDITION_PRICE_MULT[condition]
      if category == COLLECTIBLES: mult = max(mult, 1.2)          # collectibles floor multiplier branch
      raw  = guideline.base_cents * mult * guideline.demand_multiplier
      clamped = min(max(raw, MIN_PRICE_CENTS), MAX_PRICE_CENTS)   # nested min/max clamp
      price = round_half_up(clamped)
      guideline = the ACTIVE PricingGuideline for item.category (exactly one; supersede maintains this)
    input_set: "item.category, item.condition, ACTIVE PricingGuideline for that category"
    constants:
      CONDITION_PRICE_MULT: { NEW_WITH_TAGS: 1.0, GOOD: 0.8, FAIR: 0.6, POOR: 0.35 }
      MIN_PRICE_CENTS: 100
      MAX_PRICE_CENTS: 500000
      COLLECTIBLES_MULT_FLOOR: 1.2
    precision: "0 decimal places (integer cents), round_half_up"
    variants:
      - name: final_price
        when: "pricing"
        difference: "contrasts with provisional_intake (calc_provisional_item_value): e.g. CLOTHING/GOOD with base 2000 prices at 1600 while provisional valued it at 560"

  - name: calc_markdown_price
    trigger: "POST /api/cycles/{cycle_id}/run-markdown (markdown step)"
    algorithm: threshold
    formula: |
      eligible = item.status == ON_FLOOR
                 AND floor_cycle.sequence_number < running_cycle.sequence_number   # strict <
                 AND item.markdown_round < 3
      for eligible items: markdown_round += 1
      current_price_cents = round_half_up(base_price_cents * (1 - MARKDOWN_OFF[markdown_round]))
      items with status == ON_FLOOR, older floor cycle, and markdown_round == 3 are NOT
      re-priced; they transition to PULLED_TO_SALVAGE instead.
      Items floored in the RUNNING cycle (sequence_number equal) are never touched.
    input_set: "DonationItem rows in ON_FLOOR (ON_HOLD exempt; auto-released expired holds exempt this run)"
    constants:
      MARKDOWN_OFF: { 1: 0.25, 2: 0.50, 3: 0.75 }
      MAX_MARKDOWN_ROUND: 3
      HOLD_HOURS: 72
    precision: "0 decimal places (integer cents), round_half_up"
    variants: []

  - name: calc_bale_revenue
    trigger: "bale weight changes (estimate); POST /api/salvage-bales/{id}/seal (estimate refresh); POST /api/salvage-bales/{id}/settle (settlement)"
    algorithm: tiered_pricing
    formula: |
      estimate variant:
        pre-seal:  estimated_revenue_cents = round_half_up(weight_lbs * DEFAULT_EST_RATE_CENTS[category])
        post-seal: rate = vendor bracket rate whose range CONTAINS total weight_lbs (average-rate-at-tier)
                   estimated_revenue_cents = round_half_up(weight_lbs * rate)
      settlement variant (on actual_weight_lbs at settle):
        walk vendor brackets for bale.category in ascending order (marginal):
          lbs_in_bracket_i = min(remaining, bracket_width_i)
          line_i = round_half_up(lbs_in_bracket_i * rate_i)     # ROUND PER BRACKET FIRST (pinned order)
        settled_revenue_cents = sum(line_i)                      # then sum the rounded lines
        (The alternative "sum exact products, round once" is REJECTED: e.g. EWASTE at 101.0 lbs
         with rates 3.353/2.30 settles at 335 + 2 = 337, not round(337.60) = 338.)
    input_set: "the bale's assigned items (weight) or actual_weight_lbs; vendor brackets for bale.category"
    constants:
      DEFAULT_EST_RATE_CENTS: { TEXTILES: 12, PAPER: 6, EWASTE: 3, BULK: 2 }
      BALE_MIN_SEAL_LBS: 100.0
    precision: "per-bracket lines rounded to integer cents round_half_up, then summed (order pinned); estimate rounded once round_half_up"
    variants:
      - name: estimate_average_rate
        when: "while ACCUMULATING / SEALED / SHIPPED (pre-settlement reads)"
        difference: "single rate at the achieved tier applied to the whole weight"
      - name: settlement_marginal
        when: "settle"
        difference: "marginal bracket walk with per-bracket rounding; for TEXTILES at 2500 lbs with brackets 12/10/8 the estimate is 20000 but the settlement is 25000"

  - name: calc_till_reconciliation
    trigger: "sale completion, sale void (recompute); POST /api/till-sessions/{id}/count (branch decision)"
    algorithm: aggregation
    formula: |
      cash_sales_cents = sum(total_cents of COMPLETED CASH sales with till_session_id == session)
      card_sales_cents = sum(total_cents of COMPLETED CARD sales with till_session_id == session)
      expected_cash_cents = opening_float_cents + cash_sales_cents
      over_short_cents = counted_cash_cents - expected_cash_cents
      branch: |over_short_cents| <= 500 -> RECONCILED; |over_short_cents| >= 501 -> PENDING_APPROVAL
      (BOUNDARY: exactly +/-500 auto-reconciles; +/-501 requires FinanceClerk approval)
    input_set: "sales of this session with status == COMPLETED only (VOIDED excluded — a void fully removes its total)"
    constants:
      AUTO_RECONCILE_MAX_CENTS: 500
    precision: "integer cents"
    variants: []

  - name: calc_shrink_rate
    trigger: "POST /api/cycles/{cycle_id}/close"
    algorithm: threshold
    formula: |
      shrink_value_cents = sum(value_at_shrink_cents of items with shrunk_cycle_id == cycle)
      net_sales = gross_sales_cents (COMPLETED sales created in [opened_at, closed_at))
      if (shrink_value_cents + net_sales) == 0: shrink_rate_bp = 0
      else: shrink_rate_bp = round_half_up(shrink_value_cents * 10000 / (shrink_value_cents + net_sales))
      shrink_alert for the NEXT cycle: shrink_rate_bp >= 300 (BOUNDARY: exactly 300bp triggers the alert)
    input_set: "items SHRUNK with shrunk_cycle_id == closing cycle; sales COMPLETED with created_at in the cycle window"
    constants:
      SHRINK_ALERT_BP: 300
    precision: "integer basis points, round_half_up"
    variants: []

  - name: calc_cycle_close_revenue
    trigger: "POST /api/cycles/{cycle_id}/close"
    algorithm: aggregation
    formula: |
      gross_sales_cents = sum(total_cents of sales COMPLETED with created_at in [opened_at, closed_at))
      salvage_revenue_cents = sum(settled_revenue_cents of bales with settled_cycle_id == this cycle)
      net_revenue_cents = gross_sales_cents + salvage_revenue_cents
      Window is half-open [opened_at, closed_at): a sale created exactly AT opened_at counts, exactly at closed_at does not.
    input_set: "COMPLETED sales (VOIDED excluded) in the cycle window; bales settled into this cycle"
    constants: {}
    precision: "integer cents"
    variants: []

  - name: calc_mission_pool
    trigger: "POST /api/cycles/{cycle_id}/mission-transfers"
    algorithm: waterfall_allocation
    formula: |
      EVALUATION ORDER (pinned — the tier depends on gross, NOT on net; doing it the other way
      yields a different, wrong number):
        1. gross_pool_cents = cycle.net_revenue_cents (snapshot at creation)
        2. reserve_pct = tier keyed on gross_pool_cents:
             gross < 100000 -> 10 ; 100000 <= gross < 500000 -> 15 ; gross >= 500000 -> 20
        3. reserve_cents = round_half_up(gross_pool_cents * reserve_pct / 100)
        4. net_pool_cents = gross_pool_cents - reserve_cents
        5. allocation line i: amount_i = round_half_down(net_pool_cents * pct_i / 100)
        6. remainder = net_pool_cents - sum(amount_i); add remainder to the LAST line in request order
        (e.g. gross 110000 -> tier 15 -> reserve 16500 -> net 93500; misreading the tier as keyed
         on net would give 10% -> net 99000)
    input_set: "the CLOSED cycle's net_revenue_cents; request allocations"
    constants:
      RESERVE_TIER_1_MAX_CENTS: 100000
      RESERVE_TIER_2_MAX_CENTS: 500000
      RESERVE_PCT: { T1: 10, T2: 15, T3: 20 }
    precision: "integer cents; reserve round_half_up; allocation lines round_half_down with remainder to last line"
    variants: []

  - name: calc_transitional_hours
    trigger: "POST /api/shifts/{shift_id}/assignments (weekly gate); POST /api/shift-assignments/{id}/complete (program cap)"
    algorithm: threshold
    formula: |
      duration_hrs(a) = round_half_up((shift.ends_at - shift.starts_at) in seconds / 3600, 2dp)
      weekly gate (TRANSITIONAL workers only), evaluated at assignment creation:
        week_load = sum(duration_hrs over the worker's assignments with status in
                    {ASSIGNED, CONFIRMED, COMPLETED} whose shift.starts_at falls in the same
                    ISO week (Monday 00:00Z boundary) as the new shift.starts_at)
        reject when week_load + new_duration > 20.0   (BOUNDARY: exactly 20.0 is allowed)
      program cap (TRANSITIONAL only), evaluated at completion:
        credited_hours += duration_hrs
        if credited_hours >= program_cap_hours + cap_extension_hours -> worker CAP_REACHED
        (BOUNDARY: landing exactly on the cap flips the worker; VOLUNTEER/STAFF are never capped)
    input_set: "worker's assignments in non-terminal-plus-COMPLETED states for the week window; all COMPLETED assignments for the program cap"
    constants:
      WEEKLY_CAP_HOURS: 20.0
      DEFAULT_PROGRAM_CAP_HOURS: 480
    precision: "hours at 2 decimal places, round_half_up"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lower number wins when a
# request violates several rules at once)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and X-User-Role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Request body schema: required fields present, types valid, enum values in domain, unknown fields rejected, arrays non-empty where required (sales.item_ids, transfer.allocations, revalue.adjustments), window_end > window_start, ends_at > starts_at, amounts non-negative", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 3, category: auth, check: "X-User-Role is in the endpoint's roles list", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: "all" }
  - { priority: 4, category: existence, check: "Path ids resolve left-to-right, then body FK references (donor_id, worker_id, till_session_id, item_ids[], vendor_id, target_route_id, adjustments[].item_id)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 5, category: auth, check: "Ownership: Cashier acting on a sale/till session must be that session's cashier_worker_id; Driver acting on a stop must be the route's driver_worker_id; Volunteer confirming/cancelling must be the assignment's worker_id", error_id: ERR_FORBIDDEN_OWNERSHIP, http_status: 403, applies_to: "POST /api/sales, POST /api/sales/{sale_id}/void, POST /api/pickup-stops/{stop_id}/depart|complete|no-show, POST /api/shift-assignments/{assignment_id}/confirm|cancel" }
  - { priority: 6, category: state, check: "Target entity in required state: batch OPEN for item-add / SORTING for triage / SORTED for receipt & close / not-closed-or-cancelled for revalue (incl. no ISSUED receipt — else ERR_REVALUE_BLOCKED_BY_RECEIPT); item in the from-state of each item action; till OPEN for sales & count / PENDING_APPROVAL for approve-variance / RECONCILED for close; sale COMPLETED for void (ERR_SALE_INVALID_STATE); route DRAFT for stop-add & publish / PUBLISHED for start & unpublish / IN_PROGRESS for complete & stop actions; stop SCHEDULED for depart / EN_ROUTE for complete & no-show; assignment ASSIGNED for confirm / CONFIRMED for complete / ASSIGNED|CONFIRMED for no-show & cancel; cycle OPEN for run-markdown & close, CLOSED for transfer create; transfer DRAFT for approve / APPROVED for disburse; receipt ISSUED for void; bale ACCUMULATING for seal / SEALED for ship / SHIPPED for settle", error_id: ERR_BATCH_INVALID_STATE, http_status: 409, applies_to: "stateful action endpoints (per-resource ids: ERR_BATCH_INVALID_STATE, ERR_ITEM_INVALID_STATE, ERR_TILL_INVALID_STATE, ERR_SALE_INVALID_STATE, ERR_ROUTE_INVALID_STATE, ERR_STOP_INVALID_STATE, ERR_ASSIGNMENT_INVALID_STATE, ERR_CYCLE_INVALID_STATE, ERR_TRANSFER_INVALID_STATE, ERR_RECEIPT_INVALID_STATE, ERR_BALE_INVALID_STATE)" }
  - { priority: 6, category: state, check: "complete-sort requires untriaged_count == 0", error_id: ERR_BATCH_HAS_UNTRIAGED_ITEMS, http_status: 409, applies_to: "POST /api/donation-batches/{batch_id}/complete-sort" }
  - { priority: 6, category: state, check: "cycle close requires every TillSession terminal (CLOSED) — none in OPEN | PENDING_APPROVAL | RECONCILED", error_id: ERR_TILL_SESSIONS_UNCLOSED, http_status: 409, applies_to: "POST /api/cycles/{cycle_id}/close" }
  - { priority: 6, category: state, check: "batch close requires an ISSUED receipt when receipt_requested == true", error_id: ERR_BATCH_RECEIPT_MISSING, http_status: 409, applies_to: "POST /api/donation-batches/{batch_id}/close" }
  - { priority: 6, category: state, check: "revalue forbidden once a receipt is ISSUED for the batch", error_id: ERR_REVALUE_BLOCKED_BY_RECEIPT, http_status: 409, applies_to: "POST /api/donation-batches/{batch_id}/revalue" }
  - { priority: 7, category: state, check: "OCC: expected_batch_version == DonationBatch.version; expected_cycle_version == WeeklyCycle.version (checked AFTER state preconditions)", error_id: ERR_STALE_BATCH_VERSION, http_status: 412, applies_to: "POST /api/donation-batches/{batch_id}/revalue (ERR_STALE_BATCH_VERSION), POST /api/cycles/{cycle_id}/mission-transfers (ERR_STALE_CYCLE_VERSION)" }
  - { priority: 8, category: business_safety, check: "Receipt compliance gates, in this sub-order: (a) receipt_requested == true else ERR_RECEIPT_NOT_REQUESTED; (b) every item with provisional_value_cents >= 500000 has appraisal_confirmed == true else ERR_APPRAISAL_REQUIRED; (c) total >= 50000 requires donor.address_line present else ERR_DONOR_ADDRESS_REQUIRED", error_id: ERR_APPRAISAL_REQUIRED, http_status: 422, applies_to: "POST /api/donation-batches/{batch_id}/receipt" }
  - { priority: 8, category: business_safety, check: "SoD: variance approver X-User-ID != counted_by_user_id", error_id: ERR_SOD_APPROVER_IS_COUNTER, http_status: 422, applies_to: "POST /api/till-sessions/{session_id}/approve-variance" }
  - { priority: 8, category: business_safety, check: "SoD: transfer approver X-User-ID != prepared_by_user_id", error_id: ERR_SOD_APPROVER_IS_PREPARER, http_status: 422, applies_to: "POST /api/mission-transfers/{transfer_id}/approve" }
  - { priority: 8, category: business_safety, check: "Shrink-alert gate: computed price >= 10000 while OPEN cycle shrink_alert_active requires StoreManager actor", error_id: ERR_HIGH_VALUE_NEEDS_MANAGER, http_status: 422, applies_to: "POST /api/items/{item_id}/price" }
  - { priority: 9, category: business_constraint, check: "Uniqueness: at most one OPEN TillSession per cashier (ERR_TILL_SESSION_OPEN_EXISTS); at most one OPEN WeeklyCycle (ERR_CYCLE_INVALID_STATE); at most one ISSUED receipt per batch (state check via receipt existence -> ERR_RECEIPT_INVALID_STATE)", error_id: ERR_TILL_SESSION_OPEN_EXISTS, http_status: 409, applies_to: "POST /api/till-sessions, POST /api/cycles, POST /api/donation-batches/{batch_id}/receipt" }
  - { priority: 9, category: business_constraint, check: "Capacity: shift assigned_count < required_headcount (ERR_SHIFT_FULL); route total_volume_cuft + new stop volume <= truck_capacity_cuft, equality allowed (ERR_ROUTE_CAPACITY_EXCEEDED)", error_id: ERR_SHIFT_FULL, http_status: 422, applies_to: "POST /api/shifts/{shift_id}/assignments, POST /api/pickup-routes/{route_id}/stops, POST /api/pickup-stops/{stop_id}/reschedule" }
  - { priority: 9, category: business_constraint, check: "TRANSITIONAL weekly cap: week_load + new_duration <= 20.0 hours (equality allowed)", error_id: ERR_WEEKLY_HOURS_EXCEEDED, http_status: 422, applies_to: "POST /api/shifts/{shift_id}/assignments" }
  - { priority: 9, category: business_constraint, check: "Transfer allocation pct values sum to exactly 100", error_id: ERR_ALLOCATION_SUM_INVALID, http_status: 422, applies_to: "POST /api/cycles/{cycle_id}/mission-transfers" }
  - { priority: 9, category: business_constraint, check: "Bale seal weight >= 100.0 lbs (BALE_MIN_SEAL_LBS; equality allowed)", error_id: ERR_BALE_UNDERWEIGHT, http_status: 422, applies_to: "POST /api/salvage-bales/{bale_id}/seal" }
  - { priority: 9, category: business_constraint, check: "publish requires >= 1 SCHEDULED stop", error_id: ERR_ROUTE_EMPTY, http_status: 422, applies_to: "POST /api/pickup-routes/{route_id}/publish" }
  - { priority: 10, category: business_temporal, check: "Stop windows on the same route (stops in SCHEDULED | EN_ROUTE) must keep a TRAVEL_BUFFER_MINUTES=30 gap on both sides: new.start >= s.end + 30min OR s.start >= new.end + 30min; equality at exactly +30min is allowed (half-open with buffer)", error_id: ERR_STOP_WINDOW_CONFLICT, http_status: 422, applies_to: "POST /api/pickup-routes/{route_id}/stops, POST /api/pickup-stops/{stop_id}/reschedule" }
  - { priority: 10, category: business_temporal, check: "Stop sequencing: all earlier-windowed stops on the route must be terminal before depart", error_id: ERR_STOP_OUT_OF_SEQUENCE, http_status: 422, applies_to: "POST /api/pickup-stops/{stop_id}/depart" }
  - { priority: 10, category: business_temporal, check: "Void window: void clock date == sale created date AND session not CLOSED", error_id: ERR_SALE_VOID_WINDOW_CLOSED, http_status: 422, applies_to: "POST /api/sales/{sale_id}/void" }
  - { priority: 10, category: business_temporal, check: "Worker double-booking: no two assignments (ASSIGNED | CONFIRMED) for the same worker with overlapping [start, end) — touching endpoints allowed, NO buffer (different semantics from stop windows)", error_id: ERR_SHIFT_OVERLAP, http_status: 422, applies_to: "POST /api/shifts/{shift_id}/assignments" }
  - { priority: 11, category: business_referential, check: "Referenced-entity eligibility: donor ACTIVE for batch create & stop add (ERR_DONOR_INACTIVE); worker ACTIVE for assignment (ERR_WORKER_NOT_ACTIVE; CAP_REACHED -> ERR_WORKER_CAP_REACHED); driver must be ACTIVE STAFF (ERR_DRIVER_NOT_STAFF); vendor declares rates for the bale's category (ERR_VENDOR_RATE_MISSING); ACTIVE PricingGuideline exists for item category (ERR_GUIDELINE_MISSING)", error_id: ERR_DONOR_INACTIVE, http_status: 422, applies_to: "POST /api/donation-batches, POST /api/pickup-routes/{route_id}/stops, POST /api/shifts/{shift_id}/assignments, POST /api/pickup-routes, POST /api/salvage-bales/{bale_id}/seal, POST /api/items/{item_id}/price" }
  - { priority: 11, category: business_referential, check: "OPEN WeeklyCycle required for to-floor / shrink / settle", error_id: ERR_NO_OPEN_CYCLE, http_status: 409, applies_to: "POST /api/items/{item_id}/to-floor, POST /api/items/{item_id}/shrink, POST /api/salvage-bales/{bale_id}/settle" }

# =============================================================================
# §1.5 API Endpoint Table
# (Read endpoints list all eight roles; writes are role-restricted per §1.7.)
# =============================================================================
endpoints:
  # --- test-driving clock ---
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the server's logical clock (test-driving endpoint). Before any call, the clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time."
    roles: [StoreManager]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock advanced; subsequent system timestamps use it"]

  # --- Donor ---
  - method: POST
    path: "/api/donors"
    description: "Register a donor"
    roles: [IntakeAttendant]
    code: 201
    input: [full_name, "email?", "address_line?", "city?", "state?", "postal_code?"]
    output: Donor
    side_effects: ["status=ACTIVE, tier=STANDARD, lifetime_donation_count=0"]
  - method: GET
    path: "/api/donors/{donor_id}"
    description: "Get a donor"
    roles: [StoreManager, IntakeAttendant, Pricer, Cashier, Driver, Volunteer, VolunteerCoordinator, FinanceClerk]
    code: 200
    input: []
    output: Donor
    side_effects: []
  - method: PATCH
    path: "/api/donors/{donor_id}"
    description: "Update donor contact fields or toggle status ACTIVE<->INACTIVE"
    roles: [IntakeAttendant]
    code: 200
    input: ["status?", "address_line?", "city?", "state?", "postal_code?", "email?"]
    output: Donor
    side_effects: ["Donor.version += 1"]

  # --- DonationBatch ---
  - method: POST
    path: "/api/donation-batches"
    description: "Open a donation batch at intake (donor must be ACTIVE; PICKUP_STOP source is system-only)"
    roles: [IntakeAttendant]
    code: 201
    input: [donor_id, source, "receipt_requested?"]
    output: DonationBatch
    side_effects: ["status=OPEN"]
  - method: GET
    path: "/api/donation-batches/{batch_id}"
    description: "Get a donation batch"
    roles: [StoreManager, IntakeAttendant, Pricer, Cashier, Driver, Volunteer, VolunteerCoordinator, FinanceClerk]
    code: 200
    input: []
    output: DonationBatch
    side_effects: []
  - method: GET
    path: "/api/donation-batches"
    description: "List/filter donation batches (FK reverse for DonationBatch.donor_id and .pickup_stop_id)"
    roles: [StoreManager, IntakeAttendant, Pricer, Cashier, Driver, Volunteer, VolunteerCoordinator, FinanceClerk]
    code: 200
    input: ["donor_id?", "pickup_stop_id?", "status?", "limit?", "offset?"]
    output: DonationBatch[]
    side_effects: []
  - method: POST
    path: "/api/donation-batches/{batch_id}/items"
    description: "Add an item to an OPEN batch; provisional value computed at creation"
    roles: [IntakeAttendant]
    code: 201
    input: [category, condition, "description?", "weight_lbs?"]
    output: DonationItem
    side_effects: ["calc_provisional_item_value", "batch.item_count/untriaged_count/provisional_value_cents recompute", "DonationBatch.version += 1"]
  - method: GET
    path: "/api/donation-batches/{batch_id}/items"
    description: "List items of a batch (FK reverse for DonationItem.batch_id)"
    roles: [StoreManager, IntakeAttendant, Pricer, Cashier, Driver, Volunteer, VolunteerCoordinator, FinanceClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: DonationItem[]
    side_effects: []
  - method: POST
    path: "/api/donation-batches/{batch_id}/begin-sort"
    description: "OPEN -> SORTING (requires >= 1 item)"
    roles: [IntakeAttendant]
    code: 200
    input: []
    output: DonationBatch
    side_effects: ["DonationBatch.version += 1"]
  - method: POST
    path: "/api/donation-batches/{batch_id}/complete-sort"
    description: "SORTING -> SORTED (requires all items triaged)"
    roles: [IntakeAttendant]
    code: 200
    input: []
    output: DonationBatch
    side_effects: ["DonationBatch.version += 1"]
  - method: POST
    path: "/api/donation-batches/{batch_id}/revalue"
    description: "OCC-guarded valuation correction: overwrites items' provisional_value_cents from adjustments; latest revalue supersedes prior ones"
    roles: [IntakeAttendant]
    code: 200
    input: [expected_batch_version, adjustments]
    output: DonationBatch
    side_effects: ["item provisional values overwritten per adjustments", "batch.provisional_value_cents recomputed", "increments DonationBatch.version by 1"]
  - method: POST
    path: "/api/donation-batches/{batch_id}/close"
    description: "SORTED -> CLOSED (receipt gate when receipt_requested)"
    roles: [IntakeAttendant]
    code: 200
    input: []
    output: DonationBatch
    side_effects: ["closed_at set", "Donor.lifetime_donation_count += 1", "Donor.tier recomputed (FREQUENT at >= 10)", "ISSUED receipts for the batch become locked", "increments DonationBatch.version by 1"]
  - method: POST
    path: "/api/donation-batches/{batch_id}/cancel"
    description: "OPEN -> CANCELLED (requires zero items)"
    roles: [IntakeAttendant]
    code: 200
    input: []
    output: DonationBatch
    side_effects: ["DonationBatch.version += 1"]
  - method: POST
    path: "/api/donation-batches/{batch_id}/receipt"
    description: "Issue the tax receipt for a SORTED batch (compliance thresholds $250/$500/$5000)"
    roles: [IntakeAttendant]
    code: 201
    input: []
    output: TaxReceipt
    side_effects: ["TaxReceipt ISSUED with computed total_value_cents, itemized_required, form_8283_required"]

  # --- DonationItem ---
  - method: GET
    path: "/api/items/{item_id}"
    description: "Get an item"
    roles: [StoreManager, IntakeAttendant, Pricer, Cashier, Driver, Volunteer, VolunteerCoordinator, FinanceClerk]
    code: 200
    input: []
    output: DonationItem
    side_effects: []
  - method: GET
    path: "/api/items"
    description: "List/filter items (FK reverse for DonationItem.batch_id, .sale_id, .bale_id, .floor_cycle_id, .shrunk_cycle_id)"
    roles: [StoreManager, IntakeAttendant, Pricer, Cashier, Driver, Volunteer, VolunteerCoordinator, FinanceClerk]
    code: 200
    input: ["batch_id?", "sale_id?", "bale_id?", "floor_cycle_id?", "shrunk_cycle_id?", "status?", "category?", "limit?", "offset?"]
    output: DonationItem[]
    side_effects: []
  - method: POST
    path: "/api/items/{item_id}/triage"
    description: "RECEIVED -> SALABLE | RECYCLE | SALVAGE (batch must be SORTING; RECYCLE assigns the item to the category's ACCUMULATING bale)"
    roles: [IntakeAttendant]
    code: 200
    input: [decision, "salvage_category?", "weight_lbs?", "appraisal_confirmed?"]
    output: DonationItem
    side_effects: ["on RECYCLE: bale auto-create if none ACCUMULATING for the category; bale.weight_lbs/item_count updated; bale.estimated_revenue_cents recomputed", "batch.untriaged_count -= 1", "DonationBatch.version += 1"]
  - method: POST
    path: "/api/items/{item_id}/price"
    description: "SALABLE -> PRICED via ACTIVE guideline (shrink-alert high-value gate)"
    roles: [Pricer, StoreManager]
    code: 200
    input: []
    output: DonationItem
    side_effects: ["calc_suggested_price", "base_price_cents/current_price_cents/priced_at set"]
  - method: POST
    path: "/api/items/{item_id}/to-floor"
    description: "PRICED -> ON_FLOOR; stamps floor_cycle_id + tag_color from the OPEN cycle"
    roles: [Pricer]
    code: 200
    input: []
    output: DonationItem
    side_effects: ["floor_cycle_id = open cycle", "tag_color = cycle.rotation_color"]
  - method: POST
    path: "/api/items/{item_id}/hold"
    description: "ON_FLOOR -> ON_HOLD (72h expiry)"
    roles: [Pricer]
    code: 200
    input: []
    output: DonationItem
    side_effects: ["hold_expires_at = clock + 72h"]
  - method: POST
    path: "/api/items/{item_id}/release-hold"
    description: "ON_HOLD -> ON_FLOOR"
    roles: [Pricer]
    code: 200
    input: []
    output: DonationItem
    side_effects: ["hold_expires_at cleared"]
  - method: POST
    path: "/api/items/{item_id}/shrink"
    description: "{SALABLE, PRICED, ON_FLOOR, ON_HOLD} -> SHRUNK; value snapshot attributed to the OPEN cycle"
    roles: [StoreManager]
    code: 200
    input: [reason]
    output: DonationItem
    side_effects: ["value_at_shrink_cents snapshot", "shrunk_cycle_id = open cycle", "hold_expires_at cleared"]

