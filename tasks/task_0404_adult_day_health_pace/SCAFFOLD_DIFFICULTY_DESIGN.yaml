        grounds:
          - state_machines.CarePlan.IN_REVIEW_to_ACTIVE
          - state_machines.CarePlan.ACTIVE_to_SUPERSEDED
          - state_machines.MedicationOrder.ACTIVE_to_DISCONTINUED
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (care-plan activate): activating plan B supersedes the prior
          ACTIVE plan A (link 1), which discontinues plan A's ACTIVE medication order (link 2 caused by link 1) —
          distinct propagation origin from the disenrollment cascade.
