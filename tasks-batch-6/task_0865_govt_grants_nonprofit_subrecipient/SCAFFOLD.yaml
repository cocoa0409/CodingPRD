scenario: "865. Government Grants-to-Nonprofits & Subrecipient Monitoring: NOFO & application intake, scoring panel & award, subaward agreement & budget, reimbursement/drawdown & documentation, risk assessment & monitoring visit, performance/outcome report, single-audit & findings, closeout"
domain_name: "govt-grants-subrecipient-monitoring"
api_prefix: ""

complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Ledger reconciliation"
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities linked by foreign keys (Nonprofit, NOFO, Application, Subaward, Drawdown,
  # RiskAssessment, MonitoringVisit, PerformanceReport, SingleAudit, Finding). Only budget
  # lines / reviews / sub-collections nest in URLs; the core graph is FK-referenced peers.

  state_machine_shape: cyclic
  # Application (REVISION_REQUESTED->SUBMITTED loop), Subaward (ACTIVE<->SUSPENDED loop),
  # Drawdown (RETURNED->SUBMITTED loop), Finding (CAP_SUBMITTED->OPEN loop) all cycle.

  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic   # Finding.origin references either a MonitoringVisit or a SingleAudit

  role_model: segregation_of_duties
  # Four-eyes: the GrantsManager who authored a Subaward's RiskAssessment cannot approve that
  # Subaward's Drawdowns. Panelist cannot review the same Application twice.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: Nonprofit
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Legal name of the subrecipient organization."
      - name: uei
        type: string
        source: input
        description: "Unique Entity Identifier (SAM.gov); unique across all nonprofits."
        constraints: "unique"
      - name: ein
        type: string
        source: input
        description: "Employer Identification Number."
      - name: cumulative_federal_expenditures_cents
        type: integer
        source: computed
        description: "Sum of disbursed_cents over all this nonprofit's Subawards. Recomputed whenever any of its Drawdowns reaches PAID."
        default: 0
      - name: latest_risk_tier
        type: enum
        source: computed
        description: "Risk tier of the most recent RiskAssessment across this nonprofit's Subawards (by created_at DESC); null if none."
        constraints: "one of {LOW, MODERATE, HIGH}; nullable"

  - name: NOFO
    parent: null
    common_fields: true
    fields:
      - name: title
        type: string
        source: input
        description: "Notice of Funding Opportunity title."
      - name: cfda_number
        type: string
        source: input
        description: "Assistance Listing (CFDA) number."
      - name: total_pool_cents
        type: integer
        source: input
        description: "Total funding available to award under this NOFO, in cents."
        constraints: ">= 1"
      - name: remaining_pool_cents
        type: integer
        source: computed
        description: "total_pool_cents minus the sum of awarded_amount_cents over Applications that are AWARDED with a non-terminated (pre-close) Subaward. Debited on award, credited back when a not-yet-activated Subaward is terminated."
        default: 0
      - name: max_award_cents
        type: integer
        source: input
        description: "Maximum single award allowed under this NOFO, in cents."
        constraints: ">= 1"
      - name: indirect_cost_cap_pct
        type: number
        source: input
        description: "Maximum negotiated indirect rate permitted for subawards under this NOFO (e.g. 0.30)."
        constraints: "0 <= x <= 1"
      - name: open_date
        type: datetime
        source: input
        description: "Intake open date (ISO 8601 UTC)."
      - name: close_date
        type: datetime
        source: input
        description: "Intake close date (ISO 8601 UTC)."
      - name: intake_status
        type: enum
        source: system
        description: "Whether applications may still be submitted."
        default: "OPEN"
        constraints: "one of {OPEN, CLOSED}"

  - name: Application
    parent: null
    common_fields: true
    fields:
      - name: nofo_id
        type: string
        source: input
        description: "FK -> NOFO.id; the opportunity this application answers."
      - name: nonprofit_id
        type: string
        source: input
        description: "FK -> Nonprofit.id; the applying subrecipient. Must equal X-User-ID of the acting Subrecipient."
      - name: project_title
        type: string
        source: input
        description: "Applicant project title."
      - name: requested_amount_cents
        type: integer
        source: input
        description: "Total federal funds requested, in cents."
        constraints: ">= 1"
      - name: proposed_period_start
        type: datetime
        source: input
        description: "Proposed performance period start (ISO 8601 UTC)."
      - name: proposed_period_end
        type: datetime
        source: input
        description: "Proposed performance period end (ISO 8601 UTC). Must be strictly after proposed_period_start."
      - name: indirect_method
        type: enum
        source: input
        description: "Indirect cost recovery method the applicant elects."
        constraints: "one of {DE_MINIMIS, NEGOTIATED}"
      - name: negotiated_indirect_rate
        type: number
        source: input
        description: "Negotiated indirect rate (required when indirect_method=NEGOTIATED, must be <= NOFO.indirect_cost_cap_pct); ignored for DE_MINIMIS."
        constraints: "0 <= x <= 1; nullable"
      - name: status
        type: enum
        source: system
        description: "Application lifecycle state."
        default: "DRAFT"
        constraints: "one of {DRAFT, SUBMITTED, UNDER_REVIEW, REVISION_REQUESTED, SCORED, AWARDED, REJECTED}"
      - name: review_count
        type: integer
        source: computed
        description: "Number of PanelReview rows attached to this application."
        default: 0
      - name: average_score
        type: number
        source: computed
        description: "Mean of PanelReview.score over attached reviews; null when review_count=0. Rounded half-up to 2 decimals."
      - name: awarded_amount_cents
        type: integer
        source: system
        description: "Set equal to requested_amount_cents when the application is AWARDED; null otherwise."

  - name: PanelReview
    parent: null
    common_fields: false
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> Application.id; the application being scored."
      - name: reviewer_user_id
        type: string
        source: system
        description: "X-User-ID of the Panelist who submitted this review; unique per (application_id, reviewer_user_id)."
      - name: score
        type: integer
        source: input
        description: "Panel score 0-100."
        constraints: "0 <= x <= 100"
      - name: comments
        type: string
        source: input
        description: "Optional reviewer comments."

  - name: Subaward
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: system
        description: "FK -> Application.id; the awarded application this subaward implements."
      - name: nonprofit_id
        type: string
        source: system
        description: "FK -> Nonprofit.id; denormalized subrecipient (copied from the application)."
      - name: nofo_id
        type: string
        source: system
        description: "FK -> NOFO.id; denormalized opportunity (copied from the application), used to group period-overlap checks."
      - name: period_start
        type: datetime
        source: system
        description: "Performance period start, copied from Application.proposed_period_start."
      - name: period_end
        type: datetime
        source: system
        description: "Performance period end, copied from Application.proposed_period_end."
      - name: total_budget_cents
        type: integer
        source: system
        description: "Approved budget total, copied from Application.requested_amount_cents."
      - name: indirect_method
        type: enum
        source: system
        description: "Copied from the application."
        constraints: "one of {DE_MINIMIS, NEGOTIATED}"
      - name: negotiated_indirect_rate
        type: number
        source: system
        description: "Copied from the application (null for DE_MINIMIS)."
      - name: indirect_cost_cents
        type: integer
        source: computed
        description: "Indirect recovery computed by the indirect_cost_recovery calculation at activation from the direct BudgetLines."
        default: 0
      - name: federal_share_cents
        type: integer
        source: computed
        description: "Total federal share computed by the subaward_federal_share calculation at activation (per-line rounding)."
        default: 0
      - name: obligated_cents
        type: integer
        source: computed
        description: "Ledger: sum of reimbursable_cents over Drawdowns in {SUBMITTED, APPROVED, PAID}. Debited on drawdown submit/approve, credited back on RETURNED/DENIED."
        default: 0
      - name: disbursed_cents
        type: integer
        source: computed
        description: "Ledger: sum of reimbursable_cents over Drawdowns in {PAID}."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Subaward lifecycle state."
        default: "DRAFT"
        constraints: "one of {DRAFT, ACTIVE, SUSPENDED, CLOSEOUT_PENDING, CLOSED, TERMINATED}"

  - name: BudgetLine
    parent: Subaward
    common_fields: false
    fields:
      - name: subaward_id
        type: string
        source: input
        description: "FK -> Subaward.id; the subaward this line belongs to."
      - name: category
        type: enum
        source: input
        description: "Cost category."
        constraints: "one of {PERSONNEL, FRINGE, TRAVEL, SUPPLIES, EQUIPMENT, CONTRACTUAL, OTHER}"
      - name: amount_cents
        type: integer
        source: input
        description: "Direct cost amount for this line, in cents."
        constraints: ">= 1"
      - name: federal_share_pct
        type: number
        source: input
        description: "Fraction of this line borne by federal funds (rest is match)."
        constraints: "0 <= x <= 1"
      - name: description
        type: string
        source: input
        description: "Optional line description."

  - name: Drawdown
    parent: null
    common_fields: true
    fields:
      - name: subaward_id
        type: string
        source: input
        description: "FK -> Subaward.id; the subaward being drawn against."
      - name: requested_amount_cents
        type: integer
        source: input
        description: "Reimbursement amount requested by the subrecipient, in cents."
        constraints: ">= 1"
      - name: period_covered_start
        type: datetime
        source: input
        description: "Start of the expenditure period this drawdown documents."
      - name: period_covered_end
        type: datetime
        source: input
        description: "End of the expenditure period; must be strictly after period_covered_start."
      - name: disallowed_amount_cents
        type: integer
        source: input
        description: "Amount the reviewer disallows for unsupported documentation, supplied at approval; default 0."
        default: 0
      - name: provisional_reimbursable_cents
        type: integer
        source: computed
        description: "Computed at SUBMIT by drawdown_reimbursable (PROVISIONAL variant): min(requested_amount_cents, subaward.available_cents at submit)."
        default: 0
      - name: final_reimbursable_cents
        type: integer
        source: computed
        description: "Computed at APPROVE by drawdown_reimbursable (FINAL variant): min(requested_amount_cents - disallowed_amount_cents, available_at_submit). Null until approved."
      - name: reimbursable_cents
        type: integer
        source: computed
        description: "The amount currently contributing to subaward.obligated_cents: provisional_reimbursable_cents while SUBMITTED, final_reimbursable_cents once APPROVED/PAID, 0 once RETURNED/DENIED."
        default: 0
      - name: submitted_by_user_id
        type: string
        source: system
        description: "X-User-ID (Nonprofit.id) of the subrecipient who submitted the drawdown."
      - name: reviewed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the GrantsManager who approved/returned the drawdown; null until then."
      - name: status
        type: enum
        source: system
        description: "Drawdown lifecycle state."
        default: "SUBMITTED"
        constraints: "one of {SUBMITTED, APPROVED, RETURNED, DENIED, PAID}"

  - name: RiskAssessment
    parent: null
    common_fields: true
    fields:
      - name: subaward_id
        type: string
        source: input
        description: "FK -> Subaward.id; the subaward assessed."
      - name: assessed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the GrantsManager who ran the assessment (basis of the drawdown-approval SoD four-eyes rule)."
      - name: findings_component
        type: integer
        source: computed
        description: "min(open_findings_count * 15, 45) where open_findings are this nonprofit's Findings not in RESOLVED."
      - name: audit_component
        type: integer
        source: computed
        description: "Single-audit posture points (see risk_score calculation)."
      - name: velocity_component
        type: integer
        source: computed
        description: "Drawdown velocity points from paid_ratio of this subaward."
      - name: size_component
        type: integer
        source: computed
        description: "Award-size points."
      - name: risk_score
        type: integer
        source: computed
        description: "Sum of the four components, capped at 100."
      - name: risk_tier
        type: enum
        source: computed
        description: "Tiering of risk_score."
        constraints: "one of {LOW, MODERATE, HIGH}"

  - name: MonitoringVisit
    parent: null
    common_fields: true
    fields:
      - name: subaward_id
        type: string
        source: input
        description: "FK -> Subaward.id; the subaward monitored."
      - name: monitor_user_id
        type: string
        source: system
        description: "X-User-ID of the GrantsManager conducting the visit; overlap is checked per monitor_user_id."
      - name: scheduled_start
        type: datetime
        source: input
        description: "Visit window start (ISO 8601 UTC)."
      - name: scheduled_end
        type: datetime
        source: input
        description: "Visit window end (ISO 8601 UTC). Must be strictly after scheduled_start."
      - name: outcome
        type: enum
        source: input
        description: "Set at conduct."
        constraints: "one of {SATISFACTORY, DEFICIENT}; nullable until conducted"
      - name: finding_severity
        type: enum
        source: input
        description: "Severity of the Finding to raise at conduct (omit for no finding)."
        constraints: "one of {LOW, MODERATE, HIGH, CRITICAL}; nullable"
      - name: status
        type: enum
        source: system
        description: "Visit lifecycle state."
        default: "SCHEDULED"
        constraints: "one of {SCHEDULED, CONDUCTED}"

  - name: PerformanceReport
    parent: null
    common_fields: true
    fields:
      - name: subaward_id
        type: string
        source: input
        description: "FK -> Subaward.id; the subaward reported on."
      - name: reporting_period_start
        type: datetime
        source: input
        description: "Reporting period start (ISO 8601 UTC)."
      - name: reporting_period_end
        type: datetime
        source: input
        description: "Reporting period end; must be strictly after reporting_period_start."
      - name: metric_target
        type: integer
        source: input
        description: "Planned outcome metric value."
      - name: metric_actual
        type: integer
        source: input
        description: "Achieved outcome metric value."
      - name: outcome_narrative
        type: string
        source: input
        description: "Optional narrative."
      - name: on_track
        type: boolean
        source: computed
        description: "True iff metric_actual >= metric_target."

  - name: SingleAudit
    parent: null
    common_fields: true
    fields:
      - name: nonprofit_id
        type: string
        source: input
        description: "FK -> Nonprofit.id; the audited organization."
      - name: fiscal_year
        type: integer
        source: input
        description: "Audited fiscal year."
      - name: total_federal_expenditures_cents
        type: integer
        source: input
        description: "Total federal awards expended in the fiscal year, in cents (self-reported)."
        constraints: ">= 0"
      - name: audit_required
        type: boolean
        source: computed
        description: "True iff total_federal_expenditures_cents >= SINGLE_AUDIT_THRESHOLD_CENTS (single_audit_requirement calculation)."
      - name: material_weakness
        type: boolean
        source: input
        description: "Whether the audit reported a material weakness."
        default: false
      - name: reported_finding_count
        type: integer
        source: input
        description: "Number of audit findings reported."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Audit review state."
        default: "SUBMITTED"
        constraints: "one of {SUBMITTED, ACCEPTED}"

  - name: Finding
    parent: null
    common_fields: true
    fields:
      - name: subaward_id
        type: string
        source: input
        description: "FK -> Subaward.id; the subaward the finding is charged against."
      - name: source_kind
        type: enum
        source: system
        description: "Whether the finding originated from a monitoring visit or a single audit."
        constraints: "one of {MONITORING, SINGLE_AUDIT}"
      - name: origin_ref_id
        type: string
        source: system
        description: "Id of the originating MonitoringVisit (source_kind=MONITORING) or SingleAudit (source_kind=SINGLE_AUDIT). Polymorphic reference resolved via source_kind; not a hard FK."
      - name: severity
        type: enum
        source: system
        description: "Finding severity."
        constraints: "one of {LOW, MODERATE, HIGH, CRITICAL}"
      - name: description
        type: string
        source: system
        description: "System-generated finding description."
      - name: corrective_action_plan
        type: string
        source: input
        description: "CAP narrative supplied by the subrecipient at submit-cap; null until then."
      - name: cap_due_date
        type: datetime
        source: input
        description: "Optional CAP due date."
      - name: status
        type: enum
        source: system
        description: "Finding lifecycle state."
        default: "OPEN"
        constraints: "one of {OPEN, CAP_SUBMITTED, CAP_ACCEPTED, RESOLVED}"

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: Application
    initial_state: DRAFT
    terminal_states: [AWARDED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /applications/{id}/submit"
        actor: Subrecipient
        preconditions:
          - "acting Subrecipient owns the application (nonprofit_id == X-User-ID)"
          - "parent NOFO.intake_status == OPEN"
        side_effects: []
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /applications/{id}/start-review"
        actor: ProgramOfficer
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /applications/{id}/request-revision"
        actor: ProgramOfficer
        preconditions: []
        side_effects: []
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /applications/{id}/submit"
        actor: Subrecipient
        preconditions:
          - "acting Subrecipient owns the application"
        side_effects: ["clears any prior PanelReviews are retained; review_count unchanged"]
        note: "Cyclic revision loop; intake_status is NOT re-checked on resubmit of an existing application."
      - from: UNDER_REVIEW
        to: SCORED
        trigger: "system: MIN_PANEL_REVIEWS reached on POST /applications/{id}/reviews"
        actor: system
        preconditions:
          - "review_count reaches MIN_PANEL_REVIEWS (3) after this review is stored"
        side_effects: ["recompute average_score"]
        note: "Auto-transition fired as a side effect of the 3rd PanelReview."
      - from: SCORED
        to: AWARDED
        trigger: "POST /applications/{id}/award"
        actor: ProgramOfficer
        preconditions:
          - "requested_amount_cents <= NOFO.remaining_pool_cents (else ERR_POOL_EXCEEDED)"
          - "requested_amount_cents <= NOFO.max_award_cents (else ERR_MAX_AWARD_EXCEEDED)"
          - "the applicant nonprofit has no other non-terminal Subaward under this NOFO whose period overlaps [proposed_period_start, proposed_period_end] within SUBAWARD_PERIOD_GAP_DAYS (else ERR_PERIOD_OVERLAP)"
        side_effects:
          - "set awarded_amount_cents = requested_amount_cents"
          - "debit NOFO.remaining_pool_cents by awarded_amount_cents"
          - "create Subaward{status=DRAFT} copying application_id, nonprofit_id, nofo_id, period, total_budget_cents=requested_amount_cents, indirect_method, negotiated_indirect_rate"
      - from: SCORED
        to: REJECTED
        trigger: "POST /applications/{id}/reject"
        actor: ProgramOfficer
        preconditions: []
        side_effects: []

  - entity: Subaward
    initial_state: DRAFT
    terminal_states: [CLOSED, TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /subawards/{id}/activate"
        actor: ProgramOfficer
        preconditions:
          - "at least one BudgetLine exists (else ERR_NO_BUDGET_LINES)"
          - "if indirect_method=NEGOTIATED, negotiated_indirect_rate is present (else ERR_INDIRECT_RATE_REQUIRED)"
          - "sum(direct BudgetLine.amount_cents) + computed indirect_cost_cents == total_budget_cents (else ERR_BUDGET_NOT_BALANCED)"
        side_effects:
          - "compute and store indirect_cost_cents via indirect_cost_recovery"
          - "compute and store federal_share_cents via subaward_federal_share"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /subawards/{id}/suspend OR system cascade from a CRITICAL Finding"
        actor: GrantsManager
        preconditions: []
        side_effects:
          - "for each Drawdown on this subaward in {SUBMITTED}: transition it to RETURNED (which credits obligated_cents back)"
        note: "Cascade target: a CRITICAL Finding creation suspends the subaward, which then returns pending drawdowns."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /subawards/{id}/reinstate"
        actor: GrantsManager
        preconditions: []
        side_effects: []
        note: "Cyclic ACTIVE<->SUSPENDED loop."
      - from: ACTIVE
        to: CLOSEOUT_PENDING
        trigger: "POST /subawards/{id}/initiate-closeout"
        actor: ProgramOfficer
        preconditions: []
        side_effects: []
      - from: CLOSEOUT_PENDING
        to: CLOSED
        trigger: "POST /subawards/{id}/close"
        actor: ProgramOfficer
        preconditions:
          - "every Finding on this subaward is RESOLVED (else ERR_OPEN_FINDINGS)"
        side_effects:
          - "for each Drawdown in {SUBMITTED, RETURNED}: transition it to DENIED (which credits obligated_cents back)"
      - from: DRAFT
        to: TERMINATED
        trigger: "POST /subawards/{id}/terminate"
        actor: ProgramOfficer
        preconditions: []
        side_effects:
          - "credit NOFO.remaining_pool_cents back by the application's awarded_amount_cents (compensates the award debit; subaward never activated)"
        note: "Compensating action for the pool-conservation invariant."
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /subawards/{id}/terminate"
        actor: ProgramOfficer
        preconditions: []
        side_effects:
          - "for each Drawdown in {SUBMITTED, RETURNED}: transition it to DENIED"
        note: "An already-activated subaward does NOT return funds to the NOFO pool (obligation already recognized)."
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /subawards/{id}/terminate"
        actor: ProgramOfficer
        preconditions: []
        side_effects:
          - "for each Drawdown in {SUBMITTED, RETURNED}: transition it to DENIED"

  - entity: Drawdown
    initial_state: SUBMITTED
    terminal_states: [DENIED, PAID]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /drawdowns/{id}/approve"
        actor: GrantsManager
        preconditions:
          - "acting GrantsManager's X-User-ID is not the assessed_by_user_id of any RiskAssessment on this subaward (else ERR_SOD_CONFLICT)"
        side_effects:
          - "compute final_reimbursable_cents (FINAL variant), set reimbursable_cents = final_reimbursable_cents"
          - "adjust subaward.obligated_cents by (final - provisional) delta"
          - "set reviewed_by_user_id"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /drawdowns/{id}/return OR system cascade from subaward SUSPENDED"
        actor: GrantsManager
        preconditions: []
        side_effects:
          - "set reimbursable_cents = 0; credit subaward.obligated_cents back by the prior provisional_reimbursable_cents"
          - "set reviewed_by_user_id (when returned via endpoint)"
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /drawdowns/{id}/resubmit"
        actor: Subrecipient
        preconditions:
          - "acting Subrecipient owns the subaward"
          - "subaward.status == ACTIVE"
        side_effects:
          - "recompute provisional_reimbursable_cents; set reimbursable_cents = provisional_reimbursable_cents; re-debit subaward.obligated_cents"
        note: "Cyclic RETURNED->SUBMITTED loop."
      - from: SUBMITTED
        to: DENIED
        trigger: "system cascade from subaward CLOSED / TERMINATED"
        actor: system
        preconditions: []
        side_effects:
          - "set reimbursable_cents = 0; credit subaward.obligated_cents back by the prior provisional_reimbursable_cents"
      - from: RETURNED
        to: DENIED
        trigger: "system cascade from subaward CLOSED / TERMINATED"
        actor: system
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: PAID
        trigger: "POST /drawdowns/{id}/pay"
        actor: ProgramOfficer
        preconditions: []
        side_effects:
          - "add reimbursable_cents to subaward.disbursed_cents"
          - "recompute nonprofit.cumulative_federal_expenditures_cents"

  - entity: Finding
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: CAP_SUBMITTED
        trigger: "POST /findings/{id}/submit-cap"
        actor: Subrecipient
        preconditions:
          - "acting Subrecipient owns the subaward"
        side_effects: ["store corrective_action_plan"]
      - from: CAP_SUBMITTED
        to: CAP_ACCEPTED
        trigger: "POST /findings/{id}/accept-cap"
        actor: GrantsManager
        preconditions: []
        side_effects: []
      - from: CAP_SUBMITTED
        to: OPEN
        trigger: "POST /findings/{id}/reject-cap"
        actor: GrantsManager
        preconditions: []
        side_effects: ["clear corrective_action_plan"]
        note: "Cyclic CAP_SUBMITTED->OPEN loop."
      - from: CAP_ACCEPTED
        to: RESOLVED
        trigger: "POST /findings/{id}/resolve"
        actor: GrantsManager
        preconditions: []
        side_effects: []

  - entity: MonitoringVisit
    initial_state: SCHEDULED
    terminal_states: [CONDUCTED]
    transitions:
      - from: SCHEDULED
        to: CONDUCTED
        trigger: "POST /monitoring-visits/{id}/conduct"
        actor: GrantsManager
        preconditions:
          - "subaward.status in {ACTIVE, SUSPENDED}"
        side_effects:
          - "set outcome"
          - "if finding_severity is provided: create Finding{status=OPEN, source_kind=MONITORING, origin_ref_id=this visit id, severity=finding_severity}"
          - "if the created Finding severity == CRITICAL: cascade — transition subaward ACTIVE->SUSPENDED (which returns pending drawdowns)"

  - entity: SingleAudit
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /single-audits/{id}/accept"
        actor: GrantsManager
        preconditions: []
        side_effects:
          - "if material_weakness == true: create Finding{status=OPEN, source_kind=SINGLE_AUDIT, origin_ref_id=this audit id, severity=HIGH} on the SELECTED subaward — eligibility: subawards where nonprofit_id==this.nonprofit_id AND status==ACTIVE; ranking: created_at ASC; tie-break: created_at then id-insertion order; fallback: if none ACTIVE, accept the audit and create no finding"

# =====================================================================
# §1.2.1 Concurrency Rules
# =====================================================================
concurrency_rules:
  - rule_id: drawdown-create-stale-subaward
    parent_entity: Subaward
    write_endpoint: "POST /subawards/{id}/drawdowns"
    occ_field: "expected_subaward_version"
    description: |
      Creating a Drawdown against a Subaward whose version has advanced since the
      client last observed it is rejected. Every drawdown submit/approve/return
      changes obligated_cents and bumps subaward.version, so a client that read the
      subaward, then created one drawdown, and now submits a second create still
      carrying the earlier version is working from a stale view of the remaining
      obligation and is rejected on the version mismatch.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: indirect_cost_recovery
    trigger: "on POST /subawards/{id}/activate (Subaward DRAFT->ACTIVE)"
    algorithm: tiered_pricing
    formula: |
      # Modified Total Direct Cost (MTDC) base:
      base = 0
      for line in BudgetLines(subaward):
        if line.category == EQUIPMENT: continue          # equipment excluded from MTDC
        elif line.category == CONTRACTUAL:
          base += min(line.amount_cents, MTDC_SUBAWARD_CAP_CENTS)   # only first $25k of each contract
        else:
          base += line.amount_cents
      rate = DE_MINIMIS_INDIRECT_RATE if indirect_method == DE_MINIMIS else negotiated_indirect_rate
      indirect_cost_cents = round_half_up(base * rate)
    input_set: "All BudgetLine rows on the subaward at activation; EQUIPMENT lines excluded from base, CONTRACTUAL lines capped at MTDC_SUBAWARD_CAP_CENTS each."
    constants:
      DE_MINIMIS_INDIRECT_RATE: 0.10
      MTDC_SUBAWARD_CAP_CENTS: 2500000
    precision: "integer cents, round_half_up"
    variants:
      - name: DE_MINIMIS
        when: "subaward.indirect_method == DE_MINIMIS"
        difference: "rate fixed at 0.10 regardless of negotiated_indirect_rate."
      - name: NEGOTIATED
        when: "subaward.indirect_method == NEGOTIATED"
        difference: "rate = subaward.negotiated_indirect_rate; produces a different indirect_cost_cents for identical BudgetLines."

  - name: drawdown_reimbursable
    trigger: "PROVISIONAL on POST /subawards/{id}/drawdowns (submit) and resubmit; FINAL on POST /drawdowns/{id}/approve"
    algorithm: forward_looking
    formula: |
      available_at_submit = subaward.total_budget_cents - subaward.obligated_cents   # BEFORE adding this drawdown
      # PROVISIONAL (at submit/resubmit):
      provisional_reimbursable_cents = min(requested_amount_cents, available_at_submit)
      # FINAL (at approve):
      final_reimbursable_cents = min(requested_amount_cents - disallowed_amount_cents, available_at_submit)
    input_set: "available_at_submit uses obligated_cents measured immediately before this drawdown's contribution; disallowed_amount_cents supplied at approval (default 0)."
    constants: {}
    precision: "integer cents"
    variants:
      - name: PROVISIONAL
        when: "at submit/resubmit"
        difference: "assumes the full requested amount is supported (disallowed=0)."
      - name: FINAL
        when: "at approve"
        difference: "subtracts disallowed_amount_cents before capping; diverges from PROVISIONAL whenever disallowed_amount_cents > 0."

  - name: subaward_federal_share
    trigger: "on POST /subawards/{id}/activate (Subaward DRAFT->ACTIVE)"
    algorithm: aggregation
    formula: |
      # Per-line rounding pinned: round EACH line's federal share to the cent, THEN sum.
      federal_share_cents = 0
      for line in BudgetLines(subaward):        # ordered by created_at ASC
        federal_share_cents += round_half_up(line.amount_cents * line.federal_share_pct)
    input_set: "All BudgetLine rows on the subaward (direct lines only; indirect_cost_cents is not a BudgetLine and carries no federal share)."
    constants: {}
    precision: "integer cents, round_half_up per line before summation (NOT sum-then-round)"

  - name: risk_score
    trigger: "on POST /subawards/{id}/risk-assessments"
    algorithm: weighted_scoring
    formula: |
      open_findings = count(Finding f where subaward(f).nonprofit_id == nonprofit_id AND f.status in {OPEN, CAP_SUBMITTED, CAP_ACCEPTED})
      findings_component = min(open_findings * 15, 45)

      latest_audit = SingleAudit for this nonprofit with max fiscal_year (tie-break created_at DESC); may be null
      if latest_audit is null and nonprofit.cumulative_federal_expenditures_cents >= SINGLE_AUDIT_THRESHOLD_CENTS:
        audit_component = 30      # delinquent: audit required but none on file
      elif latest_audit is null:
        audit_component = 10
      elif latest_audit.status == ACCEPTED and latest_audit.reported_finding_count > 0:
        audit_component = 20
      elif latest_audit.status == ACCEPTED:
        audit_component = 0
      else:                        # SUBMITTED (not yet accepted)
        audit_component = 15

      paid_ratio = subaward.disbursed_cents / subaward.total_budget_cents   # this subaward
      if paid_ratio > 0.90: velocity_component = 20
      elif paid_ratio >= 0.50: velocity_component = 10
      else: velocity_component = 0

      size_component = 10 if subaward.total_budget_cents >= 50000000 else 5

      risk_score = min(findings_component + audit_component + velocity_component + size_component, 100)
      risk_tier = HIGH if risk_score >= 60 else (MODERATE if risk_score >= 30 else LOW)
    input_set: "Findings across all of the nonprofit's subawards; the nonprofit's latest SingleAudit; THIS subaward's disbursed_cents and total_budget_cents."
    constants:
      SINGLE_AUDIT_THRESHOLD_CENTS: 75000000
    precision: "integer points; tier cutoffs at 60 (HIGH) and 30 (MODERATE), '>=' boundaries"

  - name: single_audit_requirement
    trigger: "on POST /nonprofits/{id}/single-audits"
    algorithm: threshold
    formula: |
      audit_required = (total_federal_expenditures_cents >= SINGLE_AUDIT_THRESHOLD_CENTS)
    input_set: "The submitted total_federal_expenditures_cents."
    constants:
      SINGLE_AUDIT_THRESHOLD_CENTS: 75000000
    precision: "boolean; '>=' boundary — exactly 75000000 is required=true, 74999999 is required=false"

  - name: budget_balance
    trigger: "on POST /subawards/{id}/activate (gate check)"
    algorithm: aggregation
    formula: |
      direct_sum = sum(BudgetLine.amount_cents for all lines)
      indirect = indirect_cost_recovery(subaward)
      balanced = (direct_sum + indirect == total_budget_cents)
    input_set: "All BudgetLine rows; computed indirect. Requires >= 1 line."
    constants: {}
    precision: "exact integer equality; any nonzero variance (even 1 cent) fails with ERR_BUDGET_NOT_BALANCED"

# =====================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role is permitted to invoke this endpoint per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path-referenced resources exist, validated left-to-right"
    error_id: "ERR_*_NOT_FOUND"
    http_status: 404
    applies_to: "all /{id} routes"
  - priority: 4
    category: business_referential
    check: "Acting Subrecipient owns the target resource (application.nonprofit_id / subaward.nonprofit_id == X-User-ID)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "subrecipient-owned writes (submit, resubmit, drawdowns, performance-reports, submit-cap, single-audits)"
  - priority: 5
    category: state
    check: "Target resource is in a state from which this transition is legal"
    error_id: "ERR_INVALID_*_STATE / ERR_SUBAWARD_NOT_ACTIVE / ERR_INTAKE_CLOSED / ERR_APPLICATION_NOT_SCORED"
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 6
    category: business_safety
    check: "SoD four-eyes: on drawdown approve, X-User-ID must not be the assessed_by_user_id of any RiskAssessment on the subaward"
    error_id: ERR_SOD_CONFLICT
    http_status: 403
    applies_to: "POST /drawdowns/{id}/approve"
  - priority: 7
    category: business_constraint
    check: "Panelist has not already reviewed this application (unique reviewer_user_id per application)"
    error_id: ERR_DUPLICATE_REVIEW
    http_status: 409
    applies_to: "POST /applications/{id}/reviews"
  - priority: 8
    category: business_constraint
    check: "Subaward has >= 1 BudgetLine at activation"
    error_id: ERR_NO_BUDGET_LINES
    http_status: 409
    applies_to: "POST /subawards/{id}/activate"
  - priority: 9
    category: business_constraint
    check: "NEGOTIATED indirect method has a negotiated_indirect_rate present at activation"
    error_id: ERR_INDIRECT_RATE_REQUIRED
    http_status: 409
    applies_to: "POST /subawards/{id}/activate"
  - priority: 10
    category: business_constraint
    check: "direct_sum + indirect == total_budget_cents at activation"
    error_id: ERR_BUDGET_NOT_BALANCED
    http_status: 409
    applies_to: "POST /subawards/{id}/activate"
  - priority: 11
    category: business_temporal
    check: "MonitoringVisit window does not overlap another visit by the same monitor_user_id; half-open [start,end), adjacency allowed"
    error_id: ERR_VISIT_OVERLAP
    http_status: 409
    applies_to: "POST /subawards/{id}/monitoring-visits"
  - priority: 12
    category: business_temporal
    check: "Awarded subaward period does not overlap (within SUBAWARD_PERIOD_GAP_DAYS, closed interval) another non-terminal subaward of the same nonprofit under the same NOFO"
    error_id: ERR_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /applications/{id}/award"
  - priority: 13
    category: business_referential
    check: "Subaward closeout requires every Finding on the subaward RESOLVED"
    error_id: ERR_OPEN_FINDINGS
    http_status: 409
    applies_to: "POST /subawards/{id}/close"
  - priority: 14
    category: business_fiscal
    check: "Award requested_amount_cents does not exceed NOFO.max_award_cents"
    error_id: ERR_MAX_AWARD_EXCEEDED
    http_status: 409
    applies_to: "POST /applications/{id}/award"
  - priority: 15
    category: business_fiscal
    check: "Award requested_amount_cents does not exceed NOFO.remaining_pool_cents"
    error_id: ERR_POOL_EXCEEDED
    http_status: 409
    applies_to: "POST /applications/{id}/award"
  - priority: 16
    category: business_fiscal
    check: "Drawdown requested_amount_cents does not exceed subaward available (total_budget_cents - obligated_cents)"
    error_id: ERR_INSUFFICIENT_BUDGET
    http_status: 409
    applies_to: "POST /subawards/{id}/drawdowns, POST /drawdowns/{id}/resubmit"
  - priority: 17
    category: business_constraint
    check: "OCC: expected_subaward_version matches current Subaward.version on drawdown create"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /subawards/{id}/drawdowns"
  - priority: 18
    category: business_constraint
    check: "Field-level validation: required fields present, enums valid, amounts positive, period_end > period_start, negotiated rate <= NOFO cap"
    error_id: "ERR_VALIDATION / ERR_INVALID_PERIOD / ERR_AMOUNT_NOT_POSITIVE"
    http_status: 422
    applies_to: "all writes"

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-05-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [ProgramOfficer]
    code: 200
    input: [to_iso8601]
    output: "null"
    side_effects: ["advances the logical clock used for all datetime comparisons"]

  - method: POST
    path: "/nonprofits"
    description: "Register a subrecipient organization."
    roles: [ProgramOfficer]
    code: 201
    input: [legal_name, uei, ein]
    output: Nonprofit
    side_effects: ["cumulative_federal_expenditures_cents initialized to 0"]
  - method: GET
    path: "/nonprofits/{id}"
    description: "Fetch a nonprofit."
    roles: [ProgramOfficer, GrantsManager, Subrecipient, Panelist]
    code: 200
    input: []
    output: Nonprofit
    side_effects: []
  - method: GET
    path: "/nonprofits/{id}/single-audits"
    description: "List a nonprofit's single audits (reverse reachability for SingleAudit.nonprofit_id)."
