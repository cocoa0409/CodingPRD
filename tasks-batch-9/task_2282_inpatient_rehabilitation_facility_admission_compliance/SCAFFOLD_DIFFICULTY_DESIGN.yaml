            - "Admission.${adm_b_id}.compliance_class == NON_QUALIFYING"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: credited_minutes_group_floor_per_session_then_sum
        grounds:
          - calculations.credited_therapy_minutes
          - entities.TherapySession.fields.credited_minutes
          - entities.TherapySession.fields.raw_minutes
          - entities.TherapyWeek.fields.delivered_credited_minutes
          - validations[priority=120]
        distinguishing_aspect: |
          Three 50-minute GROUP sessions with group_size 3 on one calendar date credit
          floor(50/3) = 16 minutes each for a week total of exactly 48, proving the
          pinned rounding order (floor per session, then sum) rather than the
          divide-after-summing order that would yield floor(150/3) = 50.
        test_recipe:
          setup:
            - "One facility, one nurse, one rehab physician, one THERAPIST_PT."
            - "Patient A with a PHYSICIAN_CONCURRED screening and an admission admitted 2026-08-04T12:00:00Z."
            - "ACTIVE plan of care with disciplines [PT] and three_hour_rule_mode DAILY_3HR; TherapyWeek week_index 1 starting 2026-08-04."
            - "Three GROUP sessions of group_size 3 on 2026-08-05 at 09:00-09:50, 10:00-10:50 and 11:00-11:50 — each pair separated by exactly the 10-minute rest buffer."
            - "Clock advanced to 2026-08-05T18:00:00Z, then all three sessions delivered."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /facilities"
              payload: { name: "Northside IRF", cms_ccn: "100003", review_period_start: "2026-08-01", review_period_end: "2026-08-31" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { fac_id: $.data.id }
            - call: "POST /clinicians"
              payload: { facility_id: "${fac_id}", full_name: "Nina Nurse", credential: "NURSE", npi: "1000000001" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
