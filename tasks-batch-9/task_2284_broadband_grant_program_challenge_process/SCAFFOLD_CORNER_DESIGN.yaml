              as_user_id: "admin-1"
            - call: "POST /broadband/awards"
              payload: { application_id: "${a1_id}" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { aw1_id: $.data.id }
            - call: "POST /broadband/awards/${aw1_id}/environmental-review"
              payload: { tribal_consultation_required: false, shpo_consultation_required: false }
              as: EnvironmentalReviewer
              as_user_id: "ehp-1"
            - call: "POST /broadband/awards/${aw1_id}/environmental-review/determination"
              payload: { pathway: "CATEGORICAL_EXCLUSION" }
              as: EnvironmentalReviewer
              as_user_id: "ehp-1"
            - call: "POST /broadband/awards/${aw1_id}/environmental-review/clear"
              payload: {}
              as: EnvironmentalReviewer
              as_user_id: "ehp-1"
            - call: "POST /broadband/awards/${aw1_id}/authorize-construction"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /broadband/awards/${aw1_id}/milestones"
              payload: { sequence_no: 1, description: "Passings built at L2", evidence_basis: "BUILD_PROGRESS", planned_location_ids: ["${l2_id}"], is_final: false }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { m1_id: $.data.id }
            - call: "POST /broadband/awards/${aw1_id}/milestones/${m1_id}/submit-evidence"
              payload: { built_location_ids: ["${l2_id}"] }
              as: Subgrantee
              as_user_id: "${s1_id}"
            - call: "POST /broadband/awards/${aw1_id}/milestones/${m1_id}/verify"
              payload: { outcome: "REJECTED", rejection_reason: "As-built drawings do not match the surveyed drop." }
              as: AuditOfficer
              as_user_id: "auditor-1"
            - call: "POST /broadband/awards/${aw1_id}/milestones/${m1_id}/submit-evidence"
              payload: { built_location_ids: ["${l2_id}"] }
              as: Subgrantee
              as_user_id: "${s1_id}"
            - call: "POST /broadband/awards/${aw1_id}/milestones/${m1_id}/verify"
              payload: { outcome: "APPROVED" }
              as: AuditOfficer
              as_user_id: "auditor-1"
          trigger:
            - call: "POST /broadband/awards/${aw1_id}/milestones/${m1_id}/verify"
              payload: { outcome: "APPROVED" }
              as: AuditOfficer
              as_user_id: "auditor-1"
          assert:
            - "the trigger returns ERR_MILESTONE_STATE_INVALID (409)"
            - "Milestone.${m1_id}.milestone_state == APPROVED"
            - "Milestone.${m1_id}.resubmission_count == 1"
            - "Milestone.${m1_id}.verified_location_count == 1"
            - "Milestone.${m1_id}.payable_amount_cents == 675001"
            - "Milestone.${m1_id}.rejection_reason == As-built drawings do not match the surveyed drop."
            - "Award.${aw1_id}.award_state == CONSTRUCTION_AUTHORIZED"
            - "Award.${aw1_id}.disbursed_to_date_cents == 0"
            - "Award.${aw1_id}.last_verifier_user_id == auditor-1"
            - "EligibleLocation.${l2_id}.service_state == SERVICE_AVAILABLE"

      - name: location_creation_starts_on_both_initial_states
        claim_type: initial_state
        grounds:
          - state_machines.EligibleLocation.eligibility_state
          - state_machines.EligibleLocation.service_state
          - state_machines.EnvironmentalReview
          - state_machines.Subgrantee
        distinguishing_aspect: |
          Newly created rows must land on their declared initial states across all four independent
          machines a fresh fixture can reach without any transition call: EligibleLocation on both
          MAPPED and NOT_BUILT simultaneously, Subgrantee on REGISTERED with a null capability_index,
          and GrantProgram on DRAFT with scoring_posture FROZEN.
        test_recipe:
          setup:
            - "Empty database; logical clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /broadband/programs"
              payload: { name: "BEAD Round 1", fiscal_year: 2026, total_appropriation_cents: 100000000, challenge_window_start: "2026-08-05T00:00:00Z", challenge_window_end: "2026-09-05T00:00:00Z", application_window_start: "2026-08-05T00:00:00Z", application_window_end: "2026-09-05T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { p_id: $.data.id }
            - call: "POST /broadband/subgrantees"
              payload: { program_id: "${p_id}", legal_name: "Northline Fiber Coop", ein: "81-1234567", net_assets_cents: 900000, requested_amount_cents: 3000000, key_personnel_count: 4, has_prior_federal_award: true }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { s1_id: $.data.id }
          trigger:
            - call: "POST /broadband/locations"
              payload: { program_id: "${p_id}", address_id: "ADDR-9401", reported_down_mbps: 10, reported_up_mbps: 1, reported_latency_ms: 50, reported_technology: "DSL", reporting_provider_user_id: "prov-2" }
              as: EligibilityAnalyst
              as_user_id: "analyst-1"
              captures: { z1_id: $.data.id }
          assert:
            - "EligibleLocation.${z1_id}.eligibility_state == MAPPED"
            - "EligibleLocation.${z1_id}.service_state == NOT_BUILT"
            - "EligibleLocation.${z1_id}.classification_status == UNSERVED"
            - "EligibleLocation.${z1_id}.challenge_count == 0"
            - "Subgrantee.${s1_id}.capability_state == REGISTERED"
            - "Subgrantee.${s1_id}.review_variant == INITIAL"
            - "Subgrantee.${s1_id}.capability_index == null"
            - "Subgrantee.${s1_id}.remediation_count == 0"
            - "GrantProgram.${p_id}.program_state == DRAFT"
            - "GrantProgram.${p_id}.scoring_posture == FROZEN"

      - name: location_parallel_axes_move_independently
        claim_type: parallel
        grounds:
          - state_machines.EligibleLocation.eligibility_state
          - state_machines.EligibleLocation.service_state
        excluded_because:
          difficulty_instance: non_linear_state_machine / location_parallel_eligibility_and_service_axes
          rationale: "That instance already asserts the two axes diverging on the same call - eligibility returning to AFFIRMED for all three locations while service_state splits between SERVICE_AVAILABLE and NOT_BUILT."

      - name: award_termination_compensates_obligation_without_drift
        claim_type: compensation
        grounds:
          - state_machines.Award.transitions.OBLIGATED_to_TERMINATED
          - entities.LedgerEntry.fields.entry_type
        excluded_because:
          difficulty_instance: compensating_invariant / bound_location_occupancy_identity_across_obligation_and_termination
          rationale: "That instance asserts the full compensation: DEOBLIGATION for the exact obligated amount, all claims RELEASED, all locations back to AFFIRMED with awarded_award_id null and every program balance restored."

      - name: challenge_rebuttal_cycle_terminates_on_round_counter
        claim_type: cyclic
        grounds:
          - state_machines.Challenge.transitions.UNDER_REVIEW_to_REBUTTAL_OPEN
        excluded_because:
          difficulty_instance: non_linear_state_machine / challenge_rebuttal_round_cycle_exhaustion
          rationale: "That instance walks the REBUTTAL_OPEN -> UNDER_REVIEW loop twice and asserts the counter-based termination with ERR_REBUTTAL_ROUND_EXHAUSTED."

      - name: audit_failure_bubbles_to_subgrantee_suspension
        claim_type: cross_entity
        grounds:
          - state_machines.ComplianceAudit.transitions.SCHEDULED_to_FAILED
          - state_machines.Subgrantee.transitions.QUALIFIED_to_SUSPENDED
        excluded_because:
          difficulty_instance: transitive_cascade / audit_failure_three_hop_suspension_cascade
          rationale: "That instance asserts every hop of the audit cascade including the milestone HELD set and the subgrantee suspension counter."

  - section: calculations
    instances:
      - name: challenge_evidence_recency_multiplier_day_boundaries
        claim_type: constants_applied
        grounds:
          - calculations.challenge_evidence_sufficiency
          - entities.ChallengeEvidence.fields.recency_multiplier
          - entities.ChallengeEvidence.fields.weighted_value
        distinguishing_aspect: |
          The recency curve has three inclusive bands measured with floor((challenge.created_at -
          collected_at) / 86400). Against a challenge created at 2026-08-10T00:00:00Z the four probe
          dates 2026-02-11 / 2026-02-10 / 2025-08-10 / 2025-08-09 sit at exactly 180 / 181 / 365 /
          366 days, so each band edge is pinned on the correct side: 180 keeps 1.0, 181 drops to 0.5,
          365 still gets 0.5, and 366 collapses to 0.0 with the row marked STALE_EXCLUDED.
        test_recipe:
          setup:
            - "Program in CHALLENGE_OPEN, clock 2026-08-10T00:00:00Z, location L1 (200/25 FIBER, SERVED)."
            - "COMMUNITY challenge created at exactly 2026-08-10T00:00:00Z, then three evidence items appended at the 180-, 181- and 365-day edges."
          setup_api_calls:
            - call: "POST /broadband/programs"
              payload: { name: "BEAD Round 1", fiscal_year: 2026, total_appropriation_cents: 100000000, challenge_window_start: "2026-08-05T00:00:00Z", challenge_window_end: "2026-09-05T00:00:00Z", application_window_start: "2026-08-05T00:00:00Z", application_window_end: "2026-09-05T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /broadband/programs/${p_id}/open-challenge-window"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /broadband/locations"
              payload: { program_id: "${p_id}", address_id: "ADDR-0001", reported_down_mbps: 200, reported_up_mbps: 25, reported_latency_ms: 30, reported_technology: "FIBER", reporting_provider_user_id: "prov-2" }
              as: EligibilityAnalyst
              as_user_id: "analyst-1"
              captures: { l1_id: $.data.id }
            - call: "POST /broadband/challenges"
              payload: { program_id: "${p_id}", location_id: "${l1_id}", challenger_type: "COMMUNITY", asserted_classification: "UNDERSERVED", rationale: "Township survey shows no service above 40/8." }
              as: Challenger
              as_user_id: "comm-1"
              captures: { ch_id: $.data.id, ch_v1: $.data.version }
            - call: "POST /broadband/challenges/${ch_id}/evidence"
              payload: { evidence_type: "SERVICE_DENIAL_LETTER", collected_at: "2026-02-11T00:00:00Z", description: "Denial letter at the 180-day edge.", expected_challenge_version: "${ch_v1}" }
              as: Challenger
              as_user_id: "comm-1"
              captures: { e180_id: $.data.id }
            - call: "GET /broadband/challenges/${ch_id}"
              payload: {}
              as: Challenger
              as_user_id: "comm-1"
              captures: { ch_v2: $.data.version }
            - call: "POST /broadband/challenges/${ch_id}/evidence"
              payload: { evidence_type: "SUBSCRIBER_BILL", collected_at: "2026-02-10T00:00:00Z", description: "Subscriber bill at the 181-day edge.", expected_challenge_version: "${ch_v2}" }
              as: Challenger
              as_user_id: "comm-1"
              captures: { e181_id: $.data.id }
            - call: "GET /broadband/challenges/${ch_id}"
              payload: {}
              as: Challenger
              as_user_id: "comm-1"
              captures: { ch_v3: $.data.version }
            - call: "POST /broadband/challenges/${ch_id}/evidence"
              payload: { evidence_type: "FIELD_SURVEY", collected_at: "2025-08-10T00:00:00Z", description: "Field survey at the 365-day edge.", expected_challenge_version: "${ch_v3}" }
              as: Challenger
              as_user_id: "comm-1"
              captures: { e365_id: $.data.id }
            - call: "GET /broadband/challenges/${ch_id}"
              payload: {}
              as: Challenger
              as_user_id: "comm-1"
              captures: { ch_v4: $.data.version }
          trigger:
            - call: "POST /broadband/challenges/${ch_id}/evidence"
              payload: { evidence_type: "SPEED_TEST", collected_at: "2025-08-09T00:00:00Z", description: "Speed test at the 366-day edge.", expected_challenge_version: "${ch_v4}" }
              as: Challenger
              as_user_id: "comm-1"
              captures: { e366_id: $.data.id }
          assert:
            - "ChallengeEvidence.${e180_id}.base_weight == 30 and recency_multiplier == 1.0 and weighted_value == 30.00 and evidence_state == ACCEPTED"
            - "ChallengeEvidence.${e181_id}.base_weight == 25 and recency_multiplier == 0.5 and weighted_value == 12.50 and evidence_state == ACCEPTED"
            - "ChallengeEvidence.${e365_id}.base_weight == 20 and recency_multiplier == 0.5 and weighted_value == 10.00 and evidence_state == ACCEPTED"
            - "ChallengeEvidence.${e366_id}.base_weight == 15 and recency_multiplier == 0.0 and weighted_value == 0.00 and evidence_state == STALE_EXCLUDED"
            - "Challenge.${ch_id}.evidence_sufficiency_score == 52.50"
            - "Challenge.${ch_id}.rebuttal_strength_score == 0.00"
            - "Challenge.${ch_id}.distinct_evidence_type_count == 3"
            - "Challenge.${ch_id}.version == 5"

      - name: stale_evidence_excluded_from_distinct_types_triage_rejected
        claim_type: input_set_filtering
        grounds:
          - calculations.challenge_evidence_sufficiency.input_set
          - validations.ERR_EVIDENCE_STANDARD_NOT_MET
        distinguishing_aspect: |
          A STALE_EXCLUDED item must be dropped from both halves of the community standard, not just
          from the score. With one fresh SERVICE_DENIAL_LETTER (30.00) and one 366-day-old SPEED_TEST
          the raw item count is 2, but the surviving score is 30.00 (< 40.00) and the surviving
          distinct type count is 1 (< 2), so triage is refused; a naive implementation that counted
          the stale row's type would still fail the score test, and one that counted its weight
          would wrongly pass both.
        test_recipe:
          setup:
            - "Program in CHALLENGE_OPEN, clock 2026-08-10T00:00:00Z, location L1 (200/25 FIBER, SERVED)."
            - "COMMUNITY challenge with one fresh denial letter and one 366-day-old speed test."
          setup_api_calls:
            - call: "POST /broadband/programs"
              payload: { name: "BEAD Round 1", fiscal_year: 2026, total_appropriation_cents: 100000000, challenge_window_start: "2026-08-05T00:00:00Z", challenge_window_end: "2026-09-05T00:00:00Z", application_window_start: "2026-08-05T00:00:00Z", application_window_end: "2026-09-05T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /broadband/programs/${p_id}/open-challenge-window"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /broadband/locations"
              payload: { program_id: "${p_id}", address_id: "ADDR-0001", reported_down_mbps: 200, reported_up_mbps: 25, reported_latency_ms: 30, reported_technology: "FIBER", reporting_provider_user_id: "prov-2" }
              as: EligibilityAnalyst
              as_user_id: "analyst-1"
              captures: { l1_id: $.data.id }
            - call: "POST /broadband/challenges"
              payload: { program_id: "${p_id}", location_id: "${l1_id}", challenger_type: "COMMUNITY", asserted_classification: "UNDERSERVED", rationale: "Township survey shows no service above 40/8." }
              as: Challenger
              as_user_id: "comm-1"
              captures: { ch_id: $.data.id, ch_v1: $.data.version }
            - call: "POST /broadband/challenges/${ch_id}/evidence"
              payload: { evidence_type: "SERVICE_DENIAL_LETTER", collected_at: "2026-06-01T00:00:00Z", description: "Fresh denial letter.", expected_challenge_version: "${ch_v1}" }
              as: Challenger
              as_user_id: "comm-1"
            - call: "GET /broadband/challenges/${ch_id}"
              payload: {}
              as: Challenger
              as_user_id: "comm-1"
              captures: { ch_v2: $.data.version }
            - call: "POST /broadband/challenges/${ch_id}/evidence"
              payload: { evidence_type: "SPEED_TEST", collected_at: "2025-08-09T00:00:00Z", description: "Speed test 366 days old.", expected_challenge_version: "${ch_v2}" }
              as: Challenger
              as_user_id: "comm-1"
              captures: { stale_id: $.data.id }
          trigger:
            - call: "POST /broadband/challenges/${ch_id}/triage"
              payload: {}
              as: EligibilityAnalyst
              as_user_id: "analyst-1"
          assert:
            - "the trigger returns ERR_EVIDENCE_STANDARD_NOT_MET (409)"
            - "ChallengeEvidence.${stale_id}.evidence_state == STALE_EXCLUDED"
            - "Challenge.${ch_id}.evidence_sufficiency_score == 30.00"
            - "Challenge.${ch_id}.distinct_evidence_type_count == 1"
            - "Challenge.${ch_id}.required_sufficiency_threshold == 40.00"
            - "Challenge.${ch_id}.challenge_state == SUBMITTED"
            - "Challenge.${ch_id}.triaged_by_user_id == null"
            - "GET /broadband/challenges/${ch_id}/evidence returns total_count == 2"

      - name: provider_versus_community_evidence_standard_divergence
        claim_type: variant_divergence
        grounds:
          - calculations.challenge_evidence_sufficiency.variants
          - validations.ERR_EVIDENCE_STANDARD_NOT_MET
        distinguishing_aspect: |
          Identical evidence sets (SERVICE_DENIAL_LETTER 30.00 + SPEED_TEST 15.00 = 45.00, two
          distinct types) diverge purely on challenger_type: the community-standard challenge clears
          40.00 and the two-distinct-types test and triages successfully, while the provider-standard
          challenge fails 60.00 and also lacks the privileged PROVIDER_ATTESTATION / MAP_DATA_EXPORT
          item, so the same evidence is sufficient for one variant and insufficient for the other in
          the same fixture.
        test_recipe:
          setup:
            - "Program in CHALLENGE_OPEN at clock 2026-08-10T00:00:00Z with locations L1 and L2."
            - "COMMUNITY challenge by comm-1 on L1 and PROVIDER challenge by prov-3 on L2, each carrying the same two evidence items."
          setup_api_calls:
            - call: "POST /broadband/programs"
              payload: { name: "BEAD Round 1", fiscal_year: 2026, total_appropriation_cents: 100000000, challenge_window_start: "2026-08-05T00:00:00Z", challenge_window_end: "2026-09-05T00:00:00Z", application_window_start: "2026-08-05T00:00:00Z", application_window_end: "2026-09-05T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /broadband/programs/${p_id}/open-challenge-window"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /broadband/locations"
              payload: { program_id: "${p_id}", address_id: "ADDR-0001", reported_down_mbps: 200, reported_up_mbps: 25, reported_latency_ms: 30, reported_technology: "FIBER", reporting_provider_user_id: "prov-2" }
              as: EligibilityAnalyst
              as_user_id: "analyst-1"
              captures: { l1_id: $.data.id }
            - call: "POST /broadband/locations"
              payload: { program_id: "${p_id}", address_id: "ADDR-0002", reported_down_mbps: 50, reported_up_mbps: 10, reported_latency_ms: 40, reported_technology: "CABLE", reporting_provider_user_id: "prov-2" }
              as: EligibilityAnalyst
              as_user_id: "analyst-1"
              captures: { l2_id: $.data.id }
            - call: "POST /broadband/challenges"
              payload: { program_id: "${p_id}", location_id: "${l1_id}", challenger_type: "COMMUNITY", asserted_classification: "UNDERSERVED", rationale: "Township survey shows no service above 40/8." }
              as: Challenger
              as_user_id: "comm-1"
              captures: { chc_id: $.data.id, chc_v1: $.data.version }
            - call: "POST /broadband/challenges/${chc_id}/evidence"
              payload: { evidence_type: "SERVICE_DENIAL_LETTER", collected_at: "2026-06-01T00:00:00Z", description: "Denial letter.", expected_challenge_version: "${chc_v1}" }
              as: Challenger
              as_user_id: "comm-1"
            - call: "GET /broadband/challenges/${chc_id}"
              payload: {}
              as: Challenger
              as_user_id: "comm-1"
              captures: { chc_v2: $.data.version }
            - call: "POST /broadband/challenges/${chc_id}/evidence"
              payload: { evidence_type: "SPEED_TEST", collected_at: "2026-07-01T00:00:00Z", description: "Speed test series.", expected_challenge_version: "${chc_v2}" }
              as: Challenger
              as_user_id: "comm-1"
            - call: "POST /broadband/challenges"
              payload: { program_id: "${p_id}", location_id: "${l2_id}", challenger_type: "PROVIDER", asserted_classification: "SERVED", rationale: "Our cable plant already delivers 100/20 at this address." }
              as: Provider
              as_user_id: "prov-3"
              captures: { chp_id: $.data.id, chp_v1: $.data.version }
            - call: "POST /broadband/challenges/${chp_id}/evidence"
              payload: { evidence_type: "SERVICE_DENIAL_LETTER", collected_at: "2026-06-01T00:00:00Z", description: "Denial letter.", expected_challenge_version: "${chp_v1}" }
              as: Provider
              as_user_id: "prov-3"
            - call: "GET /broadband/challenges/${chp_id}"
              payload: {}
              as: Provider
              as_user_id: "prov-3"
              captures: { chp_v2: $.data.version }
            - call: "POST /broadband/challenges/${chp_id}/evidence"
              payload: { evidence_type: "SPEED_TEST", collected_at: "2026-07-01T00:00:00Z", description: "Speed test series.", expected_challenge_version: "${chp_v2}" }
              as: Provider
              as_user_id: "prov-3"
          trigger:
            - call: "POST /broadband/challenges/${chc_id}/triage"
              payload: {}
              as: EligibilityAnalyst
              as_user_id: "analyst-1"
            - call: "POST /broadband/challenges/${chp_id}/triage"
              payload: {}
              as: EligibilityAnalyst
              as_user_id: "analyst-1"
          assert:
            - "Challenge.${chc_id}.evidence_sufficiency_score == 45.00 and required_sufficiency_threshold == 40.00"
            - "Challenge.${chp_id}.evidence_sufficiency_score == 45.00 and required_sufficiency_threshold == 60.00"
            - "the first trigger call returns 200 and Challenge.${chc_id}.challenge_state == REBUTTAL_OPEN"
            - "the second trigger call returns ERR_EVIDENCE_STANDARD_NOT_MET (409) and Challenge.${chp_id}.challenge_state == SUBMITTED"
            - "EligibleLocation.${l1_id}.eligibility_state == CHALLENGED"
            - "EligibleLocation.${l2_id}.eligibility_state == MAPPED"
            - "the delta between the two variants is 15.00 of required headroom on the same 45.00 score"

      - name: application_total_score_cost_tier_first_breakpoint
        claim_type: threshold
        grounds:
          - calculations.application_total_score
