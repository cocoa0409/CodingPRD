      - name: segregation_of_duties_keys_on_the_acting_user_id_not_on_the_role
        claim_type: segregation_of_duties
        grounds:
          - rbac.roles[FinanceOfficer]
          - rbac.roles[RegistrarStaff]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - validations[priority 52]
          - validations[priority 53]
        distinguishing_aspect: |
          Both segregation rules are identity rules, not role rules: the refused caller and
          the accepted caller carry the SAME X-User-Role and the SAME payload, and differ
          only in X-User-ID. registrar-1 recorded Ada's absence, so registrar-1 cannot rule
          on the excuse while registrar-2 can; fin-reviewer-1 moved the aid request to
          UNDER_REVIEW, so fin-reviewer-1 cannot execute the award run that funds it while
          fin-director-9 can. An implementation that checked only the role would accept all
          four calls; one that checked the role pair rather than the recorded user id would
          reject all four.
