# =============================================================================
# §1.8 Scaffold Difficulty Design — Prepaid Restaurant Ticketing
#
# 9 rule_id blocks, 29 instances. Every money and score literal below was
# computed by executing the §1.3 formulas against their `constants:`.
# The logical clock starts at 2026-08-01T00:00:00Z; every instance sets it
# explicitly. 2026-09-12 is a SATURDAY (DOW_BP 12500).
# =============================================================================

scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: cancellation_settlement_deposit_basis_vs_full_ticket_basis
        grounds:
          - calculations.cancellation_settlement
          - entities.ExperiencePackage.fields.forfeiture_basis
          - entities.Reservation.fields.cancel_settlement_basis
          - state_machines.Reservation.payment_status.DEPOSIT_PAID_to_PARTIALLY_REFUNDED
          - state_machines.Reservation.payment_status.DEPOSIT_PAID_to_FORFEITED
        distinguishing_aspect: |
          Two reservations with byte-identical money inputs (unit price 18000,
          party 2, grand_total_cents 38610, amount_paid_cents 11583, STANDARD
          ladder, cancelled at exactly 48.0 hours) settle to refund 5291 under
          DEPOSIT_BASIS and refund 0 under FULL_TICKET_BASIS, because the
          variant selects which amount the 5000 bp band multiplies; this
          instance lives in the Reservation money domain.
        test_recipe:
          setup:
            - "one restaurant with service_charge_bp 725 and a STANDARD forfeiture ladder"
            - "two experience packages identical in every field except forfeiture_basis (DEPOSIT_BASIS vs FULL_TICKET_BASIS)"
            - "one PUBLISHED Saturday DINNER service on 2026-09-12 at demand_tier HIGH, seating_start 2026-09-12T22:00:00Z"
            - "one 20-seat ticket class per package"
            - "two guests, each holding a CONFIRMED party-of-2 reservation with amount_paid_cents 11583 (the 3000 bp deposit of a 38610 grand total)"
            - "logical clock advanced to 2026-09-10T22:00:00Z, exactly 48.0 hours before seating"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /restaurants"
              payload: { name: "Aurum", service_charge_bp: 725, hold_ttl_minutes: 20, offer_ttl_minutes: 15, max_offer_rounds: 2, max_name_changes: 1, name_change_cutoff_minutes: 240, transfer_cutoff_minutes: 1440, max_transfers_per_guest: 2, no_show_grace_minutes: 30, goodwill_credit_cap_cents: 20000, prep_lead_minutes: 45, refund_scrutiny_threshold_cents: 30000 }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /guests"
              payload: { email: "g1@aurum.test", display_name: "Guest One" }
              as: PlatformAdmin
              captures: { g1_id: $.data.id }
            - call: "POST /guests"
              payload: { email: "g2@aurum.test", display_name: "Guest Two" }
              as: PlatformAdmin
              captures: { g2_id: $.data.id }
            - call: "POST /experience-packages"
              payload: { restaurant_id: "${r_id}", name: "Tasting Deposit Basis", course_count: 8, base_price_cents: 12000, prepayment_mode: "DEPOSIT", deposit_bp: 3000, forfeiture_schedule_code: "STANDARD", forfeiture_basis: "DEPOSIT_BASIS", release_discount_bp: 1500, kitchen_prep_minutes_per_cover: 12, min_party_size: 1, max_party_size: 8 }
              as: RestaurantManager
              as_user_id: "${r_id}"
              captures: { pkg_dep_id: $.data.id }
            - call: "POST /experience-packages"
              payload: { restaurant_id: "${r_id}", name: "Tasting Full Ticket Basis", course_count: 8, base_price_cents: 12000, prepayment_mode: "DEPOSIT", deposit_bp: 3000, forfeiture_schedule_code: "STANDARD", forfeiture_basis: "FULL_TICKET_BASIS", release_discount_bp: 1500, kitchen_prep_minutes_per_cover: 12, min_party_size: 1, max_party_size: 8 }
              as: RestaurantManager
              as_user_id: "${r_id}"
              captures: { pkg_full_id: $.data.id }
            - call: "POST /services"
              payload: { restaurant_id: "${r_id}", service_date: "2026-09-12", meal_period: "DINNER", seating_start_utc: "2026-09-12T22:00:00Z", seating_end_utc: "2026-09-13T02:00:00Z", turn_time_minutes: 150, seats_capacity: 40, demand_tier: "HIGH", unsold_release_bp: 5000, release_lead_minutes: 180, waitlist_policy: "YIELD_WEIGHTED", kitchen_prep_capacity_minutes: 600 }
              as: RestaurantManager
              as_user_id: "${r_id}"
              captures: { svc_id: $.data.id }
            - call: "POST /ticket-classes"
              payload: { service_id: "${svc_id}", package_id: "${pkg_dep_id}", seats_allocated: 20, min_party_size: 1, max_party_size: 8 }
              as: RestaurantManager
              as_user_id: "${r_id}"
              captures: { tc_dep_id: $.data.id }
            - call: "POST /ticket-classes"
              payload: { service_id: "${svc_id}", package_id: "${pkg_full_id}", seats_allocated: 20, min_party_size: 1, max_party_size: 8 }
              as: RestaurantManager
              as_user_id: "${r_id}"
              captures: { tc_full_id: $.data.id }
            - call: "POST /services/${svc_id}/publish"
              payload: {}
              as: RestaurantManager
              as_user_id: "${r_id}"
            - call: "GET /ticket-classes/${tc_dep_id}"
              payload: {}
              as: Guest
              as_user_id: "${g1_id}"
              captures: { tc_dep_v: $.data.version }
            - call: "POST /reservations"
              payload: { ticket_class_id: "${tc_dep_id}", guest_id: "${g1_id}", party_size: 2, primary_guest_name: "Guest One", expected_ticket_class_version: "${tc_dep_v}" }
              as: Guest
              as_user_id: "${g1_id}"
              captures: { res_dep_id: $.data.id }
            - call: "POST /reservations/${res_dep_id}/payments"
              payload: { amount_cents: 11583 }
              as: Guest
              as_user_id: "${g1_id}"
            - call: "POST /reservations/${res_dep_id}/confirm"
              payload: {}
              as: Guest
              as_user_id: "${g1_id}"
            - call: "GET /ticket-classes/${tc_full_id}"
              payload: {}
              as: Guest
              as_user_id: "${g2_id}"
              captures: { tc_full_v: $.data.version }
            - call: "POST /reservations"
              payload: { ticket_class_id: "${tc_full_id}", guest_id: "${g2_id}", party_size: 2, primary_guest_name: "Guest Two", expected_ticket_class_version: "${tc_full_v}" }
              as: Guest
              as_user_id: "${g2_id}"
              captures: { res_full_id: $.data.id }
            - call: "POST /reservations/${res_full_id}/payments"
              payload: { amount_cents: 11583 }
              as: Guest
              as_user_id: "${g2_id}"
            - call: "POST /reservations/${res_full_id}/confirm"
              payload: {}
              as: Guest
              as_user_id: "${g2_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T22:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /reservations/${res_dep_id}/cancel"
              payload: {}
              as: Guest
              as_user_id: "${g1_id}"
            - call: "POST /reservations/${res_full_id}/cancel"
              payload: {}
              as: Guest
              as_user_id: "${g2_id}"
          assert:
            - "Reservation.${res_dep_id}.grand_total_cents == 38610 and Reservation.${res_full_id}.grand_total_cents == 38610"
            - "Reservation.${res_dep_id}.deposit_due_cents == 11583 and Reservation.${res_full_id}.deposit_due_cents == 11583"
            - "Reservation.${res_dep_id}.forfeited_cents == 6292"
            - "Reservation.${res_dep_id}.refunded_cents == 5291"
            - "Reservation.${res_dep_id}.payment_status == PARTIALLY_REFUNDED"
            - "Reservation.${res_dep_id}.cancel_settlement_basis == DEPOSIT_BASIS"
            - "Reservation.${res_full_id}.forfeited_cents == 11583"
            - "Reservation.${res_full_id}.refunded_cents == 0"
            - "Reservation.${res_full_id}.payment_status == FORFEITED"
            - "Reservation.${res_full_id}.cancel_settlement_basis == FULL_TICKET_BASIS"
            - "Reservation.${res_dep_id}.refunded_cents != Reservation.${res_full_id}.refunded_cents"
            - "both reservations have fulfillment_status == CANCELLED"

      - name: waitlist_priority_score_fair_queue_vs_yield_weighted
        grounds:
          - calculations.waitlist_priority_score
          - entities.Service.fields.waitlist_policy
          - entities.WaitlistEntry.fields.priority_score
          - state_machines.WaitlistEntry.status.WAITING_to_OFFERED
        distinguishing_aspect: |
          The same two WAITING entries (party 2 created first with score 1100,
          party 3 created second with score 1150) competing for the same three
          freed seats promote the EARLIER entry under FAIR_QUEUE and the
          HIGHER-SCORING entry under YIELD_WEIGHTED; this instance lives in the
          WaitlistEntry ranking domain, not the money domain, and its divergence
          is an ordering outcome rather than a cent amount.
        test_recipe:
          setup:
            - "one restaurant, one 8-course package, two PUBLISHED services identical except waitlist_policy (FAIR_QUEUE vs YIELD_WEIGHTED)"
            - "each service has one 3-seat ticket class fully sold by the same holder guest's CONFIRMED party-of-3 reservation, so both classes are SOLD_OUT"
            - "the same two waiting guests join both services in the same order: guest WA with party_size 2 first, guest WB with party_size 3 second"
            - "logical clock advanced to 2026-09-10T22:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /restaurants"
              payload: { name: "Aurum Two", service_charge_bp: 725, hold_ttl_minutes: 20, offer_ttl_minutes: 15, max_offer_rounds: 2, goodwill_credit_cap_cents: 20000, prep_lead_minutes: 45, refund_scrutiny_threshold_cents: 30000 }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /guests"
              payload: { email: "holder@aurum.test", display_name: "Holder" }
              as: PlatformAdmin
              captures: { gh_id: $.data.id }
            - call: "POST /guests"
              payload: { email: "wa@aurum.test", display_name: "Waiter A" }
              as: PlatformAdmin
              captures: { wa_id: $.data.id }
            - call: "POST /guests"
              payload: { email: "wb@aurum.test", display_name: "Waiter B" }
              as: PlatformAdmin
              captures: { wb_id: $.data.id }
            - call: "POST /experience-packages"
              payload: { restaurant_id: "${r_id}", name: "Tasting Menu", course_count: 8, base_price_cents: 12000, prepayment_mode: "DEPOSIT", deposit_bp: 3000, forfeiture_schedule_code: "STANDARD", forfeiture_basis: "DEPOSIT_BASIS", release_discount_bp: 1500, kitchen_prep_minutes_per_cover: 12, min_party_size: 1, max_party_size: 8 }
              as: RestaurantManager
              as_user_id: "${r_id}"
              captures: { pkg_id: $.data.id }
            - call: "POST /services"
              payload: { restaurant_id: "${r_id}", service_date: "2026-09-12", meal_period: "DINNER", seating_start_utc: "2026-09-12T22:00:00Z", seating_end_utc: "2026-09-13T02:00:00Z", turn_time_minutes: 150, seats_capacity: 10, demand_tier: "HIGH", unsold_release_bp: 5000, release_lead_minutes: 180, waitlist_policy: "FAIR_QUEUE", kitchen_prep_capacity_minutes: 600 }
              as: RestaurantManager
              as_user_id: "${r_id}"
              captures: { svc_f_id: $.data.id }
            - call: "POST /services"
              payload: { restaurant_id: "${r_id}", service_date: "2026-09-12", meal_period: "LUNCH", seating_start_utc: "2026-09-12T22:00:00Z", seating_end_utc: "2026-09-13T02:00:00Z", turn_time_minutes: 150, seats_capacity: 10, demand_tier: "HIGH", unsold_release_bp: 5000, release_lead_minutes: 180, waitlist_policy: "YIELD_WEIGHTED", kitchen_prep_capacity_minutes: 600 }
              as: RestaurantManager
              as_user_id: "${r_id}"
              captures: { svc_y_id: $.data.id }
            - call: "POST /ticket-classes"
              payload: { service_id: "${svc_f_id}", package_id: "${pkg_id}", seats_allocated: 3, min_party_size: 1, max_party_size: 8 }
              as: RestaurantManager
              as_user_id: "${r_id}"
              captures: { tc_f_id: $.data.id }
            - call: "POST /ticket-classes"
              payload: { service_id: "${svc_y_id}", package_id: "${pkg_id}", seats_allocated: 3, min_party_size: 1, max_party_size: 8 }
              as: RestaurantManager
              as_user_id: "${r_id}"
              captures: { tc_y_id: $.data.id }
            - call: "POST /services/${svc_f_id}/publish"
              payload: {}
              as: RestaurantManager
              as_user_id: "${r_id}"
            - call: "POST /services/${svc_y_id}/publish"
              payload: {}
              as: RestaurantManager
              as_user_id: "${r_id}"
            - call: "GET /ticket-classes/${tc_f_id}"
              payload: {}
              as: Guest
              as_user_id: "${gh_id}"
              captures: { tc_f_v: $.data.version }
            - call: "POST /reservations"
              payload: { ticket_class_id: "${tc_f_id}", guest_id: "${gh_id}", party_size: 3, primary_guest_name: "Holder", expected_ticket_class_version: "${tc_f_v}" }
              as: Guest
              as_user_id: "${gh_id}"
              captures: { res_f_id: $.data.id }
            - call: "POST /reservations/${res_f_id}/payments"
              payload: { amount_cents: 17375 }
              as: Guest
              as_user_id: "${gh_id}"
            - call: "POST /reservations/${res_f_id}/confirm"
              payload: {}
              as: Guest
              as_user_id: "${gh_id}"
            - call: "GET /ticket-classes/${tc_y_id}"
              payload: {}
              as: Guest
              as_user_id: "${gh_id}"
              captures: { tc_y_v: $.data.version }
            - call: "POST /reservations"
              payload: { ticket_class_id: "${tc_y_id}", guest_id: "${gh_id}", party_size: 3, primary_guest_name: "Holder", expected_ticket_class_version: "${tc_y_v}" }
              as: Guest
              as_user_id: "${gh_id}"
              captures: { res_y_id: $.data.id }
            - call: "POST /reservations/${res_y_id}/payments"
              payload: { amount_cents: 17375 }
              as: Guest
              as_user_id: "${gh_id}"
            - call: "POST /reservations/${res_y_id}/confirm"
              payload: {}
              as: Guest
              as_user_id: "${gh_id}"
            - call: "POST /waitlist-entries"
              payload: { service_id: "${svc_f_id}", guest_id: "${wa_id}", party_size: 2 }
              as: Guest
              as_user_id: "${wa_id}"
              captures: { e_fa_id: $.data.id }
            - call: "POST /waitlist-entries"
              payload: { service_id: "${svc_y_id}", guest_id: "${wa_id}", party_size: 2 }
              as: Guest
              as_user_id: "${wa_id}"
              captures: { e_ya_id: $.data.id }
            - call: "POST /waitlist-entries"
              payload: { service_id: "${svc_f_id}", guest_id: "${wb_id}", party_size: 3 }
              as: Guest
              as_user_id: "${wb_id}"
              captures: { e_fb_id: $.data.id }
            - call: "POST /waitlist-entries"
              payload: { service_id: "${svc_y_id}", guest_id: "${wb_id}", party_size: 3 }
              as: Guest
              as_user_id: "${wb_id}"
              captures: { e_yb_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T22:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /reservations/${res_f_id}/cancel"
              payload: {}
              as: Guest
              as_user_id: "${gh_id}"
            - call: "POST /reservations/${res_y_id}/cancel"
              payload: {}
              as: Guest
              as_user_id: "${gh_id}"
          assert:
            - "WaitlistEntry.${e_fa_id}.priority_score == 1100 and WaitlistEntry.${e_ya_id}.priority_score == 1100"
            - "WaitlistEntry.${e_fb_id}.priority_score == 1150 and WaitlistEntry.${e_yb_id}.priority_score == 1150"
            - "WaitlistEntry.${e_fa_id}.status == OFFERED"
            - "WaitlistEntry.${e_fb_id}.status == WAITING"
            - "WaitlistEntry.${e_yb_id}.status == OFFERED"
            - "WaitlistEntry.${e_ya_id}.status == WAITING"
            - "TicketClass.${tc_f_id}.seats_held == 2 and TicketClass.${tc_f_id}.seats_available == 1 and TicketClass.${tc_f_id}.status == OPEN"
            - "TicketClass.${tc_y_id}.seats_held == 3 and TicketClass.${tc_y_id}.seats_available == 0 and TicketClass.${tc_y_id}.status == SOLD_OUT"
            - "the FAIR_QUEUE service promoted the lower-scoring but earlier entry while the YIELD_WEIGHTED service promoted the higher-scoring later one"

  - rule_id: combinatorial_formula
    instances:

      - name: price_quote_nested_clamp_and_scarcity_step_ladder
        grounds:
          - calculations.ticket_price_per_cover
          - entities.TicketClass.fields.list_price_per_cover_cents
          - entities.TicketClass.fields.release_price_per_cover_cents
          - entities.TicketClass.fields.sell_through_bp
          - endpoints.GET_/ticket-classes/{id}/price-quote
        distinguishing_aspect: |
          Four independent factors compose in a pinned order: day-of-week bp,
          demand-tier bp, a nested clamp whose floor is applied before the cap,
          and a scarcity step keyed on the class's own sell-through. The PEAK
          case (12500 * 14500 / 10000 = 18125 bp) proves the cap binds on the
          COMBINED basis points and not on the resulting price, since clamping
          the price instead would yield 21750 rather than 21600. Each locked
          reservation price also proves the sell-through is read BEFORE the
          write credits its own seats. This instance composes pricing factors;
          the sibling instances compose rounding sites and fee bands.
        test_recipe:
          setup:
            - "one restaurant, one 8-course package with base_price_cents 12000 and release_discount_bp 1500"
            - "service H on Saturday 2026-09-12 at demand_tier HIGH with one 20-seat ticket class TC1"
            - "service P on the same Saturday at demand_tier PEAK with one 20-seat ticket class TC2, left untouched"
            - "four distinct guests, so no guest holds two active reservations on the same service"
            - "logical clock at 2026-09-01T00:00:00Z throughout, so no hold ever lapses"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /restaurants"
              payload: { name: "Aurum Pricing", service_charge_bp: 725, hold_ttl_minutes: 20, offer_ttl_minutes: 15, max_offer_rounds: 2, goodwill_credit_cap_cents: 20000, prep_lead_minutes: 45, refund_scrutiny_threshold_cents: 30000 }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /experience-packages"
              payload: { restaurant_id: "${r_id}", name: "Tasting Menu", course_count: 8, base_price_cents: 12000, prepayment_mode: "DEPOSIT", deposit_bp: 3000, forfeiture_schedule_code: "STANDARD", forfeiture_basis: "DEPOSIT_BASIS", release_discount_bp: 1500, kitchen_prep_minutes_per_cover: 12, min_party_size: 1, max_party_size: 8 }
              as: RestaurantManager
              as_user_id: "${r_id}"
              captures: { pkg_id: $.data.id }
            - call: "POST /services"
              payload: { restaurant_id: "${r_id}", service_date: "2026-09-12", meal_period: "DINNER", seating_start_utc: "2026-09-12T22:00:00Z", seating_end_utc: "2026-09-13T02:00:00Z", turn_time_minutes: 150, seats_capacity: 20, demand_tier: "HIGH", unsold_release_bp: 5000, release_lead_minutes: 180, waitlist_policy: "YIELD_WEIGHTED", kitchen_prep_capacity_minutes: 600 }
              as: RestaurantManager
              as_user_id: "${r_id}"
              captures: { svc_h_id: $.data.id }
            - call: "POST /services"
              payload: { restaurant_id: "${r_id}", service_date: "2026-09-12", meal_period: "LUNCH", seating_start_utc: "2026-09-12T17:00:00Z", seating_end_utc: "2026-09-12T20:00:00Z", turn_time_minutes: 150, seats_capacity: 20, demand_tier: "PEAK", unsold_release_bp: 5000, release_lead_minutes: 180, waitlist_policy: "YIELD_WEIGHTED", kitchen_prep_capacity_minutes: 600 }
              as: RestaurantManager
              as_user_id: "${r_id}"
              captures: { svc_p_id: $.data.id }
            - call: "POST /ticket-classes"
              payload: { service_id: "${svc_h_id}", package_id: "${pkg_id}", seats_allocated: 20, min_party_size: 1, max_party_size: 8 }
              as: RestaurantManager
              as_user_id: "${r_id}"
              captures: { tc1_id: $.data.id }
            - call: "POST /ticket-classes"
              payload: { service_id: "${svc_p_id}", package_id: "${pkg_id}", seats_allocated: 20, min_party_size: 1, max_party_size: 8 }
              as: RestaurantManager
              as_user_id: "${r_id}"
              captures: { tc2_id: $.data.id }
            - call: "POST /services/${svc_h_id}/publish"
              payload: {}
              as: RestaurantManager
              as_user_id: "${r_id}"
            - call: "POST /services/${svc_p_id}/publish"
              payload: {}
              as: RestaurantManager
              as_user_id: "${r_id}"
            - call: "POST /guests"
              payload: { email: "p1@aurum.test", display_name: "Pricer One" }
              as: PlatformAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /guests"
              payload: { email: "p2@aurum.test", display_name: "Pricer Two" }
              as: PlatformAdmin
              captures: { p2_id: $.data.id }
            - call: "POST /guests"
              payload: { email: "p3@aurum.test", display_name: "Pricer Three" }
              as: PlatformAdmin
              captures: { p3_id: $.data.id }
            - call: "POST /guests"
              payload: { email: "p4@aurum.test", display_name: "Pricer Four" }
              as: PlatformAdmin
              captures: { p4_id: $.data.id }
            - call: "GET /ticket-classes/${tc1_id}"
              payload: {}
              as: Guest
              as_user_id: "${p1_id}"
              captures: { v1: $.data.version }
            - call: "POST /reservations"
              payload: { ticket_class_id: "${tc1_id}", guest_id: "${p1_id}", party_size: 8, primary_guest_name: "Pricer One", expected_ticket_class_version: "${v1}" }
              as: Guest
              as_user_id: "${p1_id}"
              captures: { res1_id: $.data.id }
            - call: "GET /ticket-classes/${tc1_id}"
              payload: {}
              as: Guest
              as_user_id: "${p2_id}"
              captures: { v2: $.data.version }
            - call: "POST /reservations"
              payload: { ticket_class_id: "${tc1_id}", guest_id: "${p2_id}", party_size: 7, primary_guest_name: "Pricer Two", expected_ticket_class_version: "${v2}" }
              as: Guest
              as_user_id: "${p2_id}"
              captures: { res2_id: $.data.id }
            - call: "GET /ticket-classes/${tc1_id}"
              payload: {}
              as: Guest
              as_user_id: "${p3_id}"
              captures: { v3: $.data.version }
            - call: "POST /reservations"
              payload: { ticket_class_id: "${tc1_id}", guest_id: "${p3_id}", party_size: 1, primary_guest_name: "Pricer Three", expected_ticket_class_version: "${v3}" }
              as: Guest
              as_user_id: "${p3_id}"
              captures: { res3_id: $.data.id }
            - call: "GET /ticket-classes/${tc1_id}"
              payload: {}
              as: Guest
              as_user_id: "${p4_id}"
              captures: { v4: $.data.version }
            - call: "POST /reservations"
