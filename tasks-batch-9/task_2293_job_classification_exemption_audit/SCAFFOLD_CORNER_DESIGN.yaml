              as_user_id: "pa-1"
              captures: { fam_b_id: $.data.id }
            - call: "POST /audit-projects/${proj_id}/status"
              payload: { target_status: "FIELDWORK" }
              as: ProgramAdmin
              as_user_id: "pa-1"
          trigger:
            - call: "POST /audit-projects/${proj_id}/status"
              payload: { target_status: "REMEDIATION" }
              as: ProgramAdmin
              as_user_id: "pa-1"
          assert:
            - "AuditProject.${proj_id}.status == REMEDIATION"
            - "JobFamily.${fam_a_id}.remediation_priority_rank == 1"
            - "JobFamily.${fam_b_id}.remediation_priority_rank == 2"
            - "both families still report risk_score 0, risk_tier LOW and family_headcount 0"
            - "AuditProject.${proj_id}.remediation_posture == OPEN"

