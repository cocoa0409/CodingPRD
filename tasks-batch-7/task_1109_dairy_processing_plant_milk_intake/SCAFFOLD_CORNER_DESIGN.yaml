        claim_type: precondition_enforcement
        grounds: [state_machines.ProducerSettlement.DRAFT_to_APPROVED, "errors[ERR_POOL_NOT_FINALIZED]"]

        distinguishing_aspect: "POST /approve on a DRAFT settlement with pool still ANNOUNCED returns ERR_POOL_NOT_FINALIZED."
