          Cross-entity pair Bet→(Market,Event): a Bet may only be PLACED when the
          leg's Market.status==OPEN AND its Event.status==SCHEDULED. Taking the
          Event LIVE (which suspends the market) makes the SAME placement return
          ERR_MARKET_NOT_OPEN.
