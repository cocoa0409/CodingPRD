        distinguishing_aspect: |
          Correct-result claim: execute auto-creates the obligation ladder from
          photography_end_utc 2026-12-15, in the pinned order (all PRESS_JUNKET rows
          by ascending ordinal, then REUNION_TAPING). Press ordinals space 30 days
          apart -> 2027-01-14 and 2027-02-13 at 25,000 cents each; the reunion is a
          flat +180 days -> 2027-06-13 at 150,000 cents. The reunion ordinal restarts
          at 1 because ordinals are per-kind, not per-agreement.
