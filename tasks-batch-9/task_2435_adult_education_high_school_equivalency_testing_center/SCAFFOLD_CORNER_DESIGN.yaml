          - errors[ERR_ACCOMMODATION_NOT_PENDING]
        distinguishing_aspect: |
          While the request sits in INFO_REQUESTED it is out of the decision queue: APPROVE is 409
          ERR_ACCOMMODATION_NOT_PENDING (not ERR_ACCOMMODATION_NOT_INFO_REQUESTED, which guards the
          resubmission edge instead) and granted_format stays null.
        test_recipe:
          setup:
