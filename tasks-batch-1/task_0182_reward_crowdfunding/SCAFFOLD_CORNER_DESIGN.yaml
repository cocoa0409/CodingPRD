              captures: { c_id: $.data.id }
          trigger:
            - call: "GET /campaigns?limit=500"
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_VALIDATION_PAGINATION and HTTP status == 422."

      - name: not_live_beats_below_tier_min_covered_by_difficulty
        claim_type: Priority Ordering
        grounds:
          - validations[priority=8]
          - validations[priority=9]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / not_live_temporal_beats_below_tier_min_constraint
          rationale: "Priority conflict between business_temporal and business_constraint asserted by the named §1.8 instance."

  # ===========================================================================
  - section: rbac
    instances:
      - name: backer_cannot_create_campaign_returns_role_forbidden
        claim_type: Role Restriction
        grounds:
          - validations[priority=2]
          - errors[ERR_ROLE_FORBIDDEN]
        distinguishing_aspect: "POST /campaigns as Backer (not in the endpoint's roles) -> ERR_ROLE_FORBIDDEN (403); create-campaign is Creator-exclusive."
        test_recipe:
          setup:
            - "Backer registered; no Creator context."
          setup_api_calls:
            - call: "POST /backers"
              payload: { email: "b@x.com", display_name: "B" }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /campaigns"
              payload: { creator_id: "${b_id}", title: "Camp", funding_goal_cents: 1000, funding_model: "FLEXIBLE", deadline_utc: "2026-07-01T00:00:00.000Z" }
              as: Backer
              as_user_id: "${b_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_ROLE_FORBIDDEN and HTTP status == 403."

      - name: creator_cannot_create_pledge_returns_role_forbidden
        claim_type: Role Restriction
        grounds:
          - errors[ERR_ROLE_FORBIDDEN]
        distinguishing_aspect: "POST /campaigns/{id}/pledges as Creator (pledge create is Backer-exclusive) -> ERR_ROLE_FORBIDDEN (403)."
        test_recipe:
          setup:
            - "LIVE campaign owned by Creator C."
          setup_api_calls:
            - call: "POST /creators"
              payload: { display_name: "C", payout_currency: "USD" }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { creator_id: "${c_id}", title: "Camp", funding_goal_cents: 1000, funding_model: "FLEXIBLE", deadline_utc: "2026-07-01T00:00:00.000Z" }
              as: Creator
              as_user_id: "${c_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/tiers"
              payload: { title: "T", price_cents: 5000, weight_grams: 800 }
              as: Creator
              as_user_id: "${c_id}"
              captures: { tier_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/launch"
              payload: {}
              as: Creator
              as_user_id: "${c_id}"
              captures: { camp_v1: $.data.version }
          trigger:
            - call: "POST /campaigns/${camp_id}/pledges"
              payload: { backer_id: "${c_id}", tier_id: "${tier_id}", pledge_amount_cents: 5000, destination_zone: "DOMESTIC", expected_campaign_version: "${camp_v1}" }
              as: Creator
              as_user_id: "${c_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_ROLE_FORBIDDEN and HTTP status == 403."

      - name: non_owner_creator_cannot_launch_returns_not_owner
        claim_type: Ownership Enforcement
        grounds:
          - validations[priority=6]
          - errors[ERR_NOT_OWNER]
        distinguishing_aspect: "Creator C2 calling launch on C1's campaign (correct role, wrong owner) -> ERR_NOT_OWNER (403); peer_roles ownership is X-User-ID == campaign.creator_id."
        test_recipe:
          setup:
            - "C1 owns a DRAFT campaign with a tier; a second creator C2 exists."
          setup_api_calls:
            - call: "POST /creators"
              payload: { display_name: "C1", payout_currency: "USD" }
              as: PlatformAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /creators"
              payload: { display_name: "C2", payout_currency: "USD" }
              as: PlatformAdmin
              captures: { c2_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { creator_id: "${c1_id}", title: "Camp", funding_goal_cents: 1000, funding_model: "FLEXIBLE", deadline_utc: "2026-07-01T00:00:00.000Z" }
              as: Creator
              as_user_id: "${c1_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/tiers"
              payload: { title: "T", price_cents: 5000, weight_grams: 800 }
              as: Creator
              as_user_id: "${c1_id}"
              captures: { tier_id: $.data.id }
          trigger:
            - call: "POST /campaigns/${camp_id}/launch"
              payload: {}
              as: Creator
              as_user_id: "${c2_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_NOT_OWNER and HTTP status == 403 (C2 does not own C1's campaign)."

