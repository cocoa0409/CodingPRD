            - call: "POST /inns/${inn_id}/bookings"
              payload: { inn_id: "${inn_id}", room_id: "${room_id}", guest_id: "${guest_id}", channel: "DIRECT", checkin_date: "2026-10-10", checkout_date: "2026-10-14", guest_count: 1 }
              as: Innkeeper
              captures: { bk1: $.data.id }
            - call: "POST /inns/${inn_id}/gift-certificates"
              payload: { inn_id: "${inn_id}", face_value_cents: 50000 }
              as: FinanceManager
              captures: { gc1: $.data.id, gc1_v: $.data.version }
            - call: "POST /inns/${inn_id}/bookings/${bk1}/redeem-gift"
              payload: { gift_certificate_id: "${gc1}", amount_cents: 10000, expected_gift_certificate_version: "${gc1_v}" }
              as: Innkeeper
            - call: "GET /inns/${inn_id}/rooms/${room_id}"
              as: Innkeeper
              captures: { room_v1: $.data.version }
            - call: "POST /inns/${inn_id}/bookings/${bk1}/confirm"
              payload: { expected_room_version: "${room_v1}" }
              as: Innkeeper
            # booking 2 overlaps 10-12..10-13 strictly inside bk1
            - call: "POST /inns/${inn_id}/bookings"
              payload: { inn_id: "${inn_id}", room_id: "${room_id}", guest_id: "${guest_id}", channel: "DIRECT", checkin_date: "2026-10-12", checkout_date: "2026-10-13", guest_count: 1 }
              as: Innkeeper
              captures: { bk2: $.data.id }
            - call: "POST /inns/${inn_id}/gift-certificates"
              payload: { inn_id: "${inn_id}", face_value_cents: 50000 }
              as: FinanceManager
              captures: { gc2: $.data.id, gc2_v: $.data.version }
            - call: "POST /inns/${inn_id}/bookings/${bk2}/redeem-gift"
              payload: { gift_certificate_id: "${gc2}", amount_cents: 10000, expected_gift_certificate_version: "${gc2_v}" }
              as: Innkeeper
            - call: "GET /inns/${inn_id}/rooms/${room_id}"
              as: Innkeeper
              captures: { room_v2: $.data.version }
          trigger:
            - call: "POST /inns/${inn_id}/bookings/${bk2}/confirm"
              payload: { expected_room_version: "${room_v2}" }
              as: Innkeeper
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ROOM_DOUBLE_BOOKED"
            - "Booking.${bk2}.reservation_status == PENDING"

      - name: room_turnover_buffer_instant_gap_blocks_checkin
        grounds:
          - validations[priority=72]
          - errors[ERR_TURNOVER_NOT_READY]
          - entities.HousekeepingTask.fields.ready_after
          - state_machines.Booking.CONFIRMED_to_CHECKED_IN
        distinguishing_aspect: |
          Turnover overlap on a Room: a check-in attempted before the room's HousekeepingTask
          ready_after (checkout instant + turnover_minutes) is rejected (ERR_TURNOVER_NOT_READY).
          Interval semantics: instant-level buffer gap, NOT the date-level half-open rule above.
        test_recipe:
          setup:
            - "Inn turnover_minutes 180; one Room; booking 1 checked out at 2026-11-12T11:00Z (ready_after 14:00Z); booking 2 back-to-back same-day starts 2026-11-12, confirmed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: Innkeeper
            - call: "POST /inns"
              payload: { name: "Knoll Inn", lodging_tax_rate_bps: 0, turnover_minutes: 180 }
              as: Innkeeper
              captures: { inn_id: $.data.id }
            - call: "POST /inns/${inn_id}/rooms"
              payload: { inn_id: "${inn_id}", name: "Birch", base_rate_cents: 10000, max_occupancy: 2 }
              as: Innkeeper
              captures: { room_id: $.data.id }
            - call: "POST /inns/${inn_id}/guests"
              payload: { inn_id: "${inn_id}", full_name: "Pa G", email: "pa@x.com" }
              as: Innkeeper
              captures: { guest_id: $.data.id }
            # booking 1: 11-10..11-12
            - call: "POST /inns/${inn_id}/bookings"
              payload: { inn_id: "${inn_id}", room_id: "${room_id}", guest_id: "${guest_id}", channel: "DIRECT", checkin_date: "2026-11-10", checkout_date: "2026-11-12", guest_count: 1 }
              as: Innkeeper
              captures: { bk1: $.data.id }
            - call: "POST /inns/${inn_id}/gift-certificates"
              payload: { inn_id: "${inn_id}", face_value_cents: 50000 }
              as: FinanceManager
              captures: { gc1: $.data.id, gc1_v: $.data.version }
            - call: "POST /inns/${inn_id}/bookings/${bk1}/redeem-gift"
              payload: { gift_certificate_id: "${gc1}", amount_cents: 10000, expected_gift_certificate_version: "${gc1_v}" }
              as: Innkeeper
            - call: "GET /inns/${inn_id}/rooms/${room_id}"
              as: Innkeeper
              captures: { room_v1: $.data.version }
            - call: "POST /inns/${inn_id}/bookings/${bk1}/confirm"
              payload: { expected_room_version: "${room_v1}" }
              as: Innkeeper
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-10T16:00:00Z" }
              as: Innkeeper
            - call: "POST /inns/${inn_id}/bookings/${bk1}/check-in"
              payload: {}
              as: Innkeeper
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-12T11:00:00Z" }
              as: Innkeeper
            - call: "POST /inns/${inn_id}/bookings/${bk1}/check-out"
              payload: {}
              as: Innkeeper
            # booking 2 starts 11-12 (zero-gap date overlap is allowed), confirm it
            - call: "POST /inns/${inn_id}/bookings"
              payload: { inn_id: "${inn_id}", room_id: "${room_id}", guest_id: "${guest_id}", channel: "DIRECT", checkin_date: "2026-11-12", checkout_date: "2026-11-14", guest_count: 1 }
              as: Innkeeper
              captures: { bk2: $.data.id }
            - call: "POST /inns/${inn_id}/gift-certificates"
              payload: { inn_id: "${inn_id}", face_value_cents: 50000 }
              as: FinanceManager
              captures: { gc2: $.data.id, gc2_v: $.data.version }
            - call: "POST /inns/${inn_id}/bookings/${bk2}/redeem-gift"
              payload: { gift_certificate_id: "${gc2}", amount_cents: 10000, expected_gift_certificate_version: "${gc2_v}" }
              as: Innkeeper
            - call: "GET /inns/${inn_id}/rooms/${room_id}"
              as: Innkeeper
              captures: { room_v2: $.data.version }
            - call: "POST /inns/${inn_id}/bookings/${bk2}/confirm"
              payload: { expected_room_version: "${room_v2}" }
              as: Innkeeper
          trigger:
            # clock 12:00Z is before ready_after 14:00Z -> turnover not ready
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-12T12:00:00Z" }
              as: Innkeeper
            - call: "POST /inns/${inn_id}/bookings/${bk2}/check-in"
              payload: {}
              as: Innkeeper
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_TURNOVER_NOT_READY"
            - "Booking.${bk2}.reservation_status == CONFIRMED"   # still confirmed, not checked in

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: gift_value_conserved_across_redeem_and_cancel_restore
        grounds:
          - calculations.gift_restore_on_cancel
          - calculations.cancellation_refund
          - entities.GiftCertificate.fields.remaining_cents
          - entities.GiftCertificate.fields.face_value_cents
        distinguishing_aspect: |
          Conserved quantity = gift money. After redeem (debit) followed by a full-refund cancel
          (restore), the invariant GiftCertificate.remaining_cents + (forfeited gift) ==
          face_value_cents holds; with full refund remaining_cents returns to face_value exactly.
        test_recipe:
          setup:
            - "Inn tax 0; Room base 10000; gift face 10000 redeemed 10000 against confirmed DIRECT booking; cancel 20 days before -> full refund."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: Innkeeper
            - call: "POST /inns"
              payload: { name: "Loch Inn", lodging_tax_rate_bps: 0 }
              as: Innkeeper
              captures: { inn_id: $.data.id }
            - call: "POST /inns/${inn_id}/rooms"
              payload: { inn_id: "${inn_id}", name: "Quill", base_rate_cents: 10000, max_occupancy: 2 }
              as: Innkeeper
              captures: { room_id: $.data.id }
            - call: "POST /inns/${inn_id}/guests"
              payload: { inn_id: "${inn_id}", full_name: "Ra G", email: "ra@x.com" }
              as: Innkeeper
              captures: { guest_id: $.data.id }
            - call: "POST /inns/${inn_id}/bookings"
              payload: { inn_id: "${inn_id}", room_id: "${room_id}", guest_id: "${guest_id}", channel: "DIRECT", checkin_date: "2026-03-15", checkout_date: "2026-03-17", guest_count: 1 }
              as: Innkeeper
              captures: { bk_id: $.data.id }
            - call: "POST /inns/${inn_id}/gift-certificates"
              payload: { inn_id: "${inn_id}", face_value_cents: 10000 }
              as: FinanceManager
              captures: { gc_id: $.data.id, gc_v: $.data.version }
            - call: "POST /inns/${inn_id}/bookings/${bk_id}/redeem-gift"
              payload: { gift_certificate_id: "${gc_id}", amount_cents: 10000, expected_gift_certificate_version: "${gc_v}" }
              as: Innkeeper
            - call: "GET /inns/${inn_id}/gift-certificates/${gc_id}"
              as: FinanceManager
              captures: { gc_remaining_redeemed: $.data.remaining_cents }
            - call: "GET /inns/${inn_id}/rooms/${room_id}"
              as: Innkeeper
              captures: { room_v: $.data.version }
            - call: "POST /inns/${inn_id}/bookings/${bk_id}/confirm"
              payload: { expected_room_version: "${room_v}" }
              as: Innkeeper
          trigger:
            - call: "POST /inns/${inn_id}/bookings/${bk_id}/cancel"
              payload: {}
              as: Innkeeper
            - call: "GET /inns/${inn_id}/gift-certificates/${gc_id}"
              as: FinanceManager
              captures: { gc_remaining_final: $.data.remaining_cents, gc_face: $.data.face_value_cents }
          assert:
            - "after redeem GiftCertificate.${gc_id}.remaining_cents == 0"
            - "GiftCertificate.${gc_id}.remaining_cents == 10000"
            - "GiftCertificate.${gc_id}.remaining_cents == GiftCertificate.${gc_id}.face_value_cents"  # conserved

      - name: room_night_occupancy_conserved_across_confirm_and_cancel
        grounds:
          - state_machines.Booking.PENDING_to_CONFIRMED
          - state_machines.Booking.CONFIRMED_to_CANCELLED
          - validations[priority=70]
          - errors[ERR_ROOM_DOUBLE_BOOKED]
        distinguishing_aspect: |
          Conserved quantity = room-night occupancy. Confirm commits a night interval; cancel
          releases it. After confirm+cancel the room holds zero committed intervals, so a second
          booking on the same nights confirms successfully — net occupancy unchanged (no leak).
        test_recipe:
          setup:
            - "Inn tax 0; one Room; booking 1 confirmed 2026-12-10..2026-12-12 then cancelled."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: Innkeeper
            - call: "POST /inns"
              payload: { name: "Frost Inn", lodging_tax_rate_bps: 0 }
              as: Innkeeper
              captures: { inn_id: $.data.id }
            - call: "POST /inns/${inn_id}/rooms"
              payload: { inn_id: "${inn_id}", name: "Snow", base_rate_cents: 10000, max_occupancy: 2 }
              as: Innkeeper
              captures: { room_id: $.data.id }
            - call: "POST /inns/${inn_id}/guests"
              payload: { inn_id: "${inn_id}", full_name: "Sa G", email: "sa@x.com" }
              as: Innkeeper
              captures: { guest_id: $.data.id }
            - call: "POST /inns/${inn_id}/bookings"
              payload: { inn_id: "${inn_id}", room_id: "${room_id}", guest_id: "${guest_id}", channel: "DIRECT", checkin_date: "2026-12-10", checkout_date: "2026-12-12", guest_count: 1 }
              as: Innkeeper
              captures: { bk1: $.data.id }
            - call: "POST /inns/${inn_id}/gift-certificates"
              payload: { inn_id: "${inn_id}", face_value_cents: 10000 }
              as: FinanceManager
              captures: { gc1: $.data.id, gc1_v: $.data.version }
            - call: "POST /inns/${inn_id}/bookings/${bk1}/redeem-gift"
              payload: { gift_certificate_id: "${gc1}", amount_cents: 10000, expected_gift_certificate_version: "${gc1_v}" }
              as: Innkeeper
            - call: "GET /inns/${inn_id}/rooms/${room_id}"
              as: Innkeeper
              captures: { room_v1: $.data.version }
            - call: "POST /inns/${inn_id}/bookings/${bk1}/confirm"
              payload: { expected_room_version: "${room_v1}" }
              as: Innkeeper
            - call: "POST /inns/${inn_id}/bookings/${bk1}/cancel"
              payload: {}
              as: Innkeeper
            # booking 2: same nights as the released interval
            - call: "POST /inns/${inn_id}/bookings"
              payload: { inn_id: "${inn_id}", room_id: "${room_id}", guest_id: "${guest_id}", channel: "DIRECT", checkin_date: "2026-12-10", checkout_date: "2026-12-12", guest_count: 1 }
              as: Innkeeper
              captures: { bk2: $.data.id }
            - call: "POST /inns/${inn_id}/gift-certificates"
              payload: { inn_id: "${inn_id}", face_value_cents: 10000 }
              as: FinanceManager
              captures: { gc2: $.data.id, gc2_v: $.data.version }
            - call: "POST /inns/${inn_id}/bookings/${bk2}/redeem-gift"
              payload: { gift_certificate_id: "${gc2}", amount_cents: 10000, expected_gift_certificate_version: "${gc2_v}" }
              as: Innkeeper
            - call: "GET /inns/${inn_id}/rooms/${room_id}"
              as: Innkeeper
              captures: { room_v2: $.data.version }
          trigger:
            - call: "POST /inns/${inn_id}/bookings/${bk2}/confirm"
              payload: { expected_room_version: "${room_v2}" }
              as: Innkeeper
              captures: { res2: $.data.reservation_status }
          assert:
            - "Booking.${bk1}.reservation_status == CANCELLED"
            - "Booking.${bk2}.reservation_status == CONFIRMED"   # released interval re-bookable, no leak
