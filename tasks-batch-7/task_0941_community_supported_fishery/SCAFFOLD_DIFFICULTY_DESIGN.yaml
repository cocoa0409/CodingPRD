  - rule_id: priority_pair_validation_conflict
    instances:
      - name: season_state_outranks_quota_fiscal_on_landing
        grounds:
          - validations[priority=25]
          - validations[priority=36]
          - errors[ERR_SEASON_NOT_OPEN]
          - errors[ERR_QUOTA_EXCEEDED]
        distinguishing_aspect: |
          The pair is category state (priority 25, ERR_SEASON_NOT_OPEN) against category
          business_fiscal (priority 36, ERR_QUOTA_EXCEEDED). A landing filed after
          close-landings against an already EXHAUSTED ledger violates both rungs, and the
          state rung wins with 409 ERR_SEASON_NOT_OPEN.
        test_recipe:
          setup:
            - "a season opened with one share plan and then moved to LANDINGS_CLOSED"
            - "a vessel whose COD entitlement is only 5.00 lb and has already been fully consumed, leaving the ledger EXHAUSTED"
            - "a second trip planned while the season was still OPEN"
          setup_api_calls:
            - call: "POST /csf/seasons"
              payload: { season_code: "CSF-2026", start_date: "2026-05-04T00:00:00Z", end_date: "2026-09-21T00:00:00Z", total_weeks: 20, ambient_band: "HOT", offered_species: ["COD"], landing_commit_lead_hours: 72 }
              as: CsfAdmin
              captures: { season_id: $.data.id }
            - call: "POST /csf/share-plans"
              payload: { season_id: "${season_id}", plan_code: "MED-PREM-W", share_size: "MEDIUM", delivery_frequency: "WEEKLY", species_tier: "PREMIUM_FINFISH" }
              as: CsfAdmin
            - call: "POST /csf/seasons/${season_id}/open"
              payload: {}
              as: CsfAdmin
            - call: "POST /csf/vessels"
              payload: { vessel_name: "Northeaster", permit_number: "P-100", home_port: "Portland", gear_types: ["HOOK_AND_LINE"] }
              as: CsfAdmin
              captures: { vessel_id: $.data.id }
            - call: "POST /csf/quota-ledgers"
              payload: { vessel_id: "${vessel_id}", season_id: "${season_id}", species: "COD", management_area: "GOM-2", entitlement_pounds: 5.00, species_open_date: "2026-05-01T00:00:00Z", species_close_date: "2026-09-30T00:00:00Z", permitted_gears: ["HOOK_AND_LINE"], area_sensitivity_penalty: 0, species_stock_adjustment: 0 }
              as: CsfAdmin
              captures: { ledger_id: $.data.id }
            - call: "POST /csf/trips"
              payload: { vessel_id: "${vessel_id}", season_id: "${season_id}", quota_ledger_id: "${ledger_id}", gear_type: "HOOK_AND_LINE", management_area: "GOM-2" }
              as: CsfAdmin
              captures: { trip1_id: $.data.id }
            - call: "POST /csf/trips/${trip1_id}/land"
              payload: { species: "COD", landed_pounds_gross: 5.00, ex_vessel_price_cents_per_lb: 850, offload_minutes: 12 }
              as: Vendor
              as_user_id: "${vessel_id}"
            - call: "POST /csf/trips"
              payload: { vessel_id: "${vessel_id}", season_id: "${season_id}", quota_ledger_id: "${ledger_id}", gear_type: "HOOK_AND_LINE", management_area: "GOM-2" }
              as: CsfAdmin
              captures: { trip2_id: $.data.id }
            - call: "POST /csf/seasons/${season_id}/close-landings"
              payload: {}
              as: CsfAdmin
          trigger:
            - call: "POST /csf/trips/${trip2_id}/land"
              payload: { species: "COD", landed_pounds_gross: 1.00, ex_vessel_price_cents_per_lb: 850, offload_minutes: 12 }
              as: Vendor
              as_user_id: "${vessel_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409"
            - "${err_id} == ERR_SEASON_NOT_OPEN"
            - "${err_id} != ERR_QUOTA_EXCEEDED"
            - "QuotaLedger.${ledger_id}.status == EXHAUSTED"
            - "QuotaLedger.${ledger_id}.committed_pounds == 5.00"
            - "Trip.${trip2_id}.status == PLANNED"

      - name: quality_hold_safety_outranks_grace_temporal_on_pickup
        grounds:
          - validations[priority=41]
          - validations[priority=46]
          - errors[ERR_LOT_ON_QUALITY_HOLD]
          - errors[ERR_WINDOW_GRACE_EXPIRED]
        distinguishing_aspect: |
          A different error-category pair: business_safety (priority 41,
          ERR_LOT_ON_QUALITY_HOLD) against business_temporal (priority 46,
          ERR_WINDOW_GRACE_EXPIRED). A pickup attempted after the grace instant on a box whose
          lot is on quality HOLD violates both rungs, and the safety rung wins.
        test_recipe:
          setup:
            - "an OPEN season, plan, hub, fully paid ACTIVE HUB_PICKUP member joining at week 1"
