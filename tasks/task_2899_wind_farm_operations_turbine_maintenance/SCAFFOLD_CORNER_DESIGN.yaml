        distinguishing_aspect: |
          Three successive syncs must ACCUMULATE rather than overwrite, and the response body of the
          third must already carry the recomputed service verdict: 4200 operating hours against a 4000
          hour interval flips service_due_flag true while service_interval_breached stays false,
