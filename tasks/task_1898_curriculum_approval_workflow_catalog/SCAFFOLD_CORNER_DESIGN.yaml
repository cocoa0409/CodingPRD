            - { call: "POST /curriculum/proposals/${prop}/decisions", payload: { action: "APPROVE" }, as: FacultySenate, as_user_id: "sen-1" }
          trigger:
            - { call: "POST /curriculum/proposals/${prop}/decisions", payload: { action: "APPROVE", effective_term_id: "${t1}" }, as: Registrar, as_user_id: "fac-001", captures: { err: $.data.error_id } }
