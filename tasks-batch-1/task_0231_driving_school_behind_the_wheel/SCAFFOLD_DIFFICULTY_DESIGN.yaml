        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Pair {state (pri 5) vs business_safety (pri 7)}: refunding a DRAFT (never
          activated) enrollment for a minor without GRANTED consent fails ERR_INVALID_STATE
          (state, pri 5), NOT ERR_GUARDIAN_CONSENT_REQUIRED — state precedes business_safety.
        test_recipe:
          setup:
            - "Minor student, NO guardian consent granted, enrollment still DRAFT (never activated)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: SchoolAdmin
