      - name: hold_on_a_sector_whose_tower_lost_its_accepted_backhaul_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=16]
          - errors.ERR_SECTOR_FROZEN
          - calculations.sector_capacity_posture
          - entities.Tower.fields.backhaul_accepted_mbps
        distinguishing_aspect: |
          FROZEN is reachable with an entirely empty sector: with the only circuit degraded,
          Tower.backhaul_accepted_mbps falls to 0 and the posture branch that tests transport - not the
          air ratio - fires, so a hold is refused with ERR_SECTOR_FROZEN while
          oversubscription_ratio is still 0.000. The request itself is untouched because it never had a
          hold to lose.
        test_recipe:
          setup:
            - "ACTIVE Tower / ACTIVE Sector / STD50 with SR_OK QUALIFIED and deliberately no CapacityHold."
            - "The tower's only BackhaulCircuit is moved ACCEPTED -> DEGRADED, so backhaul_accepted_mbps becomes 0 and the sector's posture becomes FROZEN."
