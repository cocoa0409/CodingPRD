  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: not_verified_in_neighborhood_beats_emergency_lockdown_on_marketplace_create
        grounds:
          - validations[priority=100]
          - validations[priority=110]
          - errors[ERR_NOT_VERIFIED_IN_NEIGHBORHOOD]
          - errors[ERR_NEIGHBORHOOD_EMERGENCY_LOCKDOWN]
        distinguishing_aspect: |
          Pair 1 (business_referential vs business_safety):
          ERR_NOT_VERIFIED_IN_NEIGHBORHOOD (priority 100) MUST fire before
          ERR_NEIGHBORHOOD_EMERGENCY_LOCKDOWN (priority 110). The single
          request violates both — an unverified Resident in an EMERGENCY
          neighborhood attempting POST /marketplace-listings — the returned
          error_id is ERR_NOT_VERIFIED_IN_NEIGHBORHOOD, not the lockdown
          error.
        test_recipe:
          setup:
            - "Neighborhood N1 with safety_posture=EMERGENCY (3 unresolved CRITICAL Incidents)."
            - "Resident R6 exists with verification_status=PENDING (no VERIFIED ResidentMembership in N1)."
          setup_api_calls:
            - call: "POST /neighborhood/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /neighborhood/neighborhoods"
              payload: { name: "N1", state_code: "CA", center_lat: 37.75, center_lng: -122.42, radius_meters: 2000 }
              as: PlatformAdmin
              captures: { n1_id: "$.data.id" }
            - call: "POST /neighborhood/residents"
              payload: { email: "mod@x.com", display_name: "Mod", home_address_line: "1 A St", home_lat: 37.75, home_lng: -122.42, primary_neighborhood_id: "${n1_id}" }
              as: PlatformAdmin
              captures: { mod_id: "$.data.id" }
            - call: "POST /neighborhood/residents/${mod_id}/promote-moderator"
              payload: {}
              as: PlatformAdmin
            - call: "POST /neighborhood/residents"
              payload: { email: "r2@x.com", display_name: "R2", home_address_line: "2 A St", home_lat: 37.75, home_lng: -122.42, primary_neighborhood_id: "${n1_id}" }
              as: PlatformAdmin
              captures: { r2_id: "$.data.id" }
            - call: "GET /neighborhood/verification-requests"
              payload: { resident_id: "${r2_id}" }
              as: PlatformAdmin
              captures: { vr_r2_id: "$.data[0].id" }
            - call: "POST /neighborhood/verification-requests/${vr_r2_id}/claim"
              payload: {}
              as: Moderator
              as_user_id: "${mod_id}"
            - call: "POST /neighborhood/verification-requests/${vr_r2_id}/approve"
              payload: {}
              as: Moderator
              as_user_id: "${mod_id}"
            - call: "POST /neighborhood/incidents"
              payload: { reporter_resident_id: "${r2_id}", neighborhood_id: "${n1_id}", incident_lat: 37.75, incident_lng: -122.42, severity: "CRITICAL", category: "PROPERTY_CRIME", description: "1", occurred_at: "2026-06-01T00:00:00Z" }
              as: Resident
              as_user_id: "${r2_id}"
            - call: "POST /neighborhood/incidents"
              payload: { reporter_resident_id: "${r2_id}", neighborhood_id: "${n1_id}", incident_lat: 37.75, incident_lng: -122.42, severity: "CRITICAL", category: "TRAFFIC_HAZARD", description: "2", occurred_at: "2026-06-01T00:00:00Z" }
              as: Resident
              as_user_id: "${r2_id}"
            - call: "POST /neighborhood/incidents"
              payload: { reporter_resident_id: "${r2_id}", neighborhood_id: "${n1_id}", incident_lat: 37.75, incident_lng: -122.42, severity: "CRITICAL", category: "ENVIRONMENTAL", description: "3", occurred_at: "2026-06-01T00:00:00Z" }
              as: Resident
              as_user_id: "${r2_id}"
            - call: "POST /neighborhood/residents"
              payload: { email: "r6@x.com", display_name: "R6", home_address_line: "6 A St", home_lat: 37.75, home_lng: -122.42, primary_neighborhood_id: "${n1_id}" }
              as: PlatformAdmin
