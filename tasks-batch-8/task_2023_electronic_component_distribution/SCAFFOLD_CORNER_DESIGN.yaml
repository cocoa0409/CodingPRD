# =============================================================================
# Task 2023 — §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Enumerative breadth coverage of every §1.1–§1.7 claim not already covered by
# §1.8 (SCAFFOLD_DIFFICULTY_DESIGN.yaml). Sections follow the claim-extraction
# guide. Server clock default 2026-08-01T00:00:00Z unless a recipe sets it.
# =============================================================================
scaffold_corner_design:

  # ============================================================ entities
  - section: entities
    instances:
      - name: manufacturer_line_create_defaults_applied
        claim_type: defaults
        grounds: [entities.ManufacturerLine.fields.ncnr, entities.ManufacturerLine.fields.cancel_window_days, entities.ManufacturerLine.fields.reschedule_window_days, entities.ManufacturerLine.fields.allocation_policy, entities.ManufacturerLine.fields.open_debit_balance_cents]
        distinguishing_aspect: "Omitting optional fields applies documented defaults; the computed debit balance initializes to 0."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /manufacturer-lines"
              payload: { line_code: "LIN-DEF", name: "Default Line", sourcing_channel: "FRANCHISED" }
              as: DistributorAdmin
              captures: { line_def: $.data.id }
          trigger:
            - call: "GET /manufacturer-lines/${line_def}"
              as: DistributorAdmin
          assert:
            - "ManufacturerLine.${line_def}.ncnr == false"
            - "ManufacturerLine.${line_def}.cancel_window_days == 30 and .reschedule_window_days == 20"
            - "ManufacturerLine.${line_def}.allocation_policy == BACKLOG_BASIS"
            - "ManufacturerLine.${line_def}.open_debit_balance_cents == 0"
            - "ManufacturerLine.${line_def}.version == 1"

      - name: part_create_missing_required_msl_level
        claim_type: required_fields
        grounds: [entities.Part.fields.msl_level, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "A required input field (msl_level) is absent; the create fails with 400 ERR_INVALID_REQUEST and nothing is persisted."
        test_recipe:
          setup: ["One manufacturer line exists"]
          setup_api_calls:
            - call: "POST /manufacturer-lines"
              payload: { line_code: "LIN-RQ", name: "Required Line", sourcing_channel: "FRANCHISED" }
              as: DistributorAdmin
              captures: { line_rq: $.data.id }
          trigger:
            - call: "POST /parts"
              payload: { manufacturer_line_id: "${line_rq}", part_number: "PRQ-1", floor_life_hours: 100, date_code_limit_months: 24, standard_cost_cents: 1000, book_price_cents: 1500 }
              as: DistributorAdmin
              captures: { err_rq: $.data.error_id }
          assert:
            - "${err_rq} == ERR_INVALID_REQUEST (http 400)"
            - "GET /parts?manufacturer_line_id=${line_rq} returns total_count == 0"

      - name: part_computed_qty_on_hand_input_ignored
        claim_type: computed_fields
        grounds: [entities.Part.fields.qty_on_hand, calculations.part_availability]
        distinguishing_aspect: "qty_on_hand is computed from lot state; a client-supplied value in the create payload is ignored."
        test_recipe:
          setup: ["One manufacturer line exists"]
          setup_api_calls:
            - call: "POST /manufacturer-lines"
              payload: { line_code: "LIN-CI", name: "Computed Line", sourcing_channel: "FRANCHISED" }
              as: DistributorAdmin
              captures: { line_ci: $.data.id }
          trigger:
            - call: "POST /parts"
              payload: { manufacturer_line_id: "${line_ci}", part_number: "PCI-1", msl_level: 3, floor_life_hours: 100, date_code_limit_months: 24, standard_cost_cents: 1000, book_price_cents: 1500, qty_on_hand: 999 }
              as: DistributorAdmin
              captures: { part_ci: $.data.id }
          assert:
            - "Part.${part_ci}.qty_on_hand == 0 (client-supplied 999 ignored; no AVAILABLE lots exist)"

      - name: order_get_nonexistent_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_ORDER_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "GET with a well-formed but unknown UUID returns 404 ERR_ORDER_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /orders/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: DistributorAdmin
              captures: { err_nf: $.data.error_id }
          assert:
            - "${err_nf} == ERR_ORDER_NOT_FOUND (http 404)"

      - name: lot_create_with_unknown_part_fk_rejected
        claim_type: parent_relationships
        grounds: [entities.InventoryLot.fields.part_id, "errors[ERR_PART_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "A body FK (part_id) referencing a nonexistent part is rejected with 404 before any lot is persisted."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /lots"
              payload: { part_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", date_code: "202601", qty_received: 10, source_type: "FRANCHISED" }
              as: WarehouseOps
              captures: { err_fk: $.data.error_id }
          assert:
            - "${err_fk} == ERR_PART_NOT_FOUND (http 404)"

      - name: lot_initial_state_by_source_type
        claim_type: initial_state
        grounds: [state_machines.InventoryLot, entities.InventoryLot.fields.authenticity, entities.InventoryLot.fields.status]
        distinguishing_aspect: "FRANCHISED lots start AVAILABLE with authenticity NOT_REQUIRED; OPEN_MARKET lots start IN_INSPECTION with authenticity PENDING_INSPECTION (auto-advance at creation)."
        test_recipe:
          setup: ["One franchised line and part exist"]
          setup_api_calls:
            - call: "POST /manufacturer-lines"
              payload: { line_code: "LIN-IS", name: "Init Line", sourcing_channel: "FRANCHISED" }
              as: DistributorAdmin
              captures: { line_is: $.data.id }
            - call: "POST /parts"
              payload: { manufacturer_line_id: "${line_is}", part_number: "PIS-1", msl_level: 3, floor_life_hours: 100, date_code_limit_months: 24, standard_cost_cents: 1000, book_price_cents: 1500 }
              as: DistributorAdmin
              captures: { part_is: $.data.id }
          trigger:
            - call: "POST /lots"
              payload: { part_id: "${part_is}", date_code: "202601", qty_received: 10, source_type: "FRANCHISED" }
              as: WarehouseOps
              as_user_id: "wh-01"
              captures: { lot_fr: $.data.id }
            - call: "POST /lots"
              payload: { part_id: "${part_is}", date_code: "202602", qty_received: 20, source_type: "OPEN_MARKET" }
              as: WarehouseOps
              as_user_id: "wh-01"
              captures: { lot_om: $.data.id }
          assert:
            - "InventoryLot.${lot_fr}.status == AVAILABLE and .authenticity == NOT_REQUIRED and .qty_on_hand == 10"
            - "InventoryLot.${lot_om}.status == IN_INSPECTION and .authenticity == PENDING_INSPECTION and .qty_on_hand == 20"
            - "Part.${part_is}.qty_on_hand == 10 (only the AVAILABLE franchised lot counts)"

      - name: order_lines_created_inline_start_open
        claim_type: creation
        grounds: [entities.OrderLine.fields.order_id, entities.OrderLine.fields.status, state_machines.OrderLine]
        distinguishing_aspect: "Lines are created inline with the order, carry the FK back to it, start OPEN, and are discoverable via the filtered list."
        test_recipe:
          setup: ["Line, part, customer exist"]
          setup_api_calls:
            - call: "POST /manufacturer-lines"
              payload: { line_code: "LIN-OL", name: "OrderLine Line", sourcing_channel: "FRANCHISED" }
              as: DistributorAdmin
              captures: { line_ol: $.data.id }
            - call: "POST /parts"
              payload: { manufacturer_line_id: "${line_ol}", part_number: "POL-1", msl_level: 3, floor_life_hours: 100, date_code_limit_months: 24, standard_cost_cents: 1000, book_price_cents: 1500 }
              as: DistributorAdmin
              captures: { part_ol: $.data.id }
            - call: "POST /customers"
              payload: { name: "Cust OL", credit_limit_cents: 100000000 }
              as: DistributorAdmin
              captures: { cust_ol: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${cust_ol}", lines: [ { part_id: "${part_ol}", quantity: 5, ship_date: "2026-10-01" }, { part_id: "${part_ol}", quantity: 7, ship_date: "2026-11-01" } ] }
              as: SalesRep
              captures: { o_ol: $.data.id }
            - call: "GET /order-lines?order_id=${o_ol}"
              as: DistributorAdmin
          assert:
            - "CustomerOrder.${o_ol}.status == SUBMITTED"
            - "GET /order-lines?order_id=${o_ol} returns total_count == 2, both with status OPEN, order_id == ${o_ol}, shipped_qty == 0, allocated_qty == 0"

  # ============================================================ state_machines
  - section: state_machines
    instances:
      - name: acknowledge_twice_rejected
        claim_type: idempotency
        grounds: [state_machines.CustomerOrder.SUBMITTED_to_ACKNOWLEDGED, "errors[ERR_ORDER_NOT_SUBMITTED]"]
        distinguishing_aspect: "Repeating the acknowledge trigger on an ACKNOWLEDGED order fails with ERR_ORDER_NOT_SUBMITTED; no double snapshot occurs."
        test_recipe:
          setup: ["One SUBMITTED order with one line"]
          setup_api_calls:
            - call: "POST /manufacturer-lines"
              payload: { line_code: "LIN-AK", name: "Ack Line", sourcing_channel: "FRANCHISED" }
              as: DistributorAdmin
              captures: { line_ak: $.data.id }
            - call: "POST /parts"
              payload: { manufacturer_line_id: "${line_ak}", part_number: "PAK-1", msl_level: 3, floor_life_hours: 100, date_code_limit_months: 24, standard_cost_cents: 1000, book_price_cents: 1500 }
              as: DistributorAdmin
              captures: { part_ak: $.data.id }
            - call: "POST /customers"
              payload: { name: "Cust AK", credit_limit_cents: 100000000 }
              as: DistributorAdmin
              captures: { cust_ak: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_ak}", lines: [ { part_id: "${part_ak}", quantity: 5, ship_date: "2026-10-01" } ] }
              as: SalesRep
              captures: { o_ak: $.data.id }
            - call: "POST /orders/${o_ak}/acknowledge"
              payload: {}
              as: SalesRep
          trigger:
            - call: "POST /orders/${o_ak}/acknowledge"
              payload: {}
              as: SalesRep
              captures: { err_ak: $.data.error_id }
          assert:
            - "${err_ak} == ERR_ORDER_NOT_SUBMITTED (http 409)"
            - "CustomerOrder.${o_ak}.status == ACKNOWLEDGED and .version == 2 (second acknowledge changed nothing)"

      - name: acknowledge_snapshots_line_terms
        claim_type: side_effect_execution
        grounds: [state_machines.CustomerOrder.SUBMITTED_to_ACKNOWLEDGED, entities.OrderLine.fields.unit_price_cents, entities.OrderLine.fields.ncnr_snapshot, entities.OrderLine.fields.cancel_by_date]
        distinguishing_aspect: "Acknowledge snapshots book price and the line's custom NCNR/window terms onto each order line and derives cancel_by_date."
        test_recipe:
          setup: ["Line with cancel_window_days 45, reschedule_window_days 15; part book_price_cents 1500; SUBMITTED order line qty 5 ship_date 2026-10-01"]
          setup_api_calls:
            - call: "POST /manufacturer-lines"
              payload: { line_code: "LIN-SN", name: "Snapshot Line", sourcing_channel: "FRANCHISED", cancel_window_days: 45, reschedule_window_days: 15 }
              as: DistributorAdmin
              captures: { line_sn: $.data.id }
            - call: "POST /parts"
              payload: { manufacturer_line_id: "${line_sn}", part_number: "PSN-1", msl_level: 3, floor_life_hours: 100, date_code_limit_months: 24, standard_cost_cents: 1000, book_price_cents: 1500 }
              as: DistributorAdmin
              captures: { part_sn: $.data.id }
            - call: "POST /customers"
              payload: { name: "Cust SN", credit_limit_cents: 100000000 }
              as: DistributorAdmin
              captures: { cust_sn: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_sn}", lines: [ { part_id: "${part_sn}", quantity: 5, ship_date: "2026-10-01" } ] }
              as: SalesRep
              captures: { o_sn: $.data.id }
            - call: "GET /order-lines?order_id=${o_sn}"
              as: DistributorAdmin
              captures: { l_sn: "$.data[0].id" }
          trigger:
            - call: "POST /orders/${o_sn}/acknowledge"
              payload: {}
              as: SalesRep
          assert:
            - "OrderLine.${l_sn}.unit_price_cents == 1500 (snapshot of book price)"
            - "OrderLine.${l_sn}.ncnr_snapshot == false, .cancel_window_days_snapshot == 45, .reschedule_window_days_snapshot == 15"
            - "OrderLine.${l_sn}.cancel_by_date == 2026-08-17 (2026-10-01 minus 45 days)"
            - "CustomerOrder.${o_sn}.open_exposure_cents == 7500 (5 * 1500)"

      - name: rejected_lot_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.InventoryLot.IN_INSPECTION_to_REJECTED, "errors[ERR_LOT_NOT_AVAILABLE]", "errors[ERR_LOT_NOT_QUARANTINED]"]
        distinguishing_aspect: "A REJECTED lot accepts no further transitions: exposure open and bake both fail with state errors."
        test_recipe:
          setup: ["Open-market lot inspected with disposition REJECT -> status REJECTED"]
          setup_api_calls:
            - call: "POST /manufacturer-lines"
              payload: { line_code: "LIN-RJ", name: "Reject Line", sourcing_channel: "FRANCHISED" }
              as: DistributorAdmin
              captures: { line_rj: $.data.id }
            - call: "POST /parts"
              payload: { manufacturer_line_id: "${line_rj}", part_number: "PRJ-1", msl_level: 3, floor_life_hours: 100, date_code_limit_months: 24, standard_cost_cents: 1000, book_price_cents: 1500 }
              as: DistributorAdmin
              captures: { part_rj: $.data.id }
            - call: "POST /lots"
              payload: { part_id: "${part_rj}", date_code: "202601", qty_received: 10, source_type: "OPEN_MARKET" }
              as: WarehouseOps
              as_user_id: "wh-01"
              captures: { lot_rj: $.data.id }
            - call: "POST /lots/${lot_rj}/inspect"
              payload: { disposition: "REJECT", note: "counterfeit markers" }
              as: QualityInspector
              as_user_id: "qi-01"
          trigger:
            - call: "POST /lots/${lot_rj}/exposures"
              payload: { note: "attempt on rejected" }
              as: WarehouseOps
              captures: { err_rj1: $.data.error_id }
            - call: "POST /lots/${lot_rj}/bake"
              payload: {}
              as: WarehouseOps
              captures: { err_rj2: $.data.error_id }
          assert:
            - "${err_rj1} == ERR_LOT_NOT_AVAILABLE"
            - "${err_rj2} == ERR_LOT_NOT_QUARANTINED"
            - "InventoryLot.${lot_rj}.status == REJECTED and .authenticity == REJECTED"

      - name: publish_twice_rejected
        claim_type: invalid_transition
        grounds: [state_machines.AllocationRun.PROVISIONAL_to_PUBLISHED, "errors[ERR_ALLOCATION_RUN_NOT_PROVISIONAL]"]
        distinguishing_aspect: "Publishing an already-PUBLISHED run fails; allocations are not applied twice."
        test_recipe:
          setup: ["Part with lot 100; one ACKNOWLEDGED line qty 10; run created and published"]
          setup_api_calls:
            - call: "POST /manufacturer-lines"
              payload: { line_code: "LIN-PP", name: "PubPub Line", sourcing_channel: "FRANCHISED" }
              as: DistributorAdmin
              captures: { line_pp: $.data.id }
            - call: "POST /parts"
              payload: { manufacturer_line_id: "${line_pp}", part_number: "PPP-1", msl_level: 3, floor_life_hours: 100, date_code_limit_months: 24, standard_cost_cents: 1000, book_price_cents: 1500 }
              as: DistributorAdmin
              captures: { part_pp: $.data.id }
            - call: "POST /lots"
              payload: { part_id: "${part_pp}", date_code: "202601", qty_received: 100, source_type: "FRANCHISED" }
              as: WarehouseOps
            - call: "POST /customers"
              payload: { name: "Cust PP", credit_limit_cents: 100000000 }
              as: DistributorAdmin
              captures: { cust_pp: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_pp}", lines: [ { part_id: "${part_pp}", quantity: 10, ship_date: "2026-10-01" } ] }
              as: SalesRep
              captures: { o_pp: $.data.id }
            - call: "POST /orders/${o_pp}/acknowledge"
              payload: {}
              as: SalesRep
            - call: "GET /order-lines?order_id=${o_pp}"
              as: DistributorAdmin
              captures: { l_pp: "$.data[0].id" }
            - call: "GET /parts/${part_pp}"
              as: DistributorAdmin
              captures: { part_pp_v: $.data.version }
            - call: "POST /allocation-runs"
              payload: { part_id: "${part_pp}", expected_part_version: "${part_pp_v}" }
              as: DistributorAdmin
              captures: { run_pp: $.data.id }
            - call: "POST /allocation-runs/${run_pp}/publish"
              payload: {}
              as: DistributorAdmin
          trigger:
            - call: "POST /allocation-runs/${run_pp}/publish"
              payload: {}
              as: DistributorAdmin
              captures: { err_pp: $.data.error_id }
          assert:
            - "${err_pp} == ERR_ALLOCATION_RUN_NOT_PROVISIONAL (http 409)"
            - "OrderLine.${l_pp}.allocated_qty == 10 (not doubled)"
            - "Part.${part_pp}.qty_reserved == 10 and .qty_on_hand == 90"

      - name: claim_settle_from_submitted_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ShipAndDebitClaim.SUPPLIER_APPROVED_to_SETTLED, "errors[ERR_CLAIM_INVALID_STATE]"]
        distinguishing_aspect: "Settle is only legal from SUPPLIER_APPROVED; a SUBMITTED claim rejects with ERR_CLAIM_INVALID_STATE and posts no debit."
        test_recipe:
          setup: ["Claim SUBMITTED via shipped line covered by an APPROVED registration (cost 700, std 1000, qty 5)"]
          setup_api_calls:
            - call: "POST /manufacturer-lines"
              payload: { line_code: "LIN-CS", name: "ClaimSettle Line", sourcing_channel: "FRANCHISED" }
              as: DistributorAdmin
              captures: { line_cs: $.data.id }
            - call: "POST /parts"
              payload: { manufacturer_line_id: "${line_cs}", part_number: "PCS-1", msl_level: 3, floor_life_hours: 100, date_code_limit_months: 24, standard_cost_cents: 1000, book_price_cents: 1500 }
              as: DistributorAdmin
              captures: { part_cs: $.data.id }
            - call: "POST /lots"
              payload: { part_id: "${part_cs}", date_code: "202601", qty_received: 100, source_type: "FRANCHISED" }
              as: WarehouseOps
            - call: "POST /customers"
              payload: { name: "Cust CS", credit_limit_cents: 100000000 }
              as: DistributorAdmin
              captures: { cust_cs: $.data.id }
            - call: "POST /design-registrations"
              payload: { customer_id: "${cust_cs}", part_id: "${part_cs}", end_customer_name: "EndCo", registered_cost_cents: 700, max_registered_qty: 20, valid_from: "2026-08-01", valid_to: "2026-12-31" }
              as: SalesRep
              captures: { reg_cs: $.data.id }
            - call: "POST /design-registrations/${reg_cs}/decision"
              payload: { decision: "APPROVE" }
              as: SupplierAdmin
            - call: "POST /orders"
              payload: { customer_id: "${cust_cs}", lines: [ { part_id: "${part_cs}", quantity: 5, ship_date: "2026-10-01" } ] }
              as: SalesRep
              captures: { o_cs: $.data.id }
            - call: "POST /orders/${o_cs}/acknowledge"
              payload: {}
              as: SalesRep
            - call: "GET /order-lines?order_id=${o_cs}"
              as: DistributorAdmin
              captures: { l_cs: "$.data[0].id" }
            - call: "GET /parts/${part_cs}"
              as: DistributorAdmin
              captures: { part_cs_v: $.data.version }
            - call: "POST /allocation-runs"
              payload: { part_id: "${part_cs}", expected_part_version: "${part_cs_v}" }
              as: DistributorAdmin
              captures: { run_cs: $.data.id }
            - call: "POST /allocation-runs/${run_cs}/publish"
              payload: {}
              as: DistributorAdmin
            - call: "POST /orders/${o_cs}/lines/${l_cs}/ship"
              payload: { qty: 5 }
              as: WarehouseOps
            - call: "GET /claims?order_line_id=${l_cs}"
              as: DistributorAdmin
              captures: { claim_cs: "$.data[0].id" }
          trigger:
            - call: "POST /claims/${claim_cs}/settle"
              payload: {}
              as: SupplierAdmin
              captures: { err_cs: $.data.error_id }
          assert:
            - "${err_cs} == ERR_CLAIM_INVALID_STATE (http 409)"
            - "ManufacturerLine.${line_cs}.open_debit_balance_cents == 0 (no debit posted)"

      - name: order_auto_transitions_partial_then_completed
        claim_type: valid_transition
        grounds: [state_machines.CustomerOrder.ACKNOWLEDGED_to_PARTIALLY_SHIPPED, state_machines.CustomerOrder.PARTIALLY_SHIPPED_to_COMPLETED]
        distinguishing_aspect: "The order auto-transitions ACKNOWLEDGED -> PARTIALLY_SHIPPED on the first line ship and -> COMPLETED when every line is SHIPPED."
        test_recipe:
          setup: ["Two-line order (qty 40 and 30), both lines ALLOCATED from a lot of 100"]
          setup_api_calls:
            - call: "POST /manufacturer-lines"
              payload: { line_code: "LIN-AT", name: "AutoTrans Line", sourcing_channel: "FRANCHISED" }
              as: DistributorAdmin
              captures: { line_at: $.data.id }
            - call: "POST /parts"
              payload: { manufacturer_line_id: "${line_at}", part_number: "PAT-1", msl_level: 3, floor_life_hours: 100, date_code_limit_months: 24, standard_cost_cents: 1000, book_price_cents: 1500 }
              as: DistributorAdmin
              captures: { part_at: $.data.id }
            - call: "POST /lots"
              payload: { part_id: "${part_at}", date_code: "202601", qty_received: 100, source_type: "FRANCHISED" }
              as: WarehouseOps
            - call: "POST /customers"
              payload: { name: "Cust AT", credit_limit_cents: 100000000 }
              as: DistributorAdmin
              captures: { cust_at: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_at}", lines: [ { part_id: "${part_at}", quantity: 40, ship_date: "2026-10-01" }, { part_id: "${part_at}", quantity: 30, ship_date: "2026-11-01" } ] }
              as: SalesRep
              captures: { o_at: $.data.id }
            - call: "POST /orders/${o_at}/acknowledge"
              payload: {}
              as: SalesRep
            - call: "GET /order-lines?order_id=${o_at}"
              as: DistributorAdmin
              captures: { l_at1: "$.data[0].id", l_at2: "$.data[1].id" }
            - call: "GET /parts/${part_at}"
              as: DistributorAdmin
              captures: { part_at_v: $.data.version }
            - call: "POST /allocation-runs"
              payload: { part_id: "${part_at}", expected_part_version: "${part_at_v}" }
              as: DistributorAdmin
              captures: { run_at: $.data.id }
            - call: "POST /allocation-runs/${run_at}/publish"
              payload: {}
              as: DistributorAdmin
          trigger:
            - call: "POST /orders/${o_at}/lines/${l_at1}/ship"
              payload: { qty: 40 }
              as: WarehouseOps
            - call: "GET /orders/${o_at}"
              as: DistributorAdmin
              captures: { o_at_mid: $.data.status }
            - call: "POST /orders/${o_at}/lines/${l_at2}/ship"
              payload: { qty: 30 }
              as: WarehouseOps
          assert:
            - "${o_at_mid} == PARTIALLY_SHIPPED (auto-transition on first ship)"
            - "CustomerOrder.${o_at}.status == COMPLETED after the second line ships"
            - "OrderLine.${l_at1}.status == SHIPPED and OrderLine.${l_at2}.status == SHIPPED"
            - "Part.${part_at}.qty_on_hand == 30 and .qty_reserved == 0 and the lot is not DEPLETED (30 units remain on hand)"

      - name: release_hold_roundtrip
        claim_type: valid_transition
        grounds: [state_machines.CustomerOrder.ON_HOLD_to_ACKNOWLEDGED, "errors[ERR_ORDER_NOT_ACKNOWLEDGED]"]
        distinguishing_aspect: "Release-hold moves ON_HOLD -> ACKNOWLEDGED; a second release is rejected because the order is no longer ON_HOLD."
        test_recipe:
          setup: ["Order driven ON_HOLD by a credit-failed ship (credit_limit 1000, ship value 15000)"]
          setup_api_calls:
            - call: "POST /manufacturer-lines"
              payload: { line_code: "LIN-RH", name: "ReleaseHold Line", sourcing_channel: "FRANCHISED" }
              as: DistributorAdmin
              captures: { line_rh: $.data.id }
            - call: "POST /parts"
              payload: { manufacturer_line_id: "${line_rh}", part_number: "PRH-1", msl_level: 3, floor_life_hours: 100, date_code_limit_months: 24, standard_cost_cents: 1000, book_price_cents: 1500 }
              as: DistributorAdmin
              captures: { part_rh: $.data.id }
            - call: "POST /lots"
              payload: { part_id: "${part_rh}", date_code: "202601", qty_received: 100, source_type: "FRANCHISED" }
              as: WarehouseOps
            - call: "POST /customers"
              payload: { name: "Cust RH", credit_limit_cents: 1000 }
              as: DistributorAdmin
              captures: { cust_rh: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_rh}", lines: [ { part_id: "${part_rh}", quantity: 10, ship_date: "2026-10-01" } ] }
              as: SalesRep
              captures: { o_rh: $.data.id }
            - call: "POST /orders/${o_rh}/acknowledge"
              payload: {}
              as: SalesRep
            - call: "GET /order-lines?order_id=${o_rh}"
              as: DistributorAdmin
              captures: { l_rh: "$.data[0].id" }
            - call: "GET /parts/${part_rh}"
              as: DistributorAdmin
              captures: { part_rh_v: $.data.version }
            - call: "POST /allocation-runs"
              payload: { part_id: "${part_rh}", expected_part_version: "${part_rh_v}" }
              as: DistributorAdmin
              captures: { run_rh: $.data.id }
            - call: "POST /allocation-runs/${run_rh}/publish"
              payload: {}
              as: DistributorAdmin
            - call: "POST /orders/${o_rh}/lines/${l_rh}/ship"
              payload: { qty: 10 }
              as: WarehouseOps
              captures: { err_rh_ship: $.data.error_id }
          trigger:
            - call: "POST /orders/${o_rh}/release-hold"
              payload: {}
              as: SalesRep
            - call: "POST /orders/${o_rh}/release-hold"
              payload: {}
              as: SalesRep
              captures: { err_rh2: $.data.error_id }
          assert:
            - "${err_rh_ship} == ERR_CREDIT_LIMIT_EXCEEDED and the order went ON_HOLD"
            - "First release-hold: CustomerOrder.${o_rh}.status == ACKNOWLEDGED"
            - "Second release-hold: ${err_rh2} == ERR_ORDER_NOT_ACKNOWLEDGED (order no longer ON_HOLD)"

  # ============================================================ calculations
  - section: calculations
    instances:
      - name: msl_floor_life_99_vs_100_hours
        claim_type: correct_result
        grounds: [calculations.msl_exposure_accrual, state_machines.InventoryLot.AVAILABLE_to_QUARANTINED]
        distinguishing_aspect: "Threshold boundary on MSL accrual: at 99 accumulated hours the lot stays AVAILABLE; at exactly 100 hours (>= floor_life_hours) the sweep quarantines it."
        test_recipe:
          setup: ["Part floor_life_hours 100; AVAILABLE lot with an exposure opened at 2026-08-01T00:00:00Z"]
          setup_api_calls:
            - call: "POST /manufacturer-lines"
              payload: { line_code: "LIN-99", name: "MSL99 Line", sourcing_channel: "FRANCHISED" }
              as: DistributorAdmin
              captures: { line_99: $.data.id }
            - call: "POST /parts"
              payload: { manufacturer_line_id: "${line_99}", part_number: "P99-1", msl_level: 3, floor_life_hours: 100, date_code_limit_months: 24, standard_cost_cents: 1000, book_price_cents: 1500 }
              as: DistributorAdmin
              captures: { part_99: $.data.id }
            - call: "POST /lots"
              payload: { part_id: "${part_99}", date_code: "202601", qty_received: 50, source_type: "FRANCHISED" }
              as: WarehouseOps
              captures: { lot_99: $.data.id }
            - call: "POST /lots/${lot_99}/exposures"
              payload: { note: "open" }
              as: WarehouseOps
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T03:00:00Z" }
              as: DistributorAdmin
            - call: "GET /lots/${lot_99}"
              as: DistributorAdmin
              captures: { lot_99_status: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T04:00:00Z" }
              as: DistributorAdmin
          assert:
            - "At 99 hours (2026-08-05T03:00:00Z): ${lot_99_status} == AVAILABLE (no quarantine below floor life)"
            - "At exactly 100 hours (2026-08-05T04:00:00Z): InventoryLot.${lot_99}.status == QUARANTINED and .msl_exposure_hours == 100"

      - name: date_code_at_limit_still_ships
        claim_type: correct_result
        grounds: [calculations.date_code_freshness, "errors[ERR_DATE_CODE_TOO_OLD]"]
        distinguishing_aspect: "months_elapsed == date_code_limit_months is still fresh (stale only when strictly greater): a 202408 lot on a 24-month part ships fine in 2026-08."
        test_recipe:
          setup: ["Part date_code_limit_months 24; lot date_code 202408 qty 10; order line qty 4 ALLOCATED; clock 2026-08-15 (months_elapsed == 24)"]
          setup_api_calls:
            - call: "POST /manufacturer-lines"
              payload: { line_code: "LIN-DC", name: "DateCode Line", sourcing_channel: "FRANCHISED" }
              as: DistributorAdmin
              captures: { line_dc: $.data.id }
            - call: "POST /parts"
              payload: { manufacturer_line_id: "${line_dc}", part_number: "PDC-1", msl_level: 3, floor_life_hours: 100, date_code_limit_months: 24, standard_cost_cents: 1000, book_price_cents: 1500 }
              as: DistributorAdmin
              captures: { part_dc: $.data.id }
            - call: "POST /lots"
              payload: { part_id: "${part_dc}", date_code: "202408", qty_received: 10, source_type: "FRANCHISED" }
              as: WarehouseOps
            - call: "POST /customers"
              payload: { name: "Cust DC", credit_limit_cents: 100000000 }
              as: DistributorAdmin
              captures: { cust_dc: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_dc}", lines: [ { part_id: "${part_dc}", quantity: 4, ship_date: "2026-10-01" } ] }
              as: SalesRep
              captures: { o_dc: $.data.id }
            - call: "POST /orders/${o_dc}/acknowledge"
              payload: {}
              as: SalesRep
            - call: "GET /order-lines?order_id=${o_dc}"
              as: DistributorAdmin
              captures: { l_dc: "$.data[0].id" }
            - call: "GET /parts/${part_dc}"
              as: DistributorAdmin
              captures: { part_dc_v: $.data.version }
            - call: "POST /allocation-runs"
              payload: { part_id: "${part_dc}", expected_part_version: "${part_dc_v}" }
              as: DistributorAdmin
              captures: { run_dc: $.data.id }
            - call: "POST /allocation-runs/${run_dc}/publish"
              payload: {}
              as: DistributorAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: DistributorAdmin
          trigger:
            - call: "POST /orders/${o_dc}/lines/${l_dc}/ship"
              payload: { qty: 4 }
              as: WarehouseOps
          assert:
            - "Ship succeeds at months_elapsed == 24 == date_code_limit_months (boundary inclusive)"
            - "OrderLine.${l_dc}.status == SHIPPED and .shipped_qty == 4"
            - "Customer.${cust_dc}.open_balance_cents == 6000 (4 * 1500)"

      - name: order_exposure_recompute_on_line_cancel
        claim_type: correct_result
        grounds: [calculations.order_exposure, entities.CustomerOrder.fields.open_exposure_cents]
        distinguishing_aspect: "Derived-field reconciliation: cancelling one of two open lines recomputes open_exposure_cents from 22500 to 15000 in the same request."
        test_recipe:
          setup: ["ACKNOWLEDGED order with two OPEN lines: qty 5 and qty 10, unit price 1500 (exposure 22500); clock 2026-08-01 (cancel window open, cancel_by 2026-09-01)"]
          setup_api_calls:
            - call: "POST /manufacturer-lines"
              payload: { line_code: "LIN-EX", name: "Exposure Line", sourcing_channel: "FRANCHISED" }
              as: DistributorAdmin
              captures: { line_ex: $.data.id }
            - call: "POST /parts"
              payload: { manufacturer_line_id: "${line_ex}", part_number: "PEX-1", msl_level: 3, floor_life_hours: 100, date_code_limit_months: 24, standard_cost_cents: 1000, book_price_cents: 1500 }
              as: DistributorAdmin
              captures: { part_ex: $.data.id }
            - call: "POST /customers"
              payload: { name: "Cust EX", credit_limit_cents: 100000000 }
              as: DistributorAdmin
              captures: { cust_ex: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_ex}", lines: [ { part_id: "${part_ex}", quantity: 5, ship_date: "2026-10-01" }, { part_id: "${part_ex}", quantity: 10, ship_date: "2026-11-01" } ] }
              as: SalesRep
              captures: { o_ex: $.data.id }
            - call: "POST /orders/${o_ex}/acknowledge"
              payload: {}
              as: SalesRep
            - call: "GET /order-lines?order_id=${o_ex}"
              as: DistributorAdmin
              captures: { l_ex1: "$.data[0].id" }
          trigger:
            - call: "POST /orders/${o_ex}/lines/${l_ex1}/cancel"
              payload: {}
              as: SalesRep
          assert:
            - "OrderLine.${l_ex1}.status == CANCELLED"
            - "CustomerOrder.${o_ex}.open_exposure_cents == 15000 (was 22500 before the cancel; remaining line 10 * 1500)"
            - "CustomerOrder.${o_ex}.status == ACKNOWLEDGED (order-level cancel not triggered by a line cancel)"

      - name: registration_expiry_sweep
        claim_type: input_set_filtering
        grounds: [state_machines.DesignRegistration.APPROVED_to_EXPIRED, state_machines.DesignRegistration.SUBMITTED_to_EXPIRED, calculations.msl_exposure_accrual]
        distinguishing_aspect: "The clock sweep expires APPROVED and SUBMITTED registrations whose valid_to passed, while a registration with valid_to >= now is untouched."
        test_recipe:
          setup: ["Two APPROVED/SUBMITTED registrations: R1 window ends 2026-08-31, R2 window ends 2026-12-31"]
          setup_api_calls:
            - call: "POST /manufacturer-lines"
              payload: { line_code: "LIN-XP", name: "Expiry Line", sourcing_channel: "FRANCHISED" }
              as: DistributorAdmin
              captures: { line_xp: $.data.id }
            - call: "POST /parts"
              payload: { manufacturer_line_id: "${line_xp}", part_number: "PXP-1", msl_level: 3, floor_life_hours: 100, date_code_limit_months: 24, standard_cost_cents: 1000, book_price_cents: 1500 }
              as: DistributorAdmin
              captures: { part_xp: $.data.id }
            - call: "POST /customers"
              payload: { name: "Cust XP", credit_limit_cents: 100000000 }
              as: DistributorAdmin
              captures: { cust_xp: $.data.id }
            - call: "POST /design-registrations"
              payload: { customer_id: "${cust_xp}", part_id: "${part_xp}", end_customer_name: "EndCo", registered_cost_cents: 700, max_registered_qty: 10, valid_from: "2026-08-01", valid_to: "2026-08-31" }
              as: SalesRep
              captures: { reg_xp1: $.data.id }
            - call: "POST /design-registrations"
              payload: { customer_id: "${cust_xp}", part_id: "${part_xp}", end_customer_name: "EndCo", registered_cost_cents: 700, max_registered_qty: 10, valid_from: "2026-09-01", valid_to: "2026-12-31" }
              as: SalesRep
              captures: { reg_xp2: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: DistributorAdmin
          assert:
            - "DesignRegistration.${reg_xp1}.status == EXPIRED (valid_to 2026-08-31 < now)"
            - "DesignRegistration.${reg_xp2}.status == SUBMITTED (valid_to 2026-12-31 >= now; sweep filtered it out)"

      - name: msl_quarantine_cascade_covered_by_difficulty
        claim_type: correct_result
        grounds: [calculations.msl_exposure_accrual, state_machines.InventoryLot.AVAILABLE_to_QUARANTINED]
        excluded_because:
          difficulty_instance: msl_quarantine_cascade_depth3
          rationale: "Breach accrual and the full release cascade (lot -> line -> order recompute) are asserted end-to-end by the named §1.8 instance; the 99-vs-100 boundary is covered by msl_floor_life_99_vs_100_hours above."

      - name: buyback_cap_boundary_covered_by_difficulty
        claim_type: correct_result
        grounds: [calculations.buyback_cap_check]
        excluded_because:
          difficulty_instance: buyback_cap_inclusive_boundary
          rationale: "Inclusive cap boundary (148500 allowed, 149850 rejected) is asserted with exact literals by the named §1.8 instance."

  # ============================================================ validations
  - section: validations
    instances:
      - name: request_without_role_header_returns_400
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "Priority-1 auth check: a request without X-User-Role fails 400 before any other validation runs."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /manufacturer-lines"
              as: SalesRep
              captures: { err_auth: $.data.error_id }
          assert:
            - "With the X-User-Role header omitted the response is 400 and ${err_auth} == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"

      - name: invalid_enum_source_type_rejected
        claim_type: type_constraints
        grounds: [entities.InventoryLot.fields.source_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "An enum field rejects a value outside {FRANCHISED, OPEN_MARKET} with 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Line and part exist"]
          setup_api_calls:
            - call: "POST /manufacturer-lines"
              payload: { line_code: "LIN-EN", name: "Enum Line", sourcing_channel: "FRANCHISED" }
              as: DistributorAdmin
              captures: { line_en: $.data.id }
            - call: "POST /parts"
              payload: { manufacturer_line_id: "${line_en}", part_number: "PEN-1", msl_level: 3, floor_life_hours: 100, date_code_limit_months: 24, standard_cost_cents: 1000, book_price_cents: 1500 }
              as: DistributorAdmin
              captures: { part_en: $.data.id }
          trigger:
            - call: "POST /lots"
              payload: { part_id: "${part_en}", date_code: "202601", qty_received: 10, source_type: "GRAY_MARKET" }
              as: WarehouseOps
              captures: { err_en: $.data.error_id }
          assert:
            - "${err_en} == ERR_INVALID_REQUEST (http 400)"
            - "GET /lots?part_id=${part_en} returns total_count == 0"

      - name: acknowledge_nonexistent_order_returns_not_found
        claim_type: priority_ordering
        grounds: ["validations[priority=3]", "validations[priority=4]", "errors[ERR_ORDER_NOT_FOUND]"]
        distinguishing_aspect: "Existence (priority 3) beats state (priority 4): acknowledging an unknown order id returns 404, never a state error."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /orders/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/acknowledge"
              payload: {}
              as: SalesRep
              captures: { err_ex: $.data.error_id }
          assert:
            - "${err_ex} == ERR_ORDER_NOT_FOUND (http 404)"

      - name: duplicate_line_code_rejected
        claim_type: violation_to_error
        grounds: [entities.ManufacturerLine.fields.line_code, "errors[ERR_DUPLICATE_LINE_CODE]"]
        distinguishing_aspect: "line_code uniqueness is global; the second create with the same code fails 409."
        test_recipe:
          setup: ["One line LIN-DUP exists"]
          setup_api_calls:
            - call: "POST /manufacturer-lines"
              payload: { line_code: "LIN-DUP", name: "Dup Line", sourcing_channel: "FRANCHISED" }
              as: DistributorAdmin
          trigger:
            - call: "POST /manufacturer-lines"
              payload: { line_code: "LIN-DUP", name: "Dup Line 2", sourcing_channel: "OPEN_MARKET" }
              as: DistributorAdmin
              captures: { err_dup: $.data.error_id }
          assert:
            - "${err_dup} == ERR_DUPLICATE_LINE_CODE (http 409)"
            - "GET /manufacturer-lines returns total_count == 1"

      - name: duplicate_part_number_scoped_to_line
        claim_type: violation_to_error
        grounds: [entities.Part.fields.part_number, "errors[ERR_DUPLICATE_PART_NUMBER]"]
        distinguishing_aspect: "part_number uniqueness is scoped to the manufacturer line: same number on the same line fails, same number on a different line succeeds."
        test_recipe:
          setup: ["Two lines; part PN-SCOPE exists on line 1"]
          setup_api_calls:
            - call: "POST /manufacturer-lines"
              payload: { line_code: "LIN-S1", name: "Scope Line 1", sourcing_channel: "FRANCHISED" }
              as: DistributorAdmin
              captures: { line_s1: $.data.id }
            - call: "POST /manufacturer-lines"
              payload: { line_code: "LIN-S2", name: "Scope Line 2", sourcing_channel: "FRANCHISED" }
              as: DistributorAdmin
              captures: { line_s2: $.data.id }
            - call: "POST /parts"
              payload: { manufacturer_line_id: "${line_s1}", part_number: "PN-SCOPE", msl_level: 3, floor_life_hours: 100, date_code_limit_months: 24, standard_cost_cents: 1000, book_price_cents: 1500 }
              as: DistributorAdmin
          trigger:
            - call: "POST /parts"
              payload: { manufacturer_line_id: "${line_s1}", part_number: "PN-SCOPE", msl_level: 2, floor_life_hours: 100, date_code_limit_months: 24, standard_cost_cents: 1000, book_price_cents: 1500 }
              as: DistributorAdmin
              captures: { err_scope: $.data.error_id }
            - call: "POST /parts"
              payload: { manufacturer_line_id: "${line_s2}", part_number: "PN-SCOPE", msl_level: 2, floor_life_hours: 100, date_code_limit_months: 24, standard_cost_cents: 1000, book_price_cents: 1500 }
              as: DistributorAdmin
              captures: { part_s2: $.data.id }
          assert:
            - "${err_scope} == ERR_DUPLICATE_PART_NUMBER (http 409, same line)"
            - "Part.${part_s2} created on the other line (uniqueness is per-line)"

      - name: channel_mismatch_franchised_lot_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_CHANNEL_MISMATCH]", "validations[priority=6]"]
        distinguishing_aspect: "A FRANCHISED lot cannot be received against a part whose line is OPEN_MARKET."
        test_recipe:
          setup: ["OPEN_MARKET line with one part"]
          setup_api_calls:
            - call: "POST /manufacturer-lines"
              payload: { line_code: "LIN-OM", name: "Open Market Line", sourcing_channel: "OPEN_MARKET" }
              as: DistributorAdmin
              captures: { line_om: $.data.id }
            - call: "POST /parts"
              payload: { manufacturer_line_id: "${line_om}", part_number: "POM-1", msl_level: 3, floor_life_hours: 100, date_code_limit_months: 24, standard_cost_cents: 1000, book_price_cents: 1500 }
              as: DistributorAdmin
              captures: { part_om: $.data.id }
          trigger:
            - call: "POST /lots"
              payload: { part_id: "${part_om}", date_code: "202601", qty_received: 10, source_type: "FRANCHISED" }
              as: WarehouseOps
              captures: { err_om: $.data.error_id }
          assert:
            - "${err_om} == ERR_CHANNEL_MISMATCH (http 409)"

      - name: order_with_empty_lines_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_INVALID_REQUEST]", entities.CustomerOrder]
        distinguishing_aspect: "An order must carry at least one line; an empty lines array fails 400."
        test_recipe:
          setup: ["Customer exists"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Cust EL", credit_limit_cents: 100000000 }
              as: DistributorAdmin
              captures: { cust_el: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${cust_el}", lines: [] }
              as: SalesRep
              captures: { err_el: $.data.error_id }
          assert:
            - "${err_el} == ERR_INVALID_REQUEST (http 400)"

      - name: credit_hold_customer_blocked_at_order_create
        claim_type: violation_to_error
        grounds: ["errors[ERR_CUSTOMER_CREDIT_HOLD]", "validations[priority=4]"]
        distinguishing_aspect: "A CREDIT_HOLD customer cannot place new orders; the state check fires at creation, not just at acknowledge."
        test_recipe:
          setup: ["Customer with status CREDIT_HOLD; part exists"]
          setup_api_calls:
            - call: "POST /manufacturer-lines"
              payload: { line_code: "LIN-CH", name: "CreditHold Line", sourcing_channel: "FRANCHISED" }
              as: DistributorAdmin
              captures: { line_ch: $.data.id }
            - call: "POST /parts"
              payload: { manufacturer_line_id: "${line_ch}", part_number: "PCH-1", msl_level: 3, floor_life_hours: 100, date_code_limit_months: 24, standard_cost_cents: 1000, book_price_cents: 1500 }
              as: DistributorAdmin
              captures: { part_ch: $.data.id }
            - call: "POST /customers"
              payload: { name: "Cust CH", credit_limit_cents: 100000000, status: "CREDIT_HOLD" }
              as: DistributorAdmin
              captures: { cust_ch: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${cust_ch}", lines: [ { part_id: "${part_ch}", quantity: 5, ship_date: "2026-10-01" } ] }
              as: SalesRep
              captures: { err_ch: $.data.error_id }
          assert:
            - "${err_ch} == ERR_CUSTOMER_CREDIT_HOLD (http 409)"
            - "GET /orders?customer_id=${cust_ch} returns total_count == 0"

      - name: state_beats_business_on_cancel_of_shipped_line
        claim_type: priority_ordering
        grounds: ["validations[priority=4]", "validations[priority=7]", "errors[ERR_LINE_NOT_OPEN_OR_ALLOCATED]"]
        distinguishing_aspect: "Cancelling a SHIPPED line reports the priority-4 state error ERR_LINE_NOT_OPEN_OR_ALLOCATED, not any temporal/NCNR error (state group runs first)."
        test_recipe:
          setup: ["Two-line order: line 1 qty 10 ALLOCATED then SHIPPED, line 2 qty 5 OPEN (order is PARTIALLY_SHIPPED, so the order-level state check passes and the line-level state error is unambiguous); window open at 2026-08-01"]
          setup_api_calls:
            - call: "POST /manufacturer-lines"
              payload: { line_code: "LIN-SS", name: "StateShip Line", sourcing_channel: "FRANCHISED" }
              as: DistributorAdmin
              captures: { line_ss: $.data.id }
            - call: "POST /parts"
              payload: { manufacturer_line_id: "${line_ss}", part_number: "PSS-1", msl_level: 3, floor_life_hours: 100, date_code_limit_months: 24, standard_cost_cents: 1000, book_price_cents: 1500 }
              as: DistributorAdmin
              captures: { part_ss: $.data.id }
            - call: "POST /lots"
              payload: { part_id: "${part_ss}", date_code: "202601", qty_received: 100, source_type: "FRANCHISED" }
              as: WarehouseOps
            - call: "POST /customers"
              payload: { name: "Cust SS", credit_limit_cents: 100000000 }
              as: DistributorAdmin
