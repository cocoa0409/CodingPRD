      - name: slot_booking_is_gated_on_the_parent_events_status_open_only
        grounds:
          - validations[priority=12]
          - errors.ERR_INVALID_EVENT_STATE
          - state_machines.ScreeningEvent
          - endpoints[POST /child-find/screening-events/{id}/slots]
        distinguishing_aspect: |
          The bookable window of the parent ScreeningEvent is exactly its OPEN
          state: the identical slot request is refused with ERR_INVALID_EVENT_STATE
          while the event is still SCHEDULED, accepted once it is OPEN, and
          refused again after it is CLOSED - and the failure names the EVENT, not
          the slot being created.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Site S1 is ACTIVE and screening_host_approved, supporting 'en'."
            - "A screening event at S1 for 2026-08-20T09:00Z-12:00Z with slot_capacity 4 and slot_length_minutes 30, created in SCHEDULED."
            - "Three children born 2023-08-01, each 36 months old and age-eligible."
          setup_api_calls:
            - call: "POST /child-find/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /child-find/community-sites"
              payload: { name: "Sunrise Coop", region_code: "R-1", licensed_capacity: 40, iep_seat_capacity: 2, languages_supported: ["en"], screening_host_approved: true, status: "ACTIVE" }
              as: PlacementAdministrator
              captures: { site1_id: "$.data.id" }
            - call: "POST /child-find/children"
              payload: { first_name: "Kid", last_name: "Alpha", date_of_birth: "2023-08-01", guardian_full_name: "G Alpha", district_of_residence: "D-01", primary_language_code: "en" }
              as: ChildFindCoordinator
              captures: { child_a_id: "$.data.id" }
            - call: "POST /child-find/children"
              payload: { first_name: "Kid", last_name: "Bravo", date_of_birth: "2023-08-01", guardian_full_name: "G Bravo", district_of_residence: "D-01", primary_language_code: "en" }
              as: ChildFindCoordinator
              captures: { child_b_id: "$.data.id" }
            - call: "POST /child-find/children"
              payload: { first_name: "Kid", last_name: "Charlie", date_of_birth: "2023-08-01", guardian_full_name: "G Charlie", district_of_residence: "D-01", primary_language_code: "en" }
              as: ChildFindCoordinator
              captures: { child_c_id: "$.data.id" }
            - call: "POST /child-find/screening-events"
              payload: { site_id: "${site1_id}", event_label: "August Child Find", window_start_utc: "2026-08-20T09:00:00Z", window_end_utc: "2026-08-20T12:00:00Z", slot_capacity: 4, slot_length_minutes: 30 }
              as: ChildFindCoordinator
              captures: { event_id: "$.data.id", event_v0: "$.data.version" }
          trigger:
            - call: "POST /child-find/screening-events/${event_id}/slots"
              payload: { child_id: "${child_a_id}", slot_start_utc: "2026-08-20T09:00:00Z", expected_screening_event_version: "${event_v0}" }
              as: ChildFindCoordinator
            - call: "POST /child-find/screening-events/${event_id}/status"
              payload: { target_status: "OPEN" }
              as: ChildFindCoordinator
              captures: { event_v1: "$.data.version" }
            - call: "POST /child-find/screening-events/${event_id}/slots"
              payload: { child_id: "${child_b_id}", slot_start_utc: "2026-08-20T09:30:00Z", expected_screening_event_version: "${event_v1}" }
              as: ChildFindCoordinator
              captures: { slot_b_id: "$.data.id" }
            - call: "POST /child-find/screening-events/${event_id}/status"
              payload: { target_status: "CLOSED" }
              as: ChildFindCoordinator
              captures: { event_v2: "$.data.version" }
            - call: "POST /child-find/screening-events/${event_id}/slots"
              payload: { child_id: "${child_c_id}", slot_start_utc: "2026-08-20T10:00:00Z", expected_screening_event_version: "${event_v2}" }
              as: ChildFindCoordinator
          assert:
            - "first response.status_code == 409"
            - "first response.data.error_id == \"ERR_INVALID_EVENT_STATE\""
            - "third response.status_code == 201"
            - "ScreeningSlot.${slot_b_id}.status == \"BOOKED\""
            - "ScreeningSlot.${slot_b_id}.slot_end_utc == \"2026-08-20T10:00:00Z\""
            - "fifth response.status_code == 409"
            - "fifth response.data.error_id == \"ERR_INVALID_EVENT_STATE\""
            - "ScreeningEvent.${event_id}.status == \"CLOSED\""
            - "ScreeningEvent.${event_id}.booked_slot_count == 1"
