            - *c_cfg
            - *c_buyer
            - *c_verify
            - *c_order
            - *c_place
            - *c_pay
          trigger:
            - call: "POST /v1/orders/${ord_id}/fee-ledger-entries"
              payload: { entry_type: "DELIVERY_FEE_CHARGE", amount_cents: -2500, reason_code: "HOME_DELIVERY_SURCHARGE" }
              as: PlatformAdmin
              captures: { entry_id: $.data.id, entry_amount: $.data.amount_cents }
          assert:
            - "the response status is 201 and \"${entry_amount}\" == -2500"
            - "OrderFeeLedgerEntry.${entry_id}.entry_type == DELIVERY_FEE_CHARGE and reason_code == \"HOME_DELIVERY_SURCHARGE\""
            - "GET /v1/buyers/${byr_id} reports order_credit_balance_cents == 22500"
            - "GET /v1/buyers/${byr_id}/fee-ledger-entries returns exactly 2 rows"

      - name: issue_note_waiver_requires_a_reason
        claim_type: Conditional action
        grounds:
          - endpoints.POST_/v1/issue-notes/{id}/waive
          - state_machines.VehicleIssueNote.OPEN_to_WAIVED
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Waiving is conditional on a non-empty reason: the call without one fails 400 with ERR_INVALID_REQUEST and the note stays OPEN, while the same call with a reason returns 200 and moves it to WAIVED."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; a delivered order whose acceptance inspection documented one blocking issue."
          setup_api_calls:
            - *c_clock
            - *c_jur
            - *c_enact
            - *c_center
            - *c_cfg
            - *c_buyer
            - *c_verify
            - *c_order
            - *c_place
            - *c_pay
            - *c_lock
            - *c_batch
            - call: "POST /v1/production-batches/${bch_id}/start"
              payload: {}
              as: PlatformAdmin
            - *c_unit
            - *c_alloc
            - *c_disp
            - *c_arrive
            - &c_appt_issue
              call: "POST /v1/delivery-appointments"
              payload: { order_id: "${ord_id}", delivery_center_id: "${ctr_id}", delivery_mode: "CENTER", scheduled_start: "2026-09-24T15:00:00Z", scheduled_end: "2026-09-24T16:00:00Z", expected_order_version: "${ord_v}" }
              as: DeliveryAdvisor
              captures: { apt_issue_id: $.data.id, ord_v: $.data.version }
            - call: "POST /v1/delivery-appointments/${apt_issue_id}/confirm"
