              as: AgreementAdmin
            - call: "POST /transformative-agreements/${s9_ta_id}/activation"
              payload: {}
              as: AgreementAdmin
            - call: "POST /articles"
              payload: { journal_id: "${s9_j_id}", corresponding_author_id: "${s9_au_id}", manuscript_title: "Publisher under-applied the negotiated discount", accepted_on: "2026-08-05" }
              as: ScholCommLibrarian
              captures: { s9_a_id: $.data.id }
            - call: "POST /articles/${s9_a_id}/eligibility-checks"
