  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics, different resources)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: availability_schedule_overlapping_effective_windows_same_pattern_rejected
        grounds:
          - entities.AvailabilitySchedule.fields.effective_from
          - entities.AvailabilitySchedule.fields.effective_to
          - entities.AvailabilitySchedule.fields.routing_number_pattern
        distinguishing_aspect: |
          Interval semantics = closed date windows on the (site, routing_pattern)
          resource. Two ACTIVE schedules on the same site with the same
          routing_number_pattern AND overlapping [effective_from, effective_to]
          windows (with the same priority) are rejected as ambiguous. Adjacency
          (effective_to of A == effective_from of B - 1 day) is permitted.
          Resource = AvailabilitySchedule (on a site); distinct from the image
          retention window below.
        test_recipe:
          setup:
            - "Bank, customer, agreement, site PROVISIONING"
            - "Existing ACTIVE schedule SCH-A: pattern='0710', effective_from='2026-08-01', effective_to='2026-08-31', priority=1"
          setup_api_calls:
            - call: "POST /banks"
              payload: { legal_name: "B", routing_number: "021000089", default_earnings_credit_rate_bp: 100 }
              as: BankOperationsAdmin
              captures: { b_id: $.data.id }
            - call: "POST /banks/${b_id}/customers"
              payload: { legal_name: "C", tax_id: "12-1", deposit_account_number: "DDA" }
              as: TreasuryImplementer
