      - name: request_without_role_header_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Missing X-User-Role header yields ERR_UNAUTHENTICATED (401) on any endpoint — auth is priority 1, ahead of every other check."
