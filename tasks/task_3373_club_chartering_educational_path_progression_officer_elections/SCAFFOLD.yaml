# =============================================================================
# SCAFFOLD.yaml — Club Chartering, Educational Path Progression & Officer
# Elections (Toastmasters International)
# =============================================================================
scenario: |
  Club chartering, educational path progression and officer elections for a
  Toastmasters-style district organization. Clubs are petitioned by a sponsor
  club, must hold an organizing meeting and roster a minimum number of dues-paid
  members before a charter is granted; charters can be suspended and reinstated,
  and a club's good-standing posture is derived from a composite score. Members
  pay semiannual dues through a cycle-indexed invoice lifecycle with prorated,
  reinstated and late-renewal quote variants; membership status and dues status
  evolve as independent dimensions, and a dues lapse suspends the member's
  educational path. Educational paths advance through five levels gated by
  approved speech and project completions, and a returned evaluation reverts the
  level. Clubs run meetings with rotating functional and speaking roles, officer
  elections with training requirements, and speech contests that advance winners
  from club level to area level under eligibility and judging protocols. Area and
  division directors record governance visits and coach struggling clubs.

domain_name: club-chartering-path-progression
api_prefix: /toastmasters

complexity_profile:
  primary_archetype: graph_constraint
  secondary_archetype: posture_driven_gating
  complexity_layers: [optimistic_concurrency, cascading_side_effects, derived_field_reconciliation, rate_threshold_triggers]
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns: [one_to_many, many_to_many, self_referential, cross_aggregate]
  role_model: hierarchical_override
  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Club
    parent: null
    common_fields: true
    fields:
      - { name: club_name, type: string, source: input, description: "Display name of the club" }
      - { name: club_type, type: enum, source: input, description: "COMMUNITY | CORPORATE | CAMPUS | ADVANCED" }
      - { name: corporate_sponsor_name, type: string, source: input, description: "Employer sponsoring a CORPORATE club; required when club_type is CORPORATE, null otherwise" }
      - { name: district_number, type: string, source: input, description: "District the club belongs to" }
      - { name: division_code, type: string, source: input, description: "Division letter inside the district" }
      - { name: area_code, type: string, source: input, description: "Area number inside the division" }
      - { name: venue_name, type: string, source: input, description: "Meeting venue; the meeting-overlap rule is scoped to this value" }
      - { name: club_dues_cents, type: integer, source: input, description: "Per-cycle club dues added to international dues on every quote" }
      - { name: sponsor_club_id, type: string, source: input, description: "FK -> Club.id; sponsoring club that mentors this club while ORGANIZING, null when chartered without a sponsor" }
      - { name: organizing_meeting_at, type: datetime, source: input, description: "Timestamp of the organizing meeting, null until the meeting is held" }
      - { name: organizing_meeting_attendees, type: integer, source: input, description: "Prospective members who attended the organizing meeting, 0 until held" }
      - { name: charter_status, type: enum, source: system, description: "ORGANIZING | CHARTERED | SUSPENDED | REVOKED" }
      - { name: charter_date, type: datetime, source: system, description: "Timestamp of the most recent charter grant or reinstatement, null while ORGANIZING" }
      - { name: good_standing, type: enum, source: computed, description: "GOOD | PROBATION | NOT_IN_GOOD_STANDING; posture re-derived from good_standing_score by close-cycle and set to GOOD when a charter is granted" }
      - { name: good_standing_score, type: integer, source: computed, description: "0-100 composite score, recomputed on every membership, officer, education, meeting and cycle mutation" }
      - { name: cycle_open_standing, type: enum, source: system, description: "Snapshot of good_standing taken when the current dues cycle opened; consumed by dcp_recognition_points" }
      - { name: dues_cycle_index, type: integer, source: system, description: "Semiannual cycle counter, 0 at creation, incremented by close-cycle" }
      - { name: cycle_opened_at, type: datetime, source: input, description: "Timestamp the current dues cycle opened, supplied when the club is created and refreshed by close-cycle; the midpoint that drives dues proration is cycle_opened_at + 91 days" }
      - { name: cycle_closed_at, type: datetime, source: system, description: "Timestamp of the most recent close-cycle, null before the first close" }
      - { name: paid_member_count, type: integer, source: computed, description: "Count of memberships with dues_paid_through_cycle >= dues_cycle_index" }
      - { name: total_member_count, type: integer, source: computed, description: "Count of memberships in status PENDING or ACTIVE" }
      - { name: new_member_count_this_cycle, type: integer, source: computed, description: "Count of memberships whose first paid cycle equals dues_cycle_index" }
      - { name: officer_trained_count, type: integer, source: computed, description: "Count of officer terms for the current term_index in status TRAINED or COMPLETED" }
      - { name: meetings_held_this_cycle, type: integer, source: computed, description: "Count of meetings in status HELD within the current cycle" }
      - { name: approved_level_completions_this_cycle, type: integer, source: computed, description: "Count of APPROVED completions at this club in the current cycle whose level equals the member's current path level" }
      - { name: contest_participation_count, type: integer, source: computed, description: "Count of contest entries this cycle whose contest_level is CLUB" }
      - { name: dcp_recognition_points, type: integer, source: computed, description: "0-10 Distinguished Club Program points for the current cycle" }
      - { name: dcp_tier, type: enum, source: computed, description: "PRESIDENT_DISTINGUISHED | SELECT_DISTINGUISHED | DISTINGUISHED | NONE" }
      - { name: coaching_status, type: enum, source: computed, description: "NONE | FLAGGED | ASSIGNED | COACHED" }

  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Member's full name" }
      - { name: email, type: string, source: input, description: "Unique contact email; the natural key used to reuse an existing member row" }
      - { name: home_area_code, type: string, source: input, description: "Area code of the member's mailing address" }
      - { name: member_since, type: datetime, source: system, description: "Timestamp the member row was created" }
      - { name: total_speeches_delivered, type: integer, source: computed, description: "Count of APPROVED completions across all of the member's paths where project_kind is SPEECH" }
      - { name: highest_level_completed, type: integer, source: computed, description: "Highest level for which the member holds an APPROVED completion, 0 when none" }

  - name: Membership
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the person holding this membership" }
      - { name: club_id, type: string, source: input, description: "FK -> Club.id; the club this membership belongs to" }
      - { name: status, type: enum, source: system, description: "PENDING | ACTIVE | LAPSED" }
      - { name: dues_status, type: enum, source: system, description: "ISSUED | PAID | OVERDUE | VOID; independent dimension from status, ISSUED from enrollment onward" }
      - { name: join_date, type: datetime, source: input, description: "Date the member joined this club; drives mid-cycle proration" }
      - { name: first_time_member, type: boolean, source: input, description: "True when the member has never paid dues at any club; controls the new-member fee" }
      - { name: dues_paid_through_cycle, type: integer, source: system, description: "Highest cycle index fully paid, -1 when no dues have ever been paid" }
      - { name: consecutive_cycles_paid, type: integer, source: computed, description: "Number of consecutive cycle indexes paid ending at dues_paid_through_cycle" }
      - { name: quoted_total_cents, type: integer, source: computed, description: "Total produced by the most recent dues quote, null before the first quote" }
      - { name: officer_role, type: enum, source: computed, description: "NONE | PRESIDENT | VP_EDUCATION | VP_MEMBERSHIP | VP_PUBLIC_RELATIONS | SECRETARY | TREASURER | SERGEANT_AT_ARMS; derived from the current ELECTED or TRAINED officer term at this club" }
      - { name: speeches_delivered_this_cycle, type: integer, source: computed, description: "Count of APPROVED SPEECH completions the member logged at this club in the current cycle" }
      - { name: roles_completed_this_cycle, type: integer, source: computed, description: "Count of role assignments in status COMPLETED for this member in the current cycle" }

  - name: EducationPath
    parent: null
    common_fields: true
    fields:
      - { name: membership_id, type: string, source: input, description: "FK -> Membership.id; the membership whose member is enrolled in this path" }
      - { name: path_code, type: enum, source: input, description: "DYNAMIC_LEADERSHIP | ENGAGING_HUMOR | PERSUASIVE_INFLUENCE | PRESENTATION_MASTERY | TEAM_COLLABORATION | VISIONARY_COMMUNICATION" }
      - { name: level, type: enum, source: system, description: "LEVEL_1 | LEVEL_2 | LEVEL_3 | LEVEL_4 | LEVEL_5 | COMPLETED" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED; independent dimension from level" }
      - { name: approved_speeches_at_level, type: integer, source: computed, description: "Count of APPROVED completions on this path whose level equals the current level and project_kind is SPEECH" }
      - { name: approved_projects_at_level, type: integer, source: computed, description: "Count of APPROVED completions on this path whose level equals the current level" }
      - { name: level_started_at, type: datetime, source: system, description: "Timestamp the current level was entered" }
      - { name: last_advanced_at, type: datetime, source: system, description: "Timestamp of the most recent level advance, null before the first advance" }

  - name: ProjectCompletion
    parent: null
    common_fields: true
    fields:
      - { name: path_id, type: string, source: input, description: "FK -> EducationPath.id; the path this project counts toward" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; copied from the path's membership at creation" }
      - { name: club_id, type: string, source: system, description: "FK -> Club.id; copied from the path's membership at creation" }
      - { name: project_code, type: string, source: input, description: "Pathways project identifier, e.g. L1-ICE-BREAKER or L2-ACTIVE-LISTENING" }
      - { name: project_kind, type: enum, source: input, description: "SPEECH | EVALUATION | LEADERSHIP" }
      - { name: level, type: integer, source: input, description: "Path level the project belongs to, 1 through 5" }
      - { name: speech_minutes, type: integer, source: input, description: "Delivered speech length in minutes, 0 for non-speech projects" }
      - { name: delivered_at, type: datetime, source: input, description: "Timestamp the project was delivered or completed" }
      - { name: evaluator_member_id, type: string, source: input, description: "FK -> Member.id; member who evaluates this project, null for self-evaluated leadership projects" }
      - { name: evaluation_summary, type: string, source: input, description: "Written evaluation text, null until the evaluator records it" }
      - { name: status, type: enum, source: system, description: "LOGGED | EVALUATED | APPROVED | RETURNED" }
      - { name: return_reason, type: string, source: input, description: "Reason supplied when a reviewer returns the completion, null otherwise" }
      - { name: counts_for_level_advancement, type: boolean, source: computed, description: "True when status is APPROVED and level equals the path's current level" }

  - name: MeetingEvent
    parent: null
    common_fields: true
    fields:
      - { name: club_id, type: string, source: input, description: "FK -> Club.id; the club holding this meeting" }
      - { name: scheduled_at, type: datetime, source: input, description: "Meeting start timestamp; anchors the meeting-overlap rule" }
      - { name: duration_minutes, type: integer, source: input, description: "Planned meeting length in minutes, default 90" }
      - { name: venue_name, type: string, source: input, description: "Room or venue for this meeting" }
      - { name: theme, type: string, source: input, description: "Optional meeting theme" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | HELD | CANCELLED" }
      - { name: attendance_count, type: integer, source: input, description: "Members present, supplied when the meeting is closed" }
      - { name: quorum_met, type: boolean, source: computed, description: "True when attendance_count >= 5 at close" }
      - { name: filled_role_slots, type: integer, source: computed, description: "Count of role assignments in status ASSIGNED, COMPLETED or NO_SHOW" }
      - { name: required_role_slots, type: integer, source: system, description: "Fixed at 7 when the meeting is created" }
      - { name: held_at, type: datetime, source: system, description: "Timestamp the meeting was closed as HELD, null otherwise" }

  - name: RoleAssignment
    parent: null
    common_fields: true
    fields:
      - { name: meeting_id, type: string, source: input, description: "FK -> MeetingEvent.id; the meeting the role is held at" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the member filling the role" }
      - { name: role_code, type: enum, source: input, description: "TOASTMASTER | TABLE_TOPICS_MASTER | SPEAKER | EVALUATOR | TIMER | AH_COUNTER | GRAMMARIAN | GENERAL_EVALUATOR" }
      - { name: role_class, type: enum, source: computed, description: "SPEECH for SPEAKER, FUNCTIONARY for every other role_code" }
      - { name: status, type: enum, source: system, description: "ASSIGNED | COMPLETED | NO_SHOW | RELEASED" }
      - { name: credit_awarded, type: boolean, source: computed, description: "True when status is COMPLETED and role_class is SPEECH" }
      - { name: released_reason, type: string, source: input, description: "Reason recorded when the assignment is released, null otherwise" }

  - name: OfficerTerm
    parent: null
    common_fields: true
    fields:
      - { name: club_id, type: string, source: input, description: "FK -> Club.id; the club holding the office" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the member nominated for the office" }
      - { name: office, type: enum, source: input, description: "PRESIDENT | VP_EDUCATION | VP_MEMBERSHIP | VP_PUBLIC_RELATIONS | SECRETARY | TREASURER | SERGEANT_AT_ARMS" }
      - { name: term_index, type: integer, source: system, description: "Snapshot of club.dues_cycle_index taken at nomination" }
      - { name: status, type: enum, source: system, description: "NOMINATED | ELECTED | TRAINED | COMPLETED | VACATED" }
      - { name: nominated_at, type: datetime, source: system, description: "Timestamp the nomination was recorded" }
      - { name: elected_at, type: datetime, source: system, description: "Timestamp the election was held, null before the election" }
      - { name: training_due_at, type: datetime, source: system, description: "elected_at plus 30 days, null before the election" }
      - { name: trained_at, type: datetime, source: system, description: "Timestamp training was recorded, null until trained" }

  - name: Contest
    parent: null
    common_fields: true
    fields:
      - { name: club_id, type: string, source: input, description: "FK -> Club.id; required when contest_level is CLUB, null for AREA, DIVISION and DISTRICT contests" }
      - { name: contest_level, type: enum, source: input, description: "CLUB | AREA | DIVISION | DISTRICT" }
      - { name: contest_type, type: enum, source: input, description: "INTERNATIONAL_SPEECH | TALL_TALES | EVALUATION | HUMOROUS" }
      - { name: district_number, type: string, source: input, description: "District running the contest" }
      - { name: division_code, type: string, source: input, description: "Division running the contest" }
      - { name: area_code, type: string, source: input, description: "Area running the contest, null for CLUB and DIVISION contests" }
      - { name: scheduled_at, type: datetime, source: input, description: "Contest start timestamp" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | IN_PROGRESS | COMPLETED" }
      - { name: entry_count, type: integer, source: computed, description: "Count of entries not in status DISQUALIFIED" }
      - { name: judged_entry_count, type: integer, source: computed, description: "Count of entries in status JUDGED, ADVANCED or ELIMINATED" }
      - { name: winner_entry_id, type: string, source: system, description: "Entry that placed first when the contest completed, null before completion" }
      - { name: completed_at, type: datetime, source: system, description: "Timestamp the contest completed, null otherwise" }

  - name: ContestEntry
    parent: null
    common_fields: true
    fields:
      - { name: contest_id, type: string, source: input, description: "FK -> Contest.id; the contest entered" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the competing member" }
      - { name: club_id, type: string, source: input, description: "FK -> Club.id; the club through which eligibility is claimed" }
      - { name: speech_title, type: string, source: input, description: "Title of the contest speech" }
      - { name: status, type: enum, source: system, description: "ENTERED | JUDGED | ADVANCED | ELIMINATED | DISQUALIFIED" }
      - { name: ballot_count, type: integer, source: computed, description: "Number of judge ballots recorded for this entry" }
      - { name: judge_score_total, type: integer, source: computed, description: "Sum of the total_score of every ballot recorded for this entry" }
      - { name: placement, type: integer, source: system, description: "Final rank assigned when the contest completes, null before completion" }

  - name: AreaVisit
    parent: null
    common_fields: true
    fields:
      - { name: club_id, type: string, source: input, description: "FK -> Club.id; the club visited" }
      - { name: director_member_id, type: string, source: input, description: "FK -> Member.id; the area director, division director or club coach making the visit" }
      - { name: visit_kind, type: enum, source: input, description: "AREA_DIRECTOR | DIVISION_DIRECTOR | CLUB_COACH" }
      - { name: scheduled_at, type: datetime, source: input, description: "Planned visit timestamp" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | MISSED" }
      - { name: completed_at, type: datetime, source: system, description: "Timestamp the visit was completed, null otherwise" }
      - { name: findings, type: string, source: input, description: "Director findings recorded when the visit completes" }

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: meeting-create-stale-club
    parent_entity: Club
    write_endpoint: "POST /toastmasters/meetings"
    occ_field: "expected_club_version"
    description: |
      Scheduling a meeting against a Club whose version has advanced since the
      client last observed it is rejected. A club may hold several meetings in
      a cycle (a second meeting at a different venue and time is legitimate), so
      the only thing standing between a stale client and a second meeting is the
      version it last observed on the club.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: completion-create-stale-path
    parent_entity: EducationPath
    write_endpoint: "POST /toastmasters/project-completions"
    occ_field: "expected_education_path_version"
    description: |
      Logging a project completion against an EducationPath whose version has
      advanced since the client last observed it is rejected. A path carries
      many completions at the same level (each with a distinct project_code),
      so a second completion is legitimate on its own terms and is refused only
      because the client's view of the path is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: assignment-create-stale-meeting
    parent_entity: MeetingEvent
    write_endpoint: "POST /toastmasters/role-assignments"
    occ_field: "expected_meeting_version"
    description: |
      Adding a role assignment to a MeetingEvent whose version has advanced
      since the client last observed it is rejected. A meeting carries up to
      seven role slots, so a second assignment for a different member and role
      is legitimate and is refused only because the client's view of the
      meeting is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Club
    field: charter_status
    initial_state: ORGANIZING
    terminal_states: [REVOKED]
    transitions:
      - from: ORGANIZING
        to: CHARTERED
        trigger: "POST /toastmasters/clubs/{id}/charter"
        actor: WorldHeadquarters
        preconditions:
          - "organizing_meeting_at is set and organizing_meeting_attendees >= 3"
          - "paid_member_count >= 20"
          - "club_type is CORPORATE implies corporate_sponsor_name is set"
          - "sponsor_club_id is set implies the sponsor club has charter_status CHARTERED and good_standing GOOD"
        side_effects:
          - "charter_date = request timestamp"
          - "cycle_open_standing = good_standing"
          - "every membership of this club with status PENDING and dues_status PAID becomes ACTIVE"
          - "each newly ACTIVE membership's EducationPath rows for this club move status SUSPENDED to ACTIVE"
          - "recompute Club.paid_member_count, total_member_count, good_standing_score"
          - "increments Club.version by 1"

      - from: CHARTERED
        to: SUSPENDED
        trigger: "system (close-cycle when good_standing_score < 60)"
        actor: system
        preconditions:
          - "good_standing_score < 60 evaluated after the closing cycle's recomputation"
        side_effects:
          - "every membership of this club in status ACTIVE becomes LAPSED"
          - "each lapsed membership's EducationPath rows move status ACTIVE to SUSPENDED"
          - "each suspended path's ContestEntry rows whose club_id equals this club move to DISQUALIFIED"
          - "increments Club.version by 1"

      - from: SUSPENDED
        to: CHARTERED
        trigger: "POST /toastmasters/clubs/{id}/charter"
        actor: WorldHeadquarters
        preconditions:
          - "paid_member_count >= 20"
          - "good_standing_score >= 60"
        side_effects:
          - "charter_date = request timestamp"
          - "cycle_open_standing = good_standing"
          - "every membership of this club in status LAPSED becomes ACTIVE"
          - "each reactivated membership's EducationPath rows move status SUSPENDED to ACTIVE"
          - "recompute Club counters and good_standing_score"
          - "increments Club.version by 1"

      - from: [CHARTERED, SUSPENDED]
        to: REVOKED
        trigger: "system (close-cycle when good_standing_score < 40)"
        actor: system
        preconditions:
          - "good_standing_score < 40 evaluated after the closing cycle's recomputation"
        side_effects:
          - "every membership of this club moves to LAPSED"
          - "every OfficerTerm of this club in status NOMINATED, ELECTED or TRAINED becomes VACATED"
          - "increments Club.version by 1"

  - entity: Club
    field: good_standing
    initial_state: GOOD
    terminal_states: []
    note: "Posture dimension; re-derived from good_standing_score only by close-cycle and at charter grant, never set directly and never flipped by an in-cycle mutation"
    transitions:
      - from: GOOD
        to: PROBATION
        trigger: "system (close-cycle evaluates good_standing_score to a value in 60..79)"
        actor: system
        preconditions: ["60 <= good_standing_score <= 79"]
        side_effects:
          - "blocks POST /toastmasters/clubs/{id}/charter for clubs whose sponsor_club_id points at this club"
          - "increments Club.version by 1"

      - from: PROBATION
        to: GOOD
        trigger: "system (close-cycle evaluates good_standing_score to a value >= 80)"
        actor: system
        preconditions: ["good_standing_score >= 80"]
        side_effects: ["increments Club.version by 1"]

      - from: PROBATION
        to: NOT_IN_GOOD_STANDING
        trigger: "system (close-cycle evaluates good_standing_score to a value < 60)"
        actor: system
        preconditions: ["good_standing_score < 60"]
        side_effects:
          - "each ContestEntry whose club_id equals this club moves to DISQUALIFIED"
          - "Club.coaching_status becomes FLAGGED when it was NONE"
          - "increments Club.version by 1"

      - from: NOT_IN_GOOD_STANDING
        to: PROBATION
        trigger: "system (close-cycle evaluates good_standing_score to a value in 60..79)"
        actor: system
        preconditions: ["60 <= good_standing_score <= 79"]
        side_effects: ["increments Club.version by 1"]

      - from: NOT_IN_GOOD_STANDING
        to: GOOD
        trigger: "system (close-cycle evaluates good_standing_score to a value >= 80)"
        actor: system
        preconditions: ["good_standing_score >= 80"]
        side_effects:
          - "Club.coaching_status becomes COACHED when an AreaVisit of kind CLUB_COACH for this club is COMPLETED"
          - "increments Club.version by 1"

  - entity: Membership
    field: status
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /toastmasters/memberships/{id}/renew"
        actor: "Member or ClubOfficer"
        preconditions:
          - "the club's charter_status is CHARTERED or the membership is paying the cycle the club is currently organizing under"
          - "dues_status is ISSUED or OVERDUE"
        side_effects:
          - "dues_status becomes PAID"
          - "dues_paid_through_cycle = club.dues_cycle_index"
          - "recompute Club.paid_member_count and Club.new_member_count_this_cycle"
          - "recompute Club.good_standing_score"
          - "increments Membership.version by 1"

      - from: ACTIVE
        to: LAPSED
        trigger: "system (close-cycle when dues_paid_through_cycle < the cycle being closed)"
        actor: system
        preconditions:
          - "dues_paid_through_cycle < club.dues_cycle_index before the cycle index increments"
        side_effects:
          - "dues_status becomes OVERDUE"
          - "each EducationPath of this membership moves status ACTIVE to SUSPENDED"
          - "each suspended path's ContestEntry rows move to DISQUALIFIED"
          - "each OfficerTerm of this membership in status NOMINATED, ELECTED or TRAINED becomes VACATED"
          - "recompute Club.paid_member_count, good_standing_score"
          - "increments Membership.version by 1"

      - from: LAPSED
        to: ACTIVE
        trigger: "POST /toastmasters/memberships/{id}/renew"
        actor: "Member or ClubOfficer"
        preconditions:
          - "the quote is the reinstatement variant, so reinstatement_fee_cents is charged"
          - "dues_status is OVERDUE"
        side_effects:
          - "dues_status becomes PAID"
          - "dues_paid_through_cycle = club.dues_cycle_index"
          - "each EducationPath of this membership moves status SUSPENDED to ACTIVE"
          - "recompute Club.paid_member_count, good_standing_score"
          - "increments Membership.version by 1"

  - entity: Membership
    field: dues_status
    initial_state: ISSUED
    terminal_states: []
    note: "Independent dimension from Membership.status"
    transitions:
      - from: [PAID, VOID]
        to: ISSUED
        trigger: "system (close-cycle opens the next cycle and issues the next invoice)"
        actor: system
        preconditions:
          - "club.dues_cycle_index increments by 1 in the same operation"
          - "the membership status is PENDING or ACTIVE"
        side_effects:
          - "quoted_total_cents = dues_quote total for the new cycle"
          - "increments Membership.version by 1"

      - from: [ISSUED, OVERDUE]
        to: PAID
        trigger: "POST /toastmasters/memberships/{id}/renew"
        actor: "Member or ClubOfficer"
        preconditions: ["the membership's club is not REVOKED"]
        side_effects:
          - "dues_paid_through_cycle = club.dues_cycle_index"
          - "consecutive_cycles_paid increments by 1 when the previous dues_paid_through_cycle equals club.dues_cycle_index - 1, otherwise resets to 1"
          - "recompute Club.paid_member_count and Club.good_standing_score"
          - "increments Membership.version by 1"

      - from: ISSUED
        to: OVERDUE
        trigger: "system (close-cycle with the invoice still unpaid)"
        actor: system
        preconditions: ["dues_paid_through_cycle < club.dues_cycle_index before the increment"]
        side_effects:
          - "late_fee_cents = 500 is added to the next quote for this membership"
          - "increments Membership.version by 1"

      - from: PAID
        to: VOID
        trigger: "POST /toastmasters/memberships/{id}/refund-dues"
        actor: ClubOfficer
        preconditions: ["dues_status is PAID"]
        side_effects:
          - "dues_paid_through_cycle reverts to the value it held before the refunded payment"
          - "consecutive_cycles_paid reverts to the value it held before the refunded payment"
          - "recompute Club.paid_member_count and Club.good_standing_score"
          - "increments Membership.version by 1"

  - entity: EducationPath
    field: level
    initial_state: LEVEL_1
    terminal_states: [COMPLETED]
    transitions:
      - from: LEVEL_1
        to: LEVEL_2
        trigger: "POST /toastmasters/education-paths/{id}/advance-level"
        actor: Member
        preconditions:
          - "approved_speeches_at_level >= 2 and approved_projects_at_level >= 2"
          - "path status is ACTIVE"
          - "the membership status is ACTIVE and dues_paid_through_cycle >= club.dues_cycle_index"
          - "expected_education_path_version equals EducationPath.version"
        side_effects:
          - "level_started_at = request timestamp, last_advanced_at = request timestamp"
          - "recompute Club.approved_level_completions_this_cycle and Club.dcp_recognition_points"
          - "increments EducationPath.version by 1"

      - from: LEVEL_2
        to: LEVEL_3
        trigger: "POST /toastmasters/education-paths/{id}/advance-level"
        actor: Member
        preconditions:
          - "approved_speeches_at_level >= 1 and approved_projects_at_level >= 2"
          - "path status is ACTIVE"
          - "the membership status is ACTIVE and dues_paid_through_cycle >= club.dues_cycle_index"
          - "expected_education_path_version equals EducationPath.version"
        side_effects:
          - "level_started_at = request timestamp, last_advanced_at = request timestamp"
          - "recompute Club.approved_level_completions_this_cycle and Club.dcp_recognition_points"
          - "increments EducationPath.version by 1"

      - from: LEVEL_3
        to: LEVEL_4
        trigger: "POST /toastmasters/education-paths/{id}/advance-level"
        actor: Member
        preconditions:
          - "approved_speeches_at_level >= 1 and approved_projects_at_level >= 2"
          - "path status is ACTIVE"
          - "the membership status is ACTIVE and dues_paid_through_cycle >= club.dues_cycle_index"
          - "expected_education_path_version equals EducationPath.version"
        side_effects:
          - "level_started_at = request timestamp, last_advanced_at = request timestamp"
          - "recompute Club.approved_level_completions_this_cycle and Club.dcp_recognition_points"
          - "increments EducationPath.version by 1"

      - from: LEVEL_4
        to: LEVEL_5
        trigger: "POST /toastmasters/education-paths/{id}/advance-level"
        actor: Member
        preconditions:
          - "approved_speeches_at_level >= 1 and approved_projects_at_level >= 1"
          - "path status is ACTIVE"
          - "the membership status is ACTIVE and dues_paid_through_cycle >= club.dues_cycle_index"
          - "expected_education_path_version equals EducationPath.version"
        side_effects:
          - "level_started_at = request timestamp, last_advanced_at = request timestamp"
          - "recompute Club.approved_level_completions_this_cycle and Club.dcp_recognition_points"
          - "increments EducationPath.version by 1"

      - from: LEVEL_5
        to: COMPLETED
        trigger: "POST /toastmasters/education-paths/{id}/advance-level"
        actor: Member
        preconditions:
          - "approved_speeches_at_level >= 1 and approved_projects_at_level >= 1"
          - "path status is ACTIVE"
          - "the membership status is ACTIVE and dues_paid_through_cycle >= club.dues_cycle_index"
          - "expected_education_path_version equals EducationPath.version"
        side_effects:
          - "last_advanced_at = request timestamp"
          - "recompute Member.highest_level_completed and Club.dcp_recognition_points"
          - "increments EducationPath.version by 1"

      - from: LEVEL_2
        to: LEVEL_1
        trigger: "system (a supporting APPROVED ProjectCompletion at LEVEL_2 is returned)"
        actor: system
        preconditions:
          - "a ProjectCompletion on this path with level 2 moves APPROVED to RETURNED in the same operation"
        side_effects:
          - "level_started_at = request timestamp"
          - "recompute Club.approved_level_completions_this_cycle, Club.dcp_recognition_points, Club.good_standing_score"
          - "each ContestEntry whose member_id is this path's member and whose club_id is this path's club moves to DISQUALIFIED"
          - "increments EducationPath.version by 1"

      - from: LEVEL_3
        to: LEVEL_2
        trigger: "system (a supporting APPROVED ProjectCompletion at LEVEL_3 is returned)"
        actor: system
        preconditions:
          - "a ProjectCompletion on this path with level 3 moves APPROVED to RETURNED in the same operation"
        side_effects:
          - "level_started_at = request timestamp"
          - "recompute Club.approved_level_completions_this_cycle, Club.dcp_recognition_points, Club.good_standing_score"
          - "each ContestEntry whose member_id is this path's member and whose club_id is this path's club moves to DISQUALIFIED"
          - "increments EducationPath.version by 1"

      - from: LEVEL_4
        to: LEVEL_3
        trigger: "system (a supporting APPROVED ProjectCompletion at LEVEL_4 is returned)"
        actor: system
        preconditions:
          - "a ProjectCompletion on this path with level 4 moves APPROVED to RETURNED in the same operation"
        side_effects:
          - "level_started_at = request timestamp"
          - "recompute Club.approved_level_completions_this_cycle, Club.dcp_recognition_points, Club.good_standing_score"
          - "each ContestEntry whose member_id is this path's member and whose club_id is this path's club moves to DISQUALIFIED"
          - "increments EducationPath.version by 1"

      - from: LEVEL_5
        to: LEVEL_4
        trigger: "system (a supporting APPROVED ProjectCompletion at LEVEL_5 is returned)"
        actor: system
        preconditions:
          - "a ProjectCompletion on this path with level 5 moves APPROVED to RETURNED in the same operation"
        side_effects:
          - "level_started_at = request timestamp"
          - "recompute Club.approved_level_completions_this_cycle, Club.dcp_recognition_points, Club.good_standing_score"
          - "each ContestEntry whose member_id is this path's member and whose club_id is this path's club moves to DISQUALIFIED"
          - "increments EducationPath.version by 1"

  - entity: EducationPath
    field: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (the owning Membership moves to LAPSED)"
        actor: system
        preconditions: ["Membership.status becomes LAPSED"]
        side_effects:
          - "each ProjectCompletion on this path in status LOGGED or EVALUATED keeps its status but stops counting toward advancement"
          - "increments EducationPath.version by 1"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "system (the owning Membership moves to ACTIVE)"
        actor: system
        preconditions: ["Membership.status becomes ACTIVE"]
        side_effects: ["increments EducationPath.version by 1"]

  - entity: ProjectCompletion
    field: status
    initial_state: LOGGED
    terminal_states: [APPROVED]
    transitions:
      - from: LOGGED
        to: EVALUATED
        trigger: "POST /toastmasters/project-completions/{id}/evaluation"
        actor: Member
        preconditions:
          - "evaluator_member_id is set and equals the acting member"
          - "evaluation_summary is a non-empty string"
        side_effects:
          - "recompute EducationPath.approved_speeches_at_level and approved_projects_at_level"
          - "increments ProjectCompletion.version by 1"

      - from: RETURNED
        to: EVALUATED
        trigger: "POST /toastmasters/project-completions/{id}/evaluation"
        actor: Member
        preconditions:
          - "evaluator_member_id equals the acting member"
          - "evaluation_summary is a non-empty string"
        side_effects:
          - "return_reason is cleared"
          - "increments ProjectCompletion.version by 1"

      - from: EVALUATED
        to: APPROVED
        trigger: "POST /toastmasters/project-completions/{id}/review with decision APPROVE"
        actor: ClubOfficer
        preconditions:
          - "the acting officer's club_id equals this completion's club_id"
          - "project_kind is SPEECH implies evaluation_summary is set"
          - "the path's approved_speeches_at_level and approved_projects_at_level after approval are within the level's published maximum of 6"
        side_effects:
          - "counts_for_level_advancement becomes true when level equals the path's current level"
          - "recompute Member.total_speeches_delivered, Member.highest_level_completed, EducationPath.approved_speeches_at_level, EducationPath.approved_projects_at_level"
          - "recompute Club.approved_level_completions_this_cycle, Club.dcp_recognition_points, Club.good_standing_score"
          - "increments ProjectCompletion.version by 1"

      - from: EVALUATED
        to: RETURNED
        trigger: "POST /toastmasters/project-completions/{id}/review with decision RETURN"
        actor: ClubOfficer
        preconditions:
          - "the acting officer's club_id equals this completion's club_id"
          - "return_reason is a non-empty string"
        side_effects:
          - "recompute EducationPath.approved_speeches_at_level and approved_projects_at_level"
          - "increments ProjectCompletion.version by 1"

      - from: APPROVED
        to: RETURNED
        trigger: "POST /toastmasters/project-completions/{id}/review with decision RETURN"
        actor: ClubOfficer
        note: "Retroactive return; drives the education level revert cascade"
        preconditions:
          - "the acting officer's club_id equals this completion's club_id"
          - "return_reason is a non-empty string"
        side_effects:
          - "counts_for_level_advancement becomes false"
          - "the owning EducationPath level drops by one step when this completion's level equals the path's current level"
          - "recompute EducationPath.approved_speeches_at_level and approved_projects_at_level"
          - "recompute Member.total_speeches_delivered and Member.highest_level_completed"
          - "recompute Club.approved_level_completions_this_cycle, Club.dcp_recognition_points, Club.good_standing_score"
          - "each ContestEntry whose member_id equals this completion's member_id and whose club_id equals this completion's club_id moves to DISQUALIFIED"
          - "increments ProjectCompletion.version by 1"

  - entity: MeetingEvent
    field: status
    initial_state: SCHEDULED
    terminal_states: [HELD, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: HELD
        trigger: "POST /toastmasters/meetings/{id}/close with outcome HELD"
        actor: ClubOfficer
        preconditions:
          - "the acting officer's club_id equals this meeting's club_id"
          - "attendance_count >= 5"
        side_effects:
          - "quorum_met becomes true, held_at = request timestamp"
          - "each RoleAssignment of this meeting in status ASSIGNED whose member_id appears in attendee_member_ids becomes COMPLETED"
          - "each RoleAssignment of this meeting in status ASSIGNED whose member_id does not appear in attendee_member_ids becomes NO_SHOW"
          - "recompute Club.meetings_held_this_cycle, Club.good_standing_score"
          - "increments MeetingEvent.version by 1"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /toastmasters/meetings/{id}/close with outcome CANCELLED"
        actor: ClubOfficer
        preconditions:
          - "the acting officer's club_id equals this meeting's club_id"
        side_effects:
          - "each RoleAssignment of this meeting in status ASSIGNED becomes RELEASED"
          - "increments MeetingEvent.version by 1"

  - entity: RoleAssignment
    field: status
    initial_state: ASSIGNED
    terminal_states: [COMPLETED, NO_SHOW, RELEASED]
    transitions:
      - from: ASSIGNED
        to: COMPLETED
        trigger: "system (meeting closed as HELD with the member in attendee_member_ids)"
        actor: system
        preconditions: ["the member_id is listed in attendee_member_ids"]
        side_effects:
          - "credit_awarded becomes true when role_class is SPEECH"
          - "recompute Membership.roles_completed_this_cycle"
          - "increments RoleAssignment.version by 1"

      - from: ASSIGNED
        to: NO_SHOW
        trigger: "system (meeting closed as HELD without the member in attendee_member_ids)"
        actor: system
        preconditions: ["the member_id is absent from attendee_member_ids"]
        side_effects:
          - "recompute Club.good_standing_score"
          - "increments RoleAssignment.version by 1"

      - from: ASSIGNED
        to: RELEASED
        trigger: "POST /toastmasters/role-assignments/{id}/release or system (meeting closed as CANCELLED)"
        actor: "ClubOfficer or system"
        preconditions:
          - "the meeting status is SCHEDULED"
          - "the acting officer's club_id equals the meeting's club_id"
        side_effects:
          - "recompute MeetingEvent.filled_role_slots"
          - "increments RoleAssignment.version by 1"

  - entity: OfficerTerm
    field: status
    initial_state: NOMINATED
    terminal_states: [COMPLETED, VACATED]
    transitions:
      - from: NOMINATED
        to: ELECTED
        trigger: "POST /toastmasters/officer-terms/{id}/elect"
        actor: ClubOfficer
        preconditions:
          - "the acting officer's club_id equals this term's club_id"
          - "the member holds a Membership at this club with status ACTIVE and dues_paid_through_cycle >= club.dues_cycle_index"
          - "the club has at least one MeetingEvent in status HELD with quorum_met true whose held_at is after this term's nominated_at"
          - "no other OfficerTerm for the same club and term_index is in status ELECTED or TRAINED for the same office"
          - "the member holds no other OfficerTerm for the same club and term_index in status ELECTED or TRAINED"
        side_effects:
          - "elected_at = request timestamp, training_due_at = elected_at + 30 days"
          - "recompute Membership.officer_role for the elected member"
          - "increments OfficerTerm.version by 1"

      - from: ELECTED
        to: TRAINED
        trigger: "POST /toastmasters/officer-terms/{id}/training"
        actor: DistrictDirector
        preconditions:
          - "the acting director's member id differs from this term's member_id"
          - "the club's good_standing is GOOD or PROBATION"
        side_effects:
          - "trained_at = request timestamp"
          - "recompute Club.officer_trained_count, Club.dcp_recognition_points, Club.good_standing_score"
          - "increments OfficerTerm.version by 1"

      - from: ELECTED
        to: VACATED
        trigger: "system (the member's Membership at this club becomes LAPSED)"
        actor: system
        preconditions: ["Membership.status becomes LAPSED"]
        side_effects:
          - "Membership.officer_role for the member becomes NONE"
          - "recompute Club.officer_trained_count and Club.good_standing_score"
          - "increments OfficerTerm.version by 1"

      - from: [ELECTED, TRAINED]
        to: COMPLETED
        trigger: "system (close-cycle advances the club past this term's term_index)"
        actor: system
        preconditions: ["club.dues_cycle_index increments past this term's term_index"]
        side_effects:
          - "Membership.officer_role for the member becomes NONE"
          - "increments OfficerTerm.version by 1"

  - entity: Contest
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "system (the first judge ballot is recorded on any entry)"
        actor: system
        preconditions: ["at least one ContestEntry of this contest is in status ENTERED"]
        side_effects:
          - "increments Contest.version by 1"

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /toastmasters/contests/{id}/complete"
        actor: DistrictDirector
        preconditions:
          - "at least one ContestEntry is in status JUDGED"
          - "every ContestEntry in status JUDGED has ballot_count >= 3"
        side_effects:
          - "entries in status JUDGED are ranked by judge_score_total descending with ties broken by ContestEntry.created_at ascending"
          - "the first-ranked entry becomes ADVANCED with placement 1 and sets winner_entry_id"
          - "every other JUDGED entry becomes ELIMINATED with its rank as placement"
          - "a ContestEntry is created at the next contest level when this contest's contest_level is CLUB and an AREA contest with the same contest_type, area_code and district_number exists in status SCHEDULED"
          - "completed_at = request timestamp"
          - "increments Contest.version by 1"

  - entity: ContestEntry
    field: status
    initial_state: ENTERED
    terminal_states: [ADVANCED, ELIMINATED, DISQUALIFIED]
    transitions:
      - from: ENTERED
        to: JUDGED
        trigger: "system (the third judge ballot is recorded)"
        actor: system
        preconditions: ["ballot_count reaches 3"]
        side_effects:
          - "Contest.status moves SCHEDULED to IN_PROGRESS when it is the first ballot of the contest"
          - "increments ContestEntry.version by 1"

      - from: JUDGED
        to: ADVANCED
        trigger: "system (contest completed with placement 1)"
        actor: system
        preconditions: ["placement == 1 after ranking"]
        side_effects:
          - "Contest.winner_entry_id = this entry id"
          - "recompute Club.contest_participation_count and Club.dcp_recognition_points"
          - "increments ContestEntry.version by 1"

      - from: JUDGED
        to: ELIMINATED
        trigger: "system (contest completed with placement > 1)"
        actor: system
        preconditions: ["placement > 1 after ranking"]
        side_effects:
          - "recompute Club.contest_participation_count and Club.dcp_recognition_points"
          - "increments ContestEntry.version by 1"

      - from: [ENTERED, JUDGED]
        to: DISQUALIFIED
        trigger: "system (eligibility lost: club leaves GOOD standing, membership lapses, or the supporting path level reverts)"
        actor: system
        preconditions:
          - "the entry's club good_standing is not GOOD, or the member's membership at that club is not ACTIVE, or the member's EducationPath level dropped"
        side_effects:
          - "recompute Contest.entry_count and Contest.judged_entry_count"
          - "increments ContestEntry.version by 1"

  - entity: AreaVisit
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, MISSED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /toastmasters/area-visits/{id}/complete"
        actor: DistrictDirector
        preconditions:
          - "the acting director's member id equals this visit's director_member_id"
          - "findings is a non-empty string"
        side_effects:
          - "completed_at = request timestamp"
          - "Club.coaching_status becomes COACHED when visit_kind is CLUB_COACH, otherwise becomes ASSIGNED when it was FLAGGED"
          - "increments AreaVisit.version by 1"

      - from: SCHEDULED
        to: MISSED
        trigger: "system (close-cycle with scheduled_at before cycle_closed_at)"
        actor: system
        preconditions:
          - "scheduled_at < the club's cycle_closed_at at the moment the cycle closes"
        side_effects:
          - "Club.coaching_status becomes FLAGGED when visit_kind is CLUB_COACH and the club good_standing is PROBATION or NOT_IN_GOOD_STANDING"
          - "increments AreaVisit.version by 1"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: dues_quote
    trigger: "POST /toastmasters/memberships/{id}/renew (quote is recomputed and returned), and close-cycle when the next invoice is issued"
    algorithm: tiered_pricing
    formula: |
      intl_line = 4500 * 1.075
      club_line = club.club_dues_cents * 1.075
      if membership.join_date >= club.cycle_opened_at + 91 days:
          intl_line = intl_line / 2
          club_line = club_line / 2
      new_member_line = 2000 if membership.first_time_member and membership.dues_paid_through_cycle == -1 else 0
      reinstatement_line = 1000 if membership.status == LAPSED else 0
      late_line = 0.05 * (intl_line + club_line + new_member_line + reinstatement_line) if membership.dues_status == OVERDUE else 0
      ROUNDING ORDER (pinned): intl_line, club_line, new_member_line, reinstatement_line and late_line are EACH rounded to the nearest cent with round_half_up BEFORE summing; the five rounded values are then summed and that sum is rounded to the nearest cent with round_half_up. Summing the raw lines and rounding once at the end is a different, incorrect result: for club_dues_cents 2999 the pinned order yields 10062 while sum-then-round yields 10061.
      total_cents = round_half_up(intl_line) + round_half_up(club_line) + round_half_up(new_member_line) + round_half_up(reinstatement_line) + round_half_up(late_line)
    input_set: "the membership named in the path, its club, and the club's current dues_cycle_index"
    constants:
      INTL_DUES_CENTS: 4500
      DISTRICT_LEVY_RATE: 0.075
      NEW_MEMBER_FEE_CENTS: 2000
      REINSTATEMENT_FEE_CENTS: 1000
      LATE_FEE_RATE: 0.05
      CYCLE_HALF_DAYS: 91
    precision: "2 decimal places, round_half_up per line then on the sum"
    variants:
      - name: renewal_quote
        when: "membership.status is PENDING or ACTIVE"
        difference: "reinstatement_line is 0"
      - name: reinstatement_quote
        when: "membership.status is LAPSED"
        difference: "reinstatement_line is 1000 AND new_member_line is forced to 0 even when first_time_member is true and dues_paid_through_cycle is -1"

  - name: club_good_standing_score
    trigger: "any mutation that changes paid_member_count, officer_trained_count, approved_level_completions_this_cycle, meetings_held_this_cycle or dcp_recognition_points, and close-cycle"
    algorithm: weighted_scoring
    formula: |
      dues_points = min(30, (30 * paid_member_count) // 20)
      officer_points = min(25, (25 * officer_trained_count) // 4)
      education_points_component = min(20, (20 * approved_level_completions_this_cycle) // 4)
      meeting_points = min(15, (15 * meetings_held_this_cycle) // 6)
      dcp_points = min(10, (10 * dcp_recognition_points) // 5)
      good_standing_score = dues_points + officer_points + education_points_component + meeting_points + dcp_points
      good_standing = GOOD when good_standing_score >= 80, PROBATION when 60 <= good_standing_score <= 79, NOT_IN_GOOD_STANDING when good_standing_score < 60
      EVALUATION ORDER (pinned): dcp_recognition_points is evaluated FIRST, using the cycle_open_standing snapshot taken when the cycle opened. good_standing_score is evaluated SECOND from those points. The score computed here never feeds back into the same cycle's dcp_recognition_points.
    input_set: "one club; counts include only rows with created_at <= cycle_closed_at when the caller is close-cycle, and every current row otherwise"
    constants:
      WEIGHT_DUES: 30
      WEIGHT_OFFICER: 25
      WEIGHT_EDUCATION: 20
      WEIGHT_MEETING: 15
      WEIGHT_DCP: 10
      REQUIRED_MEMBER_COUNT: 20
      OFFICER_TRAINED_TARGET: 4
      EDUCATION_TARGET: 4
      MEETINGS_TARGET: 6
      DCP_TARGET: 5
      GOOD_MIN: 80
      PROBATION_MIN: 60
      REVOKE_BELOW: 40
    precision: "integer 0..100; each component uses floor division before the integer sum"
    variants:
      - name: live_score
        when: "recomputed on any mutation inside an open cycle"
        difference: "counts include rows created during the open cycle"
      - name: cycle_close_score
        when: "recomputed by POST /toastmasters/clubs/{id}/close-cycle"
        difference: "counts include only rows created at or before cycle_closed_at, and the resulting good_standing is snapshotted into cycle_open_standing for the cycle that follows"

  - name: dcp_recognition_points
    trigger: "close-cycle, and any mutation that changes paid_member_count, new_member_count_this_cycle, officer_trained_count, approved_level_completions_this_cycle or contest_participation_count"
    algorithm: aggregation
    formula: |
      education_points = min(6, sum over memberships in status ACTIVE of min(2, approved_completions_this_cycle(membership)))
      membership_points = min(1, floor(new_member_count_this_cycle / 4)) + min(1, floor(paid_member_count / 20))
      training_points = min(1, floor(officer_trained_count / 4))
      admin_points = (1 if officer_trained_count == 7 else 0) + (1 if contest_participation_count >= 1 else 0) + (1 if cycle_open_standing == GOOD else 0)
      dcp_recognition_points = min(10, education_points + membership_points + training_points + admin_points)
      dcp_tier = PRESIDENT_DISTINGUISHED when points >= 9, SELECT_DISTINGUISHED when 7 <= points <= 8, DISTINGUISHED when 5 <= points <= 6, NONE when points < 5
    input_set: "approved ProjectCompletion rows at this club in the current cycle, memberships, officer terms for the current term_index, and CLUB-level contest entries in the current cycle"
    constants:
      EDUCATION_POINT_CAP: 6
      MEMBER_POINT_CAP: 2
      TRAINING_POINT_CAP: 1
      ADMIN_POINT_CAP: 3
      TOTAL_POINT_CAP: 10
      PRESIDENT_TIER_MIN: 9
      SELECT_TIER_MIN: 7
      DISTINGUISHED_TIER_MIN: 5
    precision: "integer"
    variants:
      - name: live_points
        when: "recomputed on any mutation inside an open cycle"
        difference: "admin_points uses the current good_standing for the cycle-open bonus only through cycle_open_standing, never the live value"
      - name: cycle_close_points
        when: "recomputed by close-cycle"
        difference: "frozen for the closing cycle and reported on the club until the next close"

  - name: education_level_requirements
    trigger: "POST /toastmasters/education-paths/{id}/advance-level"
    algorithm: threshold
    formula: |
      required = LEVEL_REQUIREMENTS[path.level]
      LEVEL_REQUIREMENTS = { LEVEL_1: {speeches: 2, projects: 2}, LEVEL_2: {speeches: 1, projects: 2}, LEVEL_3: {speeches: 1, projects: 2}, LEVEL_4: {speeches: 1, projects: 1}, LEVEL_5: {speeches: 1, projects: 1} }
      approved_speeches_at_level = count of completions on this path with status APPROVED, level == path.level, project_kind == SPEECH
      approved_projects_at_level = count of completions on this path with status APPROVED and level == path.level
      eligible = approved_speeches_at_level >= required.speeches AND approved_projects_at_level >= required.projects AND path.status == ACTIVE AND membership.status == ACTIVE AND membership.dues_paid_through_cycle >= club.dues_cycle_index
    input_set: "one education path, its membership, its club, and that path's ProjectCompletion rows"
    constants:
      LEVEL_1_SPEECHES: 2
      LEVEL_1_PROJECTS: 2
      LEVEL_2_SPEECHES: 1
      LEVEL_2_PROJECTS: 2
      LEVEL_3_SPEECHES: 1
      LEVEL_3_PROJECTS: 2
      LEVEL_4_SPEECHES: 1
      LEVEL_4_PROJECTS: 1
      LEVEL_5_SPEECHES: 1
      LEVEL_5_PROJECTS: 1
      MAX_PROJECTS_PER_LEVEL: 6
    precision: "integer counts"

  - name: meeting_overlap_window
    trigger: "POST /toastmasters/meetings"
    algorithm: interval_merge
    formula: |
      For candidate meeting M at club C with duration M.duration_minutes:
        reject when any meeting E of club C with status in {SCHEDULED, HELD} satisfies the half-open intersection
          E.scheduled_at < M.scheduled_at + M.duration_minutes AND M.scheduled_at < E.scheduled_at + E.duration_minutes
        reject when E ends inside the buffer that precedes M, that is
          0 <= M.scheduled_at - (E.scheduled_at + E.duration_minutes) < 30
      The buffer is one-sided: a candidate starting exactly 30 minutes after E ends is accepted.
    input_set: "meetings of the same club in status SCHEDULED or HELD; CANCELLED meetings never occupy the window"
    constants:
      BUFFER_MINUTES: 30
    precision: "whole minutes"

  - name: speech_role_rotation_window
    trigger: "POST /toastmasters/role-assignments"
    algorithm: threshold
    formula: |
      For a candidate assignment A of role_class SPEECH for member P at meeting M:
        window_start = M.scheduled_at - 7 days, window_end = M.scheduled_at + 7 days
        prior = count of RoleAssignment rows R for member P with role_class SPEECH and status in {ASSIGNED, COMPLETED, NO_SHOW} whose meeting scheduled_at lies in [window_start, window_end]
        reject when prior >= 2
      RELEASED assignments never occupy the window.
    input_set: "role assignments of the same member across every club, joined to their meeting's scheduled_at"
    constants:
      WINDOW_DAYS: 7
      MAX_SPEECH_ROLES: 2
    precision: "whole days"

  - name: judge_ballot_total
    trigger: "POST /toastmasters/contest-entries/{id}/ballots"
    algorithm: weighted_scoring
    formula: |
      total_score = round_half_up(content_score*0.5 + delivery_score*0.3 + language_score*0.2)
      content_score, delivery_score and language_score must each lie in [0, 100]
    input_set: "one ballot"
    constants:
      CONTENT_WEIGHT: 0.5
      DELIVERY_WEIGHT: 0.3
      LANGUAGE_WEIGHT: 0.2
      SCORE_MIN: 0
      SCORE_MAX: 100
      BALLOTS_REQUIRED: 3
    precision: "integer 0..100, round_half_up"

  - name: contest_ranking
    trigger: "POST /toastmasters/contests/{id}/complete"
    algorithm: weighted_scoring
    formula: |
      candidates = ContestEntry rows of this contest in status JUDGED
      empty candidate set -> ERR_NO_JUDGED_ENTRIES
      ranking expression: judge_score_total descending
      tie-break: ContestEntry.created_at ascending
      rank 1 becomes ADVANCED with placement 1 and becomes Contest.winner_entry_id
      ranks 2..n become ELIMINATED with placement equal to the 1-based rank
    input_set: "contest entries in status JUDGED only; ENTERED entries that never reached three ballots are left untouched"
    constants:
      ADVANCING_PLACES: 1
    precision: "integer"

  - name: coaching_queue_priority
    trigger: "GET /toastmasters/clubs/coaching-queue"
    algorithm: topological
    formula: |
      candidates = clubs where good_standing in {PROBATION, NOT_IN_GOOD_STANDING} and coaching_status == NONE
      ranking expression: good_standing_score ascending, then paid_member_count ascending, then created_at ascending
      empty candidate set -> ERR_NO_COACHING_CANDIDATES
    input_set: "clubs in PROBATION or NOT_IN_GOOD_STANDING with coaching_status NONE"
    constants:
      QUEUE_LIMIT: 100
    precision: "integer"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of WorldHeadquarters, ClubOfficer, Member, DistrictDirector"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "the acting role is listed on the endpoint; entity_backed roles additionally satisfy the ownership clause (ClubOfficer: X-User-ID is a Membership of the target club; Member: X-User-ID equals the member_id on the resource; DistrictDirector: X-User-ID equals the director_member_id or holds the office named by the operation)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all mutating endpoints and all club-scoped reads"

  - priority: 3
    category: existence
    check: "the resource named by the path exists"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint whose path contains {id}"

  - priority: 4
    category: existence
    check: "every entity referenced by the payload exists, validated left to right in path order and then in body field order"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "POST /toastmasters/memberships, POST /toastmasters/education-paths, POST /toastmasters/project-completions, POST /toastmasters/meetings, POST /toastmasters/role-assignments, POST /toastmasters/officer-terms, POST /toastmasters/contests, POST /toastmasters/contest-entries, POST /toastmasters/area-visits, POST /toastmasters/clubs"

  - priority: 5
    category: state
    check: "expected_<parent>_version equals the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /toastmasters/meetings, POST /toastmasters/education-paths, POST /toastmasters/project-completions, POST /toastmasters/role-assignments"

  - priority: 6
    category: state
    check: "the target resource is in a status that admits the requested transition (refund-dues requires PAID; close requires SCHEDULED; evaluation requires LOGGED or RETURNED; review requires EVALUATED or APPROVED; release requires ASSIGNED; elect requires NOMINATED; training requires ELECTED; complete-visit requires SCHEDULED)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /toastmasters/memberships/{id}/renew, POST /toastmasters/memberships/{id}/refund-dues, POST /toastmasters/meetings/{id}/close, POST /toastmasters/project-completions/{id}/evaluation, POST /toastmasters/project-completions/{id}/review, POST /toastmasters/role-assignments/{id}/release, POST /toastmasters/officer-terms/{id}/elect, POST /toastmasters/officer-terms/{id}/training, POST /toastmasters/area-visits/{id}/complete"

  - priority: 7
    category: state
    check: "no conflicting resource of the same kind exists (one enrollment per membership and path_code in status ACTIVE or SUSPENDED; one ASSIGNED role assignment per meeting and member; one ballot per judge and entry; one ELECTED or TRAINED officer term per club, term_index and office; one ELECTED or TRAINED officer term per club, term_index and member)"
    error_id: ERR_DUPLICATE_PATH_ENROLLMENT, ERR_DUPLICATE_ASSIGNMENT, ERR_DUPLICATE_BALLOT, ERR_OFFICE_ALREADY_FILLED
    http_status: 409
    applies_to: "POST /toastmasters/education-paths, POST /toastmasters/role-assignments, POST /toastmasters/contest-entries/{id}/ballots, POST /toastmasters/officer-terms/{id}/elect"

  - priority: 8
    category: business_temporal
    check: "the candidate meeting interval neither intersects nor falls inside the 30-minute buffer of another SCHEDULED or HELD meeting at the same club"
    error_id: ERR_MEETING_OVERLAP
    http_status: 409
    applies_to: "POST /toastmasters/meetings"

  - priority: 9
    category: business_temporal
    check: "a SPEECH role assignment would not push the member above 2 SPEECH roles inside the rolling 7-day window anchored on the meeting's scheduled_at"
    error_id: ERR_ROLE_WINDOW_EXCEEDED
    http_status: 409
    applies_to: "POST /toastmasters/role-assignments"

  - priority: 10
    category: business_constraint
    check: "charter prerequisites: organizing_meeting_at is set with at least 3 attendees; paid_member_count is at least 20; club_type CORPORATE carries corporate_sponsor_name; a named sponsor club has charter_status CHARTERED and good_standing GOOD"
    error_id: ERR_ORGANIZING_MEETING_REQUIRED, ERR_CHARTER_MINIMUM_NOT_MET, ERR_CORPORATE_SPONSOR_REQUIRED, ERR_SPONSOR_NOT_IN_GOOD_STANDING
    http_status: 422
    applies_to: "POST /toastmasters/clubs/{id}/charter"

  - priority: 11
    category: business_constraint
    check: "the path is ACTIVE and its approved speech and project counts meet the published requirement table for its current level"
    error_id: ERR_LEVEL_REQUIREMENTS_NOT_MET
    http_status: 422
    applies_to: "POST /toastmasters/education-paths/{id}/advance-level"

  - priority: 12
    category: business_constraint
    check: "evaluator independence: evaluator_member_id differs from the completion's member_id; judge independence: judge_member_id is not a member of the entry's club and differs from the entry's member_id"
    error_id: ERR_EVALUATOR_CONFLICT, ERR_JUDGE_CONFLICT
    http_status: 422
    applies_to: "POST /toastmasters/project-completions, POST /toastmasters/contest-entries/{id}/ballots"

  - priority: 13
    category: business_constraint
    check: "contest protocol: entries are accepted only while the contest status is SCHEDULED; ballots are accepted only while the status is SCHEDULED or IN_PROGRESS; a contest completes only when every JUDGED entry carries at least 3 ballots; the meeting closes as HELD only with attendance_count >= 5"
    error_id: ERR_CONTEST_NOT_OPEN, ERR_QUORUM_NOT_MET
    http_status: 409
    applies_to: "POST /toastmasters/contest-entries, POST /toastmasters/contest-entries/{id}/ballots, POST /toastmasters/contests/{id}/complete, POST /toastmasters/meetings/{id}/close"

  - priority: 14
    category: business_constraint
    check: "role slot capacity: a meeting never holds more than 7 role assignments in status ASSIGNED, COMPLETED or NO_SHOW"
    error_id: ERR_ROLE_SLOTS_FULL
    http_status: 409
    applies_to: "POST /toastmasters/role-assignments"

  - priority: 15
    category: business_constraint
    check: "election protocol: the club has a HELD meeting with quorum_met true held after the nomination, and the nominee holds an ACTIVE membership paid through the current cycle"
    error_id: ERR_ELECTION_QUORUM_NOT_MET
    http_status: 422
    applies_to: "POST /toastmasters/officer-terms/{id}/elect"

  - priority: 16
    category: business_fiscal
    check: "dues payment admissibility: dues_status is ISSUED or OVERDUE (already paid or voided invoices are refused here, after the state check at priority 6) and the club charter_status is ORGANIZING or CHARTERED"
    error_id: ERR_DUES_ALREADY_PAID, ERR_CLUB_NOT_CHARTERED, ERR_CLUB_REVOKED
    http_status: 409
    applies_to: "POST /toastmasters/memberships/{id}/renew"

  - priority: 17
    category: business_fiscal
    check: "the club good_standing is GOOD for contest entry creation and for level advancement at that club"
    error_id: ERR_CLUB_NOT_IN_GOOD_STANDING
    http_status: 422
    applies_to: "POST /toastmasters/contest-entries, POST /toastmasters/education-paths/{id}/advance-level"

  - priority: 18
    category: business_fiscal
    check: "the membership is ACTIVE and its dues_paid_through_cycle is at least the club's dues_cycle_index"
    error_id: ERR_MEMBERSHIP_NOT_ACTIVE
    http_status: 422
    applies_to: "POST /toastmasters/education-paths, POST /toastmasters/project-completions, POST /toastmasters/role-assignments, POST /toastmasters/contest-entries"

  - priority: 19
    category: business_referential
    check: "the coaching queue is non-empty when the endpoint is asked for the next club to coach"
    error_id: ERR_NO_COACHING_CANDIDATES
    http_status: 404
    applies_to: "GET /toastmasters/clubs/coaching-queue"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

