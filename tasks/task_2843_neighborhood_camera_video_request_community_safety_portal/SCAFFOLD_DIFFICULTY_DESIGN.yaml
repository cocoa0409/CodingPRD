            - "${t3_state} == SOLICITING"
            - "ConsentSolicitation.${sol1_id}.status == WITHDRAWN"
            - "ConsentSolicitation.${sol1_id}.clip_count == 1"
            - "SharedClip.${clip1_id}.status == PURGED"
            - "SharedClip.${clip1_id}.purge_reason == OWNER_REVOCATION"
            - "${sweep_expired} == 1"
            - "${sweep_purged} == 0"
            - "${t4_total} == 3 and ${t4_pending} == 0 and ${t4_shared} == 0 and ${t4_declined} == 1 and ${t4_expired} == 1 and ${t4_withdrawn} == 1"
            - "${t4_rate} == 0"
            - "${t4_state} == EXHAUSTED"
            - "ConsentSolicitation.${sol3_id}.status == EXPIRED"
            - "ConsentSolicitation.${sol3_id}.decline_reason == null"
            - "at every one of the five observation points the sum pending_count + shared_count + declined_count + expired_count + withdrawn_count equals solicitation_count, which stays 3 throughout"

      - name: footage_seconds_conserved_across_owner_purge_then_retention_purge
        grounds:
          - entities.Resident.fields.lifetime_shared_footage_seconds
          - entities.Resident.fields.retained_footage_seconds
          - entities.Resident.fields.purged_footage_seconds
          - state_machines.SharedClip.status.RETAINED_to_PURGED
          - state_machines.ConsentSolicitation.status.SHARED_to_SHARED
          - endpoints[POST /neighborhood-safety/retention-sweeps]
          - calculations.clip_retention_expiry
        distinguishing_aspect: |
          A different conserved quantity type — a DURATION ledger in seconds rather than a count
          of rows — and it is conserved by moving seconds between two buckets while the lifetime
          total is frozen: lifetime_shared_footage_seconds == retained_footage_seconds +
          purged_footage_seconds must hold after every share and after every purge, and the
          lifetime figure must never decrease even though all the footage is eventually gone.
          The two purges are also deliberately of different kinds, which is what stops an
          implementation from folding them together: the owner-initiated purge of the first clip
          must NOT withdraw consent because a second clip survives, and the sweep's
          RETENTION_EXPIRED purge of that second clip must NOT withdraw consent either, so the
          solicitation stays SHARED with zero retained seconds — one bucket empty, the ledger
          still balanced.
        test_recipe:
          setup:
            - "Clock at 2026-08-12T00:00:00Z; agency ONBOARDED with min_device_threshold 3 and post_share_retention_days 30; officer with duty_role REQUESTER."
            - "Three residents R1, R2, R3 with one camera each at (0,10), (0,20), (0,30), retention_window_days 30, alert_radius_m 0; R1 starts with all three footage counters at 0."
            - "RequestArea (0,0) radius 500 over 2026-08-08T00:00:00Z..2026-08-08T06:00:00Z LOCKED with eligible_device_count 3; the VideoRequest is justified and SUBMITTED; R1's solicitation is sol1 with respond_deadline_utc 2026-08-15T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /neighborhood-safety/agencies"
              payload: { name: "Riverbend Police Department", jurisdiction_code: "RB-001", min_device_threshold: 3, max_open_requests: 3, period_request_quota: 20, post_share_retention_days: 30, justification_min_chars: 80 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { ag_id: "$.data.id" }
            - call: "POST /neighborhood-safety/agencies/${ag_id}/onboarding-review"
              payload: { decision: "APPROVE", reviewer_note: "MOU on file.", onboarding_agreement_version: "MOU-2026.3" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /neighborhood-safety/officers"
              payload: { agency_id: "${ag_id}", badge_number: "B-100", full_name: "Officer Vale", duty_role: "REQUESTER" }
              as: AgencyAdmin
              as_user_id: "${ag_id}"
              captures: { off_req_id: "$.data.id" }
            - call: "POST /neighborhood-safety/residents"
              payload: { display_name: "R1", email: "r1@example.test", home_x_m: 0, home_y_m: 10, alert_radius_m: 0, notification_budget_per_day: 6 }
              as: Anonymous
              captures: { r1_id: "$.data.id", r1_lifetime0: "$.data.lifetime_shared_footage_seconds", r1_retained0: "$.data.retained_footage_seconds", r1_purged0: "$.data.purged_footage_seconds" }
            - call: "POST /neighborhood-safety/residents"
              payload: { display_name: "R2", email: "r2@example.test", home_x_m: 0, home_y_m: 20, alert_radius_m: 0, notification_budget_per_day: 6 }
              as: Anonymous
              captures: { r2_id: "$.data.id" }
            - call: "POST /neighborhood-safety/residents"
              payload: { display_name: "R3", email: "r3@example.test", home_x_m: 0, home_y_m: 30, alert_radius_m: 0, notification_budget_per_day: 6 }
              as: Anonymous
              captures: { r3_id: "$.data.id" }
            - call: "POST /neighborhood-safety/devices"
              payload: { owner_resident_id: "${r1_id}", label: "D1", grid_x_m: 0, grid_y_m: 10, retention_window_days: 30 }
