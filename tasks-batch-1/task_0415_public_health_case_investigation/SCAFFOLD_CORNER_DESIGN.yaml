              payload: { program_id: "${prog}", case_id: "${ci}", to_jurisdiction_id: "${j2}", expected_case_version: "${ci_v}" }
              as: CaseInvestigator
              as_user_id: "${j1}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_INSUFFICIENT_PERMISSIONS"

      - name: intake_processor_can_run_elr_intake_shared_op
        claim_type: Operation Permitted
        grounds:
          - roles.IntakeProcessor.exclusive_operations
          - endpoints.POST_/surveillance/lab-results
        distinguishing_aspect: |
          Positive RBAC: IntakeProcessor (the only role that may run ELR intake) successfully
          posts a lab result (201) — confirms the exclusive op is granted to its owner.
        test_recipe:
          setup:
            - "Program P, condition COVID19, jurisdiction J1."
          setup_api_calls:
            - call: "POST /surveillance/programs"
              payload: { name: "State PH" }
              as: JurisdictionAdmin
              captures: { prog: $.data.id }
            - call: "POST /surveillance/jurisdictions"
              payload: { program_id: "${prog}", name: "County 1", fips_code: "06001" }
