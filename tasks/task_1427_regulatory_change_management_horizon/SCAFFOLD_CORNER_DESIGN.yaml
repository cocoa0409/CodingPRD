scaffold_corner_design:
- section: entities
  instances:
  - name: entity_change_create_defaults
    claim_type: creation
    grounds:
    - entities.RegulatoryChange
    - state_machines.RegulatoryChange
    distinguishing_aspect: 'Creating a RegulatoryChange with all required inputs returns
      201 with system defaults: status PENDING_TRIAGE, applicability UNDETERMINED,
      triage_round 0, version 1, server-minted id/created_at, created_by_user_id from
      the header.'
    test_recipe:
      setup:
      - Empty DB; clock at default 2026-08-01T00:00:00Z
      setup_api_calls: []
      trigger:
      - call: POST /compliance/regulatory-changes
        payload:
          citation: DFLT-1
          title: New rule
          summary: s
          feed_source: FED_REGISTER
          jurisdiction: US-FED
          regulator: CFPB
          published_at: '2026-07-15T00:00:00Z'
          effective_date: '2026-12-01T00:00:00Z'
          severity_hint: MEDIUM
        as: ComplianceOfficer
        as_user_id: officer-a
        captures:
          ch: $.data.id
          st: $.data.status
          app: $.data.applicability
          tr: $.data.triage_round
          ver: $.data.version
          cb: $.data.created_by_user_id
      assert:
      - status == PENDING_TRIAGE (initial state), applicability == UNDETERMINED, triage_round
        == 0
      - version == 1; id is a server-minted UUID; created_at == 2026-08-01T00:00:00Z
        (logical clock default)
      - created_by_user_id == officer-a; superseded_by_id == null; risk_tier == null
  - name: entity_change_missing_required_returns_400
    claim_type: required_fields
    grounds:
    - entities.RegulatoryChange.fields.citation
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: Omitting the required input citation yields ERR_INVALID_REQUEST
      (400); no row is created.
    test_recipe:
      setup:
      - Empty DB
      setup_api_calls: []
      trigger:
      - call: POST /compliance/regulatory-changes
        payload:
          title: No citation
          summary: s
          feed_source: MANUAL_ENTRY
          jurisdiction: US-FED
          regulator: OCC
          published_at: '2026-07-01T00:00:00Z'
          effective_date: '2026-12-01T00:00:00Z'
          severity_hint: LOW
        as: ComplianceOfficer
        as_user_id: officer-a
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_INVALID_REQUEST, http 400
      - GET /compliance/regulatory-changes returns total_count == 0
  - name: entity_change_invalid_feed_source_rejected
    claim_type: type_constraints
    grounds:
    - entities.RegulatoryChange.fields.feed_source
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: An enum value outside {FED_REGISTER, STATE_BULLETIN, INT_JOURNAL,
      MANUAL_ENTRY} is rejected with ERR_INVALID_REQUEST.
    test_recipe:
      setup:
      - Empty DB
      setup_api_calls: []
      trigger:
      - call: POST /compliance/regulatory-changes
        payload:
          citation: EN-1
          title: t
          summary: s
          feed_source: TWITTER
          jurisdiction: US-FED
          regulator: OCC
          published_at: '2026-07-01T00:00:00Z'
          effective_date: '2026-12-01T00:00:00Z'
          severity_hint: LOW
        as: ComplianceOfficer
        as_user_id: officer-a
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_INVALID_REQUEST, http 400
  - name: entity_change_smuggled_status_input_ignored
    claim_type: computed_fields
    grounds:
    - entities.RegulatoryChange.fields.status
    - entities.RegulatoryChange.fields.triage_round
    distinguishing_aspect: Client-supplied system fields (status, triage_round) in
      the create body are ignored; the server applies its own initial values.
    test_recipe:
      setup:
      - Empty DB
      setup_api_calls: []
      trigger:
      - call: POST /compliance/regulatory-changes
        payload:
          citation: SMG-1
          title: t
          summary: s
          feed_source: MANUAL_ENTRY
          jurisdiction: US-FED
          regulator: OCC
          published_at: '2026-07-01T00:00:00Z'
          effective_date: '2026-12-01T00:00:00Z'
          severity_hint: LOW
          status: CLOSED
          triage_round: 99
        as: ComplianceOfficer
        as_user_id: officer-a
        captures:
          st: $.data.status
          tr: $.data.triage_round
          ver: $.data.version
      assert:
      - status == PENDING_TRIAGE and triage_round == 0 and version == 1 despite smuggled
        values
  - name: entity_get_change_not_found
    claim_type: not_found
    grounds:
    - errors[ERR_NOT_FOUND]
    distinguishing_aspect: GET with a well-formed but unknown UUID returns ERR_NOT_FOUND
      (404).
    test_recipe:
      setup:
      - Empty DB
      setup_api_calls: []
      trigger:
      - call: GET /compliance/regulatory-changes/00000000-0000-4000-8000-000000000000
        payload: {}
        as: ComplianceOfficer
        as_user_id: officer-a
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_NOT_FOUND, http 404
  - name: entity_changes_list_pagination
    claim_type: listing
    grounds:
    - response_envelope
    distinguishing_aspect: 'List endpoint honors limit/offset with total_count and
      has_more: 3 rows, page 1 (limit 2) has_more true, page 2 (offset 2) has_more
      false.'
    test_recipe:
      setup:
      - Three regulatory changes exist
      setup_api_calls:
      - call: POST /compliance/regulatory-changes
        payload:
          citation: PG-1
          title: t1
          summary: s
          feed_source: MANUAL_ENTRY
          jurisdiction: US-FED
          regulator: OCC
          published_at: '2026-07-01T00:00:00Z'
          effective_date: '2026-12-01T00:00:00Z'
          severity_hint: LOW
        as: ComplianceOfficer
        as_user_id: officer-a
      - call: POST /compliance/regulatory-changes
        payload:
          citation: PG-2
          title: t2
          summary: s
          feed_source: MANUAL_ENTRY
          jurisdiction: US-FED
          regulator: OCC
          published_at: '2026-07-02T00:00:00Z'
          effective_date: '2026-12-01T00:00:00Z'
          severity_hint: LOW
        as: ComplianceOfficer
        as_user_id: officer-a
      - call: POST /compliance/regulatory-changes
        payload:
          citation: PG-3
          title: t3
          summary: s
          feed_source: MANUAL_ENTRY
          jurisdiction: US-FED
          regulator: OCC
          published_at: '2026-07-03T00:00:00Z'
          effective_date: '2026-12-01T00:00:00Z'
          severity_hint: LOW
        as: ComplianceOfficer
        as_user_id: officer-a
      trigger:
      - call: GET /compliance/regulatory-changes?limit=2&offset=0
        payload: {}
        as: ComplianceOfficer
        as_user_id: officer-a
      - call: GET /compliance/regulatory-changes?limit=2&offset=2
        payload: {}
        as: ComplianceOfficer
        as_user_id: officer-a
      assert:
      - 'Page 1: 2 items, total_count == 3, has_more == true'
      - 'Page 2 (offset 2): 1 item, total_count == 3, has_more == false'
  - name: entity_register_singleton_boot_defaults
    claim_type: defaults
    grounds:
    - entities.ObligationRegister.fields.current_version_number
    distinguishing_aspect: The obligation register singleton exists at boot with current_version_number
      0 and version 1 before any publish.
    test_recipe:
      setup:
      - Empty DB
      setup_api_calls: []
      trigger:
      - call: GET /compliance/obligation-register
        payload: {}
        as: ComplianceOfficer
        as_user_id: officer-a
        captures:
          cvn: $.data.current_version_number
          ver: $.data.version
      assert:
      - current_version_number == 0 and version == 1 at boot
  - name: entity_register_version_immutable
    claim_type: immutability
    grounds:
    - entities.ObligationRegisterVersion
    distinguishing_aspect: 'ObligationRegisterVersion is common_fields: false — published
      snapshots carry id and created_at but no updated_at/version, and no mutation
      endpoint exists.'
    test_recipe:
      setup:
      - One ACTIVE obligation
      setup_api_calls:
      - call: POST /compliance/regulatory-changes
        payload:
          citation: IM-1
          title: t
          summary: s
          feed_source: MANUAL_ENTRY
          jurisdiction: US-FED
          regulator: OCC
          published_at: '2026-07-01T00:00:00Z'
          effective_date: '2026-12-01T00:00:00Z'
          severity_hint: LOW
        as: ComplianceOfficer
        as_user_id: officer-a
        captures:
          ch: $.data.id
      - call: POST /compliance/regulatory-changes/${ch}/triage
        payload:
          verdict: APPLICABLE
          rationale: r
        as: ComplianceOfficer
        as_user_id: officer-b
      - call: POST /compliance/obligations
        payload:
          obligation_code: OBL-IM-1
          title: Obl
          regulatory_change_id: ${ch}
          criticality: LOW
        as: ComplianceOfficer
        as_user_id: officer-a
        captures:
          ob: $.data.id
      - call: POST /compliance/obligations/${ob}/activate
        payload: {}
        as: ComplianceOfficer
        as_user_id: officer-a
      - call: GET /compliance/obligation-register
        payload: {}
        as: ComplianceOfficer
        as_user_id: officer-a
        captures:
          reg_v: $.data.version
      - call: POST /compliance/obligation-register/publish
        payload:
          expected_register_version: ${reg_v}
        as: ComplianceOfficer
        as_user_id: officer-a
      trigger:
      - call: GET /compliance/obligation-register-versions
        payload: {}
        as: ComplianceOfficer
        as_user_id: officer-a
      assert:
      - Single version with version_number == 1; fields limited to id, created_at,
        version_number, published_at, obligation_codes, obligation_count, register_checksum
        (no updated_at, no version)
      - published_at == 2026-08-01T00:00:00Z (logical clock)
  - name: entity_owner_computed_assessment_count
    claim_type: computed_fields
    grounds:
    - entities.BusinessOwner.fields.active_assessment_count
    distinguishing_aspect: 'active_assessment_count tracks live assignments: 1 after
      assignment, back to 0 after the assessment reaches terminal ACCEPTED.'
    test_recipe:
      setup:
      - Owner + TRIAGED_APPLICABLE change; assessment assigned, started, submitted
      setup_api_calls:
      - call: POST /compliance/business-owners
        payload:
          name: Rhea Patel
          department: OPS
          email: rhea@x.com
        as: ComplianceOfficer
        as_user_id: officer-a
        captures:
          bo: $.data.id
      - call: POST /compliance/regulatory-changes
        payload:
          citation: CC-1
          title: t
          summary: s
          feed_source: MANUAL_ENTRY
          jurisdiction: US-FED
          regulator: OCC
          published_at: '2026-07-01T00:00:00Z'
          effective_date: '2026-12-01T00:00:00Z'
          severity_hint: LOW
        as: ComplianceOfficer
        as_user_id: officer-a
        captures:
          ch: $.data.id
      - call: POST /compliance/regulatory-changes/${ch}/triage
        payload:
          verdict: APPLICABLE
          rationale: r
        as: ComplianceOfficer
        as_user_id: officer-b
        captures:
          ch_v: $.data.version
      - call: POST /compliance/impact-assessments
        payload:
          regulatory_change_id: ${ch}
          business_owner_id: ${bo}
          due_date: '2026-08-10T00:00:00Z'
          expected_regulatory_change_version: ${ch_v}
        as: ComplianceOfficer
        as_user_id: officer-a
        captures:
          ia: $.data.id
      - call: POST /compliance/impact-assessments/${ia}/start
        payload: {}
        as: BusinessOwner
        as_user_id: ${bo}
      - call: POST /compliance/impact-assessments/${ia}/submit
        payload:
          likelihood_score: 2
          severity_score: 2
          affected_business_lines: 1
          findings_summary: f
        as: BusinessOwner
        as_user_id: ${bo}
      - call: GET /compliance/business-owners/${bo}
        payload: {}
        as: ComplianceOfficer
        as_user_id: officer-a
        captures:
          cnt1: $.data.active_assessment_count
      trigger:
      - call: POST /compliance/impact-assessments/${ia}/accept
        payload: {}
        as: ComplianceManager
        as_user_id: manager-1
      - call: GET /compliance/business-owners/${bo}
        payload: {}
        as: ComplianceOfficer
        as_user_id: officer-a
        captures:
          cnt2: $.data.active_assessment_count
      assert:
      - active_assessment_count == 1 while the assessment is SUBMITTED (non-terminal)
      - active_assessment_count == 0 after accept (terminal)
- section: state_machines
  instances:
  - name: sm_triage_from_triaged_applicable_rejected
    claim_type: invalid_transition
    grounds:
    - state_machines.RegulatoryChange.PENDING_TRIAGE_to_TRIAGED_APPLICABLE
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: Triage is only valid from PENDING_TRIAGE; a second triage
      on TRIAGED_APPLICABLE fails with ERR_INVALID_STATE and leaves triage_round at
      1.
    test_recipe:
      setup:
      - Change TRIAGED_APPLICABLE
      setup_api_calls:
      - call: POST /compliance/regulatory-changes
        payload:
          citation: SM-1
          title: t
          summary: s
          feed_source: MANUAL_ENTRY
          jurisdiction: US-FED
          regulator: OCC
          published_at: '2026-07-01T00:00:00Z'
          effective_date: '2026-12-01T00:00:00Z'
          severity_hint: LOW
        as: ComplianceOfficer
        as_user_id: officer-a
        captures:
          ch: $.data.id
      - call: POST /compliance/regulatory-changes/${ch}/triage
        payload:
          verdict: APPLICABLE
          rationale: r
        as: ComplianceOfficer
        as_user_id: officer-b
      trigger:
      - call: POST /compliance/regulatory-changes/${ch}/triage
        payload:
          verdict: NOT_APPLICABLE
          rationale: changed mind
        as: ComplianceOfficer
        as_user_id: officer-b
        captures:
          err: $.data.error_id
      - call: GET /compliance/regulatory-changes/${ch}
        payload: {}
        as: ComplianceOfficer
        as_user_id: officer-a
        captures:
          tr: $.data.triage_round
          st: $.data.status
      assert:
      - error_id == ERR_INVALID_STATE (409)
      - status remains TRIAGED_APPLICABLE; triage_round == 1
  - name: sm_assessment_submit_before_start_rejected
    claim_type: invalid_transition
    grounds:
    - state_machines.ImpactAssessment.IN_PROGRESS_to_SUBMITTED
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: Submit requires IN_PROGRESS; submitting a fresh ASSIGNED
      assessment fails with ERR_INVALID_STATE and stores no scoring fields.
    test_recipe:
      setup:
      - Assessment ASSIGNED to owner
      setup_api_calls:
      - call: POST /compliance/business-owners
        payload:
          name: Rhea Patel
          department: OPS
          email: rhea@x.com
        as: ComplianceOfficer
        as_user_id: officer-a
        captures:
          bo: $.data.id
      - call: POST /compliance/regulatory-changes
        payload:
          citation: SM-2
          title: t
          summary: s
          feed_source: MANUAL_ENTRY
          jurisdiction: US-FED
          regulator: OCC
          published_at: '2026-07-01T00:00:00Z'
          effective_date: '2026-12-01T00:00:00Z'
          severity_hint: LOW
        as: ComplianceOfficer
        as_user_id: officer-a
        captures:
          ch: $.data.id
      - call: POST /compliance/regulatory-changes/${ch}/triage
        payload:
          verdict: APPLICABLE
          rationale: r
        as: ComplianceOfficer
        as_user_id: officer-b
        captures:
          ch_v: $.data.version
      - call: POST /compliance/impact-assessments
        payload:
          regulatory_change_id: ${ch}
          business_owner_id: ${bo}
          due_date: '2026-08-10T00:00:00Z'
          expected_regulatory_change_version: ${ch_v}
        as: ComplianceOfficer
        as_user_id: officer-a
        captures:
          ia: $.data.id
      trigger:
      - call: POST /compliance/impact-assessments/${ia}/submit
        payload:
          likelihood_score: 2
          severity_score: 2
          affected_business_lines: 1
          findings_summary: f
        as: BusinessOwner
        as_user_id: ${bo}
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_INVALID_STATE (409); assessment remains ASSIGNED with impact_rating_raw
        == null
  - name: sm_superseded_terminal_lockdown
    claim_type: terminal_lockdown
    grounds:
    - state_machines.RegulatoryChange.PENDING_TRIAGE_to_SUPERSEDED
    distinguishing_aspect: A change superseded by a newer revision reaches terminal
      SUPERSEDED; every further transition (triage, retriage) is rejected with ERR_INVALID_STATE.
    test_recipe:
      setup:
      - Change A PENDING_TRIAGE; change B created with supersedes_change_id = A
      setup_api_calls:
      - call: POST /compliance/regulatory-changes
        payload:
          citation: SM-3A
          title: old rev
          summary: s
          feed_source: FED_REGISTER
          jurisdiction: US-FED
          regulator: CFPB
          published_at: '2026-07-01T00:00:00Z'
          effective_date: '2026-12-01T00:00:00Z'
          severity_hint: LOW
        as: ComplianceOfficer
        as_user_id: officer-a
        captures:
          chA: $.data.id
      trigger:
      - call: POST /compliance/regulatory-changes
        payload:
          citation: SM-3B
          title: new rev
          summary: s
          feed_source: FED_REGISTER
          jurisdiction: US-FED
          regulator: CFPB
          published_at: '2026-07-20T00:00:00Z'
          effective_date: '2026-12-01T00:00:00Z'
          severity_hint: LOW
          supersedes_change_id: ${chA}
        as: ComplianceOfficer
        as_user_id: officer-a
        captures:
          chB: $.data.id
      - call: POST /compliance/regulatory-changes/${chA}/triage
        payload:
          verdict: APPLICABLE
          rationale: r
        as: ComplianceOfficer
        as_user_id: officer-b
        captures:
          err: $.data.error_id
      - call: GET /compliance/regulatory-changes/${chA}
        payload: {}
        as: ComplianceOfficer
        as_user_id: officer-a
        captures:
          stA: $.data.status
          sby: $.data.superseded_by_id
      assert:
      - Creating revision B succeeds and moves A to terminal SUPERSEDED with superseded_by_id
        == ${chB}
      - 'Triage on SUPERSEDED A fails: ERR_INVALID_STATE (409)'
  - name: sm_assessment_return_cycle_counts
    claim_type: valid_transition
    grounds:
    - state_machines.ImpactAssessment.SUBMITTED_to_RETURNED
    - state_machines.ImpactAssessment.RETURNED_to_IN_PROGRESS
    distinguishing_aspect: The revision loop SUBMITTED -> RETURNED -> IN_PROGRESS
      -> SUBMITTED works and return_count accumulates to 1.
    test_recipe:
      setup:
      - Assessment SUBMITTED
      setup_api_calls:
      - call: POST /compliance/business-owners
        payload:
          name: Rhea Patel
          department: OPS
          email: rhea@x.com
        as: ComplianceOfficer
        as_user_id: officer-a
        captures:
          bo: $.data.id
      - call: POST /compliance/regulatory-changes
        payload:
          citation: SM-4
          title: t
          summary: s
          feed_source: MANUAL_ENTRY
          jurisdiction: US-FED
          regulator: OCC
          published_at: '2026-07-01T00:00:00Z'
          effective_date: '2026-12-01T00:00:00Z'
          severity_hint: LOW
        as: ComplianceOfficer
        as_user_id: officer-a
        captures:
          ch: $.data.id
      - call: POST /compliance/regulatory-changes/${ch}/triage
        payload:
          verdict: APPLICABLE
          rationale: r
        as: ComplianceOfficer
        as_user_id: officer-b
        captures:
          ch_v: $.data.version
      - call: POST /compliance/impact-assessments
        payload:
          regulatory_change_id: ${ch}
          business_owner_id: ${bo}
          due_date: '2026-08-10T00:00:00Z'
          expected_regulatory_change_version: ${ch_v}
        as: ComplianceOfficer
        as_user_id: officer-a
        captures:
          ia: $.data.id
      - call: POST /compliance/impact-assessments/${ia}/start
        payload: {}
        as: BusinessOwner
        as_user_id: ${bo}
      - call: POST /compliance/impact-assessments/${ia}/submit
        payload:
          likelihood_score: 2
          severity_score: 2
          affected_business_lines: 1
          findings_summary: f
        as: BusinessOwner
        as_user_id: ${bo}
      trigger:
      - call: POST /compliance/impact-assessments/${ia}/return
        payload:
          comments: Expand scope analysis
        as: ComplianceManager
        as_user_id: manager-1
        captures:
          st1: $.data.status
          rc: $.data.return_count
      - call: POST /compliance/impact-assessments/${ia}/start
        payload: {}
        as: BusinessOwner
        as_user_id: ${bo}
        captures:
          st2: $.data.status
      - call: POST /compliance/impact-assessments/${ia}/submit
        payload:
          likelihood_score: 3
          severity_score: 2
          affected_business_lines: 1
          findings_summary: revised
        as: BusinessOwner
        as_user_id: ${bo}
        captures:
          st3: $.data.status
      assert:
      - 'Return: status == RETURNED, return_count == 1'
      - 'Re-start: status == IN_PROGRESS; re-submit: status == SUBMITTED with updated
        raw == 6.0'
  - name: sm_plan_reject_resubmit_cycle
    claim_type: valid_transition
    grounds:
    - state_machines.ImplementationPlan.SUBMITTED_to_REJECTED
    - state_machines.ImplementationPlan.REJECTED_to_SUBMITTED
    distinguishing_aspect: 'REJECTED is not terminal: the owner can resubmit a rejected
      plan (SUBMITTED -> REJECTED -> SUBMITTED).'
    test_recipe:
      setup:
      - Pipeline to CONFIRMED gap on a CRITICAL obligation; plan DRAFT
      setup_api_calls:
      - call: POST /compliance/business-owners
        payload:
          name: Rhea Patel
          department: OPS
          email: rhea@x.com
        as: ComplianceOfficer
        as_user_id: officer-a
        captures:
          bo: $.data.id
      - call: POST /compliance/regulatory-changes
        payload:
          citation: SM-5
          title: t
          summary: s
          feed_source: FED_REGISTER
          jurisdiction: US-FED
          regulator: CFPB
          published_at: '2026-07-15T00:00:00Z'
          effective_date: '2026-09-01T00:00:00Z'
          severity_hint: CRITICAL
        as: ComplianceOfficer
        as_user_id: officer-a
        captures:
          ch: $.data.id
      - call: POST /compliance/regulatory-changes/${ch}/triage
        payload:
          verdict: APPLICABLE
          rationale: r
        as: ComplianceOfficer
        as_user_id: officer-b
        captures:
          ch_v: $.data.version
      - call: POST /compliance/obligations
        payload:
          obligation_code: OBL-SM-5
          title: Obl
          regulatory_change_id: ${ch}
          criticality: CRITICAL
        as: ComplianceOfficer
        as_user_id: officer-a
        captures:
          ob: $.data.id
      - call: POST /compliance/obligations/${ob}/activate
        payload: {}
        as: ComplianceOfficer
        as_user_id: officer-a
      - call: POST /compliance/impact-assessments
        payload:
          regulatory_change_id: ${ch}
          business_owner_id: ${bo}
          due_date: '2026-08-10T00:00:00Z'
          expected_regulatory_change_version: ${ch_v}
        as: ComplianceOfficer
        as_user_id: officer-a
