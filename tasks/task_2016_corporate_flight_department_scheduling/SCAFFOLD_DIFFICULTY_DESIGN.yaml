  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check: different metrics, different endpoints
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: duty_limit_inclusive_equality_boundary
        grounds:
          - calculations.duty_time_check
          - validations[priority=7]
        distinguishing_aspect: |
          Duty-time boundary on a numeric metric: DUTY_LIMIT_MINUTES=840 with
          inclusive <=. A PIC with duty_minutes_used=600 + a 240-min leg (=
          840 exactly) is PERMITTED; 601 + 240 = 841 is REJECTED. Boundary
          sits on cumulative minutes via the assign-crew endpoint.
        test_recipe:
          setup:
            - "PIC has duty_minutes_used=600 already (prior 10-hour block assigned in current duty window)"
            - "New leg of 240 minutes (4h) needs PIC"
            - "First attempt: 240 min (boundary ==) → succeeds; reset, then 241 min → fails"
          setup_api_calls:
            - call: "POST /flight-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FlightDeptManager
            - call: "POST /flight-ops/business-units"
              payload: { bu_code: "BU-B1", name: "B1", annual_flight_budget_cents: 100000000 }
              as: FinanceAdmin
