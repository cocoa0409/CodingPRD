              captures: { ps_id: $.data.id }
            - call: "POST /reagent-lots"
              payload: { product_specification_id: "${ps_id}", lot_code: "CA-LOT-16", planned_units: 100 }
              as: ProductionOperator
              captures: { rl_id: $.data.id, rl_released_by: $.data.released_by_user_id }
            - call: "POST /complaints"
              payload: { reagent_lot_id: "${rl_id}", complaint_code: "CPL-CA-16A", narrative: "Control drift observed on two analysers." }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { cp_a: $.data.id, cp_a_status: $.data.status }
            - call: "POST /complaints"
              payload: { reagent_lot_id: "${rl_id}", complaint_code: "CPL-CA-16B", narrative: "Label print quality complaint." }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { cp_b: $.data.id }
            - call: "POST /complaints"
              payload: { reagent_lot_id: "${rl_id}", complaint_code: "CPL-CA-16C", narrative: "Carton damaged on arrival." }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { cp_c: $.data.id }
          trigger:
            - call: "POST /complaints/${cp_a}/triage"
              payload: { severity: "HIGH", malfunction_suspected: true }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { a_reportable: $.data.reportable }
            - call: "POST /complaints/${cp_a}/field-action"
              payload: { field_action: "CORRECTION", justification: "Customer advisory plus corrected insert." }
              as: QAReleaser
              as_user_id: "qa-01"
              captures: { a_action: $.data.field_action, a_status: $.data.status }
            - call: "POST /complaints/${cp_a}/close"
              payload: {}
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { err_report_pending: $.data.error_id }
            - call: "POST /complaints/${cp_a}/malfunction-report"
              payload: { report_ref: "MDR-CA-16A" }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { a_reported: $.data.reported_at }
            - call: "POST /complaints/${cp_a}/close"
              payload: {}
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { a_closed: $.data.status }
            - call: "POST /complaints/${cp_b}/triage"
              payload: { severity: "MEDIUM", malfunction_suspected: false }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { b_reportable: $.data.reportable }
            - call: "POST /complaints/${cp_b}/field-action"
              payload: { field_action: "REMOVAL", justification: "Requesting a full market withdrawal." }
              as: QAReleaser
              as_user_id: "qa-01"
              captures: { err_not_justified: $.data.error_id }
            - call: "POST /complaints/${cp_b}/field-action"
              payload: { field_action: "ADVISORY", justification: "Customer letter only." }
              as: QAReleaser
              as_user_id: "qa-01"
              captures: { b_action: $.data.field_action, b_status: $.data.status }
            - call: "POST /complaints/${cp_b}/close"
              payload: {}
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { b_closed: $.data.status }
            - call: "POST /complaints/${cp_c}/field-action"
              payload: { field_action: "ADVISORY", justification: "Skipping triage." }
