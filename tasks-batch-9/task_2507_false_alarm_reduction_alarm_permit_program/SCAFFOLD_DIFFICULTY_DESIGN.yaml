            - {call: "POST /false-alarm-program/fee-schedules/${sched_ref}/activate", payload: {}, as: ProgramAdministrator}
            - {call: "POST /false-alarm-program/alarm-companies", payload: {legal_name: "Ninety Day Monitoring", license_number: "AC-2507-ND", contact_email: "ops@ninetyday2507.example", contact_phone: "+15550108101", score_mode: "PERIOD_EQUAL"}, as: ProgramAdministrator, captures: {company_nd: $.data.id}}
            - {call: "POST /false-alarm-program/alarm-sites", payload: {address_key: "2507-ND-3-ARREARS-CIR", street_address: "3 Arrears Cir", city: "Fairview", zip_code: "44017", occupancy_class: "RESIDENTIAL", police_beat: "B09"}, as: PermitClerk, captures: {site_nd: $.data.id}}
            - {call: "POST /false-alarm-program/site-contacts", payload: {alarm_site_id: "${site_nd}", full_name: "Vera Loft", phone_number: "+15550108102", relationship: "OWNER", contact_priority: 1, is_ecv_callable: true}, as: PermitClerk, captures: {nc1: $.data.id}}
            - {call: "POST /false-alarm-program/site-contacts", payload: {alarm_site_id: "${site_nd}", full_name: "Wes Loft", phone_number: "+15550108103", relationship: "SPOUSE", contact_priority: 2, is_ecv_callable: true}, as: PermitClerk, captures: {nc2: $.data.id}}
            - {call: "POST /false-alarm-program/alarm-systems", payload: {alarm_site_id: "${site_nd}", monitoring_company_id: "${company_nd}", system_type: "BURGLARY", zone_count: 6, ecv_enabled: true, verified_response_mode: "NONE", installed_at: "2025-12-01T00:00:00Z"}, as: ProgramAdministrator, captures: {sys_nd: $.data.id}}
            - {call: "POST /false-alarm-program/alarm-systems/${sys_nd}/approve-registration", payload: {}, as: PermitClerk}
            - {call: "GET /false-alarm-program/penalty-invoices?alarm_site_id=${site_nd}&kind=PERMIT_ISSUE_FEE", payload: {}, as: BillingClerk, captures: {inv_nd: "$.data[0].id"}}
            - {call: "POST /false-alarm-program/_clock/set_current_utc", payload: {current_utc: "2026-02-01T00:00:00Z"}, as: ProgramAdministrator}
            - {call: "POST /false-alarm-program/_program-runs/nightly", payload: {}, as: ProgramAdministrator}
            - {call: "POST /false-alarm-program/_clock/set_current_utc", payload: {current_utc: "2026-03-05T00:00:00Z"}, as: ProgramAdministrator}
            - {call: "POST /false-alarm-program/_program-runs/nightly", payload: {}, as: ProgramAdministrator}
            - {call: "POST /false-alarm-program/_clock/set_current_utc", payload: {current_utc: "2026-04-30T00:00:00Z"}, as: ProgramAdministrator}
            - {call: "POST /false-alarm-program/_program-runs/nightly", payload: {}, as: ProgramAdministrator}
            - {call: "GET /false-alarm-program/penalty-invoices/${inv_nd}", payload: {}, as: BillingClerk}
          trigger:
            - {call: "POST /false-alarm-program/penalty-invoices/${inv_nd}/collections-referral", payload: {referral_agency: "Lakeside Recovery Partners"}, as: BillingClerk, captures: {err_ref: $.data.error_id}}
            - {call: "POST /false-alarm-program/_clock/set_current_utc", payload: {current_utc: "2026-05-01T00:00:00Z"}, as: ProgramAdministrator}
            - {call: "POST /false-alarm-program/_program-runs/nightly", payload: {}, as: ProgramAdministrator}
            - {call: "POST /false-alarm-program/penalty-invoices/${inv_nd}/collections-referral", payload: {referral_agency: "Lakeside Recovery Partners"}, as: BillingClerk}
            - {call: "GET /false-alarm-program/alarm-sites/${site_nd}", payload: {}, as: BillingClerk}
          assert:
            - "before the triggers: PenaltyInvoice.${inv_nd}.subtotal_cents == 21645, admin_fee_cents == 1082, late_penalty_cents == 2273, assessed_cents == 25000, outstanding_cents == 25000, collections_stage == 'FINAL_NOTICE', due_on == '2026-01-31T00:00:00Z'"
            - "at clock 2026-04-30 days_delinquent == 89, so the first referral returns HTTP 409 with error_id == 'ERR_REFERRAL_CRITERIA_NOT_MET' even though outstanding_cents already equals the 25000 threshold"
            - "PenaltyInvoice.${inv_nd}.collections_stage is still 'FINAL_NOTICE' and referred_on is null after the rejection"
            - "at clock 2026-05-01 days_delinquent == 90 exactly, so the second referral returns HTTP 200 and collections_stage == 'REFERRED' with referral_agency == 'Lakeside Recovery Partners'"
            - "PenaltyInvoice.${inv_nd}.referral_total_cents == 27000 (interim_total 25000 <= the 25000 LOW bound, so the flat 2000 fee is used, NOT 25000 * 0.08)"
            - "PenaltyInvoice.${inv_nd}.outstanding_cents == 25000 and AlarmSite.${site_nd}.outstanding_balance_cents == 25000 (the collections fee never enters the balance)"
            - "the late penalty is still 2273 in total - the three nightly runs must not add it twice"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: record_dispatch_of_a_sibling_system_request_is_gated_by_the_sites_suspension_order
        grounds:
          - state_machines.DispatchRequest.VALIDATED_to_DISPATCHED
          - state_machines.SuspensionOrder.PROPOSED_to_EFFECTIVE
          - calculations.site_response_posture
        distinguishing_aspect: >-
          A request that was legitimately VALIDATED on 2026-06-05 must be refused dispatch on
          2026-06-20 with 409 ERR_POLICE_RESPONSE_SUSPENDED purely because a SuspensionOrder created
          from a DIFFERENT system's incident became EFFECTIVE in between, and the same call succeeds the
          moment that order is vacated - the DispatchRequest row itself never changed.
        test_recipe:
          setup:
            - "One ACTIVE FeeSchedule with suspension_threshold_count 1, probation_threshold_count 4, free_alarm_allowance 0, single tier [1..null: 10000], invoice_due_days 3650."
            - "One RESIDENTIAL AlarmSite with two ACTIVE ECV-callable contacts and two PERMITTED systems."
            - "Request R on system B is submitted and validated on 2026-06-05 while the site is RESPONSE_ACTIVE, and is deliberately left in VALIDATED."
            - "System A's incident is determined COUNTED on 2026-06-06, which auto-proposes a SuspensionOrder for 2026-06-16 .. 2026-07-16; it is served on 2026-06-10 and the clock then moves to 2026-06-20, inside the interval."
          setup_api_calls:
            - {call: "POST /false-alarm-program/_clock/set_current_utc", payload: {current_utc: "2026-06-01T00:00:00Z"}, as: ProgramAdministrator}
            - call: "POST /false-alarm-program/fee-schedules"
              payload:
                <<: *fs_base
                schedule_code: "FS-2507-XSUSP"
                effective_from: "2026-06-01T00:00:00Z"
                free_alarm_allowance: 0
                probation_threshold_count: 4
                suspension_threshold_count: 1
                invoice_due_days: 3650
                fee_tiers:
                  - {from_index: 1, to_index: null, base_fee_cents: 10000}
              as: ProgramAdministrator
              captures: {sched_xs: $.data.id}
            - {call: "POST /false-alarm-program/fee-schedules/${sched_xs}/activate", payload: {}, as: ProgramAdministrator}
            - {call: "POST /false-alarm-program/alarm-companies", payload: {legal_name: "Sibling Systems Monitoring", license_number: "AC-2507-XS", contact_email: "ops@sibling2507.example", contact_phone: "+15550109101", score_mode: "PERIOD_EQUAL"}, as: ProgramAdministrator, captures: {company_xs: $.data.id}}
            - {call: "POST /false-alarm-program/alarm-sites", payload: {address_key: "2507-XS-51-PARALLEL-ST", street_address: "51 Parallel St", city: "Fairview", zip_code: "44018", occupancy_class: "RESIDENTIAL", police_beat: "B10"}, as: PermitClerk, captures: {site_xs: $.data.id}}
            - {call: "POST /false-alarm-program/site-contacts", payload: {alarm_site_id: "${site_xs}", full_name: "Owen Trask", phone_number: "+15550109102", relationship: "OWNER", contact_priority: 1, is_ecv_callable: true}, as: PermitClerk, captures: {xc1: $.data.id}}
            - {call: "POST /false-alarm-program/site-contacts", payload: {alarm_site_id: "${site_xs}", full_name: "Pia Trask", phone_number: "+15550109103", relationship: "SPOUSE", contact_priority: 2, is_ecv_callable: true}, as: PermitClerk, captures: {xc2: $.data.id}}
            - {call: "POST /false-alarm-program/alarm-systems", payload: {alarm_site_id: "${site_xs}", monitoring_company_id: "${company_xs}", system_type: "BURGLARY", zone_count: 6, ecv_enabled: true, verified_response_mode: "NONE", installed_at: "2026-04-01T00:00:00Z"}, as: ProgramAdministrator, captures: {sys_xa: $.data.id}}
            - {call: "POST /false-alarm-program/alarm-systems", payload: {alarm_site_id: "${site_xs}", monitoring_company_id: "${company_xs}", system_type: "BURGLARY", zone_count: 6, ecv_enabled: true, verified_response_mode: "NONE", installed_at: "2026-04-01T00:00:00Z"}, as: ProgramAdministrator, captures: {sys_xb: $.data.id}}
            - {call: "POST /false-alarm-program/alarm-systems/${sys_xa}/approve-registration", payload: {}, as: PermitClerk}
            - {call: "POST /false-alarm-program/alarm-systems/${sys_xb}/approve-registration", payload: {}, as: PermitClerk}
            - {call: "POST /false-alarm-program/_clock/set_current_utc", payload: {current_utc: "2026-06-05T00:00:00Z"}, as: ProgramAdministrator}
            - {call: "POST /false-alarm-program/dispatch-requests", payload: {alarm_system_id: "${sys_xb}", alarm_type: "BURGLARY", verification_method: "TWO_CALL_ECV", call_attempts: [{site_contact_id: "${xc1}", attempted_at: "2026-06-05T01:01:00Z", outcome: "NO_ANSWER"}, {site_contact_id: "${xc2}", attempted_at: "2026-06-05T01:03:00Z", outcome: "NO_ANSWER"}], audio_video_evidence: false, guard_on_scene: false, occurred_at: "2026-06-05T01:00:00Z", idempotency_key: "xs-2507-pending"}, as: AlarmCompanyOperator, as_user_id: "${company_xs}", captures: {dr_pending: $.data.id}}
            - {call: "POST /false-alarm-program/dispatch-requests/${dr_pending}/validate", payload: {}, as: PoliceDispatchSupervisor, as_user_id: "sup-2507"}
            - {call: "POST /false-alarm-program/_clock/set_current_utc", payload: {current_utc: "2026-06-06T00:00:00Z"}, as: ProgramAdministrator}
            - {call: "POST /false-alarm-program/dispatch-requests", payload: {alarm_system_id: "${sys_xa}", alarm_type: "BURGLARY", verification_method: "TWO_CALL_ECV", call_attempts: [{site_contact_id: "${xc1}", attempted_at: "2026-06-06T01:01:00Z", outcome: "NO_ANSWER"}, {site_contact_id: "${xc2}", attempted_at: "2026-06-06T01:03:00Z", outcome: "NO_ANSWER"}], audio_video_evidence: false, guard_on_scene: false, occurred_at: "2026-06-06T01:00:00Z", idempotency_key: "xs-2507-counted"}, as: AlarmCompanyOperator, as_user_id: "${company_xs}", captures: {dr_xa: $.data.id}}
            - {call: "POST /false-alarm-program/dispatch-requests/${dr_xa}/validate", payload: {}, as: PoliceDispatchSupervisor, as_user_id: "sup-2507"}
            - {call: "POST /false-alarm-program/dispatch-requests/${dr_xa}/record-dispatch", payload: {}, as: PoliceDispatchSupervisor, as_user_id: "sup-2507"}
            - {call: "POST /false-alarm-program/false-alarm-incidents", payload: {dispatch_request_id: "${dr_xa}", cause_code: "UNKNOWN"}, as: PoliceDispatchSupervisor, as_user_id: "sup-2507", captures: {inc_xa: $.data.id}}
            - {call: "POST /false-alarm-program/false-alarm-incidents/${inc_xa}/determination", payload: {determination: "COUNTED"}, as: FalseAlarmReviewOfficer, as_user_id: "rev-2507"}
            - {call: "GET /false-alarm-program/suspension-orders?alarm_site_id=${site_xs}&status=PROPOSED", payload: {}, as: ProgramAdministrator, captures: {order_xs: "$.data[0].id"}}
            - {call: "POST /false-alarm-program/_clock/set_current_utc", payload: {current_utc: "2026-06-10T00:00:00Z"}, as: ProgramAdministrator}
            - {call: "POST /false-alarm-program/suspension-orders/${order_xs}/serve", payload: {}, as: ProgramAdministrator}
            - {call: "POST /false-alarm-program/_clock/set_current_utc", payload: {current_utc: "2026-06-20T00:00:00Z"}, as: ProgramAdministrator}
          trigger:
            - {call: "POST /false-alarm-program/dispatch-requests/${dr_pending}/record-dispatch", payload: {}, as: PoliceDispatchSupervisor, as_user_id: "sup-2507", captures: {err_xs: $.data.error_id}}
            - {call: "POST /false-alarm-program/suspension-orders/${order_xs}/vacate", payload: {vacated_reason: "Order withdrawn by the program administrator after review of the counting basis."}, as: ProgramAdministrator}
            - {call: "POST /false-alarm-program/dispatch-requests/${dr_pending}/record-dispatch", payload: {}, as: PoliceDispatchSupervisor, as_user_id: "sup-2507"}
            - {call: "GET /false-alarm-program/alarm-sites/${site_xs}", payload: {}, as: ProgramAdministrator}
          assert:
            - "first trigger -> HTTP 409 with error_id == 'ERR_POLICE_RESPONSE_SUSPENDED'; DispatchRequest.${dr_pending}.status stays 'VALIDATED' and dispatched_at stays null"
            - "SuspensionOrder.${order_xs}.status == 'VACATED' after the vacate call, and its REINSTATEMENT_FEE invoice is VOIDED"
            - "AlarmSite.${site_xs}.response_status == 'RESPONSE_ACTIVE' after the vacate (chargeable_count_window 1 < probation_threshold_count 4, and VACATED orders are ignored)"
            - "second trigger -> HTTP 200 and DispatchRequest.${dr_pending}.status == 'DISPATCHED' with dispatched_at == '2026-06-20T00:00:00Z'"
            - "AlarmSite.${site_xs}.lifted_suspension_count == 0 (a vacated order never counted as a suspension)"

      - name: lifting_a_suspension_is_blocked_by_an_unrelated_permit_issue_invoice_of_the_same_site
        grounds:
          - state_machines.SuspensionOrder.REINSTATEMENT_PENDING_to_LIFTED
          - "validations[priority=56]"
          - calculations.site_balance_rollup
        distinguishing_aspect: >-
          With the false-alarm fee invoice and the 63000-cent reinstatement invoice both fully paid, the
          lift must still fail with 402 ERR_OUTSTANDING_BALANCE_BLOCKS_REINSTATEMENT because a 5500-cent
          PERMIT_ISSUE_FEE invoice that has nothing to do with the suspension is still unpaid; paying
          exactly that invoice releases the lift.
        test_recipe:
          setup:
            - "One ACTIVE FeeSchedule with suspension_threshold_count 1, probation_threshold_count 4, free_alarm_allowance 0, single tier [1..null: 10000], reinstatement_base_fee_cents 60000, reinstatement_escalation_pct 0.50, invoice_due_days 3650."
            - "One RESIDENTIAL AlarmSite with two ACTIVE ECV-callable contacts (min_ecv_contacts is 2 + 0 prior liftings) and one PERMITTED system, whose PERMIT_ISSUE_FEE invoice of 5000 + 500 admin = 5500 is left unpaid on purpose."
            - "The incident of 2026-07-05 is determined COUNTED, producing a 10000-cent fee invoice of 10500 and a PROPOSED order for 2026-07-15 .. 2026-08-14."
