# =============================================================================
# PRD Benchmark Seed Tables — task_3210_event_cinema_one_night_booking_theater_guarantee
# Event Cinema One-Night Booking & Theater Guarantee Management
# =============================================================================

scenario: |
  Event Cinema One-Night Booking & Theater Guarantee Management (Fathom Events): content acquisition of concerts, anniversary screenings, faith programming and live broadcasts with rights windows, theater booking across circuits for one or two showtimes with minimum screen counts, guarantee and revenue share negotiation where exhibitors commit screens against expected attendance, on-sale timing and marketing to niche audiences with pre-sale threshold cancellation rules, satellite and file delivery of content with encryption keys tied to specific screenings, live event contingency planning for feed failures with make-good policies, settlement across hundreds of theaters with attendance reporting, encore scheduling based on initial performance

domain_name: event-cinema-booking
api_prefix: /event-cinema

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: multi-party negotiation
  secondary_archetype: temporal windowing
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: flat
  # flat: every entity is reachable at /event-cinema/<collection>/{id}; all
  # parent/child links are FK fields carried in request bodies. No entity is
  # created through a nested parent URL. Action endpoints named on a single
  # resource (e.g. POST /event-cinema/bookings/{id}/confirm) are same-entity
  # verbs, not nested-resource creation.
  state_machine_shape: cyclic
  # Dominant shape is cyclic (Title BOOKABLE <-> CLEARED revision loop;
  # Booking ON_SALE <-> ON_HOLD suspension loop) with one parallel-dimension
  # machine (EncryptionKey issuance_status x validity_state) and one
  # fork-join machine (FeedEvent DETECTED -> {CONFIRMED, VOIDED} -> RESOLVED).
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  # All state cascades declared in §1.2 are applied atomically inside the
  # triggering request. Compensation is exposed as explicit compensating
  # endpoints (POST /bookings/{id}/release-screens, POST /bookings/{id}/apply-makegood),
  # never as deferred background work.
  entity_count: 12
  state_machine_count: 7
  calculation_count: 8
  endpoint_count: 85
  error_code_count: 46
  role_count: 7
  default_clock_utc: "2026-09-01T00:00:00Z"

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Distributor
    parent: null
    common_fields: true
    fields:
      - { name: distributor_name, type: string, source: input, description: "Content licensor name (e.g. a concert promoter or studio)" }
      - { name: contact_email, type: string, source: input, description: "Programming contact address" }
      - { name: settlement_currency, type: string, source: input, description: "ISO currency for all guarantees and settlements under this distributor", default: "USD" }
      - { name: guarantee_floor_cents, type: integer, source: input, description: "Distributor-wide minimum guarantee in cents; every Booking under this distributor must carry guarantee_cents at or above it" }
      - { name: ticket_price_default_cents, type: integer, source: input, description: "Fallback admission price used when a Title does not pin ticket_price_cents" }
      - { name: status, type: enum, source: computed, description: "ACTIVE | SUSPENDED", constraints: "set to ACTIVE at creation; SUSPENDED via POST /event-cinema/distributors/{id}/suspend" }
      - { name: bookable_title_count, type: integer, source: computed, description: "Count of Titles under this Distributor whose status == BOOKABLE" }

  - name: Circuit
    parent: null
    common_fields: true
    fields:
      - { name: circuit_name, type: string, source: input, description: "Exhibitor chain name" }
      - { name: circuit_code, type: string, source: input, description: "Short exhibitor code", constraints: "unique across all Circuits" }
      - { name: credit_rating, type: enum, source: input, description: "A | B | C — drives per-screen credit loading in guarantee_floor_derivation" }
      - { name: settlement_terms, type: enum, source: input, description: "NET_30 | NET_60 | GROSS_ON_GROSS | FOUR_WALL" }
      - { name: screen_pool_total, type: integer, source: input, description: "Total screens the circuit may commit at a single slot", constraints: ">= 1" }
      - { name: on_sale_lead_days_min, type: integer, source: input, description: "Minimum days between on_sale_at and the first showtime of a booking", default: 21 }
      - { name: committed_screens_balance, type: integer, source: computed, description: "Screens currently committed by non-terminal Bookings of this Circuit — recomputed from scratch, never incrementally decremented" }
      - { name: status, type: enum, source: computed, description: "PENDING | ACCREDITED | SUSPENDED", constraints: "PENDING at creation; ACCREDITED via POST /event-cinema/circuits/{id}/accredit; SUSPENDED via POST /event-cinema/circuits/{id}/suspend" }

  - name: Theater
    parent: Circuit
    common_fields: true
    fields:
      - { name: circuit_id, type: string, source: input, description: "FK -> Circuit.id; owning circuit" }
      - { name: theater_name, type: string, source: input, description: "Venue name" }
      - { name: city, type: string, source: input, description: "City" }
      - { name: state_code, type: string, source: input, description: "Two-letter state code" }
      - { name: timezone, type: string, source: input, description: "IANA timezone of the venue (informational)" }
      - { name: seats_total, type: integer, source: input, description: "Total seats, used as the per-screening gross ceiling in makegood_credit_derivation", constraints: ">= 1" }
      - { name: screen_count, type: integer, source: input, description: "Number of auditoriums at this venue", constraints: ">= 1" }
      - { name: showtime_buffer_minutes, type: integer, source: input, description: "Turnaround buffer added after a screening's runtime when detecting auditorium overlap", default: 20 }
      - { name: status, type: enum, source: computed, description: "ACTIVE | DARK | SUSPENDED", constraints: "ACTIVE at creation; DARK via POST /event-cinema/theaters/{id}/go-dark" }
      - { name: pending_rekey_count, type: integer, source: computed, description: "Number of revoked-but-unreplaced keys at this venue; incremented by the key-revocation cascade" }

  - name: Title
    parent: Distributor
    common_fields: true
    fields:
      - { name: distributor_id, type: string, source: input, description: "FK -> Distributor.id; owning distributor" }
      - { name: title_name, type: string, source: input, description: "Program title" }
      - { name: content_type, type: enum, source: input, description: "CONCERT | ANNIVERSARY | FAITH | LIVE_BROADCAST | SPECIAL" }
      - { name: is_live, type: boolean, source: input, description: "True when the event is broadcast live; live events permit a FeedEvent but not an Encore Window" }
      - { name: duration_minutes, type: integer, source: input, description: "Runtime; ceiling for showtime end computation", constraints: ">= 1" }
      - { name: rights_start_utc, type: datetime, source: input, description: "First instant the title may be exhibited" }
      - { name: rights_end_utc, type: datetime, source: input, description: "First instant the title may no longer be exhibited", constraints: "must be > rights_start_utc" }
      - { name: territory_state_codes, type: array, source: input, description: "States where exhibition is licensed", constraints: "non-empty; each element a two-letter state code" }
      - { name: max_screen_commitment, type: integer, source: input, description: "Maximum screens a single Booking against this Title may commit", constraints: ">= 1" }
      - { name: ticket_price_cents, type: integer, source: input, description: "Admission price in cents; falls back to Distributor.ticket_price_default_cents when null", required: false }
      - { name: status, type: enum, source: computed, description: "DRAFT | BOOKABLE | CLEARED | RIGHTS_EXPIRED | WITHDRAWN | ARCHIVED", default: "DRAFT" }
      - { name: bookable_window_days, type: integer, source: computed, description: "Whole days between rights_start_utc and rights_end_utc" }
      - { name: booking_count, type: integer, source: computed, description: "Count of Bookings against this Title whose status is not TERMINAL" }

  - name: Booking
    parent: Title
    common_fields: true
    fields:
      - { name: title_id, type: string, source: input, description: "FK -> Title.id; title being booked" }
      - { name: circuit_id, type: string, source: input, description: "FK -> Circuit.id; exhibitor counterparty" }
      - { name: negotiating_user_id, type: string, source: input, description: "FK -> Distributor.id; the distributor principal who opened the negotiation" }
      - { name: showtime_count, type: integer, source: input, description: "1 or 2 showtimes per theater", constraints: "IN {1,2}" }
      - { name: showtime_plan, type: array, source: input, description: "One element per showtime: {index, date_utc (00:00:00Z), start_minute_utc, auditorium}; the auditorium label is copied onto each synthesized Screening" }
      - { name: on_sale_at, type: datetime, source: input, description: "Instant ticketing opens; must precede every showtime date" }
      - { name: guarantee_cents, type: integer, source: input, description: "Minimum committed payment from Circuit to Distributor", constraints: ">= Distributor.guarantee_floor_cents and <= guarantee_ceiling_cents" }
      - { name: revenue_share_pct, type: number, source: input, description: "Distributor share of box office above the guarantee, as a fraction in [0,1]" }
      - { name: min_screens, type: integer, source: input, description: "Minimum committed screens the Circuit must reach for the booking to confirm", constraints: ">= 1; <= Title.max_screen_commitment" }
      - { name: pre_sale_threshold, type: integer, source: input, description: "Presale tickets that must be sold by the threshold checkpoint or the booking self-cancels", constraints: ">= 0" }
      - { name: status, type: enum, source: computed, description: "DRAFT | PENDING_APPROVAL | COUNTERED | APPROVED | ON_SALE | ON_HOLD | CONFIRMED | CANCELLED | SETTLED | TERMINAL" }
      - { name: committed_screens_total, type: integer, source: computed, description: "Sum of BookingLine.committed_screens across lines in state COMMITTED" }
      - { name: guarantee_ceiling_cents, type: integer, source: computed, description: "Derived from the Circuit credit rating and committed screens" }
      - { name: pre_sale_tickets, type: integer, source: computed, description: "Presale tickets recorded through POST /event-cinema/bookings/{id}/presale-sales; compared against pre_sale_threshold at the checkpoint" }
      - { name: live_feed_event_count, type: integer, source: computed, description: "Number of non-VOIDED FeedEvents on this booking" }
      - { name: makegood_credit_cents, type: integer, source: computed, description: "Sum of credit_issued_cents across this booking's lines", default: 0 }
      - { name: settled_at, type: datetime, source: system, description: "Instant the settlement closed; null until SETTLED" }

  - name: BookingLine
    parent: Booking
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; parent booking" }
      - { name: theater_id, type: string, source: input, description: "FK -> Theater.id; committing venue" }
      - { name: committed_screens, type: integer, source: input, description: "Screens this venue commits", constraints: ">= 1" }
      - { name: exhibit_state, type: enum, source: computed, description: "PROPOSED | COMMITTED | RELEASED", default: "PROPOSED" }
      - { name: expected_attendance, type: integer, source: input, description: "Circuit's forecast attendance for this venue; drives the guarantee allocation", constraints: ">= 0" }
      - { name: sold_tickets, type: integer, source: computed, description: "Attendance reported for this line; 0 until reported" }
      - { name: guarantee_applied_cents, type: integer, source: computed, description: "Portion of the Booking guarantee allocated to this line" }
      - { name: credit_issued_cents, type: integer, source: computed, description: "Make-good credit allocated to this line", default: 0 }

  - name: Screening
    parent: Booking
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; parent booking" }
      - { name: theater_id, type: string, source: input, description: "FK -> Theater.id; exhibiting venue" }
      - { name: auditorium, type: string, source: input, description: "Auditorium label within the venue, e.g. AUD-3" }
      - { name: starts_at, type: datetime, source: input, description: "Screening start instant (UTC)" }
      - { name: ends_at, type: datetime, source: input, description: "Screening end instant (UTC)", constraints: "must be > starts_at" }
      - { name: state, type: enum, source: computed, description: "SCHEDULED | SCREENED | SKIPPED_INCOMPLETE | SKIPPED_CANCELLED | VOID", default: "SCHEDULED" }
      - { name: is_encore, type: boolean, source: input, description: "True when this screening is an encore of an earlier performance", default: false }
      - { name: reported_attendance, type: integer, source: computed, description: "Headcount filed by the theater; null until reported" }

  - name: EncoreWindow
    parent: Booking
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; the booking whose performance is being encored" }
      - { name: title_id, type: string, source: input, description: "FK -> Title.id; must equal the parent Booking.title_id" }
      - { name: window_start_utc, type: datetime, source: input, description: "First instant the encore window opens" }
      - { name: window_end_utc, type: datetime, source: input, description: "First instant the encore window closes", constraints: "must be > window_start_utc and <= Title.rights_end_utc" }
      - { name: standard_ticket_price_cents, type: integer, source: input, description: "The price spur that the encore must undercut; normally the parent Title.ticket_price_cents" }
      - { name: encore_ticket_price_cents, type: integer, source: input, description: "Discounted admission price for encore screenings", constraints: "must be < standard_ticket_price_cents" }
      - { name: planned_screen_count, type: integer, source: input, description: "Screens the encore is expected to run on", constraints: ">= 1" }
      - { name: status, type: enum, source: computed, description: "DRAFT | SCHEDULED | WITHDRAWN | EXPIRED", default: "DRAFT" }
      - { name: derived_encore_price_cents, type: integer, source: computed, description: "Price produced by encore_price_derivation: max(standard price - 500, round_half_up(standard price * 0.55))" }
      - { name: encore_screening_count, type: integer, source: computed, description: "Screens already attached to this window, counted from Screenings" }

  - name: ContentDelivery
    parent: Booking
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; booking this content package serves" }
      - { name: title_id, type: string, source: input, description: "FK -> Title.id; must equal the parent Booking.title_id" }
      - { name: delivery_method, type: enum, source: input, description: "SATELLITE | FILE | BOTH" }
      - { name: content_checksum, type: string, source: input, description: "Expected SHA-256 of the content package" }
      - { name: scheduled_delivery_utc, type: datetime, source: input, description: "Planned delivery instant; must precede the earliest screening start minus the booking's delivery lead time" }
      - { name: delivered_at_utc, type: datetime, source: system, description: "Instant the package was marked delivered; null until DELIVERED" }
      - { name: status, type: enum, source: computed, description: "SCHEDULED | DELIVERED | VERIFIED | FAILED", default: "SCHEDULED" }
      - { name: delivered_checksum, type: string, source: system, description: "Checksum actually received by the venue; null until DELIVERED" }

  - name: EncryptionKey
    parent: Screening
    common_fields: true
    fields:
      - { name: screening_id, type: string, source: input, description: "FK -> Screening.id; the single screening this key unlocks" }
      - { name: title_id, type: string, source: input, description: "FK -> Title.id; must equal the Screening's booking's title_id" }
      - { name: key_ref, type: string, source: system, description: "Opaque key identifier minted by the system; plaintext key material is never returned by any endpoint" }
      - { name: not_valid_before_utc, type: datetime, source: input, description: "Start of the key validity interval" }
      - { name: not_valid_after_utc, type: datetime, source: input, description: "End of the key validity interval", constraints: "must be > not_valid_before_utc" }
      - { name: issuance_status, type: enum, source: computed, description: "PENDING | ISSUED | REVOKED", default: "PENDING" }
      - { name: validity_state, type: enum, source: computed, description: "NOT_YET_VALID | VALID | EXPIRED", default: "NOT_YET_VALID" }
      - { name: revocation_reason, type: enum, source: system, description: "FEED_LOSS | CONTENT_FAILURE | null", required: false }

  - name: FeedEvent
    parent: Booking
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; booking whose live feed broke" }
      - { name: screening_id, type: string, source: input, description: "FK -> Screening.id; the screening whose feed failed. Must be a screening of this booking in state SCHEDULED", required: false }
      - { name: failure_type, type: enum, source: input, description: "FEED_LOSS | CONTENT_FAILURE | SATELLITE_OUTAGE | KEY_FAILURE" }
      - { name: detected_at_utc, type: datetime, source: input, description: "Instant the failure was observed" }
      - { name: outage_minutes, type: integer, source: input, description: "Observed outage length in whole minutes", constraints: ">= 0" }
      - { name: state, type: enum, source: computed, description: "DETECTED | CONFIRMED | VOIDED | RESOLVED", default: "DETECTED" }
      - { name: resolution_outcome, type: enum, source: system, description: "RECOVERED | ABANDONED | null", required: false }
      - { name: affected_screening_count, type: integer, source: computed, description: "Scheduled screenings on this booking that had already started when the feed failed" }

  - name: Settlement
    parent: Booking
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; the confirmed booking being settled" }
      - { name: gross_box_office_cents, type: integer, source: input, description: "Total reported box office across all lines", constraints: ">= 0" }
      - { name: reported_line_count, type: integer, source: input, description: "Number of lines the exhibitor reports outcomes for", constraints: ">= 1" }
      - { name: topup_paid_cents, type: integer, source: input, description: "Additional cash the exhibitor already remitted against the guarantee", default: 0 }
      - { name: adjustment_cents, type: integer, source: input, description: "Signed contracted adjustment applied to the distributor net", default: 0 }
      - { name: feed_failure_credit_cents, type: integer, source: computed, description: "Credit granted for screenings ruined by a confirmed feed failure", default: 0 }
      - { name: makegood_credit_cents, type: integer, source: computed, description: "Sum of credit_issued_cents across the booking's lines", default: 0 }
      - { name: distributor_net_cents, type: integer, source: computed, description: "Distributor's final net position on this booking" }
      - { name: exhibitor_net_cents, type: integer, source: computed, description: "Exhibitor's final net position; invariant: distributor_net_cents + exhibitor_net_cents == gross_box_office_cents + topup_paid_cents + adjustment_cents" }
      - { name: invariant_drift_cents, type: integer, source: computed, description: "Recorded residual of the conservation invariant; 0 when the invariant holds", default: 0 }
      - { name: status, type: enum, source: computed, description: "OPEN | CLOSED | REOPENED", default: "OPEN" }
      - { name: closed_at_utc, type: datetime, source: system, description: "Instant the settlement closed; null until CLOSED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: Title
    field: status
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    shape: cyclic
    note: "BOOKABLE <-> CLEARED is a revision loop: clearing a title locks new bookings, reopening unlocks them again."
    transitions:
      - from: DRAFT
        to: BOOKABLE
        trigger: "POST /event-cinema/titles/{id}/publish"
        actor: ProgrammingManager
        preconditions:
          - "Title.rights_end_utc > current clock instant"
          - "Title.territory_state_codes has at least one element"
          - "Distributor.status == ACTIVE"
        side_effects:
          - "recompute Distributor.bookable_title_count as the count of this Distributor's Titles with status == BOOKABLE"

      - from: BOOKABLE
        to: DRAFT
        trigger: "POST /event-cinema/titles/{id}/unpublish"
        actor: ProgrammingManager
        preconditions:
          - "Title.booking_count == 0"
        side_effects:
          - "recompute Distributor.bookable_title_count"

      - from: BOOKABLE
        to: CLEARED
        trigger: "POST /event-cinema/titles/{id}/clear"
        actor: ProgrammingManager
        preconditions:
          - "Title.booking_count >= 1"
        side_effects:
          - "no downstream mutation; the title stops accepting new Bookings but keeps existing ones"

      - from: CLEARED
        to: BOOKABLE
        trigger: "POST /event-cinema/titles/{id}/reopen-bookings"
        actor: ProgrammingManager
        preconditions:
          - "Title.rights_end_utc > current clock instant"
        side_effects:
          - "recompute Distributor.bookable_title_count"

      - from: BOOKABLE
        to: RIGHTS_EXPIRED
        trigger: "system (any read or mutation of this Title observes current clock instant >= Title.rights_end_utc)"
        actor: system
        preconditions:
          - "current clock instant >= Title.rights_end_utc"
        side_effects:
          - "every Booking of this Title in status ∈ {PENDING_APPROVAL, COUNTERED, APPROVED} → CANCELLED"
          - "each such Booking's BookingLines with exhibit_state ∈ {PROPOSED, COMMITTED} → RELEASED"
          - "each such Booking's Screenings with state == SCHEDULED → SKIPPED_CANCELLED"
          - "each such Booking's Screenings with state == SKIPPED_CANCELLED drive their EncryptionKeys to issuance_status REVOKED and increment the owning Theater.pending_rekey_count by 1 per revoked key"
          - "recompute Circuit.committed_screens_balance for every affected Circuit"
          - "recompute Distributor.bookable_title_count"

      - from: CLEARED
        to: RIGHTS_EXPIRED
        trigger: "system (any read or mutation of this Title observes current clock instant >= Title.rights_end_utc)"
        actor: system
        preconditions:
          - "current clock instant >= Title.rights_end_utc"
        side_effects:
          - "same four-hop cascade declared on BOOKABLE → RIGHTS_EXPIRED"

      - from: BOOKABLE
        to: WITHDRAWN
        trigger: "POST /event-cinema/titles/{id}/withdraw"
        actor: ProgrammingManager
        preconditions:
          - "no Booking of this Title is in status ∈ {ON_SALE, CONFIRMED}"
        side_effects:
          - "every Booking of this Title in status ∈ {PENDING_APPROVAL, COUNTERED, APPROVED} → CANCELLED"
          - "each such Booking's BookingLines with exhibit_state ∈ {PROPOSED, COMMITTED} → RELEASED"
          - "each such Booking's Screenings with state == SCHEDULED → SKIPPED_CANCELLED"
          - "each such Booking's Screenings with state == SKIPPED_CANCELLED drive their EncryptionKeys to issuance_status REVOKED and increment the owning Theater.pending_rekey_count"
          - "recompute Circuit.committed_screens_balance for every affected Circuit"
          - "recompute Distributor.bookable_title_count"

      - from: CLEARED
        to: WITHDRAWN
        trigger: "POST /event-cinema/titles/{id}/withdraw"
        actor: ProgrammingManager
        preconditions:
          - "no Booking of this Title is in status ∈ {ON_SALE, CONFIRMED}"
        side_effects:
          - "same cascade declared on BOOKABLE → WITHDRAWN"

      - from: RIGHTS_EXPIRED
        to: ARCHIVED
        trigger: "POST /event-cinema/titles/{id}/archive"
        actor: ProgrammingManager
        preconditions:
          - "Title.booking_count == 0"
        side_effects:
          - "recompute Distributor.bookable_title_count"

      - from: WITHDRAWN
        to: ARCHIVED
        trigger: "POST /event-cinema/titles/{id}/archive"
        actor: ProgrammingManager
        preconditions:
          - "Title.booking_count == 0"
        side_effects:
          - "recompute Distributor.bookable_title_count"

  - entity: Booking
    field: status
    initial_state: DRAFT
    terminal_states: [TERMINAL]
    shape: cyclic
    note: "ON_SALE <-> ON_HOLD is a suspension loop. The negotiation cycle PENDING_APPROVAL -> COUNTERED -> PENDING_APPROVAL is the second loop, bounded at 3 counter rounds."
    transitions:
      - from: DRAFT
        to: PENDING_APPROVAL
        trigger: "POST /event-cinema/bookings/{id}/submit"
        actor: Exhibitor
        preconditions:
          - "Booking.committed_screens_total >= Booking.min_screens"
          - "the Booking has at least one BookingLine"
          - "Booking.on_sale_at >= current clock instant"
          - "Booking.guarantee_cents >= Distributor.guarantee_floor_cents"
          - "Circuit.status == ACCREDITED"
          - "Title.status ∈ {BOOKABLE, CLEARED}"
        side_effects:
          - "recompute Booking.guarantee_ceiling_cents from Circuit.credit_rating and Booking.committed_screens_total"
          - "recompute Booking.live_feed_event_count"

      - from: PENDING_APPROVAL
        to: COUNTERED
        trigger: "POST /event-cinema/bookings/{id}/counter"
        actor: Distributor
        preconditions:
          - "Circuit.status == ACCREDITED"
          - "counter round count < 3 counters already issued on this Booking"
          - "proposed_guarantee_cents >= Distributor.guarantee_floor_cents"
        side_effects:
          - "Booking.guarantee_cents := proposed_guarantee_cents"
          - "Booking.revenue_share_pct := proposed_revenue_share_pct"
          - "recompute Booking.guarantee_ceiling_cents"

      - from: COUNTERED
        to: PENDING_APPROVAL
        trigger: "POST /event-cinema/bookings/{id}/re-propose"
        actor: Exhibitor
        preconditions:
          - "Booking.guarantee_cents >= Distributor.guarantee_floor_cents"
          - "Booking.on_sale_at >= current clock instant"
        side_effects:
          - "recompute Booking.guarantee_ceiling_cents"

      - from: [PENDING_APPROVAL, APPROVED]
        to: APPROVED
        trigger: "POST /event-cinema/bookings/{id}/approve"
        actor: Distributor
        preconditions:
          - "Circuit.status == ACCREDITED"
          - "Booking.guarantee_cents <= Booking.guarantee_ceiling_cents"
          - "Title.status ∈ {BOOKABLE, CLEARED}"
          - "at least one BookingLine is in exhibit_state PROPOSED"
          - "let L = the PROPOSED line with the smallest created_at, tie-broken by smallest theater_id; Circuit.committed_screens_balance + L.committed_screens <= Circuit.screen_pool_total"
        side_effects:
          - "L.exhibit_state PROPOSED → COMMITTED"
          - "Circuit.committed_screens_balance := recomputed count of committed screens across all non-terminal Bookings of this Circuit"
          - "recompute Booking.guarantee_applied_cents across all COMMITTED lines"
          - "synthesize one Screening per element of Booking.showtime_plan for L, state SCHEDULED, is_encore false, auditorium copied from the plan element"
          - "recompute Booking.committed_screens_total"

      - from: COUNTERED
        to: CANCELLED
        trigger: "POST /event-cinema/bookings/{id}/cancel"
        actor: Distributor
        preconditions:
          - "no BookingLine is in exhibit_state COMMITTED"
        side_effects:
          - "every BookingLine PROPOSED → RELEASED"
          - "recompute Circuit.committed_screens_balance"

      - from: PENDING_APPROVAL
        to: CANCELLED
        trigger: "POST /event-cinema/bookings/{id}/cancel"
        actor: Exhibitor
        preconditions:
          - "no BookingLine is in exhibit_state COMMITTED"
        side_effects:
          - "every BookingLine PROPOSED → RELEASED"
          - "recompute Circuit.committed_screens_balance"

      - from: APPROVED
        to: CANCELLED
        trigger: "POST /event-cinema/bookings/{id}/cancel"
        actor: Exhibitor
        preconditions:
          - "no Settlement of this Booking has status CLOSED"
        side_effects:
          - "every BookingLine in exhibit_state COMMITTED → RELEASED"
          - "every BookingLine in exhibit_state PROPOSED → RELEASED"
          - "every Screening of this Booking in state SCHEDULED → SKIPPED_CANCELLED"
          - "each Screening moved to SKIPPED_CANCELLED drives its EncryptionKey to issuance_status REVOKED and increments the owning Theater.pending_rekey_count"
          - "recompute Circuit.committed_screens_balance"

      - from: APPROVED
        to: ON_SALE
        trigger: "POST /event-cinema/_ops/run-on-sale-sweep (system scan of APPROVED bookings whose on_sale_at has been reached)"
        actor: PlatformOps
        preconditions:
          - "current clock instant >= Booking.on_sale_at"
          - "Booking.committed_screens_total >= Booking.min_screens"
        side_effects:
          - "recompute Booking.pre_sale_tickets from the recorded presale sales ledger"

      - from: ON_SALE
        to: CONFIRMED
        trigger: "POST /event-cinema/bookings/{id}/confirm"
        actor: PlatformOps
        preconditions:
          - "current clock instant < the earliest Screening.starts_at among this Booking's SCHEDULED lines"
          - "Booking.pre_sale_tickets >= Booking.pre_sale_threshold"
          - "no FeedEvent of this Booking has state CONFIRMED with resolution_outcome ABANDONED"
          - "for every COMMITTED BookingLine of this Booking, none of that line's scheduled screenings temporally overlaps — under the inclusive-adjacency rule (candidate.start < existing.end AND candidate.end > existing.start) — any SCHEDULED Screening of another Booking on the same Theater"
        side_effects:
          - "recompute Circuit.committed_screens_balance"
          - "recompute Booking.guarantee_applied_cents"

      - from: ON_SALE
        to: ON_HOLD
        trigger: "POST /event-cinema/bookings/{id}/suspend"
        actor: Distributor
        preconditions:
          - "Circuit.status != SUSPENDED"
          - "no Settlement of this Booking has status CLOSED"
        side_effects:
          - "every BookingLine in exhibit_state COMMITTED → RELEASED"
          - "every Screening of this Booking in state SCHEDULED → VOID"
          - "each Screening moved to VOID drives its EncryptionKey to issuance_status REVOKED and increments the owning Theater.pending_rekey_count"
          - "recompute Circuit.committed_screens_balance"

      - from: ON_HOLD
        to: ON_SALE
        trigger: "POST /event-cinema/bookings/{id}/resume"
        actor: Distributor
        preconditions:
          - "Circuit.status == ACCREDITED"
          - "current clock instant < the earliest Screening.starts_at among this Booking's screenings that are not VOID; a Booking left with no non-VOID screenings satisfies this vacuously, because the resume transition mints fresh screenings from the showtime plan"
          - "Booking.guarantee_cents <= Booking.guarantee_ceiling_cents"
        side_effects:
          - "every BookingLine in exhibit_state RELEASED re-commits to COMMITTED"
          - "synthesize a fresh Screening per element of Booking.showtime_plan for each line re-committed, state SCHEDULED, is_encore false, auditorium copied from the plan element"
          - "recompute Circuit.committed_screens_balance"

      - from: ON_SALE
        to: CANCELLED
        trigger: "POST /event-cinema/bookings/{id}/presale-checkpoint"
        actor: PlatformOps
        preconditions:
          - "current clock instant >= Booking.on_sale_at + 14 days"
          - "Booking.pre_sale_tickets < Booking.pre_sale_threshold"
        side_effects:
          - "every BookingLine in exhibit_state COMMITTED → RELEASED"
          - "every Screening of this Booking in state SCHEDULED → SKIPPED_CANCELLED"
          - "each Screening moved to SKIPPED_CANCELLED drives its EncryptionKey to issuance_status REVOKED and increments the owning Theater.pending_rekey_count"
          - "recompute Circuit.committed_screens_balance"

      - from: CONFIRMED
        to: SETTLED
        trigger: "POST /event-cinema/settlements (settlement created for this Booking and closed in the same request)"
        actor: PlatformOps
        preconditions:
          - "every BookingLine of this Booking has reported attendance"
        side_effects:
          - "Settlement.status OPEN → CLOSED"
          - "Settlement.closed_at_utc := current clock instant"
          - "Booking.settled_at := current clock instant"

      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /event-cinema/bookings/{id}/cancel-with-compensation"
        actor: Distributor
        preconditions:
          - "no Settlement of this Booking has status CLOSED"
        side_effects:
          - "every BookingLine in exhibit_state COMMITTED → RELEASED"
          - "every Screening of this Booking in state SCHEDULED → SKIPPED_CANCELLED"
          - "each Screening moved to SKIPPED_CANCELLED drives its EncryptionKey to issuance_status REVOKED and increments the owning Theater.pending_rekey_count"
          - "recompute Circuit.committed_screens_balance"

      - from: SETTLED
        to: CONFIRMED
        trigger: "POST /event-cinema/bookings/{id}/reopen"
        actor: PlatformOps
        preconditions:
          - "a Settlement of this Booking has status REOPENED"
        side_effects:
          - "Booking.settled_at := null"

      - from: [DRAFT, PENDING_APPROVAL, COUNTERED, APPROVED, CANCELLED, ON_HOLD, SETTLED, ON_SALE]
        to: TERMINAL
        trigger: "POST /event-cinema/bookings/{id}/close"
        actor: PlatformOps
        preconditions:
          - "no Screening of this Booking is in state SCHEDULED"
          - "no Settlement of this Booking is in status OPEN or REOPENED"
        side_effects:
          - "recompute Circuit.committed_screens_balance"

  - entity: Screening
    field: state
    initial_state: SCHEDULED
    terminal_states: [SCREENED, SKIPPED_INCOMPLETE, SKIPPED_CANCELLED, VOID]
    shape: branching
    note: "Screening state mirrors the outcome reported by the theater and is stamped from the BookingLine aggregate by the attendance report, not written directly."
    transitions:
      - from: SCHEDULED
        to: SCREENED
        trigger: "POST /event-cinema/screenings/{id}/report (reported_outcome SCREENED)"
        actor: Theater
        preconditions:
          - "current clock instant >= Screening.ends_at"
          - "the parent Booking status ∈ {ON_SALE, CONFIRMED, SETTLED}"
          - "the parent BookingLine has exhibit_state == COMMITTED"
        side_effects:
          - "Screening.reported_attendance := reported_attendance"
          - "BookingLine.sold_tickets := sum of reported_attendance over this line's screenings in state SCREENED"
          - "recompute Booking.pre_sale_tickets"

      - from: SCHEDULED
        to: SKIPPED_INCOMPLETE
        trigger: "POST /event-cinema/screenings/{id}/report (reported_outcome SKIPPED_INCOMPLETE)"
        actor: Theater
        preconditions:
          - "current clock instant >= Screening.ends_at"
          - "the parent Booking status ∈ {ON_SALE, CONFIRMED, SETTLED}"
          - "at least one FeedEvent on the parent Booking has state CONFIRMED"
        side_effects:
          - "Screening.reported_attendance := reported_attendance"
          - "BookingLine.sold_tickets := sum of reported_attendance over this line's screenings in state SCREENED"
          - "recompute Booking.pre_sale_tickets"

      - from: SCHEDULED
        to: SKIPPED_CANCELLED
        trigger: "system (the parent Booking or Title is cancelled, or the presale checkpoint fails)"
        actor: system
        preconditions:
          - "the parent Booking transitioned to CANCELLED, or its Title transitioned to RIGHTS_EXPIRED or WITHDRAWN"
        side_effects:
          - "each EncryptionKey attached to this Screening → issuance_status REVOKED"
          - "the owning Theater.pending_rekey_count += 1 per revoked key"
          - "recompute Circuit.committed_screens_balance"

      - from: SCHEDULED
        to: VOID
        trigger: "system (the parent Booking enters ON_HOLD)"
        actor: system
        preconditions:
          - "the parent Booking transitioned to ON_HOLD"
        side_effects:
          - "each EncryptionKey attached to this Screening → issuance_status REVOKED"
          - "the owning Theater.pending_rekey_count += 1 per revoked key"
          - "recompute Circuit.committed_screens_balance"

  - entity: ContentDelivery
    field: status
    initial_state: SCHEDULED
    terminal_states: [VERIFIED, FAILED]
    shape: branching
    note: "A package either verifies or fails; the failure branch is what makes the booking's keys permanently unissuable until a replacement package is registered."
    transitions:
      - from: SCHEDULED
        to: DELIVERED
        trigger: "POST /event-cinema/content-deliveries/{id}/mark-delivered"
        actor: PlatformOps
        preconditions:
          - "ContentDelivery.delivered_checksum is supplied"
        side_effects:
          - "ContentDelivery.delivered_at_utc := current clock instant"
          - "ContentDelivery.delivered_checksum := delivered_checksum"

      - from: DELIVERED
        to: VERIFIED
        trigger: "POST /event-cinema/content-deliveries/{id}/verify"
        actor: PlatformOps
        preconditions:
          - "ContentDelivery.delivered_checksum == ContentDelivery.content_checksum"
          - "delivery_lead_verification holds for this booking"
        side_effects: []

      - from: SCHEDULED
        to: FAILED
        trigger: "POST /event-cinema/content-deliveries/{id}/mark-failed"
        actor: PlatformOps
        preconditions:
          - "the package has not been verified"
        side_effects: []

      - from: DELIVERED
        to: FAILED
        trigger: "POST /event-cinema/content-deliveries/{id}/mark-failed"
        actor: PlatformOps
        preconditions:
          - "ContentDelivery.delivered_checksum != ContentDelivery.content_checksum"
        side_effects: []

  - entity: EncryptionKey
    field: issuance_status
    initial_state: PENDING
    terminal_states: [REVOKED]
    shape: parallel
    note: "Parallel dimensions: issuance_status (PENDING | ISSUED | REVOKED) evolves under encryption-key commands, while validity_state (NOT_YET_VALID | VALID | EXPIRED) is derived purely from the screening start instant and the key's own validity interval."
    transitions:
      - from: PENDING
        to: ISSUED
        trigger: "POST /event-cinema/keys/{id}/issue"
        actor: PlatformOps
        preconditions:
          - "the Screening is in state SCHEDULED"
          - "the parent Booking status ∈ {ON_SALE, CONFIRMED, SETTLED}"
          - "the parent Booking's ContentDelivery status == VERIFIED"
          - "key_ref is null"
        side_effects:
          - "EncryptionKey.key_ref := system-minted opaque key reference"

      - from: ISSUED
        to: REVOKED
        trigger: "POST /event-cinema/keys/{id}/revoke"
        actor: PlatformOps
        preconditions:
          - "the parent Screening is in state SKIPPED_CANCELLED or VOID, or the revocation is requested with reason FEED_LOSS while the Screening is SCHEDULED"
        side_effects:
          - "EncryptionKey.revocation_reason := revocation_reason"
          - "the owning Theater.pending_rekey_count += 1"

      - from: PENDING
        to: REVOKED
        trigger: "system (the parent Screening enters SKIPPED_CANCELLED or VOID)"
        actor: system
        preconditions:
          - "the parent Screening transitioned to SKIPPED_CANCELLED or VOID"
        side_effects:
          - "EncryptionKey.revocation_reason := CONTENT_FAILURE"
          - "the owning Theater.pending_rekey_count += 1"

  - entity: FeedEvent
    field: state
    initial_state: DETECTED
    terminal_states: [RESOLVED]
    shape: branching
    note: "Fork-join: a DETECTED feed failure either confirms (ruined screenings become eligible for make-good credit) or voids (false alarm, no credit). Both paths converge on RESOLVED."
    transitions:
      - from: DETECTED
        to: CONFIRMED
        trigger: "POST /event-cinema/feed-events/{id}/confirm"
        actor: PlatformOps
        preconditions:
          - "FeedEvent.outage_minutes >= 5"
          - "at least one Screening of the parent Booking is in state SCHEDULED or SCREENED and started at or before FeedEvent.detected_at_utc"
        side_effects:
          - "FeedEvent.affected_screening_count := count of the parent Booking's screenings that had started at or before detected_at_utc"
          - "each EncryptionKey on those affected screenings → issuance_status REVOKED with reason FEED_LOSS, and the owning Theater.pending_rekey_count += 1 per revoked key"
          - "recompute Booking.live_feed_event_count"

      - from: DETECTED
        to: VOIDED
        trigger: "POST /event-cinema/feed-events/{id}/void"
        actor: PlatformOps
        preconditions:
          - "no EncryptionKey of this Booking has already been revoked with reason FEED_LOSS for this FeedEvent"
        side_effects:
          - "recompute Booking.live_feed_event_count"

      - from: CONFIRMED
        to: RESOLVED
        trigger: "POST /event-cinema/feed-events/{id}/resolve"
        actor: PlatformOps
        preconditions:
          - "every Screening in affected_screening_count has been reported (state != SCHEDULED)"
          - "at least one MakeGood policy for the parent Booking has status APPLIED"
        side_effects:
          - "FeedEvent.resolution_outcome := RECOVERED | ABANDONED as supplied"

      - from: VOIDED
        to: RESOLVED
        trigger: "POST /event-cinema/feed-events/{id}/resolve"
        actor: PlatformOps
        preconditions:
          - "FeedEvent.resolution_outcome == RECOVERED"
        side_effects: []

  - entity: Circuit
    field: status
    initial_state: PENDING
    terminal_states: []
    shape: linear
    transitions:
      - from: PENDING
        to: ACCREDITED
        trigger: "POST /event-cinema/circuits/{id}/accredit"
        actor: PlatformOps
        preconditions:
          - "Circuit.screen_pool_total >= 1"
        side_effects: []

      - from: ACCREDITED
        to: SUSPENDED
        trigger: "POST /event-cinema/circuits/{id}/suspend"
        actor: PlatformOps
        preconditions:
          - "no Booking of this Circuit is in status ON_HOLD"
        side_effects:
          - "every Booking of this Circuit in status ∈ {DRAFT, PENDING_APPROVAL, COUNTERED, APPROVED} → CANCELLED"
          - "each such Booking's BookingLines with exhibit_state ∈ {PROPOSED, COMMITTED} → RELEASED"
          - "recompute Circuit.committed_screens_balance"

      - from: SUSPENDED
        to: ACCREDITED
        trigger: "POST /event-cinema/circuits/{id}/accredit"
        actor: PlatformOps
        preconditions:
          - "Circuit.screen_pool_total >= 1"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: booking-line-supersede-stale-booking
    parent_entity: Booking
    write_endpoint: "POST /event-cinema/bookings/{id}/lines"
    occ_field: "expected_booking_version"
    description: |
      Adding a BookingLine against a Booking whose version has advanced since the
      client last observed it is rejected. The product deliberately allows a later
      line to supersede the client's view of the commitment plan, so a client
      working from a stale view must not have it applied.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: encore-window-supersede-stale-booking
    parent_entity: Booking
    write_endpoint: "POST /event-cinema/encore-windows"
    occ_field: "expected_booking_version"
    description: |
      Creating an EncoreWindow against a Booking whose version has advanced since
      the client last observed it is rejected. Encore planning legitimately
      supersedes a prior window on the same booking, so a stale view of the
      booking must not seed a new one.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: guarantee_floor_derivation
    description: "Derive the maximum guarantee the distributor will allow for a booking, from the circuit's credit rating and the screens actually committed."
    trigger: "computed on Booking create; recomputed on every Booking transition whose side_effects list Booking.guarantee_ceiling_cents (submit, counter, re-propose, approve)"
    algorithm: threshold + dual_variant
    formula: |
      base_rate_cents(rating) = { A: 45000, B: 35000, C: 25000 }

      total_committed = Booking.committed_screens_total   # sum of BookingLine.committed_screens over lines in exhibit_state COMMITTED
      volume_factor(t) = 1.00 when t <= 50
                       = 0.90 when 51 <= t <= 150
                       = 0.80 when 151 <= t <= 400
                       = 0.70 when t >= 401
      # one volume_factor is selected from the BOOKING-LEVEL total and applied to every screen

      per_screen_loaded = round_half_up( total_committed * base_rate_cents(Circuit.credit_rating) * volume_factor(total_committed) )

      price_cents = Title.ticket_price_cents when non-null else Distributor.ticket_price_default_cents
      aggregate_cap = price_cents * total_committed * ADMISSION_MULTIPLE

      ceiling = AGGREGATE_CAPPED ? min(per_screen_loaded, aggregate_cap) : per_screen_loaded
      # if total_committed > Title.max_screen_commitment then ceiling = 0 (booking cannot be approved at all)
    input_set: "Booking in status ∈ {DRAFT, PENDING_APPROVAL, COUNTERED, APPROVED, ON_SALE, ON_HOLD} with committed_screens_total > 0; Bookings with total_committed == 0 evaluate to ceiling 0"
    constants:
      BASE_RATE_A_CENTS: 45000
      BASE_RATE_B_CENTS: 35000
      BASE_RATE_C_CENTS: 25000
      VOLUME_TIER_1_MAX: 50
      VOLUME_TIER_2_MAX: 150
      VOLUME_TIER_3_MAX: 400
      VOLUME_FACTOR_1: 1.00
      VOLUME_FACTOR_2: 0.90
      VOLUME_FACTOR_3: 0.80
      VOLUME_FACTOR_4: 0.70
      ADMISSION_MULTIPLE: 12
    precision: "1 cent, round_half_up; the min() is applied AFTER rounding per_screen_loaded, never before"
    variants:
      - name: PER_SCREEN_LOADED
        when: "Booking.status ∈ {DRAFT, PENDING_APPROVAL, COUNTERED, APPROVED} — the provisional ceiling the negotiation runs against"
        difference: "Uses per_screen_loaded with no aggregate cap, so a high-priced title does not lower the ceiling during negotiation."
      - name: AGGREGATE_CAPPED
        when: "Booking.status ∈ {ON_SALE, ON_HOLD, CONFIRMED, SETTLED} — the final ceiling used once the title is on sale"
        difference: "Takes min(per_screen_loaded, price_cents * total_committed * 12). For an A-rated circuit committing 60 screens against a 1500-cent title this is 1080000, while PER_SCREEN_LOADED is 2430000 — the same booking has a different ceiling depending on which variant is live."

  - name: guarantee_allocation
    description: "Split the booking guarantee across the lines that are actually committed, weighted by forecast attendance, with an explicitly ordered remainder distribution."
    trigger: "recomputed whenever Booking.guarantee_applied_cents is listed in a transition's side_effects (approve, confirm) or a line's exhibit_state changes"
    algorithm: waterfall_allocation
    formula: |
      eligible = [L for L in Booking.lines if L.exhibit_state == COMMITTED]
      order    = eligible sorted by L.expected_attendance DESC,
                                then L.created_at ASC,
                                then L.theater_id ASC
      # this is a TOTAL order: a booking carries at most one line per theater
      # (ERR_DUPLICATE_BOOKING_LINE), so theater_id cannot repeat and no tie
      # can survive all three keys. Random id is never consulted.

      total_expected = sum(L.expected_attendance for L in eligible)

      if total_expected == 0:
          share_k = floor(Booking.guarantee_cents / len(eligible))
      else:
          share_k = floor(Booking.guarantee_cents * order[k].expected_attendance / total_expected)

      remainder = Booking.guarantee_cents - sum(share_k)
      for i in range(remainder):           # one cent at a time, in `order`
          share_{i mod len(eligible)} += 1

      for L in eligible:  L.guarantee_applied_cents = share_L
      for L not eligible: L.guarantee_applied_cents = 0
    input_set: "Booking lines in exhibit_state COMMITTED are included; PROPOSED and RELEASED lines always receive 0"
    constants:
      REMAINDER_STEP_CENTS: 1
    precision: "1 cent, integer floor for the pro-rata share; the residual is distributed one cent at a time and never rounded"
    variants: []

  - name: presale_threshold_assessment
    description: "Decide whether an on-sale booking has cleared its presale commitment by the checkpoint."
    trigger: "POST /event-cinema/bookings/{id}/presale-checkpoint at on_sale_at + 14 days"
    algorithm: threshold
    formula: |
      pre_sale_tickets = Booking.pre_sale_tickets   # scalar recorded by the presale-sales endpoint
      passes  = (pre_sale_tickets >= Booking.pre_sale_threshold)
      # the comparison is >= : a booking whose threshold is 0 passes with zero tickets sold
      # a booking whose threshold equals the exact ticket count passes
    input_set: "Booking in status ON_SALE; Booking.pre_sale_tickets counts presale sales only, never post-event attendance"
    constants:
      CHECKPOINT_OFFSET_DAYS: 14
    precision: "integer ticket count, no rounding"
    variants: []

  - name: delivery_lead_verification
    description: "Confirm that a content package is scheduled to land before the first screening minus the delivery-method lead time."
    trigger: "computed on ContentDelivery create/update and on Screening synthesis; gates the ContentDelivery VERIFIED transition"
    algorithm: threshold
    formula: |
      lead_hours = { SATELLITE: 48, FILE: 24, BOTH: 48 }[ContentDelivery.delivery_method]
      if Title.is_live: lead_hours += 12
      earliest_start = min(S.starts_at for S in Booking.screenings if S.state == SCHEDULED)
      ok = (ContentDelivery.scheduled_delivery_utc + lead_hours hours <= earliest_start)
      # exact equality passes: a delivery scheduled exactly at earliest_start - lead_hours is accepted
      # a Booking with zero SCHEDULED screenings evaluates ok = false and the delivery cannot be VERIFIED
    input_set: "ContentDelivery in status ∈ {SCHEDULED, DELIVERED}; screenings in state SCHEDULED only"
    constants:
      LEAD_HOURS_SATELLITE: 48
      LEAD_HOURS_FILE: 24
      LEAD_HOURS_BOTH: 48
      LIVE_EVENT_SURCHARGE_HOURS: 12
    precision: "whole hours; the comparison is on the exact instants, not on rounded day counts"
    variants: []

  - name: key_window_alignment
    description: "Decide whether an encryption key's validity interval covers its screening and whether the key is valid at a given instant."
    trigger: "computed on EncryptionKey issue; validity_state recomputed on every read of the key or its screening"
    algorithm: threshold
    formula: |
      aligned = (EncryptionKey.not_valid_before_utc <= Screening.starts_at)
                AND (EncryptionKey.not_valid_after_utc >= Screening.ends_at)
      # both boundaries are inclusive: a key that opens exactly at starts_at and closes
      # exactly at ends_at is aligned

      validity_state at instant T =
          NOT_YET_VALID  when T <  not_valid_before_utc
          VALID          when not_valid_before_utc <= T <= not_valid_after_utc
          EXPIRED        when T >  not_valid_after_utc
      # validity_state is independent of issuance_status: a REVOKED key still reports
      # VALID while its interval covers T, and an ISSUED key reports NOT_YET_VALID
      # before its interval opens
    input_set: "EncryptionKey in issuance_status ∈ {PENDING, ISSUED}; REVOKED keys still report a validity_state"
    constants:
      NOT_YET_VALID_BOUNDARY: "closed on the left"
      EXPIRED_BOUNDARY: "closed on the right"
    precision: "instant comparison at second granularity; no rounding"
    variants: []

  - name: makegood_credit_derivation
    description: "Credit a venue for a screening ruined by a confirmed feed failure, prorated by the fraction of the runtime lost."
    trigger: "POST /event-cinema/bookings/{id}/apply-makegood against a FeedEvent in state CONFIRMED"
    algorithm: tiered_rate + aggregation
    formula: |
      price_cents = Title.ticket_price_cents when non-null else Distributor.ticket_price_default_cents

      rate_tier(outage_minutes) = 1.00 when outage_minutes >= 90
                                = 0.60 when 30 <= outage_minutes < 90
                                = 0.25 when 5  <= outage_minutes < 30
                                = 0.00 when outage_minutes < 5

      lost_fraction = outage_minutes / Screening.duration_minutes    # Title.duration_minutes for every screening
      cap_cents     = Theater.seats_total * price_cents * CAP_FRACTION

      per_screening_credit =
          round_half_up( min( rate_tier(outage_minutes) * price_cents
                              * Screening.reported_attendance * lost_fraction,
                              cap_cents ) )

      Booking.makegood_credit_cents = SUM(per_screening_credit)
      # PINNED ORDER: round PER SCREENING first, then SUM the rounded values.
      # Rounding the raw sum instead yields a different cent count whenever two
      # screenings each land on a half-cent.

      BookingLine.credit_issued_cents = SUM of that line's per_screening_credit values
      Booking.feed_failure_credit_cents = SUM of per_screening_credit over screenings whose FeedEvent.failure_type == FEED_LOSS
    input_set: "Screening in state SKIPPED_INCOMPLETE, or SCHEDULED with a CONFIRMED FeedEvent whose detected_at_utc >= the screening's starts_at; the parent BookingLine must be COMMITTED; screenings with rate_tier 0 contribute exactly 0"
    constants:
      RATE_TIER_1_MIN_MINUTES: 90
      RATE_TIER_2_MIN_MINUTES: 30
      RATE_TIER_3_MIN_MINUTES: 5
      RATE_TIER_1: 1.00
      RATE_TIER_2: 0.60
      RATE_TIER_3: 0.25
      RATE_TIER_4: 0.00
      CAP_FRACTION: 0.5
    precision: "1 cent, round_half_up per screening, then integer sum — order is normative"
    variants: []

  - name: settlement_split
    description: "Divide reported box office between distributor and exhibitor under the circuit's settlement terms."
    trigger: "POST /event-cinema/settlements (computed at creation and recomputed on every reopen/close)"
    algorithm: waterfall_allocation + dual_variant
    formula: |
      # EVALUATION ORDER IS NORMATIVE. payment_rate_pct is selected from a tier
      # keyed on gross_box_office_cents, and that tier gate is itself expressed
      # as a fraction of Booking.guarantee_cents — so the tier cannot be chosen
      # until the booking's guarantee is known, and the guarantee's effective
      # coverage cannot be described until the tier's payment rate is known.
      # The dependency is resolved by fixing the evaluation order as:
      #   (1) read Booking.guarantee_cents   (2) select payment_rate_pct
      #   (3) compute covered                (4) compute distributor_net
      #   (5) take exhibitor_net as residual
      # Evaluating the tier gate against the already-covered amount instead
      # changes the selected tier for bookings that straddle a gate boundary.

      gate_ratio = Settlement.gross_box_office_cents / Booking.guarantee_cents
      payment_rate_pct = 1.00 when gate_ratio >= 1.5
                       = 0.75 when 1.0 <= gate_ratio < 1.5
                       = 0.50 when gate_ratio < 1.0

      VARIANT ALLOCATION_ORDER:
          covered          = min(Booking.guarantee_cents * payment_rate_pct,
                                 Settlement.gross_box_office_cents)
          residual_cash    = Settlement.gross_box_office_cents - covered
          distributor_net  = covered
                           + round_half_up(residual_cash * Booking.revenue_share_pct)
                           + Settlement.topup_paid_cents
                           + Settlement.adjustment_cents
                           - Settlement.makegood_credit_cents

      VARIANT NET_OFF_TOP:
          distributor_net  = round_half_up((Settlement.gross_box_office_cents + Settlement.topup_paid_cents)
                                           * Booking.revenue_share_pct)
                           + Settlement.adjustment_cents
                           - Settlement.makegood_credit_cents
          # Booking.guarantee_cents feeds only payment_rate_pct's gate, and the
          # gate's result is discarded by this variant — so this variant's net
          # is unchanged if the guarantee is amended, while ALLOCATION_ORDER's
          # net moves. That asymmetry is the variant divergence.

      exhibitor_net        = Settlement.gross_box_office_cents
                           + Settlement.topup_paid_cents
                           + Settlement.adjustment_cents
                           - distributor_net
      invariant_drift_cents = (gross + topup + adjustment) - distributor_net - exhibitor_net   # must be 0
    input_set: "Booking in status CONFIRMED or SETTLED whose every BookingLine has reported attendance; the variant is selected by Circuit.settlement_terms — {NET_30, NET_60} use ALLOCATION_ORDER, {GROSS_ON_GROSS, FOUR_WALL} use NET_OFF_TOP; Booking.guarantee_cents must be > 0 (a zero guarantee never reaches settlement because ERR_GUARANTEE_BELOW_FLOOR blocks it at submit)"
    constants:
      ALLOCATION_ORDER_TERMS: [NET_30, NET_60]
      NET_OFF_TOP_TERMS: [GROSS_ON_GROSS, FOUR_WALL]
      GATE_RATIO_MAX_TIER: 1.5
      GATE_RATIO_MID_TIER: 1.0
      PAYMENT_RATE_TIER_1: 1.00
      PAYMENT_RATE_TIER_2: 0.75
      PAYMENT_RATE_TIER_3: 0.50
    precision: "1 cent, round_half_up on the revenue-share term only; exhibitor_net is a residual and is never independently rounded"
    variants:
      - name: ALLOCATION_ORDER
        when: "Circuit.settlement_terms ∈ {NET_30, NET_60}"
        difference: "The guarantee is paid off the top before the revenue share applies, so cash below the guarantee is not shared."
      - name: NET_OFF_TOP
        when: "Circuit.settlement_terms ∈ {GROSS_ON_GROSS, FOUR_WALL}"
        difference: "The share applies to gross plus top-up, and Booking.guarantee_cents feeds only the discarded tier gate. For gross 3000000, guarantee 1000000, topup 200000, share 0.40, adjustment 0 and makegood 100000 the distributor net is 1180000 here, against 1900000 under ALLOCATION_ORDER — the same settlement data yields a 720000-cent divergence."

  - name: encore_price_derivation
    description: "Derive the encore admission price and decide whether a window may be scheduled."
    trigger: "computed on EncoreWindow create and on the EncoreWindow SCHEDULED transition"
    algorithm: threshold + tiered_rate
    formula: |
      price_cents = Title.ticket_price_cents when non-null else Distributor.ticket_price_default_cents
      encore_price = max(price_cents - ABSOLUTE_DISCOUNT_CENTS,
                         round_half_up(price_cents * RELATIVE_DISCOUNT))
      # the max() is taken AFTER rounding the relative arm

      attendance_ratio = max(BookingLine.sold_tickets / BookingLine.expected_attendance)
                         over COMMITTED lines of the parent Booking
      eligible = (parent Booking.status ∈ {CONFIRMED, SETTLED})
                 AND (attendance_ratio >= ENCORE_ATTENDANCE_MIN)
      # >= : a line that sold exactly 50% of forecast is eligible
      # a parent Booking with a COMMITTED line whose expected_attendance == 0
      # makes attendance_ratio undefined and the window is rejected with
      # ERR_ENCORE_DENOMINATOR_ZERO
    input_set: "EncoreWindow in status DRAFT; parent Booking lines in exhibit_state COMMITTED"
    constants:
      ABSOLUTE_DISCOUNT_CENTS: 500
      RELATIVE_DISCOUNT: 0.55
      ENCORE_ATTENDANCE_MIN: 0.5
    precision: "1 cent, round_half_up on the relative arm"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role names a role declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "the acting role is listed in the endpoint's roles, and for entity_backed roles X-User-ID equals the id of an existing instance of the backing entity"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: auth
    check: "segregation of duties: the acting X-User-ID must differ from the Distributor principal that approved or countered this Booking, and from the Exhibitor that submitted it, whenever the acting role's policy in §1.7 forbids self-dealing"
    error_id: ERR_SOD_VIOLATION
    http_status: 403
    applies_to: ["POST /event-cinema/settlements", "POST /event-cinema/bookings/{id}/close", "POST /event-cinema/feed-events/{id}/confirm"]

  - priority: 4
    category: existence
    check: "every resource identified in the path exists; when several path segments are present they are validated left to right so the leftmost missing resource is the one reported"
    error_id: ERR_BOOKING_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints whose path carries a resource id"

  - priority: 5
    category: existence
    check: "every FK carried in the request body (title_id, circuit_id, theater_id, screening_id, booking_id, title_id on EncoreWindow/ContentDelivery/EncryptionKey) resolves to an existing instance"
    error_id: ERR_TITLE_NOT_FOUND
    http_status: 404
    applies_to: ["POST /event-cinema/bookings", "POST /event-cinema/bookings/{id}/lines", "POST /event-cinema/encore-windows", "POST /event-cinema/content-deliveries", "POST /event-cinema/encryption-keys", "POST /event-cinema/feed-events"]

  - priority: 6
    category: state
    check: "the target resource is in a state from which the requested transition is declared in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: ["POST /event-cinema/bookings/{id}/submit", "POST /event-cinema/bookings/{id}/counter", "POST /event-cinema/bookings/{id}/re-propose", "POST /event-cinema/bookings/{id}/approve", "POST /event-cinema/bookings/{id}/cancel", "POST /event-cinema/bookings/{id}/suspend", "POST /event-cinema/bookings/{id}/resume", "POST /event-cinema/bookings/{id}/confirm", "POST /event-cinema/bookings/{id}/presale-checkpoint", "POST /event-cinema/bookings/{id}/reopen"]

  - priority: 7
    category: state
    check: "the target resource has not already reached a terminal state declared in §1.2"
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: ["POST /event-cinema/bookings/{id}/close", "POST /event-cinema/titles/{id}/archive", "POST /event-cinema/screenings/{id}/report"]

  - priority: 8
    category: state
    check: "the parent Booking must be in status ∈ {ON_SALE, CONFIRMED, SETTLED} before a Screening can report attendance"
    error_id: ERR_BOOKING_NOT_REPORTABLE
    http_status: 409
    applies_to: ["POST /event-cinema/screenings/{id}/report"]

  - priority: 9
    category: state
    check: "the parent BookingLine of the Screening must be in exhibit_state COMMITTED"
    error_id: ERR_BOOKING_LINE_NOT_COMMITTED
    http_status: 409
    applies_to: ["POST /event-cinema/screenings/{id}/report", "POST /event-cinema/bookings/{id}/apply-makegood"]

  - priority: 10
    category: state
    check: "the referenced ContentDelivery must be in status VERIFIED before any EncryptionKey of the booking can be issued"
    error_id: ERR_DELIVERY_NOT_VERIFIED
    http_status: 409
    applies_to: ["POST /event-cinema/keys/{id}/issue"]

  - priority: 11
    category: state
    check: "the Screening the key is attached to must be in state SCHEDULED at issue time"
    error_id: ERR_KEY_NOT_ISSUABLE
    http_status: 409
    applies_to: ["POST /event-cinema/keys/{id}/issue"]

  - priority: 12
    category: state
    check: "a Settlement that has already closed may not be closed again; it must be reopened first"
    error_id: ERR_SETTLEMENT_ALREADY_CLOSED
    http_status: 409
    applies_to: ["POST /event-cinema/settlements/{id}/close", "POST /event-cinema/bookings/{id}/cancel-with-compensation"]

  - priority: 13
    category: business_safety
    check: "the exhibiting Theater.state_code must appear in Title.territory_state_codes for every BookingLine being committed"
    error_id: ERR_TERRITORY_UNLICENSED
    http_status: 422
    applies_to: ["POST /event-cinema/bookings/{id}/lines", "POST /event-cinema/bookings/{id}/approve", "POST /event-cinema/bookings/{id}/confirm"]

  - priority: 14
    category: business_safety
    check: "every showtime must fall inside [Title.rights_start_utc, Title.rights_end_utc] and the Booking.on_sale_at must precede the first showtime"
    error_id: ERR_RIGHTS_WINDOW_VIOLATION
    http_status: 422
    applies_to: ["POST /event-cinema/bookings", "POST /event-cinema/bookings/{id}/confirm", "POST /event-cinema/encore-windows"]

  - priority: 15
    category: business_safety
    check: "the current clock instant must be strictly before Title.rights_end_utc for any mutation that commits screens, issues keys, or confirms a booking"
    error_id: ERR_RIGHTS_EXPIRED
    http_status: 422
    applies_to: ["POST /event-cinema/bookings/{id}/approve", "POST /event-cinema/bookings/{id}/confirm", "POST /event-cinema/keys/{id}/issue", "POST /event-cinema/titles/{id}/publish", "POST /event-cinema/titles/{id}/reopen-bookings"]

  - priority: 16
    category: business_constraint
    check: "temporal overlap of auditorium occupation: a candidate Screening whose [starts_at, ends_at) interval intersects an existing SCHEDULED Screening of the same Theater in a different Booking whose own status ∈ {ON_SALE, CONFIRMED}, evaluated as candidate.starts_at < existing.ends_at AND candidate.ends_at > existing.starts_at — adjacency at an exact endpoint is allowed"
    error_id: ERR_SCREEN_OVERLAP_CONFLICT
    http_status: 409
    applies_to: ["POST /event-cinema/bookings/{id}/approve", "POST /event-cinema/bookings/{id}/confirm", "POST /event-cinema/screenings"]

  - priority: 17
    category: business_constraint
    check: "aggregate screen-buffer overlap, using half-open buffered intervals: the occupancy of a candidate Screening is [starts_at, ends_at + Theater.showtime_buffer_minutes) and it must not intersect the buffered occupancy of ANY other SCHEDULED Screening of the same Theater, whatever that booking's status — a candidate starting exactly at an existing ends_at + buffer is allowed, one starting a minute earlier is rejected"
    error_id: ERR_SCREEN_BUFFER_CONFLICT
    http_status: 409
    applies_to: ["POST /event-cinema/bookings/{id}/approve", "POST /event-cinema/bookings/{id}/confirm", "POST /event-cinema/screenings"]

  - priority: 18
    category: business_constraint
    check: "temporal overlap of key validity: a new EncryptionKey whose [not_valid_before_utc, not_valid_after_utc] interval intersects an existing non-REVOKED key on the same Screening is rejected"
    error_id: ERR_KEY_WINDOW_OVERLAP
    http_status: 409
    applies_to: ["POST /event-cinema/encryption-keys"]

  - priority: 19
    category: business_constraint
    check: "a Booking may not be confirmed if the title's rights window closes before the last showtime's ends_at"
    error_id: ERR_RIGHTS_WINDOW_VIOLATION
    http_status: 422
    applies_to: ["POST /event-cinema/bookings/{id}/confirm"]

  - priority: 20
    category: business_constraint
    check: "Circuit.committed_screens_balance + the screens being newly committed must not exceed Circuit.screen_pool_total"
    error_id: ERR_SCREEN_POOL_EXHAUSTED
    http_status: 409
    applies_to: ["POST /event-cinema/bookings/{id}/approve", "POST /event-cinema/bookings/{id}/resume"]

  - priority: 21
    category: business_constraint
    check: "the screens being committed for a single Booking must not exceed Title.max_screen_commitment"
    error_id: ERR_MAX_SCREEN_COMMITMENT_EXCEEDED
    http_status: 422
    applies_to: ["POST /event-cinema/bookings/{id}/lines", "POST /event-cinema/bookings/{id}/submit", "POST /event-cinema/bookings/{id}/approve"]

  - priority: 22
    category: business_constraint
    check: "Booking.showtime_count must be 1 or 2 and showtime_plan must contain exactly that many well-formed elements with unique index values and dates inside the rights window"
    error_id: ERR_SHOWTIME_PLAN_INVALID
    http_status: 400
    applies_to: ["POST /event-cinema/bookings", "PUT /event-cinema/bookings/{id}"]

  - priority: 23
    category: business_constraint
    check: "the negotiation counter count on this Booking is already 3; a fourth counter is refused"
    error_id: ERR_COUNTER_LIMIT_REACHED
    http_status: 409
    applies_to: ["POST /event-cinema/bookings/{id}/counter"]

  - priority: 24
    category: business_constraint
    check: "a Booking may not carry two BookingLines for the same Theater; the venue commits to the run exactly once"
    error_id: ERR_DUPLICATE_BOOKING_LINE
    http_status: 409
    applies_to: ["POST /event-cinema/bookings/{id}/lines", "POST /event-cinema/bookings/{id}/approve", "POST /event-cinema/bookings/{id}/confirm"]

  - priority: 25
    category: business_constraint
    check: "Circuit.circuit_code must be unique across all Circuits"
    error_id: ERR_DUPLICATE_CIRCUIT_CODE
    http_status: 409
    applies_to: ["POST /event-cinema/circuits"]

  - priority: 26
    category: business_fiscal
    check: "Booking.guarantee_cents must be at or above Distributor.guarantee_floor_cents"
    error_id: ERR_GUARANTEE_BELOW_FLOOR
    http_status: 422
    applies_to: ["POST /event-cinema/bookings", "POST /event-cinema/bookings/{id}/submit", "POST /event-cinema/bookings/{id}/counter", "POST /event-cinema/bookings/{id}/re-propose"]

  - priority: 27
    category: business_fiscal
    check: "Booking.guarantee_cents must be at or below Booking.guarantee_ceiling_cents as derived by guarantee_floor_derivation in the variant live for the Booking's current status"
    error_id: ERR_GUARANTEE_ABOVE_CEILING
    http_status: 422
    applies_to: ["POST /event-cinema/bookings/{id}/approve", "POST /event-cinema/bookings/{id}/resume", "POST /event-cinema/bookings/{id}/submit"]

  - priority: 28
    category: business_fiscal
    check: "Booking.committed_screens_total must be at or above Booking.min_screens before the booking may submit or confirm"
    error_id: ERR_MIN_SCREENS_NOT_MET
    http_status: 422
    applies_to: ["POST /event-cinema/bookings/{id}/submit", "POST /event-cinema/bookings/{id}/confirm"]

  - priority: 30
    category: business_fiscal
    check: "every BookingLine of the Booking must have reported attendance before a Settlement may be created"
    error_id: ERR_UNREPORTED_ATTENDANCE
    http_status: 422
    applies_to: ["POST /event-cinema/settlements"]

  - priority: 31
    category: business_fiscal
    check: "FeedEvent.outage_minutes must be at least 5 before the failure may be confirmed"
    error_id: ERR_FEED_OUTAGE_TOO_SHORT
    http_status: 422
    applies_to: ["POST /event-cinema/feed-events/{id}/confirm"]

  - priority: 32
    category: business_fiscal
    check: "the line nominated for make-good credit must belong to the booking named in the path and must carry at least one ruined screening"
    error_id: ERR_MAKEGOOD_LINE_NOT_APPLICABLE
    http_status: 422
    applies_to: ["POST /event-cinema/bookings/{id}/apply-makegood"]

  - priority: 33
    category: business_fiscal
    check: "the parent Booking must have at least one COMMITTED line with expected_attendance > 0 before an encore window may be scheduled"
    error_id: ERR_ENCORE_DENOMINATOR_ZERO
    http_status: 422
    applies_to: ["POST /event-cinema/encore-windows", "POST /event-cinema/encore-windows/{id}/schedule"]

  - priority: 34
    category: business_fiscal
    check: "EncoreWindow.encore_ticket_price_cents must be strictly below EncoreWindow.standard_ticket_price_cents and the window must close no later than Title.rights_end_utc"
    error_id: ERR_ENCORE_WINDOW_INVALID
    http_status: 422
    applies_to: ["POST /event-cinema/encore-windows"]

  - priority: 35
    category: business_fiscal
    check: "the parent Booking must be CONFIRMED or SETTLED and its best line must reach an attendance ratio of at least 0.5 before an encore may be scheduled"
    error_id: ERR_ENCORE_NOT_ELIGIBLE
    http_status: 422
    applies_to: ["POST /event-cinema/encore-windows/{id}/schedule"]

  - priority: 37
    category: business_temporal
    check: "the content package's scheduled_delivery_utc plus the delivery-method lead time must land at or before the earliest SCHEDULED Screening.starts_at of the booking, per delivery_lead_verification; a booking with no SCHEDULED screening can never be verified"
    error_id: ERR_DELIVERY_LEAD_VIOLATION
    http_status: 422
    applies_to: ["POST /event-cinema/content-deliveries/{id}/verify"]

  - priority: 36
    category: business_fiscal
    check: "optimistic concurrency: the expected_<parent>_version supplied in the body must equal the parent entity's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: ["POST /event-cinema/bookings/{id}/lines", "POST /event-cinema/bookings/{id}/submit", "POST /event-cinema/bookings/{id}/approve", "POST /event-cinema/encore-windows", "POST /event-cinema/content-deliveries"]

# =============================================================================
# §1.0 Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- Distributors -----------------------------------------------------------
  - method: POST
    path: "/event-cinema/distributors"
    description: "Register a content licensor with its guarantee floor and default ticket price."
    roles: [PlatformOps]
    code: 201
    input: ["distributor_name", "contact_email", "settlement_currency?", "guarantee_floor_cents", "ticket_price_default_cents"]
    output: Distributor
    side_effects: ["Distributor.status := ACTIVE", "recompute Distributor.bookable_title_count := 0"]
  - method: POST
    path: "/event-cinema/distributors/{id}/suspend"
    description: "Suspend a distributor so no further title may be published under it."
    roles: [PlatformOps]
    code: 200
    input: []
    output: Distributor
    side_effects: ["Distributor.status := SUSPENDED"]
  - method: POST
    path: "/event-cinema/distributors/{id}/reactivate"
    description: "Return a suspended distributor to ACTIVE."
    roles: [PlatformOps]
    code: 200
    input: []
    output: Distributor
    side_effects: ["Distributor.status := ACTIVE"]
  - method: GET
    path: "/event-cinema/distributors/{id}"
    description: "Read one distributor."
    roles: [PlatformOps, ProgrammingManager, FinanceOps, Exhibitor, Distributor]
    code: 200
    input: []
    output: Distributor
    side_effects: []
  - method: GET
    path: "/event-cinema/distributors"
    description: "List distributors, newest first by created_at; paginated."
    roles: [PlatformOps, ProgrammingManager, FinanceOps]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Distributor[]
    side_effects: []
  - method: GET
    path: "/event-cinema/distributors/{id}/bookings"
    description: "List every booking negotiated by this distributor principal, ordered by created_at ASC; paginated."
    roles: [PlatformOps, ProgrammingManager, Distributor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Booking[]
    side_effects: []

  # --- Circuits ---------------------------------------------------------------
  - method: POST
    path: "/event-cinema/circuits"
    description: "Register an exhibitor circuit."
    roles: [PlatformOps]
    code: 201
    input: ["circuit_name", "circuit_code", "credit_rating", "settlement_terms", "screen_pool_total", "on_sale_lead_days_min?"]
    output: Circuit
    side_effects: ["Circuit.status := PENDING", "Circuit.committed_screens_balance := 0"]
  - method: GET
    path: "/event-cinema/circuits/{id}"
    description: "Read one circuit."
    roles: [PlatformOps, ProgrammingManager, FinanceOps, Exhibitor, Distributor, Theater]
    code: 200
    input: []
    output: Circuit
    side_effects: []
  - method: GET
    path: "/event-cinema/circuits"
    description: "List circuits, ordered by circuit_code ASC; paginated."
    roles: [PlatformOps, ProgrammingManager, FinanceOps]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Circuit[]
    side_effects: []
  - method: POST
    path: "/event-cinema/circuits/{id}/accredit"
    description: "Move a PENDING or SUSPENDED circuit to ACCREDITED so it may commit screens."
    roles: [PlatformOps]
    code: 200
    input: []
    output: Circuit
    side_effects: ["Circuit.status := ACCREDITED"]
  - method: POST
    path: "/event-cinema/circuits/{id}/suspend"
    description: "Suspend a circuit; unwinds every non-committed booking it holds."
    roles: [PlatformOps]
    code: 200
    input: []
    output: Circuit
    side_effects:
      - "Circuit.status := SUSPENDED"
      - "every Booking of this Circuit in status ∈ {DRAFT, PENDING_APPROVAL, COUNTERED, APPROVED} → CANCELLED"
      - "each such Booking's BookingLines with exhibit_state ∈ {PROPOSED, COMMITTED} → RELEASED"
      - "recompute Circuit.committed_screens_balance"

  # --- Theaters ---------------------------------------------------------------
  - method: POST
    path: "/event-cinema/theaters"
    description: "Register a venue inside an existing circuit."
    roles: [Exhibitor, PlatformOps]
    code: 201
    input: ["circuit_id", "theater_name", "city", "state_code", "timezone", "seats_total", "screen_count", "showtime_buffer_minutes?"]
    output: Theater
    side_effects: ["Theater.status := ACTIVE", "Theater.pending_rekey_count := 0"]
  - method: GET
    path: "/event-cinema/theaters/{id}"
    description: "Read one theater."
    roles: [PlatformOps, ProgrammingManager, FinanceOps, Exhibitor, Theater, Distributor]
    code: 200
    input: []
    output: Theater
    side_effects: []
  - method: GET
    path: "/event-cinema/theaters"
    description: "List theaters; filter by owning circuit. Ordered by state_code ASC then created_at ASC."
    roles: [PlatformOps, ProgrammingManager, Exhibitor, Theater]
    code: 200
    input: ["circuit_id?", "status?", "limit?", "offset?"]
    output: Theater[]
    side_effects: []
  - method: POST
    path: "/event-cinema/theaters/{id}/go-dark"
    description: "Take a venue out of service; its scheduled screenings are voided and their keys revoked."
    roles: [Exhibitor, PlatformOps]
    code: 200
    input: []
    output: Theater
    side_effects:
      - "Theater.status := DARK"
      - "every Screening of this Theater in state SCHEDULED → SKIPPED_CANCELLED"
      - "each such Screening drives its EncryptionKeys to issuance_status REVOKED and increments Theater.pending_rekey_count"
      - "recompute Circuit.committed_screens_balance"

  # --- Titles -----------------------------------------------------------------
  - method: POST
    path: "/event-cinema/titles"
    description: "Acquire a title into a distributor's catalogue with its rights window and territory grants."
    roles: [ProgrammingManager]
    code: 201
    input: ["distributor_id", "title_name", "content_type", "is_live", "duration_minutes", "rights_start_utc", "rights_end_utc", "territory_state_codes", "max_screen_commitment", "ticket_price_cents?"]
    output: Title
    side_effects: ["Title.status := DRAFT", "recompute Title.bookable_window_days", "recompute Title.booking_count := 0"]
  - method: GET
    path: "/event-cinema/titles/{id}"
    description: "Read one title; also evaluates the system rights-expiry transition when the clock has passed rights_end_utc."
    roles: [PlatformOps, ProgrammingManager, FinanceOps, Exhibitor, Distributor]
    code: 200
    input: []
    output: Title
    side_effects: ["may fire the system RIGHTS_EXPIRED transition when current clock instant >= Title.rights_end_utc"]
  - method: GET
    path: "/event-cinema/titles"
    description: "List titles; filter by distributor or status. Ordered by created_at ASC; paginated."
    roles: [PlatformOps, ProgrammingManager, FinanceOps, Exhibitor]
    code: 200
    input: ["distributor_id?", "status?", "limit?", "offset?"]
    output: Title[]
    side_effects: []
  - method: PUT
    path: "/event-cinema/titles/{id}"
    description: "Amend a title's mutable commercial terms."
    roles: [ProgrammingManager]
    code: 200
    input: ["title_name?", "ticket_price_cents?", "max_screen_commitment?", "rights_end_utc?"]
    output: Title
    side_effects: ["recompute Title.bookable_window_days"]
  - method: POST
    path: "/event-cinema/titles/{id}/publish"
    description: "Move a DRAFT title to BOOKABLE so bookings may be opened against it."
    roles: [ProgrammingManager]
    code: 200
    input: []
    output: Title
    side_effects: ["Title.status := BOOKABLE", "recompute Distributor.bookable_title_count"]
  - method: POST
    path: "/event-cinema/titles/{id}/unpublish"
    description: "Return a BOOKABLE title to DRAFT while it carries no bookings."
    roles: [ProgrammingManager]
    code: 200
    input: []
    output: Title
    side_effects: ["Title.status := DRAFT", "recompute Distributor.bookable_title_count"]
  - method: POST
    path: "/event-cinema/titles/{id}/clear"
    description: "Lock a BOOKABLE title against new bookings without disturbing existing ones."
    roles: [ProgrammingManager]
    code: 200
    input: []
    output: Title
    side_effects: ["Title.status := CLEARED"]
  - method: POST
    path: "/event-cinema/titles/{id}/reopen-bookings"
    description: "Return a CLEARED title to BOOKABLE."
    roles: [ProgrammingManager]
    code: 200
    input: []
    output: Title
    side_effects: ["Title.status := BOOKABLE", "recompute Distributor.bookable_title_count"]
  - method: POST
    path: "/event-cinema/titles/{id}/withdraw"
    description: "Pull a title from the market and cascade-cancel every booking that has not reached ON_SALE."
    roles: [ProgrammingManager]
    code: 200
    input: []
    output: Title
    side_effects:
      - "Title.status := WITHDRAWN"
      - "every Booking of this Title in status ∈ {PENDING_APPROVAL, COUNTERED, APPROVED} → CANCELLED"
      - "each such Booking's BookingLines with exhibit_state ∈ {PROPOSED, COMMITTED} → RELEASED"
      - "each such Booking's Screenings with state == SCHEDULED → SKIPPED_CANCELLED"
      - "each such Screening drives its EncryptionKeys to issuance_status REVOKED and increments the owning Theater.pending_rekey_count"
      - "recompute Circuit.committed_screens_balance"
      - "recompute Distributor.bookable_title_count"
  - method: POST
    path: "/event-cinema/titles/{id}/archive"
    description: "Retire a withdrawn or expired title that carries no bookings."
    roles: [ProgrammingManager]
    code: 200
    input: []
    output: Title
    side_effects: ["Title.status := ARCHIVED", "recompute Distributor.bookable_title_count"]

  # --- Bookings ---------------------------------------------------------------
  - method: POST
    path: "/event-cinema/bookings"
    description: "Open a negotiation for a title at a circuit for one or two showtimes. negotiating_user_id is stamped from X-User-ID."
    roles: [Exhibitor]
    code: 201
    input: [title_id, circuit_id, showtime_count, showtime_plan, on_sale_at, guarantee_cents, revenue_share_pct, min_screens, pre_sale_threshold]
    output: Booking
    side_effects:
      - "Booking.status := DRAFT"
      - "Booking.negotiating_user_id := X-User-ID header"
      - "recompute Booking.guarantee_ceiling_cents via guarantee_floor_derivation"
      - "recompute Booking.committed_screens_total := 0"
      - "recompute Booking.pre_sale_tickets := 0"
  - method: GET
    path: "/event-cinema/bookings/{id}"
    description: "Read one booking."
    roles: [PlatformOps, ProgrammingManager, FinanceOps, Exhibitor, Distributor, Theater]
    code: 200
    input: []
    output: Booking
    side_effects: []
  - method: GET
    path: "/event-cinema/bookings"
    description: "List bookings; filter by title, circuit or status. Ordered by created_at ASC; paginated."
    roles: [PlatformOps, ProgrammingManager, FinanceOps, Exhibitor, Distributor]
    code: 200
    input: ["title_id?", "circuit_id?", "status?", "limit?", "offset?"]
    output: Booking[]
    side_effects: []
  - method: PUT
    path: "/event-cinema/bookings/{id}"
    description: "Amend a DRAFT booking's commercial terms under optimistic concurrency."
    roles: [Exhibitor]
    code: 200
    input: ["showtime_count?", "showtime_plan?", "on_sale_at?", "guarantee_cents?", "revenue_share_pct?", "min_screens?", "pre_sale_threshold?", "expected_booking_version"]
    output: Booking
    side_effects: ["recompute Booking.guarantee_ceiling_cents via guarantee_floor_derivation", "increments Booking.version by 1"]
  - method: POST
    path: "/event-cinema/bookings/{id}/lines"
    description: "Propose a venue commitment line on a DRAFT booking, under optimistic concurrency on the booking."
    roles: [Exhibitor]
    code: 201
    input: [theater_id, committed_screens, expected_attendance, expected_booking_version]
    output: BookingLine
    side_effects:
      - "BookingLine.exhibit_state := PROPOSED"
      - "recompute Booking.committed_screens_total"
      - "increments Booking.version by 1"
  - method: GET
    path: "/event-cinema/bookings/{id}/lines"
    description: "List the commitment lines of a booking, ordered by created_at ASC."
    roles: [PlatformOps, ProgrammingManager, FinanceOps, Exhibitor, Distributor, Theater]
    code: 200
    input: ["exhibit_state?", "limit?", "offset?"]
    output: BookingLine[]
    side_effects: []
  - method: GET
    path: "/event-cinema/booking-lines/{id}"
    description: "Read one commitment line."
    roles: [PlatformOps, ProgrammingManager, FinanceOps, Exhibitor, Distributor, Theater]
    code: 200
    input: []
    output: BookingLine
    side_effects: []
  - method: GET
    path: "/event-cinema/booking-lines"
    description: "List commitment lines; filter by booking or by venue. Ordered by created_at ASC."
    roles: [PlatformOps, ProgrammingManager, Exhibitor, Theater]
    code: 200
    input: ["booking_id?", "theater_id?", "exhibit_state?", "limit?", "offset?"]
    output: BookingLine[]
    side_effects: []
  - method: POST
    path: "/event-cinema/bookings/{id}/presale-sales"
    description: "Record presale tickets sold for this booking from the ticketing feed."
    roles: [Theater, PlatformOps]
    code: 200
    input: [quantity]
    output: Booking
    side_effects: ["Booking.pre_sale_tickets += quantity"]
  - method: POST
    path: "/event-cinema/bookings/{id}/submit"
    description: "Send a DRAFT booking into approval, having met the minimum screen count."
    roles: [Exhibitor]
    code: 200
    input: [expected_booking_version]
    output: Booking
    side_effects:
      - "Booking.status := PENDING_APPROVAL"
      - "recompute Booking.guarantee_ceiling_cents"
      - "recompute Booking.live_feed_event_count"
      - "increments Booking.version by 1"
  - method: POST
    path: "/event-cinema/bookings/{id}/counter"
    description: "The distributor counters with different guarantee and revenue-share terms; at most three counters per booking."
    roles: [Distributor]
    code: 200
    input: [proposed_guarantee_cents, proposed_revenue_share_pct, expected_booking_version]
    output: Booking
    side_effects:
      - "Booking.status := COUNTERED"
      - "Booking.guarantee_cents := proposed_guarantee_cents"
      - "Booking.revenue_share_pct := proposed_revenue_share_pct"
      - "increments Booking.version by 1"
  - method: POST
    path: "/event-cinema/bookings/{id}/re-propose"
    description: "The exhibitor answers a counter and returns the booking to approval."
    roles: [Exhibitor]
    code: 200
    input: ["proposed_guarantee_cents?", "proposed_revenue_share_pct?", "expected_booking_version"]
    output: Booking
    side_effects:
      - "Booking.status := PENDING_APPROVAL"
      - "Booking.guarantee_cents := proposed_guarantee_cents when supplied"
      - "increments Booking.version by 1"
  - method: POST
    path: "/event-cinema/bookings/{id}/approve"
    description: "The distributor commits one proposed venue line, consuming screens from the circuit pool and minting that line's screenings."
    roles: [Distributor]
    code: 200
    input: [line_id, expected_booking_version]
    output: Booking
    side_effects:
      - "Booking.status := APPROVED"
      - "BookingLine.exhibit_state PROPOSED → COMMITTED"
      - "recompute Circuit.committed_screens_balance"
      - "recompute Booking.guarantee_applied_cents via guarantee_allocation"
      - "synthesize one Screening per element of Booking.showtime_plan for the approved line"
      - "recompute Booking.committed_screens_total"
      - "increments Booking.version by 1"
  - method: POST
    path: "/event-cinema/bookings/{id}/cancel"
    description: "Cancel a booking and unwind whatever it has committed; a CONFIRMED booking releases screens without a cash make-good."
    roles: [Exhibitor, Distributor]
    code: 200
    input: [expected_booking_version]
    output: Booking
    side_effects:
      - "Booking.status := CANCELLED"
      - "every BookingLine in exhibit_state ∈ {PROPOSED, COMMITTED} → RELEASED"
      - "every Screening of this Booking in state SCHEDULED → SKIPPED_CANCELLED"
      - "each such Screening drives its EncryptionKeys to issuance_status REVOKED and increments the owning Theater.pending_rekey_count"
      - "recompute Circuit.committed_screens_balance"
      - "increments Booking.version by 1"
  - method: POST
    path: "/event-cinema/bookings/{id}/cancel-with-compensation"
    description: "Cancel a confirmed booking and unwind its screenings and keys as a compensating action."
    roles: [Distributor]
    code: 200
    input: [expected_booking_version]
    output: Booking
    side_effects:
      - "Booking.status := CANCELLED"
      - "every BookingLine in exhibit_state COMMITTED → RELEASED"
      - "every Screening of this Booking in state SCHEDULED → SKIPPED_CANCELLED"
      - "each such Screening drives its EncryptionKeys to issuance_status REVOKED and increments the owning Theater.pending_rekey_count"
      - "recompute Circuit.committed_screens_balance"
      - "increments Booking.version by 1"
  - method: POST
    path: "/event-cinema/bookings/{id}/suspend"
    description: "Place an on-sale booking on hold, releasing screens and voiding screenings pending a resume."
    roles: [Distributor]
    code: 200
    input: [expected_booking_version]
    output: Booking
    side_effects:
      - "Booking.status := ON_HOLD"
      - "every BookingLine in exhibit_state COMMITTED → RELEASED"
      - "every Screening of this Booking in state SCHEDULED → VOID"
      - "each such Screening drives its EncryptionKeys to issuance_status REVOKED and increments the owning Theater.pending_rekey_count"
      - "recompute Circuit.committed_screens_balance"
      - "increments Booking.version by 1"
  - method: POST
    path: "/event-cinema/bookings/{id}/resume"
    description: "Lift a hold, re-committing lines and re-minting screenings."
    roles: [Distributor]
    code: 200
    input: [expected_booking_version]
    output: Booking
    side_effects:
      - "Booking.status := ON_SALE"
      - "every BookingLine in exhibit_state RELEASED → COMMITTED"
      - "synthesize a fresh Screening per element of Booking.showtime_plan for each re-committed line"
      - "recompute Circuit.committed_screens_balance"
      - "increments Booking.version by 1"
  - method: POST
    path: "/event-cinema/bookings/{id}/confirm"
    description: "Convert a cleared presale into a firm engagement once the threshold is met."
    roles: [PlatformOps]
    code: 200
    input: [expected_booking_version]
    output: Booking
    side_effects:
      - "Booking.status := CONFIRMED"
      - "recompute Circuit.committed_screens_balance"
      - "recompute Booking.guarantee_applied_cents"
      - "increments Booking.version by 1"
  - method: POST
    path: "/event-cinema/bookings/{id}/presale-checkpoint"
    description: "Evaluate the presale threshold at on_sale_at + 14 days; a shortfall self-cancels the booking."
    roles: [PlatformOps]
    code: 200
    input: [expected_booking_version]
    output: Booking
    side_effects:
      - "Booking.status := CANCELLED on shortfall, otherwise unchanged"
      - "recompute Booking.pre_sale_tickets"
      - "increments Booking.version by 1"
  - method: POST
    path: "/event-cinema/bookings/{id}/release-screens"
    description: "Release one committed line's screens without cancelling the booking — the compensating action for the approve transition."
    roles: [Distributor]
    code: 200
    input: [line_id, expected_booking_version]
    output: BookingLine
    side_effects:
      - "BookingLine.exhibit_state COMMITTED → RELEASED"
      - "every Screening of that line in state SCHEDULED → SKIPPED_CANCELLED"
      - "each such Screening drives its EncryptionKeys to issuance_status REVOKED and increments the owning Theater.pending_rekey_count"
      - "recompute Booking.guarantee_applied_cents via guarantee_allocation"
      - "recompute Circuit.committed_screens_balance"
      - "increments Booking.version by 1"
  - method: POST
    path: "/event-cinema/bookings/{id}/apply-makegood"
    description: "Apply make-good credit to one line for a confirmed feed failure."
    roles: [PlatformOps]
    code: 200
    input: [line_id, feed_event_id, expected_booking_version]
    output: Booking
    side_effects:
      - "BookingLine.credit_issued_cents += makegood_credit_derivation for that line"
      - "recompute Booking.makegood_credit_cents"
      - "recompute Booking.feed_failure_credit_cents"
      - "increments Booking.version by 1"
  - method: POST
    path: "/event-cinema/bookings/{id}/reopen"
    description: "Return a settled booking to CONFIRMED after its settlement was reopened."
    roles: [PlatformOps]
    code: 200
    input: [settlement_id, expected_booking_version]
    output: Booking
    side_effects: ["Booking.status := CONFIRMED", "Booking.settled_at := null", "increments Booking.version by 1"]
  - method: POST
    path: "/event-cinema/bookings/{id}/close"
    description: "Close a booking permanently once nothing is scheduled and nothing is unsettled."
    roles: [PlatformOps]
    code: 200
    input: [expected_booking_version]
    output: Booking
    side_effects: ["Booking.status := TERMINAL", "recompute Circuit.committed_screens_balance", "increments Booking.version by 1"]

  # --- Screenings -------------------------------------------------------------
  - method: POST
    path: "/event-cinema/screenings"
    description: "Attach an encore screening to a confirmed booking, inside a scheduled encore window."
    roles: [PlatformOps, Exhibitor]
    code: 201
    input: ["booking_id", "theater_id", "auditorium", "starts_at", "ends_at", "is_encore?"]
    output: Screening
    side_effects: ["Screening.state := SCHEDULED", "recompute EncoreWindow.encore_screening_count"]
  - method: GET
    path: "/event-cinema/screenings/{id}"
    description: "Read one screening."
    roles: [PlatformOps, ProgrammingManager, Exhibitor, Distributor, Theater]
    code: 200
    input: []
    output: Screening
    side_effects: []
  - method: GET
    path: "/event-cinema/screenings"
    description: "List screenings; filter by booking, venue or state. Ordered by starts_at ASC, ties by created_at ASC."
    roles: [PlatformOps, ProgrammingManager, Theater, Distributor]
    code: 200
    input: ["booking_id?", "theater_id?", "state?", "is_encore?", "limit?", "offset?"]
    output: Screening[]
    side_effects: []
  - method: POST
    path: "/event-cinema/screenings/{id}/report"
    description: "File the exhibited outcome and headcount for a screening."
    roles: [Theater]
    code: 200
    input: [reported_attendance, reported_outcome]
    output: Screening
    side_effects:
      - "Screening.state := reported_outcome"
      - "Screening.reported_attendance := reported_attendance"
      - "recompute BookingLine.sold_tickets"
      - "recompute Booking.pre_sale_tickets"

  # --- Encryption keys --------------------------------------------------------
  - method: POST
    path: "/event-cinema/encryption-keys"
    description: "Mint an unissued key bound to a single screening, with a validity interval."
    roles: [PlatformOps]
    code: 201
    input: [screening_id, not_valid_before_utc, not_valid_after_utc]
    output: EncryptionKey
    side_effects: ["EncryptionKey.issuance_status := PENDING", "recompute EncryptionKey.validity_state"]
  - method: GET
    path: "/event-cinema/encryption-keys/{id}"
    description: "Read one key; key_ref only, never key material."
    roles: [PlatformOps, ContentOfficer, Theater]
    code: 200
    input: []
    output: EncryptionKey
    side_effects: []
  - method: GET
    path: "/event-cinema/encryption-keys"
    description: "List keys; filter by screening. Ordered by created_at ASC."
    roles: [PlatformOps, ContentOfficer]
    code: 200
    input: ["screening_id?", "title_id?", "issuance_status?", "limit?", "offset?"]
    output: EncryptionKey[]
    side_effects: []
  - method: POST
    path: "/event-cinema/keys/{id}/issue"
    description: "Release a key to a venue once its content package has verified and its screening is still scheduled."
    roles: [PlatformOps, ContentOfficer]
    code: 200
    input: []
    output: EncryptionKey
    side_effects: ["EncryptionKey.issuance_status := ISSUED", "EncryptionKey.key_ref := system-minted reference", "recompute EncryptionKey.validity_state"]
  - method: POST
    path: "/event-cinema/keys/{id}/revoke"
    description: "Revoke a key so it can no longer unlock its screening."
    roles: [PlatformOps, ContentOfficer]
    code: 200
    input: [revocation_reason]
    output: EncryptionKey
    side_effects: ["EncryptionKey.issuance_status := REVOKED", "EncryptionKey.revocation_reason := revocation_reason", "increment the owning Theater.pending_rekey_count by 1"]

  # --- Content deliveries -----------------------------------------------------
  - method: POST
    path: "/event-cinema/content-deliveries"
    description: "Register the satellite or file package that will carry a booking's content, under optimistic concurrency on the booking."
    roles: [PlatformOps, ContentOfficer]
    code: 201
    input: [booking_id, delivery_method, content_checksum, scheduled_delivery_utc, expected_booking_version]
    output: ContentDelivery
    side_effects: ["ContentDelivery.status := SCHEDULED", "increments Booking.version by 1"]
  - method: GET
    path: "/event-cinema/content-deliveries/{id}"
    description: "Read one delivery package."
    roles: [PlatformOps, ContentOfficer, Theater]
    code: 200
    input: []
    output: ContentDelivery
    side_effects: []
  - method: GET
    path: "/event-cinema/content-deliveries"
    description: "List deliveries; filter by booking or status. Ordered by created_at ASC."
    roles: [PlatformOps, ContentOfficer]
    code: 200
    input: ["booking_id?", "title_id?", "status?", "limit?", "offset?"]
    output: ContentDelivery[]
    side_effects: []
  - method: POST
    path: "/event-cinema/content-deliveries/{id}/mark-delivered"
    description: "Record that a package arrived, storing the checksum actually received."
    roles: [PlatformOps, ContentOfficer]
    code: 200
    input: [delivered_checksum]
    output: ContentDelivery
    side_effects: ["ContentDelivery.status := DELIVERED", "ContentDelivery.delivered_at_utc := current clock instant", "ContentDelivery.delivered_checksum := delivered_checksum"]
  - method: POST
    path: "/event-cinema/content-deliveries/{id}/mark-failed"
    description: "Record that a package arrived corrupt or never arrived, so it can never be verified."
    roles: [PlatformOps, ContentOfficer]
    code: 200
    input: []
    output: ContentDelivery
    side_effects: ["ContentDelivery.status := FAILED"]
  - method: POST
    path: "/event-cinema/content-deliveries/{id}/verify"
    description: "Verify a delivered package so its booking's keys may be issued. Enforces delivery_lead_verification: the scheduled delivery instant plus the method lead time must land at or before the earliest scheduled screening start."
    roles: [PlatformOps, ContentOfficer]
    code: 200
    input: []
    output: ContentDelivery
    side_effects: ["ContentDelivery.status := VERIFIED"]

  # --- Encore windows ---------------------------------------------------------
  - method: POST
    path: "/event-cinema/encore-windows"
    description: "Propose an encore run for a title after its opening night, under optimistic concurrency on the parent booking."
    roles: [Distributor, ProgrammingManager]
    code: 201
    input: [booking_id, window_start_utc, window_end_utc, standard_ticket_price_cents, encore_ticket_price_cents, planned_screen_count, expected_booking_version]
    output: EncoreWindow
    side_effects: ["EncoreWindow.status := DRAFT", "recompute EncoreWindow.encore_screening_count := 0", "increments Booking.version by 1"]
  - method: GET
    path: "/event-cinema/encore-windows/{id}"
    description: "Read one encore window."
    roles: [PlatformOps, ProgrammingManager, FinanceOps, Exhibitor, Distributor]
    code: 200
    input: []
    output: EncoreWindow
    side_effects: []
  - method: GET
    path: "/event-cinema/encore-windows"
    description: "List encore windows; filter by booking. Ordered by window_start_utc ASC."
    roles: [PlatformOps, ProgrammingManager, FinanceOps]
    code: 200
    input: ["booking_id?", "title_id?", "status?", "limit?", "offset?"]
    output: EncoreWindow[]
    side_effects: []
  - method: POST
    path: "/event-cinema/encore-windows/{id}/schedule"
    description: "Open a draft encore window once the opening run has drawn well enough."
    roles: [ProgrammingManager]
    code: 200
    input: []
    output: EncoreWindow
    side_effects: ["EncoreWindow.status := SCHEDULED"]
  - method: POST
    path: "/event-cinema/encore-windows/{id}/withdraw"
    description: "Withdraw a scheduled encore window before its first screening."
    roles: [ProgrammingManager]
    code: 200
    input: []
    output: EncoreWindow
    side_effects: ["EncoreWindow.status := WITHDRAWN", "every Screening of this window in state SCHEDULED → SKIPPED_CANCELLED"]

  # --- Feed events ------------------------------------------------------------
  - method: POST
    path: "/event-cinema/feed-events"
    description: "File a live-feed failure against a booking so the contingency policy can be applied."
    roles: [PlatformOps, Theater]
    code: 201
    input: [booking_id, failure_type, detected_at_utc, outage_minutes]
    output: FeedEvent
    side_effects: ["FeedEvent.state := DETECTED", "recompute FeedEvent.affected_screening_count"]
  - method: GET
    path: "/event-cinema/feed-events/{id}"
    description: "Read one feed failure."
    roles: [PlatformOps, ProgrammingManager, Distributor]
    code: 200
    input: []
    output: FeedEvent
    side_effects: []
  - method: GET
    path: "/event-cinema/feed-events"
    description: "List feed failures; filter by booking. Ordered by detected_at_utc ASC."
    roles: [PlatformOps, ProgrammingManager]
    code: 200
    input: ["booking_id?", "screening_id?", "state?", "limit?", "offset?"]
    output: FeedEvent[]
    side_effects: []
  - method: POST
    path: "/event-cinema/feed-events/{id}/confirm"
    description: "Confirm a genuine feed failure, revoking the affected screenings' keys and unlocking make-good credit."
    roles: [PlatformOps]
    code: 200
    input: []
    output: FeedEvent
    side_effects:
      - "FeedEvent.state := CONFIRMED"
      - "recompute FeedEvent.affected_screening_count"
      - "each EncryptionKey on the affected screenings → issuance_status REVOKED with reason FEED_LOSS"
      - "increment the owning Theater.pending_rekey_count by 1 per revoked key"
  - method: POST
    path: "/event-cinema/feed-events/{id}/void"
    description: "Declare a reported feed failure a false alarm."
    roles: [PlatformOps]
    code: 200
    input: []
    output: FeedEvent
    side_effects: ["FeedEvent.state := VOIDED"]
  - method: POST
    path: "/event-cinema/feed-events/{id}/resolve"
    description: "Close out a feed failure once its ruined screenings have been reported and any make-good applied."
    roles: [PlatformOps]
    code: 200
    input: [resolution_outcome]
    output: FeedEvent
    side_effects: ["FeedEvent.state := RESOLVED", "FeedEvent.resolution_outcome := resolution_outcome"]

  # --- Settlements ------------------------------------------------------------
  - method: POST
    path: "/event-cinema/settlements"
    description: "Settle a confirmed booking against reported attendance. A BookingLine has reported attendance when every Screening of that line is in a non-SCHEDULED state. Closes immediately when every line has reported."
    roles: [FinanceOps, PlatformOps]
    code: 201
    input: ["booking_id", "gross_box_office_cents", "reported_line_count", "topup_paid_cents?", "adjustment_cents?"]
    output: Settlement
    side_effects:
      - "Settlement.status := OPEN then CLOSED in the same request when every BookingLine has reported attendance"
      - "recompute Settlement.distributor_net_cents and exhibitor_net_cents via settlement_split"
      - "recompute Settlement.makegood_credit_cents and feed_failure_credit_cents"
      - "recompute Settlement.invariant_drift_cents"
      - "when closed: Booking.status := SETTLED and Booking.settled_at := current clock instant"
  - method: GET
    path: "/event-cinema/settlements/{id}"
    description: "Read one settlement."
    roles: [FinanceOps, PlatformOps, Distributor, ProgrammingManager]
    code: 200
    input: []
    output: Settlement
    side_effects: []
  - method: GET
    path: "/event-cinema/settlements"
    description: "List settlements; filter by booking. Ordered by created_at ASC."
    roles: [FinanceOps, PlatformOps]
    code: 200
    input: ["booking_id?", "status?", "limit?", "offset?"]
    output: Settlement[]
    side_effects: []
  - method: POST
    path: "/event-cinema/settlements/{id}/close"
    description: "Close an open settlement, moving its booking to SETTLED."
    roles: [FinanceOps]
    code: 200
    input: []
    output: Settlement
    side_effects: ["Settlement.status := CLOSED", "Settlement.closed_at_utc := current clock instant", "Booking.status := SETTLED", "Booking.settled_at := current clock instant"]
  - method: POST
    path: "/event-cinema/settlements/{id}/reopen"
    description: "Reopen a closed settlement after a reporting correction."
    roles: [FinanceOps]
    code: 200
    input: []
    output: Settlement
    side_effects: ["Settlement.status := REOPENED", "Settlement.closed_at_utc := null"]
  - method: POST
    path: "/event-cinema/settlements/{id}/apply-makegood"
    description: "Apply make-good credit from a confirmed feed failure directly onto an open settlement."
    roles: [FinanceOps]
    code: 200
    input: [line_id, feed_event_id]
    output: Settlement
    side_effects:
      - "Settlement.makegood_credit_cents += makegood_credit_derivation"
      - "Settlement.feed_failure_credit_cents += the FEED_LOSS portion"
      - "recompute Settlement.distributor_net_cents and exhibitor_net_cents"
      - "recompute Settlement.invariant_drift_cents"

  # --- Operational / test-driving endpoints -----------------------------------
  - method: POST
    path: "/event-cinema/_clock/set_current_utc"
    description: "Set the logical clock. The server's startup default is exactly 2026-09-01T00:00:00Z and it never falls back to wall-clock time."
    roles: [PlatformOps]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["current clock instant := to_iso8601"]
  - method: POST
    path: "/event-cinema/_ops/run-on-sale-sweep"
    description: "Advance every APPROVED booking whose on_sale_at has been reached to ON_SALE."
    roles: [PlatformOps]
    code: 200
    input: []
    output: { advanced_count: integer, booking_ids: "string[]" }
    side_effects: ["each advanced Booking.status := ON_SALE", "recompute Booking.pre_sale_tickets for each"]
  - method: POST
    path: "/event-cinema/_ops/run-presale-checkpoints"
    description: "Run the presale threshold assessment over every ON_SALE booking whose checkpoint instant has passed."
    roles: [PlatformOps]
    code: 200
    input: []
    output: { cancelled_count: integer, booking_ids: "string[]" }
    side_effects: ["each shortfall Booking.status := CANCELLED with the presale-checkpoint cascade"]
  - method: POST
    path: "/event-cinema/_ops/run-rights-expiry-sweep"
    description: "Evaluate the system rights-expiry transition for every title whose rights_end_utc has passed."
    roles: [PlatformOps]
    code: 200
    input: []
    output: { expired_title_count: integer, cancelled_booking_count: integer }
    side_effects: ["each expired Title.status := RIGHTS_EXPIRED with its full four-hop cascade"]
  - method: POST
    path: "/event-cinema/_ops/rekey-sweep"
    description: "Reissue keys at a venue and clear its pending rekey backlog."
    roles: [PlatformOps]
    code: 200
    input: [theater_id]
    output: Theater
    side_effects: ["Theater.pending_rekey_count := 0"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ------------------------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role names no role in §1.7"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "acting role is not permitted on this endpoint, or X-User-ID does not match an existing instance of the role's backing entity"
  - id: ERR_SOD_VIOLATION
    http: 403
    condition: "the acting operator is the same principal that performed the counterparty leg of the workflow (settlement vs submission/approval, feed confirmation vs filing)"

  # --- not found -------------------------------------------------------------
  - id: ERR_DISTRIBUTOR_NOT_FOUND
    http: 404
    condition: "no distributor exists with the supplied id"
  - id: ERR_CIRCUIT_NOT_FOUND
    http: 404
    condition: "no circuit exists with the supplied id"
  - id: ERR_THEATER_NOT_FOUND
    http: 404
    condition: "no theater exists with the supplied id"
  - id: ERR_TITLE_NOT_FOUND
    http: 404
    condition: "no title exists with the supplied id, or a body FK names a title that does not exist"
  - id: ERR_BOOKING_NOT_FOUND
    http: 404
    condition: "no booking exists with the supplied id"
  - id: ERR_LINE_NOT_FOUND
    http: 404
    condition: "no booking line exists with the supplied id, or it does not belong to the booking named in the path"
  - id: ERR_SCREENING_NOT_FOUND
    http: 404
    condition: "no screening exists with the supplied id"
  - id: ERR_KEY_NOT_FOUND
    http: 404
    condition: "no encryption key exists with the supplied id"
  - id: ERR_DELIVERY_NOT_FOUND
    http: 404
    condition: "no content delivery exists with the supplied id"
  - id: ERR_ENCORE_WINDOW_NOT_FOUND
    http: 404
    condition: "no encore window exists with the supplied id"
  - id: ERR_FEED_EVENT_NOT_FOUND
    http: 404
    condition: "no feed event exists with the supplied id"
  - id: ERR_SETTLEMENT_NOT_FOUND
    http: 404
    condition: "no settlement exists with the supplied id"

  # --- request shape ---------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required body field is absent, a field carries the wrong type, or an unknown field is supplied"
  - id: ERR_SHOWTIME_PLAN_INVALID
    http: 400
    condition: "showtime_count is not 1 or 2, showtime_plan does not contain exactly showtime_count elements, index values repeat, or a date or start_minute is out of range"

  # --- state -----------------------------------------------------------------
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the target resource is in a state from which §1.2 declares no transition for this trigger"
  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "the target resource has already reached one of its terminal_states"
  - id: ERR_BOOKING_NOT_REPORTABLE
    http: 409
    condition: "a screening report was filed against a booking whose status is DRAFT, PENDING_APPROVAL, COUNTERED, APPROVED, ON_HOLD, CANCELLED or TERMINAL"
  - id: ERR_BOOKING_LINE_NOT_COMMITTED
    http: 409
    condition: "the parent booking line is in exhibit_state PROPOSED or RELEASED"
  - id: ERR_DELIVERY_NOT_VERIFIED
    http: 409
    condition: "an encryption key was requested for a booking whose content delivery is not VERIFIED"
  - id: ERR_KEY_NOT_ISSUABLE
    http: 409
    condition: "the screening bound to the key is not in state SCHEDULED, or the parent booking's status is not in {ON_SALE, CONFIRMED, SETTLED}"
  - id: ERR_SETTLEMENT_ALREADY_CLOSED
    http: 409
    condition: "a settlement already in status CLOSED was closed again, or the holding booking was cancelled with compensation"

  # --- business: safety / rights ---------------------------------------------
  - id: ERR_TERRITORY_UNLICENSED
    http: 422
    condition: "a venue's state_code does not appear in Title.territory_state_codes"
  - id: ERR_RIGHTS_WINDOW_VIOLATION
    http: 422
    condition: "a showtime, encore window, or screening falls outside [rights_start_utc, rights_end_utc], or on_sale_at does not precede the first showtime"
  - id: ERR_RIGHTS_EXPIRED
    http: 422
    condition: "the current clock instant is at or past Title.rights_end_utc for an operation that commits screens, issues keys, or confirms a booking"

  # --- business: referential / temporal constraints ---------------------------
  - id: ERR_SCREEN_OVERLAP_CONFLICT
    http: 409
    condition: "a screening's half-open [starts_at, ends_at) interval intersects a scheduled screening of the same theater in another live booking (exact endpoint adjacency is allowed)"
  - id: ERR_SCREEN_BUFFER_CONFLICT
    http: 409
    condition: "a screening's half-open buffered interval [starts_at, ends_at + showtime_buffer_minutes) intersects the buffered interval of any other scheduled screening of the same theater, whatever that booking's status — a candidate starting exactly at ends_at + buffer is allowed; one starting a minute earlier is rejected"
  - id: ERR_KEY_WINDOW_OVERLAP
    http: 409
    condition: "a new key's validity interval intersects a non-revoked key already bound to the same screening"
  - id: ERR_SCREEN_POOL_EXHAUSTED
    http: 409
    condition: "the screens being committed would push the circuit past its screen_pool_total"
  - id: ERR_DUPLICATE_CIRCUIT_CODE
    http: 409
    condition: "a circuit already exists with this circuit_code"
  - id: ERR_MAX_SCREEN_COMMITMENT_EXCEEDED
    http: 422
    condition: "the screens committed against a title exceed Title.max_screen_commitment"
  - id: ERR_COUNTER_LIMIT_REACHED
    http: 409
    condition: "a fourth counter was attempted on a booking that has already been countered three times"
  - id: ERR_DUPLICATE_BOOKING_LINE
    http: 409
    condition: "a second BookingLine was proposed for a theater that already has a line on this booking"

  # --- business: fiscal / threshold -------------------------------------------
  - id: ERR_GUARANTEE_BELOW_FLOOR
    http: 422
    condition: "guarantee_cents is below Distributor.guarantee_floor_cents"
  - id: ERR_GUARANTEE_ABOVE_CEILING
    http: 422
    condition: "guarantee_cents exceeds Booking.guarantee_ceiling_cents in the variant live for the booking's current status"
  - id: ERR_MIN_SCREENS_NOT_MET
    http: 422
    condition: "committed_screens_total is below Booking.min_screens"
  - id: ERR_UNREPORTED_ATTENDANCE
    http: 422
    condition: "at least one booking line of the booking has no reported attendance"
  - id: ERR_FEED_OUTAGE_TOO_SHORT
    http: 422
    condition: "outage_minutes is below 5, so the failure cannot be confirmed"
  - id: ERR_MAKEGOOD_LINE_NOT_APPLICABLE
    http: 422
    condition: "the nominated line is not committed, carries no ruined screening, or has no confirmed feed event"
  - id: ERR_ENCORE_DENOMINATOR_ZERO
    http: 422
    condition: "the parent booking has no committed line with expected_attendance greater than zero, so the encore attendance ratio is undefined"
  - id: ERR_ENCORE_WINDOW_INVALID
    http: 422
    condition: "encore price is not strictly below the standard price, or the window closes after rights_end_utc, or window_end_utc is not after window_start_utc"
  - id: ERR_ENCORE_NOT_ELIGIBLE
    http: 422
    condition: "the parent booking is not CONFIRMED or SETTLED, or its best attendance ratio is below 0.5"
  - id: ERR_DELIVERY_LEAD_VIOLATION
    http: 422
    condition: "the package's scheduled_delivery_utc plus the method lead time falls after the earliest scheduled screening start, or the booking has no scheduled screening"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "the expected_<parent>_version supplied does not equal the parent entity's current version"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformOps
    description: "Platform operator: master data, operational sweeps, contingency confirmation, and booking closure."
    identity: opaque
    exclusive_operations:
      - "POST /event-cinema/distributors"
      - "POST /event-cinema/circuits"
      - "POST /event-cinema/circuits/{id}/accredit"
      - "POST /event-cinema/circuits/{id}/suspend"
      - "POST /event-cinema/distributors/{id}/suspend"
      - "POST /event-cinema/distributors/{id}/reactivate"
      - "POST /event-cinema/bookings/{id}/confirm"
      - "POST /event-cinema/bookings/{id}/presale-checkpoint"
      - "POST /event-cinema/bookings/{id}/close"
      - "POST /event-cinema/bookings/{id}/reopen"
      - "POST /event-cinema/bookings/{id}/apply-makegood"
      - "POST /event-cinema/feed-events/{id}/confirm"
      - "POST /event-cinema/feed-events/{id}/void"
      - "POST /event-cinema/feed-events/{id}/resolve"
      - "POST /event-cinema/_clock/set_current_utc"
      - "POST /event-cinema/_ops/run-on-sale-sweep"
      - "POST /event-cinema/_ops/run-presale-checkpoints"
      - "POST /event-cinema/_ops/run-rights-expiry-sweep"
      - "POST /event-cinema/_ops/rekey-sweep"
    shared_operations:
      - "POST /event-cinema/theaters"
      - "POST /event-cinema/theaters/{id}/go-dark"
      - "POST /event-cinema/keys/{id}/issue"
      - "POST /event-cinema/keys/{id}/revoke"
      - "POST /event-cinema/content-deliveries"
      - "POST /event-cinema/content-deliveries/{id}/mark-delivered"
      - "POST /event-cinema/content-deliveries/{id}/mark-failed"
      - "POST /event-cinema/content-deliveries/{id}/verify"
      - "POST /event-cinema/screenings"
      - "POST /event-cinema/feed-events"
      - "POST /event-cinema/settlements"
      - "GET on every read endpoint"

  - name: ProgrammingManager
    description: "Content programmer: acquires titles, manages rights windows, and schedules encore runs."
    identity: opaque
    exclusive_operations:
      - "POST /event-cinema/titles"
      - "PUT /event-cinema/titles/{id}"
      - "POST /event-cinema/titles/{id}/publish"
      - "POST /event-cinema/titles/{id}/unpublish"
      - "POST /event-cinema/titles/{id}/clear"
      - "POST /event-cinema/titles/{id}/reopen-bookings"
      - "POST /event-cinema/titles/{id}/withdraw"
      - "POST /event-cinema/titles/{id}/archive"
      - "POST /event-cinema/encore-windows/{id}/schedule"
      - "POST /event-cinema/encore-windows/{id}/withdraw"
    shared_operations:
      - "POST /event-cinema/encore-windows"
      - "GET on every read endpoint"

  - name: Distributor
    description: "Content licensor principal backed by a Distributor row; negotiates terms and controls screen commitments."
    identity: entity_backed:Distributor
    exclusive_operations:
      - "POST /event-cinema/bookings/{id}/counter"
      - "POST /event-cinema/bookings/{id}/approve"
      - "POST /event-cinema/bookings/{id}/suspend"
      - "POST /event-cinema/bookings/{id}/resume"
      - "POST /event-cinema/bookings/{id}/release-screens"
      - "POST /event-cinema/bookings/{id}/cancel-with-compensation"
    shared_operations:
      - "POST /event-cinema/bookings/{id}/cancel"
      - "POST /event-cinema/encore-windows"
      - "GET on every read endpoint"

  - name: Exhibitor
    description: "Circuit principal backed by a Circuit row; files venues, opens bookings, and proposes commitments."
    identity: entity_backed:Circuit
    exclusive_operations:
      - "POST /event-cinema/bookings"
      - "PUT /event-cinema/bookings/{id}"
      - "POST /event-cinema/bookings/{id}/lines"
      - "POST /event-cinema/bookings/{id}/submit"
      - "POST /event-cinema/bookings/{id}/re-propose"
    shared_operations:
      - "POST /event-cinema/theaters"
      - "POST /event-cinema/theaters/{id}/go-dark"
      - "POST /event-cinema/bookings/{id}/cancel"
      - "POST /event-cinema/screenings"
      - "GET on every read endpoint"

  - name: Theater
    description: "Venue operator backed by a Theater row; reports attendance and files feed failures."
    identity: entity_backed:Theater
    exclusive_operations:
      - "POST /event-cinema/screenings/{id}/report"
    shared_operations:
      - "POST /event-cinema/feed-events"
      - "GET on every read endpoint"

  - name: FinanceOps
    description: "Settlement operator; opens, closes, and reopens settlements and applies make-good credit to them."
    identity: opaque
    exclusive_operations:
      - "POST /event-cinema/settlements/{id}/close"
      - "POST /event-cinema/settlements/{id}/reopen"
      - "POST /event-cinema/settlements/{id}/apply-makegood"
    shared_operations:
      - "POST /event-cinema/settlements"
      - "GET on every read endpoint"

  - name: ContentOfficer
    description: "Content delivery and key officer; verifies packages and administers encryption keys."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /event-cinema/content-deliveries"
      - "POST /event-cinema/content-deliveries/{id}/mark-delivered"
      - "POST /event-cinema/content-deliveries/{id}/mark-failed"
      - "POST /event-cinema/content-deliveries/{id}/verify"
      - "POST /event-cinema/keys/{id}/issue"
      - "POST /event-cinema/keys/{id}/revoke"
      - "GET on every read endpoint"