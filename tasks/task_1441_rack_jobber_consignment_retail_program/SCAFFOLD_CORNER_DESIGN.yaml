        claim_type: violation_to_error
        grounds: ["validations[priority=20]", "errors[ERR_CATEGORY_EXCLUSIVE_CONFLICT]"]
        distinguishing_aspect: "Two DIFFERENT programs cannot hold overlapping same-category windows at one store — exclusivity is enforced cross-program."
        test_recipe:
          setup: ["programs A and B, agreements on both for one store; A holds SNACKS [2026-08-01, 2026-09-01)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: JobberAdmin }
            - { call: "POST /programs", payload: { name: "Excl A" }, as: JobberAdmin, captures: { progA: "$.data.id" } }
            - { call: "POST /programs", payload: { name: "Excl B" }, as: JobberAdmin, captures: { progB: "$.data.id" } }
            - { call: "POST /stores", payload: { name: "ExclStore", store_code: "EXC", total_facings: 100 }, as: JobberAdmin, captures: { store: "$.data.id" } }
            - { call: "POST /agreements", payload: { program_id: "${progA}", store_id: "${store}", base_margin_pct: 0.25, shrink_retailer_share_pct: 0.5, restock_value_cap_cents: 50000 }, as: JobberAdmin, captures: { agrA: "$.data.id" } }
            - { call: "POST /agreements/${agrA}/submit", payload: {}, as: JobberAdmin }
            - { call: "POST /agreements/${agrA}/accept", payload: {}, as: RetailerManager, as_user_id: "${store}" }
            - { call: "POST /agreements", payload: { program_id: "${progB}", store_id: "${store}", base_margin_pct: 0.25, shrink_retailer_share_pct: 0.5, restock_value_cap_cents: 50000 }, as: JobberAdmin, captures: { agrB: "$.data.id" } }
            - { call: "POST /agreements/${agrB}/submit", payload: {}, as: JobberAdmin }
            - { call: "POST /agreements/${agrB}/accept", payload: {}, as: RetailerManager, as_user_id: "${store}" }
            - { call: "POST /space-allocations", payload: { store_agreement_id: "${agrA}", category: "SNACKS", facings: 4, window_start_date: "2026-08-01", window_end_date: "2026-09-01" }, as: JobberAdmin }
          trigger:
            - { call: "POST /space-allocations", payload: { store_agreement_id: "${agrB}", category: "SNACKS", facings: 4, window_start_date: "2026-08-15", window_end_date: "2026-09-15" }, as: JobberAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_CATEGORY_EXCLUSIVE_CONFLICT (http 409) — same store+category overlap under a different program"

      - name: duplicate_sku_rejected
