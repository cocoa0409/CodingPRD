      - name: waterfall_tier3_gp_catchup_circular
        grounds:
          - calculations.distribution_waterfall_allocation
          - entities.DistributionLine.fields.profit_split_gp_cents
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: Tier-3 GP catch-up formula
          gp_catch_up = promote * sum(tier2) / (1 - promote) is defined by a
          fixpoint equation ("GP receives until GP share equals promote of
          LP tier2 + GP"), which the scaffold resolves into a closed-form
          evaluation order: tier1 first, then tier2, then tier3 via the
          closed-form, then tier4 residual. Reordering the evaluation
          produces different cents for every tier.
