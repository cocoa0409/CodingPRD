              as_user_id: "analyst-1"
              captures: { l11: $.data.id }
          assert:
            - "Before the trigger: WaterSystem.${ws}.total_service_line_count == 10, unknown_count == 1, unknown_share_pct == 10.00 and program_posture == OPEN"
            - "After the trigger: WaterSystem.${ws}.total_service_line_count == 11, unknown_count == 2 and unknown_share_pct == 18.18"
            - "WaterSystem.${ws}.program_posture == RESTRICTED"
            - "WaterSystem.${ws}.inventory_status == VALIDATION_PENDING and outstanding_notification_count == 0 (only STEP 6 can explain the posture)"

      - name: filtered_pagination_stays_consistent_across_a_mutation
        claim_type: pagination_with_filtering
        grounds:
          - endpoints.GET_lsl_service_lines
          - response_envelope.pagination_fields
        distinguishing_aspect: "Three UNKNOWN lines and two LEAD lines: the classification=UNKNOWN filter with limit 2 reports total_count 3 / has_more true on the first page and 1 item / has_more false at offset 2 — the count is the FILTERED population, not the 5-row table. Adding LEAD evidence to one filtered line then drops the same query to total_count 2 / has_more false."
        test_recipe:
          setup:
            - "One water system with three bare service lines (UNCLASSIFIED, classification UNKNOWN) and two lines carrying HISTORIC_RECORD utility LEAD."
          setup_api_calls:
            - call: "POST /lsl/water-systems"
              payload: { pwsid: "IL2105005", system_name: "Paging Filter Water", compliance_deadline_date: "2027-10-16" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { ws: $.data.id }
            - call: "POST /lsl/service-lines"
              payload: { water_system_id: "${ws}", address_label: "101 Elm St", census_tract_code: "17031-9900" }
              as: InventoryAnalyst
              as_user_id: "analyst-1"
              captures: { l1: $.data.id }
            - call: "POST /lsl/service-lines"
              payload: { water_system_id: "${ws}", address_label: "102 Elm St", census_tract_code: "17031-9900" }
              as: InventoryAnalyst
              as_user_id: "analyst-1"
              captures: { l2: $.data.id }
            - call: "POST /lsl/service-lines"
              payload: { water_system_id: "${ws}", address_label: "103 Elm St", census_tract_code: "17031-9900" }
              as: InventoryAnalyst
              as_user_id: "analyst-1"
              captures: { l3: $.data.id }
            - call: "POST /lsl/service-lines"
              payload: { water_system_id: "${ws}", address_label: "104 Elm St", census_tract_code: "17031-9900" }
              as: InventoryAnalyst
              as_user_id: "analyst-1"
              captures: { l4: $.data.id }
            - call: "POST /lsl/evidence-items"
              payload: { service_line_id: "${l4}", source_type: "HISTORIC_RECORD", side: "UTILITY", observed_material: "LEAD", observed_at: "2026-06-01T00:00:00Z" }
              as: InventoryAnalyst
              as_user_id: "analyst-1"
            - call: "POST /lsl/service-lines"
              payload: { water_system_id: "${ws}", address_label: "105 Elm St", census_tract_code: "17031-9900" }
              as: InventoryAnalyst
              as_user_id: "analyst-1"
              captures: { l5: $.data.id }
            - call: "POST /lsl/evidence-items"
              payload: { service_line_id: "${l5}", source_type: "HISTORIC_RECORD", side: "UTILITY", observed_material: "LEAD", observed_at: "2026-06-01T00:00:00Z" }
              as: InventoryAnalyst
              as_user_id: "analyst-1"
          trigger:
            - call: "GET /lsl/service-lines"
              payload: { water_system_id: "${ws}", classification: "UNKNOWN", limit: 2, offset: 0 }
              as: InventoryAnalyst
              as_user_id: "analyst-1"
            - call: "GET /lsl/service-lines"
              payload: { water_system_id: "${ws}", classification: "UNKNOWN", limit: 2, offset: 2 }
              as: InventoryAnalyst
              as_user_id: "analyst-1"
            - call: "POST /lsl/evidence-items"
              payload: { service_line_id: "${l1}", source_type: "HISTORIC_RECORD", side: "UTILITY", observed_material: "LEAD", observed_at: "2026-06-01T00:00:00Z" }
              as: InventoryAnalyst
              as_user_id: "analyst-1"
            - call: "GET /lsl/service-lines"
              payload: { water_system_id: "${ws}", classification: "UNKNOWN", limit: 2, offset: 0 }
              as: InventoryAnalyst
              as_user_id: "analyst-1"
            - call: "GET /lsl/service-lines"
              payload: { water_system_id: "${ws}", classification: "LEAD", limit: 2, offset: 0 }
              as: InventoryAnalyst
              as_user_id: "analyst-1"
          assert:
            - "First page: HTTP 200, exactly 2 items, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "Second page: exactly 1 item, total_count == 3, has_more == false"
            - "After the evidence insert the UNKNOWN query returns exactly 2 items with total_count == 2 and has_more == false"
            - "The LEAD query returns exactly 2 items with total_count == 3 and has_more == true"
            - "WaterSystem.${ws}.unknown_count == 2 and WaterSystem.${ws}.lead_count == 3"

      - name: appointment_completion_cascade_runs_four_levels_deep
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
          - endpoints.POST_lsl_verification_appointments_id_complete.side_effects
        excluded_because:
          difficulty_instance: transitive_cascade / appointment_completion_cascades_four_links_into_inventory_amendment
          rationale: "That instance already drives LINK 1 through LINK 4 of the completion cascade end-to-end — synthesized evidence, basis flip and recompute, counter bubble-up, and the PUBLISHED -> AMENDMENT_PENDING amendment — and pins every intermediate value."

      - name: the_same_evidence_set_scores_differently_under_the_two_bases
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
          - calculations.service_line_certainty_score.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / certainty_score_records_basis_versus_field_basis_on_identical_evidence_set
          rationale: "That instance holds the evidence set fixed and pins both variant outputs plus the delta the basis flip produces."

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: a_consent_barrier_is_visible_in_the_same_request_chain
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.ReplacementOrder.consent_state.REQUESTED_to_NO_RESPONSE
          - calculations.replacement_priority_score.formula
        distinguishing_aspect: "The consent-response call that records NO_RESPONSE returns the order already at SCOPED/PARTIAL, and the very next read of the service line — with no intervening write and no delay — already shows consent_barrier_flag true and the 8.00-point penalty applied (50.00 -> 42.00). Nothing here is allowed to lag."
        test_recipe:
          setup:
            - "One published water system with one LEAD line and one DRAFT replacement order whose consent has been requested."
          setup_api_calls:
            - call: "POST /lsl/water-systems"
              payload: { pwsid: "IL2105006", system_name: "Immediate Water", compliance_deadline_date: "2027-10-16" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { ws: $.data.id }
            - call: "POST /lsl/service-lines"
              payload: { water_system_id: "${ws}", address_label: "101 Elm St", census_tract_code: "17031-9900" }
              as: InventoryAnalyst
              as_user_id: "analyst-1"
              captures: { l1: $.data.id }
            - call: "POST /lsl/evidence-items"
              payload: { service_line_id: "${l1}", source_type: "HISTORIC_RECORD", side: "UTILITY", observed_material: "LEAD", observed_at: "2026-06-01T00:00:00Z" }
              as: InventoryAnalyst
              as_user_id: "analyst-1"
            - call: "POST /lsl/sampling-batches"
              payload: { water_system_id: "${ws}", stratum_code: "STR-A", stratum_line_count: 20 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { batch: $.data.id }
            - call: "POST /lsl/sampling-batches/${batch}/samples"
              payload: { service_line_id: "${l1}", lead_ppb: 1.0, collected_at: "2026-07-11T09:00:00Z", sample_type: "FIRST_DRAW" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /lsl/sampling-batches/${batch}/samples"
              payload: { service_line_id: "${l1}", lead_ppb: 2.0, collected_at: "2026-07-12T09:00:00Z", sample_type: "FIRST_DRAW" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /lsl/sampling-batches/${batch}/samples"
              payload: { service_line_id: "${l1}", lead_ppb: 3.0, collected_at: "2026-07-13T09:00:00Z", sample_type: "FIRST_DRAW" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /lsl/sampling-batches/${batch}/samples"
              payload: { service_line_id: "${l1}", lead_ppb: 4.0, collected_at: "2026-07-14T09:00:00Z", sample_type: "FIFTH_LITER" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /lsl/sampling-batches/${batch}/samples"
              payload: { service_line_id: "${l1}", lead_ppb: 5.0, collected_at: "2026-07-15T09:00:00Z", sample_type: "FIFTH_LITER" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /lsl/sampling-batches/${batch}/validate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /lsl/water-systems/${ws}/advance-inventory-status"
              payload: { target_status: "VALIDATION_PENDING" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { ws_v: $.data.version }
            - call: "POST /lsl/inventory-publications"
              payload: { water_system_id: "${ws}", basis: "RECORDS", reporting_period_label: "2026-H2", expected_water_system_version: "${ws_v}" }
              as: InventoryAnalyst
              as_user_id: "analyst-1"
              captures: { pub: $.data.id }
            - call: "POST /lsl/inventory-publications/${pub}/certify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /lsl/inventory-publications/${pub}/publish"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /lsl/replacement-orders"
              payload: { service_line_id: "${l1}", estimated_cost_cents: 100000, excavation_start_date: "2026-08-10", excavation_end_date: "2026-08-11" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { o1: $.data.id }
            - call: "POST /lsl/replacement-orders/${o1}/consent-request"
              payload: {}
              as: CustomerRepresentative
              as_user_id: "csr-1"
          trigger:
            - call: "POST /lsl/replacement-orders/${o1}/consent-response"
              payload: { outcome: "NO_RESPONSE", barrier_reason: "NO_CONTACT" }
              as: CustomerRepresentative
              as_user_id: "csr-1"
            - call: "GET /lsl/service-lines/${l1}"
              payload: {}
              as: CustomerRepresentative
              as_user_id: "csr-1"
            - call: "GET /lsl/replacement-orders/${o1}"
              payload: {}
              as: CustomerRepresentative
              as_user_id: "csr-1"
          assert:
            - "The consent-response body itself reports fulfillment_state == SCOPED, consent_state == NO_RESPONSE, scope == PARTIAL and barrier_reason == NO_CONTACT"
            - "The immediately following service-line read reports consent_barrier_flag == true and replacement_priority_score == 42.00"
            - "ServiceLine.${l1}.classification == LEAD, certainty_score == 16.00 and replacement_state == IN_PROGRAM"
            - "The order read reports the same SCOPED/NO_RESPONSE/PARTIAL triple as the mutation response"
