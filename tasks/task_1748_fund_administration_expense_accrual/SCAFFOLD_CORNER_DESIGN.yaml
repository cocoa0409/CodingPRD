      - name: distribution_zero_income_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_NO_DISTRIBUTABLE_INCOME]"]
        distinguishing_aspect: "Zero-balance boundary: with retained_income == 0 and all higher-priority checks passing, declaration fails on the fiscal floor."
        test_recipe:
          setup: ["Base kit with FINAL NavRecord 2026-08-04; no income posted (retained_income 0)"]
          setup_api_calls:
