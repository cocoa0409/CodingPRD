# =============================================================================
# Task 1888 — Construction Loan Draw Administration — Seed Tables (SCAFFOLD)
# =============================================================================

scenario: |
  1888. Construction Loan Draw Administration (construction lender): budget
  line-item setup & contingency allocation, draw request intake with lien
  waivers & invoices, inspection ordering & percent-complete verification,
  retainage withholding & release rules, budget reallocation approval,
  stored-materials advance rules, interest reserve tracking & depletion,
  conversion to permanent financing at completion

domain_name: construction-loan-draws
api_prefix: ""

complexity_profile:
  primary_archetype: quota_allotment        # finite loan commitment allocated across budget lines, then drawn down
  secondary_archetype: compliance_audit     # lien-waiver / inspection gating before money moves
  complexity_layers:
    - optimistic_concurrency                # OCC on Loan.version for reallocation creation
    - cascading_side_effects                # fund -> line items -> budget lines -> loan aggregates
    - dual_variant_calculation              # inspection vs cost progress; ACTUAL_360 vs THIRTY_360 interest
    - derived_field_reconciliation          # loan/line aggregates recomputed from child events
  entity_topology: flat                     # peer resources joined by FKs in request bodies; sub-resource GETs only where natural
  state_machine_shape: cyclic               # draw revision loop is the signature machine; others branch
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: approval_chain                # Borrower -> DrawProcessor -> CreditOfficer -> LoanServicer
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Borrower
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Borrower legal entity name" }
      - { name: contact_email, type: string, source: input, description: "Primary contact email" }
      - { name: entity_type, type: enum, source: input, description: "INDIVIDUAL | LLC | CORPORATION | PARTNERSHIP" }

  - name: Loan
    parent: null
    common_fields: true
    fields:
      - { name: borrower_id, type: string, source: input, description: "FK -> Borrower.id; borrower-role writes require X-User-ID == this value" }
      - { name: commitment_amount_cents, type: integer, source: input, description: "Total construction loan commitment; sum of BudgetLine.original_amount_cents must never exceed it" }
      - { name: interest_rate_annual_bps, type: integer, source: input, description: "Annual note rate in basis points (e.g., 1200 = 12%)" }
      - { name: day_count_convention, type: enum, source: input, default: "ACTUAL_360", description: "ACTUAL_360 | THIRTY_360; selects interest accrual day-count variant" }
      - { name: interest_reserve_initial_cents, type: integer, source: input, description: "Interest reserve funded at loan creation; seeds INITIAL_DEPOSIT ledger entry" }
      - { name: maturity_date, type: string, source: input, description: "ISO 8601 date (YYYY-MM-DD) loan maturity" }
      - { name: retainage_pct, type: number, source: input, default: 10.00, description: "Standard retainage percent withheld from each approved draw line" }
      - { name: reduced_retainage_pct, type: number, source: input, default: 5.00, description: "Retainage percent once milestone_reached is true" }
      - { name: retainage_milestone_pct, type: number, source: input, default: 50.00, description: "Inspection-verified percent complete at or above which retainage reduces (>= boundary)" }
      - { name: stored_materials_max_pct, type: number, source: input, default: 75.00, description: "Max advance percent of a stored-materials line's invoice value" }
      - { name: status, type: enum, source: system, description: "OPEN | CONVERTED | TERMINATED" }
      - { name: total_original_budget_cents, type: integer, source: computed, default: 0, description: "Sum of original_amount_cents over all BudgetLines of this loan" }
      - { name: principal_disbursed_cents, type: integer, source: computed, default: 0, description: "Sum of BudgetLine.disbursed_cents (net cash funded plus released retainage)" }
      - { name: retained_cents, type: integer, source: computed, default: 0, description: "Sum of BudgetLine.retained_cents currently withheld" }
      - { name: interest_reserve_balance_cents, type: integer, source: computed, description: "Reserve remaining; == interest_reserve_initial_cents + signed sum of InterestReserveEntry.amount_cents" }
      - { name: interest_reserve_depleted, type: boolean, source: computed, default: false, description: "True once an accrual leaves interest_reserve_balance_cents == 0" }
      - { name: interest_reserve_swept_cents, type: integer, source: system, default: 0, description: "Reserve returned to borrower via SWEEP entries at conversion/termination" }
      - { name: interest_capitalized_cents, type: integer, source: computed, default: 0, description: "Cumulative interest that exceeded the reserve and was capitalized into the balance base" }
      - { name: inspection_percent_complete, type: number, source: computed, default: 0.00, description: "Percent from latest ACCEPTED inspection (completed_date DESC, tie created_at DESC); 0.00 when none" }
      - { name: cost_percent_complete, type: number, source: computed, default: 0.00, description: "round( sum(disbursed+retained) / sum(revised) * 100, 2 ); 0.00 when no budget lines" }
      - { name: milestone_reached, type: boolean, source: computed, default: false, description: "Latched true once inspection_percent_complete >= retainage_milestone_pct; never flips back" }
      - { name: retainage_fully_released, type: boolean, source: computed, default: false, description: "True when retained_cents returns to 0 after having been > 0" }
      - { name: permanent_interest_rate_annual_bps, type: integer, source: system, default: null, description: "Set at conversion" }
      - { name: permanent_term_months, type: integer, source: system, default: null, description: "Set at conversion" }

  - name: BudgetLine
    parent: null
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: input, description: "FK -> Loan.id; owning loan" }
      - { name: cost_code, type: string, source: input, description: "Cost code; unique per loan" }
      - { name: description, type: string, source: input, description: "Line description" }
      - { name: original_amount_cents, type: integer, source: input, description: "Original budgeted amount (> 0)" }
      - { name: is_contingency, type: boolean, source: input, default: false, description: "Contingency lines may be reallocation sources but never targets" }
      - { name: status, type: enum, source: system, description: "ACTIVE | CLOSED (CLOSED via loan conversion/termination cascade)" }
      - { name: revised_amount_cents, type: integer, source: computed, description: "= original_amount_cents + applied reallocations in - applied reallocations out" }
      - { name: disbursed_cents, type: integer, source: computed, default: 0, description: "Net cash funded plus retainage released on this line" }
      - { name: retained_cents, type: integer, source: computed, default: 0, description: "Retainage currently withheld on this line" }
      - { name: approved_unfunded_cents, type: integer, source: computed, default: 0, description: "Sum of approved_cents on this line's items in APPROVED (not yet FUNDED) draws; reserved headroom" }

  - name: DrawRequest
    parent: null
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: input, description: "FK -> Loan.id; owning loan" }
      - { name: draw_number, type: integer, source: system, description: "Per-loan monotone sequence assigned at creation: max(existing draw_number) + 1, starting at 1; never reused" }
      - { name: period_start_date, type: string, source: input, description: "ISO date; billing period start (inclusive)" }
      - { name: period_end_date, type: string, source: input, description: "ISO date; billing period end (exclusive); must be strictly after start" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | UNDER_REVIEW | REVISION_REQUESTED | APPROVED | FUNDED | REJECTED | WITHDRAWN" }
      - { name: revision_notes, type: string, source: system, default: null, description: "Notes recorded by request-revision" }
      - { name: rejection_reason, type: string, source: system, default: null, description: "Reason recorded by reject" }
      - { name: requested_total_cents, type: integer, source: computed, default: 0, description: "Sum of DrawLineItem.requested_cents on this draw" }
      - { name: approved_total_cents, type: integer, source: computed, default: 0, description: "Sum of approved_cents; set at approve" }
      - { name: retainage_total_cents, type: integer, source: computed, default: 0, description: "Sum of per-line retainage_cents (rounded per line, then summed); set at approve" }
      - { name: funded_total_cents, type: integer, source: computed, default: 0, description: "Sum of funded_cents; set at fund" }
      - { name: effective_retainage_pct, type: number, source: computed, default: null, description: "Retainage percent applied at approve (reduced when milestone_reached else standard)" }
      - { name: milestone_applied, type: boolean, source: computed, default: false, description: "Whether milestone_reached was true at approve time" }

  - name: DrawLineItem
    parent: null
    common_fields: true
    fields:
      - { name: draw_id, type: string, source: input, description: "FK -> DrawRequest.id; owning draw" }
      - { name: budget_line_id, type: string, source: input, description: "FK -> BudgetLine.id; must belong to the same loan as the draw" }
      - { name: line_type, type: enum, source: input, description: "WORK_COMPLETED | STORED_MATERIALS" }
      - { name: requested_cents, type: integer, source: input, description: "Gross amount requested (> 0)" }
      - { name: stored_material_invoice_cents, type: integer, source: input, description: "Required iff line_type == STORED_MATERIALS; invoice value of stored materials" }
      - { name: insurance_certificate_ref, type: string, source: input, description: "Required iff line_type == STORED_MATERIALS; insurance evidence reference" }
      - { name: stored_location, type: string, source: input, description: "Required iff line_type == STORED_MATERIALS; where materials are stored" }
      - { name: installed_by_date, type: string, source: input, description: "Optional ISO date by which stored materials must be installed" }
      - { name: is_installed, type: boolean, source: system, default: false, description: "Set true by mark-installed (STORED_MATERIALS lines only)" }
      - { name: installed_date, type: string, source: system, default: null, description: "Set by mark-installed" }
      - { name: approved_cents, type: integer, source: computed, default: 0, description: "Gross approved at draw approve: min(requested, cost headroom, inspection cap, stored-materials cap)" }
      - { name: retainage_cents, type: integer, source: computed, default: 0, description: "round_half_up(approved_cents * effective_retainage_pct / 100), rounded per line" }
      - { name: net_fundable_cents, type: integer, source: computed, default: 0, description: "= approved_cents - retainage_cents" }
      - { name: funded_cents, type: integer, source: computed, default: 0, description: "= net_fundable_cents once the draw is FUNDED; 0 before" }

  - name: DrawDocument
    parent: null
    common_fields: true
    fields:
      - { name: draw_id, type: string, source: input, description: "FK -> DrawRequest.id; owning draw" }
      - { name: doc_type, type: enum, source: input, description: "LIEN_WAIVER_CONDITIONAL | LIEN_WAIVER_UNCONDITIONAL | INVOICE | INSURANCE_CERTIFICATE" }
      - { name: party_name, type: string, source: input, description: "Contractor or vendor name" }
      - { name: reference_number, type: string, source: input, description: "External document/invoice number" }
      - { name: amount_cents, type: integer, source: input, description: "Document amount (> 0)" }
      - { name: doc_date, type: string, source: input, description: "ISO date of the document" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | VERIFIED | REJECTED" }
      - { name: rejection_reason, type: string, source: system, default: null, description: "Reason recorded when reviewed REJECTED" }

  - name: Inspection
    parent: null
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: input, description: "FK -> Loan.id; owning loan" }
      - { name: draw_id, type: string, source: input, description: "FK -> DrawRequest.id; optional - null marks a completion inspection not tied to a draw" }
      - { name: scheduled_date, type: string, source: input, description: "ISO date the inspection is scheduled for" }
      - { name: status, type: enum, source: system, description: "ORDERED | COMPLETED | ACCEPTED | REJECTED | CANCELLED" }
      - { name: percent_complete_reported, type: number, source: input, description: "Inspector-reported percent complete, 0.00-100.00, set at complete" }
      - { name: completed_date, type: string, source: input, description: "ISO date inspection was performed, set at complete" }
      - { name: stored_materials_observed_cents, type: integer, source: input, description: "Optional observed value of stored materials on site" }
      - { name: notes, type: string, source: input, description: "Optional inspector notes" }
      - { name: rejection_reason, type: string, source: system, default: null, description: "Reason recorded when reviewed REJECTED" }

  - name: ReallocationRequest
    parent: null
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: input, description: "FK -> Loan.id; owning loan" }
      - { name: from_budget_line_id, type: string, source: input, description: "FK -> BudgetLine.id; source line" }
      - { name: to_budget_line_id, type: string, source: input, description: "FK -> BudgetLine.id; target line; must not be a contingency line" }
      - { name: amount_cents, type: integer, source: input, description: "Amount to move (> 0)" }
      - { name: justification, type: string, source: input, description: "Free-text justification" }
      - { name: status, type: enum, source: system, description: "PENDING | APPROVED | APPLIED | REJECTED | CANCELLED" }
      - { name: review_reason, type: string, source: system, default: null, description: "Reason recorded at review" }
      - { name: created_loan_version, type: integer, source: system, description: "Loan.version the creator presented via expected_loan_version (audit)" }

  - name: RetainageRelease
    parent: null
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: input, description: "FK -> Loan.id; owning loan" }
      - { name: budget_line_id, type: string, source: input, description: "FK -> BudgetLine.id; line whose retained balance is released" }
      - { name: amount_cents, type: integer, source: input, description: "Release amount (> 0); must be <= line retained_cents at create and re-checked at pay" }
      - { name: reason, type: string, source: input, description: "Release justification (e.g., milestone reduction, completion)" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | PAID | REJECTED" }
      - { name: review_reason, type: string, source: system, default: null, description: "Reason recorded at review" }

  - name: ConversionReview
    parent: null
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: input, description: "FK -> Loan.id; owning loan" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | CONVERTED | DECLINED" }
      - { name: decline_reason, type: string, source: system, default: null, description: "Reason recorded when reviewed DECLINED" }
      - { name: permanent_interest_rate_annual_bps, type: integer, source: system, default: null, description: "Permanent note rate, set at convert and copied to the Loan" }
      - { name: permanent_term_months, type: integer, source: system, default: null, description: "Permanent term, set at convert and copied to the Loan" }

  - name: InterestReserveEntry
    parent: null
    common_fields: false
    fields:
      - { name: loan_id, type: string, source: system, description: "FK -> Loan.id; owning loan" }
      - { name: entry_index, type: integer, source: system, description: "Per-loan monotone sequence starting at 1; INITIAL_DEPOSIT is index 1" }
      - { name: entry_type, type: enum, source: system, description: "INITIAL_DEPOSIT | INTEREST_PAYMENT | CAPITALIZATION | SWEEP" }
      - { name: amount_cents, type: integer, source: computed, description: "Signed reserve delta: INITIAL_DEPOSIT positive, INTEREST_PAYMENT negative (paid_from_reserve), SWEEP negative, CAPITALIZATION zero" }
      - { name: period_start_date, type: string, source: system, description: "Accrual period start; null except INTEREST_PAYMENT / CAPITALIZATION" }
      - { name: period_end_date, type: string, source: system, description: "Accrual period end (exclusive); null except INTEREST_PAYMENT / CAPITALIZATION" }
      - { name: days_counted, type: integer, source: computed, description: "Day count per loan.day_count_convention; null for INITIAL_DEPOSIT / SWEEP" }
      - { name: interest_due_cents, type: integer, source: computed, description: "Interest computed on the start-of-run balance base; null for INITIAL_DEPOSIT / SWEEP" }
      - { name: paid_from_reserve_cents, type: integer, source: computed, description: "= min(interest_due_cents, reserve balance before this run); null for INITIAL_DEPOSIT / SWEEP" }
      - { name: capitalized_cents, type: integer, source: computed, description: "= interest_due_cents - paid_from_reserve_cents on INTEREST_PAYMENT; mirrors on CAPITALIZATION; 0 otherwise" }
      - { name: reserve_balance_after_cents, type: integer, source: computed, description: "Loan reserve balance immediately after this entry" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Loan
    initial_state: OPEN
    terminal_states: [CONVERTED, TERMINATED]
    transitions:
      - from: OPEN
        to: CONVERTED
        trigger: "POST /conversion-reviews/{id}/convert"
        actor: LoanServicer
        preconditions:
          - "Loan.status == OPEN"
          - "ConversionReview.status == APPROVED"
        side_effects:
          - "Loan.status -> CONVERTED; permanent_interest_rate_annual_bps and permanent_term_months copied from the ConversionReview inputs"
          - "Cascade: every BudgetLine of the loan in ACTIVE -> CLOSED (BudgetLine.version increments)"
          - "If interest_reserve_balance_cents > 0: create InterestReserveEntry SWEEP with amount_cents = -balance; interest_reserve_swept_cents += balance; balance -> 0"
          - "Loan.version increments by 1"
      - from: OPEN
        to: TERMINATED
        trigger: "POST /loans/{id}/terminate"
        actor: LenderAdmin
        preconditions:
          - "principal_disbursed_cents == 0 AND retained_cents == 0 AND no draws in {DRAFT, SUBMITTED, UNDER_REVIEW, REVISION_REQUESTED, APPROVED} AND no ReallocationRequest in {PENDING, APPROVED} AND no RetainageRelease in {REQUESTED, APPROVED} AND no ConversionReview in {REQUESTED, APPROVED} (else ERR_LOAN_HAS_ACTIVITY)"
        side_effects:
          - "Loan.status -> TERMINATED"
          - "Cascade: every BudgetLine of the loan in ACTIVE -> CLOSED (BudgetLine.version increments)"
          - "If interest_reserve_balance_cents > 0: create InterestReserveEntry SWEEP with amount_cents = -balance; interest_reserve_swept_cents += balance; balance -> 0"
          - "Loan.version increments by 1"

  - entity: BudgetLine
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: CLOSED
        trigger: "system (cascade from Loan conversion or termination)"
        actor: system
        preconditions:
          - "Loan transitions OPEN -> CONVERTED or OPEN -> TERMINATED"
        side_effects:
          - "BudgetLine.version increments"

  - entity: DrawRequest
    initial_state: DRAFT
    terminal_states: [FUNDED, REJECTED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /draws/{id}/submit"
        actor: Borrower
        preconditions:
          - "Acting Borrower id == loan.borrower_id"
          - "At least one DrawLineItem exists for the draw (ERR_DRAW_HAS_NO_LINES)"
          - "Billing period [period_start_date, period_end_date) does not overlap any sibling draw of the same loan in {SUBMITTED, UNDER_REVIEW, REVISION_REQUESTED, APPROVED, FUNDED}: overlap iff start < other.end AND other.start < end; adjacent periods (end == other.start) are allowed (ERR_DRAW_PERIOD_OVERLAP)"
        side_effects: []
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /draws/{id}/submit"
        actor: Borrower
        preconditions:
          - "Acting Borrower id == loan.borrower_id"
          - "At least one DrawLineItem exists (ERR_DRAW_HAS_NO_LINES)"
          - "Period overlap rule as above (ERR_DRAW_PERIOD_OVERLAP)"
        side_effects:
          - "revision_notes is retained on the draw for audit"
        note: "Resubmission closes the revision cycle (UNDER_REVIEW -> REVISION_REQUESTED -> SUBMITTED)."
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /draws/{id}/start-review"
        actor: DrawProcessor
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /draws/{id}/request-revision"
        actor: DrawProcessor
        preconditions: []
        side_effects:
          - "revision_notes set from request body"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /draws/{id}/reject"
        actor: DrawProcessor
        preconditions: []
        side_effects:
          - "rejection_reason set from request body"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /draws/{id}/approve"
        actor: CreditOfficer
        preconditions:
          - "Lien-waiver coverage (ERR_LIEN_WAIVER_UNVERIFIED): sum of this draw's VERIFIED LIEN_WAIVER_UNCONDITIONAL docs >= approved_total_cents of the most recent FUNDED sibling draw (by draw_number DESC; 0 if none), AND sum of VERIFIED LIEN_WAIVER_CONDITIONAL docs >= this draw's requested_total_cents"
          - "If an ACCEPTED inspection for this draw exists, its completed_date must lie within [period_start_date, period_end_date] (ERR_INSPECTION_STALE)"
          - "At least one ACCEPTED Inspection with draw_id == this draw exists (ERR_INSPECTION_REQUIRED)"
          - "Invoice coverage (ERR_INVOICE_COVERAGE_INSUFFICIENT): sum of this draw's VERIFIED INVOICE docs >= sum of requested_cents over line items with line_type == WORK_COMPLETED"
          - "Computed approved_total_cents must be > 0 (ERR_NOTHING_APPROVABLE)"
        side_effects:
          - "Per line item: approved_cents, retainage_cents, net_fundable_cents computed per draw_line_approval_amount / stored_materials_advance_cap / retainage_withholding"
          - "Draw approved_total_cents, retainage_total_cents, effective_retainage_pct, milestone_applied set"
          - "Each touched BudgetLine.approved_unfunded_cents recomputed (BudgetLine.version increments)"
      - from: APPROVED
        to: FUNDED
        trigger: "POST /draws/{id}/fund"
        actor: LoanServicer
        preconditions:
          - "Loan.status == OPEN (ERR_LOAN_NOT_OPEN)"
        side_effects:
          - "Each DrawLineItem.funded_cents := net_fundable_cents"
          - "Cascade to BudgetLine: disbursed_cents += net_fundable_cents, retained_cents += retainage_cents, approved_unfunded_cents -= approved_cents (BudgetLine.version increments)"
          - "Cascade to Loan: principal_disbursed_cents, retained_cents, cost_percent_complete recomputed; Loan.version increments by 1"
          - "Draw funded_total_cents := sum of funded_cents"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /draws/{id}/withdraw"
        actor: Borrower
        preconditions:
          - "Acting Borrower id == loan.borrower_id"
        side_effects: []
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /draws/{id}/withdraw"
        actor: Borrower
        preconditions:
          - "Acting Borrower id == loan.borrower_id"
        side_effects: []
      - from: REVISION_REQUESTED
        to: WITHDRAWN
        trigger: "POST /draws/{id}/withdraw"
        actor: Borrower
        preconditions:
          - "Acting Borrower id == loan.borrower_id"
        side_effects: []

  - entity: DrawDocument
    initial_state: SUBMITTED
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /draw-documents/{id}/review with decision=VERIFIED"
        actor: DrawProcessor
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /draw-documents/{id}/review with decision=REJECTED"
        actor: DrawProcessor
        preconditions: []
        side_effects:
          - "rejection_reason set from request body"

  - entity: Inspection
    initial_state: ORDERED
    terminal_states: [ACCEPTED, REJECTED, CANCELLED]
    transitions:
      - from: ORDERED
        to: COMPLETED
        trigger: "POST /inspections/{id}/complete"
        actor: Inspector
        preconditions:
          - "percent_complete_reported within 0.00-100.00 (ERR_INVALID_REQUEST)"
        side_effects:
          - "percent_complete_reported, completed_date, stored_materials_observed_cents, notes recorded"
      - from: COMPLETED
        to: ACCEPTED
        trigger: "POST /inspections/{id}/review with decision=ACCEPTED"
        actor: DrawProcessor
        preconditions: []
        side_effects:
          - "Loan.inspection_percent_complete recomputed (latest ACCEPTED inspection by completed_date DESC, tie created_at DESC)"
          - "Loan.milestone_reached latches true when inspection_percent_complete >= retainage_milestone_pct"
          - "Loan.version increments by 1"
      - from: COMPLETED
        to: REJECTED
        trigger: "POST /inspections/{id}/review with decision=REJECTED"
        actor: DrawProcessor
        preconditions: []
        side_effects:
          - "rejection_reason set from request body"
      - from: ORDERED
        to: CANCELLED
        trigger: "POST /inspections/{id}/cancel"
        actor: DrawProcessor
        preconditions: []
        side_effects: []

  - entity: ReallocationRequest
    initial_state: PENDING
    terminal_states: [APPLIED, REJECTED, CANCELLED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /reallocation-requests/{id}/review with decision=APPROVED"
        actor: CreditOfficer
        preconditions: []
        side_effects: []
      - from: PENDING
        to: REJECTED
        trigger: "POST /reallocation-requests/{id}/review with decision=REJECTED"
        actor: CreditOfficer
        preconditions: []
        side_effects:
          - "review_reason set from request body"
      - from: APPROVED
        to: APPLIED
        trigger: "POST /reallocation-requests/{id}/apply"
        actor: LoanServicer
        preconditions:
          - "Loan.status == OPEN (ERR_LOAN_NOT_OPEN)"
          - "From-line floor: from_line.revised_amount_cents - amount_cents >= from_line.disbursed_cents + from_line.retained_cents + from_line.approved_unfunded_cents (ERR_REALLOCATION_BELOW_FLOOR)"
        side_effects:
          - "from_line.revised_amount_cents -= amount_cents; to_line.revised_amount_cents += amount_cents (both BudgetLine.version increment)"
          - "Loan.version increments by 1 (derived budget totals re-evaluated)"
      - from: PENDING
        to: CANCELLED
        trigger: "POST /reallocation-requests/{id}/cancel"
        actor: LenderAdmin
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /reallocation-requests/{id}/cancel"
        actor: LenderAdmin
        preconditions: []
        side_effects: []

  - entity: RetainageRelease
    initial_state: REQUESTED
    terminal_states: [PAID, REJECTED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /retainage-releases/{id}/review with decision=APPROVED"
        actor: CreditOfficer
        preconditions:
          - "Loan.status == OPEN (ERR_LOAN_NOT_OPEN)"
        side_effects: []
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /retainage-releases/{id}/review with decision=REJECTED"
        actor: CreditOfficer
        preconditions: []
        side_effects:
          - "review_reason set from request body"
      - from: APPROVED
        to: PAID
        trigger: "POST /retainage-releases/{id}/pay"
        actor: LoanServicer
        preconditions:
          - "Loan.status == OPEN (ERR_LOAN_NOT_OPEN)"
          - "budget_line.retained_cents >= amount_cents (ERR_RELEASE_EXCEEDS_RETAINED)"
        side_effects:
          - "BudgetLine: retained_cents -= amount_cents, disbursed_cents += amount_cents (BudgetLine.version increments)"
          - "Cascade to Loan: retained_cents and principal_disbursed_cents recomputed; retainage_fully_released set true when retained_cents reaches 0 after having been > 0; Loan.version increments by 1"

  - entity: ConversionReview
    initial_state: REQUESTED
    terminal_states: [CONVERTED, DECLINED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /conversion-reviews/{id}/review with decision=APPROVED"
        actor: CreditOfficer
        preconditions:
          - "Loan.status == OPEN (ERR_LOAN_NOT_OPEN)"
          - "Loan.retained_cents == 0 AND no draws in {DRAFT, SUBMITTED, UNDER_REVIEW, REVISION_REQUESTED, APPROVED} AND at least one ACCEPTED inspection for the loan with percent_complete_reported == 100.00 (ERR_CONVERSION_PRECONDITIONS_UNMET)"
        side_effects: []
      - from: REQUESTED
        to: DECLINED
        trigger: "POST /conversion-reviews/{id}/review with decision=DECLINED"
        actor: CreditOfficer
        preconditions: []
        side_effects:
          - "decline_reason set from request body"
      - from: APPROVED
        to: CONVERTED
        trigger: "POST /conversion-reviews/{id}/convert"
        actor: LoanServicer
        preconditions:
          - "Loan.status == OPEN (ERR_LOAN_NOT_OPEN)"
        side_effects:
          - "permanent_interest_rate_annual_bps / permanent_term_months recorded on the review"
          - "Loan OPEN -> CONVERTED cascade fires (see Loan state machine): budget lines CLOSED, reserve SWEEP, permanent terms copied"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: reallocation-create-stale-loan
    parent_entity: Loan
    write_endpoint: "POST /reallocation-requests"
    occ_field: "expected_loan_version"
    description: |
      Creating a ReallocationRequest against a Loan whose version has advanced
      since the client last observed it is rejected with 412. This captures the
      case where another writer has just created or applied a reallocation (or
      any other loan-mutating operation) and the current writer's view of the
      loan's budget state is therefore stale.
    error_id: ERR_STALE_LOAN_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: loan_progress_percent
    trigger: "Inspection review decision=ACCEPTED; draw fund; retainage release pay; reallocation apply"
    algorithm: aggregation
    formula: |
      inspection variant (inspection_percent_complete):
        among Inspection rows of the loan with status == ACCEPTED:
          pick latest by completed_date DESC, tie-break created_at DESC
        inspection_percent_complete = that row's percent_complete_reported (0.00 if none)
        if inspection_percent_complete >= loan.retainage_milestone_pct: milestone_reached = true (latched)
      cost variant (cost_percent_complete):
        denom = sum(BudgetLine.revised_amount_cents) over all lines of the loan
        numer = sum(BudgetLine.disbursed_cents + BudgetLine.retained_cents)
        cost_percent_complete = denom == 0 ? 0.00 : round(numer * 100 / denom, 2)
    input_set: "Inspections of the loan with status ACCEPTED only; BudgetLines of the loan in any status"
    precision: "2 decimal places, round_half_up"
    variants:
      - name: inspection_based
        when: "Milestone gating, retainage reduction, conversion readiness checks"
        difference: "Uses inspector-verified percent; typically ahead of cost basis early in the project"
      - name: cost_based
        when: "Reporting field loan.cost_percent_complete"
        difference: "Uses funded dollars over revised budget; identical inputs produce a different percent than inspection_based"

  - name: draw_line_approval_amount
    trigger: "POST /draws/{id}/approve"
    algorithm: constraint_propagation
    formula: |
      for each DrawLineItem of the draw (line = its BudgetLine):
        cost_headroom = line.revised_amount_cents - line.disbursed_cents - line.retained_cents - line.approved_unfunded_cents
        inspection_cap = floor(line.revised_amount_cents * draw_inspection.percent_complete_reported / 100)
                        - line.disbursed_cents - line.retained_cents - line.approved_unfunded_cents
        inspection_cap = max(inspection_cap, 0)
        if line_type == WORK_COMPLETED:
          approved_cents = min(requested_cents, cost_headroom, inspection_cap)
        if line_type == STORED_MATERIALS:
          approved_cents = min(requested_cents, cost_headroom, inspection_cap, stored_materials_advance_cap(item))
        approved_cents = max(approved_cents, 0)
      draw_inspection = the ACCEPTED inspection for this draw (latest completed_date DESC, tie created_at DESC)
    input_set: "All DrawLineItems of the draw; BudgetLines referenced; the ACCEPTED inspection linked to this draw"
    precision: "whole cents (integer); floor for inspection_cap"
    variants: []

  - name: stored_materials_advance_cap
    trigger: "POST /draws/{id}/approve (per STORED_MATERIALS line item)"
    algorithm: threshold
    formula: |
      if item.is_installed: cap = item.stored_material_invoice_cents
      else:                 cap = floor(item.stored_material_invoice_cents * loan.stored_materials_max_pct / 100)
    input_set: "DrawLineItems with line_type == STORED_MATERIALS"
    constants:
      DEFAULT_STORED_MATERIALS_MAX_PCT: 75.00
    precision: "whole cents; floor"
    variants: []

  - name: retainage_withholding
    trigger: "POST /draws/{id}/approve (per line item, then summed)"
    algorithm: aggregation
    formula: |
      effective_pct = loan.milestone_reached ? loan.reduced_retainage_pct : loan.retainage_pct
      per line item: retainage_cents = round_half_up(approved_cents * effective_pct / 100)
      draw.retainage_total_cents = sum(retainage_cents over line items)
      PINNED ROUNDING ORDER: round each line item to whole cents FIRST, then sum.
      (Sum-then-round of the same inputs can differ by cents; per-line-then-sum is authoritative.)
      net_fundable_cents = approved_cents - retainage_cents (per line)
    input_set: "DrawLineItems of the draw after draw_line_approval_amount"
    precision: "whole cents, round_half_up per line, then integer sum"
    variants: []

  - name: interest_accrual
    trigger: "POST /loans/{id}/interest-accruals"
    algorithm: chronological
    formula: |
      EVALUATION ORDER PINNED (circular-looking dependency resolved):
        1. base = loan.principal_disbursed_cents + loan.interest_capitalized_cents   # start-of-run, before this run's capitalization
        2. days = day_count(period_start_date, period_end_date) per convention variant
        3. interest_due_cents = round_half_up(base * loan.interest_rate_annual_bps / 10000 * days / 360)
        4. paid_from_reserve_cents = min(interest_due_cents, loan.interest_reserve_balance_cents)
        5. reserve: loan.interest_reserve_balance_cents -= paid_from_reserve_cents
        6. shortfall = interest_due_cents - paid_from_reserve_cents
        7. if shortfall > 0: loan.interest_capitalized_cents += shortfall   # joins NEXT run's base
        8. if loan.interest_reserve_balance_cents == 0: loan.interest_reserve_depleted = true
      Entries: one INTEREST_PAYMENT entry per run (even when interest_due == 0);
      plus one CAPITALIZATION entry iff shortfall > 0.
      Day count:
        ACTUAL_360: days = calendar days from period_start_date to period_end_date, end exclusive
        THIRTY_360 (US): d1 = min(day(start), 30); d2 = min(day(end), 30) unless day(end) == 31 and day(start) >= 30 -> 30;
                         days = 360*(y2-y1) + 30*(m2-m1) + (d2 - d1)
    input_set: "The loan; accrual period dates from the request"
    precision: "whole cents, round_half_up"
    variants:
      - name: actual_360
        when: "loan.day_count_convention == ACTUAL_360"
        difference: "Uses actual calendar days; Feb-spanning periods count 28/29 days"
      - name: thirty_360
        when: "loan.day_count_convention == THIRTY_360"
        difference: "Every month counts 30 days; identical dates produce a different interest_due_cents than actual_360"

  - name: waiver_coverage_requirement
    trigger: "POST /draws/{id}/approve"
    algorithm: aggregation
    formula: |
      prior = latest FUNDED sibling draw of the same loan by draw_number DESC (none -> zeros)
      required_unconditional = prior.approved_total_cents (0 if no prior FUNDED draw)
      required_conditional   = this_draw.requested_total_cents
      verified_unconditional = sum(amount_cents) over this draw's DrawDocuments
                               with doc_type == LIEN_WAIVER_UNCONDITIONAL and status == VERIFIED
      verified_conditional   = sum(amount_cents) over this draw's DrawDocuments
                               with doc_type == LIEN_WAIVER_CONDITIONAL and status == VERIFIED
      pass iff verified_unconditional >= required_unconditional AND verified_conditional >= required_conditional
    input_set: "DrawDocuments of THIS draw with status VERIFIED only; SUBMITTED and REJECTED excluded; sibling draws with status FUNDED only"
    precision: "whole cents"
    variants: []

  - name: invoice_coverage_requirement
    trigger: "POST /draws/{id}/approve"
    algorithm: aggregation
    formula: |
      required = sum(requested_cents) over this draw's line items with line_type == WORK_COMPLETED
      covered = sum(amount_cents) over this draw's DrawDocuments with doc_type == INVOICE and status == VERIFIED
      pass iff covered >= required
      (STORED_MATERIALS lines carry their own stored_material_invoice_cents and are excluded from `required`.)
    input_set: "DrawDocuments of THIS draw with status VERIFIED only; line items of this draw"
    precision: "whole cents"
    variants: []

  - name: revised_budget_reallocation
    trigger: "POST /reallocation-requests/{id}/apply"
    algorithm: aggregation
    formula: |
      for each BudgetLine: revised_amount_cents = original_amount_cents
        + sum(amount_cents of APPLIED ReallocationRequests where to_budget_line_id == line.id)
        - sum(amount_cents of APPLIED ReallocationRequests where from_budget_line_id == line.id)
      INVARIANT: sum(revised_amount_cents) over all lines == sum(original_amount_cents) over all lines,
      for every sequence of APPLIED reallocations (a reallocation only moves budget, never creates or destroys it).
    input_set: "ReallocationRequests of the loan with status APPLIED only"
    precision: "whole cents"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint per the endpoint's roles list"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "Borrower-role writes: X-User-ID must equal the target loan's borrower_id (ownership)"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "POST /draws, POST /draws/{id}/submit, POST /draws/{id}/withdraw, POST /draw-line-items, POST /draw-documents, POST /retainage-releases, POST /conversion-reviews"

  - priority: 4
    category: existence
    check: "Every id in path and body (loan_id, draw_id, budget_line_id, from/to_budget_line_id, borrower_id) exists"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 5
    category: business_constraint
    check: "OCC: expected_loan_version must equal Loan.version (POST /reallocation-requests only)"
    error_id: ERR_STALE_LOAN_VERSION
    http_status: 412
    applies_to: "POST /reallocation-requests"

  - priority: 6
    category: state
    check: "Resource is in a valid from-state for the requested transition; child creation/mutation requires parent Loan.status == OPEN"
    error_id: "ERR_INVALID_STATE / ERR_LOAN_NOT_OPEN"
    http_status: 409
    applies_to: "all state-transition endpoints; POST /budget-lines, /draws, /draw-line-items, /draw-documents, /inspections, /reallocation-requests, /retainage-releases, /conversion-reviews, /loans/{id}/interest-accruals"

  - priority: 7
    category: business_safety
    check: "Lien-waiver compliance gate at draw approve (waiver_coverage_requirement)"
    error_id: ERR_LIEN_WAIVER_UNVERIFIED
    http_status: 409
    applies_to: "POST /draws/{id}/approve"

  - priority: 8
    category: business_temporal
    check: "Period validity (end strictly after start at draw create); half-open period overlap at submit; inspection schedule gap (a new ORDERED inspection conflicts with an existing ORDERED inspection on the same loan when |scheduled_date difference| <= 2 days); accepted-inspection staleness vs draw period at approve"
    error_id: "ERR_DRAW_PERIOD_INVALID / ERR_DRAW_PERIOD_OVERLAP / ERR_INSPECTION_SCHEDULE_CONFLICT / ERR_INSPECTION_STALE"
    http_status: "422 / 409 / 409 / 409"
    applies_to: "POST /draws, POST /draws/{id}/submit, POST /inspections, POST /draws/{id}/approve"

  - priority: 9
    category: business_constraint
    check: "Structural rules: draw must have >= 1 line item at submit; cost_code unique per loan; stored-materials evidence fields present iff line_type == STORED_MATERIALS (and forbidden on WORK_COMPLETED); reallocation from != to; reallocation target not a contingency line; no second ConversionReview in {REQUESTED, APPROVED} per loan; mark-installed only on STORED_MATERIALS lines"
    error_id: "ERR_DRAW_HAS_NO_LINES / ERR_DUPLICATE_COST_CODE / ERR_STORED_MATERIALS_EVIDENCE_MISSING / ERR_INVALID_REQUEST / ERR_REALLOCATION_SAME_LINE / ERR_CONTINGENCY_DIRECTION_VIOLATION / ERR_CONVERSION_IN_PROGRESS / ERR_LINE_NOT_STORED_MATERIALS"
    http_status: "422 / 409"
    applies_to: "POST /draws/{id}/submit, POST /budget-lines, POST /draw-line-items, POST /reallocation-requests, POST /conversion-reviews, POST /draw-line-items/{id}/mark-installed"

  - priority: 10
    category: business_referential
    check: "Cross-entity linkage/state: line item's budget line belongs to the draw's loan; inspection's draw belongs to the loan; an ACCEPTED inspection exists for the draw at approve; retainage release allowed only when loan.milestone_reached is true or a 100.00 ACCEPTED inspection exists; conversion readiness aggregate"
    error_id: "ERR_BUDGET_LINE_LOAN_MISMATCH / ERR_DRAW_LOAN_MISMATCH / ERR_INSPECTION_REQUIRED / ERR_RETAINAGE_NOT_RELEASABLE / ERR_CONVERSION_PRECONDITIONS_UNMET"
    http_status: "422 / 409"
    applies_to: "POST /draw-line-items, POST /inspections, POST /draws/{id}/approve, POST /retainage-releases, POST /conversion-reviews/{id}/review"

  - priority: 11
    category: business_fiscal
    check: "Money caps: sum of budget-line originals <= commitment; invoice coverage at approve; approved_total > 0; release amount <= line retained (at create and re-checked at pay); reallocation from-line floor at apply; terminate requires zero activity"
    error_id: "ERR_COMMITMENT_EXCEEDED / ERR_INVOICE_COVERAGE_INSUFFICIENT / ERR_NOTHING_APPROVABLE / ERR_RELEASE_EXCEEDS_RETAINED / ERR_REALLOCATION_BELOW_FLOOR / ERR_LOAN_HAS_ACTIVITY"
    http_status: "422 / 409"
    applies_to: "POST /budget-lines, POST /draws/{id}/approve, POST /retainage-releases, POST /retainage-releases/{id}/pay, POST /reallocation-requests/{id}/apply, POST /loans/{id}/terminate"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Borrower ---
  - method: POST
    path: "/borrowers"
    description: "Register a Borrower"
    roles: [LenderAdmin]
    code: 201
    input: [legal_name, contact_email, entity_type]
    output: Borrower
    side_effects: []

  - method: GET
    path: "/borrowers/{id}"
    description: "Get a Borrower"
    roles: [LenderAdmin, DrawProcessor, CreditOfficer, LoanServicer, Inspector, Borrower]
    code: 200
    input: []
    output: Borrower
    side_effects: []

  # --- Loan ---
  - method: POST
    path: "/loans"
    description: "Create a construction Loan (status OPEN); seeds the interest reserve"
    roles: [LenderAdmin]
    code: 201
    input: [borrower_id, commitment_amount_cents, interest_rate_annual_bps, interest_reserve_initial_cents, maturity_date, "day_count_convention?", "retainage_pct?", "reduced_retainage_pct?", "retainage_milestone_pct?", "stored_materials_max_pct?"]
    output: Loan
    side_effects:
      - "Create InterestReserveEntry INITIAL_DEPOSIT (entry_index 1, amount_cents = +interest_reserve_initial_cents, reserve_balance_after_cents = interest_reserve_initial_cents)"
      - "interest_reserve_balance_cents initialized to interest_reserve_initial_cents"

  - method: GET
    path: "/loans/{id}"
    description: "Get a Loan with computed aggregates"
    roles: [LenderAdmin, DrawProcessor, CreditOfficer, LoanServicer, Inspector, Borrower]
    code: 200
    input: []
    output: Loan
    side_effects: []

  - method: GET
    path: "/loans"
    description: "List Loans with optional filters and pagination"
    roles: [LenderAdmin, DrawProcessor, CreditOfficer, LoanServicer, Inspector, Borrower]
    code: 200
    input: ["borrower_id?", "status?", "limit?", "offset?"]
    output: Loan[]
    side_effects: []

  - method: POST
    path: "/loans/{id}/terminate"
    description: "Terminate an OPEN loan with zero activity"
    roles: [LenderAdmin]
    code: 200
    input: []
    output: Loan
    side_effects:
      - "Loan OPEN -> TERMINATED; BudgetLines ACTIVE -> CLOSED; reserve SWEEP entry if balance > 0; Loan.version increments"

  - method: POST
    path: "/loans/{id}/interest-accruals"
    description: "Run one interest accrual over [period_start_date, period_end_date); applies interest_accrual calc"
    roles: [LoanServicer]
    code: 201
    input: [period_start_date, period_end_date]
    output: InterestReserveEntry
    side_effects:
      - "Create INTEREST_PAYMENT entry (and CAPITALIZATION entry iff shortfall > 0)"
      - "interest_reserve_balance_cents -= paid_from_reserve_cents; interest_capitalized_cents += shortfall"
      - "interest_reserve_depleted set true when balance reaches 0; Loan.version increments"

  - method: GET
    path: "/loans/{id}/interest-ledger"
    description: "List InterestReserveEntry rows for a loan, ordered by entry_index ASC"
    roles: [LenderAdmin, DrawProcessor, CreditOfficer, LoanServicer, Inspector, Borrower]
    code: 200
    input: ["limit?", "offset?"]
    output: InterestReserveEntry[]
    side_effects: []

  # --- BudgetLine ---
  - method: POST
    path: "/budget-lines"
    description: "Add a budget line item to a loan"
    roles: [LenderAdmin]
    code: 201
    input: [loan_id, cost_code, description, original_amount_cents, "is_contingency?"]
    output: BudgetLine
    side_effects:
      - "status ACTIVE; revised_amount_cents = original_amount_cents"
      - "Loan.total_original_budget_cents recomputed (Loan.version increments)"

  - method: GET
    path: "/budget-lines/{id}"
    description: "Get a BudgetLine"
    roles: [LenderAdmin, DrawProcessor, CreditOfficer, LoanServicer, Inspector, Borrower]
    code: 200
    input: []
    output: BudgetLine
    side_effects: []

  - method: GET
    path: "/budget-lines"
    description: "List BudgetLines with optional filters"
    roles: [LenderAdmin, DrawProcessor, CreditOfficer, LoanServicer, Inspector, Borrower]
    code: 200
    input: ["loan_id?", "is_contingency?", "status?", "limit?", "offset?"]
    output: BudgetLine[]
    side_effects: []

  # --- DrawRequest ---
  - method: POST
    path: "/draws"
    description: "Create a draw request in DRAFT"
    roles: [Borrower]
    code: 201
    input: [loan_id, period_start_date, period_end_date]
    output: DrawRequest
    side_effects:
      - "draw_number assigned (max existing + 1 per loan)"
      - "ERR_DRAW_PERIOD_INVALID when period_end_date <= period_start_date"

  - method: GET
    path: "/draws/{id}"
    description: "Get a DrawRequest"
    roles: [LenderAdmin, DrawProcessor, CreditOfficer, LoanServicer, Inspector, Borrower]
    code: 200
    input: []
    output: DrawRequest
    side_effects: []

  - method: GET
    path: "/draws"
    description: "List DrawRequests with optional filters"
    roles: [LenderAdmin, DrawProcessor, CreditOfficer, LoanServicer, Inspector, Borrower]
    code: 200
    input: ["loan_id?", "status?", "limit?", "offset?"]
    output: DrawRequest[]
    side_effects: []

  - method: POST
    path: "/draws/{id}/submit"
    description: "Submit a DRAFT draw, or resubmit a REVISION_REQUESTED draw"
    roles: [Borrower]
    code: 200
    input: []
    output: DrawRequest
    side_effects: ["DrawRequest -> SUBMITTED"]

  - method: POST
    path: "/draws/{id}/start-review"
    description: "Move a SUBMITTED draw into UNDER_REVIEW"
    roles: [DrawProcessor]
    code: 200
    input: []
    output: DrawRequest
    side_effects: ["DrawRequest -> UNDER_REVIEW"]

  - method: POST
    path: "/draws/{id}/request-revision"
    description: "Send an UNDER_REVIEW draw back to the borrower for revision"
    roles: [DrawProcessor]
    code: 200
    input: [revision_notes]
    output: DrawRequest
    side_effects: ["DrawRequest -> REVISION_REQUESTED; revision_notes recorded"]

  - method: POST
    path: "/draws/{id}/reject"
    description: "Reject an UNDER_REVIEW draw (terminal)"
    roles: [DrawProcessor]
    code: 200
    input: [reason]
    output: DrawRequest
    side_effects: ["DrawRequest -> REJECTED; rejection_reason recorded"]

  - method: POST
    path: "/draws/{id}/withdraw"
    description: "Withdraw a DRAFT, SUBMITTED, or REVISION_REQUESTED draw"
    roles: [Borrower]
    code: 200
    input: []
    output: DrawRequest
    side_effects: ["DrawRequest -> WITHDRAWN"]

  - method: POST
    path: "/draws/{id}/approve"
    description: "Approve an UNDER_REVIEW draw; computes per-line approved/retainage/net amounts"
    roles: [CreditOfficer]
    code: 200
    input: []
    output: DrawRequest
    side_effects:
      - "Applies draw_line_approval_amount, stored_materials_advance_cap, retainage_withholding"
      - "Sets approved_total_cents, retainage_total_cents, effective_retainage_pct, milestone_applied"
      - "Recomputes BudgetLine.approved_unfunded_cents for touched lines"

  - method: POST
    path: "/draws/{id}/fund"
    description: "Fund an APPROVED draw; cascades to line items, budget lines, and loan aggregates"
    roles: [LoanServicer]
    code: 200
    input: []
    output: DrawRequest
    side_effects:
      - "DrawLineItem.funded_cents := net_fundable_cents"
      - "BudgetLine disbursed_cents/retained_cents/approved_unfunded_cents updated"
      - "Loan principal_disbursed_cents/retained_cents/cost_percent_complete recomputed; Loan.version increments"

  # --- DrawLineItem ---
  - method: POST
    path: "/draw-line-items"
    description: "Add a line item to a DRAFT or REVISION_REQUESTED draw"
    roles: [Borrower]
    code: 201
    input: [draw_id, budget_line_id, line_type, requested_cents, "stored_material_invoice_cents?", "insurance_certificate_ref?", "stored_location?", "installed_by_date?"]
    output: DrawLineItem
    side_effects: ["Draw.requested_total_cents recomputed"]

  - method: GET
    path: "/draw-line-items/{id}"
    description: "Get a DrawLineItem"
    roles: [LenderAdmin, DrawProcessor, CreditOfficer, LoanServicer, Inspector, Borrower]
    code: 200
    input: []
    output: DrawLineItem
    side_effects: []

  - method: GET
    path: "/draw-line-items"
    description: "List DrawLineItems with optional filters"
    roles: [LenderAdmin, DrawProcessor, CreditOfficer, LoanServicer, Inspector, Borrower]
    code: 200
    input: ["draw_id?", "budget_line_id?", "line_type?", "limit?", "offset?"]
    output: DrawLineItem[]
    side_effects: []

  - method: POST
    path: "/draw-line-items/{id}/mark-installed"
    description: "Mark a STORED_MATERIALS line item installed (draw must be APPROVED or FUNDED)"
    roles: [DrawProcessor]
    code: 200
    input: [installed_date]
    output: DrawLineItem
    side_effects: ["is_installed := true; installed_date recorded"]

  # --- DrawDocument ---
  - method: POST
    path: "/draw-documents"
    description: "Attach a document (lien waiver, invoice, insurance certificate) to a DRAFT or REVISION_REQUESTED draw"
    roles: [Borrower]
    code: 201
    input: [draw_id, doc_type, party_name, amount_cents, doc_date, "reference_number?"]
    output: DrawDocument
    side_effects: []

  - method: GET
    path: "/draw-documents/{id}"
    description: "Get a DrawDocument"
    roles: [LenderAdmin, DrawProcessor, CreditOfficer, LoanServicer, Inspector, Borrower]
    code: 200
    input: []
    output: DrawDocument
    side_effects: []

  - method: GET
    path: "/draw-documents"
    description: "List DrawDocuments with optional filters"
    roles: [LenderAdmin, DrawProcessor, CreditOfficer, LoanServicer, Inspector, Borrower]
    code: 200
    input: ["draw_id?", "doc_type?", "status?", "limit?", "offset?"]
    output: DrawDocument[]
    side_effects: []

  - method: POST
    path: "/draw-documents/{id}/review"
    description: "Verify or reject a SUBMITTED document"
    roles: [DrawProcessor]
    code: 200
    input: [decision, "reason?"]
    output: DrawDocument
    side_effects: ["DrawDocument -> VERIFIED or REJECTED; rejection_reason recorded when REJECTED"]

  # --- Inspection ---
  - method: POST
    path: "/inspections"
    description: "Order an inspection (draw inspection when draw_id given, completion inspection when omitted)"
    roles: [DrawProcessor]
    code: 201
    input: [loan_id, scheduled_date, "draw_id?"]
    output: Inspection
    side_effects: ["status ORDERED"]

  - method: GET
    path: "/inspections/{id}"
    description: "Get an Inspection"
    roles: [LenderAdmin, DrawProcessor, CreditOfficer, LoanServicer, Inspector, Borrower]
    code: 200
    input: []
    output: Inspection
    side_effects: []

  - method: GET
    path: "/inspections"
    description: "List Inspections with optional filters"
    roles: [LenderAdmin, DrawProcessor, CreditOfficer, LoanServicer, Inspector, Borrower]
    code: 200
    input: ["loan_id?", "draw_id?", "status?", "limit?", "offset?"]
    output: Inspection[]
    side_effects: []

  - method: POST
    path: "/inspections/{id}/complete"
    description: "Inspector reports results for an ORDERED inspection"
    roles: [Inspector]
    code: 200
    input: [percent_complete_reported, completed_date, "stored_materials_observed_cents?", "notes?"]
    output: Inspection
    side_effects: ["Inspection -> COMPLETED"]

  - method: POST
    path: "/inspections/{id}/review"
    description: "Accept or reject a COMPLETED inspection; acceptance updates loan progress fields"
    roles: [DrawProcessor]
    code: 200
    input: [decision, "reason?"]
    output: Inspection
    side_effects:
      - "Inspection -> ACCEPTED or REJECTED"
      - "On ACCEPTED: Loan.inspection_percent_complete recomputed; milestone_reached latched; Loan.version increments"

  - method: POST
    path: "/inspections/{id}/cancel"
    description: "Cancel an ORDERED inspection"
    roles: [DrawProcessor]
    code: 200
    input: []
    output: Inspection
    side_effects: ["Inspection -> CANCELLED"]

  # --- ReallocationRequest ---
  - method: POST
    path: "/reallocation-requests"
    description: "Request a budget reallocation between two lines (OCC-guarded by expected_loan_version)"
    roles: [LenderAdmin]
    code: 201
    input: [loan_id, from_budget_line_id, to_budget_line_id, amount_cents, justification, expected_loan_version]
    output: ReallocationRequest
    side_effects:
      - "status PENDING; created_loan_version recorded"
      - "increments Loan.version by 1"

  - method: GET
    path: "/reallocation-requests/{id}"
    description: "Get a ReallocationRequest"
    roles: [LenderAdmin, DrawProcessor, CreditOfficer, LoanServicer, Inspector, Borrower]
    code: 200
    input: []
    output: ReallocationRequest
    side_effects: []

  - method: GET
    path: "/reallocation-requests"
    description: "List ReallocationRequests with optional filters"
    roles: [LenderAdmin, DrawProcessor, CreditOfficer, LoanServicer, Inspector, Borrower]
    code: 200
    input: ["loan_id?", "from_budget_line_id?", "to_budget_line_id?", "status?", "limit?", "offset?"]
    output: ReallocationRequest[]
    side_effects: []

  - method: POST
    path: "/reallocation-requests/{id}/review"
    description: "Approve or reject a PENDING reallocation"
    roles: [CreditOfficer]
    code: 200
    input: [decision, "reason?"]
    output: ReallocationRequest
    side_effects: ["ReallocationRequest -> APPROVED or REJECTED"]

  - method: POST
    path: "/reallocation-requests/{id}/apply"
    description: "Apply an APPROVED reallocation to the budget lines"
    roles: [LoanServicer]
    code: 200
    input: []
    output: ReallocationRequest
    side_effects:
      - "from_line.revised_amount_cents -= amount; to_line.revised_amount_cents += amount"
      - "increments Loan.version by 1"

  - method: POST
    path: "/reallocation-requests/{id}/cancel"
    description: "Cancel a PENDING or APPROVED reallocation"
    roles: [LenderAdmin]
    code: 200
    input: []
    output: ReallocationRequest
    side_effects: ["ReallocationRequest -> CANCELLED"]

  # --- RetainageRelease ---
  - method: POST
    path: "/retainage-releases"
    description: "Request release of withheld retainage on a budget line"
    roles: [Borrower]
    code: 201
    input: [loan_id, budget_line_id, amount_cents, reason]
    output: RetainageRelease
    side_effects: ["status REQUESTED"]

  - method: GET
    path: "/retainage-releases/{id}"
    description: "Get a RetainageRelease"
    roles: [LenderAdmin, DrawProcessor, CreditOfficer, LoanServicer, Inspector, Borrower]
    code: 200
    input: []
    output: RetainageRelease
    side_effects: []

  - method: GET
    path: "/retainage-releases"
    description: "List RetainageReleases with optional filters"
    roles: [LenderAdmin, DrawProcessor, CreditOfficer, LoanServicer, Inspector, Borrower]
    code: 200
    input: ["loan_id?", "budget_line_id?", "status?", "limit?", "offset?"]
    output: RetainageRelease[]
    side_effects: []

  - method: POST
    path: "/retainage-releases/{id}/review"
    description: "Approve or reject a REQUESTED retainage release"
    roles: [CreditOfficer]
    code: 200
    input: [decision, "reason?"]
    output: RetainageRelease
    side_effects: ["RetainageRelease -> APPROVED or REJECTED"]

  - method: POST
    path: "/retainage-releases/{id}/pay"
    description: "Pay an APPROVED release: transfers retained -> disbursed on the line"
    roles: [LoanServicer]
    code: 200
    input: []
    output: RetainageRelease
    side_effects:
      - "BudgetLine retained_cents -= amount; disbursed_cents += amount"
      - "Loan aggregates recomputed; retainage_fully_released set when retained reaches 0; Loan.version increments"

  # --- ConversionReview ---
  - method: POST
    path: "/conversion-reviews"
    description: "Request conversion of a construction loan to permanent financing"
    roles: [Borrower]
    code: 201
    input: [loan_id]
    output: ConversionReview
    side_effects: ["status REQUESTED; ERR_CONVERSION_IN_PROGRESS when another REQUESTED/APPROVED review exists for the loan"]

  - method: GET
    path: "/conversion-reviews/{id}"
    description: "Get a ConversionReview"
    roles: [LenderAdmin, DrawProcessor, CreditOfficer, LoanServicer, Inspector, Borrower]
    code: 200
    input: []
    output: ConversionReview
    side_effects: []

  - method: GET
    path: "/conversion-reviews"
    description: "List ConversionReviews with optional filters"
    roles: [LenderAdmin, DrawProcessor, CreditOfficer, LoanServicer, Inspector, Borrower]
    code: 200
    input: ["loan_id?", "status?", "limit?", "offset?"]
    output: ConversionReview[]
    side_effects: []

  - method: POST
    path: "/conversion-reviews/{id}/review"
    description: "Approve (readiness-gated) or decline a REQUESTED conversion review"
    roles: [CreditOfficer]
    code: 200
    input: [decision, "reason?"]
    output: ConversionReview
    side_effects: ["ConversionReview -> APPROVED or DECLINED"]

  - method: POST
    path: "/conversion-reviews/{id}/convert"
    description: "Execute conversion to permanent financing for an APPROVED review"
    roles: [LoanServicer]
    code: 200
    input: [permanent_interest_rate_annual_bps, permanent_term_months]
    output: ConversionReview
    side_effects:
      - "ConversionReview -> CONVERTED; permanent terms recorded"
      - "Loan OPEN -> CONVERTED cascade: budget lines CLOSED, reserve SWEEP entry, permanent terms copied, Loan.version increments"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT, http: 400, condition: "Missing/invalid X-User-ID or X-User-Role header" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Role not permitted for endpoint, or Borrower-role write where X-User-ID != loan.borrower_id" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum value, non-positive amount, or stored-materials fields present on a WORK_COMPLETED line" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid from-state for the requested transition (includes already-terminal lockdown and repeat mark-installed)" }
  - { id: ERR_LOAN_NOT_OPEN, http: 409, condition: "Operation requires Loan.status == OPEN but loan is CONVERTED or TERMINATED" }
  - { id: ERR_STALE_LOAN_VERSION, http: 412, condition: "expected_loan_version does not match current Loan.version on POST /reallocation-requests" }
  - { id: ERR_LIEN_WAIVER_UNVERIFIED, http: 409, condition: "Verified waiver coverage below required unconditional/conditional amounts at draw approve" }
  - { id: ERR_DRAW_PERIOD_INVALID, http: 422, condition: "period_end_date <= period_start_date at draw creation" }
  - { id: ERR_DRAW_PERIOD_OVERLAP, http: 409, condition: "Billing period overlaps a sibling draw in {SUBMITTED, UNDER_REVIEW, REVISION_REQUESTED, APPROVED, FUNDED} (half-open intervals; adjacency allowed)" }
  - { id: ERR_INSPECTION_SCHEDULE_CONFLICT, http: 409, condition: "New ORDERED inspection within +/- 2 days of an existing ORDERED inspection on the same loan (minimum 3-day gap)" }
  - { id: ERR_INSPECTION_STALE, http: 409, condition: "ACCEPTED inspection's completed_date lies outside the draw's [period_start_date, period_end_date] at approve" }
  - { id: ERR_DRAW_HAS_NO_LINES, http: 422, condition: "Submit requested on a draw with zero line items" }
  - { id: ERR_DUPLICATE_COST_CODE, http: 409, condition: "cost_code already used by another BudgetLine of the same loan" }
  - { id: ERR_STORED_MATERIALS_EVIDENCE_MISSING, http: 422, condition: "STORED_MATERIALS line missing stored_material_invoice_cents, insurance_certificate_ref, or stored_location" }
  - { id: ERR_REALLOCATION_SAME_LINE, http: 422, condition: "from_budget_line_id == to_budget_line_id" }
  - { id: ERR_CONTINGENCY_DIRECTION_VIOLATION, http: 422, condition: "Reallocation target is a contingency line (contingency may only be a source)" }
  - { id: ERR_CONVERSION_IN_PROGRESS, http: 409, condition: "A ConversionReview in {REQUESTED, APPROVED} already exists for the loan" }
  - { id: ERR_LINE_NOT_STORED_MATERIALS, http: 422, condition: "mark-installed called on a WORK_COMPLETED line item" }
  - { id: ERR_INSPECTION_REQUIRED, http: 409, condition: "No ACCEPTED inspection linked to the draw at approve" }
  - { id: ERR_RETAINAGE_NOT_RELEASABLE, http: 409, condition: "Release requested before milestone_reached and without a 100.00 ACCEPTED inspection" }
  - { id: ERR_CONVERSION_PRECONDITIONS_UNMET, http: 409, condition: "Conversion approve blocked: retained_cents > 0, non-terminal draws exist, or no ACCEPTED 100.00 inspection" }
  - { id: ERR_BUDGET_LINE_LOAN_MISMATCH, http: 422, condition: "Budget line belongs to a different loan than the draw/reallocation/release references" }
  - { id: ERR_DRAW_LOAN_MISMATCH, http: 422, condition: "Inspection's draw_id belongs to a different loan than loan_id" }
  - { id: ERR_COMMITMENT_EXCEEDED, http: 422, condition: "Sum of budget-line original_amount_cents would exceed loan commitment_amount_cents" }
  - { id: ERR_INVOICE_COVERAGE_INSUFFICIENT, http: 422, condition: "Verified INVOICE total below requested WORK_COMPLETED total at approve" }
  - { id: ERR_NOTHING_APPROVABLE, http: 422, condition: "Computed approved_total_cents == 0 at approve" }
  - { id: ERR_RELEASE_EXCEEDS_RETAINED, http: 422, condition: "Release amount exceeds the line's current retained_cents (at create or re-checked at pay)" }
  - { id: ERR_REALLOCATION_BELOW_FLOOR, http: 422, condition: "Apply would drop from-line revised below disbursed + retained + approved_unfunded" }
  - { id: ERR_LOAN_HAS_ACTIVITY, http: 409, condition: "Terminate blocked by disbursed/retained balances or non-terminal child workflows" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: LenderAdmin
    description: "Lender operations administrator; owns loan/budget/borrower setup and reallocation drafting"
    identity: opaque
    exclusive_operations: ["POST /borrowers", "POST /loans", "POST /loans/{id}/terminate", "POST /budget-lines", "POST /reallocation-requests", "POST /reallocation-requests/{id}/cancel"]
    shared_operations: ["all GET endpoints"]

  - name: DrawProcessor
    description: "Draw intake/review specialist; verifies documents and manages inspections"
    identity: opaque
    exclusive_operations: ["POST /draws/{id}/start-review", "POST /draws/{id}/request-revision", "POST /draws/{id}/reject", "POST /draw-documents/{id}/review", "POST /inspections", "POST /inspections/{id}/review", "POST /inspections/{id}/cancel", "POST /draw-line-items/{id}/mark-installed"]
    shared_operations: ["all GET endpoints"]

  - name: CreditOfficer
    description: "Credit authority; approves draws, reallocations, retainage releases, and conversions"
    identity: opaque
    exclusive_operations: ["POST /draws/{id}/approve", "POST /reallocation-requests/{id}/review", "POST /retainage-releases/{id}/review", "POST /conversion-reviews/{id}/review"]
    shared_operations: ["all GET endpoints"]

  - name: LoanServicer
    description: "Servicing desk; moves money and runs accruals"
    identity: opaque
    exclusive_operations: ["POST /draws/{id}/fund", "POST /reallocation-requests/{id}/apply", "POST /retainage-releases/{id}/pay", "POST /loans/{id}/interest-accruals", "POST /conversion-reviews/{id}/convert"]
    shared_operations: ["all GET endpoints"]

  - name: Inspector
    description: "Third-party inspector; reports inspection results only"
    identity: opaque
    exclusive_operations: ["POST /inspections/{id}/complete"]
    shared_operations: ["all GET endpoints"]

  - name: Borrower
    description: "Borrower contact; submits draws, documents, release and conversion requests for own loans"
    identity: "entity_backed:Borrower"
    exclusive_operations: ["POST /draws", "POST /draws/{id}/submit", "POST /draws/{id}/withdraw", "POST /draw-line-items", "POST /draw-documents", "POST /retainage-releases", "POST /conversion-reviews"]
    shared_operations: ["all GET endpoints"]
