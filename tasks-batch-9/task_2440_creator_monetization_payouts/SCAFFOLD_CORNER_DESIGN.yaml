        distinguishing_aspect: "The derived balance is checked at three points against the signed sum of the ledger: 100000 after the accrual, 0 after the RED re-rating reverses it, and -20000 after a further 20000-cent CLAWBACK-free accrual is reversed twice would not occur, so the middle value proves the reversal is a new row rather than an edit of the original."
