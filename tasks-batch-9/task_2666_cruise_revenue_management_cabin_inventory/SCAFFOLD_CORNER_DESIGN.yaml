            - call: "POST /guests"
              payload: { full_name: "Cy Dara", email: "cy@example.com", prior_sailings_count: 0 }
              as: ReservationAgent
              captures: { g_cy: $.data.id }
          trigger:
            - call: "POST /group-blocks/${blk_alpha}/review"
              payload: {}
              as: GroupSalesAgent
              as_user_id: "gsa-001"
              captures: { e1: $.data.error_id }
            - call: "POST /group-blocks/${blk_alpha}/extend-review"
              payload: { new_review_date: "2026-09-01T00:00:00Z" }
              as: GroupSalesAgent
              as_user_id: "gsa-001"
