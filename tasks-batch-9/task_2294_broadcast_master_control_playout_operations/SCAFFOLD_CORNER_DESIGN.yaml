            - *mux1_read_v2
            - *ch2
            - *as_prog
            - *dl_prog
            - *qc_prog
            - *as_spot
            - *dl_spot
            - *qc_spot
            - *as_promo
            - *dl_promo
            - *qc_promo
            - *as_inter
            - *dl_inter
            - *qc_inter
            - *ord1
            - *pl1
            - *pl1_validate
            - *pl1_arm
          trigger:
            - call: "POST /playlists/${pl1_id}/traffic-revisions"
              payload:
                expected_playlist_version: "${pl1_v3}"
                items:
                  - { sequence_number: 1, element_kind: PROGRAM, asset_id: "${aprog_id}", scheduled_start_utc: "2026-08-01T12:00:00Z", scheduled_duration_seconds: 1800 }
                  - { sequence_number: 2, element_kind: COMMERCIAL, asset_id: "${aspot_id}", spot_order_id: "${ord1_id}", scheduled_start_utc: "2026-08-01T12:30:00Z", scheduled_duration_seconds: 30 }
                  - { sequence_number: 3, element_kind: PROGRAM, asset_id: "${aprog_id}", scheduled_start_utc: "2026-08-01T12:30:30Z", scheduled_duration_seconds: 1770 }
              as: TrafficCoordinator
              captures: { pl1_v4: "$.data.version" }
            - call: "GET /playlists/${pl1_id}/items"
              as: TrafficCoordinator
            - call: "GET /spot-orders/${ord1_id}"
              as: TrafficCoordinator
            - call: "POST /playlists/${pl1_id}/state"
              payload: { target_status: VALIDATED }
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
            - call: "POST /playlists/${pl1_id}/state"
              payload: { target_status: ARMED }
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
          assert:
