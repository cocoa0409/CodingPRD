  # ---------------------------------------------------------------- rule 9 ---
  - rule_id: compensating_invariant
    instances:
      - name: invoice_conservation_under_confirm_withdraw
        grounds:
          - calculations.school_invoice_total
          - calculations.entry_fee_total
          - state_machines.Entry.REGISTERED_to_CONFIRMED
          - state_machines.Entry.CONFIRMED_to_WITHDRAWN
        distinguishing_aspect: |
          Conserved quantity: money (School.invoice_balance_cents). The forward action
          (confirm: +2500 fee) paired with its compensating action (withdraw pre-lock: fee
          leaves the invoice status set) restores the invariant invoice_balance_cents ==
          entry_fees + judge_fees - discount - payments exactly to its prior value 0 —
          a different conserved quantity from the judge-booking instance.
        test_recipe:
          setup:
            - "Tournament (entry_fee 2500), DEBATE/CX/VARSITY division, school Alpha, registration open; school invoice observed at 0."
          setup_api_calls:
            - { call: "POST /tournaments", payload: { name: "Districts IC", registration_opens_at: "2026-08-01T00:00:00Z", registration_locks_at: "2026-08-10T00:00:00Z", entry_fee_cents: 2500 }, as: TournamentDirector, captures: { t: $.data.id } }
            - { call: "POST /divisions", payload: { tournament_id: "${t}", event_type: "DEBATE", event_code: "CX", division: "VARSITY" }, as: TournamentDirector, captures: { d: $.data.id } }
            - { call: "POST /schools", payload: { tournament_id: "${t}", name: "Alpha" }, as: TournamentDirector, captures: { s_a: $.data.id } }
            - { call: "POST /tournaments/${t}/open-registration", as: TournamentDirector }
            - { call: "POST /entries", payload: { school_id: "${s_a}", division_id: "${d}", competitor_name: "A-One" }, as: SchoolCoach, as_user_id: "${s_a}", captures: { e1: $.data.id } }
            - { call: "GET /schools/${s_a}", as: SchoolCoach, as_user_id: "${s_a}" }
          trigger:
            - { call: "POST /entries/${e1}/confirm", as: SchoolCoach, as_user_id: "${s_a}" }
            - { call: "GET /schools/${s_a}", as: SchoolCoach, as_user_id: "${s_a}" }
            - { call: "POST /entries/${e1}/withdraw", as: SchoolCoach, as_user_id: "${s_a}" }
            - { call: "GET /schools/${s_a}", as: SchoolCoach, as_user_id: "${s_a}" }
            - { call: "GET /entries/${e1}", as: SchoolCoach, as_user_id: "${s_a}" }
          assert:
            - "initial: School.${s_a}.invoice_balance_cents == 0"
            - "after confirm: invoice_balance_cents == 2500 (entry fee charged)"
            - "after compensating withdraw: invoice_balance_cents == 0 exactly (invariant invoice == entry_fees + judge_fees - discount - payments holds with zero drift)"
            - "Entry.${e1}.status == WITHDRAWN with fee_charged_cents == 2500 retained as audit but excluded from the invoice status set"

      - name: judge_assignment_capacity_conservation
        grounds:
          - state_machines.Pairing.PENDING_STAFFING_to_STAFFED
          - state_machines.Pairing.STAFFED_to_PENDING_STAFFING
          - entities.Judge.fields.assigned_round_count
        distinguishing_aspect: |
          Conserved quantity: judge round-slot bookings (assigned_round_count / pairings
          staffed by the judge) — a different conserved quantity from invoice cents.
          assign-judge (+1) paired with its compensating unassign-judge (-1) returns the
          booking count to its exact prior value and reverts the pairing to PENDING_STAFFING.
        test_recipe:
          setup:
            - "Tournament (prelim_round_count 2) with DEBATE/CX/VARSITY division; schools Alpha, Beta with 1 confirmed entry each; school Epsilon with committed judge J-Epsilon-1 (2 rounds); locked; round 1 paired (A1,B1); room assigned."
