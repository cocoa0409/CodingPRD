              captures: { minor_study: $.data.id }
          assert:
            - "ImagingStudy.${adult_study}.retention_until == 2033-06-01T09:00:00Z (acquired_at + 7 years)"
            - "ImagingStudy.${minor_study}.retention_until == 2041-03-15T00:00:00Z (2016-03-15 + 18 years + 7 years), NOT 2033-06-01T09:00:00Z"
            - "both studies report dose_flag == WITHIN_PROTOCOL and neither response carries a version field"
            - "advancing the logical clock does not change either retention_until - retention is anchored to acquisition"

      - name: dose_exactly_at_the_reference_level_stays_within_protocol
