      - call: POST /api/v1/lessees
        payload:
          legal_name: LESS-XS-B
          credit_tier: B
          utilization_threshold_pct: 60
          credit_ceiling_cents: 4000000
        as: LeaseAdministrator
        captures:
          ls_b_id: $.data.id
      trigger:
