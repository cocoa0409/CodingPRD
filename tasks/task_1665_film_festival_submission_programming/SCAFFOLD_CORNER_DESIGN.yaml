            - { call: "POST /festival/screener-assignments/${a1}/scores", payload: { originality: 5, craft: 5, story: 5, overall: 5, recommendation: NEUTRAL }, as: PROGRAMMER, as_user_id: "${p2}", captures: { err2: $.data.error_id } }
            - { call: "GET /festival/submissions/${film}", payload: {}, as: FILMMAKER, as_user_id: "${submA}", captures: { ok: $.data.id } }
          assert:
