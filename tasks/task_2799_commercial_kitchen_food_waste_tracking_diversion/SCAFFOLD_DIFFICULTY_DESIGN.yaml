            - "POST /shifts/${shift_id}/close a second time returns 409 ERR_INVALID_SHIFT_STATE, so the revaluation cannot be applied twice and valued_waste_cost_cents cannot drift past 2043."

  # =======================================================================
  - rule_id: priority_pair_validation_conflict
    mechanism: |
      Three requests each violate TWO rules of the §1.4 ladder at once, and each
      pair is drawn from a different pair of error categories, so no single
      "check order" shortcut satisfies all three:
        (1) business_temporal P82  vs business_constraint  P120 on POST /waste-entries;
        (2) business_safety   P75  vs business_temporal    P85  on POST /consignment-lines;
        (3) business_referential P80 vs business_constraint P95  on POST /consignment-lines.
      Every instance then repairs ONLY the higher-priority violation and re-issues
      the same call, which must now surface the lower-priority error — that second
      call is what proves the ordering rather than a lucky single-error match.
    instances:

      - name: capture_date_outside_shift_outranks_loss_reason_station_mismatch
        grounds: "§1.4 validations[priority=82] ERR_CAPTURE_OUTSIDE_SHIFT_DATE (business_temporal) versus validations[priority=120] ERR_LOSS_REASON_STATION_MISMATCH (business_constraint); §1.6 both errors at 422."
        distinguishing_aspect: "Pair (business_temporal, business_constraint) with a 38-priority gap on the capture endpoint. Both rules read only the request body plus one referenced row, so neither is 'obviously' cheaper to evaluate — an implementation that validates the loss_reason/station pairing while building the entry, before comparing dates, returns the wrong error."
        test_recipe:
          setup: |
            One site, one PREP station, FT_PREP, and one OPEN shift dated 2026-06-10 with
            meals_served 1000. The capture request then carries BOTH defects: captured_at on
            2026-06-09 (one day before the shift date) and loss_reason PLATE_WASTE, which is only
            accepted at a DISH_RETURN station.
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Harbor Kitchen", site_code: "HK-01", region_code: "NE" }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { site_id: "$.data.id" }
            - call: "POST /tracking-stations"
              payload: { site_id: "${site_id}", station_code: "PREP-1", station_kind: "PREP", calibration_due_at: "2027-01-01T00:00:00Z", capture_lock_seconds: 30 }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { station_id: "$.data.id" }
            - call: "POST /food-types"
              payload: { name: "Braised Chicken Portion", category: "PREPARED", default_cost_per_kg_cents: 640, donation_eligible: true, animal_feed_eligible: true, compostable: true, donation_shelf_life_hours: 24 }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { food_type_id: "$.data.id" }
            - call: "POST /shifts"
              payload: { site_id: "${site_id}", shift_date: "2026-06-10", shift_code: "AM", meals_served: 1000 }
              as: ShiftLead
              as_user_id: "sl-1"
              captures: { shift_id: "$.data.id" }
          trigger:
            - call: "POST /waste-entries"
              payload: { station_id: "${station_id}", shift_id: "${shift_id}", food_type_id: "${food_type_id}", weight_grams: 900, loss_reason: "PLATE_WASTE", captured_at: "2026-06-09T10:00:00Z" }
              as: KitchenStaff
              as_user_id: "ks-1"
              captures: { first_error: "$.data.error_id" }
            - call: "POST /waste-entries"
              payload: { station_id: "${station_id}", shift_id: "${shift_id}", food_type_id: "${food_type_id}", weight_grams: 900, loss_reason: "PLATE_WASTE", captured_at: "2026-06-10T10:00:00Z" }
              as: KitchenStaff
              as_user_id: "ks-1"
              captures: { second_error: "$.data.error_id" }
          assert:
            - "The first trigger call returns 422 with error_id ERR_CAPTURE_OUTSIDE_SHIFT_DATE — the priority-82 temporal rule wins over the priority-120 constraint rule."
            - "The second trigger call repairs ONLY the date (captured_at moved onto the shift date, loss_reason still PLATE_WASTE at a PREP station) and returns 422 with error_id ERR_LOSS_REASON_STATION_MISMATCH."
            - "Neither call creates a row: GET /waste-entries?shift_id=${shift_id} returns total_count == 0 and GET /shifts/${shift_id} still reports shift_waste_grams == 0 with waste_intensity_kg_per_1k_meals == 0.000."

      - name: channel_ineligible_food_outranks_expired_donation_window
        grounds: "§1.4 validations[priority=75] ERR_CHANNEL_INELIGIBLE_FOOD (business_safety) versus validations[priority=85] ERR_DONATION_WINDOW_EXPIRED (business_temporal); §1.3 calculations.entry_stream_segmentation."
        distinguishing_aspect: "Pair (business_safety, business_temporal) — the reverse orientation of the previous instance, where the temporal rule was the WINNER and here it is the loser, on a different endpoint. The two trigger calls differ in nothing but the FoodType of the routed entry, so the pair cannot be satisfied by ordering on request shape; the implementation must order on the rule ladder."
        test_recipe:
