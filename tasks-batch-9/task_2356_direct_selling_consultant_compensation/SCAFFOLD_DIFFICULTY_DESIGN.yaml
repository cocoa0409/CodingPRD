            - "touch_error == ERR_SANCTION_WINDOW_CONFLICT with HTTP 409 — the closed interval [2026-08-20, 2026-08-21] shares the instant 2026-08-20 with case 1, which the half-open period rule would have allowed"
            - "buffer_error == ERR_SANCTION_WINDOW_CONFLICT with HTTP 409 — [2026-09-10, 2026-09-20] intersects nothing but begins inside the 30-day cooloff running from 2026-08-20 through 2026-09-19"
