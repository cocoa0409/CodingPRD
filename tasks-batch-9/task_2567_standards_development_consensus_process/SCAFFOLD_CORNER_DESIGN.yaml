# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Scaffold Corner Design (breadth probe)
# Scenario 2567 — Standards Development Consensus Process
#
# One `section:` block per section of references/claim-extraction-guide.md; every `claim_type:`
# is a row label taken from that guide's per-section tables. Instances whose corner is already
# asserted by a §1.8 instance carry an `excluded_because:` stub and NO test_recipe.
#
# Shared literals used by every chain below (so that two instances never disagree):
#   participants  Ada Producer / Acme Steel / PRODUCER / ACME              -> ${p1}  (TC-14 chair)
#                 Ben User / City Water / USER / CITYW                     -> ${p2}
#                 Cleo General / Safety League / GENERAL_INTEREST / SAFEL  -> ${p3}
#                 Dan Regulator / State Fire Marshal / REGULATORY / FIREM  -> ${p4}
#                 Eve Academic / Metro University / ACADEMIC / METRU       -> ${p5}
#                 Zoe Outsider / Unaffiliated Consultancy / ACADEMIC/ZOEC  -> ${p6} (never appointed)
#   committee     TC-14 "Structural fasteners", max_concurrent_ballots 2   -> ${c1}
#   work item     "Fastener torque spec", NEW_STANDARD, designation STD-1400 -> ${w1}
#   draft         revision 1, total_clause_count 40, changed_clause_count 0 -> ${d1}
#   logical clock startup default 2026-08-01T00:00:00Z (POST /_clock/set_current_utc)
#
# Every numeric assertion below was computed from the §1.4 formula and its `constants:`.

scaffold_corner_design:

  # ===================================================================================
  # Guide section 1 — From Table 1 (Entities).  entity_topology: flat
  # ===================================================================================
  - section: entities
    instances:

      - name: participant_creation_returns_all_declared_input_fields
        claim_type: creation
        grounds:
          - entities.Participant
          - endpoints[POST /sdo/participants]
        distinguishing_aspect: "POST /sdo/participants with the four declared input fields returns 201 and the stored row echoes all four plus the common fields, with version 1 and created_at equal to the logical clock."
        test_recipe:
          setup:
            - "Empty database."
            - "Logical clock pinned to its 2026-08-01T00:00:00Z default so created_at is deterministic."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StandardsStaff
          trigger:
            - call: "POST /sdo/participants"
              payload: { full_name: "Ada Producer", organization: "Acme Steel", interest_category: "PRODUCER", employer_affiliation_code: "ACME" }
              as: StandardsStaff
              captures: { pnew: $.data.id }
          assert:
            - 'HTTP status == 201'
            - 'Participant.${pnew}.full_name == "Ada Producer"'
            - 'Participant.${pnew}.organization == "Acme Steel"'
            - 'Participant.${pnew}.interest_category == PRODUCER'
            - 'Participant.${pnew}.employer_affiliation_code == "ACME"'
            - 'Participant.${pnew}.version == 1'
            - 'Participant.${pnew}.created_at == 2026-08-01T00:00:00Z'
            - 'response envelope carries meta.api_request_id, response_type == "object" and the row under data'

      - name: committee_retrieval_returns_the_stored_balance_counters
        claim_type: retrieval
        grounds:
          - endpoints[GET /sdo/committees/{committeeId}]
          - entities.TechnicalCommittee.fields.balance_status
          - entities.TechnicalCommittee.fields.category_counts
          - calculations.committee_balance_evaluation
        distinguishing_aspect: "GET /sdo/committees/{committeeId} returns the same balance counters the activation request persisted: balance_status BALANCED, active_member_count 3, dominance_pct 33.3, distinct_category_count 3."
        test_recipe:
          setup:
            - "Three participants on distinct employer codes in three distinct interest categories (PRODUCER/ACME, USER/CITYW, GENERAL_INTEREST/SAFEL)."
            - "Committee TC-14 chaired by the PRODUCER with all three appointed as voting members, activated so balance_status is BALANCED."
          setup_api_calls:
            - call: "POST /sdo/participants"
              payload: { full_name: "Ada Producer", organization: "Acme Steel", interest_category: "PRODUCER", employer_affiliation_code: "ACME" }
              as: StandardsStaff
              captures: { p1: $.data.id }
            - call: "POST /sdo/participants"
              payload: { full_name: "Ben User", organization: "City Water", interest_category: "USER", employer_affiliation_code: "CITYW" }
              as: StandardsStaff
              captures: { p2: $.data.id }
            - call: "POST /sdo/participants"
              payload: { full_name: "Cleo General", organization: "Safety League", interest_category: "GENERAL_INTEREST", employer_affiliation_code: "SAFEL" }
              as: StandardsStaff
              captures: { p3: $.data.id }
            - call: "POST /sdo/committees"
              payload: { designation: "TC-14", scope_text: "Structural fasteners", chair_participant_id: "${p1}", max_concurrent_ballots: 2 }
              as: StandardsStaff
              captures: { c1: $.data.id }
            - call: "POST /sdo/committees/${c1}/memberships"
              payload: { participant_id: "${p1}", voting_rights: true }
              as: StandardsStaff
              captures: { m1: $.data.id }
            - call: "POST /sdo/committees/${c1}/memberships"
              payload: { participant_id: "${p2}", voting_rights: true }
              as: StandardsStaff
              captures: { m2: $.data.id }
            - call: "POST /sdo/committees/${c1}/memberships"
              payload: { participant_id: "${p3}", voting_rights: true }
              as: StandardsStaff
              captures: { m3: $.data.id }
            - call: "POST /sdo/committees/${c1}/activate"
              payload: {}
              as: StandardsStaff
          trigger:
            - call: "GET /sdo/committees/${c1}"
              payload: {}
              as: StandardsStaff
          assert:
            - 'HTTP status == 200'
            - 'TechnicalCommittee.${c1}.designation == "TC-14"'
            - 'TechnicalCommittee.${c1}.status == ACTIVE'
            - 'TechnicalCommittee.${c1}.balance_status == BALANCED'
            - 'TechnicalCommittee.${c1}.roster_balance_status == BALANCED'
            - 'TechnicalCommittee.${c1}.active_member_count == 3'
            - 'TechnicalCommittee.${c1}.roster_member_count == 3'
            - 'TechnicalCommittee.${c1}.dominance_pct == 33.3'
            - 'TechnicalCommittee.${c1}.distinct_category_count == 3'
            - 'TechnicalCommittee.${c1}.category_counts == { PRODUCER: 1, USER: 1, GENERAL_INTEREST: 1 }'
            - 'TechnicalCommittee.${c1}.open_ballot_count == 0'

      - name: participant_listing_reports_total_count_and_has_more_across_two_pages
        claim_type: listing
        grounds:
          - endpoints[GET /sdo/participants]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With exactly 3 participants stored, GET /sdo/participants?limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, and offset=2 returns the remaining 1 row with has_more false."
        test_recipe:
          setup:
            - "Three participants registered and nothing else."
          setup_api_calls:
            - call: "POST /sdo/participants"
              payload: { full_name: "Ada Producer", organization: "Acme Steel", interest_category: "PRODUCER", employer_affiliation_code: "ACME" }
              as: StandardsStaff
              captures: { p1: $.data.id }
            - call: "POST /sdo/participants"
              payload: { full_name: "Ben User", organization: "City Water", interest_category: "USER", employer_affiliation_code: "CITYW" }
              as: StandardsStaff
              captures: { p2: $.data.id }
            - call: "POST /sdo/participants"
              payload: { full_name: "Cleo General", organization: "Safety League", interest_category: "GENERAL_INTEREST", employer_affiliation_code: "SAFEL" }
              as: StandardsStaff
              captures: { p3: $.data.id }
          trigger:
            - call: "GET /sdo/participants"
              payload: { limit: 2, offset: 0 }
              as: StandardsStaff
            - call: "GET /sdo/participants"
              payload: { limit: 2, offset: 2 }
              as: StandardsStaff
          assert:
            - 'first page: response.data length == 2'
            - 'first page: response.total_count == 3'
            - 'first page: response.limit == 2 and response.offset == 0'
            - 'first page: response.has_more == true'
            - 'second page: response.data length == 1'
            - 'second page: response.total_count == 3 and response.offset == 2'
            - 'second page: response.has_more == false'
            - 'response_type == "array" on both pages'

      - name: work_item_retrieval_with_an_unknown_id_returns_work_item_not_found
        claim_type: not_found
        grounds:
          - endpoints[GET /sdo/work-items/{workItemId}]
          - validations[priority=30]
          - errors[ERR_WORK_ITEM_NOT_FOUND]
        distinguishing_aspect: "A well-formed workItemId that matches no stored row returns ERR_WORK_ITEM_NOT_FOUND with HTTP 404, never an empty 200 envelope."
        test_recipe:
          setup:
            - "Empty database — no WorkItem row has ever been created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StandardsStaff
          trigger:
            - call: "GET /sdo/work-items/11111111-1111-1111-1111-111111111111"
              payload: {}
              as: StandardsStaff
              captures: { err: $.data.error_id }
          assert:
            - 'HTTP status == 404'
            - 'response.data.error_id == ERR_WORK_ITEM_NOT_FOUND'
            - 'response.response_type == "error"'

      - name: committee_creation_missing_required_designation_returns_invalid_request
        claim_type: required_fields
        grounds:
          - endpoints[POST /sdo/committees]
          - entities.TechnicalCommittee.fields.designation
          - validations[priority=40]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "designation is declared source input with no default, so omitting it returns ERR_INVALID_REQUEST (400) and no TechnicalCommittee row is created."
        test_recipe:
          setup:
            - "One participant registered to serve as the chair candidate."
          setup_api_calls:
            - call: "POST /sdo/participants"
              payload: { full_name: "Ada Producer", organization: "Acme Steel", interest_category: "PRODUCER", employer_affiliation_code: "ACME" }
              as: StandardsStaff
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /sdo/committees"
              payload: { scope_text: "Structural fasteners", chair_participant_id: "${p1}" }
              as: StandardsStaff
              captures: { err: $.data.error_id }
          assert:
            - 'HTTP status == 400'
            - 'response.data.error_id == ERR_INVALID_REQUEST'
            - 'GET /sdo/committees returns total_count == 0'

      - name: committee_creation_omitting_max_concurrent_ballots_applies_the_declared_default
        claim_type: defaults
        grounds:
          - entities.TechnicalCommittee.fields.max_concurrent_ballots
          - entities.TechnicalCommittee.fields.status
          - entities.TechnicalCommittee.fields.balance_status
        distinguishing_aspect: "Omitting max_concurrent_ballots stores 2, and the freshly created committee carries status FORMING, balance_status UNBALANCED, active_member_count 0 and dominance_pct 0.0."
        test_recipe:
          setup:
            - "One participant registered to serve as the chair candidate."
          setup_api_calls:
            - call: "POST /sdo/participants"
              payload: { full_name: "Ada Producer", organization: "Acme Steel", interest_category: "PRODUCER", employer_affiliation_code: "ACME" }
              as: StandardsStaff
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /sdo/committees"
              payload: { designation: "TC-21", scope_text: "Weld inspection", chair_participant_id: "${p1}" }
              as: StandardsStaff
              captures: { cnew: $.data.id }
          assert:
            - 'HTTP status == 201'
            - 'TechnicalCommittee.${cnew}.max_concurrent_ballots == 2'
            - 'TechnicalCommittee.${cnew}.status == FORMING'
            - 'TechnicalCommittee.${cnew}.balance_status == UNBALANCED'
            - 'TechnicalCommittee.${cnew}.roster_balance_status == UNBALANCED'
            - 'TechnicalCommittee.${cnew}.active_member_count == 0'
            - 'TechnicalCommittee.${cnew}.dominance_pct == 0.0'
            - 'TechnicalCommittee.${cnew}.distinct_category_count == 0'

      - name: membership_creation_omitting_voting_rights_defaults_to_true_and_snapshots_the_category
        claim_type: defaults
        grounds:
          - entities.CommitteeMembership.fields.voting_rights
          - entities.CommitteeMembership.fields.interest_category
          - entities.CommitteeMembership.fields.employer_affiliation_code
          - endpoints[POST /sdo/committees/{committeeId}/memberships]
        distinguishing_aspect: "Omitting voting_rights stores true, and interest_category / employer_affiliation_code are snapshotted from the Participant (PRODUCER / ACME) rather than left null."
        test_recipe:
          setup:
            - "One PRODUCER participant on employer code ACME and committee TC-14 still FORMING."
          setup_api_calls:
            - call: "POST /sdo/participants"
              payload: { full_name: "Ada Producer", organization: "Acme Steel", interest_category: "PRODUCER", employer_affiliation_code: "ACME" }
              as: StandardsStaff
              captures: { p1: $.data.id }
            - call: "POST /sdo/committees"
              payload: { designation: "TC-14", scope_text: "Structural fasteners", chair_participant_id: "${p1}", max_concurrent_ballots: 2 }
              as: StandardsStaff
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /sdo/committees/${c1}/memberships"
              payload: { participant_id: "${p1}" }
              as: StandardsStaff
              captures: { mnew: $.data.id }
          assert:
            - 'HTTP status == 201'
            - 'CommitteeMembership.${mnew}.voting_rights == true'
            - 'CommitteeMembership.${mnew}.status == ACTIVE'
            - 'CommitteeMembership.${mnew}.interest_category == PRODUCER'
            - 'CommitteeMembership.${mnew}.employer_affiliation_code == "ACME"'
            - 'CommitteeMembership.${mnew}.missed_ballot_streak == 0'
            - 'CommitteeMembership.${mnew}.appointed_at == 2026-08-01T00:00:00Z'

      - name: editorial_comment_computes_is_substantive_false_while_technical_computes_true
        claim_type: computed_fields
        grounds:
          - entities.Comment.fields.is_substantive
          - entities.Comment.fields.status
          - endpoints[POST /sdo/comments]
        distinguishing_aspect: "is_substantive is source computed as comment_type IN {GENERAL, TECHNICAL} and is never carried by the request: two bodies that differ only in comment_type store false for EDITORIAL and true for TECHNICAL, which is what the substantive-change and disposition ledgers later read."
        test_recipe:
          setup:
            - "Three participants on distinct employer codes in three distinct interest categories (PRODUCER/ACME, USER/CITYW, GENERAL_INTEREST/SAFEL)."
            - "Committee TC-14 chaired by the PRODUCER with all three appointed as voting members, activated so balance_status is BALANCED."
            - "Work item STD-1400 scope-approved onto TC-14 and carrying revision-1 draft d1 of 40 clauses."
            - "Logical clock left at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /sdo/participants"
              payload: { full_name: "Ada Producer", organization: "Acme Steel", interest_category: "PRODUCER", employer_affiliation_code: "ACME" }
              as: StandardsStaff
              captures: { p1: $.data.id }
            - call: "POST /sdo/participants"
              payload: { full_name: "Ben User", organization: "City Water", interest_category: "USER", employer_affiliation_code: "CITYW" }
              as: StandardsStaff
              captures: { p2: $.data.id }
            - call: "POST /sdo/participants"
              payload: { full_name: "Cleo General", organization: "Safety League", interest_category: "GENERAL_INTEREST", employer_affiliation_code: "SAFEL" }
              as: StandardsStaff
              captures: { p3: $.data.id }
            - call: "POST /sdo/committees"
              payload: { designation: "TC-14", scope_text: "Structural fasteners", chair_participant_id: "${p1}", max_concurrent_ballots: 2 }
              as: StandardsStaff
              captures: { c1: $.data.id }
            - call: "POST /sdo/committees/${c1}/memberships"
              payload: { participant_id: "${p1}", voting_rights: true }
              as: StandardsStaff
              captures: { m1: $.data.id }
            - call: "POST /sdo/committees/${c1}/memberships"
              payload: { participant_id: "${p2}", voting_rights: true }
              as: StandardsStaff
              captures: { m2: $.data.id }
            - call: "POST /sdo/committees/${c1}/memberships"
              payload: { participant_id: "${p3}", voting_rights: true }
              as: StandardsStaff
              captures: { m3: $.data.id }
            - call: "POST /sdo/committees/${c1}/activate"
              payload: {}
              as: StandardsStaff
            - call: "POST /sdo/work-items"
              payload: { title: "Fastener torque spec", scope_text: "Torque limits for structural fasteners", work_item_type: "NEW_STANDARD", proposer_participant_id: "${p1}", target_completion_date: "2027-06-30" }
              as: Proposer
              as_user_id: "${p1}"
              captures: { w1: $.data.id }
            - call: "POST /sdo/work-items/${w1}/approve-scope"
              payload: { decision: "APPROVE", sponsoring_committee_id: "${c1}", designation: "STD-1400" }
              as: StandardsStaff
            - call: "POST /sdo/work-items/${w1}/drafts"
              payload: { total_clause_count: 40, changed_clause_count: 0, summary: "Revision 1" }
              as: CommitteeChair
              as_user_id: "${p1}"
              captures: { d1: $.data.id }
          trigger:
            - call: "POST /sdo/comments"
              payload: { source_type: "COMMITTEE", comment_type: "EDITORIAL", comment_text: "Renumber clause 12 as clause 13", submitter_participant_id: "${p2}", draft_id: "${d1}", clause_reference: "12" }
              as: CommitteeMember
              as_user_id: "${p2}"
              captures: { cm1: $.data.id }
            - call: "POST /sdo/comments"
              payload: { source_type: "COMMITTEE", comment_type: "TECHNICAL", comment_text: "Clause 12 conflicts with the referenced test method", submitter_participant_id: "${p3}", draft_id: "${d1}", clause_reference: "12" }
              as: CommitteeMember
              as_user_id: "${p3}"
              captures: { cm2: $.data.id }
          assert:
            - 'both calls: HTTP status == 201'
            - 'Comment.${cm1}.comment_type == EDITORIAL and Comment.${cm1}.is_substantive == false'
            - 'Comment.${cm2}.comment_type == TECHNICAL and Comment.${cm2}.is_substantive == true'
            - 'Comment.${cm1}.status == OPEN and Comment.${cm2}.status == OPEN'
            - 'Comment.${cm1}.source_type == COMMITTEE'
            - 'Comment.${cm1}.public_review_id == null'
            - 'Comment.${cm1}.source_vote_id == null'
            - 'Comment.${cm1}.disposition_rationale == null'

      - name: work_item_system_fields_are_server_generated_and_a_supplied_progress_status_is_rejected
        claim_type: system_fields
        grounds:
          - entities.WorkItem.fields.progress_status
          - entities.WorkItem.fields.ip_status
          - validations[priority=40]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "A clean POST /sdo/work-items mints id / created_at / version and sets progress_status PROPOSED and ip_status IP_PENDING itself; the same call carrying progress_status in the body is rejected with ERR_INVALID_REQUEST because §1.4 priority 40 refuses system-sourced fields as input."
        test_recipe:
          setup:
            - "One PRODUCER participant registered; logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /sdo/participants"
              payload: { full_name: "Ada Producer", organization: "Acme Steel", interest_category: "PRODUCER", employer_affiliation_code: "ACME" }
              as: StandardsStaff
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /sdo/work-items"
              payload: { title: "Fastener torque spec", scope_text: "Torque limits for structural fasteners", work_item_type: "NEW_STANDARD", proposer_participant_id: "${p1}", target_completion_date: "2027-06-30" }
              as: Proposer
              as_user_id: "${p1}"
              captures: { wclean: $.data.id }
            - call: "POST /sdo/work-items"
              payload: { title: "Second attempt", scope_text: "Torque limits for structural fasteners", work_item_type: "NEW_STANDARD", proposer_participant_id: "${p1}", target_completion_date: "2027-06-30", progress_status: "PUBLISHED" }
              as: Proposer
              as_user_id: "${p1}"
              captures: { err: $.data.error_id }
          assert:
            - 'first call: HTTP status == 201'
            - 'WorkItem.${wclean}.progress_status == PROPOSED'
            - 'WorkItem.${wclean}.ip_status == IP_PENDING'
            - 'WorkItem.${wclean}.consensus_gate == OPEN'
            - 'WorkItem.${wclean}.version == 1'
            - 'WorkItem.${wclean}.created_at == 2026-08-01T00:00:00Z'
            - 'WorkItem.${wclean}.sponsoring_committee_id == null and WorkItem.${wclean}.designation == null'
            - 'WorkItem.${wclean}.errata_count == 0 and WorkItem.${wclean}.interpretation_count == 0'
            - 'second call: HTTP status == 400 and response.data.error_id == ERR_INVALID_REQUEST'
            - 'second call: GET /sdo/work-items returns total_count == 1'

      - name: participant_creation_with_an_undeclared_interest_category_is_rejected
        claim_type: type_constraints
        grounds:
          - entities.Participant.fields.interest_category
          - validations[priority=40]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "interest_category admits only PRODUCER, USER, GENERAL_INTEREST, REGULATORY and ACADEMIC, so DISTRIBUTOR is rejected with ERR_INVALID_REQUEST (400) and no row is stored."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StandardsStaff
          trigger:
            - call: "POST /sdo/participants"
              payload: { full_name: "Fay Distributor", organization: "Bolt Depot", interest_category: "DISTRIBUTOR", employer_affiliation_code: "BOLTD" }
              as: StandardsStaff
              captures: { err: $.data.error_id }
          assert:
            - 'HTTP status == 400'
            - 'response.data.error_id == ERR_INVALID_REQUEST'
            - 'GET /sdo/participants returns total_count == 0'

      - name: draft_creation_with_changed_clause_count_above_total_is_rejected
        claim_type: type_constraints
        grounds:
          - entities.Draft.fields.changed_clause_count
          - entities.Draft.fields.total_clause_count
          - validations[priority=40]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "changed_clause_count is constrained to >= 0 and <= total_clause_count, so 41 changed clauses out of 40 is ERR_INVALID_REQUEST (400) and the work item keeps zero drafts."
        test_recipe:
          setup:
            - "Three participants on distinct employer codes in three distinct interest categories (PRODUCER/ACME, USER/CITYW, GENERAL_INTEREST/SAFEL)."
            - "Committee TC-14 chaired by the PRODUCER with all three appointed as voting members, activated so balance_status is BALANCED."
            - "Work item STD-1400 scope-approved onto TC-14 and therefore IN_DEVELOPMENT with no draft yet."
          setup_api_calls:
            - call: "POST /sdo/participants"
              payload: { full_name: "Ada Producer", organization: "Acme Steel", interest_category: "PRODUCER", employer_affiliation_code: "ACME" }
              as: StandardsStaff
              captures: { p1: $.data.id }
            - call: "POST /sdo/participants"
              payload: { full_name: "Ben User", organization: "City Water", interest_category: "USER", employer_affiliation_code: "CITYW" }
              as: StandardsStaff
              captures: { p2: $.data.id }
            - call: "POST /sdo/participants"
              payload: { full_name: "Cleo General", organization: "Safety League", interest_category: "GENERAL_INTEREST", employer_affiliation_code: "SAFEL" }
              as: StandardsStaff
              captures: { p3: $.data.id }
            - call: "POST /sdo/committees"
              payload: { designation: "TC-14", scope_text: "Structural fasteners", chair_participant_id: "${p1}", max_concurrent_ballots: 2 }
              as: StandardsStaff
              captures: { c1: $.data.id }
            - call: "POST /sdo/committees/${c1}/memberships"
              payload: { participant_id: "${p1}", voting_rights: true }
              as: StandardsStaff
              captures: { m1: $.data.id }
            - call: "POST /sdo/committees/${c1}/memberships"
              payload: { participant_id: "${p2}", voting_rights: true }
              as: StandardsStaff
              captures: { m2: $.data.id }
            - call: "POST /sdo/committees/${c1}/memberships"
              payload: { participant_id: "${p3}", voting_rights: true }
              as: StandardsStaff
              captures: { m3: $.data.id }
            - call: "POST /sdo/committees/${c1}/activate"
              payload: {}
              as: StandardsStaff
            - call: "POST /sdo/work-items"
