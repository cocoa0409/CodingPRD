              as: ListOperator
            - call: "POST /mail/mailing-lists/${list_id}/cass-runs"
              payload: {}
              as: ListOperator
            - call: "POST /mail/mail-jobs"
              payload: { campaign_id: "${camp_id}", template_id: "${tpl_id}", job_kind: "ADDRESSED", mail_class: "MARKETING_MAIL", mailing_list_id: "${list_id}" }
              as: CampaignManager
