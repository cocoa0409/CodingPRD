            - { call: "POST /bakery/store-orders/${ord}/confirm", payload: {}, as: Planner }
            - { call: "POST /bakery/store-orders/${ord}/lock", payload: {}, as: Planner }
            - { call: "POST /bakery/production-plans", payload: { plant_id: "${p}", bake_date: "2026-08-09", expected_plant_version: "${pv}" }, as: Planner, captures: { pl: $.data.id } }
            - { call: "POST /bakery/production-plans/${pl}/lock", payload: {}, as: Planner, captures: { plv: $.data.version } }
            - { call: "POST /bakery/batches", payload: { production_plan_id: "${pl}", line_id: "${ln}", product_id: "${pa}", qty_units: 100, scheduled_start_at: "2026-08-09T07:00:00Z", scheduled_end_at: "2026-08-09T09:00:00Z", expected_production_plan_version: "${plv}" }, as: Planner, captures: { bt: $.data.id } }
            - { call: "POST /bakery/production-plans/${pl}/release", payload: {}, as: Planner }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-09T07:50:00Z" }, as: PlantAdmin }
            - { call: "POST /bakery/batches/${bt}/start-mix", payload: {}, as: LineOperator, as_user_id: "op-1" }
            - { call: "POST /bakery/batches/${bt}/start-proof", payload: {}, as: LineOperator, as_user_id: "op-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-09T09:00:00Z" }, as: PlantAdmin }
            - { call: "POST /bakery/batches/${bt}/start-bake", payload: {}, as: LineOperator, as_user_id: "op-1" }
            - { call: "POST /bakery/batches/${bt}/complete-bake", payload: {}, as: LineOperator, as_user_id: "op-1" }
            - { call: "POST /bakery/batches/${bt}/release", payload: {}, as: QALead, as_user_id: "qa-1" }
