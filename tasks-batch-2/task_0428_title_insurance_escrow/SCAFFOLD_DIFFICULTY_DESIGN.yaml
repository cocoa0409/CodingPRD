  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: wire_invalid_state_beats_insufficient_escrow
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - state_machines.Disbursement.APPROVED_to_WIRED
        distinguishing_aspect: |
          A WIRE on a REQUESTED (not APPROVED) disbursement whose amount also exceeds
          escrow_balance fails both the state check (priority 6, ERR_INVALID_STATE) and
          the fiscal check (priority 10, ERR_INSUFFICIENT_ESCROW); the lower-priority
          number wins -> ERR_INVALID_STATE. Error-category pair: state vs
          business_fiscal.
        test_recipe:
          setup:
            - "An order with a POSTED deposit 100 (balance 100) and a disbursement in REQUESTED state for 500000 (never approved)."
          setup_api_calls:
            - call: "POST /title/agencies"
              payload: { name: "Acme Title", remit_split_pct: 0.82 }
              as: Underwriter
              captures: { ag_id: $.data.id }
