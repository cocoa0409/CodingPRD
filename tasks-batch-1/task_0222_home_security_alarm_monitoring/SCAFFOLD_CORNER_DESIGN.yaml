              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response status == 401"
            - "data.error_id == ERR_UNAUTHENTICATED"

      - name: rbac_owner_check_excluded
        claim_type: peer_roles
        grounds: ["validations[priority=5]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / arm_owner_check_beats_communicator_offline
          rationale: "Subscriber ownership enforcement asserted by the named §1.8 instance."

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_version_change_plan
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[plan-change-stale-account]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Two sequential change-plan calls carrying the same observed version: the second (stale) is rejected ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Activated account on BASIC; PLUS and PRO plans exist; client observes version v."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-01T00:00:00Z" }
              as: Administrator
            - call: "POST /monitoring-plans"
              payload: { tier: "BASIC", monthly_fee_cents: 1500, police_dispatch_included: false, max_sensors: 8, cellular_backup_included: false }
              as: Administrator
              captures: { bp: $.data.id }
            - call: "POST /monitoring-plans"
              payload: { tier: "PLUS", monthly_fee_cents: 3100, police_dispatch_included: true, max_sensors: 16, cellular_backup_included: true }
              as: Administrator
              captures: { pp: $.data.id }
            - call: "POST /monitoring-plans"
              payload: { tier: "PRO", monthly_fee_cents: 6200, police_dispatch_included: true, max_sensors: 32, cellular_backup_included: true }
              as: Administrator
              captures: { rp: $.data.id }
            - call: "POST /accounts"
              payload: { premises_type: "RESIDENTIAL", plan_id: "${bp}", contract_term_months: 12 }
              as: Administrator
              captures: { aid: $.data.id }
            - call: "POST /systems"
              payload: { account_id: "${aid}", primary_path: "BROADBAND", cellular_signal_dbm: -60, backup_battery_pct: 100, last_checkin_minutes_ago: 5 }
              as: Administrator
              captures: { sid: $.data.id }
            - call: "POST /sensors"
              payload: { system_id: "${sid}", zone_number: 1, sensor_type: "DOOR" }
              as: Administrator
            - call: "POST /accounts/${aid}/activate"
              payload: {}
              as: Administrator
              captures: { av: $.data.version }
            - call: "POST /accounts/${aid}/change-plan"
              payload: { new_plan_id: "${pp}", expected_account_version: "${av}" }
              as: Administrator
          trigger:
            - call: "POST /accounts/${aid}/change-plan"
              payload: { new_plan_id: "${rp}", expected_account_version: "${av}" }
              as: Administrator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 412"
            - "data.error_id == ERR_STALE_VERSION"

      - name: version_increments_on_request_cancellation
        claim_type: optimistic_concurrency
        grounds: [entities.Account.fields.version, state_machines.Account.ACTIVE_to_CANCELLATION_REQUESTED]
        distinguishing_aspect: "Account.version increments by exactly 1 on request-cancellation (a write that mutates the account)."
        test_recipe:
          setup: ["Activated account; observe version after activate."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-01T00:00:00Z" }
              as: Administrator
            - call: "POST /monitoring-plans"
              payload: { tier: "BASIC", monthly_fee_cents: 1500, police_dispatch_included: false, max_sensors: 8, cellular_backup_included: false }
              as: Administrator
              captures: { pid: $.data.id }
            - call: "POST /accounts"
              payload: { premises_type: "RESIDENTIAL", plan_id: "${pid}", contract_term_months: 12 }
              as: Administrator
              captures: { aid: $.data.id }
            - call: "POST /systems"
              payload: { account_id: "${aid}", primary_path: "BROADBAND", cellular_signal_dbm: -60, backup_battery_pct: 100, last_checkin_minutes_ago: 5 }
              as: Administrator
              captures: { sid: $.data.id }
            - call: "POST /sensors"
              payload: { system_id: "${sid}", zone_number: 1, sensor_type: "DOOR" }
              as: Administrator
            - call: "POST /accounts/${aid}/activate"
              payload: {}
              as: Administrator
              captures: { av: $.data.version }
          trigger:
            - call: "POST /accounts/${aid}/request-cancellation"
              payload: {}
              as: Administrator
              captures: { v2: $.data.version }
          assert:
            - "Account.${aid}.version after request-cancellation == ${av} + 1"

      - name: occ_finalize_stale_excluded
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[cancel-finalize-stale-account]"]
        excluded_because:
          difficulty_instance: transitive_cascade / finalize_cancellation_account_system_event_dispatch_chain
          rationale: "The finalize-cancellation happy-path (correct version) is exercised by the named §1.8 cascade instance; the stale-version negative of the same endpoint mirrors the change-plan OCC corner above."

      - name: cascade_dispatch_cancel_excluded
        claim_type: cascading_side_effects
        grounds: [state_machines.Account.CANCELLATION_REQUESTED_to_CANCELLED]
        excluded_because:
          difficulty_instance: transitive_cascade / finalize_cancellation_account_system_event_dispatch_chain
          rationale: "The multi-level finalize cascade is asserted end-to-end by the named §1.8 instance."

      - name: rate_threshold_fine_escalation_excluded
        claim_type: rate_threshold_triggers
        grounds: [calculations.false_alarm_fine]
        excluded_because:
          difficulty_instance: transitive_cascade / false_alarm_resolution_count_then_fine_chain
          rationale: "The cumulative false-alarm count crossing into the WARN band is asserted by the named §1.8 instance."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: dispatch_fee_visible_immediately_on_account
        claim_type: immediate
        grounds: [calculations.monitoring_balance, entities.Account.fields.monitoring_balance_cents]
        distinguishing_aspect: "Immediate consistency: a FIRE dispatch's 4000 fee is reflected in Account.monitoring_balance_cents on the very next account read (day0, proration 0 -> balance 4000)."
        test_recipe:
          setup: ["Activated armed account at day0; a FIRE event routed + dispatched."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-01T00:00:00Z" }
              as: Administrator
            - call: "POST /monitoring-plans"
              payload: { tier: "PRO", monthly_fee_cents: 6200, police_dispatch_included: true, max_sensors: 32, cellular_backup_included: true }
              as: Administrator
              captures: { pid: $.data.id }
            - call: "POST /accounts"
              payload: { premises_type: "RESIDENTIAL", plan_id: "${pid}", contract_term_months: 12 }
              as: Administrator
              captures: { aid: $.data.id }
            - call: "POST /systems"
              payload: { account_id: "${aid}", primary_path: "CELLULAR", cellular_signal_dbm: -60, backup_battery_pct: 100, last_checkin_minutes_ago: 5 }
              as: Administrator
              captures: { sid: $.data.id }
            - call: "POST /sensors"
              payload: { system_id: "${sid}", zone_number: 1, sensor_type: "SMOKE" }
              as: Administrator
              captures: { senid: $.data.id }
            - call: "POST /accounts/${aid}/activate"
              payload: {}
              as: Administrator
            - call: "POST /systems/${sid}/arm"
              payload: { mode: "ARMED_AWAY" }
              as: Subscriber
              as_user_id: "${aid}"
            - call: "POST /alarm-events"
              payload: { system_id: "${sid}", sensor_id: "${senid}", signal_type: "FIRE" }
              as: MonitoringOperator
              captures: { ev: $.data.id }
            - call: "POST /alarm-events/${ev}/route"
              payload: {}
              as: MonitoringOperator
            - call: "POST /alarm-events/${ev}/dispatch"
              payload: {}
              as: MonitoringOperator
          trigger:
            - call: "GET /accounts/${aid}"
              payload: {}
              as: Administrator
              captures: { bal: $.data.monitoring_balance_cents }
          assert:
            - "Account.${aid}.monitoring_balance_cents == 4000"
