        excluded_because:
          difficulty_instance: dual_variant_calc / commission_provisional_versus_final_on_the_same_three_booking_lines
          rationale: "The PROVISIONAL and FINAL variants over one identical booking set, including the no-show rate cap, are asserted by the named §1.8 instance."

      - name: the_rebate_tier_is_selected_once_from_the_pre_rebate_payable
        claim_type: constants_applied
        grounds:
          - calculations.statement_net_payable
