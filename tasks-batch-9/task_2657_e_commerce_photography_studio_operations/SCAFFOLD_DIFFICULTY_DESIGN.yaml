  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: color_composite_exactly_at_tolerance_passes_while_one_hundredth_over_fails
        grounds:
          - calculations.color_composite_delta_e
          - entities.ShootSession.fields.color_tolerance_delta_e
          - entities.ShootSession.fields.color_check_state
          - endpoints[POST /studio/shoot-sessions/{session_id}/color-measurement]
        distinguishing_aspect: |
          The tolerance comparison is inclusive at 2-decimal precision. On a STILL_LIFE station
          (0.50/0.50 weighting) patch_deltas [2.5, 1.0, 1.0] land on composite exactly 2.00 and
          must PASS, while [2.52, 1.0, 1.0] give 2.0133... which round_half_up turns into 2.01 and
          must FAIL - a one-hundredth step across an inclusive threshold, with the rounding itself
          deciding the verdict.
        test_recipe:
          setup:
            - "Two STILL_LIFE stations SL-1 and SL-2 (buffer 0, capacity 1440, max_concurrent 1, calibrated to 2026-12-31) so neither session can act as the other's drift baseline."
            - "Styles TOP1001 and TOP1002 on the shared APPAREL_TOP profile, each with a MATCHED sample IN_STUDIO and one required STILL_ANGLE/FRONT item."
            - "Session A on SL-1 and session B on SL-2 both run 2026-08-03 09:00-13:00 with the default color_tolerance_delta_e 2.00; photographers Pia Ren (A) and Tao Vek (B) are CONFIRMED and both sessions are SHOOTING at clock 09:00."
