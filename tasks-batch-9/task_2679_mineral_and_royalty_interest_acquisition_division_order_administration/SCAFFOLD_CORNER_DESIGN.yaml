      - "the close-curative returns HTTP 200 with curative_status == CURATIVE_CLOSED, defect_adjustment_amount == 0.00 and adjusted_purchase_price == 48000.00, because the only defect was WAIVED and never entered the UNCURED input set"
      - "the post-close defect creation returns HTTP 409 with data.error_id == ERR_CURATIVE_PERIOD_CLOSED"
      - "the second offer letter returns HTTP 409 with data.error_id == ERR_INTEREST_STATE_INVALID - the interest is UNDER_PSA, not PROSPECT"
      - "the second accept returns HTTP 409 with data.error_id == ERR_OFFER_STATE_INVALID - ACCEPTED is terminal for that letter"

