              captures: { proj_status: $.data.status, proj_hold: $.data.safety_hold }
          assert:
            - "${v_wh_pre} == PASS, ${v_range_pre} == MARGINAL (500 ppm is at or above CO_WARN_PPM[RANGE] 400 but at or below CO_MAX_PPM[RANGE] 800) and ${v_wh_post} == PASS"
            - "Unfiltered: total_count == 3 and ${all_first_label} is one of WH-1 / RANGE-1"
            - "?phase=PRE returns total_count == 2; ?verdict=MARGINAL returns total_count == 1 with ${marg_label} == 'RANGE-1' and ${marg_type} == RANGE"
            - "?phase=PRE&verdict=PASS returns total_count == 1 with ${pre_pass_label} == 'WH-1' — the MARGINAL PRE row is excluded by the second filter"
