              as: LineScheduler
            - call: "GET /ecoat/paint-lines/${line1}"
              as: LineScheduler
              captures: { lv2: $.data.version }
          trigger:
            - call: "POST /ecoat/run-slots"
              payload: { paint_line_id: "${line1}", lot_id: "${lot_b}", start_utc: "2026-05-05T09:00:00Z", end_utc: "2026-05-05T11:00:00Z", parts_per_hanger: 20, expected_paint_line_version: "${lv2}" }
