scenario: |
  Outpatient Clinic Registration & Patient Access (hospital patient access
  department): pre-registration & insurance discovery/eligibility verification,
  authorization requirement check by procedure, copay/deposit estimate &
  point-of-service collection, arrival check-in & wait-time queue,
  demographic/consent capture & duplicate MRN prevention,
  interpreter/accommodation flags, no-show/late arrival policy & template
  protection, referral/order matching to visit.

domain_name: outpatient-clinic-registration
api_prefix: /patient-access

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
    - selector_policy
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Patient
    parent: null
    common_fields: true
    fields:
      - name: mrn
        type: string
        source: system
        description: Medical Record Number, system-minted as "MRN" + zero-padded 8-digit sequence; unique per patient
        constraints: "unique; immutable once assigned"
      - name: first_name
        type: string
        source: input
        description: Patient legal first name
      - name: last_name
        type: string
        source: input
        description: Patient legal last name
      - name: date_of_birth
        type: string
        source: input
        description: ISO 8601 date (YYYY-MM-DD)
      - name: sex_at_birth
        type: enum
        source: input
        description: Sex assigned at birth
        constraints: "one of {M, F, X}"
      - name: primary_phone
        type: string
        source: input
        description: E.164-formatted phone number
      - name: email
        type: string
        source: input
        description: Patient email address
        constraints: "optional"
      - name: language_code
        type: string
        source: input
        description: ISO 639-1 preferred language code; drives interpreter flag default
        default: "en"
      - name: duplicate_of_patient_id
        type: string
        source: system
        description: "FK -> Patient.id; set when this patient record is resolved as a duplicate of another; null on the surviving record"
        constraints: "nullable; self-referential"
      - name: status
        type: enum
        source: system
        description: Registration lifecycle state
        default: PRE_REGISTERED
        constraints: "one of {PRE_REGISTERED, REGISTERED, MERGED, INACTIVE}"

  - name: InsurancePolicy
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the policyholder patient"
      - name: payer_id
        type: string
        source: input
        description: External payer identifier (e.g., clearinghouse payer id)
      - name: member_id
        type: string
        source: input
        description: Subscriber/member id on the plan card
      - name: group_number
        type: string
        source: input
        description: Employer group number
        constraints: "optional"
      - name: plan_type
        type: enum
        source: input
        description: Plan network type, gates referral requirement
        constraints: "one of {HMO, PPO, EPO, POS, MEDICARE, MEDICAID, SELF_PAY}"
      - name: effective_start
        type: string
        source: input
        description: ISO date coverage begins (inclusive)
      - name: effective_end
        type: string
        source: input
        description: ISO date coverage ends (inclusive); null means open-ended
        constraints: "nullable; must be >= effective_start when present"
      - name: priority_rank
        type: integer
        source: input
        description: Coordination-of-benefits order; 1 = primary, 2 = secondary
        constraints: ">= 1; unique per patient among policies with status != VOIDED"
      - name: deductible_remaining_cents
        type: integer
        source: input
        description: Remaining individual deductible at verification time, in cents
        constraints: ">= 0"
      - name: oop_max_remaining_cents
        type: integer
        source: input
        description: Remaining out-of-pocket maximum at verification time, in cents
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: Policy lifecycle
        default: ACTIVE
        constraints: "one of {ACTIVE, TERMINATED, VOIDED}"

  - name: EligibilityCheck
    parent: null
    common_fields: true
    fields:
      - name: policy_id
        type: string
        source: input
        description: "FK -> InsurancePolicy.id; the policy being verified"
      - name: appointment_id
        type: string
        source: input
        description: "FK -> Appointment.id; the visit this verification supports"
      - name: checked_at
        type: datetime
        source: system
        description: Server timestamp of the eligibility transaction
      - name: coverage_status
        type: enum
        source: input
        description: Payer-reported coverage outcome
        constraints: "one of {ACTIVE, INACTIVE, NOT_FOUND, UNKNOWN}"
      - name: copay_cents
        type: integer
        source: input
        description: Payer-reported specialist/PCP copay for the scheduled service
        constraints: ">= 0"
      - name: coinsurance_pct
        type: integer
        source: input
        description: Patient coinsurance percentage after deductible, 0-100
        constraints: "0 <= value <= 100"
      - name: auth_required
        type: boolean
        source: input
        description: Whether payer flags the scheduled procedure as needing prior authorization
      - name: result
        type: enum
        source: system
        description: Derived verification result per eligibility_result calculation
        constraints: "one of {VERIFIED, VERIFIED_WITH_AUTH, FAILED, STALE}"

  - name: Referral
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; referred patient"
      - name: referring_provider_npi
        type: string
        source: input
        description: NPI of the ordering/referring provider
      - name: specialty_code
        type: string
        source: input
        description: Target specialty code (e.g., CARD for cardiology)
      - name: procedure_code
        type: string
        source: input
        description: CPT/HCPCS code the referral authorizes
      - name: visits_authorized
        type: integer
        source: input
        description: Number of visits the referral covers
        constraints: ">= 1"
      - name: visits_consumed
        type: integer
        source: system
        description: Count of arrived visits matched against this referral
        default: 0
        constraints: ">= 0; incremented on check-in; decremented on un-check-in"
      - name: valid_from
        type: string
        source: input
        description: ISO date referral becomes usable (inclusive)
      - name: valid_until
        type: string
        source: input
        description: ISO date referral expires (inclusive)
      - name: status
        type: enum
        source: system
        description: Referral lifecycle
        default: OPEN
        constraints: "one of {OPEN, EXHAUSTED, EXPIRED, CLOSED}"

  - name: Authorization
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id"
      - name: appointment_id
        type: string
        source: input
        description: "FK -> Appointment.id; visit this authorization covers"
      - name: payer_auth_number
        type: string
        source: input
        description: Authorization number issued by payer
      - name: authorized_units
        type: integer
        source: input
        description: Units/visits authorized
        constraints: ">= 1"
      - name: valid_until
        type: string
        source: input
        description: ISO date authorization expires (inclusive)
      - name: status
        type: enum
        source: system
        description: Authorization lifecycle
        default: APPROVED
        constraints: "one of {APPROVED, CONSUMED, EXPIRED, VOIDED}"

  - name: Appointment
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; scheduled patient"
      - name: referring_provider_npi
        type: string
        source: input
        description: NPI on the order; used for referral matching
        constraints: "optional"
      - name: department_code
        type: string
        source: input
        description: Clinic department / specialty code (matches Referral.specialty_code)
      - name: procedure_code
        type: string
        source: input
        description: Scheduled CPT/HCPCS code
      - name: scheduled_start
        type: datetime
        source: input
        description: Appointment start instant (UTC)
      - name: duration_minutes
        type: integer
        source: input
        description: Slot length in minutes
        constraints: ">= 5"
      - name: visit_type
        type: enum
        source: input
        description: Visit category driving copay schedule and auth rules
        constraints: "one of {NEW, ESTABLISHED, PROCEDURE, IMAGING}"
      - name: provider_code
        type: string
        source: input
        description: Rendering provider / resource code; double-booking is forbidden per provider slot
      - name: status
        type: enum
        source: system
        description: Appointment lifecycle state
        default: SCHEDULED
        constraints: "one of {SCHEDULED, PRE_CHECKED, READY, ARRIVED, IN_ROOM, COMPLETED, CANCELLED, NO_SHOW}"
      - name: registration_gate
        type: enum
        source: system
        description: Derived clearance snapshot recomputed by clearance_status calculation; gates check-in
        default: BLOCKED
        constraints: "one of {CLEAR, CLEAR_WITH_PAYMENT, BLOCKED}"
      - name: estimated_patient_responsibility_cents
        type: integer
        source: computed
        description: Cached result of copay_estimate calculation; 2-decimal-dollar precision stored as integer cents
        default: 0
      - name: amount_collected_cents
        type: integer
        source: computed
        description: Sum of posted, non-refunded Payment.amount_cents for this appointment
        default: 0
      - name: auth_satisfied
        type: boolean
        source: computed
        description: Derived by clearance_status; true when the visit's auth requirement is met
        default: false
      - name: referral_id
        type: string
        source: system
        description: "FK -> Referral.id; referral matched to this visit by referral_matching; nullable"
        constraints: "nullable"
      - name: late_minutes
        type: integer
        source: computed
        description: Minutes between scheduled_start and actual check-in; negative when early
        default: 0
      - name: no_show_risk_strikes
        type: integer
        source: computed
        description: Trailing 12-month count of NO_SHOW appointments for this patient, per no_show_strike calculation
        default: 0

  - name: CopayEstimate
    parent: null
    common_fields: true
    fields:
      - name: appointment_id
        type: string
        source: input
        description: "FK -> Appointment.id; estimate subject"
      - name: policy_id
        type: string
        source: input
        description: "FK -> InsurancePolicy.id; primary policy used"
      - name: method
        type: enum
        source: system
        description: Estimation variant actually applied
        constraints: "one of {PAYER_VERIFIED, FEE_SCHEDULE}"
      - name: allowed_amount_cents
        type: integer
        source: input
        description: Contracted allowed amount for the procedure
        constraints: ">= 0"
      - name: estimated_patient_responsibility_cents
        type: integer
        source: system
        description: Result of copay_estimate calculation, integer cents
        constraints: ">= 0"
      - name: deposit_required_cents
        type: integer
        source: system
        description: Point-of-service collection target per deposit_rule calculation
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: Estimate lifecycle
        default: PROVISIONAL
        constraints: "one of {PROVISIONAL, FINAL, SUPERSEDED}"

  - name: Payment
    parent: null
    common_fields: true
    fields:
      - name: appointment_id
        type: string
        source: input
        description: "FK -> Appointment.id; visit the payment applies to"
      - name: amount_cents
        type: integer
        source: input
        description: Tendered amount in cents; negative values forbidden
        constraints: "> 0"
      - name: method
        type: enum
        source: input
        description: Tender type
        constraints: "one of {CASH, CARD, CHECK, WALLET}"
      - name: kind
        type: enum
        source: input
        description: POST = collection; REFUND = compensation reversing a prior collection
        constraints: "one of {POST, REFUND}"
      - name: status
        type: enum
        source: system
        description: Payment lifecycle
        default: POSTED
        constraints: "one of {POSTED, VOIDED}"

  - name: QueueTicket
    parent: null
    common_fields: true
    fields:
      - name: appointment_id
        type: string
        source: input
        description: "FK -> Appointment.id; one active ticket per appointment"
      - name: department_code
        type: string
        source: system
        description: Copied from Appointment.department_code at issuance; queue is per department per day
      - name: queue_date
        type: string
        source: system
        description: ISO date (clinic-local) of the queue; derived from scheduled_start
      - name: sequence_number
        type: integer
        source: system
        description: 1-based arrival sequence within (department_code, queue_date), assigned by queue_sequence calculation
        constraints: ">= 1"
      - name: priority
        type: enum
        source: system
        description: Derived service priority per queue_priority calculation
        constraints: "one of {STAT, ACCOMMODATION, STANDARD}"
      - name: state
        type: enum
        source: system
        description: Queue lifecycle
        default: WAITING
        constraints: "one of {WAITING, CALLED, SERVED, SKIPPED, REMOVED}"
      - name: called_at
        type: datetime
        source: system
        description: Server timestamp when CALLED; null while WAITING
        constraints: "nullable"

  - name: AccommodationFlag
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id"
      - name: flag_type
        type: enum
        source: input
        description: Accommodation category
        constraints: "one of {INTERPRETER, MOBILITY, SENSORY, COGNITIVE}"
      - name: language_code
        type: string
        source: input
        description: Required when flag_type == INTERPRETER; ISO 639-1
        constraints: "nullable unless flag_type == INTERPRETER"
      - name: note
        type: string
        source: input
        description: Free-text instruction for care team
        constraints: "optional"
      - name: active
        type: boolean
        source: system
        description: Soft-delete style flag; false flags are excluded from queue_priority
        default: true

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Patient
    initial_state: PRE_REGISTERED
    terminal_states: [MERGED, INACTIVE]
    transitions:
      - from: PRE_REGISTERED
        to: REGISTERED
        trigger: "POST /patient-access/patients/{id}/complete-registration"
        actor: Registrar
        preconditions:
          - "patient.status == PRE_REGISTERED"
          - "demographic completeness: first_name, last_name, date_of_birth, sex_at_birth, primary_phone all non-empty"
          - "consent captured: request payload carries consent_general == true"
        side_effects:
          - "sets patient.status = REGISTERED; increments patient.version"
          - "every Appointment of this patient in {SCHEDULED} has clearance_status recomputed"
      - from: PRE_REGISTERED
        to: MERGED
        trigger: "POST /patient-access/patients/{id}/merge"
        actor: Registrar
        preconditions:
          - "patient.status in {PRE_REGISTERED, REGISTERED}"
          - "survivor_patient_id references a different Patient with status != MERGED"
        side_effects:
          - "sets duplicate_of_patient_id = survivor id; status = MERGED"
          - "every Appointment of the merged patient in {SCHEDULED, PRE_CHECKED, READY} is re-pointed to the survivor (appointment.patient_id = survivor id) and clearance_status recomputed"
          - "every InsurancePolicy of the merged patient is re-pointed to the survivor"
      - from: REGISTERED
        to: MERGED
        trigger: "POST /patient-access/patients/{id}/merge"
        actor: Registrar
        preconditions:
          - "survivor_patient_id references a different Patient with status != MERGED"
        side_effects:
          - "same cascade as PRE_REGISTERED -> MERGED"
      - from: REGISTERED
        to: INACTIVE
        trigger: "POST /patient-access/patients/{id}/deactivate"
        actor: AccessSupervisor
        preconditions:
          - "patient.status == REGISTERED"
          - "patient has no Appointment in {SCHEDULED, PRE_CHECKED, READY, ARRIVED, IN_ROOM}"
        side_effects:
          - "sets patient.status = INACTIVE"

  - entity: InsurancePolicy
    initial_state: ACTIVE
    terminal_states: [TERMINATED, VOIDED]
    transitions:
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /patient-access/insurance-policies/{id}/terminate"
        actor: Registrar
        preconditions:
          - "policy.status == ACTIVE"
          - "payload effective_end >= policy.effective_start"
        side_effects:
          - "sets policy.effective_end = payload value; status = TERMINATED"
          - "every Appointment of the policy's patient in {SCHEDULED, PRE_CHECKED} using this policy's CopayEstimate in PROVISIONAL status has that estimate transitioned to SUPERSEDED and clearance_status recomputed"
      - from: ACTIVE
        to: VOIDED
        trigger: "POST /patient-access/insurance-policies/{id}/void"
        actor: AccessSupervisor
        preconditions:
          - "policy.status == ACTIVE"
          - "no EligibilityCheck with coverage_status == ACTIVE exists for this policy"
        side_effects:
          - "status = VOIDED; the policy's priority_rank slot is released for reuse"

  - entity: Referral
    initial_state: OPEN
    terminal_states: [EXHAUSTED, EXPIRED, CLOSED]
    transitions:
      - from: OPEN
        to: EXHAUSTED
        trigger: "system: visits_consumed reaches visits_authorized on QueueTicket issuance (POST /patient-access/appointments/{id}/check-in)"
        actor: system
        preconditions:
          - "referral.visits_consumed == referral.visits_authorized after the increment"
        side_effects:
          - "status = EXHAUSTED; future referral_matching sweeps skip it"
      - from: OPEN
        to: EXPIRED
        trigger: "system: POST /patient-access/_clock/set_current_utc advancing current date past valid_until"
        actor: system
        preconditions:
          - "current logical date > referral.valid_until"
        side_effects:
          - "status = EXPIRED"
          - "every Appointment with referral_id == this referral and status in {SCHEDULED, PRE_CHECKED} has referral_id cleared and clearance_status recomputed"
      - from: OPEN
        to: CLOSED
        trigger: "POST /patient-access/referrals/{id}/close"
        actor: Registrar
        preconditions:
          - "referral.status == OPEN"
        side_effects:
          - "status = CLOSED"
          - "Appointments referencing it in {SCHEDULED, PRE_CHECKED} keep the match (historical) but referral_matching will not re-match if the match is cleared"

  - entity: Authorization
    initial_state: APPROVED
    terminal_states: [CONSUMED, EXPIRED, VOIDED]
    transitions:
      - from: APPROVED
        to: CONSUMED
        trigger: "system: appointment check-in (POST /patient-access/appointments/{id}/check-in) when appointment.auth_satisfied was derived from this authorization"
        actor: system
        preconditions:
          - "authorization.status == APPROVED"
          - "authorization.appointment_id == the checking-in appointment"
        side_effects:
          - "status = CONSUMED"
      - from: APPROVED
        to: EXPIRED
        trigger: "system: POST /patient-access/_clock/set_current_utc advancing current date past valid_until"
        actor: system
        preconditions:
          - "current logical date > authorization.valid_until"
        side_effects:
          - "status = EXPIRED; owning appointment's clearance_status recomputed (auth_satisfied may flip false)"
      - from: APPROVED
        to: VOIDED
        trigger: "POST /patient-access/authorizations/{id}/void"
        actor: AccessSupervisor
        preconditions:
          - "authorization.status == APPROVED"
        side_effects:
          - "status = VOIDED; owning appointment's clearance_status recomputed"

  - entity: Appointment
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: SCHEDULED
        to: PRE_CHECKED
        trigger: "POST /patient-access/appointments/{id}/pre-check"
        actor: Registrar
        preconditions:
          - "appointment.status == SCHEDULED"
          - "patient.status == REGISTERED"
          - "an EligibilityCheck exists for this appointment with result in {VERIFIED, VERIFIED_WITH_AUTH} and checked_at within ELIGIBILITY_STALENESS_DAYS of current date"
        side_effects:
          - "status = PRE_CHECKED"
          - "clearance_status recomputed"
      - from: PRE_CHECKED
        to: SCHEDULED
        trigger: "POST /patient-access/appointments/{id}/revert-precheck"
        actor: Registrar
        preconditions:
          - "appointment.status == PRE_CHECKED"
        side_effects:
          - "status = SCHEDULED; clearance_status recomputed"
      - from: PRE_CHECKED
        to: READY
        trigger: "POST /patient-access/appointments/{id}/mark-ready"
        actor: FinancialCounselor
        preconditions:
          - "appointment.status == PRE_CHECKED"
          - "appointment.registration_gate == CLEAR  OR  (registration_gate == CLEAR_WITH_PAYMENT AND amount_collected_cents >= deposit_required_cents of the latest non-SUPERSEDED CopayEstimate)"
        side_effects:
          - "status = READY"
      - from: READY
        to: ARRIVED
        trigger: "POST /patient-access/appointments/{id}/check-in"
        actor: FrontDeskAgent
        preconditions:
          - "appointment.status == READY"
          - "late arrival rule: minutes_between(scheduled_start, now) <= LATE_ARRIVAL_CUTOFF_MINUTES (>= comparison boundary at exactly the cutoff)"
        side_effects:
          - "status = ARRIVED; late_minutes computed"
          - "a QueueTicket is issued (queue_sequence, queue_priority calculations)"
          - "matched Referral.visits_consumed += 1 (may trigger Referral OPEN->EXHAUSTED)"
          - "covering Authorization (if any) transitions APPROVED->CONSUMED"
      - from: ARRIVED
        to: IN_ROOM
        trigger: "POST /patient-access/queue-tickets/{id}/call-next  (system promotes the specific appointment whose ticket is called)"
        actor: FrontDeskAgent
        preconditions:
          - "appointment.status == ARRIVED"
          - "its QueueTicket transitions WAITING -> CALLED"
        side_effects:
          - "status = IN_ROOM"
      - from: IN_ROOM
        to: COMPLETED
        trigger: "POST /patient-access/appointments/{id}/complete"
        actor: FrontDeskAgent
        preconditions:
          - "appointment.status == IN_ROOM"
        side_effects:
          - "status = COMPLETED"
          - "its QueueTicket transitions to SERVED"
          - "latest CopayEstimate in PROVISIONAL transitions to FINAL"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /patient-access/appointments/{id}/cancel"
        actor: Registrar
        preconditions:
          - "appointment.status in {SCHEDULED, PRE_CHECKED, READY}"
        side_effects:
          - "status = CANCELLED"
          - "Payments in POSTED for this appointment remain (refund is a separate explicit action)"
      - from: PRE_CHECKED
        to: CANCELLED
        trigger: "POST /patient-access/appointments/{id}/cancel"
        actor: Registrar
        preconditions:
          - "appointment.status in {SCHEDULED, PRE_CHECKED, READY}"
        side_effects:
          - "status = CANCELLED"
      - from: READY
        to: CANCELLED
        trigger: "POST /patient-access/appointments/{id}/cancel"
        actor: Registrar
        preconditions:
          - "appointment.status in {SCHEDULED, PRE_CHECKED, READY}"
        side_effects:
          - "status = CANCELLED"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "system: POST /patient-access/departments/{department_code}/close-day (ops-run sweep) or POST /patient-access/appointments/{id}/mark-no-show after scheduled_start + NO_SHOW_GRACE_MINUTES"
        actor: system
        preconditions:
          - "appointment.status in {SCHEDULED, PRE_CHECKED, READY}"
          - "current time >= scheduled_start + NO_SHOW_GRACE_MINUTES"
        side_effects:
          - "status = NO_SHOW"
          - "patient's trailing no_show_risk_strike count on future appointments recomputed"
      - from: PRE_CHECKED
        to: NO_SHOW
        trigger: "system: same sweep as SCHEDULED -> NO_SHOW"
        actor: system
        preconditions:
          - "current time >= scheduled_start + NO_SHOW_GRACE_MINUTES"
        side_effects:
          - "status = NO_SHOW"
      - from: READY
        to: NO_SHOW
        trigger: "system: same sweep as SCHEDULED -> NO_SHOW"
        actor: system
        preconditions:
          - "current time >= scheduled_start + NO_SHOW_GRACE_MINUTES"
        side_effects:
          - "status = NO_SHOW"

  - entity: CopayEstimate
    initial_state: PROVISIONAL
    terminal_states: [FINAL, SUPERSEDED]
    transitions:
      - from: PROVISIONAL
        to: FINAL
        trigger: "system: owning Appointment IN_ROOM -> COMPLETED"
        actor: system
        preconditions:
          - "estimate.status == PROVISIONAL"
        side_effects:
          - "status = FINAL; appointment.estimated_patient_responsibility_cents re-pinned to the FINAL estimate's value (no numeric change)"
      - from: PROVISIONAL
        to: SUPERSEDED
        trigger: "POST /patient-access/appointments/{id}/copay-estimates (a newer estimate for the same appointment) or policy termination cascade"
        actor: system
        preconditions:
          - "estimate.status == PROVISIONAL"
          - "a newer CopayEstimate for the same appointment_id is being created, or the backing InsurancePolicy was terminated"
        side_effects:
          - "status = SUPERSEDED; appointment.estimated_patient_responsibility_cents re-derived from the newest PROVISIONAL estimate (0 when none)"

  - entity: Payment
    initial_state: POSTED
    terminal_states: [VOIDED]
    transitions:
      - from: POSTED
        to: VOIDED
        trigger: "POST /patient-access/payments/{id}/void"
        actor: AccessSupervisor
        preconditions:
          - "payment.status == POSTED"
        side_effects:
          - "status = VOIDED; appointment.amount_collected_cents recomputed (collected_amount calculation)"

  - entity: QueueTicket
    initial_state: WAITING
    terminal_states: [SERVED, SKIPPED, REMOVED]
    transitions:
      - from: WAITING
        to: CALLED
        trigger: "POST /patient-access/queue-tickets/call-next"
        actor: FrontDeskAgent
        preconditions:
          - "ticket.state == WAITING"
          - "ticket selected by call_next selector: among WAITING tickets of (department_code, queue_date), order by priority rank (STAT=0 < ACCOMMODATION=1 < STANDARD=2), then sequence_number ASC; the first is selected"
        side_effects:
          - "state = CALLED; called_at = now"
          - "owning Appointment ARRIVED -> IN_ROOM"
      - from: CALLED
        to: SERVED
        trigger: "system: owning Appointment IN_ROOM -> COMPLETED"
        actor: system
        preconditions:
          - "ticket.state == CALLED"
        side_effects:
          - "state = SERVED"
      - from: CALLED
        to: SKIPPED
        trigger: "POST /patient-access/queue-tickets/{id}/skip"
        actor: FrontDeskAgent
        preconditions:
          - "ticket.state == CALLED"
        side_effects:
          - "state = SKIPPED"
          - "owning Appointment remains IN_ROOM but is flagged for re-rooming (appointment returns to ARRIVED)"
      - from: WAITING
        to: REMOVED
        trigger: "system: owning Appointment leaves ARRIVED via cancel/no-show"
        actor: system
        preconditions:
          - "ticket.state == WAITING"
        side_effects:
          - "state = REMOVED"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: appointment-update-stale-version
    parent_entity: Appointment
    write_endpoint: "PATCH /patient-access/appointments/{id}"
    occ_field: "expected_appointment_version"
    description: |
      Rescheduling or editing an Appointment whose version has advanced since
      the client last read it is rejected. Captures the case where a registrar
      re-scheduled a visit whose clearance was silently recomputed by a
      cascade (policy termination, referral match) after the client's read.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: patient-merge-stale-version
    parent_entity: Patient
    write_endpoint: "POST /patient-access/patients/{id}/merge"
    occ_field: "expected_patient_version"
    description: |
      Merging a Patient whose version has advanced since the registrar's last
      read is rejected — the merge re-points appointments and policies, so the
      caller must merge on the basis of current state, not a stale snapshot.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: copay_estimate
    trigger: "POST /patient-access/appointments/{id}/copay-estimates"
    algorithm: constraint_propagation
    formula: |
      # Variant selection first:
      #   PAYER_VERIFIED  when a non-STALE EligibilityCheck exists for
      #                   (appointment, policy) with coverage_status == ACTIVE
      #   FEE_SCHEDULE    otherwise
      #
      # PAYER_VERIFIED (uses payer-reported fields on the EligibilityCheck):
      #   resp = copay_cents
      #   if copay_cents == 0:
      #     # deductible/coinsurance path
      #     ded = min(allowed_amount_cents, policy.deductible_remaining_cents)
      #     resp = ded + round_half_up((allowed_amount_cents - ded) * coinsurance_pct / 100)
      #   resp = min(resp, policy.oop_max_remaining_cents)
      #
      # FEE_SCHEDULE (no payer data; flat schedule by visit_type):
      #   base = FEE_SCHEDULE[appointment.visit_type]           # constant table
      #   multiplier = 1.0 if ESTABLISHED else NEW_PATIENT_LOADING  # 1.2
      #   resp = round_half_up(base * multiplier)
      #
      # Both variants then pin deposit_required_cents via deposit_rule.
    input_set: "the Appointment, the chosen InsurancePolicy (status == ACTIVE), and the latest EligibilityCheck for (appointment, policy) with result != STALE"
    constants:
      NEW_PATIENT_LOADING: 1.2
      FEE_SCHEDULE_NEW_CENTS: 22000
      FEE_SCHEDULE_ESTABLISHED_CENTS: 14000
      FEE_SCHEDULE_PROCEDURE_CENTS: 45000
      FEE_SCHEDULE_IMAGING_CENTS: 38000
    precision: "integer cents; round_half_up applied exactly once at the final step of each variant"
    variants:
      - name: PAYER_VERIFIED
        when: "a fresh EligibilityCheck with coverage_status == ACTIVE exists"
        difference: "uses payer copay/coinsurance/deductible fields; deductible-then-coinsurance order matters"
      - name: FEE_SCHEDULE
        when: "no usable EligibilityCheck"
        difference: "flat fee by visit_type with NEW-visit 1.2x loading; ignores payer fields entirely"

  - name: deposit_rule
    trigger: "immediately after copay_estimate"
    algorithm: threshold
    formula: |
      # Point-of-service collection target, tiered by patient no-show risk:
      #   strikes = no_show_strike(appointment.patient_id)
      #   if strikes >= HIGH_RISK_STRIKE_THRESHOLD:   pct = HIGH_RISK_DEPOSIT_PCT   # 1.00
      #   elif appointment.visit_type == 'NEW':       pct = NEW_VISIT_DEPOSIT_PCT   # 0.50
      #   else:                                       pct = STANDARD_DEPOSIT_PCT    # 0.25
      # deposit_required_cents = round_half_up(estimated_patient_responsibility_cents * pct)
    input_set: "appointment.estimated_patient_responsibility_cents, appointment.visit_type, patient's trailing no-show strike count"
    constants:
      HIGH_RISK_STRIKE_THRESHOLD: 2
      HIGH_RISK_DEPOSIT_PCT: 1.00
      NEW_VISIT_DEPOSIT_PCT: 0.50
      STANDARD_DEPOSIT_PCT: 0.25
    precision: "integer cents, round_half_up; boundary at strikes == 2 uses >= (strikes == 2 triggers the high-risk tier)"
    variants:
      - name: risk_adjusted
        when: "strikes >= 2"
        difference: "100% of estimate due at point of service"
      - name: standard
        when: "strikes < 2"
        difference: "25% established / 50% new-visit tiering"

  - name: eligibility_result
    trigger: "POST /patient-access/eligibility-checks"
    algorithm: threshold
    formula: |
      # Derives EligibilityCheck.result from inputs + freshness:
      #   if coverage_status != 'ACTIVE':                      result = FAILED
      #   elif auth_required == true:                          result = VERIFIED_WITH_AUTH
      #   else:                                                result = VERIFIED
      # Separately, a stored check flips to STALE when read after
      # ELIGIBILITY_STALENESS_DAYS days (lazy recompute on read and during
      # clearance_status sweeps):
      #   if current_date > date(checked_at) + ELIGIBILITY_STALENESS_DAYS: result = STALE
    input_set: "the EligibilityCheck row and the current logical date"
    constants:
      ELIGIBILITY_STALENESS_DAYS: 30
    precision: "date granularity; staleness boundary is strict > (a check exactly 30 days old is still fresh)"
    variants: []

  - name: clearance_status
    trigger: "patient registration completion, eligibility posting, authorization create/void/expire, referral match/unmatch/expire, estimate create/supersede, payment post/void, policy terminate, merge cascade"
    algorithm: constraint_propagation
    formula: |
      # Evaluation order is pinned (circular-looking otherwise):
      #   1. auth_needed = (visit_type in {PROCEDURE, IMAGING})
      #                    OR latest non-STALE EligibilityCheck.auth_required == true
      #   2. auth_satisfied = (NOT auth_needed)
      #                    OR exists Authorization for this appointment with
      #                       status == APPROVED and valid_until >= appointment date
      #   3. referral_needed = (primary policy.plan_type in {HMO, EPO})
      #   4. referral_satisfied = (NOT referral_needed) OR appointment.referral_id != null
      #   5. demog_ok = patient.status == REGISTERED
      #   6. estimate = latest non-SUPERSEDED CopayEstimate
      #   7. gate:
      #        if NOT (demog_ok AND auth_satisfied AND referral_satisfied): BLOCKED
      #        elif estimate exists AND estimate.deposit_required_cents > 0
      #             AND amount_collected_cents < estimate.deposit_required_cents:
      #             CLEAR_WITH_PAYMENT
      #        else: CLEAR
      # The derived registration_gate and auth_satisfied fields are persisted
      # on Appointment after every triggering event.
    input_set: "Appointment, its Patient, latest EligibilityCheck, Authorizations, Referral match, latest CopayEstimate, Payments"
    constants: {}
    precision: "boolean/enum derivation; no numeric rounding"
    variants: []

  - name: collected_amount
    trigger: "Payment POST (kind == POST or REFUND) and Payment POSTED -> VOIDED"
    algorithm: aggregation
    formula: |
      # amount_collected_cents =
      #   sum(p.amount_cents for p in payments of appointment
      #       where p.status == POSTED and p.kind == POST)
      # - sum(p.amount_cents for p in payments of appointment
      #       where p.status == POSTED and p.kind == REFUND)
      # Clamped below at 0. Recomputed in full (not incrementally) on each trigger.
    input_set: "all Payments of the Appointment with status == POSTED"
    constants: {}
    precision: "integer cents"
    variants: []

  - name: no_show_strike
    trigger: "Appointment -> NO_SHOW, and lazily inside deposit_rule / appointment creation"
    algorithm: aggregation
    formula: |
      # strikes(patient, as_of) =
      #   count(Appointments a where a.patient_id == patient
      #         and a.status == NO_SHOW
      #         and a.scheduled_start >= as_of - STRIKE_WINDOW_DAYS
      #         and a.scheduled_start <  as_of)
      # Window is [as_of - 365 days, as_of): trailing, half-open, lower bound inclusive.
    input_set: "NO_SHOW Appointments of the patient in the trailing 365-day half-open window"
    constants:
      STRIKE_WINDOW_DAYS: 365
    precision: "integer count; window boundary: scheduled_start exactly 365 days before as_of IS included; exactly at as_of is NOT"
    variants: []

  - name: referral_matching
    trigger: "Appointment creation, Patient merge, Referral creation, Referral expiry cascade"
    algorithm: weighted_scoring
    formula: |
      # Candidate set: Referrals r where
      #   r.patient_id == appointment.patient_id
      #   r.status == OPEN
      #   r.specialty_code == appointment.department_code
      #   r.procedure_code == appointment.procedure_code
      #   r.valid_from <= date(appointment.scheduled_start) <= r.valid_until
      #   r.visits_consumed < r.visits_authorized
      # Ranking (lexicographic):
      #   1. referring_npi_match: r.referring_provider_npi == appointment.referring_provider_npi  (true beats false)
      #   2. r.valid_until ASC (earliest-expiring first)
      #   3. r.created_at ASC (oldest first; never id)
      # Empty candidate set: referral_id stays null (no error; gate may go BLOCKED).
    input_set: "OPEN Referrals of the patient matching specialty/procedure/date window"
    constants: {}
    precision: "deterministic selector; tie-break pinned above"
    variants: []

  - name: queue_sequence
    trigger: "POST /patient-access/appointments/{id}/check-in"
    algorithm: aggregation
    formula: |
      # sequence_number = 1 + count(existing QueueTickets with same
      # (department_code, queue_date) in any state)
      # Never re-used after SKIPPED/REMOVED (monotonic per day per department).
    input_set: "QueueTickets of (department_code, queue_date)"
    constants: {}
    precision: "integer"
    variants: []

  - name: queue_priority
    trigger: "POST /patient-access/appointments/{id}/check-in"
    algorithm: constraint_propagation
    formula: |
      # priority =
      #   STAT          if appointment.visit_type == 'PROCEDURE' and
      #                    exists AccommodationFlag(active, flag_type==MOBILITY) — stat transport
      #                 (in this build: STAT only when payload stat_flag == true at check-in)
      #   ACCOMMODATION if any AccommodationFlag of the patient with active == true exists
      #   STANDARD      otherwise
      # Pinned: ACCOMMODATION beats STANDARD; STAT beats all.
    input_set: "active AccommodationFlags of the patient; check-in payload stat_flag"
    constants: {}
    precision: "enum derivation"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "role is permitted for the endpoint per §1.5 roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "every id referenced in path and body exists (patient, appointment, policy, referral, authorization, ticket, estimate)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: state
    check: "target resource is in a state permitting the transition (per §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 5
    category: business_safety
    check: "duplicate MRN prevention: patient creation is rejected when an existing Patient with status != MERGED matches on (first_name, last_name, date_of_birth) exact triple or on primary_phone"
    error_id: ERR_DUPLICATE_PATIENT
    http_status: 409
    applies_to: "POST /patient-access/patients"

  - priority: 6
    category: business_safety
    check: "referral requirement: for appointments whose primary policy plan_type is HMO/EPO, check-in/mark-ready requires a matched referral; missing referral blocks (gate != CLEAR)"
    error_id: ERR_REFERRAL_REQUIRED
    http_status: 422
    applies_to: "POST /patient-access/appointments/{id}/mark-ready"

  - priority: 7
    category: business_safety
    check: "prior authorization: visit_type PROCEDURE/IMAGING or payer-flagged auth_required without a current APPROVED Authorization blocks mark-ready"
    error_id: ERR_AUTH_REQUIRED
    http_status: 422
    applies_to: "POST /patient-access/appointments/{id}/mark-ready"

  - priority: 8
    category: business_constraint
    check: "provider double-booking: no two appointments with status in {SCHEDULED, PRE_CHECKED, READY, ARRIVED, IN_ROOM} for the same provider_code may overlap in [scheduled_start, scheduled_start + duration_minutes); touching intervals (end == start) do NOT overlap"
    error_id: ERR_PROVIDER_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /patient-access/appointments, PATCH /patient-access/appointments/{id}"

  - priority: 9
    category: business_constraint
    check: "queue uniqueness: an appointment may have at most one QueueTicket with state in {WAITING, CALLED}"
    error_id: ERR_TICKET_ALREADY_ACTIVE
    http_status: 409
    applies_to: "POST /patient-access/appointments/{id}/check-in"

  - priority: 10
    category: business_constraint
    check: "interpreter flag completeness: AccommodationFlag with flag_type == INTERPRETER requires language_code"
    error_id: ERR_LANGUAGE_REQUIRED
    http_status: 400
    applies_to: "POST /patient-access/patients/{id}/accommodation-flags"

  - priority: 11
    category: business_temporal
    check: "temporal sanity: effective_end >= effective_start on policy; valid_from <= valid_until on referral; appointment scheduled_start not in the past (strictly: >= current date)"
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 400
    applies_to: "POST /patient-access/insurance-policies, POST /patient-access/referrals, POST /patient-access/appointments, PATCH /patient-access/appointments/{id}"

  - priority: 12
    category: business_temporal
    check: "late arrival: check-in rejected when now > scheduled_start + LATE_ARRIVAL_CUTOFF_MINUTES (30); exactly at cutoff is allowed"
    error_id: ERR_TOO_LATE_FOR_CHECKIN
    http_status: 422
    applies_to: "POST /patient-access/appointments/{id}/check-in"

  - priority: 13
    category: business_fiscal
    check: "point-of-service collection shortfall: mark-ready rejected while gate == CLEAR_WITH_PAYMENT and amount_collected_cents < deposit_required_cents"
    error_id: ERR_DEPOSIT_SHORTFALL
    http_status: 402
    applies_to: "POST /patient-access/appointments/{id}/mark-ready"

  - priority: 14
    category: business_fiscal
    check: "refund cap: a REFUND payment may not exceed (current amount_collected_cents); refund to exactly 0 is allowed"
    error_id: ERR_REFUND_EXCEEDS_COLLECTED
    http_status: 422
    applies_to: "POST /patient-access/appointments/{id}/payments"

  - priority: 15
    category: business_referential
    check: "coordination-of-benefits uniqueness: priority_rank must be unique among the patient's policies with status != VOIDED"
    error_id: ERR_PRIORITY_RANK_CONFLICT
    http_status: 409
    applies_to: "POST /patient-access/insurance-policies"

  - priority: 16
    category: business_referential
    check: "policy belongs to appointment's patient; estimate's policy_id must belong to appointment.patient_id"
    error_id: ERR_CROSS_PATIENT_REFERENCE
    http_status: 422
    applies_to: "POST /patient-access/appointments/{id}/copay-estimates, POST /patient-access/eligibility-checks"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving, mandatory default) ---
  - method: POST
    path: /patient-access/_clock/set_current_utc
    description: "Sets the server's logical clock. Default before any set call: 2026-08-01T00:00:00Z. Never falls back to wall-clock."
    roles: [AccessSupervisor]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects:
      - "advancing past a Referral.valid_until flips it OPEN -> EXPIRED with cascade"
      - "advancing past an Authorization.valid_until flips it APPROVED -> EXPIRED with clearance recompute"

  # --- Patient ---
  - method: POST
    path: /patient-access/patients
    description: "Pre-register a patient (creates MRN); rejects duplicate demographics"
    roles: [Registrar]
    code: 201
    input: [first_name, last_name, date_of_birth, sex_at_birth, primary_phone, "email?", "language_code?"]
    output: Patient
    side_effects: ["mrn minted; status = PRE_REGISTERED"]

  - method: GET
    path: /patient-access/patients
    description: "List patients with pagination and optional filters"
    roles: [Registrar, FinancialCounselor, FrontDeskAgent, AccessSupervisor]
    code: 200
    input: ["status?", "last_name?", "date_of_birth?", "duplicate_of_patient_id?", "limit?", "offset?"]
    output: Patient[]
    side_effects: []

  - method: GET
    path: /patient-access/patients/{id}
    description: "Fetch one patient"
    roles: [Registrar, FinancialCounselor, FrontDeskAgent, AccessSupervisor]
    code: 200
    input: []
    output: Patient
    side_effects: []

  - method: POST
    path: /patient-access/patients/{id}/complete-registration
    description: "Capture demographics + consent; PRE_REGISTERED -> REGISTERED"
    roles: [Registrar]
    code: 200
    input: [consent_general, "consent_financial?", "primary_phone?", "email?"]
    output: Patient
    side_effects: ["patient.status = REGISTERED; appointments of patient recomputed"]

  - method: POST
    path: /patient-access/patients/{id}/merge
    description: "Resolve a duplicate: merge this patient into survivor_patient_id"
    roles: [Registrar]
    code: 200
    input: [survivor_patient_id, expected_patient_version]
    output: Patient
    side_effects:
      - "increments Patient.version by 1"
      - "appointments and policies re-pointed to survivor; referral matching re-run on moved appointments"

  - method: POST
    path: /patient-access/patients/{id}/deactivate
    description: "REGISTERED -> INACTIVE when no live appointments"
    roles: [AccessSupervisor]
    code: 200
    input: []
    output: Patient
    side_effects: []

  - method: GET
    path: /patient-access/patients/{id}/appointments
    description: "Reverse lookup: appointments of a patient"
    roles: [Registrar, FinancialCounselor, FrontDeskAgent, AccessSupervisor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Appointment[]
    side_effects: []

  - method: GET
    path: /patient-access/patients/{id}/insurance-policies
    description: "Reverse lookup: policies of a patient"
    roles: [Registrar, FinancialCounselor, AccessSupervisor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: InsurancePolicy[]
    side_effects: []

  - method: GET
    path: /patient-access/patients/{id}/referrals
    description: "Reverse lookup: referrals of a patient"
    roles: [Registrar, FinancialCounselor, AccessSupervisor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Referral[]
    side_effects: []

  - method: GET
    path: /patient-access/patients/{id}/accommodation-flags
    description: "Reverse lookup: flags of a patient"
    roles: [Registrar, FrontDeskAgent, AccessSupervisor]
    code: 200
    input: ["active?", "limit?", "offset?"]
    output: AccommodationFlag[]
    side_effects: []

  # --- AccommodationFlag ---
  - method: POST
    path: /patient-access/patients/{id}/accommodation-flags
    description: "Attach an interpreter/mobility/sensory/cognitive flag"
    roles: [Registrar]
    code: 201
    input: [flag_type, "language_code?", "note?"]
    output: AccommodationFlag
    side_effects: []

  - method: POST
    path: /patient-access/accommodation-flags/{id}/deactivate
    description: "Soft-deactivate a flag (active=false)"
    roles: [Registrar, AccessSupervisor]
    code: 200
    input: []
    output: AccommodationFlag
    side_effects: []

  # --- InsurancePolicy ---
  - method: POST
    path: /patient-access/insurance-policies
    description: "Add a coverage policy for a patient"
    roles: [Registrar]
    code: 201
    input: [patient_id, payer_id, member_id, "group_number?", plan_type, effective_start, "effective_end?", priority_rank, deductible_remaining_cents, oop_max_remaining_cents]
    output: InsurancePolicy
    side_effects: []

  - method: GET
    path: /patient-access/insurance-policies/{id}
    description: "Fetch one policy"
    roles: [Registrar, FinancialCounselor, AccessSupervisor]
    code: 200
    input: []
    output: InsurancePolicy
    side_effects: []

  - method: GET
    path: /patient-access/insurance-policies/{id}/eligibility-checks
    description: "Reverse lookup: eligibility checks posted against a policy"
    roles: [Registrar, FinancialCounselor, AccessSupervisor]
    code: 200
    input: ["limit?", "offset?"]
    output: EligibilityCheck[]
    side_effects: []

  - method: GET
    path: /patient-access/insurance-policies/{id}/copay-estimates
    description: "Reverse lookup: estimates computed from a policy"
    roles: [Registrar, FinancialCounselor, AccessSupervisor]
    code: 200
    input: ["limit?", "offset?"]
    output: CopayEstimate[]
    side_effects: []

  - method: POST
    path: /patient-access/insurance-policies/{id}/terminate
    description: "ACTIVE -> TERMINATED with cascade superseding provisional estimates"
    roles: [Registrar]
    code: 200
    input: [effective_end]
    output: InsurancePolicy
    side_effects: ["provisional estimates on this policy -> SUPERSEDED; appointment estimates re-derived"]

  - method: POST
    path: /patient-access/insurance-policies/{id}/void
    description: "ACTIVE -> VOIDED when never verified"
    roles: [AccessSupervisor]
    code: 200
    input: []
    output: InsurancePolicy
    side_effects: ["priority_rank slot released"]

  # --- Referral ---
  - method: POST
    path: /patient-access/referrals
    description: "Register an inbound referral/order"
    roles: [Registrar]
    code: 201
    input: [patient_id, referring_provider_npi, specialty_code, procedure_code, visits_authorized, valid_from, valid_until]
    output: Referral
    side_effects: ["referral_matching re-run for the patient's unmatched appointments"]

  - method: GET
    path: /patient-access/referrals/{id}
    description: "Fetch one referral"
    roles: [Registrar, FinancialCounselor, AccessSupervisor]
    code: 200
    input: []
    output: Referral
    side_effects: []

  - method: POST
    path: /patient-access/referrals/{id}/close
    description: "OPEN -> CLOSED"
    roles: [Registrar]
    code: 200
    input: []
    output: Referral
    side_effects: []

  # --- Authorization ---
  - method: POST
    path: /patient-access/authorizations
    description: "Record a payer authorization for a visit"
    roles: [Registrar]
    code: 201
    input: [patient_id, appointment_id, payer_auth_number, authorized_units, valid_until]
    output: Authorization
    side_effects: ["clearance_status recomputed for the appointment (auth_satisfied may flip true)"]

  - method: GET
    path: /patient-access/authorizations/{id}
    description: "Fetch one authorization"
    roles: [Registrar, FinancialCounselor, AccessSupervisor]
    code: 200
    input: []
    output: Authorization
    side_effects: []

  - method: GET
    path: /patient-access/appointments/{id}/authorizations
    description: "Reverse lookup: authorizations of an appointment"
    roles: [Registrar, FinancialCounselor, AccessSupervisor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Authorization[]
    side_effects: []

  - method: GET
    path: /patient-access/patients/{id}/authorizations
    description: "Reverse lookup: authorizations of a patient"
    roles: [Registrar, FinancialCounselor, AccessSupervisor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Authorization[]
    side_effects: []

  - method: POST
    path: /patient-access/authorizations/{id}/void
    description: "APPROVED -> VOIDED; clearance recomputed"
    roles: [AccessSupervisor]
    code: 200
    input: []
    output: Authorization
    side_effects: ["appointment clearance_status recomputed"]

  # --- Appointment ---
  - method: POST
    path: /patient-access/appointments
    description: "Schedule a visit; runs referral matching and initial clearance"
    roles: [Registrar]
    code: 201
    input: [patient_id, "referring_provider_npi?", department_code, procedure_code, scheduled_start, duration_minutes, visit_type, provider_code]
    output: Appointment
    side_effects: ["referral_matching", "clearance_status computed", "no_show_risk_strikes computed"]

  - method: GET
    path: /patient-access/appointments/{id}
    description: "Fetch one appointment with derived fields"
    roles: [Registrar, FinancialCounselor, FrontDeskAgent, AccessSupervisor]
    code: 200
    input: []
    output: Appointment
    side_effects: []

  - method: GET
    path: /patient-access/appointments
    description: "List appointments with filters"
    roles: [Registrar, FinancialCounselor, FrontDeskAgent, AccessSupervisor]
    code: 200
    input: ["patient_id?", "provider_code?", "department_code?", "status?", "date?", "referral_id?", "limit?", "offset?"]
    output: Appointment[]
    side_effects: []

  - method: PATCH
    path: /patient-access/appointments/{id}
    description: "Reschedule / edit an appointment (OCC-guarded)"
    roles: [Registrar]
    code: 200
    input: [expected_appointment_version, "scheduled_start?", "duration_minutes?", "provider_code?", "department_code?", "procedure_code?", "visit_type?"]
    output: Appointment
    side_effects:
      - "increments Appointment.version by 1"
      - "referral_matching re-run; clearance_status recomputed; double-booking re-validated"

  - method: POST
    path: /patient-access/appointments/{id}/pre-check
    description: "SCHEDULED -> PRE_CHECKED once eligibility is verified"
    roles: [Registrar]
    code: 200
    input: []
    output: Appointment
    side_effects: ["clearance_status recomputed"]

  - method: POST
    path: /patient-access/appointments/{id}/revert-precheck
    description: "PRE_CHECKED -> SCHEDULED"
    roles: [Registrar]
    code: 200
    input: []
    output: Appointment
    side_effects: ["clearance_status recomputed"]

  - method: POST
    path: /patient-access/appointments/{id}/mark-ready
    description: "PRE_CHECKED -> READY when gate is CLEAR or deposit satisfied"
    roles: [FinancialCounselor]
    code: 200
    input: []
    output: Appointment
    side_effects: []

  - method: POST
    path: /patient-access/appointments/{id}/check-in
    description: "READY -> ARRIVED; issues QueueTicket; consumes referral visit and authorization"
    roles: [FrontDeskAgent]
    code: 200
    input: ["stat_flag?"]
    output: Appointment
    side_effects:
      - "QueueTicket issued (queue_sequence + queue_priority)"
      - "late_minutes computed"
      - "matched Referral.visits_consumed += 1 (may EXHAUST it)"
      - "covering Authorization APPROVED -> CONSUMED"

  - method: POST
    path: /patient-access/appointments/{id}/complete
    description: "IN_ROOM -> COMPLETED; ticket SERVED; estimate FINAL"
    roles: [FrontDeskAgent]
    code: 200
    input: []
    output: Appointment
    side_effects: ["QueueTicket CALLED -> SERVED", "CopayEstimate PROVISIONAL -> FINAL"]

  - method: POST
    path: /patient-access/appointments/{id}/cancel
    description: "Cancel from any pre-arrival state"
    roles: [Registrar]
    code: 200
    input: ["reason?"]
    output: Appointment
    side_effects: ["WAITING ticket (if any) -> REMOVED"]

  - method: POST
    path: /patient-access/appointments/{id}/mark-no-show
    description: "Manual no-show marking after grace period"
    roles: [FrontDeskAgent]
    code: 200
    input: []
    output: Appointment
    side_effects: ["status = NO_SHOW"]

  - method: GET
    path: /patient-access/appointments/{id}/copay-estimates
    description: "Reverse lookup: estimates of an appointment"
    roles: [Registrar, FinancialCounselor, AccessSupervisor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CopayEstimate[]
    side_effects: []

  - method: GET
    path: /patient-access/appointments/{id}/payments
    description: "Reverse lookup: payments of an appointment"
    roles: [Registrar, FinancialCounselor, AccessSupervisor]
    code: 200
    input: ["limit?", "offset?"]
    output: Payment[]
    side_effects: []

  - method: GET
    path: /patient-access/appointments/{id}/queue-tickets
    description: "Reverse lookup: tickets of an appointment"
    roles: [FrontDeskAgent, AccessSupervisor]
    code: 200
    input: ["limit?", "offset?"]
    output: QueueTicket[]
    side_effects: []

  - method: GET
    path: /patient-access/appointments/{id}/eligibility-checks
    description: "Reverse lookup: eligibility checks of an appointment"
    roles: [Registrar, FinancialCounselor, AccessSupervisor]
    code: 200
    input: ["limit?", "offset?"]
    output: EligibilityCheck[]
    side_effects: []

  # --- EligibilityCheck ---
  - method: POST
    path: /patient-access/eligibility-checks
    description: "Post a payer eligibility response for (appointment, policy)"
    roles: [Registrar]
    code: 201
    input: [policy_id, appointment_id, coverage_status, copay_cents, coinsurance_pct, auth_required]
    output: EligibilityCheck
    side_effects: ["eligibility_result derivation", "clearance_status recomputed for the appointment"]

  # --- CopayEstimate ---
  - method: POST
    path: /patient-access/appointments/{id}/copay-estimates
    description: "Create an estimate; supersedes prior PROVISIONAL estimates"
    roles: [FinancialCounselor]
    code: 201
    input: [policy_id, allowed_amount_cents]
    output: CopayEstimate
    side_effects:
      - "copay_estimate + deposit_rule calculations"
      - "prior PROVISIONAL estimates of this appointment -> SUPERSEDED"
      - "appointment.estimated_patient_responsibility_cents re-pinned; clearance recomputed"

  # --- Payment ---
  - method: POST
    path: /patient-access/appointments/{id}/payments
    description: "Post a point-of-service collection or refund"
    roles: [FinancialCounselor]
    code: 201
    input: [amount_cents, method, kind]
    output: Payment
    side_effects: ["collected_amount recomputed", "clearance recomputed (CLEAR_WITH_PAYMENT may become CLEAR)"]

  - method: POST
    path: /patient-access/payments/{id}/void
    description: "Void a posted payment"
    roles: [AccessSupervisor]
    code: 200
    input: []
    output: Payment
    side_effects: ["collected_amount recomputed", "clearance recomputed"]

  # --- Queue ---
  - method: POST
    path: /patient-access/queue-tickets/call-next
    description: "Pop the next WAITING ticket per selector; appointment ARRIVED -> IN_ROOM"
    roles: [FrontDeskAgent]
    code: 200
    input: [department_code, queue_date]
    output: QueueTicket
    side_effects: ["ticket WAITING -> CALLED", "appointment ARRIVED -> IN_ROOM"]

  - method: POST
    path: /patient-access/queue-tickets/{id}/skip
    description: "CALLED -> SKIPPED; appointment back to ARRIVED for re-rooming"
    roles: [FrontDeskAgent]
    code: 200
    input: []
    output: QueueTicket
    side_effects: ["owning appointment IN_ROOM -> ARRIVED"]

  - method: GET
    path: /patient-access/departments/{department_code}/queue
    description: "List the day's queue for a department"
    roles: [FrontDeskAgent, AccessSupervisor]
    code: 200
    input: [queue_date, "state?", "limit?", "offset?"]
    output: QueueTicket[]
    side_effects: []

  - method: POST
    path: /patient-access/departments/{department_code}/close-day
    description: "Ops-run sweep: mark no-shows for the date, expire stale queues"
    roles: [AccessSupervisor]
    code: 200
    input: [queue_date]
    output: "{ no_show_count: integer, expired_ticket_count: integer }"
    side_effects:
      - "every Appointment of the department with status in {SCHEDULED, PRE_CHECKED, READY} and scheduled_start + NO_SHOW_GRACE_MINUTES <= now -> NO_SHOW"
      - "WAITING tickets of the date -> REMOVED"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/invalid X-User-Role or X-User-ID header"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "role not permitted for this endpoint"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "referenced resource id does not exist"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "required field missing or malformed (type/format/enum)"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "state-machine precondition violated (e.g., check-in before READY, complete before IN_ROOM)"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not match the current version (OCC)"
  - id: ERR_DUPLICATE_PATIENT
    http: 409
    condition: "patient create matches an existing non-MERGED patient on (first_name,last_name,date_of_birth) or primary_phone"
  - id: ERR_REFERRAL_REQUIRED
    http: 422
    condition: "HMO/EPO plan requires a matched referral before mark-ready"
  - id: ERR_AUTH_REQUIRED
    http: 422
    condition: "procedure/imaging visit or payer-flagged auth without current APPROVED Authorization"
  - id: ERR_PROVIDER_DOUBLE_BOOKED
    http: 409
    condition: "requested slot overlaps another live appointment of the same provider_code"
  - id: ERR_TICKET_ALREADY_ACTIVE
    http: 409
    condition: "appointment already has a WAITING or CALLED queue ticket"
  - id: ERR_LANGUAGE_REQUIRED
    http: 400
    condition: "INTERPRETER flag missing language_code"
  - id: ERR_INVALID_DATE_RANGE
    http: 400
    condition: "end before start, or scheduled_start in the past"
  - id: ERR_TOO_LATE_FOR_CHECKIN
    http: 422
    condition: "now > scheduled_start + 30 minutes at check-in"
  - id: ERR_DEPOSIT_SHORTFALL
    http: 402
    condition: "mark-ready with amount_collected_cents < deposit_required_cents"
  - id: ERR_REFUND_EXCEEDS_COLLECTED
    http: 422
    condition: "REFUND amount exceeds current amount_collected_cents"
  - id: ERR_PRIORITY_RANK_CONFLICT
    http: 409
    condition: "priority_rank already used by another non-VOIDED policy of the patient"
  - id: ERR_CROSS_PATIENT_REFERENCE
    http: 422
    condition: "policy_id / patient_id mismatch across linked resources"
  - id: ERR_QUEUE_EMPTY
    http: 404
    condition: "call-next with no WAITING ticket for (department_code, queue_date)"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Registrar
    description: "Patient access registrar: registration, insurance, referrals, authorizations, scheduling"
    identity: "opaque"
    exclusive_operations:
      - "POST /patient-access/patients"
      - "POST /patient-access/patients/{id}/complete-registration"
      - "POST /patient-access/patients/{id}/merge"
      - "POST /patient-access/patients/{id}/accommodation-flags"
      - "POST /patient-access/insurance-policies"
      - "POST /patient-access/insurance-policies/{id}/terminate"
      - "POST /patient-access/referrals"
      - "POST /patient-access/referrals/{id}/close"
      - "POST /patient-access/authorizations"
      - "POST /patient-access/appointments"
      - "PATCH /patient-access/appointments/{id}"
      - "POST /patient-access/appointments/{id}/pre-check"
      - "POST /patient-access/appointments/{id}/revert-precheck"
      - "POST /patient-access/appointments/{id}/cancel"
      - "POST /patient-access/eligibility-checks"
    shared_operations:
      - "GET endpoints (all read operations)"

  - name: FinancialCounselor
    description: "Estimates patient responsibility and collects point-of-service payments"
    identity: "opaque"
    exclusive_operations:
      - "POST /patient-access/appointments/{id}/copay-estimates"
      - "POST /patient-access/appointments/{id}/payments"
      - "POST /patient-access/appointments/{id}/mark-ready"
    shared_operations:
      - "GET endpoints (all read operations)"

  - name: FrontDeskAgent
    description: "Arrival, queue, and rooming operations"
    identity: "opaque"
    exclusive_operations:
      - "POST /patient-access/appointments/{id}/check-in"
      - "POST /patient-access/appointments/{id}/complete"
      - "POST /patient-access/appointments/{id}/mark-no-show"
      - "POST /patient-access/queue-tickets/call-next"
      - "POST /patient-access/queue-tickets/{id}/skip"
    shared_operations:
      - "GET endpoints (all read operations)"

  - name: AccessSupervisor
    description: "Oversight: voids, merges oversight, clock control, day close"
    identity: "opaque"
    exclusive_operations:
      - "POST /patient-access/_clock/set_current_utc"
      - "POST /patient-access/patients/{id}/deactivate"
      - "POST /patient-access/insurance-policies/{id}/void"
      - "POST /patient-access/authorizations/{id}/void"
      - "POST /patient-access/payments/{id}/void"
      - "POST /patient-access/departments/{department_code}/close-day"
      - "POST /patient-access/accommodation-flags/{id}/deactivate"
    shared_operations:
      - "GET endpoints (all read operations)"
