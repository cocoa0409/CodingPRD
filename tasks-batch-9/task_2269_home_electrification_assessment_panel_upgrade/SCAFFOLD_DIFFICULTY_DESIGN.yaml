      - name: installation_blocked_by_contractor_hold_cascade_and_released_on_reinstatement
        grounds:
          - state_machines.RebateProject.RESERVED_to_CONTRACTOR_HOLD
          - state_machines.RebateProject.CONTRACTOR_HOLD_to_RESERVED
          - state_machines.Contractor.ENROLLED_ACTIVE_to_SUSPENDED
          - validations.priority_8
          - validations.priority_11
        distinguishing_aspect: |
          Entity pair (RebateProject, Contractor), and the dependency runs in
          BOTH directions: the contractor's suspension pushes the project into
          CONTRACTOR_HOLD, and while it sits there the project's own state —
          not the contractor's — is what refuses the installation report,
          because priority 8 outranks priority 11. Reinstating the contractor
          pulls the project back to RESERVED and the identical installation
          payload then succeeds.
        test_recipe:
          setup:
            - "An OPEN program with low_tier_cost_share_pct 1.00, low_tier_cap_cents 1400000 and group_cap_cents 800000."
            - "Catalog: HP-HVAC-01 unit 800000 / cap 800000 / HVAC_GROUP / 200 A / anchor."
