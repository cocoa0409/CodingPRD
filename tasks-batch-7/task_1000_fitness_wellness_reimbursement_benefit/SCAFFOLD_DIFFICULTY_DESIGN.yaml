            - { call: "POST /api/benefit-plans", payload: { employer_id: "${emp_id}", name: "2026 Tiny", benefit_year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z" }, as: BenefitsAdmin, captures: { plan_id: $.data.id, plan_v: $.data.version } }
