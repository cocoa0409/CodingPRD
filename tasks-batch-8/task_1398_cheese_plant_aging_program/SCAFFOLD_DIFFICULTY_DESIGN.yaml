            - "err == ERR_VAT_OVERLAP (05:59 start overlaps make1's [02:00,06:00) interval)"

      - name: aging_room_capacity_aggregate_overlap
        grounds:
          - state_machines.CheeseBatch.GREEN_to_AGING
          - calculations.aging_room_posture
          - errors[ERR_ROOM_FULL]
        distinguishing_aspect: |
          Different resource AND different interval semantics than instance 1:
          the AgingRoom has no time interval at all — capacity is an AGGREGATE
          occupancy invariant (wheels_present + wheel_count <= capacity_wheels).
          Placement of exactly the remaining capacity passes; one wheel more
          rejects — an aggregate-capacity edge, not interval adjacency.
        test_recipe:
          setup:
            - "Room capacity 12; two completed batches (4 wheels each and 5 wheels... ) — use batch A 8 wheels, batch B 5 wheels: place 8 (passes), place 4 of B (fills to exactly 12, passes), place 1 more of B (rejects)"
