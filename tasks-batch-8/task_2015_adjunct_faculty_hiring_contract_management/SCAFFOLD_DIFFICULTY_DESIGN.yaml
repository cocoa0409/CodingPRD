              payload: { application_id: "${app_id}", kind: "BACKGROUND_CHECK", evidence_ref: "ev-b-ira" }
              as: HRReviewer
              as_user_id: "hr_reviewer_1"
              captures: { cred_b: $.data.id }
            - call: "POST /adjunct-hr/credentials"
              payload: { application_id: "${app_id}", kind: "TRAINING", evidence_ref: "ev-tr-ira" }
