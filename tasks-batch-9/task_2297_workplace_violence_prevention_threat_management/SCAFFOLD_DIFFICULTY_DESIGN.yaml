            - call: "POST /drills/${drill2_id}/execute"
              payload: { participant_count: 11, findings_count: 0 }
              as: SafetyOfficer
              as_user_id: "${so_id}"
          assert:
            - "Drill.${drill1_id}.participation_pct == 60.00 exactly and credited == true"
            - "Drill.${drill1_id}.status == EXECUTED with executed_at 2026-08-01T00:00:00Z and findings_count 3"
            - "PreventionPlan.${plan_id}.drills_completed_12mo == 1 after the first execute"
            - "Drill.${drill2_id}.participation_pct == 55.00 and credited == false"
            - "PreventionPlan.${plan_id}.drills_completed_12mo is still 1 after the second execute"
