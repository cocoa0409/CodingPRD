          rationale: "Asserted as the failure path of the named difficulty instance (6th delivery attempt returns ERR_CHART_REVIEW_OVERDUE)."
      - name: error_machine_slot_conflict_trigger
        claim_type: violation_to_error
        grounds: [errors.ERR_MACHINE_SLOT_CONFLICT]
        excluded_because:
          difficulty_instance: linac_turnover_buffer_blocks_back_to_back
          rationale: "The 09:20 booking attempt in the difficulty instance asserts ERR_MACHINE_SLOT_CONFLICT."
      - name: error_simulator_slot_conflict_trigger
        claim_type: violation_to_error
        grounds: [errors.ERR_SIMULATOR_SLOT_CONFLICT]
        excluded_because:
          difficulty_instance: simulator_half_open_adjacency_no_buffer
          rationale: "The 09:15-09:45 straddle booking in the difficulty instance asserts ERR_SIMULATOR_SLOT_CONFLICT."
      - name: error_plan_course_mismatch_trigger
        claim_type: violation_to_error
        grounds: [errors.ERR_PLAN_COURSE_MISMATCH]
        excluded_because:
          difficulty_instance: schedule_referential_error_precedes_temporal_conflict
