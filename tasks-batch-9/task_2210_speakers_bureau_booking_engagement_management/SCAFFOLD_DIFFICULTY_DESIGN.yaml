  - rule_id: priority_pair_validation_conflict
    instances:

      - name: priority_lead_time_outranks_budget_floor_on_qualification
        grounds:
          - validations[priority=15]
          - validations[priority=18]
          - state_machines.Inquiry.RECEIVED_to_QUALIFIED
          - entities.Inquiry.fields.budget_cents
        distinguishing_aspect: |
          One request violates the temporal rule at priority 15 (9 whole days of lead time
          against a 21-day floor) AND the fiscal rule at priority 18 (budget 100000 against a
          250000 floor). Only ERR_INSUFFICIENT_LEAD_TIME may surface; the control request that
          fixes the calendar alone then exposes ERR_BUDGET_BELOW_FLOOR, proving the pair really
          is jointly violated and that the ordering — not the presence of one violation — decides.
        test_recipe:
          setup:
            - "Logical clock at the 2026-08-01T00:00:00Z default"
            - "One client with credit_status GOOD and one ACTIVE speaker"
            - "Inquiry #1 RECEIVED for a 2026-08-10T16:00:00Z event with budget_cents 100000 (both floors breached)"
            - "Inquiry #2 RECEIVED for a 2026-10-15T16:00:00Z event with budget_cents 100000 (only the fiscal floor breached)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /speakers"
              payload: { full_name: "Dana Reyes", topics: ["AI_STRATEGY"], fee_floor_cents: 1000000, fee_ceiling_cents: 2000000, travel_class: "ECONOMY", travel_buffer_days: 1, tax_form_status: "ON_FILE" }
              as: BureauAdmin
              captures: { sp: $.data.id }
            - call: "POST /clients"
              payload: { org_name: "Meridian Health", industry_code: "HEALTHCARE", primary_contact_email: "ops@meridian.example" }
              as: BureauAdmin
              captures: { cl: $.data.id }
            - call: "POST /inquiries"
              payload: { client_id: "${cl}", required_topic: "AI_STRATEGY", event_start_utc: "2026-08-10T16:00:00Z", event_end_utc: "2026-08-10T18:00:00Z", audience_size: 200, budget_cents: 100000, objective_tags: ["INSPIRE"] }
              as: BookingAgent
              as_user_id: "agent-01"
              captures: { inq_1: $.data.id }
            - call: "POST /inquiries"
              payload: { client_id: "${cl}", required_topic: "AI_STRATEGY", event_start_utc: "2026-10-15T16:00:00Z", event_end_utc: "2026-10-15T18:00:00Z", audience_size: 200, budget_cents: 100000, objective_tags: ["INSPIRE"] }
              as: BookingAgent
              as_user_id: "agent-01"
              captures: { inq_2: $.data.id }
          trigger:
            - call: "POST /inquiries/${inq_1}/qualify"
              payload: { outcome: "QUALIFY" }
              as: BookingAgent
              as_user_id: "agent-01"
            - call: "POST /inquiries/${inq_2}/qualify"
              payload: { outcome: "QUALIFY" }
              as: BookingAgent
              as_user_id: "agent-01"
          assert:
            - "the first qualify returns 409 with error_id ERR_INSUFFICIENT_LEAD_TIME, never ERR_BUDGET_BELOW_FLOOR"
            - "the second qualify returns 409 with error_id ERR_BUDGET_BELOW_FLOOR, confirming the fiscal rule was genuinely violated by both requests"
            - "both inquiries remain status RECEIVED with owning_agent_user_id still null — a rejected qualification writes nothing"

      - name: priority_exclusivity_conflict_outranks_calendar_conflict_on_confirm
        grounds:
          - validations[priority=14]
          - validations[priority=15]
