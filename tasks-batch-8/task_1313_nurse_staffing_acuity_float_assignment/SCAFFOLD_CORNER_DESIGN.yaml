      - name: float_selector_tie_break_created_at
        claim_type: selector_tie_break
        grounds: [calculations.float_candidate_selection]
        distinguishing_aspect: "Two eligible float nurses tie on projected hours (0.0); the one with the earlier created_at wins — never the id."
