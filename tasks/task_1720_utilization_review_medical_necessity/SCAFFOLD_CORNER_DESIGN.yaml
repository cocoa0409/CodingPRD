          assert:
            - "error_id == ERR_INVALID_STATE with http 409; AppealCase.${app_id}.status remains DECIDED_UPHELD and overturned_day_count == 0"
      - name: escalation_acknowledge_resolve_chain
        claim_type: valid_transition
        grounds: [state_machines.EscalationCase]
        distinguishing_aspect: "Happy-path OPEN -> ACKNOWLEDGED -> RESOLVED with resolution_note persisted."
        test_recipe:
