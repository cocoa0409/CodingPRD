# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3203_creator_monetization_review_content_claims_revenue_split
#
# One instance per named feature; every `grounds:` entry resolves into
# SCAFFOLD.yaml §1.1-§1.6. 22 instances across the nine §0.5 Difficulty Rules.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: ad_share_per_record_rounding_versus_batch_rounding
        grounds:
          - calculations.royalty_share_split
          - calculations.adjusted_net_balance
          - validations[priority=11]
        distinguishing_aspect: "The same three AD routings of 1001 gross each produce creator shares 551+551+551 = 1653 when rounding is applied per RevenueRouting row, but only 1652 when the 3003 batch total is rounded once — revenue-domain dual-variant rounding."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Channel US (country_code US, 8000 watch hours, 1200 subscribers, tax_tin_status TIN_PROVIDED, payment_threshold_cents 100) approved for monetization, one content item with gross_revenue_cents 3003 that does not hold revenue, and a locked payout batch that routes the item's three AD routings."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/channels"
              payload: { channel_name: "Dual Variant US", country_code: "US", lifetime_watch_hours: 8000, subscriber_count: 1200, tax_tin_status: "TIN_PROVIDED", tax_treaty: false, payment_threshold_cents: 100 }
              as: Anonymous
              captures: { ch_a: $.data.id }
            - call: "POST /api/reference-files"
              payload: { rights_holder_name: "Harmony Masters", asset_kind: "AUDIO", reference_fingerprint: "fp-dual-none", policy_mode: "MONETIZE", claimed_segment_seconds: 60 }
              as: RightsHolder
              as_user_id: "rh-dual-1"
            - call: "POST /api/channels/${ch_a}/content-items"
              payload: { title: "Rounding Trap", duration_seconds: 600, category_code: "MUSIC" }
              as: Creator
              as_user_id: "${ch_a}"
              captures: { i_a: $.data.id }
            - call: "POST /api/channels/${ch_a}/content-items/${i_a}/requests-review"
              payload: {}
              as: Creator
              as_user_id: "${ch_a}"
            - call: "GET /api/content-items/${i_a}"
              payload: {}
              as: Any
              captures: { i_v1: $.data.version }
            - call: "POST /api/revenue-routings"
              payload: { content_item_id: "${i_a}", stream_type: "AD", gross_revenue_cents: 1001, expected_content_item_version: "${i_v1}" }
              as: PlatformAdmin
              captures: { r_1: $.data.id }
            - call: "GET /api/content-items/${i_a}"
              payload: {}
              as: Any
              captures: { i_v2: $.data.version }
            - call: "POST /api/revenue-routings"
              payload: { content_item_id: "${i_a}", stream_type: "AD", gross_revenue_cents: 1001, expected_content_item_version: "${i_v2}" }
              as: PlatformAdmin
              captures: { r_2: $.data.id }
            - call: "GET /api/content-items/${i_a}"
              payload: {}
              as: Any
              captures: { i_v3: $.data.version }
            - call: "POST /api/revenue-routings"
              payload: { content_item_id: "${i_a}", stream_type: "AD", gross_revenue_cents: 1001, expected_content_item_version: "${i_v3}" }
              as: PlatformAdmin
              captures: { r_3: $.data.id }
            - call: "GET /api/channels/${ch_a}"
              payload: {}
              as: Any
              captures: { ch_v1: $.data.version }
            - call: "POST /api/channels/${ch_a}/payouts/lock"
              payload: { period_start_at: "2026-09-01T00:00:00Z", period_end_at: "2026-10-01T00:00:00Z", expected_channel_version: "${ch_v1}" }
              as: PlatformAdmin
              captures: { b_a: $.data.id, b_v: $.data.version }
          trigger:
            - call: "POST /api/channels/${ch_a}/payouts/${b_a}/release"
              payload: { expected_payout_batch_version: "${b_v}" }
              as: PlatformAdmin
          assert:
            - "RevenueRouting.${r_1}.creator_share_cents == 551 and RevenueRouting.${r_1}.partner_share_cents == 450"
            - "PayoutBatch.${b_a}.gross_cents == 3003"
            - "PayoutBatch.${b_a}.creator_share_cents == 1653"
            - "PayoutBatch.${b_a}.withholding_rate_pct == 0.00"
            - "PayoutBatch.${b_a}.tax_withheld_cents == 0"
            - "PayoutBatch.${b_a}.adjusted_net_cents == 1653"
            - "PayoutBatch.${b_a}.status == RELEASED"

      - name: treaty_override_withholding_versus_country_table
        grounds:
          - calculations.tax_withholding_by_country
          - calculations.adjusted_net_balance
          - validations[priority=11]
        distinguishing_aspect: "For identical DE revenue, a TIN_PROVIDED channel with tax_treaty true withholds 0.15 while the same channel with tax_treaty false withholds the DE table rate 0.26 — a withholding-domain divergence, not another rounding variant."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Channel DE (country_code DE, tax_tin_status TIN_PROVIDED, tax_treaty false, payment_threshold_cents 100) approved, one AD routing of 3003 gross with creator_share_cents 1652, and a locked payout batch covering it."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/channels"
              payload: { channel_name: "Treaty DE", country_code: "DE", lifetime_watch_hours: 9000, subscriber_count: 4000, tax_tin_status: "TIN_PROVIDED", tax_treaty: false, payment_threshold_cents: 100 }
              as: Anonymous
              captures: { ch_b: $.data.id }
            - call: "POST /api/channels/${ch_b}/content-items"
              payload: { title: "Treaty Session", duration_seconds: 900, category_code: "MUSIC" }
              as: Creator
              as_user_id: "${ch_b}"
              captures: { i_b: $.data.id }
            - call: "POST /api/channels/${ch_b}/content-items/${i_b}/requests-review"
              payload: {}
              as: Creator
              as_user_id: "${ch_b}"
            - call: "GET /api/content-items/${i_b}"
              payload: {}
              as: Any
              captures: { i_bv1: $.data.version }
            - call: "POST /api/revenue-routings"
              payload: { content_item_id: "${i_b}", stream_type: "AD", gross_revenue_cents: 3003, expected_content_item_version: "${i_bv1}" }
              as: PlatformAdmin
              captures: { r_b: $.data.id }
            - call: "GET /api/channels/${ch_b}"
              payload: {}
              as: Any
              captures: { ch_bv1: $.data.version }
            - call: "POST /api/channels/${ch_b}/payouts/lock"
              payload: { period_start_at: "2026-09-01T00:00:00Z", period_end_at: "2026-10-01T00:00:00Z", expected_channel_version: "${ch_bv1}" }
              as: PlatformAdmin
              captures: { b_b: $.data.id, b_bv: $.data.version }
          trigger:
            - call: "PATCH /api/channels/${ch_b}"
              payload: { tax_treaty: true }
              as: PlatformAdmin
            - call: "POST /api/channels/${ch_b}/payouts/${b_b}/release"
              payload: { expected_payout_batch_version: "${b_bv}" }
              as: PlatformAdmin
          assert:
            - "PayoutBatch.${b_b}.creator_share_cents == 1652"
            - "PayoutBatch.${b_b}.withholding_rate_pct == 0.15"
            - "PayoutBatch.${b_b}.tax_withheld_cents == 248"
            - "PayoutBatch.${b_b}.adjusted_net_cents == 1404"
            - "the same batch released without the treaty patch would have withheld 0.26 * 1652 = 429, i.e. 181 cents more"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: membership_schedule_nested_rounding_independent_parts
        grounds:
          - calculations.membership_schedule
          - calculations.royalty_share_split
        distinguishing_aspect: "Membership fee 1999 splits into creator 1399 and platform 600, but the network fee is 3% of the gross (60) and is added on top, so the member pays 2059 — the parts are rounded independently rather than derived by subtracting one rounded part from another (nested-rounding order mode)."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Channel US approved, no schedules yet."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/channels"
              payload: { channel_name: "Membership Studio", country_code: "US", lifetime_watch_hours: 12000, subscriber_count: 9000, tax_tin_status: "TIN_PROVIDED", payment_threshold_cents: 100 }
              as: Anonymous
              captures: { ch_m: $.data.id }
            - call: "POST /api/channels/${ch_m}/monetization-applications"
              payload: {}
              as: Creator
              as_user_id: "${ch_m}"
            - call: "POST /api/channels/${ch_m}/monetization-review"
              payload: { decision: "APPROVE" }
              as: MonetizationReviewer
          trigger:
            - call: "POST /api/channels/${ch_m}/membership-schedules"
              payload: { tier_name: "Studio Plus", monthly_fee_cents: 1999, perks: ["badges", "live-chat"] }
              as: Creator
              as_user_id: "${ch_m}"
              captures: { sch_m: $.data.id }
          assert:
            - "MembershipSchedule.${sch_m}.creator_share_cents == 1399"
            - "MembershipSchedule.${sch_m}.platform_share_cents == 600"
            - "MembershipSchedule.${sch_m}.network_fee_cents == 60"
            - "MembershipSchedule.${sch_m}.member_charge_cents == 2059"
            - "creator_share_cents + platform_share_cents == 1999 exactly"
            - "a sum-then-round implementation would report 1399 + 600 = 1999 but charge 2058, i.e. 1 cent low"

      - name: settlement_waterfall_bucket_order_and_remainder_absorption
        grounds:
          - calculations.settlement_waterfall_for_item
          - calculations.royalty_share_split
        distinguishing_aspect: "On a 3003 gross item the single claim bucket keeps 3003 - floor_half_up(3003*0.55) = 1351 and the trailing channel bucket absorbs the remaining 1652, conserving the total — evaluation-order mode with an explicit remainder absorber (§0.5 mode c) rather than a rounding variant."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Channel US approved, one item of 3003 gross with exactly one ACTIVE claim, no routings yet."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/channels"
              payload: { channel_name: "Waterfall US", country_code: "US", lifetime_watch_hours: 8000, subscriber_count: 1500, tax_tin_status: "TIN_PROVIDED", payment_threshold_cents: 100 }
              as: Anonymous
              captures: { ch_w: $.data.id }
            - call: "POST /api/reference-files"
              payload: { rights_holder_name: "Waterfall Rights", asset_kind: "AUDIO", reference_fingerprint: "fp-waterfall-1", policy_mode: "MONETIZE", claimed_segment_seconds: 120 }
              as: RightsHolder
              as_user_id: "rh-waterfall-1"
              captures: { rf_w: $.data.id }
            - call: "POST /api/channels/${ch_w}/content-items"
              payload: { title: "Waterfall Source", duration_seconds: 700, category_code: "MUSIC" }
              as: Creator
              as_user_id: "${ch_w}"
              captures: { i_w: $.data.id }
            - call: "POST /api/channels/${ch_w}/content-items/${i_w}/requests-review"
              payload: {}
              as: Creator
              as_user_id: "${ch_w}"
            - call: "POST /api/channels/${ch_w}/monetization-applications"
              payload: {}
              as: Creator
              as_user_id: "${ch_w}"
            - call: "POST /api/channels/${ch_w}/monetization-review"
              payload: { decision: "APPROVE" }
              as: MonetizationReviewer
          trigger:
            - call: "POST /api/content-items/${i_w}/settle"
              payload: {}
              as: PlatformAdmin
          assert:
            - "ContentItem.${i_w}.gross_revenue_cents == 3003"
            - "the claim bucket retains 1351 and the trailing channel bucket absorbs 1652"
            - "the bucket amounts sum to exactly 3003 — no cent is created or destroyed"
            - "a lowest-confidence-first bucket ordering would move every subtotal while still summing to 3003"

      - name: ad_review_decision_multi_input_non_linear_outcome
        grounds:
          - calculations.ad_review_decision
          - calculations.monetization_posture
          - state_machines.ContentItem.CLASSIFIED_to_CLASSIFIED
        distinguishing_aspect: "The outcome is a non-linear function of a matched-category set and an engagement count: one matched category yields LIMITED_ADS while two matched categories on the same revenue profile yield NO_ADS, and the MILDLANGUAGE member is dropped once like_count+comment_count reaches 1000 — three inputs interacting non-linearly (§0.5 mode a)."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Channel US approved, one item with two limited-eligible categories on its classification input."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/channels"
              payload: { channel_name: "Classify US", country_code: "US", lifetime_watch_hours: 8000, subscriber_count: 1500, tax_tin_status: "TIN_PROVIDED", payment_threshold_cents: 100 }
              as: Anonymous
              captures: { ch_c: $.data.id }
            - call: "POST /api/channels/${ch_c}/content-items"
              payload: { title: "Two Flags", duration_seconds: 500, category_code: "NEWS" }
              as: Creator
              as_user_id: "${ch_c}"
              captures: { i_c: $.data.id }
          trigger:
            - call: "POST /api/content-items/${i_c}/classifications"
              payload: { category_codes: ["NEWS", "POLITICS"], like_count: 10, comment_count: 5 }
              as: Reviewer
              captures: { i_cv: $.data.version }
          assert:
            - "ContentItem.${i_c}.ad_suitability == NO_ADS"
            - "ContentItem.${i_c}.limited_ads_reasons == [\"NEWS\", \"POLITICS\"]"
            - "the same item submitted with category_codes [\"NEWS\"] alone yields LIMITED_ADS"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: parallel_dimensions_upload_ad_and_claim_axes
        grounds:
          - state_machines.ContentItem.CLASSIFIED_to_CLAIM_SCAN_COMPLETE
          - state_machines.ContentItem.CLASSIFIED_to_CLASSIFIED
          - state_machines.Claim.ACTIVE_to_RELEASED
          - state_machines.Channel.MONETIZATION_APPROVED_to_MONETIZATION_REVOKED
        distinguishing_aspect: "Three independent state axes evolve on the same logical subject: ContentItem.upload_status / ad_suitability, Claim.status and Channel.monetization_posture — an appeal decision resolves one axis while the other two hold, which no linear pipeline can express."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Channel US approved with one item resolved to CLAIM_SCAN_COMPLETE carrying an ACTIVE claim; the claim has been appealed once (FIRST, PENDING)."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/channels"
              payload: { channel_name: "Parallel US", country_code: "US", lifetime_watch_hours: 8000, subscriber_count: 1500, tax_tin_status: "TIN_PROVIDED", payment_threshold_cents: 100 }
              as: Anonymous
              captures: { ch_p: $.data.id }
            - call: "POST /api/reference-files"
              payload: { rights_holder_name: "Parallel Rights", asset_kind: "AUDIO", reference_fingerprint: "fp-parallel-1", policy_mode: "MONETIZE", claimed_segment_seconds: 90 }
              as: RightsHolder
              as_user_id: "rh-parallel-1"
              captures: { rf_p: $.data.id }
            - call: "POST /api/channels/${ch_p}/content-items"
              payload: { title: "Parallel Source", duration_seconds: 800, category_code: "MUSIC" }
              as: Creator
              as_user_id: "${ch_p}"
              captures: { i_p: $.data.id }
            - call: "POST /api/channels/${ch_p}/content-items/${i_p}/requests-review"
              payload: {}
              as: Creator
              as_user_id: "${ch_p}"
            - call: "POST /api/channels/${ch_p}/monetization-applications"
              payload: {}
              as: Creator
              as_user_id: "${ch_p}"
            - call: "POST /api/channels/${ch_p}/monetization-review"
              payload: { decision: "APPROVE" }
              as: MonetizationReviewer
            - call: "GET /api/claims"
              payload: { content_item_id: "${i_p}" }
              as: Any
              captures: { "cl_p": "$.data[0].id", "cl_v": "$.data[0].version" }
            - call: "POST /api/claims/${cl_p}/dispute"
              payload: { expected_claim_version: "${cl_v}", reason_code: "FAIR_USE" }
              as: Creator
              as_user_id: "${ch_p}"
            - call: "POST /api/claims/${cl_p}/appeals"
              payload: { grounds_code: "REVIEW_ERROR" }
              as: RightsHolder
              as_user_id: "${rf_p}"
              captures: { ap_p: $.data.id }
          trigger:
            - call: "POST /api/claims/${cl_p}/appeals/${ap_p}/decide"
              payload: { decision: "UPHOLD" }
              as: RightsHolder
              as_user_id: "${rf_p}"
          assert:
            - "Claim.${cl_p}.status == REINSTATED while ContentItem.${i_p}.upload_status == CLAIM_SCAN_COMPLETE is unchanged"
            - "Channel.${ch_p}.monetization_status == MONETIZATION_APPROVED and monetization_posture == OPEN are unchanged"
            - "the claim axis moved without moving the upload or channel axes"

      - name: claim_dispute_appeal_cycle_with_bounded_rounds
        grounds:
          - state_machines.Claim.DISPUTED_to_APPEALED
          - state_machines.Claim.APPEALED_to_DISPUTED
          - state_machines.Claim.APPEALED_to_REINSTATED
          - state_machines.Claim.REINSTATED_to_APPEALED
          - validations[priority=7]
        distinguishing_aspect: "The claim ladder revisits DISPUTED twice (DISPUTED→APPEALED→DENIED→DISPUTED→APPEALED→TAKEN_DOWN) and the REINSTATED→APPEALED edge loops the same state, which is a cyclic machine rather than a forward-only pipeline."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Channel US approved with an ACTIVE claim on its item; clock still at the window open instant."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/channels"
              payload: { channel_name: "Cycle US", country_code: "US", lifetime_watch_hours: 8000, subscriber_count: 1500, tax_tin_status: "TIN_PROVIDED", payment_threshold_cents: 100 }
              as: Anonymous
              captures: { ch_k: $.data.id }
            - call: "POST /api/reference-files"
              payload: { rights_holder_name: "Cycle Rights", asset_kind: "AUDIO", reference_fingerprint: "fp-cycle-1", policy_mode: "MONETIZE", claimed_segment_seconds: 90 }
              as: RightsHolder
              as_user_id: "rh-cycle-1"
              captures: { rf_k: $.data.id }
            - call: "POST /api/channels/${ch_k}/content-items"
              payload: { title: "Cycle Source", duration_seconds: 800, category_code: "MUSIC" }
              as: Creator
              as_user_id: "${ch_k}"
              captures: { i_k: $.data.id }
            - call: "POST /api/channels/${ch_k}/content-items/${i_k}/requests-review"
              payload: {}
              as: Creator
              as_user_id: "${ch_k}"
            - call: "GET /api/claims"
              payload: { content_item_id: "${i_k}" }
              as: Any
              captures: { "cl_k": "$.data[0].id", "cl_kv1": "$.data[0].version" }
            - call: "POST /api/claims/${cl_k}/dispute"
              payload: { expected_claim_version: "${cl_kv1}", reason_code: "LICENSED" }
              as: Creator
              as_user_id: "${ch_k}"
            - call: "POST /api/claims/${cl_k}/appeals"
              payload: { grounds_code: "REVIEW_ERROR" }
              as: RightsHolder
              as_user_id: "${rf_k}"
              captures: { ap_k1: $.data.id }
            - call: "POST /api/claims/${cl_k}/appeals/${ap_k1}/decide"
              payload: { decision: "DENY" }
              as: RightsHolder
              as_user_id: "${rf_k}"
          trigger:
            - call: "POST /api/claims/${cl_k}/appeals"
              payload: { grounds_code: "NEW_EVIDENCE" }
              as: RightsHolder
              as_user_id: "${rf_k}"
              captures: { ap_k2: $.data.id }
            - call: "POST /api/claims/${cl_k}/takedown"
              payload: {}
              as: RightsHolder
              as_user_id: "${rf_k}"
          assert:
            - "Claim.${cl_k}.status == TAKEN_DOWN after the second appeal round"
            - "Claim.${cl_k}.appeal_attempts == 2"
            - "Claim.${cl_k}.taken_down_at is non-null"
            - "the DISPUTED state was entered twice, which a forward-only ladder could not reach"
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: claim_creation_locks_item_revenue_three_hops
        grounds:
          - state_machines.Channel.MONETIZATION_PENDING_to_MONETIZATION_APPROVED
          - state_machines.ContentItem.CLASSIFIED_to_CLAIM_SCAN_COMPLETE
          - calculations.royalty_share_split
        distinguishing_aspect: "A monetization review on the Channel mutates the ContentItem (settlement to CLAIM_SCAN_COMPLETE), and that mutation in turn creates a Claim whose existence is what forces the third hop — the item's already-paid revenue flipping to RETROACTIVE_OWED — so each hop is caused by the previous one across Channel -> ContentItem -> RevenueRouting."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Channel US with a pending monetization application, one item of 10000 gross already routed as AD (creator_share 5500, partner_share 4500, status PAID_CREATOR), and a reference file whose fingerprint matches the item at confidence 0.900."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/channels"
              payload: { channel_name: "Cascade US", country_code: "US", lifetime_watch_hours: 8000, subscriber_count: 1500, tax_tin_status: "TIN_PROVIDED", payment_threshold_cents: 100 }
              as: Anonymous
              captures: { ch_t: $.data.id }
            - call: "POST /api/channels/${ch_t}/content-items"
              payload: { title: "Cascade Source", duration_seconds: 900, category_code: "MUSIC" }
              as: Creator
              as_user_id: "${ch_t}"
              captures: { i_t: $.data.id }
            - call: "POST /api/channels/${ch_t}/content-items/${i_t}/requests-review"
              payload: {}
              as: Creator
              as_user_id: "${ch_t}"
            - call: "GET /api/content-items/${i_t}"
              payload: {}
              as: Any
              captures: { i_tv1: $.data.version }
            - call: "POST /api/revenue-routings"
              payload: { content_item_id: "${i_t}", stream_type: "AD", gross_revenue_cents: 10000, expected_content_item_version: "${i_tv1}" }
              as: PlatformAdmin
              captures: { r_t: $.data.id }
            - call: "POST /api/reference-files"
              payload: { rights_holder_name: "Cascade Rights", asset_kind: "AUDIO", reference_fingerprint: "fp-cascade-1", policy_mode: "MONETIZE", claimed_segment_seconds: 90 }
              as: RightsHolder
              as_user_id: "rh-cascade-1"
              captures: { rf_t: $.data.id }
            - call: "POST /api/channels/${ch_t}/monetization-applications"
              payload: {}
              as: Creator
              as_user_id: "${ch_t}"
          trigger:
            - call: "POST /api/channels/${ch_t}/monetization-review"
              payload: { decision: "APPROVE" }
              as: MonetizationReviewer
          assert:
            - "hop 1: ContentItem.${i_t}.upload_status == CLAIM_SCAN_COMPLETE (settled by the review)"
