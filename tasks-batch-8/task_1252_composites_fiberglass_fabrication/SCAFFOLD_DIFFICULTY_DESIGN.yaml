            - { call: "POST /work-orders", payload: { work_order_no: "WO-K1", part_number: "PN-100", mold_id: "${mold_id}", ply_book_id: "${pb_id}", quantity: 1, due_date: "2026-07-01T00:00:00Z" }, as: ShopManager, captures: { wo1: $.data.id } }
            - { call: "POST /work-orders/${wo1}/start-layup", payload: {}, as: Laminator, as_user_id: "op-lam-1" }
            - { call: "POST /resin-batches", payload: { batch_code: "BATCH-K1", resin_system: "POLYESTER", resin_mass_g: 1000, catalyst_mass_g: 20, target_ratio_pct: 2.0, ratio_tolerance_pct: 1.0, nominal_pot_life_minutes: 600 }, as: Laminator, as_user_id: "op-lam-1", captures: { batch_id: $.data.id } }
