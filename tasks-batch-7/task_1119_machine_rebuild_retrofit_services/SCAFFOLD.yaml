# =============================================================================
# Task 1119 — Machine Rebuild & Retrofit Services (machine-tool rebuilder)
# Scaffold seed tables (§1.0–§1.7)
# =============================================================================

scenario: |
  1119. Machine Rebuild & Retrofit Services (machine-tool rebuilder): as-found
  condition assessment & scope, control retrofit vs mechanical rebuild decision,
  spare-part obsolescence & reverse engineering, downtime window & staged
  shipment, geometric accuracy acceptance test, operator training &
  documentation, warranty on rebuilt accuracy, residual value & trade-in

domain_name: machine-rebuild-retrofit
api_prefix: /api

# =============================================================================
# Complexity Profile (§0.1–§0.4) — difficulty: harder-than-expert
# =============================================================================
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: temporal_windowing
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers
  entity_topology: flat            # peer entities joined by FK references; no nesting in URL resource ownership
  state_machine_shape: cyclic      # dominant shape; RebuildProject also carries a parallel commercial dimension
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential             # Part.superseded_by_id -> Part.id (obsolescence chains)
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Customer company name" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum approved quote total; quote approval fails above this", constraints: ">= 0" }
      - { name: region, type: string, source: input, description: "Free-form region label" }

  - name: Machine
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; owning customer" }
      - { name: serial_number, type: string, source: input, description: "OEM serial number; unique across all machines", constraints: "unique" }
      - { name: machine_type, type: enum, source: input, description: "LATHE | MILL | GRINDER" }
      - { name: year_of_manufacture, type: integer, source: input, description: "Four-digit year; used for age in residual valuation", constraints: "1950..2026" }
      - { name: control_generation, type: enum, source: input, description: "LEGACY | MODERN — as-found control system generation" }
      - { name: spindle_hours, type: integer, source: input, description: "Recorded spindle hours", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "REGISTERED -> UNDER_ASSESSMENT -> ASSESSED -> IN_PROJECT -> RETURNED; terminal TRADED_IN" }

  - name: Assessment
    parent: null
    common_fields: true
    fields:
      - { name: machine_id, type: string, source: system, description: "FK -> Machine.id; taken from the creation path" }
      - { name: assessor_id, type: string, source: system, description: "Opaque X-User-ID of the Assessor who created the assessment (not an entity FK)" }
      - { name: positioning_deviation_microns, type: number, source: input, description: "As-found positioning deviation PD", constraints: ">= 0" }
      - { name: spindle_runout_microns, type: number, source: input, description: "As-found spindle runout SR", constraints: ">= 0" }
      - { name: backlash_microns, type: number, source: input, description: "As-found axis backlash BL", constraints: ">= 0" }
      - { name: scope_notes, type: string, source: input, description: "Free-text scope of work" }
      - { name: wear_index, type: number, source: computed, description: "Weighted wear score, see calculations.wear_index; 2 decimals" }
      - { name: recommended_path, type: enum, source: computed, description: "RETROFIT_ONLY | MECHANICAL_REBUILD | FULL_REBUILD — from calculations.recommended_path" }
      - { name: status, type: enum, source: system, description: "DRAFT -> SUBMITTED -> ACCEPTED | RETURNED (-> SUBMITTED resubmit cycle); SUPERSEDED when a newer assessment is created for the machine" }

  - name: RebuildProject
    parent: null
    common_fields: true
    fields:
      - { name: machine_id, type: string, source: system, description: "FK -> Machine.id; machine under rebuild" }
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; denormalized from the machine at project creation" }
      - { name: assessment_id, type: string, source: system, description: "FK -> Assessment.id; the ACCEPTED assessment that scoped this project" }
      - { name: decision, type: enum, source: input, description: "NONE | RETROFIT_ONLY | MECHANICAL_REBUILD | FULL_REBUILD — set by the decision endpoint; NONE until decided", default: "NONE" }
      - { name: decision_reason, type: string, source: input, description: "Mandatory when decision != assessment.recommended_path", default: null }
      - { name: assigned_engineer_id, type: string, source: input, description: "Opaque X-User-ID of the RebuildEngineer who will run the rebuild; set at decision time" }
      - { name: work_status, type: enum, source: system, description: "SCOPED -> DECIDED -> PARTS_SOURCING -> REBUILD_IN_PROGRESS -> AWAITING_ACCEPTANCE -> (REWORK -> AWAITING_ACCEPTANCE cycle | ESCALATED) -> ACCEPTED -> TRAINING_IN_PROGRESS -> HANDOVER_READY -> WARRANTY_ACTIVE -> CLOSED; CANCELLED terminal" }
      - { name: commercial_status, type: enum, source: system, description: "Parallel dimension: QUOTE_DRAFT -> QUOTE_SENT -> APPROVED; QUOTE_SENT -> QUOTE_DRAFT revert on quote recompute" }
      - { name: quote_revision, type: integer, source: system, default: 0, description: "Number of quote computations; 0 means no quote yet" }
      - { name: quote_stale, type: boolean, source: computed, default: false, description: "True when part lines changed after the last quote computation" }
      - { name: base_price_cents, type: integer, source: computed, default: 0, description: "Decision-class base price snapshot from last quote computation" }
      - { name: parts_total_cents, type: integer, source: computed, default: 0, description: "Sum of per-line rounded line totals over non-CANCELLED lines at last quote computation" }
      - { name: labor_cents, type: integer, source: computed, default: 0, description: "Labor charge at last quote computation" }
      - { name: discount_cents, type: integer, source: computed, default: 0, description: "Volume discount at last quote computation" }
      - { name: applied_trade_in_credit_cents, type: integer, source: computed, default: 0, description: "Trade-in credit currently applied to the quote" }
      - { name: quote_price_cents, type: integer, source: computed, default: 0, description: "base + parts_total + labor - discount - applied_trade_in_credit" }
      - { name: rework_count, type: integer, source: system, default: 0, description: "Total FAILED acceptance tests" }
      - { name: consecutive_fail_count, type: integer, source: system, default: 0, description: "Consecutive FAILED acceptance tests; reset on PASS or escalation RETRY" }
      - { name: rework_cost_cents, type: integer, source: computed, default: 0, description: "Accumulated rework surcharge: 5% of quote per FAIL, 10% per escalation RETRY" }
      - { name: escalation_count, type: integer, source: system, default: 0, description: "Number of escalation RETRY resolutions" }
      - { name: accepted_positioning_microns, type: number, source: computed, description: "max_abs_sample_microns of the PASSED acceptance test; null until PASS", default: null }
      - { name: delivery_date, type: datetime, source: system, description: "Logical clock at delivery; null until delivered", default: null }
      - { name: warranty_months, type: integer, source: computed, description: "6 (RETROFIT_ONLY) | 12 (MECHANICAL_REBUILD) | 24 (FULL_REBUILD)" }
      - { name: warranty_end, type: datetime, source: computed, description: "delivery_date + warranty_months; null until delivered", default: null }

  - name: Part
    parent: null
    common_fields: true
    fields:
      - { name: part_number, type: string, source: input, description: "OEM part number; unique", constraints: "unique" }
      - { name: description, type: string, source: input, description: "Human description" }
      - { name: oem_status, type: enum, source: input, description: "ACTIVE | OBSOLETE | SUPERSEDED — OBSOLETE parts require reverse engineering; SUPERSEDED parts cannot be added to projects" }
      - { name: superseded_by_id, type: string, source: input, description: "FK -> Part.id; replacement part when oem_status=SUPERSEDED; null otherwise", default: null }
      - { name: unit_cost_cents, type: integer, source: input, description: "Current unit cost", constraints: "> 0" }
      - { name: stock_quantity, type: integer, source: input, description: "Physical units on shelf", constraints: ">= 0" }
      - { name: available_quantity, type: integer, source: computed, description: "stock_quantity - reserved_quantity" }
      - { name: reserved_quantity, type: integer, source: computed, default: 0, description: "Units reserved by non-cancelled RESERVED part lines" }
      - { name: lead_time_days, type: integer, source: input, description: "Procurement lead time", constraints: ">= 0" }

  - name: ProjectPartLine
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> RebuildProject.id; taken from the creation path" }
      - { name: part_id, type: string, source: input, description: "FK -> Part.id" }
      - { name: quantity, type: integer, source: input, description: "Units required", constraints: "> 0" }
      - { name: unit_price_cents, type: integer, source: computed, description: "Snapshot of Part.unit_cost_cents at line creation" }
      - { name: obs_multiplier, type: number, source: computed, description: "1.8 if part OBSOLETE at line creation else 1.0" }
      - { name: line_total_cents, type: integer, source: computed, description: "round_half_up(quantity * unit_price_cents * obs_multiplier) — per-line rounding pinned here" }
      - { name: status, type: enum, source: system, description: "PENDING -> RESERVED -> FULFILLED | PENDING -> RE_PENDING -> RE_FULFILLED; CANCELLED terminal" }

  - name: ReverseEngineeringJob
    parent: null
    common_fields: true
    fields:
      - { name: part_line_id, type: string, source: system, description: "FK -> ProjectPartLine.id; the line this job fulfills" }
      - { name: project_id, type: string, source: system, description: "FK -> RebuildProject.id; denormalized from the line" }
      - { name: part_id, type: string, source: system, description: "FK -> Part.id; denormalized from the line" }
      - { name: revision_count, type: integer, source: system, default: 0, description: "Number of FAIL->SPEC_CAPTURED cycles" }
      - { name: re_cost_cents, type: integer, source: input, description: "Actual reverse-engineering cost recorded at fabrication", constraints: ">= 0" }
      - { name: fabricated_by_id, type: string, source: system, description: "Opaque X-User-ID of the RebuildEngineer who fabricated the prototype" }
      - { name: validated_by_id, type: string, source: system, description: "Opaque X-User-ID of the QualityInspector who validated; null until VALIDATED", default: null }
      - { name: status, type: enum, source: system, description: "REQUESTED -> SPEC_CAPTURED -> PROTOTYPE_FABRICATED -> VALIDATED; PROTOTYPE_FABRICATED -> SPEC_CAPTURED fail cycle; CANCELLED terminal" }

  - name: DowntimeWindow
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; whose production downtime this is" }
      - { name: starts_at, type: datetime, source: input, description: "Window start (inclusive)" }
      - { name: ends_at, type: datetime, source: input, description: "Window end (exclusive) — half-open semantics; must be strictly after starts_at" }
      - { name: status, type: enum, source: system, description: "OPEN -> LOCKED (auto on first referencing stage) -> CLOSED (system sweep when clock > ends_at); OPEN -> CANCELLED" }

  - name: ShipmentStage
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> RebuildProject.id; taken from the creation path" }
      - { name: window_id, type: string, source: input, description: "FK -> DowntimeWindow.id; window this stage must tile inside" }
      - { name: stage_sequence, type: integer, source: input, description: "Order of the staged shipment within the project", constraints: "> 0" }
      - { name: planned_ship_date, type: datetime, source: input, description: "Planned ship instant (inclusive lower bound of the stage interval)" }
      - { name: planned_return_date, type: datetime, source: input, description: "Planned return-to-service instant (inclusive upper bound of the stage interval)" }
      - { name: status, type: enum, source: system, description: "PLANNED -> SHIPPED -> RECEIVED -> INSTALLED; PLANNED -> ON_HOLD (project rework cascade) -> PLANNED via replan; PLANNED -> CANCELLED" }

  - name: AcceptanceTest
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> RebuildProject.id; taken from the creation path" }
      - { name: inspector_id, type: string, source: system, description: "Opaque X-User-ID of the QualityInspector who created the test" }
      - { name: attempt_number, type: integer, source: computed, description: "1 + count of prior tests for this project" }
      - { name: samples_microns, type: array, source: input, description: "Exactly 5 positioning deviation samples (signed microns)", constraints: "length == 5" }
      - { name: repeatability_microns, type: number, source: input, description: "Measured repeatability", constraints: ">= 0" }
      - { name: evaluation_variant, type: enum, source: computed, description: "WORST_CASE when project.decision == FULL_REBUILD else ISO_STATISTICAL" }
      - { name: max_abs_sample_microns, type: number, source: computed, description: "max(|samples|), 2 decimals" }
      - { name: statistic_value, type: number, source: computed, description: "WORST_CASE: max_abs_sample_microns; ISO_STATISTICAL: |mean| + 2*population_stddev, 2 decimals" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> PASSED | FAILED on record; terminal PASSED/FAILED" }

  - name: TrainingRecord
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> RebuildProject.id; auto-created when the project reaches ACCEPTED" }
      - { name: trainer_id, type: string, source: system, description: "Opaque X-User-ID of the assigned Trainer; set at begin-training" }
      - { name: sessions_required, type: integer, source: computed, description: "1 (RETROFIT_ONLY) | 2 (MECHANICAL_REBUILD) | 3 (FULL_REBUILD)" }
      - { name: sessions_completed, type: integer, source: system, default: 0, description: "Logged training sessions" }
      - { name: documentation_delivered, type: boolean, source: system, default: false, description: "Operator documentation handed over" }
      - { name: status, type: enum, source: system, description: "PLANNED -> IN_PROGRESS (first session logged) -> COMPLETED (sessions_completed >= sessions_required AND documentation_delivered)" }

  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> RebuildProject.id; taken from the creation path" }
      - { name: claim_type, type: enum, source: input, description: "ACCURACY_DRIFT | MECHANICAL_DEFECT" }
      - { name: measured_positioning_microns, type: number, source: input, description: "Current measured positioning deviation; required for ACCURACY_DRIFT", constraints: ">= 0" }
      - { name: drift_microns, type: number, source: computed, description: "measured_positioning_microns - project.accepted_positioning_microns; null for MECHANICAL_DEFECT" }
      - { name: filed_at, type: datetime, source: system, description: "Logical clock at filing" }
      - { name: resolution_notes, type: string, source: input, description: "Notes at approve/reject/remediate", default: null }
      - { name: status, type: enum, source: system, description: "FILED -> APPROVED | REJECTED; APPROVED -> CLOSED via remediate" }

  - name: TradeInOffer
    parent: null
    common_fields: true
    fields:
      - { name: machine_id, type: string, source: system, description: "FK -> Machine.id; taken from the creation path; any machine of the customer, not necessarily a project machine" }
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; denormalized from the machine" }
      - { name: valuation_variant, type: enum, source: input, description: "MARKET_COMPARABLE | COST_APPROACH — pinned at creation; selects which computed value becomes residual_value_cents" }
      - { name: market_value_cents, type: integer, source: computed, description: "MARKET_COMPARABLE valuation (always computed and stored)" }
      - { name: cost_value_cents, type: integer, source: computed, description: "COST_APPROACH valuation (always computed and stored)" }
      - { name: residual_value_cents, type: integer, source: computed, description: "= market_value_cents when variant MARKET_COMPARABLE else cost_value_cents" }
      - { name: expires_at, type: datetime, source: computed, description: "created_at + 30 days (logical clock)" }
      - { name: applied_project_id, type: string, source: system, description: "FK -> RebuildProject.id; set when the credit is applied to a project; null otherwise", default: null }
      - { name: status, type: enum, source: system, description: "OFFERED -> ACCEPTED | DECLINED | SUPERSEDED (newer offer created) | EXPIRED (lazy on accept when clock > expires_at)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Machine
    initial_state: REGISTERED
    terminal_states: [RETURNED, TRADED_IN]
    transitions:
      - from: REGISTERED
        to: UNDER_ASSESSMENT
        trigger: "system (first Assessment created for the machine via POST /api/machines/{id}/assessments)"
        actor: system
        preconditions: []
        side_effects: ["Machine.version incremented by the assessment-creation write"]
      - from: UNDER_ASSESSMENT
        to: ASSESSED
        trigger: "system (an Assessment for this machine is ACCEPTED via POST /api/assessments/{id}/accept)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ASSESSED
        to: IN_PROJECT
        trigger: "system (RebuildProject for this machine enters PARTS_SOURCING via POST /api/projects/{id}/begin-sourcing)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_PROJECT
        to: RETURNED
        trigger: "system (RebuildProject delivered via POST /api/projects/{id}/deliver)"
        actor: system
        preconditions: []
        side_effects: []
      - from: REGISTERED
        to: TRADED_IN
        trigger: "system (a TradeInOffer for this machine is ACCEPTED via POST /api/trade-in-offers/{id}/accept)"
        actor: system
        preconditions: []
        side_effects:
          - "Cascade link 1: Machine -> TRADED_IN (caused by offer acceptance)"
          - "Cascade link 2: any RebuildProject with machine_id == this machine and work_status in {SCOPED, DECIDED, PARTS_SOURCING} -> CANCELLED (caused by this machine becoming TRADED_IN)"
          - "Cascade link 3: each such cancelled project's ProjectPartLine in {PENDING, RESERVED, RE_PENDING} -> CANCELLED; for RESERVED lines Part.reserved_quantity -= quantity (stock released); ReverseEngineeringJobs of RE_PENDING lines -> CANCELLED (caused by the project cancellation)"

  - entity: Assessment
    initial_state: DRAFT
    terminal_states: [ACCEPTED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/assessments/{id}/submit"
        actor: Assessor
        preconditions: ["X-User-ID == assessment.assessor_id"]
        side_effects: []
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /api/assessments/{id}/submit (resubmit cycle)"
        actor: Assessor
        preconditions: ["X-User-ID == assessment.assessor_id"]
        side_effects: []
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /api/assessments/{id}/accept"
        actor: ProjectManager
        preconditions: ["machine.status == UNDER_ASSESSMENT"]
        side_effects:
          - "Machine -> ASSESSED"
          - "RebuildProject auto-created: work_status=SCOPED, commercial_status=QUOTE_DRAFT, decision=NONE, assessment/machine/customer linked"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /api/assessments/{id}/return"
        actor: ProjectManager
        preconditions: []
        side_effects: []
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system (a newer Assessment is created for the same machine)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "system (a newer Assessment is created for the same machine)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RETURNED
        to: SUPERSEDED
        trigger: "system (a newer Assessment is created for the same machine)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: RebuildProject
    initial_state: SCOPED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      # --- work_status dimension ---
      - from: SCOPED
        to: DECIDED
        trigger: "POST /api/projects/{id}/decision"
        actor: ProjectManager
        preconditions:
          - "decision in {RETROFIT_ONLY, MECHANICAL_REBUILD, FULL_REBUILD}"
          - "decision == assessment.recommended_path OR decision_reason is non-empty (else ERR_DECISION_OVERRIDE_NEEDS_REASON)"
        side_effects: ["warranty_months and sessions-required class become determined by decision"]
      - from: DECIDED
        to: PARTS_SOURCING
        trigger: "POST /api/projects/{id}/begin-sourcing"
        actor: ProjectManager
        preconditions:
          - "commercial_status == APPROVED (else ERR_COMMERCIAL_NOT_APPROVED)"
          - "at least one ProjectPartLine exists (else ERR_LINES_OUTSTANDING)"
          - "for every PENDING line on an ACTIVE part: part.available_quantity >= line.quantity, checked in ascending line created_at; first failure aborts with ERR_INSUFFICIENT_STOCK and no reservations are applied"
        side_effects:
          - "Every PENDING line on an ACTIVE part -> RESERVED; Part.reserved_quantity += quantity"
          - "Every PENDING line on an OBSOLETE part -> RE_PENDING; ReverseEngineeringJob auto-created (REQUESTED)"
          - "Machine -> IN_PROJECT"
      - from: PARTS_SOURCING
        to: REBUILD_IN_PROGRESS
        trigger: "POST /api/projects/{id}/start-rebuild"
        actor: ProjectManager
        preconditions:
          - "every ProjectPartLine in {FULFILLED, RE_FULFILLED, CANCELLED} (else ERR_LINES_OUTSTANDING)"
        side_effects: []
      - from: REBUILD_IN_PROGRESS
        to: AWAITING_ACCEPTANCE
        trigger: "POST /api/projects/{id}/declare-ready"
        actor: RebuildEngineer
        preconditions: ["X-User-ID == project.assigned_engineer_id"]
        side_effects: []
      - from: REWORK
        to: AWAITING_ACCEPTANCE
        trigger: "POST /api/projects/{id}/declare-ready (rework cycle)"
        actor: RebuildEngineer
        preconditions: ["X-User-ID == project.assigned_engineer_id"]
        side_effects: []
      - from: AWAITING_ACCEPTANCE
        to: REWORK
        trigger: "system (AcceptanceTest recorded FAILED and consecutive_fail_count + 1 < 3)"
        actor: system
        preconditions: []
        side_effects:
          - "Cascade link 1: consecutive_fail_count += 1, rework_count += 1, rework_cost_cents += round_half_up(quote_price_cents * 0.05)"
          - "Cascade link 2 (caused by the project entering REWORK): every ShipmentStage of this project in PLANNED -> ON_HOLD"
      - from: AWAITING_ACCEPTANCE
        to: ESCALATED
        trigger: "system (AcceptanceTest recorded FAILED and consecutive_fail_count + 1 == 3)"
        actor: system
        preconditions: []
        side_effects:
          - "consecutive_fail_count = 3, rework_count += 1, rework_cost_cents += round_half_up(quote_price_cents * 0.05)"
          - "Cascade link 2 (caused by the project entering ESCALATED): every ShipmentStage of this project in PLANNED -> ON_HOLD"
      - from: ESCALATED
        to: AWAITING_ACCEPTANCE
        trigger: "POST /api/projects/{id}/escalation/resolve with action=RETRY"
        actor: ProjectManager
        preconditions: []
        side_effects:
          - "consecutive_fail_count = 0, escalation_count += 1, rework_cost_cents += round_half_up(quote_price_cents * 0.10)"
      - from: ESCALATED
        to: CANCELLED
        trigger: "POST /api/projects/{id}/escalation/resolve with action=CANCEL"
        actor: ProjectManager
        preconditions: []
        side_effects: ["release stock of RESERVED lines; RE jobs of RE_PENDING lines -> CANCELLED; ShipmentStages in {PLANNED, ON_HOLD} -> CANCELLED"]
      - from: AWAITING_ACCEPTANCE
        to: ACCEPTED
        trigger: "system (AcceptanceTest recorded PASSED)"
        actor: system
        preconditions: []
        side_effects:
          - "consecutive_fail_count = 0; accepted_positioning_microns = test.max_abs_sample_microns"
          - "Bubble-up cascade: TrainingRecord auto-created (PLANNED, sessions_required from decision)"
      - from: ACCEPTED
        to: TRAINING_IN_PROGRESS
        trigger: "POST /api/projects/{id}/begin-training"
        actor: ProjectManager
        preconditions: ["TrainingRecord for this project exists (auto-created at ACCEPTED)"]
        side_effects: ["TrainingRecord.trainer_id = trainer_id input"]
      - from: TRAINING_IN_PROGRESS
        to: HANDOVER_READY
        trigger: "system (TrainingRecord -> COMPLETED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: HANDOVER_READY
        to: WARRANTY_ACTIVE
        trigger: "POST /api/projects/{id}/deliver"
        actor: ProjectManager
        preconditions:
          - "every ShipmentStage of this project in {INSTALLED, CANCELLED} (else ERR_STAGES_NOT_INSTALLED)"
        side_effects:
          - "delivery_date = logical clock; warranty_end = delivery_date + warranty_months"
          - "Machine -> RETURNED"
      - from: WARRANTY_ACTIVE
        to: CLOSED
        trigger: "system (POST /api/_clock/set_current_utc sweep: clock > warranty_end AND no WarrantyClaim of this project in {FILED, APPROVED})"
        actor: system
        preconditions: []
        side_effects: []
      - from: SCOPED
        to: CANCELLED
        trigger: "POST /api/projects/{id}/cancel or system (trade-in cascade)"
        actor: ProjectManager
        preconditions: []
        side_effects: ["release stock of RESERVED lines; RE jobs of RE_PENDING lines -> CANCELLED; ShipmentStages in {PLANNED, ON_HOLD} -> CANCELLED"]
      - from: DECIDED
        to: CANCELLED
        trigger: "POST /api/projects/{id}/cancel or system (trade-in cascade)"
        actor: ProjectManager
        preconditions: []
        side_effects: ["release stock of RESERVED lines; RE jobs of RE_PENDING lines -> CANCELLED; ShipmentStages in {PLANNED, ON_HOLD} -> CANCELLED"]
      - from: PARTS_SOURCING
        to: CANCELLED
        trigger: "POST /api/projects/{id}/cancel or system (trade-in cascade)"
        actor: ProjectManager
        preconditions: []
        side_effects: ["release stock of RESERVED lines; RE jobs of RE_PENDING lines -> CANCELLED; ShipmentStages in {PLANNED, ON_HOLD} -> CANCELLED"]
      # --- commercial_status dimension (parallel; transitions leave work_status untouched) ---
      - from: QUOTE_DRAFT
        to: QUOTE_SENT
        trigger: "POST /api/projects/{id}/quote/send"
        actor: ProjectManager
        preconditions:
          - "quote_revision >= 1 (else ERR_QUOTE_REQUIRED)"
          - "quote_stale == false (else ERR_QUOTE_STALE)"
        side_effects: []
      - from: QUOTE_SENT
        to: APPROVED
        trigger: "POST /api/projects/{id}/quote/approve"
        actor: Customer
        preconditions:
          - "X-User-ID == project.customer_id"
          - "quote_stale == false (else ERR_QUOTE_STALE)"
          - "quote_price_cents <= customer.credit_limit_cents (else ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects: []
      - from: QUOTE_SENT
        to: QUOTE_DRAFT
        trigger: "POST /api/projects/{id}/quote (recompute while QUOTE_SENT — renegotiation revert)"
        actor: ProjectManager
        preconditions: ["work_status == DECIDED"]
        side_effects: ["quote fields recomputed, quote_revision += 1, quote_stale = false, increments RebuildProject.version by 1"]

  - entity: ProjectPartLine
    initial_state: PENDING
    terminal_states: [FULFILLED, RE_FULFILLED, CANCELLED]
    transitions:
      - from: PENDING
        to: RESERVED
        trigger: "system (project begin-sourcing; part.oem_status == ACTIVE)"
        actor: system
        preconditions: ["part.available_quantity >= quantity"]
        side_effects: ["Part.reserved_quantity += quantity"]
      - from: PENDING
        to: RE_PENDING
        trigger: "system (project begin-sourcing; part.oem_status == OBSOLETE)"
        actor: system
        preconditions: []
        side_effects: ["ReverseEngineeringJob auto-created (REQUESTED)"]
      - from: RESERVED
        to: FULFILLED
        trigger: "POST /api/part-lines/{id}/fulfill"
        actor: LogisticsCoordinator
        preconditions: []
        side_effects: ["Part.reserved_quantity -= quantity; Part.stock_quantity -= quantity (invariant available+reserved==stock preserved)"]
      - from: RE_PENDING
        to: RE_FULFILLED
        trigger: "system (ReverseEngineeringJob -> VALIDATED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PENDING
        to: CANCELLED
        trigger: "POST /api/part-lines/{id}/cancel or system (project cancelled / trade-in cascade)"
        actor: ProjectManager
        preconditions: ["project.work_status == DECIDED for the manual endpoint"]
        side_effects: ["project.quote_stale = true"]
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /api/part-lines/{id}/cancel or system (project cancelled / trade-in cascade)"
        actor: ProjectManager
        preconditions: ["project.work_status in {DECIDED, PARTS_SOURCING} for the manual endpoint"]
        side_effects: ["Part.reserved_quantity -= quantity (compensating release)"]

  - entity: ReverseEngineeringJob
    initial_state: REQUESTED
    terminal_states: [VALIDATED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: SPEC_CAPTURED
        trigger: "POST /api/re-jobs/{id}/capture-spec"
        actor: RebuildEngineer
        preconditions: []
        side_effects: []
      - from: SPEC_CAPTURED
        to: PROTOTYPE_FABRICATED
        trigger: "POST /api/re-jobs/{id}/fabricate"
        actor: RebuildEngineer
        preconditions: []
        side_effects: ["fabricated_by_id = X-User-ID; re_cost_cents recorded"]
      - from: PROTOTYPE_FABRICATED
        to: VALIDATED
        trigger: "POST /api/re-jobs/{id}/validate"
        actor: QualityInspector
        preconditions: ["X-User-ID != job.fabricated_by_id (segregation of duties, ERR_SEGREGATION_OF_DUTIES)"]
        side_effects: ["validated_by_id = X-User-ID", "ProjectPartLine -> RE_FULFILLED"]
      - from: PROTOTYPE_FABRICATED
        to: SPEC_CAPTURED
        trigger: "POST /api/re-jobs/{id}/fail (failure cycle)"
        actor: QualityInspector
        preconditions: ["X-User-ID != job.fabricated_by_id (segregation of duties, ERR_SEGREGATION_OF_DUTIES)"]
        side_effects: ["revision_count += 1"]

  - entity: DowntimeWindow
    initial_state: OPEN
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: OPEN
        to: LOCKED
        trigger: "system (first ShipmentStage referencing this window is created)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: CANCELLED
        trigger: "POST /api/downtime-windows/{id}/cancel"
        actor: LogisticsCoordinator
        preconditions: []
        side_effects: []
      - from: OPEN
        to: CLOSED
        trigger: "system (POST /api/_clock/set_current_utc sweep: clock > ends_at)"
        actor: system
        preconditions: []
        side_effects: []
      - from: LOCKED
        to: CLOSED
        trigger: "system (POST /api/_clock/set_current_utc sweep: clock > ends_at)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ShipmentStage
    initial_state: PLANNED
    terminal_states: [INSTALLED, CANCELLED]
    transitions:
      - from: PLANNED
        to: SHIPPED
        trigger: "POST /api/shipment-stages/{id}/ship"
        actor: LogisticsCoordinator
        preconditions: ["project.work_status in {ACCEPTED, TRAINING_IN_PROGRESS, HANDOVER_READY}"]
        side_effects: []
      - from: SHIPPED
        to: RECEIVED
        trigger: "POST /api/shipment-stages/{id}/receive"
        actor: LogisticsCoordinator
        preconditions: []
        side_effects: []
      - from: RECEIVED
        to: INSTALLED
        trigger: "POST /api/shipment-stages/{id}/install"
        actor: LogisticsCoordinator
        preconditions: []
        side_effects: []
      - from: PLANNED
        to: ON_HOLD
        trigger: "system (project entered REWORK or ESCALATED — acceptance-failure cascade link 2)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ON_HOLD
        to: PLANNED
        trigger: "POST /api/shipment-stages/{id}/replan"
        actor: LogisticsCoordinator
        preconditions: ["recomputed interval passes window-containment and 2-day sibling-gap checks"]
        side_effects: []
      - from: PLANNED
        to: CANCELLED
        trigger: "system (project cancelled)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: AcceptanceTest
    initial_state: SCHEDULED
    terminal_states: [PASSED, FAILED]
    transitions:
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /api/acceptance-tests/{id}/record (statistic_value <= TOL_POS and repeatability_microns <= TOL_REP)"
        actor: QualityInspector
        preconditions: ["X-User-ID == test.inspector_id"]
        side_effects: ["project: AWAITING_ACCEPTANCE -> ACCEPTED with bubble-up cascade (TrainingRecord auto-created)"]
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /api/acceptance-tests/{id}/record (statistic_value > TOL_POS or repeatability_microns > TOL_REP)"
        actor: QualityInspector
        preconditions: ["X-User-ID == test.inspector_id"]
        side_effects: ["project: AWAITING_ACCEPTANCE -> REWORK or ESCALATED cascade (see RebuildProject transitions)"]

  - entity: TrainingRecord
    initial_state: PLANNED
    terminal_states: [COMPLETED]
    transitions:
      - from: PLANNED
        to: IN_PROGRESS
        trigger: "POST /api/training-records/{id}/log-session (first session)"
        actor: Trainer
        preconditions: ["X-User-ID == record.trainer_id"]
        side_effects: ["sessions_completed += 1"]
      - from: IN_PROGRESS
        to: IN_PROGRESS
        trigger: "POST /api/training-records/{id}/log-session (further sessions; sessions_completed < sessions_required enforced, else ERR_TRAINING_SESSION_OVERFLOW)"
        actor: Trainer
        preconditions: ["X-User-ID == record.trainer_id", "sessions_completed < sessions_required"]
        side_effects: ["sessions_completed += 1"]
      - from: PLANNED
        to: COMPLETED
        trigger: "system (sessions_completed >= sessions_required AND documentation_delivered becomes true — only reachable when sessions_required == 0, which never occurs; kept for completeness)"
        actor: system
        preconditions: []
        side_effects: ["Bubble-up: project TRAINING_IN_PROGRESS -> HANDOVER_READY"]
        note: "in practice COMPLETED is reached from IN_PROGRESS"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "system (after a log-session or deliver-documentation write leaves sessions_completed >= sessions_required AND documentation_delivered == true)"
        actor: system
        preconditions: []
        side_effects: ["Bubble-up: project TRAINING_IN_PROGRESS -> HANDOVER_READY"]

  - entity: WarrantyClaim
    initial_state: FILED
    terminal_states: [REJECTED, CLOSED]
    transitions:
      - from: FILED
        to: APPROVED
        trigger: "POST /api/warranty-claims/{id}/approve"
        actor: WarrantyAdministrator
        preconditions: []
        side_effects: []
      - from: FILED
        to: REJECTED
        trigger: "POST /api/warranty-claims/{id}/reject"
        actor: WarrantyAdministrator
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: CLOSED
        trigger: "POST /api/warranty-claims/{id}/remediate"
        actor: WarrantyAdministrator
        preconditions: []
        side_effects: []

  - entity: TradeInOffer
    initial_state: OFFERED
    terminal_states: [ACCEPTED, DECLINED, EXPIRED, SUPERSEDED]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /api/trade-in-offers/{id}/accept"
        actor: Customer
        preconditions:
          - "X-User-ID == offer.customer_id"
          - "logical clock <= expires_at (else offer -> EXPIRED and ERR_TRADE_IN_OFFER_EXPIRED)"
        side_effects: ["Trade-in acceptance cascade (see Machine.TRADED_IN cascade links 1-3)"]
      - from: OFFERED
        to: DECLINED
        trigger: "POST /api/trade-in-offers/{id}/decline"
        actor: Customer
        preconditions: ["X-User-ID == offer.customer_id"]
        side_effects: []
      - from: OFFERED
        to: SUPERSEDED
        trigger: "system (a newer TradeInOffer is created for the same machine)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OFFERED
        to: EXPIRED
        trigger: "system (evaluated lazily inside POST /api/trade-in-offers/{id}/accept: when clock > expires_at the offer transitions to EXPIRED and the call fails with ERR_TRADE_IN_OFFER_EXPIRED)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: assessment-create-stale-machine
    parent_entity: Machine
    write_endpoint: "POST /api/machines/{id}/assessments"
    occ_field: expected_machine_version
    description: |
      Creating an Assessment against a Machine whose version has advanced since
      the client last observed it is rejected. Creating an assessment
      legitimately supersedes the machine's prior non-terminal assessment and
      bumps Machine.version, so a second create carrying the previously observed
      version is working from a stale view of the machine.
    error_id: ERR_STALE_MACHINE_VERSION
    http_status: 412
  - rule_id: trade-in-offer-create-stale-machine
    parent_entity: Machine
    write_endpoint: "POST /api/machines/{id}/trade-in-offers"
    occ_field: expected_machine_version
    description: |
      Creating a TradeInOffer against a Machine whose version has advanced since
      the client last observed it is rejected. Creating an offer legitimately
      supersedes the machine's prior OFFERED offer and bumps Machine.version, so
      a second create carrying the previously observed version is stale.
    error_id: ERR_STALE_MACHINE_VERSION
    http_status: 412
  - rule_id: quote-create-stale-project
    parent_entity: RebuildProject
    write_endpoint: "POST /api/projects/{id}/quote"
    occ_field: expected_project_version
    description: |
      Recomputing a quote against a RebuildProject whose version has advanced
      since the client last observed it is rejected. Each recomputation produces
      a new quote revision that legitimately supersedes the prior one and bumps
      RebuildProject.version, so a recompute carrying the previously observed
      version is stale.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: wear_index
    trigger: "assessment creation (POST /api/machines/{id}/assessments)"
    algorithm: weighted_scoring
    formula: |
      raw = 0.5 * (positioning_deviation_microns / 20.0)
          + 0.3 * (spindle_runout_microns / 10.0)
          + 0.2 * (backlash_microns / 15.0)
      clamped = min(raw, 1.5)
      wear_index = round_half_up(clamped * 100, 2)   # range 0.00..150.00
    input_set: "the three as-found measurements on the new Assessment"
    constants:
      PD_REF: 20.0
      SR_REF: 10.0
      BL_REF: 15.0
      W_PD: 0.5
      W_SR: 0.3
      W_BL: 0.2
      CLAMP: 1.5
    precision: "2 decimal places, round_half_up"

  - name: recommended_path
    trigger: "assessment creation, after wear_index is computed"
    algorithm: threshold
    formula: |
      if wear_index >= 80.00: recommended_path = FULL_REBUILD      # boundary inclusive
      else if wear_index >= 40.00: recommended_path = MECHANICAL_REBUILD
      else: recommended_path = RETROFIT_ONLY
    input_set: "Assessment.wear_index"
    constants:
      FULL_THRESHOLD: 80.00
      MECH_THRESHOLD: 40.00

  - name: quote_price_cents
    trigger: "POST /api/projects/{id}/quote (work_status must be DECIDED)"
    algorithm: tiered_pricing
    formula: |
      # EVALUATION ORDER IS PINNED — steps must execute in this sequence:
      # (1) per-line rounding, (2) sum, (3) labor, (4) base, (5) tier discount
      # on the summed subtotal, (6) trade-in credit subtracted last.
      # "Sum-then-round" instead of "round-per-line-then-sum" yields different cents.
      step 1: parts_total_cents = sum over ProjectPartLine of this project with
              status != CANCELLED of line.line_total_cents
              (line_total_cents was fixed at line creation as
               round_half_up(quantity * unit_price_cents * obs_multiplier, 0))
      step 2: labor_hours = BASE_HOURS[decision] + floor(assessment.wear_index)
              labor_cents = labor_hours * LABOR_RATE_CENTS
      step 3: base_price_cents = BASE_PRICE[decision]
      step 4: subtotal = base_price_cents + parts_total_cents + labor_cents
      step 5: if subtotal >= TIER2_MIN: discount_cents = round_half_up(subtotal * 0.05, 0)
              else if subtotal >= TIER1_MIN: discount_cents = round_half_up(subtotal * 0.02, 0)
              else: discount_cents = 0
      step 6: quote_price_cents = subtotal - discount_cents - applied_trade_in_credit_cents
    input_set: "non-CANCELLED ProjectPartLine rows of the project; the ACCEPTED assessment's wear_index; project.decision"
    constants:
      LABOR_RATE_CENTS: 14500
      TIER1_MIN: 50000000
      TIER2_MIN: 100000000
      TIER1_RATE: 0.02
      TIER2_RATE: 0.05
    precision: "integer cents, round_half_up at the two pinned rounding points (per-line, discount)"

  - name: residual_value_cents
    trigger: "trade-in offer creation (POST /api/machines/{id}/trade-in-offers)"
    algorithm: decay_function
    formula: |
      age_years = year(clock_now) - machine.year_of_manufacture   # calendar-year difference
      condition_factor = max(0.25, 1 - wear_index_of_latest_accepted_or_draft_assessment / 200.0)
      # if no assessment exists for the machine, condition_factor = 0.50
      MARKET_COMPARABLE (stored as market_value_cents):
        market_value_cents = round_half_up(MARKET_BASE[machine_type] * (1 - DEPRECIATION)^age_years * condition_factor, 0)
      COST_APPROACH (stored as cost_value_cents):
        remaining_life_fraction = max(0, (25 - age_years) / 25)
        estimated_rebuild_cost_cents = BASE_PRICE[machine's latest assessment recommended_path]
                                       (BASE_PRICE[MECHANICAL_REBUILD] if no assessment exists)
        cost_value_cents = max(SCRAP_FLOOR, round_half_up(REPLACEMENT_COST[machine_type] * remaining_life_fraction - estimated_rebuild_cost_cents, 0))
      residual_value_cents = market_value_cents if valuation_variant == MARKET_COMPARABLE else cost_value_cents
    input_set: "machine type/year; latest assessment (any status) wear_index and recommended_path for condition/cost inputs"
    constants:
      DEPRECIATION: 0.12
      SCRAP_FLOOR: 2000000
    precision: "integer cents, round_half_up"
    variants:
      - name: MARKET_COMPARABLE
        when: "offer created with valuation_variant=MARKET_COMPARABLE"
        difference: "market table base compounded by age depreciation and condition factor"
      - name: COST_APPROACH
        when: "offer created with valuation_variant=COST_APPROACH"
        difference: "replacement cost scaled by remaining life minus estimated rebuild cost, floored at scrap"

  - name: acceptance_evaluation
    trigger: "POST /api/acceptance-tests/{id}/record"
    algorithm: threshold
    formula: |
      max_abs_sample_microns = round_half_up(max(|s| for s in samples_microns), 2)
      variant selected by project.decision:
        WORST_CASE (decision in {RETROFIT_ONLY, MECHANICAL_REBUILD}):
          statistic_value = max_abs_sample_microns
        ISO_STATISTICAL (decision == FULL_REBUILD):
          mean = sum(samples) / 5
          std  = sqrt( sum((s - mean)^2) / 5 )          # population stddev (divide by N=5)
          statistic_value = round_half_up(|mean| + 2 * std, 2)
      PASS iff statistic_value <= TOL_POS AND repeatability_microns <= TOL_REP   # boundaries inclusive
      else FAIL
    input_set: "the test's 5 samples and repeatability; project.decision"
    constants:
      TOL_POS: 20.0
      TOL_REP: 10.0
      N_SAMPLES: 5
    precision: "2 decimal places, round_half_up"
    variants:
      - name: WORST_CASE
        when: "project.decision in {RETROFIT_ONLY, MECHANICAL_REBUILD}"
        difference: "uses max absolute sample; ignores distribution shape"
      - name: ISO_STATISTICAL
        when: "project.decision == FULL_REBUILD"
        difference: "uses |mean| + 2*population_stddev over the 5 samples; stricter for dispersed samples"

  - name: warranty_drift_evaluation
    trigger: "warranty claim filing (POST /api/projects/{id}/warranty-claims) with claim_type=ACCURACY_DRIFT"
    algorithm: threshold
    formula: |
      drift_microns = round_half_up(measured_positioning_microns - project.accepted_positioning_microns, 2)
      claim admissible iff drift_microns > DRIFT_TOL          # strictly greater; 15.0 exactly is rejected
      AND logical clock <= project.warranty_end               # filing at exactly warranty_end is admissible
    input_set: "claim measurement; project.accepted_positioning_microns and warranty_end"
    constants:
      DRIFT_TOL: 15.0
    precision: "2 decimal places, round_half_up"

  - name: warranty_end
    trigger: "POST /api/projects/{id}/deliver"
    algorithm: aggregation
    formula: |
      warranty_months = 6 if decision == RETROFIT_ONLY; 12 if MECHANICAL_REBUILD; 24 if FULL_REBUILD
      warranty_end = delivery_date + warranty_months calendar months (same day-of-month)
    input_set: "project.decision, delivery_date"

  - name: downtime_window_overlap
    trigger: "POST /api/downtime-windows"
    algorithm: interval_merge
    formula: |
      New window [s, e) for customer C is rejected (ERR_WINDOW_OVERLAP) iff there exists
      another window [s2, e2) for C with status in {OPEN, LOCKED} such that s < e2 AND s2 < e.
      Half-open semantics: adjacency (s == e2 or e == s2) is allowed.
      e <= s is rejected (ERR_WINDOW_EMPTY), including zero-length s == e.
    input_set: "windows of the same customer with status in {OPEN, LOCKED}"

  - name: shipment_stage_tiling
    trigger: "POST /api/projects/{id}/shipment-stages and POST /api/shipment-stages/{id}/replan"
    algorithm: interval_merge
    formula: |
      Stage interval [ship, return] uses CLOSED bounds:
        containment: window.starts_at <= planned_ship_date AND planned_return_date <= window.ends_at
          (both boundaries inclusive; else ERR_STAGE_OUTSIDE_WINDOW)
        planned_return_date < planned_ship_date -> ERR_INVALID_REQUEST
      Sibling gap: for every other non-CANCELLED stage B of the same project:
        either planned_ship_date >= B.planned_return_date + MIN_GAP_DAYS days
        or     B.planned_ship_date >= planned_return_date + MIN_GAP_DAYS days
        (gap of exactly MIN_GAP_DAYS days is allowed; one day less -> ERR_STAGE_GAP_TOO_SMALL)
    input_set: "the referenced window; sibling stages of the same project with status != CANCELLED"
    constants:
      MIN_GAP_DAYS: 2

  - name: part_stock_conservation
    trigger: "invariant checked after every reserve / fulfill / cancel / project-cancel transition touching Part"
    algorithm: conservation_law
    formula: |
      INVARIANT: Part.available_quantity + Part.reserved_quantity == Part.stock_quantity
      reserve (PENDING -> RESERVED): reserved += q            (available recomputed down)
      fulfill (RESERVED -> FULFILLED): reserved -= q; stock -= q
      release (RESERVED -> CANCELLED): reserved -= q          (available recomputed up)
      A reserve that would make available_quantity negative is rejected (ERR_INSUFFICIENT_STOCK).

  - name: trade_in_credit_conservation
    trigger: "POST /api/projects/{id}/trade-in/apply and POST /api/projects/{id}/trade-in/revoke"
    algorithm: conservation_law
    formula: |
      INVARIANT: quote_price_cents + applied_trade_in_credit_cents
                 == base_price_cents + parts_total_cents + labor_cents - discount_cents
      apply: applied_trade_in_credit_cents = offer.residual_value_cents; quote_price_cents -= that amount
      revoke: quote_price_cents += applied_trade_in_credit_cents; applied_trade_in_credit_cents = 0
      The pair leaves the gross quote (right-hand side) unchanged.

  - name: rework_surcharge
    trigger: "AcceptanceTest recorded FAILED; escalation resolve RETRY"
    algorithm: aggregation
    formula: |
      on FAIL: rework_cost_cents += round_half_up(quote_price_cents * 0.05, 0)
      on escalation RETRY: rework_cost_cents += round_half_up(quote_price_cents * 0.10, 0)
      quote_price_cents itself is NOT recomputed by rework (surcharge accumulates separately).
    constants:
      FAIL_RATE: 0.05
      ESCALATION_RATE: 0.10
    precision: "integer cents, round_half_up"

  - name: sessions_required
    trigger: "TrainingRecord auto-creation when project reaches ACCEPTED"
    algorithm: threshold
    formula: |
      sessions_required = 1 if decision == RETROFIT_ONLY; 2 if MECHANICAL_REBUILD; 3 if FULL_REBUILD
    input_set: "project.decision"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; role is a declared role name"
    error_id: ERR_MISSING_HEADERS
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "role permitted for the endpoint per §1.5 roles; entity-backed ownership (Customer X-User-ID == resource customer_id; Assessor/QualityInspector/Trainer/RebuildEngineer X-User-ID == the record's assigned opaque id); segregation of duties (acceptance inspector != project.assigned_engineer_id; RE validator != job.fabricated_by_id)"
    error_id: ERR_UNAUTHORIZED_ROLE | ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "request body shape: required fields present, enum members valid, numeric ranges respected (quantity > 0, microns >= 0, samples length == 5)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a body"
  - priority: 4
    category: existence
    check: "path ids exist, validated left-to-right; body-referenced ids (part_id, window_id, offer_id) exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with resource ids"
  - priority: 5
    category: state
    check: "OCC: expected_machine_version == machine.version (assessment/offer creation); expected_project_version == project.version (quote recompute)"
    error_id: ERR_STALE_MACHINE_VERSION | ERR_STALE_PROJECT_VERSION
    http_status: 412
    applies_to: "POST /api/machines/{id}/assessments, POST /api/machines/{id}/trade-in-offers, POST /api/projects/{id}/quote"
  - priority: 6
    category: state
    check: "target entity in the required state for the transition/action (state-machine from-state preconditions)"
    error_id: ERR_INVALID_STATE | ERR_PROJECT_NOT_IN_WARRANTY | ERR_COMMERCIAL_NOT_APPROVED | ERR_QUOTE_REQUIRED | ERR_PROJECT_NOT_AWAITING_ACCEPTANCE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 7
    category: business_referential
    check: "referenced/child entities in compatible state: quote_stale false for send/approve; no SCHEDULED acceptance test open when creating another; part not SUPERSEDED on line add; offer belongs to project's customer and is unapplied on apply; window OPEN or LOCKED on stage create"
    error_id: ERR_QUOTE_STALE | ERR_OPEN_ACCEPTANCE_TEST | ERR_PART_SUPERSEDED | ERR_TRADE_IN_NOT_APPLICABLE | ERR_TRADE_IN_ALREADY_APPLIED
    http_status: 409
    applies_to: "quote send/approve, acceptance-test create, part-line add, trade-in apply, stage create"
  - priority: 8
    category: business_temporal
    check: "clock-driven admissibility: claim filing clock <= warranty_end; offer acceptance clock <= expires_at; window ends_at > starts_at"
    error_id: ERR_WARRANTY_EXPIRED | ERR_TRADE_IN_OFFER_EXPIRED | ERR_WINDOW_EMPTY
    http_status: 409
    applies_to: "warranty-claim create, trade-in accept, downtime-window create"
  - priority: 9
    category: business_constraint
    check: "structural constraints: window overlap, stage containment + 2-day sibling gap, one open claim per project, accuracy drift within tolerance on ACCURACY_DRIFT filings (after the temporal gate), stages installed before deliver, training complete before handover bubble-up, decision/recommendation override justification, session log overflow"
    error_id: ERR_WINDOW_OVERLAP | ERR_STAGE_OUTSIDE_WINDOW | ERR_STAGE_GAP_TOO_SMALL | ERR_CLAIM_ALREADY_OPEN | ERR_DRIFT_WITHIN_TOLERANCE | ERR_STAGES_NOT_INSTALLED | ERR_DECISION_OVERRIDE_NEEDS_REASON | ERR_TRAINING_SESSION_OVERFLOW
    http_status: 409
    applies_to: "window create, stage create/replan, claim create, deliver, decision, log-session"
  - priority: 10
    category: business_fiscal
    check: "stock and money: part available_quantity sufficient at begin-sourcing; quote_price_cents within customer credit limit at approve"
    error_id: ERR_INSUFFICIENT_STOCK | ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "begin-sourcing, quote approve"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Customer ---
  - { method: POST, path: "/api/customers", description: "Create a customer", roles: [PlatformAdmin], code: 201, input: [name, credit_limit_cents, "region?"], output: Customer, side_effects: [] }
  - { method: GET, path: "/api/customers/{id}", description: "Get a customer", roles: [PlatformAdmin, ProjectManager, Customer], code: 200, input: [], output: Customer, side_effects: [] }

  # --- Machine ---
  - { method: POST, path: "/api/machines", description: "Register an as-found machine", roles: [Customer, PlatformAdmin], code: 201, input: [customer_id, serial_number, machine_type, year_of_manufacture, control_generation, spindle_hours], output: Machine, side_effects: ["status=REGISTERED"] }
  - { method: GET, path: "/api/machines/{id}", description: "Get a machine", roles: [Customer, PlatformAdmin, ProjectManager, Assessor], code: 200, input: [], output: Machine, side_effects: [] }
  - { method: GET, path: "/api/machines", description: "List machines, optional customer filter", roles: [Customer, PlatformAdmin, ProjectManager, Assessor], code: 200, input: ["customer_id?", "limit?", "offset?"], output: "Machine[]", side_effects: [] }

  # --- Assessment ---
  - { method: POST, path: "/api/machines/{id}/assessments", description: "Create an as-found assessment (supersedes the machine's prior non-terminal assessment; OCC on Machine.version)", roles: [Assessor], code: 201, input: [positioning_deviation_microns, spindle_runout_microns, backlash_microns, scope_notes, expected_machine_version], output: Assessment, side_effects: ["wear_index and recommended_path computed", "assessor_id = X-User-ID", "prior assessment in {DRAFT, SUBMITTED, RETURNED} -> SUPERSEDED", "machine REGISTERED -> UNDER_ASSESSMENT (first assessment only)", "increments Machine.version by 1"] }
  - { method: GET, path: "/api/assessments/{id}", description: "Get an assessment", roles: [Assessor, ProjectManager, PlatformAdmin, Customer], code: 200, input: [], output: Assessment, side_effects: [] }
  - { method: GET, path: "/api/assessments", description: "List assessments, optional machine filter", roles: [Assessor, ProjectManager, PlatformAdmin, Customer], code: 200, input: ["machine_id?", "limit?", "offset?"], output: "Assessment[]", side_effects: [] }
  - { method: POST, path: "/api/assessments/{id}/submit", description: "Submit (or resubmit from RETURNED) an assessment", roles: [Assessor], code: 200, input: [], output: Assessment, side_effects: ["status -> SUBMITTED"] }
  - { method: POST, path: "/api/assessments/{id}/return", description: "Return a submitted assessment for rework", roles: [ProjectManager], code: 200, input: [], output: Assessment, side_effects: ["status -> RETURNED"] }
  - { method: POST, path: "/api/assessments/{id}/accept", description: "Accept a submitted assessment; auto-creates the RebuildProject", roles: [ProjectManager], code: 200, input: [], output: Assessment, side_effects: ["status -> ACCEPTED", "machine -> ASSESSED", "RebuildProject created (SCOPED / QUOTE_DRAFT)"] }

  # --- RebuildProject ---
  - { method: GET, path: "/api/projects/{id}", description: "Get a project", roles: [ProjectManager, Customer, PlatformAdmin, RebuildEngineer, QualityInspector], code: 200, input: [], output: RebuildProject, side_effects: [] }
  - { method: GET, path: "/api/projects", description: "List projects with optional filters", roles: [ProjectManager, Customer, PlatformAdmin], code: 200, input: ["machine_id?", "customer_id?", "assessment_id?", "limit?", "offset?"], output: "RebuildProject[]", side_effects: [] }
  - { method: POST, path: "/api/projects/{id}/decision", description: "Record the control-retrofit vs mechanical-rebuild decision and assign the rebuild engineer", roles: [ProjectManager], code: 200, input: [decision, assigned_engineer_id, "decision_reason?"], output: RebuildProject, side_effects: ["work_status SCOPED -> DECIDED"] }
  - { method: POST, path: "/api/projects/{id}/quote", description: "Compute/recompute the quote revision (OCC on RebuildProject.version; reverts QUOTE_SENT -> QUOTE_DRAFT)", roles: [ProjectManager], code: 200, input: [expected_project_version], output: RebuildProject, side_effects: ["quote fields recomputed per calculations.quote_price_cents", "quote_revision += 1", "quote_stale = false", "increments RebuildProject.version by 1"] }
  - { method: POST, path: "/api/projects/{id}/quote/send", description: "Send the quote to the customer", roles: [ProjectManager], code: 200, input: [], output: RebuildProject, side_effects: ["commercial QUOTE_DRAFT -> QUOTE_SENT"] }
  - { method: POST, path: "/api/projects/{id}/quote/approve", description: "Customer approves the sent quote", roles: [Customer], code: 200, input: [], output: RebuildProject, side_effects: ["commercial QUOTE_SENT -> APPROVED"] }
  - { method: POST, path: "/api/projects/{id}/begin-sourcing", description: "Open parts sourcing: reserve stock for ACTIVE parts, spawn RE jobs for OBSOLETE parts", roles: [ProjectManager], code: 200, input: [], output: RebuildProject, side_effects: ["work_status DECIDED -> PARTS_SOURCING", "PENDING lines -> RESERVED (stock reserved) or RE_PENDING (RE job REQUESTED)", "machine -> IN_PROJECT"] }
  - { method: POST, path: "/api/projects/{id}/part-lines", description: "Add a part line to a DECIDED project", roles: [ProjectManager], code: 201, input: [part_id, quantity], output: ProjectPartLine, side_effects: ["line PENDING", "unit_price_cents / obs_multiplier / line_total_cents snapshotted", "project.quote_stale = true if quote_revision >= 1"] }
  - { method: POST, path: "/api/projects/{id}/start-rebuild", description: "Start mechanical/control work once all lines are fulfilled", roles: [ProjectManager], code: 200, input: [], output: RebuildProject, side_effects: ["work_status PARTS_SOURCING -> REBUILD_IN_PROGRESS"] }
  - { method: POST, path: "/api/projects/{id}/declare-ready", description: "Assigned rebuild engineer declares the machine ready for acceptance testing (from REBUILD_IN_PROGRESS or REWORK)", roles: [RebuildEngineer], code: 200, input: [], output: RebuildProject, side_effects: ["work_status -> AWAITING_ACCEPTANCE"] }
  - { method: POST, path: "/api/projects/{id}/acceptance-tests", description: "Schedule a geometric accuracy acceptance test", roles: [QualityInspector], code: 201, input: [], output: AcceptanceTest, side_effects: ["test SCHEDULED", "inspector_id = X-User-ID", "attempt_number computed"] }
  - { method: POST, path: "/api/projects/{id}/escalation/resolve", description: "Resolve an ESCALATED project: RETRY (penalty, reset consecutive failures) or CANCEL", roles: [ProjectManager], code: 200, input: [action], output: RebuildProject, side_effects: ["RETRY: ESCALATED -> AWAITING_ACCEPTANCE, rework surcharge 10%", "CANCEL: -> CANCELLED with stock release"] }
  - { method: POST, path: "/api/projects/{id}/begin-training", description: "Assign trainer and begin operator training", roles: [ProjectManager], code: 200, input: [trainer_id], output: TrainingRecord, side_effects: ["work_status ACCEPTED -> TRAINING_IN_PROGRESS", "TrainingRecord.trainer_id set"] }
  - { method: POST, path: "/api/projects/{id}/shipment-stages", description: "Plan a staged shipment inside a downtime window", roles: [LogisticsCoordinator], code: 201, input: [window_id, stage_sequence, planned_ship_date, planned_return_date], output: ShipmentStage, side_effects: ["stage PLANNED", "window OPEN -> LOCKED on first referencing stage"] }
  - { method: POST, path: "/api/projects/{id}/deliver", description: "Deliver into warranty once stages are installed and training complete", roles: [ProjectManager], code: 200, input: [], output: RebuildProject, side_effects: ["HANDOVER_READY -> WARRANTY_ACTIVE", "delivery_date, warranty_end set", "machine -> RETURNED"] }
  - { method: POST, path: "/api/projects/{id}/cancel", description: "Cancel an early-stage project (SCOPED/DECIDED/PARTS_SOURCING)", roles: [ProjectManager], code: 200, input: [], output: RebuildProject, side_effects: ["work_status -> CANCELLED", "RESERVED lines released; RE jobs of RE_PENDING lines CANCELLED"] }
  - { method: POST, path: "/api/projects/{id}/trade-in/apply", description: "Apply an ACCEPTED trade-in offer's credit to the quote", roles: [ProjectManager], code: 200, input: [offer_id], output: RebuildProject, side_effects: ["applied_trade_in_credit_cents = offer.residual_value_cents", "quote_price_cents reduced accordingly", "offer.applied_project_id set"] }
  - { method: POST, path: "/api/projects/{id}/trade-in/revoke", description: "Revoke an applied trade-in credit before quote approval", roles: [ProjectManager], code: 200, input: [], output: RebuildProject, side_effects: ["quote_price_cents restored", "applied_trade_in_credit_cents = 0", "offer.applied_project_id cleared"] }

  # --- ProjectPartLine ---
  - { method: GET, path: "/api/part-lines/{id}", description: "Get a part line", roles: [ProjectManager, LogisticsCoordinator, PlatformAdmin], code: 200, input: [], output: ProjectPartLine, side_effects: [] }
  - { method: GET, path: "/api/part-lines", description: "List part lines with optional filters", roles: [ProjectManager, LogisticsCoordinator, PlatformAdmin], code: 200, input: ["project_id?", "part_id?", "limit?", "offset?"], output: "ProjectPartLine[]", side_effects: [] }
  - { method: POST, path: "/api/part-lines/{id}/fulfill", description: "Issue reserved stock to the project", roles: [LogisticsCoordinator], code: 200, input: [], output: ProjectPartLine, side_effects: ["RESERVED -> FULFILLED", "Part.reserved_quantity -= q; Part.stock_quantity -= q"] }
  - { method: POST, path: "/api/part-lines/{id}/cancel", description: "Cancel a PENDING or RESERVED line (releases reservation)", roles: [ProjectManager], code: 200, input: [], output: ProjectPartLine, side_effects: ["-> CANCELLED", "RESERVED lines: Part.reserved_quantity -= q"] }

  # --- ReverseEngineeringJob ---
  - { method: GET, path: "/api/re-jobs/{id}", description: "Get an RE job", roles: [RebuildEngineer, QualityInspector, ProjectManager, PlatformAdmin], code: 200, input: [], output: ReverseEngineeringJob, side_effects: [] }
  - { method: GET, path: "/api/re-jobs", description: "List RE jobs with optional filters", roles: [RebuildEngineer, QualityInspector, ProjectManager, PlatformAdmin], code: 200, input: ["part_line_id?", "project_id?", "part_id?", "limit?", "offset?"], output: "ReverseEngineeringJob[]", side_effects: [] }
  - { method: POST, path: "/api/re-jobs/{id}/capture-spec", description: "Capture the reverse-engineering specification", roles: [RebuildEngineer], code: 200, input: [], output: ReverseEngineeringJob, side_effects: ["REQUESTED -> SPEC_CAPTURED"] }
  - { method: POST, path: "/api/re-jobs/{id}/fabricate", description: "Fabricate the prototype part", roles: [RebuildEngineer], code: 200, input: [re_cost_cents], output: ReverseEngineeringJob, side_effects: ["SPEC_CAPTURED -> PROTOTYPE_FABRICATED", "fabricated_by_id = X-User-ID"] }
  - { method: POST, path: "/api/re-jobs/{id}/validate", description: "Quality validation of the prototype (segregated from fabricator)", roles: [QualityInspector], code: 200, input: [], output: ReverseEngineeringJob, side_effects: ["-> VALIDATED", "part line -> RE_FULFILLED"] }
  - { method: POST, path: "/api/re-jobs/{id}/fail", description: "Fail the prototype; job cycles back to SPEC_CAPTURED", roles: [QualityInspector], code: 200, input: [], output: ReverseEngineeringJob, side_effects: ["-> SPEC_CAPTURED", "revision_count += 1"] }

  # --- AcceptanceTest ---
  - { method: GET, path: "/api/acceptance-tests/{id}", description: "Get an acceptance test", roles: [QualityInspector, ProjectManager, Customer, PlatformAdmin], code: 200, input: [], output: AcceptanceTest, side_effects: [] }
  - { method: GET, path: "/api/acceptance-tests", description: "List acceptance tests with optional project filter", roles: [QualityInspector, ProjectManager, Customer, PlatformAdmin], code: 200, input: ["project_id?", "limit?", "offset?"], output: "AcceptanceTest[]", side_effects: [] }
  - { method: POST, path: "/api/acceptance-tests/{id}/record", description: "Record measurements; computes statistic and PASS/FAIL, fires project cascade", roles: [QualityInspector], code: 200, input: [samples_microns, repeatability_microns], output: AcceptanceTest, side_effects: ["statistic_value / max_abs_sample_microns computed", "SCHEDULED -> PASSED | FAILED", "project cascade per RebuildProject transitions"] }

  # --- TrainingRecord ---
  - { method: GET, path: "/api/training-records/{id}", description: "Get a training record", roles: [Trainer, ProjectManager, Customer, PlatformAdmin], code: 200, input: [], output: TrainingRecord, side_effects: [] }
  - { method: GET, path: "/api/training-records", description: "List training records with optional project filter", roles: [Trainer, ProjectManager, Customer, PlatformAdmin], code: 200, input: ["project_id?", "limit?", "offset?"], output: "TrainingRecord[]", side_effects: [] }
  - { method: POST, path: "/api/training-records/{id}/log-session", description: "Log one completed operator-training session", roles: [Trainer], code: 200, input: [], output: TrainingRecord, side_effects: ["sessions_completed += 1", "PLANNED -> IN_PROGRESS on first session", "auto COMPLETED when sessions and documentation both satisfied"] }
  - { method: POST, path: "/api/training-records/{id}/deliver-documentation", description: "Mark operator documentation delivered", roles: [Trainer], code: 200, input: [], output: TrainingRecord, side_effects: ["documentation_delivered = true", "auto COMPLETED when sessions and documentation both satisfied"] }

  # --- DowntimeWindow ---
  - { method: POST, path: "/api/downtime-windows", description: "Book a customer production downtime window (half-open, no same-customer overlap)", roles: [Customer, LogisticsCoordinator], code: 201, input: [customer_id, starts_at, ends_at], output: DowntimeWindow, side_effects: ["status=OPEN"] }
  - { method: GET, path: "/api/downtime-windows/{id}", description: "Get a downtime window", roles: [Customer, LogisticsCoordinator, ProjectManager, PlatformAdmin], code: 200, input: [], output: DowntimeWindow, side_effects: [] }
  - { method: GET, path: "/api/downtime-windows", description: "List downtime windows with optional customer filter", roles: [Customer, LogisticsCoordinator, ProjectManager, PlatformAdmin], code: 200, input: ["customer_id?", "limit?", "offset?"], output: "DowntimeWindow[]", side_effects: [] }
  - { method: POST, path: "/api/downtime-windows/{id}/cancel", description: "Cancel an OPEN window (LOCKED windows cannot be cancelled)", roles: [Customer, LogisticsCoordinator], code: 200, input: [], output: DowntimeWindow, side_effects: ["OPEN -> CANCELLED"] }

  # --- ShipmentStage ---
  - { method: GET, path: "/api/shipment-stages/{id}", description: "Get a shipment stage", roles: [LogisticsCoordinator, ProjectManager, Customer, PlatformAdmin], code: 200, input: [], output: ShipmentStage, side_effects: [] }
  - { method: GET, path: "/api/shipment-stages", description: "List shipment stages with optional filters", roles: [LogisticsCoordinator, ProjectManager, Customer, PlatformAdmin], code: 200, input: ["project_id?", "window_id?", "limit?", "offset?"], output: "ShipmentStage[]", side_effects: [] }
  - { method: POST, path: "/api/shipment-stages/{id}/ship", description: "Ship a PLANNED stage (project must be post-acceptance)", roles: [LogisticsCoordinator], code: 200, input: [], output: ShipmentStage, side_effects: ["PLANNED -> SHIPPED"] }
  - { method: POST, path: "/api/shipment-stages/{id}/receive", description: "Receive a SHIPPED stage at customer site", roles: [LogisticsCoordinator], code: 200, input: [], output: ShipmentStage, side_effects: ["SHIPPED -> RECEIVED"] }
  - { method: POST, path: "/api/shipment-stages/{id}/install", description: "Install a RECEIVED stage", roles: [LogisticsCoordinator], code: 200, input: [], output: ShipmentStage, side_effects: ["RECEIVED -> INSTALLED"] }
  - { method: POST, path: "/api/shipment-stages/{id}/replan", description: "Replan an ON_HOLD or PLANNED stage with new dates (revalidates window containment and sibling gap)", roles: [LogisticsCoordinator], code: 200, input: [planned_ship_date, planned_return_date], output: ShipmentStage, side_effects: ["ON_HOLD -> PLANNED (or PLANNED dates updated)"] }

  # --- WarrantyClaim ---
  - { method: POST, path: "/api/projects/{id}/warranty-claims", description: "File a warranty claim on rebuilt accuracy or mechanical defect", roles: [Customer], code: 201, input: [claim_type, "measured_positioning_microns?"], output: WarrantyClaim, side_effects: ["drift_microns computed for ACCURACY_DRIFT", "filed_at = logical clock", "status=FILED"] }
  - { method: GET, path: "/api/warranty-claims/{id}", description: "Get a warranty claim", roles: [Customer, WarrantyAdministrator, ProjectManager, PlatformAdmin], code: 200, input: [], output: WarrantyClaim, side_effects: [] }
  - { method: GET, path: "/api/warranty-claims", description: "List warranty claims with optional project filter", roles: [Customer, WarrantyAdministrator, ProjectManager, PlatformAdmin], code: 200, input: ["project_id?", "limit?", "offset?"], output: "WarrantyClaim[]", side_effects: [] }
  - { method: POST, path: "/api/warranty-claims/{id}/approve", description: "Approve a filed claim", roles: [WarrantyAdministrator], code: 200, input: ["resolution_notes?"], output: WarrantyClaim, side_effects: ["FILED -> APPROVED"] }
  - { method: POST, path: "/api/warranty-claims/{id}/reject", description: "Reject a filed claim", roles: [WarrantyAdministrator], code: 200, input: ["resolution_notes?"], output: WarrantyClaim, side_effects: ["FILED -> REJECTED"] }
  - { method: POST, path: "/api/warranty-claims/{id}/remediate", description: "Close an approved claim after remediation", roles: [WarrantyAdministrator], code: 200, input: ["resolution_notes?"], output: WarrantyClaim, side_effects: ["APPROVED -> CLOSED"] }

  # --- TradeInOffer ---
  - { method: POST, path: "/api/machines/{id}/trade-in-offers", description: "Create a trade-in offer (both valuation variants computed and stored; supersedes prior OFFERED offer; OCC on Machine.version)", roles: [ProjectManager], code: 201, input: [valuation_variant, expected_machine_version], output: TradeInOffer, side_effects: ["market_value_cents / cost_value_cents / residual_value_cents computed", "expires_at = created_at + 30 days", "prior OFFERED offer -> SUPERSEDED", "increments Machine.version by 1"] }
  - { method: GET, path: "/api/trade-in-offers/{id}", description: "Get a trade-in offer", roles: [Customer, ProjectManager, PlatformAdmin], code: 200, input: [], output: TradeInOffer, side_effects: [] }
  - { method: GET, path: "/api/trade-in-offers", description: "List trade-in offers with optional filters", roles: [Customer, ProjectManager, PlatformAdmin], code: 200, input: ["machine_id?", "customer_id?", "applied_project_id?", "limit?", "offset?"], output: "TradeInOffer[]", side_effects: [] }
  - { method: POST, path: "/api/trade-in-offers/{id}/accept", description: "Customer accepts an offer; machine becomes TRADED_IN (cascade)", roles: [Customer], code: 200, input: [], output: TradeInOffer, side_effects: ["OFFERED -> ACCEPTED", "trade-in acceptance cascade (machine, project, lines, stock)"] }
  - { method: POST, path: "/api/trade-in-offers/{id}/decline", description: "Customer declines an offer", roles: [Customer], code: 200, input: [], output: TradeInOffer, side_effects: ["OFFERED -> DECLINED"] }

  # --- Part ---
  - { method: POST, path: "/api/parts", description: "Create a spare-part master record", roles: [PlatformAdmin], code: 201, input: [part_number, description, oem_status, "superseded_by_id?", unit_cost_cents, stock_quantity, lead_time_days], output: Part, side_effects: ["available_quantity = stock_quantity, reserved_quantity = 0"] }
  - { method: GET, path: "/api/parts/{id}", description: "Get a part", roles: [PlatformAdmin, ProjectManager, LogisticsCoordinator, RebuildEngineer], code: 200, input: [], output: Part, side_effects: [] }
  - { method: GET, path: "/api/parts", description: "List parts with optional supersession filter", roles: [PlatformAdmin, ProjectManager, LogisticsCoordinator, RebuildEngineer], code: 200, input: ["superseded_by_id?", "limit?", "offset?"], output: "Part[]", side_effects: [] }

  # --- Test-driving clock ---
  - { method: POST, path: "/api/_clock/set_current_utc", description: "Set the server's logical clock (test-driving endpoint). Startup default before any call is exactly 2026-05-01T00:00:00Z and MUST NOT fall back to wall-clock time. Side effects: sweep windows with clock > ends_at -> CLOSED; sweep WARRANTY_ACTIVE projects with clock > warranty_end and no claim in {FILED, APPROVED} -> CLOSED. Trade-in offers are NOT swept; offer expiry is lazy on accept.", roles: [PlatformAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["temporal sweeps per endpoint description"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_HEADERS, http: 401, condition: "X-User-ID or X-User-Role missing or role name not declared" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "role not permitted for the endpoint, or entity-backed ownership check failed (Customer not the resource's customer; assessor/inspector/trainer/engineer not the record's assigned id)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "acceptance inspector equals project.assigned_engineer_id, or RE validator equals job.fabricated_by_id" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "missing required field, invalid enum member, numeric range violation, samples length != 5, measured_positioning_microns missing for ACCURACY_DRIFT, duplicate of a unique field (serial_number, part_number)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "path or body-referenced resource id does not exist" }
  - { id: ERR_STALE_MACHINE_VERSION, http: 412, condition: "expected_machine_version != machine.version on assessment or trade-in-offer creation" }
  - { id: ERR_STALE_PROJECT_VERSION, http: 412, condition: "expected_project_version != project.version on quote computation" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "generic state-machine precondition failure (from-state mismatch or disallowed action in current state)" }
  - { id: ERR_PROJECT_NOT_IN_WARRANTY, http: 409, condition: "warranty claim filed while project.work_status != WARRANTY_ACTIVE" }
  - { id: ERR_COMMERCIAL_NOT_APPROVED, http: 409, condition: "begin-sourcing while commercial_status != APPROVED" }
  - { id: ERR_QUOTE_REQUIRED, http: 409, condition: "quote/send while quote_revision == 0" }
  - { id: ERR_PROJECT_NOT_AWAITING_ACCEPTANCE, http: 409, condition: "acceptance-test creation while project.work_status != AWAITING_ACCEPTANCE" }
  - { id: ERR_QUOTE_STALE, http: 409, condition: "quote/send or quote/approve while quote_stale == true (part lines changed after last computation)" }
  - { id: ERR_OPEN_ACCEPTANCE_TEST, http: 409, condition: "acceptance-test creation while another test of the same project is SCHEDULED" }
  - { id: ERR_PART_SUPERSEDED, http: 409, condition: "part-line add referencing a part with oem_status == SUPERSEDED" }
  - { id: ERR_TRADE_IN_NOT_APPLICABLE, http: 409, condition: "apply with an offer that is not ACCEPTED, belongs to a different customer than the project, or is already applied to another project" }
  - { id: ERR_TRADE_IN_ALREADY_APPLIED, http: 409, condition: "apply or revoke when the project's applied credit state does not match (credit already present on apply; none present on revoke)" }
  - { id: ERR_WARRANTY_EXPIRED, http: 409, condition: "claim filed with logical clock > project.warranty_end while project still WARRANTY_ACTIVE" }
  - { id: ERR_TRADE_IN_OFFER_EXPIRED, http: 409, condition: "accept attempted with logical clock > expires_at (offer transitions to EXPIRED)" }
  - { id: ERR_WINDOW_EMPTY, http: 409, condition: "downtime window with ends_at <= starts_at (including zero-length)" }
  - { id: ERR_WINDOW_OVERLAP, http: 409, condition: "new window overlaps an existing OPEN/LOCKED window of the same customer (half-open semantics; adjacency allowed)" }
  - { id: ERR_STAGE_OUTSIDE_WINDOW, http: 409, condition: "stage interval not contained in its window (inclusive bounds)" }
  - { id: ERR_STAGE_GAP_TOO_SMALL, http: 409, condition: "stage closer than 2 days to a non-CANCELLED sibling stage of the same project" }
  - { id: ERR_CLAIM_ALREADY_OPEN, http: 409, condition: "claim filed while another claim of the same project is FILED or APPROVED" }
  - { id: ERR_STAGES_NOT_INSTALLED, http: 409, condition: "deliver while a stage of the project is not in {INSTALLED, CANCELLED}" }
  - { id: ERR_DECISION_OVERRIDE_NEEDS_REASON, http: 409, condition: "decision differs from assessment.recommended_path without a non-empty decision_reason" }
  - { id: ERR_TRAINING_SESSION_OVERFLOW, http: 409, condition: "log-session while sessions_completed >= sessions_required" }
  - { id: ERR_LINES_OUTSTANDING, http: 409, condition: "begin-sourcing with no part lines, or start-rebuild with lines still in {PENDING, RESERVED, RE_PENDING}" }
  - { id: ERR_INSUFFICIENT_STOCK, http: 409, condition: "begin-sourcing reservation would drive a part's available_quantity negative" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 409, condition: "quote/approve with quote_price_cents > customer.credit_limit_cents" }
  - { id: ERR_DRIFT_WITHIN_TOLERANCE, http: 409, condition: "ACCURACY_DRIFT claim with drift_microns <= 15.0 (15.0 exactly is within tolerance)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Customer
    description: "Machine owner; approves quotes, books downtime windows, files warranty claims, accepts/declines trade-in offers"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /api/projects/{id}/quote/approve"
      - "POST /api/projects/{id}/warranty-claims"
      - "POST /api/trade-in-offers/{id}/accept"
      - "POST /api/trade-in-offers/{id}/decline"
    shared_operations:
      - "POST /api/machines, POST /api/downtime-windows, POST /api/downtime-windows/{id}/cancel (with LogisticsCoordinator/PlatformAdmin)"
      - "GET endpoints scoped to own resources"
  - name: Assessor
    description: "Field engineer performing as-found condition assessments"
    identity: opaque
    exclusive_operations:
      - "POST /api/machines/{id}/assessments"
      - "POST /api/assessments/{id}/submit"
    shared_operations: ["GET /api/assessments, GET /api/assessments/{id}, GET /api/machines"]
  - name: ProjectManager
    description: "Drives the rebuild project: decision, quote, sourcing, training, delivery, trade-in application"
    identity: opaque
    exclusive_operations:
      - "POST /api/assessments/{id}/accept, POST /api/assessments/{id}/return"
      - "POST /api/projects/{id}/decision, quote, quote/send, begin-sourcing, part-lines, start-rebuild, escalation/resolve, begin-training, deliver, cancel, trade-in/apply, trade-in/revoke"
      - "POST /api/machines/{id}/trade-in-offers"
      - "POST /api/part-lines/{id}/cancel"
    shared_operations: ["project/part/training/stage/claim GET endpoints"]
  - name: RebuildEngineer
    description: "Performs the rebuild work and reverse-engineering fabrication"
    identity: opaque
    exclusive_operations:
      - "POST /api/projects/{id}/declare-ready"
      - "POST /api/re-jobs/{id}/capture-spec, POST /api/re-jobs/{id}/fabricate"
    shared_operations: ["GET /api/re-jobs, GET /api/parts, GET /api/projects/{id}"]
  - name: QualityInspector
    description: "Schedules and records geometric accuracy acceptance tests; validates RE prototypes; segregated from the rebuild engineer"
    identity: opaque
    exclusive_operations:
      - "POST /api/projects/{id}/acceptance-tests"
      - "POST /api/acceptance-tests/{id}/record"
      - "POST /api/re-jobs/{id}/validate, POST /api/re-jobs/{id}/fail"
    shared_operations: ["GET /api/acceptance-tests, GET /api/re-jobs"]
  - name: Trainer
    description: "Delivers operator training sessions and documentation"
    identity: opaque
    exclusive_operations:
      - "POST /api/training-records/{id}/log-session"
      - "POST /api/training-records/{id}/deliver-documentation"
    shared_operations: ["GET /api/training-records"]
  - name: LogisticsCoordinator
    description: "Plans downtime windows and staged shipments; issues reserved stock"
    identity: opaque
    exclusive_operations:
      - "POST /api/projects/{id}/shipment-stages"
      - "POST /api/shipment-stages/{id}/ship, receive, install, replan"
      - "POST /api/part-lines/{id}/fulfill"
    shared_operations: ["POST /api/downtime-windows, POST /api/downtime-windows/{id}/cancel (with Customer)"]
  - name: WarrantyAdministrator
    description: "Adjudicates and closes warranty claims"
    identity: opaque
    exclusive_operations:
      - "POST /api/warranty-claims/{id}/approve, reject, remediate"
    shared_operations: ["GET /api/warranty-claims"]
  - name: PlatformAdmin
    description: "Operator: creates customers and part masters; drives the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /api/customers"
      - "POST /api/parts"
      - "POST /api/_clock/set_current_utc"
    shared_operations: ["all GET endpoints"]
