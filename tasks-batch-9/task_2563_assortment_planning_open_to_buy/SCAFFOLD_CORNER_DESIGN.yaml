            - call: "GET /otb/category-plans/${plan_id}"
              payload: {}
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { read_director: $.data.status }
            - call: "GET /otb/category-plans/${plan_id}"
              payload: {}
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { read_buyer: $.data.status }
            - call: "GET /otb/receipt-commitments/${rc_b}"
              payload: {}
              as: VendorRep
              as_user_id: "${vendor_a}"
              captures: { cross_read_vendor: $.data.vendor_id, cross_read_status: $.data.commit_status }
            - call: "POST /otb/receipt-commitments/${rc_b}/ship"
              payload: {}
              as: VendorRep
              as_user_id: "${vendor_a}"
              captures: { e_cross_ship: $.data.error_id }
            - call: "POST /otb/receipt-commitments/${rc_a}/ship"
              payload: {}
              as: VendorRep
              as_user_id: "${vendor_a}"
              captures: { own_ship: $.data.fulfillment_status }
            - call: "GET /otb/receipt-commitments/${rc_b}"
              payload: {}
              as: VendorRep
              as_user_id: "${vendor_a}"
              captures: { cross_read_fulfil: $.data.fulfillment_status }
          assert:
            - "${item_a_stage} == CARRYOVER created by MerchandisePlanner and ${item_b} created by CategoryBuyer: POST /otb/assortment-items appears in both roles' shared_operations, so both are accepted"
            - "${read_admin} == ${read_planner} == ${read_director} == ${read_buyer} == APPROVED: 'every GET in the API' really does cover all four office roles"
            - "${cross_read_vendor} == ${vendor_b} and ${cross_read_status} == COMMITTED read by vendor A's rep: GET /otb/receipt-commitments/{id} is an UNSCOPED shared operation for VendorRep, so cross-vendor reads succeed"
