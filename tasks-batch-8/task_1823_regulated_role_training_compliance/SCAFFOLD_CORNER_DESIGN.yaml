            - { call: "POST /compliance/regulators", payload: { code: "REG-EFF", name: "EFF Regulator", deadline_mode: "CALENDAR", recordkeeping_years: 7 }, as: ComplianceAdmin, captures: { reg_id: "$.data.id" } }
