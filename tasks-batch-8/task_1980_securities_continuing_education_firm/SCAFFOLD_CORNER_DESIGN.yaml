  # ===========================================================================
  - section: rbac
    instances:
      - name: c_rep_cannot_create_content_returns_403
        claim_type: role_denial
        grounds:
          - "roles.RegisteredRep"
          - "roles.TrainingAdmin"
          - "errors[ERR_UNAUTHORIZED_ROLE]"
        distinguishing_aspect: "RegisteredRep lacks TrainingAdmin's exclusive content-authoring operation."
        test_recipe:
          setup: ["rep exists"]
          setup_api_calls:
            - { call: "POST /representatives", payload: { crd_number: "CRD-C33", full_name: "Corner ThirtyThree", email: "c33@x.com", role_tier: RR, insurance_licensed: false, resident_state_code: "NY", prior_year_excess_hours: 0 }, as: TrainingAdmin, captures: { rep_id: "$.data.id" } }
          trigger:
            - { call: "POST /contents", payload: { code: "RBAC-1", title: "Rbac One", ce_category: FIRM_ELEMENT, delivery_format: ELEARNING, credit_hours: 1.0, min_passing_score: 70 }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_UNAUTHORIZED_ROLE (${err}); http 403"

      - name: c_training_admin_cannot_approve_returns_403
        claim_type: role_denial
        grounds:
          - "roles.TrainingAdmin"
          - "roles.ComplianceOfficer"
          - "errors[ERR_UNAUTHORIZED_ROLE]"
        distinguishing_aspect: "Approval is exclusive to ComplianceOfficer: a TrainingAdmin (even one who did not author the content) is denied at role check (priority 2), before any state or SoD check."
        test_recipe:
          setup: ["content authored by ta-1 and submitted"]
          setup_api_calls:
            - { call: "POST /contents", payload: { code: "RBAC-2", title: "Rbac Two", ce_category: FIRM_ELEMENT, delivery_format: ELEARNING, credit_hours: 1.0, min_passing_score: 70 }, as: TrainingAdmin, as_user_id: "ta-1", captures: { c_id: "$.data.id" } }
            - { call: "POST /contents/${c_id}/submit", payload: {}, as: TrainingAdmin, as_user_id: "ta-1" }
          trigger:
            - { call: "POST /contents/${c_id}/approve", payload: {}, as: TrainingAdmin, as_user_id: "ta-9", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_UNAUTHORIZED_ROLE (${err}); http 403; content remains PENDING_APPROVAL"

      - name: c_auditor_cannot_run_sweep_returns_403
        claim_type: role_denial
        grounds:
          - "roles.Auditor"
          - "roles.ComplianceOfficer"
          - "errors[ERR_UNAUTHORIZED_ROLE]"
        distinguishing_aspect: "Auditor is read-only: GET endpoints succeed, but the enforcement sweep (ComplianceOfficer-exclusive) is denied."
        test_recipe:
          setup: ["one content exists so the read path has data"]
          setup_api_calls:
            - { call: "POST /contents", payload: { code: "RBAC-3", title: "Rbac Three", ce_category: FIRM_ELEMENT, delivery_format: ELEARNING, credit_hours: 1.0, min_passing_score: 70 }, as: TrainingAdmin, as_user_id: "ta-1" }
          trigger:
            - { call: "GET /contents", payload: {}, as: Auditor }
            - { call: "POST /enforcement/sweep", payload: {}, as: Auditor, captures: { err: "$.data.error_id" } }
          assert:
            - "GET /contents as Auditor returns 200"
            - "POST /enforcement/sweep as Auditor: error_id == ERR_UNAUTHORIZED_ROLE (${err}); http 403"

  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: c_occ_plan_create_rejects_stale_version
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[plan-create-stale-representative]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "OCC on Representative.version: plan creation for a NEW year (2027) with the pre-first-create version is rejected with 412 even though the payload is otherwise legitimate."
        test_recipe:
          setup: ["rep created (version 1 captured); plan 2026 created with that version (rep advances to version 2)"]
          setup_api_calls:
            - { call: "POST /representatives", payload: { crd_number: "CRD-C36", full_name: "Corner ThirtySix", email: "c36@x.com", role_tier: RR, insurance_licensed: false, resident_state_code: "NY", prior_year_excess_hours: 0 }, as: TrainingAdmin, captures: { rep_id: "$.data.id", rep_v: "$.data.version" } }
            - { call: "POST /firm-element-plans", payload: { rep_id: "${rep_id}", plan_year: 2026, expected_representative_version: "${rep_v}" }, as: TrainingAdmin, captures: { plan_id: "$.data.id" } }
          trigger:
            - { call: "POST /firm-element-plans", payload: { rep_id: "${rep_id}", plan_year: 2027, expected_representative_version: "${rep_v}" }, as: TrainingAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_STALE_VERSION (${err}); http 412 — ${rep_v} no longer matches Representative.version"

      - name: c_occ_content_update_rejects_stale_version
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[content-update-stale-version]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "OCC on TrainingContent.version: a second edit carrying the pre-edit version is rejected with 412; the first edit with the current version succeeds."
        test_recipe:
          setup: ["content in DRAFT (version 1 captured)"]
          setup_api_calls:
            - { call: "POST /contents", payload: { code: "OCC-1", title: "Occ One", ce_category: FIRM_ELEMENT, delivery_format: ELEARNING, credit_hours: 1.0, min_passing_score: 70 }, as: TrainingAdmin, as_user_id: "ta-1", captures: { c_id: "$.data.id", c_v: "$.data.version" } }
            - { call: "PUT /contents/${c_id}", payload: { expected_content_version: "${c_v}", title: "Occ One Edited" }, as: TrainingAdmin, as_user_id: "ta-1", captures: { c_v2: "$.data.version" } }
          trigger:
            - { call: "PUT /contents/${c_id}", payload: { expected_content_version: "${c_v}", title: "Occ One Stale Edit" }, as: TrainingAdmin, as_user_id: "ta-1", captures: { err: "$.data.error_id" } }
          assert:
            - "first edit succeeded: version advanced to 2 (${c_v2})"
            - "second edit with stale expected_content_version: error_id == ERR_STALE_VERSION (${err}); http 412"

      - name: c_sweep_second_run_noop
        claim_type: ops_run_checkpoint
        grounds:
          - 'endpoints.POST /enforcement/sweep'
        distinguishing_aspect: "Ops-run checkpoint is stateless-safe: with nothing past deadline, both sweeps report all-zero summaries; a second run never re-fires transitions."
        test_recipe:
          setup: ["clock set; one assignment comfortably inside its window (due 2026-11-29)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "POST /representatives", payload: { crd_number: "CRD-C38", full_name: "Corner ThirtyEight", email: "c38@x.com", role_tier: RR, insurance_licensed: false, resident_state_code: "NY", prior_year_excess_hours: 0 }, as: TrainingAdmin, captures: { rep_id: "$.data.id" } }
            - { call: "POST /regulatory-assignments", payload: { rep_id: "${rep_id}", cycle_year: 2026 }, as: TrainingAdmin }
            - { call: "POST /enforcement/sweep", payload: {}, as: ComplianceOfficer }
          trigger:
            - { call: "POST /enforcement/sweep", payload: {}, as: ComplianceOfficer, captures: { od: "$.data.assignments_marked_overdue", lp: "$.data.assignments_lapsed", ex: "$.data.enrollments_expired", lic: "$.data.licenses_lapsed", sess: "$.data.sessions_marked_delivered" } }
          assert:
            - "second sweep summary all zeros: overdue ${od} == 0, lapsed ${lp} == 0, expired ${ex} == 0, licenses ${lic} == 0, sessions ${sess} == 0"

      - name: c_license_hours_reconcile_on_void
        claim_type: derived_field_reconciliation
        grounds:
          - "calculations.state_ce_earned_hours"
          - "state_machines.Enrollment.COMPLETED_to_VOIDED"
        distinguishing_aspect: "Derived-field reconciliation on the StateCELicense (different derived field than the plan hours covered by difficulty instances): voiding the only completion returns earned_hours_strict to 0."
        test_recipe:
          setup: ["insurance-licensed rep; STATE_INSURANCE content 4.0h APPROVED; license window covering default clock; enrollment COMPLETED"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "POST /representatives", payload: { crd_number: "CRD-C39", full_name: "Corner ThirtyNine", email: "c39@x.com", role_tier: RR, insurance_licensed: true, resident_state_code: "CA", prior_year_excess_hours: 0 }, as: TrainingAdmin, captures: { rep_id: "$.data.id" } }
            - { call: "POST /contents", payload: { code: "SI-RECON", title: "State Reconcile", ce_category: STATE_INSURANCE, delivery_format: ELEARNING, credit_hours: 4.0, min_passing_score: 70 }, as: TrainingAdmin, as_user_id: "ta-1", captures: { c_id: "$.data.id" } }
            - { call: "POST /contents/${c_id}/submit", payload: {}, as: TrainingAdmin, as_user_id: "ta-1" }
            - { call: "POST /contents/${c_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /state-ce-licenses", payload: { rep_id: "${rep_id}", state_code: "CA", required_hours: 24, period_start: "2026-01-01T00:00:00Z", period_end: "2027-01-01T00:00:00Z" }, as: TrainingAdmin, captures: { lic_id: "$.data.id" } }
            - { call: "POST /enrollments", payload: { rep_id: "${rep_id}", content_id: "${c_id}" }, as: TrainingAdmin, captures: { e_id: "$.data.id" } }
            - { call: "POST /enrollments/${e_id}/start", payload: {}, as: RegisteredRep, as_user_id: "${rep_id}" }
            - { call: "POST /enrollments/${e_id}/complete", payload: { score: 90 }, as: RegisteredRep, as_user_id: "${rep_id}" }
            - { call: "GET /state-ce-licenses/${lic_id}", payload: {}, as: ComplianceOfficer, captures: { h1: "$.data.earned_hours_strict" } }
          trigger:
            - { call: "POST /enrollments/${e_id}/void", payload: { justification: "vendor reported wrong course id" }, as: ComplianceOfficer }
            - { call: "GET /state-ce-licenses/${lic_id}", payload: {}, as: ComplianceOfficer, captures: { h2: "$.data.earned_hours_strict" } }
          assert:
            - "earned_hours_strict == 4.0 after completion (${h1})"
            - "earned_hours_strict == 0 after void (${h2}) — derived field reconciled against the source mutation"

