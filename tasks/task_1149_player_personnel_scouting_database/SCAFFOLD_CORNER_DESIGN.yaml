scaffold_corner_design:
  # =========================================================================
  # Section: entities
  # =========================================================================
  - section: entities
    instances:
      - name: scout_create_weight_default_applied
        claim_type: defaults
        grounds: ["entities.Scout.fields.weight"]
        distinguishing_aspect: "Omitting optional weight on scout creation applies the declared default 1.0."
        test_recipe:
          setup: ["GeneralManager can create scouts"]
          setup_api_calls: []
          trigger:
            - call: "POST /scouting/scouts"
              payload: { full_name: "Defaulty", level: "AREA" }
              as: GeneralManager
              captures: { sid: $.data.id, w: $.data.weight }
          assert:
            - "scout ${sid}.weight == 1.0 (default applied)"
            - "scout ${sid}.version == 1"

      - name: prospect_create_composite_input_ignored
        claim_type: computed_fields
        grounds: ["entities.Prospect.fields.composite_grade", "entities.Prospect.fields.tier"]
        distinguishing_aspect: "Client-supplied composite_grade/tier on create are ignored; computed fields stay null until a LOCKED report exists."
        test_recipe:
          setup: ["one AREA scout to act as creator"]
          setup_api_calls:
            - call: "POST /scouting/scouts"
              payload: { full_name: "S1", level: "AREA" }
              as: GeneralManager
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /scouting/prospects"
              payload: { full_name: "Sneaky", position: "QB", college: "State U", composite_grade: 9.99, tier: "T1" }
              as: AreaScout
              as_user_id: "${s1}"
              captures: { pid: $.data.id, cg: $.data.composite_grade, tr: $.data.tier }
          assert:
            - "prospect ${pid}.composite_grade is null (input ignored)"
            - "prospect ${pid}.tier is null (input ignored)"

      - name: prospect_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET on a well-formed but non-existent prospect id returns ERR_NOT_FOUND, not a 500 or empty object."
        test_recipe:
          setup: ["one AREA scout"]
          setup_api_calls:
            - call: "POST /scouting/scouts"
              payload: { full_name: "S1", level: "AREA" }
              as: GeneralManager
              captures: { s1: $.data.id }
          trigger:
            - call: "GET /scouting/prospects/00000000-0000-0000-0000-000000000000"
              as: AreaScout
              as_user_id: "${s1}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND, HTTP 404"

      - name: prospects_list_pagination
        claim_type: listing
        grounds: ["response_envelope"]
        distinguishing_aspect: "limit/offset windowing with total_count and has_more behaves per envelope defaults."
        test_recipe:
          setup: ["one AREA scout; three prospects created"]
          setup_api_calls:
            - call: "POST /scouting/scouts"
              payload: { full_name: "S1", level: "AREA" }
              as: GeneralManager
              captures: { s1: $.data.id }
            - call: "POST /scouting/prospects"
              payload: { full_name: "P1", position: "QB", college: "A" }
              as: AreaScout
              as_user_id: "${s1}"
            - call: "POST /scouting/prospects"
              payload: { full_name: "P2", position: "WR", college: "B" }
              as: AreaScout
              as_user_id: "${s1}"
            - call: "POST /scouting/prospects"
              payload: { full_name: "P3", position: "CB", college: "C" }
              as: AreaScout
              as_user_id: "${s1}"
          trigger:
            - call: "GET /scouting/prospects"
              payload: { limit: 2, offset: 0 }
              as: AreaScout
              as_user_id: "${s1}"
            - call: "GET /scouting/prospects"
              payload: { limit: 2, offset: 2 }
              as: AreaScout
              as_user_id: "${s1}"
          assert:
            - "first page: total_count == 3, has_more == true, exactly 2 items"
            - "second page (offset 2): total_count == 3, has_more == false, exactly 1 item"

      - name: prospect_version_starts_at_one
        claim_type: system_fields
        grounds: ["entities.Prospect"]
        distinguishing_aspect: "common_fields versioning: a freshly created prospect has version 1 and server-minted UUID id."
        test_recipe:
          setup: ["one AREA scout"]
          setup_api_calls:
            - call: "POST /scouting/scouts"
              payload: { full_name: "S1", level: "AREA" }
              as: GeneralManager
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /scouting/prospects"
              payload: { full_name: "Versioned", position: "OT", college: "State U" }
              as: AreaScout
              as_user_id: "${s1}"
              captures: { pid: $.data.id, v: $.data.version }
          assert:
            - "prospect ${pid}.version == 1"
            - "prospect ${pid}.id is a UUID with no type prefix"

      - name: prospect_board_entries_reverse_lookup
        claim_type: parent_relationships
        grounds: ["entities.DraftBoardEntry.fields.prospect_id"]
        distinguishing_aspect: "FK reverse-reachability: GET /scouting/prospects/{id}/board-entries returns the entries referencing the prospect."
        test_recipe:
          setup:
            - "scout s (mean 6.00 sd 1.00), director d1; prospect p with locked report, BOARD_READY, on board b1"
          setup_api_calls:
            - call: "POST /scouting/scouts"
              payload: { full_name: "S", level: "AREA", weight: 1.0, season_grade_mean: 6.00, season_grade_stdev: 1.00 }
              as: GeneralManager
              captures: { s1: $.data.id }
            - call: "POST /scouting/scouts"
              payload: { full_name: "D", level: "DIRECTOR" }
              as: GeneralManager
              captures: { d1: $.data.id }
            - call: "POST /scouting/prospects"
              payload: { full_name: "Linked", position: "QB", college: "A" }
              as: AreaScout
              as_user_id: "${s1}"
              captures: { p1: $.data.id }
            - call: "POST /scouting/prospects/${p1}/reports"
              payload: { raw_grade: 7.00, scheme_fit: 1.00 }
              as: AreaScout
              as_user_id: "${s1}"
              captures: { r1: $.data.id }
            - call: "POST /scouting/reports/${r1}/submit"
              payload: {}
              as: AreaScout
              as_user_id: "${s1}"
            - call: "POST /scouting/reports/${r1}/lock"
              payload: {}
              as: ScoutingDirector
              as_user_id: "${d1}"
            - call: "POST /scouting/prospects/${p1}/advance"
              payload: { to_state: "EVALUATED" }
              as: ScoutingDirector
              as_user_id: "${d1}"
            - call: "POST /scouting/prospects/${p1}/advance"
              payload: { to_state: "BOARD_READY" }
              as: ScoutingDirector
              as_user_id: "${d1}"
            - call: "POST /scouting/draft-boards"
              payload: { season_year: 2026 }
              as: ScoutingDirector
              as_user_id: "${d1}"
              captures: { b1: $.data.id }
            - call: "POST /scouting/draft-boards/${b1}/entries"
              payload: { prospect_id: "${p1}" }
              as: ScoutingDirector
              as_user_id: "${d1}"
              captures: { e1: $.data.id }
          trigger:
            - call: "GET /scouting/prospects/${p1}/board-entries"
              as: ScoutingDirector
              as_user_id: "${d1}"
              captures: { eid: "$.data[0].id", bid: "$.data[0].board_id" }
          assert:
            - "list contains exactly the entry ${e1} with board_id == ${b1}"

  # =========================================================================
  # Section: state_machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: prospect_create_initial_states
        claim_type: initial_state
        grounds: ["state_machines.Prospect"]
        distinguishing_aspect: "New prospect starts evaluation_status NEW and flag_status CLEAR on the two parallel dimensions."
        test_recipe:
          setup: ["one AREA scout"]
          setup_api_calls:
            - call: "POST /scouting/scouts"
              payload: { full_name: "S1", level: "AREA" }
              as: GeneralManager
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /scouting/prospects"
              payload: { full_name: "Fresh", position: "S", college: "A" }
              as: AreaScout
              as_user_id: "${s1}"
              captures: { es: $.data.evaluation_status, fs: $.data.flag_status }
          assert:
            - "evaluation_status == NEW"
            - "flag_status == CLEAR"

      - name: report_create_moves_prospect_to_scouting
        claim_type: side_effect_execution
        grounds: ["state_machines.Prospect.NEW_to_SCOUTING"]
        distinguishing_aspect: "Auto-transition: the prospect's first report moves evaluation_status NEW -> SCOUTING in the same request."
        test_recipe:
          setup: ["scout s; prospect p (NEW)"]
          setup_api_calls:
            - call: "POST /scouting/scouts"
              payload: { full_name: "S1", level: "AREA", weight: 1.0, season_grade_mean: 6.00, season_grade_stdev: 1.00 }
              as: GeneralManager
              captures: { s1: $.data.id }
            - call: "POST /scouting/prospects"
              payload: { full_name: "Auto", position: "S", college: "A" }
              as: AreaScout
              as_user_id: "${s1}"
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /scouting/prospects/${p1}/reports"
              payload: { raw_grade: 7.00, scheme_fit: 1.00 }
              as: AreaScout
              as_user_id: "${s1}"
            - call: "GET /scouting/prospects/${p1}"
              as: AreaScout
              as_user_id: "${s1}"
              captures: { es: $.data.evaluation_status }
          assert:
            - "prospect ${p1}.evaluation_status == SCOUTING after first report creation"

      - name: lock_draft_report_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.ScoutingReport.SUBMITTED_to_LOCKED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Lock is only valid from SUBMITTED; locking a DRAFT report fails and no normalized_grade is computed."
        test_recipe:
          setup: ["scout s; director d; prospect p with DRAFT report r"]
          setup_api_calls:
            - call: "POST /scouting/scouts"
              payload: { full_name: "S1", level: "AREA", weight: 1.0 }
              as: GeneralManager
              captures: { s1: $.data.id }
            - call: "POST /scouting/scouts"
              payload: { full_name: "D", level: "DIRECTOR" }
              as: GeneralManager
              captures: { d1: $.data.id }
            - call: "POST /scouting/prospects"
              payload: { full_name: "P", position: "S", college: "A" }
              as: AreaScout
              as_user_id: "${s1}"
              captures: { p1: $.data.id }
            - call: "POST /scouting/prospects/${p1}/reports"
              payload: { raw_grade: 7.00, scheme_fit: 1.00 }
              as: AreaScout
              as_user_id: "${s1}"
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /scouting/reports/${r1}/lock"
              payload: {}
              as: ScoutingDirector
              as_user_id: "${d1}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (409)"
            - "report remains DRAFT with normalized_grade null"

      - name: submit_locked_report_rejected
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.ScoutingReport"]
        distinguishing_aspect: "LOCKED is terminal: submit after lock fails."
        test_recipe:
          setup: ["scout s; director d; prospect p with report r LOCKED"]
          setup_api_calls:
            - call: "POST /scouting/scouts"
              payload: { full_name: "S1", level: "AREA", weight: 1.0, season_grade_mean: 6.00, season_grade_stdev: 1.00 }
              as: GeneralManager
              captures: { s1: $.data.id }
            - call: "POST /scouting/scouts"
              payload: { full_name: "D", level: "DIRECTOR" }
              as: GeneralManager
              captures: { d1: $.data.id }
            - call: "POST /scouting/prospects"
              payload: { full_name: "P", position: "S", college: "A" }
              as: AreaScout
              as_user_id: "${s1}"
              captures: { p1: $.data.id }
            - call: "POST /scouting/prospects/${p1}/reports"
              payload: { raw_grade: 7.00, scheme_fit: 1.00 }
              as: AreaScout
              as_user_id: "${s1}"
              captures: { r1: $.data.id }
            - call: "POST /scouting/reports/${r1}/submit"
              payload: {}
              as: AreaScout
              as_user_id: "${s1}"
            - call: "POST /scouting/reports/${r1}/lock"
              payload: {}
              as: ScoutingDirector
              as_user_id: "${d1}"
          trigger:
            - call: "POST /scouting/reports/${r1}/submit"
              payload: {}
              as: AreaScout
              as_user_id: "${s1}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (409); LOCKED is terminal"

      - name: double_submit_rejected
        claim_type: idempotency
        grounds: ["state_machines.ScoutingReport.DRAFT_to_SUBMITTED"]
        distinguishing_aspect: "Submitting an already-SUBMITTED report is rejected (no silent no-op)."
        test_recipe:
          setup: ["scout s; prospect p with SUBMITTED report r"]
          setup_api_calls:
            - call: "POST /scouting/scouts"
              payload: { full_name: "S1", level: "AREA", weight: 1.0 }
              as: GeneralManager
              captures: { s1: $.data.id }
            - call: "POST /scouting/prospects"
              payload: { full_name: "P", position: "S", college: "A" }
              as: AreaScout
              as_user_id: "${s1}"
              captures: { p1: $.data.id }
            - call: "POST /scouting/prospects/${p1}/reports"
              payload: { raw_grade: 7.00, scheme_fit: 1.00 }
              as: AreaScout
              as_user_id: "${s1}"
              captures: { r1: $.data.id }
            - call: "POST /scouting/reports/${r1}/submit"
              payload: {}
              as: AreaScout
              as_user_id: "${s1}"
          trigger:
            - call: "POST /scouting/reports/${r1}/submit"
              payload: {}
              as: AreaScout
              as_user_id: "${s1}"
              captures: { err: $.data.error_id }
          assert:
            - "second submit -> error_id ERR_INVALID_STATE (409)"

      - name: advance_without_locked_report_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.Prospect.SCOUTING_to_EVALUATED"]
        distinguishing_aspect: "SCOUTING -> EVALUATED requires at least one LOCKED report; a merely SUBMITTED report does not satisfy the guard."
        test_recipe:
          setup: ["scout s; director d; prospect p with report SUBMITTED (not locked)"]
          setup_api_calls:
            - call: "POST /scouting/scouts"
              payload: { full_name: "S1", level: "AREA", weight: 1.0 }
              as: GeneralManager
              captures: { s1: $.data.id }
            - call: "POST /scouting/scouts"
              payload: { full_name: "D", level: "DIRECTOR" }
              as: GeneralManager
              captures: { d1: $.data.id }
            - call: "POST /scouting/prospects"
              payload: { full_name: "P", position: "S", college: "A" }
              as: AreaScout
              as_user_id: "${s1}"
              captures: { p1: $.data.id }
            - call: "POST /scouting/prospects/${p1}/reports"
              payload: { raw_grade: 7.00, scheme_fit: 1.00 }
              as: AreaScout
              as_user_id: "${s1}"
              captures: { r1: $.data.id }
            - call: "POST /scouting/reports/${r1}/submit"
              payload: {}
              as: AreaScout
              as_user_id: "${s1}"
          trigger:
            - call: "POST /scouting/prospects/${p1}/advance"
              payload: { to_state: "EVALUATED" }
              as: ScoutingDirector
              as_user_id: "${d1}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (409); prospect remains SCOUTING"

      - name: finalize_open_board_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.DraftBoard.FROZEN_to_FINALIZED"]
        distinguishing_aspect: "Finalize requires FROZEN; finalizing an OPEN board fails."
        test_recipe:
          setup: ["director d; OPEN board b1"]
          setup_api_calls:
            - call: "POST /scouting/scouts"
              payload: { full_name: "D", level: "DIRECTOR" }
              as: GeneralManager
              captures: { d1: $.data.id }
            - call: "POST /scouting/draft-boards"
              payload: { season_year: 2026 }
              as: ScoutingDirector
              as_user_id: "${d1}"
              captures: { b1: $.data.id }
          trigger:
            - call: "POST /scouting/draft-boards/${b1}/finalize"
              payload: {}
              as: ScoutingDirector
              as_user_id: "${d1}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (409)"

      - name: finalize_empty_board_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.DraftBoard.FROZEN_to_FINALIZED", "errors[ERR_BOARD_EMPTY]"]
        distinguishing_aspect: "Boundary on a count metric: a FROZEN board with zero active entries cannot be finalized."
        test_recipe:
          setup: ["director d; board b1 frozen while still empty"]
          setup_api_calls:
            - call: "POST /scouting/scouts"
              payload: { full_name: "D", level: "DIRECTOR" }
              as: GeneralManager
              captures: { d1: $.data.id }
            - call: "POST /scouting/draft-boards"
              payload: { season_year: 2026 }
              as: ScoutingDirector
              as_user_id: "${d1}"
              captures: { b1: $.data.id }
            - call: "POST /scouting/draft-boards/${b1}/freeze"
              payload: {}
              as: ScoutingDirector
              as_user_id: "${d1}"
          trigger:
            - call: "POST /scouting/draft-boards/${b1}/finalize"
              payload: {}
              as: ScoutingDirector
              as_user_id: "${d1}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_BOARD_EMPTY (409)"

      - name: entry_add_frozen_board_rejected
        claim_type: precondition_enforcement
        grounds: ["validations[priority=5]", "errors[ERR_BOARD_NOT_OPEN]"]
        distinguishing_aspect: "Entry mutations require OPEN; adding to a FROZEN board returns ERR_BOARD_NOT_OPEN before any prospect checks."
        test_recipe:
          setup: ["scout s, director d; prospect p BOARD_READY; board b1 FROZEN"]
          setup_api_calls:
            - call: "POST /scouting/scouts"
              payload: { full_name: "S", level: "AREA", weight: 1.0, season_grade_mean: 6.00, season_grade_stdev: 1.00 }
              as: GeneralManager
              captures: { s1: $.data.id }
            - call: "POST /scouting/scouts"
              payload: { full_name: "D", level: "DIRECTOR" }
              as: GeneralManager
              captures: { d1: $.data.id }
            - call: "POST /scouting/prospects"
              payload: { full_name: "P", position: "QB", college: "A" }
              as: AreaScout
              as_user_id: "${s1}"
              captures: { p1: $.data.id }
            - call: "POST /scouting/prospects/${p1}/reports"
              payload: { raw_grade: 7.00, scheme_fit: 1.00 }
              as: AreaScout
              as_user_id: "${s1}"
              captures: { r1: $.data.id }
            - call: "POST /scouting/reports/${r1}/submit"
              payload: {}
              as: AreaScout
              as_user_id: "${s1}"
            - call: "POST /scouting/reports/${r1}/lock"
              payload: {}
              as: ScoutingDirector
              as_user_id: "${d1}"
            - call: "POST /scouting/prospects/${p1}/advance"
              payload: { to_state: "EVALUATED" }
              as: ScoutingDirector
              as_user_id: "${d1}"
            - call: "POST /scouting/prospects/${p1}/advance"
              payload: { to_state: "BOARD_READY" }
              as: ScoutingDirector
              as_user_id: "${d1}"
            - call: "POST /scouting/draft-boards"
              payload: { season_year: 2026 }
              as: ScoutingDirector
              as_user_id: "${d1}"
              captures: { b1: $.data.id }
            - call: "POST /scouting/draft-boards/${b1}/freeze"
              payload: {}
              as: ScoutingDirector
              as_user_id: "${d1}"
          trigger:
            - call: "POST /scouting/draft-boards/${b1}/entries"
              payload: { prospect_id: "${p1}" }
              as: ScoutingDirector
              as_user_id: "${d1}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_BOARD_NOT_OPEN (409)"

      - name: entry_add_not_board_ready_rejected
        claim_type: precondition_enforcement
        grounds: ["validations[priority=5]", "errors[ERR_PROSPECT_NOT_BOARD_READY]"]
        distinguishing_aspect: "Only BOARD_READY prospects may be added; an EVALUATED prospect is rejected with the dedicated error."
        test_recipe:
          setup: ["scout s, director d; prospect p EVALUATED; OPEN board b1"]
          setup_api_calls:
            - call: "POST /scouting/scouts"
              payload: { full_name: "S", level: "AREA", weight: 1.0, season_grade_mean: 6.00, season_grade_stdev: 1.00 }
              as: GeneralManager
              captures: { s1: $.data.id }
            - call: "POST /scouting/scouts"
              payload: { full_name: "D", level: "DIRECTOR" }
              as: GeneralManager
              captures: { d1: $.data.id }
            - call: "POST /scouting/prospects"
              payload: { full_name: "P", position: "QB", college: "A" }
              as: AreaScout
              as_user_id: "${s1}"
              captures: { p1: $.data.id }
            - call: "POST /scouting/prospects/${p1}/reports"
              payload: { raw_grade: 7.00, scheme_fit: 1.00 }
              as: AreaScout
              as_user_id: "${s1}"
              captures: { r1: $.data.id }
            - call: "POST /scouting/reports/${r1}/submit"
              payload: {}
              as: AreaScout
              as_user_id: "${s1}"
            - call: "POST /scouting/reports/${r1}/lock"
              payload: {}
              as: ScoutingDirector
              as_user_id: "${d1}"
            - call: "POST /scouting/prospects/${p1}/advance"
              payload: { to_state: "EVALUATED" }
              as: ScoutingDirector
              as_user_id: "${d1}"
            - call: "POST /scouting/draft-boards"
              payload: { season_year: 2026 }
              as: ScoutingDirector
              as_user_id: "${d1}"
              captures: { b1: $.data.id }
          trigger:
            - call: "POST /scouting/draft-boards/${b1}/entries"
              payload: { prospect_id: "${p1}" }
              as: ScoutingDirector
              as_user_id: "${d1}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PROSPECT_NOT_BOARD_READY (409)"

      - name: entry_add_excluded_prospect_rejected
        claim_type: precondition_enforcement
        grounds: ["validations[priority=6]", "errors[ERR_PROSPECT_EXCLUDED]"]
        distinguishing_aspect: "Safety gate: a prospect whose flag_status became EXCLUDED via HIGH MEDICAL escalation cannot be added to a board."
        test_recipe:
          setup: ["scout s, director d; prospect p BOARD_READY then EXCLUDED by HIGH MEDICAL escalation; OPEN board b1"]
          setup_api_calls:
            - call: "POST /scouting/scouts"
              payload: { full_name: "S", level: "AREA", weight: 1.0, season_grade_mean: 6.00, season_grade_stdev: 1.00 }
              as: GeneralManager
              captures: { s1: $.data.id }
            - call: "POST /scouting/scouts"
              payload: { full_name: "D", level: "DIRECTOR" }
              as: GeneralManager
              captures: { d1: $.data.id }
            - call: "POST /scouting/prospects"
              payload: { full_name: "P", position: "QB", college: "A" }
              as: AreaScout
              as_user_id: "${s1}"
              captures: { p1: $.data.id }
