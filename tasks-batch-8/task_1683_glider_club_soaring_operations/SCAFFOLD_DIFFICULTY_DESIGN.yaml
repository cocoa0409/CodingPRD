              captures: { gv_id: $.data.id, gv_ver: $.data.version }
            - call: "POST /soaring/aircraft"
              payload: { registration: "N601T", kind: "TOW_PLANE", annual_due_date: "2027-06-01T00:00:00Z" }
              as: ClubAdmin
              captures: { tw_id: $.data.id }
            - call: "POST /soaring/tow-slots"
              payload: { tow_plane_id: "${tw_id}", tow_pilot_id: "${tv_id}", start_at: "2026-08-16T12:00:00Z", end_at: "2026-08-16T18:00:00Z", capacity: 2 }
              as: ClubAdmin
              captures: { sv_id: $.data.id, sv_ver: $.data.version }
            - call: "POST /soaring/reservations"
              payload: { aircraft_id: "${gv_id}", member_id: "${mv_id}", start_at: "2026-08-16T10:00:00Z", end_at: "2026-08-16T15:00:00Z", expected_aircraft_version: "${gv_ver}" }
              as: Member
              as_user_id: "${mv_id}"
              captures: { rv_id: $.data.id }
            - call: "POST /soaring/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-16T10:30:00Z" }
              as: ClubAdmin
            - call: "POST /soaring/reservations/${rv_id}/checkout"
              payload: {}
              as: Member
              as_user_id: "${mv_id}"
            - call: "POST /soaring/flights"
              payload: { reservation_id: "${rv_id}", tow_slot_id: "${sv_id}", release_altitude_ft: 1500, takeoff_at: "2026-08-16T12:05:00Z", expected_tow_slot_version: "${sv_ver}" }
              as: Member
              as_user_id: "${mv_id}"
              captures: { fv_id: $.data.id }
          trigger:
            - call: "POST /soaring/flights/${fv_id}/void"
              payload: {}
              as: DutyOfficer
              as_user_id: "${tv_id}"
          assert:
            - "Flight.${fv_id}.status == VOIDED"
            - "Member.${mv_id}.account_balance_cents == 0  (provisional debit 2700 fully reversed — conserved)"
            - "TowSlot.${sv_id}.confirmed_count == 0 (link 1)"
            - "TowSlot.${sv_id}.status == CANCELLED (link 2: count reached 0 with start_at 12:00 > now 10:35)"
            - "Reservation.${rv_id}.status == CHECKED_OUT (void does not close the reservation)"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_fiscal_payment_on_resigned_member
        grounds:
          - validations[priority=5]
          - validations[priority=14]
        distinguishing_aspect: |
          Error-category pair state vs business_fiscal: a payment posted for
          a RESIGNED member violates the state gate (ERR_MEMBER_NOT_ACTIVE,
          priority 5) AND would breach the credit cap (ERR_CREDIT_CAP_EXCEEDED,
          priority 14); the state error must win.
        test_recipe:
          setup:
            - "member MP on zero-dues tier, balance 0, RESIGNED (resigns cleanly — no IN_FLIGHT flights)"
          setup_api_calls:
            - call: "POST /soaring/tiers"
              payload: { tier_code: "PRIO", monthly_dues_cents: 0, tow_fee_discount_pct: 0.0, included_tows_per_month: 0 }
              as: ClubAdmin
              captures: { tier_p: $.data.id }
            - call: "POST /soaring/members"
              payload: { full_name: "Prio Pilot", tier_id: "${tier_p}" }
              as: ClubAdmin
              captures: { mp_id: $.data.id }
            - call: "POST /soaring/members/${mp_id}/resign"
              payload: {}
              as: Member
              as_user_id: "${mp_id}"
          trigger:
            - call: "POST /soaring/members/${mp_id}/payments"
              payload: { amount_cents: 60000 }
              as: ClubAdmin
              captures: { pay_err: $.data.error_id }
          assert:
            - "payment rejected with error_id ERR_MEMBER_NOT_ACTIVE (state priority 5 beats fiscal priority 14 even though 60000 into a zero balance would also breach CREDIT_CAP -50000)"
            - "Member.${mp_id}.account_balance_cents == 0 unchanged"

      - name: safety_vs_temporal_priority_on_checkout
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - state_machines.Reservation.BOOKED_to_CHECKED_OUT
        distinguishing_aspect: |
          Error-category pair business_safety vs business_temporal (different
          pair from state-vs-fiscal): checkout attempted BOTH outside the
          reservation window (temporal violation) AND against a GROUNDED
          glider (safety violation) must surface ERR_AIRCRAFT_NOT_AIRWORTHY
          (priority 6) rather than ERR_INVALID_TIME_WINDOW (priority 7).
        test_recipe:
          setup:
            - "glider GS AIRWORTHY at create, then manually grounded; reservation RS BOOKED on the grounded glider with window 2026-08-18T10:00-12:00 (create allowed; only checkout gates airworthiness)"
            - "clock 2026-08-18T08:00:00Z — outside the [start-15min, end] checkout window (temporal violation) AND glider grounded (safety violation)"
          setup_api_calls:
            - call: "POST /soaring/tiers"
              payload: { tier_code: "SAF", monthly_dues_cents: 0, tow_fee_discount_pct: 0.0, included_tows_per_month: 0 }
              as: ClubAdmin
              captures: { tier_s: $.data.id }
            - call: "POST /soaring/members"
              payload: { full_name: "Safety Pilot", tier_id: "${tier_s}" }
              as: ClubAdmin
              captures: { ms_id: $.data.id }
            - call: "POST /soaring/aircraft"
              payload: { registration: "N800G", kind: "GLIDER", annual_due_date: "2027-06-01T00:00:00Z" }
              as: ClubAdmin
              captures: { gs_id: $.data.id, gs_ver: $.data.version }
            - call: "POST /soaring/aircraft/${gs_id}/ground"
              payload: {}
              as: ClubAdmin
            - call: "POST /soaring/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-18T08:00:00Z" }
              as: ClubAdmin
            - call: "GET /soaring/aircraft/${gs_id}"
              as: ClubAdmin
              captures: { gs_ver2: $.data.version }
            - call: "POST /soaring/reservations"
              payload: { aircraft_id: "${gs_id}", member_id: "${ms_id}", start_at: "2026-08-18T10:00:00Z", end_at: "2026-08-18T12:00:00Z", expected_aircraft_version: "${gs_ver2}" }
              as: Member
              as_user_id: "${ms_id}"
              captures: { rs_id: $.data.id }
          trigger:
            - call: "POST /soaring/reservations/${rs_id}/checkout"
              payload: {}
              as: Member
              as_user_id: "${ms_id}"
              captures: { co_err: $.data.error_id }
          assert:
            - "checkout rejected with error_id ERR_AIRCRAFT_NOT_AIRWORTHY (safety priority 6 wins over temporal priority 7 even though clock 08:00 is also outside the checkout window)"
            - "Reservation.${rs_id}.status == BOOKED unchanged"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: inspection_100h_exact_boundary
        grounds:
          - calculations.aircraft_currency_check
          - validations[priority=6]
        distinguishing_aspect: |
          Numeric threshold boundary (strict <) on the airframe-hours metric
          via the ops-day close endpoint: a glider at 99.9 hours stays
          AIRWORTHY; a glider at exactly 100.0 fails the currency check and is
          auto-grounded.
