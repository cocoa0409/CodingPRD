        distinguishing_aspect: "tin is globally unique across payees; the second registration of 111-22-3333 is a 409 ERR_DUPLICATE_TIN even though every field is well-formed."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Payee 111-22-3333 already registered."
          setup_api_calls:
            - *k_clock
            - *k_payee1
