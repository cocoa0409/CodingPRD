      - name: header_pre_checks_run_ahead_of_the_role_matrix
        claim_type: cannot_perform_others_exclusive
        grounds:
          - errors.ERR_UNAUTHENTICATED
          - errors.ERR_UNKNOWN_ROLE
          - validations.priority_1
          - validations.priority_2
        distinguishing_aspect: |
          Three shapes on one endpoint the caller would otherwise be entitled to use: an
          empty X-User-Role (401 ERR_UNAUTHENTICATED at priority 1), an empty X-User-ID with
          a good role (also priority 1 — a blank value counts as absent, not as an unknown
          role), and a plausible-but-undeclared role name (401 ERR_UNKNOWN_ROLE at priority
          2). None of them reaches priority 3, and none reaches the body.
        test_recipe:
          setup:
            - "An approved program tree, so the only thing wrong with each call is its headers."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
