          assert:
            - "the create call returns HTTP 201 with ${auth_state} == PENDING, ${auth_token} non-empty and ${auth_expires} null"
            - "${validated_state} == VALIDATED and ${validated_expires} == 2026-08-31T00:00:00Z"
            - "DomainAuthorization.${auth_id}.validated_at == 2026-08-01T00:00:00Z, attempt_count == 1 and reuse_count == 0"
            - "DomainAuthorization.${auth_id}.method == TLS_ALPN"

      - name: organization_vetting_is_required_only_for_ov_and_ev_profiles
