        excluded_because:
          difficulty_instance: dual_variant_calc / easement_value_variants_diverge_offer_vs_award
          rationale: "The NEGOTIATED_OFFER and CONDEMNATION_AWARD variants on one tract are compared by the named §1.8 instance."

      - name: compliance_index_variant_divergence
        claim_type: dual_variant_calculation
        grounds:
          - calculations.certificate_compliance_index.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / compliance_index_variants_diverge_after_correction
          rationale: "The rolling/cumulative split after a correction halves one deduction but not the other is asserted by the named §1.8 instance."

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: decision_response_exposes_the_minted_certificate_immediately
        claim_type: immediate
        grounds:
          - consistency_model
          - endpoints[POST /siting/applications/{applicationId}/decision].side_effects
        distinguishing_aspect: "One write mints a Certificate plus three CertificateCondition rows and moves the project stage; every one of those is readable in the same test run with no settling step, and the certificate is already ISSUED/ACTIVE at 100.00 on first read."
        test_recipe:
          setup:
            - "Application ACCEPTED with the evidentiary record closed"
          setup_api_calls: *cPRE
          trigger:
            - *c25
            - *c26
            - *c27
            - *c28
            - *c29
            - call: "GET /siting/certificates"
              payload: { application_id: "${app}" }
              as: CommissionStaff
              as_user_id: "staff-lin"
              captures: { cert_now: "$.data[0].id" }
            - call: "GET /siting/certificate-conditions"
              payload: { certificate_id: "${cert_now}" }
              as: CommissionStaff
              as_user_id: "staff-lin"
          assert:
            - "response.status == 200"
            - "response.meta.total_count == 3"
            - "Certificate.${cert_now}.status == ISSUED"
            - "Certificate.${cert_now}.posture == ACTIVE"
            - "Certificate.${cert_now}.compliance_index_rolling == 100.00"
            - "SitingApplication.${app}.review_status == GRANTED"
            - "SitingApplication.${app}.record_status == DECIDED"
            - "Project.${proj}.stage == CERTIFICATED"

      - name: finding_cascade_is_readable_without_a_second_write
        claim_type: immediate
        grounds:
          - consistency_model
          - endpoints[POST /siting/nonconformances].side_effects
        distinguishing_aspect: "The four rows the cascade touches are consistent on the very next read: after one SEVERE finding the certificate reads STOP_WORK at 52.00, the in-progress activity reads SUSPENDED and the segment reads HALTED, with no reconciliation call in between."
        test_recipe:
          setup:
            - "Certificate ISSUED/ACTIVE, escrow funded, tract on segment 1 AGREED"
            - "Crew-6 CLEARING activity on segment 1 IN_PROGRESS since 2027-08-02"
          setup_api_calls: *cCERT
          trigger:
            - *c32
            - *c41
            - *c42
            - *c43
            - *c45
            - *c47
            - *c48
            - *c49
            - call: "POST /siting/nonconformances"
              payload: { certificate_id: "${cert}", condition_id: "${cond1}", severity: "SEVERE", observation: "Clearing outside the approved workspace" }
              as: ComplianceMonitor
              as_user_id: "monitor-abe"
              captures: { ncr_now: "$.data.id" }
            - call: "GET /siting/certificates/${cert}"
              payload: {}
              as: ComplianceMonitor
              as_user_id: "monitor-abe"
          assert:
            - "response.status == 200"
            - "response.data.posture == STOP_WORK"
            - "response.data.compliance_index_rolling == 52.00"
            - "response.data.status == ISSUED"
            - "Nonconformance.${ncr_now}.deduction_points == 48.00"
            - "CertificateCondition.${cond1}.status == VIOLATED"
            - "ConstructionActivity.${act1}.status == SUSPENDED"
            - "RouteSegment.${seg1}.construction_state == HALTED"
