    roles: [ProgramAdmin, SiteSupervisor]
    code: 200
    input: ["program_id?", "status?", "limit?", "offset?"]
    output: Volunteer[]
    side_effects: []
  - method: PATCH
    path: "/volunteers/{id}"
    description: "Approve, suspend, or reinstate a volunteer"
    roles: [ProgramAdmin]
    code: 200
    input: [status]
    output: Volunteer
    side_effects: ["per Volunteer state machine"]
  - method: POST
    path: "/volunteer-shifts"
    description: "Sign an APPROVED volunteer up for a site shift. Half-open [start_at,end_at) overlap rejected per volunteer; site-day-role capacity enforced."
    roles: [Volunteer, ProgramAdmin]
    code: 201
    input: [volunteer_id, site_id, start_at, end_at, shift_role]
    output: VolunteerShift
    side_effects: ["occupancy for site/date/role incremented"]
  - method: GET
    path: "/volunteer-shifts/{id}"
    description: "Get a shift"
    roles: [ProgramAdmin, SiteSupervisor, Volunteer]
    code: 200
    input: []
    output: VolunteerShift
    side_effects: []
  - method: GET
    path: "/volunteer-shifts"
    description: "List shifts with filters"
    roles: [ProgramAdmin, SiteSupervisor, Volunteer]
    code: 200
    input: ["volunteer_id?", "site_id?", "status?", "limit?", "offset?"]
    output: VolunteerShift[]
    side_effects: []
  - method: PATCH
    path: "/volunteer-shifts/{id}"
    description: "CANCELLED (Volunteer own/ProgramAdmin; 24h cutoff, admin exempt) or COMPLETED/NO_SHOW (SiteSupervisor/ProgramAdmin; at/after end_at)"
    roles: [Volunteer, SiteSupervisor, ProgramAdmin]
    code: 200
    input: [status]
    output: VolunteerShift
    side_effects: ["NO_SHOW increments volunteer.no_show_count; at 3 auto-suspends and cancels future SIGNED_UP shifts"]

  # --- Diversion reports ---
  - method: POST
    path: "/diversion-reports"
    description: "Generate a DRAFT diversion report snapshot; supersedes any PUBLISHED report of the program. OCC-guarded on Program."
    roles: [ProgramAdmin]
    code: 201
    input: [program_id, expected_program_version]
    output: DiversionReport
    side_effects:
      - "increments Program.version by 1"
      - "existing PUBLISHED report of the program -> SUPERSEDED"
      - "computes diversion_rate_rollup snapshot fields"
  - method: GET
    path: "/diversion-reports/{id}"
    description: "Get a report"
    roles: [ProgramAdmin, SiteSupervisor, HaulerPartner]
    code: 200
    input: []
    output: DiversionReport
    side_effects: []
  - method: GET
    path: "/diversion-reports"
    description: "List reports with filters"
    roles: [ProgramAdmin, SiteSupervisor, HaulerPartner]
    code: 200
    input: ["program_id?", "status?", "limit?", "offset?"]
    output: DiversionReport[]
    side_effects: []
  - method: PATCH
    path: "/diversion-reports/{id}"
    description: "Publish a DRAFT report (requires now > window_end and no SCHEDULED runs)"
    roles: [ProgramAdmin]
    code: 200
    input: [status]
    output: DiversionReport
    side_effects: ["published_at set to logical clock"]

  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call, the logical clock reads exactly 2026-08-01T00:00:00Z (fixed startup default; never falls back to wall-clock)."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock advanced; no automatic transitions fire except via POST /programs/{id}/ops-run"]

# =============================================================================
# §1.6 Error Code Catalog (37 codes)
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for the endpoint/transition, or entity-backed ownership check failed" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource (path id or body FK) does not exist" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed request: missing required field, invalid enum, out-of-range value, window shorter than 7 days, contaminated exceeds measured/gross, cross-program reference" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state from which the requested transition is declared (incl. terminal lockdown, program not ACTIVE where required)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_PROGRAM_RESTRICTED, http: 409, condition: "Program posture RESTRICTED (open_ticket_count >= 3); new bookings and intake events blocked" }
  - { id: ERR_PROGRAM_HAS_OPEN_ITEMS, http: 409, condition: "Program close blocked: sites not all CLOSED, no PUBLISHED report, non-terminal bookings/tickets/events remain" }
  - { id: ERR_OUTSIDE_COLLECTION_WINDOW, http: 422, condition: "Intake recorded outside [window_start, window_end] (endpoints inclusive); reschedule target/zone date outside window; program activation before window_start" }
  - { id: ERR_NOTIFICATION_LEAD_TIME, http: 422, condition: "Zone collection_date change attempted with now > current collection_date - 48h" }
  - { id: ERR_ZONE_MISMATCH, http: 422, condition: "booking.zone_id != household.zone_id" }
  - { id: ERR_ZONE_SUSPENDED, http: 409, condition: "Booking create/reschedule while zone status == SUSPENDED" }
  - { id: ERR_ROUTE_CAPACITY_EXCEEDED, http: 422, condition: "reserved_trees + tree_count > daily_tree_capacity (equality is allowed); also capacity reduction below reserved" }
  - { id: ERR_PREP_ATTESTATION_REQUIRED, http: 422, condition: "prep_attestation missing or false (trees must be free of stands/decorations/tinsel/flocking)" }
  - { id: ERR_HOUSEHOLD_BARRED, http: 403, condition: "Household curbside_eligible == false (strike_count >= 2); booking create/reschedule blocked" }
  - { id: ERR_BOOKING_DATE_MISMATCH, http: 422, condition: "reschedule new_service_date != zone.collection_date" }
  - { id: ERR_SITE_NOT_OPEN, http: 409, condition: "Intake attempted while site is not OPEN" }
  - { id: ERR_SITE_CAPACITY_EXCEEDED, http: 422, condition: "stockpile_cy + net_volume_cy > capacity_cy (equality allowed)" }
  - { id: ERR_CAPACITY_BELOW_STOCKPILE, http: 422, condition: "Site capacity_cy patch below current stockpile_cy" }
  - { id: ERR_SITE_NOT_CLOSABLE, http: 409, condition: "Site CLOSING->CLOSED blocked: stockpile_cy != 0 or open/appealed site tickets exist" }
  - { id: ERR_TICKET_SOURCE_INVALID, http: 422, condition: "Ticket must reference exactly one of booking_id/site_id, belonging to the given program" }
  - { id: ERR_DUPLICATE_TICKET, http: 409, condition: "An OPEN ticket already exists for the same booking or the same site" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Adjudicator is the ticket's reporter, or appeal resolver is the original adjudicator (applies to ProgramAdmin too)" }
  - { id: ERR_APPEAL_WINDOW_EXPIRED, http: 422, condition: "Appeal attempted with now > appeal_deadline (adjudicated_at + 72h, inclusive boundary)" }
  - { id: ERR_SHIFT_OVERLAP, http: 409, condition: "Volunteer already has a SIGNED_UP/COMPLETED shift overlapping [start_at, end_at); half-open semantics: adjacent shifts allowed" }
  - { id: ERR_SHIFT_CAPACITY_FULL, http: 422, condition: "Site/date/role occupancy == volunteer_slots_per_role" }
  - { id: ERR_SHIFT_CUTOFF_PASSED, http: 422, condition: "Volunteer cancel with now > start_at - 24h; or outcome recorded before end_at" }
  - { id: ERR_VOLUNTEER_NOT_APPROVED, http: 409, condition: "Shift signup while volunteer status != APPROVED" }
  - { id: ERR_RUN_OVERLAP, http: 409, condition: "Chipping run overlaps or sits < 2h from another non-cancelled run at the same site (exactly 2h gap allowed)" }
  - { id: ERR_RUN_WINDOW_INVALID, http: 422, condition: "Run outside [window_start, window_end + 14d], scheduled_end <= scheduled_start, or completion before scheduled_start" }
  - { id: ERR_RUN_INPUT_EXCEEDS_STOCKPILE, http: 422, condition: "complete input_cy > site.stockpile_cy (equality allowed)" }
  - { id: ERR_YIELD_VARIANCE_REVIEW_REQUIRED, http: 422, condition: "Unrounded |measured-theoretical|/theoretical > 0.08 without yield_review_confirmed=true" }
  - { id: ERR_EVENT_NOT_OPEN, http: 409, condition: "Claim create while event status != OPEN" }
  - { id: ERR_CLAIM_WINDOW_INVALID, http: 422, condition: "Claim create outside [claim_open_at, claim_close_at]" }
  - { id: ERR_PICKUP_WINDOW_CLOSED, http: 422, condition: "Fulfill attempted outside [pickup_start, pickup_end]" }
  - { id: ERR_CLAIM_CAP_EXCEEDED, http: 422, condition: "requested_cy > event.per_household_cap_cy or < 0.5" }
  - { id: ERR_DUPLICATE_CLAIM, http: 409, condition: "Household already has a CONFIRMED or WAITLISTED claim on the event" }
  - { id: ERR_REPORT_NOT_PUBLISHABLE, http: 409, condition: "Publish blocked: now <= window_end or SCHEDULED runs remain" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramAdmin
    description: "City program manager; full superset of all operations. SoD checks still apply (cannot adjudicate a ticket they reported, cannot resolve an appeal they adjudicated)."
    identity: opaque
    exclusive_operations:
      - "Program create/patch/ops-run; site/zone create; zone patch; volunteer approval; chipping-run create/cancel; event create/patch; report create/publish; clock set"
    shared_operations:
      - "All read endpoints; booking create/cancel/reschedule/record-outcome; intake create/void; ticket report/adjudicate; claim create/fulfill/cancel; shift create/patch; run complete"
  - name: SiteSupervisor
    description: "Field supervisor staffing a drop-off site; records intake and service outcomes, reports and adjudicates contamination, fulfills claims, marks shift outcomes."
    identity: opaque
    exclusive_operations:
      - "intake-events create/void; booking record-outcome; claim fulfill (shared with ProgramAdmin); shift outcome marking (shared with ProgramAdmin)"
    shared_operations:
      - "Read endpoints; site PATCH (suspend/reopen/closure, shared with ProgramAdmin); ticket report/adjudicate"
  - name: HaulerPartner
    description: "External hauling/processing partner operator; supplies scale data at chipping-run completion. Not tied to a persisted partner entity."
    identity: opaque
    exclusive_operations:
      - "chipping-run complete (shared with ProgramAdmin)"
    shared_operations:
      - "Read endpoints for programs/sites/runs/intake/reports"
  - name: Resident
    description: "A registered household; books curbside pickup, claims mulch, appeals upheld tickets. X-User-ID must equal the Household.id that owns the resource."
    identity: "entity_backed:Household"
    exclusive_operations:
      - "ticket appeal (own household's ticket only)"
    shared_operations:
      - "household registration; booking create/cancel/reschedule (own); claim create/cancel (own); read own household/bookings/claims"
  - name: Volunteer
    description: "An approved program volunteer; signs up for site shifts and may report contamination. X-User-ID must equal the Volunteer.id."
    identity: "entity_backed:Volunteer"
    exclusive_operations:
      - "shift signup/cancel for self"
    shared_operations:
      - "volunteer registration; ticket report; read own volunteer/shift records"
  - name: Anonymous
    description: "Unauthenticated registrant; may only register a household or volunteer (server mints the id used later as X-User-ID)."
    identity: opaque
    exclusive_operations:
      - "POST /households and POST /volunteers (shared with ProgramAdmin)"
    shared_operations: []
