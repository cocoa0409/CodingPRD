      - name: err_associate_agent_required_is_asserted_by_a_difficulty_instance
        claim_type: violation_to_error
        grounds:
          - errors.ERR_ASSOCIATE_AGENT_REQUIRED
        excluded_because:
          difficulty_instance: tour_priority_5_temporal_out_ranks_6_safety
          rationale: "Asserted as the loser of that conflict instance, and as the winner in the corner instance tour_without_associate_at_the_block_threshold_returns_associate_agent_required."

      - name: entity_scoped_not_found_ids_are_distinct_across_the_path_family
        claim_type: violation_to_error
        grounds:
          - errors.ERR_AGENT_NOT_FOUND
          - errors.ERR_CLIENT_NOT_FOUND
          - errors.ERR_LISTING_NOT_FOUND
          - errors.ERR_REFERRAL_NOT_FOUND
          - errors.ERR_REGION_NOT_FOUND
          - errors.ERR_SURVEY_NOT_FOUND
        distinguishing_aspect: "Each resource path carries its own 404 id rather than a shared one: the six reads below each answer with the error named for the entity in the path, so a client that branches on one generic ERR_NOT_FOUND cannot pass."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One region exists; nothing else does."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /regions"
              payload: { name: "Puget Sound", service_area_codes: ["98101"], traditional_commission_pct: 0.025, target_client_ratio: 2.0 }
              as: PlatformAdmin
              captures: { region_id: $.data.id }
          trigger:
            - call: "GET /agents/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: PlatformAdmin
              captures: { err_agent: $.data.error_id }
            - call: "GET /clients/00000000-0000-4000-8000-000000000002"
              payload: {}
              as: PlatformAdmin
              captures: { err_client: $.data.error_id }
            - call: "GET /listing-agreements/00000000-0000-4000-8000-000000000003"
              payload: {}
              as: PlatformAdmin
              captures: { err_listing: $.data.error_id }
            - call: "GET /referrals/00000000-0000-4000-8000-000000000004"
              payload: {}
              as: PlatformAdmin
              captures: { err_referral: $.data.error_id }
            - call: "GET /surveys/00000000-0000-4000-8000-000000000005"
              payload: {}
              as: PlatformAdmin
              captures: { err_survey: $.data.error_id }
            - call: "GET /regions/00000000-0000-4000-8000-000000000006"
              payload: {}
              as: PlatformAdmin
              captures: { err_region: $.data.error_id }
          assert:
            - "err_agent == ERR_AGENT_NOT_FOUND and err_client == ERR_CLIENT_NOT_FOUND"
            - "err_listing == ERR_LISTING_NOT_FOUND and err_referral == ERR_REFERRAL_NOT_FOUND"
            - "err_survey == ERR_SURVEY_NOT_FOUND and err_region == ERR_REGION_NOT_FOUND"
            - "all six responses carry status 404 and response_type error"
            - "the real region at ${region_id} still answers 200 — the 404s did not disturb it"

      - name: listing_registration_under_a_mandatory_enrolment_region_requires_acknowledgement
        claim_type: violation_to_error
        grounds:
          - errors.ERR_ENROLMENT_NOT_CONFIRMED
          - entities.Region.fields.enrolment_is_required
          - endpoints.POST_/listing-agreements/{id}/register
        distinguishing_aspect: "The enrolment rule is flag-conditional: the same registration is a 409 ERR_ENROLMENT_NOT_CONFIRMED in a region with enrolment_is_required true and simply succeeds in one where the flag is false, so the flag alone changes the outcome."
        test_recipe:
