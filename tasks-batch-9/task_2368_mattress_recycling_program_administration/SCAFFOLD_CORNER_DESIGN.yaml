              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-1"
            - call: "POST /registrants"
              payload: { legal_name: "Pacific Bedding Retail LLC", registrant_type: "RETAILER", home_state_code: "CA" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { reg_id: $.data.id }
            - call: "POST /sales-remittances"
              payload: { registrant_id: "${reg_id}", state_program_id: "${prog_ca_id}", period_code: "2026Q2", units_sold_mattress: 500, units_sold_foundation: 0 }
              as: Registrant
