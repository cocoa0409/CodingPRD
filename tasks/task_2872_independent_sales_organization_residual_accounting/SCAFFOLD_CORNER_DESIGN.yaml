      - name: departed_agent_allocation_is_scaled_by_frozen_vesting
        claim_type: Correct Result
        grounds:
          - calculations.residual_split_allocation (pay_tier vesting scaling)
          - calculations.agent_vesting_pct
          - entities.ResidualAllocation.fields.vesting_withheld_cents
          - state_machines.Agent.DEPARTURE_NOTICE_to_DEPARTED
        distinguishing_aspect: "A DEPARTED agent keeps earning on its retained book, but only at vested_pct_at_departure: the allocation's applied_pct stays the NOMINAL 0.50 while gross_allocation_cents is halved to 10000 and the withheld 10000 falls to the house, so iso_retained_cents becomes 30000 instead of 20000. An implementation that scales applied_pct instead of the paid amount is caught."
        test_recipe:
          setup: ["Agent A1 (split 0.50, vesting_start 2024-01-15 -> 50% at the 2026-08-01 clock) owns merchant M1 (equipment 1000) and is taken through notice + depart BEFORE the 2026-07 batch is posted. The portfolio is deliberately not transferred."]
