              as: PharmacyOperations
              captures: { pt_id: $.data.id }
            - call: "POST /pharmacy/prescriptions"
              payload: { patient_id: "${pt_id}", prescriber_npi: "1487654321", drug_name: "Metformin ER", ndc: "00093-1049-01", strength: "500mg", form: "TABLET", copay_tier: "GENERIC", dose_times: ["MORNING"], quantity_per_dose: 1, days_supply_written: 30, refills_authorized: 3, written_date: "2026-05-01", expiration_date: "2027-05-01", last_dispensed_date: "2026-07-25", last_dispensed_days_supply: 28 }
              as: Prescriber
              captures: { rx1: $.data.id }
            - call: "POST /pharmacy/patients/${pt_id}/synchronize"
              payload: { anchor_fill_day: 15, sync_mode: "BRIDGE_TO_START" }
              as: PharmacyOperations
            - call: "POST /pharmacy/fill-cycles"
              payload: { patient_id: "${pt_id}", cycle_start_date: "2026-08-15", day_supply_days: 28 }
              as: PharmacyOperations
              captures: { c1: $.data.id }
            - call: "POST /pharmacy/fill-cycles/${c1}/adjudicate"
              payload: {}
              as: VerifyingPharmacist
            - call: "POST /pharmacy/fill-cycles/${c1}/generate-roll"
              payload: {}
              as: PackagingTechnician
              as_user_id: "tech-01"
              captures: { roll: $.data.id, pouches_built: $.data.pouch_count }
            - call: "POST /pharmacy/pouch-rolls/${roll}/pack"
              payload: {}
              as: PackagingTechnician
              as_user_id: "tech-01"
            - call: "POST /pharmacy/pouch-rolls/${roll}/verification-images"
              payload: { image_confidence_pct: 97, overrides: [{ pouch_index: 7, detected_pill_count: 0 }] }
              as: PackagingTechnician
              as_user_id: "tech-02"
              captures: { mismatch_before: $.data.mismatch_pouch_count }
            - call: "POST /pharmacy/pouch-rolls/${roll}/verify"
              payload: {}
              as: VerifyingPharmacist
              as_user_id: "rph-01"
          trigger:
            - call: "POST /pharmacy/pouch-rolls/${roll}/rework"
              payload: {}
              as: VerifyingPharmacist
              as_user_id: "rph-01"
              captures: { mismatch_after: $.data.mismatch_pouch_count, rework_count: $.data.rework_count, pouches_after: $.data.pouch_count }
          assert:
            - "PouchRoll.${roll}.pouch_count == 28 (1 slot x 28 days) before the failed verification and still 28 after the rework"
            - "before the rework the population partitions as 27 MATCH + 1 MISMATCH_COUNT + 0 UNREADABLE + 0 PENDING + 0 VOID == 28, and mismatch_pouch_count == 1"
            - "the failed verify left verification_status FAILED_QUARANTINED, cycle packaging_status back at ROLL_GENERATED, one CreditMemo reason FAILED_VERIFICATION amount_cents 500 and Patient.credit_balance_cents == 500"
            - "after the rework PouchRoll.${roll}.verification_status == BUILT, rework_count == 1, mismatch_pouch_count == 0"
            - "CONSERVATION: the population partitions as 0 MATCH + 0 MISMATCH_COUNT + 0 UNREADABLE + 28 PENDING + 0 VOID == 28 — every pouch was reset, none deleted and none created, and pouch_index still runs 1..28 over the same (dose_date, dose_slot) pairs"
            - "every pouch has detected_pill_count null, image_confidence_pct null, imaged_by_user_id null and imaged_at null, while expected_pill_count is still 1"
            - "the mismatch ledger stays truthful at both instants: mismatch_pouch_count equals the live count of pouches whose verification_result IS IN {MISMATCH_COUNT, UNREADABLE} (1 before, 0 after)"
            - "the compensation is one-directional on money: the 500-cent goodwill CreditMemo is NOT reversed by the rework, so Patient.credit_balance_cents remains 500"
            - "packed_by_user_id, packed_at, verified_by_user_id and verified_at are all cleared, so tech-01 may pack the rebuilt roll again"
