    roles: [DistrictAdmin]
    code: 200
    input: []
    output: AssetUnit
    side_effects: ["lifecycle_status → DONATED; depreciated_value := salvage_value"]

  - method: POST
    path: "/api/programs/{progId}/asset-units/{assetId}/write-off"
