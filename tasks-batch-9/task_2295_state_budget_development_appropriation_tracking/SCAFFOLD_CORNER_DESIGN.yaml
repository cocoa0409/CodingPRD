      - name: negative_intermediate_committee_balance_rejects_the_whole_insert
        claim_type: Violation → Error
        grounds:
          - validations[priority=33]
          - errors[ERR_NEGATIVE_APPROPRIATION_BALANCE]
          - calculations.committee_running_balance
        distinguishing_aspect: |
          The guard is on every intermediate replay position, not just the final balance: an
          out-of-order sequence-2 DECREASE would leave the chain at -100000000 mid-replay even
          though the final balance after the existing sequence-3 INCREASE would be a healthy
          900000000, so the insert is rejected outright and no stored running balance moves.
        test_recipe:
          setup:
            - "Agency DOH; BudgetCycle 2027 advanced to phase LEGISLATIVE with an ADOPTED GENERAL forecast of 10000000000 cents"
            - "PENDING GENERAL Appropriation P100 introduced 2000000000 with sequence 1 DECREASE 1500000000 and sequence 3 INCREASE 1000000000 already recorded"
          setup_api_calls:
            - call: "POST /fiscal/agencies"
              payload: { agency_code: "DOH", name: "Department of Health", agency_type: "EXECUTIVE" }
              as: SystemAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /fiscal/budget-cycles"
              payload: { fiscal_year: 2027, fiscal_year_start_date: "2026-07-01", reserve_balance_cents: 500000000, constitutional_reserve_pct: 0.05 }
              as: SystemAdmin
              captures: { cyc_id: $.data.id, cyc_v: $.data.version }
            - call: "POST /fiscal/revenue-forecasts"
              payload: { budget_cycle_id: "${cyc_id}", source_code: "SALES_TAX", fund_type: "GENERAL", forecast_round: "CONSENSUS_SPRING", amount_cents: 10000000000, effective_from: "2026-07-01T00:00:00Z", effective_to: "2027-07-01T00:00:00Z", expected_budget_cycle_version: "${cyc_v}" }
              as: BudgetAnalyst
              captures: { fc_id: $.data.id }
            - call: "POST /fiscal/revenue-forecasts/${fc_id}/adopt"
              payload: {}
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/advance-phase"
              payload: { to_phase: "EXECUTIVE_PREP" }
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/certify-balance"
              payload: {}
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/advance-phase"
              payload: { to_phase: "LEGISLATIVE" }
              as: BudgetDirector
            - call: "POST /fiscal/appropriations"
              payload: { budget_cycle_id: "${cyc_id}", agency_id: "${ag_id}", fund_type: "GENERAL", program_code: "P100", introduced_amount_cents: 2000000000 }
              as: LegislativeFiscalOfficer
              captures: { appr_id: $.data.id }
            - call: "POST /fiscal/committee-actions"
              payload: { appropriation_id: "${appr_id}", chamber: "HOUSE", committee_name: "Appropriations", action_type: "DECREASE", amount_cents: 1500000000, sequence_number: 1 }
              as: LegislativeFiscalOfficer
            - call: "POST /fiscal/committee-actions"
              payload: { appropriation_id: "${appr_id}", chamber: "SENATE", committee_name: "Finance", action_type: "INCREASE", amount_cents: 1000000000, sequence_number: 3 }
              as: LegislativeFiscalOfficer
          trigger:
            - call: "POST /fiscal/committee-actions"
              payload: { appropriation_id: "${appr_id}", chamber: "SENATE", committee_name: "Finance", action_type: "DECREASE", amount_cents: 600000000, sequence_number: 2 }
              as: LegislativeFiscalOfficer
            - call: "POST /fiscal/committee-actions"
              payload: { appropriation_id: "${appr_id}", chamber: "SENATE", committee_name: "Finance", action_type: "DECREASE", amount_cents: 500000000, sequence_number: 2 }
              as: LegislativeFiscalOfficer
            - call: "GET /fiscal/appropriations/${appr_id}/committee-actions"
              payload: {}
              as: LegislativeFiscalOfficer
          assert:
            - "the 600000000 insert returns HTTP 422 with error_id == ERR_NEGATIVE_APPROPRIATION_BALANCE, because the sequence-2 position would be -100000000"
            - "the 500000000 insert returns HTTP 201, because the sequence-2 position is exactly 0 and zero is not negative"
            - "the list returns running_balance_cents 500000000, 0, 1000000000 for sequences 1, 2, 3"
            - "Appropriation.${appr_id}.committee_balance_cents == 1000000000"
            - "total_count == 3, so the rejected insert left no row behind"

      - name: certify_balance_without_an_adopted_general_fund_forecast_is_rejected
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=40]
          - errors[ERR_NO_ADOPTED_FORECAST]
          - state_machines.BudgetCycle.EXECUTIVE_PREP_to_EXECUTIVE_PREP
          - calculations.cycle_balance_certification
        distinguishing_aspect: |
          Fund-type-sensitive cross-entity precondition: an ADOPTED DEDICATED forecast is
          enough to advance the cycle into EXECUTIVE_PREP but not to certify the balance,
          because certification reads adopted_general_fund_revenue_cents, which is still 0.
          Adopting a GENERAL forecast then lets the identical call succeed.
        test_recipe:
          setup:
            - "BudgetCycle 2027 with constitutional_reserve_pct 0.05 and one ADOPTED DEDICATED RevenueForecast of 900000000 cents, advanced to phase EXECUTIVE_PREP"
            - "One DRAFT GENERAL RevenueForecast of 10000000000 cents not yet adopted"
