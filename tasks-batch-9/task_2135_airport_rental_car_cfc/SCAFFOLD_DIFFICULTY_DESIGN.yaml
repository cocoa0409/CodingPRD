          Entity pair CapitalProject -> CapitalProject via the self-referential
          predecessor_project_id (a fourth distinct pair): the draw request
          carries a fresh expected_project_version and would otherwise be legal,
          but the predecessor project is still PROPOSED rather than CLOSED, so
          the create is rejected with ERR_PREDECESSOR_NOT_CLOSED.
