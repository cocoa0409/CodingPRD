              payload: {}
              as: Patron
              as_user_id: "${p_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_SLOT_WINDOW"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: slot_capacity_exact_fill_succeeds_one_more_rejects
        grounds:
          - validations[priority=15]
          - entities.TimedEntrySlot.fields.capacity_total
          - entities.TimedEntrySlot.fields.reserved_count
        distinguishing_aspect: |
          Numeric threshold boundary on slot capacity via POST /admission-orders/{id}/confirm:
          reserved_count + party_size == capacity_total succeeds (fills exactly), and one more party
          member (== capacity_total + 1) is rejected with ERR_SLOT_CAPACITY.
        test_recipe:
          setup:
            - "Patron P; slot S capacity_total=2, window 2026-06-10T10:00..12:00Z."
            - "Order O1 CONFIRMED with 2 NON_MEMBER tickets (slot now exactly full, reserved_count==2)."
            - "Order O2 DRAFT with 1 NON_MEMBER ticket on same slot (different patron to avoid overlap rule)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: MembershipAdmin
            - call: "POST /patrons"
              payload: { email: "p11@x.com", full_name: "P Eleven" }
              as: MembershipAdmin
              captures: { p_id: $.data.id }
            - call: "POST /patrons"
              payload: { email: "p11b@x.com", full_name: "P Eleven B" }
              as: MembershipAdmin
              captures: { p2_id: $.data.id }
            - call: "POST /timed-entry-slots"
              payload: { starts_at: "2026-06-10T10:00:00Z", ends_at: "2026-06-10T12:00:00Z", capacity_total: 2, non_member_admission_cents: 2500 }
              as: MembershipAdmin
              captures: { slot_id: $.data.id }
            - call: "POST /admission-orders"
              payload: { patron_id: "${p_id}", slot_id: "${slot_id}" }
              as: Patron
              as_user_id: "${p_id}"
              captures: { o1_id: $.data.id }
            - call: "POST /admission-orders/${o1_id}/tickets"
              payload: { ticket_type: "NON_MEMBER", person_name: "A" }
              as: Patron
              as_user_id: "${p_id}"
            - call: "POST /admission-orders/${o1_id}/tickets"
              payload: { ticket_type: "NON_MEMBER", person_name: "B" }
              as: Patron
              as_user_id: "${p_id}"
            - call: "POST /admission-orders/${o1_id}/confirm"
              payload: {}
              as: Patron
              as_user_id: "${p_id}"
            - call: "POST /admission-orders"
              payload: { patron_id: "${p2_id}", slot_id: "${slot_id}" }
              as: Patron
              as_user_id: "${p2_id}"
              captures: { o2_id: $.data.id }
            - call: "POST /admission-orders/${o2_id}/tickets"
              payload: { ticket_type: "NON_MEMBER", person_name: "C" }
              as: Patron
              as_user_id: "${p2_id}"
          trigger:
            - call: "POST /admission-orders/${o2_id}/confirm"
              payload: {}
              as: Patron
              as_user_id: "${p2_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_SLOT_CAPACITY"
            - "TimedEntrySlot.${slot_id}.reserved_count == 2"

      - name: household_max_exact_fill_succeeds_one_more_rejects
        grounds:
          - validations[priority=16]
          - calculations.household_count
          - entities.MembershipPlan.fields.household_max
        distinguishing_aspect: |
          A different metric (household member count, not slot seats) reached through a different
          endpoint (POST /memberships/{id}/household-members): with household_max=1 the first add
          fills the household exactly (count==1==max) and a second add (count would be 2 > 1) is
          rejected with ERR_HOUSEHOLD_FULL — an exhausted-count boundary on the household endpoint.
        test_recipe:
          setup:
            - "Plan PLAN_DUAL household_max=1; Patron P, membership M."
            - "One household member already added (household count == 1 == max)."
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "DUAL", annual_fee_cents: 12000, household_max: 1, guest_passes_granted: 2, member_admission_cents: 1500 }
              as: MembershipAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /patrons"
              payload: { email: "p12@x.com", full_name: "P Twelve" }
              as: MembershipAdmin
              captures: { p_id: $.data.id }
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", primary_patron_id: "${p_id}" }
              as: Patron
              as_user_id: "${p_id}"
              captures: { m_id: $.data.id }
            - call: "POST /memberships/${m_id}/household-members"
              payload: { full_name: "Spouse", relationship: "SPOUSE" }
              as: Patron
              as_user_id: "${p_id}"
          trigger:
            - call: "POST /memberships/${m_id}/household-members"
              payload: { full_name: "Child", relationship: "CHILD" }
              as: Patron
              as_user_id: "${p_id}"
              captures: { err: $.data.error_id }
          assert:
