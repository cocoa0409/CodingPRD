          assert:
            - "HTTP 409 with data.error_id == \"ERR_TICKET_HAULER_MISMATCH\""
            - "omitting hauler_id from the same body instead yields ERR_HAULER_SCOPE_VIOLATION (403), because the defaulted value is then Green Haul's id"
            - "GET /diversion-consignments/${consignment_id} still shows settlement_status == \"UNBILLED\""

      - name: duplicate_site_code_is_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=100]", "errors[ERR_DUPLICATE_SITE_CODE]", "entities.Site.site_code"]
        distinguishing_aspect: "site_code is globally unique, so a second site reusing HK-01 collides even under a different name and region."
        test_recipe:
          setup: ["One site with site_code HK-01 already exists."]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Harbor Kitchen", site_code: "HK-01", region_code: "NE" }
              as: PlatformAdmin
              as_user_id: "pa-1"
          trigger:
            - call: "POST /sites"
              payload: { name: "Harbor Kitchen Annex", site_code: "HK-01", region_code: "SW" }
              as: PlatformAdmin
              as_user_id: "pa-1"
          assert:
            - "HTTP 409 with data.error_id == \"ERR_DUPLICATE_SITE_CODE\""
            - "GET /sites returns total_count == 1"

      - name: station_code_is_unique_within_a_site_but_reusable_across_sites
        claim_type: violation_to_error
        grounds: ["validations[priority=100]", "errors[ERR_DUPLICATE_STATION_CODE]", "entities.TrackingStation.station_code"]
        distinguishing_aspect: "The uniqueness key is the pair (site_id, station_code), so PREP-1 collides inside HK-01 yet is perfectly legal at HK-02 — the scoped key and the global keys behave differently."
        test_recipe:
          setup: ["Two sites, HK-01 and HK-02; HK-01 already owns a station coded PREP-1."]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Harbor Kitchen", site_code: "HK-01", region_code: "NE" }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { site_a_id: "$.data.id" }
            - call: "POST /sites"
              payload: { name: "Hillside Kitchen", site_code: "HK-02", region_code: "NE" }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { site_b_id: "$.data.id" }
            - call: "POST /tracking-stations"
              payload: { site_id: "${site_a_id}", station_code: "PREP-1", station_kind: "PREP", calibration_due_at: "2026-12-31T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "pa-1"
          trigger:
            - call: "POST /tracking-stations"
              payload: { site_id: "${site_a_id}", station_code: "PREP-1", station_kind: "HOT_LINE", calibration_due_at: "2026-12-31T00:00:00Z" }
