            - { call: "POST /bundles/${bd}/bids", payload: { amount_cents: 50000, expected_bundle_version: "${bd_v}" }, as: Bidder, as_user_id: "${br}" }
            - { call: "POST /gala-events/${ev}/advance", payload: {}, as: GalaAdmin }
            - { call: "POST /gala-events/${ev}/advance", payload: {}, as: GalaAdmin, captures: { ev_st: "$.data.status" } }
          trigger:
            - { call: "POST /gala-events/${ev}/reconcile", payload: {}, as: FinanceOfficer, captures: { err_id: "$.data.error_id" } }
