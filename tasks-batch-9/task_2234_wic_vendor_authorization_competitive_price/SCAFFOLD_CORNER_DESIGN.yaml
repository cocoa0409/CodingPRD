            - "GET /price-submissions/${sub_1} reports status == VOIDED with voided_reason == VENDOR_DISQUALIFIED — the deny cascade voids submissions whose cycle is OPEN"
            - "GET /peer-groups/${pg_a} reports member_count == 0 and version == 1: v1 was IN_REVIEW, never a member, so no decrement and no version bump occurred"
            - "submit-application, authorize, start-reauthorization and a second deny each return HTTP 409 with error.id == ERR_INVALID_VENDOR_STATE"
