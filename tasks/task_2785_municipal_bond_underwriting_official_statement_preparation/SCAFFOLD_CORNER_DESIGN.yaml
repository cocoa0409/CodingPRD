      - name: clock_advance_promotes_only_presentations_whose_end_has_passed
        claim_type: cross_entity
        grounds:
          - state_machines.RatingPresentation.SCHEDULED_to_HELD
          - endpoints[POST /bond-offerings/_clock/set_current_utc]
        distinguishing_aspect: |
          The promotion boundary is inclusive on ends_at and the clock advance is a cross-entity
          side effect of an endpoint that touches no presentation id. With slots 09:00-10:00 and
          12:00-13:00 on the same agency-day, moving the clock to exactly 10:00:00.000Z promotes
          the first (ends_at <= now) and leaves the second SCHEDULED; a strict '>' comparison
          promotes neither and a naive 'starts_at <= now' promotes only by start time.
        test_recipe:
          setup:
            - "A DRAFT deal carries one Moody's engagement with two SCHEDULED presentations 120 minutes apart (09:00-10:00 and 12:00-13:00), which satisfies the 60-minute per-agency buffer."
            - "The logical clock is at its 2026-08-01T00:00:00.000Z default."
          setup_api_calls:
            - call: "POST /bond-offerings/firms"
              payload: { name: "Beta Municipal Advisors", firm_type: "MUNICIPAL_ADVISOR", msrb_registration_id: "MA0001" }
              as: ComplianceOfficer
              captures: { ma_firm_id: $.data.id }
