  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: impact_recording_blocked_by_expired_bench_calibration
        grounds:
          - validations.v-bench-calibration-current
          - entities.TestBench.fields.calibration_valid_until
          - state_machines.ShellTest.status.SCHEDULED_to_COMPLETED
          - errors.ERR_BENCH_CALIBRATION_EXPIRED
        distinguishing_aspect: |
          The blocking state lives on TestBench, a sibling of the entity being
          written: the session was legally scheduled while the bench was in
          calibration, but calibration_valid_until 2026-08-05 has lapsed by the
          time the clock reads 2026-08-06, so record-impacts must fail with
          ERR_BENCH_CALIBRATION_EXPIRED and leave the ShellTest SCHEDULED with
          severity_index null. Checking calibration only at scheduling time
          passes this call.
        test_recipe:
          setup:
            - "one unit in recon_status INSPECTED with inspection_verdict_summary CLEAR"
            - "one TestBench whose calibration_valid_until is 2026-08-05T00:00:00Z"
            - "a ShellTest SCHEDULED on that bench for the window 2026-08-06T09:00:00Z..10:00:00Z, booked while the clock still read 2026-08-01"
            - "the clock then advanced to 2026-08-06T09:00:00Z so the calibration has lapsed"
          setup_api_calls:
            - *c_clock
            - *c_model
            - *c_acct
            - *c_waiver
            - call: "POST /intake-shipments"
              payload: { customer_account_id: "${acct_id}", sport: "FOOTBALL", service_tier: "STANDARD", declared_unit_count: 1, season_start_date: "2026-08-25T00:00:00Z", season_end_date: "2026-11-20T00:00:00Z" }
