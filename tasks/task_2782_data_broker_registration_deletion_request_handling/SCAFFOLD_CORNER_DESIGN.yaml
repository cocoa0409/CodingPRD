          assert:
            - "before the first sweep, DataBroker.${broker_id}.registry_standing == COMPLIANT with delinquent_since == null"
            - "${quiet_swept_at} == 2026-09-01T00:00:00Z and ${quiet_expired} == 0"
            - "the first sweep also reports expired_suppression_count == 0, abandoned_task_count == 0, honored_signal_count == 0 and escalated_inquiry_count == 0"
            - "${live_swept_at} == 2027-03-01T00:00:00Z and ${live_expired} == 1"
