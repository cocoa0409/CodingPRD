# =====================================================================
# PRD Benchmark Scaffold — Obstacle Race Wave Start & Course Operations
# §1.0–§1.7. Difficulty design → SCAFFOLD_DIFFICULTY_DESIGN.yaml
#            Corner design    → SCAFFOLD_CORNER_DESIGN.yaml
# =====================================================================

scenario: "2924. Obstacle Race Wave Start & Course Operations (obstacle course race producer): venue selection with terrain, water access and land-use permitting for temporary courses, course design with obstacle placement, difficulty progression and bypass or penalty options, wave start scheduling by heat with capacity per wave and bottleneck modeling at obstacles, participant categories across competitive, open and team divisions with separate rules, obstacle marshaling, safety staffing and medical coverage plan across the course, timing with obstacle penalties and disqualification handling, festival area operations with bag check, rinse stations and spectator zones, land restoration and post-event site remediation"

domain_name: "obstacle-course-race-operations"
api_prefix: "/ocr"

complexity_profile:
  difficulty_level: Expert
  primary_archetype: temporal_windowing
  secondary_archetype: posture-driven gating
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: graph
  # Venue/Course/Obstacle form a containment spine, but Obstacle references
  # itself (paired bypass lane), Wave joins Course x Division, Entry joins
  # Wave x Participant, ObstacleAttempt joins Entry x Obstacle, and Entry
  # points back at an ObstacleAttempt (the disputed attempt) — the reference
  # set is a graph, not a tree.

  state_machine_shape: parallel
  # Wave carries two orthogonal state fields (release_status, roster_status)
  # that advance on separate triggers; Entry.result_status is cyclic
  # (PROVISIONAL -> UNDER_PROTEST -> PROVISIONAL, bounded by protest_rounds);
  # RestorationTask is cyclic (VERIFIED -> REMEDIATION_REQUIRED -> VERIFIED);
  # LandUsePermit is cyclic (SUBMITTED -> REVISION_REQUESTED -> SUBMITTED);
  # Course.status is compound (auto-COMPLETED when its last wave closes).

  relationship_patterns:
    - one_to_many          # Venue -> LandUsePermit / Course / FestivalService / RestorationTask
    - many_to_many         # Entry joins Wave x Participant; ObstacleAttempt joins Entry x Obstacle
    - self_referential     # Obstacle.paired_obstacle_id -> Obstacle.id (bypass lane pairing)
    - cross_aggregate      # Entry.disputed_attempt_id -> ObstacleAttempt.id; StaffAssignment spans Course x Obstacle

  role_model: segregation_of_duties
  # The user id that submits a LandUsePermit may not decide it; the user id
  # that recorded an ObstacleAttempt may not adjudicate a protest against it.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================

entities:
  - name: Venue
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Venue trade name", constraints: "1..120 chars" }
      - { name: terrain_type, type: enum, source: input, description: "Dominant terrain of the parcel", constraints: "FIELD | FOREST | QUARRY | SKI_SLOPE" }
      - { name: water_access, type: enum, source: input, description: "Natural water feature usable for water obstacles", constraints: "NONE | POND | RIVER" }
      - { name: land_use_zone, type: string, source: input, description: "Municipal zoning code of the parcel", constraints: "1..40 chars" }
      - { name: protected_acreage_sqm, type: integer, source: input, description: "Square metres of the parcel flagged as protected habitat and excluded from any course footprint", constraints: ">= 0" }
      - { name: restoration_bond_cents, type: integer, source: input, description: "Restoration bond posted with the land authority, in cents; immutable after creation", constraints: ">= 0" }
      - { name: disturbed_area_sqm, type: integer, source: computed, description: "Sum of Obstacle.footprint_sqm over every Obstacle whose Course.venue_id == this venue and Course.status IN {DRAFT, VALIDATED, PUBLISHED, SUSPENDED, COMPLETED}, plus sum of FestivalService.footprint_sqm over every FestivalService with venue_id == this venue (no status filter; footprint is physical disturbance)", default: 0 }
      - { name: bond_released_cents, type: integer, source: computed, description: "Cents of the restoration bond returned to the producer so far", default: 0 }
      - { name: bond_forfeited_cents, type: integer, source: computed, description: "Cents of the restoration bond kept by the land authority as a late-remediation penalty", default: 0 }
      - { name: bond_held_cents, type: integer, source: computed, description: "restoration_bond_cents - bond_released_cents - bond_forfeited_cents; the conserved-quantity residual, so it equals restoration_bond_cents on creation and the three cent fields always sum back to restoration_bond_cents", default: 0 }
      - { name: site_posture, type: enum, source: computed, description: "Venue-level gate: OPEN normally, FROZEN once the governing permit is DENIED or EXPIRED, CLOSED_OUT after a FINAL bond settlement", default: "OPEN", constraints: "OPEN | FROZEN | CLOSED_OUT" }

  - name: LandUsePermit
    parent: Venue
    common_fields: true
    fields:
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id; the parcel this permit governs" }
      - { name: permit_number, type: string, source: input, description: "Authority-issued permit number", constraints: "unique across all LandUsePermit rows" }
      - { name: water_use_allowed, type: boolean, source: input, description: "Whether water may be drawn or entered on the parcel" }
      - { name: max_disturbed_area_sqm, type: integer, source: input, description: "Hard cap on Venue.disturbed_area_sqm while this permit governs", constraints: "> 0" }
      - { name: quiet_hours_start_hour_utc, type: integer, source: input, description: "First UTC hour of the nightly quiet window (inclusive)", constraints: "0..23" }
      - { name: quiet_hours_end_hour_utc, type: integer, source: input, description: "First UTC hour after the nightly quiet window (exclusive)", constraints: "0..23" }
      - { name: valid_until_utc, type: datetime, source: input, description: "Instant after which an APPROVED permit becomes EXPIRED" }
      - { name: restoration_deadline_utc, type: datetime, source: input, description: "Instant by which site remediation must be settled before late penalties accrue" }
      - { name: status, type: enum, source: computed, description: "Permit lifecycle state", default: "DRAFT", constraints: "DRAFT | SUBMITTED | REVISION_REQUESTED | APPROVED | DENIED | EXPIRED" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the CourseDesigner on the most recent submit; null while DRAFT", default: null }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the PermitOfficer on the most recent decision", default: null }
      - { name: revision_rounds, type: integer, source: computed, description: "Count of REVISION_REQUESTED decisions issued on this permit", default: 0 }
      - { name: decision_note, type: string, source: input, description: "Free-text rationale from the most recent decision", default: null }

  - name: Course
    parent: Venue
    common_fields: true
    fields:
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id; the parcel this temporary course is laid on" }
      - { name: name, type: string, source: input, description: "Course name as printed on the participant map", constraints: "1..120 chars" }
      - { name: total_distance_m, type: integer, source: input, description: "Advertised course distance in metres", constraints: "> 0" }
      - { name: corral_release_rate_per_min, type: number, source: input, description: "Upper bound on participants the start corral can push onto the course per minute; caps every obstacle clearance rate", constraints: "> 0, 2 decimals" }
      - { name: corral_throughput_capacity, type: integer, source: input, description: "Maximum number of participants that may occupy the start corral window at once; the aggregate capacity budget for overlapping wave occupancy intervals", constraints: "> 0" }
      - { name: obstacle_count, type: integer, source: computed, description: "Count of Obstacle rows with course_id == this course", default: 0 }
      - { name: difficulty_progression_score, type: number, source: computed, description: "Mean per-station difficulty gain; see calculations.course_difficulty_progression", default: 0 }
      - { name: design_capacity_pph, type: integer, source: computed, description: "Staffing-independent design throughput in participants per hour; see calculations.course_design_capacity", default: 0 }
      - { name: bottleneck_capacity_pph, type: integer, source: computed, description: "Live staffing-aware throughput in participants per hour; see calculations.course_bottleneck_capacity", default: 0 }
      - { name: status, type: enum, source: computed, description: "Course design/operations lifecycle", default: "DRAFT", constraints: "DRAFT | VALIDATED | PUBLISHED | SUSPENDED | COMPLETED" }
      - { name: readiness_posture, type: enum, source: computed, description: "Derived safety gate over child obstacles and staffing; see calculations.course_readiness_posture", default: "RESTRICTED", constraints: "OPEN | RESTRICTED | FROZEN" }
      - { name: medic_headcount, type: integer, source: computed, description: "Count of StaffAssignment rows with course_id == this course, staff_role == MEDIC and status == CONFIRMED", default: 0 }
      - { name: water_safety_headcount, type: integer, source: computed, description: "Count of StaffAssignment rows with course_id == this course, staff_role == WATER_SAFETY and status == CONFIRMED", default: 0 }
      - { name: scheduled_capacity_total, type: integer, source: computed, description: "Sum of Wave.capacity over Wave rows with course_id == this course and release_status IN {SCHEDULED, HELD, RELEASED, STARTED}", default: 0 }

  - name: Obstacle
    parent: Course
    common_fields: true
    fields:
      - { name: course_id, type: string, source: input, description: "FK -> Course.id; the course this obstacle stands on" }
      - { name: paired_obstacle_id, type: string, source: input, description: "FK -> Obstacle.id; when this obstacle is a bypass lane, the primary obstacle it relieves; null for a primary obstacle", default: null }
      - { name: name, type: string, source: input, description: "Obstacle name on the course map", constraints: "1..80 chars" }
      - { name: station_index, type: integer, source: input, description: "1-based position along the course; unique per course", constraints: ">= 1" }
      - { name: difficulty_rating, type: integer, source: input, description: "Designer-assigned difficulty on the producer's 1..10 scale", constraints: "1..10" }
      - { name: lane_count, type: integer, source: input, description: "Number of parallel lanes at the obstacle", constraints: ">= 1" }
      - { name: service_rate_per_min, type: number, source: input, description: "Participants one lane clears per minute when fully marshaled", constraints: "> 0, 2 decimals" }
      - { name: marshals_required, type: integer, source: input, description: "Confirmed MARSHAL assignments needed for full staffing", constraints: ">= 1" }
      - { name: footprint_sqm, type: integer, source: input, description: "Ground disturbance of this obstacle in square metres", constraints: "> 0" }
      - { name: water_contact, type: boolean, source: input, description: "Whether participants enter water at this obstacle" }
      - { name: bypass_mode, type: enum, source: input, description: "How a participant may skip the obstacle: NONE (no bypass exists), PENALTY_LOOP (run a loop instead), TIMED_PENALTY (accept added seconds), MANDATORY (completion required, bypass impossible)", constraints: "NONE | PENALTY_LOOP | TIMED_PENALTY | MANDATORY" }
      - { name: penalty_seconds, type: integer, source: input, description: "Seconds added for a bypass or a failed attempt at this obstacle", constraints: ">= 0" }
      - { name: confirmed_marshal_count, type: integer, source: computed, description: "Count of StaffAssignment rows with obstacle_id == this obstacle, staff_role == MARSHAL and status == CONFIRMED", default: 0 }
      - { name: staffing_state, type: enum, source: computed, description: "UNSTAFFED when confirmed_marshal_count == 0, PARTIAL when 0 < confirmed_marshal_count < marshals_required, MARSHALED when confirmed_marshal_count >= marshals_required", default: "UNSTAFFED", constraints: "UNSTAFFED | PARTIAL | MARSHALED" }
      - { name: design_clearance_rate_per_min, type: number, source: computed, description: "Staffing-independent clearance rate; see calculations.obstacle_design_clearance_rate", default: 0 }
      - { name: effective_clearance_rate_per_min, type: number, source: computed, description: "Live staffing-aware clearance rate; see calculations.obstacle_effective_clearance_rate", default: 0 }

  - name: Division
    parent: null
    common_fields: false
    fields:
      - { name: name, type: string, source: input, description: "Division name printed on results", constraints: "1..80 chars" }
      - { name: division_type, type: enum, source: input, description: "Rule family: COMPETITIVE (chip-timed, bypass disqualifies), OPEN (gun-timed, bypass costs seconds), TEAM (gun-timed, every obstacle mandatory, team roster minimum enforced at wave start)", constraints: "COMPETITIVE | OPEN | TEAM" }
      - { name: bypass_policy, type: enum, source: input, description: "What a BYPASSED ObstacleAttempt does in this division", constraints: "ALLOWED_WITH_PENALTY | DQ_ON_BYPASS | MANDATORY_COMPLETION" }
      - { name: scoring_mode, type: enum, source: input, description: "Which start instant the official elapsed time is measured from", constraints: "GUN_TIME | CHIP_TIME" }
      - { name: min_age, type: integer, source: input, description: "Minimum age (calendar-year difference) to enter this division", constraints: "0..99" }
      - { name: team_size_min, type: integer, source: input, description: "Minimum checked-in entries sharing a team_code before a wave carrying this division may start", constraints: ">= 1" }
      - { name: team_size_max, type: integer, source: input, description: "Maximum entries sharing a team_code in one wave", constraints: ">= team_size_min" }

  - name: Wave
    parent: Course
    common_fields: true
    fields:
      - { name: course_id, type: string, source: input, description: "FK -> Course.id; the course this heat runs on" }
      - { name: division_id, type: string, source: input, description: "FK -> Division.id; the single division this heat carries" }
      - { name: wave_code, type: string, source: input, description: "Heat label, e.g. A1", constraints: "unique per course" }
      - { name: scheduled_start_utc, type: datetime, source: input, description: "Planned gun instant; anchors the start-corral occupancy interval" }
      - { name: capacity, type: integer, source: input, description: "Maximum entries assignable to this heat", constraints: ">= 1" }
      - { name: assigned_count, type: integer, source: computed, description: "Count of Entry rows with wave_id == this wave (entries are never deleted; reassignment moves the row)", default: 0 }
      - { name: release_status, type: enum, source: computed, description: "Start-line dimension of the heat, advanced by hold/release/start/close", default: "SCHEDULED", constraints: "SCHEDULED | HELD | RELEASED | STARTED | CLOSED" }
      - { name: roster_status, type: enum, source: computed, description: "Roster dimension of the heat, advanced independently of release_status by lock-roster and by the start transition", default: "OPEN", constraints: "OPEN | LOCKED | SEALED" }
      - { name: hold_reason, type: string, source: input, description: "Why the heat is HELD; set by the hold transition, cleared on unhold", default: null }
      - { name: actual_start_utc, type: datetime, source: system, description: "Logical-clock instant stamped by the start transition; the gun time", default: null }
      - { name: closed_at_utc, type: datetime, source: system, description: "Logical-clock instant stamped by the close transition", default: null }

  - name: Participant
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Legal name", constraints: "1..120 chars" }
      - { name: birth_year, type: integer, source: input, description: "Four-digit birth year; age is the calendar-year difference against the wave's scheduled start", constraints: "1900..2026" }
      - { name: email, type: string, source: input, description: "Contact address", constraints: "unique across all Participant rows" }
      - { name: chip_id, type: string, source: input, description: "Timing chip serial bonded to this participant", constraints: "unique across all Participant rows" }
      - { name: waiver_signed, type: boolean, source: computed, description: "True once the waiver transition has been accepted", default: false }
      - { name: medical_flags, type: array, source: input, description: "Self-declared conditions from the waiver; any of CARDIAC, PREGNANCY, RECENT_SURGERY forces MEDICALLY_HELD", default: [] }
      - { name: clearance_status, type: enum, source: computed, description: "PENDING until the waiver is signed, CLEARED when signed with no blocking medical flag, MEDICALLY_HELD when signed with a blocking flag", default: "PENDING", constraints: "PENDING | CLEARED | MEDICALLY_HELD" }

  - name: Entry
    parent: Wave
    common_fields: true
    fields:
      - { name: wave_id, type: string, source: input, description: "FK -> Wave.id; the heat this entry currently sits in" }
      - { name: participant_id, type: string, source: input, description: "FK -> Participant.id; the human running this entry" }
      - { name: disputed_attempt_id, type: string, source: input, description: "FK -> ObstacleAttempt.id; the attempt named by the open or most recent protest; null before any protest", default: null }
      - { name: bib_number, type: integer, source: input, description: "Printed bib; unique per wave", constraints: ">= 1" }
      - { name: team_code, type: string, source: input, description: "Team roster key; required when the wave's division_type == TEAM, forbidden otherwise", default: null }
      - { name: bag_tag_code, type: string, source: input, description: "Bag-check tag issued at check-in", default: null }
      - { name: chip_start_offset_seconds, type: integer, source: input, description: "Seconds after the gun at which this participant crossed the start mat, recorded at check-in", default: 0, constraints: ">= 0" }
      - { name: chip_start_utc, type: datetime, source: computed, description: "wave.actual_start_utc + chip_start_offset_seconds, stamped by the wave start transition", default: null }
      - { name: finish_recorded_utc, type: datetime, source: system, description: "Logical-clock instant stamped by the finish transition", default: null }
      - { name: progress_status, type: enum, source: computed, description: "Where the entry is in the physical race", default: "REGISTERED", constraints: "REGISTERED | CHECKED_IN | STARTED | FINISHED | DNF | DNS" }
      - { name: result_status, type: enum, source: computed, description: "Where the entry is in results processing; cycles through UNDER_PROTEST", default: "PENDING", constraints: "PENDING | PROVISIONAL | UNDER_PROTEST | OFFICIAL | DISQUALIFIED | NOT_CLASSIFIED" }
      - { name: provisional_penalty_seconds, type: integer, source: computed, description: "Penalty seconds under the provisional reading; see calculations.entry_elapsed_time variant provisional_gun_to_mat", default: 0 }
      - { name: provisional_elapsed_seconds, type: integer, source: computed, description: "Provisional elapsed time in seconds, stamped by the finish transition", default: null }
      - { name: official_penalty_seconds, type: integer, source: computed, description: "Penalty seconds under the official reading; see calculations.entry_elapsed_time variant official_adjudicated", default: 0 }
      - { name: official_elapsed_seconds, type: integer, source: computed, description: "Official elapsed time in seconds, stamped when the entry reaches OFFICIAL or when an UPHELD_ADJUSTED adjudication lands", default: null }
      - { name: protest_rounds, type: integer, source: computed, description: "Count of protests already adjudicated on this entry", default: 0 }
      - { name: voided_attempt_ids, type: array, source: computed, description: "Ids of ObstacleAttempt rows whose penalty an UPHELD_ADJUSTED adjudication voided; excluded from the official reading", default: [] }
      - { name: dq_reason, type: string, source: computed, description: "Why the entry is DISQUALIFIED: BYPASS_IN_DQ_DIVISION | ADJUDICATED_DQ", default: null }

  - name: ObstacleAttempt
    parent: Entry
    common_fields: false
    fields:
      - { name: entry_id, type: string, source: input, description: "FK -> Entry.id; the entry this attempt belongs to" }
      - { name: obstacle_id, type: string, source: input, description: "FK -> Obstacle.id; the obstacle attempted" }
      - { name: outcome, type: enum, source: input, description: "COMPLETED (cleared), BYPASSED (took the bypass lane or loop), FAILED_PENALTY (attempted and failed, penalty accepted), SKIPPED_UNMARSHALED (station was unstaffed and waved through)", constraints: "COMPLETED | BYPASSED | FAILED_PENALTY | SKIPPED_UNMARSHALED" }
      - { name: recorded_at, type: datetime, source: system, description: "Logical-clock instant at which the attempt was recorded; the chronological key for penalty accumulation" }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID of the actor who recorded the attempt; blocks that same id from adjudicating a protest against it" }
      - { name: recorded_by_role, type: string, source: system, description: "X-User-Role of the actor who recorded the attempt" }
      - { name: provisional_penalty_seconds, type: integer, source: computed, description: "Seconds this attempt contributes under the provisional reading", default: 0 }
      - { name: obstacle_staffing_state_at_record, type: enum, source: system, description: "Snapshot of Obstacle.staffing_state when the attempt was recorded", constraints: "UNSTAFFED | PARTIAL | MARSHALED" }

  - name: StaffAssignment
    parent: Course
    common_fields: true
    fields:
      - { name: course_id, type: string, source: input, description: "FK -> Course.id; the course this shift covers" }
      - { name: obstacle_id, type: string, source: input, description: "FK -> Obstacle.id; the station this shift covers; required for MARSHAL and WATER_SAFETY, must be omitted for MEDIC and SWEEP", default: null }
      - { name: staff_person_id, type: string, source: input, description: "Opaque identifier of the human being scheduled; the resource whose shift intervals must not collide", constraints: "1..40 chars" }
      - { name: staff_role, type: enum, source: input, description: "Duty performed on the shift", constraints: "MARSHAL | MEDIC | WATER_SAFETY | SWEEP" }
      - { name: certification_level, type: enum, source: input, description: "Credential held", constraints: "BASIC | ADVANCED | PARAMEDIC | LIFEGUARD" }
      - { name: shift_start_utc, type: datetime, source: input, description: "Shift start instant (inclusive)" }
      - { name: shift_end_utc, type: datetime, source: input, description: "Shift end instant (inclusive); must be after shift_start_utc" }
      - { name: status, type: enum, source: computed, description: "CONFIRMED on creation, VACATED once the person is released from the shift", default: "CONFIRMED", constraints: "CONFIRMED | VACATED" }
      - { name: vacate_reason, type: string, source: input, description: "Why the shift was vacated", default: null }

  - name: FestivalService
    parent: Venue
    common_fields: true
    fields:
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id; the parcel this festival installation sits on" }
      - { name: service_type, type: enum, source: input, description: "Festival-area function", constraints: "BAG_CHECK | RINSE_STATION | SPECTATOR_ZONE" }
      - { name: footprint_sqm, type: integer, source: input, description: "Ground disturbance of the installation in square metres", constraints: "> 0" }
      - { name: capacity, type: integer, source: input, description: "People the installation serves at once", constraints: ">= 1" }
      - { name: water_draw_lpm, type: integer, source: input, description: "Litres per minute drawn from the venue's water source; a positive value requires water_use_allowed on the governing permit", default: 0, constraints: ">= 0" }
      - { name: status, type: enum, source: computed, description: "OPEN on creation; CLOSED once the venue is FROZEN", default: "OPEN", constraints: "OPEN | CLOSED" }

  - name: RestorationTask
    parent: Venue
    common_fields: true
    fields:
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id; the parcel being remediated" }
      - { name: task_type, type: enum, source: input, description: "Remediation work performed", constraints: "RESEED | DECOMPACT | SILT_REMOVAL | DEBRIS_SWEEP" }
      - { name: area_sqm, type: integer, source: input, description: "Square metres this task remediates; the weight in the bond-release split", constraints: "> 0" }
      - { name: status, type: enum, source: computed, description: "PENDING on creation; VERIFIED once an inspection passes; REMEDIATION_REQUIRED once an inspection fails (re-inspection may return it to VERIFIED)", default: "PENDING", constraints: "PENDING | VERIFIED | REMEDIATION_REQUIRED" }
      - { name: bond_release_cents, type: integer, source: computed, description: "Cents of the restoration bond attributed to this task; see calculations.restoration_bond_release", default: 0 }
      - { name: inspection_rounds, type: integer, source: computed, description: "Count of inspections recorded against this task", default: 0 }
      - { name: findings_note, type: string, source: input, description: "Inspector note from the most recent inspection", default: null }

# =====================================================================
# §1.2 State Machine Table
# =====================================================================

state_machines:
  - entity: Venue
    state_field: site_posture
    initial_state: OPEN
    terminal_states: [CLOSED_OUT]
    transitions:
      - from: OPEN
        to: FROZEN
        trigger: "system: any LandUsePermit with venue_id == this venue reaches DENIED (POST /ocr/permits/{id}/decision) or EXPIRED (POST /ocr/_clock/set_current_utc). The rule is deliberately unconditional — a denial or expiry freezes the parcel even when another permit on the same venue still has status == APPROVED."
        actor: system
        preconditions: ["site_posture == OPEN"]
        side_effects:
          - "cascade link 2 of the permit-denial chain: every Course with venue_id == this venue and status IN {DRAFT, VALIDATED, PUBLISHED} moves to SUSPENDED (link 3)"
          - "every FestivalService with venue_id == this venue and status == OPEN moves to CLOSED (fan-out caused by this same link 2)"
          - "increments Venue.version by 1 and refreshes updated_at"
      - from: OPEN
        to: CLOSED_OUT
        trigger: "POST /ocr/venues/{id}/bond-releases with settlement_type == FINAL"
        actor: PermitOfficer
        preconditions:
          - "site_posture == OPEN"
          - "every RestorationTask with venue_id == this venue has status == VERIFIED and at least one such task exists"
          - "expected_venue_version equals the current Venue.version"
        side_effects:
          - "recomputes calculations.restoration_bond_release variant final_closeout: sets bond_released_cents, bond_forfeited_cents, bond_held_cents"
          - "assigns the rounding remainder to one RestorationTask.bond_release_cents (largest area_sqm, tie-break created_at ASC)"
          - "increments Venue.version by 1 and refreshes updated_at"

  - entity: LandUsePermit
    state_field: status
    initial_state: DRAFT
    terminal_states: [APPROVED, DENIED, EXPIRED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /ocr/permits/{id}/submit"
        actor: CourseDesigner
        preconditions: ["status == DRAFT", "venue.site_posture == OPEN"]
        side_effects: ["sets submitted_by_user_id to the acting X-User-ID", "increments LandUsePermit.version by 1"]
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /ocr/permits/{id}/submit"
        actor: CourseDesigner
        preconditions: ["status == REVISION_REQUESTED", "venue.site_posture == OPEN"]
        side_effects: ["overwrites submitted_by_user_id with the acting X-User-ID", "increments LandUsePermit.version by 1"]
        note: "The revision loop: SUBMITTED -> REVISION_REQUESTED -> SUBMITTED. revision_rounds counts the loop iterations and is not bounded."
      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /ocr/permits/{id}/decision with decision == REVISION_REQUESTED"
        actor: PermitOfficer
        preconditions: ["status == SUBMITTED", "acting X-User-ID != submitted_by_user_id"]
        side_effects: ["increments revision_rounds by 1", "sets decided_by_user_id and decision_note", "increments LandUsePermit.version by 1"]
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /ocr/permits/{id}/decision with decision == APPROVED"
        actor: PermitOfficer
        preconditions:
          - "status == SUBMITTED"
          - "acting X-User-ID != submitted_by_user_id"
          - "no other LandUsePermit with the same venue_id has status == APPROVED"
        side_effects: ["sets decided_by_user_id and decision_note", "increments LandUsePermit.version by 1", "recomputes readiness_posture on every Course of the venue"]
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /ocr/permits/{id}/decision with decision == DENIED"
        actor: PermitOfficer
        preconditions: ["status == SUBMITTED", "acting X-User-ID != submitted_by_user_id"]
        side_effects:
          - "cascade link 1: sets status = DENIED, decided_by_user_id, decision_note"
          - "cascade link 2 (caused by link 1): Venue.site_posture -> FROZEN"
          - "cascade link 3 (caused by link 2): every Course with venue_id == this venue and status IN {DRAFT, VALIDATED, PUBLISHED} -> SUSPENDED and readiness_posture -> FROZEN"
          - "cascade link 4 (caused by link 3): every Wave on those courses with release_status IN {SCHEDULED, HELD} -> HELD with hold_reason = 'VENUE_FROZEN'"
          - "fan-out of link 2: every FestivalService with venue_id == this venue and status == OPEN -> CLOSED"
          - "increments the version of every row it touches by 1"
      - from: APPROVED
        to: EXPIRED
        trigger: "POST /ocr/_clock/set_current_utc when the new clock value is strictly after valid_until_utc"
        actor: system
        preconditions: ["status == APPROVED", "valid_until_utc < new clock value"]
        side_effects:
          - "Venue.site_posture -> FROZEN, then the same link 3 / link 4 / fan-out chain as the DENIED transition"
          - "returns the permit id in the set_current_utc response field expired_permit_ids"

  - entity: Course
    state_field: status
    initial_state: DRAFT
    terminal_states: [SUSPENDED, COMPLETED]
    transitions:
      - from: DRAFT
        to: VALIDATED
        trigger: "POST /ocr/courses/{id}/validate"
        actor: CourseDesigner
        preconditions:
          - "status == DRAFT"
          - "venue.site_posture == OPEN"
          - "the venue has exactly one LandUsePermit with status == APPROVED (the governing permit)"
          - "obstacle_count >= MIN_OBSTACLES (3)"
          - "difficulty_progression_score >= MIN_PROGRESSION_SCORE (0.50)"
          - "no consecutive station pair regresses by more than MAX_REGRESSION (2) difficulty points"
          - "no Obstacle with water_contact == true unless the governing permit has water_use_allowed == true"
          - "venue.disturbed_area_sqm <= governing permit.max_disturbed_area_sqm"
        side_effects: ["recomputes obstacle_count, difficulty_progression_score, design_capacity_pph", "recomputes readiness_posture", "freezes the obstacle set: POST /ocr/courses/{id}/obstacles is rejected from VALIDATED onward", "increments Course.version by 1"]
      - from: VALIDATED
        to: PUBLISHED
        trigger: "POST /ocr/courses/{id}/publish"
        actor: RaceDirector
        preconditions: ["status == VALIDATED", "venue.site_posture == OPEN", "readiness_posture != FROZEN"]
        side_effects: ["recomputes readiness_posture", "increments Course.version by 1"]
      - from: DRAFT
        to: SUSPENDED
        trigger: "system: cascade link 3 of the venue-freeze chain"
        actor: system
        preconditions: ["venue.site_posture == FROZEN"]
        side_effects: ["readiness_posture -> FROZEN", "cascade link 4: every Wave with release_status IN {SCHEDULED, HELD} -> HELD with hold_reason = 'VENUE_FROZEN'", "increments Course.version by 1"]
      - from: VALIDATED
        to: SUSPENDED
        trigger: "system: cascade link 3 of the venue-freeze chain"
        actor: system
        preconditions: ["venue.site_posture == FROZEN"]
        side_effects: ["same as the DRAFT -> SUSPENDED link"]
      - from: PUBLISHED
        to: SUSPENDED
        trigger: "system: cascade link 3 of the venue-freeze chain"
        actor: system
        preconditions: ["venue.site_posture == FROZEN"]
        side_effects: ["same as the DRAFT -> SUSPENDED link"]
      - from: PUBLISHED
        to: COMPLETED
        trigger: "system: bubble-up when the last non-CLOSED Wave of the course reaches CLOSED (POST /ocr/waves/{id}/close)"
        actor: system
        preconditions: ["status == PUBLISHED", "every Wave with course_id == this course has release_status == CLOSED", "at least one Wave exists"]
        side_effects: ["recomputes scheduled_capacity_total to 0 (no wave remains in {SCHEDULED, HELD, RELEASED, STARTED})", "increments Course.version by 1"]

  - entity: Wave
    state_field: release_status
    initial_state: SCHEDULED
    terminal_states: [CLOSED]
    transitions:
      - from: SCHEDULED
        to: HELD
        trigger: "POST /ocr/waves/{id}/hold with held == true, or system cascade (course readiness RESTRICTED / venue FROZEN)"
        actor: SafetyOfficer | RaceDirector | system
        preconditions: ["release_status == SCHEDULED"]
        side_effects: ["sets hold_reason", "increments Wave.version by 1"]
      - from: HELD
        to: SCHEDULED
        trigger: "POST /ocr/waves/{id}/hold with held == false"
        actor: SafetyOfficer | RaceDirector
        preconditions: ["release_status == HELD", "course.readiness_posture == OPEN", "course.status IN {VALIDATED, PUBLISHED}"]
        side_effects: ["clears hold_reason to null", "increments Wave.version by 1"]
        note: "SCHEDULED <-> HELD is a two-state loop on the release dimension; roster_status is untouched by either direction."
      - from: SCHEDULED
        to: RELEASED
        trigger: "POST /ocr/waves/{id}/release"
        actor: RaceDirector
        preconditions:
          - "release_status == SCHEDULED"
          - "roster_status IN {LOCKED, SEALED}"
          - "course.status == PUBLISHED"
          - "course.medic_headcount >= ceil(course.scheduled_capacity_total / MEDIC_PARTICIPANTS_PER_MEDIC)"
          - "course.readiness_posture == OPEN"
          - "assigned_count >= 1"
          - "capacity <= floor(course.bottleneck_capacity_pph * WAVE_INTERVAL_MINUTES / 60)"
        side_effects: ["increments Wave.version by 1"]
      - from: RELEASED
        to: STARTED
        trigger: "POST /ocr/waves/{id}/start"
        actor: RaceDirector
        preconditions:
          - "release_status == RELEASED"
          - "course.readiness_posture == OPEN"
          - "every distinct team_code among this wave's entries has at least division.team_size_min entries with progress_status == CHECKED_IN (TEAM divisions only)"
        side_effects:
          - "stamps actual_start_utc from the logical clock"
          - "roster_status -> SEALED (independent dimension advanced by this same trigger)"
          - "every Entry with progress_status == CHECKED_IN -> STARTED and chip_start_utc = actual_start_utc + chip_start_offset_seconds"
          - "every Entry with progress_status == REGISTERED -> DNS and result_status -> NOT_CLASSIFIED"
          - "increments Wave.version and the version of every Entry it touches by 1"
      - from: STARTED
        to: CLOSED
        trigger: "POST /ocr/waves/{id}/close"
        actor: RaceDirector
        preconditions: ["release_status == STARTED"]
        side_effects:
          - "stamps closed_at_utc from the logical clock"
          - "every Entry with progress_status == STARTED -> DNF and result_status -> NOT_CLASSIFIED"
          - "every Entry with result_status == PROVISIONAL -> OFFICIAL with official_penalty_seconds and official_elapsed_seconds computed by calculations.entry_elapsed_time variant official_adjudicated"
          - "entries with result_status == UNDER_PROTEST are left UNDER_PROTEST"
          - "bubble-up: when no Wave of the course remains outside CLOSED, Course.status PUBLISHED -> COMPLETED"
          - "increments Wave.version and the version of every Entry it touches by 1"

  - entity: Wave
    state_field: roster_status
    initial_state: OPEN
    terminal_states: [SEALED]
    transitions:
      - from: OPEN
        to: LOCKED
        trigger: "POST /ocr/waves/{id}/lock-roster"
        actor: RaceDirector
        preconditions: ["roster_status == OPEN"]
        side_effects: ["POST /ocr/waves/{id}/entries and inbound POST /ocr/entries/{id}/reassign-wave are rejected from LOCKED onward", "increments Wave.version by 1"]
        note: "Orthogonal to release_status: a wave may be locked while SCHEDULED or while HELD, and may sit RELEASED only after being locked."
      - from: LOCKED
        to: SEALED
        trigger: "system: the RELEASED -> STARTED transition"
        actor: system
        preconditions: ["roster_status == LOCKED"]
        side_effects: ["check-in is rejected from SEALED onward", "increments Wave.version by 1"]

  - entity: Participant
    state_field: clearance_status
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: CLEARED
        trigger: "POST /ocr/participants/{id}/waiver with no blocking medical flag"
        actor: Participant | RaceDirector
        preconditions: ["clearance_status == PENDING", "medical_flags contains none of {CARDIAC, PREGNANCY, RECENT_SURGERY}"]
        side_effects: ["sets waiver_signed = true", "increments Participant.version by 1"]
      - from: PENDING
        to: MEDICALLY_HELD
        trigger: "POST /ocr/participants/{id}/waiver with at least one blocking medical flag"
        actor: Participant | RaceDirector
        preconditions: ["clearance_status == PENDING", "medical_flags contains any of {CARDIAC, PREGNANCY, RECENT_SURGERY}"]
        side_effects: ["sets waiver_signed = true", "stores medical_flags", "increments Participant.version by 1"]
        note: "MEDICALLY_HELD blocks Entry check-in; there is no clearing transition, so the participant cannot start."

  - entity: Entry
    state_field: progress_status
    initial_state: REGISTERED
    terminal_states: [FINISHED, DNF, DNS]
    transitions:
      - from: REGISTERED
        to: CHECKED_IN
        trigger: "POST /ocr/entries/{id}/check-in"
        actor: SiteOpsLead | RaceDirector
        preconditions:
          - "progress_status == REGISTERED"
          - "participant.clearance_status == CLEARED"
          - "wave.roster_status IN {OPEN, LOCKED}"
          - "wave.release_status IN {SCHEDULED, HELD, RELEASED}"
        side_effects: ["stores bag_tag_code and chip_start_offset_seconds", "increments Entry.version by 1"]
      - from: CHECKED_IN
        to: STARTED
        trigger: "system: the wave RELEASED -> STARTED transition"
        actor: system
        preconditions: ["progress_status == CHECKED_IN"]
        side_effects: ["computes chip_start_utc", "increments Entry.version by 1"]
      - from: REGISTERED
        to: DNS
        trigger: "system: the wave RELEASED -> STARTED transition"
        actor: system
        preconditions: ["progress_status == REGISTERED"]
        side_effects: ["result_status -> NOT_CLASSIFIED", "increments Entry.version by 1"]
      - from: STARTED
        to: FINISHED
        trigger: "POST /ocr/entries/{id}/finish"
        actor: RaceDirector
        preconditions: ["progress_status == STARTED", "wave.release_status == STARTED"]
        side_effects:
          - "stamps finish_recorded_utc from the logical clock"
          - "computes provisional_penalty_seconds and provisional_elapsed_seconds via calculations.entry_elapsed_time variant provisional_gun_to_mat"
          - "result_status PENDING -> PROVISIONAL (DISQUALIFIED entries stay DISQUALIFIED)"
          - "increments Entry.version by 1"
      - from: STARTED
        to: DNF
        trigger: "system: the wave STARTED -> CLOSED transition"
        actor: system
        preconditions: ["progress_status == STARTED"]
        side_effects: ["result_status -> NOT_CLASSIFIED", "increments Entry.version by 1"]

  - entity: Entry
    state_field: result_status
    initial_state: PENDING
    terminal_states: [OFFICIAL, DISQUALIFIED, NOT_CLASSIFIED]
    transitions:
      - from: PENDING
        to: PROVISIONAL
        trigger: "POST /ocr/entries/{id}/finish"
        actor: RaceDirector
        preconditions: ["result_status == PENDING"]
        side_effects: ["see the progress_status STARTED -> FINISHED transition"]
      - from: PENDING
        to: DISQUALIFIED
        trigger: "POST /ocr/entries/{id}/attempts with outcome == BYPASSED while the wave's division has bypass_policy == DQ_ON_BYPASS"
        actor: ObstacleMarshal | RaceDirector
        preconditions: ["result_status == PENDING", "division.bypass_policy == DQ_ON_BYPASS"]
        side_effects: ["sets dq_reason = 'BYPASS_IN_DQ_DIVISION'", "increments Entry.version by 1"]
      - from: PROVISIONAL
        to: UNDER_PROTEST
        trigger: "POST /ocr/entries/{id}/protests"
        actor: Participant
        preconditions:
          - "result_status == PROVISIONAL"
          - "protest_rounds < MAX_PROTEST_ROUNDS (2)"
          - "the acting X-User-ID equals participant_id"
          - "disputed_attempt_id names an ObstacleAttempt with entry_id == this entry"
        side_effects: ["stores disputed_attempt_id", "increments Entry.version by 1"]
      - from: UNDER_PROTEST
        to: PROVISIONAL
        trigger: "POST /ocr/entries/{id}/adjudications with outcome == UPHELD_ADJUSTED"
        actor: RaceDirector
        preconditions:
          - "result_status == UNDER_PROTEST"
          - "expected_entry_version equals the current Entry.version"
          - "the acting X-User-ID != the disputed attempt's recorded_by_user_id"
        side_effects:
          - "appends disputed_attempt_id to voided_attempt_ids"
          - "increments protest_rounds by 1"
          - "recomputes official_penalty_seconds and official_elapsed_seconds via calculations.entry_elapsed_time variant official_adjudicated"
          - "increments Entry.version by 1"
        note: "The results cycle: PROVISIONAL -> UNDER_PROTEST -> PROVISIONAL, bounded by protest_rounds < 2."
      - from: UNDER_PROTEST
        to: OFFICIAL
        trigger: "POST /ocr/entries/{id}/adjudications with outcome == DENIED_OFFICIAL"
        actor: RaceDirector
        preconditions: ["result_status == UNDER_PROTEST", "expected_entry_version equals the current Entry.version", "the acting X-User-ID != the disputed attempt's recorded_by_user_id"]
        side_effects: ["increments protest_rounds by 1", "computes official_penalty_seconds and official_elapsed_seconds via variant official_adjudicated", "increments Entry.version by 1"]
      - from: UNDER_PROTEST
        to: DISQUALIFIED
        trigger: "POST /ocr/entries/{id}/adjudications with outcome == DISQUALIFIED"
        actor: RaceDirector
        preconditions: ["result_status == UNDER_PROTEST", "expected_entry_version equals the current Entry.version", "the acting X-User-ID != the disputed attempt's recorded_by_user_id"]
        side_effects: ["sets dq_reason = 'ADJUDICATED_DQ'", "increments protest_rounds by 1", "increments Entry.version by 1"]
      - from: PROVISIONAL
        to: OFFICIAL
        trigger: "system: the wave STARTED -> CLOSED transition"
        actor: system
        preconditions: ["result_status == PROVISIONAL"]
        side_effects: ["computes official_penalty_seconds and official_elapsed_seconds via variant official_adjudicated", "increments Entry.version by 1"]

  - entity: StaffAssignment
    state_field: status
    initial_state: CONFIRMED
    terminal_states: [VACATED]
    transitions:
      - from: CONFIRMED
        to: VACATED
        trigger: "POST /ocr/staff-assignments/{id}/vacate"
        actor: SafetyOfficer
        preconditions: ["status == CONFIRMED"]
        side_effects:
          - "cascade link 1: status -> VACATED"
          - "cascade link 2 (caused by link 1): when staff_role == MARSHAL, Obstacle.confirmed_marshal_count decrements and Obstacle.staffing_state recomputes (UNSTAFFED at zero, PARTIAL below marshals_required)"
          - "cascade link 3 (caused by link 2): Course.readiness_posture recomputes; it becomes RESTRICTED when any obstacle of the course is UNSTAFFED"
          - "cascade link 4 (caused by link 3): every Wave of that course with release_status == SCHEDULED and scheduled_start_utc <= clock + HOLDBACK_WINDOW_MINUTES (45) -> HELD with hold_reason = 'COURSE_RESTRICTED'"
          - "when staff_role IN {MEDIC, WATER_SAFETY}, Course.medic_headcount / water_safety_headcount decrement and link 3 / link 4 run identically"
          - "recomputes Obstacle.effective_clearance_rate_per_min and Course.bottleneck_capacity_pph"
          - "increments the version of every row it touches by 1"

  - entity: FestivalService
    state_field: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "system: Venue.site_posture -> FROZEN (fan-out of cascade link 2)"
        actor: system
        preconditions: ["status == OPEN", "venue.site_posture == FROZEN"]
        side_effects: ["increments FestivalService.version by 1", "Venue.disturbed_area_sqm is unchanged (footprint is physical disturbance and is counted regardless of status)"]

  - entity: RestorationTask
    state_field: status
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /ocr/restoration-tasks/{id}/inspect with outcome == VERIFIED"
        actor: PermitOfficer
        preconditions: ["status == PENDING", "venue.site_posture != CLOSED_OUT"]
        side_effects:
          - "computes bond_release_cents via calculations.restoration_bond_release variant per_task_provisional"
          - "ledger sync: Venue.bond_released_cents += bond_release_cents and Venue.bond_held_cents -= the same amount"
          - "increments inspection_rounds by 1"
          - "increments RestorationTask.version and Venue.version by 1"
      - from: PENDING
        to: REMEDIATION_REQUIRED
        trigger: "POST /ocr/restoration-tasks/{id}/inspect with outcome == REMEDIATION_REQUIRED"
        actor: PermitOfficer
        preconditions: ["status == PENDING", "venue.site_posture != CLOSED_OUT"]
        side_effects: ["increments inspection_rounds by 1", "no bond movement", "increments RestorationTask.version by 1"]
      - from: VERIFIED
        to: REMEDIATION_REQUIRED
        trigger: "POST /ocr/restoration-tasks/{id}/inspect with outcome == REMEDIATION_REQUIRED"
        actor: PermitOfficer
        preconditions: ["status == VERIFIED", "venue.site_posture != CLOSED_OUT"]
        side_effects:
          - "compensation: Venue.bond_released_cents -= bond_release_cents and Venue.bond_held_cents += the same amount, then bond_release_cents resets to 0"
          - "increments inspection_rounds by 1"
          - "increments RestorationTask.version and Venue.version by 1"
      - from: REMEDIATION_REQUIRED
        to: VERIFIED
        trigger: "POST /ocr/restoration-tasks/{id}/inspect with outcome == VERIFIED"
        actor: PermitOfficer
        preconditions: ["status == REMEDIATION_REQUIRED", "venue.site_posture != CLOSED_OUT"]
        side_effects: ["same ledger sync as PENDING -> VERIFIED", "increments inspection_rounds by 1"]
        note: "The remediation cycle: VERIFIED -> REMEDIATION_REQUIRED -> VERIFIED, unbounded; inspection_rounds records the iterations."

# ---------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# ---------------------------------------------------------------------

concurrency_rules:
  - rule_id: adjudication-supersede-stale-entry
    parent_entity: Entry
    write_endpoint: "POST /ocr/entries/{id}/adjudications"
    occ_field: "expected_entry_version"
    description: |
      An adjudication legitimately supersedes the entry's prior result reading:
      an UPHELD_ADJUSTED decision voids one attempt's penalty and returns the
      entry to PROVISIONAL, where a second protest and a second adjudication may
      follow. Because a later adjudication is a valid operation on its own, the
      server cannot use state alone to reject a writer working from an outdated
      reading; it rejects any adjudication whose expected_entry_version does not
      equal the Entry's current version.
    error_id: ERR_STALE_ENTRY_VERSION
    http_status: 412
  - rule_id: bond-settlement-supersede-stale-venue
    parent_entity: Venue
    write_endpoint: "POST /ocr/venues/{id}/bond-releases"
    occ_field: "expected_venue_version"
    description: |
      A PROGRESSIVE bond settlement recomputes and supersedes the venue's
      released/held split from the current set of VERIFIED restoration tasks, so
      repeating it is a valid operation rather than a state violation. A writer
      whose expected_venue_version is behind the Venue's current version has not
      seen the task verifications or clawbacks that moved the ledger since, and
      the settlement is rejected.
    error_id: ERR_STALE_VENUE_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================

calculations:
  - name: obstacle_design_clearance_rate
    trigger: "On POST /ocr/courses/{id}/obstacles (obstacle created) and on the Course DRAFT -> VALIDATED transition; writes Obstacle.design_clearance_rate_per_min"
    algorithm: threshold
    formula: |
      lane_rate = obstacle.lane_count * obstacle.service_rate_per_min
      design_relief = 0.00                              if obstacle.bypass_mode IN {NONE, MANDATORY}
                    = min(lane_rate * BYPASS_RELIEF_FACTOR, BYPASS_RELIEF_CAP_PER_MIN)
                                                        if obstacle.bypass_mode IN {PENALTY_LOOP, TIMED_PENALTY}
      design_clearance_rate_per_min = round_half_up(min(lane_rate + design_relief,
                                                        course.corral_release_rate_per_min), 2)
    input_set: "One Obstacle row plus its parent Course's corral_release_rate_per_min. Staffing is deliberately ignored: this is the paper design rate used to gate wave creation before any StaffAssignment exists."
    constants:
      BYPASS_RELIEF_FACTOR: 0.50
      BYPASS_RELIEF_CAP_PER_MIN: 8.00
    precision: "2 decimal places, round_half_up"

  - name: obstacle_effective_clearance_rate
    trigger: "On POST /ocr/courses/{id}/staff-assignments and on POST /ocr/staff-assignments/{id}/vacate (cascade link 2); writes Obstacle.effective_clearance_rate_per_min"
    algorithm: threshold
    formula: |
      # staffing_factor is a step function on the confirmed marshal headcount
      staffing_factor = 1.00  if obstacle.confirmed_marshal_count >= obstacle.marshals_required
                      = PARTIAL_STAFFING_FACTOR
                              if obstacle.confirmed_marshal_count >= ceil(obstacle.marshals_required / 2)
                                 and obstacle.confirmed_marshal_count >= 1
                      = 0.00  otherwise (which includes confirmed_marshal_count == 0)
      staffed_lane_rate = obstacle.lane_count * obstacle.service_rate_per_min * staffing_factor
      effective_relief  = 0.00  if obstacle.bypass_mode IN {NONE, MANDATORY}
                        = min(staffed_lane_rate * BYPASS_RELIEF_FACTOR, BYPASS_RELIEF_CAP_PER_MIN)
                                  if obstacle.bypass_mode IN {PENALTY_LOOP, TIMED_PENALTY}
      effective_clearance_rate_per_min = round_half_up(min(staffed_lane_rate + effective_relief,
                                                           course.corral_release_rate_per_min), 2)
    input_set: "One Obstacle row, its confirmed MARSHAL StaffAssignment headcount (status == CONFIRMED only; VACATED rows never count), and its parent Course's corral_release_rate_per_min."
    constants:
      PARTIAL_STAFFING_FACTOR: 0.60
      BYPASS_RELIEF_FACTOR: 0.50
      BYPASS_RELIEF_CAP_PER_MIN: 8.00
    precision: "2 decimal places, round_half_up"
    note: "Four interacting inputs (lane_count, service_rate_per_min, marshal headcount vs marshals_required, bypass_mode) with a step branch inside a min() inside a min() — the same obstacle yields 7.50 fully marshaled and 4.50 at partial staffing."

  - name: course_design_capacity
    trigger: "On POST /ocr/courses/{id}/obstacles and on the Course DRAFT -> VALIDATED transition; writes Course.design_capacity_pph"
    algorithm: aggregation
    formula: |
      obstacles = Obstacle rows with course_id == course.id and paired_obstacle_id == null
      design_capacity_pph = 0                                              if obstacles is empty
                          = floor(60 * min(o.design_clearance_rate_per_min for o in obstacles))
    input_set: "Primary obstacles only (paired_obstacle_id == null); bypass-lane rows are already folded into their primary's relief term and must not be counted as stations."
    constants: {}
    precision: "integer, floor"

  - name: course_bottleneck_capacity
    trigger: "On POST /ocr/courses/{id}/staff-assignments and on POST /ocr/staff-assignments/{id}/vacate (cascade link 2); writes Course.bottleneck_capacity_pph"
    algorithm: aggregation
    formula: |
      obstacles = Obstacle rows with course_id == course.id and paired_obstacle_id == null
      bottleneck_capacity_pph = 0                                             if obstacles is empty
                              = floor(60 * min(o.effective_clearance_rate_per_min for o in obstacles))
      # The wave-release gate derived from it:
      max_wave_capacity = floor(bottleneck_capacity_pph * WAVE_INTERVAL_MINUTES / 60)
    input_set: "Primary obstacles only, using the live staffing-aware rate. A single UNSTAFFED primary obstacle drives the whole course to 0."
    constants:
      WAVE_INTERVAL_MINUTES: 15
    precision: "integer, floor"

  - name: course_difficulty_progression
    trigger: "On POST /ocr/courses/{id}/obstacles and on the Course DRAFT -> VALIDATED transition; writes Course.difficulty_progression_score"
    algorithm: chronological
    formula: |
      d = [o.difficulty_rating for o in Obstacle rows with course_id == course.id
           and paired_obstacle_id == null, ordered by station_index ASC]
      n = len(d)
      difficulty_progression_score = 0.00                       if n < 2
                                   = round_half_up(sum(max(0, d[i+1] - d[i]) for i in 0..n-2)
                                                   / (n - 1), 2)
      regression_violations = count of i in 0..n-2 where d[i+1] < d[i] - MAX_REGRESSION
      # Validation gates on the DRAFT -> VALIDATED transition:
      #   n >= MIN_OBSTACLES                       else ERR_COURSE_TOO_SHORT
      #   difficulty_progression_score >= MIN_PROGRESSION_SCORE  else ERR_PROGRESSION_TOO_FLAT
      #   regression_violations == 0               else ERR_PROGRESSION_REGRESSION
    input_set: "Primary obstacles of the course ordered by station_index ASC (station_index is unique per course, so the order is total and no tie-break is needed)."
    constants:
      MIN_OBSTACLES: 3
      MIN_PROGRESSION_SCORE: 0.50
      MAX_REGRESSION: 2
    precision: "2 decimal places, round_half_up; the >= comparison against MIN_PROGRESSION_SCORE is made on the rounded value"

  - name: course_readiness_posture
    trigger: "On the LandUsePermit APPROVED / DENIED / EXPIRED transitions, on POST /ocr/courses/{id}/validate, POST /ocr/courses/{id}/publish, POST /ocr/courses/{id}/staff-assignments, POST /ocr/staff-assignments/{id}/vacate (cascade link 3) and POST /ocr/courses/{id}/waves; writes Course.readiness_posture"
    algorithm: constraint_propagation
    formula: |
      water_obstacle_count = count of Obstacle rows with course_id == course.id and water_contact == true
      medics_required      = ceil(course.scheduled_capacity_total / MEDIC_PARTICIPANTS_PER_MEDIC)
      water_safety_required = WATER_SAFETY_PER_WATER_OBSTACLE * water_obstacle_count
      readiness_posture =
        FROZEN      if venue.site_posture != OPEN
                       or the venue has no LandUsePermit with status == APPROVED
        RESTRICTED  else if course.medic_headcount < medics_required
                       or course.water_safety_headcount < water_safety_required
                       or any Obstacle of the course has staffing_state == UNSTAFFED
        OPEN        else
    input_set: "The course's own obstacles (all of them, including bypass lanes, for the UNSTAFFED test), its CONFIRMED MEDIC and WATER_SAFETY assignments, its scheduled_capacity_total, and the venue's governing permit."
    constants:
      MEDIC_PARTICIPANTS_PER_MEDIC: 250
      WATER_SAFETY_PER_WATER_OBSTACLE: 2
    precision: "n/a (enum)"
    note: "PARTIAL staffing does NOT restrict the course; it only lowers bottleneck_capacity_pph. Only a fully UNSTAFFED obstacle (zero confirmed marshals) restricts it."

  - name: wave_corral_occupancy_load
    trigger: "On POST /ocr/courses/{id}/waves, before the Wave row is written"
    algorithm: interval_merge
    formula: |
      # Half-open occupancy interval on the shared start corral:
      occ(w) = [w.scheduled_start_utc, w.scheduled_start_utc + CORRAL_OCCUPANCY_MINUTES)
      peers  = Wave rows with course_id == course.id
               and release_status IN {SCHEDULED, HELD, RELEASED, STARTED}
               and occ(peer) overlaps occ(candidate)
      # overlap test on half-open intervals: peer.start < cand.end AND cand.start < peer.end
      # (touching endpoints do NOT overlap: a wave at cand.start == peer.start + 6min is free)
      occupancy_load = sum(peer.capacity for peer in peers)
      accept iff occupancy_load + candidate.capacity <= course.corral_throughput_capacity
                 else ERR_CORRAL_WINDOW_CONFLICT
    input_set: "Waves of the same course only, excluding CLOSED waves (a closed heat has vacated the corral)."
    constants:
      CORRAL_OCCUPANCY_MINUTES: 6
    precision: "integer participants"
    note: "Aggregate-capacity interval semantics: many waves may share the corral window as long as their summed capacity fits, and exact adjacency is always free. Contrast staff_shift_conflict_window, which is pairwise and buffer-inflated."

  - name: staff_shift_conflict_window
    trigger: "On POST /ocr/courses/{id}/staff-assignments, before the StaffAssignment row is written"
    algorithm: interval_merge
    formula: |
      buffer = STAFF_TRAVEL_BUFFER_MINUTES
      peers  = StaffAssignment rows with staff_person_id == candidate.staff_person_id
               and status == CONFIRMED
      conflict iff any peer satisfies BOTH:
          candidate.shift_start_utc <  peer.shift_end_utc      + buffer
        AND peer.shift_start_utc     <  candidate.shift_end_utc + buffer
      # Closed intervals inflated by the travel buffer on both sides: a shift
      # starting exactly buffer minutes after a peer ends is accepted, one
      # second earlier is rejected with ERR_STAFF_SHIFT_CONFLICT.
    input_set: "Every CONFIRMED assignment of the same staff_person_id across every course and obstacle; VACATED rows are ignored, which is what makes a vacated shift immediately re-bookable."
    constants:
      STAFF_TRAVEL_BUFFER_MINUTES: 15
    precision: "second-resolution instant comparison"
    note: "Pairwise buffer-inflated semantics with no capacity notion: one collision is fatal regardless of headcount. This is a different interval geometry from wave_corral_occupancy_load."

  - name: participant_age_at_wave
    trigger: "On POST /ocr/waves/{id}/entries, before the Entry row is written"
    algorithm: threshold
    formula: |
      age = year(wave.scheduled_start_utc) - participant.birth_year
      accept iff age >= division.min_age else ERR_AGE_INELIGIBLE
    input_set: "The candidate Participant and the target Wave's Division. Calendar-year difference only; month and day are deliberately ignored so the boundary is exact and clock-independent."
    constants: {}
    precision: "integer years"

  - name: entry_elapsed_time
    trigger: "On POST /ocr/entries/{id}/finish (provisional fields), on the wave STARTED -> CLOSED transition and on POST /ocr/entries/{id}/adjudications (official fields); writes Entry.provisional_penalty_seconds, provisional_elapsed_seconds, official_penalty_seconds, official_elapsed_seconds"
    algorithm: chronological
    formula: |
      attempts = ObstacleAttempt rows with entry_id == entry.id,
                 processed in recorded_at ASC order, tie-break created_at ASC
      # -- per-attempt penalty under the PROVISIONAL reading --
      prov_penalty(a) = 0                              if a.outcome == COMPLETED
                      = obstacle(a).penalty_seconds    if a.outcome == FAILED_PENALTY
                      = obstacle(a).penalty_seconds    if a.outcome == BYPASSED
                      = obstacle(a).penalty_seconds    if a.outcome == SKIPPED_UNMARSHALED
      # -- per-attempt penalty under the OFFICIAL reading --
      off_penalty(a)  = 0                              if a.id IN entry.voided_attempt_ids
                      = 0                              if a.outcome == SKIPPED_UNMARSHALED
                      = prov_penalty(a)                otherwise
      provisional_penalty_seconds = sum(prov_penalty(a) for a in attempts)
      official_penalty_seconds    = sum(off_penalty(a)  for a in attempts)
      # -- base clock span --
      gun_base  = seconds_between(wave.actual_start_utc, entry.finish_recorded_utc)
      chip_base = seconds_between(entry.chip_start_utc,  entry.finish_recorded_utc)
      provisional_elapsed_seconds = gun_base + provisional_penalty_seconds
      official_elapsed_seconds    = (chip_base if division.scoring_mode == CHIP_TIME else gun_base)
                                    + official_penalty_seconds
    input_set: "Every ObstacleAttempt of the entry regardless of outcome. Attempts are never deleted; the official reading suppresses penalties rather than dropping rows."
    constants: {}
    precision: "whole seconds; both bases are exact instant differences and never rounded"
    variants:
      - name: provisional_gun_to_mat
        when: "Stamped by POST /ocr/entries/{id}/finish, and it is the only reading a participant sees before results go official"
        difference: "Measures from the wave gun (wave.actual_start_utc) for every division, and charges every recorded penalty including SKIPPED_UNMARSHALED waves-through at an unstaffed station."
      - name: official_adjudicated
        when: "Stamped when the entry reaches OFFICIAL (wave close or a DENIED_OFFICIAL adjudication) and recomputed by an UPHELD_ADJUSTED adjudication"
        difference: "Measures from the participant's own mat crossing (entry.chip_start_utc) when division.scoring_mode == CHIP_TIME, and voids two penalty classes: attempts listed in voided_attempt_ids and every SKIPPED_UNMARSHALED attempt (the producer cannot penalise a runner for a station it failed to marshal)."

  - name: restoration_bond_release
    trigger: "On POST /ocr/restoration-tasks/{id}/inspect (per-task provisional amount and the venue ledger sync) and on POST /ocr/venues/{id}/bond-releases (settlement); writes RestorationTask.bond_release_cents, Venue.bond_released_cents, Venue.bond_forfeited_cents, Venue.bond_held_cents"
    algorithm: waterfall_allocation
    formula: |
      # ---- variant per_task_provisional: round per line item, THEN sum ----
      share(t)          = round_half_up(venue.restoration_bond_cents * t.area_sqm
                                        / venue.disturbed_area_sqm, 0)     # whole cents per task
      on VERIFIED:  t.bond_release_cents = share(t)
                    venue.bond_released_cents += share(t)
      on VERIFIED -> REMEDIATION_REQUIRED:
                    venue.bond_released_cents -= t.bond_release_cents
                    t.bond_release_cents = 0
      # ---- variant final_closeout: sum the areas, THEN round once ----
      verified_area   = sum(t.area_sqm for t with venue_id == venue.id and status == VERIFIED)
      gross_total     = round_half_up(venue.restoration_bond_cents * verified_area
                                       / venue.disturbed_area_sqm, 0)
      hours_late      = seconds_between(permit.restoration_deadline_utc, clock) / 3600
      days_late       = 0                      if clock <= permit.restoration_deadline_utc
                      = ceil(hours_late / 24)  otherwise
      late_penalty    = min(LATE_PENALTY_PER_DAY_CENTS * days_late, gross_total)
      net_total       = gross_total - late_penalty
      # ---- reconciliation of the two roundings ----
      per_task_sum    = sum(t.bond_release_cents for t with status == VERIFIED)
      remainder       = net_total - per_task_sum
      # the remainder lands on ONE task: greatest area_sqm, tie-break created_at ASC
      target          = the VERIFIED task with max area_sqm, tie-break created_at ASC
      target.bond_release_cents += remainder
      venue.bond_released_cents  = net_total
      venue.bond_forfeited_cents = late_penalty
      venue.bond_held_cents      = venue.restoration_bond_cents - net_total - late_penalty
      # invariant, always: held + released + forfeited == restoration_bond_cents
    input_set: "RestorationTask rows of the venue with status == VERIFIED only; PENDING and REMEDIATION_REQUIRED tasks contribute neither area nor cents. The denominator is always Venue.disturbed_area_sqm (the full physical disturbance), never the verified area, so a partial remediation releases only its proportional share."
    constants:
      LATE_PENALTY_PER_DAY_CENTS: 25000
    precision: "whole cents, round_half_up; the rounding ORDER is pinned per variant and is the source of the divergence"
    variants:
      - name: per_task_provisional
        when: "Every RestorationTask inspection outcome (both directions of the remediation cycle)"
        difference: "Rounds each task's proportional share to whole cents independently and sums the rounded amounts, so three equal 1500 sqm tasks of a 1,000,000-cent bond over 4500 disturbed sqm release 333333 each and the venue ledger stalls one cent short of the bond."
      - name: final_closeout
        when: "POST /ocr/venues/{id}/bond-releases with settlement_type == FINAL"
        difference: "Sums the verified areas first and rounds the product once, then subtracts the late penalty; the difference against the per-task sum is booked as a remainder onto the largest-area verified task (tie-break created_at ASC), so the same three tasks settle at 1,000,000 with one task carrying 333334."

# =====================================================================
# §1.4 Validation Rules Table (evaluated in ascending priority order;
#     the FIRST violated row decides the response)
# =====================================================================

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty, and X-User-Role is one of the seven declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "The acting role appears in the endpoint's roles list in §1.5"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Every path id resolves, validated left to right: venue, then permit / course / obstacle / wave / participant / entry / staff assignment / restoration task"
    error_id: "ERR_VENUE_NOT_FOUND | ERR_PERMIT_NOT_FOUND | ERR_COURSE_NOT_FOUND | ERR_OBSTACLE_NOT_FOUND | ERR_WAVE_NOT_FOUND | ERR_PARTICIPANT_NOT_FOUND | ERR_ENTRY_NOT_FOUND | ERR_STAFF_ASSIGNMENT_NOT_FOUND | ERR_RESTORATION_TASK_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 4
    category: existence
    check: "Request body and query schema: required fields present, types correct, enum members valid, numeric bounds respected (limit 1..100, offset >= 0, difficulty_rating 1..10, lane_count >= 1, capacity >= 1, area_sqm > 0, quiet hour 0..23), and MEDIC/SWEEP assignments omit obstacle_id"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all write endpoints and all list endpoints with query parameters"
  - priority: 5
    category: existence
    check: "Every body foreign key resolves: division_id, participant_id, obstacle_id, paired_obstacle_id, target_wave_id, disputed_attempt_id"
    error_id: "ERR_DIVISION_NOT_FOUND | ERR_PARTICIPANT_NOT_FOUND | ERR_OBSTACLE_NOT_FOUND | ERR_WAVE_NOT_FOUND | ERR_ATTEMPT_NOT_FOUND"
    http_status: 404
    applies_to: "POST /ocr/courses/{id}/waves, POST /ocr/courses/{id}/obstacles, POST /ocr/waves/{id}/entries, POST /ocr/entries/{id}/attempts, POST /ocr/entries/{id}/protests, POST /ocr/entries/{id}/reassign-wave, POST /ocr/courses/{id}/staff-assignments"
  - priority: 6
    category: auth
    check: "A Participant acting on an Entry or a Participant resource may only touch rows whose participant_id (or id) equals the acting X-User-ID"
    error_id: ERR_NOT_ENTRY_OWNER
    http_status: 403
    applies_to: "GET /ocr/entries/{id}, POST /ocr/entries/{id}/protests, POST /ocr/participants/{id}/waiver"
  - priority: 7
    category: business_safety
    check: "Segregation of duties: the acting X-User-ID may not decide a permit it submitted, and may not adjudicate a protest against an ObstacleAttempt it recorded"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /ocr/permits/{id}/decision, POST /ocr/entries/{id}/adjudications"
  - priority: 8
    category: state
    check: "Optimistic concurrency: the supplied expected_entry_version / expected_venue_version equals the parent row's current version"
    error_id: "ERR_STALE_ENTRY_VERSION | ERR_STALE_VENUE_VERSION"
    http_status: 412
    applies_to: "POST /ocr/entries/{id}/adjudications, POST /ocr/venues/{id}/bond-releases"
  - priority: 9
    category: state
    check: "The target row is in a state that admits this transition, per §1.2 (permit submit/decision, course validate/publish, obstacle creation only while DRAFT, wave hold/lock/release/start/close, roster open for registration and reassignment, entry check-in/finish/protest/adjudicate, assignment vacate, task inspect, venue not CLOSED_OUT)"
    error_id: "ERR_VENUE_FROZEN | ERR_PERMIT_STATE_INVALID | ERR_PERMIT_ALREADY_APPROVED | ERR_COURSE_STATE_INVALID | ERR_OBSTACLE_SET_FROZEN | ERR_WAVE_NOT_RELEASABLE | ERR_WAVE_ROSTER_NOT_LOCKED | ERR_ROSTER_CLOSED | ERR_WAVE_STATE_INVALID | ERR_ENTRY_STATE_INVALID | ERR_ENTRY_NOT_PROTESTABLE | ERR_PROTEST_ROUNDS_EXHAUSTED | ERR_ASSIGNMENT_NOT_ACTIVE | ERR_TASK_STATE_INVALID | ERR_BOND_ALREADY_SETTLED"
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 10
    category: business_referential
    check: "Cross-entity gates: a wave may only be released while its course.status == PUBLISHED, and an entry may only be reassigned to a heat on the same course carrying the same division"
    error_id: "ERR_COURSE_NOT_PUBLISHED | ERR_WAVE_COURSE_MISMATCH"
    http_status: 409
    applies_to: "POST /ocr/waves/{id}/release, POST /ocr/entries/{id}/reassign-wave"
  - priority: 11
    category: business_safety
    check: "Medical coverage: course.medic_headcount >= ceil(course.scheduled_capacity_total / 250)"
    error_id: ERR_MEDICAL_COVERAGE_INSUFFICIENT
    http_status: 409
    applies_to: "POST /ocr/waves/{id}/release"
  - priority: 12
    category: business_safety
    check: "Course readiness posture must be OPEN (no UNSTAFFED obstacle, water-safety minimum met, venue not frozen)"
    error_id: ERR_COURSE_UNSAFE
    http_status: 409
    applies_to: "POST /ocr/waves/{id}/release, POST /ocr/waves/{id}/start, POST /ocr/waves/{id}/hold with held == false"
  - priority: 13
    category: business_safety
    check: "The participant has signed the waiver (participant.waiver_signed == true)"
    error_id: ERR_WAIVER_REQUIRED
    http_status: 409
    applies_to: "POST /ocr/waves/{id}/entries"
  - priority: 14
    category: business_safety
    check: "The participant's clearance_status == CLEARED (MEDICALLY_HELD may not take the start line)"
    error_id: ERR_PARTICIPANT_NOT_CLEARED
    http_status: 409
    applies_to: "POST /ocr/entries/{id}/check-in"
  - priority: 15
    category: business_safety
    check: "Marshaling truth: outcomes COMPLETED / BYPASSED / FAILED_PENALTY require obstacle.staffing_state != UNSTAFFED, and outcome SKIPPED_UNMARSHALED requires obstacle.staffing_state == UNSTAFFED"
    error_id: "ERR_OBSTACLE_UNMARSHALED | ERR_OBSTACLE_MARSHALED"
    http_status: 409
    applies_to: "POST /ocr/entries/{id}/attempts"
  - priority: 16
    category: business_referential
    check: "Division shape rules: team_code is required when the wave's division_type == TEAM and forbidden otherwise; a team_code may not exceed division.team_size_max entries in one heat; MARSHAL and WATER_SAFETY assignments require obstacle_id"
    error_id: ERR_DIVISION_RULE_VIOLATION
    http_status: 409
    applies_to: "POST /ocr/waves/{id}/entries, POST /ocr/courses/{id}/staff-assignments"
  - priority: 17
    category: business_referential
    check: "A BYPASSED outcome is rejected when obstacle.bypass_mode == MANDATORY or when division.bypass_policy == MANDATORY_COMPLETION"
    error_id: ERR_BYPASS_NOT_ALLOWED
    http_status: 409
    applies_to: "POST /ocr/entries/{id}/attempts"
  - priority: 18
    category: business_referential
    check: "Team roster minimum: every distinct team_code in the wave has at least division.team_size_min entries with progress_status == CHECKED_IN"
    error_id: ERR_TEAM_INCOMPLETE
    http_status: 409
    applies_to: "POST /ocr/waves/{id}/start"
  - priority: 19
    category: business_temporal
    check: "Quiet hours: when the venue has a LandUsePermit with status == APPROVED, hour_utc(scheduled_start_utc) must fall outside the half-open quiet window [quiet_hours_start_hour_utc, quiet_hours_end_hour_utc) (wrapping past midnight when start > end). Skipped entirely when the venue has no APPROVED permit."
    error_id: ERR_QUIET_HOURS_VIOLATION
    http_status: 409
    applies_to: "POST /ocr/courses/{id}/waves"
  - priority: 20
    category: business_temporal
    check: "Staff shift collision per calculations.staff_shift_conflict_window (pairwise, inflated by a 15-minute travel buffer on both sides)"
    error_id: ERR_STAFF_SHIFT_CONFLICT
    http_status: 409
    applies_to: "POST /ocr/courses/{id}/staff-assignments"
  - priority: 21
    category: business_temporal
    check: "Start-corral collision per calculations.wave_corral_occupancy_load (aggregate capacity over half-open 6-minute occupancy intervals)"
    error_id: ERR_CORRAL_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /ocr/courses/{id}/waves"
  - priority: 22
    category: business_constraint
    check: "Uniqueness: Obstacle.station_index per course; Entry.bib_number per wave; Wave.wave_code per course; LandUsePermit.permit_number, Participant.email and Participant.chip_id globally"
    error_id: "ERR_STATION_INDEX_CONFLICT | ERR_BIB_NUMBER_TAKEN | ERR_UNIQUENESS_CONFLICT"
    http_status: 409
    applies_to: "POST /ocr/courses/{id}/obstacles, POST /ocr/waves/{id}/entries, POST /ocr/courses/{id}/waves, POST /ocr/venues/{id}/permits, POST /ocr/participants"
  - priority: 23
    category: business_constraint
    check: "The venue has exactly one governing permit with status == APPROVED"
    error_id: ERR_PERMIT_NOT_APPROVED
    http_status: 409
    applies_to: "POST /ocr/courses/{id}/validate, POST /ocr/venues/{id}/festival-services with water_draw_lpm > 0, POST /ocr/venues/{id}/bond-releases"
  - priority: 24
    category: business_constraint
    check: "Water use: an Obstacle with water_contact == true or a FestivalService with water_draw_lpm > 0 requires the governing permit's water_use_allowed == true"
    error_id: ERR_WATER_USE_NOT_PERMITTED
    http_status: 409
    applies_to: "POST /ocr/courses/{id}/validate, POST /ocr/venues/{id}/festival-services"
  - priority: 25
    category: business_constraint
    check: "Course design gates from calculations.course_difficulty_progression: at least 3 primary obstacles, difficulty_progression_score >= 0.50, no consecutive regression greater than 2"
    error_id: "ERR_COURSE_TOO_SHORT | ERR_PROGRESSION_TOO_FLAT | ERR_PROGRESSION_REGRESSION"
    http_status: 422
    applies_to: "POST /ocr/courses/{id}/validate"
  - priority: 26
    category: business_constraint
    check: "Age eligibility per calculations.participant_age_at_wave"
    error_id: ERR_AGE_INELIGIBLE
    http_status: 409
    applies_to: "POST /ocr/waves/{id}/entries"
  - priority: 27
    category: business_constraint
    check: "Sum of RestorationTask.area_sqm for the venue (including the candidate) must not exceed Venue.disturbed_area_sqm"
    error_id: ERR_RESTORATION_AREA_EXCEEDED
    http_status: 409
    applies_to: "POST /ocr/venues/{id}/restoration-tasks"
  - priority: 28
    category: business_constraint
    check: "Every RestorationTask of the venue has status == VERIFIED and at least one task exists, before a FINAL settlement"
    error_id: ERR_RESTORATION_INCOMPLETE
    http_status: 409
    applies_to: "POST /ocr/venues/{id}/bond-releases with settlement_type == FINAL"
  - priority: 29
    category: business_fiscal
    check: "Venue.disturbed_area_sqm <= governing permit.max_disturbed_area_sqm (equality passes)"
    error_id: ERR_DISTURBED_AREA_EXCEEDED
    http_status: 409
    applies_to: "POST /ocr/courses/{id}/validate"
  - priority: 30
    category: business_fiscal
    check: "Wave capacity at creation: capacity <= floor(course.design_capacity_pph * 15 / 60)"
    error_id: ERR_DESIGN_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /ocr/courses/{id}/waves"
  - priority: 31
    category: business_fiscal
    check: "Wave roster capacity: wave.assigned_count + 1 <= wave.capacity on the receiving wave"
    error_id: ERR_WAVE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /ocr/waves/{id}/entries, POST /ocr/entries/{id}/reassign-wave"
  - priority: 32
    category: business_fiscal
    check: "Live bottleneck gate: wave.capacity <= floor(course.bottleneck_capacity_pph * 15 / 60)"
    error_id: ERR_BOTTLENECK_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /ocr/waves/{id}/release"
  - priority: 33
    category: business_fiscal
    check: "A wave with assigned_count == 0 may not be released (empty-roster edge)"
    error_id: ERR_WAVE_ROSTER_EMPTY
    http_status: 409
    applies_to: "POST /ocr/waves/{id}/release"

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================

endpoints:
  # --- Venue -----------------------------------------------------------
  - method: POST
    path: "/ocr/venues"
    description: "Register a candidate venue parcel with its terrain, water access, protected acreage and posted restoration bond."
    roles: [PermitOfficer]
    code: 201
    input: [name, terrain_type, water_access, land_use_zone, protected_acreage_sqm, restoration_bond_cents]
    output: Venue
    side_effects: ["site_posture = OPEN", "disturbed_area_sqm = 0", "bond_held_cents = restoration_bond_cents, bond_released_cents = 0, bond_forfeited_cents = 0"]
  - method: GET
    path: "/ocr/venues"
    description: "List venues, newest last, filterable by terrain and by site posture."
    roles: [PermitOfficer, CourseDesigner, RaceDirector, SafetyOfficer, SiteOpsLead]
    code: 200
    input: ["terrain_type?", "site_posture?", "limit?", "offset?"]
    output: Venue[]
    side_effects: []
  - method: GET
    path: "/ocr/venues/{id}"
    description: "Read one venue including the live disturbed-area total and the three bond ledger columns."
    roles: [PermitOfficer, CourseDesigner, RaceDirector, SafetyOfficer, SiteOpsLead]
    code: 200
    input: []
    output: Venue
    side_effects: []

  # --- LandUsePermit ---------------------------------------------------
  - method: POST
    path: "/ocr/venues/{id}/permits"
    description: "Draft a land-use permit application for the parcel, carrying the disturbed-area cap, water-use flag, nightly quiet window, validity horizon and restoration deadline."
    roles: [CourseDesigner]
    code: 201
    input: [permit_number, water_use_allowed, max_disturbed_area_sqm, quiet_hours_start_hour_utc, quiet_hours_end_hour_utc, valid_until_utc, restoration_deadline_utc]
    output: LandUsePermit
    side_effects: ["status = DRAFT", "revision_rounds = 0"]
  - method: GET
    path: "/ocr/venues/{id}/permits"
    description: "List every permit application filed against the parcel, including the governing APPROVED one."
    roles: [PermitOfficer, CourseDesigner, RaceDirector, SafetyOfficer, SiteOpsLead]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: LandUsePermit[]
    side_effects: []
  - method: GET
    path: "/ocr/permits/{id}"
    description: "Read one permit application with its lifecycle state, revision count and the submitter / decider operator ids."
    roles: [PermitOfficer, CourseDesigner, RaceDirector, SafetyOfficer, SiteOpsLead]
    code: 200
    input: []
    output: LandUsePermit
    side_effects: []
  - method: POST
    path: "/ocr/permits/{id}/submit"
    description: "Submit a DRAFT or REVISION_REQUESTED permit application to the land authority."
    roles: [CourseDesigner]
    code: 200
    input: []
    output: LandUsePermit
    side_effects: ["status -> SUBMITTED", "submitted_by_user_id = acting X-User-ID"]
  - method: POST
    path: "/ocr/permits/{id}/decision"
    description: "Record the land authority's decision on a SUBMITTED application. The acting operator id must differ from submitted_by_user_id."
    roles: [PermitOfficer]
    code: 200
    input: [decision, "decision_note?"]
    output: LandUsePermit
    side_effects: ["APPROVED: recomputes readiness_posture on every Course of the venue", "REVISION_REQUESTED: increments revision_rounds", "DENIED: runs the 4-link venue-freeze cascade plus the FestivalService fan-out", "decided_by_user_id = acting X-User-ID"]

  # --- Course ----------------------------------------------------------
  - method: POST
    path: "/ocr/venues/{id}/courses"
    description: "Lay out a new temporary course on the parcel with its advertised distance and start-corral limits."
    roles: [CourseDesigner]
    code: 201
    input: [name, total_distance_m, corral_release_rate_per_min, corral_throughput_capacity]
    output: Course
    side_effects: ["status = DRAFT", "readiness_posture = RESTRICTED", "obstacle_count = 0, design_capacity_pph = 0, bottleneck_capacity_pph = 0"]
  - method: GET
    path: "/ocr/venues/{id}/courses"
    description: "List the courses laid out on the parcel."
    roles: [PermitOfficer, CourseDesigner, RaceDirector, SafetyOfficer, SiteOpsLead]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Course[]
    side_effects: []
  - method: GET
    path: "/ocr/courses/{id}"
    description: "Read one course with its derived capacities, progression score, readiness posture, staffing headcounts and scheduled capacity total."
    roles: [PermitOfficer, CourseDesigner, RaceDirector, SafetyOfficer, SiteOpsLead, ObstacleMarshal]
    code: 200
    input: []
    output: Course
    side_effects: []
  - method: POST
    path: "/ocr/courses/{id}/validate"
    description: "Run the design gate on a DRAFT course: obstacle count, progression, regression, water permission, and the disturbed-area cap."
    roles: [CourseDesigner]
    code: 200
    input: []
    output: Course
    side_effects: ["status -> VALIDATED", "recomputes obstacle_count, difficulty_progression_score, design_capacity_pph, readiness_posture", "freezes the obstacle set"]
  - method: POST
    path: "/ocr/courses/{id}/publish"
    description: "Publish a VALIDATED course so its waves may be released."
    roles: [RaceDirector]
    code: 200
    input: []
    output: Course
    side_effects: ["status -> PUBLISHED", "recomputes readiness_posture"]

  # --- Obstacle --------------------------------------------------------
  - method: POST
    path: "/ocr/courses/{id}/obstacles"
    description: "Place an obstacle at a station index on a DRAFT course. paired_obstacle_id marks this obstacle as a bypass lane relieving an existing primary obstacle on the same course."
    roles: [CourseDesigner]
    code: 201
    input: [name, station_index, difficulty_rating, lane_count, service_rate_per_min, marshals_required, footprint_sqm, water_contact, bypass_mode, penalty_seconds, "paired_obstacle_id?"]
    output: Obstacle
    side_effects: ["staffing_state = UNSTAFFED, confirmed_marshal_count = 0", "computes design_clearance_rate_per_min and effective_clearance_rate_per_min", "recomputes Course.obstacle_count, difficulty_progression_score, design_capacity_pph, bottleneck_capacity_pph", "recomputes Venue.disturbed_area_sqm"]
  - method: GET
    path: "/ocr/obstacles"
    description: "List obstacles, filterable by course, by the primary obstacle a bypass lane relieves, and by staffing state."
    roles: [PermitOfficer, CourseDesigner, RaceDirector, SafetyOfficer, SiteOpsLead, ObstacleMarshal]
    code: 200
    input: ["course_id?", "paired_obstacle_id?", "staffing_state?", "limit?", "offset?"]
    output: Obstacle[]
    side_effects: []
  - method: GET
    path: "/ocr/obstacles/{id}"
    description: "Read one obstacle with its live marshal count, staffing state and both clearance rates."
    roles: [PermitOfficer, CourseDesigner, RaceDirector, SafetyOfficer, SiteOpsLead, ObstacleMarshal]
    code: 200
    input: []
    output: Obstacle
    side_effects: []
  - method: GET
    path: "/ocr/obstacles/{id}/attempts"
    description: "List every recorded attempt at this obstacle across all entries, in chronological order."
    roles: [RaceDirector, SafetyOfficer, ObstacleMarshal, CourseDesigner]
    code: 200
    input: ["outcome?", "limit?", "offset?"]
    output: ObstacleAttempt[]
    side_effects: []

  # --- Division --------------------------------------------------------
  - method: POST
    path: "/ocr/divisions"
    description: "Define a participant division with its bypass policy, scoring mode, minimum age and team roster bounds. Divisions are immutable configuration."
    roles: [RaceDirector]
    code: 201
    input: [name, division_type, bypass_policy, scoring_mode, min_age, team_size_min, team_size_max]
    output: Division
    side_effects: []
  - method: GET
    path: "/ocr/divisions"
    description: "List the configured divisions."
    roles: [PermitOfficer, CourseDesigner, RaceDirector, SafetyOfficer, SiteOpsLead, ObstacleMarshal, Participant]
    code: 200
    input: ["division_type?", "limit?", "offset?"]
    output: Division[]
    side_effects: []
  - method: GET
    path: "/ocr/divisions/{id}"
    description: "Read one division's rule set."
    roles: [PermitOfficer, CourseDesigner, RaceDirector, SafetyOfficer, SiteOpsLead, ObstacleMarshal, Participant]
    code: 200
    input: []
    output: Division
    side_effects: []

  # --- Wave ------------------------------------------------------------
  - method: POST
    path: "/ocr/courses/{id}/waves"
    description: "Schedule a heat on the course for one division: enforces the quiet window, the start-corral occupancy budget and the staffing-independent design capacity."
    roles: [RaceDirector]
    code: 201
    input: [division_id, wave_code, scheduled_start_utc, capacity]
    output: Wave
    side_effects: ["release_status = SCHEDULED, roster_status = OPEN, assigned_count = 0", "recomputes Course.scheduled_capacity_total"]
  - method: GET
    path: "/ocr/waves"
    description: "List heats, filterable by course, by division and by either state dimension."
    roles: [PermitOfficer, CourseDesigner, RaceDirector, SafetyOfficer, SiteOpsLead, ObstacleMarshal, Participant]
    code: 200
    input: ["course_id?", "division_id?", "release_status?", "roster_status?", "limit?", "offset?"]
    output: Wave[]
    side_effects: []
  - method: GET
    path: "/ocr/waves/{id}"
    description: "Read one heat with both state dimensions, its roster count and its stamped gun / close instants."
    roles: [PermitOfficer, CourseDesigner, RaceDirector, SafetyOfficer, SiteOpsLead, ObstacleMarshal, Participant]
    code: 200
    input: []
    output: Wave
    side_effects: []
  - method: POST
    path: "/ocr/waves/{id}/hold"
    description: "Hold a SCHEDULED heat at the start line (held == true) or return a HELD heat to SCHEDULED (held == false). Un-holding requires the course to be readable as OPEN."
    roles: [SafetyOfficer, RaceDirector]
    code: 200
    input: [held, "reason?"]
    output: Wave
    side_effects: ["held == true: release_status -> HELD, hold_reason = reason", "held == false: release_status -> SCHEDULED, hold_reason -> null", "roster_status is untouched in both directions"]
  - method: POST
    path: "/ocr/waves/{id}/lock-roster"
    description: "Lock the heat's roster: no further registrations or inbound reassignments."
    roles: [RaceDirector]
    code: 200
    input: []
    output: Wave
    side_effects: ["roster_status -> LOCKED", "release_status is untouched"]
  - method: POST
    path: "/ocr/waves/{id}/release"
    description: "Release a locked, SCHEDULED heat to the corral: enforces course publication, medical coverage, readiness posture, a non-empty roster and the live bottleneck capacity."
    roles: [RaceDirector]
    code: 200
    input: []
    output: Wave
    side_effects: ["release_status -> RELEASED"]
  - method: POST
    path: "/ocr/waves/{id}/start"
    description: "Fire the gun on a RELEASED heat: stamps the gun instant, seals the roster, starts every checked-in entry and marks every un-checked-in entry DNS."
    roles: [RaceDirector]
    code: 200
    input: []
    output: Wave
    side_effects: ["release_status -> STARTED, roster_status -> SEALED", "actual_start_utc stamped from the logical clock", "CHECKED_IN entries -> STARTED with chip_start_utc computed", "REGISTERED entries -> DNS / NOT_CLASSIFIED"]
  - method: POST
    path: "/ocr/waves/{id}/close"
    description: "Close a STARTED heat: unfinished entries become DNF and provisional results are promoted to official."
    roles: [RaceDirector]
    code: 200
    input: []
    output: Wave
    side_effects: ["release_status -> CLOSED, closed_at_utc stamped", "STARTED entries -> DNF / NOT_CLASSIFIED", "PROVISIONAL entries -> OFFICIAL with the official reading computed", "UNDER_PROTEST entries are left alone", "bubble-up: Course PUBLISHED -> COMPLETED when no heat remains open"]
  - method: POST
    path: "/ocr/waves/{id}/entries"
    description: "Register a participant into an OPEN-roster heat: enforces waiver, age, division shape rules, bib uniqueness and the heat's roster capacity."
    roles: [SiteOpsLead, RaceDirector]
    code: 201
    input: [participant_id, bib_number, "team_code?"]
    output: Entry
    side_effects: ["progress_status = REGISTERED, result_status = PENDING", "recomputes Wave.assigned_count"]

  # --- Participant -----------------------------------------------------
  - method: POST
    path: "/ocr/participants"
    description: "Enrol a human with a bonded timing chip. Enrolment does not sign the waiver."
    roles: [SiteOpsLead, RaceDirector]
    code: 201
    input: [full_name, birth_year, email, chip_id]
    output: Participant
    side_effects: ["waiver_signed = false", "clearance_status = PENDING"]
  - method: GET
    path: "/ocr/participants"
    description: "List enrolled participants, filterable by clearance status."
    roles: [SiteOpsLead, RaceDirector, SafetyOfficer]
    code: 200
    input: ["clearance_status?", "limit?", "offset?"]
    output: Participant[]
    side_effects: []
  - method: GET
    path: "/ocr/participants/{id}"
    description: "Read one participant with waiver and clearance state."
    roles: [SiteOpsLead, RaceDirector, SafetyOfficer, Participant]
    code: 200
    input: []
    output: Participant
    side_effects: []
  - method: POST
    path: "/ocr/participants/{id}/waiver"
    description: "Sign the liability waiver and declare medical conditions. A blocking condition (CARDIAC, PREGNANCY, RECENT_SURGERY) holds the participant medically instead of clearing them. A Participant may only sign their own waiver."
    roles: [Participant, RaceDirector]
    code: 200
    input: [signature_name, "medical_flags?"]
    output: Participant
    side_effects: ["waiver_signed = true", "clearance_status -> CLEARED or MEDICALLY_HELD"]

  # --- Entry -----------------------------------------------------------
  - method: GET
    path: "/ocr/entries"
    description: "List entries, filterable by heat, by participant, by either state dimension, and by the attempt a protest disputes."
    roles: [RaceDirector, SiteOpsLead, SafetyOfficer, ObstacleMarshal]
    code: 200
    input: ["wave_id?", "participant_id?", "progress_status?", "result_status?", "disputed_attempt_id?", "limit?", "offset?"]
    output: Entry[]
    side_effects: []
  - method: GET
    path: "/ocr/entries/{id}"
    description: "Read one entry with both readings (provisional and official), penalty totals, protest count and voided attempt ids. A Participant may only read their own entry."
    roles: [RaceDirector, SiteOpsLead, SafetyOfficer, ObstacleMarshal, Participant]
    code: 200
    input: []
    output: Entry
    side_effects: []
  - method: POST
    path: "/ocr/entries/{id}/check-in"
    description: "Check a registered entry in at bag check, issue the bag tag and record the start-mat offset. Requires the participant to be CLEARED."
    roles: [SiteOpsLead, RaceDirector]
    code: 200
    input: [bag_tag_code, chip_start_offset_seconds]
    output: Entry
    side_effects: ["progress_status -> CHECKED_IN", "stores bag_tag_code and chip_start_offset_seconds"]
  - method: POST
    path: "/ocr/entries/{id}/reassign-wave"
    description: "Move an entry to another heat on the same course. Both the source and the target roster must still be OPEN, and the target heat must have room."
    roles: [RaceDirector]
    code: 200
    input: [target_wave_id]
    output: Entry
    side_effects: ["wave_id -> target_wave_id", "recomputes assigned_count on both heats (the conserved roster total is unchanged)"]
  - method: POST
    path: "/ocr/entries/{id}/finish"
    description: "Record a finish for a started entry: stamps the finish instant and computes the provisional reading."
    roles: [RaceDirector, ObstacleMarshal]
    code: 200
    input: []
    output: Entry
    side_effects: ["progress_status -> FINISHED", "result_status PENDING -> PROVISIONAL", "computes provisional_penalty_seconds and provisional_elapsed_seconds"]
  - method: POST
    path: "/ocr/entries/{id}/protests"
    description: "File a protest against one recorded attempt on the entry's own card. Only the participant who owns the entry may file, at most twice."
    roles: [Participant]
    code: 200
    input: [disputed_attempt_id, reason]
    output: Entry
    side_effects: ["result_status PROVISIONAL -> UNDER_PROTEST", "stores disputed_attempt_id"]
  - method: POST
    path: "/ocr/entries/{id}/adjudications"
    description: "Rule on the open protest. Carries the entry's expected version; the acting operator may not adjudicate an attempt they recorded themselves."
    roles: [RaceDirector]
    code: 200
    input: [outcome, expected_entry_version, "note?"]
    output: Entry
    side_effects: ["UPHELD_ADJUSTED: voids the disputed attempt's penalty, returns to PROVISIONAL and recomputes the official reading", "DENIED_OFFICIAL: result_status -> OFFICIAL", "DISQUALIFIED: result_status -> DISQUALIFIED with dq_reason = ADJUDICATED_DQ", "increments protest_rounds"]

  # --- ObstacleAttempt -------------------------------------------------
  - method: POST
    path: "/ocr/entries/{id}/attempts"
    description: "Record what happened to a started entry at one obstacle. Marshaling truth is enforced: a normal outcome needs a staffed station, and SKIPPED_UNMARSHALED needs an unstaffed one."
    roles: [ObstacleMarshal, RaceDirector]
    code: 201
    input: [obstacle_id, outcome]
    output: ObstacleAttempt
    side_effects: ["stamps recorded_at from the logical clock, recorded_by_user_id and recorded_by_role from the headers", "snapshots obstacle_staffing_state_at_record", "computes this attempt's provisional_penalty_seconds", "recomputes Entry.provisional_penalty_seconds", "BYPASSED in a DQ_ON_BYPASS division: Entry.result_status -> DISQUALIFIED"]
  - method: GET
    path: "/ocr/entries/{id}/attempts"
    description: "List the entry's attempt card in chronological order."
    roles: [RaceDirector, SiteOpsLead, SafetyOfficer, ObstacleMarshal, Participant]
    code: 200
    input: ["outcome?", "limit?", "offset?"]
    output: ObstacleAttempt[]
    side_effects: []

  # --- StaffAssignment -------------------------------------------------
  - method: POST
    path: "/ocr/courses/{id}/staff-assignments"
    description: "Roster one person onto a shift on the course. MARSHAL and WATER_SAFETY shifts name an obstacle; MEDIC and SWEEP shifts must not. Shifts for the same person must not collide once inflated by the travel buffer."
    roles: [SafetyOfficer]
    code: 201
    input: [staff_person_id, staff_role, certification_level, shift_start_utc, shift_end_utc, "obstacle_id?"]
    output: StaffAssignment
    side_effects: ["status = CONFIRMED", "MARSHAL: recomputes Obstacle.confirmed_marshal_count, staffing_state and effective_clearance_rate_per_min", "recomputes Course.medic_headcount, water_safety_headcount, bottleneck_capacity_pph and readiness_posture"]
  - method: GET
    path: "/ocr/staff-assignments"
    description: "List shifts, filterable by course, by obstacle, by person and by status."
    roles: [SafetyOfficer, RaceDirector, CourseDesigner, ObstacleMarshal]
    code: 200
    input: ["course_id?", "obstacle_id?", "staff_person_id?", "status?", "limit?", "offset?"]
    output: StaffAssignment[]
    side_effects: []
  - method: GET
    path: "/ocr/staff-assignments/{id}"
    description: "Read one shift."
    roles: [SafetyOfficer, RaceDirector, CourseDesigner, ObstacleMarshal]
    code: 200
    input: []
    output: StaffAssignment
    side_effects: []
  - method: POST
    path: "/ocr/staff-assignments/{id}/vacate"
    description: "Release a person from a confirmed shift. This is the head of the 4-link staffing cascade down to held heats."
    roles: [SafetyOfficer]
    code: 200
    input: [reason]
    output: StaffAssignment
    side_effects: ["status -> VACATED", "link 2: obstacle marshal count and staffing_state recompute", "link 3: Course.readiness_posture recomputes", "link 4: imminent SCHEDULED heats -> HELD with hold_reason = COURSE_RESTRICTED", "recomputes Course.bottleneck_capacity_pph"]

  # --- FestivalService -------------------------------------------------
  - method: POST
    path: "/ocr/venues/{id}/festival-services"
    description: "Install a festival-area service on the parcel. A positive water draw requires the governing permit to allow water use, and the footprint counts toward the parcel's disturbed area."
    roles: [SiteOpsLead, RaceDirector]
    code: 201
    input: [service_type, footprint_sqm, capacity, "water_draw_lpm?"]
    output: FestivalService
    side_effects: ["status = OPEN", "recomputes Venue.disturbed_area_sqm"]
  - method: GET
    path: "/ocr/venues/{id}/festival-services"
    description: "List the festival-area installations on the parcel."
    roles: [PermitOfficer, CourseDesigner, RaceDirector, SafetyOfficer, SiteOpsLead]
    code: 200
    input: ["service_type?", "status?", "limit?", "offset?"]
    output: FestivalService[]
    side_effects: []

  # --- RestorationTask -------------------------------------------------
  - method: POST
    path: "/ocr/venues/{id}/restoration-tasks"
    description: "Open a post-event remediation task over a measured area of the parcel. The sum of task areas may not exceed the parcel's disturbed area."
    roles: [PermitOfficer, SiteOpsLead]
    code: 201
    input: [task_type, area_sqm]
    output: RestorationTask
    side_effects: ["status = PENDING", "bond_release_cents = 0, inspection_rounds = 0"]
  - method: GET
    path: "/ocr/venues/{id}/restoration-tasks"
    description: "List the remediation tasks on the parcel with their per-task bond attribution."
    roles: [PermitOfficer, CourseDesigner, RaceDirector, SiteOpsLead]
    code: 200
    input: ["status?", "task_type?", "limit?", "offset?"]
    output: RestorationTask[]
    side_effects: []
  - method: GET
    path: "/ocr/restoration-tasks/{id}"
    description: "Read one remediation task with its inspection count and attributed bond cents."
    roles: [PermitOfficer, CourseDesigner, RaceDirector, SiteOpsLead]
    code: 200
    input: []
    output: RestorationTask
    side_effects: []
  - method: POST
    path: "/ocr/restoration-tasks/{id}/inspect"
    description: "Record an inspection on a remediation task. A pass attributes and releases the task's provisional bond share; a fail on an already-verified task claws that share back."
    roles: [PermitOfficer]
    code: 200
    input: [outcome, "findings_note?"]
    output: RestorationTask
    side_effects: ["VERIFIED: computes bond_release_cents (variant per_task_provisional), Venue.bond_released_cents += it and bond_held_cents -= it", "REMEDIATION_REQUIRED from VERIFIED: reverses that ledger move and resets bond_release_cents to 0", "increments inspection_rounds"]

  # --- Bond settlement -------------------------------------------------
  - method: POST
    path: "/ocr/venues/{id}/bond-releases"
    description: "Settle the restoration bond. PROGRESSIVE recomputes the released/held split from the currently VERIFIED tasks and leaves the parcel open; FINAL requires every task verified, applies the late-remediation penalty against the restoration deadline, assigns the rounding remainder and closes the parcel out. Carries the venue's expected version."
    roles: [PermitOfficer]
    code: 200
    input: [settlement_type, expected_venue_version]
    output: Venue
    side_effects: ["PROGRESSIVE: recomputes bond_released_cents / bond_held_cents from variant per_task_provisional", "FINAL: applies variant final_closeout, sets bond_forfeited_cents from the lateness penalty, assigns the remainder to the largest-area task and moves site_posture -> CLOSED_OUT"]

  # --- Test-driving surface --------------------------------------------
  - method: POST
    path: "/ocr/_clock/set_current_utc"
    description: "Set the server's logical clock, which every stamped instant and every deadline rule reads. Before the first call the clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time. Advancing the clock past an APPROVED permit's valid_until_utc expires that permit and runs the venue-freeze cascade, returning the expired permit ids."
    roles: [PermitOfficer, RaceDirector]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime, expired_permit_ids: string[] }"
    side_effects: ["expires every APPROVED permit whose valid_until_utc is strictly before the new clock value", "each expiry runs the venue-freeze cascade (links 2-4 plus the FestivalService fan-out)"]

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================

errors:
  # --- auth / identity -------------------------------------------------
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID missing, empty, or a role outside the seven declared roles" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "The acting role is not listed on the endpoint in §1.5" }
  - { id: ERR_NOT_ENTRY_OWNER, http: 403, condition: "A Participant reads or acts on an Entry whose participant_id is not the acting X-User-ID, or signs another participant's waiver" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "The acting operator id decides a permit it submitted, or adjudicates a protest against an ObstacleAttempt it recorded" }
  # --- schema ----------------------------------------------------------
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Missing required field, wrong type, unknown enum member, out-of-range number, shift_end_utc not after shift_start_utc, obstacle_id supplied on a MEDIC or SWEEP assignment, or limit/offset outside 1..100 / >= 0" }
  # --- existence -------------------------------------------------------
  - { id: ERR_VENUE_NOT_FOUND, http: 404, condition: "No Venue with the given id" }
  - { id: ERR_PERMIT_NOT_FOUND, http: 404, condition: "No LandUsePermit with the given id" }
  - { id: ERR_COURSE_NOT_FOUND, http: 404, condition: "No Course with the given id" }
  - { id: ERR_OBSTACLE_NOT_FOUND, http: 404, condition: "No Obstacle with the given id, or a paired_obstacle_id / obstacle_id that does not resolve on the addressed course" }
  - { id: ERR_DIVISION_NOT_FOUND, http: 404, condition: "No Division with the given division_id" }
  - { id: ERR_WAVE_NOT_FOUND, http: 404, condition: "No Wave with the given id or target_wave_id" }
  - { id: ERR_PARTICIPANT_NOT_FOUND, http: 404, condition: "No Participant with the given id or participant_id" }
  - { id: ERR_ENTRY_NOT_FOUND, http: 404, condition: "No Entry with the given id" }
  - { id: ERR_ATTEMPT_NOT_FOUND, http: 404, condition: "No ObstacleAttempt with the given disputed_attempt_id, or the attempt exists but belongs to a different entry" }
  - { id: ERR_STAFF_ASSIGNMENT_NOT_FOUND, http: 404, condition: "No StaffAssignment with the given id" }
  - { id: ERR_RESTORATION_TASK_NOT_FOUND, http: 404, condition: "No RestorationTask with the given id" }
  # --- optimistic concurrency ------------------------------------------
  - { id: ERR_STALE_ENTRY_VERSION, http: 412, condition: "expected_entry_version on an adjudication does not equal the Entry's current version" }
  - { id: ERR_STALE_VENUE_VERSION, http: 412, condition: "expected_venue_version on a bond settlement does not equal the Venue's current version" }
  # --- state -----------------------------------------------------------
  - { id: ERR_PERMIT_STATE_INVALID, http: 409, condition: "submit on a permit that is not DRAFT or REVISION_REQUESTED, or a decision on a permit that is not SUBMITTED" }
  - { id: ERR_PERMIT_ALREADY_APPROVED, http: 409, condition: "Approving a permit while another permit on the same venue already has status APPROVED" }
  - { id: ERR_COURSE_STATE_INVALID, http: 409, condition: "validate on a course that is not DRAFT, or publish on a course that is not VALIDATED" }
  - { id: ERR_OBSTACLE_SET_FROZEN, http: 409, condition: "Placing an obstacle on a course whose status is no longer DRAFT" }
  - { id: ERR_VENUE_FROZEN, http: 409, condition: "Any design, scheduling, permit-submit, festival-install or inspection operation on a venue whose site_posture is FROZEN or CLOSED_OUT" }
  - { id: ERR_WAVE_NOT_RELEASABLE, http: 409, condition: "release on a heat whose release_status is not SCHEDULED (HELD, RELEASED, STARTED or CLOSED)" }
  - { id: ERR_WAVE_ROSTER_NOT_LOCKED, http: 409, condition: "release on a heat whose roster_status is still OPEN" }
  - { id: ERR_ROSTER_CLOSED, http: 409, condition: "Registering into, or reassigning into, a heat whose roster_status is LOCKED or SEALED; or checking in against a SEALED roster" }
  - { id: ERR_WAVE_STATE_INVALID, http: 409, condition: "hold / lock-roster / start / close invoked from a release_status or roster_status that does not admit the transition" }
  - { id: ERR_ENTRY_STATE_INVALID, http: 409, condition: "check-in on an entry that is not REGISTERED, finish on an entry that is not STARTED, reassignment of an entry past REGISTERED, an attempt recorded against an entry that is not STARTED, or an adjudication on an entry that is not UNDER_PROTEST" }
  - { id: ERR_ENTRY_NOT_PROTESTABLE, http: 409, condition: "A protest filed on an entry whose result_status is not PROVISIONAL" }
  - { id: ERR_PROTEST_ROUNDS_EXHAUSTED, http: 409, condition: "A third protest on an entry that already has protest_rounds == 2" }
  - { id: ERR_ASSIGNMENT_NOT_ACTIVE, http: 409, condition: "vacate on a shift whose status is already VACATED" }
  - { id: ERR_TASK_STATE_INVALID, http: 409, condition: "An inspection outcome that does not change the task's state (VERIFIED on an already VERIFIED task, or REMEDIATION_REQUIRED on an already REMEDIATION_REQUIRED task)" }
  - { id: ERR_BOND_ALREADY_SETTLED, http: 409, condition: "Any bond settlement against a venue whose site_posture is already CLOSED_OUT" }
  # --- business: referential / cross-entity ----------------------------
  - { id: ERR_COURSE_NOT_PUBLISHED, http: 409, condition: "release on a heat whose course.status is not PUBLISHED" }
  - { id: ERR_WAVE_COURSE_MISMATCH, http: 409, condition: "reassign-wave where the target heat belongs to a different course, or to a different division, than the entry's current heat" }
  - { id: ERR_DIVISION_RULE_VIOLATION, http: 409, condition: "team_code omitted in a TEAM-division heat or supplied in a non-TEAM heat, a team_code already holding team_size_max entries in the heat, or a MARSHAL / WATER_SAFETY shift with no obstacle_id" }
  - { id: ERR_BYPASS_NOT_ALLOWED, http: 409, condition: "A BYPASSED outcome at an obstacle whose bypass_mode is MANDATORY, or in a division whose bypass_policy is MANDATORY_COMPLETION" }
  - { id: ERR_TEAM_INCOMPLETE, http: 409, condition: "start on a TEAM-division heat where some team_code has fewer than division.team_size_min checked-in entries" }
  # --- business: safety ------------------------------------------------
  - { id: ERR_MEDICAL_COVERAGE_INSUFFICIENT, http: 409, condition: "release where course.medic_headcount is below ceil(course.scheduled_capacity_total / 250)" }
  - { id: ERR_COURSE_UNSAFE, http: 409, condition: "release, start, or un-hold while course.readiness_posture is RESTRICTED or FROZEN" }
  - { id: ERR_WAIVER_REQUIRED, http: 409, condition: "Registering a participant whose waiver_signed is false" }
  - { id: ERR_PARTICIPANT_NOT_CLEARED, http: 409, condition: "check-in for a participant whose clearance_status is PENDING or MEDICALLY_HELD" }
  - { id: ERR_OBSTACLE_UNMARSHALED, http: 409, condition: "An attempt with outcome COMPLETED, BYPASSED or FAILED_PENALTY recorded at an obstacle whose staffing_state is UNSTAFFED" }
  - { id: ERR_OBSTACLE_MARSHALED, http: 409, condition: "An attempt with outcome SKIPPED_UNMARSHALED recorded at an obstacle whose staffing_state is PARTIAL or MARSHALED" }
  # --- business: temporal ----------------------------------------------
  - { id: ERR_QUIET_HOURS_VIOLATION, http: 409, condition: "A heat scheduled with its start hour inside the governing permit's half-open nightly quiet window" }
  - { id: ERR_STAFF_SHIFT_CONFLICT, http: 409, condition: "A new shift for a staff_person_id whose buffer-inflated interval touches an existing CONFIRMED shift of the same person" }
  - { id: ERR_CORRAL_WINDOW_CONFLICT, http: 409, condition: "A heat whose 6-minute start-corral occupancy interval pushes the aggregate overlapping capacity above course.corral_throughput_capacity" }
  # --- business: uniqueness / constraint -------------------------------
  - { id: ERR_STATION_INDEX_CONFLICT, http: 409, condition: "An obstacle placed at a station_index already used on that course" }
  - { id: ERR_BIB_NUMBER_TAKEN, http: 409, condition: "An entry registered with a bib_number already used in that heat" }
  - { id: ERR_UNIQUENESS_CONFLICT, http: 409, condition: "A duplicate permit_number, Participant.email, Participant.chip_id, or Wave.wave_code within its course" }
  - { id: ERR_PERMIT_NOT_APPROVED, http: 409, condition: "Course validation, a water-drawing festival installation, or a bond settlement on a venue with no single APPROVED governing permit" }
  - { id: ERR_WATER_USE_NOT_PERMITTED, http: 409, condition: "A water-contact obstacle or a positive water_draw_lpm while the governing permit has water_use_allowed == false" }
  - { id: ERR_COURSE_TOO_SHORT, http: 422, condition: "Course validation with fewer than 3 primary obstacles" }
  - { id: ERR_PROGRESSION_TOO_FLAT, http: 422, condition: "Course validation with difficulty_progression_score below 0.50" }
  - { id: ERR_PROGRESSION_REGRESSION, http: 422, condition: "Course validation where a consecutive station pair drops by more than 2 difficulty points" }
  - { id: ERR_AGE_INELIGIBLE, http: 409, condition: "A participant whose calendar-year age at the heat's scheduled start is below division.min_age" }
  - { id: ERR_RESTORATION_AREA_EXCEEDED, http: 409, condition: "A remediation task that pushes the parcel's total task area above Venue.disturbed_area_sqm" }
  - { id: ERR_RESTORATION_INCOMPLETE, http: 409, condition: "A FINAL settlement while some remediation task is not VERIFIED, or while the parcel has no remediation task at all" }
  # --- business: fiscal / capacity -------------------------------------
  - { id: ERR_DISTURBED_AREA_EXCEEDED, http: 409, condition: "Course validation where Venue.disturbed_area_sqm exceeds the governing permit's max_disturbed_area_sqm (equality is allowed)" }
  - { id: ERR_DESIGN_CAPACITY_EXCEEDED, http: 409, condition: "A heat scheduled with capacity above floor(course.design_capacity_pph * 15 / 60)" }
  - { id: ERR_WAVE_CAPACITY_EXCEEDED, http: 409, condition: "A registration or inbound reassignment that would push the receiving heat's assigned_count above its capacity" }
  - { id: ERR_BOTTLENECK_CAPACITY_EXCEEDED, http: 409, condition: "release of a heat whose capacity exceeds floor(course.bottleneck_capacity_pph * 15 / 60) under live staffing" }
  - { id: ERR_WAVE_ROSTER_EMPTY, http: 409, condition: "release of a heat with assigned_count == 0" }

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================

roles:
  - name: PermitOfficer
    description: "Land-authority side of the operation: registers parcels, rules on land-use applications, inspects remediation and settles the restoration bond. Its operator id is compared against a permit's submitted_by_user_id, so the same human acting as CourseDesigner cannot rubber-stamp their own application."
    identity: "opaque"
    exclusive_operations:
      - "POST /ocr/venues"
      - "POST /ocr/permits/{id}/decision"
      - "POST /ocr/restoration-tasks/{id}/inspect"
      - "POST /ocr/venues/{id}/bond-releases"
    shared_operations:
      - "POST /ocr/venues/{id}/restoration-tasks (with SiteOpsLead)"
      - "POST /ocr/_clock/set_current_utc (with RaceDirector)"
      - "GET reads on venues, permits, courses, obstacles, waves, festival services and restoration tasks"
  - name: CourseDesigner
    description: "Designs the temporary course and files the land-use application. Files and re-files applications but never rules on them."
    identity: "opaque"
    exclusive_operations:
      - "POST /ocr/venues/{id}/permits"
      - "POST /ocr/permits/{id}/submit"
      - "POST /ocr/venues/{id}/courses"
      - "POST /ocr/courses/{id}/obstacles"
      - "POST /ocr/courses/{id}/validate"
    shared_operations:
      - "GET reads on venues, permits, courses, obstacles, waves, staff assignments, obstacle attempts, festival services and restoration tasks"
  - name: RaceDirector
    description: "Owns race-day operations: divisions, heat scheduling, the start line, results and adjudication. The broadest operational role, but it cannot design a course, rule on a permit, or roster staff."
    identity: "opaque"
    exclusive_operations:
      - "POST /ocr/divisions"
      - "POST /ocr/courses/{id}/publish"
      - "POST /ocr/courses/{id}/waves"
      - "POST /ocr/waves/{id}/lock-roster"
      - "POST /ocr/waves/{id}/release"
      - "POST /ocr/waves/{id}/start"
      - "POST /ocr/waves/{id}/close"
      - "POST /ocr/entries/{id}/reassign-wave"
      - "POST /ocr/entries/{id}/adjudications"
    shared_operations:
      - "POST /ocr/waves/{id}/hold (with SafetyOfficer)"
      - "POST /ocr/waves/{id}/entries, POST /ocr/participants, POST /ocr/entries/{id}/check-in (with SiteOpsLead)"
      - "POST /ocr/participants/{id}/waiver (with Participant)"
      - "POST /ocr/entries/{id}/attempts, POST /ocr/entries/{id}/finish (with ObstacleMarshal)"
      - "POST /ocr/venues/{id}/festival-services (with SiteOpsLead)"
      - "POST /ocr/_clock/set_current_utc (with PermitOfficer)"
      - "GET reads across the whole surface"
  - name: SafetyOfficer
    description: "Owns staffing and medical coverage: rosters marshals, medics, water-safety and sweeps, releases people from shifts, and can hold a heat at the start line. Cannot release or start a heat."
    identity: "opaque"
    exclusive_operations:
      - "POST /ocr/courses/{id}/staff-assignments"
      - "POST /ocr/staff-assignments/{id}/vacate"
    shared_operations:
      - "POST /ocr/waves/{id}/hold (with RaceDirector)"
      - "GET reads on venues, permits, courses, obstacles, waves, entries, participants, staff assignments, obstacle attempts and festival services"
  - name: SiteOpsLead
    description: "Runs the festival area and the front of house: enrols participants, registers them into heats, checks them in at bag check, installs festival services and opens remediation tasks."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /ocr/participants, POST /ocr/waves/{id}/entries, POST /ocr/entries/{id}/check-in (with RaceDirector)"
      - "POST /ocr/venues/{id}/festival-services (with RaceDirector)"
      - "POST /ocr/venues/{id}/restoration-tasks (with PermitOfficer)"
      - "GET reads on venues, permits, courses, obstacles, waves, entries, participants, festival services and restoration tasks"
  - name: ObstacleMarshal
    description: "Stands at a station and records what happens there. Its operator id is stamped onto every attempt it records, which is what blocks that same id from later adjudicating a protest about it."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /ocr/entries/{id}/attempts, POST /ocr/entries/{id}/finish (with RaceDirector)"
      - "GET reads on courses, obstacles, waves, entries, obstacle attempts and staff assignments"
  - name: Participant
    description: "The human running the race. X-User-ID is the Participant row's id, so ownership checks compare it against Entry.participant_id and Participant.id."
    identity: "entity_backed:Participant"
    exclusive_operations:
      - "POST /ocr/entries/{id}/protests"
    shared_operations:
      - "POST /ocr/participants/{id}/waiver (with RaceDirector, own row only)"
      - "GET /ocr/participants/{id}, GET /ocr/entries/{id}, GET /ocr/entries/{id}/attempts (own rows only)"
      - "GET /ocr/divisions, GET /ocr/divisions/{id}, GET /ocr/waves, GET /ocr/waves/{id}"
