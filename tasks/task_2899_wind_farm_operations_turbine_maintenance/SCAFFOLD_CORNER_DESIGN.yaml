            - "after the second sync operating_hours == 3000.0, period_actual_energy_kwh == 5700000.0 and period_potential_energy_kwh == 6000000.0, so both energy counters accumulate"
            - "the third response body carries operating_hours == 4200.0, period_actual_energy_kwh == 7700000.0 and period_potential_energy_kwh == 8400000.0"
            - "service_due_flag == true in that same response, because 4200.0 >= 4000"
