              payload: { staff_member_id: "${mgr_id}", credential_type: "CPR_AED", issuer: "American Heart Association", credential_number: "AHA-771", expires_on: "2027-06-30" }
              as: OperatorAdmin
              captures: { mgr_cred_id: $.data.id }
            - call: "POST /staff-credentials/${mgr_cred_id}/verify"
              payload: { decision: "ACCEPT" }
              as: OperatorAdmin
            - call: "POST /client-contracts/${c_id}/submit"
              payload: {}
