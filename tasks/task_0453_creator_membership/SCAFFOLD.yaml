# =============================================================================
# Scaffold: creator-membership (Patreon-style Creator Membership & Subscription)
# Difficulty tier: EXPERT (§0.4)
# =============================================================================

scenario: |
  Creator Membership & Subscription (Patreon style): creator tiers & benefits,
  member pledge & billing (per-month/per-creation), pause/upgrade & proration,
  exclusive-content gating, charge-up-front vs end-of-month, payout & platform
  fee, patron-only messaging, churn/lapsed win-back

domain_name: creator-membership
api_prefix: /         # flat topology: peer top-level resources (/creators, /tiers, /pledges, /charges, /posts, /conversations, /payouts, /win-back-offers)

# =============================================================================
# Complexity Profile (§0.1–§0.3)
# =============================================================================
complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
    - scheduled_actions

  entity_topology: flat
  # Peer entities linked by foreign keys; Pledge, Charge, Post, Conversation,
  # Payout are top-level resources keyed by FK, not nested under /creators/{id}/...
  # in their write paths. Reverse-reachability via filtered lists.

  state_machine_shape: parallel
  # Pledge carries two independent state axes: lifecycle_status (DRAFT→ACTIVE→
  # PAUSED→...→CANCELLED) and billing_status (CURRENT→PAST_DUE→GRACE→LAPSED),
  # which evolve independently. Plus a billing-mode cycle (upgrade/downgrade
  # scheduling loop) and Charge branching fork-join.

  relationship_patterns:
    - one_to_many        # Creator -> Tier, Creator -> Post, Pledge -> Charge
    - many_to_many       # Patron <-> Creator via Pledge (junction)
    - cross_aggregate    # PostAccess references Pledge across the membership boundary

  role_model: peer_roles
  # Creator owns tiers/posts/payouts; Patron owns pledges/messages; PlatformAdmin
  # (opaque) runs billing cycles & clock; automatic billing-axis transitions use
  # the conceptual `system` actor (driven by PlatformAdmin settle/run-cycle calls).

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Creator
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: display_name, type: string, source: input, description: "Public creator name" }
      - { name: email, type: string, source: input, description: "Login/contact email; unique among creators" }
      - { name: platform_plan, type: enum, source: input, default: "STARTER", description: "Creator's platform subscription plan controlling payout fee rate", constraints: "one of STARTER | PRO | PREMIUM" }
      - { name: payout_account_ref, type: string, source: input, description: "Opaque external payout destination handle" }
      - { name: billing_mode, type: enum, source: input, default: "MONTHLY", description: "Default billing model offered by this creator", constraints: "one of MONTHLY | PER_CREATION" }
      - { name: charge_timing, type: enum, source: input, default: "UP_FRONT", description: "When new-cycle and proration charges are collected", constraints: "one of UP_FRONT | END_OF_MONTH" }
      - { name: pending_payout_cents, type: integer, source: computed, description: "Sum of net amounts of SUCCEEDED Charges not yet swept into a Payout; recomputed on charge settle and payout run; starts 0" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "Creator account lifecycle; set to ACTIVE on registration", constraints: "one of ACTIVE" }

  - name: Tier
    parent: null
    common_fields: true
    fields:
      - { name: creator_id, type: string, source: input, description: "FK -> Creator.id; the owning creator" }
      - { name: name, type: string, source: input, description: "Tier display name; unique per creator among non-RETIRED tiers" }
      - { name: monthly_fee_cents, type: integer, source: input, description: "Per-month pledge price in cents; required when billing_model=MONTHLY", constraints: ">= 100 when present" }
      - { name: per_creation_fee_cents, type: integer, source: input, description: "Charge per published paid Post in cents; required when billing_model=PER_CREATION", constraints: ">= 50 when present" }
      - { name: per_creation_monthly_cap_cents, type: integer, source: input, description: "Max total per-creation charge per cycle in cents; required when billing_model=PER_CREATION", constraints: ">= per_creation_fee_cents when present" }
      - { name: billing_model, type: enum, source: input, description: "Billing model this tier uses", constraints: "one of MONTHLY | PER_CREATION" }
      - { name: rank, type: integer, source: input, description: "Ordering rank within the creator's tier ladder; higher = more premium; unique per creator among non-RETIRED tiers", constraints: ">= 1" }
      - { name: benefit_labels, type: array, source: input, description: "List of benefit description strings granted to members" }
      - { name: active_pledge_count, type: integer, source: computed, description: "Count of Pledges on this tier with lifecycle_status IN {ACTIVE, PAUSED}; recomputed on pledge create/cancel/upgrade; starts 0" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "Tier lifecycle", constraints: "one of DRAFT | PUBLISHED | RETIRED" }

  - name: Patron
    parent: null
    common_fields: true
    fields:
      - { name: display_name, type: string, source: input, description: "Patron name" }
      - { name: email, type: string, source: input, description: "Login/contact email; unique among patrons" }
      - { name: wallet_credit_cents, type: integer, source: computed, description: "Refund/credit balance in cents applied before card on next charge; starts 0; never negative" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "Patron account lifecycle; set to ACTIVE on registration", constraints: "one of ACTIVE" }

  - name: Pledge
    parent: null
    common_fields: true
    fields:
      - { name: patron_id, type: string, source: input, description: "FK -> Patron.id; the pledging patron" }
      - { name: creator_id, type: string, source: input, description: "FK -> Creator.id; the supported creator" }
      - { name: tier_id, type: string, source: input, description: "FK -> Tier.id; currently active tier" }
      - { name: scheduled_tier_id, type: string, source: computed, description: "FK -> Tier.id; tier to apply at next cycle anchor for an END_OF_MONTH downgrade/change; null when none scheduled" }
      - { name: billing_model, type: enum, source: computed, description: "Copied from the active tier at pledge/upgrade time", constraints: "one of MONTHLY | PER_CREATION" }
      - { name: cycle_anchor_date, type: datetime, source: computed, description: "ISO 8601 UTC date the current billing cycle began (1st of month for renewals; pledge date for first cycle)" }
      - { name: current_cycle_charged_cents, type: integer, source: computed, description: "Total charged to this pledge within the current cycle; used for PER_CREATION cap enforcement; resets to 0 at each cycle anchor; starts 0" }
      - { name: lifecycle_status, type: enum, source: system, default: "DRAFT", description: "Membership lifecycle axis (independent of billing_status)", constraints: "one of DRAFT | ACTIVE | PAUSED | CANCELLED" }
      - { name: billing_status, type: enum, source: system, default: "CURRENT", description: "Billing health axis (independent of lifecycle_status)", constraints: "one of CURRENT | PAST_DUE | GRACE | LAPSED" }
      - { name: grace_deadline, type: datetime, source: computed, description: "ISO 8601 UTC instant at which a GRACE pledge auto-LAPSES if unpaid; null unless billing_status=GRACE" }
      - { name: lapsed_at, type: datetime, source: computed, description: "ISO 8601 UTC instant the pledge entered LAPSED (for win-back window); null unless it has lapsed" }
      - { name: win_back_applied, type: boolean, source: computed, default: false, description: "True if a win-back discount was applied to this pledge's reactivation cycle" }

  - name: Charge
    parent: null
    common_fields: true
    fields:
      - { name: pledge_id, type: string, source: input, description: "FK -> Pledge.id; the pledge being billed" }
      - { name: creator_id, type: string, source: computed, description: "FK -> Creator.id; denormalized from pledge for payout grouping" }
      - { name: charge_kind, type: enum, source: input, description: "Reason for the charge", constraints: "one of INITIAL_PRORATION | CYCLE_RENEWAL | UPGRADE_PRORATION | PER_CREATION | WIN_BACK" }
      - { name: cycle_anchor_date, type: datetime, source: computed, description: "ISO 8601 UTC cycle this charge belongs to" }
      - { name: gross_amount_cents, type: integer, source: computed, description: "Pre-credit billed amount in cents (after proration/discount, before wallet credit)" }
      - { name: wallet_applied_cents, type: integer, source: computed, description: "Wallet credit consumed against this charge; 0..gross_amount_cents" }
      - { name: net_amount_cents, type: integer, source: computed, description: "Amount captured from card = gross_amount_cents - wallet_applied_cents" }
      - { name: processing_fee_cents, type: integer, source: computed, description: "Payment processor fee for this charge in cents; 0 when net_amount_cents=0" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "Charge lifecycle", constraints: "one of PENDING | SUCCEEDED | FAILED | REFUNDED" }
      - { name: swept_into_payout_id, type: string, source: computed, description: "FK -> Payout.id; the payout that swept this SUCCEEDED charge; null until swept" }

  - name: Post
    parent: null
    common_fields: true
    fields:
      - { name: creator_id, type: string, source: input, description: "FK -> Creator.id; the authoring creator" }
      - { name: title, type: string, source: input, description: "Post title" }
      - { name: body, type: string, source: input, description: "Post content body" }
      - { name: min_tier_rank, type: integer, source: input, description: "Minimum Tier.rank a patron's active tier must meet to view; 0 = public", constraints: ">= 0" }
      - { name: is_paid_creation, type: boolean, source: input, default: false, description: "When true and creator billing_mode=PER_CREATION, publishing bills eligible per-creation pledges" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "Post lifecycle", constraints: "one of DRAFT | PUBLISHED" }

  - name: PostAccess
    parent: null
    common_fields: false   # id, created_at only — immutable access-grant record
    fields:
      - { name: post_id, type: string, source: input, description: "FK -> Post.id; the gated post" }
      - { name: patron_id, type: string, source: input, description: "FK -> Patron.id; the requesting patron" }
      - { name: pledge_id, type: string, source: computed, description: "FK -> Pledge.id; the pledge that granted access at grant time" }
      - { name: granted_tier_rank, type: integer, source: computed, description: "The patron's tier rank at the instant access was granted (snapshot)" }

  - name: Conversation
    parent: null
    common_fields: true
    fields:
      - { name: creator_id, type: string, source: input, description: "FK -> Creator.id; the creator side" }
      - { name: patron_id, type: string, source: input, description: "FK -> Patron.id; the patron side" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "Conversation lifecycle", constraints: "one of OPEN | CLOSED" }
      - { name: message_count, type: integer, source: computed, description: "Count of Messages in this conversation; starts 0" }

  - name: Message
    parent: null
    common_fields: false   # id, created_at only — append-only message log
    fields:
      - { name: conversation_id, type: string, source: input, description: "FK -> Conversation.id; the thread" }
      - { name: sender_role, type: enum, source: computed, description: "Which side sent it", constraints: "one of CREATOR | PATRON" }
      - { name: sender_id, type: string, source: computed, description: "Creator.id or Patron.id of the sender" }
      - { name: body, type: string, source: input, description: "Message text" }

  - name: Payout
    parent: null
    common_fields: true
    fields:
      - { name: creator_id, type: string, source: input, description: "FK -> Creator.id; the paid creator" }
      - { name: cycle_anchor_date, type: datetime, source: input, description: "ISO 8601 UTC cycle date whose SUCCEEDED charges are swept" }
      - { name: gross_cents, type: integer, source: computed, description: "Sum of net_amount_cents of swept SUCCEEDED charges" }
      - { name: platform_fee_cents, type: integer, source: computed, description: "Platform commission deducted from gross" }
      - { name: processing_fee_cents, type: integer, source: computed, description: "Sum of processing_fee_cents over swept charges" }
      - { name: payout_amount_cents, type: integer, source: computed, description: "Net payable = gross_cents - platform_fee_cents - processing_fee_cents" }
      - { name: swept_charge_count, type: integer, source: computed, description: "Number of charges swept into this payout" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "Payout lifecycle", constraints: "one of PENDING | PAID | REVERSED" }

  - name: WinBackOffer
    parent: null
    common_fields: true
    fields:
      - { name: pledge_id, type: string, source: input, description: "FK -> Pledge.id; the lapsed pledge targeted by the offer" }
      - { name: discount_pct, type: number, source: input, default: 0.30, description: "Fractional discount applied to the reactivation cycle's first charge", constraints: "0 < discount_pct < 1" }
      - { name: expires_at, type: datetime, source: computed, description: "ISO 8601 UTC instant after which the offer can no longer be redeemed" }
      - { name: status, type: enum, source: system, default: "OFFERED", description: "Offer lifecycle", constraints: "one of OFFERED | REDEEMED | EXPIRED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---------- Tier ----------
  - entity: Tier
    field: status
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /tiers/{tierId}/publish"
        actor: Creator
        preconditions:
          - "if billing_model=MONTHLY then monthly_fee_cents present; if PER_CREATION then per_creation_fee_cents and per_creation_monthly_cap_cents present (else ERR_TIER_FIELDS_INCOMPLETE)"
          - "no other non-RETIRED Tier of this creator shares this rank (else ERR_TIER_RANK_TAKEN)"
        side_effects:
          - "Tier becomes pledgeable"
      - from: PUBLISHED
        to: RETIRED
        trigger: "POST /tiers/{tierId}/retire"
        actor: Creator
        preconditions:
          - "no Pledge on this tier has lifecycle_status IN {ACTIVE, PAUSED} (else ERR_TIER_HAS_MEMBERS)"
        side_effects:
          - "Tier no longer pledgeable; rank/name freed for reuse by future tiers"

  # ---------- Pledge: lifecycle axis (independent of billing axis) ----------
  - entity: Pledge
    field: lifecycle_status
    initial_state: DRAFT
    terminal_states: [CANCELLED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /pledges (creation auto-activates after first charge settles)"
        actor: system
        preconditions:
          - "target Tier.status == PUBLISHED (else ERR_TIER_NOT_PUBLISHED)"
          - "patron has no existing Pledge to this creator with lifecycle_status IN {DRAFT, ACTIVE, PAUSED} (else ERR_DUPLICATE_PLEDGE) — membership-interval exclusivity"
          - "first Charge (INITIAL_PRORATION or PER_CREATION enrollment) settled SUCCEEDED (else pledge stays DRAFT, billing_status=PAST_DUE)"
        side_effects:
          - "Tier.active_pledge_count incremented (calc active_pledge_count)"
          - "cycle_anchor_date set; current_cycle_charged_cents set to the settled charge amount"
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /pledges/{pledgeId}/pause"
        actor: Patron
        preconditions:
          - "lifecycle_status == ACTIVE (else ERR_PLEDGE_NOT_ACTIVE)"
          - "expected_pledge_version matches Pledge.version (else ERR_STALE_VERSION)"
        side_effects:
          - "future CYCLE_RENEWAL charges suspended; no refund of current cycle"
          - "increments Pledge.version by 1"
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /pledges/{pledgeId}/resume"
        actor: Patron
        preconditions:
          - "lifecycle_status == PAUSED (else ERR_PLEDGE_NOT_PAUSED)"
          - "expected_pledge_version matches Pledge.version (else ERR_STALE_VERSION)"
        side_effects:
          - "re-anchors cycle_anchor_date to current clock cycle; renewal billing resumes next anchor"
          - "increments Pledge.version by 1"
      - from: [ACTIVE, PAUSED]
        to: CANCELLED
        trigger: "POST /pledges/{pledgeId}/cancel"
        actor: Patron
        preconditions:
          - "lifecycle_status IN {ACTIVE, PAUSED} (else ERR_PLEDGE_NOT_CANCELLABLE)"
        side_effects:
          - "Tier.active_pledge_count decremented (calc active_pledge_count)"
          - "billing_status set to LAPSED; lapsed_at set to current clock; grace_deadline cleared"
          - "any OPEN Conversation between this patron and creator with no other ACTIVE/PAUSED pledge → CLOSED (cross-entity cascade)"
      - from: LAPSED_REACTIVATE   # pseudo-source: see note; reactivation re-enters ACTIVE from a CANCELLED+win-back path
        to: ACTIVE
        trigger: "POST /pledges/{pledgeId}/reactivate"
        actor: Patron
        preconditions:
          - "lifecycle_status == CANCELLED AND billing_status == LAPSED (else ERR_PLEDGE_NOT_REACTIVATABLE)"
          - "a redeemable WinBackOffer for this pledge exists OR reactivation within standard window (else billed at full proration)"
        side_effects:
          - "lifecycle_status → ACTIVE; billing_status → CURRENT; Tier.active_pledge_count incremented"
          - "WIN_BACK charge created (calc win_back_first_charge); win_back_applied=true if offer redeemed"
        note: "Reactivation is a cyclic re-entry: a CANCELLED+LAPSED pledge can loop back to ACTIVE, making this a non-linear (cyclic) machine."

  # ---------- Pledge: billing axis (parallel dimension) ----------
  - entity: Pledge
    field: billing_status
    initial_state: CURRENT
    terminal_states: [LAPSED]
    transitions:
      - from: CURRENT
        to: PAST_DUE
        trigger: "system (a CYCLE_RENEWAL or PER_CREATION charge settles FAILED)"
        actor: system
        preconditions:
          - "an associated Charge transitioned to FAILED"
        side_effects:
          - "billing_status → PAST_DUE; one retry scheduled"
      - from: PAST_DUE
        to: GRACE
        trigger: "system (retry charge also FAILED)"
        actor: system
        preconditions:
          - "retry Charge FAILED"
        side_effects:
          - "billing_status → GRACE; grace_deadline = current_clock + GRACE_PERIOD_DAYS"
      - from: GRACE
        to: CURRENT
        trigger: "POST /charges/{chargeId}/settle (a GRACE-period charge settles SUCCEEDED)"
        actor: PlatformAdmin
        preconditions:
          - "Charge.status transitions to SUCCEEDED before grace_deadline (else stays GRACE)"
        side_effects:
          - "billing_status → CURRENT; grace_deadline cleared (compensating: restores good standing)"
      - from: GRACE
        to: LAPSED
        trigger: "POST /_billing/run-cycle (sweep finds grace_deadline < current_clock)"
        actor: PlatformAdmin
        preconditions:
          - "current_clock >= grace_deadline"
        side_effects:
          - "billing_status → LAPSED; lifecycle_status → CANCELLED; Tier.active_pledge_count decremented; lapsed_at set; a WinBackOffer auto-created (calc win_back_offer_expiry)"

  # ---------- Charge: branching fork-join ----------
  - entity: Charge
    field: status
    initial_state: PENDING
    terminal_states: [SUCCEEDED, FAILED, REFUNDED]
    transitions:
      - from: PENDING
        to: SUCCEEDED
        trigger: "POST /charges/{chargeId}/settle with outcome=SUCCEEDED"
        actor: PlatformAdmin
        preconditions:
          - "Charge.status == PENDING (else ERR_CHARGE_NOT_PENDING)"
        side_effects:
          - "processing_fee_cents computed (calc processing_fee); Pledge.current_cycle_charged_cents += gross_amount_cents"
          - "Creator.pending_payout_cents += net_amount_cents (calc creator_pending_payout)"
          - "if this is the pledge's first charge → Pledge.lifecycle_status DRAFT→ACTIVE (cross-entity bubble)"
      - from: PENDING
        to: FAILED
        trigger: "POST /charges/{chargeId}/settle with outcome=FAILED"
        actor: PlatformAdmin
        preconditions:
          - "Charge.status == PENDING (else ERR_CHARGE_NOT_PENDING)"
        side_effects:
          - "wallet_applied_cents refunded back to Patron.wallet_credit_cents (compensating: wallet conserved)"
          - "drives Pledge.billing_status CURRENT→PAST_DUE→GRACE per retry"
      - from: SUCCEEDED
        to: REFUNDED
        trigger: "POST /charges/{chargeId}/refund"
        actor: Creator
        preconditions:
          - "Charge.status == SUCCEEDED (else ERR_CHARGE_NOT_REFUNDABLE)"
          - "Charge.swept_into_payout_id == null (a swept charge cannot be refunded; else ERR_CHARGE_ALREADY_SWEPT)"
        side_effects:
          - "net_amount_cents returned to Patron.wallet_credit_cents; Creator.pending_payout_cents -= net_amount_cents (compensating: pending_payout conserved)"
          - "Pledge.current_cycle_charged_cents -= gross_amount_cents"

  # ---------- Conversation ----------
  - entity: Conversation
    field: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /conversations/{conversationId}/close OR system (patron's last ACTIVE/PAUSED pledge to creator cancelled)"
        actor: Creator
        preconditions:
          - "Conversation.status == OPEN (else ERR_CONVERSATION_CLOSED)"
        side_effects:
          - "no further Messages may be posted"

  # ---------- Payout ----------
  - entity: Payout
    field: status
    initial_state: PENDING
    terminal_states: [PAID, REVERSED]
    transitions:
      - from: PENDING
        to: PAID
        trigger: "POST /payouts/{payoutId}/mark-paid"
        actor: PlatformAdmin
        preconditions:
          - "Payout.status == PENDING (else ERR_PAYOUT_NOT_PENDING)"
        side_effects:
          - "payout settled to creator account"
      - from: PENDING
        to: REVERSED
        trigger: "POST /payouts/{payoutId}/reverse"
        actor: PlatformAdmin
        preconditions:
          - "Payout.status == PENDING (else ERR_PAYOUT_NOT_REVERSIBLE)"
        side_effects:
          - "each swept Charge.swept_into_payout_id cleared; Creator.pending_payout_cents += sum(net_amount_cents) of those charges (compensating: pending_payout conserved across sweep/reverse)"

  # ---------- WinBackOffer ----------
  - entity: WinBackOffer
    field: status
    initial_state: OFFERED
    terminal_states: [REDEEMED, EXPIRED]
    transitions:
      - from: OFFERED
        to: REDEEMED
        trigger: "system (POST /pledges/{pledgeId}/reactivate redeems the offer)"
        actor: system
        preconditions:
          - "WinBackOffer.status == OFFERED AND current_clock <= expires_at (else ERR_OFFER_NOT_REDEEMABLE)"
        side_effects:
          - "discount applied to reactivation WIN_BACK charge"
      - from: OFFERED
        to: EXPIRED
        trigger: "POST /_billing/run-cycle (sweep finds current_clock > expires_at)"
        actor: PlatformAdmin
        preconditions:
          - "current_clock > expires_at"
        side_effects:
          - "offer no longer redeemable"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version — true races only)
# =============================================================================
concurrency_rules:
  - rule_id: pledge-upgrade-stale-pledge
    parent_entity: Pledge
    write_endpoint: "POST /pledges/{pledgeId}/upgrade"
    occ_field: "expected_pledge_version"
    description: |
      Changing a Pledge's tier (upgrade) against a Pledge whose version has
      advanced since the client last observed it is rejected on stale version.
      A new tier change legitimately supersedes the prior view of the pledge
      (tier, cycle anchor, and proration baseline all move), so a writer
      carrying an outdated version is operating on a superseded snapshot.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: pause-stale-pledge
    parent_entity: Pledge
    write_endpoint: "POST /pledges/{pledgeId}/pause"
    occ_field: "expected_pledge_version"
    description: |
      Pausing a Pledge whose version has advanced since the client last read it
      is rejected. A pause legitimately supersedes the prior pledge view
      (renewal scheduling changes), so a stale-version pauser is rejected.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  # ---- DUAL-VARIANT #1 (Pledge domain): proration with charge-up-front vs end-of-month ----
  - name: initial_proration
    trigger: "POST /pledges (MONTHLY tier) — also recomputed on POST /pledges/{id}/upgrade for the delta"
    algorithm: forward_looking
    formula: |
      days_in_month = number of days in the cycle's calendar month (UTC)
      day_of_month  = UTC day-of-month of cycle_anchor_date (1..days_in_month)
      remaining_days = days_in_month - (day_of_month - 1)
      base = monthly_fee_cents (new pledge) OR (new_tier.monthly_fee_cents - old_tier.monthly_fee_cents) (upgrade)
      prorated_cents = round_half_up(base * remaining_days / days_in_month)
    input_set: "the cycle the pledge/upgrade lands in, derived from cycle_anchor_date and the logical clock"
    constants: {}
    precision: "integer cents, round_half_up (0.5 rounds up)"
    variants:
      - name: charge_up_front
        when: "Creator.charge_timing == UP_FRONT"
        difference: "a Charge of charge_kind INITIAL_PRORATION (or UPGRADE_PRORATION) with gross_amount_cents=prorated_cents is created PENDING immediately at pledge/upgrade time"
      - name: end_of_month
        when: "Creator.charge_timing == END_OF_MONTH"
        difference: "no immediate charge; prorated_cents is deferred and rolled into the next POST /_billing/run-cycle sweep for this pledge's cycle anchor"

  # ---- DUAL-VARIANT #2 (Creator domain): payout net with platform fee tiers ----
  - name: payout_settlement
    trigger: "POST /payouts (sweep) — settles a creator's SUCCEEDED, unswept charges for one cycle anchor"
    algorithm: aggregation
    formula: |
      swept = [ Charge c : c.creator_id == creator.id
                           AND c.status == SUCCEEDED
                           AND c.swept_into_payout_id == null
                           AND c.cycle_anchor_date == payout.cycle_anchor_date ]
      ordered by Charge.created_at ASC, then Charge.id is NEVER used  # deterministic order; id forbidden
      gross_cents = sum(c.net_amount_cents for c in swept)
      processing_fee_cents = sum(c.processing_fee_cents for c in swept)   # per-line fees already rounded, then summed
      platform_fee_cents = round_half_up(gross_cents * FEE_RATE[creator.platform_plan])
      payout_amount_cents = gross_cents - platform_fee_cents - processing_fee_cents
    input_set: "SUCCEEDED unswept Charges of the creator for the given cycle_anchor_date"
    constants:
      FEE_RATE: { STARTER: 0.10, PRO: 0.08, PREMIUM: 0.05 }
    precision: "integer cents, round_half_up; platform fee rounded once over the gross"
    variants:
      - name: empty_sweep
        when: "no SUCCEEDED unswept charges match"
        difference: "payout creation is rejected with ERR_NOTHING_TO_PAYOUT; no Payout row created"

  # ---- COMBINATORIAL mode (b): processing fee, per-line then sum (rounding order pinned) ----
  - name: processing_fee
    trigger: "Charge PENDING→SUCCEEDED settle"
    algorithm: threshold
    formula: |
      if net_amount_cents == 0:
        processing_fee_cents = 0
      else:
        processing_fee_cents = round_half_up(net_amount_cents * PCT_RATE) + FLAT_CENTS
      # Order is pinned PER-LINE: each charge's fee is rounded individually at settle
      # time. Payout sums these already-rounded per-line fees — it MUST NOT re-derive
      # a fee from the summed gross (sum-then-round would diverge by cents).
    input_set: "the single Charge being settled"
    constants:
      PCT_RATE: 0.029
      FLAT_CENTS: 30
    precision: "integer cents, round_half_up; rounding applied per-line BEFORE summation in payout_settlement"

  # ---- COMBINATORIAL mode (a): per-creation cap, ≥3 inputs nested min/max ----
  - name: per_creation_charge
    trigger: "POST /posts/{postId}/publish for a PER_CREATION tier pledge (one per eligible pledge)"
    algorithm: threshold
    formula: |
      remaining_cap = max(0, tier.per_creation_monthly_cap_cents - pledge.current_cycle_charged_cents)
      charge_amount = min(tier.per_creation_fee_cents, remaining_cap)
      # If charge_amount == 0 the cap is exhausted: NO Charge row is created for this pledge this cycle.
    input_set: "each Pledge with lifecycle_status=ACTIVE, billing_model=PER_CREATION, on a tier whose rank <= post.min_tier_rank-eligibility, for this creator's published paid post"
    constants: {}
    precision: "integer cents (no fractional cents possible)"

  # ---- COMBINATORIAL mode (c): win-back first charge, evaluation order pinned ----
  - name: win_back_first_charge
    trigger: "POST /pledges/{pledgeId}/reactivate"
    algorithm: forward_looking
    formula: |
      # Evaluation order is pinned: proration FIRST, then discount on the prorated base.
      step1_prorated = initial_proration(base = tier.monthly_fee_cents)   # round_half_up
      if redeemable WinBackOffer exists:
        step2_discount_pct = offer.discount_pct
      else:
        step2_discount_pct = 0
      gross_amount_cents = round_half_up(step1_prorated * (1 - step2_discount_pct))
      # Doing discount-then-prorate (other order) yields a different cents value; this order is canonical.
    input_set: "the reactivating pledge's tier and the redeemable offer (if any)"
    constants: {}
    precision: "integer cents, round_half_up; prorate THEN discount"

  - name: win_back_offer_expiry
    trigger: "Pledge billing_status GRACE→LAPSED (auto-offer) OR POST /win-back-offers"
    algorithm: aggregation
    formula: |
      expires_at = pledge.lapsed_at + WIN_BACK_WINDOW_DAYS (UTC)
      offer is redeemable iff current_clock <= expires_at AND status == OFFERED
    input_set: "the lapsed pledge"
    constants:
      WIN_BACK_WINDOW_DAYS: 60

  - name: grace_deadline
    trigger: "Pledge billing_status PAST_DUE→GRACE (retry charge FAILED)"
    algorithm: threshold
    formula: |
      grace_deadline = current_clock + GRACE_PERIOD_DAYS (UTC)
      A POST /_billing/run-cycle sweep that finds current_clock >= grace_deadline
      lapses the pledge (GRACE→LAPSED with the cancellation cascade).
    input_set: "the pledge entering GRACE"
    constants:
      GRACE_PERIOD_DAYS: 7
    precision: "ISO 8601 UTC instant"

  - name: creator_pending_payout
    trigger: "Charge settle SUCCEEDED, Charge refund, Payout reverse"
    algorithm: aggregation
    formula: |
      Creator.pending_payout_cents =
        sum(c.net_amount_cents for c in Charges
            where c.creator_id == creator.id
              AND c.status == SUCCEEDED
              AND c.swept_into_payout_id == null)
      # Maintained incrementally: +net on settle, -net on refund, +net on payout reverse.
    input_set: "SUCCEEDED unswept Charges of the creator"
    constants: {}
    precision: "integer cents"

  - name: active_pledge_count
    trigger: "Pledge DRAFT→ACTIVE, ACTIVE/PAUSED→CANCELLED, reactivate, GRACE→LAPSED"
    algorithm: aggregation
    formula: |
      Tier.active_pledge_count =
        count(Pledge p where p.tier_id == tier.id AND p.lifecycle_status IN {ACTIVE, PAUSED})
    input_set: "Pledges on the tier with lifecycle_status IN {ACTIVE, PAUSED}"
    constants: {}
    precision: "integer count"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_AUTH_CONTEXT
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is permitted for this operation per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "For entity-backed roles acting on owned resources, X-User-ID equals the resource's owner FK (Creator/Patron ownership)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "owner-scoped mutations on Tier, Post, Pledge, Charge refund, Conversation, Message"

  - priority: 4
    category: existence
    check: "Path resource ids exist (validated left-to-right)"
    error_id: "ERR_CREATOR_NOT_FOUND / ERR_TIER_NOT_FOUND / ERR_PATRON_NOT_FOUND / ERR_PLEDGE_NOT_FOUND / ERR_CHARGE_NOT_FOUND / ERR_POST_NOT_FOUND / ERR_CONVERSATION_NOT_FOUND / ERR_PAYOUT_NOT_FOUND / ERR_OFFER_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints with path ids

  - priority: 5
    category: existence
    check: "Referenced FK bodies exist (tier_id, creator_id, patron_id, pledge_id, post_id, conversation_id)"
    error_id: "ERR_TIER_NOT_FOUND / ERR_CREATOR_NOT_FOUND / ERR_PATRON_NOT_FOUND / ERR_PLEDGE_NOT_FOUND"
    http_status: 404
    applies_to: "POST /pledges, POST /charges, POST /conversations, POST /messages"

  - priority: 6
    category: business_constraint
    check: "Request body well-formed: required fields present, enum members valid, integers in range (e.g., discount_pct in (0,1), min_tier_rank >= 0)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all write endpoints

  - priority: 7
    category: state
    check: "Target resource is in a state that permits this transition (Tier PUBLISHED to retire, Pledge ACTIVE to pause, Charge PENDING to settle, etc.)"
    error_id: "ERR_TIER_NOT_PUBLISHED / ERR_PLEDGE_NOT_ACTIVE / ERR_PLEDGE_NOT_PAUSED / ERR_PLEDGE_NOT_CANCELLABLE / ERR_PLEDGE_NOT_REACTIVATABLE / ERR_CHARGE_NOT_PENDING / ERR_CHARGE_NOT_REFUNDABLE / ERR_CONVERSATION_CLOSED / ERR_PAYOUT_NOT_PENDING / ERR_OFFER_NOT_REDEEMABLE"
    http_status: 409
    applies_to: all transition endpoints

  - priority: 8
    category: business_referential
    check: "Cross-entity link integrity: pledge's creator owns the tier; charge's pledge belongs to the actor; message's conversation matches sender side"
    error_id: ERR_CROSS_LINK_MISMATCH
    http_status: 409
    applies_to: "POST /pledges, POST /charges, POST /messages"

  - priority: 8.5
    category: business_temporal
    check: "Membership-interval exclusivity: a patron may hold at most one Pledge to a given creator whose lifecycle_status IN {DRAFT, ACTIVE, PAUSED} (an overlapping/open membership interval). Creating a second one while such an interval is occupied is rejected. A CANCELLED pledge frees the interval (reactivate reuses the same row)."
    error_id: ERR_DUPLICATE_PLEDGE
    http_status: 409
    applies_to: "POST /pledges"

  - priority: 9
    category: business_constraint
    check: "Tier rank uniqueness among non-RETIRED tiers of a creator at publish time"
    error_id: ERR_TIER_RANK_TAKEN
    http_status: 409
    applies_to: "POST /tiers/{tierId}/publish"

  - priority: 10
    category: business_safety
    check: "Patron-only messaging gate: patron may open a conversation / send a message to a creator only if the patron has a Pledge to that creator with lifecycle_status IN {ACTIVE, PAUSED}"
    error_id: ERR_NOT_A_PATRON_OF_CREATOR
    http_status: 403
    applies_to: "POST /conversations, POST /messages (patron sender)"

  - priority: 11
    category: business_safety
    check: "Exclusive-content gate: patron may view a PUBLISHED Post only if an ACTIVE pledge to the post's creator is on a tier whose rank >= post.min_tier_rank (rank 0 posts are public)"
    error_id: ERR_TIER_TOO_LOW
    http_status: 403
    applies_to: "POST /posts/{postId}/access"

  - priority: 12
    category: business_temporal
    check: "Win-back offer redemption window: current_clock <= offer.expires_at and offer.status == OFFERED"
    error_id: ERR_OFFER_EXPIRED
    http_status: 409
    applies_to: "POST /pledges/{pledgeId}/reactivate (when redeeming an offer)"

  - priority: 13
    category: business_constraint
    check: "Per-creation cap not yet exhausted is NOT an error — when remaining_cap=0 the publish simply creates no charge for that pledge (calc per_creation_charge); but a MONTHLY tier cannot be published as a paid creation target"
    error_id: ERR_BILLING_MODEL_MISMATCH
    http_status: 409
    applies_to: "POST /posts/{postId}/publish"

  - priority: 14
    category: business_fiscal
    check: "Payout sweep must find at least one SUCCEEDED unswept charge for the cycle anchor"
    error_id: ERR_NOTHING_TO_PAYOUT
    http_status: 409
    applies_to: "POST /payouts"

  - priority: 15
    category: business_constraint
    check: "OCC: expected_pledge_version must equal Pledge.version on pledge mutations carrying it"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /pledges/{pledgeId}/pause, POST /pledges/{pledgeId}/upgrade"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---------- Creators ----------
  - method: POST
    path: "/creators"
    description: "Register a creator"
    roles: [Creator]
    code: 201
    input: [display_name, email, "platform_plan?", payout_account_ref, "billing_mode?", "charge_timing?"]
    output: Creator
    side_effects: ["status=ACTIVE, pending_payout_cents=0"]

  - method: GET
    path: "/creators"
    description: "List creators"
    roles: [Creator, Patron, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "Creator[]"
    side_effects: []

  - method: GET
    path: "/creators/{creatorId}"
    description: "Get a creator"
    roles: [Creator, Patron, PlatformAdmin]
    code: 200
    input: []
    output: Creator
    side_effects: []

  # ---------- Tiers ----------
  - method: POST
    path: "/tiers"
    description: "Create a tier (DRAFT) for a creator"
    roles: [Creator]
    code: 201
    input: [creator_id, name, billing_model, rank, "monthly_fee_cents?", "per_creation_fee_cents?", "per_creation_monthly_cap_cents?", "benefit_labels?"]
    output: Tier
    side_effects: ["status=DRAFT, active_pledge_count=0"]

  - method: GET
    path: "/tiers"
    description: "List tiers; filter by creator_id"
    roles: [Creator, Patron, PlatformAdmin]
    code: 200
    input: ["creator_id?", "status?", "limit?", "offset?"]
    output: "Tier[]"
    side_effects: []

  - method: GET
    path: "/tiers/{tierId}"
    description: "Get a tier"
    roles: [Creator, Patron, PlatformAdmin]
    code: 200
    input: []
    output: Tier
    side_effects: []

  - method: POST
    path: "/tiers/{tierId}/publish"
    description: "Publish a DRAFT tier"
    roles: [Creator]
    code: 200
    input: []
    output: Tier
    side_effects: ["status DRAFT→PUBLISHED; rank uniqueness enforced"]

  - method: POST
    path: "/tiers/{tierId}/retire"
    description: "Retire a PUBLISHED tier"
    roles: [Creator]
    code: 200
    input: []
    output: Tier
    side_effects: ["status PUBLISHED→RETIRED if no active/paused members"]

  # ---------- Patrons ----------
  - method: POST
    path: "/patrons"
    description: "Register a patron"
    roles: [Patron]
    code: 201
    input: [display_name, email]
    output: Patron
    side_effects: ["status=ACTIVE, wallet_credit_cents=0"]

  - method: GET
    path: "/patrons/{patronId}"
    description: "Get a patron"
    roles: [Creator, Patron, PlatformAdmin]
    code: 200
    input: []
    output: Patron
    side_effects: []

  # ---------- Pledges ----------
  - method: POST
    path: "/pledges"
    description: "Create a pledge (DRAFT). For MONTHLY UP_FRONT creators an INITIAL_PRORATION charge is created PENDING; on settle the pledge activates."
    roles: [Patron]
    code: 201
    input: [patron_id, creator_id, tier_id]
    output: Pledge
    side_effects:
      - "lifecycle_status=DRAFT, billing_status=CURRENT, billing_model copied from tier, cycle_anchor_date set to current clock"
      - "calc initial_proration → INITIAL_PRORATION Charge created PENDING (UP_FRONT) or deferred (END_OF_MONTH)"

  - method: GET
    path: "/pledges"
    description: "List pledges; filter by patron_id, creator_id, tier_id, or scheduled_tier_id"
    roles: [Creator, Patron, PlatformAdmin]
    code: 200
    input: ["patron_id?", "creator_id?", "tier_id?", "scheduled_tier_id?", "lifecycle_status?", "limit?", "offset?"]
    output: "Pledge[]"
    side_effects: []

  - method: GET
    path: "/pledges/{pledgeId}"
    description: "Get a pledge"
    roles: [Creator, Patron, PlatformAdmin]
    code: 200
    input: []
    output: Pledge
    side_effects: []

  - method: POST
    path: "/pledges/{pledgeId}/pause"
    description: "Pause an ACTIVE pledge (OCC-guarded)"
    roles: [Patron]
    code: 200
    input: [expected_pledge_version]
    output: Pledge
    side_effects: ["lifecycle_status ACTIVE→PAUSED; increments Pledge.version by 1; future renewals suspended"]

  - method: POST
    path: "/pledges/{pledgeId}/resume"
    description: "Resume a PAUSED pledge (OCC-guarded)"
    roles: [Patron]
    code: 200
    input: [expected_pledge_version]
    output: Pledge
    side_effects: ["lifecycle_status PAUSED→ACTIVE; increments Pledge.version by 1; re-anchors cycle_anchor_date"]

  - method: POST
    path: "/pledges/{pledgeId}/upgrade"
    description: "Change pledge tier (upgrade/downgrade); MONTHLY UP_FRONT charges proration delta now, END_OF_MONTH schedules for next anchor (OCC-guarded)"
    roles: [Patron]
    code: 200
    input: [new_tier_id, expected_pledge_version]
    output: Pledge
    side_effects:
      - "increments Pledge.version by 1"
      - "calc initial_proration (upgrade delta): UP_FRONT → UPGRADE_PRORATION Charge PENDING; END_OF_MONTH → scheduled_tier_id set, no immediate charge"
      - "Tier.active_pledge_count recomputed for old and new tier (UP_FRONT immediate path)"

  - method: POST
    path: "/pledges/{pledgeId}/cancel"
    description: "Cancel an ACTIVE/PAUSED pledge"
    roles: [Patron]
    code: 200
    input: []
    output: Pledge
    side_effects:
      - "lifecycle_status →CANCELLED; billing_status→LAPSED; lapsed_at set; Tier.active_pledge_count decremented"
      - "cross-entity: orphaned OPEN Conversation with this creator →CLOSED"

  - method: POST
    path: "/pledges/{pledgeId}/reactivate"
    description: "Reactivate a CANCELLED+LAPSED pledge; redeems a WinBackOffer if present (cyclic re-entry)"
    roles: [Patron]
    code: 200
    input: ["expected_pledge_version?"]
    output: Pledge
    side_effects:
      - "lifecycle_status→ACTIVE; billing_status→CURRENT; Tier.active_pledge_count incremented"
      - "calc win_back_first_charge → WIN_BACK Charge PENDING; offer (if any) →REDEEMED; win_back_applied set"

  # ---------- Charges ----------
  - method: POST
    path: "/charges"
    description: "Manually create a charge against a pledge (PER_CREATION enrollment / ad-hoc); normally charges are auto-created by pledge/post/billing flows"
    roles: [PlatformAdmin]
    code: 201
    input: [pledge_id, charge_kind, gross_amount_cents]
    output: Charge
    side_effects: ["status=PENDING; creator_id denormalized from pledge; wallet credit applied to compute net_amount_cents"]

  - method: GET
    path: "/charges"
    description: "List charges; filter by pledge_id, creator_id, status, cycle_anchor_date, or swept_into_payout_id"
    roles: [Creator, Patron, PlatformAdmin]
    code: 200
    input: ["pledge_id?", "creator_id?", "status?", "cycle_anchor_date?", "swept_into_payout_id?", "limit?", "offset?"]
    output: "Charge[]"
    side_effects: []

  - method: GET
    path: "/charges/{chargeId}"
    description: "Get a charge"
    roles: [Creator, Patron, PlatformAdmin]
    code: 200
    input: []
    output: Charge
    side_effects: []

  - method: POST
    path: "/charges/{chargeId}/settle"
    description: "Settle a PENDING charge with an outcome (simulates processor result)"
    roles: [PlatformAdmin]
    code: 200
    input: [outcome]
    output: Charge
    side_effects:
      - "outcome=SUCCEEDED: calc processing_fee; Pledge.current_cycle_charged_cents += gross; Creator.pending_payout_cents += net (calc creator_pending_payout); first charge → Pledge activates; GRACE→CURRENT if applicable"
      - "outcome=FAILED: wallet_applied refunded to Patron.wallet_credit_cents; Pledge.billing_status advances CURRENT→PAST_DUE→GRACE"

  - method: POST
    path: "/charges/{chargeId}/refund"
    description: "Refund a SUCCEEDED, unswept charge"
    roles: [Creator]
    code: 200
    input: []
    output: Charge
    side_effects:
      - "status SUCCEEDED→REFUNDED; net_amount_cents → Patron.wallet_credit_cents; Creator.pending_payout_cents -= net (calc creator_pending_payout); Pledge.current_cycle_charged_cents -= gross"

  # ---------- Posts & access gating ----------
  - method: POST
    path: "/posts"
    description: "Create a DRAFT post"
    roles: [Creator]
    code: 201
    input: [creator_id, title, body, "min_tier_rank?", "is_paid_creation?"]
    output: Post
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/posts"
    description: "List posts; filter by creator_id"
    roles: [Creator, Patron, PlatformAdmin]
    code: 200
    input: ["creator_id?", "status?", "limit?", "offset?"]
    output: "Post[]"
    side_effects: []

  - method: GET
    path: "/posts/{postId}"
    description: "Get a post (metadata only; body requires access)"
    roles: [Creator, Patron, PlatformAdmin]
    code: 200
    input: []
    output: Post
    side_effects: []

  - method: POST
    path: "/posts/{postId}/publish"
    description: "Publish a DRAFT post; PER_CREATION paid posts bill eligible pledges (calc per_creation_charge)"
    roles: [Creator]
    code: 200
    input: []
    output: Post
    side_effects:
      - "status DRAFT→PUBLISHED"
      - "if is_paid_creation and creator billing_mode=PER_CREATION: for each eligible ACTIVE PER_CREATION pledge, calc per_creation_charge → PER_CREATION Charge PENDING (skipped when remaining_cap=0)"

  - method: POST
    path: "/posts/{postId}/access"
    description: "Patron requests access to a post; enforces exclusive-content gate; creates a PostAccess grant"
    roles: [Patron]
    code: 201
    input: [patron_id]
    output: PostAccess
    side_effects: ["PostAccess grant created with granted_tier_rank snapshot when gate passes"]

  - method: GET
    path: "/post-accesses"
    description: "List PostAccess grants; filter by post_id, patron_id, or pledge_id (reverse-reachability for all three PostAccess FKs)"
    roles: [Creator, Patron, PlatformAdmin]
    code: 200
    input: ["post_id?", "patron_id?", "pledge_id?", "limit?", "offset?"]
    output: "PostAccess[]"
    side_effects: []

  - method: GET
    path: "/post-accesses/{accessId}"
    description: "Get a single PostAccess grant"
    roles: [Creator, Patron, PlatformAdmin]
    code: 200
    input: []
    output: PostAccess
    side_effects: []

  # ---------- Patron-only messaging ----------
  - method: POST
    path: "/conversations"
    description: "Open a conversation between a patron and a creator (patron-only gate enforced)"
    roles: [Patron, Creator]
    code: 201
    input: [creator_id, patron_id]
    output: Conversation
    side_effects: ["status=OPEN, message_count=0"]

  - method: GET
    path: "/conversations"
    description: "List conversations; filter by creator_id or patron_id"
    roles: [Creator, Patron, PlatformAdmin]
    code: 200
    input: ["creator_id?", "patron_id?", "status?", "limit?", "offset?"]
    output: "Conversation[]"
    side_effects: []

  - method: GET
    path: "/conversations/{conversationId}"
    description: "Get a conversation"
    roles: [Creator, Patron, PlatformAdmin]
    code: 200
    input: []
    output: Conversation
    side_effects: []

  - method: POST
    path: "/conversations/{conversationId}/close"
    description: "Close an OPEN conversation"
    roles: [Creator, Patron]
    code: 200
    input: []
    output: Conversation
    side_effects: ["status OPEN→CLOSED"]

  - method: POST
    path: "/messages"
    description: "Post a message to an OPEN conversation (patron sender must still be ACTIVE/PAUSED patron of creator)"
    roles: [Patron, Creator]
    code: 201
    input: [conversation_id, body]
    output: Message
    side_effects: ["sender_role/sender_id derived from auth context; Conversation.message_count += 1"]

  - method: GET
    path: "/messages"
    description: "List messages; filter by conversation_id (reverse-reachability for Message.conversation_id)"
    roles: [Creator, Patron, PlatformAdmin]
    code: 200
    input: ["conversation_id?", "limit?", "offset?"]
    output: "Message[]"
    side_effects: []

  - method: GET
    path: "/messages/{messageId}"
    description: "Get a single message"
    roles: [Creator, Patron, PlatformAdmin]
    code: 200
    input: []
    output: Message
    side_effects: []

  # ---------- Payouts ----------
  - method: POST
    path: "/payouts"
    description: "Sweep a creator's SUCCEEDED unswept charges for a cycle anchor into a PENDING payout (calc payout_settlement)"
    roles: [PlatformAdmin]
    code: 201
    input: [creator_id, cycle_anchor_date]
    output: Payout
    side_effects:
      - "calc payout_settlement: gross/platform_fee/processing_fee/payout_amount computed; swept charges get swept_into_payout_id; Creator.pending_payout_cents reduced by swept net total"

  - method: GET
    path: "/payouts"
    description: "List payouts; filter by creator_id"
    roles: [Creator, PlatformAdmin]
    code: 200
    input: ["creator_id?", "status?", "limit?", "offset?"]
    output: "Payout[]"
    side_effects: []

  - method: GET
    path: "/payouts/{payoutId}"
    description: "Get a payout"
    roles: [Creator, PlatformAdmin]
    code: 200
    input: []
    output: Payout
    side_effects: []

  - method: POST
    path: "/payouts/{payoutId}/mark-paid"
    description: "Mark a PENDING payout PAID"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Payout
    side_effects: ["status PENDING→PAID"]

  - method: POST
    path: "/payouts/{payoutId}/reverse"
    description: "Reverse a PENDING payout; un-sweeps charges and restores pending_payout"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Payout
    side_effects: ["status PENDING→REVERSED; swept charges' swept_into_payout_id cleared; Creator.pending_payout_cents += swept net total (calc creator_pending_payout)"]

  # ---------- Win-back offers ----------
  - method: POST
    path: "/win-back-offers"
    description: "Create a win-back offer targeting a lapsed pledge"
    roles: [Creator, PlatformAdmin]
    code: 201
    input: [pledge_id, "discount_pct?"]
    output: WinBackOffer
    side_effects: ["status=OFFERED; calc win_back_offer_expiry → expires_at = lapsed_at + 60d"]

  - method: GET
    path: "/win-back-offers"
    description: "List win-back offers; filter by pledge_id"
    roles: [Creator, Patron, PlatformAdmin]
    code: 200
    input: ["pledge_id?", "status?", "limit?", "offset?"]
    output: "WinBackOffer[]"
    side_effects: []

  - method: GET
    path: "/win-back-offers/{offerId}"
    description: "Get a win-back offer"
    roles: [Creator, Patron, PlatformAdmin]
    code: 200
    input: []
    output: WinBackOffer
    side_effects: []

  # ---------- Test-driving endpoints ----------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is 2026-01-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["logical clock advanced; does not itself trigger sweeps"]

  - method: POST
    path: "/_billing/run-cycle"
    description: "Advance billing: lapse GRACE pledges past grace_deadline, expire win-back offers, and emit CYCLE_RENEWAL charges for ACTIVE MONTHLY pledges whose next anchor <= current clock"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: "{ lapsed_pledge_ids: string[], expired_offer_ids: string[], renewal_charge_ids: string[] }"
    side_effects:
      - "GRACE pledges with grace_deadline < clock → LAPSED (+ cascade per billing axis); OFFERED offers past expires_at → EXPIRED; ACTIVE MONTHLY pledges due → CYCLE_RENEWAL Charge PENDING + cycle_anchor_date advanced + current_cycle_charged_cents reset to 0"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_AUTH_CONTEXT, http: 401, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Entity-backed actor is not the owner of the targeted resource" }
  # --- existence ---
  - { id: ERR_CREATOR_NOT_FOUND, http: 404, condition: "Creator id does not exist" }
  - { id: ERR_TIER_NOT_FOUND, http: 404, condition: "Tier id does not exist" }
  - { id: ERR_PATRON_NOT_FOUND, http: 404, condition: "Patron id does not exist" }
  - { id: ERR_PLEDGE_NOT_FOUND, http: 404, condition: "Pledge id does not exist" }
  - { id: ERR_CHARGE_NOT_FOUND, http: 404, condition: "Charge id does not exist" }
  - { id: ERR_POST_NOT_FOUND, http: 404, condition: "Post id does not exist" }
  - { id: ERR_CONVERSATION_NOT_FOUND, http: 404, condition: "Conversation id does not exist" }
  - { id: ERR_PAYOUT_NOT_FOUND, http: 404, condition: "Payout id does not exist" }
  - { id: ERR_OFFER_NOT_FOUND, http: 404, condition: "WinBackOffer id does not exist" }
  # --- request validation ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, bad enum, out-of-range number" }
  - { id: ERR_TIER_FIELDS_INCOMPLETE, http: 400, condition: "Tier publish missing fee fields required for its billing_model" }
  # --- state ---
  - { id: ERR_TIER_NOT_PUBLISHED, http: 409, condition: "Tier is not PUBLISHED (cannot pledge / already published / retired)" }
  - { id: ERR_TIER_HAS_MEMBERS, http: 409, condition: "Cannot retire a tier with ACTIVE/PAUSED pledges" }
  - { id: ERR_PLEDGE_NOT_ACTIVE, http: 409, condition: "Operation requires lifecycle_status=ACTIVE" }
  - { id: ERR_PLEDGE_NOT_PAUSED, http: 409, condition: "Resume requires lifecycle_status=PAUSED" }
  - { id: ERR_PLEDGE_NOT_CANCELLABLE, http: 409, condition: "Cancel requires lifecycle_status IN {ACTIVE, PAUSED}" }
  - { id: ERR_PLEDGE_NOT_REACTIVATABLE, http: 409, condition: "Reactivate requires lifecycle_status=CANCELLED and billing_status=LAPSED" }
  - { id: ERR_CHARGE_NOT_PENDING, http: 409, condition: "Settle requires Charge.status=PENDING" }
  - { id: ERR_CHARGE_NOT_REFUNDABLE, http: 409, condition: "Refund requires Charge.status=SUCCEEDED" }
  - { id: ERR_CHARGE_ALREADY_SWEPT, http: 409, condition: "Refund rejected because charge is already swept into a payout" }
  - { id: ERR_CONVERSATION_CLOSED, http: 409, condition: "Conversation is CLOSED; cannot post / close again" }
  - { id: ERR_PAYOUT_NOT_PENDING, http: 409, condition: "mark-paid requires Payout.status=PENDING" }
  - { id: ERR_PAYOUT_NOT_REVERSIBLE, http: 409, condition: "reverse requires Payout.status=PENDING" }
  - { id: ERR_OFFER_NOT_REDEEMABLE, http: 409, condition: "Offer not in OFFERED status" }
  # --- business ---
  - { id: ERR_CROSS_LINK_MISMATCH, http: 409, condition: "FK link integrity violated (tier not owned by creator, charge's pledge mismatch, message conversation mismatch)" }
  - { id: ERR_TIER_RANK_TAKEN, http: 409, condition: "Another non-RETIRED tier of the creator already holds this rank" }
  - { id: ERR_DUPLICATE_PLEDGE, http: 409, condition: "Patron already has a DRAFT/ACTIVE/PAUSED pledge to this creator (membership interval already occupied)" }
  - { id: ERR_NOT_A_PATRON_OF_CREATOR, http: 403, condition: "Patron lacks an ACTIVE/PAUSED pledge to the creator for messaging" }
  - { id: ERR_TIER_TOO_LOW, http: 403, condition: "Patron's active tier rank below post.min_tier_rank" }
  - { id: ERR_OFFER_EXPIRED, http: 409, condition: "Win-back offer redemption past expires_at" }
  - { id: ERR_BILLING_MODEL_MISMATCH, http: 409, condition: "Paid-creation publish on a creator/tier whose billing model is not PER_CREATION" }
  - { id: ERR_NOTHING_TO_PAYOUT, http: 409, condition: "No SUCCEEDED unswept charge for the creator/cycle anchor" }
  # --- concurrency ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_pledge_version does not match current Pledge.version" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Creator
    description: "Owns tiers, posts, refunds on own charges, and creator side of conversations"
    identity: "entity_backed:Creator"
    exclusive_operations:
      - "POST /creators — register creator"
      - "POST /tiers — create tier"
      - "POST /tiers/{tierId}/publish — publish tier"
      - "POST /tiers/{tierId}/retire — retire tier"
      - "POST /posts — create post"
      - "POST /posts/{postId}/publish — publish post"
      - "POST /charges/{chargeId}/refund — refund own charge"
    shared_operations:
      - "POST /conversations — open conversation (creator side)"
      - "POST /conversations/{conversationId}/close — close conversation"
      - "POST /messages — send message (creator side)"
      - "POST /win-back-offers — create win-back offer"
      - "GET endpoints (creators, tiers, patrons, pledges, charges, posts, conversations, messages, payouts, win-back-offers, access-grants)"

  - name: Patron
    description: "Owns pledges, post-access requests, and patron side of conversations"
    identity: "entity_backed:Patron"
    exclusive_operations:
      - "POST /patrons — register patron"
      - "POST /pledges — create pledge"
      - "POST /pledges/{pledgeId}/pause — pause own pledge"
      - "POST /pledges/{pledgeId}/resume — resume own pledge"
      - "POST /pledges/{pledgeId}/upgrade — change own pledge tier"
      - "POST /pledges/{pledgeId}/cancel — cancel own pledge"
      - "POST /pledges/{pledgeId}/reactivate — reactivate own pledge"
      - "POST /posts/{postId}/access — request post access"
    shared_operations:
      - "POST /conversations — open conversation (patron side)"
      - "POST /conversations/{conversationId}/close — close conversation"
      - "POST /messages — send message (patron side)"
      - "GET endpoints (creators, tiers, patrons, pledges, charges, posts, conversations, messages, win-back-offers, access-grants)"

  - name: PlatformAdmin
    description: "Operational role: runs billing, settles charges, sweeps payouts, controls the logical clock; not tied to any persisted entity"
    identity: "opaque"
    exclusive_operations:
      - "POST /charges — create ad-hoc charge"
      - "POST /charges/{chargeId}/settle — settle charge"
      - "POST /payouts — sweep payout"
      - "POST /payouts/{payoutId}/mark-paid — mark payout paid"
      - "POST /payouts/{payoutId}/reverse — reverse payout"
      - "POST /_clock/set_current_utc — set logical clock"
      - "POST /_billing/run-cycle — run billing cycle"
    shared_operations:
      - "POST /win-back-offers — create win-back offer"
      - "GET endpoints (all read endpoints across the platform)"

