# =============================================================================
# SCAFFOLD.yaml — Propane Wholesale & Terminal Supply
# §1.0–§1.7 seed tables (difficulty/corner designs live in sibling files)
# =============================================================================

scenario: |
  Propane Wholesale & Terminal Supply (propane wholesaler): supply contract & rail/terminal allocation, seasonal storage build & winter draw, transport truck scheduling & driver hours, pricing index & fixed-price contract for dealers, inventory ownership at terminal, allocation during cold-snap shortage, freight & delivered-price zones, credit exposure with dealers

domain_name: propane-wholesale-terminal
api_prefix: ""

# =============================================================================
# Complexity Profile (§0.3)
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation        # finite terminal pool competed for via cold-snap allocation runs
  secondary_archetype: pricing_engine        # index vs fixed pricing, delivered-price zones, tiered overage
  complexity_layers:
    - optimistic_concurrency                 # OCC on Terminal.version and Dealer.version for supersede writes
    - cascading_side_effects                 # cold-snap -> terminal -> orders -> dealer credit chains
    - dual_variant_calculation               # provisional vs final pricing; ledger vs committed exposure
    - ops_run_checkpoint                     # POST /ops/run_epoch advances cold snaps, expiries, defaults
  entity_topology: flat                      # peer entities with FK references; no URL nesting
  state_machine_shape: parallel              # DeliveryOrder fulfillment_status x invoice_status evolve independently
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: peer_roles                     # SupplyAdmin / SupplyPlanner / PricingDesk / CreditManager / Dispatcher / DealerUser
  consistency_model: immediate               # all mutations + cascades atomic within the request

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (flat topology, FK links)
# =============================================================================
entities:
  - name: Terminal
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Terminal name" }
      - { name: region_code, type: string, source: input, description: "Region code, e.g. NE" }
      - { name: storage_capacity_gal, type: integer, source: input, description: "Physical storage capacity in gallons; > 0" }
      - { name: reserve_floor_gal, type: integer, source: input, description: "Non-winter reserve floor in gallons; >= 0" }
      - { name: winter_reserve_floor_gal, type: integer, source: input, description: "Winter-draw-season reserve floor in gallons; >= reserve_floor_gal" }
      - { name: rack_bay_count, type: integer, source: input, description: "Number of truck loading bays; >= 1" }
      - { name: on_hand_gal, type: integer, source: system, description: "Wholesaler-owned gallons in storage; mutated only by rail unload (+) and order load (-); starts 0" }
      - { name: allocation_posture, type: enum, source: system, description: "NORMAL | CURTAILED; CURTAILED while any ColdSnapEvent on this terminal is ACTIVE", default: NORMAL }
      - { name: ops_epoch, type: integer, source: system, description: "Monotonic epoch counter, +1 per POST /ops/run_epoch touching this terminal", default: 0 }
      - { name: season_posture, type: enum, source: computed, description: "SUMMER_BUILD | WINTER_DRAW; derived from logical clock: months Oct-Mar => WINTER_DRAW else SUMMER_BUILD" }
      - { name: reserved_gal, type: integer, source: computed, description: "Sum of allocated_gal over this terminal's DeliveryOrders with fulfillment_status IN {ALLOCATED, SCHEDULED}; computed on read, does NOT bump version" }
      - { name: effective_reserve_floor_gal, type: integer, source: computed, description: "winter_reserve_floor_gal when season_posture==WINTER_DRAW else reserve_floor_gal" }
      - { name: available_to_promise_gal, type: integer, source: computed, description: "on_hand_gal - effective_reserve_floor_gal - reserved_gal; reported exactly as computed and MAY be negative before first inventory; allocation gates compare against it with <=" }
    note: "version increments on direct writes and on cascades that change Terminal's own stored fields (on_hand_gal, allocation_posture, ops_epoch). Pure computed aggregates (reserved_gal, ATP) never bump version."

  - name: SupplyContract
    parent: null
    common_fields: true
    fields:
      - { name: terminal_id, type: string, source: input, description: "FK -> Terminal.id; receiving terminal" }
      - { name: supplier_name, type: string, source: input, description: "Upstream supplier name" }
      - { name: contracted_volume_gal, type: integer, source: input, description: "Total contracted receipt gallons; > 0" }
      - { name: delivered_volume_gal, type: integer, source: system, description: "Gallons unloaded under this contract; starts 0", default: 0 }
      - { name: receipt_window_start, type: string, source: input, description: "ISO date; first allowed scheduled_arrival_date" }
      - { name: receipt_window_end, type: string, source: input, description: "ISO date; last allowed scheduled_arrival_date; >= start" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | COMPLETED | DEFAULTED | CANCELLED", default: DRAFT }

  - name: RailShipment
    parent: null
    common_fields: true
    fields:
      - { name: supply_contract_id, type: string, source: input, description: "FK -> SupplyContract.id; contract receiving this rail movement" }
      - { name: terminal_id, type: string, source: system, description: "FK -> Terminal.id; copied from the supply contract at creation" }
      - { name: volume_gal, type: integer, source: input, description: "Manifest gallons; > 0" }
      - { name: railcar_count, type: integer, source: input, description: "Number of railcars; > 0" }
      - { name: scheduled_arrival_date, type: string, source: input, description: "ISO date; must fall inside the contract receipt window at creation" }
      - { name: unloaded_at, type: datetime, source: system, description: "Timestamp of unload; null until UNLOADED" }
      - { name: status, type: enum, source: system, description: "TENDERED | IN_TRANSIT | ARRIVED | UNLOADED | CANCELLED", default: TENDERED }

  - name: Dealer
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Dealer legal name" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Credit limit in cents; > 0" }
      - { name: fee_balance_cents, type: integer, source: system, description: "Uncollected fees (e.g. NSF); starts 0; stored, bumps version on change", default: 0 }
      - { name: ledger_exposure_cents, type: integer, source: computed, description: "Sum of open_balance_cents over orders with invoice_status == OPEN; computed on read, never bumps version" }
      - { name: committed_exposure_cents, type: integer, source: computed, description: "fee_balance_cents + ledger_exposure_cents + sum(final_total_cents over LOADED orders) + sum(provisional_total_cents over ALLOCATED/SCHEDULED orders); computed on read" }
      - { name: credit_status, type: enum, source: computed, description: "GOOD_STANDING | WATCH | SUSPENDED per credit_status_threshold calculation" }
    note: "version increments on direct writes (PATCH credit_limit_cents), on payment-return fee posting (fee_balance_cents), and on contract activation supersede bookkeeping. Computed exposure/status fields never bump version."

  - name: DealerContract
    parent: null
    common_fields: true
    fields:
      - { name: dealer_id, type: string, source: input, description: "FK -> Dealer.id; contract counterparty" }
      - { name: terminal_id, type: string, source: input, description: "FK -> Terminal.id; supply point" }
      - { name: pricing_mode, type: enum, source: input, description: "INDEX | FIXED" }
      - { name: fixed_price_mc_per_gal, type: integer, source: input, description: "Fixed product price in millicents/gal (1/1000 cent); required iff pricing_mode == FIXED; > 0" }
      - { name: volume_committed_gal, type: integer, source: input, description: "Committed band volume in gallons; > 0" }
      - { name: volume_drawn_gal, type: integer, source: system, description: "Gallons drawn against the committed band (in-band gallons only, overage excluded); starts 0", default: 0 }
      - { name: window_start, type: string, source: input, description: "ISO date; contract validity start" }
      - { name: window_end, type: string, source: input, description: "ISO date; contract validity end; >= start" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | SUPERSEDED | EXPIRED | CANCELLED", default: DRAFT }

  - name: PriceIndexPublication
    parent: null
    common_fields: false
    fields:
      - { name: index_name, type: enum, source: input, description: "MT_BELVIEU | CONWAY" }
      - { name: effective_date, type: string, source: input, description: "ISO date the price is effective for; unique per index_name" }
      - { name: price_mc_per_gal, type: integer, source: input, description: "Published index price in millicents/gal; > 0" }
    note: "Append-only configuration: no update/delete endpoints, no version/updated_at. Duplicate (index_name, effective_date) rejected."

  - name: FreightZone
    parent: null
    common_fields: true
    fields:
      - { name: terminal_id, type: string, source: input, description: "FK -> Terminal.id; origin terminal" }
      - { name: zone_code, type: string, source: input, description: "Zone code; unique per terminal" }
      - { name: one_way_drive_minutes, type: integer, source: input, description: "Typical one-way drive minutes; > 0" }
      - { name: freight_mc_per_gal, type: integer, source: input, description: "Freight rate millicents/gal; >= 0" }
      - { name: min_freight_cents, type: integer, source: input, description: "Minimum freight charge per load in cents; >= 0" }

  - name: TransportTruck
    parent: null
    common_fields: true
    fields:
      - { name: terminal_id, type: string, source: input, description: "FK -> Terminal.id; home terminal" }
      - { name: unit_number, type: string, source: input, description: "Fleet unit number; unique per terminal" }
      - { name: capacity_gal, type: integer, source: input, description: "Tank capacity gallons; > 0" }
      - { name: weekly_hours_limit_minutes, type: integer, source: input, description: "Driver hours-of-service limit per ISO week; > 0" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | OUT_OF_SERVICE", default: AVAILABLE }
      - { name: weekly_committed_minutes, type: integer, source: computed, description: "Sum of est_trip_minutes over this truck's orders with fulfillment_status IN {SCHEDULED, LOADED, DELIVERED} and planned_load_start inside the ISO week (Mon 00:00 UTC) containing the logical clock's current instant; computed on read" }

  - name: DeliveryOrder
    parent: null
    common_fields: true
    fields:
      - { name: dealer_id, type: string, source: system, description: "FK -> Dealer.id; copied from X-User-ID of the DealerUser caller" }
      - { name: dealer_contract_id, type: string, source: input, description: "FK -> DealerContract.id; null/absent => SPOT order priced at index + SPOT_PREMIUM" }
      - { name: terminal_id, type: string, source: input, description: "FK -> Terminal.id; supply terminal" }
      - { name: freight_zone_id, type: string, source: input, description: "FK -> FreightZone.id; destination zone (must belong to terminal_id)" }
      - { name: truck_id, type: string, source: system, description: "FK -> TransportTruck.id; null until scheduled; cleared on unschedule" }
      - { name: requested_gal, type: integer, source: input, description: "Requested gallons; integer >= 1000" }
      - { name: allocated_gal, type: integer, source: system, description: "Allocated gallons; null while REQUESTED; equals requested_gal on direct allocation; possibly less after a ratified allocation run; 0 on SHORTED" }
      - { name: pricing_mode, type: enum, source: system, description: "FIXED | INDEX | SPOT; snapshot at creation (SPOT iff no contract)" }
      - { name: provisional_total_cents, type: integer, source: computed, description: "Provisional delivered total via delivered_price(variant=provisional); computed at creation, re-stamped on every entry into ALLOCATED and on terminal allocation_posture flips while ALLOCATED/SCHEDULED; null while REQUESTED" }
      - { name: final_total_cents, type: integer, source: computed, description: "Final delivered total via delivered_price(variant=final); computed exactly once at LOADED using the index effective on date(planned_load_start); null until then" }
      - { name: open_balance_cents, type: integer, source: computed, description: "Invoice balance; set to final_total_cents at DELIVERED, reduced by FIFO payment applications, restored by payment returns; null until DELIVERED" }
      - { name: fulfillment_status, type: enum, source: system, description: "REQUESTED | ALLOCATED | SHORTED | SCHEDULED | LOADED | DELIVERED | CANCELLED", default: REQUESTED }
      - { name: invoice_status, type: enum, source: system, description: "NOT_READY | OPEN | PAID | VOID; parallel dimension, evolves independently of fulfillment_status", default: NOT_READY }
      - { name: planned_load_start, type: datetime, source: input, description: "Planned rack window start (set at schedule); null until scheduled" }
      - { name: planned_load_end, type: datetime, source: input, description: "Planned rack window end; must be > planned_load_start" }
      - { name: est_trip_minutes, type: integer, source: computed, description: "LOAD_SERVICE_MINUTES + 2 * zone.one_way_drive_minutes; set at schedule, cleared at unschedule" }
      - { name: invoiced_at, type: datetime, source: system, description: "Timestamp invoice opened (DELIVERED); null until then" }

  - name: ColdSnapEvent
    parent: null
    common_fields: true
    fields:
      - { name: terminal_id, type: string, source: input, description: "FK -> Terminal.id; affected terminal" }
      - { name: severity, type: enum, source: input, description: "WATCH | WARNING | EMERGENCY" }
      - { name: start_date, type: string, source: input, description: "ISO date the event takes effect" }
      - { name: end_date, type: string, source: input, description: "ISO date the event ends; >= start_date" }
      - { name: status, type: enum, source: system, description: "DECLARED | ACTIVE | LIFTED", default: DECLARED }

  - name: AllocationRun
    parent: null
    common_fields: true
    fields:
      - { name: terminal_id, type: string, source: input, description: "FK -> Terminal.id; curtailed terminal being allocated" }
      - { name: run_index, type: integer, source: system, description: "Per-terminal monotonic run counter starting at 1" }
      - { name: status, type: enum, source: system, description: "OPEN | COMPUTED | RATIFIED | SUPERSEDED", default: OPEN }
      - { name: pool_gal, type: integer, source: system, description: "Snapshot of terminal available_to_promise_gal taken at compute time; null until COMPUTED" }
      - { name: results, type: array, source: system, description: "Array of {order_id, allocated_gal, outcome: ALLOCATED|SHORTED}; populated at compute; empty until then" }

  - name: DealerPayment
    parent: null
    common_fields: true
    fields:
      - { name: dealer_id, type: string, source: input, description: "FK -> Dealer.id; paying dealer" }
      - { name: amount_cents, type: integer, source: input, description: "Payment amount in cents; > 0; must not exceed the dealer's total open invoice balance" }
      - { name: method, type: enum, source: input, description: "ACH | CHECK | WIRE" }
      - { name: status, type: enum, source: system, description: "POSTED | RETURNED", default: POSTED }
      - { name: applications, type: array, source: system, description: "FIFO application detail: array of {order_id, amount_cents} in application order; empty until computed at posting" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Terminal
    field: allocation_posture
    initial_state: NORMAL
    terminal_states: []
    note: "season_posture is a pure derived field from the logical clock (Oct-Mar => WINTER_DRAW), not a state machine. allocation_posture is mutated only by cold-snap transitions."
    transitions:
      - from: NORMAL
        to: CURTAILED
        trigger: "system (ColdSnapEvent on this terminal enters ACTIVE, via /activate or /ops/run_epoch)"
        actor: system
        preconditions: []
        side_effects:
          - "Recompute provisional_total_cents for every DeliveryOrder of this terminal in ALLOCATED or SCHEDULED (delivered_price provisional variant now includes WINTER_SURCHARGE)"
          - "Each such dealer's committed_exposure_cents is recomputed from the new provisionals; credit_status may flip GOOD_STANDING -> WATCH or -> SUSPENDED"
          - "New POST /delivery-orders at this terminal land in REQUESTED (no direct allocation, no ATP check at creation)"
      - from: CURTAILED
        to: NORMAL
        trigger: "system (ColdSnapEvent ACTIVE -> LIFTED, via /lift or /ops/run_epoch when end_date < today)"
        actor: system
        preconditions: []
        side_effects:
          - "Recompute provisional_total_cents for ALLOCATED/SCHEDULED orders (winter surcharge removed)"
          - "All this terminal's SHORTED orders -> REQUESTED (original created_at preserved)"
          - "FIFO auto-allocate: iterate this terminal's REQUESTED orders by created_at ASC (tie: requested_gal DESC); if available_to_promise_gal >= requested_gal then ALLOCATED with allocated_gal = requested_gal and provisional re-stamped, else leave REQUESTED; stop condition never blocks later orders (each evaluated independently in order)"

  - entity: SupplyContract
    field: status
    initial_state: DRAFT
    terminal_states: [COMPLETED, DEFAULTED, CANCELLED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /supply-contracts/{id}/activate"
        actor: SupplyAdmin
        preconditions:
          - "receipt_window_end >= receipt_window_start"
        side_effects: []
      - from: ACTIVE
        to: COMPLETED
        trigger: "system (a RailShipment UNLOADED makes delivered_volume_gal >= contracted_volume_gal)"
        actor: system
        preconditions: []
        side_effects:
          - "No further rail shipments may be created or advanced under this contract"
      - from: ACTIVE
        to: DEFAULTED
        trigger: "system (POST /ops/run_epoch when receipt_window_end < today AND delivered_volume_gal < contracted_volume_gal)"
        actor: system
        preconditions: []
        side_effects:
          - "Its RailShipments in TENDERED or IN_TRANSIT -> CANCELLED (ARRIVED shipments are unaffected and may still unload)"
      - from: [DRAFT, ACTIVE]
        to: CANCELLED
        trigger: "POST /supply-contracts/{id}/cancel"
        actor: SupplyAdmin
        preconditions: []
        side_effects:
          - "Its RailShipments in TENDERED or IN_TRANSIT -> CANCELLED; ARRIVED/UNLOADED shipments unaffected"

  - entity: RailShipment
    field: status
    initial_state: TENDERED
    terminal_states: [UNLOADED, CANCELLED]
    transitions:
      - from: TENDERED
        to: IN_TRANSIT
        trigger: "POST /rail-shipments/{id}/transition {to_state: IN_TRANSIT}"
        actor: SupplyAdmin
        preconditions: []
        side_effects: []
      - from: IN_TRANSIT
        to: ARRIVED
        trigger: "POST /rail-shipments/{id}/transition {to_state: ARRIVED}"
        actor: SupplyAdmin
        preconditions: []
        side_effects: []
      - from: ARRIVED
        to: UNLOADED
        trigger: "POST /rail-shipments/{id}/transition {to_state: UNLOADED}"
        actor: SupplyAdmin
        preconditions:
          - "SupplyContract.status == ACTIVE (ERR_CONTRACT_NOT_ACTIVE)"
        side_effects:
          - "Terminal.on_hand_gal += volume_gal (bumps Terminal.version)"
          - "SupplyContract.delivered_volume_gal += volume_gal"
          - "If delivered_volume_gal >= contracted_volume_gal: SupplyContract.status -> COMPLETED"
          - "unloaded_at = now"
      - from: [TENDERED, IN_TRANSIT]
        to: CANCELLED
        trigger: "POST /rail-shipments/{id}/transition {to_state: CANCELLED} or system (contract cancelled/defaulted)"
        actor: "SupplyAdmin or system"
        preconditions: []
        side_effects: []

  - entity: Dealer
    field: credit_status
    initial_state: GOOD_STANDING
    terminal_states: []
    note: "Computed cyclic posture; re-evaluated after every mutation touching committed_exposure_cents (order create/cancel/load/deliver, payment post/return, cold-snap reprice, PATCH credit_limit_cents)."
    transitions:
      - from: GOOD_STANDING
        to: WATCH
        trigger: "system (credit_status_threshold recompute)"
        actor: system
        preconditions: ["committed_exposure_cents * 5 >= credit_limit_cents * 4 AND committed_exposure_cents < credit_limit_cents"]
        side_effects: ["INDEX/SPOT orders created while WATCH carry CREDIT_WATCH_SURCHARGE_MC per gallon"]
      - from: WATCH
        to: SUSPENDED
        trigger: "system (credit_status_threshold recompute)"
        actor: system
        preconditions: ["committed_exposure_cents >= credit_limit_cents"]
        side_effects: ["Blocks POST /delivery-orders (ERR_DEALER_SUSPENDED) and POST /dealer-contracts/{id}/activate (ERR_DEALER_SUSPENDED)"]
      - from: SUSPENDED
        to: WATCH
        trigger: "system (credit_status_threshold recompute)"
        actor: system
        preconditions: ["committed_exposure_cents * 5 >= credit_limit_cents * 4 AND committed_exposure_cents < credit_limit_cents"]
        side_effects: []
      - from: [WATCH, SUSPENDED]
        to: GOOD_STANDING
        trigger: "system (credit_status_threshold recompute)"
        actor: system
        preconditions: ["committed_exposure_cents * 5 < credit_limit_cents * 4"]
        side_effects: []

  - entity: DealerContract
    field: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, EXPIRED, CANCELLED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /dealer-contracts/{id}/activate {expected_dealer_version}"
        actor: CreditManager
        preconditions:
          - "Dealer.credit_status != SUSPENDED (ERR_DEALER_SUSPENDED)"
          - "expected_dealer_version == Dealer.version (ERR_STALE_DEALER_VERSION, 412)"
        side_effects:
          - "Any other ACTIVE DealerContract with same dealer_id + terminal_id and overlapping [window_start, window_end] -> SUPERSEDED"
          - "A SUPERSEDED contract cascades: its orders in REQUESTED or ALLOCATED -> CANCELLED (reserved released); its SCHEDULED orders are unscheduled (truck/hours released) then CANCELLED"
          - "Dealer.version += 1 (OCC bookkeeping on the parent)"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (another contract activation supersedes this one)"
        actor: system
        preconditions: []
        side_effects:
          - "Same order-cancellation cascade as CANCELLED"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (POST /ops/run_epoch when window_end < today)"
        actor: system
        preconditions: []
        side_effects: ["Open orders keep their pricing snapshot but can no longer schedule (contract must be ACTIVE at schedule)"]
      - from: [DRAFT, ACTIVE]
        to: CANCELLED
        trigger: "POST /dealer-contracts/{id}/cancel"
        actor: CreditManager
        preconditions: []
        side_effects:
          - "Orders in REQUESTED or ALLOCATED -> CANCELLED (reserved released); SCHEDULED orders unscheduled then CANCELLED; LOADED/DELIVERED orders and OPEN invoices unaffected"

  - entity: DeliveryOrder
    field: fulfillment_status
    initial_state: REQUESTED
    terminal_states: [DELIVERED, CANCELLED]
    note: "Parallel dimension: invoice_status (NOT_READY | OPEN | PAID | VOID) evolves independently; see transitions below."
    transitions:
      - from: REQUESTED
        to: ALLOCATED
        trigger: "system (creation fast-path when terminal NORMAL; allocation run ratify; cold-snap lift FIFO requeue)"
        actor: system
        preconditions: ["terminal available_to_promise_gal >= requested_gal at allocation time (direct/lift paths)"]
        side_effects:
          - "allocated_gal set (= requested_gal on direct/lift; = run share on ratify, possibly partial)"
          - "provisional_total_cents computed via delivered_price(provisional)"
          - "terminal reserved_gal increases by allocated_gal (computed aggregate)"
      - from: REQUESTED
        to: SHORTED
        trigger: "system (allocation run ratify with share == 0)"
        actor: system
        preconditions: []
        side_effects: ["allocated_gal = 0; provisional_total_cents = null"]
      - from: SHORTED
        to: REQUESTED
        trigger: "system (cold-snap lift requeue)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ALLOCATED
        to: SCHEDULED
        trigger: "POST /delivery-orders/{id}/schedule {truck_id, planned_load_start, planned_load_end}"
        actor: Dispatcher
        preconditions:
          - "TransportTruck.status == AVAILABLE (ERR_TRUCK_NOT_AVAILABLE)"
          - "truck.terminal_id == order.terminal_id (ERR_TRUCK_TERMINAL_MISMATCH)"
          - "allocated_gal <= truck.capacity_gal (ERR_TRUCK_CAPACITY_EXCEEDED)"
          - "driver-hours: truck.weekly_committed_minutes + est_trip_minutes <= truck.weekly_hours_limit_minutes (ERR_DRIVER_HOURS_EXCEEDED)"
          - "no buffered window overlap on the truck (ERR_TRUCK_SCHEDULE_CONFLICT)"
          - "rack bays: fewer than rack_bay_count orders in {SCHEDULED, LOADED} overlap [planned_load_start, planned_load_end) (ERR_RACK_CAPACITY_EXCEEDED)"
          - "if contract present: contract ACTIVE (ERR_CONTRACT_NOT_ACTIVE) and date(planned_load_start) inside contract window (ERR_OUTSIDE_CONTRACT_WINDOW)"
        side_effects:
          - "truck_id set; est_trip_minutes = LOAD_SERVICE_MINUTES + 2 * zone.one_way_drive_minutes"
      - from: SCHEDULED
        to: ALLOCATED
        trigger: "POST /delivery-orders/{id}/unschedule or system (truck -> OUT_OF_SERVICE)"
        actor: "Dispatcher or system"
        preconditions: []
        side_effects: ["truck_id = null; est_trip_minutes = null; weekly_committed_minutes and overlap occupancy released"]
      - from: SCHEDULED
        to: LOADED
        trigger: "POST /delivery-orders/{id}/load"
        actor: Dispatcher
        preconditions: ["terminal on_hand_gal - allocated_gal >= terminal effective_reserve_floor_gal (ERR_RESERVE_FLOOR_BREACH)"]
        side_effects:
          - "final_total_cents computed via delivered_price(final) with index resolved on date(planned_load_start)"
          - "Terminal.on_hand_gal -= allocated_gal (bumps Terminal.version); reserved_gal decreases"
          - "DealerContract.volume_drawn_gal += in_band_gal (= min(allocated_gal, max(0, volume_committed_gal - volume_drawn_gal))); overage gallons NOT added"
      - from: LOADED
        to: DELIVERED
        trigger: "POST /delivery-orders/{id}/deliver"
        actor: Dispatcher
        preconditions: []
        side_effects:
          - "invoice_status: NOT_READY -> OPEN; open_balance_cents = final_total_cents; invoiced_at = now"
          - "dealer ledger_exposure_cents increases by final_total_cents (computed)"
      - from: [REQUESTED, ALLOCATED, SHORTED, SCHEDULED]
        to: CANCELLED
        trigger: "POST /delivery-orders/{id}/cancel or system (contract cancelled/superseded)"
        actor: "DealerUser (own) or Dispatcher or system"
        preconditions:
          - "DealerUser caller: order.dealer_id == X-User-ID (ERR_DEALER_MISMATCH)"
        side_effects:
          - "If SCHEDULED: unschedule side effects first (truck/hours released), then CANCELLED"
          - "If ALLOCATED: reserved_gal released"
          - "invoice_status NOT_READY -> VOID"
  - entity: DeliveryOrder
    field: invoice_status
    initial_state: NOT_READY
    terminal_states: [VOID]
    note: "PAID is not terminal: a payment return reopens it (OPEN). Parallel to fulfillment_status."
    transitions:
      - from: NOT_READY
        to: OPEN
        trigger: "system (order DELIVERED)"
        actor: system
        preconditions: []
        side_effects: ["open_balance_cents = final_total_cents"]
      - from: OPEN
        to: PAID
        trigger: "system (FIFO payment application reduces open_balance_cents to 0)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PAID
        to: OPEN
        trigger: "system (DealerPayment RETURNED reverses its applications)"
        actor: system
        preconditions: []
        side_effects: ["open_balance_cents restored by the reversed slice"]
      - from: NOT_READY
        to: VOID
        trigger: "system (order CANCELLED before delivery)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ColdSnapEvent
    field: status
    initial_state: DECLARED
    terminal_states: [LIFTED]
    transitions:
      - from: DECLARED
        to: ACTIVE
        trigger: "POST /cold-snap-events/{id}/activate or system (POST /ops/run_epoch when start_date <= today)"
        actor: "SupplyPlanner or system"
        preconditions: ["No other ColdSnapEvent on this terminal is ACTIVE (ERR_COLD_SNAP_ALREADY_ACTIVE)"]
        side_effects:
          - "Terminal.allocation_posture NORMAL -> CURTAILED with its full cascade (provisional reprice, credit recompute)"
      - from: ACTIVE
        to: LIFTED
        trigger: "POST /cold-snap-events/{id}/lift or system (POST /ops/run_epoch when end_date < today)"
        actor: "SupplyPlanner or system"
        preconditions: []
        side_effects:
          - "Terminal.allocation_posture CURTAILED -> NORMAL with its full cascade (surcharge removal, SHORTED -> REQUESTED, FIFO auto-allocate)"

  - entity: AllocationRun
    field: status
    initial_state: OPEN
    terminal_states: [RATIFIED, SUPERSEDED]
    transitions:
      - from: OPEN
        to: COMPUTED
        trigger: "POST /allocation-runs/{id}/compute"
        actor: SupplyPlanner
        preconditions: ["terminal allocation_posture == CURTAILED (ERR_TERMINAL_NOT_CURTAILED)"]
        side_effects:
          - "pool_gal snapshot = terminal available_to_promise_gal"
          - "results computed via allocation_pro_rata_waterfall over eligible REQUESTED orders (created_at < run.created_at)"
      - from: COMPUTED
        to: RATIFIED
        trigger: "POST /allocation-runs/{id}/ratify"
        actor: SupplyPlanner
        preconditions: ["run status == COMPUTED (ERR_RUN_NOT_COMPUTED); SUPERSEDED runs reject every action with ERR_INVALID_STATE"]
        side_effects:
          - "Each order in results: REQUESTED -> ALLOCATED with allocated_gal = share (provisional stamped) when share > 0, else -> SHORTED with allocated_gal = 0"
      - from: [OPEN, COMPUTED]
        to: SUPERSEDED
        trigger: "system (a new POST /allocation-runs for the same terminal succeeds)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: DealerPayment
    field: status
    initial_state: POSTED
    terminal_states: [RETURNED]
    transitions:
      - from: POSTED
        to: RETURNED
        trigger: "POST /dealer-payments/{id}/return"
        actor: CreditManager
        preconditions: ["payment status == POSTED; a non-POSTED payment rejects with ERR_PAYMENT_ALREADY_RETURNED"]
        side_effects:
          - "Reverse this payment's applications in reverse application order: each order's open_balance_cents += slice; invoice_status PAID -> OPEN when restored above 0"
          - "Dealer.fee_balance_cents += NSF_FEE_CENTS (bumps Dealer.version)"
          - "Dealer exposure recomputed; credit_status may flip (e.g. WATCH -> SUSPENDED)"

# =============================================================================
# §1.2.1 Concurrency Rules (true races only, OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: allocation-run-create-stale-terminal
    parent_entity: Terminal
    write_endpoint: "POST /allocation-runs"
    occ_field: expected_terminal_version
    description: |
      Creating an AllocationRun supersedes the terminal's existing OPEN or
      COMPUTED run and bumps Terminal.version. A create carrying an
      expected_terminal_version that no longer matches the terminal's current
      version is based on a stale view of the terminal (e.g. another writer
      has just created a run that legitimately superseded the prior one) and
      is rejected with 412.
    error_id: ERR_STALE_TERMINAL_VERSION
    http_status: 412
  - rule_id: dealer-contract-activate-stale-dealer
    parent_entity: Dealer
    write_endpoint: "POST /dealer-contracts/{id}/activate"
    occ_field: expected_dealer_version
    description: |
      Activating a DealerContract supersedes the dealer's currently ACTIVE
      overlapping contract at the same terminal and bumps Dealer.version. An
      activation carrying an expected_dealer_version that no longer matches
      the dealer's current version is based on a stale view (e.g. another
      writer has just activated a contract that superseded the prior one)
      and is rejected with 412.
    error_id: ERR_STALE_DEALER_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: delivered_price
    trigger: "DeliveryOrder creation and every entry into ALLOCATED (provisional variant); cold-snap posture flips re-stamp provisionals of ALLOCATED/SCHEDULED orders; LOADED transition (final variant)"
    algorithm: tiered_pricing
    formula: |
      # All prices are integer millicents per gallon (mc); amounts are integer cents.
      # V = order.allocated_gal (provisional at creation: requested_gal as the pending allocation).
      # resolve_index(D): the PriceIndexPublication for the order's pricing index basis
      #   with the greatest effective_date <= D (unique per (index_name, effective_date)).
      #   Index basis is MT_BELVIEU for all INDEX/SPOT pricing in v1.
      base_index_mc = resolve_index(ref_date).price_mc_per_gal
      # resolved LAZILY: only when an index-exposed gallon exists (SPOT order, INDEX contract band,
      # or FIXED over_gal > 0); resolution with no effective publication -> ERR_NO_INDEX_PUBLISHED
      if order has no contract (SPOT):
        product_cents = rhu(V * (base_index_mc + SPOT_PREMIUM_MC + watch_mc) / 1000)
      else:
        in_band_gal = min(V, max(0, contract.volume_committed_gal - contract.volume_drawn_gal))
        over_gal    = V - in_band_gal
        band_price_mc = contract.fixed_price_mc_per_gal if contract.pricing_mode == FIXED else base_index_mc
        over_price_mc = base_index_mc + OVERAGE_PREMIUM_MC
        # watch_mc applies only to index-exposed gallons (INDEX contract or SPOT), never to FIXED in-band gallons
        product_cents = rhu(in_band_gal * (band_price_mc + (watch_mc if contract.pricing_mode == INDEX else 0)) / 1000)
                      + rhu(over_gal    * (over_price_mc  + watch_mc) / 1000)
      freight_cents = max(zone.min_freight_cents, rhu(V * zone.freight_mc_per_gal / 1000))
      winter_cents  = rhu(V * WINTER_SURCHARGE_MC / 1000) if terminal allocation_posture == CURTAILED at pricing time else 0
      total_cents   = product_cents + freight_cents + winter_cents
      # watch_mc = CREDIT_WATCH_SURCHARGE_MC if dealer.credit_status (evaluated per credit_gate_evaluation,
      # EXCLUDING this candidate order) == WATCH at pricing time, else 0. Never applied to SUSPENDED dealers
      # because their orders are rejected at creation.
    input_set: "The order itself; its DealerContract (if any) with current volume_drawn_gal; its FreightZone; its Terminal posture; the index publication resolved on ref_date; the dealer's credit status"
    constants:
      OVERAGE_PREMIUM_MC: 25000
      SPOT_PREMIUM_MC: 40000
      CREDIT_WATCH_SURCHARGE_MC: 15000
      WINTER_SURCHARGE_MC: 30000
    precision: "rhu(x) = round_half_up to integer cents; EACH segment (in-band product, overage product, freight, winter) is rounded to integer cents BEFORE summing; summing unrounded segments then rounding is forbidden"
    variants:
      - name: provisional
        when: "order creation, entry into ALLOCATED, terminal posture flips while ALLOCATED/SCHEDULED"
        difference: "ref_date = current logical-clock date; winter leg uses CURRENT terminal posture"
      - name: final
        when: "SCHEDULED -> LOADED transition only; stamped once into final_total_cents"
        difference: "ref_date = date(order.planned_load_start); winter leg uses terminal posture at the load transition; volume_drawn_gal used for banding is the value BEFORE this load's draw is applied"

  - name: dealer_credit_exposure
    trigger: "recomputed on read of Dealer and after every order/payment/contract/cold-snap mutation touching the dealer"
    algorithm: aggregation
    formula: |
      ledger_exposure_cents    = sum(open_balance_cents) over dealer's orders with invoice_status == OPEN
      committed_exposure_cents = fee_balance_cents
                               + ledger_exposure_cents
                               + sum(final_total_cents)       over orders with fulfillment_status == LOADED
                               + sum(provisional_total_cents) over orders with fulfillment_status IN {ALLOCATED, SCHEDULED}
    input_set: "Orders of the dealer in the named statuses ONLY (REQUESTED, SHORTED, CANCELLED and DELIVERED-with-PAID-invoice excluded; DELIVERED orders contribute via OPEN invoice balance)"
    precision: "integer cents; no rounding"
    variants:
      - name: ledger
        when: "statement/ledger view; payment cap for ERR_OVERPAYMENT uses total open invoice balance (= ledger_exposure_cents)"
        difference: "actuals only: OPEN invoice balances; excludes pipeline orders and fees"
      - name: committed
        when: "credit gate at order creation and credit_status threshold evaluation"
        difference: "forward-looking: adds LOADED finals, ALLOCATED/SCHEDULED provisionals, and fee_balance_cents on top of ledger"

  - name: credit_gate_evaluation
    trigger: "POST /delivery-orders (gate) and any call into delivered_price needing watch_mc"
    algorithm: constraint_propagation
    formula: |
      # Circular-looking dependency, pinned evaluation order (the order's provisional depends on credit
      # status; credit status depends on committed exposure which will include the order):
      #   1. committed_before = dealer.committed_exposure_cents EXCLUDING the candidate order
      #   2. status_before    = credit_status_threshold(committed_before, credit_limit_cents)
      #   3. watch_mc         = CREDIT_WATCH_SURCHARGE_MC iff status_before == WATCH else 0
      #   4. provisional      = delivered_price(provisional, watch_mc)
      #   5. gate: if committed_before + provisional_total_cents > credit_limit_cents -> ERR_CREDIT_LIMIT_EXCEEDED
      # status_before == SUSPENDED is rejected earlier (state layer, ERR_DEALER_SUSPENDED) and never reaches step 3.
    input_set: "Dealer stored/computed fields and the candidate order"
    precision: "integer cents; comparisons exact (>, >=) as written"

  - name: credit_status_threshold
    trigger: "after any mutation of dealer exposure inputs or credit_limit_cents"
    algorithm: threshold
    formula: |
      if committed_exposure_cents >= credit_limit_cents:            SUSPENDED
      elif committed_exposure_cents * 5 >= credit_limit_cents * 4:  WATCH     # exactly 80% crosses (>=, integer math)
      else:                                                          GOOD_STANDING
    input_set: "Dealer.committed_exposure_cents, Dealer.credit_limit_cents"
    precision: "integer cross-multiplication; no float"

  - name: allocation_pro_rata_waterfall
    trigger: "POST /allocation-runs/{id}/compute"
    algorithm: waterfall_allocation
    formula: |
      eligible = terminal's DeliveryOrders with fulfillment_status == REQUESTED AND created_at < run.created_at
      pool = terminal.available_to_promise_gal (snapshot into run.pool_gal)
      tier(o): FIXED-contract order -> 1; INDEX-contract order -> 2; SPOT (no contract) -> 3
      weight(o): tiers 1-2 -> sum of volume_committed_gal over the order's dealer's ACTIVE DealerContracts
                 at this terminal; tier 3 -> 1 per order
      for tier in [1, 2, 3]:
        candidates = eligible orders of this tier, unserved
        if pool <= 0 or candidates empty: continue
        W = sum(weight(o) for o in candidates)
        raw(o) = pool * weight(o) / W                      # exact rational
        share(o) = min(o.requested_gal, floor(raw(o)))     # floor per order FIRST (never above request)
        distribute remainder R = pool - sum(share) one gallon at a time to orders with share < requested,
          ordered by created_at ASC (tie: requested_gal DESC), looping until R == 0 or all satisfied
        allocated(o) = min(o.requested_gal, share(o) + remainder_gallons(o))
        pool -= sum(allocated over this tier)
      orders never reached or allocated 0 -> outcome SHORTED
    input_set: "REQUESTED orders created before the run; terminal ATP at compute time; ACTIVE contracts for weights"
    precision: "integer gallons; floor-before-remainder pinned (round-half-up per order instead would misallocate the remainder gallon)"
    note: "Rounding-order trap pinned: floor each share, then distribute the remainder deterministically. Selector determinism: eligibility filter, ranking (weight ratio), tie-break (created_at ASC then requested_gal DESC), empty-pool fallback (all remaining eligible orders SHORTED)."

  - name: fifo_payment_application
    trigger: "POST /dealer-payments"
    algorithm: chronological
    formula: |
      targets = dealer's orders with invoice_status == OPEN, ordered by invoiced_at ASC (tie: created_at ASC)
      remaining = payment.amount_cents
      for each order in targets:
        slice = min(remaining, order.open_balance_cents); order.open_balance_cents -= slice
        append {order_id, amount_cents: slice} to payment.applications (in application order)
        if order.open_balance_cents == 0: order.invoice_status -> PAID
        remaining -= slice; if remaining == 0: break
      # overpayment impossible: creation rejected with ERR_OVERPAYMENT when amount > total open balance
    input_set: "OPEN invoices of the dealer only (PAID/VOID/NOT_READY excluded)"
    precision: "integer cents"

  - name: trip_hours_estimate
    trigger: "POST /delivery-orders/{id}/schedule (and weekly_committed_minutes aggregation)"
    algorithm: aggregation
    formula: |
      est_trip_minutes = LOAD_SERVICE_MINUTES + 2 * zone.one_way_drive_minutes
      truck weekly gate: sum(est_trip_minutes over truck's orders with fulfillment_status IN {SCHEDULED, LOADED, DELIVERED}
                             and planned_load_start in the same ISO week (Monday 00:00 UTC boundary) as the candidate's
                             planned_load_start) + candidate est_trip_minutes <= truck.weekly_hours_limit_minutes
      # boundary: equality is allowed (<=), one minute over is rejected
    input_set: "Candidate order's zone; the truck's same-week orders in the named statuses"
    constants:
      LOAD_SERVICE_MINUTES: 90
    precision: "integer minutes"

  - name: terminal_available_to_promise
    trigger: "order creation fast-path, allocation compute, lift requeue, inventory-summary read"
    algorithm: aggregation
    formula: |
      effective_reserve_floor_gal = winter_reserve_floor_gal if season_posture == WINTER_DRAW else reserve_floor_gal
      reserved_gal = sum(allocated_gal) over terminal's orders with fulfillment_status IN {ALLOCATED, SCHEDULED}
      available_to_promise_gal = on_hand_gal - effective_reserve_floor_gal - reserved_gal
      # creation gate (NORMAL posture only): requested_gal <= ATP; exactly equal succeeds, one gallon over fails
    input_set: "Terminal stored fields + orders in {ALLOCATED, SCHEDULED} only (REQUESTED/SHORTED hold nothing)"
    precision: "integer gallons"

  - name: buffered_window_overlap
    trigger: "POST /delivery-orders/{id}/schedule"
    algorithm: interval_merge
    formula: |
      occupied(o) = [o.planned_load_start - DEADHEAD_BUFFER_MINUTES, o.planned_load_end + DEADHEAD_BUFFER_MINUTES)
      conflict iff max(occupied_new.start, occupied_old.start) < min(occupied_new.end, occupied_old.end)
      for any existing order on the same truck with fulfillment_status IN {SCHEDULED, LOADED, DELIVERED}
      # half-open with symmetric buffer: exact back-to-back at the buffer boundary does NOT conflict;
      # one minute of intersection DOES
    input_set: "Same-truck orders in the named statuses"
    constants:
      DEADHEAD_BUFFER_MINUTES: 60
    precision: "minute resolution, half-open intervals"

  - name: rack_bay_capacity
    trigger: "POST /delivery-orders/{id}/schedule"
    algorithm: interval_merge
    formula: |
      overlap iff max(new.start, old.start) < min(new.end, old.end) over RAW windows [planned_load_start, planned_load_end)
      (NO deadhead buffer) against the terminal's orders with fulfillment_status IN {SCHEDULED, LOADED}
      reject when count(overlapping) >= terminal.rack_bay_count   # aggregate-capacity semantics:
      # rack_bay_count overlapping windows are allowed, the (bay_count+1)-th is rejected
    input_set: "Same-terminal orders in {SCHEDULED, LOADED}"
    precision: "minute resolution, half-open raw windows"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is a declared role; for entity_backed roles (DealerUser) X-User-ID must be the id of an existing Dealer. Request shape: required fields present, types correct, enum members valid (ERR_INVALID_REQUEST)"
    error_id: ERR_UNAUTHENTICATED | ERR_INVALID_REQUEST
    http_status: 401
    applies_to: "all endpoints"
    note: "ERR_UNAUTHENTICATED is 401; ERR_INVALID_REQUEST is 400 (catalog per-id http wins over this row's shared cell)."
  - priority: 2
    category: auth
    check: "Caller's role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: auth
    check: "DealerUser ownership: may only read/cancel resources whose dealer_id == X-User-ID; dealer_id filter on GET /delivery-orders must equal X-User-ID"
    error_id: ERR_DEALER_MISMATCH
    http_status: 403
    applies_to: "GET /delivery-orders, GET /delivery-orders/{id}, POST /delivery-orders/{id}/cancel, GET /dealer-contracts, GET /dealer-contracts/{id}, GET /dealer-payments, GET /dealer-payments/{id}, GET /dealers/{id} (DealerUser caller only)"
  - priority: 4
    category: existence
    check: "Path ids exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 5
    category: existence
    check: "Body foreign keys resolve to existing entities (dealer_contract_id, terminal_id, freight_zone_id, truck_id, supply_contract_id, dealer_id, terminal_id)"
    error_id: ERR_REFERENCED_NOT_FOUND
    http_status: 422
    applies_to: "POST /delivery-orders, POST /delivery-orders/{id}/schedule, POST /rail-shipments, POST /supply-contracts, POST /dealer-contracts, POST /dealer-payments, POST /freight-zones, POST /trucks, POST /cold-snap-events, POST /allocation-runs"
  - priority: 6
    category: state
    check: "OCC: expected_terminal_version == Terminal.version on POST /allocation-runs; expected_dealer_version == Dealer.version on POST /dealer-contracts/{id}/activate"
    error_id: ERR_STALE_TERMINAL_VERSION | ERR_STALE_DEALER_VERSION
    http_status: 412
    applies_to: "POST /allocation-runs, POST /dealer-contracts/{id}/activate"
  - priority: 7
    category: state
    check: "Generic transition legality: entity in a `from` state for the requested transition (incl. rail to_state jumps, load/deliver/cancel preconditions, run OPEN->COMPUTED->RATIFIED order, payment POSTED->RETURNED, cold-snap DECLARED->ACTIVE->LIFTED)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition/action endpoints"
  - priority: 8
    category: state
    check: "Cross-entity state gates: DealerContract must be ACTIVE at order creation and scheduling; DealerUser's Dealer must not be SUSPENDED at order creation; Dealer not SUSPENDED at contract activation; SupplyContract ACTIVE at shipment unload; TransportTruck AVAILABLE at schedule; terminal CURTAILED at allocation compute; no other ACTIVE cold snap at activation"
    error_id: ERR_CONTRACT_NOT_ACTIVE | ERR_DEALER_SUSPENDED | ERR_TRUCK_NOT_AVAILABLE | ERR_TERMINAL_NOT_CURTAILED | ERR_COLD_SNAP_ALREADY_ACTIVE
    http_status: 409
    applies_to: "POST /delivery-orders, POST /delivery-orders/{id}/schedule, POST /dealer-contracts/{id}/activate, POST /rail-shipments/{id}/transition, POST /allocation-runs/{id}/compute, POST /cold-snap-events/{id}/activate"
  - priority: 9
    category: business_safety
    check: "Driver hours-of-service: truck weekly_committed_minutes + est_trip_minutes <= weekly_hours_limit_minutes; rack-floor safety: load must leave terminal on_hand_gal - allocated_gal >= effective_reserve_floor_gal (winter floor in WINTER_DRAW)"
    error_id: ERR_DRIVER_HOURS_EXCEEDED | ERR_RESERVE_FLOOR_BREACH
    http_status: 422
    applies_to: "POST /delivery-orders/{id}/schedule, POST /delivery-orders/{id}/load"
  - priority: 10
    category: business_constraint
    check: "Capacity/referential/temporal: allocated_gal <= truck.capacity_gal; truck.terminal_id == order.terminal_id; zone.terminal_id == order.terminal_id; contract.terminal_id == order.terminal_id; contract.dealer_id == caller dealer; buffered truck-window overlap; rack bay aggregate capacity; planned_load_end > planned_load_start; load date inside contract window; rail scheduled_arrival_date inside contract receipt window; zone_code/unit_number per-terminal uniqueness; (index_name, effective_date) uniqueness; requested_gal >= 1000"
    error_id: ERR_TRUCK_CAPACITY_EXCEEDED | ERR_TRUCK_TERMINAL_MISMATCH | ERR_ZONE_TERMINAL_MISMATCH | ERR_CONTRACT_TERMINAL_MISMATCH | ERR_CONTRACT_DEALER_MISMATCH | ERR_TRUCK_SCHEDULE_CONFLICT | ERR_RACK_CAPACITY_EXCEEDED | ERR_WINDOW_INVALID | ERR_OUTSIDE_CONTRACT_WINDOW | ERR_SHIPMENT_WINDOW_VIOLATION | ERR_DUPLICATE_ZONE_CODE | ERR_DUPLICATE_TRUCK_UNIT | ERR_DUPLICATE_INDEX_PUBLICATION | ERR_VOLUME_INVALID | ERR_INSUFFICIENT_SUPPLY
    http_status: 422
    applies_to: "POST /delivery-orders, POST /delivery-orders/{id}/schedule, POST /rail-shipments, POST /freight-zones, POST /trucks, POST /price-index-publications"
  - priority: 11
    category: business_fiscal
    check: "Credit gate (credit_gate_evaluation step 5): committed_before + provisional_total_cents > credit_limit_cents rejected; payment amount_cents > total open invoice balance rejected; index availability: INDEX/SPOT pricing with no publication effective on ref_date"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED | ERR_OVERPAYMENT | ERR_NO_INDEX_PUBLISHED
    http_status: 402
    applies_to: "POST /delivery-orders, POST /dealer-payments, POST /delivery-orders/{id}/load (index resolution)"
    note: "ERR_CREDIT_LIMIT_EXCEEDED uses http 402; ERR_OVERPAYMENT and ERR_NO_INDEX_PUBLISHED use 422 (see error catalog; the catalog's per-id http value wins over this row's shared cell)."

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock / ops (test-driving + ops-run checkpoint) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock (test-driving endpoint). Startup default is exactly 2026-08-01T00:00:00Z; before any set call the clock reads this default and never falls back to wall-clock time."
    roles: [SystemAdmin]
    code: 200
    input: [to_iso8601]
    output: { now_iso8601: string }
    side_effects: ["season_posture derivations follow the new date on next read"]
  - method: POST
    path: "/ops/run_epoch"
    description: "Advance the daily ops epoch for every terminal"
    roles: [SystemAdmin]
    code: 200
    input: []
    output: { cold_snaps_activated: integer, cold_snaps_lifted: integer, dealer_contracts_expired: integer, supply_contracts_completed: integer, supply_contracts_defaulted: integer, shipments_cancelled: integer }
    side_effects:
      - "ColdSnapEvent DECLARED with start_date <= today -> ACTIVE (full curtail cascade per terminal)"
      - "ColdSnapEvent ACTIVE with end_date < today -> LIFTED (full lift cascade per terminal)"
      - "DealerContract ACTIVE with window_end < today -> EXPIRED"
      - "SupplyContract ACTIVE with receipt_window_end < today -> COMPLETED if delivered >= contracted else DEFAULTED (open TENDERED/IN_TRANSIT shipments -> CANCELLED)"
      - "Terminal.ops_epoch += 1 for every terminal (bumps Terminal.version)"

  # --- Terminal ---
  - method: POST
    path: "/terminals"
    description: "Create a terminal"
    roles: [SupplyAdmin]
    code: 201
    input: [name, region_code, storage_capacity_gal, reserve_floor_gal, winter_reserve_floor_gal, rack_bay_count]
    output: Terminal
    side_effects: ["on_hand_gal=0, allocation_posture=NORMAL, ops_epoch=0, version=1"]
  - method: GET
    path: "/terminals/{id}"
    description: "Get terminal"
    roles: [SupplyAdmin, SupplyPlanner, Dispatcher, CreditManager, SystemAdmin]
    code: 200
    input: []
    output: Terminal
    side_effects: []
  - method: GET
    path: "/terminals/{id}/inventory-summary"
    description: "Computed read of terminal inventory posture"
    roles: [SupplyAdmin, SupplyPlanner, Dispatcher, CreditManager, SystemAdmin]
    code: 200
    input: []
    output: { on_hand_gal: integer, reserved_gal: integer, effective_reserve_floor_gal: integer, available_to_promise_gal: integer, season_posture: string, allocation_posture: string, open_request_gal: integer }
    side_effects: []

  # --- SupplyContract ---
  - method: POST
    path: "/supply-contracts"
    description: "Create a supply contract (DRAFT)"
    roles: [SupplyAdmin]
    code: 201
    input: [terminal_id, supplier_name, contracted_volume_gal, receipt_window_start, receipt_window_end]
    output: SupplyContract
    side_effects: []
  - method: GET
    path: "/supply-contracts/{id}"
    description: "Get supply contract"
    roles: [SupplyAdmin, SupplyPlanner]
    code: 200
    input: []
    output: SupplyContract
    side_effects: []
  - method: GET
    path: "/supply-contracts"
    description: "List supply contracts (FK reverse lookup by terminal_id)"
    roles: [SupplyAdmin, SupplyPlanner]
    code: 200
    input: ["terminal_id?", "status?", "limit?", "offset?"]
    output: SupplyContract[]
    side_effects: []
  - method: POST
    path: "/supply-contracts/{id}/activate"
    description: "Activate a DRAFT supply contract"
    roles: [SupplyAdmin]
    code: 200
    input: []
    output: SupplyContract
    side_effects: ["status DRAFT -> ACTIVE"]
  - method: POST
    path: "/supply-contracts/{id}/cancel"
    description: "Cancel a supply contract; cascades to open rail shipments"
    roles: [SupplyAdmin]
    code: 200
    input: []
    output: SupplyContract
    side_effects: ["status -> CANCELLED; RailShipments TENDERED/IN_TRANSIT -> CANCELLED"]

  # --- RailShipment ---
  - method: POST
    path: "/rail-shipments"
    description: "Tender a rail shipment under a supply contract"
    roles: [SupplyAdmin]
    code: 201
    input: [supply_contract_id, volume_gal, railcar_count, scheduled_arrival_date]
    output: RailShipment
    side_effects: ["terminal_id copied from contract; status=TENDERED"]
  - method: GET
    path: "/rail-shipments/{id}"
    description: "Get rail shipment"
    roles: [SupplyAdmin, SupplyPlanner, Dispatcher]
    code: 200
    input: []
    output: RailShipment
    side_effects: []
  - method: GET
    path: "/rail-shipments"
    description: "List rail shipments (FK reverse by supply_contract_id or terminal_id)"
    roles: [SupplyAdmin, SupplyPlanner, Dispatcher]
    code: 200
    input: ["supply_contract_id?", "terminal_id?", "status?", "limit?", "offset?"]
    output: RailShipment[]
    side_effects: []
  - method: POST
    path: "/rail-shipments/{id}/transition"
    description: "Advance rail shipment: TENDERED->IN_TRANSIT->ARRIVED->UNLOADED, or CANCELLED from TENDERED/IN_TRANSIT"
    roles: [SupplyAdmin]
    code: 200
    input: [to_state]
    output: RailShipment
    side_effects: ["On UNLOADED: Terminal.on_hand_gal += volume_gal (Terminal.version += 1); SupplyContract.delivered_volume_gal += volume_gal; contract may -> COMPLETED"]

  # --- Dealer ---
  - method: POST
    path: "/dealers"
    description: "Create a dealer"
    roles: [CreditManager]
    code: 201
    input: [legal_name, credit_limit_cents]
    output: Dealer
    side_effects: ["fee_balance_cents=0, version=1"]
  - method: GET
    path: "/dealers/{id}"
    description: "Get dealer (DealerUser limited to self)"
    roles: [CreditManager, DealerUser]
    code: 200
    input: []
    output: Dealer
    side_effects: []
  - method: GET
    path: "/dealers"
    description: "List dealers with filter/pagination"
    roles: [CreditManager]
    code: 200
    input: ["credit_status?", "limit?", "offset?"]
    output: Dealer[]
    side_effects: []
  - method: PATCH
    path: "/dealers/{id}"
    description: "Update credit limit; re-evaluates credit_status"
    roles: [CreditManager]
    code: 200
    input: [credit_limit_cents]
    output: Dealer
    side_effects: ["credit_limit_cents updated; Dealer.version += 1; credit_status recomputed (may flip WATCH<->SUSPENDED etc.)"]

  # --- DealerContract ---
  - method: POST
    path: "/dealer-contracts"
    description: "Create a dealer contract (DRAFT)"
    roles: [CreditManager]
    code: 201
    input: [dealer_id, terminal_id, pricing_mode, "fixed_price_mc_per_gal?", volume_committed_gal, window_start, window_end]
    output: DealerContract
    side_effects: []
  - method: GET
    path: "/dealer-contracts/{id}"
    description: "Get dealer contract (DealerUser limited to own)"
    roles: [CreditManager, DealerUser, SupplyPlanner]
    code: 200
    input: []
    output: DealerContract
    side_effects: []
  - method: GET
    path: "/dealer-contracts"
    description: "List dealer contracts (FK reverse by dealer_id / terminal_id)"
    roles: [CreditManager, DealerUser, SupplyPlanner]
    code: 200
    input: ["dealer_id?", "terminal_id?", "status?", "limit?", "offset?"]
    output: DealerContract[]
    side_effects: []
  - method: POST
    path: "/dealer-contracts/{id}/activate"
    description: "Activate a DRAFT contract (OCC on Dealer.version); supersedes overlapping ACTIVE contract at same dealer+terminal"
    roles: [CreditManager]
    code: 200
    input: [expected_dealer_version]
    output: DealerContract
    side_effects: ["status DRAFT -> ACTIVE; overlapping ACTIVE contract -> SUPERSEDED with order-cancellation cascade; Dealer.version += 1"]
  - method: POST
    path: "/dealer-contracts/{id}/cancel"
    description: "Cancel a contract; cascades to its non-terminal orders"
    roles: [CreditManager]
    code: 200
    input: []
    output: DealerContract
    side_effects: ["status -> CANCELLED; REQUESTED/ALLOCATED orders -> CANCELLED; SCHEDULED orders unscheduled then CANCELLED"]

  # --- PriceIndexPublication ---
  - method: POST
    path: "/price-index-publications"
    description: "Publish an index price (append-only)"
    roles: [PricingDesk]
    code: 201
    input: [index_name, effective_date, price_mc_per_gal]
    output: PriceIndexPublication
    side_effects: []
  - method: GET
    path: "/price-index-publications/{id}"
    description: "Get one publication"
    roles: [PricingDesk, CreditManager, SupplyPlanner, SupplyAdmin, Dispatcher, DealerUser]
    code: 200
    input: []
    output: PriceIndexPublication
    side_effects: []
  - method: GET
    path: "/price-index-publications"
    description: "List publications"
    roles: [PricingDesk, CreditManager, SupplyPlanner, SupplyAdmin, Dispatcher, DealerUser]
    code: 200
    input: ["index_name?", "effective_date?", "limit?", "offset?"]
    output: PriceIndexPublication[]
    side_effects: []
  - method: GET
    path: "/price-index-publications/resolve"
    description: "Resolve the price effective on a date: publication with greatest effective_date <= on_date for the index"
    roles: [PricingDesk, CreditManager, SupplyPlanner, SupplyAdmin, Dispatcher, DealerUser]
    code: 200
    input: [index_name, on_date]
    output: PriceIndexPublication
    side_effects: []

  # --- FreightZone ---
  - method: POST
    path: "/freight-zones"
    description: "Create a freight zone for a terminal"
    roles: [SupplyAdmin]
    code: 201
    input: [terminal_id, zone_code, one_way_drive_minutes, freight_mc_per_gal, min_freight_cents]
    output: FreightZone
    side_effects: []
  - method: GET
    path: "/freight-zones/{id}"
    description: "Get freight zone"
    roles: [SupplyAdmin, SupplyPlanner, Dispatcher, CreditManager, DealerUser]
    code: 200
    input: []
    output: FreightZone
    side_effects: []
  - method: GET
    path: "/freight-zones"
    description: "List freight zones (FK reverse by terminal_id)"
    roles: [SupplyAdmin, SupplyPlanner, Dispatcher, CreditManager, DealerUser]
    code: 200
    input: ["terminal_id?", "limit?", "offset?"]
    output: FreightZone[]
    side_effects: []

  # --- TransportTruck ---
  - method: POST
    path: "/trucks"
    description: "Create a transport truck"
    roles: [SupplyAdmin]
    code: 201
    input: [terminal_id, unit_number, capacity_gal, weekly_hours_limit_minutes]
    output: TransportTruck
    side_effects: ["status=AVAILABLE"]
  - method: GET
    path: "/trucks/{id}"
    description: "Get truck"
    roles: [SupplyAdmin, SupplyPlanner, Dispatcher]
    code: 200
    input: []
    output: TransportTruck
    side_effects: []
  - method: GET
    path: "/trucks"
    description: "List trucks (FK reverse by terminal_id)"
    roles: [SupplyAdmin, SupplyPlanner, Dispatcher]
    code: 200
    input: ["terminal_id?", "status?", "limit?", "offset?"]
    output: TransportTruck[]
    side_effects: []
  - method: POST
    path: "/trucks/{id}/transition"
    description: "Set truck status AVAILABLE <-> OUT_OF_SERVICE; OUT_OF_SERVICE unschedules its SCHEDULED orders"
    roles: [SupplyAdmin, Dispatcher]
    code: 200
    input: [to_state]
    output: TransportTruck
    side_effects: ["On OUT_OF_SERVICE: its SCHEDULED orders -> ALLOCATED (truck_id/est_trip_minutes cleared, hours released)"]

  # --- DeliveryOrder ---
  - method: POST
    path: "/delivery-orders"
    description: "Dealer creates a delivery order; dealer_id taken from X-User-ID. NORMAL terminal: direct ALLOCATED with ATP check. CURTAILED terminal: lands REQUESTED (no ATP check at creation)."
    roles: [DealerUser]
    code: 201
    input: ["dealer_contract_id?", terminal_id, freight_zone_id, requested_gal]
    output: DeliveryOrder
    side_effects:
      - "pricing_mode snapshot (SPOT iff no dealer_contract_id)"
      - "NORMAL posture: fulfillment_status = ALLOCATED, allocated_gal = requested_gal (requires requested_gal <= ATP else ERR_INSUFFICIENT_SUPPLY), provisional_total_cents stamped (provisional variant)"
      - "CURTAILED posture: fulfillment_status = REQUESTED, allocated_gal = null, provisional_total_cents stays null until first allocation"
      - "credit gate runs at creation in both postures (transient provisional computed for the gate even when the order lands REQUESTED): committed_before + provisional > credit_limit -> ERR_CREDIT_LIMIT_EXCEEDED; SUSPENDED dealer -> ERR_DEALER_SUSPENDED"
  - method: GET
    path: "/delivery-orders/{id}"
    description: "Get delivery order (DealerUser limited to own)"
    roles: [DealerUser, CreditManager, Dispatcher, SupplyPlanner, SupplyAdmin]
    code: 200
    input: []
    output: DeliveryOrder
    side_effects: []
  - method: GET
    path: "/delivery-orders"
    description: "List delivery orders (FK reverse by dealer_id / terminal_id / dealer_contract_id / truck_id / freight_zone_id)"
    roles: [DealerUser, CreditManager, Dispatcher, SupplyPlanner, SupplyAdmin]
    code: 200
    input: ["dealer_id?", "terminal_id?", "dealer_contract_id?", "truck_id?", "freight_zone_id?", "fulfillment_status?", "invoice_status?", "limit?", "offset?"]
    output: DeliveryOrder[]
    side_effects: []
  - method: POST
    path: "/delivery-orders/{id}/schedule"
    description: "Schedule an ALLOCATED order onto a truck and rack window"
    roles: [Dispatcher]
    code: 200
    input: [truck_id, planned_load_start, planned_load_end]
    output: DeliveryOrder
    side_effects: ["fulfillment_status ALLOCATED -> SCHEDULED; truck_id set; est_trip_minutes computed"]
  - method: POST
    path: "/delivery-orders/{id}/unschedule"
    description: "Unschedule a SCHEDULED order back to ALLOCATED"
    roles: [Dispatcher]
    code: 200
    input: []
    output: DeliveryOrder
    side_effects: ["fulfillment_status SCHEDULED -> ALLOCATED; truck_id/est_trip_minutes cleared; hours + windows released"]
  - method: POST
    path: "/delivery-orders/{id}/load"
    description: "Load a SCHEDULED order at the rack: final pricing, terminal draw, contract band draw"
    roles: [Dispatcher]
    code: 200
    input: []
    output: DeliveryOrder
    side_effects: ["fulfillment_status -> LOADED; final_total_cents stamped; Terminal.on_hand_gal -= allocated_gal (Terminal.version += 1); contract volume_drawn_gal += in_band_gal"]
  - method: POST
    path: "/delivery-orders/{id}/deliver"
    description: "Deliver a LOADED order: opens the invoice"
    roles: [Dispatcher]
    code: 200
    input: []
    output: DeliveryOrder
    side_effects: ["fulfillment_status -> DELIVERED; invoice_status -> OPEN; open_balance_cents = final_total_cents; invoiced_at = now"]
  - method: POST
    path: "/delivery-orders/{id}/cancel"
    description: "Cancel a pre-LOADED order (DealerUser own only)"
    roles: [DealerUser, Dispatcher]
    code: 200
    input: []
    output: DeliveryOrder
    side_effects: ["fulfillment_status -> CANCELLED; SCHEDULED orders unscheduled first; reserved released; invoice_status NOT_READY -> VOID"]

  # --- ColdSnapEvent ---
  - method: POST
    path: "/cold-snap-events"
    description: "Declare a cold-snap event (DECLARED)"
    roles: [SupplyPlanner]
    code: 201
    input: [terminal_id, severity, start_date, end_date]
    output: ColdSnapEvent
    side_effects: []
  - method: GET
    path: "/cold-snap-events/{id}"
    description: "Get cold-snap event"
    roles: [SupplyPlanner, SupplyAdmin, Dispatcher, CreditManager, DealerUser]
    code: 200
    input: []
    output: ColdSnapEvent
    side_effects: []
  - method: GET
    path: "/cold-snap-events"
    description: "List cold-snap events (FK reverse by terminal_id)"
    roles: [SupplyPlanner, SupplyAdmin, Dispatcher, CreditManager, DealerUser]
    code: 200
    input: ["terminal_id?", "status?", "limit?", "offset?"]
    output: ColdSnapEvent[]
    side_effects: []
  - method: POST
    path: "/cold-snap-events/{id}/activate"
    description: "Activate a DECLARED cold snap: curtails the terminal"
    roles: [SupplyPlanner]
    code: 200
    input: []
    output: ColdSnapEvent
    side_effects: ["status -> ACTIVE; Terminal NORMAL -> CURTAILED with provisional repricing + credit recompute cascade"]
  - method: POST
    path: "/cold-snap-events/{id}/lift"
    description: "Lift an ACTIVE cold snap: restores the terminal and requeues SHORTED orders"
    roles: [SupplyPlanner]
    code: 200
    input: []
    output: ColdSnapEvent
    side_effects: ["status -> LIFTED; Terminal CURTAILED -> NORMAL; SHORTED -> REQUESTED; FIFO auto-allocation while ATP lasts"]

  # --- AllocationRun ---
  - method: POST
    path: "/allocation-runs"
    description: "Create an allocation run for a terminal (OCC on Terminal.version); supersedes the terminal's existing OPEN/COMPUTED run"
    roles: [SupplyPlanner]
    code: 201
    input: [terminal_id, expected_terminal_version]
    output: AllocationRun
    side_effects: ["prior OPEN/COMPUTED run on this terminal -> SUPERSEDED; Terminal.version += 1; run_index = next per-terminal index"]
  - method: GET
    path: "/allocation-runs/{id}"
    description: "Get allocation run incl. results"
    roles: [SupplyPlanner, SupplyAdmin]
    code: 200
    input: []
    output: AllocationRun
    side_effects: []
  - method: GET
    path: "/allocation-runs"
    description: "List allocation runs (FK reverse by terminal_id)"
    roles: [SupplyPlanner, SupplyAdmin]
    code: 200
    input: ["terminal_id?", "status?", "limit?", "offset?"]
    output: AllocationRun[]
    side_effects: []
  - method: POST
    path: "/allocation-runs/{id}/compute"
    description: "Compute the pro-rata waterfall over eligible REQUESTED orders (terminal must be CURTAILED)"
    roles: [SupplyPlanner]
    code: 200
    input: []
    output: AllocationRun
    side_effects: ["status OPEN -> COMPUTED; pool_gal snapshot; results populated via allocation_pro_rata_waterfall"]
  - method: POST
    path: "/allocation-runs/{id}/ratify"
    description: "Ratify a COMPUTED run: applies allocations to orders"
    roles: [SupplyPlanner]
    code: 200
    input: []
    output: AllocationRun
    side_effects: ["status COMPUTED -> RATIFIED; each result order: REQUESTED -> ALLOCATED (allocated_gal = share, provisional stamped) or -> SHORTED (allocated_gal = 0)"]

  # --- DealerPayment ---
  - method: POST
    path: "/dealer-payments"
    description: "Post a dealer payment; FIFO-applied to OPEN invoices"
    roles: [CreditManager]
    code: 201
    input: [dealer_id, amount_cents, method]
    output: DealerPayment
    side_effects: ["fifo_payment_application; invoice_status OPEN -> PAID where balances zero; credit_status recomputed"]
  - method: GET
    path: "/dealer-payments/{id}"
    description: "Get payment (DealerUser limited to own)"
    roles: [CreditManager, DealerUser]
    code: 200
    input: []
    output: DealerPayment
    side_effects: []
  - method: GET
    path: "/dealer-payments"
    description: "List payments (FK reverse by dealer_id)"
    roles: [CreditManager, DealerUser]
    code: 200
    input: ["dealer_id?", "status?", "limit?", "offset?"]
    output: DealerPayment[]
    side_effects: []
  - method: POST
    path: "/dealer-payments/{id}/return"
    description: "Return (NSF) a POSTED payment: reverses applications, posts NSF fee"
    roles: [CreditManager]
    code: 200
    input: []
    output: DealerPayment
    side_effects: ["status POSTED -> RETURNED; applications reversed in reverse order (PAID -> OPEN); Dealer.fee_balance_cents += NSF_FEE_CENTS (Dealer.version += 1); credit_status recomputed"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID; entity_backed role id does not resolve" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted on this endpoint" }
  - { id: ERR_DEALER_MISMATCH, http: 403, condition: "DealerUser acting on a resource whose dealer_id != X-User-ID" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id does not exist" }
  - { id: ERR_REFERENCED_NOT_FOUND, http: 422, condition: "Body foreign key does not resolve to an existing entity" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed request: missing required field, wrong type, invalid enum member" }
  - { id: ERR_STALE_TERMINAL_VERSION, http: 412, condition: "expected_terminal_version != Terminal.version on POST /allocation-runs" }
  - { id: ERR_STALE_DEALER_VERSION, http: 412, condition: "expected_dealer_version != Dealer.version on POST /dealer-contracts/{id}/activate" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity not in a valid from-state for the requested transition (incl. rail to_state jumps, run ordering, payment already returned is ERR_PAYMENT_ALREADY_RETURNED instead)" }
  - { id: ERR_CONTRACT_NOT_ACTIVE, http: 409, condition: "Referenced DealerContract not ACTIVE at order create/schedule, or SupplyContract not ACTIVE at rail unload" }
  - { id: ERR_DEALER_SUSPENDED, http: 409, condition: "Dealer credit_status == SUSPENDED at order creation or contract activation" }
  - { id: ERR_TRUCK_NOT_AVAILABLE, http: 409, condition: "Truck status != AVAILABLE at schedule" }
  - { id: ERR_TERMINAL_NOT_CURTAILED, http: 409, condition: "Allocation compute requires terminal allocation_posture == CURTAILED" }
  - { id: ERR_COLD_SNAP_ALREADY_ACTIVE, http: 409, condition: "Another ColdSnapEvent on this terminal is already ACTIVE" }
  - { id: ERR_RUN_NOT_COMPUTED, http: 409, condition: "Ratify attempted on a run not in COMPUTED" }
  - { id: ERR_PAYMENT_ALREADY_RETURNED, http: 409, condition: "Return attempted on a non-POSTED payment" }
  - { id: ERR_DRIVER_HOURS_EXCEEDED, http: 422, condition: "Truck weekly committed minutes + candidate est_trip_minutes > weekly_hours_limit_minutes" }
  - { id: ERR_RESERVE_FLOOR_BREACH, http: 422, condition: "Load would leave terminal on_hand_gal below the effective reserve floor (season-dependent)" }
  - { id: ERR_TRUCK_CAPACITY_EXCEEDED, http: 422, condition: "allocated_gal > truck.capacity_gal at schedule" }
  - { id: ERR_TRUCK_TERMINAL_MISMATCH, http: 422, condition: "Truck home terminal != order terminal" }
  - { id: ERR_ZONE_TERMINAL_MISMATCH, http: 422, condition: "Freight zone does not belong to the order's terminal" }
  - { id: ERR_CONTRACT_TERMINAL_MISMATCH, http: 422, condition: "DealerContract terminal != order terminal" }
  - { id: ERR_CONTRACT_DEALER_MISMATCH, http: 422, condition: "DealerContract belongs to a different dealer than the caller" }
  - { id: ERR_TRUCK_SCHEDULE_CONFLICT, http: 409, condition: "Buffered window overlap with another order on the same truck" }
  - { id: ERR_RACK_CAPACITY_EXCEEDED, http: 422, condition: "Raw-window overlapping SCHEDULED/LOADED orders >= terminal.rack_bay_count" }
  - { id: ERR_WINDOW_INVALID, http: 400, condition: "planned_load_end <= planned_load_start, or contract/receipt window end < start" }
  - { id: ERR_OUTSIDE_CONTRACT_WINDOW, http: 422, condition: "date(planned_load_start) outside the contract window, or creation date outside the contract window" }
  - { id: ERR_SHIPMENT_WINDOW_VIOLATION, http: 422, condition: "scheduled_arrival_date outside the supply contract receipt window" }
  - { id: ERR_DUPLICATE_ZONE_CODE, http: 409, condition: "zone_code already exists on this terminal" }
  - { id: ERR_DUPLICATE_TRUCK_UNIT, http: 409, condition: "unit_number already exists on this terminal" }
  - { id: ERR_DUPLICATE_INDEX_PUBLICATION, http: 409, condition: "(index_name, effective_date) already published" }
  - { id: ERR_VOLUME_INVALID, http: 400, condition: "requested_gal or volume_gal not a positive integer >= 1000 (orders) / > 0 (shipments)" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 402, condition: "committed_before + provisional_total_cents > credit_limit_cents at order creation" }
  - { id: ERR_OVERPAYMENT, http: 422, condition: "Payment amount_cents exceeds the dealer's total open invoice balance" }
  - { id: ERR_NO_INDEX_PUBLISHED, http: 422, condition: "No index publication with effective_date <= ref_date when an index-exposed gallon exists (SPOT order, INDEX contract band, or FIXED overage gallons)" }
  - { id: ERR_INSUFFICIENT_SUPPLY, http: 422, condition: "NORMAL-posture creation with requested_gal > available_to_promise_gal" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SupplyAdmin
    description: "Owns physical infrastructure: terminals, freight zones, trucks, upstream supply contracts and rail shipments"
    identity: opaque
    exclusive_operations: ["POST /terminals", "POST /freight-zones", "POST /trucks", "POST /supply-contracts", "POST /supply-contracts/{id}/activate", "POST /supply-contracts/{id}/cancel", "POST /rail-shipments", "POST /rail-shipments/{id}/transition"]
    shared_operations: ["POST /trucks/{id}/transition", "GET reads on terminals, supply contracts, rail shipments, zones, trucks, price publications, cold-snaps, allocation runs, delivery orders"]
  - name: SupplyPlanner
    description: "Owns scarcity: cold-snap events and allocation runs"
    identity: opaque
    exclusive_operations: ["POST /cold-snap-events", "POST /cold-snap-events/{id}/activate", "POST /cold-snap-events/{id}/lift", "POST /allocation-runs", "POST /allocation-runs/{id}/compute", "POST /allocation-runs/{id}/ratify"]
    shared_operations: ["GET reads on terminals, inventory summary, orders, contracts, cold-snaps, allocation runs"]
  - name: PricingDesk
    description: "Publishes price index values; cannot touch orders, credit, or logistics (segregation of commercial pricing from order flow)"
    identity: opaque
    exclusive_operations: ["POST /price-index-publications"]
    shared_operations: ["GET reads on price publications"]
  - name: CreditManager
    description: "Owns dealer master data, dealer contracts, payments and returns"
    identity: opaque
    exclusive_operations: ["POST /dealers", "PATCH /dealers/{id}", "POST /dealer-contracts", "POST /dealer-contracts/{id}/activate", "POST /dealer-contracts/{id}/cancel", "POST /dealer-payments", "POST /dealer-payments/{id}/return"]
    shared_operations: ["GET reads on dealers, contracts, payments, orders, terminals"]
  - name: Dispatcher
    description: "Owns logistics execution: scheduling, loading, delivery, truck status; cannot create orders or move money"
    identity: opaque
    exclusive_operations: ["POST /delivery-orders/{id}/schedule", "POST /delivery-orders/{id}/unschedule", "POST /delivery-orders/{id}/load", "POST /delivery-orders/{id}/deliver"]
    shared_operations: ["POST /delivery-orders/{id}/cancel", "POST /trucks/{id}/transition", "GET reads on orders, trucks, terminals, zones"]
  - name: DealerUser
    description: "A dealer acting as itself; X-User-ID is the Dealer.id"
    identity: "entity_backed:Dealer"
    exclusive_operations: ["POST /delivery-orders"]
    shared_operations: ["POST /delivery-orders/{id}/cancel (own orders only)", "GET reads on own orders, own contracts, own payments, own dealer record, price publications, zones, cold-snaps"]
  - name: SystemAdmin
    description: "Operates the logical clock and the daily ops epoch"
    identity: opaque
    exclusive_operations: ["POST /_clock/set_current_utc", "POST /ops/run_epoch"]
    shared_operations: ["GET reads on terminals"]
