              as: SupportAgent
              captures: { center_zero_slot: "$.data[0].open_ticket_count" }
            - call: "POST /warranty-claims"
              payload: { warranty_plan_id: "${plan_c_id}", reported_fault: "Tuner slips under tension", service_center_id: "${center_two_id}" }
              as: SupportAgent
              captures: { claim_second_id: $.data.id }
            - call: "POST /warranty-claims/${claim_second_id}/route"
              payload: {}
              as: SupportAgent
              captures: { second_route_status: $.data.status }
          assert:
            - "closing the first claim frees the aggregate slot: ServiceCenter.${center_two_id}.open_ticket_count == 0 after the close"
            - "the next claim routes successfully: WarrantyClaim.${claim_second_id}.status == ROUTED even though an earlier claim occupied the same center"
            - "the capacity test is a running count against capacity_slots == 2 rather than any pairwise interval comparison over claim lifetimes"
            - "the close call retains WarrantyPlan.${plan_c_id}.status == ACTIVE with remaining_repair_rounds == 2"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: gear_exchange_restocking_fee_offsets_refund_credit
        grounds:
          - calculations.gear_exchange_restocking_fee
          - state_machines.GearExchange.RETURN_REQUESTED_to_EXCHANGED
          - entities.Customer.fields.lifetime_gear_credit_cents
          - entities.GearExchange.fields.refund_credit_cents
        distinguishing_aspect: "A conserved money quantity: the customer's credited gear total plus the retained restocking fee must equal the traded line value after the exchange completes, so a forward complete paired with its fee offset leaves the named quantity lifetime_gear_credit_cents + restocking_fee_cents invariant."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-24T00:00:00Z. A STUDIO customer with an ACTIVE assignment, a 50000-cent line, and a TONE_MISMATCH exchange in TRIAL_ACTIVE with a 2500-cent final restocking fee."
          setup_api_calls:
            - *clock
            - *mk_eng
            - call: "POST /customers"
              payload: { full_name: "Ira Stone", email: "ira.stone@example.com", home_state: "NY", account_tier: "STUDIO" }
              as: Anonymous
              captures: { cust_inv_id: $.data.id, cust_inv_v: $.data.version }
            - call: "POST /assignments"
              payload: { customer_id: "${cust_inv_id}", engineer_id: "${eng_a_id}", reason_code: "NEW_ACCOUNT", expected_customer_version: "${cust_inv_v}" }
              as: SalesEngineerOps
              captures: { asg_inv_id: $.data.id }
            - call: "POST /assignments/${asg_inv_id}/accept"
              payload: {}
              as: Engineer
              as_user_id: "${eng_a_id}"
            - call: "POST /products"
              payload: { product_code: "SW-GTR-500", display_name: "Boutique Guitar 500", product_family: "GUITAR", unit_price_cents: 50000 }
              as: PlatformAdmin
            - call: "POST /quotes"
              payload: { customer_id: "${cust_inv_id}", engineer_id: "${eng_a_id}", package_type: "INSTRUMENT_ONLY" }
              as: Engineer
              as_user_id: "${eng_a_id}"
              captures: { quote_inv_id: $.data.id }
            - call: "POST /quotes/${quote_inv_id}/lines"
              payload: { product_code: "SW-GTR-500", quantity: 1, is_anchor: true }
              as: Engineer
              as_user_id: "${eng_a_id}"
              captures: { qline_inv_id: $.data.id }
            - call: "POST /gear-exchanges"
              payload: { quote_line_id: "${qline_inv_id}", customer_id: "${cust_inv_id}", reason: "TONE_MISMATCH" }
              as: SupportAgent
              captures: { gex_inv_id: $.data.id }
            - call: "POST /gear-exchanges/${gex_inv_id}/start-trial"
              payload: {}
              as: SupportAgent
            - call: "POST /gear-exchanges/${gex_inv_id}/request-return"
              payload: {}
              as: SupportAgent
              captures: { gex_inv_fee: $.data.restocking_fee_cents }
          trigger:
            - call: "POST /gear-exchanges/${gex_inv_id}/complete"
              payload: {}
              as: SupportAgent
              captures: { gex_inv_refund: $.data.refund_credit_cents, gex_inv_status: $.data.status }
            - call: "GET /customers/${cust_inv_id}"
              payload: {}
              as: SupportAgent
              captures: { cust_inv_credit_after: $.data.lifetime_gear_credit_cents }
          assert:
            - "GearExchange.${gex_inv_id}.restocking_fee_cents == 2500 (50000 * (2500 TONE_MISMATCH - 1000 STUDIO) / 10000)"
            - "GearExchange.${gex_inv_id}.refund_credit_cents == 47500"
            - "Customer.${cust_inv_id}.lifetime_gear_credit_cents == 50000, so credited refund (47500) + retained fee (2500) reconciles exactly to the traded line value"
            - "the conserved quantity lifetime_gear_credit_cents + restocking_fee_cents is unchanged at 50000 across the complete call"
            - "GearExchange.${gex_inv_id}.status == EXCHANGED"

      - name: assignment_book_and_customer_slot_counters_reconcile
        grounds:
          - state_machines.Assignment.PENDING_ACCEPT_to_ACTIVE
          - state_machines.Customer.ACTIVE_to_PENDING
          - entities.Engineer.fields.active_book_size
          - entities.Customer.fields.assigned_engineer_id
        distinguishing_aspect: "A second, different conserved quantity — an integer occupancy count rather than money: the sum of all engineers' active_book_size must stay equal to the number of ACTIVE Assignment rows across every forward activation and compensating end or suspend, with the customer slot mirror kept in step."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-25T00:00:00Z. One engineer with two customers, both holding ACTIVE assignments."
          setup_api_calls:
            - *clock
            - *mk_eng
            - *mk_cust
            - call: "POST /assignments"
              payload: { customer_id: "${cust_a_id}", engineer_id: "${eng_a_id}", reason_code: "NEW_ACCOUNT", expected_customer_version: "${cust_a_v}" }
              as: SalesEngineerOps
              captures: { asg_x_id: $.data.id }
            - call: "POST /assignments/${asg_x_id}/accept"
              payload: {}
              as: Engineer
              as_user_id: "${eng_a_id}"
            - call: "POST /customers"
              payload: { full_name: "Ken Ives", email: "ken.ives@example.com", home_state: "OH" }
              as: Anonymous
              captures: { cust_k_id: $.data.id, cust_k_v: $.data.version }
            - call: "POST /assignments"
              payload: { customer_id: "${cust_k_id}", engineer_id: "${eng_a_id}", reason_code: "NEW_ACCOUNT", expected_customer_version: "${cust_k_v}" }
              as: SalesEngineerOps
              captures: { asg_y_id: $.data.id }
            - call: "POST /assignments/${asg_y_id}/accept"
              payload: {}
              as: Engineer
              as_user_id: "${eng_a_id}"
          trigger:
            - call: "POST /assignments/${asg_y_id}/end"
              payload: {}
              as: SalesEngineerOps
            - call: "POST /customers/${cust_a_id}/activate"
              payload: {}
              as: SalesEngineerOps
            - call: "POST /customers/${cust_a_id}/suspend"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Engineer.${eng_a_id}.active_book_size == 2 after both accepts, equal to the count of ACTIVE Assignment rows for that engineer"
            - "Engineer.${eng_a_id}.active_book_size == 1 after ending one assignment, with Customer.${cust_k_id}.assigned_engineer_id null"
            - "after suspending Customer.${cust_a_id} the engineer's active_book_size == 0 and Customer.${cust_a_id}.assigned_engineer_id is null"
            - "the conserved occupancy quantity sum(Engineer.active_book_size) equals count(Assignment.status == ACTIVE) after every step, ending at 0 with no drift"
            - "Assignment.${asg_x_id}.status == ENDED and Assignment.${asg_y_id}.status == ENDED"