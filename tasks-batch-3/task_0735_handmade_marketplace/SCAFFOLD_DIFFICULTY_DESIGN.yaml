  # =========================================================================
  # Rule 5 — validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: order_create_state_beats_vacation_constraint
        grounds:
          - validations[priority=9]
          - validations[priority=10]
          - errors[ERR_LISTING_NOT_PURCHASABLE]
        distinguishing_aspect: |
          Pair {state, business_constraint}: a DRAFT/INACTIVE listing (state, prio 9) and a
          VACATION shop (business_constraint, prio 10) both fail; the state check wins ->
          ERR_LISTING_NOT_PURCHASABLE (not ERR_SHOP_ON_VACATION).
        test_recipe:
          setup:
            - "Shop with a published-then-deactivated listing (INACTIVE), then shop set to VACATION."
          setup_api_calls:
            - call: "POST /seller/shops"
              payload: { owner_seller_id: "seller_1", name: "Handmade Co" }
              as: PlatformAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /seller/shipping-profiles"
              payload: { shop_id: "${shop_id}", name: "US", base_cost_cents: 0, per_item_cost_cents: 0 }
              as: Seller
              as_user_id: "${shop_id}"
              captures: { sp_id: $.data.id }
            - call: "POST /seller/listings"
              payload: { shop_id: "${shop_id}", shipping_profile_id: "${sp_id}", title: "Tote", fulfillment_type: "READY_TO_SHIP", processing_time_days: 1, price_cents: 2000, quantity: 5 }
              as: Seller
              as_user_id: "${shop_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /seller/listings/${listing_id}/publish"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
            - call: "POST /seller/listings/${listing_id}/deactivate"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
            - call: "POST /seller/shops/${shop_id}/enable-vacation"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
          trigger:
            - call: "POST /seller/orders"
              payload: { shop_id: "${shop_id}", listing_id: "${listing_id}", quantity: 1 }
              as: Buyer
              as_user_id: "buyer_1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_LISTING_NOT_PURCHASABLE"
            - "response error_id != ERR_SHOP_ON_VACATION"

      - name: order_pay_vacation_constraint_beats_inventory_fiscal
        grounds:
          - validations[priority=10]
          - validations[priority=20]
          - errors[ERR_SHOP_ON_VACATION]
        distinguishing_aspect: |
          Pair {business_constraint, business_fiscal}: at pay, VACATION shop (business_constraint,
          prio 10) and insufficient inventory (business_fiscal, prio 20) both fail; the
          business_constraint check wins -> ERR_SHOP_ON_VACATION (not ERR_INSUFFICIENT_INVENTORY).
        test_recipe:
          setup:
            - "Shop ACTIVE; READY_TO_SHIP listing quantity 1 published; order for quantity 5 placed while ACTIVE; then shop set to VACATION."
          setup_api_calls:
            - call: "POST /seller/shops"
              payload: { owner_seller_id: "seller_1", name: "Handmade Co" }
              as: PlatformAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /seller/shipping-profiles"
              payload: { shop_id: "${shop_id}", name: "US", base_cost_cents: 0, per_item_cost_cents: 0 }
              as: Seller
              as_user_id: "${shop_id}"
              captures: { sp_id: $.data.id }
            - call: "POST /seller/listings"
              payload: { shop_id: "${shop_id}", shipping_profile_id: "${sp_id}", title: "Hat", fulfillment_type: "READY_TO_SHIP", processing_time_days: 1, price_cents: 2000, quantity: 1 }
              as: Seller
              as_user_id: "${shop_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /seller/listings/${listing_id}/publish"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
            - call: "POST /seller/orders"
              payload: { shop_id: "${shop_id}", listing_id: "${listing_id}", quantity: 5 }
              as: Buyer
              as_user_id: "buyer_1"
              captures: { order_id: $.data.id }
            - call: "POST /seller/shops/${shop_id}/enable-vacation"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
          trigger:
            - call: "POST /seller/orders/${order_id}/pay"
              payload: {}
              as: Buyer
              as_user_id: "buyer_1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_SHOP_ON_VACATION"
            - "response error_id != ERR_INSUFFICIENT_INVENTORY"

  # =========================================================================
  # Rule 6 — boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: free_shipping_threshold_ge_boundary
        grounds:
          - calculations.order_shipping_cost
          - entities.ShippingProfile.fields.free_shipping_threshold_cents
          - entities.Order.fields.shipping_cents
        distinguishing_aspect: |
          Money-threshold >= boundary on POST /seller/orders: item_subtotal exactly equal to
          free_shipping_threshold_cents (6000==6000) ships free (0); one unit below (subtotal
          3000) is charged 500.
        test_recipe:
          setup:
            - "Shop ACTIVE; ShippingProfile base 500, per_item 150, free_shipping_threshold_cents=6000; listing price 3000 published."
          setup_api_calls:
            - call: "POST /seller/shops"
              payload: { owner_seller_id: "seller_1", name: "Handmade Co" }
              as: PlatformAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /seller/shipping-profiles"
              payload: { shop_id: "${shop_id}", name: "US", base_cost_cents: 500, per_item_cost_cents: 150, free_shipping_threshold_cents: 6000 }
              as: Seller
              as_user_id: "${shop_id}"
              captures: { sp_id: $.data.id }
            - call: "POST /seller/listings"
              payload: { shop_id: "${shop_id}", shipping_profile_id: "${sp_id}", title: "Vase", fulfillment_type: "READY_TO_SHIP", processing_time_days: 1, price_cents: 3000, quantity: 10 }
              as: Seller
              as_user_id: "${shop_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /seller/listings/${listing_id}/publish"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
          trigger:
            - call: "POST /seller/orders"
              payload: { shop_id: "${shop_id}", listing_id: "${listing_id}", quantity: 2 }
              as: Buyer
              as_user_id: "buyer_1"
              captures: { order_at: $.data.id, ship_at: $.data.shipping_cents, sub_at: $.data.item_subtotal_cents }
            - call: "POST /seller/orders"
              payload: { shop_id: "${shop_id}", listing_id: "${listing_id}", quantity: 1 }
              as: Buyer
              as_user_id: "buyer_1"
              captures: { order_below: $.data.id, ship_below: $.data.shipping_cents, sub_below: $.data.item_subtotal_cents }
          assert:
            - "Order.${order_at}.item_subtotal_cents == 6000"
            - "Order.${order_at}.shipping_cents == 0"
            - "Order.${order_below}.item_subtotal_cents == 3000"
            - "Order.${order_below}.shipping_cents == 500"

      - name: material_low_stock_at_reorder_threshold
        grounds:
          - calculations.material_stock_status
          - entities.Material.fields.reorder_threshold
          - entities.Material.fields.status
        distinguishing_aspect: |
          Integer-count <= boundary on POST /seller/materials (a different metric and endpoint
          than the money threshold): stock_qty == reorder_threshold (5==5) yields LOW_STOCK,
          while stock_qty one above (6) yields IN_STOCK.
        test_recipe:
          setup:
            - "Shop ACTIVE."
          setup_api_calls:
            - call: "POST /seller/shops"
              payload: { owner_seller_id: "seller_1", name: "Handmade Co" }
              as: PlatformAdmin
              captures: { shop_id: $.data.id }
          trigger:
            - call: "POST /seller/materials"
              payload: { shop_id: "${shop_id}", name: "Clay", stock_qty: 5, reorder_threshold: 5 }
              as: Seller
              as_user_id: "${shop_id}"
              captures: { mat_at: $.data.id, status_at: $.data.status }
            - call: "POST /seller/materials"
              payload: { shop_id: "${shop_id}", name: "Glaze", stock_qty: 6, reorder_threshold: 5 }
              as: Seller
              as_user_id: "${shop_id}"
              captures: { mat_above: $.data.id, status_above: $.data.status }
          assert:
            - "Material.${mat_at}.status == LOW_STOCK"
            - "Material.${mat_above}.status == IN_STOCK"

  # =========================================================================
  # Rule 7 — cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: order_create_requires_listing_active
        grounds:
          - validations[priority=9]
          - entities.Listing.fields.status
          - errors[ERR_LISTING_NOT_PURCHASABLE]
        distinguishing_aspect: |
