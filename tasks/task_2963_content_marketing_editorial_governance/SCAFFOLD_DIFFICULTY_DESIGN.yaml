      - name: sweep_asset_expiry_cascades_usage_distribution_item_and_posture
        grounds:
          - state_machines.Asset.LICENSED_to_EXPIRED
          - state_machines.Distribution.SCHEDULED_to_SUPPRESSED
          - state_machines.ContentItem.PUBLISHED_to_NEEDS_REFRESH
          - calculations.asset_license_status
          - calculations.campaign_governance_posture
          - entities.Campaign.fields.expired_usage_count
          - entities.Distribution.fields.suppression_reason
