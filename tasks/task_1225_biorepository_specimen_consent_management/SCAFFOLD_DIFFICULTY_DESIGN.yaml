  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: consent_withdrawal_cascade_depth4
        grounds:
          - state_machines.ConsentRecord.WITHDRAWAL_PENDING_to_WITHDRAWN
          - state_machines.SampleRequest.APPROVED_to_COMPROMISED
          - calculations.withdrawal_grace_deadline
        distinguishing_aspect: |
          Cascade of depth >= 3 triggered by the withdrawal-finalization sweep:
          ConsentRecord -> WITHDRAWN causes Specimen -> DESTRUCTION_PENDING
          (link 1), which causes Aliquot -> DESTRUCTION_PENDING (link 2), which
          itself causes the reserving SampleRequest -> COMPROMISED and the
          SharingAgreement reserved/remaining rebalance (link 3), plus a
          DestructionOrder auto-creation per specimen.
        test_recipe:
          setup:
            - "Full fulfillment state: specimen SP (100ml) with aliquot AL 40ml RESERVED by APPROVED request RQ; agreement AG reserved 40.0 / remaining 960.0"
            - "Consent withdrawn at default clock 2026-05-01T00:00:00Z (grace_deadline 2026-05-04T00:00:00Z), then clock advanced to the deadline"
          setup_api_calls:
            - { call: "POST /biobank/donors", payload: { donor_reference_code: "D-TC1" }, as: ConsentCoordinator, captures: { d_id: "$.data.id" } }
            - { call: "POST /biobank/donors/${d_id}/consent-records", payload: { permitted_uses: ["GENERAL_RESEARCH"], effective_from: "2026-05-01T00:00:00Z" }, as: ConsentCoordinator, captures: { c_id: "$.data.id" } }
            - { call: "POST /biobank/collection-kits", payload: { kit_type: "BLOOD", expires_at: "2027-01-01T00:00:00Z" }, as: ConsentCoordinator, captures: { k_id: "$.data.id" } }
            - { call: "POST /biobank/collection-kits/${k_id}/distribute", payload: { donor_id: "${d_id}" }, as: ConsentCoordinator }
            - { call: "POST /biobank/collection-kits/${k_id}/receive-return", payload: {}, as: ConsentCoordinator }
            - { call: "POST /biobank/storage-units", payload: { unit_code: "FRZ-TC1", setpoint_c: -80.0 }, as: BiobankAdmin, captures: { u_id: "$.data.id" } }
            - { call: "POST /biobank/storage-units/${u_id}/slots", payload: { slot_code: "A1", capacity_ml: 500 }, as: BiobankAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /biobank/specimens", payload: { donor_id: "${d_id}", kit_id: "${k_id}", consent_record_id: "${c_id}", specimen_type: "BLOOD", initial_volume_ml: 100.0, collected_at: "2026-05-02T00:00:00Z", storage_slot_id: "${s_id}" }, as: LabTechnician, captures: { sp_id: "$.data.id", sp_v: "$.data.version" } }
            - { call: "POST /biobank/specimens/${sp_id}/aliquots", payload: { initial_volume_ml: 40.0, expected_specimen_version: "${sp_v}", storage_slot_id: "${s_id}" }, as: LabTechnician, captures: { a_id: "$.data.id" } }
            - { call: "POST /biobank/sharing-agreements", payload: { recipient_institution: "Uni W", scope_uses: ["GENERAL_RESEARCH"], total_committed_volume_ml: 1000.0, effective_from: "2026-04-01T00:00:00Z", effective_to: "2027-04-01T00:00:00Z" }, as: BiobankAdmin, captures: { ag_id: "$.data.id" } }
            - { call: "POST /biobank/sharing-agreements/${ag_id}/activate", payload: {}, as: BiobankAdmin }
            - { call: "POST /biobank/sample-requests", payload: { title: "RQ-TC1", required_uses: ["GENERAL_RESEARCH"], specimen_type: "BLOOD", volume_needed_ml: 40.0, sharing_agreement_id: "${ag_id}" }, as: Researcher, as_user_id: "researcher-1", captures: { rq_id: "$.data.id" } }
            - { call: "POST /biobank/sample-requests/${rq_id}/submit", payload: {}, as: Researcher, as_user_id: "researcher-1" }
            - { call: "POST /biobank/sample-requests/${rq_id}/votes", payload: { decision: "APPROVE", rationale: "committee approval rationale one" }, as: CommitteeReviewer, as_user_id: "rev-1" }
            - { call: "POST /biobank/sample-requests/${rq_id}/votes", payload: { decision: "APPROVE", rationale: "committee approval rationale two" }, as: CommitteeReviewer, as_user_id: "rev-2" }
            - { call: "POST /biobank/sample-requests/${rq_id}/votes", payload: { decision: "APPROVE", rationale: "committee approval rationale three" }, as: CommitteeReviewer, as_user_id: "rev-3" }
            - { call: "POST /biobank/sample-requests/${rq_id}/fulfill", payload: {}, as: BiobankAdmin }
            - { call: "POST /biobank/consent-records/${c_id}/withdraw", payload: {}, as: ConsentCoordinator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-04T00:00:00Z" }, as: BiobankAdmin }
          trigger:
            - { call: "POST /biobank/sweeps/process-due", payload: {}, as: BiobankAdmin, captures: { n_wd: "$.data.withdrawals_finalized" } }
          assert:
            - "Sweep response: data.withdrawals_finalized == 1 (deadline is inclusive)"
            - "GET /biobank/consent-records/${c_id} -> status == WITHDRAWN"
            - "GET /biobank/specimens/${sp_id} -> lifecycle_status == DESTRUCTION_PENDING"
            - "GET /biobank/aliquots/${a_id} -> status == DESTRUCTION_PENDING"
            - "GET /biobank/sample-requests/${rq_id} -> status == COMPROMISED"
            - "GET /biobank/sharing-agreements/${ag_id} -> reserved_volume_ml == 0.0 and remaining_volume_ml == 1000.0 (release compensation)"
            - "GET /biobank/destruction-orders?consent_record_id=${c_id} -> exactly 1 order, reason == CONSENT_WITHDRAWAL, status == PENDING"

      - name: freezer_failure_cascade_depth2
        grounds:
          - state_machines.StorageUnit.OPERATIONAL_to_FAILURE
          - state_machines.StorageSlot.AVAILABLE_to_OFFLINE
        distinguishing_aspect: |
          Cascade of depth >= 2 from a DIFFERENT trigger (declare-failure, not
          the withdrawal sweep): StorageUnit FAILURE causes StorageSlot ->
          OFFLINE (link 1), which itself causes future BOOKED SlotReservations
          -> CANCELLED (link 2); the same failure transition also quarantines the contained aliquot.
        test_recipe:
          setup:
            - "Unit FRZ-TC2 OPERATIONAL with slot A1; BOOKED reservation 2026-06-01T10:00..2026-06-01T12:00 (future relative to clock 2026-05-01)"
            - "Specimen SP with aliquot AL IN_STORAGE in slot A1"
          setup_api_calls:
            - { call: "POST /biobank/donors", payload: { donor_reference_code: "D-TC2" }, as: ConsentCoordinator, captures: { d_id: "$.data.id" } }
            - { call: "POST /biobank/donors/${d_id}/consent-records", payload: { permitted_uses: ["GENERAL_RESEARCH"], effective_from: "2026-05-01T00:00:00Z" }, as: ConsentCoordinator, captures: { c_id: "$.data.id" } }
            - { call: "POST /biobank/collection-kits", payload: { kit_type: "BLOOD", expires_at: "2027-01-01T00:00:00Z" }, as: ConsentCoordinator, captures: { k_id: "$.data.id" } }
            - { call: "POST /biobank/collection-kits/${k_id}/distribute", payload: { donor_id: "${d_id}" }, as: ConsentCoordinator }
            - { call: "POST /biobank/collection-kits/${k_id}/receive-return", payload: {}, as: ConsentCoordinator }
            - { call: "POST /biobank/storage-units", payload: { unit_code: "FRZ-TC2", setpoint_c: -80.0 }, as: BiobankAdmin, captures: { u_id: "$.data.id" } }
            - { call: "POST /biobank/storage-units/${u_id}/slots", payload: { slot_code: "A1", capacity_ml: 500 }, as: BiobankAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /biobank/storage-slots/${s_id}/reservations", payload: { starts_at: "2026-06-01T10:00:00Z", ends_at: "2026-06-01T12:00:00Z", purpose: "MAINTENANCE" }, as: LabTechnician, captures: { res_id: "$.data.id" } }
            - { call: "POST /biobank/specimens", payload: { donor_id: "${d_id}", kit_id: "${k_id}", consent_record_id: "${c_id}", specimen_type: "BLOOD", initial_volume_ml: 50.0, collected_at: "2026-05-02T00:00:00Z", storage_slot_id: "${s_id}" }, as: LabTechnician, captures: { sp_id: "$.data.id", sp_v: "$.data.version" } }
            - { call: "POST /biobank/specimens/${sp_id}/aliquots", payload: { initial_volume_ml: 20.0, expected_specimen_version: "${sp_v}", storage_slot_id: "${s_id}" }, as: LabTechnician, captures: { a_id: "$.data.id" } }
          trigger:
            - { call: "POST /biobank/storage-units/${u_id}/declare-failure", payload: {}, as: QualityOfficer }
          assert:
            - "GET /biobank/storage-units/${u_id} -> posture == FAILURE"
            - "GET /biobank/storage-slots/${s_id} -> status == OFFLINE (link 1)"
            - "GET /biobank/storage-slots/${s_id}/reservations -> the BOOKED reservation ${res_id} now has status == CANCELLED (link 2, caused by the slot going offline)"
            - "GET /biobank/aliquots/${a_id} -> status == QUARANTINED"

