        grounds:
          - calculations.rig_committed_hours
          - state_machines.RigAssignment.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: Subcontractor.committed_rig_hours (rig-time). Forward action
          (schedule an 8h window: 0 -> 8.0) paired with its compensation (cancel) restores the
          pre-action value exactly (8.0 -> 0.0).
