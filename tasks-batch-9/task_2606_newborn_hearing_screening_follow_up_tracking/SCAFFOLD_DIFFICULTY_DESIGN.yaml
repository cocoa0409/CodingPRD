            - call: "POST /screening-encounters"
              payload: { infant_id: "${w_id}", facility_id: "${ac_id}", performed_by_provider_id: "${a1_id}", encounter_type: "OUTPATIENT_RESCREEN", method: "AABR", performed_at: "2026-08-02T06:00:00Z", left_ear_result: "REFER", right_ear_result: "PASS", episode_id: "${ep_w1_id}", appointment_id: "${appt_w1_id}" }
              as: Audiologist
              as_user_id: "${a1_id}"
            - call: "GET /infants/${w_id}"
              payload: {}
              as: ProgramAdmin
              captures: { w_ver: "$.data.version" }
            - call: "POST /follow-up-episodes"
              payload: { infant_id: "${w_id}", episode_type: "DIAGNOSTIC", expected_infant_version: "${w_ver}", supersedes_episode_id: "${ep_w1_id}" }
              as: ProgramAdmin
              captures: { ep_w2_id: "$.data.id" }
            - call: "POST /clinic-slots"
              payload: { facility_id: "${ac_id}", provider_id: "${a2_id}", starts_at: "2026-09-10T20:00:00Z", ends_at: "2026-09-10T21:00:00Z", slot_type: "DIAGNOSTIC", total_capacity: 1 }
              as: ProgramAdmin
              captures: { slot_w2_id: "$.data.id" }
            - call: "POST /clinic-slots"
              payload: { facility_id: "${ac_id}", provider_id: "${a2_id}", starts_at: "2026-09-11T09:00:00Z", ends_at: "2026-09-11T10:00:00Z", slot_type: "DIAGNOSTIC", total_capacity: 1 }
              as: ProgramAdmin
              captures: { slot_w3_id: "$.data.id" }
          trigger:
            - call: "POST /rescreen-appointments"
              payload: { episode_id: "${ep_w2_id}", slot_id: "${slot_w2_id}" }
              as: ProgramAdmin
