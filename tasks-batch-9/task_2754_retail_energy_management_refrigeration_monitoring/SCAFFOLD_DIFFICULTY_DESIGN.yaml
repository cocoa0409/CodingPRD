            - call: "POST /energy-ops/utility-accounts/${acct_1_id}/demand-intervals"
              payload: { intervals: [ { interval_start_iso: "2026-08-04T14:00:00Z", kw_demand: 1290.5, is_on_peak: true }, { interval_start_iso: "2026-08-04T15:00:00Z", kw_demand: 1275.0, is_on_peak: true }, { interval_start_iso: "2026-08-04T16:00:00Z", kw_demand: 1245.0, is_on_peak: true } ] }
              as: EnergyAnalyst
            - call: "POST /energy-ops/utility-accounts/${acct_2_id}/demand-intervals"
              payload: { intervals: [ { interval_start_iso: "2026-08-04T14:00:00Z", kw_demand: 1290.5, is_on_peak: true }, { interval_start_iso: "2026-08-04T15:00:00Z", kw_demand: 1275.0, is_on_peak: true }, { interval_start_iso: "2026-08-04T16:00:00Z", kw_demand: 1245.0, is_on_peak: true } ] }
              as: EnergyAnalyst
