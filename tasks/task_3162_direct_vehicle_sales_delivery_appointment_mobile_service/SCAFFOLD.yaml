# =============================================================================
# PRD Benchmark Scaffold — §1.0 through §1.7
# Task: task_3162_direct_vehicle_sales_delivery_appointment_mobile_service
# =============================================================================

scenario: |
  Direct Vehicle Sales, Delivery Appointment & Mobile Service (Tesla): online configuration and ordering without dealer negotiation with order fees and configuration lock deadlines, vehicle allocation and matching to orders with delivery estimate windows that shift by production, delivery appointment scheduling at a center or by home delivery with acceptance inspection and issue documentation, state franchise law variations restricting direct sales requiring out-of-state delivery or gallery-only locations, trade-in appraisal and financing integrated into the order flow, mobile service dispatch performing repairs at the customer location with parts pre-shipment, service center appointment triage using remote vehicle diagnostics, over-the-air software updates and feature entitlement purchases

domain_name: direct-vehicle-sales-service
api_prefix: /v1

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - scheduled_deferred_actions
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
    - polymorphic
  role_model: peer_roles
  consistency_model: saga
  entity_count: 19
  state_machine_count: 14
  calculation_count: 9
  validation_layers: 19
  endpoint_count: 118
  error_code_count: 73
  role_count: 8

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Buyer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Account holder full name" }
      - { name: email, type: string, source: input, description: "Account email", constraints: "unique across Buyer" }
      - { name: residency_state_code, type: string, source: input, description: "Two-letter residence state used for franchise-law screening and registration" }
      - { name: credit_band, type: enum, source: computed, default: "UNRATED", description: "UNRATED | PRIME | NEAR_PRIME | SUBPRIME; copied from the latest decided FinancingApplication whose status IN {CONDITIONALLY_APPROVED, CONTRACT_PENDING, FUNDED} by decision timestamp ASC then created_at ASC" }
      - { name: order_credit_balance_cents, type: integer, source: computed, default: 0, description: "Conserved quantity: sum of OrderFeeLedgerEntry.amount_cents over every entry whose buyer_id equals this Buyer.id; recomputed on every ledger mutation and on every compensating reversal" }
      - { name: identity_verified, type: boolean, source: system, default: false, description: "True only after POST /v1/buyers/{buyerId}/identity-verification succeeds" }
      - { name: status, type: enum, source: system, description: "PENDING_VERIFICATION → ACTIVE → SUSPENDED" }

  - name: StateJurisdiction
    parent: null
    common_fields: true
    fields:
      - { name: state_code, type: string, source: input, description: "Two-letter state code", constraints: "unique across StateJurisdiction" }
      - { name: direct_sales_permitted, type: boolean, source: input, description: "False when franchise law bars the manufacturer from contracting a retail sale with residents of this state" }
      - { name: gallery_only_required, type: boolean, source: input, default: false, description: "True when the state permits a gallery/showroom presence but forbids on-site contract execution" }
      - { name: out_of_state_delivery_required, type: boolean, source: input, default: false, description: "True when a resident purchase is lawful only if the handover happens outside this state" }
      - { name: cooling_off_days, type: integer, source: input, default: 3, description: "Return-right window in days measured from the delivery acceptance instant" }
      - { name: doc_fee_cap_cents, type: integer, source: input, default: 0, description: "Statutory ceiling on the documentation fee; 0 means no documentation fee may be charged" }
      - { name: mobile_service_permitted, type: boolean, source: input, default: true, description: "False when the state forbids repair work performed at the customer location" }
      - { name: delivery_buffer_minutes, type: integer, source: input, default: 60, description: "Bay turnaround buffer enforced between consecutive DeliveryAppointment intervals at a center in this state" }
      - { name: allocation_window_days, type: integer, source: input, default: 14, description: "Days after configuration lock within which an AllocationUnit must be matched before the order is flagged at risk" }
      - { name: transport_lead_days, type: integer, source: input, default: 7, description: "Days from batch completion to arrival at a center in this state" }
      - { name: status, type: enum, source: system, description: "DRAFT → ENACTED → REPEALED" }

  - name: VehicleConfiguration
    parent: null
    common_fields: true
    fields:
      - { name: model_code, type: string, source: input, description: "Trim family code, e.g. MODEL_Y_LR_AWD" }
      - { name: base_price_cents, type: integer, source: input, description: "Manufacturer base price before options" }
      - { name: configured_price_cents, type: integer, source: computed, description: "base_price_cents plus the sum of ConfigurationOption.price_cents over options whose is_software_entitlement == false" }
      - { name: option_count, type: integer, source: computed, default: 0, description: "Count of ConfigurationOption rows whose configuration_id equals this configuration" }
      - { name: status, type: enum, source: system, description: "DRAFT → PUBLISHED → RETIRED" }

  - name: ConfigurationOption
    parent: VehicleConfiguration
    common_fields: true
    fields:
      - { name: configuration_id, type: string, source: system, description: "FK -> VehicleConfiguration.id; the configuration that owns the option" }
      - { name: option_sku, type: string, source: input, description: "Option SKU", constraints: "unique within configuration_id" }
      - { name: option_category, type: enum, source: input, description: "PAINT | WHEELS | INTERIOR | SOFTWARE_FEATURE | TOWING" }
      - { name: is_software_entitlement, type: boolean, source: computed, default: false, description: "True when option_category == SOFTWARE_FEATURE; such options are entitlement grants and contribute 0 to configured_price_cents" }
      - { name: price_cents, type: integer, source: input, description: "List price of the option in cents" }
      - { name: status, type: enum, source: system, description: "ACTIVE → RETIRED" }

  - name: VehicleOrder
    parent: null
    common_fields: true
    fields:
      - { name: buyer_id, type: string, source: input, description: "FK -> Buyer.id; the purchasing account" }
      - { name: configuration_id, type: string, source: input, description: "FK -> VehicleConfiguration.id; the configured vehicle being ordered" }
      - { name: jurisdiction_id, type: string, source: input, description: "FK -> StateJurisdiction.id; governing franchise-law and fee regime" }
      - { name: delivery_center_id, type: string, source: input, description: "FK -> DeliveryCenter.id; the handover center selected for this order" }
      - { name: order_fee_cents, type: integer, source: input, default: 25000, description: "Non-refundable order fee captured when the order is placed" }
      - { name: order_fee_paid_cents, type: integer, source: computed, default: 0, description: "Sum of OrderFeeLedgerEntry.amount_cents for this order where entry_type == ORDER_FEE_PAYMENT" }
      - { name: placed_at, type: datetime, source: system, description: "ISO 8601 UTC instant the order left DRAFT" }
      - { name: configuration_lock_deadline, type: datetime, source: computed, description: "placed_at plus configuration_lock_days; a configuration change is accepted while now_utc <= configuration_lock_deadline" }
      - { name: order_total_due_cents, type: integer, source: computed, description: "Provisional before delivery handover and final afterwards; see calculations.order_total_due_cents" }
      - { name: delivery_readiness_posture, type: enum, source: computed, default: "FROZEN", description: "READY | RESTRICTED | FROZEN; derived aggregate gating delivery scheduling, see calculations.delivery_readiness_posture" }
      - { name: estimate_shift_days_cumulative, type: integer, source: computed, default: 0, description: "Net shift accumulator: += DeliveryEstimate.shift_days on every transition INTO SUPERSEDED and -= DeliveryEstimate.shift_days on every restore FROM SUPERSEDED to FIRM; starts at 0 on order creation" }
      - { name: issue_note_count, type: integer, source: computed, default: 0, description: "Count of VehicleIssueNote rows whose order_id equals this order" }
      - { name: status, type: enum, source: system, description: "DRAFT → PLACED → CONFIG_LOCKED → ALLOCATED → IN_TRANSIT → AT_DELIVERY_CENTER → DELIVERY_SCHEDULED → DELIVERED / CANCELLED" }

