        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[publish-results-stale-race]", "concurrency_rules[correction-adjudication-stale-race]"]
        distinguishing_aspect: "Both OCC endpoints reject a stale expected_race_version with 412 ERR_STALE_RACE_VERSION and accept the observed version; each success increments Race.version by exactly 1."
        test_recipe:
          setup: ["single-finisher 10km race live at 09:00 (cutoff reached), pre-publish; race version observed as race_v"]
