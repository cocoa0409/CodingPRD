  # ===========================================================================
  # RULE 6 — boundary_precision_check
  # Three boundaries on three DIFFERENT metrics, each reached through a
  # DIFFERENT endpoint: a blended MASS RATIO on POST /resin-charges, a
  # footprint UTILISATION PERCENTAGE on POST /finished-units/{id}/store, and a
  # collection CARDINALITY on POST /finished-units/{id}/inspect. Every instance
  # exercises both sides of its own boundary at the smallest representable
  # step.
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: regrind_ceiling_exact_30_00_pct_accepted_vs_30_01_rejected
        grounds:
          - calculations.cycle_regrind_percentage
          - validations[priority=50]
          - validations[priority=52]
          - errors.ERR_REGRIND_LIMIT_EXCEEDED
          - entities.ProductModel.fields.max_regrind_pct
          - entities.ResinCharge.fields.charge_regrind_pct
          - concurrency_rules[charge-create-stale-resin-lot]
        distinguishing_aspect: |
          The boundary metric is a blended resin MASS RATIO evaluated on POST /resin-charges,
          where calculations.cycle_regrind_percentage rejects only on a STRICT greater-than:
          a 24.000 kg charge carrying 7.200 kg of regrind lands on exactly 30.00 pct and is
          ACCEPTED, and the same charge carrying 7.202 kg lands on 30.01 pct — the smallest
          representable 2 dp step above the ceiling — and is refused 422; the intermediate
          7.201 kg is accepted because round(30.0041666, 2) is still 30.00.
        test_recipe:
          setup:
            - "ProductModel PM-X6A-KM: KAYAK/MID, max_regrind_pct exactly 30.00, nominal_charge_kg 24.000, charge_tolerance_pct 5.00, melt band 2.50 to 6.00 inclusive."
            - "Single-cavity Mold MLD-X6A-1 for that model with nominal_charge_kg 24.000 == 24.000 * 1 and service_interval_cycles 10, so CASCADE-B never fires."
            - "OvenStation OV-X6A (arm_count 2, changeover_buffer_min 15, max_size_class OVERSIZE) and CoolingBay CB-X6A (concurrent_slot_capacity 2, airflow_mode FORCED_AIR), both OPERATIONAL."
            - "Two ACTIVE Technicians: T-X6A-RES (RESIN_TECH, certification RESIN_BLENDING, required by §1.4 priority 31) and T-X6A-OPR (MOLDING_OPERATOR)."
            - "Warehouse WH-X6A with footprint_capacity_cube_m3 20.0000 in one zone Z-A of 20.0000; nothing is ever stored, so posture stays NORMAL and §1.4 priority 40 is vacuous."
            - "ResinLot LOT-X6A: HDPE_LINEAR, melt_index_g10min 4.00, colour exactly SEAFOAM, additive UV12, regrind_pct_by_mass exactly 30.00 (calculations.qualified_resin_lot_count admits a lot AT the ceiling), received_kg 500.000, expires_on 2027-12-31 — so the lot qualifies and the model ceiling, not the lot ceiling, is what the blend test reads."
            - "ProductionOrder PO-X6A (ordered_qty 2, no demand_bucket_id) released to READY_TO_SCHEDULE, then TWO SCHEDULED MoldingCycles on non-overlapping windows 09:00-10:30 and 12:00-13:30, both selecting MLD-X6A-1, so each cycle's participating charge set is independent and 2 scheduled units sit inside floor(2 * 1.20) == 2 (§1.4 priority 79)."
            - "The logical clock is never moved, so it stays at its 2026-08-01T00:00:00Z default and both oven windows are in the future (§1.4 priority 63)."
          setup_api_calls:
            - call: "POST /product-models"
              payload: { model_code: "PM-X6A-KM", hull_type: "KAYAK", size_class: "MID", resin_grade: "HDPE_LINEAR", master_color_code: "SEAFOAM", max_color_delta_e: 1.50, required_additive_package_code: "UV12", max_regrind_pct: 30.00, min_melt_index_g10min: 2.50, max_melt_index_g10min: 6.00, nominal_charge_kg: 24.000, charge_tolerance_pct: 5.00, min_cooling_minutes: 30, target_wall_thickness_mm: 6.00, wall_thickness_min_mm: 4.50, wall_cv_max_pct: 12.00, impact_test_min_joules: 90.00, gross_cube_m3: 2.0000, nest_factor: 0.5000, unit_weight_kg: 24.000, msrp_cents: 180000, warranty_basis: "PRO_RATA_AGE", initial_warranty_reserve_cents: 500000, seasonal_family: "PADDLE" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { pm: $.data.id }
            - call: "POST /molds"
              payload: { mold_code: "MLD-X6A-1", product_model_id: "${pm}", size_class: "MID", cavity_count: 1, nominal_charge_kg: 24.000, service_interval_cycles: 10 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { mold: $.data.id }
            - call: "POST /oven-stations"
              payload: { station_code: "OV-X6A", arm_count: 2, max_size_class: "OVERSIZE", changeover_buffer_min: 15, energy_cents_per_min: 100 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { station: $.data.id }
            - call: "POST /cooling-bays"
              payload: { bay_code: "CB-X6A", concurrent_slot_capacity: 2, airflow_mode: "FORCED_AIR" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { bay: $.data.id }
            - call: "POST /technicians"
              payload: { employee_code: "T-X6A-RES", full_name: "Rhea Regrind", role_code: "RESIN_TECH", certifications: ["RESIN_BLENDING"] }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { t_res: $.data.id }
            - call: "POST /technicians"
              payload: { employee_code: "T-X6A-OPR", full_name: "Otto Oven", role_code: "MOLDING_OPERATOR", certifications: [] }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { t_op: $.data.id }
            - call: "POST /warehouses"
              payload: { site_code: "WH-X6A", footprint_capacity_cube_m3: 20.0000, zones: [{ zone_code: "Z-A", capacity_cube_m3: 20.0000 }], restricted_threshold_pct: 85.00, frozen_threshold_pct: 95.00 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { wh: $.data.id }
            - call: "POST /resin-lots"
              payload: { lot_code: "LOT-X6A", resin_grade: "HDPE_LINEAR", melt_index_g10min: 4.00, color_code: "SEAFOAM", color_delta_e: 0.50, additive_package_code: "UV12", regrind_pct_by_mass: 30.00, cost_cents_per_kg: 210, received_kg: 500.000, expires_on: "2027-12-31" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { lot: $.data.id }
            - call: "POST /production-orders"
              payload: { order_code: "PO-X6A", product_model_id: "${pm}", target_warehouse_id: "${wh}", ordered_qty: 2 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { po: $.data.id }
            - call: "POST /production-orders/${po}/release"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { po_v1: $.data.version }
            - call: "POST /molding-cycles"
              payload: { production_order_id: "${po}", oven_station_id: "${station}", arm_index: 1, cooling_bay_id: "${bay}", oven_start_at: "2026-08-01T09:00:00Z", scheduled_oven_minutes: 60, scheduled_cooling_minutes: 30, oven_temp_c: 288.0, arm_rpm_major: 8.00, arm_rpm_minor: 2.00, cooling_mode: "FORCED_AIR", expected_production_order_version: "${po_v1}" }
              as: MoldingOperator
              as_user_id: "${t_op}"
              captures: { cyc1: $.data.id }
            - call: "GET /production-orders/${po}"
              payload: {}
              as: MoldingOperator
              as_user_id: "${t_op}"
              captures: { po_v2: $.data.version }
            - call: "POST /molding-cycles"
              payload: { production_order_id: "${po}", oven_station_id: "${station}", arm_index: 1, cooling_bay_id: "${bay}", oven_start_at: "2026-08-01T12:00:00Z", scheduled_oven_minutes: 60, scheduled_cooling_minutes: 30, oven_temp_c: 288.0, arm_rpm_major: 8.00, arm_rpm_minor: 2.00, cooling_mode: "FORCED_AIR", expected_production_order_version: "${po_v2}" }
              as: MoldingOperator
              as_user_id: "${t_op}"
              captures: { cyc2: $.data.id }
          trigger:
            - call: "GET /resin-lots/${lot}"
              payload: {}
              as: ResinTechnician
              as_user_id: "${t_res}"
              captures: { lot_v1: $.data.version }
            - call: "POST /resin-charges"
              payload: { molding_cycle_id: "${cyc1}", resin_lot_id: "${lot}", charge_kg: 24.000, regrind_kg: 7.200, expected_resin_lot_version: "${lot_v1}" }
              as: ResinTechnician
              as_user_id: "${t_res}"
              captures: { ch1: $.data.id, ch1_pct: $.data.charge_regrind_pct }
            - call: "GET /resin-lots/${lot}"
              payload: {}
              as: ResinTechnician
              as_user_id: "${t_res}"
              captures: { lot_v2: $.data.version }
            - call: "POST /resin-charges"
              payload: { molding_cycle_id: "${cyc2}", resin_lot_id: "${lot}", charge_kg: 24.000, regrind_kg: 7.202, expected_resin_lot_version: "${lot_v2}" }
              as: ResinTechnician
              as_user_id: "${t_res}"
              captures: { err_over: $.data.error_id }
            - call: "GET /resin-lots/${lot}"
              payload: {}
              as: ResinTechnician
              as_user_id: "${t_res}"
              captures: { lot_v3: $.data.version }
            - call: "POST /resin-charges"
              payload: { molding_cycle_id: "${cyc2}", resin_lot_id: "${lot}", charge_kg: 24.000, regrind_kg: 7.201, expected_resin_lot_version: "${lot_v3}" }
              as: ResinTechnician
              as_user_id: "${t_res}"
              captures: { ch2: $.data.id, ch2_pct: $.data.charge_regrind_pct }
            - call: "GET /molding-cycles/${cyc1}"
              payload: {}
              as: ResinTechnician
              as_user_id: "${t_res}"
            - call: "GET /molding-cycles/${cyc2}"
              payload: {}
              as: ResinTechnician
              as_user_id: "${t_res}"
            - call: "GET /resin-lots/${lot}"
              payload: {}
              as: ResinTechnician
              as_user_id: "${t_res}"
          assert:
            - "ResinCharge.${ch1}.charge_regrind_pct == 30.00   (7.200 / 24.000 * 100 == 30.00 exactly)"
            - "ResinCharge.${ch1}.virgin_kg == 16.800"
            - "MoldingCycle.${cyc1}.cycle_regrind_pct == 30.00 and MoldingCycle.${cyc1}.charged_mass_kg == 24.000"
            - "the 7.200 charge is ACCEPTED with HTTP 201: the ceiling test is strict greater-than, so landing exactly on max_regrind_pct 30.00 passes"
            - "the 7.202 charge returns HTTP 422 with error_id ERR_REGRIND_LIMIT_EXCEEDED, because round(7.202 / 24.000 * 100, 2) == 30.01 > 30.00"
            - "${lot_v3} == ${lot_v2}   (the refused charge committed no partial reservation, so ResinLot.version did not move)"
            - "ResinCharge.${ch2}.charge_regrind_pct == 30.00   (7.201 / 24.000 * 100 == 30.0041666..., which round_half_up to 2 dp is 30.00, one 0.001 kg step below the rejecting neighbour)"
            - "ResinCharge.${ch2}.virgin_kg == 16.799"
            - "MoldingCycle.${cyc2}.cycle_regrind_pct == 30.00"
            - "ResinLot.${lot}.available_kg == 452.000 and ResinLot.${lot}.reserved_kg == 48.000 and ResinLot.${lot}.consumed_kg == 0.000"
            - "ResinLot.${lot}.status == AVAILABLE"

      - name: warehouse_frozen_threshold_rounded_95_00_freezes_vs_95_01_threshold
        grounds:
          - calculations.warehouse_footprint_posture
          - calculations.storage_footprint
          - calculations.storage_zone_selection
          - state_machines.Warehouse.NORMAL_to_FROZEN
          - state_machines.Warehouse.NORMAL_to_RESTRICTED
          - entities.Warehouse.fields.frozen_threshold_pct
          - concurrency_rules[store-unit-stale-warehouse]
        distinguishing_aspect: |
          The boundary metric is a footprint UTILISATION PERCENTAGE reached through
          POST /finished-units/{finished_unit_id}/store, not the mass ratio of
          regrind_ceiling_exact_30_00_pct_accepted_vs_30_01_rejected: two sites each hold one
          identical 2.0000 m3 anchor hull in an identical 2.1053 m3 zone, so both read
          utilization_pct 95.00 even though the raw quotient is 94.99833..., and the site whose
          frozen_threshold_pct is 95.00 becomes FROZEN on the >= equality while the site whose
          threshold is one representable 2 dp step higher at 95.01 stops at RESTRICTED.
        test_recipe:
          setup:
            - "ProductModel PM-X6B-KM: KAYAK/MID, gross_cube_m3 2.0000, nest_factor 0.5000, unit_weight_kg 24.000, nominal_charge_kg 24.000, charge_tolerance_pct 5.00, min_cooling_minutes 30, wall_thickness_min_mm 4.50, wall_cv_max_pct 12.00, impact_test_min_joules 90.00."
            - "Single-cavity Mold MLD-X6B-1 with nominal_charge_kg 24.000 and service_interval_cycles 10; OvenStation OV-X6B (arm_count 2, changeover_buffer_min 15, max_size_class OVERSIZE); CoolingBay CB-X6B (concurrent_slot_capacity 2, airflow_mode FORCED_AIR)."
            - "Four ACTIVE Technicians, all distinct rows so §1.4 priority 57 is satisfied: T-X6B-RES, T-X6B-OPR, T-X6B-ASM (FIXTURE_ASSEMBLY) and T-X6B-QCI (WALL_GAUGE + IMPACT_RIG)."
            - "TWO warehouses with IDENTICAL geometry — footprint_capacity_cube_m3 2.1053 in one zone Z-A of 2.1053 — and restricted_threshold_pct 85.00 on both, differing ONLY in frozen_threshold_pct: WH-X6B-A at 95.00 and WH-X6B-B at 95.01."
            - "Qualified ResinLot LOT-X6B (received_kg 500.000, regrind_pct_by_mass 10.00, expires_on 2027-12-31)."
            - "Two ProductionOrders, PO-X6B-A targeting WH-X6B-A and PO-X6B-B targeting WH-X6B-B, each ordered_qty 1 and each with no demand_bucket_id, so floor(1 * 1.20) == 1 admits exactly one single-cavity cycle per order (§1.4 priority 79) and §1.4 priorities 69 and 74 stay vacuous."
            - "Each order runs one cycle through to DEMOLDED on MLD-X6B-1 over non-overlapping windows (09:00-10:35 actual and 12:00-13:35 actual), and each resulting hull is trimmed, outfitted and inspected PASS, so both hulls reach build_status SELLABLE with logistics_status UNALLOCATED before either store."
            - "Neither site holds any prior hull, so calculations.storage_zone_selection finds anchor_exists false, charges the full gross_cube_m3 2.0000 and sets is_zone_anchor true — the ANCHOR_PLACEMENT variant."
