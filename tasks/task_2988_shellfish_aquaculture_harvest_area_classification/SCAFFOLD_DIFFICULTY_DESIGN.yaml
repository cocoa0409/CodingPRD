  - rule_id: non_linear_state_machine
    instances:

      - name: growing_area_classification_and_harvest_status_evolve_independently
        grounds:
          - state_machines.GrowingArea.APPROVED_to_CONDITIONALLY_APPROVED
          - state_machines.GrowingArea.OPEN_to_CLOSED_RAINFALL
          - state_machines.GrowingArea.CLOSED_RAINFALL_to_OPEN
          - entities.GrowingArea.fields.classification
          - entities.GrowingArea.fields.harvest_status
          - entities.GrowingArea.fields.closure_reopen_eligible_at
          - calculations.area_reopen_eligibility
        distinguishing_aspect: |
          PARALLEL shape: GrowingArea carries two independent state dimensions on one row, and a full
          rainfall close/reopen cycle on harvest_status (OPEN -> CLOSED_RAINFALL -> OPEN) leaves
          classification pinned at CONDITIONALLY_APPROVED throughout, so the combined state
          (CONDITIONALLY_APPROVED, CLOSED_RAINFALL) is reachable and neither dimension implies the other.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-01T00:00:00Z."
            - "GrowingArea GA-114 with conditional_management_plan_on_file true, rainfall_closure_threshold_in 1.00, rainfall_closure_hours 96, reopen_sample_count_required 3, clean_sample_mpn_limit 14.0."
            - "Five ACCEPTED WaterSamples of fecal_coliform_mpn 2 collected 2026-07-01..2026-07-05, so accepted_sample_count 5 and eligible_classification APPROVED."
            - "classification administratively moved APPROVED -> CONDITIONALLY_APPROVED; harvest_status still OPEN at the start of the trigger."
          setup_api_calls:
            - call: "POST /shellfish/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas"
              payload: { code: "GA-114", water_body: "Pamlico Sound", rainfall_closure_threshold_in: 1.0, rainfall_closure_hours: 96, reopen_sample_count_required: 3, clean_sample_mpn_limit: 14.0, conditional_management_plan_on_file: true }
              as: ShellfishControlAuthority
              captures: { area: $.data.id }
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-01T09:00:00Z", fecal_coliform_mpn: 2, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-02T09:00:00Z", fecal_coliform_mpn: 2, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-03T09:00:00Z", fecal_coliform_mpn: 2, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-04T09:00:00Z", fecal_coliform_mpn: 2, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-05T09:00:00Z", fecal_coliform_mpn: 2, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
            - call: "GET /shellfish/growing-areas/${area}"
              payload: {}
              as: ShellfishControlAuthority
              captures: { area_v: $.data.version }
            - call: "POST /shellfish/growing-areas/${area}/classification-decisions"
              payload: { classification: "CONDITIONALLY_APPROVED", expected_area_version: "${area_v}", decision_note: "conditional management plan in force" }
              as: ShellfishControlAuthority
          trigger:
            - call: "POST /shellfish/growing-areas/${area}/rainfall-events"
              payload: { gauge_code: "RG-7", observed_at: "2026-07-15T00:00:00Z", inches_24h: 1.5 }
              as: ShellfishControlAuthority
