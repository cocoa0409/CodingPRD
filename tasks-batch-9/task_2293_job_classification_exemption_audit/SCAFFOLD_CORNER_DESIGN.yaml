  # ===========================================================================
  - section: state_machines
    instances:

      - name: audit_project_planning_to_fieldwork_transition_succeeds_and_bumps_version
        claim_type: valid_transition
        grounds: ["state_machines.AuditProject.PLANNING_to_FIELDWORK", "endpoints[POST /audit-projects/{id}/status]"]
        distinguishing_aspect: "The declared transition must move status to FIELDWORK and increment version by exactly 1, and it must not touch the derived roll-ups: posture stays OPEN and no family gets a remediation rank."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; one AuditProject in PLANNING (version 1) with one JobFamily, which satisfies the transition precondition."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /audit-projects"
              payload: { name: "FY26 Classification Audit", fiscal_year: 2026, lookback_policy: "STANDARD_2Y" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { proj_id: $.data.id }
            - call: "POST /job-families"
              payload: { audit_project_id: "${proj_id}", name: "Operations Leadership", code: "OPS-LEAD" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { fam_id: $.data.id }
          trigger:
            - call: "POST /audit-projects/${proj_id}/status"
              payload: { target_status: "FIELDWORK" }
              as: ProgramAdmin
              as_user_id: "pa-1"
          assert:
            - "response status is 200 and AuditProject.${proj_id}.status == FIELDWORK"
            - "AuditProject.${proj_id}.version == 2"
            - "AuditProject.${proj_id}.remediation_posture == OPEN"
            - "JobFamily.${fam_id}.remediation_priority_rank == null"

      - name: newly_created_entities_start_in_their_declared_initial_states
