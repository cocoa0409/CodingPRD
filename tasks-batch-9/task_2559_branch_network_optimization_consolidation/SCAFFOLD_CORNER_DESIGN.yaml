              captures: { ma_id: $.data.id }
            - call: "POST /distribution/de-novo-plans"
              payload: { market_area_id: "${ma_id}", site_label: "Northgate Commons", proposed_branch_code: "RB-601", target_year1_deposits_cents: 9000000000, capex_budget_cents: 3500000000 }
              as: NetworkStrategist
