          setup:
            - "Batch packed 46.00 lb on 2026-08-24, RELEASED; shipment S1 RESERVED (10.00 lb line), window 2026-08-24 08:00-20:00"
            - "Sanitation cycle CY2 on WL-A (2026-08-24 13:00-15:00) started, then recorded FAILED at 15:30 -> batch QUARANTINED, shipment has_safety_block"
            - "Clock advanced to 2026-08-24T20:00:01Z — one second past window_end (temporal violation also armed)"
