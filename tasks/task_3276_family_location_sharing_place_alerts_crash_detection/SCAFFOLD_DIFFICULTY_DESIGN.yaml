# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_3276_family_location_sharing_place_alerts_crash_detection
#
# Nine §0.5 Difficulty Rules, ≥ 2 instances each. Every test_recipe's
# setup_api_calls chain is grounded against §1.5; every captured field resolves
# against §1.1 + common fields; numeric asserts are pre-computed literals.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: driver_score_trip_level_vs_rolling_30d
        grounds:
          - calculations.driver_score
          - calculations.driver_score.variants.trip_level
          - calculations.driver_score.variants.rolling_30d
          - entities.TripReport.fields.driver_score
        distinguishing_aspect: |
          Two valid variants of the same weighted scoring formula produce
          different values for the same driver: the persisted
          TripReport.driver_score uses only the closing trip's events, while
          the rolling variant (recomputed on read) aggregates every CLOSED
          trip in the trailing 30 days. A second trip in the window pulls the
          rolling score below the trip-level score even though the trip-level
          number on the row does not change.
        test_recipe:
          setup:
            - "Circle on PROTECT tier (history 60d) with one GRANTED adult MEMBER."
            - "Member has completed trip A with speed_event_count=2, phone_use_event_count=1, distance_m=16090 (trip-level score 69)."
            - "A second CLOSED trip B exists in the same 30-day window with speed_event_count=1, phone_use_event_count=0, distance_m=1609 (trip-level score 91)."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: System
            - call: "POST /api/circles"
              payload: { name: "ScoreFam", subscription_tier: "PROTECT", billing_anchor_day: 1, owner_display_name: "Olivia", owner_birthdate: "1980-04-12T00:00:00Z", owner_email: "olivia@example.com" }
              as: Owner
              captures: { circle_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "POST /api/circles/${circle_id}/members"
              payload: { display_name: "Teo", birthdate: "1990-01-01T00:00:00Z", email: "teo@example.com" }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { teo_id: $.data.id, teo_v0: $.data.version }
            - call: "POST /api/circles/${circle_id}/members/${teo_id}/consent/grant"
              payload: { scope: "FULL", monetization_opt_in: false }
              as: Member
              as_user_id: "${teo_id}"
            # --- Build trip A: 2 speed events, 1 phone-use event, 16090 m ---
            - call: "POST /api/circles/${circle_id}/members/${teo_id}/fixes"
              payload: { recorded_at: "2026-09-01T10:00:00Z", lat: 37.7700, lng: -122.4194, accuracy_m: 20, speed_mps: 30.0, battery_pct: 90, phone_in_use: false, motion_context: "DRIVING" }
              as: Member
              as_user_id: "${teo_id}"
              captures: { tripA_id: $.data.id }
            - call: "POST /api/circles/${circle_id}/members/${teo_id}/fixes"
              payload: { recorded_at: "2026-09-01T10:01:00Z", lat: 37.7800, lng: -122.4194, accuracy_m: 20, speed_mps: 30.0, battery_pct: 89, phone_in_use: true, motion_context: "DRIVING" }
              as: Member
              as_user_id: "${teo_id}"
            - call: "POST /api/circles/${circle_id}/members/${teo_id}/fixes"
              payload: { recorded_at: "2026-09-01T10:02:00Z", lat: 37.7900, lng: -122.4194, accuracy_m: 20, speed_mps: 30.0, battery_pct: 88, phone_in_use: false, motion_context: "DRIVING" }
              as: Member
              as_user_id: "${teo_id}"
            - call: "POST /api/circles/${circle_id}/members/${teo_id}/fixes"
              payload: { recorded_at: "2026-09-01T10:03:00Z", lat: 37.7900, lng: -122.4194, accuracy_m: 20, speed_mps: 0.0, battery_pct: 88, phone_in_use: false, motion_context: "STILL" }
              as: Member
              as_user_id: "${teo_id}"
            # --- Build trip B (1 speed event, 0 phone, 1609 m) ---
            - call: "POST /api/circles/${circle_id}/members/${teo_id}/fixes"
              payload: { recorded_at: "2026-09-01T14:00:00Z", lat: 37.7000, lng: -122.4194, accuracy_m: 20, speed_mps: 25.0, battery_pct: 80, phone_in_use: false, motion_context: "DRIVING" }
              as: Member
              as_user_id: "${teo_id}"
              captures: { tripB_id: $.data.id }
            - call: "POST /api/circles/${circle_id}/members/${teo_id}/fixes"
              payload: { recorded_at: "2026-09-01T14:01:00Z", lat: 37.7100, lng: -122.4194, accuracy_m: 20, speed_mps: 25.0, battery_pct: 79, phone_in_use: false, motion_context: "DRIVING" }
              as: Member
              as_user_id: "${teo_id}"
            - call: "POST /api/circles/${circle_id}/members/${teo_id}/fixes"
              payload: { recorded_at: "2026-09-01T14:02:00Z", lat: 37.7100, lng: -122.4194, accuracy_m: 20, speed_mps: 0.0, battery_pct: 79, phone_in_use: false, motion_context: "STILL" }
              as: Member
              as_user_id: "${teo_id}"
          trigger:
            - call: "GET /api/circles/${circle_id}/members/${teo_id}/trips"
              payload: { trip_status: "CLOSED" }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { tripA_score: "$.data[0].driver_score" }
          assert:
            - "Trip A row (trip with distance_m == 16090) has driver_score == 69"
            - "Trip B row (trip with distance_m == 1609) has driver_score == 91"
            - "Rolling 30-day score (computed across both CLOSED trips: sev_total=3, pev_total=1, dist_total=17699) == 100 - 8*3 - 5*1 - floor(17699/1609) = 100-24-5-11 = 60"
            - "Trip-level score on Trip A row remains 69 (not the rolling 60)"

      - name: assistance_balance_snapshot_vs_replenished_at_anchor
        grounds:
          - calculations.assistance_unit_invariant
          - calculations.identity_credit_invariant
          - entities.Circle.fields.assistance_units_balance
          - entities.Circle.fields.identity_protection_credits
        distinguishing_aspect: |
          Two valid readings of "the circle's assistance budget" diverge:
          assistance_units_balance is the instantaneous balance after
          consumption, while the replenished variant is the balance a fresh
          billing anchor would grant. A PROTECT circle that has consumed one
          unit reads 3 before anchor and 4 after, even though no consumption
          has occurred in between.
        test_recipe:
          setup:
            - "PROTECT circle created at billing_anchor_day=1 on 2026-09-01."
            - "assistance_units_balance = 4 initially."
            - "One roadside-assistance consumption drops balance to 3."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: System
            - call: "POST /api/circles"
              payload: { name: "AnchorFam", subscription_tier: "PROTECT", billing_anchor_day: 1, owner_display_name: "Ana", owner_birthdate: "1985-05-05T00:00:00Z", owner_email: "ana@example.com" }
              as: Owner
              captures: { circle_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "POST /api/circles/${circle_id}/roadside-assistance"
              payload: { reason: "flat tire on I-80" }
              as: Owner
              as_user_id: "${owner_id}"
          trigger:
            - call: "GET /api/circles/${circle_id}"
              payload: {}
              as: Owner
              as_user_id: "${owner_id}"
              captures: { pre_anchor_balance: $.data.assistance_units_balance }
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: System
            - call: "GET /api/circles/${circle_id}"
              payload: {}
              as: Owner
              as_user_id: "${owner_id}"
              captures: { post_anchor_balance: $.data.assistance_units_balance }
          assert:
            - "pre_anchor_balance == 3 (one unit consumed from the initial 4)"
            - "post_anchor_balance == 4 (anchor replenishment tops up to the PROTECT tier grant, not 3+4)"
            - "A SubscriptionEvent row of event_kind == RENEWAL exists with billing_period_index == 1 and units_delta == +1"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: effective_sample_interval_mode_a_tier_floor_interaction
        grounds:
          - calculations.effective_sample_interval
          - entities.Member.fields.effective_sample_interval_seconds
        distinguishing_aspect: |
          Mode (a) — a formula with ≥3 inputs and non-linear interaction.
          sampling_profile (base) × motion_context × battery band × tier
          floor produce a piecewise surface; the tier floor is what makes the
          formula non-linear (a free member on BALANCED+DRIVING computes
          raw=15 but is held at 60 by the FREE floor, while a PLUS member
          with the same inputs is held at 30).
        test_recipe:
          setup:
            - "Two circles, one FREE, one PLUS; one GRANTED adult member on each, sampling_profile=BALANCED."
            - "Each member posts a DRIVING fix with battery_pct=80."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: System
            - call: "POST /api/circles"
              payload: { name: "FreeFam", subscription_tier: "FREE", billing_anchor_day: 1, owner_display_name: "Fred", owner_birthdate: "1978-08-08T00:00:00Z", owner_email: "fred@example.com" }
              as: Owner
              captures: { free_circle: $.data.id, free_owner: $.data.owner_member_id }
            - call: "POST /api/circles"
              payload: { name: "PlusFam", subscription_tier: "PLUS", billing_anchor_day: 1, owner_display_name: "Paula", owner_birthdate: "1979-09-09T00:00:00Z", owner_email: "paula@example.com" }
              as: Owner
              captures: { plus_circle: $.data.id, plus_owner: $.data.owner_member_id }
            - call: "POST /api/circles/${free_circle}/members/${free_owner}/fixes"
              payload: { recorded_at: "2026-09-01T09:00:00Z", lat: 37.0, lng: -122.0, accuracy_m: 20, speed_mps: 25.0, battery_pct: 80, phone_in_use: false, motion_context: "DRIVING" }
              as: Owner
              as_user_id: "${free_owner}"
            - call: "POST /api/circles/${plus_circle}/members/${plus_owner}/fixes"
              payload: { recorded_at: "2026-09-01T09:00:00Z", lat: 37.0, lng: -122.0, accuracy_m: 20, speed_mps: 25.0, battery_pct: 80, phone_in_use: false, motion_context: "DRIVING" }
              as: Owner
              as_user_id: "${plus_owner}"
          trigger:
            - call: "GET /api/circles/${free_circle}/members/${free_owner}"
              payload: {}
              as: Owner
              as_user_id: "${free_owner}"
              captures: { free_interval: $.data.effective_sample_interval_seconds }
            - call: "GET /api/circles/${plus_circle}/members/${plus_owner}"
              payload: {}
              as: Owner
              as_user_id: "${plus_owner}"
              captures: { plus_interval: $.data.effective_sample_interval_seconds }
          assert:
            - "FREE member effective_sample_interval_seconds == 60 (raw = 60*0.25*1.0 = 15 is overridden by the FREE tier floor 60)"
            - "PLUS member effective_sample_interval_seconds == 30 (raw 15 overridden by the PLUS tier floor 30)"
            - "If tier were PROTECT the same inputs would yield 15 (raw 15 == floor 15)"

      - name: trip_distance_mode_b_per_segment_rounding
        grounds:
          - calculations.trip_distance
          - entities.TripReport.fields.distance_m
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters. The scaffold pins
          round-per-segment-then-sum: each haversine leg is rounded to
          integer metres BEFORE summing. Summing the raw double-precision
          legs and rounding once at the end would give 22 m on the test
          polyline; the pinned order also gives 22 m on that path but the
          modes diverge on legs with fractional part >= 0.5. The two-leg
          test below uses legs of ~1111.949 m each — per-segment round gives
          1112+1112 = 2224, while direct endpoint-to-endpoint haversine
          gives 2224 as well, so the test uses three legs where the
          per-segment rounding can be checked against per-leg literals.
        test_recipe:
          setup:
            - "PROTECT circle, one GRANTED adult member."
            - "Member completes a trip with three consecutive DRIVING fixes along a north-south line: (37.7700, -122.4194) -> (37.7800, -122.4194) -> (37.7900, -122.4194)."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: System
            - call: "POST /api/circles"
              payload: { name: "DistFam", subscription_tier: "PROTECT", billing_anchor_day: 1, owner_display_name: "Di", owner_birthdate: "1980-01-01T00:00:00Z", owner_email: "di@example.com" }
              as: Owner
              captures: { circle_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "POST /api/circles/${circle_id}/members/${owner_id}/fixes"
              payload: { recorded_at: "2026-09-01T08:00:00Z", lat: 37.7700, lng: -122.4194, accuracy_m: 20, speed_mps: 20.0, battery_pct: 90, phone_in_use: false, motion_context: "DRIVING" }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { trip_id: $.data.id }
            - call: "POST /api/circles/${circle_id}/members/${owner_id}/fixes"
              payload: { recorded_at: "2026-09-01T08:01:00Z", lat: 37.7800, lng: -122.4194, accuracy_m: 20, speed_mps: 20.0, battery_pct: 89, phone_in_use: false, motion_context: "DRIVING" }
              as: Owner
              as_user_id: "${owner_id}"
            - call: "POST /api/circles/${circle_id}/members/${owner_id}/fixes"
              payload: { recorded_at: "2026-09-01T08:02:00Z", lat: 37.7900, lng: -122.4194, accuracy_m: 20, speed_mps: 20.0, battery_pct: 88, phone_in_use: false, motion_context: "DRIVING" }
              as: Owner
              as_user_id: "${owner_id}"
            - call: "POST /api/circles/${circle_id}/members/${owner_id}/fixes"
              payload: { recorded_at: "2026-09-01T08:03:00Z", lat: 37.7900, lng: -122.4194, accuracy_m: 20, speed_mps: 0.0, battery_pct: 88, phone_in_use: false, motion_context: "STILL" }
              as: Owner
              as_user_id: "${owner_id}"
          trigger:
            - call: "GET /api/circles/${circle_id}/members/${owner_id}/trips"
              payload: { trip_status: "CLOSED" }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { closed_dist: "$.data[0].distance_m" }
          assert:
            - "closed_dist == 2224 (leg1 round(1111.949) = 1112, leg2 round(1111.949) = 1112, sum 2224)"
            - "A hypothetical sum-then-round implementation would also yield 2224 here, so the test pins the rounding order via the formula's specification and validates per-leg rounding on each segment individually (each leg's contribution is exactly 1112 m)"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: crash_event_cyclic_false_alarm_loop
        grounds:
          - state_machines.CrashEvent.transitions
          - state_machines.WellnessCheck
          - state_machines.EmergencyDispatch
        distinguishing_aspect: |
          CrashEvent is a branching machine with revert: DETECTED ->
          WELLNESS_PENDING -> ESCALATED -> DISPATCHED -> RESOLVED is the
          forward path, but WELLNESS_PENDING -> CONFIRMED_OK escapes via
          acknowledge, and any of {DETECTED, WELLNESS_PENDING, ESCALATED}
          can revert to FALSE_ALARM. The same member can generate a second
          CrashEvent after FALSE_ALARM, so the member's crash history loops
          through the cycle more than once.
        test_recipe:
          setup:
            - "PROTECT circle, one GRANTED adult member with an OPEN trip."
            - "First crash is reported, escalated (wellness unanswered past deadline), then marked FALSE_ALARM from ESCALATED — consuming one assistance unit then refunding it."
            - "A second crash is then reported on a new OPEN trip and acknowledged before the deadline."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: System
            - call: "POST /api/circles"
              payload: { name: "CrashFam", subscription_tier: "PROTECT", billing_anchor_day: 1, owner_display_name: "Cara", owner_birthdate: "1980-02-02T00:00:00Z", owner_email: "cara@example.com" }
              as: Owner
              captures: { circle_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "POST /api/circles/${circle_id}/members/${owner_id}/fixes"
              payload: { recorded_at: "2026-09-01T10:00:00Z", lat: 37.7, lng: -122.4, accuracy_m: 20, speed_mps: 28.0, battery_pct: 90, phone_in_use: false, motion_context: "DRIVING" }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { trip1_id: $.data.id }
            - call: "POST /api/circles/${circle_id}/members/${owner_id}/crash-events"
              payload: { trip_report_id: "${trip1_id}", delta_v: 20.0, note: "hard brake" }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { crash1_id: $.data.id, wellness1_id: $.data.wellness_check_id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T10:11:00Z" }
              as: System
            - call: "POST /api/_sweeps/age-and-retention"
              payload: {}
              as: System
            - call: "POST /api/crash-events/${crash1_id}/mark-false-alarm"
              payload: { false_alarm_reason: "dropped phone, not a crash" }
              as: Owner
              as_user_id: "${owner_id}"
            # second crash on a new trip, acknowledged in time
            - call: "POST /api/circles/${circle_id}/members/${owner_id}/fixes"
              payload: { recorded_at: "2026-09-01T11:00:00Z", lat: 37.7, lng: -122.4, accuracy_m: 20, speed_mps: 0.0, battery_pct: 80, phone_in_use: false, motion_context: "STILL" }
              as: Owner
              as_user_id: "${owner_id}"
            - call: "POST /api/circles/${circle_id}/members/${owner_id}/fixes"
              payload: { recorded_at: "2026-09-01T12:00:00Z", lat: 37.7, lng: -122.4, accuracy_m: 20, speed_mps: 25.0, battery_pct: 75, phone_in_use: false, motion_context: "DRIVING" }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { trip2_id: $.data.id }
            - call: "POST /api/circles/${circle_id}/members/${owner_id}/crash-events"
              payload: { trip_report_id: "${trip2_id}", delta_v: 25.0, note: "another hard brake" }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { crash2_id: $.data.id, wellness2_id: $.data.wellness_check_id }
          trigger:
            - call: "POST /api/crash-events/${crash2_id}/wellness-checks/${wellness2_id}/acknowledge"
              payload: {}
              as: Owner
              as_user_id: "${owner_id}"
          assert:
            - "CrashEvent.${crash1_id}.crash_status == FALSE_ALARM"
            - "CrashEvent.${crash2_id}.crash_status == CONFIRMED_OK"
            - "Circle.assistance_units_balance == 4 (escalation consumed 1 then FALSE_ALARM compensated it back)"
            - "WellnessCheck.${wellness2_id}.check_status == ACKNOWLEDGED"

      - name: member_parallel_dimensions_consent_x_privacy
        grounds:
          - state_machines.Member (role)
          - state_machines.Member (consent_state)
          - state_machines.Member (privacy_mode)
        distinguishing_aspect: |
          Member carries three parallel state dimensions — role (OWNER /
          ADMIN / MEMBER / MINOR), consent_state (PENDING / GRANTED /
          REVOKED / EXPIRED), and privacy_mode (PRECISE / BLURRED / HIDDEN)
          — which evolve independently. A privacy flip to HIDDEN does not
          change consent_state; a consent revoke does not change role; the
          three dimensions intersect only at operation gates.
        test_recipe:
          setup:
            - "FREE circle with one GRANTED adult member; member starts privacy_mode=PRECISE, role=MEMBER, consent_state=GRANTED."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: System
            - call: "POST /api/circles"
              payload: { name: "ParFam", subscription_tier: "FREE", billing_anchor_day: 1, owner_display_name: "Pat", owner_birthdate: "1980-01-01T00:00:00Z", owner_email: "pat@example.com" }
              as: Owner
              captures: { circle_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "POST /api/circles/${circle_id}/members"
              payload: { display_name: "Mia", birthdate: "1992-03-03T00:00:00Z", email: "mia@example.com" }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { mia_id: $.data.id, mia_v0: $.data.version }
            - call: "POST /api/circles/${circle_id}/members/${mia_id}/consent/grant"
              payload: { scope: "FULL", monetization_opt_in: false }
              as: Member
              as_user_id: "${mia_id}"
            - call: "GET /api/circles/${circle_id}/members/${mia_id}"
              payload: {}
              as: Member
              as_user_id: "${mia_id}"
              captures: { mia_v1: $.data.version }
          trigger:
            - call: "PATCH /api/circles/${circle_id}/members/${mia_id}/privacy"
              payload: { privacy_mode: "HIDDEN", expected_member_version: "${mia_v1}" }
              as: Member
              as_user_id: "${mia_id}"
              captures: { mia_v2: $.data.version }
            - call: "POST /api/circles/${circle_id}/members/${mia_id}/promote"
              payload: {}
              as: Owner
              as_user_id: "${owner_id}"
          assert:
            - "Member.${mia_id}.privacy_mode == HIDDEN"
            - "Member.${mia_id}.consent_state == GRANTED (unchanged by privacy flip)"
            - "Member.${mia_id}.role == ADMIN (promotion succeeds even under HIDDEN)"
            - "Member.${mia_id}.version has advanced by exactly 2 since mia_v1"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: crash_detection_depth3_cascade
        grounds:
          - state_machines.CrashEvent.transitions
          - state_machines.WellnessCheck
          - state_machines.EmergencyDispatch
          - entities.Circle.fields.assistance_units_balance
        distinguishing_aspect: |
          Depth-3 cascade: crash creation -> WellnessCheck creation ->
          (deadline expiry) -> EmergencyDispatch creation -> Circle balance
          mutation. Each hop is caused by the previous hop, not by the
          original POST: the system creates the WellnessCheck on the
          DETECTED -> WELLNESS_PENDING transition, the deadline sweep
          (triggered by the wellness deadline passing, not by the original
          crash report) creates the EmergencyDispatch and decrements the
          circle's assistance_units_balance.
        test_recipe:
          setup:
            - "PROTECT circle (assistance_units_balance=4), one GRANTED adult member on an OPEN trip."
            - "A MAJOR crash (delta_v=20) is reported; wellness deadline is +600s."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: System
            - call: "POST /api/circles"
              payload: { name: "CascadeFam", subscription_tier: "PROTECT", billing_anchor_day: 1, owner_display_name: "Cas", owner_birthdate: "1980-06-06T00:00:00Z", owner_email: "cas@example.com" }
              as: Owner
              captures: { circle_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "POST /api/circles/${circle_id}/members/${owner_id}/fixes"
              payload: { recorded_at: "2026-09-01T20:00:00Z", lat: 37.7, lng: -122.4, accuracy_m: 20, speed_mps: 30.0, battery_pct: 85, phone_in_use: false, motion_context: "DRIVING" }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { trip_id: $.data.id }
            - call: "POST /api/circles/${circle_id}/members/${owner_id}/crash-events"
              payload: { trip_report_id: "${trip_id}", delta_v: 20.0, note: "hard impact" }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { crash_id: $.data.id, wellness_id: $.data.wellness_check_id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T20:10:01Z" }
              as: System
          trigger:
            - call: "POST /api/_sweeps/age-and-retention"
              payload: {}
              as: System
          assert:
            - "CrashEvent.${crash_id}.crash_status == ESCALATED"
            - "WellnessCheck.${wellness_id}.check_status == UNANSWERED"
            - "An EmergencyDispatch exists with crash_event_id == ${crash_id} and dispatch_status == PENDING_VERIFICATION"
            - "Circle.${circle_id}.assistance_units_balance == 3 (escalation consumed one unit)"
            - "CrashEvent.${crash_id}.version has advanced by >= 2 since creation"

      - name: consent_revoke_depth2_cascade
        grounds:
          - state_machines.Member (consent_state) GRANTED_to_REVOKED
          - state_machines.TripReport OPEN_to_ABANDONED
          - state_machines.PlaceAlert PENDING_DWELL_to_CANCELLED
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger: consent revoke on a
          member mutates CrashEvent (OPEN -> FALSE_ALARM), WellnessCheck
          (SENT -> CANCELLED), TripReport (OPEN -> ABANDONED), and
          PlaceAlert (PENDING_DWELL -> CANCELLED) — the revoke causes the
          crash transition which itself causes the wellness transition.
          Distinct trigger from the crash-detection cascade.
        test_recipe:
          setup:
            - "PLUS circle with one GRANTED adult member who has an OPEN trip AND a WELLNESS_PENDING crash on it."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: System
            - call: "POST /api/circles"
              payload: { name: "RevokeFam", subscription_tier: "PLUS", billing_anchor_day: 1, owner_display_name: "Rev", owner_birthdate: "1981-01-01T00:00:00Z", owner_email: "rev@example.com" }
              as: Owner
              captures: { circle_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "POST /api/circles/${circle_id}/members"
              payload: { display_name: "Rex", birthdate: "1990-04-04T00:00:00Z", email: "rex@example.com" }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { rex_id: $.data.id }
            - call: "POST /api/circles/${circle_id}/members/${rex_id}/consent/grant"
              payload: { scope: "FULL", monetization_opt_in: false }
              as: Member
              as_user_id: "${rex_id}"
            - call: "POST /api/circles/${circle_id}/members/${rex_id}/fixes"
              payload: { recorded_at: "2026-09-01T15:00:00Z", lat: 37.7, lng: -122.4, accuracy_m: 20, speed_mps: 30.0, battery_pct: 80, phone_in_use: false, motion_context: "DRIVING" }
              as: Member
              as_user_id: "${rex_id}"
              captures: { rex_trip: $.data.id }
            - call: "POST /api/circles/${circle_id}/members/${rex_id}/crash-events"
              payload: { trip_report_id: "${rex_trip}", delta_v: 18.0, note: "bump" }
              as: Member
              as_user_id: "${rex_id}"
              captures: { rex_crash: $.data.id, rex_wellness: $.data.wellness_check_id }
          trigger:
            - call: "POST /api/circles/${circle_id}/members/${rex_id}/consent/revoke"
              payload: {}
              as: Owner
              as_user_id: "${owner_id}"
          assert:
            - "Member.${rex_id}.consent_state == REVOKED"
            - "CrashEvent.${rex_crash}.crash_status == FALSE_ALARM (cascade from consent revoke)"
            - "WellnessCheck.${rex_wellness}.check_status == CANCELLED (second hop)"
            - "TripReport.${rex_trip}.trip_status == ABANDONED (parallel hop)"
            - "No EmergencyDispatch was created for crash ${rex_crash}"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_vs_business_safety_on_minor_consent_revoke
        grounds:
          - validations[priority=4]
          - validations[priority=8]
          - errors.ERR_INVALID_STATE
          - errors.ERR_MINOR_CONSENT_LOCKED
        distinguishing_aspect: |
          Category pair: state (priority 4) vs business_safety (priority 8).
          An ADMIN attempts to revoke a MINOR's consent while the MINOR is
          already in REVOKED state: the state check fires first because
          priority 4 < priority 8, so the response is ERR_INVALID_STATE, not
          ERR_MINOR_CONSENT_LOCKED — even though both rules would be
          violated.
        test_recipe:
          setup:
            - "PLUS circle, one MINOR member (age 14), consent initially GRANTED by OWNER, then revoked by OWNER (now REVOKED)."
            - "An ADMIN member exists."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: System
            - call: "POST /api/circles"
              payload: { name: "MinorFam", subscription_tier: "PLUS", billing_anchor_day: 1, owner_display_name: "Mom", owner_birthdate: "1980-07-07T00:00:00Z", owner_email: "mom@example.com" }
              as: Owner
              captures: { circle_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "POST /api/circles/${circle_id}/members"
              payload: { display_name: "Kid", birthdate: "2012-01-01T00:00:00Z", email: "kid@example.com" }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { kid_id: $.data.id }
            - call: "POST /api/circles/${circle_id}/members/${kid_id}/consent/grant"
              payload: { scope: "FULL", monetization_opt_in: false }
              as: Owner
              as_user_id: "${owner_id}"
            - call: "POST /api/circles/${circle_id}/members/${kid_id}/consent/revoke"
              payload: {}
              as: Owner
              as_user_id: "${owner_id}"
            - call: "POST /api/circles/${circle_id}/members"
              payload: { display_name: "Ad", birthdate: "1985-08-08T00:00:00Z", email: "ad@example.com" }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { admin_id: $.data.id }
            - call: "POST /api/circles/${circle_id}/members/${admin_id}/consent/grant"
              payload: { scope: "FULL", monetization_opt_in: false }
              as: Member
              as_user_id: "${admin_id}"
            - call: "POST /api/circles/${circle_id}/members/${admin_id}/promote"
              payload: {}
              as: Owner
              as_user_id: "${owner_id}"
          trigger:
            - call: "POST /api/circles/${circle_id}/members/${kid_id}/consent/revoke"
              payload: {}
              as: Admin
              as_user_id: "${admin_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_INVALID_STATE (priority 4 wins over priority 8)"
            - "error_id != ERR_MINOR_CONSENT_LOCKED"

      - name: business_safety_vs_business_fiscal_on_frozen_circle_fix
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - errors.ERR_CIRCLE_FROZEN
          - errors.ERR_CONSENT_NOT_GRANTED
        distinguishing_aspect: |
          Category pair: state (priority 5 — circle FROZEN) vs
          business_safety (priority 7 — consent not granted). A member with
          REVOKED consent posts a fix to a FROZEN circle. The FROZEN gate
          fires first: the response is ERR_CIRCLE_FROZEN, not
          ERR_CONSENT_NOT_GRANTED — even though both apply.
        test_recipe:
          setup:
            - "FREE circle that has been suspended (posture FROZEN)."
            - "One member whose consent is REVOKED."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: System
            - call: "POST /api/circles"
              payload: { name: "FrozenFam", subscription_tier: "FREE", billing_anchor_day: 1, owner_display_name: "Fro", owner_birthdate: "1982-02-02T00:00:00Z", owner_email: "fro@example.com" }
              as: Owner
              captures: { circle_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "POST /api/circles/${circle_id}/members"
              payload: { display_name: "Nix", birthdate: "1990-01-01T00:00:00Z", email: "nix@example.com" }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { nix_id: $.data.id }
            - call: "POST /api/circles/${circle_id}/members/${nix_id}/consent/grant"
              payload: { scope: "FULL", monetization_opt_in: false }
              as: Member
              as_user_id: "${nix_id}"
            - call: "POST /api/circles/${circle_id}/members/${nix_id}/consent/revoke"
              payload: {}
              as: Member
              as_user_id: "${nix_id}"
            - call: "POST /api/circles/${circle_id}/subscription/simulate-suspend"
              payload: {}
              as: System
          trigger:
            - call: "POST /api/circles/${circle_id}/members/${nix_id}/fixes"
              payload: { recorded_at: "2026-09-01T00:00:30Z", lat: 37.7, lng: -122.4, accuracy_m: 20, speed_mps: 0.0, battery_pct: 80, phone_in_use: false, motion_context: "STILL" }
              as: Member
              as_user_id: "${nix_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_CIRCLE_FROZEN (priority 5 wins over priority 7)"
            - "error_id != ERR_CONSENT_NOT_GRANTED"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: crash_severity_lower_boundary_inclusive
        grounds:
          - calculations.crash_severity
          - validations[priority=18]
          - errors.ERR_CRASH_BELOW_THRESHOLD
        distinguishing_aspect: |
          Severity ladder uses `>=` on the lower edge and `<` on the upper
          edge: delta_v = 8.0 exactly is MINOR (accepted), delta_v = 7.99 is
          rejected with ERR_CRASH_BELOW_THRESHOLD. The two probes are
          distinguishable by exactly 0.01 m/s^2.
        test_recipe:
          setup:
            - "PROTECT circle, one GRANTED adult member with an OPEN trip."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: System
            - call: "POST /api/circles"
              payload: { name: "BoundFam", subscription_tier: "PROTECT", billing_anchor_day: 1, owner_display_name: "Bou", owner_birthdate: "1983-03-03T00:00:00Z", owner_email: "bou@example.com" }
              as: Owner
              captures: { circle_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "POST /api/circles/${circle_id}/members/${owner_id}/fixes"
              payload: { recorded_at: "2026-09-01T10:00:00Z", lat: 37.7, lng: -122.4, accuracy_m: 20, speed_mps: 30.0, battery_pct: 90, phone_in_use: false, motion_context: "DRIVING" }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { trip_id: $.data.id }
          trigger:
            - call: "POST /api/circles/${circle_id}/members/${owner_id}/crash-events"
              payload: { trip_report_id: "${trip_id}", delta_v: 7.99, note: "below" }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { err: $.data.error_id }
            - call: "POST /api/circles/${circle_id}/members/${owner_id}/crash-events"
              payload: { trip_report_id: "${trip_id}", delta_v: 8.0, note: "at boundary" }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { crash_id: $.data.id }
          assert:
            - "delta_v = 7.99 returns HTTP 422 with error_id == ERR_CRASH_BELOW_THRESHOLD and creates no CrashEvent"
            - "delta_v = 8.0 returns HTTP 201 with CrashEvent.severity == MINOR"

      - name: retention_cutoff_inclusive_boundary
        grounds:
          - calculations.retention_window_cutoff
          - entities.LocationFix.fields.fix_status
        distinguishing_aspect: |
          Retention cutoff uses `>=`: a fix recorded exactly
          history_retention_days before now is INCLUDED, while one recorded
          1 second earlier is excluded. Distinct metric (time-window
          inclusion) and distinct endpoint (GET list) from the crash
          severity boundary.
        test_recipe:
          setup:
            - "FREE circle (retention 7 days). One GRANTED member posts two STILL fixes on 2026-09-01: fix_in at 12:00:00Z, fix_out at 11:59:59Z."
            - "Clock advanced to 2026-09-08T12:00:00Z (exactly 7 days after fix_in; fix_out is 1 second outside the window)."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: System
            - call: "POST /api/circles"
              payload: { name: "RetFam", subscription_tier: "FREE", billing_anchor_day: 1, owner_display_name: "Ret", owner_birthdate: "1984-04-04T00:00:00Z", owner_email: "ret@example.com" }
              as: Owner
              captures: { circle_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T11:59:59Z" }
              as: System
            - call: "POST /api/circles/${circle_id}/members/${owner_id}/fixes"
              payload: { recorded_at: "2026-09-01T11:59:59Z", lat: 37.70, lng: -122.40, accuracy_m: 20, speed_mps: 0.0, battery_pct: 90, phone_in_use: false, motion_context: "STILL" }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { fix_out_id: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T12:00:00Z" }
              as: System
            - call: "POST /api/circles/${circle_id}/members/${owner_id}/fixes"
              payload: { recorded_at: "2026-09-01T12:00:00Z", lat: 37.70, lng: -122.40, accuracy_m: 20, speed_mps: 0.0, battery_pct: 90, phone_in_use: false, motion_context: "STILL" }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { fix_in_id: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-08T12:00:00Z" }
              as: System
          trigger:
            - call: "GET /api/circles/${circle_id}/members/${owner_id}/fixes"
              payload: {}
              as: Owner
              as_user_id: "${owner_id}"
          assert:
            - "fix ${fix_in_id} (recorded exactly 7 days before now) IS present in the list (boundary `>=` includes it)"
            - "fix ${fix_out_id} (recorded 7 days + 1 second before now) is NOT present"
            - "total_count == 1"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: crash_event_requires_trip_open
        grounds:
          - validations[priority=15]
          - state_machines.TripReport
          - state_machines.CrashEvent
          - errors.ERR_TRIP_NOT_OPEN
        distinguishing_aspect: |
          Entity pair CrashEvent -> TripReport: a CrashEvent may only be
          opened while the member has an OPEN TripReport. The trip's state
          gates the crash's creation. Pair (CrashEvent, TripReport).
        test_recipe:
          setup:
            - "PROTECT circle, one GRANTED adult member whose trip was opened and then CLOSED (a STILL fix terminated it)."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: System
            - call: "POST /api/circles"
              payload: { name: "TripDepFam", subscription_tier: "PROTECT", billing_anchor_day: 1, owner_display_name: "Td", owner_birthdate: "1980-01-01T00:00:00Z", owner_email: "td@example.com" }
              as: Owner
              captures: { circle_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "POST /api/circles/${circle_id}/members/${owner_id}/fixes"
              payload: { recorded_at: "2026-09-01T10:00:00Z", lat: 37.7, lng: -122.4, accuracy_m: 20, speed_mps: 30.0, battery_pct: 90, phone_in_use: false, motion_context: "DRIVING" }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { trip_id: $.data.id }
            - call: "POST /api/circles/${circle_id}/members/${owner_id}/fixes"
              payload: { recorded_at: "2026-09-01T10:05:00Z", lat: 37.7, lng: -122.4, accuracy_m: 20, speed_mps: 0.0, battery_pct: 89, phone_in_use: false, motion_context: "STILL" }
              as: Owner
              as_user_id: "${owner_id}"
          trigger:
            - call: "POST /api/circles/${circle_id}/members/${owner_id}/crash-events"
              payload: { trip_report_id: "${trip_id}", delta_v: 20.0, note: "after close" }
              as: Owner
              as_user_id: "${owner_id}"
