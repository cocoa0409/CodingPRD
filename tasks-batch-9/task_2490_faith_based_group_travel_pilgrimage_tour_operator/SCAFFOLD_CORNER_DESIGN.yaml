        excluded_because:
          difficulty_instance: non_linear_state_machine / pilgrim_three_parallel_dimensions_advance_independently
          rationale: "The independence of booking_status, payment_status and protection_status is asserted end-to-end by the named §1.8 instance."

      - name: advisory_suspension_cascades_down_the_itinerary
        claim_type: cascade_down
        grounds:
          - state_machines.RiskAdvisory.DRAFT_to_PUBLISHED
        excluded_because:
          difficulty_instance: transitive_cascade / advisory_publish_four_hop_cascade
          rationale: "Service cancellation, air-block release, ticket clearing and leader re-accrual under a DO_NOT_TRAVEL publication are all asserted by the named §1.8 instance."

      - name: payment_reversal_undoes_every_allocation_side_effect
