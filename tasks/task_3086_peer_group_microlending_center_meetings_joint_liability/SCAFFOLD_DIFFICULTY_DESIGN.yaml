            - *d_app1_v4
            - *d_app1_disb
            - *d_loan1
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-08T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /peer-groups/${g2_id}/members"
              payload: { member_id: "${m1}" }
              as: FieldOfficer
              captures: { err_safety_first: $.data.error_id }
          assert:
            - "Member.${m1}.status == BLACKLISTED (loan defaulted at the sweep)"
            - "the trigger call returns 403 with error_id ERR_MEMBER_BLACKLISTED (safety, priority 5)"
            - "the response is NOT 422 ERR_MEMBER_ALREADY_IN_GROUP even though Member.${m1}.peer_group_id is still set (referential, priority 6)"
            - "PeerGroup.${g2_id}.member_count == 4 (unchanged)"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: delinquency_day_7_vs_day_8_boundary
        grounds:
          - calculations.delinquency_evaluation
          - state_machines.Loan.ACTIVE_to_DELINQUENT
        distinguishing_aspect: |
          Metric: days_past_due (numeric threshold, >= 8). At exactly 7 days
          past the first due the sweep leaves the loan ACTIVE; at exactly 8
          days it flips to DELINQUENT with installments_missed == 1 — the
          >= vs > boundary is reachable through POST /_clock/set_current_utc.
        test_recipe:
          setup:
            - "M1 with ACTIVE cycle-1 loan disbursed 2026-09-01T00:00:00Z; first due 2026-09-08T00:00:00Z; no collections."
          setup_api_calls:
            - *d_clock0
            - *d_branch
            - *d_mgr
            - *d_center
            - *d_g1
            - *d_m1
            - *d_p1
            - *d_p2
            - *d_p3
            - *d_p4
            - *d_add_m1
            - *d_add_p1
            - *d_add_p2
            - *d_add_p3
            - *d_add_p4
            - *d_tr1
            - *d_tr1c
            - *d_tr2
            - *d_tr2c
            - *d_app1
            - *d_app1s
            - *d_app1_v1
            - *d_app1_v2
            - *d_app1_v3
            - *d_app1_v4
            - *d_app1_disb
            - *d_loan1
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: ProgramAdmin
            - call: "GET /loans/${loan1}"
              payload: {}
              as: ProgramAdmin
              captures: { loan_day7: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-16T00:00:00Z" }
              as: ProgramAdmin
            - call: "GET /loans/${loan1}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "after the 2026-09-15 sweep (7 days past due): Loan.${loan1}.status == ACTIVE and installments_missed == 0"
            - "after the 2026-09-16 sweep (exactly 8 days past due): Loan.${loan1}.status == DELINQUENT and installments_missed == 1"
            - "Loan.${loan1}.next_due_date == 2026-09-15T00:00:00Z after the flip (advanced one week for the consumed due)"

      - name: absence_streak_1_vs_2_boundary_at_close
        grounds:
          - state_machines.CenterMeeting.OPEN_to_CLOSED
          - entities.Member.fields.consecutive_absence_streak
          - validations[priority=8]
        distinguishing_aspect: |
          Metric: consecutive_absence_streak (zero-count/integer boundary,
          strike fires at exactly 2). A member absent at ONE closed meeting
          keeps streak 1, strike 0, and may still submit an application;
          after a SECOND consecutive absence the strike fires and submission
          fails with ERR_ATTENDANCE_INELIGIBLE — reachable through
          POST /center-meetings/{id}/close and /loan-applications/{id}/submit,
          a different metric and endpoint than the delinquency clock boundary.
        test_recipe:
          setup:
            - "Group ACTIVE; member P1 absent (unmarked) at the closed 2026-09-08 meeting (streak 1, strike 0); P1 holds a DRAFT application."
          setup_api_calls:
            - *d_clock0
            - *d_branch
            - *d_mgr
            - *d_center
            - *d_g1
            - *d_m1
            - *d_p1
            - *d_p2
            - *d_p3
            - *d_p4
            - *d_add_m1
            - *d_add_p1
            - *d_add_p2
            - *d_add_p3
            - *d_add_p4
            - *d_tr1
            - *d_tr1c
            - *d_tr2
            - *d_tr2c
            - *d_mt1
            - *d_mt1o
            - *d_att_m1
            - *d_att_p2
            - *d_att_p3
            - *d_att_p4
            - *d_mt1c
            - call: "POST /peer-groups/${g1_id}/loan-applications"
              payload: { member_id: "${p1}", requested_amount_cents: 50000 }
              as: FieldOfficer
              captures: { app_streak: $.data.id }
          trigger:
            - call: "POST /loan-applications/${app_streak}/submit"
              payload: {}
              as: FieldOfficer
              captures: { submit_ok: $.data.status }
            - call: "POST /center-meetings"
              payload: { center_id: "${center_id}", scheduled_start: "2026-09-15T10:00:00Z", scheduled_end: "2026-09-15T11:00:00Z" }
              as: CenterManager
              as_user_id: "${mgr_id}"
              captures: { mt_s2: $.data.id }
            - call: "POST /center-meetings/${mt_s2}/open"
              payload: {}
              as: CenterManager
              as_user_id: "${mgr_id}"
            - call: "POST /center-meetings/${mt_s2}/attendance"
              payload: { member_id: "${m1}", present: true }
              as: CenterManager
              as_user_id: "${mgr_id}"
            - call: "POST /center-meetings/${mt_s2}/attendance"
              payload: { member_id: "${p2}", present: true }
              as: CenterManager
              as_user_id: "${mgr_id}"
            - call: "POST /center-meetings/${mt_s2}/attendance"
              payload: { member_id: "${p3}", present: true }
              as: CenterManager
              as_user_id: "${mgr_id}"
            - call: "POST /center-meetings/${mt_s2}/attendance"
              payload: { member_id: "${p4}", present: true }
              as: CenterManager
              as_user_id: "${mgr_id}"
            - call: "POST /center-meetings/${mt_s2}/close"
              payload: {}
              as: CenterManager
              as_user_id: "${mgr_id}"
          assert:
            - "with streak == 1 the first trigger call succeeds: LoanApplication.${app_streak}.status == VOTING (streak < 2 does not block)"
            - "after the second consecutive absence: Member.${p1}.consecutive_absence_streak == 2 and attendance_strikes == 1"
            - "the strike cascade fired: LoanApplication.${app_streak}.status == REJECTED (VOTING -> REJECTED at strike)"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: disbursement_blocked_when_group_restricted
        grounds:
          - state_machines.LoanApplication.APPROVED_to_DISBURSED
          - state_machines.PeerGroup.ACTIVE_to_RESTRICTED
          - errors.ERR_GROUP_RESTRICTED
        distinguishing_aspect: |
          Entity pair LoanApplication -> PeerGroup: an APPROVED application
          cannot disburse while the applicant's group is RESTRICTED by a
          peer's delinquency — joint liability made executable. Approval
          remains valid; the fiscal gate on group state blocks disbursement
          until the peer cures.
        test_recipe:
          setup:
            - "Group G1 ACTIVE. M1 holds an ACTIVE loan. P1's application reached APPROVED (4 unanimous votes) on 2026-09-01. Clock then advanced to 2026-09-16: M1's loan flips DELINQUENT, group -> RESTRICTED."
          setup_api_calls:
            - *d_clock0
            - *d_branch
            - *d_mgr
            - *d_center
            - *d_g1
            - *d_m1
            - *d_p1
            - *d_p2
            - *d_p3
            - *d_p4
            - *d_add_m1
            - *d_add_p1
            - *d_add_p2
            - *d_add_p3
            - *d_add_p4
            - *d_tr1
            - *d_tr1c
            - *d_tr2
            - *d_tr2c
            - *d_app1
            - *d_app1s
            - *d_app1_v1
            - *d_app1_v2
            - *d_app1_v3
            - *d_app1_v4
            - *d_app1_disb
            - *d_loan1
            - call: "POST /peer-groups/${g1_id}/loan-applications"
              payload: { member_id: "${p1}", requested_amount_cents: 50000 }
              as: FieldOfficer
              captures: { app_p1c: $.data.id }
            - call: "POST /loan-applications/${app_p1c}/submit"
              payload: {}
              as: FieldOfficer
            - call: "POST /loan-applications/${app_p1c}/votes"
              payload: { decision: "APPROVE" }
              as: Member
              as_user_id: "${m1}"
            - call: "POST /loan-applications/${app_p1c}/votes"
              payload: { decision: "APPROVE" }
              as: Member
              as_user_id: "${p2}"
            - call: "POST /loan-applications/${app_p1c}/votes"
              payload: { decision: "APPROVE" }
              as: Member
              as_user_id: "${p3}"
            - call: "POST /loan-applications/${app_p1c}/votes"
              payload: { decision: "APPROVE" }
              as: Member
              as_user_id: "${p4}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-16T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /loan-applications/${app_p1c}/disburse"
              payload: {}
              as: BranchManager
              captures: { err_blocked: $.data.error_id }
          assert:
            - "PeerGroup.${g1_id}.status == RESTRICTED (M1's loan DELINQUENT)"
            - "the trigger call returns 409 with error_id ERR_GROUP_RESTRICTED"
            - "LoanApplication.${app_p1c}.status == APPROVED (blocked disburse does not expire or reject it)"

      - name: vote_cast_requires_application_voting_state
        grounds:
          - state_machines.LoanApplication
          - errors.ERR_APPLICATION_NOT_VOTING
          - entities.ConsensusVote.fields.loan_application_id
        distinguishing_aspect: |
          Entity pair ConsensusVote -> LoanApplication (different pair than
          LoanApplication -> PeerGroup): a vote cast against a DRAFT
          application (never submitted) is rejected with
          ERR_APPLICATION_NOT_VOTING — the child event's legality is gated on
          the parent application's state, independent of group state.
        test_recipe:
          setup:
            - "Group ACTIVE; application for M1 created but still DRAFT."
          setup_api_calls:
            - *d_clock0
            - *d_branch
            - *d_mgr
            - *d_center
            - *d_g1
            - *d_m1
            - *d_p1
            - *d_p2
            - *d_p3
            - *d_p4
            - *d_add_m1
            - *d_add_p1
            - *d_add_p2
            - *d_add_p3
            - *d_add_p4
            - *d_tr1
            - *d_tr1c
            - *d_tr2
            - *d_tr2c
            - *d_app1
          trigger:
            - call: "POST /loan-applications/${app1}/votes"
              payload: { decision: "APPROVE" }
              as: Member
              as_user_id: "${p1}"
              captures: { err_not_voting: $.data.error_id }
          assert:
            - "the trigger call returns 409 with error_id ERR_APPLICATION_NOT_VOTING"
            - "GET /loan-applications/${app1}/votes returns an empty array"
            - "LoanApplication.${app1}.status == DRAFT (unchanged)"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: center_meeting_half_open_adjacency_allowed_overlap_rejected
        grounds:
          - errors.ERR_MEETING_OVERLAP
          - entities.CenterMeeting.fields.scheduled_start
          - validations[priority=7]
        distinguishing_aspect: |
          Interval semantics A (half-open [start, end)) on the Center
          resource: a meeting ending at 11:00 and another starting at 11:00
          are adjacent and BOTH succeed; a third meeting starting at 10:30
          overlaps the first and is rejected with ERR_MEETING_OVERLAP.
          Adjacency is allowed — the exact opposite of the training buffer
          rule.
        test_recipe:
          setup:
            - "Branch, manager, Tuesday center; no meetings yet."
          setup_api_calls:
            - *d_clock0
            - *d_branch
            - *d_mgr
            - *d_center
          trigger:
            - call: "POST /center-meetings"
              payload: { center_id: "${center_id}", scheduled_start: "2026-09-08T10:00:00Z", scheduled_end: "2026-09-08T11:00:00Z" }
              as: CenterManager
              as_user_id: "${mgr_id}"
              captures: { mt_a: $.data.id }
            - call: "POST /center-meetings"
              payload: { center_id: "${center_id}", scheduled_start: "2026-09-08T11:00:00Z", scheduled_end: "2026-09-08T12:00:00Z" }
              as: CenterManager
              as_user_id: "${mgr_id}"
              captures: { mt_b: $.data.id }
            - call: "POST /center-meetings"
              payload: { center_id: "${center_id}", scheduled_start: "2026-09-08T10:30:00Z", scheduled_end: "2026-09-08T11:30:00Z" }
              as: CenterManager
              as_user_id: "${mgr_id}"
              captures: { err_overlap: $.data.error_id }
          assert:
            - "the first two trigger calls return 201 (adjacent meetings [10:00,11:00) and [11:00,12:00) do not overlap under half-open semantics)"
            - "the third trigger call returns 409 with error_id ERR_MEETING_OVERLAP ([10:30,11:30) intersects both existing meetings)"

      - name: training_slot_buffer_rejects_20_min_gap_allows_40
        grounds:
          - errors.ERR_TRAINING_SLOT_OVERLAP
          - entities.GroupTrainingSession.fields.start_time
          - validations[priority=7]
        distinguishing_aspect: |
          Interval semantics B (closed intervals + mandatory 30-minute
          buffer) on the CenterManager resource — a different resource and a
          different geometric rule than the meeting half-open rule: a
          session starting 20 minutes after another session ends is rejected
          (inside the buffer), while 40 minutes after is accepted. Adjacency
          (gap 0) is REJECTED here, opposite of the meeting rule.
        test_recipe:
          setup:
            - "Branch, manager, center; groups G1 and G2 each with 5 members (FORMING). Manager already holds session 09:00-10:00 on 2026-09-02 for G1."
          setup_api_calls:
            - *d_clock0
            - *d_branch
            - *d_mgr
            - *d_center
            - *d_g1
            - *d_g2
            - *d_m1
            - *d_p1
            - *d_p2
            - *d_p3
            - *d_p4
            - *d_m2
            - *d_q1
            - *d_q2
            - *d_q3
            - *d_q4
            - *d_add_m1
            - *d_add_p1
            - *d_add_p2
            - *d_add_p3
            - *d_add_p4
            - *d_add_m2
            - *d_add_q1
            - *d_add_q2
            - *d_add_q3
            - *d_add_q4
            - *d_tr1
          trigger:
            - call: "POST /group-training-sessions"
              payload: { peer_group_id: "${g2_id}", center_manager_id: "${mgr_id}", start_time: "2026-09-02T10:20:00Z", end_time: "2026-09-02T11:20:00Z" }
              as: CenterManager
              as_user_id: "${mgr_id}"
              captures: { err_buffer: $.data.error_id }
            - call: "POST /group-training-sessions"
              payload: { peer_group_id: "${g2_id}", center_manager_id: "${mgr_id}", start_time: "2026-09-02T10:40:00Z", end_time: "2026-09-02T11:40:00Z" }
              as: CenterManager
              as_user_id: "${mgr_id}"
              captures: { tr_ok: $.data.id }
          assert:
            - "the first trigger call returns 409 with error_id ERR_TRAINING_SLOT_OVERLAP (10:20 start is 20 min after the 10:00 end — inside the 30-minute buffer)"
            - "the second trigger call returns 201 (10:40 start is 40 min after — outside the buffer)"
            - "GroupTrainingSession.${tr_ok}.status == SCHEDULED"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: post_and_void_leave_loan_outstanding_unchanged
        grounds:
          - state_machines.RepaymentTransaction.POSTED_to_VOIDED
          - calculations.collection_waterfall
          - entities.Loan.fields.principal_outstanding_cents
        distinguishing_aspect: |
          Conserved quantity: Loan.principal_outstanding_cents (monetary
          ledger). Posting a 4801c collection drops outstanding from 110600
          to 105999 and credits savings 200; voiding the transaction restores
          outstanding to exactly 110600 and savings to exactly 0 — the
          forward/compensating pair leaves the named quantity bit-identical.
        test_recipe:
          setup:
            - "M1 with ACTIVE cycle-1 loan (outstanding 110600c); meeting OPEN, all members present."
          setup_api_calls:
            - *d_clock0
            - *d_branch
            - *d_mgr
            - *d_center
            - *d_g1
            - *d_m1
            - *d_p1
            - *d_p2
            - *d_p3
            - *d_p4
            - *d_add_m1
            - *d_add_p1
            - *d_add_p2
            - *d_add_p3
            - *d_add_p4
            - *d_tr1
            - *d_tr1c
            - *d_tr2
            - *d_tr2c
            - *d_app1
            - *d_app1s
            - *d_app1_v1
            - *d_app1_v2
            - *d_app1_v3
            - *d_app1_v4
            - *d_app1_disb
            - *d_loan1
            - *d_mt1
            - *d_mt1o
            - *d_att_m1
            - *d_att_p1
            - *d_att_p2
            - *d_att_p3
            - *d_att_p4
          trigger:
            - call: "POST /center-meetings/${mt1}/collections"
              payload: { member_id: "${m1}", loan_id: "${loan1}", amount_cents: 4801 }
              as: CenterManager
              as_user_id: "${mgr_id}"
              captures: { txn_inv: $.data.id }
            - call: "GET /loans/${loan1}"
              payload: {}
              as: BranchManager
              captures: { outstanding_after_post: $.data.principal_outstanding_cents }
            - call: "POST /repayment-transactions/${txn_inv}/void"
              payload: {}
              as: BranchManager
            - call: "GET /loans/${loan1}"
              payload: {}
              as: BranchManager
              captures: { outstanding_after_void: $.data.principal_outstanding_cents }
          assert:
            - "after posting: Loan.${loan1}.principal_outstanding_cents == 105999 (110600 - 4601)"
            - "after voiding: Loan.${loan1}.principal_outstanding_cents == 110600 (exact restoration)"
            - "SavingsAccount of Member.${m1}: balance_cents == 200 after posting, == 0 after voiding"
            - "Loan.${loan1}.installments_on_time == 0 after the void (counter reversal, not just balance)"

      - name: center_reassignment_conserves_branch_total_caseload
        grounds:
          - calculations.caseload_recompute
          - endpoints.PATCH_/centers/{id}
          - entities.Branch.fields.total_manager_caseload
        distinguishing_aspect: |
          Conserved quantity: Branch.total_manager_caseload (headcount, a
          different conserved type than the monetary loan ledger). Moving the
          center (with its 5-member group) from manager A to manager B shifts
          both managers' current_caseload by exactly 5 in opposite directions
          and leaves the branch total invariant.
        test_recipe:
          setup:
            - "Branch with managers A and B; center under A with one ACTIVE group of 5 members; A.current_caseload == 5, B.current_caseload == 0, branch total == 5."
          setup_api_calls:
            - *d_clock0
            - *d_branch
            - *d_mgr
            - *d_center
            - *d_g1
            - *d_m1
            - *d_p1
            - *d_p2
            - *d_p3
            - *d_p4
            - *d_add_m1
            - *d_add_p1
            - *d_add_p2
            - *d_add_p3
            - *d_add_p4
            - *d_tr1
            - *d_tr1c
            - *d_tr2
            - *d_tr2c
            - call: "POST /center-managers"
              payload: { branch_id: "${branch_id}", full_name: "Second Manager", hired_on: "2026-08-01" }
              as: ProgramAdmin
              captures: { mgr_b: $.data.id }
          trigger:
            - call: "PATCH /centers/${center_id}"
              payload: { center_manager_id: "${mgr_b}" }
              as: ProgramAdmin
          assert:
            - "CenterManager.${mgr_id}.current_caseload == 0 after reassignment"
            - "CenterManager.${mgr_b}.current_caseload == 5 after reassignment"
            - "Branch.${branch_id}.total_manager_caseload == 5 before AND after (conserved)"
