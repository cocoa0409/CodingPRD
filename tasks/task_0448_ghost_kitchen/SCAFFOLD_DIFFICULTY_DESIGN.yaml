          - entities.KitchenLease.fields.status
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger: deactivating the brand (A) terminates each ACTIVE
          KitchenLease for that brand (B, caused by A) — origin transition (brand deactivate) differs
          from the route trigger of the depth-3 cascade.
