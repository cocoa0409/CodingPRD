              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
            - call: "POST /inspection-reports"
              payload: { report_number: "OH2026070416", inspection_state: "OH", inspection_level: 2, inspection_start: "2026-07-01T14:00:00Z", inspection_end: "2026-07-01T15:00:00Z", vehicle_vin: "1FUJA6CK21LK00419", attributed_carrier_id: "${c1_id}", selection_source: "RANDOM", driver_id: "${d1_id}" }
              as: StateInspectionOfficer
              as_user_id: "officer_ohio_1"
              captures: { r1_id: $.data.id }
            - call: "POST /inspection-reports/${r1_id}/violations"
              payload: { violation_code_id: "${vc_ud5_id}", unit_type: "DRIVER", driver_id: "${d1_id}" }
              as: StateInspectionOfficer
              as_user_id: "officer_ohio_1"
