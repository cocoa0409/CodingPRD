            - call: "POST /hie/participants/${pV2_id}/onboarding-transitions"
              payload: { action: "EXECUTE_AGREEMENT", agreement_version: "DURSA-2026.1", signed_at: "2026-08-01T00:00:00Z" }
              as: HieAdmin
              as_user_id: "admin-legal-1"
              captures: { pV2_ver: $.data.version }
            - call: "POST /hie/participants/${pV2_id}/data-feeds"
              payload: { feed_type: "ADT", expected_participant_version: "${pV2_ver}" }
              as: HieAdmin
              captures: { feedV2_id: $.data.id }
          trigger:
            - call: "POST /hie/data-feeds/${feedV2_id}/quality-samples"
              payload: { period_start: "2026-06-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", messages_received: 1000, messages_rejected: 400, required_fields_missing_count: 600, duplicate_count: 1000, timeliness_p95_seconds: 300 }
              as: HieAdmin
              captures: { sampV2_id: $.data.id, sampV2_rate: $.data.reject_rate }
            - call: "GET /hie/data-feeds/${feedV2_id}"
              payload: {}
              as: HieAdmin
              captures: { feedV2_status: $.data.status, feedV2_reason: $.data.status_reason, feedV2_count: $.data.sample_count }
            - call: "GET /hie/participants/${pV2_id}/scorecard"
              payload: {}
              as: HieAdmin
              captures: { scV2_completeness: $.data.completeness_component, scV2_duplicate: $.data.duplicate_component, scV2_timeliness: $.data.timeliness_component, scV2_base: $.data.base_quality_score, scV2_penalty: $.data.penalty_points, scV2_score: $.data.quality_score, scV2_grade: $.data.grade }
          assert:
            - "${sampV2_rate} == 0.4000"
            - "${feedV2_status} == DEGRADED"
            - "${feedV2_reason} == REJECT_RATE_BREACH"
            - "${feedV2_count} == 1"
            - "${scV2_completeness} == 40.00"
            - "${scV2_duplicate} == 0.00"
            - "${scV2_timeliness} == 100"
            - "${scV2_base} == 55.00"
            - "${scV2_penalty} == 6"
            - "${scV2_score} == 49.00"
            - "${scV2_grade} == D"
      - name: unauthenticated_and_schema_checks_outrank_the_referential_lookup
        claim_type: Priority Ordering
        grounds:
          - validations.priority_1
          - validations.priority_6
          - validations.priority_7
          - errors.ERR_UNAUTHENTICATED
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: |
          Both requests address the same non-existent participant id, so both would produce
          ERR_PARTICIPANT_NOT_FOUND if the referential check at priority 7 ran first. Sending no
          X-User-Role must instead return ERR_UNAUTHENTICATED (401, priority 1), and a well-authenticated
          request that omits the required `profile` field must return ERR_INVALID_REQUEST (422, priority
          6). Neither response may leak the existence or absence of the id.
        test_recipe:
          setup:
            - "No fixtures. 00000000-0000-4000-8000-000000000000 is not a stored Participant id."
          setup_api_calls: []
          trigger:
            - call: "GET /hie/participants/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: NONE
              captures: { errV3_a: $.data.error_id }
            - call: "POST /hie/participants/00000000-0000-4000-8000-000000000000/conformance-tests"
              payload: { scheduled_start: "2026-08-01T00:00:00Z", scheduled_end: "2026-08-01T06:00:00Z" }
              as: HieAdmin
              captures: { errV3_b: $.data.error_id }
            - call: "GET /hie/participants/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: HieAdmin
              captures: { errV3_c: $.data.error_id }
          assert:
            - "${errV3_a} == ERR_UNAUTHENTICATED: the `as: NONE` call sends no X-User-Role header at all"
            - "${errV3_b} == ERR_INVALID_REQUEST"
            - "${errV3_c} == ERR_PARTICIPANT_NOT_FOUND: with auth present and the payload well formed, priority 7 is finally reached"
      - name: conduit_org_type_error_outranks_the_subscription_scope_mismatch
        claim_type: Priority conflict
        grounds:
          - validations.priority_22
          - validations.priority_27
          - errors.ERR_CONDUIT_ORG_TYPE_INVALID
          - errors.ERR_SUBSCRIPTION_SCOPE_MISMATCH
        distinguishing_aspect: |
          A PUBLIC_HEALTH_CONDUIT request carrying a cluster_id violates priority 22 (wrong org_type) AND
          priority 27 (cluster_id on a non-CLUSTER scope). The lower number must win, so a CLINIC
          participant gets ERR_CONDUIT_ORG_TYPE_INVALID. Fixing only the org_type - the same request from
          a PUBLIC_HEALTH participant - then exposes ERR_SUBSCRIPTION_SCOPE_MISMATCH, proving both rules
          are live and correctly ordered rather than one masking the other permanently.
        test_recipe:
          setup:
            - "A PROBABILISTIC_ONLY generation is ACTIVE."
            - "A CLINIC participant and a PUBLIC_HEALTH participant are both at CONFORMANCE_TESTING; the CLINIC participant has contributed one record, which created one ACTIVE cluster."
