            - "response.data.error_id == ERR_KIT_DOUBLE_BOOKED"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: cancel_deposit_refund_money_conservation
        grounds:
          - calculations.cancellation_settlement
          - state_machines.Event.CONFIRMED_to_CANCELLED
          - entities.Event.fields.amount_paid_cents
          - entities.Payment.fields.payment_type
        distinguishing_aspect: "Conserved quantity = money: cancelling a CONFIRMED event with a 138720 deposit creates a CANCELLATION_FEE (69360) and a REFUND (69360) such that deposit_paid - refund == cancellation_fee, leaving Event.amount_paid_cents == 69360 with zero drift."
