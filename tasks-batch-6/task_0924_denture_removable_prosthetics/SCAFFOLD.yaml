scenario: |
  924. Denture & Removable-Prosthetics Clinic: exam & impression/scan, try-in milestone (wax/finish),
  fabrication & lab coordination, delivery & adjustment, reline/repair & warranty, insurance & payment plan,
  recall, remake

domain_name: "denture-removable-prosthetics"
api_prefix: "/prosthetics"

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: hybrid
  state_machine_shape: parallel
  # 14 declared axes. Non-linear shapes present: compound (ProsthesisCase derived from CaseArch),
  # cyclic (CaseArch remake loop, TryInMilestone ADJUST_REQUESTED->PENDING_APPROVAL,
  # LabCase QC_FAILED->RESENT->RETURNED, Prosthesis recall NO_ACTION reschedule,
  # PaymentPlan DELINQUENT->ACTIVE cure, Installment MISSED->PAID),
  # parallel (Prosthesis carries warranty_status x recall_status as independent axes on one row),
  # branching fan-out (ImpressionRecord 3-band review, TryInMilestone 3-way decide,
  # WarrantyClaim 4-way fault verdict with an INDETERMINATE re-entrant leg,
  # Predetermination 3-way determination, PostDeliveryService chairside-vs-lab fork).

  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# GLOBAL CONSTANT REGISTER
# Every threshold, window, ceiling, interval, fee, rate and band boundary used
# anywhere in this scaffold has a concrete value here. No named constant in any
# later section is left without a value.
# =============================================================================
constants:
  # --- logical clock -------------------------------------------------------
  DEFAULT_CLOCK_UTC: "2026-05-01T00:00:00Z"

  # --- impression / scan quality bands (integer score 0..100) --------------
  IMPRESSION_ACCEPT_MIN: 85            # score >= 85 -> ACCEPTED
  IMPRESSION_PROVISIONAL_MIN: 70       # 70 <= score < 85 -> PROVISIONAL_ACCEPTED
  IMPRESSION_SCORE_MIN: 0
  IMPRESSION_SCORE_MAX: 100
  IMPRESSION_RETAKE_CEILING: 3         # max 3 retakes per CaseArch; the 4th is rejected

  # --- try-in milestone ----------------------------------------------------
  TRYIN_ADJUST_CEILING: 2              # max 2 ADJUST decisions per milestone row

  # --- lab coordination ----------------------------------------------------
  LAB_STANDARD_TURNAROUND_DAYS: 10
  LAB_RUSH_TURNAROUND_DAYS: 4
  LAB_RUSH_FEE_BASE: 120.00
  LAB_RUSH_FEE_PER_UNIT: 35.00
  LAB_SHELF_LIFE_DAYS: 45              # measured from dispatched_at
  LAB_QC_RESEND_CEILING: 2
  LAB_FAULT_CREDIT_RATE: 0.60
  LAB_DEFAULT_INVOICE_AMOUNT: 450.00
  LAB_DEFAULT_BENCH_LINE_COUNT: 3
  ARCH_TURNAROUND_BUFFER_HOURS: 24     # closed-interval buffer on CaseArch re-dispatch

  # --- warranty / replacement (the two clocks that disagree) ---------------
  WARRANTY_WINDOW_DAYS: 365            # from THIS prosthesis delivered_at; restarts on a remake
  REPLACEMENT_FREQUENCY_MONTHS: 60     # from the PRIOR delivered prosthesis; a remake does NOT restart it

  # --- included post-delivery adjustment allowance -------------------------
  ADJUSTMENT_ALLOWANCE_COUNT: 4
  ADJUSTMENT_ALLOWANCE_WINDOW_DAYS: 90 # from delivered_at
  ADJUSTMENT_CHARGEABLE_FEE: 85.00

  # --- fee schedule per delivered arch, by prosthesis_type -----------------
  FEE_COMPLETE_DENTURE: 1800.00
  FEE_IMMEDIATE_DENTURE: 2100.00
  FEE_CAST_PARTIAL: 1650.00
  FEE_FLEXIBLE_PARTIAL: 1200.00
  FEE_OVERDENTURE: 2400.00
  FEE_IMPLANT_RETAINED_OVERDENTURE: 3600.00

  # --- post-delivery service fees ------------------------------------------
  FEE_ADJUSTMENT: 85.00
  FEE_SOFT_RELINE_CHAIRSIDE: 260.00
  FEE_HARD_RELINE_LAB: 420.00
  FEE_REBASE: 590.00
  FEE_REPAIR: 180.00
  FEE_TOOTH_ADDITION: 155.00
  FEE_CLASP_ADDITION: 195.00

  # --- post-delivery service frequency limits (months; 0 = no limit) -------
  FREQ_ADJUSTMENT_MONTHS: 0
  FREQ_SOFT_RELINE_CHAIRSIDE_MONTHS: 6
  FREQ_HARD_RELINE_LAB_MONTHS: 24
  FREQ_REBASE_MONTHS: 36
  FREQ_REPAIR_MONTHS: 0
  FREQ_TOOTH_ADDITION_MONTHS: 0
  FREQ_CLASP_ADDITION_MONTHS: 0

  # --- immediate-denture mandatory reline ----------------------------------
  IMMEDIATE_DENTURE_RELINE_DUE_DAYS: 180

  # --- recall intervals per prosthesis_type (days from delivered_at) -------
  RECALL_INTERVAL_COMPLETE_DENTURE_DAYS: 365
  RECALL_INTERVAL_IMMEDIATE_DENTURE_DAYS: 90
  RECALL_INTERVAL_CAST_PARTIAL_DAYS: 365
  RECALL_INTERVAL_FLEXIBLE_PARTIAL_DAYS: 365
  RECALL_INTERVAL_OVERDENTURE_DAYS: 180
  RECALL_INTERVAL_IMPLANT_RETAINED_OVERDENTURE_DAYS: 180
  RECALL_OVERDUE_GRACE_DAYS: 30

  # --- remake --------------------------------------------------------------
  REMAKE_CEILING_PER_ARCH: 2           # counted against CaseArch.remake_request_count; the 3rd request is the mutate-then-reject rung

  # --- insurance -----------------------------------------------------------
  COVERAGE_DEFAULT_ANNUAL_MAXIMUM: 1500.00
  COVERAGE_DEFAULT_COINSURANCE_MAJOR_RATE: 0.50
  COVERAGE_DEFAULT_WAITING_PERIOD_DAYS: 180
  PREDETERMINATION_REQUIRED_MIN_FEE: 1500.00
  PREDETERMINATION_VALIDITY_DAYS: 180
  ALTERNATE_BENEFIT_MAP_IMPLANT_RETAINED_OVERDENTURE_TO: "COMPLETE_DENTURE"
  ALTERNATE_BENEFIT_MAP_OVERDENTURE_TO: "COMPLETE_DENTURE"
  ALTERNATE_BENEFIT_MAP_CAST_PARTIAL_TO: "FLEXIBLE_PARTIAL"

  # --- payment plan --------------------------------------------------------
  PAYMENT_PLAN_MIN_INSTALLMENTS: 2
  PAYMENT_PLAN_MAX_INSTALLMENTS: 12
  PAYMENT_PLAN_MIN_DOWN_RATE: 0.20
  PAYMENT_PLAN_DELINQUENCY_GRACE_DAYS: 10
  PAYMENT_PLAN_DEFAULT_MISSED_COUNT: 3
  PAYMENT_FREQUENCY_MONTHLY_DAYS: 30
  PAYMENT_FREQUENCY_BIWEEKLY_DAYS: 14

  # --- prompt-pay discount tiers (keyed on PRE-discount responsibility) ----
  PROMPT_PAY_TIER_2_MIN: 2500.00       # >= 2500.00 -> 0.05
  PROMPT_PAY_TIER_1_MIN: 1000.00       # >= 1000.00 and < 2500.00 -> 0.03
  PROMPT_PAY_TIER_2_RATE: 0.05
  PROMPT_PAY_TIER_1_RATE: 0.03
  PROMPT_PAY_TIER_0_RATE: 0.00

  # --- required milestone sequence per prosthesis_type ---------------------
  # (ordered try-in milestone kinds; an empty list means the type skips try-in entirely)
  MILESTONES_COMPLETE_DENTURE: ["WAX", "FINISH"]
  MILESTONES_IMMEDIATE_DENTURE: []
  MILESTONES_CAST_PARTIAL: ["FRAMEWORK", "WAX", "FINISH"]
  MILESTONES_FLEXIBLE_PARTIAL: ["WAX"]
  MILESTONES_OVERDENTURE: ["WAX", "FINISH"]
  MILESTONES_IMPLANT_RETAINED_OVERDENTURE: ["FRAMEWORK", "FINISH"]

  # --- service routing sets ------------------------------------------------
  CHAIRSIDE_SERVICE_TYPES: ["ADJUSTMENT", "SOFT_RELINE_CHAIRSIDE", "REPAIR"]
  LAB_SERVICE_TYPES: ["HARD_RELINE_LAB", "REBASE", "TOOTH_ADDITION", "CLASP_ADDITION"]
  PARTIAL_ONLY_SERVICE_TYPES: ["CLASP_ADDITION"]
  PARTIAL_PROSTHESIS_TYPES: ["CAST_PARTIAL", "FLEXIBLE_PARTIAL"]
  REBASE_INELIGIBLE_PROSTHESIS_TYPES: ["FLEXIBLE_PARTIAL"]

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Patient
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Patient legal name."
      - name: date_of_birth
        type: string
        source: input
        description: "Date of birth in YYYY-MM-DD form."
      - name: phone
        type: string
        source: input
        description: "Contact phone number."
      - name: write_gate_active
        type: boolean
        source: computed
        default: false
        description: "True when this patient has at least one PaymentPlan whose plan_status is in {DELINQUENT, DEFAULTED}. Drives ladder rung 5, the global write gate."
      - name: delivered_prosthesis_count
        type: integer
        source: computed
        default: 0
        description: "Count of Prosthesis rows whose case_arch_id belongs to a ProsthesisCase of this patient and whose is_remake is false."
      - name: last_frequency_anchor_at
        type: datetime
        source: computed
        description: "Maximum Prosthesis.frequency_anchor_at over this patient's Prosthesis rows, or null when none. Anchor for the insurance replacement-frequency clock."
        constraints: "nullable; ISO 8601 UTC with three fractional digits"

  - name: Coverage
    parent: Patient
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the covered patient."
      - name: carrier_name
        type: string
        source: input
        description: "Insurance carrier trade name."
      - name: rank
        type: enum
        source: input
        description: "Coordination-of-benefits rank of this coverage for the patient."
        constraints: "one of PRIMARY, SECONDARY; at most one row per (patient_id, rank)"
      - name: effective_date
        type: datetime
        source: input
        description: "Instant this coverage became effective; the waiting-period clock starts here."
      - name: annual_maximum_amount
        type: number
        source: input
        default: 1500.00
        description: "Calendar-year benefit ceiling for this coverage."
      - name: coinsurance_major_rate
        type: number
        source: input
        default: 0.50
        description: "Fraction of the allowed amount the plan pays for major removable-prosthetic services."
      - name: waiting_period_days
        type: integer
        source: input
        default: 180
        description: "Days after effective_date before major services are payable."
      - name: replacement_frequency_months
        type: integer
        source: input
        default: 60
        description: "Months that must elapse since the prior delivered prosthesis before a replacement is payable."
      - name: cob_convention
        type: enum
        source: input
        default: "STANDARD"
        description: "Adjudication convention used when this coverage pays as SECONDARY."
        constraints: "one of STANDARD, NON_DUPLICATION"
      - name: alternate_benefit_enabled
        type: boolean
        source: input
        default: true
        description: "When true the carrier may issue an ALTERNATE_BENEFIT determination downgrading the prosthesis to a less expensive alternative."
      - name: benefit_used_ytd
        type: number
        source: computed
        default: 0.00
        description: "Sum of plan_paid_amount over Claim rows citing this coverage whose adjudication_status is in {PRIMARY_PAID, SECONDARY_PAID, CLOSED}."
      - name: benefit_remaining
        type: number
        source: computed
        description: "annual_maximum_amount minus benefit_used_ytd; floored at 0.00."

  - name: DentalLab
    parent: null
    common_fields: true
    fields:
      - name: lab_name
        type: string
        source: input
        description: "External dental laboratory trade name."
      - name: bench_line_count
        type: integer
        source: input
        default: 3
        description: "Number of parallel bench lines the lab operates; a LabCase occupies exactly one."
        constraints: ">= 1 and <= 10"
      - name: standard_turnaround_days
        type: integer
        source: input
        default: 10
        description: "Calendar days added to dispatched_at for a STANDARD turnaround_class."
      - name: rush_turnaround_days
        type: integer
        source: input
        default: 4
        description: "Calendar days added to dispatched_at for a RUSH turnaround_class."
      - name: credit_issued_total
        type: number
        source: computed
        default: 0.00
        description: "Cumulative lab-fault remake credit issued to this lab across all WarrantyClaim adjudications."
      - name: credit_applied_total
        type: number
        source: computed
        default: 0.00
        description: "Cumulative credit already applied to reduce a PaymentPlan principal."
      - name: credit_available_balance
        type: number
        source: computed
        default: 0.00
        description: "credit_issued_total minus credit_applied_total; conserved quantity of invariant lab_credit_conservation."

  - name: ProsthesisCase
    parent: Patient
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the patient this case belongs to."
      - name: prosthesis_type
        type: enum
        source: input
        description: "Prosthesis type for the whole case; parameterizes the required milestone sequence of every CaseArch under it."
        constraints: "one of COMPLETE_DENTURE, IMMEDIATE_DENTURE, CAST_PARTIAL, FLEXIBLE_PARTIAL, OVERDENTURE, IMPLANT_RETAINED_OVERDENTURE"
      - name: case_status
        type: enum
        source: system
        default: "INTAKE"
        description: "Case-level lifecycle axis; compound over its CaseArch rows."
        constraints: "one of INTAKE, EXAM_COMPLETE, IN_FABRICATION, DELIVERED, CLOSED, CANCELLED"
      - name: fee_schedule_total
        type: number
        source: computed
        default: 0.00
        description: "Sum of CaseArch.fee_schedule_amount over every CaseArch of this case whose arch_status is not ARCH_ABANDONED."
      - name: predetermination_required
        type: boolean
        source: computed
        default: false
        description: "True when fee_schedule_total >= PREDETERMINATION_REQUIRED_MIN_FEE."
      - name: billed_amount
        type: number
        source: computed
        default: 0.00
        description: "Step 4 of calculation case_total_due; gross fee plus accepted rush fees plus chargeable post-delivery service charges."
      - name: insurance_paid_amount
        type: number
        source: computed
        default: 0.00
        description: "Sum of Claim.plan_paid_amount over this case's Claim rows whose adjudication_status is in {PRIMARY_PAID, SECONDARY_PAID, CLOSED}."
      - name: prompt_pay_discount_amount
        type: number
        source: computed
        default: 0.00
        description: "Step 8 of calculation case_total_due; non-zero only when an ACTIVE PaymentPlan for this case has pay_in_full true."
      - name: patient_responsibility_amount
        type: number
        source: computed
        default: 0.00
        description: "Step 9 of calculation case_total_due; billed_amount minus insurance_paid_amount minus prompt_pay_discount_amount."
      - name: fabrication_started_at
        type: datetime
        source: system
        description: "Instant the first CaseArch left PLANNED."
        constraints: "nullable"
      - name: delivered_at
        type: datetime
        source: system
        description: "Instant case_status became DELIVERED."
        constraints: "nullable"

  - name: CaseArch
    parent: ProsthesisCase
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> ProsthesisCase.id; the case this arch belongs to."
      - name: arch_position
        type: enum
        source: input
        description: "Which arch this unit covers."
        constraints: "one of MAXILLARY, MANDIBULAR; at most one row per (case_id, arch_position)"
      - name: arch_status
        type: enum
        source: system
        default: "PLANNED"
        description: "Per-arch lifecycle axis; each arch of a case advances on its own, so one arch can be remade while the sibling arch proceeds."
        constraints: "one of PLANNED, IMPRESSION_PENDING, MILESTONE_PENDING, LAB_FABRICATION, READY_FOR_DELIVERY, DELIVERED, REMAKE_PENDING, ARCH_CLOSED, ARCH_ABANDONED"
      - name: required_milestones
        type: array
        source: computed
        description: "Ordered try-in milestone kinds required by the parent case's prosthesis_type, read from MILESTONES_<prosthesis_type>."
      - name: completed_milestones
        type: array
        source: computed
        description: "Ordered milestone_kind values of this arch's TryInMilestone rows whose approval_status is APPROVED, sorted by created_at ASC."
      - name: next_required_milestone
        type: string
        source: computed
        description: "First element of required_milestones not present in completed_milestones, or null when all are complete."
        constraints: "nullable"
      - name: retake_count
        type: integer
        source: computed
        default: 0
        description: "Number of impression retakes requested on this arch since the last time arch_status entered IMPRESSION_PENDING."
      - name: remake_count
        type: integer
        source: computed
        default: 0
        description: "Number of APPROVED RemakeRequest rows for this arch."
      - name: remake_request_count
        type: integer
        source: computed
        default: 0
        description: "Number of RemakeRequest rows for this arch whose authorization_status is in {PENDING_APPROVAL, APPROVED, DENIED}. FINAL_DENIED rows are excluded so the counter cannot run away. This is the counter the remake-attempt ceiling of rung 22 tests."
      - name: remake_eligibility
        type: enum
        source: system
        default: "ELIGIBLE"
        description: "Flipped to FINAL_DENIED by the mutate-then-reject rung 22 when a remake is requested past REMAKE_CEILING_PER_ARCH."
        constraints: "one of ELIGIBLE, FINAL_DENIED"
      - name: fee_schedule_amount
        type: number
        source: computed
        default: 0.00
        description: "FEE_<parent case prosthesis_type> for this single arch."
      - name: last_lab_received_at
        type: datetime
        source: system
        description: "received_at of the most recently RETURNED LabCase for this arch; anchors the ARCH_TURNAROUND_BUFFER_HOURS buffer."
        constraints: "nullable"

  - name: ImpressionRecord
    parent: CaseArch
    common_fields: true
    fields:
      - name: case_arch_id
        type: string
        source: input
        description: "FK -> CaseArch.id; the arch this impression or scan captures."
      - name: capture_method
        type: enum
        source: input
        description: "How the arch was captured."
        constraints: "one of PHYSICAL_IMPRESSION, DIGITAL_SCAN"
      - name: attempt_number
        type: integer
        source: system
        default: 1
        description: "1 for the first record on the arch since it entered IMPRESSION_PENDING; incremented on each retake-created successor."
      - name: quality_score
        type: integer
        source: system
        description: "Integer quality score written by the review endpoint; null before review."
        constraints: "nullable; IMPRESSION_SCORE_MIN..IMPRESSION_SCORE_MAX inclusive"
      - name: quality_status
        type: enum
        source: system
        default: "PENDING_REVIEW"
        description: "Three-band review outcome plus the superseded terminal."
        constraints: "one of PENDING_REVIEW, ACCEPTED, PROVISIONAL_ACCEPTED, REJECTED, SUPERSEDED"
      - name: retake_required
        type: boolean
        source: computed
        default: false
        description: "True while quality_status is PROVISIONAL_ACCEPTED or REJECTED."
      - name: reviewed_at
        type: datetime
        source: system
        description: "Instant the review endpoint scored this record."
        constraints: "nullable"
      - name: superseded_by_impression_id
        type: string
        source: system
        description: "FK -> ImpressionRecord.id; the successor record created by a retake request. Null until superseded."
        constraints: "nullable; self-referential"

  - name: TryInMilestone
    parent: CaseArch
    common_fields: true
    fields:
      - name: case_arch_id
        type: string
        source: input
        description: "FK -> CaseArch.id; the arch this try-in belongs to."
      - name: milestone_kind
        type: enum
        source: input
        description: "Which try-in milestone this row records. FRAMEWORK exists only for CAST_PARTIAL and IMPLANT_RETAINED_OVERDENTURE."
        constraints: "one of WAX, FRAMEWORK, FINISH"
      - name: approval_status
        type: enum
        source: system
        default: "PENDING_APPROVAL"
        description: "Three-way clinical decision axis with an ADJUST re-try-in cycle."
        constraints: "one of PENDING_APPROVAL, ADJUST_REQUESTED, APPROVED, REJECTED_FOR_REMAKE, CANCELLED"
      - name: adjust_count
        type: integer
        source: computed
        default: 0
        description: "Number of ADJUST decisions taken on this row; ceiling TRYIN_ADJUST_CEILING."
      - name: decided_at
        type: datetime
        source: system
        description: "Instant of the most recent decide call on this row."
        constraints: "nullable"
      - name: decided_by_user_id
        type: string
        source: system
        description: "X-User-ID of the actor on the most recent decide call. Opaque operator id, never compared to any entity id."
        constraints: "nullable"

  - name: LabCase
    parent: CaseArch
    common_fields: true
    fields:
      - name: case_arch_id
        type: string
        source: input
        description: "FK -> CaseArch.id; the arch whose work this lab case carries."
      - name: dental_lab_id
        type: string
        source: input
        description: "FK -> DentalLab.id; the external laboratory the case is dispatched to."
      - name: bench_line
        type: integer
        source: input
        description: "Which bench line at the lab this case occupies for the interval it is out."
        constraints: ">= 1 and <= DentalLab.bench_line_count"
      - name: turnaround_class
        type: enum
        source: input
        description: "Selects the promised-due-date formula and the rush fee."
        constraints: "one of STANDARD, RUSH"
      - name: unit_count
        type: integer
        source: input
        description: "Billable units on this lab case; drives the rush fee."
        constraints: ">= 1 and <= 32"
      - name: lab_invoice_amount
        type: number
        source: input
        default: 450.00
        description: "Amount the laboratory invoices the clinic for this case; base of the lab-fault remake credit."
      - name: purpose
        type: enum
        source: input
        description: "Why this case exists."
        constraints: "one of FABRICATION, RELINE, REBASE, REPAIR, ADDITION, REMAKE"
      - name: lab_status
        type: enum
        source: system
        default: "DRAFT"
        description: "Lab-side lifecycle with a QC reject-and-resend cycle and a shelf-life EXPIRED terminal."
        constraints: "one of DRAFT, DISPATCHED, RETURNED, QC_PASSED, QC_FAILED, RESENT, EXPIRED, CANCELLED"
      - name: dispatched_at
        type: datetime
        source: system
        description: "Instant the case left the clinic; start of the bench-line occupation interval."
        constraints: "nullable"
      - name: promised_due_at
        type: datetime
        source: computed
        description: "Output of calculation lab_promised_due_at; end of the bench-line occupation interval."
        constraints: "nullable"
      - name: shelf_life_expires_at
        type: datetime
        source: computed
        description: "dispatched_at plus LAB_SHELF_LIFE_DAYS days; past this instant the next handling call trips the mutate-then-reject rung 15."
        constraints: "nullable"
      - name: rush_fee_amount
        type: number
        source: computed
        default: 0.00
        description: "Output of calculation lab_rush_fee; 0.00 for STANDARD."
      - name: received_at
        type: datetime
        source: system
        description: "Instant the finished case came back to the clinic."
        constraints: "nullable"
      - name: resend_count
        type: integer
        source: computed
        default: 0
        description: "Number of QC-failed resends on this row; ceiling LAB_QC_RESEND_CEILING."
      - name: qc_result
        type: enum
        source: system
        description: "Result of the most recent clinic QC inspection."
        constraints: "nullable; one of PASS, FAIL"
      - name: expired_at
        type: datetime
        source: system
        description: "Instant lab_status was flipped to EXPIRED by rung 15 before it raised."
        constraints: "nullable"

  - name: Prosthesis
    parent: CaseArch
    common_fields: true
    fields:
      - name: case_arch_id
        type: string
        source: input
        description: "FK -> CaseArch.id; the arch this appliance was delivered for."
      - name: superseded_prosthesis_id
        type: string
        source: input
        description: "FK -> Prosthesis.id; the prior appliance this remake replaces. Null on an original delivery."
        constraints: "nullable; self-referential"
      - name: prosthesis_type
        type: enum
        source: computed
        description: "Copied from the arch's parent ProsthesisCase.prosthesis_type at delivery."
        constraints: "one of COMPLETE_DENTURE, IMMEDIATE_DENTURE, CAST_PARTIAL, FLEXIBLE_PARTIAL, OVERDENTURE, IMPLANT_RETAINED_OVERDENTURE"
      - name: is_remake
        type: boolean
        source: computed
        default: false
        description: "True when superseded_prosthesis_id is non-null."
      - name: delivered_at
        type: datetime
        source: system
        description: "Instant of delivery; the warranty clock starts here."
      - name: warranty_status
        type: enum
        source: system
        default: "IN_WARRANTY"
        description: "Warranty axis; runs independently of recall_status on the same row."
        constraints: "one of IN_WARRANTY, WARRANTY_CONSUMED, WARRANTY_EXPIRED, WARRANTY_VOIDED"
      - name: warranty_expires_at
        type: datetime
        source: computed
        description: "delivered_at plus WARRANTY_WINDOW_DAYS days. A remake restarts this clock from its own delivered_at."
      - name: frequency_anchor_at
        type: datetime
        source: computed
        description: "Anchor of the insurance replacement-frequency clock. On an original delivery it equals delivered_at; on a remake it is copied verbatim from the superseded prosthesis, so a remake does NOT restart it."
      - name: replacement_eligible_date
        type: datetime
        source: computed
        description: "frequency_anchor_at plus REPLACEMENT_FREQUENCY_MONTHS months."
      - name: recall_status
        type: enum
        source: system
        default: "RECALL_SCHEDULED"
        description: "Recall axis; runs independently of warranty_status on the same row."
        constraints: "one of RECALL_SCHEDULED, RECALL_DUE, RECALL_OVERDUE, RECALL_COMPLETED, RECALL_CLOSED_SUPERSEDED"
      - name: recall_due_at
        type: datetime
        source: computed
        description: "delivered_at plus RECALL_INTERVAL_<prosthesis_type>_DAYS days, advanced by one further interval on each NO_ACTION recall completion."
      - name: recall_cycle_count
        type: integer
        source: computed
        default: 0
        description: "Number of NO_ACTION recall completions that rescheduled this appliance."
      - name: adjustments_used
        type: integer
        source: computed
        default: 0
        description: "Count of COMPLETED PostDeliveryService rows of service_type ADJUSTMENT on this prosthesis whose charge_basis is INCLUDED."
      - name: adjustments_remaining
        type: integer
        source: computed
        default: 4
        description: "ADJUSTMENT_ALLOWANCE_COUNT minus adjustments_used; conserved quantity of invariant adjustment_allowance_conservation."
      - name: adjustment_window_ends_at
        type: datetime
        source: computed
        description: "delivered_at plus ADJUSTMENT_ALLOWANCE_WINDOW_DAYS days."
      - name: in_patient_possession
        type: boolean
        source: computed
        default: true
        description: "False while a laboratory post-delivery service holds the appliance; chairside services never change it."
      - name: mandatory_reline_due_at
        type: datetime
        source: computed
        description: "delivered_at plus IMMEDIATE_DENTURE_RELINE_DUE_DAYS days when prosthesis_type is IMMEDIATE_DENTURE; null for every other type."
        constraints: "nullable"

  - name: PostDeliveryService
    parent: Prosthesis
    common_fields: true
    fields:
      - name: prosthesis_id
        type: string
        source: input
        description: "FK -> Prosthesis.id; the appliance being serviced."
      - name: lab_case_id
        type: string
        source: system
        description: "FK -> LabCase.id; the lab case auto-created for a laboratory service type. Null for chairside types."
        constraints: "nullable"
      - name: service_type
        type: enum
        source: input
        description: "Which distinct service this row records; determines fee, frequency limit, possession effect and lab routing."
        constraints: "one of ADJUSTMENT, SOFT_RELINE_CHAIRSIDE, HARD_RELINE_LAB, REBASE, REPAIR, TOOTH_ADDITION, CLASP_ADDITION"
      - name: is_emergency_repair
        type: boolean
        source: input
        default: false
        description: "When true with service_type REPAIR the request sits outside the global write gate."
      - name: service_status
        type: enum
        source: system
        default: "REQUESTED"
        description: "Branching axis; the chairside branch and the laboratory branch carry different side effects."
        constraints: "one of REQUESTED, IN_CHAIR, AT_LAB, COMPLETED, VOIDED"
      - name: charge_basis
        type: enum
        source: computed
        description: "Money classification fixed at completion."
        constraints: "one of INCLUDED, CHARGEABLE, WARRANTY_NO_CHARGE"
      - name: charge_amount
        type: number
        source: computed
        default: 0.00
        description: "Output of calculation post_delivery_service_charge."
      - name: completed_at
        type: datetime
        source: system
        description: "Instant the service completed."
        constraints: "nullable"
      - name: voided_at
        type: datetime
        source: system
        description: "Instant the service was voided."
        constraints: "nullable"

  - name: WarrantyClaim
    parent: Prosthesis
    common_fields: true
    fields:
      - name: prosthesis_id
        type: string
        source: input
        description: "FK -> Prosthesis.id; the appliance the fault is reported against."
      - name: post_delivery_service_id
        type: string
        source: input
        description: "FK -> PostDeliveryService.id; the service whose result the patient disputes. Optional."
        constraints: "nullable"
      - name: attributed_lab_case_id
        type: string
        source: input
        description: "FK -> LabCase.id; the lab case whose workmanship is under suspicion. Required to make a LAB_FAULT verdict payable as a credit."
        constraints: "nullable"
      - name: reported_issue
        type: string
        source: input
        description: "Free-text description of the reported fault."
      - name: claim_status
        type: enum
        source: system
        default: "SUBMITTED"
        description: "Four-way fault fan-out with an INDETERMINATE leg that re-enters through clinical review."
        constraints: "one of SUBMITTED, CLINICAL_REVIEW, CLINIC_FAULT, LAB_FAULT, PATIENT_FAULT"
      - name: fault_verdict
        type: enum
        source: system
        description: "Verdict recorded by the adjudicate call."
        constraints: "nullable; one of CLINIC_FAULT, LAB_FAULT, PATIENT_FAULT, INDETERMINATE"
      - name: lab_credit_amount
        type: number
        source: computed
        default: 0.00
        description: "Output of calculation lab_remake_credit; non-zero only on a LAB_FAULT verdict with attributed_lab_case_id set."
      - name: patient_charge_amount
        type: number
        source: computed
        default: 0.00
        description: "Amount charged to the patient; non-zero only on a PATIENT_FAULT verdict."
      - name: warranty_consumed
        type: boolean
        source: computed
        default: false
        description: "True only on CLINIC_FAULT or LAB_FAULT; a PATIENT_FAULT verdict deliberately leaves the warranty unconsumed."
      - name: adjudicated_at
        type: datetime
        source: system
        description: "Instant a terminal verdict was reached."
        constraints: "nullable"

  - name: RemakeRequest
    parent: CaseArch
    common_fields: true
    fields:
      - name: case_arch_id
        type: string
        source: input
        description: "FK -> CaseArch.id; the arch to be remade."
      - name: warranty_claim_id
        type: string
        source: input
        description: "FK -> WarrantyClaim.id; the adjudicated fault this remake answers. Optional."
        constraints: "nullable"
      - name: reason_code
        type: enum
        source: input
        description: "Why the remake is requested."
        constraints: "one of TRYIN_REJECTED, FIT_FAILURE, LAB_DEFECT, PATIENT_DISSATISFACTION, RECALL_EVALUATION"
      - name: requested_by_user_id
        type: string
        source: system
        description: "X-User-ID of the requester, stamped at creation. Opaque operator id, never compared to any entity id."
      - name: approved_by_user_id
        type: string
        source: system
        description: "X-User-ID of the approver. Segregation of duties requires it to differ from requested_by_user_id."
        constraints: "nullable"
      - name: authorization_status
        type: enum
        source: system
        default: "PENDING_APPROVAL"
        description: "Authorization axis. FINAL_DENIED is written by the mutate-then-reject rung 22 before it raises."
        constraints: "one of PENDING_APPROVAL, APPROVED, DENIED, FINAL_DENIED"
      - name: attempt_number
        type: integer
        source: computed
        description: "CaseArch.remake_request_count at creation time plus 1."
      - name: charge_basis
        type: enum
        source: computed
        description: "NO_CHARGE when warranty_claim_id cites a CLINIC_FAULT or LAB_FAULT claim; CHARGEABLE otherwise."
        constraints: "one of NO_CHARGE, CHARGEABLE"
      - name: decided_at
        type: datetime
        source: system
        description: "Instant of approve or deny."
        constraints: "nullable"

  - name: Predetermination
    parent: ProsthesisCase
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> ProsthesisCase.id; the case submitted for preauthorization."
      - name: coverage_id
        type: string
        source: input
        description: "FK -> Coverage.id; the coverage the request is sent to."
      - name: requested_amount
        type: number
        source: computed
        description: "ProsthesisCase.fee_schedule_total at submission."
      - name: determination_status
        type: enum
        source: system
        default: "SUBMITTED"
        description: "Three-way carrier answer plus a validity-window terminal."
        constraints: "one of SUBMITTED, APPROVED, DENIED, ALTERNATE_BENEFIT, EXPIRED"
      - name: alternate_benefit_type
        type: enum
        source: system
        description: "The less expensive prosthesis type the plan will pay the benefit of, from ALTERNATE_BENEFIT_MAP_<type>_TO."
        constraints: "nullable; one of COMPLETE_DENTURE, FLEXIBLE_PARTIAL"
      - name: allowed_amount
        type: number
        source: computed
        default: 0.00
        description: "Allowed basis the plan will apply its coinsurance to; the downgraded fee under ALTERNATE_BENEFIT."
      - name: estimated_plan_payment
        type: number
        source: computed
        default: 0.00
        description: "Output of calculation predetermination_plan_payment."
      - name: estimated_patient_responsibility
        type: number
        source: computed
        default: 0.00
        description: "requested_amount minus estimated_plan_payment."
      - name: determined_at
        type: datetime
        source: system
        description: "Instant the carrier answered."
        constraints: "nullable"
      - name: expires_at
        type: datetime
        source: computed
        description: "determined_at plus PREDETERMINATION_VALIDITY_DAYS days; null before determination."
        constraints: "nullable"

  - name: Claim
    parent: ProsthesisCase
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> ProsthesisCase.id; the case being billed."
      - name: coverage_id
        type: string
        source: input
        description: "FK -> Coverage.id; the PRIMARY coverage this claim is anchored to."
      - name: predetermination_id
        type: string
        source: system
        description: "FK -> Predetermination.id; the determination in force at submission, resolved as the case's Predetermination row with determination_status in {APPROVED, ALTERNATE_BENEFIT} and the latest created_at. Null when none exists."
        constraints: "nullable"
      - name: billed_amount
        type: number
        source: computed
        description: "ProsthesisCase.fee_schedule_total at submission."
      - name: allowed_amount
        type: number
        source: computed
        default: 0.00
        description: "Allowed basis after any alternate-benefit downgrade."
      - name: adjudication_status
        type: enum
        source: system
        default: "DRAFT"
        description: "Two-stage COB adjudication axis."
        constraints: "one of DRAFT, SUBMITTED_PRIMARY, PRIMARY_PAID, SUBMITTED_SECONDARY, SECONDARY_PAID, CLOSED, DENIED, REVERSED"
      - name: submission_target
        type: enum
        source: system
        default: "PRIMARY"
        description: "Which coverage the current submission is aimed at."
        constraints: "one of PRIMARY, SECONDARY"
      - name: primary_paid_amount
        type: number
        source: computed
        default: 0.00
        description: "Amount the PRIMARY coverage paid."
      - name: secondary_paid_amount
        type: number
        source: computed
        default: 0.00
        description: "Amount the SECONDARY coverage paid, under the convention named in cob_convention_applied."
      - name: plan_paid_amount
        type: number
        source: computed
        default: 0.00
        description: "primary_paid_amount plus secondary_paid_amount."
      - name: patient_responsibility_amount
        type: number
        source: computed
        default: 0.00
        description: "billed_amount minus plan_paid_amount, floored at 0.00."
      - name: cob_convention_applied
        type: enum
        source: computed
        description: "Copied from the SECONDARY Coverage.cob_convention when the secondary leg adjudicates."
        constraints: "nullable; one of STANDARD, NON_DUPLICATION"
      - name: submitted_at
        type: datetime
        source: system
        description: "Instant of the most recent submit call."
        constraints: "nullable"
      - name: adjudicated_at
        type: datetime
        source: system
        description: "Instant of the most recent post-payment call."
        constraints: "nullable"
      - name: reversed_at
        type: datetime
        source: system
        description: "Instant the claim was reversed."
        constraints: "nullable"

  - name: PaymentPlan
    parent: ProsthesisCase
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the responsible party."
      - name: case_id
        type: string
        source: input
        description: "FK -> ProsthesisCase.id; the case whose balance this plan finances."
      - name: superseded_by_plan_id
        type: string
        source: system
        description: "FK -> PaymentPlan.id; the newer plan that superseded this one. Null while current."
        constraints: "nullable; self-referential"
      - name: principal_amount
        type: number
        source: computed
        description: "ProsthesisCase.patient_responsibility_amount minus down_payment_amount at creation, reduced later by applied lab credits."
      - name: installment_count
        type: integer
        source: input
        description: "Number of Installment rows minted at creation."
        constraints: "PAYMENT_PLAN_MIN_INSTALLMENTS..PAYMENT_PLAN_MAX_INSTALLMENTS inclusive"
      - name: down_payment_amount
        type: number
        source: input
        description: "Amount collected up front."
        constraints: ">= PAYMENT_PLAN_MIN_DOWN_RATE times ProsthesisCase.patient_responsibility_amount"
      - name: pay_in_full
        type: boolean
        source: input
        default: false
        description: "When true the prompt-pay discount tier is applied to the case before the principal is struck."
      - name: first_due_date
        type: datetime
        source: input
        description: "Due instant of installment sequence_number 1."
      - name: frequency
        type: enum
        source: input
        description: "Spacing between installment due dates."
        constraints: "one of MONTHLY, BIWEEKLY"
      - name: plan_status
        type: enum
        source: system
        default: "ACTIVE"
        description: "Cyclic money axis; DELINQUENT and DEFAULTED raise the global write gate."
        constraints: "one of ACTIVE, DELINQUENT, DEFAULTED, PAID_OFF, SUPERSEDED"
      - name: paid_amount
        type: number
        source: computed
        default: 0.00
        description: "Sum of Installment.amount over this plan's rows whose installment_status is PAID, plus the sum over rows whose installment_status is WAIVED."
      - name: outstanding_amount
        type: number
        source: computed
        description: "principal_amount minus paid_amount; conserved quantity of invariant payment_plan_conservation."
      - name: missed_count
        type: integer
        source: computed
        default: 0
        description: "Count of this plan's Installment rows whose installment_status is MISSED."
      - name: applied_lab_credit_amount
        type: number
        source: computed
        default: 0.00
        description: "Cumulative DentalLab credit applied against principal_amount on this plan."

  - name: Installment
    parent: PaymentPlan
    common_fields: true
    fields:
      - name: payment_plan_id
        type: string
        source: input
        description: "FK -> PaymentPlan.id; the plan this installment belongs to."
      - name: sequence_number
        type: integer
        source: system
        description: "1-based position in the schedule."
      - name: amount
        type: number
        source: computed
        description: "Output of calculation installment_schedule; the rounding residual lands on the final row."
      - name: due_date
        type: datetime
        source: computed
        description: "first_due_date plus (sequence_number - 1) times the frequency spacing in days."
      - name: installment_status
        type: enum
        source: system
        default: "SCHEDULED"
        description: "Cyclic collection axis; a MISSED row can be cured back to PAID."
        constraints: "one of SCHEDULED, MISSED, PAID, WAIVED"
      - name: is_residual_installment
        type: boolean
        source: computed
        default: false
        description: "True only on the row whose sequence_number equals PaymentPlan.installment_count; that row absorbs the rounding residual."
      - name: paid_at
        type: datetime
        source: system
        description: "Instant of payment."
        constraints: "nullable"

# =============================================================================
# 1.2 State Machine Table  -- 14 axes across 13 entities
# =============================================================================
state_machines:

  # ---- axis 1 : ProsthesisCase.case_status (compound + cyclic) ------------
  - entity: ProsthesisCase
    state_field: case_status
    initial_state: INTAKE
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: INTAKE
        to: EXAM_COMPLETE
        trigger: "POST /prosthetics/cases/{case_id}/complete-exam"
        actor: Prosthodontist
        preconditions:
          - "at least one CaseArch row exists with case_id equal to this case"
        side_effects:
          - "recompute CaseArch.fee_schedule_amount for every arch of this case from FEE_<prosthesis_type>"
          - "recompute ProsthesisCase.fee_schedule_total"
          - "recompute ProsthesisCase.predetermination_required as fee_schedule_total >= PREDETERMINATION_REQUIRED_MIN_FEE"
          - "increments ProsthesisCase.version by 1"

      - from: EXAM_COMPLETE
        to: IN_FABRICATION
        trigger: "system, on the first CaseArch of this case leaving PLANNED via POST /prosthetics/case-arches/{case_arch_id}/start-fabrication"
        actor: system
        preconditions:
          - "ProsthesisCase.case_status == EXAM_COMPLETE"
        side_effects:
          - "stamps ProsthesisCase.fabrication_started_at with the logical clock"
          - "increments ProsthesisCase.version by 1"

      - from: IN_FABRICATION
        to: DELIVERED
        trigger: "system, bubble-up when every CaseArch of this case has arch_status in {DELIVERED, ARCH_ABANDONED} and at least one is DELIVERED"
        actor: system
        preconditions:
          - "no CaseArch of this case has arch_status in {PLANNED, IMPRESSION_PENDING, MILESTONE_PENDING, LAB_FABRICATION, READY_FOR_DELIVERY, REMAKE_PENDING}"
        side_effects:
          - "stamps ProsthesisCase.delivered_at with the logical clock"
          - "cascade link 4 of delivery_cascade: auto-creates one Claim row in DRAFT with coverage_id set to the Coverage of this case's patient whose rank == PRIMARY, when exactly one such Coverage exists; no Claim is created when the patient has no PRIMARY Coverage"
          - "recompute ProsthesisCase.billed_amount and patient_responsibility_amount per calculation case_total_due"
          - "increments ProsthesisCase.version by 1"

      - from: DELIVERED
        to: IN_FABRICATION
        trigger: "system, on a RemakeRequest for one of this case's arches reaching APPROVED"
        actor: system
        preconditions:
          - "at least one CaseArch of this case has arch_status == REMAKE_PENDING"
        side_effects:
          - "clears ProsthesisCase.delivered_at back to null"
          - "increments ProsthesisCase.version by 1"
        note: "This is the case-level cycle: a case that already delivered re-enters fabrication when an arch is remade."

      - from: DELIVERED
        to: CLOSED
        trigger: "system, when every Claim of this case has adjudication_status in {CLOSED, DENIED, REVERSED} and every PaymentPlan of this case has plan_status in {PAID_OFF, SUPERSEDED} (or the case has no PaymentPlan and patient_responsibility_amount == 0.00)"
        actor: system
        preconditions:
          - "ProsthesisCase.case_status == DELIVERED"
        side_effects:
          - "sets every CaseArch of this case whose arch_status == DELIVERED to ARCH_CLOSED"
          - "increments ProsthesisCase.version by 1"

      - from: INTAKE
        to: CANCELLED
        trigger: "POST /prosthetics/cases/{case_id}/cancel"
        actor: Prosthodontist
        preconditions:
          - "ProsthesisCase.case_status in {INTAKE, EXAM_COMPLETE, IN_FABRICATION}"
        side_effects:
          - "sets every CaseArch of this case whose arch_status is not in {ARCH_CLOSED, ARCH_ABANDONED} to ARCH_ABANDONED"
          - "sets every LabCase of those arches whose lab_status is not in {QC_PASSED, EXPIRED, CANCELLED} to CANCELLED"
          - "sets every TryInMilestone of those arches whose approval_status is PENDING_APPROVAL or ADJUST_REQUESTED to CANCELLED"
          - "increments ProsthesisCase.version by 1"

      - from: EXAM_COMPLETE
        to: CANCELLED
        trigger: "POST /prosthetics/cases/{case_id}/cancel"
        actor: Prosthodontist
        preconditions:
          - "ProsthesisCase.case_status in {INTAKE, EXAM_COMPLETE, IN_FABRICATION}"
        side_effects:
          - "same cascade as the INTAKE to CANCELLED transition"
          - "increments ProsthesisCase.version by 1"

      - from: IN_FABRICATION
        to: CANCELLED
        trigger: "POST /prosthetics/cases/{case_id}/cancel"
        actor: Prosthodontist
        preconditions:
          - "ProsthesisCase.case_status in {INTAKE, EXAM_COMPLETE, IN_FABRICATION}"
        side_effects:
          - "same cascade as the INTAKE to CANCELLED transition"
          - "increments ProsthesisCase.version by 1"

  # ---- axis 2 : CaseArch.arch_status (type-parameterized + cyclic) --------
  - entity: CaseArch
    state_field: arch_status
    initial_state: PLANNED
    terminal_states: [ARCH_CLOSED, ARCH_ABANDONED]
    transitions:
      - from: PLANNED
        to: IMPRESSION_PENDING
        trigger: "POST /prosthetics/case-arches/{case_arch_id}/start-fabrication"
        actor: Prosthodontist
        preconditions:
          - "parent ProsthesisCase.case_status == EXAM_COMPLETE (cross-entity; rung 13)"
          - "the patient has no PaymentPlan with plan_status in {DELINQUENT, DEFAULTED} (rung 5 write gate)"
          - "when parent ProsthesisCase.predetermination_required is true, a Predetermination for the case exists with determination_status in {APPROVED, ALTERNATE_BENEFIT} and expires_at strictly after the logical clock (rung 30)"
        side_effects:
          - "resets CaseArch.retake_count to 0"
          - "recomputes CaseArch.required_milestones from MILESTONES_<parent case prosthesis_type>"
          - "bubbles the parent ProsthesisCase from EXAM_COMPLETE to IN_FABRICATION"
          - "increments CaseArch.version by 1"

      - from: REMAKE_PENDING
        to: IMPRESSION_PENDING
        trigger: "POST /prosthetics/case-arches/{case_arch_id}/start-fabrication"
        actor: Prosthodontist
        preconditions:
          - "parent ProsthesisCase.case_status == IN_FABRICATION"
          - "the patient has no PaymentPlan with plan_status in {DELINQUENT, DEFAULTED}"
        side_effects:
          - "resets CaseArch.retake_count to 0"
          - "increments CaseArch.version by 1"
        note: "Closes the per-arch remake cycle DELIVERED -> REMAKE_PENDING -> IMPRESSION_PENDING."

      - from: IMPRESSION_PENDING
        to: MILESTONE_PENDING
        trigger: "system, on an ImpressionRecord of this arch reaching ACCEPTED"
        actor: system
        preconditions:
          - "CaseArch.required_milestones is a non-empty list"
        side_effects:
          - "sets CaseArch.next_required_milestone to the first element of required_milestones"
          - "increments CaseArch.version by 1"

      - from: IMPRESSION_PENDING
        to: LAB_FABRICATION
        trigger: "system, on an ImpressionRecord of this arch reaching ACCEPTED"
        actor: system
        preconditions:
          - "CaseArch.required_milestones is the empty list, which holds only for prosthesis_type IMMEDIATE_DENTURE"
        side_effects:
          - "increments CaseArch.version by 1"
        note: "The type-parameterized branch: an immediate denture skips the try-in stage entirely."

      - from: MILESTONE_PENDING
        to: LAB_FABRICATION
        trigger: "system, on the last element of CaseArch.required_milestones reaching APPROVED"
        actor: system
        preconditions:
          - "CaseArch.next_required_milestone is null after the approving decide call"
        side_effects:
          - "increments CaseArch.version by 1"

      - from: LAB_FABRICATION
        to: READY_FOR_DELIVERY
        trigger: "system, on a LabCase of this arch with purpose in {FABRICATION, REMAKE} reaching QC_PASSED"
        actor: system
        preconditions:
          - "the QC-passing LabCase has case_arch_id equal to this arch"
        side_effects:
          - "increments CaseArch.version by 1"

      - from: READY_FOR_DELIVERY
        to: DELIVERED
        trigger: "POST /prosthetics/prostheses"
        actor: Prosthodontist
        preconditions:
          - "CaseArch.arch_status == READY_FOR_DELIVERY (cross-entity precondition of the Prosthesis create; rung 13)"
          - "the patient has no PaymentPlan with plan_status in {DELINQUENT, DEFAULTED}"
        side_effects:
          - "cascade link 1 of delivery_cascade: creates the Prosthesis row with warranty_status IN_WARRANTY and recall_status RECALL_SCHEDULED"
          - "cascade link 2 of delivery_cascade: sets this CaseArch.arch_status to DELIVERED"
          - "cascade link 3 of delivery_cascade: bubbles the parent ProsthesisCase to DELIVERED when every sibling arch is DELIVERED or ARCH_ABANDONED"
          - "increments CaseArch.version by 1"

      - from: DELIVERED
        to: REMAKE_PENDING
        trigger: "system, on a RemakeRequest for this arch reaching APPROVED"
        actor: system
        preconditions:
          - "CaseArch.arch_status in {DELIVERED, MILESTONE_PENDING}"
        side_effects:
          - "increments CaseArch.remake_count by 1"
          - "sets Prosthesis.warranty_status to WARRANTY_VOIDED and Prosthesis.recall_status to RECALL_CLOSED_SUPERSEDED on this arch's most recent Prosthesis row"
          - "cancels this arch's open LabCase rows (lab_status in {DRAFT, DISPATCHED, RETURNED, QC_FAILED, RESENT}) to CANCELLED"
          - "increments CaseArch.version by 1"

      - from: MILESTONE_PENDING
        to: REMAKE_PENDING
        trigger: "system, on a RemakeRequest for this arch reaching APPROVED"
        actor: system
        preconditions:
          - "CaseArch.arch_status in {DELIVERED, MILESTONE_PENDING}"
        side_effects:
          - "increments CaseArch.remake_count by 1"
          - "cancels this arch's open LabCase rows to CANCELLED"
          - "increments CaseArch.version by 1"
        note: "Reached when a FINISH or WAX try-in is REJECTED before any delivery ever happened."

      - from: DELIVERED
        to: ARCH_CLOSED
        trigger: "system, on the parent ProsthesisCase reaching CLOSED"
        actor: system
        preconditions:
          - "parent ProsthesisCase.case_status == CLOSED"
        side_effects:
          - "increments CaseArch.version by 1"

      - from: PLANNED
        to: ARCH_ABANDONED
        trigger: "system, on POST /prosthetics/cases/{case_id}/cancel"
        actor: system
        preconditions:
          - "CaseArch.arch_status not in {ARCH_CLOSED, ARCH_ABANDONED}"
        side_effects:
          - "increments CaseArch.version by 1"

      - from: IMPRESSION_PENDING
        to: ARCH_ABANDONED
        trigger: "system, on POST /prosthetics/cases/{case_id}/cancel"
        actor: system
        preconditions:
          - "CaseArch.arch_status not in {ARCH_CLOSED, ARCH_ABANDONED}"
        side_effects:
          - "cancels this arch's TryInMilestone and LabCase rows as listed on the case cancel transition"
          - "increments CaseArch.version by 1"

      - from: MILESTONE_PENDING
        to: ARCH_ABANDONED
        trigger: "system, on POST /prosthetics/cases/{case_id}/cancel"
        actor: system
        preconditions:
          - "CaseArch.arch_status not in {ARCH_CLOSED, ARCH_ABANDONED}"
        side_effects:
          - "cancels this arch's TryInMilestone and LabCase rows as listed on the case cancel transition"
          - "increments CaseArch.version by 1"

      - from: LAB_FABRICATION
        to: ARCH_ABANDONED
        trigger: "system, on POST /prosthetics/cases/{case_id}/cancel"
        actor: system
        preconditions:
          - "CaseArch.arch_status not in {ARCH_CLOSED, ARCH_ABANDONED}"
        side_effects:
          - "cancels this arch's LabCase rows as listed on the case cancel transition"
          - "increments CaseArch.version by 1"

      - from: READY_FOR_DELIVERY
        to: ARCH_ABANDONED
        trigger: "system, on POST /prosthetics/cases/{case_id}/cancel"
        actor: system
        preconditions:
          - "CaseArch.arch_status not in {ARCH_CLOSED, ARCH_ABANDONED}"
        side_effects:
          - "increments CaseArch.version by 1"

      - from: REMAKE_PENDING
        to: ARCH_ABANDONED
        trigger: "system, on POST /prosthetics/cases/{case_id}/cancel"
        actor: system
        preconditions:
          - "CaseArch.arch_status not in {ARCH_CLOSED, ARCH_ABANDONED}"
        side_effects:
          - "increments CaseArch.version by 1"

      - from: DELIVERED
        to: ARCH_ABANDONED
        trigger: "system, on POST /prosthetics/cases/{case_id}/cancel"
        actor: system
        preconditions:
          - "CaseArch.arch_status not in {ARCH_CLOSED, ARCH_ABANDONED}"
        side_effects:
          - "increments CaseArch.version by 1"
        note: "A multi-arch case can be cancelled after one arch delivered and the other is still mid-fabrication; the delivered arch is abandoned together with its sibling."

  # ---- axis 3 : ImpressionRecord.quality_status (three-band fan-out + retake cycle)
  - entity: ImpressionRecord
    state_field: quality_status
    initial_state: PENDING_REVIEW
    terminal_states: [ACCEPTED, SUPERSEDED]
    transitions:
      - from: PENDING_REVIEW
        to: ACCEPTED
        trigger: "POST /prosthetics/impressions/{impression_id}/review"
        actor: Prosthodontist
        preconditions:
          - "quality_score >= IMPRESSION_ACCEPT_MIN"
        side_effects:
          - "stamps ImpressionRecord.reviewed_at and quality_score"
          - "advances the parent CaseArch from IMPRESSION_PENDING to MILESTONE_PENDING when required_milestones is non-empty, or to LAB_FABRICATION when it is empty"
          - "increments ImpressionRecord.version by 1"

      - from: PENDING_REVIEW
        to: PROVISIONAL_ACCEPTED
        trigger: "POST /prosthetics/impressions/{impression_id}/review"
        actor: Prosthodontist
        preconditions:
          - "quality_score >= IMPRESSION_PROVISIONAL_MIN and quality_score < IMPRESSION_ACCEPT_MIN"
        side_effects:
          - "stamps ImpressionRecord.reviewed_at and quality_score"
          - "sets ImpressionRecord.retake_required to true"
          - "leaves the parent CaseArch in IMPRESSION_PENDING"
          - "increments ImpressionRecord.version by 1"

      - from: PENDING_REVIEW
        to: REJECTED
        trigger: "POST /prosthetics/impressions/{impression_id}/review"
        actor: Prosthodontist
        preconditions:
          - "quality_score < IMPRESSION_PROVISIONAL_MIN"
        side_effects:
          - "stamps ImpressionRecord.reviewed_at and quality_score"
          - "sets ImpressionRecord.retake_required to true"
          - "leaves the parent CaseArch in IMPRESSION_PENDING"
          - "increments ImpressionRecord.version by 1"

      - from: PROVISIONAL_ACCEPTED
        to: SUPERSEDED
        trigger: "POST /prosthetics/impressions/{impression_id}/request-retake"
        actor: Prosthodontist
        preconditions:
          - "parent CaseArch.retake_count < IMPRESSION_RETAKE_CEILING (rung 17)"
        side_effects:
          - "increments parent CaseArch.retake_count by 1"
          - "creates a successor ImpressionRecord on the same arch in PENDING_REVIEW with attempt_number equal to this row's attempt_number plus 1 and the capture_method supplied on the request"
          - "sets this row's superseded_by_impression_id to the successor id"
          - "increments ImpressionRecord.version by 1"

      - from: REJECTED
        to: SUPERSEDED
        trigger: "POST /prosthetics/impressions/{impression_id}/request-retake"
        actor: Prosthodontist
        preconditions:
          - "parent CaseArch.retake_count < IMPRESSION_RETAKE_CEILING (rung 17)"
        side_effects:
          - "increments parent CaseArch.retake_count by 1"
          - "creates a successor ImpressionRecord on the same arch in PENDING_REVIEW with attempt_number equal to this row's attempt_number plus 1"
          - "sets this row's superseded_by_impression_id to the successor id"
          - "increments ImpressionRecord.version by 1"

  # ---- axis 4 : TryInMilestone.approval_status (three-way fan-out + A->B->A cycle)
  - entity: TryInMilestone
    state_field: approval_status
    initial_state: PENDING_APPROVAL
    terminal_states: [APPROVED, REJECTED_FOR_REMAKE, CANCELLED]
    transitions:
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /prosthetics/try-ins/{try_in_id}/decide with decision APPROVE"
        actor: Prosthodontist
        preconditions:
          - "parent CaseArch.arch_status == MILESTONE_PENDING"
          - "this row's milestone_kind equals parent CaseArch.next_required_milestone (rung 16)"
        side_effects:
          - "appends milestone_kind to parent CaseArch.completed_milestones and recomputes next_required_milestone"
          - "advances the parent CaseArch from MILESTONE_PENDING to LAB_FABRICATION when next_required_milestone becomes null"
          - "stamps decided_at and decided_by_user_id"
          - "increments TryInMilestone.version by 1"

      - from: PENDING_APPROVAL
        to: ADJUST_REQUESTED
        trigger: "POST /prosthetics/try-ins/{try_in_id}/decide with decision ADJUST"
        actor: Prosthodontist
        preconditions:
          - "TryInMilestone.adjust_count < TRYIN_ADJUST_CEILING (rung 18)"
        side_effects:
          - "increments TryInMilestone.adjust_count by 1"
          - "stamps decided_at and decided_by_user_id"
          - "leaves the parent CaseArch in MILESTONE_PENDING"
          - "increments TryInMilestone.version by 1"

      - from: ADJUST_REQUESTED
        to: PENDING_APPROVAL
        trigger: "POST /prosthetics/try-ins/{try_in_id}/decide with decision RESUBMIT"
        actor: Prosthodontist
        preconditions:
          - "TryInMilestone.approval_status == ADJUST_REQUESTED"
        side_effects:
          - "stamps decided_at and decided_by_user_id"
          - "increments TryInMilestone.version by 1"
        note: "Closes the adjust-and-re-try-in cycle on the same row; adjust_count is NOT reset, so the ceiling is cumulative."

      - from: PENDING_APPROVAL
        to: REJECTED_FOR_REMAKE
        trigger: "POST /prosthetics/try-ins/{try_in_id}/decide with decision REJECT"
        actor: Prosthodontist
        preconditions:
          - "parent CaseArch.arch_status == MILESTONE_PENDING"
        side_effects:
          - "auto-creates a RemakeRequest on the parent arch in PENDING_APPROVAL with reason_code TRYIN_REJECTED, requested_by_user_id set to the deciding X-User-ID, and warranty_claim_id null"
          - "stamps decided_at and decided_by_user_id"
          - "increments TryInMilestone.version by 1"

      - from: PENDING_APPROVAL
        to: CANCELLED
        trigger: "system, on POST /prosthetics/cases/{case_id}/cancel"
        actor: system
        preconditions:
          - "parent CaseArch is transitioning to ARCH_ABANDONED"
        side_effects:
          - "increments TryInMilestone.version by 1"

      - from: ADJUST_REQUESTED
        to: CANCELLED
        trigger: "system, on POST /prosthetics/cases/{case_id}/cancel"
        actor: system
        preconditions:
          - "parent CaseArch is transitioning to ARCH_ABANDONED"
        side_effects:
          - "increments TryInMilestone.version by 1"

  # ---- axis 5 : LabCase.lab_status (QC reject-and-resend cycle + EXPIRED) --
  - entity: LabCase
    state_field: lab_status
    initial_state: DRAFT
    terminal_states: [QC_PASSED, EXPIRED, CANCELLED]
    transitions:
      - from: DRAFT
        to: DISPATCHED
        trigger: "POST /prosthetics/lab-cases/{lab_case_id}/dispatch"
        actor: FrontOffice
        preconditions:
          - "the patient has no PaymentPlan with plan_status in {DELINQUENT, DEFAULTED} (rung 5 write gate)"
          - "the arch holds no other LabCase with lab_status in {DISPATCHED, RETURNED, QC_FAILED, RESENT}, and the logical clock is strictly after CaseArch.last_lab_received_at plus ARCH_TURNAROUND_BUFFER_HOURS hours when last_lab_received_at is non-null (rung 20)"
          - "the half-open interval [logical clock, promised_due_at) does not intersect the same interval of any other LabCase on the same (dental_lab_id, bench_line) whose lab_status is in {DISPATCHED, RETURNED, QC_FAILED, RESENT} (rung 21)"
        side_effects:
          - "stamps dispatched_at with the logical clock"
          - "computes promised_due_at per calculation lab_promised_due_at"
          - "computes shelf_life_expires_at as dispatched_at plus LAB_SHELF_LIFE_DAYS days"
          - "computes rush_fee_amount per calculation lab_rush_fee and adds it to the parent case's billed_amount"
          - "recomputes ProsthesisCase.billed_amount and patient_responsibility_amount per calculation case_total_due"
          - "increments LabCase.version by 1"

      - from: DISPATCHED
        to: RETURNED
        trigger: "POST /prosthetics/lab-cases/{lab_case_id}/receive"
        actor: LabTechnician
        preconditions:
          - "X-User-ID equals LabCase.dental_lab_id (rung 3 ownership)"
          - "the logical clock is at or before LabCase.shelf_life_expires_at (rung 15)"
        side_effects:
          - "stamps received_at with the logical clock"
          - "sets parent CaseArch.last_lab_received_at to received_at"
          - "increments LabCase.version by 1"

      - from: RESENT
        to: RETURNED
        trigger: "POST /prosthetics/lab-cases/{lab_case_id}/receive"
        actor: LabTechnician
        preconditions:
          - "X-User-ID equals LabCase.dental_lab_id"
          - "the logical clock is at or before LabCase.shelf_life_expires_at"
        side_effects:
          - "stamps received_at with the logical clock"
          - "sets parent CaseArch.last_lab_received_at to received_at"
          - "increments LabCase.version by 1"

      - from: DISPATCHED
        to: EXPIRED
        trigger: "POST /prosthetics/lab-cases/{lab_case_id}/receive, when the logical clock is strictly after shelf_life_expires_at"
        actor: LabTechnician
        preconditions:
          - "the logical clock is strictly after LabCase.shelf_life_expires_at"
        side_effects:
          - "MUTATE-THEN-REJECT: sets lab_status to EXPIRED, stamps expired_at with the logical clock, increments LabCase.version by 1, releases the (dental_lab_id, bench_line) occupation and the parent arch occupation, PERSISTS all of it, and THEN raises ERR_LAB_CASE_EXPIRED with HTTP 409"
          - "if the parent CaseArch.arch_status is LAB_FABRICATION it stays LAB_FABRICATION so a fresh LabCase can be dispatched"
        note: "A second receive call on the same row is pre-empted by ladder rung 10 because EXPIRED is a terminal state, and surfaces ERR_TERMINAL_STATE instead of ERR_LAB_CASE_EXPIRED."

      - from: RESENT
        to: EXPIRED
        trigger: "POST /prosthetics/lab-cases/{lab_case_id}/receive, when the logical clock is strictly after shelf_life_expires_at"
        actor: LabTechnician
        preconditions:
          - "the logical clock is strictly after LabCase.shelf_life_expires_at"
        side_effects:
          - "MUTATE-THEN-REJECT identical to the DISPATCHED to EXPIRED transition, then raises ERR_LAB_CASE_EXPIRED"

      - from: RETURNED
        to: QC_PASSED
        trigger: "POST /prosthetics/lab-cases/{lab_case_id}/qc with qc_result PASS"
        actor: Prosthodontist
        preconditions:
          - "LabCase.lab_status == RETURNED"
        side_effects:
          - "sets qc_result to PASS"
          - "when purpose is in {FABRICATION, REMAKE}, advances the parent CaseArch from LAB_FABRICATION to READY_FOR_DELIVERY"
          - "when purpose is in {RELINE, REBASE, REPAIR, ADDITION}, makes the linked PostDeliveryService completable"
          - "increments LabCase.version by 1"

      - from: RETURNED
        to: QC_FAILED
        trigger: "POST /prosthetics/lab-cases/{lab_case_id}/qc with qc_result FAIL"
        actor: Prosthodontist
        preconditions:
          - "LabCase.lab_status == RETURNED"
        side_effects:
          - "sets qc_result to FAIL"
          - "leaves the parent CaseArch in LAB_FABRICATION"
          - "increments LabCase.version by 1"

      - from: QC_FAILED
        to: RESENT
        trigger: "POST /prosthetics/lab-cases/{lab_case_id}/resend"
        actor: FrontOffice
        preconditions:
          - "LabCase.resend_count < LAB_QC_RESEND_CEILING (rung 19)"
          - "the logical clock is at or before LabCase.shelf_life_expires_at"
        side_effects:
          - "increments resend_count by 1"
          - "clears received_at back to null"
          - "leaves shelf_life_expires_at unchanged, so the shelf-life clock keeps running from the original dispatch"
          - "increments LabCase.version by 1"
        note: "Closes the QC reject-and-resend cycle QC_FAILED -> RESENT -> RETURNED -> QC_FAILED."

      - from: DRAFT
        to: CANCELLED
        trigger: "system, on POST /prosthetics/cases/{case_id}/cancel, on a RemakeRequest approval for the arch, on POST /prosthetics/services/{service_id}/void for the linked service, or on POST /prosthetics/lab-cases creating a newer DRAFT lab case for the same case_arch_id (supersede)"
        actor: system
        preconditions:
          - "LabCase.lab_status not in {QC_PASSED, EXPIRED, CANCELLED}"
        side_effects:
          - "releases the (dental_lab_id, bench_line) occupation"
          - "increments LabCase.version by 1"

      - from: DISPATCHED
        to: CANCELLED
        trigger: "system, on POST /prosthetics/cases/{case_id}/cancel, on a RemakeRequest approval for the arch, or on POST /prosthetics/services/{service_id}/void for the linked service"
        actor: system
        preconditions:
          - "LabCase.lab_status not in {QC_PASSED, EXPIRED, CANCELLED}"
        side_effects:
          - "releases the (dental_lab_id, bench_line) occupation"
          - "increments LabCase.version by 1"

      - from: RETURNED
        to: CANCELLED
        trigger: "system, on POST /prosthetics/cases/{case_id}/cancel or on a RemakeRequest approval for the arch"
        actor: system
        preconditions:
          - "LabCase.lab_status not in {QC_PASSED, EXPIRED, CANCELLED}"
        side_effects:
          - "increments LabCase.version by 1"

      - from: QC_FAILED
        to: CANCELLED
        trigger: "system, on POST /prosthetics/cases/{case_id}/cancel or on a RemakeRequest approval for the arch"
        actor: system
        preconditions:
          - "LabCase.lab_status not in {QC_PASSED, EXPIRED, CANCELLED}"
        side_effects:
          - "increments LabCase.version by 1"

      - from: RESENT
        to: CANCELLED
        trigger: "system, on POST /prosthetics/cases/{case_id}/cancel or on a RemakeRequest approval for the arch"
        actor: system
        preconditions:
          - "LabCase.lab_status not in {QC_PASSED, EXPIRED, CANCELLED}"
        side_effects:
          - "releases the (dental_lab_id, bench_line) occupation"
          - "increments LabCase.version by 1"

  # ---- axis 6 : Prosthesis.warranty_status (parallel dimension A) ---------
  - entity: Prosthesis
    state_field: warranty_status
    initial_state: IN_WARRANTY
    terminal_states: [WARRANTY_EXPIRED, WARRANTY_VOIDED]
    transitions:
      - from: IN_WARRANTY
        to: WARRANTY_CONSUMED
        trigger: "system, on a WarrantyClaim for this prosthesis reaching CLINIC_FAULT or LAB_FAULT"
        actor: system
        preconditions:
          - "Prosthesis.warranty_status == IN_WARRANTY"
          - "the logical clock is at or before Prosthesis.warranty_expires_at"
        side_effects:
          - "sets WarrantyClaim.warranty_consumed to true"
          - "increments Prosthesis.version by 1"
        note: "A PATIENT_FAULT verdict deliberately does NOT reach this transition; the warranty stays IN_WARRANTY and the patient is charged."

      - from: IN_WARRANTY
        to: WARRANTY_EXPIRED
        trigger: "system, evaluated on every read or handling of the row, when the logical clock is strictly after warranty_expires_at"
        actor: system
        preconditions:
          - "the logical clock is strictly after Prosthesis.warranty_expires_at"
        side_effects:
          - "increments Prosthesis.version by 1"

      - from: WARRANTY_CONSUMED
        to: WARRANTY_EXPIRED
        trigger: "system, evaluated on every read or handling of the row, when the logical clock is strictly after warranty_expires_at"
        actor: system
        preconditions:
          - "the logical clock is strictly after Prosthesis.warranty_expires_at"
        side_effects:
          - "increments Prosthesis.version by 1"

      - from: IN_WARRANTY
        to: WARRANTY_VOIDED
        trigger: "system, on the parent CaseArch entering REMAKE_PENDING"
        actor: system
        preconditions:
          - "this row is the most recent Prosthesis of the arch"
        side_effects:
          - "increments Prosthesis.version by 1"

      - from: WARRANTY_CONSUMED
        to: WARRANTY_VOIDED
        trigger: "system, on the parent CaseArch entering REMAKE_PENDING"
        actor: system
        preconditions:
          - "this row is the most recent Prosthesis of the arch"
        side_effects:
          - "increments Prosthesis.version by 1"

  # ---- axis 7 : Prosthesis.recall_status (parallel dimension B, same row) -
  - entity: Prosthesis
    state_field: recall_status
    initial_state: RECALL_SCHEDULED
    terminal_states: [RECALL_COMPLETED, RECALL_CLOSED_SUPERSEDED]
    transitions:
      - from: RECALL_SCHEDULED
        to: RECALL_DUE
        trigger: "system, evaluated on every read or handling of the row, when the logical clock is at or after recall_due_at"
        actor: system
        preconditions:
          - "the logical clock is at or after Prosthesis.recall_due_at"
        side_effects:
          - "increments Prosthesis.version by 1"

      - from: RECALL_DUE
        to: RECALL_OVERDUE
        trigger: "system, evaluated on every read or handling of the row, when the logical clock is strictly after recall_due_at plus RECALL_OVERDUE_GRACE_DAYS days"
        actor: system
        preconditions:
          - "the logical clock is strictly after Prosthesis.recall_due_at plus RECALL_OVERDUE_GRACE_DAYS days"
        side_effects:
          - "increments Prosthesis.version by 1"

      - from: RECALL_DUE
        to: RECALL_SCHEDULED
        trigger: "POST /prosthetics/prostheses/{prosthesis_id}/recall-complete with recall_outcome NO_ACTION"
        actor: Prosthodontist
        preconditions:
          - "Prosthesis.recall_status in {RECALL_SCHEDULED, RECALL_DUE, RECALL_OVERDUE}"
        side_effects:
          - "advances recall_due_at by one further RECALL_INTERVAL_<prosthesis_type>_DAYS interval"
          - "increments recall_cycle_count by 1"
          - "increments Prosthesis.version by 1"
        note: "Recall cycle: a clean recall reschedules the same row rather than terminating it."

      - from: RECALL_OVERDUE
        to: RECALL_SCHEDULED
        trigger: "POST /prosthetics/prostheses/{prosthesis_id}/recall-complete with recall_outcome NO_ACTION"
        actor: Prosthodontist
        preconditions:
          - "Prosthesis.recall_status in {RECALL_SCHEDULED, RECALL_DUE, RECALL_OVERDUE}"
        side_effects:
          - "advances recall_due_at by one further interval and increments recall_cycle_count by 1"
          - "increments Prosthesis.version by 1"

      - from: RECALL_DUE
        to: RECALL_COMPLETED
        trigger: "POST /prosthetics/prostheses/{prosthesis_id}/recall-complete with recall_outcome RELINE_INDICATED or REMAKE_EVALUATION"
        actor: Prosthodontist
        preconditions:
          - "Prosthesis.recall_status in {RECALL_SCHEDULED, RECALL_DUE, RECALL_OVERDUE}"
        side_effects:
          - "on RELINE_INDICATED, auto-creates a PostDeliveryService on this prosthesis with service_type HARD_RELINE_LAB in REQUESTED"
          - "on REMAKE_EVALUATION, auto-creates a RemakeRequest on the parent CaseArch in PENDING_APPROVAL with reason_code RECALL_EVALUATION and requested_by_user_id set to the calling X-User-ID"
          - "increments Prosthesis.version by 1"

      - from: RECALL_OVERDUE
        to: RECALL_COMPLETED
        trigger: "POST /prosthetics/prostheses/{prosthesis_id}/recall-complete with recall_outcome RELINE_INDICATED or REMAKE_EVALUATION"
        actor: Prosthodontist
        preconditions:
          - "Prosthesis.recall_status in {RECALL_SCHEDULED, RECALL_DUE, RECALL_OVERDUE}"
        side_effects:
          - "same side effects as the RECALL_DUE to RECALL_COMPLETED transition"
          - "increments Prosthesis.version by 1"

      - from: RECALL_SCHEDULED
        to: RECALL_COMPLETED
        trigger: "POST /prosthetics/prostheses/{prosthesis_id}/recall-complete with recall_outcome RELINE_INDICATED or REMAKE_EVALUATION"
        actor: Prosthodontist
        preconditions:
          - "Prosthesis.recall_status in {RECALL_SCHEDULED, RECALL_DUE, RECALL_OVERDUE}"
        side_effects:
          - "same side effects as the RECALL_DUE to RECALL_COMPLETED transition"
          - "increments Prosthesis.version by 1"

      - from: RECALL_SCHEDULED
        to: RECALL_CLOSED_SUPERSEDED
        trigger: "system, on the parent CaseArch entering REMAKE_PENDING"
        actor: system
        preconditions:
          - "this row is the most recent Prosthesis of the arch"
        side_effects:
          - "increments Prosthesis.version by 1"

      - from: RECALL_DUE
        to: RECALL_CLOSED_SUPERSEDED
        trigger: "system, on the parent CaseArch entering REMAKE_PENDING"
        actor: system
        preconditions:
          - "this row is the most recent Prosthesis of the arch"
        side_effects:
          - "increments Prosthesis.version by 1"

      - from: RECALL_OVERDUE
        to: RECALL_CLOSED_SUPERSEDED
        trigger: "system, on the parent CaseArch entering REMAKE_PENDING"
        actor: system
        preconditions:
          - "this row is the most recent Prosthesis of the arch"
        side_effects:
          - "increments Prosthesis.version by 1"

  # ---- axis 8 : PostDeliveryService.service_status (chairside vs lab fork) -
  - entity: PostDeliveryService
    state_field: service_status
    initial_state: REQUESTED
    terminal_states: [VOIDED]
    transitions:
      - from: REQUESTED
        to: IN_CHAIR
        trigger: "system, immediately on POST /prosthetics/services when service_type is in CHAIRSIDE_SERVICE_TYPES"
        actor: system
        preconditions:
          - "service_type is in CHAIRSIDE_SERVICE_TYPES"
        side_effects:
          - "leaves Prosthesis.in_patient_possession true"
          - "increments PostDeliveryService.version by 1"

      - from: REQUESTED
        to: AT_LAB
        trigger: "system, immediately on POST /prosthetics/services when service_type is in LAB_SERVICE_TYPES"
        actor: system
        preconditions:
          - "service_type is in LAB_SERVICE_TYPES"
        side_effects:
          - "auto-creates a LabCase in DRAFT on the parent CaseArch with dental_lab_id and bench_line copied from the request, turnaround_class STANDARD, unit_count 1, lab_invoice_amount LAB_DEFAULT_INVOICE_AMOUNT and purpose derived from service_type (HARD_RELINE_LAB -> RELINE, REBASE -> REBASE, TOOTH_ADDITION -> ADDITION, CLASP_ADDITION -> ADDITION)"
          - "sets PostDeliveryService.lab_case_id to the new LabCase id"
          - "sets Prosthesis.in_patient_possession to false"
          - "increments PostDeliveryService.version by 1"
        note: "The divergent side-effect set is the point of this fork: only the lab branch mints a LabCase and takes the appliance out of the patient's possession."

      - from: IN_CHAIR
        to: COMPLETED
        trigger: "POST /prosthetics/services/{service_id}/complete"
        actor: Prosthodontist
        preconditions:
          - "PostDeliveryService.service_status == IN_CHAIR"
        side_effects:
          - "computes charge_basis and charge_amount per calculation post_delivery_service_charge"
          - "when service_type is ADJUSTMENT and charge_basis is INCLUDED, increments Prosthesis.adjustments_used by 1 and decrements Prosthesis.adjustments_remaining by 1"
          - "adds charge_amount to ProsthesisCase.billed_amount and recomputes patient_responsibility_amount"
          - "stamps completed_at"
          - "increments PostDeliveryService.version by 1"

      - from: AT_LAB
        to: COMPLETED
        trigger: "POST /prosthetics/services/{service_id}/complete"
        actor: Prosthodontist
        preconditions:
          - "the linked LabCase has lab_status == QC_PASSED (cross-entity; rung 13)"
        side_effects:
          - "computes charge_basis and charge_amount per calculation post_delivery_service_charge"
          - "sets Prosthesis.in_patient_possession back to true"
          - "adds charge_amount to ProsthesisCase.billed_amount and recomputes patient_responsibility_amount"
          - "stamps completed_at"
          - "increments PostDeliveryService.version by 1"

      - from: REQUESTED
        to: VOIDED
        trigger: "POST /prosthetics/services/{service_id}/void, or system on POST /prosthetics/services creating a newer service of the same service_type on the same prosthesis (supersede)"
        actor: FrontOffice
        preconditions:
          - "PostDeliveryService.service_status in {REQUESTED, IN_CHAIR, AT_LAB}"
        side_effects:
          - "stamps voided_at"
          - "increments PostDeliveryService.version by 1"

      - from: IN_CHAIR
        to: VOIDED
        trigger: "POST /prosthetics/services/{service_id}/void, or system on POST /prosthetics/services creating a newer service of the same service_type on the same prosthesis (supersede)"
        actor: FrontOffice
        preconditions:
          - "PostDeliveryService.service_status in {REQUESTED, IN_CHAIR, AT_LAB}"
        side_effects:
          - "stamps voided_at"
          - "increments PostDeliveryService.version by 1"

      - from: AT_LAB
        to: VOIDED
        trigger: "POST /prosthetics/services/{service_id}/void, or system on POST /prosthetics/services creating a newer service of the same service_type on the same prosthesis (supersede)"
        actor: FrontOffice
        preconditions:
          - "PostDeliveryService.service_status in {REQUESTED, IN_CHAIR, AT_LAB}"
        side_effects:
          - "sets the linked LabCase to CANCELLED and releases its bench-line occupation"
          - "sets Prosthesis.in_patient_possession back to true"
          - "stamps voided_at"
          - "increments PostDeliveryService.version by 1"

      - from: COMPLETED
        to: VOIDED
        trigger: "POST /prosthetics/services/{service_id}/void"
        actor: FrontOffice
        preconditions:
          - "PostDeliveryService.service_status == COMPLETED"
        side_effects:
          - "COMPENSATING ACTION: when service_type is ADJUSTMENT and charge_basis is INCLUDED, decrements Prosthesis.adjustments_used by 1 and increments Prosthesis.adjustments_remaining by 1, restoring invariant adjustment_allowance_conservation"
          - "subtracts charge_amount from ProsthesisCase.billed_amount and recomputes patient_responsibility_amount"
          - "sets charge_amount to 0.00"
          - "stamps voided_at"
          - "increments PostDeliveryService.version by 1"
        note: "COMPLETED is deliberately NOT a terminal state: void is its declared compensating action and rung 10 must not pre-empt it. Every other trigger from COMPLETED is rejected by rung 12 with ERR_INVALID_STATE."

  # ---- axis 9 : WarrantyClaim.claim_status (4-way fault fan-out + re-entrant review)
  - entity: WarrantyClaim
    state_field: claim_status
    initial_state: SUBMITTED
    terminal_states: [CLINIC_FAULT, LAB_FAULT, PATIENT_FAULT]
    transitions:
      - from: SUBMITTED
        to: CLINIC_FAULT
        trigger: "POST /prosthetics/warranty-claims/{warranty_claim_id}/adjudicate with fault_verdict CLINIC_FAULT"
        actor: ClinicalDirector
        preconditions:
          - "the referenced Prosthesis has warranty_status == IN_WARRANTY (rung 23)"
          - "the logical clock is at or before Prosthesis.warranty_expires_at (rung 24)"
        side_effects:
          - "sets fault_verdict CLINIC_FAULT, warranty_consumed true, lab_credit_amount 0.00, patient_charge_amount 0.00"
          - "moves the referenced Prosthesis from IN_WARRANTY to WARRANTY_CONSUMED"
          - "stamps adjudicated_at"
          - "increments WarrantyClaim.version by 1"

      - from: SUBMITTED
        to: LAB_FAULT
        trigger: "POST /prosthetics/warranty-claims/{warranty_claim_id}/adjudicate with fault_verdict LAB_FAULT"
        actor: ClinicalDirector
        preconditions:
          - "the referenced Prosthesis has warranty_status == IN_WARRANTY (rung 23)"
          - "the logical clock is at or before Prosthesis.warranty_expires_at (rung 24)"
          - "WarrantyClaim.attributed_lab_case_id is non-null"
        side_effects:
          - "sets fault_verdict LAB_FAULT, warranty_consumed true, patient_charge_amount 0.00"
          - "computes lab_credit_amount per calculation lab_remake_credit"
          - "increases the attributed lab's DentalLab.credit_issued_total and credit_available_balance by lab_credit_amount"
          - "moves the referenced Prosthesis from IN_WARRANTY to WARRANTY_CONSUMED"
          - "stamps adjudicated_at"
          - "increments WarrantyClaim.version by 1"

      - from: SUBMITTED
        to: PATIENT_FAULT
        trigger: "POST /prosthetics/warranty-claims/{warranty_claim_id}/adjudicate with fault_verdict PATIENT_FAULT"
        actor: ClinicalDirector
        preconditions:
          - "the referenced Prosthesis has warranty_status == IN_WARRANTY (rung 23)"
        side_effects:
          - "sets fault_verdict PATIENT_FAULT, warranty_consumed false, lab_credit_amount 0.00"
          - "sets patient_charge_amount to FEE_REPAIR"
          - "adds patient_charge_amount to the case's billed_amount and recomputes patient_responsibility_amount"
          - "leaves the referenced Prosthesis in IN_WARRANTY, so the warranty is deliberately NOT consumed"
          - "stamps adjudicated_at"
          - "increments WarrantyClaim.version by 1"
        note: "Rung 24 (warranty window) is NOT applied on this leg: a patient-caused-damage verdict is chargeable regardless of whether the window has passed."

      - from: SUBMITTED
        to: CLINICAL_REVIEW
        trigger: "POST /prosthetics/warranty-claims/{warranty_claim_id}/adjudicate with fault_verdict INDETERMINATE"
        actor: ClinicalDirector
        preconditions:
          - "the referenced Prosthesis has warranty_status == IN_WARRANTY (rung 23)"
        side_effects:
          - "sets fault_verdict INDETERMINATE"
          - "leaves lab_credit_amount, patient_charge_amount and warranty_consumed at their defaults"
          - "increments WarrantyClaim.version by 1"

      - from: CLINICAL_REVIEW
        to: CLINIC_FAULT
        trigger: "POST /prosthetics/warranty-claims/{warranty_claim_id}/clinical-review with resolved_verdict CLINIC_FAULT"
        actor: ClinicalDirector
        preconditions:
          - "WarrantyClaim.claim_status == CLINICAL_REVIEW"
        side_effects:
          - "same side effects as the SUBMITTED to CLINIC_FAULT transition"
          - "increments WarrantyClaim.version by 1"

      - from: CLINICAL_REVIEW
        to: LAB_FAULT
        trigger: "POST /prosthetics/warranty-claims/{warranty_claim_id}/clinical-review with resolved_verdict LAB_FAULT"
        actor: ClinicalDirector
        preconditions:
          - "WarrantyClaim.claim_status == CLINICAL_REVIEW"
          - "WarrantyClaim.attributed_lab_case_id is non-null"
        side_effects:
          - "same side effects as the SUBMITTED to LAB_FAULT transition"
          - "increments WarrantyClaim.version by 1"

      - from: CLINICAL_REVIEW
        to: PATIENT_FAULT
        trigger: "POST /prosthetics/warranty-claims/{warranty_claim_id}/clinical-review with resolved_verdict PATIENT_FAULT"
        actor: ClinicalDirector
        preconditions:
          - "WarrantyClaim.claim_status == CLINICAL_REVIEW"
        side_effects:
          - "same side effects as the SUBMITTED to PATIENT_FAULT transition"
          - "increments WarrantyClaim.version by 1"

  # ---- axis 10 : RemakeRequest.authorization_status (branching + mutate-then-reject)
  - entity: RemakeRequest
    state_field: authorization_status
    initial_state: PENDING_APPROVAL
    terminal_states: [APPROVED, DENIED, FINAL_DENIED]
    transitions:
      - from: PENDING_APPROVAL
        to: FINAL_DENIED
        trigger: "POST /prosthetics/remake-requests, when the target CaseArch.remake_request_count is already at or above REMAKE_CEILING_PER_ARCH"
        actor: Prosthodontist
        preconditions:
          - "CaseArch.remake_eligibility == ELIGIBLE (otherwise rung 11 pre-empts)"
          - "CaseArch.remake_request_count >= REMAKE_CEILING_PER_ARCH"
        side_effects:
          - "MUTATE-THEN-REJECT: the RemakeRequest row is created in PENDING_APPROVAL, immediately moved to FINAL_DENIED with decided_at stamped, CaseArch.remake_eligibility is flipped to FINAL_DENIED, CaseArch.version is incremented by 1, ALL OF IT IS PERSISTED, and THEN the call raises ERR_REMAKE_LIMIT_EXCEEDED with HTTP 409"
          - "the persisted row is discoverable through GET /prosthetics/remake-requests with case_arch_id set"
        note: "A second remake request on the same arch is pre-empted by ladder rung 11 because CaseArch.remake_eligibility is now FINAL_DENIED, and surfaces ERR_REMAKE_FINAL_DENIED instead of ERR_REMAKE_LIMIT_EXCEEDED. No second FINAL_DENIED row is created."

      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /prosthetics/remake-requests/{remake_request_id}/approve"
        actor: ClinicalDirector
        preconditions:
          - "the calling X-User-ID differs from RemakeRequest.requested_by_user_id (rung 14 segregation of duties)"
          - "when warranty_claim_id is non-null, the cited WarrantyClaim.claim_status is in {CLINIC_FAULT, LAB_FAULT} (cross-entity; rung 13)"
          - "parent CaseArch.arch_status is in {DELIVERED, MILESTONE_PENDING}"
        side_effects:
          - "remake_cascade link 1: sets authorization_status APPROVED, approved_by_user_id and decided_at"
          - "remake_cascade link 2, caused by link 1: moves the parent CaseArch to REMAKE_PENDING and increments CaseArch.remake_count by 1"
          - "remake_cascade link 3, caused by link 2: sets the arch's most recent Prosthesis warranty_status to WARRANTY_VOIDED and recall_status to RECALL_CLOSED_SUPERSEDED, and sets every LabCase of the arch whose lab_status is in {DRAFT, DISPATCHED, RETURNED, QC_FAILED, RESENT} to CANCELLED"
          - "remake_cascade link 4, caused by link 3: when charge_basis is NO_CHARGE and the cited WarrantyClaim.claim_status is LAB_FAULT, the attributed DentalLab applies credit equal to min(WarrantyClaim.lab_credit_amount, DentalLab.credit_available_balance) by increasing credit_applied_total and decreasing credit_available_balance by that amount"
          - "remake_cascade link 5, caused by link 4: the case's PaymentPlan whose plan_status is in {ACTIVE, DELINQUENT} decreases principal_amount by the applied credit, increases applied_lab_credit_amount by it, and re-strikes its SCHEDULED and MISSED installments per calculation installment_reschedule"
          - "remake_cascade link 6, caused by link 5: when the re-struck plan's outstanding_amount reaches 0.00, the plan transitions to PAID_OFF, which clears the global write gate for that patient"
          - "moves the parent ProsthesisCase from DELIVERED back to IN_FABRICATION when it was DELIVERED"
          - "increments RemakeRequest.version by 1"

      - from: PENDING_APPROVAL
        to: DENIED
        trigger: "POST /prosthetics/remake-requests/{remake_request_id}/deny"
        actor: ClinicalDirector
        preconditions:
          - "the calling X-User-ID differs from RemakeRequest.requested_by_user_id (rung 14 segregation of duties)"
        side_effects:
          - "sets authorization_status DENIED, approved_by_user_id and decided_at"
          - "leaves the parent CaseArch untouched"
          - "increments RemakeRequest.version by 1"

  # ---- axis 11 : Predetermination.determination_status (3-way fan-out) ----
  - entity: Predetermination
    state_field: determination_status
    initial_state: SUBMITTED
    terminal_states: [DENIED, EXPIRED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /prosthetics/predeterminations/{predetermination_id}/determine with determination APPROVED"
        actor: FrontOffice
        preconditions:
          - "Predetermination.determination_status == SUBMITTED"
        side_effects:
          - "sets allowed_amount to requested_amount and alternate_benefit_type to null"
          - "computes estimated_plan_payment per calculation predetermination_plan_payment variant STANDARD_BENEFIT"
          - "sets estimated_patient_responsibility to requested_amount minus estimated_plan_payment"
          - "stamps determined_at and computes expires_at as determined_at plus PREDETERMINATION_VALIDITY_DAYS days"
          - "increments Predetermination.version by 1"

      - from: SUBMITTED
        to: ALTERNATE_BENEFIT
        trigger: "POST /prosthetics/predeterminations/{predetermination_id}/determine with determination ALTERNATE_BENEFIT"
        actor: FrontOffice
        preconditions:
          - "Predetermination.determination_status == SUBMITTED"
          - "the cited Coverage.alternate_benefit_enabled is true"
          - "the case's prosthesis_type has a declared ALTERNATE_BENEFIT_MAP_<type>_TO constant"
        side_effects:
          - "sets alternate_benefit_type to ALTERNATE_BENEFIT_MAP_<case prosthesis_type>_TO"
          - "sets allowed_amount to FEE_<alternate_benefit_type> multiplied by the number of the case's non-abandoned CaseArch rows"
          - "computes estimated_plan_payment per calculation predetermination_plan_payment variant ALTERNATE_BENEFIT_DOWNGRADE"
          - "sets estimated_patient_responsibility to requested_amount minus estimated_plan_payment"
          - "stamps determined_at and computes expires_at"
          - "increments Predetermination.version by 1"

      - from: SUBMITTED
        to: DENIED
        trigger: "POST /prosthetics/predeterminations/{predetermination_id}/determine with determination DENIED"
        actor: FrontOffice
        preconditions:
          - "Predetermination.determination_status == SUBMITTED"
        side_effects:
          - "sets allowed_amount 0.00, estimated_plan_payment 0.00 and estimated_patient_responsibility equal to requested_amount"
          - "stamps determined_at and leaves expires_at null"
          - "increments Predetermination.version by 1"

      - from: APPROVED
        to: EXPIRED
        trigger: "system, evaluated on every read or handling of the row, when the logical clock is strictly after expires_at"
        actor: system
        preconditions:
          - "the logical clock is strictly after Predetermination.expires_at"
        side_effects:
          - "increments Predetermination.version by 1"

      - from: ALTERNATE_BENEFIT
        to: EXPIRED
        trigger: "system, evaluated on every read or handling of the row, when the logical clock is strictly after expires_at"
        actor: system
        preconditions:
          - "the logical clock is strictly after Predetermination.expires_at"
        side_effects:
          - "increments Predetermination.version by 1"

  # ---- axis 12 : Claim.adjudication_status (two-stage COB branching) ------
  - entity: Claim
    state_field: adjudication_status
    initial_state: DRAFT
    terminal_states: [DENIED, REVERSED]
    transitions:
      - from: DRAFT
        to: SUBMITTED_PRIMARY
        trigger: "POST /prosthetics/claims/{claim_id}/submit"
        actor: FrontOffice
        preconditions:
          - "the logical clock is at or after Coverage.effective_date plus Coverage.waiting_period_days days (rung 28)"
          - "the patient owns no Prosthesis under a ProsthesisCase other than this claim's case, or the logical clock is at or after the maximum replacement_eligible_date over those other prostheses (rung 29)"
          - "when the case's predetermination_required is true, a Predetermination for the case exists with determination_status in {APPROVED, ALTERNATE_BENEFIT} and expires_at strictly after the logical clock (rung 30)"
          - "Coverage.benefit_remaining is strictly greater than 0.00 (rung 31)"
        side_effects:
          - "sets billed_amount to ProsthesisCase.fee_schedule_total"
          - "sets predetermination_id to the case's Predetermination row with determination_status in {APPROVED, ALTERNATE_BENEFIT} and the latest created_at, or null when none exists"
          - "sets allowed_amount to that Predetermination.allowed_amount when one was resolved, otherwise to billed_amount"
          - "sets submission_target PRIMARY and stamps submitted_at"
          - "increments Claim.version by 1"

      - from: SUBMITTED_PRIMARY
        to: PRIMARY_PAID
        trigger: "POST /prosthetics/claims/{claim_id}/post-payment with adjudication_outcome PAID"
        actor: FrontOffice
        preconditions:
          - "Claim.adjudication_status == SUBMITTED_PRIMARY"
        side_effects:
          - "computes primary_paid_amount per calculation claim_primary_payment and copies it into plan_paid_amount"
          - "increases the PRIMARY Coverage.benefit_used_ytd by primary_paid_amount and decreases benefit_remaining by the same"
          - "recomputes ProsthesisCase.insurance_paid_amount and patient_responsibility_amount"
          - "stamps adjudicated_at"
          - "auto-transitions to CLOSED when the patient has no Coverage with rank SECONDARY"
          - "increments Claim.version by 1"

      - from: SUBMITTED_PRIMARY
        to: DENIED
        trigger: "POST /prosthetics/claims/{claim_id}/post-payment with adjudication_outcome DENIED"
        actor: FrontOffice
        preconditions:
          - "Claim.adjudication_status == SUBMITTED_PRIMARY"
        side_effects:
          - "leaves primary_paid_amount and plan_paid_amount at 0.00"
          - "sets patient_responsibility_amount to billed_amount"
          - "stamps adjudicated_at"
          - "increments Claim.version by 1"

      - from: PRIMARY_PAID
        to: SUBMITTED_SECONDARY
        trigger: "POST /prosthetics/claims/{claim_id}/submit"
        actor: FrontOffice
        preconditions:
          - "exactly one Coverage exists with patient_id equal to the case's patient_id and rank SECONDARY"
          - "the logical clock is at or after that SECONDARY Coverage.effective_date plus its waiting_period_days days (rung 28)"
        side_effects:
          - "sets submission_target SECONDARY, copies the SECONDARY Coverage.cob_convention into cob_convention_applied and stamps submitted_at"
          - "increments Claim.version by 1"

      - from: SUBMITTED_SECONDARY
        to: SECONDARY_PAID
        trigger: "POST /prosthetics/claims/{claim_id}/post-payment with adjudication_outcome PAID"
        actor: FrontOffice
        preconditions:
          - "Claim.adjudication_status == SUBMITTED_SECONDARY"
        side_effects:
          - "computes secondary_paid_amount per calculation claim_secondary_cob_payment using the variant named by cob_convention_applied"
          - "sets plan_paid_amount to primary_paid_amount plus secondary_paid_amount"
          - "increases the SECONDARY Coverage.benefit_used_ytd by secondary_paid_amount and decreases benefit_remaining by the same"
          - "recomputes ProsthesisCase.insurance_paid_amount and patient_responsibility_amount"
          - "stamps adjudicated_at and auto-transitions to CLOSED"
          - "increments Claim.version by 1"

      - from: SUBMITTED_SECONDARY
        to: DENIED
        trigger: "POST /prosthetics/claims/{claim_id}/post-payment with adjudication_outcome DENIED"
        actor: FrontOffice
        preconditions:
          - "Claim.adjudication_status == SUBMITTED_SECONDARY"
        side_effects:
          - "leaves secondary_paid_amount at 0.00 and keeps plan_paid_amount equal to primary_paid_amount"
          - "stamps adjudicated_at"
          - "increments Claim.version by 1"

      - from: PRIMARY_PAID
        to: CLOSED
        trigger: "system, immediately after the PRIMARY_PAID transition when the patient has no Coverage with rank SECONDARY"
        actor: system
        preconditions:
          - "no Coverage exists with patient_id equal to the case's patient_id and rank SECONDARY"
        side_effects:
          - "increments Claim.version by 1"

      - from: SECONDARY_PAID
        to: CLOSED
        trigger: "system, immediately after the SECONDARY_PAID transition"
        actor: system
        preconditions:
          - "Claim.adjudication_status == SECONDARY_PAID"
        side_effects:
          - "increments Claim.version by 1"

      - from: CLOSED
        to: REVERSED
        trigger: "POST /prosthetics/claims/{claim_id}/reverse"
        actor: FrontOffice
        preconditions:
          - "Claim.adjudication_status == CLOSED"
        side_effects:
          - "COMPENSATING ACTION: decreases the PRIMARY Coverage.benefit_used_ytd by primary_paid_amount and the SECONDARY Coverage.benefit_used_ytd by secondary_paid_amount, restoring invariant coverage_benefit_conservation on both rows"
          - "sets primary_paid_amount, secondary_paid_amount and plan_paid_amount to 0.00"
          - "recomputes ProsthesisCase.insurance_paid_amount and patient_responsibility_amount"
          - "stamps reversed_at"
          - "increments Claim.version by 1"
        note: "CLOSED is deliberately NOT a terminal state so this compensating action stays reachable; every trigger other than reverse is rejected from CLOSED by rung 12."

  # ---- axis 13 : PaymentPlan.plan_status (delinquency cure cycle) ---------
  - entity: PaymentPlan
    state_field: plan_status
    initial_state: ACTIVE
    terminal_states: [PAID_OFF, SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: DELINQUENT
        trigger: "POST /prosthetics/payment-plans/{payment_plan_id}/assess-delinquency"
        actor: PlatformAdmin
        preconditions:
          - "after the sweep the plan has missed_count >= 1 and missed_count < PAYMENT_PLAN_DEFAULT_MISSED_COUNT"
        side_effects:
          - "sets every SCHEDULED Installment of this plan whose due_date plus PAYMENT_PLAN_DELINQUENCY_GRACE_DAYS days is strictly before the logical clock to MISSED"
          - "recomputes missed_count"
          - "sets Patient.write_gate_active to true, raising the global write gate of rung 5"
          - "increments PaymentPlan.version by 1"

      - from: ACTIVE
        to: DEFAULTED
        trigger: "POST /prosthetics/payment-plans/{payment_plan_id}/assess-delinquency"
        actor: PlatformAdmin
        preconditions:
          - "after the sweep the plan has missed_count >= PAYMENT_PLAN_DEFAULT_MISSED_COUNT"
        side_effects:
          - "sets qualifying SCHEDULED Installment rows to MISSED and recomputes missed_count"
          - "sets Patient.write_gate_active to true"
          - "increments PaymentPlan.version by 1"

      - from: DELINQUENT
        to: DEFAULTED
        trigger: "POST /prosthetics/payment-plans/{payment_plan_id}/assess-delinquency"
        actor: PlatformAdmin
        preconditions:
          - "after the sweep the plan has missed_count >= PAYMENT_PLAN_DEFAULT_MISSED_COUNT"
        side_effects:
          - "sets qualifying SCHEDULED Installment rows to MISSED and recomputes missed_count"
          - "increments PaymentPlan.version by 1"

      - from: DELINQUENT
        to: ACTIVE
        trigger: "system, on POST /prosthetics/installments/{installment_id}/pay leaving the plan with missed_count == 0"
        actor: system
        preconditions:
          - "no Installment of this plan has installment_status MISSED"
        side_effects:
          - "sets Patient.write_gate_active to false when the patient has no other DELINQUENT or DEFAULTED plan, lowering the global write gate"
          - "increments PaymentPlan.version by 1"
        note: "Closes the delinquency cycle ACTIVE -> DELINQUENT -> ACTIVE."

      - from: DEFAULTED
        to: ACTIVE
        trigger: "system, on POST /prosthetics/installments/{installment_id}/pay leaving the plan with missed_count == 0"
        actor: system
        preconditions:
          - "no Installment of this plan has installment_status MISSED"
        side_effects:
          - "sets Patient.write_gate_active to false when the patient has no other DELINQUENT or DEFAULTED plan"
          - "increments PaymentPlan.version by 1"

      - from: ACTIVE
        to: PAID_OFF
        trigger: "system, when outstanding_amount reaches 0.00 after a payment or after a lab-credit application"
        actor: system
        preconditions:
          - "PaymentPlan.outstanding_amount == 0.00"
        side_effects:
          - "increments PaymentPlan.version by 1"

      - from: DELINQUENT
        to: PAID_OFF
        trigger: "system, when outstanding_amount reaches 0.00 after a payment or after a lab-credit application"
        actor: system
        preconditions:
          - "PaymentPlan.outstanding_amount == 0.00 and missed_count == 0"
        side_effects:
          - "sets Patient.write_gate_active to false when the patient has no other DELINQUENT or DEFAULTED plan"
          - "increments PaymentPlan.version by 1"

      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system, on POST /prosthetics/payment-plans creating a newer plan for the same case_id"
        actor: system
        preconditions:
          - "PaymentPlan.plan_status in {ACTIVE, DELINQUENT}"
        side_effects:
          - "sets superseded_by_plan_id to the new plan id"
          - "sets every SCHEDULED or MISSED Installment of this plan to WAIVED"
          - "increments PaymentPlan.version by 1"

      - from: DELINQUENT
        to: SUPERSEDED
        trigger: "system, on POST /prosthetics/payment-plans creating a newer plan for the same case_id"
        actor: system
        preconditions:
          - "PaymentPlan.plan_status in {ACTIVE, DELINQUENT}"
        side_effects:
          - "sets superseded_by_plan_id to the new plan id"
          - "sets every SCHEDULED or MISSED Installment of this plan to WAIVED and recomputes missed_count to 0"
          - "sets Patient.write_gate_active to false when no other plan of the patient is DELINQUENT or DEFAULTED"
          - "increments PaymentPlan.version by 1"

  # ---- axis 14 : Installment.installment_status (cure cycle + reversal fork)
  - entity: Installment
    state_field: installment_status
    initial_state: SCHEDULED
    terminal_states: [WAIVED]
    transitions:
      - from: SCHEDULED
        to: PAID
        trigger: "POST /prosthetics/installments/{installment_id}/pay"
        actor: Patient
        preconditions:
          - "X-User-ID equals the parent PaymentPlan.patient_id (rung 3 ownership)"
          - "the amount_paid on the request equals Installment.amount to the cent"
        side_effects:
          - "stamps paid_at, increases PaymentPlan.paid_amount by Installment.amount and decreases outstanding_amount by the same"
          - "transitions the plan to PAID_OFF when outstanding_amount reaches 0.00"
          - "increments Installment.version by 1"

      - from: MISSED
        to: PAID
        trigger: "POST /prosthetics/installments/{installment_id}/pay"
        actor: Patient
        preconditions:
          - "X-User-ID equals the parent PaymentPlan.patient_id"
          - "the amount_paid on the request equals Installment.amount to the cent"
        side_effects:
          - "stamps paid_at, increases PaymentPlan.paid_amount and decreases outstanding_amount"
          - "decrements PaymentPlan.missed_count by 1 and cures the plan back to ACTIVE when missed_count reaches 0"
          - "increments Installment.version by 1"
        note: "This endpoint sits OUTSIDE the global write gate precisely so a gated patient can cure."

      - from: SCHEDULED
        to: MISSED
        trigger: "POST /prosthetics/payment-plans/{payment_plan_id}/assess-delinquency"
        actor: PlatformAdmin
        preconditions:
          - "due_date plus PAYMENT_PLAN_DELINQUENCY_GRACE_DAYS days is strictly before the logical clock"
        side_effects:
          - "increments PaymentPlan.missed_count by 1"
          - "increments Installment.version by 1"

      - from: PAID
        to: SCHEDULED
        trigger: "POST /prosthetics/installments/{installment_id}/reverse-payment"
        actor: FrontOffice
        preconditions:
          - "Installment.installment_status == PAID"
          - "the logical clock is at or before due_date plus PAYMENT_PLAN_DELINQUENCY_GRACE_DAYS days"
        side_effects:
          - "COMPENSATING ACTION: decreases PaymentPlan.paid_amount by Installment.amount and increases outstanding_amount by the same, restoring invariant payment_plan_conservation"
          - "clears paid_at back to null"
          - "increments Installment.version by 1"

      - from: PAID
        to: MISSED
        trigger: "POST /prosthetics/installments/{installment_id}/reverse-payment"
        actor: FrontOffice
        preconditions:
          - "Installment.installment_status == PAID"
          - "the logical clock is strictly after due_date plus PAYMENT_PLAN_DELINQUENCY_GRACE_DAYS days"
        side_effects:
          - "COMPENSATING ACTION identical to the PAID to SCHEDULED leg"
          - "increments PaymentPlan.missed_count by 1 and re-raises the write gate through the plan's DELINQUENT transition on the next assess-delinquency sweep"
          - "increments Installment.version by 1"
        note: "The reversal fork is decided by where the logical clock sits relative to the grace boundary, not by which endpoint was called."

      - from: SCHEDULED
        to: WAIVED
        trigger: "system, on a lab-credit application (remake_cascade link 5) fully absorbing this row, or on the parent plan being SUPERSEDED"
        actor: system
        preconditions:
          - "Installment.installment_status in {SCHEDULED, MISSED}"
        side_effects:
          - "sets amount to 0.00 and counts the row as satisfied in PaymentPlan.paid_amount"
          - "increments Installment.version by 1"

      - from: MISSED
        to: WAIVED
        trigger: "system, on a lab-credit application (remake_cascade link 5) fully absorbing this row, or on the parent plan being SUPERSEDED"
        actor: system
        preconditions:
          - "Installment.installment_status in {SCHEDULED, MISSED}"
        side_effects:
          - "sets amount to 0.00, decrements PaymentPlan.missed_count by 1 and counts the row as satisfied"
          - "increments Installment.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules  -- three OCC rules, all CREATE-with-supersede
# =============================================================================
concurrency_rules:
  - rule_id: lab-case-create-stale-arch
    parent_entity: CaseArch
    write_endpoint: "POST /prosthetics/lab-cases"
    occ_field: "expected_case_arch_version"
    description: |
      Creating a LabCase against a CaseArch whose version has advanced since the
      client last observed it is rejected. The product semantics deliberately let
      a newer DRAFT lab case supersede an older DRAFT one on the same arch, so a
      second create observing the same arch state would otherwise succeed and
      silently discard the first dispatch plan. OCC on CaseArch.version reduces
      that to a stale-version check.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: service-create-stale-prosthesis
    parent_entity: Prosthesis
    write_endpoint: "POST /prosthetics/services"
    occ_field: "expected_prosthesis_version"
    description: |
      Creating a PostDeliveryService against a Prosthesis whose version has
      advanced since the client last observed it is rejected. A newer service of
      the same service_type legitimately supersedes an older un-completed one
      (voiding it), so the write is not covered by any state precondition; a
      client acting on a stale view of adjustments_remaining, in_patient_possession
      or warranty_status would supersede work it never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: payment-plan-create-stale-case
    parent_entity: ProsthesisCase
    write_endpoint: "POST /prosthetics/payment-plans"
    occ_field: "expected_prosthesis_case_version"
    description: |
      Creating a PaymentPlan against a ProsthesisCase whose version has advanced
      since the client last observed it is rejected. A newer plan legitimately
      supersedes the case's current ACTIVE or DELINQUENT plan, and its principal
      is struck from ProsthesisCase.patient_responsibility_amount, so a stale view
      of that amount would mint a schedule for the wrong balance.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table  -- 15 calculations, 6 of them dual-variant
# =============================================================================
calculations:

  - name: impression_quality_band
    trigger: "POST /prosthetics/impressions/{impression_id}/review"
    algorithm: threshold
    formula: |
      # quality_score is an integer in [IMPRESSION_SCORE_MIN, IMPRESSION_SCORE_MAX]
      if quality_score >= IMPRESSION_ACCEPT_MIN:            band = "ACCEPTED"
      elif quality_score >= IMPRESSION_PROVISIONAL_MIN:     band = "PROVISIONAL_ACCEPTED"
      else:                                                 band = "REJECTED"
      retake_required = (band != "ACCEPTED")
    input_set: "The single ImpressionRecord named in the path, which must have quality_status PENDING_REVIEW."
    constants:
      IMPRESSION_ACCEPT_MIN: 85
      IMPRESSION_PROVISIONAL_MIN: 70
      IMPRESSION_SCORE_MIN: 0
      IMPRESSION_SCORE_MAX: 100
    precision: "integer comparison; both boundaries are inclusive on the lower edge (>=)"

  - name: lab_promised_due_at
    trigger: "POST /prosthetics/lab-cases/{lab_case_id}/dispatch"
    algorithm: threshold
    formula: |
      # DUAL VARIANT: the same output name, two formulas selected by turnaround_class.
      if turnaround_class == "STANDARD":
          promised_due_at = dispatched_at + DentalLab.standard_turnaround_days days
      else:  # RUSH
          promised_due_at = dispatched_at + DentalLab.rush_turnaround_days days
      shelf_life_expires_at = dispatched_at + LAB_SHELF_LIFE_DAYS days   # identical on both variants
    input_set: "The LabCase named in the path and its DentalLab row; dispatched_at is the logical clock at the moment of dispatch."
    constants:
      LAB_STANDARD_TURNAROUND_DAYS: 10
      LAB_RUSH_TURNAROUND_DAYS: 4
      LAB_SHELF_LIFE_DAYS: 45
    precision: "whole calendar days added to an ISO 8601 UTC instant; the time-of-day component is preserved"
    variants:
      - name: STANDARD_TURNAROUND
        when: "LabCase.turnaround_class == STANDARD"
        difference: "adds DentalLab.standard_turnaround_days (default 10) and charges no rush fee"
      - name: RUSH_TURNAROUND
        when: "LabCase.turnaround_class == RUSH"
        difference: "adds DentalLab.rush_turnaround_days (default 4) and charges calculation lab_rush_fee on top of the case balance"

  - name: lab_rush_fee
    trigger: "POST /prosthetics/lab-cases/{lab_case_id}/dispatch"
    algorithm: tiered_pricing
    formula: |
      if turnaround_class == "STANDARD":
          rush_fee_amount = 0.00
      else:
          rush_fee_amount = round_half_up(LAB_RUSH_FEE_BASE + LAB_RUSH_FEE_PER_UNIT * unit_count, 2)
    input_set: "The LabCase named in the path; unit_count is the value supplied at creation."
    constants:
      LAB_RUSH_FEE_BASE: 120.00
      LAB_RUSH_FEE_PER_UNIT: 35.00
    precision: "2 decimal places, round_half_up"

  - name: arch_fee_schedule_amount
    trigger: "POST /prosthetics/cases/{case_id}/complete-exam"
    algorithm: aggregation
    formula: |
      CaseArch.fee_schedule_amount = FEE_<parent ProsthesisCase.prosthesis_type>
      ProsthesisCase.fee_schedule_total = sum of CaseArch.fee_schedule_amount
          over CaseArch rows with case_id == this case AND arch_status != "ARCH_ABANDONED"
      ProsthesisCase.predetermination_required =
          (ProsthesisCase.fee_schedule_total >= PREDETERMINATION_REQUIRED_MIN_FEE)
    input_set: "CaseArch rows of the case whose arch_status is not ARCH_ABANDONED. No time window; ties are impossible because the sum is order-independent."
    constants:
      FEE_COMPLETE_DENTURE: 1800.00
      FEE_IMMEDIATE_DENTURE: 2100.00
      FEE_CAST_PARTIAL: 1650.00
      FEE_FLEXIBLE_PARTIAL: 1200.00
      FEE_OVERDENTURE: 2400.00
      FEE_IMPLANT_RETAINED_OVERDENTURE: 3600.00
      PREDETERMINATION_REQUIRED_MIN_FEE: 1500.00
    precision: "2 decimal places, round_half_up"

  - name: predetermination_plan_payment
    trigger: "POST /prosthetics/predeterminations/{predetermination_id}/determine"
    algorithm: threshold
    formula: |
      # DUAL VARIANT: same output name estimated_plan_payment, two formulas.
      arch_count = number of CaseArch rows of the case with arch_status != "ARCH_ABANDONED"
      if determination == "APPROVED":                 # variant STANDARD_BENEFIT
          allowed_amount = requested_amount           # == ProsthesisCase.fee_schedule_total
      elif determination == "ALTERNATE_BENEFIT":      # variant ALTERNATE_BENEFIT_DOWNGRADE
          alternate_benefit_type = ALTERNATE_BENEFIT_MAP_<case.prosthesis_type>_TO
          allowed_amount = FEE_<alternate_benefit_type> * arch_count
      else:                                          # DENIED
          allowed_amount = 0.00
      uncapped = round_half_up(allowed_amount * Coverage.coinsurance_major_rate, 2)
      estimated_plan_payment = min(uncapped, Coverage.benefit_remaining)
      estimated_patient_responsibility = round_half_up(requested_amount - estimated_plan_payment, 2)
    input_set: "The Predetermination row named in the path, its Coverage row, and the case's non-abandoned CaseArch rows."
    constants:
      COVERAGE_DEFAULT_COINSURANCE_MAJOR_RATE: 0.50
      ALTERNATE_BENEFIT_MAP_IMPLANT_RETAINED_OVERDENTURE_TO: "COMPLETE_DENTURE"
      ALTERNATE_BENEFIT_MAP_OVERDENTURE_TO: "COMPLETE_DENTURE"
      ALTERNATE_BENEFIT_MAP_CAST_PARTIAL_TO: "FLEXIBLE_PARTIAL"
      FEE_COMPLETE_DENTURE: 1800.00
      FEE_FLEXIBLE_PARTIAL: 1200.00
    precision: "2 decimal places, round_half_up; the annual-maximum cap is applied AFTER rounding the coinsurance product"
    variants:
      - name: STANDARD_BENEFIT
        when: "determination == APPROVED"
        difference: "the allowed basis is the case's own fee_schedule_total, so the plan pays coinsurance on what was actually requested"
      - name: ALTERNATE_BENEFIT_DOWNGRADE
        when: "determination == ALTERNATE_BENEFIT and Coverage.alternate_benefit_enabled is true"
        difference: "the allowed basis is the fee of a less expensive alternative prosthesis type multiplied by the arch count; the patient owes the whole difference between requested_amount and the downgraded basis"

  - name: claim_primary_payment
    trigger: "POST /prosthetics/claims/{claim_id}/post-payment with adjudication_outcome PAID and submission_target PRIMARY"
    algorithm: threshold
    formula: |
      uncapped = round_half_up(Claim.allowed_amount * PrimaryCoverage.coinsurance_major_rate, 2)
      primary_paid_amount = min(uncapped, PrimaryCoverage.benefit_remaining)
      plan_paid_amount = primary_paid_amount
      patient_responsibility_amount = max(0.00, round_half_up(Claim.billed_amount - plan_paid_amount, 2))
    input_set: "The Claim row named in the path and the Coverage row named by Claim.coverage_id (rank PRIMARY)."
    constants:
      COVERAGE_DEFAULT_COINSURANCE_MAJOR_RATE: 0.50
    precision: "2 decimal places, round_half_up; cap applied after rounding"

  - name: claim_secondary_cob_payment
    trigger: "POST /prosthetics/claims/{claim_id}/post-payment with adjudication_outcome PAID and submission_target SECONDARY"
    algorithm: threshold
    formula: |
      # DUAL VARIANT: same output name secondary_paid_amount, two conventions.
      secondary_would_have_paid = round_half_up(Claim.allowed_amount * SecondaryCoverage.coinsurance_major_rate, 2)
      patient_balance = max(0.00, round_half_up(Claim.billed_amount - Claim.primary_paid_amount, 2))
      if cob_convention_applied == "STANDARD":
          raw = min(round_half_up(Claim.allowed_amount - Claim.primary_paid_amount, 2), patient_balance)
      else:  # NON_DUPLICATION
          raw = max(0.00, round_half_up(secondary_would_have_paid - Claim.primary_paid_amount, 2))
      secondary_paid_amount = min(max(0.00, raw), SecondaryCoverage.benefit_remaining)
      plan_paid_amount = round_half_up(Claim.primary_paid_amount + secondary_paid_amount, 2)
      patient_responsibility_amount = max(0.00, round_half_up(Claim.billed_amount - plan_paid_amount, 2))
    input_set: "The Claim row named in the path; SecondaryCoverage is the single Coverage row with patient_id == the case's patient_id AND rank == SECONDARY (rung 27 guarantees at most one such row exists)."
    constants:
      COVERAGE_DEFAULT_COINSURANCE_MAJOR_RATE: 0.50
    precision: "2 decimal places, round_half_up; each subtraction is rounded before the min/max is taken"
    variants:
      - name: STANDARD_COB
        when: "SecondaryCoverage.cob_convention == STANDARD"
        difference: "the secondary tops the patient up to the allowed amount, so it pays the lesser of (allowed - primary_paid) and the patient's remaining balance"
      - name: NON_DUPLICATION_COB
        when: "SecondaryCoverage.cob_convention == NON_DUPLICATION"
        difference: "the secondary pays only the excess of what it would have paid as primary over what the primary actually paid, and pays nothing when the primary already paid at least that much"

  - name: warranty_and_replacement_clocks
    trigger: "POST /prosthetics/prostheses"
    algorithm: threshold
    formula: |
      # TWO CLOCKS THAT DELIBERATELY DISAGREE.
      warranty_expires_at = delivered_at + WARRANTY_WINDOW_DAYS days    # always from THIS delivery
      # DUAL VARIANT on frequency_anchor_at / replacement_eligible_date:
      if superseded_prosthesis_id is null:            # variant ORIGINAL_DELIVERY
          frequency_anchor_at = delivered_at
      else:                                            # variant REMAKE_DELIVERY
          frequency_anchor_at = Prosthesis[superseded_prosthesis_id].frequency_anchor_at
      replacement_eligible_date = frequency_anchor_at + REPLACEMENT_FREQUENCY_MONTHS months
    input_set: "The Prosthesis row being created and, on a remake, the row named by superseded_prosthesis_id."
    constants:
      WARRANTY_WINDOW_DAYS: 365
      REPLACEMENT_FREQUENCY_MONTHS: 60
    precision: "whole calendar days for the warranty clock; whole calendar months for the replacement clock, keeping the day-of-month and clamping to the last day of the target month when it is shorter"
    variants:
      - name: ORIGINAL_DELIVERY
        when: "Prosthesis.superseded_prosthesis_id is null"
        difference: "both clocks start at this delivery: warranty_expires_at and replacement_eligible_date are both measured from delivered_at"
      - name: REMAKE_DELIVERY
        when: "Prosthesis.superseded_prosthesis_id is non-null"
        difference: "the warranty clock RESTARTS from the remake's own delivered_at, while the insurance replacement clock does NOT — frequency_anchor_at is copied verbatim from the superseded prosthesis, so a remake buys no new frequency eligibility"

  - name: recall_schedule
    trigger: "POST /prosthetics/prostheses, and again on every POST /prosthetics/prostheses/{prosthesis_id}/recall-complete with recall_outcome NO_ACTION"
    algorithm: decay_function
    formula: |
      interval_days = RECALL_INTERVAL_<Prosthesis.prosthesis_type>_DAYS
      recall_due_at = delivered_at + (recall_cycle_count + 1) * interval_days days
      # banding, evaluated against the logical clock on every read or handling:
      if now >= recall_due_at + RECALL_OVERDUE_GRACE_DAYS days:  recall band = OVERDUE
      elif now >= recall_due_at:                                 recall band = DUE
      else:                                                      recall band = SCHEDULED
    input_set: "The single Prosthesis row; recall_cycle_count starts at 0 and increases by one on each NO_ACTION completion."
    constants:
      RECALL_INTERVAL_COMPLETE_DENTURE_DAYS: 365
      RECALL_INTERVAL_IMMEDIATE_DENTURE_DAYS: 90
      RECALL_INTERVAL_CAST_PARTIAL_DAYS: 365
      RECALL_INTERVAL_FLEXIBLE_PARTIAL_DAYS: 365
      RECALL_INTERVAL_OVERDENTURE_DAYS: 180
      RECALL_INTERVAL_IMPLANT_RETAINED_OVERDENTURE_DAYS: 180
      RECALL_OVERDUE_GRACE_DAYS: 30
    precision: "whole calendar days; the DUE boundary is inclusive (>=) and the OVERDUE boundary is inclusive of recall_due_at + 30 days"

  - name: post_delivery_service_charge
    trigger: "POST /prosthetics/services/{service_id}/complete"
    algorithm: threshold
    formula: |
      # DUAL VARIANT on charge_amount for service_type == ADJUSTMENT.
      if service_type == "ADJUSTMENT":
          within_count  = (Prosthesis.adjustments_used < ADJUSTMENT_ALLOWANCE_COUNT)
          within_window = (now <= Prosthesis.adjustment_window_ends_at)
          if within_count and within_window:      # variant INCLUDED_ADJUSTMENT
              charge_basis = "INCLUDED"; charge_amount = 0.00
          else:                                    # variant CHARGEABLE_ADJUSTMENT
              charge_basis = "CHARGEABLE"; charge_amount = ADJUSTMENT_CHARGEABLE_FEE
      elif the service was auto-created by a WarrantyClaim whose claim_status is in {CLINIC_FAULT, LAB_FAULT}:
          charge_basis = "WARRANTY_NO_CHARGE"; charge_amount = 0.00
      else:
          charge_basis = "CHARGEABLE"; charge_amount = FEE_<service_type>
    input_set: "The PostDeliveryService row named in the path and its parent Prosthesis; adjustments_used counts only COMPLETED ADJUSTMENT rows whose charge_basis is INCLUDED."
    constants:
      ADJUSTMENT_ALLOWANCE_COUNT: 4
      ADJUSTMENT_ALLOWANCE_WINDOW_DAYS: 90
      ADJUSTMENT_CHARGEABLE_FEE: 85.00
      FEE_SOFT_RELINE_CHAIRSIDE: 260.00
      FEE_HARD_RELINE_LAB: 420.00
      FEE_REBASE: 590.00
      FEE_REPAIR: 180.00
      FEE_TOOTH_ADDITION: 155.00
      FEE_CLASP_ADDITION: 195.00
    precision: "2 decimal places, round_half_up; the count boundary is strict (< 4 is included, == 4 is chargeable) and the window boundary is inclusive (<= adjustment_window_ends_at is included)"
    variants:
      - name: INCLUDED_ADJUSTMENT
        when: "service_type is ADJUSTMENT and adjustments_used < ADJUSTMENT_ALLOWANCE_COUNT and now <= adjustment_window_ends_at"
        difference: "charge_amount is 0.00 and the completion consumes one unit of the allowance, moving adjustments_used up and adjustments_remaining down"
      - name: CHARGEABLE_ADJUSTMENT
        when: "service_type is ADJUSTMENT and either adjustments_used == ADJUSTMENT_ALLOWANCE_COUNT or now > adjustment_window_ends_at"
        difference: "charge_amount is ADJUSTMENT_CHARGEABLE_FEE and the allowance counters are left untouched, so the conservation invariant still holds"

  - name: service_frequency_eligibility
    trigger: "POST /prosthetics/services"
    algorithm: chronological
    formula: |
      limit_months = FREQ_<service_type>_MONTHS
      if limit_months == 0:
          eligible = true
      else:
          last = the PostDeliveryService row on this prosthesis with the same service_type,
                 service_status == "COMPLETED", ordered by completed_at DESC then created_at DESC,
                 taking the first row; null when no such row exists
          eligible = (last is null) or (now >= last.completed_at + limit_months months)
    input_set: "COMPLETED PostDeliveryService rows on the same prosthesis with the same service_type. Sort key completed_at DESC; tie-break created_at DESC. VOIDED rows are excluded."
    constants:
      FREQ_ADJUSTMENT_MONTHS: 0
      FREQ_SOFT_RELINE_CHAIRSIDE_MONTHS: 6
      FREQ_HARD_RELINE_LAB_MONTHS: 24
      FREQ_REBASE_MONTHS: 36
      FREQ_REPAIR_MONTHS: 0
      FREQ_TOOTH_ADDITION_MONTHS: 0
      FREQ_CLASP_ADDITION_MONTHS: 0
    precision: "whole calendar months; the eligibility boundary is inclusive (>=)"

  - name: lab_remake_credit
    trigger: "POST /prosthetics/warranty-claims/{warranty_claim_id}/adjudicate and POST /prosthetics/warranty-claims/{warranty_claim_id}/clinical-review"
    algorithm: threshold
    formula: |
      # DUAL VARIANT on lab_credit_amount, selected by the fault verdict.
      if verdict == "LAB_FAULT" and attributed_lab_case_id is non-null:   # variant LAB_BORNE
          lab_credit_amount = round_half_up(LabCase.lab_invoice_amount * LAB_FAULT_CREDIT_RATE, 2)
      else:                                                                # variant CLINIC_BORNE
          lab_credit_amount = 0.00
      DentalLab.credit_issued_total   += lab_credit_amount
      DentalLab.credit_available_balance = DentalLab.credit_issued_total - DentalLab.credit_applied_total
    input_set: "The WarrantyClaim row named in the path, the LabCase named by attributed_lab_case_id, and that lab case's DentalLab."
    constants:
      LAB_FAULT_CREDIT_RATE: 0.60
      LAB_DEFAULT_INVOICE_AMOUNT: 450.00
    precision: "2 decimal places, round_half_up"
    variants:
      - name: LAB_BORNE
        when: "fault verdict is LAB_FAULT and WarrantyClaim.attributed_lab_case_id is non-null"
        difference: "the laboratory bears LAB_FAULT_CREDIT_RATE of its own invoice as a credit; the credit is issued at adjudication and applied later during remake_cascade link 4"
      - name: CLINIC_BORNE
        when: "fault verdict is CLINIC_FAULT, PATIENT_FAULT, or LAB_FAULT with no attributed lab case"
        difference: "no credit is issued; the clinic (or the patient, on PATIENT_FAULT) bears the whole cost and DentalLab.credit_available_balance is unchanged"

  - name: case_total_due
    trigger: "recomputed on POST /prosthetics/lab-cases/{lab_case_id}/dispatch, POST /prosthetics/services/{service_id}/complete, POST /prosthetics/services/{service_id}/void, POST /prosthetics/warranty-claims/{warranty_claim_id}/adjudicate, POST /prosthetics/claims/{claim_id}/post-payment, POST /prosthetics/claims/{claim_id}/reverse, and POST /prosthetics/payment-plans"
    algorithm: waterfall_allocation
    formula: |
      # EVALUATION ORDER IS PINNED. The discount tier is keyed on the PRE-discount
      # responsibility, never on the post-discount total; re-tiering is forbidden.
      # step 1
      gross_fee = ProsthesisCase.fee_schedule_total
      # step 2
      rush_total = sum of LabCase.rush_fee_amount over the case's LabCase rows whose
                   lab_status is in {DISPATCHED, RETURNED, QC_PASSED, QC_FAILED, RESENT, EXPIRED}
      # step 3
      service_total = sum of PostDeliveryService.charge_amount over the case's services
                      whose service_status == "COMPLETED"
                    + sum of WarrantyClaim.patient_charge_amount over the case's warranty claims
                      whose claim_status == "PATIENT_FAULT"
      # step 4
      billed_amount = round_half_up(gross_fee + rush_total + service_total, 2)
      # step 5
      insurance_paid_amount = sum of Claim.plan_paid_amount over the case's Claim rows
                              whose adjudication_status is in {PRIMARY_PAID, SECONDARY_PAID, CLOSED}
      # step 6
      pre_discount_responsibility = max(0.00, round_half_up(billed_amount - insurance_paid_amount, 2))
      # step 7 -- tier keyed on the step-6 value ONLY
      if pre_discount_responsibility >= PROMPT_PAY_TIER_2_MIN:   discount_rate = PROMPT_PAY_TIER_2_RATE
      elif pre_discount_responsibility >= PROMPT_PAY_TIER_1_MIN: discount_rate = PROMPT_PAY_TIER_1_RATE
      else:                                                      discount_rate = PROMPT_PAY_TIER_0_RATE
      # step 8
      if the case has a PaymentPlan with plan_status in {ACTIVE, DELINQUENT} and pay_in_full is true:
          prompt_pay_discount_amount = round_half_up(pre_discount_responsibility * discount_rate, 2)
      else:
          prompt_pay_discount_amount = 0.00
      # step 9
      patient_responsibility_amount = round_half_up(pre_discount_responsibility - prompt_pay_discount_amount, 2)
    input_set: "All LabCase, PostDeliveryService, WarrantyClaim and Claim rows reachable from this ProsthesisCase, filtered by the explicit status sets above. The sums are order-independent; no tie-break is needed."
    constants:
      PROMPT_PAY_TIER_2_MIN: 2500.00
      PROMPT_PAY_TIER_1_MIN: 1000.00
      PROMPT_PAY_TIER_2_RATE: 0.05
      PROMPT_PAY_TIER_1_RATE: 0.03
      PROMPT_PAY_TIER_0_RATE: 0.00
    precision: "2 decimal places, round_half_up at every numbered step; the tier boundaries are inclusive on the lower edge (>=)"

  - name: installment_schedule
    trigger: "POST /prosthetics/payment-plans"
    algorithm: waterfall_allocation
    formula: |
      # ROUNDING ORDER IS PINNED: round the per-installment base FIRST, then put the
      # whole residual on the FINAL installment. Summing first and rounding once is
      # explicitly wrong here.
      principal_amount = round_half_up(ProsthesisCase.patient_responsibility_amount - down_payment_amount, 2)
      n = installment_count
      base = round_half_up(principal_amount / n, 2)
      for k in 1 .. n-1:  Installment[k].amount = base
      Installment[n].amount = round_half_up(principal_amount - base * (n - 1), 2)
      Installment[n].is_residual_installment = true
      spacing_days = PAYMENT_FREQUENCY_MONTHLY_DAYS if frequency == "MONTHLY" else PAYMENT_FREQUENCY_BIWEEKLY_DAYS
      Installment[k].due_date = first_due_date + (k - 1) * spacing_days days
      outstanding_amount = principal_amount
      paid_amount = 0.00
    input_set: "The PaymentPlan being created and the ProsthesisCase.patient_responsibility_amount observed at that instant (already net of any prompt-pay discount when pay_in_full is true)."
    constants:
      PAYMENT_PLAN_MIN_INSTALLMENTS: 2
      PAYMENT_PLAN_MAX_INSTALLMENTS: 12
      PAYMENT_FREQUENCY_MONTHLY_DAYS: 30
      PAYMENT_FREQUENCY_BIWEEKLY_DAYS: 14
    precision: "2 decimal places, round_half_up; the residual lands on sequence_number == installment_count and nowhere else"

  - name: installment_reschedule
    trigger: "remake_cascade link 5, when a DentalLab credit is applied to a PaymentPlan"
    algorithm: waterfall_allocation
    formula: |
      applied = min(WarrantyClaim.lab_credit_amount, DentalLab.credit_available_balance)
      principal_amount = round_half_up(principal_amount - applied, 2)
      applied_lab_credit_amount = round_half_up(applied_lab_credit_amount + applied, 2)
      DentalLab.credit_applied_total += applied
      DentalLab.credit_available_balance -= applied
      # Re-strike only the rows that are still open, in ascending sequence_number,
      # consuming the credit from the LAST open row backwards so earlier due dates
      # are preserved. Ordering key: sequence_number DESC; no tie-break is needed
      # because sequence_number is unique within a plan.
      remaining_to_absorb = applied
      for row in open rows (installment_status in {SCHEDULED, MISSED}) ordered by sequence_number DESC:
          take = min(row.amount, remaining_to_absorb)
          row.amount = round_half_up(row.amount - take, 2)
          remaining_to_absorb = round_half_up(remaining_to_absorb - take, 2)
          if row.amount == 0.00:  row.installment_status = "WAIVED"
      outstanding_amount = round_half_up(principal_amount - paid_amount, 2)
    input_set: "Installment rows of the plan whose installment_status is in {SCHEDULED, MISSED}, processed in sequence_number DESC order. PAID and already-WAIVED rows are excluded."
    constants:
      LAB_FAULT_CREDIT_RATE: 0.60
    precision: "2 decimal places, round_half_up on every assignment"

  - name: payment_plan_delinquency
    trigger: "POST /prosthetics/payment-plans/{payment_plan_id}/assess-delinquency"
    algorithm: aggregation
    formula: |
      for row in Installment rows of this plan with installment_status == "SCHEDULED":
          if row.due_date + PAYMENT_PLAN_DELINQUENCY_GRACE_DAYS days < now:
              row.installment_status = "MISSED"
      missed_count = count of Installment rows of this plan with installment_status == "MISSED"
      if missed_count >= PAYMENT_PLAN_DEFAULT_MISSED_COUNT:  plan_status = "DEFAULTED"
      elif missed_count >= 1:                                 plan_status = "DELINQUENT"
      else:                                                   plan_status unchanged
      Patient.write_gate_active = (the patient has any PaymentPlan with plan_status in {DELINQUENT, DEFAULTED})
    input_set: "SCHEDULED Installment rows of the named plan only; PAID and WAIVED rows are never swept."
    constants:
      PAYMENT_PLAN_DELINQUENCY_GRACE_DAYS: 10
      PAYMENT_PLAN_DEFAULT_MISSED_COUNT: 3
    precision: "the grace boundary is strict: an installment becomes MISSED only when due_date + 10 days is STRICTLY BEFORE the logical clock, so the instant exactly 10 days after due_date is still on time"

# =============================================================================
# Conservation invariants -- four conserved quantities, each with a forward
# action and a compensating action that must leave the quantity unchanged.
# =============================================================================
conservation_invariants:
  - name: adjustment_allowance_conservation
    quantity: "Prosthesis.adjustments_used + Prosthesis.adjustments_remaining"
    invariant: "Prosthesis.adjustments_used + Prosthesis.adjustments_remaining == ADJUSTMENT_ALLOWANCE_COUNT (4) at every observable instant"
    forward_action: "POST /prosthetics/services/{service_id}/complete on an ADJUSTMENT whose charge_basis resolves to INCLUDED"
    compensating_action: "POST /prosthetics/services/{service_id}/void on that same COMPLETED row"
    note: "A CHARGEABLE adjustment (past the count or past the window) must NOT move either counter, so the sum is unchanged on that path too."

  - name: payment_plan_conservation
    quantity: "PaymentPlan.paid_amount + PaymentPlan.outstanding_amount"
    invariant: "PaymentPlan.paid_amount + PaymentPlan.outstanding_amount == PaymentPlan.principal_amount, and PaymentPlan.principal_amount == the sum of Installment.amount over the plan's rows plus the sum of Installment.amount already collected on PAID rows"
    forward_action: "POST /prosthetics/installments/{installment_id}/pay"
    compensating_action: "POST /prosthetics/installments/{installment_id}/reverse-payment"

  - name: lab_credit_conservation
    quantity: "DentalLab.credit_issued_total - DentalLab.credit_applied_total"
    invariant: "DentalLab.credit_issued_total - DentalLab.credit_applied_total == DentalLab.credit_available_balance at every observable instant"
    forward_action: "POST /prosthetics/warranty-claims/{warranty_claim_id}/adjudicate with fault_verdict LAB_FAULT (issues credit)"
    compensating_action: "remake_cascade link 4, which applies the credit -- credit_applied_total rises by exactly the amount credit_available_balance falls by, leaving credit_issued_total untouched"

  - name: coverage_benefit_conservation
    quantity: "Coverage.benefit_used_ytd + Coverage.benefit_remaining"
    invariant: "Coverage.benefit_used_ytd + Coverage.benefit_remaining == Coverage.annual_maximum_amount at every observable instant"
    forward_action: "POST /prosthetics/claims/{claim_id}/post-payment with adjudication_outcome PAID"
    compensating_action: "POST /prosthetics/claims/{claim_id}/reverse"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority) -- 31 rungs
#
# GLOBAL WRITE GATE: rung 5. It sits above every existence-of-body-reference,
# schema, enum, OCC and state check, so it pre-empts 26 of the 31 rungs. The
# endpoints it does NOT cover are enumerated verbatim on that rung, each with a
# one-line reason; that exclusion list is the only thing that keeps the lower
# rungs reachable for a delinquent patient.
#
# MUTATE-THEN-REJECT rungs: 15 (lab shelf-life) and 22 (remake ceiling). Each
# one commits a bookkeeping write and THEN raises. The second attempt on an
# already-flipped row is pre-empted by a higher rung and surfaces a DIFFERENT
# error; rungs 10 and 11 are the pre-empting rungs and say so explicitly.
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role is present and names one of the six roles declared in the RBAC matrix, and X-User-ID is present and non-empty."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "The role named by X-User-Role appears in the roles list of the endpoint being called."
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "Entity-backed ownership. When X-User-Role is Patient, X-User-ID must equal the Patient.id that owns the resource reached through the path (Patient.id itself; PaymentPlan.patient_id; Installment -> PaymentPlan.patient_id; ProsthesisCase.patient_id). When X-User-Role is LabTechnician, X-User-ID must equal LabCase.dental_lab_id for the lab case named in the path."
    error_id: ERR_NOT_OWNER
    http_status: 403
    applies_to: "GET /prosthetics/patients/{patient_id}, GET /prosthetics/payment-plans/{payment_plan_id}, GET /prosthetics/installments/{installment_id}, POST /prosthetics/installments/{installment_id}/pay, POST /prosthetics/lab-cases/{lab_case_id}/receive"

  - priority: 4
    category: existence
    check: "Every resource named by a path segment exists, validated left to right. Patient -> ERR_PATIENT_NOT_FOUND; ProsthesisCase -> ERR_CASE_NOT_FOUND; CaseArch -> ERR_ARCH_NOT_FOUND; LabCase -> ERR_LAB_CASE_NOT_FOUND; Prosthesis -> ERR_PROSTHESIS_NOT_FOUND; every other entity (Coverage, DentalLab, ImpressionRecord, TryInMilestone, PostDeliveryService, WarrantyClaim, RemakeRequest, Predetermination, Claim, PaymentPlan, Installment) -> ERR_RESOURCE_NOT_FOUND."
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint with a path parameter"

  - priority: 5
    category: business_fiscal
    check: |
      GLOBAL WRITE GATE. The patient reached from the target resource must not own any
      PaymentPlan whose plan_status is DELINQUENT or DEFAULTED. When one exists the call
      is refused before any schema, enum, OCC or state check runs.
      GATED FAMILY (every endpoint below is frozen while the gate is up):
        POST /prosthetics/cases, POST /prosthetics/case-arches,
        POST /prosthetics/case-arches/{case_arch_id}/start-fabrication,
        POST /prosthetics/impressions, POST /prosthetics/impressions/{impression_id}/request-retake,
        POST /prosthetics/try-ins, POST /prosthetics/lab-cases,
        POST /prosthetics/lab-cases/{lab_case_id}/dispatch,
        POST /prosthetics/lab-cases/{lab_case_id}/resend,
        POST /prosthetics/prostheses, POST /prosthetics/remake-requests,
        POST /prosthetics/services when is_emergency_repair is false.
      OUTSIDE THE GATE (each with the reason it is excluded):
        - every GET endpoint -- reading is never frozen; the patient and the front office must be able to see why the account is gated and what is owed.
        - POST /prosthetics/patients, POST /prosthetics/coverages -- registration and insurance enrolment precede any balance and cannot be the thing a balance blocks.
        - POST /prosthetics/labs -- laboratory configuration is clinic-wide, not patient-scoped, so no patient gate can apply to it.
        - POST /prosthetics/payment-plans -- establishing (or replacing) a plan is the remedy for the gate; gating it would make the gate permanent.
        - POST /prosthetics/installments/{installment_id}/pay -- paying is the cure; gating the cure makes the gate unrecoverable.
        - POST /prosthetics/installments/{installment_id}/reverse-payment -- the front office must be able to undo a mis-posted payment even on a gated account.
        - POST /prosthetics/payment-plans/{payment_plan_id}/assess-delinquency -- the sweep is what raises and lowers the gate; it cannot be subject to it.
        - POST /prosthetics/services when is_emergency_repair is true and service_type is REPAIR -- a patient whose denture has fractured cannot eat; emergency repair is a clinical-safety carve-out.
        - POST /prosthetics/services/{service_id}/complete and /void -- finishing or undoing work already started is not a new fabrication start, and the appliance must come back to the patient.
        - POST /prosthetics/lab-cases/{lab_case_id}/receive and /qc -- work already at the laboratory must be received and inspected regardless of the balance; only NEW dispatches are frozen.
        - POST /prosthetics/impressions/{impression_id}/review and POST /prosthetics/try-ins/{try_in_id}/decide -- judging an appointment that already happened is not a new start.
        - POST /prosthetics/prostheses/{prosthesis_id}/recall-complete -- recall is a safety follow-up on an appliance the patient already has.
        - POST /prosthetics/warranty-claims and /adjudicate and /clinical-review -- fault adjudication decides who owes the money; letting the clinic's own receivable block it would let the clinic profit from its own delay.
        - POST /prosthetics/predeterminations and /determine, POST /prosthetics/claims and /submit and /post-payment and /reverse -- insurance work reduces the balance and is part of the remedy path.
        - POST /prosthetics/remake-requests/{remake_request_id}/approve and /deny -- the request creation was already gated; deciding an existing request is not a new start.
        - POST /prosthetics/cases/{case_id}/complete-exam and /cancel -- closing out or cancelling an existing case reduces exposure rather than adding to it.
        - POST /prosthetics/_clock/set_current_utc -- test-driving infrastructure, outside the business surface entirely.
    error_id: ERR_ACCOUNT_DELINQUENT
    http_status: 403
    applies_to: "the GATED FAMILY enumerated above"

  - priority: 6
    category: business_referential
    check: "Every foreign key supplied in the request body names an existing row of the declared parent entity (patient_id, case_id, case_arch_id, dental_lab_id, prosthesis_id, coverage_id, warranty_claim_id, post_delivery_service_id, attributed_lab_case_id, superseded_prosthesis_id, payment_plan_id)."
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "every POST that accepts a foreign key in its body"

  - priority: 7
    category: business_constraint
    check: "Request schema: every required input field of the endpoint is present, types match, numeric fields are inside their declared ranges (quality_score 0..100, unit_count 1..32, bench_line 1..DentalLab.bench_line_count, installment_count 2..12, down_payment_amount >= PAYMENT_PLAN_MIN_DOWN_RATE times the PRE-discount ProsthesisCase.patient_responsibility_amount observed before the prompt-pay discount of calculation case_total_due step 8 is applied, amount_paid > 0), pagination limit is 1..100 and offset is >= 0, and the (case_id, arch_position) pair of a new CaseArch and the (patient_id, rank) pair of a new Coverage are not already taken."
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all"

  - priority: 8
    category: business_constraint
    check: |
      EXHAUSTIVE ENUM ROUTING. A value outside the declared member set of any of the
      following fields routes to ERR_INVALID_ENUM, and only these fields do:
        ProsthesisCase.prosthesis_type          (POST /prosthetics/cases)
        CaseArch.arch_position                  (POST /prosthetics/case-arches)
        ImpressionRecord.capture_method         (POST /prosthetics/impressions, POST /prosthetics/impressions/{impression_id}/request-retake)
        TryInMilestone.milestone_kind           (POST /prosthetics/try-ins)
        decision                                (POST /prosthetics/try-ins/{try_in_id}/decide)
        LabCase.turnaround_class                (POST /prosthetics/lab-cases)
        LabCase.purpose                         (POST /prosthetics/lab-cases)
        qc_result                               (POST /prosthetics/lab-cases/{lab_case_id}/qc)
        recall_outcome                          (POST /prosthetics/prostheses/{prosthesis_id}/recall-complete)
        PostDeliveryService.service_type        (POST /prosthetics/services)
        fault_verdict                           (POST /prosthetics/warranty-claims/{warranty_claim_id}/adjudicate)
        resolved_verdict                        (POST /prosthetics/warranty-claims/{warranty_claim_id}/clinical-review)
        RemakeRequest.reason_code               (POST /prosthetics/remake-requests)
        Coverage.rank                           (POST /prosthetics/coverages)
        Coverage.cob_convention                 (POST /prosthetics/coverages)
        determination                           (POST /prosthetics/predeterminations/{predetermination_id}/determine)
        adjudication_outcome                    (POST /prosthetics/claims/{claim_id}/post-payment)
        PaymentPlan.frequency                   (POST /prosthetics/payment-plans)
      No other field routes to this error; all other enum-membership failures route to
      ERR_VALIDATION.
    error_id: ERR_INVALID_ENUM
    http_status: 422
    applies_to: "the eighteen fields enumerated above"

  - priority: 9
    category: business_constraint
    check: "Optimistic concurrency. The expected_<parent>_version supplied on an OCC-guarded create equals the current version of the named parent row: expected_case_arch_version against CaseArch.version on POST /prosthetics/lab-cases, expected_prosthesis_version against Prosthesis.version on POST /prosthetics/services, expected_prosthesis_case_version against ProsthesisCase.version on POST /prosthetics/payment-plans."
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /prosthetics/lab-cases, POST /prosthetics/services, POST /prosthetics/payment-plans"

  - priority: 10
    category: state
    check: "The target row is not already in a terminal state of the state axis the operation drives. Axis-scoped: an operation that drives Prosthesis.recall_status is gated by the recall terminal set only, and an operation that drives Prosthesis.warranty_status by the warranty terminal set only."
    error_id: ERR_TERMINAL_STATE
    http_status: 409
    applies_to: "every state-changing endpoint"
    note: "PRE-EMPTION OF MUTATE-THEN-REJECT RUNG 15: a second POST /prosthetics/lab-cases/{lab_case_id}/receive on a row that rung 15 already flipped to EXPIRED is caught here, because EXPIRED is a LabCase terminal state. The second attempt therefore returns ERR_TERMINAL_STATE, NOT ERR_LAB_CASE_EXPIRED, and performs no further write."

  - priority: 11
    category: business_constraint
    check: "The CaseArch a remake is requested for has remake_eligibility == ELIGIBLE."
    error_id: ERR_REMAKE_FINAL_DENIED
    http_status: 409
    applies_to: "POST /prosthetics/remake-requests"
    note: "PRE-EMPTION OF MUTATE-THEN-REJECT RUNG 22: once rung 22 has flipped CaseArch.remake_eligibility to FINAL_DENIED and persisted it, every later remake request on that arch stops here with ERR_REMAKE_FINAL_DENIED instead of reaching rung 22 again, and no second FINAL_DENIED RemakeRequest row is minted."

  - priority: 12
    category: state
    check: "The target row's current state is a declared from-state of the transition the endpoint drives, per section 1.2."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every state-changing endpoint"

  - priority: 13
    category: state
    check: |
      Cross-entity state preconditions, checked against a DIFFERENT row than the target:
        POST /prosthetics/case-arches/{case_arch_id}/start-fabrication -- parent ProsthesisCase.case_status must be EXAM_COMPLETE (from PLANNED) or IN_FABRICATION (from REMAKE_PENDING).
        POST /prosthetics/prostheses -- the named CaseArch.arch_status must be READY_FOR_DELIVERY.
        POST /prosthetics/services/{service_id}/complete on an AT_LAB row -- the linked LabCase.lab_status must be QC_PASSED.
        POST /prosthetics/remake-requests/{remake_request_id}/approve -- when warranty_claim_id is non-null the cited WarrantyClaim.claim_status must be CLINIC_FAULT or LAB_FAULT.
        POST /prosthetics/try-ins -- the parent CaseArch.arch_status must be MILESTONE_PENDING.
        POST /prosthetics/impressions -- the parent CaseArch.arch_status must be IMPRESSION_PENDING.
        POST /prosthetics/lab-cases -- the parent CaseArch.arch_status must be LAB_FABRICATION.
    error_id: ERR_CROSS_ENTITY_STATE
    http_status: 409
    applies_to: "the seven endpoints enumerated above"

  - priority: 14
    category: business_safety
    check: "Segregation of duties: the X-User-ID approving or denying a RemakeRequest differs from RemakeRequest.requested_by_user_id."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /prosthetics/remake-requests/{remake_request_id}/approve, POST /prosthetics/remake-requests/{remake_request_id}/deny"

  - priority: 15
    category: business_temporal
    check: "MUTATE-THEN-REJECT. On POST /prosthetics/lab-cases/{lab_case_id}/receive, when the logical clock is strictly after LabCase.shelf_life_expires_at, the row is FIRST set to lab_status EXPIRED with expired_at stamped, its bench-line and arch occupations released and LabCase.version incremented, that write is COMMITTED, and only THEN does the call raise."
    error_id: ERR_LAB_CASE_EXPIRED
    http_status: 409
    applies_to: "POST /prosthetics/lab-cases/{lab_case_id}/receive"
    note: "See rung 10 for the second-attempt pre-emption."

  - priority: 16
    category: business_constraint
    check: "Prosthesis-type milestone sequence. A try-in may only be created with milestone_kind equal to the parent CaseArch.next_required_milestone, and a decide call with decision APPROVE is only accepted on the row whose milestone_kind equals next_required_milestone. Creating a try-in on an arch whose required_milestones is the empty list (IMMEDIATE_DENTURE) always fails here."
    error_id: ERR_MILESTONE_SEQUENCE
    http_status: 422
    applies_to: "POST /prosthetics/try-ins, POST /prosthetics/try-ins/{try_in_id}/decide"

  - priority: 17
    category: business_constraint
    check: "Impression retake ceiling: the parent CaseArch.retake_count is strictly below IMPRESSION_RETAKE_CEILING (3)."
    error_id: ERR_RETAKE_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /prosthetics/impressions/{impression_id}/request-retake"

  - priority: 18
    category: business_constraint
    check: "Try-in adjust ceiling: TryInMilestone.adjust_count is strictly below TRYIN_ADJUST_CEILING (2) when decision is ADJUST."
    error_id: ERR_TRYIN_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /prosthetics/try-ins/{try_in_id}/decide"

  - priority: 19
    category: business_constraint
    check: "Lab QC resend ceiling: LabCase.resend_count is strictly below LAB_QC_RESEND_CEILING (2)."
    error_id: ERR_QC_RESEND_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /prosthetics/lab-cases/{lab_case_id}/resend"

  - priority: 20
    category: business_temporal
    check: "CaseArch possession overlap, CLOSED interval with a buffer. The arch must hold no other LabCase whose lab_status is in {DISPATCHED, RETURNED, QC_FAILED, RESENT}, and when CaseArch.last_lab_received_at is non-null the logical clock must be STRICTLY AFTER last_lab_received_at plus ARCH_TURNAROUND_BUFFER_HOURS (24) hours. A dispatch at exactly last_lab_received_at + 24h is a conflict."
    error_id: ERR_ARCH_OCCUPIED
    http_status: 409
    applies_to: "POST /prosthetics/lab-cases/{lab_case_id}/dispatch"

  - priority: 21
    category: business_temporal
    check: "Laboratory bench-line overlap, HALF-OPEN interval with no buffer. The interval [logical clock, promised_due_at) of the case being dispatched must not intersect the same interval of any other LabCase sharing the (dental_lab_id, bench_line) pair whose lab_status is in {DISPATCHED, RETURNED, QC_FAILED, RESENT}. Touching intervals are allowed: a dispatch at exactly another case's promised_due_at passes."
    error_id: ERR_LAB_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /prosthetics/lab-cases/{lab_case_id}/dispatch"

  - priority: 22
    category: business_constraint
    check: "MUTATE-THEN-REJECT. On POST /prosthetics/remake-requests, when the target CaseArch.remake_request_count is already at or above REMAKE_CEILING_PER_ARCH (2), the RemakeRequest row is FIRST created and moved to FINAL_DENIED with decided_at stamped, CaseArch.remake_eligibility is FIRST flipped to FINAL_DENIED and CaseArch.version incremented, that write is COMMITTED, and only THEN does the call raise."
    error_id: ERR_REMAKE_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /prosthetics/remake-requests"
    note: "See rung 11 for the second-attempt pre-emption."

  - priority: 23
    category: business_referential
    check: "The Prosthesis a warranty claim is adjudicated against has warranty_status NOT in {WARRANTY_CONSUMED, WARRANTY_VOIDED}. A prosthesis whose warranty is already consumed or voided cannot fund a second no-charge remedy. WARRANTY_EXPIRED deliberately PASSES this rung so that rung 24 stays reachable."
    error_id: ERR_WARRANTY_CONSUMED
    http_status: 409
    applies_to: "POST /prosthetics/warranty-claims/{warranty_claim_id}/adjudicate, POST /prosthetics/warranty-claims/{warranty_claim_id}/clinical-review"

  - priority: 24
    category: business_temporal
    check: "The logical clock is at or before Prosthesis.warranty_expires_at when the verdict is CLINIC_FAULT or LAB_FAULT. This rung is deliberately NOT applied when the verdict is PATIENT_FAULT or INDETERMINATE, because a chargeable verdict does not depend on the warranty window."
    error_id: ERR_WARRANTY_EXPIRED
    http_status: 422
    applies_to: "POST /prosthetics/warranty-claims/{warranty_claim_id}/adjudicate, POST /prosthetics/warranty-claims/{warranty_claim_id}/clinical-review"

  - priority: 25
    category: business_constraint
    check: "Service-type eligibility for the prosthesis type: a service_type in PARTIAL_ONLY_SERVICE_TYPES (CLASP_ADDITION) is only accepted when Prosthesis.prosthesis_type is in PARTIAL_PROSTHESIS_TYPES (CAST_PARTIAL, FLEXIBLE_PARTIAL); service_type REBASE is refused when Prosthesis.prosthesis_type is in REBASE_INELIGIBLE_PROSTHESIS_TYPES (FLEXIBLE_PARTIAL)."
    error_id: ERR_SERVICE_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /prosthetics/services"

  - priority: 26
    category: business_temporal
    check: "Per-service-type frequency limit per calculation service_frequency_eligibility: when FREQ_<service_type>_MONTHS is non-zero, the logical clock must be at or after the completed_at of the most recent COMPLETED service of that same type on the same prosthesis plus that many months."
    error_id: ERR_SERVICE_FREQUENCY_LIMIT
    http_status: 422
    applies_to: "POST /prosthetics/services"

  - priority: 27
    category: business_referential
    check: "Coordination-of-benefits rank uniqueness: a patient may hold at most one Coverage with rank PRIMARY and at most one with rank SECONDARY."
    error_id: ERR_COB_RANK_CONFLICT
    http_status: 409
    applies_to: "POST /prosthetics/coverages"

  - priority: 28
    category: business_temporal
    check: "Major-service waiting period: the logical clock is at or after the target Coverage.effective_date plus Coverage.waiting_period_days days. The check runs against the PRIMARY coverage on the DRAFT to SUBMITTED_PRIMARY leg and against the SECONDARY coverage on the PRIMARY_PAID to SUBMITTED_SECONDARY leg."
    error_id: ERR_WAITING_PERIOD
    http_status: 422
    applies_to: "POST /prosthetics/claims/{claim_id}/submit"

  - priority: 29
    category: business_temporal
    check: "Replacement-frequency limitation: let PRIOR be the set of Prosthesis rows whose case_arch_id belongs to a ProsthesisCase of this patient OTHER than this claim's case_id. When PRIOR is non-empty, the logical clock must be at or after max(replacement_eligible_date) over PRIOR. A remake never advances frequency_anchor_at, so a remade appliance does not buy a new replacement window."
    error_id: ERR_FREQUENCY_LIMIT
    http_status: 422
    applies_to: "POST /prosthetics/claims/{claim_id}/submit"

  - priority: 30
    category: business_constraint
    check: "Predetermination gate: when the target case's predetermination_required is true, a Predetermination for the case must exist with determination_status in {APPROVED, ALTERNATE_BENEFIT} and expires_at strictly after the logical clock. A DENIED, SUBMITTED or EXPIRED determination, or none at all, fails here."
    error_id: ERR_PREDETERMINATION_REQUIRED
    http_status: 422
    applies_to: "POST /prosthetics/case-arches/{case_arch_id}/start-fabrication, POST /prosthetics/claims/{claim_id}/submit"

  - priority: 31
    category: business_fiscal
    check: "Annual maximum: the Coverage the current submission targets has benefit_remaining strictly greater than 0.00."
    error_id: ERR_ANNUAL_MAX_EXHAUSTED
    http_status: 422
    applies_to: "POST /prosthetics/claims/{claim_id}/submit"

# =============================================================================
# 1.5 API Endpoint Table -- 72 endpoints
# =============================================================================
endpoints:

  # ---- logical clock (test-driving) ---------------------------------------
  - method: POST
    path: "/prosthetics/_clock/set_current_utc"
    description: "Sets the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-05-01T00:00:00Z and NEVER falls back to real wall-clock time. Every window, ceiling, expiry and due-date rule in this scaffold is evaluated against this clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects:
      - "re-evaluates every clock-derived system transition on read: Prosthesis warranty and recall bands, Predetermination expiry"

  # ---- Patient -------------------------------------------------------------
  - method: POST
    path: "/prosthetics/patients"
    description: "Registers a patient."
    roles: [FrontOffice, PlatformAdmin]
    code: 201
    input: [full_name, date_of_birth, phone]
    output: Patient
    side_effects: ["initialises write_gate_active false, delivered_prosthesis_count 0 and last_frequency_anchor_at null"]

  - method: GET
    path: "/prosthetics/patients/{patient_id}"
    description: "Reads one patient. A Patient role may only read its own row (rung 3)."
    roles: [FrontOffice, Prosthodontist, ClinicalDirector, PlatformAdmin, Patient]
    code: 200
    input: []
    output: Patient
    side_effects: []

  - method: GET
    path: "/prosthetics/patients"
    description: "Lists patients."
    roles: [FrontOffice, Prosthodontist, ClinicalDirector, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Patient[]
    side_effects: []

  # ---- Coverage ------------------------------------------------------------
  - method: POST
    path: "/prosthetics/coverages"
    description: "Enrols a patient in an insurance coverage at a given COB rank."
    roles: [FrontOffice, PlatformAdmin]
    code: 201
    input: ["patient_id", "carrier_name", "rank", "effective_date", "annual_maximum_amount?", "coinsurance_major_rate?", "waiting_period_days?", "replacement_frequency_months?", "cob_convention?", "alternate_benefit_enabled?"]
    output: Coverage
    side_effects:
      - "sets benefit_used_ytd 0.00 and benefit_remaining equal to annual_maximum_amount, establishing invariant coverage_benefit_conservation"

  - method: GET
    path: "/prosthetics/coverages/{coverage_id}"
    description: "Reads one coverage."
    roles: [FrontOffice, PlatformAdmin, Prosthodontist]
    code: 200
    input: []
    output: Coverage
    side_effects: []

  - method: GET
    path: "/prosthetics/coverages"
    description: "Lists coverages, optionally filtered by patient and rank. Reverse-reachability channel for Coverage.patient_id."
    roles: [FrontOffice, PlatformAdmin, Prosthodontist]
    code: 200
    input: ["patient_id?", "rank?", "limit?", "offset?"]
    output: Coverage[]
    side_effects: []

  # ---- DentalLab -----------------------------------------------------------
  - method: POST
    path: "/prosthetics/labs"
    description: "Registers an external dental laboratory. The returned id is what a LabTechnician sends as X-User-ID."
    roles: [PlatformAdmin]
    code: 201
    input: ["lab_name", "bench_line_count?", "standard_turnaround_days?", "rush_turnaround_days?"]
    output: DentalLab
    side_effects: ["initialises credit_issued_total, credit_applied_total and credit_available_balance to 0.00"]

  - method: GET
    path: "/prosthetics/labs/{lab_id}"
    description: "Reads one laboratory, including its credit ledger fields."
    roles: [PlatformAdmin, FrontOffice, Prosthodontist, LabTechnician]
    code: 200
    input: []
    output: DentalLab
    side_effects: []

  - method: GET
    path: "/prosthetics/labs"
    description: "Lists laboratories."
    roles: [PlatformAdmin, FrontOffice, Prosthodontist]
    code: 200
    input: ["limit?", "offset?"]
    output: DentalLab[]
    side_effects: []

  # ---- ProsthesisCase ------------------------------------------------------
  - method: POST
    path: "/prosthetics/cases"
    description: "Opens a prosthesis case for a patient at a chosen prosthesis type. Inside the global write gate."
    roles: [Prosthodontist, FrontOffice]
    code: 201
    input: [patient_id, prosthesis_type]
    output: ProsthesisCase
    side_effects: ["creates the case in INTAKE with fee_schedule_total 0.00 and predetermination_required false"]

  - method: GET
    path: "/prosthetics/cases/{case_id}"
    description: "Reads one case, including its computed money fields from calculation case_total_due."
    roles: [Prosthodontist, FrontOffice, ClinicalDirector, PlatformAdmin, Patient]
    code: 200
    input: []
    output: ProsthesisCase
    side_effects: []

  - method: GET
    path: "/prosthetics/cases"
    description: "Lists cases. Reverse-reachability channel for ProsthesisCase.patient_id."
    roles: [Prosthodontist, FrontOffice, ClinicalDirector, PlatformAdmin]
    code: 200
    input: ["patient_id?", "case_status?", "limit?", "offset?"]
    output: ProsthesisCase[]
    side_effects: []

  - method: POST
    path: "/prosthetics/cases/{case_id}/complete-exam"
    description: "Closes the exam stage: prices every arch, totals the case and decides whether a predetermination is required."
    roles: [Prosthodontist]
    code: 200
    input: []
    output: ProsthesisCase
    side_effects:
      - "runs calculation arch_fee_schedule_amount over every non-abandoned CaseArch"
      - "moves case_status INTAKE -> EXAM_COMPLETE"
      - "increments ProsthesisCase.version by 1"

  - method: POST
    path: "/prosthetics/cases/{case_id}/cancel"
    description: "Cancels a case and cascades the cancellation to its arches, try-ins and open lab cases."
    roles: [Prosthodontist]
    code: 200
    input: ["cancellation_reason?"]
    output: ProsthesisCase
    side_effects:
      - "moves case_status to CANCELLED and every non-terminal CaseArch to ARCH_ABANDONED"
      - "cancels those arches' open LabCase and undecided TryInMilestone rows"
      - "increments ProsthesisCase.version by 1"

  # ---- CaseArch ------------------------------------------------------------
  - method: POST
    path: "/prosthetics/case-arches"
    description: "Adds an arch unit to a case. At most one row per (case_id, arch_position). Inside the global write gate."
    roles: [Prosthodontist]
    code: 201
    input: [case_id, arch_position]
    output: CaseArch
    side_effects:
      - "creates the arch in PLANNED and computes required_milestones from MILESTONES_<case prosthesis_type>"

  - method: GET
    path: "/prosthetics/case-arches/{case_arch_id}"
    description: "Reads one arch, including required_milestones, completed_milestones and next_required_milestone."
    roles: [Prosthodontist, FrontOffice, ClinicalDirector, PlatformAdmin]
    code: 200
    input: []
    output: CaseArch
    side_effects: []

  - method: GET
    path: "/prosthetics/case-arches"
    description: "Lists arches. Reverse-reachability channel for CaseArch.case_id."
    roles: [Prosthodontist, FrontOffice, ClinicalDirector, PlatformAdmin]
    code: 200
    input: ["case_id?", "arch_status?", "limit?", "offset?"]
    output: CaseArch[]
    side_effects: []

  - method: POST
    path: "/prosthetics/case-arches/{case_arch_id}/start-fabrication"
    description: "Starts (or restarts, after a remake) fabrication on one arch. Inside the global write gate; also enforces the predetermination gate."
    roles: [Prosthodontist]
    code: 200
    input: []
    output: CaseArch
    side_effects:
      - "moves arch_status PLANNED -> IMPRESSION_PENDING or REMAKE_PENDING -> IMPRESSION_PENDING"
      - "resets retake_count to 0"
      - "bubbles the parent ProsthesisCase EXAM_COMPLETE -> IN_FABRICATION"
      - "increments CaseArch.version by 1"

  # ---- ImpressionRecord ----------------------------------------------------
  - method: POST
    path: "/prosthetics/impressions"
    description: "Records an impression or digital scan on an arch. Inside the global write gate."
    roles: [Prosthodontist]
    code: 201
    input: [case_arch_id, capture_method]
    output: ImpressionRecord
    side_effects: ["creates the record in PENDING_REVIEW with attempt_number equal to CaseArch.retake_count plus 1"]

  - method: GET
    path: "/prosthetics/impressions/{impression_id}"
    description: "Reads one impression record."
    roles: [Prosthodontist, FrontOffice, ClinicalDirector, PlatformAdmin]
    code: 200
    input: []
    output: ImpressionRecord
    side_effects: []

  - method: GET
    path: "/prosthetics/impressions"
    description: "Lists impression records. Reverse-reachability channel for ImpressionRecord.case_arch_id and for the self-referential superseded_by_impression_id."
    roles: [Prosthodontist, FrontOffice, ClinicalDirector, PlatformAdmin]
    code: 200
    input: ["case_arch_id?", "quality_status?", "superseded_by_impression_id?", "limit?", "offset?"]
    output: ImpressionRecord[]
    side_effects: []

  - method: POST
    path: "/prosthetics/impressions/{impression_id}/review"
    description: "Scores an impression and applies calculation impression_quality_band, producing one of the three bands. Outside the global write gate: the appointment already happened."
    roles: [Prosthodontist]
    code: 200
    input: [quality_score]
    output: ImpressionRecord
    side_effects:
      - "sets quality_status to ACCEPTED, PROVISIONAL_ACCEPTED or REJECTED per calculation impression_quality_band"
      - "on ACCEPTED, advances the parent CaseArch to MILESTONE_PENDING or, for IMMEDIATE_DENTURE, straight to LAB_FABRICATION"
      - "increments ImpressionRecord.version by 1"

  - method: POST
    path: "/prosthetics/impressions/{impression_id}/request-retake"
    description: "Supersedes a provisionally-accepted or rejected record and mints its successor. Inside the global write gate. The response is the SUPERSEDED row, whose superseded_by_impression_id names the new record."
    roles: [Prosthodontist]
    code: 200
    input: [capture_method]
    output: ImpressionRecord
    side_effects:
      - "increments the parent CaseArch.retake_count by 1"
      - "creates the successor ImpressionRecord in PENDING_REVIEW"
      - "sets this row's quality_status to SUPERSEDED and superseded_by_impression_id to the successor id"
      - "increments ImpressionRecord.version by 1"

  # ---- TryInMilestone ------------------------------------------------------
  - method: POST
    path: "/prosthetics/try-ins"
    description: "Books the next required try-in milestone on an arch. Inside the global write gate; enforces the prosthesis-type milestone sequence."
    roles: [Prosthodontist]
    code: 201
    input: [case_arch_id, milestone_kind]
    output: TryInMilestone
    side_effects: ["creates the milestone in PENDING_APPROVAL with adjust_count 0"]

  - method: GET
    path: "/prosthetics/try-ins/{try_in_id}"
    description: "Reads one try-in milestone."
    roles: [Prosthodontist, FrontOffice, ClinicalDirector, PlatformAdmin]
    code: 200
    input: []
    output: TryInMilestone
    side_effects: []

  - method: GET
    path: "/prosthetics/try-ins"
    description: "Lists try-in milestones. Reverse-reachability channel for TryInMilestone.case_arch_id."
    roles: [Prosthodontist, FrontOffice, ClinicalDirector, PlatformAdmin]
    code: 200
    input: ["case_arch_id?", "approval_status?", "limit?", "offset?"]
    output: TryInMilestone[]
    side_effects: []

  - method: POST
    path: "/prosthetics/try-ins/{try_in_id}/decide"
    description: "Three-way clinical decision on a try-in, plus the RESUBMIT leg that closes the adjust cycle. Outside the global write gate."
    roles: [Prosthodontist]
    code: 200
    input: [decision]
    output: TryInMilestone
    side_effects:
      - "APPROVE moves the row to APPROVED, appends milestone_kind to the arch's completed_milestones and advances the arch to LAB_FABRICATION when it was the last required milestone"
      - "ADJUST moves the row to ADJUST_REQUESTED and increments adjust_count"
      - "RESUBMIT moves ADJUST_REQUESTED back to PENDING_APPROVAL without resetting adjust_count"
      - "REJECT moves the row to REJECTED_FOR_REMAKE and auto-creates a RemakeRequest in PENDING_APPROVAL with reason_code TRYIN_REJECTED"
      - "increments TryInMilestone.version by 1"

  # ---- LabCase -------------------------------------------------------------
  - method: POST
    path: "/prosthetics/lab-cases"
    description: "Creates a DRAFT lab case for an arch. OCC-guarded on CaseArch.version; a newer DRAFT supersedes an older DRAFT on the same arch. Inside the global write gate."
    roles: [Prosthodontist, FrontOffice]
    code: 201
    input: ["case_arch_id", "dental_lab_id", "bench_line", "turnaround_class", "unit_count", "purpose", "expected_case_arch_version", "lab_invoice_amount?"]
    output: LabCase
    side_effects:
      - "cancels any existing DRAFT LabCase on the same case_arch_id"
      - "increments CaseArch.version by 1"

  - method: GET
    path: "/prosthetics/lab-cases/{lab_case_id}"
    description: "Reads one lab case."
    roles: [Prosthodontist, FrontOffice, ClinicalDirector, PlatformAdmin, LabTechnician]
    code: 200
    input: []
    output: LabCase
    side_effects: []

  - method: GET
    path: "/prosthetics/lab-cases"
    description: "Lists lab cases. Reverse-reachability channel for LabCase.case_arch_id and LabCase.dental_lab_id."
    roles: [Prosthodontist, FrontOffice, ClinicalDirector, PlatformAdmin, LabTechnician]
    code: 200
    input: ["case_arch_id?", "dental_lab_id?", "lab_status?", "limit?", "offset?"]
    output: LabCase[]
    side_effects: []

  - method: POST
    path: "/prosthetics/lab-cases/{lab_case_id}/dispatch"
    description: "Sends the case to the laboratory. Inside the global write gate; enforces both overlap rungs (20 arch possession, 21 bench line)."
    roles: [FrontOffice, Prosthodontist]
    code: 200
    input: []
    output: LabCase
    side_effects:
      - "stamps dispatched_at, computes promised_due_at per calculation lab_promised_due_at and shelf_life_expires_at"
      - "computes rush_fee_amount per calculation lab_rush_fee and recomputes the case money fields per calculation case_total_due"
      - "increments LabCase.version by 1"

  - method: POST
    path: "/prosthetics/lab-cases/{lab_case_id}/receive"
    description: "The laboratory returns the finished case to the clinic. Outside the global write gate. Rung 15 mutate-then-reject lives here."
    roles: [LabTechnician]
    code: 200
    input: []
    output: LabCase
    side_effects:
      - "stamps received_at and sets the parent CaseArch.last_lab_received_at"
      - "past shelf_life_expires_at instead flips lab_status to EXPIRED, persists, and then raises ERR_LAB_CASE_EXPIRED"
      - "increments LabCase.version by 1"

  - method: POST
    path: "/prosthetics/lab-cases/{lab_case_id}/qc"
    description: "Clinic QC inspection on a returned case. Outside the global write gate."
    roles: [Prosthodontist]
    code: 200
    input: [qc_result]
    output: LabCase
    side_effects:
      - "PASS advances the parent CaseArch LAB_FABRICATION -> READY_FOR_DELIVERY for FABRICATION and REMAKE purposes"
      - "FAIL leaves the arch in LAB_FABRICATION and opens the resend leg"
      - "increments LabCase.version by 1"

  - method: POST
    path: "/prosthetics/lab-cases/{lab_case_id}/resend"
    description: "Sends a QC-failed case back to the laboratory. Inside the global write gate; ceiling LAB_QC_RESEND_CEILING."
    roles: [FrontOffice, Prosthodontist]
    code: 200
    input: []
    output: LabCase
    side_effects:
      - "increments resend_count, clears received_at and leaves shelf_life_expires_at unchanged"
      - "increments LabCase.version by 1"

  # ---- Prosthesis ----------------------------------------------------------
  - method: POST
    path: "/prosthetics/prostheses"
    description: "Delivers the finished appliance for one arch. Inside the global write gate. Runs calculation warranty_and_replacement_clocks and calculation recall_schedule; head of delivery_cascade."
    roles: [Prosthodontist]
    code: 201
    input: ["case_arch_id", "superseded_prosthesis_id?"]
    output: Prosthesis
    side_effects:
      - "delivery_cascade link 1: creates the Prosthesis with warranty_status IN_WARRANTY, recall_status RECALL_SCHEDULED, adjustments_used 0 and adjustments_remaining ADJUSTMENT_ALLOWANCE_COUNT"
      - "delivery_cascade link 2: moves the parent CaseArch READY_FOR_DELIVERY -> DELIVERED"
      - "delivery_cascade link 3: bubbles the parent ProsthesisCase IN_FABRICATION -> DELIVERED once every sibling arch is DELIVERED or ARCH_ABANDONED"
      - "delivery_cascade link 4: that case transition auto-creates a Claim in DRAFT against the patient's PRIMARY Coverage when exactly one exists"
      - "on a remake (superseded_prosthesis_id non-null) sets the superseded row's warranty_status to WARRANTY_VOIDED and recall_status to RECALL_CLOSED_SUPERSEDED"
      - "increments CaseArch.version and ProsthesisCase.version by 1 each"

  - method: GET
    path: "/prosthetics/prostheses/{prosthesis_id}"
    description: "Reads one prosthesis, including both parallel axes, both clocks and the adjustment allowance counters."
    roles: [Prosthodontist, FrontOffice, ClinicalDirector, PlatformAdmin, Patient]
    code: 200
    input: []
    output: Prosthesis
    side_effects: ["re-evaluates the clock-driven warranty and recall band transitions against the logical clock"]

  - method: GET
    path: "/prosthetics/prostheses"
    description: "Lists prostheses. Reverse-reachability channel for Prosthesis.case_arch_id and for the self-referential superseded_prosthesis_id."
    roles: [Prosthodontist, FrontOffice, ClinicalDirector, PlatformAdmin]
    code: 200
    input: ["case_arch_id?", "superseded_prosthesis_id?", "warranty_status?", "recall_status?", "limit?", "offset?"]
    output: Prosthesis[]
    side_effects: []

  - method: POST
    path: "/prosthetics/prostheses/{prosthesis_id}/recall-complete"
    description: "Closes a recall visit with one of three outcomes. Outside the global write gate: recall is a safety follow-up."
    roles: [Prosthodontist]
    code: 200
    input: [recall_outcome]
    output: Prosthesis
    side_effects:
      - "NO_ACTION advances recall_due_at by one further interval, increments recall_cycle_count and returns the row to RECALL_SCHEDULED"
      - "RELINE_INDICATED moves the row to RECALL_COMPLETED and auto-creates a PostDeliveryService of service_type HARD_RELINE_LAB in REQUESTED"
      - "REMAKE_EVALUATION moves the row to RECALL_COMPLETED and auto-creates a RemakeRequest in PENDING_APPROVAL with reason_code RECALL_EVALUATION"
      - "increments Prosthesis.version by 1"

  # ---- PostDeliveryService -------------------------------------------------
  - method: POST
    path: "/prosthetics/services"
    description: "Requests a post-delivery service. OCC-guarded on Prosthesis.version; a newer service of the same service_type supersedes an older un-completed one. Inside the global write gate UNLESS service_type is REPAIR and is_emergency_repair is true. dental_lab_id and bench_line are required when service_type is in LAB_SERVICE_TYPES and ignored otherwise."
    roles: [Prosthodontist, FrontOffice]
    code: 201
    input: ["prosthesis_id", "service_type", "expected_prosthesis_version", "is_emergency_repair?", "dental_lab_id?", "bench_line?"]
    output: PostDeliveryService
    side_effects:
      - "chairside types move straight to IN_CHAIR and leave Prosthesis.in_patient_possession true"
      - "laboratory types move to AT_LAB, auto-create a DRAFT LabCase on the parent arch, set lab_case_id and set Prosthesis.in_patient_possession false"
      - "voids any older un-completed service of the same service_type on the same prosthesis"
      - "increments Prosthesis.version by 1"

  - method: GET
    path: "/prosthetics/services/{service_id}"
    description: "Reads one post-delivery service."
    roles: [Prosthodontist, FrontOffice, ClinicalDirector, PlatformAdmin, Patient]
    code: 200
    input: []
    output: PostDeliveryService
    side_effects: []

  - method: GET
    path: "/prosthetics/services"
    description: "Lists post-delivery services. Reverse-reachability channel for PostDeliveryService.prosthesis_id and PostDeliveryService.lab_case_id."
    roles: [Prosthodontist, FrontOffice, ClinicalDirector, PlatformAdmin]
    code: 200
    input: ["prosthesis_id?", "lab_case_id?", "service_type?", "service_status?", "limit?", "offset?"]
    output: PostDeliveryService[]
    side_effects: []

  - method: POST
    path: "/prosthetics/services/{service_id}/complete"
    description: "Completes a service and prices it per calculation post_delivery_service_charge. Outside the global write gate."
    roles: [Prosthodontist]
    code: 200
    input: []
    output: PostDeliveryService
    side_effects:
      - "sets charge_basis and charge_amount"
      - "an INCLUDED adjustment consumes one unit of the allowance: adjustments_used up by 1, adjustments_remaining down by 1"
      - "a laboratory service restores Prosthesis.in_patient_possession to true"
      - "recomputes the case money fields per calculation case_total_due"
      - "increments PostDeliveryService.version by 1"

  - method: POST
    path: "/prosthetics/services/{service_id}/void"
    description: "Voids a service. On a COMPLETED row this is the declared compensating action of invariant adjustment_allowance_conservation. Outside the global write gate."
    roles: [FrontOffice, Prosthodontist]
    code: 200
    input: []
    output: PostDeliveryService
    side_effects:
      - "restores the adjustment allowance counters when the voided row was an INCLUDED adjustment"
      - "cancels the linked LabCase and restores Prosthesis.in_patient_possession when the row was AT_LAB"
      - "subtracts charge_amount from the case's billed_amount and recomputes case_total_due"
      - "increments PostDeliveryService.version by 1"

  # ---- WarrantyClaim -------------------------------------------------------
  - method: POST
    path: "/prosthetics/warranty-claims"
    description: "Opens a warranty claim against a delivered appliance. Outside the global write gate."
    roles: [Prosthodontist, FrontOffice]
    code: 201
    input: ["prosthesis_id", "reported_issue", "post_delivery_service_id?", "attributed_lab_case_id?"]
    output: WarrantyClaim
    side_effects: ["creates the claim in SUBMITTED with lab_credit_amount 0.00, patient_charge_amount 0.00 and warranty_consumed false"]

  - method: GET
    path: "/prosthetics/warranty-claims/{warranty_claim_id}"
    description: "Reads one warranty claim."
    roles: [Prosthodontist, FrontOffice, ClinicalDirector, PlatformAdmin, Patient]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []

  - method: GET
    path: "/prosthetics/warranty-claims"
    description: "Lists warranty claims. Reverse-reachability channel for WarrantyClaim.prosthesis_id, post_delivery_service_id and attributed_lab_case_id."
    roles: [Prosthodontist, FrontOffice, ClinicalDirector, PlatformAdmin]
    code: 200
    input: ["prosthesis_id?", "post_delivery_service_id?", "attributed_lab_case_id?", "claim_status?", "limit?", "offset?"]
    output: WarrantyClaim[]
    side_effects: []

  - method: POST
    path: "/prosthetics/warranty-claims/{warranty_claim_id}/adjudicate"
    description: "Four-way fault verdict. Outside the global write gate: fault adjudication decides who owes the money."
    roles: [ClinicalDirector]
    code: 200
    input: [fault_verdict]
    output: WarrantyClaim
    side_effects:
      - "CLINIC_FAULT and LAB_FAULT consume the warranty and charge the patient nothing; LAB_FAULT additionally issues a DentalLab credit per calculation lab_remake_credit"
      - "PATIENT_FAULT charges FEE_REPAIR and deliberately leaves the warranty unconsumed"
      - "INDETERMINATE routes the row to CLINICAL_REVIEW without any money effect"
      - "recomputes the case money fields per calculation case_total_due"
      - "increments WarrantyClaim.version by 1"

  - method: POST
    path: "/prosthetics/warranty-claims/{warranty_claim_id}/clinical-review"
    description: "Resolves an INDETERMINATE claim into one of the three real verdicts. Outside the global write gate."
    roles: [ClinicalDirector]
    code: 200
    input: [resolved_verdict]
    output: WarrantyClaim
    side_effects:
      - "applies exactly the side-effect set of the corresponding adjudicate leg"
      - "increments WarrantyClaim.version by 1"

  # ---- RemakeRequest -------------------------------------------------------
  - method: POST
    path: "/prosthetics/remake-requests"
    description: "Requests a remake of one arch. Inside the global write gate. Rung 22 mutate-then-reject lives here; rung 11 pre-empts it on every later attempt."
    roles: [Prosthodontist]
    code: 201
    input: ["case_arch_id", "reason_code", "warranty_claim_id?"]
    output: RemakeRequest
    side_effects:
      - "stamps requested_by_user_id from X-User-ID and attempt_number from CaseArch.remake_request_count plus 1, then increments CaseArch.remake_request_count by 1"
      - "sets charge_basis NO_CHARGE when the cited WarrantyClaim is CLINIC_FAULT or LAB_FAULT, CHARGEABLE otherwise"
      - "past the ceiling instead creates the row, flips it and CaseArch.remake_eligibility to FINAL_DENIED, persists, and then raises ERR_REMAKE_LIMIT_EXCEEDED"

  - method: GET
    path: "/prosthetics/remake-requests/{remake_request_id}"
    description: "Reads one remake request."
    roles: [Prosthodontist, FrontOffice, ClinicalDirector, PlatformAdmin]
    code: 200
    input: []
    output: RemakeRequest
    side_effects: []

  - method: GET
    path: "/prosthetics/remake-requests"
    description: "Lists remake requests. Reverse-reachability channel for RemakeRequest.case_arch_id and warranty_claim_id, and the only discovery channel for a FINAL_DENIED row minted by rung 22."
    roles: [Prosthodontist, FrontOffice, ClinicalDirector, PlatformAdmin]
    code: 200
    input: ["case_arch_id?", "warranty_claim_id?", "authorization_status?", "limit?", "offset?"]
    output: RemakeRequest[]
    side_effects: []

  - method: POST
    path: "/prosthetics/remake-requests/{remake_request_id}/approve"
    description: "Authorises a remake under segregation of duties. Outside the global write gate: the creation was already gated. Head of remake_cascade (six links)."
    roles: [ClinicalDirector]
    code: 200
    input: []
    output: RemakeRequest
    side_effects:
      - "remake_cascade links 1 through 6 as spelled out on the RemakeRequest PENDING_APPROVAL -> APPROVED transition"
      - "increments RemakeRequest.version, CaseArch.version and ProsthesisCase.version"

  - method: POST
    path: "/prosthetics/remake-requests/{remake_request_id}/deny"
    description: "Denies a remake under segregation of duties. Outside the global write gate."
    roles: [ClinicalDirector]
    code: 200
    input: ["denial_reason?"]
    output: RemakeRequest
    side_effects:
      - "moves the row to DENIED and leaves the arch untouched"
      - "increments RemakeRequest.version by 1"

  # ---- Predetermination ----------------------------------------------------
  - method: POST
    path: "/prosthetics/predeterminations"
    description: "Submits a preauthorization request for a case to one coverage. Outside the global write gate: insurance work is part of the remedy path."
    roles: [FrontOffice]
    code: 201
    input: [case_id, coverage_id]
    output: Predetermination
    side_effects: ["creates the row in SUBMITTED with requested_amount equal to ProsthesisCase.fee_schedule_total"]

  - method: GET
    path: "/prosthetics/predeterminations/{predetermination_id}"
    description: "Reads one predetermination."
    roles: [FrontOffice, Prosthodontist, PlatformAdmin]
    code: 200
    input: []
    output: Predetermination
    side_effects: ["re-evaluates the APPROVED/ALTERNATE_BENEFIT to EXPIRED transition against the logical clock"]

  - method: GET
    path: "/prosthetics/predeterminations"
    description: "Lists predeterminations. Reverse-reachability channel for Predetermination.case_id and coverage_id."
    roles: [FrontOffice, Prosthodontist, PlatformAdmin]
    code: 200
    input: ["case_id?", "coverage_id?", "determination_status?", "limit?", "offset?"]
    output: Predetermination[]
    side_effects: []

  - method: POST
    path: "/prosthetics/predeterminations/{predetermination_id}/determine"
    description: "Records the carrier's three-way answer and runs calculation predetermination_plan_payment. Outside the global write gate."
    roles: [FrontOffice]
    code: 200
    input: [determination]
    output: Predetermination
    side_effects:
      - "APPROVED uses the STANDARD_BENEFIT variant; ALTERNATE_BENEFIT uses the ALTERNATE_BENEFIT_DOWNGRADE variant and sets alternate_benefit_type; DENIED zeroes the estimates"
      - "stamps determined_at and computes expires_at as determined_at plus PREDETERMINATION_VALIDITY_DAYS days"
      - "increments Predetermination.version by 1"

  # ---- Claim ---------------------------------------------------------------
  - method: POST
    path: "/prosthetics/claims"
    description: "Opens a claim for a case against its PRIMARY coverage. Outside the global write gate."
    roles: [FrontOffice]
    code: 201
    input: [case_id, coverage_id]
    output: Claim
    side_effects: ["creates the claim in DRAFT with submission_target PRIMARY and all money fields at 0.00"]

  - method: GET
    path: "/prosthetics/claims/{claim_id}"
    description: "Reads one claim."
    roles: [FrontOffice, Prosthodontist, PlatformAdmin, Patient]
    code: 200
    input: []
    output: Claim
    side_effects: []

  - method: GET
    path: "/prosthetics/claims"
    description: "Lists claims. Reverse-reachability channel for Claim.case_id, coverage_id and predetermination_id."
    roles: [FrontOffice, Prosthodontist, PlatformAdmin]
    code: 200
    input: ["case_id?", "coverage_id?", "predetermination_id?", "adjudication_status?", "limit?", "offset?"]
    output: Claim[]
    side_effects: []

  - method: POST
    path: "/prosthetics/claims/{claim_id}/submit"
    description: "Submits the claim to the coverage its current stage targets. Runs rungs 28, 29, 30 and 31. Outside the global write gate."
    roles: [FrontOffice]
    code: 200
    input: []
    output: Claim
    side_effects:
      - "DRAFT -> SUBMITTED_PRIMARY sets billed_amount, resolves predetermination_id and allowed_amount, and stamps submitted_at"
      - "PRIMARY_PAID -> SUBMITTED_SECONDARY sets submission_target SECONDARY and copies the SECONDARY Coverage.cob_convention into cob_convention_applied"
      - "increments Claim.version by 1"

  - method: POST
    path: "/prosthetics/claims/{claim_id}/post-payment"
    description: "Records the carrier's adjudication for the current stage. Runs calculation claim_primary_payment or calculation claim_secondary_cob_payment. Outside the global write gate."
    roles: [FrontOffice]
    code: 200
    input: [adjudication_outcome]
    output: Claim
    side_effects:
      - "moves benefit from the targeted Coverage: benefit_used_ytd up, benefit_remaining down by the paid amount"
      - "recomputes ProsthesisCase.insurance_paid_amount and patient_responsibility_amount per calculation case_total_due"
      - "auto-closes the claim when no SECONDARY coverage exists, or after the SECONDARY leg pays"
      - "increments Claim.version by 1"

  - method: POST
    path: "/prosthetics/claims/{claim_id}/reverse"
    description: "Reverses a closed claim. Declared compensating action of invariant coverage_benefit_conservation. Outside the global write gate."
    roles: [FrontOffice]
    code: 200
    input: ["reversal_reason?"]
    output: Claim
    side_effects:
      - "returns benefit_used_ytd and benefit_remaining on both coverages to their pre-adjudication values"
      - "zeroes primary_paid_amount, secondary_paid_amount and plan_paid_amount and recomputes case_total_due"
      - "increments Claim.version by 1"

  # ---- PaymentPlan ---------------------------------------------------------
  - method: POST
    path: "/prosthetics/payment-plans"
    description: "Creates an installment plan for a case's patient responsibility. OCC-guarded on ProsthesisCase.version; supersedes the case's current ACTIVE or DELINQUENT plan. Outside the global write gate: establishing a plan is the remedy."
    roles: [FrontOffice]
    code: 201
    input: ["patient_id", "case_id", "installment_count", "down_payment_amount", "first_due_date", "frequency", "expected_prosthesis_case_version", "pay_in_full?"]
    output: PaymentPlan
    side_effects:
      - "the rung 7 down-payment floor is checked against the PRE-discount patient_responsibility_amount; only after that check passes is the prompt-pay discount tier applied to the case when pay_in_full is true, per calculation case_total_due steps 7 and 8"
      - "mints installment_count Installment rows per calculation installment_schedule, with the rounding residual on the final row"
      - "supersedes the case's prior ACTIVE or DELINQUENT plan and waives that plan's open installments"
      - "increments ProsthesisCase.version by 1"

  - method: GET
    path: "/prosthetics/payment-plans/{payment_plan_id}"
    description: "Reads one payment plan. A Patient role may only read its own plan (rung 3)."
    roles: [FrontOffice, PlatformAdmin, Patient]
    code: 200
    input: []
    output: PaymentPlan
    side_effects: []

  - method: GET
    path: "/prosthetics/payment-plans"
    description: "Lists payment plans. Reverse-reachability channel for PaymentPlan.patient_id, case_id and the self-referential superseded_by_plan_id."
    roles: [FrontOffice, PlatformAdmin, Prosthodontist]
    code: 200
    input: ["patient_id?", "case_id?", "superseded_by_plan_id?", "plan_status?", "limit?", "offset?"]
    output: PaymentPlan[]
    side_effects: []

  - method: POST
    path: "/prosthetics/payment-plans/{payment_plan_id}/assess-delinquency"
    description: "Sweeps the plan's SCHEDULED installments past their grace boundary and re-derives plan_status. This is the endpoint that raises the global write gate, so it necessarily sits outside it."
    roles: [PlatformAdmin, FrontOffice]
    code: 200
    input: []
    output: PaymentPlan
    side_effects:
      - "runs calculation payment_plan_delinquency"
      - "sets Patient.write_gate_active when the resulting plan_status is DELINQUENT or DEFAULTED"
      - "increments PaymentPlan.version by 1"

  # ---- Installment ---------------------------------------------------------
  - method: GET
    path: "/prosthetics/installments/{installment_id}"
    description: "Reads one installment. A Patient role may only read its own (rung 3)."
    roles: [FrontOffice, PlatformAdmin, Patient]
    code: 200
    input: []
    output: Installment
    side_effects: []

  - method: GET
    path: "/prosthetics/installments"
    description: "Lists installments. Reverse-reachability channel for Installment.payment_plan_id and the only discovery channel for cascade-minted installment rows."
    roles: [FrontOffice, PlatformAdmin, Patient]
    code: 200
    input: ["payment_plan_id?", "installment_status?", "limit?", "offset?"]
    output: Installment[]
    side_effects: []

  - method: POST
    path: "/prosthetics/installments/{installment_id}/pay"
    description: "Pays one installment. Outside the global write gate: paying is the cure. A Patient role may only pay its own (rung 3)."
    roles: [Patient, FrontOffice]
    code: 200
    input: [amount_paid]
    output: Installment
    side_effects:
      - "moves the row SCHEDULED -> PAID or MISSED -> PAID and stamps paid_at"
      - "moves PaymentPlan.paid_amount up and outstanding_amount down by Installment.amount"
      - "cures a DELINQUENT or DEFAULTED plan back to ACTIVE when missed_count reaches 0, lowering the write gate"
      - "moves the plan to PAID_OFF when outstanding_amount reaches 0.00"
      - "increments Installment.version by 1"

  - method: POST
    path: "/prosthetics/installments/{installment_id}/reverse-payment"
    description: "Reverses a posted installment payment. Declared compensating action of invariant payment_plan_conservation. Outside the global write gate."
    roles: [FrontOffice]
    code: 200
    input: []
    output: Installment
    side_effects:
      - "returns the row to SCHEDULED when the logical clock is at or before due_date plus the grace days, otherwise to MISSED"
      - "moves PaymentPlan.paid_amount down and outstanding_amount up by Installment.amount"
      - "increments Installment.version by 1"

# =============================================================================
# 1.6 Error Code Catalog -- 36 codes
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role is absent, names no declared role, or X-User-ID is absent or empty (rung 1)."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The calling role is not in the endpoint's roles list (rung 2)."
  - id: ERR_NOT_OWNER
    http: 403
    condition: "A Patient role acts on a row it does not own, or a LabTechnician acts on a LabCase whose dental_lab_id differs from X-User-ID (rung 3)."
  - id: ERR_PATIENT_NOT_FOUND
    http: 404
    condition: "The patient_id path segment names no Patient row (rung 4)."
  - id: ERR_CASE_NOT_FOUND
    http: 404
    condition: "The case_id path segment names no ProsthesisCase row (rung 4)."
  - id: ERR_ARCH_NOT_FOUND
    http: 404
    condition: "The case_arch_id path segment names no CaseArch row (rung 4)."
  - id: ERR_LAB_CASE_NOT_FOUND
    http: 404
    condition: "The lab_case_id path segment names no LabCase row (rung 4)."
  - id: ERR_PROSTHESIS_NOT_FOUND
    http: 404
    condition: "The prosthesis_id path segment names no Prosthesis row (rung 4)."
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "A path segment naming a Coverage, DentalLab, ImpressionRecord, TryInMilestone, PostDeliveryService, WarrantyClaim, RemakeRequest, Predetermination, Claim, PaymentPlan or Installment resolves to no row (rung 4)."
  - id: ERR_ACCOUNT_DELINQUENT
    http: 403
    condition: "GLOBAL WRITE GATE. The patient reached from the target resource owns a PaymentPlan whose plan_status is DELINQUENT or DEFAULTED and the endpoint is inside the gated family (rung 5)."
  - id: ERR_REFERENCE_NOT_FOUND
    http: 404
    condition: "A foreign key supplied in the request body names no row of its declared parent entity (rung 6)."
  - id: ERR_VALIDATION
    http: 400
    condition: "A required input field is missing, a type is wrong, a numeric field is outside its declared range, a pagination parameter is out of bounds, a uniqueness pair is already taken, or an enum-membership failure occurs on any field NOT listed on rung 8 (rung 7)."
  - id: ERR_INVALID_ENUM
    http: 422
    condition: "A value outside the declared member set of one of the eighteen fields exhaustively enumerated on rung 8."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "An expected_<parent>_version supplied on an OCC-guarded create does not equal the named parent row's current version (rung 9)."
  - id: ERR_TERMINAL_STATE
    http: 409
    condition: "The target row is already in a terminal state of the axis the operation drives; this is also what a second receive call on an EXPIRED LabCase returns (rung 10)."
  - id: ERR_REMAKE_FINAL_DENIED
    http: 409
    condition: "A remake is requested on a CaseArch whose remake_eligibility is already FINAL_DENIED; this pre-empts the rung 22 mutate-then-reject on every attempt after the first (rung 11)."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The target row's current state is not a declared from-state of the transition the endpoint drives (rung 12)."
  - id: ERR_CROSS_ENTITY_STATE
    http: 409
    condition: "A row OTHER than the target is not in the state this operation requires: the parent case is not EXAM_COMPLETE, the arch is not READY_FOR_DELIVERY, the linked lab case is not QC_PASSED, or the cited warranty claim is not CLINIC_FAULT or LAB_FAULT (rung 13)."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The X-User-ID deciding a RemakeRequest equals its requested_by_user_id (rung 14)."
  - id: ERR_LAB_CASE_EXPIRED
    http: 409
    condition: "MUTATE-THEN-REJECT. A lab case is received past shelf_life_expires_at; the row is flipped to EXPIRED and persisted first, then this error is raised (rung 15)."
  - id: ERR_MILESTONE_SEQUENCE
    http: 422
    condition: "A try-in is booked or approved out of the order the case's prosthesis_type requires, or booked at all on a type whose required_milestones list is empty (rung 16)."
  - id: ERR_RETAKE_LIMIT_EXCEEDED
    http: 409
    condition: "An impression retake is requested when CaseArch.retake_count already equals IMPRESSION_RETAKE_CEILING (3) (rung 17)."
  - id: ERR_TRYIN_LIMIT_EXCEEDED
    http: 409
    condition: "An ADJUST decision is taken when TryInMilestone.adjust_count already equals TRYIN_ADJUST_CEILING (2) (rung 18)."
  - id: ERR_QC_RESEND_LIMIT_EXCEEDED
    http: 409
    condition: "A resend is requested when LabCase.resend_count already equals LAB_QC_RESEND_CEILING (2) (rung 19)."
  - id: ERR_ARCH_OCCUPIED
    http: 409
    condition: "The arch already holds an open lab case, or the dispatch falls at or before CaseArch.last_lab_received_at plus ARCH_TURNAROUND_BUFFER_HOURS (24) hours (rung 20)."
  - id: ERR_LAB_SLOT_CONFLICT
    http: 409
    condition: "The half-open interval [dispatch instant, promised_due_at) intersects another open lab case on the same (dental_lab_id, bench_line) pair (rung 21)."
  - id: ERR_REMAKE_LIMIT_EXCEEDED
    http: 409
    condition: "MUTATE-THEN-REJECT. A remake is requested when CaseArch.remake_request_count already equals REMAKE_CEILING_PER_ARCH (2); the FINAL_DENIED RemakeRequest row and the arch's FINAL_DENIED eligibility flag are persisted first, then this error is raised (rung 22)."
  - id: ERR_WARRANTY_CONSUMED
    http: 409
    condition: "A warranty claim is adjudicated against a Prosthesis whose warranty_status is WARRANTY_CONSUMED or WARRANTY_VOIDED (rung 23). WARRANTY_EXPIRED is deliberately excluded here and handled by rung 24."
  - id: ERR_WARRANTY_EXPIRED
    http: 422
    condition: "A CLINIC_FAULT or LAB_FAULT verdict is recorded after Prosthesis.warranty_expires_at (rung 24)."
  - id: ERR_SERVICE_NOT_ELIGIBLE
    http: 422
    condition: "CLASP_ADDITION is requested on a prosthesis type that is not a partial, or REBASE is requested on a FLEXIBLE_PARTIAL (rung 25)."
  - id: ERR_SERVICE_FREQUENCY_LIMIT
    http: 422
    condition: "A service of a type with a non-zero FREQ_<type>_MONTHS is requested before that many months have elapsed since the most recent COMPLETED service of the same type on the same prosthesis (rung 26)."
  - id: ERR_COB_RANK_CONFLICT
    http: 409
    condition: "A patient is given a second Coverage at a rank it already holds (rung 27)."
  - id: ERR_WAITING_PERIOD
    http: 422
    condition: "A claim is submitted before the targeted Coverage.effective_date plus its waiting_period_days (rung 28)."
  - id: ERR_FREQUENCY_LIMIT
    http: 422
    condition: "A claim is submitted before the maximum replacement_eligible_date over the patient's prostheses that belong to a DIFFERENT case; a remake never advances that date (rung 29)."
  - id: ERR_PREDETERMINATION_REQUIRED
    http: 422
    condition: "Fabrication is started or a claim submitted on a case whose predetermination_required is true with no APPROVED or ALTERNATE_BENEFIT determination still inside its validity window (rung 30)."
  - id: ERR_ANNUAL_MAX_EXHAUSTED
    http: 422
    condition: "A claim is submitted against a Coverage whose benefit_remaining is 0.00 (rung 31)."

# =============================================================================
# 1.7 RBAC Matrix -- six roles, segregation-of-duties model
# =============================================================================
roles:
  - name: Prosthodontist
    description: "The treating clinician. Owns the clinical surface: exams, arches, impressions, try-in decisions, lab QC, delivery, post-delivery services, recall and remake REQUESTS."
    identity: "opaque"
    exclusive_operations:
      - "POST /prosthetics/case-arches"
      - "POST /prosthetics/case-arches/{case_arch_id}/start-fabrication"
      - "POST /prosthetics/cases/{case_id}/complete-exam"
      - "POST /prosthetics/cases/{case_id}/cancel"
      - "POST /prosthetics/impressions"
      - "POST /prosthetics/impressions/{impression_id}/review"
      - "POST /prosthetics/impressions/{impression_id}/request-retake"
      - "POST /prosthetics/try-ins"
      - "POST /prosthetics/try-ins/{try_in_id}/decide"
      - "POST /prosthetics/lab-cases/{lab_case_id}/qc"
      - "POST /prosthetics/prostheses"
      - "POST /prosthetics/prostheses/{prosthesis_id}/recall-complete"
      - "POST /prosthetics/services/{service_id}/complete"
      - "POST /prosthetics/remake-requests"
    shared_operations:
      - "POST /prosthetics/cases"
      - "POST /prosthetics/lab-cases"
      - "POST /prosthetics/lab-cases/{lab_case_id}/dispatch"
      - "POST /prosthetics/lab-cases/{lab_case_id}/resend"
      - "POST /prosthetics/services"
      - "POST /prosthetics/services/{service_id}/void"
      - "POST /prosthetics/warranty-claims"
      - "all GET endpoints except GET /prosthetics/payment-plans/{payment_plan_id} and GET /prosthetics/installments"

  - name: ClinicalDirector
    description: "The authorising clinician. The ONLY role that may adjudicate warranty fault or decide a remake, and never the role that requested it -- segregation of duties is enforced on X-User-ID, not on role."
    identity: "opaque"
    exclusive_operations:
      - "POST /prosthetics/warranty-claims/{warranty_claim_id}/adjudicate"
      - "POST /prosthetics/warranty-claims/{warranty_claim_id}/clinical-review"
      - "POST /prosthetics/remake-requests/{remake_request_id}/approve"
      - "POST /prosthetics/remake-requests/{remake_request_id}/deny"
    shared_operations:
      - "GET endpoints across cases, arches, impressions, try-ins, lab cases, prostheses, services, warranty claims and remake requests"

  - name: LabTechnician
    description: "The external laboratory acting as itself. X-User-ID is the DentalLab.id, so a lab can only handle lab cases dispatched to it."
    identity: "entity_backed:DentalLab"
    exclusive_operations:
      - "POST /prosthetics/lab-cases/{lab_case_id}/receive"
    shared_operations:
      - "GET /prosthetics/lab-cases/{lab_case_id}"
      - "GET /prosthetics/lab-cases"
      - "GET /prosthetics/labs/{lab_id}"

  - name: FrontOffice
    description: "Billing and insurance. Owns coverages, predeterminations, claims, payment plans, lab dispatch logistics and payment reversals."
    identity: "opaque"
    exclusive_operations:
      - "POST /prosthetics/coverages"
      - "POST /prosthetics/predeterminations"
      - "POST /prosthetics/predeterminations/{predetermination_id}/determine"
      - "POST /prosthetics/claims"
      - "POST /prosthetics/claims/{claim_id}/submit"
      - "POST /prosthetics/claims/{claim_id}/post-payment"
      - "POST /prosthetics/claims/{claim_id}/reverse"
      - "POST /prosthetics/payment-plans"
      - "POST /prosthetics/installments/{installment_id}/reverse-payment"
    shared_operations:
      - "POST /prosthetics/patients"
      - "POST /prosthetics/cases"
      - "POST /prosthetics/lab-cases"
      - "POST /prosthetics/lab-cases/{lab_case_id}/dispatch"
      - "POST /prosthetics/lab-cases/{lab_case_id}/resend"
      - "POST /prosthetics/services"
      - "POST /prosthetics/services/{service_id}/void"
      - "POST /prosthetics/warranty-claims"
      - "POST /prosthetics/payment-plans/{payment_plan_id}/assess-delinquency"
      - "POST /prosthetics/installments/{installment_id}/pay"
      - "all GET endpoints"

  - name: Patient
    description: "The patient acting on their own record. X-User-ID is the Patient.id; rung 3 refuses any row the patient does not own."
    identity: "entity_backed:Patient"
    exclusive_operations: []
    shared_operations:
      - "POST /prosthetics/installments/{installment_id}/pay"
      - "GET /prosthetics/patients/{patient_id}"
      - "GET /prosthetics/cases/{case_id}"
      - "GET /prosthetics/prostheses/{prosthesis_id}"
      - "GET /prosthetics/services/{service_id}"
      - "GET /prosthetics/warranty-claims/{warranty_claim_id}"
      - "GET /prosthetics/claims/{claim_id}"
      - "GET /prosthetics/payment-plans/{payment_plan_id}"
      - "GET /prosthetics/installments/{installment_id}"
      - "GET /prosthetics/installments"

  - name: PlatformAdmin
    description: "Operator role. Owns laboratory registration, the delinquency sweep and the logical clock. Never performs clinical work."
    identity: "opaque"
    exclusive_operations:
      - "POST /prosthetics/labs"
