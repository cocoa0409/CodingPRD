      - name: duplicate_bid_and_duplicate_invitation_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_DUPLICATE_BID]", "errors[ERR_DUPLICATE_INVITATION]"]
        distinguishing_aspect: "Aggregate uniqueness: second invitation for the same (package, sub) -> ERR_DUPLICATE_INVITATION; second live bid for the same (package, sub) -> ERR_DUPLICATE_BID; after withdrawal a fresh bid is accepted (non-terminal uniqueness)."
        test_recipe:
