  # ---------------------------------------------------------------------------
  # Rule 9: compensating_invariant — money ledger (cents) vs seat occupancy
  # (count), DIFFERENT conserved quantities
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: stipend_reserved_ledger_compensation
        grounds:
          - entities.RecruitingSeason.fields.stipend_reserved_cents
          - state_machines.StipendDisbursement.RESERVED_to_RELEASED
          - state_machines.RecruitingSeason.INTERN_ACTIVE_to_CLOSED
        distinguishing_aspect: |
          Conserved quantity is money (cents): the accept/reserve (+200000)
          paired with the season-close release (-200000) leaves
          stipend_reserved_cents net-unchanged at 0, and at every step
          stipend_reserved_cents == SUM(amount_cents of RESERVED
          disbursements); disbursed stays 0 because nothing was disbursed.
