        claim_type: side_effect_execution
        grounds: ["state_machines.Response.QUARANTINED_to_DISCARDED", "state_machines.IncentiveAward", "entities.IncentiveAward.fields.eligibility_status"]
        distinguishing_aspect: "Discarding a quarantined response flips its award eligibility PENDING -> INELIGIBLE; an INELIGIBLE award can never be authorized (ERR_AWARD_NOT_AUTHORIZED_STATE) and reserves no pool funds."
        test_recipe:
          setup: ["Cell target 5; P1 ACTIVE; locked instrument; wave FIELDING 2026-08-03; response QUARANTINED"]
          setup_api_calls:
            - { call: "POST /feedback-panel/panel-cells", payload: { age_band: "AGE_18_29", district: "D1", tenure_bucket: "RENTER", target_size: 5 }, as: PanelManager, captures: { c1_id: $.data.id } }
