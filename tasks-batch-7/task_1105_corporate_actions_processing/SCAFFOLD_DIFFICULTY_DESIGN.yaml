      - name: odd_lot_threshold_99_full_vs_100_prorated
        grounds:
          - calculations.merger_proration_allocation
          - state_machines.CorporateActionEvent.CONFIRMED_to_BOOKED
        distinguishing_aspect: |
          Share-count boundary (different metric than the timestamp boundary):
          a 99-share holder is odd-lot (< 100) and cashed out IN FULL (495000),
          while a 100-share holder is NOT odd-lot and is prorated at factor
          0.3681 to 36 cash shares (180000) — reachable via POST book.
