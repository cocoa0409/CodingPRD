scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: subscription_vs_per_file_pricing_divergence
        grounds:
          - calculations.file_fee_estimate
          - calculations.invoice_total
        distinguishing_aspect: |
          Two valid pricing variants on the SAME file economics (entity domain: TransactionFile/Invoice
          billing) produce different invoice totals: PER_FILE yields 39500 while SUBSCRIPTION with a free
          included slot yields 0 for identical contract data.
        test_recipe:
          setup:
            - "Coordinator C with buyer/seller agents and an ACTIVE TX PURCHASE_SALE template"
            - "C has an ACTIVE subscription (quota 1, overage 34900)"
            - "File A: PER_FILE, TX, effective 2026-08-03, closing 2026-08-31; File B: SUBSCRIPTION, closing 2026-09-02"
            - "Both files activated at the default clock 2026-08-01T00:00:00Z (no rush: 30 and 32 days out)"
          setup_api_calls:
            - call: "POST /tc/coordinators"
              payload: { full_name: "Casey Coord", email: "casey@tc.example", license_number: "TC-1001" }
              as: SystemAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /tc/agents"
              payload: { full_name: "Buyer Beth", email: "beth@ag.example", brokerage: "Berkshire" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { buyer_id: $.data.id }
            - call: "POST /tc/agents"
              payload: { full_name: "Seller Sam", email: "sam@ag.example", brokerage: "Berkshire" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { seller_id: $.data.id }
            - call: "POST /tc/checklist-templates"
              payload: { state_code: "TX", contract_type: "PURCHASE_SALE", milestone_defs: [{ name: "Earnest Money", offset_days: 3, mandatory: true }, { name: "Inspection Period", offset_days: 7, mandatory: true }, { name: "Financing Approval", offset_days: 21, mandatory: false }], required_doc_types: ["EXECUTED_CONTRACT", "TITLE_COMMITMENT"] }
              as: SystemAdmin
              captures: { tmpl_id: $.data.id }
            - call: "POST /tc/checklist-templates/${tmpl_id}/publish"
              payload: {}
              as: SystemAdmin
            - call: "POST /tc/subscriptions"
              payload: { monthly_fee_cents: 29900, included_files_quota: 1, overage_fee_cents: 34900 }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { sub_id: $.data.id, sub_v: $.data.version }
            - call: "POST /tc/files"
              payload: { billing_model: "PER_FILE", state_code: "TX", contract_type: "PURCHASE_SALE", property_address: "1 Main St", effective_date: "2026-08-03", closing_date: "2026-08-31", list_price_cents: 45000000, seller_agent_id: "${seller_id}", buyer_agent_id: "${buyer_id}", inspection_offset_days: 7, appraisal_offset_days: 14, financing_offset_days: 21 }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { file_a: $.data.id }
            - call: "POST /tc/files"
              payload: { billing_model: "SUBSCRIPTION", subscription_id: "${sub_id}", expected_subscription_version: "${sub_v}", state_code: "TX", contract_type: "PURCHASE_SALE", property_address: "2 Oak Ave", effective_date: "2026-08-03", closing_date: "2026-09-02", list_price_cents: 45000000, seller_agent_id: "${seller_id}", buyer_agent_id: "${buyer_id}", inspection_offset_days: 7, appraisal_offset_days: 14, financing_offset_days: 21 }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { file_b: $.data.id }
            - call: "POST /tc/files/${file_a}/activate"
              payload: {}
              as: Coordinator
              as_user_id: "${coord_id}"
            - call: "POST /tc/files/${file_b}/activate"
              payload: {}
              as: Coordinator
              as_user_id: "${coord_id}"
          trigger:
            - call: "GET /tc/invoices"
              payload: { file_id: "${file_a}" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { inv_a_total: "$.data[0].total_cents" }
            - call: "GET /tc/invoices"
              payload: { file_id: "${file_b}" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { inv_b_total: "$.data[0].total_cents" }
          assert:
            - "Invoice for ${file_a}: subtotal_cents == 39500 AND discount_cents == 0 AND total_cents == 39500"
            - "Invoice for ${file_b}: subtotal_cents == 0 AND total_cents == 0 (SUBSCRIPTION_INCLUDED line)"
            - "TransactionFile.${file_a}.fee_estimate_cents == 39500"
            - "TransactionFile.${file_b}.fee_estimate_cents == 0"
            - "39500 != 0 — identical contract data prices differently under the two variants"

      - name: deadline_calendar_vs_business_day_convention
        grounds:
          - calculations.deadline_due_date
        distinguishing_aspect: |
          Dual-variant day-count on the Deadline entity domain (different domain from instance 1's billing):
          identical (effective_date 2026-08-03, offset 7) yields due_date 2026-08-10 under TX CALENDAR
          convention but 2026-08-12 under NY BUSINESS convention.
        test_recipe:
          setup:
            - "Coordinator with buyer/seller agents; ACTIVE templates for TX PURCHASE_SALE and NY PURCHASE_SALE"
            - "File TX and file NY, both PER_FILE, effective 2026-08-03, inspection_offset_days 7, closings >= 2 days apart"
            - "Both activated at default clock 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /tc/coordinators"
              payload: { full_name: "Casey Coord", email: "casey@tc.example", license_number: "TC-1001" }
              as: SystemAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /tc/agents"
              payload: { full_name: "Buyer Beth", email: "beth@ag.example", brokerage: "Berkshire" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { buyer_id: $.data.id }
            - call: "POST /tc/agents"
              payload: { full_name: "Seller Sam", email: "sam@ag.example", brokerage: "Berkshire" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { seller_id: $.data.id }
            - call: "POST /tc/checklist-templates"
              payload: { state_code: "TX", contract_type: "PURCHASE_SALE", milestone_defs: [{ name: "Earnest Money", offset_days: 3, mandatory: true }], required_doc_types: ["EXECUTED_CONTRACT"] }
              as: SystemAdmin
              captures: { tmpl_tx: $.data.id }
            - call: "POST /tc/checklist-templates/${tmpl_tx}/publish"
              payload: {}
              as: SystemAdmin
            - call: "POST /tc/checklist-templates"
              payload: { state_code: "NY", contract_type: "PURCHASE_SALE", milestone_defs: [{ name: "Earnest Money", offset_days: 3, mandatory: true }], required_doc_types: ["EXECUTED_CONTRACT"] }
              as: SystemAdmin
              captures: { tmpl_ny: $.data.id }
            - call: "POST /tc/checklist-templates/${tmpl_ny}/publish"
              payload: {}
              as: SystemAdmin
            - call: "POST /tc/files"
              payload: { billing_model: "PER_FILE", state_code: "TX", contract_type: "PURCHASE_SALE", property_address: "1 Main St", effective_date: "2026-08-03", closing_date: "2026-08-31", list_price_cents: 45000000, seller_agent_id: "${seller_id}", buyer_agent_id: "${buyer_id}", inspection_offset_days: 7, appraisal_offset_days: 14, financing_offset_days: 21 }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { file_tx: $.data.id }
            - call: "POST /tc/files"
              payload: { billing_model: "PER_FILE", state_code: "NY", contract_type: "PURCHASE_SALE", property_address: "9 Pine Rd", effective_date: "2026-08-03", closing_date: "2026-09-02", list_price_cents: 38000000, seller_agent_id: "${seller_id}", buyer_agent_id: "${buyer_id}", inspection_offset_days: 7, appraisal_offset_days: 14, financing_offset_days: 21 }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { file_ny: $.data.id }
            - call: "POST /tc/files/${file_tx}/activate"
              payload: {}
              as: Coordinator
              as_user_id: "${coord_id}"
            - call: "POST /tc/files/${file_ny}/activate"
              payload: {}
              as: Coordinator
              as_user_id: "${coord_id}"
          trigger:
            - call: "GET /tc/deadlines"
              payload: { file_id: "${file_tx}", kind: "INSPECTION" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { tx_due: "$.data[0].due_date", tx_conv: "$.data[0].day_convention" }
            - call: "GET /tc/deadlines"
              payload: { file_id: "${file_ny}", kind: "INSPECTION" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { ny_due: "$.data[0].due_date", ny_conv: "$.data[0].day_convention" }
          assert:
            - "TX inspection deadline: due_date == 2026-08-10 AND day_convention == CALENDAR"
            - "NY inspection deadline: due_date == 2026-08-12 AND day_convention == BUSINESS (Aug 4,5,6,7,10,11,12 = 7 business days; weekends skipped)"
            - "2026-08-10 != 2026-08-12 — identical inputs diverge by convention"

  - rule_id: combinatorial_formula
    instances:
      - name: per_file_fee_base_rush_conditional_formula
        grounds:
          - calculations.file_fee_estimate
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with conditional branches — contract_type selects the base tier, the
          closing-minus-activation day difference gates the rush surcharge (< 10 strictly), and billing_model
          selects the pricing branch; here PER_FILE PURCHASE_SALE with a 7-day horizon yields 39500 + 7500.
        test_recipe:
          setup:
            - "Coordinator with agents and ACTIVE TX PURCHASE_SALE template"
            - "File PER_FILE closing 2026-08-08, i.e. 7 days after the default clock date 2026-08-01 (< 10 -> rush)"
          setup_api_calls:
            - call: "POST /tc/coordinators"
              payload: { full_name: "Casey Coord", email: "casey@tc.example", license_number: "TC-1001" }
              as: SystemAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /tc/agents"
              payload: { full_name: "Buyer Beth", email: "beth@ag.example", brokerage: "Berkshire" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { buyer_id: $.data.id }
            - call: "POST /tc/agents"
              payload: { full_name: "Seller Sam", email: "sam@ag.example", brokerage: "Berkshire" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { seller_id: $.data.id }
            - call: "POST /tc/checklist-templates"
              payload: { state_code: "TX", contract_type: "PURCHASE_SALE", milestone_defs: [{ name: "Earnest Money", offset_days: 3, mandatory: true }], required_doc_types: ["EXECUTED_CONTRACT"] }
              as: SystemAdmin
              captures: { tmpl_id: $.data.id }
            - call: "POST /tc/checklist-templates/${tmpl_id}/publish"
              payload: {}
              as: SystemAdmin
            - call: "POST /tc/files"
              payload: { billing_model: "PER_FILE", state_code: "TX", contract_type: "PURCHASE_SALE", property_address: "1 Main St", effective_date: "2026-08-03", closing_date: "2026-08-08", list_price_cents: 45000000, seller_agent_id: "${seller_id}", buyer_agent_id: "${buyer_id}", inspection_offset_days: 7, appraisal_offset_days: 14, financing_offset_days: 21 }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { file_id: $.data.id }
            - call: "POST /tc/files/${file_id}/activate"
              payload: {}
              as: Coordinator
              as_user_id: "${coord_id}"
          trigger:
            - call: "GET /tc/invoices"
              payload: { file_id: "${file_id}" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { inv_total: "$.data[0].total_cents" }
          assert:
            - "TransactionFile.${file_id}.fee_estimate_cents == 47000"
            - "Invoice: subtotal_cents == 47000 (BASE_FEE 39500 + RUSH_SURCHARGE 7500), discount_cents == 0 (PER_FILE), total_cents == 47000"

      - name: subscription_overage_invoice_discount_rounding_order
        grounds:
          - calculations.invoice_total
        distinguishing_aspect: |
          Mode (b): nested rounding order — per-component integer cents first, then sum to subtotal, then a
          single round_half_up(subtotal * 0.05) discount on the summed subtotal (never per line). With lines
          33335 + 7500 the pinned order yields discount 2042 and total 38793.
        test_recipe:
          setup:
            - "Coordinator with agents and ACTIVE TX PURCHASE_SALE template"
            - "Subscription with included_files_quota 0 (every file commits as overage) and overage_fee_cents 33335"
            - "File SUBSCRIPTION closing 2026-08-08 (7 days after default clock -> rush 7500)"
          setup_api_calls:
            - call: "POST /tc/coordinators"
              payload: { full_name: "Casey Coord", email: "casey@tc.example", license_number: "TC-1001" }
              as: SystemAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /tc/agents"
              payload: { full_name: "Buyer Beth", email: "beth@ag.example", brokerage: "Berkshire" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { buyer_id: $.data.id }
            - call: "POST /tc/agents"
              payload: { full_name: "Seller Sam", email: "sam@ag.example", brokerage: "Berkshire" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { seller_id: $.data.id }
            - call: "POST /tc/checklist-templates"
              payload: { state_code: "TX", contract_type: "PURCHASE_SALE", milestone_defs: [{ name: "Earnest Money", offset_days: 3, mandatory: true }], required_doc_types: ["EXECUTED_CONTRACT"] }
              as: SystemAdmin
              captures: { tmpl_id: $.data.id }
            - call: "POST /tc/checklist-templates/${tmpl_id}/publish"
              payload: {}
              as: SystemAdmin
            - call: "POST /tc/subscriptions"
              payload: { monthly_fee_cents: 29900, included_files_quota: 0, overage_fee_cents: 33335 }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { sub_id: $.data.id, sub_v: $.data.version }
            - call: "POST /tc/files"
              payload: { billing_model: "SUBSCRIPTION", subscription_id: "${sub_id}", expected_subscription_version: "${sub_v}", state_code: "TX", contract_type: "PURCHASE_SALE", property_address: "1 Main St", effective_date: "2026-08-03", closing_date: "2026-08-08", list_price_cents: 45000000, seller_agent_id: "${seller_id}", buyer_agent_id: "${buyer_id}", inspection_offset_days: 7, appraisal_offset_days: 14, financing_offset_days: 21 }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { file_id: $.data.id }
            - call: "POST /tc/files/${file_id}/activate"
              payload: {}
              as: Coordinator
              as_user_id: "${coord_id}"
          trigger:
            - call: "GET /tc/invoices"
              payload: { file_id: "${file_id}" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { inv_total: "$.data[0].total_cents", inv_discount: "$.data[0].discount_cents", inv_subtotal: "$.data[0].subtotal_cents" }
          assert:
            - "Invoice.subtotal_cents == 40835 (SUBSCRIPTION_OVERAGE 33335 + RUSH_SURCHARGE 7500)"
            - "Invoice.discount_cents == 2042 (round_half_up(40835 * 0.05) = round_half_up(2041.75))"
            - "Invoice.total_cents == 38793"
            - "TransactionFile.${file_id}.fee_estimate_cents == 40835"

  - rule_id: non_linear_state_machine
    instances:
      - name: amendment_reject_revise_reroute_cycle
        grounds:
          - state_machines.Amendment.ROUTED_to_REJECTED
          - state_machines.Amendment.REJECTED_to_DRAFT
          - state_machines.Amendment.DRAFT_to_ROUTED
        distinguishing_aspect: |
          Cyclic machine on Amendment: DRAFT → ROUTED → REJECTED → (revise) DRAFT round 2 → ROUTED again,
          with each round minting fresh SignatureRequests; a linear pipeline cannot express the loop.
        test_recipe:
          setup:
            - "ACTIVE TX PURCHASE_SALE file with buyer and seller agents"
            - "Amendment created (window 2026-08-10 to 2026-08-15) and routed for round 1"
          setup_api_calls:
            - call: "POST /tc/coordinators"
              payload: { full_name: "Casey Coord", email: "casey@tc.example", license_number: "TC-1001" }
              as: SystemAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /tc/agents"
              payload: { full_name: "Buyer Beth", email: "beth@ag.example", brokerage: "Berkshire" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { buyer_id: $.data.id }
            - call: "POST /tc/agents"
              payload: { full_name: "Seller Sam", email: "sam@ag.example", brokerage: "Berkshire" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { seller_id: $.data.id }
            - call: "POST /tc/checklist-templates"
              payload: { state_code: "TX", contract_type: "PURCHASE_SALE", milestone_defs: [{ name: "Earnest Money", offset_days: 3, mandatory: true }], required_doc_types: ["EXECUTED_CONTRACT"] }
              as: SystemAdmin
              captures: { tmpl_id: $.data.id }
            - call: "POST /tc/checklist-templates/${tmpl_id}/publish"
              payload: {}
              as: SystemAdmin
            - call: "POST /tc/files"
              payload: { billing_model: "PER_FILE", state_code: "TX", contract_type: "PURCHASE_SALE", property_address: "1 Main St", effective_date: "2026-08-03", closing_date: "2026-08-31", list_price_cents: 45000000, seller_agent_id: "${seller_id}", buyer_agent_id: "${buyer_id}", inspection_offset_days: 7, appraisal_offset_days: 14, financing_offset_days: 21 }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { file_id: $.data.id }
            - call: "POST /tc/files/${file_id}/activate"
              payload: {}
              as: Coordinator
              as_user_id: "${coord_id}"
            - call: "GET /tc/files/${file_id}"
              payload: {}
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { file_v: $.data.version }
            - call: "POST /tc/amendments"
              payload: { file_id: "${file_id}", expected_file_version: "${file_v}", effective_from: "2026-08-10", effective_to: "2026-08-15", new_closing_date: "2026-09-04" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { am_id: $.data.id }
            - call: "POST /tc/amendments/${am_id}/route"
              payload: {}
              as: Coordinator
              as_user_id: "${coord_id}"
            - call: "GET /tc/signature-requests"
              payload: { amendment_id: "${am_id}", agent_id: "${buyer_id}" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { sig_buyer: "$.data[0].id" }
            - call: "GET /tc/signature-requests"
              payload: { amendment_id: "${am_id}", agent_id: "${seller_id}" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { sig_seller: "$.data[0].id" }
          trigger:
            - call: "POST /tc/signature-requests/${sig_buyer}/decline"
              payload: { reason: "buyer rejects new closing date" }
              as: Agent
              as_user_id: "${buyer_id}"
            - call: "POST /tc/amendments/${am_id}/revise"
              payload: {}
              as: Coordinator
              as_user_id: "${coord_id}"
            - call: "POST /tc/amendments/${am_id}/route"
              payload: {}
              as: Coordinator
              as_user_id: "${coord_id}"
          assert:
            - "After decline: Amendment.${am_id}.status == REJECTED and SignatureRequest.${sig_seller}.status == VOIDED"
            - "After revise: Amendment.${am_id}.status == DRAFT and round_number == 2"
            - "After re-route: Amendment.${am_id}.status == ROUTED and exactly 2 SignatureRequests exist with amendment_id == ${am_id} AND round_number == 2 AND status == PENDING"

      - name: document_reject_resubmit_review_round_cycle
        grounds:
          - state_machines.Document.REJECTED_to_RECEIVED
          - state_machines.Document.RECEIVED_to_REJECTED
        distinguishing_aspect: |
          Cyclic machine on Document (different entity from the amendment cycle): RECEIVED → REJECTED →
          RECEIVED via resubmission, with review_round incrementing on every loop iteration.
        test_recipe:
          setup:
            - "ACTIVE TX PURCHASE_SALE file; one REQUESTED EXECUTED_CONTRACT document"
          setup_api_calls:
            - call: "POST /tc/coordinators"
              payload: { full_name: "Casey Coord", email: "casey@tc.example", license_number: "TC-1001" }
              as: SystemAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /tc/agents"
              payload: { full_name: "Buyer Beth", email: "beth@ag.example", brokerage: "Berkshire" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { buyer_id: $.data.id }
            - call: "POST /tc/agents"
              payload: { full_name: "Seller Sam", email: "sam@ag.example", brokerage: "Berkshire" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { seller_id: $.data.id }
            - call: "POST /tc/checklist-templates"
              payload: { state_code: "TX", contract_type: "PURCHASE_SALE", milestone_defs: [{ name: "Earnest Money", offset_days: 3, mandatory: true }], required_doc_types: ["EXECUTED_CONTRACT"] }
              as: SystemAdmin
              captures: { tmpl_id: $.data.id }
            - call: "POST /tc/checklist-templates/${tmpl_id}/publish"
              payload: {}
              as: SystemAdmin
            - call: "POST /tc/files"
              payload: { billing_model: "PER_FILE", state_code: "TX", contract_type: "PURCHASE_SALE", property_address: "1 Main St", effective_date: "2026-08-03", closing_date: "2026-08-31", list_price_cents: 45000000, seller_agent_id: "${seller_id}", buyer_agent_id: "${buyer_id}", inspection_offset_days: 7, appraisal_offset_days: 14, financing_offset_days: 21 }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { file_id: $.data.id }
            - call: "POST /tc/files/${file_id}/activate"
              payload: {}
              as: Coordinator
              as_user_id: "${coord_id}"
            - call: "POST /tc/documents"
              payload: { file_id: "${file_id}", doc_type: "EXECUTED_CONTRACT" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { doc_id: $.data.id }
          trigger:
            - call: "POST /tc/documents/${doc_id}/submit"
              payload: {}
              as: Agent
              as_user_id: "${buyer_id}"
            - call: "POST /tc/documents/${doc_id}/reject"
              payload: { reason: "illegible scan" }
              as: Coordinator
              as_user_id: "${coord_id}"
            - call: "POST /tc/documents/${doc_id}/submit"
              payload: {}
              as: Agent
              as_user_id: "${buyer_id}"
            - call: "POST /tc/documents/${doc_id}/accept"
              payload: {}
              as: Coordinator
              as_user_id: "${coord_id}"
          assert:
            - "Document.${doc_id}.status == ACCEPTED"
            - "Document.${doc_id}.review_round == 2 (incremented exactly once by the REJECTED → RECEIVED loop)"
            - "Document.${doc_id}.reject_reason == 'illegible scan' (retained from the rejection)"

  - rule_id: transitive_cascade
    instances:
      - name: amendment_apply_recomputes_file_deadline_reminder_chain
        grounds:
          - state_machines.Amendment.FULLY_SIGNED_to_EFFECTIVE
          - calculations.deadline_due_date
          - calculations.reminder_schedule
        distinguishing_aspect: |
          Depth-3 chain: amendment EFFECTIVE mutates TransactionFile.effective_date (link 1); the file date
          change recomputes PENDING Deadline.due_date (link 2); each recomputed deadline regenerates its
          QUEUED Reminders (link 3). Each link is caused by the previous link, not by the apply action itself.
        test_recipe:
          setup:
