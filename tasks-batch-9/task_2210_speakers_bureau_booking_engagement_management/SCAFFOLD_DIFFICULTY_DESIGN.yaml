  - rule_id: resource_temporal_overlap
    instances:

      - name: temporal_travel_buffer_blocks_a_non_overlapping_adjacent_event
        grounds:
          - validations[priority=15]
          - entities.SpeakerHold.fields.hold_start_utc
          - entities.SpeakerHold.fields.hold_end_utc
          - entities.Speaker.fields.travel_buffer_days
          - state_machines.Engagement.OFFERED_to_CONFIRMED
        distinguishing_aspect: |
          The conflict test runs on the BUFFERED closed interval, not the raw event window, so
          two engagements whose events do not overlap at all (2026-10-15 and 2026-10-17) still
          collide once each is widened by travel_buffer_days = 1, while a third event one day
          further out (2026-10-18) is admitted. Overlap detection must be inclusive at both
          ends: the collision is exactly the shared calendar date 2026-10-16.
        test_recipe:
          setup:
            - "Speaker Dana has travel_buffer_days 1"
            - "Engagement A is CONFIRMED for 2026-10-15T16:00:00Z..18:00:00Z, minting an ACTIVE hold over [2026-10-14T16:00:00Z, 2026-10-16T18:00:00Z] with day_span 3"
            - "Engagement B is OFFERED for 2026-10-17T16:00:00Z..18:00:00Z and engagement C is OFFERED for 2026-10-18T16:00:00Z..18:00:00Z, both for the same speaker"
