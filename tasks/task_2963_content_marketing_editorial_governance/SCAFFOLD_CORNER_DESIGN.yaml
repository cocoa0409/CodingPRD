        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / assign_sme_expert_unavailable_outranks_weekly_capacity_exceeded
          rationale: "The named §1.8 instance triggers this code as the winning error of the priority-28-versus-priority-40 pair."

      - name: error_expert_capacity_exceeded_is_triggered_by_the_difficulty_design
        claim_type: Error triggerable
        grounds:
