        claim_type: immediate_visibility
        grounds:
          - complexity_profile.consistency_model
        distinguishing_aspect: "Immediate consistency: the approve response itself carries ACTIVE, and a subsequent GET reflects the same state with an incremented version — no read-repair delay."
        test_recipe:
          setup: ["handler h APPLICANT"]
          setup_api_calls:
            - { call: "POST /v1/handlers", payload: { full_name: "H IM", email: "him@x.com", region_code: "WA", volunteer_since: "2024-08-01" }, as: Anonymous, captures: { h: $.data.id } }
          trigger:
            - { call: "POST /v1/handlers/${h}/approve", payload: {}, as: ProgramAdmin, captures: { st1: $.data.status, v1: $.data.version } }
            - { call: "GET /v1/handlers/${h}", payload: {}, as: ProgramAdmin, captures: { st2: $.data.status, v2: $.data.version } }
          assert:
            - "st1 == ACTIVE (mutation visible in the same response)"
            - "st2 == ACTIVE AND v2 == v1 == 2 (create v1, approve v2; no hidden drift between write and read)"
