            - call: "POST /recall-campaigns"
              payload: { campaign_code: "RC-A", affected_bus_model_id: "${model_c_id}", affected_propulsion_type: "DIESEL", defect_category: "BRAKE", build_window_start: "2026-01-01", build_window_end: "2026-07-31", kits_per_unit: 1, total_kits: 2 }
              as: ComplianceOfficer
