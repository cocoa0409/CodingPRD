        distinguishing_aspect: "The referral leg runs first and the notice leg joins back onto it, and only then is adjudication legal; a DISMISSED outcome leaves penalty_status NONE with penalty_cents 0 so the entire ledger stays at zero even though the case reached a terminal adjudication."
