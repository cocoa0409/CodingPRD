        excluded_because:
          difficulty_instance: "combinatorial_formula / max_feasible_rate_gate"
          rationale: "Asserted twice there (rate 18 over feasible 17; AFP 60 under the ground-stop zero-branch)."

      - name: err_no_current_forecast_covered
        claim_type: violation_to_error
        grounds:
          - errors[ERR_NO_CURRENT_FORECAST]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / activation_requires_published_forecast"
          rationale: "Asserted at publish with no forecast and at activate with a STALE forecast."

      - name: err_tmi_overlap_covered
        claim_type: violation_to_error
        grounds:
          - errors[ERR_TMI_OVERLAP]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / tmi_aggregate_capacity_coexistence"
          rationale: "Asserted when a second GDP overlaps an ACTIVE GDP on the same facility."

      - name: err_constraint_event_overlap_covered
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CONSTRAINT_EVENT_OVERLAP]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / constraint_event_half_open_adjacency"
          rationale: "Asserted for the 14:59-start WEATHER event overlapping [13:00,15:00)."

      - name: err_tmi_not_active_covered
        claim_type: violation_to_error
        grounds:
          - errors[ERR_TMI_NOT_ACTIVE]
        excluded_because:
          difficulty_instance: "non_linear_state_machine / tmi_revision_cycle"
          rationale: "Asserted by the substitution attempt while the TMI sits in REVISING."

      - name: err_extension_limit_covered
        claim_type: violation_to_error
        grounds:
          - errors[ERR_EXTENSION_LIMIT_EXCEEDED]
        excluded_because:
          difficulty_instance: "boundary_precision_check / constraint_event_extension_boundary"
          rationale: "Asserted on the third extension attempt (extension_count == 2)."

      - name: err_facility_not_operational_covered
        claim_type: violation_to_error
        grounds:
          - errors[ERR_FACILITY_NOT_OPERATIONAL]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / reroute_blocked_by_sector_outage"
          rationale: "Asserted on the reroute assignment into the OUTAGE sector."

