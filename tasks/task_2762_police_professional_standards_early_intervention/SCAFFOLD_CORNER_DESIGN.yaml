          assert:
            - "the disposition created CredibilityDisclosure.${cd_id} in status ACTIVE with basis UNTRUTHFULNESS_SUSTAINED, permanent_retention true, release_count 0, and Officer Vance credibility_disclosure_active true"
            - "call 1: HTTP 200 with release_count == 1 and last_released_at == 2026-08-05T09:00:00Z"
            - "call 2: HTTP 200 with Discipline.${d1_id}.final_days == 30 (class A tier 0, at the class A floor) and status IMPOSED"
            - "call 5: HTTP 200 with Allegation.${a1_id}.disposition == OVERTURNED_ON_APPEAL, CredibilityDisclosure.${cd_id}.status == EXPUNGED and Officer Vance credibility_disclosure_active == false"
            - "call 6: HTTP 409 with ${e_not_active} == ERR_DISCLOSURE_NOT_ACTIVE, release_count still 1 and last_released_at unchanged, so the refused release left no trace"

  # =========================================================================
  # Guide section 7 - RBAC (§1.6, eight roles, role_model segregation_of_duties)
  # =========================================================================
  - section: rbac
    instances:
      - name: every_role_is_confined_to_its_own_exclusive_operations
        claim_type: Role cannot perform other roles' exclusive operations
        grounds:
          - roles
          - errors.ERR_UNAUTHENTICATED
          - errors.ERR_UNAUTHORIZED
          - validations[priority=1]
          - validations[priority=2]
        distinguishing_aspect: |
          The credential ladder occupies the top two rungs of the masking order, so it must answer
          before anything the request would otherwise fail on. Three of the probes prove that
          explicitly: a purge attempt by the wrong role is refused for the role and not because the
          complaint is unpurgeable, an appeal hearing by the wrong role is refused for the role and
          not because the appeal id does not exist, and a findings submission by the commander is
          refused for the role and not by the assigned-investigator rule at priority 6. A missing
          header outranks even a wrong role.
        test_recipe:
          setup:
            - "The logical clock stands at 2026-08-01T00:00:00Z."
            - "Internal Affairs holds Commander Reyes and Investigator Ahn; Patrol North holds Sergeant Doyle and Officer Vance."
            - "One supervisor-channel complaint with one allegation against Vance and an investigation created but not yet assigned."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /units"
              payload: { name: "Internal Affairs", unit_role: "INTERNAL_AFFAIRS", command_code: "IA", peer_group_code: "PG_IA", sworn_headcount: 12, intake_enabled: true }
              as: SystemAdmin
              captures: { ia_unit_id: $.data.id }
            - call: "POST /units"
              payload: { name: "Patrol North", unit_role: "PATROL_DIVISION", command_code: "PN", peer_group_code: "PG_NORTH", sworn_headcount: 60, intake_enabled: true }
              as: SystemAdmin
              captures: { patrol_unit_id: $.data.id }
