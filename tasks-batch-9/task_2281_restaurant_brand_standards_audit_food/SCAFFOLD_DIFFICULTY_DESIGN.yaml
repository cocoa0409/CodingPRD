scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: visit_composite_provisional_versus_final_diverges_and_flips_grade
        grounds:
          - calculations.visit_composite_score
          - calculations.health_component_percent
          - calculations.visit_grade
          - entities.AuditVisit.fields.composite_variant
          - state_machines.AuditVisit.SUBMITTED_to_FINALIZED
        distinguishing_aspect: |
          This is the dual-variant calculation on the AuditVisit scoring domain: the identical
          six ScoredItems yield 90.70 / PASS under the PROVISIONAL weight set (0.60 base + 0.40
          food safety) and 86.52 / CONDITIONAL under the FINAL weight set (0.45 base + 0.30 food
          safety + 0.25 health component), so the variant switch alone changes the letter outcome.
        test_recipe:
          setup:
            - "Brand SKWR with a PUBLISHED 100-point rubric of six items (FS-1 30 critical, FS-2 20 critical, BS-1 15, BS-2 15, FC-1 12, FC-2 8)"
            - "Location SKWR-014 under franchisee Northline Foods, auditor Dana Reyes CERTIFIED"
            - "Visit V1 UNANNOUNCED scored FS-1 27, FS-2 20, BS-1 12, BS-2 15, FC-1 10, FC-2 8 and SUBMITTED"
            - "One RECORDED health inspection dated 2026-07-20 with 74/100 and letter grade C"
            - "Logical clock at 2026-08-05T13:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BrandAdmin
            - call: "POST /brands"
              payload: { name: "Skewer House", brand_code: "SKWR", unannounced_min_ratio_pct: 40 }
              as: BrandAdmin
              captures: { brand_id: $.data.id, brand_v: $.data.version }
            - call: "POST /franchisees"
              payload: { brand_id: "${brand_id}", legal_name: "Northline Foods LLC", contact_email: "ops@northline.test", agreement_signed_at: "2025-03-01T00:00:00Z" }
              as: BrandAdmin
              captures: { fr_id: $.data.id }
            - call: "POST /locations"
              payload: { brand_id: "${brand_id}", franchisee_id: "${fr_id}", store_number: "SKWR-014", region_code: "MIDWEST" }
              as: BrandAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /auditors"
              payload: { full_name: "Dana Reyes", employee_code: "AUD-101" }
              as: BrandAdmin
              captures: { aud_id: $.data.id }
            - call: "POST /auditors/${aud_id}/certify"
              payload: {}
              as: BrandAdmin
            - call: "POST /rubric-versions"
              payload: { brand_id: "${brand_id}", version_label: "RV-2026.1", effective_from: "2026-07-01T00:00:00Z", total_points: 100, expected_brand_version: "${brand_v}" }
              as: BrandAdmin
              captures: { rv_id: $.data.id }
            - call: "POST /rubric-versions/${rv_id}/rubric-items"
              payload: { item_code: "FS-1", section: "FOOD_SAFETY", max_points: 30, is_critical: true, display_order: 1 }
              as: BrandAdmin
              captures: { fs1_id: $.data.id }
            - call: "POST /rubric-versions/${rv_id}/rubric-items"
              payload: { item_code: "FS-2", section: "FOOD_SAFETY", max_points: 20, is_critical: true, display_order: 2 }
              as: BrandAdmin
              captures: { fs2_id: $.data.id }
            - call: "POST /rubric-versions/${rv_id}/rubric-items"
              payload: { item_code: "BS-1", section: "BRAND_STANDARDS", max_points: 15, is_critical: false, display_order: 3 }
              as: BrandAdmin
              captures: { bs1_id: $.data.id }
            - call: "POST /rubric-versions/${rv_id}/rubric-items"
              payload: { item_code: "BS-2", section: "BRAND_STANDARDS", max_points: 15, is_critical: false, display_order: 4 }
              as: BrandAdmin
              captures: { bs2_id: $.data.id }
            - call: "POST /rubric-versions/${rv_id}/rubric-items"
              payload: { item_code: "FC-1", section: "FACILITY", max_points: 12, is_critical: false, display_order: 5 }
              as: BrandAdmin
              captures: { fc1_id: $.data.id }
            - call: "POST /rubric-versions/${rv_id}/rubric-items"
              payload: { item_code: "FC-2", section: "FACILITY", max_points: 8, is_critical: false, display_order: 6 }
              as: BrandAdmin
              captures: { fc2_id: $.data.id }
            - call: "POST /rubric-versions/${rv_id}/publish"
              payload: {}
              as: BrandAdmin
            - call: "POST /audit-visits"
              payload: { location_id: "${loc_id}", auditor_id: "${aud_id}", rubric_version_id: "${rv_id}", visit_type: "UNANNOUNCED", scheduled_start_at: "2026-08-05T09:00:00Z", scheduled_end_at: "2026-08-05T13:00:00Z" }
              as: BrandAdmin
              captures: { v1_id: $.data.id }
            - call: "POST /health-inspections"
              payload: { location_id: "${loc_id}", authority_name: "Cook County DPH", inspection_date: "2026-07-20T00:00:00Z", points_scored: 74, points_possible: 100, letter_grade: "C" }
              as: ComplianceIntegrator
              captures: { hi_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: BrandAdmin
            - call: "POST /audit-visits/${v1_id}/start"
              payload: {}
              as: Auditor
              as_user_id: "${aud_id}"
            - call: "POST /audit-visits/${v1_id}/scored-items"
              payload: { rubric_item_id: "${fs1_id}", points_awarded: 27 }
              as: Auditor
              as_user_id: "${aud_id}"
              captures: { si_fs1_id: $.data.id }
            - call: "POST /audit-visits/${v1_id}/scored-items"
              payload: { rubric_item_id: "${fs2_id}", points_awarded: 20 }
              as: Auditor
              as_user_id: "${aud_id}"
            - call: "POST /audit-visits/${v1_id}/scored-items"
              payload: { rubric_item_id: "${bs1_id}", points_awarded: 12 }
              as: Auditor
              as_user_id: "${aud_id}"
              captures: { si_bs1_id: $.data.id }
            - call: "POST /audit-visits/${v1_id}/scored-items"
              payload: { rubric_item_id: "${bs2_id}", points_awarded: 15 }
              as: Auditor
              as_user_id: "${aud_id}"
            - call: "POST /audit-visits/${v1_id}/scored-items"
              payload: { rubric_item_id: "${fc1_id}", points_awarded: 10 }
              as: Auditor
              as_user_id: "${aud_id}"
            - call: "POST /audit-visits/${v1_id}/scored-items"
              payload: { rubric_item_id: "${fc2_id}", points_awarded: 8 }
              as: Auditor
              as_user_id: "${aud_id}"
            - call: "POST /audit-visits/${v1_id}/submit"
              payload: {}
              as: Auditor
              as_user_id: "${aud_id}"
              captures: { prov_score: $.data.composite_score, prov_grade: $.data.grade, prov_variant: $.data.composite_variant }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T13:00:00Z" }
              as: BrandAdmin
          trigger:
            - call: "POST /audit-visits/${v1_id}/finalize"
              payload: {}
              as: BrandAdmin
              captures: { final_score: $.data.composite_score }
          assert:
            - "${prov_score} == 90.70 and ${prov_grade} == 'PASS' and ${prov_variant} == 'PROVISIONAL'"
            - "trigger response data.composite_variant == 'FINAL'"
            - "trigger response data.health_component_percent == 74.00"
            - "trigger response data.linked_health_inspection_id == ${hi_id}"
            - "${final_score} == 86.52"
            - "trigger response data.grade == 'CONDITIONAL'"
            - "90.70 - 86.52 == 4.18 (the variant delta is observable on one unchanged score sheet)"

      - name: auditor_reliability_rolling_versus_certification_review_diverges
        grounds:
