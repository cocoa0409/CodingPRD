# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Domain: travel-rewards-portal-transfer-administration   api_prefix: /rewards
# Every instance grounds only in elements declared in SCAFFOLD.yaml §1.1-§1.7.
# The logical clock defaults to 2026-08-01T00:00:00Z; chains that depend on a
# different instant set it explicitly.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: dual_variant_redemption_issuer_cost_provisional_vs_final
        grounds:
          - calculations.redemption_issuer_cost
          - calculations.redemption_points_price_and_parity
          - entities.RedemptionOrder.fields.issuer_cost_provisional_cents
          - entities.RedemptionOrder.fields.issuer_cost_final_cents
          - entities.RedemptionOrder.fields.cost_per_1k_provisional_cents
          - entities.RedemptionOrder.fields.cost_per_1k_final_cents
          - state_machines.RedemptionOrder.AGENCY_INVOICED_to_SETTLED
        distinguishing_aspect: |
          The two variants live on the same RedemptionOrder row and are computed from disjoint
          input sets: provisional_estimate reads only the agency net_rate_cents captured at
          booking (36000 cents, 1023 cents per 1000 points) while final_actual reads only the
          settlement inputs (36500 cents, 1037 cents per 1000 points); neither field overwrites
          the other, and the 500-cent delta is what moves TravelAgencyPartner.payable_cents.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One PREMIER account holding exactly 36000 points from a single DINING purchase."
            - "One ACTIVE agency with contracted_markup_bps 2000 and parity_tolerance_bps 1000."
            - "One OPEN, IN_PARITY offer: net_rate 40000, agency public price 50000, 3 public seats, 2 portal seats, 4000 cents of tax."
          setup_api_calls:
            - call: "POST /rewards/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/accounts"
              payload: { cardholder_name: "Ada Reyes", email: "ada@example.com", card_product_code: "PREMIER", enrolled_at: "2024-03-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { a_id: $.data.id }
            - call: "POST /rewards/merchant-categories"
              payload: { mcc_code: "5812", display_name: "Restaurants", base_category: "DINING", base_multiplier: 3.0, is_fallback: false }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/transactions"
              payload: { account_id: "${a_id}", mcc_code: "5812", amount_cents: 800000, posted_at: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/agency-partners"
              payload: { name: "Skyline Travel", contracted_markup_bps: 2000, parity_tolerance_bps: 1000, invoice_terms_days: 30 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { ag_id: $.data.id }
            - call: "POST /rewards/inventory-offers"
              payload: { agency_partner_id: "${ag_id}", itinerary_code: "SFO-NRT-01", depart_at: "2026-11-02T09:00:00Z", return_at: "2026-11-16T18:00:00Z", net_rate_cents: 40000, agency_public_price_cents: 50000, agency_public_seats: 3, portal_seats: 2, tax_cents: 4000 }
              as: AgencySupplier
              as_user_id: "${ag_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
          trigger:
            - call: "POST /rewards/inventory-offers/${o_id}/book"
              payload: { account_id: "${a_id}", traveler_name: "Ada Reyes", expected_offer_version: "${o_v}" }
              as: Cardholder
              as_user_id: "${a_id}"
              captures: { ro_id: $.data.id }
            - call: "POST /rewards/redemption-orders/${ro_id}/confirm"
              as: Cardholder
              as_user_id: "${a_id}"
            - call: "POST /rewards/redemption-orders/${ro_id}/ticket"
              payload: { ticket_number: "TKT-88120" }
              as: AgencySupplier
              as_user_id: "${ag_id}"
            - call: "POST /rewards/redemption-orders/${ro_id}/settle"
              payload: { invoice_amount_cents: 41000, settlement_adjustment_cents: -500 }
              as: ProgramAdmin
              as_user_id: "admin-1"
          assert:
            - "PortalInventoryOffer.${o_id}.portal_price_cents == 48000"
            - "PortalInventoryOffer.${o_id}.parity_status == IN_PARITY"
            - "RedemptionOrder.${ro_id}.cents_per_point_applied == 1.25"
            - "RedemptionOrder.${ro_id}.points_debited == 35200"
            - "RedemptionOrder.${ro_id}.issuer_cost_provisional_cents == 36000"
            - "RedemptionOrder.${ro_id}.cost_per_1k_provisional_cents == 1023"
            - "RedemptionOrder.${ro_id}.issuer_cost_final_cents == 36500"
            - "RedemptionOrder.${ro_id}.cost_per_1k_final_cents == 1037"
            - "RedemptionOrder.${ro_id}.fulfillment_status == TICKETED and RedemptionOrder.${ro_id}.settlement_status == SETTLED"
            - "TravelAgencyPartner.${ag_id}.payable_cents == 36500"
            - "Account.${a_id}.points_balance == 800"

      - name: dual_variant_ato_score_instant_vs_review
        grounds:
          - calculations.ato_risk_score
          - calculations.account_fraud_posture
          - entities.FraudCase.fields.instant_score
          - entities.FraudCase.fields.review_score
          - state_machines.FraudCase.OPEN_to_UNDER_REVIEW
        distinguishing_aspect: |
          This dual variant lives on FraudCase, not on RedemptionOrder: instant_signal_score is a
          pure signal-weight sum (30 + 20 = 50) while review_velocity_score adds the 30-day
          transfer velocity term (60000 // 50000 * 10 = 10) and subtracts the device-stability
          credit (0, because device_fingerprint_changed is true), landing on exactly 60 — so the
          same case on the same data crosses POSTURE_LOCK_SCORE at review that it did not cross
          at open, moving the account WATCH -> LOCKED.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One PREMIER account holding 67500 points from a single DINING purchase."
            - "One ACTIVE partner agreement at a 1000:1000 ratio, 1000-point minimum and increment."
            - "One SUBMITTED transfer of 60000 points on that agreement (balance 7500, pending 60000)."
            - "One ACTIVE LOUNGE_ACCESS entitlement and one ACTIVE TRAVEL_INSURANCE entitlement on the account."
          setup_api_calls:
            - call: "POST /rewards/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/accounts"
              payload: { cardholder_name: "Ben Okoro", email: "ben@example.com", card_product_code: "PREMIER", enrolled_at: "2024-05-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { a_id: $.data.id }
            - call: "POST /rewards/merchant-categories"
              payload: { mcc_code: "5812", display_name: "Restaurants", base_category: "DINING", base_multiplier: 3.0, is_fallback: false }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/transactions"
              payload: { account_id: "${a_id}", mcc_code: "5812", amount_cents: 1500000, posted_at: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/partner-agreements"
              payload: { partner_name: "Aurora Air Miles", partner_program_code: "AURORA", ratio_points_out: 1000, ratio_partner_units_in: 1000, min_transfer_points: 1000, transfer_increment_points: 1000, transfer_latency_hours: 24, reversal_window_hours: 72, settlement_cost_cents_per_1k: 900 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { pa_id: $.data.id }
            - call: "POST /rewards/partner-agreements/${pa_id}/submit"
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/partner-agreements/${pa_id}/approve"
              as: ProgramApprover
              as_user_id: "approver-1"
            - call: "POST /rewards/benefit-entitlements"
              payload: { account_id: "${a_id}", benefit_type: "LOUNGE_ACCESS", annual_allowance: 6, expires_at: "2027-08-01T00:00:00Z", requires_portal_booking: false }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { be_lounge_id: $.data.id }
            - call: "POST /rewards/benefit-entitlements"
              payload: { account_id: "${a_id}", benefit_type: "TRAVEL_INSURANCE", annual_allowance: 2, expires_at: "2027-08-01T00:00:00Z", requires_portal_booking: true }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { be_ins_id: $.data.id }
            - call: "GET /rewards/accounts/${a_id}"
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { a_v: $.data.version }
            - call: "POST /rewards/transfer-requests"
              payload: { account_id: "${a_id}", partner_agreement_id: "${pa_id}", points_out: 60000, expected_account_version: "${a_v}" }
              as: Cardholder
              as_user_id: "${a_id}"
              captures: { tr_id: $.data.id }
          trigger:
            - call: "POST /rewards/fraud-cases"
              payload: { account_id: "${a_id}", case_type: "ACCOUNT_TAKEOVER", signals: ["DEVICE_CHANGE", "EMAIL_CHANGE"], device_fingerprint_changed: true }
              as: FraudAnalyst
              as_user_id: "fraud-1"
              captures: { fc_id: $.data.id, fc_instant: $.data.instant_score }
            - call: "POST /rewards/fraud-cases/${fc_id}/review"
              as: FraudAnalyst
              as_user_id: "fraud-1"
          assert:
            - "FraudCase.${fc_id}.instant_score == 50"
            - "FraudCase.${fc_id}.review_score == 60"
            - "FraudCase.${fc_id}.risk_score == 60"
            - "Account.${a_id}.fraud_posture == LOCKED"
            - "TransferRequest.${tr_id}.status == REJECTED"
            - "TransferRequest.${tr_id}.resolution_reason == POSTURE_LOCKED"
            - "Account.${a_id}.points_balance == 67500"
            - "Account.${a_id}.points_pending_redemption == 0"
            - "BenefitEntitlement.${be_lounge_id}.status == SUSPENDED"
            - "BenefitEntitlement.${be_ins_id}.status == SUSPENDED and BenefitEntitlement.${be_ins_id}.suspension_reason == POSTURE_LOCKED"

  - rule_id: combinatorial_formula
    instances:
      - name: combinatorial_earning_two_legs_floored_independently_then_summed
        grounds:
          - calculations.transaction_points_award
          - entities.Transaction.fields.base_points
          - entities.Transaction.fields.bonus_points
          - entities.Transaction.fields.total_points_earned
          - state_machines.EarningCategoryRotation.SCHEDULED_to_ACTIVE
        distinguishing_aspect: |
          Mode (a): two multiplicative legs are each floored once and only then summed.
          123 billable dollars at base 1.5 and product 1.5 gives floor(276.75) = 276; the
          incremental rotation leg 1.25 at product 1.5 gives floor(230.625) = 230; the stored
          total is 506. Summing first and flooring once yields floor(507.375) = 507, so the
          pinned per-leg rounding order is observable as a one-point difference.
        test_recipe:
          setup:
            - "A DINING category at base_multiplier 1.5 and an ACTIVE rotation on it at bonus_multiplier 2.25 with a 100000-cent cap."
            - "Logical clock advanced to 2026-09-05T00:00:00Z so the ops-run has activated the rotation."
            - "One PREMIER account with a zero points balance."
          setup_api_calls:
            - call: "POST /rewards/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/accounts"
              payload: { cardholder_name: "Cora Vance", email: "cora@example.com", card_product_code: "PREMIER", enrolled_at: "2024-06-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { a_id: $.data.id }
            - call: "POST /rewards/merchant-categories"
              payload: { mcc_code: "5812", display_name: "Restaurants", base_category: "DINING", base_multiplier: 1.5, is_fallback: false }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { mc_id: $.data.id }
            - call: "POST /rewards/rotations"
              payload: { merchant_category_id: "${mc_id}", rotation_code: "Q4-DINING", bonus_multiplier: 2.25, capped_spend_cents: 100000, window_start: "2026-09-01T00:00:00Z", window_end: "2026-10-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { rot_id: $.data.id }
            - call: "POST /rewards/rotations/${rot_id}/publish"
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/_clock/set_current_utc"
              payload: { current_utc: "2026-09-05T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/ops-runs"
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /rewards/transactions"
              payload: { account_id: "${a_id}", mcc_code: "5812", amount_cents: 12345, posted_at: "2026-09-10T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { t_id: $.data.id }
          assert:
            - "EarningCategoryRotation.${rot_id}.status == ACTIVE"
            - "Transaction.${t_id}.classification_source == MAPPED"
            - "Transaction.${t_id}.merchant_category_id == ${mc_id}"
            - "Transaction.${t_id}.rotation_id == ${rot_id}"
            - "Transaction.${t_id}.rotation_eligible_cents == 12345"
            - "Transaction.${t_id}.base_points == 276"
            - "Transaction.${t_id}.bonus_points == 230"
            - "Transaction.${t_id}.total_points_earned == 506"
            - "Transaction.${t_id}.total_points_earned != 507"
            - "Account.${a_id}.points_balance == 506"
            - "exactly two PointsLedgerEntry rows exist for the account: EARN_BASE +276 then EARN_BONUS +230"

      - name: combinatorial_transfer_units_floored_per_1000_point_block
        grounds:
          - calculations.transfer_units_credited
          - calculations.grandfathering_terms_resolution
          - entities.TransferRequest.fields.base_units
          - entities.TransferRequest.fields.bonus_units
          - state_machines.TransferRequest.QUEUED_to_COMPLETED
          - state_machines.TransferBonusEvent.SCHEDULED_to_RUNNING
        distinguishing_aspect: |
          Mode (b): a single conversion is decomposed into 1000-point blocks that are each
          floored before summation. 9000 points at a 3000:2000 ratio gives
          9 * floor(1000*2000/3000) = 9 * 666 = 5994 base units, never the 6000 that
          floor(9000*2000/3000) would produce; the promotional leg is then floored against the
          already-floored 666 (floor(666*3000/10000) = 199) and capped at 6 of the 9 blocks,
          giving 1194 bonus units and 7188 total.
        test_recipe:
          setup:
            - "One CORE account holding 10000 points from a single GROCERY purchase."
            - "One ACTIVE agreement at a 3000:2000 ratio, 1000-point minimum and increment, 24-hour latency."
            - "One RUNNING TransferBonusEvent on that agreement at 3000 bps with a 6000-point per-account cap, closed window 2026-08-05 .. 2026-08-20."
            - "Logical clock at 2026-08-10T00:00:00Z when the transfer is submitted."
          setup_api_calls:
            - call: "POST /rewards/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/accounts"
              payload: { cardholder_name: "Dov Halevi", email: "dov@example.com", card_product_code: "CORE", enrolled_at: "2025-02-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { a_id: $.data.id }
            - call: "POST /rewards/merchant-categories"
              payload: { mcc_code: "5411", display_name: "Grocery Stores", base_category: "GROCERY", base_multiplier: 1.0, is_fallback: false }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/transactions"
              payload: { account_id: "${a_id}", mcc_code: "5411", amount_cents: 1000000, posted_at: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/partner-agreements"
              payload: { partner_name: "Borealis Miles", partner_program_code: "BOREALIS", ratio_points_out: 3000, ratio_partner_units_in: 2000, min_transfer_points: 1000, transfer_increment_points: 1000, transfer_latency_hours: 24, reversal_window_hours: 72, settlement_cost_cents_per_1k: 950 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { pa_id: $.data.id }
            - call: "POST /rewards/partner-agreements/${pa_id}/submit"
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/partner-agreements/${pa_id}/approve"
              as: ProgramApprover
              as_user_id: "approver-1"
            - call: "POST /rewards/bonus-events"
              payload: { partner_agreement_id: "${pa_id}", event_code: "BOREALIS-30", bonus_bps: 3000, window_start: "2026-08-05T00:00:00Z", window_end: "2026-08-20T00:00:00Z", cap_points_per_account: 6000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { ev_id: $.data.id }
            - call: "POST /rewards/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/ops-runs"
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "GET /rewards/accounts/${a_id}"
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { a_v: $.data.version }
          trigger:
            - call: "POST /rewards/transfer-requests"
              payload: { account_id: "${a_id}", partner_agreement_id: "${pa_id}", points_out: 9000, expected_account_version: "${a_v}" }
              as: Cardholder
              as_user_id: "${a_id}"
              captures: { tr_id: $.data.id }
            - call: "POST /rewards/transfer-requests/${tr_id}/clear-screening"
              as: FraudAnalyst
              as_user_id: "fraud-1"
            - call: "POST /rewards/_clock/set_current_utc"
              payload: { current_utc: "2026-08-12T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/ops-runs"
              as: ProgramAdmin
              as_user_id: "admin-1"
          assert:
            - "TransferBonusEvent.${ev_id}.status == RUNNING"
            - "TransferRequest.${tr_id}.bonus_event_id == ${ev_id}"
            - "TransferRequest.${tr_id}.scheduled_post_at == 2026-08-11T00:00:00Z"
            - "TransferRequest.${tr_id}.status == COMPLETED"
            - "TransferRequest.${tr_id}.ratio_points_out_applied == 3000"
            - "TransferRequest.${tr_id}.ratio_partner_units_in_applied == 2000"
            - "TransferRequest.${tr_id}.base_units == 5994"
            - "TransferRequest.${tr_id}.base_units != 6000"
            - "TransferRequest.${tr_id}.bonus_units == 1194"
            - "TransferRequest.${tr_id}.partner_units_credited == 7188"
            - "Account.${a_id}.points_balance == 1000"
            - "Account.${a_id}.points_pending_redemption == 0"

      - name: combinatorial_liability_tier_pinned_to_step_one_gross
        grounds:
          - calculations.points_liability_and_breakage
          - calculations.redemption_issuer_cost
          - entities.LiabilitySnapshot.fields.gross_liability_cents
          - entities.LiabilitySnapshot.fields.breakage_credit_cents
          - entities.LiabilitySnapshot.fields.net_liability_cents
          - entities.LiabilitySnapshot.fields.effective_breakage_rate_bps
        distinguishing_aspect: |
          Mode (c): a genuinely circular seven-step pipeline whose evaluation order is pinned.
          The breakage tier is selected from the STEP 1 gross outstanding points (1156000 ->
          1800 bps), NOT from the STEP 7 net liability the tier itself produces (753574 and
          742679 cents, both of which would select the 1200-bps tier), and each dormancy bucket
          is valued and credited at its own rate before the two are summed. Reordering any step
          changes the reported cents.
        test_recipe:
          setup:
            - "Dormant CORE account D: one 400000-point GROCERY earn whose ledger entry occurred_at is 2024-01-01, i.e. more than DORMANCY_LOOKBACK_DAYS before the cut-off."
            - "Active CORE account A: one 800000-point GROCERY earn whose ledger entry occurred_at is 2026-07-01."
            - "Account A holds one SETTLED, TICKETED portal order: points_debited 44000, provisional issuer cost 36000, final issuer cost 36500."
            - "Logical clock at 2026-08-01T00:00:00Z, which is also the snapshot cut-off."
          setup_api_calls:
            - call: "POST /rewards/_clock/set_current_utc"
              payload: { current_utc: "2024-01-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/merchant-categories"
              payload: { mcc_code: "5411", display_name: "Grocery Stores", base_category: "GROCERY", base_multiplier: 1.0, is_fallback: false }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/accounts"
              payload: { cardholder_name: "Dana Quist", email: "dana@example.com", card_product_code: "CORE", enrolled_at: "2023-01-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { d_id: $.data.id }
            - call: "POST /rewards/transactions"
              payload: { account_id: "${d_id}", mcc_code: "5411", amount_cents: 40000000, posted_at: "2024-01-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/_clock/set_current_utc"
              payload: { current_utc: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/accounts"
              payload: { cardholder_name: "Amir Sole", email: "amir@example.com", card_product_code: "CORE", enrolled_at: "2025-01-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { a_id: $.data.id }
            - call: "POST /rewards/transactions"
              payload: { account_id: "${a_id}", mcc_code: "5411", amount_cents: 80000000, posted_at: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/agency-partners"
              payload: { name: "Meridian Voyages", contracted_markup_bps: 2000, parity_tolerance_bps: 1000, invoice_terms_days: 30 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { ag_id: $.data.id }
            - call: "POST /rewards/inventory-offers"
              payload: { agency_partner_id: "${ag_id}", itinerary_code: "LAX-CDG-04", depart_at: "2026-12-01T10:00:00Z", return_at: "2026-12-14T20:00:00Z", net_rate_cents: 40000, agency_public_price_cents: 50000, agency_public_seats: 3, portal_seats: 2, tax_cents: 4000 }
              as: AgencySupplier
              as_user_id: "${ag_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /rewards/_clock/set_current_utc"
              payload: { current_utc: "2026-07-10T00:00:00Z" }
              as: ProgramAdmin
