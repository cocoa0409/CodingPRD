        claim_type: RBAC denial
        grounds:
          - roles.Patron
          - validations[priority=2]
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "The entity_backed Patron role is denied admin-only operations: work creation and the sweep endpoint both fail with 403 ERR_UNAUTHORIZED even with a valid patron id."
        test_recipe:
          setup:
            - "Patron P-R exists."
          setup_api_calls:
            - call: "POST /archive/patrons"
              payload: { email: "rbac@example.org", full_name: "RBAC Patron" }
              as: Anonymous
              captures: { prbac: $.data.id }
          trigger:
            - call: "POST /archive/works"
              payload: { title: "Forbidden", author: "RB", publication_year: 2000 }
              as: Patron
              as_user_id: "${prbac}"
              captures: { rbac_err1: $.data.error_id }
            - call: "POST /archive/_sweeps/run"
              payload: {}
              as: Patron
              as_user_id: "${prbac}"
              captures: { rbac_err2: $.data.error_id }
          assert:
            - "rbac_err1 == ERR_UNAUTHORIZED (403) and rbac_err2 == ERR_UNAUTHORIZED (403)"
      - name: patron_cannot_read_other_patrons_record
        claim_type: RBAC denial
        grounds:
          - roles.Patron
          - validations[priority=2]
        distinguishing_aspect: "Ownership scoping: patron A reading patron B's record fails 403 even though Patron is in the endpoint's role list."
        test_recipe:
          setup:
            - "Patrons P-A and P-B exist."
          setup_api_calls:
            - call: "POST /archive/patrons"
              payload: { email: "pa@example.org", full_name: "P A" }
              as: Anonymous
              captures: { pa: $.data.id }
            - call: "POST /archive/patrons"
              payload: { email: "pb@example.org", full_name: "P B" }
              as: Anonymous
              captures: { pb: $.data.id }
          trigger:
            - call: "GET /archive/patrons/${pb}"
              payload: {}
              as: Patron
              as_user_id: "${pa}"
              captures: { own_err: $.data.error_id }
          assert:
            - "own_err == ERR_UNAUTHORIZED (403)"
            - "GET /archive/patrons/${pa} as Patron with X-User-ID ${pa} returns 200"
      - name: crawl_operator_cannot_manage_rights_requests
        claim_type: RBAC denial
        grounds:
          - roles.CrawlOperator
          - roles.LegalReviewer
        distinguishing_aspect: "Peer-role isolation: CrawlOperator may not file rights requests and LegalReviewer may not create crawl jobs; both denials are ERR_UNAUTHORIZED."
        test_recipe:
