      - name: resume_requires_partner_active
        grounds:
          - validations[priority=7]
          - state_machines.RecurringPlan.PAUSED_to_ACTIVE
          - errors[ERR_PARTNER_SUSPENDED]
          - entities.CharityPartner.fields.status
        distinguishing_aspect: |
          Resuming a PAUSED plan whose CharityPartner is SUSPENDED returns ERR_PARTNER_SUSPENDED — the
          RecurringPlan PAUSED->ACTIVE transition is gated by CharityPartner.status (RecurringPlan->CharityPartner
          pair, distinct from the schedule->route pair).
        test_recipe:
          setup:
            - "Partner created ACTIVE; donor; plan created ACTIVE then paused (PAUSED); partner then patched SUSPENDED."
