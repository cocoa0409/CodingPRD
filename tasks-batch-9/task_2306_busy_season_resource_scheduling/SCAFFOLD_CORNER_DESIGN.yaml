      - name: assignment_create_with_two_unknown_body_ids_reports_phase_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=5]
          - errors[ERR_PHASE_NOT_FOUND]
          - endpoints[POST /scheduling/assignments]
        distinguishing_aspect: |
          Priority 5 resolves body foreign keys in declared input order, so a booking whose
          engagement_phase_id AND staff_member_id are both unknown reports
          ERR_PHASE_NOT_FOUND — the phase is the first input field — never
          ERR_STAFF_MEMBER_NOT_FOUND.
        test_recipe:
          setup:
            - "Logical clock 2026-08-03T09:00:00Z; no EngagementPhase and no StaffMember carry the UUIDs used in the trigger."
          setup_api_calls:
            - call: "POST /scheduling/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: FirmAdmin
          trigger:
            - call: "POST /scheduling/assignments"
              payload: { engagement_phase_id: "00000000-0000-0000-0000-0000000000aa", staff_member_id: "00000000-0000-0000-0000-0000000000bb", start_date: "2026-08-03", end_date: "2026-08-10", allocated_hours: 20.00 }
              as: SchedulingManager
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 404"
            - "${err_id} == 'ERR_PHASE_NOT_FOUND'"
            - "${err_id} != 'ERR_STAFF_MEMBER_NOT_FOUND' (left-to-right input order decides which of the two unknown references is reported)"

      - name: workload_waiver_create_with_unknown_engagement_returns_not_found
        claim_type: cross_reference_integrity
        grounds:
          - validations[priority=5]
          - errors[ERR_ENGAGEMENT_NOT_FOUND]
          - endpoints[POST /scheduling/workload-waivers]
        distinguishing_aspect: |
          The entity topology is flat, so a WorkloadWaiver carries two independent foreign
          keys: with a real staff_member_id but an unknown engagement_id the request fails
          ERR_ENGAGEMENT_NOT_FOUND at priority 5, before the Monday check at priority 9
          would ever see the deliberately non-Monday week_start_date.
        test_recipe:
          setup:
            - "Logical clock 2026-08-03T09:00:00Z; DOMESTIC senior S1 exists; no Engagement exists at all."
          setup_api_calls:
            - call: "POST /scheduling/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: FirmAdmin
            - call: "POST /scheduling/staff-members"
              payload: { full_name: "Sam Oyelaran", level: "SENIOR", service_center: "DOMESTIC", industry_specialization: "MANUFACTURING", cpa_licensed: true, base_weekly_cap_hours: 40.00, hourly_bill_rate: 180.00 }
