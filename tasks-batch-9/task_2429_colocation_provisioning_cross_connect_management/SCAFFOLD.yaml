# =============================================================================
# task_2429 — Colocation Provisioning & Cross-Connect Management
# Scaffold §1.0–§1.7 (difficulty design → SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# corner design → SCAFFOLD_CORNER_DESIGN.yaml)
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2429. Colocation Provisioning & Cross-Connect Management (data center colocation provider): customer contract with cabinet, cage, power circuit and bandwidth commitments, space and power inventory with stranded capacity identification and density limits per row, circuit provisioning with redundant feeds, breaker sizing and metered versus committed power billing, cross-connect ordering with cable type, path routing and patch panel port assignment, remote hands service requests with authorization lists, response time commitments and billing by increment, access control with authorized visitor lists, escort rules and biometric enrollment, power usage monitoring with overage billing and cooling capacity constraints, decommissioning with equipment removal, cable reclamation and port release

domain_name: colocation-provisioning
api_prefix: /colocation

complexity_profile:
  difficulty_level: expert_plus       # §0.4 Expert band, deliberately denser (see orchestrator brief)
  primary_archetype: quota_allocation          # finite space/power/port pools reserved, committed, released
  secondary_archetype: pricing_engine          # metered vs committed power, increment-billed labour, tiered overage
  complexity_layers:
    - optimistic_concurrency                   # OCC on Contract.version and FloorRow.version
    - cascading_side_effects                   # energize / release-ports propagate 3–5 hops
    - dual_variant_calculation                 # metered-vs-deemed money, nameplate-vs-measured stranded kW
    - rate_threshold_triggers                  # density tolerance band, cooling alert ratio, kWh tier ladder

  entity_topology: flat
  # Every entity is a peer collection under /colocation with explicit FK fields;
  # no entity id appears as a URL path ancestor of another entity.

  state_machine_shape: cyclic
  # CrossConnectOrder cycles ROUTE_PROPOSED → CHANGES_REQUESTED → ROUTE_PROPOSED;
  # RemoteHandsTicket carries two independent state dimensions on one row;
  # DecommissionOrder forks two recorded steps and joins on READY_FOR_RELEASE.

  relationship_patterns:
    - one_to_many          # Customer→Contract, FloorRow→Cabinet, Cabinet→PowerCircuit
    - many_to_many         # CrossConnectOrder joins two Cabinets through two PatchPanelPorts
    - self_referential     # CrossConnectOrder.parent_order_id → CrossConnectOrder.id (re-issue chain)
    - cross_aggregate      # AccessVisit spans Contract, AuthorizedContact and Cabinet aggregates

  role_model: segregation_of_duties
  # Remote-hands requester may not authorize their own ticket; the operator who
  # records equipment removal may not record cable reclamation.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Registered customer name" }
      - { name: account_code, type: string, source: input, description: "Short customer code", constraints: "unique across Customer" }
      - { name: account_status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED | CLOSED — set at creation, moved by operator action", constraints: "ACTIVE | SUSPENDED | CLOSED" }

  - name: Contract
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; owning customer" }
      - { name: contract_number, type: string, source: input, description: "External contract reference", constraints: "unique across Contract" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | PENDING_ACTIVATION | ACTIVE | SUSPENDED | WIND_DOWN | TERMINATED", constraints: "DRAFT | PENDING_ACTIVATION | ACTIVE | SUSPENDED | WIND_DOWN | TERMINATED" }
      - { name: billing_mode, type: enum, source: input, description: "METERED_PLUS_COMMIT (overage from meter intervals) | COMMITTED_ONLY (overage from deemed capacity load)", constraints: "METERED_PLUS_COMMIT | COMMITTED_ONLY" }
      - { name: committed_cabinet_count, type: integer, source: input, description: "Number of cabinets the contract may hold", constraints: ">= 1" }
      - { name: committed_cage_sqft, type: number, source: input, default: 0, description: "Contracted caged floor area in square feet", constraints: ">= 0" }
      - { name: power_commit_kw, type: number, source: input, description: "Committed power in kW; drives committed charge and included kWh", constraints: "> 0, 3 decimals" }
      - { name: committed_bandwidth_mbps, type: integer, source: input, description: "Contracted uplink bandwidth commitment in Mbps", constraints: ">= 0" }
      - { name: redundancy_requirement, type: enum, source: input, default: N, description: "N | N_PLUS_1 | TWO_N — TWO_N forces a B-side REDUNDANT feed before any PRIMARY circuit may energize", constraints: "N | N_PLUS_1 | TWO_N" }
      - { name: cross_connect_allowance, type: integer, source: input, default: 0, description: "Count of ACTIVE cross-connects waived at billing close", constraints: ">= 0" }
      - { name: cross_connect_cap, type: integer, source: input, description: "Maximum count of non-terminal cross-connect orders that may co-exist", constraints: ">= 1" }
      - { name: remote_hands_included_minutes, type: integer, source: input, default: 0, description: "Remote-hands minutes bundled into the contract", constraints: ">= 0, multiple of 15" }
      - { name: remote_hands_remaining_minutes, type: integer, source: computed, description: "Unconsumed bundled minutes; decremented on ticket completion, restored by a REMOTE_HANDS line reversal", constraints: ">= 0" }
      - { name: credit_hold, type: boolean, source: system, default: false, description: "Billing freeze flag; blocks new chargeable orders" }
      - { name: term_start_date, type: datetime, source: input, description: "Contract term start (ISO 8601 UTC)" }
      - { name: term_end_date, type: datetime, source: input, description: "Contract term end (ISO 8601 UTC)", constraints: "> term_start_date" }
      - { name: provisioned_power_kw, type: number, source: computed, default: 0, description: "Sum of allocated_kw over ENERGIZED PRIMARY circuits on this contract's cabinets", constraints: "3 decimals" }
      - { name: stranded_commit_kw, type: number, source: computed, default: 0, description: "max(power_commit_kw - provisioned_power_kw, 0), 3 decimals" }
      - { name: commit_utilization_pct, type: number, source: computed, default: 0, description: "round(provisioned_power_kw / power_commit_kw * 100, 1)" }
      - { name: active_cross_connect_count, type: integer, source: computed, default: 0, description: "Count of CrossConnectOrder with status == ACTIVE on this contract" }
      - { name: billed_total_usd, type: number, source: computed, default: 0, description: "Sum of InvoiceLine.amount_usd over this contract, 2 decimals" }
      - { name: cross_connect_billed_usd, type: number, source: computed, default: 0, description: "Sum of InvoiceLine.amount_usd for line_type IN {CROSS_CONNECT_MRC, CROSS_CONNECT_SURCHARGE}, 2 decimals" }
      - { name: last_closed_period_end, type: datetime, source: system, default: null, description: "period_end of the most recent successful billing close" }

  - name: FloorRow
    parent: null
    common_fields: true
    fields:
      - { name: hall_code, type: string, source: input, description: "Data hall identifier" }
      - { name: row_code, type: string, source: input, description: "Row identifier within the hall", constraints: "unique per (hall_code, row_code)" }
      - { name: cabinet_slot_count, type: integer, source: input, description: "Physical cabinet positions in the row", constraints: ">= 1" }
      - { name: design_density_kw_per_cabinet, type: number, source: input, description: "Design density used to derive the row density ceiling", constraints: "> 0" }
      - { name: max_row_power_kw, type: number, source: input, description: "Hard busway limit for the row", constraints: "> 0" }
      - { name: cooling_capacity_kw, type: number, source: input, description: "Sensible cooling capacity serving the row", constraints: "> 0" }
      - { name: escort_slot_count, type: integer, source: input, default: 1, description: "Concurrent escorted visits the row can host", constraints: ">= 0" }
      - { name: decommission_flag, type: boolean, source: input, default: false, description: "Operator flag retiring the row from new space allocation" }
      - { name: occupied_slot_count, type: integer, source: computed, default: 0, description: "Count of Cabinet in this row with status IN {RESERVED, CAPACITY_HELD, INSTALLED, ACTIVE, DECOMMISSIONING}" }
      - { name: energized_cabinet_count, type: integer, source: computed, default: 0, description: "Count of Cabinet in this row with status == ACTIVE" }
      - { name: allocated_power_kw, type: number, source: computed, default: 0, description: "Sum of PowerCircuit.allocated_kw over circuits with status == ENERGIZED on this row's cabinets, 3 decimals" }
      - { name: cooling_load_kw, type: number, source: computed, default: 0, description: "Sum of PowerCircuit.cooling_contribution_kw over circuits with status == ENERGIZED on this row's cabinets, 3 decimals" }
      - { name: density_ceiling_kw, type: number, source: computed, default: 0, description: "design_density_kw_per_cabinet * occupied_slot_count, 3 decimals" }
      - { name: effective_ceiling_kw, type: number, source: computed, default: 0, description: "min(max_row_power_kw, density_ceiling_kw, cooling_capacity_kw), 3 decimals" }
      - { name: measured_peak_kw, type: number, source: computed, default: 0, description: "max over PowerCircuit.meter_intervals[].peak_kw whose interval_start >= clock_now - 30 days, for circuits on this row's cabinets; 0 when the window holds no interval" }
      - { name: stranded_nameplate_kw, type: number, source: computed, default: 0, description: "round(effective_ceiling_kw - allocated_power_kw, 3) — nameplate view of stranded capacity" }
      - { name: stranded_measured_kw, type: number, source: computed, default: 0, description: "round(effective_ceiling_kw - measured_peak_kw, 3) — measured view of stranded capacity" }
      - { name: row_status, type: enum, source: computed, default: OPEN, description: "OPEN | DENSITY_CAPPED | COOLING_CONSTRAINED | DECOMMISSIONING — derived, gates new space allocation", constraints: "OPEN | DENSITY_CAPPED | COOLING_CONSTRAINED | DECOMMISSIONING" }

  - name: Cabinet
    parent: null
    common_fields: true
    fields:
      - { name: row_id, type: string, source: input, description: "FK -> FloorRow.id; row hosting this cabinet" }
      - { name: contract_id, type: string, source: system, default: null, description: "FK -> Contract.id; set when reserved, cleared when the reservation is released" }
      - { name: cabinet_code, type: string, source: input, description: "Cabinet label", constraints: "unique per row_id" }
      - { name: footprint_type, type: enum, source: input, default: CABINET, description: "CABINET | CAGE_SLOT | MEET_ME — MEET_ME cabinets are carrier meet-me panels and always require an escort", constraints: "CABINET | CAGE_SLOT | MEET_ME" }
      - { name: rated_power_kw, type: number, source: input, description: "Nameplate power rating of the cabinet", constraints: "> 0" }
      - { name: u_height, type: integer, source: input, default: 42, description: "Rack units available" }
      - { name: status, type: enum, source: system, default: AVAILABLE, description: "AVAILABLE | RESERVED | CAPACITY_HELD | INSTALLED | ACTIVE | DECOMMISSIONING | RELEASED", constraints: "AVAILABLE | RESERVED | CAPACITY_HELD | INSTALLED | ACTIVE | DECOMMISSIONING | RELEASED" }
      - { name: allocated_power_kw, type: number, source: computed, default: 0, description: "Sum of PowerCircuit.allocated_kw over this cabinet's ENERGIZED circuits, 3 decimals" }
      - { name: cooling_load_kw, type: number, source: computed, default: 0, description: "Sum of PowerCircuit.cooling_contribution_kw over this cabinet's ENERGIZED circuits, 3 decimals" }
      - { name: energized_primary_circuit_count, type: integer, source: computed, default: 0, description: "Count of this cabinet's circuits with status == ENERGIZED and redundancy_role == PRIMARY" }

  - name: PowerCircuit
    parent: null
    common_fields: true
    fields:
      - { name: cabinet_id, type: string, source: input, description: "FK -> Cabinet.id; cabinet fed by this circuit" }
      - { name: circuit_code, type: string, source: input, description: "Circuit label", constraints: "unique per cabinet_id" }
      - { name: feed_side, type: enum, source: input, description: "A | B — busway side supplying the circuit", constraints: "A | B" }
      - { name: redundancy_role, type: enum, source: input, description: "PRIMARY (carries load, allocates power) | REDUNDANT (standby, allocates 0 kW)", constraints: "PRIMARY | REDUNDANT" }
      - { name: breaker_amps, type: integer, source: input, description: "Breaker rating in amperes", constraints: "> 0" }
      - { name: volts, type: integer, source: input, description: "Nominal supply voltage", constraints: "> 0" }
      - { name: phase, type: enum, source: input, description: "SINGLE | THREE — selects the phase factor", constraints: "SINGLE | THREE" }
      - { name: derated_kw, type: number, source: computed, default: 0, description: "round(breaker_amps * volts * phase_factor / 1000 * NEC_DERATE_FACTOR, 3); set at creation from the breaker plate" }
      - { name: allocated_kw, type: number, source: computed, default: 0, description: "Billable/allocated power once ENERGIZED; 0.000 while not ENERGIZED and 0.000 for REDUNDANT circuits" }
      - { name: cooling_contribution_kw, type: number, source: computed, default: 0, description: "Heat load contributed once ENERGIZED; derated_kw for PRIMARY, round(derated_kw * REDUNDANT_COOLING_FACTOR, 3) for REDUNDANT; 0.000 while not ENERGIZED" }
      - { name: status, type: enum, source: system, default: DESIGNED, description: "DESIGNED | APPROVED | BLOCKED | ENERGIZED | DE_ENERGIZED | REMOVED", constraints: "DESIGNED | APPROVED | BLOCKED | ENERGIZED | DE_ENERGIZED | REMOVED" }
      - { name: energized_at, type: datetime, source: system, default: null, description: "Logical clock value when the circuit last entered ENERGIZED" }
      - { name: meter_intervals, type: array, source: system, default: [], description: "Append-only meter intervals: [{interval_start, interval_end, kwh, peak_kw}] ordered by append sequence" }

  - name: PatchPanelPort
    parent: null
    common_fields: true
    fields:
      - { name: row_id, type: string, source: input, description: "FK -> FloorRow.id; row whose patch field holds this port" }
      - { name: panel_code, type: string, source: input, description: "Patch panel label used in path routing hops" }
      - { name: port_number, type: integer, source: input, description: "Port position on the panel", constraints: "unique per (row_id, panel_code); >= 1" }
      - { name: media_type, type: enum, source: input, description: "SMF | MMF | CAT6A | COAX — must match the cross-connect cable_type", constraints: "SMF | MMF | CAT6A | COAX" }
      - { name: status, type: enum, source: system, default: FREE, description: "FREE | RESERVED | ASSIGNED | QUARANTINED", constraints: "FREE | RESERVED | ASSIGNED | QUARANTINED" }
      - { name: assigned_order_id, type: string, source: system, default: null, description: "FK -> CrossConnectOrder.id; order currently holding the port (RESERVED or ASSIGNED)" }
      - { name: quarantine_until, type: datetime, source: system, default: null, description: "Logical clock instant until which a reclaimed port may not be re-reserved" }

  - name: CrossConnectOrder
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id; billing contract for the cross-connect" }
      - { name: requested_by_contact_id, type: string, source: input, description: "FK -> AuthorizedContact.id; contact who raised the order" }
      - { name: a_end_cabinet_id, type: string, source: input, description: "FK -> Cabinet.id; customer-side cabinet, must belong to contract_id" }
      - { name: z_end_cabinet_id, type: string, source: input, description: "FK -> Cabinet.id; far-side cabinet or meet-me panel" }
      - { name: parent_order_id, type: string, source: input, default: null, description: "FK -> CrossConnectOrder.id; order this one re-issues after a decommission or abort" }
      - { name: cable_type, type: enum, source: input, description: "SMF | MMF | CAT6A | COAX", constraints: "SMF | MMF | CAT6A | COAX" }
      - { name: a_end_port_id, type: string, source: system, default: null, description: "FK -> PatchPanelPort.id; A-side port pinned by the current route proposal" }
      - { name: z_end_port_id, type: string, source: system, default: null, description: "FK -> PatchPanelPort.id; Z-side port pinned by the current route proposal" }
      - { name: path_hops, type: array, source: system, default: [], description: "Ordered panel_code strings describing the routed path, A-side panel first and Z-side panel last" }
      - { name: revision_count, type: integer, source: system, default: 0, description: "Number of completed change-request cycles on this order" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | ROUTE_PROPOSED | CHANGES_REQUESTED | APPROVED | INSTALLED | ACTIVE | DECOMMISSIONED | ABORTED", constraints: "SUBMITTED | ROUTE_PROPOSED | CHANGES_REQUESTED | APPROVED | INSTALLED | ACTIVE | DECOMMISSIONED | ABORTED" }
      - { name: mrc_usd, type: number, source: computed, default: 0, description: "CC_MEDIA_MRC_USD[cable_type], 2 decimals; pinned at creation from cable_type" }
      - { name: proposed_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the engineer who last proposed the route" }
      - { name: approved_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the manager who approved the current route" }
      - { name: activated_at, type: datetime, source: system, default: null, description: "Logical clock value when the order entered ACTIVE" }

  - name: AuthorizedContact
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; customer whose authorization list holds this contact" }
      - { name: full_name, type: string, source: input, description: "Contact name" }
      - { name: access_level, type: enum, source: input, default: ESCORTED_ONLY, description: "ESCORTED_ONLY | UNESCORTED", constraints: "ESCORTED_ONLY | UNESCORTED" }
      - { name: authorization_scopes, type: array, source: input, description: "Subset of {REMOTE_HANDS, SITE_ACCESS}; REMOTE_HANDS permits raising/authorizing tickets, SITE_ACCESS permits visits", constraints: "non-empty subset of {REMOTE_HANDS, SITE_ACCESS}" }
      - { name: biometric_state, type: enum, source: system, default: NOT_ENROLLED, description: "NOT_ENROLLED | ENROLLED | REVOKED", constraints: "NOT_ENROLLED | ENROLLED | REVOKED" }
      - { name: enrolled_at, type: datetime, source: system, default: null, description: "Logical clock value when biometric_state last became ENROLLED" }

  - name: AccessVisit
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id; contract under which the visit is booked" }
      - { name: contact_id, type: string, source: input, description: "FK -> AuthorizedContact.id; visitor" }
      - { name: cabinet_id, type: string, source: input, description: "FK -> Cabinet.id; cabinet the visitor will work in" }
      - { name: purpose, type: enum, source: input, description: "MAINTENANCE | CARRIER_INSTALL | AUDIT | REMOTE_HANDS_ESCORT", constraints: "MAINTENANCE | CARRIER_INSTALL | AUDIT | REMOTE_HANDS_ESCORT" }
      - { name: window_start, type: datetime, source: input, description: "Half-open window start (inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "Half-open window end (exclusive)", constraints: "> window_start" }
      - { name: escort_required, type: boolean, source: computed, description: "TRUE when contact.access_level == ESCORTED_ONLY OR purpose == CARRIER_INSTALL OR cabinet.footprint_type == MEET_ME; pinned at creation" }
      - { name: escort_officer_user_id, type: string, source: system, default: null, description: "X-User-ID of the SecurityOfficer escorting the visit, recorded at check-in" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | CHECKED_IN | CHECKED_OUT | CANCELLED", constraints: "SCHEDULED | CHECKED_IN | CHECKED_OUT | CANCELLED" }
      - { name: checked_in_at, type: datetime, source: system, default: null, description: "Logical clock value at check-in" }
      - { name: checked_out_at, type: datetime, source: system, default: null, description: "Logical clock value at check-out" }

  - name: RemoteHandsTicket
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id; billing contract" }
      - { name: requested_by_contact_id, type: string, source: input, description: "FK -> AuthorizedContact.id; requesting contact, must hold REMOTE_HANDS scope" }
      - { name: target_cabinet_id, type: string, source: input, description: "FK -> Cabinet.id; cabinet the work touches" }
      - { name: authorizing_contact_id, type: string, source: system, default: null, description: "FK -> AuthorizedContact.id; contact who authorized the ticket" }
      - { name: severity, type: enum, source: input, description: "CRITICAL | HIGH | STANDARD — selects RESPONSE_TARGET_MINUTES", constraints: "CRITICAL | HIGH | STANDARD" }
      - { name: description, type: string, source: input, description: "Work requested" }
      - { name: authorization_state, type: enum, source: system, default: PENDING_AUTHORIZATION, description: "PENDING_AUTHORIZATION | AUTHORIZED | DENIED | REVOKED — first state dimension", constraints: "PENDING_AUTHORIZATION | AUTHORIZED | DENIED | REVOKED" }
      - { name: execution_state, type: enum, source: system, default: QUEUED, description: "QUEUED | DISPATCHED | IN_PROGRESS | COMPLETED | CANCELLED — second, independent state dimension", constraints: "QUEUED | DISPATCHED | IN_PROGRESS | COMPLETED | CANCELLED" }
      - { name: authorized_at, type: datetime, source: system, default: null, description: "Logical clock value when authorization_state became AUTHORIZED" }
      - { name: response_deadline_at, type: datetime, source: computed, default: null, description: "authorized_at + RESPONSE_TARGET_MINUTES[severity]" }
      - { name: dispatched_at, type: datetime, source: system, default: null, description: "Logical clock value when execution_state became DISPATCHED" }
      - { name: completed_at, type: datetime, source: system, default: null, description: "Logical clock value when execution_state became COMPLETED" }
      - { name: sla_breached, type: boolean, source: computed, default: false, description: "TRUE when dispatched_at > response_deadline_at (strict); equality is met, not breached" }
      - { name: work_segments, type: array, source: system, default: [], description: "Recorded labour segments [{started_at, ended_at}] as supplied at completion, retained in request order" }
      - { name: billable_increments, type: integer, source: computed, default: 0, description: "Sum over segments of ceil(segment raw whole minutes / BILLING_INCREMENT_MINUTES); a 0-minute segment contributes 0" }
      - { name: billed_minutes, type: integer, source: computed, default: 0, description: "billable_increments * BILLING_INCREMENT_MINUTES" }
      - { name: included_increments_applied, type: integer, source: computed, default: 0, description: "Increments absorbed by the contract's bundled minutes at completion" }
      - { name: labor_charge_usd, type: number, source: computed, default: 0, description: "Sum of per-segment rounded charges, 2 decimals (see remote_hands_labor_charge)" }

  - name: DecommissionOrder
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id; contract being wound down" }
      - { name: cabinet_id, type: string, source: input, description: "FK -> Cabinet.id; cabinet to be emptied and released" }
      - { name: requested_by_contact_id, type: string, source: input, description: "FK -> AuthorizedContact.id; contact who raised the decommission" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "REQUESTED | APPROVED | IN_PROGRESS | READY_FOR_RELEASE | CLOSED | CANCELLED", constraints: "REQUESTED | APPROVED | IN_PROGRESS | READY_FOR_RELEASE | CLOSED | CANCELLED" }
      - { name: equipment_removed_at, type: datetime, source: system, default: null, description: "Logical clock value when EQUIPMENT_REMOVAL was recorded" }
      - { name: equipment_removed_by_user_id, type: string, source: system, default: null, description: "X-User-ID that recorded EQUIPMENT_REMOVAL" }
      - { name: cables_reclaimed_at, type: datetime, source: system, default: null, description: "Logical clock value when CABLE_RECLAMATION was recorded" }
      - { name: cables_reclaimed_by_user_id, type: string, source: system, default: null, description: "X-User-ID that recorded CABLE_RECLAMATION" }
      - { name: released_port_count, type: integer, source: computed, default: 0, description: "Ports moved out of ASSIGNED by the release step" }
      - { name: released_power_kw, type: number, source: computed, default: 0, description: "Sum of allocated_kw de-energized by the approval step, 3 decimals" }

  - name: InvoiceLine
    parent: null
    common_fields: false
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id; billed contract" }
      - { name: line_type, type: enum, source: system, description: "POWER_COMMIT | POWER_OVERAGE | CROSS_CONNECT_MRC | CROSS_CONNECT_SURCHARGE | CROSS_CONNECT_CREDIT | REMOTE_HANDS | SLA_CREDIT | REVERSAL", constraints: "POWER_COMMIT | POWER_OVERAGE | CROSS_CONNECT_MRC | CROSS_CONNECT_SURCHARGE | CROSS_CONNECT_CREDIT | REMOTE_HANDS | SLA_CREDIT | REVERSAL" }
      - { name: amount_usd, type: number, source: computed, description: "Signed amount, 2 decimals; credits and reversals are negative" }
      - { name: quantity, type: number, source: computed, default: 0, description: "Billed quantity (kW, kWh, increments or cross-connect count) for the line" }
      - { name: unit_rate_usd, type: number, source: computed, default: 0, description: "Rate applied to quantity, 4 decimals" }
      - { name: period_start, type: datetime, source: computed, default: null, description: "Inclusive period start for period lines, null for event lines" }
      - { name: period_end, type: datetime, source: computed, default: null, description: "Exclusive period end for period lines, null for event lines" }
      - { name: source_ref_id, type: string, source: computed, default: null, description: "Polymorphic reference (not a declared FK): CrossConnectOrder.id, RemoteHandsTicket.id or the reversed InvoiceLine.id — resolved by line_type, never used in any ordering or selection decision" }
      - { name: included_minutes_consumed, type: integer, source: computed, default: 0, description: "Bundled remote-hands minutes consumed by this line; restored to the contract when the line is reversed" }
      - { name: reversed, type: boolean, source: computed, default: false, description: "TRUE once a REVERSAL line has been issued against this line" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Contract
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: PENDING_ACTIVATION
        trigger: "POST /colocation/contracts/{contract_id}/state {to_state: PENDING_ACTIVATION}"
        actor: FacilityManager
        preconditions: ["contract.status == DRAFT", "term_end_date > term_start_date"]
        side_effects: ["remote_hands_remaining_minutes initialised to remote_hands_included_minutes", "increments Contract.version by 1"]
      - from: PENDING_ACTIVATION
        to: ACTIVE
        trigger: "POST /colocation/contracts/{contract_id}/state {to_state: ACTIVE}"
        actor: FacilityManager
        preconditions: ["contract.status == PENDING_ACTIVATION", "at least one Cabinet with contract_id == this contract has status IN {RESERVED, CAPACITY_HELD, INSTALLED, ACTIVE} else ERR_NO_CABINET_ASSIGNED"]
        side_effects: ["increments Contract.version by 1"]
        note: "Cross-entity guard: Contract activation depends on Cabinet state (pair Contract→Cabinet)."
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /colocation/contracts/{contract_id}/state {to_state: SUSPENDED}"
        actor: BillingOperator
        preconditions: ["contract.status == ACTIVE"]
        side_effects: ["increments Contract.version by 1", "no cascade to cabinets or circuits — energized load keeps billing"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /colocation/contracts/{contract_id}/state {to_state: ACTIVE}"
        actor: BillingOperator
        preconditions: ["contract.status == SUSPENDED", "contract.credit_hold == false else ERR_CREDIT_HOLD_ACTIVE"]
        side_effects: ["increments Contract.version by 1"]
        note: "Reinstatement cycle SUSPENDED→ACTIVE→SUSPENDED is unbounded."
      - from: ACTIVE
        to: WIND_DOWN
        trigger: "POST /colocation/contracts/{contract_id}/state {to_state: WIND_DOWN}"
        actor: FacilityManager
        preconditions: ["contract.status == ACTIVE"]
        side_effects: ["blocks creation of new CrossConnectOrder and RemoteHandsTicket", "increments Contract.version by 1"]
      - from: WIND_DOWN
        to: TERMINATED
        trigger: "POST /colocation/contracts/{contract_id}/state {to_state: TERMINATED}"
        actor: FacilityManager
        preconditions: ["contract.status == WIND_DOWN", "no Cabinet with contract_id == this contract has status IN {RESERVED, CAPACITY_HELD, INSTALLED, ACTIVE, DECOMMISSIONING} else ERR_INVALID_STATE", "active_cross_connect_count == 0 else ERR_INVALID_STATE"]
        side_effects: ["increments Contract.version by 1"]

  - entity: Cabinet
    initial_state: AVAILABLE
    terminal_states: [RELEASED]
    transitions:
      - from: AVAILABLE
        to: RESERVED
        trigger: "POST /colocation/cabinets/{cabinet_id}/state {to_state: RESERVED, contract_id}"
        actor: FacilityManager
        preconditions: ["cabinet.status == AVAILABLE", "contract.status IN {PENDING_ACTIVATION, ACTIVE} else ERR_CONTRACT_NOT_ACTIVE", "row.row_status IN {OPEN, COOLING_CONSTRAINED} else ERR_ROW_NOT_ACCEPTING_SPACE", "count of Cabinet with this contract_id and status IN {RESERVED, CAPACITY_HELD, INSTALLED, ACTIVE} < contract.committed_cabinet_count else ERR_CABINET_COMMIT_EXCEEDED"]
        side_effects: ["cabinet.contract_id set", "FloorRow.occupied_slot_count += 1 → FloorRow.density_ceiling_kw, effective_ceiling_kw, stranded_* and row_status recomputed", "increments Cabinet.version and FloorRow.version by 1"]
      - from: RESERVED
        to: AVAILABLE
        trigger: "POST /colocation/cabinets/{cabinet_id}/state {to_state: AVAILABLE}"
        actor: FacilityManager
        preconditions: ["cabinet.status == RESERVED", "no PowerCircuit on this cabinet has status IN {APPROVED, ENERGIZED} else ERR_INVALID_STATE"]
        side_effects: ["cabinet.contract_id cleared to null", "FloorRow.occupied_slot_count -= 1 → density_ceiling_kw, effective_ceiling_kw, stranded_* and row_status recomputed", "increments Cabinet.version and FloorRow.version by 1"]
      - from: RESERVED
        to: INSTALLED
        trigger: "POST /colocation/cabinets/{cabinet_id}/state {to_state: INSTALLED}"
        actor: FacilityManager
        preconditions: ["cabinet.status == RESERVED", "contract.status == ACTIVE else ERR_CONTRACT_NOT_ACTIVE"]
        side_effects: ["increments Cabinet.version by 1"]
      - from: RESERVED
        to: CAPACITY_HELD
        trigger: "system: FloorRow.row_status became DENSITY_CAPPED (cascade hop 4 of circuit_energize_cascade)"
        actor: system
        preconditions: ["cabinet.status == RESERVED at the moment the row posture flips"]
        side_effects: ["every PowerCircuit on this cabinet with status == DESIGNED transitions to BLOCKED (cascade hop 5)", "increments Cabinet.version by 1", "cabinet stays inside occupied_slot_count so density_ceiling_kw does not move"]
      - from: CAPACITY_HELD
        to: RESERVED
        trigger: "system: FloorRow.row_status returned to OPEN (cascade of de-energize / reservation release / PATCH row capacity increase)"
        actor: system
        preconditions: ["cabinet.status == CAPACITY_HELD at the moment the row posture returns to OPEN"]
        side_effects: ["every PowerCircuit on this cabinet with status == BLOCKED returns to DESIGNED", "increments Cabinet.version by 1"]
      - from: INSTALLED
        to: ACTIVE
        trigger: "system: first PRIMARY circuit on the cabinet reached ENERGIZED (cascade hop 2 of circuit_energize_cascade)"
        actor: system
        preconditions: ["cabinet.status == INSTALLED", "cabinet.energized_primary_circuit_count transitioned from 0 to 1"]
        side_effects: ["FloorRow.energized_cabinet_count += 1 → FloorRow.allocated_power_kw, cooling_load_kw, stranded_* and row_status recomputed (cascade hop 3)", "increments Cabinet.version by 1"]
      - from: ACTIVE
        to: INSTALLED
        trigger: "system: last PRIMARY circuit on the cabinet left ENERGIZED (de-energize compensation)"
        actor: system
        preconditions: ["cabinet.status == ACTIVE", "cabinet.energized_primary_circuit_count transitioned from 1 to 0"]
        side_effects: ["FloorRow.energized_cabinet_count -= 1 → FloorRow.allocated_power_kw, cooling_load_kw, stranded_* and row_status recomputed", "increments Cabinet.version by 1"]
      - from: ACTIVE
        to: DECOMMISSIONING
        trigger: "POST /colocation/decommission-orders/{order_id}/state {to_state: APPROVED}"
        actor: system
        preconditions: ["cabinet.status IN {INSTALLED, ACTIVE}"]
        side_effects: ["every ENERGIZED circuit on the cabinet transitions to DE_ENERGIZED, zeroing allocated_kw and cooling_contribution_kw", "DecommissionOrder.released_power_kw set to the de-energized allocated_kw total", "FloorRow allocated_power_kw, cooling_load_kw, stranded_* and row_status recomputed", "increments Cabinet.version by 1"]
      - from: INSTALLED
        to: DECOMMISSIONING
        trigger: "POST /colocation/decommission-orders/{order_id}/state {to_state: APPROVED}"
        actor: system
        preconditions: ["cabinet.status == INSTALLED"]
        side_effects: ["DecommissionOrder.released_power_kw set to 0.000", "increments Cabinet.version by 1"]
      - from: DECOMMISSIONING
        to: RELEASED
        trigger: "POST /colocation/decommission-orders/{order_id}/release-ports"
        actor: system
        preconditions: ["cabinet.status == DECOMMISSIONING"]
        side_effects: ["every DE_ENERGIZED circuit on the cabinet transitions to REMOVED", "cabinet.contract_id cleared to null", "FloorRow.occupied_slot_count -= 1 → density_ceiling_kw, effective_ceiling_kw, stranded_* and row_status recomputed", "increments Cabinet.version and FloorRow.version by 1"]

  - entity: PowerCircuit
    initial_state: DESIGNED
    terminal_states: [REMOVED]
    transitions:
      - from: DESIGNED
        to: APPROVED
        trigger: "POST /colocation/power-circuits/{circuit_id}/state {to_state: APPROVED}"
        actor: FacilityManager
        preconditions: ["circuit.status == DESIGNED", "cabinet.status IN {RESERVED, INSTALLED, ACTIVE} else ERR_CABINET_NOT_OPERATIONAL", "breaker_headroom check: sum of derated_kw over this cabinet's PRIMARY circuits with status IN {APPROVED, ENERGIZED} plus this circuit's derated_kw (0 when REDUNDANT) <= cabinet.rated_power_kw * BREAKER_HEADROOM_RATIO else ERR_CABINET_BREAKER_OVERSUBSCRIBED"]
        side_effects: ["increments PowerCircuit.version by 1"]
      - from: DESIGNED
        to: BLOCKED
        trigger: "system: owning cabinet entered CAPACITY_HELD (cascade hop 5 of circuit_energize_cascade)"
        actor: system
        preconditions: ["circuit.status == DESIGNED"]
        side_effects: ["increments PowerCircuit.version by 1"]
      - from: BLOCKED
        to: DESIGNED
        trigger: "system: owning cabinet returned to RESERVED"
        actor: system
        preconditions: ["circuit.status == BLOCKED"]
        side_effects: ["increments PowerCircuit.version by 1"]
      - from: APPROVED
        to: ENERGIZED
        trigger: "POST /colocation/power-circuits/{circuit_id}/energize {expected_row_version}"
        actor: ProvisioningEngineer
        preconditions: ["circuit.status == APPROVED", "cabinet.status IN {INSTALLED, ACTIVE} else ERR_CABINET_NOT_OPERATIONAL", "row.decommission_flag == false else ERR_ROW_NOT_ACCEPTING_SPACE", "expected_row_version == row.version else ERR_STALE_ROW_VERSION", "TWO_N guard: when contract.redundancy_requirement == TWO_N and this circuit is PRIMARY, the cabinet must already hold a REDUNDANT circuit with feed_side != this circuit's feed_side and status IN {APPROVED, ENERGIZED} else ERR_REDUNDANT_FEED_MISSING", "projected row cooling_load_kw <= row.cooling_capacity_kw else ERR_COOLING_CAPACITY_EXCEEDED", "projected row allocated_power_kw <= row.density_ceiling_kw * DENSITY_TOLERANCE_RATIO else ERR_ROW_DENSITY_LIMIT_EXCEEDED", "projected row allocated_power_kw <= row.max_row_power_kw else ERR_ROW_POWER_LIMIT_EXCEEDED", "projected contract provisioned_power_kw <= contract.power_commit_kw * POWER_OVERPROVISION_CAP_RATIO else ERR_POWER_COMMIT_EXCEEDED"]
        side_effects: ["circuit.allocated_kw and cooling_contribution_kw set by circuit_allocated_kw (hop 1)", "energized_at set to the logical clock", "Cabinet.allocated_power_kw, cooling_load_kw and energized_primary_circuit_count recomputed; Cabinet INSTALLED→ACTIVE when the primary count went 0→1 (hop 2)", "FloorRow.energized_cabinet_count, allocated_power_kw, cooling_load_kw, measured_peak_kw, stranded_nameplate_kw, stranded_measured_kw and row_status recomputed (hop 3)", "when row_status flips to DENSITY_CAPPED, every RESERVED cabinet in the row becomes CAPACITY_HELD (hop 4) and every DESIGNED circuit on those cabinets becomes BLOCKED (hop 5); a flip to COOLING_CONSTRAINED holds nothing, matching §1.4 priority 19", "Contract.provisioned_power_kw, stranded_commit_kw and commit_utilization_pct recomputed", "increments PowerCircuit.version, Cabinet.version and FloorRow.version by 1"]
      - from: ENERGIZED
        to: DE_ENERGIZED
        trigger: "POST /colocation/power-circuits/{circuit_id}/state {to_state: DE_ENERGIZED}"
        actor: FacilityManager
        preconditions: ["circuit.status == ENERGIZED"]
        side_effects: ["circuit.allocated_kw and cooling_contribution_kw reset to 0.000 (compensation of the energize allocation)", "Cabinet.allocated_power_kw, cooling_load_kw, energized_primary_circuit_count recomputed; Cabinet ACTIVE→INSTALLED when the primary count went 1→0", "FloorRow.allocated_power_kw, cooling_load_kw, stranded_* and row_status recomputed; every CAPACITY_HELD cabinet returns to RESERVED and its BLOCKED circuits return to DESIGNED when row_status returns to OPEN", "Contract.provisioned_power_kw, stranded_commit_kw and commit_utilization_pct recomputed", "increments PowerCircuit.version, Cabinet.version and FloorRow.version by 1"]
      - from: DE_ENERGIZED
        to: ENERGIZED
        trigger: "POST /colocation/power-circuits/{circuit_id}/energize {expected_row_version}"
        actor: ProvisioningEngineer
        preconditions: ["circuit.status == DE_ENERGIZED", "same guards as APPROVED→ENERGIZED"]
        side_effects: ["identical to APPROVED→ENERGIZED"]
        note: "Re-energization loop: a circuit may be cycled DE_ENERGIZED→ENERGIZED any number of times while its cabinet is not DECOMMISSIONING."
      - from: DE_ENERGIZED
        to: REMOVED
        trigger: "POST /colocation/power-circuits/{circuit_id}/state {to_state: REMOVED} or system release-ports cascade"
        actor: FacilityManager
        preconditions: ["circuit.status == DE_ENERGIZED"]
        side_effects: ["increments PowerCircuit.version by 1"]

  - entity: CrossConnectOrder
    initial_state: SUBMITTED
    terminal_states: [DECOMMISSIONED, ABORTED]
    transitions:
      - from: SUBMITTED
        to: ROUTE_PROPOSED
        trigger: "POST /colocation/cross-connect-orders/{order_id}/propose-route {a_end_port_id, z_end_port_id, path_hops}"
        actor: ProvisioningEngineer
        preconditions: ["order.status IN {SUBMITTED, CHANGES_REQUESTED}", "neither port has status RESERVED or ASSIGNED (FREE and QUARANTINED both pass) else ERR_PORT_UNAVAILABLE", "neither port has quarantine_until > clock_now else ERR_PORT_IN_QUARANTINE", "both ports media_type == order.cable_type else ERR_MEDIA_TYPE_MISMATCH", "a_end_port.row_id == a_end_cabinet.row_id and z_end_port.row_id == z_end_cabinet.row_id else ERR_PORT_ROW_MISMATCH", "path_hops non-empty, first hop == a_end_port.panel_code, last hop == z_end_port.panel_code, no repeated hop else ERR_PATH_ROUTE_INVALID"]
        side_effects: ["both ports FREE→RESERVED with assigned_order_id set to this order", "a_end_port_id, z_end_port_id, path_hops and proposed_by_user_id pinned", "increments CrossConnectOrder.version by 1"]
      - from: ROUTE_PROPOSED
        to: CHANGES_REQUESTED
        trigger: "POST /colocation/cross-connect-orders/{order_id}/request-changes {reason}"
        actor: FacilityManager
        preconditions: ["order.status == ROUTE_PROPOSED", "order.revision_count < MAX_ROUTE_REVISIONS else ERR_REVISION_LIMIT_REACHED"]
        side_effects: ["revision_count += 1", "both currently RESERVED ports return to FREE with assigned_order_id cleared (port pool conserved)", "a_end_port_id, z_end_port_id and path_hops cleared to null/[]", "increments CrossConnectOrder.version by 1"]
      - from: CHANGES_REQUESTED
        to: ROUTE_PROPOSED
        trigger: "POST /colocation/cross-connect-orders/{order_id}/propose-route {a_end_port_id, z_end_port_id, path_hops}"
        actor: ProvisioningEngineer
        preconditions: ["order.status == CHANGES_REQUESTED", "same port/media/row/path guards as SUBMITTED→ROUTE_PROPOSED"]
        side_effects: ["identical to SUBMITTED→ROUTE_PROPOSED"]
        note: "Revision cycle: ROUTE_PROPOSED → CHANGES_REQUESTED → ROUTE_PROPOSED repeats until revision_count reaches MAX_ROUTE_REVISIONS."
      - from: ROUTE_PROPOSED
        to: APPROVED
        trigger: "POST /colocation/cross-connect-orders/{order_id}/state {to_state: APPROVED}"
        actor: FacilityManager
        preconditions: ["order.status == ROUTE_PROPOSED", "contract.status == ACTIVE else ERR_CONTRACT_NOT_ACTIVE", "contract.credit_hold == false else ERR_CREDIT_HOLD_ACTIVE", "both pinned ports still status == RESERVED with assigned_order_id == order.id else ERR_PORT_UNAVAILABLE"]
        side_effects: ["approved_by_user_id pinned to X-User-ID", "increments CrossConnectOrder.version by 1"]
        note: "Cross-entity guard: CrossConnectOrder approval depends on Contract state (pair CrossConnectOrder→Contract)."
      - from: APPROVED
        to: INSTALLED
        trigger: "POST /colocation/cross-connect-orders/{order_id}/state {to_state: INSTALLED}"
        actor: ProvisioningEngineer
        preconditions: ["order.status == APPROVED"]
        side_effects: ["both ports RESERVED→ASSIGNED", "increments CrossConnectOrder.version by 1"]
      - from: INSTALLED
        to: ACTIVE
        trigger: "POST /colocation/cross-connect-orders/{order_id}/state {to_state: ACTIVE}"
        actor: FacilityManager
        preconditions: ["order.status == INSTALLED", "contract.status == ACTIVE else ERR_CONTRACT_NOT_ACTIVE"]
        side_effects: ["activated_at set to the logical clock", "Contract.active_cross_connect_count += 1", "increments CrossConnectOrder.version and Contract.version by 1"]
      - from: ACTIVE
        to: DECOMMISSIONED
        trigger: "system: POST /colocation/decommission-orders/{order_id}/release-ports touched a cabinet on this order (cascade hop 2)"
        actor: system
        preconditions: ["order.status == ACTIVE", "order.a_end_cabinet_id == decommission order's cabinet_id"]
        side_effects: ["both ASSIGNED ports become QUARANTINED with quarantine_until = clock_now + PORT_QUARANTINE_HOURS and assigned_order_id cleared (cascade hop 3)", "Contract.active_cross_connect_count -= 1 and an InvoiceLine of line_type CROSS_CONNECT_CREDIT is appended, refreshing Contract.billed_total_usd and cross_connect_billed_usd (cascade hop 4)", "increments CrossConnectOrder.version and Contract.version by 1"]
      - from: ROUTE_PROPOSED
        to: ABORTED
        trigger: "POST /colocation/cross-connect-orders/{order_id}/state {to_state: ABORTED}"
        actor: FacilityManager
        preconditions: ["order.status IN {SUBMITTED, ROUTE_PROPOSED, CHANGES_REQUESTED, APPROVED}"]
        side_effects: ["every port with assigned_order_id == order.id and status IN {RESERVED, ASSIGNED} returns to FREE with assigned_order_id cleared", "increments CrossConnectOrder.version by 1"]
        note: "Same transition is available from SUBMITTED, CHANGES_REQUESTED and APPROVED; INSTALLED and ACTIVE orders must go through a DecommissionOrder."

  - entity: RemoteHandsTicket
    initial_state: "PENDING_AUTHORIZATION × QUEUED"
    terminal_states: ["authorization_state IN {DENIED, REVOKED}", "execution_state IN {COMPLETED, CANCELLED}"]
    transitions:
      - from: "authorization_state == PENDING_AUTHORIZATION"
        to: "authorization_state == AUTHORIZED"
        trigger: "POST /colocation/remote-hands-tickets/{ticket_id}/authorization {to_state: AUTHORIZED, authorizing_contact_id}"
        actor: CustomerAdmin
        preconditions: ["authorization_state == PENDING_AUTHORIZATION", "authorizing contact belongs to the contract's customer and holds REMOTE_HANDS scope else ERR_CONTACT_NOT_AUTHORIZED", "authorizing_contact_id != requested_by_contact_id else ERR_SELF_AUTHORIZATION_FORBIDDEN"]
        side_effects: ["authorized_at set to the logical clock", "response_deadline_at computed as authorized_at + RESPONSE_TARGET_MINUTES[severity]", "execution_state untouched (independent dimension)", "increments RemoteHandsTicket.version by 1"]
      - from: "authorization_state == PENDING_AUTHORIZATION"
        to: "authorization_state == DENIED"
        trigger: "POST /colocation/remote-hands-tickets/{ticket_id}/authorization {to_state: DENIED, authorizing_contact_id}"
        actor: CustomerAdmin
        preconditions: ["authorization_state == PENDING_AUTHORIZATION", "same contact guards as AUTHORIZED"]
        side_effects: ["execution_state QUEUED→CANCELLED", "increments RemoteHandsTicket.version by 1"]
      - from: "authorization_state == AUTHORIZED"
        to: "authorization_state == REVOKED"
        trigger: "POST /colocation/remote-hands-tickets/{ticket_id}/authorization {to_state: REVOKED, authorizing_contact_id}"
        actor: CustomerAdmin
        preconditions: ["authorization_state == AUTHORIZED", "execution_state != COMPLETED else ERR_INVALID_STATE"]
        side_effects: ["when execution_state IN {QUEUED, DISPATCHED, IN_PROGRESS} it is forced to CANCELLED (cross-dimension coupling)", "increments RemoteHandsTicket.version by 1"]
      - from: "execution_state == QUEUED"
        to: "execution_state == DISPATCHED"
        trigger: "POST /colocation/remote-hands-tickets/{ticket_id}/dispatch"
        actor: ProvisioningEngineer
        preconditions: ["execution_state == QUEUED", "authorization_state == AUTHORIZED else ERR_TICKET_NOT_AUTHORIZED", "target cabinet status IN {INSTALLED, ACTIVE} else ERR_CABINET_NOT_OPERATIONAL"]
        side_effects: ["dispatched_at set to the logical clock", "sla_breached set TRUE when dispatched_at > response_deadline_at (strict)", "execution_state advances to IN_PROGRESS in the same call is NOT performed — DISPATCHED is observable", "increments RemoteHandsTicket.version by 1"]
        note: "Cross-entity guard: dispatch depends on Cabinet state (pair RemoteHandsTicket→Cabinet)."
      - from: "execution_state == DISPATCHED"
        to: "execution_state == COMPLETED"
        trigger: "POST /colocation/remote-hands-tickets/{ticket_id}/complete {work_segments}"
        actor: ProvisioningEngineer
        preconditions: ["execution_state == DISPATCHED", "authorization_state == AUTHORIZED else ERR_TICKET_NOT_AUTHORIZED", "work_segments non-empty else ERR_INVALID_REQUEST", "every segment ended_at >= started_at else ERR_BILLING_PERIOD_INVALID"]
        side_effects: ["work_segments stored in request order", "billable_increments, billed_minutes, included_increments_applied and labor_charge_usd computed by remote_hands_labor_charge", "Contract.remote_hands_remaining_minutes decremented by included_increments_applied * BILLING_INCREMENT_MINUTES", "an InvoiceLine of line_type REMOTE_HANDS is appended when labor_charge_usd > 0, carrying included_minutes_consumed", "an additional InvoiceLine of line_type SLA_CREDIT is appended when sla_breached == true and labor_charge_usd > 0", "Contract.billed_total_usd refreshed", "completed_at set", "increments RemoteHandsTicket.version and Contract.version by 1"]

  - entity: AccessVisit
    initial_state: SCHEDULED
    terminal_states: [CHECKED_OUT, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CHECKED_IN
        trigger: "POST /colocation/access-visits/{visit_id}/state {to_state: CHECKED_IN, escort_officer_user_id?}"
        actor: SecurityOfficer
        preconditions: ["visit.status == SCHEDULED", "contact.biometric_state == ENROLLED else ERR_BIOMETRIC_NOT_ENROLLED", "window_start <= clock_now < window_end else ERR_OUTSIDE_VISIT_WINDOW", "escort_required == false or escort_officer_user_id supplied else ERR_ESCORT_REQUIRED"]
        side_effects: ["checked_in_at set to the logical clock", "escort_officer_user_id recorded", "increments AccessVisit.version by 1"]
      - from: CHECKED_IN
        to: CHECKED_OUT
        trigger: "POST /colocation/access-visits/{visit_id}/state {to_state: CHECKED_OUT}"
        actor: SecurityOfficer
        preconditions: ["visit.status == CHECKED_IN"]
        side_effects: ["checked_out_at set to the logical clock", "the visit stops occupying its cabinet window and its row escort slot", "increments AccessVisit.version by 1"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /colocation/access-visits/{visit_id}/state {to_state: CANCELLED}"
        actor: SecurityOfficer
        preconditions: ["visit.status == SCHEDULED"]
        side_effects: ["the visit stops occupying its cabinet window and its row escort slot", "increments AccessVisit.version by 1"]

  - entity: DecommissionOrder
    initial_state: REQUESTED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /colocation/decommission-orders/{order_id}/state {to_state: APPROVED}"
        actor: FacilityManager
        preconditions: ["order.status == REQUESTED", "cabinet.status IN {INSTALLED, ACTIVE} else ERR_CABINET_NOT_OPERATIONAL", "cabinet.contract_id == order.contract_id else ERR_CABINET_NOT_ON_CONTRACT"]
        side_effects: ["cabinet INSTALLED|ACTIVE → DECOMMISSIONING", "every ENERGIZED circuit on the cabinet → DE_ENERGIZED with allocated_kw and cooling_contribution_kw zeroed", "released_power_kw recorded", "FloorRow allocated_power_kw, cooling_load_kw, stranded_* and row_status recomputed", "Contract.provisioned_power_kw, stranded_commit_kw, commit_utilization_pct recomputed", "increments DecommissionOrder.version, Cabinet.version and FloorRow.version by 1"]
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /colocation/decommission-orders/{order_id}/state {to_state: CANCELLED}"
        actor: FacilityManager
        preconditions: ["order.status == REQUESTED"]
        side_effects: ["no cascade; the cabinet keeps its current status", "increments DecommissionOrder.version by 1"]
      - from: APPROVED
        to: IN_PROGRESS
        trigger: "POST /colocation/decommission-orders/{order_id}/record-step {step_code}"
        actor: ProvisioningEngineer
        preconditions: ["order.status == APPROVED", "the submitted step_code has no recorded timestamp else ERR_DECOMMISSION_STEP_ALREADY_RECORDED"]
        side_effects: ["equipment_removed_at/by or cables_reclaimed_at/by recorded", "increments DecommissionOrder.version by 1"]
      - from: IN_PROGRESS
        to: READY_FOR_RELEASE
        trigger: "POST /colocation/decommission-orders/{order_id}/record-step {step_code} — auto-join once both steps carry timestamps"
        actor: ProvisioningEngineer
        preconditions: ["order.status == IN_PROGRESS", "the submitted step_code has no recorded timestamp else ERR_DECOMMISSION_STEP_ALREADY_RECORDED", "for step_code == CABLE_RECLAMATION the X-User-ID must differ from equipment_removed_by_user_id, and for step_code == EQUIPMENT_REMOVAL it must differ from cables_reclaimed_by_user_id, else ERR_SEGREGATION_OF_DUTIES"]
        side_effects: ["the second step's timestamp/user recorded", "status auto-advances to READY_FOR_RELEASE in the same request (fork-join)", "increments DecommissionOrder.version by 1"]
      - from: READY_FOR_RELEASE
        to: CLOSED
        trigger: "POST /colocation/decommission-orders/{order_id}/release-ports"
        actor: ProvisioningEngineer
        preconditions: ["order.status == READY_FOR_RELEASE"]
        side_effects: ["released_port_count set to the number of ports moved out of ASSIGNED (cascade hop 1)", "every ACTIVE CrossConnectOrder whose a_end_cabinet_id == order.cabinet_id → DECOMMISSIONED (cascade hop 2)", "each such order's ASSIGNED ports → QUARANTINED with quarantine_until = clock_now + PORT_QUARANTINE_HOURS (cascade hop 3)", "for each decommissioned order Contract.active_cross_connect_count -= 1 and a CROSS_CONNECT_CREDIT InvoiceLine is appended, refreshing Contract.billed_total_usd and cross_connect_billed_usd (cascade hop 4)", "cabinet DECOMMISSIONING → RELEASED, its DE_ENERGIZED circuits → REMOVED, contract_id cleared, FloorRow.occupied_slot_count decremented and row_status recomputed", "increments DecommissionOrder.version, Cabinet.version, FloorRow.version and Contract.version by 1"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's version — no other mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: cc-order-create-stale-contract
    parent_entity: Contract
    write_endpoint: "POST /colocation/cross-connect-orders"
    occ_field: "expected_contract_version"
    description: |
      Creating a CrossConnectOrder against a Contract whose version has advanced
      since the client last observed it is rejected. Cross-connect creation
      consumes the contract's cross_connect_cap headroom, so a writer holding a
      stale contract view cannot know how much headroom is left; the stale
      version check turns that into a deterministic rejection.
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412

  - rule_id: circuit-energize-stale-row
    parent_entity: FloorRow
    write_endpoint: "POST /colocation/power-circuits/{circuit_id}/energize"
    occ_field: "expected_row_version"
    description: |
      Energizing a circuit while carrying a stale FloorRow version is rejected.
      Energization consumes row density, busway and cooling headroom, and every
      accepted energization legitimately supersedes the previous view of the row;
      the stale version check rejects the writer whose headroom arithmetic was
      computed against a superseded row snapshot.
    error_id: ERR_STALE_ROW_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: circuit_allocated_kw
    trigger: "On POST /colocation/power-circuits (derated_kw only) and on every APPROVED|DE_ENERGIZED→ENERGIZED transition (allocated_kw + cooling_contribution_kw); zeroed on ENERGIZED→DE_ENERGIZED"
    algorithm: threshold
    formula: |
      phase_factor       = PHASE_FACTOR_SINGLE if phase == "SINGLE" else PHASE_FACTOR_THREE
      derated_kw         = round(breaker_amps * volts * phase_factor / 1000 * NEC_DERATE_FACTOR, 3)
      # every later step consumes the ROUNDED derated_kw, never the raw product
      if status != "ENERGIZED":
          allocated_kw = 0.000 ; cooling_contribution_kw = 0.000
      elif redundancy_role == "PRIMARY":
          allocated_kw            = min(derated_kw, cabinet.rated_power_kw)      # cabinet nameplate clamp
          cooling_contribution_kw = derated_kw                                    # heat is NOT clamped
      else:  # REDUNDANT standby feed
          allocated_kw            = 0.000
          cooling_contribution_kw = round(derated_kw * REDUNDANT_COOLING_FACTOR, 3)
    input_set: "One PowerCircuit row; cabinet.rated_power_kw of its Cabinet. Circuits in DESIGNED, APPROVED, BLOCKED, DE_ENERGIZED and REMOVED contribute 0.000 to both outputs."
    constants:
      NEC_DERATE_FACTOR: 0.80
      PHASE_FACTOR_SINGLE: 1.0
      PHASE_FACTOR_THREE: 1.732
      REDUNDANT_COOLING_FACTOR: 0.25
    precision: "3 decimal places, round_half_up; the clamp min() is applied AFTER rounding derated_kw"
    variants: []

  - name: row_capacity_and_posture
    trigger: "Recomputed on Cabinet reserve/release/install/capacity-hold/decommission/release, on every PowerCircuit ENERGIZED/DE_ENERGIZED transition, on POST /colocation/power-circuits/{circuit_id}/readings and on PATCH /colocation/rows/{row_id}"
    algorithm: aggregation
    formula: |
      occupied_slot_count  = count(Cabinet where row_id == row.id and status IN
                                   {RESERVED, CAPACITY_HELD, INSTALLED, ACTIVE, DECOMMISSIONING})
      allocated_power_kw   = round(sum(PowerCircuit.allocated_kw            where circuit.cabinet_id IN row's cabinets and circuit.status == "ENERGIZED"), 3)
      cooling_load_kw      = round(sum(PowerCircuit.cooling_contribution_kw where circuit.cabinet_id IN row's cabinets and circuit.status == "ENERGIZED"), 3)
      density_ceiling_kw   = round(design_density_kw_per_cabinet * occupied_slot_count, 3)
      effective_ceiling_kw = min(max_row_power_kw, density_ceiling_kw, cooling_capacity_kw)
      measured_peak_kw     = max over PowerCircuit.meter_intervals[].peak_kw for circuits on this row's
                             cabinets whose interval_start >= clock_now - 30 days  (0.000 when empty)
      # posture, evaluated in EXACTLY this order — the first matching branch wins
      if decommission_flag == true:                                     row_status = "DECOMMISSIONING"
      elif cooling_load_kw >= cooling_capacity_kw * COOLING_ALERT_RATIO: row_status = "COOLING_CONSTRAINED"
      elif occupied_slot_count > 0 and allocated_power_kw >= density_ceiling_kw: row_status = "DENSITY_CAPPED"
      else:                                                              row_status = "OPEN"
    input_set: "All Cabinets of the row (status filter above) and all their PowerCircuits; meter intervals only inside the trailing 30-day window measured from the logical clock."
    constants:
      COOLING_ALERT_RATIO: 0.90
      MEASURED_WINDOW_DAYS: 30
    precision: "3 decimal places, round_half_up; comparisons use >= exactly as written"
    variants:
      - name: nameplate_view
        when: "FloorRow.stranded_nameplate_kw — capacity planning against energized breaker plates"
        difference: "stranded = round(effective_ceiling_kw - allocated_power_kw, 3); consumes derated breaker capacity, so a lightly loaded cabinet still strands nothing"
      - name: measured_view
        when: "FloorRow.stranded_measured_kw — capacity planning against observed peak draw"
        difference: "stranded = round(effective_ceiling_kw - measured_peak_kw, 3); consumes the trailing-30-day peak from meter_intervals, so the same row reports MORE stranded capacity whenever measured peak is below allocated breaker capacity"

  - name: contract_power_billing
    trigger: "POST /colocation/contracts/{contract_id}/billing-close"
    algorithm: tiered_pricing
    formula: |
      committed_charge = round(power_commit_kw * POWER_COMMIT_RATE_USD_PER_KW_MONTH, 2)
      included_kwh     = round(power_commit_kw * COMMIT_HOURS_PER_MONTH, 3)
      # variant-selected billable quantity
      if billing_mode == "METERED_PLUS_COMMIT":
          billable_kwh = round(sum(interval.kwh for every PowerCircuit whose cabinet.contract_id == contract.id,
                                   over meter_intervals with period_start <= interval_start < period_end), 3)
      else:  # COMMITTED_ONLY
          billable_kwh = round(sum(circuit.allocated_kw for circuits with status == "ENERGIZED" and
                                   redundancy_role == "PRIMARY" on cabinets with contract_id == contract.id)
                               * COMMIT_HOURS_PER_MONTH * DEEMED_LOAD_FACTOR, 3)
      overage_kwh = max(round(billable_kwh - included_kwh, 3), 0)          # 0 when billable == included (>= boundary)
      # marginal tier ladder over overage_kwh, evaluated low tier first
      t1 = min(overage_kwh, OVERAGE_TIER_1_LIMIT_KWH)
      t2 = min(max(overage_kwh - OVERAGE_TIER_1_LIMIT_KWH, 0), OVERAGE_TIER_2_LIMIT_KWH - OVERAGE_TIER_1_LIMIT_KWH)
      t3 = max(overage_kwh - OVERAGE_TIER_2_LIMIT_KWH, 0)
      overage_charge = round(t1 * OVERAGE_TIER_1_RATE + t2 * OVERAGE_TIER_2_RATE + t3 * OVERAGE_TIER_3_RATE, 2)
      # lines appended, in this order
      1) InvoiceLine POWER_COMMIT   amount_usd = committed_charge, quantity = power_commit_kw
      2) InvoiceLine POWER_OVERAGE  amount_usd = overage_charge, quantity = overage_kwh — appended ONLY when overage_kwh > 0
    input_set: "Meter intervals of every circuit on the contract's cabinets, filtered half-open [period_start, period_end); for COMMITTED_ONLY the meter intervals are ignored entirely and the deemed load is derived from ENERGIZED PRIMARY allocations at close time."
    constants:
      POWER_COMMIT_RATE_USD_PER_KW_MONTH: 175.00
      COMMIT_HOURS_PER_MONTH: 730
      DEEMED_LOAD_FACTOR: 0.65
      OVERAGE_TIER_1_LIMIT_KWH: 500
      OVERAGE_TIER_2_LIMIT_KWH: 2000
      OVERAGE_TIER_1_RATE: 0.180
      OVERAGE_TIER_2_RATE: 0.155
      OVERAGE_TIER_3_RATE: 0.135
    precision: "kWh 3 decimals, USD 2 decimals, round_half_up; the tier ladder is summed then rounded once"
    variants:
      - name: metered_final
        when: "billing_mode == METERED_PLUS_COMMIT"
        difference: "billable_kwh comes from recorded meter intervals inside the half-open period; identical fixtures produce an overage line whenever metered consumption exceeds included_kwh"
      - name: deemed_capacity
        when: "billing_mode == COMMITTED_ONLY"
        difference: "billable_kwh is synthesised from ENERGIZED PRIMARY allocated_kw * 730 * 0.65 and the meter intervals are ignored, so the SAME recorded intervals yield a different (usually lower) overage than metered_final"

  - name: remote_hands_labor_charge
    trigger: "POST /colocation/remote-hands-tickets/{ticket_id}/complete"
    algorithm: waterfall_allocation
    formula: |
      # Step 1 — per segment, processed in ascending started_at (tie-break: ascending index in the
      #          submitted work_segments array). Rounding order is PINNED: ceil per segment, then sum.
      #          Summing raw minutes first and ceiling once is NOT the rule.
      for each segment s:
          raw_minutes_s = floor((s.ended_at - s.started_at) / 60 seconds)
          increments_s  = 0 if raw_minutes_s == 0 else ceil(raw_minutes_s / BILLING_INCREMENT_MINUTES)
          after_hours_s = (hour_utc(s.started_at) < AFTER_HOURS_START_EXCLUSIVE_HOUR) or
                          (hour_utc(s.started_at) >= AFTER_HOURS_EVENING_HOUR)
      # Step 2
      billable_increments = sum(increments_s)
      billed_minutes      = billable_increments * BILLING_INCREMENT_MINUTES
      # Step 3 — bundled-minute waterfall, consumed in the Step-1 order (earliest segment first)
      included_budget     = floor(contract.remote_hands_remaining_minutes / BILLING_INCREMENT_MINUTES)
      included_increments_applied = min(billable_increments, included_budget)
      consumed_s          = increments absorbed by segment s while walking segments in order
      # Step 4 — money, ROUNDED PER SEGMENT then summed (sum-then-round is NOT the rule)
      charge_s            = round((increments_s - consumed_s) * REMOTE_HANDS_RATE_USD_PER_INCREMENT
                                  * (AFTER_HOURS_MULTIPLIER if after_hours_s else 1.0), 2)
      labor_charge_usd    = sum(charge_s)
      # Step 5 — ledger effects
      contract.remote_hands_remaining_minutes -= included_increments_applied * BILLING_INCREMENT_MINUTES
      if labor_charge_usd > 0:
          InvoiceLine REMOTE_HANDS amount_usd = labor_charge_usd,
                      quantity = billable_increments - included_increments_applied,
                      included_minutes_consumed = included_increments_applied * BILLING_INCREMENT_MINUTES
          if sla_breached:
              InvoiceLine SLA_CREDIT amount_usd = -round(labor_charge_usd * SLA_BREACH_CREDIT_PCT, 2)
    input_set: "The ticket's submitted work_segments only; the contract's remote_hands_remaining_minutes at completion time. A 0-minute segment contributes 0 increments and never creates an InvoiceLine."
    constants:
      BILLING_INCREMENT_MINUTES: 15
      REMOTE_HANDS_RATE_USD_PER_INCREMENT: 62.50
      AFTER_HOURS_MULTIPLIER: 1.35
      AFTER_HOURS_START_EXCLUSIVE_HOUR: 8
      AFTER_HOURS_EVENING_HOUR: 20
      SLA_BREACH_CREDIT_PCT: 0.25
    precision: "USD 2 decimals, round_half_up, applied PER SEGMENT before summation"
    variants: []

  - name: cross_connect_period_billing
    trigger: "POST /colocation/contracts/{contract_id}/billing-close (runs after contract_power_billing)"
    algorithm: waterfall_allocation
    formula: |
      # Evaluation order is pinned 1..6. The volume tier is keyed on the STEP-3 subtotal
      # (post-allowance, pre-discount) — never on the pre-allowance sum and never on the
      # step-6 total. The surcharge is keyed on the STEP-5 discounted subtotal.
      1) candidates = CrossConnectOrder where contract_id == contract.id and status == "ACTIVE",
         ranked by mrc_usd ASC, tie-break created_at ASC
      2) waived    = first contract.cross_connect_allowance candidates (amount 0.00, not billed)
      3) subtotal  = round(sum(mrc_usd of the remaining candidates), 2)
      4) volume_discount_pct = CC_VOLUME_DISCOUNT_TIER_2_PCT if subtotal >= CC_VOLUME_TIER_2_MIN_USD
                          else CC_VOLUME_DISCOUNT_TIER_1_PCT if subtotal >= CC_VOLUME_TIER_1_MIN_USD
                          else 0.00
      5) discounted_subtotal = round(subtotal * (1 - volume_discount_pct), 2)
      6) surcharge = round(discounted_subtotal * INFRA_SURCHARGE_PCT, 2)
         total     = round(discounted_subtotal + surcharge, 2)
      # lines appended, in this order, only when discounted_subtotal > 0
      1) InvoiceLine CROSS_CONNECT_MRC        amount_usd = discounted_subtotal, quantity = count(billed candidates)
      2) InvoiceLine CROSS_CONNECT_SURCHARGE  amount_usd = surcharge, quantity = count(billed candidates)
      # decommission credit (fired by the release-ports cascade, not by billing close)
      credit = -round(order.mrc_usd * CC_DECOMMISSION_CREDIT_PCT, 2)  → InvoiceLine CROSS_CONNECT_CREDIT
    input_set: "Only CrossConnectOrder rows in status ACTIVE at close time; SUBMITTED, ROUTE_PROPOSED, CHANGES_REQUESTED, APPROVED, INSTALLED, DECOMMISSIONED and ABORTED orders are excluded."
    constants:
      CC_MEDIA_MRC_USD_SMF: 300.00
      CC_MEDIA_MRC_USD_MMF: 250.00
      CC_MEDIA_MRC_USD_CAT6A: 175.00
      CC_MEDIA_MRC_USD_COAX: 225.00
      CC_VOLUME_TIER_1_MIN_USD: 500.00
      CC_VOLUME_TIER_2_MIN_USD: 800.00
      CC_VOLUME_DISCOUNT_TIER_1_PCT: 0.05
      CC_VOLUME_DISCOUNT_TIER_2_PCT: 0.10
      INFRA_SURCHARGE_PCT: 0.20
      CC_DECOMMISSION_CREDIT_PCT: 0.50
    precision: "USD 2 decimals, round_half_up at every numbered step"
    variants: []

  - name: contract_provisioning_rollup
    trigger: "Recomputed on every PowerCircuit ENERGIZED/DE_ENERGIZED transition, on Cabinet reserve/release/decommission/release-ports, on cross-connect ACTIVE/DECOMMISSIONED transitions and on every InvoiceLine append"
    algorithm: aggregation
    formula: |
      provisioned_power_kw      = round(sum(circuit.allocated_kw where circuit.status == "ENERGIZED"
                                        and circuit.redundancy_role == "PRIMARY"
                                        and circuit.cabinet.contract_id == contract.id), 3)
      stranded_commit_kw        = round(max(power_commit_kw - provisioned_power_kw, 0), 3)
      commit_utilization_pct    = round(provisioned_power_kw / power_commit_kw * 100, 1)
      active_cross_connect_count= count(CrossConnectOrder where contract_id == contract.id and status == "ACTIVE")
      billed_total_usd          = round(sum(InvoiceLine.amount_usd where contract_id == contract.id), 2)
      cross_connect_billed_usd  = round(sum(InvoiceLine.amount_usd where contract_id == contract.id
                                        and line_type IN {CROSS_CONNECT_MRC, CROSS_CONNECT_SURCHARGE}), 2)
    input_set: "Cabinets whose contract_id equals the contract (any status), their ENERGIZED PRIMARY circuits, all ACTIVE cross-connects, and every InvoiceLine ever appended to the contract including credits and reversals."
    constants: {}
    precision: "kW 3 decimals, USD 2 decimals, percentage 1 decimal, round_half_up"
    variants: []

  - name: visit_escort_and_occupancy
    trigger: "POST /colocation/access-visits (escort_required pinned, both overlap gates evaluated) and POST /colocation/access-visits/{visit_id}/state {to_state: CHECKED_IN}"
    algorithm: interval_merge
    formula: |
      escort_required = (contact.access_level == "ESCORTED_ONLY")
                        or (purpose == "CARRIER_INSTALL")
                        or (cabinet.footprint_type == "MEET_ME")
      occupying = AccessVisit where status IN {SCHEDULED, CHECKED_IN}     # CHECKED_OUT and CANCELLED release
      # Gate A — cabinet exclusivity, HALF-OPEN [window_start, window_end):
      #          touching endpoints do NOT collide (12:00 end / 12:00 start is accepted)
      conflict_A = exists v in occupying with v.cabinet_id == new.cabinet_id
                   and new.window_start <  v.window_end
                   and v.window_start   <  new.window_end
      # Gate B — row escort capacity, CLOSED [window_start, window_end] aggregate:
      #          touching endpoints DO collide, and the test is a count against escort_slot_count
      if escort_required:
          row_peers = count(v in occupying where v.escort_required == true
                            and v.cabinet.row_id == new.cabinet.row_id
                            and new.window_start <= v.window_end
                            and v.window_start   <= new.window_end)
          conflict_B = row_peers >= row.escort_slot_count
    input_set: "Visits in status SCHEDULED or CHECKED_IN only. Gate A is evaluated over the same cabinet_id; Gate B over every cabinet in the same row_id, counting only escort_required visits (the candidate itself excluded)."
    constants: {}
    precision: "Timestamp comparison at second resolution; no rounding"
    variants: []

  - name: remote_hands_response_deadline
    trigger: "On authorization_state → AUTHORIZED (deadline) and on execution_state → DISPATCHED (breach evaluation)"
    algorithm: threshold
    formula: |
      response_deadline_at = authorized_at + RESPONSE_TARGET_MINUTES[severity] minutes
      sla_breached         = dispatched_at > response_deadline_at        # strict: equality is MET
      # breach credit is issued at completion by remote_hands_labor_charge Step 5
    input_set: "Single ticket; authorized_at and dispatched_at are logical-clock values."
    constants:
      RESPONSE_TARGET_MINUTES_CRITICAL: 30
      RESPONSE_TARGET_MINUTES_HIGH: 120
      RESPONSE_TARGET_MINUTES_STANDARD: 480
    precision: "Whole minutes, second-resolution comparison"
    variants: []
  - name: provisioning_gate_thresholds
    trigger: "Evaluated by the §1.4 gates on POST /colocation/power-circuits/{circuit_id}/energize, POST /colocation/cross-connect-orders/{order_id}/propose-route and POST /colocation/cross-connect-orders/{order_id}/request-changes; also sets PatchPanelPort.quarantine_until on POST /colocation/decommission-orders/{order_id}/release-ports"
    algorithm: threshold
    formula: |
      # projected values include the circuit being energized
      breaker_ceiling_kw        = round(cabinet.rated_power_kw * BREAKER_HEADROOM_RATIO, 3)
      density_reject_ceiling_kw = round(row.density_ceiling_kw * DENSITY_TOLERANCE_RATIO, 3)
      power_commit_ceiling_kw   = round(contract.power_commit_kw * POWER_OVERPROVISION_CAP_RATIO, 3)
      # every gate permits equality; only a strictly greater projection is rejected
      quarantine_until          = clock_now + PORT_QUARANTINE_HOURS hours
      revision_allowed          = order.revision_count < MAX_ROUTE_REVISIONS
    input_set: "The cabinet, its row and its contract at gate-evaluation time; the port at reclamation time; the order at change-request time."
    constants:
      BREAKER_HEADROOM_RATIO: 1.25
      DENSITY_TOLERANCE_RATIO: 1.10
      POWER_OVERPROVISION_CAP_RATIO: 1.10
      PORT_QUARANTINE_HOURS: 24
      MAX_ROUTE_REVISIONS: 2
    precision: "3 decimal places, round_half_up; comparisons are <= (equality passes)"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table — evaluated in ascending priority; the FIRST
# violated rule determines the returned error_id and http_status. Lower
# priority number == checked earlier == wins any conflict.
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-Role header present and names a role declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
    description: "Missing, empty or unknown X-Role is rejected before any body parsing, path lookup or version check."

  - priority: 2
    category: auth
    check: "X-Role is listed in the endpoint's authorized_roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
    description: "Role recognised but not permitted for this operation. Checked before existence, so an unauthorized caller cannot probe which ids exist."

  - priority: 3
    category: existence
    check: "Every id in the URL path resolves to a stored row"
    error_id: ERR_CONTRACT_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path id"
    description: "Per-entity code is used: ERR_CUSTOMER_NOT_FOUND, ERR_CONTRACT_NOT_FOUND, ERR_ROW_NOT_FOUND, ERR_CABINET_NOT_FOUND, ERR_CIRCUIT_NOT_FOUND, ERR_PORT_NOT_FOUND, ERR_CROSS_CONNECT_ORDER_NOT_FOUND, ERR_TICKET_NOT_FOUND, ERR_CONTACT_NOT_FOUND, ERR_VISIT_NOT_FOUND, ERR_DECOMMISSION_ORDER_NOT_FOUND, ERR_INVOICE_LINE_NOT_FOUND."

  - priority: 4
    category: existence
    check: "Every foreign key supplied in the request body resolves to a stored row"
    error_id: ERR_CABINET_NOT_FOUND
    http_status: 404
    applies_to: "POST /colocation/contracts, POST /colocation/cabinets, POST /colocation/power-circuits, POST /colocation/patch-panel-ports, POST /colocation/cross-connect-orders, POST /colocation/remote-hands-tickets, POST /colocation/access-visits, POST /colocation/decommission-orders, POST /colocation/contacts"
    description: "Body FKs are resolved left to right in the order the fields are declared in §1.1; the first unresolvable FK returns its own entity's NOT_FOUND code."

  - priority: 5
    category: auth
    check: "When X-Role is CustomerAdmin, X-User-ID equals a Customer id and every referenced Contract/Cabinet/Circuit/CrossConnectOrder/Ticket/Visit/InvoiceLine belongs to that customer"
    error_id: ERR_CUSTOMER_SCOPE_VIOLATION
    http_status: 403
    applies_to: "all endpoints where CustomerAdmin appears in authorized_roles"
    description: "Ownership check runs after existence so it can compare the loaded row's customer_id; a CustomerAdmin reading another customer's contract gets 403, not 404."

  - priority: 6
    category: auth
    check: "The requesting_contact_id on a remote-hands ticket or access visit appears on the contract's AuthorizedContact list with is_active == true"
    error_id: ERR_CONTACT_NOT_AUTHORIZED
    http_status: 403
    applies_to: "POST /colocation/remote-hands-tickets, POST /colocation/remote-hands-tickets/{ticket_id}/authorization, POST /colocation/access-visits"
    description: "A deactivated or foreign-contract contact cannot raise work or schedule access."

  - priority: 7
    category: auth
    check: "X-User-ID authorizing a remote-hands ticket differs from the X-User-ID that created it"
    error_id: ERR_SELF_AUTHORIZATION_FORBIDDEN
    http_status: 409
    applies_to: "POST /colocation/remote-hands-tickets/{ticket_id}/authorization"
    description: "Segregation of duties: the requester may never authorize their own ticket."

  - priority: 8
    category: auth
    check: "X-User-ID approving a DecommissionOrder or a CrossConnectOrder differs from the X-User-ID that created it"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /colocation/cross-connect-orders/{order_id}/state, POST /colocation/decommission-orders/{order_id}/state"
    description: "Applies only to transitions targeting APPROVED. Later target states may be driven by the creator."

  - priority: 9
    category: state
    check: "expected_contract_version equals Contract.version"
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412
    applies_to: "POST /colocation/cross-connect-orders"
    description: "§1.2.1 optimistic concurrency guard on the parent contract; evaluated before body validation so a stale writer is told to re-read rather than being told its payload is wrong."

  - priority: 10
    category: state
    check: "expected_row_version equals FloorRow.version"
    error_id: ERR_STALE_ROW_VERSION
    http_status: 412
    applies_to: "POST /colocation/power-circuits/{circuit_id}/energize"
    description: "§1.2.1 optimistic concurrency guard on the parent floor row."

  - priority: 11
    category: validation
    check: "All required body fields present; enums within their declared value sets; numbers within their declared ranges; datetimes are ISO-8601 UTC"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"
    description: "Covers unknown enum values (phase, media_type, severity, footprint_type, billing_mode, purpose, to_state), non-positive breaker_amps/volts/rated_power_kw, negative commitments, limit outside 1..100 and negative offset."

  - priority: 12
    category: validation
    check: "period_end is strictly after period_start, and every work segment ended_at is greater than or equal to started_at"
    error_id: ERR_BILLING_PERIOD_INVALID
    http_status: 422
    applies_to: "POST /colocation/contracts/{contract_id}/billing-close, POST /colocation/remote-hands-tickets/{ticket_id}/complete, POST /colocation/power-circuits/{circuit_id}/readings"
    description: "Zero-length work segments are legal (they bill 0 increments); inverted intervals are not."

  - priority: 13
    category: state
    check: "The requested to_state is reachable from the entity's current state per §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all /state endpoints, POST /colocation/power-circuits/{circuit_id}/energize, POST /colocation/cross-connect-orders/{order_id}/propose-route, POST /colocation/cross-connect-orders/{order_id}/request-changes, POST /colocation/remote-hands-tickets/{ticket_id}/dispatch, POST /colocation/remote-hands-tickets/{ticket_id}/complete, POST /colocation/decommission-orders/{order_id}/record-step, POST /colocation/decommission-orders/{order_id}/release-ports"
    description: "Includes terminal-state lockdown (TERMINATED, RELEASED, REMOVED, DECOMMISSIONED, ABORTED, CLOSED, CANCELLED, CHECKED_OUT accept no further transitions) and repeat-trigger idempotency rejection."

  - priority: 14
    category: state
    check: "The targeted InvoiceLine has not already been reversed and is not itself a reversal"
    error_id: ERR_LINE_ALREADY_REVERSED
    http_status: 409
    applies_to: "POST /colocation/contracts/{contract_id}/invoice-adjustments"
    description: "Each billed line may be compensated exactly once."

  - priority: 15
    category: state
    check: "The submitted decommission step_code has not already been recorded on this order"
    error_id: ERR_DECOMMISSION_STEP_ALREADY_RECORDED
    http_status: 409
    applies_to: "POST /colocation/decommission-orders/{order_id}/record-step"
    description: "step_code EQUIPMENT_REMOVAL and step_code CABLE_RECLAMATION are each recorded once; the second attempt is rejected rather than being silently ignored."

  - priority: 16
    category: state
    check: "Ticket authorization_state is AUTHORIZED"
    error_id: ERR_TICKET_NOT_AUTHORIZED
    http_status: 409
    applies_to: "POST /colocation/remote-hands-tickets/{ticket_id}/dispatch"
    description: "A ticket in PENDING_AUTHORIZATION or REVOKED cannot be dispatched even though its execution_state is QUEUED."

  - priority: 17
    category: state
    check: "CrossConnectOrder.revision_count is strictly below MAX_ROUTE_REVISIONS (2)"
    error_id: ERR_REVISION_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /colocation/cross-connect-orders/{order_id}/request-changes"
    description: "Bounds the ROUTE_PROPOSED / CHANGES_REQUESTED cycle at 2 revisions; the third request-changes is refused and the order must be approved or aborted."

  - priority: 18
    category: state
    check: "Contract.status is ACTIVE"
    error_id: ERR_CONTRACT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /colocation/cross-connect-orders, POST /colocation/cross-connect-orders/{order_id}/state, POST /colocation/remote-hands-tickets, POST /colocation/access-visits, POST /colocation/contracts/{contract_id}/billing-close, POST /colocation/cabinets/{cabinet_id}/state"
    description: "Contract lifecycle gate. Deliberately ordered ABOVE the credit-hold fiscal gate, so a contract that is both SUSPENDED and on credit hold reports ERR_CONTRACT_NOT_ACTIVE. On POST /colocation/cabinets/{cabinet_id}/state the accepted set widens per §1.2: AVAILABLE->RESERVED accepts contract.status IN {PENDING_ACTIVATION, ACTIVE} while RESERVED->INSTALLED requires ACTIVE."

  - priority: 19
    category: state
    check: "FloorRow.row_status is OPEN or COOLING_CONSTRAINED (never DENSITY_CAPPED or DECOMMISSIONING)"
    error_id: ERR_ROW_NOT_ACCEPTING_SPACE
    http_status: 409
    applies_to: "POST /colocation/cabinets, POST /colocation/cabinets/{cabinet_id}/state, POST /colocation/power-circuits/{circuit_id}/energize"
    description: "Applies to transitions targeting RESERVED or INSTALLED; a capped or decommissioning row accepts no new space. On energize the narrower test is FloorRow.decommission_flag == false, so a merely DENSITY_CAPPED row still permits energization of its own installed cabinets."

  - priority: 20
    category: state
    check: "The customer-side Cabinet.status is INSTALLED or ACTIVE"
    error_id: ERR_CABINET_NOT_OPERATIONAL
    http_status: 409
    applies_to: "POST /colocation/power-circuits/{circuit_id}/energize, POST /colocation/power-circuits/{circuit_id}/state, POST /colocation/cross-connect-orders, POST /colocation/access-visits, POST /colocation/remote-hands-tickets/{ticket_id}/dispatch, POST /colocation/decommission-orders/{order_id}/state"
    description: "Power cannot be energized, cross-connects ordered, visits booked or remote hands dispatched against a cabinet still in AVAILABLE, RESERVED, CAPACITY_HELD, DECOMMISSIONING or RELEASED. Only a_end_cabinet_id is checked on a cross-connect order. On POST /colocation/power-circuits/{circuit_id}/state the gate applies to the DESIGNED->APPROVED transition only and its accepted set widens to {RESERVED, INSTALLED, ACTIVE} per §1.2."

  - priority: 21
    category: state
    check: "Neither endpoint PatchPanelPort is RESERVED or ASSIGNED (status FREE and status QUARANTINED both pass this gate)"
    error_id: ERR_PORT_UNAVAILABLE
    http_status: 409
    applies_to: "POST /colocation/cross-connect-orders/{order_id}/propose-route"
    description: "A port already RESERVED or ASSIGNED to another order cannot be re-assigned. A QUARANTINED port is deliberately NOT rejected here — it falls through to priority 22 so a reclaimed port reports the cool-down error rather than a generic unavailability error."

  - priority: 22
    category: state
    check: "Neither endpoint port is QUARANTINED, or its quarantine_until is at or before the logical clock"
    error_id: ERR_PORT_IN_QUARANTINE
    http_status: 409
    applies_to: "POST /colocation/cross-connect-orders/{order_id}/propose-route"
    description: "Reclaimed ports serve a PORT_QUARANTINE_HOURS cool-down before re-use; the boundary instant itself is allowed."

  - priority: 23
    category: state
    check: "The visiting contact's biometric_state is ENROLLED"
    error_id: ERR_BIOMETRIC_NOT_ENROLLED
    http_status: 409
    applies_to: "POST /colocation/access-visits/{visit_id}/state"
    description: "Applies to transitions targeting CHECKED_IN. Scheduling is permitted before enrollment; entry is not."

  - priority: 24
    category: state
    check: "The contract has at least one Cabinet in status RESERVED, INSTALLED or ACTIVE"
    error_id: ERR_NO_CABINET_ASSIGNED
    http_status: 409
    applies_to: "POST /colocation/contracts/{contract_id}/state"
    description: "Applies to transitions targeting ACTIVE; a contract cannot activate without provisioned space."

  - priority: 25
    category: business_safety
    check: "Projected row cooling_load_kw after this energization is less than or equal to FloorRow.cooling_capacity_kw"
    error_id: ERR_COOLING_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /colocation/power-circuits/{circuit_id}/energize"
    description: "Thermal safety gate on the ROW, using cooling_contribution_kw (redundant feeds count at 25 percent). Equality is permitted. Deliberately ordered ABOVE the row density limit so a request violating both reports the cooling error."

  - priority: 26
    category: business_safety
    check: "Sum of derated_kw of the cabinet's PRIMARY energized circuits, including this one, is less than or equal to rated_power_kw * BREAKER_HEADROOM_RATIO"
    error_id: ERR_CABINET_BREAKER_OVERSUBSCRIBED
    http_status: 422
    applies_to: "POST /colocation/power-circuits/{circuit_id}/energize, POST /colocation/power-circuits/{circuit_id}/state"
    description: "Per-cabinet breaker sizing gate; the 1.25 headroom multiplier is applied to the cabinet nameplate. Enforced both on the DESIGNED->APPROVED transition (over APPROVED and ENERGIZED PRIMARY siblings, per §1.2) and again at energization."

  - priority: 27
    category: business_safety
    check: "A cabinet whose contract requires redundant feeds has an APPROVED or ENERGIZED REDUNDANT circuit before its PRIMARY circuit may energize"
    error_id: ERR_REDUNDANT_FEED_MISSING
    http_status: 422
    applies_to: "POST /colocation/power-circuits/{circuit_id}/energize"
    description: "Only enforced when Contract.redundancy_requirement == TWO_N; N and N_PLUS_1 contracts may energize a lone PRIMARY feed."

  - priority: 28
    category: business_safety
    check: "A visit whose computed escort_required is true supplies escort_officer_user_id at check-in"
    error_id: ERR_ESCORT_REQUIRED
    http_status: 422
    applies_to: "POST /colocation/access-visits/{visit_id}/state"
    description: "Applies to transitions targeting CHECKED_IN. ESCORTED_ONLY contacts, CARRIER_INSTALL visits and MEET_ME cabinets all force a named escort before entry; unescorted visits must NOT supply one."

  - priority: 29
    category: business_constraint
    check: "Projected row allocated_power_kw after this energization is less than or equal to density_ceiling_kw * DENSITY_TOLERANCE_RATIO"
    error_id: ERR_ROW_DENSITY_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /colocation/power-circuits/{circuit_id}/energize"
    description: "Per-row density gate. The rejection threshold carries a 10 percent tolerance above the ceiling that flips row_status to DENSITY_CAPPED, so the capped posture is reachable without rejection."

  - priority: 30
    category: business_constraint
    check: "Projected row allocated_power_kw after this energization is less than or equal to max_row_power_kw"
    error_id: ERR_ROW_POWER_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /colocation/power-circuits/{circuit_id}/energize"
    description: "Absolute row feeder limit, independent of per-cabinet density."

  - priority: 31
    category: business_constraint
    check: "Both endpoint ports' media_type equals the order's media_type"
    error_id: ERR_MEDIA_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /colocation/cross-connect-orders/{order_id}/propose-route"
    description: "SMF orders cannot be patched onto MMF, CAT6A or COAX ports."

  - priority: 32
    category: business_constraint
    check: "path_hops is a non-empty list whose first hop equals the a_side port's panel_code and whose last hop equals the z_side port's panel_code, with no repeated panel_code"
    error_id: ERR_PATH_ROUTE_INVALID
    http_status: 422
    applies_to: "POST /colocation/cross-connect-orders/{order_id}/propose-route"
    description: "Rejects disconnected, reversed and looping routes."

  - priority: 33
    category: business_constraint
    check: "a_end_port.row_id equals a_end_cabinet.row_id and z_end_port.row_id equals z_end_cabinet.row_id"
    error_id: ERR_PORT_ROW_MISMATCH
    http_status: 422
    applies_to: "POST /colocation/cross-connect-orders/{order_id}/propose-route"
    description: "A port physically outside its end cabinet's row cannot terminate that end of the circuit."

  - priority: 34
    category: business_constraint
    check: "The customer-side cabinet's contract_id equals the referenced Contract id"
    error_id: ERR_CABINET_NOT_ON_CONTRACT
    http_status: 422
    applies_to: "POST /colocation/cross-connect-orders, POST /colocation/remote-hands-tickets, POST /colocation/access-visits, POST /colocation/decommission-orders"
    description: "Cross-aggregate integrity: work may not be raised against another contract's cabinet even when both ids exist. The customer-side cabinet is a_end_cabinet_id on a cross-connect, target_cabinet_id on a ticket and cabinet_id on a visit or decommission. z_end_cabinet_id is the far side (another customer's cabinet or a carrier meet-me panel) and is deliberately NOT scoped to the contract, nor required to be operational."

  - priority: 35
    category: business_constraint
    check: "No SCHEDULED or CHECKED_IN visit on the same cabinet overlaps the requested half-open window"
    error_id: ERR_VISIT_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /colocation/access-visits"
    description: "Half-open [window_start, window_end): a window starting exactly when another ends is accepted."

  - priority: 36
    category: business_constraint
    check: "Count of overlapping escort-requiring visits in the same row is below FloorRow.escort_slot_count"
    error_id: ERR_ESCORT_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /colocation/access-visits"
    description: "Row-level aggregate capacity, evaluated on CLOSED intervals: unlike the cabinet gate, a window that merely touches another's endpoint DOES consume a slot."

  - priority: 37
    category: business_constraint
    check: "The logical clock is inside the visit's half-open [window_start, window_end)"
    error_id: ERR_OUTSIDE_VISIT_WINDOW
    http_status: 409
    applies_to: "POST /colocation/access-visits/{visit_id}/state"
    description: "Applies to transitions targeting CHECKED_IN; early and late arrivals are refused."

  - priority: 38
    category: business_fiscal
    check: "Contract.credit_hold is false"
    error_id: ERR_CREDIT_HOLD_ACTIVE
    http_status: 402
    applies_to: "POST /colocation/cross-connect-orders, POST /colocation/remote-hands-tickets, POST /colocation/power-circuits/{circuit_id}/energize, POST /colocation/contracts/{contract_id}/state"
    description: "Fiscal gate, deliberately ordered BELOW the ERR_CONTRACT_NOT_ACTIVE lifecycle gate. On POST /colocation/contracts/{contract_id}/state it applies only to the SUSPENDED->ACTIVE reinstatement, matching the §1.2 precondition."

  - priority: 39
    category: business_fiscal
    check: "Count of the contract's Cabinets in status RESERVED, CAPACITY_HELD, INSTALLED or ACTIVE, including this one, is less than or equal to committed_cabinet_count"
    error_id: ERR_CABINET_COMMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /colocation/cabinets, POST /colocation/cabinets/{cabinet_id}/state"
    description: "Space commitments are hard caps, not soft targets."

  - priority: 40
    category: business_fiscal
    check: "Projected contract provisioned_power_kw after this energization is less than or equal to power_commit_kw * POWER_OVERPROVISION_CAP_RATIO"
    error_id: ERR_POWER_COMMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /colocation/power-circuits/{circuit_id}/energize"
    description: "A customer may draw up to 110 percent of contracted power before provisioning is refused."

  - priority: 41
    category: business_fiscal
    check: "Count of the contract's CrossConnectOrders not in ABORTED or DECOMMISSIONED, including this one, is less than or equal to cross_connect_cap"
    error_id: ERR_CROSS_CONNECT_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /colocation/cross-connect-orders"
    description: "Bandwidth commitment cap; released and aborted orders free a slot."

# =============================================================================
# §1.5 API Endpoint Table
# `input:` lists BODY / QUERY fields only — path placeholders are never body
# fields. A trailing `?` marks an optional field. All GET filters are optional
# so a bare list call carries no body.
# =============================================================================
endpoints:
  - method: POST
    path: /colocation/_clock/set_current_utc
    description: "Set the logical clock used by every timestamp, deadline, quarantine and window comparison. The clock defaults to 2026-08-01T00:00:00Z when never set."
    roles: [ProvisioningEngineer, FacilityManager, SecurityOfficer, BillingOperator, CustomerAdmin]
    input: [current_utc]
    output: "{ current_utc: datetime }"
    success_code: 200
    side_effects: ["No entity is mutated; subsequent writes read the new clock value"]

  - method: POST
    path: /colocation/customers
    description: "Register a colocation customer."
    roles: [FacilityManager, BillingOperator]
    input: [legal_name, account_code]
    output: Customer
    success_code: 201
    side_effects: ["account_status set to ACTIVE"]

  - method: GET
    path: /colocation/customers/{customer_id}
    description: "Fetch one customer."
    roles: [FacilityManager, BillingOperator, ProvisioningEngineer, SecurityOfficer, CustomerAdmin]
    input: []
    output: Customer
    success_code: 200
    side_effects: []

  - method: POST
    path: /colocation/contacts
    description: "Add a contact to a customer's authorization list."
    roles: [CustomerAdmin, SecurityOfficer]
    input: [customer_id, full_name, authorization_scopes, "access_level?"]
    output: AuthorizedContact
    success_code: 201
    side_effects: ["biometric_state set to NOT_ENROLLED"]

  - method: POST
    path: /colocation/contacts/{contact_id}/biometric-state
    description: "Move a contact's biometric enrollment to ENROLLED or REVOKED."
    roles: [SecurityOfficer]
    input: [to_state]
    output: AuthorizedContact
    success_code: 200
    side_effects: ["enrolled_at stamped from the logical clock when to_state == ENROLLED", "REVOKED forces authorization_state REVOKED on the contact's non-terminal RemoteHandsTickets and CANCELLED on their SCHEDULED AccessVisits"]

  - method: GET
    path: /colocation/contacts/{contact_id}
    description: "Fetch one authorized contact."
    roles: [CustomerAdmin, SecurityOfficer, ProvisioningEngineer, FacilityManager]
    input: []
    output: AuthorizedContact
    success_code: 200
    side_effects: []

  - method: GET
    path: /colocation/contacts
    description: "List authorized contacts, filterable by owning customer, access level and biometric state."
    roles: [CustomerAdmin, SecurityOfficer, ProvisioningEngineer, FacilityManager]
    input: ["customer_id?", "access_level?", "biometric_state?", "limit?", "offset?"]
    output: AuthorizedContact[]
    success_code: 200
    side_effects: []

  - method: POST
    path: /colocation/contracts
    description: "Create a colocation contract with space, power, bandwidth, cross-connect and remote-hands commitments."
    roles: [BillingOperator, FacilityManager]
    input: [customer_id, contract_number, billing_mode, committed_cabinet_count, power_commit_kw, committed_bandwidth_mbps, cross_connect_cap, term_start_date, term_end_date, "committed_cage_sqft?", "redundancy_requirement?", "cross_connect_allowance?", "remote_hands_included_minutes?"]
    output: Contract
    success_code: 201
    side_effects: ["status DRAFT", "remote_hands_remaining_minutes initialised to remote_hands_included_minutes", "credit_hold false", "all rollup fields zeroed"]

  - method: POST
    path: /colocation/contracts/{contract_id}/state
    description: "Drive the contract lifecycle: DRAFT→PENDING_ACTIVATION→ACTIVE, ACTIVE↔SUSPENDED, ACTIVE→WIND_DOWN, WIND_DOWN→TERMINATED."
    roles: [BillingOperator, FacilityManager]
    input: [to_state]
    output: Contract
    success_code: 200
    side_effects: ["ACTIVE requires at least one RESERVED/INSTALLED/ACTIVE cabinet", "TERMINATED de-energizes remaining circuits and releases the contract's cabinets"]

  - method: POST
    path: /colocation/contracts/{contract_id}/credit-hold
    description: "Set or clear the billing credit hold."
    roles: [BillingOperator]
    input: [credit_hold]
    output: Contract
    success_code: 200
    side_effects: ["credit_hold flag toggled; no existing order is retro-actively cancelled"]

  - method: POST
    path: /colocation/contracts/{contract_id}/billing-close
    description: "Close a billing period: append power commit/overage lines, then the cross-connect MRC and surcharge lines."
    roles: [BillingOperator]
    input: [period_start, period_end]
    output: Contract
    success_code: 200
    side_effects: ["contract_power_billing then cross_connect_period_billing run in that order", "InvoiceLine rows appended", "billed_total_usd and cross_connect_billed_usd recomputed", "last_closed_period_end set to period_end"]

  - method: POST
    path: /colocation/contracts/{contract_id}/invoice-adjustments
    description: "Reverse one previously appended InvoiceLine with a compensating REVERSAL line."
    roles: [BillingOperator]
    input: [invoice_line_id, reason]
    output: InvoiceLine
    success_code: 201
    side_effects: ["REVERSAL line appended with amount_usd = -original.amount_usd", "original.reversed set true", "billed_total_usd recomputed", "remote_hands_remaining_minutes restored by the original line's included_minutes_consumed"]

  - method: GET
    path: /colocation/contracts/{contract_id}
    description: "Fetch one contract with all rollup fields."
    roles: [BillingOperator, FacilityManager, ProvisioningEngineer, CustomerAdmin]
    input: []
    output: Contract
    success_code: 200
    side_effects: []

  - method: GET
    path: /colocation/contracts
    description: "List contracts, filterable by customer, status and billing mode."
    roles: [BillingOperator, FacilityManager, ProvisioningEngineer, CustomerAdmin]
    input: ["customer_id?", "status?", "billing_mode?", "limit?", "offset?"]
    output: Contract[]
    success_code: 200
    side_effects: []

  - method: POST
    path: /colocation/rows
    description: "Create a data-hall floor row with density, busway and cooling limits."
    roles: [FacilityManager]
    input: [hall_code, row_code, cabinet_slot_count, design_density_kw_per_cabinet, max_row_power_kw, cooling_capacity_kw, "escort_slot_count?", "decommission_flag?"]
    output: FloorRow
    success_code: 201
    side_effects: ["row_status computed as OPEN", "all capacity rollups zeroed"]

  - method: PATCH
    path: /colocation/rows/{row_id}
    description: "Adjust a row's cooling, busway, density or escort limits, or flag it for decommissioning."
    roles: [FacilityManager]
    input: ["cooling_capacity_kw?", "max_row_power_kw?", "design_density_kw_per_cabinet?", "escort_slot_count?", "decommission_flag?"]
    output: FloorRow
    success_code: 200
    side_effects: ["row_capacity_and_posture recomputed, so row_status may flip without any cabinet or circuit changing", "version incremented"]

  - method: GET
    path: /colocation/rows/{row_id}
    description: "Fetch one floor row with both stranded-capacity views."
    roles: [FacilityManager, ProvisioningEngineer, BillingOperator]
    input: []
    output: FloorRow
    success_code: 200
    side_effects: []

  - method: GET
    path: /colocation/rows
    description: "List floor rows, filterable by hall and posture."
    roles: [FacilityManager, ProvisioningEngineer, BillingOperator]
    input: ["hall_code?", "row_status?", "limit?", "offset?"]
    output: FloorRow[]
    success_code: 200
    side_effects: []

  - method: POST
    path: /colocation/cabinets
    description: "Create a cabinet position in a row."
    roles: [FacilityManager, ProvisioningEngineer]
    input: [row_id, cabinet_code, rated_power_kw, "footprint_type?", "u_height?"]
    output: Cabinet
    success_code: 201
    side_effects: ["status AVAILABLE", "contract_id null", "row_capacity_and_posture recomputed (an AVAILABLE cabinet does not occupy a slot)"]

  - method: POST
    path: /colocation/cabinets/{cabinet_id}/state
    description: "Drive cabinet space lifecycle: AVAILABLE→RESERVED (contract_id required), RESERVED↔CAPACITY_HELD, RESERVED→INSTALLED, INSTALLED↔ACTIVE, RESERVED→AVAILABLE (release), ACTIVE→DECOMMISSIONING, DECOMMISSIONING→RELEASED."
    roles: [FacilityManager, ProvisioningEngineer]
    input: [to_state, "contract_id?"]
    output: Cabinet
    success_code: 200
    side_effects: ["row occupied_slot_count, density_ceiling_kw, effective_ceiling_kw, both stranded views and row_status recomputed", "contract committed_cabinet_count cap enforced", "release clears contract_id"]

  - method: GET
    path: /colocation/cabinets/{cabinet_id}
    description: "Fetch one cabinet with its power rollups."
    roles: [FacilityManager, ProvisioningEngineer, BillingOperator, CustomerAdmin]
    input: []
    output: Cabinet
    success_code: 200
    side_effects: []

  - method: GET
    path: /colocation/cabinets
    description: "List cabinets, filterable by row, contract and status."
    roles: [FacilityManager, ProvisioningEngineer, BillingOperator, CustomerAdmin]
    input: ["row_id?", "contract_id?", "status?", "footprint_type?", "limit?", "offset?"]
    output: Cabinet[]
    success_code: 200
    side_effects: []

  - method: POST
    path: /colocation/power-circuits
    description: "Design a power circuit for a cabinet; derated_kw is pinned from the breaker plate at creation."
    roles: [ProvisioningEngineer]
    input: [cabinet_id, circuit_code, feed_side, redundancy_role, breaker_amps, volts, phase]
    output: PowerCircuit
    success_code: 201
    side_effects: ["status DESIGNED", "derated_kw computed", "allocated_kw and cooling_contribution_kw remain 0.000"]

  - method: POST
    path: /colocation/power-circuits/{circuit_id}/state
    description: "Drive circuit lifecycle other than energization: DESIGNED→APPROVED, DESIGNED↔BLOCKED, ENERGIZED→DE_ENERGIZED, DE_ENERGIZED→REMOVED."
    roles: [ProvisioningEngineer, FacilityManager]
    input: [to_state]
    output: PowerCircuit
    success_code: 200
    side_effects: ["DE_ENERGIZED zeroes allocated_kw and cooling_contribution_kw and reverses the energize cascade on cabinet, row and contract"]

  - method: POST
    path: /colocation/power-circuits/{circuit_id}/energize
    description: "Energize an APPROVED or DE_ENERGIZED circuit under the parent row's optimistic-concurrency guard; runs the breaker, cooling, density, busway and commitment gates."
    roles: [ProvisioningEngineer]
    input: [expected_row_version]
    output: PowerCircuit
    success_code: 200
    side_effects: ["allocated_kw and cooling_contribution_kw computed", "energized_at stamped", "cabinet rollups then row posture then contract rollups recomputed", "DENSITY_CAPPED posture holds RESERVED cabinets and blocks their DESIGNED circuits"]

  - method: POST
    path: /colocation/power-circuits/{circuit_id}/readings
    description: "Append one metered interval to a circuit."
    roles: [FacilityManager, BillingOperator]
    input: [interval_start, interval_end, kwh, peak_kw]
    output: PowerCircuit
    success_code: 201
    side_effects: ["meter_intervals appended in request order", "row measured_peak_kw and stranded_measured_kw recomputed"]

  - method: GET
    path: /colocation/power-circuits/{circuit_id}
    description: "Fetch one power circuit with its derated, allocated and cooling values."
    roles: [ProvisioningEngineer, FacilityManager, BillingOperator, CustomerAdmin]
    input: []
    output: PowerCircuit
    success_code: 200
    side_effects: []

  - method: GET
    path: /colocation/power-circuits
    description: "List power circuits, filterable by cabinet, status, feed side and redundancy role."
    roles: [ProvisioningEngineer, FacilityManager, BillingOperator, CustomerAdmin]
    input: ["cabinet_id?", "status?", "feed_side?", "redundancy_role?", "limit?", "offset?"]
    output: PowerCircuit[]
    success_code: 200
    side_effects: []

  - method: POST
    path: /colocation/patch-panel-ports
    description: "Create a patch panel port in a row's patch field."
    roles: [FacilityManager, ProvisioningEngineer]
    input: [row_id, panel_code, port_number, media_type]
    output: PatchPanelPort
    success_code: 201
    side_effects: ["status FREE", "assigned_order_id and quarantine_until null"]

  - method: GET
    path: /colocation/patch-panel-ports/{port_id}
    description: "Fetch one patch panel port."
    roles: [FacilityManager, ProvisioningEngineer, CustomerAdmin]
    input: []
    output: PatchPanelPort
    success_code: 200
    side_effects: []

  - method: GET
    path: /colocation/patch-panel-ports
    description: "List patch panel ports, filterable by row, panel, media type, status and holding order."
    roles: [FacilityManager, ProvisioningEngineer, CustomerAdmin]
    input: ["row_id?", "panel_code?", "media_type?", "status?", "assigned_order_id?", "limit?", "offset?"]
    output: PatchPanelPort[]
    success_code: 200
    side_effects: []

  - method: POST
    path: /colocation/cross-connect-orders
    description: "Raise a cross-connect order against a contract under the contract's optimistic-concurrency guard; mrc_usd is pinned from cable_type."
    roles: [CustomerAdmin, ProvisioningEngineer]
    input: [contract_id, requested_by_contact_id, a_end_cabinet_id, z_end_cabinet_id, cable_type, expected_contract_version, "parent_order_id?"]
    output: CrossConnectOrder
    success_code: 201
    side_effects: ["status SUBMITTED", "revision_count 0", "mrc_usd set from CC_MEDIA_MRC_USD[cable_type]", "cross_connect_cap and credit-hold gates enforced", "increments Contract.version by 1 (§1.2.1 OCC parent bump)"]

  - method: POST
    path: /colocation/cross-connect-orders/{order_id}/propose-route
    description: "Pin the A and Z ports plus the panel path for a SUBMITTED or CHANGES_REQUESTED order."
    roles: [ProvisioningEngineer]
    input: [a_end_port_id, z_end_port_id, path_hops]
    output: CrossConnectOrder
    success_code: 200
    side_effects: ["status ROUTE_PROPOSED", "both ports move FREE→RESERVED with assigned_order_id set", "proposed_by_user_id recorded", "media, quarantine, path and port-row gates enforced"]

  - method: POST
    path: /colocation/cross-connect-orders/{order_id}/request-changes
    description: "Reject a proposed route and send the order back for re-routing, bounded by MAX_ROUTE_REVISIONS."
    roles: [FacilityManager, CustomerAdmin]
    input: [reason]
    output: CrossConnectOrder
    success_code: 200
    side_effects: ["status CHANGES_REQUESTED", "revision_count incremented", "both reserved ports returned to FREE with assigned_order_id cleared", "a_end_port_id, z_end_port_id and path_hops cleared"]

  - method: POST
    path: /colocation/cross-connect-orders/{order_id}/state
    description: "Drive the cross-connect lifecycle: ROUTE_PROPOSED→APPROVED, APPROVED→INSTALLED, INSTALLED→ACTIVE, ACTIVE→DECOMMISSIONED, or any non-terminal state→ABORTED."
    roles: [ProvisioningEngineer, FacilityManager]
    input: [to_state]
    output: CrossConnectOrder
    success_code: 200
    side_effects: ["APPROVED records approved_by_user_id and enforces segregation of duties", "INSTALLED moves both ports RESERVED→ASSIGNED", "ACTIVE stamps activated_at and bumps the contract's active_cross_connect_count", "ABORTED frees reserved ports"]

  - method: GET
    path: /colocation/cross-connect-orders/{order_id}
    description: "Fetch one cross-connect order with its pinned route."
    roles: [ProvisioningEngineer, FacilityManager, BillingOperator, CustomerAdmin]
    input: []
    output: CrossConnectOrder
    success_code: 200
    side_effects: []

  - method: GET
    path: /colocation/cross-connect-orders
    description: "List cross-connect orders, filterable by contract, requesting contact, either cabinet end, re-issue parent, status and cable type."
    roles: [ProvisioningEngineer, FacilityManager, BillingOperator, CustomerAdmin]
    input: ["contract_id?", "requested_by_contact_id?", "a_end_cabinet_id?", "z_end_cabinet_id?", "a_end_port_id?", "z_end_port_id?", "parent_order_id?", "status?", "cable_type?", "limit?", "offset?"]
    output: CrossConnectOrder[]
    success_code: 200
    side_effects: []

  - method: POST
    path: /colocation/remote-hands-tickets
    description: "Raise a remote-hands request; both state dimensions start independently at PENDING_AUTHORIZATION and QUEUED."
    roles: [CustomerAdmin, ProvisioningEngineer]
    input: [contract_id, requested_by_contact_id, target_cabinet_id, severity, description]
    output: RemoteHandsTicket
    success_code: 201
    side_effects: ["authorization_state PENDING_AUTHORIZATION", "execution_state QUEUED", "requesting contact must hold the REMOTE_HANDS scope"]

  - method: POST
    path: /colocation/remote-hands-tickets/{ticket_id}/authorization
    description: "Move the ticket's authorization dimension to AUTHORIZED, DENIED or REVOKED. The authorizer may not be the requester."
    roles: [CustomerAdmin, SecurityOfficer]
    input: [to_state, authorizing_contact_id]
    output: RemoteHandsTicket
    success_code: 200
    side_effects: ["AUTHORIZED stamps authorized_at and computes response_deadline_at from severity", "DENIED or REVOKED forces execution_state CANCELLED when execution has not COMPLETED"]

  - method: POST
    path: /colocation/remote-hands-tickets/{ticket_id}/dispatch
    description: "Move the execution dimension QUEUED→DISPATCHED and evaluate the response-time commitment."
    roles: [ProvisioningEngineer]
    input: []
    output: RemoteHandsTicket
    success_code: 200
    side_effects: ["dispatched_at stamped", "sla_breached set when dispatched_at is strictly after response_deadline_at"]

  - method: POST
    path: /colocation/remote-hands-tickets/{ticket_id}/complete
    description: "Record the labour segments and close the execution dimension, billing by increment."
    roles: [ProvisioningEngineer]
    input: [work_segments]
    output: RemoteHandsTicket
    success_code: 200
    side_effects: ["execution_state COMPLETED, completed_at stamped", "remote_hands_labor_charge run: per-segment ceiling, bundled-minute waterfall, per-segment rounding", "REMOTE_HANDS line appended when charge > 0", "SLA_CREDIT line appended when sla_breached", "contract remote_hands_remaining_minutes decremented"]

  - method: GET
    path: /colocation/remote-hands-tickets/{ticket_id}
    description: "Fetch one remote-hands ticket with both state dimensions and billing rollups."
    roles: [ProvisioningEngineer, CustomerAdmin, SecurityOfficer, BillingOperator]
    input: []
    output: RemoteHandsTicket
    success_code: 200
    side_effects: []

  - method: GET
    path: /colocation/remote-hands-tickets
    description: "List remote-hands tickets, filterable by contract, requesting or authorizing contact, target cabinet and either state dimension."
    roles: [ProvisioningEngineer, CustomerAdmin, SecurityOfficer, BillingOperator]
    input: ["contract_id?", "requested_by_contact_id?", "authorizing_contact_id?", "target_cabinet_id?", "authorization_state?", "execution_state?", "severity?", "limit?", "offset?"]
    output: RemoteHandsTicket[]
    success_code: 200
    side_effects: []

  - method: POST
    path: /colocation/access-visits
    description: "Schedule a data-hall visit; escort_required is pinned at creation and both overlap gates are evaluated."
    roles: [CustomerAdmin, SecurityOfficer]
    input: [contract_id, contact_id, cabinet_id, purpose, window_start, window_end]
    output: AccessVisit
    success_code: 201
    side_effects: ["status SCHEDULED", "escort_required computed from access_level, purpose and footprint_type", "cabinet half-open exclusivity and row closed-interval escort capacity enforced"]

  - method: POST
    path: /colocation/access-visits/{visit_id}/state
    description: "Check a visitor in or out, or cancel a scheduled visit."
    roles: [SecurityOfficer]
    input: [to_state, "escort_officer_user_id?"]
    output: AccessVisit
    success_code: 200
    side_effects: ["CHECKED_IN requires an ENROLLED biometric state, the logical clock inside the window and an escort when escort_required", "CHECKED_OUT and CANCELLED release the cabinet and escort slots"]

  - method: GET
    path: /colocation/access-visits/{visit_id}
    description: "Fetch one access visit."
    roles: [SecurityOfficer, CustomerAdmin, FacilityManager]
    input: []
    output: AccessVisit
    success_code: 200
    side_effects: []

  - method: GET
    path: /colocation/access-visits
    description: "List access visits, filterable by contract, contact, cabinet and status."
    roles: [SecurityOfficer, CustomerAdmin, FacilityManager]
    input: ["contract_id?", "contact_id?", "cabinet_id?", "status?", "purpose?", "limit?", "offset?"]
    output: AccessVisit[]
    success_code: 200
    side_effects: []

  - method: POST
    path: /colocation/decommission-orders
    description: "Raise a decommission for one of the contract's cabinets."
    roles: [CustomerAdmin, ProvisioningEngineer]
    input: [contract_id, cabinet_id, requested_by_contact_id]
    output: DecommissionOrder
    success_code: 201
    side_effects: ["status REQUESTED"]

  - method: POST
    path: /colocation/decommission-orders/{order_id}/state
    description: "Drive the decommission lifecycle: REQUESTED→APPROVED or REQUESTED→CANCELLED. APPROVED→IN_PROGRESS→READY_FOR_RELEASE is driven by record-step and READY_FOR_RELEASE→CLOSED by release-ports."
    roles: [FacilityManager, ProvisioningEngineer]
    input: [to_state]
    output: DecommissionOrder
    success_code: 200
    side_effects: ["APPROVED de-energizes the cabinet's ENERGIZED circuits, records released_power_kw, moves the cabinet INSTALLED|ACTIVE→DECOMMISSIONING and enforces segregation of duties", "CANCELLED leaves the cabinet untouched"]

  - method: POST
    path: /colocation/decommission-orders/{order_id}/record-step
    description: "Record EQUIPMENT_REMOVAL or CABLE_RECLAMATION; recording both auto-forks the order to READY_FOR_RELEASE."
    roles: [ProvisioningEngineer]
    input: [step_code]
    output: DecommissionOrder
    success_code: 200
    side_effects: ["step timestamp and recording user stamped", "order auto-transitions IN_PROGRESS→READY_FOR_RELEASE once both steps are recorded (join)"]

  - method: POST
    path: /colocation/decommission-orders/{order_id}/release-ports
    description: "Reclaim the cabinet's cross-connects: decommission the orders, quarantine their ports and issue decommission credits."
    roles: [ProvisioningEngineer]
    input: []
    output: DecommissionOrder
    success_code: 200
    side_effects: ["each ACTIVE cross-connect on the cabinet moves to DECOMMISSIONED", "its ASSIGNED ports move to QUARANTINED with quarantine_until = clock + 24h", "released_port_count set", "one CROSS_CONNECT_CREDIT line per decommissioned order", "contract active_cross_connect_count and billed_total_usd recomputed"]

  - method: GET
    path: /colocation/decommission-orders/{order_id}
    description: "Fetch one decommission order."
    roles: [ProvisioningEngineer, FacilityManager, CustomerAdmin]
    input: []
    output: DecommissionOrder
    success_code: 200
    side_effects: []

  - method: GET
    path: /colocation/decommission-orders
    description: "List decommission orders, filterable by contract, cabinet, requesting contact and status."
    roles: [ProvisioningEngineer, FacilityManager, CustomerAdmin]
    input: ["contract_id?", "cabinet_id?", "requested_by_contact_id?", "status?", "limit?", "offset?"]
    output: DecommissionOrder[]
    success_code: 200
    side_effects: []

  - method: GET
    path: /colocation/invoice-lines/{invoice_line_id}
    description: "Fetch one immutable invoice line."
    roles: [BillingOperator, CustomerAdmin]
    input: []
    output: InvoiceLine
    success_code: 200
    side_effects: []

  - method: GET
    path: /colocation/invoice-lines
    description: "List invoice lines, filterable by contract, line type and reversal flag."
    roles: [BillingOperator, CustomerAdmin]
    input: ["contract_id?", "line_type?", "reversed?", "limit?", "offset?"]
    output: InvoiceLine[]
    success_code: 200
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http_status: 401, condition: "X-Role header missing, empty or not a role declared in §1.7", applies_to: ["all"] }
  - { id: ERR_UNAUTHORIZED, http_status: 403, condition: "X-Role is valid but absent from the endpoint's roles list", applies_to: ["all"] }
  - { id: ERR_CUSTOMER_SCOPE_VIOLATION, http_status: 403, condition: "CustomerAdmin whose X-User-ID does not own the referenced contract, cabinet, circuit, order, ticket, visit or invoice line", applies_to: ["all endpoints allowing CustomerAdmin"] }
  - { id: ERR_CONTACT_NOT_AUTHORIZED, http_status: 403, condition: "Referenced contact is inactive on the authorization list, belongs to another customer, or lacks the REMOTE_HANDS / SITE_ACCESS scope required by the operation", applies_to: ["POST /colocation/remote-hands-tickets", "POST /colocation/remote-hands-tickets/{ticket_id}/authorization", "POST /colocation/access-visits"] }
  - { id: ERR_CUSTOMER_NOT_FOUND, http_status: 404, condition: "customer_id does not resolve", applies_to: ["GET /colocation/customers/{customer_id}", "POST /colocation/contracts", "POST /colocation/contacts"] }
  - { id: ERR_CONTRACT_NOT_FOUND, http_status: 404, condition: "contract_id does not resolve", applies_to: ["all endpoints taking a contract_id in the path or body"] }
  - { id: ERR_ROW_NOT_FOUND, http_status: 404, condition: "row_id does not resolve", applies_to: ["GET /colocation/rows/{row_id}", "PATCH /colocation/rows/{row_id}", "POST /colocation/cabinets", "POST /colocation/patch-panel-ports"] }
  - { id: ERR_CABINET_NOT_FOUND, http_status: 404, condition: "cabinet_id, a_end_cabinet_id, z_end_cabinet_id or target_cabinet_id does not resolve", applies_to: ["all endpoints taking a cabinet reference"] }
  - { id: ERR_CIRCUIT_NOT_FOUND, http_status: 404, condition: "circuit_id does not resolve", applies_to: ["GET /colocation/power-circuits/{circuit_id}", "POST /colocation/power-circuits/{circuit_id}/state", "POST /colocation/power-circuits/{circuit_id}/energize", "POST /colocation/power-circuits/{circuit_id}/readings"] }
  - { id: ERR_PORT_NOT_FOUND, http_status: 404, condition: "port_id, a_end_port_id or z_end_port_id does not resolve", applies_to: ["GET /colocation/patch-panel-ports/{port_id}", "POST /colocation/cross-connect-orders/{order_id}/propose-route"] }
  - { id: ERR_CROSS_CONNECT_ORDER_NOT_FOUND, http_status: 404, condition: "order_id or parent_order_id does not resolve", applies_to: ["all /colocation/cross-connect-orders/{order_id}/* endpoints", "POST /colocation/cross-connect-orders"] }
  - { id: ERR_TICKET_NOT_FOUND, http_status: 404, condition: "ticket_id does not resolve", applies_to: ["all /colocation/remote-hands-tickets/{ticket_id}/* endpoints"] }
  - { id: ERR_CONTACT_NOT_FOUND, http_status: 404, condition: "contact_id, requested_by_contact_id or authorizing_contact_id does not resolve", applies_to: ["all endpoints taking a contact reference"] }
  - { id: ERR_VISIT_NOT_FOUND, http_status: 404, condition: "visit_id does not resolve", applies_to: ["GET /colocation/access-visits/{visit_id}", "POST /colocation/access-visits/{visit_id}/state"] }
  - { id: ERR_DECOMMISSION_ORDER_NOT_FOUND, http_status: 404, condition: "order_id does not resolve on a decommission route", applies_to: ["all /colocation/decommission-orders/{order_id}/* endpoints"] }
  - { id: ERR_INVOICE_LINE_NOT_FOUND, http_status: 404, condition: "invoice_line_id does not resolve, or resolves to a line on a different contract", applies_to: ["GET /colocation/invoice-lines/{invoice_line_id}", "POST /colocation/contracts/{contract_id}/invoice-adjustments"] }
  - { id: ERR_STALE_CONTRACT_VERSION, http_status: 412, condition: "expected_contract_version does not equal the parent Contract's current version (§1.2.1)", applies_to: ["POST /colocation/cross-connect-orders"] }
  - { id: ERR_STALE_ROW_VERSION, http_status: 412, condition: "expected_row_version does not equal the parent FloorRow's current version (§1.2.1)", applies_to: ["POST /colocation/power-circuits/{circuit_id}/energize"] }
  - { id: ERR_INVALID_REQUEST, http_status: 400, condition: "Missing required body field, unknown enum value, out-of-range number, malformed datetime, or pagination limit outside 1..100 / negative offset", applies_to: ["all write endpoints", "all list endpoints"] }
  - { id: ERR_BILLING_PERIOD_INVALID, http_status: 422, condition: "period_end not strictly after period_start, meter interval_end not after interval_start, or a work segment whose ended_at precedes its started_at", applies_to: ["POST /colocation/contracts/{contract_id}/billing-close", "POST /colocation/power-circuits/{circuit_id}/readings", "POST /colocation/remote-hands-tickets/{ticket_id}/complete"] }
  - { id: ERR_INVALID_STATE, http_status: 409, condition: "Requested to_state is not reachable from the entity's current state, the entity is in a terminal state, or the trigger is replayed", applies_to: ["all /state endpoints and all action endpoints"] }
  - { id: ERR_SELF_AUTHORIZATION_FORBIDDEN, http_status: 409, condition: "The X-User-ID authorizing a remote-hands ticket is the X-User-ID that created it", applies_to: ["POST /colocation/remote-hands-tickets/{ticket_id}/authorization"] }
  - { id: ERR_SEGREGATION_OF_DUTIES, http_status: 409, condition: "The X-User-ID approving a cross-connect order or decommission order is the X-User-ID that created it", applies_to: ["POST /colocation/cross-connect-orders/{order_id}/state", "POST /colocation/decommission-orders/{order_id}/state"] }
  - { id: ERR_LINE_ALREADY_REVERSED, http_status: 409, condition: "The targeted InvoiceLine already carries reversed == true, or is itself a REVERSAL line", applies_to: ["POST /colocation/contracts/{contract_id}/invoice-adjustments"] }
  - { id: ERR_DECOMMISSION_STEP_ALREADY_RECORDED, http_status: 409, condition: "The submitted step_code has already been recorded on this order", applies_to: ["POST /colocation/decommission-orders/{order_id}/record-step"] }
  - { id: ERR_TICKET_NOT_AUTHORIZED, http_status: 409, condition: "Dispatch attempted while authorization_state is PENDING_AUTHORIZATION, DENIED or REVOKED", applies_to: ["POST /colocation/remote-hands-tickets/{ticket_id}/dispatch"] }
  - { id: ERR_REVISION_LIMIT_REACHED, http_status: 409, condition: "revision_count has already reached MAX_ROUTE_REVISIONS (2)", applies_to: ["POST /colocation/cross-connect-orders/{order_id}/request-changes"] }
  - { id: ERR_CONTRACT_NOT_ACTIVE, http_status: 409, condition: "Contract.status is not ACTIVE when chargeable work is raised, a period is closed, or a cabinet is installed; AVAILABLE->RESERVED additionally accepts PENDING_ACTIVATION", applies_to: ["POST /colocation/cross-connect-orders", "POST /colocation/cross-connect-orders/{order_id}/state", "POST /colocation/remote-hands-tickets", "POST /colocation/access-visits", "POST /colocation/contracts/{contract_id}/billing-close", "POST /colocation/cabinets/{cabinet_id}/state"] }
  - { id: ERR_ROW_NOT_ACCEPTING_SPACE, http_status: 409, condition: "FloorRow.row_status is DENSITY_CAPPED or DECOMMISSIONING when new space is created or reserved, or FloorRow.decommission_flag is true when a circuit is energized", applies_to: ["POST /colocation/cabinets", "POST /colocation/cabinets/{cabinet_id}/state", "POST /colocation/power-circuits/{circuit_id}/energize"] }
  - { id: ERR_CABINET_NOT_OPERATIONAL, http_status: 409, condition: "Cabinet.status is not INSTALLED or ACTIVE when power, a cross-connect or a visit is requested against it; on circuit approval the accepted set is {RESERVED, INSTALLED, ACTIVE}", applies_to: ["POST /colocation/power-circuits/{circuit_id}/energize", "POST /colocation/power-circuits/{circuit_id}/state", "POST /colocation/cross-connect-orders", "POST /colocation/access-visits", "POST /colocation/remote-hands-tickets/{ticket_id}/dispatch", "POST /colocation/decommission-orders/{order_id}/state"] }
  - { id: ERR_PORT_UNAVAILABLE, http_status: 409, condition: "An endpoint port is RESERVED or ASSIGNED to another order", applies_to: ["POST /colocation/cross-connect-orders/{order_id}/propose-route"] }
  - { id: ERR_PORT_IN_QUARANTINE, http_status: 409, condition: "An endpoint port is QUARANTINED and the logical clock is strictly before its quarantine_until", applies_to: ["POST /colocation/cross-connect-orders/{order_id}/propose-route"] }
  - { id: ERR_BIOMETRIC_NOT_ENROLLED, http_status: 409, condition: "Check-in attempted while the visiting contact's biometric_state is NOT_ENROLLED or REVOKED", applies_to: ["POST /colocation/access-visits/{visit_id}/state"] }
  - { id: ERR_NO_CABINET_ASSIGNED, http_status: 409, condition: "Contract activation attempted with no cabinet in RESERVED, INSTALLED or ACTIVE", applies_to: ["POST /colocation/contracts/{contract_id}/state"] }
  - { id: ERR_VISIT_WINDOW_CONFLICT, http_status: 409, condition: "A SCHEDULED or CHECKED_IN visit on the same cabinet overlaps the requested half-open window", applies_to: ["POST /colocation/access-visits"] }
  - { id: ERR_ESCORT_CAPACITY_EXCEEDED, http_status: 409, condition: "Escort-requiring visits already occupying the row on closed intervals have reached escort_slot_count", applies_to: ["POST /colocation/access-visits"] }
  - { id: ERR_OUTSIDE_VISIT_WINDOW, http_status: 409, condition: "Check-in attempted while the logical clock is outside the visit's half-open window", applies_to: ["POST /colocation/access-visits/{visit_id}/state"] }
  - { id: ERR_COOLING_CAPACITY_EXCEEDED, http_status: 422, condition: "Projected row cooling_load_kw would exceed FloorRow.cooling_capacity_kw (equality permitted)", applies_to: ["POST /colocation/power-circuits/{circuit_id}/energize"] }
  - { id: ERR_CABINET_BREAKER_OVERSUBSCRIBED, http_status: 422, condition: "Projected sum of the cabinet's APPROVED and ENERGIZED PRIMARY derated_kw would exceed rated_power_kw * 1.25", applies_to: ["POST /colocation/power-circuits/{circuit_id}/energize", "POST /colocation/power-circuits/{circuit_id}/state"] }
  - { id: ERR_REDUNDANT_FEED_MISSING, http_status: 422, condition: "A TWO_N contract's cabinet has no APPROVED or ENERGIZED REDUNDANT circuit when its PRIMARY circuit is energized", applies_to: ["POST /colocation/power-circuits/{circuit_id}/energize"] }
  - { id: ERR_ESCORT_REQUIRED, http_status: 422, condition: "Check-in of an escort_required visit without escort_officer_user_id, or supplying one for a visit that does not require an escort", applies_to: ["POST /colocation/access-visits/{visit_id}/state"] }
  - { id: ERR_ROW_DENSITY_LIMIT_EXCEEDED, http_status: 422, condition: "Projected row allocated_power_kw would exceed density_ceiling_kw * 1.10", applies_to: ["POST /colocation/power-circuits/{circuit_id}/energize"] }
  - { id: ERR_ROW_POWER_LIMIT_EXCEEDED, http_status: 422, condition: "Projected row allocated_power_kw would exceed max_row_power_kw", applies_to: ["POST /colocation/power-circuits/{circuit_id}/energize"] }
  - { id: ERR_MEDIA_TYPE_MISMATCH, http_status: 422, condition: "An endpoint port's media_type differs from the order's cable_type", applies_to: ["POST /colocation/cross-connect-orders/{order_id}/propose-route"] }
  - { id: ERR_PATH_ROUTE_INVALID, http_status: 422, condition: "path_hops is empty, does not begin at the A-side panel_code, does not end at the Z-side panel_code, or repeats a panel_code", applies_to: ["POST /colocation/cross-connect-orders/{order_id}/propose-route"] }
  - { id: ERR_PORT_ROW_MISMATCH, http_status: 422, condition: "a_end_port.row_id differs from a_end_cabinet.row_id, or z_end_port.row_id differs from z_end_cabinet.row_id", applies_to: ["POST /colocation/cross-connect-orders/{order_id}/propose-route"] }
  - { id: ERR_CABINET_NOT_ON_CONTRACT, http_status: 422, condition: "The referenced cabinet's contract_id differs from the referenced contract", applies_to: ["POST /colocation/cross-connect-orders", "POST /colocation/remote-hands-tickets", "POST /colocation/access-visits", "POST /colocation/decommission-orders"] }
  - { id: ERR_CREDIT_HOLD_ACTIVE, http_status: 402, condition: "Contract.credit_hold is true when chargeable work is raised, power is energized, or a SUSPENDED contract is reinstated to ACTIVE", applies_to: ["POST /colocation/cross-connect-orders", "POST /colocation/remote-hands-tickets", "POST /colocation/power-circuits/{circuit_id}/energize", "POST /colocation/contracts/{contract_id}/state"] }
  - { id: ERR_CABINET_COMMIT_EXCEEDED, http_status: 422, condition: "Projected count of the contract's occupying cabinets would exceed committed_cabinet_count", applies_to: ["POST /colocation/cabinets", "POST /colocation/cabinets/{cabinet_id}/state"] }
  - { id: ERR_POWER_COMMIT_EXCEEDED, http_status: 422, condition: "Projected contract provisioned_power_kw would exceed power_commit_kw * 1.10", applies_to: ["POST /colocation/power-circuits/{circuit_id}/energize"] }
  - { id: ERR_CROSS_CONNECT_CAP_EXCEEDED, http_status: 422, condition: "Projected count of the contract's non-terminal cross-connect orders would exceed cross_connect_cap", applies_to: ["POST /colocation/cross-connect-orders"] }

# =============================================================================
# §1.7 RBAC Permission Matrix
# Header contract: X-Role names the acting role; X-User-ID names the acting
# individual and is required on every write. For CustomerAdmin, X-User-ID is
# the Customer.id (entity_backed identity) and scopes every read and write to
# that customer's rows. For all other roles X-User-ID is an opaque staff
# identifier used only for segregation-of-duties comparisons.
# =============================================================================
roles:
  - name: CustomerAdmin
    description: "Customer-side administrator. Sees and acts only inside its own customer's data; raises cross-connects, remote-hands tickets, visits and decommissions."
    identity: "entity_backed:Customer"
    exclusive_operations: []
    shared_operations:
      - "POST /colocation/contacts"
      - "POST /colocation/cross-connect-orders"
      - "POST /colocation/cross-connect-orders/{order_id}/request-changes"
      - "POST /colocation/remote-hands-tickets"
      - "POST /colocation/remote-hands-tickets/{ticket_id}/authorization"
      - "POST /colocation/access-visits"
      - "POST /colocation/decommission-orders"
      - "POST /colocation/_clock/set_current_utc"
      - "All GET endpoints except /colocation/rows"

  - name: ProvisioningEngineer
    description: "Floor engineer. Designs and energizes power, proposes cross-connect routes, dispatches and completes remote hands, executes decommission steps and port release."
    identity: opaque
    exclusive_operations:
      - "POST /colocation/power-circuits"
      - "POST /colocation/power-circuits/{circuit_id}/energize"
      - "POST /colocation/cross-connect-orders/{order_id}/propose-route"
      - "POST /colocation/remote-hands-tickets/{ticket_id}/dispatch"
      - "POST /colocation/remote-hands-tickets/{ticket_id}/complete"
      - "POST /colocation/decommission-orders/{order_id}/record-step"
      - "POST /colocation/decommission-orders/{order_id}/release-ports"
    shared_operations:
      - "POST /colocation/cabinets"
      - "POST /colocation/cabinets/{cabinet_id}/state"
      - "POST /colocation/power-circuits/{circuit_id}/state"
      - "POST /colocation/patch-panel-ports"
      - "POST /colocation/cross-connect-orders"
      - "POST /colocation/cross-connect-orders/{order_id}/state"
      - "POST /colocation/remote-hands-tickets"
      - "POST /colocation/decommission-orders"
      - "POST /colocation/decommission-orders/{order_id}/state"
      - "POST /colocation/_clock/set_current_utc"

  - name: FacilityManager
    description: "Data-hall owner. Owns floor rows and their limits, approves cross-connect routes and decommissions, and rejects proposed routes."
    identity: opaque
    exclusive_operations:
      - "POST /colocation/rows"
      - "PATCH /colocation/rows/{row_id}"
    shared_operations:
      - "POST /colocation/customers"
      - "POST /colocation/contracts"
      - "POST /colocation/contracts/{contract_id}/state"
      - "POST /colocation/cabinets"
      - "POST /colocation/cabinets/{cabinet_id}/state"
      - "POST /colocation/power-circuits/{circuit_id}/state"
      - "POST /colocation/power-circuits/{circuit_id}/readings"
      - "POST /colocation/patch-panel-ports"
      - "POST /colocation/cross-connect-orders/{order_id}/request-changes"
      - "POST /colocation/cross-connect-orders/{order_id}/state"
      - "POST /colocation/decommission-orders/{order_id}/state"
      - "POST /colocation/_clock/set_current_utc"

  - name: SecurityOfficer
    description: "Site security. Owns biometric enrollment, escorting and visit check-in/check-out, and may authorize remote-hands tickets."
    identity: opaque
    exclusive_operations:
      - "POST /colocation/contacts/{contact_id}/biometric-state"
      - "POST /colocation/access-visits/{visit_id}/state"
    shared_operations:
      - "POST /colocation/contacts"
      - "POST /colocation/remote-hands-tickets/{ticket_id}/authorization"
      - "POST /colocation/access-visits"
      - "POST /colocation/_clock/set_current_utc"

  - name: BillingOperator
    description: "Revenue operations. Owns contracts' fiscal state, period closes, credit holds and invoice-line reversals."
    identity: opaque
    exclusive_operations:
      - "POST /colocation/contracts/{contract_id}/credit-hold"
      - "POST /colocation/contracts/{contract_id}/billing-close"
      - "POST /colocation/contracts/{contract_id}/invoice-adjustments"
    shared_operations:
      - "POST /colocation/customers"
      - "POST /colocation/contracts"
      - "POST /colocation/contracts/{contract_id}/state"
      - "POST /colocation/power-circuits/{circuit_id}/readings"
      - "POST /colocation/_clock/set_current_utc"
