scenario: "1058. Virtual-Events & Webinar Platform: event & registration/ticket, session & speaker/track, streaming & recording, sponsor/virtual-booth & lead, networking/matchmaking, on-demand & gating, analytics, billing"
domain_name: virtual-events-webinar-platform
api_prefix: "/api"

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
  entity_topology: graph
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_level: Expert
  notes: |
    Sessions occupy half-open [starts_at, ends_at) slots on Track resources while the
    same Session also occupies a buffered window on each accepted Speaker's
    calendar — two different interval geometries over the same underlying timestamps.
    Registration carries two independent state axes (payment_status x attendance_status).
    SessionSpeaker is a many-to-many junction with a cyclic invite/withdraw/re-invite loop.
    Ticket pricing is charged provisionally at registration and re-derived at settlement
    from observed facts, so the two variants diverge for the same row.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Event
    parent: null
    common_fields: true
    fields:
      - name: organizer_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the Organizer who created the event; ownership checks compare X-User-ID to this value."
      - name: name
        type: string
        source: input
        description: "Public event name."
      - name: timezone
        type: string
        source: input
        description: "IANA timezone label used for display only; all stored timestamps are UTC."
      - name: starts_at
        type: datetime
        source: input
        description: "Event window start (ISO 8601 UTC)."
      - name: ends_at
        type: datetime
        source: input
        description: "Event window end (ISO 8601 UTC); must be strictly after starts_at."
      - name: early_bird_ends_at
        type: datetime
        source: input
        description: "Instant at which early-bird pricing stops applying; early-bird applies when the pricing clock is strictly before this value."
      - name: capacity
        type: integer
        source: input
        description: "Maximum number of seat-holding registrations across all ticket types."
        constraints: ">= 1"
      - name: state
        type: enum
        source: computed
        description: "Event lifecycle state."
        default: DRAFT
        constraints: "DRAFT | PUBLISHED | LIVE | ENDED | SETTLED | CANCELLED"
      - name: registered_count
        type: integer
        source: computed
        description: "Count of Registration rows on this event with attendance_status NOT IN {WAITLISTED, WITHDRAWN}."
        default: 0
      - name: gross_collected_cents
        type: integer
        source: computed
        description: "Running sum of Registration.amount_paid_cents over registrations of this event whose payment_status == PAID."
        default: 0
      - name: streamed_minutes_total
        type: integer
        source: computed
        description: "Running sum of Broadcast.streamed_minutes over broadcasts of this event's sessions that reached ENDED."
        default: 0
      - name: published_recording_count
        type: integer
        source: computed
        description: "Count of Recording rows of this event currently in state PUBLISHED."
        default: 0
      - name: settlement_adjustment_cents
        type: integer
        source: computed
        description: "Sum over PAID registrations of (final_amount_due_cents - amount_paid_cents); written by the event settlement calculation."
        default: 0

  - name: TicketType
    parent: Event
    common_fields: true
    fields:
      - name: event_id
        type: string
        source: input
        description: "FK -> Event.id; owning event, taken from the path."
      - name: name
        type: string
        source: input
        description: "Ticket type label."
      - name: tier
        type: enum
        source: input
        description: "Pricing tier; VIP adds VIP_SURCHARGE_CENTS to the list price."
        constraints: "GENERAL | VIP | SPONSOR | SPEAKER"
      - name: price_cents
        type: integer
        source: input
        description: "List price in cents before surcharge, discounts and processing fee."
        constraints: ">= 0"
      - name: quota
        type: integer
        source: input
        description: "Maximum number of seat-holding registrations on this ticket type."
        constraints: ">= 1"
      - name: gating_level
        type: enum
        source: input
        description: "Which consumption channels this ticket unlocks."
        constraints: "LIVE_ONLY | ON_DEMAND | BOTH"
      - name: sold_count
        type: integer
        source: computed
        description: "Count of Registration rows on this ticket type with attendance_status NOT IN {WAITLISTED, WITHDRAWN}."
        default: 0
      - name: availability_status
        type: enum
        source: computed
        description: "Derived from sold_count vs quota by the ticket_availability calculation."
        default: AVAILABLE
        constraints: "AVAILABLE | SOLD_OUT"

  - name: Registration
    parent: Event
    common_fields: true
    fields:
      - name: event_id
        type: string
        source: input
        description: "FK -> Event.id; the event being registered for."
      - name: ticket_type_id
        type: string
        source: input
        description: "FK -> TicketType.id; the ticket purchased."
      - name: attendee_email
        type: string
        source: input
        description: "Attendee contact email; unique per event."
      - name: group_code
        type: string
        source: input
        description: "Optional group booking code shared by co-registering attendees."
        default: null
      - name: group_size
        type: integer
        source: input
        description: "Group size CLAIMED by the registrant at registration time; used only by the provisional pricing variant."
        default: 1
        constraints: ">= 1"
      - name: payment_status
        type: enum
        source: computed
        description: "Payment state axis, independent of attendance_status."
        default: UNPAID
        constraints: "UNPAID | PAID | REFUNDED"
      - name: attendance_status
        type: enum
        source: computed
        description: "Attendance state axis, independent of payment_status."
        default: REGISTERED
        constraints: "WAITLISTED | REGISTERED | CHECKED_IN | ATTENDED | NO_SHOW | WITHDRAWN"
      - name: amount_due_cents
        type: integer
        source: computed
        description: "Provisional charge computed by registration_amount_due (variant provisional) at creation or waitlist promotion."
        default: 0
      - name: amount_paid_cents
        type: integer
        source: computed
        description: "Cents actually collected; set on pay, zeroed on refund."
        default: 0
      - name: final_amount_due_cents
        type: integer
        source: computed
        description: "Charge re-derived by registration_amount_due (variant final) during event settlement; null until settlement runs."
        default: null
      - name: watched_minutes
        type: integer
        source: computed
        description: "Cumulative live session minutes recorded for this registration via session attendance posts."
        default: 0
      - name: accepted_meeting_count
        type: integer
        source: computed
        description: "Count of MatchRequest rows in state ACCEPTED where this registration is requester or target."
        default: 0

  - name: Track
    parent: Event
    common_fields: true
    fields:
      - name: event_id
        type: string
        source: input
        description: "FK -> Event.id; the event this track belongs to."
      - name: name
        type: string
        source: input
        description: "Track label (e.g. 'Main Stage')."
      - name: scheduled_session_count
        type: integer
        source: computed
        description: "Count of Session rows on this track with state IN {SCHEDULED, LIVE, COMPLETED}."
        default: 0

  - name: Session
    parent: Event
    common_fields: true
    fields:
      - name: event_id
        type: string
        source: input
        description: "FK -> Event.id; owning event."
      - name: track_id
        type: string
        source: input
        description: "FK -> Track.id; the track resource whose [starts_at, ends_at) slot this session occupies once SCHEDULED."
      - name: title
        type: string
        source: input
        description: "Session title."
      - name: starts_at
        type: datetime
        source: input
        description: "Session slot start, inclusive (ISO 8601 UTC)."
      - name: ends_at
        type: datetime
        source: input
        description: "Session slot end, exclusive (ISO 8601 UTC); must be strictly after starts_at."
      - name: session_type
        type: enum
        source: input
        description: "Delivery mode."
        constraints: "LIVE | SIMULIVE | ON_DEMAND"
      - name: capacity
        type: integer
        source: input
        description: "Maximum concurrent live viewers for this session."
        constraints: ">= 1"
      - name: state
        type: enum
        source: computed
        description: "Session lifecycle state."
        default: DRAFT
        constraints: "DRAFT | SCHEDULED | LIVE | COMPLETED | CANCELLED"
      - name: accepted_speaker_count
        type: integer
        source: computed
        description: "Count of SessionSpeaker rows on this session in state ACCEPTED."
        default: 0

  - name: Speaker
    parent: Event
    common_fields: true
    fields:
      - name: event_id
        type: string
        source: input
        description: "FK -> Event.id; the event this speaker profile belongs to."
      - name: full_name
        type: string
        source: input
        description: "Speaker display name."
      - name: email
        type: string
        source: input
        description: "Speaker contact email; unique per event."
      - name: accepted_session_count
        type: integer
        source: computed
        description: "Count of SessionSpeaker rows for this speaker in state ACCEPTED."
        default: 0
      - name: engagement_status
        type: enum
        source: computed
        description: "ENGAGED when accepted_session_count >= 1, otherwise UNASSIGNED."
        default: UNASSIGNED
        constraints: "UNASSIGNED | ENGAGED"

  - name: SessionSpeaker
    parent: Session
    common_fields: true
    fields:
      - name: session_id
        type: string
        source: input
        description: "FK -> Session.id; the session the speaker is invited to."
      - name: speaker_id
        type: string
        source: input
        description: "FK -> Speaker.id; the invited speaker."
      - name: speaking_role
        type: enum
        source: input
        description: "Role of the speaker in this session."
        constraints: "HOST | PANELIST | MODERATOR"
      - name: state
        type: enum
        source: computed
        description: "Invitation lifecycle; supports a WITHDRAWN -> INVITED re-invite cycle."
        default: INVITED
        constraints: "INVITED | ACCEPTED | DECLINED | WITHDRAWN | RELEASED"
      - name: invite_round
        type: integer
        source: computed
        description: "Number of times this junction row has entered INVITED; starts at 1 and increments on every re-invite."
        default: 1

  - name: Broadcast
    parent: Session
    common_fields: true
    fields:
      - name: session_id
        type: string
        source: input
        description: "FK -> Session.id; the session being streamed."
      - name: ingest_region
        type: enum
        source: input
        description: "Streaming ingest region."
        constraints: "US_EAST | US_WEST | EU_WEST | AP_SOUTH"
      - name: state
        type: enum
        source: computed
        description: "Broadcast lifecycle state."
        default: SCHEDULED
        constraints: "SCHEDULED | PREVIEW | LIVE | ENDED | ABORTED"
      - name: started_at
        type: datetime
        source: computed
        description: "Logical-clock instant at which the broadcast entered LIVE; null before that."
        default: null
      - name: ended_at
        type: datetime
        source: computed
        description: "Logical-clock instant at which the broadcast entered ENDED; null before that."
        default: null
      - name: streamed_minutes
        type: integer
        source: computed
        description: "floor((ended_at - started_at) / 60s); 0 unless the broadcast reached ENDED."
        default: 0

  - name: Recording
    parent: Broadcast
    common_fields: true
    fields:
      - name: broadcast_id
        type: string
        source: system
        description: "FK -> Broadcast.id; the broadcast that produced this recording."
      - name: session_id
        type: string
        source: system
        description: "FK -> Session.id; denormalized from the producing broadcast."
      - name: event_id
        type: string
        source: system
        description: "FK -> Event.id; denormalized from the producing session."
      - name: state
        type: enum
        source: computed
        description: "Recording lifecycle; RETRACTED can re-enter PROCESSING via reprocess."
        default: PENDING
        constraints: "PENDING | PROCESSING | READY | PUBLISHED | RETRACTED | DELETED"
      - name: duration_seconds
        type: integer
        source: input
        description: "Encoded asset duration in seconds, supplied when processing completes."
        default: 0
      - name: gating_level
        type: enum
        source: input
        description: "Minimum ticket entitlement required to view this recording on demand; set at publish."
        default: ON_DEMAND
        constraints: "ON_DEMAND | BOTH"
      - name: view_count
        type: integer
        source: computed
        description: "Number of successful on-demand view registrations against this recording."
        default: 0

  - name: Sponsor
    parent: Event
    common_fields: true
    fields:
      - name: event_id
        type: string
        source: input
        description: "FK -> Event.id; the event being sponsored."
      - name: name
        type: string
        source: input
        description: "Sponsoring company name."
      - name: package_tier
        type: enum
        source: input
        description: "Sponsorship package; drives PACKAGE_PRICE_CENTS."
        constraints: "BRONZE | SILVER | GOLD"
      - name: contact_email
        type: string
        source: input
        description: "Sponsor contact email."
      - name: contract_status
        type: enum
        source: computed
        description: "Contract posture; booth approval requires SIGNED."
        default: UNSIGNED
        constraints: "UNSIGNED | SIGNED"

  - name: Booth
    parent: Sponsor
    common_fields: true
    fields:
      - name: sponsor_id
        type: string
        source: input
        description: "FK -> Sponsor.id; the sponsor operating this virtual booth."
      - name: event_id
        type: string
        source: system
        description: "FK -> Event.id; denormalized from the sponsor."
      - name: headline
        type: string
        source: input
        description: "Booth headline copy."
      - name: lead_quota
        type: integer
        source: input
        description: "Number of captured leads included in the sponsorship package; leads beyond this are billed at LEAD_OVERAGE_UNIT_CENTS."
        constraints: ">= 0"
      - name: state
        type: enum
        source: computed
        description: "Booth review lifecycle; branching approve / request-changes with a CHANGES_REQUESTED -> SUBMITTED loop."
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | APPROVED | CHANGES_REQUESTED | LIVE | SUSPENDED"
      - name: captured_lead_count
        type: integer
        source: computed
        description: "Count of Lead rows attached to this booth."
        default: 0
      - name: stream_minutes_total
        type: integer
        source: computed
        description: "Cumulative booth video minutes reported via booth stream-usage posts; billed at BOOTH_STREAM_UNIT_CENTS."
        default: 0
      - name: revision_round
        type: integer
        source: computed
        description: "Number of times this booth has entered SUBMITTED; starts at 0 and increments on every submit."
        default: 0

  - name: Lead
    parent: Booth
    common_fields: true
    fields:
      - name: booth_id
        type: string
        source: input
        description: "FK -> Booth.id; the booth that captured the lead."
      - name: registration_id
        type: string
        source: input
        description: "FK -> Registration.id; the attendee registration behind the lead."
      - name: event_id
        type: string
        source: system
        description: "FK -> Event.id; denormalized from the booth."
      - name: marketing_consent
        type: boolean
        source: input
        description: "Attendee consent to share contact details with the sponsor; must be true to capture."
      - name: booth_visits
        type: integer
        source: computed
        description: "Count of VISIT interactions logged against this lead."
        default: 1
      - name: doc_downloads
        type: integer
        source: computed
        description: "Count of DOWNLOAD interactions logged against this lead."
        default: 0
      - name: score
        type: integer
        source: computed
        description: "Lead score produced by the lead_score calculation; capped at LEAD_SCORE_CAP."
        default: 0
      - name: score_variant
        type: enum
        source: computed
        description: "Which lead_score variant last wrote score."
        default: BOOTH_WEIGHTED
        constraints: "BOOTH_WEIGHTED | ENGAGEMENT_WEIGHTED"
      - name: is_hot
        type: boolean
        source: computed
        description: "True when score >= HOT_LEAD_THRESHOLD."
        default: false

  - name: MatchRequest
    parent: Event
    common_fields: true
    fields:
      - name: event_id
        type: string
        source: input
        description: "FK -> Event.id; the event the networking meeting belongs to."
      - name: requester_registration_id
        type: string
        source: input
        description: "FK -> Registration.id; the registration asking for the meeting."
      - name: target_registration_id
        type: string
        source: input
        description: "FK -> Registration.id; the registration being asked."
      - name: window_start
        type: datetime
        source: input
        description: "Proposed meeting window start, inclusive (ISO 8601 UTC)."
      - name: window_end
        type: datetime
        source: input
        description: "Proposed meeting window end, inclusive (ISO 8601 UTC); must be strictly after window_start."
      - name: expires_at
        type: datetime
        source: computed
        description: "window_start minus MATCH_EXPIRY_LEAD_MINUTES; a PENDING request at or past this instant is expired by the matchmaking sweep."
      - name: state
        type: enum
        source: computed
        description: "Meeting request lifecycle."
        default: PENDING
        constraints: "PENDING | ACCEPTED | DECLINED | EXPIRED | CANCELLED"

  - name: Settlement
    parent: Event
    common_fields: true
    fields:
      - name: event_id
        type: string
        source: input
        description: "FK -> Event.id; the event the settlement invoice covers."
      - name: sponsor_id
        type: string
        source: input
        description: "FK -> Sponsor.id; set only when subject_type == SPONSOR, otherwise null."
        default: null
      - name: subject_type
        type: enum
        source: computed
        description: "EVENT for organizer platform-fee settlements, SPONSOR for sponsorship invoices."
        constraints: "EVENT | SPONSOR"
      - name: state
        type: enum
        source: computed
        description: "Invoice lifecycle."
        default: DRAFT
        constraints: "DRAFT | ISSUED | PAID | VOID"
      - name: line_items
        type: array
        source: computed
        description: "Ordered list of {label, units, unit_cents, line_total_cents} objects produced by the settlement calculation."
      - name: subtotal_cents
        type: integer
        source: computed
        description: "Sum of the per-line rounded line_total_cents values."
        default: 0
      - name: tax_cents
        type: integer
        source: computed
        description: "Tax applied once over subtotal_cents (SPONSOR settlements only; 0 for EVENT settlements)."
        default: 0
      - name: platform_fee_cents
        type: integer
        source: computed
        description: "Discounted, floored platform fee (EVENT settlements only; 0 for SPONSOR settlements)."
        default: 0
      - name: total_cents
        type: integer
        source: computed
        description: "Amount invoiced to the subject."
        default: 0
      - name: organizer_payout_cents
        type: integer
        source: computed
        description: "gross_ticket_cents - total_cents for EVENT settlements; 0 for SPONSOR settlements. May be negative."
        default: 0
      - name: issued_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the FinanceAdmin who issued this settlement; the segregation-of-duties check compares it to the payer."
        default: null
      - name: paid_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the FinanceAdmin who marked this settlement PAID."
        default: null

state_machines:
  - entity: Event
    initial_state: DRAFT
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /api/events/{event_id}/publish"
        actor: Organizer
        preconditions:
          - "event.state == DRAFT"
          - "at least one TicketType exists with event_id == event.id"
          - "acting X-User-ID == event.organizer_user_id"
        side_effects:
          - "registration becomes permitted (validations priority 30 gate opens)"
          - "increments Event.version by 1"
      - from: PUBLISHED
        to: LIVE
        trigger: "POST /api/events/{event_id}/start"
        actor: Organizer
        preconditions:
          - "event.state == PUBLISHED"
          - "acting X-User-ID == event.organizer_user_id"
        side_effects:
          - "every Booth of this event with state == APPROVED transitions to LIVE"
          - "increments Event.version by 1"
      - from: LIVE
        to: ENDED
        trigger: "POST /api/events/{event_id}/end"
        actor: Organizer
        preconditions:
          - "event.state == LIVE"
          - "no Broadcast of this event is in state IN {PREVIEW, LIVE}"
        side_effects:
          - "every Registration of this event with attendance_status == REGISTERED transitions to NO_SHOW"
          - "every Registration of this event with attendance_status == CHECKED_IN and watched_minutes < ATTENDANCE_MIN_MINUTES transitions to NO_SHOW"
          - "every Registration of this event with attendance_status == CHECKED_IN and watched_minutes >= ATTENDANCE_MIN_MINUTES transitions to ATTENDED"
          - "increments Event.version by 1"
      - from: ENDED
        to: SETTLED
        trigger: "POST /api/settlements/{settlement_id}/issue on the EVENT settlement of this event"
        actor: FinanceAdmin
        preconditions:
          - "event.state == ENDED"
          - "settlement.subject_type == EVENT and settlement.event_id == event.id"
        side_effects:
          - "Event.state becomes SETTLED"
          - "increments Event.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /api/events/{event_id}/cancel"
        actor: Organizer
        preconditions:
          - "event.state == DRAFT"
          - "acting X-User-ID == event.organizer_user_id"
        side_effects:
          - "every Session of this event with state IN {DRAFT, SCHEDULED, LIVE} transitions to CANCELLED (cascade link 1)"
          - "increments Event.version by 1"
      - from: PUBLISHED
        to: CANCELLED
        trigger: "POST /api/events/{event_id}/cancel"
        actor: Organizer
        preconditions:
          - "event.state == PUBLISHED"
          - "acting X-User-ID == event.organizer_user_id"
        side_effects:
          - "CASCADE-A link 1: every Session of this event with state IN {DRAFT, SCHEDULED, LIVE} transitions to CANCELLED"
          - "CASCADE-A link 2: because each of those Sessions became CANCELLED, its Broadcast rows with state IN {SCHEDULED, PREVIEW, LIVE} transition to ABORTED"
          - "CASCADE-A link 3: because each of those Broadcasts became ABORTED, its Recording rows with state IN {PENDING, PROCESSING, READY, PUBLISHED} transition to RETRACTED, and Event.published_recording_count is decremented by one for each such Recording that was PUBLISHED"
          - "every Registration of this event with payment_status == PAID keeps payment_status (refunds are issued explicitly)"
          - "increments Event.version by 1"
      - from: LIVE
        to: CANCELLED
        trigger: "POST /api/events/{event_id}/cancel"
        actor: Organizer
        preconditions:
          - "event.state == LIVE"
          - "acting X-User-ID == event.organizer_user_id"
        side_effects:
          - "same three-link CASCADE-A chain as the PUBLISHED -> CANCELLED transition"
          - "increments Event.version by 1"

  - entity: Registration
    initial_state: "payment_status=UNPAID x attendance_status=REGISTERED (or WAITLISTED when the ticket type is SOLD_OUT and waitlist_if_full is true)"
    terminal_states: [WITHDRAWN, ATTENDED, NO_SHOW]
    note: |
      PARALLEL DIMENSIONS. payment_status (UNPAID -> PAID -> REFUNDED) and
      attendance_status (WAITLISTED -> REGISTERED -> CHECKED_IN -> {ATTENDED, NO_SHOW},
      and * -> WITHDRAWN) advance independently on the same row: check-in does not
      require PAID, and paying does not change attendance_status.
    transitions:
      - from: "payment_status=UNPAID"
        to: "payment_status=PAID"
        trigger: "POST /api/registrations/{registration_id}/pay"
        actor: Organizer
        preconditions:
          - "registration.payment_status == UNPAID"
          - "registration.attendance_status != WITHDRAWN"
          - "registration.attendance_status != WAITLISTED"
          - "request amount_cents == registration.amount_due_cents"
        side_effects:
          - "Registration.amount_paid_cents = amount_cents"
          - "Event.gross_collected_cents += amount_cents (money-conservation invariant)"
      - from: "payment_status=PAID"
        to: "payment_status=REFUNDED"
        trigger: "POST /api/registrations/{registration_id}/refund"
        actor: Organizer
        preconditions:
          - "registration.payment_status == PAID"
        side_effects:
          - "CASCADE-B link 1: because payment_status became REFUNDED, Event.gross_collected_cents -= Registration.amount_paid_cents, Registration.amount_paid_cents = 0, and attendance_status transitions to WITHDRAWN, which decrements TicketType.sold_count by 1 and Event.registered_count by 1"
          - "CASCADE-B link 2: because TicketType.sold_count dropped below TicketType.quota, the ticket_availability calculation flips TicketType.availability_status from SOLD_OUT to AVAILABLE"
          - "CASCADE-B link 3: because availability_status became AVAILABLE, the Registration on that ticket type with attendance_status == WAITLISTED and the earliest created_at is promoted to attendance_status REGISTERED, its amount_due_cents is written by registration_amount_due (variant provisional) at the current logical clock, TicketType.sold_count is incremented back by 1 and Event.registered_count by 1"
      - from: "attendance_status=WAITLISTED"
        to: "attendance_status=REGISTERED"
        trigger: "system: waitlist promotion during CASCADE-B link 3"
        actor: system
        preconditions:
          - "registration.attendance_status == WAITLISTED"
          - "the registration has the earliest created_at among WAITLISTED registrations on that ticket type"
          - "TicketType.availability_status == AVAILABLE"
        side_effects:
          - "amount_due_cents written by registration_amount_due (variant provisional)"
          - "TicketType.sold_count += 1; Event.registered_count += 1"
      - from: "attendance_status=REGISTERED"
        to: "attendance_status=CHECKED_IN"
        trigger: "POST /api/registrations/{registration_id}/check-in"
        actor: Organizer
        preconditions:
          - "registration.attendance_status == REGISTERED"
          - "event.state == LIVE"
        side_effects:
          - "registration becomes eligible to accumulate watched_minutes"
      - from: "attendance_status=CHECKED_IN"
        to: "attendance_status=ATTENDED"
        trigger: "system: POST /api/events/{event_id}/end when watched_minutes >= ATTENDANCE_MIN_MINUTES"
        actor: system
        preconditions:
          - "registration.attendance_status == CHECKED_IN"
          - "registration.watched_minutes >= ATTENDANCE_MIN_MINUTES"
        side_effects:
          - "counted as a unique attendee by event_analytics_snapshot"
      - from: "attendance_status=CHECKED_IN"
        to: "attendance_status=NO_SHOW"
        trigger: "system: POST /api/events/{event_id}/end when watched_minutes < ATTENDANCE_MIN_MINUTES"
        actor: system
        preconditions:
          - "registration.attendance_status == CHECKED_IN"
          - "registration.watched_minutes < ATTENDANCE_MIN_MINUTES"
        side_effects:
          - "excluded from unique_attendees by event_analytics_snapshot"
      - from: "attendance_status=REGISTERED"
        to: "attendance_status=NO_SHOW"
        trigger: "system: POST /api/events/{event_id}/end"
        actor: system
        preconditions:
          - "registration.attendance_status == REGISTERED"
        side_effects:
          - "excluded from unique_attendees by event_analytics_snapshot"
      - from: "attendance_status IN {WAITLISTED, REGISTERED, CHECKED_IN}"
        to: "attendance_status=WITHDRAWN"
        trigger: "POST /api/registrations/{registration_id}/withdraw"
        actor: "Organizer | Attendee"
        preconditions:
          - "registration.attendance_status IN {WAITLISTED, REGISTERED, CHECKED_IN}"
          - "when acting as Attendee, X-User-ID == registration.id"
        side_effects:
          - "when the prior attendance_status was NOT WAITLISTED: TicketType.sold_count -= 1 and Event.registered_count -= 1 (seat-inventory conservation invariant)"
          - "TicketType.availability_status recomputed by ticket_availability"
          - "every MatchRequest of this registration with state == PENDING transitions to CANCELLED"

  - entity: SessionSpeaker
    initial_state: INVITED
    terminal_states: [DECLINED, RELEASED]
    note: "CYCLIC: INVITED -> ACCEPTED -> WITHDRAWN -> INVITED, unbounded rounds tracked by invite_round."
    transitions:
      - from: INVITED
        to: ACCEPTED
        trigger: "POST /api/session-speakers/{session_speaker_id}/accept"
        actor: SpeakerUser
        preconditions:
          - "session_speaker.state == INVITED"
          - "acting X-User-ID == session_speaker.speaker_id"
          - "session.state IN {DRAFT, SCHEDULED}"
          - "the session's [starts_at, ends_at] window does not fall within SPEAKER_TRANSITION_BUFFER_MINUTES of any other session for which this speaker already has an ACCEPTED SessionSpeaker row"
        side_effects:
          - "Speaker.accepted_session_count += 1"
          - "because accepted_session_count became >= 1, Speaker.engagement_status becomes ENGAGED"
          - "Session.accepted_speaker_count += 1"
      - from: INVITED
        to: DECLINED
        trigger: "POST /api/session-speakers/{session_speaker_id}/decline"
        actor: SpeakerUser
        preconditions:
          - "session_speaker.state == INVITED"
          - "acting X-User-ID == session_speaker.speaker_id"
        side_effects:
          - "no counter changes"
      - from: ACCEPTED
        to: WITHDRAWN
        trigger: "POST /api/session-speakers/{session_speaker_id}/withdraw"
        actor: SpeakerUser
        preconditions:
          - "session_speaker.state == ACCEPTED"
          - "acting X-User-ID == session_speaker.speaker_id"
          - "session.state != COMPLETED"
        side_effects:
          - "Speaker.accepted_session_count -= 1"
          - "because accepted_session_count fell to 0, Speaker.engagement_status becomes UNASSIGNED"
          - "Session.accepted_speaker_count -= 1"
      - from: WITHDRAWN
        to: INVITED
        trigger: "POST /api/session-speakers/{session_speaker_id}/reinvite"
        actor: Organizer
        preconditions:
          - "session_speaker.state == WITHDRAWN"
          - "session.state IN {DRAFT, SCHEDULED}"
        side_effects:
          - "SessionSpeaker.invite_round += 1"
      - from: ACCEPTED
        to: RELEASED
        trigger: "system: owning Session transitions to CANCELLED"
        actor: system
        preconditions:
          - "session_speaker.state == ACCEPTED"
          - "session.state == CANCELLED"
        side_effects:
          - "Speaker.accepted_session_count -= 1 and engagement_status recomputed"
          - "Session.accepted_speaker_count -= 1"
      - from: INVITED
        to: RELEASED
        trigger: "system: owning Session transitions to CANCELLED"
        actor: system
        preconditions:
          - "session_speaker.state == INVITED"
          - "session.state == CANCELLED"
        side_effects:
          - "no counter changes"

  - entity: Session
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /api/sessions/{session_id}/schedule"
        actor: Organizer
        preconditions:
          - "session.state == DRAFT"
          - "event.state IN {DRAFT, PUBLISHED}"
          - "no other Session on the same track_id with state IN {SCHEDULED, LIVE, COMPLETED} has a half-open [starts_at, ends_at) interval overlapping this session's interval"
        side_effects:
          - "Track.scheduled_session_count += 1"
      - from: SCHEDULED
        to: LIVE
        trigger: "system: POST /api/broadcasts/{broadcast_id}/go-live on this session's broadcast"
        actor: system
        preconditions:
          - "session.state == SCHEDULED"
          - "event.state == LIVE"
        side_effects:
          - "session becomes the live consumption surface"
      - from: LIVE
        to: COMPLETED
        trigger: "system: POST /api/broadcasts/{broadcast_id}/end on this session's broadcast"
        actor: system
        preconditions:
          - "session.state == LIVE"
        side_effects:
          - "Event.streamed_minutes_total += Broadcast.streamed_minutes"
      - from: "state IN {DRAFT, SCHEDULED, LIVE}"
        to: CANCELLED
        trigger: "POST /api/sessions/{session_id}/cancel, or system cascade from Event cancellation"
        actor: "Organizer | system"
        preconditions:
          - "session.state IN {DRAFT, SCHEDULED, LIVE}"
        side_effects:
          - "if prior state was SCHEDULED or LIVE: Track.scheduled_session_count -= 1"
          - "every SessionSpeaker of this session with state IN {INVITED, ACCEPTED} transitions to RELEASED"
          - "every Broadcast of this session with state IN {SCHEDULED, PREVIEW, LIVE} transitions to ABORTED"

  - entity: Broadcast
    initial_state: SCHEDULED
    terminal_states: [ENDED, ABORTED]
    transitions:
      - from: SCHEDULED
        to: PREVIEW
        trigger: "POST /api/broadcasts/{broadcast_id}/preview"
        actor: Organizer
        preconditions:
          - "broadcast.state == SCHEDULED"
          - "session.state == SCHEDULED"
        side_effects:
          - "ingest slot reserved"
      - from: PREVIEW
        to: LIVE
        trigger: "POST /api/broadcasts/{broadcast_id}/go-live"
        actor: Organizer
        preconditions:
          - "broadcast.state == PREVIEW"
          - "session.state == SCHEDULED"
          - "event.state == LIVE (cross-entity dependency Broadcast -> Event)"
          - "session.accepted_speaker_count >= 1"
        side_effects:
          - "Broadcast.started_at = current logical clock"
          - "Session transitions SCHEDULED -> LIVE"
          - "a Recording row is created in state PENDING with broadcast_id, session_id and event_id set"
      - from: LIVE
        to: ENDED
        trigger: "POST /api/broadcasts/{broadcast_id}/end"
        actor: Organizer
        preconditions:
          - "broadcast.state == LIVE"
        side_effects:
          - "Broadcast.ended_at = current logical clock; Broadcast.streamed_minutes = floor((ended_at - started_at) / 60 seconds)"
          - "Event.streamed_minutes_total += Broadcast.streamed_minutes"
          - "Session transitions LIVE -> COMPLETED"
          - "the broadcast's Recording transitions PENDING -> PROCESSING"
      - from: "state IN {SCHEDULED, PREVIEW, LIVE}"
        to: ABORTED
        trigger: "POST /api/broadcasts/{broadcast_id}/abort, or system cascade from Session cancellation"
        actor: "Organizer | system"
        preconditions:
          - "broadcast.state IN {SCHEDULED, PREVIEW, LIVE}"
        side_effects:
          - "the broadcast's Recording rows with state IN {PENDING, PROCESSING, READY, PUBLISHED} transition to RETRACTED"
          - "for each such Recording that was PUBLISHED, Event.published_recording_count -= 1"

  - entity: Recording
    initial_state: PENDING
    terminal_states: [DELETED]
    note: "CYCLIC: PUBLISHED -> RETRACTED -> PROCESSING -> READY -> PUBLISHED."
    transitions:
      - from: PROCESSING
        to: READY
        trigger: "POST /api/recordings/{recording_id}/complete"
        actor: PlatformAdmin
        preconditions:
          - "recording.state == PROCESSING"
        side_effects:
          - "Recording.duration_seconds = request duration_seconds"
      - from: READY
        to: PUBLISHED
        trigger: "POST /api/recordings/{recording_id}/publish"
        actor: Organizer
        preconditions:
          - "recording.state == READY"
          - "recording.duration_seconds > 0"
        side_effects:
          - "Recording.gating_level = request gating_level"
          - "Event.published_recording_count += 1"
      - from: PUBLISHED
        to: RETRACTED
        trigger: "POST /api/recordings/{recording_id}/retract, or system cascade from Broadcast abort"
        actor: "Organizer | system"
        preconditions:
          - "recording.state == PUBLISHED"
        side_effects:
          - "Event.published_recording_count -= 1"
          - "further on-demand views are rejected"
      - from: RETRACTED
        to: PROCESSING
        trigger: "POST /api/recordings/{recording_id}/reprocess"
        actor: PlatformAdmin
        preconditions:
          - "recording.state == RETRACTED"
        side_effects:
          - "Recording.duration_seconds reset to 0"
      - from: "state IN {PENDING, PROCESSING, READY, PUBLISHED}"
        to: RETRACTED
        trigger: "system: owning Broadcast transitions to ABORTED"
        actor: system
        preconditions:
          - "broadcast.state == ABORTED"
        side_effects:
          - "if prior state was PUBLISHED: Event.published_recording_count -= 1"
      - from: "state IN {RETRACTED, READY}"
        to: DELETED
        trigger: "DELETE /api/recordings/{recording_id}"
        actor: Organizer
        preconditions:
          - "recording.state IN {RETRACTED, READY}"
        side_effects:
          - "recording excluded from all list endpoints"

  - entity: Booth
    initial_state: DRAFT
    terminal_states: [SUSPENDED]
    note: "BRANCHING with revision loop: SUBMITTED forks to APPROVED or CHANGES_REQUESTED; CHANGES_REQUESTED returns to SUBMITTED."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/booths/{booth_id}/submit"
        actor: SponsorUser
        preconditions:
          - "booth.state == DRAFT"
          - "acting X-User-ID == booth.sponsor_id"
        side_effects:
          - "Booth.revision_round += 1"
      - from: CHANGES_REQUESTED
        to: SUBMITTED
        trigger: "POST /api/booths/{booth_id}/submit"
        actor: SponsorUser
        preconditions:
          - "booth.state == CHANGES_REQUESTED"
          - "acting X-User-ID == booth.sponsor_id"
        side_effects:
          - "Booth.revision_round += 1"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /api/booths/{booth_id}/approve"
        actor: Organizer
        preconditions:
          - "booth.state == SUBMITTED"
          - "sponsor.contract_status == SIGNED (cross-entity dependency Booth -> Sponsor)"
        side_effects:
          - "booth becomes eligible to go LIVE when the event starts"
      - from: SUBMITTED
        to: CHANGES_REQUESTED
        trigger: "POST /api/booths/{booth_id}/request-changes"
        actor: Organizer
        preconditions:
          - "booth.state == SUBMITTED"
        side_effects:
          - "sponsor must resubmit; revision_round is not changed by this transition"
      - from: APPROVED
        to: LIVE
        trigger: "system: owning Event transitions PUBLISHED -> LIVE"
        actor: system
        preconditions:
          - "booth.state == APPROVED"
          - "event.state == LIVE"
        side_effects:
          - "booth accepts lead capture"
      - from: "state IN {APPROVED, LIVE}"
        to: SUSPENDED
        trigger: "POST /api/booths/{booth_id}/suspend"
        actor: Organizer
        preconditions:
          - "booth.state IN {APPROVED, LIVE}"
        side_effects:
          - "further lead capture on this booth is rejected"

  - entity: MatchRequest
    initial_state: PENDING
    terminal_states: [DECLINED, EXPIRED, CANCELLED]
    transitions:
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /api/match-requests/{match_request_id}/accept"
        actor: Attendee
        preconditions:
          - "match_request.state == PENDING"
          - "acting X-User-ID == match_request.target_registration_id"
          - "current logical clock < match_request.expires_at"
          - "neither the requester nor the target registration already holds an ACCEPTED MatchRequest whose closed [window_start, window_end] interval intersects this request's closed interval"
        side_effects:
          - "requester Registration.accepted_meeting_count += 1"
          - "target Registration.accepted_meeting_count += 1"
      - from: PENDING
        to: DECLINED
        trigger: "POST /api/match-requests/{match_request_id}/decline"
        actor: Attendee
        preconditions:
          - "match_request.state == PENDING"
          - "acting X-User-ID == match_request.target_registration_id"
        side_effects:
          - "no counter changes"
      - from: PENDING
        to: EXPIRED
        trigger: "POST /api/events/{event_id}/matchmaking/sweep"
        actor: Organizer
        preconditions:
          - "match_request.state == PENDING"
          - "current logical clock >= match_request.expires_at"
        side_effects:
          - "counted in the sweep response's expired_count"
      - from: PENDING
        to: CANCELLED
        trigger: "system: requester or target Registration transitions to WITHDRAWN"
        actor: system
        preconditions:
          - "match_request.state == PENDING"
        side_effects:
          - "no counter changes"

  - entity: Settlement
    initial_state: DRAFT
    terminal_states: [PAID, VOID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /api/settlements/{settlement_id}/issue"
        actor: FinanceAdmin
        preconditions:
          - "settlement.state == DRAFT"
        side_effects:
          - "Settlement.issued_by_user_id = acting X-User-ID"
          - "when subject_type == EVENT: the owning Event transitions ENDED -> SETTLED"
      - from: ISSUED
        to: PAID
        trigger: "POST /api/settlements/{settlement_id}/pay"
        actor: FinanceAdmin
        preconditions:
          - "settlement.state == ISSUED"
          - "acting X-User-ID != settlement.issued_by_user_id (segregation of duties)"
          - "request paid_amount_cents == settlement.total_cents"
        side_effects:
          - "Settlement.paid_by_user_id = acting X-User-ID"
      - from: ISSUED
        to: VOID
        trigger: "POST /api/settlements/{settlement_id}/void"
        actor: FinanceAdmin
        preconditions:
          - "settlement.state == ISSUED"
        side_effects:
          - "settlement no longer billable"
      - from: DRAFT
        to: VOID
        trigger: "POST /api/settlements/{settlement_id}/void, or system supersede when a newer EVENT settlement is created for the same event"
        actor: "FinanceAdmin | system"
        preconditions:
          - "settlement.state == DRAFT"
        side_effects:
          - "settlement no longer billable"

concurrency_rules:
  - rule_id: event-settlement-create-stale-version
    parent_entity: Event
    write_endpoint: "POST /api/events/{event_id}/settlements"
    occ_field: "expected_event_version"
    description: |
      Creating an EVENT settlement for an event whose version has advanced since the
      client last read it is rejected with a stale-version error. A newly created EVENT
      settlement legitimately supersedes any prior DRAFT settlement on the same event
      (voiding it), so a writer holding an outdated view of the event must be forced to
      re-read before superseding.
    error_id: ERR_STALE_EVENT_VERSION
    http_status: 412

global_constants:
  SPEAKER_TRANSITION_BUFFER_MINUTES: 10
  MATCH_EXPIRY_LEAD_MINUTES: 60
  MAX_CONCURRENT_MEETINGS_PER_REGISTRATION: 1
  ATTENDANCE_MIN_MINUTES: 15
  DEFAULT_LOGICAL_CLOCK_UTC: "2026-07-01T00:00:00Z"

calculations:
  - name: registration_amount_due
    trigger: "On POST /api/registrations (variant provisional), on waitlist promotion during CASCADE-B link 3 (variant provisional), and on POST /api/events/{event_id}/settlements for every PAID registration of the event (variant final)."
    algorithm: tiered_pricing
    formula: |
      # All amounts are integer cents. round_half_up(x) rounds a rational to the
      # nearest integer cent, halves away from zero.
      # STEP 1 - list price with tier surcharge
      list_price = ticket_type.price_cents
      if ticket_type.tier == "VIP":
          list_price = list_price + VIP_SURCHARGE_CENTS
      # STEP 2 - early-bird component (strict <)
      early_pct = EARLY_BIRD_DISCOUNT_PCT if pricing_clock < event.early_bird_ends_at else 0.0
      # STEP 3 - group component (>=)
      group_pct = GROUP_DISCOUNT_PCT if effective_group_size >= GROUP_MIN_SIZE else 0.0
      # STEP 4 - stacked discount, capped
      discount_pct = min(early_pct + group_pct, MAX_TOTAL_DISCOUNT_PCT)
      # STEP 5 - discounted price, rounded once
      discounted_cents = round_half_up(list_price * (1 - discount_pct))
      # STEP 6 - processing fee, clamped between floor and ceiling
      fee_cents = min(max(round_half_up(discounted_cents * PROCESSING_FEE_PCT),
                          PROCESSING_FEE_MIN_CENTS),
                      PROCESSING_FEE_MAX_CENTS)
      # STEP 7
      amount_cents = discounted_cents + fee_cents
    input_set: |
      Exactly one Registration row and its TicketType and Event. `pricing_clock` and
      `effective_group_size` are supplied by the variant (see variants below). No other
      registrations participate in the provisional variant.
    constants:
      VIP_SURCHARGE_CENTS: 5000
      EARLY_BIRD_DISCOUNT_PCT: 0.20
      GROUP_DISCOUNT_PCT: 0.10
      GROUP_MIN_SIZE: 5
      MAX_TOTAL_DISCOUNT_PCT: 0.25
      PROCESSING_FEE_PCT: 0.03
      PROCESSING_FEE_MIN_CENTS: 100
      PROCESSING_FEE_MAX_CENTS: 2500
    precision: "Integer cents; round_half_up applied exactly twice — once at STEP 5 and once inside STEP 6. Never round the sum."
    writes: "Registration.amount_due_cents (variant provisional); Registration.final_amount_due_cents (variant final)."
    variants:
      - name: provisional
        when: "At registration creation and at waitlist promotion."
        difference: |
          pricing_clock = the current logical clock at the moment of the call.
          effective_group_size = the CLAIMED Registration.group_size supplied in the request
          (defaulting to 1). The claim is not verified against any other row.
      - name: final
        when: "During EVENT settlement creation, for every registration of the event with payment_status == PAID."
        difference: |
          pricing_clock = the registration's own created_at (so early-bird eligibility is
          judged by when the attendee actually registered, not by settlement time).
          effective_group_size = the OBSERVED count of registrations on the same event that
          share the same non-null Registration.group_code and have payment_status == PAID;
          when group_code is null the observed size is 1. A registrant who claimed
          group_size >= GROUP_MIN_SIZE but whose group never materialised therefore receives
          a strictly larger final_amount_due_cents than the amount_due_cents charged at
          registration.

  - name: lead_score
    trigger: "On POST /api/booths/{booth_id}/leads and POST /api/leads/{lead_id}/interactions (variant booth_weighted); on POST /api/events/{event_id}/leads/rescore (variant engagement_weighted)."
    algorithm: weighted_scoring
    formula: |
      # variant booth_weighted
      raw = lead.booth_visits * BOOTH_VISIT_WEIGHT
          + lead.doc_downloads * DOC_DOWNLOAD_WEIGHT
      # variant engagement_weighted additionally folds in the attendee's own behaviour
      # raw = raw + registration.watched_minutes * SESSION_MINUTE_WEIGHT
      #           + registration.accepted_meeting_count * MEETING_ACCEPTED_WEIGHT
      score = min(round_half_up(raw), LEAD_SCORE_CAP)
      is_hot = (score >= HOT_LEAD_THRESHOLD)
    input_set: |
      One Lead row plus, for the engagement_weighted variant only, the single Registration
      referenced by Lead.registration_id. Registrations with attendance_status == WITHDRAWN
      contribute watched_minutes 0 and accepted_meeting_count 0 to the engagement variant.
    constants:
      BOOTH_VISIT_WEIGHT: 3
      DOC_DOWNLOAD_WEIGHT: 5
      SESSION_MINUTE_WEIGHT: 0.5
      MEETING_ACCEPTED_WEIGHT: 12
      LEAD_SCORE_CAP: 100
      HOT_LEAD_THRESHOLD: 60
    precision: "Integer score; round_half_up applied once, after the weighted sum, before the cap."
    writes: "Lead.score, Lead.score_variant, Lead.is_hot."
    variants:
      - name: booth_weighted
        when: "At lead capture and after every booth interaction post."
        difference: "Uses only booth-side counters (booth_visits, doc_downloads); sets score_variant = BOOTH_WEIGHTED."
      - name: engagement_weighted
        when: "On the organizer-triggered event-wide rescore."
        difference: |
          Adds registration.watched_minutes * 0.5 and registration.accepted_meeting_count * 12
          to the same raw sum, so the identical Lead row scores strictly higher (or equal when
          the attendee has zero watched minutes and zero accepted meetings). Sets
          score_variant = ENGAGEMENT_WEIGHTED.

  - name: sponsor_settlement_lines
    trigger: "On POST /api/sponsors/{sponsor_id}/settlements."
    algorithm: waterfall_allocation
    formula: |
      # ROUNDING ORDER IS PINNED: each line item is rounded to whole cents FIRST,
      # then the rounded line totals are summed. Summing unrounded line values and
      # rounding once at the end is WRONG and produces a different subtotal.
      overage_units = max(0, booth.captured_lead_count - booth.lead_quota)
      line_1 = { label: "PACKAGE",      units: 1,                            unit_cents: PACKAGE_PRICE_CENTS[sponsor.package_tier] }
      line_2 = { label: "LEAD_OVERAGE", units: overage_units,                unit_cents: LEAD_OVERAGE_UNIT_CENTS }
      line_3 = { label: "BOOTH_STREAM", units: booth.stream_minutes_total,   unit_cents: BOOTH_STREAM_UNIT_CENTS }
      for each line i in [line_1, line_2, line_3]:
          line_i.line_total_cents = round_half_up(line_i.units * line_i.unit_cents)
      subtotal_cents = line_1.line_total_cents + line_2.line_total_cents + line_3.line_total_cents
      tax_cents      = round_half_up(subtotal_cents * SPONSOR_TAX_PCT)   # single rounding, applied to the rounded subtotal
      total_cents    = subtotal_cents + tax_cents
      platform_fee_cents = 0
      organizer_payout_cents = 0
    input_set: |
      The single Booth whose sponsor_id == sponsor.id (a sponsor has at most one booth; when
      the sponsor has no booth, all three lines use units 0 except PACKAGE which is always
      1 unit). Booth rows in state SUSPENDED are still billed.
    constants:
      PACKAGE_PRICE_CENTS_BRONZE: 250000
      PACKAGE_PRICE_CENTS_SILVER: 500000
      PACKAGE_PRICE_CENTS_GOLD: 900000
      LEAD_OVERAGE_UNIT_CENTS: 137.5
      BOOTH_STREAM_UNIT_CENTS: 4.25
      SPONSOR_TAX_PCT: 0.0825
    precision: "Integer cents. round_half_up applied once per line item, then once on the subtotal for tax. Three line roundings plus one tax rounding, in that order."
    writes: "Settlement.line_items, Settlement.subtotal_cents, Settlement.tax_cents, Settlement.total_cents."

  - name: event_settlement_total
    trigger: "On POST /api/events/{event_id}/settlements."
    algorithm: threshold
    formula: |
      # CIRCULAR-LOOKING DEPENDENCY, EVALUATION ORDER PINNED.
      # The volume discount that reduces the platform fee is keyed on SUBTOTAL
      # (tickets + streaming), NOT on the invoice total the fee itself contributes to.
      # Evaluate the seven steps strictly in order; do not iterate to a fixed point.
      # STEP 1 - re-derive every PAID registration with registration_amount_due variant `final`
      for each Registration r of the event with r.payment_status == PAID:
          r.final_amount_due_cents = registration_amount_due(r, variant="final")
      # STEP 2
      gross_ticket_cents = sum(r.final_amount_due_cents for PAID registrations of the event)
      # STEP 3
      settlement_adjustment_cents = sum(r.final_amount_due_cents - r.amount_paid_cents
                                        for PAID registrations of the event)
      # STEP 4
      streaming_cents = event.streamed_minutes_total * STREAMING_RATE_CENTS_PER_MINUTE
      subtotal_cents  = gross_ticket_cents + streaming_cents
      # STEP 5 - discount tier keyed on subtotal_cents (>= is inclusive)
      if   subtotal_cents >= VOLUME_TIER_2_CENTS: discount_pct = VOLUME_TIER_2_DISCOUNT_PCT
      elif subtotal_cents >= VOLUME_TIER_1_CENTS: discount_pct = VOLUME_TIER_1_DISCOUNT_PCT
      else:                                       discount_pct = 0.0
      # STEP 6 - raw fee, discounted, then floored
      raw_fee_cents      = round_half_up(subtotal_cents * PLATFORM_FEE_PCT)
      platform_fee_cents = max(round_half_up(raw_fee_cents * (1 - discount_pct)),
                               PLATFORM_FEE_MIN_CENTS)
      # STEP 7
      total_cents            = platform_fee_cents + streaming_cents
      organizer_payout_cents = gross_ticket_cents - total_cents      # may be negative
      line_items = [ { label: "PLATFORM_FEE", units: 1, unit_cents: platform_fee_cents, line_total_cents: platform_fee_cents },
                     { label: "STREAMING",    units: event.streamed_minutes_total,
                       unit_cents: STREAMING_RATE_CENTS_PER_MINUTE, line_total_cents: streaming_cents } ]
      tax_cents = 0
    input_set: |
      Registrations of this event with payment_status == PAID only. UNPAID, REFUNDED and
      WAITLISTED registrations contribute nothing. When that set is empty, gross_ticket_cents
      and settlement_adjustment_cents are both 0, and the PLATFORM_FEE_MIN_CENTS floor still
      applies, so total_cents == PLATFORM_FEE_MIN_CENTS and organizer_payout_cents is negative.
    constants:
      STREAMING_RATE_CENTS_PER_MINUTE: 4
      PLATFORM_FEE_PCT: 0.08
      VOLUME_TIER_1_CENTS: 100000
      VOLUME_TIER_1_DISCOUNT_PCT: 0.10
      VOLUME_TIER_2_CENTS: 250000
      VOLUME_TIER_2_DISCOUNT_PCT: 0.15
      PLATFORM_FEE_MIN_CENTS: 500
    precision: "Integer cents; round_half_up applied at STEP 6 twice (raw fee, then discounted fee). No other rounding."
    writes: "Settlement.line_items, Settlement.subtotal_cents, Settlement.platform_fee_cents, Settlement.total_cents, Settlement.organizer_payout_cents, Event.settlement_adjustment_cents, Registration.final_amount_due_cents."

  - name: ticket_availability
    trigger: "After every mutation of TicketType.sold_count (registration create, withdraw, refund cascade, waitlist promotion)."
    algorithm: threshold
    formula: |
      available_seats = ticket_type.quota - ticket_type.sold_count
      availability_status = "SOLD_OUT" if available_seats <= 0 else "AVAILABLE"
    input_set: "One TicketType row; sold_count counts Registration rows with attendance_status NOT IN {WAITLISTED, WITHDRAWN}."
    constants: {}
    precision: "Integer comparison; the boundary is sold_count >= quota (the quota-th seat succeeds, the quota+1-th is rejected)."
    writes: "TicketType.availability_status."

  - name: event_analytics_snapshot
    trigger: "On GET /api/events/{event_id}/analytics."
    algorithm: aggregation
    formula: |
      attendee_set   = Registrations of the event with attendance_status IN {CHECKED_IN, ATTENDED}
      unique_attendees   = count(attendee_set)
      total_watch_minutes = sum(r.watched_minutes for r in attendee_set)
      if unique_attendees > 0:
          avg_watch_minutes = round_half_up(total_watch_minutes / unique_attendees, 2)
      else:
          avg_watch_minutes = 0.00          # empty-set guard: never divide by zero
      on_demand_views = sum(rec.view_count for Recordings of the event with state == PUBLISHED)
      registered_count = event.registered_count
      gross_collected_cents = event.gross_collected_cents
    input_set: |
      (a) Source entity + status filter: Registration rows of this event with
      attendance_status IN {CHECKED_IN, ATTENDED}; NO_SHOW, WITHDRAWN, WAITLISTED and
      REGISTERED are excluded. (b) Window: all rows created at or before the current
      logical clock (no other window). (c) The result is order-insensitive (pure sums and
      counts), so no tie-break is required.
    constants:
      ATTENDANCE_MIN_MINUTES: 15
    precision: "avg_watch_minutes to 2 decimal places, round_half_up; all other outputs are integers."
    writes: "Nothing persisted; the computed read returns the snapshot object."

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the six declared roles."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "The acting role appears in the target endpoint's roles list."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 5
    category: existence
    check: "Every path-segment resource exists, validated left-to-right."
    error_id: "ERR_EVENT_NOT_FOUND | ERR_TICKET_TYPE_NOT_FOUND | ERR_REGISTRATION_NOT_FOUND | ERR_TRACK_NOT_FOUND | ERR_SESSION_NOT_FOUND | ERR_SPEAKER_NOT_FOUND | ERR_SESSION_SPEAKER_NOT_FOUND | ERR_BROADCAST_NOT_FOUND | ERR_RECORDING_NOT_FOUND | ERR_SPONSOR_NOT_FOUND | ERR_BOOTH_NOT_FOUND | ERR_LEAD_NOT_FOUND | ERR_MATCH_REQUEST_NOT_FOUND | ERR_SETTLEMENT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"
  - priority: 8
    category: existence
    check: "Every foreign-key id supplied in the request body references an existing row, validated in the order the fields are listed in the endpoint's input."
    error_id: "ERR_EVENT_NOT_FOUND | ERR_TICKET_TYPE_NOT_FOUND | ERR_TRACK_NOT_FOUND | ERR_SESSION_NOT_FOUND | ERR_SPEAKER_NOT_FOUND | ERR_SPONSOR_NOT_FOUND | ERR_REGISTRATION_NOT_FOUND"
    http_status: 404
    applies_to: "POST /api/registrations, POST /api/sessions, POST /api/session-speakers, POST /api/broadcasts, POST /api/booths, POST /api/booths/{booth_id}/leads, POST /api/match-requests"
  - priority: 10
    category: auth
    check: "For entity_backed roles, X-User-ID equals the owning id of the target resource: Attendee -> Registration.id, SpeakerUser -> SessionSpeaker.speaker_id, SponsorUser -> Booth.sponsor_id; for Organizer, X-User-ID equals Event.organizer_user_id of the owning event."
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "all mutating endpoints acted on by Organizer, Attendee, SpeakerUser or SponsorUser"
  - priority: 12
    category: business_constraint
    check: "Required body fields are present, types match, enum values are members of the declared set, integers respect their >= constraints, and pagination limit is between 1 and 100."
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: all
  - priority: 14
    category: business_temporal
    check: "Interval inputs are well formed: Event.ends_at > Event.starts_at, Session.ends_at > Session.starts_at, MatchRequest.window_end > MatchRequest.window_start."
    error_id: ERR_TIME_RANGE_INVALID
    http_status: 422
    applies_to: "POST /api/events, POST /api/sessions, POST /api/match-requests"
  - priority: 16
    category: business_constraint
    check: "attendee_email is unique among Registration rows of the same event whose attendance_status != WITHDRAWN."
    error_id: ERR_DUPLICATE_REGISTRATION
    http_status: 409
    applies_to: "POST /api/registrations"
  - priority: 18
    category: state
    check: "expected_event_version equals the current Event.version."
    error_id: ERR_STALE_EVENT_VERSION
    http_status: 412
    applies_to: "POST /api/events/{event_id}/settlements"
  - priority: 20
    category: state
    check: "The target resource is in a state from which the requested transition is declared in §1.2."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 22
    category: state
    check: "The target resource is not already in one of its state machine's terminal_states."
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 30
    category: state
    check: "The event is in state PUBLISHED (registration is closed in DRAFT, LIVE, ENDED, SETTLED and CANCELLED)."
    error_id: ERR_EVENT_NOT_OPEN
    http_status: 409
    applies_to: "POST /api/registrations"
  - priority: 34
    category: business_safety
    check: "The FinanceAdmin marking a settlement PAID is not the FinanceAdmin recorded in Settlement.issued_by_user_id."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /api/settlements/{settlement_id}/pay"
  - priority: 36
    category: business_safety
    check: "marketing_consent is true on lead capture."
    error_id: ERR_CONSENT_REQUIRED
    http_status: 422
    applies_to: "POST /api/booths/{booth_id}/leads"
  - priority: 38
    category: business_safety
    check: "The acting registration's TicketType.gating_level is IN {ON_DEMAND, BOTH} and the registration's payment_status == PAID before an on-demand view is recorded."
    error_id: ERR_GATING_NOT_PERMITTED
    http_status: 403
    applies_to: "POST /api/recordings/{recording_id}/views"
  - priority: 42
    category: business_referential
    check: "The referenced Registration.event_id equals the event of the booth (lead capture) or of the recording (on-demand view) or of the match request."
    error_id: ERR_REGISTRATION_EVENT_MISMATCH
    http_status: 422
    applies_to: "POST /api/booths/{booth_id}/leads, POST /api/recordings/{recording_id}/views, POST /api/match-requests"
  - priority: 44
    category: business_referential
    check: "The booth's Sponsor.contract_status == SIGNED."
    error_id: ERR_CONTRACT_NOT_SIGNED
    http_status: 409
    applies_to: "POST /api/booths/{booth_id}/approve"
  - priority: 46
    category: business_referential
    check: "requester_registration_id != target_registration_id."
    error_id: ERR_SELF_MATCH_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /api/match-requests"
  - priority: 48
    category: business_constraint
    check: "No Lead row already exists with the same booth_id and registration_id."
    error_id: ERR_DUPLICATE_LEAD
    http_status: 409
    applies_to: "POST /api/booths/{booth_id}/leads"
  - priority: 52
    category: business_temporal
    check: "HALF-OPEN TRACK GEOMETRY. No other Session on the same track_id with state IN {SCHEDULED, LIVE, COMPLETED} satisfies (new.starts_at < other.ends_at AND other.starts_at < new.ends_at). Zero-gap adjacency (new.starts_at == other.ends_at) is therefore allowed."
    error_id: ERR_TRACK_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /api/sessions/{session_id}/schedule"
  - priority: 54
    category: business_temporal
    check: "BUFFERED SPEAKER GEOMETRY. No other Session for which this speaker already holds an ACCEPTED SessionSpeaker row satisfies (new.starts_at < other.ends_at + SPEAKER_TRANSITION_BUFFER_MINUTES AND other.starts_at < new.ends_at + SPEAKER_TRANSITION_BUFFER_MINUTES). The comparison is strict, so a gap of exactly SPEAKER_TRANSITION_BUFFER_MINUTES (10) is accepted."
    error_id: ERR_SPEAKER_BUFFER_CONFLICT
    http_status: 409
    applies_to: "POST /api/session-speakers/{session_speaker_id}/accept"
  - priority: 56
    category: business_temporal
    check: "CLOSED MEETING GEOMETRY with per-registration capacity MAX_CONCURRENT_MEETINGS_PER_REGISTRATION = 1. For neither the requester nor the target registration may an ACCEPTED MatchRequest satisfy (new.window_start <= other.window_end AND other.window_start <= new.window_end). Because the interval is closed, touching endpoints (new.window_start == other.window_end) DO conflict."
    error_id: ERR_MEETING_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /api/match-requests/{match_request_id}/accept"
  - priority: 58
    category: business_temporal
    check: "The current logical clock is strictly before MatchRequest.expires_at."
    error_id: ERR_MATCH_REQUEST_EXPIRED
    http_status: 409
    applies_to: "POST /api/match-requests/{match_request_id}/accept"
  - priority: 60
    category: business_constraint
    check: "No Settlement with the same event_id, subject_type == EVENT and state IN {ISSUED, PAID} already exists (a DRAFT one is superseded, not rejected)."
    error_id: ERR_SETTLEMENT_EXISTS
    http_status: 409
    applies_to: "POST /api/events/{event_id}/settlements"
  - priority: 70
    category: business_fiscal
    check: "TicketType.sold_count < TicketType.quota, unless waitlist_if_full is true in which case the registration is created WAITLISTED instead of rejected."
    error_id: ERR_TICKET_SOLD_OUT
    http_status: 409
    applies_to: "POST /api/registrations"
  - priority: 72
    category: business_fiscal
    check: "Event.registered_count < Event.capacity, unless waitlist_if_full is true."
    error_id: ERR_EVENT_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /api/registrations"
  - priority: 74
    category: business_fiscal
    check: "The submitted amount equals the outstanding amount: amount_cents == Registration.amount_due_cents on pay; paid_amount_cents == Settlement.total_cents on settlement pay."
    error_id: ERR_PAYMENT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /api/registrations/{registration_id}/pay, POST /api/settlements/{settlement_id}/pay"

validation_priority_conflicts:
  - name: event_not_open_beats_ticket_sold_out
    categories: "state (priority 30) vs business_fiscal (priority 70)"
    scenario: "POST /api/registrations against a DRAFT event whose ticket type is already at quota — the state error wins."
    winning_error_id: ERR_EVENT_NOT_OPEN
    losing_error_id: ERR_TICKET_SOLD_OUT
  - name: consent_required_beats_registration_event_mismatch
    categories: "business_safety (priority 36) vs business_referential (priority 42)"
    scenario: "POST /api/booths/{booth_id}/leads with marketing_consent false AND a registration_id belonging to a different event — the safety error wins."
    winning_error_id: ERR_CONSENT_REQUIRED
    losing_error_id: ERR_REGISTRATION_EVENT_MISMATCH

conserved_quantity_invariants:
  - name: seat_inventory_conservation
    quantity: "Seat inventory: TicketType.sold_count"
    formula: "TicketType.sold_count == count(Registration where ticket_type_id == TicketType.id AND attendance_status NOT IN {WAITLISTED, WITHDRAWN})"
    forward_action: "POST /api/registrations (seat-holding registration created)"
    compensating_action: "POST /api/registrations/{registration_id}/withdraw"
    claim: "After forward + compensating action the quantity returns to its exact pre-action value, and Event.registered_count does too."
  - name: collected_money_conservation
    quantity: "Collected money: Event.gross_collected_cents"
    formula: "Event.gross_collected_cents == sum(Registration.amount_paid_cents for registrations of the event with payment_status == PAID)"
    forward_action: "POST /api/registrations/{registration_id}/pay"
    compensating_action: "POST /api/registrations/{registration_id}/refund"
    claim: "After pay + refund, Event.gross_collected_cents returns to its exact pre-payment value and Registration.amount_paid_cents is 0, leaving zero drift."

endpoints:
  # ---- logical clock (test-driving endpoint, §1.5 priority ladder rung 3) ----
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-07-01T00:00:00Z; it never falls back to real wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: ["to_iso8601"]
    output: "{ current_utc: datetime }"
    side_effects: ["all subsequent deadline, expiry, early-bird and duration computations use the new instant"]

  # ---- events ----
  - method: POST
    path: "/api/events"
    description: "Create an event in DRAFT."
    roles: [Organizer]
    code: 201
    input: ["name", "timezone", "starts_at", "ends_at", "early_bird_ends_at", "capacity"]
    output: Event
    side_effects: ["Event.state = DRAFT", "Event.organizer_user_id = acting X-User-ID", "Event.version = 1"]
  - method: GET
    path: "/api/events"
    description: "List events with pagination."
    roles: [Organizer, PlatformAdmin, FinanceAdmin]
    code: 200
    input: ["state?", "organizer_user_id?", "limit?", "offset?"]
    output: Event[]
    side_effects: []
  - method: GET
    path: "/api/events/{event_id}"
    description: "Read one event, including version for OCC and all computed counters."
    roles: [Organizer, PlatformAdmin, FinanceAdmin, Attendee, SponsorUser, SpeakerUser]
    code: 200
    input: []
    output: Event
    side_effects: []
  - method: PATCH
    path: "/api/events/{event_id}"
    description: "Update mutable event attributes while the event is DRAFT or PUBLISHED."
    roles: [Organizer]
    code: 200
    input: ["name?", "capacity?", "early_bird_ends_at?"]
    output: Event
    side_effects: ["increments Event.version by 1"]
  - method: POST
    path: "/api/events/{event_id}/publish"
    description: "DRAFT -> PUBLISHED; opens registration."
    roles: [Organizer]
    code: 200
    input: []
    output: Event
    side_effects: ["Event.state = PUBLISHED", "increments Event.version by 1"]
  - method: POST
    path: "/api/events/{event_id}/start"
    description: "PUBLISHED -> LIVE; promotes APPROVED booths to LIVE."
    roles: [Organizer]
    code: 200
    input: []
    output: Event
    side_effects: ["Event.state = LIVE", "every APPROVED Booth of this event becomes LIVE", "increments Event.version by 1"]
  - method: POST
    path: "/api/events/{event_id}/end"
    description: "LIVE -> ENDED; resolves attendance for every registration."
    roles: [Organizer]
    code: 200
    input: []
    output: Event
    side_effects: ["Event.state = ENDED", "REGISTERED registrations become NO_SHOW", "CHECKED_IN registrations become ATTENDED when watched_minutes >= 15, else NO_SHOW", "increments Event.version by 1"]
  - method: POST
    path: "/api/events/{event_id}/cancel"
    description: "Cancel the event and run the three-link CASCADE-A chain (sessions -> broadcasts -> recordings)."
    roles: [Organizer]
    code: 200
    input: ["reason"]
    output: Event
    side_effects: ["Event.state = CANCELLED", "CASCADE-A link 1: sessions in DRAFT/SCHEDULED/LIVE become CANCELLED", "CASCADE-A link 2: their broadcasts in SCHEDULED/PREVIEW/LIVE become ABORTED", "CASCADE-A link 3: those broadcasts' recordings become RETRACTED and Event.published_recording_count is decremented per previously PUBLISHED recording", "increments Event.version by 1"]
  - method: GET
    path: "/api/events/{event_id}/analytics"
    description: "Computed read returning the event_analytics_snapshot."
    roles: [Organizer, PlatformAdmin]
    code: 200
    input: []
    output: "{ unique_attendees: integer, total_watch_minutes: integer, avg_watch_minutes: number, on_demand_views: integer, registered_count: integer, gross_collected_cents: integer }"
    side_effects: []

  # ---- ticket types ----
  - method: POST
    path: "/api/events/{event_id}/ticket-types"
    description: "Create a ticket type under an event."
    roles: [Organizer]
    code: 201
    input: ["name", "tier", "price_cents", "quota", "gating_level"]
    output: TicketType
    side_effects: ["TicketType.sold_count = 0", "TicketType.availability_status = AVAILABLE", "increments Event.version by 1"]
  - method: GET
    path: "/api/events/{event_id}/ticket-types"
    description: "Reverse-reachability list of ticket types for an event."
    roles: [Organizer, PlatformAdmin, Attendee, FinanceAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: TicketType[]
    side_effects: []
  - method: GET
    path: "/api/ticket-types"
    description: "Filtered list of ticket types (reverse-reachability from event_id)."
    roles: [Organizer, PlatformAdmin, Attendee, FinanceAdmin]
    code: 200
    input: ["event_id?", "tier?", "availability_status?", "limit?", "offset?"]
    output: TicketType[]
    side_effects: []
  - method: GET
    path: "/api/ticket-types/{ticket_type_id}"
    description: "Read one ticket type including sold_count and availability_status."
    roles: [Organizer, PlatformAdmin, Attendee, FinanceAdmin]
    code: 200
    input: []
    output: TicketType
    side_effects: []

  # ---- registrations ----
  - method: POST
    path: "/api/registrations"
    description: "Register an attendee. Prices with registration_amount_due variant provisional. When the ticket type is SOLD_OUT or the event is at capacity and waitlist_if_full is true, the row is created WAITLISTED with amount_due_cents 0 instead of being rejected."
    roles: [Organizer]
    code: 201
    input: ["event_id", "ticket_type_id", "attendee_email", "group_code?", "group_size?", "waitlist_if_full?"]
    output: Registration
    side_effects: ["Registration.amount_due_cents written by registration_amount_due (provisional) unless WAITLISTED", "TicketType.sold_count += 1 and Event.registered_count += 1 unless WAITLISTED", "TicketType.availability_status recomputed by ticket_availability", "increments Event.version by 1"]
  - method: GET
    path: "/api/registrations"
    description: "Filtered list of registrations."
    roles: [Organizer, PlatformAdmin, FinanceAdmin]
    code: 200
    input: ["event_id?", "ticket_type_id?", "group_code?", "payment_status?", "attendance_status?", "limit?", "offset?"]
    output: Registration[]
    side_effects: []
  - method: GET
    path: "/api/registrations/{registration_id}"
    description: "Read one registration with both state axes and all money fields."
    roles: [Organizer, PlatformAdmin, FinanceAdmin, Attendee]
    code: 200
    input: []
    output: Registration
    side_effects: []
  - method: POST
    path: "/api/registrations/{registration_id}/pay"
    description: "Collect payment; payment_status UNPAID -> PAID."
    roles: [Organizer]
    code: 200
    input: ["amount_cents"]
    output: Registration
    side_effects: ["Registration.amount_paid_cents = amount_cents", "Event.gross_collected_cents += amount_cents", "increments Event.version by 1"]
  - method: POST
    path: "/api/registrations/{registration_id}/refund"
    description: "Refund a paid registration and run the three-link CASCADE-B chain (money + seat release -> availability flip -> waitlist promotion)."
    roles: [Organizer]
    code: 200
    input: ["reason"]
    output: Registration
    side_effects: ["payment_status = REFUNDED", "CASCADE-B link 1: Event.gross_collected_cents -= amount_paid_cents; amount_paid_cents = 0; attendance_status = WITHDRAWN; TicketType.sold_count -= 1; Event.registered_count -= 1", "CASCADE-B link 2: TicketType.availability_status flips SOLD_OUT -> AVAILABLE", "CASCADE-B link 3: the earliest-created WAITLISTED registration on that ticket type is promoted to REGISTERED and priced", "increments Event.version by 1"]
  - method: POST
    path: "/api/registrations/{registration_id}/check-in"
    description: "attendance_status REGISTERED -> CHECKED_IN while the event is LIVE."
    roles: [Organizer]
    code: 200
    input: []
    output: Registration
    side_effects: ["attendance_status = CHECKED_IN"]
  - method: POST
    path: "/api/registrations/{registration_id}/withdraw"
    description: "Withdraw a registration; compensating action for the seat-inventory invariant."
    roles: [Organizer, Attendee]
    code: 200
    input: []
    output: Registration
    side_effects: ["attendance_status = WITHDRAWN", "TicketType.sold_count -= 1 and Event.registered_count -= 1 when the prior status was not WAITLISTED", "TicketType.availability_status recomputed", "PENDING MatchRequests of this registration become CANCELLED", "increments Event.version by 1"]

  # ---- tracks ----
  - method: POST
    path: "/api/events/{event_id}/tracks"
    description: "Create a track (the scheduling resource sessions occupy)."
    roles: [Organizer]
    code: 201
    input: ["name"]
    output: Track
    side_effects: ["Track.scheduled_session_count = 0"]
  - method: GET
    path: "/api/events/{event_id}/tracks"
    description: "Reverse-reachability list of tracks for an event."
    roles: [Organizer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Track[]
    side_effects: []
  - method: GET
    path: "/api/tracks"
    description: "Filtered list of tracks (reverse-reachability from event_id)."
    roles: [Organizer, PlatformAdmin]
    code: 200
    input: ["event_id?", "limit?", "offset?"]
    output: Track[]
    side_effects: []
  - method: GET
    path: "/api/tracks/{track_id}"
    description: "Read one track."
    roles: [Organizer, PlatformAdmin]
    code: 200
    input: []
    output: Track
    side_effects: []

  # ---- sessions ----
  - method: POST
    path: "/api/sessions"
    description: "Create a session in DRAFT (no track slot is occupied yet)."
    roles: [Organizer]
    code: 201
    input: ["event_id", "track_id", "title", "starts_at", "ends_at", "session_type", "capacity"]
    output: Session
    side_effects: ["Session.state = DRAFT"]
  - method: GET
    path: "/api/sessions"
    description: "Filtered list of sessions."
    roles: [Organizer, PlatformAdmin, Attendee, SpeakerUser]
    code: 200
    input: ["event_id?", "track_id?", "state?", "limit?", "offset?"]
    output: Session[]
    side_effects: []
  - method: GET
    path: "/api/sessions/{session_id}"
    description: "Read one session."
    roles: [Organizer, PlatformAdmin, Attendee, SpeakerUser]
    code: 200
    input: []
    output: Session
    side_effects: []
  - method: POST
    path: "/api/sessions/{session_id}/schedule"
    description: "DRAFT -> SCHEDULED; claims the half-open [starts_at, ends_at) slot on the track."
    roles: [Organizer]
    code: 200
    input: []
    output: Session
    side_effects: ["Session.state = SCHEDULED", "Track.scheduled_session_count += 1"]
  - method: POST
    path: "/api/sessions/{session_id}/cancel"
    description: "Cancel a session; releases the track slot, RELEASEs its session-speakers and ABORTs its broadcasts."
    roles: [Organizer]
    code: 200
    input: ["reason"]
    output: Session
    side_effects: ["Session.state = CANCELLED", "Track.scheduled_session_count -= 1 when previously SCHEDULED or LIVE", "SessionSpeaker rows in INVITED/ACCEPTED become RELEASED", "Broadcast rows in SCHEDULED/PREVIEW/LIVE become ABORTED"]
  - method: POST
    path: "/api/sessions/{session_id}/attendance"
    description: "Record live watch minutes for a checked-in registration on this session."
    roles: [Organizer]
    code: 200
    input: ["registration_id", "watched_minutes"]
    output: Registration
    side_effects: ["Registration.watched_minutes += watched_minutes"]

  # ---- speakers ----
  - method: POST
    path: "/api/events/{event_id}/speakers"
    description: "Create a speaker profile scoped to an event."
    roles: [Organizer]
    code: 201
    input: ["full_name", "email"]
    output: Speaker
    side_effects: ["Speaker.engagement_status = UNASSIGNED"]
  - method: GET
    path: "/api/events/{event_id}/speakers"
    description: "Reverse-reachability list of speakers for an event."
    roles: [Organizer, PlatformAdmin, SpeakerUser]
    code: 200
    input: ["limit?", "offset?"]
    output: Speaker[]
    side_effects: []
  - method: GET
    path: "/api/speakers"
    description: "Filtered list of speakers (reverse-reachability from event_id)."
    roles: [Organizer, PlatformAdmin, SpeakerUser]
    code: 200
    input: ["event_id?", "engagement_status?", "limit?", "offset?"]
    output: Speaker[]
    side_effects: []
  - method: GET
    path: "/api/speakers/{speaker_id}"
    description: "Read one speaker including accepted_session_count and engagement_status."
    roles: [Organizer, PlatformAdmin, SpeakerUser]
    code: 200
    input: []
    output: Speaker
    side_effects: []

  # ---- session-speaker junction ----
  - method: POST
    path: "/api/session-speakers"
    description: "Invite a speaker to a session; creates the junction row in INVITED with invite_round 1."
    roles: [Organizer]
    code: 201
    input: ["session_id", "speaker_id", "speaking_role"]
    output: SessionSpeaker
    side_effects: ["SessionSpeaker.state = INVITED", "SessionSpeaker.invite_round = 1"]
  - method: GET
    path: "/api/session-speakers"
    description: "Filtered list of session-speaker junction rows."
    roles: [Organizer, PlatformAdmin, SpeakerUser]
    code: 200
    input: ["session_id?", "speaker_id?", "state?", "limit?", "offset?"]
    output: SessionSpeaker[]
    side_effects: []
  - method: GET
    path: "/api/session-speakers/{session_speaker_id}"
    description: "Read one junction row."
    roles: [Organizer, PlatformAdmin, SpeakerUser]
    code: 200
    input: []
    output: SessionSpeaker
    side_effects: []
  - method: POST
    path: "/api/session-speakers/{session_speaker_id}/accept"
    description: "INVITED -> ACCEPTED; enforces the 10-minute buffered speaker-calendar geometry."
    roles: [SpeakerUser]
    code: 200
    input: []
    output: SessionSpeaker
    side_effects: ["Speaker.accepted_session_count += 1", "Speaker.engagement_status = ENGAGED", "Session.accepted_speaker_count += 1"]
  - method: POST
    path: "/api/session-speakers/{session_speaker_id}/decline"
    description: "INVITED -> DECLINED (terminal)."
    roles: [SpeakerUser]
    code: 200
    input: []
    output: SessionSpeaker
    side_effects: []
  - method: POST
    path: "/api/session-speakers/{session_speaker_id}/withdraw"
    description: "ACCEPTED -> WITHDRAWN; releases the speaker's calendar window."
    roles: [SpeakerUser]
    code: 200
    input: []
    output: SessionSpeaker
    side_effects: ["Speaker.accepted_session_count -= 1", "Speaker.engagement_status recomputed", "Session.accepted_speaker_count -= 1"]
  - method: POST
    path: "/api/session-speakers/{session_speaker_id}/reinvite"
    description: "WITHDRAWN -> INVITED; closes the invite cycle and bumps invite_round."
    roles: [Organizer]
    code: 200
    input: []
    output: SessionSpeaker
    side_effects: ["SessionSpeaker.invite_round += 1"]

  # ---- broadcasts ----
  - method: POST
    path: "/api/broadcasts"
    description: "Create a broadcast for a session in SCHEDULED state."
    roles: [Organizer]
    code: 201
    input: ["session_id", "ingest_region"]
    output: Broadcast
    side_effects: ["Broadcast.state = SCHEDULED"]
  - method: GET
    path: "/api/broadcasts"
    description: "Filtered list of broadcasts."
    roles: [Organizer, PlatformAdmin]
    code: 200
    input: ["session_id?", "state?", "limit?", "offset?"]
    output: Broadcast[]
    side_effects: []
  - method: GET
    path: "/api/broadcasts/{broadcast_id}"
    description: "Read one broadcast."
    roles: [Organizer, PlatformAdmin]
    code: 200
    input: []
    output: Broadcast
    side_effects: []
  - method: POST
    path: "/api/broadcasts/{broadcast_id}/preview"
    description: "SCHEDULED -> PREVIEW."
    roles: [Organizer]
    code: 200
    input: []
    output: Broadcast
    side_effects: ["Broadcast.state = PREVIEW"]
  - method: POST
    path: "/api/broadcasts/{broadcast_id}/go-live"
    description: "PREVIEW -> LIVE; requires the owning Event to be LIVE and the session to have at least one ACCEPTED speaker."
    roles: [Organizer]
    code: 200
    input: []
    output: Broadcast
    side_effects: ["Broadcast.started_at = logical clock", "Session SCHEDULED -> LIVE", "a Recording row is created in PENDING"]
  - method: POST
    path: "/api/broadcasts/{broadcast_id}/end"
    description: "LIVE -> ENDED; computes streamed_minutes and advances the recording to PROCESSING."
    roles: [Organizer]
    code: 200
    input: []
    output: Broadcast
    side_effects: ["Broadcast.ended_at = logical clock", "Broadcast.streamed_minutes = floor((ended_at - started_at)/60s)", "Event.streamed_minutes_total += streamed_minutes", "Session LIVE -> COMPLETED", "Recording PENDING -> PROCESSING", "increments Event.version by 1"]
  - method: POST
    path: "/api/broadcasts/{broadcast_id}/abort"
    description: "Abort a broadcast; retracts its recordings."
    roles: [Organizer]
    code: 200
    input: ["reason"]
    output: Broadcast
    side_effects: ["Broadcast.state = ABORTED", "its Recordings become RETRACTED", "Event.published_recording_count decremented per previously PUBLISHED recording"]

  # ---- recordings / on-demand gating ----
  - method: GET
    path: "/api/recordings"
    description: "Filtered list of recordings; DELETED rows are excluded unless state=DELETED is requested."
    roles: [Organizer, PlatformAdmin, Attendee]
    code: 200
    input: ["event_id?", "session_id?", "broadcast_id?", "state?", "limit?", "offset?"]
    output: Recording[]
    side_effects: []
  - method: GET
    path: "/api/recordings/{recording_id}"
    description: "Read one recording."
    roles: [Organizer, PlatformAdmin, Attendee]
    code: 200
    input: []
    output: Recording
    side_effects: []
  - method: POST
    path: "/api/recordings/{recording_id}/complete"
    description: "PROCESSING -> READY with the encoded duration."
    roles: [PlatformAdmin]
    code: 200
    input: ["duration_seconds"]
    output: Recording
    side_effects: ["Recording.duration_seconds = duration_seconds"]
  - method: POST
    path: "/api/recordings/{recording_id}/publish"
    description: "READY -> PUBLISHED with a gating level."
    roles: [Organizer]
    code: 200
    input: ["gating_level"]
    output: Recording
    side_effects: ["Recording.gating_level set", "Event.published_recording_count += 1"]
  - method: POST
    path: "/api/recordings/{recording_id}/retract"
    description: "PUBLISHED -> RETRACTED."
    roles: [Organizer]
    code: 200
    input: ["reason"]
    output: Recording
    side_effects: ["Event.published_recording_count -= 1"]
  - method: POST
    path: "/api/recordings/{recording_id}/reprocess"
    description: "RETRACTED -> PROCESSING (closes the recording cycle)."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Recording
    side_effects: ["Recording.duration_seconds = 0"]
  - method: POST
    path: "/api/recordings/{recording_id}/views"
    description: "Record an on-demand view; enforces the ticket gating level and PAID status of the acting registration."
    roles: [Attendee]
    code: 200
    input: ["registration_id"]
    output: Recording
    side_effects: ["Recording.view_count += 1"]
  - method: DELETE
    path: "/api/recordings/{recording_id}"
    description: "Delete a RETRACTED or READY recording (soft, state -> DELETED)."
    roles: [Organizer]
    code: 204
    input: []
    output: null
    side_effects: ["Recording.state = DELETED", "row excluded from default list results"]

  # ---- sponsors ----
  - method: POST
    path: "/api/events/{event_id}/sponsors"
    description: "Register a sponsor against an event."
    roles: [Organizer]
    code: 201
    input: ["name", "package_tier", "contact_email"]
    output: Sponsor
    side_effects: ["Sponsor.contract_status = UNSIGNED"]
  - method: GET
    path: "/api/events/{event_id}/sponsors"
    description: "Reverse-reachability list of sponsors for an event."
    roles: [Organizer, PlatformAdmin, FinanceAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Sponsor[]
    side_effects: []
  - method: GET
    path: "/api/sponsors"
    description: "Filtered list of sponsors (reverse-reachability from event_id)."
    roles: [Organizer, PlatformAdmin, FinanceAdmin, SponsorUser]
    code: 200
    input: ["event_id?", "package_tier?", "contract_status?", "limit?", "offset?"]
    output: Sponsor[]
    side_effects: []
  - method: GET
    path: "/api/sponsors/{sponsor_id}"
    description: "Read one sponsor."
    roles: [Organizer, PlatformAdmin, FinanceAdmin, SponsorUser]
    code: 200
    input: []
    output: Sponsor
    side_effects: []
  - method: POST
    path: "/api/sponsors/{sponsor_id}/sign-contract"
    description: "Mark the sponsorship contract SIGNED, unlocking booth approval."
    roles: [Organizer]
    code: 200
    input: ["signed_by"]
    output: Sponsor
    side_effects: ["Sponsor.contract_status = SIGNED"]

  # ---- booths ----
  - method: POST
    path: "/api/booths"
    description: "Create a virtual booth in DRAFT for a sponsor."
    roles: [SponsorUser]
    code: 201
    input: ["sponsor_id", "headline", "lead_quota"]
    output: Booth
    side_effects: ["Booth.state = DRAFT", "Booth.event_id copied from the sponsor", "Booth.revision_round = 0"]
  - method: GET
    path: "/api/booths"
    description: "Filtered list of booths."
    roles: [Organizer, PlatformAdmin, SponsorUser, Attendee, FinanceAdmin]
    code: 200
    input: ["sponsor_id?", "event_id?", "state?", "limit?", "offset?"]
    output: Booth[]
    side_effects: []
  - method: GET
    path: "/api/booths/{booth_id}"
    description: "Read one booth including captured_lead_count and stream_minutes_total."
    roles: [Organizer, PlatformAdmin, SponsorUser, Attendee, FinanceAdmin]
    code: 200
    input: []
    output: Booth
    side_effects: []
  - method: POST
    path: "/api/booths/{booth_id}/submit"
    description: "DRAFT or CHANGES_REQUESTED -> SUBMITTED; bumps revision_round."
    roles: [SponsorUser]
    code: 200
    input: []
    output: Booth
    side_effects: ["Booth.revision_round += 1"]
  - method: POST
    path: "/api/booths/{booth_id}/approve"
    description: "SUBMITTED -> APPROVED; requires the sponsor's contract_status == SIGNED."
    roles: [Organizer]
    code: 200
    input: []
    output: Booth
    side_effects: ["Booth.state = APPROVED"]
  - method: POST
    path: "/api/booths/{booth_id}/request-changes"
    description: "SUBMITTED -> CHANGES_REQUESTED (the other fork of the branch)."
    roles: [Organizer]
    code: 200
    input: ["reason"]
    output: Booth
    side_effects: ["Booth.state = CHANGES_REQUESTED"]
  - method: POST
    path: "/api/booths/{booth_id}/suspend"
    description: "APPROVED or LIVE -> SUSPENDED (terminal)."
    roles: [Organizer]
    code: 200
    input: ["reason"]
    output: Booth
    side_effects: ["Booth.state = SUSPENDED", "further lead capture rejected"]
  - method: POST
    path: "/api/booths/{booth_id}/stream-usage"
    description: "Report booth video minutes consumed; billed on the sponsor settlement at BOOTH_STREAM_UNIT_CENTS."
    roles: [SponsorUser]
    code: 200
    input: ["minutes"]
    output: Booth
    side_effects: ["Booth.stream_minutes_total += minutes"]

  # ---- leads ----
  - method: POST
    path: "/api/booths/{booth_id}/leads"
    description: "Capture a lead at a booth; requires marketing consent and an attendee registered to the booth's event."
    roles: [Attendee]
    code: 201
    input: ["registration_id", "marketing_consent"]
    output: Lead
    side_effects: ["Lead.booth_visits = 1", "Lead.score written by lead_score (booth_weighted)", "Booth.captured_lead_count += 1"]
  - method: GET
    path: "/api/leads"
    description: "Filtered list of leads."
    roles: [Organizer, PlatformAdmin, SponsorUser, FinanceAdmin]
    code: 200
    input: ["booth_id?", "registration_id?", "event_id?", "limit?", "offset?"]
    output: Lead[]
    side_effects: []
  - method: GET
    path: "/api/leads/{lead_id}"
    description: "Read one lead including score and score_variant."
    roles: [Organizer, PlatformAdmin, SponsorUser, FinanceAdmin]
    code: 200
    input: []
    output: Lead
    side_effects: []
  - method: POST
    path: "/api/leads/{lead_id}/interactions"
    description: "Log a booth interaction against a lead and re-score with the booth_weighted variant."
    roles: [SponsorUser]
    code: 200
    input: ["interaction_type"]
    output: Lead
    side_effects: ["booth_visits or doc_downloads incremented", "Lead.score recomputed (booth_weighted)", "Lead.is_hot recomputed"]
  - method: POST
    path: "/api/events/{event_id}/leads/rescore"
    description: "Re-score every lead of the event with the engagement_weighted lead_score variant."
    roles: [Organizer]
    code: 200
    input: []
    output: "{ rescored_count: integer, hot_lead_count: integer }"
    side_effects: ["every Lead of the event gets score_variant = ENGAGEMENT_WEIGHTED and a recomputed score / is_hot"]

  # ---- matchmaking ----
  - method: POST
    path: "/api/match-requests"
    description: "Propose a networking meeting between two registrations of the same event."
    roles: [Attendee]
    code: 201
    input: ["event_id", "requester_registration_id", "target_registration_id", "window_start", "window_end"]
    output: MatchRequest
    side_effects: ["MatchRequest.state = PENDING", "MatchRequest.expires_at = window_start - 60 minutes"]
  - method: GET
    path: "/api/match-requests"
    description: "Filtered list of match requests."
    roles: [Attendee, Organizer, PlatformAdmin]
    code: 200
    input: ["event_id?", "requester_registration_id?", "target_registration_id?", "state?", "limit?", "offset?"]
    output: MatchRequest[]
    side_effects: []
  - method: GET
    path: "/api/match-requests/{match_request_id}"
    description: "Read one match request."
    roles: [Attendee, Organizer, PlatformAdmin]
    code: 200
    input: []
    output: MatchRequest
    side_effects: []
  - method: POST
    path: "/api/match-requests/{match_request_id}/accept"
    description: "PENDING -> ACCEPTED; enforces the closed-interval meeting geometry on both registrations."
    roles: [Attendee]
    code: 200
    input: []
    output: MatchRequest
    side_effects: ["both registrations' accepted_meeting_count += 1"]
  - method: POST
    path: "/api/match-requests/{match_request_id}/decline"
    description: "PENDING -> DECLINED."
    roles: [Attendee]
    code: 200
    input: []
    output: MatchRequest
    side_effects: []
  - method: POST
    path: "/api/events/{event_id}/matchmaking/sweep"
    description: "Expire every PENDING match request of the event whose expires_at is at or before the current logical clock."
    roles: [Organizer]
    code: 200
    input: []
    output: "{ expired_count: integer }"
    side_effects: ["matching MatchRequest rows become EXPIRED"]

  # ---- settlements / billing ----
  - method: POST
    path: "/api/events/{event_id}/settlements"
    description: "Create the EVENT settlement (organizer platform-fee invoice). OCC-guarded on Event.version; supersedes any existing DRAFT EVENT settlement by voiding it."
    roles: [FinanceAdmin]
    code: 201
    input: ["expected_event_version"]
    output: Settlement
    side_effects: ["runs event_settlement_total and registration_amount_due (variant final) over every PAID registration", "writes Registration.final_amount_due_cents and Event.settlement_adjustment_cents", "any prior DRAFT EVENT settlement of this event becomes VOID", "increments Event.version by 1"]
  - method: POST
    path: "/api/sponsors/{sponsor_id}/settlements"
    description: "Create the SPONSOR settlement (sponsorship invoice) using per-line rounding."
    roles: [FinanceAdmin]
    code: 201
    input: []
    output: Settlement
    side_effects: ["runs sponsor_settlement_lines", "Settlement.subject_type = SPONSOR"]
  - method: GET
    path: "/api/settlements"
    description: "Filtered list of settlements."
    roles: [FinanceAdmin, PlatformAdmin, Organizer]
    code: 200
    input: ["event_id?", "sponsor_id?", "subject_type?", "state?", "limit?", "offset?"]
    output: Settlement[]
    side_effects: []
  - method: GET
    path: "/api/settlements/{settlement_id}"
    description: "Read one settlement with line_items and totals."
    roles: [FinanceAdmin, PlatformAdmin, Organizer]
    code: 200
    input: []
    output: Settlement
    side_effects: []
  - method: POST
    path: "/api/settlements/{settlement_id}/issue"
    description: "DRAFT -> ISSUED; stamps issued_by_user_id and, for EVENT settlements, moves the event ENDED -> SETTLED."
    roles: [FinanceAdmin]
    code: 200
    input: []
    output: Settlement
    side_effects: ["Settlement.issued_by_user_id = acting X-User-ID", "Event ENDED -> SETTLED for EVENT settlements", "increments Event.version by 1 for EVENT settlements"]
  - method: POST
    path: "/api/settlements/{settlement_id}/pay"
    description: "ISSUED -> PAID; the payer must differ from the issuer (segregation of duties)."
    roles: [FinanceAdmin]
    code: 200
    input: ["paid_amount_cents"]
    output: Settlement
    side_effects: ["Settlement.paid_by_user_id = acting X-User-ID"]
  - method: POST
    path: "/api/settlements/{settlement_id}/void"
    description: "DRAFT or ISSUED -> VOID."
    roles: [FinanceAdmin]
    code: 200
    input: ["reason"]
    output: Settlement
    side_effects: ["Settlement.state = VOID"]

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or the role is not one of the six declared roles."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The acting role is not listed in the target endpoint's roles."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "An entity_backed role acts on a resource it does not own (Attendee vs Registration.id, SpeakerUser vs SessionSpeaker.speaker_id, SponsorUser vs Booth.sponsor_id), or an Organizer acts on an event whose organizer_user_id differs."
  - id: ERR_VALIDATION
    http: 400
    condition: "Missing required body field, wrong type, enum value outside the declared set, negative/zero where >= 1 is required, or pagination limit outside 1..100."
  - id: ERR_EVENT_NOT_FOUND
    http: 404
    condition: "event_id in path or body matches no Event."
  - id: ERR_TICKET_TYPE_NOT_FOUND
    http: 404
    condition: "ticket_type_id matches no TicketType."
  - id: ERR_REGISTRATION_NOT_FOUND
    http: 404
    condition: "registration_id matches no Registration."
  - id: ERR_TRACK_NOT_FOUND
    http: 404
    condition: "track_id matches no Track."
  - id: ERR_SESSION_NOT_FOUND
    http: 404
    condition: "session_id matches no Session."
  - id: ERR_SPEAKER_NOT_FOUND
    http: 404
    condition: "speaker_id matches no Speaker."
  - id: ERR_SESSION_SPEAKER_NOT_FOUND
    http: 404
    condition: "session_speaker_id matches no SessionSpeaker."
  - id: ERR_BROADCAST_NOT_FOUND
    http: 404
    condition: "broadcast_id matches no Broadcast."
  - id: ERR_RECORDING_NOT_FOUND
    http: 404
    condition: "recording_id matches no Recording, or the recording is in state DELETED."
  - id: ERR_SPONSOR_NOT_FOUND
    http: 404
    condition: "sponsor_id matches no Sponsor."
  - id: ERR_BOOTH_NOT_FOUND
    http: 404
    condition: "booth_id matches no Booth."
  - id: ERR_LEAD_NOT_FOUND
    http: 404
    condition: "lead_id matches no Lead."
  - id: ERR_MATCH_REQUEST_NOT_FOUND
    http: 404
    condition: "match_request_id matches no MatchRequest."
  - id: ERR_SETTLEMENT_NOT_FOUND
    http: 404
    condition: "settlement_id matches no Settlement."
  - id: ERR_TIME_RANGE_INVALID
    http: 422
    condition: "ends_at <= starts_at on an Event or Session, or window_end <= window_start on a MatchRequest."
  - id: ERR_DUPLICATE_REGISTRATION
    http: 409
    condition: "attendee_email already used by a non-WITHDRAWN Registration on the same event."
  - id: ERR_STALE_EVENT_VERSION
    http: 412
    condition: "expected_event_version does not equal the current Event.version on EVENT settlement creation."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The requested transition is not declared from the resource's current state, or a cross-entity state precondition fails (e.g. going live on a broadcast while the event is not LIVE)."
  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "The target resource is already in a terminal state of its state machine."
  - id: ERR_EVENT_NOT_OPEN
    http: 409
    condition: "Registration attempted while the event is not in state PUBLISHED."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The FinanceAdmin paying a settlement is the same user that issued it."
  - id: ERR_CONSENT_REQUIRED
    http: 422
    condition: "Lead capture attempted with marketing_consent false."
  - id: ERR_GATING_NOT_PERMITTED
    http: 403
    condition: "On-demand view attempted with a LIVE_ONLY ticket, or by a registration whose payment_status is not PAID."
  - id: ERR_REGISTRATION_EVENT_MISMATCH
    http: 422
    condition: "The referenced Registration belongs to a different event than the booth, recording or match request."
  - id: ERR_CONTRACT_NOT_SIGNED
    http: 409
    condition: "Booth approval attempted while the sponsor's contract_status is UNSIGNED."
  - id: ERR_SELF_MATCH_NOT_ALLOWED
    http: 422
    condition: "requester_registration_id equals target_registration_id."
  - id: ERR_DUPLICATE_LEAD
    http: 409
    condition: "A Lead already exists for the same booth_id and registration_id."
  - id: ERR_TRACK_SLOT_CONFLICT
    http: 409
    condition: "Scheduling a session whose half-open [starts_at, ends_at) interval overlaps another SCHEDULED/LIVE/COMPLETED session on the same track."
  - id: ERR_SPEAKER_BUFFER_CONFLICT
    http: 409
    condition: "Accepting a speaking invitation whose session sits within SPEAKER_TRANSITION_BUFFER_MINUTES (10) of another session the speaker has already ACCEPTED."
  - id: ERR_MEETING_WINDOW_CONFLICT
    http: 409
    condition: "Accepting a meeting whose closed [window_start, window_end] interval intersects an already ACCEPTED meeting of either participant."
  - id: ERR_MATCH_REQUEST_EXPIRED
    http: 409
    condition: "Accepting a match request at or after its expires_at."
  - id: ERR_SETTLEMENT_EXISTS
    http: 409
    condition: "An EVENT settlement in state ISSUED or PAID already exists for the event."
  - id: ERR_TICKET_SOLD_OUT
    http: 409
    condition: "TicketType.sold_count >= TicketType.quota and waitlist_if_full is not true."
  - id: ERR_EVENT_CAPACITY_EXCEEDED
    http: 409
    condition: "Event.registered_count >= Event.capacity and waitlist_if_full is not true."
  - id: ERR_PAYMENT_AMOUNT_MISMATCH
    http: 422
    condition: "amount_cents != Registration.amount_due_cents on registration payment, or paid_amount_cents != Settlement.total_cents on settlement payment."

roles:
  - name: PlatformAdmin
    description: "Platform operator: controls the logical clock and the media-processing pipeline."
    identity: opaque
    exclusive_operations:
      - "POST /api/_clock/set_current_utc"
      - "POST /api/recordings/{recording_id}/complete"
      - "POST /api/recordings/{recording_id}/reprocess"
    shared_operations:
      - "read-only GETs across events, registrations, sessions, speakers, broadcasts, recordings, sponsors, booths, leads, match requests and settlements"
  - name: Organizer
    description: "Owns an event and its programme: tickets, tracks, sessions, speakers, broadcasts, sponsors, booth review, matchmaking sweeps and recording publication."
    identity: opaque
    exclusive_operations:
      - "POST /api/events"
      - "POST /api/events/{event_id}/publish"
      - "POST /api/events/{event_id}/start"
      - "POST /api/events/{event_id}/end"
      - "POST /api/events/{event_id}/cancel"
      - "POST /api/registrations"
      - "POST /api/registrations/{registration_id}/pay"
      - "POST /api/registrations/{registration_id}/refund"
      - "POST /api/registrations/{registration_id}/check-in"
      - "POST /api/sessions/{session_id}/schedule"
      - "POST /api/sessions/{session_id}/attendance"
      - "POST /api/session-speakers"
      - "POST /api/session-speakers/{session_speaker_id}/reinvite"
      - "POST /api/broadcasts/{broadcast_id}/go-live"
      - "POST /api/recordings/{recording_id}/publish"
      - "POST /api/booths/{booth_id}/approve"
      - "POST /api/booths/{booth_id}/request-changes"
      - "POST /api/sponsors/{sponsor_id}/sign-contract"
      - "POST /api/events/{event_id}/leads/rescore"
      - "POST /api/events/{event_id}/matchmaking/sweep"
    shared_operations:
      - "POST /api/registrations/{registration_id}/withdraw (shared with Attendee)"
      - "GET reads on its own event graph"
    note: "X-User-ID is compared to Event.organizer_user_id for ownership; it is not the id of any persisted entity."
  - name: FinanceAdmin
    description: "Billing operator. Segregation of duties: the FinanceAdmin who issues a settlement may not be the one who marks it PAID."
    identity: opaque
    exclusive_operations:
      - "POST /api/events/{event_id}/settlements"
      - "POST /api/sponsors/{sponsor_id}/settlements"
      - "POST /api/settlements/{settlement_id}/issue"
      - "POST /api/settlements/{settlement_id}/pay"
      - "POST /api/settlements/{settlement_id}/void"
    shared_operations:
      - "GET /api/settlements, GET /api/settlements/{settlement_id}, GET /api/registrations, GET /api/leads"
  - name: Attendee
    description: "A registered attendee acting as their own Registration row."
    identity: "entity_backed:Registration"
    exclusive_operations:
      - "POST /api/booths/{booth_id}/leads"
      - "POST /api/recordings/{recording_id}/views"
      - "POST /api/match-requests"
      - "POST /api/match-requests/{match_request_id}/accept"
      - "POST /api/match-requests/{match_request_id}/decline"
    shared_operations:
      - "POST /api/registrations/{registration_id}/withdraw (shared with Organizer)"
      - "GET reads on sessions, recordings, booths and its own registration"
  - name: SpeakerUser
    description: "A speaker acting as their own Speaker row; owns their invitation decisions."
    identity: "entity_backed:Speaker"
    exclusive_operations:
      - "POST /api/session-speakers/{session_speaker_id}/accept"
      - "POST /api/session-speakers/{session_speaker_id}/decline"
      - "POST /api/session-speakers/{session_speaker_id}/withdraw"
    shared_operations:
      - "GET reads on sessions, speakers and session-speakers"
  - name: SponsorUser
    description: "A sponsor acting as their own Sponsor row; owns their booth and lead follow-up."
    identity: "entity_backed:Sponsor"
    exclusive_operations:
      - "POST /api/booths"
      - "POST /api/booths/{booth_id}/submit"
      - "POST /api/booths/{booth_id}/stream-usage"
      - "POST /api/leads/{lead_id}/interactions"
    shared_operations:
      - "GET reads on booths, leads and sponsors"
