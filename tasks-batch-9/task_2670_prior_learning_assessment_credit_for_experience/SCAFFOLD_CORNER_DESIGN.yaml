      - name: articulation_rule_junction_links_one_recommendation_to_two_courses
        claim_type: graph_topology
        grounds:
          - complexity_profile.entity_topology
          - entities.ArticulationRule
          - entities.ArticulationRule.fields.recommendation_id
          - entities.ArticulationRule.fields.course_id
          - endpoints[GET /articulation-rules]
        distinguishing_aspect: |
          ArticulationRule is the many-to-many junction between
          CredentialRecommendation and Course: one recommendation crosswalked to
          CS150 and CS160 yields exactly 2 rows under
          GET /articulation-rules?recommendation_id and exactly 1 row under
          GET /articulation-rules?course_id for each course, so the junction is
          navigable from both ends.
        test_recipe:
          setup:
            - "CredentialRecommendation AWS-SAA (INDUSTRY_CREDENTIAL, 3 credits, LOWER) in DRAFT."
            - "Courses CS150 and CS160, both 3 credits LOWER."
            - "Two DRAFT ArticulationRule rows: (AWS-SAA -> CS150, 3 credits) and (AWS-SAA -> CS160, 3 credits)."
          setup_api_calls:
            - call: "POST /credential-recommendations"
              payload: { source_type: "INDUSTRY_CREDENTIAL", credential_code: "AWS-SAA", title: "AWS Solutions Architect Associate", issuing_body: "ACE", recommended_credits: 3, recommended_level: "LOWER", effective_from: "2026-01-01T00:00:00Z" }
              as: ArticulationOfficer
              captures: { rec_id: "$.data.id" }
            - call: "POST /courses"
              payload: { course_code: "CS150", title: "Intro Programming", department_code: "CS", credits: 3, level: "LOWER", pla_eligible: true, learning_outcomes: [{ outcome_code: "OC1", description: "Design a program", weight_bp: 10000, mastery_threshold_bp: 7000 }] }
              as: PlaCoordinator
              captures: { c1_id: "$.data.id" }
            - call: "POST /courses"
              payload: { course_code: "CS160", title: "Cloud Foundations", department_code: "CS", credits: 3, level: "LOWER", pla_eligible: true, learning_outcomes: [{ outcome_code: "OC1", description: "Explain cloud tiers", weight_bp: 10000, mastery_threshold_bp: 7000 }] }
              as: PlaCoordinator
              captures: { c2_id: "$.data.id" }
            - call: "POST /articulation-rules"
              payload: { recommendation_id: "${rec_id}", course_id: "${c1_id}", awarded_credits: 3, effective_from: "2026-01-01T00:00:00Z" }
              as: ArticulationOfficer
              captures: { r1_id: "$.data.id" }
            - call: "POST /articulation-rules"
              payload: { recommendation_id: "${rec_id}", course_id: "${c2_id}", awarded_credits: 3, effective_from: "2026-01-01T00:00:00Z" }
              as: ArticulationOfficer
              captures: { r2_id: "$.data.id" }
          trigger:
            - call: "GET /articulation-rules?recommendation_id=${rec_id}"
              as: ArticulationOfficer
              captures: { by_rec_first: "$.data[0].course_id" }
            - call: "GET /articulation-rules?course_id=${c1_id}"
              as: ArticulationOfficer
              captures: { by_course_rec: "$.data[0].recommendation_id" }
          assert:
            - "GET /articulation-rules?recommendation_id=${rec_id} returns exactly 2 elements — ${r1_id} and ${r2_id}"
            - "GET /articulation-rules?course_id=${c1_id} returns exactly 1 element — ${r1_id}"
            - "ArticulationRule.${r1_id}.recommendation_id == ${rec_id} and ArticulationRule.${r1_id}.course_id == ${c1_id}"
            - "ArticulationRule.${r2_id}.course_id == ${c2_id}"
            - "ArticulationRule.${r1_id}.status == DRAFT and pinned_recommendation_version == null"
            - "CredentialRecommendation.${rec_id}.approved_rule_count == 0 — DRAFT rules never count"

  # =====================================================================
  # 2. STATE MACHINES
  # =====================================================================
  - section: state_machines
    instances:
      - name: entity_initial_states_on_creation
        claim_type: initial_state
        grounds:
          - state_machines.PlaClaim.assessment_status.initial_state
          - state_machines.PlaClaim.fee_status.initial_state
          - state_machines.PlaClaim.credit_status.initial_state
          - state_machines.Portfolio.initial_state
          - state_machines.AssessorAssignment.initial_state
          - state_machines.ArticulationRule.initial_state
          - state_machines.CredentialRecommendation.initial_state
        distinguishing_aspect: |
          Seven freshly created rows land on their declared initial_state in one
          chain: PlaClaim DRAFT / UNBILLED / NOT_POSTED, Portfolio DRAFT,
          AssessorAssignment ASSIGNED (not ACCEPTED), ArticulationRule DRAFT and
          CredentialRecommendation DRAFT — no creation endpoint skips ahead.
