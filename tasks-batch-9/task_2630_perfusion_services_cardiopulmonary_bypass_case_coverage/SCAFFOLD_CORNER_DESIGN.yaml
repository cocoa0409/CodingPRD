              as: Perfusionist
              as_user_id: "${p1}"
            - call: "POST /bypass-cases/${case1}/end-bypass"
              payload: { pump_time_minutes: 210, cross_clamp_minutes: 90, lowest_hematocrit_pct: 23, adverse_event_count: 0 }
              as: Perfusionist
              as_user_id: "${p1}"
            - call: "POST /bypass-cases/${case1}/close"
              as: ChiefPerfusionist
              as_user_id: "${chief}"
            - call: "POST /bypass-cases"
              payload: { contract_id: "${c1}", surgeon_id: "${s1}", procedure_type: "CABG", scheduled_start: "2026-08-02T13:31:00Z", scheduled_end: "2026-08-02T19:31:00Z", acuity: "ELECTIVE" }
              as: ChiefPerfusionist
              as_user_id: "${chief}"
              captures: { caseB: $.data.id, caseB_v: $.data.version }
            - call: "POST /bypass-cases/${caseB}/assign-perfusionist"
              payload: { perfusionist_id: "${p1}", expected_case_version: "${caseB_v}" }
              as: ChiefPerfusionist
              as_user_id: "${chief}"
          trigger:
            - call: "POST /hospital-contracts/${c1}/settlement-runs"
              payload: { period: "2026-08" }
              as: ContractAdmin
            - call: "POST /hospital-contracts/${c1}/settlement-runs"
              payload: { period: "2026-08" }
              as: ContractAdmin
              captures: { e_replay: $.data.error_id }
            - call: "POST /hospital-contracts/${c1}/settlement-runs"
              payload: { period: "2026-7" }
              as: ContractAdmin
              captures: { e_format: $.data.error_id }
            - call: "POST /hospital-contracts/${c1}/settlement-runs"
              payload: { period: "2026-09" }
              as: ContractAdmin
              captures: { e_future: $.data.error_id }
          assert:
            - "the close in setup posted the FINAL delta: BypassCase.${case1}.final_fee_cents == 520000 with accrued_fee_cents == 520000, and HospitalContract.${c1}.accrued_case_fee_cents == 920000 (520000 for case1 plus 400000 still accrued for caseB) with accrued_case_count == 2"
            - "the settlement run returns HTTP 200 with period == '2026-08', case_count == 1, case_fee_gross_cents == 520000, ecmo_gross_cents == 0, coverage_fee_cents == 1200000"
            - "pre_credit_gross_cents == 1720000, volume_credit_pct == 0.00 and volume_credit_cents == 0 - 1720000 is below VOLUME_TIER_1_CENTS 5000000"
            - "quality_credit_cents == 0 and net_settlement_cents == 1720000"
            - "BypassCase.${case1}.billing_status == INVOICED with accrued_fee_cents still 520000, while BypassCase.${caseB}.billing_status is still PROVISIONAL_ACCRUED - a provisional case is outside the input set and is not invoiced"
            - "HospitalContract.${c1}.last_settlement_period == '2026-08' and accrued_case_fee_cents is still 920000 - settlement invoices, it does not clear the accrual ledger"
            - "${e_replay} == ERR_SETTLEMENT_PERIOD_INVALID with HTTP 422 - the period must be strictly later than last_settlement_period"
            - "${e_format} == ERR_SETTLEMENT_PERIOD_INVALID with HTTP 422 for the malformed '2026-7'"
            - "${e_future} == ERR_SETTLEMENT_PERIOD_INVALID with HTTP 422 - the first instant of 2026-09 is after the logical clock 2026-08-01T00:00:00Z"

      - name: ce_ledger_and_readiness_produce_the_expected_numbers_end_to_end
        claim_type: correct_result
        grounds:
          - calculations.perfusionist_ce_ledger
          - calculations.perfusionist_readiness_score
        distinguishing_aspect: |
          Known CE inputs must produce the exact verified/pending split and the exact readiness score
          that the split implies, both before and after a revocation.
        excluded_because:
          difficulty_instance: "compensating_invariant / ce_verify_then_revoke_restores_credit_ledger_and_readiness_gate"
          rationale: |
            That instance already drives verify then revoke against a fixed CE fixture and pins
            ce_credits_verified, ce_credits_pending and the recomputed readiness_score as literals in
            both directions, which is a strict superset of a single forward correct_result check.

      - name: prolonged_surcharge_constants_are_read_from_the_contract
        claim_type: constants_applied
        grounds:
          - calculations.case_fee_settlement
          - entities.HospitalContract.fields.prolonged_surcharge_pct
          - entities.HospitalContract.fields.prolonged_pump_threshold_minutes
        distinguishing_aspect: |
          The surcharge must come from the owning contract's prolonged_surcharge_pct and
          prolonged_pump_threshold_minutes rather than from a hard-coded 0.15 / 180.
        excluded_because:
          difficulty_instance: "boundary_precision_check / prolonged_surcharge_triggers_at_exactly_threshold_minutes"
          rationale: |
            That instance ends bypass at 179, 180 and 210 minutes against a contract whose threshold
            and pct are set explicitly in the fixture, so a hard-coded constant fails it immediately.

      - name: device_turnaround_threshold_at_exactly_the_boundary
        claim_type: threshold
        grounds:
          - validations[priority=68]
          - errors.ERR_DEVICE_TURNAROUND_CONFLICT
          - calculations.device_reservation_ledger.constants.DEVICE_TURNAROUND_MINUTES
        distinguishing_aspect: |
          The turnaround guard is a >= comparison against DEVICE_TURNAROUND_MINUTES, so a gap of
          exactly 90 minutes must be rejected while 91 passes.
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / device_turnaround_buffer_rejects_gap_of_exactly_ninety_minutes"
          rationale: |
            That instance already probes the gap at 89, exactly 90 and 91 minutes on both sides of the
            existing reservation window, which is the full threshold triple.

      - name: volume_credit_tier_ladder_is_walked_at_each_boundary
        claim_type: tiered_pricing
        grounds:
          - calculations.contract_monthly_settlement
          - calculations.contract_monthly_settlement.constants.VOLUME_TIER_1_CENTS
          - calculations.contract_monthly_settlement.constants.VOLUME_TIER_2_CENTS
        distinguishing_aspect: |
          The credit percentage is keyed on pre_credit_gross_cents with inclusive tier boundaries and
          is applied to the whole gross, not marginally per tier.
        excluded_because:
          difficulty_instance: "combinatorial_formula / settlement_credit_tier_keyed_on_pre_credit_gross"
          rationale: |
            That instance runs settlement at gross values sitting one cent below, exactly on, and above
            both tier boundaries and pins the resulting credit cents, covering every tiered_pricing
            facet including the average-not-marginal application.

      - name: pack_cost_precision_rounds_each_line_before_summing
        claim_type: precision
        grounds:
          - calculations.disposable_pack_cost
          - entities.DisposablePack.fields.pack_cost_cents
        distinguishing_aspect: |
          Rounding happens once per materialised line at half-up, then the rounded lines are summed;
          summing first and rounding once produces a different total.
        excluded_because:
          difficulty_instance: "combinatorial_formula / pack_cost_rounds_per_line_then_sums"
          rationale: |
            That instance is built on unit costs whose per-line and sum-then-round totals differ, so it
            already discriminates the rounding order that this claim would test.

      - name: reservation_ledger_aggregation_after_add_and_reversal
        claim_type: aggregation
        grounds:
          - calculations.device_reservation_ledger
          - entities.PerfusionDevice.fields.open_reservation_count
        distinguishing_aspect: |
          The running reservation count must be correct after a reservation is added and again after it
          is reversed, with no residual drift on either device role.
        excluded_because:
          difficulty_instance: "compensating_invariant / pack_reserve_and_verify_then_cancel_restores_device_reservation_ledger"
          rationale: |
            That instance reserves, verifies and then cancels, asserting open_reservation_count on both
            the primary and the backup device before and after the reversal - exactly the add-then-
            reverse reconciliation this claim describes.

      - name: case_fee_variants_diverge_on_the_same_case
        claim_type: variant_divergence
        grounds:
          - calculations.case_fee_settlement.variants
          - entities.BypassCase.fields.provisional_fee_cents
          - entities.BypassCase.fields.final_fee_cents
        distinguishing_aspect: |
          PROVISIONAL uses scheduled duration while FINAL uses recorded pump_time_minutes, so the two
          variants must differ whenever the case overruns or underruns its schedule.
        excluded_because:
          difficulty_instance: "dual_variant_calc / case_fee_provisional_vs_final_diverges_on_actual_pump_time"
          rationale: |
            That instance runs one case whose scheduled window and actual pump time straddle the
            prolonged threshold in opposite directions and asserts both fee fields plus the delta.

      - name: readiness_variant_is_chosen_by_calling_context
        claim_type: variant_selection
        grounds:
          - calculations.perfusionist_readiness_score.variants
          - entities.Perfusionist.fields.readiness_variant_last
        distinguishing_aspect: |
          ADMISSION must be selected at assignment and AUDIT at incident review, and the two variants
          differ in whether pending CE credits count.
        excluded_because:
          difficulty_instance: "dual_variant_calc / readiness_admission_counts_pending_ce_audit_does_not"
          rationale: |
            That instance assigns and then accepts an incident for review against the same perfusionist
            with unverified CE credits outstanding, asserting both scores and readiness_variant_last.

      - name: accrual_ledger_reconciles_when_the_fee_variant_switches
        claim_type: reconciliation
        grounds:
          - calculations.case_fee_settlement.variants
          - entities.HospitalContract.fields.accrued_case_fee_cents
        distinguishing_aspect: |
          Switching from the provisional to the final variant must post the signed delta to the
          contract ledger exactly once, and reversing the case must remove exactly what was posted.
        excluded_because:
          difficulty_instance: "compensating_invariant / assign_supersede_then_cancel_restores_contract_accrual_ledger"
          rationale: |
            That instance walks assign, supersede, end-bypass and cancel while asserting
            accrued_case_fee_cents and accrued_case_count after every step, so the variant-switch delta
            and its reversal are both already pinned.

  - section: validations
    instances:
      - name: checklist_verify_ladder_returns_the_highest_priority_violation_first
        claim_type: priority_ordering
        grounds:
          - validations[priority=45]
          - validations[priority=46]
          - validations[priority=47]
          - errors.ERR_SAFETY_CHECKS_INCOMPLETE
          - errors.ERR_BLOOD_PROTOCOL_MISMATCH
          - errors.ERR_HEMATOCRIT_BELOW_MINIMUM
          - entities.PumpChecklist.fields.missing_check_codes
        distinguishing_aspect: |
          Four checklists are built on the same PACK_CONFIGURED case, each relaxing exactly one of the
          three pre-bypass gates in priority order, so the verify call must answer 45, then 46, then 47,
          then 200. An implementation that evaluates the hematocrit or the protocol before the safety
          checks answers 46 or 47 to the first checklist, which all three violate at once.
        test_recipe:
          setup:
            - "LEAN BASE chain through disposable-pack configuration, so case1 is PACK_CONFIGURED against the base chain's preference card pc1 whose required_safety_check_codes are [ACT_BASELINE, CIRCUIT_INTEGRITY, GAS_LINE], blood_management_protocol is STANDARD and min_hematocrit_pct is 22, with no substitutions so approval_status == NOT_REQUIRED."
            - "Four DRAFT checklists on that case: chk_a fails GAS_LINE and also carries the wrong protocol and hematocrit 18; chk_b passes all three checks but still carries ANTIFIBRINOLYTIC and hematocrit 18; chk_c is clean except hematocrit 21; chk_d is clean with hematocrit exactly 22."
          setup_api_calls:
            - call: "POST /hospital-contracts"
              payload: { hospital_name: "St Aldate Cardiac Center", staffing_model: "COVERAGE_PLUS_PER_CASE", per_case_fee_cents: 400000, ecmo_hourly_fee_cents: 90000, monthly_case_cap: 5, monthly_coverage_fee_cents: 1200000, prolonged_surcharge_pct: 0.15, prolonged_pump_threshold_minutes: 180, disposable_markup_pct: 0.20, disposable_discount_pct: 0.10 }
