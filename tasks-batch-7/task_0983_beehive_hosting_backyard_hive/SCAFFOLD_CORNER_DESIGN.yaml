            - { call: "POST /api/hives", payload: { site_id: "${site}", agreement_id: "${ag}" }, as: Host, as_user_id: "${h}", captures: { err: $.data.error_id } }
          assert:
            - "captured ${err} == ERR_FORBIDDEN_ROLE (403); no hive is created"

      - name: beekeeper_cannot_verify_inspection_forbidden
        claim_type: exclusive_operation_denied
        grounds: [roles.ApiaryManager, "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Verification is ApiaryManager-exclusive; even a different beekeeper (bk-2, not the recorder) is role-denied."
        test_recipe:
          setup: ["host/site/agreement/hive in place; inspection SUBMITTED by bk-1"]
          setup_api_calls:
            - { call: "POST /api/hosts", payload: { full_name: "RBAC2 Host", email: "rbac2@x.com" }, as: Anonymous, captures: { h: $.data.id } }
            - { call: "POST /api/hosts/${h}/sign-waiver", payload: { waiver_version: "W-2026" }, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/sites", payload: { host_id: "${h}", address: "30 Rbac2 St", base_capacity_hives: 2, water_source: true, setback_feet: 5 }, as: Host, as_user_id: "${h}", captures: { site: $.data.id } }
            - { call: "POST /api/agreements", payload: { host_id: "${h}", site_id: "${site}", term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2026-12-31T00:00:00Z", host_share_base_bps: 2500 }, as: PlatformOps, captures: { ag: $.data.id } }
            - { call: "POST /api/agreements/${ag}/sign", payload: {}, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/hives", payload: { site_id: "${site}", agreement_id: "${ag}" }, as: ApiaryManager, as_user_id: "mgr-1", captures: { hv: $.data.id } }
            - { call: "POST /api/inspections", payload: { hive_id: "${hv}", inspected_at: "2026-05-10T00:00:00Z", mites_counted: 1, bees_sampled: 300, disease_flag: false, brood_score: 8, queen_seen: true, stores_kg: 10.0 }, as: Beekeeper, as_user_id: "bk-1", captures: { insp: $.data.id } }
            - { call: "POST /api/inspections/${insp}/submit", payload: {}, as: Beekeeper, as_user_id: "bk-1" }
          trigger:
            - { call: "POST /api/inspections/${insp}/verify", payload: {}, as: Beekeeper, as_user_id: "bk-2", captures: { err: $.data.error_id } }
          assert:
            - "captured ${err} == ERR_FORBIDDEN_ROLE (role check p2 precedes the segregation check p7)"

      - name: platformops_cannot_record_inspection_forbidden
        claim_type: exclusive_operation_denied
        grounds: [roles.Beekeeper, "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Field recording is Beekeeper-exclusive; PlatformOps (despite broad admin rights) cannot record an inspection."
        test_recipe:
          setup: ["host/site/agreement/hive in place"]
          setup_api_calls:
            - { call: "POST /api/hosts", payload: { full_name: "RBAC3 Host", email: "rbac3@x.com" }, as: Anonymous, captures: { h: $.data.id } }
            - { call: "POST /api/hosts/${h}/sign-waiver", payload: { waiver_version: "W-2026" }, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/sites", payload: { host_id: "${h}", address: "31 Rbac3 St", base_capacity_hives: 2, water_source: true, setback_feet: 5 }, as: Host, as_user_id: "${h}", captures: { site: $.data.id } }
            - { call: "POST /api/agreements", payload: { host_id: "${h}", site_id: "${site}", term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2026-12-31T00:00:00Z", host_share_base_bps: 2500 }, as: PlatformOps, captures: { ag: $.data.id } }
            - { call: "POST /api/agreements/${ag}/sign", payload: {}, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/hives", payload: { site_id: "${site}", agreement_id: "${ag}" }, as: ApiaryManager, as_user_id: "mgr-1", captures: { hv: $.data.id } }
          trigger:
            - { call: "POST /api/inspections", payload: { hive_id: "${hv}", inspected_at: "2026-05-10T00:00:00Z", mites_counted: 1, bees_sampled: 300, disease_flag: false, brood_score: 8, queen_seen: true, stores_kg: 10.0 }, as: PlatformOps, captures: { err: $.data.error_id } }
          assert:
            - "captured ${err} == ERR_FORBIDDEN_ROLE"

      - name: anonymous_cannot_read_host_forbidden
        claim_type: exclusive_operation_denied
        grounds: [roles.Anonymous, "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Anonymous is limited to host self-registration; authenticated GET endpoints reject the Anonymous role."
        test_recipe:
          setup: ["one host exists"]
          setup_api_calls:
            - { call: "POST /api/hosts", payload: { full_name: "Anon Host", email: "anon@x.com" }, as: Anonymous, captures: { h: $.data.id } }
          trigger:
            - { call: "GET /api/hosts/${h}", payload: {}, as: Anonymous, captures: { err: $.data.error_id } }
          assert:
            - "captured ${err} == ERR_FORBIDDEN_ROLE"

      - name: segregation_of_duties_role_model
        claim_type: role_model_pattern
        grounds: [complexity_profile.role_model, "errors[ERR_SEGREGATION_OF_DUTIES]"]
        excluded_because:
          difficulty_instance: posture_provisional_vs_authoritative_gating
          rationale: "The segregation pattern's positive path (recorder != verifier) is exercised there; denial paths are covered by verify_own_inspection_segregation_rejected and approve_own_harvest_segregation_rejected above."

  # ===========================================================================
  - section: complexity_layers
    instances:
      - name: occ_agreement_stale_version_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[agreement-amendment-occ]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on Agreement.version: a proposal carrying the pre-first-proposal version is rejected with 412 even though the AMENDMENT_PENDING self-loop is otherwise legal."
        test_recipe:
          setup: ["host ACTIVE; agreement signed (version captured from the sign response)"]
          setup_api_calls:
            - { call: "POST /api/hosts", payload: { full_name: "OCC Host", email: "occ@x.com" }, as: Anonymous, captures: { h: $.data.id } }
            - { call: "POST /api/hosts/${h}/sign-waiver", payload: { waiver_version: "W-2026" }, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/sites", payload: { host_id: "${h}", address: "32 Occ St", base_capacity_hives: 2, water_source: true, setback_feet: 5 }, as: Host, as_user_id: "${h}", captures: { site: $.data.id } }
            - { call: "POST /api/agreements", payload: { host_id: "${h}", site_id: "${site}", term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2026-12-31T00:00:00Z", host_share_base_bps: 2500 }, as: PlatformOps, captures: { ag: $.data.id } }
            - { call: "POST /api/agreements/${ag}/sign", payload: {}, as: Host, as_user_id: "${h}", captures: { ag_v: $.data.version } }
          trigger:
            - { call: "POST /api/agreements/${ag}/propose-amendment", payload: { proposed_host_share_base_bps: 2800, expected_agreement_version: "${ag_v}" }, as: PlatformOps, captures: { v_ok: $.data.version } }
            - { call: "POST /api/agreements/${ag}/propose-amendment", payload: { proposed_host_share_base_bps: 2900, expected_agreement_version: "${ag_v}" }, as: PlatformOps, captures: { err: $.data.error_id } }
          assert:
            - "first proposal succeeded: captured ${v_ok} == ${ag_v} + 1"
            - "captured ${err} == ERR_STALE_VERSION (http 412) for the second proposal replaying ${ag_v}"
            - "Agreement.${ag}.pending_host_share_base_bps remains 2800 (the stale writer did not overwrite the pending proposal)"

      - name: occ_subscription_stale_version_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[subscription-change-plan-occ]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on Subscription.version: a change-plan replaying the pre-change version is rejected with 412 even though superseding a pending plan is otherwise legal."
        test_recipe:
          setup: ["host ACTIVE; BASIC subscription ACTIVE (version captured from the create response)"]
          setup_api_calls:
            - { call: "POST /api/hosts", payload: { full_name: "OCC2 Host", email: "occ2@x.com" }, as: Anonymous, captures: { h: $.data.id } }
            - { call: "POST /api/hosts/${h}/sign-waiver", payload: { waiver_version: "W-2026" }, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/subscriptions", payload: { host_id: "${h}", plan: "BASIC" }, as: PlatformOps, captures: { sub: $.data.id, sub_v: $.data.version } }
          trigger:
            - { call: "POST /api/subscriptions/${sub}/change-plan", payload: { plan: "PLUS", expected_subscription_version: "${sub_v}" }, as: Host, as_user_id: "${h}", captures: { v2: $.data.version, pend: $.data.pending_plan } }
            - { call: "POST /api/subscriptions/${sub}/change-plan", payload: { plan: "BASIC", expected_subscription_version: "${sub_v}" }, as: Host, as_user_id: "${h}", captures: { err: $.data.error_id } }
          assert:
            - "first change-plan succeeded: captured ${v2} == ${sub_v} + 1 and ${pend} == PLUS"
            - "captured ${err} == ERR_STALE_VERSION (http 412) for the replayed ${sub_v}"
            - "Subscription.${sub}.pending_plan remains PLUS"

      - name: swarm_expiry_boundary_72h
        claim_type: scheduled_actions
        grounds: [state_machines.SwarmEvent.REPORTED_to_EXPIRED, "errors[ERR_SWARM_NOT_ACTIONABLE]"]
        distinguishing_aspect: "The 72h swarm expiry is strict: at exactly reported_at + 72h the event is still dispatchable; one second later it is EXPIRED (lazy) and dispatch fails."
        test_recipe:
          setup: ["host ACTIVE; site CLEAR; agreement ACTIVE; two swarms reported at the default clock 2026-05-01T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /api/hosts", payload: { full_name: "Swarm2 Host", email: "swarm2@x.com" }, as: Anonymous, captures: { h: $.data.id } }
            - { call: "POST /api/hosts/${h}/sign-waiver", payload: { waiver_version: "W-2026" }, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/sites", payload: { host_id: "${h}", address: "33 Swarm2 Ave", base_capacity_hives: 2, water_source: true, setback_feet: 5 }, as: Host, as_user_id: "${h}", captures: { site: $.data.id } }
            - { call: "POST /api/agreements", payload: { host_id: "${h}", site_id: "${site}", term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2026-12-31T00:00:00Z", host_share_base_bps: 2500 }, as: PlatformOps, captures: { ag: $.data.id } }
            - { call: "POST /api/agreements/${ag}/sign", payload: {}, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/swarm-events", payload: { site_id: "${site}" }, as: Host, as_user_id: "${h}", captures: { sw1: $.data.id } }
            - { call: "POST /api/swarm-events", payload: { site_id: "${site}" }, as: Host, as_user_id: "${h}", captures: { sw2: $.data.id } }
          trigger:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-04T00:00:00Z" }, as: PlatformOps }
            - { call: "POST /api/swarm-events/${sw1}/dispatch", payload: {}, as: Beekeeper, as_user_id: "bk-1", captures: { st1: $.data.status } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-04T00:00:01Z" }, as: PlatformOps }
            - { call: "GET /api/swarm-events/${sw2}", payload: {}, as: PlatformOps, captures: { st2: $.data.status } }
            - { call: "POST /api/swarm-events/${sw2}/dispatch", payload: {}, as: Beekeeper, as_user_id: "bk-1", captures: { err: $.data.error_id } }
          assert:
            - "captured ${st1} == DISPATCHED at exactly reported_at + 72h (expiry is strictly-greater)"
            - "captured ${st2} == EXPIRED one second past the boundary (lazy materialization on read)"
            - "captured ${err} == ERR_SWARM_NOT_ACTIONABLE for dispatch after expiry"

      - name: cascading_side_effects_corner
        claim_type: cascading_side_effects
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: verify_inspection_quarantine_cascade_chain
          rationale: "The N-level cascade (Inspection -> Hive -> Harvest -> Allocation) and the rollover cascade are asserted in the two transitive_cascade difficulty instances."

      - name: rate_threshold_corner
        claim_type: rate_threshold_triggers
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: mite_threshold_exact_3_00_triggers
          rationale: "Mite-load threshold crossings at 2.00/3.00/9.00 are asserted there."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_corner
        claim_type: immediate
        grounds: [complexity_profile.consistency_model]
        excluded_because:
          difficulty_instance: posture_provisional_vs_authoritative_gating
          rationale: "Same-request visibility of cascaded effects (verify -> hive quarantine -> harvest void visible on the immediately following GETs) is asserted there; invoice_balance_conserved_across_issue_void asserts the same for billing writes."
