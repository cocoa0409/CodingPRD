  - section: rbac
    instances:
      - name: applicant_write_operations_are_closed_to_every_staff_role
        claim_type: exclusive_operation
        grounds:
          - rbac.Applicant.exclusive_operations
          - errors[ERR_ROLE_NOT_PERMITTED]
          - validations[priority 2]
        distinguishing_aspect: "The three Applicant-only writes stay closed to staff even where staff clearly has business standing: an UnderwritingOfficer cannot create an application, cannot attach a beneficial owner to the application it is about to verify, and cannot submit it on the applicant's behalf - all three are 403 ERR_ROLE_NOT_PERMITTED and the application stays in DRAFT with no owners."
        test_recipe:
          setup:
            - "clock set to 2026-08-01 and one DRAFT application created by its applicant"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now_utc: "2026-08-01T00:00:00Z" }
              as: UnderwritingOfficer
