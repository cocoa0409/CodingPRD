            - "second decide — Player.${p1_id}.accrued_ir_days == 21, pension_credit_days == 21, roster_service_days == 10"
            - "Team.${team_a_id}.injured_reserve_count == 0 and active_roster_count == 1"
            - "Team.${team_a_id}.compliance_status == COMPLIANT"

  # ===========================================================================
  # R8 — resource_temporal_overlap
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: player_exam_windows_admit_abutment_but_reject_one_second_of_overlap
        grounds:
          - calculations.physical_exam_window_overlap
          - validations[priority=30]
          - errors[ERR_EXAM_WINDOW_OVERLAP]
          - state_machines.PhysicalExam.__CREATE___to_SCHEDULED
          - entities.PhysicalExam.fields.window_start_at
          - entities.PhysicalExam.fields.window_end_at
        distinguishing_aspect: |
          The contended resource is one Player's examination capacity and the interval
          semantics are HALF-OPEN: a candidate window whose start equals the occupied
          window's end_at 2026-08-10T17:00:00Z is accepted, while the same candidate moved
          one second earlier to 2026-08-10T16:59:59Z is rejected.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T12:00:00Z."
            - "Club Harbor Kings and player Ray Alder exist; no contract is needed because scheduling is independent of any filing."
            - "One SCHEDULED ENTRY_PHYSICAL already occupies the half-open window [2026-08-10T13:00:00Z, 2026-08-10T17:00:00Z) for that player."
            - "MAX_CONCURRENT_SCHEDULED_EXAMS is 1, so any collision is fatal."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T12:00:00Z" }
              as: LeagueOfficer
            - call: "POST /teams"
              payload: { name: "Harbor Kings", market_code: "HKG", salary_cap_limit_cents: 500000000, waiver_priority_rank: 1 }
              as: LeagueOfficer
              captures: { team_a_id: $.data.id }
            - call: "POST /players"
              payload: { full_name: "Ray Alder", position: "QB" }
              as: LeagueOfficer
              captures: { p1_id: $.data.id }
            - call: "POST /physical-exams"
              payload: { player_id: "${p1_id}", team_id: "${team_a_id}", exam_type: "ENTRY_PHYSICAL", window_start_at: "2026-08-10T13:00:00Z", window_end_at: "2026-08-10T17:00:00Z" }
              as: TeamMedicalOfficer
              as_user_id: "${team_a_id}"
              captures: { ex_occ_id: $.data.id, ex_occ_end: $.data.window_end_at }
          trigger:
            - call: "POST /physical-exams"
              payload: { player_id: "${p1_id}", team_id: "${team_a_id}", exam_type: "ENTRY_PHYSICAL", window_start_at: "2026-08-10T17:00:00Z", window_end_at: "2026-08-10T20:00:00Z" }
              as: TeamMedicalOfficer
              as_user_id: "${team_a_id}"
              captures: { ex_abut_id: $.data.id, ex_abut_status: $.data.status }
            - call: "POST /physical-exams"
              payload: { player_id: "${p1_id}", team_id: "${team_a_id}", exam_type: "ENTRY_PHYSICAL", window_start_at: "2026-08-10T16:59:59Z", window_end_at: "2026-08-10T20:00:00Z" }
              as: TeamMedicalOfficer
              as_user_id: "${team_a_id}"
              captures: { err_id8: $.data.error_id }
          assert:
            - "the captured ${ex_occ_end} == 2026-08-10T17:00:00Z"
            - "the abutting request returned HTTP 201 with ${ex_abut_status} == SCHEDULED and window_start_at == 2026-08-10T17:00:00Z"
            - "the one-second-earlier request returned ${err_id8} == ERR_EXAM_WINDOW_OVERLAP with HTTP 409"
            - "COUNT(PhysicalExam WHERE player_id == ${p1_id}) == 2 — the rejected window created no row"
            - "PhysicalExam.${ex_occ_id}.status == SCHEDULED and PhysicalExam.${ex_abut_id}.status == SCHEDULED"
            - "Player.${p1_id}.medical_status == PHYSICAL_PENDING"

      - name: club_medical_review_slots_collide_on_touching_deadline_endpoint
        grounds:
          - calculations.medical_review_slot_availability
          - validations[priority=31]
          - errors[ERR_MEDICAL_REVIEW_SLOT_TAKEN]
          - state_machines.Trade.PROPOSED_to_MEDICAL_REVIEW
          - entities.Team.fields.open_medical_review_count
          - entities.Trade.fields.medical_review_deadline_at
        distinguishing_aspect: |
          A different resource entity — a Team's medical-review capacity rather than a Player's
          exam calendar — and CLOSED interval semantics: a candidate starting exactly at the
          incumbent deadline 2026-08-13T14:00:00Z collides, and only 2026-08-13T14:00:01Z
          clears, the mirror image of the half-open exam rule.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T14:00:00Z."
            - "Three clubs: Harbor Kings (rank 1), Basin Otters (rank 2), Coastal Rays (rank 3), each cap 500000000."
            - "Trade T1 Harbor Kings -> Basin Otters is PHYSICAL_CONTINGENT with one DRAFT_PICK asset and was accepted by Basin Otters at 2026-08-10T14:00:00Z, so it is MEDICAL_REVIEW with medical_review_deadline_at 2026-08-13T14:00:00Z and both clubs' open_medical_review_count is 1."
            - "Trade T2 Harbor Kings -> Coastal Rays is PHYSICAL_CONTINGENT with one DRAFT_PICK asset and is still PROPOSED."
            - "Logical clock advanced to exactly 2026-08-13T14:00:00Z; no sweep has run, so T1 still holds its slot."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T14:00:00Z" }
              as: LeagueOfficer
            - call: "POST /teams"
              payload: { name: "Harbor Kings", market_code: "HKG", salary_cap_limit_cents: 500000000, waiver_priority_rank: 1 }
              as: LeagueOfficer
              captures: { team_a_id: $.data.id }
            - call: "POST /teams"
              payload: { name: "Basin Otters", market_code: "BSN", salary_cap_limit_cents: 500000000, waiver_priority_rank: 2 }
              as: LeagueOfficer
              captures: { team_b_id: $.data.id }
            - call: "POST /teams"
              payload: { name: "Coastal Rays", market_code: "CST", salary_cap_limit_cents: 500000000, waiver_priority_rank: 3 }
              as: LeagueOfficer
              captures: { team_c_id: $.data.id }
            - call: "POST /trades"
              payload: { initiating_team_id: "${team_a_id}", counterparty_team_id: "${team_b_id}", conditional_clause_type: "PHYSICAL_CONTINGENT" }
              as: TeamCapAnalyst
              as_user_id: "${team_a_id}"
              captures: { t1_id: $.data.id, t1_v1: $.data.version }
            - call: "POST /trades/${t1_id}/assets"
              payload: { asset_kind: "DRAFT_PICK", direction: "TO_COUNTERPARTY", expected_trade_version: "${t1_v1}", draft_pick_year: 2027, draft_pick_round: 3 }
              as: TeamCapAnalyst
              as_user_id: "${team_a_id}"
            - call: "POST /trades/${t1_id}/accept"
              payload: {}
              as: TeamCapAnalyst
              as_user_id: "${team_b_id}"
              captures: { t1_deadline: $.data.medical_review_deadline_at }
            - call: "POST /trades"
              payload: { initiating_team_id: "${team_a_id}", counterparty_team_id: "${team_c_id}", conditional_clause_type: "PHYSICAL_CONTINGENT" }
              as: TeamCapAnalyst
              as_user_id: "${team_a_id}"
              captures: { t2_id: $.data.id, t2_v1: $.data.version }
            - call: "POST /trades/${t2_id}/assets"
              payload: { asset_kind: "DRAFT_PICK", direction: "TO_COUNTERPARTY", expected_trade_version: "${t2_v1}", draft_pick_year: 2028, draft_pick_round: 1 }
              as: TeamCapAnalyst
              as_user_id: "${team_a_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-13T14:00:00Z" }
              as: LeagueOfficer
          trigger:
            - call: "POST /trades/${t2_id}/accept"
              payload: {}
              as: TeamCapAnalyst
              as_user_id: "${team_c_id}"
              captures: { err_id9: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-13T14:00:01Z" }
              as: LeagueOfficer
            - call: "POST /trades/${t2_id}/accept"
              payload: {}
              as: TeamCapAnalyst
              as_user_id: "${team_c_id}"
          assert:
            - "the captured ${t1_deadline} == 2026-08-13T14:00:00Z"
            - "first accept — the captured ${err_id9} == ERR_MEDICAL_REVIEW_SLOT_TAKEN with HTTP 409 because Harbor Kings' closed interval [2026-08-10T14:00:00Z, 2026-08-13T14:00:00Z] touches the candidate"
            - "first accept — Trade.${t2_id}.status == PROPOSED, accepted_at == null, version == 2"
            - "first accept — Team.${team_a_id}.open_medical_review_count == 1 and Team.${team_c_id}.open_medical_review_count == 0"
            - "second accept — HTTP 200, Trade.${t2_id}.status == MEDICAL_REVIEW, accepted_at == 2026-08-13T14:00:01Z, medical_review_deadline_at == 2026-08-16T14:00:01Z, version == 3"
            - "second accept — Team.${team_a_id}.open_medical_review_count == 2 even though MAX_CONCURRENT_MEDICAL_REVIEWS is 1, because the two intervals are disjoint"
            - "second accept — Team.${team_c_id}.open_medical_review_count == 1 and Team.${team_b_id}.open_medical_review_count == 1"
            - "Trade.${t1_id}.status == MEDICAL_REVIEW (untouched by either attempt)"

  # ===========================================================================
  # R9 — compensating_invariant
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: roster_headcount_conserved_on_waiver_withdraw
        grounds:
          - state_machines.WaiverRequest.PENDING_to_WITHDRAWN
          - state_machines.Player.WAIVED_PENDING_to_ACTIVE
          - state_machines.Transaction.APPROVED_to_VOIDED
          - calculations.designation_count_recompute
          - entities.WaiverRequest.fields.origin_designation
          - entities.Team.fields.active_roster_count
        distinguishing_aspect: |
          The conserved quantity is a HEADCOUNT — Team.active_roster_count plus the club's
          WAIVED_PENDING limbo — and withdrawing the wire must restore it to exactly 1 with the
          player back under the same ACTIVE designation, the RELEASE filing VOIDED and the
          contract untouched, leaving no orphaned roster slot.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T14:00:00Z."
            - "Club Harbor Kings (cap 500000000) with Ray Alder on an APPROVED 3-year deal: Player ACTIVE, active_roster_count 1, Contract ACTIVE at current_season_cap_charge_cents 83333333, provisional and final cap commitments both 83333333, cap_space_cents 416666667, dead_money_cents 0."
            - "A RELEASE filing was then approved, so Player is WAIVED_PENDING, active_roster_count is 0 and the filing's prior_designation is ACTIVE."
            - "The wire is placed: WaiverRequest PENDING, revocability REVOCABLE, origin_designation ACTIVE, clearance_deadline_at 2026-08-11T14:00:00Z, with no claims submitted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T14:00:00Z" }
              as: LeagueOfficer
            - call: "POST /teams"
              payload: { name: "Harbor Kings", market_code: "HKG", salary_cap_limit_cents: 500000000, waiver_priority_rank: 1 }
              as: LeagueOfficer
              captures: { team_a_id: $.data.id, team_a_v1: $.data.version }
            - call: "POST /players"
              payload: { full_name: "Ray Alder", position: "QB" }
              as: LeagueOfficer
              captures: { p1_id: $.data.id }
            - call: "POST /transactions"
              payload: { team_id: "${team_a_id}", player_id: "${p1_id}", transaction_type: "SIGNING", expected_team_version: "${team_a_v1}", years: 3, base_salary_cents: 80000000, signing_bonus_cents: 10000000, start_season_year: 2026 }
              as: TeamCapAnalyst
              as_user_id: "${team_a_id}"
              captures: { txn1_id: $.data.id, c1_id: $.data.contract_id }
            - call: "POST /physical-exams"
              payload: { player_id: "${p1_id}", team_id: "${team_a_id}", exam_type: "ENTRY_PHYSICAL", window_start_at: "2026-08-10T13:00:00Z", window_end_at: "2026-08-10T20:00:00Z", transaction_id: "${txn1_id}" }
              as: TeamMedicalOfficer
              as_user_id: "${team_a_id}"
              captures: { ex1_id: $.data.id }
            - call: "POST /physical-exams/${ex1_id}/record-result"
              payload: { result: "PASSED", performed_at: "2026-08-10T14:00:00Z" }
              as: TeamMedicalOfficer
              as_user_id: "${team_a_id}"
            - call: "POST /transactions/${txn1_id}/file"
              payload: {}
              as: TeamCapAnalyst
              as_user_id: "${team_a_id}"
            - call: "POST /transactions/${txn1_id}/decide"
              payload: { decision: "APPROVE" }
              as: LeagueOfficer
              as_user_id: "league-officer-1"
            - call: "GET /teams/${team_a_id}"
              payload: {}
              as: TeamCapAnalyst
              as_user_id: "${team_a_id}"
              captures: { team_a_v3: $.data.version, count_before: $.data.active_roster_count, prov_before: $.data.provisional_cap_committed_cents }
            - call: "POST /transactions"
              payload: { team_id: "${team_a_id}", player_id: "${p1_id}", transaction_type: "RELEASE", expected_team_version: "${team_a_v3}" }
              as: TeamCapAnalyst
              as_user_id: "${team_a_id}"
              captures: { txn_rel_id: $.data.id }
            - call: "POST /transactions/${txn_rel_id}/file"
              payload: {}
              as: TeamCapAnalyst
              as_user_id: "${team_a_id}"
            - call: "POST /transactions/${txn_rel_id}/decide"
              payload: { decision: "APPROVE" }
              as: LeagueOfficer
              as_user_id: "league-officer-1"
            - call: "POST /waiver-requests"
              payload: { player_id: "${p1_id}", from_team_id: "${team_a_id}", transaction_id: "${txn_rel_id}" }
              as: TeamCapAnalyst
              as_user_id: "${team_a_id}"
              captures: { wr9_id: $.data.id, wr9_origin: $.data.origin_designation, wr9_deadline: $.data.clearance_deadline_at }
          trigger:
            - call: "POST /waiver-requests/${wr9_id}/withdraw"
              payload: {}
              as: TeamCapAnalyst
              as_user_id: "${team_a_id}"
              captures: { wr9_status: $.data.status, wr9_processed: $.data.processed_at }
          assert:
            - "the captured ${count_before} == 1 and ${prov_before} == 83333333 (the pre-release baseline)"
            - "the captured ${wr9_origin} == ACTIVE and ${wr9_deadline} == 2026-08-11T14:00:00Z"
            - "the captured ${wr9_status} == WITHDRAWN and ${wr9_processed} == 2026-08-10T14:00:00Z"
            - "WaiverRequest.${wr9_id}.awarded_to_team_id == null and claim_count == 0"
            - "Player.${p1_id}.roster_designation == ACTIVE, current_team_id == ${team_a_id}, designation_effective_at == 2026-08-10T14:00:00Z, accrued_active_days == 0"
            - "Team.${team_a_id}.active_roster_count == 1 — identical to ${count_before}"
            - "Team.${team_a_id}.reserve_roster_count == 0, injured_reserve_count == 0, practice_squad_count == 0"
            - "Transaction.${txn_rel_id}.status == VOIDED and effective_at == null"
            - "Transaction.${txn1_id}.status == APPROVED (the signing is untouched)"
            - "Contract.${c1_id}.status == ACTIVE with current_season_cap_charge_cents == 83333333"
            - "Team.${team_a_id}.provisional_cap_committed_cents == 83333333, final_cap_committed_cents == 83333333, dead_money_cents == 0, cap_space_cents == 416666667"
            - "Team.${team_a_id}.compliance_status == COMPLIANT"

      - name: cap_dollars_conserved_on_signing_rejection
        grounds:
          - state_machines.Transaction.FILED_to_REJECTED
          - state_machines.Transaction.REJECTED_to_DRAFT
          - state_machines.Contract.PENDING_APPROVAL_to_VOIDED
          - calculations.team_cap_commitment
          - entities.Team.fields.provisional_cap_committed_cents
          - entities.Transaction.fields.revision_count
        distinguishing_aspect: |
          A different conserved quantity — cap DOLLARS rather than a headcount: the provisional
          commitment must return to exactly 0 and cap_space_cents to exactly 500000000 after each
          rejection, including after a revise/re-file/re-reject cycle, so two full round trips
          leave no residual cent of drift.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T14:00:00Z, inside the daily processing window."
            - "Club Harbor Kings exists with salary_cap_limit_cents 500000000, provisional_cap_committed_cents 0, final_cap_committed_cents 0 and cap_space_cents 500000000; version is 1."
            - "Player Ray Alder exists and is UNROSTERED with no contract."
            - "MAX_TRANSACTION_REVISIONS is 2, so one revise cycle is permitted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T14:00:00Z" }
              as: LeagueOfficer
            - call: "POST /teams"
              payload: { name: "Harbor Kings", market_code: "HKG", salary_cap_limit_cents: 500000000, waiver_priority_rank: 1 }
              as: LeagueOfficer
              captures: { team_a_id: $.data.id, team_a_v1: $.data.version }
            - call: "POST /players"
              payload: { full_name: "Ray Alder", position: "QB" }
              as: LeagueOfficer
              captures: { p1_id: $.data.id }
          trigger:
            - call: "POST /transactions"
              payload: { team_id: "${team_a_id}", player_id: "${p1_id}", transaction_type: "SIGNING", expected_team_version: "${team_a_v1}", years: 3, base_salary_cents: 80000000, signing_bonus_cents: 10000000, start_season_year: 2026 }
              as: TeamCapAnalyst
              as_user_id: "${team_a_id}"
              captures: { txn9_id: $.data.id, c9_id: $.data.contract_id }
            - call: "POST /transactions/${txn9_id}/file"
              payload: {}
              as: TeamCapAnalyst
              as_user_id: "${team_a_id}"
            - call: "POST /transactions/${txn9_id}/decide"
              payload: { decision: "REJECT", rejection_reason: "cap certification incomplete" }
              as: LeagueOfficer
              as_user_id: "league-officer-1"
            - call: "POST /transactions/${txn9_id}/revise"
              payload: {}
              as: TeamCapAnalyst
              as_user_id: "${team_a_id}"
              captures: { txn9_revisions: $.data.revision_count }
            - call: "POST /transactions/${txn9_id}/file"
              payload: {}
              as: TeamCapAnalyst
              as_user_id: "${team_a_id}"
            - call: "POST /transactions/${txn9_id}/decide"
              payload: { decision: "REJECT", rejection_reason: "terms still not certified" }
              as: LeagueOfficer
              as_user_id: "league-officer-1"
          assert:
            - "after the SIGNING filing was created — Contract.${c9_id}.status == PENDING_APPROVAL with current_season_cap_charge_cents == 83333333, and Team.${team_a_id}.provisional_cap_committed_cents == 83333333, final_cap_committed_cents == 0, cap_space_cents == 416666667"
            - "after the first REJECT — Transaction.${txn9_id}.status == REJECTED, rejection_reason == cap certification incomplete, Contract.${c9_id}.status == VOIDED"
            - "after the first REJECT — Team.${team_a_id}.provisional_cap_committed_cents == 0, final_cap_committed_cents == 0, cap_space_cents == 500000000 (exactly the pre-creation values)"
            - "after the revise — the captured ${txn9_revisions} == 1, Transaction.${txn9_id}.status == DRAFT, rejection_reason == null, decided_at == null, filing_deadline_at == 2026-08-12T14:00:00Z (unchanged)"
            - "after the revise — Contract.${c9_id}.status == PENDING_APPROVAL and Team.${team_a_id}.provisional_cap_committed_cents == 83333333 again, cap_space_cents == 416666667"
            - "after the second REJECT — Transaction.${txn9_id}.status == REJECTED, revision_count == 1, Contract.${c9_id}.status == VOIDED"
