          - errors[ERR_OUTSIDE_ACTIVITY_OVERLAP]
          - state_machines.OutsideActivityRequest.REQUESTED_to_APPROVED
        distinguishing_aspect: |
          The contended resource is a Journalist's calendar and the interval semantics are half-open
          [starts_on, ends_on): a request that begins exactly when an APPROVED engagement ends is
          admissible, and only a genuine interior overlap is refused. Only APPROVED rows occupy the
          calendar, so a still-REQUESTED window blocks nothing.
