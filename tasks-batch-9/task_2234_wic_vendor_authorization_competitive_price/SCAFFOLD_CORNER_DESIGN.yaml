        excluded_because:
          difficulty_instance: visit_failure_cascades_to_compliance_buy_and_reauth_hold
          rationale: |
            The `cascading_side_effects` row asks for an N-level chain verified
            end-to-end. That §1.8 instance walks all four hops — visit FAILED,
            open_finding_count crossing the threshold, the auto-generated COMPLIANCE_BUY
            visit at +14 days, and the resulting reauthorization_hold that makes
            complete-reauthorization fail — with each hop asserted separately.

