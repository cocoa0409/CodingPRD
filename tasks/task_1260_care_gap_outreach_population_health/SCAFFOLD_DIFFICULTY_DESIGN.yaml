          - errors[ERR_CAMPAIGN_NOT_ACTIVE]
        distinguishing_aspect: |
          Pair (OutreachAttempt, OutreachCampaign): a CareGap attempt is
          rejected unless the referenced OutreachCampaign is in ACTIVE state.
          Cross-entity dependency between the new OutreachAttempt row and the
          state of OutreachCampaign.
        test_recipe:
          setup:
            - "Registry, measure, cohort, panel, member; campaign in SCHEDULED (never launched); CareGap OPEN"
