# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3386_case_screening_evidence_testing_requests_exoneration_support
#
# Depth probe: 2 instances per each of the nine §0.5 Difficulty Rules.
# Every instance is grounded in SCAFFOLD.yaml §1.1-§1.7 and carries a fully
# structured test_recipe (empty-DB -> setup -> trigger -> assert).
# Clock discipline: the logical clock defaults to 2026-09-01T00:00:00Z;
# recipes pin it explicitly whenever a deadline/date comparison matters.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: compensation_provisional_vs_final_award
        grounds:
          - calculations.compensation_award
          - entities.CompensationClaim.fields.provisional_estimate_cents
          - entities.CompensationClaim.fields.final_award_cents
        distinguishing_aspect: |
          Same claim inputs produce two different awards because the variants run
          on different entity domains of input: PROVISIONAL uses the claimant-DECLARED
          years_incarcerated_claimed at a flat rate (50000000), while FINAL_VERIFIED
          uses SYSTEM-VERIFIED years (floor of conviction->exoneration days / 365)
          at tiered marginal rates plus the exculpatory enhancement and post-cap fee
          reimbursement (71250000).
        test_recipe:
          setup:
            - "Jurisdiction TX: compensation statute exists, cap 100000000, enhancement 10%."
            - "Case EXONERATED with exoneration_date 2026-11-20T00:00:00Z; intake conviction_date 2016-03-15T00:00:00Z (3902 days -> 10 verified years); exculpatory_evidence_flag true (database HIT)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /jurisdictions"
              payload: { state_code: "TX", name: "Texas", has_post_conviction_dna_statute: true, clemency_available: false, compensation_statute_exists: true, compensation_cap_cents: 100000000, actual_innocence_enhancement_pct: 10 }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "James Ware", inmate_number: "TX-00123", facility_name: "Huntsville" }
              as: IntakeSpecialist
              captures: { client_id: $.data.id }
            - call: "POST /intake-requests"
              payload: { client_id: "${client_id}", jurisdiction_id: "${jur_id}", conviction_date: "2016-03-15T00:00:00Z", conviction_summary: "Aggravated assault conviction, no physical evidence tie", claim_of_actual_innocence: true, claim_strength: "STRONG", evidence_potential: "CONFIRMED_STORED", years_served: 10, health_urgency: "NONE" }
              as: IntakeSpecialist
              captures: { intake_id: $.data.id }
            - { call: "POST /intake-requests/${intake_id}/advance", payload: { event: "BEGIN_SCREENING" }, as: IntakeSpecialist }
            - { call: "POST /intake-requests/${intake_id}/advance", payload: { event: "RECOMMEND", recommendation: "ACCEPT" }, as: IntakeSpecialist, as_user_id: "spec_1" }
            - call: "POST /intake-requests/${intake_id}/decide"
              payload: { decision: "ACCEPTED", assigned_attorney_id: "atty_1" }
              as: ManagingAttorney
              as_user_id: "ma_1"
              captures: { case_id: $.data.accepted_case_id }
            - { call: "POST /cases/${case_id}/advance", payload: { event: "BEGIN_INVESTIGATION" }, as: StaffAttorney, as_user_id: "atty_1" }
            - call: "POST /evidence-items"
              payload: { case_id: "${case_id}", description: "Rape kit swab, 2016 collection", evidence_type: "BIOLOGICAL_SWAB", custodian_type: "CRIME_LAB", initial_sample_ng: 25 }
              as: EvidenceAnalyst
              captures: { item_id: $.data.id }
            - { call: "POST /evidence-items/${item_id}/advance", payload: { event: "START_SEARCH" }, as: EvidenceAnalyst }
            - { call: "POST /evidence-items/${item_id}/advance", payload: { event: "MARK_LOCATED" }, as: EvidenceAnalyst }
            - { call: "POST /evidence-items/${item_id}/advance", payload: { event: "CONFIRM_CUSTODY" }, as: EvidenceAnalyst }
            - call: "POST /testing-authorizations"
              payload: { case_id: "${case_id}", evidence_item_id: "${item_id}", kind: "AGREEMENT", terms: "State agrees to STR testing at LabPrime", proposed_test_types: ["DNA_STR"] }
              as: StaffAttorney
              as_user_id: "atty_1"
              captures: { ta_id: $.data.id }
            - { call: "POST /testing-authorizations/${ta_id}/advance", payload: { event: "PROPOSE" }, as: StaffAttorney, as_user_id: "atty_1" }
            - { call: "POST /testing-authorizations/${ta_id}/advance", payload: { event: "SIGN" }, as: StaffAttorney, as_user_id: "atty_1" }
            - { call: "POST /cases/${case_id}/advance", payload: { event: "BEGIN_TESTING" }, as: StaffAttorney, as_user_id: "atty_1" }
            - call: "POST /lab-analyses"
              payload: { evidence_item_id: "${item_id}", authorization_id: "${ta_id}", lab_name: "LabPrime", test_type: "DNA_STR", required_sample_ng: 10, scheduled_start: "2026-09-10T09:00:00Z", scheduled_end: "2026-09-20T17:00:00Z" }
              as: StaffAttorney
              as_user_id: "atty_1"
              captures: { lab_id: $.data.id }
            - { call: "POST /lab-analyses/${lab_id}/advance", payload: { event: "SHIP_SAMPLE" }, as: EvidenceAnalyst }
            - { call: "POST /lab-analyses/${lab_id}/advance", payload: { event: "RECORD_RESULT", outcome: "EXCLUSIONARY", actual_consumed_ng: 10, profile_obtained: true }, as: EvidenceAnalyst }
            - { call: "POST /lab-analyses/${lab_id}/advance", payload: { event: "RUN_DATABASE_COMPARISON", database_name: "STATE_OFFENDER_DB", comparison_result: "HIT", matched_subject_name: "John Doe" }, as: StaffAttorney, as_user_id: "atty_1" }
            - { call: "POST /cases/${case_id}/advance", payload: { event: "BEGIN_LITIGATION" }, as: StaffAttorney, as_user_id: "atty_1" }
            - call: "POST /legal-petitions"
              payload: { case_id: "${case_id}", petition_type: "DIRECT_APPEAL", court_name: "TX Court of Criminal Appeals", claim_basis: "PROCEDURAL" }
              as: StaffAttorney
              as_user_id: "atty_1"
              captures: { pet_id: $.data.id }
            - { call: "POST /legal-petitions/${pet_id}/advance", payload: { event: "FILE" }, as: StaffAttorney, as_user_id: "atty_1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-20T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /legal-petitions/${pet_id}/advance", payload: { event: "RECORD_DECISION", decision: "GRANTED", vacates_conviction: true }, as: StaffAttorney, as_user_id: "atty_1" }
          trigger:
            - call: "POST /compensation-claims"
              payload: { case_id: "${case_id}", years_incarcerated_claimed: 10, documented_legal_fees_cents: 3000000 }
              as: StaffAttorney
              as_user_id: "atty_1"
              captures: { claim_id: $.data.id, prov: $.data.provisional_estimate_cents }
            - { call: "POST /compensation-claims/${claim_id}/advance", payload: { event: "FILE" }, as: StaffAttorney, as_user_id: "atty_1" }
            - call: "POST /compensation-claims/${claim_id}/advance"
              payload: { event: "RECORD_DECISION", decision: "APPROVED" }
              as: StaffAttorney
              as_user_id: "atty_1"
              captures: { final: $.data.final_award_cents }
          assert:
            - "trigger claim creation response provisional_estimate_cents == 50000000 (PROVISIONAL: flat 5000000 x 10 claimed years, cap not binding)"
            - "approval response final_award_cents == 71250000 (FINAL_VERIFIED: tiered 62500000, enhancement x1.10 -> 68750000, cap 100000000 not binding, + min(3000000, 2500000) fees)"
            - "final_award_cents != provisional_estimate_cents (71250000 != 50000000): identical case data, two variant-legal answers"
            - "verified years derive from dates not the claim: floor((2026-11-20 - 2016-03-15).days / 365) == 10"

      - name: screening_standard_vs_expedited_score
        grounds:
          - calculations.screening_priority_score
          - entities.IntakeRequest.fields.screening_score_standard
          - entities.IntakeRequest.fields.screening_score_expedited
          - entities.IntakeRequest.fields.waitlist_priority_score
        distinguishing_aspect: |
          Identical factor inputs (STRONG / LIKELY_STORED / 7 years / CRITICAL) produce
          66.55 under the STANDARD weight profile and 71.07 under the EXPEDITED
          profile; which variant feeds waitlist_priority_score is selected by the
          request's own expedited_review flag, so two identical-factor requests land
          on different waitlist positions.
        test_recipe:
          setup:
            - "Empty database; logical clock default 2026-09-01T00:00:00Z."
            - "One jurisdiction AZ and one client; two intake requests with identical factors, R1 expedited_review=false, R2 expedited_review=true."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { state_code: "AZ", name: "Arizona", has_post_conviction_dna_statute: true, clemency_available: true, compensation_statute_exists: true, compensation_cap_cents: 100000000, actual_innocence_enhancement_pct: 0 }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Maria Sol", inmate_number: "AZ-0099" }
              as: IntakeSpecialist
              captures: { client_id: $.data.id }
            - call: "POST /intake-requests"
              payload: { client_id: "${client_id}", jurisdiction_id: "${jur_id}", conviction_date: "2019-05-01T00:00:00Z", conviction_summary: "Request one", claim_of_actual_innocence: true, claim_strength: "STRONG", evidence_potential: "LIKELY_STORED", years_served: 7, health_urgency: "CRITICAL", expedited_review: false }
              as: IntakeSpecialist
              captures: { r1_id: $.data.id }
            - call: "POST /intake-requests"
              payload: { client_id: "${client_id}", jurisdiction_id: "${jur_id}", conviction_date: "2019-05-01T00:00:00Z", conviction_summary: "Request two", claim_of_actual_innocence: true, claim_strength: "STRONG", evidence_potential: "LIKELY_STORED", years_served: 7, health_urgency: "CRITICAL", expedited_review: true }
              as: IntakeSpecialist
              captures: { r2_id: $.data.id }
            - { call: "POST /intake-requests/${r1_id}/advance", payload: { event: "BEGIN_SCREENING" }, as: IntakeSpecialist }
            - { call: "POST /intake-requests/${r2_id}/advance", payload: { event: "BEGIN_SCREENING" }, as: IntakeSpecialist }
          trigger:
            - call: "POST /intake-requests/${r1_id}/advance"
              payload: { event: "RECOMMEND", recommendation: "WAITLIST" }
              as: IntakeSpecialist
              as_user_id: "spec_1"
              captures: { r1_std: $.data.screening_score_standard, r1_exp: $.data.screening_score_expedited }
            - call: "POST /intake-requests/${r2_id}/advance"
              payload: { event: "RECOMMEND", recommendation: "WAITLIST" }
              as: IntakeSpecialist
              as_user_id: "spec_1"
            - { call: "POST /intake-requests/${r1_id}/decide", payload: { decision: "WAITLISTED" }, as: ManagingAttorney, as_user_id: "ma_1" }
            - call: "POST /intake-requests/${r2_id}/decide"
              payload: { decision: "WAITLISTED" }
              as: ManagingAttorney
              as_user_id: "ma_1"
              captures: { r2_wait: $.data.waitlist_priority_score }
          assert:
            - "R1 screening_score_standard == 66.55 (34.00 + 17.88 + 4.32 + 10.35)"
            - "R1 screening_score_expedited == 71.07 (20.80 + 15.60 + 3.62 + 31.05)"
            - "R1.waitlist_priority_score == 66.55 (STANDARD selected: expedited_review false)"
            - "R2.waitlist_priority_score == 71.07 (EXPEDITED selected: expedited_review true)"
            - "same factor inputs, two variants, different stored scores: 66.55 != 71.07"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: compensation_tiered_cap_fee_ordering
        grounds:
          - calculations.compensation_award
          - state_machines.CompensationClaim.FILED_to_APPROVED
        distinguishing_aspect: |
          Mode (a) combinatorial: the final award mixes 4+ inputs (verified years,
          two tier rates, enhancement pct, statutory cap, documented fees) with
          non-linear interaction (marginal tiering, nested min, conditional
          multiplier) and a PINNED evaluation order — enhancement before cap, cap
          before fees. A fees-before-cap reading yields 60000000; a flat-rate
          reading yields 52500000; the pinned order yields 62500000.
        test_recipe:
          setup:
            - "Jurisdiction OH: cap 60000000, enhancement 10%, statute exists."
            - "Case EXONERATED (conviction 2016-03-15, exoneration 2026-11-20 -> 10 verified years) with exculpatory_evidence_flag true."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /jurisdictions"
              payload: { state_code: "OH", name: "Ohio", has_post_conviction_dna_statute: true, clemency_available: true, compensation_statute_exists: true, compensation_cap_cents: 60000000, actual_innocence_enhancement_pct: 10 }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Oliver Brand", inmate_number: "OH-5521" }
              as: IntakeSpecialist
              captures: { client_id: $.data.id }
            - call: "POST /intake-requests"
              payload: { client_id: "${client_id}", jurisdiction_id: "${jur_id}", conviction_date: "2016-03-15T00:00:00Z", conviction_summary: "Robbery conviction on eyewitness id", claim_of_actual_innocence: true, claim_strength: "STRONG", evidence_potential: "CONFIRMED_STORED", years_served: 10, health_urgency: "NONE" }
              as: IntakeSpecialist
              captures: { intake_id: $.data.id }
            - { call: "POST /intake-requests/${intake_id}/advance", payload: { event: "BEGIN_SCREENING" }, as: IntakeSpecialist }
            - { call: "POST /intake-requests/${intake_id}/advance", payload: { event: "RECOMMEND", recommendation: "ACCEPT" }, as: IntakeSpecialist, as_user_id: "spec_1" }
            - call: "POST /intake-requests/${intake_id}/decide"
              payload: { decision: "ACCEPTED", assigned_attorney_id: "atty_1" }
              as: ManagingAttorney
              as_user_id: "ma_1"
              captures: { case_id: $.data.accepted_case_id }
            - { call: "POST /cases/${case_id}/advance", payload: { event: "BEGIN_INVESTIGATION" }, as: StaffAttorney, as_user_id: "atty_1" }
            - call: "POST /evidence-items"
              payload: { case_id: "${case_id}", description: "Bandana at scene", evidence_type: "CLOTHING", custodian_type: "POLICE_PROPERTY", initial_sample_ng: 25 }
              as: EvidenceAnalyst
              captures: { item_id: $.data.id }
            - { call: "POST /evidence-items/${item_id}/advance", payload: { event: "START_SEARCH" }, as: EvidenceAnalyst }
            - { call: "POST /evidence-items/${item_id}/advance", payload: { event: "MARK_LOCATED" }, as: EvidenceAnalyst }
            - { call: "POST /evidence-items/${item_id}/advance", payload: { event: "CONFIRM_CUSTODY" }, as: EvidenceAnalyst }
            - call: "POST /testing-authorizations"
              payload: { case_id: "${case_id}", evidence_item_id: "${item_id}", kind: "AGREEMENT", terms: "Touch DNA at LabPrime", proposed_test_types: ["DNA_TOUCH"] }
              as: StaffAttorney
              as_user_id: "atty_1"
              captures: { ta_id: $.data.id }
            - { call: "POST /testing-authorizations/${ta_id}/advance", payload: { event: "PROPOSE" }, as: StaffAttorney, as_user_id: "atty_1" }
            - { call: "POST /testing-authorizations/${ta_id}/advance", payload: { event: "SIGN" }, as: StaffAttorney, as_user_id: "atty_1" }
            - { call: "POST /cases/${case_id}/advance", payload: { event: "BEGIN_TESTING" }, as: StaffAttorney, as_user_id: "atty_1" }
            - call: "POST /lab-analyses"
              payload: { evidence_item_id: "${item_id}", authorization_id: "${ta_id}", lab_name: "LabPrime", test_type: "DNA_TOUCH", required_sample_ng: 10, scheduled_start: "2026-09-10T09:00:00Z", scheduled_end: "2026-09-20T17:00:00Z" }
              as: StaffAttorney
              as_user_id: "atty_1"
              captures: { lab_id: $.data.id }
            - { call: "POST /lab-analyses/${lab_id}/advance", payload: { event: "SHIP_SAMPLE" }, as: EvidenceAnalyst }
            - { call: "POST /lab-analyses/${lab_id}/advance", payload: { event: "RECORD_RESULT", outcome: "EXCLUSIONARY", actual_consumed_ng: 10, profile_obtained: true }, as: EvidenceAnalyst }
            - { call: "POST /lab-analyses/${lab_id}/advance", payload: { event: "RUN_DATABASE_COMPARISON", database_name: "STATE_OFFENDER_DB", comparison_result: "HIT", matched_subject_name: "John Doe" }, as: StaffAttorney, as_user_id: "atty_1" }
            - { call: "POST /cases/${case_id}/advance", payload: { event: "BEGIN_LITIGATION" }, as: StaffAttorney, as_user_id: "atty_1" }
            - call: "POST /legal-petitions"
              payload: { case_id: "${case_id}", petition_type: "DIRECT_APPEAL", court_name: "OH Supreme Court", claim_basis: "PROCEDURAL" }
              as: StaffAttorney
              as_user_id: "atty_1"
              captures: { pet_id: $.data.id }
            - { call: "POST /legal-petitions/${pet_id}/advance", payload: { event: "FILE" }, as: StaffAttorney, as_user_id: "atty_1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-20T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /legal-petitions/${pet_id}/advance", payload: { event: "RECORD_DECISION", decision: "GRANTED", vacates_conviction: true }, as: StaffAttorney, as_user_id: "atty_1" }
            - call: "POST /compensation-claims"
              payload: { case_id: "${case_id}", years_incarcerated_claimed: 10, documented_legal_fees_cents: 3000000 }
              as: StaffAttorney
              as_user_id: "atty_1"
              captures: { claim_id: $.data.id }
            - { call: "POST /compensation-claims/${claim_id}/advance", payload: { event: "FILE" }, as: StaffAttorney, as_user_id: "atty_1" }
          trigger:
            - call: "POST /compensation-claims/${claim_id}/advance"
              payload: { event: "RECORD_DECISION", decision: "APPROVED" }
              as: StaffAttorney
              as_user_id: "atty_1"
              captures: { final: $.data.final_award_cents }
          assert:
            - "final_award_cents == 62500000"
            - "derivation: tiered base 5*5000000 + 5*7500000 = 62500000; enhancement x1.10 -> 68750000; cap min(68750000, 60000000) = 60000000; fees min(3000000, 2500000) = 2500000 added AFTER the cap -> 62500000"
            - "a fees-before-cap implementation yields 60000000; a flat-rate implementation yields 52500000 — both are wrong"

      - name: screening_per_factor_rounding_order
        grounds:
          - calculations.screening_priority_score
          - entities.IntakeRequest.fields.screening_score_standard
        distinguishing_aspect: |
          Mode (b) combinatorial: nested rounding order is pinned — each weighted
          product is rounded to 2 decimals HALF_UP first and the score is the sum
          of the rounded products with no final re-round. The fixture
          (STRONG/LIKELY_STORED/7y/CRITICAL, STANDARD) yields 66.55 pinned; the
          alternative sum-then-round reading yields 66.54.
        test_recipe:
          setup:
            - "Empty database. One jurisdiction, one client, one intake request with factors STRONG / LIKELY_STORED / 7 years / CRITICAL."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { state_code: "GA", name: "Georgia", has_post_conviction_dna_statute: true, clemency_available: true, compensation_statute_exists: false }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Nadia Cole", inmate_number: "GA-777" }
              as: IntakeSpecialist
              captures: { client_id: $.data.id }
            - call: "POST /intake-requests"
              payload: { client_id: "${client_id}", jurisdiction_id: "${jur_id}", conviction_date: "2019-02-01T00:00:00Z", conviction_summary: "Request for rounding probe", claim_of_actual_innocence: true, claim_strength: "STRONG", evidence_potential: "LIKELY_STORED", years_served: 7, health_urgency: "CRITICAL" }
              as: IntakeSpecialist
              captures: { r_id: $.data.id }
            - { call: "POST /intake-requests/${r_id}/advance", payload: { event: "BEGIN_SCREENING" }, as: IntakeSpecialist }
          trigger:
            - call: "POST /intake-requests/${r_id}/advance"
              payload: { event: "RECOMMEND", recommendation: "WAITLIST" }
              as: IntakeSpecialist
              as_user_id: "spec_1"
              captures: { std: $.data.screening_score_standard }
          assert:
            - "screening_score_standard == 66.55 exactly (parts 34.00 + 17.88 + 4.32 + 10.35, per-factor rounded HALF_UP, no final re-round)"
            - "f_years factor: round2(7 * 100 / 30) == 23.33"
            - "sum-then-round of unrounded products would give 66.54 — an implementation that rounds only at the end fails this assertion"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: intake_more_info_cycle_returns_to_screening
        grounds:
          - state_machines.IntakeRequest.SCREENING_to_MORE_INFO_REQUESTED
          - state_machines.IntakeRequest.MORE_INFO_REQUESTED_to_SCREENING
        distinguishing_aspect: |
          IntakeRequest is CYCLIC (SCREENING -> MORE_INFO_REQUESTED -> SCREENING),
          not a pipeline: the request can loop the information-gathering cycle
          repeatedly before any RECOMMEND, and BEGIN_SCREENING is illegal from
          MORE_INFO_REQUESTED even though SCREENING is its successor state.
        test_recipe:
          setup:
            - "One intake request in SCREENING (jurisdiction + client created first)."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { state_code: "NM", name: "New Mexico", has_post_conviction_dna_statute: true, clemency_available: false, compensation_statute_exists: false }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Tomas Rey", inmate_number: "NM-3131" }
              as: IntakeSpecialist
              captures: { client_id: $.data.id }
            - call: "POST /intake-requests"
              payload: { client_id: "${client_id}", jurisdiction_id: "${jur_id}", conviction_date: "2020-01-10T00:00:00Z", conviction_summary: "Cycle probe", claim_of_actual_innocence: true, claim_strength: "MODERATE", evidence_potential: "UNCERTAIN", years_served: 6, health_urgency: "NONE" }
              as: IntakeSpecialist
              captures: { r_id: $.data.id }
            - { call: "POST /intake-requests/${r_id}/advance", payload: { event: "BEGIN_SCREENING" }, as: IntakeSpecialist }
          trigger:
            - { call: "POST /intake-requests/${r_id}/advance", payload: { event: "REQUEST_MORE_INFO" }, as: IntakeSpecialist }
            - call: "POST /intake-requests/${r_id}/advance"
              payload: { event: "BEGIN_SCREENING" }
              as: IntakeSpecialist
              captures: { err1: $.data.error_id }
            - call: "POST /intake-requests/${r_id}/submit-supplement"
              payload: { supplement_notes: "Trial transcript pages 40-52 attached" }
              as: Client
              as_user_id: "${client_id}"
              captures: { st: $.data.status }
            - { call: "POST /intake-requests/${r_id}/advance", payload: { event: "REQUEST_MORE_INFO" }, as: IntakeSpecialist }
            - call: "POST /intake-requests/${r_id}/submit-supplement"
              payload: { supplement_notes: "Lab inventory sheet attached" }
              as: IntakeSpecialist
              captures: { st2: $.data.status }
          assert:
            - "first BEGIN_SCREENING from MORE_INFO_REQUESTED fails with ERR_INVALID_STATE (the cycle must close via submit-supplement, not a fresh begin)"
            - "submit-supplement by the owning Client succeeds: status == SCREENING and supplement_notes == 'Trial transcript pages 40-52 attached'"
            - "the loop is repeatable: second REQUEST_MORE_INFO + submit-supplement returns status == SCREENING again"

      - name: evidence_location_and_testing_dims_evolve_independently
        grounds:
          - state_machines.EvidenceItem
          - calculations.testing_status_derivation
          - entities.EvidenceItem.fields.location_status
          - entities.EvidenceItem.fields.testing_status
        distinguishing_aspect: |
          EvidenceItem carries TWO independent state dimensions on one row:
          location_status moves through IDENTIFIED->SEARCHING->LOCATED->
          CUSTODY_CONFIRMED while testing_status stays UNTESTED; a later
          TestingAuthorization SIGN flips only the testing dimension to
          TESTING_AUTHORIZED with location untouched — each dimension's writes
          leave the other byte-identical.
        test_recipe:
          setup:
            - "Accepted case in INVESTIGATION; one evidence item registered."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { state_code: "WA", name: "Washington", has_post_conviction_dna_statute: true, clemency_available: true, compensation_statute_exists: true }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Ada Nwosu", inmate_number: "WA-8181" }
              as: IntakeSpecialist
              captures: { client_id: $.data.id }
            - call: "POST /intake-requests"
              payload: { client_id: "${client_id}", jurisdiction_id: "${jur_id}", conviction_date: "2015-06-01T00:00:00Z", conviction_summary: "Dims probe", claim_of_actual_innocence: true, claim_strength: "STRONG", evidence_potential: "CONFIRMED_STORED", years_served: 11, health_urgency: "NONE" }
              as: IntakeSpecialist
              captures: { intake_id: $.data.id }
            - { call: "POST /intake-requests/${intake_id}/advance", payload: { event: "BEGIN_SCREENING" }, as: IntakeSpecialist }
            - { call: "POST /intake-requests/${intake_id}/advance", payload: { event: "RECOMMEND", recommendation: "ACCEPT" }, as: IntakeSpecialist, as_user_id: "spec_1" }
            - call: "POST /intake-requests/${intake_id}/decide"
              payload: { decision: "ACCEPTED", assigned_attorney_id: "atty_1" }
              as: ManagingAttorney
              as_user_id: "ma_1"
              captures: { case_id: $.data.accepted_case_id }
            - { call: "POST /cases/${case_id}/advance", payload: { event: "BEGIN_INVESTIGATION" }, as: StaffAttorney, as_user_id: "atty_1" }
            - call: "POST /evidence-items"
              payload: { case_id: "${case_id}", description: "Fingerprint card", evidence_type: "FINGERPRINT_CARD", custodian_type: "COURT_CLERK", initial_sample_ng: 20 }
              as: EvidenceAnalyst
              captures: { item_id: $.data.id }
          trigger:
            - { call: "POST /evidence-items/${item_id}/advance", payload: { event: "START_SEARCH" }, as: EvidenceAnalyst }
            - call: "GET /evidence-items/${item_id}"
              as: EvidenceAnalyst
              captures: { loc1: $.data.location_status, test1: $.data.testing_status }
            - { call: "POST /evidence-items/${item_id}/advance", payload: { event: "MARK_LOCATED" }, as: EvidenceAnalyst }
            - { call: "POST /evidence-items/${item_id}/advance", payload: { event: "CONFIRM_CUSTODY" }, as: EvidenceAnalyst }
            - call: "POST /testing-authorizations"
              payload: { case_id: "${case_id}", evidence_item_id: "${item_id}", kind: "AGREEMENT", terms: "Print re-lift" }
              as: StaffAttorney
              as_user_id: "atty_1"
              captures: { ta_id: $.data.id }
            - { call: "POST /testing-authorizations/${ta_id}/advance", payload: { event: "PROPOSE" }, as: StaffAttorney, as_user_id: "atty_1" }
            - { call: "POST /testing-authorizations/${ta_id}/advance", payload: { event: "SIGN" }, as: StaffAttorney, as_user_id: "atty_1" }
            - call: "GET /evidence-items/${item_id}"
              as: EvidenceAnalyst
              captures: { loc2: $.data.location_status, test2: $.data.testing_status }
          assert:
            - "after START_SEARCH: location_status == SEARCHING and testing_status == UNTESTED (location moved, testing untouched)"
            - "after CONFIRM_CUSTODY: location_status == CUSTODY_CONFIRMED and testing_status == UNTESTED"
            - "after TA SIGN: testing_status == TESTING_AUTHORIZED and location_status == CUSTODY_CONFIRMED (testing moved, location untouched)"
            - "the two dimensions never share a writer transition"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: records_response_destroyed_cascade_reaches_policy_count
        grounds:
          - state_machines.RecordsRequest.SUBMITTED_to_FULFILLED
          - state_machines.EvidenceItem."location_status=IDENTIFIED|SEARCHING|REPORTED_MISSING_to_location_status=REPORTED_DESTROYED"
          - calculations.policy_pattern_count
          - calculations.evidence_posture_derivation
        distinguishing_aspect: |
          Depth-3 chain from ONE trigger (RECORD_RESPONSE with a DESTROYED reveal):
          link 1 mutates EvidenceItem.location_status -> REPORTED_DESTROYED;
          link 2 (caused by link 1) bumps Case.destroyed_evidence_count and
          re-derives evidence_posture -> FULLY_COMPROMISED; link 3 (caused by
          link 2's Case mutation) re-derives the matching PolicyInitiative's
          stored pattern_case_count 0 -> 1. Each link is caused by the previous
          link's mutation, not by the trigger directly.
        test_recipe:
          setup:
            - "Jurisdiction IL with an EVIDENCE_PRESERVATION PolicyInitiative (pattern_case_count starts 0); an accepted case in OPEN with one SEARCHING evidence item; one SUBMITTED records request to POLICE."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /jurisdictions"
              payload: { state_code: "IL", name: "Illinois", has_post_conviction_dna_statute: true, clemency_available: true, compensation_statute_exists: true }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /policy-initiatives"
              payload: { jurisdiction_id: "${jur_id}", topic: "EVIDENCE_PRESERVATION", title: "Mandate evidence retention inventories" }
              as: PolicyDirector
              captures: { pol_id: $.data.id, pol_count0: $.data.pattern_case_count }
            - call: "POST /clients"
              payload: { full_name: "Sam Odel", inmate_number: "IL-4141" }
              as: IntakeSpecialist
              captures: { client_id: $.data.id }
            - call: "POST /intake-requests"
              payload: { client_id: "${client_id}", jurisdiction_id: "${jur_id}", conviction_date: "2014-04-01T00:00:00Z", conviction_summary: "Cascade probe", claim_of_actual_innocence: true, claim_strength: "STRONG", evidence_potential: "LIKELY_STORED", years_served: 12, health_urgency: "MODERATE" }
              as: IntakeSpecialist
              captures: { intake_id: $.data.id }
            - { call: "POST /intake-requests/${intake_id}/advance", payload: { event: "BEGIN_SCREENING" }, as: IntakeSpecialist }
            - { call: "POST /intake-requests/${intake_id}/advance", payload: { event: "RECOMMEND", recommendation: "ACCEPT" }, as: IntakeSpecialist, as_user_id: "spec_1" }
            - call: "POST /intake-requests/${intake_id}/decide"
              payload: { decision: "ACCEPTED", assigned_attorney_id: "atty_1" }
              as: ManagingAttorney
              as_user_id: "ma_1"
              captures: { case_id: $.data.accepted_case_id }
            - call: "POST /evidence-items"
              payload: { case_id: "${case_id}", description: "Knife from evidence log", evidence_type: "WEAPON", custodian_type: "POLICE_PROPERTY", initial_sample_ng: 8 }
              as: EvidenceAnalyst
              captures: { item_id: $.data.id }
            - { call: "POST /evidence-items/${item_id}/advance", payload: { event: "START_SEARCH" }, as: EvidenceAnalyst }
            - call: "POST /records-requests"
              payload: { case_id: "${case_id}", agency_type: "POLICE", agency_name: "Springfield PD Property Unit", request_summary: "All biological and weapon evidence for case 2014-CF-991" }
              as: EvidenceAnalyst
              captures: { rr_id: $.data.id }
            - { call: "POST /records-requests/${rr_id}/advance", payload: { event: "SUBMIT" }, as: EvidenceAnalyst }
          trigger:
            - call: "POST /records-requests/${rr_id}/advance"
              payload: { event: "RECORD_RESPONSE", disposition: "FULFILLED", items_revealed: [ { evidence_item_id: "${item_id}", disposition: "DESTROYED" } ] }
              as: EvidenceAnalyst
