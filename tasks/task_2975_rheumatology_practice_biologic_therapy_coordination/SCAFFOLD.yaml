scenario: "2975. Rheumatology Practice & Biologic Therapy Coordination (rheumatology group): disease activity scoring at each visit driving treatment escalation, biologic and targeted therapy authorization with step therapy and formulary exceptions, pharmacy benefit versus medical benefit routing and site-of-care decisions, infusion scheduling and self-injection training, tuberculosis and hepatitis screening prerequisites with periodic monitoring labs, drug assistance program enrollment and reauthorization calendar, treat-to-target registry participation and quality reporting, therapy interruption for surgery or infection with resumption protocols"
domain_name: "rheumatology-biologic-coordination"
api_prefix: "/"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Workflow orchestration"
  complexity_layers:
    - "Cascading side effects"
    - "Dual-variant calculation"
    - "Optimistic concurrency"
    - "Scheduled / deferred actions"

  entity_topology: flat
  # Every entity is addressed at a top-level collection (`/patients`, `/therapy-episodes`,
  # `/authorizations`, `/infusion-appointments`, `/assistance-enrollments`, ...) and linked by
  # explicit foreign-key body fields. Two read paths use the sub-resource form purely as the
  # reverse-reachability channel for cascade-created children; no entity is *owned* by a URL
  # ancestor, and TherapyEpisode references itself through `prior_episode_id`.

  state_machine_shape: parallel
  # TherapyEpisode carries two independent state dimensions on one row:
  #   therapy_state  (PLANNED -> ACTIVE <-> HELD -> DISCONTINUED)  clinical axis, cyclic
  #   funding_state  (UNFUNDED -> PENDING_AUTH -> AUTHORIZED -> LAPSED -> PENDING_AUTH)  access axis, cyclic
  # Authorization is cyclic-with-branching (DENIED -> SUBMITTED re-submission rounds),
  # InfusionAppointment is cyclic (ADMINISTERED -> SCHEDULED via reversal),
  # AssistanceEnrollment is cyclic (ACTIVE <-> EXHAUSTED, ACTIVE -> REAUTH_PENDING -> ACTIVE).

  relationship_patterns:
    - one_to_many
    - self_referential      # TherapyEpisode.prior_episode_id -> TherapyEpisode.id (step-therapy chain)
    - cross_aggregate       # InfusionAppointment reserves against Authorization AND AssistanceEnrollment

  role_model: segregation_of_duties
  # The BenefitsCounselor who submits an AssistanceEnrollment must not be the BenefitsCounselor
  # who attests it; PriorAuthCoordinator submits authorizations but cannot determine them
  # (PayerReviewer only); only a Rheumatologist whose Clinician row carries
  # can_attest_formulary_exception may sign a formulary exception.

  consistency_model: immediate

  difficulty_level: "Above the Expert band — 12 entities, 45 endpoints, 46 error codes, 48 ordered validation rules, 15 calculation rules of which 2 are dual-variant, and 6 state machines across 5 entities (TherapyEpisode carries two of them) of which 5 are non-linear"

entities:
  - name: Patient
    parent: null
    common_fields: true
    fields:
      - name: mrn
        type: string
        source: input
        description: "Practice-wide medical record number."
        constraints: "required; 6-12 chars, uppercase A-Z and 0-9 only; unique across Patient (violation -> ERR_DUPLICATE_IDENTIFIER)"
      - name: full_name
        type: string
        source: input
        description: "Patient legal name."
        constraints: "required; 1-120 chars"
      - name: date_of_birth
        type: string
        source: input
        description: "Calendar date of birth, ISO 8601 date only (YYYY-MM-DD)."
        constraints: "required; must parse as YYYY-MM-DD"
      - name: diagnosis_code
        type: enum
        source: input
        description: "Primary rheumatologic diagnosis driving therapy selection."
        constraints: "required; one of RA_SEROPOSITIVE, RA_SERONEGATIVE, PSA, AXSPA"
      - name: registry_consent
        type: boolean
        source: input
        description: "True when the patient consented to treat-to-target registry participation. Gates GET /patients/{id}/quality-report."
        constraints: "required"
      - name: tb_screen_status
        type: enum
        source: computed
        description: "Derived tuberculosis screening posture over this patient's ScreeningRecord rows; see calculations.tb_screen_status."
        constraints: "one of MISSING, CLEARED, CLEARED_AFTER_TREATMENT, EXPIRED, INDETERMINATE, POSITIVE_UNTREATED"
        default: "MISSING"
      - name: hbv_screen_status
        type: enum
        source: computed
        description: "Derived hepatitis B screening posture over this patient's ScreeningRecord rows; see calculations.hbv_screen_status."
        constraints: "one of INCOMPLETE, CLEARED, OCCULT_RISK, ACTIVE_INFECTION"
        default: "INCOMPLETE"
      - name: latest_activity_score
        type: number
        source: computed
        description: "activity_score of the patient's most recent SCORED Visit; null when the patient has no SCORED Visit."
        constraints: "2 decimal places; nullable"
      - name: latest_activity_category
        type: enum
        source: computed
        description: "activity_category of the patient's most recent SCORED Visit; null when none."
        constraints: "one of REMISSION, LOW, MODERATE, HIGH; nullable"
      - name: target_status
        type: enum
        source: computed
        description: "Treat-to-target posture derived from latest_activity_category; see calculations.patient_target_status."
        constraints: "one of AT_TARGET, NOT_AT_TARGET, UNASSESSED"
        default: "UNASSESSED"
      - name: administered_dose_total
        type: integer
        source: computed
        description: "Count of InfusionAppointment rows with status == ADMINISTERED across every TherapyEpisode whose patient_id equals this patient's id. Cross-entity derived field consumed by calculations.episode_benefit_routing."
        constraints: ">= 0"
        default: 0
      - name: active_episode_count
        type: integer
        source: computed
        description: "Count of TherapyEpisode rows for this patient with therapy_state == ACTIVE."
        constraints: ">= 0"
        default: 0

  - name: Clinician
    parent: null
    common_fields: true
    fields:
      - name: npi
        type: string
        source: input
        description: "National provider identifier."
        constraints: "required; exactly 10 digits; unique across Clinician (violation -> ERR_DUPLICATE_IDENTIFIER)"
      - name: full_name
        type: string
        source: input
        description: "Clinician name."
        constraints: "required; 1-120 chars"
      - name: role_type
        type: enum
        source: input
        description: "Practice function. Only RHEUMATOLOGIST rows may be referenced by Visit.clinician_id."
        constraints: "required; one of RHEUMATOLOGIST, NURSE"
      - name: can_attest_formulary_exception
        type: boolean
        source: input
        description: "True when this clinician is credentialed to sign formulary-exception attestations."
        constraints: "optional"
        default: false

  - name: Drug
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Product name."
        constraints: "required; 1-80 chars; unique across Drug (violation -> ERR_DUPLICATE_IDENTIFIER)"
      - name: molecule_class
        type: enum
        source: input
        description: "Mechanism class used by step-therapy matching and by surgical washout selection."
        constraints: "required; one of TNFI, IL6, JAKI, CD20, CTLA4"
      - name: route
        type: enum
        source: input
        description: "Administration route; drives benefit-channel routing."
        constraints: "required; one of IV, SC"
      - name: is_biosimilar
        type: boolean
        source: input
        description: "Informational biosimilar marker."
        constraints: "optional"
        default: false
      - name: formulary_tier
        type: integer
        source: input
        description: "Payer formulary tier; tier 5 SC products lose the pharmacy-benefit fast path."
        constraints: "required; integer 1..5"
      - name: acquisition_cost_cents
        type: integer
        source: input
        description: "Allowed amount per dose, in whole cents, before site multipliers."
        constraints: "required; integer > 0"
      - name: admin_time_minutes
        type: integer
        source: input
        description: "Chair-time minutes per administration; 0 for SC self-administered products."
        constraints: "required; integer 0..600"
      - name: monitoring_panel_type
        type: enum
        source: input
        description: "Periodic monitoring panel this product requires."
        constraints: "required; one of CBC, CMP, LFT"
      - name: monitoring_panel_interval_days
        type: integer
        source: input
        description: "Maximum whole days between the latest matching MonitoringLab.collected_at and the logical clock before monitoring_status becomes OVERDUE."
        constraints: "required; integer 1..730"
      - name: tb_screen_required
        type: boolean
        source: input
        description: "True when authorization submission requires a cleared tuberculosis screen."
        constraints: "optional"
        default: true
      - name: hbv_screen_required
        type: boolean
        source: input
        description: "True when authorization submission requires a complete hepatitis B screen."
        constraints: "optional"
        default: true
      - name: step_therapy_required_classes
        type: array
        source: input
        description: "Molecule classes that must be documented as failed before this product is authorized. Drug-level requirement, unioned with PayerPlan.step_therapy_classes_required."
        constraints: "optional; array of distinct members of {TNFI, IL6, JAKI, CD20, CTLA4}"
        default: []

  - name: PayerPlan
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Plan name."
        constraints: "required; 1-80 chars; unique across PayerPlan (violation -> ERR_DUPLICATE_IDENTIFIER)"
      - name: pharmacy_benefit_enabled
        type: boolean
        source: input
        description: "True when the plan adjudicates specialty drugs under the pharmacy benefit."
        constraints: "required"
      - name: medical_benefit_enabled
        type: boolean
        source: input
        description: "True when the plan adjudicates specialty drugs under the medical benefit."
        constraints: "required"
      - name: site_of_care_policy
        type: enum
        source: input
        description: "Plan site-of-care steering policy consumed by calculations.episode_benefit_routing."
        constraints: "required; one of SITE_NEUTRAL, PREFER_AMBULATORY, HOME_REQUIRED"
      - name: coinsurance_pct
        type: number
        source: input
        description: "Member coinsurance fraction applied to the post-deductible allowed amount."
        constraints: "required; 0.000 <= value <= 1.000, at most 3 decimal places"
      - name: deductible_remaining_cents
        type: integer
        source: input
        description: "Unmet deductible in whole cents at estimate time; consumed dose-by-dose by calculations.episode_cost_share_estimate."
        constraints: "required; integer >= 0"
      - name: medical_facility_fee_cents
        type: integer
        source: input
        description: "Flat per-dose facility fee added only under the MEDICAL cost-share variant."
        constraints: "required; integer >= 0"
      - name: hospital_outpatient_multiplier
        type: number
        source: input
        description: "Allowed-amount multiplier applied when site_of_care == HOSPITAL_OUTPATIENT."
        constraints: "required; >= 1.00, at most 2 decimal places"
      - name: appeal_rounds_allowed
        type: integer
        source: input
        description: "Number of times an Authorization may be re-submitted from DENIED."
        constraints: "required; integer 0..3"
      - name: auth_validity_days
        type: integer
        source: input
        description: "Default authorization validity window length in whole days from valid_from."
        constraints: "required; integer 1..730"
      - name: step_therapy_classes_required
        type: array
        source: input
        description: "Plan-level step-therapy classes, unioned with Drug.step_therapy_required_classes."
        constraints: "optional; array of distinct members of {TNFI, IL6, JAKI, CD20, CTLA4}"
        default: []

  - name: InfusionChair
    parent: null
    common_fields: true
    fields:
      - name: label
        type: string
        source: input
        description: "Chair label."
        constraints: "required; 1-40 chars; unique across InfusionChair (violation -> ERR_DUPLICATE_IDENTIFIER)"
      - name: site_type
        type: enum
        source: input
        description: "Physical site class; must equal the episode's site_of_care for the chair to be bookable."
        constraints: "required; one of HOSPITAL_OUTPATIENT, AMBULATORY_INFUSION_CENTER"
      - name: turnover_buffer_minutes
        type: integer
        source: input
        description: "Cleaning/turnover minutes that extend each occupied interval on BOTH sides for conflict detection."
        constraints: "required; integer 0..240"
      - name: status
        type: enum
        source: system
        description: "Chair availability. Set to OPEN at creation; mutated only by PATCH /infusion-chairs/{id}."
        constraints: "one of OPEN, CLOSED"
        default: "OPEN"

  - name: Visit
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the patient being seen."
        constraints: "required; must resolve (violation -> ERR_REFERENCE_NOT_FOUND)"
      - name: clinician_id
        type: string
        source: input
        description: "FK -> Clinician.id; must have role_type == RHEUMATOLOGIST, and must equal X-User-ID when the caller role is Rheumatologist."
        constraints: "required; must resolve (violation -> ERR_REFERENCE_NOT_FOUND)"
      - name: visit_datetime
        type: datetime
        source: input
        description: "Visit slot start, ISO 8601 UTC instant with three fractional digits accepted and normalised."
        constraints: "required"
      - name: visit_type
        type: enum
        source: input
        description: "Visit class; selects the slot duration constant VISIT_DURATION_MINUTES."
        constraints: "required; one of NEW, FOLLOW_UP, URGENT"
      - name: visit_end_datetime
        type: datetime
        source: computed
        description: "visit_datetime + VISIT_DURATION_MINUTES[visit_type]; see calculations.visit_slot_interval."
        constraints: "always set at creation"
      - name: status
        type: enum
        source: system
        description: "Visit lifecycle state."
        constraints: "one of SCHEDULED, CHECKED_IN, SCORED"
        default: "SCHEDULED"
      - name: scoring_instrument
        type: enum
        source: input
        description: "Composite instrument selected for this visit's disease-activity score. Supplied on POST /visits/{id}/score."
        constraints: "one of CDAI, DAS28_CRP; null until scored"
      - name: tender_joint_count
        type: integer
        source: input
        description: "Tender joints out of the 28-joint count."
        constraints: "integer 0..28; null until scored"
      - name: swollen_joint_count
        type: integer
        source: input
        description: "Swollen joints out of the 28-joint count."
        constraints: "integer 0..28; null until scored"
      - name: patient_global_assessment
        type: number
        source: input
        description: "Patient global assessment on a 0-10 scale."
        constraints: "0.0 <= value <= 10.0, at most 1 decimal place; null until scored"
      - name: physician_global_assessment
        type: number
        source: input
        description: "Physician global assessment on a 0-10 scale. Used only by the CDAI variant."
        constraints: "0.0 <= value <= 10.0, at most 1 decimal place; null until scored"
      - name: crp_mg_dl
        type: number
        source: input
        description: "C-reactive protein in mg/dL. Mandatory when scoring_instrument == DAS28_CRP."
        constraints: ">= 0, at most 2 decimal places; nullable"
      - name: esr_mm_hr
        type: integer
        source: input
        description: "Erythrocyte sedimentation rate, recorded for the registry only; not consumed by any calculation."
        constraints: "integer 0..200; nullable"
      - name: activity_score
        type: number
        source: computed
        description: "Composite disease activity score; see calculations.visit_disease_activity_score."
        constraints: "2 decimal places, round_half_up; null until scored"
      - name: activity_category
        type: enum
        source: computed
        description: "Band of activity_score under the selected instrument's thresholds."
        constraints: "one of REMISSION, LOW, MODERATE, HIGH; null until scored"
      - name: escalation_recommendation
        type: enum
        source: computed
        description: "Treat-to-target escalation advice; see calculations.visit_escalation_recommendation."
        constraints: "one of CONTINUE, OPTIMIZE_CURRENT, ESCALATE; null until scored"
      - name: scored_at
        type: datetime
        source: system
        description: "Logical clock instant at which POST /visits/{id}/score succeeded."
        constraints: "nullable"

  - name: ScreeningRecord
    parent: null
    common_fields: false
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the screened patient."
        constraints: "required; must resolve (violation -> ERR_REFERENCE_NOT_FOUND)"
      - name: screen_type
        type: enum
        source: input
        description: "Screening assay or treatment-completion marker."
        constraints: "required; one of TB_IGRA, TB_TST, TB_LTBI_TREATMENT_COMPLETE, HBV_SURFACE_AG, HBV_CORE_AB, HCV_AB"
      - name: result
        type: enum
        source: input
        description: "Assay result. TB_LTBI_TREATMENT_COMPLETE rows MUST carry result == COMPLETED; every other screen_type MUST carry one of NEGATIVE, POSITIVE, INDETERMINATE."
        constraints: "required; one of NEGATIVE, POSITIVE, INDETERMINATE, COMPLETED"
      - name: collected_at
        type: datetime
        source: input
        description: "Specimen collection instant, ISO 8601 UTC. Drives validity windows and latest-record selection."
        constraints: "required; must be <= resulted_at"
      - name: resulted_at
        type: datetime
        source: input
        description: "Result release instant, ISO 8601 UTC."
        constraints: "required; must be >= collected_at"
      - name: recorded_by_user_id
        type: string
        source: system
        description: "X-User-ID of the acting InfusionNurse, captured for audit only. Stored as an actor identifier; the server does not resolve it as a foreign key."
        constraints: "always set"

  - name: TherapyEpisode
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the treated patient."
        constraints: "required; must resolve (violation -> ERR_REFERENCE_NOT_FOUND)"
      - name: drug_id
        type: string
        source: input
        description: "FK -> Drug.id; the biologic or targeted synthetic product."
        constraints: "required; must resolve (violation -> ERR_REFERENCE_NOT_FOUND)"
      - name: payer_plan_id
        type: string
        source: input
        description: "FK -> PayerPlan.id; the plan adjudicating this episode."
        constraints: "required; must resolve (violation -> ERR_REFERENCE_NOT_FOUND)"
      - name: prior_episode_id
        type: string
        source: input
        description: "FK -> TherapyEpisode.id; self-referential step-therapy predecessor. When supplied it MUST belong to the same patient_id and be in therapy_state == DISCONTINUED (violation -> ERR_PRIOR_EPISODE_INVALID)."
        constraints: "optional; nullable"
      - name: therapy_start_at
        type: datetime
        source: input
        description: "Planned first-dose instant, ISO 8601 UTC. Baseline for therapy_exposure_weeks and for the 90-day escalation window."
        constraints: "required"
      - name: therapy_state
        type: enum
        source: system
        description: "Clinical axis of the parallel state machine."
        constraints: "one of PLANNED, ACTIVE, HELD, DISCONTINUED"
        default: "PLANNED"
      - name: funding_state
        type: enum
        source: system
        description: "Access axis of the parallel state machine; evolves independently of therapy_state."
        constraints: "one of UNFUNDED, PENDING_AUTH, AUTHORIZED, LAPSED"
        default: "UNFUNDED"
      - name: line_of_therapy
        type: integer
        source: computed
        description: "1 when prior_episode_id is null, otherwise prior_episode.line_of_therapy + 1. Capped by MAX_LINE_OF_THERAPY."
        constraints: "integer 1..6"
        default: 1
      - name: benefit_channel
        type: enum
        source: computed
        description: "Pharmacy-versus-medical benefit routing decision; see calculations.episode_benefit_routing."
        constraints: "one of PHARMACY, MEDICAL"
      - name: site_of_care
        type: enum
        source: computed
        description: "Site-of-care decision; see calculations.episode_benefit_routing."
        constraints: "one of SELF_ADMIN, AMBULATORY_INFUSION_CENTER, HOSPITAL_OUTPATIENT, HOME_INFUSION"
      - name: routing_frozen
        type: boolean
        source: system
        description: "False while therapy_state == PLANNED (routing recomputed on every read-affecting mutation); set true by POST /therapy-episodes/{id}/activate, after which benefit_channel and site_of_care are pinned for the episode's lifetime."
        constraints: "boolean"
        default: false
      - name: hold_reason
        type: enum
        source: system
        description: "Why therapy is interrupted; null unless therapy_state == HELD."
        constraints: "one of SURGERY, INFECTION, LAB_ABNORMALITY, AUTH_LAPSE, PATIENT_REQUEST; nullable"
      - name: held_at
        type: datetime
        source: system
        description: "Logical clock instant at which therapy_state became HELD; null unless HELD."
        constraints: "nullable"
      - name: resume_not_before
        type: datetime
        source: computed
        description: "held_at + WASHOUT_DAYS[hold_reason][drug.molecule_class] days; see calculations.resumption_earliest_instant. Null unless HELD."
        constraints: "nullable"
      - name: hold_count
        type: integer
        source: system
        description: "Number of times this episode has entered HELD, incremented on every ACTIVE -> HELD transition including cascaded ones."
        constraints: "integer >= 0"
        default: 0
      - name: discontinuation_reason
        type: enum
        source: system
        description: "Why therapy stopped; null unless therapy_state == DISCONTINUED."
        constraints: "one of INADEQUATE_RESPONSE, INTOLERANCE, REMISSION_TAPER, PATIENT_REQUEST, SAFETY_EVENT, SUPERSEDED; nullable"
      - name: discontinued_at
        type: datetime
        source: system
        description: "Logical clock instant at which therapy_state became DISCONTINUED."
        constraints: "nullable"
      - name: therapy_exposure_weeks
        type: integer
        source: computed
        description: "floor((discontinued_at - therapy_start_at) / 604800 seconds); null while therapy_state != DISCONTINUED. Consumed by calculations.step_therapy_evaluation."
        constraints: "integer >= 0; nullable"
      - name: doses_administered
        type: integer
        source: computed
        description: "Count of this episode's InfusionAppointment rows with status == ADMINISTERED."
        constraints: "integer >= 0"
        default: 0
      - name: self_injection_training_status
        type: enum
        source: system
        description: "Self-injection training outcome. Initialised to PENDING when the computed site_of_care == SELF_ADMIN and to NOT_REQUIRED otherwise; mutated by POST /therapy-episodes/{id}/record-training."
        constraints: "one of NOT_REQUIRED, PENDING, PASSED, FAILED"
        default: "NOT_REQUIRED"
      - name: self_injection_training_attempts
        type: integer
        source: system
        description: "Number of record-training calls applied to this episode."
        constraints: "integer >= 0"
        default: 0
      - name: monitoring_status
        type: enum
        source: computed
        description: "Periodic monitoring currency; see calculations.monitoring_lab_currency."
        constraints: "one of CURRENT, OVERDUE"
        default: "OVERDUE"

  - name: Authorization
    parent: null
    common_fields: true
    fields:
      - name: episode_id
        type: string
        source: input
        description: "FK -> TherapyEpisode.id; the episode this authorization funds."
        constraints: "required; must resolve (violation -> ERR_EPISODE_NOT_FOUND)"
      - name: exception_attested_by_clinician_id
        type: string
        source: system
        description: "FK -> Clinician.id; set from X-User-ID by POST /authorizations/{id}/attest-exception after verifying the clinician has role_type == RHEUMATOLOGIST and can_attest_formulary_exception == true."
        constraints: "nullable"
      - name: benefit_channel
        type: enum
        source: computed
        description: "Copied from TherapyEpisode.benefit_channel at authorization creation and frozen thereafter; determines which cost-share variant the payer adjudicates."
        constraints: "one of PHARMACY, MEDICAL"
      - name: status
        type: enum
        source: system
        description: "Authorization lifecycle state."
        constraints: "one of DRAFT, SUBMITTED, APPROVED, DENIED, EXPIRED"
        default: "DRAFT"
      - name: requested_units
        type: integer
        source: input
        description: "Number of doses requested."
        constraints: "required; integer 1..24"
      - name: approved_units
        type: integer
        source: system
        description: "Units granted by the payer determination; defaults to requested_units when the determination omits approved_units."
        constraints: "integer 0..24; nullable until APPROVED"
      - name: units_reserved
        type: integer
        source: system
        description: "Units held by InfusionAppointment rows in status SCHEDULED. Part of the conserved-units invariant."
        constraints: "integer >= 0"
        default: 0
      - name: units_consumed
        type: integer
        source: system
        description: "Units burned by InfusionAppointment rows in status ADMINISTERED. Part of the conserved-units invariant."
        constraints: "integer >= 0"
        default: 0
      - name: units_remaining
        type: integer
        source: system
        description: "approved_units - units_reserved - units_consumed. Together with the other two counters it satisfies the invariant approved_units == units_consumed + units_reserved + units_remaining."
        constraints: "integer >= 0; nullable until APPROVED"
      - name: formulary_exception_requested
        type: boolean
        source: input
        description: "True when the coordinator is asking the payer to waive unmet step therapy via a formulary exception."
        constraints: "optional"
        default: false
      - name: hbv_prophylaxis_documented
        type: boolean
        source: input
        description: "True when antiviral prophylaxis is documented, permitting submission for a patient whose hbv_screen_status == OCCULT_RISK."
        constraints: "optional"
        default: false
      - name: appeal_round
        type: integer
        source: system
        description: "0 for the first submission; incremented by one on every DENIED -> SUBMITTED re-submission."
        constraints: "integer 0..3"
        default: 0
      - name: decision_reason
        type: string
        source: system
        description: "Free-text payer rationale recorded by the determination."
        constraints: "1-240 chars; nullable"
      - name: determination_at
        type: datetime
        source: system
        description: "Logical clock instant of the most recent determination."
        constraints: "nullable"
      - name: valid_from
        type: datetime
        source: system
        description: "Start of the approved coverage window; defaults to the logical clock at determination time."
        constraints: "nullable"
      - name: valid_through
        type: datetime
        source: system
        description: "End of the approved coverage window (inclusive); defaults to valid_from + PayerPlan.auth_validity_days days."
        constraints: "nullable"
      - name: submitted_at
        type: datetime
        source: system
        description: "Logical clock instant of the most recent submission."
        constraints: "nullable"
      - name: unmet_step_therapy_classes
        type: array
        source: computed
        description: "Step-therapy classes still unsatisfied at the most recent submission attempt, ascending alphabetical; see calculations.step_therapy_evaluation."
        constraints: "array of members of {CD20, CTLA4, IL6, JAKI, TNFI}"
        default: []

  - name: MonitoringLab
    parent: null
    common_fields: false
    fields:
      - name: episode_id
        type: string
        source: input
        description: "FK -> TherapyEpisode.id; the episode this monitoring panel belongs to."
        constraints: "required; must resolve (violation -> ERR_EPISODE_NOT_FOUND)"
      - name: panel_type
        type: enum
        source: input
        description: "Panel drawn. Only panels whose panel_type equals the episode drug's monitoring_panel_type count toward monitoring currency."
        constraints: "required; one of CBC, CMP, LFT"
      - name: collected_at
        type: datetime
        source: input
        description: "Specimen collection instant, ISO 8601 UTC."
        constraints: "required"
      - name: alt_u_l
        type: number
        source: input
        description: "Alanine aminotransferase in U/L. Absent components grade as 0."
        constraints: ">= 0, at most 1 decimal place; nullable"
      - name: wbc_k_ul
        type: number
        source: input
        description: "White blood cell count in K/uL, recorded for the registry only; not graded."
        constraints: ">= 0, at most 2 decimal places; nullable"
      - name: neutrophil_k_ul
        type: number
        source: input
        description: "Absolute neutrophil count in K/uL. Absent components grade as 0."
        constraints: ">= 0, at most 2 decimal places; nullable"
      - name: alt_grade
        type: integer
        source: computed
        description: "CTCAE-style ALT grade; see calculations.lab_abnormal_grade."
        constraints: "integer 0..4"
      - name: anc_grade
        type: integer
        source: computed
        description: "CTCAE-style neutropenia grade; see calculations.lab_abnormal_grade."
        constraints: "integer 0..4"
      - name: abnormal_grade
        type: integer
        source: computed
        description: "max(alt_grade, anc_grade)."
        constraints: "integer 0..4"
      - name: triggers_hold
        type: boolean
        source: computed
        description: "True when abnormal_grade >= LAB_HOLD_GRADE_THRESHOLD (3); drives the LAB_ABNORMALITY hold cascade."
        constraints: "boolean"
      - name: recorded_by_user_id
        type: string
        source: system
        description: "X-User-ID of the acting InfusionNurse, captured for audit only. Stored as an actor identifier; the server does not resolve it as a foreign key."
        constraints: "always set"

  - name: InfusionAppointment
    parent: null
    common_fields: true
    fields:
      - name: episode_id
        type: string
        source: input
        description: "FK -> TherapyEpisode.id; the episode being dosed."
        constraints: "required; must resolve (violation -> ERR_EPISODE_NOT_FOUND)"
      - name: chair_id
        type: string
        source: input
        description: "FK -> InfusionChair.id; the chair reserved for this dose."
        constraints: "required; must resolve (violation -> ERR_CHAIR_NOT_FOUND)"
      - name: reserved_authorization_id
        type: string
        source: system
        description: "FK -> Authorization.id; the APPROVED authorization whose units this appointment reserves, selected at scheduling time by calculations.active_authorization_selector."
        constraints: "always set at creation"
      - name: reserved_enrollment_id
        type: string
        source: system
        description: "FK -> AssistanceEnrollment.id; the enrollment whose benefit this appointment reserves, selected at scheduling time by calculations.assistance_benefit_application. Null when the episode has no enrollment in status ACTIVE."
        constraints: "nullable"
      - name: scheduled_start
        type: datetime
        source: input
        description: "Chair occupancy start, ISO 8601 UTC."
        constraints: "required"
      - name: scheduled_end
        type: datetime
        source: computed
        description: "scheduled_start + Drug.admin_time_minutes minutes."
        constraints: "always set at creation"
      - name: status
        type: enum
        source: system
        description: "Appointment lifecycle state; ADMINISTERED can return to SCHEDULED via reversal."
        constraints: "one of SCHEDULED, ADMINISTERED, CANCELLED"
        default: "SCHEDULED"
      - name: dose_sequence
        type: integer
        source: computed
        description: "1 + count of the episode's InfusionAppointment rows in status SCHEDULED or ADMINISTERED evaluated immediately BEFORE this row is inserted."
        constraints: "integer >= 1"
      - name: dose_cost_share_cents
        type: integer
        source: computed
        description: "Member cost share for this single dose, taken as element dose_sequence of calculations.episode_cost_share_estimate.per_dose_share_cents."
        constraints: "integer >= 0"
      - name: assistance_applied_cents
        type: integer
        source: computed
        description: "Assistance dollars applied to this dose; see calculations.assistance_benefit_application."
        constraints: "integer >= 0"
        default: 0
      - name: patient_out_of_pocket_cents
        type: integer
        source: computed
        description: "dose_cost_share_cents - assistance_applied_cents."
        constraints: "integer >= 0"
      - name: administered_at
        type: datetime
        source: system
        description: "Logical clock instant of administration; cleared by reversal."
        constraints: "nullable"
      - name: cancellation_reason
        type: enum
        source: system
        description: "Why the appointment was cancelled; THERAPY_HELD is written only by cascades."
        constraints: "one of THERAPY_HELD, PATIENT_REQUEST, CLINIC_CLOSURE, SCHEDULING_ERROR; nullable"
      - name: reversal_reason
        type: string
        source: system
        description: "Documentation-correction rationale recorded by the most recent reversal."
        constraints: "1-240 chars; nullable"

  - name: AssistanceEnrollment
    parent: null
    common_fields: true
    fields:
      - name: episode_id
        type: string
        source: input
        description: "FK -> TherapyEpisode.id; the episode whose member responsibility this program offsets."
        constraints: "required; must resolve (violation -> ERR_EPISODE_NOT_FOUND)"
      - name: program_type
        type: enum
        source: input
        description: "Assistance program class; selects PROGRAM_DURATION_DAYS."
        constraints: "required; one of MANUFACTURER_COPAY_CARD, FOUNDATION_GRANT, PATIENT_ASSISTANCE_PROGRAM"
      - name: status
        type: enum
        source: system
        description: "Enrollment lifecycle state."
        constraints: "one of SUBMITTED, ACTIVE, EXHAUSTED, REAUTH_PENDING, TERMINATED"
        default: "SUBMITTED"
      - name: annual_benefit_cents
        type: integer
        source: input
        description: "Total program benefit for the coverage year, in whole cents. Conserved quantity of the assistance invariant."
        constraints: "required; integer > 0"
      - name: benefit_used_cents
        type: integer
        source: system
        description: "Benefit burned by ADMINISTERED doses."
        constraints: "integer >= 0"
        default: 0
      - name: benefit_reserved_cents
        type: integer
        source: system
        description: "Benefit held by SCHEDULED doses."
        constraints: "integer >= 0"
        default: 0
      - name: benefit_remaining_cents
        type: integer
        source: system
        description: "annual_benefit_cents - benefit_used_cents - benefit_reserved_cents. The three counters satisfy the invariant annual_benefit_cents == benefit_used_cents + benefit_reserved_cents + benefit_remaining_cents at all times."
        constraints: "integer >= 0"
      - name: coverage_start
        type: datetime
        source: input
        description: "Coverage window start, ISO 8601 UTC."
        constraints: "required"
      - name: coverage_end
        type: datetime
        source: computed
        description: "coverage_start + PROGRAM_DURATION_DAYS[program_type] days."
        constraints: "always set"
      - name: reauth_due_at
        type: datetime
        source: computed
        description: "coverage_end - REAUTH_LEAD_DAYS (30) days. The reauthorization calendar flips ACTIVE enrollments to REAUTH_PENDING once the logical clock reaches this instant."
        constraints: "always set"
      - name: submitted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the BenefitsCounselor who created the enrollment. Segregation-of-duties comparand; stored as an opaque actor identifier, not a foreign key."
        constraints: "always set"
      - name: attested_by_user_id
        type: string
        source: system
        description: "X-User-ID of the BenefitsCounselor who attested the enrollment. MUST differ from submitted_by_user_id. Opaque actor identifier, not a foreign key."
        constraints: "nullable"
      - name: attested_at
        type: datetime
        source: system
        description: "Logical clock instant of attestation."
        constraints: "nullable"
      - name: termination_reason
        type: enum
        source: system
        description: "Why the enrollment was terminated; FUNDING_DENIED and EPISODE_DISCONTINUED are written only by cascades."
        constraints: "one of FUNDING_DENIED, EPISODE_DISCONTINUED, PROGRAM_CLOSED; nullable"

state_machines:
  - entity: Visit
    initial_state: SCHEDULED
    terminal_states: [SCORED]
    transitions:
      - from: SCHEDULED
        to: CHECKED_IN
        trigger: "POST /visits/{id}/check-in"
        actor: InfusionNurse
        preconditions:
          - "visit.status == SCHEDULED (otherwise ERR_VISIT_NOT_CHECKED_IN is not applicable; a second check-in yields ERR_VISIT_NOT_CHECKED_IN because the status is no longer SCHEDULED)"
        side_effects:
          - "increments Visit.version by 1"
        note: "Check-in is a prerequisite for scoring; an unchecked-in visit cannot be scored."
      - from: CHECKED_IN
        to: SCORED
        trigger: "POST /visits/{id}/score"
        actor: Rheumatologist
        preconditions:
          - "visit.status == CHECKED_IN, else ERR_VISIT_NOT_CHECKED_IN"
          - "X-User-ID equals visit.clinician_id, else ERR_NOT_RESOURCE_OWNER"
          - "when scoring_instrument == DAS28_CRP, crp_mg_dl is present, else ERR_ACUTE_PHASE_REACTANT_MISSING"
        side_effects:
          - "computes activity_score, activity_category (calculations.visit_disease_activity_score) and escalation_recommendation (calculations.visit_escalation_recommendation)"
          - "sets scored_at to the logical clock"
          - "writes Patient.latest_activity_score, Patient.latest_activity_category and Patient.target_status when this visit's visit_datetime is the latest among the patient's SCORED visits (calculations.patient_target_status)"
          - "increments Visit.version by 1 and Patient.version by 1"

  - entity: TherapyEpisode
    initial_state: PLANNED
    terminal_states: [DISCONTINUED]
    transitions:
      - from: PLANNED
        to: ACTIVE
        trigger: "POST /therapy-episodes/{id}/activate"
        actor: Rheumatologist
        preconditions:
          - "episode.therapy_state == PLANNED, else ERR_EPISODE_NOT_PLANNED"
          - "episode.funding_state == AUTHORIZED, else ERR_FUNDING_NOT_AUTHORIZED"
          - "when drug.tb_screen_required, patient.tb_screen_status is CLEARED or CLEARED_AFTER_TREATMENT, else ERR_TB_SCREEN_NOT_CLEARED"
          - "when drug.hbv_screen_required, patient.hbv_screen_status != ACTIVE_INFECTION, else ERR_HBV_ACTIVE_INFECTION_CONTRAINDICATED"
          - "when drug.hbv_screen_required, patient.hbv_screen_status != INCOMPLETE, else ERR_HBV_SCREEN_INCOMPLETE"
          - "episode.monitoring_status == CURRENT, else ERR_MONITORING_LAB_OVERDUE"
          - "when drug.route == SC, episode.self_injection_training_status == PASSED, else ERR_SELF_INJECTION_TRAINING_INCOMPLETE"
        side_effects:
          - "increments Patient.active_episode_count by 1 and Patient.version by 1"
          - "increments TherapyEpisode.version by 1"
      - from: ACTIVE
        to: HELD
        trigger: "POST /therapy-episodes/{id}/hold"
        actor: Rheumatologist
        preconditions:
          - "episode.therapy_state == ACTIVE, else ERR_EPISODE_NOT_ACTIVE"
        side_effects:
          - "sets hold_reason from the request, held_at to the logical clock, increments hold_count by 1"
          - "computes resume_not_before (calculations.resumption_earliest_instant)"
          - "cancels every InfusionAppointment of this episode in status SCHEDULED with cancellation_reason THERAPY_HELD (conditional cascade: ADMINISTERED and CANCELLED appointments are untouched)"
          - "for each cancelled appointment, releases 1 unit from Authorization.units_reserved into Authorization.units_remaining and releases assistance_applied_cents from AssistanceEnrollment.benefit_reserved_cents into benefit_remaining_cents"
          - "any AssistanceEnrollment whose benefit_remaining_cents becomes > 0 and whose status == EXHAUSTED transitions to ACTIVE"
          - "decrements Patient.active_episode_count by 1 and increments Patient.version by 1"
          - "increments TherapyEpisode.version by 1"
        note: "Depth-4 cascade tail shared with the LAB_ABNORMALITY system hold."
      - from: ACTIVE
        to: HELD
        trigger: "system: POST /monitoring-labs stores a panel whose triggers_hold == true"
        actor: system
        preconditions:
          - "the lab's episode.therapy_state == ACTIVE (a lab filed against a PLANNED, HELD or DISCONTINUED episode is stored and grades normally but drives no hold)"
        side_effects:
          - "sets hold_reason LAB_ABNORMALITY, held_at to the logical clock, increments hold_count by 1"
          - "sets resume_not_before to held_at (WASHOUT_DAYS[LAB_ABNORMALITY] is 0)"
          - "applies the same appointment-cancellation, unit-release, benefit-release and EXHAUSTED -> ACTIVE tail as the operator-initiated hold"
          - "decrements Patient.active_episode_count by 1 and increments Patient.version by 1"
          - "increments TherapyEpisode.version by 1"
      - from: HELD
        to: ACTIVE
        trigger: "POST /therapy-episodes/{id}/resume"
        actor: Rheumatologist
        preconditions:
          - "episode.therapy_state == HELD, else ERR_EPISODE_NOT_HELD"
          - "logical clock >= episode.resume_not_before, else ERR_WASHOUT_PERIOD_NOT_ELAPSED"
          - "episode.funding_state == AUTHORIZED, else ERR_FUNDING_NOT_AUTHORIZED"
          - "episode.monitoring_status == CURRENT, else ERR_MONITORING_LAB_OVERDUE"
          - "when hold_reason == INFECTION the request supplies infection_resolved_attested == true; when hold_reason == LAB_ABNORMALITY the episode has a MonitoringLab of the drug's monitoring_panel_type collected strictly after held_at whose abnormal_grade <= 2; when hold_reason == SURGERY the request supplies wound_healed_attested == true; otherwise ERR_RESUMPTION_PROTOCOL_INCOMPLETE"
        side_effects:
          - "clears hold_reason, held_at and resume_not_before"
          - "increments Patient.active_episode_count by 1 and Patient.version by 1"
          - "increments TherapyEpisode.version by 1"
        note: "The resumption protocol is reason-specific — the same endpoint enforces a different obligation per hold_reason."
      - from: PLANNED
        to: DISCONTINUED
        trigger: "POST /therapy-episodes/{id}/discontinue"
        actor: Rheumatologist
        preconditions:
          - "episode.therapy_state != DISCONTINUED, else ERR_EPISODE_NOT_ACTIVE"
        side_effects:
          - "sets discontinuation_reason from the request and discontinued_at to the logical clock"
          - "computes therapy_exposure_weeks (0 when the episode never activated)"
          - "cancels every SCHEDULED InfusionAppointment of the episode with cancellation_reason THERAPY_HELD and releases the reserved units and reserved benefit as in the hold cascade"
          - "terminates every AssistanceEnrollment of the episode whose status is not TERMINATED with termination_reason EPISODE_DISCONTINUED"
          - "increments TherapyEpisode.version by 1"
      - from: PLANNED
        to: DISCONTINUED
        trigger: "system: POST /therapy-episodes creates a newer episode for the same patient (OCC supersede, see concurrency_rules.episode-create-stale-patient)"
        actor: system
        preconditions:
          - "the superseded episode's therapy_state == PLANNED (ACTIVE and HELD episodes are never auto-superseded)"
        side_effects:
          - "sets discontinuation_reason SUPERSEDED and discontinued_at to the logical clock"
          - "increments TherapyEpisode.version by 1 on the superseded episode"
      - from: ACTIVE
        to: DISCONTINUED
        trigger: "POST /therapy-episodes/{id}/discontinue"
        actor: Rheumatologist
        preconditions:
          - "episode.therapy_state != DISCONTINUED, else ERR_EPISODE_NOT_ACTIVE"
        side_effects:
          - "sets discontinuation_reason and discontinued_at; computes therapy_exposure_weeks = floor((discontinued_at - therapy_start_at) / 7 days)"
          - "decrements Patient.active_episode_count by 1 and increments Patient.version by 1"
          - "applies the appointment-cancellation, unit-release and enrollment-termination tail described above"
          - "increments TherapyEpisode.version by 1"
      - from: HELD
        to: DISCONTINUED
        trigger: "POST /therapy-episodes/{id}/discontinue"
        actor: Rheumatologist
        preconditions:
          - "episode.therapy_state != DISCONTINUED, else ERR_EPISODE_NOT_ACTIVE"
        side_effects:
          - "sets discontinuation_reason and discontinued_at; computes therapy_exposure_weeks from therapy_start_at"
          - "applies the appointment-cancellation, unit-release and enrollment-termination tail; Patient.active_episode_count is NOT decremented because a HELD episode was already removed from the active count"
          - "increments TherapyEpisode.version by 1"

  - entity: TherapyEpisode
    initial_state: UNFUNDED
    terminal_states: []
    transitions:
      - from: UNFUNDED
        to: PENDING_AUTH
        trigger: "POST /authorizations"
        actor: PriorAuthCoordinator
        preconditions:
          - "expected_episode_version matches TherapyEpisode.version, else ERR_STALE_EPISODE_VERSION"
        side_effects:
          - "expires any prior Authorization of this episode still in status DRAFT"
          - "increments TherapyEpisode.version by 1"
      - from: PENDING_AUTH
        to: AUTHORIZED
        trigger: "POST /authorizations/{id}/determination with decision APPROVED"
        actor: PayerReviewer
        preconditions:
          - "authorization.status == SUBMITTED, else ERR_AUTHORIZATION_STATE_INVALID"
        side_effects:
          - "sets approved_units, units_remaining, valid_from, valid_through on the authorization"
          - "increments TherapyEpisode.version by 1"
      - from: PENDING_AUTH
        to: UNFUNDED
        trigger: "POST /authorizations/{id}/determination with decision DENIED and authorization.appeal_round == payer_plan.appeal_rounds_allowed"
        actor: PayerReviewer
        preconditions:
          - "authorization.status == SUBMITTED, else ERR_AUTHORIZATION_STATE_INVALID"
        side_effects:
          - "terminates every AssistanceEnrollment of this episode whose status is not TERMINATED with termination_reason FUNDING_DENIED, moving benefit_reserved_cents back into benefit_remaining_cents"
          - "increments TherapyEpisode.version by 1"
        note: "Depth-3 cascade: Authorization -> TherapyEpisode.funding_state -> AssistanceEnrollment. A non-final denial leaves funding_state at PENDING_AUTH."
      - from: AUTHORIZED
        to: LAPSED
        trigger: "system: POST /_ops/run-reauthorization-calendar observes logical clock > authorization.valid_through"
        actor: system
        preconditions:
          - "the episode's most recently determined Authorization has status APPROVED"
        side_effects:
          - "sets that Authorization.status to EXPIRED"
          - "increments TherapyEpisode.version by 1"
      - from: LAPSED
        to: PENDING_AUTH
        trigger: "POST /authorizations (reauthorization)"
        actor: PriorAuthCoordinator
        preconditions:
          - "expected_episode_version matches TherapyEpisode.version, else ERR_STALE_EPISODE_VERSION"
        side_effects:
          - "increments TherapyEpisode.version by 1"
    note: "Second, independent state dimension of TherapyEpisode. therapy_state and funding_state advance on disjoint triggers; ACTIVE x LAPSED and HELD x AUTHORIZED are both legal combined states."

  - entity: Authorization
    initial_state: DRAFT
    terminal_states: [EXPIRED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /authorizations/{id}/submit"
        actor: PriorAuthCoordinator
        preconditions:
          - "authorization.status is DRAFT or DENIED, else ERR_AUTHORIZATION_STATE_INVALID"
          - "calculations.step_therapy_evaluation yields an empty unmet set, OR formulary_exception_requested == true, else ERR_STEP_THERAPY_NOT_SATISFIED"
          - "when formulary_exception_requested == true, exception_attested_by_clinician_id is non-null, else ERR_FORMULARY_EXCEPTION_NOT_ATTESTED"
          - "when patient.hbv_screen_status == OCCULT_RISK, hbv_prophylaxis_documented == true, else ERR_HBV_SCREEN_INCOMPLETE"
        side_effects:
          - "sets submitted_at to the logical clock and stores unmet_step_therapy_classes"
          - "increments Authorization.version by 1"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /authorizations/{id}/determination with decision APPROVED"
        actor: PayerReviewer
        preconditions:
          - "authorization.status == SUBMITTED, else ERR_AUTHORIZATION_STATE_INVALID"
          - "requested approved_units, when supplied, is <= requested_units, else ERR_INVALID_REQUEST"
        side_effects:
          - "sets approved_units (defaulting to requested_units), units_remaining = approved_units - units_reserved - units_consumed, determination_at, valid_from, valid_through"
          - "sets the episode's funding_state to AUTHORIZED and increments TherapyEpisode.version by 1"
          - "increments Authorization.version by 1"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /authorizations/{id}/determination with decision DENIED"
        actor: PayerReviewer
        preconditions:
          - "authorization.status == SUBMITTED, else ERR_AUTHORIZATION_STATE_INVALID"
        side_effects:
          - "sets decision_reason and determination_at"
          - "when appeal_round == payer_plan.appeal_rounds_allowed, drives the episode's funding_state to UNFUNDED and terminates the episode's assistance enrollments"
          - "increments Authorization.version by 1"
      - from: DENIED
        to: SUBMITTED
        trigger: "POST /authorizations/{id}/submit (appeal)"
        actor: PriorAuthCoordinator
        preconditions:
          - "authorization.appeal_round < payer_plan.appeal_rounds_allowed, else ERR_APPEAL_ROUNDS_EXHAUSTED"
          - "the same submission preconditions as DRAFT -> SUBMITTED apply unchanged"
        side_effects:
          - "increments appeal_round by 1, refreshes submitted_at, clears decision_reason"
          - "increments Authorization.version by 1"
        note: "Cycle: an authorization may traverse SUBMITTED -> DENIED -> SUBMITTED up to appeal_rounds_allowed times."
      - from: APPROVED
        to: EXPIRED
        trigger: "system: POST /_ops/run-reauthorization-calendar observes logical clock > valid_through"
        actor: system
        preconditions:
          - "authorization.status == APPROVED"
        side_effects:
          - "sets the episode's funding_state to LAPSED and increments TherapyEpisode.version by 1"
          - "increments Authorization.version by 1"
      - from: DRAFT
        to: EXPIRED
        trigger: "system: a newer Authorization is created for the same episode"
        actor: system
        preconditions:
          - "authorization.status == DRAFT"
        side_effects:
          - "sets decision_reason to a supersede note"
          - "increments Authorization.version by 1"

  - entity: InfusionAppointment
    initial_state: SCHEDULED
    terminal_states: [CANCELLED]
    transitions:
      - from: SCHEDULED
        to: ADMINISTERED
        trigger: "POST /infusion-appointments/{id}/administer"
        actor: InfusionNurse
        preconditions:
          - "appointment.status == SCHEDULED, else ERR_APPOINTMENT_STATE_INVALID"
          - "episode.therapy_state == ACTIVE, else ERR_EPISODE_NOT_ACTIVE"
          - "chair.status == OPEN, else ERR_CHAIR_CLOSED"
          - "episode.monitoring_status == CURRENT, else ERR_MONITORING_LAB_OVERDUE"
        side_effects:
          - "sets administered_at to the logical clock"
          - "moves 1 unit from Authorization.units_reserved to Authorization.units_consumed (units_remaining unchanged)"
          - "moves assistance_applied_cents from AssistanceEnrollment.benefit_reserved_cents to benefit_used_cents (benefit_remaining_cents unchanged)"
          - "increments TherapyEpisode.doses_administered by 1 and Patient.administered_dose_total by 1"
          - "increments InfusionAppointment.version by 1, TherapyEpisode.version by 1 and Patient.version by 1"
      - from: ADMINISTERED
        to: SCHEDULED
        trigger: "POST /infusion-appointments/{id}/reverse-administration"
        actor: InfusionNurse
        preconditions:
          - "appointment.status == ADMINISTERED, else ERR_APPOINTMENT_STATE_INVALID"
        side_effects:
          - "clears administered_at and records reversal_reason"
          - "moves 1 unit from Authorization.units_consumed back to Authorization.units_reserved"
          - "moves assistance_applied_cents from AssistanceEnrollment.benefit_used_cents back to benefit_reserved_cents"
          - "decrements TherapyEpisode.doses_administered by 1 and Patient.administered_dose_total by 1"
          - "increments InfusionAppointment.version by 1, TherapyEpisode.version by 1 and Patient.version by 1"
        note: "Compensation transition: every counter the administration moved is moved back, so both conserved-quantity invariants hold before and after."
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /infusion-appointments/{id}/cancel"
        actor: InfusionNurse
        preconditions:
          - "appointment.status == SCHEDULED, else ERR_APPOINTMENT_STATE_INVALID"
        side_effects:
          - "sets cancellation_reason from the request"
          - "releases 1 unit from Authorization.units_reserved into Authorization.units_remaining"
          - "releases assistance_applied_cents from AssistanceEnrollment.benefit_reserved_cents into benefit_remaining_cents; an EXHAUSTED enrollment whose benefit_remaining_cents becomes > 0 returns to ACTIVE"
          - "increments InfusionAppointment.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system: the episode transitions to HELD or DISCONTINUED"
        actor: system
        preconditions:
          - "appointment.status == SCHEDULED"
        side_effects:
          - "sets cancellation_reason THERAPY_HELD and applies the same unit and benefit releases"
          - "increments InfusionAppointment.version by 1"

  - entity: AssistanceEnrollment
    initial_state: SUBMITTED
    terminal_states: [TERMINATED]
    transitions:
      - from: SUBMITTED
        to: ACTIVE
        trigger: "POST /assistance-enrollments/{id}/attest"
        actor: BenefitsCounselor
        preconditions:
          - "enrollment.status == SUBMITTED, else ERR_ENROLLMENT_STATE_INVALID"
          - "X-User-ID != enrollment.submitted_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "sets attested_by_user_id and attested_at"
          - "increments AssistanceEnrollment.version by 1"
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system: a reservation or administration drives benefit_remaining_cents to 0"
        actor: system
        preconditions:
          - "enrollment.status == ACTIVE and benefit_remaining_cents == 0 after the write"
        side_effects:
          - "increments AssistanceEnrollment.version by 1"
      - from: EXHAUSTED
        to: ACTIVE
        trigger: "system: an appointment cancellation or a hold/discontinue cascade releases reserved benefit"
        actor: system
        preconditions:
          - "enrollment.status == EXHAUSTED and benefit_remaining_cents > 0 after the release"
        side_effects:
          - "increments AssistanceEnrollment.version by 1"
        note: "EXHAUSTED is recoverable, not terminal."
      - from: ACTIVE
        to: REAUTH_PENDING
        trigger: "system: POST /_ops/run-reauthorization-calendar observes logical clock >= reauth_due_at"
        actor: system
        preconditions:
          - "enrollment.status == ACTIVE"
        side_effects:
          - "increments AssistanceEnrollment.version by 1"
      - from: REAUTH_PENDING
        to: ACTIVE
        trigger: "POST /assistance-enrollments/{id}/reauthorize"
        actor: BenefitsCounselor
        preconditions:
          - "enrollment.status == REAUTH_PENDING, else ERR_ENROLLMENT_STATE_INVALID"
        side_effects:
          - "advances coverage_start to the logical clock, recomputes coverage_end and reauth_due_at, resets benefit_used_cents to 0 and benefit_remaining_cents to annual_benefit_cents - benefit_reserved_cents"
          - "increments AssistanceEnrollment.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "system: final authorization denial, or episode discontinuation"
        actor: system
        preconditions:
          - "enrollment.status != TERMINATED"
        side_effects:
          - "sets termination_reason FUNDING_DENIED or EPISODE_DISCONTINUED and releases benefit_reserved_cents into benefit_remaining_cents"
          - "increments AssistanceEnrollment.version by 1"
      - from: REAUTH_PENDING
        to: TERMINATED
        trigger: "system: final authorization denial, or episode discontinuation"
        actor: system
        preconditions:
          - "enrollment.status != TERMINATED"
        side_effects:
          - "sets termination_reason and releases reserved benefit as above"
          - "increments AssistanceEnrollment.version by 1"

concurrency_rules:
  - rule_id: episode-create-stale-patient
    parent_entity: Patient
    write_endpoint: "POST /therapy-episodes"
    occ_field: "expected_patient_version"
    description: |
      Creating a TherapyEpisode against a Patient whose version has advanced
      since the client last read it is rejected. A new episode legitimately
      supersedes the patient's still-PLANNED episodes, so a writer holding a
      stale view of the patient would silently discard an episode it never
      saw; the OCC check on Patient.version forces it to re-read first.
    error_id: ERR_STALE_PATIENT_VERSION
    http_status: 412

  - rule_id: authorization-create-stale-episode
    parent_entity: TherapyEpisode
    write_endpoint: "POST /authorizations"
    occ_field: "expected_episode_version"
    description: |
      Creating an Authorization against a TherapyEpisode whose version has
      advanced since the client last read it is rejected. Creating an
      authorization expires the episode's prior DRAFT authorization and moves
      funding_state to PENDING_AUTH, so a writer working from a stale episode
      view would expire a draft it never observed. The OCC check on
      TherapyEpisode.version makes the supersede deterministic.
    error_id: ERR_STALE_EPISODE_VERSION
    http_status: 412

calculations:
  - name: visit_slot_interval
    trigger: "POST /visits"
    algorithm: interval_merge
    formula: |
      visit_end_datetime = visit_datetime + VISIT_DURATION_MINUTES[visit_type] minutes

      The clinician-capacity check then treats [visit_datetime, visit_end_datetime)
      as a HALF-OPEN interval with ZERO buffer: a visit starting exactly at another
      visit's visit_end_datetime does NOT overlap it.
    input_set: "Visits of the same clinician_id whose status is SCHEDULED or CHECKED_IN or SCORED (only DISCONTINUED-equivalent states do not exist for Visit, so all persisted visits of that clinician count)"
    constants:
      VISIT_DURATION_MINUTES_NEW: 60
      VISIT_DURATION_MINUTES_FOLLOW_UP: 30
      VISIT_DURATION_MINUTES_URGENT: 45
      CLINICIAN_CONCURRENT_VISIT_CAP: 2
    precision: "whole minutes"

  - name: visit_disease_activity_score
    trigger: "POST /visits/{id}/score"
    algorithm: weighted_scoring
    formula: |
      Base contract: activity_score is a number with exactly 2 decimal places,
      round_half_up, and activity_category is derived from activity_score by the
      instrument's own threshold ladder. The instrument is chosen by the request's
      scoring_instrument field; the two instruments produce DIFFERENT scores and
      MAY produce different categories for the same joint counts.
    input_set: "Only the four-to-five component fields supplied on this scoring request; no other visit contributes"
    constants:
      DAS28_TJC_COEFFICIENT: 0.56
      DAS28_SJC_COEFFICIENT: 0.28
      DAS28_CRP_COEFFICIENT: 0.36
      DAS28_PGA_COEFFICIENT: 0.014
      DAS28_INTERCEPT: 0.96
      CDAI_REMISSION_MAX: 2.80
      CDAI_LOW_MAX: 10.00
      CDAI_MODERATE_MAX: 22.00
      DAS28_REMISSION_MAX_EXCLUSIVE: 2.60
      DAS28_LOW_MAX: 3.20
      DAS28_MODERATE_MAX: 5.10
    precision: "2 decimal places, round_half_up; the rounding is applied ONCE to the final score, never to intermediate terms"
    variants:
      - name: CDAI
        when: "scoring_instrument == CDAI. crp_mg_dl and esr_mm_hr are ignored even when supplied."
        difference: |
          activity_score = round_half_up(tender_joint_count + swollen_joint_count
                                        + patient_global_assessment
                                        + physician_global_assessment, 2)
          activity_category = REMISSION when activity_score <= 2.80
                              LOW      when activity_score <= 10.00
                              MODERATE when activity_score <= 22.00
                              HIGH     otherwise
          Required inputs: tender_joint_count, swollen_joint_count,
          patient_global_assessment, physician_global_assessment.
      - name: DAS28_CRP
        when: "scoring_instrument == DAS28_CRP. physician_global_assessment is ignored even when supplied; crp_mg_dl is REQUIRED (else ERR_ACUTE_PHASE_REACTANT_MISSING)."
        difference: |
          raw = 0.56 * sqrt(tender_joint_count)
              + 0.28 * sqrt(swollen_joint_count)
              + 0.36 * ln(crp_mg_dl * 10 + 1)
              + 0.014 * (patient_global_assessment * 10)
              + 0.96
          activity_score = round_half_up(raw, 2)
          activity_category = REMISSION when activity_score <  2.60
                              LOW      when activity_score <= 3.20
                              MODERATE when activity_score <= 5.10
                              HIGH     otherwise
          Note the REMISSION bound is STRICTLY less-than here, while CDAI's is
          less-than-or-equal. crp_mg_dl is expressed in mg/dL and multiplied by
          10 to reach the mg/L the published formula expects.

  - name: visit_escalation_recommendation
    trigger: "POST /visits/{id}/score, immediately after activity_category is known"
    algorithm: threshold
    formula: |
      if activity_category == HIGH:
          escalation_recommendation = ESCALATE
      elif activity_category == MODERATE:
          # look for an ACTIVE episode this patient has been on long enough to judge
          long_running = any TherapyEpisode E of visit.patient_id with
                             E.therapy_state == ACTIVE and
                             (visit.visit_datetime - E.therapy_start_at) >= ESCALATION_DWELL_DAYS days
          escalation_recommendation = ESCALATE if long_running else OPTIMIZE_CURRENT
      else:   # REMISSION or LOW
          escalation_recommendation = CONTINUE
    input_set: "TherapyEpisode rows of the same patient whose therapy_state == ACTIVE; HELD, PLANNED and DISCONTINUED episodes are excluded from the dwell test"
    constants:
      ESCALATION_DWELL_DAYS: 90
    precision: "whole days; the dwell comparison is >= (an episode whose therapy_start_at is exactly 90 days before visit_datetime DOES qualify)"

  - name: patient_target_status
    trigger: "POST /visits/{id}/score"
    algorithm: projection
    formula: |
      latest = the patient's SCORED Visit with the greatest visit_datetime;
               ties broken by the greatest created_at
      Patient.latest_activity_score    = latest.activity_score
      Patient.latest_activity_category = latest.activity_category
      Patient.target_status = AT_TARGET      when latest.activity_category in {REMISSION, LOW}
                              NOT_AT_TARGET  when latest.activity_category in {MODERATE, HIGH}
                              UNASSESSED     when the patient has no SCORED Visit
    input_set: "Visit rows of this patient with status == SCORED"
    constants:
      AT_TARGET_CATEGORIES: "REMISSION, LOW"
    precision: "no rounding; values are copied verbatim from the winning visit"
    note: "Because the winner is chosen by visit_datetime and not by scoring order, scoring an OLDER visit after a NEWER one leaves the patient's denormalized fields unchanged."

  - name: screening_status_derivation
    trigger: "POST /screening-records, and re-evaluated on every read of Patient"
    algorithm: projection
    formula: |
      Let clock = the logical clock at evaluation time.
      A ScreeningRecord is CURRENT when clock - resulted_at <= SCREEN_VALIDITY_DAYS days.

      tb_screen_status (evaluate in order, first match wins):
        POSITIVE_UNTREATED   if a CURRENT TB_IGRA or TB_TST record has result POSITIVE
                                and no TB_LTBI_TREATMENT_COMPLETE record with result
                                COMPLETED exists with resulted_at >= that positive's resulted_at
        CLEARED_AFTER_TREATMENT if such a POSITIVE exists AND a matching
                                TB_LTBI_TREATMENT_COMPLETE / COMPLETED record follows it
        INDETERMINATE        if a CURRENT TB_IGRA or TB_TST record has result INDETERMINATE
                                and no CURRENT NEGATIVE record exists
        CLEARED              if a CURRENT TB_IGRA or TB_TST record has result NEGATIVE
        EXPIRED              if TB records exist but none is CURRENT
        MISSING              if no TB record exists

      hbv_screen_status (evaluate in order, first match wins):
        ACTIVE_INFECTION  if a CURRENT HBV_SURFACE_AG record has result POSITIVE
        OCCULT_RISK       if a CURRENT HBV_CORE_AB record has result POSITIVE and
                             surface antigen is not POSITIVE
        CLEARED           if CURRENT HBV_SURFACE_AG and HBV_CORE_AB records both
                             have result NEGATIVE
        INCOMPLETE        otherwise (including the case where only one of the two
                             panels is on file, and the case where records exist but
                             none is CURRENT)
    input_set: "ScreeningRecord rows of this patient; HCV_AB records are stored for the registry and never affect either status"
    constants:
      SCREEN_VALIDITY_DAYS: 365
    precision: "whole days; validity is inclusive, so a record resulted exactly 365 days before the clock is still CURRENT"

  - name: episode_line_of_therapy
    trigger: "POST /therapy-episodes"
    algorithm: topological
    formula: |
      if prior_episode_id is null:
          line_of_therapy = 1
      else:
          line_of_therapy = prior_episode.line_of_therapy + 1
      The chain is walked only one hop; the parent already carries its own depth.
      line_of_therapy is capped at 6 (a 7th line is rejected with
      ERR_PRIOR_EPISODE_INVALID).
    input_set: "The single TherapyEpisode named by prior_episode_id, which MUST belong to the same patient_id and MUST have therapy_state == DISCONTINUED (else ERR_PRIOR_EPISODE_INVALID)"
    constants:
      MAX_LINE_OF_THERAPY: 6
    precision: "integer"

  - name: episode_benefit_routing
    trigger: "POST /therapy-episodes (result frozen: routing_frozen becomes true and neither field is ever recomputed)"
    algorithm: constraint_propagation
    formula: |
      # Step 1 — benefit channel
      if drug.route == SC:
          if payer_plan.pharmacy_benefit_enabled:      benefit_channel = PHARMACY
          elif payer_plan.medical_benefit_enabled:     benefit_channel = MEDICAL
          else:                                        reject ERR_NO_BENEFIT_CHANNEL_AVAILABLE
      else:   # route == IV
          if payer_plan.medical_benefit_enabled:       benefit_channel = MEDICAL
          else:                                        reject ERR_NO_BENEFIT_CHANNEL_AVAILABLE

      # Step 2 — site of care
      if drug.route == SC and benefit_channel == PHARMACY:
          site_of_care = SELF_ADMIN
      elif drug.route == SC and benefit_channel == MEDICAL:
          site_of_care = AMBULATORY_INFUSION_CENTER
      else:   # IV, always MEDICAL
          if   payer_plan.site_of_care_policy == HOME_REQUIRED:      site_of_care = HOME_INFUSION
          elif payer_plan.site_of_care_policy == PREFER_AMBULATORY:  site_of_care = AMBULATORY_INFUSION_CENTER
          else:  # SITE_NEUTRAL
              site_of_care = AMBULATORY_INFUSION_CENTER if drug.admin_time_minutes <= SITE_NEUTRAL_AMBULATORY_MAX_MINUTES
                             else HOSPITAL_OUTPATIENT

      # Step 3 — training obligation propagates from the site decision
      self_injection_training_status = PENDING if site_of_care == SELF_ADMIN else NOT_REQUIRED
    input_set: "The episode's own drug and payer_plan only"
    constants:
      SITE_NEUTRAL_AMBULATORY_MAX_MINUTES: 180
    precision: "no arithmetic; the 180-minute comparison is inclusive (exactly 180 routes to AMBULATORY_INFUSION_CENTER)"
    note: "Site of care feeds ERR_SITE_OF_CARE_MISMATCH at appointment creation and selects the hospital multiplier in episode_cost_share_estimate — a three-link propagation chain from a single route/policy pair."

  - name: episode_cost_share_estimate
    trigger: "GET /therapy-episodes/{id}/cost-share-estimate, and per-dose at POST /infusion-appointments"
    algorithm: waterfall_allocation
    formula: |
      dose_count = the request's dose_count for the estimate read; for an
                   appointment the single dose at index dose_sequence is taken
                   from the same per-dose vector computed with
                   dose_count = the reserved Authorization.approved_units.

      allowed_per_dose_cents and facility_per_dose_cents come from the variant.

      deductible_pool = payer_plan.deductible_remaining_cents
      per_dose_share_cents = []
      for i in 1..dose_count:
          deductible_applied = min(deductible_pool, allowed_per_dose_cents)
          deductible_pool   -= deductible_applied
          coinsurance = round_half_up((allowed_per_dose_cents - deductible_applied)
                                      * payer_plan.coinsurance_pct, 0)
          per_dose_share_cents.append(deductible_applied + coinsurance
                                      + facility_per_dose_cents)
      total_member_share_cents = sum(per_dose_share_cents)

      MANDATORY ROUNDING DISCIPLINE: the coinsurance is rounded to whole cents
      ONCE PER DOSE and the rounded per-dose amounts are then summed. Summing
      the unrounded coinsurance across doses and rounding the total at the end
      is WRONG and differs from the correct answer by one or more cents.
    input_set: "The episode's payer_plan and drug; the deductible pool is consumed dose-by-dose in ascending dose index order and never replenished within one evaluation"
    constants:
      ROUNDING: round_half_up_to_whole_cents
    precision: "whole cents; round_half_up per dose"
    variants:
      - name: PHARMACY
        when: "episode.benefit_channel == PHARMACY"
        difference: |
          allowed_per_dose_cents = drug.acquisition_cost_cents
          facility_per_dose_cents = 0
          The hospital_outpatient_multiplier is NEVER applied on the pharmacy
          benefit, and no facility fee is ever charged.
      - name: MEDICAL
        when: "episode.benefit_channel == MEDICAL"
        difference: |
          multiplier = payer_plan.hospital_outpatient_multiplier
                       when episode.site_of_care == HOSPITAL_OUTPATIENT
                       else 1.00
          allowed_per_dose_cents  = round_half_up(drug.acquisition_cost_cents * multiplier, 0)
          facility_per_dose_cents = payer_plan.medical_facility_fee_cents
          The facility fee is charged on EVERY dose and is never absorbed by the
          deductible — it sits outside the waterfall.

  - name: assistance_benefit_application
    trigger: "POST /infusion-appointments, immediately after dose_cost_share_cents is known"
    algorithm: tiered_pricing
    formula: |
      # The six steps run in EXACTLY this order.
      # 1. Select the enrollment
      candidates = AssistanceEnrollment rows of this episode with status == ACTIVE
      if candidates is empty:
          reserved_enrollment_id = null; assistance_applied_cents = 0
          patient_out_of_pocket_cents = dose_cost_share_cents; STOP
      enrollment = the candidate with the earliest created_at

      # 2. Pick the coverage tier from the GROSS dose cost share
      S = dose_cost_share_cents
      coverage_pct = 1.00 if S <  ASSISTANCE_TIER_1_MAX_EXCLUSIVE
                     0.90 if S <  ASSISTANCE_TIER_2_MAX_EXCLUSIVE
                     0.80 otherwise
      # The tier is keyed on S, NEVER on the residual out-of-pocket amount.

      # 3. Gross assistance
      gross_assistance_cents = round_half_up(S * coverage_pct, 0)

      # 4. Coverage window gate
      if logical_clock < enrollment.coverage_start or logical_clock > enrollment.coverage_end:
          reserved_enrollment_id = null; assistance_applied_cents = 0
          patient_out_of_pocket_cents = S; STOP

      # 5. Cap at the remaining benefit
      assistance_applied_cents = min(gross_assistance_cents,
                                     enrollment.benefit_remaining_cents)

      # 6. Settle
      patient_out_of_pocket_cents = S - assistance_applied_cents
      reserved_enrollment_id = enrollment.id
      enrollment.benefit_reserved_cents  += assistance_applied_cents
      enrollment.benefit_remaining_cents -= assistance_applied_cents
      if enrollment.benefit_remaining_cents == 0: enrollment.status = EXHAUSTED
    input_set: "AssistanceEnrollment rows of this episode in status ACTIVE only; SUBMITTED, REAUTH_PENDING, EXHAUSTED and TERMINATED enrollments are invisible to the selector"
    constants:
      ASSISTANCE_TIER_1_MAX_EXCLUSIVE: 20000
      ASSISTANCE_TIER_2_MAX_EXCLUSIVE: 100000
      ASSISTANCE_TIER_1_PCT: 1.00
      ASSISTANCE_TIER_2_PCT: 0.90
      ASSISTANCE_TIER_3_PCT: 0.80
    precision: "whole cents, round_half_up; the tier boundaries are exclusive upper bounds, so S == 20000 lands in tier 2 and S == 100000 lands in tier 3"
    note: "Reordering steps 2 and 6 — deriving the tier from patient_out_of_pocket_cents instead of from S — changes both outputs (for S = 138759 the correct pair is 111007 / 27752; the reordered evaluation yields 124883 / 13876)."

  - name: active_authorization_selector
    trigger: "POST /infusion-appointments"
    algorithm: chronological
    formula: |
      pool = Authorization rows of this episode with status == APPROVED
      if pool is empty or every member has units_remaining == 0:
          reject ERR_AUTHORIZATION_UNITS_EXHAUSTED
      in_window = members of pool with valid_from <= scheduled_start <= valid_through
      if in_window is empty:
          reject ERR_APPOINTMENT_OUTSIDE_AUTH_WINDOW
      usable = members of in_window with units_remaining >= 1
      if usable is empty:
          reject ERR_AUTHORIZATION_UNITS_EXHAUSTED
      reserved_authorization_id = the member of usable with the earliest valid_from,
                                  ties broken by the earliest created_at
      units_reserved  += 1
      units_remaining -= 1
    input_set: "Authorization rows of this episode with status == APPROVED; DRAFT, SUBMITTED, DENIED and EXPIRED authorizations are never selected"
    constants:
      UNITS_PER_DOSE: 1
    precision: "integers; the coverage window is inclusive at both ends"
    note: "The window check runs BEFORE the per-authorization unit check, so an out-of-window request against an exhausted-but-in-date authorization still reports ERR_APPOINTMENT_OUTSIDE_AUTH_WINDOW."

  - name: monitoring_lab_currency
    trigger: "read of TherapyEpisode.monitoring_status, and re-evaluated at every activate / resume / administer precondition check"
    algorithm: threshold
    formula: |
      matching = MonitoringLab rows of this episode whose panel_type equals
                 drug.monitoring_panel_type
      if matching is empty: monitoring_status = OVERDUE
      else:
        newest = the member of matching with the greatest collected_at
                 (ties broken by the greatest created_at)
        elapsed_days = floor((logical_clock - newest.collected_at) / 1 day)
        monitoring_status = CURRENT if elapsed_days <= drug.monitoring_panel_interval_days
                            else OVERDUE
    input_set: "MonitoringLab rows of this episode whose panel_type matches the drug's monitoring_panel_type; panels of any other type are stored but never establish currency"
    constants:
      LOOKBACK: "the single newest matching panel; older panels cannot rescue an overdue episode"
    precision: "whole days, floor; the comparison is inclusive, so elapsed_days exactly equal to monitoring_panel_interval_days is still CURRENT"

  - name: lab_abnormal_grade
    trigger: "POST /monitoring-labs"
    algorithm: threshold
    formula: |
      alt_grade = 0 if alt_u_l is null or alt_u_l <= 40
                  1 if alt_u_l <= 120
                  2 if alt_u_l <= 200
                  3 if alt_u_l <= 400
                  4 otherwise
      anc_grade = 0 if neutrophil_k_ul is null or neutrophil_k_ul >= 1.5
                  1 if neutrophil_k_ul >= 1.0
                  2 if neutrophil_k_ul >= 0.5
                  3 if neutrophil_k_ul >= 0.2
                  4 otherwise
      abnormal_grade = max(alt_grade, anc_grade)
      triggers_hold  = abnormal_grade >= LAB_HOLD_GRADE_THRESHOLD
    input_set: "Only the components supplied on this panel; an absent component grades as 0 and never blocks therapy"
    constants:
      ALT_GRADE_1_MAX: 40
      ALT_GRADE_2_MAX: 120
      ALT_GRADE_3_MAX: 200
      ALT_GRADE_4_MAX: 400
      ANC_GRADE_0_MIN: 1.5
      ANC_GRADE_1_MIN: 1.0
      ANC_GRADE_2_MIN: 0.5
      ANC_GRADE_3_MIN: 0.2
      LAB_HOLD_GRADE_THRESHOLD: 3
    precision: "ALT ladder uses inclusive upper bounds (ALT of exactly 200.0 is grade 2, 200.1 is grade 3); ANC ladder uses inclusive lower bounds (ANC of exactly 0.50 is grade 2, 0.49 is grade 3)"

  - name: resumption_earliest_instant
    trigger: "POST /therapy-episodes/{id}/hold (and the system LAB_ABNORMALITY hold)"
    algorithm: threshold
    formula: |
      resume_not_before = held_at + WASHOUT_DAYS[hold_reason][drug.molecule_class] days

      WASHOUT_DAYS:
        SURGERY:          TNFI 14, IL6 28, JAKI 7, CD20 180, CTLA4 28
        INFECTION:        7 for every molecule_class
        LAB_ABNORMALITY:  0 for every molecule_class
        AUTH_LAPSE:       0 for every molecule_class
        PATIENT_REQUEST:  0 for every molecule_class
    input_set: "The hold reason on this request and the molecule_class of the episode's drug"
    constants:
      SURGERY_WASHOUT_TNFI_DAYS: 14
      SURGERY_WASHOUT_IL6_DAYS: 28
      SURGERY_WASHOUT_JAKI_DAYS: 7
      SURGERY_WASHOUT_CD20_DAYS: 180
      SURGERY_WASHOUT_CTLA4_DAYS: 28
      INFECTION_WASHOUT_DAYS: 7
      ZERO_WASHOUT_DAYS: 0
    precision: "whole days; the resume gate is inclusive, so a resume at exactly resume_not_before succeeds"
    note: "A 5-by-5 reason-by-class matrix: the same hold reason yields five different resume instants and the same molecule yields five different instants depending on reason."

  - name: step_therapy_evaluation
    trigger: "POST /authorizations/{id}/submit"
    algorithm: aggregation
    formula: |
      required = set(drug.step_therapy_required_classes)
                 UNION set(payer_plan.step_therapy_classes_required)
                 MINUS {drug.molecule_class}

      satisfied = { M : there exists a TherapyEpisode E of the same patient with
                        E.id != this episode's id
                    AND E.therapy_state == DISCONTINUED
                    AND E.discontinuation_reason in {INADEQUATE_RESPONSE, INTOLERANCE}
                    AND drug_of(E).molecule_class == M
                    AND ( E.discontinuation_reason == INTOLERANCE
                          OR E.therapy_exposure_weeks >= STEP_MIN_EXPOSURE_WEEKS ) }

      unmet_step_therapy_classes = sorted(required MINUS satisfied)   # ascending alphabetical
      satisfied when unmet_step_therapy_classes is empty
    input_set: "TherapyEpisode rows of the same patient in therapy_state DISCONTINUED with discontinuation_reason INADEQUATE_RESPONSE or INTOLERANCE; episodes discontinued for REMISSION_TAPER, PATIENT_REQUEST, SAFETY_EVENT or SUPERSEDED never count as a trial"
    constants:
      STEP_MIN_EXPOSURE_WEEKS: 12
      QUALIFYING_DISCONTINUATION_REASONS: "INADEQUATE_RESPONSE, INTOLERANCE"
    precision: "whole weeks; therapy_exposure_weeks = floor((discontinued_at - therapy_start_at) / 7 days) and the comparison is >= (exactly 12 weeks qualifies)"
    note: "An INTOLERANCE trial counts at any exposure — a patient who stopped a TNFI after three days for anaphylaxis has satisfied the TNFI step; an INADEQUATE_RESPONSE trial needs the full 12 weeks."

  - name: quality_report_aggregation
    trigger: "GET /patients/{id}/quality-report"
    algorithm: aggregation
    formula: |
      The reporting window is HALF-OPEN: period_start <= t < period_end.

      qualifying = Visits of this patient with visit_type in {NEW, FOLLOW_UP}
                   and period_start <= visit_datetime < period_end
      if qualifying is empty: reject ERR_QUALITY_PERIOD_NO_VISITS

      scored     = members of qualifying with status == SCORED
      at_target  = members of scored with activity_category in {REMISSION, LOW}
      escalation_indicated = members of scored with escalation_recommendation == ESCALATE
      escalation_acted     = members of escalation_indicated for which the patient has
                             a TherapyEpisode whose created_at is > that visit's scored_at
                             and <= scored_at + ESCALATION_ACTION_WINDOW_DAYS days

      doses      = InfusionAppointment rows of this patient's episodes with
                   status == ADMINISTERED and period_start <= administered_at < period_end
      biosimilar_doses = members of doses whose episode's drug.is_biosimilar == true

      qualifying_visit_count           = |qualifying|
      scored_visit_count              = |scored|
      at_target_visit_count           = |at_target|
      escalation_indicated_count      = |escalation_indicated|
      escalation_acted_count          = |escalation_acted|
      administered_dose_count         = |doses|
      completeness_pct                = round_half_up(100 * |scored| / |qualifying|, 1)
      treat_to_target_attainment_pct  = round_half_up(100 * |at_target| / |scored|, 1)
                                        or 0.0 when |scored| == 0
      escalation_action_pct           = round_half_up(100 * |escalation_acted| / |escalation_indicated|, 1)
                                        or 0.0 when |escalation_indicated| == 0
      biosimilar_uptake_pct           = round_half_up(100 * |biosimilar_doses| / |doses|, 1)
                                        or 0.0 when |doses| == 0
    input_set: "Visits of visit_type NEW or FOLLOW_UP only — URGENT visits are excluded from both numerator and denominator; ADMINISTERED appointments only"
    constants:
      QUALIFYING_VISIT_TYPES: "NEW, FOLLOW_UP"
      AT_TARGET_CATEGORIES: "REMISSION, LOW"
      ESCALATION_ACTION_WINDOW_DAYS: 60
    precision: "percentages carry 1 decimal place, round_half_up; counts are integers"
    note: "The half-open window means a visit whose visit_datetime equals period_end is excluded — this alone can drop qualifying_visit_count to zero and turn a 200 into ERR_QUALITY_PERIOD_NO_VISITS."

validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and non-empty (a header sent as an empty string counts as absent)"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role is one of the seven roles declared in §1.7 AND that role appears in the target endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "the acting Clinician resolved from X-User-ID exists, has role_type == RHEUMATOLOGIST and has can_attest_formulary_exception == true"
    error_id: ERR_CLINICIAN_NOT_AUTHORIZED_TO_ATTEST
    http_status: 403
    applies_to: "POST /authorizations/{id}/attest-exception"
  - priority: 4
    category: auth
    check: "resource ownership — for POST /visits/{id}/score, X-User-ID equals visit.clinician_id; for a caller with role Patient, X-User-ID equals the patient id addressed in the path or supplied as the patient_id filter"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /visits/{id}/score, GET /patients/{id}, GET /patients/{id}/screening-records, GET /visits"
  - priority: 5
    category: existence
    check: "the Patient named by a {id} path segment under /patients exists"
    error_id: ERR_PATIENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /patients/{id}, GET /patients/{id}/screening-records, GET /patients/{id}/quality-report"
  - priority: 6
    category: existence
    check: "the Visit named by a {id} path segment under /visits exists"
    error_id: ERR_VISIT_NOT_FOUND
    http_status: 404
    applies_to: "GET /visits/{id}, POST /visits/{id}/check-in, POST /visits/{id}/score"
  - priority: 7
    category: existence
    check: "the TherapyEpisode named by a {id} path segment under /therapy-episodes exists"
    error_id: ERR_EPISODE_NOT_FOUND
    http_status: 404
    applies_to: "all /therapy-episodes/{id}... endpoints"
  - priority: 8
    category: existence
    check: "the Authorization named by a {id} path segment under /authorizations exists"
    error_id: ERR_AUTHORIZATION_NOT_FOUND
    http_status: 404
    applies_to: "all /authorizations/{id}... endpoints"
  - priority: 9
    category: existence
    check: "the InfusionAppointment named by a {id} path segment under /infusion-appointments exists"
    error_id: ERR_APPOINTMENT_NOT_FOUND
    http_status: 404
    applies_to: "all /infusion-appointments/{id}... endpoints"
  - priority: 10
    category: existence
    check: "the AssistanceEnrollment named by a {id} path segment under /assistance-enrollments exists"
    error_id: ERR_ENROLLMENT_NOT_FOUND
    http_status: 404
    applies_to: "all /assistance-enrollments/{id}... endpoints"
  - priority: 11
    category: existence
    check: "the InfusionChair named by a {id} path segment under /infusion-chairs exists"
    error_id: ERR_CHAIR_NOT_FOUND
    http_status: 404
    applies_to: "PATCH /infusion-chairs/{id}"
  - priority: 12
    category: existence
    check: "request payload shape — every required field present, every value of the declared JSON type, enums drawn from the declared member set, numbers inside the declared range and decimal width, datetimes parseable as ISO 8601 UTC instants, pagination limit within 1..100 and offset >= 0, and (for POST /screening-records) collected_at <= resulted_at"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all"
  - priority: 13
    category: existence
    check: "a supplied patient_id, clinician_id, drug_id, payer_plan_id or prior_episode_id body field resolves to a persisted row"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "POST /visits, POST /screening-records, POST /therapy-episodes"
  - priority: 14
    category: existence
    check: "a supplied episode_id body field resolves to a persisted TherapyEpisode"
    error_id: ERR_EPISODE_NOT_FOUND
    http_status: 404
    applies_to: "POST /authorizations, POST /monitoring-labs, POST /infusion-appointments, POST /assistance-enrollments"
  - priority: 15
    category: existence
    check: "a supplied chair_id body field resolves to a persisted InfusionChair"
    error_id: ERR_CHAIR_NOT_FOUND
    http_status: 404
    applies_to: "POST /infusion-appointments"
  - priority: 16
    category: state
    check: "expected_patient_version equals the current Patient.version (see concurrency_rules.episode-create-stale-patient)"
    error_id: ERR_STALE_PATIENT_VERSION
    http_status: 412
    applies_to: "POST /therapy-episodes"
  - priority: 17
    category: state
    check: "expected_episode_version equals the current TherapyEpisode.version (see concurrency_rules.authorization-create-stale-episode)"
    error_id: ERR_STALE_EPISODE_VERSION
    http_status: 412
    applies_to: "POST /authorizations"
  - priority: 18
    category: state
    check: "visit.status == SCHEDULED for check-in; visit.status == CHECKED_IN for scoring"
    error_id: ERR_VISIT_NOT_CHECKED_IN
    http_status: 409
    applies_to: "POST /visits/{id}/check-in, POST /visits/{id}/score"
  - priority: 19
    category: state
    check: "authorization.status is DRAFT or DENIED for submit; DRAFT or DENIED for attest-exception; SUBMITTED for determination"
    error_id: ERR_AUTHORIZATION_STATE_INVALID
    http_status: 409
    applies_to: "POST /authorizations/{id}/submit, POST /authorizations/{id}/attest-exception, POST /authorizations/{id}/determination"
  - priority: 20
    category: state
    check: "for a DENIED -> SUBMITTED re-submission, authorization.appeal_round < payer_plan.appeal_rounds_allowed"
    error_id: ERR_APPEAL_ROUNDS_EXHAUSTED
    http_status: 409
    applies_to: "POST /authorizations/{id}/submit"
  - priority: 21
    category: state
    check: "episode.therapy_state == PLANNED"
    error_id: ERR_EPISODE_NOT_PLANNED
    http_status: 409
    applies_to: "POST /therapy-episodes/{id}/activate"
  - priority: 22
    category: state
    check: "episode.therapy_state == ACTIVE (for discontinue the check is therapy_state != DISCONTINUED)"
    error_id: ERR_EPISODE_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /therapy-episodes/{id}/hold, POST /therapy-episodes/{id}/discontinue, POST /infusion-appointments, POST /infusion-appointments/{id}/administer"
  - priority: 23
    category: state
    check: "episode.therapy_state == HELD"
    error_id: ERR_EPISODE_NOT_HELD
    http_status: 409
    applies_to: "POST /therapy-episodes/{id}/resume"
  - priority: 24
    category: state
    check: "appointment.status == SCHEDULED for administer and cancel; appointment.status == ADMINISTERED for reverse-administration"
    error_id: ERR_APPOINTMENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /infusion-appointments/{id}/administer, POST /infusion-appointments/{id}/reverse-administration, POST /infusion-appointments/{id}/cancel"
  - priority: 25
    category: state
    check: "enrollment.status == SUBMITTED for attest; enrollment.status == REAUTH_PENDING for reauthorize"
    error_id: ERR_ENROLLMENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /assistance-enrollments/{id}/attest, POST /assistance-enrollments/{id}/reauthorize"
  - priority: 26
    category: state
    check: "episode.funding_state == AUTHORIZED"
    error_id: ERR_FUNDING_NOT_AUTHORIZED
    http_status: 409
    applies_to: "POST /therapy-episodes/{id}/activate, POST /therapy-episodes/{id}/resume"
  - priority: 27
    category: state
    check: "the chair referenced by the appointment has status == OPEN"
    error_id: ERR_CHAIR_CLOSED
    http_status: 409
    applies_to: "POST /infusion-appointments, POST /infusion-appointments/{id}/administer"
  - priority: 28
    category: state
    check: "X-User-ID differs from enrollment.submitted_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /assistance-enrollments/{id}/attest"
  - priority: 29
    category: business_safety
    check: "when drug.tb_screen_required, patient.tb_screen_status is CLEARED or CLEARED_AFTER_TREATMENT"
    error_id: ERR_TB_SCREEN_NOT_CLEARED
    http_status: 422
    applies_to: "POST /therapy-episodes/{id}/activate"
  - priority: 30
    category: business_safety
    check: "when drug.hbv_screen_required, patient.hbv_screen_status != ACTIVE_INFECTION"
    error_id: ERR_HBV_ACTIVE_INFECTION_CONTRAINDICATED
    http_status: 422
    applies_to: "POST /therapy-episodes/{id}/activate"
  - priority: 31
    category: business_safety
    check: "at activation, when drug.hbv_screen_required, patient.hbv_screen_status != INCOMPLETE; at submission, when patient.hbv_screen_status == OCCULT_RISK, the authorization carries hbv_prophylaxis_documented == true"
    error_id: ERR_HBV_SCREEN_INCOMPLETE
    http_status: 422
    applies_to: "POST /therapy-episodes/{id}/activate, POST /authorizations/{id}/submit"
  - priority: 32
    category: business_safety
    check: "episode.monitoring_status == CURRENT (calculations.monitoring_lab_currency)"
    error_id: ERR_MONITORING_LAB_OVERDUE
    http_status: 422
    applies_to: "POST /therapy-episodes/{id}/activate, POST /therapy-episodes/{id}/resume, POST /infusion-appointments/{id}/administer"
  - priority: 33
    category: business_safety
    check: "when drug.route == SC, episode.self_injection_training_status == PASSED"
    error_id: ERR_SELF_INJECTION_TRAINING_INCOMPLETE
    http_status: 422
    applies_to: "POST /therapy-episodes/{id}/activate"
  - priority: 34
    category: business_safety
    check: "when scoring_instrument == DAS28_CRP, crp_mg_dl is present and non-null"
    error_id: ERR_ACUTE_PHASE_REACTANT_MISSING
    http_status: 422
    applies_to: "POST /visits/{id}/score"
  - priority: 35
    category: business_safety
    check: "the reason-specific resumption obligation is met — INFECTION requires infection_resolved_attested == true, SURGERY requires wound_healed_attested == true, LAB_ABNORMALITY requires a MonitoringLab of the drug's monitoring_panel_type collected strictly after held_at with abnormal_grade <= 2"
    error_id: ERR_RESUMPTION_PROTOCOL_INCOMPLETE
    http_status: 422
    applies_to: "POST /therapy-episodes/{id}/resume"
  - priority: 36
    category: business_referential
    check: "calculations.step_therapy_evaluation yields an empty unmet set, or formulary_exception_requested == true"
    error_id: ERR_STEP_THERAPY_NOT_SATISFIED
    http_status: 422
    applies_to: "POST /authorizations/{id}/submit"
  - priority: 37
    category: business_referential
    check: "when formulary_exception_requested == true, exception_attested_by_clinician_id is non-null"
    error_id: ERR_FORMULARY_EXCEPTION_NOT_ATTESTED
    http_status: 422
    applies_to: "POST /authorizations/{id}/submit"
  - priority: 38
    category: business_referential
    check: "calculations.episode_benefit_routing finds a usable benefit channel for the drug's route on the chosen payer plan"
    error_id: ERR_NO_BENEFIT_CHANNEL_AVAILABLE
    http_status: 422
    applies_to: "POST /therapy-episodes"
  - priority: 39
    category: business_referential
    check: "when prior_episode_id is supplied, the referenced episode belongs to the same patient_id, has therapy_state == DISCONTINUED, and its line_of_therapy + 1 <= 6"
    error_id: ERR_PRIOR_EPISODE_INVALID
    http_status: 422
    applies_to: "POST /therapy-episodes"
  - priority: 40
    category: business_referential
    check: "chair.site_type matches episode.site_of_care (AMBULATORY_INFUSION_CENTER with AMBULATORY_INFUSION_CENTER, HOSPITAL_OUTPATIENT with HOSPITAL_OUTPATIENT); episodes whose site_of_care is SELF_ADMIN or HOME_INFUSION cannot occupy a chair at all"
    error_id: ERR_SITE_OF_CARE_MISMATCH
    http_status: 422
    applies_to: "POST /infusion-appointments"
  - priority: 41
    category: business_referential
    check: "patient.registry_consent == true"
    error_id: ERR_REGISTRY_CONSENT_MISSING
    http_status: 422
    applies_to: "GET /patients/{id}/quality-report"
  - priority: 42
    category: business_temporal
    check: "scheduled_start falls inside [authorization.valid_from, authorization.valid_through] for at least one APPROVED authorization of the episode (calculations.active_authorization_selector)"
    error_id: ERR_APPOINTMENT_OUTSIDE_AUTH_WINDOW
    http_status: 409
    applies_to: "POST /infusion-appointments"
  - priority: 43
    category: business_temporal
    check: "the logical clock is >= episode.resume_not_before"
    error_id: ERR_WASHOUT_PERIOD_NOT_ELAPSED
    http_status: 409
    applies_to: "POST /therapy-episodes/{id}/resume"
  - priority: 44
    category: business_constraint
    check: "Patient.mrn, Clinician.npi, Drug.name, PayerPlan.name and InfusionChair.label are each unique within their entity"
    error_id: ERR_DUPLICATE_IDENTIFIER
    http_status: 409
    applies_to: "POST /patients, POST /clinicians, POST /drugs, POST /payer-plans, POST /infusion-chairs"
  - priority: 45
    category: business_constraint
    check: "the requested chair occupancy does not overlap an existing SCHEDULED or ADMINISTERED appointment on the same chair, where each existing appointment blocks [scheduled_start, scheduled_end + chair.turnover_buffer_minutes) — a new start strictly before that instant conflicts, a new start exactly at it does not"
    error_id: ERR_CHAIR_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /infusion-appointments"
  - priority: 46
    category: business_constraint
    check: "the clinician has fewer than CLINICIAN_CONCURRENT_VISIT_CAP (2) other visits whose half-open [visit_datetime, visit_end_datetime) interval overlaps the requested one; no turnover buffer applies to visits"
    error_id: ERR_CLINICIAN_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /visits"
  - priority: 47
    category: business_constraint
    check: "the half-open reporting window contains at least one qualifying Visit (visit_type NEW or FOLLOW_UP)"
    error_id: ERR_QUALITY_PERIOD_NO_VISITS
    http_status: 422
    applies_to: "GET /patients/{id}/quality-report"
  - priority: 48
    category: business_fiscal
    check: "the episode has an APPROVED authorization with units_remaining >= 1 (calculations.active_authorization_selector)"
    error_id: ERR_AUTHORIZATION_UNITS_EXHAUSTED
    http_status: 409
    applies_to: "POST /infusion-appointments"

endpoints:
  # ---------------------------------------------------------------- reference data
  - method: POST
    path: "/patients"
    description: "Register a patient. tb_screen_status and hbv_screen_status start at MISSING / INCOMPLETE and are derived thereafter from ScreeningRecord rows."
    roles: [RegistryAdmin]
    code: 201
    input: [mrn, full_name, date_of_birth, diagnosis_code, registry_consent]
    output: Patient
    side_effects:
      - "sets tb_screen_status MISSING, hbv_screen_status INCOMPLETE, target_status UNASSESSED, administered_dose_total 0, active_episode_count 0, version 1"
  - method: POST
    path: "/clinicians"
    description: "Register a clinician. Only a RHEUMATOLOGIST with can_attest_formulary_exception may sign formulary exceptions."
    roles: [RegistryAdmin]
    code: 201
    input: [npi, full_name, role_type, "can_attest_formulary_exception?"]
    output: Clinician
    side_effects:
      - "defaults can_attest_formulary_exception to false when omitted"
  - method: POST
    path: "/drugs"
    description: "Register a biologic or targeted synthetic drug with its route, monitoring panel, screening obligations and step-therapy prerequisites."
    roles: [RegistryAdmin]
    code: 201
    input: [name, molecule_class, route, formulary_tier, acquisition_cost_cents, admin_time_minutes, monitoring_panel_type, monitoring_panel_interval_days, "is_biosimilar?", "tb_screen_required?", "hbv_screen_required?", "step_therapy_required_classes?"]
    output: Drug
    side_effects:
      - "defaults is_biosimilar false, tb_screen_required true, hbv_screen_required true, step_therapy_required_classes []"
  - method: POST
    path: "/payer-plans"
    description: "Register a payer plan with its benefit channels, site-of-care policy, cost-share parameters, appeal allowance and authorization validity."
    roles: [RegistryAdmin]
    code: 201
    input: [name, pharmacy_benefit_enabled, medical_benefit_enabled, site_of_care_policy, coinsurance_pct, deductible_remaining_cents, medical_facility_fee_cents, hospital_outpatient_multiplier, appeal_rounds_allowed, auth_validity_days, "step_therapy_classes_required?"]
    output: PayerPlan
    side_effects:
      - "defaults step_therapy_classes_required to []"
  - method: POST
    path: "/infusion-chairs"
    description: "Register an infusion chair with its site type and turnover buffer. New chairs start OPEN."
    roles: [RegistryAdmin]
    code: 201
    input: [label, site_type, turnover_buffer_minutes]
    output: InfusionChair
    side_effects:
      - "sets status OPEN"
  - method: PATCH
    path: "/infusion-chairs/{id}"
    description: "Open or close a chair. Closing a chair does not cancel existing appointments but blocks administration on it."
    roles: [RegistryAdmin]
    code: 200
    input: [status]
    output: InfusionChair
    side_effects:
      - "increments InfusionChair.version by 1"

  # ---------------------------------------------------------------- visits and scoring
  - method: POST
    path: "/visits"
    description: "Book a visit. visit_end_datetime is derived from visit_type and the clinician's concurrent-visit cap is enforced on the half-open interval."
    roles: [RegistryAdmin, Rheumatologist]
    code: 201
    input: [patient_id, clinician_id, visit_datetime, visit_type]
    output: Visit
    side_effects:
      - "computes visit_end_datetime (calculations.visit_slot_interval)"
      - "rejects with ERR_CLINICIAN_CAPACITY_EXCEEDED when the clinician already has 2 overlapping visits"
      - "sets status SCHEDULED"
  - method: POST
    path: "/visits/{id}/check-in"
    description: "Check a patient in for a scheduled visit; scoring is not permitted until this has happened."
    roles: [InfusionNurse]
    code: 200
    input: []
    output: Visit
    side_effects:
      - "sets status CHECKED_IN and increments Visit.version by 1"
  - method: POST
    path: "/visits/{id}/score"
    description: "Record a disease activity score using either the CDAI or the DAS28_CRP instrument and derive the treatment-escalation recommendation."
    roles: [Rheumatologist]
    code: 200
    input: [scoring_instrument, tender_joint_count, swollen_joint_count, patient_global_assessment, "physician_global_assessment?", "crp_mg_dl?", "esr_mm_hr?"]
    output: Visit
    side_effects:
      - "computes activity_score and activity_category per the selected variant (calculations.visit_disease_activity_score)"
      - "computes escalation_recommendation (calculations.visit_escalation_recommendation)"
      - "sets status SCORED and scored_at"
      - "refreshes Patient.latest_activity_score, latest_activity_category and target_status when this is the patient's latest SCORED visit"
      - "increments Visit.version by 1 and Patient.version by 1"
  - method: GET
    path: "/visits/{id}"
    description: "Read a single visit including its computed score, category and escalation recommendation."
    roles: [Rheumatologist, InfusionNurse, RegistryAdmin, PriorAuthCoordinator, BenefitsCounselor, Patient]
    code: 200
    input: []
    output: Visit
    side_effects: []
  - method: GET
    path: "/visits"
    description: "List visits, filterable by patient, clinician and status. Reverse-reachability channel for Visit.patient_id and Visit.clinician_id."
    roles: [Rheumatologist, InfusionNurse, RegistryAdmin, PriorAuthCoordinator, BenefitsCounselor, Patient]
    code: 200
    input: ["patient_id?", "clinician_id?", "status?", "limit?", "offset?"]
    output: Visit[]
    side_effects: []

  # ---------------------------------------------------------------- screening
  - method: POST
    path: "/screening-records"
    description: "File a tuberculosis, hepatitis B or hepatitis C screening result. ScreeningRecord is immutable — there is no update or delete endpoint and it carries no version field."
    roles: [InfusionNurse]
    code: 201
    input: [patient_id, screen_type, result, collected_at, resulted_at]
    output: ScreeningRecord
    side_effects:
      - "stamps recorded_by_user_id from X-User-ID"
      - "re-derives Patient.tb_screen_status and Patient.hbv_screen_status (calculations.screening_status_derivation) and increments Patient.version by 1"
  - method: GET
    path: "/patients/{id}/screening-records"
    description: "List a patient's screening records. Sole reverse-reachability channel for ScreeningRecord.patient_id."
    roles: [Rheumatologist, InfusionNurse, PriorAuthCoordinator, RegistryAdmin, Patient]
    code: 200
    input: ["screen_type?", "limit?", "offset?"]
    output: ScreeningRecord[]
    side_effects: []
  - method: GET
    path: "/patients/{id}"
    description: "Read a patient including the derived screening statuses, latest activity score and treat-to-target status."
    roles: [Rheumatologist, InfusionNurse, PriorAuthCoordinator, BenefitsCounselor, PayerReviewer, RegistryAdmin, Patient]
    code: 200
    input: []
    output: Patient
    side_effects: []
  - method: GET
    path: "/patients/{id}/quality-report"
    description: "Computed read: treat-to-target registry metrics over a half-open [period_start, period_end) window."
    roles: [RegistryAdmin, Rheumatologist]
    code: 200
    input: [period_start, period_end]
    output: { qualifying_visit_count: integer, scored_visit_count: integer, at_target_visit_count: integer, escalation_indicated_count: integer, escalation_acted_count: integer, administered_dose_count: integer, completeness_pct: number, treat_to_target_attainment_pct: number, escalation_action_pct: number, biosimilar_uptake_pct: number }
    side_effects: []

  # ---------------------------------------------------------------- therapy episodes
  - method: POST
    path: "/therapy-episodes"
    description: "Open a therapy episode. Requires expected_patient_version; benefit channel, site of care, line of therapy and the training obligation are all derived here and frozen."
    roles: [Rheumatologist]
    code: 201
    input: [patient_id, drug_id, payer_plan_id, therapy_start_at, expected_patient_version, "prior_episode_id?"]
    output: TherapyEpisode
    side_effects:
      - "computes benefit_channel and site_of_care and sets routing_frozen true (calculations.episode_benefit_routing)"
      - "computes line_of_therapy (calculations.episode_line_of_therapy)"
      - "sets self_injection_training_status PENDING when site_of_care == SELF_ADMIN, else NOT_REQUIRED"
      - "sets therapy_state PLANNED, funding_state UNFUNDED, monitoring_status per calculations.monitoring_lab_currency (OVERDUE for a new episode with no labs)"
      - "discontinues the patient's other PLANNED episodes with discontinuation_reason SUPERSEDED"
      - "increments Patient.version by 1"
  - method: GET
    path: "/therapy-episodes/{id}"
    description: "Read a therapy episode including both state dimensions and every derived routing, exposure and monitoring field."
    roles: [Rheumatologist, InfusionNurse, PriorAuthCoordinator, BenefitsCounselor, PayerReviewer, RegistryAdmin]
    code: 200
    input: []
    output: TherapyEpisode
    side_effects: []
  - method: GET
    path: "/therapy-episodes"
    description: "List therapy episodes. Reverse-reachability channel for TherapyEpisode.patient_id, drug_id, payer_plan_id and prior_episode_id."
    roles: [Rheumatologist, InfusionNurse, PriorAuthCoordinator, BenefitsCounselor, PayerReviewer, RegistryAdmin]
    code: 200
    input: ["patient_id?", "drug_id?", "payer_plan_id?", "prior_episode_id?", "therapy_state?", "funding_state?", "limit?", "offset?"]
    output: TherapyEpisode[]
    side_effects: []
  - method: POST
    path: "/therapy-episodes/{id}/activate"
    description: "Start therapy. Gated on funding, tuberculosis and hepatitis screening, monitoring currency and (for self-administered drugs) training."
    roles: [Rheumatologist]
    code: 200
    input: []
    output: TherapyEpisode
    side_effects:
      - "sets therapy_state ACTIVE"
      - "increments Patient.active_episode_count by 1 and Patient.version by 1"
      - "increments TherapyEpisode.version by 1"
  - method: POST
    path: "/therapy-episodes/{id}/hold"
    description: "Interrupt therapy for surgery, infection, a lab abnormality, an authorization lapse or patient request; computes the earliest lawful resumption instant and unwinds all scheduled doses."
    roles: [Rheumatologist]
    code: 200
    input: [hold_reason]
    output: TherapyEpisode
    side_effects:
      - "sets therapy_state HELD, hold_reason, held_at, increments hold_count"
      - "computes resume_not_before (calculations.resumption_earliest_instant)"
      - "cancels every SCHEDULED InfusionAppointment of the episode with cancellation_reason THERAPY_HELD"
      - "releases the reserved authorization units and reserved assistance benefit for each cancelled appointment; an EXHAUSTED enrollment whose benefit_remaining_cents becomes > 0 returns to ACTIVE"
      - "decrements Patient.active_episode_count by 1 and increments Patient.version by 1"
      - "increments TherapyEpisode.version by 1"
  - method: POST
    path: "/therapy-episodes/{id}/resume"
    description: "Resume held therapy once the washout has elapsed and the reason-specific resumption protocol is satisfied."
    roles: [Rheumatologist]
    code: 200
    input: ["infection_resolved_attested?", "wound_healed_attested?"]
    output: TherapyEpisode
    side_effects:
      - "sets therapy_state ACTIVE and clears hold_reason, held_at and resume_not_before"
      - "increments Patient.active_episode_count by 1 and Patient.version by 1"
      - "increments TherapyEpisode.version by 1"
  - method: POST
    path: "/therapy-episodes/{id}/discontinue"
    description: "Stop therapy permanently, freezing therapy_exposure_weeks (which step-therapy evaluation of later episodes reads) and terminating the episode's assistance enrollments."
    roles: [Rheumatologist]
    code: 200
    input: [discontinuation_reason]
    output: TherapyEpisode
    side_effects:
      - "sets therapy_state DISCONTINUED, discontinuation_reason, discontinued_at"
      - "computes therapy_exposure_weeks = floor((discontinued_at - therapy_start_at) / 7 days)"
      - "cancels every SCHEDULED InfusionAppointment with cancellation_reason THERAPY_HELD and releases its units and benefit"
      - "terminates every non-TERMINATED AssistanceEnrollment of the episode with termination_reason EPISODE_DISCONTINUED"
      - "decrements Patient.active_episode_count by 1 (only when the episode was ACTIVE) and increments Patient.version by 1"
      - "increments TherapyEpisode.version by 1"
  - method: POST
    path: "/therapy-episodes/{id}/record-training"
    description: "Record the outcome of a self-injection training session for a self-administered episode."
    roles: [InfusionNurse]
    code: 200
    input: [outcome]
    output: TherapyEpisode
    side_effects:
      - "sets self_injection_training_status to PASSED or FAILED from outcome and increments self_injection_training_attempts by 1"
      - "increments TherapyEpisode.version by 1"
  - method: GET
    path: "/therapy-episodes/{id}/cost-share-estimate"
    description: "Computed read: the member cost-share waterfall for the episode over dose_count doses, using the PHARMACY or MEDICAL variant selected by the episode's frozen benefit_channel."
    roles: [BenefitsCounselor, PriorAuthCoordinator, Rheumatologist, RegistryAdmin]
    code: 200
    input: [dose_count]
    output: { benefit_channel: string, site_of_care: string, allowed_per_dose_cents: integer, facility_per_dose_cents: integer, deductible_applied_cents: integer, coinsurance_cents: integer, facility_cents: integer, per_dose_share_cents: "integer[]", total_member_share_cents: integer }
    side_effects: []

  # ---------------------------------------------------------------- monitoring labs
  - method: POST
    path: "/monitoring-labs"
    description: "File a periodic monitoring panel. MonitoringLab is immutable. A grade 3 or 4 panel on an ACTIVE episode drives an automatic LAB_ABNORMALITY hold and unwinds the episode's scheduled doses."
    roles: [InfusionNurse]
    code: 201
    input: [episode_id, panel_type, collected_at, "alt_u_l?", "wbc_k_ul?", "neutrophil_k_ul?"]
    output: MonitoringLab
    side_effects:
      - "computes alt_grade, anc_grade, abnormal_grade and triggers_hold (calculations.lab_abnormal_grade)"
      - "stamps recorded_by_user_id from X-User-ID"
      - "when triggers_hold and the episode is ACTIVE: holds the episode with hold_reason LAB_ABNORMALITY and runs the full appointment-cancellation, unit-release and benefit-release cascade"
      - "refreshes TherapyEpisode.monitoring_status and increments TherapyEpisode.version by 1"
  - method: GET
    path: "/therapy-episodes/{id}/monitoring-labs"
    description: "List an episode's monitoring panels with their computed grades. Sole reverse-reachability channel for MonitoringLab.episode_id."
    roles: [Rheumatologist, InfusionNurse, RegistryAdmin, PriorAuthCoordinator]
    code: 200
    input: ["panel_type?", "limit?", "offset?"]
    output: MonitoringLab[]
    side_effects: []

  # ---------------------------------------------------------------- authorization
  - method: POST
    path: "/authorizations"
    description: "Open a prior-authorization request against an episode. Requires expected_episode_version; expires the episode's prior DRAFT authorization and moves funding_state to PENDING_AUTH."
    roles: [PriorAuthCoordinator]
    code: 201
    input: [episode_id, requested_units, expected_episode_version, "formulary_exception_requested?", "hbv_prophylaxis_documented?"]
    output: Authorization
    side_effects:
      - "copies benefit_channel from the episode and freezes it"
      - "sets status DRAFT, appeal_round 0, units_reserved 0, units_consumed 0"
      - "expires any prior DRAFT Authorization of the same episode (status EXPIRED)"
      - "sets TherapyEpisode.funding_state to PENDING_AUTH and increments TherapyEpisode.version by 1"
  - method: POST
    path: "/authorizations/{id}/attest-exception"
    description: "A rheumatologist with formulary-exception privileges signs the exception, satisfying the attestation prerequisite for submission."
    roles: [Rheumatologist]
    code: 200
    input: []
    output: Authorization
    side_effects:
      - "sets exception_attested_by_clinician_id to X-User-ID"
      - "increments Authorization.version by 1"
  - method: POST
    path: "/authorizations/{id}/submit"
    description: "Submit or re-submit (appeal) an authorization. Enforces step therapy, formulary-exception attestation and hepatitis-B prophylaxis; a DENIED authorization re-enters SUBMITTED and burns one appeal round."
    roles: [PriorAuthCoordinator]
    code: 200
    input: []
    output: Authorization
    side_effects:
      - "evaluates and stores unmet_step_therapy_classes (calculations.step_therapy_evaluation)"
      - "sets status SUBMITTED and submitted_at"
      - "increments appeal_round by 1 when the prior status was DENIED"
      - "increments Authorization.version by 1"
  - method: POST
    path: "/authorizations/{id}/determination"
    description: "The payer approves or denies a submitted authorization. Approval funds the episode; a denial on the last permitted appeal round unfunds the episode and terminates its assistance enrollments."
    roles: [PayerReviewer]
    code: 200
    input: [decision, "decision_reason?", "approved_units?", "valid_from?", "valid_through?"]
    output: Authorization
    side_effects:
      - "on APPROVED: sets approved_units (default requested_units), units_remaining, determination_at, valid_from (default the logical clock) and valid_through (default valid_from + payer_plan.auth_validity_days days); sets TherapyEpisode.funding_state AUTHORIZED"
      - "on DENIED with appeal_round < appeal_rounds_allowed: sets status DENIED and leaves funding_state at PENDING_AUTH"
      - "on DENIED with appeal_round == appeal_rounds_allowed: sets TherapyEpisode.funding_state UNFUNDED and terminates every non-TERMINATED AssistanceEnrollment of the episode with termination_reason FUNDING_DENIED, releasing benefit_reserved_cents into benefit_remaining_cents"
      - "increments Authorization.version by 1 and TherapyEpisode.version by 1"
  - method: GET
    path: "/authorizations/{id}"
    description: "Read an authorization including its unit ledger and coverage window."
    roles: [PriorAuthCoordinator, PayerReviewer, Rheumatologist, BenefitsCounselor, InfusionNurse, RegistryAdmin]
    code: 200
    input: []
    output: Authorization
    side_effects: []
  - method: GET
    path: "/authorizations"
    description: "List authorizations. Reverse-reachability channel for Authorization.episode_id and Authorization.exception_attested_by_clinician_id."
    roles: [PriorAuthCoordinator, PayerReviewer, Rheumatologist, BenefitsCounselor, InfusionNurse, RegistryAdmin]
    code: 200
    input: ["episode_id?", "exception_attested_by_clinician_id?", "status?", "limit?", "offset?"]
    output: Authorization[]
    side_effects: []

  # ---------------------------------------------------------------- infusion scheduling
  - method: POST
    path: "/infusion-appointments"
    description: "Schedule a dose in a chair. Reserves one authorization unit and the applicable assistance benefit, and enforces the chair's exclusive-occupancy-plus-turnover rule."
    roles: [InfusionNurse]
    code: 201
    input: [episode_id, chair_id, scheduled_start]
    output: InfusionAppointment
    side_effects:
      - "computes scheduled_end = scheduled_start + drug.admin_time_minutes minutes"
      - "computes dose_sequence, selects reserved_authorization_id and reserves one unit (calculations.active_authorization_selector)"
      - "computes dose_cost_share_cents (calculations.episode_cost_share_estimate) and assistance_applied_cents / patient_out_of_pocket_cents / reserved_enrollment_id (calculations.assistance_benefit_application)"
      - "moves the applied assistance from AssistanceEnrollment.benefit_remaining_cents to benefit_reserved_cents; an enrollment whose benefit_remaining_cents reaches 0 becomes EXHAUSTED"
      - "sets status SCHEDULED"
  - method: POST
    path: "/infusion-appointments/{id}/administer"
    description: "Record administration of a scheduled dose, burning the reserved unit and the reserved assistance benefit."
    roles: [InfusionNurse]
    code: 200
    input: []
    output: InfusionAppointment
    side_effects:
      - "sets status ADMINISTERED and administered_at"
      - "moves 1 unit from Authorization.units_reserved to units_consumed"
      - "moves assistance_applied_cents from AssistanceEnrollment.benefit_reserved_cents to benefit_used_cents"
      - "increments TherapyEpisode.doses_administered and Patient.administered_dose_total by 1"
      - "increments InfusionAppointment.version, TherapyEpisode.version and Patient.version by 1"
  - method: POST
    path: "/infusion-appointments/{id}/reverse-administration"
    description: "Compensating correction: undo a recorded administration, restoring every counter the administration moved."
    roles: [InfusionNurse]
    code: 200
    input: [reversal_reason]
    output: InfusionAppointment
    side_effects:
      - "sets status back to SCHEDULED, clears administered_at, records reversal_reason"
      - "moves 1 unit from Authorization.units_consumed back to units_reserved"
      - "moves assistance_applied_cents from AssistanceEnrollment.benefit_used_cents back to benefit_reserved_cents"
      - "decrements TherapyEpisode.doses_administered and Patient.administered_dose_total by 1"
      - "increments InfusionAppointment.version, TherapyEpisode.version and Patient.version by 1"
  - method: POST
    path: "/infusion-appointments/{id}/cancel"
    description: "Cancel a scheduled dose, releasing the reserved unit and the reserved assistance benefit."
    roles: [InfusionNurse]
    code: 200
    input: [cancellation_reason]
    output: InfusionAppointment
    side_effects:
      - "sets status CANCELLED and cancellation_reason"
      - "releases 1 unit from Authorization.units_reserved into units_remaining"
      - "releases assistance_applied_cents from AssistanceEnrollment.benefit_reserved_cents into benefit_remaining_cents; an EXHAUSTED enrollment whose benefit_remaining_cents becomes > 0 returns to ACTIVE"
      - "increments InfusionAppointment.version by 1"
  - method: GET
    path: "/infusion-appointments/{id}"
    description: "Read a single appointment including its per-dose cost share and applied assistance."
    roles: [InfusionNurse, Rheumatologist, BenefitsCounselor, PriorAuthCoordinator, RegistryAdmin]
    code: 200
    input: []
    output: InfusionAppointment
    side_effects: []
  - method: GET
    path: "/infusion-appointments"
    description: "List appointments. Reverse-reachability channel for InfusionAppointment.episode_id, chair_id, reserved_authorization_id and reserved_enrollment_id."
    roles: [InfusionNurse, Rheumatologist, BenefitsCounselor, PriorAuthCoordinator, RegistryAdmin]
    code: 200
    input: ["episode_id?", "chair_id?", "reserved_authorization_id?", "reserved_enrollment_id?", "status?", "limit?", "offset?"]
    output: InfusionAppointment[]
    side_effects: []

  # ---------------------------------------------------------------- assistance programs
  - method: POST
    path: "/assistance-enrollments"
    description: "Enroll an episode in a copay card, foundation grant or patient assistance program. The coverage window and the reauthorization due date are derived from the program type."
    roles: [BenefitsCounselor]
    code: 201
    input: [episode_id, program_type, annual_benefit_cents, coverage_start]
    output: AssistanceEnrollment
    side_effects:
      - "computes coverage_end = coverage_start + PROGRAM_DURATION_DAYS[program_type] days (MANUFACTURER_COPAY_CARD 365, FOUNDATION_GRANT 180, PATIENT_ASSISTANCE_PROGRAM 90)"
      - "computes reauth_due_at = coverage_end - 30 days"
      - "sets status SUBMITTED, benefit_used_cents 0, benefit_reserved_cents 0, benefit_remaining_cents = annual_benefit_cents"
      - "stamps submitted_by_user_id from X-User-ID"
  - method: POST
    path: "/assistance-enrollments/{id}/attest"
    description: "A second benefits counselor attests the enrollment, activating it. The attesting user must differ from the submitting user."
    roles: [BenefitsCounselor]
    code: 200
    input: []
    output: AssistanceEnrollment
    side_effects:
      - "sets status ACTIVE, attested_by_user_id from X-User-ID and attested_at"
      - "increments AssistanceEnrollment.version by 1"
  - method: POST
    path: "/assistance-enrollments/{id}/reauthorize"
    description: "Renew an enrollment flagged REAUTH_PENDING by the reauthorization calendar; the coverage window rolls forward and the used benefit resets."
    roles: [BenefitsCounselor]
    code: 200
    input: ["annual_benefit_cents?"]
    output: AssistanceEnrollment
    side_effects:
      - "sets status ACTIVE, advances coverage_start to the logical clock and recomputes coverage_end and reauth_due_at"
      - "resets benefit_used_cents to 0 and benefit_remaining_cents to annual_benefit_cents - benefit_reserved_cents"
      - "increments AssistanceEnrollment.version by 1"
  - method: GET
    path: "/assistance-enrollments/{id}"
    description: "Read a single assistance enrollment including its three-way benefit ledger."
    roles: [BenefitsCounselor, PriorAuthCoordinator, Rheumatologist, InfusionNurse, RegistryAdmin]
    code: 200
    input: []
    output: AssistanceEnrollment
    side_effects: []
  - method: GET
    path: "/therapy-episodes/{id}/assistance-enrollments"
    description: "List an episode's assistance enrollments. Sole reverse-reachability channel for AssistanceEnrollment.episode_id."
    roles: [BenefitsCounselor, PriorAuthCoordinator, Rheumatologist, InfusionNurse, RegistryAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: AssistanceEnrollment[]
    side_effects: []

  # ---------------------------------------------------------------- clock and scheduled actions
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical clock, which every deadline, washout, coverage-window and screening-validity rule reads. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time."
    roles: [RegistryAdmin, Rheumatologist, PriorAuthCoordinator, PayerReviewer, InfusionNurse, BenefitsCounselor, Patient]
    code: 200
    input: [current_utc]
    output: { current_utc: string }
    side_effects:
      - "sets the logical clock; no entity is mutated"
  - method: POST
    path: "/_ops/run-reauthorization-calendar"
    description: "Run the deferred reauthorization sweep against the current logical clock: expire lapsed authorizations, lapse their episodes' funding, and flag enrollments due for renewal."
    roles: [RegistryAdmin]
    code: 200
    input: []
    output: { authorizations_expired: integer, episodes_lapsed: integer, enrollments_reauth_pending: integer }
    side_effects:
      - "every APPROVED Authorization whose valid_through is before the logical clock becomes EXPIRED and its episode's funding_state becomes LAPSED (TherapyEpisode.version increments)"
      - "every ACTIVE AssistanceEnrollment whose reauth_due_at is at or before the logical clock becomes REAUTH_PENDING"
      - "the sweep is idempotent: a second run over the same clock reports zeroes"

errors:
  # --- authentication and authorization
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role header absent, or present but an empty string"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "X-User-Role is not one of the seven declared roles, or is not listed on the target endpoint"
  - id: ERR_CLINICIAN_NOT_AUTHORIZED_TO_ATTEST
    http: 403
    condition: "attest-exception attempted by a user whose Clinician row is missing, is not a RHEUMATOLOGIST, or has can_attest_formulary_exception == false"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "a Rheumatologist scores a visit assigned to a different clinician, or a Patient reads another patient's data"
  # --- existence
  - id: ERR_PATIENT_NOT_FOUND
    http: 404
    condition: "the patient id in the path does not resolve"
  - id: ERR_VISIT_NOT_FOUND
    http: 404
    condition: "the visit id in the path does not resolve"
  - id: ERR_EPISODE_NOT_FOUND
    http: 404
    condition: "the therapy episode id in the path, or the episode_id body field, does not resolve"
  - id: ERR_AUTHORIZATION_NOT_FOUND
    http: 404
    condition: "the authorization id in the path does not resolve"
  - id: ERR_APPOINTMENT_NOT_FOUND
    http: 404
    condition: "the infusion appointment id in the path does not resolve"
  - id: ERR_ENROLLMENT_NOT_FOUND
    http: 404
    condition: "the assistance enrollment id in the path does not resolve"
  - id: ERR_CHAIR_NOT_FOUND
    http: 404
    condition: "the infusion chair id in the path, or the chair_id body field, does not resolve"
  - id: ERR_REFERENCE_NOT_FOUND
    http: 404
    condition: "a patient_id, clinician_id, drug_id, payer_plan_id or prior_episode_id body field does not resolve"
  # --- payload shape
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "missing required field, wrong JSON type, out-of-range number, excess decimal places, unrecognised enum member, unparseable ISO 8601 instant, pagination limit outside 1..100, negative offset, approved_units greater than requested_units, or collected_at later than resulted_at"
  # --- optimistic concurrency
  - id: ERR_STALE_PATIENT_VERSION
    http: 412
    condition: "expected_patient_version does not equal the current Patient.version on POST /therapy-episodes"
  - id: ERR_STALE_EPISODE_VERSION
    http: 412
    condition: "expected_episode_version does not equal the current TherapyEpisode.version on POST /authorizations"
  # --- state preconditions
  - id: ERR_VISIT_NOT_CHECKED_IN
    http: 409
    condition: "check-in attempted on a visit that is no longer SCHEDULED, or scoring attempted on a visit that is not CHECKED_IN"
  - id: ERR_AUTHORIZATION_STATE_INVALID
    http: 409
    condition: "submit or attest-exception attempted on an authorization that is neither DRAFT nor DENIED, or determination attempted on an authorization that is not SUBMITTED"
  - id: ERR_APPEAL_ROUNDS_EXHAUSTED
    http: 409
    condition: "re-submission of a DENIED authorization whose appeal_round has already reached the plan's appeal_rounds_allowed"
  - id: ERR_EPISODE_NOT_PLANNED
    http: 409
    condition: "activation attempted on an episode whose therapy_state is not PLANNED"
  - id: ERR_EPISODE_NOT_ACTIVE
    http: 409
    condition: "hold, dose scheduling or administration attempted on an episode that is not ACTIVE, or discontinuation attempted on an already DISCONTINUED episode"
  - id: ERR_EPISODE_NOT_HELD
    http: 409
    condition: "resume attempted on an episode whose therapy_state is not HELD"
  - id: ERR_APPOINTMENT_STATE_INVALID
    http: 409
    condition: "administer or cancel attempted on an appointment that is not SCHEDULED, or reverse-administration attempted on an appointment that is not ADMINISTERED"
  - id: ERR_ENROLLMENT_STATE_INVALID
    http: 409
    condition: "attest attempted on an enrollment that is not SUBMITTED, or reauthorize attempted on an enrollment that is not REAUTH_PENDING"
  - id: ERR_FUNDING_NOT_AUTHORIZED
    http: 409
    condition: "activation or resumption attempted while the episode's funding_state is not AUTHORIZED"
  - id: ERR_CHAIR_CLOSED
    http: 409
    condition: "dose scheduling or administration attempted against a chair whose status is CLOSED"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "the benefits counselor attesting an assistance enrollment is the same user who submitted it"
  # --- safety and compliance
  - id: ERR_TB_SCREEN_NOT_CLEARED
    http: 422
    condition: "activation of a TB-screen-requiring drug while the patient's tb_screen_status is MISSING, EXPIRED, INDETERMINATE or POSITIVE_UNTREATED"
  - id: ERR_HBV_ACTIVE_INFECTION_CONTRAINDICATED
    http: 422
    condition: "activation of an HBV-screen-requiring drug while the patient's hbv_screen_status is ACTIVE_INFECTION"
  - id: ERR_HBV_SCREEN_INCOMPLETE
    http: 422
    condition: "activation while hbv_screen_status is INCOMPLETE, or submission for a patient whose hbv_screen_status is OCCULT_RISK without hbv_prophylaxis_documented"
  - id: ERR_MONITORING_LAB_OVERDUE
    http: 422
    condition: "activation, resumption or administration while the episode's monitoring_status is OVERDUE"
  - id: ERR_SELF_INJECTION_TRAINING_INCOMPLETE
    http: 422
    condition: "activation of a self-administered (SC) episode whose self_injection_training_status is not PASSED"
  - id: ERR_ACUTE_PHASE_REACTANT_MISSING
    http: 422
    condition: "DAS28_CRP scoring submitted without crp_mg_dl"
  - id: ERR_RESUMPTION_PROTOCOL_INCOMPLETE
    http: 422
    condition: "resumption attempted without the obligation the hold reason demands — infection resolution attestation, wound-healing attestation, or a post-hold monitoring panel with abnormal_grade <= 2"
  # --- referential and policy
  - id: ERR_STEP_THERAPY_NOT_SATISFIED
    http: 422
    condition: "submission while required step-therapy classes remain unmet and no formulary exception is requested"
  - id: ERR_FORMULARY_EXCEPTION_NOT_ATTESTED
    http: 422
    condition: "submission with formulary_exception_requested true but no clinician attestation on file"
  - id: ERR_NO_BENEFIT_CHANNEL_AVAILABLE
    http: 422
    condition: "episode creation where the drug's route cannot be funded by any benefit the plan enables"
  - id: ERR_PRIOR_EPISODE_INVALID
    http: 422
    condition: "prior_episode_id belongs to a different patient, is not DISCONTINUED, or would push line_of_therapy past 6"
  - id: ERR_SITE_OF_CARE_MISMATCH
    http: 422
    condition: "chair site_type does not match the episode's site_of_care, or the episode is SELF_ADMIN or HOME_INFUSION and therefore cannot occupy a chair"
  - id: ERR_REGISTRY_CONSENT_MISSING
    http: 422
    condition: "quality report requested for a patient whose registry_consent is false"
  # --- temporal
  - id: ERR_APPOINTMENT_OUTSIDE_AUTH_WINDOW
    http: 409
    condition: "scheduled_start falls outside every APPROVED authorization's [valid_from, valid_through] window"
  - id: ERR_WASHOUT_PERIOD_NOT_ELAPSED
    http: 409
    condition: "resumption attempted before the logical clock reaches resume_not_before"
  # --- constraint
  - id: ERR_DUPLICATE_IDENTIFIER
    http: 409
    condition: "duplicate Patient.mrn, Clinician.npi, Drug.name, PayerPlan.name or InfusionChair.label"
  - id: ERR_CHAIR_TIME_CONFLICT
    http: 409
    condition: "requested chair occupancy starts strictly before an existing appointment's scheduled_end plus the chair's turnover buffer"
  - id: ERR_CLINICIAN_CAPACITY_EXCEEDED
    http: 409
    condition: "a third visit is booked overlapping two existing visits of the same clinician"
  - id: ERR_QUALITY_PERIOD_NO_VISITS
    http: 422
    condition: "the half-open reporting window contains no NEW or FOLLOW_UP visit for the patient"
  # --- fiscal
  - id: ERR_AUTHORIZATION_UNITS_EXHAUSTED
    http: 409
    condition: "dose scheduling with no APPROVED authorization on the episode, or none with units_remaining >= 1"

roles:
  - name: Rheumatologist
    description: "Treating rheumatologist. Scores visits, opens and steers therapy episodes, and signs formulary exceptions when privileged to do so."
    identity: "entity_backed:Clinician"
    exclusive_operations:
      - "POST /visits/{id}/score (only for visits where X-User-ID == visit.clinician_id)"
      - "POST /therapy-episodes"
      - "POST /therapy-episodes/{id}/activate"
      - "POST /therapy-episodes/{id}/hold"
      - "POST /therapy-episodes/{id}/resume"
      - "POST /therapy-episodes/{id}/discontinue"
      - "POST /authorizations/{id}/attest-exception (additionally gated on the Clinician's role_type and can_attest_formulary_exception)"
    shared_operations:
      - "POST /visits (with RegistryAdmin)"
      - "GET /patients/{id}, GET /patients/{id}/screening-records, GET /patients/{id}/quality-report"
      - "GET /visits, GET /visits/{id}"
      - "GET /therapy-episodes, GET /therapy-episodes/{id}, GET /therapy-episodes/{id}/cost-share-estimate, GET /therapy-episodes/{id}/monitoring-labs, GET /therapy-episodes/{id}/assistance-enrollments"
      - "GET /authorizations, GET /authorizations/{id}"
      - "GET /infusion-appointments, GET /infusion-appointments/{id}"
      - "GET /assistance-enrollments/{id}"
      - "POST /_clock/set_current_utc"

  - name: PriorAuthCoordinator
    description: "Practice authorization coordinator. Opens and submits prior-authorization requests and appeals, but can never decide them."
    identity: "opaque"
    exclusive_operations:
      - "POST /authorizations"
      - "POST /authorizations/{id}/submit"
    shared_operations:
      - "GET /patients/{id}, GET /patients/{id}/screening-records"
      - "GET /visits, GET /visits/{id}"
      - "GET /therapy-episodes, GET /therapy-episodes/{id}, GET /therapy-episodes/{id}/cost-share-estimate, GET /therapy-episodes/{id}/monitoring-labs, GET /therapy-episodes/{id}/assistance-enrollments"
      - "GET /authorizations, GET /authorizations/{id}"
      - "GET /infusion-appointments, GET /infusion-appointments/{id}"
      - "GET /assistance-enrollments/{id}"
      - "POST /_clock/set_current_utc"

  - name: PayerReviewer
    description: "Payer-side utilization reviewer. Renders approvals and denials on submitted authorizations and nothing else."
    identity: "opaque"
    exclusive_operations:
      - "POST /authorizations/{id}/determination"
    shared_operations:
      - "GET /patients/{id}"
      - "GET /therapy-episodes, GET /therapy-episodes/{id}"
      - "GET /authorizations, GET /authorizations/{id}"
      - "POST /_clock/set_current_utc"

  - name: InfusionNurse
    description: "Infusion-suite and clinic nurse. Checks patients in, files screening and monitoring results, runs the infusion chair schedule and records self-injection training."
    identity: "entity_backed:Clinician"
    exclusive_operations:
      - "POST /visits/{id}/check-in"
      - "POST /screening-records"
      - "POST /monitoring-labs"
      - "POST /therapy-episodes/{id}/record-training"
      - "POST /infusion-appointments"
      - "POST /infusion-appointments/{id}/administer"
      - "POST /infusion-appointments/{id}/reverse-administration"
      - "POST /infusion-appointments/{id}/cancel"
    shared_operations:
      - "GET /patients/{id}, GET /patients/{id}/screening-records"
      - "GET /visits, GET /visits/{id}"
      - "GET /therapy-episodes, GET /therapy-episodes/{id}, GET /therapy-episodes/{id}/monitoring-labs, GET /therapy-episodes/{id}/assistance-enrollments"
      - "GET /authorizations, GET /authorizations/{id}"
      - "GET /infusion-appointments, GET /infusion-appointments/{id}"
      - "GET /assistance-enrollments/{id}"
      - "POST /_clock/set_current_utc"

  - name: BenefitsCounselor
    description: "Financial navigator. Enrolls episodes in assistance programs, attests peers' enrollments and renews them on the reauthorization calendar."
    identity: "opaque"
    exclusive_operations:
      - "POST /assistance-enrollments"
      - "POST /assistance-enrollments/{id}/attest (never for an enrollment this same X-User-ID submitted)"
      - "POST /assistance-enrollments/{id}/reauthorize"
    shared_operations:
      - "GET /patients/{id}"
      - "GET /visits, GET /visits/{id}"
      - "GET /therapy-episodes, GET /therapy-episodes/{id}, GET /therapy-episodes/{id}/cost-share-estimate, GET /therapy-episodes/{id}/assistance-enrollments"
      - "GET /authorizations, GET /authorizations/{id}"
      - "GET /infusion-appointments, GET /infusion-appointments/{id}"
      - "GET /assistance-enrollments/{id}"
      - "POST /_clock/set_current_utc"

  - name: RegistryAdmin
    description: "Practice registry and operations administrator. Owns reference data, the chair roster, the reauthorization sweep and the treat-to-target quality report."
    identity: "opaque"
    exclusive_operations:
      - "POST /patients"
      - "POST /clinicians"
      - "POST /drugs"
      - "POST /payer-plans"
      - "POST /infusion-chairs"
      - "PATCH /infusion-chairs/{id}"
      - "POST /_ops/run-reauthorization-calendar"
    shared_operations:
      - "POST /visits (with Rheumatologist)"
      - "GET /patients/{id}, GET /patients/{id}/screening-records, GET /patients/{id}/quality-report"
      - "GET /visits, GET /visits/{id}"
      - "GET /therapy-episodes, GET /therapy-episodes/{id}, GET /therapy-episodes/{id}/cost-share-estimate, GET /therapy-episodes/{id}/monitoring-labs, GET /therapy-episodes/{id}/assistance-enrollments"
      - "GET /authorizations, GET /authorizations/{id}"
      - "GET /infusion-appointments, GET /infusion-appointments/{id}"
      - "GET /assistance-enrollments/{id}"
      - "POST /_clock/set_current_utc"

  - name: Patient
    description: "The patient reading their own record. Holds no write privileges anywhere in the API."
    identity: "entity_backed:Patient"
    exclusive_operations: []
    shared_operations:
      - "GET /patients/{id} (only when X-User-ID equals the path id)"
      - "GET /patients/{id}/screening-records (only their own)"
      - "GET /visits, GET /visits/{id} (only their own)"
      - "POST /_clock/set_current_utc"
