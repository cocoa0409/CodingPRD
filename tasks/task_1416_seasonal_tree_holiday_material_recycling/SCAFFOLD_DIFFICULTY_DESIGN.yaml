  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: booking_requires_zone_active
        grounds:
          - state_machines.ServiceZone.ACTIVE_to_SUSPENDED
          - errors[ERR_ZONE_SUSPENDED]
          - endpoints["POST /bookings"]
        distinguishing_aspect: |
          Pair CurbsideBooking -> ServiceZone: booking creation is gated on the ZONE's
          status dimension (ACTIVE vs SUSPENDED), independent of the program's own
          status. Suspend blocks; reactivate restores.
        test_recipe:
          setup:
            - "Program ACTIVE; zone NW-1 capacity 5; household H1 registered; zone then SUSPENDED"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "TreeCycle 2027", season_label: "Winter 2027", window_start: "2027-01-02T00:00:00Z", window_end: "2027-01-16T23:59:59Z" }
              as: ProgramAdmin
