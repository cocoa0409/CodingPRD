          assert:
            - "HTTP 409."
            - "data.error_id == 'ERR_CANDIDATES_ALREADY_GENERATED'."
            - "GET /pavement/treatment-candidates?survey_id={sv} returns meta.total_count == 1 — not 2."
            - "${again} == ${c1}, ${again_cost} == ${c1_cost} == 10743323 and candidate_status == 'RECOMMENDED'."
            - "The survey is still 'SEALED' — the failed call did not regress the survey state."

      - name: line_delete_endpoint_returns_the_removed_row_and_rolls_back_the_bundle
        claim_type: deletion
        grounds: ["endpoints.DELETE /pavement/project-segments/{id}"]
        distinguishing_aspect: "DELETE is a soft removal that returns the mutated ProjectSegment and reverses every counter the add advanced; §1.8 already pins the full restoration with literals."
        excluded_because:
          difficulty_instance: "line_removal_restores_project_area_counters_and_candidate_status"
          rationale: "That §1.8 compensating_invariant instance issues the DELETE and asserts the returned row's work_state == REMOVED, the project's segment_count / planned_area_sy / bundle_base_cents / contingency_cents / project_total_estimate_cents back to their pre-add literals, the candidate returned from CONSUMED to RECOMMENDED and the segment's active_project_count decremented. A separate endpoint-shape test would assert a strict subset of those facts."

      - name: cancel_award_endpoint_reopens_the_project_for_bidding
        claim_type: action_endpoint
        grounds: ["endpoints.POST /pavement/projects/{id}/cancel-award"]
        distinguishing_aspect: "cancel-award is the reverse action for award: it returns the project to BID_READY, clears contractor_id and award_amount_cents and un-commits the money; §1.8 pins the ledger conservation exactly."
        excluded_because:
          difficulty_instance: "cancel_award_restores_scenario_committed_and_uncommitted_exactly"
          rationale: "That §1.8 compensating_invariant instance awards, cancels and re-awards, asserting committed_cents / uncommitted_cents / version at every step plus the cleared contractor_id and award_amount_cents and the BID_READY return. The endpoint-shape claims for cancel-award are a strict subset."


