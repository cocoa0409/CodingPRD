      - name: appeal_target_requires_issued_determination
        grounds:
          - validations[priority=8]
          - errors[ERR_APPEAL_TARGET_INVALID]
          - state_machines.Appeal
        distinguishing_aspect: |
          Entity pair Appeal -> Determination (third distinct pair): on a DISMISSED case with no
          determination at all, appeal_target DETERMINATION is rejected ERR_APPEAL_TARGET_INVALID while
          appeal_target DISMISSAL on the same case succeeds - the appeal's valid creation depends on the
          existence and ISSUED state of a different entity.
        test_recipe:
          setup:
            - "Case [NON_TITLE_IX_MISCONDUCT]-free: [STALKING] dismissed during JURISDICTION_REVIEW (no determination exists)"
          setup_api_calls:
