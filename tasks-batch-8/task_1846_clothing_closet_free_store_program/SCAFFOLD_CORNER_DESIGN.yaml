            - "vst == CHECKED_IN after reinstate"

      - name: voucher_lazy_expiry_on_read
        claim_type: valid_transition
        grounds: [state_machines.Voucher.ISSUED_to_EXPIRED]
        distinguishing_aspect: "Voucher flips ISSUED -> EXPIRED lazily: a read at/after expires_at returns EXPIRED without any explicit action endpoint."
