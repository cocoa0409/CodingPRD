            - { call: "POST /collateral", payload: { loan_account_id: "${loan}", collateral_type: "EQUIPMENT", description: "Sprayer", appraised_value_cents: 10000000 }, as: LoanOfficer, captures: { col: $.data.id } }
            - { call: "POST /ucc-filings", payload: { collateral_id: "${col}", filing_number: "UCC-26-001", jurisdiction: "STATE_UCC_OFFICE", filed_date: "2026-03-05T00:00:00Z" }, as: LoanOfficer }
            - { call: "POST /insurance-policies", payload: { borrower_id: "${bor}", policy_number: "POL-001", crop_type: "CORN", county: "BLACKHAWK", coverage_start: "2026-03-01T00:00:00Z", coverage_end: "2027-03-01T00:00:00Z", coverage_amount_cents: 40000000 }, as: LoanOfficer, captures: { pol: $.data.id } }
            - { call: "POST /insurance-policies/${pol}/assign", payload: { loan_account_id: "${loan}" }, as: LoanOfficer }
            - { call: "POST /loan-accounts/${loan}/activate", as: LoanOfficer }
          trigger:
            - { call: "POST /covenant-evaluations", payload: { loan_account_id: "${loan}", as_of_date: "2026-03-15T00:00:00Z", current_assets_cents: 100000, current_liabilities_cents: 100000 }, as: LoanOfficer, as_user_id: "officer-1", captures: { ev: $.data.id, outc: $.data.outcome } }
            - { call: "GET /borrowers/${bor}", as: LoanOfficer, captures: { cnt_mid: $.data.active_covenant_breach_count } }
            - { call: "POST /covenant-evaluations/${ev}/void", as: LoanOfficer, captures: { vst: $.data.status } }
            - { call: "GET /borrowers/${bor}", as: LoanOfficer, captures: { cnt_end: $.data.active_covenant_breach_count, bor_end: $.data.status } }
          assert:
            - "evaluation outcome == BREACH (${outc}; ratio 1000 < 1250)"
            - "mid-pair: active_covenant_breach_count == 1 (${cnt_mid}), borrower still ACTIVE (count < 2)"
            - "after void: evaluation status == VOIDED (${vst})"
            - "invariant: active_covenant_breach_count == 0 (${cnt_end}) and borrower status == ACTIVE (${bor_end}) — the record/void pair conserves the count"
