            - call: "POST /network/payment-entries/${e1}/cancel"
              payload: {}
              as: ParticipantOfficer
              as_user_id: "${p1}"
              captures: { e1_status: $.data.status }
            - call: "GET /network/originators/${o1}"
              payload: {}
              as: PlatformAdmin
              captures: { post_committed: $.data.committed_exposure_cents, post_contingent: $.data.contingent_exposure_cents }
          assert:
            - "pre-origination: committed_exposure_cents == 0 and contingent_exposure_cents == 0"
            - "PaymentEntry.${e1}.status == CANCELLED"
            - "post-cancellation: committed_exposure_cents == 0 and contingent_exposure_cents == 0 — originate paired with cancel leaves the conserved exposure quantities exactly unchanged"

      - name: cast_then_recast_conserves_ballot_count
        grounds:
          - state_machines.Ballot.CAST_to_CAST
          - calculations.ballot_outcome_tally
        distinguishing_aspect: "Conserved quantity is the cast-ballot count (a cardinality, not money): casting YEA then recasting ABSTAIN moves weight between tallies but yea+nay+abstain stays exactly 1 — equal to the number of CAST ballots throughout."
        test_recipe:
          setup:
            - "WEB code; proposal RP in BALLOTING (comment opened 2026-09-01, ballot opened 2026-10-01); P1 ACTIVE voter with no ballot yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /network/participants"
              payload: { legal_name: "Voting Bank One", participant_type: "BOTH", routing_number: "111000025" }
              as: PlatformAdmin
              captures: { p1: $.data.id }
            - call: "POST /network/participants/${p1}/transition"
              payload: { to_state: "ACTIVE" }
              as: PlatformAdmin
            - call: "POST /network/transaction-codes"
              payload: { code: "WEB", entry_class: "DEBIT", authorization_requirement: "ORAL_RECORDED", return_timeframe_banking_days: 30, account_validation_required: true, warranty_obligations: "ODFI warrants WEB account validation" }
              as: PlatformAdmin
              captures: { tc_web: $.data.id }
            - call: "POST /network/rule-proposals"
              payload: { transaction_code_id: "${tc_web}", title: "WEB validation refresh", summary: "Shorten validation TTL", effective_date: "2027-01-01" }
              as: PlatformAdmin
              captures: { rp: $.data.id }
            - call: "POST /network/rule-proposals/${rp}/transition"
              payload: { to_state: "COMMENT_OPEN" }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /network/rule-proposals/${rp}/transition"
              payload: { to_state: "BALLOTING" }
              as: PlatformAdmin
            - call: "POST /network/rule-proposals/${rp}/ballots"
              payload: { vote: "YEA" }
              as: VotingDelegate
              as_user_id: "${p1}"
              captures: { b1: $.data.id, b1_v: $.data.version }
            - call: "GET /network/rule-proposals/${rp}"
              payload: {}
              as: PlatformAdmin
              captures: { yea_mid: $.data.yea_count, nay_mid: $.data.nay_count, abstain_mid: $.data.abstain_count }
          trigger:
            - call: "PATCH /network/ballots/${b1}"
              payload: { vote: "ABSTAIN" }
              as: VotingDelegate
              as_user_id: "${p1}"
              captures: { b1_v2: $.data.version, b1_vote: $.data.vote }
            - call: "GET /network/rule-proposals/${rp}"
              payload: {}
              as: PlatformAdmin
              captures: { yea_post: $.data.yea_count, nay_post: $.data.nay_count, abstain_post: $.data.abstain_count }
          assert:
            - "after the cast: yea_count == 1, nay_count == 0, abstain_count == 0 (sum 1)"
            - "after the recast: yea_count == 0, nay_count == 0, abstain_count == 1 (sum still 1 — conserved cardinality)"
            - "Ballot.${b1}.version advanced 1 -> 2 and vote == ABSTAIN; there is still exactly one ballot for (${rp}, ${p1})"
