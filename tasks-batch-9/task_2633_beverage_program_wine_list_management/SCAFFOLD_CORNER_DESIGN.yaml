  - section: rbac
    instances:
      - name: director_publishes_and_runs_pour_cost_others_cannot_do_either
        claim_type: Exclusive Operations
        grounds:
          - rbac[BeverageDirector].exclusive_operations
          - errors[ERR_FORBIDDEN_ROLE]
          - validations[priority 3]
        distinguishing_aspect: >-
