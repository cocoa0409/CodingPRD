              as: SiteOps
            - call: "POST /mfc/sites"
              payload: { code: "SITE-A", name: "Downtown MFC", delivery_radius_miles: 5.0, fee_schedule: { base_cents: 199, per_mile_cents: 99, included_miles: 1.5, peak_surcharge_cents: 150, min_fee_cents: 99, max_fee_cents: 999 }, fee_waiver_threshold_cents: 3000, batch_max_lines: 2, batch_max_items: 20, expiry_horizon_days: 2 }
              as: SiteOps
              captures: { site_id: $.data.id }
            - call: "POST /mfc/products"
              payload: { sku: "SKU-CHIPS", name: "Chips", price_cents: 500, product_class: "STANDARD" }
              as: SiteOps
              captures: { prod_chips: $.data.id }
            - call: "POST /mfc/inventory-balances"
              payload: { site_id: "${site_id}", product_id: "${prod_chips}", min_par_level: 0 }
              as: SiteOps
              captures: { bal_chips: $.data.id }
            - call: "POST /mfc/inventory-balances/${bal_chips}/adjustments"
              payload: { kind: "RECEIPT", qty: 50, reason: "opening" }
              as: SiteOps
            - call: "POST /mfc/customers"
              payload: { email: "ada@example.com", full_name: "Ada Adult", date_of_birth: "1990-01-01T00:00:00Z" }
              as: Customer
              captures: { cust_id: $.data.id }
            - call: "POST /mfc/pickers"
              payload: { site_id: "${site_id}", name: "Pat Picker" }
              as: SiteOps
              captures: { picker_1: $.data.id }
            - &ob_1
              call: "POST /mfc/orders"
              payload: { customer_id: "${cust_id}", site_id: "${site_id}", lines: [ { product_id: "${prod_chips}", qty: 1 } ], delivery_distance_miles: 1.0 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ob_1: $.data.id }
            - &ob_2
              call: "POST /mfc/orders"
              payload: { customer_id: "${cust_id}", site_id: "${site_id}", lines: [ { product_id: "${prod_chips}", qty: 1 } ], delivery_distance_miles: 1.0 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ob_2: $.data.id }
            - &ob_3
              call: "POST /mfc/orders"
              payload: { customer_id: "${cust_id}", site_id: "${site_id}", lines: [ { product_id: "${prod_chips}", qty: 1 } ], delivery_distance_miles: 1.0 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ob_3: $.data.id }
            - &b_cap
              call: "POST /mfc/pick-batches"
              payload: { site_id: "${site_id}", picker_id: "${picker_1}" }
              as: SiteOps
              captures: { b_cap: $.data.id }
            - call: "POST /mfc/pick-batches/${b_cap}/orders"
              payload: { order_id: "${ob_1}" }
              as: Picker
              as_user_id: "${picker_1}"
          trigger:
            - call: "POST /mfc/pick-batches/${b_cap}/orders"
              payload: { order_id: "${ob_2}" }
              as: Picker
              as_user_id: "${picker_1}"
            - call: "POST /mfc/pick-batches/${b_cap}/orders"
              payload: { order_id: "${ob_3}" }
              as: Picker
              as_user_id: "${picker_1}"
              captures: { err_full: $.data.error_id }
          assert:
            - "The second append succeeds: PickBatch.${b_cap}.order_ids has exactly 2 entries (== cap is full but legal)"
            - "The third append returns 409 and error_id == ERR_BATCH_FULL"
            - "Order.${ob_3}.status is still PLACED and its reserved units were not committed"
            - "InventoryBalance.${bal_chips}.reserved == 2"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: order_placement_gated_by_site_posture
        grounds:
          - state_machines.Site
          - entities.Site.fields.effective_status
          - state_machines.ReplenishOrder.DRAFT_to_PLACED
          - errors.ERR_SITE_NOT_OPERATING
        distinguishing_aspect: |
          Entity pair Order -> Site (via ReplenishOrder): placing an order is
          rejected while the SITE's derived posture is OPENED_REPLENISH — a
          state the site only holds because a third entity (a PLACED
          ReplenishOrder) exists. Finalizing the replenish order unblocks
          placement without touching the site row.
        test_recipe:
          setup:
            - "Logical clock 2026-09-10T14:00:00Z. Site SITE-A; SKU-CHIPS stocked 50; customer of age; one replenish order PLACED (posture OPENED_REPLENISH)."
          setup_api_calls:
            - call: "POST /mfc/_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T14:00:00Z" }
              as: SiteOps
            - call: "POST /mfc/sites"
              payload: { code: "SITE-A", name: "Downtown MFC", delivery_radius_miles: 5.0, fee_schedule: { base_cents: 199, per_mile_cents: 99, included_miles: 1.5, peak_surcharge_cents: 150, min_fee_cents: 99, max_fee_cents: 999 }, fee_waiver_threshold_cents: 3000, batch_max_lines: 2, batch_max_items: 20, expiry_horizon_days: 2 }
              as: SiteOps
              captures: { site_id: $.data.id }
            - call: "POST /mfc/products"
              payload: { sku: "SKU-CHIPS", name: "Chips", price_cents: 500, product_class: "STANDARD" }
              as: SiteOps
              captures: { prod_chips: $.data.id }
            - call: "POST /mfc/inventory-balances"
              payload: { site_id: "${site_id}", product_id: "${prod_chips}", min_par_level: 0 }
              as: SiteOps
              captures: { bal_chips: $.data.id }
            - call: "POST /mfc/inventory-balances/${bal_chips}/adjustments"
              payload: { kind: "RECEIPT", qty: 50, reason: "opening" }
              as: SiteOps
            - call: "POST /mfc/customers"
              payload: { email: "ada@example.com", full_name: "Ada Adult", date_of_birth: "1990-01-01T00:00:00Z" }
              as: Customer
              captures: { cust_id: $.data.id }
            - &ro_gate
              call: "POST /mfc/replenish-orders"
              payload: { site_id: "${site_id}", reference: "PO-GATE", lines: [ { product_id: "${prod_chips}", qty: 5, unit_cost_cents: 200 } ], expected_at: "2026-09-11T08:00:00Z", idempotency_key: "po-gate-key" }
              as: SiteOps
              captures: { ro_gate: $.data.id }
            - call: "POST /mfc/replenish-orders/${ro_gate}/place"
              payload: {}
              as: SiteOps
          trigger:
            - call: "POST /mfc/orders"
              payload: { customer_id: "${cust_id}", site_id: "${site_id}", lines: [ { product_id: "${prod_chips}", qty: 1 } ], delivery_distance_miles: 1.0 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err_gate: $.data.error_id }
            - call: "POST /mfc/replenish-orders/${ro_gate}/finalize"
              payload: {}
              as: SiteOps
            - call: "POST /mfc/orders"
              payload: { customer_id: "${cust_id}", site_id: "${site_id}", lines: [ { product_id: "${prod_chips}", qty: 1 } ], delivery_distance_miles: 1.0 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { o_gate: $.data.id }
          assert:
            - "First placement returns 409 and error_id == ERR_SITE_NOT_OPERATING (posture OPENED_REPLENISH blocks orders)"
            - "After finalize the second placement succeeds (201) — the gate cleared via the replenish transition alone"
            - "Order.${o_gate}.status == PLACED"

      - name: handoff_failure_path_gated_by_handoff_status
        grounds:
          - state_machines.Order.AWAITING_HANDOFF_to_HANDOFF_FAILED
          - state_machines.DeliveryBag.handoff_status
          - errors.ERR_REFUSAL_REQUIRED
        distinguishing_aspect: |
          Different entity pair — Order -> DeliveryBag: the Order may only move
          AWAITING_HANDOFF -> HANDOFF_FAILED when its bag's handoff dimension
          sits in REFUSED; calling fail-handoff while handoff_status is NONE or
          ID_SCANNED is rejected with ERR_REFUSAL_REQUIRED even though the order
          itself is in the right state.
        test_recipe:
          setup:
            - "Logical clock 2026-09-10T14:00:00Z. Site SITE-A; AGE_RESTRICTED SKU-BEER-A 999 stocked 10; adult customer; Pat/Sam pickers; Dee driver; order AWAITING_HANDOFF with bag ASSIGNED to Dee; no scan yet (handoff_status NONE)."
          setup_api_calls:
            - call: "POST /mfc/_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T14:00:00Z" }
