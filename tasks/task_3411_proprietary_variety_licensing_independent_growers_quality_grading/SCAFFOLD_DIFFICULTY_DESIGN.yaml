          assert:
            - "PoolPeriod.${pool2_id}: total_net_kg == 1000, total_weighted_kg == 1000, gross_pool_revenue_cents == 400000, marketing_fee_cents == 24000, net_pool_revenue_cents == 376000"
            - "base rate 376000 / 1000 == 376.0000; with is_shoulder_week=true final_pool_rate == 413.6000 (== 376.0000 x 1.10, rounded 4dp)"
            - "pool_distributable_cents == 413600 (> net_pool_revenue_cents 376000: the shoulder multiplier is applied AFTER the fee carve-out and funds the difference)"
            - "HarvestLot.${h4_id}.lot_gross_final_cents == 413600; remainder == 0"
            - "G2's statement for pool 2: gross_cents == 413600, net_cents == 413600"
            - "contrast: the same 1000 kg STANDARD at price 400 in a non-shoulder pool would price at 376.0000 — the conditional flag alone moves the rate by exactly 10 percent"

      - name: settlement_evaluation_order_mode_c
        grounds:
          - calculations.pool_rate
          - entities.PoolPeriod.fields.marketing_fee_cents
          - entities.PoolPeriod.fields.net_pool_revenue_cents
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with pinned evaluation order: the marketing fee
          is carved out of GROSS revenue (step 4) and the pool rate is derived from NET revenue
          (step 6), never the reverse. If the order were inverted the provisional fee would be
          111390 and the provisional rate 479.0782; the pinned order yields 118500 and 450.3335.
