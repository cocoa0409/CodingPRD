              as: HealthCareStaff
              as_user_id: "${camp_id}"
              captures: { rec1_id: "$.data.id" }
            - call: "POST /accreditation/medication-records"
              payload: { camp_id: "${camp_id}", camper_reference: "CR-B", medication_class: "CONTROLLED", dose_units: 4, administered_at: "2026-08-01T09:00:00.000Z", administered_by_role: "PHYSICIAN", second_signature_present: true }
              as: HealthCareStaff
              as_user_id: "${camp_id}"
              captures: { rec2_id: "$.data.id" }
          trigger:
            - call: "POST /accreditation/medication-records"
              payload: { camp_id: "${camp_id}", camper_reference: "CR-C", medication_class: "CONTROLLED", dose_units: 2, administered_at: "2026-08-01T10:00:00.000Z", administered_by_role: "LPN", second_signature_present: true }
              as: HealthCareStaff
              as_user_id: "${camp_id}"
            - call: "POST /accreditation/medication-records"
              payload: { camp_id: "${camp_id}", camper_reference: "CR-C", medication_class: "CONTROLLED", dose_units: 2, administered_at: "2026-08-01T10:00:00.000Z", administered_by_role: "RN" }
              as: HealthCareStaff
              as_user_id: "${camp_id}"
            - call: "POST /accreditation/medication-records"
              payload: { camp_id: "${camp_id}", camper_reference: "CR-C", medication_class: "CONTROLLED", dose_units: 14, administered_at: "2026-08-01T10:00:00.000Z", administered_by_role: "RN", second_signature_present: true }
              as: HealthCareStaff
              as_user_id: "${camp_id}"
            - call: "POST /accreditation/medication-records"
              payload: { camp_id: "${camp_id}", camper_reference: "CR-D", medication_class: "OTC", dose_units: 1, administered_at: "2026-08-01T11:00:00.000Z", administered_by_role: "UNLICENSED_DESIGNEE" }
              as: HealthCareStaff
              as_user_id: "${camp_id}"
            - call: "GET /accreditation/camps/${camp_id}"
              as: AccreditationOfficer
              as_user_id: "officer-1"
          assert:
            - "after setup: Camp.${camp_id}.controlled_intake_units == 20 and controlled_on_hand_units == 13 (20 - 3 - 4)"
            - "first trigger call: 422 ERR_MED_ROLE_NOT_PERMITTED - CONTROLLED accepts RN and PHYSICIAN only"
            - "second trigger call: 422 ERR_CONTROLLED_SECOND_SIGNATURE_REQUIRED"
            - "third trigger call: 422 ERR_CONTROLLED_STOCK_INSUFFICIENT - 14 exceeds the 13 units on hand"
            - "fourth trigger call: 422 ERR_MED_ROLE_NOT_PERMITTED - UNLICENSED_DESIGNEE is never permitted, not even for OTC"
            - "final read: controlled_intake_units == 20 and controlled_on_hand_units == 13 - every rejection was write-free"
            - "MedicationAdministrationRecord.${rec1_id}.compliance_flag == COMPLIANT and MedicationAdministrationRecord.${rec2_id}.compliance_flag == COMPLIANT"

