      - name: path_existence_priority_3_outranks_ownership_priority_4
        grounds:
          - validations.priority_3
          - validations.priority_4
          - errors.ERR_TAXPAYER_NOT_FOUND
          - errors.ERR_NOT_RESOURCE_OWNER
        distinguishing_aspect: |
          A Taxpayer-role caller probing a non-existent taxpayer id must get
          ERR_TAXPAYER_NOT_FOUND (404) because existence is checked at priority 3,
          BEFORE ownership at priority 4; the same caller probing a real foreign
          taxpayer gets ERR_NOT_RESOURCE_OWNER (403). Implementations that shortcut
          straight to the ownership check answer 403 for both and leak nothing, but
          they contradict the declared order.
        test_recipe:
          setup:
            - "Two registered taxpayers and no other state."
          setup_api_calls:
            - call: "POST /taxpayers"
              payload: { legal_name: "Ridgeline Tools Inc", permit_number: "P-2710-V3A", industry_naics_code: "444140", filing_frequency: "QUARTERLY", gross_receipts_annual_cents: 100000000, delinquent_period_count: 0 }
              as: SelectionAnalyst
              captures: { self_id: "$.data.id" }
            - call: "POST /taxpayers"
              payload: { legal_name: "Vantage Beverage Co", permit_number: "P-2710-V3B", industry_naics_code: "445110", filing_frequency: "MONTHLY", gross_receipts_annual_cents: 1000000000, delinquent_period_count: 0 }
              as: SelectionAnalyst
              captures: { other_id: "$.data.id" }
          trigger:
            - call: "GET /taxpayers/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Taxpayer
              as_user_id: "${self_id}"
            - call: "GET /taxpayers/${other_id}"
              payload: {}
              as: Taxpayer
              as_user_id: "${self_id}"
          assert:
            - "trigger call 1: response.status == 404 and response.data.error_id == ERR_TAXPAYER_NOT_FOUND"
            - "trigger call 1: response.data.error_id != ERR_NOT_RESOURCE_OWNER"
            - "trigger call 2: response.status == 403 and response.data.error_id == ERR_NOT_RESOURCE_OWNER"
            - "a GET /taxpayers/${self_id} by the same caller returns 200"

      - name: segregation_priority_8_outranks_statute_expired_priority_12
        grounds:
          - validations.priority_8
          - validations.priority_12
          - errors.ERR_SEGREGATION_OF_DUTIES
          - errors.ERR_STATUTE_EXPIRED
        distinguishing_aspect: |
          The audit's lead_auditor_user_id is deliberately "supervisor-1", and the
          clock is moved to 2029-07-01, one day past the 2029-06-29 statute expiry.
          Closing fieldwork as supervisor-1 therefore breaks both the compliance rule
          at priority 8 and the statute rule at priority 12; the response must be
          ERR_SEGREGATION_OF_DUTIES with 403, and the audit must stay in FIELDWORK.
