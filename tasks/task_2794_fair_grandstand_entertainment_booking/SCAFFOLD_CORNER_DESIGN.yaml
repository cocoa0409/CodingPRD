      - name: bundle_credit_constant_isolated_by_twin_ga_scales
        claim_type: constants_applied
        grounds:
          - calculations.ticket_gross_potential
          - entities.TicketScale.fields.bundled_with_gate_admission
          - entities.FairEdition.fields.gate_admission_price_cents
        distinguishing_aspect: |
          Two GA scales identical except for bundled_with_gate_admission isolate both
          constants exactly: the unbundled line is 7818038, the bundled line is
          6036713, and the difference is 1781325 = 900 * 2100 * 0.9425 where the 900 is
          round_half_up(1500 * 0.6). The booking's gross_potential_cents is 13854751,
          the sum of the two already-rounded lines.
        test_recipe:
          setup:
            - "Canonical edition (gate_admission_price_cents 1500), stage, agent, artist and offer; offer sent and accepted so a DATE_HELD / SCALED_PENDING booking exists."
            - "Two GENERAL_ADMISSION scales, both face 3950 with allotment 2100 and facility_fee_cents 0: tier LAWN-BUNDLE with bundled_with_gate_admission true, tier LAWN-ONLY with it false. 2100 + 2100 = 4200 seats is within the stage's ga_capacity of 6000."
            - "No announce and no sales: potential is a capacity figure only."
          setup_api_calls:
            - call: "POST /grandstand/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
