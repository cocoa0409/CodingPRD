        distinguishing_aspect: "This is the §1.2.1 rule whose write_endpoint is POST /mdm/source-registrations: the registration itself is legitimate, so only the anchor version distinguishes a caller whose picture of the authoritative designation predates an unrelated accountability write - and every accepted write bumps the anchor again."
        test_recipe:
