            - "order with the voc_gpl == 251 product fails with HTTP 422 ERR_VOC_LIMIT_EXCEEDED"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: dispatch_blocked_by_job_hold
        grounds:
          - state_machines.Delivery.SCHEDULED_to_EN_ROUTE
          - state_machines.JobAccount.OPEN_to_ON_HOLD
          - validations[priority=9]
        distinguishing_aspect: |
          Entity pair Delivery x JobAccount: a SCHEDULED delivery of an otherwise-valid paid order
          cannot dispatch while its job is ON_HOLD; resuming the job restores dispatchability.
        test_recipe:
          setup:
            - "Paid order with a SCHEDULED delivery for 2026-06-12; job placed ON_HOLD"
          setup_api_calls:
            - { call: "POST /contractor-accounts", payload: { company_name: "Hold Co", credit_limit_cents: 100000000 }, as: CorporateAdmin, captures: { acct: "$.data.id", av0: "$.data.version" } }
            - { call: "POST /jurisdictions", payload: { code: "NM-OPEN", name: "New Mexico Open" }, as: CorporateAdmin, captures: { jur: "$.data.id" } }
            - { call: "POST /job-accounts", payload: { contractor_account_id: "${acct}", jurisdiction_id: "${jur}", job_name: "Yard", site_address: "8 Cactus Way" }, as: StoreAssociate, captures: { job: "$.data.id" } }
            - { call: "POST /products", payload: { sku: "P-HOLD", name: "Can", category: "FLAT", voc_gpl: 100, list_price_cents: 5000, tintable: false }, as: CorporateAdmin, captures: { prod: "$.data.id" } }
            - { call: "POST /orders", payload: { contractor_account_id: "${acct}", job_account_id: "${job}", expected_contractor_account_version: "${av0}", lines: [{ product_id: "${prod}", quantity: 1 }] }, as: StoreAssociate, captures: { o1: "$.data.id" } }
            - { call: "POST /orders/${o1}/pay", payload: {}, as: StoreAssociate }
            - { call: "POST /deliveries", payload: { order_id: "${o1}", job_account_id: "${job}", window_start: "2026-06-12T09:00:00Z", window_end: "2026-06-12T10:00:00Z" }, as: StoreManager, captures: { d1: "$.data.id" } }
            - { call: "POST /job-accounts/${job}/place-on-hold", payload: {}, as: StoreManager }
          trigger:
            - { call: "POST /deliveries/${d1}/dispatch", payload: {}, as: StoreManager }
            - { call: "POST /job-accounts/${job}/resume", payload: {}, as: StoreManager }
            - { call: "POST /deliveries/${d1}/dispatch", payload: {}, as: StoreManager }
          assert:
            - "first dispatch attempt: HTTP 409 ERR_JOB_NOT_OPEN (Delivery gated by JobAccount state)"
            - "after resume: dispatch succeeds, Delivery.${d1}.status == EN_ROUTE, Order.${o1}.fulfillment_status == OUT_FOR_DELIVERY"

      - name: spec_approve_blocked_by_discontinued_product
        grounds:
          - state_machines.SpecSheet.SUBMITTED_to_APPROVED
          - state_machines.Product.ACTIVE_to_DISCONTINUED
          - validations[priority=33]
        distinguishing_aspect: |
          Entity pair SpecSheet x Product (different pair than Delivery x JobAccount): approving a
          SUBMITTED sheet is rejected once one of its lines' products has been DISCONTINUED by a
          bulletin; the sheet itself stays SUBMITTED because the cascade only re-routes APPROVED sheets.
        test_recipe:
          setup:
            - "SUBMITTED spec sheet specifying product OLD2; bulletin discontinuing OLD2 (replacement NEW2) published and taken into effect at 2026-06-01"
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "P-OLD2", name: "Legacy NF", category: "NON_FLAT", voc_gpl: 100, list_price_cents: 9000, tintable: false }, as: CorporateAdmin, captures: { p_old: "$.data.id" } }
            - { call: "POST /products", payload: { sku: "P-NEW2", name: "Successor NF", category: "NON_FLAT", voc_gpl: 110, list_price_cents: 9500, tintable: false }, as: CorporateAdmin, captures: { p_new: "$.data.id" } }
            - { call: "POST /spec-sheets", payload: { project_code: "PRJ-BLK", architect_name: "B B", title: "Trim Spec", lines: [{ product_id: "${p_old}", specified_qty: 3 }] }, as: SpecWriter, captures: { sheet: "$.data.id" } }
            - { call: "GET /spec-lines?spec_sheet_id=${sheet}", payload: {}, as: SpecWriter, captures: { sline: "$.data[0].id" } }
            - { call: "POST /spec-sheets/${sheet}/submit", payload: {}, as: SpecWriter }
            - { call: "POST /product-bulletins", payload: { product_id: "${p_old}", replacement_product_id: "${p_new}", title: "P-OLD2 discontinuation", effective_date: "2026-06-01T00:00:00Z" }, as: CorporateAdmin, captures: { bul: "$.data.id" } }
            - { call: "POST /product-bulletins/${bul}/publish", payload: {}, as: CorporateAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: CorporateAdmin }
            - { call: "POST /product-bulletins/${bul}/take-effect", payload: {}, as: CorporateAdmin }
          trigger:
            - { call: "POST /spec-sheets/${sheet}/approve", payload: {}, as: CorporateAdmin }
          assert:
            - "HTTP 422 ERR_PRODUCT_DISCONTINUED (SpecSheet approval gated by Product state)"
            - "SpecSheet.${sheet}.status remains SUBMITTED (cascade obsoletes the line but only re-routes APPROVED sheets)"
            - "SpecLine.${sline}.obsoleted == true"

  - rule_id: resource_temporal_overlap
    instances:
      - name: voc_rule_half_open_adjacency
        grounds:
          - validations[priority=22]
          - entities.VocRule.fields.effective_from
          - entities.VocRule.fields.effective_to
        distinguishing_aspect: |
          Interval semantics: half-open windows on the (jurisdiction, category) rule book —
          touching windows (one's effective_from == the other's effective_to) are allowed,
          true overlap is rejected; a window in a different category never conflicts.
        test_recipe:
          setup: ["One jurisdiction; no rules yet"]
          setup_api_calls:
            - { call: "POST /jurisdictions", payload: { code: "CO-DEN", name: "Denver" }, as: CorporateAdmin, captures: { jur: "$.data.id" } }
          trigger:
            - { call: "POST /voc-rules", payload: { jurisdiction_id: "${jur}", category: "FLAT", max_voc_gpl: 250, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-06-01T00:00:00Z" }, as: CorporateAdmin, captures: { rA: "$.data.id" } }
            - { call: "POST /voc-rules", payload: { jurisdiction_id: "${jur}", category: "FLAT", max_voc_gpl: 200, effective_from: "2026-06-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z" }, as: CorporateAdmin, captures: { rB: "$.data.id" } }
            - { call: "POST /voc-rules", payload: { jurisdiction_id: "${jur}", category: "FLAT", max_voc_gpl: 220, effective_from: "2026-05-01T00:00:00Z", effective_to: "2026-07-01T00:00:00Z" }, as: CorporateAdmin }
            - { call: "POST /voc-rules", payload: { jurisdiction_id: "${jur}", category: "NON_FLAT", max_voc_gpl: 300, effective_from: "2026-03-01T00:00:00Z", effective_to: "2026-04-01T00:00:00Z" }, as: CorporateAdmin, captures: { rD: "$.data.id" } }
          assert:
            - "rule B (2026-06-01 start exactly at A's effective_to) is created: HTTP 201 — half-open adjacency allowed"
            - "rule C (2026-05-01..2026-07-01 overlaps A) rejected: HTTP 409 ERR_VOC_RULE_OVERLAP"
            - "rule D (same window arithmetic but category NON_FLAT) is created: HTTP 201 — overlap is per (jurisdiction, category)"

      - name: delivery_window_thirty_minute_buffer
        grounds:
          - validations[priority=21]
          - entities.Delivery.fields.window_start
          - entities.Delivery.fields.window_end
        distinguishing_aspect: |
          DIFFERENT interval semantics on a DIFFERENT resource: deliveries of the same JobAccount
          require a >= 30 minute clearance between windows (mere adjacency is NOT enough), unlike
          the VOC rule book where touching windows are allowed; the exactly-30-minute gap is accepted.
        test_recipe:
          setup:
            - "Account, job, product, one UNPAID order; no deliveries yet; default clock 2026-05-01"
          setup_api_calls:
            - { call: "POST /contractor-accounts", payload: { company_name: "Buf Co", credit_limit_cents: 100000000 }, as: CorporateAdmin, captures: { acct: "$.data.id", av0: "$.data.version" } }
            - { call: "POST /jurisdictions", payload: { code: "TX-DAL", name: "Dallas" }, as: CorporateAdmin, captures: { jur: "$.data.id" } }
            - { call: "POST /job-accounts", payload: { contractor_account_id: "${acct}", jurisdiction_id: "${jur}", job_name: "Lot", site_address: "6 Mesa Ct" }, as: StoreAssociate, captures: { job: "$.data.id" } }
            - { call: "POST /products", payload: { sku: "P-BUF", name: "Can", category: "FLAT", voc_gpl: 100, list_price_cents: 5000, tintable: false }, as: CorporateAdmin, captures: { prod: "$.data.id" } }
            - { call: "POST /orders", payload: { contractor_account_id: "${acct}", job_account_id: "${job}", expected_contractor_account_version: "${av0}", lines: [{ product_id: "${prod}", quantity: 1 }] }, as: StoreAssociate, captures: { o1: "$.data.id" } }
          trigger:
            - { call: "POST /deliveries", payload: { order_id: "${o1}", job_account_id: "${job}", window_start: "2026-06-15T09:00:00Z", window_end: "2026-06-15T10:00:00Z" }, as: StoreManager, captures: { dA: "$.data.id" } }
            - { call: "POST /deliveries", payload: { order_id: "${o1}", job_account_id: "${job}", window_start: "2026-06-15T10:20:00Z", window_end: "2026-06-15T11:00:00Z" }, as: StoreManager }
            - { call: "POST /deliveries", payload: { order_id: "${o1}", job_account_id: "${job}", window_start: "2026-06-15T10:30:00Z", window_end: "2026-06-15T11:00:00Z" }, as: StoreManager, captures: { dC: "$.data.id" } }
          assert:
            - "delivery A (09:00-10:00) created: HTTP 201"
            - "delivery B (10:20 start, only 20 minutes after A) rejected: HTTP 409 ERR_DELIVERY_WINDOW_CONFLICT — adjacency plus short gap is insufficient"
            - "delivery C (10:30 start, exactly the 30-minute clearance) created: HTTP 201 — the buffer comparison is inclusive (>='30 min)"

  - rule_id: compensating_invariant
    instances:
      - name: loyalty_earn_clawback_full_reversal
        grounds:
          - calculations.loyalty_accrual
          - calculations.loyalty_clawback
          - entities.ContractorAccount.fields.loyalty_points_balance
        distinguishing_aspect: |
          Conserved quantity: the loyalty points ledger. ContractorAccount.loyalty_points_balance
          must equal SUM(points_delta) at all times, and a pay (EARN) paired with a full single-line
          return (CLAWBACK) restores the exact pre-payment balance (0).
        test_recipe:
          setup:
            - "STANDARD account; paid order: 4 units at 20000 list (subtotal 80000, total 86600); EARN 800 points posted"
          setup_api_calls:
            - { call: "POST /contractor-accounts", payload: { company_name: "Loy Co", credit_limit_cents: 100000000 }, as: CorporateAdmin, captures: { acct: "$.data.id", av0: "$.data.version" } }
            - { call: "POST /jurisdictions", payload: { code: "ID-OPEN", name: "Idaho Open" }, as: CorporateAdmin, captures: { jur: "$.data.id" } }
            - { call: "POST /job-accounts", payload: { contractor_account_id: "${acct}", jurisdiction_id: "${jur}", job_name: "Silo", site_address: "3 Grain Rd" }, as: StoreAssociate, captures: { job: "$.data.id" } }
            - { call: "POST /products", payload: { sku: "P-LOY", name: "Pail", category: "FLAT", voc_gpl: 100, list_price_cents: 20000, tintable: false }, as: CorporateAdmin, captures: { prod: "$.data.id" } }
            - { call: "POST /orders", payload: { contractor_account_id: "${acct}", job_account_id: "${job}", expected_contractor_account_version: "${av0}", lines: [{ product_id: "${prod}", quantity: 4 }] }, as: StoreAssociate, captures: { o1: "$.data.id" } }
            - { call: "POST /orders/${o1}/pay", payload: {}, as: StoreAssociate }
            - { call: "GET /order-lines?order_id=${o1}", payload: {}, as: StoreAssociate, captures: { ln: "$.data[0].id" } }
          trigger:
            - { call: "POST /order-lines/${ln}/return", payload: { quantity: 4 }, as: StoreAssociate }
            - { call: "GET /loyalty-transactions?contractor_account_id=${acct}", payload: {}, as: StoreAssociate }
          assert:
            - "ContractorAccount.${acct}.loyalty_points_balance == 0 (EARN +800 then CLAWBACK -800: forward action and its compensation cancel exactly)"
            - "SUM(points_delta) over the ledger == 0 — ledger sum and balance agree (the invariant)"
            - "Order.${o1}.payment_status == REFUNDED and refunded_cents == 86600 == total_cents"

      - name: rebate_full_rewind_restores_zero
        grounds:
          - calculations.rebate_final
          - entities.RebateStatement.fields.final_amount_cents
          - entities.RebateStatement.fields.period_net_cents
        distinguishing_aspect: |
          Conserved quantity of a DIFFERENT type: money-denominated rebate accrual. A payment
          followed by its full in-period refund must leave the chronological accumulators
          (running volume V and accrued rebate R) at zero, so the finalized statement shows
          final 0, period_net 0, payable 0.
        test_recipe:
          setup:
            - "Account; order of 1 unit at 6000000 subtotal paid at 2026-04-10; the single line fully returned at 2026-04-20 (both events inside period [2026-04-01, 2026-07-01))"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-04-10T00:00:00Z" }, as: CorporateAdmin }
            - { call: "POST /contractor-accounts", payload: { company_name: "Rew Co", credit_limit_cents: 100000000 }, as: CorporateAdmin, captures: { acct: "$.data.id", av0: "$.data.version" } }
            - { call: "POST /jurisdictions", payload: { code: "MT-OPEN", name: "Montana Open" }, as: CorporateAdmin, captures: { jur: "$.data.id" } }
            - { call: "POST /job-accounts", payload: { contractor_account_id: "${acct}", jurisdiction_id: "${jur}", job_name: "Mill", site_address: "9 Pine Cone" }, as: StoreAssociate, captures: { job: "$.data.id" } }
            - { call: "POST /products", payload: { sku: "P-REW", name: "Drum", category: "FLAT", voc_gpl: 100, list_price_cents: 6000000, tintable: false }, as: CorporateAdmin, captures: { prod: "$.data.id" } }
            - { call: "POST /orders", payload: { contractor_account_id: "${acct}", job_account_id: "${job}", expected_contractor_account_version: "${av0}", lines: [{ product_id: "${prod}", quantity: 1 }] }, as: StoreAssociate, captures: { o1: "$.data.id" } }
            - { call: "POST /orders/${o1}/pay", payload: {}, as: StoreAssociate }
            - { call: "GET /order-lines?order_id=${o1}", payload: {}, as: StoreAssociate, captures: { ln: "$.data[0].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-04-20T00:00:00Z" }, as: CorporateAdmin }
            - { call: "POST /order-lines/${ln}/return", payload: { quantity: 1 }, as: StoreAssociate }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: CorporateAdmin }
            - { call: "POST /rebate-statements", payload: { contractor_account_id: "${acct}", period_start: "2026-04-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }, as: CorporateAdmin, captures: { stmt: "$.data.id" } }
          trigger:
            - { call: "POST /rebate-statements/${stmt}/finalize", payload: {}, as: CorporateAdmin }
          assert:
            - "RebateStatement.${stmt}.final_amount_cents == 0 (payment +6000000@2% = 120000 then refund peels 6000000@2% = -120000; R and V restored to zero)"
            - "RebateStatement.${stmt}.period_net_cents == 0 and payable_cents == 0"
            - "RebateStatement.${stmt}.provisional_amount_cents == 0 (net_so_far == 0 at generation)"
