      - name: a_quality_hold_quarantines_wrapped_rolls_but_reaches_no_order
        claim_type: cascading_side_effects
        grounds:
          - state_machines.ProductionRun.PROVISIONAL_to_HELD.side_effects
          - state_machines.RollSet.WRAPPED_to_QUARANTINED
          - calculations.order_allocation_ledger
        distinguishing_aspect: "The hold cascade is declared over roll sets IN {WOUND, WRAPPED, ALLOCATED}, but ALLOCATED is unreachable at hold time: allocation requires quality_status CERTIFIED and hold requires PROVISIONAL, and there is no CERTIFIED -> HELD edge. So hop 1 must quarantine the WRAPPED roll with quarantine_reason RUN_HELD and clear allocated_order_id (already null), while hops 2 and 3 are provably inert — the order stays IN_PRODUCTION with allocated_tons 0.000, never touching PARTIALLY_ALLOCATED. An implementation that eagerly recomputes and downgrades the order fails this."
