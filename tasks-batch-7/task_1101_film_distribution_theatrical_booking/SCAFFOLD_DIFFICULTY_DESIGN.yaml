# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# task_1101_film_distribution_theatrical_booking
#
# Two instances per Difficulty Rule (≥ 18 total), each cross-referenced against
# §1.1–§1.7 grounds, each with a directly-executable test_recipe.
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1: dual_variant_calc (≥ 2 instances, different entity domains)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: settlement_provisional_vs_final_diverge_on_draft_reports
        grounds:
          - calculations.settlement_distributor_share
          - entities.Settlement.fields.variant
          - state_machines.Settlement.PROVISIONAL_to_PENDING_FINAL
        distinguishing_aspect: |
          Settlement entity domain (box office ledger) — PROVISIONAL variant
          includes DRAFT + SUBMITTED reports in gross, FINAL variant includes
          only LOCKED reports. Same physical data, different inclusion filter,
          different distributor_share_cents. Distinct entity domain from the
          marketing co-op instance below.
        test_recipe:
          setup:
            - "Distributor D1 with week_epoch=0, logical clock 2026-05-01"
            - "Film F1 LIMITED, opens 2026-05-01, no wide gate"
            - "Theatre T1 ACTIVE, Screen S1 AVAILABLE, house_allowance=100000"
            - "BookingAgreement BA1 ACCEPTED (pct=0.60, decay=0.05, floor=0.30, per_capita=150, min_weeks=1)"
            - "Two BoxOfficeReports for BA1 on 2026-05-01: R1 SUBMITTED gross=600000 admissions=3000, R2 DRAFT gross=400000 admissions=1000"
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "Distro Co", territory: "US" }
              as: PlatformAdmin
              captures: { did: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /distributors/${did}/films"
              payload: { title: "Indie F1", genre: "NARRATIVE", runtime_minutes: 100, rating: "R", release_pattern: "LIMITED", target_release_date: "2026-05-01T00:00:00Z", min_screens_for_wide: 0 }
              as: Booker
              captures: { fid: $.data.id }
            - call: "POST /distributors/${did}/theatres"
              payload: { name: "Theatre T1", circuit: "Alamo", market_code: "NYC", house_allowance_cents: 100000 }
              as: PlatformAdmin
              captures: { tid: $.data.id }
            - call: "POST /distributors/${did}/theatres/${tid}/screens"
              payload: { auditorium_label: "Aud 1", seat_count: 200, projection_format: "DCP_4K" }
              as: PlatformAdmin
              captures: { sid: $.data.id }
            - call: "POST /distributors/${did}/booking-agreements"
              payload: { film_id: "${fid}", theatre_id: "${tid}", screen_id: "${sid}", opening_date: "2026-05-01T00:00:00Z", min_weeks_committed: 1, week_one_rental_pct: 0.60, rental_decay_per_week: 0.05, floor_pct: 0.30, per_capita_floor_cents: 150 }
              as: Booker
              captures: { baid: $.data.id, ba_v0: $.data.version }
            - call: "POST /distributors/${did}/booking-agreements/${baid}/accept"
              payload: { expected_booking_agreement_version: "${ba_v0}" }
              as: Exhibitor
            - call: "POST /distributors/${did}/booking-agreements/${baid}/box-office-reports"
              payload: { report_date: "2026-05-01T00:00:00Z", gross_cents: 600000, admissions: 3000 }
              as: Exhibitor
              captures: { r1id: $.data.id }
            - call: "POST /distributors/${did}/booking-agreements/${baid}/box-office-reports/${r1id}/submit"
              payload: {}
              as: Exhibitor
            - call: "POST /distributors/${did}/booking-agreements/${baid}/box-office-reports"
              payload: { report_date: "2026-05-01T00:00:00Z", gross_cents: 400000, admissions: 1000 }
              as: Exhibitor
              captures: { r2id: $.data.id }
          trigger:
            - call: "GET /distributors/${did}/booking-agreements/${baid}/settlements"
              payload: {}
              as: SettlementClerk
              captures: { provisional_share: "$.data[0].distributor_share_cents", provisional_variant: "$.data[0].variant" }
          assert:
            - "Settlement[0].variant == PROVISIONAL"
            - "Settlement[0].gross_cents == 1000000 (includes DRAFT R2 400000 + SUBMITTED R1 600000)"
            - "After close_box_office_week, Settlement.variant transitions to FINALIZED with gross_cents == 600000 (only LOCKED R1 counts; DRAFT R2 excluded)"
            - "provisional_share (computed from gross=1000000, net=900000, pct=0.60, share_before=540000, per_cap=4000*150=600000) == 600000"
            - "Final share (gross=600000, net=500000, pct=0.60, share_before=300000, per_cap=3000*150=450000) == 450000"
            - "provisional_share != final_share — variants diverge"

      - name: coop_accrual_provisional_vs_final_aggregate_house_allowance_split
        grounds:
          - calculations.settlement_distributor_share
          - entities.AggregateDeal.fields.aggregate_house_allowance_cents
          - state_machines.AggregateDeal.DRAFT_to_ACTIVE
        distinguishing_aspect: |
          AggregateDeal entity domain (circuit-level group pricing) — PROVISIONAL
          uses per-theatre house_allowance; FINAL uses aggregate split across
          participating screens with created_at-ASC remainder. Different entity
          domain from the Settlement ledger variant above; dual-variant shape
          is provisional-vs-final but applied to a different field (house
          allowance source, not gross inclusion).
        test_recipe:
          setup:
            - "Distributor D1, logical clock 2026-05-01"
            - "Film F1 LIMITED"
            - "Two theatres T1, T2 in same circuit 'Alamo', each house_allowance=80000"
            - "AggregateDeal AD1 ACTIVE, aggregate_rental_pct=0.50, aggregate_house_allowance=200000, min_screens=2"
            - "BookingAgreement BA1 (T1) and BA2 (T2) both ACCEPTED with aggregate_deal_id=AD1"
            - "Week 1: BA1 gross=500000 admissions=2000; BA2 gross=500000 admissions=2000 (LOCKED reports)"
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "Distro Co", territory: "US" }
              as: PlatformAdmin
              captures: { did: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /distributors/${did}/films"
              payload: { title: "F1", genre: "NARRATIVE", runtime_minutes: 95, rating: "PG13", release_pattern: "LIMITED", target_release_date: "2026-05-01T00:00:00Z", min_screens_for_wide: 0 }
              as: Booker
              captures: { fid: $.data.id }
            - call: "POST /distributors/${did}/theatres"
              payload: { name: "T1", circuit: "Alamo", market_code: "NYC", house_allowance_cents: 80000 }
              as: PlatformAdmin
              captures: { t1id: $.data.id }
            - call: "POST /distributors/${did}/theatres"
              payload: { name: "T2", circuit: "Alamo", market_code: "NYC", house_allowance_cents: 80000 }
              as: PlatformAdmin
              captures: { t2id: $.data.id }
            - call: "POST /distributors/${did}/theatres/${t1id}/screens"
              payload: { auditorium_label: "A1", seat_count: 100, projection_format: "DCP_2K" }
              as: PlatformAdmin
              captures: { s1id: $.data.id }
            - call: "POST /distributors/${did}/theatres/${t2id}/screens"
              payload: { auditorium_label: "A1", seat_count: 100, projection_format: "DCP_2K" }
              as: PlatformAdmin
              captures: { s2id: $.data.id }
            - call: "POST /distributors/${did}/aggregate-deals"
              payload: { film_id: "${fid}", circuit: "Alamo", aggregate_rental_pct: 0.50, min_screens: 2, aggregate_house_allowance_cents: 200000 }
              as: Booker
              captures: { adid: $.data.id }
            - call: "POST /distributors/${did}/booking-agreements"
              payload: { film_id: "${fid}", theatre_id: "${t1id}", screen_id: "${s1id}", opening_date: "2026-05-01T00:00:00Z", min_weeks_committed: 1, week_one_rental_pct: 0.60, rental_decay_per_week: 0.05, floor_pct: 0.30, per_capita_floor_cents: 100, aggregate_deal_id: "${adid}" }
              as: Booker
              captures: { ba1id: $.data.id, ba1_v0: $.data.version }
            - call: "POST /distributors/${did}/booking-agreements"
              payload: { film_id: "${fid}", theatre_id: "${t2id}", screen_id: "${s2id}", opening_date: "2026-05-01T00:00:00Z", min_weeks_committed: 1, week_one_rental_pct: 0.60, rental_decay_per_week: 0.05, floor_pct: 0.30, per_capita_floor_cents: 100, aggregate_deal_id: "${adid}" }
              as: Booker
              captures: { ba2id: $.data.id, ba2_v0: $.data.version }
            - call: "POST /distributors/${did}/booking-agreements/${ba1id}/accept"
              payload: { expected_booking_agreement_version: "${ba1_v0}" }
              as: Exhibitor
            - call: "POST /distributors/${did}/booking-agreements/${ba2id}/accept"
              payload: { expected_booking_agreement_version: "${ba2_v0}" }
              as: Exhibitor
            - call: "POST /distributors/${did}/aggregate-deals/${adid}/activate"
              payload: {}
              as: Booker
            - call: "POST /distributors/${did}/booking-agreements/${ba1id}/box-office-reports"
              payload: { report_date: "2026-05-01T00:00:00Z", gross_cents: 500000, admissions: 2000 }
              as: Exhibitor
              captures: { r1id: $.data.id }
            - call: "POST /distributors/${did}/booking-agreements/${ba1id}/box-office-reports/${r1id}/submit"
              payload: {}
              as: Exhibitor
            - call: "POST /distributors/${did}/booking-agreements/${ba2id}/box-office-reports"
              payload: { report_date: "2026-05-01T00:00:00Z", gross_cents: 500000, admissions: 2000 }
              as: Exhibitor
              captures: { r2id: $.data.id }
            - call: "POST /distributors/${did}/booking-agreements/${ba2id}/box-office-reports/${r2id}/submit"
              payload: {}
              as: Exhibitor
          trigger:
            - call: "GET /distributors/${did}/booking-agreements/${ba1id}/settlements"
              payload: {}
              as: SettlementClerk
              captures: { ba1_prov_house: "$.data[0].house_allowance_cents" }
          assert:
            - "BA1 PROVISIONAL Settlement.house_allowance_cents == 80000 (per-theatre value, aggregate NOT yet split)"
            - "After close_box_office_week, BA1 FINAL Settlement.house_allowance_cents == 100000 (aggregate 200000 split across 2 participating screens)"
            - "BA1 FINAL rental_pct_applied == 0.50 (aggregate override; ignores per-agreement 0.60 and decay)"
            - "BA1 FINAL net_cents == 500000 - 100000 == 400000"
            - "BA1 FINAL distributor_share_cents == round(400000 * 0.50) == 200000"

  # ---------------------------------------------------------------------------
  # Rule 2: combinatorial_formula (≥ 2 instances, different modes a/b/c)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: rental_pct_mode_a_multi_input_conditional_floor_and_aggregate_branch
        grounds:
          - calculations.current_week_rental_pct
          - entities.BookingAgreement.fields.current_week_rental_pct
        distinguishing_aspect: |
          Mode (a): formula with >=3 inputs and non-linear interaction — nested
          max() with conditional branch on AggregateDeal state. Inputs:
          week_one_rental_pct, rental_decay_per_week, weeks_played, floor_pct,
          aggregate_deal_id (nullable), AggregateDeal.deal_status,
          AggregateDeal.aggregate_rental_pct. Conditional branch on
          aggregate_deal status produces different result than the
          floor-capped decay path.
        test_recipe:
          setup:
            - "Distributor D1, Film F1 LIMITED, Theatre T1, Screen S1"
            - "BookingAgreement BA1: pct=0.60, decay=0.05, floor=0.30, min_weeks=6, NO aggregate_deal"
            - "Six Settlements SETTLED (drives weeks_played to 6)"
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "D", territory: "US" }
              as: PlatformAdmin
              captures: { did: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /distributors/${did}/films"
              payload: { title: "F", genre: "NARRATIVE", runtime_minutes: 100, rating: "R", release_pattern: "LIMITED", target_release_date: "2026-05-01T00:00:00Z", min_screens_for_wide: 0 }
              as: Booker
              captures: { fid: $.data.id }
            - call: "POST /distributors/${did}/theatres"
              payload: { name: "T", circuit: "X", market_code: "NYC", house_allowance_cents: 100 }
              as: PlatformAdmin
              captures: { tid: $.data.id }
            - call: "POST /distributors/${did}/theatres/${tid}/screens"
              payload: { auditorium_label: "A", seat_count: 100, projection_format: "DCP_2K" }
              as: PlatformAdmin
              captures: { sid: $.data.id }
            - call: "POST /distributors/${did}/booking-agreements"
              payload: { film_id: "${fid}", theatre_id: "${tid}", screen_id: "${sid}", opening_date: "2026-05-01T00:00:00Z", min_weeks_committed: 6, week_one_rental_pct: 0.60, rental_decay_per_week: 0.05, floor_pct: 0.30, per_capita_floor_cents: 1 }
              as: Booker
              captures: { baid: $.data.id, ba_v0: $.data.version }
            - call: "POST /distributors/${did}/booking-agreements/${baid}/accept"
              payload: { expected_booking_agreement_version: "${ba_v0}" }
              as: Exhibitor
          trigger:
            - call: "GET /distributors/${did}/booking-agreements/${baid}"
              payload: {}
              as: Booker
              captures: { pct_now: $.data.current_week_rental_pct }
          assert:
            - "weeks_played == 0 → current_week_rental_pct == 0.60 (max(0.30, 0.60 - 0.05*0))"
            - "After 1 settle: max(0.30, 0.60 - 0.05*1) = 0.55"
            - "After 6 settles: max(0.30, 0.60 - 0.05*6) = max(0.30, 0.30) = 0.30 (floor hit exactly)"
            - "After 7 settles (hypothetical): max(0.30, 0.60 - 0.35) = max(0.30, 0.25) = 0.30 (floor BINDS, does not dip below)"
            - "If aggregate_deal_id were set to an ACTIVE deal with pct=0.50, current_week_rental_pct would be 0.50 — floor and decay BOTH bypassed"

      - name: marketing_waterfall_mode_b_per_line_rounding_order_pinned
        grounds:
          - calculations.marketing_coop_accrual
          - entities.MarketingCommitment.fields.spent_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order — per-line-then-sum is PINNED.
          Three MarketingCommitments drawn down in created_at ASC; each draw is
          min(remaining, outstanding) computed in integer cents (no rounding
          needed because cents are atomic), then summed. The alternative
          (sum-then-round) would produce a different cents result when
          fractional draws are permitted. The formula explicitly pins
          per-line-then-sum and states why sum-then-round is rejected.
        test_recipe:
          setup:
            - "Distributor D1, Film F1 LIMITED, Market M1, Theatre T1 in M1"
            - "Three MarketingCommitments for (F1, T1): MC1 committed=50000, MC2 committed=80000, MC3 committed=40000 (created in this order)"
            - "BookingAgreement BA1 ACCEPTED, Settlement FINALIZED with marketing_offset_cents=90000"
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "D", territory: "US" }
              as: PlatformAdmin
              captures: { did: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /distributors/${did}/markets"
              payload: { code: "NYC", population_tier: "TIER_1", weekly_coop_budget_cents: 500000 }
              as: PlatformAdmin
              captures: { mid: $.data.id }
            - call: "POST /distributors/${did}/films"
              payload: { title: "F", genre: "NARRATIVE", runtime_minutes: 100, rating: "R", release_pattern: "LIMITED", target_release_date: "2026-05-01T00:00:00Z", min_screens_for_wide: 0 }
              as: Booker
              captures: { fid: $.data.id }
            - call: "POST /distributors/${did}/theatres"
              payload: { name: "T", circuit: "X", market_code: "NYC", house_allowance_cents: 100 }
              as: PlatformAdmin
              captures: { tid: $.data.id }
            - call: "POST /distributors/${did}/markets/${mid}/marketing-commitments"
              payload: { film_id: "${fid}", theatre_id: "${tid}", committed_cents: 50000, coop_share_pct: 0.50 }
              as: MarketingLead
              captures: { mc1id: $.data.id }
            - call: "POST /distributors/${did}/markets/${mid}/marketing-commitments/${mc1id}/commit"
              payload: {}
              as: MarketingLead
            - call: "POST /distributors/${did}/markets/${mid}/marketing-commitments"
              payload: { film_id: "${fid}", theatre_id: "${tid}", committed_cents: 80000, coop_share_pct: 0.50 }
              as: MarketingLead
              captures: { mc2id: $.data.id }
            - call: "POST /distributors/${did}/markets/${mid}/marketing-commitments/${mc2id}/commit"
              payload: {}
              as: MarketingLead
            - call: "POST /distributors/${did}/markets/${mid}/marketing-commitments"
              payload: { film_id: "${fid}", theatre_id: "${tid}", committed_cents: 40000, coop_share_pct: 0.50 }
              as: MarketingLead
              captures: { mc3id: $.data.id }
            - call: "POST /distributors/${did}/markets/${mid}/marketing-commitments/${mc3id}/commit"
              payload: {}
              as: MarketingLead
          trigger:
            - call: "GET /distributors/${did}/markets/${mid}/marketing-commitments/${mc1id}"
              payload: {}
              as: MarketingLead
              captures: { mc1_spent: $.data.spent_cents }
          assert:
            - "After Settlement FINALIZED with marketing_offset=90000:"
            - "MC1.spent_cents == 50000 (fully drawn; outstanding=0)"
            - "MC2.spent_cents == 40000 (partially drawn; outstanding=40000)"
            - "MC3.spent_cents == 0 (untouched — waterfall exhausted before reaching MC3)"
            - "Order is created_at ASC, NOT id order, NOT size order"
            - "Total spent across the three commitments == 90000 (conservation)"

  # ---------------------------------------------------------------------------
  # Rule 3: non_linear_state_machine (≥ 2 instances, different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: booking_agreement_cyclic_proposed_countered_loop
        grounds:
          - state_machines.BookingAgreement.PROPOSED_to_COUNTERED
          - state_machines.BookingAgreement.COUNTERED_to_PROPOSED
          - concurrency_rules[booking-counter-stale-version]
        distinguishing_aspect: |
          BookingAgreement deal axis is CYCLIC: PROPOSED → COUNTERED → PROPOSED
          → COUNTERED → ... for arbitrary negotiation rounds. Each round bumps
          BookingAgreement.version. Distinct entity from the KDMKey instance
          below. Cycle terminates only via accept/decline/cancel.
        test_recipe:
          setup:
            - "Distributor D1, Film F1, Theatre T1, Screen S1"
            - "BookingAgreement BA1 in PROPOSED with version=1"
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "D", territory: "US" }
              as: PlatformAdmin
              captures: { did: $.data.id }
            - call: "POST /distributors/${did}/films"
              payload: { title: "F", genre: "NARRATIVE", runtime_minutes: 90, rating: "R", release_pattern: "LIMITED", target_release_date: "2026-05-08T00:00:00Z", min_screens_for_wide: 0 }
              as: Booker
              captures: { fid: $.data.id }
            - call: "POST /distributors/${did}/theatres"
              payload: { name: "T", circuit: "X", market_code: "NYC", house_allowance_cents: 100 }
              as: PlatformAdmin
              captures: { tid: $.data.id }
            - call: "POST /distributors/${did}/theatres/${tid}/screens"
              payload: { auditorium_label: "A", seat_count: 100, projection_format: "DCP_2K" }
              as: PlatformAdmin
              captures: { sid: $.data.id }
            - call: "POST /distributors/${did}/booking-agreements"
              payload: { film_id: "${fid}", theatre_id: "${tid}", screen_id: "${sid}", opening_date: "2026-05-08T00:00:00Z", min_weeks_committed: 1, week_one_rental_pct: 0.60, rental_decay_per_week: 0.05, floor_pct: 0.30, per_capita_floor_cents: 100 }
              as: Booker
              captures: { baid: $.data.id, ba_v1: $.data.version }
          trigger:
            - call: "POST /distributors/${did}/booking-agreements/${baid}/counter"
              payload: { expected_booking_agreement_version: "${ba_v1}", week_one_rental_pct: 0.50, rental_decay_per_week: 0.04, floor_pct: 0.25, per_capita_floor_cents: 90 }
              as: Exhibitor
              captures: { ba_v2: $.data.version }
            - call: "POST /distributors/${did}/booking-agreements/${baid}/counter"
              payload: { expected_booking_agreement_version: "${ba_v2}", week_one_rental_pct: 0.55, rental_decay_per_week: 0.04, floor_pct: 0.28, per_capita_floor_cents: 95 }
              as: Booker
              captures: { ba_v3: $.data.version }
            - call: "POST /distributors/${did}/booking-agreements/${baid}/counter"
              payload: { expected_booking_agreement_version: "${ba_v3}", week_one_rental_pct: 0.58, rental_decay_per_week: 0.05, floor_pct: 0.30, per_capita_floor_cents: 100 }
              as: Exhibitor
              captures: { ba_v4: $.data.version }
          assert:
            - "After 3 counters, deal_status has toggled PROPOSED → COUNTERED → PROPOSED → COUNTERED"
            - "BookingAgreement.version == 4 (initial 1 + 3 counters)"
            - "Negotiation can loop indefinitely; cycle has no maximum count"
            - "Each loop preserves the cyclic invariant: from PROPOSED only COUNTERED/ACCEPTED/DECLINED/CANCELLED are valid"

      - name: kdm_key_branching_extend_vs_revoke_vs_expire
        grounds:
          - state_machines.KDMKey.ISSUED_to_EXTENDED
          - state_machines.KDMKey.LIVE_to_EXTENDED
          - state_machines.KDMKey.LIVE_to_EXPIRED
          - state_machines.KDMKey.ISSUED_to_REVOKED
        distinguishing_aspect: |
          KDMKey is BRANCHING (fork from ISSUED/LIVE into three divergent
          paths: EXTENDED, EXPIRED, REVOKED) with distinct side-effect sets per
          branch: EXTENDED spawns a superseding KDMKey; EXPIRED is a passive
          time-driven transition with no new entity; REVOKED rolls back
          print_status. Distinct entity from the BookingAgreement instance.
        test_recipe:
          setup:
            - "Full booking pipeline: D1, F1, T1, S1, BA1 ACCEPTED, DCPShipment DELIVERED"
            - "Three separate KDM keys K1, K2, K3 issued on three different bookings (one each) so branches are observable independently"
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "D", territory: "US" }
              as: PlatformAdmin
              captures: { did: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /distributors/${did}/films"
              payload: { title: "F", genre: "NARRATIVE", runtime_minutes: 90, rating: "R", release_pattern: "LIMITED", target_release_date: "2026-05-01T00:00:00Z", min_screens_for_wide: 0 }
              as: Booker
              captures: { fid: $.data.id }
            - call: "POST /distributors/${did}/theatres"
              payload: { name: "T", circuit: "X", market_code: "NYC", house_allowance_cents: 100 }
              as: PlatformAdmin
              captures: { tid: $.data.id }
            - call: "POST /distributors/${did}/theatres/${tid}/screens"
              payload: { auditorium_label: "A1", seat_count: 100, projection_format: "DCP_2K" }
              as: PlatformAdmin
              captures: { s1id: $.data.id }
