            - call: "POST /radio-system/talkgroups"
              payload: { owner_agency_id: "${agency_tlk_id}", home_site_id: "${site_tlk_id}", alias: "TLK-A", tg_decimal_id: 2001, kind: "DISPATCH", encryption_mode: "CLEAR" }
              as: AgencyRadioManager
              as_user_id: "${agency_tlk_id}"
              captures: { tg_tlk_a: "$.data.id" }
            - call: "POST /radio-system/talkgroups"
              payload: { owner_agency_id: "${agency_tlk_id}", home_site_id: "${site_tlk_id}", alias: "TLK-B", tg_decimal_id: 2002, kind: "INTEROP", encryption_mode: "CLEAR" }
              as: AgencyRadioManager
              as_user_id: "${agency_tlk_id}"
              captures: { tg_tlk_b: "$.data.id" }
            - call: "POST /radio-system/talkgroups/${tg_tlk_b}/status"
              payload: { action: "LOCK" }
              as: AgencyRadioManager
              as_user_id: "${agency_tlk_id}"
          trigger:
            - call: "POST /radio-system/interop-patches"
              payload: { source_talkgroup_id: "${tg_tlk_a}", target_talkgroup_id: "${tg_tlk_b}", requesting_agency_id: "${agency_tlk_id}", scheduled_start: "2026-08-01T00:00:00Z", scheduled_end: "2026-08-01T03:00:00Z" }
