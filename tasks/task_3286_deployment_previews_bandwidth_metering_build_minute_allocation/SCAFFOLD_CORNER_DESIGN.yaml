        payload:
          name: Acme
          plan_tier: PRO
        as: PlatformAdmin
        captures:
          team_id: $.data.id
      - call: POST /v1/teams/${team_id}/projects
        payload:
          name: web
          production_branch: main
        as: TeamOwner
        captures:
          project_id: $.data.id
      - call: POST /v1/teams/${team_id}/usage-periods
        payload:
          period_start: '2026-09-01T00:00:00Z'
          period_end: '2026-10-01T00:00:00Z'
        as: TeamBillingManager
      - call: POST /v1/git-events
        payload:
          project_id: ${project_id}
          branch: feat-a
          git_ref: refs/heads/feat-a
          commit_sha: aaa111
          region: IAD
        as: SystemWebhook
        captures:
          d1: $.data.id
      - call: POST /v1/deployments/${d1}/build-start
        payload: {}
        as: SystemWebhook
      - call: POST /v1/deployments/${d1}/build-complete
        payload:
          outcome: SUCCESS
          build_duration_seconds: 120
        as: SystemWebhook
      trigger:
      - call: POST /v1/git-events
        payload:
          project_id: ${project_id}
          branch: feat-b
          git_ref: refs/heads/feat-b
          commit_sha: bbb222
          region: IAD
        as: SystemWebhook
        captures:
          d2: $.data.id
          d2_est: $.data.estimated_build_minutes
      - call: POST /v1/deployments/${d2}/build-start
        payload: {}
        as: SystemWebhook
      - call: POST /v1/deployments/${d2}/build-complete
        payload:
          outcome: SUCCESS
          build_duration_seconds: 120
        as: SystemWebhook
      - call: POST /v1/git-events
        payload:
          project_id: ${project_id}
          branch: feat-c
          git_ref: refs/heads/feat-c
          commit_sha: ccc333
          region: IAD
        as: SystemWebhook
        captures:
          d3: $.data.id
      - call: POST /v1/git-events
        payload:
          project_id: ${project_id}
          branch: feat-d
          git_ref: refs/heads/feat-d
          commit_sha: ddd444
          region: IAD
        as: SystemWebhook
        captures:
          err: $.data.error_id
      assert:
      - Deployment.${d2}.estimated_build_minutes == 2 (from d1 billable 2); admission used(2)+2=4 <= 5 admitted
      - 'after d2 completes: build_minutes_used == 4'
      - 'Deployment.${d3} created: reserved = 4 + estimate(2, from d2 READY) = 6 > 5 -> REJECTED with ERR_BUILD_MINUTES_EXHAUSTED; assert err
        == ERR_BUILD_MINUTES_EXHAUSTED and HTTP 402 on the d3 git-event, and the fourth git-event also fails identically'
