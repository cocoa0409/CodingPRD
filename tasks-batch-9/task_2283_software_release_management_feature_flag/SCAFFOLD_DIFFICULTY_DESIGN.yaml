      - name: canary_evaluation_zero_canary_samples_in_window_is_inconclusive
        grounds:
          - calculations.canary_health_verdict
          - entities.Deployment.fields.min_sample_count
          - entities.CanaryEvaluation.fields.sample_count
          - validations[priority=18]
        distinguishing_aspect: |
          The empty-input-set boundary: sample_count 0 is below min_sample_count 5, so every computed
          field collapses to 0 (not null, not an error) and the verdict is INCONCLUSIVE with
