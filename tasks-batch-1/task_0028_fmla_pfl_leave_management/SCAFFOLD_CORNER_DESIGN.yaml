            - call: "POST /leave/certifications/${cert_id}/mark-complete"
              payload: {}
              as: HRAdmin
            - call: "POST /leave/cases/${case_id}/approve"
              payload: { expected_leave_case_version: "${v_post_elig}" }
              as: HRAdmin
              captures: { case_after_approve: $.data }
          trigger:
            - call: "PATCH /leave/employees/${w_id}/health-enrollment"
              payload: { health_plan_enrolled: false, expected_employee_version: "${w_v0}" }
              as: HRAdmin
            - call: "GET /leave/cases/${case_id}"
              payload: {}
              as: HRAdmin
              captures: { case_after_patch: $.data }
          assert:
            - "case_after_approve.pfl_concurrent == true (stamped at approve)"
            - "case_after_patch.pfl_concurrent == true (still true; the field is pinned at approval and NOT recomputed by subsequent Employee mutations)"
