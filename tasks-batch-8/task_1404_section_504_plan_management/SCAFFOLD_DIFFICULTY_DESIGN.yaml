          setup:
            - "School S1 with student STU; first plan P1 in DRAFT (open)"
            - "A second EligibilityEvaluation E2 determined ELIGIBLE for STU would be needed to draft P2 — but we exercise the simpler rejection: attempt to create P2 while P1 is still DRAFT"
