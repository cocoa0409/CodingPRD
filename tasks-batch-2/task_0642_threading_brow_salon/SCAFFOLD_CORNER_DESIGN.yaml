  - name: queue_position_fifo_ordering
    claim_type: Correct Result
    grounds:
    - calculations.queue_position
    - entities.QueueTicket.fields.position
    distinguishing_aspect: Two WAITING tickets get positions 1 and 2 in join order; after the first is called, the second's position becomes 1.
    test_recipe:
      setup:
      - OPEN salon, two WAITING tickets joined in order A then B
      setup_api_calls:
      - call: POST /salon-svc/salons
        payload:
          name: S
          license_number: LIC-C20
          license_expiry: '2027-01-01T00:00:00Z'
        as: SalonManager
        captures:
          salon_id: $.data.id
          sv0: $.data.version
      - call: POST /salon-svc/salons/${salon_id}/open
        payload:
          expected_salon_version: ${sv0}
        as: SalonManager
      - call: POST /salon-svc/service-menu-items
        payload:
          salon_id: ${salon_id}
          code: BROW_THREAD
          name: Threading
          base_price_cents: 2000
          est_minutes: 15
        as: SalonManager
        captures:
          svc_id: $.data.id
      - call: POST /salon-svc/members
        payload:
          salon_id: ${salon_id}
          full_name: A
          phone: 555-C020
        as: FrontDeskAgent
        captures:
          mA: $.data.id
      - call: POST /salon-svc/members
        payload:
          salon_id: ${salon_id}
          full_name: B
          phone: 555-C021
        as: FrontDeskAgent
        captures:
          mB: $.data.id
      - call: POST /salon-svc/queue-tickets
        payload:
          salon_id: ${salon_id}
          member_id: ${mA}
          service_menu_item_id: ${svc_id}
        as: FrontDeskAgent
        captures:
          tA: $.data.id
      - call: POST /salon-svc/queue-tickets
        payload:
          salon_id: ${salon_id}
          member_id: ${mB}
          service_menu_item_id: ${svc_id}
        as: FrontDeskAgent
        captures:
          tB: $.data.id
      trigger:
      - call: POST /salon-svc/queue-tickets/${tA}/call
        payload: {}
        as: FrontDeskAgent
      assert:
      - QueueTicket.${tB}.position == 1
      - QueueTicket.${tA}.position == 0
