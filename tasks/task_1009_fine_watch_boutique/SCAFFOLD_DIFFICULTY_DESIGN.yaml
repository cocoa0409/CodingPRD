# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_1009_fine_watch_boutique — 9 rule_ids x 2 instances = 18 instances.
# Every ${var} traces to an earlier captures:; every literal pre-computed.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: appraisal_market_vs_insurance_replacement
        grounds:
          - calculations.appraisal_valuation
          - entities.Appraisal.fields.appraised_value_cents
          - entities.Appraisal.fields.market_value_cents
          - entities.Appraisal.fields.replacement_value_cents
        distinguishing_aspect: |
          Same watch: MARKET valuation (condition-adjusted, DEPRECIATED) = 950400 while
          INSURANCE_REPLACEMENT (retail MSRP + scarcity, condition-ignored) = 1250000 — the two
          algorithms operate on the Watch/Appraisal domain and diverge (market < replacement).
        test_recipe:
          setup:
            - "WatchModel msrp_cents=1000000, market_premium_bps=2500."
            - "Watch of that model, condition EXCELLENT (factor 0.88), has_box_papers=true (premium 0.08), version 1."
          setup_api_calls:
            - call: "POST /watch-models"
              payload: { brand: "Rolex", reference_number: "126610LN", display_name: "Submariner Date", msrp_cents: 1000000, market_premium_bps: 2500 }
              as: Associate
              captures: { model_id: $.data.id }
            - call: "POST /watches"
              payload: { model_id: "${model_id}", serial_number: "SUB-0001", condition_grade: "EXCELLENT", list_price_cents: 1200000, has_box_papers: true }
              as: Associate
              captures: { watch_id: $.data.id, watch_v: $.data.version }
          trigger:
            - call: "POST /watches/${watch_id}/appraisals"
              payload: { purpose: "SALE", valuation_basis: "MARKET", expected_watch_version: "${watch_v}" }
              as: Associate
              captures: { ap_id: $.data.id, mkt: $.data.market_value_cents, repl: $.data.replacement_value_cents, appr: $.data.appraised_value_cents }
          assert:
            - "Appraisal.market_value_cents == 950400"
            - "Appraisal.replacement_value_cents == 1250000"
            - "Appraisal.appraised_value_cents == 950400"
            - "Appraisal.market_value_cents != Appraisal.replacement_value_cents"

      - name: tradein_vs_consignment_credit
        grounds:
          - calculations.trade_in_valuation
          - entities.TradeInOffer.fields.quoted_credit_cents
          - entities.TradeInOffer.fields.commission_rate_bps
          - entities.Customer.fields.store_credit_cents
        distinguishing_aspect: |
          Same incoming piece: TRADE_IN pays a flat 70% of appraised market (665280) while
          CONSIGNMENT pays market minus a tiered 15% commission (807840) — dual-variant on the
          TradeInOffer/store-credit domain (a DIFFERENT entity domain than the Watch appraisal),
          consignment yielding more.
        test_recipe:
          setup:
            - "One Customer with store_credit_cents=0."
            - "Two offers for an identical piece (est_model_msrp_cents=1000000, EXCELLENT, box+papers), one TRADE_IN one CONSIGNMENT."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Bob Vane", email: "bob@x.com" }
              as: Associate
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /trade-in-offers"
              payload: { customer_id: "${cust_id}", incoming_brand: "Rolex", incoming_reference: "126610LN", serial_number: "TI-1", est_model_msrp_cents: 1000000, condition_grade: "EXCELLENT", disposition: "TRADE_IN", has_box_papers: true }
              as: Associate
              captures: { ti_id: $.data.id, ti_market: $.data.appraised_market_cents, ti_credit: $.data.quoted_credit_cents }
            - call: "POST /trade-in-offers"
              payload: { customer_id: "${cust_id}", incoming_brand: "Rolex", incoming_reference: "126610LN", serial_number: "TI-2", est_model_msrp_cents: 1000000, condition_grade: "EXCELLENT", disposition: "CONSIGNMENT", has_box_papers: true }
              as: Associate
              captures: { cons_id: $.data.id, cons_rate: $.data.commission_rate_bps, cons_credit: $.data.quoted_credit_cents }
          assert:
            - "TradeInOffer(TI-1 TRADE_IN).appraised_market_cents == 950400"
            - "TradeInOffer(TI-1 TRADE_IN).quoted_credit_cents == 665280"
            - "TradeInOffer(TI-2 CONSIGNMENT).commission_rate_bps == 1500"
            - "TradeInOffer(TI-2 CONSIGNMENT).quoted_credit_cents == 807840"
            - "CONSIGNMENT credit 807840 > TRADE_IN credit 665280 for the identical piece"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: service_quote_nonlinear_labor_complication_water
        grounds:
          - calculations.service_quote
          - state_machines.ServiceTicket.RECEIVED_to_DIAGNOSED
          - entities.ServiceTicket.fields.quoted_cents
        distinguishing_aspect: |
          MODE (a): quote = BASE_LABOR[MOVEMENT_OVERHAUL]=60000 * COMPLICATION_MULT[GRAND_COMPLICATION]=2.5
          + parts 15000, then clamped into [12000,500000] -> 165000; >=3 inputs with a multiplicative
          interaction, a conditional water branch, and nested min/max.
        test_recipe:
          setup:
            - "Authenticated IN_STOCK watch, a watchmaker, a customer; a ServiceTicket in RECEIVED with a GRAND_COMPLICATION MOVEMENT_OVERHAUL and parts_cost_cents=15000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T00:00:00Z" }
              as: Associate
            - call: "POST /customers"
              payload: { full_name: "Cara Ng", email: "cara@x.com" }
              as: Associate
              captures: { cust_id: $.data.id }
            - call: "POST /watch-models"
              payload: { brand: "Omega", reference_number: "311.30", display_name: "Speedmaster", msrp_cents: 700000 }
              as: Associate
              captures: { model_id: $.data.id }
            - call: "POST /watches"
              payload: { model_id: "${model_id}", serial_number: "SVC-1", condition_grade: "MINT", list_price_cents: 750000 }
              as: Associate
              captures: { watch_id: $.data.id }
            - call: "POST /watches/${watch_id}/authenticate"
              payload: {}
              as: Associate
            - call: "POST /watchmakers"
              payload: { display_name: "Master Bench" }
              as: Associate
              captures: { wm_id: $.data.id }
            - call: "POST /service-tickets"
              payload: { watch_id: "${watch_id}", customer_id: "${cust_id}", watchmaker_id: "${wm_id}", service_type: "MOVEMENT_OVERHAUL", movement_complexity: "GRAND_COMPLICATION", parts_cost_cents: 15000, appt_start: "2026-07-03T10:00:00Z", appt_end: "2026-07-03T12:00:00Z" }
              as: Associate
              captures: { ticket_id: $.data.id }
          trigger:
            - call: "POST /service-tickets/${ticket_id}/diagnose"
              payload: {}
              as: Watchmaker
              as_user_id: "${wm_id}"
              captures: { q: $.data.quoted_cents }
          assert:
            - "ServiceTicket.quoted_cents == 165000"

      - name: layaway_installment_rounding_order
        grounds:
          - calculations.layaway_installment_schedule
          - entities.LayawayPlan.fields.per_installment_cents
          - entities.LayawayPlan.fields.final_installment_cents
        distinguishing_aspect: |
          MODE (b): financed=750000 over 7 months. Rounding order is pinned to floor-per-installment
          (107142) with the FINAL installment absorbing the remainder (107148); the naive
          round(750000/7)=107143 then *7=750001 would NOT reconcile — order determines the cents.
        test_recipe:
          setup:
            - "Authenticated IN_STOCK watch priced 1000000; a customer; a layaway with deposit 250000 over 7 months."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Dan Roe", email: "dan@x.com" }
              as: Associate
              captures: { cust_id: $.data.id }
            - call: "POST /watch-models"
              payload: { brand: "Rolex", reference_number: "124300", display_name: "OP41", msrp_cents: 900000 }
              as: Associate
              captures: { model_id: $.data.id }
            - call: "POST /watches"
              payload: { model_id: "${model_id}", serial_number: "LAY-1", condition_grade: "NEW", list_price_cents: 1000000 }
              as: Associate
              captures: { watch_id: $.data.id }
            - call: "POST /watches/${watch_id}/authenticate"
              payload: {}
              as: Associate
          trigger:
            - call: "POST /layaway-plans"
              payload: { customer_id: "${cust_id}", watch_id: "${watch_id}", deposit_cents: 250000, term_months: 7, first_due_at: "2026-08-01T00:00:00Z" }
              as: Associate
              captures: { plan_id: $.data.id, per: $.data.per_installment_cents, fin: $.data.final_installment_cents, tot: $.data.total_price_cents }
          assert:
            - "LayawayPlan.total_price_cents == 1000000"
            - "LayawayPlan.per_installment_cents == 107142"
            - "LayawayPlan.final_installment_cents == 107148"
            - "LayawayPlan.per_installment_cents * 6 + LayawayPlan.final_installment_cents == 750000"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: service_ticket_parallel_status_payment
        grounds:
          - state_machines.ServiceTicket.DIAGNOSED_to_READY
          - state_machines.ServiceTicket.READY_to_COLLECTED
          - entities.ServiceTicket.fields.payment_status
          - entities.ServiceTicket.fields.status
        distinguishing_aspect: |
          On ONE ServiceTicket the workflow dimension (RECEIVED->DIAGNOSED->READY) advances
          independently of the payment dimension (UNPAID->PAID); collect is gated on BOTH, so a
          READY+UNPAID ticket is rejected until paid — parallel state dimensions on one entity.
        test_recipe:
          setup:
            - "Ticket diagnosed (quoted 12000) and finished (READY) while payment_status is still UNPAID."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T00:00:00Z" }
              as: Associate
            - call: "POST /customers"
              payload: { full_name: "Eve Li", email: "eve@x.com" }
              as: Associate
              captures: { cust_id: $.data.id }
            - call: "POST /watch-models"
              payload: { brand: "Tissot", reference_number: "T137", display_name: "PRX", msrp_cents: 60000 }
              as: Associate
              captures: { model_id: $.data.id }
            - call: "POST /watches"
              payload: { model_id: "${model_id}", serial_number: "SVC-2", condition_grade: "GOOD", list_price_cents: 60000 }
              as: Associate
              captures: { watch_id: $.data.id }
            - call: "POST /watches/${watch_id}/authenticate"
              payload: {}
              as: Associate
            - call: "POST /watchmakers"
              payload: { display_name: "Bench Two" }
              as: Associate
              captures: { wm_id: $.data.id }
            - call: "POST /service-tickets"
              payload: { watch_id: "${watch_id}", customer_id: "${cust_id}", watchmaker_id: "${wm_id}", service_type: "BATTERY", appt_start: "2026-07-03T09:00:00Z", appt_end: "2026-07-03T09:30:00Z" }
              as: Associate
              captures: { ticket_id: $.data.id }
            - call: "POST /service-tickets/${ticket_id}/diagnose"
              payload: {}
              as: Watchmaker
              as_user_id: "${wm_id}"
            - call: "POST /service-tickets/${ticket_id}/finish"
              payload: {}
              as: Watchmaker
              as_user_id: "${wm_id}"
          trigger:
            - call: "POST /service-tickets/${ticket_id}/collect"
              payload: {}
              as: Associate
              captures: { blocked_err: $.data.error_id }
            - call: "POST /service-tickets/${ticket_id}/payments"
              payload: { amount_cents: 12000 }
              as: Associate
              captures: { pstatus: $.data.payment_status }
            - call: "POST /service-tickets/${ticket_id}/collect"
              payload: {}
              as: Associate
              captures: { fstatus: $.data.status }
          assert:
            - "First collect (status READY, payment_status UNPAID) returns ERR_PAYMENT_NOT_COMPLETE"
            - "ServiceTicket.quoted_cents == 12000"
            - "After the 12000 payment ServiceTicket.payment_status == PAID"
            - "Second collect: ServiceTicket.status == COLLECTED"

      - name: watch_parallel_status_authentication
        grounds:
          - state_machines.Watch.UNVERIFIED_to_AUTHENTICATED
          - state_machines.Watch.IN_STOCK_to_IN_SERVICE
          - entities.Watch.fields.status
          - entities.Watch.fields.authentication_status
        distinguishing_aspect: |
          Watch carries two independent dimensions: authentication_status (UNVERIFIED->AUTHENTICATED)
          and status (IN_STOCK->IN_SERVICE). Authenticating leaves status IN_STOCK; opening service
          leaves authentication_status AUTHENTICATED — orthogonal parallel machines on one entity
          (a DIFFERENT entity than the ServiceTicket instance above).
        test_recipe:
          setup:
            - "A freshly-created watch (IN_STOCK, UNVERIFIED), a customer and a watchmaker for the service step."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T00:00:00Z" }
              as: Associate
            - call: "POST /customers"
              payload: { full_name: "Finn Ho", email: "finn@x.com" }
              as: Associate
              captures: { cust_id: $.data.id }
            - call: "POST /watch-models"
              payload: { brand: "Grand Seiko", reference_number: "SBGA211", display_name: "Snowflake", msrp_cents: 550000 }
              as: Associate
              captures: { model_id: $.data.id }
            - call: "POST /watches"
              payload: { model_id: "${model_id}", serial_number: "GS-1", condition_grade: "NEW", list_price_cents: 600000 }
              as: Associate
              captures: { watch_id: $.data.id, s0: $.data.status, a0: $.data.authentication_status }
            - call: "POST /watchmakers"
              payload: { display_name: "Bench Three" }
              as: Associate
              captures: { wm_id: $.data.id }
          trigger:
            - call: "POST /watches/${watch_id}/authenticate"
              payload: {}
              as: Associate
              captures: { a1: $.data.authentication_status, s1: $.data.status }
            - call: "POST /service-tickets"
              payload: { watch_id: "${watch_id}", customer_id: "${cust_id}", watchmaker_id: "${wm_id}", service_type: "BATTERY", appt_start: "2026-07-03T09:00:00Z", appt_end: "2026-07-03T09:30:00Z" }
              as: Associate
              captures: { ticket_id: $.data.id }
            - call: "GET /watches/${watch_id}"
              payload: {}
              as: Associate
              captures: { s2: $.data.status, a2: $.data.authentication_status }
          assert:
            - "On create: Watch.status == IN_STOCK and Watch.authentication_status == UNVERIFIED"
            - "After authenticate: Watch.authentication_status == AUTHENTICATED and Watch.status == IN_STOCK (unchanged)"
            - "After service open: Watch.status == IN_SERVICE and Watch.authentication_status == AUTHENTICATED (unchanged)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: layaway_default_frees_watch_then_autooffer
        grounds:
          - state_machines.LayawayPlan.ACTIVE_to_DEFAULTED
          - state_machines.Watch.RESERVED_to_IN_STOCK
          - state_machines.WaitlistEntry.WAITING_to_OFFERED
        distinguishing_aspect: |
          DEPTH 3, trigger=default: default sets LayawayPlan DEFAULTED (hop1); that itself frees the
          reserved Watch RESERVED->IN_STOCK (hop2, caused by the plan leaving ACTIVE); that freeing
          in turn auto-offers the watch to the top eligible WaitlistEntry WAITING->OFFERED (hop3,
          caused by the watch becoming available on an allocation_controlled model).
        test_recipe:
          setup:
            - "allocation_controlled model M; Alice holds an ACTIVE layaway reserving watch W (list 500000, deposit 100000, first_due 2026-07-05); Bea holds a WAITING VIP waitlist entry for M; clock advanced past first_due+10d."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T00:00:00Z" }
              as: Associate
            - call: "POST /customers"
              payload: { full_name: "Alice Ba", email: "alice@x.com" }
              as: Associate
              captures: { a_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Bea Cy", email: "bea@x.com" }
              as: Associate
              captures: { b_id: $.data.id }
            - call: "POST /watch-models"
              payload: { brand: "Rolex", reference_number: "126500LN", display_name: "Daytona", msrp_cents: 1500000, allocation_controlled: true }
              as: Associate
              captures: { model_id: $.data.id }
            - call: "POST /watches"
              payload: { model_id: "${model_id}", serial_number: "DAY-1", condition_grade: "NEW", list_price_cents: 500000 }
              as: Associate
              captures: { watch_id: $.data.id }
            - call: "POST /watches/${watch_id}/authenticate"
              payload: {}
              as: Associate
            - call: "POST /layaway-plans"
              payload: { customer_id: "${a_id}", watch_id: "${watch_id}", deposit_cents: 100000, term_months: 5, first_due_at: "2026-07-05T00:00:00Z" }
              as: Associate
              captures: { plan_id: $.data.id }
            - call: "POST /waitlist-entries"
              payload: { customer_id: "${b_id}", model_id: "${model_id}", priority_tier: "VIP", deposit_cents: 50000 }
              as: Associate
              captures: { wl_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-16T00:00:00Z" }
              as: Associate
          trigger:
            - call: "POST /layaway-plans/${plan_id}/default"
              payload: {}
              as: Associate
              captures: { plan_status: $.data.status }
          assert:
            - "LayawayPlan.${plan_id}.status == DEFAULTED (hop1)"
            - "Watch.${watch_id}.status == OFFERED (hop2 freed to IN_STOCK, then hop3 re-offered)"
            - "WaitlistEntry.${wl_id}.status == OFFERED"
            - "WaitlistEntry.${wl_id}.allocated_watch_id == ${watch_id} (hop3 auto-offer landed on Bea)"

      - name: flag_inauthentic_voids_active_layaway
        grounds:
          - state_machines.Watch.AUTHENTICATED_to_FLAGGED
          - state_machines.LayawayPlan.ACTIVE_to_VOIDED
          - entities.Customer.fields.store_credit_cents
        distinguishing_aspect: |
          DEPTH 2, trigger=flag-inauthentic (a DIFFERENT trigger than default): flag sets Watch FLAGGED
          (hop1); that itself voids the ACTIVE LayawayPlan on that watch ACTIVE->VOIDED and refunds
          paid_cents=80000 to Customer.store_credit_cents (hop2, caused by the flagging).
        test_recipe:
          setup:
            - "Customer Cal; authenticated watch W (list 400000) reserved by an ACTIVE layaway with deposit 80000 (paid_cents=80000)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Cal Vo", email: "cal@x.com" }
              as: Associate
              captures: { c_id: $.data.id }
            - call: "POST /watch-models"
              payload: { brand: "Tudor", reference_number: "79030N", display_name: "Black Bay 58", msrp_cents: 400000 }
              as: Associate
              captures: { model_id: $.data.id }
            - call: "POST /watches"
              payload: { model_id: "${model_id}", serial_number: "BB-1", condition_grade: "NEW", list_price_cents: 400000 }
              as: Associate
              captures: { watch_id: $.data.id }
            - call: "POST /watches/${watch_id}/authenticate"
              payload: {}
              as: Associate
            - call: "POST /layaway-plans"
              payload: { customer_id: "${c_id}", watch_id: "${watch_id}", deposit_cents: 80000, term_months: 4, first_due_at: "2026-08-01T00:00:00Z" }
              as: Associate
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /watches/${watch_id}/flag-inauthentic"
              payload: { reason: "serial does not match maker records" }
              as: Associate
              captures: { auth: $.data.authentication_status }
          assert:
            - "Watch.${watch_id}.authentication_status == FLAGGED (hop1)"
            - "LayawayPlan.${plan_id}.status == VOIDED (hop2)"
            - "Customer.${c_id}.store_credit_cents == 80000 (full refund of paid_cents on void)"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: defaulted_plan_overpayment_state_beats_fiscal
        grounds:
          - validations[priority=7]
          - validations[priority=19]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_OVERPAYMENT]
        distinguishing_aspect: |
          A payment on a DEFAULTED plan whose amount also exceeds the remaining balance violates
          priority-7 (category state, ERR_INVALID_STATE) and priority-19 (category business_fiscal,
          ERR_OVERPAYMENT); the state check (lower priority number) wins -> ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "A DEFAULTED layaway plan (total 300000, paid 60000, remaining 240000) on a non-allocation model."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T00:00:00Z" }
              as: Associate
            - call: "POST /customers"
              payload: { full_name: "Gil Ma", email: "gil@x.com" }
              as: Associate
              captures: { cust_id: $.data.id }
            - call: "POST /watch-models"
              payload: { brand: "Longines", reference_number: "L2", display_name: "Spirit", msrp_cents: 280000 }
              as: Associate
              captures: { model_id: $.data.id }
            - call: "POST /watches"
              payload: { model_id: "${model_id}", serial_number: "LG-1", condition_grade: "NEW", list_price_cents: 300000 }
              as: Associate
              captures: { watch_id: $.data.id }
            - call: "POST /watches/${watch_id}/authenticate"
              payload: {}
              as: Associate
            - call: "POST /layaway-plans"
              payload: { customer_id: "${cust_id}", watch_id: "${watch_id}", deposit_cents: 60000, term_months: 3, first_due_at: "2026-07-05T00:00:00Z" }
              as: Associate
              captures: { plan_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-16T00:00:00Z" }
              as: Associate
            - call: "POST /layaway-plans/${plan_id}/default"
              payload: {}
              as: Associate
          trigger:
            - call: "POST /layaway-plans/${plan_id}/payments"
              payload: { amount_cents: 999999 }
              as: Associate
              captures: { err: $.data.error_id }
          assert:
            - "Payment returns ERR_INVALID_STATE (state, priority 7), NOT ERR_OVERPAYMENT (business_fiscal, priority 19)"

      - name: flagged_watch_and_bench_conflict_safety_beats_temporal
        grounds:
          - validations[priority=10]
          - validations[priority=12]
          - errors[ERR_WATCH_NOT_AUTHENTICATED]
          - errors[ERR_WATCHMAKER_UNAVAILABLE]
        distinguishing_aspect: |
          Opening a service ticket on an UNVERIFIED watch whose requested bench slot ALSO collides
          with an existing appointment violates priority-10 (category business_safety,
          ERR_WATCH_NOT_AUTHENTICATED) and priority-12 (category business_temporal,
          ERR_WATCHMAKER_UNAVAILABLE); safety wins -> ERR_WATCH_NOT_AUTHENTICATED. Different
          error-category pair than the state/fiscal conflict above.
        test_recipe:
          setup:
            - "Watchmaker WM with an existing ticket occupying 10:00-12:00 on 2026-07-03 (authenticated watch W1); a second watch W2 left UNVERIFIED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T00:00:00Z" }
              as: Associate
            - call: "POST /customers"
              payload: { full_name: "Hana Ito", email: "hana@x.com" }
              as: Associate
              captures: { cust_id: $.data.id }
            - call: "POST /watch-models"
              payload: { brand: "IWC", reference_number: "IW3", display_name: "Mark XX", msrp_cents: 550000 }
              as: Associate
              captures: { model_id: $.data.id }
            - call: "POST /watches"
              payload: { model_id: "${model_id}", serial_number: "IWC-1", condition_grade: "NEW", list_price_cents: 550000 }
              as: Associate
