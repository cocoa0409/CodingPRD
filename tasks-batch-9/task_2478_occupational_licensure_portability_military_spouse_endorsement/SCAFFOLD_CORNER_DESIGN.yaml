      - name: deficiency_loop_cap_terminates_the_cycle
        claim_type: cyclic
        grounds:
          - state_machines.LicenseApplication.UNDER_REVIEW_to_DEFICIENT
          - state_machines.LicenseApplication.DEFICIENT_to_UNDER_REVIEW
        excluded_because:
          difficulty_instance: non_linear_state_machine / deficiency_cycle_cap_third_deficiency_denies_instead_of_looping
          rationale: "The cyclic shape's loop-termination claim is the whole subject of that §1.8 instance, which drives two full deficiency/cure cycles and asserts the DENIED branch on the third."

      - name: disciplinary_cascade_down_to_permits_and_ledger
        claim_type: Cascade down
        grounds:
          - state_machines.LicenseApplication.UNDER_REVIEW_to_SUSPENDED_REVIEW
          - state_machines.TemporaryPermit.ACTIVE_to_REVOKED
        excluded_because:
          difficulty_instance: transitive_cascade / disciplinary_post_cascades_flag_to_suspension_to_permit_revocation_to_ledger
          rationale: "That §1.8 instance asserts every hop of the cascade, including the non-terminal-children scoping and the ledger reconciliation."

      - name: approval_cross_entity_license_mint_and_permit_conversion
        claim_type: Cross-entity
        grounds:
          - state_machines.LicenseApplication.UNDER_REVIEW_to_APPROVED
          - state_machines.TemporaryPermit.ACTIVE_to_CONVERTED
        excluded_because:
          difficulty_instance: transitive_cascade / approval_cascades_license_mint_to_permit_conversion_to_conversion_credit
          rationale: "That §1.8 instance asserts the minted License, the converted permit and the pro-rated CONVERSION_CREDIT in one chain."

      - name: permit_revocation_compensation_reverses_original_side_effect
        claim_type: Compensation
        grounds:
          - state_machines.TemporaryPermit.ACTIVE_to_REVOKED
          - calculations.application_fee_balance
        excluded_because:
          difficulty_instance: compensating_invariant / permit_revocation_restores_fee_balance_cents_exactly
          rationale: "The compensation pattern's no-drift claim is asserted there over the full five-row ledger."

      - name: credit_award_revocation_ledger_sync_to_application_hours
        claim_type: Ledger sync
        grounds:
          - state_machines.CreditAward.AWARDED_to_REVOKED
          - entities.LicenseApplication.fields.requirement_hours_satisfied
        excluded_because:
          difficulty_instance: compensating_invariant / credit_award_revocation_conserves_requirement_hours_total
          rationale: "That §1.8 instance reconciles the ancestor's derived hour fields before and after the revocation."

      - name: suspended_review_reentry_guarded_by_evaluation_existence
        claim_type: guarded transitions
        grounds:
