              as: Recruiter
              captures: { pl_id: $.data.id }
            - call: "PATCH /staffing/placements/${pl_id}"
              payload: { target_assignment_status: "ACTIVE" }
              as: Recruiter
          trigger:
            - call: "PATCH /staffing/placements/${pl_id}"
              payload: { target_assignment_status: "ENDED" }
              as: Recruiter
          assert:
            - "JobOrder.${jo_id}.filled_count == 0 (back to baseline after place+end)"
            - "JobOrder.${jo_id}.status == OPEN (re-opened, no drift)"
            - "Candidate.${cand_id}.status == AVAILABLE (freed, no drift)"

      - name: invoice_void_conserves_outstanding_balance
        grounds:
          - state_machines.Invoice.DRAFT_to_ISSUED
          - state_machines.Invoice.ISSUED_to_VOID
