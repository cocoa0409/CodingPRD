              as: BoardMember
              as_user_id: "board-1"
              captures: { err_missing: $.data.error_id }
          assert:
            - "the PlanAdministrator call returns HTTP 403 with error_id ERR_ROLE_NOT_PERMITTED (PlanAdministrator is not in the endpoint's roles)"
            - "the BoardMember call returns HTTP 404 with error_id ERR_GRANT_NOT_FOUND"
            - "no Grant row is created by either call"

      - name: participant_scope_violation_reading_another_participant
        claim_type: violation_to_error
        grounds:
          - validations[priority=15]
          - errors[ERR_PARTICIPANT_SCOPE_VIOLATION]
          - roles.Participant
          - endpoints[GET /participants/{id}]
        distinguishing_aspect: |
          The Participant role is listed on GET /participants/{id}, so priority 10 passes and
          priority 15 is what refuses the request: reading a peer's row yields
          ERR_PARTICIPANT_SCOPE_VIOLATION (403) while reading one's own row - the same endpoint
          and role - returns 200.
        test_recipe:
          setup:
            - "Logical clock 2026-01-05T09:00:00Z; two ACTIVE participants whose ids are their X-User-ID values."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T09:00:00Z" }
              as: PlanAdministrator
              as_user_id: "admin-1"
            - call: "POST /participants"
              payload: { full_name: "Self Reader", employee_number: "E-C-360", home_country_code: "US", home_state_code: "CA", hire_date: "2020-01-06", birth_date: "1992-12-12" }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { p1_id: $.data.id }
            - call: "POST /participants"
              payload: { full_name: "Peer Row", employee_number: "E-C-361", home_country_code: "US", home_state_code: "CA", hire_date: "2020-01-06", birth_date: "1993-01-13" }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { p2_id: $.data.id }
          trigger:
            - call: "GET /participants/${p2_id}"
              payload: {}
              as: Participant
              as_user_id: "${p1_id}"
              captures: { err: $.data.error_id }
            - call: "GET /participants/${p1_id}"
              payload: {}
              as: Participant
              as_user_id: "${p1_id}"
          assert:
            - "the peer read returns HTTP 403 with error_id ERR_PARTICIPANT_SCOPE_VIOLATION, not 404"
            - "the self read returns HTTP 200 with id == \"${p1_id}\" and full_name == \"Self Reader\""
            - "no participant row is mutated by either call (version stays 1)"

      - name: mobility_assignment_period_overlap_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=58]
          - errors[ERR_ASSIGNMENT_PERIOD_OVERLAP]
          - entities.MobilityAssignment.fields.start_date
          - entities.MobilityAssignment.fields.end_date
        excluded_because:
          difficulty_instance: inclusive_exclusive_boundary / mobility_assignment_inclusive_date_overlap
          rationale: "The named 1.8 instance already drives the inclusive-endpoint semantics of this rule: a second assignment starting exactly on the first one's end_date is refused with ERR_ASSIGNMENT_PERIOD_OVERLAP while one starting the next day is accepted, which subsumes any plain overlap case."

  # ===========================================================================
  - section: endpoints
