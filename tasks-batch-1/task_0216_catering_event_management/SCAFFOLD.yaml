        default: null
      - name: event_start
        type: datetime
        source: input
        description: "ISO 8601 UTC start of the catered event."
      - name: event_end
        type: datetime
        source: input
        description: "ISO 8601 UTC end of the catered event; must be after event_start."
      - name: locked_package_version
        type: integer
