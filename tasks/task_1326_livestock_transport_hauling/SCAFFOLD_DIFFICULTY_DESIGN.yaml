  - rule_id: compensating_invariant
    instances:
      - name: compartment_capacity_allocate_release_roundtrip_invariant
        grounds:
          - calculations.allocation_weight_and_load_totals
          - state_machines.CompartmentAllocation.ACTIVE_to_RELEASED
          - entities.TrailerCompartment.fields.occupied_head_count
          - concurrency_rules[occ-load-plan-release]
        distinguishing_aspect: |
          Conserved quantity: compartment capacity units. The forward action
          (allocate 6 head / 12000 lb) paired with its compensating action (release)
          MUST restore occupied_head_count == 0 and occupied_weight_lb == 0 exactly,
          with Load totals back to 0 and Load.version advanced by exactly 2.
        test_recipe:
          setup:
            - "Shipper, trailer with compartment c1 (10 head / 20000 lb), DRAFT load 40/40000 (version 1)"
          setup_api_calls:
            - { call: "POST /haul/shippers", payload: { name: "Ranchco", contact_email: "r@x.com" }, as: CarrierAdmin, captures: { sh: $.data.id } }
            - { call: "POST /haul/trailers", payload: { trailer_no: "T-19", max_gross_weight_lb: 50000, compartments: [ { compartment_index: 1, max_head_count: 10, max_weight_lb: 20000 } ] }, as: CarrierAdmin, captures: { tr: $.data.id } }
            - { call: "GET /haul/trailers/${tr}/compartments", as: Any, captures: { c1: "$.data[0].id" } }
            - { call: "POST /haul/loads", payload: { shipper_id: "${sh}", species: "CATTLE", declared_head_count: 40, declared_weight_lb: 40000, origin: "A", destination: "B", planned_departure_at: "2026-08-02T08:00:00Z", planned_duration_hours: 10, rate_per_loaded_mile_cents: 300, loaded_miles: 500 }, as: Dispatcher, captures: { ld: $.data.id, ld_v: $.data.version } }
            - { call: "POST /haul/loads/${ld}/allocations", payload: { trailer_compartment_id: "${c1}", head_count: 6, avg_weight_lb: 2000, expected_load_version: "${ld_v}" }, as: Dispatcher, captures: { al: $.data.id } }
            - { call: "GET /haul/loads/${ld}", as: Any, captures: { ld_v2: $.data.version } }
          trigger:
            - { call: "POST /haul/allocations/${al}/release", payload: { expected_load_version: "${ld_v2}" }, as: Dispatcher }
          assert:
            - "TrailerCompartment.${c1}.occupied_head_count == 0 and occupied_weight_lb == 0 (invariant restored)"
            - "Load.${ld}.allocated_head_count == 0 and allocated_weight_lb == 0"
            - "Load.${ld}.version == 3 (exactly +2 over create: one for allocate, one for release)"
            - "CompartmentAllocation.${al}.status == RELEASED and release_reason == REPLANNED"

      - name: settlement_dispute_roundtrip_preserves_money_identity
        grounds:
          - calculations.final_settlement
          - state_machines.Settlement.PENDING_to_DISPUTED
          - state_machines.Settlement.DISPUTED_to_COUNTERED
          - state_machines.Settlement.COUNTERED_to_RESOLVED
          - concurrency_rules[occ-settlement-counter]
        distinguishing_aspect: |
          Conserved quantity: money (cents), a different quantity type from capacity
          units. A dispute -> counter -> accept-counter round-trip whose countered
          weight equals the scale ticket weight (38800 lb) MUST leave
          final_amount_cents == 149000 unchanged, preserving the identity
          final == provisional - shrink_penalty - welfare_deduction + dispute_adjustment
          (150000 - 1000 - 0 + 0).
        test_recipe:
          setup:
            - "Standard load delivered 2026-08-02T16:30 at net 38800 lb; settlement PENDING with final 149000 (provisional 150000, excess shrink 400 lb, penalty 1000); clock 2026-08-03T10:00 (inside dispute window)"
