            - call: "POST /assignments/${asb}/respond"
              payload: { outcome: "ACCEPT" }
              as: Subcontractor
              as_user_id: "${se}"
          trigger:
            - call: "PATCH /subcontractors/${se}"
              payload: { status: "SUSPENDED" }
