            - "OPEN_CLOSE on a cycle with no milestones returns 409 ERR_MILESTONE_MISSING, and the readiness read confirms it: ${missing_kinds} == [CLOSE, REVIEW, FILING] in MILESTONE_ORDER sequence, with CERTIFICATION absent because no declared transition requires one"
            - "after the CLOSE milestone is created OPEN_CLOSE succeeds and ${cyc_status} == CLOSE_OPEN"
            - "OPEN_REVIEW with the CLOSE milestone PLANNED returns 409 ERR_MILESTONE_INCOMPLETE"
            - "${ms_status} == IN_PROGRESS after START, and OPEN_REVIEW STILL returns 409 ERR_MILESTONE_INCOMPLETE — only COMPLETE clears the gate"
            - "after COMPLETE, OPEN_REVIEW succeeds and ${cyc_status2} == REVIEW_OPEN"
            - "the second REVENUE assignment to the same member returns 409 ERR_DUPLICATE_SUBCERT even with a different due_utc; the OPERATIONS assignment to that same member is created with status PENDING, so the uniqueness key includes scope_area"
            - "OPEN_CERTIFICATION returns 409 ERR_MILESTONE_MISSING (no REVIEW milestone exists) and NOT ERR_FILING_DOCUMENT_INVALID, although the cycle also has no APPROVED PERIODIC_FILING document — priority 33 outranks priority 36"

      - name: filing_readiness_and_amendment_guards_fire_in_sequence_on_a_single_cycle
        claim_type: error_triggerability
        grounds:
          - validations[priority=44]
          - validations[priority=45]
          - validations[priority=30]
          - validations[priority=37]
          - errors[ERR_CERTIFICATIONS_INCOMPLETE]
          - errors[ERR_MILESTONE_SLACK_EXHAUSTED]
          - errors[ERR_DEFICIENCY_OPEN]
          - errors[ERR_AMENDMENT_TARGET_INVALID]
          - state_machines.ReportingCycle.AMENDED_to_AMENDED
          - calculations.cycle_milestone_slack
          - calculations.filing_accession_and_lateness
        distinguishing_aspect: |
          The four hardest-to-reach codes in the catalog all live behind the same door and are reached in
          one pass, each one unblocked by exactly the fact the previous rejection named:
            (1) ERR_CERTIFICATIONS_INCOMPLETE must beat ERR_MILESTONE_SLACK_EXHAUSTED even though BOTH
                conditions hold at that moment (priority 44 before 45) — the cycle already carries a
                FILING milestone with zero business-day slack when the certifications are still unsigned.
            (2) ERR_MILESTONE_SLACK_EXHAUSTED then surfaces on its own, and the ONLY way out is to move
                the tight milestone out of the {PLANNED, IN_PROGRESS} input set: the second FILING
                milestone carries 2 business days of slack all along, yet the MIN aggregate stays 0 until
                the tight one reaches COMPLETE. An implementation that aggregates over all milestones, or
                that reads slack_calendar_days instead of the business-day variant, never recovers.
            (3) ERR_DEFICIENCY_OPEN blocks the AMENDING filing (not just DECLARE_FILING_READY), which is
                the clause of priority 30 that has no other route: the cycle is already FILED, so the
                filing-ready gate can never be re-evaluated on it.
            (4) ERR_AMENDMENT_TARGET_INVALID needs a THIRD filing: Amendment No. 2 must point at the most
                recent SUBMITTED filing, because the original is AMENDED_SUPERSEDED by then. Per §1.4
                priority 12's scope note the superseded target is NOT reported as ERR_ENTITY_TERMINAL.
          The accession suffix climbing 1 -> 2 -> 3 proves prior_count counts filings regardless of status.
        test_recipe:
          setup:
            - "Logical clock at the 2026-08-01T00:00:00Z default throughout; FY2026-Q2 FORM_10Q LARGE_ACCELERATED gives statutory_deadline_utc 2026-08-10T17:30:00Z (2026-08-09 is a Sunday, rolled forward to Monday) and internal_target_utc 2026-08-05T17:30:00Z."
            - "FOUR milestones: CLOSE 08-01T00:00 -> 08-03T00:00 (slack_business 5), REVIEW 08-05T00:00 -> 08-06T00:00 (exactly the 48h CLOSE_TO_REVIEW buffer, slack_business 2), FILING-TIGHT 08-10T00:00 -> 08-10T12:00 (slack_business 0, slack_calendar 0) and FILING-LOOSE 08-06T12:00 -> 08-06T18:00 (slack_business 2, slack_calendar 3). The two FILING windows are disjoint under half-open geometry, and RULE B is skipped for both because the cycle carries no CERTIFICATION milestone."
            - "The cycle is driven to CERTIFICATION_OPEN with one SUBMITTED REVENUE sub-certification (coverage 100.00), one APPROVED PERIODIC_FILING document whose single tie-out line matches exactly, and CEO_302 / CFO_302 certifications created but NOT signed."
