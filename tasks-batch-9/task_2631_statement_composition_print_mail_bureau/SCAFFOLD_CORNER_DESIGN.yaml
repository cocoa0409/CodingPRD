              as: BureauAdmin
              captures: { c11_site_id: "$.data.id" }
            - call: "POST /bureau/dr-sites/${c11_site_id}/drills"
              payload: { result: "PASS" }
              as: BureauAdmin
              captures: { c11_valid_until: "$.data.readiness_valid_until", c11_drills: "$.data.drill_count" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-31T00:00:00Z" }
              as: BureauAdmin
            - call: "GET /bureau/dr-sites/${c11_site_id}"
              payload: {}
              as: ProductionScheduler
              captures: { c11_at_expiry: "$.data.readiness_status" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-31T00:01:00Z" }
              as: BureauAdmin
            - call: "GET /bureau/dr-sites/${c11_site_id}"
              payload: {}
              as: ProductionScheduler
              captures: { c11_past_expiry: "$.data.readiness_status" }
            - call: "POST /bureau/dr-sites/${c11_site_id}/drills"
              payload: { result: "FAIL" }
              as: BureauAdmin
              captures: { c11_after_fail: "$.data.readiness_status", c11_new_valid: "$.data.readiness_valid_until", c11_drills2: "$.data.drill_count", c11_result: "$.data.last_drill_result" }
          assert:
            - "${c11_valid_until} == 2026-08-31T00:00:00Z == 2026-08-01T00:00:00Z + 720 hours and ${c11_drills} == 1"
            - "${c11_at_expiry} == READY — the comparison current_utc > readiness_valid_until is strict, so the exact expiry instant has not decayed yet"
            - "${c11_past_expiry} == STALE one minute later, with no write in between"
            - "${c11_after_fail} == FAILED, ${c11_result} == FAIL, ${c11_drills2} == 2 and ${c11_new_valid} == 2026-09-30T00:01:00Z — a FAIL still restarts the validity window but readiness is pinned to FAILED, not STALE"

