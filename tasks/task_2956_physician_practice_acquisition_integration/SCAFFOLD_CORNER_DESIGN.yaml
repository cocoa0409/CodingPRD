  # ===========================================================================
  # Section 8 — Cross-Cutting Complexity Layers (§1.0 complexity_layers)
  #
  # Active layers: dual_variant_calculation, cascading_side_effects,
  # optimistic_concurrency, rate_threshold_triggers. The two §1.2.1
  # concurrency_rules entries each get their own stale-version instance; the
  # dual-variant and deep-cascade claims already live in §1.8 and are stubbed.
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_acquisition_version_on_opinion_create_returns_412
        claim_type: Optimistic concurrency — stale version rejected
        grounds:
          - concurrency_rules[valuation-opinion-create-stale-acquisition]
          - errors[ERR_STALE_ACQUISITION_VERSION]
          - validations[priority=13]
          - endpoints[POST /valuation-opinions]
        distinguishing_aspect: |
          The token is spent by the analyst's own preceding write, not by anyone else's:
          filing the FMV opinion bumps the acquisition version, so the commercial
          reasonableness opinion filed from the same stale read is refused with 412. The
          guard exists precisely so a later filing cannot be built on a superseded picture.
        test_recipe:
          setup:
            - "One Acquisition in deal_status DILIGENCE with one Physician."
            - "One FMV ValuationOpinion already filed against the version the analyst read."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrationManager
              as_user_id: "im-1"
