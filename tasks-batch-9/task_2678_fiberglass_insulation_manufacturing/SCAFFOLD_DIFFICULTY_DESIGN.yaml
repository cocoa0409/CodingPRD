  - rule_id: resource_temporal_overlap
    instances:
      - name: forming_line_occupancy_is_half_open_and_scoped_per_line
        grounds:
          - validations.priority_62_ERR_LINE_OCCUPANCY_CONFLICT
          - entities.ProductionRun.scheduled_start
          - entities.ProductionRun.scheduled_end
          - errors.ERR_LINE_OCCUPANCY_CONFLICT
        distinguishing_aspect: |
          A PAIRWISE occupancy check on the (plant_id, line_index) resource with
          HALF-OPEN intervals, so back-to-back runs sharing an endpoint are legal and
          only a one-second true overlap is rejected. Three independent axes are
          probed: interval semantics at the shared endpoint, resource scoping across
          line_index, and the run_status filter -- an ABORTED run releases the line
          even though its interval still overlaps. Contrast with the ThermalTest
          instance, which is an AGGREGATE count over CLOSED intervals.
        test_recipe:
          setup:
            - "Plant NWK has production_line_count 2; binder BF-FREE-1 is CERTIFIED; SKU PL-A exists on it."
            - "Run RUN-1 for PL-A occupies line 1 over [2026-08-03T06:00:00Z, 2026-08-03T14:00:00Z) and is SCHEDULED, which is inside the blocking set {SCHEDULED, HELD, MELTING, CURING}."
            - "The logical clock is left at its default 2026-08-01T00:00:00Z; no melt is started, so no clock advance is needed."
          setup_api_calls:
            - call: "POST /certification-programs"
              payload: { code: "RCERT-PS", conformance_basis: "PER_SPECIMEN", r_value_tolerance: 0.30, min_specimen_count: 3, max_concurrent_lab_tests: 2, retest_limit: 2, derate_allowed: true }
