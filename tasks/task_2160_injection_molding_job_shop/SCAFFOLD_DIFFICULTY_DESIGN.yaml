  # ==========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: report_reversal_conserves_resin_mass_and_shot_counters
        grounds:
          - calculations.resin_lot_mass_balance
          - calculations.mold_shot_counter_and_pm
          - calculations.job_yield_accounting
          - entities.ProductionReport.fields.is_reversed
          - entities.ResinLot.fields.qty_grams_remaining
        distinguishing_aspect: |
          Conserved quantity one is RESIN MASS IN GRAMS, pinned as
          ResinLot.qty_grams_remaining + sum(virgin_grams over non-reversed reports on that
          lot) == qty_kg_received * 1000. Posting a report and then reversing it must leave
          that identity true and return qty_grams_remaining to exactly 500000 with zero drift,
          alongside the mold's shot counters returning to 0.
        test_recipe:
          setup:
            - "Mold M-1 PPAP_APPROVED, pm_interval_shots 5000, counters at 0; ResinLot L-77 of 500 kg (500000 g) RELEASED."
            - "Job scheduled 2026-09-10T08:00Z-16:00Z, staged and RUNNING."
            - "One ProductionReport posted: 1000 shots, 25 short shots, 3800 good, 200 scrap, 36000 g virgin, 4000 g regrind, 700 run minutes."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /customers", payload: { name: "Acme Controls", code: "ACME" }, as: PlantAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /presses", payload: { press_code: "P-150", tonnage: 150, shot_size_grams_max: 400, hourly_rate_cents: 7200 }, as: PlantAdmin, captures: { p150_id: $.data.id } }
            - { call: "POST /molds", payload: { mold_code: "M-1", customer_id: "${cust_id}", cavity_count: 4, shot_weight_grams: 180, required_min_tonnage: 120, required_max_tonnage: 200, pm_interval_shots: 5000, tooling_cost_cents: 2500000, ownership: "SHOP_OWNED" }, as: PlantAdmin, captures: { mold_id: $.data.id } }
