          assert:
            - "the first create succeeds and BusinessSubscription.${sub_id}.version advanced to ${sub_v_after}"
            - "the second create reusing the pre-write version is refused with 412 and error_id == ERR_STALE_VERSION"
            - "GET /wellness/class-sessions?studio_id=${studio_id} returns exactly 1 row"
            - "replaying the second create with expected_subscription_version ${sub_v_after} succeeds"

