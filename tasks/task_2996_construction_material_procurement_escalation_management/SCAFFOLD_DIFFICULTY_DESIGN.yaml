        as: DesignEngineer
      trigger:
      - call: POST /procurement/substitution-requests/${sr_b_id}/disposition
        payload: {disposition: APPROVED_AS_NOTED, engineer_conditions: Substitute accepted only if the original fabrication window is held}
        as: DesignEngineer
      - call: GET /procurement/material-packages/${pkg_id}
        payload: {}
