        claim_type: priority_ordering
        grounds: ["validations[priority=6]", "validations[priority=9]", "errors[ERR_STALE_VERSION]", "errors[ERR_WINDOW_OUT_OF_BOUNDS]"]
        distinguishing_aspect: "OCC (priority 6) is evaluated before business_temporal (priority 9): a create carrying BOTH a stale expected_production_version AND an out-of-bounds window fails with ERR_STALE_VERSION (412), never ERR_WINDOW_OUT_OF_BOUNDS (422)."
