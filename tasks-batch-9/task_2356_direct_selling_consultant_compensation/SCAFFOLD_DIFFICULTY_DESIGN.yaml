              captures: { per_total_after: "$.data.total_net_personal_volume_points", per_status_after: "$.data.status" }
          assert:
            - "baseline: h_due == 58250, h_pts == 500, lock_status == LOCKED, lock_count == 1, close_status == CLOSED, close_total == 0"
            - "pay_error == ERR_PERIOD_NOT_ACCEPTING_VOLUME with HTTP 409 (priority 28 requires OPEN or REOPENED), and the order is still payment_status PENDING with volume_posted false"
            - "reopen_status == REOPENED and reopen_count == 1"
            - "pay_status == PAID and pay_posted == true for the identical payment call"
            - "h_personal == 500, h_net == 500, h_group == 500"
            - "per_total_after == 500 and per_status_after == REOPENED (the period's derived total picked up the late volume)"
            - "the order row was never modified between the two calls, so the whole difference is the QualificationPeriod's status"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: qualification_periods_allow_touching_endpoints_and_reject_interior_overlap
        grounds:
          - validations[priority=31]
          - validations[priority=17]
          - entities.QualificationPeriod.fields.period_start
          - entities.QualificationPeriod.fields.period_end
        distinguishing_aspect: |
          Interval semantics = HALF-OPEN [period_start, period_end) scoped to one
          CompensationPlan: a period beginning exactly where another ends is admitted, an
          interior overlap of even one instant is refused, and a second plan may hold the
          byte-identical interval.
        test_recipe:
          setup:
            - "Two CompensationPlans PLAN-A and PLAN-B exist, both at defaults; clock at 2026-08-01T00:00:00Z."
            - "PLAN-A has period 2026-08 covering [2026-08-01, 2026-09-01)."
          setup_api_calls:
            - call: "POST /direct-selling/compensation-plans"
              payload: { plan_code: "PLAN-A", name: "Consultant Plan A" }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /direct-selling/compensation-plans"
              payload: { plan_code: "PLAN-B", name: "Consultant Plan B" }
              as: PlatformAdmin
              captures: { plan_b_id: "$.data.id" }
            - call: "POST /direct-selling/qualification-periods"
              payload: { compensation_plan_id: "${plan_id}", period_code: "2026-08", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: CommissionAnalyst
              captures: { p8_id: "$.data.id", p8_status: "$.data.status" }
          trigger:
            - call: "POST /direct-selling/qualification-periods"
              payload: { compensation_plan_id: "${plan_id}", period_code: "2026-09", period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z" }
              as: CommissionAnalyst
              captures: { p9_id: "$.data.id", p9_start: "$.data.period_start" }
            - call: "POST /direct-selling/qualification-periods"
              payload: { compensation_plan_id: "${plan_id}", period_code: "2026-07", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z" }
              as: CommissionAnalyst
              captures: { p7_id: "$.data.id", p7_end: "$.data.period_end" }
            - call: "POST /direct-selling/qualification-periods"
              payload: { compensation_plan_id: "${plan_id}", period_code: "2026-08B", period_start: "2026-08-15T00:00:00Z", period_end: "2026-09-15T00:00:00Z" }
              as: CommissionAnalyst
              captures: { overlap_error: "$.data.error_id" }
            - call: "POST /direct-selling/qualification-periods"
              payload: { compensation_plan_id: "${plan_id}", period_code: "2026-08", period_start: "2026-10-01T00:00:00Z", period_end: "2026-11-01T00:00:00Z" }
              as: CommissionAnalyst
              captures: { duplicate_error: "$.data.error_id" }
            - call: "POST /direct-selling/qualification-periods"
              payload: { compensation_plan_id: "${plan_b_id}", period_code: "2026-08", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: CommissionAnalyst
              captures: { plan_b_period_id: "$.data.id", plan_b_period_plan: "$.data.compensation_plan_id" }
            - call: "POST /direct-selling/qualification-periods"
              payload: { compensation_plan_id: "${plan_id}", period_code: "2026-11", period_start: "2026-12-01T00:00:00Z", period_end: "2026-11-01T00:00:00Z" }
              as: CommissionAnalyst
              captures: { bounds_error: "$.data.error_id" }
          assert:
            - "p8_status == OPEN (initial state) at baseline"
            - "p9_id is non-null with HTTP 201 and p9_start == 2026-09-01T00:00:00Z (a start equal to an existing exclusive end does not intersect)"
            - "p7_id is non-null with HTTP 201 and p7_end == 2026-08-01T00:00:00Z (an exclusive end equal to an existing inclusive start does not intersect)"
            - "overlap_error == ERR_PERIOD_OVERLAP with HTTP 409 for [2026-08-15, 2026-09-15) which straddles the interiors of both 2026-08 and 2026-09"
            - "duplicate_error == ERR_DUPLICATE_PERIOD_CODE with HTTP 409 even though [2026-10-01, 2026-11-01) overlaps nothing (uniqueness is on (compensation_plan_id, period_code), independent of the interval test)"
            - "plan_b_period_id is non-null with HTTP 201 and plan_b_period_plan == ${plan_b_id} (overlap and code uniqueness are both scoped per plan)"
            - "bounds_error == ERR_PERIOD_BOUNDS_INVALID with HTTP 422 (priority 30 runs before the overlap test)"
            - "GET /direct-selling/qualification-periods with compensation_plan_id ${plan_id} returns exactly 3 rows"

      - name: sanction_windows_reject_touching_endpoints_and_the_cooloff_buffer_start
        grounds:
          - validations[priority=48]
          - entities.ComplianceCase.fields.effective_from
          - entities.ComplianceCase.fields.effective_until
          - entities.CompensationPlan.fields.sanction_cooloff_days
        distinguishing_aspect: |
          Interval semantics = CLOSED [effective_from, effective_until] plus a 30-day forward
          cooloff buffer, scoped to one Consultant — the deliberate opposite of the periods'
          half-open rule: a window starting exactly where the previous one ends is REFUSED
          here, and a fully disjoint window 21 days later is still refused by the buffer.
        test_recipe:
          setup:
            - "PLAN-A at defaults (sanction_cooloff_days 30), TX jurisdiction, KIT-STD catalogued; clock at 2026-08-01T00:00:00Z."
            - "Consultant T enrolled as a root."
            - "Case 1 SANCTIONED at PROBATION over the closed window [2026-08-05, 2026-08-20], so highest_sanction_order is 2."
            - "Case 2 created and moved to UNDER_REVIEW; every attempt below requests SUSPENSION (order 3) so the escalation rule at priority 46 is always satisfied."
          setup_api_calls:
            - call: "POST /direct-selling/compensation-plans"
              payload: { plan_code: "PLAN-A", name: "Consultant Plan A" }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
