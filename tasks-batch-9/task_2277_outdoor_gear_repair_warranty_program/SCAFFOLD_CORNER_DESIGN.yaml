          rationale: "The PROVISIONAL/FINAL divergence of calculations.paid_repair_pricing, including the reconciliation delta stamped on the order, is already asserted end-to-end by that §1.8 dual_variant_calc instance; repeating it here would only re-run the same arithmetic."

      - name: excluded_per_line_rounding_precision
        claim_type: precision
        excluded_because:
          difficulty_instance: final_invoice_per_line_rounding_before_sum
          rationale: "The pinned round-per-line-then-sum order (9084 vs the naive 9083) is the whole subject of that §1.8 combinatorial_formula instance."

      - name: excluded_repair_ratio_threshold_boundary
        claim_type: threshold
        excluded_because:
          difficulty_instance: repair_ratio_exactly_at_threshold_replaces
          rationale: "The >= comparison at repair_ratio_pct == decision_threshold_pct, and the one-cent neighbour that flips to WARRANTY_REPAIR, are covered by that §1.8 boundary_precision_check instance."

      - name: excluded_turnaround_queue_snapshot_ordering
        claim_type: constraint_propagation
        excluded_because:
          difficulty_instance: turnaround_commitment_queue_snapshot_evaluation_order
          rationale: "The circular-looking dependency between the queue depth and the order joining that queue, with its pinned step order, is that §1.8 combinatorial_formula instance's entire subject."

      - name: excluded_liability_rollup_aggregate_boundary
        claim_type: aggregation
        excluded_because:
          difficulty_instance: liability_open_exactly_equals_cap_stays_constrained
          rationale: "The cross-multiplied integer posture boundary (open == cap is CONSTRAINED, not FROZEN) is asserted by that §1.8 boundary_precision_check instance."

  # =======================================================================
  - section: validations
    instances:

      - name: proof_requirement_applies_only_to_warranty_intake
        claim_type: conditional_validation
        grounds:
          - validations[priority=36]
          - errors[ERR_PROOF_OF_PURCHASE_MISSING]
          - state_machines[WarrantyClaim].transitions[DRAFT->SUBMITTED].preconditions
        distinguishing_aspect: "The same undocumented unit fails a WARRANTY_CLAIM submit and passes a PAID_REPAIR_REQUEST submit: the rule is keyed on intake_kind, and the failed attempt leaves the claim in DRAFT, the item WITH_CUSTOMER and lifetime_claim_count at 0."
        test_recipe:
          setup: ["clock 2026-06-15T09:00:00Z; item registered with proof_of_purchase_type omitted (default NONE); two DRAFT claims on it, one of each intake_kind"]
          setup_api_calls:
            - call: "POST /gear-service/_clock/set_current_utc"
              payload: { current_utc: "2026-06-15T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /gear-service/service-centers"
              payload: { name: "Cascade Service Hub", region_code: "US-OR", liability_cap_cents: 5000000 }
              as: ProgramAdmin
              captures: { sc_id: $.data.id }
            - call: "POST /gear-service/gear-models"
              payload: { model_code: "TNT-ASCENT-2", name: "Ascent 2P Tent", category: "TENT_SHELTER", msrp_cents: 79900, release_year: 2019, warranty_years: 5 }
              as: ProgramAdmin
              captures: { gm2_id: $.data.id }
            - call: "POST /gear-service/customers"
              payload: { full_name: "Rowan Ives", email: "rowan@example.com", loyalty_tier: "PRO" }
              as: ServiceAgent
              captures: { cust_id: $.data.id }
            - call: "POST /gear-service/gear-items"
              payload: { gear_model_id: "${gm2_id}", owner_customer_id: "${cust_id}", serial_number: "AS2-00417", purchase_date: "2023-05-10T00:00:00Z", purchase_price_cents: 74900, condition_grade: "B" }
              as: ServiceAgent
              captures: { item_id: $.data.id }
            - call: "POST /gear-service/warranty-claims"
              payload: { service_center_id: "${sc_id}", gear_item_id: "${item_id}", intake_kind: "WARRANTY_CLAIM", reported_defect_type: "SEAM_FAILURE", customer_narrative: "Seam split, receipt lost." }
              as: ServiceAgent
              captures: { claim_w_id: $.data.id }
            - call: "POST /gear-service/warranty-claims"
              payload: { service_center_id: "${sc_id}", gear_item_id: "${item_id}", intake_kind: "PAID_REPAIR_REQUEST", reported_defect_type: "SEAM_FAILURE", customer_narrative: "Happy to pay for the same seam." }
              as: ServiceAgent
              captures: { claim_p_id: $.data.id }
          trigger:
            - call: "POST /gear-service/warranty-claims/${claim_w_id}/submit"
              payload: {}
              as: ServiceAgent
            - call: "POST /gear-service/warranty-claims/${claim_p_id}/submit"
              payload: {}
              as: ServiceAgent
          assert:
            - "GearItem.${item_id}.proof_of_purchase_type == NONE and both claims were created with proof_verified == false"
            - "first trigger: HTTP 422 with error_id == ERR_PROOF_OF_PURCHASE_MISSING; WarrantyClaim.${claim_w_id}.status == DRAFT, submitted_at == null"
            - "after the first trigger GearItem.${item_id}.disposition_status == WITH_CUSTOMER and Customer.${cust_id}.lifetime_claim_count == 0"
            - "second trigger: HTTP 200; WarrantyClaim.${claim_p_id}.status == SUBMITTED, submitted_at == 2026-06-15T09:00:00Z"
            - "after the second trigger GearItem.${item_id}.disposition_status == AT_CENTER and Customer.${cust_id}.lifetime_claim_count == 1"

      - name: expired_warranty_beats_missing_proof_on_submit
        claim_type: priority_ordering
        grounds:
          - validations[priority=31]
          - validations[priority=36]
          - errors[ERR_WARRANTY_EXPIRED]
        distinguishing_aspect: "Both the temporal rule (31) and the documentation rule (36) are violated by the same submit; the lower priority number wins, so the answer is ERR_WARRANTY_EXPIRED and never ERR_PROOF_OF_PURCHASE_MISSING."
        test_recipe:
          setup: ["clock 2026-06-15T09:00:00Z; item bought 2019-01-10 under a 5-year warranty with no proof of purchase; DRAFT WARRANTY_CLAIM on it"]
          setup_api_calls:
            - call: "POST /gear-service/_clock/set_current_utc"
              payload: { current_utc: "2026-06-15T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /gear-service/service-centers"
              payload: { name: "Cascade Service Hub", region_code: "US-OR", liability_cap_cents: 5000000 }
              as: ProgramAdmin
              captures: { sc_id: $.data.id }
            - call: "POST /gear-service/gear-models"
              payload: { model_code: "TNT-ASCENT-2", name: "Ascent 2P Tent", category: "TENT_SHELTER", msrp_cents: 79900, release_year: 2019, warranty_years: 5 }
              as: ProgramAdmin
              captures: { gm2_id: $.data.id }
            - call: "POST /gear-service/customers"
              payload: { full_name: "Rowan Ives", email: "rowan@example.com", loyalty_tier: "PRO" }
              as: ServiceAgent
              captures: { cust_id: $.data.id }
            - call: "POST /gear-service/gear-items"
              payload: { gear_model_id: "${gm2_id}", owner_customer_id: "${cust_id}", serial_number: "AS2-00901", purchase_date: "2019-01-10T00:00:00Z", purchase_price_cents: 74900, condition_grade: "C" }
