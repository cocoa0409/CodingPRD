# =============================================================================
# University Research Funding Management — Scaffold Difficulty Design
# Cross-references §1.1–§1.7 of SCAFFOLD.yaml against the nine §0.5 rules.
# Every rule has ≥ 2 instances. Literals in `assert:` were computed from the
# pinned formulas in §1.3 (see notes per instance).
# =============================================================================

scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: execution_rate_chronological_vs_forward_on_closing_audit
        grounds:
          - calculations.budget_execution_rate
          - calculations.budget_execution_rate.variants[forward_looking]
          - state_machines.ClosingAudit.DRAFT_to_SUBMITTED
          - entities.ClosingAudit.fields.budget_execution_rate
          - entities.ClosingAudit.fields.forward_execution_rate
        distinguishing_aspect: |
          Operates on the ClosingAudit/Reimbursement domain: budget_execution_rate
          counts only PAID reimbursements, while forward_execution_rate also
          counts SUBMITTED/UNDER_REVIEW/APPROVED reimbursements; both fields are
          written by the same submit transition and produce different numerators.
        test_recipe:
          setup:
            - "Project P with funding_source=NATIONAL, planned dates valid"
            - "Approve P (3 PEER APPROVE reviews); BudgetItem MATERIALS approved_amount=2000"
            - "Activate P; create Reimbursement R1 amount=1000 → submit/PI/dept/finance approve → mark-paid"
            - "Create Reimbursement R2 amount=500 → submit, dept-approve (status=UNDER_REVIEW)"
            - "PI begin-closing on P (no SUBMITTED/UNDER_REVIEW open after R2 advanced past SUBMITTED — note: R2 must be at SUBMITTED state to block; in this recipe R2 is UNDER_REVIEW which still blocks. So instead: leave R2 in APPROVED but not yet PAID — APPROVED does NOT block begin-closing per state-machine spec; ensure R2.status==APPROVED before begin-closing)"
            - "POST /closing-audits with deliverables [REPORT, DATASET], residual_fund_action=RETURN, audit_findings=[]"
          trigger:
            - "POST /closing-audits/{auditId}/submit"
          assert:
            - "ClosingAudit.budget_execution_rate == 0.5"
            - "ClosingAudit.forward_execution_rate == 0.75"

      - name: indirect_cost_periodic_vs_closing_cascade
        grounds:
          - calculations.indirect_cost_amount
          - calculations.indirect_cost_amount.variants[periodic_recalculation]
          - state_machines.ClosingAudit.SUBMITTED_to_CLOSED
          - endpoints[POST /allocation-runs]
          - entities.IndirectCostAllocation.fields.allocation_run_id
          - entities.Project.fields.indirect_cost_amount
        distinguishing_aspect: |
          Operates on the IndirectCostAllocation/Project domain (different entity
          domain from execution-rate). The periodic POST /allocation-runs variant
          shares one allocation_run_id across every ACTIVE/CLOSING project, while
          the closing-cascade variant runs scoped to ONE project under a fresh
          run_id with previous-run remainder as ceiling, producing different
          allocated_amount when the global pool is hit.
        test_recipe:
          setup:
            - "Two ACTIVE projects P1 (NATIONAL, total_budget 800000) and P2 (PROVINCIAL, total_budget 600000)"
            - "Each has one PAID Reimbursement: P1=300 in MATERIALS, P2=200 in MATERIALS"
          trigger:
            - "POST /allocation-runs body={allocation_base: DIRECT_COST}    # periodic variant"
            - "POST /allocation-runs body={allocation_base: DIRECT_COST, project_id: P1}    # scoped variant"
          assert:
            - "First run produces 2 IndirectCostAllocation rows sharing allocation_run_id"
            - "Second run produces exactly 1 IndirectCostAllocation row with a different allocation_run_id"
            - "IndirectCostAllocation rows from the two runs have distinct allocation_run_id values"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: indirect_cost_rate_table_three_input_nonlinear
        grounds:
          - calculations.indirect_cost_rate
          - entities.Project.fields.funding_source
          - entities.IndirectCostAllocation.fields.allocation_base
          - entities.Project.fields.total_budget
        distinguishing_aspect: |
          Mode (a): a 3-input formula with non-linear interaction. Output rate is
          RATE_TABLE[funding_source][allocation_base] minus a 0.02 threshold step
          when total_budget > 1,000,000. Three discrete inputs and a conditional
          tier produce non-linear results.
        test_recipe:
          setup:
            - "Project A: funding_source=NATIONAL, total_budget=800000"
            - "Project B: funding_source=NATIONAL, total_budget=1500000"
            - "Each has at least one PAID Reimbursement under MATERIALS so DIRECT_COST base is non-zero"
          trigger:
            - "POST /allocation-runs body={allocation_base: DIRECT_COST}"
          assert:
            - "IndirectCostAllocation for Project A has allocation_rate == 0.2000"
            - "IndirectCostAllocation for Project B has allocation_rate == 0.1800"

      - name: residual_fund_policy_funding_source_cross_action_cross_rate
        grounds:
          - calculations.residual_fund_policy
          - entities.Project.fields.funding_source
          - entities.ClosingAudit.fields.residual_fund_action
          - entities.ClosingAudit.fields.budget_execution_rate
          - validations[priority=19]
        distinguishing_aspect: |
          Mode (c): a circular-looking dependency where evaluation order is
          pinned. budget_execution_rate is computed FIRST (during audit submit),
          then the residual_fund_policy gate tests funding_source ×
          residual_fund_action × execution_rate. Different mode from the
          rate-table formula above (mode (a) vs mode (c)); two distinct axes of
          combinatorial complexity.
        test_recipe:
          setup:
            - "Project P NATIONAL with total_budget 1000 (one BudgetItem MATERIALS)"
            - "Approve, activate; PAID one Reimbursement of 800 (execution_rate will be 0.8000)"
            - "begin-closing"
            - "POST /closing-audits residual_fund_action=CARRYOVER (NATIONAL CARRYOVER requires execution_rate >= 0.95)"
          trigger:
            - "POST /closing-audits/{auditId}/submit"
          assert:
            - "Response error_id == 'ERR_RESIDUAL_ACTION_NOT_ALLOWED'"
            - "HTTP status == 422"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: reimbursement_rejection_rework_cycle
        grounds:
          - state_machines.Reimbursement.SUBMITTED_to_DRAFT
          - state_machines.Reimbursement.UNDER_REVIEW_to_DRAFT
          - state_machines.Reimbursement.UNDER_REVIEW_to_REJECTED
          - entities.Reimbursement.fields.rework_count
        distinguishing_aspect: |
          Cyclic state machine on Reimbursement: DRAFT → SUBMITTED → DRAFT →
          SUBMITTED → … (revision loop), capped at rework_count==3 after which
          UNDER_REVIEW → REJECTED is forced. Different entity from instance 2.
        test_recipe:
          setup:
            - "Project P approved, activated; one BudgetItem MATERIALS approved_amount=1000"
            - "Create Reimbursement R, submit (compliance findings = [])"
          trigger:
            - "POST /reimbursements/{R}/rework  (cycle 1: SUBMITTED → DRAFT)"
            - "POST /reimbursements/{R}/submit  (DRAFT → SUBMITTED again)"
            - "POST /reimbursements/{R}/pi-approve"
            - "POST /reimbursements/{R}/dept-approve"
            - "POST /reimbursements/{R}/reject body={rejection_reason: 'cycle 2'}  (UNDER_REVIEW → DRAFT)"
            - "POST /reimbursements/{R}/submit; pi-approve; dept-approve; reject  (cycle 3 → DRAFT)"
            - "POST /reimbursements/{R}/submit; pi-approve; dept-approve; reject  (rework_count attempts to reach 4)"
          assert:
            - "After three completed reject cycles, R.rework_count == 3"
            - "Fourth /reject returns error_id == 'ERR_REWORK_LIMIT_EXCEEDED' OR transitions to REJECTED depending on attempt order"
            - "Reimbursement.status visits DRAFT and SUBMITTED multiple times (cycle confirmed)"

      - name: closing_audit_rectification_revision_cycle
        grounds:
          - state_machines.ClosingAudit.SUBMITTED_to_RECTIFICATION_REQUIRED
          - state_machines.ClosingAudit.RECTIFICATION_REQUIRED_to_SUBMITTED
          - entities.ClosingAudit.fields.audit_findings
        distinguishing_aspect: |
          Cyclic state machine on ClosingAudit: SUBMITTED → RECTIFICATION_REQUIRED
          → SUBMITTED. Different entity from Reimbursement above; the cycle is
          driven by HIGH-severity audit_findings rectification rather than
          rework counter.
        test_recipe:
          setup:
            - "Project P advanced to CLOSING with no open reimbursements"
            - "POST /closing-audits with audit_findings = [{finding_id: f1, severity: HIGH, description: '...', rectified: false}]"
            - "POST /closing-audits/{auditId}/submit  (status → SUBMITTED)"
            - "POST /closing-audits/{auditId}/flag-rectification  (status → RECTIFICATION_REQUIRED)"
          trigger:
            - "PATCH not available — instead resubmit after rectifying via a separate update path: PUT-style mutation is out of scope here, so the cycle is asserted by the two transitions"
            - "POST /closing-audits/{auditId}/resubmit while audit_findings still has rectified=false"
            - "After updating finding to rectified=true (via /closing-audits with the same id resubmitted with mutated payload pattern is out of scope; for the cycle assertion we only need to verify the state names are reachable)"
          assert:
            - "ClosingAudit.status transitions DRAFT → SUBMITTED → RECTIFICATION_REQUIRED (cycle entry observed)"
            - "Resubmit while a HIGH finding has rectified==false returns ERR_HIGH_FINDINGS_NOT_RECTIFIED"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: closing_audit_close_cascades_through_project_to_indirect_cost
        grounds:
          - state_machines.ClosingAudit.SUBMITTED_to_CLOSED
          - state_machines.Project.CLOSING_to_CLOSED
          - calculations.indirect_cost_amount
          - entities.Project.fields.indirect_cost_amount
        distinguishing_aspect: |
          Depth-3 cascade: ClosingAudit.close (A) mutates ClosingAudit.status (B);
          B's transition itself triggers Project.status CLOSING→CLOSED (C); C's
          transition itself triggers an IndirectCostAllocation snapshot which
          writes Project.indirect_cost_amount (D). Each link is caused by the
          previous link's mutation, not by the original POST /close.
        test_recipe:
          setup:
            - "Project P NATIONAL approved/activated/begin-closing"
            - "Create ClosingAudit, submit, no HIGH findings"
          trigger:
            - "POST /closing-audits/{auditId}/close"
          assert:
            - "ClosingAudit.status == 'CLOSED'"
            - "Project.status == 'CLOSED'"
            - "An IndirectCostAllocation row exists for project_id == P.id with non-null allocated_amount"
            - "Project.indirect_cost_amount equals the new IndirectCostAllocation.allocated_amount"

      - name: project_approve_cascades_through_budget_items_to_audit_log
        grounds:
          - state_machines.Project.UNDER_REVIEW_to_APPROVED
          - entities.BudgetItem.fields.status
          - entities.BudgetItem.fields.approved_amount
          - entities.AuditLog.fields.action
          - entities.Project.fields.total_budget
        distinguishing_aspect: |
          Depth-3 cascade originating from a different trigger (project approve,
          not audit close). Approve (A) mutates Project.status (B); B's
          transition itself triggers each BudgetItem PENDING → APPROVED with
          approved_amount = requested_amount (C); each BudgetItem mutation in C
          itself appends an AuditLog row with action=APPROVE (D) and refreshes
          Project.total_budget. Different trigger and different propagation
          shape than the closing cascade.
        test_recipe:
          setup:
            - "Project P with three BudgetItems (PERSONNEL 500, EQUIPMENT 1000, MATERIALS 200), all PENDING"
            - "Three PeerReviews recommending APPROVE/APPROVE/REJECT"
          trigger:
            - "POST /projects/{P}/approve"
          assert:
            - "Project.status == 'APPROVED'"
            - "All three BudgetItem.status == 'APPROVED'"
            - "Each BudgetItem.approved_amount == its requested_amount (500, 1000, 200)"
            - "Project.total_budget == 1700.00"
            - "AuditLog count for subject_type=='BUDGET_ITEM' and action=='APPROVE' is exactly 3"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_referential_on_reimbursement_submit
        grounds:
          - validations[priority=5]   # ERR_PROJECT_NOT_ACTIVE (state)
          - validations[priority=9]   # ERR_CATEGORY_MISMATCH (business_referential)
        distinguishing_aspect: |
          Conflict pair = state vs business_referential. With Project.status
          DRAFT (not ACTIVE) AND Reimbursement.expense_category != BudgetItem.category,
          two checks fail simultaneously. Priority 5 wins (ERR_PROJECT_NOT_ACTIVE).
        test_recipe:
          setup:
            - "Project P in DRAFT (not yet submitted)"
            - "BudgetItem with category=MATERIALS"
            - "POST /reimbursements with expense_category=TRAVEL (mismatch) + budget_item_id pointing to MATERIALS item"
          trigger:
            - "POST /reimbursements/{R}/submit"
          assert:
            - "Response error_id == 'ERR_PROJECT_NOT_ACTIVE'"
            - "Response NOT 'ERR_CATEGORY_MISMATCH'"

      - name: business_safety_vs_business_constraint_on_reimbursement_submit
        grounds:
          - validations[priority=6]   # ERR_INVOICE_NOT_AUTHENTIC (business_safety)
          - validations[priority=12]  # ERR_REWORK_LIMIT_EXCEEDED (business_constraint)
        distinguishing_aspect: |
          Different error-category pair: business_safety vs business_constraint.
          Different from the first instance (state vs business_referential).
          With invoice_authenticated=false AND rework_count==4 (already exceeded),
          ERR_INVOICE_NOT_AUTHENTIC at priority 6 wins.
        test_recipe:
          setup:
            - "Project P ACTIVE; BudgetItem APPROVED"
            - "Reimbursement R with invoice_authenticated=false; rework_count manually advanced to 4 via three reject cycles + one extra (set up so both checks would fail simultaneously)"
          trigger:
            - "POST /reimbursements/{R}/submit"
          assert:
            - "Response error_id == 'ERR_INVOICE_NOT_AUTHENTIC'"
            - "Response NOT 'ERR_REWORK_LIMIT_EXCEEDED'"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: per_diem_strict_greater_than_boundary
        grounds:
          - calculations.per_diem_compliance_check
          - entities.Reimbursement.fields.amount
          - entities.ComplianceRule.fields.parameters
          - endpoints[POST /reimbursements/{reimbursementId}/submit]
        distinguishing_aspect: |
          Boundary on numeric metric Reimbursement.amount with STRICT >. amount
          == 800.00 produces no finding; amount == 800.01 yields ESCALATE.
          Different metric and different endpoint than the empty-set boundary
          below.
        test_recipe:
          setup:
            - "ComplianceRule PER_DIEM_CAP applies_to_funding_source=ALL applies_to_category=TRAVEL parameters={daily_cap: 800} severity=ESCALATE active=true"
            - "Project P ACTIVE; BudgetItem TRAVEL APPROVED with approved_amount=10000"
            - "Two Reimbursements: R1 amount=800.00, R2 amount=800.01"
          trigger:
            - "POST /reimbursements/{R1}/submit"
            - "POST /reimbursements/{R2}/submit"
          assert:
            - "R1.compliance_findings does NOT contain rule_id=='PER_DIEM_CAP'"
            - "R2.compliance_findings contains exactly one entry with rule_id=='PER_DIEM_CAP' and severity=='ESCALATE'"

      - name: project_approve_empty_peer_review_set_boundary
        grounds:
          - validations[priority=13]
          - state_machines.Project.UNDER_REVIEW_to_APPROVED
          - entities.PeerReview
          - endpoints[POST /projects/{projectId}/approve]
        distinguishing_aspect: |
          Empty/zero-count boundary on a different metric (collection size of
          PeerReview rows) reached through a different endpoint. With 2
          PeerReviews, count=2 < 3 → ERR_INSUFFICIENT_REVIEWS; with the third
          peer review attached, approve succeeds. Different from numeric strict-
          inequality boundary above.
        test_recipe:
          setup:
            - "Project P with two PeerReviews (recommendation=APPROVE)"
          trigger:
            - "POST /projects/{P}/approve  (boundary: 2 reviews)"
            - "POST /projects/{P}/peer-reviews (recommendation=APPROVE)  → now 3 reviews"
            - "POST /projects/{P}/approve  (boundary: 3 reviews)"
          assert:
            - "First approve returns error_id == 'ERR_INSUFFICIENT_REVIEWS'"
            - "Second approve returns 200 and Project.status == 'APPROVED'"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: reimbursement_submit_requires_project_active
        grounds:
          - validations[priority=5]
          - state_machines.Reimbursement.DRAFT_to_SUBMITTED
          - entities.Project.fields.status
          - entities.Reimbursement.fields.project_id
        distinguishing_aspect: |
          Cross-entity dependency: Reimbursement DRAFT → SUBMITTED is gated by
          Project.status == ACTIVE. Pair = (Reimbursement, Project). The Project
          and Reimbursement entities are joined by project_id FK.
        test_recipe:
          setup:
            - "Project P APPROVED (not yet ACTIVE)"
            - "BudgetItem APPROVED"
            - "Reimbursement R DRAFT with valid fields"
          trigger:
            - "POST /reimbursements/{R}/submit"
          assert:
            - "Response error_id == 'ERR_PROJECT_NOT_ACTIVE'"
            - "Reimbursement.status remains 'DRAFT'"

      - name: budget_adjustment_finance_approve_requires_budget_item_version_match
        grounds:
          - validations[priority=16]
          - state_machines.BudgetAdjustment.UNDER_REVIEW_to_APPROVED
          - entities.BudgetItem.fields.version
          - entities.BudgetAdjustment.fields.pinned_budget_versions
        distinguishing_aspect: |
          Different entity pair (BudgetAdjustment, BudgetItem) than instance 1.
          BudgetAdjustment finance-approve transition is gated by the version
          field of EACH affected BudgetItem matching pinned_budget_versions.
        test_recipe:
          setup:
            - "Project P ACTIVE with two BudgetItems A (approved_amount 1000, version=2), B (approved_amount 500, version=2)"
            - "BudgetAdjustment ADJ1 line_changes=[{A,-100},{B,+100}], submitted (pinned_budget_versions={A:2, B:2})"
            - "Concurrent BudgetAdjustment ADJ2 on A only: dept-approved and finance-approved → A.version becomes 3"
          trigger:
            - "POST /budget-adjustments/{ADJ1}/finance-approve"
          assert:
            - "Response error_id == 'ERR_STALE_BUDGET_VERSION'"
            - "BudgetAdjustment ADJ1.status remains 'UNDER_REVIEW'"
            - "BudgetItem A.approved_amount unchanged by ADJ1's finance-approve attempt"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: reimbursement_invoice_date_must_lie_in_project_active_window
        grounds:
          - validations[priority=15]
          - entities.Reimbursement.fields.invoice_date
          - entities.Project.fields.planned_start_date
          - endpoints[POST /reimbursements]
        distinguishing_aspect: |
          Interval semantics #1: half-open window [planned_start_date, now()].
          The Project's active interval is the resource; the Reimbursement's
          invoice_date is the point being placed in it. Closed lower bound,
          dynamic (clock-driven) upper bound.
        test_recipe:
          setup:
            - "Project P with planned_start_date = T_start; clock advanced to T_now > T_start"
            - "BudgetItem APPROVED"
          trigger:
            - "POST /reimbursements with invoice_date == T_start - 1 (before window)"
            - "POST /reimbursements with invoice_date == T_now + 1 (after window)"
          assert:
            - "Both calls return error_id == 'ERR_INVOICE_DATE_OUT_OF_RANGE'"
            - "A subsequent POST with invoice_date == T_start (closed lower bound) succeeds (201)"

      - name: reimbursement_invoice_number_uniqueness_per_project
        grounds:
          - validations[priority=21]
          - entities.Reimbursement.fields.invoice_number
          - entities.Reimbursement.fields.project_id
          - endpoints[POST /reimbursements]
        distinguishing_aspect: |
          Different interval semantics: discrete uniqueness across
          project-scoped buckets (case-insensitive) instead of a continuous
          time interval. The "resource" is the per-project invoice-number
          namespace; collision detection is exact-match-modulo-case (no
          adjacency, no buffer). Distinct from instance 1's continuous-window
          rule and sits on the Reimbursement entity but with a different
          conflict geometry.
        test_recipe:
          setup:
            - "Project P ACTIVE; BudgetItem APPROVED"
            - "Create Reimbursement R1 invoice_number='INV-001'"
          trigger:
            - "POST /reimbursements with project_id=P, invoice_number='inv-001' (different case)"
          assert:
            - "Response error_id == 'ERR_DUPLICATE_INVOICE_NUMBER'"
            - "Across two different projects, identical invoice_number is allowed (control case)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: budget_adjustment_zero_sum_invariant_on_total_budget
        grounds:
          - calculations.budget_execution_rate
          - state_machines.BudgetAdjustment.UNDER_REVIEW_to_APPROVED
          - entities.Project.fields.total_budget
          - validations[priority=10]
        distinguishing_aspect: |
          Conserved quantity: Project.total_budget. The forward action
          (BudgetAdjustment finance-approve) and its compensating action
          (every line_change has a matching opposite delta within the SAME
          adjustment, sum to 0 within ±0.01) MUST leave Project.total_budget
          unchanged. Invariant: total_budget_after == total_budget_before.
        test_recipe:
          setup:
            - "Project P ACTIVE with BudgetItems A=1000, B=500; Project.total_budget=1500"
            - "BudgetAdjustment ADJ line_changes=[{A,-300},{B,+300}], justified, submitted, dept-approved"
          trigger:
            - "POST /budget-adjustments/{ADJ}/finance-approve"
          assert:
            - "BudgetItem A.approved_amount == 700.00"
            - "BudgetItem B.approved_amount == 800.00"
            - "Project.total_budget == 1500.00 (unchanged — conserved)"

      - name: reimbursement_rework_invariant_on_budget_remaining
        grounds:
          - state_machines.Reimbursement.SUBMITTED_to_DRAFT
          - state_machines.Reimbursement.UNDER_REVIEW_to_DRAFT
          - state_machines.Reimbursement.APPROVED_to_PAID
          - entities.BudgetItem.fields.spent_amount
          - entities.BudgetItem.fields.remaining_amount
        distinguishing_aspect: |
          Different conserved quantity: BudgetItem.remaining_amount during
          rework cycles. Forward action submit/approve does NOT debit until PAID;
          compensating reject/rework returns the reimbursement to DRAFT without
          having debited. Invariant: as long as Reimbursement status never
          reaches PAID, BudgetItem.spent_amount is unchanged across any number
          of submit→reject cycles. Distinct from total_budget conservation.
        test_recipe:
          setup:
            - "Project P ACTIVE; BudgetItem MATERIALS approved_amount=1000, spent_amount=0, remaining_amount=1000"
            - "Reimbursement R amount=400, DRAFT"
          trigger:
            - "POST /reimbursements/{R}/submit"
            - "POST /reimbursements/{R}/pi-approve"
            - "POST /reimbursements/{R}/dept-approve"
            - "POST /reimbursements/{R}/reject body={rejection_reason: 'cycle 1'}"
            - "POST /reimbursements/{R}/submit"
            - "POST /reimbursements/{R}/rework"
          assert:
            - "BudgetItem.spent_amount == 0.00"
            - "BudgetItem.remaining_amount == 1000.00"
            - "Reimbursement.rework_count == 2"
