    side_effects: []
  - method: POST
    path: "/opera/rental-offers/{id}/settle"
    description: "Settle an accepted offer after the rental window (SoD: caller != creator)"
    roles: [ProductionManager]
    code: 200
    input: []
    output: RentalOffer
    side_effects: ["final_settlement_cents computed"]
  - method: POST
    path: "/opera/rental-offers/{id}/counter"
    description: "Renter counters the offer (round cap 5)"
    roles: [PartnerRepresentative]
    code: 200
    input: [countered_fee_cents]
    output: RentalOffer
    side_effects: []
  - method: POST
    path: "/opera/rental-offers/{id}/accept"
    description: "Renter accepts the offer (requires standing GOOD)"
    roles: [PartnerRepresentative]
    code: 200
    input: []
    output: RentalOffer
    side_effects: []
  - method: POST
    path: "/opera/rental-offers/{id}/decline"
    description: "Renter declines the offer"
    roles: [PartnerRepresentative]
    code: 200
    input: []
    output: RentalOffer
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role not declared" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_RENTER_OWNERSHIP_MISMATCH, http: 403, condition: "PartnerRepresentative X-User-ID does not equal offer.renter_company_id" }
  - { id: ERR_SOD_SAME_USER_FORBIDDEN, http: 403, condition: "Segregation of duties: waiver approver == contract creator, or settle caller == offer creator" }
  - { id: ERR_VALIDATION, http: 400, condition: "Request shape invalid: missing required field, enum out of range, non-positive integer, share_percentage out of (0,100]" }
  - { id: ERR_INVALID_TIME_RANGE, http: 400, condition: "ends_at <= starts_at or window_end <= window_start" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A path or body id does not exist (validated left-to-right, path before body)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_production_version != Production.version (OCC)" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Generic illegal state transition for the target entity's state machine" }
  - { id: ERR_CALL_NOT_OPEN, http: 409, condition: "Participant operations require the RehearsalCall in {DRAFT, PUBLISHED}" }
  - { id: ERR_CONTRACT_NOT_ACTIVE, http: 409, condition: "Operation requires the Contract in ACTIVE status" }
  - { id: ERR_OFFER_NOT_ACTIONABLE, http: 409, condition: "Rental offer action requires a specific offer status (e.g. send from DRAFT, counter/accept/decline from SENT)" }
  - { id: ERR_SALES_NOT_OPEN, http: 409, condition: "Hold/purchase requires performance sales_status == ON_SALE" }
  - { id: ERR_PRODUCTION_NOT_IN_REHEARSAL, http: 409, condition: "Call publish requires Production.status == REHEARSAL" }
  - { id: ERR_PRODUCTION_NOT_IN_REPERTORY_PHASE, http: 409, condition: "Performance create requires Production.status in {REHEARSAL, IN_REPERTORY}" }
  - { id: ERR_PERFORMANCE_NOT_ENDED, http: 409, condition: "Complete requires logical clock > performance.ends_at" }
  - { id: ERR_OFFER_WINDOW_NOT_ENDED, http: 409, condition: "Settle requires logical clock >= offer.window_end" }
  - { id: ERR_BUILD_ITEMS_NOT_DELIVERED, http: 409, condition: "BUILD -> REHEARSAL requires every non-cancelled BuildItem in {DELIVERED, IN_USE}" }
  - { id: ERR_NO_PERFORMANCES_SCHEDULED, http: 409, condition: "REHEARSAL -> IN_REPERTORY requires at least one Performance" }
  - { id: ERR_PRODUCTION_HAS_OPEN_COMMITMENTS, http: 409, condition: "Archive blocked by non-terminal RentalOffers or SCHEDULED performances" }
  - { id: ERR_READINESS_GATE_BLOCKED, http: 409, condition: "tech-ready gate failed: no DONE tech stage slot before curtain, or default-language surtitle track not LIVE" }
  - { id: ERR_ROOM_TIME_CONFLICT, http: 409, condition: "Half-open overlap with another DRAFT/PUBLISHED call on the same room" }
  - { id: ERR_STAGE_CHANGEOVER_CONFLICT, http: 409, condition: "Stage slot violates changeover buffer (2h same production, 6h cross production)" }
  - { id: ERR_REST_FLOOR_VIOLATION, http: 422, condition: "Gap between committed calls below contract.rest_floor_hours and no waiver requested" }
  - { id: ERR_DUPLICATE_PARTICIPANT, http: 409, condition: "A non-terminal participant already exists for (call_id, contract_id)" }
  - { id: ERR_ROLE_PRINCIPAL_TAKEN, http: 409, condition: "Confirming a PRINCIPAL while another CONFIRMED PRINCIPAL exists on the role" }
  - { id: ERR_COVER_LINK_INVALID, http: 422, condition: "covers_assignment_id missing/invalid: must reference a PRINCIPAL assignment on the same role; required iff slot != PRINCIPAL" }
  - { id: ERR_CROSS_PRODUCTION_REFERENCE, http: 422, condition: "contract.production_id != role.production_id on cast-assignment create" }
  - { id: ERR_PARTNER_KIND_MISMATCH, http: 422, condition: "Co-production share requires partner_kind == CO_PRODUCER; rental offer requires partner_kind == RENTER" }
  - { id: ERR_SHARE_PERCENT_OVERFLOW, http: 422, condition: "Sum of RATIFIED share percentages + candidate > 100" }
  - { id: ERR_INSUFFICIENT_SEATS, http: 409, condition: "Requested quantity exceeds available (hold/purchase) or held (release) seats" }
  - { id: ERR_BUILD_BUDGET_EXCEEDED, http: 402, condition: "Build item quoted cost (or actual-vs-quoted delta) exceeds production build_cost_balance_cents" }
  - { id: ERR_RENTER_STANDING_NOT_GOOD, http: 409, condition: "Renter standing must be GOOD to accept an offer" }
  - { id: ERR_NEGOTIATION_ROUND_LIMIT, http: 422, condition: "Counter rejected: negotiation_rounds already at MAX_NEGOTIATION_ROUNDS (5)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator: registers partner companies, drives the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /opera/partner-companies"
      - "POST /opera/partner-companies/{id}/transition"
      - "POST /_clock/set_current_utc"
    shared_operations: ["all GET endpoints (via Any)"]
  - name: ProductionManager
    description: "Company-side production head: productions, build items, co-production shares, rental offers, performance cancel"
    identity: opaque
    exclusive_operations:
      - "POST /opera/productions and /transition"
      - "POST /opera/build-items and /transition"
      - "POST /opera/co-production-shares and /transition"
      - "POST /opera/rental-offers, /send, /revise, /withdraw, /settle"
      - "POST /opera/performances/{id}/cancel"
    shared_operations: ["all GET endpoints (via Any)"]
  - name: CastingDirector
    description: "Casting authority: roles, cast assignments, cover chains"
    identity: opaque
    exclusive_operations:
      - "POST /opera/roles"
      - "POST /opera/cast-assignments, /confirm, /release"
    shared_operations: ["all GET endpoints (via Any)"]
  - name: ContractsOfficer
    description: "Artist contracts and call sheets participation; rest-floor waivers require a different ContractsOfficer than the contract creator (segregation of duties)"
    identity: opaque
    exclusive_operations:
      - "POST /opera/artists"
      - "POST /opera/contracts and /transition"
      - "POST /opera/call-participants and /transition and /approve-waiver"
    shared_operations: ["all GET endpoints (via Any)"]
  - name: TechnicalDirector
    description: "Technical operations: rooms, rehearsal calls, stage slots, surtitles, performance readiness"
    identity: opaque
    exclusive_operations:
      - "POST /opera/rehearsal-rooms"
      - "POST /opera/rehearsal-calls and /transition"
      - "POST /opera/stage-slots and /transition"
      - "POST /opera/surtitle-tracks and /transition"
      - "POST /opera/performances/{id}/tech-ready and /clear"
    shared_operations: ["all GET endpoints (via Any)"]
  - name: BoxOfficeManager
    description: "Ticketing: performances, sales windows, seat inventory holds and sales"
    identity: opaque
    exclusive_operations:
      - "POST /opera/performances, /open-sales, /suspend-sales, /close-sales, /complete"
      - "POST /opera/seat-inventories/{id}/hold, /release, /purchase"
    shared_operations: ["all GET endpoints (via Any)"]
  - name: PartnerRepresentative
    description: "Renter company representative: counters, accepts, or declines rental offers addressed to their company; X-User-ID must equal the renter PartnerCompany.id"
    identity: "entity_backed:PartnerCompany"
    exclusive_operations:
      - "POST /opera/rental-offers/{id}/counter, /accept, /decline"
    shared_operations: ["all GET endpoints (via Any)"]
  - name: Any
    description: "Read-only role shared by all authenticated callers"
    identity: opaque
    exclusive_operations: []
    shared_operations: ["all GET endpoints"]
