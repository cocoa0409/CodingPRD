          list_types:
          - NATIONAL
          - INTERNAL
          expected_campaign_version: ${camp_v}
        as: CampaignManager
        captures:
          job_id: $.data.id
      - call: POST /compliance/scrub-jobs/${job_id}/execute
        payload: {}
        as: CampaignManager
      - call: GET /compliance/campaigns/${camp_id}
        payload: {}
        as: CampaignManager
        captures:
          camp_v2: $.data.version
      - call: POST /compliance/campaigns/${camp_id}/launch
        payload:
          certification_note: Certified for CA outreach
          expected_campaign_version: ${camp_v2}
        as: ComplianceOfficer
        as_user_id: officer-launcher
      trigger:
      - call: POST /compliance/contact-attempts
        payload:
          campaign_id: ${camp_id}
          contact_id: ${c1_id}
          channel: SMS
        as: DialerOperator
        captures:
          err_id: $.data.error_id
      assert:
      - the trigger returns 422 with data.error_id == "ERR_ATTEMPT_CHANNEL_MISMATCH"
      - Contact.${c1_id}.attempts_charged == 0 and attempt_budget_remaining == 3
      - Campaign.${camp_id}.permitted_attempt_count == 0
