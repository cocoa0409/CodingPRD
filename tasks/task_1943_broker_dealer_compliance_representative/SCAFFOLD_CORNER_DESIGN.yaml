              captures: { pa_rep: $.data.id, pa_rep_v: $.data.version }
            - call: "POST /supervision-plans"
              payload: { rep_id: "${pa_rep}", start_date: "2026-09-01", end_date: "2027-08-31", conditions: ["MONTHLY_REVIEW"], expected_representative_version: "${pa_rep_v}" }
              as: CompliancePrincipal
              as_user_id: "principal-a"
