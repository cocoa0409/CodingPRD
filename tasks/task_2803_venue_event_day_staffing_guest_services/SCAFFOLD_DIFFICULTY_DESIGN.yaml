              captures: { sr_1: $.data.id }
            - call: "POST /satisfaction-responses"
              payload: { event_id: "${ev_id}", zone_code: "Z701", score: 5 }
              as: GuestServicesSupervisor
            - call: "POST /satisfaction-responses"
              payload: { event_id: "${ev_id}", zone_code: "Z701", score: 5 }
              as: GuestServicesSupervisor
            - call: "POST /satisfaction-responses"
              payload: { event_id: "${ev_id}", zone_code: "Z701", score: 5 }
              as: GuestServicesSupervisor
            - call: "POST /satisfaction-responses"
              payload: { event_id: "${ev_id}", zone_code: "Z702", score: 4 }
              as: GuestServicesSupervisor
            - call: "POST /satisfaction-responses"
              payload: { event_id: "${ev_id}", zone_code: "Z702", score: 4 }
              as: GuestServicesSupervisor
            - call: "POST /satisfaction-responses"
              payload: { event_id: "${ev_id}", zone_code: "Z702", score: 4, comment: "Long queue at the elevator" }
              as: GuestServicesSupervisor
            - call: "POST /satisfaction-responses"
              payload: { event_id: "${ev_id}", zone_code: "Z702", score: 3 }
              as: GuestServicesSupervisor
          trigger:
            - call: "GET /events/${ev_id}/satisfaction-summary"
              payload: {}
              as: GuestExperienceDirector
            - call: "GET /events/${ev_id}/satisfaction-summary?zone_code=Z702"
              payload: {}
              as: GuestServicesSupervisor
          assert:
            - "unfiltered read: response_count == 8 and average_score == 4.38 (35 / 8 = 4.375 quantized HALF_UP; banker's rounding would give 4.37)"
            - "unfiltered read: promoter_share_bp == 8750 (7 of 8 rows score >= PROMOTER_SCORE_FLOOR 4; the single 3 is excluded)"
            - "unfiltered read: zone_breakdown has exactly 2 entries ordered by zone_code ASC - Z701 with response_count 4 and average_score 5.00, then Z702 with response_count 4 and average_score 3.75"
            - "unfiltered read: resolved_issue_count == 0 and sla_breached_issue_count == 0"
            - "filtered read: response_count == 4, average_score == 3.75, promoter_share_bp == 7500 and zone_breakdown has exactly 1 entry for Z702"
            - "SatisfactionResponse.${sr_1} has no version field and no update endpoint exists for it (common_fields: false), so the aggregate can never be retro-edited"
            - "both reads are pure: repeating the unfiltered read returns byte-identical numbers and Event.${ev_id}.version is unchanged"

      - name: fill_rate_exactly_8000_bp_holds_the_ratio
        grounds:
