          - SWISS_SETUP
        as: ShopPlanner
        as_user_id: planner-1
        captures:
          op_mach: $.data.id
      - call: POST /swiss-shop/machines
        payload:
          asset_tag: SW-01
          max_bar_diameter_mm: 20.0
          lights_out_certified: true
        as: ShopPlanner
        as_user_id: planner-1
        captures:
          m1: $.data.id
      - call: POST /swiss-shop/machines
        payload:
          asset_tag: SW-02
          max_bar_diameter_mm: 20.0
          lights_out_certified: true
        as: ShopPlanner
        as_user_id: planner-1
        captures:
          m2: $.data.id
      - call: POST /swiss-shop/tool-assignments
        payload:
          machine_id: ${m1}
          station: 5
          tool_code: TA
          expected_life_pieces: 100
          drift_limit_um: 8
        as: ShopPlanner
        as_user_id: planner-1
        captures:
          t1: $.data.id
      - call: POST /swiss-shop/tool-assignments
        payload:
          machine_id: ${m2}
          station: 5
          tool_code: TB
          expected_life_pieces: 100
          drift_limit_um: 8
        as: ShopPlanner
        as_user_id: planner-1
        captures:
          t2: $.data.id
      trigger:
      - call: POST /swiss-shop/tool-assignments/${t2}/offset-logs
        payload:
          pieces_produced: 99
          measured_drift_um: 1
        as: Machinist
        as_user_id: ${op_mach}
        captures:
          under: $.data.status
          under_p: $.data.pieces_since_index
      - call: POST /swiss-shop/tool-assignments/${t1}/offset-logs
        payload:
          pieces_produced: 100
          measured_drift_um: 1
