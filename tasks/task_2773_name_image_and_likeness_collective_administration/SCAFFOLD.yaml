# ============================================================================
# §1.7 TABLE 7 — RBAC
# Identity headers: X-User-Role (one of the six roles) and X-User-ID (an opaque
# actor handle). Only the Athlete role is entity-backed; the other five are
# opaque service roles distinguished by X-User-Role alone. X-User-ID is
# nonetheless load-bearing for every role because segregation of duties compares
# the release initiator with the deliverable verifier.
# ============================================================================
roles:

  - name: PlatformAdmin
    backing: opaque
    description: "Operator of the platform. Onboards collectives, changes entity structure, and drives the logical clock."
    exclusive_operations:
      - "POST /nil/_clock/set_current_utc"
      - "POST /nil/collectives"
      - "PATCH /nil/collectives/{id}/entity-structure"
    shared_operations:
      - "All GET endpoints except GET /nil/donor-members, GET /nil/donor-members/{id}, GET /nil/commitments, GET /nil/commitments/{id}, GET /nil/contributions and GET /nil/contributions/{id}, which it also reads."

  - name: CollectiveDirector
    backing: opaque
    description: "Runs fundraising and contracting for the collective: tiers, donors, commitments, contributions, athletes, contracts, deliverables and communication logs."
    exclusive_operations:
      - "POST /nil/collectives/{id}/membership-tiers"
      - "POST /nil/membership-tiers/{id}/transitions"
      - "POST /nil/donor-members"
      - "PATCH /nil/donor-members/{id}/tax-profile"
      - "POST /nil/commitments"
      - "POST /nil/commitments/{id}/transitions"
      - "POST /nil/commitments/{id}/restructure"
      - "POST /nil/deal-contracts"
      - "POST /nil/deal-contracts/roster-allocations"
      - "POST /nil/deal-contracts/{id}/activation"
      - "POST /nil/deal-contracts/{id}/deliverables"
    shared_operations:
      - "POST /nil/contributions and POST /nil/contributions/{id}/settlements (with TreasuryOfficer)"
      - "POST /nil/athletes (with ComplianceOfficer)"
      - "POST /nil/deal-contracts/{id}/compliance-submissions and POST /nil/deal-contracts/{id}/termination (with ComplianceOfficer)"
      - "POST /nil/deliverables/{id}/evidence and POST /nil/deliverables/{id}/submissions (with Athlete)"
      - "POST /nil/communication-logs (with ComplianceOfficer)"
      - "All GET endpoints"

  - name: ComplianceOfficer
    backing: opaque
    description: "Owns eligibility, taxpayer documentation and deliverable verification. The only role that may review a deliverable or change an athlete's eligibility."
    exclusive_operations:
      - "POST /nil/athletes/{id}/eligibility-changes"
      - "POST /nil/deliverables/{id}/reviews"
    shared_operations:
      - "POST /nil/athletes (with CollectiveDirector)"
      - "PATCH /nil/athletes/{id}/tax-profile (with TreasuryOfficer)"
      - "POST /nil/deal-contracts/{id}/compliance-submissions and POST /nil/deal-contracts/{id}/termination (with CollectiveDirector)"
      - "POST /nil/communication-logs (with CollectiveDirector)"
      - "All GET endpoints"

  - name: InstitutionReviewer
    backing: opaque
    description: "The institution's compliance office. Adjudicates disclosures and reads everything, but may not create, fund, contract or pay."
    exclusive_operations:
      - "POST /nil/deal-contracts/{id}/compliance-decisions"
    shared_operations:
      - "All GET endpoints"

  - name: Athlete
    backing: "entity_backed:Athlete"
    description: >
      The student-athlete. The caller's X-User-ID must equal
      Athlete.portal_user_id, and the athlete may only touch deliverables whose
      parent DealContract names that athlete (validation priority 4).
    exclusive_operations: []
    shared_operations:
      - "POST /nil/deliverables/{id}/evidence and POST /nil/deliverables/{id}/submissions (with CollectiveDirector), restricted to their own deliverables"
      - "GET /nil/collectives/{id}, GET /nil/collectives, GET /nil/athletes/{id}, GET /nil/membership-tiers/{id}, GET /nil/collectives/{id}/membership-tiers, GET /nil/deal-contracts/{id}, GET /nil/deal-contracts, GET /nil/deal-contracts/{id}/deliverables, GET /nil/deliverables/{id}, GET /nil/payment-releases/{id}, GET /nil/payment-releases"
    denied_operations:
      - "Every donor-facing read (GET /nil/donor-members, GET /nil/commitments, GET /nil/contributions and their detail forms) and every write outside deliverable evidence and submissions -> ERR_UNAUTHORIZED"

  - name: TreasuryOfficer
    backing: opaque
    description: "Moves money: settlements, refunds, billing runs, payment releases and reversals. Segregated from deliverable verification by validation priority 22."
    exclusive_operations:
      - "POST /nil/contributions/{id}/refund"
      - "POST /nil/collectives/{id}/billing-runs"
      - "POST /nil/payment-releases"
      - "POST /nil/payment-releases/{id}/reversals"
    shared_operations:
      - "POST /nil/contributions and POST /nil/contributions/{id}/settlements (with CollectiveDirector)"
      - "PATCH /nil/athletes/{id}/tax-profile (with ComplianceOfficer)"
      - "All GET endpoints"
