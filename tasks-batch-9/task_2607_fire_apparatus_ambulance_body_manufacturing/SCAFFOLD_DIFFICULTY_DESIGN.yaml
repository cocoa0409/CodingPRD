  - rule_id: compensating_invariant
    instances:

      - name: rescind_restores_money_and_axle_loads_without_undoing_state_hops
        grounds:
          - state_machines.ChangeOrder.APPROVED_to_RESCINDED
          - calculations.unit_change_order_total
          - calculations.axle_load_distribution
          - calculations.program_committed_cents
        distinguishing_aspect: |
          Rescind is a partial compensation by design: the two conserved quantities
          (UnitOrder.change_order_total_cents and ApparatusProgram.committed_cents)
          and the axle loads return to their exact pre-approval values with zero
          drift, while the cascade's state hops (certification reset, build_status
          revert, cancelled FINAL trip) are deliberately NOT reversed.
        test_recipe:
          setup:
            - "the full CASCADE A setup: program ACTIVE (ceiling 400000000, committed_cents 68276000), one PUMPER UnitOrder FINAL_INSPECTED / CERTIFIED with rear_axle_load_kg 10110 == rating, one PASSED CertificationTest, one SCHEDULED FINAL trip"
            - "one SUBMITTED ChangeOrder worth 500000 with weight_delta_rear_kg 1"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Compensation program", agency_name: "Ashland Fire", base_year: 2024, base_unit_price_cents: 62500000, escalation_index_pct_per_year: 4.0, max_option_units: 1, contract_ceiling_cents: 400000000 }
              as: ProgramAdmin
