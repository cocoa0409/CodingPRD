          collisions are compared as inclusive UTC calendar-DATE sets scoped to the DRIVER across
          different loads, so a claim running 2026-08-07T18:00Z-2026-08-08T10:00Z collides with a
          stored 2026-08-05T20:00Z-2026-08-07T06:00Z claim on another load even though the instants
