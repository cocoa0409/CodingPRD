scenario: "949. Home-Staging & Real-Estate Prep Service: consultation & scope (occupied/vacant), inventory & furniture-rental pull, staging install & lease term, de-stage/pickup scheduling, agent/seller billing & package, damage/loss, photography linkage, extension"
domain_name: "home-staging-real-estate-prep"
api_prefix: "/staging"

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: graph
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: immediate
  structural_device: |
    TWO STRUCTURALLY DIFFERENT PIPELINES SHARING ONE DERIVATION LADDER.
    Pipeline O (OCCUPIED prep) — the seller still lives in the home. The consultation
    produces a room-by-room EDIT / DECLUTTER / REFRESH scope over the seller's own
    furnishings plus selective accessory placement. There is little or no rental pull,
    work is executed as a series of billable Visits rather than one Install day, billing
    is hourly/consultative, and there is NO Lease: "extension" means extending the
    project's SERVICE WINDOW, not a furniture lease term.
    Pipeline V (VACANT staging) — the property is empty. The consultation produces a room
    PACKAGE; an InventoryPull commits owned warehouse stock and/or partner-vendor rental
    units; an Install event stages the home; a Lease term in whole 30-day cycles starts at
    install-complete; a Pickup de-stages at lease end; DamageAssessments are raised per
    line at pickup; Extensions are granted in whole cycles subject to per-item vendor
    availability and may land PARTIAL.
    BOTH pipelines share the SAME numbered validation ladder (§1.4) for authentication,
    authorization, party scope, global freeze, state preconditions, OCC, package/pricing
    authority, payer routing, photography linkage, invoicing and closeout. They diverge
    only on inventory commitment (Pipeline O never commits a pull), lease arithmetic
    (Pipeline O has no Lease rows at all), and the pickup/damage tail (Pipeline O closes
    out straight from the last completed Visit).

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

