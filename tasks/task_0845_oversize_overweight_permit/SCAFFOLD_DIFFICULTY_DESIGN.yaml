              captures: { escort_id: $.data.id }
          trigger:
            - call: "POST /escort-assignments/${escort_id}/confirm"
              payload: {}
              as: Carrier
              as_user_id: "${carrier_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_PILOT_CAR_UNAVAILABLE"
            - "EscortAssignment.${escort_id}.status == PENDING (unchanged)"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: pilot_car_halfopen_double_booking
        grounds:
          - state_machines.EscortAssignment.PENDING_to_CONFIRMED
          - validations[priority=21]
        distinguishing_aspect: >-
          PilotCar bookings use HALF-OPEN [start,end) intervals: E1[10:00,12:00) and
          E2[11:00,13:00) collide (ERR_PILOT_CAR_DOUBLE_BOOKED), but E3[12:00,13:00)
          back-to-back with E1 is allowed (adjacency shares no interior point).
        test_recipe:
          setup:
            - "One pilot car; one permit with three PENDING escort assignments on that pilot: E1[10:00,12:00), E2[11:00,13:00), E3[12:00,13:00); E1 already CONFIRMED."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { legal_name: "Overlap Freight", usdot_number: "USDOT-RT1" }
              as: DOTAdmin
              captures: { carrier_id: $.data.id }
            - call: "POST /pilot-cars"
              payload: { company_name: "Solo Escort", cert_number: "PC-RT1" }
