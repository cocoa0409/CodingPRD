          license_number: L-OC1
          license_state: OR
          brokerage_id: ${boc}
        as: PlatformAdmin
        captures:
          ao1: $.data.id
      - call: POST /agents
        payload:
          full_name: OCC2
          email: oc2@x.com
          license_number: L-OC2
          license_state: OR
          brokerage_id: ${boc}
        as: PlatformAdmin
        captures:
          ao2: $.data.id
      - call: POST /share-orders
        payload:
          market_id: ${moc}
          buyer_agent_id: ${ao1}
          share_bps: 6000
          duration_days: 30
        as: Agent
        as_user_id: ${ao1}
        captures:
          oo1: $.data.id
      - call: POST /share-orders
        payload:
          market_id: ${moc}
          buyer_agent_id: ${ao2}
          share_bps: 2000
          duration_days: 30
