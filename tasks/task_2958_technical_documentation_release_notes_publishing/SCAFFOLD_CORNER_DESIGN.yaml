      - name: deprecation_notice_one_day_short_of_the_minimum_rejected
        claim_type: violation_to_error
        grounds: ["validations.priority_46", "calculations.deprecation_timeline_compliance.constants", "errors.ERR_NOTICE_PERIOD_TOO_SHORT"]
        distinguishing_aspect: "A MAJOR deprecation announced 2026-08-05 for removal 2026-11-02 is exactly 89 days of notice against a 90-day minimum and must be refused, with no DeprecationNotice row created. The date window itself is valid (announce <= deprecated < removal), so priority 45 cannot fire and the notice-period rule is the only thing that can reject."
        test_recipe:
          setup:
            - "One release train with one existing topic to serve as the migration guide."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
