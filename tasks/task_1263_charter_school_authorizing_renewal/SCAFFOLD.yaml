  # --- Closure ---
  - method: POST
    path: "/authorizer/schools/{id}/closure-plans"
    description: "Board initiates closure (REVOCATION needs open REVOCATION_REVIEW notice; VOLUNTARY free; NON_RENEWAL system-only)"
    roles: [BoardMember]
