              payload: { grower_id: "${g1}", variety: "Nonpareil", gross_weight_lbs: 2000 }
              as: IntakeOperator
              captures: { lotA: $.data.id }
            - call: "POST /lab-tests"
              payload: { lot_id: "${lotA}", test_type: "MOISTURE_KERNEL", moisture_pct: 6.0, kernel_pct: 0.50, foreign_material_pct: 0.01 }
              as: LabTechnician
            - call: "POST /lots"
              payload: { grower_id: "${g1}", variety: "Nonpareil", gross_weight_lbs: 2000 }
              as: IntakeOperator
              captures: { lotB: $.data.id }
            - call: "POST /lab-tests"
              payload: { lot_id: "${lotB}", test_type: "MOISTURE_KERNEL", moisture_pct: 6.0, kernel_pct: 0.50, foreign_material_pct: 0.01 }
              as: LabTechnician
          trigger:
            - call: "POST /lab-tests"
              payload: { lot_id: "${lotA}", test_type: "AFLATOXIN", aflatoxin_ppb: 19.9 }
              as: LabTechnician
              captures: { tA: $.data.aflatoxin_verdict }
            - call: "POST /lab-tests"
              payload: { lot_id: "${lotB}", test_type: "AFLATOXIN", aflatoxin_ppb: 20.0 }
              as: LabTechnician
              captures: { tB: $.data.aflatoxin_verdict }
          assert:
            - "LabTest for lot A: aflatoxin_verdict == PASS; FieldLot.${lotA}.status == GRADED"
            - "LabTest for lot B: aflatoxin_verdict == FAIL; FieldLot.${lotB}.status == REJECTED (boundary 20.0 rejects under >=)"

