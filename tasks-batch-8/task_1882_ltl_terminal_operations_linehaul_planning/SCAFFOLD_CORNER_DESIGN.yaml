  # =====================================================================
  # Section: cross_cutting_layers
  # =====================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_version_increments_on_every_mutation
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[trailer-manifest-stale-version]", entities.OutboundTrailer]
        distinguishing_aspect: "Each mutation (manifest-add, remove, seal, reopen) increments OutboundTrailer.version by exactly 1; reusing the pre-mutation version fails 412."
        test_recipe:
          setup: ["Trailer with one manifested shipment"]
          setup_api_calls:
            - { call: "POST /ltl/terminals", payload: { code: "CHI", name: "Chicago", dock_doors: 12 }, as: TerminalAdmin, captures: { t_chi: $.data.id } }
            - { call: "POST /ltl/terminals", payload: { code: "ATL", name: "Atlanta", dock_doors: 10 }, as: TerminalAdmin, captures: { t_atl: $.data.id } }
