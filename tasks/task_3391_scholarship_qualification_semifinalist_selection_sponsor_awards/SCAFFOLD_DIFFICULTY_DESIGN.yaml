            - call: "POST /api/college-institutions"
              payload: { legal_name: "State University", college_code: "SU", award_amount_cents: 100000, renewable_years_total: 2, terms_per_year: 2, pool_total_cents: 1000000, max_awards: 5 }
              as: ProgramAdmin
