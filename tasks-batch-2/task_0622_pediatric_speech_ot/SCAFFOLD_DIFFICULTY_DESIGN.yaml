  - rule_id: cross_entity_state_dependency
    instances:
      - name: booking_requires_authorization_active_not_expired
        grounds:
          - state_machines.Appointment.SCHEDULED_to_COMPLETED
          - state_machines.Authorization.ACTIVE_to_EXPIRED
          - validations[priority=7]
          - errors[ERR_AUTH_WINDOW_VIOLATION]
        distinguishing_aspect: |
          Appointment booking (Appointment) depends on Authorization state: once
          the logical clock passes valid_until the authorization auto-transitions
          to EXPIRED, and a subsequent booking that would draw on it is rejected
          with ERR_AUTH_WINDOW_VIOLATION. Entity pair Appointment -> Authorization.
