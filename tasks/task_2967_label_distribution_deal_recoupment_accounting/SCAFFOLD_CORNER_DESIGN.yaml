      - name: leftover_allocation_cents_follow_the_largest_fractional_parts
        claim_type: aggregation
        grounds:
          - calculations.deal_net_receipts.formula
          - calculations.deal_net_receipts.order_sensitivity
          - entities.DspRevenueLine.net_receipts_cents
          - endpoints[POST /dsp-revenue-reports/{id}/accept]
        distinguishing_aspect: |
          STEP 3's largest-remainder split of distributor_share 120000 over line weights
          [400000, 300000, 100001] has exact parts 59999.925 / 44999.944 / 15000.131, so the two
          leftover cents go to the SECOND then the FIRST line, never to the last. The correct line
          net receipts are [340000, 255000, 85001]; "leftovers to the last line" gives
