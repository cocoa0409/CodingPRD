  - name: substantiated_case_suspends_the_household_and_empties_its_open_requisition
    grounds: state_machines.NonSolicitationCase.INVESTIGATING -> SUBSTANTIATED (cascade hops 2-5); state_machines.Client.ONBOARDED
      -> SUSPENDED; state_machines.TrialEngagement.SCHEDULED -> CANCELLED; state_machines.RoleRequisition.TRIALING
