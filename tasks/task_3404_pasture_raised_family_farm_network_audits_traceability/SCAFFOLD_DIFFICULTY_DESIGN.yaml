            - call: "POST /farm-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-09T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /farm-network/routes/${r2_id}/stops/1/collect"
              payload: { collected_cases: 1, laid_start_date: "2026-09-07", laid_end_date: "2026-09-08" }
              as: PlantOperator
              captures: { lot2_id: $.data.id }
            - call: "POST /farm-network/lots/${lot2_id}/grade"
              payload: { quality_score: 75 }
              as: QualityManager
            - call: "POST /farm-network/lots/${lot2_id}/cartons"
              payload: { carton_count: 17, pack_size: "MEDIUM" }
              as: PlantOperator
            - call: "POST /farm-network/routes"
              payload: { route_date: "2026-09-10", driver_name: "Dale", capacity_cases: 10 }
              as: PlantOperator
              captures: { r3_id: $.data.id }
            - call: "POST /farm-network/routes/${r3_id}/stops"
