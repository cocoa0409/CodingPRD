            - { call: "POST /arff/vehicles", payload: { call_sign: "RED-2", water_capacity_gal: 2000, dry_chem_capacity_lb: 500 }, as: ArffChief, captures: { veh2: $.data.id } }
            - { call: "POST /arff/readiness-checks", payload: { vehicle_id: "${veh1}", water_available_gal: 2000, dry_chem_available_lb: 500, discharge_system_ok: true }, as: ArffChief }
            - { call: "POST /arff/readiness-checks", payload: { vehicle_id: "${veh2}", water_available_gal: 2000, dry_chem_available_lb: 500, discharge_system_ok: true }, as: ArffChief }
            - { call: "POST /arff/firefighters", payload: { employee_no: "FF-101", full_name: "Ann Lee" }, as: ArffChief, captures: { ff1: $.data.id } }
            - { call: "POST /arff/firefighters", payload: { employee_no: "FF-102", full_name: "Ben Kim" }, as: ArffChief, captures: { ff2: $.data.id } }
            - { call: "POST /arff/firefighters", payload: { employee_no: "FF-103", full_name: "Cal Ray" }, as: ArffChief, captures: { ff3: $.data.id } }
            - { call: "POST /arff/firefighters", payload: { employee_no: "FF-104", full_name: "Dee Fox" }, as: ArffChief, captures: { ff4: $.data.id } }
            - { call: "POST /arff/live-fire-training-records", payload: { firefighter_id: "${ff1}", completed_on: "2026-04-15", drill_type: "AIRCRAFT", result: "PASS" }, as: ArffChief }
            - { call: "POST /arff/live-fire-training-records", payload: { firefighter_id: "${ff2}", completed_on: "2026-04-15", drill_type: "AIRCRAFT", result: "PASS" }, as: ArffChief }
            - { call: "POST /arff/live-fire-training-records", payload: { firefighter_id: "${ff3}", completed_on: "2026-04-15", drill_type: "STRUCTURAL", result: "PASS" }, as: ArffChief }
            - { call: "POST /arff/live-fire-training-records", payload: { firefighter_id: "${ff4}", completed_on: "2026-04-15", drill_type: "STRUCTURAL", result: "PASS" }, as: ArffChief }
            - { call: "POST /arff/mutual-aid-agreements", payload: { partner_airport_code: "KCTY", max_alert_level: "ALERT_3", start_date: "2026-01-01", end_date: "2026-12-31" }, as: AirportManager, captures: { ag1: $.data.id } }
            - { call: "POST /arff/mutual-aid-agreements/${ag1}/activate", as: AirportManager }
            - { call: "POST /arff/incidents", payload: { alert_level: "ALERT_2", location: "Runway 09L" }, as: ArffChief, captures: { inc1: $.data.id } }
            - { call: "POST /arff/incidents/${inc1}/mutual-aid-requests", payload: { agreement_id: "${ag1}", units_requested: 1 }, as: ArffChief, captures: { req1: $.data.id } }
            - { call: "POST /arff/incidents/${inc1}/respond", as: ArffChief }
            - { call: "POST /arff/incidents/${inc1}/control", as: ArffChief }
          trigger:
            - { call: "POST /arff/incidents/${inc1}/close", as: ArffChief, captures: { err_close: $.data.error_id } }
            - { call: "POST /arff/mutual-aid-requests/${req1}/decline", as: ArffChief }
            - { call: "POST /arff/incidents/${inc1}/close", as: ArffChief, captures: { inc_status: $.data.status } }
          assert:
            - "${err_close} == \"ERR_OPEN_REQUESTS_EXIST\""
            - "${inc_status} == \"CLOSED\""

  # ===========================================================================
  # Section: calculations (claim-extraction-guide §3)
  # ===========================================================================
  - section: calculations
    instances:
      - name: calc_required_index_ignores_non_qualifying_larger_aircraft
        claim_type: input_set_filtering
        grounds: [calculations.required_index_by_aircraft, entities.AircraftType.fields.qualifies_for_index]
        distinguishing_aspect: "An E-band aircraft with only 3.0 daily departures is excluded from the input set; a smaller C-band qualifier sets required_index_by_aircraft to C."
        test_recipe:
          setup: ["Profile exists; clock default"]
          setup_api_calls:
            - { call: "POST /arff/airport-profile", payload: { airport_code: "KDEMO", certificated_index: "E" }, as: AirportManager }
          trigger:
            - { call: "POST /arff/aircraft", payload: { model_name: "A380", length_ft: 238.6, avg_daily_departures: 3.0, in_scheduled_service: true }, as: AirportManager, captures: { ac_e: $.data.id, ac_e_q: $.data.qualifies_for_index } }
            - { call: "POST /arff/aircraft", payload: { model_name: "B737-900", length_ft: 138.2, avg_daily_departures: 6.0, in_scheduled_service: true }, as: AirportManager, captures: { ac_c: $.data.id, ac_c_q: $.data.qualifies_for_index } }
            - { call: "GET /arff/airport-profile", as: AirportManager, captures: { p_req: $.data.required_index_by_aircraft } }
          assert:
            - "${ac_e_q} == false and ${ac_c_q} == true"
            - "${p_req} == \"C\"  # longest QUALIFYING aircraft only"

      - name: calc_effective_index_min_semantics
        claim_type: correct_result
        grounds: [calculations.effective_index_recompute]
        distinguishing_aspect: "effective_index is the minimum across certificated C, equipment C, staffing A -> A; the minimum (not the certificated value) drives posture and compliance."
        test_recipe:
          setup:
            - "Index-C airport; 2 vehicles measured at capacity (equipment C); exactly 2 current firefighters (staffing A)"
          setup_api_calls:
            - { call: "POST /arff/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: AirportManager }
            - { call: "POST /arff/airport-profile", payload: { airport_code: "KDEMO", certificated_index: "C" }, as: AirportManager }
            - { call: "POST /arff/aircraft", payload: { model_name: "B737-900", length_ft: 138.2, avg_daily_departures: 6.0, in_scheduled_service: true }, as: AirportManager }
            - { call: "POST /arff/vehicles", payload: { call_sign: "RED-1", water_capacity_gal: 2000, dry_chem_capacity_lb: 500 }, as: ArffChief, captures: { veh1: $.data.id } }
            - { call: "POST /arff/vehicles", payload: { call_sign: "RED-2", water_capacity_gal: 2000, dry_chem_capacity_lb: 500 }, as: ArffChief, captures: { veh2: $.data.id } }
            - { call: "POST /arff/readiness-checks", payload: { vehicle_id: "${veh1}", water_available_gal: 2000, dry_chem_available_lb: 500, discharge_system_ok: true }, as: ArffChief }
            - { call: "POST /arff/readiness-checks", payload: { vehicle_id: "${veh2}", water_available_gal: 2000, dry_chem_available_lb: 500, discharge_system_ok: true }, as: ArffChief }
            - { call: "POST /arff/firefighters", payload: { employee_no: "FF-101", full_name: "Ann Lee" }, as: ArffChief, captures: { ff1: $.data.id } }
            - { call: "POST /arff/firefighters", payload: { employee_no: "FF-102", full_name: "Ben Kim" }, as: ArffChief, captures: { ff2: $.data.id } }
            - { call: "POST /arff/live-fire-training-records", payload: { firefighter_id: "${ff1}", completed_on: "2026-04-15", drill_type: "AIRCRAFT", result: "PASS" }, as: ArffChief }
            - { call: "POST /arff/live-fire-training-records", payload: { firefighter_id: "${ff2}", completed_on: "2026-04-15", drill_type: "AIRCRAFT", result: "PASS" }, as: ArffChief }
          trigger:
            - { call: "GET /arff/airport-profile", as: AirportManager, captures: { p_eff: $.data.effective_index, p_staff: $.data.supported_index_by_staffing, p_equip: $.data.supported_index_by_equipment, p_comp: $.data.index_compliance_status } }
          assert:
            - "${p_equip} == \"C\" and ${p_staff} == \"A\"  # 2 ready >= STAFF_REQ[A]=2 but < STAFF_REQ[B]=3"
            - "${p_eff} == \"A\" and ${p_comp} == \"NONCOMPLIANT\"  # min semantics; A < required C"

      - name: calc_drill_all_vehicles_240_boundary
        claim_type: precision
        grounds: [calculations.drill_outcome_threshold]
        distinguishing_aspect: "The all-vehicles leg boundary is independent of the first-vehicle leg: first=100/all=240 passes; first=100/all=241 fails."
        test_recipe:
          setup: ["Profile exists; two drills in disjoint windows on 09L; clock advanced into each window for execute"]
          setup_api_calls:
            - { call: "POST /arff/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: AirportManager }
            - { call: "POST /arff/airport-profile", payload: { airport_code: "KDEMO", certificated_index: "C" }, as: AirportManager }
            - { call: "POST /arff/response-drills", payload: { runway_designator: "09L", scheduled_start: "2026-05-03T10:00:00Z", scheduled_end: "2026-05-03T11:00:00Z" }, as: ArffChief, captures: { dr1: $.data.id } }
            - { call: "POST /arff/response-drills", payload: { runway_designator: "09L", scheduled_start: "2026-05-03T12:00:00Z", scheduled_end: "2026-05-03T13:00:00Z" }, as: ArffChief, captures: { dr2: $.data.id } }
            - { call: "POST /arff/_clock/set_current_utc", payload: { to_iso8601: "2026-05-03T10:30:00Z" }, as: AirportManager }
            - { call: "POST /arff/response-drills/${dr1}/execute", payload: { first_vehicle_arrival_seconds: 100, all_vehicles_arrival_seconds: 240 }, as: ArffChief, captures: { o1: $.data.outcome } }
            - { call: "POST /arff/_clock/set_current_utc", payload: { to_iso8601: "2026-05-03T12:30:00Z" }, as: AirportManager }
            - { call: "POST /arff/response-drills/${dr2}/execute", payload: { first_vehicle_arrival_seconds: 100, all_vehicles_arrival_seconds: 241 }, as: ArffChief, captures: { o2: $.data.outcome } }
          trigger:
            - { call: "GET /arff/response-drills/${dr1}", as: ArffChief }
          assert:
            - "${o1} == \"PASS\"  # 240 inclusive"
            - "${o2} == \"FAIL\"  # 241 > 240"

      - name: calc_training_fail_records_excluded_from_currency
        claim_type: input_set_filtering
        grounds: [calculations.training_currency_window, entities.LiveFireTrainingRecord.fields.result]
        distinguishing_aspect: "Only PASS records feed last_live_fire_completed_on: a later FAIL record must not move or clear the currency anchor."
        test_recipe:
          setup: ["Profile exists; clock 2026-05-01; firefighter with a PASS record at 2026-03-10"]
          setup_api_calls:
            - { call: "POST /arff/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: AirportManager }
            - { call: "POST /arff/airport-profile", payload: { airport_code: "KDEMO", certificated_index: "C" }, as: AirportManager }
            - { call: "POST /arff/firefighters", payload: { employee_no: "FF-101", full_name: "Ann Lee" }, as: ArffChief, captures: { ff1: $.data.id } }
            - { call: "POST /arff/live-fire-training-records", payload: { firefighter_id: "${ff1}", completed_on: "2026-03-10", drill_type: "AIRCRAFT", result: "PASS" }, as: ArffChief }
          trigger:
            - { call: "POST /arff/live-fire-training-records", payload: { firefighter_id: "${ff1}", completed_on: "2026-04-20", drill_type: "STRUCTURAL", result: "FAIL" }, as: ArffChief }
            - { call: "GET /arff/firefighters/${ff1}", as: ArffChief, captures: { f_last: $.data.last_live_fire_completed_on, f_cur: $.data.is_training_current } }
          assert:
            - "${f_last} == \"2026-03-10\"  # FAIL record ignored despite being later"
            - "${f_cur} == true"

      - name: calc_agent_expense_constants_applied
        claim_type: constants_applied
        grounds: [calculations.agent_expenditure_total]
        excluded_because:
          difficulty_instance: cf_agent_expense_per_line_rounding
          rationale: "Constants (137 c/gal, 89 c/lb) and pinned rounding order are asserted with literal 1183 in the named §1.8 instance."

  # ===========================================================================
  # Section: validations (claim-extraction-guide §4)
  # ===========================================================================
  - section: validations
    instances:
      - name: val_missing_auth_header_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request without X-User-ID / X-User-Role headers is rejected at priority 1 with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER before any role or existence check."
        test_recipe:
          setup: ["Profile exists"]
          setup_api_calls:
            - { call: "POST /arff/airport-profile", payload: { airport_code: "KDEMO", certificated_index: "C" }, as: AirportManager }
          trigger:
            - { call: "GET /arff/airport-profile", as: AirportManager, captures: { err: $.data.error_id } }
          assert:
            - "${err} == \"ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER\"  # trigger omits both auth headers"

      - name: val_body_fk_must_exist
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_VEHICLE_NOT_FOUND]"]
        distinguishing_aspect: "A body FK (vehicle_id on readiness-check create) referencing a non-existent vehicle yields ERR_VEHICLE_NOT_FOUND (404)."
        test_recipe:
          setup: ["Profile exists"]
          setup_api_calls:
            - { call: "POST /arff/airport-profile", payload: { airport_code: "KDEMO", certificated_index: "C" }, as: AirportManager }
          trigger:
            - { call: "POST /arff/readiness-checks", payload: { vehicle_id: "00000000-0000-0000-0000-000000000000", water_available_gal: 100, dry_chem_available_lb: 100, discharge_system_ok: true }, as: ArffChief, captures: { err: $.data.error_id } }
          assert:
            - "${err} == \"ERR_VEHICLE_NOT_FOUND\""

      - name: val_uniqueness_call_sign_and_employee_no
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_DUPLICATE_CALL_SIGN]", "errors[ERR_DUPLICATE_EMPLOYEE_NO]"]
        distinguishing_aspect: "Duplicate vehicle call_sign and duplicate firefighter employee_no are each rejected with their domain-specific uniqueness errors."
        test_recipe:
          setup: ["Profile exists; one vehicle RED-1; one firefighter FF-101"]
          setup_api_calls:
            - { call: "POST /arff/airport-profile", payload: { airport_code: "KDEMO", certificated_index: "C" }, as: AirportManager }
            - { call: "POST /arff/vehicles", payload: { call_sign: "RED-1", water_capacity_gal: 2000, dry_chem_capacity_lb: 500 }, as: ArffChief }
            - { call: "POST /arff/firefighters", payload: { employee_no: "FF-101", full_name: "Ann Lee" }, as: ArffChief }
          trigger:
            - { call: "POST /arff/vehicles", payload: { call_sign: "RED-1", water_capacity_gal: 1500, dry_chem_capacity_lb: 300 }, as: ArffChief, captures: { err_v: $.data.error_id } }
            - { call: "POST /arff/firefighters", payload: { employee_no: "FF-101", full_name: "Other Person" }, as: ArffChief, captures: { err_f: $.data.error_id } }
          assert:
            - "${err_v} == \"ERR_DUPLICATE_CALL_SIGN\" and ${err_f} == \"ERR_DUPLICATE_EMPLOYEE_NO\""

      - name: val_training_date_in_future_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_TRAINING_DATE_IN_FUTURE]"]
        distinguishing_aspect: "completed_on after the current logical date is rejected with ERR_TRAINING_DATE_IN_FUTURE."
        test_recipe:
          setup: ["Profile exists; clock 2026-05-01; firefighter created"]
          setup_api_calls:
            - { call: "POST /arff/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: AirportManager }
            - { call: "POST /arff/airport-profile", payload: { airport_code: "KDEMO", certificated_index: "C" }, as: AirportManager }
            - { call: "POST /arff/firefighters", payload: { employee_no: "FF-101", full_name: "Ann Lee" }, as: ArffChief, captures: { ff1: $.data.id } }
          trigger:
            - { call: "POST /arff/live-fire-training-records", payload: { firefighter_id: "${ff1}", completed_on: "2026-06-01", drill_type: "AIRCRAFT", result: "PASS" }, as: ArffChief, captures: { err: $.data.error_id } }
          assert:
            - "${err} == \"ERR_TRAINING_DATE_IN_FUTURE\""

      - name: val_drill_window_invalid_when_start_not_before_end
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_DRILL_WINDOW_INVALID]"]
        distinguishing_aspect: "scheduled_start >= scheduled_end is rejected with ERR_DRILL_WINDOW_INVALID before any overlap evaluation."
        test_recipe:
          setup: ["Profile exists"]
          setup_api_calls:
            - { call: "POST /arff/airport-profile", payload: { airport_code: "KDEMO", certificated_index: "C" }, as: AirportManager }
          trigger:
            - { call: "POST /arff/response-drills", payload: { runway_designator: "09L", scheduled_start: "2026-05-03T11:00:00Z", scheduled_end: "2026-05-03T11:00:00Z" }, as: ArffChief, captures: { err: $.data.error_id } }
          assert:
            - "${err} == \"ERR_DRILL_WINDOW_INVALID\""

      - name: val_measured_exceeds_capacity_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_MEASURED_EXCEEDS_CAPACITY]"]
        distinguishing_aspect: "A readiness check reporting more agent than the vehicle's rated capacity is rejected with ERR_MEASURED_EXCEEDS_CAPACITY."
        test_recipe:
          setup: ["Profile exists; vehicle RED-1 rated 2000 gal"]
          setup_api_calls:
            - { call: "POST /arff/airport-profile", payload: { airport_code: "KDEMO", certificated_index: "C" }, as: AirportManager }
            - { call: "POST /arff/vehicles", payload: { call_sign: "RED-1", water_capacity_gal: 2000, dry_chem_capacity_lb: 500 }, as: ArffChief, captures: { veh1: $.data.id } }
          trigger:
            - { call: "POST /arff/readiness-checks", payload: { vehicle_id: "${veh1}", water_available_gal: 2500, dry_chem_available_lb: 500, discharge_system_ok: true }, as: ArffChief, captures: { err: $.data.error_id } }
          assert:
            - "${err} == \"ERR_MEASURED_EXCEEDS_CAPACITY\""

      - name: val_priority_existence_beats_state
        claim_type: priority_ordering
        grounds: ["validations[priority=3]", "validations[priority=4]"]
        distinguishing_aspect: "Certify on a non-existent drill id returns 404 ERR_DRILL_NOT_FOUND, not the state error ERR_DRILL_NOT_CERTIFIABLE — existence (3) precedes state (4)."
        test_recipe:
          setup: ["Profile exists"]
          setup_api_calls:
            - { call: "POST /arff/airport-profile", payload: { airport_code: "KDEMO", certificated_index: "C" }, as: AirportManager }
          trigger:
            - { call: "POST /arff/response-drills/00000000-0000-0000-0000-000000000000/certify", as: ArffChief, captures: { err: $.data.error_id } }
          assert:
            - "${err} == \"ERR_DRILL_NOT_FOUND\""

      - name: val_priority_pair_respond_state_vs_safety
        claim_type: priority_ordering
        grounds: ["validations[priority=4]", "validations[priority=5]"]
        excluded_because:
          difficulty_instance: pp_respond_state_beats_index_safety
          rationale: "Dual-failure ordering for the state x business_safety pair is asserted in the named §1.8 instance."

  # ===========================================================================
  # Section: endpoints (claim-extraction-guide §5)
  # ===========================================================================
  - section: endpoints
    instances:
      - name: ep_pagination_defaults_and_limit_offset
        claim_type: standard_crud
        grounds: [response_envelope]
        distinguishing_aspect: "List endpoints honor limit/offset with envelope pagination fields: default limit 10, total_count exact, has_more flips correctly."
        test_recipe:
          setup: ["Profile exists; 3 aircraft created"]
          setup_api_calls:
            - { call: "POST /arff/airport-profile", payload: { airport_code: "KDEMO", certificated_index: "E" }, as: AirportManager }
            - { call: "POST /arff/aircraft", payload: { model_name: "C172", length_ft: 27.0, avg_daily_departures: 2.0 }, as: AirportManager }
            - { call: "POST /arff/aircraft", payload: { model_name: "E190", length_ft: 118.9, avg_daily_departures: 4.0 }, as: AirportManager }
            - { call: "POST /arff/aircraft", payload: { model_name: "B737-900", length_ft: 138.2, avg_daily_departures: 6.0 }, as: AirportManager }
          trigger:
            - { call: "GET /arff/aircraft", as: AirportManager }
            - { call: "GET /arff/aircraft", payload: { limit: 2 }, as: AirportManager }
            - { call: "GET /arff/aircraft", payload: { limit: 2, offset: 2 }, as: AirportManager }
          assert:
            - "Default list: total_count == 3, has_more == false, len(data) == 3  # default limit 10"
            - "limit=2: len(data) == 2, has_more == true, total_count == 3"
            - "limit=2&offset=2: len(data) == 1, has_more == false"

      - name: ep_response_envelope_success_shape
        claim_type: standard_crud
        grounds: [response_envelope]
        distinguishing_aspect: "Every success body carries meta.api_request_id, meta.api_request_timestamp, response_type object/array, and data."
        test_recipe:
          setup: ["Profile exists"]
          setup_api_calls:
            - { call: "POST /arff/airport-profile", payload: { airport_code: "KDEMO", certificated_index: "C" }, as: AirportManager }
          trigger:
            - { call: "POST /arff/vehicles", payload: { call_sign: "RED-1", water_capacity_gal: 2000, dry_chem_capacity_lb: 500 }, as: ArffChief, captures: { v_id: $.data.id } }
          assert:
            - "Vehicle create response: meta.api_request_id present, meta.api_request_timestamp present, response_type == \"object\", data.call_sign == \"RED-1\", data.id == ${v_id}"

      - name: ep_error_envelope_shape
        claim_type: violation_to_error
        grounds: [response_envelope, "errors[ERR_VEHICLE_NOT_FOUND]"]
        distinguishing_aspect: "Every error body carries response_type error and data.error_id plus data.message."
        test_recipe:
          setup: ["Profile exists"]
          setup_api_calls:
            - { call: "POST /arff/airport-profile", payload: { airport_code: "KDEMO", certificated_index: "C" }, as: AirportManager }
          trigger:
            - { call: "GET /arff/vehicles/00000000-0000-0000-0000-000000000000", as: ArffChief, captures: { err: $.data.error_id } }
          assert:
            - "Error response: response_type == \"error\", ${err} == \"ERR_VEHICLE_NOT_FOUND\", data.message present, meta.api_request_id present"

      - name: ep_filtered_subresource_lists_are_scoped
        claim_type: standard_crud
        grounds: [endpoints, entities.ReadinessCheck.fields.vehicle_id, entities.LiveFireTrainingRecord.fields.firefighter_id]
        distinguishing_aspect: "Sub-resource list endpoints return only the parent's children: RED-1's readiness list excludes RED-2's checks; FF-101's training list excludes FF-102's records."
