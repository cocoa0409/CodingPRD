  # ------------------------------------------------------------ calculations ---
  - section: calculations
    instances:
      - name: attic_target_clamps_and_transfer_gate
        claim_type: correct_result
        grounds: ["calculations.attic_target_quantity", "errors[ERR_ATTIC_TARGET_EXCEEDED]"]
        distinguishing_aspect: "Critical spec, installed 30, pct 0.05, min 2, max 10: raw = ceil(30 x 0.05 x 2) = 3, clamped target = min(max(3, 2), 10) = 3; an IN transfer of 4 breaches the target (422) while 3 (equality) succeeds."
        test_recipe:
          setup:
            - "Project in PROCUREMENT, FURNITURE budgeted 8000000c; CRITICAL spec (1/room x 50 rooms, pct 0.05, min 2, max 10) awarded and ordered (50 units, cube 10)"
            - "Shipment fully received with 50 good units; room R-501; window [2026-07-06, 2026-07-09) crew 1 RELEASED then IN_PROGRESS; task qty 30 COMPLETE (qty_installed == 30)"
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "P-C1", hotel_name: "H", brand_program: "MARQUEE_SELECT", total_budget_cents: 10000000 }, as: PurchasingAgent, captures: { p_id: $.data.id } }
