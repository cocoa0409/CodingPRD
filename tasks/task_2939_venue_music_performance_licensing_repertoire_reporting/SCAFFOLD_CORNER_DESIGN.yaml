# =============================================================================
# §1.9 Scaffold Corner Design (Breadth Claim Index)
# Venue Music Performance Licensing & Repertoire Reporting
# Sections and claim_type values are taken verbatim from
# references/claim-extraction-guide.md. Instances whose corner is already
# asserted by a §1.8 instance are emitted as excluded_because stubs.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: corner_venue_create_returns_full_row
        claim_type: creation
        grounds:
          - entities.Venue
          - endpoints.POST_licensing_venues
          - response_envelope.success
        distinguishing_aspect: "POST /licensing/venues with every required survey field returns 201 and echoes all inputs inside the { meta, response_type: object, data } envelope."
        test_recipe:
          setup:
            - "Empty database; the logical clock sits at its 2026-08-01T00:00:00Z default"
          setup_api_calls: []
          trigger:
            - call: "POST /licensing/venues"
              payload: { legal_name: "Blue Note Grill", venue_category: "BAR_GRILL", seating_capacity: 120, standing_capacity: 180, occupancy_limit: 200, music_use_profile: "MIXED", weekly_live_performance_nights: 4, annual_cover_revenue_cents: 4200000 }
              as: LicensingAdmin
              captures: { v_id: "$.data.id" }
          assert:
            - "HTTP 201 and response_type == object"
            - "data.legal_name == 'Blue Note Grill', data.venue_category == BAR_GRILL, data.seating_capacity == 120, data.standing_capacity == 180, data.occupancy_limit == 200"
            - "data.music_use_profile == MIXED, data.weekly_live_performance_nights == 4, data.annual_cover_revenue_cents == 4200000"
            - "meta.api_request_id and meta.api_request_timestamp are present on the response"
            - "GET /licensing/venues/${v_id} returns the identical field values"

      - name: corner_rate_schedule_defaults_applied_on_create
        claim_type: defaults
        grounds:
          - entities.RateSchedule.fields.adjustment_bp
          - entities.RateSchedule.fields.min_annual_fee_cents
          - entities.RateSchedule.fields.max_annual_fee_cents
          - entities.RateSchedule.fields.status
          - endpoints.POST_licensing_rate_schedules
        distinguishing_aspect: "Omitting adjustment_bp, min_annual_fee_cents and max_annual_fee_cents yields exactly 10000 / 30000 / 4500000, with status DRAFT, schedule_version 1 and pinned_license_count 0."
        test_recipe:
          setup:
            - "Society BMI exists"
          setup_api_calls:
            - call: "POST /licensing/societies"
              payload: { society_code: "BMI", display_name: "Broadcast Music Inc", repertoire_share_bp: 4600 }
              as: LicensingAdmin
              captures: { bmi_id: "$.data.id" }
          trigger:
            - call: "POST /licensing/rate-schedules"
              payload: { society_id: "${bmi_id}", venue_category: "BAR_GRILL", effective_from: "2026-01-01T00:00:00Z" }
              as: LicensingAdmin
              captures: { sched_id: "$.data.id" }
          assert:
            - "data.adjustment_bp == 10000"
            - "data.min_annual_fee_cents == 30000"
            - "data.max_annual_fee_cents == 4500000"
            - "data.status == DRAFT and data.schedule_version == 1 and data.pinned_license_count == 0"
            - "data.rate_court_order_ref == null"

      - name: corner_societies_list_pagination_envelope
        claim_type: listing
        grounds:
          - endpoints.GET_licensing_societies
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /licensing/societies?limit=2&offset=0 returns 2 of 3 rows with total_count 3 and has_more true; offset 2 returns the last row with has_more false."
        test_recipe:
          setup:
            - "Societies BMI, ASCAP and SESAC exist"
          setup_api_calls:
            - call: "POST /licensing/societies"
              payload: { society_code: "BMI", display_name: "Broadcast Music Inc", repertoire_share_bp: 4600 }
              as: LicensingAdmin
            - call: "POST /licensing/societies"
              payload: { society_code: "ASCAP", display_name: "American Society of Composers", repertoire_share_bp: 4400 }
              as: LicensingAdmin
            - call: "POST /licensing/societies"
              payload: { society_code: "SESAC", display_name: "SESAC Performing Rights", repertoire_share_bp: 500 }
              as: LicensingAdmin
          trigger:
            - call: "GET /licensing/societies"
              payload: { limit: 2, offset: 0 }
              as: LicensingAdmin
          assert:
            - "response_type == array, exactly 2 rows returned, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "GET /licensing/societies?limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /licensing/societies with no pagination params returns all 3 rows with the default limit 10 and offset 0"

      - name: corner_venue_get_unknown_id_not_found
        claim_type: not_found
        grounds:
          - validations.priority_3_existence
          - errors[ERR_VENUE_NOT_FOUND]
        distinguishing_aspect: "GET /licensing/venues/{id} for a well-formed but unused UUID returns HTTP 404 with error_id ERR_VENUE_NOT_FOUND, not an empty 200."
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls: []
          trigger:
            - call: "GET /licensing/venues/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: LicensingAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404, response_type == error, data.error_id == ERR_VENUE_NOT_FOUND"
            - "GET /licensing/licenses/00000000-0000-4000-8000-000000000001 returns ERR_LICENSE_NOT_FOUND and GET /licensing/audit-cases/00000000-0000-4000-8000-000000000001 returns ERR_AUDIT_CASE_NOT_FOUND"

      - name: corner_venue_create_missing_required_field_rejected
        claim_type: required_fields
        grounds:
          - validations.priority_5_ERR_INVALID_REQUEST
          - entities.Venue.fields.music_use_profile
        distinguishing_aspect: "Omitting music_use_profile, an input field with no default, returns HTTP 422 ERR_INVALID_REQUEST and creates no Venue row."
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /licensing/venues"
              payload: { legal_name: "Blue Note Grill", venue_category: "BAR_GRILL", seating_capacity: 120, standing_capacity: 180, occupancy_limit: 200, weekly_live_performance_nights: 4, annual_cover_revenue_cents: 4200000 }
              as: LicensingAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 422 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /licensing/venues returns total_count == 0"
            - "The same omission of occupancy_limit, of seating_capacity or of legal_name is rejected identically"

      - name: corner_venue_computed_fields_start_at_their_declared_defaults
        claim_type: computed_fields
        grounds:
          - entities.Venue.fields.covered_share_bp
          - entities.Venue.fields.coverage_posture
          - entities.Venue.fields.gap_risk_score
          - entities.Venue.fields.audit_hold
          - entities.Venue.fields.bgm_exemption_status
        distinguishing_aspect: "Every source: computed field of Venue is absent from POST /licensing/venues' input schema and reads back at its declared default (0 / UNCOVERED / 0 / false / NOT_ANALYZED / four zero ledger fields) on a freshly created row."
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /licensing/venues"
              payload: { legal_name: "Blue Note Grill", venue_category: "BAR_GRILL", seating_capacity: 120, standing_capacity: 180, occupancy_limit: 200, music_use_profile: "MIXED", weekly_live_performance_nights: 4, annual_cover_revenue_cents: 4200000 }
              as: LicensingAdmin
              captures: { v_id: "$.data.id" }
          assert:
            - "data.covered_share_bp == 0 and data.coverage_posture == UNCOVERED"
            - "data.gap_risk_score == 0 and data.audit_hold == false"
            - "data.bgm_exemption_status == NOT_ANALYZED and data.bgm_exemption_reason == null"
            - "data.lifetime_assessed_cents == 0, data.outstanding_balance_cents == 0, data.settled_amount_cents == 0, data.voided_amount_cents == 0"
            - "data.status == OPERATING, data.has_cover_charge == false, data.retransmission_only == false, data.uses_licensed_bgm_service == false"

      - name: corner_venue_system_fields_generated_by_server
        claim_type: system_fields
        grounds:
          - entities.Venue
          - endpoints.POST_licensing_venues
        distinguishing_aspect: "id, created_at, updated_at and version are minted by the server: POST /licensing/venues declares none of them as input and the created row comes back with version == 1."
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /licensing/venues"
              payload: { legal_name: "Harbor Concert Hall", venue_category: "CONCERT_HALL", seating_capacity: 1200, standing_capacity: 0, occupancy_limit: 1300, music_use_profile: "LIVE_ONLY", weekly_live_performance_nights: 5, annual_cover_revenue_cents: 62000000 }
              as: LicensingAdmin
              captures: { v_id: "$.data.id", v_ver: "$.data.version" }
          assert:
            - "data.id is a server-generated identifier and data.version == 1"
            - "data.created_at and data.updated_at are ISO-8601 instants equal to the logical clock instant 2026-08-01T00:00:00Z"
            - "PATCH /licensing/venues/${v_id} with { seating_capacity: 1100 } returns version == 2, so version is server-owned and monotone"

      - name: corner_venue_create_invalid_enum_rejected
        claim_type: type_constraints
        grounds:
          - validations.priority_5_ERR_INVALID_REQUEST
          - entities.Venue.fields.venue_category
        distinguishing_aspect: "venue_category outside {CONCERT_HALL, BAR_GRILL, NIGHTCLUB, RESTAURANT, HOTEL, FITNESS_STUDIO} returns 422 ERR_INVALID_REQUEST, and so does a negative annual_cover_revenue_cents."
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /licensing/venues"
              payload: { legal_name: "Odd Venue", venue_category: "AMPHITHEATRE", seating_capacity: 120, standing_capacity: 180, occupancy_limit: 200, music_use_profile: "MIXED", weekly_live_performance_nights: 4, annual_cover_revenue_cents: 4200000 }
              as: LicensingAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 422 with data.error_id == ERR_INVALID_REQUEST"
            - "The same endpoint with annual_cover_revenue_cents: -1 also returns ERR_INVALID_REQUEST, because every *_cents field must be a non-negative integer"
            - "music_use_profile: 'AMBIENT' is rejected the same way"

      - name: corner_setlist_entry_is_immutable_and_has_no_version
        claim_type: immutability
        grounds:
          - entities.SetlistEntry
          - endpoints.GET_licensing_setlist_entries_setlist_entry_id
        distinguishing_aspect: "SetlistEntry declares common_fields: false, so §1.5 exposes no PATCH and the row carries no version field; the only way to change a report's setlist is to append another entry."
        test_recipe:
          setup:
            - "Venue V1 holds an ACTIVE BMI License L1 and a DRAFT PerformanceReport R1 for 2026-09-01 to 2026-10-01 with one entry attached"
          setup_api_calls:
            - call: "POST /licensing/societies"
              payload: { society_code: "BMI", display_name: "Broadcast Music Inc", repertoire_share_bp: 4600 }
              as: LicensingAdmin
              captures: { bmi_id: "$.data.id" }
            - call: "POST /licensing/rate-schedules"
              payload: { society_id: "${bmi_id}", venue_category: "BAR_GRILL", effective_from: "2026-01-01T00:00:00Z" }
              as: LicensingAdmin
              captures: { sched_id: "$.data.id" }
            - call: "POST /licensing/rate-schedules/${sched_id}/publish"
              payload: {}
              as: LicensingAdmin
            - call: "POST /licensing/venues"
              payload: { legal_name: "Blue Note Grill", venue_category: "BAR_GRILL", seating_capacity: 120, standing_capacity: 180, occupancy_limit: 200, music_use_profile: "MIXED", weekly_live_performance_nights: 4, annual_cover_revenue_cents: 4200000 }
              as: LicensingAdmin
              captures: { v1_id: "$.data.id", v1_v0: "$.data.version" }
            - call: "POST /licensing/license-applications"
              payload: { venue_id: "${v1_id}", society_id: "${bmi_id}", requested_license_type: "BLANKET", declared_seating: 120, declared_standing: 180, declared_cover_revenue_cents: 4200000, declared_live_nights: 4, declared_music_use_profile: "MIXED", requested_term_start: "2026-08-01T00:00:00Z", expected_venue_version: "${v1_v0}" }
              as: VenueOperator
              as_user_id: "${v1_id}"
              captures: { app1_id: "$.data.id" }
            - call: "POST /licensing/license-applications/${app1_id}/submit"
              payload: {}
              as: VenueOperator
              as_user_id: "${v1_id}"
            - call: "POST /licensing/license-applications/${app1_id}/review"
              payload: { disposition: "ACCEPT_FOR_REVIEW" }
              as: LicensingAdmin
            - call: "POST /licensing/license-applications/${app1_id}/review"
              payload: { disposition: "APPROVE" }
              as: LicensingAdmin
            - call: "GET /licensing/licenses"
              payload: { application_id: "${app1_id}" }
              as: LicensingAdmin
              captures: { lic1_id: "$.data[0].id" }
            - call: "POST /licensing/licenses/${lic1_id}/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /licensing/performance-reports"
              payload: { license_id: "${lic1_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z" }
              as: VenueOperator
              as_user_id: "${v1_id}"
              captures: { rep_id: "$.data.id" }
          trigger:
            - call: "POST /licensing/performance-reports/${rep_id}/setlist-entries"
              payload: { work_title: "Blue Horizon", writer_name: "A. Reed", society_affiliation: "BMI", performance_datetime: "2026-09-05T20:00:00Z", use_type: "LIVE", duration_seconds: 300 }
              as: VenueOperator
              as_user_id: "${v1_id}"
              captures: { entry_id: "$.data.id" }
          assert:
            - "HTTP 201 and the response carries no version field, matching common_fields: false"
            - "data.is_matched == false, data.matched_work_id == null, data.is_covered == false before submission"
            - "GET /licensing/setlist-entries/${entry_id} returns the row unchanged"
            - "§1.5 declares no PATCH or DELETE for setlist entries, so the entry can never be edited or removed"
            - "PerformanceReport.${rep_id}.reported_entry_count is still 0 until submission recomputes it"

      - name: corner_repertoire_work_unknown_society_not_found
        claim_type: parent_relationships
        grounds:
          - validations.priority_4_business_referential
          - errors[ERR_SOCIETY_NOT_FOUND]
          - entities.RepertoireWork.fields.society_id
        distinguishing_aspect: "A body foreign key that names no row is a 404: POST /licensing/repertoire-works with an unused society_id returns ERR_SOCIETY_NOT_FOUND and stores nothing."
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /licensing/repertoire-works"
              payload: { society_id: "00000000-0000-4000-8000-0000000000aa", title: "Ghost Registration", writer_name: "Nobody" }
              as: LicensingAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404 with data.error_id == ERR_SOCIETY_NOT_FOUND"
            - "GET /licensing/repertoire-works returns total_count == 0"

      - name: corner_flat_topology_report_create_unknown_license_not_found
        claim_type: flat
        grounds:
          - complexity_profile.entity_topology
          - validations.priority_4_business_referential
          - errors[ERR_LICENSE_NOT_FOUND]
        distinguishing_aspect: "The topology is flat, so cross-references are validated by foreign key rather than by URL nesting: POST /licensing/performance-reports with an unknown license_id returns ERR_LICENSE_NOT_FOUND."
        test_recipe:
          setup:
            - "Society BMI and Venue V1 exist but no License has been issued"
          setup_api_calls:
            - call: "POST /licensing/societies"
              payload: { society_code: "BMI", display_name: "Broadcast Music Inc", repertoire_share_bp: 4600 }
              as: LicensingAdmin
              captures: { bmi_id: "$.data.id" }
            - call: "POST /licensing/venues"
              payload: { legal_name: "Blue Note Grill", venue_category: "BAR_GRILL", seating_capacity: 120, standing_capacity: 180, occupancy_limit: 200, music_use_profile: "MIXED", weekly_live_performance_nights: 4, annual_cover_revenue_cents: 4200000 }
              as: LicensingAdmin
              captures: { v1_id: "$.data.id" }
          trigger:
            - call: "POST /licensing/performance-reports"
              payload: { license_id: "00000000-0000-4000-8000-0000000000bb", period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z" }
              as: LicensingAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404 with data.error_id == ERR_LICENSE_NOT_FOUND"
            - "GET /licensing/performance-reports returns total_count == 0"

  - section: state_machines
    instances:
      - name: corner_application_and_license_start_in_declared_initial_states
        claim_type: initial_state
        grounds:
          - state_machines.LicenseApplication.initial_state
          - state_machines.License.initial_state
          - entities.License.fields.coverage_status
          - entities.License.fields.billing_status
        distinguishing_aspect: "A freshly created LicenseApplication is DRAFT, and the License minted by APPROVE starts in coverage_status PENDING_ACTIVATION and billing_status UNBILLED with verified_fee_delta_cents 0 and accepted_report_count 0."
        test_recipe:
          setup:
            - "Society BMI with an EFFECTIVE (BMI, BAR_GRILL) schedule, and Venue V1"
            - "Application A1 is created, submitted and accepted for review"
          setup_api_calls:
            - call: "POST /licensing/societies"
              payload: { society_code: "BMI", display_name: "Broadcast Music Inc", repertoire_share_bp: 4600 }
              as: LicensingAdmin
              captures: { bmi_id: "$.data.id" }
            - call: "POST /licensing/rate-schedules"
              payload: { society_id: "${bmi_id}", venue_category: "BAR_GRILL", effective_from: "2026-01-01T00:00:00Z" }
              as: LicensingAdmin
              captures: { sched_id: "$.data.id" }
            - call: "POST /licensing/rate-schedules/${sched_id}/publish"
              payload: {}
              as: LicensingAdmin
            - call: "POST /licensing/venues"
              payload: { legal_name: "Blue Note Grill", venue_category: "BAR_GRILL", seating_capacity: 120, standing_capacity: 180, occupancy_limit: 200, music_use_profile: "MIXED", weekly_live_performance_nights: 4, annual_cover_revenue_cents: 4200000 }
              as: LicensingAdmin
              captures: { v1_id: "$.data.id", v1_v0: "$.data.version" }
            - call: "POST /licensing/license-applications"
              payload: { venue_id: "${v1_id}", society_id: "${bmi_id}", requested_license_type: "BLANKET", declared_seating: 120, declared_standing: 180, declared_cover_revenue_cents: 4200000, declared_live_nights: 4, declared_music_use_profile: "MIXED", requested_term_start: "2026-08-01T00:00:00Z", expected_venue_version: "${v1_v0}" }
              as: VenueOperator
              as_user_id: "${v1_id}"
              captures: { app1_id: "$.data.id", app1_status: "$.data.status" }
            - call: "POST /licensing/license-applications/${app1_id}/submit"
              payload: {}
              as: VenueOperator
              as_user_id: "${v1_id}"
            - call: "POST /licensing/license-applications/${app1_id}/review"
              payload: { disposition: "ACCEPT_FOR_REVIEW" }
              as: LicensingAdmin
          trigger:
            - call: "POST /licensing/license-applications/${app1_id}/review"
              payload: { disposition: "APPROVE" }
              as: LicensingAdmin
          assert:
            - "The captured ${app1_status} from creation was DRAFT with revision_round == 0 and return_reason == null"
            - "GET /licensing/licenses?application_id=${app1_id} returns exactly one row with coverage_status == PENDING_ACTIVATION and billing_status == UNBILLED"
            - "That License has verified_fee_delta_cents == 0, accepted_report_count == 0, renewal_of_license_id == null, renewed_into_license_id == null, suspension_reason == null"
            - "Its term_start == 2026-08-01T00:00:00Z and term_end == 2027-08-01T00:00:00Z (term_start + 365 days)"
            - "No CoverageWindow and no FeeAssessment exist yet, because both are activation side effects"

      - name: corner_publish_already_effective_schedule_rejected
        claim_type: invalid_transitions
        grounds:
          - state_machines.RateSchedule.DRAFT_to_EFFECTIVE
          - validations.priority_8_state
          - errors[ERR_RATE_SCHEDULE_NOT_DRAFT]
        distinguishing_aspect: "Publishing a schedule that is already EFFECTIVE returns 409 ERR_RATE_SCHEDULE_NOT_DRAFT and does not bump schedule_version, so publish is not idempotent."
        test_recipe:
          setup:
            - "Society BMI exists and its (BMI, BAR_GRILL) schedule S1 has already been published"
          setup_api_calls:
            - call: "POST /licensing/societies"
              payload: { society_code: "BMI", display_name: "Broadcast Music Inc", repertoire_share_bp: 4600 }
              as: LicensingAdmin
              captures: { bmi_id: "$.data.id" }
            - call: "POST /licensing/rate-schedules"
              payload: { society_id: "${bmi_id}", venue_category: "BAR_GRILL", effective_from: "2026-01-01T00:00:00Z" }
              as: LicensingAdmin
              captures: { sched_id: "$.data.id" }
            - call: "POST /licensing/rate-schedules/${sched_id}/publish"
              payload: {}
              as: LicensingAdmin
              captures: { sched_ver: "$.data.schedule_version" }
          trigger:
            - call: "POST /licensing/rate-schedules/${sched_id}/publish"
              payload: {}
              as: LicensingAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 409 with data.error_id == ERR_RATE_SCHEDULE_NOT_DRAFT"
            - "RateSchedule.${sched_id}.status is still EFFECTIVE and schedule_version is still ${sched_ver}"
            - "No SUPERSEDED row exists: GET /licensing/rate-schedules?status=SUPERSEDED returns total_count == 0"

      - name: corner_submit_approved_application_rejected
        claim_type: invalid_transitions
        grounds:
          - state_machines.LicenseApplication.terminal_states
          - validations.priority_8_state
          - errors[ERR_APPLICATION_STATE_INVALID]
        distinguishing_aspect: "APPROVED is terminal: submit on an APPROVED application returns 409 ERR_APPLICATION_STATE_INVALID and no second License is created."
        test_recipe:
          setup:
            - "Application A1 of Venue V1 for BMI has been APPROVED, creating License L1 in PENDING_ACTIVATION"
          setup_api_calls:
            - call: "POST /licensing/societies"
              payload: { society_code: "BMI", display_name: "Broadcast Music Inc", repertoire_share_bp: 4600 }
              as: LicensingAdmin
              captures: { bmi_id: "$.data.id" }
            - call: "POST /licensing/rate-schedules"
              payload: { society_id: "${bmi_id}", venue_category: "BAR_GRILL", effective_from: "2026-01-01T00:00:00Z" }
              as: LicensingAdmin
              captures: { sched_id: "$.data.id" }
            - call: "POST /licensing/rate-schedules/${sched_id}/publish"
              payload: {}
              as: LicensingAdmin
            - call: "POST /licensing/venues"
              payload: { legal_name: "Blue Note Grill", venue_category: "BAR_GRILL", seating_capacity: 120, standing_capacity: 180, occupancy_limit: 200, music_use_profile: "MIXED", weekly_live_performance_nights: 4, annual_cover_revenue_cents: 4200000 }
              as: LicensingAdmin
              captures: { v1_id: "$.data.id", v1_v0: "$.data.version" }
            - call: "POST /licensing/license-applications"
              payload: { venue_id: "${v1_id}", society_id: "${bmi_id}", requested_license_type: "BLANKET", declared_seating: 120, declared_standing: 180, declared_cover_revenue_cents: 4200000, declared_live_nights: 4, declared_music_use_profile: "MIXED", requested_term_start: "2026-08-01T00:00:00Z", expected_venue_version: "${v1_v0}" }
              as: VenueOperator
              as_user_id: "${v1_id}"
              captures: { app1_id: "$.data.id" }
            - call: "POST /licensing/license-applications/${app1_id}/submit"
              payload: {}
              as: VenueOperator
              as_user_id: "${v1_id}"
            - call: "POST /licensing/license-applications/${app1_id}/review"
              payload: { disposition: "ACCEPT_FOR_REVIEW" }
