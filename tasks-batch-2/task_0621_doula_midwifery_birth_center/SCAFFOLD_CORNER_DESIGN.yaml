# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Doula & Midwifery Birth Center — breadth probe across the claim-extraction
# taxonomy. §1.8 covers the 9 hard reasoning rules; this file covers everything
# else the §1.1–§1.7 surface declares. excluded_because stubs name the §1.8
# instance that already exercises a corner.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_client_returns_201_active
        claim_type: Creation
        grounds: [entities.Client.fields.status, endpoints]
        distinguishing_aspect: "POST /clients with required fields returns 201 with status=ACTIVE and a server-minted id."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /birth-center/clients"
              payload: { full_name: "Ada A", date_of_birth: "1994-03-02", parity: 0 }
              as: IntakeCoordinator
              captures: { client_id: $.data.id }
          assert:
            - "response HTTP status == 201"
            - "Client.${client_id}.status == ACTIVE"
            - "response data.id is a non-empty UUID with no type prefix"

      - name: create_client_missing_full_name_invalid_request
        claim_type: Required Fields
        grounds: [entities.Client.fields.full_name, 'validations[priority=4]']
        distinguishing_aspect: "POST /clients omitting required full_name -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /birth-center/clients"
              payload: { date_of_birth: "1994-03-02", parity: 0 }
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status == 422"
            - "response error_id == ERR_INVALID_REQUEST"

      - name: create_client_negative_parity_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Client.fields.parity, 'validations[priority=4]']
        distinguishing_aspect: "POST /clients with parity=-1 violates the >=0 constraint -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /birth-center/clients"
              payload: { full_name: "Ada A", date_of_birth: "1994-03-02", parity: -1 }
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status == 422"
            - "response error_id == ERR_INVALID_REQUEST"

      - name: client_insurance_payer_defaults_empty_string
        claim_type: Defaults
        grounds: [entities.Client.fields.insurance_payer]
        distinguishing_aspect: "Omitting insurance_payer applies the default empty string (self-pay)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /birth-center/clients"
              payload: { full_name: "Ada A", date_of_birth: "1994-03-02", parity: 0 }
              as: IntakeCoordinator
              captures: { client_id: $.data.id }
          assert:
            - "Client.${client_id}.insurance_payer == \"\""
            - "Client.${client_id}.policy_number == \"\""

      - name: get_client_not_found
        claim_type: Not Found
        grounds: ['validations[priority=3]', 'errors[ERR_NOT_FOUND]']
        distinguishing_aspect: "GET /clients/{id} with a non-existent UUID -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /birth-center/clients/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status == 404"
            - "response error_id == ERR_NOT_FOUND"

      - name: episode_computed_global_fee_snapshot
        claim_type: Computed Fields
        grounds: [entities.Episode.fields.global_fee_cents, endpoints]
        distinguishing_aspect: "Episode.global_fee_cents is computed as a snapshot of CarePackage.global_fee_cents (800000) at create; client cannot set it."
        test_recipe:
          setup: ["SupplyKit BK1 on_hand=5; CarePackage PKG_BIRTH global_fee=800000."]
          setup_api_calls:
            - call: "POST /birth-center/supply-kits"
              payload: { sku: "BK1", name: "Birth Kit", on_hand_count: 5 }
              as: CenterAdmin
            - call: "POST /birth-center/care-packages"
              payload: { code: "PKG_BIRTH", package_type: "BIRTH", global_fee_cents: 800000, prenatal_visits_included: 3, postpartum_visits_included: 2, kit_sku: "BK1" }
              as: CenterAdmin
            - call: "POST /birth-center/clients"
              payload: { full_name: "Ada A", date_of_birth: "1994-03-02", parity: 0 }
              as: IntakeCoordinator
              captures: { client_id: $.data.id }
          trigger:
            - call: "POST /birth-center/episodes"
              payload: { client_id: "${client_id}", package_code: "PKG_BIRTH", edd: "2026-08-01" }
              as: IntakeCoordinator
              captures: { ep_id: $.data.id }
          assert:
            - "Episode.${ep_id}.global_fee_cents == 800000"
            - "Episode.${ep_id}.clinical_status == PLANNING and financial_status == UNBILLED and risk_tier == LOW"
            - "Episode.${ep_id}.kit_issued == true"

      - name: duplicate_supply_kit_sku_conflict
        claim_type: Type Constraints
        grounds: [entities.SupplyKit.fields.sku, 'validations[priority=5]', 'errors[ERR_DUPLICATE_RESOURCE]']
        distinguishing_aspect: "Creating a second SupplyKit with an existing sku -> ERR_DUPLICATE_RESOURCE (409)."
        test_recipe:
          setup: ["SupplyKit BK1 exists."]
          setup_api_calls:
            - call: "POST /birth-center/supply-kits"
              payload: { sku: "BK1", name: "Birth Kit", on_hand_count: 5 }
              as: CenterAdmin
          trigger:
            - call: "POST /birth-center/supply-kits"
              payload: { sku: "BK1", name: "Dup Kit", on_hand_count: 9 }
              as: CenterAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status == 409"
            - "response error_id == ERR_DUPLICATE_RESOURCE"

      - name: care_package_immutable_no_version
        claim_type: Immutability
        grounds: [entities.CarePackage]
        distinguishing_aspect: "CarePackage has common_fields:false; it exposes no version field and there is no update/PUT endpoint for it."
        test_recipe:
          setup: ["SupplyKit BK1; CarePackage PKG_BIRTH created."]
          setup_api_calls:
            - call: "POST /birth-center/supply-kits"
              payload: { sku: "BK1", name: "Birth Kit", on_hand_count: 5 }
              as: CenterAdmin
            - call: "POST /birth-center/care-packages"
              payload: { code: "PKG_BIRTH", package_type: "BIRTH", global_fee_cents: 800000, prenatal_visits_included: 3, postpartum_visits_included: 2, kit_sku: "BK1" }
              as: CenterAdmin
              captures: { pkg_id: $.data.id }
          trigger:
            - call: "GET /birth-center/care-packages/${pkg_id}"
              payload: {}
              as: CenterAdmin
          assert:
            - "response data.code == PKG_BIRTH and data.global_fee_cents == 800000"
            - "no PUT/PATCH endpoint for /birth-center/care-packages/{id} is declared in §1.5"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: activate_episode_from_active_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Episode.transitions.PLANNING_to_ACTIVE, 'errors[ERR_INVALID_STATE]']
        distinguishing_aspect: "Activating an already-ACTIVE episode -> ERR_INVALID_STATE (409); clinical_status unchanged."
        test_recipe:
          setup: ["Standard kit+package+client+episode; episode activated to ACTIVE."]
          setup_api_calls:
            - call: "POST /birth-center/supply-kits"
              payload: { sku: "BK1", name: "Birth Kit", on_hand_count: 5 }
              as: CenterAdmin
            - call: "POST /birth-center/care-packages"
              payload: { code: "PKG_BIRTH", package_type: "BIRTH", global_fee_cents: 800000, prenatal_visits_included: 3, postpartum_visits_included: 2, kit_sku: "BK1" }
              as: CenterAdmin
            - call: "POST /birth-center/clients"
              payload: { full_name: "Ada A", date_of_birth: "1994-03-02", parity: 0 }
              as: IntakeCoordinator
              captures: { client_id: $.data.id }
            - call: "POST /birth-center/episodes"
              payload: { client_id: "${client_id}", package_code: "PKG_BIRTH", edd: "2026-08-01" }
              as: IntakeCoordinator
              captures: { ep_id: $.data.id }
            - call: "POST /birth-center/episodes/${ep_id}/activate"
              payload: {}
              as: Midwife
          trigger:
            - call: "POST /birth-center/episodes/${ep_id}/activate"
              payload: {}
              as: Midwife
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status == 409"
            - "response error_id == ERR_INVALID_STATE"
            - "Episode.${ep_id}.clinical_status == ACTIVE"

      - name: complete_care_from_planning_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Episode.transitions.BORN_to_COMPLETED, 'errors[ERR_INVALID_STATE]']
        distinguishing_aspect: "complete-care on a PLANNING episode (not BORN) -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Standard kit+package+client+episode in PLANNING."]
          setup_api_calls:
            - call: "POST /birth-center/supply-kits"
              payload: { sku: "BK1", name: "Birth Kit", on_hand_count: 5 }
              as: CenterAdmin
            - call: "POST /birth-center/care-packages"
              payload: { code: "PKG_BIRTH", package_type: "BIRTH", global_fee_cents: 800000, prenatal_visits_included: 3, postpartum_visits_included: 2, kit_sku: "BK1" }
              as: CenterAdmin
            - call: "POST /birth-center/clients"
              payload: { full_name: "Ada A", date_of_birth: "1994-03-02", parity: 0 }
              as: IntakeCoordinator
              captures: { client_id: $.data.id }
            - call: "POST /birth-center/episodes"
              payload: { client_id: "${client_id}", package_code: "PKG_BIRTH", edd: "2026-08-01" }
              as: IntakeCoordinator
              captures: { ep_id: $.data.id }
          trigger:
            - call: "POST /birth-center/episodes/${ep_id}/complete-care"
              payload: {}
              as: Midwife
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status == 409"
            - "response error_id == ERR_INVALID_STATE"

      - name: write_off_from_written_off_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Episode.transitions.UNBILLED_to_WRITTEN_OFF, 'errors[ERR_INVALID_STATE]']
        distinguishing_aspect: "Second write-off on a WRITTEN_OFF (terminal financial) episode -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Standard kit+package+client+episode written off."]
          setup_api_calls:
            - call: "POST /birth-center/supply-kits"
              payload: { sku: "BK1", name: "Birth Kit", on_hand_count: 5 }
              as: CenterAdmin
            - call: "POST /birth-center/care-packages"
              payload: { code: "PKG_BIRTH", package_type: "BIRTH", global_fee_cents: 800000, prenatal_visits_included: 3, postpartum_visits_included: 2, kit_sku: "BK1" }
              as: CenterAdmin
            - call: "POST /birth-center/clients"
              payload: { full_name: "Ada A", date_of_birth: "1994-03-02", parity: 0 }
              as: IntakeCoordinator
              captures: { client_id: $.data.id }
            - call: "POST /birth-center/episodes"
              payload: { client_id: "${client_id}", package_code: "PKG_BIRTH", edd: "2026-08-01" }
              as: IntakeCoordinator
              captures: { ep_id: $.data.id }
            - call: "POST /birth-center/episodes/${ep_id}/write-off"
              payload: {}
              as: BillingClerk
          trigger:
            - call: "POST /birth-center/episodes/${ep_id}/write-off"
              payload: {}
              as: BillingClerk
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status == 409"
            - "response error_id == ERR_INVALID_STATE"
            - "Episode.${ep_id}.financial_status == WRITTEN_OFF"

      - name: mark_no_show_before_scheduled_time_invalid_state
        claim_type: Precondition Enforcement
        grounds: [state_machines.PrenatalVisit.transitions.SCHEDULED_to_NO_SHOW]
        distinguishing_aspect: "mark-no-show before the clock reaches scheduled_at (clock at startup default 2026-01-01, visit scheduled 2026-04-01) -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Standard kit+package+client+episode; one PrenatalVisit scheduled at 2026-04-01; clock at default 2026-01-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /birth-center/supply-kits"
              payload: { sku: "BK1", name: "Birth Kit", on_hand_count: 5 }
              as: CenterAdmin
            - call: "POST /birth-center/care-packages"
              payload: { code: "PKG_BIRTH", package_type: "BIRTH", global_fee_cents: 800000, prenatal_visits_included: 3, postpartum_visits_included: 2, kit_sku: "BK1" }
              as: CenterAdmin
            - call: "POST /birth-center/clients"
              payload: { full_name: "Ada A", date_of_birth: "1994-03-02", parity: 0 }
              as: IntakeCoordinator
              captures: { client_id: $.data.id }
            - call: "POST /birth-center/episodes"
              payload: { client_id: "${client_id}", package_code: "PKG_BIRTH", edd: "2026-08-01" }
              as: IntakeCoordinator
              captures: { ep_id: $.data.id }
            - call: "POST /birth-center/prenatal-visits"
              payload: { episode_id: "${ep_id}", visit_kind: "PRENATAL", scheduled_at: "2026-04-01T10:00:00Z" }
              as: Midwife
              captures: { v1_id: $.data.id }
          trigger:
            - call: "POST /birth-center/prenatal-visits/${v1_id}/mark-no-show"
              payload: {}
              as: Midwife
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status == 409"
            - "response error_id == ERR_INVALID_STATE (clock 2026-01-01 < scheduled_at 2026-04-01)"

      - name: cancel_visit_then_complete_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.PrenatalVisit.transitions.SCHEDULED_to_CANCELLED, state_machines.PrenatalVisit.transitions.SCHEDULED_to_COMPLETED]
        distinguishing_aspect: "Completing a CANCELLED (terminal) visit -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Standard kit+package+client+episode; one visit scheduled then cancelled."]
          setup_api_calls:
            - call: "POST /birth-center/supply-kits"
              payload: { sku: "BK1", name: "Birth Kit", on_hand_count: 5 }
              as: CenterAdmin
            - call: "POST /birth-center/care-packages"
              payload: { code: "PKG_BIRTH", package_type: "BIRTH", global_fee_cents: 800000, prenatal_visits_included: 3, postpartum_visits_included: 2, kit_sku: "BK1" }
              as: CenterAdmin
            - call: "POST /birth-center/clients"
              payload: { full_name: "Ada A", date_of_birth: "1994-03-02", parity: 0 }
              as: IntakeCoordinator
              captures: { client_id: $.data.id }
            - call: "POST /birth-center/episodes"
              payload: { client_id: "${client_id}", package_code: "PKG_BIRTH", edd: "2026-08-01" }
              as: IntakeCoordinator
              captures: { ep_id: $.data.id }
            - call: "POST /birth-center/prenatal-visits"
              payload: { episode_id: "${ep_id}", visit_kind: "PRENATAL", scheduled_at: "2026-04-01T10:00:00Z" }
              as: Midwife
              captures: { v1_id: $.data.id }
            - call: "POST /birth-center/prenatal-visits/${v1_id}/cancel"
              payload: {}
              as: Midwife
          trigger:
            - call: "POST /birth-center/prenatal-visits/${v1_id}/complete"
              payload: { risk_flag: "NONE" }
              as: Midwife
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status == 409"
            - "response error_id == ERR_INVALID_STATE"
            - "PrenatalVisit.${v1_id}.status == CANCELLED"

      - name: activate_episode_requires_kit_issued_excluded
        claim_type: Precondition Enforcement
        grounds: [state_machines.Episode.transitions.PLANNING_to_ACTIVE]
        excluded_because:
          difficulty_instance: boundary_precision_check / bpc_kit_zero_stock_boundary
          rationale: "Kit-reservation gating and the out-of-stock boundary are exercised by the named §1.8 instance on POST /episodes."

      - name: activate_blocked_by_transfer_required_risk
        claim_type: Precondition Enforcement
        grounds: ['validations[priority=7]', 'errors[ERR_RISK_TRANSFER_REQUIRED]', state_machines.Episode.transitions.PLANNING_to_ACTIVE]
        distinguishing_aspect: |
          An episode in the valid PLANNING state for activate, but whose risk_tier is
          TRANSFER_REQUIRED (a completed visit with risk_flag TRANSFER), is rejected by the
          safety gate with ERR_RISK_TRANSFER_REQUIRED (409) — the state precondition passes, so
          the risk gate is the genuine returned error (unlike the record-birth conflict where
          state precedence wins).
        test_recipe:
          setup: ["Standard kit+package+client+episode in PLANNING; one visit completed with risk_flag TRANSFER -> risk_tier TRANSFER_REQUIRED."]
          setup_api_calls:
            - call: "POST /birth-center/supply-kits"
              payload: { sku: "BK1", name: "Birth Kit", on_hand_count: 5 }
              as: CenterAdmin
            - call: "POST /birth-center/care-packages"
              payload: { code: "PKG_BIRTH", package_type: "BIRTH", global_fee_cents: 800000, prenatal_visits_included: 3, postpartum_visits_included: 2, kit_sku: "BK1" }
              as: CenterAdmin
            - call: "POST /birth-center/clients"
              payload: { full_name: "Ada A", date_of_birth: "1994-03-02", parity: 0 }
              as: IntakeCoordinator
              captures: { client_id: $.data.id }
            - call: "POST /birth-center/episodes"
              payload: { client_id: "${client_id}", package_code: "PKG_BIRTH", edd: "2026-08-01" }
              as: IntakeCoordinator
              captures: { ep_id: $.data.id }
            - call: "POST /birth-center/prenatal-visits"
              payload: { episode_id: "${ep_id}", visit_kind: "PRENATAL", scheduled_at: "2026-04-01T10:00:00Z" }
              as: Midwife
              captures: { v1_id: $.data.id }
            - call: "POST /birth-center/prenatal-visits/${v1_id}/complete"
              payload: { risk_flag: "TRANSFER", blood_pressure_systolic: 130 }
              as: Midwife
          trigger:
            - call: "POST /birth-center/episodes/${ep_id}/activate"
              payload: {}
              as: Midwife
              captures: { err: $.data.error_id }
          assert:
            - "Episode.${ep_id}.risk_tier == TRANSFER_REQUIRED after the visit completes"
            - "trigger response HTTP status == 409"
            - "trigger response error_id == ERR_RISK_TRANSFER_REQUIRED"
            - "Episode.${ep_id}.clinical_status == PLANNING (unchanged)"

  # ===========================================================================
  - section: calculations
    instances:
      - name: denied_claim_full_responsibility
        claim_type: Variant Selection
        grounds: [calculations.charge_client_responsibility, state_machines.InsuranceClaim.transitions.SUBMITTED_to_DENIED]
        distinguishing_aspect: "Denying the claim sets the GLOBAL_FEE charge responsibility to the full 800000 and balance to 800000 (DENIED variant)."
        test_recipe:
          setup: ["Standard kit+package+client+episode; InsuranceClaim SUBMITTED."]
          setup_api_calls:
            - call: "POST /birth-center/supply-kits"
              payload: { sku: "BK1", name: "Birth Kit", on_hand_count: 5 }
              as: CenterAdmin
            - call: "POST /birth-center/care-packages"
              payload: { code: "PKG_BIRTH", package_type: "BIRTH", global_fee_cents: 800000, prenatal_visits_included: 3, postpartum_visits_included: 2, kit_sku: "BK1" }
              as: CenterAdmin
            - call: "POST /birth-center/clients"
              payload: { full_name: "Ada A", date_of_birth: "1994-03-02", parity: 0 }
              as: IntakeCoordinator
              captures: { client_id: $.data.id }
            - call: "POST /birth-center/episodes"
              payload: { client_id: "${client_id}", package_code: "PKG_BIRTH", edd: "2026-08-01" }
              as: IntakeCoordinator
              captures: { ep_id: $.data.id }
            - call: "POST /birth-center/insurance-claims"
              payload: { episode_id: "${ep_id}" }
              as: BillingClerk
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /birth-center/insurance-claims/${claim_id}/deny"
              payload: {}
              as: BillingClerk
          assert:
            - "after trigger, InsuranceClaim.${claim_id}.status == DENIED"
            - "after trigger, Episode.${ep_id}.balance_due_cents == 800000"

      - name: void_claim_reverts_to_estimate
        claim_type: Reconciliation
        grounds: [calculations.charge_client_responsibility, state_machines.InsuranceClaim.transitions.SUBMITTED_to_VOID]
        distinguishing_aspect: "Voiding a DENIED claim (no plan exists) reverts the GLOBAL_FEE responsibility from 800000 back to the 160000 ESTIMATE."
        test_recipe:
          setup: ["Standard kit+package+client+episode; claim SUBMITTED then DENIED (balance 800000)."]
          setup_api_calls:
            - call: "POST /birth-center/supply-kits"
              payload: { sku: "BK1", name: "Birth Kit", on_hand_count: 5 }
              as: CenterAdmin
            - call: "POST /birth-center/care-packages"
              payload: { code: "PKG_BIRTH", package_type: "BIRTH", global_fee_cents: 800000, prenatal_visits_included: 3, postpartum_visits_included: 2, kit_sku: "BK1" }
              as: CenterAdmin
            - call: "POST /birth-center/clients"
              payload: { full_name: "Ada A", date_of_birth: "1994-03-02", parity: 0 }
              as: IntakeCoordinator
              captures: { client_id: $.data.id }
            - call: "POST /birth-center/episodes"
              payload: { client_id: "${client_id}", package_code: "PKG_BIRTH", edd: "2026-08-01" }
              as: IntakeCoordinator
              captures: { ep_id: $.data.id }
            - call: "POST /birth-center/insurance-claims"
              payload: { episode_id: "${ep_id}" }
              as: BillingClerk
              captures: { claim_id: $.data.id }
            - call: "POST /birth-center/insurance-claims/${claim_id}/deny"
              payload: {}
              as: BillingClerk
          trigger:
            - call: "POST /birth-center/insurance-claims/${claim_id}/void"
              payload: {}
              as: BillingClerk
          assert:
            - "after trigger, InsuranceClaim.${claim_id}.status == VOID"
            - "after trigger, Episode.${ep_id}.balance_due_cents == 160000 (reverted to ESTIMATE)"

      - name: risk_tier_zero_completed_visits_low
        claim_type: Input Set Filtering
        grounds: [calculations.episode_risk_tier, entities.Episode.fields.risk_tier]
        distinguishing_aspect: "An episode with only SCHEDULED visits (no COMPLETED) has risk_tier LOW — SCHEDULED/NO_SHOW/CANCELLED excluded from the input set."
        test_recipe:
          setup: ["Standard kit+package+client+episode; one visit scheduled (never completed)."]
          setup_api_calls:
            - call: "POST /birth-center/supply-kits"
              payload: { sku: "BK1", name: "Birth Kit", on_hand_count: 5 }
              as: CenterAdmin
            - call: "POST /birth-center/care-packages"
              payload: { code: "PKG_BIRTH", package_type: "BIRTH", global_fee_cents: 800000, prenatal_visits_included: 3, postpartum_visits_included: 2, kit_sku: "BK1" }
              as: CenterAdmin
            - call: "POST /birth-center/clients"
              payload: { full_name: "Ada A", date_of_birth: "1994-03-02", parity: 0 }
              as: IntakeCoordinator
              captures: { client_id: $.data.id }
            - call: "POST /birth-center/episodes"
