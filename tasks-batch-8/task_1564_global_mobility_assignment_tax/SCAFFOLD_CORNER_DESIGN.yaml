  # ===========================================================================
  - section: complexity_layers
    instances:
      - name: clock_expiry_cascade_recomputes_draft_socsec
        claim_type: cascading_side_effects
        grounds: [state_machines.CertificateOfCoverage.ISSUED_to_EXPIRED, calculations.employer_social_security, endpoints]
        distinguishing_aspect: "Scheduled/clock cascade: setting the logical clock to 2026-09-16 sweeps the ISSUED certificate (valid_until 2026-09-15) to EXPIRED, flips PayrollSplit.coc_exempt to false, and recomputes the still-DRAFT October record's employer_socsec_cents from 0 to 27540 — while the POSTED September record stays frozen at 0."
        test_recipe:
          setup:
            - "Activated assignment with CoC ISSUED valid 2026-09-01..2026-09-15"
            - "September record POSTED (socsec frozen 0); October record DRAFT (socsec computed 0 under exemption)"
          setup_api_calls:
            - { call: "POST /mobility/programs", payload: { name: "GM Program", home_country_code: "US" }, as: MobilityAdmin, captures: { prog_id: "$.data.id" } }
            - { call: "POST /mobility/employees", payload: { employee_ref: "E1001", full_name: "Ada Assignee", home_country_code: "US", family_size: 2, annual_base_salary_cents: 10800000 }, as: MobilityAdmin, captures: { emp_id: "$.data.id" } }
            - { call: "POST /mobility/allowance-policies", payload: { policy_name: "JP Standard", host_country_code: "JP", effective_from: "2026-01-01", effective_to: "2027-12-31", per_diem_daily_cents: 7500, housing_monthly_cap_cents: 300000, cola_pct: 15 }, as: MobilityAdmin, captures: { pol_id: "$.data.id" } }
            - { call: "POST /mobility/assignments", payload: { program_id: "${prog_id}", employee_id: "${emp_id}", policy_id: "${pol_id}", host_country_code: "JP", host_business_unit: "BU-TOKYO", assignment_type: "LONG_TERM", totalization_applies: true, start_date: "2026-09-01", planned_end_date: "2027-08-31" }, as: MobilityAdmin, captures: { asg_id: "$.data.id" } }
            - { call: "POST /mobility/compensation-packages", payload: { assignment_id: "${asg_id}", letter_title: "Letter A", home_base_annual_cents: 10800000 }, as: PayrollSpecialist, as_user_id: "ps-1", captures: { pkg_id: "$.data.id" } }
            - { call: "POST /mobility/compensation-packages/${pkg_id}/submit", as: PayrollSpecialist, as_user_id: "ps-1" }
            - { call: "POST /mobility/compensation-packages/${pkg_id}/approve", as: MobilityApprover, as_user_id: "ma-9" }
            - { call: "POST /mobility/payroll-splits", payload: { assignment_id: "${asg_id}", home_payroll_pct: 60, host_payroll_pct: 40 }, as: PayrollSpecialist, captures: { spl_id: "$.data.id" } }
            - { call: "POST /mobility/payroll-splits/${spl_id}/activate", as: PayrollSpecialist }
            - { call: "POST /mobility/certificates-of-coverage", payload: { assignment_id: "${asg_id}", application_ref: "COC-1" }, as: VendorCoordinator, captures: { coc_id: "$.data.id" } }
            - { call: "POST /mobility/certificates-of-coverage/${coc_id}/submit", as: VendorCoordinator }
            - { call: "POST /mobility/certificates-of-coverage/${coc_id}/mark-issued", payload: { valid_from: "2026-09-01", valid_until: "2026-09-15" }, as: VendorCoordinator }
            - { call: "POST /mobility/assignments/${asg_id}/submit", as: MobilityAdmin, as_user_id: "adm-1" }
            - { call: "POST /mobility/assignments/${asg_id}/approve-bu", as: BusinessUnitApprover, as_user_id: "bu-1" }
            - { call: "POST /mobility/assignments/${asg_id}/approve-mobility", as: MobilityApprover, as_user_id: "ma-9" }
            - { call: "POST /mobility/shadow-payroll-records", payload: { assignment_id: "${asg_id}", tax_year: 2026, period_month: 9, total_gross_cents: 900000, per_diem_days: 0, housing_receipts_cents: 0 }, as: PayrollSpecialist, captures: { rec_sep: "$.data.id" } }
            - { call: "POST /mobility/shadow-payroll-records/${rec_sep}/post", as: PayrollSpecialist }
            - { call: "POST /mobility/shadow-payroll-records", payload: { assignment_id: "${asg_id}", tax_year: 2026, period_month: 10, total_gross_cents: 900000, per_diem_days: 0, housing_receipts_cents: 0 }, as: PayrollSpecialist, captures: { rec_oct: "$.data.id", oct_soc_before: "$.data.employer_socsec_cents" } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-16T00:00:00Z" }, as: MobilityAdmin }
            - { call: "GET /mobility/certificates-of-coverage/${coc_id}", as: MobilityAdmin, captures: { coc_status: "$.data.status" } }
            - { call: "GET /mobility/payroll-splits/${spl_id}", as: MobilityAdmin, captures: { spl_exempt: "$.data.coc_exempt" } }
            - { call: "GET /mobility/shadow-payroll-records/${rec_oct}", as: MobilityAdmin, captures: { oct_soc_after: "$.data.employer_socsec_cents" } }
            - { call: "GET /mobility/shadow-payroll-records/${rec_sep}", as: MobilityAdmin, captures: { sep_soc_after: "$.data.employer_socsec_cents" } }
          assert:
            - "oct_soc_before == 0 (exempt at creation)"
            - "coc_status == EXPIRED after the clock passes valid_until (hop 1: sweep)"
            - "spl_exempt == false (hop 2)"
            - "oct_soc_after == 27540 (hop 3: DRAFT recompute round_half_up(360000 x 0.0765))"
            - "sep_soc_after == 0 (POSTED records are frozen and do not recompute)"

      - name: occ_layer_covered_by_validations
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[cost-projection-create-stale-assignment]", "concurrency_rules[extension-request-create-stale-assignment]", "concurrency_rules[repatriation-initiate-stale-assignment]"]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / referential_beats_fiscal_on_extension_approve"
          rationale: "OCC mechanics are asserted by the three §1.9 occ_* validation instances (each concurrency_rules entry maps to one); this stub only closes the layer-level audit row. The cited difficulty instance additionally depends on a fresh OCC capture in its chain."
      - name: dual_variant_layer_covered
        claim_type: dual_variant_calculation
        grounds: [calculations.hypothetical_tax, calculations.cost_projection_total]
        excluded_because:
          difficulty_instance: "dual_variant_calc / hypothetical_tax_provisional_vs_final_divergence"
          rationale: "Both variant pairs asserted with exact literals in the two §1.8 dual_variant_calc instances."
      - name: rate_threshold_layer_covered
        claim_type: rate_threshold_triggers
        grounds: [calculations.per_diem_annual_cap, calculations.overrun_posture_check]
        excluded_because:
          difficulty_instance: "boundary_precision_check / overrun_threshold_exact_equality_stays_normal"
          rationale: "Both threshold surfaces (cumulative day cap, pro-rata overrun ratio) are asserted at their exact boundaries in §1.8 boundary instances."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_create_returns_computed
        claim_type: immediate_visibility
        grounds: [complexity_profile]
        excluded_because:
          difficulty_instance: "combinatorial_formula / hypothetical_tax_tiered_brackets_with_proration"
          rationale: "Immediate visibility of all computed fields in the create response is asserted by §1.9 entities / shadow_record_create_returns_computed_fields_immediately; the cited difficulty instance also reads computed values straight off create responses."
      - name: derived_fields_reconciled_after_source_reversal
        claim_type: immediate_visibility
