            - { call: "POST /employees", payload: { program_id: "${prog_id}", group_id: "${grp_id}", full_name: "Eve Turing", email: "eve@acme.test", personal_card_on_file: true }, as: ProgramAdmin, captures: { emp_id: $.data.id } }
          trigger:
            - { call: "POST /budget-rules/${rule_id}/activate", payload: { expected_employee_group_version: "${grp_v}" }, as: BenefitsController, as_user_id: "ctrl-approver" }
            - { call: "POST /benefit-periods", payload: { employee_id: "${emp_id}", period_month: "2026-09" }, as: ProgramAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { now: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /budget-rules/${rule_id}/activate", payload: { expected_employee_group_version: "${grp_v}" }, as: BenefitsController, as_user_id: "ctrl-approver" }
            - { call: "POST /benefit-periods", payload: { employee_id: "${emp_id}", period_month: "2026-09" }, as: ProgramAdmin, captures: { per_id: $.data.id } }
