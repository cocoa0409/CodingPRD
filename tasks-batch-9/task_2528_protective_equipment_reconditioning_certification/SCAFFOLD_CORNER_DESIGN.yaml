          - validations.v-repair-order-state
          - errors.ERR_REPAIR_ORDER_STATE_INVALID
          - state_machines.RepairOrder.status
        distinguishing_aspect: |
          install is defined only from SUBMITTED, so calling it on a DRAFT order
          that already carries a line must fail with
          ERR_REPAIR_ORDER_STATE_INVALID / 409 and — critically — must not move
          the part ledger: the part stays 4 on hand / 0 reserved / 0 consumed
          because submit is the step that reserves stock.
        test_recipe:
          setup:
            - "one unit in REPAIR_PENDING with a DRAFT RepairOrder carrying one part line for quantity 1"
          setup_api_calls:
            - *k_clock
            - *k_acct
            - *k_waiver
            - *k_model
