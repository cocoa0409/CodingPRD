# =============================================================================
# PRD Benchmark Scaffold — Indoor Skydiving / Wind Tunnel (iFLY style)
# Difficulty: Expert
# =============================================================================

scenario: |
  576. Indoor Skydiving / Wind Tunnel (iFLY style): flight package (minutes) &
  time-slot, group/party & first-time vs returning, instructor & tunnel
  scheduling, waiver & weight/health limit, gear & reflight credit, membership &
  coaching, walk-in vs reservation, video add-on

domain_name: wind-tunnel
# Flat topology: every resource is a top-level collection reached by FK filter.
# api_prefix "/" means routes are the bare collection paths (/tunnels, /flights, ...).
api_prefix: "/"

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency        # OCC on Session.version for instructor (re)assignment
    - dual_variant_calculation      # walk-in vs reservation price; provisional vs final reflight credit
    - cascading_side_effects        # abort -> booking minutes -> booking status -> member counter
    - rate_threshold_triggers       # weight limit, party-size discount tiers, lead-time discount tiers

  entity_topology: flat
  # flat: peer entities linked by foreign keys; no nested URL ownership chains.

  state_machine_shape: parallel
  # Session carries two independent axes (op_status x staffing_status); Flight is
  # a branching fork-join (CHECKED_IN -> {FLOWN, ABORTED, NO_SHOW}); Booking cycles
  # CONFIRMED <-> EXHAUSTED.

  relationship_patterns:
    - one_to_many        # Member->Bookings, Session->Flights, Tunnel->Sessions
    - cross_aggregate    # Flight references Booking + Session + Member across aggregates

  role_model: peer_roles
  # Flyer (Member), Instructor own distinct resources; FrontDesk / Manager are
  # operational (opaque).

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Tunnel
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Tunnel display name" }
      - { name: max_weight_kg, type: number, source: input, description: "Maximum flyer weight allowed in this tunnel (kg)" }
      - { name: default_capacity, type: integer, source: input, description: "Default flyer capacity per session on this tunnel" }
      - { name: turnaround_minutes, type: integer, source: input, description: "Required buffer gap (minutes) between two sessions on this tunnel" }
      - { name: status, type: enum, source: computed, default: OPERATIONAL, description: "OPERATIONAL | MAINTENANCE — toggled by maintenance endpoint", constraints: "OPERATIONAL, MAINTENANCE" }

  - name: Instructor
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Instructor name" }
      - { name: cert_level, type: enum, source: input, description: "Certification level", constraints: "L1, L2, L3" }
      - { name: tier, type: enum, source: computed, default: JUNIOR, description: "JUNIOR until sessions_completed >= SENIOR_UPGRADE_THRESHOLD (=2), then SENIOR", constraints: "JUNIOR, SENIOR" }
      - { name: sessions_completed, type: integer, source: system, default: 0, description: "Count of sessions this instructor has CLOSED" }
      - { name: status, type: enum, source: input, default: ACTIVE, description: "ACTIVE | OFF", constraints: "ACTIVE, OFF" }

  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Flyer name" }
      - { name: weight_kg, type: number, source: input, description: "Flyer weight in kg — compared to Tunnel.max_weight_kg at check-in" }
      - { name: experience_status, type: enum, source: input, default: FIRST_TIME, description: "FIRST_TIME | RETURNING", constraints: "FIRST_TIME, RETURNING" }
      - { name: health_flags, type: array, source: input, default: [], description: "Declared health conditions (strings); non-empty requires health_ok waiver" }
      - { name: membership_tier, type: enum, source: computed, default: NONE, description: "NONE | STANDARD | PRO — derived from the member's ACTIVE Membership (NONE if none)", constraints: "NONE, STANDARD, PRO" }
      - { name: reflight_credit_minutes, type: integer, source: computed, default: 0, description: "Current reflight-credit balance in minutes (granted on abort, reconciled at session close, consumed on discounted reflight)" }
      - { name: total_credits_minted, type: integer, source: system, default: 0, description: "Lifetime reflight-credit minutes ever granted (final values); used for conservation invariant" }
      - { name: total_credits_consumed, type: integer, source: system, default: 0, description: "Lifetime reflight-credit minutes ever consumed by discounted reflights" }
      - { name: wallet_cents, type: integer, source: computed, default: 0, description: "Refund wallet balance in cents (credited when a refundable booking is cancelled)" }
      - { name: confirmed_booking_count, type: integer, source: system, default: 0, description: "Number of this member's bookings currently in CONFIRMED status" }
      - { name: outstanding_addon_cents, type: integer, source: computed, default: 0, description: "Sum of per-line-rounded add-on charges (video + coaching) owed by this member" }

  - name: Membership
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the member holding this membership" }
      - { name: tier, type: enum, source: input, description: "STANDARD | PRO", constraints: "STANDARD, PRO" }
      - { name: discount_pct, type: number, source: computed, description: "0.10 for STANDARD, 0.15 for PRO — applied to booking price and add-on charges" }
      - { name: status, type: enum, source: computed, default: ACTIVE, description: "ACTIVE | CANCELLED", constraints: "ACTIVE, CANCELLED" }

  - name: PackageProduct
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Package name (e.g. First Flight 2-min)" }
      - { name: included_minutes, type: integer, source: input, description: "Flight minutes included per flyer in this package" }
      - { name: base_price_cents, type: integer, source: input, description: "Base price per flyer in cents (before party/lead/membership adjustments)" }
      - { name: min_experience, type: enum, source: input, default: FIRST_TIME, description: "Minimum experience required to book: FIRST_TIME allows anyone; RETURNING requires member experience_status RETURNING", constraints: "FIRST_TIME, RETURNING" }
      - { name: active, type: boolean, source: input, default: true, description: "Whether the package can be booked" }

  - name: Booking
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; who the booking is for" }
      - { name: package_id, type: string, source: input, description: "FK -> PackageProduct.id; package purchased" }
      - { name: booking_type, type: enum, source: input, description: "WALK_IN | RESERVATION — pricing variant", constraints: "WALK_IN, RESERVATION" }
      - { name: party_size, type: integer, source: input, description: "Number of flyers in the party (must be >= 1)" }
      - { name: lead_days, type: integer, source: input, default: 0, description: "Advance days before the intended flight; drives reservation lead discount (ignored for WALK_IN)" }
      - { name: minutes_included, type: integer, source: computed, description: "party_size * package.included_minutes — total flight-minute pool for this booking" }
      - { name: minutes_remaining, type: integer, source: computed, description: "Remaining flight minutes; decremented by flights, refunded on cancel/abort; never negative" }
      - { name: total_price_cents, type: integer, source: computed, description: "Computed booking price (see calc booking_price)" }
      - { name: refunded_cents, type: integer, source: computed, default: 0, description: "Amount refunded to member wallet on cancellation" }
      - { name: status, type: enum, source: computed, default: CONFIRMED, description: "CONFIRMED | EXHAUSTED | CANCELLED | COMPLETED", constraints: "CONFIRMED, EXHAUSTED, CANCELLED, COMPLETED" }

  - name: Session
    parent: null
    common_fields: true
    fields:
      - { name: tunnel_id, type: string, source: input, description: "FK -> Tunnel.id; tunnel this session occupies" }
      - { name: instructor_id, type: string, source: computed, default: null, description: "FK -> Instructor.id; assigned instructor (null until STAFFED)" }
      - { name: start_utc, type: datetime, source: input, description: "Session start (ISO 8601 UTC)" }
      - { name: end_utc, type: datetime, source: input, description: "Session end (ISO 8601 UTC); must be > start_utc and duration >= MIN_SESSION_MINUTES (=15)" }
      - { name: capacity, type: integer, source: input, description: "Max flyer seats; defaults to tunnel.default_capacity when omitted" }
      - { name: op_status, type: enum, source: computed, default: OPEN, description: "Operational axis: OPEN | RUNNING | CLOSED | CANCELLED", constraints: "OPEN, RUNNING, CLOSED, CANCELLED" }
      - { name: staffing_status, type: enum, source: computed, default: UNSTAFFED, description: "Staffing axis (independent of op_status): UNSTAFFED | STAFFED", constraints: "UNSTAFFED, STAFFED" }
      - { name: seats_taken, type: integer, source: computed, default: 0, description: "Count of flights in {SCHEDULED, CHECKED_IN, FLOWN} on this session" }
      - { name: seats_available, type: integer, source: computed, description: "capacity - seats_taken; never negative" }

  - name: Flight
    parent: null
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; booking whose minutes this flight consumes" }
      - { name: session_id, type: string, source: input, description: "FK -> Session.id; session the flyer flies in" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the flyer (must match booking.member_id or a party member)" }
      - { name: scheduled_minutes, type: integer, source: input, description: "Flight minutes booked for this slot" }
      - { name: status, type: enum, source: computed, default: SCHEDULED, description: "SCHEDULED | CHECKED_IN | FLOWN | ABORTED | NO_SHOW | CANCELLED", constraints: "SCHEDULED, CHECKED_IN, FLOWN, ABORTED, NO_SHOW, CANCELLED" }
      - { name: minutes_charged, type: integer, source: computed, default: 0, description: "Minutes finally charged to the booking (scheduled_minutes on FLOWN; 0 on refunded outcomes)" }
      - { name: flown_minutes, type: integer, source: input, default: 0, description: "Actual minutes flown before an abort (supplied on abort); used to reconcile reflight credit" }
      - { name: reflight_credit_granted, type: integer, source: computed, default: 0, description: "Reflight-credit minutes granted for this flight (provisional at abort, final at session close)" }
      - { name: video_addon_purchased, type: boolean, source: computed, default: false, description: "Whether the video add-on was purchased for this flight" }
      - { name: video_charge_cents, type: integer, source: computed, default: 0, description: "Per-line-rounded video charge for this flight" }

  - name: Waiver
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; signer" }
      - { name: weight_kg_declared, type: number, source: input, description: "Weight declared on the waiver" }
      - { name: health_ok, type: boolean, source: input, description: "Whether the flyer certifies no disqualifying health conditions" }
      - { name: signed_at, type: datetime, source: system, description: "Logical-clock timestamp when signed" }
      - { name: expires_at, type: datetime, source: computed, description: "signed_at + WAIVER_VALID_DAYS (=90) days" }
      - { name: status, type: enum, source: computed, default: SIGNED, description: "SIGNED | EXPIRED (EXPIRED when current clock > expires_at)", constraints: "SIGNED, EXPIRED" }

  - name: CoachingBooking
    parent: null
    common_fields: true
    fields:
      - { name: flight_id, type: string, source: input, description: "FK -> Flight.id; flight the coaching attaches to" }
      - { name: instructor_id, type: string, source: input, description: "FK -> Instructor.id; coaching instructor" }
      - { name: minutes, type: integer, source: input, description: "Coaching minutes purchased" }
      - { name: charge_cents, type: integer, source: computed, description: "Per-line-rounded coaching charge (see calc addon_statement)" }
      - { name: status, type: enum, source: computed, default: REQUESTED, description: "REQUESTED | DELIVERED | CANCELLED", constraints: "REQUESTED, DELIVERED, CANCELLED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- Session: PARALLEL dimensions (op_status x staffing_status) — non-linear ----
  - entity: Session
    field: op_status
    initial_state: OPEN
    terminal_states: [CLOSED, CANCELLED]
    note: "op_status and staffing_status evolve independently on the same Session row."
    transitions:
      - from: OPEN
        to: RUNNING
        trigger: "POST /sessions/{id}/start"
        actor: "Instructor or FrontDesk"
        preconditions:
          - "staffing_status == STAFFED (ERR_SESSION_NOT_STAFFED)"
          - "Tunnel.status == OPERATIONAL (ERR_TUNNEL_NOT_OPERATIONAL) — cross-entity dep on Tunnel"
        side_effects: []
      - from: RUNNING
        to: CLOSED
        trigger: "POST /sessions/{id}/close"
        actor: "Instructor or FrontDesk"
        preconditions: []
        side_effects:
          - "CASCADE B (depth 2): assigned Instructor.sessions_completed += 1; then if sessions_completed >= SENIOR_UPGRADE_THRESHOLD, Instructor.tier -> SENIOR"
          - "For each SCHEDULED or CHECKED_IN flight in the session: Flight -> NO_SHOW (minutes forfeited, no refund)"
          - "For each ABORTED flight in the session: reconcile reflight credit provisional->final (calc reflight_credit_valuation, variant=final): Flight.reflight_credit_granted -> scheduled_minutes - flown_minutes; then Member.reflight_credit_minutes and Member.total_credits_minted adjusted by the (final - provisional) delta"
          - "For each FLOWN flight: Flight.minutes_charged := scheduled_minutes (finalized)"
      - from: [OPEN, RUNNING]
        to: CANCELLED
        trigger: "POST /sessions/{id}/cancel"
        actor: "FrontDesk or Manager"
        preconditions: []
        side_effects:
          - "For each non-terminal flight (SCHEDULED, CHECKED_IN) in the session: Flight -> CANCELLED; refund scheduled_minutes to its Booking (calc booking_minutes)"
          - "Freed seats: Session.seats_taken recomputed"

  - entity: Session
    field: staffing_status
    initial_state: UNSTAFFED
    terminal_states: []
    note: "Independent staffing axis; supports (re)assignment (STAFFED->STAFFED) guarded by OCC."
    transitions:
      - from: UNSTAFFED
        to: STAFFED
        trigger: "POST /sessions/{id}/assign-instructor"
        actor: "FrontDesk or Manager"
        preconditions:
          - "expected_session_version matches Session.version (ERR_STALE_VERSION)"
          - "Instructor has no other non-cancelled session overlapping [start_utc, end_utc) — adjacency allowed (ERR_INSTRUCTOR_TIME_CONFLICT)"
        side_effects:
          - "Session.instructor_id := instructor_id"
          - "increments Session.version by 1"
      - from: STAFFED
        to: STAFFED
        trigger: "POST /sessions/{id}/assign-instructor (reassignment; new assignment supersedes prior)"
        actor: "FrontDesk or Manager"
        preconditions:
          - "expected_session_version matches Session.version (ERR_STALE_VERSION) — see concurrency_rules session-assign-supersede"
          - "new Instructor free over [start_utc, end_utc) (ERR_INSTRUCTOR_TIME_CONFLICT)"
        side_effects:
          - "Session.instructor_id := new instructor_id"
          - "increments Session.version by 1"

  # ---- Flight: BRANCHING fork-join with divergent side effects — non-linear ----
  - entity: Flight
    field: status
    initial_state: SCHEDULED
    terminal_states: [FLOWN, ABORTED, NO_SHOW, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CHECKED_IN
        trigger: "POST /flights/{id}/check-in"
        actor: "Instructor or FrontDesk"
        preconditions:
          - "Session.op_status IN {OPEN, RUNNING} (ERR_INVALID_STATE) — cross-entity dep on Session"
          - "Member has a Waiver with status SIGNED and current clock <= expires_at (ERR_WAIVER_INVALID)"
          - "Member.weight_kg <= Tunnel.max_weight_kg (ERR_WEIGHT_LIMIT_EXCEEDED) — boundary: strictly greater is rejected"
        side_effects: []
      - from: CHECKED_IN
        to: FLOWN
        trigger: "POST /flights/{id}/complete"
        actor: Instructor
        preconditions:
          - "Session.op_status == RUNNING (ERR_INVALID_STATE)"
        side_effects:
          - "Flight.minutes_charged := scheduled_minutes"
          - "Booking minutes stay consumed (no refund)"
      - from: CHECKED_IN
        to: ABORTED
        trigger: "POST /flights/{id}/abort"
        actor: Instructor
        preconditions:
          - "Session.op_status == RUNNING (ERR_INVALID_STATE)"
        side_effects:
          - "CASCADE A (depth 3): refund scheduled_minutes to Booking -> Booking.minutes_remaining += scheduled_minutes (hop1); if Booking.status was EXHAUSTED it flips EXHAUSTED->CONFIRMED (hop2); which increments Member.confirmed_booking_count by 1 (hop3)"
          - "Grant provisional reflight credit (calc reflight_credit_valuation, variant=provisional): Flight.reflight_credit_granted := scheduled_minutes; Member.reflight_credit_minutes += scheduled_minutes; Member.total_credits_minted += scheduled_minutes"
          - "Flight.flown_minutes := supplied flown_minutes; Flight.minutes_charged := 0"
      - from: [SCHEDULED, CHECKED_IN]
        to: NO_SHOW
        trigger: "POST /flights/{id}/no-show, or system on session close"
        actor: "FrontDesk, Instructor, or system"
        preconditions: []
        side_effects:
          - "Minutes forfeited: NO refund to Booking (divergent from ABORTED/CANCELLED)"
          - "Session.seats_taken decremented (seat freed)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /flights/{id}/cancel, or system on booking/session cancel"
        actor: "FrontDesk, Flyer, or system"
        preconditions: []
        side_effects:
          - "Refund scheduled_minutes to Booking (calc booking_minutes); Session.seats_taken decremented"

  # ---- Booking: cyclic CONFIRMED <-> EXHAUSTED ----
  - entity: Booking
    field: status
    initial_state: CONFIRMED
    terminal_states: [CANCELLED, COMPLETED]
    transitions:
      - from: CONFIRMED
        to: EXHAUSTED
        trigger: "system (minutes_remaining reaches 0 after a flight consumes minutes)"
        actor: system
        preconditions:
          - "minutes_remaining == 0"
        side_effects:
          - "Member.confirmed_booking_count -= 1"
      - from: EXHAUSTED
        to: CONFIRMED
        trigger: "system (minutes_remaining rises above 0 after a flight abort/cancel refund)"
        actor: system
        preconditions:
          - "minutes_remaining > 0"
        side_effects:
          - "Member.confirmed_booking_count += 1"
      - from: [CONFIRMED, EXHAUSTED]
        to: CANCELLED
        trigger: "POST /bookings/{id}/cancel"
        actor: "Flyer or FrontDesk"
        preconditions:
          - "No flight on this booking is in FLOWN status (ERR_BOOKING_HAS_FLOWN_FLIGHT)"
        side_effects:
          - "Each SCHEDULED/CHECKED_IN flight on this booking -> CANCELLED (refund of minutes is moot as booking ends)"
          - "Refund to wallet: Member.wallet_cents += total_price_cents; Booking.refunded_cents := total_price_cents"
          - "If booking was CONFIRMED: Member.confirmed_booking_count -= 1"

  # ---- Waiver: SIGNED -> EXPIRED ----
  - entity: Waiver
    field: status
    initial_state: SIGNED
    terminal_states: [EXPIRED]
    transitions:
      - from: SIGNED
        to: EXPIRED
        trigger: "system (current logical clock > expires_at, evaluated on read/check-in)"
        actor: system
        preconditions: []
        side_effects: []

  # ---- CoachingBooking: REQUESTED -> DELIVERED / CANCELLED ----
  - entity: CoachingBooking
    field: status
    initial_state: REQUESTED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: DELIVERED
        trigger: "system on session close (coaching delivered within the flown session)"
        actor: system
        preconditions: []
        side_effects: []
      - from: REQUESTED
        to: CANCELLED
        trigger: "system on flight cancel/no-show"
        actor: system
        preconditions: []
        side_effects:
          - "Member.outstanding_addon_cents -= charge_cents (calc addon_statement re-run)"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on Session.version)
# =============================================================================
concurrency_rules:
  - rule_id: session-assign-supersede
    parent_entity: Session
    write_endpoint: "POST /sessions/{id}/assign-instructor"
    occ_field: "expected_session_version"
    description: |
      Assigning an instructor to a Session supersedes any prior assignment
      (STAFFED->STAFFED reassignment is legitimate on its own). A caller whose
      expected_session_version is older than the Session's current version —
      because a prior assignment already advanced it — is rejected. The stale
      view is caught deterministically by two strictly sequential assign calls
      that both carry the version observed before the first assign.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: booking_price
    trigger: "POST /bookings (Booking create)"
    algorithm: tiered_pricing
    input_set: "package.base_price_cents, booking_type, party_size, lead_days, member.membership_tier"
    formula: |
      # Evaluation order is PINNED top-to-bottom; all money in integer cents.
      per_flyer  = package.base_price_cents
      party_mult = 1.00 if party_size in {1,2}
                 = 0.95 if party_size in {3,4}
                 = 0.90 if party_size >= 5
      subtotal   = per_flyer * party_size * party_mult          # exact integer for chosen constants
      if booking_type == WALK_IN:
          typed = subtotal * (1 + WALK_IN_SURCHARGE_PCT)        # 1.20
      else:  # RESERVATION
          lead_disc = 0.00 if lead_days < 3
                    = 0.05 if 3 <= lead_days < 7
                    = 0.10 if lead_days >= 7
          typed = subtotal * (1 - lead_disc)
      member_disc = MEMBER_DISCOUNT[member.membership_tier]     # NONE 0.00 / STANDARD 0.10 / PRO 0.15
      total_price_cents = round_half_up(typed * (1 - member_disc))   # single final rounding to whole cents
    constants:
      WALK_IN_SURCHARGE_PCT: 0.20
      PARTY_MULT: { "1-2": 1.00, "3-4": 0.95, "5+": 0.90 }
      LEAD_DISCOUNT: { "lt3": 0.00, "3-6": 0.05, "ge7": 0.10 }
      MEMBER_DISCOUNT: { NONE: 0.00, STANDARD: 0.10, PRO: 0.15 }
    precision: "whole cents, round_half_up, single final rounding"
    variants:
      - name: walk_in
        when: "booking_type == WALK_IN"
        difference: "applies +20% surcharge; ignores lead_days entirely"
      - name: reservation
        when: "booking_type == RESERVATION"
        difference: "applies tiered lead-time discount; no surcharge"

  - name: addon_statement
    trigger: "POST /flights/{id}/video, POST /coaching-bookings, and their cancellations"
    algorithm: aggregation
    input_set: "member's flights with video_addon_purchased == true, and member's CoachingBookings with status != CANCELLED"
    formula: |
      # ROUND-PER-LINE-THEN-SUM is PINNED (summing raw then rounding gives a different total).
      member_disc = MEMBER_DISCOUNT[member.membership_tier]
      video_line(flight)      = round_half_up(VIDEO_PRICE_CENTS   * (1 - member_disc))
      coaching_line(coaching) = round_half_up(COACHING_RATE_PER_MIN_CENTS * coaching.minutes * (1 - member_disc))
      Flight.video_charge_cents := video_line(flight)          # per flight
      CoachingBooking.charge_cents := coaching_line(coaching)   # per coaching
      Member.outstanding_addon_cents = sum(video_line over member's video flights)
                                     + sum(coaching_line over member's non-cancelled coachings)
    constants:
      VIDEO_PRICE_CENTS: 3335
      COACHING_RATE_PER_MIN_CENTS: 1245
      MEMBER_DISCOUNT: { NONE: 0.00, STANDARD: 0.10, PRO: 0.15 }
    precision: "whole cents, round_half_up, rounded per line item BEFORE summation"

  - name: reflight_credit_valuation
    trigger: "POST /flights/{id}/abort (provisional); POST /sessions/{id}/close (final reconciliation)"
    algorithm: forward_looking
    input_set: "the aborted flight's scheduled_minutes and flown_minutes"
    formula: |
      provisional (at abort):  credit = scheduled_minutes                  # full slot credited up front
      final       (at close):  credit = scheduled_minutes - flown_minutes  # only the unflown remainder
      reconciliation at close: delta = final - provisional (<= 0)
        Member.reflight_credit_minutes += delta
        Member.total_credits_minted    += delta
        Flight.reflight_credit_granted  = final
    precision: "integer minutes"
    variants:
      - name: provisional
        when: "at the moment of abort, before the session closes"
        difference: "credits the full scheduled_minutes regardless of minutes actually flown"
      - name: final
        when: "at session close"
        difference: "credits only scheduled_minutes - flown_minutes; reconciles the earlier over-grant"

  - name: booking_minutes
    trigger: "flight create/complete (consume), flight abort/cancel and session cancel (refund)"
    algorithm: aggregation
    input_set: "flights on the booking in states {SCHEDULED, CHECKED_IN, FLOWN}"
    formula: |
      consumed = sum(scheduled_minutes for flights in {SCHEDULED, CHECKED_IN, FLOWN})
      minutes_remaining = minutes_included - consumed        # never < 0; creation rejected if it would go negative
      # Conservation invariant (see §1.8 rule compensating_invariant / booking_minutes_conserved):
      #   minutes_remaining + consumed == minutes_included   holds after every forward+compensating pair.
    precision: "integer minutes"

  - name: session_seats
    trigger: "flight create (take seat), flight cancel/no-show/session cancel (release seat)"
    algorithm: aggregation
    input_set: "flights on the session in states {SCHEDULED, CHECKED_IN, FLOWN}"
    formula: |
      seats_taken     = count(flights in {SCHEDULED, CHECKED_IN, FLOWN})
      seats_available = capacity - seats_taken               # never < 0
      # Conservation invariant (see §1.8 / seat_count_conserved):
      #   seats_taken + seats_available == capacity   holds after every take+release pair.
    precision: "integer count"

  - name: membership_discount
    trigger: "POST /memberships (create), POST /memberships/{id}/cancel"
    algorithm: threshold
    input_set: "the member's ACTIVE Membership tier"
    formula: |
      discount_pct = 0.10 if tier == STANDARD
                   = 0.15 if tier == PRO
      Member.membership_tier := tier while membership ACTIVE, else NONE
    constants:
      STANDARD_PCT: 0.10
      PRO_PCT: 0.15
    precision: "ratio"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and recognized"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All referenced resources exist (validated left-to-right: path id, then body FKs member_id, package_id, tunnel_id, instructor_id, booking_id, session_id, flight_id)"
    error_id: "ERR_*_NOT_FOUND (per resource)"
    http_status: 404
    applies_to: all

  - priority: 4
    category: state
    check: "Target resource is in a valid state for the requested transition (Session op/staffing, Flight status, Booking status)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition and flight-creation endpoints"

  - priority: 5
    category: business_referential
    check: "Configuration/eligibility gates: package.min_experience==RETURNING requires member.experience_status==RETURNING; session start requires Tunnel.status==OPERATIONAL; flight create and session start require Session.staffing_status==STAFFED"
    error_id: "ERR_EXPERIENCE_NOT_ELIGIBLE | ERR_TUNNEL_NOT_OPERATIONAL | ERR_SESSION_NOT_STAFFED"
    http_status: 409
    applies_to: "POST /bookings, POST /flights, POST /sessions/{id}/start"

  - priority: 6
    category: business_safety
    check: "Safety gates at check-in: a SIGNED non-expired waiver exists; member.weight_kg <= tunnel.max_weight_kg"
    error_id: "ERR_WAIVER_INVALID | ERR_WEIGHT_LIMIT_EXCEEDED"
    http_status: 422
    applies_to: "POST /flights/{id}/check-in"

  - priority: 7
    category: business_temporal
    check: "Session window valid (end > start, duration >= MIN_SESSION_MINUTES); tunnel free with turnaround buffer; instructor free over the interval (adjacency allowed)"
    error_id: "ERR_INVALID_SESSION_WINDOW | ERR_SESSION_TIME_CONFLICT | ERR_INSTRUCTOR_TIME_CONFLICT"
    http_status: "422 window, 409 conflicts"
    applies_to: "POST /sessions, POST /sessions/{id}/assign-instructor"

  - priority: 8
    category: business_constraint
    check: "party_size >= 1; session seats_available >= 1 for a new flight"
    error_id: "ERR_INVALID_PARTY_SIZE | ERR_SESSION_FULL"
    http_status: 422
    applies_to: "POST /bookings, POST /flights"

  - priority: 9
    category: business_fiscal
    check: "Booking has enough minutes: minutes_remaining >= scheduled_minutes for the new flight"
    error_id: ERR_INSUFFICIENT_MINUTES
    http_status: 422
    applies_to: "POST /flights"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Tunnels ----
  - { method: POST, path: "/tunnels", description: "Create a tunnel", roles: [Manager], code: 201, input: [name, max_weight_kg, default_capacity, turnaround_minutes], output: Tunnel, side_effects: ["status=OPERATIONAL"] }
  - { method: GET, path: "/tunnels/{id}", description: "Get a tunnel", roles: [Manager, FrontDesk], code: 200, input: [], output: Tunnel, side_effects: [] }
  - { method: POST, path: "/tunnels/{id}/maintenance", description: "Toggle tunnel maintenance mode", roles: [Manager], code: 200, input: [mode], output: Tunnel, side_effects: ["status := mode (OPERATIONAL|MAINTENANCE)"] }

  # ---- Instructors ----
  - { method: POST, path: "/instructors", description: "Create an instructor", roles: [Manager], code: 201, input: [name, cert_level], output: Instructor, side_effects: ["tier=JUNIOR, sessions_completed=0, status=ACTIVE"] }
  - { method: GET, path: "/instructors/{id}", description: "Get an instructor", roles: [Manager, FrontDesk], code: 200, input: [], output: Instructor, side_effects: [] }

  # ---- Members ----
  - { method: POST, path: "/members", description: "Register a flyer", roles: [Flyer, FrontDesk], code: 201, input: [name, weight_kg, experience_status, "health_flags?"], output: Member, side_effects: ["all counters/balances 0, membership_tier=NONE"] }
  - { method: GET, path: "/members/{id}", description: "Get a member", roles: [Flyer, FrontDesk, Manager], code: 200, input: [], output: Member, side_effects: [] }
  - { method: GET, path: "/members/{id}/statement", description: "Computed add-on statement for a member", roles: [Flyer, FrontDesk, Manager], code: 200, input: [], output: { statement_total_cents: integer, video_charges_cents: integer, coaching_charges_cents: integer }, side_effects: [] }

  # ---- Waivers ----
  - { method: POST, path: "/waivers", description: "Sign a waiver", roles: [Flyer, FrontDesk], code: 201, input: [member_id, weight_kg_declared, health_ok], output: Waiver, side_effects: ["status=SIGNED, signed_at=clock, expires_at=clock+WAIVER_VALID_DAYS"] }
  - { method: GET, path: "/waivers/{id}", description: "Get a waiver", roles: [Flyer, FrontDesk, Manager], code: 200, input: [], output: Waiver, side_effects: [] }
  - { method: GET, path: "/waivers", description: "List waivers (reverse-reachability for Waiver.member_id)", roles: [Flyer, FrontDesk, Manager], code: 200, input: ["member_id?", "status?", "limit?", "offset?"], output: "Waiver[]", side_effects: [] }

  # ---- Memberships ----
  - { method: POST, path: "/memberships", description: "Enroll a membership", roles: [FrontDesk, Manager], code: 201, input: [member_id, tier], output: Membership, side_effects: ["status=ACTIVE, discount_pct set, member.membership_tier := tier"] }
  - { method: GET, path: "/memberships/{id}", description: "Get a membership", roles: [Flyer, FrontDesk, Manager], code: 200, input: [], output: Membership, side_effects: [] }
  - { method: GET, path: "/memberships", description: "List memberships (reverse-reachability for Membership.member_id)", roles: [FrontDesk, Manager], code: 200, input: ["member_id?", "status?", "limit?", "offset?"], output: "Membership[]", side_effects: [] }
  - { method: POST, path: "/memberships/{id}/cancel", description: "Cancel a membership", roles: [FrontDesk, Manager], code: 200, input: [], output: Membership, side_effects: ["status=CANCELLED, member.membership_tier := NONE"] }

  # ---- Packages ----
  - { method: POST, path: "/packages", description: "Create a package product", roles: [Manager], code: 201, input: [name, included_minutes, base_price_cents, min_experience, "active?"], output: PackageProduct, side_effects: [] }
  - { method: GET, path: "/packages/{id}", description: "Get a package", roles: [Flyer, FrontDesk, Manager], code: 200, input: [], output: PackageProduct, side_effects: [] }

  # ---- Bookings ----
  - { method: POST, path: "/bookings", description: "Create a booking (party of flyers on a package)", roles: [Flyer, FrontDesk], code: 201, input: [member_id, package_id, booking_type, party_size, "lead_days?"], output: Booking, side_effects: ["calc booking_price -> total_price_cents", "minutes_included=party_size*included_minutes, minutes_remaining=minutes_included", "status=CONFIRMED", "member.confirmed_booking_count += 1"] }
  - { method: GET, path: "/bookings/{id}", description: "Get a booking", roles: [Flyer, FrontDesk, Manager], code: 200, input: [], output: Booking, side_effects: [] }
  - { method: GET, path: "/bookings", description: "List bookings (reverse-reachability for Booking.member_id, Booking.package_id)", roles: [Flyer, FrontDesk, Manager], code: 200, input: ["member_id?", "package_id?", "status?", "limit?", "offset?"], output: "Booking[]", side_effects: [] }
  - { method: POST, path: "/bookings/{id}/cancel", description: "Cancel a booking and refund to wallet", roles: [Flyer, FrontDesk], code: 200, input: [], output: Booking, side_effects: ["non-terminal flights -> CANCELLED", "wallet_cents += total_price_cents; refunded_cents := total_price_cents", "status=CANCELLED; if was CONFIRMED member.confirmed_booking_count -= 1"] }

  # ---- Sessions ----
  - { method: POST, path: "/sessions", description: "Schedule a session on a tunnel", roles: [FrontDesk, Manager], code: 201, input: [tunnel_id, start_utc, end_utc, "capacity?"], output: Session, side_effects: ["validate window + tunnel turnaround buffer", "op_status=OPEN, staffing_status=UNSTAFFED, capacity default tunnel.default_capacity"] }
  - { method: GET, path: "/sessions/{id}", description: "Get a session", roles: [Flyer, FrontDesk, Manager, Instructor], code: 200, input: [], output: Session, side_effects: [] }
  - { method: GET, path: "/sessions", description: "List sessions (reverse-reachability for Session.tunnel_id, Session.instructor_id)", roles: [Flyer, FrontDesk, Manager, Instructor], code: 200, input: ["tunnel_id?", "instructor_id?", "op_status?", "limit?", "offset?"], output: "Session[]", side_effects: [] }
  - { method: POST, path: "/sessions/{id}/assign-instructor", description: "Assign (or reassign) the session instructor — OCC guarded", roles: [FrontDesk, Manager], code: 200, input: [instructor_id, expected_session_version], output: Session, side_effects: ["validate instructor free over interval", "instructor_id := instructor_id; staffing_status=STAFFED", "increments Session.version by 1"] }
  - { method: POST, path: "/sessions/{id}/start", description: "Start a session (OPEN -> RUNNING)", roles: [Instructor, FrontDesk], code: 200, input: [], output: Session, side_effects: ["op_status=RUNNING"] }
  - { method: POST, path: "/sessions/{id}/close", description: "Close a session (RUNNING -> CLOSED)", roles: [Instructor, FrontDesk], code: 200, input: [], output: Session, side_effects: ["CASCADE B: instructor.sessions_completed += 1 then tier upgrade", "reconcile aborted flights' reflight credit provisional->final", "SCHEDULED/CHECKED_IN flights -> NO_SHOW; FLOWN flights minutes_charged finalized; REQUESTED coachings -> DELIVERED"] }
  - { method: POST, path: "/sessions/{id}/cancel", description: "Cancel a session", roles: [FrontDesk, Manager], code: 200, input: [], output: Session, side_effects: ["non-terminal flights -> CANCELLED with minute refunds"] }

  # ---- Flights ----
  - { method: POST, path: "/flights", description: "Schedule a flyer into a session slot (consumes booking minutes)", roles: [Flyer, FrontDesk], code: 201, input: [booking_id, session_id, member_id, scheduled_minutes], output: Flight, side_effects: ["consume minutes (calc booking_minutes); if booking hits 0 -> EXHAUSTED", "take seat (calc session_seats)", "status=SCHEDULED"] }
  - { method: GET, path: "/flights/{id}", description: "Get a flight", roles: [Flyer, FrontDesk, Manager, Instructor], code: 200, input: [], output: Flight, side_effects: [] }
  - { method: GET, path: "/flights", description: "List flights (reverse-reachability for Flight.booking_id, session_id, member_id)", roles: [Flyer, FrontDesk, Manager, Instructor], code: 200, input: ["booking_id?", "session_id?", "member_id?", "status?", "limit?", "offset?"], output: "Flight[]", side_effects: [] }
  - { method: POST, path: "/flights/{id}/check-in", description: "Check a flyer in (waiver + weight gates)", roles: [Instructor, FrontDesk], code: 200, input: [], output: Flight, side_effects: ["status=CHECKED_IN"] }
  - { method: POST, path: "/flights/{id}/complete", description: "Mark a flight flown", roles: [Instructor], code: 200, input: [], output: Flight, side_effects: ["status=FLOWN; minutes_charged := scheduled_minutes"] }
  - { method: POST, path: "/flights/{id}/abort", description: "Abort a flight mid-session (refund + reflight credit)", roles: [Instructor], code: 200, input: [flown_minutes], output: Flight, side_effects: ["CASCADE A: refund minutes -> booking status -> member counter", "grant provisional reflight credit"] }
  - { method: POST, path: "/flights/{id}/no-show", description: "Mark a flyer no-show (forfeit minutes)", roles: [FrontDesk, Instructor], code: 200, input: [], output: Flight, side_effects: ["status=NO_SHOW; seat freed; NO refund"] }
  - { method: POST, path: "/flights/{id}/cancel", description: "Cancel a scheduled flight (refund minutes)", roles: [FrontDesk, Flyer], code: 200, input: [], output: Flight, side_effects: ["status=CANCELLED; refund minutes; seat freed"] }
  - { method: POST, path: "/flights/{id}/video", description: "Purchase the video add-on for a flight", roles: [FrontDesk, Flyer], code: 200, input: [], output: Flight, side_effects: ["video_addon_purchased=true; calc addon_statement -> video_charge_cents, member.outstanding_addon_cents"] }

  # ---- Coaching ----
  - { method: POST, path: "/coaching-bookings", description: "Add coaching to a flight", roles: [FrontDesk, Flyer], code: 201, input: [flight_id, instructor_id, minutes], output: CoachingBooking, side_effects: ["status=REQUESTED; calc addon_statement -> charge_cents, member.outstanding_addon_cents"] }
  - { method: GET, path: "/coaching-bookings/{id}", description: "Get a coaching booking", roles: [Flyer, FrontDesk, Manager, Instructor], code: 200, input: [], output: CoachingBooking, side_effects: [] }
  - { method: GET, path: "/coaching-bookings", description: "List coaching bookings (reverse-reachability for CoachingBooking.flight_id, instructor_id)", roles: [Flyer, FrontDesk, Manager, Instructor], code: 200, input: ["flight_id?", "instructor_id?", "status?", "limit?", "offset?"], output: "CoachingBooking[]", side_effects: [] }

  # ---- Test-driving clock ----
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock. Server startup default is 2026-05-01T00:00:00Z; before any set call the clock reads exactly this default (never real wall-clock).", roles: [Manager, FrontDesk], code: 200, input: [to_iso8601], output: { current_utc: datetime }, side_effects: ["re-evaluates waiver expiry on next read"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unrecognized X-User-Role / X-User-ID" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Authenticated role not permitted for this operation" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body, missing required field, or invalid enum/number" }
  - { id: ERR_TUNNEL_NOT_FOUND, http: 404, condition: "tunnel_id does not resolve" }
  - { id: ERR_INSTRUCTOR_NOT_FOUND, http: 404, condition: "instructor_id does not resolve" }
  - { id: ERR_MEMBER_NOT_FOUND, http: 404, condition: "member_id does not resolve" }
  - { id: ERR_MEMBERSHIP_NOT_FOUND, http: 404, condition: "membership id does not resolve" }
  - { id: ERR_PACKAGE_NOT_FOUND, http: 404, condition: "package_id does not resolve" }
  - { id: ERR_BOOKING_NOT_FOUND, http: 404, condition: "booking_id does not resolve" }
  - { id: ERR_SESSION_NOT_FOUND, http: 404, condition: "session_id does not resolve" }
  - { id: ERR_FLIGHT_NOT_FOUND, http: 404, condition: "flight_id does not resolve" }
  - { id: ERR_WAIVER_NOT_FOUND, http: 404, condition: "waiver id does not resolve" }
  - { id: ERR_COACHING_NOT_FOUND, http: 404, condition: "coaching-booking id does not resolve" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested transition (Session op/staffing, Flight status, Booking status)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_session_version does not match current Session.version on instructor assignment" }
  - { id: ERR_TUNNEL_NOT_OPERATIONAL, http: 409, condition: "Session start attempted while its Tunnel.status == MAINTENANCE" }
  - { id: ERR_SESSION_NOT_STAFFED, http: 409, condition: "Flight create or session start while Session.staffing_status == UNSTAFFED" }
  - { id: ERR_EXPERIENCE_NOT_ELIGIBLE, http: 409, condition: "Package requires RETURNING but member.experience_status == FIRST_TIME" }
  - { id: ERR_WAIVER_INVALID, http: 422, condition: "Check-in with no SIGNED waiver, or waiver expired at current clock" }
  - { id: ERR_WEIGHT_LIMIT_EXCEEDED, http: 422, condition: "Check-in where member.weight_kg > tunnel.max_weight_kg (strictly greater)" }
  - { id: ERR_INVALID_SESSION_WINDOW, http: 422, condition: "end_utc <= start_utc or duration < MIN_SESSION_MINUTES" }
  - { id: ERR_SESSION_TIME_CONFLICT, http: 409, condition: "New session overlaps or violates turnaround buffer with another session on the same tunnel" }
  - { id: ERR_INSTRUCTOR_TIME_CONFLICT, http: 409, condition: "Instructor already assigned to an overlapping session (adjacency allowed)" }
  - { id: ERR_SESSION_FULL, http: 422, condition: "Session seats_available == 0 when scheduling a new flight" }
  - { id: ERR_INVALID_PARTY_SIZE, http: 422, condition: "Booking party_size < 1" }
  - { id: ERR_INSUFFICIENT_MINUTES, http: 422, condition: "Booking.minutes_remaining < scheduled_minutes for the new flight" }
  - { id: ERR_BOOKING_HAS_FLOWN_FLIGHT, http: 409, condition: "Booking cancel blocked because a flight on it is FLOWN" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Flyer
    description: "A customer/flyer. Registers, signs waivers, books, and manages their own flights."
    identity: "entity_backed:Member"
    exclusive_operations: []
    shared_operations:
      - "POST /members (self-register)"
      - "POST /waivers"
      - "POST /bookings"
      - "POST /bookings/{id}/cancel"
      - "POST /flights"
      - "POST /flights/{id}/cancel"
      - "POST /flights/{id}/video"
      - "POST /coaching-bookings"
      - "GET own member/booking/flight/session/coaching resources"

  - name: Instructor
    description: "Runs sessions: starts/closes, checks flyers in, completes or aborts flights."
    identity: "entity_backed:Instructor"
    exclusive_operations:
      - "POST /flights/{id}/complete"
      - "POST /flights/{id}/abort"
    shared_operations:
      - "POST /sessions/{id}/start"
      - "POST /sessions/{id}/close"
      - "POST /flights/{id}/check-in"
      - "POST /flights/{id}/no-show"
      - "GET sessions/flights/coaching"

  - name: FrontDesk
    description: "Front-of-house operator: walk-in bookings, session scheduling/staffing, add-ons, check-in."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /members, POST /waivers, POST /memberships, POST /memberships/{id}/cancel"
      - "POST /bookings, POST /bookings/{id}/cancel"
      - "POST /sessions, POST /sessions/{id}/assign-instructor, POST /sessions/{id}/start, POST /sessions/{id}/close, POST /sessions/{id}/cancel"
      - "POST /flights, POST /flights/{id}/check-in, POST /flights/{id}/no-show, POST /flights/{id}/cancel, POST /flights/{id}/video"
      - "POST /coaching-bookings"
      - "POST /_clock/set_current_utc"

  - name: Manager
    description: "Admin: catalog (tunnels, instructors, packages), tunnel maintenance, memberships, clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /tunnels"
      - "POST /tunnels/{id}/maintenance"
      - "POST /instructors"
      - "POST /packages"
    shared_operations:
      - "POST /memberships, POST /memberships/{id}/cancel"
      - "POST /sessions, POST /sessions/{id}/assign-instructor, POST /sessions/{id}/cancel"
      - "POST /_clock/set_current_utc"
      - "GET all resources"
