      - name: requests_missing_auth_headers_or_carrying_an_unknown_role_are_refused
        claim_type: role_permission_denial
        grounds:
          - validations.priority_1
          - validations.priority_2
          - errors.ERR_MISSING_AUTH_HEADERS
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: |
          401 and 403 are different failures and are ordered: a request with no
          X-User-Role, a request with no X-User-ID and a request naming a role
          outside the seven declared ones all return 401
          ERR_MISSING_AUTH_HEADERS, while a well-formed but wrong role returns 403
          ERR_UNAUTHORIZED. An implementation that maps an unknown role onto
          "not permitted" returns 403 where 401 is required.
        test_recipe:
          setup:
            - "no fixture is needed beyond one valid write to prove the endpoint works"
          setup_api_calls:
            - call: "POST /ports"
              payload: { unlocode: "SGSIN", name: "Singapore", country_code: "SG", port_accumulation_limit_amount: 8000000, storage_free_days: 30, war_risk_tier: "GREEN" }
              as: Underwriter
              captures: { port_id: $.data.id }
          trigger:
            - call: "POST /ports"
              payload: { unlocode: "NLRTM", name: "Rotterdam", country_code: "NL", port_accumulation_limit_amount: 8000000, storage_free_days: 30, war_risk_tier: "GREEN" }
              as: Underwriter
              note: "sent with the X-User-Role header omitted entirely"
              captures: { err_no_role: $.data.error_id }
            - call: "POST /ports"
              payload: { unlocode: "USNYC", name: "New York", country_code: "US", port_accumulation_limit_amount: 8000000, storage_free_days: 30, war_risk_tier: "GREEN" }
              as: Underwriter
              note: "sent with the X-User-ID header omitted entirely"
              captures: { err_no_user: $.data.error_id }
            - call: "POST /ports"
              payload: { unlocode: "AUSYD", name: "Sydney", country_code: "AU", port_accumulation_limit_amount: 8000000, storage_free_days: 30, war_risk_tier: "GREEN" }
              as: Underwriter
              note: "sent with X-User-Role: MarineBroker, a role outside the declared seven"
              captures: { err_unknown_role: $.data.error_id }
            - call: "POST /ports"
              payload: { unlocode: "JPTYO", name: "Tokyo", country_code: "JP", port_accumulation_limit_amount: 8000000, storage_free_days: 30, war_risk_tier: "GREEN" }
              as: ClaimsAdjuster
              as_user_id: "adjuster-1"
              captures: { err_wrong_role: $.data.error_id }
            - call: "GET /ports"
              payload: {}
              as: PlatformAdmin
              captures: { port_count: $.meta.total_count }
          assert:
            - "${err_no_role} == \"ERR_MISSING_AUTH_HEADERS\" with HTTP 401"
            - "${err_no_user} == \"ERR_MISSING_AUTH_HEADERS\" with HTTP 401 — the id matters as much as the role because ownership and segregation are keyed on it"
            - "${err_unknown_role} == \"ERR_MISSING_AUTH_HEADERS\" with HTTP 401, not 403 — an unrecognised role is an authentication failure"
            - "${err_wrong_role} == \"ERR_UNAUTHORIZED\" with HTTP 403 — a declared role that is simply not on the endpoint's list"
            - "${port_count} == 1 — none of the four refused requests created a port"

      - name: an_assured_cannot_act_on_another_policys_certificate
        claim_type: peer_roles
        grounds:
          - validations.priority_6_ownership
          - errors.ERR_OWNERSHIP_MISMATCH
          - roles.Assured.identity
