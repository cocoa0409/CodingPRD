              captures: { inv_id: $.data.id }
          assert:
            - "InterimReport.${rep_id}.status == ACCEPTED (accepted from LATE)"
            - "InstitutionSystem.fee_credit_cents == -25000 (LATE_REPORT_PENALTY_CENTS debited)"
            - "Invoice.${inv_id}.amount_cents == 645000 (base 500000 + 1*120000 + 25000 negative-credit reversal)"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_temporal_on_survey_response
        grounds:
          - validations[priority=4]
          - validations[priority=6]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_TEMPORAL_WINDOW_VIOLATION]
        distinguishing_aspect: |
          state (priority 4) vs business_temporal (priority 6): a survey response
          submitted to a window that is SCHEDULED (wrong state) AND whose
          opens_at is in the future (temporal violation) MUST return
          ERR_INVALID_STATE, not ERR_TEMPORAL_WINDOW_VIOLATION.
        test_recipe:
          setup:
            - "Term in SELF_STUDY; survey window SCHEDULED with opens_at 2026-12-01 (future)"
            - "Clock at 2026-08-01 (before opens_at)"
          setup_api_calls:
            - call: "POST /accreditation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccreditationOfficer
            - call: "POST /accreditation/standards"
              payload: { code: "L1", title: "Leadership 1", domain: "LEADERSHIP", weight_pct: 100, evidence_min_items: 0 }
              as: AccreditationOfficer
              captures: { std_l1: $.data.id }
            - call: "POST /accreditation/systems"
              payload: { name: "Priority County", system_type: "DISTRICT" }
              as: AccreditationOfficer
              captures: { sys_id: $.data.id }
            - call: "POST /accreditation/systems/${sys_id}/campuses"
              payload: { name: "North", enrollment: 500 }
              as: AccreditationOfficer
              captures: { campus_id: $.data.id }
            - call: "POST /accreditation/systems/${sys_id}/terms"
              payload: { term_start: "2026-09-01T00:00:00Z", term_length_years: 5 }
              as: AccreditationOfficer
              captures: { term_id: $.data.id, term_v: $.data.version }
            - call: "POST /accreditation/ratings"
              payload: { term_id: "${term_id}", campus_id: "${campus_id}", standard_id: "${std_l1}", rating: 3, expected_term_version: "${term_v}" }
              as: SchoolLeader
            - call: "POST /accreditation/terms/${term_id}/advance"
              payload: {}
              as: AccreditationOfficer
            - call: "POST /accreditation/survey-instruments"
              payload: { stakeholder_group: "STAFF", title: "Staff Survey", min_participation_pct: 50 }
              as: AccreditationOfficer
              captures: { inst_id: $.data.id }
            - call: "POST /accreditation/terms/${term_id}/survey-windows"
              payload: { campus_id: "${campus_id}", instrument_id: "${inst_id}", opens_at: "2026-12-01T00:00:00Z", closes_at: "2027-01-01T00:00:00Z", eligible_count: 100 }
              as: AccreditationOfficer
              captures: { w_id: $.data.id }
          trigger:
            - call: "POST /accreditation/survey-windows/${w_id}/responses"
              payload: { respondent_token: "tok-priority-1" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (state priority 4 beats business_temporal priority 6)"
            - "HTTP status == 409"

      - name: temporal_vs_referential_on_visit_confirm
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_TEMPORAL_WINDOW_VIOLATION]
          - errors[ERR_REFERENTIAL_INTEGRITY]
        distinguishing_aspect: |
          business_temporal (priority 6) vs business_referential (priority 7):
          confirming a visit whose dates overlap another CONFIRMED visit on the
          same campus (temporal violation) AND whose lead reviewer is already
          ON_ASSIGNMENT from a different visit (referential violation) MUST
          return ERR_TEMPORAL_WINDOW_VIOLATION. Different category pair from
          state_vs_business_temporal_on_survey_response.
