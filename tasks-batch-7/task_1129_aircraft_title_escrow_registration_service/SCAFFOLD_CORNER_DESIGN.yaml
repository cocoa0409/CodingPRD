            - { call: "GET /api/liens", payload: { escrow_file_id: "${f}" }, as: EscrowOfficer, captures: { l1: "$.data[0].id" } }
            - { call: "POST /api/liens/${l1}/releases", payload: {}, as: EscrowOfficer, captures: { r1: $.data.id } }
            - { call: "POST /api/releases/${r1}/quote", payload: { payoff_basis: "PER_DIEM", quoted_payoff_cents: 500000, per_diem_cents: 5000, good_through_date: "2026-06-30" }, as: LenderRep, as_user_id: "${ln}" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-30T23:59:59Z" }, as: EscrowManager }
            - { call: "POST /api/releases/${r1}/receive-release", payload: {}, as: LenderRep, as_user_id: "${ln}" }
