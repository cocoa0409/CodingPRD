            - "${e_venue} == ERR_VENUE_NOT_FOUND and HTTP 404"
            - "${e_section} == ERR_SECTION_NOT_FOUND and HTTP 404"
            - "${e_concert} == ERR_CONCERT_NOT_FOUND and HTTP 404"
            - "${e_contract} == ERR_CONTRACT_NOT_FOUND and HTTP 404"
            - "${e_musician} == ERR_MUSICIAN_NOT_FOUND and HTTP 404"
            - "every response body carries response_type == error and a non-empty message"

