              payload: { borrower_id: "${b_id}", requested_principal_cents: 1200000, term_months: 12, plaid_avg_monthly_revenue_cents: 3000000, plaid_monthly_debt_payment_cents: 1000000, plaid_nsf_count_90d: 0, plaid_account_age_months: 48 }
              as: Borrower
              as_user_id: "${b_id}"
              captures: { app_id: $.data.id }
            - call: "POST /loan-applications/${app_id}/score"
              payload: {}
              as: Underwriter
              as_user_id: "uw_scorer"
            - call: "POST /loan-applications/${app_id}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw_approver"
            - call: "GET /loans?application_id=${app_id}"
              payload: {}
              as: PlatformAdmin
              captures: { l_id: $.data.0.id, l_v0: $.data.0.version }
            - call: "POST /investors"
              payload: { display_name: "Inv Z", max_single_loan_pct: 1 }
              as: PlatformAdmin
              captures: { invz_id: $.data.id }
            - call: "POST /investors/${invz_id}/deposit"
              payload: { amount_cents: 5000000 }
              as: PlatformAdmin
            - call: "POST /investments"
              payload: { investor_id: "${invz_id}", loan_id: "${l_id}", amount_cents: 1000000, expected_loan_version: "${l_v0}" }
              as: Investor
              as_user_id: "${invz_id}"
            - call: "POST /investors"
              payload: { display_name: "Inv W", max_single_loan_pct: 0.25 }
              as: PlatformAdmin
              captures: { invw_id: $.data.id }
            - call: "POST /investors/${invw_id}/deposit"
              payload: { amount_cents: 1000000 }
              as: PlatformAdmin
            - call: "GET /loans/${l_id}"
              payload: {}
              as: PlatformAdmin
              captures: { l_v1: $.data.version }
          trigger:
            - call: "POST /investments"
              payload: { investor_id: "${invw_id}", loan_id: "${l_id}", amount_cents: 300000, expected_loan_version: "${l_v1}" }
              as: Investor
              as_user_id: "${invw_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "response data.error_id == ERR_FUNDING_EXCEEDED"

  # =================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: grade_threshold_exact_70_is_grade_b_inclusive
        grounds:
          - calculations.score_borrower
          - entities.LoanApplication.fields.risk_grade
        distinguishing_aspect: >
          Numeric threshold crossing on POST /loan-applications/{id}/score: a score
          of exactly 70.00 maps to grade B (>= inclusive), while 69.83 maps to C —
          the >= boundary is exercised on the credit_score metric.
        test_recipe:
          setup:
            - "Application A70 with rev=2,000,000 debt=2,000,000 nsf=0 age=36 (score exactly 70.00)."
          setup_api_calls:
            - call: "POST /borrowers"
              payload: { business_name: "Boundary70", ein: "66-0000001", state_code: "OR" }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
            - call: "POST /loan-applications"
              payload: { borrower_id: "${b_id}", requested_principal_cents: 1200000, term_months: 12, plaid_avg_monthly_revenue_cents: 2000000, plaid_monthly_debt_payment_cents: 2000000, plaid_nsf_count_90d: 0, plaid_account_age_months: 36 }
              as: Borrower
              as_user_id: "${b_id}"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /loan-applications/${app_id}/score"
              payload: {}
              as: Underwriter
              as_user_id: "uw_scorer"
          assert:
            - "LoanApplication.${app_id}.credit_score == 70.0"
            - "LoanApplication.${app_id}.risk_grade == B"
            - "LoanApplication.${app_id}.offered_apr == 0.0899"

      - name: diversification_cap_exact_equality_allowed_inclusive
        grounds:
          - validations[priority=12]
          - entities.Investor.fields.capital_base_cents
          - entities.Investor.fields.max_single_loan_pct
        distinguishing_aspect: >
          A different metric (loan exposure vs capital_base) on a different endpoint
          (POST /investments): exposure exactly equal to max_single_loan_pct*capital_base
          (400000 == 0.25*1,600,000) is ALLOWED (<= inclusive), so the commit succeeds.
        test_recipe:
          setup:
            - "Loan L principal 1,200,000 in FUNDING; investor Y capital_base 1,600,000, cap 0.25, commits exactly 400000 → exposure 400000 == 0.25*1,600,000."
          setup_api_calls:
            - call: "POST /borrowers"
              payload: { business_name: "DivBoundary", ein: "66-0000002", state_code: "OR" }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
            - call: "POST /loan-applications"
              payload: { borrower_id: "${b_id}", requested_principal_cents: 1200000, term_months: 12, plaid_avg_monthly_revenue_cents: 3000000, plaid_monthly_debt_payment_cents: 1000000, plaid_nsf_count_90d: 0, plaid_account_age_months: 48 }
              as: Borrower
              as_user_id: "${b_id}"
              captures: { app_id: $.data.id }
            - call: "POST /loan-applications/${app_id}/score"
              payload: {}
              as: Underwriter
              as_user_id: "uw_scorer"
            - call: "POST /loan-applications/${app_id}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw_approver"
            - call: "GET /loans?application_id=${app_id}"
              payload: {}
              as: PlatformAdmin
              captures: { l_id: $.data.0.id, l_v0: $.data.0.version }
            - call: "POST /investors"
              payload: { display_name: "Inv Y", max_single_loan_pct: 0.25 }
              as: PlatformAdmin
              captures: { invy_id: $.data.id }
            - call: "POST /investors/${invy_id}/deposit"
              payload: { amount_cents: 1600000 }
              as: PlatformAdmin
          trigger:
            - call: "POST /investments"
              payload: { investor_id: "${invy_id}", loan_id: "${l_id}", amount_cents: 400000, expected_loan_version: "${l_v0}" }
              as: Investor
              as_user_id: "${invy_id}"
              captures: { inv_id: $.data.id }
          assert:
            - "response status == 201"
            - "Investment.${inv_id}.status == COMMITTED and Investment.${inv_id}.amount_cents == 400000"

  # =================================================================
