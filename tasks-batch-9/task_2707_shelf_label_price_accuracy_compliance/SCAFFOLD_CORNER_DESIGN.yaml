              payload: { store_id: "${store_a}", price_change_line_id: "${line_1}", aisle_id: "${ai_a1}", assigned_associate_id: "${la1}", scheduled_start_at: "2026-08-02T08:00:00Z", scheduled_end_at: "2026-08-02T10:00:00Z", expected_price_change_file_version: "${ver_1}" }
              as: StoreManager
              as_user_id: "${sm1}"
              captures: { lt_1: $.data.id, due_1: $.data.due_at, overdue_1: $.data.overdue, print_0: $.data.print_status, place_0: $.data.placement_status }
            - call: "POST /price-integrity/label-tasks/${lt_1}/print"
              as: LabelAssociate
              as_user_id: "${la1}"
              captures: { print_1: $.data.print_status }
            - call: "POST /price-integrity/label-tasks/${lt_1}/place"
              payload: { observed_shelf_price_cents: 448 }
              as: LabelAssociate
              as_user_id: "${la1}"
              captures: { place_1: $.data.placement_status, placed_by_1: $.data.placed_by_associate_id, placed_at_1: $.data.placed_at }
            - call: "POST /price-integrity/label-tasks/${lt_1}/verify-placement"
              payload: { outcome: "VERIFIED" }
              as: PriceAuditor
              as_user_id: "${pa1}"
              captures: { place_2: $.data.placement_status, verified_by_2: $.data.verified_by_associate_id, verified_at_2: $.data.verified_at, rej_2: $.data.rejection_count }
            - call: "GET /price-integrity/price-change-lines/${line_1}"
              as: PricingAdmin
              captures: { st_l2: $.data.line_status, up_2: $.data.unit_price_display_cents }
            - call: "GET /price-integrity/price-change-files/${file_1}"
              as: PricingAdmin
              captures: { st_f2: $.data.status, vlc_2: $.data.verified_line_count, ver_2: $.data.version }
            - call: "GET /price-integrity/stores/${store_a}"
              as: PricingAdmin
              captures: { exec_2: $.data.executed_file_count, backlog_2: $.data.label_backlog_count, posture_2: $.data.compliance_posture, open_f_2: $.data.open_finding_count }
            - call: "GET /price-integrity/associates/${la1}"
              as: StoreManager
              as_user_id: "${sm1}"
              captures: { score_la1: $.data.accountability_score, count_la1: $.data.issued_action_count, tr_la1_b: $.data.training_status }
          assert:
            - "${rule_0} == PER_UNIT_MEASURE_CANONICAL and ${dp_0} == 2 (declared defaults), ${posture_0} == OPEN, and a score of exactly 80 certifies la1: ${tr_la1} == CERTIFIED with ${exp_la1} == 2027-08-01T00:00:00Z"
            - "The line is created with ${st_l0} == PENDING and a resolvable basis: ${up_1} == 224 == ROUND_HALF_UP(448 / 2, 0), ${basis_q_1} == 2 and ${basis_u_1} == LB — so the unit-price precondition on distribute is satisfied rather than violated"
            - "${st_f0} == DRAFT then ${st_f1} == DISTRIBUTED with ${ver_1} == ${ver_0} + 1, ${dist_at} == 2026-08-01T00:00:00Z and ${lc_1} == 1"
            - "The task is accepted on a strictly ordered window with ${due_1} == 2026-08-05T00:00:00Z (effective_date + 48h) and ${overdue_1} == false at clock 2026-08-01"
            - "${print_0} == NOT_PRINTED and ${place_0} == UNPLACED at creation, then ${print_1} == PRINTED and ${place_1} == PLACED with ${placed_by_1} == ${la1} and ${placed_at_1} == 2026-08-01T00:00:00Z"
            - "Verification by a different associate inside the 48-hour grace succeeds: ${place_2} == VERIFIED, ${verified_by_2} == ${pa1} != ${placed_by_1}, ${verified_at_2} == 2026-08-01T00:00:00Z and ${rej_2} == 0"
            - "The cascade completes: ${st_l2} == VERIFIED with ${up_2} == 224 unchanged by the re-run on distribute, ${st_f2} == EXECUTED with ${vlc_2} == 1, and ${ver_2} > ${ver_1}"
            - "${exec_2} == 1, ${backlog_2} == 0, ${open_f_2} == 0 and ${posture_2} == OPEN: no counter was tripped anywhere"
            - "${score_la1} == 100.00 with ${count_la1} == 0 and ${tr_la1_b} == CERTIFIED — a clean cycle issues no accountability action, so nothing in the nine calls returned 4XX"

  # ==========================================================================
  # Table 5 — Endpoints
  # ==========================================================================
  - section: Endpoints
    instances:
      - name: corner_patch_jurisdiction_is_a_partial_update_of_the_amendable_tunables_only
        claim_type: standard_crud
        grounds:
          - endpoints.PATCH_/price-integrity/jurisdictions/{id}
          - entities.Jurisdiction
        distinguishing_aspect: "PATCH is the only update endpoint in the surface and its input list is a strict subset of the create input list: code, name and unit_price_required are absent, so a partial PATCH must leave every unnamed field byte-identical, bump version exactly once, and still return the whole entity."
        test_recipe:
          setup:
            - "One jurisdiction created with two non-default tunables so the PATCH can be seen to touch only what it names."
          setup_api_calls:
            - call: "POST /price-integrity/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PricingAdmin
            - call: "POST /price-integrity/jurisdictions"
              payload: { code: "US-CA", name: "California", unit_price_required: true, unit_price_decimal_places: 3, refund_cap_cents: 5000, grace_period_hours: 48 }
              as: PricingAdmin
              captures: { jur_a: $.data.id, ver_0: $.data.version, thr_0: $.data.scanner_error_rate_threshold_pct, pol_0: $.data.overcharge_refund_policy, dp_0: $.data.unit_price_decimal_places }
          trigger:
            - call: "PATCH /price-integrity/jurisdictions/${jur_a}"
              payload: { scanner_error_rate_threshold_pct: 3.5, refund_cap_cents: 2500 }
              as: PricingAdmin
              captures: { ver_1: $.data.version, thr_1: $.data.scanner_error_rate_threshold_pct, cap_1: $.data.refund_cap_cents, code_1: $.data.code, name_1: $.data.name, req_1: $.data.unit_price_required, dp_1: $.data.unit_price_decimal_places, pol_1: $.data.overcharge_refund_policy, grace_1: $.data.grace_period_hours }
            - call: "GET /price-integrity/jurisdictions/${jur_a}"
              as: ComplianceOfficer
              captures: { ver_2: $.data.version, thr_2: $.data.scanner_error_rate_threshold_pct, cap_2: $.data.refund_cap_cents }
            - call: "GET /price-integrity/jurisdictions"
              payload: { code: "US-CA" }
              as: PricingAdmin
              captures: { list_total: $.meta.total_count, list_id: "$.data[0].id" }
          assert:
            - "${thr_0} == 2.0, ${pol_0} == REFUND_DIFFERENCE_ONLY and ${dp_0} == 3 on create (two declared defaults plus one explicit override)"
            - "${ver_1} == ${ver_0} + 1 exactly once for the two-field PATCH"
            - "${thr_1} == 3.5 and ${cap_1} == 2500 are the only changed values"
            - "${code_1} == US-CA, ${name_1} == California, ${req_1} == true, ${dp_1} == 3, ${pol_1} == REFUND_DIFFERENCE_ONLY and ${grace_1} == 48 — unnamed fields are untouched and the three non-amendable fields are not even accepted as input"
            - "${ver_2} == ${ver_1}, ${thr_2} == 3.5, ${cap_2} == 2500: the read-back is identical, and ${list_total} == 1 with ${list_id} == ${jur_a}"

      - name: corner_place_action_enforces_the_print_axis_and_stamps_the_placer
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_/price-integrity/label-tasks/{id}/place
          - state_machines.LabelTask.placement_axis
          - errors.ERR_LABEL_NOT_PRINTED
          - calculations.store_label_backlog_count
        distinguishing_aspect: "The placement axis is guarded by the other axis, not by its own state: an UNPLACED task whose print axis is still NOT_PRINTED refuses with ERR_LABEL_NOT_PRINTED, and once placement succeeds the placer is taken from X-User-ID (never from assigned_associate_id) while the task leaves the store's backlog because the backlog counts only UNPLACED and REJECTED."
        test_recipe:
          setup:
            - "One jurisdiction; store_a with aisle A01, certified sm1 and la1; store_b with certified label associate lb1."
            - "A distributed one-line file with one label task at store_a."
          setup_api_calls:
            - call: "POST /price-integrity/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PricingAdmin
            - call: "POST /price-integrity/jurisdictions"
              payload: { code: "US-CA", name: "California", grace_period_hours: 48 }
              as: PricingAdmin
              captures: { jur_a: $.data.id }
            - call: "POST /price-integrity/stores"
              payload: { store_number: "S001", name: "Bay Street", jurisdiction_id: "${jur_a}" }
              as: PricingAdmin
              captures: { store_a: $.data.id }
            - call: "POST /price-integrity/stores"
              payload: { store_number: "S002", name: "Elm Plaza", jurisdiction_id: "${jur_a}" }
              as: PricingAdmin
              captures: { store_b: $.data.id }
            - call: "POST /price-integrity/stores/${store_a}/associates"
              payload: { employee_number: "E-SM1", full_name: "Sam Manager", role_code: "STORE_MANAGER" }
              as: PricingAdmin
              captures: { sm1: $.data.id }
            - call: "POST /price-integrity/associates/${sm1}/training-completions"
              payload: { module_code: "LABEL_101", score_pct: 95 }
              as: PricingAdmin
            - call: "POST /price-integrity/stores/${store_a}/associates"
              payload: { employee_number: "E-LA1", full_name: "Lee Label", role_code: "LABEL_ASSOCIATE" }
              as: PricingAdmin
              captures: { la1: $.data.id }
            - call: "POST /price-integrity/associates/${la1}/training-completions"
              payload: { module_code: "LABEL_101", score_pct: 95 }
              as: PricingAdmin
            - call: "POST /price-integrity/stores/${store_b}/associates"
              payload: { employee_number: "E-LB1", full_name: "Bo Label", role_code: "LABEL_ASSOCIATE" }
              as: PricingAdmin
              captures: { lb1: $.data.id }
            - call: "POST /price-integrity/associates/${lb1}/training-completions"
              payload: { module_code: "LABEL_101", score_pct: 95 }
              as: PricingAdmin
            - call: "POST /price-integrity/stores/${store_a}/aisles"
              payload: { aisle_code: "A01", category_code: "DAIRY", assigned_associate_id: "${la1}" }
              as: PricingAdmin
              captures: { ai_a1: $.data.id }
            - call: "POST /price-integrity/price-change-files"
              payload: { file_number: "PCF-1", jurisdiction_id: "${jur_a}", effective_date: "2026-08-03T00:00:00Z", scope_store_ids: ["${store_a}"] }
              as: PricingAdmin
              captures: { file_1: $.data.id }
            - call: "POST /price-integrity/price-change-files/${file_1}/lines"
              payload: { item_upc: "00000000014001", item_description: "Milk 1 GAL", category_code: "DAIRY", old_retail_cents: 499, new_retail_cents: 449, net_content_qty: 1, net_content_uom: "GAL" }
              as: PricingAdmin
              captures: { line_1: $.data.id }
            - call: "POST /price-integrity/price-change-files/${file_1}/distribute"
              as: PricingAdmin
              captures: { ver_1: $.data.version }
            - call: "POST /price-integrity/price-change-files/${file_1}/label-tasks"
              payload: { store_id: "${store_a}", price_change_line_id: "${line_1}", aisle_id: "${ai_a1}", assigned_associate_id: "${la1}", scheduled_start_at: "2026-08-02T08:00:00Z", scheduled_end_at: "2026-08-02T10:00:00Z", expected_price_change_file_version: "${ver_1}" }
              as: StoreManager
              as_user_id: "${sm1}"
              captures: { lt_1: $.data.id, print_0: $.data.print_status, place_0: $.data.placement_status, serial_0: $.data.printed_label_serial }
          trigger:
            - call: "POST /price-integrity/label-tasks/${lt_1}/place"
              payload: { observed_shelf_price_cents: 449 }
              as: LabelAssociate
              as_user_id: "${la1}"
              captures: { e_not_printed: $.data.error_id }
            - call: "GET /price-integrity/stores/${store_a}"
              as: PricingAdmin
              captures: { backlog_1: $.data.label_backlog_count, posture_1: $.data.compliance_posture }
            - call: "POST /price-integrity/label-tasks/${lt_1}/print"
              as: LabelAssociate
              as_user_id: "${la1}"
              captures: { print_1: $.data.print_status, serial_1: $.data.printed_label_serial, place_1: $.data.placement_status }
            - call: "GET /price-integrity/price-change-lines/${line_1}"
              as: PricingAdmin
              captures: { line_status_1: $.data.line_status }
            - call: "POST /price-integrity/label-tasks/${lt_1}/place"
              payload: { observed_shelf_price_cents: 449 }
              as: LabelAssociate
              as_user_id: "${lb1}"
              captures: { e_wrong_store: $.data.error_id }
            - call: "POST /price-integrity/label-tasks/${lt_1}/place"
              payload: { observed_shelf_price_cents: 449 }
              as: LabelAssociate
              as_user_id: "${la1}"
              captures: { place_2: $.data.placement_status, placed_by: $.data.placed_by_associate_id, placed_at: $.data.placed_at, observed: $.data.observed_shelf_price_cents, print_2: $.data.print_status }
            - call: "GET /price-integrity/stores/${store_a}"
              as: PricingAdmin
              captures: { backlog_2: $.data.label_backlog_count, posture_2: $.data.compliance_posture }
          assert:
            - "${print_0} == NOT_PRINTED, ${place_0} == UNPLACED and ${serial_0} == null on creation"
            - "Placing before printing: HTTP 409 with ${e_not_printed} == ERR_LABEL_NOT_PRINTED"
            - "${backlog_1} == 1 and ${posture_1} == OPEN (backlog 1 < RESTRICTED_BACKLOG_COUNT 5)"
            - "After print: ${print_1} == PRINTED, ${serial_1} starts with 'LBL-', ${place_1} == UNPLACED — the placement axis did not move, and ${line_status_1} == LABELED shows the print side effect reached the line"
            - "Placing as the store_b associate: HTTP 422 with ${e_wrong_store} == ERR_ASSOCIATE_STORE_MISMATCH"
            - "Placing as la1: HTTP 200 with ${place_2} == PLACED, ${placed_by} == ${la1}, ${placed_at} == 2026-08-01T00:00:00Z, ${observed} == 449 and ${print_2} == PRINTED (unchanged)"
            - "${backlog_2} == 0 and ${posture_2} == OPEN — PLACED is outside the backlog's {UNPLACED, REJECTED} filter"

      - name: corner_issue_findings_bulk_action_is_all_or_nothing
        claim_type: bulk_action
        grounds:
          - endpoints.POST_/price-integrity/regulatory-inspections/{id}/issue-findings
          - errors.ERR_FINDINGS_EMPTY
          - calculations.penalty_exposure
        distinguishing_aspect: "The findings array is validated as a unit before anything is written: one bad severity in a three-element array creates zero findings and leaves the inspection SCHEDULED, an empty array is its own error, and the accepted call computes one penalty figure over the whole batch (single FLOOR over the summed components) rather than per element."
        test_recipe:
          setup:
            - "Jurisdiction with default penalty_per_violation_cents 5000 and penalty_max_cents 2000000."
            - "One store with unassigned aisle A01 and certified pa1; evidence audit AU1 closed with a single MATCH line so its outcome is PASS and the aggravator is 0."
            - "One SCHEDULED inspection referencing AU1."
          setup_api_calls:
            - call: "POST /price-integrity/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PricingAdmin
            - call: "POST /price-integrity/jurisdictions"
              payload: { code: "US-CA", name: "California" }
              as: PricingAdmin
              captures: { jur_a: $.data.id, ppv: $.data.penalty_per_violation_cents, pmax: $.data.penalty_max_cents }
            - call: "POST /price-integrity/stores"
              payload: { store_number: "S001", name: "Bay Street", jurisdiction_id: "${jur_a}" }
              as: PricingAdmin
              captures: { store_a: $.data.id }
            - call: "POST /price-integrity/stores/${store_a}/associates"
              payload: { employee_number: "E-PA1", full_name: "Pat Auditor", role_code: "PRICE_AUDITOR" }
              as: PricingAdmin
              captures: { pa1: $.data.id }
            - call: "POST /price-integrity/associates/${pa1}/training-completions"
              payload: { module_code: "AUDIT_101", score_pct: 95 }
              as: PricingAdmin
            - call: "POST /price-integrity/stores/${store_a}/aisles"
              payload: { aisle_code: "A01", category_code: "DAIRY" }
              as: PricingAdmin
              captures: { ai_a1: $.data.id }
            - call: "POST /price-integrity/scanner-audits"
              payload: { store_id: "${store_a}", aisle_id: "${ai_a1}", auditor_associate_id: "${pa1}", audit_type: "REGULATORY", scan_window_start: "2026-08-01T08:00:00Z", scan_window_end: "2026-08-01T09:00:00Z" }
              as: PriceAuditor
              as_user_id: "${pa1}"
              captures: { au_1: $.data.id }
            - call: "POST /price-integrity/scanner-audits/${au_1}/scan-lines"
              payload: { item_upc: "00000000015001", shelf_price_cents: 100, register_price_cents: 100 }
              as: PriceAuditor
              as_user_id: "${pa1}"
            - call: "POST /price-integrity/scanner-audits/${au_1}/close"
              payload: { rate_variant: "GROSS_MISMATCH" }
              as: PriceAuditor
              as_user_id: "${pa1}"
              captures: { rate_1: $.data.error_rate_pct, out_1: $.data.outcome }
            - call: "POST /price-integrity/regulatory-inspections"
              payload: { store_id: "${store_a}", scanner_audit_id: "${au_1}", inspector_ref: "INS-2026-14", inspection_date: "2026-08-01T10:00:00Z" }
              as: ComplianceOfficer
              captures: { insp_1: $.data.id, insp_status_0: $.data.status, fc_0: $.data.finding_count, pen_0: $.data.penalty_exposure_cents }
          trigger:
            - call: "POST /price-integrity/regulatory-inspections/${insp_1}/issue-findings"
              payload: { findings: [{ finding_code: "SHELF_TAG_MISMATCH", severity: "MINOR", affected_item_count: 2, affected_aisle_code: "A01" }, { finding_code: "UNIT_PRICE_FORMAT", severity: "MAJOR", affected_item_count: 4, affected_aisle_code: "A01" }, { finding_code: "EXPIRED_SIGNAGE", severity: "SEVERE", affected_item_count: 1, affected_aisle_code: "A01" }] }
              as: ComplianceOfficer
              captures: { e_bad_enum: $.data.error_id }
            - call: "GET /price-integrity/regulatory-inspections/${insp_1}/findings"
              as: ComplianceOfficer
              captures: { findings_total_0: $.meta.total_count }
            - call: "GET /price-integrity/regulatory-inspections/${insp_1}"
              as: ComplianceOfficer
              captures: { insp_status_1: $.data.status, pen_1: $.data.penalty_exposure_cents }
            - call: "POST /price-integrity/regulatory-inspections/${insp_1}/issue-findings"
              payload: { findings: [] }
              as: ComplianceOfficer
              captures: { e_empty: $.data.error_id }
            - call: "POST /price-integrity/regulatory-inspections/${insp_1}/issue-findings"
              payload: { findings: [{ finding_code: "SHELF_TAG_MISMATCH", severity: "MINOR", affected_item_count: 2, affected_aisle_code: "A01" }, { finding_code: "UNIT_PRICE_FORMAT", severity: "MAJOR", affected_item_count: 4, affected_aisle_code: "A01" }] }
              as: ComplianceOfficer
              captures: { insp_status_2: $.data.status, fc_2: $.data.finding_count, pen_2: $.data.penalty_exposure_cents }
            - call: "GET /price-integrity/regulatory-inspections/${insp_1}/findings"
              payload: { status: "OPEN" }
              as: ComplianceOfficer
              captures: { findings_total_2: $.meta.total_count, comp_0: "$.data[0].penalty_component_cents", comp_1: "$.data[1].penalty_component_cents" }
            - call: "GET /price-integrity/stores/${store_a}"
              as: PricingAdmin
              captures: { open_findings: $.data.open_finding_count, posture_1: $.data.compliance_posture, failed_1: $.data.failed_audit_count_30d }
          assert:
            - "${ppv} == 5000, ${pmax} == 2000000, ${rate_1} == 0.00 with ${out_1} == PASS, and the inspection starts at ${insp_status_0} == SCHEDULED with ${fc_0} == 0 and ${pen_0} == 0"
            - "The three-element batch with severity 'SEVERE': HTTP 400 with ${e_bad_enum} == ERR_INVALID_REQUEST"
            - "${findings_total_0} == 0, ${insp_status_1} == SCHEDULED and ${pen_1} == 0 — the two valid elements were not written, so the batch is all-or-nothing"
            - "The empty array: HTTP 422 with ${e_empty} == ERR_FINDINGS_EMPTY"
            - "The two-element batch: HTTP 200 with ${insp_status_2} == FINDINGS_ISSUED, ${fc_2} == 2 and ${pen_2} == 70000 == min(FLOOR((1*5000*2 + 3*5000*4) * (100 + 0) / 100), 2000000) — tier 100 because n == 2 and no aggravator because the evidence audit PASSED"
            - "${findings_total_2} == 2 with ${comp_0} == 10000 and ${comp_1} == 60000, both status OPEN, reachable only through the findings sub-collection"
            - "${open_findings} == 2 with ${failed_1} == 0, so ${posture_1} == RESTRICTED (open >= 1 but < FROZEN_OPEN_FINDING_COUNT 3)"

      - name: corner_assign_associate_link_is_validated_in_both_directions_and_clearable
        claim_type: cross_reference_link
        grounds:
          - endpoints.POST_/price-integrity/aisles/{id}/assign-associate
