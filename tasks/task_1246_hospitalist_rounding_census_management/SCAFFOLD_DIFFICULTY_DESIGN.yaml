scaffold_difficulty_design:

  # ===================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # ===================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: wrvu_provisional_vs_final_diverge
        grounds:
          - calculations.productivity_wrvu_total
          - entities.ProductivityReport.fields.total_wrvu_provisional
          - entities.ProductivityReport.fields.total_wrvu_final
        distinguishing_aspect: |
          Same two encounters produce provisional 3.92 (per-line estimate
          rounding then sum) and final 3.77 (sum raw then one rounding) on
          ProductivityReport — a different entity domain (billing productivity)
          than the Patient-domain LOS variants of los_midnights_vs_hour_blocks_diverge.
        test_recipe:
          setup:
            - "Hospitalist H1; Patient P1 (INPATIENT, MEDIUM); two RECORDED encounters for H1/P1 on 2026-05-04: ADMISSION_HCP wrvu 2.654 and SUBSEQUENT_VISIT wrvu 1.115; report for period 2026-05-01..2026-05-31 generated (PROVISIONAL)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-04T12:00:00Z" }, as: GroupAdmin }
            - { call: "POST /hospitalists", payload: { full_name: "H One", specialty: "INTERNAL_MEDICINE", max_census_cap: 16 }, as: GroupAdmin, captures: { h1: $.data.id } }
            - { call: "POST /patients", payload: { mrn: "M001", acuity: "MEDIUM", admit_source: "DIRECT", stay_type: "INPATIENT", admitted_at: "2026-05-04T08:00:00Z" }, as: GroupAdmin, captures: { p1: $.data.id } }
            - { call: "POST /encounters", payload: { patient_id: "${p1}", encounter_type: "ADMISSION_HCP", occurred_on: "2026-05-04", wrvu_value: 2.654 }, as: Hospitalist, as_user_id: "${h1}", captures: { e1: $.data.id } }
            - { call: "POST /encounters", payload: { patient_id: "${p1}", encounter_type: "SUBSEQUENT_VISIT", occurred_on: "2026-05-04", wrvu_value: 1.115 }, as: Hospitalist, as_user_id: "${h1}", captures: { e2: $.data.id } }
            - { call: "POST /productivity-reports/generate", payload: { hospitalist_id: "${h1}", period_start: "2026-05-01", period_end: "2026-05-31" }, as: GroupAdmin, captures: { r1: $.data.id, prov_at_gen: $.data.total_wrvu_provisional } }
          trigger:
            - { call: "POST /productivity-reports/${r1}/finalize", payload: {}, as: GroupAdmin, captures: { fin_total: $.data.total_wrvu_final, fin_var: $.data.wrvu_variance } }
          assert:
            - "ProductivityReport.${r1}.total_wrvu_provisional == 3.92 (round(2.5*1.06,2)=2.65 + round(1.2*1.06,2)=1.27)"
            - "ProductivityReport.${r1}.total_wrvu_final == 3.77 (round(2.654+1.115,2))"
            - "ProductivityReport.${r1}.wrvu_variance == -0.15"
            - "ProductivityReport.${r1}.encounter_count == 2"
            - "ProductivityReport.${r1}.status == FINALIZED"

      - name: los_midnights_vs_hour_blocks_diverge
        grounds:
          - calculations.los_monitoring
          - entities.Patient.fields.los_midnights
          - entities.Patient.fields.los_blocks
        distinguishing_aspect: |
          For one identical admitted_at/now pair, midnight-census LOS is 1 while
          24-hour-block LOS is 0 — a Patient-domain divergence, distinct from the
          ProductivityReport-domain wRVU variants.
        test_recipe:
          setup:
            - "Patient P1 INPATIENT MEDIUM admitted_at 2026-05-01T23:00:00Z; logical clock at 2026-05-02T01:00:00Z (elapsed 2h, one midnight crossed)"
          setup_api_calls:
            - { call: "POST /patients", payload: { mrn: "M101", acuity: "MEDIUM", admit_source: "ED", stay_type: "INPATIENT", admitted_at: "2026-05-01T23:00:00Z" }, as: GroupAdmin, captures: { p1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T01:00:00Z" }, as: GroupAdmin }
          trigger:
            - { call: "POST /ops/monitor-run", payload: {}, as: GroupAdmin }
            - { call: "GET /patients/${p1}", as: GroupAdmin, captures: { mid: $.data.los_midnights, blk: $.data.los_blocks, flag: $.data.los_alert_flag } }
          assert:
            - "Patient.${p1}.los_midnights == 1"
            - "Patient.${p1}.los_blocks == 0"
            - "Patient.${p1}.los_alert_flag == false (threshold: 4 * 1.5 = 6 midnights, strictly greater)"
            - "los_midnights != los_blocks for identical inputs (variant divergence)"

  # ===================================================================
  # Rule 2 — combinatorial_formula (different modes a / b / c)
  # ===================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: distribution_score_clamped_continuity
        grounds:
          - calculations.admission_distribution_score
          - entities.Admission.fields.distribution_score
        distinguishing_aspect: |
          Mode (a): >= 3 inputs (capacity ratio, continuity indicator,
          night-load penalty) with non-linear min(1.0, ...) clamp — H_B's raw
          1.25 clamps to 1.0 and beats H_A's 0.75.
        test_recipe:
          setup:
            - "H_A cap 4 with ACTIVE DAY shift 07:00-19:00 and census 1; H_B cap 1 with ACTIVE DAY shift 06:00-18:00 and census 0; P1 previously assigned to H_B and discharged at 2026-05-01T09:00:00Z (CLOSED assignment within 30 days -> continuity for H_B); clock 2026-05-01T09:00:00Z"
          setup_api_calls:
            - { call: "POST /hospitalists", payload: { full_name: "H A", specialty: "INTERNAL_MEDICINE", max_census_cap: 4 }, as: GroupAdmin, captures: { h_a: $.data.id } }
            - { call: "POST /hospitalists", payload: { full_name: "H B", specialty: "FAMILY_MEDICINE", max_census_cap: 1 }, as: GroupAdmin, captures: { h_b: $.data.id } }
            - { call: "POST /shifts", payload: { hospitalist_id: "${h_a}", shift_type: "DAY", start_at: "2026-05-01T07:00:00Z", end_at: "2026-05-01T19:00:00Z" }, as: GroupAdmin, captures: { s_a: $.data.id } }
            - { call: "POST /shifts", payload: { hospitalist_id: "${h_b}", shift_type: "DAY", start_at: "2026-05-01T06:00:00Z", end_at: "2026-05-01T18:00:00Z" }, as: GroupAdmin, captures: { s_b: $.data.id } }
            - { call: "POST /shifts/${s_a}/activate", payload: {}, as: GroupAdmin }
            - { call: "POST /shifts/${s_b}/activate", payload: {}, as: GroupAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:00:00Z" }, as: GroupAdmin }
            - { call: "POST /patients", payload: { mrn: "M201", acuity: "MEDIUM", admit_source: "ED", stay_type: "INPATIENT", admitted_at: "2026-05-01T08:30:00Z" }, as: GroupAdmin, captures: { p1: $.data.id } }
            - { call: "POST /admissions", payload: { patient_id: "${p1}" }, as: GroupAdmin, captures: { a1: $.data.id, off1: $.data.offered_to_hospitalist_id } }
            # tie 1.0 vs 1.0 -> earlier shift start (H_B 06:00) wins
            - { call: "POST /admissions/${a1}/accept", payload: {}, as: Hospitalist, as_user_id: "${off1}", captures: { asg1: $.data.assignment_id } }
            # H_B census 1 == cap 1 -> distribution_eligible false
            - { call: "POST /patients", payload: { mrn: "M202", acuity: "LOW", admit_source: "DIRECT", stay_type: "INPATIENT", admitted_at: "2026-05-01T08:35:00Z" }, as: GroupAdmin, captures: { p2: $.data.id } }
            - { call: "POST /admissions", payload: { patient_id: "${p2}" }, as: GroupAdmin, captures: { a2: $.data.id, off2: $.data.offered_to_hospitalist_id } }
            # only H_A eligible -> offered H_A
            - { call: "POST /admissions/${a2}/accept", payload: {}, as: Hospitalist, as_user_id: "${off2}", captures: { asg2: $.data.assignment_id } }
            # discharge P1 from H_B -> CLOSED assignment seeds continuity for H_B
            - { call: "POST /patients/${p1}/discharge-orders", payload: { target_discharge_at: "2026-05-02T15:00:00Z" }, as: Hospitalist, as_user_id: "${h_b}", captures: { d1: $.data.id } }
            - { call: "POST /discharge-orders/${d1}/order", payload: {}, as: Hospitalist, as_user_id: "${h_b}" }
            - { call: "POST /discharge-orders/${d1}/execute", payload: {}, as: Hospitalist, as_user_id: "${h_b}" }
          trigger:
            - { call: "POST /admissions", payload: { patient_id: "${p1}" }, as: GroupAdmin, captures: { a3: $.data.id, off3: $.data.offered_to_hospitalist_id, score3: $.data.distribution_score } }
          assert:
            - "Admission.${a3}.status == OFFERED (readmission of DISCHARGED P1 flips admission_status back to ADMITTED)"
            - "Admission.${a3}.offered_to_hospitalist_id == ${h_b}"
            - "Admission.${a3}.distribution_score == 1.0 (min(1.0, (1-0)/1 + 0.25) clamps 1.25 -> 1.0; H_A scores (4-1)/4 = 0.75)"
            - "Hospitalist.${h_a} not selected despite positive score (0.75 < 1.0)"

      - name: wrvu_rounding_order_pinned
        grounds:
          - calculations.productivity_wrvu_total
          - entities.Encounter.fields.estimated_wrvu
        distinguishing_aspect: |
          Mode (b): nested rounding order pinned — provisional rounds each line
          (1.59 + 1.91 = 3.50) while final sums raw then rounds once
          (round(1.505+1.805,2) = 3.31); different rounding order yields
          different cents on identical inputs, distinct from mode (a).
        test_recipe:
          setup:
            - "H1; P1; encounters E3 CONSULT_NOTE wrvu 1.505 and E4 DISCHARGE_DAY wrvu 1.805 on 2026-05-04; report period 2026-05-01..2026-05-31"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-04T12:00:00Z" }, as: GroupAdmin }
            - { call: "POST /hospitalists", payload: { full_name: "H One", specialty: "ICU", max_census_cap: 16 }, as: GroupAdmin, captures: { h1: $.data.id } }
            - { call: "POST /patients", payload: { mrn: "M301", acuity: "HIGH", admit_source: "TRANSFER", stay_type: "INPATIENT", admitted_at: "2026-05-04T06:00:00Z" }, as: GroupAdmin, captures: { p1: $.data.id } }
            - { call: "POST /encounters", payload: { patient_id: "${p1}", encounter_type: "CONSULT_NOTE", occurred_on: "2026-05-04", wrvu_value: 1.505 }, as: Hospitalist, as_user_id: "${h1}", captures: { e3: $.data.id, est3: $.data.estimated_wrvu } }
            - { call: "POST /encounters", payload: { patient_id: "${p1}", encounter_type: "DISCHARGE_DAY", occurred_on: "2026-05-04", wrvu_value: 1.805 }, as: Hospitalist, as_user_id: "${h1}", captures: { e4: $.data.id, est4: $.data.estimated_wrvu } }
            - { call: "POST /productivity-reports/generate", payload: { hospitalist_id: "${h1}", period_start: "2026-05-01", period_end: "2026-05-31" }, as: GroupAdmin, captures: { r1: $.data.id, prov: $.data.total_wrvu_provisional } }
          trigger:
            - { call: "POST /productivity-reports/${r1}/finalize", payload: {}, as: GroupAdmin, captures: { fin: $.data.total_wrvu_final, var: $.data.wrvu_variance } }
          assert:
            - "Encounter.${e3}.estimated_wrvu == 1.59 (round(1.5*1.06,2) per-line)"
            - "Encounter.${e4}.estimated_wrvu == 1.91 (round(1.8*1.06,2) per-line)"
            - "ProductivityReport.${r1}.total_wrvu_provisional == 3.50 (per-line round then sum)"
            - "ProductivityReport.${r1}.total_wrvu_final == 3.31 (sum then single round)"
            - "ProductivityReport.${r1}.wrvu_variance == -0.19"

      - name: leveling_group_avg_from_current_only
        grounds:
          - calculations.census_leveling_projection
        distinguishing_aspect: |
          Mode (c): circular-looking dependency pinned by evaluation order —
          group_avg_census derives from CURRENT census only (step 2), never
          from projections, so with H1=2 current / H2=0 current + 1 OFFERED,
          group_avg == 1.0, not the 1.5 a projection-fed average would give;
          distinct from modes (a) and (b).
        test_recipe:
          setup:
            - "H1 ACTIVE shift 06:00-18:00 cap 16 with census 2 (P1, P2 accepted); H2 ACTIVE shift 07:00-19:00 cap 16 with census 0; P3 admission OFFERED to H2 (not accepted); clock 2026-05-01T09:00:00Z"
          setup_api_calls:
            - { call: "POST /hospitalists", payload: { full_name: "H One", specialty: "INTERNAL_MEDICINE", max_census_cap: 16 }, as: GroupAdmin, captures: { h1: $.data.id } }
            - { call: "POST /hospitalists", payload: { full_name: "H Two", specialty: "FAMILY_MEDICINE", max_census_cap: 16 }, as: GroupAdmin, captures: { h2: $.data.id } }
            - { call: "POST /shifts", payload: { hospitalist_id: "${h1}", shift_type: "DAY", start_at: "2026-05-01T06:00:00Z", end_at: "2026-05-01T18:00:00Z" }, as: GroupAdmin, captures: { s1: $.data.id } }
            - { call: "POST /shifts", payload: { hospitalist_id: "${h2}", shift_type: "DAY", start_at: "2026-05-01T07:00:00Z", end_at: "2026-05-01T19:00:00Z" }, as: GroupAdmin, captures: { s2: $.data.id } }
            - { call: "POST /shifts/${s1}/activate", payload: {}, as: GroupAdmin }
            - { call: "POST /shifts/${s2}/activate", payload: {}, as: GroupAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:00:00Z" }, as: GroupAdmin }
            - { call: "POST /patients", payload: { mrn: "M401", acuity: "MEDIUM", admit_source: "ED", stay_type: "INPATIENT", admitted_at: "2026-05-01T08:00:00Z" }, as: GroupAdmin, captures: { p1: $.data.id } }
            - { call: "POST /admissions", payload: { patient_id: "${p1}" }, as: GroupAdmin, captures: { a1: $.data.id, off1: $.data.offered_to_hospitalist_id } }
            - { call: "POST /admissions/${a1}/accept", payload: {}, as: Hospitalist, as_user_id: "${off1}" }
            - { call: "POST /patients", payload: { mrn: "M402", acuity: "LOW", admit_source: "DIRECT", stay_type: "INPATIENT", admitted_at: "2026-05-01T08:10:00Z" }, as: GroupAdmin, captures: { p2: $.data.id } }
            - { call: "POST /admissions", payload: { patient_id: "${p2}" }, as: GroupAdmin, captures: { a2: $.data.id, off2: $.data.offered_to_hospitalist_id } }
            - { call: "POST /admissions/${a2}/accept", payload: {}, as: Hospitalist, as_user_id: "${off2}" }
            - { call: "POST /patients", payload: { mrn: "M403", acuity: "HIGH", admit_source: "ED", stay_type: "INPATIENT", admitted_at: "2026-05-01T08:20:00Z" }, as: GroupAdmin, captures: { p3: $.data.id } }
            - { call: "POST /admissions", payload: { patient_id: "${p3}" }, as: GroupAdmin, captures: { a3: $.data.id, off3: $.data.offered_to_hospitalist_id } }
            # tie-break audit: both a1/a2 go to H1 (earlier shift start at equal score 1.0);
            # a3: H1 scores (16-2)/16 = 0.875, H2 scores 1.0 -> OFFERED to H2, left un-accepted
          trigger:
            - { call: "GET /reports/census-leveling", as: GroupAdmin, captures: { avg: $.data.group_avg_census } }
          assert:
            - "Admission.${a1}.offered_to_hospitalist_id == ${h1} and Admission.${a2}.offered_to_hospitalist_id == ${h1} (tie -> earlier shift start_at)"
            - "Admission.${a3}.offered_to_hospitalist_id == ${h2}"
            - "response.group_avg_census == 1.0 ((2+0)/2 from CURRENT census; a projection-fed average would be 1.5)"
            - "rows[H1].current_census == 2 and rows[H1].projected_census == 2"
            - "rows[H2].current_census == 0 and rows[H2].projected_census == 1 (one OFFERED admission added)"
            - "rows[H2].deviation_forward == 0.0 and rows[H2].deviation_chronological == -1.0"
            - "response.leveling_needed == true (max abs deviation 1.0 > 0.15)"

  # ===================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ===================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: assignment_transfer_cycle
        grounds:
          - state_machines.Assignment.ACTIVE_to_PENDING_TRANSFER
          - state_machines.Assignment.PENDING_TRANSFER_to_ACTIVE
        distinguishing_aspect: |
          Assignment cycles ACTIVE -> PENDING_TRANSFER -> ACTIVE on cancel,
          with version advancing on each hop and census invariant throughout —
          a cycle on Assignment, distinct from the Handoff cycle.
        test_recipe:
          setup:
            - "H1 ACTIVE shift 06:00-18:00 holds P1 via assignment ASG (version 1); H2 exists as transfer target; clock 2026-05-01T09:00:00Z"
          setup_api_calls:
            - { call: "POST /hospitalists", payload: { full_name: "H One", specialty: "INTERNAL_MEDICINE", max_census_cap: 16 }, as: GroupAdmin, captures: { h1: $.data.id } }
            - { call: "POST /hospitalists", payload: { full_name: "H Two", specialty: "ICU", max_census_cap: 16 }, as: GroupAdmin, captures: { h2: $.data.id } }
            - { call: "POST /shifts", payload: { hospitalist_id: "${h1}", shift_type: "DAY", start_at: "2026-05-01T06:00:00Z", end_at: "2026-05-01T18:00:00Z" }, as: GroupAdmin, captures: { s1: $.data.id } }
            - { call: "POST /shifts/${s1}/activate", payload: {}, as: GroupAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:00:00Z" }, as: GroupAdmin }
            - { call: "POST /patients", payload: { mrn: "M501", acuity: "MEDIUM", admit_source: "ED", stay_type: "INPATIENT", admitted_at: "2026-05-01T08:00:00Z" }, as: GroupAdmin, captures: { p1: $.data.id } }
            - { call: "POST /admissions", payload: { patient_id: "${p1}" }, as: GroupAdmin, captures: { a1: $.data.id, off1: $.data.offered_to_hospitalist_id } }
            - { call: "POST /admissions/${a1}/accept", payload: {}, as: Hospitalist, as_user_id: "${off1}", captures: { asg: $.data.assignment_id } }
            - { call: "GET /assignments/${asg}", as: GroupAdmin, captures: { av: $.data.version } }
          trigger:
            - { call: "POST /assignments/${asg}/transfer", payload: { target_hospitalist_id: "${h2}", expected_assignment_version: "${av}" }, as: Hospitalist, as_user_id: "${h1}", captures: { st1: $.data.status } }
            - { call: "POST /assignments/${asg}/cancel-transfer", payload: {}, as: Hospitalist, as_user_id: "${h1}", captures: { st2: $.data.status } }
            - { call: "GET /hospitalists/${h1}", as: GroupAdmin, captures: { cen: $.data.current_census } }
          assert:
            - "Assignment.${asg} after transfer: status == PENDING_TRANSFER, transfer_target_hospitalist_id == ${h2}, version == 2"
            - "Assignment.${asg} after cancel-transfer: status == ACTIVE (cycle closed), transfer_target_hospitalist_id == null, version == 3"
            - "Hospitalist.${h1}.current_census == 1 throughout the cycle (no census drift)"
            - "Assignment.${asg}.continuity_flag == false"

      - name: handoff_return_resubmit_cycle
        grounds:
          - state_machines.Handoff.SUBMITTED_to_RETURNED
          - state_machines.Handoff.RETURNED_to_SUBMITTED
        distinguishing_aspect: |
          Handoff cycles SUBMITTED -> RETURNED -> SUBMITTED on return/resubmit
          (review loop), distinct from the Assignment transfer cycle; each loop
          recomputes completeness and re-stamps submitted_at.
        test_recipe:
          setup:
            - "H1 with ACTIVE shift S1 06:00-18:00 holds P1; H2 is the receiver; handoff HF created DRAFT with patient_ids [P1]; clock 2026-05-01T09:00:00Z"
          setup_api_calls:
            - { call: "POST /hospitalists", payload: { full_name: "H One", specialty: "INTERNAL_MEDICINE", max_census_cap: 16 }, as: GroupAdmin, captures: { h1: $.data.id } }
            - { call: "POST /hospitalists", payload: { full_name: "H Two", specialty: "FAMILY_MEDICINE", max_census_cap: 16 }, as: GroupAdmin, captures: { h2: $.data.id } }
            - { call: "POST /shifts", payload: { hospitalist_id: "${h1}", shift_type: "DAY", start_at: "2026-05-01T06:00:00Z", end_at: "2026-05-01T18:00:00Z" }, as: GroupAdmin, captures: { s1: $.data.id } }
            - { call: "POST /shifts/${s1}/activate", payload: {}, as: GroupAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:00:00Z" }, as: GroupAdmin }
            - { call: "POST /patients", payload: { mrn: "M601", acuity: "LOW", admit_source: "DIRECT", stay_type: "INPATIENT", admitted_at: "2026-05-01T08:00:00Z" }, as: GroupAdmin, captures: { p1: $.data.id } }
            - { call: "POST /admissions", payload: { patient_id: "${p1}" }, as: GroupAdmin, captures: { a1: $.data.id, off1: $.data.offered_to_hospitalist_id } }
            - { call: "POST /admissions/${a1}/accept", payload: {}, as: Hospitalist, as_user_id: "${off1}" }
            - { call: "POST /shifts/${s1}/handoffs", payload: { receiving_hospitalist_id: "${h2}", patient_ids: ["${p1}"] }, as: Hospitalist, as_user_id: "${h1}", captures: { hf: $.data.id, hv0: $.data.version } }
          trigger:
            - { call: "POST /handoffs/${hf}/submit", payload: {}, as: Hospitalist, as_user_id: "${h1}", captures: { st1: $.data.status } }
            - { call: "POST /handoffs/${hf}/return", payload: { return_reason: "missing course context" }, as: Hospitalist, as_user_id: "${h2}", captures: { st2: $.data.status } }
            - { call: "POST /handoffs/${hf}/submit", payload: {}, as: Hospitalist, as_user_id: "${h1}", captures: { st3: $.data.status } }
            - { call: "POST /handoffs/${hf}/accept", payload: {}, as: Hospitalist, as_user_id: "${h2}", captures: { st4: $.data.status } }
          assert:
            - "Handoff.${hf} statuses in order: SUBMITTED, RETURNED, SUBMITTED, ACCEPTED"
            - "Handoff.${hf}.open_item_count == 0 and completeness_score == 1.0 on every submit"
            - "Handoff.${hf}.return_reason == 'missing course context' persists after the cycle"
            - "Handoff.${hf}.reviewed_at set only after accept; version == 5 (create 1 + submit + return + submit + accept)"

  # ===================================================================
  # Rule 4 — transitive_cascade (different triggers, depth >= 3 and >= 2)
  # ===================================================================
  - rule_id: transitive_cascade
    instances:
      - name: discharge_execute_depth3_chain
        grounds:
          - state_machines.DischargeOrder.ORDERED_to_EXECUTED
          - state_machines.Patient.ADMITTED_to_DISCHARGED
          - state_machines.Assignment.ACTIVE_to_CLOSED
          - entities.Hospitalist.fields.current_census
        distinguishing_aspect: |
          Depth-3 cross-entity chain triggered by discharge execute:
          DischargeOrder EXECUTED mutates Patient (DISCHARGED + OBS_CLOSED),
          whose discharge closes the Assignment (DISCHARGE), whose closure
          decrements Hospitalist.current_census — each link caused by the
          previous link, not by the original call.
        test_recipe:
          setup:
            - "H1 ACTIVE shift 06:00-18:00; P1 OBSERVATION admitted 2026-05-01T08:30:00Z assigned to H1 (census 1); discharge order ORDERED with target 2026-05-03T15:00:00Z; clock 2026-05-01T09:00:00Z"
          setup_api_calls:
            - { call: "POST /hospitalists", payload: { full_name: "H One", specialty: "INTERNAL_MEDICINE", max_census_cap: 16 }, as: GroupAdmin, captures: { h1: $.data.id } }
            - { call: "POST /shifts", payload: { hospitalist_id: "${h1}", shift_type: "DAY", start_at: "2026-05-01T06:00:00Z", end_at: "2026-05-01T18:00:00Z" }, as: GroupAdmin, captures: { s1: $.data.id } }
            - { call: "POST /shifts/${s1}/activate", payload: {}, as: GroupAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:00:00Z" }, as: GroupAdmin }
            - { call: "POST /patients", payload: { mrn: "M701", acuity: "MEDIUM", admit_source: "ED", stay_type: "OBSERVATION", admitted_at: "2026-05-01T08:30:00Z" }, as: GroupAdmin, captures: { p1: $.data.id, obs0: $.data.observation_status } }
            - { call: "POST /admissions", payload: { patient_id: "${p1}" }, as: GroupAdmin, captures: { a1: $.data.id, off1: $.data.offered_to_hospitalist_id } }
            - { call: "POST /admissions/${a1}/accept", payload: {}, as: Hospitalist, as_user_id: "${off1}", captures: { asg: $.data.assignment_id } }
            - { call: "POST /patients/${p1}/discharge-orders", payload: { target_discharge_at: "2026-05-03T15:00:00Z" }, as: Hospitalist, as_user_id: "${h1}", captures: { d1: $.data.id } }
            - { call: "POST /discharge-orders/${d1}/order", payload: {}, as: Hospitalist, as_user_id: "${h1}" }
          trigger:
            - { call: "POST /discharge-orders/${d1}/execute", payload: {}, as: Hospitalist, as_user_id: "${h1}", captures: { dst: $.data.status, meets: $.data.meets_throughput_target } }
            - { call: "GET /patients/${p1}", as: GroupAdmin, captures: { padm: $.data.admission_status, pobs: $.data.observation_status } }
            - { call: "GET /assignments/${asg}", as: GroupAdmin, captures: { ast: $.data.status, areason: $.data.close_reason } }
            - { call: "GET /hospitalists/${h1}", as: GroupAdmin, captures: { cen: $.data.current_census } }
          assert:
            - "DischargeOrder.${d1}.status == EXECUTED and meets_throughput_target == true (executed 2026-05-01T09:00:00Z <= cutoff 2026-05-03T11:00:00Z)"
            - "Patient.${p1}.admission_status == DISCHARGED (link 1)"
            - "Patient.${p1}.observation_status == OBS_CLOSED (obs axis cascaded in the same mutation; was OBS_ACTIVE)"
            - "Assignment.${asg}.status == CLOSED and close_reason == DISCHARGE (link 2, caused by patient discharge)"
            - "Hospitalist.${h1}.current_census == 0 (link 3, caused by assignment close)"

      - name: encounter_void_reopens_report_chain
        grounds:
          - state_machines.Encounter.RECORDED_to_VOIDED
          - state_machines.ProductivityReport.FINALIZED_to_REOPENED
          - calculations.productivity_wrvu_total
        distinguishing_aspect: |
          Depth-2 chain with a different trigger: encounter void mutates the
          linked ProductivityReport FINALIZED -> REOPENED, whose reopen itself
          triggers recomputation of its totals excluding the voided encounter —
          distinct trigger and propagation pattern from the discharge chain.
        test_recipe:
          setup:
            - "H1; P1; encounters E1 (ADMISSION_HCP, 2.654) and E2 (SUBSEQUENT_VISIT, 1.115) on 2026-05-04; report R1 for 2026-05-01..2026-05-31 FINALIZED (final 3.77)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-04T12:00:00Z" }, as: GroupAdmin }
            - { call: "POST /hospitalists", payload: { full_name: "H One", specialty: "INTERNAL_MEDICINE", max_census_cap: 16 }, as: GroupAdmin, captures: { h1: $.data.id } }
            - { call: "POST /patients", payload: { mrn: "M801", acuity: "MEDIUM", admit_source: "DIRECT", stay_type: "INPATIENT", admitted_at: "2026-05-04T08:00:00Z" }, as: GroupAdmin, captures: { p1: $.data.id } }
            - { call: "POST /encounters", payload: { patient_id: "${p1}", encounter_type: "ADMISSION_HCP", occurred_on: "2026-05-04", wrvu_value: 2.654 }, as: Hospitalist, as_user_id: "${h1}", captures: { e1: $.data.id } }
            - { call: "POST /encounters", payload: { patient_id: "${p1}", encounter_type: "SUBSEQUENT_VISIT", occurred_on: "2026-05-04", wrvu_value: 1.115 }, as: Hospitalist, as_user_id: "${h1}", captures: { e2: $.data.id } }
            - { call: "POST /productivity-reports/generate", payload: { hospitalist_id: "${h1}", period_start: "2026-05-01", period_end: "2026-05-31" }, as: GroupAdmin, captures: { r1: $.data.id } }
            - { call: "POST /productivity-reports/${r1}/finalize", payload: {}, as: GroupAdmin }
          trigger:
            - { call: "POST /encounters/${e1}/void", payload: {}, as: Hospitalist, as_user_id: "${h1}", captures: { est: $.data.status } }
            - { call: "GET /productivity-reports/${r1}", as: GroupAdmin, captures: { rst: $.data.status, rprov: $.data.total_wrvu_provisional, rfin: $.data.total_wrvu_final, rvar: $.data.wrvu_variance } }
          assert:
            - "Encounter.${e1}.status == VOIDED"
            - "ProductivityReport.${r1}.status == REOPENED (link 1: void mutated the report)"
            - "ProductivityReport.${r1}.total_wrvu_provisional == 1.27 (link 2: reopen recomputed totals excluding E1)"
            - "ProductivityReport.${r1}.total_wrvu_final == 1.12 (round(1.115,2))"
            - "ProductivityReport.${r1}.wrvu_variance == -0.15"

  # ===================================================================
  # Rule 5 — priority_pair_validation_conflict (different category pairs)
  # ===================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: execute_unordered_with_open_stat_consult
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_DISCHARGE_ORDER_INVALID_STATE]
          - errors[ERR_OPEN_STAT_CONSULT_BLOCKS_DISCHARGE]
        distinguishing_aspect: |
          Category pair (state, business_safety): the order is PLANNED (never
          ORDERED) AND a STAT consult is OPEN — the priority-5 state error
          ERR_DISCHARGE_ORDER_INVALID_STATE must win over the priority-6
          safety error ERR_OPEN_STAT_CONSULT_BLOCKS_DISCHARGE.
        test_recipe:
          setup:
            - "H1 ACTIVE shift 06:00-18:00 holds P1; STAT consult OPEN on P1; discharge order for P1 still PLANNED; clock 2026-05-01T09:00:00Z"
          setup_api_calls:
            - { call: "POST /hospitalists", payload: { full_name: "H One", specialty: "INTERNAL_MEDICINE", max_census_cap: 16 }, as: GroupAdmin, captures: { h1: $.data.id } }
            - { call: "POST /shifts", payload: { hospitalist_id: "${h1}", shift_type: "DAY", start_at: "2026-05-01T06:00:00Z", end_at: "2026-05-01T18:00:00Z" }, as: GroupAdmin, captures: { s1: $.data.id } }
            - { call: "POST /shifts/${s1}/activate", payload: {}, as: GroupAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:00:00Z" }, as: GroupAdmin }
            - { call: "POST /patients", payload: { mrn: "M901", acuity: "HIGH", admit_source: "ED", stay_type: "INPATIENT", admitted_at: "2026-05-01T08:00:00Z" }, as: GroupAdmin, captures: { p1: $.data.id } }
            - { call: "POST /admissions", payload: { patient_id: "${p1}" }, as: GroupAdmin, captures: { a1: $.data.id, off1: $.data.offered_to_hospitalist_id } }
            - { call: "POST /admissions/${a1}/accept", payload: {}, as: Hospitalist, as_user_id: "${off1}" }
            - { call: "POST /patients/${p1}/consult-requests", payload: { specialty: "CARDIOLOGY", priority: "STAT", reason: "chest pain" }, as: Hospitalist, as_user_id: "${h1}", captures: { c1: $.data.id } }
            - { call: "POST /patients/${p1}/discharge-orders", payload: { target_discharge_at: "2026-05-02T15:00:00Z" }, as: Hospitalist, as_user_id: "${h1}", captures: { d1: $.data.id } }
          trigger:
            - { call: "POST /discharge-orders/${d1}/execute", payload: {}, as: Hospitalist, as_user_id: "${h1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DISCHARGE_ORDER_INVALID_STATE (state priority 5 beats business_safety priority 6)"
            - "DischargeOrder.${d1}.status remains PLANNED; Patient.${p1}.admission_status remains ADMITTED"

      - name: accept_transfer_no_shift_and_cap_full
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - errors[ERR_NO_ACTIVE_SHIFT]
          - errors[ERR_CENSUS_CAP_REACHED]
        distinguishing_aspect: |
          Category pair (business_temporal, business_fiscal): transfer target
          H_T has NO ACTIVE shift (temporal) AND census == cap (capacity) —
          the priority-7 temporal error ERR_NO_ACTIVE_SHIFT must win over the
          priority-9 fiscal error ERR_CENSUS_CAP_REACHED; a different pair than
          (state, business_safety).
        test_recipe:
          setup:
            - "H_T cap 1 with census 1 (P1 accepted during its shift), its shift since CLOSED via accepted handoff -> no ACTIVE shift; H_S ACTIVE shift 08:00-20:00 holds P2 (assignment ASG2); ASG2 PENDING_TRANSFER targeting H_T; clock 2026-05-01T09:30:00Z"
          setup_api_calls:
            - { call: "POST /hospitalists", payload: { full_name: "H T", specialty: "INTERNAL_MEDICINE", max_census_cap: 1 }, as: GroupAdmin, captures: { h_t: $.data.id } }
            - { call: "POST /hospitalists", payload: { full_name: "H S", specialty: "ICU", max_census_cap: 16 }, as: GroupAdmin, captures: { h_s: $.data.id } }
            - { call: "POST /hospitalists", payload: { full_name: "H R", specialty: "FAMILY_MEDICINE", max_census_cap: 16 }, as: GroupAdmin, captures: { h_r: $.data.id } }
            - { call: "POST /shifts", payload: { hospitalist_id: "${h_t}", shift_type: "DAY", start_at: "2026-05-01T06:00:00Z", end_at: "2026-05-01T18:00:00Z" }, as: GroupAdmin, captures: { s_t: $.data.id } }
            - { call: "POST /shifts", payload: { hospitalist_id: "${h_s}", shift_type: "DAY", start_at: "2026-05-01T08:00:00Z", end_at: "2026-05-01T20:00:00Z" }, as: GroupAdmin, captures: { s_s: $.data.id } }
            - { call: "POST /shifts/${s_t}/activate", payload: {}, as: GroupAdmin }
            - { call: "POST /shifts/${s_s}/activate", payload: {}, as: GroupAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:00:00Z" }, as: GroupAdmin }
            - { call: "POST /patients", payload: { mrn: "M911", acuity: "MEDIUM", admit_source: "ED", stay_type: "INPATIENT", admitted_at: "2026-05-01T08:00:00Z" }, as: GroupAdmin, captures: { p1: $.data.id } }
            - { call: "POST /admissions", payload: { patient_id: "${p1}" }, as: GroupAdmin, captures: { a1: $.data.id, off1: $.data.offered_to_hospitalist_id } }
            # tie 1.0/1.0 -> H_T earlier shift start (06:00) wins
            - { call: "POST /admissions/${a1}/accept", payload: {}, as: Hospitalist, as_user_id: "${off1}", captures: { asg1: $.data.assignment_id } }
            # H_T now census 1 == cap 1; hand off H_T's shift and close it
            - { call: "POST /shifts/${s_t}/handoffs", payload: { receiving_hospitalist_id: "${h_r}", patient_ids: ["${p1}"] }, as: Hospitalist, as_user_id: "${h_t}", captures: { hf: $.data.id } }
            - { call: "POST /handoffs/${hf}/submit", payload: {}, as: Hospitalist, as_user_id: "${h_t}" }
            - { call: "POST /handoffs/${hf}/accept", payload: {}, as: Hospitalist, as_user_id: "${h_r}" }
            - { call: "POST /shifts/${s_t}/close", payload: {}, as: GroupAdmin }
            # second patient to H_S (H_T ineligible at cap)
            - { call: "POST /patients", payload: { mrn: "M912", acuity: "LOW", admit_source: "DIRECT", stay_type: "INPATIENT", admitted_at: "2026-05-01T08:15:00Z" }, as: GroupAdmin, captures: { p2: $.data.id } }
            - { call: "POST /admissions", payload: { patient_id: "${p2}" }, as: GroupAdmin, captures: { a2: $.data.id, off2: $.data.offered_to_hospitalist_id } }
            - { call: "POST /admissions/${a2}/accept", payload: {}, as: Hospitalist, as_user_id: "${off2}", captures: { asg2: $.data.assignment_id } }
            - { call: "GET /assignments/${asg2}", as: GroupAdmin, captures: { av2: $.data.version } }
            - { call: "POST /assignments/${asg2}/transfer", payload: { target_hospitalist_id: "${h_t}", expected_assignment_version: "${av2}" }, as: Hospitalist, as_user_id: "${h_s}" }
          trigger:
            - { call: "POST /assignments/${asg2}/accept-transfer", payload: {}, as: Hospitalist, as_user_id: "${h_t}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NO_ACTIVE_SHIFT (business_temporal priority 7 beats business_fiscal priority 9 ERR_CENSUS_CAP_REACHED)"
            - "Assignment.${asg2}.status remains PENDING_TRANSFER"
            - "Hospitalist.${h_t}.current_census remains 1 (== cap, unmodified by the rejected accept)"

  # ===================================================================
  # Rule 6 — boundary_precision_check (different metrics, different endpoints)
  # ===================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: census_cap_exact_equality_rejects
        grounds:
          - validations[priority=9]
          - errors[ERR_CENSUS_CAP_REACHED]
          - entities.Hospitalist.fields.max_census_cap
        distinguishing_aspect: |
          Metric = census count vs integer cap: accept-transfer at
          current_census == max_census_cap - 1 succeeds (census becomes 2 ==
          cap), while the next accept-transfer at census == cap is rejected —
          the == boundary itself is the failing side.
        test_recipe:
          setup:
            - "H_T cap 2 ACTIVE shift 07:00-19:00; H_S cap 16 ACTIVE shift 08:00-20:00; P1 -> H_T (census 1); P2 -> H_S then transferred to H_T (census 2 == cap, accepted at cap-1); P3 -> H_S with transfer PENDING to H_T; clock 2026-05-01T09:00:00Z"
          setup_api_calls:
            - { call: "POST /hospitalists", payload: { full_name: "H T", specialty: "INTERNAL_MEDICINE", max_census_cap: 2 }, as: GroupAdmin, captures: { h_t: $.data.id } }
            - { call: "POST /hospitalists", payload: { full_name: "H S", specialty: "ICU", max_census_cap: 16 }, as: GroupAdmin, captures: { h_s: $.data.id } }
            - { call: "POST /shifts", payload: { hospitalist_id: "${h_t}", shift_type: "DAY", start_at: "2026-05-01T07:00:00Z", end_at: "2026-05-01T19:00:00Z" }, as: GroupAdmin, captures: { s_t: $.data.id } }
            - { call: "POST /shifts", payload: { hospitalist_id: "${h_s}", shift_type: "DAY", start_at: "2026-05-01T08:00:00Z", end_at: "2026-05-01T20:00:00Z" }, as: GroupAdmin, captures: { s_s: $.data.id } }
            - { call: "POST /shifts/${s_t}/activate", payload: {}, as: GroupAdmin }
            - { call: "POST /shifts/${s_s}/activate", payload: {}, as: GroupAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:00:00Z" }, as: GroupAdmin }
            - { call: "POST /patients", payload: { mrn: "M921", acuity: "MEDIUM", admit_source: "ED", stay_type: "INPATIENT", admitted_at: "2026-05-01T08:00:00Z" }, as: GroupAdmin, captures: { p1: $.data.id } }
            - { call: "POST /admissions", payload: { patient_id: "${p1}" }, as: GroupAdmin, captures: { a1: $.data.id, off1: $.data.offered_to_hospitalist_id } }
            # H_T 1.0 (07:00) vs H_S 1.0 (08:00) -> H_T
            - { call: "POST /admissions/${a1}/accept", payload: {}, as: Hospitalist, as_user_id: "${off1}" }
            - { call: "POST /patients", payload: { mrn: "M922", acuity: "LOW", admit_source: "DIRECT", stay_type: "INPATIENT", admitted_at: "2026-05-01T08:10:00Z" }, as: GroupAdmin, captures: { p2: $.data.id } }
            - { call: "POST /admissions", payload: { patient_id: "${p2}" }, as: GroupAdmin, captures: { a2: $.data.id, off2: $.data.offered_to_hospitalist_id } }
            # H_T 0.5 vs H_S 1.0 -> H_S
            - { call: "POST /admissions/${a2}/accept", payload: {}, as: Hospitalist, as_user_id: "${off2}", captures: { asg2: $.data.assignment_id } }
            - { call: "GET /assignments/${asg2}", as: GroupAdmin, captures: { av2: $.data.version } }
            - { call: "POST /assignments/${asg2}/transfer", payload: { target_hospitalist_id: "${h_t}", expected_assignment_version: "${av2}" }, as: Hospitalist, as_user_id: "${h_s}" }
            - { call: "POST /assignments/${asg2}/accept-transfer", payload: {}, as: Hospitalist, as_user_id: "${h_t}", captures: { asg2b: $.data.id } }
            # H_T census 1 < cap 2 -> succeeds; census becomes 2 == cap
            - { call: "POST /patients", payload: { mrn: "M923", acuity: "LOW", admit_source: "ED", stay_type: "INPATIENT", admitted_at: "2026-05-01T08:20:00Z" }, as: GroupAdmin, captures: { p3: $.data.id } }
            - { call: "POST /admissions", payload: { patient_id: "${p3}" }, as: GroupAdmin, captures: { a3: $.data.id, off3: $.data.offered_to_hospitalist_id } }
            # H_T ineligible (cap reached) -> H_S
            - { call: "POST /admissions/${a3}/accept", payload: {}, as: Hospitalist, as_user_id: "${off3}", captures: { asg3: $.data.assignment_id } }
            - { call: "GET /assignments/${asg3}", as: GroupAdmin, captures: { av3: $.data.version } }
            - { call: "POST /assignments/${asg3}/transfer", payload: { target_hospitalist_id: "${h_t}", expected_assignment_version: "${av3}" }, as: Hospitalist, as_user_id: "${h_s}" }
          trigger:
            - { call: "POST /assignments/${asg3}/accept-transfer", payload: {}, as: Hospitalist, as_user_id: "${h_t}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CENSUS_CAP_REACHED (current_census 2 == max_census_cap 2: equality rejects)"
            - "prior accept-transfer of ${asg2} at census == cap-1 succeeded; Hospitalist.${h_t}.current_census == 2"
            - "Assignment.${asg3}.status remains PENDING_TRANSFER"

      - name: consult_sla_strictly_greater_boundary
        grounds:
          - calculations.consult_sla
          - errors[ERR_CONSULT_INVALID_STATE]
          - entities.ConsultRequest.fields.sla_breached
        distinguishing_aspect: |
          Metric = elapsed minutes vs SLA deadline: acknowledge at exactly the
          deadline is NOT a breach (strictly-greater comparison), acknowledge
          one millisecond after IS — a time metric through the acknowledge
          endpoint, distinct from the census-count metric through
          accept-transfer.
        test_recipe:
          setup:
            - "H1 ACTIVE shift 06:00-18:00 holds P1; clock starts 2026-05-01T10:00:00Z; STAT consult C1 created at 10:00 (deadline 10:15:00.000Z); URGENT consult C2 created at 10:15 (deadline 10:45:00.000Z)"
          setup_api_calls:
            - { call: "POST /hospitalists", payload: { full_name: "H One", specialty: "INTERNAL_MEDICINE", max_census_cap: 16 }, as: GroupAdmin, captures: { h1: $.data.id } }
            - { call: "POST /shifts", payload: { hospitalist_id: "${h1}", shift_type: "DAY", start_at: "2026-05-01T06:00:00Z", end_at: "2026-05-01T18:00:00Z" }, as: GroupAdmin, captures: { s1: $.data.id } }
            - { call: "POST /shifts/${s1}/activate", payload: {}, as: GroupAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T10:00:00Z" }, as: GroupAdmin }
            - { call: "POST /patients", payload: { mrn: "M931", acuity: "HIGH", admit_source: "ED", stay_type: "INPATIENT", admitted_at: "2026-05-01T09:00:00Z" }, as: GroupAdmin, captures: { p1: $.data.id } }
            - { call: "POST /admissions", payload: { patient_id: "${p1}" }, as: GroupAdmin, captures: { a1: $.data.id, off1: $.data.offered_to_hospitalist_id } }
            - { call: "POST /admissions/${a1}/accept", payload: {}, as: Hospitalist, as_user_id: "${off1}" }
            - { call: "POST /patients/${p1}/consult-requests", payload: { specialty: "CARDIOLOGY", priority: "STAT", reason: "rule out MI" }, as: Hospitalist, as_user_id: "${h1}", captures: { c1: $.data.id, dl1: $.data.sla_deadline } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T10:15:00.000Z" }, as: GroupAdmin }
            - { call: "POST /patients/${p1}/consult-requests", payload: { specialty: "NEUROLOGY", priority: "URGENT", reason: "weakness" }, as: Hospitalist, as_user_id: "${h1}", captures: { c2: $.data.id, dl2: $.data.sla_deadline } }
            - { call: "POST /consult-requests/${c1}/acknowledge", payload: {}, as: ConsultingSpecialist, captures: { br1: $.data.sla_breached } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T10:45:00.001Z" }, as: GroupAdmin }
            - { call: "POST /consult-requests/${c2}/acknowledge", payload: {}, as: ConsultingSpecialist, captures: { br2: $.data.sla_breached } }
          assert:
            - "ConsultRequest.${c1}.sla_deadline == 2026-05-01T10:15:00.000Z (requested 10:00 + 15min STAT)"
            - "ConsultRequest.${c1}.sla_breached == false (acknowledged exactly at deadline: > is false)"
            - "ConsultRequest.${c2}.sla_deadline == 2026-05-01T10:45:00.000Z (requested 10:15 + 30min URGENT)"
            - "ConsultRequest.${c2}.sla_breached == true (acknowledged 1ms past deadline)"
            - "both consults ACKNOWLEDGED after their acknowledges"

  # ===================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ===================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: accept_transfer_requires_target_active_shift
        grounds:
          - state_machines.Assignment.PENDING_TRANSFER_to_CLOSED
          - entities.Shift.fields.state
          - errors[ERR_NO_ACTIVE_SHIFT]
        distinguishing_aspect: |
          Pair Assignment -> Shift: accept-transfer is gated on the TARGET
          hospitalist owning a Shift in state ACTIVE covering now; with the
          target's shift merely SCHEDULED the accept is rejected while every
          Assignment-local precondition holds.
        test_recipe:
          setup:
            - "H_T exists with shift S_T never activated (SCHEDULED); H_S ACTIVE shift 08:00-20:00 holds P1 (ASG); ASG PENDING_TRANSFER targeting H_T; clock 2026-05-01T09:00:00Z"
          setup_api_calls:
            - { call: "POST /hospitalists", payload: { full_name: "H T", specialty: "INTERNAL_MEDICINE", max_census_cap: 16 }, as: GroupAdmin, captures: { h_t: $.data.id } }
            - { call: "POST /hospitalists", payload: { full_name: "H S", specialty: "ICU", max_census_cap: 16 }, as: GroupAdmin, captures: { h_s: $.data.id } }
            - { call: "POST /shifts", payload: { hospitalist_id: "${h_t}", shift_type: "DAY", start_at: "2026-05-01T06:00:00Z", end_at: "2026-05-01T18:00:00Z" }, as: GroupAdmin, captures: { s_t: $.data.id } }
            - { call: "POST /shifts", payload: { hospitalist_id: "${h_s}", shift_type: "DAY", start_at: "2026-05-01T08:00:00Z", end_at: "2026-05-01T20:00:00Z" }, as: GroupAdmin, captures: { s_s: $.data.id } }
            - { call: "POST /shifts/${s_s}/activate", payload: {}, as: GroupAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:00:00Z" }, as: GroupAdmin }
            - { call: "POST /patients", payload: { mrn: "M941", acuity: "MEDIUM", admit_source: "ED", stay_type: "INPATIENT", admitted_at: "2026-05-01T08:30:00Z" }, as: GroupAdmin, captures: { p1: $.data.id } }
            - { call: "POST /admissions", payload: { patient_id: "${p1}" }, as: GroupAdmin, captures: { a1: $.data.id, off1: $.data.offered_to_hospitalist_id } }
            - { call: "POST /admissions/${a1}/accept", payload: {}, as: Hospitalist, as_user_id: "${off1}", captures: { asg: $.data.assignment_id } }
            - { call: "GET /assignments/${asg}", as: GroupAdmin, captures: { av: $.data.version } }
            - { call: "POST /assignments/${asg}/transfer", payload: { target_hospitalist_id: "${h_t}", expected_assignment_version: "${av}" }, as: Hospitalist, as_user_id: "${h_s}" }
          trigger:
            - { call: "POST /assignments/${asg}/accept-transfer", payload: {}, as: Hospitalist, as_user_id: "${h_t}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NO_ACTIVE_SHIFT"
            - "Assignment.${asg}.status remains PENDING_TRANSFER; Hospitalist.${h_t}.current_census remains 0"

      - name: shift_close_requires_accepted_handoff
        grounds:
          - state_machines.Shift.ACTIVE_to_CLOSED
          - entities.Handoff.fields.status
          - errors[ERR_SHIFT_HANDOFF_MISSING]
        distinguishing_aspect: |
          Pair Shift -> Handoff (opposite direction from instance 1): closing
          a shift is gated on a DIFFERENT entity (Handoff) being in state
          ACCEPTED; DRAFT and SUBMITTED handoffs both fail the gate, only
          ACCEPTED unlocks the close.
        test_recipe:
          setup:
            - "H1 ACTIVE shift S1 06:00-18:00 holds P1; H2 receiver; handoff HF exists DRAFT with patient_ids [P1]; clock 2026-05-01T17:00:00Z"
          setup_api_calls:
            - { call: "POST /hospitalists", payload: { full_name: "H One", specialty: "INTERNAL_MEDICINE", max_census_cap: 16 }, as: GroupAdmin, captures: { h1: $.data.id } }
            - { call: "POST /hospitalists", payload: { full_name: "H Two", specialty: "FAMILY_MEDICINE", max_census_cap: 16 }, as: GroupAdmin, captures: { h2: $.data.id } }
            - { call: "POST /shifts", payload: { hospitalist_id: "${h1}", shift_type: "DAY", start_at: "2026-05-01T06:00:00Z", end_at: "2026-05-01T18:00:00Z" }, as: GroupAdmin, captures: { s1: $.data.id } }
            - { call: "POST /shifts/${s1}/activate", payload: {}, as: GroupAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:00:00Z" }, as: GroupAdmin }
            - { call: "POST /patients", payload: { mrn: "M951", acuity: "LOW", admit_source: "DIRECT", stay_type: "INPATIENT", admitted_at: "2026-05-01T08:00:00Z" }, as: GroupAdmin, captures: { p1: $.data.id } }
            - { call: "POST /admissions", payload: { patient_id: "${p1}" }, as: GroupAdmin, captures: { a1: $.data.id, off1: $.data.offered_to_hospitalist_id } }
            - { call: "POST /admissions/${a1}/accept", payload: {}, as: Hospitalist, as_user_id: "${off1}" }
            - { call: "POST /shifts/${s1}/handoffs", payload: { receiving_hospitalist_id: "${h2}", patient_ids: ["${p1}"] }, as: Hospitalist, as_user_id: "${h1}", captures: { hf: $.data.id } }
          trigger:
            - { call: "POST /shifts/${s1}/close", payload: {}, as: GroupAdmin, captures: { e1: $.data.error_id } }
            - { call: "POST /handoffs/${hf}/submit", payload: {}, as: Hospitalist, as_user_id: "${h1}" }
            - { call: "POST /shifts/${s1}/close", payload: {}, as: GroupAdmin, captures: { e2: $.data.error_id } }
            - { call: "POST /handoffs/${hf}/accept", payload: {}, as: Hospitalist, as_user_id: "${h2}" }
            - { call: "POST /shifts/${s1}/close", payload: {}, as: GroupAdmin, captures: { sstate: $.data.state } }
          assert:
            - "close with handoff DRAFT -> ERR_SHIFT_HANDOFF_MISSING"
            - "close with handoff SUBMITTED -> ERR_SHIFT_HANDOFF_MISSING"
            - "close after handoff ACCEPTED -> Shift.state == CLOSED"

  # ===================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ===================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: shift_half_open_adjacency_allowed
        grounds:
          - validations[priority=7]
          - errors[ERR_SHIFT_OVERLAP]
          - entities.Shift.fields.start_at
        distinguishing_aspect: |
          Semantics = strict half-open exclusion on a single resource (one
          Hospitalist's timeline): [07:00,19:00) then [19:00,07:00+1d) is
          allowed because end == start is not an intersection, while
          [18:59,06:00+1d) collides and is rejected.
        test_recipe:
          setup:
            - "H1 exists; no shifts yet"
          setup_api_calls:
            - { call: "POST /hospitalists", payload: { full_name: "H One", specialty: "INTERNAL_MEDICINE", max_census_cap: 16 }, as: GroupAdmin, captures: { h1: $.data.id } }
          trigger:
            - { call: "POST /shifts", payload: { hospitalist_id: "${h1}", shift_type: "DAY", start_at: "2026-05-01T07:00:00Z", end_at: "2026-05-01T19:00:00Z" }, as: GroupAdmin, captures: { s1: $.data.id } }
            - { call: "POST /shifts", payload: { hospitalist_id: "${h1}", shift_type: "NIGHT", start_at: "2026-05-01T19:00:00Z", end_at: "2026-05-02T07:00:00Z" }, as: GroupAdmin, captures: { s2: $.data.id } }
            - { call: "POST /shifts", payload: { hospitalist_id: "${h1}", shift_type: "DAY", start_at: "2026-05-01T18:59:00Z", end_at: "2026-05-02T06:00:00Z" }, as: GroupAdmin, captures: { err: $.data.error_id } }
          assert:
            - "adjacent shift created: S2 201 with state SCHEDULED (end==start adjacency is not an overlap)"
            - "overlapping shift rejected: error_id == ERR_SHIFT_OVERLAP"
            - "GET /shifts?hospitalist_id=${h1} returns exactly 2 rows"

      - name: coverage_window_capacity_pool
        grounds:
          - state_machines.CoverageWindow.OPEN_to_FULL
          - state_machines.CoverageWindow.FULL_to_OPEN
          - errors[ERR_COVERAGE_WINDOW_FULL]
        distinguishing_aspect: |
          Semantics = aggregate capacity pool on a shared resource (the
          CoverageWindow): overlapping enrollments are ALLOWED up to capacity
          and rejected only at enrolled_count == capacity — the opposite
          geometric treatment from strict half-open exclusion, on a different
          resource entity.
        test_recipe:
          setup:
            - "H1, H2, H3 exist (no shifts, so no enrollment conflict); window W NIGHT_CROSS_COVER 2026-05-01T19:00:00Z..2026-05-02T07:00:00Z capacity 2, status OPEN"
          setup_api_calls:
            - { call: "POST /hospitalists", payload: { full_name: "H One", specialty: "INTERNAL_MEDICINE", max_census_cap: 16 }, as: GroupAdmin, captures: { h1: $.data.id } }
            - { call: "POST /hospitalists", payload: { full_name: "H Two", specialty: "FAMILY_MEDICINE", max_census_cap: 16 }, as: GroupAdmin, captures: { h2: $.data.id } }
            - { call: "POST /hospitalists", payload: { full_name: "H Three", specialty: "ICU", max_census_cap: 16 }, as: GroupAdmin, captures: { h3: $.data.id } }
            - { call: "POST /coverage-windows", payload: { window_date: "2026-05-01", window_type: "NIGHT_CROSS_COVER", start_at: "2026-05-01T19:00:00Z", end_at: "2026-05-02T07:00:00Z", capacity: 2 }, as: GroupAdmin, captures: { w: $.data.id } }
          trigger:
            - { call: "POST /coverage-windows/${w}/enroll", payload: {}, as: Hospitalist, as_user_id: "${h1}", captures: { n1: $.data.enrolled_count, st1: $.data.status } }
            - { call: "POST /coverage-windows/${w}/enroll", payload: {}, as: Hospitalist, as_user_id: "${h2}", captures: { n2: $.data.enrolled_count, st2: $.data.status } }
            - { call: "POST /coverage-windows/${w}/enroll", payload: {}, as: Hospitalist, as_user_id: "${h3}", captures: { err: $.data.error_id } }
            - { call: "POST /coverage-windows/${w}/withdraw", payload: {}, as: Hospitalist, as_user_id: "${h1}", captures: { n3: $.data.enrolled_count, st3: $.data.status } }
            - { call: "POST /coverage-windows/${w}/enroll", payload: {}, as: Hospitalist, as_user_id: "${h3}", captures: { n4: $.data.enrolled_count, st4: $.data.status } }
          assert:
            - "enroll H1: enrolled_count == 1, status OPEN (overlap allowed below capacity)"
            - "enroll H2: enrolled_count == 2, status FULL (auto-transition at == capacity)"
            - "enroll H3 while FULL: error_id == ERR_COVERAGE_WINDOW_FULL"
            - "withdraw H1: enrolled_count == 1, status OPEN (FULL -> OPEN cycle)"
            - "re-enroll H3: enrolled_count == 2, status FULL; enrolled roster == [H2, H3]"

  # ===================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===================================================================
  - rule_id: compensating_invariant
    instances:
      - name: transfer_conserves_total_active_assignments
        grounds:
          - calculations.census_conservation_invariant
          - state_machines.Assignment.PENDING_TRANSFER_to_CLOSED
        distinguishing_aspect: |
          Conserved quantity = total count of ACTIVE assignments (patient
          coverage): the accept-transfer forward action closes exactly one
          ACTIVE assignment and creates exactly one, so the group-wide total
          is identical before and after — and P1 still has exactly one ACTIVE
          assignment (now under H2).
        test_recipe:
          setup:
            - "H1 ACTIVE shift 06:00-18:00 holds P1 and P2 (census 2); H2 ACTIVE shift 07:00-19:00 census 0; group total ACTIVE assignments == 2; clock 2026-05-01T09:00:00Z"
          setup_api_calls:
            - { call: "POST /hospitalists", payload: { full_name: "H One", specialty: "INTERNAL_MEDICINE", max_census_cap: 16 }, as: GroupAdmin, captures: { h1: $.data.id } }
            - { call: "POST /hospitalists", payload: { full_name: "H Two", specialty: "FAMILY_MEDICINE", max_census_cap: 16 }, as: GroupAdmin, captures: { h2: $.data.id } }
            - { call: "POST /shifts", payload: { hospitalist_id: "${h1}", shift_type: "DAY", start_at: "2026-05-01T06:00:00Z", end_at: "2026-05-01T18:00:00Z" }, as: GroupAdmin, captures: { s1: $.data.id } }
            - { call: "POST /shifts", payload: { hospitalist_id: "${h2}", shift_type: "DAY", start_at: "2026-05-01T07:00:00Z", end_at: "2026-05-01T19:00:00Z" }, as: GroupAdmin, captures: { s2: $.data.id } }
            - { call: "POST /shifts/${s1}/activate", payload: {}, as: GroupAdmin }
            - { call: "POST /shifts/${s2}/activate", payload: {}, as: GroupAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:00:00Z" }, as: GroupAdmin }
            - { call: "POST /patients", payload: { mrn: "M961", acuity: "MEDIUM", admit_source: "ED", stay_type: "INPATIENT", admitted_at: "2026-05-01T08:00:00Z" }, as: GroupAdmin, captures: { p1: $.data.id } }
            - { call: "POST /admissions", payload: { patient_id: "${p1}" }, as: GroupAdmin, captures: { a1: $.data.id, off1: $.data.offered_to_hospitalist_id } }
            - { call: "POST /admissions/${a1}/accept", payload: {}, as: Hospitalist, as_user_id: "${off1}", captures: { asg1: $.data.assignment_id } }
            - { call: "POST /patients", payload: { mrn: "M962", acuity: "LOW", admit_source: "DIRECT", stay_type: "INPATIENT", admitted_at: "2026-05-01T08:10:00Z" }, as: GroupAdmin, captures: { p2: $.data.id } }
            - { call: "POST /admissions", payload: { patient_id: "${p2}" }, as: GroupAdmin, captures: { a2: $.data.id, off2: $.data.offered_to_hospitalist_id } }
            - { call: "POST /admissions/${a2}/accept", payload: {}, as: Hospitalist, as_user_id: "${off2}", captures: { asg2: $.data.assignment_id } }
            # both offered to H1 (equal score 1.0, earlier shift start wins)
            - { call: "GET /assignments/${asg1}", as: GroupAdmin, captures: { av1: $.data.version } }
          trigger:
            - { call: "POST /assignments/${asg1}/transfer", payload: { target_hospitalist_id: "${h2}", expected_assignment_version: "${av1}" }, as: Hospitalist, as_user_id: "${h1}" }
            - { call: "POST /assignments/${asg1}/accept-transfer", payload: {}, as: Hospitalist, as_user_id: "${h2}", captures: { asg1b: $.data.id } }
            - { call: "GET /hospitalists/${h1}", as: GroupAdmin, captures: { cen1: $.data.current_census } }
            - { call: "GET /hospitalists/${h2}", as: GroupAdmin, captures: { cen2: $.data.current_census } }
          assert:
            - "group total ACTIVE assignments == 2 before AND after the transfer (conserved)"
            - "Assignment.${asg1}.status == CLOSED with close_reason == TRANSFER"
            - "Assignment.${asg1b}.status == ACTIVE, hospitalist_id == ${h2}, patient_id == ${p1}, continuity_flag == false"
            - "Hospitalist.${h1}.current_census == 1 and Hospitalist.${h2}.current_census == 1"
            - "P1 has exactly one ACTIVE assignment (uniqueness half of the invariant)"

      - name: void_rerecord_conserves_final_wrvu
        grounds:
          - calculations.wrvu_conservation_invariant
          - state_machines.ProductivityReport.REOPENED_to_FINALIZED
        distinguishing_aspect: |
          Conserved quantity = report final wRVU total (a monetary-like sum,
          different type from instance 1's patient count): void + identical
          re-record + refinalize leaves total_wrvu_final == 3.77 exactly as
          before the void.
        test_recipe:
          setup:
            - "H1; P1; E1 (ADMISSION_HCP, 2.654) + E2 (SUBSEQUENT_VISIT, 1.115) on 2026-05-04; report R1 period 2026-05-01..2026-05-31 FINALIZED with total_wrvu_final == 3.77"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-04T12:00:00Z" }, as: GroupAdmin }
            - { call: "POST /hospitalists", payload: { full_name: "H One", specialty: "INTERNAL_MEDICINE", max_census_cap: 16 }, as: GroupAdmin, captures: { h1: $.data.id } }
            - { call: "POST /patients", payload: { mrn: "M971", acuity: "MEDIUM", admit_source: "DIRECT", stay_type: "INPATIENT", admitted_at: "2026-05-04T08:00:00Z" }, as: GroupAdmin, captures: { p1: $.data.id } }
            - { call: "POST /encounters", payload: { patient_id: "${p1}", encounter_type: "ADMISSION_HCP", occurred_on: "2026-05-04", wrvu_value: 2.654 }, as: Hospitalist, as_user_id: "${h1}", captures: { e1: $.data.id } }
            - { call: "POST /encounters", payload: { patient_id: "${p1}", encounter_type: "SUBSEQUENT_VISIT", occurred_on: "2026-05-04", wrvu_value: 1.115 }, as: Hospitalist, as_user_id: "${h1}", captures: { e2: $.data.id } }
            - { call: "POST /productivity-reports/generate", payload: { hospitalist_id: "${h1}", period_start: "2026-05-01", period_end: "2026-05-31" }, as: GroupAdmin, captures: { r1: $.data.id } }
            - { call: "POST /productivity-reports/${r1}/finalize", payload: {}, as: GroupAdmin, captures: { fin_before: $.data.total_wrvu_final } }
          trigger:
            - { call: "POST /encounters/${e1}/void", payload: {}, as: Hospitalist, as_user_id: "${h1}" }
            - { call: "POST /encounters", payload: { patient_id: "${p1}", encounter_type: "ADMISSION_HCP", occurred_on: "2026-05-04", wrvu_value: 2.654 }, as: Hospitalist, as_user_id: "${h1}", captures: { e1b: $.data.id } }
            - { call: "POST /productivity-reports/${r1}/finalize", payload: {}, as: GroupAdmin, captures: { fin_after: $.data.total_wrvu_final, prov_after: $.data.total_wrvu_provisional, rst: $.data.status } }
          assert:
            - "void leaves ProductivityReport.${r1} REOPENED before re-finalize"
            - "ProductivityReport.${r1}.total_wrvu_final == 3.77 after the compensating pair (== value before the void)"
            - "ProductivityReport.${r1}.total_wrvu_provisional == 3.92 (identical re-record restores provisional too)"
            - "ProductivityReport.${r1}.status == FINALIZED and Encounter.${e1b}.productivity_report_id == ${r1} after re-linking"
