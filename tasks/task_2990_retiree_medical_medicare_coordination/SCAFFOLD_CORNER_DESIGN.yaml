      - name: grandfather_group_assigned_at_both_hire_date_cutoffs
        claim_type: threshold
        grounds:
          - calculations.retiree_grandfather_group_assignment
          - calculations.retiree_grandfather_group_assignment.constants
        distinguishing_aspect: |
          Both cutoffs are half-open on the low side: hire_date strictly before
          1993-01-01 is GRANDFATHERED_A, hire_date exactly 1993-01-01 falls into
          TRANSITION_B, hire_date exactly 2005-01-01 falls into STANDARD_C. All
          four probes sit one day either side of a cutoff, so an implementation
          using <= instead of < misclassifies exactly the two boundary rows.
