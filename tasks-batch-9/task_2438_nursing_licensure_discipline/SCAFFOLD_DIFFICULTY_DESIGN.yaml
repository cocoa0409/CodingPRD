              captures: { ren_id: $.data.id }
            - call: "POST /renewal-applications/${ren_id}/ce-records"
              payload: { provider_code: "OHNA-330", provider_accredited: true, category: "LIVE_CONTACT", minutes: 1800, completion_date: "2027-10-10T00:00:00Z" }
              as: LicensureAnalyst
              captures: { ce_id: $.data.id }
            - call: "POST /ce-records/${ce_id}/verification"
              payload: { verification_status: "VERIFIED" }
              as: LicensureAnalyst
            - call: "POST /renewal-applications/${ren_id}/payment"
              payload: {}
              as: LicensureAnalyst
            - call: "POST /renewal-applications/${ren_id}/submit"
              payload: {}
              as: LicensureAnalyst
            - call: "POST /renewal-applications/${ren_id}/ce-verification"
              payload: {}
              as: LicensureAnalyst
            - call: "GET /nurses/${nurse_id}"
              payload: {}
              as: LicensureAnalyst
              captures: { paid_before: $.data.fee_paid_total_cents, credit_before: $.data.fee_credit_cents }
          trigger:
            - call: "POST /renewal-applications/${ren_id}/finalization"
              payload: { outcome: "DENIED" }
              as: LicensureAnalyst
          assert:
            - "${paid_before} == 12000 and ${credit_before} == 0, so the identity read 12000 == 0 + 12000 before the compensating action"
            - "RenewalApplication.${ren_id}.renewal_status == DENIED"
            - "RenewalApplication.${ren_id}.fee_applied_cents == 0"
            - "RenewalApplication.${ren_id}.fee_paid_cents == 12000 — never decremented"
            - "Nurse.${nurse_id}.fee_paid_total_cents == 12000 — unchanged by the denial"
            - "Nurse.${nurse_id}.fee_credit_cents == 12000"
            - "the identity Nurse.fee_paid_total_cents == Nurse.fee_credit_cents + sum of fee_applied_cents over non-WITHDRAWN renewals now reads 12000 == 12000 + 0, so there is zero drift"
            - "License.${lic_id}.expires_on == 2028-08-01T00:00:00Z — a denied renewal never advances the expiry"

      - name: complaint_dismissals_restore_open_encumbrance_count_to_zero
        grounds:
          - calculations.license_encumbrance_reconciliation
          - state_machines.License.encumbrance_status.INVESTIGATION_PENDING_to_CLEAR
          - state_machines.Complaint.EVIDENCE_COMPLETE_to_DISMISSED
          - entities.License.fields.open_encumbrance_count
          - entities.Nurse.fields.status
        distinguishing_aspect: |
          A different conserved quantity than the fee ledger: open_encumbrance_count. Two forward
          actions raise it to 2 and each compensating dismissal lowers it by exactly 1, but the
          encumbrance dimension is only allowed back to CLEAR at zero — so after the FIRST
          dismissal the count is 1 and the license must still read INVESTIGATION_PENDING with the
          nurse still ENCUMBERED. Only the second dismissal restores CLEAR and ACTIVE, with no
          drift in either direction.
        test_recipe:
          setup:
            - "The nurse holds one ACTIVE RN license, initially CLEAR with open_encumbrance_count 0 and Nurse.status ACTIVE."
            - "Two PRACTICE_STANDARD complaints c1 and c2 are filed against that license; both are triaged and investigated, so open_encumbrance_count reaches 2, encumbrance_status is INVESTIGATION_PENDING and Nurse.status is ENCUMBERED."
            - "Each complaint is served one EMPLOYER_INCIDENT demand against a distinct custodian, both produced, and both complaints reach EVIDENCE_COMPLETE."
            - "c1 is dismissed first, lowering the count to 1 while the encumbrance stays INVESTIGATION_PENDING."
          setup_api_calls:
            - call: "POST /state-board-configs"
              payload: { state_code: "OH", board_name: "Ohio Board of Nursing", compact_member: true }
              as: SystemAdmin
              captures: { board_id: $.data.id }
            - call: "POST /education-programs"
              payload: { state_board_config_id: "${board_id}", program_code: "OH-BSN-44", program_name: "Xenia BSN", degree_level: "BSN", nclex_first_time_pass_rate_bp: 8350, approval_expires_on: "2032-01-01T00:00:00Z" }
              as: SystemAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /nurses"
              payload: { home_board_config_id: "${board_id}", full_name: "Junko Marchetti", birth_year: 1995, ssn_last4: "5757", declared_primary_state: "OH" }
              as: LicensureAnalyst
              captures: { nurse_id: $.data.id }
            - call: "POST /license-applications"
              payload: { nurse_id: "${nurse_id}", board_config_id: "${board_id}", pathway: "EXAMINATION", credential_type: "RN", education_program_id: "${prog_id}", nclex_result: "PASS" }
              as: LicensureAnalyst
              captures: { app_id: $.data.id }
            - call: "POST /license-applications/${app_id}/submit"
              payload: {}
              as: LicensureAnalyst
            - call: "POST /license-applications/${app_id}/qualification-verification"
              payload: {}
              as: LicensureAnalyst
            - call: "POST /license-applications/${app_id}/screening-result"
              payload: { screening_offense_records: [] }
              as: LicensureAnalyst
            - call: "POST /licenses"
              payload: { source_application_id: "${app_id}" }
              as: LicensureAnalyst
              captures: { lic_id: $.data.id }
            - call: "POST /complaints"
              payload: { license_id: "${lic_id}", complainant_type: "PATIENT", violation_category: "PRACTICE_STANDARD", incident_date: "2026-06-10T00:00:00Z", employer_custodian_codes: ["MERCY-GEN"] }
              as: Investigator
              as_user_id: "inv-10"
              captures: { c1_id: $.data.id }
            - call: "POST /complaints/${c1_id}/triage"
              payload: { jurisdiction_finding: "JURISDICTION_CONFIRMED" }
              as: Investigator
              as_user_id: "inv-10"
            - call: "POST /complaints/${c1_id}/investigation"
              payload: {}
              as: Investigator
              as_user_id: "inv-10"
            - call: "POST /complaints"
              payload: { license_id: "${lic_id}", complainant_type: "EMPLOYER", violation_category: "PRACTICE_STANDARD", incident_date: "2026-06-28T00:00:00Z", employer_custodian_codes: ["ST-LUKE"] }
              as: Investigator
              as_user_id: "inv-10"
              captures: { c2_id: $.data.id }
            - call: "POST /complaints/${c2_id}/triage"
              payload: { jurisdiction_finding: "JURISDICTION_CONFIRMED" }
              as: Investigator
              as_user_id: "inv-10"
            - call: "POST /complaints/${c2_id}/investigation"
              payload: {}
              as: Investigator
              as_user_id: "inv-10"
            - call: "POST /complaints/${c1_id}/evidence-requests"
              payload: { record_class: "EMPLOYER_INCIDENT", custodian_code: "MERCY-GEN", hold_start_at: "2026-08-03T00:00:00Z", hold_end_at: "2026-08-28T00:00:00Z" }
              as: Investigator
              as_user_id: "inv-10"
              captures: { ev1_id: $.data.id }
            - call: "POST /evidence-requests/${ev1_id}/production"
              payload: { page_count: 9 }
              as: Investigator
              as_user_id: "inv-10"
            - call: "POST /complaints/${c1_id}/evidence-completion"
              payload: {}
              as: Investigator
              as_user_id: "inv-10"
            - call: "POST /complaints/${c2_id}/evidence-requests"
              payload: { record_class: "EMPLOYER_INCIDENT", custodian_code: "ST-LUKE", hold_start_at: "2026-08-03T00:00:00Z", hold_end_at: "2026-08-28T00:00:00Z" }
              as: Investigator
              as_user_id: "inv-10"
              captures: { ev2_id: $.data.id }
            - call: "POST /evidence-requests/${ev2_id}/production"
              payload: { page_count: 14 }
              as: Investigator
              as_user_id: "inv-10"
            - call: "POST /complaints/${c2_id}/evidence-completion"
              payload: {}
              as: Investigator
              as_user_id: "inv-10"
            - call: "POST /complaints/${c1_id}/disposition"
              payload: { disposition: "DISMISS" }
              as: Investigator
              as_user_id: "inv-10"
            - call: "GET /licenses/${lic_id}"
              payload: {}
              as: LicensureAnalyst
              captures: { count_after_first: $.data.open_encumbrance_count, enc_after_first: $.data.encumbrance_status }
          trigger:
            - call: "POST /complaints/${c2_id}/disposition"
              payload: { disposition: "DISMISS" }
              as: Investigator
              as_user_id: "inv-10"
          assert:
            - "${count_after_first} == 1 and ${enc_after_first} == INVESTIGATION_PENDING — one compensation is not enough to reach CLEAR"
            - "License.${lic_id}.open_encumbrance_count == 0 after the second dismissal"
            - "License.${lic_id}.encumbrance_status == CLEAR"
            - "License.${lic_id}.license_status == ACTIVE and multistate_privilege_status == MULTISTATE"
            - "Nurse.${nurse_id}.status == ACTIVE"
            - "Complaint.${c1_id}.status == DISMISSED and Complaint.${c2_id}.status == DISMISSED"
            - "Nurse.${nurse_id}.prior_discipline_count == 0 — a dismissal is not discipline"
