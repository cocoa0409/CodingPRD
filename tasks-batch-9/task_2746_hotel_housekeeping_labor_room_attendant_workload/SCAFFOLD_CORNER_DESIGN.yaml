        distinguishing_aspect: "Two properties with the identical 1.50-credit projection need 1 and 2 attendants respectively, because assignable_ceiling is min(14.5, max_daily_credits) and 1.50 / 1.50 lands exactly on the integer boundary while 1.50 / 1.00 does not."
