  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: booking_confirm_requires_session_open
        grounds:
          - state_machines.Booking.PENDING_to_CONFIRMED
          - entities.ClassSession.fields.status
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Entity pair Booking->ClassSession: a Booking's PENDING->CONFIRMED is only valid when the
          parent ClassSession.status == OPEN. With the session still SCHEDULED (never opened), confirm
          is rejected ERR_INVALID_STATE — the booking's valid transition depends on the session's state.
        test_recipe:
          setup:
            - "SCHEDULED (not opened) session; a PENDING booking exists on it"
          setup_api_calls:
            - call: "POST /culinary/instructors"
              payload: { full_name: "Chef U", email: "chef.u@x.com", max_skill_level: "PROFESSIONAL" }
              as: StudioAdmin
              captures: { instr_id: $.data.id }
            - call: "POST /culinary/members"
              payload: { full_name: "Mem G", email: "g@x.com" }
              as: StudioAdmin
              captures: { mem_g: $.data.id }
            - call: "POST /culinary/templates"
              payload: { title: "Sched", skill_level: "BEGINNER", base_price_cents: 5000, default_capacity: 2, station_fixed_cost_cents: 1000, prep_minutes: 0, cleanup_minutes: 0 }
              as: StudioAdmin
              captures: { tmpl_id: $.data.id }
            - call: "POST /culinary/templates/${tmpl_id}/publish"
              payload: {}
              as: StudioAdmin
            - call: "POST /culinary/sessions"
              payload: { template_id: "${tmpl_id}", instructor_id: "${instr_id}", station_id: "ST11", event_type: "GROUP", start_at: "2026-09-25T14:00:00Z", end_at: "2026-09-25T16:00:00Z", planned_seats: 2 }
              as: StudioAdmin
              captures: { sess_id: $.data.id }
            - call: "POST /culinary/bookings"
              payload: { session_id: "${sess_id}", member_id: "${mem_g}", seats_requested: 1 }
              as: Member
              as_user_id: "${mem_g}"
              captures: { bk_g: $.data.id }
          trigger:
            - call: "GET /culinary/sessions/${sess_id}"
              payload: {}
              as: StudioAdmin
              captures: { occ_sv_11: $.data.version }
            - call: "POST /culinary/bookings/${bk_g}/confirm"
              payload: { expected_session_version: "${occ_sv_11}" }
              as: Member
              as_user_id: "${mem_g}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "Booking.${bk_g}.lifecycle_status == PENDING (unchanged)"

      - name: series_publish_requires_instructor_active_and_template_published
        grounds:
          - state_machines.RecurringSeries.DRAFT_to_PUBLISHED
          - entities.ClassTemplate.fields.status
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Entity pair RecurringSeries->ClassTemplate (different pair than Booking->ClassSession):
          a series's DRAFT->PUBLISHED requires the referenced ClassTemplate.status == PUBLISHED. With
          the template still DRAFT, publish is rejected ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "A DRAFT template (never published) and a DRAFT series referencing it"
          setup_api_calls:
            - call: "POST /culinary/instructors"
              payload: { full_name: "Chef V", email: "chef.v@x.com", max_skill_level: "PROFESSIONAL" }
              as: StudioAdmin
              captures: { instr_id: $.data.id }
            - call: "POST /culinary/templates"
              payload: { title: "DraftTmpl", skill_level: "BEGINNER", base_price_cents: 5000, default_capacity: 4, station_fixed_cost_cents: 1000, prep_minutes: 0, cleanup_minutes: 0 }
              as: StudioAdmin
              captures: { tmpl_id: $.data.id }
            - call: "POST /culinary/series"
              payload: { template_id: "${tmpl_id}", instructor_id: "${instr_id}", cadence: "WEEKLY", occurrence_count: 2, first_start_at: "2026-10-01T14:00:00Z" }
              as: StudioAdmin
              captures: { series_id: $.data.id }
          trigger:
            - call: "POST /culinary/series/${series_id}/publish"
              payload: {}
              as: StudioAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "RecurringSeries.${series_id}.status == DRAFT (unchanged)"

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: station_overlap_with_prep_buffer_rejected
        grounds:
          - validations[priority=22]
          - errors[ERR_STATION_DOUBLE_BOOKED]
          - entities.ClassSession.fields.station_id
          - entities.ClassTemplate.fields.prep_minutes
        distinguishing_aspect: |
          Station resource, BUFFERED interval semantics: occupation extends to
          [start_at - prep_minutes, end_at + cleanup_minutes). Session C on ST12 starts at 16:00 with
          prep 60 -> occupation [15:00,17:00) which overlaps session A's [13:00,16:30); open is rejected
          ERR_STATION_DOUBLE_BOOKED. This interval is widened by prep/cleanup buffers.
        test_recipe:
          setup:
            - "Session A on ST12 OPEN occupying [13:00,16:30); session C on ST12 occupying [15:00,17:00)"
          setup_api_calls:
            - call: "POST /culinary/instructors"
              payload: { full_name: "Chef W", email: "chef.w@x.com", max_skill_level: "PROFESSIONAL" }
              as: StudioAdmin
              captures: { instr_id: $.data.id }
            - call: "POST /culinary/templates"
              payload: { title: "BufA", skill_level: "BEGINNER", base_price_cents: 5000, default_capacity: 4, station_fixed_cost_cents: 1000, prep_minutes: 60, cleanup_minutes: 30 }
              as: StudioAdmin
              captures: { tmpl_a: $.data.id }
            - call: "POST /culinary/templates/${tmpl_a}/publish"
              payload: {}
              as: StudioAdmin
            - call: "POST /culinary/templates"
              payload: { title: "BufC", skill_level: "BEGINNER", base_price_cents: 5000, default_capacity: 4, station_fixed_cost_cents: 1000, prep_minutes: 60, cleanup_minutes: 0 }
              as: StudioAdmin
              captures: { tmpl_c: $.data.id }
            - call: "POST /culinary/templates/${tmpl_c}/publish"
              payload: {}
              as: StudioAdmin
            - call: "POST /culinary/sessions"
              payload: { template_id: "${tmpl_a}", instructor_id: "${instr_id}", station_id: "ST12", event_type: "GROUP", start_at: "2026-07-01T14:00:00Z", end_at: "2026-07-01T16:00:00Z", planned_seats: 4 }
              as: StudioAdmin
              captures: { sess_a: $.data.id }
            - call: "POST /culinary/sessions/${sess_a}/ingredient-lines"
              payload: { name: "a", qty_per_seat: 1, unit_cost_cents: 1 }
              as: Instructor
              as_user_id: "${instr_id}"
            - call: "POST /culinary/sessions/${sess_a}/open"
              payload: {}
              as: Instructor
              as_user_id: "${instr_id}"
            - call: "POST /culinary/sessions"
              payload: { template_id: "${tmpl_c}", instructor_id: "${instr_id}", station_id: "ST12", event_type: "GROUP", start_at: "2026-07-01T16:00:00Z", end_at: "2026-07-01T17:00:00Z", planned_seats: 4 }
              as: StudioAdmin
              captures: { sess_c: $.data.id }
            - call: "POST /culinary/sessions/${sess_c}/ingredient-lines"
              payload: { name: "c", qty_per_seat: 1, unit_cost_cents: 1 }
              as: Instructor
              as_user_id: "${instr_id}"
          trigger:
            - call: "POST /culinary/sessions/${sess_c}/open"
              payload: {}
              as: Instructor
              as_user_id: "${instr_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STATION_DOUBLE_BOOKED"
            - "ClassSession.${sess_c}.status == SCHEDULED (open rejected)"

      - name: seat_capacity_aggregate_overlap_rejected
        grounds:
          - validations[priority=21]
          - errors[ERR_INSUFFICIENT_SEATS]
          - entities.ClassSession.fields.confirmed_seats
          - entities.ClassSession.fields.planned_seats
        distinguishing_aspect: |
          Seat resource, COUNT-aggregate interval semantics (different from station temporal geometry):
          confirmed_seats occupy a finite capacity pool, not a time interval. A 2-seat confirm against a
          session with planned_seats=3 already holding confirmed_seats=2 would push the aggregate to 4 > 3
          and is rejected ERR_INSUFFICIENT_SEATS — the "overlap" is over a capacity count, not a timeline.
        test_recipe:
          setup:
