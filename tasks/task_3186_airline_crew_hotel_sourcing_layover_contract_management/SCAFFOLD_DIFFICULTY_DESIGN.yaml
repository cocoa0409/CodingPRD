  - rule_id: boundary_precision_check
    instances:
      - name: rest_effective_hours_exactly_at_minimum_is_compliant
        grounds:
          - calculations.rest_compliance
          - validations[priority=5]
          - entities.CrewLayoverRequirement.fields.rest_compliant
        distinguishing_aspect: |
          Boundary on the effective-rest metric via POST /layover-requirements: effective rest
          uses >= (not >), so a layover whose effective rest equals the minimum exactly
          (arrival 18:00, departure 09:00 next day, transport 2 x 30 min = 1.0h -> effective
          14.0 >= 14 union/station minimum of 14) is compliant; one minute less of layover is
          not.
        test_recipe:
          setup:
            - "Station BOI min_rest_hours 12, transport_time_minutes 30; union PILOT min_rest_hours 14 (union is stricter, so the binding minimum is 14)"
          setup_api_calls:
            - call: "POST /stations"
              payload: { code: "BOI", name: "Boise", timezone: "America/Boise", min_rest_hours: 12, transport_time_minutes: 30, room_availability_commitment: 15 }
              as: PlatformAdmin
              captures: { st_boi: $.data.id }
            - call: "POST /union-agreements"
              payload: { name: "APA-2026", crew_type: "PILOT", min_rest_hours: 14, quiet_room_required: false, min_room_standard: "STANDARD", blackout_protection_required: false, max_invoice_variance_pct: 10.0 }
              as: PlatformAdmin
          trigger:
            - call: "POST /layover-requirements"
              payload: { station_id: "${st_boi}", crew_type: "PILOT", crew_count: 2, arrival_time: "2026-06-02T18:00:00Z", departure_time: "2026-06-03T09:00:00Z", required_rest_hours: 14 }
              as: CrewOps
              captures: { lay_edge: $.data.id, lay_edge_ok: $.data.rest_compliant }
            - call: "POST /layover-requirements"
              payload: { station_id: "${st_boi}", crew_type: "PILOT", crew_count: 2, arrival_time: "2026-06-02T18:01:00Z", departure_time: "2026-06-03T09:00:00Z", required_rest_hours: 14 }
              as: CrewOps
              captures: { lay_under: $.data.id, lay_under_ok: $.data.rest_compliant }
          assert:
            - "CrewLayoverRequirement.${lay_edge}.rest_compliant == true (effective 14.0 >= 14 exactly at the boundary)"
            - "CrewLayoverRequirement.${lay_under}.rest_compliant == false (layover_hours floors to 14, effective 13.0 < 14)"
