        distinguishing_aspect: >
          The 30-day demand window counts only SUBMITTED, UNDER_REVIEW and ACCEPTED
          requests, so rejecting the sole accepted request drops demand_units_30d from
          50 to 0 rather than leaving it at 50.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Drug D has one ACTIVE+SOURCED row of 500 units and a single ACCEPTED request of packaged_quantity 50, so demand_units_30d is 50."
