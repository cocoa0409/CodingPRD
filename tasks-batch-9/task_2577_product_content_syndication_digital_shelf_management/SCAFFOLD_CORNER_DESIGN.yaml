        excluded_because:
          difficulty_instance: service_fee_rush_tier_keyed_on_discounted_not_on_total
          rationale: "The pinned evaluation order and the fact that the rush tier is keyed on discounted_cents rather than on the final total are the entire subject of that instance."

      - name: shelf_health_index_rounds_subscores_before_averaging
        claim_type: precision
        grounds:
          - calculations.shelf_health_index.precision
        excluded_because:
          difficulty_instance: shelf_health_index_rounds_each_subscore_before_averaging
          rationale: "The two-stage rounding order, including the cent that changes when the average is rounded only once, is asserted there against a fixture built for that purpose."

  # ===========================================================================
  # From Table 4 (Validations)
  # ===========================================================================
  - section: validations
    instances:
      - name: missing_role_header_returns_unauthenticated_before_authorization
        claim_type: priority_ordering
        grounds:
          - validations[priority=1]
          - validations[priority=2]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request with no X-User-Role header against a write only ShelfAdmin may call returns 401 ERR_UNAUTHENTICATED, not the 403 ERR_UNAUTHORIZED that would follow from evaluating the roles list first."
        test_recipe:
          setup:
            - "empty database apart from the logical clock; the request carries neither X-User-Role nor X-User-ID"
          setup_api_calls:
            - call: "POST /digital-shelf/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ShelfAdmin
          trigger:
            - call: "POST /digital-shelf/retailers"
              payload: { name: "HeaderlessMart", retailer_code: "RETH" }
              as: Anonymous
              captures: { e_401: $.data.error_id }
            - call: "GET /digital-shelf/retailers"
              payload: {}
              as: ShelfAdmin
          assert:
            - "HTTP 401"
            - "${e_401} == \"ERR_UNAUTHENTICATED\""
            - "the follow-up GET returns meta.total_count == 0 — no Retailer was created"

      - name: content_author_on_reviews_returns_unauthorized_not_track_mismatch
        claim_type: priority_ordering
        grounds:
          - validations[priority=2]
          - validations[priority=3]
          - errors[ERR_UNAUTHORIZED]
          - endpoints["POST /digital-shelf/change-requests/{id}/reviews"]
        distinguishing_aspect: "ContentAuthor is absent from the reviews roles list, so the 403 is ERR_UNAUTHORIZED at priority 2 and never ERR_TRACK_ROLE_MISMATCH at priority 3, even though the request also names a track the caller could not own."
        test_recipe:
          setup:
            - "Retailer SimpleMart is ACTIVE with min_image_count 1, feed_slot_capacity 10, enhanced_content_requires_approval true and a single REQUIRED requirement row title (weight 40), so D == 40 + IMAGE_WEIGHT 20 == 60"
            - "product SKU-D-1 has one APPROVED HERO_IMAGE asset and one DRAFT revision carrying only title, image_count 1"
            - "one ChangeRequest authored by author_1 targets that revision on the SimpleMart listing and has been submitted, so the request is IN_REVIEW with both tracks PENDING and the revision is IN_REVIEW"
            - "nothing is pinned yet: RetailerListing.pinned_content_version_id is null, both completeness variants are 0.00, readiness_score is 0.00, Product.status is DRAFT and Product.last_pinned_at is null; the logical clock stands at 2026-08-10T00:00:00Z"
          setup_api_calls:
            - call: "POST /digital-shelf/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ShelfAdmin
            - call: "POST /digital-shelf/attribute-definitions"
              payload: { attribute_key: "title", data_type: "STRING", taxonomy_group: "CORE", max_chars: 200, base_weight: 40.00, is_global_required: true }
              as: ShelfAdmin
            - call: "POST /digital-shelf/retailers"
              payload: { name: "SimpleMart", retailer_code: "RETS", status: "ACTIVE", min_image_count: 1, feed_slot_capacity: 10, max_concurrent_feed_windows: 2, enhanced_content_requires_approval: true }
              as: ShelfAdmin
              captures: { rd_id: $.data.id }
            - call: "POST /digital-shelf/retailers/${rd_id}/requirements"
              payload: { attribute_key: "title", requirement_level: "REQUIRED" }
              as: ShelfAdmin
            - call: "POST /digital-shelf/products"
              payload: { sku: "SKU-D-1", gtin: "00012345678936", category_code: "SMALL_APPLIANCE", brand_code: "BRHM" }
              as: ContentAuthor
              captures: { pd_id: $.data.id }
            - call: "POST /digital-shelf/retailer-listings"
              payload: { product_id: "${pd_id}", retailer_id: "${rd_id}", account_team_user_id: "acct_simplemart_1" }
              as: ContentAuthor
              captures: { ld_id: $.data.id }
            - call: "POST /digital-shelf/media-assets"
              payload: { product_id: "${pd_id}", asset_role: "HERO_IMAGE", source_uri: "s3://brand/d/hero.jpg" }
              as: ContentAuthor
              captures: { md1_id: $.data.id }
            - call: "POST /digital-shelf/media-assets/${md1_id}/retailer-decision"
              payload: { decision: "APPROVE" }
              as: RetailerIntegration
              as_user_id: "${rd_id}"
            - call: "POST /digital-shelf/content-versions"
              payload: { product_id: "${pd_id}", image_count: 1 }
              as: ContentAuthor
              captures: { vd1_id: $.data.id }
            - call: "POST /digital-shelf/content-versions/${vd1_id}/attribute-values"
              payload: { attribute_key: "title", value: "Bright Kitchen Blender 900W" }
              as: ContentAuthor
            - call: "POST /digital-shelf/change-requests"
              payload: { product_id: "${pd_id}", retailer_id: "${rd_id}", target_content_version_id: "${vd1_id}", rationale: "pin revision 1 on SimpleMart" }
              as: ContentAuthor
              as_user_id: "author_1"
              captures: { crd_id: $.data.id }
            - call: "POST /digital-shelf/change-requests/${crd_id}/submit"
              payload: {}
              as: ContentAuthor
              as_user_id: "author_1"
          trigger:
            - call: "GET /digital-shelf/products/${pd_id}"
              payload: {}
              as: ContentAuthor
              captures: { pv_u: $.data.version }
            - call: "POST /digital-shelf/change-requests/${crd_id}/reviews"
              payload: { track: "LEGAL", decision: "APPROVED", expected_product_version: "${pv_u}" }
              as: ContentAuthor
              as_user_id: "author_2"
              captures: { e_403: $.data.error_id }
          assert:
            - "HTTP 403"
            - "${e_403} == \"ERR_UNAUTHORIZED\""
            - "ChangeRequest.${crd_id}.legal_review_state == PENDING"
            - "ChangeRequest.${crd_id}.state == IN_REVIEW"
            - "Product.${pd_id}.version == 1"

      - name: missing_retailer_id_returns_invalid_request_before_product_not_found
        claim_type: priority_ordering
        grounds:
          - validations[priority=8]
          - validations[priority=11]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "The body omits the required retailer_id AND names a product that does not exist; priority 8 fires first, so the response is 400 ERR_INVALID_REQUEST rather than 404 ERR_PRODUCT_NOT_FOUND."
        test_recipe:
          setup:
            - "empty database apart from the logical clock; no Product and no Retailer exist"
          setup_api_calls:
            - call: "POST /digital-shelf/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ShelfAdmin
          trigger:
            - call: "POST /digital-shelf/retailer-listings"
              payload: { product_id: "00000000-0000-4000-8000-0000000000cc" }
              as: ContentAuthor
              captures: { e_400: $.data.error_id }
          assert:
            - "HTTP 400"
            - "${e_400} == \"ERR_INVALID_REQUEST\""

      - name: transmit_on_an_unknown_job_returns_not_found_before_the_state_check
        claim_type: priority_ordering
        grounds:
          - validations[priority=16]
          - validations[priority=29]
          - errors[ERR_SYNDICATION_JOB_NOT_FOUND]
        distinguishing_aspect: "Existence at priority 16 precedes the state guard at priority 29, so transmitting a job id that was never created returns 404 ERR_SYNDICATION_JOB_NOT_FOUND rather than 409 ERR_INVALID_JOB_STATE."
        test_recipe:
          setup:
            - "no SyndicationJob exists"
          setup_api_calls:
            - call: "POST /digital-shelf/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ShelfAdmin
          trigger:
            - call: "POST /digital-shelf/syndication-jobs/00000000-0000-4000-8000-0000000000dd/transmit"
              payload: {}
              as: SyndicationOperator
              captures: { e_404j: $.data.error_id }
          assert:
            - "HTTP 404"
            - "${e_404j} == \"ERR_SYNDICATION_JOB_NOT_FOUND\""

      - name: stale_retailer_version_returns_412_before_the_paused_retailer_check
        claim_type: priority_ordering
        grounds:
          - validations[priority=23]
          - validations[priority=24]
          - concurrency_rules.job-create-stale-retailer
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "The retailer was paused by a PATCH that also bumped its version, so a queue attempt carrying the pre-PATCH version hits the OCC check at priority 23 and returns 412 ERR_STALE_VERSION rather than the 409 ERR_RETAILER_NOT_ACTIVE at priority 24."
        test_recipe:
          setup:
            - "Retailer BigBox is ACTIVE with min_image_count 4, feed_slot_capacity 10, max_concurrent_feed_windows 2 and three REQUIRED requirement rows (title weight 40, description weight 30, brand weight 10), so the completeness denominator D == 80 + IMAGE_WEIGHT 20 == 100"
            - "product SKU-B-1 has revision 1 PINNED on the BigBox listing with title and description present, brand ABSENT and image_count 4, and exactly three APPROVED image assets against min_image_count 4"
            - "therefore RetailerListing.completeness_score_certified == 85.00, completeness_score_declared == 90.00, readiness_score == 51.00, syndication_state == NOT_SYNDICATED, shelf_state == OK"
            - "Retailer.feed_slots_reserved == 0, Retailer.version == 1 and the logical clock stands at 2026-08-10T00:00:00Z"
            - "a ShelfAdmin has since patched BigBox to status PAUSED, so Retailer.version == 2 while the operator still holds version 1"
          setup_api_calls:
            - call: "POST /digital-shelf/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
