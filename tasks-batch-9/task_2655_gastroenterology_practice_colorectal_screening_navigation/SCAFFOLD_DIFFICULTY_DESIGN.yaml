              captures: { nav4: $.data.navigation_status, score4: $.data.prep_adherence_score, clin4: $.data.clinical_status }
          assert:
            - "${nav0} == NOT_STARTED and ${clin0} == OPEN"
            - "${nav1} == OUTREACH_ACTIVE and ${score1} == 3.00 and ${clin1} == PROCEDURE_SCHEDULED"
            - "${nav2} == PREP_CONFIRMED and ${score2} == 5.50"
