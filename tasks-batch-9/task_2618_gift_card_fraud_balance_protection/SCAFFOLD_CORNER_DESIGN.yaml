            - "${arc3} == 1"
            - "DrainingAlert.${alert_id}.triaged_by_user_id == analyst-98 and resolution == null and resolved_by_user_id == null — reopen clears the resolution but preserves the triager"

      - name: multi_hop_cascade_reaches_every_declared_hop
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: rack_tamper_three_hop_cascade_suspends_store_and_voids_inactive_cards
          rationale: "That §1.8 instance already verifies an N-level chain end to end — audit writes the rack TAMPERED, the store recomputes to SUSPENDED, and only the INACTIVE cards in that store are VOIDED while the ACTIVE one is untouched — including the per-hop version bumps, so a second end-to-end cascade instance here would be a duplicate."

      - name: reserve_delta_on_variant_switch_reconciles_in_the_summary
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: reserve_provisional_vs_final_basis_and_rate_on_liability_period
          rationale: "That §1.8 instance already covers both halves of this layer's row: the two variants are computed on the same period from the same alert population (21004 provisional against 3001 final), and the delta on the switch is asserted through the overwritten gross_exposure_cents and reserve_basis_alert_count alongside the preserved provisional_reserve_cents."

  # ==========================================================================
  - section: consistency_model
    instances:

      - name: every_derived_field_is_current_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.store_floor_posture
          - calculations.card_balance_projection
          - endpoints[POST /card-racks/{id}/audits]
        distinguishing_aspect: "consistency_model is immediate, so no read-after-write delay is ever needed: the audit response itself already carries tamper_state TAMPERED and missing_card_count 3, the store read taken immediately afterwards already shows SUSPENDED with its counters recomputed, and the card that was INACTIVE at the moment of the audit is already VOIDED — all without any intervening clock advance or retry."
        test_recipe:
          setup:
            - "One RetailStore with a rack of expected_card_count 6, audited at 3 observed cards so missing_card_count lands exactly on rack_shrink_threshold 3."
            - "cardActive: activated to ACTIVE with face value 5000 and one redemption of 1000, so balance 4000."
            - "cardIdle: created but never screened, so it is still INACTIVE."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Immediate Consistency Store", region_code: "SW", address_line: "68 Immediate Way" }
              as: PlatformAdmin
              captures: { store1_id: $.data.id }
            - call: "POST /card-racks"
              payload: { store_id: "${store1_id}", rack_label: "RACK-IC", expected_card_count: 6 }
              as: PlatformAdmin
              captures: { rack1_id: $.data.id }
            - call: "POST /gift-cards"
              payload: { store_id: "${store1_id}", rack_id: "${rack1_id}", card_number_masked: "****-****-****-9901" }
              as: PosAssociate
              captures: { cardActive_id: $.data.id }
            - call: "POST /issuance-requests"
              payload: { channel: "PHYSICAL", face_value_cents: 5000, store_id: "${store1_id}", rack_id: "${rack1_id}", card_id: "${cardActive_id}", pos_terminal_id: "T-99", packaging_seal_intact: true }
              as: PosAssociate
              captures: { ir_id: $.data.id }
            - call: "POST /issuance-requests/${ir_id}/screen"
              payload: {}
              as: PosAssociate
              captures: { ir_state: $.data.state }
            - call: "POST /gift-cards"
              payload: { store_id: "${store1_id}", rack_id: "${rack1_id}", card_number_masked: "****-****-****-9902" }
              as: PosAssociate
              captures: { cardIdle_id: $.data.id }
          trigger:
            - call: "POST /gift-cards/${cardActive_id}/redemptions"
              payload: { amount_cents: 1000, merchant_store_id: "${store1_id}", pos_terminal_id: "T-99" }
              as: PosAssociate
              captures: { ev_signed: $.data.signed_amount_cents }
            - call: "GET /gift-cards/${cardActive_id}"
              payload: {}
              as: RiskManager
              as_user_id: "risk-99"
              captures: { bal_now: $.data.current_balance_cents, drawdown_now: $.data.drawdown_ratio, merchants_now: $.data.distinct_merchant_count, recent_now: $.data.recent_redemption_count }
            - call: "POST /card-racks/${rack1_id}/audits"
              payload: { observed_card_count: 3, seal_breaks_observed: 0 }
              as: PosAssociate
              captures: { rack_state: $.data.tamper_state, rack_missing: $.data.missing_card_count, rack_observed: $.data.observed_card_count, rack_audited: $.data.last_audit_at }
            - call: "GET /stores/${store1_id}"
              payload: {}
              as: FraudAnalyst
              captures: { floor_now: $.data.floor_posture, tampered_now: $.data.tampered_rack_count, suspect_now: $.data.suspect_rack_count }
            - call: "GET /gift-cards/${cardIdle_id}"
              payload: {}
              as: FraudAnalyst
              captures: { idle_state: $.data.activation_state }
            - call: "GET /gift-cards/${cardActive_id}"
              payload: {}
              as: FraudAnalyst
              captures: { active_state: $.data.activation_state, active_bal: $.data.current_balance_cents }
          assert:
            - "${ir_state} == APPROVED"
            - "${ev_signed} == -1000"
