scaffold_difficulty_design:
  # ------------------------------------------------------------------
  # Rule 1: dual-variant calculations on different entity domains
  # ------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: floorplan_actual_accrual_vs_projected_payoff_quote
        grounds:
          - calculations.floor_plan_interest
          - calculations.payoff_quote
          - entities.Unit.fields.floorplan_balance_cents
        distinguishing_aspect: |
          Entity domain = Unit floor-plan financing. The ACTUAL (chronological
          ledger) variant leaves floorplan_balance_cents untouched between
          sweeps, while the PROJECTED (forward-looking) payoff quote for the
          same unit on the same clock adds 10 days of unposted interest —
          same unit, same clock, two different cents values.
        test_recipe:
          setup:
            - "NEW unit received from a factory order: M2_106/DD13/A4X2 stock order, committed_total = invoice = 10085000 cents, apr_bp default 690"
            - "unit READY; last_accrual_date == stocking_date == 2026-08-15; logical clock advanced to 2026-08-25 with NO sweep after 2026-08-15"
          setup_api_calls:
            - { call: "POST /dealership/factory-build-slots", payload: { build_month: "2026-08", vocation_group: "STANDARD", capacity: 5 }, as: SalesManager, captures: { slot_id: $.data.id } }
            - { call: "POST /dealership/factory-orders", payload: { factory_build_slot_id: "${slot_id}", chassis_model: "M2_106", engine_option: "DD13", axle_config: "A4X2" }, as: SalesConsultant, captures: { order_id: $.data.id } }
            - { call: "POST /dealership/factory-orders/${order_id}/commit", payload: {}, as: SalesConsultant }
            - { call: "POST /dealership/ops/run-daily-sweep", payload: {}, as: DealershipAdmin }
            - { call: "POST /dealership/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: DealershipAdmin }
            - { call: "POST /dealership/ops/run-daily-sweep", payload: {}, as: DealershipAdmin }
            - { call: "POST /dealership/factory-orders/${order_id}/receive", payload: { vin: "1FUJGBDV1CLW88321" }, as: SalesManager, captures: { unit_id: $.data.received_unit_id } }
            - { call: "POST /dealership/units/${unit_id}/inspect", payload: { outcome: "PASS" }, as: ServiceManager }
            - { call: "POST /dealership/_clock/set_current_utc", payload: { to_iso8601: "2026-08-25T00:00:00Z" }, as: DealershipAdmin }
          trigger:
            - { call: "GET /dealership/units/${unit_id}", payload: {}, as: Controller, captures: { bal_actual: $.data.floorplan_balance_cents } }
            - { call: "GET /dealership/units/${unit_id}/payoff-quote", payload: {}, as: Controller, captures: { proj_int: $.data.projected_interest_cents, payoff: $.data.payoff_cents } }
          assert:
            - "Unit.${unit_id}.floorplan_balance_cents == 10085000 (actual variant: nothing posted since receive)"
            - "payoff-quote.projected_interest_cents == 19330 (round_half_up(10085000 * 0.069 / 360 * 10))"
            - "payoff-quote.payoff_cents == 10104330 (balance + 19330 + curtailment 0)"
            - "payoff_cents != floorplan_balance_cents — the two variants diverge by exactly the unposted 19330"
      - name: appraisal_book_estimate_vs_market_acv_offer
        grounds:
          - calculations.trade_allowance_estimate
          - entities.TradeAppraisal.fields.book_estimate_cents
          - entities.TradeAppraisal.fields.offer_acv_cents
        distinguishing_aspect: |
          Entity domain = TradeAppraisal (different from the floor-plan instance).
          BOOK variant (straight-line depreciation minus mileage penalty) yields
          3510000; MARKET variant (book x condition x market index) yields
          3790800 for the same vehicle inputs — the offer is capped only by MARKET.
        test_recipe:
          setup:
            - "clock at default 2026-08-01 (year 2026); FLEET customer exists"
            - "appraisal: model_year 2022 (age 4), mileage 280000, condition B, base_book_value_cents 8000000"
          setup_api_calls:
            - { call: "POST /dealership/customer-accounts", payload: { account_name: "HaulCo", account_type: "FLEET", fleet_tier: "GOLD", credit_limit_cents: 100000000 }, as: SalesManager, captures: { acct_id: $.data.id } }
            - { call: "POST /dealership/trade-appraisals", payload: { customer_account_id: "${acct_id}", trade_vin: "1FUJA6CV42LW77412", model_year: 2022, mileage: 280000, condition_grade: "B", base_book_value_cents: 8000000 }, as: SalesConsultant, captures: { appr_id: $.data.id, book_est: $.data.book_estimate_cents } }
          trigger:
            - { call: "POST /dealership/trade-appraisals/${appr_id}/offer", payload: { market_index_bp: 10800, offered_allowance_cents: 3700000 }, as: SalesManager, captures: { acv: $.data.offer_acv_cents } }
          assert:
            - "TradeAppraisal.${appr_id}.book_estimate_cents == 3510000 (8000000 x max(0, 1 - 0.12*4) - (280000-150000) x 5)"
            - "TradeAppraisal.${appr_id}.offer_acv_cents == 3790800 (3510000 x 1.00 x 1.08)"
            - "book_estimate_cents != offer_acv_cents — variants diverge by 280800"
            - "status == OFFERED because offered_allowance_cents 3700000 <= offer_acv_cents 3790800"

  # ------------------------------------------------------------------
  # Rule 2: combinatorial formulas across different modes (a), (b), (c)
  # ------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: factory_order_price_tiered_rebate_with_vocation_multiplier
        grounds:
          - calculations.factory_order_price
          - state_machines.FactoryOrder.SLOT_HELD_to_COMMITTED
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — tiered volume
          rebate selected from prior-order count (0% / 2% / 4%), chassis/engine/
          axle surcharges, and a vocational multiplier (SEVERE x1.08) applied to
          the upfit sum only. Target order created BEFORE the 3 prior commits
          (provisional rebate tier 0%) but committed AFTER them (tier 2%), so the
          two snapshots of the same formula differ: 19805000 vs 19474000.
        test_recipe:
          setup:
            - "FLEET customer C; SEVERE pool and STANDARD pool for 2026-09, capacity 10 each"
            - "target order (CASCADIA_126/DD15/A6X4, SEVERE pool, upfits DUMP_BODY 1800000 + CRANE_PTO 950000) created first"
            - "three prior M2_106/DD13/A4X2 orders for C created and committed afterwards"
          setup_api_calls:
            - { call: "POST /dealership/customer-accounts", payload: { account_name: "TierCo", account_type: "FLEET", credit_limit_cents: 100000000 }, as: SalesManager, captures: { acct_id: $.data.id } }
            - { call: "POST /dealership/factory-build-slots", payload: { build_month: "2026-09", vocation_group: "SEVERE", capacity: 10 }, as: SalesManager, captures: { slot_sev: $.data.id } }
            - { call: "POST /dealership/factory-build-slots", payload: { build_month: "2026-09", vocation_group: "STANDARD", capacity: 10 }, as: SalesManager, captures: { slot_std: $.data.id } }
            - { call: "POST /dealership/factory-orders", payload: { factory_build_slot_id: "${slot_sev}", customer_account_id: "${acct_id}", chassis_model: "CASCADIA_126", engine_option: "DD15", axle_config: "A6X4", upfit_lines: [ { component_code: "DUMP_BODY", price_cents: 1800000 }, { component_code: "CRANE_PTO", price_cents: 950000 } ] }, as: SalesConsultant, captures: { target_id: $.data.id, prov: $.data.provisional_total_cents } }
            - { call: "POST /dealership/factory-orders", payload: { factory_build_slot_id: "${slot_std}", customer_account_id: "${acct_id}", chassis_model: "M2_106", engine_option: "DD13", axle_config: "A4X2" }, as: SalesConsultant, captures: { o1: $.data.id } }
            - { call: "POST /dealership/factory-orders/${o1}/commit", payload: {}, as: SalesConsultant }
            - { call: "POST /dealership/factory-orders", payload: { factory_build_slot_id: "${slot_std}", customer_account_id: "${acct_id}", chassis_model: "M2_106", engine_option: "DD13", axle_config: "A4X2" }, as: SalesConsultant, captures: { o2: $.data.id } }
            - { call: "POST /dealership/factory-orders/${o2}/commit", payload: {}, as: SalesConsultant }
            - { call: "POST /dealership/factory-orders", payload: { factory_build_slot_id: "${slot_std}", customer_account_id: "${acct_id}", chassis_model: "M2_106", engine_option: "DD13", axle_config: "A4X2" }, as: SalesConsultant, captures: { o3: $.data.id } }
            - { call: "POST /dealership/factory-orders/${o3}/commit", payload: {}, as: SalesConsultant }
          trigger:
            - { call: "POST /dealership/factory-orders/${target_id}/commit", payload: {}, as: SalesConsultant, captures: { committed_total: $.data.committed_total_cents } }
          assert:
            - "FactoryOrder.${target_id}.provisional_total_cents == 19805000 (prior=0 at creation: 16550000 - 0 + 2970000 + 285000)"
            - "FactoryOrder.${target_id}.committed_total_cents == 19474000 (prior=3 at commit: 16550000 - 331000 + 2970000 + 285000)"
            - "upfit_total component == 2970000 (round_half_up(2750000 * 1.08)) — SEVERE multiplier applied to upfits only, not to chassis"
      - name: parts_sale_per_line_rounding_then_sum
        grounds:
          - calculations.parts_line_pricing
          - entities.PartsSaleLine.fields.unit_net_price_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order — unit net price is rounded
          round_half_up PER LINE before multiplying by quantity and summing;
          the forbidden alternative (sum list, discount once) yields 107142
          instead of 107139 on this fixture, so the pinned order is observable
          in cents. Quantity break (+5% at qty >= 10) and the 40% discount cap
          stack per line before rounding.
        test_recipe:
          setup:
            - "GOLD fleet account (10% tier) with credit_limit 100000000"
            - "part A list 12499 cents, on_hand 20; part B list 999 cents, on_hand 5, core charge 5000"
          setup_api_calls:
            - { call: "POST /dealership/customer-accounts", payload: { account_name: "GoldFleet", account_type: "FLEET", fleet_tier: "GOLD", credit_limit_cents: 100000000 }, as: SalesManager, captures: { acct_id: $.data.id } }
            - { call: "POST /dealership/parts", payload: { sku: "FLT-A1", part_name: "Filter A", list_price_cents: 12499, cost_cents: 7000, on_hand: 20 }, as: PartsCounterRep, captures: { part_a: $.data.id } }
            - { call: "POST /dealership/parts", payload: { sku: "FLT-B2", part_name: "Alternator B", list_price_cents: 999, cost_cents: 400, on_hand: 5, has_core_charge: true, core_charge_cents: 5000 }, as: PartsCounterRep, captures: { part_b: $.data.id } }
          trigger:
            - { call: "POST /dealership/parts-sales", payload: { customer_account_id: "${acct_id}", lines: [ { part_id: "${part_a}", quantity: 10 }, { part_id: "${part_b}", quantity: 1 } ] }, as: PartsCounterRep, captures: { sale_id: $.data.id, subtotal: $.data.subtotal_cents, core: $.data.core_total_cents, total: $.data.total_cents } }
            - { call: "GET /dealership/parts-sale-lines", payload: { parts_sale_id: "${sale_id}" }, as: PartsCounterRep, captures: { line_a_net: "$.data[0].unit_net_price_cents" } }
          assert:
            - "line A unit_net_price_cents == 10624 (round_half_up(12499 * 0.85); qty 10 >= 10 adds 5% -> 15% effective)"
            - "line A line_total_cents == 106240 (per-line net x qty, not round of aggregate)"
            - "line B unit_net_price_cents == 899 (round_half_up(999 * 0.90); qty 1 -> no break)"
            - "PartsSale.${sale_id}.subtotal_cents == 107139 (106240 + 899)"
            - "PartsSale.${sale_id}.core_total_cents == 5000 (core never discounted)"
            - "PartsSale.${sale_id}.total_cents == 112139"
      - name: repair_order_totals_pinned_evaluation_order
        grounds:
          - calculations.repair_order_totals
          - entities.RepairOrder.fields.shop_supplies_fee_cents
        distinguishing_aspect: |
          Mode (c): circular-looking dependency — the shop-supplies fee is 5% of
          labor AFTER tier discount (not of the total that itself contains the
          fee), capped at 3500; evaluation order is pinned labor -> parts ->
          discount -> fee -> covered -> due. Computing the fee from the
          undiscounted labor (2888) or from the running total would diverge;
          the pinned order yields fee 2310 and due 56510.
        test_recipe:
          setup:
            - "PLATINUM fleet account (20% labor discount), credit_limit 10000000"
            - "RO (external vin, promised 2026-08-20T17:00:00Z, default labor rate 16500) with lines: LABOR 2.5h (41250), LABOR 1.0h (16500), PART qty 1 of an 8000-cent part (on_hand 2)"
            - "estimate approved; bay booking 2026-08-05 09:00-11:00 checked in; work started and completed before promise (penalty 0)"
          setup_api_calls:
            - { call: "POST /dealership/customer-accounts", payload: { account_name: "PlatFleet", account_type: "FLEET", fleet_tier: "PLATINUM", credit_limit_cents: 10000000 }, as: SalesManager, captures: { acct_id: $.data.id } }
            - { call: "POST /dealership/repair-orders", payload: { customer_account_id: "${acct_id}", external_vin: "3ALACWFCXHDXXXX01", concern: "brake job", promised_ready_at: "2026-08-20T17:00:00Z" }, as: ServiceAdvisor, captures: { ro_id: $.data.id } }
            - { call: "POST /dealership/repair-order-lines", payload: { repair_order_id: "${ro_id}", line_type: "LABOR", hours: 2.5, description: "axle labor" }, as: ServiceAdvisor }
            - { call: "POST /dealership/repair-order-lines", payload: { repair_order_id: "${ro_id}", line_type: "LABOR", hours: 1.0, description: "inspection labor" }, as: ServiceAdvisor }
            - { call: "POST /dealership/parts", payload: { sku: "BRK-800", part_name: "Brake kit", list_price_cents: 8000, cost_cents: 5000, on_hand: 2 }, as: PartsCounterRep, captures: { part_id: $.data.id } }
            - { call: "POST /dealership/repair-order-lines", payload: { repair_order_id: "${ro_id}", line_type: "PART", part_id: "${part_id}", quantity: 1 }, as: ServiceAdvisor }
            - { call: "POST /dealership/repair-orders/${ro_id}/submit-estimate", payload: {}, as: ServiceAdvisor }
            - { call: "POST /dealership/repair-orders/${ro_id}/approve-estimate", payload: {}, as: FleetCustomer, as_user_id: "${acct_id}" }
            - { call: "POST /dealership/service-bays", payload: { bay_code: "B1", bay_type: "STANDARD" }, as: ServiceManager, captures: { bay_id: $.data.id } }
            - { call: "POST /dealership/service-bookings", payload: { repair_order_id: "${ro_id}", service_bay_id: "${bay_id}", start_at: "2026-08-05T09:00:00Z", end_at: "2026-08-05T11:00:00Z" }, as: ServiceAdvisor, captures: { bk_id: $.data.id } }
            - { call: "POST /dealership/service-bookings/${bk_id}/check-in", payload: {}, as: ServiceAdvisor }
            - { call: "POST /dealership/repair-orders/${ro_id}/start-work", payload: {}, as: ServiceAdvisor }
            - { call: "POST /dealership/repair-orders/${ro_id}/complete-work", payload: {}, as: ServiceAdvisor }
          trigger:
            - { call: "POST /dealership/repair-orders/${ro_id}/invoice", payload: {}, as: ServiceManager, captures: { due: $.data.customer_due_cents, fee: $.data.shop_supplies_fee_cents, disc: $.data.discount_cents } }
          assert:
            - "RepairOrder.${ro_id}.labor_sum_cents == 57750 and parts_sum_cents == 8000"
            - "discount_cents == 11550 (round_half_up(57750 * 0.20), labor only)"
            - "shop_supplies_fee_cents == 2310 (min(round_half_up(0.05 * 46200), 3500))"
            - "customer_due_cents == 56510 (57750 - 11550 + 8000 + 2310 - 0 - 0)"
            - "CustomerAccount.${acct_id}.open_ar_cents == 56510 after invoice"

  # ------------------------------------------------------------------
  # Rule 3: non-linear state machines on different entities
  # ------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: factory_order_expire_then_rehold_cycle
        grounds:
          - state_machines.FactoryOrder.SLOT_HELD_to_EXPIRED
          - state_machines.FactoryOrder.EXPIRED_to_SLOT_HELD
          - state_machines.FactoryBuildSlot.LOCKED_to_OPEN
        distinguishing_aspect: |
          Cyclic machine on FactoryOrder: SLOT_HELD -> EXPIRED (sweep past
          hold_expires_at) -> SLOT_HELD again via re-hold onto a different pool —
          the cycle mutates factory_build_slot_id, refreshes hold_expires_at to
          clock + 14 days, and moves the held_count between pools.
        test_recipe:
          setup:
            - "pool A build_month 2026-08 capacity 1 with order held at clock 2026-08-01 (hold_expires_at 2026-08-15T00:00:00Z)"
            - "clock advanced to 2026-08-16 and swept: order EXPIRED, pool A held_count back to 0 (pool A not closed — still August)"
            - "pool B build_month 2026-09 capacity 1 exists and is OPEN"
          setup_api_calls:
            - { call: "POST /dealership/factory-build-slots", payload: { build_month: "2026-08", vocation_group: "STANDARD", capacity: 1 }, as: SalesManager, captures: { slot_a: $.data.id } }
            - { call: "POST /dealership/factory-orders", payload: { factory_build_slot_id: "${slot_a}", chassis_model: "M2_106", engine_option: "DD13", axle_config: "A4X2" }, as: SalesConsultant, captures: { order_id: $.data.id } }
            - { call: "POST /dealership/_clock/set_current_utc", payload: { to_iso8601: "2026-08-16T00:00:00Z" }, as: DealershipAdmin }
            - { call: "POST /dealership/ops/run-daily-sweep", payload: {}, as: DealershipAdmin, captures: { expired_n: $.data.orders_expired } }
            - { call: "POST /dealership/factory-build-slots", payload: { build_month: "2026-09", vocation_group: "STANDARD", capacity: 1 }, as: SalesManager, captures: { slot_b: $.data.id } }
          trigger:
            - { call: "POST /dealership/factory-orders/${order_id}/re-hold", payload: { factory_build_slot_id: "${slot_b}" }, as: SalesConsultant, captures: { st: $.data.status, hexp: $.data.hold_expires_at } }
          assert:
            - "sweep result orders_expired == 1 and order left SLOT_HELD -> EXPIRED before re-hold"
            - "after re-hold: status == SLOT_HELD, factory_build_slot_id == ${slot_b}"
            - "hold_expires_at == 2026-08-30T00:00:00Z (clock 2026-08-16 + 14 days)"
            - "pool A held_count == 0; pool B held_count == 1 and slots_available == 0 and status == LOCKED"
      - name: warranty_claim_deny_appeal_approve_cycle
        grounds:
          - state_machines.WarrantyClaim.SUBMITTED_to_DENIED
          - state_machines.WarrantyClaim.DENIED_to_APPEALED
          - state_machines.WarrantyClaim.APPEALED_to_APPROVED
        distinguishing_aspect: |
          Cyclic machine on WarrantyClaim (different entity from FactoryOrder):
          SUBMITTED -> DENIED -> APPEALED -> APPROVED; the loop is legal exactly
          once per appeal and appeal_count accumulates; final approval copies
          claimed amounts into approved amounts and fires the RO cascade.
        test_recipe:
          setup:
            - "RETAIL account; RO (external vin) with one warranty_eligible LABOR line 1.0h x 16500 = 16500; RO driven to INVOICED (fee 825, due 17325)"
            - "claim claimed_labor 16500 / parts 0 created and submitted by wadmin-1"
          setup_api_calls:
            - { call: "POST /dealership/customer-accounts", payload: { account_name: "RetailOne", account_type: "RETAIL" }, as: SalesManager, captures: { acct_id: $.data.id } }
            - { call: "POST /dealership/repair-orders", payload: { customer_account_id: "${acct_id}", external_vin: "1M8GDM9A6KP042788", concern: "turbo actuator", promised_ready_at: "2026-08-20T17:00:00Z" }, as: ServiceAdvisor, captures: { ro_id: $.data.id } }
            - { call: "POST /dealership/repair-order-lines", payload: { repair_order_id: "${ro_id}", line_type: "LABOR", hours: 1.0, warranty_eligible: true, description: "warranty labor" }, as: ServiceAdvisor }
            - { call: "POST /dealership/repair-orders/${ro_id}/submit-estimate", payload: {}, as: ServiceAdvisor }
            - { call: "POST /dealership/repair-orders/${ro_id}/approve-estimate", payload: {}, as: FleetCustomer, as_user_id: "${acct_id}" }
            - { call: "POST /dealership/service-bays", payload: { bay_code: "B9", bay_type: "STANDARD" }, as: ServiceManager, captures: { bay_id: $.data.id } }
            - { call: "POST /dealership/service-bookings", payload: { repair_order_id: "${ro_id}", service_bay_id: "${bay_id}", start_at: "2026-08-05T09:00:00Z", end_at: "2026-08-05T11:00:00Z" }, as: ServiceAdvisor, captures: { bk_id: $.data.id } }
            - { call: "POST /dealership/service-bookings/${bk_id}/check-in", payload: {}, as: ServiceAdvisor }
            - { call: "POST /dealership/repair-orders/${ro_id}/start-work", payload: {}, as: ServiceAdvisor }
            - { call: "POST /dealership/repair-orders/${ro_id}/complete-work", payload: {}, as: ServiceAdvisor }
            - { call: "POST /dealership/repair-orders/${ro_id}/invoice", payload: {}, as: ServiceManager }
            - { call: "POST /dealership/warranty-claims", payload: { repair_order_id: "${ro_id}", claimed_labor_cents: 16500, claimed_parts_cents: 0 }, as: WarrantyAdministrator, captures: { claim_id: $.data.id } }
            - { call: "POST /dealership/warranty-claims/${claim_id}/submit", payload: {}, as: WarrantyAdministrator, as_user_id: "wadmin-1" }
          trigger:
            - { call: "POST /dealership/warranty-claims/${claim_id}/adjudicate", payload: { outcome: "DENY", denial_reason: "wear item not covered" }, as: OEMClaimsAdjudicator, as_user_id: "oem-9" }
            - { call: "POST /dealership/warranty-claims/${claim_id}/appeal", payload: { appeal_notes: "TSB 23-91 covers actuator" }, as: WarrantyAdministrator, as_user_id: "wadmin-1" }
            - { call: "POST /dealership/warranty-claims/${claim_id}/adjudicate", payload: { outcome: "APPROVE" }, as: OEMClaimsAdjudicator, as_user_id: "oem-9", captures: { st: $.data.status, al: $.data.approved_labor_cents } }
          assert:
            - "after first adjudicate: status == DENIED, approved_labor_cents == 0"
            - "after appeal: status == APPEALED, appeal_count == 1"
            - "after second adjudicate: status == APPROVED, approved_labor_cents == 16500, approved_parts_cents == 0"
            - "RepairOrder.${ro_id}.warranty_covered_cents == 16500 and customer_due_cents == 825 (17325 - 16500)"
            - "CustomerAccount.${acct_id}.open_ar_cents == 825 (AR adjusted by the due delta)"
      - name: trade_appraisal_counter_offer_cycle
        grounds:
          - state_machines.TradeAppraisal.OFFERED_to_NEGOTIATING
          - state_machines.TradeAppraisal.NEGOTIATING_to_OFFERED
        distinguishing_aspect: |
          Cyclic machine on TradeAppraisal (third distinct entity): OFFERED ->
          NEGOTIATING (customer counter) -> OFFERED (manager re-offer);
          offer_round increments each offer (1 -> 2) and the MARKET ACV is
          recomputed per round with the new market index (3800000 -> 3876000).
        test_recipe:
          setup:
            - "clock default 2026-08-01; FLEET account; appraisal model_year 2024 (age 2), mileage 100000 (no excess), condition B, base_book 5000000 -> book_estimate 3800000"
            - "first offer: index 10000 -> acv 3800000, allowance 3500000 (OFFERED, round 1)"
          setup_api_calls:
            - { call: "POST /dealership/customer-accounts", payload: { account_name: "CycleFleet", account_type: "FLEET", credit_limit_cents: 50000000 }, as: SalesManager, captures: { acct_id: $.data.id } }
            - { call: "POST /dealership/trade-appraisals", payload: { customer_account_id: "${acct_id}", trade_vin: "3AKJHHDR5LSMW4451", model_year: 2024, mileage: 100000, condition_grade: "B", base_book_value_cents: 5000000 }, as: SalesConsultant, captures: { appr_id: $.data.id } }
            - { call: "POST /dealership/trade-appraisals/${appr_id}/offer", payload: { market_index_bp: 10000, offered_allowance_cents: 3500000 }, as: SalesManager }
          trigger:
            - { call: "POST /dealership/trade-appraisals/${appr_id}/counter", payload: {}, as: FleetCustomer, as_user_id: "${acct_id}" }
            - { call: "POST /dealership/trade-appraisals/${appr_id}/offer", payload: { market_index_bp: 10200, offered_allowance_cents: 3800000 }, as: SalesManager, captures: { st: $.data.status, acv2: $.data.offer_acv_cents, rnd: $.data.offer_round } }
          assert:
            - "after counter: status == NEGOTIATING"
            - "after re-offer: status == OFFERED (cycle closed), offer_round == 2"
            - "offer_acv_cents == 3876000 (round_half_up(3800000 * 1.00 * 1.02)) — ACV recomputed per round"
            - "offered_allowance_cents == 3800000 accepted because 3800000 <= 3876000"

  # ------------------------------------------------------------------
  # Rule 4: transitive cascades from different triggers
  # ------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: adjudication_cascades_to_ro_account_and_credit_posture
        grounds:
          - state_machines.WarrantyClaim.SUBMITTED_to_APPROVED
          - calculations.repair_order_totals
          - entities.CustomerAccount.fields.open_ar_cents
          - entities.CustomerAccount.fields.status
        distinguishing_aspect: |
          Depth-4 chain from the adjudicate trigger: claim APPROVED (link 1)
          mutates RO warranty_covered_cents/customer_due_cents (link 2), which
          adjusts CustomerAccount.open_ar_cents (link 3), which flips the
          account CREDIT_HOLD -> ACTIVE (link 4) — each hop caused by the
          previous one, not by the trigger directly.
        test_recipe:
          setup:
            - "FLEET STANDARD account, credit_limit 100000; RO labor_rate 10000 with one warranty_eligible LABOR line 8.0h = 80000; RO INVOICED: fee 3500 (5% of 80000 = 4000 capped), due 83500, open_ar 83500"
            - "parts sale of one 20000-cent part pushes open_ar to 103500 > 100000 -> account CREDIT_HOLD"
            - "claim claimed 80000/0 submitted by wadmin-1"
          setup_api_calls:
            - { call: "POST /dealership/customer-accounts", payload: { account_name: "CascadeCo", account_type: "FLEET", fleet_tier: "STANDARD", credit_limit_cents: 100000 }, as: SalesManager, captures: { acct_id: $.data.id } }
            - { call: "POST /dealership/repair-orders", payload: { customer_account_id: "${acct_id}", external_vin: "1M8GDM9A6KP042790", concern: "engine warranty", promised_ready_at: "2026-08-20T17:00:00Z", labor_rate_cents: 10000 }, as: ServiceAdvisor, captures: { ro_id: $.data.id } }
            - { call: "POST /dealership/repair-order-lines", payload: { repair_order_id: "${ro_id}", line_type: "LABOR", hours: 8.0, warranty_eligible: true, description: "warranty labor block" }, as: ServiceAdvisor }
            - { call: "POST /dealership/repair-orders/${ro_id}/submit-estimate", payload: {}, as: ServiceAdvisor }
            - { call: "POST /dealership/repair-orders/${ro_id}/approve-estimate", payload: {}, as: FleetCustomer, as_user_id: "${acct_id}" }
            - { call: "POST /dealership/service-bays", payload: { bay_code: "B2", bay_type: "STANDARD" }, as: ServiceManager, captures: { bay_id: $.data.id } }
            - { call: "POST /dealership/service-bookings", payload: { repair_order_id: "${ro_id}", service_bay_id: "${bay_id}", start_at: "2026-08-05T09:00:00Z", end_at: "2026-08-05T11:00:00Z" }, as: ServiceAdvisor, captures: { bk_id: $.data.id } }
            - { call: "POST /dealership/service-bookings/${bk_id}/check-in", payload: {}, as: ServiceAdvisor }
            - { call: "POST /dealership/repair-orders/${ro_id}/start-work", payload: {}, as: ServiceAdvisor }
            - { call: "POST /dealership/repair-orders/${ro_id}/complete-work", payload: {}, as: ServiceAdvisor }
            - { call: "POST /dealership/repair-orders/${ro_id}/invoice", payload: {}, as: ServiceManager, captures: { due0: $.data.customer_due_cents } }
            - { call: "POST /dealership/parts", payload: { sku: "TURBO-1", part_name: "Turbo", list_price_cents: 20000, cost_cents: 12000, on_hand: 5 }, as: PartsCounterRep, captures: { part_id: $.data.id } }
            - { call: "POST /dealership/parts-sales", payload: { customer_account_id: "${acct_id}", lines: [ { part_id: "${part_id}", quantity: 1 } ] }, as: PartsCounterRep }
            - { call: "GET /dealership/customer-accounts/${acct_id}", payload: {}, as: Controller, captures: { hold_check: $.data.status } }
            - { call: "POST /dealership/warranty-claims", payload: { repair_order_id: "${ro_id}", claimed_labor_cents: 80000, claimed_parts_cents: 0 }, as: WarrantyAdministrator, captures: { claim_id: $.data.id } }
            - { call: "POST /dealership/warranty-claims/${claim_id}/submit", payload: {}, as: WarrantyAdministrator, as_user_id: "wadmin-1" }
          trigger:
            - { call: "POST /dealership/warranty-claims/${claim_id}/adjudicate", payload: { outcome: "APPROVE" }, as: OEMClaimsAdjudicator, as_user_id: "oem-9", captures: { st: $.data.status } }
            - { call: "GET /dealership/repair-orders/${ro_id}", payload: {}, as: Controller, captures: { covered: $.data.warranty_covered_cents, due1: $.data.customer_due_cents } }
            - { call: "GET /dealership/customer-accounts/${acct_id}", payload: {}, as: Controller, captures: { ar1: $.data.open_ar_cents, st1: $.data.status } }
          assert:
            - "pre-trigger: RepairOrder.customer_due_cents == 83500 and account.status == CREDIT_HOLD (open_ar 103500 > 100000)"
            - "claim.status == APPROVED (link 1)"
            - "RepairOrder.warranty_covered_cents == 80000 and customer_due_cents == 3500 (link 2: 83500 - 80000)"
            - "CustomerAccount.open_ar_cents == 23500 (link 3: 103500 - 80000)"
            - "CustomerAccount.status == ACTIVE (link 4: 23500 <= 100000 clears the hold)"
      - name: committed_order_cancel_releases_slot_and_reopens_pool
        grounds:
          - state_machines.FactoryOrder.COMMITTED_to_CANCELLED
          - state_machines.FactoryBuildSlot.LOCKED_to_OPEN
          - entities.FactoryBuildSlot.fields.committed_count
        distinguishing_aspect: |
          Depth-3 chain from the cancel trigger (different trigger from
          adjudicate): order COMMITTED -> CANCELLED (link 1) decrements
          pool.committed_count (link 2), whose counter change flips the pool
          posture LOCKED -> OPEN (link 3); the 2% cancellation fee separately
          lands on the customer's open_ar.
        test_recipe:
          setup:
            - "pool 2026-08 STANDARD capacity 2; FLEET customer credit 10000000000"
            - "o1 committed (prior 0); o2 committed (prior 1 -> still tier 0 -> committed_total 10085000); pool committed_count 2, slots_available 0, status LOCKED"
          setup_api_calls:
            - { call: "POST /dealership/customer-accounts", payload: { account_name: "CancelCo", account_type: "FLEET", credit_limit_cents: 10000000000 }, as: SalesManager, captures: { acct_id: $.data.id } }
            - { call: "POST /dealership/factory-build-slots", payload: { build_month: "2026-08", vocation_group: "STANDARD", capacity: 2 }, as: SalesManager, captures: { slot_id: $.data.id } }
            - { call: "POST /dealership/factory-orders", payload: { factory_build_slot_id: "${slot_id}", customer_account_id: "${acct_id}", chassis_model: "M2_106", engine_option: "DD13", axle_config: "A4X2" }, as: SalesConsultant, captures: { o1: $.data.id } }
            - { call: "POST /dealership/factory-orders/${o1}/commit", payload: {}, as: SalesConsultant }
            - { call: "POST /dealership/factory-orders", payload: { factory_build_slot_id: "${slot_id}", customer_account_id: "${acct_id}", chassis_model: "M2_106", engine_option: "DD13", axle_config: "A4X2" }, as: SalesConsultant, captures: { o2: $.data.id } }
            - { call: "POST /dealership/factory-orders/${o2}/commit", payload: {}, as: SalesConsultant }
            - { call: "GET /dealership/factory-build-slots/${slot_id}", payload: {}, as: SalesManager, captures: { pre_status: $.data.status } }
          trigger:
            - { call: "POST /dealership/factory-orders/${o2}/cancel", payload: {}, as: SalesConsultant, captures: { st: $.data.status } }
            - { call: "GET /dealership/factory-build-slots/${slot_id}", payload: {}, as: SalesManager, captures: { post_status: $.data.status, post_committed: $.data.committed_count, post_avail: $.data.slots_available } }
            - { call: "GET /dealership/customer-accounts/${acct_id}", payload: {}, as: SalesManager, captures: { ar: $.data.open_ar_cents } }
          assert:
            - "pre-cancel: pool status == LOCKED with committed_count == 2, slots_available == 0"
            - "order ${o2}.status == CANCELLED (link 1)"
            - "pool committed_count == 1 and slots_available == 1 (link 2)"
            - "pool status == OPEN (link 3: counter drop reopened the pool before month close)"
            - "CustomerAccount.open_ar_cents == 201700 (round_half_up(10085000 * 0.02) cancellation fee)"

  # ------------------------------------------------------------------
  # Rule 5: validation priority conflicts on different category pairs
  # ------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: sell_rejected_state_error_outranks_credit_hold_fiscal
        grounds:
          - validations[priority=7]
          - validations[priority=20]
          - state_machines.Unit.READY_to_SOLD
        distinguishing_aspect: |
          Category pair state vs business_fiscal: the sell request violates
          both (unit IN_STOCK, never inspected -> ERR_UNIT_NOT_SELLABLE at
          priority 7; buyer on CREDIT_HOLD -> ERR_ACCOUNT_ON_CREDIT_HOLD at
          priority 20). The state error must win.
        test_recipe:
          setup:
            - "NEW unit received and IN_STOCK (inspect never called)"
            - "buyer FLEET account patched to CREDIT_HOLD via OCC PATCH"
          setup_api_calls:
            - { call: "POST /dealership/factory-build-slots", payload: { build_month: "2026-08", vocation_group: "STANDARD", capacity: 5 }, as: SalesManager, captures: { slot_id: $.data.id } }
            - { call: "POST /dealership/factory-orders", payload: { factory_build_slot_id: "${slot_id}", chassis_model: "M2_106", engine_option: "DD13", axle_config: "A4X2" }, as: SalesConsultant, captures: { order_id: $.data.id } }
            - { call: "POST /dealership/factory-orders/${order_id}/commit", payload: {}, as: SalesConsultant }
            - { call: "POST /dealership/ops/run-daily-sweep", payload: {}, as: DealershipAdmin }
            - { call: "POST /dealership/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: DealershipAdmin }
            - { call: "POST /dealership/ops/run-daily-sweep", payload: {}, as: DealershipAdmin }
            - { call: "POST /dealership/factory-orders/${order_id}/receive", payload: { vin: "1FUJGBDV1CLW88322" }, as: SalesManager, captures: { unit_id: $.data.received_unit_id } }
            - { call: "POST /dealership/customer-accounts", payload: { account_name: "HoldCo", account_type: "FLEET", credit_limit_cents: 50000 }, as: SalesManager, captures: { buyer_id: $.data.id, buyer_v: $.data.version } }
            - { call: "PATCH /dealership/customer-accounts/${buyer_id}", payload: { status: "CREDIT_HOLD", expected_customer_account_version: "${buyer_v}" }, as: SalesManager }
          trigger:
            - { call: "POST /dealership/units/${unit_id}/sell", payload: { customer_account_id: "${buyer_id}", sale_price_cents: 12000000 }, as: SalesConsultant, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNIT_NOT_SELLABLE (state, priority 7) — NOT ERR_ACCOUNT_ON_CREDIT_HOLD (fiscal, priority 20)"
            - "Unit.${unit_id}.status still == IN_STOCK; no FloorPlanEntry PAYOFF was posted"
      - name: booking_constraint_error_outranks_overlap_temporal
        grounds:
          - validations[priority=12]
          - validations[priority=16]
          - calculations.booking_overlap_check
        distinguishing_aspect: |
          Category pair business_constraint vs business_temporal (different
          pair from state/fiscal): the new bay booking both ends after
          close_hour (constraint, priority 12) and overlaps an existing booking
          (temporal, priority 16); ERR_BAY_OUTSIDE_OPERATING_HOURS must win
          over ERR_BAY_BOOKING_OVERLAP.
        test_recipe:
          setup:
            - "RETAIL account; RO1 and RO2; bay B1 open 7 close 19"
            - "existing booking on the bay 2026-08-05 17:00-19:00 (end exactly at close is legal)"
          setup_api_calls:
            - { call: "POST /dealership/customer-accounts", payload: { account_name: "RetailTwo", account_type: "RETAIL" }, as: SalesManager, captures: { acct_id: $.data.id } }
            - { call: "POST /dealership/repair-orders", payload: { customer_account_id: "${acct_id}", external_vin: "1M8GDM9A6KP042791", concern: "ro1", promised_ready_at: "2026-08-20T17:00:00Z" }, as: ServiceAdvisor, captures: { ro1: $.data.id } }
            - { call: "POST /dealership/repair-orders", payload: { customer_account_id: "${acct_id}", external_vin: "1M8GDM9A6KP042792", concern: "ro2", promised_ready_at: "2026-08-20T17:00:00Z" }, as: ServiceAdvisor, captures: { ro2: $.data.id } }
            - { call: "POST /dealership/service-bays", payload: { bay_code: "B1", bay_type: "STANDARD" }, as: ServiceManager, captures: { bay_id: $.data.id } }
            - { call: "POST /dealership/service-bookings", payload: { repair_order_id: "${ro1}", service_bay_id: "${bay_id}", start_at: "2026-08-05T17:00:00Z", end_at: "2026-08-05T19:00:00Z" }, as: ServiceAdvisor, captures: { bk1: $.data.id } }
          trigger:
            - { call: "POST /dealership/service-bookings", payload: { repair_order_id: "${ro2}", service_bay_id: "${bay_id}", start_at: "2026-08-05T18:30:00Z", end_at: "2026-08-05T20:30:00Z" }, as: ServiceAdvisor, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_BAY_OUTSIDE_OPERATING_HOURS (constraint, priority 12) — NOT ERR_BAY_BOOKING_OVERLAP (temporal, priority 16)"
            - "exactly one booking exists on the bay (the 17:00-19:00 one)"

  # ------------------------------------------------------------------
  # Rule 6: boundary precision on different metrics / endpoints
  # ------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: aging_bucket_day_90_vs_day_91_boundary
        grounds:
          - calculations.aging_and_curtailment
          - entities.Unit.fields.aging_bucket
        distinguishing_aspect: |
          Metric = days_in_stock integer threshold. Day 90 keeps B0_90 and
          curtailment 0; day 91 flips to B91_180. Exercised through the sweep
          endpoint (ops-run), not through a formula read.
        test_recipe:
          setup:
            - "NEW unit received at clock 2026-08-15 (stocking_date 2026-08-15), IN_STOCK"
          setup_api_calls:
            - { call: "POST /dealership/factory-build-slots", payload: { build_month: "2026-08", vocation_group: "STANDARD", capacity: 5 }, as: SalesManager, captures: { slot_id: $.data.id } }
            - { call: "POST /dealership/factory-orders", payload: { factory_build_slot_id: "${slot_id}", chassis_model: "M2_106", engine_option: "DD13", axle_config: "A4X2" }, as: SalesConsultant, captures: { order_id: $.data.id } }
            - { call: "POST /dealership/factory-orders/${order_id}/commit", payload: {}, as: SalesConsultant }
            - { call: "POST /dealership/ops/run-daily-sweep", payload: {}, as: DealershipAdmin }
            - { call: "POST /dealership/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: DealershipAdmin }
            - { call: "POST /dealership/ops/run-daily-sweep", payload: {}, as: DealershipAdmin }
            - { call: "POST /dealership/factory-orders/${order_id}/receive", payload: { vin: "1FUJGBDV1CLW88323" }, as: SalesManager, captures: { unit_id: $.data.received_unit_id } }
          trigger:
            - { call: "POST /dealership/_clock/set_current_utc", payload: { to_iso8601: "2026-11-13T00:00:00Z" }, as: DealershipAdmin }
            - { call: "POST /dealership/ops/run-daily-sweep", payload: {}, as: DealershipAdmin }
            - { call: "GET /dealership/units/${unit_id}", payload: {}, as: Controller, captures: { d90: $.data.days_in_stock, b90: $.data.aging_bucket } }
            - { call: "POST /dealership/_clock/set_current_utc", payload: { to_iso8601: "2026-11-14T00:00:00Z" }, as: DealershipAdmin }
            - { call: "POST /dealership/ops/run-daily-sweep", payload: {}, as: DealershipAdmin }
            - { call: "GET /dealership/units/${unit_id}", payload: {}, as: Controller, captures: { d91: $.data.days_in_stock, b91: $.data.aging_bucket } }
          assert:
            - "at 2026-11-13: days_in_stock == 90 and aging_bucket == B0_90 and curtailment_due_cents == 0"
            - "at 2026-11-14: days_in_stock == 91 and aging_bucket == B91_180"
            - "boundary is days <= 90 -> B0_90; the >= side starts at 91 (not 90)"
      - name: slot_pool_exhaustion_at_exact_zero_available
        grounds:
          - validations[priority=18]
          - entities.FactoryBuildSlot.fields.slots_available
        distinguishing_aspect: |
          Metric = slot availability count hitting exactly zero (different
          metric from days; different endpoint: POST /dealership/factory-orders,
          not the sweep). With capacity 1 the first hold consumes the last slot
          (succeeds, pool -> LOCKED); the next hold fails.
        test_recipe:
          setup:
            - "pool 2026-08 STANDARD capacity 1"
            - "first order holds the only slot"
          setup_api_calls:
            - { call: "POST /dealership/factory-build-slots", payload: { build_month: "2026-08", vocation_group: "STANDARD", capacity: 1 }, as: SalesManager, captures: { slot_id: $.data.id } }
            - { call: "POST /dealership/factory-orders", payload: { factory_build_slot_id: "${slot_id}", chassis_model: "M2_106", engine_option: "DD13", axle_config: "A4X2" }, as: SalesConsultant, captures: { o1: $.data.id } }
          trigger:
            - { call: "GET /dealership/factory-build-slots/${slot_id}", payload: {}, as: SalesManager, captures: { avail: $.data.slots_available, pstat: $.data.status } }
            - { call: "POST /dealership/factory-orders", payload: { factory_build_slot_id: "${slot_id}", chassis_model: "SD_114", engine_option: "DD15", axle_config: "A6X4" }, as: SalesConsultant, captures: { err: $.data.error_id } }
          assert:
            - "after first hold: slots_available == 0 and status == LOCKED"
            - "second hold rejected: error_id == ERR_SLOT_POOL_EXHAUSTED"
            - "pool counters unchanged after rejection: held_count == 1, committed_count == 0"
      - name: downtime_grace_boundary_exactly_120_minutes
        grounds:
          - calculations.downtime_penalty
          - state_machines.RepairOrder.work_IN_PROGRESS_to_work_COMPLETED
        distinguishing_aspect: |
          Metric = late minutes vs GRACE_MINUTES (different metric from days and
          from counts; endpoint = complete-work). Exactly 120 minutes late ->
          penalty 0; the penalty formula engages at minute 121 (corner design
          covers the 121-minute side with a 69-cent penalty).
        test_recipe:
          setup:
            - "RETAIL account; RO approved with one LABOR line 2.0h x 16500 = 33000, promised 2026-08-10T17:00:00Z"
            - "bay booking 2026-08-10 09:00-11:00 checked in; work started at 2026-08-10T09:00:00Z"
          setup_api_calls:
            - { call: "POST /dealership/customer-accounts", payload: { account_name: "GraceCo", account_type: "RETAIL" }, as: SalesManager, captures: { acct_id: $.data.id } }
            - { call: "POST /dealership/repair-orders", payload: { customer_account_id: "${acct_id}", external_vin: "1M8GDM9A6KP042793", concern: "pm service", promised_ready_at: "2026-08-10T17:00:00Z" }, as: ServiceAdvisor, captures: { ro_id: $.data.id } }
            - { call: "POST /dealership/repair-order-lines", payload: { repair_order_id: "${ro_id}", line_type: "LABOR", hours: 2.0, description: "pm labor" }, as: ServiceAdvisor }
            - { call: "POST /dealership/repair-orders/${ro_id}/submit-estimate", payload: {}, as: ServiceAdvisor }
            - { call: "POST /dealership/repair-orders/${ro_id}/approve-estimate", payload: {}, as: FleetCustomer, as_user_id: "${acct_id}" }
            - { call: "POST /dealership/service-bays", payload: { bay_code: "B3", bay_type: "STANDARD" }, as: ServiceManager, captures: { bay_id: $.data.id } }
            - { call: "POST /dealership/service-bookings", payload: { repair_order_id: "${ro_id}", service_bay_id: "${bay_id}", start_at: "2026-08-10T09:00:00Z", end_at: "2026-08-10T11:00:00Z" }, as: ServiceAdvisor, captures: { bk_id: $.data.id } }
            - { call: "POST /dealership/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:00:00Z" }, as: DealershipAdmin }
            - { call: "POST /dealership/service-bookings/${bk_id}/check-in", payload: {}, as: ServiceAdvisor }
            - { call: "POST /dealership/repair-orders/${ro_id}/start-work", payload: {}, as: ServiceAdvisor }
          trigger:
            - { call: "POST /dealership/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T19:00:00Z" }, as: DealershipAdmin }
            - { call: "POST /dealership/repair-orders/${ro_id}/complete-work", payload: {}, as: ServiceAdvisor, captures: { pen: $.data.downtime_penalty_cents } }
          assert:
            - "completed_at == 2026-08-10T19:00:00Z -> late_minutes == 120 == GRACE_MINUTES -> downtime_penalty_cents == 0"
            - "work_status == COMPLETED and booking ${bk_id} -> COMPLETED"

  # ------------------------------------------------------------------
  # Rule 7: cross-entity state dependencies on different entity pairs
  # ------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: start_work_requires_checked_in_booking
        grounds:
          - state_machines.RepairOrder.work_OPEN_|_SCHEDULED_to_work_IN_PROGRESS
          - validations[priority=19]
        distinguishing_aspect: |
          Entity pair RepairOrder -> ServiceBooking: start-work is rejected
          while the RO's only booking is BOOKED, and succeeds after the booking
          flips to CHECKED_IN — the RO's own auth/work dimensions alone are not
          sufficient.
        test_recipe:
          setup:
            - "RETAIL account; RO with one LABOR line; estimate submitted and APPROVED"
            - "bay booking 2026-08-05 09:00-11:00 in BOOKED (RO auto-promoted OPEN -> SCHEDULED)"
          setup_api_calls:
            - { call: "POST /dealership/customer-accounts", payload: { account_name: "XDep1", account_type: "RETAIL" }, as: SalesManager, captures: { acct_id: $.data.id } }
            - { call: "POST /dealership/repair-orders", payload: { customer_account_id: "${acct_id}", external_vin: "1M8GDM9A6KP042794", concern: "x", promised_ready_at: "2026-08-20T17:00:00Z" }, as: ServiceAdvisor, captures: { ro_id: $.data.id } }
            - { call: "POST /dealership/repair-order-lines", payload: { repair_order_id: "${ro_id}", line_type: "LABOR", hours: 1.0, description: "diag" }, as: ServiceAdvisor }
            - { call: "POST /dealership/repair-orders/${ro_id}/submit-estimate", payload: {}, as: ServiceAdvisor }
            - { call: "POST /dealership/repair-orders/${ro_id}/approve-estimate", payload: {}, as: FleetCustomer, as_user_id: "${acct_id}" }
            - { call: "POST /dealership/service-bays", payload: { bay_code: "B4", bay_type: "STANDARD" }, as: ServiceManager, captures: { bay_id: $.data.id } }
            - { call: "POST /dealership/service-bookings", payload: { repair_order_id: "${ro_id}", service_bay_id: "${bay_id}", start_at: "2026-08-05T09:00:00Z", end_at: "2026-08-05T11:00:00Z" }, as: ServiceAdvisor, captures: { bk_id: $.data.id } }
          trigger:
            - { call: "POST /dealership/repair-orders/${ro_id}/start-work", payload: {}, as: ServiceAdvisor, captures: { err: $.data.error_id } }
            - { call: "POST /dealership/service-bookings/${bk_id}/check-in", payload: {}, as: ServiceAdvisor }
            - { call: "POST /dealership/repair-orders/${ro_id}/start-work", payload: {}, as: ServiceAdvisor, captures: { ws: $.data.work_status } }
          assert:
            - "booking creation moved RO work_status OPEN -> SCHEDULED"
            - "first start-work: error_id == ERR_BOOKING_NOT_CHECKED_IN (booking still BOOKED)"
            - "after check-in: start-work succeeds, work_status == IN_PROGRESS"
      - name: sell_requires_accepted_trade_appraisal
        grounds:
          - state_machines.Unit.READY_to_SOLD
          - validations[priority=19]
        distinguishing_aspect: |
          Entity pair Unit -> TradeAppraisal (different pair from RO->Booking):
          sell referencing an OFFERED (not yet ACCEPTED) appraisal fails with
          ERR_APPRAISAL_STATE even though the unit itself is READY and the
          buyer ACTIVE.
        test_recipe:
          setup:
            - "NEW unit READY (full order-receive-inspect chain)"
            - "buyer FLEET account ACTIVE; buyer's appraisal in OFFERED (offer made, customer has not answered)"
          setup_api_calls:
            - { call: "POST /dealership/factory-build-slots", payload: { build_month: "2026-08", vocation_group: "STANDARD", capacity: 5 }, as: SalesManager, captures: { slot_id: $.data.id } }
            - { call: "POST /dealership/factory-orders", payload: { factory_build_slot_id: "${slot_id}", chassis_model: "M2_106", engine_option: "DD13", axle_config: "A4X2" }, as: SalesConsultant, captures: { order_id: $.data.id } }
            - { call: "POST /dealership/factory-orders/${order_id}/commit", payload: {}, as: SalesConsultant }
            - { call: "POST /dealership/ops/run-daily-sweep", payload: {}, as: DealershipAdmin }
            - { call: "POST /dealership/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: DealershipAdmin }
            - { call: "POST /dealership/ops/run-daily-sweep", payload: {}, as: DealershipAdmin }
            - { call: "POST /dealership/factory-orders/${order_id}/receive", payload: { vin: "1FUJGBDV1CLW88324" }, as: SalesManager, captures: { unit_id: $.data.received_unit_id } }
            - { call: "POST /dealership/units/${unit_id}/inspect", payload: { outcome: "PASS" }, as: ServiceManager }
            - { call: "POST /dealership/customer-accounts", payload: { account_name: "BuyerCo", account_type: "FLEET", credit_limit_cents: 50000000 }, as: SalesManager, captures: { buyer_id: $.data.id } }
            - { call: "POST /dealership/trade-appraisals", payload: { customer_account_id: "${buyer_id}", trade_vin: "3AKJHHDR5LSMW4452", model_year: 2023, mileage: 120000, condition_grade: "B", base_book_value_cents: 6000000 }, as: SalesConsultant, captures: { appr_id: $.data.id } }
            - { call: "POST /dealership/trade-appraisals/${appr_id}/offer", payload: { market_index_bp: 10000, offered_allowance_cents: 3800000 }, as: SalesManager }
          trigger:
            - { call: "POST /dealership/units/${unit_id}/sell", payload: { customer_account_id: "${buyer_id}", sale_price_cents: 12000000, trade_appraisal_id: "${appr_id}" }, as: SalesConsultant, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_APPRAISAL_STATE (appraisal is OFFERED, not ACCEPTED)"
            - "Unit.${unit_id}.status still == READY; appraisal still OFFERED (no CONSUMED side effect)"
      - name: claim_submit_requires_invoiced_ro
        grounds:
          - state_machines.WarrantyClaim.DRAFT_to_SUBMITTED
          - validations[priority=19]
        distinguishing_aspect: |
          Entity pair WarrantyClaim -> RepairOrder (third distinct pair):
          submit on a claim whose RO is COMPLETED but not yet INVOICED fails
          with ERR_RO_STATE; after invoice the same submit succeeds.
        test_recipe:
          setup:
            - "RETAIL account; RO with one warranty_eligible LABOR line 1.0h = 16500; work COMPLETED but NOT invoiced"
            - "claim claimed 16500/0 exists in DRAFT"
          setup_api_calls:
            - { call: "POST /dealership/customer-accounts", payload: { account_name: "XDep3", account_type: "RETAIL" }, as: SalesManager, captures: { acct_id: $.data.id } }
            - { call: "POST /dealership/repair-orders", payload: { customer_account_id: "${acct_id}", external_vin: "1M8GDM9A6KP042795", concern: "x", promised_ready_at: "2026-08-20T17:00:00Z" }, as: ServiceAdvisor, captures: { ro_id: $.data.id } }
            - { call: "POST /dealership/repair-order-lines", payload: { repair_order_id: "${ro_id}", line_type: "LABOR", hours: 1.0, warranty_eligible: true, description: "w labor" }, as: ServiceAdvisor }
            - { call: "POST /dealership/repair-orders/${ro_id}/submit-estimate", payload: {}, as: ServiceAdvisor }
            - { call: "POST /dealership/repair-orders/${ro_id}/approve-estimate", payload: {}, as: FleetCustomer, as_user_id: "${acct_id}" }
            - { call: "POST /dealership/service-bays", payload: { bay_code: "B5", bay_type: "STANDARD" }, as: ServiceManager, captures: { bay_id: $.data.id } }
            - { call: "POST /dealership/service-bookings", payload: { repair_order_id: "${ro_id}", service_bay_id: "${bay_id}", start_at: "2026-08-05T09:00:00Z", end_at: "2026-08-05T11:00:00Z" }, as: ServiceAdvisor, captures: { bk_id: $.data.id } }
            - { call: "POST /dealership/service-bookings/${bk_id}/check-in", payload: {}, as: ServiceAdvisor }
            - { call: "POST /dealership/repair-orders/${ro_id}/start-work", payload: {}, as: ServiceAdvisor }
            - { call: "POST /dealership/repair-orders/${ro_id}/complete-work", payload: {}, as: ServiceAdvisor }
            - { call: "POST /dealership/warranty-claims", payload: { repair_order_id: "${ro_id}", claimed_labor_cents: 16500, claimed_parts_cents: 0 }, as: WarrantyAdministrator, captures: { claim_id: $.data.id } }
          trigger:
            - { call: "POST /dealership/warranty-claims/${claim_id}/submit", payload: {}, as: WarrantyAdministrator, as_user_id: "wadmin-1", captures: { err: $.data.error_id } }
            - { call: "POST /dealership/repair-orders/${ro_id}/invoice", payload: {}, as: ServiceManager }
            - { call: "POST /dealership/warranty-claims/${claim_id}/submit", payload: {}, as: WarrantyAdministrator, as_user_id: "wadmin-1", captures: { st: $.data.status } }
          assert:
            - "first submit: error_id == ERR_RO_STATE (RO COMPLETED, not INVOICED); claim stays DRAFT"
            - "after invoice: submit succeeds, claim status == SUBMITTED, submitted_by_user_id == wadmin-1"

  # ------------------------------------------------------------------
  # Rule 8: resource temporal-overlap with different interval semantics
  # ------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: bay_bookings_half_open_adjacency_allowed
        grounds:
          - calculations.booking_overlap_check
          - validations[priority=16]
        distinguishing_aspect: |
          Resource = ServiceBay with HALF-OPEN [start, end) semantics:
          back-to-back (new.start == existing.end) is legal, while a one-minute
          setback into the existing window conflicts. Different semantics and
          resource from the mobile instance.
        test_recipe:
          setup:
            - "RETAIL account; RO; bay open 7-19; existing booking 09:00-11:00"
          setup_api_calls:
            - { call: "POST /dealership/customer-accounts", payload: { account_name: "BayCo", account_type: "RETAIL" }, as: SalesManager, captures: { acct_id: $.data.id } }
            - { call: "POST /dealership/repair-orders", payload: { customer_account_id: "${acct_id}", external_vin: "1M8GDM9A6KP042796", concern: "x", promised_ready_at: "2026-08-20T17:00:00Z" }, as: ServiceAdvisor, captures: { ro_id: $.data.id } }
            - { call: "POST /dealership/service-bays", payload: { bay_code: "B6", bay_type: "STANDARD" }, as: ServiceManager, captures: { bay_id: $.data.id } }
            - { call: "POST /dealership/service-bookings", payload: { repair_order_id: "${ro_id}", service_bay_id: "${bay_id}", start_at: "2026-08-05T09:00:00Z", end_at: "2026-08-05T11:00:00Z" }, as: ServiceAdvisor, captures: { bk1: $.data.id } }
          trigger:
            - { call: "POST /dealership/service-bookings", payload: { repair_order_id: "${ro_id}", service_bay_id: "${bay_id}", start_at: "2026-08-05T11:00:00Z", end_at: "2026-08-05T13:00:00Z" }, as: ServiceAdvisor, captures: { bk2: $.data.id } }
            - { call: "POST /dealership/service-bookings", payload: { repair_order_id: "${ro_id}", service_bay_id: "${bay_id}", start_at: "2026-08-05T10:30:00Z", end_at: "2026-08-05T12:00:00Z" }, as: ServiceAdvisor, captures: { err: $.data.error_id } }
          assert:
            - "11:00-13:00 booking CREATED (adjacent at 11:00 — half-open intervals touch without overlap)"
            - "10:30-12:00 booking rejected: error_id == ERR_BAY_BOOKING_OVERLAP"
            - "bay ends up with exactly 2 bookings in BOOKED"
      - name: mobile_bookings_closed_interval_buffer_touch_conflicts
        grounds:
          - calculations.booking_overlap_check
          - validations[priority=16]
        distinguishing_aspect: |
          Resource = MobileServiceUnit with CLOSED, travel-buffer-expanded
          intervals [start - travel, end + travel]: an exact buffer touch
          (new effective start == existing effective end) IS a conflict,
          unlike the bay's half-open adjacency; one more minute clears it.
        test_recipe:
          setup:
            - "RETAIL account; RO; mobile unit; existing booking 09:00-11:00 with travel 30 -> effective [08:30, 11:30]"
          setup_api_calls:
            - { call: "POST /dealership/customer-accounts", payload: { account_name: "MobCo", account_type: "RETAIL" }, as: SalesManager, captures: { acct_id: $.data.id } }
            - { call: "POST /dealership/repair-orders", payload: { customer_account_id: "${acct_id}", external_vin: "1M8GDM9A6KP042797", concern: "road call", promised_ready_at: "2026-08-20T17:00:00Z" }, as: ServiceAdvisor, captures: { ro_id: $.data.id } }
            - { call: "POST /dealership/mobile-service-units", payload: { unit_code: "MSU-7", default_travel_minutes: 30 }, as: ServiceManager, captures: { msu_id: $.data.id } }
            - { call: "POST /dealership/service-bookings", payload: { repair_order_id: "${ro_id}", mobile_service_unit_id: "${msu_id}", start_at: "2026-08-05T09:00:00Z", end_at: "2026-08-05T11:00:00Z", travel_minutes: 30 }, as: ServiceAdvisor, captures: { bk1: $.data.id } }
          trigger:
            - { call: "POST /dealership/service-bookings", payload: { repair_order_id: "${ro_id}", mobile_service_unit_id: "${msu_id}", start_at: "2026-08-05T11:30:00Z", end_at: "2026-08-05T13:30:00Z", travel_minutes: 30 }, as: ServiceAdvisor, captures: { err: $.data.error_id } }
            - { call: "POST /dealership/service-bookings", payload: { repair_order_id: "${ro_id}", mobile_service_unit_id: "${msu_id}", start_at: "2026-08-05T12:01:00Z", end_at: "2026-08-05T13:00:00Z", travel_minutes: 30 }, as: ServiceAdvisor, captures: { bk3: $.data.id } }
          assert:
            - "11:30 booking rejected: error_id == ERR_MOBILE_BOOKING_OVERLAP (its effective start 11:00 <= existing effective end 11:30 — closed-interval touch conflicts)"
            - "12:01 booking CREATED (effective [11:31, 13:30] vs [08:30, 11:30]: 11:31 > 11:30 clears by one minute)"
            - "mobile unit ends with exactly 2 bookings in BOOKED"

  # ------------------------------------------------------------------
  # Rule 9: compensating-action invariants on different conserved quantities
  # ------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: slot_hold_then_cancel_conserves_availability
        grounds:
          - state_machines.FactoryOrder.SLOT_HELD_to_CANCELLED
          - entities.FactoryBuildSlot.fields.slots_available
        distinguishing_aspect: |
          Conserved quantity = slot availability count: slots_available ==
          capacity - held_count - committed_count must be identical before the
          hold and after the compensating cancel (3 -> 2 -> 3), with no drift
          in any counter.
        test_recipe:
          setup:
            - "pool 2026-08 STANDARD capacity 3, initially slots_available == 3"
          setup_api_calls:
            - { call: "POST /dealership/factory-build-slots", payload: { build_month: "2026-08", vocation_group: "STANDARD", capacity: 3 }, as: SalesManager, captures: { slot_id: $.data.id } }
            - { call: "GET /dealership/factory-build-slots/${slot_id}", payload: {}, as: SalesManager, captures: { avail0: $.data.slots_available } }
          trigger:
            - { call: "POST /dealership/factory-orders", payload: { factory_build_slot_id: "${slot_id}", chassis_model: "M2_106", engine_option: "DD13", axle_config: "A4X2" }, as: SalesConsultant, captures: { o1: $.data.id } }
            - { call: "POST /dealership/factory-orders/${o1}/cancel", payload: {}, as: SalesConsultant }
            - { call: "GET /dealership/factory-build-slots/${slot_id}", payload: {}, as: SalesManager, captures: { avail1: $.data.slots_available, held1: $.data.held_count, comm1: $.data.committed_count } }
          assert:
            - "initial slots_available == 3"
            - "after hold+cancel: slots_available == 3 AND held_count == 0 AND committed_count == 0 (invariant: capacity - held - committed conserved)"
            - "pool status == OPEN throughout (never drifted to LOCKED after compensation)"
      - name: floorplan_adjustment_pair_conserves_ledger_balance
        grounds:
          - concurrency_rules[unit-adjustment-stale-version]
          - entities.Unit.fields.floorplan_balance_cents
          - entities.FloorPlanEntry.fields.resulting_balance_cents
        distinguishing_aspect: |
          Conserved quantity = floor-plan ledger cents (different quantity type
          from slot counts): an ADJUSTMENT of +50000 followed by its
          compensating ADJUSTMENT of -50000 must return
          floorplan_balance_cents to exactly the post-ADVANCE value 10085000,
          and the invariant balance == sum(entry amounts) holds at every step.
        test_recipe:
          setup:
            - "NEW unit READY via full order chain; invoice 10085000; ADVANCE posted, balance 10085000"
            - "unit version captured from a GET after receive"
          setup_api_calls:
            - { call: "POST /dealership/factory-build-slots", payload: { build_month: "2026-08", vocation_group: "STANDARD", capacity: 5 }, as: SalesManager, captures: { slot_id: $.data.id } }
            - { call: "POST /dealership/factory-orders", payload: { factory_build_slot_id: "${slot_id}", chassis_model: "M2_106", engine_option: "DD13", axle_config: "A4X2" }, as: SalesConsultant, captures: { order_id: $.data.id } }
            - { call: "POST /dealership/factory-orders/${order_id}/commit", payload: {}, as: SalesConsultant }
            - { call: "POST /dealership/ops/run-daily-sweep", payload: {}, as: DealershipAdmin }
            - { call: "POST /dealership/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: DealershipAdmin }
            - { call: "POST /dealership/ops/run-daily-sweep", payload: {}, as: DealershipAdmin }
            - { call: "POST /dealership/factory-orders/${order_id}/receive", payload: { vin: "1FUJGBDV1CLW88325" }, as: SalesManager, captures: { unit_id: $.data.received_unit_id } }
            - { call: "POST /dealership/units/${unit_id}/inspect", payload: { outcome: "PASS" }, as: ServiceManager }
            - { call: "GET /dealership/units/${unit_id}", payload: {}, as: Controller, captures: { uv: $.data.version } }
          trigger:
            - { call: "POST /dealership/units/${unit_id}/floor-plan-adjustments", payload: { amount_cents: 50000, expected_unit_version: "${uv}", note: "damage holdback" }, as: Controller, captures: { bal1: $.data.floorplan_balance_cents, uv2: $.data.version } }
            - { call: "POST /dealership/units/${unit_id}/floor-plan-adjustments", payload: { amount_cents: -50000, expected_unit_version: "${uv2}", note: "holdback released" }, as: Controller, captures: { bal2: $.data.floorplan_balance_cents } }
            - { call: "GET /dealership/units/${unit_id}/floor-plan-entries", payload: {}, as: Controller, captures: { last_bal: "$.data[2].resulting_balance_cents" } }
          assert:
            - "after +50000: floorplan_balance_cents == 10135000"
            - "after -50000: floorplan_balance_cents == 10085000 == post-ADVANCE balance (conserved)"
            - "ledger holds 3 entries (ADVANCE, ADJUSTMENT, ADJUSTMENT) and last resulting_balance_cents == 10085000 (10085000 + 50000 - 50000)"
            - "Unit.version advanced by exactly 1 per adjustment (${uv} -> +1 -> +1)"
