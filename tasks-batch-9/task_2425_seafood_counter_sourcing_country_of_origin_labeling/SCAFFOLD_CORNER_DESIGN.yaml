              captures: { counter_id: $.data.id }
            - call: "POST /seafood-ops/suppliers"
              payload: { name: "Gulf Bay Dealers", permit_number: "PERMIT-8801" }
              as: ChainAdmin
              captures: { supplier_id: $.data.id }
            - call: "POST /seafood-ops/species"
              payload: { market_name: "Farmed Tilapia", scientific_name: "Oreochromis niloticus", acceptable_market_names: ["Tilapia", "Farmed Tilapia"], simp_covered: false, high_risk_substitution: true, sustainability_program_eligible: false }
              as: ChainAdmin
              captures: { tilapia_id: $.data.id }
            - call: "POST /seafood-ops/certifications"
              payload: { counter_id: "${counter_id}", supplier_id: "${supplier_id}", species_id: "${tilapia_id}", program_name: "Pond Stewardship Alliance", certificate_number: "PSA-3301", valid_from: "2026-07-01T00:00:00Z", valid_until: "2026-12-01T00:00:00Z", claim_text: "Responsibly farmed tilapia" }
              as: SupplierRep
              as_user_id: "${supplier_id}"
              captures: { cert_a: $.data.id }
            - call: "POST /seafood-ops/certifications"
              payload: { counter_id: "${counter_id}", supplier_id: "${supplier_id}", species_id: "${tilapia_id}", program_name: "Pond Stewardship Alliance", certificate_number: "PSA-3302", valid_from: "2026-07-01T00:00:00Z", valid_until: "2026-12-01T00:00:00Z", claim_text: "Responsibly farmed tilapia" }
              as: SupplierRep
              as_user_id: "${supplier_id}"
              captures: { cert_b: $.data.id }
          trigger:
            - call: "POST /seafood-ops/certifications/${cert_a}/review"
              payload: { decision: "APPROVE", review_note: "certificate is genuine" }
