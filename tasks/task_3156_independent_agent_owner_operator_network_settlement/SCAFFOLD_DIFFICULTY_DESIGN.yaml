          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One ACTIVE agent; one QUALIFIED_CLEAR BCO that already holds an awarded load; a second load whose offer to that same BCO was declined, leaving the BCO double-booked at the moment the stale offer is retried."
