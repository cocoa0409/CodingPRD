            - "after receive + grade + certify the retry succeeds: status COMPLETED, completed_at set"
            - "HarvestLot.${h1_id}: grade == PREMIUM, pack_designation == PREMIUM, lot_status == GRADED"

      - name: harvest_lot_hard_reject_above_10c_but_not_at_10c
        claim_type: Side Effect Execution
        grounds:
          - state_machines.HarvestLot.IN_TRANSIT_to_RECEIVED
          - calculations.cold_chain_evaluation
          - errors.ERR_LOT_NOT_RECEIVED
        distinguishing_aspect: "Pulp temperature 10.5C hard-rejects the lot at receive (REJECTED, grade locked UNGRADED); exactly 10.0C does NOT hard-reject (strictly-greater rule) — the lot receives normally but flags cold_chain_compliant == false because 10.0 > 4.0."
        test_recipe:
          setup: ["Canonical chain through P1 confirmed; two lots HX and HY created at clock 2026-10-06T06:30, both harvested 2026-10-06T06:00."]
          setup_api_calls:
            - *c_clock
            - *c_v1
            - *c_v1_rel
            - *c_g1
            - *c_a1
            - *c_a1_dec
            - *c_l1
            - *c_w1
            - *c_p1
            - *c_clock_aug
            - *c_p1_conf
            - *c_clock_h1a
            - call: "POST /licensing/harvest-lots"
              payload: { planting_id: "${p1_id}", harvested_at: "2026-10-06T06:00:00Z", gross_weight_kg: 200, tare_weight_kg: 10, expected_planting_version: "${p1_v}" }
              as: GrowerPrincipal
              as_user_id: "${g1_id}"
              captures: { hx_id: $.data.id }
            - call: "GET /licensing/plantings/${p1_id}"
              payload: {}
              as: PlatformAdmin
              captures: { p1_v_hx: $.data.version }
            - call: "POST /licensing/harvest-lots"
              payload: { planting_id: "${p1_id}", harvested_at: "2026-10-06T06:00:00Z", gross_weight_kg: 200, tare_weight_kg: 10, expected_planting_version: "${p1_v_hx}" }
              as: GrowerPrincipal
              as_user_id: "${g1_id}"
              captures: { hyb_id: $.data.id }
            - *c_clock_h1b
          trigger:
            - call: "POST /licensing/harvest-lots/${hx_id}/receive"
              payload: { received_at: "2026-10-06T12:00:00Z", pulp_temp_c_at_receipt: 10.5 }
              as: CoolingOperator
              as_user_id: "co-1"
            - call: "POST /licensing/harvest-lots/${hx_id}/grade"
              payload: { flavor_brix: 12.0, firmness_g: 400, appearance_score: 90, defect_pct: 1.0 }
              as: QualityGrader
              as_user_id: "qg-1"
              captures: { error_id: $.data.error_id }
            - call: "POST /licensing/harvest-lots/${hyb_id}/receive"
              payload: { received_at: "2026-10-06T12:00:00Z", pulp_temp_c_at_receipt: 10.0 }
              as: CoolingOperator
              as_user_id: "co-1"
          assert:
            - "HX: lot_status == REJECTED directly from receive (pulp 10.5 > 10.0 hard reject), grade_status locked UNGRADED"
            - "grading HX now fails 409 ERR_LOT_NOT_RECEIVED — hard-rejected fruit never enters grading"
            - "HY: lot_status == RECEIVED at exactly 10.0C (the hard-reject bound is strictly greater-than), but cold_chain_compliant == false (10.0 > 4.0) so the 8 percent deduction will apply at settle"

      - name: pool_marked_paid_when_last_statement_paid
        claim_type: Valid Transition
        grounds:
          - state_machines.PoolPeriod.SETTLED_to_PAID
          - state_machines.SettlementStatement.ISSUED_to_PAID
        distinguishing_aspect: "The pool's SETTLED -> PAID is compound: it fires only when its last statement is paid. With the single-statement corner pool, paying G1's ISSUED statement after the dispute deadline flips the pool to PAID in the same request."
        test_recipe:
          setup:
            - "Corner pool scenario: H1 certified PREMIUM (net 1150, wkg 1322.5); HY certified STANDARD but received exactly at week_end 2026-10-12T00:00:00Z (excluded)."
            - "Pool [2026-10-05, 2026-10-12) closed @500 and settled @520; G1 statement ISSUED net 562120, dispute_deadline 2026-10-26T00:00:00Z."
