# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Mobile Phlebotomy & At-Home Lab Draw — Expert band
# 9 rule_ids x 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: billing_mode_divergence_self_pay_vs_insurance
        grounds:
          - calculations.invoice_self_pay_total
          - calculations.invoice_insurance_total
          - entities.Invoice.fields.total_cents
          - entities.LabOrder.fields.billing_mode
        distinguishing_aspect: |
          For identical panel/partner inputs (base_lab_fee 4000, ROUTINE, 3 tubes, redraw 0),
          a SELF_PAY invoice issues total_cents == 8500 while an INSURANCE invoice issues
          total_cents == 2500 — same data, two valid billing algorithms, different result on
          the Invoice entity domain.
        test_recipe:
          setup:
            - "Panel CMP14 (required_tube_count=3, base_lab_fee_cents=4000) exists"
            - "LabPartner Quest accepts CMP14"
            - "One SELF_PAY order driven to RESULTED with a DRAFT invoice"
          setup_api_calls:
            - call: "POST /test-panels"
              payload: { panel_code: "CMP14", name: "Comprehensive Metabolic", required_tube_count: 3, base_lab_fee_cents: 4000 }
              as: LabOps
              captures: { panel_id: $.data.id }
            - call: "POST /lab-partners"
              payload: { name: "Quest", courier_sla_hours: 24, accepted_panel_codes: ["CMP14"], stat_surcharge_cents: 1500 }
              as: LabOps
              captures: { partner_id: $.data.id }
            - call: "POST /phlebotomists"
              payload: { full_name: "Pat Phleb", territory_code: "SF_BAY" }
              as: Dispatcher
              captures: { phleb_id: $.data.id }
            - call: "POST /phlebotomists/${phleb_id}/route-days"
              payload: { territory_code: "SF_BAY", service_date: "2026-02-01", shift_start_utc: "2026-02-01T08:00:00Z", shift_end_utc: "2026-02-01T18:00:00Z", stop_capacity: 10 }
              as: Dispatcher
              captures: { rd_id: $.data.id, rd_v: $.data.version }
            - call: "POST /lab-orders"
              payload: { patient_full_name: "Sam SP", patient_territory_code: "SF_BAY", panel_code: "CMP14", lab_partner_id: "${partner_id}", billing_mode: "SELF_PAY", priority: "ROUTINE" }
              as: OrderingProvider
              captures: { o_sp_id: $.data.id }
            - call: "POST /lab-orders/${o_sp_id}/appointments"
              payload: { route_day_id: "${rd_id}", window_start_utc: "2026-02-01T09:00:00Z", window_end_utc: "2026-02-01T09:30:00Z", expected_route_day_version: "${rd_v}" }
              as: Dispatcher
              captures: { appt_sp: $.data.id }
            - call: "POST /appointments/${appt_sp}/kit"
              payload: { kit_lot_number: "LOT1", tube_count: 3 }
              as: Dispatcher
            - call: "POST /appointments/${appt_sp}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /appointments/${appt_sp}/arrive"
              payload: {}
              as: Phlebotomist
              as_user_id: "${phleb_id}"
            - call: "POST /appointments/${appt_sp}/specimens"
              payload: { tube_label: "T1" }
              as: Phlebotomist
              as_user_id: "${phleb_id}"
              captures: { sp1: $.data.id }
            - call: "POST /appointments/${appt_sp}/specimens"
              payload: { tube_label: "T2" }
              as: Phlebotomist
              as_user_id: "${phleb_id}"
              captures: { sp2: $.data.id }
            - call: "POST /appointments/${appt_sp}/specimens"
              payload: { tube_label: "T3" }
              as: Phlebotomist
              as_user_id: "${phleb_id}"
              captures: { sp3: $.data.id }
            - call: "POST /appointments/${appt_sp}/complete-draw"
              payload: {}
              as: Phlebotomist
              as_user_id: "${phleb_id}"
            - call: "POST /courier-manifests"
              payload: { lab_partner_id: "${partner_id}", territory_code: "SF_BAY" }
              as: Dispatcher
              captures: { man_sp: $.data.id }
            - call: "POST /courier-manifests/${man_sp}/add-specimen"
              payload: { specimen_id: "${sp1}" }
              as: Phlebotomist
              as_user_id: "${phleb_id}"
            - call: "POST /courier-manifests/${man_sp}/add-specimen"
              payload: { specimen_id: "${sp2}" }
              as: Phlebotomist
              as_user_id: "${phleb_id}"
            - call: "POST /courier-manifests/${man_sp}/add-specimen"
              payload: { specimen_id: "${sp3}" }
              as: Phlebotomist
              as_user_id: "${phleb_id}"
            - call: "POST /courier-manifests/${man_sp}/pickup"
              payload: {}
              as: Dispatcher
            - call: "POST /specimens/${sp1}/accession"
              payload: {}
              as: LabOps
            - call: "POST /specimens/${sp2}/accession"
              payload: {}
              as: LabOps
            - call: "POST /specimens/${sp3}/accession"
              payload: {}
              as: LabOps
            - call: "POST /lab-orders/${o_sp_id}/results"
              payload: { result_value: "ok" }
              as: LabOps
            - call: "GET /lab-orders/${o_sp_id}/invoices"
              payload: {}
              as: BillingAgent
              captures: { inv_sp: "$.data[0].id" }
          trigger:
            - call: "POST /invoices/${inv_sp}/issue"
              payload: {}
              as: BillingAgent
          assert:
            - "Invoice.${inv_sp}.lab_fee_cents == 4000"
            - "Invoice.${inv_sp}.convenience_fee_cents == 4500"
            - "Invoice.${inv_sp}.redraw_waiver_cents == 0"
            - "Invoice.${inv_sp}.total_cents == 8500"
            - "Invoice.${inv_sp}.status == ISSUED"

      - name: order_estimate_vs_final_after_redraw
        grounds:
          - calculations.order_total_due_estimate
          - calculations.invoice_self_pay_total
          - entities.LabOrder.fields.total_due_cents
          - entities.LabOrder.fields.redraw_count
        distinguishing_aspect: |
          On the LabOrder domain (NOT the Invoice domain), the forward-looking estimate stamped
          at creation (redraw_count 0, total_due_cents == 8500 for SELF_PAY 3-tube base 4000) diverges
          from the recomputed estimate after one QNS-driven redraw (redraw_count 1, total_due_cents == 7500),
          because the estimate-after-redraw variant applies the redraw waiver the at-order variant omits.
        test_recipe:
          setup:
            - "Panel CMP14 (3 tubes, base_lab_fee 4000) and partner Quest exist"
            - "SELF_PAY order created (total_due_cents stamped 8500), drawn, one specimen MANIFESTED on IN_TRANSIT manifest"
          setup_api_calls:
            - call: "POST /test-panels"
              payload: { panel_code: "CMP14", name: "CMP", required_tube_count: 3, base_lab_fee_cents: 4000 }
              as: LabOps
              captures: { panel_id: $.data.id }
            - call: "POST /lab-partners"
              payload: { name: "Quest", courier_sla_hours: 24, accepted_panel_codes: ["CMP14"], stat_surcharge_cents: 1500 }
              as: LabOps
              captures: { partner_id: $.data.id }
            - call: "POST /phlebotomists"
              payload: { full_name: "Pat", territory_code: "SF_BAY" }
              as: Dispatcher
              captures: { phleb_id: $.data.id }
            - call: "POST /phlebotomists/${phleb_id}/route-days"
              payload: { territory_code: "SF_BAY", service_date: "2026-02-01", shift_start_utc: "2026-02-01T08:00:00Z", shift_end_utc: "2026-02-01T18:00:00Z", stop_capacity: 10 }
              as: Dispatcher
              captures: { rd_id: $.data.id, rd_v: $.data.version }
            - call: "POST /lab-orders"
              payload: { patient_full_name: "Sam", patient_territory_code: "SF_BAY", panel_code: "CMP14", lab_partner_id: "${partner_id}", billing_mode: "SELF_PAY", priority: "ROUTINE" }
              as: OrderingProvider
              captures: { o_id: $.data.id, est_at_order: $.data.total_due_cents }
            - call: "POST /lab-orders/${o_id}/appointments"
              payload: { route_day_id: "${rd_id}", window_start_utc: "2026-02-01T09:00:00Z", window_end_utc: "2026-02-01T09:30:00Z", expected_route_day_version: "${rd_v}" }
              as: Dispatcher
              captures: { appt_id: $.data.id }
            - call: "POST /appointments/${appt_id}/kit"
              payload: { kit_lot_number: "LOT1", tube_count: 3 }
              as: Dispatcher
            - call: "POST /appointments/${appt_id}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /appointments/${appt_id}/arrive"
              payload: {}
              as: Phlebotomist
              as_user_id: "${phleb_id}"
            - call: "POST /appointments/${appt_id}/specimens"
              payload: { tube_label: "T1" }
              as: Phlebotomist
              as_user_id: "${phleb_id}"
              captures: { sp1: $.data.id }
            - call: "POST /appointments/${appt_id}/specimens"
              payload: { tube_label: "T2" }
              as: Phlebotomist
              as_user_id: "${phleb_id}"
              captures: { sp2: $.data.id }
            - call: "POST /appointments/${appt_id}/specimens"
              payload: { tube_label: "T3" }
              as: Phlebotomist
              as_user_id: "${phleb_id}"
              captures: { sp3: $.data.id }
            - call: "POST /appointments/${appt_id}/complete-draw"
              payload: {}
              as: Phlebotomist
              as_user_id: "${phleb_id}"
            - call: "POST /courier-manifests"
              payload: { lab_partner_id: "${partner_id}", territory_code: "SF_BAY" }
              as: Dispatcher
              captures: { man_id: $.data.id }
            - call: "POST /courier-manifests/${man_id}/add-specimen"
              payload: { specimen_id: "${sp1}" }
              as: Phlebotomist
              as_user_id: "${phleb_id}"
            - call: "POST /courier-manifests/${man_id}/pickup"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /specimens/${sp1}/reject-qns"
              payload: {}
              as: LabOps
            - call: "GET /lab-orders/${o_id}"
              payload: {}
              as: OrderingProvider
              captures: { est_after: $.data.total_due_cents, rc: $.data.redraw_count }
          assert:
            - "est_at_order == 8500"
            - "LabOrder.${o_id}.redraw_count == 1"
            - "LabOrder.${o_id}.total_due_cents == 7500"
            - "LabOrder.${o_id}.status == REDRAW_REQUIRED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: self_pay_total_multi_input_nonlinear_mode_a
        grounds:
          - calculations.invoice_self_pay_total
          - entities.LabOrder.fields.priority
          - entities.TestPanel.fields.required_tube_count
          - entities.LabPartner.fields.stat_surcharge_cents
        distinguishing_aspect: |
          Mode (a): the self-pay total combines >=3 inputs with non-linear interaction — conditional
          STAT branch (+stat_surcharge_cents), per-extra-tube tiered surcharge (max(0,tubes-1)*500),
          and a min()-capped redraw waiver. With base 4000, STAT (+1500), 3 tubes, redraw 1, the issued
          total_cents == 9000, not reproducible by any single linear term.
        test_recipe:
          setup:
            - "Panel CMP14 (3 tubes, base 4000), partner Quest (stat_surcharge 1500)"
            - "STAT SELF_PAY order: first draw fully QNS-rejected (redraw_count 1), re-drawn and RESULTED"
          setup_api_calls:
            - call: "POST /test-panels"
              payload: { panel_code: "CMP14", name: "CMP", required_tube_count: 3, base_lab_fee_cents: 4000 }
              as: LabOps
              captures: { panel_id: $.data.id }
            - call: "POST /lab-partners"
