              as_user_id: "${assessor_id}"
            - call: "POST /wrestlers/${wrestler_a}/assessments"
              payload: { assessor_id: "${assessor_id}", method: "SKINFOLD", assessed_at: "2026-11-01T09:30:00Z", measured_weight_lbs: 158.0, body_fat_pct: 14.0, urine_specific_gravity: 1.030 }
