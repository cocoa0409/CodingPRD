              captures: { lot_one: $.data.id }
            - call: "POST /fresh/lots/${lot_one}/sales"
              payload: { quantity_units: 8, register_lane_code: "L07" }
              as: FreshClerk
          trigger:
            - call: "POST /fresh/shrink-events"
              payload: { lot_id: "${lot_one}", cause_code: "SPOILAGE", quantity_units: 2 }
              as: FreshClerk
              as_user_id: "u-clerk-1"
              captures: { shrink_a: $.data.id }
            - call: "POST /fresh/shrink-events/${shrink_a}/verify"
