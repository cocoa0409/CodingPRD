              captures: { err_c: $.data.error_id }
          assert:
            - "first response: HTTP status 422 and data.error_id == \"ERR_ATTESTATION_REQUIRED\""
            - "second response: HTTP status 422 and data.error_id == \"ERR_INVALID_ORDER_STATE\""
            - "third response: HTTP status 422 and data.error_id == \"ERR_INVALID_ORDER_STATE\""
            - "Order.${order}.compliance_state == DRAFT_UNVERIFIED"
            - "Order.${order}.fulfillment_state == CREATED"
            - "Order.${order}.dispatched_at is null"
            - "GET /delivery-attempts?order_id=${order} returns total_count == 0"
            - "OrderLine.${line_a}.line_state == INCLUDED"

      - name: corner_safety_tier_outranks_the_temporal_tier
        claim_type: priority_conflict
        grounds:
          - validations[priority=50]
          - validations[priority=60]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / dry_jurisdiction_safety_beats_restricted_hours_temporal
          rationale: "That §1.8 instance builds a request that violates priority 50 and priority 60 simultaneously and asserts ERR_DRY_JURISDICTION_PROHIBITED wins, then fixes only the jurisdiction to expose ERR_OUTSIDE_RESTRICTED_HOURS."

      - name: corner_state_tier_outranks_the_quantity_tier
        claim_type: priority_conflict
        grounds:
          - validations[priority=40]
          - validations[priority=70]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / order_state_check_beats_quantity_ceiling_after_policy_epoch_change
          rationale: "That §1.8 instance violates priority 40 and priority 70 in one call and asserts ERR_INVALID_ORDER_STATE wins, then re-runs on a DRAFT order to expose ERR_ORDER_UNIT_LIMIT_EXCEEDED."

  # =========================================================================
  # Section 5 — Endpoints (§1.5)
  # =========================================================================
  - section: endpoints
    instances:

      - name: corner_restriction_policy_crud_round_trips_through_read_and_list
        claim_type: standard_crud
        grounds:
          - endpoints.POST /restriction-policies
          - endpoints.GET /restriction-policies/{id}
          - endpoints.GET /jurisdictions/{id}/restriction-policies
          - entities.Jurisdiction.fields.active_policy_count
        distinguishing_aspect: |
          The created policy is readable by id with every declared field intact and appears in
          the jurisdiction's nested list; the restriction_type filter narrows a two-row list to
          one row, and Jurisdiction.active_policy_count tracks both creations rather than
          staying at its default 0.
        test_recipe:
          setup:
            - "logical clock 2026-08-01T00:00:00Z; one jurisdiction with no policies yet"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { code: "US-NY", name: "New York", dry_status: "WET", utc_offset_minutes: -240 }
              as: PlatformAdmin
              captures: { j_ny: $.data.id }
          trigger:
            - call: "POST /restriction-policies"
              payload: { jurisdiction_id: "${j_ny}", restriction_type: "ALCOHOL", permissibility: "PERMITTED", min_age_years: 21, delivery_window_start_minute: 600, delivery_window_end_minute: 1320, unit_scale_factor: 1.00, max_units_per_order: 6.97, rolling_window_days: 30, max_units_per_window: 40.00, acceptable_document_types: ["DRIVERS_LICENSE", "PASSPORT"], requires_scan: true, effective_from: "2026-08-01", effective_to: "2026-08-31" }
              as: PlatformAdmin
              captures: { pol_alc: $.data.id }
            - call: "POST /restriction-policies"
              payload: { jurisdiction_id: "${j_ny}", restriction_type: "TOBACCO_VAPE", permissibility: "PERMITTED", min_age_years: 21, delivery_window_start_minute: 540, delivery_window_end_minute: 1260, unit_scale_factor: 2.00, max_units_per_order: 10.00, rolling_window_days: 30, max_units_per_window: 20.00, acceptable_document_types: ["DRIVERS_LICENSE"], requires_scan: true, effective_from: "2026-08-01", effective_to: "2026-08-31" }
              as: PlatformAdmin
              captures: { pol_tob: $.data.id }
            - call: "GET /restriction-policies/${pol_alc}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer_a"
            - call: "GET /jurisdictions/${j_ny}/restriction-policies"
              payload: { restriction_type: "ALCOHOL" }
              as: ComplianceOfficer
              as_user_id: "officer_a"
          assert:
            - "both creates return HTTP 201"
            - "read of ${pol_alc}: HTTP 200, jurisdiction_id == ${j_ny}, restriction_type == ALCOHOL, min_age_years == 21"
            - "read of ${pol_alc}: delivery_window_start_minute == 600, delivery_window_end_minute == 1320, unit_scale_factor == 1.00"
            - 'read of ${pol_alc}: acceptable_document_types == ["DRIVERS_LICENSE", "PASSPORT"], requires_scan == true'
            - 'read of ${pol_alc}: effective_from == "2026-08-01" and effective_to == "2026-08-31"'
            - "read of ${pol_alc}: version == 1"
            - "filtered list: total_count == 1 and the single row has id == ${pol_alc}"
            - "Jurisdiction.${j_ny}.active_policy_count == 2"

      - name: corner_certification_renew_revives_an_expired_row_and_bumps_the_counter
        claim_type: action_endpoint
        grounds:
          - endpoints.POST /courier-certifications/{id}/renew
          - state_machines.CourierCertification.EXPIRED_to_ACTIVE
          - entities.CourierCertification.fields.renewal_count
          - domain_constants.TRAINING_FRESHNESS_DAYS
        distinguishing_aspect: |
          Renewal is an action endpoint, not a create: the same certification id moves EXPIRED to
          ACTIVE, renewal_count goes 0 to 1, expires_at is re-anchored on the logical clock
          (2026-08-31T00:00:00Z + 30 days) rather than on the stale expiry, and no second
          certification row appears in the courier's list.
        test_recipe:
          setup:
            - "logical clock 2026-08-01T00:00:00Z; certification issued with valid_days 30, so expires_at is 2026-08-31T00:00:00Z"
            - "clock advanced to exactly 2026-08-31T00:00:00Z, which expires it and drops the courier to UNCERTIFIED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /delivery-partners"
              payload: { legal_name: "Empire Last Mile", contract_tier: "STANDARD", license_reference: "NY-DEL-0001" }
              as: PlatformAdmin
              captures: { partner: $.data.id }
            - call: "POST /couriers"
              payload: { delivery_partner_id: "${partner}", full_name: "Dana Reyes", hired_at: "2026-05-01" }
              as: PartnerManager
              as_user_id: "${partner}"
              captures: { courier: $.data.id }
            - call: "POST /courier-certifications"
              payload: { courier_id: "${courier}", restriction_type: "ALCOHOL", training_score: 92, training_completed_at: "2026-07-15", valid_days: 30 }
              as: PartnerManager
              as_user_id: "${partner}"
              captures: { cert: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { expired_certs: $.data.expired_certification_count }
          trigger:
            - call: "POST /courier-certifications/${cert}/renew"
              payload: { training_score: 95, training_completed_at: "2026-08-25", valid_days: 30 }
              as: PartnerManager
              as_user_id: "${partner}"
          assert:
            - "the clock advance reported expired_certification_count == 1"
            - "HTTP status is 200"
            - "CourierCertification.${cert}.state == ACTIVE"
            - "CourierCertification.${cert}.renewal_count == 1"
            - "CourierCertification.${cert}.training_score == 95"
            - 'CourierCertification.${cert}.training_completed_at == "2026-08-25"'
            - 'CourierCertification.${cert}.issued_at == "2026-08-31T00:00:00Z"'
            - 'CourierCertification.${cert}.expires_at == "2026-09-30T00:00:00Z"'
            - "Courier.${courier}.certification_state == CERTIFIED"
            - "Courier.${courier}.dispatch_eligible == true"
            - "GET /couriers/${courier}/certifications returns total_count == 1"

      - name: corner_clearance_acts_only_on_an_order_pending_compliance_review
