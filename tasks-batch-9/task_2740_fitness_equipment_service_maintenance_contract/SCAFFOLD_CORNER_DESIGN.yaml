          - validations[priority=33]
        excluded_because:
          difficulty_instance: dispatch_contract_not_active_outranks_safety_certification_required
          rationale: "That §1.8 validation_priority_inversion instance already builds a dispatch that violates both rules at once, shows ERR_CONTRACT_NOT_ACTIVE winning, and then reinstates the contract so the lower-priority ERR_SAFETY_CERTIFICATION_REQUIRED surfaces on the very same request."

      - name: part_model_mismatch_outranks_the_allowance_guard
        claim_type: priority_ordering
        grounds:
          - validations[priority=38]
          - validations[priority=61]
        excluded_because:
          difficulty_instance: parts_hold_model_mismatch_outranks_parts_allowance_exhausted
          rationale: "That §1.8 validation_priority_inversion instance already drains the allowance to zero and then requests a part belonging to another model, proving ERR_PART_MODEL_MISMATCH wins over ERR_PARTS_ALLOWANCE_EXHAUSTED and that the correct-model request then hits the allowance rule."

  - section: endpoints
    instances:
      - name: credit_summary_is_a_pure_read_that_partitions_events_by_status
        claim_type: computed read
        grounds:
          - endpoints[GET /fleetcare/contracts/{contractId}/credit-summary]
          - entities.ServiceContract.fields.credit_provisional_cents
          - calculations.credit_reconciliation
        distinguishing_aspect: "The summary is derived on every call, never stored: its three counters partition the contract's events into open / closed / reconciled with a reconciled event dropping out of the closed bucket, and reading it twice in a row returns byte-identical numbers without advancing ServiceContract.version."
        test_recipe:
          setup:
            - "Clock 2026-08-15T08:00:00Z; club NORTH (open 05:00-23:00), units e1 and e2, ACTIVE GOLD/FULL contract with annual_base_cents 250000 → credit_cap_cents 37500, technician T1."
            - "e1's call runs 08:00-14:00 and is resolved, so its event closes at 4800 cents (360 minutes less the 180-minute GOLD grace at 1600 cents/hour); the period is then reconciled."
            - "e2's call is filed at 15:00 and left OPEN."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T08:00:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/clubs", payload: { name: "Northside Fitness", region_code: "NORTH" }, as: ContractAdministrator, captures: { club_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment-models", payload: { manufacturer: "Pacemaster", model_code: "TM-900", category: "TREADMILL", model_year: 2019, pm_interval_hours: 250, expected_service_life_hours: 20000, base_annual_service_cents: 120000 }, as: ContractAdministrator, captures: { model_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment", payload: { club_id: "${club_id}", model_id: "${model_id}", serial_number: "SN-CS-A", install_date: "2024-03-01", initial_usage_hours: 500 }, as: ContractAdministrator, captures: { e1_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment", payload: { club_id: "${club_id}", model_id: "${model_id}", serial_number: "SN-CS-B", install_date: "2024-03-01", initial_usage_hours: 500 }, as: ContractAdministrator, captures: { e2_id: "$.data.id" } }
            - { call: "POST /fleetcare/contracts", payload: { club_id: "${club_id}", coverage_tier: "GOLD", parts_inclusion: "FULL", pm_visits_per_year: 4, annual_base_cents: 250000, initial_parts_allowance_cents: 500000, term_start_date: "2026-01-01", term_end_date: "2026-12-31" }, as: ContractAdministrator, captures: { c_id: "$.data.id" } }
            - { call: "POST /fleetcare/contracts/${c_id}/activate", as: ContractAdministrator }
            - { call: "POST /fleetcare/technicians", payload: { full_name: "Dana Reyes", region_code: "NORTH", skill_categories: ["TREADMILL"] }, as: ContractAdministrator, captures: { t1_id: "$.data.id" } }
            - { call: "POST /fleetcare/service-calls", payload: { contract_id: "${c_id}", equipment_id: "${e1_id}", severity: "MAJOR", symptom_code: "BELT_NOISE" }, as: ServiceCoordinator, captures: { call_1: "$.data.id" } }
            - { call: "POST /fleetcare/service-calls/${call_1}/dispatch", payload: { start_at: "2026-08-15T08:00:00Z", technician_id: "${t1_id}" }, as: ServiceCoordinator }
            - { call: "POST /fleetcare/service-calls/${call_1}/arrive", as: FieldTechnician, as_user_id: "${t1_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T14:00:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/service-calls/${call_1}/resolve", payload: { resolution_code: "BELT_TENSIONED" }, as: FieldTechnician, as_user_id: "${t1_id}" }
            - { call: "GET /fleetcare/contracts/${c_id}/credit-summary", as: ClubManager, as_user_id: "${club_id}", captures: { pre_open: "$.data.open_event_count", pre_closed: "$.data.closed_event_count", pre_recon: "$.data.reconciled_event_count", pre_accrued: "$.data.credit_accrued_cents" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T15:00:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/service-calls", payload: { contract_id: "${c_id}", equipment_id: "${e2_id}", severity: "MINOR", symptom_code: "CONSOLE_DIM" }, as: ServiceCoordinator, captures: { call_2: "$.data.id" } }
            - { call: "GET /fleetcare/contracts/${c_id}", as: ContractAdministrator, captures: { occ_ver_f: "$.data.version" } }
            - { call: "POST /fleetcare/contracts/${c_id}/credit-reconciliations", payload: { period_key: "2026-08", expected_contract_version: "${occ_ver_f}" }, as: ContractAdministrator, captures: { ver_after: "$.data.contract_version" } }
          trigger:
            - { call: "GET /fleetcare/contracts/${c_id}/credit-summary", as: ContractAdministrator, captures: { s1_prov: "$.data.credit_provisional_cents", s1_accrued: "$.data.credit_accrued_cents", s1_forgone: "$.data.credit_forgone_cents", s1_cap: "$.data.credit_cap_cents", s1_open: "$.data.open_event_count", s1_closed: "$.data.closed_event_count", s1_recon: "$.data.reconciled_event_count" } }
            - { call: "GET /fleetcare/contracts/${c_id}/credit-summary", as: ServiceCoordinator, captures: { s2_prov: "$.data.credit_provisional_cents", s2_accrued: "$.data.credit_accrued_cents", s2_open: "$.data.open_event_count", s2_recon: "$.data.reconciled_event_count" } }
            - { call: "GET /fleetcare/contracts/${c_id}", as: ContractAdministrator, captures: { ver_now: "$.data.version" } }
          assert:
            - "before reconciliation: ${pre_open} == 0, ${pre_closed} == 1, ${pre_recon} == 0 and ${pre_accrued} == 0"
            - "${ver_after} == 3 (the reconciliation is the only write in the trigger window)"
            - "${s1_prov} == 4800, ${s1_accrued} == 4800, ${s1_forgone} == 0 and ${s1_cap} == 37500"
            - "${s1_open} == 1 (${call_2}'s event), ${s1_closed} == 0 and ${s1_recon} == 1 — the reconciled event left the closed bucket"
            - "${s2_prov} == ${s1_prov}, ${s2_accrued} == ${s1_accrued}, ${s2_open} == ${s1_open} and ${s2_recon} == ${s1_recon} — the read is repeatable and role-agnostic across its three permitted roles"
            - "${ver_now} == 3 — two summary reads did not advance the contract version"
            - "contract_id in the summary body equals ${c_id}"

      - name: linked_child_rows_are_reachable_from_their_parents_filters
