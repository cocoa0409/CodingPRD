          SENT → QUOTED is guarded by a clock comparison against the parent submission's
          response_deadline, and the guard is inclusive at the deadline instant: quoting exactly at
          2026-02-01T00:00:00.000Z is allowed (now <= deadline) while one millisecond later is 409
