      - name: merchant_create_missing_required_field_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=11]
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Omitting the required legal_name fails ERR_INVALID_REQUEST (400); the same omission pattern applies to every required input field."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /acquirer/merchants"
              as: AcquirerOps
              payload: { merchant_category_code: "5411" }
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST (legal_name missing)"

      - name: txn_ingest_for_suspended_merchant_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=6]
          - "errors[ERR_MERCHANT_NOT_ACTIVE]"
        distinguishing_aspect: "Transaction ingest (unlike chargeback ingest) is gated on merchant status: while SUSPENDED it fails ERR_MERCHANT_NOT_ACTIVE — the network-facing chargeback feed keeps flowing, the sales feed does not."
        test_recipe:
          setup: ["merchant suspended by RiskOfficer"]
          setup_api_calls:
            - call: "POST /acquirer/merchants"
              as: AcquirerOps
              payload: { legal_name: "SuspTxn M", merchant_category_code: "5411", reserve_rate_bps: 0 }
              captures: { m_id: $.data.id }
            - { call: "POST /acquirer/merchants/${m_id}/suspend", as: RiskOfficer, payload: {} }
          trigger:
            - call: "POST /acquirer/transactions"
              as: AcquirerOps
              payload: { merchant_id: "${m_id}", external_ref: "T-1", network: VISA, amount_cents: 10000, occurred_at: "2026-07-25T00:00:00Z" }
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_MERCHANT_NOT_ACTIVE"

      - name: exit_review_without_plan_rejected
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_EXIT_CRITERIA_NOT_MET]"
        distinguishing_aspect: "Exit review fails ERR_EXIT_CRITERIA_NOT_MET when no APPROVED remediation plan exists, even though three clean snapshots are posted."
        test_recipe:
          setup: ["ACTIVE enrollment; three consecutive under-threshold POSTED snapshots; NO remediation plan"]
          setup_api_calls:
            - call: "POST /acquirer/merchants"
              as: AcquirerOps
              payload: { legal_name: "NoPlan M", merchant_category_code: "5411", reserve_rate_bps: 0 }
              captures: { m_id: $.data.id }
            - call: "POST /acquirer/program-enrollments"
              as: RiskOfficer
              payload: { merchant_id: "${m_id}", network: VISA, program_code: VDMP_STANDARD, enrolled_month: "2026-05" }
              captures: { enr_id: $.data.id }
            - { call: "POST /acquirer/transactions/batch", as: AcquirerOps, payload: { merchant_id: "${m_id}", network: VISA, count: 100, amount_cents: 10000, occurred_at: "2026-06-10T00:00:00Z", external_ref_prefix: "N6" } }
            - { call: "POST /acquirer/ops/advance-month", as: AcquirerOps, payload: { period_month: "2026-06", merchant_id: "${m_id}" } }
            - { call: "POST /acquirer/transactions/batch", as: AcquirerOps, payload: { merchant_id: "${m_id}", network: VISA, count: 100, amount_cents: 10000, occurred_at: "2026-07-10T00:00:00Z", external_ref_prefix: "N7" } }
            - { call: "POST /acquirer/ops/advance-month", as: AcquirerOps, payload: { period_month: "2026-07", merchant_id: "${m_id}" } }
            - { call: "POST /acquirer/transactions/batch", as: AcquirerOps, payload: { merchant_id: "${m_id}", network: VISA, count: 100, amount_cents: 10000, occurred_at: "2026-08-10T00:00:00Z", external_ref_prefix: "N8" } }
            - { call: "POST /acquirer/ops/advance-month", as: AcquirerOps, payload: { period_month: "2026-08", merchant_id: "${m_id}" } }
          trigger:
            - call: "POST /acquirer/program-enrollments/${enr_id}/exit-review"
              as: RiskOfficer
              payload: { exited_month: "2026-08" }
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_EXIT_CRITERIA_NOT_MET (the APPROVED-plan leg fails first)"

      - name: unauthenticated_request_rejected_before_existence
        claim_type: priority_ordering
        grounds:
          - validations[priority=1]
          - validations[priority=3]
        distinguishing_aspect: "Auth precedes existence: a request with a missing/invalid role header gets 401 ERR_UNAUTHENTICATED even for a non-existent resource id (never 404 first)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /acquirer/chargebacks/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNAUTHENTICATED with HTTP 401 (auth at priority 1 short-circuits the 404)"

  - section: endpoints
    instances:
      - name: batch_ingest_deterministic_refs
        claim_type: bulk_action
        grounds:
          - entities.Transaction.fields.external_ref
        distinguishing_aspect: "Batch ingest mints deterministic refs prefix-NNNN (Q-0001..Q-0003): the reported first/last refs resolve, and a chargeback can target Q-0002 by external_ref without any id capture."
        test_recipe:
          setup: ["merchant only"]
          setup_api_calls:
            - { call: "POST /acquirer/reason-code-rules", as: AcquirerOps, payload: { network: VISA, reason_code: "10.4", category: FRAUD, required_evidence_types: [RECEIPT], merchant_response_days: 7, representment_days: 30, chargeback_fee_cents: 2500, effective_from: "2026-01-01T00:00:00Z" } }
            - call: "POST /acquirer/merchants"
              as: AcquirerOps
              payload: { legal_name: "Batch M", merchant_category_code: "5411", reserve_rate_bps: 0 }
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /acquirer/transactions/batch"
              as: AcquirerOps
              payload: { merchant_id: "${m_id}", network: VISA, count: 3, amount_cents: 10000, occurred_at: "2026-07-10T00:00:00Z", external_ref_prefix: "Q" }
              captures: { created: $.data.created_count, first_ref: $.data.first_external_ref, last_ref: $.data.last_external_ref }
            - call: "POST /acquirer/chargebacks"
              as: AcquirerOps
              payload: { merchant_id: "${m_id}", transaction_external_ref: "Q-0002", network_case_id: "NC-Q2", reason_code: "10.4", amount_cents: 4000 }
              captures: { cb_case: $.data.case_status }
          assert:
            - "created == 3 and first_ref == Q-0001 and last_ref == Q-0003"
            - "cb_case == RECEIVED (the batch-minted ref resolved the disputed sale)"

  - section: errors
    instances:
      - name: evidence_incomplete_missing_type_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=9]
          - "errors[ERR_EVIDENCE_INCOMPLETE]"
        distinguishing_aspect: "The governing rule requires [RECEIPT, DELIVERY_PROOF]; a packet covering only RECEIPT fails submit with ERR_EVIDENCE_INCOMPLETE (422) — completeness is per required type, not packet size."
        test_recipe:
          setup: ["notified chargeback; packet assembled with a single RECEIPT item"]
          setup_api_calls:
            - { call: "POST /acquirer/reason-code-rules", as: AcquirerOps, payload: { network: VISA, reason_code: "10.4", category: FRAUD, required_evidence_types: [RECEIPT, DELIVERY_PROOF], merchant_response_days: 7, representment_days: 30, chargeback_fee_cents: 2500, effective_from: "2026-01-01T00:00:00Z" } }
            - call: "POST /acquirer/merchants"
              as: AcquirerOps
              payload: { legal_name: "IncEv M", merchant_category_code: "5411", reserve_rate_bps: 0 }
              captures: { m_id: $.data.id }
            - { call: "POST /acquirer/transactions", as: AcquirerOps, payload: { merchant_id: "${m_id}", external_ref: "T-1", network: VISA, amount_cents: 10000, occurred_at: "2026-07-10T00:00:00Z" } }
            - { call: "POST /acquirer/_clock/set_current_utc", as: AcquirerOps, payload: { to_iso8601: "2026-07-15T00:00:00Z" } }
            - call: "POST /acquirer/chargebacks"
              as: AcquirerOps
              payload: { merchant_id: "${m_id}", transaction_external_ref: "T-1", network_case_id: "NC-IE1", reason_code: "10.4", amount_cents: 10000 }
              captures: { cb_id: $.data.id }
            - { call: "POST /acquirer/chargebacks/${cb_id}/notify", as: AcquirerOps, payload: {} }
            - call: "POST /acquirer/evidence-items"
              as: MerchantUser
              as_user_id: "${m_id}"
              payload: { chargeback_id: "${cb_id}", evidence_type: RECEIPT, document_uri: "s3://ev/r.pdf" }
              captures: { ev1: $.data.id }
            - call: "GET /acquirer/chargebacks/${cb_id}"
              as: AcquirerOps
              captures: { cb_v: $.data.version }
            - call: "POST /acquirer/representments"
              as: MerchantUser
              as_user_id: "${m_id}"
              payload: { chargeback_id: "${cb_id}", evidence_item_ids: ["${ev1}"], expected_chargeback_version: "${cb_v}" }
              captures: { rep_id: $.data.id }
          trigger:
            - call: "POST /acquirer/representments/${rep_id}/submit"
              as: MerchantUser
              as_user_id: "${m_id}"
              payload: {}
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_EVIDENCE_INCOMPLETE (DELIVERY_PROOF uncovered)"
            - "Representment.${rep_id}.status stays ASSEMBLED"

      - name: err_rule_window_overlap_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_RULE_WINDOW_OVERLAP]"]
        excluded_because:
          difficulty_instance: reason_rule_half_open_window_overlap
          rationale: "Asserted as the rejection leg of the §1.8 half-open window instance."
      - name: err_transaction_not_chargebackable_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_TRANSACTION_NOT_CHARGEBACKABLE]"]
        excluded_because:
