              as: ProcessEngineer
          assert:
            - "Before the abort: WireLot.${wire_id}.available_mass_kg == 290.000, reserved_mass_kg == 210.000, consumed_mass_kg == 0.000, version == 3"
            - "After the abort: WireLot.${wire_id}.available_mass_kg == 500.000, reserved_mass_kg == 0.000, consumed_mass_kg == 0.000, version == 4"
            - "The invariant holds after the abort: 500.000 == 500.000 + 0.000 + 0.000"
            - "ProductionLot.${lot_id}.process_state == ABORTED, disposition == SCRAPPED, wire_reserved_kg == 0.000, wire_consumed_kg == 0.000"
