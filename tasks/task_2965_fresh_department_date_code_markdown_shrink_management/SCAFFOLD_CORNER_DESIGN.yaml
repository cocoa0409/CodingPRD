          scan_price_overcharge_at_enforcement_boundary_withdraws_the_lot.)
        test_recipe:
          setup:
            - "The MEAT base chain; clock at 2026-08-12T00:00:00.000Z; rung-0 markdown to 509 cents, label PRINTED and APPLIED; 24 units on hand."
          setup_api_calls:
