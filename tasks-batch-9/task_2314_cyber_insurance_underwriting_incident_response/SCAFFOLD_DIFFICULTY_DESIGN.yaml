  - rule_id: compensating_invariant
    instances:
      - name: payment_reversal_restores_aggregate_sublimit_and_claim_ledger
        grounds:
          - state_machines.ClaimPayment.POSTED_to_REVERSED
          - state_machines.Policy.EXHAUSTED_to_PARTIALLY_ERODED
          - state_machines.Policy.PARTIALLY_ERODED_to_INTACT
          - calculations.tower_allocation_waterfall
          - entities.Policy.fields.aggregate_limit_remaining_usd
          - entities.CoverageSection.fields.sublimit_remaining_usd
          - entities.IncidentClaim.fields.paid_total_usd
          - entities.IncidentClaim.fields.unallocated_loss_usd
        distinguishing_aspect: |
          Conserved quantity = indemnity capacity in dollars: reversing the single POSTED payment must add
          back exactly gross_amount_usd to the section and net_paid_usd to the aggregate, returning
          limit_status to INTACT at 250000.00 with paid_total_usd back to 0.00 and no residual
          unallocated_loss_usd drift.
        test_recipe:
          setup:
            - "Bound Bitwise Systems policy: aggregate 250000, retention 0, tower FIRST_PARTY_RESPONSE 250000/prio 10 and BUSINESS_INTERRUPTION 250000/wait 12/coins 0.00/prio 20."
            - "Logical clock at 2026-09-10T00:00:00Z; one RANSOMWARE claim with a 112.00-hour outage (100.00 compensable) whose accepted proof assessed 400000.00."
            - "The waterfall has already posted one ClaimPayment of gross_amount_usd 250000.00 and net_paid_usd 250000.00 against the BUSINESS_INTERRUPTION section, so the policy is EXHAUSTED with aggregate_limit_remaining_usd 0.00, that section's sublimit_remaining_usd is 0.00, the claim is SETTLED with paid_total_usd 250000.00 and unallocated_loss_usd 150000.00."
            - "The policy's lifecycle_status is still INFORCE, which the reversal transition requires."
          setup_api_calls:
            - call: "POST /cyber/control-requirements"
