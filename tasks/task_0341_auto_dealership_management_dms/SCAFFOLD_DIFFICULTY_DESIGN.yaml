              payload: { vehicle_id: "${v_id}", customer_id: "${c_id}", deal_type: "FINANCE", sale_price_cents: 1899500, accessories_cents: 129500, doc_fee_cents: 59900, title_fee_cents: 7500, registration_fee_cents: 35000, tax_rate_bps: 725, cash_down_cents: 0 }
              as: SalesManager
              captures: { d_id: $.data.id }
            - call: "POST /deals/${d_id}/desk"
              payload: {}
              as: SalesManager
            - call: "POST /deals/${d_id}/documents"
              payload: { doc_type: "CREDIT_APP", uri: "s3://jacket/d/ca.pdf" }
              as: SalesManager
            - call: "POST /deals/${d_id}/submit-to-lender"
              payload: {}
              as: SalesManager
            - call: "POST /deals/${d_id}/lender-decision"
              payload: { decision: "APPROVE", lender_program_id: "${lp_id}" }
              as: FinanceManager
            - call: "GET /vehicles/${v_id}"
              payload: {}
              as: FinanceManager
