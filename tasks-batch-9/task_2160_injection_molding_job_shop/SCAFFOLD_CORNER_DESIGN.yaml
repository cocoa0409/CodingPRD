        distinguishing_aspect: "SCHEDULED -> RUNNING is the only declared start edge, so starting a DRAFT job (one that has never reserved press minutes) returns 409 ERR_JOB_NOT_SCHEDULED and leaves Press.committed_minutes_scheduled at 0."
        test_recipe:
          setup: ["A fully approved quote on mold M-1 and press P-150; a job has been created but never scheduled."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlantAdmin }
