            - { call: "POST /etax/work-locations", payload: { label: "Philly Office", address_line1: "1 Liberty Pl", city: "Philadelphia", state_code: "PA", postal_code: "19103", location_type: "COMPANY_OFFICE" }, as: NexusAnalyst, captures: { wl_pa: $.data.id } }
            - { call: "POST /etax/employees", payload: { employee_ref: "E-1111", full_name: "X One", resident_state_code: "PA", hire_date: "2026-08-01T00:00:00Z", annual_wage_cents: 6000000, current_work_location_id: "${wl_pa}" }, as: NexusAnalyst }
            - { call: "POST /etax/employees", payload: { employee_ref: "E-1112", full_name: "X Two", resident_state_code: "PA", hire_date: "2026-08-01T00:00:00Z", annual_wage_cents: 6000000, current_work_location_id: "${wl_pa}" }, as: NexusAnalyst }
            - { call: "POST /etax/employees", payload: { employee_ref: "E-1113", full_name: "X Three", resident_state_code: "PA", hire_date: "2026-08-01T00:00:00Z", annual_wage_cents: 6000000, current_work_location_id: "${wl_pa}" }, as: NexusAnalyst }
            - { call: "POST /etax/employees", payload: { employee_ref: "E-1114", full_name: "X Four", resident_state_code: "PA", hire_date: "2026-08-01T00:00:00Z", annual_wage_cents: 6000000, current_work_location_id: "${wl_pa}" }, as: NexusAnalyst }
            - { call: "POST /etax/employees", payload: { employee_ref: "E-1115", full_name: "X Five", resident_state_code: "PA", hire_date: "2026-08-01T00:00:00Z", annual_wage_cents: 6000000, current_work_location_id: "${wl_pa}" }, as: NexusAnalyst }
            - { call: "POST /etax/nexus-cases", payload: { state_code: "PA" }, as: NexusAnalyst, captures: { nc_pa: $.data.id } }
            - { call: "POST /etax/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: TaxDirector }
            - { call: "POST /etax/nexus-cases/${nc_pa}/recompute", payload: {}, as: NexusAnalyst }
            - { call: "POST /etax/nexus-cases/${nc_pa}/confirm", payload: {}, as: NexusAnalyst }
            - { call: "POST /etax/registrations", payload: { agency_id: "${ag_pa_ui}", projected_annual_withholding_cents: 0, expected_employer_version: "${emp_v}" }, as: NexusAnalyst, captures: { reg_pa_ui: $.data.id } }
            - { call: "POST /etax/registrations/${reg_pa_ui}/submit", payload: {}, as: NexusAnalyst }
            - { call: "POST /etax/registrations/${reg_pa_ui}/activate", payload: { account_number: "PA-UI-0006" }, as: NexusAnalyst, captures: { reg_pa_ui_v: $.data.version } }
            - { call: "POST /etax/ui-rates", payload: { registration_id: "${reg_pa_ui}", rate_year: 2026, experience_rated: true, assigned_rate_bp: 420, contributions_paid_3yr_cents: 600000, benefits_charged_3yr_cents: 200000, taxable_payroll_3yr_cents: 10000000, expected_registration_version: "${reg_pa_ui_v}" }, as: UISpecialist, captures: { rate_id: $.data.id } }
            - { call: "POST /etax/ui-rates/${rate_id}/review", payload: {}, as: UISpecialist }
            - { call: "POST /etax/ui-rates/${rate_id}/make_effective", payload: {}, as: UISpecialist }
            - { call: "POST /etax/voluntary-contributions", payload: { ui_rate_id: "${rate_id}", proposed_amount_cents: 100000, decision_deadline: "2026-12-01T00:00:00Z" }, as: UISpecialist, as_user_id: "uis-1", captures: { vc_id: $.data.id } }
            - { call: "POST /etax/agency-notices", payload: { registration_id: "${reg_pa_ui}", notice_type: "PENALTY_ASSESSMENT", received_date: "2026-08-10T00:00:00Z", response_due_date: "2026-09-10T00:00:00Z", penalty_amount_cents: 600000 }, as: PayrollComplianceLead, as_user_id: "pcl-1", captures: { n_id: $.data.id } }
            - { call: "POST /etax/agency-notices/${n_id}/triage", payload: {}, as: PayrollComplianceLead, as_user_id: "pcl-1" }
            - { call: "POST /etax/agency-notices/${n_id}/escalate", payload: {}, as: PayrollComplianceLead, as_user_id: "pcl-1" }
          trigger:
            - { call: "POST /etax/voluntary-contributions/${vc_id}/approve", payload: {}, as: TaxDirector, as_user_id: "dir-1", captures: { err: $.data.error_id } }
            - { call: "POST /etax/agency-notices/${n_id}/resolve", payload: { resolution_notes: "Paid in full" }, as: PayrollComplianceLead, as_user_id: "pcl-1" }
            - { call: "POST /etax/voluntary-contributions/${vc_id}/approve", payload: {}, as: TaxDirector, as_user_id: "dir-1", captures: { vc_status: $.data.status } }
          assert:
            - "While the notice is ESCALATED (posture DELINQUENT): error_id == ERR_COMPANY_POSTURE_DELINQUENT"
            - "After notice RESOLVED: approve succeeds, VC status == APPROVED"

      - name: courtesy_election_requires_active_registration
        grounds:
          - validations[priority=21]
          - state_machines.WithholdingElection.SUBMITTED_to_VALIDATED
          - errors[ERR_REGISTRATION_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pair WithholdingElection -> Registration (third distinct
          pair): a COURTESY_RESIDENT election validates only when an ACTIVE
          STATE_WITHHOLDING registration exists for the employee's resident
          state; before activation it fails with ERR_REGISTRATION_NOT_ACTIVE.
