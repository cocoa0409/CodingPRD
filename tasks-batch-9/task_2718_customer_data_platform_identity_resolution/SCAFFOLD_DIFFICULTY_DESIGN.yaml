                    email_raw: "b2@example.com"
                    phone_raw: "+1 (555) 120-0002"
                    loyalty_number: "LY00001102"
                    first_name: "Ben"
                    last_name: "Bravo"
                    postal_code: "10001"
                    address_line: null
                    event_timestamp: "2026-07-10T11:00:00Z"
                    consent_signals: []
