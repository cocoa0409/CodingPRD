  - rule_id: resource_temporal_overlap
    instances:
      - name: pattern_window_half_open_overlap_and_adjacency
        grounds:
          - state_machines.DevelopmentPattern.DRAFT_to_SELECTED
          - entities.DevelopmentPattern.fields.effective_from_quarter
          - errors[ERR_PATTERN_PERIOD_OVERLAP]
        distinguishing_aspect: |
          Resource DevelopmentPattern with HALF-OPEN window semantics
          [from, to): a second SELECTED pattern starting exactly at the first's
          effective_to_quarter (adjacency) is accepted, while one intersecting the
          interior is rejected — adjacency permitted distinguishes this from the
          catastrophe-event closed-interval rule.
        test_recipe:
          setup:
            - "Main Book shared fixture through triangle aggregation; pattern P1 created with window [2025-Q3, 2026-Q2) and SELECTED"
          setup_api_calls:
            - call: "POST /actuarial/segments"
              payload: { name: "Main Book", line_of_business: "COMMERCIAL_AUTO", large_loss_threshold_cents: 400000, max_range_width_pct: 0.5, benchmark_open_severity_cents: 50000 }
              as: AppointedActuary
              captures: { seg: $.data.id }
            - call: "POST /actuarial/claims"
              payload: { segment_id: "${seg}", claim_number: "C-A", accident_date: "2025-01-15", report_date: "2025-01-20" }
              as: ClaimsExaminer
              captures: { cl_a: $.data.id }
            - call: "POST /actuarial/claims/${cl_a}/transactions"
              payload: { type: "PAYMENT", transaction_date: "2025-02-01T00:00:00Z", amount_cents: 100000 }
              as: ClaimsExaminer
            - call: "POST /actuarial/triangles"
              payload: { segment_id: "${seg}", basis: "PAID", valuation_quarter: "2025-Q2" }
              as: ActuarialAnalyst
            - call: "POST /actuarial/development-patterns"
              payload: { segment_id: "${seg}", basis: "PAID", valuation_quarter: "2025-Q2", effective_from_quarter: "2025-Q3", effective_to_quarter: "2026-Q2" }
              as: ActuarialAnalyst
              captures: { pat1: $.data.id }
            - call: "POST /actuarial/development-patterns/${pat1}/select"
              as: ActuarialAnalyst
          trigger:
            - call: "POST /actuarial/development-patterns"
              payload: { segment_id: "${seg}", basis: "PAID", valuation_quarter: "2025-Q2", effective_from_quarter: "2026-Q2", effective_to_quarter: "2026-Q4" }
              as: ActuarialAnalyst
              captures: { pat2: $.data.id }
            - call: "POST /actuarial/development-patterns/${pat2}/select"
              as: ActuarialAnalyst
              captures: { pat2_status: $.data.status }
            - call: "POST /actuarial/development-patterns"
              payload: { segment_id: "${seg}", basis: "PAID", valuation_quarter: "2025-Q2", effective_from_quarter: "2026-Q1", effective_to_quarter: "2026-Q3" }
              as: ActuarialAnalyst
              captures: { pat3: $.data.id }
            - call: "POST /actuarial/development-patterns/${pat3}/select"
              as: ActuarialAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "pat2_status == SELECTED (adjacency at 2026-Q2 allowed under half-open semantics)"
            - "err == ERR_PATTERN_PERIOD_OVERLAP (window [2026-Q1, 2026-Q3) intersects P1's [2025-Q3, 2026-Q2))"
            - "DevelopmentPattern.${pat3}.status == DRAFT (unchanged)"
      - name: cat_event_closed_interval_touching_rejected
        grounds:
          - entities.CatastropheEvent.fields.start_date
          - entities.CatastropheEvent.fields.end_date
          - errors[ERR_CAT_EVENT_DATE_OVERLAP]
        distinguishing_aspect: |
          Resource CatastropheEvent with CLOSED interval semantics [start, end]:
          a second event whose start_date equals the first's end_date (2025-03-31)
          TOUCHES it and is rejected, while a genuinely disjoint window succeeds —
          the opposite adjacency treatment from the pattern-window rule, on a
          different resource entity.
        test_recipe:
          setup:
            - "Segment exists; catastrophe event CAT-1 occupying the closed interval [2025-01-01, 2025-03-31]"
          setup_api_calls:
            - call: "POST /actuarial/segments"
              payload: { name: "Cat Book", line_of_business: "PROPERTY", large_loss_threshold_cents: 400000, max_range_width_pct: 1.0, benchmark_open_severity_cents: 50000 }
              as: AppointedActuary
              captures: { seg: $.data.id }
            - call: "POST /actuarial/catastrophe-events"
              payload: { segment_id: "${seg}", name: "CAT-1", start_date: "2025-01-01", end_date: "2025-03-31" }
              as: AppointedActuary
              captures: { ev1: $.data.id }
          trigger:
            - call: "POST /actuarial/catastrophe-events"
              payload: { segment_id: "${seg}", name: "CAT-2", start_date: "2025-03-31", end_date: "2025-06-30" }
              as: AppointedActuary
              captures: { err: $.data.error_id }
            - call: "POST /actuarial/catastrophe-events"
              payload: { segment_id: "${seg}", name: "CAT-3", start_date: "2025-04-01", end_date: "2025-06-30" }
              as: AppointedActuary
              captures: { ev3: $.data.id }
          assert:
            - "err == ERR_CAT_EVENT_DATE_OVERLAP (touching endpoints conflict under closed-interval semantics)"
            - "CatastropheEvent.${ev3} created with 201 (disjoint interval accepted)"
  - rule_id: compensating_invariant
    instances:
      - name: payment_and_reversal_conserve_reported_incurred
        grounds:
          - entities.Claim.fields.reported_incurred_cents
          - entities.Claim.fields.paid_to_date_cents
          - errors[ERR_PAYMENT_REVERSAL_EXCEEDS_PAID]
        distinguishing_aspect: |
          Conserved quantity: claim-level reported incurred. A PAYMENT of 40000
          followed by its compensating PAYMENT_REVERSAL of 40000 leaves
          reported_incurred_cents == paid_to_date_cents + case_outstanding_cents
          identical to its pre-pair value (300000); the reversal is validated
          against paid_to_date so the invariant cannot be driven negative.
        test_recipe:
          setup:
            - "Segment; claim M-1 (AQ 2025-Q1) with a single 300000 payment; incurred == paid == 300000, case == 0"
          setup_api_calls:
            - call: "POST /actuarial/segments"
              payload: { name: "Inv Book", line_of_business: "GENERAL_LIABILITY", large_loss_threshold_cents: 400000, max_range_width_pct: 1.0, benchmark_open_severity_cents: 50000 }
              as: AppointedActuary
              captures: { seg: $.data.id }
            - call: "POST /actuarial/claims"
              payload: { segment_id: "${seg}", claim_number: "M-1", accident_date: "2025-01-15", report_date: "2025-01-20" }
              as: ClaimsExaminer
              captures: { cl_m: $.data.id }
            - call: "POST /actuarial/claims/${cl_m}/transactions"
              payload: { type: "PAYMENT", transaction_date: "2025-02-01T00:00:00Z", amount_cents: 300000 }
              as: ClaimsExaminer
          trigger:
            - call: "POST /actuarial/claims/${cl_m}/transactions"
              payload: { type: "PAYMENT", transaction_date: "2025-03-01T00:00:00Z", amount_cents: 40000 }
              as: ClaimsExaminer
            - call: "POST /actuarial/claims/${cl_m}/transactions"
              payload: { type: "PAYMENT_REVERSAL", transaction_date: "2025-03-05T00:00:00Z", amount_cents: 40000 }
              as: ClaimsExaminer
            - call: "GET /actuarial/claims/${cl_m}"
              as: ActuarialAnalyst
              captures: { paid: $.data.paid_to_date_cents, inc: $.data.reported_incurred_cents, case: $.data.case_outstanding_cents }
          assert:
            - "Claim.${cl_m}.paid_to_date_cents == 300000 (back to pre-pair value)"
            - "Claim.${cl_m}.reported_incurred_cents == 300000 == paid_to_date_cents + case_outstanding_cents (invariant holds across the forward+compensating pair)"
            - "Claim.${cl_m}.case_outstanding_cents == 0"
      - name: aggregation_diagonal_reconciles_with_segment_paid
        grounds:
          - calculations.triangle_aggregation
          - entities.LossTriangle.fields.cells
          - entities.LossTriangle.fields.is_stale
        distinguishing_aspect: |
          Conserved quantity of a different type — segment-level reconciliation, not
          a claim-level identity: the sum of the PAID triangle's latest-diagonal
          cells always equals net payments of non-segregated claims; a 55000 payment
          plus re-aggregation moves the diagonal total from 550000 to exactly 605000
          with no drift.
        test_recipe:
          setup:
            - "Main Book shared fixture through triangle aggregation at 2025-Q3 (diagonal total 550000 = 250000 AQ1 + 300000 AQ2 = net paid of claims C-A/C-B/C-D)"
          setup_api_calls:
            - call: "POST /actuarial/segments"
              payload: { name: "Main Book", line_of_business: "COMMERCIAL_AUTO", large_loss_threshold_cents: 400000, max_range_width_pct: 0.5, benchmark_open_severity_cents: 50000 }
              as: AppointedActuary
              captures: { seg: $.data.id }
            - call: "POST /actuarial/claims"
              payload: { segment_id: "${seg}", claim_number: "C-A", accident_date: "2025-01-15", report_date: "2025-01-20" }
              as: ClaimsExaminer
              captures: { cl_a: $.data.id }
            - call: "POST /actuarial/claims/${cl_a}/transactions"
              payload: { type: "PAYMENT", transaction_date: "2025-02-01T00:00:00Z", amount_cents: 100000 }
              as: ClaimsExaminer
            - call: "POST /actuarial/claims/${cl_a}/transactions"
              payload: { type: "PAYMENT", transaction_date: "2025-05-01T00:00:00Z", amount_cents: 100000 }
              as: ClaimsExaminer
            - call: "POST /actuarial/claims/${cl_a}/transactions"
              payload: { type: "PAYMENT", transaction_date: "2025-09-01T00:00:00Z", amount_cents: 50000 }
              as: ClaimsExaminer
            - call: "POST /actuarial/claims"
              payload: { segment_id: "${seg}", claim_number: "C-B", accident_date: "2025-04-10", report_date: "2025-04-12" }
              as: ClaimsExaminer
              captures: { cl_b: $.data.id }
            - call: "POST /actuarial/claims/${cl_b}/transactions"
              payload: { type: "PAYMENT", transaction_date: "2025-05-15T00:00:00Z", amount_cents: 200000 }
              as: ClaimsExaminer
            - call: "POST /actuarial/claims/${cl_b}/transactions"
              payload: { type: "PAYMENT", transaction_date: "2025-08-10T00:00:00Z", amount_cents: 100000 }
              as: ClaimsExaminer
            - call: "POST /actuarial/claims"
              payload: { segment_id: "${seg}", claim_number: "C-D", accident_date: "2025-04-10", report_date: "2025-04-15" }
              as: ClaimsExaminer
              captures: { cl_d: $.data.id }
            - call: "POST /actuarial/claims/${cl_d}/transactions"
              payload: { type: "PAYMENT", transaction_date: "2025-05-01T00:00:00Z", amount_cents: 100000 }
              as: ClaimsExaminer
            - call: "POST /actuarial/triangles"
              payload: { segment_id: "${seg}", basis: "PAID", valuation_quarter: "2025-Q3" }
              as: ActuarialAnalyst
              captures: { tri: $.data.id }
          trigger:
            - call: "POST /actuarial/claims/${cl_d}/transactions"
              payload: { type: "PAYMENT", transaction_date: "2025-09-20T00:00:00Z", amount_cents: 55000 }
              as: ClaimsExaminer
            - call: "GET /actuarial/triangles/${tri}"
              as: ActuarialAnalyst
              captures: { stale_mid: $.data.is_stale }
            - call: "POST /actuarial/triangles"
              payload: { segment_id: "${seg}", basis: "PAID", valuation_quarter: "2025-Q3" }
              as: ActuarialAnalyst
              captures: { cells: $.data.cells, stale_after: $.data.is_stale }
          assert:
            - "stale_mid == true (payment dirtied the triangle before re-aggregation)"
            - "After re-aggregation the latest diagonal is AQ1 dev2 == 250000 and AQ2 dev1 == 355000 (300000 + 55000)"
            - "Diagonal total == 605000 == 550000 + 55000 exactly; stale_after == false"
