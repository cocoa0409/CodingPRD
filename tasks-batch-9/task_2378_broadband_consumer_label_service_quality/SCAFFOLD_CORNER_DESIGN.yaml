              payload: { finding: "UPHELD", resolution_note: "Shortfall confirmed against the pinned typical speed", credit_basis: "PRORATA_DAYS" }
              as: ComplaintAnalyst
            - call: "GET /complaints/${cmp_id}/remediation-credits"
              payload: {}
              as: ComplaintAnalyst
              captures: { credit_id: "$.data[0].id" }
            - call: "GET /subscriber-accounts/${acct_id}"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /service-plans/${plan_id}"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /remediation-credits/${credit_id}"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "the resolve response body already contains state == UPHELD, resolution == UPHELD, shortfall_ratio == 0.5000, severity == SEVERE and remediation_credit_cents == 942 — no second read is required to observe the calculation"
            - "the credit list returns total_count == 1 immediately with RemediationCredit.${credit_id}.amount_cents == 942, status == ISSUED and basis == PRORATA_DAYS"
            - "SubscriberAccount.${acct_id}.credit_balance_cents == 942 and remediation_count == 1 on the first read after the write"
            - "ServicePlan.${plan_id}.upheld_complaint_count == 1 and label_posture == OPEN on the first read after the write"
            - "every one of these values is observable in the same test without any retry, sleep or re-read loop"

