# =============================================================================
# §1.9 Scaffold Corner Design (breadth probe)
# Enumerates testable §1.1-§1.7 claims not already covered by §1.8.
# excluded_because stubs point at the covering §1.8 instance by name.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: customer_create_success_echoes_fields
        claim_type: Creation
        grounds: [entities.Customer, endpoints]
        distinguishing_aspect: "POST /customers with all required fields returns 201, referral_credit_cents defaults to 0, and a server-minted id/version=1."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { full_name: "Ada A", email: "ada@x.com", phone: "555-30", street_address: "30 Way", city: "LA", state_code: "CA", postal_code: "90030" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Customer.${cust_id}.referral_credit_cents == 0"
            - "Customer.${cust_id}.version == 1"

      - name: designer_active_default_applied
        claim_type: Defaults
        grounds: [entities.Designer.fields.active]
        distinguishing_aspect: "POST /designers omitting active defaults active to true."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /designers"
              payload: { full_name: "Dee D", email: "dee@x.com", region_state_code: "CA" }
              as: PlatformAdmin
              captures: { des_id: $.data.id }
          assert:
            - "Designer.${des_id}.active == true"

      - name: project_get_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Project, "errors[ERR_PROJECT_NOT_FOUND]"]
        distinguishing_aspect: "GET /projects/{unknown uuid} returns 404 ERR_PROJECT_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /projects/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: InstallCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_PROJECT_NOT_FOUND"

      - name: project_create_missing_bathroom_type_returns_validation
        claim_type: Required Fields
        grounds: [entities.Project.fields.bathroom_type, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /projects omitting bathroom_type returns 422 ERR_VALIDATION."
        test_recipe:
          setup: ["A customer exists"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Ada A", email: "ada2@x.com", phone: "555-31", street_address: "31 Way", city: "LA", state_code: "CA", postal_code: "90031" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", state_code: "CA" }
              as: InstallCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_VALIDATION"

      - name: project_create_invalid_enum_bathroom_type_returns_validation
        claim_type: Type Constraints
        grounds: [entities.Project.fields.bathroom_type, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /projects with bathroom_type='PALACE' (not in enum) returns 422 ERR_VALIDATION."
        test_recipe:
          setup: ["A customer exists"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Ada A", email: "ada3@x.com", phone: "555-32", street_address: "32 Way", city: "LA", state_code: "CA", postal_code: "90032" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", state_code: "CA", bathroom_type: "PALACE" }
              as: InstallCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_VALIDATION"

      - name: project_create_unknown_customer_returns_customer_not_found
        claim_type: Parent Relationships
        grounds: [entities.Project.fields.customer_id, "errors[ERR_CUSTOMER_NOT_FOUND]"]
        distinguishing_aspect: "POST /projects with a customer_id that does not resolve returns 404 ERR_CUSTOMER_NOT_FOUND (FK integrity)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /projects"
              payload: { customer_id: "00000000-0000-0000-0000-000000000000", state_code: "CA", bathroom_type: "FULL_BATH" }
              as: InstallCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_CUSTOMER_NOT_FOUND"

      - name: appointment_create_unknown_designer_returns_designer_not_found
        claim_type: Parent Relationships
        grounds: [entities.DesignAppointment.fields.designer_id, "errors[ERR_DESIGNER_NOT_FOUND]"]
        distinguishing_aspect: "POST /design-appointments with an unresolved designer_id returns 404 ERR_DESIGNER_NOT_FOUND."
        test_recipe:
          setup: ["A customer and project exist"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Ada A", email: "ada4@x.com", phone: "555-33", street_address: "33 Way", city: "LA", state_code: "CA", postal_code: "90033" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", state_code: "CA", bathroom_type: "FULL_BATH" }
              as: InstallCoordinator
              captures: { proj_id: $.data.id }
          trigger:
            - call: "POST /design-appointments"
              payload: { project_id: "${proj_id}", designer_id: "00000000-0000-0000-0000-000000000000", scheduled_start: "2026-05-10T14:00:00Z", scheduled_end: "2026-05-10T15:00:00Z" }
              as: InstallCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_DESIGNER_NOT_FOUND"

      - name: project_list_pagination_envelope
        claim_type: Listing
        grounds: [entities.Project, endpoints]
        distinguishing_aspect: "GET /projects returns an array envelope with total_count and has_more; limit/offset honored."
        test_recipe:
          setup: ["One customer with one project"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Ada A", email: "ada5@x.com", phone: "555-34", street_address: "34 Way", city: "LA", state_code: "CA", postal_code: "90034" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", state_code: "CA", bathroom_type: "FULL_BATH" }
              as: InstallCoordinator
              captures: { proj_id: $.data.id }
          trigger:
            - call: "GET /projects"
              payload: { customer_id: "${cust_id}", limit: 10, offset: 0 }
              as: InstallCoordinator
          assert:
            - "response.response_type == array"
            - "response.meta.total_count == 1"
            - "response.meta.has_more == false"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: quote_accept_from_draft_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Quote.PRESENTED_to_ACCEPTED, "errors[ERR_QUOTE_INVALID_STATE]"]
        distinguishing_aspect: "Accepting a DRAFT (never PRESENTED) quote returns 409 ERR_QUOTE_INVALID_STATE; no side effects fire."
        test_recipe:
          setup: ["A DESIGN_COMPLETE project with a DRAFT quote (not presented)"]
          setup_api_calls:
            - call: "POST /designers"
              payload: { full_name: "Dee D", email: "dee2@x.com", region_state_code: "CA" }
              as: PlatformAdmin
              captures: { des_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Ada A", email: "ada6@x.com", phone: "555-35", street_address: "35 Way", city: "LA", state_code: "CA", postal_code: "90035" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", state_code: "CA", bathroom_type: "FULL_BATH" }
              as: InstallCoordinator
              captures: { proj_id: $.data.id }
            - call: "POST /design-appointments"
              payload: { project_id: "${proj_id}", designer_id: "${des_id}", scheduled_start: "2026-05-10T14:00:00Z", scheduled_end: "2026-05-10T15:00:00Z" }
              as: InstallCoordinator
              captures: { appt_id: $.data.id }
            - call: "POST /design-appointments/${appt_id}/complete"
              payload: { measured_wall_area_sqft: 100 }
              as: Designer
              as_user_id: "${des_id}"
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: InstallCoordinator
              captures: { p_v: $.data.version }
            - call: "POST /quotes"
              payload: { project_id: "${proj_id}", wall_system: "TILE_LOOK_ACRYLIC", color: "WHITE", expected_project_version: "${p_v}" }
              as: Designer
              as_user_id: "${des_id}"
              captures: { q_id: $.data.id }
          trigger:
            - call: "POST /quotes/${q_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_QUOTE_INVALID_STATE"

      - name: project_cancel_when_already_cancelled_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Project, "errors[ERR_PROJECT_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling an already-CANCELLED project returns 409 ERR_PROJECT_INVALID_STATE."
        test_recipe:
          setup: ["A LEAD project already cancelled"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Ada A", email: "ada7@x.com", phone: "555-36", street_address: "36 Way", city: "LA", state_code: "CA", postal_code: "90036" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", state_code: "CA", bathroom_type: "FULL_BATH" }
              as: InstallCoordinator
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/cancel"
              payload: { cancel_reason: "first" }
              as: InstallCoordinator
          trigger:
            - call: "POST /projects/${proj_id}/cancel"
              payload: { cancel_reason: "second" }
              as: InstallCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_PROJECT_INVALID_STATE"

      - name: appointment_complete_twice_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.DesignAppointment.SCHEDULED_to_COMPLETED, "errors[ERR_APPOINTMENT_INVALID_STATE]"]
        distinguishing_aspect: "Completing an appointment a second time returns 409 ERR_APPOINTMENT_INVALID_STATE (status already COMPLETED)."
        test_recipe:
          setup: ["A COMPLETED design appointment"]
          setup_api_calls:
            - call: "POST /designers"
              payload: { full_name: "Dee D", email: "dee3@x.com", region_state_code: "CA" }
              as: PlatformAdmin
              captures: { des_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Ada A", email: "ada8@x.com", phone: "555-37", street_address: "37 Way", city: "LA", state_code: "CA", postal_code: "90037" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", state_code: "CA", bathroom_type: "FULL_BATH" }
              as: InstallCoordinator
              captures: { proj_id: $.data.id }
            - call: "POST /design-appointments"
              payload: { project_id: "${proj_id}", designer_id: "${des_id}", scheduled_start: "2026-05-10T14:00:00Z", scheduled_end: "2026-05-10T15:00:00Z" }
              as: InstallCoordinator
              captures: { appt_id: $.data.id }
            - call: "POST /design-appointments/${appt_id}/complete"
              payload: { measured_wall_area_sqft: 100 }
              as: Designer
              as_user_id: "${des_id}"
          trigger:
            - call: "POST /design-appointments/${appt_id}/complete"
              payload: { measured_wall_area_sqft: 120 }
              as: Designer
              as_user_id: "${des_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_APPOINTMENT_INVALID_STATE"

      - name: quote_request_revision_cycle_bumps_round_and_reverts_project
        claim_type: Valid Transition
        grounds: [state_machines.Quote.PRESENTED_to_REVISION_REQUESTED, entities.Quote.fields.revision_round, state_machines.Project.QUOTED_to_DESIGN_COMPLETE]
        distinguishing_aspect: "request-revision on a PRESENTED quote sets status REVISION_REQUESTED, revision_round 1, and reverts Project QUOTED->DESIGN_COMPLETE (cyclic loop)."
        test_recipe:
          setup: ["A PRESENTED quote (Project QUOTED)"]
          setup_api_calls:
            - call: "POST /designers"
              payload: { full_name: "Dee D", email: "dee4@x.com", region_state_code: "CA" }
              as: PlatformAdmin
              captures: { des_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Ada A", email: "ada9@x.com", phone: "555-38", street_address: "38 Way", city: "LA", state_code: "CA", postal_code: "90038" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", state_code: "CA", bathroom_type: "FULL_BATH" }
              as: InstallCoordinator
              captures: { proj_id: $.data.id }
            - call: "POST /design-appointments"
              payload: { project_id: "${proj_id}", designer_id: "${des_id}", scheduled_start: "2026-05-10T14:00:00Z", scheduled_end: "2026-05-10T15:00:00Z" }
              as: InstallCoordinator
              captures: { appt_id: $.data.id }
            - call: "POST /design-appointments/${appt_id}/complete"
              payload: { measured_wall_area_sqft: 100 }
              as: Designer
              as_user_id: "${des_id}"
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: InstallCoordinator
              captures: { p_v: $.data.version }
            - call: "POST /quotes"
              payload: { project_id: "${proj_id}", wall_system: "TILE_LOOK_ACRYLIC", color: "WHITE", expected_project_version: "${p_v}" }
              as: Designer
              as_user_id: "${des_id}"
              captures: { q_id: $.data.id }
            - call: "POST /quotes/${q_id}/present"
              payload: {}
              as: Designer
              as_user_id: "${des_id}"
          trigger:
            - call: "POST /quotes/${q_id}/request-revision"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "Quote.${q_id}.status == REVISION_REQUESTED"
            - "Quote.${q_id}.revision_round == 1"
            - "Project.${proj_id}.status == DESIGN_COMPLETE"

      - name: warranty_claim_reject_branch_sets_denied
        claim_type: Invalid Transitions
        grounds: [state_machines.WarrantyClaim.SUBMITTED_to_REJECTED, entities.WarrantyClaim.fields.resolution]
        distinguishing_aspect: "decide REJECT on a SUBMITTED claim sets status REJECTED and resolution DENIED -- the sibling branch of the §1.8 approve path."
        test_recipe:
          setup: ["An INSTALLED project (warranty ACTIVE) with a SUBMITTED claim"]
          setup_api_calls:
            - call: "POST /designers"
              payload: { full_name: "Dee D", email: "dee5@x.com", region_state_code: "CA" }
              as: PlatformAdmin
              captures: { des_id: $.data.id }
            - call: "POST /crews"
              payload: { crew_name: "Crew W", home_state_code: "CA", max_installs_per_day: 2 }
              as: PlatformAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Ada A", email: "ada10@x.com", phone: "555-39", street_address: "39 Way", city: "LA", state_code: "CA", postal_code: "90039" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", state_code: "CA", bathroom_type: "FULL_BATH" }
              as: InstallCoordinator
              captures: { proj_id: $.data.id }
            - call: "POST /design-appointments"
              payload: { project_id: "${proj_id}", designer_id: "${des_id}", scheduled_start: "2026-05-10T14:00:00Z", scheduled_end: "2026-05-10T15:00:00Z" }
              as: InstallCoordinator
              captures: { appt_id: $.data.id }
            - call: "POST /design-appointments/${appt_id}/complete"
              payload: { measured_wall_area_sqft: 100 }
              as: Designer
              as_user_id: "${des_id}"
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: InstallCoordinator
              captures: { p_v: $.data.version }
            - call: "POST /quotes"
              payload: { project_id: "${proj_id}", wall_system: "TILE_LOOK_ACRYLIC", color: "WHITE", expected_project_version: "${p_v}" }
              as: Designer
              as_user_id: "${des_id}"
              captures: { q_id: $.data.id }
            - call: "POST /quotes/${q_id}/present"
              payload: {}
              as: Designer
              as_user_id: "${des_id}"
            - call: "POST /quotes/${q_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /install-bookings"
              payload: { project_id: "${proj_id}", crew_id: "${crew_id}", install_date: "2026-06-01T00:00:00Z" }
              as: InstallCoordinator
              captures: { book_id: $.data.id }
            - call: "POST /install-bookings/${book_id}/complete"
              payload: {}
              as: InstallCoordinator
            - call: "POST /warranty-claims"
              payload: { project_id: "${proj_id}", defect_type: "LEAK", description: "seam leak" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /warranty-claims/${claim_id}/decide"
              payload: { decision: "REJECT", review_notes: "wear and tear, not covered" }
              as: InstallCoordinator
          assert:
            - "WarrantyClaim.${claim_id}.status == REJECTED"
            - "WarrantyClaim.${claim_id}.resolution == DENIED"

      - name: finance_decide_decline_then_accept_blocked
        claim_type: Guarded transitions
        grounds: [state_machines.Quote.REQUESTED_to_DECLINED, "errors[ERR_FINANCING_NOT_APPROVED]"]
        distinguishing_aspect: "After finance-decide DECLINE (financing_status DECLINED), accept returns 409 ERR_FINANCING_NOT_APPROVED (cross-dimension guard)."
        test_recipe:
          setup: ["A PRESENTED quote with financing REQUESTED then DECLINED"]
          setup_api_calls:
            - call: "POST /designers"
              payload: { full_name: "Dee D", email: "dee6@x.com", region_state_code: "CA" }
              as: PlatformAdmin
              captures: { des_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Ada A", email: "ada11@x.com", phone: "555-40", street_address: "40 Way", city: "LA", state_code: "CA", postal_code: "90040" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", state_code: "CA", bathroom_type: "FULL_BATH" }
              as: InstallCoordinator
              captures: { proj_id: $.data.id }
            - call: "POST /design-appointments"
              payload: { project_id: "${proj_id}", designer_id: "${des_id}", scheduled_start: "2026-05-10T14:00:00Z", scheduled_end: "2026-05-10T15:00:00Z" }
              as: InstallCoordinator
              captures: { appt_id: $.data.id }
            - call: "POST /design-appointments/${appt_id}/complete"
              payload: { measured_wall_area_sqft: 100 }
              as: Designer
              as_user_id: "${des_id}"
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: InstallCoordinator
              captures: { p_v: $.data.version }
            - call: "POST /quotes"
              payload: { project_id: "${proj_id}", wall_system: "TILE_LOOK_ACRYLIC", color: "WHITE", financing_plan_code: "PLAN_60_999", requested_amount_cents: 488520, stated_annual_income_cents: 6000000, expected_project_version: "${p_v}" }
              as: Designer
              as_user_id: "${des_id}"
              captures: { q_id: $.data.id }
            - call: "POST /quotes/${q_id}/present"
              payload: {}
              as: Designer
              as_user_id: "${des_id}"
            - call: "POST /quotes/${q_id}/finance-decide"
              payload: { decision: "DECLINE" }
              as: FinanceOfficer
          trigger:
            - call: "POST /quotes/${q_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Quote.${q_id}.financing_status == DECLINED"
            - "response.status == 409"
            - "response.data.error_id == ERR_FINANCING_NOT_APPROVED"

      - name: install_booking_cancel_reverts_project_to_install_ready
        claim_type: Valid Transition
        grounds: [state_machines.InstallBooking.BOOKED_to_CANCELLED, state_machines.Project.INSTALL_SCHEDULED_to_INSTALL_READY]
        distinguishing_aspect: "Cancelling a BOOKED install reverts Project INSTALL_SCHEDULED->INSTALL_READY and frees the crew slot."
        test_recipe:
          setup: ["An INSTALL_SCHEDULED project with a BOOKED install"]
          setup_api_calls:
            - call: "POST /designers"
              payload: { full_name: "Dee D", email: "dee7@x.com", region_state_code: "CA" }
              as: PlatformAdmin
              captures: { des_id: $.data.id }
            - call: "POST /crews"
              payload: { crew_name: "Crew R", home_state_code: "CA", max_installs_per_day: 2 }
              as: PlatformAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Ada A", email: "ada12@x.com", phone: "555-41", street_address: "41 Way", city: "LA", state_code: "CA", postal_code: "90041" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", state_code: "CA", bathroom_type: "FULL_BATH" }
              as: InstallCoordinator
              captures: { proj_id: $.data.id }
            - call: "POST /design-appointments"
              payload: { project_id: "${proj_id}", designer_id: "${des_id}", scheduled_start: "2026-05-10T14:00:00Z", scheduled_end: "2026-05-10T15:00:00Z" }
              as: InstallCoordinator
              captures: { appt_id: $.data.id }
            - call: "POST /design-appointments/${appt_id}/complete"
              payload: { measured_wall_area_sqft: 100 }
              as: Designer
              as_user_id: "${des_id}"
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: InstallCoordinator
              captures: { p_v: $.data.version }
            - call: "POST /quotes"
              payload: { project_id: "${proj_id}", wall_system: "TILE_LOOK_ACRYLIC", color: "WHITE", expected_project_version: "${p_v}" }
              as: Designer
              as_user_id: "${des_id}"
              captures: { q_id: $.data.id }
            - call: "POST /quotes/${q_id}/present"
              payload: {}
