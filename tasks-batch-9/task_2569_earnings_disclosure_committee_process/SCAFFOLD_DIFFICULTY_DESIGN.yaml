            - "${sc1_window_start} == \"2026-08-01T18:00:00Z\""
            - "the second request is accepted with HTTP 201 even though its window [2026-07-29T18:00:00Z, 2026-08-01T18:00:00Z] touches the first at exactly 2026-08-01T18:00:00Z — one occupant is below the cap of 2"
            - "${sc2_status} == PENDING"
            - "the third request returns HTTP 409 with ${err_capacity} == ERR_MEMBER_PREP_WINDOW_CAPACITY because its window [2026-07-30T00:00:00Z, 2026-08-02T00:00:00Z] intersects BOTH predecessors"
            - "${sc2_status_after} == WITHDRAWN"
            - "the identical third request now returns HTTP 201: WITHDRAWN rows are not occupants, so only one occupant remains"
            - "${sc3_window_start} == \"2026-07-30T00:00:00Z\""
            - "${total_weight_final} == 50.00"
            - "SubCertificationRequest.${sc1_id}.scope_weight == 30.00 (REVENUE base) and SubCertificationRequest.${sc3_id}.scope_weight == 20.00 (OPERATIONS base), so the withdrawn 25.00 LEGAL_CONTINGENCY row left no residue in the cycle total"

  - rule_id: compensating_invariant
    instances:
      - name: subcertification_withdrawal_restores_both_conserved_cycle_aggregates_with_zero_drift
        grounds:
          - calculations.cycle_total_assigned_scope_weight
          - calculations.certification_coverage_pct
          - state_machines.SubCertificationRequest.PENDING_to_WITHDRAWN
          - entities.ReportingCycle.fields.total_assigned_scope_weight
          - entities.ReportingCycle.fields.certification_coverage_pct
        distinguishing_aspect: |
          WITHDRAW is the compensating action for assignment, and it must restore TWO aggregates at
          once: the conserved sum total_assigned_scope_weight and the ratio certification_coverage_pct,
          whose DENOMINATOR is the very quantity being removed. Adding a 20.00 OPERATIONS row drops
          coverage from 54.55 to 40.00 without any submission changing, and withdrawing it must return
          coverage to exactly 54.55 — recoverable only because both aggregates are recomputed in full
          from the source rows rather than adjusted incrementally. Running the add/withdraw pair a
          SECOND time must reproduce the identical four numbers, proving no rounding residue
          accumulates in a value (30/55*100 = 54.5454...) whose exact form is not representable.
        test_recipe:
          setup:
            - "An ADOPTED charter (min_quorum_count 2, required_functions [FINANCE, LEGAL]) with one ACTIVE voting FINANCE member and one ACTIVE voting LEGAL member."
            - "A ReportingCycle in CLOSE_OPEN carrying one SUBMITTED REVENUE sub-certification weighted 30.00 held by the FINANCE member and one PENDING LEGAL_CONTINGENCY sub-certification weighted 25.00 held by the LEGAL member."
            - "total_assigned_scope_weight is 55.00 and certification_coverage_pct is 54.55."
          setup_api_calls:
            - call: "POST /disclosure/charters"
              payload: { name: "Conservation Charter", version_label: "2026.1", min_quorum_count: 2, required_functions: ["FINANCE", "LEGAL"] }
              as: ComplianceAdmin
              captures: { charter_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/members"
              payload: { full_name: "Nora Finance", function: "FINANCE", is_officer: false, voting: true }
              as: ComplianceAdmin
              captures: { fin_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/members"
              payload: { full_name: "Owen Legal", function: "LEGAL", is_officer: false, voting: true }
              as: ComplianceAdmin
              captures: { legal_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/transitions"
              payload: { action: "ADOPT" }
              as: DisclosureCommitteeChair
              as_user_id: "${legal_id}"
            - call: "POST /disclosure/reporting-cycles"
              payload: { fiscal_period_label: "FY2026-Q2", form_type: "FORM_10Q", period_end_date: "2026-06-30", filer_status: "LARGE_ACCELERATED", materiality_base_amount: 10000000, charter_id: "${charter_id}", internal_buffer_days: 5 }
              as: ComplianceAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/milestones"
              payload: { kind: "CLOSE", planned_start_utc: "2026-08-01T00:00:00Z", planned_end_utc: "2026-08-03T00:00:00Z" }
              as: Controller
              as_user_id: "${fin_id}"
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/transitions"
              payload: { action: "OPEN_CLOSE" }
              as: Controller
              as_user_id: "${fin_id}"
            - call: "POST /disclosure/sub-certifications"
              payload: { cycle_id: "${cycle_id}", member_id: "${fin_id}", scope_area: "REVENUE", due_utc: "2026-08-04T18:00:00Z" }
              as: DisclosureCommitteeChair
              as_user_id: "${legal_id}"
              captures: { sc_a_id: $.data.id }
            - call: "POST /disclosure/sub-certifications/${sc_a_id}/transitions"
              payload: { action: "SUBMIT" }
              as: BusinessLeader
              as_user_id: "${fin_id}"
              captures: { sc_a_weight: $.data.scope_weight }
            - call: "POST /disclosure/sub-certifications"
              payload: { cycle_id: "${cycle_id}", member_id: "${legal_id}", scope_area: "LEGAL_CONTINGENCY", due_utc: "2026-08-04T18:00:00Z" }
              as: DisclosureCommitteeChair
              as_user_id: "${legal_id}"
              captures: { sc_b_id: $.data.id, sc_b_weight: $.data.scope_weight }
            - call: "GET /disclosure/reporting-cycles/${cycle_id}"
              payload: {}
              as: ComplianceAdmin
              captures: { weight_before: $.data.total_assigned_scope_weight, coverage_before: $.data.certification_coverage_pct }
          trigger:
            - call: "POST /disclosure/sub-certifications"
              payload: { cycle_id: "${cycle_id}", member_id: "${fin_id}", scope_area: "OPERATIONS", due_utc: "2026-08-05T12:00:00Z" }
              as: DisclosureCommitteeChair
              as_user_id: "${legal_id}"
              captures: { sc_c_id: $.data.id, sc_c_weight: $.data.scope_weight }
            - call: "GET /disclosure/reporting-cycles/${cycle_id}"
              payload: {}
              as: ComplianceAdmin
              captures: { weight_mid1: $.data.total_assigned_scope_weight, coverage_mid1: $.data.certification_coverage_pct }
            - call: "POST /disclosure/sub-certifications/${sc_c_id}/transitions"
              payload: { action: "WITHDRAW" }
              as: DisclosureCommitteeChair
              as_user_id: "${legal_id}"
              captures: { sc_c_status: $.data.status }
            - call: "GET /disclosure/reporting-cycles/${cycle_id}"
              payload: {}
              as: ComplianceAdmin
              captures: { weight_back1: $.data.total_assigned_scope_weight, coverage_back1: $.data.certification_coverage_pct }
            - call: "POST /disclosure/sub-certifications"
              payload: { cycle_id: "${cycle_id}", member_id: "${fin_id}", scope_area: "OPERATIONS", due_utc: "2026-08-05T12:00:00Z" }
              as: DisclosureCommitteeChair
              as_user_id: "${legal_id}"
              captures: { sc_d_id: $.data.id }
            - call: "GET /disclosure/reporting-cycles/${cycle_id}"
              payload: {}
              as: ComplianceAdmin
              captures: { weight_mid2: $.data.total_assigned_scope_weight, coverage_mid2: $.data.certification_coverage_pct }
            - call: "POST /disclosure/sub-certifications/${sc_d_id}/transitions"
              payload: { action: "WITHDRAW" }
              as: DisclosureCommitteeChair
              as_user_id: "${legal_id}"
              captures: { sc_d_status: $.data.status }
            - call: "GET /disclosure/reporting-cycles/${cycle_id}"
              payload: {}
              as: ComplianceAdmin
              captures: { weight_back2: $.data.total_assigned_scope_weight, coverage_back2: $.data.certification_coverage_pct }
          assert:
            - "${sc_a_weight} == 30.00"
            - "${sc_b_weight} == 25.00"
            - "${weight_before} == 55.00"
            - "${coverage_before} == 54.55"
            - "${sc_c_weight} == 20.00"
            - "${weight_mid1} == 75.00"
            - "${coverage_mid1} == 40.00"
            - "${sc_c_status} == WITHDRAWN"
            - "${weight_back1} == 55.00"
            - "${coverage_back1} == 54.55"
            - "${weight_mid2} == 75.00"
            - "${coverage_mid2} == 40.00"
            - "${sc_d_status} == WITHDRAWN"
            - "${weight_back2} == 55.00"
            - "${coverage_back2} == 54.55"
            - "${weight_back2} == ${weight_before} and ${coverage_back2} == ${coverage_before} — two full add/withdraw cycles leave no drift"
            - "SubCertificationRequest.${sc_a_id}.status == SUBMITTED and SubCertificationRequest.${sc_b_id}.status == PENDING throughout — the compensation touched only the withdrawn rows"
            - "re-creating the OPERATIONS row after withdrawal is accepted, because ERR_DUPLICATE_SUBCERT only guards non-terminal rows"

      - name: correction_rescission_reverses_the_deficiency_weight_and_the_restatement_stage_but_not_the_filing
        grounds:
          - state_machines.PostFilingCorrection.ASSESSED_to_RESCINDED
          - state_machines.ControlDeficiency.OPEN_to_REVERSED
          - state_machines.ReportingCycle.RESTATEMENT_DECLARED_to_NONE
          - calculations.cycle_unresolved_deficiency_weight
          - calculations.control_deficiency_severity
        distinguishing_aspect: |
          RESCIND is the declared compensating action for ASSESS, and it must undo a FOUR-hop cascade
          in full: the correction's derived fields return to null, the cascade-created ControlDeficiency
          moves OPEN -> REVERSED (never deleted), unresolved_deficiency_weight returns to exactly 0.00,
          and restatement_stage walks RESTATEMENT_DECLARED -> NONE. What must NOT be reversed is the
          cycle's own status: the Form 10-Q was really filed, so status stays FILED and the Filing row
          stays SUBMITTED. The asymmetry between "reverse the assessment" and "do not reverse the
          filing" is the whole point, and the REVERSED deficiency keeps its severity_score 5.83 and
          deficiency_weight 23.32 as an audit trail even though it no longer counts toward the total.
        test_recipe:
          setup:
            - "A cycle driven all the way to status FILED with one SUBMITTED Filing, reached through the full close/review/certification gate stack."
            - "One PostFilingCorrection in DRAFT on that Filing: error_amount 400000, current_period_pretax_income 10000000, prior_period_pretax_income 12000000, cumulative_prior_uncorrected_amount 300000."
            - "cycle.restatement_stage is UNDER_EVALUATION (raised by the correction's creation) and cycle.unresolved_deficiency_weight is 0.00."
