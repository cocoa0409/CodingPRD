scaffold_corner_design:

  # =========================================================================
  # Section: entities
  # =========================================================================
  - section: entities
    instances:

      - name: create_patient_returns_all_fields_and_system_defaults
        claim_type: Creation
        grounds: ["entities.Patient", "endpoints.POST_/prosthetics/patients"]
        distinguishing_aspect: "A created Patient returns HTTP 201 with a server-minted uuid id, version 1, write_gate_active false, delivered_prosthesis_count 0 and last_frequency_anchor_at null."
        test_recipe:
          setup: ["Empty database with the logical clock at its 2026-05-01T00:00:00Z default."]
          setup_api_calls:
            - call: "POST /prosthetics/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-root"
          trigger:
            - call: "POST /prosthetics/patients"
              payload: { full_name: "Anouk Bergstrom", date_of_birth: "1950-02-02", phone: "555-1000" }
              as: FrontOffice
              as_user_id: "fo-lindgren"
              captures: { pat_id: $.data.id }
          assert:
            - "HTTP status is 201"
            - "Patient.${pat_id}.version == 1"
            - "Patient.${pat_id}.write_gate_active == false"
            - "Patient.${pat_id}.delivered_prosthesis_count == 0"
            - "Patient.${pat_id}.last_frequency_anchor_at is null"
            - "the id is a bare uuid with no type prefix"

      - name: missing_required_field_on_patient_create_returns_invalid_request
        claim_type: Required Fields
        grounds: ["validations[priority=7]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting phone, a required input with no default, is refused by rung 7 with ERR_VALIDATION and HTTP 400, and no Patient row is created."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /prosthetics/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-root"
          trigger:
            - call: "POST /prosthetics/patients"
              payload: { full_name: "Bo Karlsen", date_of_birth: "1951-03-03" }
              as: FrontOffice
              as_user_id: "fo-lindgren"
              captures: { err: $.data.error_id }
          assert:
            - "the trigger returns HTTP 400"
            - "${err} == ERR_VALIDATION"
            - "GET /prosthetics/patients returns total_count 0"

      - name: coverage_defaults_applied_when_optional_fields_omitted
        claim_type: Defaults
        grounds: ["entities.Coverage.fields.annual_maximum_amount", "entities.Coverage.fields.cob_convention", "entities.Coverage.fields.waiting_period_days"]
        distinguishing_aspect: "A Coverage created with only the four required fields lands on annual_maximum_amount 1500.00, coinsurance_major_rate 0.50, waiting_period_days 180, replacement_frequency_months 60, cob_convention STANDARD and alternate_benefit_enabled true."
        test_recipe:
          setup: ["One patient exists."]
          setup_api_calls:
            - call: "POST /prosthetics/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-root"
            - call: "POST /prosthetics/patients"
              payload: { full_name: "Cai Zhou", date_of_birth: "1948-04-04", phone: "555-1001" }
              as: FrontOffice
              as_user_id: "fo-lindgren"
              captures: { pat_id: $.data.id }
          trigger:
            - call: "POST /prosthetics/coverages"
              payload: { patient_id: "${pat_id}", carrier_name: "Meridian Dental", rank: "PRIMARY", effective_date: "2024-01-01T00:00:00Z" }
              as: FrontOffice
              as_user_id: "fo-lindgren"
              captures: { cov_id: $.data.id }
          assert:
            - "Coverage.${cov_id}.annual_maximum_amount == 1500.00"
            - "Coverage.${cov_id}.coinsurance_major_rate == 0.50"
            - "Coverage.${cov_id}.waiting_period_days == 180"
            - "Coverage.${cov_id}.replacement_frequency_months == 60"
            - "Coverage.${cov_id}.cob_convention == STANDARD"
            - "Coverage.${cov_id}.alternate_benefit_enabled == true"
            - "Coverage.${cov_id}.benefit_used_ytd == 0.00 and benefit_remaining == 1500.00"

      - name: case_arch_required_milestones_computed_per_prosthesis_type
        claim_type: Computed Fields
        grounds: ["entities.CaseArch.fields.required_milestones", "constants.MILESTONES_CAST_PARTIAL"]
        distinguishing_aspect: "required_milestones is derived from the parent case's prosthesis_type, so a CAST_PARTIAL arch reads [FRAMEWORK, WAX, FINISH], an IMPLANT_RETAINED_OVERDENTURE arch reads [FRAMEWORK, FINISH] and an IMMEDIATE_DENTURE arch reads the empty list."
        test_recipe:
          setup: ["One patient with three cases, one CAST_PARTIAL, one IMPLANT_RETAINED_OVERDENTURE and one IMMEDIATE_DENTURE, each with a single MAXILLARY arch."]
          setup_api_calls:
            - call: "POST /prosthetics/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-root"
            - call: "POST /prosthetics/patients"
              payload: { full_name: "Dara Egwu", date_of_birth: "1944-05-05", phone: "555-1002" }
              as: FrontOffice
              as_user_id: "fo-lindgren"
              captures: { pat_id: $.data.id }
            - call: "POST /prosthetics/cases"
              payload: { patient_id: "${pat_id}", prosthesis_type: "CAST_PARTIAL" }
              as: Prosthodontist
              as_user_id: "dr-nunes"
              captures: { case_cp_id: $.data.id }
            - call: "POST /prosthetics/cases"
              payload: { patient_id: "${pat_id}", prosthesis_type: "IMPLANT_RETAINED_OVERDENTURE" }
              as: Prosthodontist
              as_user_id: "dr-nunes"
              captures: { case_iro_id: $.data.id }
            - call: "POST /prosthetics/cases"
              payload: { patient_id: "${pat_id}", prosthesis_type: "IMMEDIATE_DENTURE" }
              as: Prosthodontist
              as_user_id: "dr-nunes"
              captures: { case_imm_id: $.data.id }
          trigger:
            - call: "POST /prosthetics/case-arches"
              payload: { case_id: "${case_cp_id}", arch_position: "MAXILLARY" }
              as: Prosthodontist
              as_user_id: "dr-nunes"
              captures: { arch_cp_id: $.data.id }
            - call: "POST /prosthetics/case-arches"
              payload: { case_id: "${case_iro_id}", arch_position: "MAXILLARY" }
              as: Prosthodontist
              as_user_id: "dr-nunes"
              captures: { arch_iro_id: $.data.id }
            - call: "POST /prosthetics/case-arches"
              payload: { case_id: "${case_imm_id}", arch_position: "MAXILLARY" }
              as: Prosthodontist
              as_user_id: "dr-nunes"
              captures: { arch_imm_id: $.data.id }
          assert:
            - "CaseArch.${arch_cp_id}.required_milestones == [FRAMEWORK, WAX, FINISH]"
            - "CaseArch.${arch_iro_id}.required_milestones == [FRAMEWORK, FINISH]"
            - "CaseArch.${arch_imm_id}.required_milestones == []"
            - "all three arches have arch_status PLANNED, remake_count 0, remake_request_count 0 and remake_eligibility ELIGIBLE"

      - name: duplicate_arch_position_on_same_case_is_rejected
        claim_type: Type Constraints
        grounds: ["validations[priority=7]", "entities.CaseArch.fields.arch_position"]
        distinguishing_aspect: "A second MAXILLARY arch on the same case violates the (case_id, arch_position) uniqueness pair and is refused with ERR_VALIDATION and HTTP 400."
        test_recipe:
          setup: ["One FLEXIBLE_PARTIAL case already carrying one MAXILLARY arch."]
          setup_api_calls:
            - call: "POST /prosthetics/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-root"
            - call: "POST /prosthetics/patients"
              payload: { full_name: "Eda Sorensen", date_of_birth: "1955-06-06", phone: "555-1003" }
              as: FrontOffice
              as_user_id: "fo-lindgren"
              captures: { pat_id: $.data.id }
            - call: "POST /prosthetics/cases"
              payload: { patient_id: "${pat_id}", prosthesis_type: "FLEXIBLE_PARTIAL" }
              as: Prosthodontist
              as_user_id: "dr-nunes"
              captures: { case_id: $.data.id }
            - call: "POST /prosthetics/case-arches"
              payload: { case_id: "${case_id}", arch_position: "MAXILLARY" }
              as: Prosthodontist
              as_user_id: "dr-nunes"
          trigger:
            - call: "POST /prosthetics/case-arches"
              payload: { case_id: "${case_id}", arch_position: "MAXILLARY" }
              as: Prosthodontist
              as_user_id: "dr-nunes"
              captures: { err: $.data.error_id }
          assert:
            - "the trigger returns HTTP 400"
            - "${err} == ERR_VALIDATION"
            - "GET /prosthetics/case-arches with case_id ${case_id} returns total_count 1"

      - name: patient_not_found_on_read
        claim_type: Not Found
        grounds: ["validations[priority=4]", "errors[ERR_PATIENT_NOT_FOUND]"]
        distinguishing_aspect: "Reading a well-formed uuid that names no Patient returns ERR_PATIENT_NOT_FOUND with HTTP 404, not the generic ERR_RESOURCE_NOT_FOUND."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /prosthetics/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-root"
          trigger:
            - call: "GET /prosthetics/patients/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: FrontOffice
              as_user_id: "fo-lindgren"
              captures: { err: $.data.error_id }
          assert:
            - "the trigger returns HTTP 404"
            - "${err} == ERR_PATIENT_NOT_FOUND"

      - name: coverage_not_found_uses_generic_resource_error
        claim_type: Not Found
        grounds: ["validations[priority=4]", "errors[ERR_RESOURCE_NOT_FOUND]"]
        distinguishing_aspect: "Coverage is one of the entities rung 4 routes to the generic code, so an unknown coverage id returns ERR_RESOURCE_NOT_FOUND, distinguishing it from the five entity-specific 404 codes."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /prosthetics/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-root"
          trigger:
            - call: "GET /prosthetics/coverages/1c9d55aa-7f0e-4b31-8d02-6a1b3c4d5e6f"
              payload: {}
              as: FrontOffice
              as_user_id: "fo-lindgren"
              captures: { err: $.data.error_id }
          assert:
            - "the trigger returns HTTP 404"
            - "${err} == ERR_RESOURCE_NOT_FOUND"

      - name: case_arch_and_lab_case_and_prosthesis_not_found_use_their_own_codes
        claim_type: Not Found
        grounds: ["errors[ERR_CASE_NOT_FOUND]", "errors[ERR_ARCH_NOT_FOUND]", "errors[ERR_LAB_CASE_NOT_FOUND]", "errors[ERR_PROSTHESIS_NOT_FOUND]"]
        distinguishing_aspect: "Each of the four remaining entity-specific 404 codes is produced by its own collection, so ERR_CASE_NOT_FOUND, ERR_ARCH_NOT_FOUND, ERR_LAB_CASE_NOT_FOUND and ERR_PROSTHESIS_NOT_FOUND are all distinctly reachable."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /prosthetics/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-root"
          trigger:
            - call: "GET /prosthetics/cases/2c9d55aa-7f0e-4b31-8d02-6a1b3c4d5e60"
              payload: {}
              as: FrontOffice
              as_user_id: "fo-lindgren"
              captures: { err_case: $.data.error_id }
            - call: "GET /prosthetics/case-arches/3c9d55aa-7f0e-4b31-8d02-6a1b3c4d5e61"
              payload: {}
              as: FrontOffice
              as_user_id: "fo-lindgren"
              captures: { err_arch: $.data.error_id }
            - call: "GET /prosthetics/lab-cases/4c9d55aa-7f0e-4b31-8d02-6a1b3c4d5e62"
              payload: {}
              as: FrontOffice
              as_user_id: "fo-lindgren"
              captures: { err_lc: $.data.error_id }
            - call: "GET /prosthetics/prostheses/5c9d55aa-7f0e-4b31-8d02-6a1b3c4d5e63"
              payload: {}
              as: FrontOffice
              as_user_id: "fo-lindgren"
              captures: { err_pro: $.data.error_id }
          assert:
            - "${err_case} == ERR_CASE_NOT_FOUND with HTTP 404"
            - "${err_arch} == ERR_ARCH_NOT_FOUND with HTTP 404"
            - "${err_lc} == ERR_LAB_CASE_NOT_FOUND with HTTP 404"
            - "${err_pro} == ERR_PROSTHESIS_NOT_FOUND with HTTP 404"

      - name: body_foreign_key_that_names_no_row_is_rejected
        claim_type: Parent Relationships
        grounds: ["validations[priority=6]", "errors[ERR_REFERENCE_NOT_FOUND]"]
        distinguishing_aspect: "A case create carrying a patient_id that names no Patient is refused by rung 6 with ERR_REFERENCE_NOT_FOUND and HTTP 404, which is a body-reference failure rather than a path failure."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /prosthetics/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-root"
          trigger:
            - call: "POST /prosthetics/cases"
              payload: { patient_id: "6c9d55aa-7f0e-4b31-8d02-6a1b3c4d5e64", prosthesis_type: "COMPLETE_DENTURE" }
              as: Prosthodontist
              as_user_id: "dr-nunes"
              captures: { err: $.data.error_id }
          assert:
            - "the trigger returns HTTP 404"
            - "${err} == ERR_REFERENCE_NOT_FOUND"
            - "GET /prosthetics/cases returns total_count 0"

      - name: installments_are_only_discoverable_through_the_reverse_reachability_list
        claim_type: Listing
        grounds: ["entities.Installment", "endpoints.GET_/prosthetics/installments"]
        distinguishing_aspect: "Installment rows are minted only as a cascade of payment-plan creation and have no POST endpoint, so GET /prosthetics/installments filtered by payment_plan_id is their sole discovery channel and returns exactly installment_count rows with the pagination envelope populated."
        test_recipe:
          setup: ["A FLEXIBLE_PARTIAL case past complete-exam with an ACTIVE PaymentPlan of 3 installments."]
          setup_api_calls:
            - call: "POST /prosthetics/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-root"
            - call: "POST /prosthetics/patients"
              payload: { full_name: "Fabien Rusu", date_of_birth: "1953-07-07", phone: "555-1004" }
              as: FrontOffice
              as_user_id: "fo-lindgren"
              captures: { pat_id: $.data.id }
            - call: "POST /prosthetics/cases"
              payload: { patient_id: "${pat_id}", prosthesis_type: "FLEXIBLE_PARTIAL" }
              as: FrontOffice
              as_user_id: "fo-lindgren"
              captures: { case_id: $.data.id }
            - call: "POST /prosthetics/case-arches"
              payload: { case_id: "${case_id}", arch_position: "MAXILLARY" }
              as: Prosthodontist
              as_user_id: "dr-nunes"
            - call: "POST /prosthetics/cases/${case_id}/complete-exam"
              payload: {}
              as: Prosthodontist
              as_user_id: "dr-nunes"
            - call: "GET /prosthetics/cases/${case_id}"
              payload: {}
              as: FrontOffice
              as_user_id: "fo-lindgren"
              captures: { case_v: $.data.version }
            - call: "POST /prosthetics/payment-plans"
              payload: { patient_id: "${pat_id}", case_id: "${case_id}", installment_count: 3, down_payment_amount: 240.00, first_due_date: "2026-06-01T00:00:00Z", frequency: "MONTHLY", expected_prosthesis_case_version: "${case_v}", pay_in_full: false }
              as: FrontOffice
              as_user_id: "fo-lindgren"
              captures: { plan_id: $.data.id }
          trigger:
            - call: "GET /prosthetics/installments"
              payload: { payment_plan_id: "${plan_id}", limit: 2, offset: 0 }
              as: FrontOffice
              as_user_id: "fo-lindgren"
          assert:
            - "the response envelope has response_type array with total_count 3, has_more true and exactly 2 rows returned"
            - "every returned row has payment_plan_id ${plan_id} and amount 320.00"
            - "a second call with limit 2 and offset 2 returns 1 row with has_more false"

  # =========================================================================
  # Section: state_machines
  # =========================================================================
  - section: state_machines
    instances:

      - name: complete_exam_twice_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["validations[priority=12]", "state_machines.ProsthesisCase.INTAKE_to_EXAM_COMPLETE", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "The second complete-exam observes case_status EXAM_COMPLETE, which is not a declared from-state of that transition, and is refused with ERR_INVALID_STATE and HTTP 409; fee_schedule_total is not recomputed."
        test_recipe:
          setup: ["One FLEXIBLE_PARTIAL case with one arch already past complete-exam."]
          setup_api_calls:
            - call: "POST /prosthetics/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-root"
            - call: "POST /prosthetics/patients"
              payload: { full_name: "Gaia Lindqvist", date_of_birth: "1946-08-08", phone: "555-1005" }
              as: FrontOffice
              as_user_id: "fo-lindgren"
              captures: { pat_id: $.data.id }
            - call: "POST /prosthetics/cases"
              payload: { patient_id: "${pat_id}", prosthesis_type: "FLEXIBLE_PARTIAL" }
              as: Prosthodontist
              as_user_id: "dr-nunes"
              captures: { case_id: $.data.id }
            - call: "POST /prosthetics/case-arches"
              payload: { case_id: "${case_id}", arch_position: "MAXILLARY" }
              as: Prosthodontist
              as_user_id: "dr-nunes"
            - call: "POST /prosthetics/cases/${case_id}/complete-exam"
              payload: {}
              as: Prosthodontist
              as_user_id: "dr-nunes"
          trigger:
            - call: "POST /prosthetics/cases/${case_id}/complete-exam"
              payload: {}
              as: Prosthodontist
              as_user_id: "dr-nunes"
              captures: { err: $.data.error_id }
          assert:
            - "the trigger returns HTTP 409"
            - "${err} == ERR_INVALID_STATE"
            - "ProsthesisCase.${case_id}.case_status == EXAM_COMPLETE and fee_schedule_total == 1200.00"

      - name: complete_exam_with_no_arch_is_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.ProsthesisCase.INTAKE_to_EXAM_COMPLETE", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "The INTAKE to EXAM_COMPLETE transition requires at least one CaseArch; a case with none is refused with ERR_VALIDATION and HTTP 400 and stays in INTAKE."
        test_recipe:
          setup: ["One FLEXIBLE_PARTIAL case in INTAKE with no arches."]
          setup_api_calls:
            - call: "POST /prosthetics/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-root"
            - call: "POST /prosthetics/patients"
              payload: { full_name: "Hana Oduya", date_of_birth: "1959-09-09", phone: "555-1006" }
              as: FrontOffice
              as_user_id: "fo-lindgren"
              captures: { pat_id: $.data.id }
            - call: "POST /prosthetics/cases"
              payload: { patient_id: "${pat_id}", prosthesis_type: "FLEXIBLE_PARTIAL" }
              as: Prosthodontist
              as_user_id: "dr-nunes"
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /prosthetics/cases/${case_id}/complete-exam"
              payload: {}
              as: Prosthodontist
              as_user_id: "dr-nunes"
              captures: { err: $.data.error_id }
          assert:
            - "the trigger returns HTTP 400"
            - "${err} == ERR_VALIDATION"
            - "ProsthesisCase.${case_id}.case_status == INTAKE and fee_schedule_total == 0.00"

      - name: case_cancel_cascades_to_arch_tryin_and_open_lab_case
        claim_type: side_effect_execution
        grounds: ["state_machines.ProsthesisCase.IN_FABRICATION_to_CANCELLED", "state_machines.CaseArch.LAB_FABRICATION_to_ARCH_ABANDONED", "state_machines.LabCase.DISPATCHED_to_CANCELLED"]
        distinguishing_aspect: "Cancelling a case in IN_FABRICATION sets its arch to ARCH_ABANDONED and its DISPATCHED lab case to CANCELLED in one request, and the QC-passed history of other rows is untouched."
        test_recipe:
          setup: ["A FLEXIBLE_PARTIAL case in IN_FABRICATION with its arch in LAB_FABRICATION and one DISPATCHED LabCase."]
          setup_api_calls:
            - call: "POST /prosthetics/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-root"
            - call: "POST /prosthetics/patients"
              payload: { full_name: "Ilan Braga", date_of_birth: "1947-10-10", phone: "555-1007" }
              as: FrontOffice
              as_user_id: "fo-lindgren"
              captures: { pat_id: $.data.id }
            - call: "POST /prosthetics/labs"
              payload: { lab_name: "Northgate Dental Lab", bench_line_count: 3, standard_turnaround_days: 10, rush_turnaround_days: 4 }
              as: PlatformAdmin
              as_user_id: "admin-root"
              captures: { lab_id: $.data.id }
            - call: "POST /prosthetics/cases"
              payload: { patient_id: "${pat_id}", prosthesis_type: "FLEXIBLE_PARTIAL" }
              as: Prosthodontist
              as_user_id: "dr-nunes"
              captures: { case_id: $.data.id }
            - call: "POST /prosthetics/case-arches"
              payload: { case_id: "${case_id}", arch_position: "MAXILLARY" }
              as: Prosthodontist
              as_user_id: "dr-nunes"
              captures: { arch_id: $.data.id }
            - call: "POST /prosthetics/cases/${case_id}/complete-exam"
              payload: {}
              as: Prosthodontist
              as_user_id: "dr-nunes"
            - call: "POST /prosthetics/case-arches/${arch_id}/start-fabrication"
              payload: {}
              as: Prosthodontist
              as_user_id: "dr-nunes"
            - call: "POST /prosthetics/impressions"
              payload: { case_arch_id: "${arch_id}", capture_method: "DIGITAL_SCAN" }
              as: Prosthodontist
              as_user_id: "dr-nunes"
              captures: { imp_id: $.data.id }
            - call: "POST /prosthetics/impressions/${imp_id}/review"
              payload: { quality_score: 92 }
              as: Prosthodontist
              as_user_id: "dr-nunes"
            - call: "POST /prosthetics/try-ins"
              payload: { case_arch_id: "${arch_id}", milestone_kind: "WAX" }
              as: Prosthodontist
              as_user_id: "dr-nunes"
              captures: { tryin_id: $.data.id }
            - call: "POST /prosthetics/try-ins/${tryin_id}/decide"
              payload: { decision: "APPROVE" }
              as: Prosthodontist
              as_user_id: "dr-nunes"
