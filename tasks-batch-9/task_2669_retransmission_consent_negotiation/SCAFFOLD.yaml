scenario: |
  Generate task harder than expert level!

  2669. Retransmission Consent Negotiation (broadcast station group distribution): carriage election
  cycle with must-carry versus retransmission consent selection by market and distributor, subscriber
  count verification and audit rights under existing agreements, rate negotiation on per-subscriber
  fees with escalators, tier placement and penetration commitments, network affiliation agreement
  obligations including reverse compensation splits with the network, good faith negotiation
  requirements and impasse procedures with blackout notice obligations to subscribers, digital,
  out-of-home and streaming rights inclusion with definition disputes, virtual distributor agreements
  with different subscriber measurement approaches, contract expiration management and interim
  extension agreements

domain_name: retransmission-consent-negotiation
api_prefix: "/retrans"

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  # Station and Distributor are peers joined by CarriageElection (a junction carrying its own
  # lifecycle); AffiliationAgreement cross-cuts the Station axis and constrains what a
  # Negotiation on the Distributor axis may grant. Money flows Station <- Distributor and
  # Station -> Network across aggregate boundaries, so the reference shape is a graph rather
  # than a tree.

  state_machine_shape: cyclic
  # Negotiation cycles AWAITING_STATION_OFFER <-> AWAITING_DISTRIBUTOR_RESPONSE once per round and
  # can re-enter negotiation from IMPASSE; SubscriberReport cycles ADJUSTED -> UNDER_AUDIT on a
  # second audit; CarriageElection forks DRAFT -> {NEGOTIATING | ELECTION_EFFECTIVE} with divergent
  # side effects and reverts to DRAFT on withdrawal; CarriageAgreement carries two independent
  # dimensions (execution_status x network_approval_status).

  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate

  role_model: segregation_of_duties
  # GroupCounsel binds the group by accepting an offer (accepted_by_user_id is stamped) but a
  # DIFFERENT GroupCounsel user must execute the resulting agreement. StationGroupNegotiator and
  # DistributorRep are entity-backed counterparties; ComplianceOfficer and NetworkRepresentative
  # are opaque operators with disjoint exclusive operations.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Station
    parent: null
    common_fields: true
    fields:
      - name: call_sign
        type: string
        source: input
        description: "Broadcast call sign of the owned-and-operated station"
        constraints: "4 uppercase letters, globally unique"
      - name: market_code
        type: string
        source: input
        description: "DMA code the station is licensed to serve, e.g. SEA"
        constraints: "3 uppercase letters"
      - name: dma_rank
        type: integer
        source: input
        description: "Nielsen DMA rank of market_code; 1 is the largest market"
        constraints: ">= 1 and <= 210"
      - name: market_tv_households
        type: integer
        source: input
        description: "TV households in the DMA, used only for reporting context"
        constraints: ">= 1"
      - name: network_affiliation
        type: enum
        source: input
        description: "Network the station is affiliated with, or INDEPENDENT"
        constraints: "one of {ABC, CBS, NBC, FOX, CW, INDEPENDENT}"
      - name: filed_election_count
        type: integer
        source: computed
        description: "Count of CarriageElection rows with station_id == this.id AND status IN {NEGOTIATING, ELECTION_EFFECTIVE, CONSENT_GRANTED}"
        default: 0

  - name: AffiliationAgreement
    parent: Station
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: input
        description: "FK -> Station.id; the affiliated station this network contract binds"
      - name: network_name
        type: enum
        source: input
        description: "Network counterparty; MUST equal Station.network_affiliation of station_id"
        constraints: "one of {ABC, CBS, NBC, FOX, CW}"
      - name: term_end_utc
        type: datetime
        source: input
        description: "Instant the affiliation term ends; the expiration sweep flips ACTIVE -> EXPIRED at or after this instant"
      - name: reverse_comp_floor_per_sub_cents
        type: integer
        source: input
        description: "Per-subscriber-per-month floor the network is owed regardless of the tiered split"
        constraints: ">= 0 and <= 400"
      - name: split_premium_bp
        type: integer
        source: input
        description: "Basis points added to the tiered network reverse-compensation split before the 6000 bp cap"
        constraints: ">= 0 and <= 2000"
      - name: digital_rights_grantable
        type: boolean
        source: input
        description: "Whether the station may grant DIGITAL retransmission rights to a distributor"
        default: false
      - name: ooh_rights_grantable
        type: boolean
        source: input
        description: "Whether the station may grant OUT_OF_HOME retransmission rights to a distributor"
        default: false
      - name: streaming_rights_grantable
        type: boolean
        source: input
        description: "Whether the station may grant STREAMING retransmission rights to a distributor"
        default: false
      - name: permitted_tiers
        type: array
        source: input
        description: "Tier placements the network permits for this station's signal"
        constraints: "non-empty subset of {BROADCAST_BASIC, EXPANDED_BASIC, DIGITAL_TIER}"
      - name: status
        type: enum
        source: input
        description: "Affiliation lifecycle state; SUSPENDED is only reachable by supplying it at creation"
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED, EXPIRED}"

  - name: Distributor
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Legal name of the multichannel or virtual multichannel distributor"
        constraints: "1..80 chars, globally unique"
      - name: distributor_type
        type: enum
        source: input
        description: "Distribution technology class; VMVPD is a virtual distributor"
        constraints: "one of {CABLE, DBS, TELCO, VMVPD}"
      - name: subscriber_measurement_method
        type: enum
        source: input
        description: "How this distributor measures subscribers; drives the billable basis formula"
        constraints: "one of {BILLED_HOUSEHOLDS, WEIGHTED_STREAMING_DEVICES, AVERAGE_MONTHLY_UNIQUE}"
      - name: video_household_count
        type: integer
        source: input
        description: "Distributor video households in the station's market; denominator of the penetration test"
        constraints: ">= 1"
      - name: required_blackout_notice_days
        type: integer
        source: computed
        description: "30 when distributor_type IN {CABLE, DBS, TELCO}; 14 when distributor_type == VMVPD"
      - name: open_true_up_count
        type: integer
        source: computed
        description: "Count of FeeSettlement rows with true_up_required == true AND status == ISSUED whose agreement_id resolves through CarriageAgreement.negotiation_id -> Negotiation.election_id -> CarriageElection.distributor_id == this.id"
        default: 0

  - name: CarriageElection
    parent: null
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: input
        description: "FK -> Station.id; the station making the election"
      - name: distributor_id
        type: string
        source: input
        description: "FK -> Distributor.id; the distributor the election is served on"
      - name: cycle_label
        type: string
        source: input
        description: "Election cycle identifier, e.g. 2027-2029"
        constraints: "1..20 chars"
      - name: election_type
        type: enum
        source: input
        description: "MUST_CARRY takes carriage without compensation; RETRANS_CONSENT opens a negotiation"
        constraints: "one of {MUST_CARRY, RETRANS_CONSENT}"
      - name: requested_tier
        type: enum
        source: input
        description: "Tier placement the station requests for its signal"
        constraints: "one of {BROADCAST_BASIC, EXPANDED_BASIC, DIGITAL_TIER}"
      - name: incumbent_expiry_utc
        type: datetime
        source: input
        description: "Instant the existing carriage arrangement with this distributor lapses; anchors the blackout-notice deadline"
      - name: incumbent_rate_per_sub_cents
        type: integer
        source: input
        description: "Per-subscriber-per-month rate under the expiring arrangement; PRIOR_RATE basis for interim extensions"
        constraints: ">= 0 and <= 600"
      - name: status
        type: enum
        source: system
        description: "Election lifecycle state"
        default: DRAFT
        constraints: "one of {DRAFT, NEGOTIATING, ELECTION_EFFECTIVE, CONSENT_GRANTED, ELECTION_LAPSED}"
      - name: filed_at_utc
        type: datetime
        source: system
        description: "Logical-clock instant the election was filed; null while DRAFT"
      - name: withdrawal_reason
        type: string
        source: system
        description: "Reason captured by the most recent withdrawal back to DRAFT; null if never withdrawn"

  - name: Negotiation
    parent: CarriageElection
    common_fields: true
    fields:
      - name: election_id
        type: string
        source: system
        description: "FK -> CarriageElection.id; created only when a RETRANS_CONSENT election is filed"
      - name: status
        type: enum
        source: system
        description: "Negotiation lifecycle state; cycles between the two AWAITING_* states once per round"
        default: OPEN
        constraints: "one of {OPEN, AWAITING_DISTRIBUTOR_RESPONSE, AWAITING_STATION_OFFER, IMPASSE, CONSENTED, CANCELLED}"
      - name: round_number
        type: integer
        source: computed
        description: "Count of Offer rows with negotiation_id == this.id; increments by 1 on every offer submission"
        default: 0
      - name: station_offer_count
        type: integer
        source: computed
        description: "Count of Offer rows with negotiation_id == this.id AND offered_by == STATION_GROUP"
        default: 0
      - name: distributor_offer_count
        type: integer
        source: computed
        description: "Count of Offer rows with negotiation_id == this.id AND offered_by == DISTRIBUTOR"
        default: 0
      - name: good_faith_meeting_count
        type: integer
        source: computed
        description: "Count of GoodFaithLog rows with negotiation_id == this.id AND event_type == MEETING_HELD"
        default: 0
      - name: impasse_declared_at_utc
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent IMPASSE entry; null if never at impasse"
      - name: blackout_notice_deadline_utc
        type: datetime
        source: computed
        description: "Output of calculation blackout_notice_deadline over CarriageElection.incumbent_expiry_utc and Distributor.required_blackout_notice_days"
      - name: notice_compliance_status
        type: enum
        source: computed
        description: "NOT_REQUIRED while status != IMPASSE; NOTICE_PENDING at IMPASSE with no SERVED BlackoutNotice and clock <= blackout_notice_deadline_utc; NOTICE_SERVED once a BlackoutNotice with status == SERVED exists; NOTICE_DEFICIENT at IMPASSE with no SERVED BlackoutNotice and clock > blackout_notice_deadline_utc"
        constraints: "one of {NOT_REQUIRED, NOTICE_PENDING, NOTICE_SERVED, NOTICE_DEFICIENT}"

  - name: Offer
    parent: Negotiation
    common_fields: true
    fields:
      - name: negotiation_id
        type: string
        source: system
        description: "FK -> Negotiation.id; taken from the path, never from the body"
      - name: offered_by
        type: enum
        source: computed
        description: "STATION_GROUP when X-User-Role == StationGroupNegotiator, DISTRIBUTOR when X-User-Role == DistributorRep; never an input field"
        constraints: "one of {STATION_GROUP, DISTRIBUTOR}"
      - name: round_number
        type: integer
        source: system
        description: "Value of Negotiation.round_number after this offer incremented it"
      - name: base_rate_per_sub_cents
        type: integer
        source: input
        description: "Year-1 per-subscriber-per-month rate proposed"
        constraints: ">= 1 and <= 600"
      - name: escalator_bp_per_year
        type: integer
        source: input
        description: "Annual escalator in basis points, e.g. 700 means 7.00 percent per contract year"
        constraints: ">= 0 and <= 1000"
      - name: term_months
        type: integer
        source: input
        description: "Proposed carriage term length in months"
        constraints: ">= 12 and <= 120"
      - name: tier
        type: enum
        source: input
        description: "Tier placement offered for the signal"
        constraints: "one of {BROADCAST_BASIC, EXPANDED_BASIC, DIGITAL_TIER}"
      - name: penetration_commitment_bp
        type: integer
        source: input
        description: "Committed penetration in basis points of the distributor's video households"
        constraints: ">= 0 and <= 10000"
      - name: includes_digital_rights
        type: boolean
        source: input
        description: "Whether DIGITAL retransmission rights are inside the grant"
        default: false
      - name: includes_ooh_rights
        type: boolean
        source: input
        description: "Whether OUT_OF_HOME retransmission rights are inside the grant"
        default: false
      - name: includes_streaming_rights
        type: boolean
        source: input
        description: "Whether STREAMING retransmission rights are inside the grant"
        default: false
      - name: subscriber_report_id
        type: string
        source: input
        description: "FK -> SubscriberReport.id; the verified subscriber count this offer prices against. MUST belong to the same (station_id, distributor_id) pair as the parent election and have status IN {REPORTED, UNDER_AUDIT, ADJUSTED, ACCEPTED}"
      - name: projection_basis_subscribers
        type: integer
        source: computed
        description: "Snapshot of the referenced SubscriberReport.billable_subscriber_basis at submission time; frozen thereafter"
      - name: year_rate_schedule_compound_cents
        type: array
        source: computed
        description: "Per-contract-year rate ladder produced by the COMPOUND_ANNUAL variant of calculation offer_projected_total_fee"
      - name: projected_total_fee_cents
        type: integer
        source: computed
        description: "Whole-term gross fee under the COMPOUND_ANNUAL variant of calculation offer_projected_total_fee"
      - name: status
        type: enum
        source: system
        description: "Offer lifecycle state; an offer stays SUBMITTED when the counterparty counters, so either outstanding offer may still be accepted"
        default: SUBMITTED
        constraints: "one of {SUBMITTED, ACCEPTED, REJECTED, EXPIRED}"
      - name: rejection_reason
        type: string
        source: system
        description: "Reason recorded when the counterparty rejected this offer; null otherwise"

  - name: GoodFaithLog
    parent: Negotiation
    common_fields: false
    fields:
      - name: negotiation_id
        type: string
        source: system
        description: "FK -> Negotiation.id; taken from the path"
      - name: event_type
        type: enum
        source: input
        description: "Class of good-faith conduct event being logged"
        constraints: "one of {MEETING_HELD, PROPOSAL_EXCHANGED, INFORMATION_REQUEST, INFORMATION_RESPONSE, DELAY_OBJECTION}"
      - name: occurred_at_utc
        type: datetime
        source: input
        description: "Instant the logged conduct actually occurred, as asserted by the logging party"
      - name: summary
        type: string
        source: input
        description: "Free-text record of what happened"
        constraints: "1..500 chars"
      - name: actor_role
        type: enum
        source: system
        description: "X-User-Role of the caller who appended this entry"
        constraints: "one of {StationGroupNegotiator, DistributorRep, ComplianceOfficer}"
      - name: sequence_index
        type: integer
        source: system
        description: "1-based append position within the negotiation, assigned in created_at ASC order"

  - name: SubscriberReport
    parent: null
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: input
        description: "FK -> Station.id; the station whose signal the counts relate to"
      - name: distributor_id
        type: string
        source: system
        description: "FK -> Distributor.id; taken from X-User-ID of the reporting DistributorRep, never from the body"
      - name: period_label
        type: string
        source: input
        description: "Reporting period label, e.g. 2027-01"
        constraints: "1..20 chars; unique per (station_id, distributor_id)"
      - name: period_start_utc
        type: datetime
        source: input
        description: "Inclusive start of the reported period"
      - name: period_end_utc
        type: datetime
        source: input
        description: "Exclusive end of the reported period; anchors the audit-rights window"
      - name: reported_subscriber_count
        type: integer
        source: input
        description: "Raw count as measured by the distributor's own subscriber_measurement_method"
        constraints: ">= 0"
      - name: excluded_free_trial_count
        type: integer
        source: input
        description: "Portion of reported_subscriber_count in a promotional free trial and excluded from the basis"
        default: 0
        constraints: ">= 0 and <= reported_subscriber_count"
      - name: measurement_method_snapshot
        type: enum
        source: computed
        description: "Copy of Distributor.subscriber_measurement_method at report creation; frozen thereafter"
        constraints: "one of {BILLED_HOUSEHOLDS, WEIGHTED_STREAMING_DEVICES, AVERAGE_MONTHLY_UNIQUE}"
      - name: audit_adjustment_subscribers
        type: integer
        source: computed
        description: "Sum of adjustment_subscribers over AuditFinding rows with subscriber_report_id == this.id AND status == SUBSTANTIATED"
        default: 0
      - name: adjusted_subscriber_count
        type: integer
        source: computed
        description: "reported_subscriber_count - excluded_free_trial_count + audit_adjustment_subscribers"
      - name: billable_subscriber_basis
        type: integer
        source: computed
        description: "Output of calculation subscriber_basis_determination under the AUDITED variant"
      - name: as_reported_basis
        type: integer
        source: computed
        description: "Output of calculation subscriber_basis_determination under the AS_REPORTED variant, which treats audit_adjustment_subscribers as 0"
      - name: status
        type: enum
        source: system
        description: "Report verification state; ADJUSTED rows re-enter UNDER_AUDIT when a further finding is opened"
        default: REPORTED
        constraints: "one of {REPORTED, UNDER_AUDIT, ADJUSTED, ACCEPTED}"

  - name: AuditFinding
    parent: SubscriberReport
    common_fields: true
    fields:
      - name: subscriber_report_id
        type: string
        source: system
        description: "FK -> SubscriberReport.id; taken from the path"
      - name: adjustment_subscribers
        type: integer
        source: input
        description: "Signed subscriber delta the station group asserts; positive means the distributor undercounted"
        constraints: "!= 0 and >= -500000 and <= 500000"
      - name: basis_note
        type: string
        source: input
        description: "Evidentiary basis for the asserted delta"
        constraints: "1..500 chars"
      - name: status
        type: enum
        source: system
        description: "Finding resolution state"
        default: OPEN
        constraints: "one of {OPEN, SUBSTANTIATED, DISMISSED}"
      - name: resolution_note
        type: string
        source: system
        description: "Note captured by the compliance officer at resolution; null while OPEN"
      - name: opened_at_utc
        type: datetime
        source: system
        description: "Logical-clock instant the audit was opened"

  - name: CarriageAgreement
    parent: Negotiation
    common_fields: true
    fields:
      - name: negotiation_id
        type: string
        source: system
        description: "FK -> Negotiation.id; resolved from the accepted offer"
      - name: accepted_offer_id
        type: string
        source: system
        description: "FK -> Offer.id; the offer whose economics this agreement embodies"
      - name: effective_start_utc
        type: datetime
        source: input
        description: "Inclusive start of the carriage term"
      - name: effective_end_utc
        type: datetime
        source: system
        description: "Exclusive end of the carriage term; supplied at acceptance and pushed forward by interim extensions"
      - name: execution_status
        type: enum
        source: system
        description: "Execution dimension of the agreement, independent of network_approval_status"
        default: PENDING_EXECUTION
        constraints: "one of {PENDING_EXECUTION, EXECUTED, EXPIRED}"
      - name: network_approval_status
        type: enum
        source: system
        description: "Network reverse-compensation approval dimension; NOT_REQUIRED when the station is INDEPENDENT, otherwise PENDING_NETWORK at creation"
        constraints: "one of {NOT_REQUIRED, PENDING_NETWORK, NETWORK_APPROVED, NETWORK_REJECTED}"
      - name: accepted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the GroupCounsel who accepted the offer; the segregation-of-duties comparand"
      - name: executed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the GroupCounsel who executed the agreement; null while PENDING_EXECUTION"
      - name: granted_rights_scope
        type: array
        source: computed
        description: "Rights terms still inside the grant: starts as the accepted Offer's includes_* flags mapped to {DIGITAL, OUT_OF_HOME, STREAMING} and drops a term when a RightsDispute on it resolves RESOLVED_EXCLUDED"
      - name: rights_credit_bp_total
        type: integer
        source: computed
        description: "Sum of credit_bp_applied over RightsDispute rows with agreement_id == this.id AND status == RESOLVED_EXCLUDED"
        default: 0
      - name: contract_year_rate_schedule_cents
        type: array
        source: computed
        description: "Per-contract-year rate ladder produced by the SIMPLE_ANNUAL variant of calculation offer_projected_total_fee; this is the ladder the executed contract bills on"
      - name: current_year_rate_per_sub_cents
        type: integer
        source: computed
        description: "contract_year_rate_schedule_cents at index contract_year_index derived from the current logical clock"
      - name: consumed_extension_days
        type: integer
        source: computed
        description: "Sum of extension_days over InterimExtension rows with agreement_id == this.id AND status IN {ACTIVE, LAPSED}"
        default: 0
      - name: lifetime_gross_fee_cents
        type: integer
        source: computed
        description: "Sum of gross_fee_cents over FeeSettlement rows with agreement_id == this.id AND status IN {ISSUED, TRUED_UP}"
        default: 0
      - name: lifetime_net_retained_cents
        type: integer
        source: computed
        description: "Sum of net_retained_cents over FeeSettlement rows with agreement_id == this.id AND status IN {ISSUED, TRUED_UP}"
        default: 0

  - name: InterimExtension
    parent: CarriageAgreement
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: system
        description: "FK -> CarriageAgreement.id; taken from the path"
      - name: extension_days
        type: integer
        source: input
        description: "Length of the interim extension window in whole days"
        constraints: ">= 1 and <= 90"
      - name: extension_start_utc
        type: datetime
        source: input
        description: "Inclusive start of the extension window"
      - name: extension_end_utc
        type: datetime
        source: computed
        description: "extension_start_utc plus extension_days days; the window is treated as CLOSED at both endpoints for overlap testing"
      - name: extension_rate_basis
        type: enum
        source: input
        description: "Which rate the interim window bills at"
        constraints: "one of {PRIOR_RATE, LAST_STATION_OFFER, MIDPOINT}"
      - name: effective_rate_per_sub_cents
        type: integer
        source: computed
        description: "Output of calculation interim_extension_rate"
      - name: status
        type: enum
        source: system
        description: "Extension lifecycle state"
        default: ACTIVE
        constraints: "one of {ACTIVE, LAPSED, SUPERSEDED}"

  - name: RightsDispute
    parent: CarriageAgreement
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: system
        description: "FK -> CarriageAgreement.id; taken from the path"
      - name: disputed_term
        type: enum
        source: input
        description: "Which rights definition is contested"
        constraints: "one of {DIGITAL, OUT_OF_HOME, STREAMING}; must be a member of the agreement's granted_rights_scope at creation"
      - name: claimed_definition
        type: string
        source: input
        description: "The definition the raising party asserts"
        constraints: "1..500 chars"
      - name: raised_by
        type: enum
        source: computed
        description: "STATION_GROUP when X-User-Role == StationGroupNegotiator, DISTRIBUTOR when X-User-Role == DistributorRep"
        constraints: "one of {STATION_GROUP, DISTRIBUTOR}"
      - name: status
        type: enum
        source: system
        description: "Dispute resolution state"
        default: RAISED
        constraints: "one of {RAISED, IN_MEDIATION, RESOLVED_INCLUDED, RESOLVED_EXCLUDED}"
      - name: credit_bp_applied
        type: integer
        source: computed
        description: "RIGHTS_CREDIT_BP[disputed_term] once status == RESOLVED_EXCLUDED, otherwise 0"
        default: 0
      - name: resolution_note
        type: string
        source: system
        description: "Compliance officer's note at the most recent resolve call; null while RAISED"

  - name: BlackoutNotice
    parent: Negotiation
    common_fields: true
    fields:
      - name: negotiation_id
        type: string
        source: system
        description: "FK -> Negotiation.id; taken from the path"
      - name: subscriber_notice_count
        type: integer
        source: input
        description: "Number of subscribers the notice was served on"
        constraints: ">= 1"
      - name: notice_channel
        type: enum
        source: input
        description: "Channel the subscriber notice was delivered through"
        constraints: "one of {ON_AIR_CRAWL, BILL_INSERT, EMAIL, WEBSITE}"
      - name: served_at_utc
        type: datetime
        source: system
        description: "Logical-clock instant the notice was served"
      - name: required_notice_days_snapshot
        type: integer
        source: computed
        description: "Copy of Distributor.required_blackout_notice_days at service time; frozen thereafter"
      - name: status
        type: enum
        source: system
        description: "Notice lifecycle state; SUPERSEDED when the negotiation resumes out of IMPASSE"
        default: SERVED
        constraints: "one of {SERVED, SUPERSEDED}"

  - name: FeeSettlement
    parent: CarriageAgreement
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: system
        description: "FK -> CarriageAgreement.id; taken from the path"
      - name: subscriber_report_id
        type: string
        source: input
        description: "FK -> SubscriberReport.id; the report supplying the billable basis for this period"
      - name: period_label
        type: string
        source: input
        description: "Settlement period label, e.g. 2027-01"
        constraints: "1..20 chars; unique per agreement_id"
      - name: period_start_utc
        type: datetime
        source: input
        description: "Inclusive start of the settlement period"
      - name: period_end_utc
        type: datetime
        source: input
        description: "Exclusive end of the settlement period"
      - name: contract_year_index
        type: integer
        source: computed
        description: "floor(((period_start_utc.year - agreement.effective_start_utc.year) * 12 + (period_start_utc.month - agreement.effective_start_utc.month)) / 12) + 1"
      - name: rate_per_sub_cents
        type: integer
        source: computed
        description: "CarriageAgreement.contract_year_rate_schedule_cents at contract_year_index; the SIMPLE_ANNUAL ladder, never the COMPOUND_ANNUAL one"
      - name: basis_variant
        type: enum
        source: computed
        description: "AS_REPORTED at issuance, AUDITED after a true-up"
        default: AS_REPORTED
        constraints: "one of {AS_REPORTED, AUDITED}"
      - name: billable_subscriber_basis_snapshot
        type: integer
        source: computed
        description: "SubscriberReport.as_reported_basis at issuance; replaced by SubscriberReport.billable_subscriber_basis at true-up"
      - name: gross_fee_cents
        type: integer
        source: computed
        description: "Step 1 of calculation reverse_compensation_split"
      - name: rights_credit_cents
        type: integer
        source: computed
        description: "Step 2 of calculation reverse_compensation_split"
        default: 0
      - name: reverse_comp_split_bp
        type: integer
        source: computed
        description: "Step 4 of calculation reverse_compensation_split"
      - name: reverse_comp_cents
        type: integer
        source: computed
        description: "Step 5 of calculation reverse_compensation_split; the amount owed to the network"
      - name: actual_penetration_bp
        type: integer
        source: computed
        description: "Intermediate of calculation penetration_shortfall_penalty: floor(billable_subscriber_basis_snapshot * 10000 / Distributor.video_household_count), surfaced so the penalty is auditable"
      - name: penetration_shortfall_bp
        type: integer
        source: computed
        description: "Intermediate of calculation penetration_shortfall_penalty: max(0, accepted Offer.penetration_commitment_bp - actual_penetration_bp)"
        default: 0
      - name: penetration_penalty_cents
        type: integer
        source: computed
        description: "Output of calculation penetration_shortfall_penalty"
        default: 0
      - name: net_retained_cents
        type: integer
        source: computed
        description: "Step 6 of calculation reverse_compensation_split; what the station group keeps"
      - name: true_up_required
        type: boolean
        source: computed
        description: "Set true when the referenced SubscriberReport's audit_adjustment_subscribers becomes non-zero while this settlement is ISSUED"
        default: false
      - name: issued_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the GroupCounsel who issued this settlement; the segregation-of-duties check on void compares against it"
      - name: status
        type: enum
        source: system
        description: "Settlement lifecycle state"
        default: ISSUED
        constraints: "one of {ISSUED, TRUED_UP, VOIDED}"

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: CarriageElection
    initial_state: DRAFT
    terminal_states: [CONSENT_GRANTED, ELECTION_LAPSED]
    transitions:
      - from: DRAFT
        to: NEGOTIATING
        trigger: "POST /retrans/elections/{id}/file with election_type == RETRANS_CONSENT"
        actor: StationGroupNegotiator
        preconditions:
          - "status == DRAFT"
          - "X-User-ID == this.station_id"
          - "current logical clock <= ELECTION_DEADLINE_UTC"
          - "requested_tier IN the AffiliationAgreement.permitted_tiers of the station's AffiliationAgreement row whose status == ACTIVE, when the station's network_affiliation != INDEPENDENT"
        side_effects:
          - "sets filed_at_utc to the current logical clock"
          - "creates one Negotiation with election_id == this.id, status OPEN, round_number 0"
          - "computes the new Negotiation.blackout_notice_deadline_utc via calculation blackout_notice_deadline"
          - "recomputes Station.filed_election_count for this.station_id"
        note: "Fork branch A of the election. Divergent side-effect set from branch B: a Negotiation row is created."
      - from: DRAFT
        to: ELECTION_EFFECTIVE
        trigger: "POST /retrans/elections/{id}/file with election_type == MUST_CARRY"
        actor: StationGroupNegotiator
        preconditions:
          - "status == DRAFT"
          - "X-User-ID == this.station_id"
          - "current logical clock <= ELECTION_DEADLINE_UTC"
          - "requested_tier == BROADCAST_BASIC"
        side_effects:
          - "sets filed_at_utc to the current logical clock"
          - "creates NO Negotiation; carriage is compulsory and uncompensated"
          - "recomputes Station.filed_election_count for this.station_id"
        note: "Fork branch B of the election. Divergent side-effect set from branch A: no Negotiation, and BROADCAST_BASIC placement is compulsory."
      - from: NEGOTIATING
        to: DRAFT
        trigger: "POST /retrans/elections/{id}/withdraw"
        actor: StationGroupNegotiator
        preconditions:
          - "status IN {NEGOTIATING, ELECTION_EFFECTIVE}"
          - "X-User-ID == this.station_id"
          - "current logical clock <= ELECTION_DEADLINE_UTC"
        side_effects:
          - "sets withdrawal_reason and clears filed_at_utc to null"
          - "cascade level 1 -> 2: the Negotiation with election_id == this.id moves to CANCELLED"
          - "cascade level 2 -> 3: because that Negotiation is CANCELLED, every Offer with negotiation_id == that negotiation AND status == SUBMITTED moves to EXPIRED, and every BlackoutNotice with negotiation_id == that negotiation AND status == SERVED moves to SUPERSEDED"
          - "recomputes Station.filed_election_count for this.station_id"
        note: "Revert edge closing the election cycle. Together with file, this is the compensating pair that conserves Station.filed_election_count."
      - from: ELECTION_EFFECTIVE
        to: DRAFT
        trigger: "POST /retrans/elections/{id}/withdraw"
        actor: StationGroupNegotiator
        preconditions:
          - "status IN {NEGOTIATING, ELECTION_EFFECTIVE}"
          - "X-User-ID == this.station_id"
          - "current logical clock <= ELECTION_DEADLINE_UTC"
        side_effects:
          - "sets withdrawal_reason and clears filed_at_utc to null"
          - "no Negotiation exists to cancel on this branch"
          - "recomputes Station.filed_election_count for this.station_id"
      - from: NEGOTIATING
        to: CONSENT_GRANTED
        trigger: "system, on POST /retrans/offers/{id}/accept for an offer in this election's negotiation"
        actor: system
        preconditions:
          - "status == NEGOTIATING"
          - "the Negotiation with election_id == this.id has just moved to CONSENTED"
        side_effects:
          - "recomputes Station.filed_election_count for this.station_id"
        note: "Bubble-up: the parent election follows its child negotiation into a terminal state."
      - from: NEGOTIATING
        to: ELECTION_LAPSED
        trigger: "system, on POST /retrans/expiration-sweep"
        actor: system
        preconditions:
          - "status == NEGOTIATING"
          - "incumbent_expiry_utc <= current logical clock"
          - "no CarriageAgreement exists whose negotiation_id is this election's Negotiation"
          - "no InterimExtension with status == ACTIVE covers the current logical clock for any CarriageAgreement of this election"
        side_effects:
          - "cascade level 1 -> 2: the Negotiation with election_id == this.id moves to CANCELLED"
          - "cascade level 2 -> 3: every Offer with negotiation_id == that negotiation AND status == SUBMITTED moves to EXPIRED"
          - "recomputes Station.filed_election_count for this.station_id"

  - entity: Negotiation
    initial_state: OPEN
    terminal_states: [CONSENTED, CANCELLED]
    transitions:
      - from: OPEN
        to: AWAITING_DISTRIBUTOR_RESPONSE
        trigger: "POST /retrans/negotiations/{id}/offers as StationGroupNegotiator"
        actor: StationGroupNegotiator
        preconditions:
          - "status IN {OPEN, AWAITING_STATION_OFFER, IMPASSE}"
          - "the parent CarriageElection.election_type == RETRANS_CONSENT"
          - "the parent CarriageElection.status == NEGOTIATING"
          - "X-User-ID == the parent CarriageElection.station_id"
        side_effects:
          - "creates one Offer with offered_by STATION_GROUP and status SUBMITTED"
          - "increments round_number by 1 and stamps it onto the new Offer.round_number"
          - "recomputes station_offer_count"
          - "increments Negotiation.version by 1"
          - "computes Offer.projection_basis_subscribers, Offer.year_rate_schedule_compound_cents and Offer.projected_total_fee_cents via calculation offer_projected_total_fee under the COMPOUND_ANNUAL variant"
      - from: AWAITING_STATION_OFFER
        to: AWAITING_DISTRIBUTOR_RESPONSE
        trigger: "POST /retrans/negotiations/{id}/offers as StationGroupNegotiator"
        actor: StationGroupNegotiator
        preconditions:
          - "status IN {OPEN, AWAITING_STATION_OFFER, IMPASSE}"
          - "the parent CarriageElection.status == NEGOTIATING"
          - "X-User-ID == the parent CarriageElection.station_id"
        side_effects:
          - "creates one Offer with offered_by STATION_GROUP and status SUBMITTED"
          - "increments round_number by 1"
          - "leaves every pre-existing SUBMITTED Offer of the counterparty at SUBMITTED, so it remains acceptable"
          - "increments Negotiation.version by 1"
        note: "Return leg of the round-trip cycle."
      - from: AWAITING_DISTRIBUTOR_RESPONSE
        to: AWAITING_STATION_OFFER
        trigger: "POST /retrans/negotiations/{id}/offers as DistributorRep"
        actor: DistributorRep
        preconditions:
          - "status IN {OPEN, AWAITING_DISTRIBUTOR_RESPONSE}"
          - "the parent CarriageElection.status == NEGOTIATING"
          - "X-User-ID == the parent CarriageElection.distributor_id"
        side_effects:
          - "creates one Offer with offered_by DISTRIBUTOR and status SUBMITTED"
          - "increments round_number by 1"
          - "recomputes distributor_offer_count"
          - "increments Negotiation.version by 1"
        note: "Outbound leg of the round-trip cycle; with the AWAITING_STATION_OFFER -> AWAITING_DISTRIBUTOR_RESPONSE edge this forms the negotiation-round cycle."
      - from: OPEN
        to: AWAITING_STATION_OFFER
        trigger: "POST /retrans/negotiations/{id}/offers as DistributorRep"
        actor: DistributorRep
        preconditions:
          - "status IN {OPEN, AWAITING_DISTRIBUTOR_RESPONSE}"
          - "the parent CarriageElection.status == NEGOTIATING"
          - "X-User-ID == the parent CarriageElection.distributor_id"
        side_effects:
          - "creates one Offer with offered_by DISTRIBUTOR and status SUBMITTED"
          - "increments round_number by 1 and Negotiation.version by 1"
      - from: AWAITING_DISTRIBUTOR_RESPONSE
        to: IMPASSE
        trigger: "POST /retrans/negotiations/{id}/declare-impasse"
        actor: StationGroupNegotiator
        preconditions:
          - "status IN {OPEN, AWAITING_DISTRIBUTOR_RESPONSE, AWAITING_STATION_OFFER}"
          - "good_faith_meeting_count >= MIN_GOOD_FAITH_MEETINGS"
          - "station_offer_count >= 1 AND distributor_offer_count >= 1"
          - "X-User-ID == the parent CarriageElection.station_id"
        side_effects:
          - "sets impasse_declared_at_utc to the current logical clock"
          - "recomputes notice_compliance_status to NOTICE_PENDING when the current logical clock <= blackout_notice_deadline_utc, otherwise NOTICE_DEFICIENT"
          - "increments Negotiation.version by 1"
      - from: AWAITING_STATION_OFFER
        to: IMPASSE
        trigger: "POST /retrans/negotiations/{id}/declare-impasse"
        actor: StationGroupNegotiator
        preconditions:
          - "status IN {OPEN, AWAITING_DISTRIBUTOR_RESPONSE, AWAITING_STATION_OFFER}"
          - "good_faith_meeting_count >= MIN_GOOD_FAITH_MEETINGS"
          - "station_offer_count >= 1 AND distributor_offer_count >= 1"
        side_effects:
          - "sets impasse_declared_at_utc and recomputes notice_compliance_status"
          - "increments Negotiation.version by 1"
      - from: IMPASSE
        to: AWAITING_DISTRIBUTOR_RESPONSE
        trigger: "POST /retrans/negotiations/{id}/offers as StationGroupNegotiator"
        actor: StationGroupNegotiator
        preconditions:
          - "status == IMPASSE"
          - "the parent CarriageElection.status == NEGOTIATING"
          - "X-User-ID == the parent CarriageElection.station_id"
        side_effects:
          - "creates one Offer with offered_by STATION_GROUP, increments round_number by 1"
          - "every BlackoutNotice with negotiation_id == this.id AND status == SERVED moves to SUPERSEDED"
          - "recomputes notice_compliance_status to NOT_REQUIRED"
          - "increments Negotiation.version by 1"
        note: "Re-entry edge out of a terminal-looking state; this is the second cycle in this machine."
      - from: AWAITING_DISTRIBUTOR_RESPONSE
        to: CONSENTED
        trigger: "system, on POST /retrans/offers/{id}/accept"
        actor: system
        preconditions:
          - "status IN {OPEN, AWAITING_DISTRIBUTOR_RESPONSE, AWAITING_STATION_OFFER, IMPASSE}"
          - "the accepted Offer.negotiation_id == this.id AND that Offer.status == SUBMITTED"
        side_effects:
          - "creates one CarriageAgreement"
          - "cascade level 1 -> 2: because this Negotiation is CONSENTED, the parent CarriageElection moves NEGOTIATING -> CONSENT_GRANTED"
          - "cascade level 2 -> 3: because that election left NEGOTIATING, Station.filed_election_count is recomputed"
          - "every other Offer with negotiation_id == this.id AND status == SUBMITTED moves to EXPIRED"
          - "increments Negotiation.version by 1"
      - from: AWAITING_STATION_OFFER
        to: CONSENTED
        trigger: "system, on POST /retrans/offers/{id}/accept"
        actor: system
        preconditions:
          - "status IN {OPEN, AWAITING_DISTRIBUTOR_RESPONSE, AWAITING_STATION_OFFER, IMPASSE}"
          - "the accepted Offer.status == SUBMITTED"
        side_effects:
          - "creates one CarriageAgreement and moves the parent CarriageElection to CONSENT_GRANTED"
          - "increments Negotiation.version by 1"
      - from: IMPASSE
        to: CONSENTED
        trigger: "system, on POST /retrans/offers/{id}/accept"
        actor: system
        preconditions:
          - "status == IMPASSE AND the accepted Offer.status == SUBMITTED"
        side_effects:
          - "creates one CarriageAgreement and moves the parent CarriageElection to CONSENT_GRANTED"
          - "every BlackoutNotice with negotiation_id == this.id AND status == SERVED moves to SUPERSEDED"
          - "increments Negotiation.version by 1"
      - from: AWAITING_DISTRIBUTOR_RESPONSE
        to: CANCELLED
        trigger: "system, on POST /retrans/elections/{id}/withdraw or POST /retrans/expiration-sweep"
        actor: system
        preconditions:
          - "status NOT IN {CONSENTED, CANCELLED}"
          - "the parent CarriageElection left NEGOTIATING without consent"
        side_effects:
          - "every Offer with negotiation_id == this.id AND status == SUBMITTED moves to EXPIRED"
          - "every BlackoutNotice with negotiation_id == this.id AND status == SERVED moves to SUPERSEDED"
      - from: IMPASSE
        to: CANCELLED
        trigger: "system, on POST /retrans/expiration-sweep"
        actor: system
        preconditions:
          - "status == IMPASSE AND the parent CarriageElection moved to ELECTION_LAPSED"
        side_effects:
          - "every Offer with status == SUBMITTED moves to EXPIRED"

  - entity: Offer
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, REJECTED, EXPIRED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /retrans/offers/{id}/accept"
        actor: GroupCounsel
        preconditions:
          - "status == SUBMITTED"
          - "the parent Negotiation.status NOT IN {CONSENTED, CANCELLED}"
          - "the grandparent CarriageElection.status == NEGOTIATING AND election_type == RETRANS_CONSENT"
          - "expected_negotiation_version == the parent Negotiation.version"
          - "the requested [effective_start_utc, effective_end_utc) does not overlap any CarriageAgreement with execution_status IN {PENDING_EXECUTION, EXECUTED} for the same (station_id, distributor_id) pair"
        side_effects:
          - "creates one CarriageAgreement with execution_status PENDING_EXECUTION, accepted_by_user_id == X-User-ID, network_approval_status NOT_REQUIRED when the station's network_affiliation == INDEPENDENT else PENDING_NETWORK"
          - "computes CarriageAgreement.contract_year_rate_schedule_cents via calculation offer_projected_total_fee under the SIMPLE_ANNUAL variant"
          - "computes CarriageAgreement.granted_rights_scope from this offer's includes_digital_rights, includes_ooh_rights and includes_streaming_rights flags"
          - "moves the parent Negotiation to CONSENTED and increments Negotiation.version by 1"
          - "every sibling Offer with status == SUBMITTED moves to EXPIRED"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /retrans/offers/{id}/reject"
        actor: StationGroupNegotiator | DistributorRep
        preconditions:
          - "status == SUBMITTED"
          - "the parent Negotiation.status NOT IN {CONSENTED, CANCELLED}"
          - "the caller is the counterparty of offered_by: X-User-Role == DistributorRep with X-User-ID == election.distributor_id when offered_by == STATION_GROUP, and X-User-Role == StationGroupNegotiator with X-User-ID == election.station_id when offered_by == DISTRIBUTOR"
        side_effects:
          - "sets rejection_reason"
          - "leaves Negotiation.status and Negotiation.round_number unchanged"
      - from: SUBMITTED
        to: EXPIRED
        trigger: "system, on sibling offer acceptance, election withdrawal, or expiration sweep lapse"
        actor: system
        preconditions:
          - "status == SUBMITTED"
          - "the parent Negotiation left the negotiating states"
        side_effects:
          - "no further side effects; the offer is frozen for the audit record"

  - entity: SubscriberReport
    initial_state: REPORTED
    terminal_states: [ACCEPTED]
    transitions:
      - from: REPORTED
        to: UNDER_AUDIT
        trigger: "POST /retrans/subscriber-reports/{id}/audit-findings"
        actor: StationGroupNegotiator
        preconditions:
          - "status IN {REPORTED, ADJUSTED}"
          - "X-User-ID == this.station_id"
          - "current logical clock <= period_end_utc + AUDIT_RIGHTS_WINDOW_DAYS days"
        side_effects:
          - "creates one AuditFinding with status OPEN and opened_at_utc == the current logical clock"
      - from: ADJUSTED
        to: UNDER_AUDIT
        trigger: "POST /retrans/subscriber-reports/{id}/audit-findings"
        actor: StationGroupNegotiator
        preconditions:
          - "status IN {REPORTED, ADJUSTED}"
          - "X-User-ID == this.station_id"
          - "current logical clock <= period_end_utc + AUDIT_RIGHTS_WINDOW_DAYS days"
        side_effects:
          - "creates one AuditFinding with status OPEN"
        note: "Re-audit cycle: an already-adjusted report can be pulled back under audit, so this machine is not a one-way pipeline."
      - from: UNDER_AUDIT
        to: ADJUSTED
        trigger: "system, on POST /retrans/audit-findings/{id}/resolve with resolution == SUBSTANTIATED"
        actor: system
        preconditions:
          - "status == UNDER_AUDIT"
          - "the resolved AuditFinding.subscriber_report_id == this.id"
        side_effects:
          - "cascade level 1 -> 2: recomputes audit_adjustment_subscribers, adjusted_subscriber_count and billable_subscriber_basis via calculation subscriber_basis_determination under the AUDITED variant"
          - "cascade level 2 -> 3: because audit_adjustment_subscribers is now non-zero, every FeeSettlement with subscriber_report_id == this.id AND status == ISSUED sets true_up_required = true, and Distributor.open_true_up_count is recomputed for this.distributor_id"
      - from: UNDER_AUDIT
        to: REPORTED
        trigger: "system, on POST /retrans/audit-findings/{id}/resolve with resolution == DISMISSED when no SUBSTANTIATED finding exists on this report"
        actor: system
        preconditions:
          - "status == UNDER_AUDIT"
          - "no AuditFinding with subscriber_report_id == this.id has status == OPEN after this resolution"
          - "no AuditFinding with subscriber_report_id == this.id has status == SUBSTANTIATED"
        side_effects:
          - "leaves audit_adjustment_subscribers at 0 and billable_subscriber_basis equal to as_reported_basis"
      - from: UNDER_AUDIT
        to: ACCEPTED
        trigger: "system, on POST /retrans/expiration-sweep once the audit window has closed"
        actor: system
        preconditions:
          - "status IN {REPORTED, UNDER_AUDIT, ADJUSTED}"
          - "current logical clock > period_end_utc + AUDIT_RIGHTS_WINDOW_DAYS days"
          - "no AuditFinding with subscriber_report_id == this.id has status == OPEN"
        side_effects:
          - "freezes billable_subscriber_basis; no further AuditFinding may be opened"
      - from: REPORTED
        to: ACCEPTED
        trigger: "system, on POST /retrans/expiration-sweep once the audit window has closed"
        actor: system
        preconditions:
          - "current logical clock > period_end_utc + AUDIT_RIGHTS_WINDOW_DAYS days"
          - "no AuditFinding with subscriber_report_id == this.id has status == OPEN"
        side_effects:
          - "freezes billable_subscriber_basis"
      - from: ADJUSTED
        to: ACCEPTED
        trigger: "system, on POST /retrans/expiration-sweep once the audit window has closed"
        actor: system
        preconditions:
          - "current logical clock > period_end_utc + AUDIT_RIGHTS_WINDOW_DAYS days"
          - "no AuditFinding with subscriber_report_id == this.id has status == OPEN"
        side_effects:
          - "freezes billable_subscriber_basis"

  - entity: AuditFinding
    initial_state: OPEN
    terminal_states: [SUBSTANTIATED, DISMISSED]
    transitions:
      - from: OPEN
        to: SUBSTANTIATED
        trigger: "POST /retrans/audit-findings/{id}/resolve with resolution == SUBSTANTIATED"
        actor: ComplianceOfficer
        preconditions:
          - "status == OPEN"
          - "the parent SubscriberReport.status == UNDER_AUDIT"
        side_effects:
          - "sets resolution_note"
          - "drives the parent SubscriberReport UNDER_AUDIT -> ADJUSTED cascade documented on that machine"
      - from: OPEN
        to: DISMISSED
        trigger: "POST /retrans/audit-findings/{id}/resolve with resolution == DISMISSED"
        actor: ComplianceOfficer
        preconditions:
          - "status == OPEN"
          - "the parent SubscriberReport.status == UNDER_AUDIT"
        side_effects:
          - "sets resolution_note"
          - "leaves SubscriberReport.audit_adjustment_subscribers unchanged"
          - "returns the parent SubscriberReport to REPORTED when no OPEN and no SUBSTANTIATED finding remains on it"

  - entity: CarriageAgreement
    initial_state: "EXEC:PENDING_EXECUTION"
    terminal_states: ["EXEC:EXPIRED", "NET:NETWORK_REJECTED"]
    transitions:
      - from: "NET:PENDING_NETWORK"
        to: "NET:NETWORK_APPROVED"
        trigger: "POST /retrans/agreements/{id}/network-approval with decision == APPROVE"
        actor: NetworkRepresentative
        preconditions:
          - "network_approval_status == PENDING_NETWORK"
          - "the station's AffiliationAgreement row with status == ACTIVE exists"
          - "granted_rights_scope is a subset of the rights the ACTIVE AffiliationAgreement marks grantable"
        side_effects:
          - "leaves execution_status untouched; the two dimensions advance independently"
          - "increments CarriageAgreement.version by 1"
        note: "Network dimension. Independent of the execution dimension: approval may land before or after nothing else changes."
      - from: "NET:PENDING_NETWORK"
        to: "NET:NETWORK_REJECTED"
        trigger: "POST /retrans/agreements/{id}/network-approval with decision == REJECT"
        actor: NetworkRepresentative
        preconditions:
          - "network_approval_status == PENDING_NETWORK"
        side_effects:
          - "records decision_note; execution_status remains PENDING_EXECUTION and can never advance to EXECUTED"
          - "increments CarriageAgreement.version by 1"
      - from: "EXEC:PENDING_EXECUTION"
        to: "EXEC:EXECUTED"
        trigger: "POST /retrans/agreements/{id}/execute"
        actor: GroupCounsel
        preconditions:
          - "execution_status == PENDING_EXECUTION"
          - "network_approval_status IN {NOT_REQUIRED, NETWORK_APPROVED}"
          - "the AffiliationAgreement of the station with status == ACTIVE exists"
          - "X-User-ID != accepted_by_user_id"
        side_effects:
          - "sets executed_by_user_id to X-User-ID"
          - "cascade level 1 -> 2: because this agreement is now EXECUTED, every InterimExtension with status == ACTIVE on any OTHER CarriageAgreement sharing this agreement's (station_id, distributor_id) pair whose closed window intersects [effective_start_utc, effective_end_utc) moves to SUPERSEDED"
          - "cascade level 2 -> 3: because those extensions left ACTIVE, the other agreement's consumed_extension_days is recomputed (SUPERSEDED days drop out of the sum)"
          - "increments CarriageAgreement.version by 1"
        note: "Execution dimension. Guarded on the network dimension of the same row and on the AffiliationAgreement of a different entity."
      - from: "EXEC:EXECUTED"
        to: "EXEC:EXPIRED"
        trigger: "system, on POST /retrans/expiration-sweep"
        actor: system
        preconditions:
          - "execution_status == EXECUTED"
          - "effective_end_utc <= current logical clock"
        side_effects:
          - "no further FeeSettlement may be issued against this agreement"

  - entity: InterimExtension
    initial_state: ACTIVE
    terminal_states: [LAPSED, SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: LAPSED
        trigger: "system, on POST /retrans/expiration-sweep"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "extension_end_utc <= current logical clock"
        side_effects:
          - "leaves the parent CarriageAgreement.consumed_extension_days unchanged, because LAPSED days remain inside the budget sum"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system, on POST /retrans/agreements/{id}/execute for a successor agreement on the same (station_id, distributor_id) pair"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "the closed window [extension_start_utc, extension_end_utc] intersects the successor agreement's [effective_start_utc, effective_end_utc)"
        side_effects:
          - "recomputes the parent CarriageAgreement.consumed_extension_days, which now excludes this extension's days"

  - entity: RightsDispute
    initial_state: RAISED
    terminal_states: [RESOLVED_INCLUDED, RESOLVED_EXCLUDED]
    transitions:
      - from: RAISED
        to: IN_MEDIATION
        trigger: "POST /retrans/rights-disputes/{id}/resolve with resolution == MEDIATION"
        actor: ComplianceOfficer
        preconditions:
          - "status == RAISED"
        side_effects:
          - "sets resolution_note; credit_bp_applied stays 0 and the agreement's granted_rights_scope is untouched"
      - from: RAISED
        to: RESOLVED_INCLUDED
        trigger: "POST /retrans/rights-disputes/{id}/resolve with resolution == INCLUDED"
        actor: ComplianceOfficer
        preconditions:
          - "status IN {RAISED, IN_MEDIATION}"
        side_effects:
          - "credit_bp_applied stays 0; granted_rights_scope keeps disputed_term; no settlement is recomputed"
      - from: IN_MEDIATION
        to: RESOLVED_INCLUDED
        trigger: "POST /retrans/rights-disputes/{id}/resolve with resolution == INCLUDED"
        actor: ComplianceOfficer
        preconditions:
          - "status IN {RAISED, IN_MEDIATION}"
        side_effects:
          - "credit_bp_applied stays 0; no settlement is recomputed"
      - from: RAISED
        to: RESOLVED_EXCLUDED
        trigger: "POST /retrans/rights-disputes/{id}/resolve with resolution == EXCLUDED"
        actor: ComplianceOfficer
        preconditions:
          - "status IN {RAISED, IN_MEDIATION}"
        side_effects:
          - "cascade level 1: sets credit_bp_applied = RIGHTS_CREDIT_BP[disputed_term]"
          - "cascade level 1 -> 2: because this dispute is now RESOLVED_EXCLUDED, the parent CarriageAgreement removes disputed_term from granted_rights_scope, recomputes rights_credit_bp_total, and increments CarriageAgreement.version by 1"
          - "cascade level 2 -> 3: because the agreement's rights_credit_bp_total changed, every FeeSettlement with agreement_id == this.agreement_id AND status == ISSUED recomputes rights_credit_cents, reverse_comp_cents, penetration_penalty_cents and net_retained_cents via calculation reverse_compensation_split, processed in created_at ASC order"
          - "cascade level 3 -> 4: because those settlements changed, the parent CarriageAgreement re-derives lifetime_gross_fee_cents and lifetime_net_retained_cents from the settlements now in status IN {ISSUED, TRUED_UP}"
      - from: IN_MEDIATION
        to: RESOLVED_EXCLUDED
        trigger: "POST /retrans/rights-disputes/{id}/resolve with resolution == EXCLUDED"
        actor: ComplianceOfficer
        preconditions:
          - "status IN {RAISED, IN_MEDIATION}"
        side_effects:
          - "identical four-level cascade as the RAISED -> RESOLVED_EXCLUDED edge"

  - entity: BlackoutNotice
    initial_state: SERVED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: SERVED
        to: SUPERSEDED
        trigger: "system, on a station offer submitted while the negotiation is at IMPASSE, on election withdrawal, or on offer acceptance out of IMPASSE"
        actor: system
        preconditions:
          - "status == SERVED"
          - "the parent Negotiation left IMPASSE"
        side_effects:
          - "recomputes the parent Negotiation.notice_compliance_status"

  - entity: FeeSettlement
    initial_state: ISSUED
    terminal_states: [VOIDED]
    transitions:
      - from: ISSUED
        to: TRUED_UP
        trigger: "POST /retrans/fee-settlements/{id}/true-up"
        actor: GroupCounsel
        preconditions:
          - "status == ISSUED"
          - "the referenced SubscriberReport.audit_adjustment_subscribers != 0"
        side_effects:
          - "flips basis_variant to AUDITED and replaces billable_subscriber_basis_snapshot with SubscriberReport.billable_subscriber_basis"
          - "recomputes gross_fee_cents, rights_credit_cents, reverse_comp_split_bp, reverse_comp_cents, penetration_penalty_cents and net_retained_cents via calculation reverse_compensation_split"
          - "clears true_up_required to false"
          - "re-derives the parent CarriageAgreement.lifetime_gross_fee_cents and lifetime_net_retained_cents"
          - "recomputes Distributor.open_true_up_count"
      - from: ISSUED
        to: VOIDED
        trigger: "POST /retrans/fee-settlements/{id}/void"
        actor: GroupCounsel
        preconditions:
          - "status IN {ISSUED, TRUED_UP}"
        side_effects:
          - "compensating action: the parent CarriageAgreement re-derives lifetime_gross_fee_cents and lifetime_net_retained_cents over settlements with status IN {ISSUED, TRUED_UP}, so this row's amounts drop out and the ledger returns to its pre-issuance value"
          - "recomputes Distributor.open_true_up_count"
      - from: TRUED_UP
        to: VOIDED
        trigger: "POST /retrans/fee-settlements/{id}/void"
        actor: GroupCounsel
        preconditions:
          - "status IN {ISSUED, TRUED_UP}"
        side_effects:
          - "same ledger re-derivation as the ISSUED -> VOIDED edge"

  - entity: AffiliationAgreement
    initial_state: ACTIVE
    terminal_states: [EXPIRED]
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "system, on POST /retrans/expiration-sweep"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "term_end_utc <= current logical clock"
        side_effects:
          - "no CarriageAgreement of this station may be executed while no ACTIVE AffiliationAgreement exists"
        note: "SUSPENDED is reachable only by supplying status == SUSPENDED at creation; it is a frozen configuration value with no transitions."

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: accept-offer-stale-negotiation
    parent_entity: Negotiation
    write_endpoint: "POST /retrans/offers/{id}/accept"
    occ_field: "expected_negotiation_version"
    description: |
      Accepting an offer against a Negotiation whose version has advanced since the client last
      observed it is rejected. Countering does not terminate the counterparty's outstanding offer,
      so accepting an older SUBMITTED offer stays legitimate on its own state; the only thing the
      acceptor may be missing is a further round that the negotiation has since recorded. The stale
      expected_negotiation_version is therefore the sole signal that the acceptor is binding the
      group on an out-of-date view of the record.
    error_id: ERR_STALE_NEGOTIATION_VERSION
    http_status: 412
  - rule_id: extension-create-stale-agreement
    parent_entity: CarriageAgreement
    write_endpoint: "POST /retrans/agreements/{id}/interim-extensions"
    occ_field: "expected_agreement_version"
    description: |
      Creating an InterimExtension against a CarriageAgreement whose version has advanced since the
      client last observed it is rejected. A newly created extension legitimately supersedes the
      client's picture of the term by pushing effective_end_utc forward and consuming extension-day
      budget, so a second create computed from the earlier view would land a window and a budget
      draw that the client never intended. The stale expected_agreement_version reduces this to a
      deterministic version check.
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: offer_projected_total_fee
    trigger: "On POST /retrans/negotiations/{id}/offers (COMPOUND_ANNUAL, writes Offer.year_rate_schedule_compound_cents and Offer.projected_total_fee_cents); on POST /retrans/offers/{id}/accept (SIMPLE_ANNUAL, writes CarriageAgreement.contract_year_rate_schedule_cents); on GET /retrans/agreements/{id}/fee-projection (both variants side by side)"
    algorithm: tiered_pricing
    formula: |
      # Inputs: base = Offer.base_rate_per_sub_cents, esc_bp = Offer.escalator_bp_per_year,
      #         term = Offer.term_months, basis = Offer.projection_basis_subscribers
      year_count = ceil(term / 12)

      # --- rate ladder, one entry per contract year -------------------------
      # COMPOUND_ANNUAL: each year escalates off the ALREADY-ROUNDED prior year rate.
      rate_compound[1] = base
      for n in 2..year_count:
          rate_compound[n] = round_half_up(rate_compound[n-1] * (10000 + esc_bp) / 10000)

      # SIMPLE_ANNUAL: each year escalates off the unrounded base with a linear multiplier.
      for n in 1..year_count:
          rate_simple[n] = round_half_up(base * (10000 + esc_bp * (n - 1)) / 10000)

      # --- months attributable to each contract year ------------------------
      for n in 1..year_count:
          year_months[n] = min(12, term - 12 * (n - 1))

      # --- ROUNDING ORDER IS PINNED HERE -----------------------------------
      # Round the per-year RATE to whole cents FIRST, then multiply by basis and
      # months, then sum across years. Summing unrounded yearly rates first and
      # rounding the whole-term total once is FORBIDDEN and produces a different
      # number for the same inputs.
      total_cents = sum over n of ( rate_ladder[n] * basis * year_months[n] )
    input_set: "Exactly one Offer row plus the SubscriberReport referenced by subscriber_report_id at submission time (status IN {REPORTED, UNDER_AUDIT, ADJUSTED, ACCEPTED}); no other offers, settlements or reports enter the sum. projection_basis_subscribers is frozen at submission and is NOT re-read afterwards."
    constants:
      MAX_RATE_PER_SUB_CENTS: 600
      MAX_ESCALATOR_BP: 1000
    precision: "Whole cents. round_half_up applied to each per-year rate; the products and the final sum are exact integers."
    variants:
      - name: COMPOUND_ANNUAL
        when: "Quoted during negotiation: Offer.year_rate_schedule_compound_cents and Offer.projected_total_fee_cents, and the compound_total_fee_cents leg of GET /retrans/agreements/{id}/fee-projection"
        difference: "Year n escalates off the rounded year n-1 rate, so rounding error compounds forward and the ladder drifts above the simple ladder from year 3 onward"
      - name: SIMPLE_ANNUAL
        when: "Billed under the executed contract: CarriageAgreement.contract_year_rate_schedule_cents, FeeSettlement.rate_per_sub_cents, and the simple_total_fee_cents leg of GET /retrans/agreements/{id}/fee-projection"
        difference: "Year n escalates off the unrounded base with multiplier (10000 + esc_bp*(n-1))/10000, so no rounding error carries forward; for base 250 / esc_bp 700 the ladders are [250, 268, 287] versus [250, 268, 285]"

  - name: subscriber_basis_determination
    trigger: "On POST /retrans/subscriber-reports (writes as_reported_basis and billable_subscriber_basis); recomputed on the SubscriberReport UNDER_AUDIT -> ADJUSTED transition and on the UNDER_AUDIT -> REPORTED transition"
    algorithm: constraint_propagation
    formula: |
      # Inputs: reported = SubscriberReport.reported_subscriber_count,
      #         trial    = SubscriberReport.excluded_free_trial_count,
      #         adj      = SubscriberReport.audit_adjustment_subscribers (0 under AS_REPORTED),
      #         method   = SubscriberReport.measurement_method_snapshot
      adjusted = reported - trial + adj

      if method == BILLED_HOUSEHOLDS:
          basis = adjusted
      elif method == WEIGHTED_STREAMING_DEVICES:
          # devices -> households; integer-exact form of floor(adjusted / 2.5)
          basis = floor(adjusted * 10 / 25)
      elif method == AVERAGE_MONTHLY_UNIQUE:
          basis = round_half_up(adjusted * AMU_DISCOUNT_BP / 10000)

      basis = max(0, basis)
    input_set: "Exactly one SubscriberReport row. audit_adjustment_subscribers is the sum of adjustment_subscribers over AuditFinding rows on that report with status == SUBSTANTIATED; OPEN and DISMISSED findings are excluded. measurement_method_snapshot is the value frozen at report creation, NOT the distributor's current subscriber_measurement_method."
    constants:
      DEVICE_HOUSEHOLD_DIVISOR_NUM: 10
      DEVICE_HOUSEHOLD_DIVISOR_DEN: 25
      AMU_DISCOUNT_BP: 8800
    precision: "Whole subscribers. floor for WEIGHTED_STREAMING_DEVICES, round_half_up for AVERAGE_MONTHLY_UNIQUE, exact for BILLED_HOUSEHOLDS."
    variants:
      - name: AS_REPORTED
        when: "SubscriberReport.as_reported_basis, and the basis snapshotted into a FeeSettlement at issuance"
        difference: "audit_adjustment_subscribers is forced to 0, so substantiated audit findings do not move the number"
      - name: AUDITED
        when: "SubscriberReport.billable_subscriber_basis, the basis snapshotted into an Offer at submission, and the basis a FeeSettlement adopts at true-up"
        difference: "audit_adjustment_subscribers is included, so a substantiated undercount raises the basis and every downstream fee with it"

  - name: reverse_compensation_split
    trigger: "On POST /retrans/agreements/{id}/fee-settlements (issuance); on POST /retrans/fee-settlements/{id}/true-up; and as cascade level 3 of the RightsDispute RAISED|IN_MEDIATION -> RESOLVED_EXCLUDED transition"
    algorithm: waterfall_allocation
    formula: |
      # STEP 0 - which contract year is being billed
      elapsed_months = (period_start_utc.year  - agreement.effective_start_utc.year) * 12
                     + (period_start_utc.month - agreement.effective_start_utc.month)
      contract_year_index = floor(elapsed_months / 12) + 1
      rate = agreement.contract_year_rate_schedule_cents[contract_year_index]   # SIMPLE_ANNUAL ladder

      # STEP 1 - gross, one month of carriage
      basis = billable_subscriber_basis_snapshot
      gross_fee_cents = rate * basis

      # STEP 2 - rights credits, ROUNDED PER DISPUTE THEN SUMMED (order pinned)
      rights_credit_cents = sum over RightsDispute d
                              where d.agreement_id == agreement.id
                                and d.status == RESOLVED_EXCLUDED
                              of round_half_up(gross_fee_cents * RIGHTS_CREDIT_BP[d.disputed_term] / 10000)
                            # iterate d in created_at ASC order

      # STEP 3
      creditable_base_cents = gross_fee_cents - rights_credit_cents

      # STEP 4 - CIRCULARITY RESOLVED HERE.
      # The split tier LOOKS like it should key on what the station group nets, but net
      # depends on the split. The pinned rule: the tier keys on the PRE-CREDIT per-subscriber
      # rate (STEP 0's `rate`), never on creditable_base_cents and never on net_retained_cents.
      if   rate <= 200: tier_bp = 4000
      elif rate <= 300: tier_bp = 5000
      else:             tier_bp = 5500
      reverse_comp_split_bp = min(tier_bp + affiliation.split_premium_bp, MAX_SPLIT_BP)

      # STEP 5 - the network takes the greater of its share and its per-sub floor
      reverse_comp_cents = max(
          round_half_up(creditable_base_cents * reverse_comp_split_bp / 10000),
          affiliation.reverse_comp_floor_per_sub_cents * basis )

      # STEP 6 - penalty from calculation penetration_shortfall_penalty, then the residual
      net_retained_cents = creditable_base_cents - reverse_comp_cents - penetration_penalty_cents

      # CONSERVATION INVARIANT (must hold after every mutation of this row):
      # gross_fee_cents == net_retained_cents + reverse_comp_cents
      #                    + rights_credit_cents + penetration_penalty_cents
    input_set: "One FeeSettlement row; the AffiliationAgreement of the station with status IN {ACTIVE, EXPIRED} (SUSPENDED rows are excluded and their absence blocks execution upstream); RightsDispute rows on the agreement with status == RESOLVED_EXCLUDED only (RAISED, IN_MEDIATION and RESOLVED_INCLUDED contribute nothing)."
    constants:
      RIGHTS_CREDIT_BP: { DIGITAL: 800, OUT_OF_HOME: 500, STREAMING: 1200 }
      MAX_SPLIT_BP: 6000
    precision: "Whole cents, round_half_up. Each rights credit is rounded on its own before summation; STEP 5's share is rounded once."
    variants:
      - name: ISSUANCE
        when: "POST /retrans/agreements/{id}/fee-settlements"
        difference: "basis comes from SubscriberReport.as_reported_basis and basis_variant is stamped AS_REPORTED"
      - name: TRUE_UP
        when: "POST /retrans/fee-settlements/{id}/true-up"
        difference: "basis is replaced by SubscriberReport.billable_subscriber_basis and basis_variant becomes AUDITED; every downstream step is recomputed from the new basis"

  - name: penetration_shortfall_penalty
    trigger: "Inside STEP 6 of reverse_compensation_split, on POST /retrans/agreements/{id}/fee-settlements, on POST /retrans/fee-settlements/{id}/true-up, and on the RightsDispute -> RESOLVED_EXCLUDED cascade"
    algorithm: threshold
    formula: |
      # Inputs: basis        = FeeSettlement.billable_subscriber_basis_snapshot
      #         vhh          = Distributor.video_household_count
      #         commitment   = accepted Offer.penetration_commitment_bp
      #         gross        = FeeSettlement.gross_fee_cents
      actual_penetration_bp = floor(basis * 10000 / vhh)
      penetration_shortfall_bp = max(0, commitment - actual_penetration_bp)

      if penetration_shortfall_bp <= PENETRATION_GRACE_BP:
          penetration_penalty_cents = 0        # inclusive grace band: exactly 50 bp short is free
      else:
          penetration_penalty_cents = round_half_up(
              gross * penetration_shortfall_bp * PENALTY_MULTIPLIER / 10000 )
    input_set: "One FeeSettlement row, the Distributor reached through the agreement's election, and the accepted Offer of that agreement. Penetration is measured against the distributor's video_household_count, NOT against Station.market_tv_households."
    constants:
      PENETRATION_GRACE_BP: 50
      PENALTY_MULTIPLIER: 2
    precision: "actual_penetration_bp is floored to whole basis points; the penalty is round_half_up to whole cents."

  - name: blackout_notice_deadline
    trigger: "Computed on Negotiation creation (the CarriageElection DRAFT -> NEGOTIATING transition) and re-read on POST /retrans/negotiations/{id}/blackout-notices"
    algorithm: interval_merge
    formula: |
      required_days = 30 if distributor.distributor_type IN {CABLE, DBS, TELCO} else 14
      # distributor.required_blackout_notice_days holds exactly this value
      blackout_notice_deadline_utc = election.incumbent_expiry_utc - required_days days

      # Service is timely when it lands AT OR BEFORE the deadline instant:
      timely = (current logical clock <= blackout_notice_deadline_utc)
    input_set: "The CarriageElection.incumbent_expiry_utc of the negotiation's parent election and the Distributor.distributor_type reached through that election. No other rows participate."
    constants:
      MVPD_NOTICE_DAYS: 30
      VMVPD_NOTICE_DAYS: 14
    precision: "Whole days subtracted from an ISO 8601 UTC instant; the comparison at the deadline instant itself is inclusive."

  - name: interim_extension_rate
    trigger: "On POST /retrans/agreements/{id}/interim-extensions, writing InterimExtension.effective_rate_per_sub_cents"
    algorithm: chronological
    formula: |
      prior_rate = election.incumbent_rate_per_sub_cents      # election reached via agreement -> negotiation -> election

      # --- station-offer selector, fully pinned ---------------------------
      # (a) eligibility filter: Offer rows with negotiation_id == agreement.negotiation_id
      #     AND offered_by == STATION_GROUP AND status IN {SUBMITTED, ACCEPTED, REJECTED, EXPIRED}
      # (b) ranking expression: round_number DESC
      # (c) tie-break when round_number ties: created_at DESC
      # (d) empty candidate set: reject with ERR_NO_STATION_OFFER_ON_RECORD (422)
      last_station_offer_rate = base_rate_per_sub_cents of the top-ranked candidate

      if extension_rate_basis == PRIOR_RATE:
          effective_rate_per_sub_cents = prior_rate
      elif extension_rate_basis == LAST_STATION_OFFER:
          effective_rate_per_sub_cents = last_station_offer_rate
      elif extension_rate_basis == MIDPOINT:
          effective_rate_per_sub_cents = floor((prior_rate + last_station_offer_rate) / 2)
    input_set: "The CarriageElection reached through the agreement's negotiation, plus the Offer rows of that negotiation filtered per (a) above. PRIOR_RATE never touches the offer pool, so an empty pool is only an error for LAST_STATION_OFFER and MIDPOINT."
    constants:
      MAX_CUMULATIVE_EXTENSION_DAYS: 90
    precision: "Whole cents; MIDPOINT floors, never rounds half up."

# ---------------------------------------------------------------------------
# 1.4 Validation Rules Table (ordered by priority; lowest number wins)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty, and X-User-Role is one of the six roles declared in 1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "The role in X-User-Role appears in the target endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: business_constraint
    check: "Request body and query parameters conform to the endpoint's input schema: required fields present, enum values in range, integers non-negative, rate <= MAX_RATE_PER_SUB_CENTS (600), escalator_bp_per_year <= MAX_ESCALATOR_BP (1000), penetration_commitment_bp in 0..10000, term_months in 12..120, extension_days in 1..90, period_end_utc > period_start_utc, effective_end_utc > effective_start_utc, limit in 1..100, offset >= 0, timestamps parse as ISO 8601 UTC"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 4
    category: existence
    check: "Every path id resolves to a live row, validated left-to-right in the path"
    error_id: "ERR_STATION_NOT_FOUND | ERR_DISTRIBUTOR_NOT_FOUND | ERR_ELECTION_NOT_FOUND | ERR_NEGOTIATION_NOT_FOUND | ERR_OFFER_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_REPORT_NOT_FOUND | ERR_AUDIT_FINDING_NOT_FOUND | ERR_DISPUTE_NOT_FOUND | ERR_SETTLEMENT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path parameter"

  - priority: 5
    category: existence
    check: "Every foreign-key id supplied in the request body resolves to a live row (station_id, distributor_id, subscriber_report_id)"
    error_id: "ERR_STATION_NOT_FOUND | ERR_DISTRIBUTOR_NOT_FOUND | ERR_REPORT_NOT_FOUND"
    http_status: 404
    applies_to: "POST /retrans/elections, POST /retrans/subscriber-reports, POST /retrans/negotiations/{id}/offers, POST /retrans/agreements/{id}/fee-settlements"

  - priority: 6
    category: auth
    check: "Counterparty ownership: for StationGroupNegotiator, X-User-ID equals the Station.id reached from the target row; for DistributorRep, X-User-ID equals the Distributor.id reached from the target row"
    error_id: ERR_NOT_COUNTERPARTY
    http_status: 403
    applies_to: "PATCH /retrans/elections/{id}, POST /retrans/elections/{id}/file, POST /retrans/elections/{id}/withdraw, POST /retrans/negotiations/{id}/offers, POST /retrans/offers/{id}/reject, POST /retrans/subscriber-reports/{id}/audit-findings, POST /retrans/agreements/{id}/interim-extensions, POST /retrans/agreements/{id}/rights-disputes"

  - priority: 7
    category: auth
    check: "Segregation of duties: the X-User-ID executing an agreement must differ from CarriageAgreement.accepted_by_user_id, and the X-User-ID voiding a settlement must differ from FeeSettlement.issued_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /retrans/agreements/{id}/execute, POST /retrans/fee-settlements/{id}/void"

  - priority: 8
    category: state
    check: "CarriageElection.status == DRAFT for edit and file operations"
    error_id: ERR_ELECTION_NOT_DRAFT
    http_status: 409
    applies_to: "PATCH /retrans/elections/{id}, POST /retrans/elections/{id}/file"

  - priority: 9
    category: state
    check: "CarriageElection.status IN {NEGOTIATING, ELECTION_EFFECTIVE} for withdrawal; a DRAFT election has nothing to withdraw and CONSENT_GRANTED / ELECTION_LAPSED elections are terminal"
    error_id: ERR_ELECTION_NOT_WITHDRAWABLE
    http_status: 409
    applies_to: "POST /retrans/elections/{id}/withdraw"

  - priority: 10
    category: state
    check: "Negotiation.status IN {OPEN, AWAITING_STATION_OFFER, AWAITING_DISTRIBUTOR_RESPONSE, IMPASSE} for offer submission, good-faith logging, impasse declaration and blackout notice service; CONSENTED and CANCELLED negotiations are closed"
    error_id: ERR_NEGOTIATION_NOT_OPEN
    http_status: 409
    applies_to: "POST /retrans/negotiations/{id}/offers, POST /retrans/negotiations/{id}/good-faith-log, POST /retrans/negotiations/{id}/declare-impasse, POST /retrans/negotiations/{id}/blackout-notices"

  - priority: 11
    category: state
    check: "Offer.status == SUBMITTED for accept and reject"
    error_id: ERR_OFFER_NOT_OUTSTANDING
    http_status: 409
    applies_to: "POST /retrans/offers/{id}/accept, POST /retrans/offers/{id}/reject"

  - priority: 12
    category: state
    check: "CarriageAgreement.execution_status == PENDING_EXECUTION for network-approval and execute; == EXECUTED for interim-extensions, rights-disputes and fee-settlements"
    error_id: ERR_AGREEMENT_NOT_PENDING_EXECUTION
    http_status: 409
    applies_to: "POST /retrans/agreements/{id}/network-approval, POST /retrans/agreements/{id}/execute, POST /retrans/agreements/{id}/interim-extensions, POST /retrans/agreements/{id}/rights-disputes, POST /retrans/agreements/{id}/fee-settlements"

  - priority: 13
    category: state
    check: "SubscriberReport.status IN {REPORTED, UNDER_AUDIT, ADJUSTED} to open an audit finding; ACCEPTED reports are closed to audit"
    error_id: ERR_REPORT_NOT_AUDITABLE
    http_status: 409
    applies_to: "POST /retrans/subscriber-reports/{id}/audit-findings"

  - priority: 14
    category: state
    check: "AuditFinding.status == OPEN for resolution"
    error_id: ERR_AUDIT_FINDING_NOT_OPEN
    http_status: 409
    applies_to: "POST /retrans/audit-findings/{id}/resolve"

  - priority: 15
    category: state
    check: "RightsDispute.status IN {RAISED, IN_MEDIATION} for resolution"
    error_id: ERR_DISPUTE_NOT_PENDING
    http_status: 409
    applies_to: "POST /retrans/rights-disputes/{id}/resolve"

  - priority: 16
    category: state
    check: "FeeSettlement.status == ISSUED for true-up and void; TRUED_UP settlements may still be voided but not trued up twice, VOIDED settlements accept neither"
    error_id: ERR_SETTLEMENT_NOT_ISSUED
    http_status: 409
    applies_to: "POST /retrans/fee-settlements/{id}/true-up, POST /retrans/fee-settlements/{id}/void"

  - priority: 17
    category: business_referential
    check: "Must-carry carriage is compulsory, uncompensated and BROADCAST_BASIC only: filing a CarriageElection with election_type == MUST_CARRY and requested_tier != BROADCAST_BASIC is refused, because negotiated tier placement exists only on the retransmission-consent path. A MUST_CARRY election that does file moves straight to ELECTION_EFFECTIVE, opens no Negotiation, and the same rule refuses any offer submitted on a Negotiation whose election_type has become MUST_CARRY"
    error_id: ERR_MUST_CARRY_NO_NEGOTIATION
    http_status: 422
    applies_to: "POST /retrans/negotiations/{id}/offers, POST /retrans/elections/{id}/file"

  - priority: 18
    category: business_referential
    check: "extension_rate_basis IN {LAST_STATION_OFFER, MIDPOINT} requires at least one Offer with offered_by == STATION_GROUP and status IN {SUBMITTED, ACCEPTED, REJECTED, EXPIRED} on the agreement's negotiation"
    error_id: ERR_NO_STATION_OFFER_ON_RECORD
    http_status: 422
    applies_to: "POST /retrans/agreements/{id}/interim-extensions"

  - priority: 19
    category: business_referential
    check: "True-up requires the settlement's SubscriberReport.audit_adjustment_subscribers != 0, i.e. a SUBSTANTIATED audit finding has moved billable_subscriber_basis away from the AS_REPORTED snapshot; an unadjusted report has nothing to true up"
    error_id: ERR_TRUE_UP_NOT_REQUIRED
    http_status: 422
    applies_to: "POST /retrans/fee-settlements/{id}/true-up"

  - priority: 20
    category: business_temporal
    check: "The logical clock must be at or before ELECTION_DEADLINE_UTC (2026-10-01T00:00:00Z) to file or amend an election; filing exactly at the deadline instant is allowed"
    error_id: ERR_ELECTION_WINDOW_CLOSED
    http_status: 422
    applies_to: "PATCH /retrans/elections/{id}, POST /retrans/elections/{id}/file, POST /retrans/elections/{id}/withdraw"

  - priority: 21
    category: business_temporal
    check: "An audit finding may only be opened within AUDIT_RIGHTS_WINDOW_DAYS (180) of SubscriberReport.period_end_utc; the boundary day itself is inside the window"
    error_id: ERR_AUDIT_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /retrans/subscriber-reports/{id}/audit-findings"

  - priority: 22
    category: business_temporal
    check: "A blackout notice must be served at or before Negotiation.blackout_notice_deadline_utc as computed by blackout_notice_deadline"
    error_id: ERR_BLACKOUT_NOTICE_LATE
    http_status: 422
    applies_to: "POST /retrans/negotiations/{id}/blackout-notices"

  - priority: 23
    category: business_safety
    check: "Impasse may only be declared once Negotiation.good_faith_meeting_count >= MIN_GOOD_FAITH_MEETINGS (3), counting GoodFaithLog rows with event_type == MEETING_HELD; exactly 3 satisfies the rule"
    error_id: ERR_GOOD_FAITH_NOT_SATISFIED
    http_status: 422
    applies_to: "POST /retrans/negotiations/{id}/declare-impasse"

  - priority: 24
    category: business_safety
    check: "Impasse also requires at least one Offer from each side on the negotiation (one with offered_by == STATION_GROUP and one with offered_by == DISTRIBUTOR)"
    error_id: ERR_NO_OFFERS_EXCHANGED
    http_status: 422
    applies_to: "POST /retrans/negotiations/{id}/declare-impasse"

  - priority: 25
    category: business_safety
    check: "An offer may only include a right the station's AffiliationAgreement grants: includes_digital_rights requires digital_rights_grantable, includes_ooh_rights requires ooh_rights_grantable, includes_streaming_rights requires streaming_rights_grantable"
    error_id: ERR_RIGHTS_NOT_GRANTABLE
    http_status: 422
    applies_to: "POST /retrans/negotiations/{id}/offers"

  - priority: 26
    category: business_safety
    check: "The station must have an AffiliationAgreement with status == ACTIVE at the time of offer submission and at the time of agreement execution; SUSPENDED or EXPIRED affiliations block both"
    error_id: ERR_AFFILIATION_NOT_ACTIVE
    http_status: 422
    applies_to: "POST /retrans/negotiations/{id}/offers, POST /retrans/agreements/{id}/execute"

  - priority: 27
    category: business_safety
    check: "Execution requires CarriageAgreement.network_approval_status IN {NOT_REQUIRED, NETWORK_APPROVED}; PENDING_NETWORK and NETWORK_REJECTED both block execution"
    error_id: ERR_NETWORK_APPROVAL_PENDING
    http_status: 422
    applies_to: "POST /retrans/agreements/{id}/execute"

  - priority: 28
    category: business_constraint
    check: "The offer's tier must appear in the station's AffiliationAgreement.permitted_tiers"
    error_id: ERR_TIER_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /retrans/negotiations/{id}/offers"

  - priority: 29
    category: business_constraint
    check: "At most one CarriageElection with status NOT IN {CONSENT_GRANTED, ELECTION_LAPSED} per (station_id, distributor_id, cycle_label); a terminal election does not block a replacement for the same cycle"
    error_id: ERR_DUPLICATE_ELECTION
    http_status: 422
    applies_to: "POST /retrans/elections"

  - priority: 30
    category: business_constraint
    check: "At most one non-voided SubscriberReport per (station_id, distributor_id, period_label)"
    error_id: ERR_REPORT_PERIOD_DUPLICATE
    http_status: 422
    applies_to: "POST /retrans/subscriber-reports"

  - priority: 31
    category: business_constraint
    check: "Half-open carriage terms [effective_start_utc, effective_end_utc) must not overlap another CarriageAgreement with execution_status IN {PENDING_EXECUTION, EXECUTED} on the same (station_id, distributor_id) slot; a term starting exactly when another ends is adjacent, not overlapping, and is allowed"
    error_id: ERR_CARRIAGE_TERM_OVERLAP
    http_status: 422
    applies_to: "POST /retrans/offers/{id}/accept"

  - priority: 32
    category: business_constraint
    check: "Closed interim-extension windows [extension_start_utc, extension_start_utc + extension_days] on the same agreement must not overlap an ACTIVE or LAPSED InterimExtension; unlike carriage terms, sharing the boundary day IS an overlap"
    error_id: ERR_EXTENSION_WINDOW_OVERLAP
    http_status: 422
    applies_to: "POST /retrans/agreements/{id}/interim-extensions"

  - priority: 33
    category: business_fiscal
    check: "Offer.base_rate_per_sub_cents and every rate in the projected ladder must stay at or below MAX_RATE_PER_SUB_CENTS (600); a compliant base whose year-N escalated rate exceeds the cap is still rejected"
    error_id: ERR_RATE_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /retrans/negotiations/{id}/offers"

  - priority: 34
    category: business_fiscal
    check: "CarriageAgreement.consumed_extension_days + extension_days must not exceed MAX_CUMULATIVE_EXTENSION_DAYS (90) summed over the agreement's InterimExtension rows with status IN {ACTIVE, LAPSED}; SUPERSEDED extensions drop out of the sum and free their days; landing exactly on 90 is permitted"
    error_id: ERR_EXTENSION_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "POST /retrans/agreements/{id}/interim-extensions"

  - priority: 35
    category: business_referential
    check: "The referenced SubscriberReport must belong to the same (station_id, distributor_id) pair as the target election or agreement, and must have status IN {REPORTED, UNDER_AUDIT, ADJUSTED, ACCEPTED}"
    error_id: ERR_REPORT_NOT_PRICEABLE
    http_status: 422
    applies_to: "POST /retrans/negotiations/{id}/offers, POST /retrans/agreements/{id}/fee-settlements"

  - priority: 36
    category: business_constraint
    check: "AffiliationAgreement.network_name must equal the parent Station.network_affiliation; an INDEPENDENT station can hold no affiliation agreement at all"
    error_id: ERR_NETWORK_MISMATCH
    http_status: 422
    applies_to: "POST /retrans/stations/{id}/affiliation-agreements"

  - priority: 37
    category: business_constraint
    check: "RightsDispute.disputed_term must be a member of the target CarriageAgreement.granted_rights_scope at creation; a right that was never granted cannot be disputed"
    error_id: ERR_TERM_NOT_IN_GRANT
    http_status: 422
    applies_to: "POST /retrans/agreements/{id}/rights-disputes"

  - priority: 38
    category: state
    check: "expected_negotiation_version must equal Negotiation.version at the moment of the write"
    error_id: ERR_STALE_NEGOTIATION_VERSION
    http_status: 412
    applies_to: "POST /retrans/offers/{id}/accept"

  - priority: 39
    category: state
    check: "expected_agreement_version must equal CarriageAgreement.version at the moment of the write"
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412
    applies_to: "POST /retrans/agreements/{id}/interim-extensions"

# ---------------------------------------------------------------------------
# 1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  # --- Station and affiliation configuration -------------------------------
  - method: POST
    path: "/retrans/stations"
    description: "Register an owned-and-operated station in a DMA"
    roles: [CarriageAdmin]
    code: 201
    input: [call_sign, market_code, dma_rank, market_tv_households, network_affiliation]
    output: Station
    side_effects: ["initialises filed_election_count to 0"]

  - method: GET
    path: "/retrans/stations/{id}"
    description: "Read one station"
    roles: [CarriageAdmin, StationGroupNegotiator, GroupCounsel, DistributorRep, NetworkRepresentative, ComplianceOfficer]
    code: 200
    input: []
    output: Station
    side_effects: []

  - method: POST
    path: "/retrans/stations/{id}/affiliation-agreements"
    description: "Attach the network affiliation contract that governs reverse compensation and grantable rights. Pass status SUSPENDED to model a frozen affiliation."
    roles: [CarriageAdmin]
    code: 201
    input: [network_name, term_end_utc, reverse_comp_floor_per_sub_cents, split_premium_bp, permitted_tiers, "digital_rights_grantable?", "ooh_rights_grantable?", "streaming_rights_grantable?", "status?"]
    output: AffiliationAgreement
    side_effects: ["rejects network_name that differs from the station's network_affiliation"]

  - method: GET
    path: "/retrans/stations/{id}/affiliation-agreements"
    description: "List the affiliation agreements attached to a station"
    roles: [CarriageAdmin, StationGroupNegotiator, GroupCounsel, DistributorRep, NetworkRepresentative, ComplianceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: AffiliationAgreement[]
    side_effects: []

  # --- Distributors --------------------------------------------------------
  - method: POST
    path: "/retrans/distributors"
    description: "Register a cable, DBS, telco or virtual distributor with its subscriber measurement approach"
    roles: [CarriageAdmin]
    code: 201
    input: [name, distributor_type, subscriber_measurement_method, video_household_count]
    output: Distributor
    side_effects: ["computes required_blackout_notice_days from distributor_type (30 for CABLE/DBS/TELCO, 14 for VMVPD)", "initialises open_true_up_count to 0"]

  - method: GET
    path: "/retrans/distributors/{id}"
    description: "Read one distributor"
    roles: [CarriageAdmin, StationGroupNegotiator, GroupCounsel, DistributorRep, NetworkRepresentative, ComplianceOfficer]
    code: 200
    input: []
    output: Distributor
    side_effects: []

  # --- Carriage election cycle ---------------------------------------------
  - method: POST
    path: "/retrans/elections"
    description: "Open a DRAFT carriage election for one station/distributor/cycle slot"
    roles: [StationGroupNegotiator]
    code: 201
    input: [station_id, distributor_id, cycle_label, election_type, requested_tier, incumbent_expiry_utc, incumbent_rate_per_sub_cents]
    output: CarriageElection
    side_effects: ["status starts DRAFT; filed_at_utc stays null", "rejects a second non-terminal election on the same (station_id, distributor_id, cycle_label) slot"]

  - method: GET
    path: "/retrans/elections/{id}"
    description: "Read one carriage election"
    roles: [CarriageAdmin, StationGroupNegotiator, GroupCounsel, DistributorRep, NetworkRepresentative, ComplianceOfficer]
    code: 200
    input: []
    output: CarriageElection
    side_effects: []

  - method: GET
    path: "/retrans/elections"
    description: "List carriage elections, filterable by station, distributor, election type and status"
    roles: [CarriageAdmin, StationGroupNegotiator, GroupCounsel, DistributorRep, NetworkRepresentative, ComplianceOfficer]
    code: 200
    input: ["station_id?", "distributor_id?", "election_type?", "status?", "cycle_label?", "limit?", "offset?"]
    output: CarriageElection[]
    side_effects: []

  - method: PATCH
    path: "/retrans/elections/{id}"
    description: "Amend a DRAFT election before the election deadline"
    roles: [StationGroupNegotiator]
    code: 200
    input: ["election_type?", "requested_tier?", "incumbent_rate_per_sub_cents?"]
    output: CarriageElection
    side_effects: ["rejected once status leaves DRAFT or the clock passes ELECTION_DEADLINE_UTC"]

  - method: POST
    path: "/retrans/elections/{id}/file"
    description: "File the election with the distributor. RETRANS_CONSENT forks to NEGOTIATING and creates the Negotiation; MUST_CARRY forks straight to ELECTION_EFFECTIVE and creates none."
    roles: [StationGroupNegotiator]
    code: 200
    input: []
    output: CarriageElection
    side_effects: ["sets filed_at_utc", "creates one Negotiation with blackout_notice_deadline_utc on the RETRANS_CONSENT branch only", "recomputes Station.filed_election_count"]

  - method: POST
    path: "/retrans/elections/{id}/withdraw"
    description: "Withdraw a filed election back to DRAFT before the election deadline"
    roles: [StationGroupNegotiator]
    code: 200
    input: [withdrawal_reason]
    output: CarriageElection
    side_effects: ["clears filed_at_utc", "cancels the child Negotiation, expires its SUBMITTED Offers and supersedes its SERVED BlackoutNotices", "recomputes Station.filed_election_count back to its pre-file value"]

  - method: GET
    path: "/retrans/elections/{id}/negotiations"
    description: "List the negotiations created by filing this election (0 or 1)"
    roles: [CarriageAdmin, StationGroupNegotiator, GroupCounsel, DistributorRep, NetworkRepresentative, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: Negotiation[]
    side_effects: []

  # --- Subscriber reporting and audit rights -------------------------------
  - method: POST
    path: "/retrans/subscriber-reports"
    description: "Distributor files a period subscriber count; distributor_id is taken from X-User-ID"
    roles: [DistributorRep]
    code: 201
    input: [station_id, period_label, period_start_utc, period_end_utc, reported_subscriber_count, "excluded_free_trial_count?"]
    output: SubscriberReport
    side_effects: ["snapshots measurement_method_snapshot from the distributor", "computes adjusted_subscriber_count, as_reported_basis and billable_subscriber_basis via calculation subscriber_basis_determination"]

  - method: GET
    path: "/retrans/subscriber-reports/{id}"
    description: "Read one subscriber report"
    roles: [CarriageAdmin, StationGroupNegotiator, GroupCounsel, DistributorRep, ComplianceOfficer]
    code: 200
    input: []
    output: SubscriberReport
    side_effects: []

  - method: GET
    path: "/retrans/subscriber-reports"
    description: "List subscriber reports, filterable by station, distributor and period. NetworkRepresentative has no visibility into distributor subscriber data."
    roles: [CarriageAdmin, StationGroupNegotiator, GroupCounsel, DistributorRep, ComplianceOfficer]
    code: 200
    input: ["station_id?", "distributor_id?", "period_label?", "status?", "limit?", "offset?"]
    output: SubscriberReport[]
    side_effects: []

  - method: POST
    path: "/retrans/subscriber-reports/{id}/audit-findings"
    description: "Station group exercises its audit rights and asserts a subscriber-count delta"
    roles: [StationGroupNegotiator]
    code: 201
    input: [adjustment_subscribers, basis_note]
    output: AuditFinding
    side_effects: ["stamps opened_at_utc from the logical clock", "moves the parent SubscriberReport to UNDER_AUDIT from REPORTED or ADJUSTED", "rejected once the clock passes period_end_utc + AUDIT_RIGHTS_WINDOW_DAYS"]

  - method: GET
    path: "/retrans/subscriber-reports/{id}/audit-findings"
    description: "List the audit findings opened against a subscriber report"
    roles: [CarriageAdmin, StationGroupNegotiator, GroupCounsel, DistributorRep, ComplianceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: AuditFinding[]
    side_effects: []

  - method: POST
    path: "/retrans/audit-findings/{id}/resolve"
    description: "Compliance officer substantiates or dismisses an open audit finding"
    roles: [ComplianceOfficer]
    code: 200
    input: [resolution, resolution_note]
    output: AuditFinding
    side_effects: ["SUBSTANTIATED moves the report to ADJUSTED and recomputes audit_adjustment_subscribers, adjusted_subscriber_count and billable_subscriber_basis", "flags true_up_required on the report's ISSUED FeeSettlements and recomputes Distributor.open_true_up_count", "DISMISSED with no substantiated sibling returns the report to REPORTED"]

  - method: GET
    path: "/retrans/subscriber-reports/{id}/fee-settlements"
    description: "List the settlements that drew their basis from this subscriber report"
    roles: [CarriageAdmin, StationGroupNegotiator, GroupCounsel, DistributorRep, ComplianceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: FeeSettlement[]
    side_effects: []

  # --- Negotiation, offers and good faith ----------------------------------
  - method: GET
    path: "/retrans/negotiations/{id}"
    description: "Read one negotiation, including its version for OCC and its blackout_notice_deadline_utc"
    roles: [CarriageAdmin, StationGroupNegotiator, GroupCounsel, DistributorRep, NetworkRepresentative, ComplianceOfficer]
    code: 200
    input: []
    output: Negotiation
    side_effects: []

  - method: POST
    path: "/retrans/negotiations/{id}/offers"
    description: "Submit a rate offer. offered_by is derived from X-User-Role, so the same endpoint serves both counterparties and drives the negotiation-round cycle."
    roles: [StationGroupNegotiator, DistributorRep]
    code: 201
    input: [subscriber_report_id, base_rate_per_sub_cents, escalator_bp_per_year, term_months, tier, penetration_commitment_bp, "includes_digital_rights?", "includes_ooh_rights?", "includes_streaming_rights?"]
    output: Offer
    side_effects: ["increments Negotiation.round_number and stamps it on the offer", "snapshots projection_basis_subscribers from the referenced report's billable_subscriber_basis", "computes year_rate_schedule_compound_cents and projected_total_fee_cents via calculation offer_projected_total_fee under COMPOUND_ANNUAL", "flips Negotiation.status to the counterparty's turn and increments Negotiation.version by 1", "a station offer submitted at IMPASSE supersedes SERVED BlackoutNotices and resets notice_compliance_status to NOT_REQUIRED"]

  - method: GET
    path: "/retrans/negotiations/{id}/offers"
    description: "List the offers exchanged in a negotiation"
    roles: [CarriageAdmin, StationGroupNegotiator, GroupCounsel, DistributorRep, NetworkRepresentative, ComplianceOfficer]
    code: 200
    input: ["offered_by?", "status?", "limit?", "offset?"]
    output: Offer[]
    side_effects: []

  - method: GET
    path: "/retrans/offers/{id}"
    description: "Read one offer with its projected fee ladder"
    roles: [CarriageAdmin, StationGroupNegotiator, GroupCounsel, DistributorRep, NetworkRepresentative, ComplianceOfficer]
    code: 200
    input: []
    output: Offer
    side_effects: []

  - method: GET
    path: "/retrans/offers"
    description: "List offers across negotiations, filterable by the subscriber report they priced against"
    roles: [CarriageAdmin, StationGroupNegotiator, GroupCounsel, DistributorRep, NetworkRepresentative, ComplianceOfficer]
    code: 200
    input: ["negotiation_id?", "subscriber_report_id?", "offered_by?", "status?", "limit?", "offset?"]
    output: Offer[]
    side_effects: []

  - method: POST
    path: "/retrans/offers/{id}/accept"
    description: "Group counsel binds the station group to an outstanding offer, creating the carriage agreement. Requires the negotiation version the caller last observed."
    roles: [GroupCounsel]
    code: 201
    input: [expected_negotiation_version, effective_start_utc, effective_end_utc]
    output: CarriageAgreement
    side_effects: ["creates one CarriageAgreement with execution_status PENDING_EXECUTION and accepted_by_user_id == X-User-ID", "computes contract_year_rate_schedule_cents via calculation offer_projected_total_fee under SIMPLE_ANNUAL", "derives granted_rights_scope from the accepted offer's rights flags", "moves the Negotiation to CONSENTED and the parent CarriageElection to CONSENT_GRANTED", "expires every sibling SUBMITTED Offer", "recomputes Station.filed_election_count", "increments Negotiation.version by 1", "rejects a term that overlaps an existing PENDING_EXECUTION or EXECUTED agreement on the same (station_id, distributor_id) slot"]

  - method: POST
    path: "/retrans/offers/{id}/reject"
    description: "Counterparty rejects an outstanding offer without ending the negotiation"
    roles: [StationGroupNegotiator, DistributorRep]
    code: 200
    input: [rejection_reason]
    output: Offer
    side_effects: ["sets rejection_reason", "leaves Negotiation.status, Negotiation.round_number and Negotiation.version unchanged"]

  - method: POST
    path: "/retrans/negotiations/{id}/good-faith-log"
    description: "Append an immutable good-faith conduct entry; MEETING_HELD entries feed good_faith_meeting_count"
    roles: [StationGroupNegotiator, DistributorRep, ComplianceOfficer]
    code: 201
    input: [event_type, occurred_at_utc, summary]
    output: GoodFaithLog
    side_effects: ["assigns sequence_index in created_at ASC order", "stamps actor_role from X-User-Role", "recomputes Negotiation.good_faith_meeting_count when event_type == MEETING_HELD"]

  - method: GET
    path: "/retrans/negotiations/{id}/good-faith-log"
    description: "Read the good-faith conduct record of a negotiation in append order"
    roles: [CarriageAdmin, StationGroupNegotiator, GroupCounsel, DistributorRep, NetworkRepresentative, ComplianceOfficer]
    code: 200
    input: ["event_type?", "limit?", "offset?"]
    output: GoodFaithLog[]
    side_effects: []

  - method: POST
    path: "/retrans/negotiations/{id}/declare-impasse"
    description: "Station group declares impasse; requires three good-faith meetings and offers from both sides"
    roles: [StationGroupNegotiator]
    code: 200
    input: [impasse_statement]
    output: Negotiation
    side_effects: ["sets impasse_declared_at_utc", "recomputes notice_compliance_status to NOTICE_PENDING or NOTICE_DEFICIENT against blackout_notice_deadline_utc", "increments Negotiation.version by 1"]

  - method: POST
    path: "/retrans/negotiations/{id}/blackout-notices"
    description: "Compliance officer records the subscriber blackout notice served ahead of the incumbent expiry"
    roles: [ComplianceOfficer]
    code: 201
    input: [subscriber_notice_count, notice_channel]
    output: BlackoutNotice
    side_effects: ["stamps served_at_utc from the logical clock and snapshots required_notice_days_snapshot", "recomputes Negotiation.notice_compliance_status to NOTICE_SERVED", "rejected when the clock is past Negotiation.blackout_notice_deadline_utc"]

  - method: GET
    path: "/retrans/negotiations/{id}/blackout-notices"
    description: "List the blackout notices served on a negotiation"
    roles: [CarriageAdmin, StationGroupNegotiator, GroupCounsel, DistributorRep, NetworkRepresentative, ComplianceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: BlackoutNotice[]
    side_effects: []

  # --- Carriage agreement: two independent dimensions ----------------------
  - method: GET
    path: "/retrans/agreements/{id}"
    description: "Read one carriage agreement, including its version for OCC and both status dimensions"
    roles: [CarriageAdmin, StationGroupNegotiator, GroupCounsel, DistributorRep, NetworkRepresentative, ComplianceOfficer]
    code: 200
    input: []
    output: CarriageAgreement
    side_effects: []

  - method: GET
    path: "/retrans/agreements"
    description: "List carriage agreements, filterable by originating negotiation, accepted offer and execution status"
    roles: [CarriageAdmin, StationGroupNegotiator, GroupCounsel, DistributorRep, NetworkRepresentative, ComplianceOfficer]
    code: 200
    input: ["negotiation_id?", "accepted_offer_id?", "execution_status?", "network_approval_status?", "limit?", "offset?"]
    output: CarriageAgreement[]
    side_effects: []

  - method: POST
    path: "/retrans/agreements/{id}/network-approval"
    description: "Network representative approves or rejects the granted rights scope on the network dimension"
    roles: [NetworkRepresentative]
    code: 200
    input: [decision, decision_note]
    output: CarriageAgreement
    side_effects: ["moves network_approval_status PENDING_NETWORK -> NETWORK_APPROVED or NETWORK_REJECTED", "leaves execution_status untouched", "increments CarriageAgreement.version by 1"]

  - method: POST
    path: "/retrans/agreements/{id}/execute"
    description: "A second group counsel executes the agreement; the accepting counsel may not execute their own acceptance"
    roles: [GroupCounsel]
    code: 200
    input: [execution_note]
    output: CarriageAgreement
    side_effects: ["sets executed_by_user_id and moves execution_status to EXECUTED", "supersedes ACTIVE InterimExtensions on other agreements of the same (station_id, distributor_id) slot whose windows intersect this term, then recomputes those agreements' consumed_extension_days", "increments CarriageAgreement.version by 1"]

  - method: GET
    path: "/retrans/agreements/{id}/fee-projection"
    description: "Computed read exposing both variants of calculation offer_projected_total_fee side by side for the accepted offer"
    roles: [CarriageAdmin, StationGroupNegotiator, GroupCounsel, DistributorRep, NetworkRepresentative, ComplianceOfficer]
    code: 200
    input: []
    output: "{ compound_total_fee_cents: integer, simple_total_fee_cents: integer, divergence_cents: integer, year_rate_schedule_compound_cents: integer[], year_rate_schedule_simple_cents: integer[] }"
    side_effects: []

  # --- Interim extensions --------------------------------------------------
  - method: POST
    path: "/retrans/agreements/{id}/interim-extensions"
    description: "Extend carriage on interim terms while the successor deal is unfinished. Requires the agreement version the caller last observed."
    roles: [StationGroupNegotiator]
    code: 201
    input: [expected_agreement_version, extension_days, extension_start_utc, extension_rate_basis]
    output: InterimExtension
    side_effects: ["computes extension_end_utc as extension_start_utc + extension_days days", "computes effective_rate_per_sub_cents via calculation interim_extension_rate", "adds extension_days to CarriageAgreement.consumed_extension_days and pushes the agreement's effective term forward", "increments CarriageAgreement.version by 1", "rejects a window that overlaps an ACTIVE or LAPSED extension, or a draw that pushes consumed_extension_days past MAX_CUMULATIVE_EXTENSION_DAYS"]

  - method: GET
    path: "/retrans/agreements/{id}/interim-extensions"
    description: "List the interim extensions granted on an agreement"
    roles: [CarriageAdmin, StationGroupNegotiator, GroupCounsel, DistributorRep, NetworkRepresentative, ComplianceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: InterimExtension[]
    side_effects: []

  # --- Rights definition disputes -----------------------------------------
  - method: POST
    path: "/retrans/agreements/{id}/rights-disputes"
    description: "Either counterparty contests the definition of a granted right; raised_by is derived from X-User-Role"
    roles: [StationGroupNegotiator, DistributorRep]
    code: 201
    input: [disputed_term, claimed_definition]
    output: RightsDispute
    side_effects: ["rejects a disputed_term that is not in the agreement's granted_rights_scope", "credit_bp_applied starts at 0"]

  - method: GET
    path: "/retrans/agreements/{id}/rights-disputes"
    description: "List the rights definition disputes on an agreement"
    roles: [CarriageAdmin, StationGroupNegotiator, GroupCounsel, DistributorRep, NetworkRepresentative, ComplianceOfficer]
    code: 200
    input: ["status?", "disputed_term?", "limit?", "offset?"]
    output: RightsDispute[]
    side_effects: []

  - method: POST
    path: "/retrans/rights-disputes/{id}/resolve"
    description: "Compliance officer sends the dispute to mediation, or resolves the term as INCLUDED or EXCLUDED from the grant"
    roles: [ComplianceOfficer]
    code: 200
    input: [resolution, resolution_note]
    output: RightsDispute
    side_effects: ["EXCLUDED sets credit_bp_applied, drops disputed_term from the agreement's granted_rights_scope and recomputes rights_credit_bp_total, bumping CarriageAgreement.version by 1", "EXCLUDED then recomputes every ISSUED FeeSettlement on the agreement via calculation reverse_compensation_split in created_at ASC order", "EXCLUDED finally re-derives CarriageAgreement.lifetime_gross_fee_cents and lifetime_net_retained_cents", "MEDIATION and INCLUDED leave every amount untouched"]

  # --- Fee settlement and reverse compensation ----------------------------
  - method: POST
    path: "/retrans/agreements/{id}/fee-settlements"
    description: "Group counsel issues one monthly settlement, splitting the gross fee with the network"
    roles: [GroupCounsel]
    code: 201
    input: [period_label, period_start_utc, period_end_utc, subscriber_report_id]
    output: FeeSettlement
    side_effects: ["derives contract_year_index and rate_per_sub_cents from the agreement's SIMPLE_ANNUAL ladder", "snapshots billable_subscriber_basis_snapshot from the report's as_reported_basis and stamps basis_variant AS_REPORTED", "computes gross_fee_cents, rights_credit_cents, reverse_comp_split_bp, reverse_comp_cents, actual_penetration_bp, penetration_shortfall_bp, penetration_penalty_cents and net_retained_cents via calculation reverse_compensation_split", "stamps issued_by_user_id from X-User-ID", "adds to CarriageAgreement.lifetime_gross_fee_cents and lifetime_net_retained_cents"]

  - method: GET
    path: "/retrans/agreements/{id}/fee-settlements"
    description: "List the settlements issued under an agreement. The distributor is not party to the station group's reverse-compensation split, so DistributorRep cannot read this ledger."
    roles: [CarriageAdmin, StationGroupNegotiator, GroupCounsel, NetworkRepresentative, ComplianceOfficer]
    code: 200
    input: ["status?", "basis_variant?", "period_label?", "limit?", "offset?"]
    output: FeeSettlement[]
    side_effects: []

  - method: POST
    path: "/retrans/fee-settlements/{id}/true-up"
    description: "Re-settle a period against the audited subscriber basis once an audit finding has been substantiated"
    roles: [GroupCounsel]
    code: 200
    input: [true_up_note]
    output: FeeSettlement
    side_effects: ["flips basis_variant to AUDITED and adopts the report's billable_subscriber_basis", "recomputes every amount via calculation reverse_compensation_split under the TRUE_UP variant", "clears true_up_required, re-derives the agreement's lifetime ledger and recomputes Distributor.open_true_up_count"]

  - method: POST
    path: "/retrans/fee-settlements/{id}/void"
    description: "A second group counsel voids a settlement issued in error; the issuing counsel may not void their own settlement"
    roles: [GroupCounsel]
    code: 200
    input: [void_reason]
    output: FeeSettlement
    side_effects: ["moves status to VOIDED", "re-derives CarriageAgreement.lifetime_gross_fee_cents and lifetime_net_retained_cents over the remaining ISSUED and TRUED_UP settlements, restoring the ledger to its pre-issuance value", "recomputes Distributor.open_true_up_count"]

  # --- Time-driven maintenance and test-driving surface --------------------
  - method: POST
    path: "/retrans/expiration-sweep"
    description: "Advance every time-gated lifecycle against the current logical clock: expire terms, lapse extensions and elections, accept reports whose audit window has closed, expire affiliations"
    roles: [CarriageAdmin]
    code: 200
    input: []
    output: "{ expired_agreement_count: integer, lapsed_extension_count: integer, lapsed_election_count: integer, accepted_report_count: integer, expired_affiliation_count: integer }"
    side_effects: ["EXECUTED agreements past effective_end_utc move to EXPIRED", "ACTIVE extensions past extension_end_utc move to LAPSED", "NEGOTIATING elections past incumbent_expiry_utc with no agreement and no covering extension move to ELECTION_LAPSED, cancelling their negotiation and expiring its SUBMITTED offers", "reports past their audit window with no OPEN finding move to ACCEPTED", "ACTIVE affiliations past term_end_utc move to EXPIRED"]

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint that sets the server's logical clock. Before any call the logical clock reads exactly 2026-08-01T00:00:00Z; it never falls back to wall-clock time."
    roles: [CarriageAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["every subsequent deadline, expiry and window comparison evaluates against the new instant", "performs no state transitions of its own"]

# ---------------------------------------------------------------------------
# 1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  # --- authentication and authorization ------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, empty, or naming a role outside the six declared in 1.7"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "The caller's role is not in the target endpoint's roles list"
  - id: ERR_NOT_COUNTERPARTY
    http: 403
    condition: "A StationGroupNegotiator whose X-User-ID is not the resource's station_id, or a DistributorRep whose X-User-ID is not the resource's distributor_id, attempts to act on it"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The GroupCounsel executing an agreement is the same X-User-ID that accepted the offer, or the GroupCounsel voiding a settlement is the same X-User-ID that issued it"

  # --- request shape --------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, unknown enum value, non-integer or out-of-range numeric, unparseable timestamp, inverted period or term interval, or pagination parameter outside limit 1..100 / offset < 0"

  # --- existence ------------------------------------------------------------
  - id: ERR_STATION_NOT_FOUND
    http: 404
    condition: "No Station with the supplied path or body station_id"
  - id: ERR_DISTRIBUTOR_NOT_FOUND
    http: 404
    condition: "No Distributor with the supplied path or body distributor_id, including a DistributorRep X-User-ID that resolves to nothing"
  - id: ERR_ELECTION_NOT_FOUND
    http: 404
    condition: "No CarriageElection with the supplied id"
  - id: ERR_NEGOTIATION_NOT_FOUND
    http: 404
    condition: "No Negotiation with the supplied id"
  - id: ERR_OFFER_NOT_FOUND
    http: 404
    condition: "No Offer with the supplied id"
  - id: ERR_AGREEMENT_NOT_FOUND
    http: 404
    condition: "No CarriageAgreement with the supplied id"
  - id: ERR_REPORT_NOT_FOUND
    http: 404
    condition: "No SubscriberReport with the supplied path id or body subscriber_report_id"
  - id: ERR_AUDIT_FINDING_NOT_FOUND
    http: 404
    condition: "No AuditFinding with the supplied id"
  - id: ERR_DISPUTE_NOT_FOUND
    http: 404
    condition: "No RightsDispute with the supplied id"
  - id: ERR_SETTLEMENT_NOT_FOUND
    http: 404
    condition: "No FeeSettlement with the supplied id"

  # --- state preconditions --------------------------------------------------
  - id: ERR_ELECTION_NOT_DRAFT
    http: 409
    condition: "Amending or filing a CarriageElection whose status is not DRAFT"
  - id: ERR_ELECTION_NOT_WITHDRAWABLE
    http: 409
    condition: "Withdrawing a CarriageElection whose status is not NEGOTIATING or ELECTION_EFFECTIVE"
  - id: ERR_NEGOTIATION_NOT_OPEN
    http: 409
    condition: "Submitting an offer, logging good faith, declaring impasse or serving a blackout notice on a CONSENTED or CANCELLED Negotiation"
  - id: ERR_OFFER_NOT_OUTSTANDING
    http: 409
    condition: "Accepting or rejecting an Offer whose status is not SUBMITTED, including the second accept of the same offer"
  - id: ERR_AGREEMENT_NOT_PENDING_EXECUTION
    http: 409
    condition: "Approving or executing a CarriageAgreement that is not PENDING_EXECUTION, or extending / disputing / settling one that is not EXECUTED"
  - id: ERR_REPORT_NOT_AUDITABLE
    http: 409
    condition: "Opening an audit finding on a SubscriberReport whose status is ACCEPTED"
  - id: ERR_AUDIT_FINDING_NOT_OPEN
    http: 409
    condition: "Resolving an AuditFinding that is already SUBSTANTIATED or DISMISSED"
  - id: ERR_DISPUTE_NOT_PENDING
    http: 409
    condition: "Resolving a RightsDispute that is already RESOLVED_INCLUDED or RESOLVED_EXCLUDED"
  - id: ERR_SETTLEMENT_NOT_ISSUED
    http: 409
    condition: "Truing up a FeeSettlement that is not ISSUED, or voiding one that is already VOIDED"

  # --- optimistic concurrency ----------------------------------------------
  - id: ERR_STALE_NEGOTIATION_VERSION
    http: 412
    condition: "expected_negotiation_version does not match Negotiation.version on POST /retrans/offers/{id}/accept"
  - id: ERR_STALE_AGREEMENT_VERSION
    http: 412
    condition: "expected_agreement_version does not match CarriageAgreement.version on POST /retrans/agreements/{id}/interim-extensions"

  # --- referential business rules -----------------------------------------
  - id: ERR_MUST_CARRY_NO_NEGOTIATION
    http: 422
    condition: "Filing a MUST_CARRY election whose requested_tier is not BROADCAST_BASIC, or offering / seeking consent on a MUST_CARRY election, which grants compulsory uncompensated BROADCAST_BASIC carriage"
  - id: ERR_NO_STATION_OFFER_ON_RECORD
    http: 422
    condition: "extension_rate_basis LAST_STATION_OFFER or MIDPOINT requested when the negotiation holds no station-group offer"
  - id: ERR_TRUE_UP_NOT_REQUIRED
    http: 422
    condition: "Truing up a settlement whose SubscriberReport has audit_adjustment_subscribers == 0"
  - id: ERR_REPORT_NOT_PRICEABLE
    http: 422
    condition: "The referenced SubscriberReport belongs to a different (station_id, distributor_id) pair than the target election or agreement"

  # --- temporal business rules ---------------------------------------------
  - id: ERR_ELECTION_WINDOW_CLOSED
    http: 422
    condition: "Filing, amending or withdrawing an election after ELECTION_DEADLINE_UTC (2026-10-01T00:00:00Z)"
  - id: ERR_AUDIT_WINDOW_EXPIRED
    http: 422
    condition: "Opening an audit finding more than AUDIT_RIGHTS_WINDOW_DAYS (180) after the report's period_end_utc"
  - id: ERR_BLACKOUT_NOTICE_LATE
    http: 422
    condition: "Serving a subscriber blackout notice after Negotiation.blackout_notice_deadline_utc"

  # --- safety / compliance business rules ---------------------------------
  - id: ERR_GOOD_FAITH_NOT_SATISFIED
    http: 422
    condition: "Declaring impasse with fewer than MIN_GOOD_FAITH_MEETINGS (3) MEETING_HELD entries on the negotiation"
  - id: ERR_NO_OFFERS_EXCHANGED
    http: 422
    condition: "Declaring impasse before both a station-group and a distributor offer exist on the negotiation"
  - id: ERR_RIGHTS_NOT_GRANTABLE
    http: 422
    condition: "An offer includes a digital, out-of-home or streaming right the station's ACTIVE AffiliationAgreement does not mark grantable"
  - id: ERR_AFFILIATION_NOT_ACTIVE
    http: 422
    condition: "Submitting an offer or executing an agreement for an affiliated station with no AffiliationAgreement in status ACTIVE"
  - id: ERR_NETWORK_APPROVAL_PENDING
    http: 422
    condition: "Executing an agreement whose network_approval_status is PENDING_NETWORK or NETWORK_REJECTED"

  # --- constraint business rules ------------------------------------------
  - id: ERR_TIER_NOT_PERMITTED
    http: 422
    condition: "The offered tier is outside the station's AffiliationAgreement.permitted_tiers"
  - id: ERR_DUPLICATE_ELECTION
    http: 422
    condition: "A non-terminal CarriageElection already exists for the same (station_id, distributor_id, cycle_label)"
  - id: ERR_REPORT_PERIOD_DUPLICATE
    http: 422
    condition: "A SubscriberReport already exists for the same (station_id, distributor_id, period_label), or a FeeSettlement already exists for the same (agreement_id, period_label)"
  - id: ERR_CARRIAGE_TERM_OVERLAP
    http: 422
    condition: "The requested half-open carriage term overlaps a PENDING_EXECUTION or EXECUTED agreement on the same (station_id, distributor_id) slot; sharing only the boundary instant is allowed"
  - id: ERR_EXTENSION_WINDOW_OVERLAP
    http: 422
    condition: "The requested closed extension window shares at least one instant with an ACTIVE or LAPSED InterimExtension on the same agreement"
  - id: ERR_NETWORK_MISMATCH
    http: 422
    condition: "AffiliationAgreement.network_name differs from the parent Station.network_affiliation, or the station is INDEPENDENT"
  - id: ERR_TERM_NOT_IN_GRANT
    http: 422
    condition: "The disputed_term is not a member of the agreement's granted_rights_scope"

  # --- fiscal business rules ----------------------------------------------
  - id: ERR_RATE_CAP_EXCEEDED
    http: 422
    condition: "A per-subscriber rate in the offer's projected ladder exceeds MAX_RATE_PER_SUB_CENTS (600)"
  - id: ERR_EXTENSION_BUDGET_EXCEEDED
    http: 422
    condition: "consumed_extension_days + extension_days would exceed MAX_CUMULATIVE_EXTENSION_DAYS (90) on the agreement"

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: CarriageAdmin
    description: "Platform operator who sets up stations, network affiliations and distributors, and drives the time-based maintenance surface"
    identity: "opaque"
    exclusive_operations:
      - "POST /retrans/stations"
      - "POST /retrans/stations/{id}/affiliation-agreements"
      - "POST /retrans/distributors"
      - "POST /retrans/expiration-sweep"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "all GET reads except GET /retrans/agreements/{id}/fee-settlements is also readable by this role"

  - name: StationGroupNegotiator
    description: "Station-group side deal maker; acts as the Station itself and owns the election, offer, audit-rights, dispute and extension levers"
    identity: "entity_backed:Station"
    exclusive_operations:
      - "POST /retrans/elections"
      - "PATCH /retrans/elections/{id}"
      - "POST /retrans/elections/{id}/file"
      - "POST /retrans/elections/{id}/withdraw"
      - "POST /retrans/subscriber-reports/{id}/audit-findings"
      - "POST /retrans/negotiations/{id}/declare-impasse"
      - "POST /retrans/agreements/{id}/interim-extensions"
    shared_operations:
      - "POST /retrans/negotiations/{id}/offers (shared with DistributorRep; offered_by is derived from the role)"
      - "POST /retrans/offers/{id}/reject (shared with DistributorRep; only the counterparty of offered_by may reject)"
      - "POST /retrans/negotiations/{id}/good-faith-log (shared with DistributorRep and ComplianceOfficer)"
      - "POST /retrans/agreements/{id}/rights-disputes (shared with DistributorRep; raised_by is derived from the role)"
      - "all GET reads"

  - name: GroupCounsel
    description: "Station-group counsel who binds and executes contracts and runs the settlement ledger; two distinct counsel user ids are required to accept-then-execute and to issue-then-void"
    identity: "opaque"
    exclusive_operations:
      - "POST /retrans/offers/{id}/accept"
      - "POST /retrans/agreements/{id}/execute"
      - "POST /retrans/agreements/{id}/fee-settlements"
      - "POST /retrans/fee-settlements/{id}/true-up"
      - "POST /retrans/fee-settlements/{id}/void"
    shared_operations:
      - "all GET reads"

  - name: DistributorRep
    description: "Distributor-side counterparty; acts as the Distributor itself, files subscriber reports and counters offers"
    identity: "entity_backed:Distributor"
    exclusive_operations:
      - "POST /retrans/subscriber-reports"
    shared_operations:
      - "POST /retrans/negotiations/{id}/offers (shared with StationGroupNegotiator)"
      - "POST /retrans/offers/{id}/reject (shared with StationGroupNegotiator)"
      - "POST /retrans/negotiations/{id}/good-faith-log (shared with StationGroupNegotiator and ComplianceOfficer)"
      - "POST /retrans/agreements/{id}/rights-disputes (shared with StationGroupNegotiator)"
      - "all GET reads except GET /retrans/agreements/{id}/fee-settlements, which exposes the station group's reverse-compensation split"

  - name: NetworkRepresentative
    description: "Network affiliate-relations representative who approves the rights scope the station group grants downstream"
    identity: "opaque"
    exclusive_operations:
      - "POST /retrans/agreements/{id}/network-approval"
    shared_operations:
      - "all GET reads except GET /retrans/subscriber-reports, GET /retrans/subscriber-reports/{id}, GET /retrans/subscriber-reports/{id}/audit-findings and GET /retrans/subscriber-reports/{id}/fee-settlements, which expose distributor subscriber data"

  - name: ComplianceOfficer
    description: "Neutral compliance function that adjudicates audit findings and rights-definition disputes and records subscriber blackout notices"
    identity: "opaque"
    exclusive_operations:
      - "POST /retrans/audit-findings/{id}/resolve"
      - "POST /retrans/rights-disputes/{id}/resolve"
      - "POST /retrans/negotiations/{id}/blackout-notices"
    shared_operations:
      - "POST /retrans/negotiations/{id}/good-faith-log (shared with StationGroupNegotiator and DistributorRep)"
      - "all GET reads"
