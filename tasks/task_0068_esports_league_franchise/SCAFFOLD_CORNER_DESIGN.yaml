scaffold_corner_design:
  # =================================================================
  - section: entities
    instances:
      - name: create_season_returns_201_with_defaults_applied
        claim_type: Creation
        grounds: [entities.Season, "endpoints[\"POST /seasons\"]"]
        distinguishing_aspect: "POST /seasons with name + salary_cap_cents returns 201; phase==SETUP, trade_window_state==CLOSED, roster_min==5, roster_max==8, two_way_max==2, penalty_threshold==3, version==1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /seasons"
              payload: { name: "Spring", salary_cap_cents: 50000000 }
              as: LeagueCommissioner
              captures: { sid: $.data.id }
          assert:
            - "response.status == 201"
            - "response.data.phase == SETUP"
            - "response.data.trade_window_state == CLOSED"
            - "response.data.roster_min == 5"
            - "response.data.roster_max == 8"
            - "response.data.two_way_max == 2"
            - "response.data.penalty_threshold == 3"
            - "response.data.version == 1"
      - name: create_season_missing_salary_cap_returns_validation
        claim_type: Required Fields
        grounds: [entities.Season.fields.salary_cap_cents, "validations[priority=13]"]
        distinguishing_aspect: "POST /seasons omitting salary_cap_cents returns 400 ERR_VALIDATION."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /seasons"
              payload: { name: "NoCapt" }
              as: LeagueCommissioner
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_VALIDATION"
      - name: get_team_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Team, "endpoints[\"GET /teams/{id}\"]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /teams/{unknown-uuid} returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /teams/00000000-0000-4000-8000-000000000000"
              as: LeagueCommissioner
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"
      - name: create_team_system_fields_generated_input_ignored
        claim_type: System Fields
        grounds: [entities.Team, "endpoints[\"POST /teams\"]"]
        distinguishing_aspect: "POST /teams ignores any client-supplied id/version/penalty_points; server mints id, sets version==1, penalty_points==0, posture==OPEN, seed==null."
        test_recipe:
          setup: ["a season exists"]
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "S", salary_cap_cents: 50000000 }
              as: LeagueCommissioner
              captures: { sid: $.data.id }
          trigger:
            - call: "POST /teams"
              payload: { season_id: "${sid}", name: "Z", market_size_weight: 2 }
              as: LeagueCommissioner
              captures: { tid: $.data.id }
          assert:
            - "response.status == 201"
            - "response.data.version == 1"
            - "response.data.penalty_points == 0"
            - "response.data.posture == OPEN"
            - "response.data.seed == null"
      - name: create_team_invalid_market_weight_returns_invalid_field_value
        claim_type: Type Constraints
        grounds: [entities.Team.fields.market_size_weight, "validations[priority=14]"]
        distinguishing_aspect: "POST /teams with market_size_weight=0 (< 1) returns 422 ERR_INVALID_FIELD_VALUE."
        test_recipe:
          setup: ["a season exists"]
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "S", salary_cap_cents: 50000000 }
              as: LeagueCommissioner
              captures: { sid: $.data.id }
          trigger:
            - call: "POST /teams"
              payload: { season_id: "${sid}", name: "Bad", market_size_weight: 0 }
              as: LeagueCommissioner
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_FIELD_VALUE"
      - name: revenue_share_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.RevenueShare]
        distinguishing_aspect: "RevenueShare has common_fields:false — it carries id+created_at only, no version field, and no update/delete endpoint exists for it."
        test_recipe:
          setup: ["season with one team A; sponsorship distributed creates one RevenueShare for A"]
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "S", salary_cap_cents: 50000000 }
              as: LeagueCommissioner
              captures: { sid: $.data.id }
            - call: "POST /teams"
              payload: { season_id: "${sid}", name: "A", market_size_weight: 1 }
              as: LeagueCommissioner
              captures: { aid: $.data.id }
            - call: "POST /sponsorships"
              payload: { season_id: "${sid}", sponsor_name: "Acme", pool_cents: 10000000, league_share_pct: 0.40 }
              as: LeagueCommissioner
              captures: { spo_id: $.data.id, spo_v: $.data.version }
            - call: "POST /sponsorships/${spo_id}/distribute"
              payload: { expected_sponsorship_version: "${spo_v}" }
              as: LeagueCommissioner
          trigger:
            - call: "GET /teams/${aid}/revenue-shares"
              as: LeagueCommissioner
              captures: { share_id: "$.data[0].id" }
          assert:
            - "response.status == 200"
            - "response.data[0].amount_cents == 6000000"
            - "response.data[0].id is a UUID with no version field present on the object"

  # =================================================================
  - section: state_machines
    instances:
      - name: cancel_already_rejected_trade_via_reject_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Trade.transitions.PROPOSED_to_REJECTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Rejecting a trade already in REJECTED returns 409 ERR_INVALID_STATE; no side effects."
        test_recipe:
          setup: ["REGULAR season, OPEN window, F and G, PROPOSED trade TR then rejected once"]
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "S", salary_cap_cents: 50000000 }
              as: LeagueCommissioner
              captures: { sid: $.data.id }
            - call: "POST /seasons/${sid}/start-regular"
              as: LeagueCommissioner
            - call: "POST /seasons/${sid}/trade-window"
              payload: { trade_window_state: "OPEN" }
              as: LeagueCommissioner
            - call: "POST /teams"
              payload: { season_id: "${sid}", name: "F", market_size_weight: 1 }
              as: LeagueCommissioner
              captures: { f_id: $.data.id }
            - call: "POST /teams"
              payload: { season_id: "${sid}", name: "G", market_size_weight: 1 }
              as: LeagueCommissioner
              captures: { g_id: $.data.id }
            - call: "POST /players"
              payload: { season_id: "${sid}", handle: "pf" }
              as: LeagueCommissioner
              captures: { pf_id: $.data.id }
            - call: "POST /players"
              payload: { season_id: "${sid}", handle: "pg" }
              as: LeagueCommissioner
              captures: { pg_id: $.data.id }
            - call: "POST /contracts"
              payload: { team_id: "${f_id}", player_id: "${pf_id}", base_salary_cents: 10000000, contract_type: "STANDARD", term_start: "2026-01-01T00:00:00.000Z", term_end: "2026-12-31T00:00:00.000Z" }
              as: TeamGM
              as_user_id: "${f_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /contracts"
              payload: { team_id: "${g_id}", player_id: "${pg_id}", base_salary_cents: 12000000, contract_type: "STANDARD", term_start: "2026-01-01T00:00:00.000Z", term_end: "2026-12-31T00:00:00.000Z" }
              as: TeamGM
              as_user_id: "${g_id}"
              captures: { c2_id: $.data.id }
            - call: "POST /trades"
              payload: { season_id: "${sid}", from_team_id: "${f_id}", to_team_id: "${g_id}", contract_ids_out: ["${c1_id}"], contract_ids_in: ["${c2_id}"] }
              as: TeamGM
              as_user_id: "${f_id}"
              captures: { tr_id: $.data.id }
            - call: "POST /trades/${tr_id}/reject"
              as: TeamGM
              as_user_id: "${g_id}"
          trigger:
            - call: "POST /trades/${tr_id}/reject"
              as: TeamGM
              as_user_id: "${g_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
      - name: distribute_already_distributed_sponsorship_returns_invalid_state
        claim_type: idempotency
        grounds: [state_machines.Sponsorship.transitions.PENDING_to_DISTRIBUTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Distributing a DISTRIBUTED sponsorship a second time returns 409 ERR_INVALID_STATE; no new RevenueShare rows created."
        test_recipe:
          setup: ["season with team A; sponsorship distributed once"]
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "S", salary_cap_cents: 50000000 }
              as: LeagueCommissioner
              captures: { sid: $.data.id }
            - call: "POST /teams"
              payload: { season_id: "${sid}", name: "A", market_size_weight: 1 }
              as: LeagueCommissioner
              captures: { aid: $.data.id }
            - call: "POST /sponsorships"
              payload: { season_id: "${sid}", sponsor_name: "Acme", pool_cents: 10000000, league_share_pct: 0.40 }
              as: LeagueCommissioner
              captures: { spo_id: $.data.id, spo_v: $.data.version }
            - call: "POST /sponsorships/${spo_id}/distribute"
              payload: { expected_sponsorship_version: "${spo_v}" }
              as: LeagueCommissioner
              captures: { spo_v2: $.data.version }
          trigger:
            - call: "POST /sponsorships/${spo_id}/distribute"
              payload: { expected_sponsorship_version: "${spo_v2}" }
              as: LeagueCommissioner
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
      - name: start_playoffs_below_roster_min_returns_playoff_precondition
        claim_type: Precondition Enforcement
        grounds: [state_machines.Season.transitions.REGULAR_to_PLAYOFFS, "validations[priority=12]", "errors[ERR_PLAYOFF_PRECONDITION]"]
        distinguishing_aspect: "start-playoffs with a team holding fewer than roster_min (5) ACTIVE STANDARD contracts returns 409 ERR_PLAYOFF_PRECONDITION."
        test_recipe:
          setup: ["REGULAR season roster_min=5, window CLOSED, one team with only 1 STANDARD contract"]
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "S", salary_cap_cents: 50000000, roster_min: 5 }
              as: LeagueCommissioner
              captures: { sid: $.data.id }
            - call: "POST /seasons/${sid}/start-regular"
              as: LeagueCommissioner
            - call: "POST /teams"
              payload: { season_id: "${sid}", name: "T", market_size_weight: 1 }
              as: LeagueCommissioner
              captures: { tid: $.data.id }
            - call: "POST /players"
              payload: { season_id: "${sid}", handle: "p" }
              as: LeagueCommissioner
              captures: { pid: $.data.id }
            - call: "POST /contracts"
              payload: { team_id: "${tid}", player_id: "${pid}", base_salary_cents: 5000000, contract_type: "STANDARD", term_start: "2026-01-01T00:00:00.000Z", term_end: "2026-12-31T00:00:00.000Z" }
              as: TeamGM
              as_user_id: "${tid}"
          trigger:
            - call: "POST /seasons/${sid}/start-playoffs"
              as: LeagueCommissioner
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_PLAYOFF_PRECONDITION"
      - name: start_playoffs_assigns_seeds_by_penalty_then_payroll
        claim_type: Side Effect Execution
        grounds: [state_machines.Season.transitions.REGULAR_to_PLAYOFFS, entities.Team.fields.seed]
        distinguishing_aspect: "On start-playoffs, seeds are assigned rank by penalty_points ASC then payroll_active_cents DESC then created_at ASC; the clean low-payroll team with 0 penalties gets seed 1."
        test_recipe:
          setup: ["REGULAR season roster_min=1, window CLOSED; team X (0 penalty, payroll 8M) and team Y (0 penalty, payroll 12M) each with 1 STANDARD contract"]
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "S", salary_cap_cents: 50000000, roster_min: 1 }
              as: LeagueCommissioner
              captures: { sid: $.data.id }
            - call: "POST /seasons/${sid}/start-regular"
              as: LeagueCommissioner
            - call: "POST /teams"
              payload: { season_id: "${sid}", name: "X", market_size_weight: 1 }
              as: LeagueCommissioner
              captures: { x_id: $.data.id }
            - call: "POST /teams"
              payload: { season_id: "${sid}", name: "Y", market_size_weight: 1 }
              as: LeagueCommissioner
              captures: { y_id: $.data.id }
            - call: "POST /players"
              payload: { season_id: "${sid}", handle: "px" }
              as: LeagueCommissioner
              captures: { px_id: $.data.id }
            - call: "POST /players"
              payload: { season_id: "${sid}", handle: "py" }
              as: LeagueCommissioner
              captures: { py_id: $.data.id }
            - call: "POST /contracts"
              payload: { team_id: "${x_id}", player_id: "${px_id}", base_salary_cents: 8000000, contract_type: "STANDARD", term_start: "2026-01-01T00:00:00.000Z", term_end: "2026-12-31T00:00:00.000Z" }
              as: TeamGM
              as_user_id: "${x_id}"
            - call: "POST /contracts"
              payload: { team_id: "${y_id}", player_id: "${py_id}", base_salary_cents: 12000000, contract_type: "STANDARD", term_start: "2026-01-01T00:00:00.000Z", term_end: "2026-12-31T00:00:00.000Z" }
              as: TeamGM
              as_user_id: "${y_id}"
          trigger:
            - call: "POST /seasons/${sid}/start-playoffs"
              as: LeagueCommissioner
            - call: "GET /teams/${y_id}"
              as: LeagueCommissioner
              captures: { y_seed: $.data.seed }
          assert:
            - "Team.${y_id}.seed == 1"
            - "Team.${x_id}.seed == 2"
      - name: complete_season_with_two_non_eliminated_returns_playoff_precondition
        claim_type: Precondition Enforcement
        grounds: [state_machines.Season.transitions.PLAYOFFS_to_COMPLETE, "validations[priority=12]"]
        distinguishing_aspect: "complete with two non-eliminated teams returns 409 ERR_PLAYOFF_PRECONDITION (requires exactly one champion)."
        test_recipe:
          setup: ["PLAYOFFS season with two teams both eliminated==false"]
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "S", salary_cap_cents: 50000000, roster_min: 1 }
              as: LeagueCommissioner
              captures: { sid: $.data.id }
            - call: "POST /seasons/${sid}/start-regular"
              as: LeagueCommissioner
            - call: "POST /teams"
              payload: { season_id: "${sid}", name: "X", market_size_weight: 1 }
              as: LeagueCommissioner
              captures: { x_id: $.data.id }
            - call: "POST /teams"
              payload: { season_id: "${sid}", name: "Y", market_size_weight: 1 }
              as: LeagueCommissioner
              captures: { y_id: $.data.id }
            - call: "POST /players"
              payload: { season_id: "${sid}", handle: "px" }
              as: LeagueCommissioner
              captures: { px_id: $.data.id }
            - call: "POST /players"
              payload: { season_id: "${sid}", handle: "py" }
              as: LeagueCommissioner
              captures: { py_id: $.data.id }
            - call: "POST /contracts"
              payload: { team_id: "${x_id}", player_id: "${px_id}", base_salary_cents: 8000000, contract_type: "STANDARD", term_start: "2026-01-01T00:00:00.000Z", term_end: "2026-12-31T00:00:00.000Z" }
              as: TeamGM
              as_user_id: "${x_id}"
            - call: "POST /contracts"
              payload: { team_id: "${y_id}", player_id: "${py_id}", base_salary_cents: 12000000, contract_type: "STANDARD", term_start: "2026-01-01T00:00:00.000Z", term_end: "2026-12-31T00:00:00.000Z" }
              as: TeamGM
              as_user_id: "${y_id}"
            - call: "POST /seasons/${sid}/start-playoffs"
              as: LeagueCommissioner
          trigger:
            - call: "POST /seasons/${sid}/complete"
              as: LeagueCommissioner
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_PLAYOFF_PRECONDITION"
      - name: terminal_complete_season_cannot_start_playoffs_again
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Season.terminal_states, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A COMPLETE season rejects start-playoffs with 409 ERR_INVALID_STATE (terminal state has no outgoing transitions)."
        test_recipe:
          setup: ["season X driven to COMPLETE with a single team eliminating the other"]
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "S", salary_cap_cents: 50000000, roster_min: 1 }
              as: LeagueCommissioner
              captures: { sid: $.data.id }
            - call: "POST /seasons/${sid}/start-regular"
              as: LeagueCommissioner
            - call: "POST /teams"
              payload: { season_id: "${sid}", name: "X", market_size_weight: 1 }
              as: LeagueCommissioner
              captures: { x_id: $.data.id }
            - call: "POST /teams"
              payload: { season_id: "${sid}", name: "Y", market_size_weight: 1 }
              as: LeagueCommissioner
              captures: { y_id: $.data.id }
            - call: "POST /players"
              payload: { season_id: "${sid}", handle: "px" }
              as: LeagueCommissioner
              captures: { px_id: $.data.id }
            - call: "POST /players"
              payload: { season_id: "${sid}", handle: "py" }
              as: LeagueCommissioner
              captures: { py_id: $.data.id }
            - call: "POST /contracts"
              payload: { team_id: "${x_id}", player_id: "${px_id}", base_salary_cents: 8000000, contract_type: "STANDARD", term_start: "2026-01-01T00:00:00.000Z", term_end: "2026-12-31T00:00:00.000Z" }
              as: TeamGM
              as_user_id: "${x_id}"
            - call: "POST /contracts"
              payload: { team_id: "${y_id}", player_id: "${py_id}", base_salary_cents: 12000000, contract_type: "STANDARD", term_start: "2026-01-01T00:00:00.000Z", term_end: "2026-12-31T00:00:00.000Z" }
              as: TeamGM
              as_user_id: "${y_id}"
            - call: "POST /seasons/${sid}/start-playoffs"
              as: LeagueCommissioner
            - call: "POST /teams/${y_id}/eliminate"
              as: LeagueCommissioner
            - call: "POST /seasons/${sid}/complete"
              as: LeagueCommissioner
          trigger:
            - call: "POST /seasons/${sid}/start-playoffs"
              as: LeagueCommissioner
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
      - name: two_way_promote_counts_toward_cap_after_promotion
        claim_type: Side Effect Execution
        grounds: [state_machines.Contract.transitions.ACTIVE_to_ACTIVE, entities.Contract.fields.two_way_promoted]
        distinguishing_aspect: "Promoting a TWO_WAY contract sets two_way_promoted=true and adds its base_salary to payroll_active_cents (3M -> after promote includes the 4M two-way -> 7M)."
        test_recipe:
          setup: ["team T with STANDARD 3M and unpromoted TWO_WAY 4M"]
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "S", salary_cap_cents: 50000000 }
              as: LeagueCommissioner
              captures: { sid: $.data.id }
            - call: "POST /teams"
              payload: { season_id: "${sid}", name: "T", market_size_weight: 1 }
              as: LeagueCommissioner
              captures: { tid: $.data.id }
            - call: "POST /players"
              payload: { season_id: "${sid}", handle: "ps" }
              as: LeagueCommissioner
              captures: { ps_id: $.data.id }
            - call: "POST /players"
              payload: { season_id: "${sid}", handle: "pt" }
              as: LeagueCommissioner
              captures: { pt_id: $.data.id }
            - call: "POST /contracts"
              payload: { team_id: "${tid}", player_id: "${ps_id}", base_salary_cents: 3000000, contract_type: "STANDARD", term_start: "2026-01-01T00:00:00.000Z", term_end: "2026-12-31T00:00:00.000Z" }
              as: TeamGM
              as_user_id: "${tid}"
            - call: "POST /contracts"
              payload: { team_id: "${tid}", player_id: "${pt_id}", base_salary_cents: 4000000, contract_type: "TWO_WAY", term_start: "2026-01-01T00:00:00.000Z", term_end: "2026-12-31T00:00:00.000Z" }
              as: TeamGM
              as_user_id: "${tid}"
              captures: { tw_id: $.data.id }
            - call: "GET /teams/${tid}"
              as: LeagueCommissioner
              captures: { t_v: $.data.version }
          trigger:
            - call: "POST /contracts/${tw_id}/promote"
              payload: { expected_team_version: "${t_v}" }
              as: TeamGM
              as_user_id: "${tid}"
            - call: "GET /teams/${tid}/payroll"
              as: LeagueCommissioner
              captures: { payroll: $.data.payroll_active_cents }
          assert:
            - "Contract.${tw_id}.two_way_promoted == true"
            - "Team.${tid}.payroll_active_cents == 7000000"

  # =================================================================
  - section: calculations
    instances:
      - name: luxury_tax_zero_at_exactly_cap
        claim_type: Constants Applied
        grounds: [calculations.luxury_tax]
        distinguishing_aspect: "payroll_active_cents exactly == salary_cap_cents (50000000) yields luxury_tax_cents == 0 (overage 0)."
        test_recipe:
          setup: ["team T with one STANDARD contract base_salary_cents=50000000, cap=50000000"]
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "S", salary_cap_cents: 50000000 }
              as: LeagueCommissioner
              captures: { sid: $.data.id }
            - call: "POST /teams"
              payload: { season_id: "${sid}", name: "T", market_size_weight: 1 }
              as: LeagueCommissioner
              captures: { tid: $.data.id }
            - call: "POST /players"
              payload: { season_id: "${sid}", handle: "p" }
              as: LeagueCommissioner
              captures: { pid: $.data.id }
            - call: "POST /contracts"
              payload: { team_id: "${tid}", player_id: "${pid}", base_salary_cents: 50000000, contract_type: "STANDARD", term_start: "2026-01-01T00:00:00.000Z", term_end: "2026-12-31T00:00:00.000Z" }
              as: TeamGM
              as_user_id: "${tid}"
          trigger:
            - call: "GET /teams/${tid}/payroll"
              as: TeamGM
              as_user_id: "${tid}"
          assert:
            - "response.data.payroll_active_cents == 50000000"
            - "response.data.luxury_tax_cents == 0"
      - name: luxury_tax_top_tier_three_marginal_split
        claim_type: Correct Result
        grounds: [calculations.luxury_tax, entities.Season.fields.salary_cap_cents]
        distinguishing_aspect: "payroll 64000000 over cap 50000000 -> overage 14000000 = 5M@1.5 + 5M@2.0 + 4M@2.5 = 27500000."
        test_recipe:
          setup: ["team T with two STANDARD contracts summing 64000000 (32M + 32M)"]
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "S", salary_cap_cents: 50000000 }
              as: LeagueCommissioner
              captures: { sid: $.data.id }
            - call: "POST /teams"
              payload: { season_id: "${sid}", name: "T", market_size_weight: 1 }
              as: LeagueCommissioner
              captures: { tid: $.data.id }
            - call: "POST /players"
              payload: { season_id: "${sid}", handle: "p1" }
              as: LeagueCommissioner
