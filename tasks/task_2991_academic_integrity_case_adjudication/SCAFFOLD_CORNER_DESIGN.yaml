            - call: "POST /integrity/hearing-sessions/${session_id}/adjourn"
              payload: { adjourn_reason: "Trying to adjourn a hearing that never opened." }
              as: PanelChair
              as_user_id: "${chair_id}"
              captures: { err_adjourn_before_convene: $.data.error_id }
            - call: "POST /integrity/cases/${case_id}/notation/post"
