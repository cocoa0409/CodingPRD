              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /means-tests"
              payload: { case_id: "${case_id}", cmi_monthly_cents: 400000, monthly_expenses_cents: 0, median_annual_income_cents: 6000000 }
              as: Debtor
              as_user_id: "${dbtr_id}"
              captures: { mt_id: $.data.id }
          assert:
            - "MeansTest.${mt_id}.annualized_cmi_cents == 4800000"
