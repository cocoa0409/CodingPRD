            - call: "POST /licensing/organizations"
              payload: { legal_name: "O1", org_kind: "COMMUNITY", home_territory_code: "US-CA" }
              as: RightsAdmin
              captures: { org1: $.data.id }
            - call: "POST /licensing/organizations"
              payload: { legal_name: "O2", org_kind: "COMMUNITY", home_territory_code: "US-CA" }
              as: RightsAdmin
              captures: { org2: $.data.id }
            - call: "POST /licensing/applications"
              payload: { title_id: "${title_id}", organization_id: "${org1}", requested_territory_code: "US-CA", requested_classification: "AMATEUR", venue_seating_capacity: 100, ticket_top_price_cents: 1000, performers_compensated: false, admission_charged: true, projected_gross_cents: 100000, performance_count: 1, first_performance_date: "2026-06-01T19:00:00Z", last_performance_date: "2026-06-01T19:00:00Z" }
              as: Applicant
              as_user_id: "${org1}"
              captures: { app_id: $.data.id }
