      - name: corner_entity_version_increments_on_every_mutation
        claim_type: optimistic_concurrency
        grounds:
          - entities.Parcel
          - endpoints[POST /parcels/{id}/fee-payments]
        distinguishing_aspect: "Parcel.version starts at 1 on creation and advances by exactly one per mutating request: two successive fee payments take it to 2 then 3, and updated_at is refreshed each time while created_at is not."
        test_recipe:
          setup:
            - "One parcel created by u-app-9."
          setup_api_calls:
            - call: "POST /parcels"
              payload: { apn: "0856-L3", county_code: "OR", site_address: "78 Increment Isle", lot_size_sqft: 40000, water_source: "PUBLIC_WATER" }
              as: Applicant
              as_user_id: "u-app-9"
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /parcels/${p_id}/fee-payments"
              payload: { amount_cents: 1000 }
              as: Applicant
              as_user_id: "u-app-9"
              captures: { v2: $.data.version }
            - call: "POST /parcels/${p_id}/fee-payments"
              payload: { amount_cents: 2000 }
              as: Applicant
              as_user_id: "u-app-9"
              captures: { v3: $.data.version }
          assert:
            - "${v2} == 2 and ${v3} == 3"
            - "Parcel.${p_id}.fees_paid_cents == 3000 and fee_balance_cents == -3000"
            - "Parcel.${p_id}.created_at is unchanged across both calls while updated_at advances"

  - section: consistency_model
    instances:
      - name: corner_cascade_results_are_visible_in_the_same_request_that_caused_them
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.Well.CLEAR_to_CONDEMNED
        distinguishing_aspect: "The consistency model is immediate: the 201 response to POST /wells/{id}/water-samples already carries result UNSAFE, and an immediately following read of the well and the parcel shows advisory_status CONDEMNED, water_quality_flag true and risk_tier ELEVATED with no settling delay."
        test_recipe:
          setup:
            - "A parcel with one DOMESTIC well, never sampled."
          setup_api_calls:
            - call: "POST /parcels"
              payload: { apn: "0856-M1", county_code: "OR", site_address: "79 Immediate Way", lot_size_sqft: 40000, water_source: "PRIVATE_WELL" }
              as: Applicant
              as_user_id: "u-app-9"
              captures: { p_id: $.data.id }
            - call: "POST /wells"
              payload: { parcel_id: "${p_id}", well_type: "DOMESTIC", location_x_ft: 0, location_y_ft: 0, depth_ft: 110 }
              as: Applicant
              as_user_id: "u-app-9"
              captures: { w_id: $.data.id }
          trigger:
            - call: "POST /wells/${w_id}/water-samples"
              payload: { collected_at: "2026-05-01T06:00:00Z", nitrate_mg_l: 11.0, coliform_present: true }
              as: EnvironmentalHealthSpecialist
              as_user_id: "u-ehs-field"
              captures: { ws_id: $.data.id, res: $.data.result }
            - call: "GET /wells/${w_id}"
              payload: {}
              as: RecordsClerk
              as_user_id: "u-rc-1"
            - call: "GET /parcels/${p_id}"
              payload: {}
              as: RecordsClerk
              as_user_id: "u-rc-1"
          assert:
            - "${res} == UNSAFE in the creation response itself"
            - "WaterSample.${ws_id}.exceedance_reasons == [COLIFORM_DETECTED, NITRATE_MCL_EXCEEDED]"
            - "Well.${w_id}.advisory_status == CONDEMNED on the immediately following read"
            - "Parcel.${p_id}.water_quality_flag == true and transfer_hold == true and risk_tier == ELEVATED"
