  - rule_id: non_linear_state_machine
    instances:
      - name: milestone_cure_cycle_returns_to_under_review_and_prices_the_cure_penalty
        grounds:
          - state_machines.Milestone.UNDER_REVIEW_to_CURE_PENDING
          - state_machines.Milestone.CURE_PENDING_to_UNDER_REVIEW
          - state_machines.Milestone.UNDER_REVIEW_to_ACCEPTED
          - state_machines.MilestoneBuild.PASSED_to_SUPERSEDED
          - calculations.cure_window
          - calculations.payment_disbursement.constants.CURE_PENALTY_BPS
        distinguishing_aspect: |
          The milestone re-enters a state it already left (UNDER_REVIEW -> CURE_PENDING ->
          UNDER_REVIEW -> ACCEPTED) and the loop leaves a permanent, priced trace: cure_count 1
          survives the cycle and adds 250 bps to the holdback, so the authorized payment is
          255000 / 3145000 instead of the 170000 / 3230000 a linear (no-cure) path would produce.
          A linear state model either rejects the second build or forgets cure_count.
        test_recipe:
          setup:
            - "Agreement Emberfall: advance_total_cents 3400000, one ALPHA milestone funded 3400000, contractor_budget_cents 0, three acceptance criteria, ACTIVE."
            - "Build 1 (75.00 / 96.00 / 60.00 / 5) clears the plain ALPHA gate and receives a CONDITIONAL review on condition index 1 with cure_days 14."
            - "No contractor engagements exist, so contractor_overrun_cents is 0 and only the cure penalty moves the holdback rate."
            - "Logical clock stays at 2026-08-01T00:00:00Z; the cure deadline is 2026-08-15T00:00:00.000Z."
