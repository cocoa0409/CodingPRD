  # ===========================================================================
  - section: endpoints
    instances:
      - name: product_list_pagination_envelope
        claim_type: listing
        grounds:
          - "response_envelope"
        distinguishing_aspect: "Pagination contract: limit=2 over 3 products -> has_more true then false; envelope carries meta.api_request_id and response_type array."
        test_recipe:
          setup: ["three products registered"]
          setup_api_calls:
            - { call: "POST /ops/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: TerminalAdmin }
            - { call: "POST /ops/products", payload: { code: "P1", family: "GASOLINE", viscosity_class: "LOW", compatibility_group: "GAS", flash_point_c: -40 }, as: TerminalAdmin }
            - { call: "POST /ops/products", payload: { code: "P2", family: "JET", viscosity_class: "LOW", compatibility_group: "JET", flash_point_c: 38 }, as: TerminalAdmin }
            - { call: "POST /ops/products", payload: { code: "P3", family: "CRUDE", viscosity_class: "HIGH", compatibility_group: "CRUDE", flash_point_c: 20 }, as: TerminalAdmin }
          trigger:
            - call: "GET /ops/products"
              payload: { limit: 2, offset: 0 }
              as: TerminalOperator
              captures: { ep_page1: $.data }
            - call: "GET /ops/products"
              payload: { limit: 2, offset: 2 }
              as: TerminalOperator
              captures: { ep_page2: $.data }
          assert:
            - "page 1: response_type == array, data has 2 items, pagination fields report total_count == 3 and has_more == true"
            - "page 2: 1 item and has_more == false"
            - "meta.api_request_id present on both responses"
      - name: jobs_filtered_list_by_tank
        claim_type: retrieval
        grounds:
          - "endpoints"
        distinguishing_aspect: "Filtered list returns only the FK-matching jobs (FK reverse-reachability for CleaningJob.tank_id)."
        test_recipe:
          setup: ["two tanks; one job on tank A only"]
          setup_api_calls:
            - { call: "POST /ops/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: TerminalAdmin }
            - call: "POST /ops/terminals"
              payload: { name: "T1", wastewater_daily_capacity_liters: 100000 }
              as: TerminalAdmin
              captures: { ep_term: $.data.id }
            - call: "POST /ops/products"
              payload: { code: "GAS89", family: "GASOLINE", viscosity_class: "LOW", compatibility_group: "GAS", flash_point_c: -40 }
              as: TerminalAdmin
              captures: { ep_gas: $.data.id }
            - call: "POST /ops/products"
              payload: { code: "DSL10", family: "DISTILLATE", viscosity_class: "MEDIUM", compatibility_group: "DIST", flash_point_c: 55 }
              as: TerminalAdmin
              captures: { ep_dist: $.data.id }
            - call: "POST /ops/tanks"
              payload: { terminal_id: "${ep_term}", tank_number: "T-A", capacity_m3: 5000, current_product_id: "${ep_gas}" }
              as: TerminalAdmin
              captures: { ep_tank_a: $.data.id }
            - call: "POST /ops/tanks"
              payload: { terminal_id: "${ep_term}", tank_number: "T-B", capacity_m3: 3000, current_product_id: "${ep_gas}" }
              as: TerminalAdmin
              captures: { ep_tank_b: $.data.id }
            - call: "POST /ops/contractors"
              payload: { company_name: "CleanCo" }
              as: TerminalAdmin
              captures: { ep_ctr: $.data.id }
            - call: "POST /ops/cleaning-jobs"
              payload: { terminal_id: "${ep_term}", tank_id: "${ep_tank_a}", contractor_id: "${ep_ctr}", from_product_id: "${ep_gas}", to_product_id: "${ep_dist}", heel_volume_liters_sounding: 100, base_service_fee_cents: 1000 }
              as: TerminalOperator
              captures: { ep_job: $.data.id }
          trigger:
            - call: "GET /ops/cleaning-jobs"
              payload: { tank_id: "${ep_tank_a}" }
              as: TerminalOperator
              captures: { ep_list_a: $.data }
            - call: "GET /ops/cleaning-jobs"
              payload: { tank_id: "${ep_tank_b}" }
              as: TerminalOperator
              captures: { ep_list_b: $.data }
          assert:
            - "tank A filter returns exactly 1 job with id == ${ep_job}"
            - "tank B filter returns an empty array with total_count == 0"
      - name: error_envelope_shape_on_404
        claim_type: violation_to_error
        grounds:
          - "response_envelope"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "Error responses carry data.error_id and data.message inside the fixed envelope."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /ops/inspectors/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: TerminalOperator
              captures: { ep_err: $.data.error_id, ep_msg: $.data.message }
          assert:
            - "ep_err == ERR_NOT_FOUND and ep_msg is a non-empty string"
