  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: courtroom_half_open_overlap_rejected_adjacency_allowed
        grounds:
          - calculations.courtroom_overlap
          - validations[priority=14]
          - entities.Hearing.fields.courtroom_code
        distinguishing_aspect: |
          Two hearings sharing courtroom_code use half-open [start,end): an
          overlapping second hearing (10:30-11:30 vs existing 10:00-11:00, with
          a different judge to isolate the courtroom rule) is rejected
          ERR_COURTROOM_CONFLICT. No buffer.
        test_recipe:
          setup:
            - "An estate with a SCHEDULED hearing in courtroom C1 from 10:00 to 11:00 for judge-1."
          setup_api_calls:
            - call: "POST /estates"
              payload: { decedent_name: "CR", date_of_death: "2026-04-01T00:00:00Z", county_code: "LA", estate_type: "INTESTATE", gross_estate_value_cents: 300000 }
              as: Clerk
              captures: { est_id: $.data.id }
            - call: "POST /hearings"
              payload: { estate_id: "${est_id}", hearing_type: "PETITION", courtroom_code: "C1", judge_user_id: "judge-1", start_at: "2026-06-01T10:00:00Z", end_at: "2026-06-01T11:00:00Z" }
              as: Clerk
              captures: { h1_id: $.data.id }
          trigger:
            - call: "POST /hearings"
              payload: { estate_id: "${est_id}", hearing_type: "ACCOUNTING", courtroom_code: "C1", judge_user_id: "judge-9", start_at: "2026-06-01T10:30:00Z", end_at: "2026-06-01T11:30:00Z" }
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_COURTROOM_CONFLICT"
            - "HTTP status == 409"

      - name: judge_calendar_buffer_overlap_rejected
        grounds:
          - calculations.judge_calendar_overlap
          - validations[priority=15]
          - entities.Hearing.fields.judge_user_id
        distinguishing_aspect: |
          Two hearings sharing judge_user_id use closed-interval + 30-minute
          buffer: a second hearing starting only 15 minutes after the first ends
          (11:15-12:00 vs existing 10:00-11:00, gap 15 < 30, in a different
          courtroom to isolate the judge rule) is rejected
          ERR_JUDGE_CALENDAR_CONFLICT even though their raw [start,end) do not
          overlap — different interval semantics and resource key than courtroom.
        test_recipe:
          setup:
            - "An estate with a SCHEDULED hearing for judge-7 from 10:00 to 11:00 in courtroom C1."
          setup_api_calls:
            - call: "POST /estates"
              payload: { decedent_name: "JC", date_of_death: "2026-04-01T00:00:00Z", county_code: "LA", estate_type: "INTESTATE", gross_estate_value_cents: 300000 }
              as: Clerk
              captures: { est_id: $.data.id }
            - call: "POST /hearings"
              payload: { estate_id: "${est_id}", hearing_type: "PETITION", courtroom_code: "C1", judge_user_id: "judge-7", start_at: "2026-06-01T10:00:00Z", end_at: "2026-06-01T11:00:00Z" }
              as: Clerk
              captures: { h1_id: $.data.id }
          trigger:
            - call: "POST /hearings"
              payload: { estate_id: "${est_id}", hearing_type: "ACCOUNTING", courtroom_code: "C2", judge_user_id: "judge-7", start_at: "2026-06-01T11:15:00Z", end_at: "2026-06-01T12:00:00Z" }
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_JUDGE_CALENDAR_CONFLICT"
            - "HTTP status == 409"

