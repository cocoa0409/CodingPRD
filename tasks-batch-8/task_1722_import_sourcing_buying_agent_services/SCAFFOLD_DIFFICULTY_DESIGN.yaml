              captures: { i_pass: "$.data.id", i_pass_n: "$.data.sample_size" }
            - call: "POST /sourcing/purchase-orders/${p1}/inspections"
              payload: { inspector_id: "${in2_id}", inspection_type: "PSI", scheduled_date: "2026-08-10", duration_days: 1, lot_size: 500 }
              as: SourcingAgent
              as_user_id: "${a1_id}"
              captures: { i_fail: "$.data.id" }
          trigger:
            - call: "POST /sourcing/inspections/${i_pass}/record-result"
              payload: { defects_critical: 0, defects_major: 3, defects_minor: 6 }
              as: Inspector
              as_user_id: "${in1_id}"
              captures: { r_pass: "$.data.result" }
            - call: "POST /sourcing/inspections/${i_fail}/record-result"
              payload: { defects_critical: 0, defects_major: 4, defects_minor: 0 }
              as: Inspector
              as_user_id: "${in2_id}"
              captures: { r_fail: "$.data.result" }
          assert:
            - "i_pass_n == 50 (lot 500 maps to code-letter n=50)"
            - "r_pass == 'PASSED' (defects_major == Ac == 3 is inclusive-accept; minor 6 == 2*Ac is not > 6)"
            - "r_fail == 'FAILED' (defects_major == Re == 4)"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (PO->Inspection pair vs Quotation->FactoryAudit pair)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: shipment_gated_by_latest_psi_result
        grounds:
          - state_machines.Shipment (endpoint POST /sourcing/purchase-orders/{poId}/shipments preconditions)
          - entities.PurchaseOrder.fields.latest_psi_result
          - errors[ERR_NO_PASSING_PSI]
        distinguishing_aspect: |
          Entity pair (PurchaseOrder, Inspection): shipment booking on a
          PRODUCTION_COMPLETE PO whose only PSI inspection recorded FAILED is
          rejected with ERR_NO_PASSING_PSI; booking a second PSI that records
          PASSED unblocks the very same shipment request — PO's allowed
          transition depends on Inspection's state.
        test_recipe:
          setup:
            - "Buyer b1, agent a1, factory f1 grade-A, COMPLIANT (no docs needed: category FURNITURE but posture computed COMPLIANT only when docs present — use FURNITURE with FIRE_SAFETY + PRODUCT_TEST verified, long-lived)"
            - "PO p1: 10 @ 500, month 2026-09, plan FULL(100) verified (PRODUCTION_COMPLETE)"
            - "PSI i1 (inspector in1) recorded FAILED (major 4 on lot 10 -> n=50 Ac3/Re4)"
          setup_api_calls:
            - call: "POST /sourcing/buyers"
              payload: { name: "Buyer One", country_code: "US" }
              as: PlatformAdmin
              captures: { b1_id: "$.data.id" }
            - call: "POST /sourcing/agents"
              payload: { name: "Agent One", agency_name: "AgencyCo" }
              as: PlatformAdmin
              captures: { a1_id: "$.data.id" }
