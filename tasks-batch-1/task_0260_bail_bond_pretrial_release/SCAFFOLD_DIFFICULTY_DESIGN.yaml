        grounds:
          - state_machines.Bond.ACTIVE_to_EXONERATED
          - state_machines.CollateralItem.HELD_to_RELEASED
          - calculations.collateral_held
          - calculations.collateral_refund
        distinguishing_aspect: |
          Conserved quantity = COLLATERAL value. Invariant: held_before == released_refund + retained_fees, i.e.
          sum(pledged_value of items released) == sum(refund_ledger magnitude) + PROCESSING_FEE_CENTS*item_count.
          For one 500,000c item: 500,000 == 497,500 + 2,500. No collateral value vanishes.
        test_recipe:
          setup:
            - "An ACTIVE SURETY bond with one 500,000c CASH collateral item, exonerated."
          setup_api_calls:
            - call: "POST /defendants"
              payload: { full_name: "Kai Vy", date_of_birth: "1978-06-18", phone_e164: "+15550000170", risk_tier: "MEDIUM" }
              as: BondsAgent
              captures: { def_id: $.data.id }
            - call: "POST /defendants/${def_id}/bail-orders"
              payload: { case_number: "CR-9801", bail_amount_cents: 2000000, bond_type_allowed: "SURETY" }
              as: Court
              captures: { order_id: $.data.id }
            - call: "POST /defendants/${def_id}/bail-orders/${order_id}/bonds"
              payload: { bond_type: "SURETY", premium_rate_bps: 1000 }
              as: BondsAgent
              captures: { bond_id: $.data.id }
            - call: "POST /indemnitors"
              payload: { full_name: "Guar K", phone_e164: "+15550000171", credit_limit_cents: 5000000 }
              as: BondsAgent
              captures: { ind_id: $.data.id }
            - call: "POST /defendants/${def_id}/bonds/${bond_id}/indemnity-agreements"
              payload: { indemnitor_id: "${ind_id}", liability_share_cents: 2000000 }
              as: BondsAgent
            - call: "POST /defendants/${def_id}/bonds/${bond_id}/collateral"
              payload: { kind: "CASH", pledged_value_cents: 500000 }
              as: BondsAgent
            - call: "POST /defendants/${def_id}/bonds/${bond_id}/activate"
              payload: {}
              as: BondsAgent
          trigger:
            - call: "POST /defendants/${def_id}/bonds/${bond_id}/exonerate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-4"
              captures: { held_after: $.data.collateral_held_cents }
          assert:
            - "Bond.${bond_id}.collateral_held_cents == 0"
            - "GET /bonds/${bond_id}/ledger COLLATERAL_REFUND magnitude (497500) + PROCESSING_FEE_CENTS (2500) == pledged 500000"

      - name: indemnity_exposure_conservation_on_judgment
        grounds:
          - state_machines.ForfeitureProceeding.FORFEITED_to_JUDGMENT
          - calculations.indemnitor_exposure
          - entities.Indemnitor.fields.total_exposure_cents
        distinguishing_aspect: |
          A DIFFERENT conserved quantity = INDEMNITOR EXPOSURE. Invariant: when judgment CALLS the bond's BINDING
          agreement, the indemnitor's BINDING-summed total_exposure_cents drops by exactly the called share
          (1,000,000 -> 0); exposure is conserved across the BINDING->CALLED compensation, leaving no drift.
        test_recipe:
          setup:
            - "An ACTIVE SURETY bond of 1,000,000c fully indemnified by one indemnitor (exposure 1,000,000); FTA then judgment after grace."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /defendants"
              payload: { full_name: "Liv Wo", date_of_birth: "1977-07-19", phone_e164: "+15550000180", risk_tier: "MEDIUM" }
              as: BondsAgent
              captures: { def_id: $.data.id }
            - call: "POST /defendants/${def_id}/bail-orders"
              payload: { case_number: "CR-9901", bail_amount_cents: 1000000, bond_type_allowed: "SURETY" }
              as: Court
              captures: { order_id: $.data.id }
            - call: "POST /defendants/${def_id}/bail-orders/${order_id}/bonds"
              payload: { bond_type: "SURETY", premium_rate_bps: 1000 }
              as: BondsAgent
              captures: { bond_id: $.data.id }
            - call: "POST /indemnitors"
              payload: { full_name: "Guar L2", phone_e164: "+15550000181", credit_limit_cents: 5000000 }
              as: BondsAgent
              captures: { ind_id: $.data.id }
            - call: "POST /defendants/${def_id}/bonds/${bond_id}/indemnity-agreements"
              payload: { indemnitor_id: "${ind_id}", liability_share_cents: 1000000 }
              as: BondsAgent
            - call: "POST /defendants/${def_id}/bonds/${bond_id}/collateral"
              payload: { kind: "CASH", pledged_value_cents: 250000 }
              as: BondsAgent
            - call: "POST /defendants/${def_id}/bonds/${bond_id}/activate"
              payload: {}
              as: BondsAgent
            - call: "GET /indemnitors/${ind_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { exposure_bound: $.data.total_exposure_cents }
            - call: "POST /defendants/${def_id}/bonds/${bond_id}/court-dates"
              payload: { scheduled_utc: "2026-07-02T09:00:00Z", duration_minutes: 60 }
              as: Court
              captures: { cd_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T10:00:00Z" }
              as: SystemAdmin
            - call: "POST /defendants/${def_id}/court-dates/${cd_id}/record-fta"
              payload: {}
              as: Court
            - call: "GET /bonds/${bond_id}/forfeitures"
              payload: {}
              as: ComplianceOfficer
              captures: { proc_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: SystemAdmin
            - call: "GET /bonds/${bond_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { bond_v: $.data.version }
          trigger:
            - call: "POST /defendants/${def_id}/forfeitures/${proc_id}/enter-judgment"
              payload: { expected_bond_version: "${bond_v}" }
              as: ComplianceOfficer
            - call: "GET /indemnitors/${ind_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { exposure_after: $.data.total_exposure_cents }
          assert:
            - "Indemnitor.${ind_id}.total_exposure_cents == 1000000 while bond ACTIVE (BINDING agreement)"
            - "Indemnitor.${ind_id}.total_exposure_cents == 0 after judgment (agreement CALLED, removed from BINDING sum)"
