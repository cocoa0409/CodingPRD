            - "Receipt.${rcpt}.status == RECEIVED (unchanged)"

      - name: wave_release_state_beats_insufficient_inventory
        grounds:
          - validations[priority=5]
          - validations[priority=13]
          - errors[ERR_WAVE_NOT_BUILDING]
          - errors[ERR_INSUFFICIENT_INVENTORY]
        distinguishing_aspect: |
          Error-category pair state (priority 5, ERR_WAVE_NOT_BUILDING) vs
          business_fiscal (priority 13, ERR_INSUFFICIENT_INVENTORY) — a different
          pair than the bin conflict: releasing an already-RELEASED wave that ALSO
          lacks inventory returns the state error ERR_WAVE_NOT_BUILDING.
        test_recipe:
          setup:
            - "A wave already RELEASED once (order with full inventory); attempt a second release of the same wave, whose member order now lacks available inventory because it was reserved"
          setup_api_calls:
