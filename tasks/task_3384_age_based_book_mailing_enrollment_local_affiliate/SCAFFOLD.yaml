# =============================================================================
# SCAFFOLD — Age-Based Book Mailing Enrollment & Local Affiliate Funding
# (Dolly Parton's Imagination Library style)
# §1.0–§1.7 seed tables. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml;
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Age-Based Book Mailing Enrollment & Local Affiliate Funding (Dolly Parton's
  Imagination Library): local affiliate partner agreements covering a defined
  geography with fundraising responsibility for the local share of book costs,
  child registration with birth date and mailing address determining the book
  schedule from registration through the fifth birthday, monthly book selection
  by an advisory committee with age-band appropriate titles and inventory
  planning, mailing list processing with address change handling, undeliverable
  mail and duplicate prevention, graduation and unenrollment processing when a
  child ages out or moves out of an affiliate area, state and provincial
  programs that fund a share of costs across all affiliates, publisher and
  printing arrangements achieving volume pricing, affiliate reporting on
  enrollment penetration against eligible child population.

domain_name: age-based-book-mailing
api_prefix: /library

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: quota_allocation
  complexity_layers:
    - cascading_side_effects
    - derived_field_reconciliation
    - optimistic_concurrency
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (12 entities, flat topology, FK-linked)
# =============================================================================
entities:
  - name: StateProgram
    parent: null
    common_fields: true
    fields:
      - { name: state_code, type: string, source: input, description: "State/province code; unique across all StatePrograms" }
      - { name: name, type: string, source: input, description: "Program display name" }
      - { name: funding_share_bp, type: integer, source: input, description: "State share of capped per-book cost in basis points (0..10000)" }
      - { name: max_state_share_per_book_cents, type: integer, source: input, default: 300, description: "Per-book cost cap against which the state share is computed" }

  - name: Affiliate
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Affiliate display name" }
      - { name: state_program_id, type: string, source: input, description: "FK -> StateProgram.id; program this affiliate operates under" }
      - { name: postal_prefixes, type: array, source: input, description: "Covered geography: non-empty array of postal-code prefixes (2-5 uppercase alphanumeric chars each)" }
      - { name: contact_email, type: string, source: input, description: "Coordinator contact email" }
      - { name: operative, type: boolean, source: computed, description: "True iff an ACTIVE AffiliateAgreement fully covers the current logical month (effective_from <= first day of month AND effective_to >= first day of next month)" }
      - { name: enrolled_count, type: integer, source: computed, description: "Count of Children with enrollment_status IN {ACTIVE, UNDELIVERABLE_HOLD} on this affiliate" }

  - name: AffiliateAgreement
    parent: null
    common_fields: true
    fields:
      - { name: affiliate_id, type: string, source: input, description: "FK -> Affiliate.id" }
      - { name: effective_from, type: datetime, source: input, description: "Coverage window start (inclusive), ISO8601" }
      - { name: effective_to, type: datetime, source: input, description: "Coverage window end (exclusive), ISO8601; must be strictly after effective_from" }
      - { name: local_fundraising_commitment_cents, type: integer, source: input, description: "Annual local-share fundraising commitment (>= 0)" }
      - { name: status, type: enum, source: system, description: "PENDING_APPROVAL | ACTIVE | REJECTED | EXPIRED" }
      - { name: decided_by, type: string, source: system, description: "X-User-ID of deciding StateProgramOfficer; null until decided" }

  - name: PopulationStat
    parent: null
    common_fields: true
    fields:
      - { name: affiliate_id, type: string, source: input, description: "FK -> Affiliate.id" }
      - { name: effective_year, type: integer, source: input, description: "Census year this estimate applies from (2000..2100); unique per affiliate" }
      - { name: eligible_population, type: integer, source: input, description: "Estimated under-5 eligible child population (> 0)" }

  - name: Child
    parent: null
    common_fields: true
    fields:
      - { name: affiliate_id, type: string, source: input, description: "FK -> Affiliate.id; enrolling affiliate" }
      - { name: full_name, type: string, source: input, description: "Child full name" }
      - { name: family_name, type: string, source: input, description: "Family (last) name; used in duplicate detection case-insensitively" }
      - { name: birth_date, type: datetime, source: input, description: "Child birth date (ISO8601 date)" }
      - { name: mailing_address, type: object, source: input, description: "{ line1, city, region, postal_code, country }" }
      - { name: postal_prefix, type: string, source: computed, description: "First 3 characters of uppercase(postal_code)" }
      - { name: registered_month, type: string, source: computed, description: "Logical-clock month (YYYY-MM) at registration" }
      - { name: enrollment_status, type: enum, source: system, description: "ACTIVE | UNDELIVERABLE_HOLD | GRADUATED | UNENROLLED | TRANSFERRED_OUT" }
      - { name: unenroll_reason, type: enum, source: system, description: "null | MOVED_OUT_OF_AREA | UNDELIVERABLE" }
      - { name: consecutive_returns, type: integer, source: system, default: 0, description: "Consecutive undeliverable returns; reset to 0 on approved address change" }
      - { name: transfer_source_child_id, type: string, source: system, description: "FK -> Child.id; set on the auto-created enrollment when a transfer lands in a new affiliate; null otherwise" }
      - { name: expected_final_mailing_month, type: string, source: computed, description: "Birth month + 59 months (YYYY-MM); last month a book can mail" }

  - name: AddressChange
    parent: null
    common_fields: true
    fields:
      - { name: child_id, type: string, source: input, description: "FK -> Child.id; child (source affiliate) whose address changes" }
      - { name: new_address, type: object, source: input, description: "{ line1, city, region, postal_code, country }" }
      - { name: new_postal_prefix, type: string, source: computed, description: "First 3 characters of uppercase(new_address.postal_code)" }
      - { name: status, type: enum, source: system, description: "PENDING | APPLIED_IN_AREA | APPLIED_TRANSFER | APPLIED_UNENROLLED | REJECTED" }
      - { name: decided_by, type: string, source: system, description: "X-User-ID of deciding AffiliateCoordinator; null until decided" }
      - { name: resulting_child_id, type: string, source: system, description: "FK -> Child.id; newly created enrollment on APPLIED_TRANSFER; null otherwise" }

  - name: Title
    parent: null
    common_fields: true
    fields:
      - { name: title_name, type: string, source: input, description: "Book title" }
      - { name: author, type: string, source: input, description: "Author" }
      - { name: age_band, type: enum, source: input, description: "INFANT (0-11m) | TODDLER (12-23m) | TWO (24-35m) | THREE (36-47m) | FOUR (48-59m)" }
      - { name: available_from_month, type: string, source: input, description: "First mailing month (YYYY-MM, inclusive) this title may be selected for" }
      - { name: available_until_month, type: string, source: input, description: "Last mailing month (YYYY-MM, inclusive) this title may be selected for; >= available_from_month" }
      - { name: stock_on_hand, type: integer, source: computed, default: 0, description: "Sum of CONFIRMED PrintOrder quantities for selections naming this title minus manifested MailingItems naming those selections" }

  - name: AgeBandSelection
    parent: null
    common_fields: true
    fields:
      - { name: mailing_month, type: string, source: input, description: "Month (YYYY-MM) this selection serves; unique together with age_band" }
      - { name: age_band, type: enum, source: input, description: "INFANT | TODDLER | TWO | THREE | FOUR" }
      - { name: title_id, type: string, source: input, description: "FK -> Title.id" }
      - { name: status, type: enum, source: system, description: "PROPOSED | APPROVED | LOCKED" }
      - { name: proposed_by, type: string, source: system, description: "X-User-ID of proposing AdvisoryCommitteeMember" }
      - { name: approved_by, type: string, source: system, description: "X-User-ID of approving AdvisoryCommitteeMember (must differ from proposed_by); null until approved" }

  - name: PrintOrder
    parent: null
    common_fields: true
    fields:
      - { name: selection_id, type: string, source: input, description: "FK -> AgeBandSelection.id; at most one CONFIRMED order per selection" }
      - { name: quantity, type: integer, source: input, description: "Units to print (> 0)" }
      - { name: is_reprint, type: boolean, source: input, default: false, description: "True when reprinting a title previously printed for an earlier month" }
      - { name: production_month, type: string, source: computed, description: "Selection mailing_month minus one calendar month (YYYY-MM)" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | CONFIRMED" }
      - { name: unit_cents, type: integer, source: system, description: "Effective per-unit price locked at confirm; null until CONFIRMED" }
      - { name: plate_fee_cents, type: integer, source: system, description: "Plate fee charged (or 0 when waived); null until CONFIRMED" }
      - { name: total_cents, type: integer, source: system, description: "quantity * unit_cents + plate_fee_cents; null until CONFIRMED" }

  - name: MailingWave
    parent: null
    common_fields: true
    fields:
      - { name: mailing_month, type: string, source: input, description: "Month (YYYY-MM) this wave mails; unique; must be >= current logical month" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | MANIFESTED | RECONCILED" }
      - { name: manifested_item_count, type: integer, source: system, default: 0, description: "MailingItems created at manifest" }
      - { name: returned_item_count, type: integer, source: system, default: 0, description: "MailingItems in RETURNED_UNDELIVERABLE" }

  - name: MailingItem
    parent: null
    common_fields: true
    fields:
      - { name: wave_id, type: string, source: system, description: "FK -> MailingWave.id" }
      - { name: mailing_month, type: string, source: system, description: "Denormalized from wave (YYYY-MM); unique together with child_id (duplicate prevention)" }
      - { name: child_id, type: string, source: system, description: "FK -> Child.id" }
      - { name: affiliate_id, type: string, source: system, description: "FK -> Affiliate.id; denormalized from child at manifest for invoice grouping" }
      - { name: selection_id, type: string, source: system, description: "FK -> AgeBandSelection.id; the (mailing_month, age_band) selection used" }
      - { name: age_band, type: enum, source: system, description: "Band computed from child birth_date vs mailing_month" }
      - { name: status, type: enum, source: system, description: "MAILED | DELIVERED | RETURNED_UNDELIVERABLE" }
      - { name: billable, type: boolean, source: computed, description: "status IN {MAILED, DELIVERED}" }

  - name: AffiliateInvoice
    parent: null
    common_fields: true
    fields:
      - { name: affiliate_id, type: string, source: system, description: "FK -> Affiliate.id" }
      - { name: wave_id, type: string, source: system, description: "FK -> MailingWave.id; unique together with affiliate_id" }
      - { name: billing_month, type: string, source: system, description: "Denormalized wave mailing_month (YYYY-MM)" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | DISPUTED | ADJUSTED | PAID" }
      - { name: item_count, type: integer, source: system, description: "Billable MailingItems on this invoice" }
      - { name: gross_cents, type: integer, source: system, description: "Sum of per-item book cost (effective unit + handling)" }
      - { name: state_share_cents, type: integer, source: system, description: "PER_LINE variant: sum of per-line rounded state shares" }
      - { name: local_share_cents, type: integer, source: system, description: "gross_cents - state_share_cents (before credit memo)" }
      - { name: credit_memo_cents, type: integer, source: system, default: 0, description: "Credit granted on RESOLVE_UPHELD; subtracted from local share" }
      - { name: pricing_variant, type: string, source: system, default: "PER_LINE", description: "Cost-share rounding variant pinned for issued invoices" }

# =============================================================================
# §1.2 State Machine Table (8 machines; Child cyclic, AgeBandSelection
# rework-cyclic, AddressChange branching fork, AffiliateInvoice dispute cycle)
# =============================================================================
state_machines:
  - entity: AffiliateAgreement
    initial_state: PENDING_APPROVAL
    terminal_states: [REJECTED, EXPIRED]
    transitions:
      - from: PENDING_APPROVAL
        to: ACTIVE
        trigger: "POST /library/agreements/{id}/approve"
        actor: StateProgramOfficer
        preconditions:
          - "Agreement status == PENDING_APPROVAL (else ERR_INVALID_STATE)"
          - "Officer's StateProgram == affiliate's state_program_id (else ERR_FORBIDDEN)"
          - "No other PENDING_APPROVAL or ACTIVE agreement whose postal-prefix set intersects this affiliate's postal_prefixes has a half-open window overlapping [effective_from, effective_to); adjacency (a.effective_to == b.effective_from) is NOT overlap (else ERR_AGREEMENT_GEOGRAPHY_OVERLAP)"
          - "Same affiliate has no other ACTIVE agreement (covered by the overlap rule on identical prefix sets)"
        side_effects:
          - "status -> ACTIVE, decided_by := officer X-User-ID"
          - "Affiliate.operative recomputed (true once current logical month is fully covered)"
      - from: PENDING_APPROVAL
        to: REJECTED
        trigger: "POST /library/agreements/{id}/reject"
        actor: StateProgramOfficer
        preconditions:
          - "Agreement status == PENDING_APPROVAL (else ERR_INVALID_STATE)"
          - "Officer's StateProgram == affiliate's state_program_id (else ERR_FORBIDDEN)"
        side_effects:
          - "status -> REJECTED, decided_by := officer X-User-ID; terminal, no resubmission (create a new agreement instead)"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system sweep inside POST /library/_clock/set_current_utc when logical date >= effective_to"
        actor: system
        preconditions: []
        side_effects:
          - "status -> EXPIRED; Affiliate.operative recomputed (may drop to false)"

  - entity: Child
    initial_state: ACTIVE
    terminal_states: [GRADUATED, UNENROLLED, TRANSFERRED_OUT]
    transitions:
      - from: ACTIVE
        to: UNDELIVERABLE_HOLD
        trigger: "system (side effect of POST /library/items/{id}/mark-returned when consecutive_returns becomes 1)"
        actor: system
        preconditions: []
        side_effects:
          - "consecutive_returns := 1; enrollment_status -> UNDELIVERABLE_HOLD"
          - "UNDELIVERABLE_HOLD children REMAIN manifest-eligible (books keep mailing until auto-unenroll threshold)"
      - from: UNDELIVERABLE_HOLD
        to: ACTIVE
        trigger: "system (side effect of POST /library/address-changes/{id}/decide with outcome=APPROVE on any branch)"
        actor: system
        preconditions: []
        side_effects:
          - "enrollment_status -> ACTIVE; consecutive_returns := 0"
      - from: ACTIVE
        to: UNENROLLED
        trigger: "system (side effect of mark-returned when consecutive_returns reaches RETURN_AUTO_UNENROLL_THRESHOLD=2)"
        actor: system
        preconditions: []
        side_effects:
          - "enrollment_status -> UNENROLLED; unenroll_reason := UNDELIVERABLE"
          - "Affiliate.enrolled_count recomputed (-1); penetration fields derivable from new count"
      - from: UNDELIVERABLE_HOLD
        to: UNENROLLED
        trigger: "system (same threshold rule: the return that raises consecutive_returns to 2 fires hold-then-unenroll atomically, net state UNENROLLED)"
        actor: system
        preconditions: []
        side_effects:
          - "enrollment_status -> UNENROLLED; unenroll_reason := UNDELIVERABLE; Affiliate.enrolled_count recomputed"
      - from: ACTIVE
        to: GRADUATED
        trigger: "system sweep inside POST /library/_clock/set_current_utc when current logical month > expected_final_mailing_month"
        actor: system
        preconditions: []
        side_effects:
          - "enrollment_status -> GRADUATED; Affiliate.enrolled_count recomputed"
      - from: UNDELIVERABLE_HOLD
        to: GRADUATED
        trigger: "system sweep (same rule; hold does not defer graduation)"
        actor: system
        preconditions: []
        side_effects:
          - "enrollment_status -> GRADUATED; Affiliate.enrolled_count recomputed"
      - from: ACTIVE
        to: TRANSFERRED_OUT
        trigger: "system (side effect of address-change decide APPROVE when new prefix is covered by a DIFFERENT operative affiliate)"
        actor: system
        preconditions: []
        side_effects:
          - "enrollment_status -> TRANSFERRED_OUT"
          - "New Child row auto-created on target affiliate: same full_name/family_name/birth_date, new mailing_address, registered_month := current logical month, transfer_source_child_id := source child id, enrollment_status ACTIVE, consecutive_returns 0"
          - "Source affiliate enrolled_count -1; target affiliate enrolled_count +1 (global enrollment conserved)"
      - from: UNDELIVERABLE_HOLD
        to: TRANSFERRED_OUT
        trigger: "system (same transfer branch; hold does not block a move)"
        actor: system
        preconditions: []
        side_effects:
          - "Same as ACTIVE -> TRANSFERRED_OUT"
      - from: ACTIVE
        to: UNENROLLED
        trigger: "system (side effect of address-change decide APPROVE when new prefix is covered by NO operative affiliate)"
        actor: system
        preconditions: []
        side_effects:
          - "enrollment_status -> UNENROLLED; unenroll_reason := MOVED_OUT_OF_AREA; Affiliate.enrolled_count recomputed"
      - from: UNDELIVERABLE_HOLD
        to: UNENROLLED
        trigger: "system (same moved-out branch)"
        actor: system
        preconditions: []
        side_effects:
          - "Same as ACTIVE -> UNENROLLED (moved-out)"

  - entity: AddressChange
    initial_state: PENDING
    terminal_states: [APPLIED_IN_AREA, APPLIED_TRANSFER, APPLIED_UNENROLLED, REJECTED]
    transitions:
      - from: PENDING
        to: APPLIED_IN_AREA
        trigger: "POST /library/address-changes/{id}/decide {outcome: APPROVE} when new_postal_prefix is in the child's current affiliate postal_prefixes"
        actor: AffiliateCoordinator
        preconditions:
          - "AddressChange status == PENDING (else ERR_INVALID_STATE)"
          - "Child enrollment_status IN {ACTIVE, UNDELIVERABLE_HOLD} (else ERR_INVALID_STATE)"
          - "Coordinator owns the child's affiliate (else ERR_FORBIDDEN)"
        side_effects:
          - "Child.mailing_address := new_address; postal_prefix recomputed"
          - "Child enrollment_status -> ACTIVE and consecutive_returns := 0 (address revalidated)"
      - from: PENDING
        to: APPLIED_TRANSFER
        trigger: "POST /library/address-changes/{id}/decide {outcome: APPROVE} when new_postal_prefix is covered by exactly the operative-agreement selector result on a DIFFERENT affiliate"
        actor: AffiliateCoordinator
        preconditions:
          - "AddressChange status == PENDING; child non-terminal; coordinator owns source affiliate"
        side_effects:
          - "Source child -> TRANSFERRED_OUT (see Child machine); new Child created on target affiliate; resulting_child_id set"
          - "Target affiliate selector: affiliates (excluding none) whose postal_prefixes contain new_postal_prefix AND that are operative in the current logical month; rank by earliest covering agreement effective_from, tie-break agreement created_at ASC; empty set -> APPLIED_UNENROLLED branch instead"
      - from: PENDING
        to: APPLIED_UNENROLLED
        trigger: "POST /library/address-changes/{id}/decide {outcome: APPROVE} when no operative affiliate covers new_postal_prefix"
        actor: AffiliateCoordinator
        preconditions:
          - "AddressChange status == PENDING; child non-terminal; coordinator owns source affiliate"
        side_effects:
          - "Child -> UNENROLLED with unenroll_reason MOVED_OUT_OF_AREA; resulting_child_id stays null"
      - from: PENDING
        to: REJECTED
        trigger: "POST /library/address-changes/{id}/decide {outcome: REJECT}"
        actor: AffiliateCoordinator
        preconditions:
          - "AddressChange status == PENDING (else ERR_INVALID_STATE)"
          - "Coordinator owns the child's affiliate (else ERR_FORBIDDEN)"
        side_effects:
          - "No change to Child (status, address, consecutive_returns all unchanged)"

  - entity: AgeBandSelection
    initial_state: PROPOSED
    terminal_states: [LOCKED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /library/selections/{id}/approve"
        actor: AdvisoryCommitteeMember
        preconditions:
          - "Selection status == PROPOSED (else ERR_INVALID_STATE)"
          - "Approver X-User-ID != proposed_by (segregation of duties, else ERR_SELF_APPROVAL_FORBIDDEN)"
        side_effects:
          - "status -> APPROVED; approved_by := approver X-User-ID"
      - from: APPROVED
        to: PROPOSED
        trigger: "POST /library/selections/{id}/reopen"
        actor: AdvisoryCommitteeMember
        preconditions:
          - "Selection status == APPROVED (else ERR_INVALID_STATE)"
          - "No CONFIRMED PrintOrder references this selection (structurally guaranteed: confirm locks the selection; kept as defensive check)"
        side_effects:
          - "status -> PROPOSED; approved_by := null"
      - from: APPROVED
        to: LOCKED
        trigger: "system (side effect of POST /library/print-orders/{id}/confirm on an order referencing this selection)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> LOCKED; selection can no longer be reopened; further print orders rejected with ERR_SELECTION_ALREADY_SUPPLIED"

  - entity: PrintOrder
    initial_state: SUBMITTED
    terminal_states: [CONFIRMED]
    transitions:
      - from: SUBMITTED
        to: CONFIRMED
        trigger: "POST /library/print-orders/{id}/confirm"
        actor: PublisherOps
        preconditions:
          - "PrintOrder status == SUBMITTED (else ERR_INVALID_STATE)"
          - "Referenced selection status == APPROVED (else ERR_INVALID_STATE)"
          - "No other CONFIRMED PrintOrder for the same selection (else ERR_SELECTION_ALREADY_SUPPLIED)"
          - "Press capacity: sum of quantity over CONFIRMED orders with the same production_month, plus this quantity, must be <= PRESS_MONTHLY_CAPACITY (400000) (else ERR_PRESS_CAPACITY_EXCEEDED; equality allowed)"
        side_effects:
          - "Pricing locked per calculation print_volume_pricing: unit_cents, plate_fee_cents, total_cents set"
          - "Selection -> LOCKED"
          - "Title.stock_on_hand += quantity"

  - entity: MailingWave
    initial_state: SCHEDULED
    terminal_states: [RECONCILED]
    transitions:
      - from: SCHEDULED
        to: MANIFESTED
        trigger: "POST /library/waves/{id}/manifest"
        actor: MailOps
        preconditions:
          - "Wave status == SCHEDULED (else ERR_INVALID_STATE)"
          - "All five age bands have a LOCKED AgeBandSelection for wave.mailing_month (else ERR_MANIFEST_SELECTIONS_INCOMPLETE)"
          - "For every band, Title.stock_on_hand of the band's selected title >= band demand (else ERR_INVENTORY_SHORTFALL)"
        side_effects:
          - "For each eligible child (see calculation manifest_eligibility_set) create one MailingItem: status MAILED, band from age_band_assignment, selection = LOCKED selection for (month, band)"
          - "Each selected Title.stock_on_hand -= manifested count for its band"
          - "wave.manifested_item_count := total items created; status -> MANIFESTED"
      - from: MANIFESTED
        to: RECONCILED
        trigger: "POST /library/waves/{id}/reconcile"
        actor: MailOps
        preconditions:
          - "Wave status == MANIFESTED (else ERR_INVALID_STATE)"
        side_effects:
          - "Every MailingItem still MAILED auto-transitions to DELIVERED"
          - "For each affiliate with >= 1 billable item, create AffiliateInvoice in DRAFT per calculation invoice_cost_share (PER_LINE variant); affiliates with 0 billable items get NO invoice"
          - "status -> RECONCILED"

  - entity: MailingItem
    initial_state: MAILED
    terminal_states: [DELIVERED, RETURNED_UNDELIVERABLE]
    transitions:
      - from: MAILED
        to: RETURNED_UNDELIVERABLE
        trigger: "POST /library/items/{id}/mark-returned"
        actor: MailOps
        preconditions:
          - "Item status == MAILED (else ERR_INVALID_STATE)"
          - "Item's wave status == MANIFESTED (not RECONCILED) (else ERR_INVALID_STATE)"
        side_effects:
          - "wave.returned_item_count += 1"
          - "child.consecutive_returns += 1"
          - "If consecutive_returns == 1: child -> UNDELIVERABLE_HOLD"
          - "If consecutive_returns == 2 (>= RETURN_AUTO_UNENROLL_THRESHOLD): child -> UNENROLLED (reason UNDELIVERABLE) and affiliate.enrolled_count recomputed"
      - from: MAILED
        to: DELIVERED
        trigger: "system (wave reconcile: unreturned items are assumed delivered)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: AffiliateInvoice
    initial_state: DRAFT
    terminal_states: [PAID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /library/invoices/{id}/issue"
        actor: PlatformAdmin
        preconditions:
          - "Invoice status == DRAFT (else ERR_INVALID_STATE)"
        side_effects: []
      - from: ISSUED
        to: PAID
        trigger: "POST /library/invoices/{id}/pay"
        actor: AffiliateCoordinator
        preconditions:
          - "Invoice status == ISSUED (else ERR_INVALID_STATE)"
          - "Coordinator owns the invoice's affiliate (else ERR_FORBIDDEN)"
        side_effects: []
      - from: ADJUSTED
        to: PAID
        trigger: "POST /library/invoices/{id}/pay"
        actor: AffiliateCoordinator
        preconditions:
          - "Invoice status == ADJUSTED (else ERR_INVALID_STATE)"
          - "Coordinator owns the invoice's affiliate (else ERR_FORBIDDEN)"
        side_effects: []
      - from: ISSUED
        to: DISPUTED
        trigger: "POST /library/invoices/{id}/dispute {outcome: OPEN}"
        actor: AffiliateCoordinator
        preconditions:
          - "Invoice status == ISSUED (else ERR_INVALID_STATE)"
          - "Coordinator owns the invoice's affiliate (else ERR_FORBIDDEN); outcome OPEN is coordinator-only (else ERR_FORBIDDEN)"
        side_effects: []
      - from: DISPUTED
        to: ISSUED
        trigger: "POST /library/invoices/{id}/dispute {outcome: RESOLVE_OVERRULED}"
        actor: PlatformAdmin
        preconditions:
          - "Invoice status == DISPUTED (else ERR_INVALID_STATE)"
          - "RESOLVE_* outcomes are PlatformAdmin-only (else ERR_FORBIDDEN)"
        side_effects:
          - "Invoice returns to ISSUED unchanged (dispute cycle)"
      - from: DISPUTED
        to: ADJUSTED
        trigger: "POST /library/invoices/{id}/dispute {outcome: RESOLVE_UPHELD, credit_amount_cents: N}"
        actor: PlatformAdmin
        preconditions:
          - "Invoice status == DISPUTED (else ERR_INVALID_STATE)"
          - "PlatformAdmin only (else ERR_FORBIDDEN)"
          - "0 < credit_amount_cents <= gross_cents (else ERR_CREDIT_EXCEEDS_GROSS)"
        side_effects:
          - "credit_memo_cents := N; local_share_cents := gross_cents - state_share_cents - N (state share is never credited)"
          - "Invariant: gross_cents == state_share_cents + local_share_cents + credit_memo_cents"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only; everything else is state preconditions)
# =============================================================================
concurrency_rules:
  - rule_id: agreement-create-stale-affiliate
    parent_entity: Affiliate
    write_endpoint: "POST /library/affiliates/{id}/agreements"
    occ_field: "expected_affiliate_version"
    description: |
      Creating an AffiliateAgreement against an Affiliate whose version has
      advanced since the client last observed it is rejected with 412. This
      captures the case where another writer has just created an agreement
      for the same affiliate (which bumps affiliate.version) and the current
      writer's view of the affiliate is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: age_band_assignment
    trigger: "MailingWave manifest (per child) and Child registration preview"
    algorithm: threshold
    formula: |
      age_months(birth_date, mailing_month) =
        (int(mailing_month[0:4]) * 12 + int(mailing_month[5:7]))
        - (birth_date.year * 12 + birth_date.month)        # day-of-month IGNORED (month granularity)
      band:  0..11 -> INFANT; 12..23 -> TODDLER; 24..35 -> TWO; 36..47 -> THREE; 48..59 -> FOUR
      age_months >= 60 or < 0 -> no band (not eligible)
    input_set: "Child.birth_date, wave.mailing_month"
    constants:
      BAND_EDGES_MONTHS: [0, 12, 24, 36, 48, 60]
    precision: "integer months"

  - name: manifest_eligibility_set
    trigger: "POST /library/waves/{id}/manifest"
    algorithm: forward_looking
    formula: |
      A Child C is manifested for wave month M iff ALL of:
        1. C.enrollment_status IN {ACTIVE, UNDELIVERABLE_HOLD}
        2. C.registered_month < M (strictly earlier calendar month; same-month registrants wait)
        3. age_months(C.birth_date, M) <= 59 (birthday month itself is excluded: age_months == 60 mails nothing)
        4. C's affiliate is operative for month M: an ACTIVE agreement with
           effective_from <= first_day(M) AND effective_to >= first_day(M + 1 month)
        5. No MailingItem already exists with (child_id == C.id, mailing_month == M)  (duplicate prevention)
      Band demand(band B) = count of eligible children with age_band_assignment == B.
    input_set: "All Children; filtered by status, registration month, age, affiliate operability, prior items"
    constants: {}
    precision: "exact set membership"

  - name: print_volume_pricing
    trigger: "POST /library/print-orders/{id}/confirm"
    algorithm: tiered_pricing
    formula: |
      tier_unit(quantity):                       # lower bound inclusive
        quantity >= 50000 -> 140
        quantity >= 20000 -> 160
        quantity >= 5000  -> 185
        else              -> 210
      effective_unit = is_reprint ? round_half_up(tier_unit(quantity) * 0.9) : tier_unit(quantity)
      plate_fee_cents = (quantity >= 20000 OR is_reprint) ? 0 : 25000
      total_cents = quantity * effective_unit + plate_fee_cents
      unit_cents := effective_unit
    input_set: "PrintOrder {quantity, is_reprint}"
    constants:
      TIER_1_UNIT_CENTS: 210
      TIER_2_UNIT_CENTS: 185
      TIER_3_UNIT_CENTS: 160
      TIER_4_UNIT_CENTS: 140
      TIER_2_MIN_QTY: 5000
      TIER_3_MIN_QTY: 20000
      TIER_4_MIN_QTY: 50000
      PLATE_FEE_CENTS: 25000
      PLATE_FEE_WAIVER_QTY: 20000
      REPRINT_DISCOUNT_NUM: 9
      REPRINT_DISCOUNT_DEN: 10
    precision: "integer cents; reprint discount round_half_up to whole cent"

  - name: per_item_book_cost
    trigger: "MailingWave reconcile (per billable item)"
    algorithm: aggregation
    formula: |
      For the item's selection S and its single CONFIRMED PrintOrder PO:
        effective_order_unit = floor(PO.total_cents / PO.quantity)     # integer floor division
        item_cost = effective_order_unit + HANDLING_CENTS_PER_BOOK
    input_set: "MailingItems with billable == true"
    constants:
      HANDLING_CENTS_PER_BOOK: 35
    precision: "integer cents, floor division"

  - name: invoice_cost_share
    trigger: "MailingWave reconcile (per affiliate with >= 1 billable item)"
    algorithm: aggregation
    formula: |
      PER_LINE variant (canonical; pinned for issued invoices):
        for each billable item i:
          capped_i = min(item_cost_i, program.max_state_share_per_book_cents)
          state_i  = round_half_up(capped_i * program.funding_share_bp / 10000)
          local_i  = item_cost_i - state_i
        gross_cents       = sum(item_cost_i)
        state_share_cents = sum(state_i)
        local_share_cents = sum(local_i) = gross_cents - state_share_cents
      Rounding order is pinned: round EACH LINE first, then sum.
    input_set: "Billable MailingItems of one affiliate for the wave; affiliate's StateProgram"
    constants: {}
    precision: "integer cents, round_half_up per line"
    variants:
      - name: AGGREGATE
        when: "Reporting/analytics comparison only — never used on issued invoices"
        difference: "state_share = round_half_up(sum(capped_i) * share_bp / 10000); local = gross - state. Per-line remainders accumulate differently, so AGGREGATE can differ from PER_LINE by several cents on the same items."

  - name: penetration_reporting
    trigger: "GET /library/affiliates/{id}/penetration?month=M"
    algorithm: aggregation
    formula: |
      eligible_population: PopulationStat selector — the stat for this affiliate with the
        greatest effective_year <= year(M); if none, the stat with the smallest effective_year;
        if no stats exist, eligible_population = 0 and both penetration rates are null.
      SNAPSHOT variant:
        enrolled = current count of Children on this affiliate with enrollment_status
                   IN {ACTIVE, UNDELIVERABLE_HOLD} (the snapshot numerator is the live
                   count regardless of M; M selects the population stat by year(M) and
                   the trailing-12 window)
        penetration_snapshot_bp = round_half_up(enrolled * 10000 / eligible_population) if eligible > 0 else null
      Population selector tie-break: unique(affiliate, effective_year) makes ties impossible.
    input_set: "Affiliate children, PopulationStats, MailingItems"
    constants: {}
    precision: "basis points, round_half_up"
    variants:
      - name: TRAILING_12
        when: "Returned alongside SNAPSHOT on the same endpoint"
        difference: "numerator = count of DISTINCT children with >= 1 MailingItem (any status) whose mailing_month is in the 12-month window [M-11 .. M] inclusive — includes children who have since graduated, transferred, or unenrolled. penetration_trailing_12_bp = round_half_up(distinct_served * 10000 / eligible_population) if eligible > 0 else null. SNAPSHOT and TRAILING_12 diverge whenever a served child left the program within the window."

  - name: press_capacity_consumed
    trigger: "POST /library/print-orders/{id}/confirm"
    algorithm: aggregation
    formula: |
      consumed(production_month) = sum(quantity) over CONFIRMED PrintOrders
        whose production_month == production_month
      Confirm allowed iff consumed + this.quantity <= PRESS_MONTHLY_CAPACITY  (equality allowed)
    input_set: "CONFIRMED PrintOrders only (SUBMITTED do not consume capacity)"
    constants:
      PRESS_MONTHLY_CAPACITY: 400000
    precision: "integer units"

  - name: stock_on_hand_reconciliation
    trigger: "PrintOrder confirm (+quantity) and MailingWave manifest (-band demand)"
    algorithm: aggregation
    formula: |
      Title.stock_on_hand =
        sum(quantity of CONFIRMED PrintOrders whose selection's title_id == this title)
        - sum(MailingItems whose selection's title_id == this title)
      Recomputed on every confirm and every manifest; never negative (manifest checks first).
    input_set: "CONFIRMED PrintOrders; all MailingItems"
    constants: {}
    precision: "integer units"

  - name: enrolled_count_reconciliation
    trigger: "Child create, return-driven unenroll, transfer, graduation sweep, address-change branches"
    algorithm: aggregation
    formula: |
      Affiliate.enrolled_count =
        count(Children with affiliate_id == this affiliate
              AND enrollment_status IN {ACTIVE, UNDELIVERABLE_HOLD})
      TRANSFERRED_OUT / UNENROLLED / GRADUATED children never count.
    input_set: "Children of the affiliate"
    constants:
      RETURN_AUTO_UNENROLL_THRESHOLD: 2
    precision: "integer count"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lower number wins when
# a request violates multiple rules)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Caller role is in the endpoint's roles list"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Path-template ids exist, validated left-to-right; entity-specific 404 (ERR_AFFILIATE_NOT_FOUND, ERR_CHILD_NOT_FOUND, ERR_AGREEMENT_NOT_FOUND, ERR_TITLE_NOT_FOUND, ERR_SELECTION_NOT_FOUND, ERR_PRINT_ORDER_NOT_FOUND, ERR_WAVE_NOT_FOUND, ERR_ITEM_NOT_FOUND, ERR_INVOICE_NOT_FOUND, ERR_ADDRESS_CHANGE_NOT_FOUND, ERR_STATE_PROGRAM_NOT_FOUND)"
    error_id: ERR_*_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"

  - priority: 4
    category: existence
    check: "Request body is well-formed: required fields present, types correct, enum values in range, postal_prefixes non-empty array of 2-5 char uppercase-alphanumeric strings, month strings match YYYY-MM, and no unknown/system/computed fields supplied (client-supplied id, version, enrolled_count, etc. are rejected here)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a body"

  - priority: 5
    category: auth
    check: "Entity-backed ownership: AffiliateCoordinator's X-User-ID must equal the target affiliate id (children, address-changes, population-stats, invoices pay/dispute, penetration scoping); StateProgramOfficer's X-User-ID must equal the state_program_id of the agreement's affiliate"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "scoped write and read endpoints"

  - priority: 6
    category: state
    check: "OCC: expected_affiliate_version equals the affiliate's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /library/affiliates/{id}/agreements"

  - priority: 7
    category: state
    check: "Target resource state permits the transition (agreement PENDING_APPROVAL, selection PROPOSED/APPROVED, print order SUBMITTED + selection APPROVED, wave SCHEDULED/MANIFESTED, item MAILED + wave MANIFESTED, invoice DRAFT/ISSUED/DISPUTED/ADJUSTED, address change PENDING + child non-terminal)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 8
    category: business_constraint
    check: "Segregation of duties: selection approver X-User-ID must differ from the selection's proposed_by"
    error_id: ERR_SELF_APPROVAL_FORBIDDEN
    http_status: 403
    applies_to: "POST /library/selections/{id}/approve"

  - priority: 9
    category: business_temporal
    check: "Scalar temporal rules: birth_date strictly before current logical date and age_months(registered_month) <= 59 at registration (ERR_CHILD_AGE_INELIGIBLE covers both too-old and in-future? NO — in-future uses ERR_BIRTH_DATE_IN_FUTURE); selection mailing_month >= current logical month (ERR_SELECTION_MONTH_PAST); wave mailing_month >= current logical month (ERR_WAVE_MONTH_PAST); agreement effective_to > effective_from (ERR_AGREEMENT_WINDOW_INVALID)"
    error_id: ERR_CHILD_AGE_INELIGIBLE
    http_status: 422
    applies_to: "POST /library/children, POST /library/selections, POST /library/waves, POST /library/affiliates/{id}/agreements"

  - priority: 10
    category: business_constraint
    check: "Uniqueness/duplicate rules: no non-terminal child in the same affiliate with same (birth_date, postal_prefix, lower(family_name)) (ERR_DUPLICATE_REGISTRATION); (mailing_month, age_band) selection unique (ERR_SELECTION_EXISTS); (affiliate, effective_year) population stat unique (ERR_POPULATION_YEAR_DUPLICATE); wave mailing_month unique (ERR_WAVE_MONTH_DUPLICATE); at most one CONFIRMED print order per selection (ERR_SELECTION_ALREADY_SUPPLIED)"
    error_id: ERR_DUPLICATE_REGISTRATION
    http_status: 409
    applies_to: "creation endpoints"

  - priority: 11
    category: business_referential
    check: "Body-referenced FK existence (title_id -> ERR_TITLE_NOT_FOUND; selection_id -> ERR_SELECTION_NOT_FOUND; state_program_id -> ERR_STATE_PROGRAM_NOT_FOUND; affiliate_id -> ERR_AFFILIATE_NOT_FOUND), then FK-dependent rules: registering affiliate operative in current logical month (ERR_AFFILIATE_NOT_OPERATIVE); child postal_prefix in affiliate postal_prefixes (ERR_ADDRESS_NOT_COVERED); selection month inside title availability window inclusive (ERR_TITLE_UNAVAILABLE_MONTH); agreement geography/window half-open overlap with adjacency allowed (ERR_AGREEMENT_GEOGRAPHY_OVERLAP)"
    error_id: ERR_ADDRESS_NOT_COVERED
    http_status: 422
    applies_to: "POST /library/children, POST /library/selections, POST /library/affiliates, POST /library/affiliates/{id}/agreements approve, POST /library/print-orders"

  - priority: 12
    category: business_fiscal
    check: "Capacity/inventory/fiscal gates: press monthly capacity (ERR_PRESS_CAPACITY_EXCEEDED); per-band title stock >= demand at manifest (ERR_INVENTORY_SHORTFALL); all five bands LOCKED at manifest (ERR_MANIFEST_SELECTIONS_INCOMPLETE); credit_amount_cents within (0, gross_cents] (ERR_CREDIT_EXCEEDS_GROSS)"
    error_id: ERR_PRESS_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /library/print-orders/{id}/confirm, POST /library/waves/{id}/manifest, POST /library/invoices/{id}/dispute"

# =============================================================================
# §1.5 API Endpoint Table (40 endpoints)
# =============================================================================
endpoints:
  - { method: POST, path: "/library/_clock/set_current_utc", description: "Advance the logical clock and run the due-date sweep (graduations where current month > expected_final_mailing_month; agreement expirations where current date >= effective_to). Startup default is 2026-09-01T00:00:00Z; before any call the logical clock reads exactly that and never falls back to wall-clock time.", roles: [PlatformAdmin], code: 200, input: [current_utc], output: "{ current_utc: string, graduated_child_ids: array, expired_agreement_ids: array }", side_effects: ["Child graduations", "AffiliateAgreement expirations", "Affiliate.operative recomputed"] }

  - { method: POST, path: "/library/state-programs", description: "Create a state/provincial funding program", roles: [PlatformAdmin], code: 201, input: [state_code, name, funding_share_bp, "max_state_share_per_book_cents?"], output: StateProgram, side_effects: [] }

  - { method: POST, path: "/library/affiliates", description: "Create a local affiliate (starts non-operative until an agreement is ACTIVE and covering)", roles: [PlatformAdmin], code: 201, input: [name, state_program_id, postal_prefixes, contact_email], output: Affiliate, side_effects: ["enrolled_count := 0"] }
  - { method: GET, path: "/library/affiliates/{id}", description: "Get an affiliate with computed enrolled_count and operative flag", roles: [PlatformAdmin, StateProgramOfficer, AffiliateCoordinator, AdvisoryCommitteeMember, PublisherOps, MailOps], code: 200, input: [], output: Affiliate, side_effects: [] }
  - { method: GET, path: "/library/affiliates", description: "List affiliates with filters + pagination", roles: [PlatformAdmin, StateProgramOfficer, AffiliateCoordinator, AdvisoryCommitteeMember, PublisherOps, MailOps], code: 200, input: ["state_program_id?", "name?", "limit?", "offset?"], output: "Affiliate[]", side_effects: [] }
  - { method: GET, path: "/library/affiliates/{id}/penetration", description: "Penetration report for a month (default current logical month): SNAPSHOT and TRAILING_12 variants per calculation penetration_reporting", roles: [PlatformAdmin, StateProgramOfficer, AffiliateCoordinator, AdvisoryCommitteeMember, PublisherOps, MailOps], code: 200, input: ["month?"], output: "{ affiliate_id: string, month: string, enrolled_count: integer, eligible_population: integer, population_stat_year: integer, penetration_snapshot_bp: integer, trailing_12_unique_children: integer, penetration_trailing_12_bp: integer }", side_effects: [] }

  - { method: POST, path: "/library/affiliates/{id}/agreements", description: "Create a partner agreement (PENDING_APPROVAL) with OCC on the affiliate version", roles: [AffiliateCoordinator, PlatformAdmin], code: 201, input: [effective_from, effective_to, local_fundraising_commitment_cents, expected_affiliate_version], output: AffiliateAgreement, side_effects: ["increments Affiliate.version by 1"] }
  - { method: GET, path: "/library/affiliates/{id}/agreements", description: "List agreements of an affiliate", roles: [PlatformAdmin, StateProgramOfficer, AffiliateCoordinator, AdvisoryCommitteeMember, PublisherOps, MailOps], code: 200, input: ["status?", "limit?", "offset?"], output: "AffiliateAgreement[]", side_effects: [] }
  - { method: POST, path: "/library/agreements/{id}/approve", description: "StateProgramOfficer approves a PENDING_APPROVAL agreement after overlap/window checks", roles: [StateProgramOfficer], code: 200, input: [], output: AffiliateAgreement, side_effects: ["status -> ACTIVE", "Affiliate.operative recomputed"] }
  - { method: POST, path: "/library/agreements/{id}/reject", description: "StateProgramOfficer rejects a PENDING_APPROVAL agreement (terminal)", roles: [StateProgramOfficer], code: 200, input: [], output: AffiliateAgreement, side_effects: ["status -> REJECTED"] }

  - { method: POST, path: "/library/affiliates/{id}/population-stats", description: "Record an eligible-population census estimate for a year", roles: [AffiliateCoordinator, PlatformAdmin], code: 201, input: [effective_year, eligible_population], output: PopulationStat, side_effects: [] }
  - { method: GET, path: "/library/affiliates/{id}/population-stats", description: "List population stats of an affiliate", roles: [PlatformAdmin, StateProgramOfficer, AffiliateCoordinator, AdvisoryCommitteeMember, PublisherOps, MailOps], code: 200, input: ["limit?", "offset?"], output: "PopulationStat[]", side_effects: [] }

  - { method: POST, path: "/library/children", description: "Register a child (coordinator registers into their own affiliate). Validates age (< 60 months at registration month), address coverage, operability, and duplicates", roles: [AffiliateCoordinator], code: 201, input: [affiliate_id, full_name, family_name, birth_date, mailing_address], output: Child, side_effects: ["Affiliate.enrolled_count += 1"] }
  - { method: GET, path: "/library/children/{id}", description: "Get a child", roles: [PlatformAdmin, StateProgramOfficer, AffiliateCoordinator, AdvisoryCommitteeMember, PublisherOps, MailOps], code: 200, input: [], output: Child, side_effects: [] }
  - { method: GET, path: "/library/children", description: "List children with filters + pagination (AffiliateCoordinator scoped to own affiliate)", roles: [PlatformAdmin, StateProgramOfficer, AffiliateCoordinator, AdvisoryCommitteeMember, PublisherOps, MailOps], code: 200, input: ["affiliate_id?", "enrollment_status?", "transfer_source_child_id?", "limit?", "offset?"], output: "Child[]", side_effects: [] }

  - { method: POST, path: "/library/children/{id}/address-changes", description: "Submit an address change request for a child; the child must be non-terminal (ACTIVE or UNDELIVERABLE_HOLD), else ERR_INVALID_STATE", roles: [AffiliateCoordinator], code: 201, input: [new_address], output: AddressChange, side_effects: [] }
  - { method: GET, path: "/library/children/{id}/address-changes", description: "List address changes of a child", roles: [PlatformAdmin, StateProgramOfficer, AffiliateCoordinator, AdvisoryCommitteeMember, PublisherOps, MailOps], code: 200, input: ["status?", "limit?", "offset?"], output: "AddressChange[]", side_effects: [] }
  - { method: POST, path: "/library/address-changes/{id}/decide", description: "Approve (branches IN_AREA / TRANSFER / UNENROLLED by coverage) or reject a pending address change", roles: [AffiliateCoordinator], code: 200, input: [outcome], output: AddressChange, side_effects: ["branch side effects per AddressChange/Child machines"] }

  - { method: POST, path: "/library/titles", description: "Catalog a book title with its age band and availability window (months, inclusive)", roles: [PlatformAdmin], code: 201, input: [title_name, author, age_band, available_from_month, available_until_month], output: Title, side_effects: ["stock_on_hand := 0"] }
  - { method: GET, path: "/library/titles/{id}", description: "Get a title with computed stock_on_hand", roles: [PlatformAdmin, StateProgramOfficer, AffiliateCoordinator, AdvisoryCommitteeMember, PublisherOps, MailOps], code: 200, input: [], output: Title, side_effects: [] }

  - { method: POST, path: "/library/selections", description: "Advisory committee member proposes the title for a (mailing_month, age_band)", roles: [AdvisoryCommitteeMember], code: 201, input: [mailing_month, age_band, title_id], output: AgeBandSelection, side_effects: ["proposed_by := X-User-ID"] }
  - { method: GET, path: "/library/selections/{id}", description: "Get a selection", roles: [PlatformAdmin, StateProgramOfficer, AffiliateCoordinator, AdvisoryCommitteeMember, PublisherOps, MailOps], code: 200, input: [], output: AgeBandSelection, side_effects: [] }
  - { method: GET, path: "/library/selections", description: "List selections with filters + pagination", roles: [PlatformAdmin, StateProgramOfficer, AffiliateCoordinator, AdvisoryCommitteeMember, PublisherOps, MailOps], code: 200, input: ["mailing_month?", "age_band?", "title_id?", "status?", "limit?", "offset?"], output: "AgeBandSelection[]", side_effects: [] }
  - { method: POST, path: "/library/selections/{id}/approve", description: "A DIFFERENT committee member approves a PROPOSED selection (segregation of duties)", roles: [AdvisoryCommitteeMember], code: 200, input: [], output: AgeBandSelection, side_effects: ["status -> APPROVED", "approved_by := X-User-ID"] }
  - { method: POST, path: "/library/selections/{id}/reopen", description: "Send an APPROVED selection back to PROPOSED (rework cycle; blocked once LOCKED)", roles: [AdvisoryCommitteeMember], code: 200, input: ["reason?"], output: AgeBandSelection, side_effects: ["status -> PROPOSED", "approved_by := null"] }

  - { method: POST, path: "/library/print-orders", description: "Publisher ops submits a print order for an APPROVED-or-later selection", roles: [PublisherOps], code: 201, input: [selection_id, quantity, "is_reprint?"], output: PrintOrder, side_effects: ["production_month := selection.mailing_month - 1"] }
  - { method: GET, path: "/library/print-orders/{id}", description: "Get a print order", roles: [PlatformAdmin, StateProgramOfficer, AffiliateCoordinator, AdvisoryCommitteeMember, PublisherOps, MailOps], code: 200, input: [], output: PrintOrder, side_effects: [] }
  - { method: GET, path: "/library/print-orders", description: "List print orders with filters + pagination", roles: [PlatformAdmin, StateProgramOfficer, AffiliateCoordinator, AdvisoryCommitteeMember, PublisherOps, MailOps], code: 200, input: ["selection_id?", "status?", "limit?", "offset?"], output: "PrintOrder[]", side_effects: [] }
  - { method: POST, path: "/library/print-orders/{id}/confirm", description: "Confirm a SUBMITTED order: capacity check, volume pricing locked, selection LOCKED, stock credited", roles: [PublisherOps], code: 200, input: [], output: PrintOrder, side_effects: ["print_volume_pricing", "press_capacity_consumed", "selection -> LOCKED", "Title.stock_on_hand += quantity"] }

  - { method: POST, path: "/library/waves", description: "Schedule the mailing wave for a month (unique month, not in the past)", roles: [MailOps], code: 201, input: [mailing_month], output: MailingWave, side_effects: [] }
  - { method: POST, path: "/library/waves/{id}/manifest", description: "Generate MailingItems for all eligible children (requires all five band selections LOCKED and sufficient stock)", roles: [MailOps], code: 200, input: [], output: MailingWave, side_effects: ["MailingItems created (status MAILED)", "Title.stock_on_hand debited per band", "manifested_item_count set"] }
  - { method: POST, path: "/library/waves/{id}/reconcile", description: "Close the wave: unreturned MAILED items -> DELIVERED; DRAFT AffiliateInvoices created per affiliate with billable items", roles: [MailOps], code: 200, input: [], output: MailingWave, side_effects: ["items auto-DELIVERED", "invoice_cost_share (PER_LINE) per affiliate", "status -> RECONCILED"] }

  - { method: GET, path: "/library/items/{id}", description: "Get a mailing item", roles: [PlatformAdmin, StateProgramOfficer, AffiliateCoordinator, AdvisoryCommitteeMember, PublisherOps, MailOps], code: 200, input: [], output: MailingItem, side_effects: [] }
  - { method: GET, path: "/library/items", description: "List mailing items with filters + pagination", roles: [PlatformAdmin, StateProgramOfficer, AffiliateCoordinator, AdvisoryCommitteeMember, PublisherOps, MailOps], code: 200, input: ["wave_id?", "child_id?", "selection_id?", "affiliate_id?", "status?", "limit?", "offset?"], output: "MailingItem[]", side_effects: [] }
  - { method: POST, path: "/library/items/{id}/mark-returned", description: "Record an undeliverable return; cascades child hold / auto-unenroll / affiliate recount", roles: [MailOps], code: 200, input: [], output: MailingItem, side_effects: ["wave.returned_item_count += 1", "child.consecutive_returns += 1", "child hold or auto-unenroll per threshold", "Affiliate.enrolled_count recomputed"] }

  - { method: GET, path: "/library/invoices/{id}", description: "Get an affiliate invoice", roles: [PlatformAdmin, StateProgramOfficer, AffiliateCoordinator, AdvisoryCommitteeMember, PublisherOps, MailOps], code: 200, input: [], output: AffiliateInvoice, side_effects: [] }
  - { method: GET, path: "/library/invoices", description: "List invoices with filters + pagination", roles: [PlatformAdmin, StateProgramOfficer, AffiliateCoordinator, AdvisoryCommitteeMember, PublisherOps, MailOps], code: 200, input: ["affiliate_id?", "wave_id?", "status?", "limit?", "offset?"], output: "AffiliateInvoice[]", side_effects: [] }
  - { method: POST, path: "/library/invoices/{id}/issue", description: "Issue a DRAFT invoice to the affiliate", roles: [PlatformAdmin], code: 200, input: [], output: AffiliateInvoice, side_effects: ["status -> ISSUED"] }
  - { method: POST, path: "/library/invoices/{id}/pay", description: "Affiliate pays its local share (from ISSUED or ADJUSTED)", roles: [AffiliateCoordinator], code: 200, input: [], output: AffiliateInvoice, side_effects: ["status -> PAID"] }
  - { method: POST, path: "/library/invoices/{id}/dispute", description: "OPEN (coordinator, from ISSUED) disputes the invoice; RESOLVE_UPHELD / RESOLVE_OVERRULED (PlatformAdmin, from DISPUTED) settle it with optional credit memo", roles: [AffiliateCoordinator, PlatformAdmin], code: 200, input: [outcome, "credit_amount_cents?"], output: AffiliateInvoice, side_effects: ["status transition per outcome", "credit memo applied to local share on RESOLVE_UPHELD"] }

# =============================================================================
# §1.6 Error Code Catalog (34 codes)
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not allowed on endpoint, or entity-backed ownership mismatch (coordinator/officer scope)" }
  - { id: ERR_SELF_APPROVAL_FORBIDDEN, http: 403, condition: "Selection approver X-User-ID equals the selection's proposed_by (segregation of duties)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, bad type, enum outside range, malformed month string, empty postal_prefixes" }
  - { id: ERR_STATE_PROGRAM_NOT_FOUND, http: 404, condition: "Referenced state program id does not exist" }
  - { id: ERR_AFFILIATE_NOT_FOUND, http: 404, condition: "Referenced affiliate id does not exist" }
  - { id: ERR_AGREEMENT_NOT_FOUND, http: 404, condition: "Referenced agreement id does not exist" }
  - { id: ERR_CHILD_NOT_FOUND, http: 404, condition: "Referenced child id does not exist" }
  - { id: ERR_ADDRESS_CHANGE_NOT_FOUND, http: 404, condition: "Referenced address change id does not exist" }
  - { id: ERR_TITLE_NOT_FOUND, http: 404, condition: "Referenced title id does not exist (path or body)" }
  - { id: ERR_SELECTION_NOT_FOUND, http: 404, condition: "Referenced selection id does not exist (path or body)" }
  - { id: ERR_PRINT_ORDER_NOT_FOUND, http: 404, condition: "Referenced print order id does not exist" }
  - { id: ERR_WAVE_NOT_FOUND, http: 404, condition: "Referenced mailing wave id does not exist" }
  - { id: ERR_ITEM_NOT_FOUND, http: 404, condition: "Referenced mailing item id does not exist" }
  - { id: ERR_INVOICE_NOT_FOUND, http: 404, condition: "Referenced invoice id does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource is not in a state that permits this transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_affiliate_version does not match the affiliate's current version (OCC)" }
  - { id: ERR_BIRTH_DATE_IN_FUTURE, http: 422, condition: "birth_date is on or after the current logical date" }
  - { id: ERR_CHILD_AGE_INELIGIBLE, http: 422, condition: "Child is already 60+ months old in the registration month (age_months(registered_month) >= 60)" }
  - { id: ERR_DUPLICATE_REGISTRATION, http: 409, condition: "A non-terminal child with same (affiliate_id, birth_date, postal_prefix, lower(family_name)) already exists" }
  - { id: ERR_ADDRESS_NOT_COVERED, http: 422, condition: "Child's postal_prefix is not in the registering affiliate's postal_prefixes" }
  - { id: ERR_AFFILIATE_NOT_OPERATIVE, http: 409, condition: "Registering affiliate has no ACTIVE agreement fully covering the current logical month" }
  - { id: ERR_AGREEMENT_WINDOW_INVALID, http: 422, condition: "effective_to is not strictly after effective_from" }
  - { id: ERR_AGREEMENT_GEOGRAPHY_OVERLAP, http: 409, condition: "Another PENDING_APPROVAL/ACTIVE agreement with intersecting postal prefixes has a half-open window overlapping [effective_from, effective_to); adjacency is allowed" }
  - { id: ERR_SELECTION_EXISTS, http: 409, condition: "A selection already exists for (mailing_month, age_band)" }
  - { id: ERR_SELECTION_MONTH_PAST, http: 422, condition: "Selection mailing_month is before the current logical month" }
  - { id: ERR_TITLE_UNAVAILABLE_MONTH, http: 422, condition: "Selection mailing_month is outside the title's inclusive availability window" }
  - { id: ERR_WAVE_MONTH_DUPLICATE, http: 409, condition: "A wave already exists for this mailing_month" }
  - { id: ERR_WAVE_MONTH_PAST, http: 422, condition: "Wave mailing_month is before the current logical month" }
  - { id: ERR_MANIFEST_SELECTIONS_INCOMPLETE, http: 409, condition: "Manifest requires LOCKED selections for all five age bands of the wave month" }
  - { id: ERR_INVENTORY_SHORTFALL, http: 409, condition: "A band's selected title has stock_on_hand below that band's manifest demand" }
  - { id: ERR_PRESS_CAPACITY_EXCEEDED, http: 409, condition: "Confirming this order would push the production month's confirmed total above 400000 units" }
  - { id: ERR_POPULATION_YEAR_DUPLICATE, http: 409, condition: "A population stat already exists for this affiliate and effective_year" }
  - { id: ERR_SELECTION_ALREADY_SUPPLIED, http: 409, condition: "The selection already has a CONFIRMED print order" }
  - { id: ERR_CREDIT_EXCEEDS_GROSS, http: 422, condition: "credit_amount_cents is missing, <= 0, or > gross_cents on RESOLVE_UPHELD" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Central program operator: programs, affiliates, titles, clock, invoice issue and dispute resolution"
    identity: opaque
    exclusive_operations:
      - "POST /library/_clock/set_current_utc"
      - "POST /library/state-programs"
      - "POST /library/affiliates"
      - "POST /library/titles"
      - "POST /library/invoices/{id}/issue"
      - "POST /library/invoices/{id}/dispute with outcome RESOLVE_UPHELD or RESOLVE_OVERRULED"
    shared_operations:
      - "All GET endpoints"
      - "POST /library/affiliates/{id}/agreements"
      - "POST /library/affiliates/{id}/population-stats"

  - name: StateProgramOfficer
    description: "Officer of one StateProgram; approves/rejects affiliate agreements for affiliates under that program"
    identity: "entity_backed:StateProgram"
    exclusive_operations:
      - "POST /library/agreements/{id}/approve"
      - "POST /library/agreements/{id}/reject"
    shared_operations:
      - "All GET endpoints"

  - name: AffiliateCoordinator
    description: "Runs one local Affiliate: registers children, manages address changes and population stats, pays and disputes invoices"
    identity: "entity_backed:Affiliate"
    exclusive_operations:
      - "POST /library/children"
      - "POST /library/children/{id}/address-changes"
      - "POST /library/address-changes/{id}/decide"
      - "POST /library/invoices/{id}/pay"
      - "POST /library/invoices/{id}/dispute with outcome OPEN"
    shared_operations:
      - "All GET endpoints (scoped to own affiliate for children/address-changes/population-stats/invoices/penetration)"
      - "POST /library/affiliates/{id}/agreements (own affiliate only)"
      - "POST /library/affiliates/{id}/population-stats (own affiliate only)"

  - name: AdvisoryCommitteeMember
    description: "Book-selection committee member; the proposer of a selection may never be its approver"
    identity: opaque
    exclusive_operations:
      - "POST /library/selections"
      - "POST /library/selections/{id}/approve"
      - "POST /library/selections/{id}/reopen"
    shared_operations:
      - "All GET endpoints"

  - name: PublisherOps
    description: "Publisher/printing operations: submits and confirms volume-priced print orders"
    identity: opaque
    exclusive_operations:
      - "POST /library/print-orders"
      - "POST /library/print-orders/{id}/confirm"
    shared_operations:
      - "All GET endpoints"

  - name: MailOps
    description: "Mailing operations: schedules waves, manifests, reconciles, records undeliverable returns"
    identity: opaque
    exclusive_operations:
      - "POST /library/waves"
      - "POST /library/waves/{id}/manifest"
      - "POST /library/waves/{id}/reconcile"
      - "POST /library/items/{id}/mark-returned"
    shared_operations:
      - "All GET endpoints"
