  - section: validations
    instances:
      - name: unauthenticated_request_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Missing auth headers -> 401 ERR_UNAUTHENTICATED before anything else."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/growers/00000000-0000-4000-8000-0000000000ff", payload: {}, captures: { err: "$.data.error_id" } }
          assert: ["error_id == ERR_UNAUTHENTICATED (http 401)"]
      - name: auth_priority_beats_not_found
        claim_type: priority_ordering
        grounds: ["validations[priority=1]", "validations[priority=4]"]
        distinguishing_aspect: "A request that is both unauthenticated AND targets a missing quote returns the priority-1 auth error, not 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/quotes/00000000-0000-4000-8000-0000000000fe", payload: {}, captures: { err: "$.data.error_id" } }
          assert: ["error_id == ERR_UNAUTHENTICATED (auth, priority 1, beats existence, priority 4)"]
      - name: duplicate_cutting_number_pure
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_DUPLICATE_CUTTING_NUMBER]"]
        distinguishing_aspect: "Same cutting_number on the same field+season with NON-overlapping windows still fails — uniqueness is independent of the temporal rule."
        test_recipe:
          setup: ["Grower/Field; Cutting #1 [2026-06-10, 2026-06-20) exists"]
          setup_api_calls:
            - { call: "POST /api/growers", payload: { name: "Grower Q", region_code: "OR-WILLAMETTE" }, as: PlatformAdmin, captures: { g_id: "$.data.id" } }
