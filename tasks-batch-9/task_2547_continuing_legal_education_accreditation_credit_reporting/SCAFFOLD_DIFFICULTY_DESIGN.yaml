      - name: frozen_risk_at_open_resolves_the_sample_size_risk_score_circularity
        grounds:
          - calculations.audit_sample_selection
          - calculations.provider_risk_score
          - calculations.attendance_report_lateness
          - entities.ProviderAudit.fields.risk_score_at_open
          - entities.ProviderAudit.fields.sampled_course_ids
          - entities.Provider.fields.risk_score
          - state_machines.ProviderAudit.SAMPLED_to_SAMPLED
          - state_machines.Complaint.UNDER_REVIEW_to_SUBSTANTIATED
          - concurrency_rules[sample-redraw-stale-audit]
        distinguishing_aspect: |
          Mode (c): sample size is keyed on the provider's risk score, but the audit's own findings
          and the complaints that escalate into audits feed that same risk score — a dependency that
          looks circular. The scaffold breaks it by pinning the evaluation order: risk_score_at_open
          is computed ONCE at audit creation and never refreshed on that row, so a REDRAW_SAMPLE
          after the live Provider.risk_score has crossed the 0.30 MID tier still uses the frozen 0.23
          and still draws 2 of the 3 eligible courses, not 3. Falsifiable: an implementation that
          re-reads the live score on redraw returns sample_size 3.
