              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { cyc: "$.data.id" }
            - call: "POST /disciplines"
              payload: { cycle_id: "${cyc}", code: "SCULPT", name: "Sculpture", portfolio_min_items: 1,
                         portfolio_max_items: 6, required_media_types: ["IMAGE"], requires_hazmat_review: false,
                         cohort_min_slots: 1, cohort_max_slots: 6, required_capability_tags: ["WELDING"],
                         required_ventilation_class: "LOCAL" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { disc: "$.data.id" }
            - call: "POST /applicants"
              payload: { full_name: "Ada Rivet", email: "ada.rivet@example.org",
                         affiliation_org: "North Shore Collective", citizenship_country: "US",
                         treaty_country: false, declared_annual_income_cents: 2000000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { art: "$.data.id" }
            - call: "POST /cycles/${cyc}/stage"
              payload: { to_status: "OPEN" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /residencies"
              payload: { cycle_id: "${cyc}", applicant_id: "${art}", discipline_id: "${disc}" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { res: "$.data.id" }
            - call: "POST /residencies/${res}/schedule"
              payload: { session_start_date: "2026-11-02", session_length_weeks: 8 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { res_v0: "$.data.version" }
            - call: "POST /residencies/${res}/schedule"
              payload: { session_start_date: "2026-11-02", session_length_weeks: 4 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { res_v1: "$.data.version" }
          trigger:
            - call: "POST /residencies/${res}/stipend-schedule"
              payload: { expected_residency_version: "${res_v0}" }
              as: FinanceOfficer
              as_user_id: "fin-01"
              captures: { err: "$.data.error_id" }
          assert:
            - "the stale token is refused: 412 ERR_STALE_VERSION, so the officer never generates a four-period schedule for what is now a four-week session"
            - "no rows were created: GET /stipend-disbursements?residency_id=${res} returns total_count == 0 and Residency.stipend_total_cents is unchanged"
            - "the current token succeeds and reflects the NEW session: with expected_residency_version ${res_v1} the call returns 201 with two periods of 140000 and stipend_total_cents 280000"
            - "generation itself bumps the guard: Residency.version is now ${res_v1} + 1, so replaying ${res_v1} returns 412 - a duplicate schedule cannot be created by a retry"
            - "regeneration is possible but must re-read: after another reschedule to 8 weeks, a fresh GET /residencies/${res} version allows the regeneration, which VOIDs the two SCHEDULED rows and creates four new ones starting again at period_index 1"
            - "the 412 is returned before the budget check: on a cycle whose stipend_uncommitted_cents could not cover the schedule, a stale token still yields 412 ERR_STALE_VERSION rather than 409 ERR_STIPEND_POOL_EXHAUSTED (P13 above P71)"
            - "the token is not interchangeable across residencies: a version read from another residency at the same number is still evaluated against THIS residency's live version"

      - name: explicit_and_automatic_studio_selection_record_different_modes
        claim_type: selector_policy
        grounds: ["calculations.studio_auto_selection", "endpoints[POST /studio-assignments]", "entities.StudioAssignment.selection_mode", "errors[ERR_NO_STUDIO_AVAILABLE]"]
        distinguishing_aspect: "One endpoint carries two policies behind one optional field: omitting studio_id runs the ranked selector and records selection_mode AUTO, while naming one skips ranking entirely and records EXPLICIT - but the explicit path must still run every eligibility check, and only the AUTO path may answer ERR_NO_STUDIO_AVAILABLE. Naming an ineligible studio must produce that studio's specific rejection, never the empty-set error."
        test_recipe:
          setup: ["Two residencies in a WELDING/LOCAL discipline, both scheduled 2026-11-02 for 8 weeks. Two studios: S-A (WELDING, LOCAL, 1 resident) and S-B (WELDING, KILN, FUME_HOOD, 1 resident) - so the selector prefers S-A on ventilation rank, and a CLEAN_ONLY studio S-Z exists to be named ineligibly."]
          setup_api_calls:
            - call: "POST /cycles"
              payload: { code: "CY-2027", open_at: "2026-08-01T00:00:00Z", close_at: "2026-09-30T00:00:00Z",
                         application_fee_cents: 5000, panel_quorum: 2, cohort_target_size: 10,
                         alumni_reserve_pct: 0.25, stipend_pool_cents: 20000000, slate_min_score: 60.00,
                         stipend_weekly_rate_cents: 70000, session_length_options_weeks: [4, 5, 8, 9] }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { cyc: "$.data.id" }
            - call: "POST /disciplines"
              payload: { cycle_id: "${cyc}", code: "SCULPT", name: "Sculpture", portfolio_min_items: 1,
                         portfolio_max_items: 6, required_media_types: ["IMAGE"], requires_hazmat_review: false,
                         cohort_min_slots: 1, cohort_max_slots: 6, required_capability_tags: ["WELDING"],
                         required_ventilation_class: "LOCAL" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { disc: "$.data.id" }
            - call: "POST /applicants"
              payload: { full_name: "Ada Rivet", email: "ada.rivet@example.org",
                         affiliation_org: "North Shore Collective", citizenship_country: "US",
                         treaty_country: false, declared_annual_income_cents: 2000000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { art1: "$.data.id" }
            - call: "POST /applicants"
              payload: { full_name: "Kell Osei", email: "kell.osei@example.org",
                         affiliation_org: "Press Room East", citizenship_country: "US",
                         treaty_country: false, declared_annual_income_cents: 2200000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { art2: "$.data.id" }
            - call: "POST /cycles/${cyc}/stage"
              payload: { to_status: "OPEN" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /residencies"
              payload: { cycle_id: "${cyc}", applicant_id: "${art1}", discipline_id: "${disc}" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { r1: "$.data.id" }
            - call: "POST /residencies"
              payload: { cycle_id: "${cyc}", applicant_id: "${art2}", discipline_id: "${disc}" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { r2: "$.data.id" }
            - call: "POST /residencies/${r1}/schedule"
              payload: { session_start_date: "2026-11-02", session_length_weeks: 8 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { v1: "$.data.version" }
            - call: "POST /residencies/${r2}/schedule"
              payload: { session_start_date: "2026-11-02", session_length_weeks: 8 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { v2: "$.data.version" }
            - call: "POST /studios"
              payload: { code: "S-A", capability_tags: ["WELDING"], ventilation_class: "LOCAL", max_concurrent_residents: 1, status: "AVAILABLE" }
              as: FacilitiesManager
              as_user_id: "fac-01"
              captures: { s_a: "$.data.id" }
            - call: "POST /studios"
              payload: { code: "S-B", capability_tags: ["WELDING", "KILN"], ventilation_class: "FUME_HOOD", max_concurrent_residents: 1, status: "AVAILABLE" }
              as: FacilitiesManager
              as_user_id: "fac-01"
              captures: { s_b: "$.data.id" }
            - call: "POST /studios"
              payload: { code: "S-Z", capability_tags: ["CLEAN_ONLY"], ventilation_class: "NONE", max_concurrent_residents: 4, status: "AVAILABLE" }
              as: FacilitiesManager
              as_user_id: "fac-01"
              captures: { s_z: "$.data.id" }
          trigger:
            - call: "POST /studio-assignments"
              payload: { residency_id: "${r1}", start_date: "2026-11-02", end_date: "2026-12-27", expected_residency_version: "${v1}" }
              as: FacilitiesManager
              as_user_id: "fac-01"
              captures: { sa1: "$.data.id", sa1_mode: "$.data.selection_mode", sa1_studio: "$.data.studio_id" }
          assert:
            - "omitting studio_id runs the selector: 201 with selection_mode 'AUTO' and studio_id ${s_a}, the least over-provisioned eligible studio (ventilation rank 1 beats S-B's 2)"
            - "naming a studio skips the ranking but not the checks: the same call for ${r2} with studio_id ${s_b} returns 201 with selection_mode 'EXPLICIT' and studio_id ${s_b}, even though the selector would never have picked it"
            - "the two modes are distinguishable in the list surface: GET /studio-assignments?selection_mode=AUTO returns total_count == 1 and ?selection_mode=EXPLICIT returns total_count == 1"
            - "an ineligible explicit choice gets its own error: studio_id ${s_z} for ${r2} returns 422 ERR_STUDIO_CAPABILITY_MISMATCH, never ERR_NO_STUDIO_AVAILABLE"
            - "only the AUTO path can exhaust the set: with S-A and S-B both occupied for the window and only the CLEAN_ONLY S-Z left, an omitted studio_id returns 409 ERR_NO_STUDIO_AVAILABLE"
            - "the selector's input set is state-filtered: after PATCH /studios/${s_a} sets status 'MAINTENANCE', a fresh AUTO request for an overlapping window picks ${s_b} instead"
            - "the mode is recorded once and never recomputed: releasing ${sa1} and creating a replacement with an explicit studio_id leaves the released row's selection_mode ${sa1_mode} as 'AUTO'"

      - name: termination_cascade_end_to_end
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: severe_conflict_recusal_chain_unwinds_the_whole_cycle_panel
          rationale: "The multi-level chain claims - N levels verified end to end, ordering sensitivity, and no drift at the far end - are the whole point of the two §1.8 transitive_cascade instances, which walk the four-link recusal chain and the termination repricing chain and assert every intermediate node. A layer-level restatement here would re-run the same cascades with the same asserts."

      - name: both_stipend_variants_and_the_switch_delta
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: application_provisional_untrimmed_vs_final_trimmed_panel_score
          rationale: "The two §1.8 dual_variant_calc instances already evaluate each variants block at a state where the two formulas disagree and pin the delta at the switch - the untrimmed provisional mean against the trimmed final mean, and the provisional award against the settled stipend. The layer claim adds no surface those two do not already cover."

  # ===================================================================================
  # From Consistency Model
  # ===================================================================================
  - section: consistency_model
    instances:

      - name: scheduling_returns_every_derived_field_in_the_same_response
        claim_type: immediate
        grounds: ["complexity_profile.consistency_model", "endpoints[POST /residencies/{id}/schedule]", "calculations.obligation_provisioning", "entities.Cycle.stipend_uncommitted_cents"]
        distinguishing_aspect: "One scheduling call derives session dates, a stipend commitment, an obligation set, a visa timeline and two cycle ledgers. Under an immediate model every one of those must already be correct in THAT response and in any read that follows it - no settling, no second call, and no field left null for a later recompute. The claim is only meaningful because the derived values live on three different entities."
        test_recipe:
          setup: ["An OPEN cycle (stipend pool 20000000, weekly rate 70000, cohort target 10) with a SCULPT discipline and one invited residency for an international FR artist, so a VisaCase already exists in INITIATED."]
          setup_api_calls:
            - call: "POST /cycles"
              payload: { code: "CY-2027", open_at: "2026-08-01T00:00:00Z", close_at: "2026-09-30T00:00:00Z",
                         application_fee_cents: 5000, panel_quorum: 2, cohort_target_size: 10,
                         alumni_reserve_pct: 0.25, stipend_pool_cents: 20000000, slate_min_score: 60.00,
                         stipend_weekly_rate_cents: 70000, session_length_options_weeks: [4, 5, 8, 9] }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { cyc: "$.data.id" }
            - call: "POST /disciplines"
              payload: { cycle_id: "${cyc}", code: "SCULPT", name: "Sculpture", portfolio_min_items: 1,
                         portfolio_max_items: 6, required_media_types: ["IMAGE"], requires_hazmat_review: false,
                         cohort_min_slots: 1, cohort_max_slots: 6, required_capability_tags: ["WELDING"],
                         required_ventilation_class: "LOCAL" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { disc: "$.data.id" }
            - call: "POST /applicants"
              payload: { full_name: "Camille Roux", email: "camille.roux@example.org",
                         affiliation_org: "Atelier Sud", citizenship_country: "FR",
                         treaty_country: true, declared_annual_income_cents: 1900000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { art: "$.data.id" }
            - call: "POST /cycles/${cyc}/stage"
              payload: { to_status: "OPEN" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /residencies"
              payload: { cycle_id: "${cyc}", applicant_id: "${art}", discipline_id: "${disc}" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { res: "$.data.id" }
          trigger:
            - call: "POST /residencies/${res}/schedule"
              payload: { session_start_date: "2026-11-02", session_length_weeks: 8 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { res_v: "$.data.version" }
          assert:
            - "the response itself already carries the derived dates: session_end_date '2026-12-27' and session_length_weeks 8, with no null left for a later pass"
            - "the money derivation is in the same body: stipend_total_cents 560000 (8 x 70000) with stipend_basis 'PROVISIONAL'"
            - "the obligation derivation is in the same body: obligations_required_total 5 and obligations_completed_total 0, from three base rows plus floor(8 / 4) == 2 workshop units"
            - "the obligation ROWS are readable immediately, not eventually: GET /obligations?residency_id=${res} right after the call returns total_count == 4, all PENDING"
            - "the cycle ledgers moved in lock step and are visible on the very next read: GET /cycles/${cyc} reads stipend_uncommitted_cents 19440000 (20000000 - 560000), slots_filled_count 1 and slots_open_count 9"
            - "the visa timeline is already derived on the other entity: GET /visa-cases?residency_id=${res} reads case_type 'B1_SHORT_TERM', backlog_days 21, filing_deadline_date '2026-07-14' and earliest_entry_date '2026-10-03'"
            - "a re-read is redundant rather than corrective: GET /residencies/${res} returns exactly the trigger's field values with version still ${res_v}"
            - "the same holds for a correction: rescheduling to 4 weeks returns stipend_total_cents 280000, obligations_required_total 4 and, in the following read, cycle stipend_uncommitted_cents 19720000 - the previous commitment is released in the same call that replaces it"
