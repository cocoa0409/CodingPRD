# =============================================================================
# SCAFFOLD.yaml — Residential Appraisal Practice Management (independent firm)
# §1.0–§1.7 seed tables. Difficulty design (§1.8) and corner design (§1.9)
# live in sibling files SCAFFOLD_DIFFICULTY_DESIGN.yaml / SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Residential Appraisal Practice Management (independent appraisal firm): order
  acceptance & scope determination, appointment scheduling & inspection,
  comparable research & adjustment support, USPAP compliance & workfile
  retention, revision request & reconsideration-of-value handling, appraiser
  trainee supervision & signature rules, turn time & fee panel management,
  complaint/board inquiry response

domain_name: residential-appraisal-practice
api_prefix: /appraisal

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - rate_threshold_triggers
    - temporal_windowing
  entity_topology: flat           # peer entities joined by FK references; no URL nesting under parents
  state_machine_shape: cyclic     # report/order revision loops, appointment reschedule loop
  relationship_patterns:
    - one_to_many
    - self_referential            # Appraiser.supervisor_id -> Appraiser.id (trainee supervision)
    - cross_aggregate             # comps/appointments/reports reach across order aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (flat topology; all joins via FK fields)
# =============================================================================
entities:
  - name: Client
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Lender / AMC legal name" }
      - { name: client_type, type: enum, source: input, description: "AMC | DIRECT_LENDER | PRIVATE" }
      - { name: contact_email, type: string, source: input, description: "Primary contact email" }
      - { name: default_turn_time_days, type: integer, source: input, description: "Client's standard turn time in calendar days; >= 1" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED | TERMINATED" }

  - name: Appraiser
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Appraiser full name" }
      - { name: license_level, type: enum, source: input, description: "TRAINEE | LICENSED | CERTIFIED_RESIDENTIAL" }
      - { name: license_number, type: string, source: input, description: "State license / registry number" }
      - { name: license_expiry, type: string, source: input, description: "ISO-8601 date (YYYY-MM-DD) license expires; assignments and deliveries require expiry strictly after the logical clock date" }
      - { name: supervisor_id, type: string, source: input, description: "FK -> Appraiser.id; required iff license_level == TRAINEE, forbidden otherwise; referenced supervisor must be CERTIFIED_RESIDENTIAL" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | INACTIVE (staff availability flag, independent of standing)" }
      - { name: sanction_override, type: boolean, source: system, default: false, description: "True while a board-sanctioned suspension is in force; forces standing = PANEL_SUSPENDED until cleared" }
      - { name: completed_count, type: integer, source: computed, default: 0, description: "Count of AppraisalOrders with assigned_appraiser_id == this appraiser and first_delivered_at IS NOT NULL" }
      - { name: on_time_count, type: integer, source: computed, default: 0, description: "Subset of completed_count with first_delivered_at <= due_at" }
      - { name: no_show_count, type: integer, source: computed, default: 0, description: "Count of Appointments for this appraiser in NO_SHOW" }
      - { name: standing, type: enum, source: computed, description: "GOOD_STANDING | PROBATION | PANEL_SUSPENDED — derived per turn_time_scorecard calculation; sanction_override forces PANEL_SUSPENDED" }

  - name: PanelMembership
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id" }
      - { name: appraiser_id, type: string, source: input, description: "FK -> Appraiser.id" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | REMOVED; at most one ACTIVE row per (client_id, appraiser_id) pair" }

  - name: FeeSchedule
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id" }
      - { name: complexity_tier, type: enum, source: input, description: "STANDARD | COMPLEX | HIGH_VALUE" }
      - { name: base_fee_cents, type: integer, source: input, description: "Base fee in cents; > 0" }
      - { name: rush_multiplier_bps, type: integer, source: input, description: "Rush premium in basis points of base fee; 0..10000" }
      - { name: revision_fee_cents, type: integer, source: input, description: "Fee charged when a revision request is accepted; >= 0" }
      - { name: effective_from, type: datetime, source: input, description: "Inclusive start of effectiveness window (ISO-8601 UTC)" }
      - { name: effective_to, type: datetime, source: input, description: "Exclusive end of effectiveness window; null = open-ended. Half-open [from, to) windows per (client_id, complexity_tier) must never overlap; creating a new row closes the open-ended prior row at the new effective_from" }

  - name: AppraisalOrder
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id" }
      - { name: property_address, type: string, source: input, description: "Subject property street address" }
      - { name: property_type, type: enum, source: input, description: "SFR | CONDO | MULTI_2_4 | MANUFACTURED" }
      - { name: estimated_value_cents, type: integer, source: input, description: "Client-stated estimated value in cents; > 0; drives tier determination" }
      - { name: loan_type, type: enum, source: input, description: "CONVENTIONAL | FHA | VA" }
      - { name: requested_turn_days, type: integer, source: input, description: "Client-requested turn time in calendar days; >= 1" }
      - { name: complexity_tier, type: enum, source: computed, description: "STANDARD | COMPLEX | HIGH_VALUE — set by determine-scope (computed default, optional one-level admin override)" }
      - { name: requires_inspection, type: boolean, source: system, default: true, description: "False only when determine-scope marks a STANDARD order as desktop; gates appointment chain and workfile completeness" }
      - { name: assigned_appraiser_id, type: string, source: system, description: "FK -> Appraiser.id; null until assigned; reset to null by unassignment cascade" }
      - { name: requires_supervisor_cosign, type: boolean, source: computed, default: false, description: "True when assigned appraiser license_level == TRAINEE at assignment time" }
      - { name: fee_quoted_cents, type: integer, source: computed, description: "Provisional fee computed at determine-scope (schedule effective as-of scope timestamp)" }
      - { name: fee_current_cents, type: integer, source: computed, description: "Final fee locked at accept (schedule effective as-of acceptance), then mutated by revision fees and fee adjustments" }
      - { name: surcharge_total_cents, type: integer, source: computed, default: 0, description: "Cumulative SURCHARGE fee adjustments" }
      - { name: waived_total_cents, type: integer, source: computed, default: 0, description: "Cumulative WAIVER fee adjustments" }
      - { name: revision_fees_collected_cents, type: integer, source: computed, default: 0, description: "Cumulative revision fees charged on accepted revision requests" }
      - { name: cancellation_fee_cents, type: integer, source: computed, description: "Set on cancel: 0 before ACCEPTED, else round_half_up(fee_current_cents * 0.5)" }
      - { name: status, type: enum, source: system, description: "RECEIVED | SCOPE_DETERMINED | ACCEPTED | ASSIGNED | INSPECTION_SCHEDULED | INSPECTED | IN_ANALYSIS | DRAFTING | QC_REVIEW | DELIVERED | IN_REVISION | COMPLETED | CANCELLED" }
      - { name: accepted_at, type: datetime, source: system, description: "Logical clock at acceptance; null until accepted" }
      - { name: due_at, type: datetime, source: computed, description: "accepted_at + requested_turn_days * 86400 seconds" }
      - { name: first_delivered_at, type: datetime, source: system, description: "Logical clock of first report delivery; set once; null until first delivery" }
      - { name: inspection_completed_at, type: datetime, source: system, description: "Logical clock when inspection appointment completed; null for desktop orders" }
      - { name: open_complaint_count, type: integer, source: system, default: 0, description: "Complaints on this order in RECEIVED | RESPONSE_DRAFTED | RESPONSE_SUBMITTED; incremented on complaint create, decremented on close" }
      - { name: completed_at, type: datetime, source: system, description: "Logical clock at COMPLETED; null otherwise" }

  - name: Appointment
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> AppraisalOrder.id" }
      - { name: appraiser_id, type: string, source: input, description: "FK -> Appraiser.id; equality with the order's assigned_appraiser_id is enforced at confirm (not at create)" }
      - { name: window_start, type: datetime, source: input, description: "Inspection window start (ISO-8601 UTC); must be strictly after logical clock at create/confirm/reschedule" }
      - { name: window_end, type: datetime, source: input, description: "Inspection window end; must be strictly greater than window_start" }
      - { name: status, type: enum, source: system, default: PROPOSED, description: "PROPOSED | CONFIRMED | COMPLETED | NO_SHOW | CANCELLED" }
      - { name: completed_at, type: datetime, source: system, description: "Logical clock at completion; null otherwise" }

  - name: Comparable
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> AppraisalOrder.id" }
      - { name: address, type: string, source: input, description: "Comparable property address" }
      - { name: sale_price_cents, type: integer, source: input, description: "Recorded sale price in cents; > 0" }
      - { name: sale_date, type: string, source: input, description: "ISO-8601 date (YYYY-MM-DD) of comparable sale" }
      - { name: distance_miles, type: number, source: input, description: "Distance from subject in miles; >= 0; eligibility requires <= 2.00" }
      - { name: site_adjustment_cents, type: integer, source: input, description: "Signed site/lot adjustment in cents" }
      - { name: gla_adjustment_cents, type: integer, source: input, description: "Signed gross-living-area adjustment in cents" }
      - { name: condition_adjustment_cents, type: integer, source: input, description: "Signed condition/quality adjustment in cents" }
      - { name: other_adjustment_cents, type: integer, source: input, default: 0, description: "Signed catch-all adjustment in cents" }
      - { name: adjusted_price_cents, type: integer, source: computed, description: "sale_price_cents + sum of per-line rounded adjustments (see comparable_adjustment)" }
      - { name: net_adjustment_pct, type: number, source: computed, description: "abs(net adjustment sum) / sale_price_cents as percent, 2dp round_half_up; ineligible when > 15.00" }
      - { name: gross_adjustment_pct, type: number, source: computed, description: "sum of abs(per-line rounded adjustments) / sale_price_cents as percent, 2dp round_half_up; ineligible when > 25.00" }
      - { name: is_eligible, type: boolean, source: computed, description: "net <= 15.00 AND gross <= 25.00 AND distance_miles <= 2.00 AND sale_date within 365 days before the logical clock date at verify time" }
      - { name: ineligible_reasons, type: array, source: computed, description: "Subset of [NET_ADJ_EXCEEDED, GROSS_ADJ_EXCEEDED, DISTANCE_EXCEEDED, SALE_TOO_OLD] explaining is_eligible == false; empty when eligible" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | VERIFIED | LOCKED | EXCLUDED" }

  - name: Report
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> AppraisalOrder.id; exactly one Report per order" }
      - { name: report_type, type: enum, source: input, description: "FORM_1004 | FORM_1073 | FORM_1025" }
      - { name: condition_rating, type: enum, source: input, description: "C1 | C2 | C3 | C4 | C5 | C6" }
      - { name: value_conclusion_cents, type: integer, source: computed, description: "Distance-weighted mean of LOCKED eligible comps' adjusted_price_cents, single final rounding to nearest 100000 cents (see value_conclusion)" }
      - { name: signing_appraiser_id, type: string, source: system, description: "FK -> Appraiser.id; set to the order's assigned_appraiser_id at report creation" }
      - { name: co_signer_appraiser_id, type: string, source: system, description: "FK -> Appraiser.id; set by co-sign action; required before delivery when order.requires_supervisor_cosign" }
      - { name: reviewer_id, type: string, source: system, description: "FK -> Appraiser.id; the QCReviewer X-User-ID recorded at qc-pass" }
      - { name: revision_round, type: integer, source: system, default: 0, description: "Increments by 1 each time an accepted revision request reopens the report" }
      - { name: qc_fail_count, type: integer, source: system, default: 0, description: "Increments on each qc-fail" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | PENDING_QC | QC_PASSED | DELIVERED | UNDER_REVISION" }

  - name: RevisionRequest
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> AppraisalOrder.id (from path)" }
      - { name: kind, type: enum, source: input, description: "CORRECTION | RECONSIDERATION_OF_VALUE" }
      - { name: detail, type: string, source: input, description: "Client's revision narrative" }
      - { name: submitted_value_cents, type: integer, source: input, description: "Required iff kind == RECONSIDERATION_OF_VALUE; client's proposed value, > 0; must differ from current report value_conclusion_cents" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | ACCEPTED | REBUTTED | SUPERSEDED | RESOLVED" }
      - { name: revision_fee_charged_cents, type: integer, source: computed, description: "Set at accept: revision fee from the (client, tier) schedule effective as-of order.first_delivered_at; retail fallback 15000" }
      - { name: rebuttal, type: string, source: input, description: "Required at rebut; firm's reasoned response" }

  - name: WorkfileRecord
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> AppraisalOrder.id" }
      - { name: snapshot_type, type: enum, source: input, description: "ORDER_FORM | INSPECTION_NOTES | COMP_DATA | REPORT_PDF | CERTIFICATION | REVISION_CORRESPONDENCE" }
      - { name: recorded_at, type: datetime, source: system, description: "Logical clock at record creation" }
      - { name: retention_until, type: datetime, source: computed, description: "Null until the order's first delivery; then max(first_delivered_at + 5 years, latest CLOSED_SANCTIONED complaint closed_at + 2 years) — see retention_expiry" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | LEGAL_HOLD | PURGED" }
      - { name: purged_at, type: datetime, source: system, description: "Logical clock at purge; null otherwise" }

  - name: Complaint
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> AppraisalOrder.id; order must be DELIVERED or COMPLETED" }
      - { name: respondent_appraiser_id, type: string, source: input, description: "FK -> Appraiser.id; the appraiser named in the board inquiry" }
      - { name: description, type: string, source: input, description: "Complaint narrative" }
      - { name: received_at, type: datetime, source: system, description: "Logical clock at complaint intake" }
      - { name: response_due_at, type: datetime, source: computed, description: "received_at + 21 days" }
      - { name: response_text, type: string, source: input, description: "Draft response body (set at draft-response)" }
      - { name: status, type: enum, source: system, default: RECEIVED, description: "RECEIVED | RESPONSE_DRAFTED | RESPONSE_SUBMITTED | CLOSED_NO_ACTION | CLOSED_SANCTIONED" }
      - { name: closed_at, type: datetime, source: system, description: "Logical clock at close; null otherwise" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Client
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /appraisal/clients/{id}/suspend"
        actor: FirmAdmin
        preconditions: ["Client in ACTIVE (ERR_INVALID_STATE)"]
        side_effects:
          - "New AppraisalOrder creation for this client is rejected (ERR_CLIENT_NOT_ACTIVE); in-flight orders are unaffected"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /appraisal/clients/{id}/reactivate"
        actor: FirmAdmin
        preconditions: ["Client in SUSPENDED (ERR_INVALID_STATE)"]
        side_effects: []
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /appraisal/clients/{id}/terminate"
        actor: FirmAdmin
        preconditions: ["Client in ACTIVE or SUSPENDED (ERR_INVALID_STATE)"]
        side_effects:
          - "All ACTIVE PanelMemberships for this client -> REMOVED"
          - "New orders and fee schedules for this client are rejected (ERR_CLIENT_NOT_ACTIVE)"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /appraisal/clients/{id}/terminate"
        actor: FirmAdmin
        preconditions: ["Client in ACTIVE or SUSPENDED (ERR_INVALID_STATE)"]
        side_effects:
          - "All ACTIVE PanelMemberships for this client -> REMOVED"

  - entity: Appraiser
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /appraisal/appraisers/{id}/deactivate"
        actor: FirmAdmin
        preconditions:
          - "Appraiser in ACTIVE (ERR_INVALID_STATE)"
          - "No orders assigned to this appraiser in ASSIGNED | INSPECTION_SCHEDULED | INSPECTED | IN_ANALYSIS | DRAFTING | QC_REVIEW (ERR_APPRAISER_HAS_OPEN_ASSIGNMENTS)"
        side_effects: []
      - from: INACTIVE
        to: ACTIVE
        trigger: "POST /appraisal/appraisers/{id}/reactivate"
        actor: FirmAdmin
        preconditions:
          - "Appraiser in INACTIVE (ERR_INVALID_STATE)"
          - "license_expiry strictly after logical clock date (ERR_LICENSE_EXPIRED)"
        side_effects: []

  - entity: PanelMembership
    initial_state: ACTIVE
    terminal_states: [REMOVED]
    transitions:
      - from: ACTIVE
        to: REMOVED
        trigger: "POST /appraisal/panel-memberships/{id}/remove, or system (sanction cascade / client termination)"
        actor: FirmAdmin | system
        preconditions: ["Membership in ACTIVE (ERR_INVALID_STATE)"]
        side_effects: []

  - entity: AppraisalOrder
    initial_state: RECEIVED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: RECEIVED
        to: SCOPE_DETERMINED
        trigger: "POST /appraisal/orders/{id}/determine-scope"
        actor: FirmAdmin
        preconditions:
          - "Order in RECEIVED (ERR_INVALID_STATE)"
          - "Client status == ACTIVE (ERR_CLIENT_NOT_ACTIVE)"
          - "complexity_tier_override, if present, equals computed tier or computed tier one level up (ERR_INVALID_TIER_OVERRIDE); HIGH_VALUE cannot be raised further"
          - "requires_inspection may be false only when the resulting tier is STANDARD (ERR_DESKTOP_NOT_ALLOWED)"
        side_effects:
          - "complexity_tier set (default: estimated_value_cents >= 100000000 -> HIGH_VALUE; elif property_type in {MULTI_2_4, MANUFACTURED} -> COMPLEX; else STANDARD)"
          - "fee_quoted_cents computed via fee_quote (provisional variant: schedule effective as-of logical clock now)"
          - "increments AppraisalOrder.version by 1"
      - from: SCOPE_DETERMINED
        to: ACCEPTED
        trigger: "POST /appraisal/orders/{id}/accept"
        actor: FirmAdmin
        preconditions:
          - "Order in SCOPE_DETERMINED (ERR_INVALID_STATE)"
          - "Client status == ACTIVE (ERR_CLIENT_NOT_ACTIVE)"
        side_effects:
          - "fee_current_cents computed via fee_quote (final variant: schedule effective as-of acceptance timestamp); may differ from fee_quoted_cents when the schedule window changed between scope and accept"
          - "accepted_at = logical clock; due_at = accepted_at + requested_turn_days days"
          - "creates WorkfileRecord(snapshot_type=ORDER_FORM) for this order"
          - "increments AppraisalOrder.version by 1"
      - from: ACCEPTED
        to: ASSIGNED
        trigger: "POST /appraisal/orders/{id}/assign"
        actor: FirmAdmin
        preconditions:
          - "Order in ACCEPTED (ERR_INVALID_STATE)"
          - "Selected appraiser: status == ACTIVE and standing != PANEL_SUSPENDED and sanction_override == false (ERR_APPRAISER_NOT_ASSIGNABLE), ACTIVE PanelMembership for order.client_id exists (ERR_APPRAISER_NOT_ON_PANEL), license covers tier — HIGH_VALUE requires CERTIFIED_RESIDENTIAL, COMPLEX requires LICENSED or CERTIFIED_RESIDENTIAL, STANDARD any level (ERR_LICENSE_LEVEL_INSUFFICIENT), license_expiry strictly after logical clock date (ERR_LICENSE_EXPIRED)"
          - "When appraiser_id omitted: selector over eligible candidates ranked by on_time_rate DESC (null treated as 1.0000), then in-flight order count ASC (orders in ASSIGNED..QC_REVIEW), then appraiser created_at ASC; empty candidate set -> ERR_NO_ELIGIBLE_APPRAISER"
        side_effects:
          - "assigned_appraiser_id set; requires_supervisor_cosign = (appraiser.license_level == TRAINEE)"
          - "increments AppraisalOrder.version by 1"
      - from: ASSIGNED
        to: INSPECTION_SCHEDULED
        trigger: "system (on first Appointment CONFIRMED for this order)"
        actor: system
        preconditions: ["Order in ASSIGNED"]
        side_effects: ["increments AppraisalOrder.version by 1"]
      - from: INSPECTION_SCHEDULED
        to: INSPECTED
        trigger: "system (on Appointment CONFIRMED -> COMPLETED)"
        actor: system
        preconditions: ["Order in INSPECTION_SCHEDULED"]
        side_effects:
          - "inspection_completed_at = logical clock"
          - "increments AppraisalOrder.version by 1"
      - from: INSPECTED
        to: IN_ANALYSIS
        trigger: "POST /appraisal/orders/{id}/start-analysis"
        actor: Appraiser
        preconditions:
          - "Order in INSPECTED (ERR_INVALID_STATE)"
          - "Acting appraiser id == assigned_appraiser_id (ERR_NOT_ASSIGNED_APPRAISER)"
        side_effects: ["increments AppraisalOrder.version by 1"]
      - from: ASSIGNED
        to: IN_ANALYSIS
        trigger: "POST /appraisal/orders/{id}/start-analysis (desktop orders only)"
        actor: Appraiser
        preconditions:
          - "Order in ASSIGNED and requires_inspection == false (ERR_INVALID_STATE otherwise)"
          - "Acting appraiser id == assigned_appraiser_id (ERR_NOT_ASSIGNED_APPRAISER)"
        side_effects: ["increments AppraisalOrder.version by 1"]
      - from: IN_ANALYSIS
        to: DRAFTING
        trigger: "system (on Report creation)"
        actor: system
        preconditions: ["Order in IN_ANALYSIS"]
        side_effects: ["increments AppraisalOrder.version by 1"]
      - from: DRAFTING
        to: QC_REVIEW
        trigger: "system (on Report DRAFT -> PENDING_QC)"
        actor: system
        preconditions: ["Order in DRAFTING"]
        side_effects: ["increments AppraisalOrder.version by 1"]
      - from: QC_REVIEW
        to: DRAFTING
        trigger: "system (on Report PENDING_QC -> DRAFT via qc-fail)"
        actor: system
        preconditions: ["Order in QC_REVIEW"]
        side_effects: ["increments AppraisalOrder.version by 1"]
      - from: QC_REVIEW
        to: DELIVERED
        trigger: "system (on Report QC_PASSED -> DELIVERED)"
        actor: system
        preconditions: ["Order in QC_REVIEW"]
        side_effects:
          - "first_delivered_at = logical clock when previously null"
          - "retention_until pinned on all non-PURGED WorkfileRecords of this order via retention_expiry"
          - "increments AppraisalOrder.version by 1"
      - from: IN_REVISION
        to: QC_REVIEW
        trigger: "system (on Report UNDER_REVISION -> PENDING_QC resubmission)"
        actor: system
        preconditions: ["Order in IN_REVISION"]
        side_effects: ["increments AppraisalOrder.version by 1"]
      - from: IN_REVISION
        to: DELIVERED
        trigger: "system (on revised Report QC_PASSED -> DELIVERED)"
        actor: system
        preconditions: ["Order in IN_REVISION"]
        side_effects:
          - "ACCEPTED RevisionRequest on this order -> RESOLVED"
          - "increments AppraisalOrder.version by 1"
      - from: DELIVERED
        to: IN_REVISION
        trigger: "system (on RevisionRequest OPEN -> ACCEPTED)"
        actor: system
        preconditions: ["Order in DELIVERED"]
        side_effects: ["increments AppraisalOrder.version by 1"]
      - from: DELIVERED
        to: COMPLETED
        trigger: "POST /appraisal/orders/{id}/complete"
        actor: FirmAdmin
        preconditions:
          - "Order in DELIVERED (ERR_INVALID_STATE)"
          - "No RevisionRequest on this order in OPEN or ACCEPTED (ERR_INVALID_STATE)"
          - "open_complaint_count == 0 (ERR_COMPLIANCE_HOLD_ACTIVE)"
          - "Workfile completeness: non-PURGED WorkfileRecords cover ORDER_FORM, COMP_DATA, REPORT_PDF, CERTIFICATION, plus INSPECTION_NOTES iff requires_inspection (ERR_WORKFILE_INCOMPLETE)"
        side_effects:
          - "completed_at = logical clock"
          - "increments AppraisalOrder.version by 1"
      - from: RECEIVED
        to: CANCELLED
        trigger: "POST /appraisal/orders/{id}/cancel"
        actor: FirmAdmin | ClientUser
        preconditions:
          - "Order in RECEIVED | SCOPE_DETERMINED | ACCEPTED | ASSIGNED (ERR_INVALID_STATE)"
          - "ClientUser may cancel only own client's orders and only from RECEIVED or SCOPE_DETERMINED (ERR_NOT_RESOURCE_OWNER / ERR_INVALID_STATE)"
        side_effects:
          - "cancellation_fee_cents = 0 from RECEIVED | SCOPE_DETERMINED; round_half_up(fee_current_cents * 0.5) from ACCEPTED | ASSIGNED"
          - "All PROPOSED | CONFIRMED Appointments for this order -> CANCELLED"
          - "increments AppraisalOrder.version by 1"
      - from: SCOPE_DETERMINED
        to: CANCELLED
        trigger: "POST /appraisal/orders/{id}/cancel"
        actor: FirmAdmin | ClientUser
        preconditions: ["Order in RECEIVED | SCOPE_DETERMINED | ACCEPTED | ASSIGNED (ERR_INVALID_STATE)"]
        side_effects:
          - "cancellation_fee_cents = 0"
          - "increments AppraisalOrder.version by 1"
      - from: ACCEPTED
        to: CANCELLED
        trigger: "POST /appraisal/orders/{id}/cancel"
        actor: FirmAdmin
        preconditions: ["Order in RECEIVED | SCOPE_DETERMINED | ACCEPTED | ASSIGNED (ERR_INVALID_STATE)"]
        side_effects:
          - "cancellation_fee_cents = round_half_up(fee_current_cents * 0.5)"
          - "increments AppraisalOrder.version by 1"
      - from: ASSIGNED
        to: CANCELLED
        trigger: "POST /appraisal/orders/{id}/cancel"
        actor: FirmAdmin
        preconditions: ["Order in RECEIVED | SCOPE_DETERMINED | ACCEPTED | ASSIGNED (ERR_INVALID_STATE)"]
        side_effects:
          - "cancellation_fee_cents = round_half_up(fee_current_cents * 0.5)"
          - "All PROPOSED | CONFIRMED Appointments for this order -> CANCELLED"
          - "increments AppraisalOrder.version by 1"
      - from: ASSIGNED
        to: ACCEPTED
        trigger: "system (unassignment cascade: sanction closes, assignee suspension)"
        actor: system
        preconditions: ["Assigned appraiser's standing became PANEL_SUSPENDED via sanction cascade"]
        side_effects:
          - "assigned_appraiser_id = null; requires_supervisor_cosign = false"
          - "All PROPOSED | CONFIRMED Appointments for this order -> CANCELLED (next link of the cascade)"
          - "increments AppraisalOrder.version by 1"

  - entity: Appointment
    initial_state: PROPOSED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: PROPOSED
        to: CONFIRMED
        trigger: "POST /appraisal/appointments/{id}/confirm"
        actor: Appraiser | FirmAdmin
        preconditions:
          - "Appointment in PROPOSED (ERR_INVALID_STATE)"
          - "window_start strictly after logical clock (ERR_WINDOW_IN_PAST)"
          - "Order in ASSIGNED | INSPECTION_SCHEDULED (ERR_INVALID_STATE)"
          - "appraiser_id == order.assigned_appraiser_id (ERR_NOT_ASSIGNED_APPRAISER)"
          - "No other CONFIRMED appointment for this appraiser whose [window_start - 30min, window_end + 30min) intersects this one's (ERR_APPOINTMENT_OVERLAP)"
        side_effects:
          - "If order in ASSIGNED: order -> INSPECTION_SCHEDULED"
      - from: CONFIRMED
        to: PROPOSED
        trigger: "POST /appraisal/appointments/{id}/reschedule"
        actor: Appraiser | FirmAdmin
        preconditions:
          - "Appointment in CONFIRMED (ERR_INVALID_STATE)"
          - "New window_start strictly after logical clock (ERR_WINDOW_IN_PAST); window_end > window_start (ERR_VALIDATION)"
        side_effects: ["Appointment window replaced; order remains INSPECTION_SCHEDULED"]
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /appraisal/appointments/{id}/complete"
        actor: Appraiser
        preconditions:
          - "Appointment in CONFIRMED (ERR_INVALID_STATE)"
          - "Logical clock >= window_end (ERR_WINDOW_IN_PAST)"
        side_effects:
          - "completed_at = logical clock"
          - "Order INSPECTION_SCHEDULED -> INSPECTED; inspection_completed_at set"
          - "creates WorkfileRecord(snapshot_type=INSPECTION_NOTES) for the order"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /appraisal/appointments/{id}/no-show"
        actor: Appraiser | FirmAdmin
        preconditions: ["Appointment in CONFIRMED (ERR_INVALID_STATE)"]
        side_effects:
          - "appraiser no_show_count += 1"
          - "Order remains INSPECTION_SCHEDULED (a new appointment is required)"
      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /appraisal/appointments/{id}/cancel, or system (order cancel / unassign cascade)"
        actor: Appraiser | FirmAdmin | system
        preconditions: ["Appointment in PROPOSED | CONFIRMED (ERR_INVALID_STATE)"]
        side_effects: []
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /appraisal/appointments/{id}/cancel, or system (order cancel / unassign cascade)"
        actor: Appraiser | FirmAdmin | system
        preconditions: ["Appointment in PROPOSED | CONFIRMED (ERR_INVALID_STATE)"]
        side_effects: []

  - entity: Comparable
    initial_state: DRAFT
    terminal_states: [EXCLUDED]
    transitions:
      - from: DRAFT
        to: VERIFIED
        trigger: "POST /appraisal/comparables/{id}/verify"
        actor: Appraiser
        preconditions:
          - "Comparable in DRAFT (ERR_INVALID_STATE)"
          - "Order in IN_ANALYSIS | IN_REVISION (ERR_INVALID_STATE)"
        side_effects: ["Recomputes adjusted_price_cents, net/gross percents, is_eligible, ineligible_reasons (sale recency measured against logical clock at verify)"]
      - from: VERIFIED
        to: LOCKED
        trigger: "POST /appraisal/comparables/{id}/lock"
        actor: Appraiser
        preconditions:
          - "Comparable in VERIFIED (ERR_INVALID_STATE)"
          - "Order in IN_ANALYSIS | DRAFTING | IN_REVISION (ERR_INVALID_STATE)"
          - "is_eligible == true (ERR_COMP_INELIGIBLE)"
        side_effects: []
      - from: LOCKED
        to: VERIFIED
        trigger: "system (on RevisionRequest OPEN -> ACCEPTED for the order)"
        actor: system
        preconditions: ["Comparable in LOCKED"]
        side_effects: []
      - from: DRAFT
        to: EXCLUDED
        trigger: "POST /appraisal/comparables/{id}/exclude"
        actor: Appraiser
        preconditions: ["Comparable in DRAFT | VERIFIED (ERR_INVALID_STATE)"]
        side_effects: []
      - from: VERIFIED
        to: EXCLUDED
        trigger: "POST /appraisal/comparables/{id}/exclude"
        actor: Appraiser
        preconditions: ["Comparable in DRAFT | VERIFIED (ERR_INVALID_STATE)"]
        side_effects: []

  - entity: Report
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: PENDING_QC
        trigger: "POST /appraisal/reports/{id}/submit-for-qc"
        actor: Appraiser
        preconditions:
          - "Report in DRAFT or UNDER_REVISION (ERR_INVALID_STATE)"
          - "Acting appraiser id == signing_appraiser_id (ERR_NOT_ASSIGNED_APPRAISER)"
          - ">= 3 LOCKED eligible Comparables on the order (ERR_INSUFFICIENT_LOCKED_COMPS)"
        side_effects:
          - "value_conclusion_cents recomputed via value_conclusion over the currently LOCKED eligible comps"
          - "Order DRAFTING -> QC_REVIEW (or IN_REVISION -> QC_REVIEW when report was UNDER_REVISION)"
      - from: UNDER_REVISION
        to: PENDING_QC
        trigger: "POST /appraisal/reports/{id}/submit-for-qc"
        actor: Appraiser
        preconditions:
          - "Report in DRAFT or UNDER_REVISION (ERR_INVALID_STATE)"
          - "Acting appraiser id == signing_appraiser_id (ERR_NOT_ASSIGNED_APPRAISER)"
          - ">= 3 LOCKED eligible Comparables on the order (ERR_INSUFFICIENT_LOCKED_COMPS)"
        side_effects:
          - "value_conclusion_cents recomputed via value_conclusion over the currently LOCKED eligible comps"
          - "Order IN_REVISION -> QC_REVIEW"
      - from: PENDING_QC
        to: DRAFT
        trigger: "POST /appraisal/reports/{id}/qc-fail"
        actor: QCReviewer
        preconditions:
          - "Report in PENDING_QC (ERR_INVALID_STATE)"
          - "Reviewer id != signing_appraiser_id and != co_signer_appraiser_id (ERR_SOD_REVIEWER_CONFLICT)"
        side_effects:
          - "qc_fail_count += 1"
          - "Order QC_REVIEW -> IN_REVISION when an ACCEPTED RevisionRequest exists on the order, else QC_REVIEW -> DRAFTING"
      - from: PENDING_QC
        to: QC_PASSED
        trigger: "POST /appraisal/reports/{id}/qc-pass"
        actor: QCReviewer
        preconditions:
          - "Report in PENDING_QC (ERR_INVALID_STATE)"
          - "Reviewer's Appraiser row exists, status == ACTIVE, license_level == CERTIFIED_RESIDENTIAL (ERR_LICENSE_LEVEL_INSUFFICIENT)"
          - "Reviewer id != signing_appraiser_id and != co_signer_appraiser_id (ERR_SOD_REVIEWER_CONFLICT)"
        side_effects: ["reviewer_id = acting QCReviewer user id"]
      - from: QC_PASSED
        to: DELIVERED
        trigger: "POST /appraisal/reports/{id}/deliver"
        actor: Appraiser
        preconditions:
          - "Report in QC_PASSED (ERR_INVALID_STATE)"
          - "Acting appraiser id == signing_appraiser_id (ERR_NOT_ASSIGNED_APPRAISER)"
          - "If order.requires_supervisor_cosign: co_signer_appraiser_id IS NOT NULL (ERR_SIGNATURE_COSIGN_REQUIRED)"
          - "signing appraiser license_expiry strictly after logical clock date (ERR_LICENSE_EXPIRED)"
          - "order.open_complaint_count == 0 (ERR_COMPLIANCE_HOLD_ACTIVE)"
        side_effects:
          - "Order QC_REVIEW|IN_REVISION -> DELIVERED; first_delivered_at set once"
          - "creates WorkfileRecord(snapshot_type=REPORT_PDF) and WorkfileRecord(snapshot_type=CERTIFICATION)"
          - "retention_until pinned on all non-PURGED WorkfileRecords of the order (retention_expiry)"
          - "When order was IN_REVISION: ACCEPTED RevisionRequest -> RESOLVED"
      - from: DELIVERED
        to: UNDER_REVISION
        trigger: "system (on RevisionRequest OPEN -> ACCEPTED)"
        actor: system
        preconditions: ["Report in DELIVERED"]
        side_effects: ["revision_round += 1"]

  - entity: RevisionRequest
    initial_state: OPEN
    terminal_states: [REBUTTED, SUPERSEDED, RESOLVED]
    transitions:
      - from: OPEN
        to: SUPERSEDED
        trigger: "system (a new RevisionRequest is created for the same order while this one is OPEN)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: ACCEPTED
        trigger: "POST /appraisal/revision-requests/{id}/accept"
        actor: FirmAdmin
        preconditions:
          - "RevisionRequest in OPEN (ERR_INVALID_STATE)"
          - "Order in DELIVERED (ERR_INVALID_STATE)"
        side_effects:
          - "revision_fee_charged_cents = revision fee from (client, tier) schedule effective as-of order.first_delivered_at, else retail fallback 15000"
          - "order.fee_current_cents += revision_fee_charged_cents; order.revision_fees_collected_cents += revision_fee_charged_cents"
          - "Order DELIVERED -> IN_REVISION; Report DELIVERED -> UNDER_REVISION; all LOCKED Comparables on the order -> VERIFIED"
          - "creates WorkfileRecord(snapshot_type=REVISION_CORRESPONDENCE)"
      - from: OPEN
        to: REBUTTED
        trigger: "POST /appraisal/revision-requests/{id}/rebut"
        actor: FirmAdmin
        preconditions: ["RevisionRequest in OPEN (ERR_INVALID_STATE)"]
        side_effects: ["rebuttal recorded; no fee change; order and report remain DELIVERED"]
      - from: ACCEPTED
        to: RESOLVED
        trigger: "system (on revised report delivery for the order)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: WorkfileRecord
    initial_state: ACTIVE
    terminal_states: [PURGED]
    transitions:
      - from: ACTIVE
        to: LEGAL_HOLD
        trigger: "system (on Complaint creation for the order)"
        actor: system
        preconditions: ["Record in ACTIVE"]
        side_effects: []
      - from: LEGAL_HOLD
        to: ACTIVE
        trigger: "system (on Complaint close when no other open complaints remain for the order)"
        actor: system
        preconditions: ["Record in LEGAL_HOLD", "order.open_complaint_count == 0 after the close"]
        side_effects: []
      - from: ACTIVE
        to: PURGED
        trigger: "POST /appraisal/workfile-records/{id}/purge"
        actor: ComplianceOfficer
        preconditions:
          - "Record in ACTIVE (ERR_INVALID_STATE)"
          - "retention_until IS NOT NULL and strictly before logical clock (ERR_RETENTION_NOT_EXPIRED)"
          - "order.open_complaint_count == 0 (ERR_COMPLIANCE_HOLD_ACTIVE)"
        side_effects: ["purged_at = logical clock"]

  - entity: Complaint
    initial_state: RECEIVED
    terminal_states: [CLOSED_NO_ACTION, CLOSED_SANCTIONED]
    transitions:
      - from: RECEIVED
        to: RESPONSE_DRAFTED
        trigger: "POST /appraisal/complaints/{id}/draft-response"
        actor: ComplianceOfficer
        preconditions: ["Complaint in RECEIVED (ERR_INVALID_STATE)"]
        side_effects: []
      - from: RESPONSE_DRAFTED
        to: RESPONSE_SUBMITTED
        trigger: "POST /appraisal/complaints/{id}/submit-response"
        actor: ComplianceOfficer
        preconditions:
          - "Complaint in RESPONSE_DRAFTED (ERR_INVALID_STATE)"
          - "Logical clock <= response_due_at (ERR_RESPONSE_DEADLINE_PASSED)"
        side_effects: []
      - from: RESPONSE_SUBMITTED
        to: CLOSED_NO_ACTION
        trigger: "POST /appraisal/complaints/{id}/close with outcome=NO_ACTION"
        actor: ComplianceOfficer
        preconditions: ["Complaint in RESPONSE_SUBMITTED (ERR_INVALID_STATE)"]
        side_effects:
          - "closed_at = logical clock; order.open_complaint_count -= 1"
          - "If order.open_complaint_count == 0 after decrement: all LEGAL_HOLD WorkfileRecords for the order -> ACTIVE"
      - from: RESPONSE_SUBMITTED
        to: CLOSED_SANCTIONED
        trigger: "POST /appraisal/complaints/{id}/close with outcome=SANCTIONED"
        actor: ComplianceOfficer
        preconditions: ["Complaint in RESPONSE_SUBMITTED (ERR_INVALID_STATE)"]
        side_effects:
          - "closed_at = logical clock; order.open_complaint_count -= 1; hold release as in CLOSED_NO_ACTION"
          - "respondent Appraiser.sanction_override = true (link 1)"
          - "All ACTIVE PanelMemberships of the respondent -> REMOVED (link 2a)"
          - "All orders assigned to the respondent in ASSIGNED | INSPECTION_SCHEDULED | INSPECTED | IN_ANALYSIS | DRAFTING | QC_REVIEW -> ACCEPTED with assigned_appraiser_id = null, requires_supervisor_cosign = false (link 2)"
          - "Each unassigned order's PROPOSED | CONFIRMED Appointments -> CANCELLED (link 3)"
          - "retention_until recomputed for all non-PURGED WorkfileRecords of the complaint's order (judicial variant may extend it)"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only; serially-observable semantics)
# =============================================================================
concurrency_rules:
  - rule_id: revision-create-stale-order
    parent_entity: AppraisalOrder
    write_endpoint: "POST /appraisal/orders/{id}/revision-requests"
    occ_field: "expected_order_version"
    description: |
      Creating a RevisionRequest against an AppraisalOrder whose version has
      advanced since the client last observed it is rejected with 412. This
      captures the case where another writer has just created a revision
      request (which legitimately supersedes the previously OPEN one under
      the supersede transition) and the current writer's view of the order
      is therefore stale.
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412
  - rule_id: fee-schedule-create-stale-client
    parent_entity: Client
    write_endpoint: "POST /appraisal/fee-schedules"
    occ_field: "expected_client_version"
    description: |
      Creating a FeeSchedule against a Client whose version has advanced
      since the caller last observed it is rejected with 412. This captures
      the case where another writer has just created a schedule for the same
      client (which legitimately closed the prior open-ended window) and the
      current writer's view of the client is therefore stale.
    error_id: ERR_STALE_CLIENT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: fee_quote
    trigger: "determine-scope (provisional variant, as-of scope timestamp) and accept (final variant, as-of acceptance timestamp)"
    algorithm: tiered_pricing
    formula: |
      tier = order.complexity_tier
      sched = FeeSchedule where client_id == order.client_id AND complexity_tier == tier
              AND effective_from <= as_of AND (effective_to IS NULL OR as_of < effective_to)
      base = sched ? sched.base_fee_cents : RETAIL_BASE_CENTS[tier]
      rush_bps = sched ? sched.rush_multiplier_bps : RETAIL_RUSH_BPS
      raw = base
      if order.requested_turn_days < client.default_turn_time_days:
          raw += round_half_up(base * rush_bps / 10000)
      if order.property_type == MULTI_2_4: raw += 15000
      elif order.property_type == MANUFACTURED: raw += 7500
      if order.loan_type in {FHA, VA}: raw += 5000
      fee = min(max(raw, FEE_FLOOR_CENTS), FEE_CAP_CENTS)
    input_set: "the order, its client, and the (client, tier) FeeSchedule window containing as_of; retail rate card when no window matches"
    constants:
      FEE_FLOOR_CENTS: 35000
      FEE_CAP_CENTS: 150000
      RETAIL_RUSH_BPS: 1500
      RETAIL_BASE_CENTS: { STANDARD: 45000, COMPLEX: 60000, HIGH_VALUE: 85000 }
      RETAIL_REVISION_FEE_CENTS: 15000
    precision: "integer cents; rush premium round_half_up to integer cents"
    variants:
      - name: provisional
        when: "determine-scope; as_of = logical clock at scope determination; result stored in fee_quoted_cents"
        difference: "uses the schedule window effective at scope time"
      - name: final
        when: "accept; as_of = acceptance timestamp; result stored in fee_current_cents"
        difference: "uses the schedule window effective at acceptance; differs from provisional whenever a superseding schedule took effect between the two timestamps"

  - name: tier_determination
    trigger: "determine-scope"
    algorithm: threshold
    formula: |
      if estimated_value_cents >= HIGH_VALUE_THRESHOLD_CENTS: tier = HIGH_VALUE
      elif property_type in {MULTI_2_4, MANUFACTURED}: tier = COMPLEX
      else: tier = STANDARD
      override (if supplied) must equal tier or the tier one level higher
      (STANDARD->COMPLEX, COMPLEX->HIGH_VALUE); HIGH_VALUE admits no override.
    input_set: "order.estimated_value_cents, order.property_type, optional complexity_tier_override"
    constants:
      HIGH_VALUE_THRESHOLD_CENTS: 100000000
    precision: "exact comparison; boundary: estimated_value_cents == 100000000 yields HIGH_VALUE (>=)"

  - name: comparable_adjustment
    trigger: "comparable create, PATCH (while DRAFT/VERIFIED), and verify"
    algorithm: aggregation
    formula: |
      for each line adj in [site_adjustment_cents, gla_adjustment_cents,
                            condition_adjustment_cents, other_adjustment_cents]:
          rounded_i = round_half_up(adj_i / 10000) * 10000      # per-line FIRST
      net_sum = sum(rounded_i)
      gross_sum = sum(abs(rounded_i))
      adjusted_price_cents = sale_price_cents + net_sum
      net_adjustment_pct = round_half_up(abs(net_sum) * 10000 / sale_price_cents) / 100
      gross_adjustment_pct = round_half_up(gross_sum * 10000 / sale_price_cents) / 100
      # Rounding order is PINNED: per-line rounding happens BEFORE summation.
      # Sum-then-round yields different cents (e.g. lines +6000,+6000 -> 20000
      # per-line vs 10000 sum-first) and is non-conformant.
    input_set: "the comparable's four signed adjustment lines and sale_price_cents"
    constants:
      ADJ_LINE_ROUND_CENTS: 10000
    precision: "percents: 2 decimal places, round_half_up; prices: integer cents"

  - name: comp_eligibility
    trigger: "comparable verify (recomputed on PATCH while DRAFT/VERIFIED)"
    algorithm: threshold
    formula: |
      eligible = (net_adjustment_pct <= 15.00)
                 AND (gross_adjustment_pct <= 25.00)
                 AND (distance_miles <= 2.00)
                 AND (sale_date >= logical_clock_date - 365 days)
      ineligible_reasons: NET_ADJ_EXCEEDED when net > 15.00; GROSS_ADJ_EXCEEDED
      when gross > 25.00; DISTANCE_EXCEEDED when distance_miles > 2.00;
      SALE_TOO_OLD when sale_date < logical_clock_date - 365 days.
      # Boundary: exactly 15.00 / 25.00 / 2.00 miles / exactly 365 days old => eligible (<=).
    input_set: "the comparable's computed percents, distance_miles, sale_date, and the logical clock"
    constants:
      NET_ADJ_LIMIT_PCT: 15.00
      GROSS_ADJ_LIMIT_PCT: 25.00
      DISTANCE_LIMIT_MILES: 2.00
      SALE_RECENCY_DAYS: 365
    precision: "percent comparisons at 2dp exactly as computed by comparable_adjustment"

  - name: value_conclusion
    trigger: "report creation"
    algorithm: weighted_scoring
    formula: |
      comps = all Comparables of the order with status == LOCKED and is_eligible == true
      require count(comps) >= MIN_LOCKED_COMPS (else ERR_INSUFFICIENT_LOCKED_COMPS)
      w_i = 3 when distance_miles <= 0.50; 2 when <= 1.00; else 1
      raw = sum(w_i * adjusted_price_cents_i) / sum(w_i)          # exact rational
      value_conclusion_cents = round_half_up(raw / 100000) * 100000
      # PINNED: exactly one rounding step, applied to the weighted mean;
      # per-comp rounding beyond comparable_adjustment is forbidden.
    input_set: "LOCKED eligible Comparables of the order at report creation time"
    constants:
      MIN_LOCKED_COMPS: 3
      VALUE_ROUND_CENTS: 100000
    precision: "integer cents; single final round_half_up to nearest 100000 cents"

  - name: turn_time_scorecard
    trigger: "on read of the scorecard endpoint and during assign-eligibility evaluation (recomputed after every delivery, cancellation, no-show, sanction set/clear)"
    algorithm: aggregation
    formula: |
      completed = orders with assigned_appraiser_id == appraiser AND first_delivered_at IS NOT NULL
      completed_count = count(completed)
      on_time_count = count(completed where first_delivered_at <= due_at)
      if completed_count == 0: on_time_rate = null
      else: on_time_rate = round_half_up(on_time_count * 10000 / completed_count) / 10000   # 4dp
      standing = PANEL_SUSPENDED when sanction_override
                 else when completed_count >= MIN_COMPLETED_FOR_RATING and on_time_rate < 0.75 -> PANEL_SUSPENDED
                 else when completed_count >= MIN_COMPLETED_FOR_RATING and on_time_rate < 0.90 -> PROBATION
                 else GOOD_STANDING
      # Boundary: rate exactly 0.7500 stays PROBATION (suspension requires < 0.75);
      # completed_count exactly 4 is the first rated scorecard.
      confirmed_minutes = sum over CONFIRMED appointments of (window_end - window_start) in minutes
      avg_calendar_turn_days = round_half_up(mean over completed of (first_delivered_at - accepted_at) in days * 100) / 100
    input_set: "all orders ever assigned to the appraiser (cancelled orders never entered ASSIGNED-family delivery and are excluded), all appointments of the appraiser in CONFIRMED"
    constants:
      MIN_COMPLETED_FOR_RATING: 4
      PROBATION_THRESHOLD: 0.90
      SUSPENSION_THRESHOLD: 0.75
    precision: "on_time_rate 4dp round_half_up; averages 2dp round_half_up"
    variants:
      - name: calendar_days
        when: "avg_calendar_turn_days and due_at/on-time comparisons"
        difference: "measures raw (delivered - accepted) elapsed time"
      - name: business_days
        when: "avg_business_turn_days on the scorecard"
        difference: "counts only dates d in (accept_date, deliver_date] whose weekday is Monday..Friday; same deliveries yield a smaller number (e.g. accept Sat 2026-08-01, deliver Wed 2026-08-05 -> 4 calendar vs 3 business days)"

  - name: retention_expiry
    trigger: "first report delivery (pin), complaint CLOSED_SANCTIONED (recompute), and evaluation at purge"
    algorithm: threshold
    formula: |
      base = order.first_delivered_at + 5 years                    # standard variant
      judicial = max over complaints of the order with status == CLOSED_SANCTIONED
                 of (closed_at + 2 years); null when none          # judicial variant
      retention_until = max(base, judicial) when judicial present, else base
      # Records created after first delivery (e.g. REVISION_CORRESPONDENCE) inherit
      # the order's pinned retention_until at creation. Records never delivered
      # (retention_until null) can never be purged.
    input_set: "order.first_delivered_at and all complaints of the order in CLOSED_SANCTIONED"
    constants:
      STANDARD_RETENTION_YEARS: 5
      JUDICIAL_RETENTION_YEARS: 2
    precision: "date arithmetic on ISO-8601 timestamps; year addition is calendar-year (same month/day)"
    variants:
      - name: standard
        when: "no CLOSED_SANCTIONED complaint exists for the order"
        difference: "retention_until = first_delivered_at + 5 years"
      - name: judicial
        when: "at least one complaint CLOSED_SANCTIONED"
        difference: "retention_until may extend to latest sanctioned close + 2 years when that exceeds the standard date; two otherwise-identical orders diverge in retention_until"

  - name: cancellation_fee
    trigger: "order cancel"
    algorithm: threshold
    formula: |
      if pre-cancel status in {RECEIVED, SCOPE_DETERMINED}: cancellation_fee_cents = 0
      else (ACCEPTED or ASSIGNED): cancellation_fee_cents = round_half_up(fee_current_cents * 0.5)
    input_set: "order pre-cancel status and fee_current_cents"
    constants:
      CANCELLATION_RATE: 0.5
    precision: "integer cents, round_half_up (e.g. fee 45500 -> 22750)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; first failure wins)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present; role is one of the declared roles", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role is listed for the endpoint; ownership rules: ClientUser may only act on / read resources whose client_id == X-User-ID, Appraiser only on own assignments where stated, otherwise ERR_NOT_RESOURCE_OWNER; role-not-listed -> ERR_FORBIDDEN_ROLE", error_id: ERR_FORBIDDEN_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Request body shape: required fields present, enums in declared sets, integer ranges (>0 amounts, window_end > window_start, distance_miles >= 0, rush_multiplier_bps 0..10000, default_turn_time_days >= 1, requested_turn_days >= 1)", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all" }
  - { priority: 4, category: existence, check: "Path resource ids resolve left-to-right, then body foreign-key ids (order_id, client_id, appraiser_id, respondent_appraiser_id, supervisor_id); each unresolved id yields the referenced entity's 404", error_id: ERR_ORDER_NOT_FOUND, http_status: 404, applies_to: "all endpoints with path or body resource ids (ERR_CLIENT_NOT_FOUND | ERR_APPRAISER_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_APPOINTMENT_NOT_FOUND | ERR_COMPARABLE_NOT_FOUND | ERR_REPORT_NOT_FOUND | ERR_REVISION_REQUEST_NOT_FOUND | ERR_WORKFILE_NOT_FOUND | ERR_COMPLAINT_NOT_FOUND | ERR_FEE_SCHEDULE_NOT_FOUND | ERR_PANEL_MEMBERSHIP_NOT_FOUND)" }
  - { priority: 5, category: state, check: "Target entity is in the transition's from-state (all state machines); domain-specific overlay: order must be DELIVERED|COMPLETED for complaint intake and DELIVERED for revision-request creation", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints (revision create / complaint create use ERR_ORDER_NOT_DELIVERED 409)" }
  - { priority: 6, category: state, check: "OCC: expected_<parent>_version equals the parent's current version (revision-request create, fee-schedule create)", error_id: ERR_STALE_ORDER_VERSION, http_status: 412, applies_to: "POST /appraisal/orders/{id}/revision-requests (ERR_STALE_ORDER_VERSION), POST /appraisal/fee-schedules (ERR_STALE_CLIENT_VERSION)" }
  - { priority: 7, category: business_safety, check: "USPAP / license / signature safety: license_expiry strictly after clock at assign, reactivate, deliver (ERR_LICENSE_EXPIRED); license level covers tier at assign and QC reviewer must be CERTIFIED_RESIDENTIAL (ERR_LICENSE_LEVEL_INSUFFICIENT); trainee-supervised order requires co-signature before delivery (ERR_SIGNATURE_COSIGN_REQUIRED) and co-signer must be the assignee's declared supervisor, ACTIVE, CERTIFIED_RESIDENTIAL (ERR_SUPERVISOR_SIGNATURE_MISMATCH); QC reviewer differs from signer and co-signer (ERR_SOD_REVIEWER_CONFLICT); delivery and purge and order completion blocked while open complaints exist (ERR_COMPLIANCE_HOLD_ACTIVE); workfile completeness at order completion (ERR_WORKFILE_INCOMPLETE); desktop (requires_inspection=false) only for STANDARD tier (ERR_DESKTOP_NOT_ALLOWED); ineligible comp cannot lock (ERR_COMP_INELIGIBLE)", error_id: ERR_LICENSE_EXPIRED, http_status: 422, applies_to: "assign, reactivate, deliver, co-sign, qc-pass, qc-fail, complete, purge, determine-scope, comparable lock" }
  - { priority: 8, category: business_referential, check: "Cross-entity integrity: order's client ACTIVE at create/determine-scope/accept (ERR_CLIENT_NOT_ACTIVE); assignee holds ACTIVE PanelMembership for the client (ERR_APPRAISER_NOT_ON_PANEL) and is assignable — status ACTIVE, standing != PANEL_SUSPENDED, no sanction_override (ERR_APPRAISER_NOT_ASSIGNABLE); appointment.appraiser_id == order.assigned_appraiser_id at confirm (ERR_NOT_ASSIGNED_APPRAISER); trainee's supervisor must be CERTIFIED_RESIDENTIAL at appraiser create (ERR_SUPERVISOR_NOT_CERTIFIED)", error_id: ERR_CLIENT_NOT_ACTIVE, http_status: 422, applies_to: "order create, determine-scope, accept, assign, appraiser create, appointment confirm" }
  - { priority: 9, category: business_temporal, check: "Time-window rules: appointment window_start strictly after clock at create/confirm/reschedule and clock >= window_end at complete (ERR_WINDOW_IN_PAST); appraiser buffer overlap at confirm (ERR_APPOINTMENT_OVERLAP); fee-schedule half-open window overlap per (client,tier) (ERR_SCHEDULE_WINDOW_OVERLAP); ROV creation within 90 days of first_delivered_at (ERR_ROV_WINDOW_EXPIRED); complaint response submitted by response_due_at (ERR_RESPONSE_DEADLINE_PASSED); purge only after retention_until (ERR_RETENTION_NOT_EXPIRED)", error_id: ERR_WINDOW_IN_PAST, http_status: 422, applies_to: "appointment create/confirm/reschedule/complete, fee-schedule create, revision-request create, complaint submit-response, workfile purge" }
  - { priority: 10, category: business_constraint, check: "Uniqueness / aggregate constraints: at most one ACTIVE PanelMembership per (client, appraiser) (ERR_DUPLICATE_PANEL_MEMBERSHIP); override tier at most one level up (ERR_INVALID_TIER_OVERRIDE); report creation requires >= 3 LOCKED eligible comps (ERR_INSUFFICIENT_LOCKED_COMPS); selector empty pool (ERR_NO_ELIGIBLE_APPRAISER); appraiser deactivation blocked by in-flight assignments (ERR_APPRAISER_HAS_OPEN_ASSIGNMENTS)", error_id: ERR_DUPLICATE_PANEL_MEMBERSHIP, http_status: 422, applies_to: "panel-membership create, determine-scope, report create, assign, appraiser deactivate" }
  - { priority: 11, category: business_fiscal, check: "Fee ledger bounds: fee adjustment amount_cents > 0 (schema); a WAIVER's amount_cents must not exceed the order's current fee_current_cents (ERR_FEE_WAIVER_EXCEEDS_BALANCE)", error_id: ERR_FEE_WAIVER_EXCEEDS_BALANCE, http_status: 422, applies_to: "POST /appraisal/orders/{id}/fee-adjustments" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving; default 2026-08-01T00:00:00Z) ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Sets the logical clock. Before any call the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time.", roles: [FirmAdmin], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: [] }

  # --- Client ---
  - { method: POST, path: "/appraisal/clients", description: "Create lender/AMC client", roles: [FirmAdmin], code: 201, input: [name, client_type, contact_email, default_turn_time_days], output: Client, side_effects: [] }
  - { method: GET, path: "/appraisal/clients/{id}", description: "Read client; ClientUser limited to own id", roles: [FirmAdmin, ClientUser], code: 200, input: [], output: Client, side_effects: [] }
  - { method: GET, path: "/appraisal/clients", description: "List clients", roles: [FirmAdmin], code: 200, input: ["status?"], output: "Client[]", side_effects: [] }
  - { method: POST, path: "/appraisal/clients/{id}/suspend", description: "ACTIVE -> SUSPENDED", roles: [FirmAdmin], code: 200, input: [], output: Client, side_effects: ["Client status -> SUSPENDED"] }
  - { method: POST, path: "/appraisal/clients/{id}/reactivate", description: "SUSPENDED -> ACTIVE", roles: [FirmAdmin], code: 200, input: [], output: Client, side_effects: ["Client status -> ACTIVE"] }
  - { method: POST, path: "/appraisal/clients/{id}/terminate", description: "ACTIVE|SUSPENDED -> TERMINATED; removes ACTIVE panel memberships", roles: [FirmAdmin], code: 200, input: [], output: Client, side_effects: ["PanelMemberships ACTIVE -> REMOVED"] }

  # --- Appraiser ---
  - { method: POST, path: "/appraisal/appraisers", description: "Create appraiser; supervisor_id required iff TRAINEE and must reference a CERTIFIED_RESIDENTIAL appraiser", roles: [FirmAdmin], code: 201, input: [full_name, license_level, license_number, license_expiry, "supervisor_id?"], output: Appraiser, side_effects: [] }
  - { method: GET, path: "/appraisal/appraisers/{id}", description: "Read appraiser", roles: [FirmAdmin, Appraiser, QCReviewer], code: 200, input: [], output: Appraiser, side_effects: [] }
  - { method: GET, path: "/appraisal/appraisers", description: "List appraisers with filters", roles: [FirmAdmin], code: 200, input: ["license_level?", "status?", "supervisor_id?"], output: "Appraiser[]", side_effects: [] }
  - { method: POST, path: "/appraisal/appraisers/{id}/deactivate", description: "ACTIVE -> INACTIVE; blocked by in-flight assignments", roles: [FirmAdmin], code: 200, input: [], output: Appraiser, side_effects: [] }
  - { method: POST, path: "/appraisal/appraisers/{id}/reactivate", description: "INACTIVE -> ACTIVE; requires unexpired license", roles: [FirmAdmin], code: 200, input: [], output: Appraiser, side_effects: [] }
  - { method: POST, path: "/appraisal/appraisers/{id}/clear-sanction", description: "Clears sanction_override (standing recomputes); REMOVED memberships and unassigned orders are NOT auto-restored", roles: [FirmAdmin], code: 200, input: [], output: Appraiser, side_effects: ["sanction_override = false"] }
  - { method: GET, path: "/appraisal/appraisers/{id}/scorecard", description: "Computed panel scorecard: counts, on_time_rate, turn-time averages, confirmed_minutes, standing", roles: [FirmAdmin, Appraiser], code: 200, input: [], output: { appraiser_id: string, completed_count: integer, on_time_count: integer, on_time_rate: number, avg_calendar_turn_days: number, avg_business_turn_days: number, confirmed_minutes: integer, standing: string, sanction_override: boolean }, side_effects: [] }

  # --- PanelMembership ---
  - { method: POST, path: "/appraisal/panel-memberships", description: "Add appraiser to a client's panel; one ACTIVE row per pair", roles: [FirmAdmin], code: 201, input: [client_id, appraiser_id], output: PanelMembership, side_effects: [] }
  - { method: GET, path: "/appraisal/panel-memberships/{id}", description: "Read panel membership", roles: [FirmAdmin], code: 200, input: [], output: PanelMembership, side_effects: [] }
  - { method: POST, path: "/appraisal/panel-memberships/{id}/remove", description: "ACTIVE -> REMOVED", roles: [FirmAdmin], code: 200, input: [], output: PanelMembership, side_effects: [] }
  - { method: GET, path: "/appraisal/panel-memberships", description: "List memberships with filters", roles: [FirmAdmin], code: 200, input: ["client_id?", "appraiser_id?", "status?"], output: "PanelMembership[]", side_effects: [] }

  # --- FeeSchedule ---
  - { method: POST, path: "/appraisal/fee-schedules", description: "Create fee window for (client, tier); closes prior open-ended window at the new effective_from; OCC on Client.version", roles: [FirmAdmin], code: 201, input: [client_id, complexity_tier, base_fee_cents, rush_multiplier_bps, revision_fee_cents, effective_from, "effective_to?", expected_client_version], output: FeeSchedule, side_effects: ["prior open-ended same-(client,tier) schedule effective_to := effective_from", "increments Client.version by 1"] }
  - { method: GET, path: "/appraisal/fee-schedules/{id}", description: "Read fee schedule", roles: [FirmAdmin], code: 200, input: [], output: FeeSchedule, side_effects: [] }
  - { method: GET, path: "/appraisal/fee-schedules", description: "List fee schedules with filters", roles: [FirmAdmin], code: 200, input: ["client_id?", "complexity_tier?"], output: "FeeSchedule[]", side_effects: [] }

  # --- AppraisalOrder ---
  - { method: POST, path: "/appraisal/orders", description: "Client places an appraisal order (RECEIVED); ClientUser must own client_id", roles: [ClientUser, FirmAdmin], code: 201, input: [client_id, property_address, property_type, estimated_value_cents, loan_type, requested_turn_days], output: AppraisalOrder, side_effects: [] }
  - { method: GET, path: "/appraisal/orders/{id}", description: "Read order", roles: [FirmAdmin, ClientUser, Appraiser, QCReviewer], code: 200, input: [], output: AppraisalOrder, side_effects: [] }
  - { method: GET, path: "/appraisal/orders", description: "List orders with filters", roles: [FirmAdmin], code: 200, input: ["client_id?", "assigned_appraiser_id?", "status?"], output: "AppraisalOrder[]", side_effects: [] }
  - { method: POST, path: "/appraisal/orders/{id}/determine-scope", description: "RECEIVED -> SCOPE_DETERMINED; sets tier, requires_inspection, provisional fee", roles: [FirmAdmin], code: 200, input: ["complexity_tier_override?", "requires_inspection?"], output: AppraisalOrder, side_effects: ["tier_determination", "fee_quote (provisional)", "increments AppraisalOrder.version by 1"] }
  - { method: POST, path: "/appraisal/orders/{id}/accept", description: "SCOPE_DETERMINED -> ACCEPTED; locks final fee, due_at; writes ORDER_FORM workfile", roles: [FirmAdmin], code: 200, input: [], output: AppraisalOrder, side_effects: ["fee_quote (final)", "creates WorkfileRecord(ORDER_FORM)", "increments AppraisalOrder.version by 1"] }
  - { method: POST, path: "/appraisal/orders/{id}/assign", description: "ACCEPTED -> ASSIGNED; explicit appraiser_id or deterministic panel selector", roles: [FirmAdmin], code: 200, input: ["appraiser_id?"], output: AppraisalOrder, side_effects: ["increments AppraisalOrder.version by 1"] }
  - { method: POST, path: "/appraisal/orders/{id}/cancel", description: "Cancellable from RECEIVED..ASSIGNED; cancellation fee tiered by pre-cancel state; cancels open appointments", roles: [FirmAdmin, ClientUser], code: 200, input: [reason], output: AppraisalOrder, side_effects: ["cancellation_fee", "Appointments PROPOSED|CONFIRMED -> CANCELLED", "increments AppraisalOrder.version by 1"] }
  - { method: POST, path: "/appraisal/orders/{id}/start-analysis", description: "INSPECTED -> IN_ANALYSIS (or ASSIGNED -> IN_ANALYSIS for desktop orders)", roles: [Appraiser], code: 200, input: [], output: AppraisalOrder, side_effects: ["increments AppraisalOrder.version by 1"] }
  - { method: POST, path: "/appraisal/orders/{id}/complete", description: "DELIVERED -> COMPLETED after workfile completeness, revision, and complaint gates", roles: [FirmAdmin], code: 200, input: [], output: AppraisalOrder, side_effects: ["increments AppraisalOrder.version by 1"] }
  - { method: POST, path: "/appraisal/orders/{id}/fee-adjustments", description: "SURCHARGE adds to / WAIVER subtracts from fee_current_cents (waiver bounded by fee_current); rejected ERR_INVALID_STATE when the order is CANCELLED or COMPLETED", roles: [FirmAdmin], code: 200, input: [kind, amount_cents, reason], output: AppraisalOrder, side_effects: ["fee_current_cents +=/-= amount; surcharge_total_cents / waived_total_cents accumulate", "increments AppraisalOrder.version by 1"] }

  # --- Appointment ---
  - { method: POST, path: "/appraisal/appointments", description: "Propose inspection window for an ASSIGNED/INSPECTION_SCHEDULED order", roles: [Appraiser, FirmAdmin], code: 201, input: [order_id, appraiser_id, window_start, window_end], output: Appointment, side_effects: [] }
  - { method: GET, path: "/appraisal/appointments/{id}", description: "Read appointment", roles: [FirmAdmin, Appraiser], code: 200, input: [], output: Appointment, side_effects: [] }
  - { method: GET, path: "/appraisal/appointments", description: "List appointments with filters", roles: [FirmAdmin, Appraiser], code: 200, input: ["order_id?", "appraiser_id?", "status?"], output: "Appointment[]", side_effects: [] }
  - { method: POST, path: "/appraisal/appointments/{id}/confirm", description: "PROPOSED -> CONFIRMED; buffer-overlap and assignee checks; order advances to INSPECTION_SCHEDULED", roles: [Appraiser, FirmAdmin], code: 200, input: [], output: Appointment, side_effects: ["Order ASSIGNED -> INSPECTION_SCHEDULED (first confirm)"] }
  - { method: POST, path: "/appraisal/appointments/{id}/reschedule", description: "CONFIRMED -> PROPOSED with a replacement window", roles: [Appraiser, FirmAdmin], code: 200, input: [window_start, window_end], output: Appointment, side_effects: [] }
  - { method: POST, path: "/appraisal/appointments/{id}/complete", description: "CONFIRMED -> COMPLETED once window_end has passed; order -> INSPECTED; INSPECTION_NOTES workfile", roles: [Appraiser], code: 200, input: [], output: Appointment, side_effects: ["Order INSPECTION_SCHEDULED -> INSPECTED", "creates WorkfileRecord(INSPECTION_NOTES)"] }
  - { method: POST, path: "/appraisal/appointments/{id}/no-show", description: "CONFIRMED -> NO_SHOW; order stays INSPECTION_SCHEDULED", roles: [Appraiser, FirmAdmin], code: 200, input: [], output: Appointment, side_effects: ["appraiser no_show_count += 1"] }
  - { method: POST, path: "/appraisal/appointments/{id}/cancel", description: "PROPOSED|CONFIRMED -> CANCELLED", roles: [Appraiser, FirmAdmin], code: 200, input: [], output: Appointment, side_effects: [] }

  # --- Comparable ---
  - { method: POST, path: "/appraisal/comparables", description: "Add comparable while order is IN_ANALYSIS", roles: [Appraiser], code: 201, input: [order_id, address, sale_price_cents, sale_date, distance_miles, site_adjustment_cents, gla_adjustment_cents, condition_adjustment_cents, "other_adjustment_cents?"], output: Comparable, side_effects: ["comparable_adjustment recompute"] }
  - { method: GET, path: "/appraisal/comparables/{id}", description: "Read comparable", roles: [FirmAdmin, Appraiser], code: 200, input: [], output: Comparable, side_effects: [] }
  - { method: GET, path: "/appraisal/comparables", description: "List comparables with filters", roles: [FirmAdmin, Appraiser], code: 200, input: ["order_id?", "status?"], output: "Comparable[]", side_effects: [] }
  - { method: PATCH, path: "/appraisal/comparables/{id}", description: "Edit price/distance/adjustments while DRAFT or VERIFIED; recomputes derived fields", roles: [Appraiser], code: 200, input: ["sale_price_cents?", "distance_miles?", "site_adjustment_cents?", "gla_adjustment_cents?", "condition_adjustment_cents?", "other_adjustment_cents?"], output: Comparable, side_effects: ["comparable_adjustment recompute"] }
  - { method: POST, path: "/appraisal/comparables/{id}/verify", description: "DRAFT -> VERIFIED; computes eligibility against the logical clock", roles: [Appraiser], code: 200, input: [], output: Comparable, side_effects: ["comp_eligibility evaluation"] }
  - { method: POST, path: "/appraisal/comparables/{id}/lock", description: "VERIFIED -> LOCKED; requires is_eligible", roles: [Appraiser], code: 200, input: [], output: Comparable, side_effects: [] }
  - { method: POST, path: "/appraisal/comparables/{id}/exclude", description: "DRAFT|VERIFIED -> EXCLUDED", roles: [Appraiser], code: 200, input: [], output: Comparable, side_effects: [] }

  # --- Report ---
  - { method: POST, path: "/appraisal/reports", description: "Create report for an IN_ANALYSIS order; requires >= 3 LOCKED eligible comps; computes value; order -> DRAFTING; COMP_DATA workfile", roles: [Appraiser], code: 201, input: [order_id, report_type, condition_rating], output: Report, side_effects: ["value_conclusion", "Order IN_ANALYSIS -> DRAFTING", "creates WorkfileRecord(COMP_DATA)"] }
  - { method: GET, path: "/appraisal/reports/{id}", description: "Read report", roles: [FirmAdmin, Appraiser, QCReviewer, ClientUser], code: 200, input: [], output: Report, side_effects: [] }
  - { method: GET, path: "/appraisal/reports", description: "List reports with filters", roles: [FirmAdmin], code: 200, input: ["order_id?", "status?", "signing_appraiser_id?", "co_signer_appraiser_id?", "reviewer_id?"], output: "Report[]", side_effects: [] }
  - { method: POST, path: "/appraisal/reports/{id}/submit-for-qc", description: "DRAFT|UNDER_REVISION -> PENDING_QC; order -> QC_REVIEW", roles: [Appraiser], code: 200, input: [], output: Report, side_effects: ["Order DRAFTING|IN_REVISION -> QC_REVIEW"] }
  - { method: POST, path: "/appraisal/reports/{id}/qc-pass", description: "PENDING_QC -> QC_PASSED; reviewer must be a CERTIFIED_RESIDENTIAL appraiser distinct from signer and co-signer", roles: [QCReviewer], code: 200, input: [], output: Report, side_effects: ["reviewer_id recorded"] }
  - { method: POST, path: "/appraisal/reports/{id}/qc-fail", description: "PENDING_QC -> DRAFT; order returns to DRAFTING (or IN_REVISION when an ACCEPTED revision exists)", roles: [QCReviewer], code: 200, input: [notes], output: Report, side_effects: ["qc_fail_count += 1", "Order QC_REVIEW -> DRAFTING | IN_REVISION"] }
  - { method: POST, path: "/appraisal/reports/{id}/co-sign", description: "Supervisor co-signature while PENDING_QC or QC_PASSED; required before delivery for trainee orders", roles: [Appraiser], code: 200, input: [], output: Report, side_effects: ["co_signer_appraiser_id = acting appraiser"] }
  - { method: POST, path: "/appraisal/reports/{id}/deliver", description: "QC_PASSED -> DELIVERED; signature/hold/license gates; pins retention; order -> DELIVERED; resolves ACCEPTED revision", roles: [Appraiser], code: 200, input: [], output: Report, side_effects: ["Order -> DELIVERED", "creates WorkfileRecord(REPORT_PDF) and WorkfileRecord(CERTIFICATION)", "retention_expiry pin", "RevisionRequest ACCEPTED -> RESOLVED"] }

  # --- RevisionRequest ---
  - { method: POST, path: "/appraisal/orders/{id}/revision-requests", description: "Open a revision/ROV on a DELIVERED order; supersedes any OPEN request; OCC on AppraisalOrder.version", roles: [ClientUser, FirmAdmin], code: 201, input: [kind, detail, "submitted_value_cents?", expected_order_version], output: RevisionRequest, side_effects: ["prior OPEN request -> SUPERSEDED", "increments AppraisalOrder.version by 1"] }
  - { method: GET, path: "/appraisal/revision-requests/{id}", description: "Read revision request", roles: [FirmAdmin, ClientUser, Appraiser], code: 200, input: [], output: RevisionRequest, side_effects: [] }
  - { method: GET, path: "/appraisal/revision-requests", description: "List revision requests with filters", roles: [FirmAdmin, ClientUser], code: 200, input: ["order_id?", "status?"], output: "RevisionRequest[]", side_effects: [] }
  - { method: POST, path: "/appraisal/revision-requests/{id}/accept", description: "OPEN -> ACCEPTED; charges revision fee; order -> IN_REVISION; report -> UNDER_REVISION; comps unlock; REVISION_CORRESPONDENCE workfile", roles: [FirmAdmin], code: 200, input: [], output: RevisionRequest, side_effects: ["order fee += revision fee", "Order DELIVERED -> IN_REVISION", "Report DELIVERED -> UNDER_REVISION", "LOCKED Comparables -> VERIFIED", "creates WorkfileRecord(REVISION_CORRESPONDENCE)"] }
  - { method: POST, path: "/appraisal/revision-requests/{id}/rebut", description: "OPEN -> REBUTTED with reasoned rebuttal; no fee change", roles: [FirmAdmin], code: 200, input: [rebuttal], output: RevisionRequest, side_effects: [] }

  # --- WorkfileRecord ---
  - { method: POST, path: "/appraisal/workfile-records", description: "Manually add a workfile record to a non-terminal order", roles: [FirmAdmin], code: 201, input: [order_id, snapshot_type], output: WorkfileRecord, side_effects: [] }
  - { method: GET, path: "/appraisal/workfile-records/{id}", description: "Read workfile record", roles: [FirmAdmin, ComplianceOfficer], code: 200, input: [], output: WorkfileRecord, side_effects: [] }
  - { method: GET, path: "/appraisal/workfile-records", description: "List workfile records with filters", roles: [FirmAdmin, ComplianceOfficer], code: 200, input: ["order_id?", "snapshot_type?", "status?"], output: "WorkfileRecord[]", side_effects: [] }
  - { method: POST, path: "/appraisal/workfile-records/{id}/purge", description: "ACTIVE -> PURGED after retention expiry and with no open complaints", roles: [ComplianceOfficer], code: 200, input: [], output: WorkfileRecord, side_effects: ["purged_at set"] }

  # --- Complaint ---
  - { method: POST, path: "/appraisal/complaints", description: "Intake of a board complaint on a DELIVERED/COMPLETED order; sets legal hold on the order's ACTIVE workfiles", roles: [FirmAdmin, ComplianceOfficer], code: 201, input: [order_id, respondent_appraiser_id, description], output: Complaint, side_effects: ["WorkfileRecords ACTIVE -> LEGAL_HOLD", "order.open_complaint_count += 1", "response_due_at = received_at + 21 days"] }
  - { method: GET, path: "/appraisal/complaints/{id}", description: "Read complaint", roles: [FirmAdmin, ComplianceOfficer], code: 200, input: [], output: Complaint, side_effects: [] }
  - { method: GET, path: "/appraisal/complaints", description: "List complaints with filters", roles: [FirmAdmin, ComplianceOfficer], code: 200, input: ["order_id?", "respondent_appraiser_id?", "status?"], output: "Complaint[]", side_effects: [] }
  - { method: POST, path: "/appraisal/complaints/{id}/draft-response", description: "RECEIVED -> RESPONSE_DRAFTED", roles: [ComplianceOfficer], code: 200, input: [response_text], output: Complaint, side_effects: [] }
  - { method: POST, path: "/appraisal/complaints/{id}/submit-response", description: "RESPONSE_DRAFTED -> RESPONSE_SUBMITTED; hard 21-day deadline", roles: [ComplianceOfficer], code: 200, input: [], output: Complaint, side_effects: [] }
  - { method: POST, path: "/appraisal/complaints/{id}/close", description: "RESPONSE_SUBMITTED -> CLOSED_NO_ACTION | CLOSED_SANCTIONED; sanction cascade on respondent", roles: [ComplianceOfficer], code: 200, input: [outcome], output: Complaint, side_effects: ["open_complaint_count -= 1", "hold release when count reaches 0", "SANCTIONED: appraiser sanction_override, memberships REMOVED, in-flight orders unassigned, their appointments CANCELLED, retention recompute"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/blank X-User-Role or X-User-ID, or unknown role" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not listed for the endpoint" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Role permitted but the caller does not own the resource (ClientUser foreign client_id; Appraiser not the assignee where required)" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, unknown enum, or numeric/shape rule violated" }
  - { id: ERR_CLIENT_NOT_FOUND, http: 404, condition: "client id does not resolve" }
  - { id: ERR_APPRAISER_NOT_FOUND, http: 404, condition: "appraiser id does not resolve" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "order id does not resolve" }
  - { id: ERR_APPOINTMENT_NOT_FOUND, http: 404, condition: "appointment id does not resolve" }
  - { id: ERR_COMPARABLE_NOT_FOUND, http: 404, condition: "comparable id does not resolve" }
  - { id: ERR_REPORT_NOT_FOUND, http: 404, condition: "report id does not resolve" }
  - { id: ERR_REVISION_REQUEST_NOT_FOUND, http: 404, condition: "revision request id does not resolve" }
  - { id: ERR_WORKFILE_NOT_FOUND, http: 404, condition: "workfile record id does not resolve" }
  - { id: ERR_COMPLAINT_NOT_FOUND, http: 404, condition: "complaint id does not resolve" }
  - { id: ERR_FEE_SCHEDULE_NOT_FOUND, http: 404, condition: "fee schedule id does not resolve" }
  - { id: ERR_PANEL_MEMBERSHIP_NOT_FOUND, http: 404, condition: "panel membership id does not resolve" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity not in the transition's required from-state" }
  - { id: ERR_ORDER_NOT_DELIVERED, http: 409, condition: "Revision-request or complaint creation requires order DELIVERED (complaints also allow COMPLETED)" }
  - { id: ERR_STALE_ORDER_VERSION, http: 412, condition: "expected_order_version != current AppraisalOrder.version on revision-request create" }
  - { id: ERR_STALE_CLIENT_VERSION, http: 412, condition: "expected_client_version != current Client.version on fee-schedule create" }
  - { id: ERR_CLIENT_NOT_ACTIVE, http: 422, condition: "Client SUSPENDED/TERMINATED at order create, determine-scope, or accept" }
  - { id: ERR_APPRAISER_NOT_ON_PANEL, http: 422, condition: "No ACTIVE PanelMembership for (order.client_id, appraiser) at assign" }
  - { id: ERR_NOT_ASSIGNED_APPRAISER, http: 422, condition: "Acting/referenced appraiser is not the order's assigned_appraiser_id" }
  - { id: ERR_SUPERVISOR_NOT_CERTIFIED, http: 422, condition: "Trainee's supervisor_id does not reference a CERTIFIED_RESIDENTIAL appraiser" }
  - { id: ERR_LICENSE_EXPIRED, http: 422, condition: "license_expiry not strictly after the logical clock date (assign, reactivate, deliver)" }
  - { id: ERR_LICENSE_LEVEL_INSUFFICIENT, http: 422, condition: "License level below tier requirement at assign, or QC reviewer not CERTIFIED_RESIDENTIAL" }
  - { id: ERR_SOD_REVIEWER_CONFLICT, http: 422, condition: "QC reviewer equals the report's signing appraiser or co-signer (segregation of duties)" }
  - { id: ERR_SIGNATURE_COSIGN_REQUIRED, http: 422, condition: "Delivery of a trainee-performed order without a supervisor co-signature" }
  - { id: ERR_SUPERVISOR_SIGNATURE_MISMATCH, http: 422, condition: "Co-signer is not the assignee's declared supervisor, or not ACTIVE CERTIFIED_RESIDENTIAL" }
  - { id: ERR_COMPLIANCE_HOLD_ACTIVE, http: 422, condition: "Open complaint (legal hold) blocks delivery, order completion, or workfile purge" }
  - { id: ERR_WORKFILE_INCOMPLETE, http: 422, condition: "Order completion without the required workfile snapshot set" }
  - { id: ERR_DESKTOP_NOT_ALLOWED, http: 422, condition: "requires_inspection=false requested for a non-STANDARD tier" }
  - { id: ERR_WINDOW_IN_PAST, http: 422, condition: "window_start not after logical clock (create/confirm/reschedule), or clock before window_end at complete" }
  - { id: ERR_APPOINTMENT_OVERLAP, http: 422, condition: "Buffered window [start-30m, end+30m) intersects another CONFIRMED appointment of the same appraiser" }
  - { id: ERR_SCHEDULE_WINDOW_OVERLAP, http: 422, condition: "New half-open [effective_from, effective_to) window overlaps an existing window for the same (client, tier)" }
  - { id: ERR_ROV_WINDOW_EXPIRED, http: 422, condition: "RECONSIDERATION_OF_VALUE created more than 90 days after first_delivered_at" }
  - { id: ERR_RESPONSE_DEADLINE_PASSED, http: 422, condition: "submit-response after response_due_at" }
  - { id: ERR_RETENTION_NOT_EXPIRED, http: 422, condition: "Purge before retention_until, or retention_until still null (order never delivered)" }
  - { id: ERR_DUPLICATE_PANEL_MEMBERSHIP, http: 422, condition: "ACTIVE membership already exists for the (client, appraiser) pair" }
  - { id: ERR_INVALID_TIER_OVERRIDE, http: 422, condition: "complexity_tier_override is neither the computed tier nor one level above it" }
  - { id: ERR_INSUFFICIENT_LOCKED_COMPS, http: 422, condition: "Report creation with fewer than 3 LOCKED eligible comparables" }
  - { id: ERR_NO_ELIGIBLE_APPRAISER, http: 422, condition: "Panel selector candidate set is empty" }
  - { id: ERR_FEE_WAIVER_EXCEEDS_BALANCE, http: 422, condition: "WAIVER amount_cents exceeds the order's current fee_current_cents" }
  - { id: ERR_APPRAISER_HAS_OPEN_ASSIGNMENTS, http: 422, condition: "Deactivation while the appraiser has orders in ASSIGNED..QC_REVIEW" }
  - { id: ERR_COMP_INELIGIBLE, http: 422, condition: "Lock attempted on a comparable whose is_eligible is false" }
  - { id: ERR_APPRAISER_NOT_ASSIGNABLE, http: 422, condition: "Assign target is INACTIVE, PANEL_SUSPENDED, or under sanction_override" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: FirmAdmin
    description: "Firm operations staff: clients, appraisers, fee schedules, panels, order acceptance/assignment/cancellation/completion, fee adjustments, workfile uploads, complaint intake, logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /appraisal/clients* (create/suspend/reactivate/terminate)"
      - "POST /appraisal/appraisers* (create/deactivate/reactivate/clear-sanction)"
      - "POST /appraisal/panel-memberships*"
      - "POST /appraisal/fee-schedules"
      - "POST /appraisal/orders/{id}/determine-scope | accept | assign | complete | fee-adjustments"
      - "POST /appraisal/revision-requests/{id}/accept | rebut"
      - "POST /appraisal/workfile-records"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "order create/cancel, appointment create/confirm/reschedule/no-show/cancel, complaint intake, most GET reads"
  - name: ClientUser
    description: "Lender/AMC portal user; acts only on its own client's resources"
    identity: "entity_backed:Client"
    exclusive_operations: []
    shared_operations:
      - "POST /appraisal/orders (client_id must equal X-User-ID)"
      - "POST /appraisal/orders/{id}/cancel (own orders, RECEIVED|SCOPE_DETERMINED only)"
      - "POST /appraisal/orders/{id}/revision-requests (own orders)"
      - "GET own client/orders/reports/revision-requests"
  - name: Appraiser
    description: "Staff appraiser performing assigned orders: scheduling, inspection, comps, drafting, delivery; supervisors co-sign trainee reports"
    identity: "entity_backed:Appraiser"
    exclusive_operations:
      - "POST /appraisal/orders/{id}/start-analysis"
      - "POST /appraisal/appointments/{id}/complete"
      - "POST /appraisal/comparables* (create/patch/verify/lock/exclude)"
      - "POST /appraisal/reports (create), submit-for-qc, co-sign, deliver"
    shared_operations:
      - "appointment create/confirm/reschedule/no-show/cancel, GET own appraiser row and scorecard"
  - name: QCReviewer
    description: "Certified residential appraiser acting as quality-control reviewer; segregation of duties forbids reviewing a report signed or co-signed by the same appraiser id"
    identity: "entity_backed:Appraiser"
    exclusive_operations:
      - "POST /appraisal/reports/{id}/qc-pass"
      - "POST /appraisal/reports/{id}/qc-fail"
    shared_operations:
      - "GET reports and orders"
  - name: ComplianceOfficer
    description: "Compliance staff: complaint response workflow, workfile retention purge"
    identity: "opaque"
    exclusive_operations:
      - "POST /appraisal/complaints/{id}/draft-response | submit-response | close"
      - "POST /appraisal/workfile-records/{id}/purge"
    shared_operations:
      - "complaint intake, workfile/complaint GET reads"
