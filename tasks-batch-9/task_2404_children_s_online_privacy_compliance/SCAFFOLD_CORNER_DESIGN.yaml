            - call: "POST /safe-harbor-assessments/${asmt_id}/status"
              payload: { to_status: "REMEDIATION_REQUIRED", remediation_note: "four open findings" }
              as: SafeHarborCertifier
              as_user_id: "certifier-1"
              captures: { round_1: $.data.remediation_round }
            - call: "POST /safe-harbor-assessments/${asmt_id}/status"
              payload: { to_status: "SUBMITTED", findings_open_count: 2 }
              as: SafeHarborAssessor
              as_user_id: "assessor-1"
            - call: "POST /safe-harbor-assessments/${asmt_id}/status"
              payload: { to_status: "REMEDIATION_REQUIRED", remediation_note: "two findings still open" }
              as: SafeHarborCertifier
              as_user_id: "certifier-1"
              captures: { round_2: $.data.remediation_round }
          trigger:
            - call: "POST /safe-harbor-assessments/${asmt_id}/status"
              payload: { to_status: "FAILED", remediation_note: "remediation exhausted" }
              as: SafeHarborCertifier
              as_user_id: "certifier-1"
              captures: { failed_status: $.data.status, failed_expires: $.data.expires_at, failed_certified: $.data.certified_at }
            - call: "GET /online-services/${svc_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { sh_status: $.data.safe_harbor_status, sh_expiry: $.data.safe_harbor_expires_at, posture: $.data.compliance_posture }
            - call: "POST /safe-harbor-assessments/${asmt_id}/certify"
              payload: {}
              as: SafeHarborCertifier
              as_user_id: "certifier-2"
              captures: { err_certify: $.data.error_id }
            - call: "POST /safe-harbor-assessments/${asmt_id}/status"
              payload: { to_status: "SUBMITTED", findings_open_count: 0 }
              as: SafeHarborAssessor
              as_user_id: "assessor-1"
              captures: { err_resubmit: $.data.error_id }
          assert:
            - "${round_1} == 1 and ${round_2} == 2 (FAILED is unreachable until remediation_round >= MAX_REMEDIATION_ROUNDS 2)"
            - "${failed_status} == FAILED and ${failed_certified} == null and ${failed_expires} == null"
            - "${sh_status} == ASSESSMENT_DUE and ${sh_expiry} == null (a FAILED assessment is enrolment without certification)"
            - "${posture} == OPEN (only safe_harbor_status LAPSED restricts the posture, and LAPSED needs a prior certification to expire)"
            - "${err_certify} == ERR_INVALID_STATE with HTTP 409 and ${err_resubmit} == ERR_INVALID_STATE with HTTP 409"
            - "SafeHarborAssessment.${asmt_id}.findings_open_count == 2 (the refused re-submission did not overwrite it)"

      - name: assessment_submission_under_a_non_required_program_is_refused
        claim_type: precondition_enforcement
        grounds:
          - state_machines.SafeHarborAssessment.DRAFT_to_SUBMITTED
          - validations[priority=116]
          - errors[ERR_ASSESSMENT_NOT_REQUIRED]
          - entities.SafeHarborProgram.fields.annual_assessment_required
        distinguishing_aspect: "A program that does not require an annual assessment still accepts enrolment — the DRAFT row exists and moves the service to ASSESSMENT_DUE — but the DRAFT -> SUBMITTED edge reads the program's annual_assessment_required flag and refuses with ERR_ASSESSMENT_NOT_REQUIRED (409), leaving the row in DRAFT."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one service."
            - "Program with regulator_approved true but annual_assessment_required false."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /online-services"
              payload: { name: "No Annual Assessment Kids", operator_organization: "No Annual Media", service_category: "GAME", subject_matter_code: "FAMILY_MIXED" }
              as: ComplianceOfficer
              captures: { svc_id: $.data.id }
            - call: "POST /safe-harbor-programs"
              payload: { program_name: "Lifetime Seal Program", regulator_approved: true, annual_assessment_required: false, assessment_validity_days: 365, assessment_grace_days: 30 }
              as: ComplianceOfficer
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /safe-harbor-assessments"
              payload: { service_id: "${svc_id}", program_id: "${prog_id}", assessment_year: 2026 }
              as: SafeHarborAssessor
              as_user_id: "assessor-2"
              captures: { asmt_id: $.data.id, asmt_status: $.data.status, findings: $.data.findings_open_count }
            - call: "GET /online-services/${svc_id}"
              payload: {}
              as: SafeHarborAssessor
              captures: { sh_after_enrol: $.data.safe_harbor_status }
            - call: "POST /safe-harbor-assessments/${asmt_id}/status"
              payload: { to_status: "SUBMITTED", findings_open_count: 0 }
              as: SafeHarborAssessor
              as_user_id: "assessor-2"
              captures: { err_not_required: $.data.error_id }
            - call: "GET /safe-harbor-assessments/${asmt_id}"
              payload: {}
              as: SafeHarborCertifier
              captures: { status_after: $.data.status }
            - call: "POST /safe-harbor-assessments/${asmt_id}/certify"
              payload: {}
              as: SafeHarborCertifier
              as_user_id: "certifier-3"
              captures: { err_certify_from_draft: $.data.error_id }
          assert:
            - "${asmt_status} == DRAFT and ${findings} == 0 and ${sh_after_enrol} == ASSESSMENT_DUE"
            - "${err_not_required} == ERR_ASSESSMENT_NOT_REQUIRED with HTTP 409"
            - "${status_after} == DRAFT (the refused submission stored nothing)"
            - "${err_certify_from_draft} == ERR_INVALID_STATE with HTTP 409 (certification is declared only from SUBMITTED, so the program flag cannot be bypassed by skipping submission)"

      - name: service_parallel_axes_change_independently
        claim_type: valid_transition
        grounds:
          - state_machines.OnlineService
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: non_linear_state_machine / service_parallel_axes_move_independently
          rationale: "The two-axis independence (determination_status moving backwards while compliance_posture stays put, and the override moving the posture with the determination untouched) is asserted end-to-end by the named §1.8 instance."

      - name: age_screen_rejection_revision_loop_is_bounded
        claim_type: idempotency
        grounds:
          - state_machines.AgeScreen.REJECTED_to_DRAFT
          - domain_constants.MAX_SCREEN_REVISION_ROUNDS
        excluded_because:
          difficulty_instance: non_linear_state_machine / age_screen_rejection_revision_cycle_exhausts_and_locks
          rationale: "The cyclic REJECTED -> DRAFT loop, its per-transition role restriction and its ERR_SCREEN_REVISIONS_EXHAUSTED bound are asserted by the named §1.8 instance."

      - name: deletion_fulfilment_cascades_across_six_links
        claim_type: side_effect_execution
        grounds:
          - state_machines.ParentalRightsRequest.VERIFIED_to_FULFILLED
          - state_machines.ThirdPartyIntegration.APPROVED_to_AUDIT_PENDING
        excluded_because:
          difficulty_instance: transitive_cascade / deletion_fulfilment_six_link_cascade_unfreezes_to_restricted
          rationale: "Every link of the DELETE cascade — record disposal, consent revocation, integration re-audit, exposure and posture recomputation — is asserted link-by-link by the named §1.8 instance."

      - name: consent_delivery_guarded_by_the_notice_entity_state
        claim_type: precondition_enforcement
        grounds:
          - state_machines.ConsentRequest.INITIATED_to_NOTICE_DELIVERED
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / direct_notice_delivery_gated_by_notice_publication_and_channel
          rationale: "The guarded transition (delivery allowed only when the referenced ParentalNotice is PUBLISHED, plus the channel compatibility clause) is asserted by the named §1.8 instance."

  # ===========================================================================
  - section: calculations
    instances:
      - name: neutrality_violation_codes_accumulate_in_declared_order
        claim_type: correct_result
        grounds:
          - calculations.age_screen_neutrality
          - validations[priority=88]
          - errors[ERR_AGE_SCREEN_NOT_NEUTRAL]
        distinguishing_aspect: "All four neutrality codes are emitted in the declared order [PREFILLED_AGE, RETRY_ALLOWED, OUTCOME_NOT_PERSISTED, UNVERIFIED_INHERIT], each from its own guard — and UNVERIFIED_INHERIT is conditional on mechanism == ACCOUNT_AGE_INHERIT, so an otherwise identical NEUTRAL_DOB_ENTRY screen with inherited_from_verified_account false emits only three. A screen carrying any code cannot be activated."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one MIXED_AUDIENCE service."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /online-services"
              payload: { name: "Neutrality Kids", operator_organization: "Neutral Media", service_category: "GAME", subject_matter_code: "FAMILY_MIXED" }
              as: ComplianceOfficer
              captures: { svc_id: $.data.id }
            - call: "POST /determination-evidence"
              payload: { service_id: "${svc_id}", evidence_kind: "DESIGN_FACTOR", factor_code: "SUBJECT_MATTER", rating: "MODERATE" }
              as: ComplianceOfficer
            - call: "POST /online-services/${svc_id}/determination"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /age-screens"
              payload: { service_id: "${svc_id}", mechanism: "ACCOUNT_AGE_INHERIT", default_prefilled_age: 8, retry_allowed_on_fail: true, outcome_session_persisted: false, inherited_from_verified_account: false }
              as: PrivacyEngineer
              captures: { bad_screen: $.data.id, bad_codes: $.data.neutrality_violation_codes }
            - call: "POST /age-screens/${bad_screen}/status"
              payload: { to_status: "IN_REVIEW" }
              as: PrivacyEngineer
              captures: { codes_at_review: $.data.neutrality_violation_codes }
            - call: "POST /age-screens/${bad_screen}/status"
              payload: { to_status: "ACTIVE" }
              as: ComplianceOfficer
              captures: { err_not_neutral: $.data.error_id }
            - call: "POST /age-screens"
              payload: { service_id: "${svc_id}", mechanism: "NEUTRAL_DOB_ENTRY", retry_allowed_on_fail: true, outcome_session_persisted: false, inherited_from_verified_account: false }
              as: PrivacyEngineer
              captures: { three_codes: $.data.neutrality_violation_codes }
            - call: "POST /age-screens"
              payload: { service_id: "${svc_id}", mechanism: "NEUTRAL_DOB_ENTRY", retry_allowed_on_fail: false, outcome_session_persisted: true }
              as: PrivacyEngineer
              captures: { clean_screen: $.data.id, clean_codes: $.data.neutrality_violation_codes }
            - call: "POST /age-screens/${clean_screen}/status"
              payload: { to_status: "IN_REVIEW" }
              as: PrivacyEngineer
            - call: "POST /age-screens/${clean_screen}/status"
              payload: { to_status: "ACTIVE" }
              as: ComplianceOfficer
              captures: { clean_status: $.data.status, clean_activated: $.data.activated_at }
          assert:
            - "${bad_codes} == [PREFILLED_AGE, RETRY_ALLOWED, OUTCOME_NOT_PERSISTED, UNVERIFIED_INHERIT] in exactly that order"
            - "${codes_at_review} == [PREFILLED_AGE, RETRY_ALLOWED, OUTCOME_NOT_PERSISTED, UNVERIFIED_INHERIT] (recomputed on IN_REVIEW, unchanged)"
            - "${err_not_neutral} == ERR_AGE_SCREEN_NOT_NEUTRAL with HTTP 422 and AgeScreen.${bad_screen}.status == IN_REVIEW"
            - "${three_codes} == [RETRY_ALLOWED, OUTCOME_NOT_PERSISTED]: default_prefilled_age was omitted so PREFILLED_AGE is absent, and UNVERIFIED_INHERIT is absent even though inherited_from_verified_account is false, because mechanism != ACCOUNT_AGE_INHERIT"
            - "${clean_codes} == [] and ${clean_status} == ACTIVE and ${clean_activated} == 2026-08-01T00:00:00Z"

      - name: missing_notice_content_keys_are_listed_in_declared_order_and_block_publish
        claim_type: correct_result
        grounds:
          - calculations.notice_content_completeness
          - validations[priority=112]
          - errors[ERR_NOTICE_CONTENT_INCOMPLETE]
        distinguishing_aspect: "missing_content_keys follows the declared REQUIRED_NOTICE_CONTENT_KEYS order rather than the request's input order, ignores duplicates and ignores unrecognised extra keys; a non-empty list makes publication ERR_NOTICE_CONTENT_INCOMPLETE (422) while the draft itself is still created (201)."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one service."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /online-services"
              payload: { name: "Notice Completeness Kids", operator_organization: "Completeness Media", service_category: "EDUCATION_APP", subject_matter_code: "CHILD_EDUCATION" }
              as: ComplianceOfficer
              captures: { svc_id: $.data.id }
            - call: "GET /online-services/${svc_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { sv1: $.data.version }
          trigger:
            - call: "POST /parental-notices"
              payload: { service_id: "${svc_id}", notice_label: "Partial notice", delivery_channel: "EMAIL", content_keys: ["RETENTION_AND_DISPOSAL", "USE_PURPOSES", "USE_PURPOSES", "ELEMENTS_COLLECTED"], expected_service_version: "${sv1}" }
              as: ComplianceOfficer
              captures: { notice_partial: $.data.id, missing: $.data.missing_content_keys, partial_status: $.data.status }
            - call: "POST /parental-notices/${notice_partial}/publish"
              payload: {}
              as: ComplianceOfficer
              captures: { err_incomplete: $.data.error_id }
            - call: "GET /online-services/${svc_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { sv2: $.data.version }
            - call: "POST /parental-notices"
              payload: { service_id: "${svc_id}", notice_label: "Full notice", delivery_channel: "EMAIL", content_keys: ["RETENTION_AND_DISPOSAL", "NO_CONDITIONING_OF_PARTICIPATION", "PARENTAL_RIGHTS", "THIRD_PARTY_DISCLOSURE", "USE_PURPOSES", "ELEMENTS_COLLECTED", "OPERATOR_IDENTITY_CONTACT"], expected_service_version: "${sv2}" }
              as: ComplianceOfficer
              captures: { notice_full: $.data.id, missing_full: $.data.missing_content_keys }
            - call: "POST /parental-notices/${notice_full}/publish"
              payload: {}
              as: ComplianceOfficer
              captures: { full_status: $.data.status, full_published_at: $.data.published_at }
          assert:
            - "${partial_status} == DRAFT and the draft was created with HTTP 201 (incompleteness is not a creation-time error)"
            - "${missing} == [OPERATOR_IDENTITY_CONTACT, THIRD_PARTY_DISCLOSURE, PARENTAL_RIGHTS, NO_CONDITIONING_OF_PARTICIPATION] — declared order, not input order, and the duplicated USE_PURPOSES counts once"
            - "${err_incomplete} == ERR_NOTICE_CONTENT_INCOMPLETE with HTTP 422 and ParentalNotice.${notice_partial}.status is still DRAFT"
            - "${missing_full} == [] and ${full_status} == PUBLISHED and ${full_published_at} == 2026-08-01T00:00:00Z (the reverse-ordered input still produces an empty set difference)"

      - name: email_plus_grant_requires_its_secondary_confirmation_code
        claim_type: constants_applied
        grounds:
          - calculations.required_consent_tier
          - validations[priority=90]
          - errors[ERR_EMAIL_PLUS_CONFIRMATION_MISSING]
          - entities.ConsentRequest.fields.secondary_confirmation_received
        distinguishing_aspect: "EMAIL_PLUS sits at METHOD_ASSURANCE_TIER 1, which is high enough for a PARTICIPATION_CORE-only request (required tier 1), so the tier clause passes — and the grant is still refused by the separate EMAIL_PLUS clause until secondary_confirmation_code is supplied, proving the 'plus' step is an independent gate rather than a tier consequence."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; MIXED_AUDIENCE service with a PUBLISHED notice."
            - "Consent P1 for guardian.s@x.test / child-605 with consent_method EMAIL_PLUS and intended_uses [PARTICIPATION_CORE], driven to PENDING_VERIFICATION."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /online-services"
              payload: { name: "Email Plus Kids", operator_organization: "Plus Media", service_category: "GAME", subject_matter_code: "FAMILY_MIXED" }
              as: ComplianceOfficer
              captures: { svc_id: $.data.id }
            - call: "POST /determination-evidence"
              payload: { service_id: "${svc_id}", evidence_kind: "DESIGN_FACTOR", factor_code: "SUBJECT_MATTER", rating: "MODERATE" }
              as: ComplianceOfficer
            - call: "POST /online-services/${svc_id}/determination"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /online-services/${svc_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { sv1: $.data.version }
            - call: "POST /parental-notices"
              payload: { service_id: "${svc_id}", notice_label: "Notice r1", delivery_channel: "EMAIL", content_keys: ["OPERATOR_IDENTITY_CONTACT", "ELEMENTS_COLLECTED", "USE_PURPOSES", "THIRD_PARTY_DISCLOSURE", "PARENTAL_RIGHTS", "NO_CONDITIONING_OF_PARTICIPATION", "RETENTION_AND_DISPOSAL"], expected_service_version: "${sv1}" }
              as: ComplianceOfficer
              captures: { notice_id: $.data.id }
            - call: "POST /parental-notices/${notice_id}/publish"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /online-services/${svc_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { sv2: $.data.version }
            - call: "POST /consent-requests"
              payload: { service_id: "${svc_id}", notice_id: "${notice_id}", parent_email: "guardian.s@x.test", child_pseudonym: "child-605", intended_uses: ["PARTICIPATION_CORE"], consent_method: "EMAIL_PLUS", expected_service_version: "${sv2}" }
              as: ComplianceOfficer
              captures: { consent_p1: $.data.id, method_tier: $.data.method_assurance_tier, required_tier: $.data.required_tier_at_creation, sec_initial: $.data.secondary_confirmation_received }
            - call: "POST /consent-requests/${consent_p1}/status"
              payload: { to_status: "NOTICE_DELIVERED" }
              as: ComplianceOfficer
            - call: "POST /consent-requests/${consent_p1}/status"
              payload: { to_status: "PENDING_VERIFICATION" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /consent-requests/${consent_p1}/status"
              payload: { to_status: "GRANTED", verification_evidence_code: "EMAIL-S-1" }
              as: ComplianceOfficer
              captures: { err_confirmation: $.data.error_id }
            - call: "GET /consent-requests/${consent_p1}"
              payload: {}
              as: ComplianceOfficer
              captures: { status_after_refusal: $.data.status, sec_after_refusal: $.data.secondary_confirmation_received }
            - call: "POST /consent-requests/${consent_p1}/status"
              payload: { to_status: "GRANTED", verification_evidence_code: "EMAIL-S-1", secondary_confirmation_code: "SEC-S-1" }
              as: ComplianceOfficer
              captures: { granted_status: $.data.status, sec_final: $.data.secondary_confirmation_received, evidence_code: $.data.verification_evidence_code, granted_at: $.data.granted_at }
            - call: "GET /online-services/${svc_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { active_count: $.data.active_consent_count, disclosure_count: $.data.granted_disclosure_consent_count }
          assert:
            - "${method_tier} == 1 and ${required_tier} == 1 (USE_TIER[PARTICIPATION_CORE] 1, no approved persistent-identifier integration to bump it) and ${sec_initial} == false"
            - "${err_confirmation} == ERR_EMAIL_PLUS_CONFIRMATION_MISSING with HTTP 422 — not ERR_CONSENT_METHOD_TIER_INSUFFICIENT, because clause 2 of priority 90 is satisfied at tier 1 >= 1"
            - "${status_after_refusal} == PENDING_VERIFICATION and ${sec_after_refusal} == false"
            - "${granted_status} == GRANTED, ${sec_final} == true, ${evidence_code} == EMAIL-S-1, ${granted_at} == 2026-08-01T00:00:00Z"
            - "${active_count} == 1 and ${disclosure_count} == 0 (PARTICIPATION_CORE is not a disclosure use)"

      - name: third_party_disclosure_use_pins_tier_three_and_rejects_tier_one_methods
        claim_type: constants_applied
        grounds:
          - calculations.required_consent_tier
          - validations[priority=90]
          - errors[ERR_CONSENT_METHOD_TIER_INSUFFICIENT]
          - entities.OnlineService.fields.granted_disclosure_consent_count
        distinguishing_aspect: "required_tier_at_creation is max(USE_TIER) over the whole intended_uses array, so adding THIRD_PARTY_DISCLOSURE to a PARTICIPATION_CORE request raises the bar from 1 to 3: the same EMAIL_PLUS method that was sufficient for a core-only request now fails, GOVT_ID_MATCH at tier 3 succeeds, and only the disclosure-bearing grant moves granted_disclosure_consent_count."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; MIXED_AUDIENCE service with a PUBLISHED notice and no third-party integrations."
            - "Consent T1 (EMAIL_PLUS) and consent T2 (GOVT_ID_MATCH), both with intended_uses [PARTICIPATION_CORE, THIRD_PARTY_DISCLOSURE], for two different children."
          setup_api_calls:
