          trigger:
            - { call: "POST /ltl/trailers/${tr_id}/manifest-entries", payload: { shipment_id: "${s_b}", load_position: 2, expected_trailer_version: "${tr_v1}" }, as: DockSupervisor, captures: { entry_b: $.data.id } }
            - { call: "POST /ltl/manifest-entries/${entry_b}/remove", payload: {}, as: DockSupervisor }
          assert:
            - "After add: loaded_weight_lbs == 27000 and loaded_cube_cuft == 566"
            - "After compensating remove: OutboundTrailer.${tr_id}.loaded_weight_lbs == 26000, loaded_cube_cuft == 512, utilization_pct == 65.0 (exactly the pre-add ledger; zero drift)"
            - "Shipment.${s_b}.handling_status restored to ON_DOCK; ManifestEntry.${entry_b}.status == REMOVED"

      - name: inspection_confirm_reject_preserves_billed_amount
        grounds:
          - calculations.freight_rating
          - state_machines.Shipment.INSPECTION_PENDING_to_RATED
        distinguishing_aspect: |
          Conserved quantity = Shipment.rated_amount_cents: an inspection that is opened and
          then REJECTED must leave rated_amount_cents, nmfc_class, chargeable_weight_lbs, and
          dim_weight_lbs byte-identical to their pre-inspection values (compensation invariant
          on the billing basis — a different conserved quantity than the trailer ledger).
        test_recipe:
          setup:
            - "Shipment CLASS_70 450 lbs rated GROSS to 24725c; scan on file"
          setup_api_calls:
            - { call: "POST /ltl/terminals", payload: { code: "CHI", name: "Chicago", dock_doors: 12 }, as: TerminalAdmin, captures: { t_chi: $.data.id } }
            - { call: "POST /ltl/terminals", payload: { code: "ATL", name: "Atlanta", dock_doors: 10 }, as: TerminalAdmin, captures: { t_atl: $.data.id } }
            - { call: "POST /ltl/shipments", payload: { origin_terminal_id: "${t_chi}", destination_terminal_id: "${t_atl}", nmfc_class: "CLASS_70", actual_weight_lbs: 450, length_in: 48, width_in: 40, height_in: 48, service_standard: "STANDARD", accessorial_codes: ["LIFTGATE", "NOTIFY"] }, as: Dispatcher, captures: { s_id: $.data.id } }
            - { call: "POST /ltl/shipments/${s_id}/rate", payload: {}, as: RatingClerk, captures: { pre_rated: $.data.rated_amount_cents } }
            - { call: "POST /ltl/dimensioner-scans", payload: { shipment_id: "${s_id}", measured_length_in: 60, measured_width_in: 48, measured_height_in: 50, measured_weight_lbs: 430 }, as: RatingClerk, captures: { scan_id: $.data.id } }
          trigger:
            - { call: "POST /ltl/inspections", payload: { shipment_id: "${s_id}", scan_id: "${scan_id}", claimed_nmfc_class: "CLASS_85" }, as: RatingClerk, captures: { insp_id: $.data.id } }
            - { call: "POST /ltl/inspections/${insp_id}/reject", payload: {}, as: RatingClerk }
          assert:
            - "Shipment.${s_id}.rated_amount_cents == 24725 after open-then-reject (invariant: equals pre-inspection ${pre_rated})"
            - "Shipment.${s_id}.nmfc_class == CLASS_70 (unchanged), chargeable_weight_lbs == 450, dim_weight_lbs == 0"
            - "Inspection.${insp_id}.adjustment_cents == 0 and outcome == REJECTED"
