  - section: calculations
    instances:
      - name: due_at_matrix_three_cells
        claim_type: constants_applied
        grounds: [calculations.turnaround_due_at]
        distinguishing_aspect: "Three SLA matrix cells pinned exactly: STANDARDxCOMMERCIAL=168h -> 2026-08-08, URGENTxMEDICARE=24h -> 2026-08-02, STANDARDxMEDICAID=120h -> 2026-08-06, all from received_at 2026-08-01T00:00:00Z."
        test_recipe:
          setup: ["Three active criteria sets (COMMERCIAL, MEDICARE, MEDICAID) each with a published guideline; one provider"]
          setup_api_calls:
            - { call: "POST /um/criteria-sets", payload: { name: "Commercial Set", line_of_business: "COMMERCIAL", service_category: "IMAGING" }, as: ClinicalPolicyEditor, captures: { cs1: $.data.id, cs1_v: $.data.version } }
