# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2683 - Home-Cook Meal Marketplace & Cottage-Food Compliance
#
# Every instance grounds exclusively in SCAFFOLD.yaml 1.1-1.7. Logical clock
# starts at the mandatory default 2026-08-01T00:00:00Z in every chain below.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: payout_basis_accrual_vs_cash_divergence
        grounds:
          - calculations.cook_payout_net
          - entities.PayoutStatement.fields.basis
          - entities.PayoutStatement.fields.net_payout_cents
          - entities.PayoutStatement.fields.included_order_count
          - state_machines.Order.HANDED_OFF_to_DELIVERED
          - state_machines.PayoutStatement.DRAFT_to_SUPERSEDED
        distinguishing_aspect: |
          The two variants of cook_payout_net disagree on MONEY (PayoutStatement.net_payout_cents)
          because they disagree on the inclusion PREDICATE: ACCRUAL_WINDOW admits any order that
          physically left the kitchen (fulfillment_status IN {HANDED_OFF, DELIVERED}) while
          CASH_HANDOFF additionally demands diner confirmation plus a captured payment. Over one
          identical window holding one DELIVERED order and one HANDED_OFF-but-uncaptured order the
          same input data yields net 1890 versus net 945.
        test_recipe:
          setup:
            - "StatePolicy CA exists with a 5,000,000-cent annual cottage-food cap."
            - "Cook Ana is onboarding_status ACTIVE, compliance_standing CLEAR, verified_kitchen_type COMMERCIAL_SHARED, ytd_gross_sales_cents 1220 after exactly one capture."
            - "One APPROVED MenuItem priced at 610 cents per meal."
            - "One ProductionWindow (capacity 40) in status IN_PRODUCTION holding two orders of quantity 2, subtotal 1220 each."
            - "Order X is fulfillment_status DELIVERED with payment_status CAPTURED; Order Y is fulfillment_status HANDED_OFF with payment_status AUTHORIZED."
            - "No RefundEvent exists. Logical clock sits at 2026-08-08T16:00:00Z."
          setup_api_calls:
            - call: "POST /state-policies"
              payload: { state_code: "CA", cottage_food_annual_cap_cents: 5000000, allowed_kitchen_types: ["HOME_COTTAGE", "HOME_INSPECTED", "COMMERCIAL_SHARED"], tcs_requires_commercial_kitchen: true, max_shelf_life_days_non_refrigerated: 14, label_required_fields: ["cook_name", "ingredients", "allergens", "net_weight", "cottage_food_disclaimer"], cert_validity_max_days: 1825 }
              as: PlatformAdmin
              captures: { sp_ca_id: $.data.id }
            - call: "POST /cooks"
              payload: { legal_name: "Ana Ruiz", email: "ana@example.com", state_code: "CA", claimed_kitchen_type: "COMMERCIAL_SHARED", weekly_capacity_meals: 40 }
              as: Anonymous
              captures: { cook_id: $.data.id, cook_v0: $.data.version }
            - call: "POST /onboarding-documents"
              payload: { cook_id: "${cook_id}", doc_type: "FOOD_HANDLER_CERT", expected_cook_version: "${cook_v0}", certificate_number: "FH-4411", issuing_authority: "CA DPH", issued_on: "2026-01-15", expires_on: "2028-01-15" }
              as: Cook
              as_user_id: "${cook_id}"
              captures: { cert_doc_id: $.data.id }
            - call: "GET /cooks/${cook_id}"
              payload: {}
              as: ComplianceReviewer
              as_user_id: "rev-1"
              captures: { cook_v1: $.data.version }
            - call: "POST /onboarding-documents"
              payload: { cook_id: "${cook_id}", doc_type: "KITCHEN_INSPECTION", expected_cook_version: "${cook_v1}", kitchen_type_claimed: "COMMERCIAL_SHARED", inspection_date: "2026-06-01" }
              as: Cook
              as_user_id: "${cook_id}"
              captures: { insp_doc_id: $.data.id }
            - call: "POST /onboarding-documents/${cert_doc_id}/review"
              payload: { decision: "VERIFY", note: "certificate valid" }
              as: ComplianceReviewer
              as_user_id: "rev-1"
            - call: "POST /onboarding-documents/${insp_doc_id}/review"
              payload: { decision: "PASS", note: "commercial shared kitchen inspected" }
              as: ComplianceReviewer
              as_user_id: "rev-2"
            - call: "POST /cooks/${cook_id}/onboarding-decision"
              payload: { decision: "ACTIVATE" }
              as: ComplianceReviewer
              as_user_id: "rev-1"
            - call: "POST /menu-items"
              payload: { cook_id: "${cook_id}", name: "Sesame Noodle Box", food_category: "NON_TCS", allergens: ["WHEAT", "SESAME"], allergen_free_attested: false, shelf_life_days: 7, requires_refrigeration: false, handoff_mode: "BATCH_COOK_AND_CHILL", unit_price_cents: 610, label_fields: ["cook_name", "ingredients", "allergens", "net_weight", "cottage_food_disclaimer"] }
              as: Cook
              as_user_id: "${cook_id}"
              captures: { mi_b_id: $.data.id }
            - call: "POST /menu-items/${mi_b_id}/submit"
              payload: {}
              as: Cook
              as_user_id: "${cook_id}"
            - call: "POST /menu-items/${mi_b_id}/review"
              payload: { decision: "APPROVE", allergen_review_notes: "wheat and sesame declared" }
              as: ComplianceReviewer
              as_user_id: "rev-1"
            - call: "POST /production-windows"
              payload: { cook_id: "${cook_id}", week_start_date: "2026-08-03", order_cutoff_at: "2026-08-05T00:00:00Z", handoff_start_at: "2026-08-08T16:00:00Z", handoff_end_at: "2026-08-08T18:00:00Z", capacity_meals: 40 }
              as: Cook
              as_user_id: "${cook_id}"
              captures: { pw_id: $.data.id }
            - call: "POST /delivery-zones"
              payload: { state_policy_id: "${sp_ca_id}", zone_code: "CA-DOOR-1", state_code: "CA", service_mode: "DOOR_DELIVERY", postal_codes: ["94110"], max_cold_chain_minutes: 180 }
              as: PlatformAdmin
              captures: { dz_door_id: $.data.id }
            - call: "POST /orders"
              payload: { menu_item_id: "${mi_b_id}", production_window_id: "${pw_id}", delivery_zone_id: "${dz_door_id}", quantity: 2, diner_contact_email: "dx@example.com" }
              as: Diner
              as_user_id: "diner-x"
              captures: { ox_id: $.data.id }
            - call: "POST /orders"
              payload: { menu_item_id: "${mi_b_id}", production_window_id: "${pw_id}", delivery_zone_id: "${dz_door_id}", quantity: 2, diner_contact_email: "dy@example.com" }
              as: Diner
              as_user_id: "diner-y"
              captures: { oy_id: $.data.id }
            - call: "POST /orders/${ox_id}/route"
              payload: {}
              as: PlatformAdmin
            - call: "POST /orders/${oy_id}/route"
              payload: {}
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /production-windows/${pw_id}/advance"
              payload: { to_status: "CUTOFF_PASSED" }
              as: Cook
              as_user_id: "${cook_id}"
            - call: "POST /production-windows/${pw_id}/advance"
              payload: { to_status: "IN_PRODUCTION" }
              as: Cook
              as_user_id: "${cook_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-08T16:00:00Z" }
              as: PlatformAdmin
            - call: "POST /orders/${ox_id}/advance"
              payload: { to_status: "IN_PRODUCTION" }
              as: Cook
              as_user_id: "${cook_id}"
            - call: "POST /orders/${ox_id}/advance"
              payload: { to_status: "HANDED_OFF" }
              as: Cook
              as_user_id: "${cook_id}"
            - call: "POST /orders/${oy_id}/advance"
              payload: { to_status: "IN_PRODUCTION" }
              as: Cook
              as_user_id: "${cook_id}"
            - call: "POST /orders/${oy_id}/advance"
              payload: { to_status: "HANDED_OFF" }
              as: Cook
              as_user_id: "${cook_id}"
            - call: "POST /orders/${ox_id}/advance"
              payload: { to_status: "DELIVERED" }
              as: Diner
              as_user_id: "diner-x"
            - call: "GET /production-windows/${pw_id}"
              payload: {}
              as: FinanceOperator
              as_user_id: "fin-1"
              captures: { pw_v1: $.data.version }
          trigger:
            - call: "POST /payout-statements"
              payload: { cook_id: "${cook_id}", production_window_id: "${pw_id}", basis: "ACCRUAL_WINDOW", expected_production_window_version: "${pw_v1}" }
              as: FinanceOperator
              as_user_id: "fin-1"
              captures: { ps_accrual_id: $.data.id }
            - call: "GET /production-windows/${pw_id}"
              payload: {}
              as: FinanceOperator
              as_user_id: "fin-1"
              captures: { pw_v2: $.data.version }
            - call: "POST /payout-statements"
              payload: { cook_id: "${cook_id}", production_window_id: "${pw_id}", basis: "CASH_HANDOFF", expected_production_window_version: "${pw_v2}" }
              as: FinanceOperator
              as_user_id: "fin-1"
              captures: { ps_cash_id: $.data.id }
          assert:
            - "PayoutStatement.${ps_accrual_id}.included_order_count == 2"
            - "PayoutStatement.${ps_accrual_id}.gross_sales_cents == 2440"
            - "PayoutStatement.${ps_accrual_id}.tier_rate == 0.225"
            - "PayoutStatement.${ps_accrual_id}.commission_cents == 550"
            - "PayoutStatement.${ps_accrual_id}.refund_chargeback_cents == 0"
            - "PayoutStatement.${ps_accrual_id}.safety_hold_cents == 0"
            - "PayoutStatement.${ps_accrual_id}.net_payout_cents == 1890"
            - "PayoutStatement.${ps_cash_id}.included_order_count == 1"
            - "PayoutStatement.${ps_cash_id}.gross_sales_cents == 1220"
            - "PayoutStatement.${ps_cash_id}.commission_cents == 275"
            - "PayoutStatement.${ps_cash_id}.net_payout_cents == 945"
            - "PayoutStatement.${ps_accrual_id}.net_payout_cents - PayoutStatement.${ps_cash_id}.net_payout_cents == 945"
            - "PayoutStatement.${ps_accrual_id}.status == SUPERSEDED"
            - "PayoutStatement.${ps_cash_id}.status == DRAFT"

      - name: safety_score_substantiated_only_vs_intake_inclusive
        grounds:
          - calculations.cook_safety_score
          - entities.Cook.fields.safety_score
          - entities.Cook.fields.compliance_standing
          - state_machines.SafetyIncident.INTAKE_to_TRIAGED
          - state_machines.SafetyIncident.TRIAGED_to_SUBSTANTIATED
        distinguishing_aspect: |
          The two variants of cook_safety_score disagree on a RISK score, not on money, and the
          divergence is driven by incident STATUS rather than by any inclusion predicate over
          orders: substantiated_only charges 12 decayed points and yields 88 (band CLEAR) while
          intake_inclusive additionally charges a TRIAGED SEVERE incident at OPEN_INCIDENT_WEIGHT
          0.5 and yields 75 (band WARNED). Only the authoritative variant may move
          Cook.compliance_standing, so the cook stays CLEAR while the advisory score says WARNED.
        test_recipe:
          setup:
            - "StatePolicy CA exists with a 5,000,000-cent annual cottage-food cap."
            - "Cook Bo exists (onboarding_status DRAFT is sufficient - incident intake has no onboarding precondition)."
            - "One SafetyIncident of severity MODERATE (12 points) is status SUBSTANTIATED."
            - "One SafetyIncident of severity SEVERE (25 points) is status TRIAGED and not yet adjudicated."
            - "Both incidents were created at the default clock instant, so weeks() is 0 and decay is 1.00 for both."
          setup_api_calls:
            - call: "POST /state-policies"
              payload: { state_code: "CA", cottage_food_annual_cap_cents: 5000000, allowed_kitchen_types: ["HOME_COTTAGE", "HOME_INSPECTED", "COMMERCIAL_SHARED"], tcs_requires_commercial_kitchen: true, max_shelf_life_days_non_refrigerated: 14, label_required_fields: ["cook_name", "ingredients", "allergens", "net_weight", "cottage_food_disclaimer"], cert_validity_max_days: 1825 }
              as: PlatformAdmin
              captures: { sp_ca_id: $.data.id }
            - call: "POST /cooks"
              payload: { legal_name: "Bo Tran", email: "bo@example.com", state_code: "CA", claimed_kitchen_type: "HOME_COTTAGE", weekly_capacity_meals: 20 }
              as: Anonymous
              captures: { cook_id: $.data.id }
            - call: "POST /safety-incidents"
              payload: { cook_id: "${cook_id}", subject_type: "COOK", category: "LABEL_MISSING", severity: "MODERATE", description: "package shipped without the cottage-food disclaimer", occurred_at: "2026-07-30T12:00:00Z" }
              as: Diner
              as_user_id: "diner-1"
              captures: { inc_mod_id: $.data.id }
            - call: "POST /safety-incidents/${inc_mod_id}/triage"
              payload: { decision: "ACCEPT" }
              as: SafetyOfficer
              as_user_id: "so-1"
            - call: "POST /safety-incidents/${inc_mod_id}/adjudicate"
              payload: { decision: "SUBSTANTIATE", resolution_note: "photo evidence confirms the missing disclaimer" }
              as: SafetyOfficer
              as_user_id: "so-2"
            - call: "POST /safety-incidents"
              payload: { cook_id: "${cook_id}", subject_type: "COOK", category: "TEMP_ABUSE", severity: "SEVERE", description: "cold item handed off warm to the touch", occurred_at: "2026-07-31T12:00:00Z" }
              as: Diner
              as_user_id: "diner-2"
              captures: { inc_sev_id: $.data.id }
            - call: "POST /safety-incidents/${inc_sev_id}/triage"
              payload: { decision: "ACCEPT" }
              as: SafetyOfficer
              as_user_id: "so-1"
          trigger:
            - call: "GET /cooks/${cook_id}/compliance-summary"
              payload: {}
              as: SafetyOfficer
              as_user_id: "so-1"
          assert:
            - "response.data.safety_score == 88"
            - "response.data.provisional_safety_score == 75"
            - "response.data.compliance_standing == CLEAR"
            - "response.data.open_incident_count == 1"
            - "response.data.substantiated_incident_count == 1"
            - "response.data.cap_remaining_cents == 5000000"
            - "Cook.${cook_id}.safety_score == 88"
            - "Cook.${cook_id}.compliance_standing == CLEAR"
            - "SafetyIncident.${inc_mod_id}.severity_points == 12"
            - "SafetyIncident.${inc_sev_id}.severity_points == 25"

  - rule_id: combinatorial_formula
    instances:
      - name: commission_rounded_per_order_then_summed
        grounds:
          - calculations.cook_payout_net
          - entities.PayoutStatement.fields.commission_cents
          - entities.Order.fields.subtotal_cents
          - state_machines.Order.IN_PRODUCTION_to_HANDED_OFF
        distinguishing_aspect: |
          Mode (b) - operation ORDER between an aggregation and a rounding step. Two included
          orders each have subtotal_cents 1220 and the tier rate is 0.225, so each exact product
          is 274.5 cents. Rounding per order and then summing gives 275 + 275 = 550; summing
          first (2440 * 0.225 = 549.0) and rounding once gives 549. The scaffold pins per-order
          rounding, so 549 is the wrong answer and the one-cent gap is the whole observable.
        test_recipe:
          setup:
            - "StatePolicy CA exists; Cook Cy is ACTIVE and CLEAR with ytd_gross_sales_cents 0."
            - "One APPROVED MenuItem priced at 610 cents per meal."
            - "One ProductionWindow in status IN_PRODUCTION with two orders of quantity 2 (subtotal_cents 1220 each), both fulfillment_status HANDED_OFF and payment_status AUTHORIZED."
            - "Because no order captured, the commission tier is still COMMISSION_RATE_TIER_1 == 0.225."
          setup_api_calls:
            - call: "POST /state-policies"
              payload: { state_code: "CA", cottage_food_annual_cap_cents: 5000000, allowed_kitchen_types: ["HOME_COTTAGE", "HOME_INSPECTED", "COMMERCIAL_SHARED"], tcs_requires_commercial_kitchen: true, max_shelf_life_days_non_refrigerated: 14, label_required_fields: ["cook_name", "ingredients", "allergens", "net_weight", "cottage_food_disclaimer"], cert_validity_max_days: 1825 }
              as: PlatformAdmin
              captures: { sp_ca_id: $.data.id }
            - call: "POST /cooks"
              payload: { legal_name: "Cy Okafor", email: "cy@example.com", state_code: "CA", claimed_kitchen_type: "HOME_INSPECTED", weekly_capacity_meals: 40 }
              as: Anonymous
              captures: { cook_id: $.data.id, cook_v0: $.data.version }
            - call: "POST /onboarding-documents"
              payload: { cook_id: "${cook_id}", doc_type: "FOOD_HANDLER_CERT", expected_cook_version: "${cook_v0}", certificate_number: "FH-9002", issuing_authority: "CA DPH", issued_on: "2026-02-01", expires_on: "2028-02-01" }
              as: Cook
              as_user_id: "${cook_id}"
              captures: { cert_doc_id: $.data.id }
            - call: "GET /cooks/${cook_id}"
              payload: {}
              as: ComplianceReviewer
              as_user_id: "rev-1"
              captures: { cook_v1: $.data.version }
            - call: "POST /onboarding-documents"
              payload: { cook_id: "${cook_id}", doc_type: "KITCHEN_INSPECTION", expected_cook_version: "${cook_v1}", kitchen_type_claimed: "HOME_INSPECTED", inspection_date: "2026-06-15" }
              as: Cook
              as_user_id: "${cook_id}"
              captures: { insp_doc_id: $.data.id }
            - call: "POST /onboarding-documents/${cert_doc_id}/review"
              payload: { decision: "VERIFY" }
              as: ComplianceReviewer
              as_user_id: "rev-1"
            - call: "POST /onboarding-documents/${insp_doc_id}/review"
              payload: { decision: "PASS" }
              as: ComplianceReviewer
              as_user_id: "rev-2"
            - call: "POST /cooks/${cook_id}/onboarding-decision"
              payload: { decision: "ACTIVATE" }
              as: ComplianceReviewer
              as_user_id: "rev-1"
            - call: "POST /menu-items"
              payload: { cook_id: "${cook_id}", name: "Half-Cent Pastry Pack", food_category: "BAKED_NON_TCS", allergens: ["WHEAT", "EGG"], allergen_free_attested: false, shelf_life_days: 5, requires_refrigeration: false, handoff_mode: "BATCH_COOK_AND_CHILL", unit_price_cents: 610, label_fields: ["cook_name", "ingredients", "allergens", "net_weight", "cottage_food_disclaimer"] }
              as: Cook
              as_user_id: "${cook_id}"
              captures: { mi_id: $.data.id }
            - call: "POST /menu-items/${mi_id}/submit"
              payload: {}
              as: Cook
              as_user_id: "${cook_id}"
            - call: "POST /menu-items/${mi_id}/review"
              payload: { decision: "APPROVE", allergen_review_notes: "wheat and egg declared" }
              as: ComplianceReviewer
              as_user_id: "rev-1"
            - call: "POST /production-windows"
              payload: { cook_id: "${cook_id}", week_start_date: "2026-08-03", order_cutoff_at: "2026-08-05T00:00:00Z", handoff_start_at: "2026-08-08T16:00:00Z", handoff_end_at: "2026-08-08T18:00:00Z", capacity_meals: 40 }
              as: Cook
              as_user_id: "${cook_id}"
              captures: { pw_id: $.data.id }
            - call: "POST /delivery-zones"
              payload: { state_policy_id: "${sp_ca_id}", zone_code: "CA-DOOR-2", state_code: "CA", service_mode: "DOOR_DELIVERY", postal_codes: ["94110"], max_cold_chain_minutes: 180 }
              as: PlatformAdmin
              captures: { dz_id: $.data.id }
            - call: "POST /orders"
              payload: { menu_item_id: "${mi_id}", production_window_id: "${pw_id}", delivery_zone_id: "${dz_id}", quantity: 2, diner_contact_email: "d1@example.com" }
              as: Diner
              as_user_id: "diner-1"
              captures: { o1_id: $.data.id }
            - call: "POST /orders"
              payload: { menu_item_id: "${mi_id}", production_window_id: "${pw_id}", delivery_zone_id: "${dz_id}", quantity: 2, diner_contact_email: "d2@example.com" }
              as: Diner
              as_user_id: "diner-2"
