            - "Plant (std cost 38); supplier + agreement; ACCEPTED 5000-lb BOVINE batch; cook run completed with actuals 800 fat / 1200 meal (variance 0.0); TALLOW lot graded FEED_GRADE (moisture 0.9, ffa 6.0) and RELEASED (grader ql-1, releaser ps-1)"
