      - name: registration_create_rejects_a_stale_section_version_even_for_a_different_student
        claim_type: optimistic_concurrency
        grounds: [concurrency_rules.registration-create-stale-section, "errors[ERR_STALE_SECTION_VERSION]", calculations.section_seat_ledger_invariant]
        distinguishing_aspect: |
          Two DIFFERENT students holding seats in the same section is entirely legal, so
          the second create is not blocked by any state or duplicate rule — it is blocked
          only because the first hold moved Section.version. Confirming a registration
          bumps the version again, so a value read before the confirm is also stale.
        test_recipe:
          setup:
            - "Logical clock left at its startup default 2026-08-01T00:00:00Z."
