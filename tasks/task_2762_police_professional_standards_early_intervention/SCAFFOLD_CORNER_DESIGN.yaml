      - name: eis_thresholds_fire_at_their_exact_boundaries_and_reset_when_the_window_moves
        claim_type: Rate threshold trigger
        grounds:
          - complexity_profile.complexity_layers.rate_threshold_triggers
          - calculations.eis_composite_score
          - state_machines.EarlyInterventionAlert
        distinguishing_aspect: |
          The early-intervention layer carries two different kinds of threshold and they must be
          tested separately. The cumulative one is the composite score against the band table: a
          score of exactly 50.00 is ALERT and is enough for the sweep to promote the alert to
          PLAN_REQUIRED, because that comparison is non-strict. The instantaneous one is the
          indicator count: the third USE_OF_FORCE event flips FORCE_COUNT and adds a flat 10 points
          on top of the scaled weight, so the score jumps by more than the event's own contribution.
          The reset is the rolling window itself - once every event has aged past 365 days the
          profile reads 0.00 with no breached indicators, while the historical alert row stays.
        test_recipe:
          setup:
            - "The logical clock starts at 2026-08-01T00:00:00Z."
            - "Internal Affairs holds Commander Reyes; Patrol North holds Officer Vance (PATROL, assignment multiplier 1.0)."
            - "Vance's events are chosen so the weighted_total is exactly 20 with no indicator breached: USE_OF_FORCE LEVEL_3 on 2026-07-01 and 2026-07-05 (6.0 each), PURSUIT NA on 2026-07-10 (2.0) and six SICK_LEAVE_DAY events on 2026-07-15 through 2026-07-20 (1.0 each)."
            - "Counts stay under every indicator threshold: 2 force events against 3, 1 pursuit against 2, 0 complaints against 3, 6 sick days against 12."
