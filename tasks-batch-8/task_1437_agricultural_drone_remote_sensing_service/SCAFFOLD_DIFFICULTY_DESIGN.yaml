        grounds:
          - state_machines.FlightMission.PLANNED_to_AUTHORIZED
          - state_machines.AirspaceAuthorization
          - validations[priority=6]
        distinguishing_aspect: |
          Pair: FlightMission.authorize depends on AirspaceAuthorization.status
          == ACTIVE. Authorize attempted when the linked authorization is
          REVOKED must fail with ERR_AUTH_WINDOW_INSUFFICIENT or
          ERR_AUTH_NOT_ACTIVE, even though the mission itself is validly
          PLANNED.
        test_recipe:
          setup:
            - "Plan P; Grower G; Field F airspace_class=D (laanc_required=true)"
            - "Authorization Auth covering the mission window, ACTIVE at mission creation"
            - "Mission M on F referencing Auth, still PLANNED"
            - "Auth then REVOKED before authorize is called"
          setup_api_calls:
            - call: "POST /ag-drone/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /ag-drone/subscription-plans"
              payload: { plan_code: "P", included_acres_per_year: 500, base_fee_cents: 0, overage_rate_cents_per_acre: 300, spray_allowed: false, ndvi_turnaround_hours: 24, storage_retention_days: 90 }
              as: OpsAdmin
