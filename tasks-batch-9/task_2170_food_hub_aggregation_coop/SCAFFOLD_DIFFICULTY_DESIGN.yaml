          p1_id: $.data.id
      - call: POST /producers/${p1_id}/documents
        payload:
          doc_type: GAP_AUDIT
          issued_on: '2026-01-01T00:00:00Z'
          expires_on: '2026-10-01T00:00:00Z'
        as: Producer
        as_user_id: ${p1_id}
        captures:
          p1_gap: $.data.id
      - call: POST /producers/${p1_id}/documents
        payload:
          doc_type: LIABILITY_INSURANCE
          issued_on: '2026-01-01T00:00:00Z'
          expires_on: '2027-01-01T00:00:00Z'
        as: Producer
        as_user_id: ${p1_id}
        captures:
          p1_ins: $.data.id
      - call: POST /producers/${p1_id}/documents
        payload:
          doc_type: HACCP_PLAN
          issued_on: '2026-01-01T00:00:00Z'
          expires_on: '2027-01-01T00:00:00Z'
        as: Producer
        as_user_id: ${p1_id}
        captures:
          p1_hac: $.data.id
      - call: POST /producers/${p1_id}/application
        payload: {}
        as: Producer
        as_user_id: ${p1_id}
      - call: POST /producer-documents/${p1_gap}/adjudication
        payload:
          decision: VERIFY
        as: ComplianceOfficer
        as_user_id: co-verify-1
      - call: POST /producer-documents/${p1_ins}/adjudication
        payload:
          decision: VERIFY
        as: ComplianceOfficer
        as_user_id: co-verify-1
      - call: POST /producer-documents/${p1_hac}/adjudication
        payload:
          decision: VERIFY
        as: ComplianceOfficer
        as_user_id: co-verify-1
      - call: POST /producers/${p1_id}/review
        payload:
          decision: APPROVE
        as: ComplianceOfficer
        as_user_id: co-approve-9
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-30T23:59:59.999Z'
        as: HubAdmin
        as_user_id: hub-admin-1
      trigger:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-10-01T00:00:00Z'
        as: HubAdmin
