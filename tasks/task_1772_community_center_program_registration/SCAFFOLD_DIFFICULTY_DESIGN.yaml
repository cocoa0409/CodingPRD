            - "HOP2: ClassSession.${ss}.enrolled_count == 1 (decremented to 0 by the drop, incremented back by the promotion), waitlist_count == 0"
            - "HOP3: Registration.${rb} enrollment_status == ENROLLED, promoted_at == 2026-08-17T00:00:00Z, payment_due_at == 2026-08-19T00:00:00Z, payment_status == PENDING"
            - "Household.${ha}.account_credit_cents == 8000"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_over_temporal_on_register
        grounds:
          - "validations[priority=9]"
          - "validations[priority=19]"
          - "errors[ERR_SESSION_NOT_OPEN]"
          - "errors[ERR_REGISTRATION_WINDOW_CLOSED]"
        distinguishing_aspect: |
          Error-category pair (state vs business_temporal): a registration attempt into a DRAFT
          session while the season window is also closed violates both rules; the state-category
          error ERR_SESSION_NOT_OPEN (priority 9) MUST win over the temporal-category
          ERR_REGISTRATION_WINDOW_CLOSED (priority 19).
        test_recipe:
          setup:
            - "Season PUBLISHED (window: general opens 2026-08-17, closes 2026-09-15); session left in DRAFT (never published); household HZ with participant PZ; clock at 2026-09-15T00:00:00Z (== closes_at, so window closed)"
          setup_api_calls:
            - { call: "POST /seasons", payload: { name: "Fall 2026", start_date: "2026-09-01T00:00:00Z", end_date: "2026-12-15T00:00:00Z", resident_opens_at: "2026-08-10T00:00:00Z", general_opens_at: "2026-08-17T00:00:00Z", registration_closes_at: "2026-09-15T00:00:00Z" }, as: ProgramCoordinator, captures: { sn: $.data.id } }
            - { call: "POST /seasons/${sn}/publish", payload: {}, as: ProgramCoordinator }
            - { call: "POST /programs", payload: { season_id: "${sn}", name: "Zumba", category: "Fitness", min_age: 0, max_age: 120 }, as: ProgramCoordinator, captures: { pg: $.data.id } }
            - { call: "POST /instructors", payload: { full_name: "Zed Z", email: "zz@x.com" }, as: ProgramCoordinator, captures: { ins: $.data.id } }
            - { call: "POST /class-sessions", payload: { program_id: "${pg}", instructor_id: "${ins}", title: "Zumba PM", capacity: 5, min_enrollment: 1, fee_resident_cents: 5000, fee_nonresident_cents: 5000, enrollment_check_at: "2026-09-08T00:00:00Z" }, as: ProgramCoordinator, captures: { ss: $.data.id, ss_v: $.data.version } }
            - { call: "POST /households", payload: { account_name: "HZ" }, as: HouseholdManager, captures: { hz: $.data.id } }
            - { call: "POST /participants", payload: { household_id: "${hz}", full_name: "Zee P", birth_date: "1990-01-01T00:00:00Z" }, as: HouseholdManager, as_user_id: "${hz}", captures: { pz: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-15T00:00:00Z" }, as: ProgramCoordinator }
          trigger:
            - { call: "POST /registrations", payload: { session_id: "${ss}", participant_id: "${pz}", expected_class_session_version: "${ss_v}" }, as: HouseholdManager, as_user_id: "${hz}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SESSION_NOT_OPEN (state priority 9 beats business_temporal priority 19; window-closed would have answered ERR_REGISTRATION_WINDOW_CLOSED)"
            - "HTTP status == 409"

      - name: safety_over_constraint_on_form_submission
        grounds:
          - "validations[priority=15]"
          - "validations[priority=29]"
          - "errors[ERR_GUARDIAN_SIGNATURE_REQUIRED]"
          - "errors[ERR_DUPLICATE_SAFETY_FORM]"
        distinguishing_aspect: |
          Error-category pair (business_safety vs business_constraint): a second safety form for the
          same minor+season that is also self-signed violates both the guardian-signature safety rule
          and the duplicate-form constraint; the safety error ERR_GUARDIAN_SIGNATURE_REQUIRED
          (priority 15) MUST win over ERR_DUPLICATE_SAFETY_FORM (priority 29).
        test_recipe:
          setup:
            - "Season exists (DRAFT acceptable); household HM with minor participant PM (birth 2015-01-01 -> age 11 at season start 2026-09-01)"
            - "One correctly guardian-signed SafetyForm for (PM, season) already SUBMITTED"
          setup_api_calls:
            - { call: "POST /seasons", payload: { name: "Fall 2026", start_date: "2026-09-01T00:00:00Z", end_date: "2026-12-15T00:00:00Z", resident_opens_at: "2026-08-10T00:00:00Z", general_opens_at: "2026-08-17T00:00:00Z", registration_closes_at: "2026-09-15T00:00:00Z" }, as: ProgramCoordinator, captures: { sn: $.data.id } }
            - { call: "POST /households", payload: { account_name: "HM" }, as: HouseholdManager, captures: { hm: $.data.id } }
            - { call: "POST /participants", payload: { household_id: "${hm}", full_name: "Mini Me", birth_date: "2015-01-01T00:00:00Z" }, as: HouseholdManager, as_user_id: "${hm}", captures: { pm: $.data.id } }
            - { call: "POST /safety-forms", payload: { participant_id: "${pm}", season_id: "${sn}", emergency_contact_name: "Guardian One", emergency_contact_phone: "555-1", signer_name: "Guardian One" }, as: HouseholdManager, as_user_id: "${hm}", captures: { f1: $.data.id } }
          trigger:
            - { call: "POST /safety-forms", payload: { participant_id: "${pm}", season_id: "${sn}", emergency_contact_name: "Guardian One", emergency_contact_phone: "555-1", signer_name: "Mini Me" }, as: HouseholdManager, as_user_id: "${hm}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_GUARDIAN_SIGNATURE_REQUIRED (business_safety priority 15 beats business_constraint priority 29; duplicate-form would have answered ERR_DUPLICATE_SAFETY_FORM)"
            - "HTTP status == 422"

  - rule_id: boundary_precision_check
    instances:
      - name: capacity_boundary_enrolled_vs_waitlisted
        grounds:
          - entities.ClassSession.fields.capacity
          - entities.ClassSession.fields.enrolled_count
          - "validations[priority=21]"
        distinguishing_aspect: |
          Seat-count boundary on POST /registrations: with capacity 1, the creation when
          enrolled_count == 0 (< capacity) lands ENROLLED with a 72h payment deadline, while the
          creation when enrolled_count == 1 (== capacity exactly) lands WAITLISTED with NO payment
          deadline — fullness is >= capacity, not > capacity.
        test_recipe:
          setup:
            - "Season PUBLISHED, clock 2026-08-17T00:00:00Z; session capacity 1, fees 5000/5000, PUBLISHED; households HA/PAA and HB/PBB"
          setup_api_calls:
            - { call: "POST /seasons", payload: { name: "Fall 2026", start_date: "2026-09-01T00:00:00Z", end_date: "2026-12-15T00:00:00Z", resident_opens_at: "2026-08-10T00:00:00Z", general_opens_at: "2026-08-17T00:00:00Z", registration_closes_at: "2026-09-15T00:00:00Z" }, as: ProgramCoordinator, captures: { sn: $.data.id } }
            - { call: "POST /seasons/${sn}/publish", payload: {}, as: ProgramCoordinator }
            - { call: "POST /programs", payload: { season_id: "${sn}", name: "Spin", category: "Fitness", min_age: 0, max_age: 120 }, as: ProgramCoordinator, captures: { pg: $.data.id } }
            - { call: "POST /rooms", payload: { name: "Spin Room", capacity: 50 }, as: ProgramCoordinator, captures: { rm: $.data.id } }
            - { call: "POST /instructors", payload: { full_name: "Spin S", email: "sp@x.com" }, as: ProgramCoordinator, captures: { ins: $.data.id } }
            - { call: "POST /class-sessions", payload: { program_id: "${pg}", instructor_id: "${ins}", title: "Spin AM", capacity: 1, min_enrollment: 1, fee_resident_cents: 5000, fee_nonresident_cents: 5000, enrollment_check_at: "2026-09-08T00:00:00Z" }, as: ProgramCoordinator, captures: { ss: $.data.id } }
            - { call: "POST /instructor-contracts", payload: { session_id: "${ss}", instructor_id: "${ins}", revenue_share_bp: 5000, guarantee_min_cents: 0, cancellation_guarantee_cents: 0, settlement_basis: ENROLLMENT_BASIS }, as: ProgramCoordinator, captures: { ct: $.data.id } }
            - { call: "POST /class-meetings", payload: { session_id: "${ss}", room_id: "${rm}", starts_at: "2026-09-20T18:00:00Z", ends_at: "2026-09-20T19:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /instructor-contracts/${ct}/accept", payload: {}, as: Instructor, as_user_id: "${ins}" }
            - { call: "POST /class-sessions/${ss}/publish", payload: {}, as: ProgramCoordinator, captures: { ss_v: $.data.version } }
            - { call: "POST /households", payload: { account_name: "HA" }, as: HouseholdManager, captures: { ha: $.data.id } }
            - { call: "POST /households", payload: { account_name: "HB" }, as: HouseholdManager, captures: { hb: $.data.id } }
            - { call: "POST /participants", payload: { household_id: "${ha}", full_name: "Rider A", birth_date: "1990-01-01T00:00:00Z" }, as: HouseholdManager, as_user_id: "${ha}", captures: { paa: $.data.id } }
            - { call: "POST /participants", payload: { household_id: "${hb}", full_name: "Rider B", birth_date: "1991-01-01T00:00:00Z" }, as: HouseholdManager, as_user_id: "${hb}", captures: { pbb: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-17T00:00:00Z" }, as: ProgramCoordinator }
          trigger:
            - { call: "POST /registrations", payload: { session_id: "${ss}", participant_id: "${paa}", expected_class_session_version: "${ss_v}" }, as: HouseholdManager, as_user_id: "${ha}", captures: { ra: $.data.id, ra_enr: $.data.enrollment_status, ra_due: $.data.payment_due_at } }
            - { call: "GET /class-sessions/${ss}", as: ProgramCoordinator, captures: { ss_v2: $.data.version, cnt1: $.data.enrolled_count } }
            - { call: "POST /registrations", payload: { session_id: "${ss}", participant_id: "${pbb}", expected_class_session_version: "${ss_v2}" }, as: HouseholdManager, as_user_id: "${hb}", captures: { rb: $.data.id, rb_enr: $.data.enrollment_status, rb_due: $.data.payment_due_at, rb_wl: $.data.waitlisted_at } }
            - { call: "GET /class-sessions/${ss}", as: ProgramCoordinator, captures: { cnt2: $.data.enrolled_count, wl2: $.data.waitlist_count } }
          assert:
            - "Registration.${ra}.enrollment_status == ENROLLED (0 < capacity 1)"
            - "Registration.${ra}.payment_due_at == 2026-08-20T00:00:00Z"
            - "ClassSession.${ss}.enrolled_count == 1 and waitlist_count == 1 after both calls"
            - "Registration.${rb}.enrollment_status == WAITLISTED (enrolled_count == capacity exactly -> full, not an error)"
            - "Registration.${rb}.payment_due_at == null and waitlisted_at == 2026-08-17T00:00:00Z"

      - name: min_enrollment_equality_survives_vs_below_cancels
        grounds:
          - state_machines.ClassSession.PUBLISHED_to_ACTIVE
          - state_machines.ClassSession.PUBLISHED_to_CANCELLED
          - entities.ClassSession.fields.min_enrollment
        distinguishing_aspect: |
          Enrollment-threshold boundary on POST /seasons/{id}/sweeps (different metric and endpoint
          than the seat-count boundary): a session with enrolled_count == min_enrollment exactly
          ACTIVATES (>= passes), while a sibling session at min_enrollment - 1 is CANCELLED.
        test_recipe:
          setup:
            - "Season PUBLISHED; sessions SG (min 2, 2 enrolled+paid) and SL (min 2, 1 enrolled+paid), both PUBLISHED with enrollment_check_at 2026-09-08; clock 2026-09-08T00:00:00Z"
