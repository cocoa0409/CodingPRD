          trigger:
            - { call: "POST /api/label-versions/${lv}/submit-review", as: LabelAnalyst, as_user_id: "analyst-1", captures: { rs1: $.data.review_status, rr1: $.data.review_round } }
            - { call: "POST /api/label-versions/${lv}/reject", payload: { reason: "panel legibility" }, as: RegulatoryReviewer, as_user_id: "reviewer-1", captures: { rs2: $.data.review_status } }
            - { call: "POST /api/label-versions/${lv}/submit-review", as: LabelAnalyst, as_user_id: "analyst-1", captures: { rs3: $.data.review_status, rr3: $.data.review_round } }
            - { call: "POST /api/label-versions/${lv}/approve", as: RegulatoryReviewer, as_user_id: "reviewer-1", captures: { rs4: $.data.review_status } }
            - { call: "GET /api/products/${pid}", as: PlatformAdmin, captures: { pver2: $.data.version } }
            - { call: "POST /api/label-versions/${lv}/release", payload: { expected_product_version: "${pver2}" }, as: QualityManager, as_user_id: "${cid}", captures: { rel1: $.data.release_status, rs5: $.data.review_status } }
