              payload: { sequence_no: 2, description: "Phase 2 invoiced cost", evidence_basis: "INVOICED_COST", planned_location_ids: ["${l3_id}"], is_final: false }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { m2_id: $.data.id }
            - call: "POST /broadband/awards/${aw1_id}/milestones/${m2_id}/submit-evidence"
              payload: { built_location_ids: ["${l3_id}"], invoiced_cost_cents: 900002 }
              as: Subgrantee
              as_user_id: "${s1_id}"
          trigger:
            - call: "POST /broadband/awards/${aw1_id}/milestones/${m2_id}/verify"
              payload: { outcome: "APPROVED" }
              as: ProgramAdmin
              as_user_id: "admin-1"
