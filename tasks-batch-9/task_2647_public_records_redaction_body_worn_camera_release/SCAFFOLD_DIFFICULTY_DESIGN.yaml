            - call: "POST /records/responsive-records/${rec_id}/inclusion"
              payload: { inclusion_status: "RESPONSIVE" }
              as: RecordsClerk
              as_user_id: "clerk-1"
          assert:
            - "AT INTAKE the inclusion call returns HTTP 409 with data.error_id == \"ERR_REQUEST_STATE_INVALID\""
            - "The rejected call leaves ResponsiveRecord.${rec_id}.inclusion_status == CANDIDATE and release_posture == OPEN"
            - "PublicRecordsRequest.${req_id}.processing_status == INTAKE after the rejected call, and responsive_record_count == 1 (the CANDIDATE attachment already counts, since only EXCLUDED records are dropped from the count)"
            - "The scope clarification moves PublicRecordsRequest.${req_id}.processing_status to SCOPING and increments its version"
            - "AFTER SCOPING the identical inclusion call returns HTTP 200 with ResponsiveRecord.${rec_id}.inclusion_status == RESPONSIVE"
            - "ResponsiveRecord.${rec_id}.estimated_review_minutes == 10 (ROUTINE multiplier 1.0 on 10 source minutes) and presumptive_burden_minutes == 3 (ceil(10 * 0.25))"
            - "PublicRecordsRequest.${req_id}.processing_status == EXEMPTION_REVIEW (auto-advance on the first RESPONSIVE record) and responsive_record_count == 1"
  - rule_id: resource_temporal_overlap
    instances:
      - name: clip_overlap_half_open_adjacency_on_responsive_record
        grounds:
          - calculations.clip_overlap
