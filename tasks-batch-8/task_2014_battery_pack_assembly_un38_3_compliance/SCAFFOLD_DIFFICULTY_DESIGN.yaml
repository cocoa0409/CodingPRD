              as_user_id: "al-1"
            - call: "POST /api/integration-programs/${prog_id}/battery-packs/${pack_id}/safety-test-dossiers"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
              captures: { doss_id: $.data.id }
            - call: "PUT /api/integration-programs/${prog_id}/battery-packs/${pack_id}/safety-test-dossiers/${doss_id}"
