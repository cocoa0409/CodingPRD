              as: PlatformAdmin
              captures: { r_lk: $.data.id }
            - call: "GET /api/channels/${ch_lk}"
              payload: {}
              as: Any
              captures: { ch_lkv: $.data.version }
          trigger:
            - call: "POST /api/channels/${ch_lk}/payouts/lock"
