  # ===========================================================================
  # Rule 6 - Boundary-precision checks on different metrics/endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: density_band_upper_edge_is_exclusive_on_ready_endpoint
        grounds:
          - validations[priority=86]
          - calculations.cycle_load_density
          - entities.CycleRecipe.fields.density_max_g_per_cm3
          - errors[ERR_LOAD_DENSITY_OUT_OF_BAND]
        distinguishing_aspect: |
          Numeric-threshold boundary on the load-density metric, reached through
          POST /sterilization/cycles/{id}/ready: a load computing to exactly
          0.1050 against a recipe band of [0.0900, 0.1050) is REJECTED because
          the upper edge is exclusive, while the lower edge 0.0900 would be
          accepted. The rejection depends on `<` rather than `<=` at the fourth
          decimal place.
        test_recipe:
          setup:
            - "Recipe RC has band density_min 0.0900 and density_max 0.1050."
            - "A cycle carries one pallet of P1 (120.0 kg / 1.2 m3) and one pallet of P2 (90.0 kg / 0.8 m3), giving an aggregate load density of exactly 0.1050."
            - "The recipe's one MIN_DOSE and one ROUTINE dosimeter are already placed, so the earlier placement check at priority 84 passes."
