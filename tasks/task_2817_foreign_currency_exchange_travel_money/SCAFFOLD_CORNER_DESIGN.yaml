          - entities.CurrencyProfile.fields.export_limit_minor_units
        distinguishing_aspect: "Both RESTRICTED-class rules key off the currency profile and not the amount: a customer with no travel_document_reference is refused a 20000-minor MAD sale with ERR_RESTRICTED_CURRENCY_DOC_REQUIRED even though the deal is only 23269 cents, the same deal authorizes for a customer who has the reference because fx_gross_minor_units == export_limit_minor_units exactly (a <= comparison), and one note more (30000 minor) is refused with ERR_EXPORT_LIMIT_EXCEEDED."
