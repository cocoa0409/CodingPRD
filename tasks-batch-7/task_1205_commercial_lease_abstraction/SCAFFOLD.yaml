scenario: |
  1205. Commercial Lease Abstraction & Administration (lease administration team): lease document abstraction into key data points, rent schedule & escalation setup with recovery structure, critical date calendar (option/notice/expiration), operating expense estimate billing & annual reconciliation, tenant compliance (insurance/reporting) tracking, amendment & assignment processing, audit rights & tenant challenge response, portfolio reporting & rent roll accuracy

domain_name: commercial-lease-abstraction
api_prefix: /lease-admin

# ============================================================================
# Step 0: Complexity Profile
# ============================================================================
complexity_profile:
  primary_archetype: ledger_reconciliation       # estimate vs actual CAM/opex reconciliation
  secondary_archetype: temporal_windowing        # critical dates, occupancy, audit windows
  complexity_layers:
    - optimistic_concurrency                      # OCC on Lease.version for amendment & abstraction re-certification
    - dual_variant_calculation                    # estimate vs actual recovery; straight-line vs cash rent roll
    - derived_field_reconciliation                # Lease.cached_* fields derived from child collections
    - cascading_side_effects                      # amendment → escalation recompute → billing re-issue → challenge re-open
  entity_topology: hierarchical                   # Property → Lease → children; some flat cross-refs (AuditRight references Reconciliation)
  state_machine_shape: parallel                   # Lease carries status × abstraction_status × billing_posture dimensions
  relationship_patterns:
    - one_to_many                                 # Lease has many RentScheduleLines / EscalationSteps / CriticalDates
    - cross_aggregate                             # AuditRight references Reconciliation; TenantChallenge references RecoveryBilling
    - polymorphic                                 # CriticalDate.kind is polymorphic across OPTION / NOTICE / EXPIRATION / RENEWAL / AUDIT
  role_model: segregation_of_duties               # Abstractor ≠ Certifier; Accountant who posts reconciliation cannot approve it
  consistency_model: immediate                    # single-request atomicity, no async reconciliation

# ============================================================================
# §1.0 Response Envelope (FIXED — emit verbatim)
# ============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ============================================================================
# §1.1 Entity-Relationship Table (12 entities)
# ============================================================================
entities:
  - name: Property
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Property display name" }
      - { name: address, type: string, source: input, description: "Street address" }
      - { name: total_rentable_sf, type: integer, source: input, description: "Total rentable square footage; >= 1", constraints: "integer >= 1" }
      - { name: fiscal_year_end_month, type: integer, source: input, description: "Fiscal year end month, 1-12", constraints: "1..12" }
      - { name: posture, type: enum, source: computed, description: "OPERATING | SUSPENDED — derived: SUSPENDED if any ACTIVE lease has billing_posture=FROZEN, else OPERATING" }

  - name: Lease
    parent: Property
    common_fields: true
    fields:
      - { name: property_id, type: string, source: system, description: "FK -> Property.id; owning property" }
      - { name: tenant_legal_name, type: string, source: input, description: "Tenant legal entity name" }
      - { name: suite, type: string, source: input, description: "Suite / unit identifier" }
      - { name: leased_sf, type: integer, source: input, description: "Leased square footage; >= 1", constraints: "integer >= 1; leased_sf <= Property.total_rentable_sf" }
      - { name: commencement_date, type: string, source: input, description: "ISO date YYYY-MM-DD; lease commencement" }
      - { name: expiration_date, type: string, source: input, description: "ISO date YYYY-MM-DD; natural expiration; must be > commencement_date" }
      - { name: base_rent_annual_cents, type: integer, source: input, description: "Initial annual base rent, cents", constraints: ">= 0" }
      - { name: escalation_type, type: enum, source: input, description: "NONE | FIXED_PCT | CPI | STEPPED" }
      - { name: recovery_structure, type: enum, source: input, description: "NNN | MODIFIED_GROSS | GROSS — determines which opex pools are recoverable" }
      - { name: pro_rata_share_bps, type: integer, source: input, description: "Pro-rata share of recoverable pools, basis points (10000 = 100%)", constraints: "0..10000" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | EXPIRED | TERMINATED — primary lifecycle" }
      - { name: abstraction_status, type: enum, source: system, description: "PENDING | ABSTRACTED | CERTIFIED — independent dimension; certification requires segregation" }
      - { name: billing_posture, type: enum, source: system, description: "CURRENT | FROZEN | DELINQUENT — derived from RecoveryBilling outstanding and Reconciliation disputes" }
      - { name: cached_annual_rent_cents, type: integer, source: computed, description: "Current-year scheduled base rent derived from RentScheduleLine + EscalationStep; refreshed on any schedule mutation" }
      - { name: cached_recovery_ytd_cents, type: integer, source: computed, description: "Year-to-date recovery billings issued (ISSUED or PAID) for the current fiscal year" }
      - { name: security_deposit_cents, type: integer, source: input, description: "Security deposit held, cents", constraints: ">= 0" }
      - { name: abstractor_user_id, type: string, source: system, description: "Opaque user id of the Abstractor who submitted abstraction; used to enforce segregation of duties" }
      - { name: certifier_user_id, type: string, source: system, description: "Opaque user id of the Certifier who certified abstraction; MUST differ from abstractor_user_id" }

  - name: RentScheduleLine
    parent: Lease
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: system, description: "FK -> Lease.id; owning lease" }
      - { name: period_start, type: string, source: input, description: "ISO date YYYY-MM-DD, inclusive" }
      - { name: period_end, type: string, source: input, description: "ISO date YYYY-MM-DD, exclusive (half-open [start, end))" }
      - { name: base_rent_cents, type: integer, source: input, description: "Base rent for this period, cents (pre-escalation)", constraints: ">= 0" }
      - { name: escalation_step_id, type: string, source: input, description: "FK -> EscalationStep.id; optional escalation applied to this line; null means no escalation", constraints: "nullable" }
      - { name: effective_rent_cents, type: integer, source: computed, description: "base_rent_cents with escalation applied and rounded to cents (round_half_up)" }

  - name: EscalationStep
    parent: Lease
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: system, description: "FK -> Lease.id; owning lease" }
      - { name: step_index, type: integer, source: input, description: "Order of escalation; 1-based; unique within lease", constraints: ">= 1, unique within Lease" }
      - { name: kind, type: enum, source: input, description: "FIXED_PCT | CPI_LOOKUP | STEPPED_AMOUNT" }
      - { name: pct_bps, type: integer, source: input, description: "Percent escalation in basis points; required iff kind=FIXED_PCT or CPI_LOOKUP", constraints: "0..100000" }
      - { name: amount_cents, type: integer, source: input, description: "Flat step-up amount in cents; required iff kind=STEPPED_AMOUNT", constraints: ">= 0" }
      - { name: effective_on, type: string, source: input, description: "ISO date YYYY-MM-DD the step takes effect" }

  - name: RecoveryPool
    parent: Property
    common_fields: true
    fields:
      - { name: property_id, type: string, source: system, description: "FK -> Property.id; owning property" }
      - { name: category, type: enum, source: input, description: "CAM | TAX | INSURANCE | UTILITIES | MANAGEMENT_FEE" }
      - { name: fiscal_year, type: integer, source: input, description: "Fiscal year (YYYY) this pool covers", constraints: "2000..2100" }
      - { name: budgeted_cents, type: integer, source: input, description: "Budgeted recoverable amount for this pool-year, cents", constraints: ">= 0" }
      - { name: actual_cents, type: integer, source: input, description: "Actual incurred amount, populated at year-end close", constraints: ">= 0; null until Reconciliation CLOSED" }
      - { name: gross_up_floor_pct_bps, type: integer, source: input, description: "Occupancy threshold below which variable pools gross up to 95% occupancy, basis points", constraints: "0..10000; default 9500" }

  - name: RecoveryBilling
    parent: Lease
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: system, description: "FK -> Lease.id; owning lease" }
      - { name: pool_id, type: string, source: system, description: "FK -> RecoveryPool.id; pool being billed against" }
      - { name: fiscal_year, type: integer, source: input, description: "Fiscal year (YYYY) of this billing" }
      - { name: period_index, type: integer, source: input, description: "Billing period within fiscal year; 1=monthly,1..12; 1..4 for quarterly", constraints: ">= 1" }
      - { name: estimate_cents, type: integer, source: computed, description: "Estimated recovery charge for this period (variant: estimate)" }
      - { name: final_cents, type: integer, source: computed, description: "Trued-up amount after reconciliation close (variant: actual); null until Reconciliation CLOSED" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | PAID | DISPUTED | VOID" }
      - { name: issued_at, type: string, source: system, description: "ISO datetime when status became ISSUED" }

  - name: Reconciliation
    parent: Lease
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: system, description: "FK -> Lease.id; owning lease" }
      - { name: fiscal_year, type: integer, source: input, description: "Fiscal year (YYYY) being reconciled" }
      - { name: status, type: enum, source: system, description: "OPEN | POSTED | APPROVED | CLOSED | CHALLENGED" }
      - { name: posted_by_user_id, type: string, source: system, description: "Opaque user id of the LeaseAccountant who posted; cannot approve" }
      - { name: approved_by_user_id, type: string, source: system, description: "Opaque user id of the PortfolioManager who approved; MUST differ from posted_by_user_id" }
      - { name: true_up_cents, type: integer, source: computed, description: "Signed delta: sum(final_cents) - sum(estimate_cents) across all RecoveryBilling lines for the year; negative = credit to tenant" }
      - { name: gross_up_applied, type: boolean, source: computed, description: "True if the gross_up rule fired during final_cents computation" }

  - name: CriticalDate
    parent: Lease
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: system, description: "FK -> Lease.id; owning lease" }
      - { name: kind, type: enum, source: input, description: "OPTION_EXERCISE | NOTICE_DEADLINE | EXPIRATION | RENEWAL_WINDOW_OPEN | RENEWAL_WINDOW_CLOSE | AUDIT_WINDOW_CLOSE" }
      - { name: due_date, type: string, source: input, description: "ISO date YYYY-MM-DD" }
      - { name: advance_notice_days, type: integer, source: input, description: "Days before due_date when notification is required", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "PENDING | NOTIFIED | EXERCISED | LAPSED | WAIVED" }
      - { name: linked_amendment_id, type: string, source: input, description: "FK -> Amendment.id; for OPTION_EXERCISE/RENEWAL, the amendment effecting the exercise; null until exercised", constraints: "nullable" }

  - name: ComplianceDoc
    parent: Lease
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: system, description: "FK -> Lease.id; owning lease" }
      - { name: kind, type: enum, source: input, description: "INSURANCE_CERT | ESTOPPEL | FINANCIAL_STMT | SNDA" }
      - { name: period_start, type: string, source: input, description: "Coverage start date, inclusive" }
      - { name: period_end, type: string, source: input, description: "Coverage end date, exclusive (half-open)" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | ACCEPTED | REJECTED | EXPIRED" }
      - { name: rejection_reason, type: string, source: input, description: "Free-text reason; required iff status transitions to REJECTED", constraints: "nullable" }

  - name: Amendment
    parent: Lease
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: system, description: "FK -> Lease.id; owning lease" }
      - { name: kind, type: enum, source: input, description: "EXTENSION | CONTRACTION | EXPANSION | ASSIGNMENT | RENT_CHANGE | USE_CHANGE" }
      - { name: effective_date, type: string, source: input, description: "ISO date on which amendment takes effect" }
      - { name: new_expiration_date, type: string, source: input, description: "New expiration; required iff kind=EXTENSION", constraints: "nullable" }
      - { name: new_leased_sf, type: integer, source: input, description: "New leased square footage; required iff kind=EXPANSION or CONTRACTION", constraints: "nullable, >= 1" }
      - { name: new_base_rent_annual_cents, type: integer, source: input, description: "Replacement annual base rent; required iff kind=RENT_CHANGE", constraints: "nullable, >= 0" }
      - { name: new_tenant_legal_name, type: string, source: input, description: "Assignee legal name; required iff kind=ASSIGNMENT", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "PROPOSED | APPROVED | APPLIED | REJECTED" }

  - name: TenantChallenge
    parent: Lease
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: system, description: "FK -> Lease.id; owning lease" }
      - { name: reconciliation_id, type: string, source: input, description: "FK -> Reconciliation.id; the reconciliation being challenged" }
      - { name: recovery_billing_id, type: string, source: input, description: "FK -> RecoveryBilling.id; optional specific line challenged; null = whole reconciliation", constraints: "nullable" }
      - { name: reason_code, type: enum, source: input, description: "GROSS_UP_DISPUTE | PRO_RATA_DISPUTE | AUDIT_FINDING | MATH_ERROR | POOL_MISCLASS" }
      - { name: claimed_overbilling_cents, type: integer, source: input, description: "Tenant-claimed overbilling amount, cents", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "OPEN | UNDER_REVIEW | RESOLVED_ACCEPTED | RESOLVED_REJECTED | ESCALATED | WITHDRAWN" }
      - { name: round_index, type: integer, source: system, description: "Negotiation round counter; increments on each reopen; max 3" }
      - { name: resolution_delta_cents, type: integer, source: computed, description: "Signed final adjustment agreed upon resolution; negative = credit to tenant" }

  - name: AuditRight
    parent: Lease
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: system, description: "FK -> Lease.id; owning lease" }
      - { name: reconciliation_id, type: string, source: input, description: "FK -> Reconciliation.id; the reconciliation under audit" }
      - { name: invoked_on, type: string, source: input, description: "ISO date audit right was invoked" }
      - { name: window_close_date, type: string, source: computed, description: "ISO date = reconciliation closed_at + AuditRight window (365 days by default)" }
      - { name: status, type: enum, source: system, description: "INVOKED | FIELDWORK | FINDINGS_ISSUED | SETTLED | TIME_BARRED" }
      - { name: findings_delta_cents, type: integer, source: computed, description: "Signed amount auditor found owing; negative = credit to tenant; null until FINDINGS_ISSUED" }

# ============================================================================
# §1.2 State Machine Table
# ============================================================================
state_machines:
  - entity: Lease
    initial_state: DRAFT   # field: status
    terminal_states: [EXPIRED, TERMINATED]
    note: "Lease carries THREE parallel state dimensions: status (lifecycle), abstraction_status (data quality), billing_posture (financial health). They evolve independently."
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /lease-admin/leases/{lease_id}/activate"
        actor: PortfolioManager
        preconditions:
          - "abstraction_status == CERTIFIED (ERR_ABSTRACTION_NOT_CERTIFIED)"
          - "At least one RentScheduleLine covers [commencement_date, expiration_date) with no gap (ERR_SCHEDULE_GAP)"
          - "At least one RecoveryBilling for current fiscal year is DRAFT or ISSUED (ERR_BILLING_NOT_INITIALIZED)"
        side_effects:
          - "Lease.cached_annual_rent_cents recomputed from schedule"
          - "Property.posture recomputed"

      - from: ACTIVE
        to: EXPIRED
        trigger: "system (clock advances to expiration_date)"
        actor: system
        preconditions:
          - "current logical UTC date >= Lease.expiration_date"
        side_effects:
          - "All PENDING CriticalDate rows with due_date <= current date transition to LAPSED"
          - "All OPEN/POSTED Reconciliation rows transition to CLOSED (auto-close at expiration)"
          - "All SUBMITTED/UNDER_REVIEW ComplianceDoc rows transition to EXPIRED"

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /lease-admin/leases/{lease_id}/terminate"
        actor: PortfolioManager
        preconditions:
          - "No RecoveryBilling with status=ISSUED and unpaid amount > 0 (ERR_OUTSTANDING_BILLING)"
          - "No Reconciliation with status=OPEN or CHALLENGED (ERR_OPEN_RECONCILIATION)"
        side_effects:
          - "All PENDING CriticalDate rows transition to WAIVED"
          - "All DRAFT RecoveryBilling rows transition to VOID"
          - "Property.posture recomputed"

      # abstraction_status dimension (parallel)
      - from: PENDING
        to: ABSTRACTED
        trigger: "POST /lease-admin/leases/{lease_id}/abstract"
        actor: Abstractor
        preconditions:
          - "Lease.status == DRAFT (ERR_INVALID_STATE)"
        side_effects:
          - "Lease.abstractor_user_id = X-User-ID"

      - from: ABSTRACTED
        to: CERTIFIED
        trigger: "POST /lease-admin/leases/{lease_id}/certify"
        actor: Certifier
        preconditions:
          - "X-User-ID != Lease.abstractor_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Lease.certifier_user_id = X-User-ID"

      - from: CERTIFIED
        to: PENDING
        trigger: "POST /lease-admin/leases/{lease_id}/reopen-abstraction"
        actor: PortfolioManager
        preconditions:
          - "Lease.status == DRAFT (cannot reopen after activation; amendments must be used instead)"
        side_effects:
          - "Lease.abstractor_user_id = null; certifier_user_id = null"

      # billing_posture dimension (parallel, derived)
      # CURRENT -> FROZEN: any RecoveryBilling transitions to DISPUTED
      # FROZEN -> CURRENT: all RecoveryBilling rows exit DISPUTED
      # CURRENT -> DELINQUENT: any ISSUED RecoveryBilling is unpaid > 60 days past issued_at
      # DELINQUENT -> CURRENT: all past-due ISSUED rows transition to PAID or VOID
      # Implemented as derived recomputation triggered by child state changes.

  - entity: RentScheduleLine
    initial_state: null  # no status field — immutable, no machine
    terminal_states: []
    transitions: []

  - entity: RecoveryBilling
    initial_state: DRAFT
    terminal_states: [PAID, VOID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /lease-admin/recovery-billings/{id}/issue"
        actor: LeaseAccountant
        preconditions:
          - "Lease.status == ACTIVE (ERR_LEASE_NOT_ACTIVE)"
          - "estimate_cents computed from current RecoveryPool.budgeted_cents"
        side_effects:
          - "Lease.cached_recovery_ytd_cents += estimate_cents"
          - "issued_at = current logical UTC"
          - "Lease.billing_posture recomputed"

      - from: ISSUED
        to: PAID
        trigger: "POST /lease-admin/recovery-billings/{id}/mark-paid"
        actor: LeaseAccountant
        preconditions: []
        side_effects:
          - "Lease.billing_posture recomputed (may clear DELINQUENT)"

      - from: ISSUED
        to: DISPUTED
        trigger: "POST /lease-admin/tenant-challenges (links recovery_billing_id)"
        actor: PropertyManager
        preconditions:
          - "The new TenantChallenge.recovery_billing_id == this RecoveryBilling.id"
        side_effects:
          - "Lease.billing_posture transitions to FROZEN (if not already)"
          - "Property.posture recomputed"

      - from: DISPUTED
        to: ISSUED
        trigger: "POST /lease-admin/tenant-challenges/{id}/withdraw"
        actor: PropertyManager
        preconditions:
          - "TenantChallenge.status == OPEN"
        side_effects:
          - "Lease.billing_posture recomputed (may clear FROZEN if no other DISPUTED rows)"

      - from: DRAFT
        to: VOID
        trigger: "POST /lease-admin/recovery-billings/{id}/void OR cascaded from Lease TERMINATED"
        actor: LeaseAccountant
        preconditions: []
        side_effects: []

      - from: ISSUED
        to: VOID
        trigger: "POST /lease-admin/recovery-billings/{id}/void"
        actor: LeaseAccountant
        preconditions:
          - "billing is not yet paid (no payment transaction reference)"
        side_effects:
          - "Lease.cached_recovery_ytd_cents -= estimate_cents"
          - "Lease.billing_posture recomputed"

  - entity: Reconciliation
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: POSTED
        trigger: "POST /lease-admin/reconciliations/{id}/post"
        actor: LeaseAccountant
        preconditions:
          - "All RecoveryPool rows for this Lease's Property with fiscal_year == this.fiscal_year have actual_cents populated (ERR_POOL_NOT_CLOSED)"
        side_effects:
          - "For each RecoveryBilling with matching (lease_id, fiscal_year): final_cents computed via reconciliation_final algorithm"
          - "Reconciliation.true_up_cents = sum(final_cents) - sum(estimate_cents)"
          - "Reconciliation.gross_up_applied = (any pool triggered gross_up rule)"
          - "posted_by_user_id = X-User-ID"
          - "If true_up_cents > 0, generate one new RecoveryBilling for the delta (status=DRAFT, period_index=13 'true-up')"

      - from: POSTED
        to: APPROVED
        trigger: "POST /lease-admin/reconciliations/{id}/approve"
        actor: PortfolioManager
        preconditions:
          - "X-User-ID != posted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "approved_by_user_id = X-User-ID"

      - from: APPROVED
        to: CLOSED
        trigger: "POST /lease-admin/reconciliations/{id}/close"
        actor: PortfolioManager
        preconditions:
          - "No TenantChallenge with status in {OPEN, UNDER_REVIEW, ESCALATED} referencing this reconciliation (ERR_OPEN_CHALLENGE)"
        side_effects:
          - "AuditRight windows open: any AuditRight for this reconciliation computes window_close_date = today + 365 days"

      - from: APPROVED
        to: CHALLENGED
        trigger: "POST /lease-admin/tenant-challenges (links reconciliation_id)"
        actor: PropertyManager
        preconditions:
          - "TenantChallenge.reconciliation_id == this.id"
        side_effects:
          - "Lease.billing_posture recomputed (may transition to FROZEN)"

      - from: CHALLENGED
        to: CLOSED
        trigger: "POST /lease-admin/reconciliations/{id}/close"
        actor: PortfolioManager
        preconditions:
          - "All linked TenantChallenge rows are in {RESOLVED_ACCEPTED, RESOLVED_REJECTED, WITHDRAWN}"
        side_effects: []

  - entity: CriticalDate
    initial_state: PENDING
    terminal_states: [EXERCISED, LAPSED, WAIVED]
    transitions:
      - from: PENDING
        to: NOTIFIED
        trigger: "POST /lease-admin/critical-dates/{id}/notify"
        actor: PropertyManager
        preconditions:
          - "current logical UTC date >= (due_date - advance_notice_days) (ERR_NOTIFICATION_NOT_YET_DUE)"
          - "current logical UTC date < due_date (ERR_NOTIFICATION_WINDOW_MISSED)"
        side_effects: []

      - from: PENDING
        to: EXERCISED
        trigger: "POST /lease-admin/critical-dates/{id}/exercise"
        actor: PropertyManager
        preconditions:
          - "kind IN {OPTION_EXERCISE, RENEWAL_WINDOW_OPEN, RENEWAL_WINDOW_CLOSE} (ERR_NOT_EXERCISABLE)"
          - "linked_amendment_id is provided and references an Amendment with status=APPLIED (ERR_AMENDMENT_NOT_APPLIED)"
          - "current logical UTC date <= due_date (ERR_DATE_PASSED)"
        side_effects:
          - "linked_amendment_id persisted"

      - from: NOTIFIED
        to: EXERCISED
        trigger: "POST /lease-admin/critical-dates/{id}/exercise"
        actor: PropertyManager
        preconditions:
          - "kind IN {OPTION_EXERCISE, RENEWAL_WINDOW_OPEN, RENEWAL_WINDOW_CLOSE}"
          - "linked_amendment_id references an Amendment with status=APPLIED"
          - "current logical UTC date <= due_date"
        side_effects:
          - "linked_amendment_id persisted"

      - from: PENDING
        to: LAPSED
        trigger: "system (clock advance) OR POST /lease-admin/critical-dates/{id}/lapse"
        actor: system
        preconditions:
          - "current logical UTC date > due_date"
        side_effects: []

      - from: NOTIFIED
        to: LAPSED
        trigger: "system (clock advance) OR POST /lease-admin/critical-dates/{id}/lapse"
        actor: system
        preconditions:
          - "current logical UTC date > due_date"
        side_effects: []

      - from: PENDING
        to: WAIVED
        trigger: "POST /lease-admin/critical-dates/{id}/waive OR cascade from Lease TERMINATED"
        actor: PortfolioManager
        preconditions: []
        side_effects: []

      - from: NOTIFIED
        to: WAIVED
        trigger: "POST /lease-admin/critical-dates/{id}/waive"
        actor: PortfolioManager
        preconditions: []
        side_effects: []

  - entity: ComplianceDoc
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, REJECTED, EXPIRED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /lease-admin/compliance-docs/{id}/start-review"
        actor: PropertyManager
        preconditions: []
        side_effects: []

      - from: UNDER_REVIEW
        to: ACCEPTED
        trigger: "POST /lease-admin/compliance-docs/{id}/accept"
        actor: PropertyManager
        preconditions:
          - "No other ACCEPTED ComplianceDoc with same (lease_id, kind) has overlapping [period_start, period_end) (ERR_COVERAGE_OVERLAP)"
        side_effects:
          - "If kind=INSURANCE_CERT and period covers current date, Lease status unchanged; else no-op"

      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /lease-admin/compliance-docs/{id}/reject"
        actor: PropertyManager
        preconditions:
          - "rejection_reason is non-empty (ERR_REJECTION_REASON_REQUIRED)"
        side_effects: []

      - from: SUBMITTED
        to: EXPIRED
        trigger: "system (clock advance)"
        actor: system
        preconditions:
          - "current logical UTC date >= period_end"
        side_effects: []

      - from: ACCEPTED
        to: EXPIRED
        trigger: "system (clock advance)"
        actor: system
        preconditions:
          - "current logical UTC date >= period_end"
        side_effects:
          - "If kind=INSURANCE_CERT, this may leave lease uncovered — Lease.billing_posture recomputed"

  - entity: Amendment
    initial_state: PROPOSED
    terminal_states: [APPLIED, REJECTED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /lease-admin/amendments/{id}/approve"
        actor: PortfolioManager
        preconditions:
          - "Lease.status == ACTIVE (ERR_LEASE_NOT_ACTIVE)"
          - "expected_lease_version in request matches Lease.version (ERR_STALE_VERSION)"
        side_effects:
          - "increments Lease.version by 1"

      - from: APPROVED
        to: APPLIED
        trigger: "POST /lease-admin/amendments/{id}/apply"
        actor: PortfolioManager
        preconditions:
          - "For kind=EXTENSION: new_expiration_date > Lease.expiration_date (ERR_EXTENSION_MUST_EXTEND)"
          - "For kind=EXPANSION: new_leased_sf > Lease.leased_sf (ERR_EXPANSION_MUST_EXPAND)"
          - "For kind=CONTRACTION: new_leased_sf < Lease.leased_sf (ERR_CONTRACTION_MUST_CONTRACT)"
          - "For kind=EXPANSION: new_leased_sf + sum(other ACTIVE leases' leased_sf on same property) <= Property.total_rentable_sf (ERR_PROPERTY_OVERCOMMITTED)"
        side_effects:
          - "Lease fields updated per kind (expiration_date / leased_sf / base_rent_annual_cents / tenant_legal_name)"
          - "increments Lease.version by 1"
          - "If kind=EXTENSION: any PENDING CriticalDate with kind=EXPIRATION and due_date == old expiration_date is transitioned to WAIVED; a new EXPIRATION CriticalDate is created at new_expiration_date"
          - "If kind=RENT_CHANGE: all RentScheduleLine rows with period_start >= effective_date are recomputed using new base_rent_annual_cents (cascades into EscalationStep recompute)"
          - "Lease.cached_annual_rent_cents recomputed"

      - from: PROPOSED
        to: REJECTED
        trigger: "POST /lease-admin/amendments/{id}/reject"
        actor: PortfolioManager
        preconditions: []
        side_effects: []

      - from: APPROVED
        to: REJECTED
        trigger: "POST /lease-admin/amendments/{id}/reject"
        actor: PortfolioManager
        preconditions:
          - " Amendment has not yet been applied"
        side_effects: []

  - entity: TenantChallenge
    initial_state: OPEN
    terminal_states: [RESOLVED_ACCEPTED, RESOLVED_REJECTED, WITHDRAWN]
    note: "cyclic shape: OPEN -> UNDER_REVIEW -> OPEN allowed up to round_index=3 (negotiation rounds)"
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "POST /lease-admin/tenant-challenges/{id}/start-review"
        actor: LeaseAccountant
        preconditions: []
        side_effects: []

      - from: UNDER_REVIEW
        to: OPEN
        trigger: "POST /lease-admin/tenant-challenges/{id}/reopen"
        actor: LeaseAccountant
        preconditions:
          - "round_index < 3 (ERR_MAX_ROUNDS_REACHED)"
        side_effects:
          - "round_index += 1"

      - from: UNDER_REVIEW
        to: RESOLVED_ACCEPTED
        trigger: "POST /lease-admin/tenant-challenges/{id}/resolve (outcome=ACCEPTED, resolution_delta_cents)"
        actor: PortfolioManager
        preconditions:
          - "resolution_delta_cents <= 0 (accepted challenge means credit to tenant; ERR_INVALID_RESOLUTION_SIGN)"
          - "abs(resolution_delta_cents) <= abs(Reconciliation.true_up_cents) when linked to Reconciliation (ERR_RESOLUTION_EXCEEDS_TRUE_UP)"
        side_effects:
          - "Reconciliation.true_up_cents adjusted by resolution_delta_cents"
          - "Lease.cached_recovery_ytd_cents adjusted"
          - "If linked RecoveryBilling was DISPUTED, transitions back to ISSUED"

      - from: UNDER_REVIEW
        to: RESOLVED_REJECTED
        trigger: "POST /lease-admin/tenant-challenges/{id}/resolve (outcome=REJECTED, resolution_delta_cents=0)"
        actor: PortfolioManager
        preconditions:
          - "resolution_delta_cents == 0 (rejected means no adjustment; ERR_INVALID_RESOLUTION_SIGN)"
        side_effects:
          - "If linked RecoveryBilling was DISPUTED, transitions back to ISSUED"

      - from: UNDER_REVIEW
        to: ESCALATED
        trigger: "POST /lease-admin/tenant-challenges/{id}/escalate"
        actor: PropertyManager
        preconditions: []
        side_effects:
          - "Requires AuditRight to be invoked within 30 days of escalation or the challenge auto-reverts to UNDER_REVIEW"

      - from: ESCALATED
        to: RESOLVED_ACCEPTED
        trigger: "POST /lease-admin/audit-rights/{audit_id}/settle (when audit settles in tenant's favor)"
        actor: PortfolioManager
        preconditions:
          - "AuditRight.findings_delta_cents < 0"
        side_effects:
          - "resolution_delta_cents = AuditRight.findings_delta_cents"
          - "Reconciliation.true_up_cents adjusted"

      - from: ESCALATED
        to: RESOLVED_REJECTED
        trigger: "POST /lease-admin/audit-rights/{audit_id}/settle (when audit settles in landlord's favor)"
        actor: PortfolioManager
        preconditions:
          - "AuditRight.findings_delta_cents >= 0"
        side_effects: []

      - from: OPEN
        to: WITHDRAWN
        trigger: "POST /lease-admin/tenant-challenges/{id}/withdraw"
        actor: PropertyManager
        preconditions: []
        side_effects:
          - "If linked RecoveryBilling was DISPUTED, transitions back to ISSUED"
          - "If linked Reconciliation was CHALLENGED and no other open challenges, Reconciliation transitions back to APPROVED"

  - entity: AuditRight
    initial_state: INVOKED
    terminal_states: [SETTLED, TIME_BARRED]
    transitions:
      - from: INVOKED
        to: FIELDWORK
        trigger: "POST /lease-admin/audit-rights/{id}/start-fieldwork"
        actor: PropertyManager
        preconditions:
          - "current logical UTC date < window_close_date (ERR_AUDIT_WINDOW_CLOSED)"
        side_effects: []

      - from: FIELDWORK
        to: FINDINGS_ISSUED
        trigger: "POST /lease-admin/audit-rights/{id}/issue-findings"
        actor: PropertyManager
        preconditions:
          - "current logical UTC date < window_close_date (ERR_AUDIT_WINDOW_CLOSED)"
          - "findings_delta_cents present in payload"
        side_effects:
          - "findings_delta_cents persisted"

      - from: FINDINGS_ISSUED
        to: SETTLED
        trigger: "POST /lease-admin/audit-rights/{id}/settle"
        actor: PortfolioManager
        preconditions: []
        side_effects:
          - "All ESCALATED TenantChallenge rows linked to the same reconciliation resolve (RESOLVED_ACCEPTED if findings_delta_cents < 0 else RESOLVED_REJECTED)"
          - "Reconciliation.true_up_cents adjusted by findings_delta_cents"
          - "Lease.cached_recovery_ytd_cents adjusted"

      - from: INVOKED
        to: TIME_BARRED
        trigger: "system (clock advance)"
        actor: system
        preconditions:
          - "current logical UTC date >= window_close_date"
        side_effects:
          - "Any ESCALATED TenantChallenge on the same reconciliation transitions back to UNDER_REVIEW (audit window missed)"

      - from: FIELDWORK
        to: TIME_BARRED
        trigger: "system (clock advance)"
        actor: system
        preconditions:
          - "current logical UTC date >= window_close_date"
        side_effects:
          - "Any ESCALATED TenantChallenge on the same reconciliation transitions back to UNDER_REVIEW"

# ============================================================================
# §1.2.1 Concurrency Rules
# ============================================================================
concurrency_rules:
  - rule_id: amendment-approve-stale-lease
    parent_entity: Lease
    write_endpoint: "POST /lease-admin/amendments/{id}/approve"
    occ_field: "expected_lease_version"
    description: |
      Approving an Amendment against a Lease whose version has advanced since the
      client last observed it is rejected. This captures the case where another
      writer has just approved a different Amendment against the same Lease
      (advancing Lease.version) and the current writer's view of the lease is
      therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: lease-recertify-stale-lease
    parent_entity: Lease
    write_endpoint: "POST /lease-admin/leases/{lease_id}/reopen-abstraction"
    occ_field: "expected_lease_version"
    description: |
      Reopening a Lease's abstraction against a stale Lease.version is rejected.
      Another writer may have approved an Amendment in the interim (advancing
      Lease.version), making the current writer's reopen premise invalid.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ============================================================================
# §1.3 Calculation Rules Table
# ============================================================================
calculations:
  - name: recovery_billing_estimate
    trigger: "POST /lease-admin/recovery-billings (creation) or when RecoveryPool.budgeted_cents changes"
    algorithm: forward_looking
    formula: |
      # Variant: ESTIMATE — projects full-year cost from budget.
      # Per (lease, fiscal_year, period_index, category):
      pool = RecoveryPool where (property_id = lease.property_id, fiscal_year, category)
      periods_per_year = 12   # monthly billing
      estimate_cents = round_half_up( pool.budgeted_cents * lease.pro_rata_share_bps / 10000 / periods_per_year )
      # Sum across all recoverable categories for the lease's recovery_structure:
      #   NNN:                {CAM, TAX, INSURANCE, UTILITIES, MANAGEMENT_FEE}
      #   MODIFIED_GROSS:     {CAM, TAX}
      #   GROSS:              {}   (no recoveries)
      # The RecoveryBilling row stores the per-pool estimate.
    input_set: "All RecoveryPool rows matching lease.property_id and fiscal_year, filtered by lease.recovery_structure to the recoverable set."
    constants:
      PERIODS_PER_YEAR: 12
      PRO_RATA_DENOM: 10000
    precision: "0 decimal places, round_half_up to whole cents"
    variants:
      - name: estimate
        when: "initial billing cycle, before Reconciliation POSTED"
        difference: "Uses RecoveryPool.budgeted_cents; result is RecoveryBilling.estimate_cents"
      - name: final
        when: "after Reconciliation POSTED"
        difference: "Uses RecoveryPool.actual_cents (with gross-up applied if occupancy < gross_up_floor_pct_bps); result is RecoveryBilling.final_cents; differs from estimate whenever actual != budget or gross-up applies"

  - name: reconciliation_final
    trigger: "POST /lease-admin/reconciliations/{id}/post"
    algorithm: waterfall_allocation
    formula: |
      # Variant: FINAL — trues up to actuals with gross-up rule.
      # Computed per RecoveryBilling of the (lease, fiscal_year):
      # Step 1: compute occupancy_rate_bps for the property for the fiscal year:
      #   occupied_sf = sum(Lease.leased_sf where Lease.status == ACTIVE and Lease.property_id == this property)
      #   occupancy_rate_bps = round_half_up(occupied_sf * 10000 / Property.total_rentable_sf)
      # Step 2: for each RecoveryPool in recoverable set:
      #   if occupancy_rate_bps < pool.gross_up_floor_pct_bps AND pool.category in VARIABLE_SET {CAM, UTILITIES}:
      #     grossed_up_actual = round_half_up(pool.actual_cents * pool.gross_up_floor_pct_bps / occupancy_rate_bps)
      #     gross_up_applied_for_pool = true
      #   else:
      #     grossed_up_actual = pool.actual_cents
      #     gross_up_applied_for_pool = false
      # Step 3: per-pool final_year_share_cents = round_half_up(grossed_up_actual * lease.pro_rata_share_bps / 10000)
      # Step 4: allocate final_year_share_cents across the 12 RecoveryBilling rows for the pool,
      #         waterfall: rows 1..11 get round_half_up(final_year_share_cents / 12), row 12 gets the remainder
      #         to ensure sum(rows) == final_year_share_cents exactly (rounding remainder absorption).
      # Step 5: true_up_cents = sum over all rows (final_cents - estimate_cents).
    input_set: "RecoveryPool rows matching (lease.property_id, fiscal_year); all RecoveryBilling rows matching (lease_id, fiscal_year); ACTIVE leases on the property for occupancy calc."
    constants:
      PERIODS_PER_YEAR: 12
      VARIABLE_SET: "CAM, UTILITIES"
      PRO_RATA_DENOM: 10000
      DEFAULT_GROSS_UP_FLOOR_BPS: 9500
    precision: "0 decimal places, round_half_up; rounding remainder allocated to final period row"
    variants:
      - name: without_gross_up
        when: "occupancy_rate_bps >= pool.gross_up_floor_pct_bps"
        difference: "uses pool.actual_cents directly"
      - name: with_gross_up
        when: "occupancy_rate_bps < pool.gross_up_floor_pct_bps AND category in VARIABLE_SET"
        difference: "scales actual_cents by floor/actual occupancy ratio; yields HIGHER tenant charge than without gross-up when occupancy is low"

  - name: escalated_rent_for_period
    trigger: "RentScheduleLine creation, EscalationStep creation, Amendment apply of kind=RENT_CHANGE"
    algorithm: chronological
    formula: |
      # Computes RentScheduleLine.effective_rent_cents for a single line.
      # Evaluation order is pinned:
      #   1. base = line.base_rent_cents
      #   2. if line.escalation_step_id is null: effective = base; done.
      #   3. step = EscalationStep[line.escalation_step_id]
      #   4. if step.kind == FIXED_PCT:      effective = round_half_up(base * (10000 + step.pct_bps) / 10000)
      #      elif step.kind == CPI_LOOKUP:    effective = round_half_up(base * (10000 + cpi_lookup(step.effective_on)) / 10000)
      #                                          where cpi_lookup returns pct_bps from a fixed table
      #                                          pinned at 250 bps for any date (deterministic for tests)
      #      elif step.kind == STEPPED_AMOUNT: effective = base + step.amount_cents
      #   5. round per line (round-half-up to cents); DO NOT sum then round.
      # Rounding order is significant: per-line rounding then summing produces
      # different cents than summing then rounding when many lines are aggregated
      # into annual totals. The scaffold pins PER-LINE rounding.
    input_set: "Single RentScheduleLine + its EscalationStep."
    constants:
      CPI_LOOKUP_BPS: 250
      PCT_DENOM: 10000
    precision: "per-line round_half_up to cents; annual totals are sums of already-rounded lines"

  - name: annual_rent_total
    trigger: "Lease activate, Amendment apply (RENT_CHANGE), RentScheduleLine create/delete"
    algorithm: aggregation
    formula: |
      # Lease.cached_annual_rent_cents for the current fiscal year.
      # Sums RentScheduleLine.effective_rent_cents where period overlaps the current
      # logical UTC fiscal year (fiscal year boundary = Property.fiscal_year_end_month).
      # Because each line is already rounded, the total is sum of cents (no further rounding).
      # Overlap test: line.period_start < fiscal_year_end AND line.period_end > fiscal_year_start
      #   (half-open interval overlap; boundary-exclusive on both ends).
      # Pro-ration for partial-year lines is NOT performed — full line amount counts
      # if any overlap exists.
    input_set: "All RentScheduleLine rows for the lease overlapping the current fiscal year."
    constants: {}
    precision: "integer cents; no additional rounding"

  - name: straight_line_rent
    trigger: "GET /lease-admin/leases/{id}/rent-roll?basis=straight_line"
    algorithm: forward_looking
    formula: |
      # Dual variant to annual_rent_total: GAAP straight-line rent for the lease term.
      # total_term_rent_cents = sum(RentScheduleLine.effective_rent_cents over ALL lines)
      # term_days = sum(line.period_end - line.period_start in days over all lines)
      # straight_line_daily_cents = total_term_rent_cents / term_days  (kept as exact rational)
      # For a given fiscal year window [fy_start, fy_end):
      #   fy_days_in_term = sum over lines overlapping window of (overlap_days)
      #   straight_line_fy_cents = round_half_up(total_term_rent_cents * fy_days_in_term / term_days)
      # This variant differs from annual_rent_total whenever escalations are non-flat,
      # because straight-lining smooths escalations across the term.
    input_set: "All RentScheduleLine rows for the lease (no fiscal year filter for total, then overlap-count for fiscal slice)."
    constants: {}
    precision: "round_half_up to cents; intermediate divisions kept as exact rationals"
    variants:
      - name: cash_basis
        when: "rent-roll?basis=cash (default)"
        difference: "uses annual_rent_total — sums scheduled effective_rent_cents in the fiscal year"
      - name: straight_line_basis
        when: "rent-roll?basis=straight_line"
        difference: "smooths total term rent evenly per day, allocates by overlap days into fiscal year"

  - name: audit_window_close
    trigger: "Reconciliation APPROVED -> CLOSED transition"
    algorithm: chronological
    formula: |
      # AuditRight.window_close_date = Reconciliation.closed_date + 365 days
      # If 365 days lands on a weekend, do NOT roll forward (fixed calendar rule).
      # Boundary: invocation at window_close_date exactly is REJECTED (strict inequality current < window_close).
    input_set: "Single AuditRight + linked Reconciliation"
    constants:
      WINDOW_DAYS: 365
    precision: "calendar date arithmetic, no rounding"

  - name: occupancy_rate
    trigger: "reconciliation_final (Step 1), POST /lease-admin/properties/{id}/occupancy-report"
    algorithm: aggregation
    formula: |
      # occupancy_rate_bps for a property in a fiscal year
      # occupied_sf = sum(Lease.leased_sf WHERE Lease.property_id == this.id AND Lease.status == ACTIVE
      #                    AND Lease.commencement_date < fiscal_year_end AND Lease.expiration_date > fiscal_year_start)
      # occupancy_rate_bps = round_half_up(occupied_sf * 10000 / Property.total_rentable_sf)
      # Edge: when occupied_sf == 0, occupancy_rate_bps = 0 (gross-up rule uses default floor).
      # Tie-break when computing which leases count: none needed — sum is order-insensitive.
    input_set: "All Lease rows on the property that are ACTIVE and overlap the fiscal year."
    constants:
      BPS_DENOM: 10000
    precision: "0 decimal places bps, round_half_up"

# ============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# ============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header must be present and one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role must be authorized for the endpoint per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path-templated ids must resolve, validated left-to-right (property_id before lease_id before child id)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: business_constraint
    check: "Required request-body fields present and well-typed (e.g., dates in ISO YYYY-MM-DD, enums in declared set, integers in range)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 5
    category: business_temporal
    check: "Period fields must be temporally well-formed: period_start < period_end, commencement_date < expiration_date, due_date >= today (for new CriticalDate), effective_date >= Lease.commencement_date"
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 422
    applies_to: "entity-creation endpoints, Amendment apply"

  - priority: 6
    category: state
    check: "Target resource must be in the correct state for the requested transition (e.g., POST /issue requires DRAFT, /approve requires PROPOSED, /mark-paid requires ISSUED)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: business_safety
    check: "Segregation of duties: X-User-ID for certify must differ from abstractor_user_id; X-User-ID for Reconciliation approve must differ from posted_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /lease-admin/leases/{id}/certify, POST /lease-admin/reconciliations/{id}/approve"

  - priority: 8
    category: business_referential
    check: "Referenced entities must exist and be in compatible state: escalation_step_id must reference an existing EscalationStep on the same lease; linked_amendment_id must reference an Amendment in APPLIED state; recovery_billing_id must reference a RecoveryBilling in ISSUED state"
    error_id: ERR_REFERENTIAL_INTEGRITY
    http_status: 422
    applies_to: "creation/action endpoints with cross-references"

  - priority: 9
    category: business_constraint
    check: "Interval overlap: new RentScheduleLine must not overlap an existing line on the same lease (half-open [start, end) overlap: new.start < existing.end AND new.end > existing.start)"
    error_id: ERR_SCHEDULE_OVERLAP
    http_status: 409
    applies_to: "POST /lease-admin/leases/{id}/rent-schedule-lines"

  - priority: 10
    category: business_constraint
    check: "Coverage overlap: accepting a ComplianceDoc requires no other ACCEPTED doc with same (lease_id, kind) has overlapping coverage window"
    error_id: ERR_COVERAGE_OVERLAP
    http_status: 409
    applies_to: "POST /lease-admin/compliance-docs/{id}/accept"

  - priority: 11
    category: business_constraint
    check: "Aggregate capacity: Amendment kind=EXPANSION requires (new_leased_sf + sum(other ACTIVE leases' leased_sf)) <= Property.total_rentable_sf"
    error_id: ERR_PROPERTY_OVERCOMMITTED
    http_status: 409
    applies_to: "POST /lease-admin/amendments/{id}/apply"

  - priority: 12
    category: business_fiscal
    check: "Fiscal gates: activation requires at least one DRAFT/ISSUED RecoveryBilling for current FY; termination requires no outstanding ISSUED unpaid RecoveryBilling and no OPEN/CHALLENGED Reconciliation; reconciliation close requires no open TenantChallenge"
    error_id: "ERR_BILLING_NOT_INITIALIZED | ERR_OUTSTANDING_BILLING | ERR_OPEN_RECONCILIATION | ERR_OPEN_CHALLENGE"
    http_status: 409
    applies_to: "activate, terminate, close"

  - priority: 13
    category: business_temporal
    check: "Window checks: CriticalDate notify requires (due_date - advance_notice_days) <= today < due_date; CriticalDate exercise requires today <= due_date; AuditRight fieldwork/issue-findings require today < window_close_date"
    error_id: "ERR_NOTIFICATION_NOT_YET_DUE | ERR_NOTIFICATION_WINDOW_MISSED | ERR_DATE_PASSED | ERR_AUDIT_WINDOW_CLOSED"
    http_status: 409
    applies_to: "notify, exercise, start-fieldwork, issue-findings"

  - priority: 14
    category: business_constraint
    check: "OCC precondition: expected_lease_version in request must match Lease.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /lease-admin/amendments/{id}/approve, POST /lease-admin/leases/{id}/reopen-abstraction"

# ============================================================================
# §1.5 API Endpoint Table
# ============================================================================
endpoints:
  # --- System clock (test-driving) ---
  - method: POST
    path: "/lease-admin/_clock/set_current_utc"
    description: "Set the server's logical UTC clock. At server startup the clock defaults to 2026-05-01T00:00:00Z and does NOT fall back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["Triggers date-driven system transitions (Lease EXPIRED auto-transition, CriticalDate LAPSED, ComplianceDoc EXPIRED, AuditRight TIME_BARRED)"]

  # --- Property ---
  - method: POST
    path: "/lease-admin/properties"
    description: "Create a Property"
    roles: [PlatformAdmin]
    code: 201
    input: [name, address, total_rentable_sf, fiscal_year_end_month]
    output: Property
    side_effects: ["posture=OPERATING"]

  - method: GET
    path: "/lease-admin/properties/{property_id}"
    description: "Get one Property"
    roles: [PlatformAdmin, PortfolioManager, PropertyManager, LeaseAccountant, Abstractor, Certifier]
    code: 200
    input: []
    output: Property
    side_effects: []

  - method: GET
    path: "/lease-admin/properties"
    description: "List Properties (paginated)"
    roles: [PlatformAdmin, PortfolioManager, PropertyManager, LeaseAccountant, Abstractor, Certifier]
    code: 200
    input: ["limit?", "offset?"]
    output: Property[]
    side_effects: []

  - method: GET
    path: "/lease-admin/properties/{property_id}/occupancy-report"
    description: "Computed occupancy for a fiscal year"
    roles: [PlatformAdmin, PortfolioManager, PropertyManager, LeaseAccountant]
    code: 200
