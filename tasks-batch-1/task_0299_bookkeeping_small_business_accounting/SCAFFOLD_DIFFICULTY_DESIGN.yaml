# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index) — task_0299
# Nine §0.5 Difficulty Rules × 2 instances each = 18 instances.
# Every grounds ref resolves into SCAFFOLD.yaml §1.1–§1.7.
# All formula-derived asserts are pre-computed literals.
#
# Canonical base setup (referenced conceptually by many instances):
#   Owner creates Company -> 7 accounts (Cash/AR/AP/Revenue/Expense/TaxLiab/RetEarn)
#   -> PATCH company to pin retained_earnings_account_id (company.version 1->2)
#   -> open AccountingPeriod (expected_company_version=2; company.version 2->3).
#   created_by_user_id is the X-User-ID of the drafter; a different X-User-ID posts.
# =============================================================================

scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: account_balance_posted_vs_projected_revenue
        grounds:
          - calculations.account_balance
          - entities.Account.fields.posted_balance_cents
          - endpoints["GET /ledger/accounts/{accountId}/balance"]
          - state_machines.JournalEntry.DRAFT_to_POSTED
        distinguishing_aspect: |
          Same revenue account, two algorithms over different inclusion sets: the POSTED
          variant (posted_balance_cents) counts only POSTED lines = 100000; the PROJECTED
          variant (include_drafts=true) adds the DRAFT entry = 130000. Domain = Account.
        test_recipe:
          setup:
            - "Company with an OPEN period; a REVENUE account."
            - "One POSTED JournalEntry credits revenue 100000 (debit AR 100000)."
            - "One DRAFT JournalEntry credits revenue 30000 (debit AR 30000), never posted."
          setup_api_calls:
            - call: "POST /ledger/companies"
              payload: { legal_name: "Acme", base_currency: "USD", accounting_basis: "ACCRUAL" }
              as: Owner
              as_user_id: "u_owner"
              captures: { co: $.data.id, co_v1: $.data.version }
            - call: "POST /ledger/accounts"
              payload: { company_id: "${co}", code: "1000", name: "Cash", account_type: "ASSET", is_cash: true }
              as: Owner
              as_user_id: "u_owner"
              captures: { cash: $.data.id }
            - call: "POST /ledger/accounts"
              payload: { company_id: "${co}", code: "1100", name: "AR", account_type: "ASSET" }
              as: Owner
              as_user_id: "u_owner"
              captures: { ar: $.data.id }
            - call: "POST /ledger/accounts"
              payload: { company_id: "${co}", code: "4000", name: "Revenue", account_type: "REVENUE" }
              as: Owner
              as_user_id: "u_owner"
              captures: { rev: $.data.id }
            - call: "POST /ledger/accounts"
              payload: { company_id: "${co}", code: "3900", name: "Retained Earnings", account_type: "EQUITY" }
              as: Owner
              as_user_id: "u_owner"
              captures: { re: $.data.id }
            - call: "PATCH /ledger/companies/${co}"
              payload: { retained_earnings_account_id: "${re}", expected_company_version: "${co_v1}" }
              as: Owner
              as_user_id: "u_owner"
              captures: { co_v2: $.data.version }
            - call: "POST /ledger/accounting-periods"
              payload: { company_id: "${co}", period_label: "2026-01", start_date: "2026-01-01T00:00:00.000Z", end_date: "2026-02-01T00:00:00.000Z", expected_company_version: "${co_v2}" }
              as: Owner
              as_user_id: "u_owner"
              captures: { per: $.data.id }
            - call: "POST /ledger/journal-entries"
              payload: { company_id: "${co}", period_id: "${per}", entry_date: "2026-01-10T00:00:00.000Z", memo: "posted sale" }
              as: Bookkeeper
              as_user_id: "u_book"
              captures: { je_p: $.data.id }
            - call: "POST /ledger/journal-lines"
              payload: { journal_entry_id: "${je_p}", account_id: "${ar}", debit_cents: 100000 }
              as: Bookkeeper
              as_user_id: "u_book"
            - call: "POST /ledger/journal-lines"
              payload: { journal_entry_id: "${je_p}", account_id: "${rev}", credit_cents: 100000 }
              as: Bookkeeper
              as_user_id: "u_book"
            - call: "POST /ledger/journal-entries/${je_p}/post"
              payload: {}
              as: Accountant
              as_user_id: "u_acct"
            - call: "POST /ledger/journal-entries"
              payload: { company_id: "${co}", period_id: "${per}", entry_date: "2026-01-11T00:00:00.000Z", memo: "draft sale" }
              as: Bookkeeper
              as_user_id: "u_book"
              captures: { je_d: $.data.id }
            - call: "POST /ledger/journal-lines"
              payload: { journal_entry_id: "${je_d}", account_id: "${ar}", debit_cents: 30000 }
              as: Bookkeeper
              as_user_id: "u_book"
            - call: "POST /ledger/journal-lines"
              payload: { journal_entry_id: "${je_d}", account_id: "${rev}", credit_cents: 30000 }
              as: Bookkeeper
              as_user_id: "u_book"
          trigger:
            - call: "GET /ledger/accounts/${rev}/balance"
              payload: {}
              as: Accountant
              as_user_id: "u_acct"
              captures: { posted: $.data.posted_balance_cents, projected: $.data.projected_balance_cents }
          assert:
            - "GET /ledger/accounts/${rev}/balance posted_balance_cents == 100000"
            - "GET /ledger/accounts/${rev}/balance?include_drafts=true projected_balance_cents == 130000"
            - "projected_balance_cents - posted_balance_cents == 30000"

      - name: vendor_1099_cash_vs_accrual
        grounds:
          - calculations.vendor_1099_total
          - entities.Vendor.fields.ytd_1099_total_cents
          - entities.Company.fields.accounting_basis
          - endpoints["GET /ledger/vendors/{vendorId}/1099"]
        distinguishing_aspect: |
          1099 total on a Vendor under two algorithms: ACCRUAL counts bill totals by bill_date
          (350000 = 200000 paid + 150000 unpaid), CASH counts only amounts paid in the year
          (200000). Domain = Vendor (distinct from the Account-domain dual-variant above).
        test_recipe:
          setup:
            - "Two companies sharing identical vendor/bill data but accounting_basis ACCRUAL vs CASH."
            - "1099-eligible vendor; Bill A total 200000 approved and fully paid in 2026; Bill B total 150000 approved (bill_date 2026) but UNPAID."
          setup_api_calls:
            - call: "POST /ledger/companies"
              payload: { legal_name: "AccrualCo", base_currency: "USD", accounting_basis: "ACCRUAL" }
              as: Owner
              as_user_id: "u_owner"
              captures: { co: $.data.id, co_v1: $.data.version }
            - call: "POST /ledger/accounts"
              payload: { company_id: "${co}", code: "1000", name: "Cash", account_type: "ASSET", is_cash: true }
              as: Owner
              as_user_id: "u_owner"
              captures: { cash: $.data.id }
            - call: "POST /ledger/accounts"
              payload: { company_id: "${co}", code: "2000", name: "AP", account_type: "LIABILITY" }
              as: Owner
              as_user_id: "u_owner"
              captures: { ap: $.data.id }
            - call: "POST /ledger/accounts"
              payload: { company_id: "${co}", code: "6000", name: "Expense", account_type: "EXPENSE" }
              as: Owner
              as_user_id: "u_owner"
              captures: { exp: $.data.id }
            - call: "POST /ledger/accounts"
              payload: { company_id: "${co}", code: "3900", name: "Retained Earnings", account_type: "EQUITY" }
              as: Owner
              as_user_id: "u_owner"
              captures: { re: $.data.id }
            - call: "POST /ledger/bank-accounts"
              payload: { company_id: "${co}", gl_account_id: "${cash}", nickname: "Checking" }
              as: Owner
              as_user_id: "u_owner"
              captures: { bank: $.data.id }
            - call: "PATCH /ledger/companies/${co}"
              payload: { retained_earnings_account_id: "${re}", expected_company_version: "${co_v1}" }
              as: Owner
              as_user_id: "u_owner"
              captures: { co_v2: $.data.version }
            - call: "POST /ledger/accounting-periods"
              payload: { company_id: "${co}", period_label: "2026-01", start_date: "2026-01-01T00:00:00.000Z", end_date: "2026-02-01T00:00:00.000Z", expected_company_version: "${co_v2}" }
              as: Owner
              as_user_id: "u_owner"
              captures: { per: $.data.id }
            - call: "POST /ledger/vendors"
              payload: { company_id: "${co}", display_name: "Contractor Bob", ap_account_id: "${ap}", is_1099_eligible: true }
              as: Accountant
              as_user_id: "u_acct"
              captures: { ven: $.data.id }
            - call: "POST /ledger/bills"
              payload: { company_id: "${co}", vendor_id: "${ven}", expense_account_id: "${exp}", bill_date: "2026-01-05T00:00:00.000Z", lines: [ { description: "work A", amount_cents: 200000, use_taxable: false } ] }
              as: Bookkeeper
              as_user_id: "u_book"
              captures: { billA: $.data.id }
            - call: "POST /ledger/bills/${billA}/approve"
              payload: {}
              as: Accountant
              as_user_id: "u_acct"
            - call: "POST /ledger/bills/${billA}/record-payment"
              payload: { pay_from_bank_account_id: "${bank}", amount_cents: 200000, payment_date: "2026-01-20T00:00:00.000Z" }
              as: Accountant
              as_user_id: "u_acct"
            - call: "POST /ledger/bills"
              payload: { company_id: "${co}", vendor_id: "${ven}", expense_account_id: "${exp}", bill_date: "2026-01-08T00:00:00.000Z", lines: [ { description: "work B", amount_cents: 150000, use_taxable: false } ] }
              as: Bookkeeper
              as_user_id: "u_book"
              captures: { billB: $.data.id }
            - call: "POST /ledger/bills/${billB}/approve"
              payload: {}
              as: Accountant
              as_user_id: "u_acct"
          trigger:
            - call: "GET /ledger/vendors/${ven}/1099"
              payload: {}
              as: Accountant
              as_user_id: "u_acct"
              captures: { total: $.data.ytd_1099_total_cents, basis: $.data.basis }
          assert:
            - "GET /ledger/vendors/${ven}/1099 basis == ACCRUAL"
            - "GET /ledger/vendors/${ven}/1099 ytd_1099_total_cents == 350000"
            - "Vendor.${ven}.ytd_1099_total_cents == 350000"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: bill_use_tax_per_line_round_then_sum
        grounds:
          - calculations.bill_use_tax_total
          - entities.Bill.fields.use_tax_cents
          - state_machines.Bill.DRAFT_to_APPROVED
          - endpoints["POST /ledger/bills/{billId}/approve"]
        distinguishing_aspect: |
          Mode (b) nested rounding: three use-taxable lines of 100 cents at 875 bps. Round PER LINE
          then sum = 27; sum-then-round would be 26. The scaffold pins per-line-then-sum, so
          use_tax_cents must equal 27, not 26.
        test_recipe:
          setup:
            - "Company with OPEN period, AP/Expense/Cash accounts, a TaxRate 875 bps for the company default jurisdiction effective over bill_date."
            - "Bill with three use_taxable lines of 100 cents each."
          setup_api_calls:
            - call: "POST /ledger/companies"
              payload: { legal_name: "TaxCo", base_currency: "USD", accounting_basis: "ACCRUAL" }
              as: Owner
              as_user_id: "u_owner"
              captures: { co: $.data.id, co_v1: $.data.version }
            - call: "POST /ledger/accounts"
              payload: { company_id: "${co}", code: "2000", name: "AP", account_type: "LIABILITY" }
              as: Owner
              as_user_id: "u_owner"
              captures: { ap: $.data.id }
            - call: "POST /ledger/accounts"
              payload: { company_id: "${co}", code: "6000", name: "Expense", account_type: "EXPENSE" }
              as: Owner
              as_user_id: "u_owner"
              captures: { exp: $.data.id }
            - call: "POST /ledger/accounts"
              payload: { company_id: "${co}", code: "3900", name: "Retained Earnings", account_type: "EQUITY" }
              as: Owner
              as_user_id: "u_owner"
              captures: { re: $.data.id }
            - call: "PATCH /ledger/companies/${co}"
              payload: { retained_earnings_account_id: "${re}", expected_company_version: "${co_v1}" }
              as: Owner
              as_user_id: "u_owner"
              captures: { co_v2: $.data.version }
            - call: "POST /ledger/accounting-periods"
              payload: { company_id: "${co}", period_label: "2026-01", start_date: "2026-01-01T00:00:00.000Z", end_date: "2026-02-01T00:00:00.000Z", expected_company_version: "${co_v2}" }
              as: Owner
              as_user_id: "u_owner"
              captures: { per: $.data.id }
            - call: "POST /ledger/tax-rates"
              payload: { company_id: "${co}", jurisdiction: "DEFAULT", rate_bps: 875, effective_from: "2026-01-01T00:00:00.000Z", effective_to: "2027-01-01T00:00:00.000Z" }
              as: Accountant
              as_user_id: "u_acct"
            - call: "POST /ledger/vendors"
              payload: { company_id: "${co}", display_name: "Supplier", ap_account_id: "${ap}", is_1099_eligible: false }
              as: Accountant
              as_user_id: "u_acct"
              captures: { ven: $.data.id }
            - call: "POST /ledger/bills"
              payload: { company_id: "${co}", vendor_id: "${ven}", expense_account_id: "${exp}", bill_date: "2026-01-09T00:00:00.000Z", lines: [ { description: "a", amount_cents: 100, use_taxable: true }, { description: "b", amount_cents: 100, use_taxable: true }, { description: "c", amount_cents: 100, use_taxable: true } ] }
              as: Bookkeeper
              as_user_id: "u_book"
              captures: { bill: $.data.id }
          trigger:
            - call: "POST /ledger/bills/${bill}/approve"
              payload: {}
              as: Accountant
              as_user_id: "u_acct"
              captures: { st: $.data.status, ut: $.data.use_tax_cents, tot: $.data.total_cents }
          assert:
            - "Bill.${bill}.subtotal_cents == 300"
            - "Bill.${bill}.use_tax_cents == 27"
            - "Bill.${bill}.total_cents == 327"
            - "Bill.${bill}.status == APPROVED"

      - name: invoice_total_discount_tier_then_tax_eval_order
        grounds:
          - calculations.invoice_total_breakdown
          - entities.Invoice.fields.discount_cents
          - entities.Invoice.fields.tax_cents
          - state_machines.Invoice.DRAFT_to_SENT
        distinguishing_aspect: |
          Mode (c) pinned evaluation order: taxable_subtotal 500000 -> tier1 discount 5% (25000) ->
          tax computed on the DISCOUNTED base 475000 at 1000 bps = 47500 (NOT 50000 on the full base) ->
          total 522500. Distinct mode from the per-line-rounding instance above.
        test_recipe:
          setup:
            - "Company with OPEN period, AR/Revenue/TaxLiability accounts, a Customer in jurisdiction CA, TaxRate 1000 bps for CA effective over issue_date."
            - "Invoice with one taxable line qty 1 unit_price 500000 (taxable_subtotal exactly at the 5% tier boundary)."
          setup_api_calls:
            - call: "POST /ledger/companies"
              payload: { legal_name: "InvCo", base_currency: "USD", accounting_basis: "ACCRUAL" }
              as: Owner
              as_user_id: "u_owner"
              captures: { co: $.data.id, co_v1: $.data.version }
            - call: "POST /ledger/accounts"
              payload: { company_id: "${co}", code: "1100", name: "AR", account_type: "ASSET" }
              as: Owner
              as_user_id: "u_owner"
              captures: { ar: $.data.id }
            - call: "POST /ledger/accounts"
              payload: { company_id: "${co}", code: "4000", name: "Revenue", account_type: "REVENUE" }
              as: Owner
              as_user_id: "u_owner"
              captures: { rev: $.data.id }
            - call: "POST /ledger/accounts"
              payload: { company_id: "${co}", code: "2200", name: "Sales Tax Payable", account_type: "LIABILITY" }
              as: Owner
              as_user_id: "u_owner"
              captures: { taxliab: $.data.id }
            - call: "POST /ledger/accounts"
              payload: { company_id: "${co}", code: "3900", name: "Retained Earnings", account_type: "EQUITY" }
              as: Owner
              as_user_id: "u_owner"
              captures: { re: $.data.id }
            - call: "PATCH /ledger/companies/${co}"
              payload: { retained_earnings_account_id: "${re}", expected_company_version: "${co_v1}" }
              as: Owner
              as_user_id: "u_owner"
              captures: { co_v2: $.data.version }
            - call: "POST /ledger/accounting-periods"
              payload: { company_id: "${co}", period_label: "2026-01", start_date: "2026-01-01T00:00:00.000Z", end_date: "2026-02-01T00:00:00.000Z", expected_company_version: "${co_v2}" }
              as: Owner
              as_user_id: "u_owner"
              captures: { per: $.data.id }
            - call: "POST /ledger/tax-rates"
              payload: { company_id: "${co}", jurisdiction: "CA", rate_bps: 1000, effective_from: "2026-01-01T00:00:00.000Z", effective_to: "2027-01-01T00:00:00.000Z" }
              as: Accountant
              as_user_id: "u_acct"
            - call: "POST /ledger/customers"
              payload: { company_id: "${co}", display_name: "BigBuyer", tax_jurisdiction: "CA", ar_account_id: "${ar}" }
              as: Bookkeeper
              as_user_id: "u_book"
              captures: { cust: $.data.id }
            - call: "POST /ledger/invoices"
              payload: { company_id: "${co}", customer_id: "${cust}", revenue_account_id: "${rev}", tax_liability_account_id: "${taxliab}", issue_date: "2026-01-15T00:00:00.000Z", lines: [ { description: "widgets", quantity: 1, unit_price_cents: 500000, taxable: true } ] }
              as: Bookkeeper
              as_user_id: "u_book"
              captures: { inv: $.data.id }
          trigger:
            - call: "POST /ledger/invoices/${inv}/send"
              payload: {}
              as: Accountant
              as_user_id: "u_acct"
              captures: { disc: $.data.discount_cents, tax: $.data.tax_cents, tot: $.data.total_cents }
          assert:
            - "Invoice.${inv}.taxable_subtotal_cents == 500000"
            - "Invoice.${inv}.discount_cents == 25000"
            - "Invoice.${inv}.tax_cents == 47500"
            - "Invoice.${inv}.total_cents == 522500"
            - "Invoice.${inv}.delivery_status == SENT"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: bank_feed_transaction_categorize_recategorize_cycle
        grounds:
          - state_machines.BankFeedTransaction.UNMATCHED_to_CATEGORIZED
          - state_machines.BankFeedTransaction.CATEGORIZED_to_UNMATCHED
          - entities.BankFeedTransaction.fields.status
        distinguishing_aspect: |
          Cyclic machine on BankFeedTransaction: UNMATCHED->CATEGORIZED->UNMATCHED, returning to the
          start state and re-incrementing version. Non-linear via the back-edge. Entity =
          BankFeedTransaction.
        test_recipe:
          setup:
            - "Company with OPEN period, Cash GL + BankAccount, an Expense account, one UNMATCHED bank-feed transaction (withdrawal -20000) on 2026-01-10."
          setup_api_calls:
            - call: "POST /ledger/companies"
              payload: { legal_name: "FeedCo", base_currency: "USD", accounting_basis: "ACCRUAL" }
              as: Owner
              as_user_id: "u_owner"
              captures: { co: $.data.id, co_v1: $.data.version }
            - call: "POST /ledger/accounts"
              payload: { company_id: "${co}", code: "1000", name: "Cash", account_type: "ASSET", is_cash: true }
              as: Owner
              as_user_id: "u_owner"
              captures: { cash: $.data.id }
            - call: "POST /ledger/accounts"
              payload: { company_id: "${co}", code: "6000", name: "Expense", account_type: "EXPENSE" }
              as: Owner
              as_user_id: "u_owner"
              captures: { exp: $.data.id }
            - call: "POST /ledger/accounts"
              payload: { company_id: "${co}", code: "3900", name: "Retained Earnings", account_type: "EQUITY" }
              as: Owner
              as_user_id: "u_owner"
              captures: { re: $.data.id }
            - call: "POST /ledger/bank-accounts"
              payload: { company_id: "${co}", gl_account_id: "${cash}", nickname: "Checking" }
              as: Owner
              as_user_id: "u_owner"
              captures: { bank: $.data.id }
            - call: "PATCH /ledger/companies/${co}"
              payload: { retained_earnings_account_id: "${re}", expected_company_version: "${co_v1}" }
              as: Owner
              as_user_id: "u_owner"
              captures: { co_v2: $.data.version }
            - call: "POST /ledger/accounting-periods"
              payload: { company_id: "${co}", period_label: "2026-01", start_date: "2026-01-01T00:00:00.000Z", end_date: "2026-02-01T00:00:00.000Z", expected_company_version: "${co_v2}" }
              as: Owner
              as_user_id: "u_owner"
              captures: { per: $.data.id }
            - call: "POST /ledger/bank-feed-transactions"
              payload: { company_id: "${co}", bank_account_id: "${bank}", posted_date: "2026-01-10T00:00:00.000Z", amount_cents: -20000, bank_description: "OFFICE SUPPLY" }
              as: Bookkeeper
              as_user_id: "u_book"
              captures: { txn: $.data.id }
            - call: "POST /ledger/bank-feed-transactions/${txn}/categorize"
              payload: { counter_account_id: "${exp}" }
              as: Bookkeeper
              as_user_id: "u_book"
              captures: { je1: $.data.journal_entry_id }
          trigger:
            - call: "POST /ledger/bank-feed-transactions/${txn}/recategorize"
              payload: {}
              as: Bookkeeper
              as_user_id: "u_book"
              captures: { st: $.data.status, je2: $.data.journal_entry_id }
          assert:
            - "BankFeedTransaction.${txn}.status == UNMATCHED"
            - "BankFeedTransaction.${txn}.journal_entry_id == null"
            - "JournalEntry.${je1}.status == VOIDED"
            - "Account.${exp}.posted_balance_cents == 0"

      - name: invoice_parallel_delivery_and_payment_axes
        grounds:
          - state_machines.Invoice.DRAFT_to_SENT
          - entities.Invoice.fields.delivery_status
          - entities.Invoice.fields.payment_status
          - calculations.invoice_balance_and_payment_status
        distinguishing_aspect: |
          Parallel state dimensions on Invoice: delivery_status (DRAFT->SENT) and payment_status
          (UNPAID->PARTIALLY_PAID) evolve independently — a partial payment moves payment_status to
          PARTIALLY_PAID while delivery_status stays SENT. Entity = Invoice (distinct from
          BankFeedTransaction).
        test_recipe:
          setup:
            - "Company with OPEN period; AR/Revenue/TaxLiability/Cash accounts + BankAccount; Customer jurisdiction NONE (no tax rate)."
            - "Invoice with one non-taxable line qty 1 unit_price 100000; SENT (total 100000), then a partial payment of 40000."
          setup_api_calls:
            - call: "POST /ledger/companies"
              payload: { legal_name: "ParCo", base_currency: "USD", accounting_basis: "ACCRUAL" }
              as: Owner
              as_user_id: "u_owner"
              captures: { co: $.data.id, co_v1: $.data.version }
            - call: "POST /ledger/accounts"
              payload: { company_id: "${co}", code: "1000", name: "Cash", account_type: "ASSET", is_cash: true }
              as: Owner
              as_user_id: "u_owner"
              captures: { cash: $.data.id }
            - call: "POST /ledger/accounts"
              payload: { company_id: "${co}", code: "1100", name: "AR", account_type: "ASSET" }
              as: Owner
              as_user_id: "u_owner"
              captures: { ar: $.data.id }
            - call: "POST /ledger/accounts"
