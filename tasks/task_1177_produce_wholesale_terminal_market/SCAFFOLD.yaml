# =============================================================================
# Task 1177 — Produce Wholesale & Terminal Market Operations (Hunts Point)
# Scaffold seed tables (§1.0–§1.7)
# =============================================================================

scenario: |
  generate task hard than expert level! 1177. Produce Wholesale & Terminal Market Operations (Hunts Point terminal market): daily market price & lot purchase, grade/pack & USDA inspection dispute, ripening room scheduling & ethylene control, shrink/dump accounting & credit memo, PACA trust protection & prompt payment, cross-dock & repack labor, cold-chain temperature record, customer order cut-off & delivery window

domain_name: produce-terminal-market
api_prefix: /market

complexity_profile:
  primary_archetype: compliance_audit        # PACA trust, prompt payment, USDA inspection disputes
  secondary_archetype: temporal_windowing    # ripening rooms, delivery windows, order cut-off
  complexity_layers:
    - optimistic_concurrency                 # OCC on Customer.version for credit/terms updates
    - cascading_side_effects                 # cold-chain violation -> lot -> order hold -> reservation release
    - dual_variant_calculation               # lot landed cost (provisional/final); labor charge (hourly/piece)
    - ops_run_checkpoint                     # POST /market/ops/run-day-close advances the market epoch
  entity_topology: flat                      # peer entities linked by FK references; sub-resource GETs only for reverse reads
  state_machine_shape: branching             # PurchaseLot dispute cycle; SalesOrder confirm/hold branching
  relationship_patterns:
    - one_to_many                            # Shipper->Lots, Customer->Orders/Invoices, Lot->Inspections/Readings/Bookings
    - cross_aggregate                        # SalesOrder lines reference PurchaseLot; bookings span Room x Lot
  role_model: segregation_of_duties          # Receiver files, MarketAdmin disposes; Clerk bills, Admin approves
  consistency_model: immediate               # every mutation + cascade visible in the same response

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Shipper
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Shipper / grower legal name" }
      - { name: paca_license, type: string, source: input, description: "PACA license number" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | INACTIVE" }
      - { name: trust_exposure_cents, type: integer, source: computed, default: 0, description: "Sum of payable_cents over this shipper's lots with status in {ORDERED, RECEIVED, INSPECTED, DISPUTED, ACCEPTED}" }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Buyer / store name" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum permitted credit exposure in cents" }
      - { name: terms_days, type: integer, source: input, default: 10, description: "PACA prompt-payment terms in days; must be <= 30 unless paca_special_agreement is true" }
      - { name: paca_special_agreement, type: boolean, source: input, default: false, description: "Written agreement permitting terms beyond 30 days" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED (system-suspended on PACA trust claim; restored by MarketAdmin)" }
      - { name: credit_exposure_cents, type: integer, source: computed, default: 0, description: "Sum of balance_cents of invoices in {OPEN, PAST_DUE, TRUST_CLAIMED} plus subtotal_cents of orders in {CONFIRMED, ON_HOLD, PICKED, DELIVERED}" }

  - name: Commodity
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique commodity code, e.g. TOM-GRN" }
      - { name: name, type: string, source: input, description: "Display name" }
      - { name: ethylene_class, type: enum, source: input, description: "PRODUCER | SENSITIVE | NEUTRAL — drives ripening-room ethylene conflict checks" }
      - { name: temp_min_f, type: number, source: input, description: "Cold-chain lower bound, Fahrenheit" }
      - { name: temp_max_f, type: number, source: input, description: "Cold-chain upper bound, Fahrenheit" }
      - { name: max_violation_minutes, type: integer, source: input, default: 60, description: "Cumulative out-of-range minutes tolerated before cold_chain_status flips to VIOLATED (strictly greater flips)" }

  - name: DailyPrice
    parent: null
    common_fields: true
    fields:
      - { name: commodity_id, type: string, source: input, description: "FK -> Commodity.id" }
      - { name: market_date, type: string, source: input, description: "Market date YYYY-MM-DD this price report covers" }
      - { name: low_price, type: number, source: input, description: "Daily low transaction price per unit, dollars" }
      - { name: high_price, type: number, source: input, description: "Daily high transaction price per unit, dollars" }
      - { name: mid_price, type: number, source: computed, description: "round_half_up((low_price + high_price) / 2, 2)" }

  - name: PurchaseLot
    parent: null
    common_fields: true
    fields:
      - { name: shipper_id, type: string, source: input, description: "FK -> Shipper.id" }
      - { name: commodity_id, type: string, source: input, description: "FK -> Commodity.id" }
      - { name: market_date, type: string, source: input, description: "Purchase market date YYYY-MM-DD; a DailyPrice must exist for (commodity_id, market_date)" }
      - { name: quantity_units, type: integer, source: input, description: "Units purchased (must be > 0)" }
      - { name: shipper_unit_price, type: number, source: input, description: "Agreed unit price in dollars; must lie within the DailyPrice [low_price, high_price] band" }
      - { name: declared_grade, type: string, source: input, description: "Grade/pack declared by the shipper on the manifest" }
      - { name: status, type: enum, source: system, default: ORDERED, description: "ORDERED | RECEIVED | INSPECTED | DISPUTED | ACCEPTED | REJECTED | CLOSED" }
      - { name: received_at, type: datetime, source: system, description: "Logical-clock timestamp of receipt" }
      - { name: provisional_cost_cents, type: integer, source: computed, description: "quantity_units * shipper_unit_price * 100, rounded half-up; set at creation" }
      - { name: adjusted_cost_cents, type: integer, source: computed, description: "Final cost after inspection/defect formula or dispute price adjustment; equals provisional until then" }
      - { name: payable_cents, type: integer, source: computed, description: "adjusted_cost_cents minus sum of ISSUED CreditMemo.amount_cents for this lot; 0 when REJECTED" }
      - { name: dumped_units, type: integer, source: computed, default: 0, description: "Units removed by APPROVED shrink records" }
      - { name: reserved_units, type: integer, source: computed, default: 0, description: "Units reserved by order lines on orders in {CONFIRMED, PICKED}" }
      - { name: sold_units, type: integer, source: computed, default: 0, description: "Units delivered" }
      - { name: available_units, type: integer, source: computed, description: "quantity_units - dumped_units - reserved_units - sold_units" }
      - { name: cold_chain_status, type: enum, source: computed, default: OK, description: "OK | VIOLATED (cumulative out-of-range minutes strictly greater than commodity.max_violation_minutes)" }
      - { name: violation_minutes, type: integer, source: computed, default: 0, description: "Cumulative duration_minutes of readings outside the commodity [temp_min_f, temp_max_f] band" }

  - name: Inspection
    parent: null
    common_fields: true
    fields:
      - { name: purchase_lot_id, type: string, source: input, description: "FK -> PurchaseLot.id" }
      - { name: inspected_grade, type: string, source: input, description: "Grade observed by the USDA inspector" }
      - { name: defect_pct, type: number, source: input, description: "Total defects percent, 0..100" }
      - { name: result, type: enum, source: input, description: "PASS | FAIL" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | CERTIFIED | VOIDED" }

  - name: TemperatureReading
    parent: null
    common_fields: false
    fields:
      - { name: purchase_lot_id, type: string, source: input, description: "FK -> PurchaseLot.id" }
      - { name: recorded_at, type: datetime, source: input, description: "When the probe reading was taken" }
      - { name: temp_f, type: number, source: input, description: "Observed pulp/air temperature, Fahrenheit" }
      - { name: duration_minutes, type: integer, source: input, description: "Minutes the lot dwelled at this temperature (must be > 0)" }
      - { name: out_of_range, type: boolean, source: computed, description: "temp_f < commodity.temp_min_f OR temp_f > commodity.temp_max_f" }

  - name: RipeningRoom
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Room identifier" }
      - { name: capacity_pallets, type: integer, source: input, description: "Maximum pallets physically held" }
      - { name: ethylene_capable, type: boolean, source: input, description: "Whether the room has ethylene injection" }

  - name: RipeningBooking
    parent: null
    common_fields: true
    fields:
      - { name: room_id, type: string, source: input, description: "FK -> RipeningRoom.id" }
      - { name: purchase_lot_id, type: string, source: input, description: "FK -> PurchaseLot.id" }
      - { name: pallet_count, type: integer, source: input, description: "Pallets occupied (must be > 0)" }
      - { name: start_time, type: datetime, source: input, description: "Occupation start (inclusive)" }
      - { name: end_time, type: datetime, source: input, description: "Occupation end (exclusive); must be after start_time" }
      - { name: ethylene_enabled, type: boolean, source: input, description: "Whether ethylene injection runs during this booking" }
      - { name: target_stage, type: string, source: input, description: "Target ripeness stage, e.g. STAGE_4" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | IN_PROCESS | COMPLETED | CANCELLED | EXPIRED" }

  - name: ShrinkRecord
    parent: null
    common_fields: true
    fields:
      - { name: purchase_lot_id, type: string, source: input, description: "FK -> PurchaseLot.id" }
      - { name: quantity, type: integer, source: input, description: "Units shrunk/dumped (must be > 0 and <= lot available_units)" }
      - { name: reason, type: enum, source: input, description: "DUMP | TRIM | DAMAGE | THEFT" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | APPROVED" }
      - { name: credit_memo_id, type: string, source: system, description: "id of the CreditMemo issued on approval (null until approved)" }

  - name: CreditMemo
    parent: null
    common_fields: true
    fields:
      - { name: purchase_lot_id, type: string, source: system, description: "FK -> PurchaseLot.id; copied from the originating shrink record" }
      - { name: amount_cents, type: integer, source: computed, description: "round_half_up(lot.adjusted_cost_cents * shrink.quantity / lot.quantity_units)" }
      - { name: status, type: enum, source: system, default: ISSUED, description: "ISSUED | VOID" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock timestamp of issuance" }
      - { name: voided_at, type: datetime, source: system, description: "Logical-clock timestamp of voiding (null while ISSUED)" }

  - name: SalesOrder
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: delivery_date, type: string, source: input, description: "Requested delivery date YYYY-MM-DD; must be later than the order clock date" }
      - { name: window_start, type: string, source: input, description: "Delivery window start HH:MM (inclusive)" }
      - { name: window_end, type: string, source: input, description: "Delivery window end HH:MM (exclusive); must be after window_start" }
      - { name: pallet_count, type: integer, source: input, default: 1, description: "Pallets shipped; drives the refundable pallet deposit on the invoice" }
      - { name: lines, type: array, source: input, description: "Non-empty array of { lot_id, quantity, unit_price }; quantity > 0, unit_price dollars > 0" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | CONFIRMED | ON_HOLD | PICKED | DELIVERED | INVOICED | CANCELLED" }
      - { name: hold_reason, type: enum, source: system, description: "COLD_CHAIN | CREDIT; null unless status == ON_HOLD" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum over lines of round_half_up(unit_price * quantity * 100) — per-line rounding THEN sum (pinned order)" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: sales_order_id, type: string, source: input, description: "FK -> SalesOrder.id; exactly one invoice per order" }
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; copied from the order" }
      - { name: invoice_date, type: string, source: system, description: "Logical-clock date of issuance" }
      - { name: due_date, type: string, source: computed, description: "invoice_date + customer.terms_days (terms captured at issuance)" }
      - { name: discount_eligible_until, type: string, source: computed, description: "invoice_date + 5 days; first payment on or before this date earns the early-pay discount" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Copied from the order subtotal" }
      - { name: deposit_cents, type: integer, source: computed, description: "pallet_count * 2500" }
      - { name: total_cents, type: integer, source: computed, description: "subtotal_cents + deposit_cents" }
      - { name: discount_taken_cents, type: integer, source: computed, default: 0, description: "round_half_up(total_cents * 0.02) applied on the first payment with paid date <= discount_eligible_until" }
      - { name: paid_cents, type: integer, source: computed, default: 0, description: "Sum of Payment.amount_cents for this invoice" }
      - { name: balance_cents, type: integer, source: computed, description: "total_cents - discount_taken_cents - paid_cents" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | PAST_DUE | TRUST_CLAIMED | PAID" }

  - name: Payment
    parent: null
    common_fields: false
    fields:
      - { name: invoice_id, type: string, source: input, description: "FK -> Invoice.id" }
      - { name: amount_cents, type: integer, source: input, description: "Payment amount in cents (must be > 0)" }
      - { name: paid_at, type: datetime, source: system, description: "Logical-clock timestamp at posting" }

  - name: LaborTicket
    parent: null
    common_fields: true
    fields:
      - { name: purchase_lot_id, type: string, source: input, description: "FK -> PurchaseLot.id the cross-dock/repack work is performed on" }
      - { name: ticket_type, type: enum, source: input, description: "HOURLY | PIECE" }
      - { name: work_date, type: string, source: input, description: "Work date YYYY-MM-DD" }
      - { name: hours, type: number, source: input, description: "Crew hours worked (must be > 0); also feeds the PIECE guaranteed minimum" }
      - { name: pieces, type: integer, source: input, description: "Pieces repacked; required for PIECE, ignored for HOURLY" }
      - { name: hourly_rate, type: number, source: input, description: "Dollars per hour; required for HOURLY" }
      - { name: piece_rate, type: number, source: input, description: "Dollars per piece; required for PIECE" }
      - { name: charge_cents, type: integer, source: computed, description: "HOURLY: round_half_up((min(hours,8)*hourly_rate + max(0,hours-8)*hourly_rate*1.5) * 100). PIECE: max(pieces*piece_rate, hours*15.00) * 100 rounded half-up" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: PurchaseLot
    initial_state: ORDERED
    terminal_states: [REJECTED, CLOSED]
    transitions:
      - from: ORDERED
        to: RECEIVED
        trigger: "POST /market/purchase-lots/{id}/receive"
        actor: Receiver
        preconditions: ["lot.status == ORDERED"]
        side_effects:
          - "received_at := current logical clock"
          - "increments PurchaseLot.version by 1"
      - from: RECEIVED
        to: INSPECTED
        trigger: "POST /market/inspections (creates Inspection in SUBMITTED)"
        actor: USDAInspector
        preconditions:
          - "lot.status in {RECEIVED, DISPUTED}"
          - "no other Inspection for this lot with status == SUBMITTED (else ERR_INSPECTION_OPEN)"
        side_effects:
          - "lot.status := INSPECTED"
          - "increments PurchaseLot.version by 1"
      - from: INSPECTED
        to: ACCEPTED
        trigger: "POST /market/inspections/{id}/certify with inspection.result == PASS"
        actor: USDAInspector
        preconditions: ["inspection.status == SUBMITTED", "lot.status == INSPECTED"]
        side_effects:
          - "inspection.status := CERTIFIED"
          - "recompute lot.adjusted_cost_cents via lot_landed_cost FINAL variant (defect formula)"
          - "lot.payable_cents := adjusted_cost_cents - sum(ISSUED CreditMemo.amount_cents)"
          - "recompute shipper.trust_exposure_cents"
          - "increments PurchaseLot.version by 1"
      - from: INSPECTED
        to: DISPUTED
        trigger: "POST /market/purchase-lots/{id}/dispute"
        actor: Receiver
        preconditions:
          - "lot.status == INSPECTED"
          - "a CERTIFIED Inspection exists for this lot with result == FAIL"
        side_effects: ["increments PurchaseLot.version by 1"]
      - from: DISPUTED
        to: INSPECTED
        trigger: "POST /market/inspections (re-inspection loop; creates new SUBMITTED Inspection)"
        actor: USDAInspector
        preconditions: ["lot.status == DISPUTED", "no SUBMITTED Inspection open for this lot"]
        side_effects: ["lot.status := INSPECTED", "increments PurchaseLot.version by 1"]
        note: "Cycle: INSPECTED -> DISPUTED -> INSPECTED may repeat across dispute rounds"
      - from: DISPUTED
        to: ACCEPTED
        trigger: "POST /market/purchase-lots/{id}/resolve-dispute with outcome in {ACCEPT_AS_IS, PRICE_ADJUST}"
        actor: MarketAdmin
        preconditions: ["lot.status == DISPUTED"]
        side_effects:
          - "if outcome == PRICE_ADJUST: lot.adjusted_cost_cents := round_half_up(quantity_units * agreed_unit_price * 100)"
          - "lot.payable_cents := adjusted_cost_cents - sum(ISSUED CreditMemo.amount_cents)"
          - "recompute shipper.trust_exposure_cents"
          - "increments PurchaseLot.version by 1"
      - from: DISPUTED
        to: REJECTED
        trigger: "POST /market/purchase-lots/{id}/resolve-dispute with outcome == REJECT_TO_SHIPPER"
        actor: MarketAdmin
        preconditions: ["lot.status == DISPUTED"]
        side_effects:
          - "lot.payable_cents := 0"
          - "recompute shipper.trust_exposure_cents"
          - "increments PurchaseLot.version by 1"
      - from: ACCEPTED
        to: CLOSED
        trigger: "POST /market/purchase-lots/{id}/close"
        actor: Receiver
        preconditions:
          - "lot.status == ACCEPTED"
          - "no RipeningBooking for this lot with status in {SCHEDULED, IN_PROCESS}"
        side_effects: ["increments PurchaseLot.version by 1"]
      - from: any non-terminal
        to: "(no transition)"
        trigger: "POST /market/temperature-readings with an out-of-range reading that pushes violation_minutes strictly above commodity.max_violation_minutes"
        actor: system
        preconditions: ["lot.cold_chain_status == OK"]
        side_effects:
          - "lot.cold_chain_status := VIOLATED"
          - "CASCADE hop 2: every SalesOrder with a line on this lot and status == CONFIRMED moves to ON_HOLD with hold_reason := COLD_CHAIN"
          - "CASCADE hop 3: each such hold releases its line reservations: lot.reserved_units -= line.quantity; lot.available_units recomputed"
          - "increments PurchaseLot.version by 1"
        note: "Transitive cascade A (depth 3): reading -> lot violation -> order hold -> reservation release"

  - entity: Inspection
    initial_state: SUBMITTED
    terminal_states: [CERTIFIED, VOIDED]
    transitions:
      - from: SUBMITTED
        to: CERTIFIED
        trigger: "POST /market/inspections/{id}/certify"
        actor: USDAInspector
        preconditions: ["inspection.status == SUBMITTED", "lot.status == INSPECTED"]
        side_effects:
          - "if result == PASS: lot INSPECTED -> ACCEPTED (see PurchaseLot transitions)"
          - "if result == FAIL: lot remains INSPECTED (dispute is a separate Receiver action)"
      - from: SUBMITTED
        to: VOIDED
        trigger: "system void: fired when the lot transitions DISPUTED -> REJECTED while this inspection is still SUBMITTED"
        actor: system
        preconditions: ["inspection.status == SUBMITTED", "owning lot enters REJECTED"]
        side_effects: []
        note: "keeps the invariant: a REJECTED lot never has a SUBMITTED inspection open"

  - entity: RipeningBooking
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED, EXPIRED]
    transitions:
      - from: SCHEDULED
        to: IN_PROCESS
        trigger: "POST /market/ripening-bookings/{id}/start"
        actor: Receiver
        preconditions:
          - "booking.status == SCHEDULED"
          - "lot.status == ACCEPTED (else ERR_LOT_NOT_ACCEPTED)"
          - "start_time <= clock < end_time (else ERR_INVALID_STATE)"
        side_effects: ["increments RipeningBooking.version by 1"]
      - from: IN_PROCESS
        to: COMPLETED
        trigger: "POST /market/ripening-bookings/{id}/complete"
        actor: Receiver
        preconditions: ["booking.status == IN_PROCESS"]
        side_effects: ["increments RipeningBooking.version by 1"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /market/ripening-bookings/{id}/cancel"
        actor: Receiver
        preconditions: ["booking.status == SCHEDULED"]
        side_effects:
          - "booking leaves the active set: its pallet_count no longer counts toward room capacity"
          - "increments RipeningBooking.version by 1"
      - from: SCHEDULED
        to: EXPIRED
        trigger: "POST /market/ops/run-day-close when booking.end_time < clock and no start occurred"
        actor: system
        preconditions: ["booking.status == SCHEDULED", "booking.end_time < current logical clock"]
        side_effects: ["increments RipeningBooking.version by 1"]

  - entity: ShrinkRecord
    initial_state: DRAFT
    terminal_states: [APPROVED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /market/shrink-records/{id}/approve"
        actor: MarketAdmin
        preconditions:
          - "shrink.status == DRAFT"
          - "shrink.quantity <= lot.available_units (else ERR_INSUFFICIENT_QUANTITY)"
        side_effects:
          - "CASCADE hop 1: create CreditMemo (ISSUED) with amount_cents per the memo formula; shrink.credit_memo_id set"
          - "CASCADE hop 2: lot.dumped_units += quantity; lot.payable_cents := adjusted_cost_cents - sum(ISSUED memos); lot.available_units recomputed"
          - "recompute shipper.trust_exposure_cents"
        note: "Transitive cascade B (depth 2): approve -> memo issued -> lot payable recomputed"

  - entity: CreditMemo
    initial_state: ISSUED
    terminal_states: [VOID]
    transitions:
      - from: ISSUED
        to: VOID
        trigger: "POST /market/credit-memos/{id}/void"
        actor: BillingClerk
        preconditions: ["memo.status == ISSUED"]
        side_effects:
          - "voided_at := current logical clock"
          - "lot.payable_cents := adjusted_cost_cents - sum(remaining ISSUED memos)  (compensation: restores payable)"
          - "recompute shipper.trust_exposure_cents"
          - "increments CreditMemo.version by 1"

  - entity: SalesOrder
    initial_state: PENDING
    terminal_states: [CANCELLED, INVOICED]
    transitions:
      - from: PENDING
        to: CONFIRMED
        trigger: "POST /market/sales-orders/{id}/confirm"
        actor: SalesDesk
        preconditions:
          - "order.status in {PENDING, ON_HOLD}"
          - "customer.status == ACTIVE (else ERR_CUSTOMER_INACTIVE)"
          - "if order.status == ON_HOLD: hold_reason == CREDIT (a COLD_CHAIN hold can only be cancelled)"
          - "customer.credit_exposure_cents + order.subtotal_cents <= customer.credit_limit_cents (else ERR_CREDIT_LIMIT_EXCEEDED)"
          - "for every line: line.quantity <= lot.available_units and lot.status == ACCEPTED (else ERR_INSUFFICIENT_QUANTITY / ERR_LOT_NOT_ACCEPTED)"
        side_effects:
          - "per line: lot.reserved_units += line.quantity; lot.available_units recomputed"
          - "order.hold_reason := null"
          - "recompute customer.credit_exposure_cents"
          - "increments SalesOrder.version by 1"
      - from: CONFIRMED
        to: ON_HOLD
        trigger: "system cascade: (a) cold-chain violation on a line lot (hold_reason COLD_CHAIN); (b) day-close finds a TRUST_CLAIMED invoice for this customer (hold_reason CREDIT)"
        actor: system
        preconditions: ["order.status == CONFIRMED"]
        side_effects:
          - "per line: lot.reserved_units -= line.quantity (reservation released)"
          - "order.hold_reason set"
          - "recompute customer.credit_exposure_cents"
          - "increments SalesOrder.version by 1"
        note: "Branching with revert: ON_HOLD -> CONFIRMED via confirm when hold_reason == CREDIT and the cause is cleared"
      - from: CONFIRMED
        to: PICKED
        trigger: "POST /market/sales-orders/{id}/pick"
        actor: Receiver
        preconditions:
          - "order.status == CONFIRMED"
          - "every line lot has cold_chain_status == OK (else ERR_COLD_CHAIN_VIOLATION)"
        side_effects: ["increments SalesOrder.version by 1"]
      - from: PICKED
        to: DELIVERED
        trigger: "POST /market/sales-orders/{id}/deliver"
        actor: Receiver
        preconditions:
          - "order.status == PICKED"
          - "every line lot has cold_chain_status == OK (else ERR_COLD_CHAIN_VIOLATION)"
        side_effects:
          - "per line: lot.reserved_units -= line.quantity; lot.sold_units += line.quantity; lot.available_units recomputed"
          - "recompute customer.credit_exposure_cents"
          - "increments SalesOrder.version by 1"
      - from: DELIVERED
        to: INVOICED
        trigger: "POST /market/invoices with sales_order_id (creates Invoice OPEN)"
        actor: BillingClerk
        preconditions: ["order.status == DELIVERED", "no Invoice exists for this order (else ERR_INVOICE_EXISTS)"]
        side_effects:
          - "Invoice created with due_date/discount fields per invoice_settlement calculation"
          - "recompute customer.credit_exposure_cents"
          - "increments SalesOrder.version by 1"
      - from: PENDING
        to: CANCELLED
        trigger: "POST /market/sales-orders/{id}/cancel"
        actor: "SalesDesk (any order) | CustomerRep (own orders only)"
        preconditions: ["order.status in {PENDING, CONFIRMED, ON_HOLD}"]
        side_effects:
          - "if status was CONFIRMED or ON_HOLD: per line lot.reserved_units -= line.quantity; available_units recomputed"
          - "recompute customer.credit_exposure_cents"
          - "increments SalesOrder.version by 1"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /market/sales-orders/{id}/cancel"
        actor: SalesDesk
        preconditions: ["order.status in {PENDING, CONFIRMED, ON_HOLD}"]
        side_effects:
          - "per line: lot.reserved_units -= line.quantity"
          - "recompute customer.credit_exposure_cents"
          - "increments SalesOrder.version by 1"
      - from: ON_HOLD
        to: CANCELLED
        trigger: "POST /market/sales-orders/{id}/cancel"
        actor: SalesDesk
        preconditions: ["order.status in {PENDING, CONFIRMED, ON_HOLD}"]
        side_effects: ["recompute customer.credit_exposure_cents", "increments SalesOrder.version by 1"]
      - from: ON_HOLD
        to: CONFIRMED
        trigger: "POST /market/sales-orders/{id}/confirm (release path)"
        actor: SalesDesk
        preconditions:
          - "order.status == ON_HOLD and hold_reason == CREDIT"
          - "customer.status == ACTIVE"
          - "customer.credit_exposure_cents + order.subtotal_cents <= customer.credit_limit_cents"
          - "for every line: line.quantity <= lot.available_units and lot.status == ACCEPTED"
        side_effects:
          - "per line: lot.reserved_units += line.quantity"
          - "order.hold_reason := null"
          - "recompute customer.credit_exposure_cents"
          - "increments SalesOrder.version by 1"

  - entity: Invoice
    initial_state: OPEN
    terminal_states: [PAID]
    transitions:
      - from: OPEN
        to: PAST_DUE
        trigger: "POST /market/ops/run-day-close when clock date > due_date and balance_cents > 0"
        actor: system
        preconditions: ["invoice.status == OPEN", "clock_date > due_date", "balance_cents > 0"]
        side_effects: ["increments Invoice.version by 1"]
        note: "Boundary: on due_date exactly the invoice remains OPEN (strict > comparison)"
      - from: PAST_DUE
        to: TRUST_CLAIMED
        trigger: "POST /market/ops/run-day-close when clock date > due_date + 30 days and balance_cents > 0"
        actor: system
        preconditions: ["invoice.status == PAST_DUE", "clock_date > due_date + 30 days", "balance_cents > 0"]
        side_effects:
          - "customer.status := SUSPENDED (PACA trust protection)"
          - "every SalesOrder of this customer with status == CONFIRMED moves to ON_HOLD with hold_reason := CREDIT (and its reservations are released)"
          - "recompute customer.credit_exposure_cents"
          - "increments Invoice.version by 1"
      - from: OPEN
        to: PAID
        trigger: "POST /market/payments bringing balance_cents to 0"
        actor: BillingClerk
        preconditions: ["invoice.status in {OPEN, PAST_DUE, TRUST_CLAIMED}"]
        side_effects:
          - "if paid date <= discount_eligible_until and discount_taken_cents == 0: discount_taken_cents := round_half_up(total_cents * 0.02)"
          - "paid_cents += amount_cents; balance_cents recomputed; status := PAID when balance_cents == 0"
          - "recompute customer.credit_exposure_cents"
          - "increments Invoice.version by 1"
      - from: PAST_DUE
        to: PAID
        trigger: "POST /market/payments bringing balance_cents to 0"
        actor: BillingClerk
        preconditions: ["invoice.status in {OPEN, PAST_DUE, TRUST_CLAIMED}"]
        side_effects: ["same as OPEN -> PAID"]
      - from: TRUST_CLAIMED
        to: PAID
        trigger: "POST /market/payments bringing balance_cents to 0"
        actor: BillingClerk
        preconditions: ["invoice.status in {OPEN, PAST_DUE, TRUST_CLAIMED}"]
        side_effects: ["same as OPEN -> PAID"]

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: customer-terms-stale-update
    parent_entity: Customer
    write_endpoint: "PATCH /market/customers/{id}"
    occ_field: expected_customer_version
    description: |
      Updating a Customer's credit terms or status with an
      expected_customer_version that no longer matches the server's
      Customer.version is rejected. This captures the case where another
      writer has advanced the customer (terms change, day-close suspension)
      since the caller last observed it, making the caller's view stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: lot_landed_cost
    trigger: "PurchaseLot creation (PROVISIONAL variant); Inspection certify with result PASS and resolve-dispute with PRICE_ADJUST (FINAL variant)"
    algorithm: aggregation
    formula: |
      PROVISIONAL (at creation):
        provisional_cost_cents = round_half_up(quantity_units * shipper_unit_price * 100)
      FINAL (at certify-PASS):
        if defect_pct <= DEFECT_TOLERANCE_PCT: adjusted_cost_cents = provisional_cost_cents
        else:
          final_unit_price = round_half_up(shipper_unit_price * (1 - (defect_pct - DEFECT_TOLERANCE_PCT) / 100), 4)
          adjusted_cost_cents = round_half_up(quantity_units * final_unit_price * 100)
      FINAL (at resolve-dispute PRICE_ADJUST):
        adjusted_cost_cents = round_half_up(quantity_units * agreed_unit_price * 100)
      Until a FINAL variant runs, adjusted_cost_cents := provisional_cost_cents.
    input_set: "The single PurchaseLot; at FINAL, the CERTIFIED inspection's defect_pct or the dispute's agreed_unit_price"
    constants:
      DEFECT_TOLERANCE_PCT: 5
    precision: "unit prices 4 decimal places, money in integer cents, round_half_up"
    variants:
      - name: provisional
        when: "from lot creation until first FINAL trigger"
        difference: "uses the shipper's manifest price with no quality adjustment"
      - name: final
        when: "inspection certify PASS or dispute PRICE_ADJUST"
        difference: "applies the defect-discount formula or the agreed adjustment price; identical lot data therefore yields a different cost than PROVISIONAL whenever defect_pct > 5 or the agreed price differs"

  - name: labor_charge
    trigger: "POST /market/labor-tickets (computed at creation, then immutable)"
    algorithm: threshold
    formula: |
      HOURLY variant:
        regular_pay  = min(hours, OT_THRESHOLD_HOURS) * hourly_rate
        overtime_pay = max(0, hours - OT_THRESHOLD_HOURS) * hourly_rate * OT_MULTIPLIER
        charge_cents = round_half_up((regular_pay + overtime_pay) * 100)
      PIECE variant:
        piece_pay = pieces * piece_rate
        guaranteed_minimum = hours * MIN_WAGE_DOLLARS
        charge_cents = round_half_up(max(piece_pay, guaranteed_minimum) * 100)
    input_set: "The LaborTicket's ticket_type, hours, pieces, hourly_rate, piece_rate"
    constants:
      OT_THRESHOLD_HOURS: 8
      OT_MULTIPLIER: 1.5
      MIN_WAGE_DOLLARS: 15.00
    precision: "integer cents, round_half_up"
    variants:
      - name: hourly
        when: "ticket_type == HOURLY"
        difference: "time-based with an overtime kink past 8 hours; pieces input ignored"
      - name: piece
        when: "ticket_type == PIECE"
        difference: "output-based with a guaranteed-minimum floor max(piece_pay, hours * 15.00); identical hours/pieces/rates numerics can therefore produce a different charge than HOURLY"

  - name: order_subtotal
    trigger: "POST /market/sales-orders (at creation; lines are immutable thereafter)"
    algorithm: aggregation
    formula: |
      line_extended_cents(i) = round_half_up(lines[i].unit_price * lines[i].quantity * 100)
      subtotal_cents = sum over lines of line_extended_cents(i)
      PINNED ROUNDING ORDER: round EACH LINE to cents first, THEN sum.
      The alternative (sum raw products, then round once) is explicitly NOT used;
      e.g. two lines of 2.505 x 1 yield 251 + 251 = 502, not round(501.0) = 501.
    input_set: "All lines of the order; lines referencing lots not in status ACCEPTED are rejected before this runs (validation, not calculation)"
    constants: {}
    precision: "integer cents per line, round_half_up, then integer sum"

  - name: invoice_settlement
    trigger: "POST /market/invoices (total fields); POST /market/payments (discount, balance, status)"
    algorithm: threshold
    formula: |
      At issuance:
        deposit_cents = order.pallet_count * PALLET_DEPOSIT_CENTS
        total_cents   = order.subtotal_cents + deposit_cents
        due_date      = invoice_date + customer.terms_days          (terms snapshotted at issuance)
        discount_eligible_until = invoice_date + DISCOUNT_DAYS days
      At each payment (first payment with paid date <= discount_eligible_until earns the discount):
        if discount_taken_cents == 0 and paid_date <= discount_eligible_until:
          discount_taken_cents = round_half_up(total_cents * EARLY_PAY_DISCOUNT_PCT)
        paid_cents    = sum of Payment.amount_cents
        balance_cents = total_cents - discount_taken_cents - paid_cents
        status        = PAID iff balance_cents == 0
      Boundary: a payment dated exactly discount_eligible_until EARNS the discount (<=).
    input_set: "The order (subtotal, pallet_count), the customer (terms_days), all Payments for the invoice"
    constants:
      PALLET_DEPOSIT_CENTS: 2500
      EARLY_PAY_DISCOUNT_PCT: 0.02
      DISCOUNT_DAYS: 5
    precision: "integer cents, round_half_up"
    variants: []

  - name: cold_chain_accumulation
    trigger: "POST /market/temperature-readings"
    algorithm: threshold
    formula: |
      out_of_range(reading) = temp_f < commodity.temp_min_f OR temp_f > commodity.temp_max_f
      lot.violation_minutes = sum of duration_minutes over readings where out_of_range
      lot.cold_chain_status = VIOLATED iff violation_minutes > commodity.max_violation_minutes
      Boundary: violation_minutes EXACTLY EQUAL to max_violation_minutes stays OK (strict >).
      The metric is CUMULATIVE: no single reading needs to exceed anything; repeated
      short excursions accumulate and never reset (no reset mechanism exists).
    input_set: "All TemperatureReading rows for the lot (no time window; readings never expire)"
    constants: {}
    precision: "integer minutes"

  - name: credit_exposure
    trigger: "order confirm / cancel / deliver / invoice create / payment / day-close suspension cascades"
    algorithm: aggregation
    formula: |
      customer.credit_exposure_cents =
        sum of Invoice.balance_cents where invoice.customer_id == customer.id
              and invoice.status in {OPEN, PAST_DUE, TRUST_CLAIMED}
        + sum of SalesOrder.subtotal_cents where order.customer_id == customer.id
              and order.status in {CONFIRMED, ON_HOLD, PICKED, DELIVERED}
      Confirm gate: allowed iff credit_exposure_cents + order.subtotal_cents <= credit_limit_cents
      (equality is ALLOWED: the check rejects only strictly-greater overshoot).
    input_set: "Customer's invoices in {OPEN, PAST_DUE, TRUST_CLAIMED} and orders in {CONFIRMED, ON_HOLD, PICKED, DELIVERED}; CANCELLED and INVOICED orders excluded"
    constants: {}
    precision: "integer cents"

  - name: lot_payable_reconciliation
    trigger: "inspection certify PASS, dispute resolution, shrink approval, credit-memo void"
    algorithm: aggregation
    formula: |
      lot.payable_cents = lot.adjusted_cost_cents - sum(CreditMemo.amount_cents
                          where memo.purchase_lot_id == lot.id and memo.status == ISSUED)
      (REJECTED lots override: payable_cents = 0.)
      COMPENSATING INVARIANT (money): for every non-REJECTED lot,
        payable_cents + sum(ISSUED memo amounts) == adjusted_cost_cents
        and approving a shrink then voiding its memo restores payable_cents exactly.
    input_set: "The lot and all its CreditMemo rows with status ISSUED (VOID excluded)"
    constants: {}
    precision: "integer cents"

  - name: shipper_trust_exposure
    trigger: "any change to a lot's payable_cents or status"
    algorithm: aggregation
    formula: |
      shipper.trust_exposure_cents = sum of PurchaseLot.payable_cents
        where lot.shipper_id == shipper.id
          and lot.status in {ORDERED, RECEIVED, INSPECTED, DISPUTED, ACCEPTED}
      (REJECTED and CLOSED lots drop out of the exposure set.)
    input_set: "All PurchaseLots of the shipper in the pinned status set"
    constants: {}
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role is a declared role; for entity_backed role CustomerRep, X-User-ID must equal an existing Customer.id"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "Role permitted for the endpoint per §1.5 roles; CustomerRep may only touch resources whose customer_id == X-User-ID"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all
  - priority: 3
    category: business_constraint
    check: "Request shape: required fields present; types valid; enum values in range; quantities/amounts > 0; window_end after window_start; end_time after start_time; PIECE tickets carry pieces and piece_rate; HOURLY tickets carry hourly_rate"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: all
  - priority: 4
    category: existence
    check: "Path ids and body foreign-key ids resolve to existing entities, validated left-to-right (path first, then body in field order)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 5
    category: state
    check: "Target entity in a legal from-state for the requested transition (incl. ERR_INVOICE_EXISTS when the order is already INVOICED, ERR_INSPECTION_OPEN when a SUBMITTED inspection already exists for the lot)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all
  - priority: 6
    category: state
    check: "Cross-entity state gates: order create/confirm requires customer.status == ACTIVE (ERR_CUSTOMER_INACTIVE); ripening booking start requires lot.status == ACCEPTED and order line lots ACCEPTED at create/confirm (ERR_LOT_NOT_ACCEPTED)"
    error_id: ERR_CUSTOMER_INACTIVE
    http_status: 409
    applies_to: "POST /market/sales-orders, POST /market/sales-orders/{id}/confirm, POST /market/ripening-bookings/{id}/start"
  - priority: 7
    category: business_safety
    check: "Cold-chain and ethylene safety: pick/deliver requires every line lot cold_chain_status == OK (ERR_COLD_CHAIN_VIOLATION); a ripening booking whose uninflated interval overlaps another active booking on the same room must not pair ethylene_enabled=true with an overlapping lot whose commodity.ethylene_class == SENSITIVE, nor a SENSITIVE lot with an overlapping ethylene_enabled=true booking (ERR_ETHYLENE_CONFLICT)"
    error_id: ERR_COLD_CHAIN_VIOLATION
    http_status: 409
    applies_to: "POST /market/sales-orders/{id}/pick, POST /market/sales-orders/{id}/deliver, POST /market/ripening-bookings"
  - priority: 8
    category: business_temporal
    check: "Temporal rules: order create rejected when delivery_date <= clock date, or delivery_date == clock date + 1 and clock time strictly after 14:00:00 (ERR_CUTOFF_PASSED; exactly 14:00:00 is allowed); ripening booking rejected when its interval intersects any active booking's buffer-inflated interval [start-2h, end+2h) on the same room (ERR_ROOM_OVERLAP; touching at an inflated boundary is allowed); customer delivery windows on the same delivery_date must not overlap as strict half-open intervals (ERR_WINDOW_OVERLAP; adjacency such as [08:00,10:00) then [10:00,12:00) is allowed)"
    error_id: ERR_CUTOFF_PASSED
    http_status: 422
    applies_to: "POST /market/sales-orders, POST /market/ripening-bookings"
  - priority: 9
    category: business_constraint
    check: "Domain constraints: DailyPrice must exist for (commodity_id, market_date) at lot creation (ERR_PRICE_NOT_POSTED); DailyPrice unique per (commodity_id, market_date) (ERR_DUPLICATE_PRICE); shipper_unit_price within [low_price, high_price] inclusive (ERR_PRICE_OUT_OF_RANGE); ripening Σ pallets of overlapping active bookings + new pallet_count <= capacity (ERR_ROOM_CAPACITY; equality allowed); order line quantity <= lot.available_units and shrink quantity <= available (ERR_INSUFFICIENT_QUANTITY); terms_days <= 30 unless paca_special_agreement (ERR_TERMS_EXCEEDED)"
    error_id: ERR_PRICE_NOT_POSTED
    http_status: 422
    applies_to: "POST /market/purchase-lots, POST /market/daily-prices, POST /market/ripening-bookings, POST /market/sales-orders, PATCH /market/customers/{id}, POST /market/customers, POST /market/shrink-records/{id}/approve"
  - priority: 10
    category: business_fiscal
    check: "Money gates run last: confirm allowed only when customer.credit_exposure_cents + order.subtotal_cents <= credit_limit_cents (ERR_CREDIT_LIMIT_EXCEEDED); payment amount must not exceed balance_cents after any earned discount (ERR_OVERPAYMENT)"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /market/sales-orders/{id}/confirm, POST /market/payments"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: /market/shippers
    description: "Register a shipper/grower"
    roles: [MarketAdmin]
    code: 201
    input: [name, paca_license]
    output: Shipper
    side_effects: []
  - method: GET
    path: /market/shippers/{id}
    description: "Fetch one shipper"
    roles: [MarketAdmin, Receiver, USDAInspector, SalesDesk, BillingClerk, CustomerRep]
    code: 200
    input: []
    output: Shipper
    side_effects: []

  - method: POST
    path: /market/customers
    description: "Register a buyer. terms_days > 30 rejected unless paca_special_agreement is true."
    roles: [MarketAdmin]
    code: 201
    input: [name, credit_limit_cents, "terms_days?", "paca_special_agreement?"]
    output: Customer
    side_effects: []
  - method: GET
    path: /market/customers/{id}
    description: "Fetch one customer"
    roles: [MarketAdmin, Receiver, USDAInspector, SalesDesk, BillingClerk, CustomerRep]
    code: 200
    input: []
    output: Customer
    side_effects: []
  - method: PATCH
    path: /market/customers/{id}
    description: "Update credit terms / status. OCC: expected_customer_version required; stale value -> ERR_STALE_VERSION (412)."
    roles: [MarketAdmin]
    code: 200
    input: ["credit_limit_cents?", "terms_days?", "paca_special_agreement?", "status?", expected_customer_version]
    output: Customer
    side_effects: ["increments Customer.version by 1", "terms_days > 30 without paca_special_agreement -> ERR_TERMS_EXCEEDED"]
  - method: GET
    path: /market/customers/{id}/sales-orders
    description: "List orders of a customer (reverse lookup of SalesOrder.customer_id)"
    roles: [MarketAdmin, Receiver, USDAInspector, SalesDesk, BillingClerk, CustomerRep]
    code: 200
    input: []
    output: SalesOrder[]
    side_effects: []
  - method: GET
    path: /market/customers/{id}/invoices
    description: "List invoices of a customer (reverse lookup of Invoice.customer_id)"
    roles: [MarketAdmin, Receiver, USDAInspector, SalesDesk, BillingClerk, CustomerRep]
    code: 200
    input: []
    output: Invoice[]
    side_effects: []

  - method: POST
    path: /market/commodities
    description: "Register a commodity with cold-chain band and ethylene class"
    roles: [MarketAdmin]
    code: 201
    input: [code, name, ethylene_class, temp_min_f, temp_max_f, "max_violation_minutes?"]
    output: Commodity
    side_effects: []
  - method: GET
    path: /market/commodities/{id}
    description: "Fetch one commodity"
    roles: [MarketAdmin, Receiver, USDAInspector, SalesDesk, BillingClerk, CustomerRep]
    code: 200
    input: []
    output: Commodity
    side_effects: []

  - method: POST
    path: /market/daily-prices
    description: "Post the daily market price report line for a commodity; one per (commodity_id, market_date)"
    roles: [MarketAdmin]
    code: 201
    input: [commodity_id, market_date, low_price, high_price]
    output: DailyPrice
    side_effects: ["computes mid_price"]
  - method: GET
    path: /market/daily-prices/{id}
    description: "Fetch one daily price row"
    roles: [MarketAdmin, Receiver, USDAInspector, SalesDesk, BillingClerk, CustomerRep]
    code: 200
    input: []
    output: DailyPrice
    side_effects: []
  - method: GET
    path: /market/daily-prices
    description: "List daily prices (reverse lookup of DailyPrice.commodity_id)"
    roles: [MarketAdmin, Receiver, USDAInspector, SalesDesk, BillingClerk, CustomerRep]
    code: 200
    input: ["commodity_id?", "market_date?", "limit?", "offset?"]
    output: DailyPrice[]
    side_effects: []

  - method: POST
    path: /market/purchase-lots
    description: "Buy a lot at the terminal. Requires a DailyPrice for (commodity_id, market_date); unit price must be inside the daily band."
    roles: [Receiver]
    code: 201
    input: [shipper_id, commodity_id, market_date, quantity_units, shipper_unit_price, declared_grade]
    output: PurchaseLot
    side_effects: ["computes provisional_cost_cents (lot_landed_cost PROVISIONAL)", "initializes adjusted_cost_cents and payable_cents to provisional", "recomputes shipper.trust_exposure_cents"]
  - method: GET
    path: /market/purchase-lots
    description: "List lots with filters (reverse lookup of PurchaseLot.shipper_id / commodity_id)"
    roles: [MarketAdmin, Receiver, USDAInspector, SalesDesk, BillingClerk, CustomerRep]
    code: 200
    input: ["shipper_id?", "commodity_id?", "status?", "market_date?", "limit?", "offset?"]
    output: PurchaseLot[]
    side_effects: []
  - method: GET
    path: /market/purchase-lots/{id}
    description: "Fetch one lot"
    roles: [MarketAdmin, Receiver, USDAInspector, SalesDesk, BillingClerk, CustomerRep]
    code: 200
    input: []
    output: PurchaseLot
    side_effects: []
  - method: POST
    path: /market/purchase-lots/{id}/receive
    description: "Mark an ORDERED lot RECEIVED"
    roles: [Receiver]
    code: 200
    input: []
    output: PurchaseLot
    side_effects: ["PurchaseLot ORDERED -> RECEIVED", "increments PurchaseLot.version by 1"]
  - method: POST
    path: /market/purchase-lots/{id}/dispute
    description: "Open a grade/pack dispute after a FAIL inspection"
    roles: [Receiver]
    code: 200
    input: ["reason?"]
    output: PurchaseLot
    side_effects: ["PurchaseLot INSPECTED -> DISPUTED", "increments PurchaseLot.version by 1"]
  - method: POST
    path: /market/purchase-lots/{id}/resolve-dispute
    description: "Rule on an open dispute: ACCEPT_AS_IS, PRICE_ADJUST (agreed_unit_price required), or REJECT_TO_SHIPPER"
    roles: [MarketAdmin]
    code: 200
    input: [outcome, "agreed_unit_price?"]
    output: PurchaseLot
    side_effects: ["PurchaseLot DISPUTED -> ACCEPTED or REJECTED", "PRICE_ADJUST recomputes adjusted_cost_cents via lot_landed_cost FINAL", "REJECT zeroes payable_cents and voids any SUBMITTED inspection", "recomputes shipper.trust_exposure_cents", "increments PurchaseLot.version by 1"]
  - method: POST
    path: /market/purchase-lots/{id}/close
    description: "Close an ACCEPTED lot once no active ripening bookings remain"
    roles: [Receiver]
    code: 200
    input: []
    output: PurchaseLot
    side_effects: ["PurchaseLot ACCEPTED -> CLOSED", "recomputes shipper.trust_exposure_cents", "increments PurchaseLot.version by 1"]

  - method: POST
    path: /market/inspections
    description: "USDA inspector files a grade/pack inspection on a RECEIVED or DISPUTED lot"
    roles: [USDAInspector]
    code: 201
    input: [purchase_lot_id, inspected_grade, defect_pct, result]
    output: Inspection
    side_effects: ["PurchaseLot RECEIVED/DISPUTED -> INSPECTED", "increments PurchaseLot.version by 1"]
  - method: GET
    path: /market/purchase-lots/{id}/inspections
    description: "List inspections of a lot (reverse lookup of Inspection.purchase_lot_id)"
    roles: [MarketAdmin, Receiver, USDAInspector, SalesDesk, BillingClerk, CustomerRep]
    code: 200
    input: []
    output: Inspection[]
    side_effects: []
  - method: POST
    path: /market/inspections/{id}/certify
    description: "Certify a SUBMITTED inspection; PASS moves the lot to ACCEPTED with FINAL cost"
    roles: [USDAInspector]
    code: 200
    input: []
    output: Inspection
    side_effects: ["Inspection SUBMITTED -> CERTIFIED", "on PASS: lot INSPECTED -> ACCEPTED, lot_landed_cost FINAL runs, payable recomputed", "increments PurchaseLot.version by 1"]

  - method: POST
    path: /market/temperature-readings
    description: "Append a cold-chain probe record; recomputes lot violation minutes and may fire the violation cascade"
    roles: [Receiver]
    code: 201
    input: [purchase_lot_id, recorded_at, temp_f, duration_minutes]
    output: TemperatureReading
    side_effects: ["cold_chain_accumulation recompute", "on VIOLATED flip: cascade lot -> CONFIRMED orders ON_HOLD (COLD_CHAIN) -> reservations released", "increments PurchaseLot.version by 1"]
  - method: GET
    path: /market/purchase-lots/{id}/temperature-readings
    description: "List probe records of a lot (reverse lookup of TemperatureReading.purchase_lot_id)"
    roles: [MarketAdmin, Receiver, USDAInspector, SalesDesk, BillingClerk, CustomerRep]
    code: 200
    input: []
    output: TemperatureReading[]
    side_effects: []

  - method: POST
    path: /market/ripening-rooms
    description: "Register a ripening room"
    roles: [MarketAdmin]
    code: 201
    input: [name, capacity_pallets, ethylene_capable]
    output: RipeningRoom
    side_effects: []
  - method: GET
    path: /market/ripening-rooms/{id}
    description: "Fetch one room"
    roles: [MarketAdmin, Receiver, USDAInspector, SalesDesk, BillingClerk, CustomerRep]
    code: 200
    input: []
    output: RipeningRoom
    side_effects: []
  - method: GET
    path: /market/ripening-rooms/{id}/ripening-bookings
    description: "List bookings of a room (reverse lookup of RipeningBooking.room_id)"
    roles: [MarketAdmin, Receiver, USDAInspector, SalesDesk, BillingClerk, CustomerRep]
    code: 200
    input: []
    output: RipeningBooking[]
    side_effects: []

  - method: POST
    path: /market/ripening-bookings
    description: "Schedule a lot into a room. Checks ethylene conflict, 2h buffer overlap, aggregate pallet capacity. Lot must not be REJECTED or CLOSED."
    roles: [Receiver]
    code: 201
    input: [room_id, purchase_lot_id, pallet_count, start_time, end_time, ethylene_enabled, target_stage]
    output: RipeningBooking
    side_effects: []
  - method: GET
    path: /market/purchase-lots/{id}/ripening-bookings
    description: "List bookings of a lot (reverse lookup of RipeningBooking.purchase_lot_id)"
    roles: [MarketAdmin, Receiver, USDAInspector, SalesDesk, BillingClerk, CustomerRep]
    code: 200
    input: []
    output: RipeningBooking[]
    side_effects: []
  - method: POST
    path: /market/ripening-bookings/{id}/start
    description: "Begin a SCHEDULED booking; lot must be ACCEPTED and clock inside [start_time, end_time)"
    roles: [Receiver]
    code: 200
    input: []
    output: RipeningBooking
    side_effects: ["RipeningBooking SCHEDULED -> IN_PROCESS", "increments RipeningBooking.version by 1"]
  - method: POST
    path: /market/ripening-bookings/{id}/complete
    description: "Finish an IN_PROCESS booking"
    roles: [Receiver]
    code: 200
    input: []
    output: RipeningBooking
    side_effects: ["RipeningBooking IN_PROCESS -> COMPLETED", "increments RipeningBooking.version by 1"]
  - method: POST
    path: /market/ripening-bookings/{id}/cancel
    description: "Cancel a SCHEDULED booking; frees its pallets (capacity invariant)"
    roles: [Receiver]
    code: 200
    input: []
    output: RipeningBooking
    side_effects: ["RipeningBooking SCHEDULED -> CANCELLED", "increments RipeningBooking.version by 1"]

  - method: POST
    path: /market/shrink-records
    description: "Record shrink/dump on an ACCEPTED lot (DRAFT until approved)"
    roles: [Receiver]
    code: 201
    input: [purchase_lot_id, quantity, reason]
    output: ShrinkRecord
    side_effects: []
  - method: GET
    path: /market/purchase-lots/{id}/shrink-records
    description: "List shrink records of a lot (reverse lookup of ShrinkRecord.purchase_lot_id)"
    roles: [MarketAdmin, Receiver, USDAInspector, SalesDesk, BillingClerk, CustomerRep]
    code: 200
    input: []
    output: ShrinkRecord[]
    side_effects: []
  - method: POST
    path: /market/shrink-records/{id}/approve
    description: "Approve a DRAFT shrink record: issues the CreditMemo and recomputes lot payable (segregation of duties: Receiver may not approve)"
    roles: [MarketAdmin]
    code: 200
    input: []
    output: ShrinkRecord
    side_effects: ["ShrinkRecord DRAFT -> APPROVED", "creates CreditMemo ISSUED", "lot.dumped_units += quantity", "lot_payable_reconciliation recomputes payable_cents", "recomputes shipper.trust_exposure_cents"]

  - method: GET
    path: /market/purchase-lots/{id}/credit-memos
    description: "List credit memos of a lot (reverse lookup of CreditMemo.purchase_lot_id)"
    roles: [MarketAdmin, Receiver, USDAInspector, SalesDesk, BillingClerk, CustomerRep]
    code: 200
    input: []
    output: CreditMemo[]
    side_effects: []
  - method: POST
    path: /market/credit-memos/{id}/void
    description: "Void an ISSUED credit memo; lot payable is restored (compensating action)"
    roles: [BillingClerk]
    code: 200
    input: []
    output: CreditMemo
    side_effects: ["CreditMemo ISSUED -> VOID", "lot_payable_reconciliation recomputes payable_cents", "recomputes shipper.trust_exposure_cents", "increments CreditMemo.version by 1"]

  - method: POST
    path: /market/sales-orders
    description: "Create a customer order with lines. Enforces customer ACTIVE, cut-off, delivery-window overlap, line availability. CustomerRep may only create for own customer_id."
    roles: [SalesDesk, CustomerRep]
    code: 201
    input: [customer_id, delivery_date, window_start, window_end, "pallet_count?", lines]
    output: SalesOrder
    side_effects: ["computes subtotal_cents via order_subtotal (per-line round then sum)"]
  - method: GET
    path: /market/sales-orders/{id}
    description: "Fetch one order"
    roles: [MarketAdmin, Receiver, USDAInspector, SalesDesk, BillingClerk, CustomerRep]
    code: 200
    input: []
    output: SalesOrder
    side_effects: []
  - method: POST
    path: /market/sales-orders/{id}/confirm
    description: "Confirm a PENDING order or release a CREDIT-held one; enforces credit limit and reserves lot quantities"
    roles: [SalesDesk]
    code: 200
    input: []
    output: SalesOrder
    side_effects: ["SalesOrder PENDING/ON_HOLD -> CONFIRMED", "per line lot.reserved_units += quantity", "recomputes customer.credit_exposure_cents", "increments SalesOrder.version by 1"]
  - method: POST
    path: /market/sales-orders/{id}/pick
    description: "Pick a CONFIRMED order; blocked when any line lot is cold-chain VIOLATED"
    roles: [Receiver]
    code: 200
    input: []
    output: SalesOrder
    side_effects: ["SalesOrder CONFIRMED -> PICKED", "increments SalesOrder.version by 1"]
  - method: POST
    path: /market/sales-orders/{id}/deliver
    description: "Deliver a PICKED order; converts reservations into sold units"
    roles: [Receiver]
    code: 200
    input: []
    output: SalesOrder
    side_effects: ["SalesOrder PICKED -> DELIVERED", "per line lot.reserved_units -= quantity and lot.sold_units += quantity", "recomputes customer.credit_exposure_cents", "increments SalesOrder.version by 1"]
  - method: POST
    path: /market/sales-orders/{id}/cancel
    description: "Cancel a PENDING/CONFIRMED/ON_HOLD order; CustomerRep may cancel only own PENDING orders. Releases reservations."
    roles: [SalesDesk, CustomerRep]
    code: 200
    input: []
    output: SalesOrder
    side_effects: ["SalesOrder -> CANCELLED", "reservations released when held", "recomputes customer.credit_exposure_cents", "increments SalesOrder.version by 1"]

  - method: POST
    path: /market/invoices
    description: "Invoice a DELIVERED order; computes totals, due_date, discount window (invoice_settlement)"
    roles: [BillingClerk]
    code: 201
    input: [sales_order_id]
    output: Invoice
    side_effects: ["SalesOrder DELIVERED -> INVOICED", "Invoice created OPEN", "recomputes customer.credit_exposure_cents", "increments SalesOrder.version by 1"]
  - method: GET
    path: /market/invoices/{id}
    description: "Fetch one invoice"
    roles: [MarketAdmin, Receiver, USDAInspector, SalesDesk, BillingClerk, CustomerRep]
    code: 200
    input: []
    output: Invoice
    side_effects: []
  - method: GET
    path: /market/sales-orders/{id}/invoices
    description: "List invoices of an order, 0 or 1 entries (reverse lookup of Invoice.sales_order_id)"
    roles: [MarketAdmin, Receiver, USDAInspector, SalesDesk, BillingClerk, CustomerRep]
    code: 200
    input: []
    output: Invoice[]
    side_effects: []
  - method: POST
    path: /market/payments
    description: "Post a customer payment against one invoice; applies early-pay discount when earned; PAID at zero balance"
    roles: [BillingClerk]
    code: 201
    input: [invoice_id, amount_cents]
    output: Payment
    side_effects: ["invoice_settlement payment step", "may flip Invoice -> PAID", "recomputes customer.credit_exposure_cents", "increments Invoice.version by 1"]
  - method: GET
    path: /market/invoices/{id}/payments
    description: "List payments of an invoice (reverse lookup of Payment.invoice_id)"
    roles: [MarketAdmin, Receiver, USDAInspector, SalesDesk, BillingClerk, CustomerRep]
    code: 200
    input: []
    output: Payment[]
    side_effects: []

  - method: POST
    path: /market/labor-tickets
    description: "Record cross-dock/repack labor on a lot; charge computed per ticket_type (labor_charge)"
    roles: [Receiver]
    code: 201
    input: [purchase_lot_id, ticket_type, work_date, hours, "pieces?", "hourly_rate?", "piece_rate?"]
    output: LaborTicket
    side_effects: ["computes charge_cents via labor_charge (HOURLY or PIECE variant)"]
  - method: GET
    path: /market/purchase-lots/{id}/labor-tickets
    description: "List labor tickets of a lot (reverse lookup of LaborTicket.purchase_lot_id)"
    roles: [MarketAdmin, Receiver, USDAInspector, SalesDesk, BillingClerk, CustomerRep]
    code: 200
    input: []
    output: LaborTicket[]
    side_effects: []

  - method: POST
    path: /_clock/set_current_utc
    description: "Test-driving logical clock. Default at server start is exactly 2026-05-01T00:00:00Z and never falls back to wall-clock time; this endpoint moves the logical clock used by cut-off, due-date, booking start/expiry and all *_at stamps."
    roles: [MarketAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: []
  - method: POST
    path: /market/ops/run-day-close
    description: "Ops-run checkpoint at the current logical clock: OPEN invoices past due_date become PAST_DUE; PAST_DUE invoices past due_date + 30 days become TRUST_CLAIMED (suspending the customer and CREDIT-holding their CONFIRMED orders); stale SCHEDULED ripening bookings whose end_time passed become EXPIRED"
    roles: [MarketAdmin]
    code: 200
    input: []
    output: { invoices_marked_past_due: integer, invoices_trust_claimed: integer, bookings_expired: integer }
    side_effects: ["Invoice OPEN -> PAST_DUE / PAST_DUE -> TRUST_CLAIMED transitions", "Customer -> SUSPENDED cascade on trust claim", "SalesOrder CONFIRMED -> ON_HOLD (CREDIT) cascade with reservation release", "RipeningBooking SCHEDULED -> EXPIRED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID, or CustomerRep id not matching an existing Customer" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not in the endpoint's roles, or CustomerRep touching a resource owned by another customer" }
  - { id: ERR_VALIDATION, http: 422, condition: "Request shape failure: missing required field, bad type, bad enum, non-positive quantity/amount, window/end inversion, ticket-type-specific fields absent" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK id does not resolve to an existing entity" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition not allowed from the entity's current state (includes double receive, cancel of DELIVERED order, close with active booking, payment on PAID invoice, booking start outside its time window)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "PATCH /market/customers/{id} expected_customer_version does not match the server's Customer.version" }
  - { id: ERR_PRICE_NOT_POSTED, http: 422, condition: "No DailyPrice exists for (commodity_id, market_date) at lot creation" }
  - { id: ERR_DUPLICATE_PRICE, http: 409, condition: "A DailyPrice already exists for (commodity_id, market_date)" }
  - { id: ERR_PRICE_OUT_OF_RANGE, http: 422, condition: "shipper_unit_price outside the DailyPrice [low_price, high_price] band (inclusive bounds)" }
  - { id: ERR_INSPECTION_OPEN, http: 409, condition: "Creating an inspection while another SUBMITTED inspection exists for the lot" }
  - { id: ERR_COLD_CHAIN_VIOLATION, http: 409, condition: "Pick/deliver an order whose line lot has cold_chain_status == VIOLATED" }
  - { id: ERR_ETHYLENE_CONFLICT, http: 409, condition: "Ripening booking pairs ethylene injection with an overlapping SENSITIVE-commodity lot on the same room (either direction)" }
  - { id: ERR_ROOM_OVERLAP, http: 409, condition: "Ripening booking interval intersects another active booking's 2-hour-buffer-inflated interval on the same room" }
  - { id: ERR_ROOM_CAPACITY, http: 422, condition: "Aggregate pallets of overlapping active bookings plus the new booking exceed room capacity_pallets" }
  - { id: ERR_WINDOW_OVERLAP, http: 409, condition: "Customer already has a non-cancelled, non-invoiced order whose half-open delivery window intersects the new one on the same delivery_date" }
  - { id: ERR_CUTOFF_PASSED, http: 422, condition: "delivery_date <= clock date, or delivery_date is the next day and clock time is strictly after 14:00:00" }
  - { id: ERR_CUSTOMER_INACTIVE, http: 409, condition: "Order create/confirm while customer.status == SUSPENDED" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 422, condition: "Confirm would push customer.credit_exposure_cents + subtotal strictly above credit_limit_cents" }
  - { id: ERR_INSUFFICIENT_QUANTITY, http: 422, condition: "Order line quantity or shrink quantity exceeds lot.available_units" }
  - { id: ERR_LOT_NOT_ACCEPTED, http: 409, condition: "Ripening booking start (or order line reference at create/confirm) against a lot not in ACCEPTED" }
  - { id: ERR_OVERPAYMENT, http: 422, condition: "Payment amount exceeds balance_cents after any earned discount" }
  - { id: ERR_TERMS_EXCEEDED, http: 422, condition: "terms_days > 30 without paca_special_agreement == true" }
  - { id: ERR_INVOICE_EXISTS, http: 409, condition: "Invoice creation for an order that is already INVOICED" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: MarketAdmin
    description: "Terminal market operator office: configuration, price posting, dispute rulings, shrink approval, customer terms, day-close"
    identity: opaque
    exclusive_operations:
      - POST /market/shippers
      - POST /market/customers
      - PATCH /market/customers/{id}
      - POST /market/commodities
      - POST /market/daily-prices
      - POST /market/purchase-lots/{id}/resolve-dispute
      - POST /market/shrink-records/{id}/approve
      - POST /market/ripening-rooms
      - POST /_clock/set_current_utc
      - POST /market/ops/run-day-close
    shared_operations: [all GET endpoints]
  - name: Receiver
    description: "Warehouse floor: lot receipt, disputes filing, cold-chain probes, ripening operations, shrink recording, labor tickets, order pick/deliver"
    identity: opaque
    exclusive_operations:
      - POST /market/purchase-lots
      - POST /market/purchase-lots/{id}/receive
      - POST /market/purchase-lots/{id}/dispute
      - POST /market/purchase-lots/{id}/close
      - POST /market/temperature-readings
      - POST /market/ripening-bookings
      - POST /market/ripening-bookings/{id}/start
      - POST /market/ripening-bookings/{id}/complete
      - POST /market/ripening-bookings/{id}/cancel
      - POST /market/shrink-records
      - POST /market/labor-tickets
      - POST /market/sales-orders/{id}/pick
      - POST /market/sales-orders/{id}/deliver
    shared_operations: [all GET endpoints]
  - name: USDAInspector
    description: "Federal inspector filing and certifying grade/pack inspections"
    identity: opaque
    exclusive_operations:
      - POST /market/inspections
      - POST /market/inspections/{id}/certify
    shared_operations: [all GET endpoints]
  - name: SalesDesk
    description: "House sales desk: creates and manages orders for any customer; confirms and cancels"
    identity: opaque
    exclusive_operations:
      - POST /market/sales-orders/{id}/confirm
    shared_operations:
      - POST /market/sales-orders
      - POST /market/sales-orders/{id}/cancel
      - all GET endpoints
  - name: BillingClerk
    description: "Billing office: invoicing, payment posting, credit-memo voids"
    identity: opaque
    exclusive_operations:
      - POST /market/invoices
      - POST /market/payments
      - POST /market/credit-memos/{id}/void
    shared_operations: [all GET endpoints]
  - name: CustomerRep
    description: "Buyer-side representative; X-User-ID must equal the Customer.id they represent"
    identity: entity_backed:Customer
    exclusive_operations: []
    shared_operations:
      - POST /market/sales-orders (own customer_id only)
      - POST /market/sales-orders/{id}/cancel (own orders, PENDING only)
      - all GET endpoints (own resources)
