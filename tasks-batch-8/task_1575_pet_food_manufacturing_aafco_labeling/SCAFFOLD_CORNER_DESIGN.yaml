      - name: formula_revision_cycle_cyclic_machine
        claim_type: valid_transition
        grounds:
          - state_machines.Formula.NUTRIENT_REVIEW_to_DRAFT
          - entities.Formula.fields.revision_number
        excluded_because:
          difficulty_instance: formula_review_revision_cycle
          rationale: "The DRAFT<->NUTRIENT_REVIEW cycle and revision_number lap counting are asserted by the named §1.8 instance."

      - name: complaint_auto_escalation_fork
        claim_type: valid_transition
        grounds:
          - state_machines.ComplaintCase.INTAKE_to_TRIAGED
        excluded_because:
          difficulty_instance: complaint_case_branching_fork_auto_escalation
          rationale: "The INTAKE -> {TRIAGED, ESCALATED_RECALL} score-driven fork is asserted by the named §1.8 instance."

      - name: recall_initiation_cascade
        claim_type: side_effect_execution
        grounds:
          - state_machines.RecallAction
          - entities.BatchLotCode.fields.status
        excluded_because:
          difficulty_instance: recall_initiation_three_hop_cascade
          rationale: "Recall initiation's batch/lot/flag/count cascade is asserted hop-by-hop by the named §1.8 instance."

      - name: sia_revoke_formula_demotion
        claim_type: side_effect_execution
        grounds:
          - state_machines.SupplierIngredientApproval.APPROVED_to_REVOKED
        excluded_because:
          difficulty_instance: pairing_revocation_two_hop_formula_demotion
          rationale: "The revoke cascade demoting uncovered NUTRIENT_REVIEW formulas to DRAFT is asserted by the named §1.8 instance."

      - name: recall_terminate_compensating_cascade
        claim_type: side_effect_execution
        grounds:
          - state_machines.RecallAction.INITIATED_to_TERMINATED
        excluded_because:
          difficulty_instance: recall_initiate_terminate_preserves_lot_population
          rationale: "The terminate compensation (lots back to QUARANTINED, counts conserved) is asserted by the named §1.8 instance."

      - name: trial_verdict_ratio_boundary
        claim_type: valid_transition
        grounds:
          - state_machines.FeedingTrialProtocol.ANALYSIS_to_PASSED
          - state_machines.FeedingTrialProtocol.ANALYSIS_to_FAILED
        excluded_because:
          difficulty_instance: trial_completion_ratio_exactly_at_pass_floor
          rationale: "The completion_ratio >= 0.75 verdict routing (0.75 PASSED, 0.625 FAILED) is asserted by the named §1.8 instance."

  # ===========================================================================
  # Section 3: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: ga_spot_mean_and_deviation_index
        claim_type: correct_result
        grounds:
          - calculations.ga_composite_calculation
          - calculations.ga_deviation_index
          - entities.GuaranteedAnalysisReport.fields.label_compliance
        distinguishing_aspect: |
          With only spot samples (no COMPOSITE) the composite is the plain
          mean: two samples at 25.0 protein composite to exactly 25.0, and
          against the label minimum 26.0 the deviation index is
          3*1.0 + 2*0 + 1.5*0 + 1*0 == 3.0, so label_compliance == MISBRANDED.
          A second batch whose samples meet every guarantee (27.0 protein)
          yields deviation_index == 0.0 and label_compliance == COMPLIANT.
        test_recipe:
          setup:
            - "LOCKED formula (label guarantees protein 26.0 / fat 9.0 / fiber 3.0 / moisture 10.0); batches B1 (LINE-G1) and B2 (LINE-G2) both COMPLETED"
          setup_api_calls:
            - call: "POST /petfood/brand-owners"
              payload: { legal_name: "GA Co", fein: "552100010", contact_email: "qa@ga.example" }
              as: PlatformAdmin
              captures: { bo_id: $.data.id }
            - call: "POST /petfood/suppliers"
              payload: { supplier_name: "GA Supply", fsma_facility_id: "FSMA-G100", country_code: "US", risk_tier: "LOW" }
              as: PlatformAdmin
