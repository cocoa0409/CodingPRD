            - call: "POST /amended-returns"
              payload: { correction_case_id: "${case_id}", form_code: "941X", accrual_through_date: "2026-04-30", expected_correction_case_version: "${stale_ver}" }
              as: TaxPreparer
            - call: "GET /correction-cases/${case_id}"
