  - name: hoist_changeover_buffer_boundary_on_half_open_windows
    grounds:
    - validations[priority=99]
    - entities.HoistReservation.fields.blocked_from
    - entities.HoistReservation.fields.blocked_until
    - entities.HoistRig.fields.changeover_buffer_minutes
    distinguishing_aspect: 'Only the stored reservation is expanded by the 45-minute changeover buffer, and the intervals
      are half-open: a request starting 30 minutes after the previous window closes is rejected, while one starting exactly
      45 minutes after it - precisely on blocked_until - is accepted, which fails if the implementation buffers the incoming
      window as well or uses closed intervals.'
    test_recipe:
      setup:
      - logical clock 2026-08-03T08:00:00Z
      - one hoist rig with changeover_buffer_minutes 45 serving two zones of the same package
      - reservation 1 holds 2026-08-10T06:00:00Z -> 2026-08-10T12:00:00Z for zone 1
