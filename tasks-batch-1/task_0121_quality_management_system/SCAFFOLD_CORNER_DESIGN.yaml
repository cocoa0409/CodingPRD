          rationale: "ERR_FINDING_NCR_OPEN is the subject of the named §1.8 cross-entity instance."

      - name: err_finding_requires_ncr_triggerable
        claim_type: violation_to_error
        grounds:
          - errors[ERR_FINDING_REQUIRES_NCR]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / finding_close_requires_escalated_ncr_closed
          rationale: "ERR_FINDING_REQUIRES_NCR is fired by the §1.9 state_machines instance finding_close_open_non_observation_requires_ncr; recorded for catalog coverage."

      - name: err_revision_sequence_triggerable
        claim_type: violation_to_error
        grounds:
          - errors[ERR_REVISION_SEQUENCE]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / finding_close_requires_escalated_ncr_closed
          rationale: "ERR_REVISION_SEQUENCE is fired by the §1.9 validations instance revision_create_out_of_sequence_revision_sequence; recorded for catalog coverage."

      - name: err_effectiveness_too_low_triggerable
        claim_type: violation_to_error
        grounds:
          - errors[ERR_EFFECTIVENESS_TOO_LOW]
        excluded_because:
          difficulty_instance: dual_variant_calc / capa_effectiveness_provisional_vs_final
          rationale: "ERR_EFFECTIVENESS_TOO_LOW is fired by the §1.9 calculations instance capa_provisional_below_gate_blocks_verify; the gate inputs derive from the named §1.8 dual-variant calc."

      - name: err_stale_version_triggerable
        claim_type: violation_to_error
        grounds:
          - errors[ERR_STALE_VERSION]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / use_as_is_disposition_requires_approved_in_window_deviation
          rationale: "ERR_STALE_VERSION is fired by the §1.9 cross_cutting_layers instance occ_stale_control_plan_version_rejected; recorded here for catalog coverage."

      - name: err_ncr_has_capa_triggerable
        claim_type: violation_to_error
        grounds:
          - errors[ERR_NCR_HAS_CAPA]
        excluded_because:
          difficulty_instance: non_linear_state_machine / ncr_disposition_branching_fork_divergent_cost
          rationale: "ERR_NCR_HAS_CAPA is fired by the §1.9 state_machines instance ncr_void_open_with_capa_blocked; recorded for catalog coverage."

  # ===========================================================================
  # Section 7 — From Table 7 (RBAC) — role_model: segregation_of_duties + peer roles
  # ===========================================================================
  - section: rbac
    instances:
      # ---- Forbidden role on an exclusive op ----
      - name: inspector_cannot_create_supplier_forbidden_role
        claim_type: role_denied
        grounds:
          - roles.Inspector
          - roles.QualityManager
          - validations[priority=2]
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "POST /suppliers is QualityManager-exclusive; an Inspector calling it is denied with ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup:
            - "An Inspector Personnel exists."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "Insp Rd", email: "insprd@x.com", role: "INSPECTOR" }
              as: QualityManager
              captures: { insp_id: $.data.id }
          trigger:
            - call: "POST /suppliers"
              payload: { name: "Denied Co", code: "DEN-SUP" }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "http_status == 403"
            - "data.error_id == ERR_FORBIDDEN_ROLE"

      - name: quality_engineer_cannot_disposition_forbidden_role
        claim_type: role_denied
        grounds:
          - roles.QualityEngineer
          - roles.QualityManager
          - validations[priority=2]
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "POST /nonconformance-reports/{id}/disposition is QualityManager-exclusive; a QualityEngineer calling it on an OPEN NCR is denied with ERR_FORBIDDEN_ROLE (403) at priority 2, before the state check."
        test_recipe:
          setup:
            - "A QualityEngineer and a Supplier exist; a SUPPLIER NCR is OPEN."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "QE Rd2", email: "qerd2@x.com", role: "QUALITY_ENGINEER" }
              as: QualityManager
              captures: { qe_id: $.data.id }
            - call: "POST /suppliers"
              payload: { name: "Rd2 Co", code: "RD2-SUP" }
              as: QualityManager
              captures: { sup_id: $.data.id }
            - call: "POST /nonconformance-reports"
              payload: { title: "rd2 ncr", source: "SUPPLIER", severity: "MAJOR", defect_qty: 2, unit_cost_cents: 1000, part_number: "P-RD2", supplier_id: "${sup_id}" }
              as: QualityEngineer
              as_user_id: "${qe_id}"
              captures: { ncr_id: $.data.id }
            - call: "POST /nonconformance-reports/${ncr_id}/open"
              payload: {}
              as: QualityEngineer
              as_user_id: "${qe_id}"
          trigger:
            - call: "POST /nonconformance-reports/${ncr_id}/disposition"
              payload: { disposition: "REWORK" }
              as: QualityEngineer
              as_user_id: "${qe_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "http_status == 403"
            - "data.error_id == ERR_FORBIDDEN_ROLE"
            - "NonconformanceReport.${ncr_id}.status == OPEN"

      # ---- peer_roles isolation: SupplierUser cannot act on another supplier's SCAR ----
      - name: scar_acknowledge_wrong_supplier_not_owner
        claim_type: peer_roles
        grounds:
          - roles.SupplierUser
          - state_machines.Scar.OPEN_to_ACK
          - validations[priority=7]
          - entities.Scar.fields.supplier_id
          - errors[ERR_NOT_RESOURCE_OWNER]
        distinguishing_aspect: "SupplierUser is entity_backed:Supplier; acknowledging an OPEN SCAR whose supplier_id != X-User-ID (a different supplier) is denied with ERR_NOT_RESOURCE_OWNER (403)."
        test_recipe:
          setup:
            - "A QualityEngineer and TWO Suppliers (owner + other) exist; a SUPPLIER NCR is OPEN against the owner; an OPEN SCAR is opened for it."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "QE No", email: "qeno@x.com", role: "QUALITY_ENGINEER" }
              as: QualityManager
              captures: { qe_id: $.data.id }
            - call: "POST /suppliers"
              payload: { name: "Owner No", code: "OWN-NO" }
              as: QualityManager
              captures: { owner_sup_id: $.data.id }
            - call: "POST /suppliers"
              payload: { name: "Other No", code: "OTH-NO" }
              as: QualityManager
              captures: { other_sup_id: $.data.id }
            - call: "POST /nonconformance-reports"
              payload: { title: "no ncr", source: "SUPPLIER", severity: "MAJOR", defect_qty: 2, unit_cost_cents: 1000, part_number: "P-NO", supplier_id: "${owner_sup_id}" }
              as: QualityEngineer
              as_user_id: "${qe_id}"
              captures: { ncr_id: $.data.id }
            - call: "POST /nonconformance-reports/${ncr_id}/open"
              payload: {}
              as: QualityEngineer
              as_user_id: "${qe_id}"
            - call: "POST /scars"
              payload: { ncr_id: "${ncr_id}", supplier_id: "${owner_sup_id}", due_at: "2026-09-01T00:00:00Z" }
              as: QualityManager
              captures: { scar_id: $.data.id }
          trigger:
            - call: "POST /scars/${scar_id}/transition"
              payload: { action: "ACKNOWLEDGE" }
              as: SupplierUser
              as_user_id: "${other_sup_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "http_status == 403"
            - "data.error_id == ERR_NOT_RESOURCE_OWNER"
            - "Scar.${scar_id}.status == OPEN"

      # ---- ownership: Auditor not lead-auditor cannot start the audit ----
      - name: audit_start_non_lead_auditor_not_owner
        claim_type: peer_roles
        grounds:
          - roles.Auditor
          - state_machines.Audit.PLANNED_to_IN_PROGRESS
          - validations[priority=7]
          - entities.Audit.fields.lead_auditor_id
          - errors[ERR_NOT_RESOURCE_OWNER]
        distinguishing_aspect: "Audit START requires X-User-ID == Audit.lead_auditor_id; a different AUDITOR starting another's PLANNED audit is denied with ERR_NOT_RESOURCE_OWNER (403)."
        test_recipe:
          setup:
            - "Two AUDITOR Personnel exist (lead + other); a PLANNED Audit is led by the lead auditor."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "Aud Lead", email: "audlead@x.com", role: "AUDITOR" }
              as: QualityManager
              captures: { lead_id: $.data.id }
            - call: "POST /personnel"
              payload: { full_name: "Aud Other", email: "audother@x.com", role: "AUDITOR" }
              as: QualityManager
              captures: { other_id: $.data.id }
            - call: "POST /audits"
              payload: { title: "own audit", lead_auditor_id: "${lead_id}", scheduled_from: "2026-07-01T00:00:00Z", scheduled_to: "2026-07-02T00:00:00Z", clause_scope: "8.5" }
              as: Auditor
              as_user_id: "${lead_id}"
              captures: { audit_id: $.data.id }
          trigger:
            - call: "POST /audits/${audit_id}/transition"
              payload: { action: "START" }
              as: Auditor
              as_user_id: "${other_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "http_status == 403"
            - "data.error_id == ERR_NOT_RESOURCE_OWNER"
            - "Audit.${audit_id}.status == PLANNED"

      # ---- segregation_of_duties: NCR author cannot disposition own NCR ----
      - name: disposition_by_ncr_author_segregation_of_duties
        claim_type: segregation_of_duties
        grounds:
          - roles.QualityManager
          - state_machines.NonconformanceReport.OPEN_to_DISPOSITIONED
          - validations[priority=8]
          - entities.NonconformanceReport.fields.created_by_personnel_id
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: "SoD: a QualityManager whose X-User-ID equals the NCR.created_by_personnel_id cannot disposition the NCR they authored; rejected with ERR_SEGREGATION_OF_DUTIES (403). The acting user is created with role QUALITY_MANAGER so they can both raise (shared via role match) and attempt disposition."
        test_recipe:
          setup:
            - "A QualityManager Personnel and a Supplier exist; a SUPPLIER NCR is raised by that QualityManager (created_by_personnel_id == them) and OPENed."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "QM Sod", email: "qmsod@x.com", role: "QUALITY_MANAGER" }
              as: QualityManager
              captures: { qm_id: $.data.id }
            - call: "POST /personnel"
              payload: { full_name: "QE Sod", email: "qesod@x.com", role: "QUALITY_ENGINEER" }
              as: QualityManager
              captures: { qe_id: $.data.id }
            - call: "POST /suppliers"
              payload: { name: "Sod Co", code: "SOD-SUP" }
              as: QualityManager
              captures: { sup_id: $.data.id }
            - call: "POST /nonconformance-reports"
              payload: { title: "sod ncr", source: "SUPPLIER", severity: "MAJOR", defect_qty: 2, unit_cost_cents: 1000, part_number: "P-SOD", supplier_id: "${sup_id}" }
              as: QualityEngineer
              as_user_id: "${qm_id}"
              captures: { ncr_id: $.data.id }
            - call: "POST /nonconformance-reports/${ncr_id}/open"
              payload: {}
              as: QualityEngineer
              as_user_id: "${qm_id}"
          trigger:
            - call: "POST /nonconformance-reports/${ncr_id}/disposition"
              payload: { disposition: "REWORK" }
              as: QualityManager
              as_user_id: "${qm_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "http_status == 403"
            - "data.error_id == ERR_SEGREGATION_OF_DUTIES"
            - "NonconformanceReport.${ncr_id}.status == OPEN"

      # ---- segregation_of_duties: CAPA author cannot VERIFY own CAPA ----
      - name: capa_verify_by_author_segregation_of_duties
        claim_type: segregation_of_duties
        grounds:
          - roles.QualityManager
          - state_machines.Capa.VERIFICATION_to_EFFECTIVENESS_CHECK
          - validations[priority=8]
          - entities.Capa.fields.authored_by_personnel_id
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: "SoD: the QualityManager whose X-User-ID equals Capa.authored_by_personnel_id (they opened the CAPA) cannot VERIFY it; rejected with ERR_SEGREGATION_OF_DUTIES (403) even though provisional_effectiveness=0.60 passes the 0.50 gate."
        test_recipe:
          setup:
            - "A QualityManager Personnel and an independent QualityManager and a Supplier exist."
            - "A SUPPLIER NCR (defect_qty=5) is REWORK-dispositioned by the independent QM; the first QM opens the CAPA (authored_by == them), records D1/D4(containment=3), advances to VERIFICATION (provisional 0.60)."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "QM Auth", email: "qmauth@x.com", role: "QUALITY_MANAGER" }
              as: QualityManager
              captures: { qm_auth_id: $.data.id }
            - call: "POST /personnel"
              payload: { full_name: "QM Ind", email: "qmind@x.com", role: "QUALITY_MANAGER" }
              as: QualityManager
              captures: { qm_ind_id: $.data.id }
            - call: "POST /personnel"
              payload: { full_name: "QE Vfa", email: "qevfa@x.com", role: "QUALITY_ENGINEER" }
              as: QualityManager
              captures: { qe_id: $.data.id }
            - call: "POST /suppliers"
              payload: { name: "Vfa Co", code: "VFA-SUP" }
              as: QualityManager
              captures: { sup_id: $.data.id }
            - call: "POST /nonconformance-reports"
              payload: { title: "vfa ncr", source: "SUPPLIER", severity: "MAJOR", defect_qty: 5, unit_cost_cents: 1000, part_number: "P-VFA", supplier_id: "${sup_id}", rework_hours: 2.0 }
              as: QualityEngineer
              as_user_id: "${qe_id}"
              captures: { ncr_id: $.data.id }
            - call: "POST /nonconformance-reports/${ncr_id}/open"
              payload: {}
              as: QualityEngineer
              as_user_id: "${qe_id}"
            - call: "POST /nonconformance-reports/${ncr_id}/disposition"
              payload: { disposition: "REWORK" }
              as: QualityManager
              as_user_id: "${qm_ind_id}"
            - call: "POST /capas"
              payload: { ncr_id: "${ncr_id}", title: "vfa 8d" }
              as: QualityEngineer
              as_user_id: "${qm_auth_id}"
              captures: { capa_id: $.data.id }
            - call: "POST /capas/${capa_id}/steps"
              payload: { discipline: "D1", narrative: "team" }
              as: QualityEngineer
              as_user_id: "${qm_auth_id}"
            - call: "POST /capas/${capa_id}/steps"
              payload: { discipline: "D4", narrative: "root cause", containment_count: 3 }
              as: QualityEngineer
              as_user_id: "${qm_auth_id}"
            - call: "POST /capas/${capa_id}/transition"
              payload: { action: "ADVANCE" }
              as: QualityEngineer
              as_user_id: "${qm_auth_id}"
            - call: "POST /capas/${capa_id}/transition"
              payload: { action: "ADVANCE" }
              as: QualityEngineer
              as_user_id: "${qm_auth_id}"
          trigger:
            - call: "POST /capas/${capa_id}/transition"
              payload: { action: "VERIFY" }
              as: QualityManager
              as_user_id: "${qm_auth_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Capa.${capa_id}.provisional_effectiveness == 0.60"
            - "response_type == error"
            - "http_status == 403"
            - "data.error_id == ERR_SEGREGATION_OF_DUTIES"
            - "Capa.${capa_id}.status == VERIFICATION"

  # ===========================================================================
  # Section 8 — From Cross-Cutting Complexity Layers
  # layers: optimistic_concurrency, cascading_side_effects,
  #         derived_field_reconciliation, rate_threshold_triggers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      # ---- optimistic_concurrency: stale ControlPlan version on revision create ----
      - name: occ_stale_control_plan_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[revision-create-stale-control-plan]
          - entities.ControlPlan.fields.version
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Two strictly sequential POST /control-plan-revisions: the first (revision_no=1, expected_control_plan_version captured from the plan) succeeds and bumps ControlPlan.version; the second carrying the SAME stale expected_control_plan_version is rejected with ERR_STALE_VERSION (412)."
        test_recipe:
          setup:
            - "A QualityEngineer and a fresh ControlPlan exist; the plan's version is read before any revision."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "QE Occ", email: "qeocc@x.com", role: "QUALITY_ENGINEER" }
              as: QualityManager
              captures: { qe_id: $.data.id }
            - call: "POST /control-plans"
              payload: { name: "CP Occ", part_number: "P-OCC" }
              as: QualityManager
              captures: { cp_id: $.data.id }
            - call: "GET /control-plans/${cp_id}"
              payload: {}
              as: QualityManager
              captures: { cp_v0: $.data.version }
            - call: "POST /control-plan-revisions"
              payload: { control_plan_id: "${cp_id}", revision_no: 1, change_summary: "first", expected_control_plan_version: "${cp_v0}" }
              as: QualityEngineer
              as_user_id: "${qe_id}"
              captures: { rev1_id: $.data.id }
          trigger:
            - call: "POST /control-plan-revisions"
              payload: { control_plan_id: "${cp_id}", revision_no: 1, change_summary: "stale second", expected_control_plan_version: "${cp_v0}" }
              as: QualityEngineer
              as_user_id: "${qe_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "http_status == 412"
            - "data.error_id == ERR_STALE_VERSION"

      # ---- optimistic_concurrency: correct (fresh) version succeeds + version increments ----
      - name: occ_fresh_control_plan_version_succeeds_increments
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[revision-create-stale-control-plan]
          - entities.ControlPlan.fields.version
          - state_machines.ControlPlanRevision.DRAFT_to_APPROVED
        distinguishing_aspect: "POST /control-plan-revisions with the freshly re-read expected_control_plan_version succeeds (DRAFT created) and the side-effect increments ControlPlan.version by 1 each create — version observed strictly increases across two sequential creates with re-read versions."
        test_recipe:
          setup:
            - "A QualityEngineer and a fresh ControlPlan exist; revision #1 was created+approved (current_revision_no=1) and the plan version re-read."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "QE Of", email: "qeof@x.com", role: "QUALITY_ENGINEER" }
              as: QualityManager
              captures: { qe_id: $.data.id }
            - call: "POST /control-plans"
              payload: { name: "CP Of", part_number: "P-OF" }
              as: QualityManager
              captures: { cp_id: $.data.id }
            - call: "GET /control-plans/${cp_id}"
              payload: {}
              as: QualityManager
              captures: { cp_v0: $.data.version }
            - call: "POST /control-plan-revisions"
              payload: { control_plan_id: "${cp_id}", revision_no: 1, change_summary: "rev1", expected_control_plan_version: "${cp_v0}" }
              as: QualityEngineer
              as_user_id: "${qe_id}"
              captures: { rev1_id: $.data.id }
            - call: "POST /control-plan-revisions/${rev1_id}/approve"
              payload: {}
              as: QualityManager
            - call: "GET /control-plans/${cp_id}"
              payload: {}
              as: QualityManager
              captures: { cp_v1: $.data.version }
          trigger:
            - call: "POST /control-plan-revisions"
              payload: { control_plan_id: "${cp_id}", revision_no: 2, change_summary: "rev2", expected_control_plan_version: "${cp_v1}" }
              as: QualityEngineer
              as_user_id: "${qe_id}"
              captures: { rev2_id: $.data.id }
            - call: "GET /control-plans/${cp_id}"
              payload: {}
              as: QualityManager
              captures: { cp_v2: $.data.version }
          assert:
            - "http_status == 201"
            - "ControlPlanRevision.${rev2_id}.status == DRAFT"
            - "ControlPlan.${cp_id}.version > ${cp_v1}"

      # ---- derived_field_reconciliation: needs_review flips on control-plan revision ----
      - name: derived_needs_review_set_on_control_plan_revision_approve
        claim_type: derived_field_reconciliation
        grounds:
          - entities.InspectionPlan.fields.needs_review
          - state_machines.ControlPlanRevision.DRAFT_to_APPROVED
        distinguishing_aspect: "Derived field reconciliation: an InspectionPlan's needs_review is false at creation and is reconciled to true when the linked ControlPlan is revised (revision approved after the plan's last review)."
        test_recipe:
          setup:
            - "A QualityEngineer exists; a ControlPlan with an approved revision #1 and a linked InspectionPlan (needs_review=false) exist; a DRAFT revision #2 has been created."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "QE Nr", email: "qenr@x.com", role: "QUALITY_ENGINEER" }
              as: QualityManager
              captures: { qe_id: $.data.id }
            - call: "POST /control-plans"
              payload: { name: "CP Nr", part_number: "P-NR" }
              as: QualityManager
              captures: { cp_id: $.data.id }
            - call: "GET /control-plans/${cp_id}"
              payload: {}
              as: QualityManager
              captures: { cp_v0: $.data.version }
            - call: "POST /control-plan-revisions"
              payload: { control_plan_id: "${cp_id}", revision_no: 1, change_summary: "rev1", expected_control_plan_version: "${cp_v0}" }
              as: QualityEngineer
              as_user_id: "${qe_id}"
              captures: { rev1_id: $.data.id }
            - call: "POST /control-plan-revisions/${rev1_id}/approve"
              payload: {}
              as: QualityManager
            - call: "POST /inspection-plans"
              payload: { name: "IP Nr", control_plan_id: "${cp_id}", part_number: "P-NR", lot_size: 120, aql_pct: 4.0, inspection_level: "GII" }
              as: QualityManager
              captures: { ip_id: $.data.id }
            - call: "GET /inspection-plans/${ip_id}"
              payload: {}
              as: QualityManager
              captures: { nr_before: $.data.needs_review }
            - call: "GET /control-plans/${cp_id}"
              payload: {}
              as: QualityManager
              captures: { cp_v1: $.data.version }
            - call: "POST /control-plan-revisions"
              payload: { control_plan_id: "${cp_id}", revision_no: 2, change_summary: "rev2", expected_control_plan_version: "${cp_v1}" }
              as: QualityEngineer
              as_user_id: "${qe_id}"
              captures: { rev2_id: $.data.id }
          trigger:
            - call: "POST /control-plan-revisions/${rev2_id}/approve"
              payload: {}
              as: QualityManager
            - call: "GET /inspection-plans/${ip_id}"
              payload: {}
              as: QualityManager
              captures: { nr_after: $.data.needs_review }
          assert:
            - "InspectionPlan.${ip_id}.needs_review == true"

      # ---- rate_threshold_triggers: consecutive_rejects boundary at 2 ----
      - name: rate_threshold_one_reject_stays_normal
        claim_type: rate_threshold_triggers
        grounds:
          - entities.InspectionPlan.fields.consecutive_rejects
          - entities.InspectionPlan.fields.severity_mode
          - state_machines.InspectionLot.IN_INSPECTION_to_REJECTED
        distinguishing_aspect: "Below the threshold: a single REJECTED lot sets consecutive_rejects=1 but severity_mode stays NORMAL (the NORMAL->TIGHTENED switch fires only at 2, not at 1) — boundary one short of the trigger."
        test_recipe:
          setup:
            - "An Inspector, a Supplier, a ControlPlan and an InspectionPlan(NORMAL, consecutive_rejects=0) exist; one IN_INSPECTION lot."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "Insp Rt", email: "insprt@x.com", role: "INSPECTOR" }
              as: QualityManager
              captures: { insp_id: $.data.id }
            - call: "POST /suppliers"
              payload: { name: "Rt Co", code: "RT-SUP" }
              as: QualityManager
              captures: { sup_id: $.data.id }
            - call: "POST /control-plans"
              payload: { name: "CP Rt", part_number: "P-RT" }
              as: QualityManager
              captures: { cp_id: $.data.id }
            - call: "POST /inspection-plans"
              payload: { name: "IP Rt", control_plan_id: "${cp_id}", part_number: "P-RT", lot_size: 120, aql_pct: 4.0, inspection_level: "GII" }
              as: QualityManager
              captures: { ip_id: $.data.id }
            - call: "POST /inspection-lots"
              payload: { inspection_plan_id: "${ip_id}", supplier_id: "${sup_id}", actual_lot_size: 120 }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { lot_id: $.data.id }
            - call: "POST /inspection-lots/${lot_id}/transition"
              payload: { action: "START" }
              as: Inspector
              as_user_id: "${insp_id}"
          trigger:
            - call: "POST /inspection-lots/${lot_id}/transition"
              payload: { action: "DISPOSITION", defects_found: 3 }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "GET /inspection-plans/${ip_id}"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { cr: $.data.consecutive_rejects, sm: $.data.severity_mode }
          assert:
            - "InspectionLot.${lot_id}.status == REJECTED"
            - "InspectionPlan.${ip_id}.consecutive_rejects == 1"
            - "InspectionPlan.${ip_id}.severity_mode == NORMAL"

      # ---- rate_threshold reset: an ACCEPTED lot resets consecutive_rejects to 0 ----
      - name: rate_threshold_accept_resets_consecutive_rejects
        claim_type: rate_threshold_triggers
        grounds:
          - entities.InspectionPlan.fields.consecutive_rejects
          - state_machines.InspectionLot.IN_INSPECTION_to_ACCEPTED
          - state_machines.InspectionLot.IN_INSPECTION_to_REJECTED
        distinguishing_aspect: "Reset mechanism: after one REJECTED lot (consecutive_rejects=1), an ACCEPTED lot resets InspectionPlan.consecutive_rejects to 0 (the reset side-effect of IN_INSPECTION->ACCEPTED)."
        test_recipe:
          setup:
            - "An Inspector, a Supplier, a ControlPlan and an InspectionPlan exist; one lot already REJECTED (consecutive_rejects=1); a second IN_INSPECTION lot exists."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "Insp Rr", email: "insprr@x.com", role: "INSPECTOR" }
              as: QualityManager
              captures: { insp_id: $.data.id }
            - call: "POST /suppliers"
              payload: { name: "Rr Co", code: "RR-SUP" }
              as: QualityManager
              captures: { sup_id: $.data.id }
            - call: "POST /control-plans"
              payload: { name: "CP Rr", part_number: "P-RR" }
              as: QualityManager
              captures: { cp_id: $.data.id }
            - call: "POST /inspection-plans"
              payload: { name: "IP Rr", control_plan_id: "${cp_id}", part_number: "P-RR", lot_size: 120, aql_pct: 4.0, inspection_level: "GII" }
              as: QualityManager
              captures: { ip_id: $.data.id }
            - call: "POST /inspection-lots"
              payload: { inspection_plan_id: "${ip_id}", supplier_id: "${sup_id}", actual_lot_size: 120 }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { lot1_id: $.data.id }
            - call: "POST /inspection-lots/${lot1_id}/transition"
              payload: { action: "START" }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspection-lots/${lot1_id}/transition"
              payload: { action: "DISPOSITION", defects_found: 3 }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspection-lots"
              payload: { inspection_plan_id: "${ip_id}", supplier_id: "${sup_id}", actual_lot_size: 120 }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { lot2_id: $.data.id }
            - call: "POST /inspection-lots/${lot2_id}/transition"
              payload: { action: "START" }
              as: Inspector
              as_user_id: "${insp_id}"
          trigger:
            - call: "POST /inspection-lots/${lot2_id}/transition"
              payload: { action: "DISPOSITION", defects_found: 0 }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "GET /inspection-plans/${ip_id}"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { cr: $.data.consecutive_rejects }
          assert:
            - "InspectionLot.${lot2_id}.status == ACCEPTED"
            - "InspectionPlan.${ip_id}.consecutive_rejects == 0"

      # ---- STUBS: cross-cutting corners already exercised by §1.8 ----
      - name: cascading_side_effects_depth3_capa_close
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Capa.EFFECTIVENESS_CHECK_to_CLOSED_EFFECTIVE
        excluded_because:
          difficulty_instance: transitive_cascade / capa_close_cascades_ncr_scar_supplier_depth3
          rationale: "The end-to-end depth-3 cascade (CAPA close -> NCR -> Scar -> Supplier rating) is the subject of the named §1.8 instance."

      - name: rate_threshold_tightened_switch_at_two
        claim_type: rate_threshold_triggers
        grounds:
          - entities.InspectionPlan.fields.consecutive_rejects
          - entities.InspectionPlan.fields.severity_mode
        excluded_because:
          difficulty_instance: transitive_cascade / lot_reject_cascades_consecutive_then_tightened_depth2
          rationale: "The consecutive_rejects==2 NORMAL->TIGHTENED threshold crossing is the subject of the named §1.8 depth-2 cascade instance."

  # ===========================================================================
  # Section 9 — From Consistency Model (consistency_model: immediate)
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_disposition_response_reflects_computed_cost
        claim_type: immediate
        grounds:
          - state_machines.NonconformanceReport.OPEN_to_DISPOSITIONED
          - entities.NonconformanceReport.fields.cost_of_quality_cents
          - calculations.ncr_cost_of_quality
        distinguishing_aspect: "consistency_model is immediate: the disposition response body itself already carries the computed cost_of_quality_cents (SCRAP MAJOR defect_qty=2 unit_cost_cents=500 -> 2*round_half_up(500*1.0)=1000) — no re-read needed; the same value is visible in the immediate response and a follow-up GET."
        test_recipe:
          setup:
            - "A QualityEngineer and an independent QualityManager and a Supplier exist; a SUPPLIER NCR (severity=MAJOR, defect_qty=2, unit_cost_cents=500) is OPEN."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "QE Im2", email: "qeim2@x.com", role: "QUALITY_ENGINEER" }
              as: QualityManager
              captures: { qe_id: $.data.id }
            - call: "POST /personnel"
              payload: { full_name: "QM Im2", email: "qmim2@x.com", role: "QUALITY_MANAGER" }
              as: QualityManager
              captures: { qm_id: $.data.id }
            - call: "POST /suppliers"
              payload: { name: "Im2 Co", code: "IM2-SUP" }
              as: QualityManager
              captures: { sup_id: $.data.id }
            - call: "POST /nonconformance-reports"
              payload: { title: "im2 ncr", source: "SUPPLIER", severity: "MAJOR", defect_qty: 2, unit_cost_cents: 500, part_number: "P-IM2", supplier_id: "${sup_id}" }
              as: QualityEngineer
              as_user_id: "${qe_id}"
              captures: { ncr_id: $.data.id }
            - call: "POST /nonconformance-reports/${ncr_id}/open"
              payload: {}
              as: QualityEngineer
              as_user_id: "${qe_id}"
          trigger:
            - call: "POST /nonconformance-reports/${ncr_id}/disposition"
              payload: { disposition: "SCRAP" }
              as: QualityManager
              as_user_id: "${qm_id}"
              captures: { coq_immediate: $.data.cost_of_quality_cents }
            - call: "GET /nonconformance-reports/${ncr_id}"
              payload: {}
              as: QualityManager
              as_user_id: "${qm_id}"
              captures: { coq_reread: $.data.cost_of_quality_cents }
          assert:
            - "NonconformanceReport.${ncr_id}.cost_of_quality_cents == 1000"
            - "${coq_immediate} == 1000"
            - "${coq_reread} == 1000"
