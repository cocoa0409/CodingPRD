# =============================================================================
# PRD Benchmark Scaffold — Digital Accessibility Conformance Reporting
# Task 2459 · §1.0–§1.7 (difficulty design → SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# corner design → SCAFFOLD_CORNER_DESIGN.yaml)
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2459. Digital Accessibility Conformance Reporting (software product accessibility program):
  standard selection across web content and software guidelines with conformance level targets,
  product component inventory with assessment scope and testing coverage across screen readers,
  keyboard navigation and magnification, automated and manual testing with assistive technology
  validation by disability category, conformance report authoring with per-criterion support level
  and explanatory remarks, known issue documentation with remediation roadmap and target dates
  published to customers, accessibility requirements in the development lifecycle including design
  review and acceptance criteria, customer procurement questionnaire response with accuracy
  obligations and update cadence, complaint intake, accommodation requests and remediation
  prioritization

domain_name: digital-accessibility-conformance
api_prefix: ""            # flat/graph topology — every collection is a root-level path

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - optimistic_concurrency

  entity_topology: graph
  # CriterionAssessment is a junction between ProductComponent and SuccessCriterion;
  # KnownIssue joins Product × ProductComponent × SuccessCriterion × ReleaseTrain;
  # ConformanceReport and CriterionAssessment carry self-referential supersede edges.

  state_machine_shape: parallel
  # ProductComponent carries two independent dimensions (assessment_state ×
  # design_review_state); QuestionnaireResponse carries review_status × accuracy_status;
  # ConformanceReport is cyclic (IN_REVIEW → CHANGES_REQUESTED → DRAFT);
  # Complaint is fork-join (TRIAGED → {LINKED, ACCOMMODATED} → CLOSED);
  # Product.publication_posture is a compound derived gate over children.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  consistency_model: immediate

  difficulty_level: expert_plus     # 12 entities, 57 endpoints, 6 calculations, 10 state machines

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Standard
    parent: null
    common_fields: true
    fields:
      - name: code
        type: enum
        source: input
        description: Accessibility standard identifier
        constraints: "one of {WCAG_2_1, WCAG_2_2, EN_301_549, SECTION_508_SW}; globally unique"
      - name: title
        type: string
        source: input
        description: Human-readable standard title
        constraints: "1..200 chars"
      - name: surface_scope
        type: enum
        source: input
        description: Which product surfaces this standard governs
        constraints: "one of {WEB, SOFTWARE, BOTH}"
      - name: max_target_level
        type: enum
        source: input
        description: Highest conformance level the standard defines
        constraints: "one of {A, AA, AAA}"
      - name: criteria_count
        type: integer
        source: computed
        description: "Count of SuccessCriterion rows whose standard_id equals this Standard.id"
        default: 0

  - name: SuccessCriterion
    parent: Standard
    common_fields: false
    fields:
      - name: standard_id
        type: string
        source: input
        description: "FK -> Standard.id; owning standard, immutable"
      - name: criterion_number
        type: string
        source: input
        description: Dotted criterion number such as "1.4.3"
        constraints: "unique within a standard; matches ^[0-9]+(\\.[0-9]+){1,2}$"
      - name: title
        type: string
        source: input
        description: Criterion title
        constraints: "1..200 chars"
      - name: level
        type: enum
        source: input
        description: Conformance level at which this criterion applies
        constraints: "one of {A, AA, AAA}; must not exceed Standard.max_target_level"
      - name: disability_categories
        type: array
        source: input
        description: Disability categories this criterion protects
        constraints: "non-empty subset of {VISION, HEARING, MOTOR, COGNITIVE}; no duplicates"
      - name: applies_to_surfaces
        type: array
        source: input
        description: Surfaces the criterion applies to
        constraints: "non-empty subset of {WEB, SOFTWARE}"

  - name: Product
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Software product name
        constraints: "1..160 chars"
      - name: version_label
        type: string
        source: input
        description: Released version this accessibility program tracks
        constraints: "1..40 chars"
      - name: standard_id
        type: string
        source: input
        description: "FK -> Standard.id; selected standard for this product's program"
      - name: target_level
        type: enum
        source: input
        description: Conformance level target
        constraints: "one of {A, AA, AAA}; must be <= Standard.max_target_level of standard_id"
      - name: surface_type
        type: enum
        source: input
        description: Product surface classification
        constraints: "one of {WEB, SOFTWARE, BOTH}; must be compatible with Standard.surface_scope"
      - name: components_in_scope_count
        type: integer
        source: computed
        description: "Count of ProductComponent rows with product_id == this Product.id AND in_scope == true"
        default: 0
      - name: components_complete_count
        type: integer
        source: computed
        description: "Count of ProductComponent rows with product_id == this Product.id AND in_scope == true AND assessment_state == COMPLETE"
        default: 0
      - name: assessment_readiness
        type: enum
        source: computed
        description: "READY when components_in_scope_count >= 1 AND components_complete_count == components_in_scope_count; else NOT_READY"
        default: NOT_READY
        constraints: "one of {NOT_READY, READY}"
      - name: assessed_criteria_count
        type: integer
        source: computed
        description: "Count of in-scope SuccessCriterion rows (per §1.3 conformance_index input_set) that have at least one qualifying CriterionAssessment under the PROVISIONAL variant"
        default: 0
      - name: conformance_index_provisional
        type: number
        source: computed
        description: "PROVISIONAL variant output of §1.3 product_conformance_index; 2 decimals"
        default: 0.00
      - name: stale_questionnaire_count
        type: integer
        source: computed
        description: "Count of QuestionnaireResponse rows with product_id == this Product.id AND accuracy_status == STALE"
        default: 0
      - name: correction_required_questionnaire_count
        type: integer
        source: computed
        description: "Count of QuestionnaireResponse rows with product_id == this Product.id AND accuracy_status == CORRECTION_REQUIRED"
        default: 0
      - name: overdue_committed_blocker_count
        type: integer
        source: computed
        description: "Count of KnownIssue rows with product_id == this Product.id AND severity == BLOCKER AND state == PUBLISHED_COMMITTED AND public_target_date < logical clock date"
        default: 0
      - name: publication_posture
        type: enum
        source: computed
        description: "Output of §1.3 product_publication_posture; gates report publication, questionnaire attestation and budget allocation"
        default: OPEN
        constraints: "one of {OPEN, RESTRICTED, FROZEN}"
      - name: accommodations_fulfilled_count
        type: integer
        source: computed
        description: "Count of Complaint rows with product_id == this Product.id AND accommodation_fulfilled_at IS NOT NULL"
        default: 0

  - name: ProductComponent
    parent: Product
    common_fields: true
    fields:
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; owning product, immutable"
      - name: name
        type: string
        source: input
        description: Component name as it appears in the report's component inventory
        constraints: "1..160 chars; unique within a product"
      - name: component_type
        type: enum
        source: input
        description: Component surface class
        constraints: "one of {WEB_UI, DESKTOP_APP, MOBILE_APP, AUTHORING_TOOL, DOCUMENTATION}"
      - name: in_scope
        type: boolean
        source: input
        description: Whether the component is inside the assessment scope of the conformance report
      - name: assessment_scope
        type: enum
        source: input
        description: Declared depth of assessment for this component
        constraints: "one of {FULL, SAMPLED, EXCLUDED}"
      - name: applicable_criteria_count
        type: integer
        source: input
        description: Tester-declared number of criteria in this component's assessment scope; coverage denominator
        constraints: "1..500"
      - name: user_reach_pct
        type: integer
        source: input
        description: Share of the product's users who touch this component; risk-weighting input
        constraints: "0..100"
      - name: evidence_units_total
        type: integer
        source: computed
        description: "Sum of AssessmentRun.criteria_exercised over runs with component_id == this ProductComponent.id AND status == COMPLETED"
        default: 0
      - name: coverage_pct
        type: number
        source: computed
        description: "Output of §1.3 component_testing_coverage_pct; 2 decimals"
        default: 0.00
      - name: validated_disability_categories
        type: array
        source: computed
        description: "Union of AssessmentRun.disability_categories_validated over runs with component_id == this ProductComponent.id AND status == COMPLETED AND method == MANUAL; AUTOMATED runs contribute nothing"
        default: []
      - name: assessment_state
        type: enum
        source: computed
        description: Assessment dimension of the component state machine
        default: PLANNED
        constraints: "one of {PLANNED, IN_TESTING, COMPLETE}"
      - name: design_review_state
        type: enum
        source: computed
        description: Development-lifecycle dimension of the component state machine (design review + acceptance criteria)
        default: NOT_REVIEWED
        constraints: "one of {NOT_REVIEWED, REVIEWED_PASS, REVIEWED_BLOCKED}"
      - name: design_review_note
        type: string
        source: input
        description: Latest design-review remark
        default: null

  - name: TestEnvironment
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Assistive-technology bench name
        constraints: "1..120 chars; globally unique"
      - name: at_profile
        type: enum
        source: input
        description: Assistive-technology profile this bench provides
        constraints: "one of {SCREEN_READER, KEYBOARD, MAGNIFICATION}"
      - name: at_product_name
        type: string
        source: input
        description: Concrete AT product and version, e.g. "NVDA 2026.1"
        constraints: "1..120 chars"
      - name: os_platform
        type: enum
        source: input
        description: Host platform of the bench
        constraints: "one of {WINDOWS, MACOS, LINUX, ANDROID, IOS}"
      - name: reconfiguration_buffer_minutes
        type: integer
        source: input
        description: Minutes of teardown/reconfiguration appended to every occupied run window on this bench
        default: 30
        constraints: "0..240"
      - name: scheduled_run_count
        type: integer
        source: computed
        description: "Count of AssessmentRun rows with environment_id == this TestEnvironment.id AND status IN {SCHEDULED, COMPLETED}"
        default: 0

  - name: AssessmentRun
    parent: ProductComponent
    common_fields: true
    fields:
      - name: component_id
        type: string
        source: input
        description: "FK -> ProductComponent.id; component under test, immutable"
      - name: environment_id
        type: string
        source: input
        description: "FK -> TestEnvironment.id; bench that the run occupies, immutable"
      - name: method
        type: enum
        source: input
        description: Testing method
        constraints: "one of {AUTOMATED, MANUAL}"
      - name: at_profile
        type: enum
        source: input
        description: AT profile exercised; must equal TestEnvironment.at_profile of environment_id
        constraints: "one of {SCREEN_READER, KEYBOARD, MAGNIFICATION}"
      - name: scheduled_start
        type: datetime
        source: input
        description: Start of the bench occupation window (inclusive)
      - name: scheduled_end
        type: datetime
        source: input
        description: End of the bench occupation window (exclusive)
        constraints: "must be strictly after scheduled_start"
      - name: criteria_exercised
        type: integer
        source: input
        description: Number of criteria exercised by this run; coverage numerator contribution
        constraints: "1..500; must be <= ProductComponent.applicable_criteria_count of component_id"
      - name: disability_categories_validated
        type: array
        source: input
        description: Disability categories validated with assistive technology during this run
        constraints: "non-empty subset of {VISION, HEARING, MOTOR, COGNITIVE}; no duplicates"
      - name: status
        type: enum
        source: computed
        description: Run lifecycle state
        default: SCHEDULED
        constraints: "one of {SCHEDULED, COMPLETED, VOID}"
      - name: defects_found
        type: integer
        source: input
        description: Defect count recorded at completion
        default: null
        constraints: "0..500 when present"
      - name: void_reason
        type: string
        source: input
        description: Reason recorded when the run is voided
        default: null
      - name: completed_at
        type: datetime
        source: system
        description: Logical-clock instant at which the run was completed
        default: null

  - name: CriterionAssessment
    parent: ProductComponent
    common_fields: true
    fields:
      - name: component_id
        type: string
        source: input
        description: "FK -> ProductComponent.id; assessed component, immutable"
      - name: criterion_id
        type: string
        source: input
        description: "FK -> SuccessCriterion.id; assessed criterion, immutable; must belong to the product's standard"
      - name: support_level
        type: enum
        source: input
        description: Per-criterion support level reported for this component
        constraints: "one of {SUPPORTS, PARTIALLY_SUPPORTS, DOES_NOT_SUPPORT, NOT_APPLICABLE}"
      - name: remarks
        type: string
        source: input
        description: Explanatory remarks; mandatory unless support_level == SUPPORTS
        default: null
        constraints: "when present 10..2000 chars"
      - name: evidence_run_id
        type: string
        source: input
        description: "FK -> AssessmentRun.id; run cited as evidence; optional"
        default: null
      - name: attestation_state
        type: enum
        source: computed
        description: Attestation lifecycle of this assessment
        default: DRAFT
        constraints: "one of {DRAFT, ATTESTED, NEEDS_REVALIDATION, SUPERSEDED}"
      - name: authored_by_user_id
        type: string
        source: system
        description: X-User-ID of the AccessibilityTester who created this assessment
      - name: attested_by_user_id
        type: string
        source: system
        description: X-User-ID of the ConformanceReviewer who attested this assessment
        default: null
      - name: attested_at
        type: datetime
        source: system
        description: Logical-clock instant of attestation
        default: null
      - name: attestation_note
        type: string
        source: input
        description: Reviewer note recorded at attestation
        default: null
      - name: superseded_by_assessment_id
        type: string
        source: computed
        description: "FK -> CriterionAssessment.id; newer assessment that superseded this row"
        default: null

  - name: ConformanceReport
    parent: Product
    common_fields: true
    fields:
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; reported product, immutable"
      - name: standard_id
        type: string
        source: input
        description: "FK -> Standard.id; standard the report is written against; must equal Product.standard_id"
      - name: report_title
        type: string
        source: input
        description: Conformance report title as published to customers
        constraints: "1..200 chars"
      - name: state
        type: enum
        source: computed
        description: Report authoring/publication lifecycle
        default: DRAFT
        constraints: "one of {DRAFT, IN_REVIEW, CHANGES_REQUESTED, APPROVED, PUBLISHED, SUPERSEDED, WITHDRAWN}"
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the ProductOwner who submitted the report for review
        default: null
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the ConformanceReviewer who approved the report
        default: null
      - name: change_request_count
        type: integer
        source: computed
        description: Number of times the report cycled through CHANGES_REQUESTED
        default: 0
      - name: pinned_assessment_ids
        type: array
        source: computed
        description: "CriterionAssessment.id values pinned at approval: every assessment with attestation_state == ATTESTED whose component_id belongs to an in-scope component of product_id, ordered by created_at ASC"
        default: []
      - name: pinned_assessment_versions
        type: array
        source: computed
        description: "CriterionAssessment.version values captured at approval, index-aligned with pinned_assessment_ids"
        default: []
      - name: criterion_support_snapshot
        type: array
        source: computed
        description: "Frozen at publication: one object per in-scope criterion { criterion_id, rolled_support_level, weight } from the CERTIFIED variant rollup of §1.3 product_conformance_index"
        default: []
      - name: conformance_index_certified
        type: number
        source: computed
        description: "CERTIFIED variant output of §1.3 product_conformance_index, frozen at publication; 2 decimals"
        default: null
      - name: published_issue_count
        type: integer
        source: computed
        description: "Count of KnownIssue rows transitioned to PUBLISHED_COMMITTED by this report's publication"
        default: 0
      - name: publication_channel
        type: enum
        source: input
        description: Where the report is published for customers
        default: null
        constraints: "one of {CUSTOMER_TRUST_PORTAL, PROCUREMENT_PACKET, PUBLIC_WEBSITE}"
      - name: published_at
        type: datetime
        source: system
        description: Logical-clock instant of publication
        default: null
      - name: withdrawal_reason
        type: string
        source: input
        description: Reason recorded at withdrawal
        default: null
      - name: superseded_by_report_id
        type: string
        source: computed
        description: "FK -> ConformanceReport.id; newer report that superseded this published report"
        default: null

  - name: ReleaseTrain
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Release train name published on the remediation roadmap
        constraints: "1..120 chars; globally unique"
      - name: window_start
        type: string
        source: input
        description: First calendar date of the train window (YYYY-MM-DD, inclusive)
      - name: window_end
        type: string
        source: input
        description: Last calendar date of the train window (YYYY-MM-DD, inclusive)
        constraints: "must be >= window_start"
      - name: freeze_days
        type: integer
        source: input
        description: Trailing code-freeze days at the end of the window during which no remediation target date may land
        default: 0
        constraints: "0..60; must be < the window length in days"
      - name: effort_capacity_points
        type: integer
        source: input
        description: Aggregate remediation effort the train can absorb
        constraints: "1..1000"
      - name: committed_effort_points
        type: integer
        source: computed
        description: "Sum of KnownIssue.effort_points over issues with release_train_id == this ReleaseTrain.id AND state IN {COMMITTED, PUBLISHED_COMMITTED}"
        default: 0
      - name: remediation_budget_cents
        type: integer
        source: input
        description: Remediation budget for this train, in cents
        constraints: "0..100000000"
      - name: unallocated_cents
        type: integer
        source: computed
        description: "remediation_budget_cents minus the sum of KnownIssue.funded_cents over issues with release_train_id == this ReleaseTrain.id"
        default: 0
      - name: allocation_state
        type: enum
        source: computed
        description: Whether the budget has been distributed
        default: UNALLOCATED
        constraints: "one of {UNALLOCATED, ALLOCATED}"

  - name: KnownIssue
    parent: Product
    common_fields: true
    fields:
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; affected product, immutable"
      - name: component_id
        type: string
        source: input
        description: "FK -> ProductComponent.id; affected component, immutable"
      - name: criterion_id
        type: string
        source: input
        description: "FK -> SuccessCriterion.id; violated criterion, immutable"
      - name: severity
        type: enum
        source: input
        description: Issue severity
        constraints: "one of {BLOCKER, SERIOUS, MODERATE, MINOR}"
      - name: summary
        type: string
        source: input
        description: Customer-facing issue summary
        constraints: "10..1000 chars"
      - name: effort_points
        type: integer
        source: input
        description: Remediation effort estimate in points
        constraints: "1..100"
      - name: target_remediation_date
        type: string
        source: input
        description: Internal remediation target date (YYYY-MM-DD)
      - name: publish_intent
        type: enum
        source: input
        description: Whether this issue is disclosed to customers with the report
        constraints: "one of {INCLUDED, EXCLUDED}"
      - name: state
        type: enum
        source: computed
        description: Remediation lifecycle state
        default: OPEN
        constraints: "one of {OPEN, TRIAGED, DEFERRED, COMMITTED, PUBLISHED_COMMITTED, RESOLVED}"
      - name: risk_score
        type: number
        source: computed
        description: "Output of §1.3 remediation_risk_score under the variant named by risk_variant; 2 decimals"
        default: 0.00
      - name: risk_variant
        type: enum
        source: computed
        description: Which variant produced the current risk_score
        default: INTAKE_ESTIMATE
        constraints: "one of {INTAKE_ESTIMATE, BOARD_REVIEW}"
      - name: release_train_id
        type: string
        source: computed
        description: "FK -> ReleaseTrain.id; train the issue is committed to"
        default: null
      - name: public_target_date
        type: string
        source: computed
        description: Customer-published remediation target date, copied from target_remediation_date at publication
        default: null
      - name: funded_cents
        type: integer
        source: computed
        description: "Cents allocated to this issue by §1.3 remediation_budget_allocation"
        default: 0
      - name: funding_state
        type: enum
        source: computed
        description: Funding outcome of the last allocation
        default: UNFUNDED
        constraints: "one of {UNFUNDED, PARTIALLY_FUNDED, FULLY_FUNDED}"
      - name: linked_complaint_count
        type: integer
        source: computed
        description: "Count of Complaint rows with linked_issue_id == this KnownIssue.id"
        default: 0
      - name: published_report_id
        type: string
        source: computed
        description: "FK -> ConformanceReport.id; report whose publication committed this issue publicly"
        default: null
      - name: resolution_run_id
        type: string
        source: input
        description: "FK -> AssessmentRun.id; run that verified the fix"
        default: null
      - name: triage_note
        type: string
        source: input
        description: Triage remark
        default: null
      - name: board_review_note
        type: string
        source: input
        description: Prioritization board remark
        default: null
      - name: resolution_note
        type: string
        source: input
        description: Resolution remark
        default: null

  - name: QuestionnaireResponse
    parent: Product
    common_fields: true
    fields:
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; product the questionnaire answers cover, immutable"
      - name: report_id
        type: string
        source: input
        description: "FK -> ConformanceReport.id; report the answers cite, immutable"
      - name: customer_name
        type: string
        source: input
        description: Requesting customer or procurement body
        constraints: "1..160 chars"
      - name: questionnaire_kind
        type: enum
        source: input
        description: Procurement questionnaire flavour
        constraints: "one of {VPAT_ACR, SECTION_508_CHECKLIST, EN_301_549_ANNEX, CUSTOM_RFP}"
      - name: answers_summary
        type: string
        source: input
        description: Narrative answers submitted to the customer
        constraints: "10..4000 chars"
      - name: review_status
        type: enum
        source: computed
        description: Authoring dimension of the questionnaire state machine
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, ATTESTED}"
      - name: accuracy_status
        type: enum
        source: computed
        description: Accuracy-obligation dimension of the questionnaire state machine; evolves independently of review_status
        default: CURRENT
        constraints: "one of {CURRENT, STALE, CORRECTION_REQUIRED}"
      - name: disclosure_debt
        type: number
        source: computed
        description: "Output of §1.3 questionnaire_disclosure_debt; 2 decimals"
        default: 0.00
      - name: disclosure_tier
        type: enum
        source: computed
        description: "Tier selected from base_debt only, per the pinned evaluation order of §1.3 questionnaire_disclosure_debt"
        default: STANDARD
        constraints: "one of {STANDARD, ELEVATED, CRITICAL}"
      - name: submitted_at
        type: datetime
        source: system
        description: Logical-clock instant of submission
        default: null
      - name: last_attested_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent accuracy attestation
        default: null
      - name: update_due_at
        type: datetime
        source: computed
        description: "Deadline for the next accuracy refresh: last_attested_at + UPDATE_CADENCE_DAYS (90) on attestation, or clock + STALE_WINDOW_DAYS (30) when accuracy_status becomes STALE"
        default: null
      - name: correction_due_at
        type: datetime
        source: computed
        description: "Deadline to correct the answers, set to clock + 10 days when accuracy_status becomes CORRECTION_REQUIRED"
        default: null
      - name: revision_count
        type: integer
        source: computed
        description: Number of times the response has been revised
        default: 0

  - name: Complaint
    parent: Product
    common_fields: true
    fields:
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; product complained about, immutable"
      - name: component_id
        type: string
        source: input
        description: "FK -> ProductComponent.id; component complained about; optional"
        default: null
      - name: criterion_id
        type: string
        source: input
        description: "FK -> SuccessCriterion.id; criterion the complaint maps to; optional"
        default: null
      - name: channel
        type: enum
        source: input
        description: Intake channel
        constraints: "one of {EMAIL, PHONE, WEB_FORM, REGULATOR_REFERRAL}"
      - name: description
        type: string
        source: input
        description: Complaint narrative
        constraints: "10..2000 chars"
      - name: disability_category
        type: enum
        source: input
        description: Disability category reported by the complainant
        constraints: "one of {VISION, HEARING, MOTOR, COGNITIVE}"
      - name: state
        type: enum
        source: computed
        description: Complaint lifecycle state (fork-join over the two triage routes)
        default: NEW
        constraints: "one of {NEW, TRIAGED, LINKED, ACCOMMODATED, CLOSED}"
      - name: route
        type: enum
        source: computed
        description: Route chosen at triage
        default: null
        constraints: "one of {REMEDIATION, ACCOMMODATION}"
      - name: requested_accommodation
        type: string
        source: input
        description: Requested accommodation, required when route == ACCOMMODATION
        default: null
        constraints: "when present 10..1000 chars"
      - name: needed_by_date
        type: string
        source: input
        description: Date the accommodation is needed by (YYYY-MM-DD), required when route == ACCOMMODATION
        default: null
      - name: linked_issue_id
        type: string
        source: computed
        description: "FK -> KnownIssue.id; known issue the complaint was linked to on the REMEDIATION route"
        default: null
      - name: accommodation_fulfilled_at
        type: datetime
        source: system
        description: Logical-clock instant the accommodation was fulfilled
        default: null
      - name: closure_outcome
        type: enum
        source: input
        description: Outcome recorded at closure
        default: null
        constraints: "one of {REMEDIATION_SCHEDULED, ACCOMMODATION_PROVIDED, ACCOMMODATION_DENIED, NOT_A_DEFECT}"
      - name: closed_at
        type: datetime
        source: system
        description: Logical-clock instant of closure
        default: null

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---------------------------------------------------------------- component
  - entity: ProductComponent
    dimension: assessment_state
    initial_state: PLANNED
    terminal_states: []
    note: |
      Independent of design_review_state below: the two dimensions of a
      ProductComponent advance on separate triggers and never gate each other.
      This dimension is cyclic — COMPLETE returns to IN_TESTING whenever
      recomputed coverage_pct falls back under MIN_ATTEST_COVERAGE_PCT.
    transitions:
      - from: PLANNED
        to: IN_TESTING
        trigger: "POST /assessment-runs (first run created for this component)"
        actor: AccessibilityTester
        preconditions:
          - "ProductComponent.assessment_scope != EXCLUDED"
        side_effects:
          - "TestEnvironment.scheduled_run_count of the run's environment_id incremented by 1"
      - from: IN_TESTING
        to: COMPLETE
        trigger: "system, on POST /assessment-runs/{id}/complete when the recomputed coverage_pct >= MIN_ATTEST_COVERAGE_PCT (45.00)"
        actor: system
        preconditions:
          - "recomputed ProductComponent.coverage_pct >= 45.00"
        side_effects:
          - "Product.components_complete_count of product_id recomputed (cascade hop 3 of transitive_cascade/run_completion_readiness_chain)"
          - "Product.assessment_readiness recomputed to READY when components_complete_count == components_in_scope_count and components_in_scope_count >= 1"
          - "Product.publication_posture recomputed per §1.3 product_publication_posture"
      - from: COMPLETE
        to: IN_TESTING
        trigger: "system, on POST /assessment-runs/{id}/void when the recomputed coverage_pct < MIN_ATTEST_COVERAGE_PCT (45.00)"
        actor: system
        preconditions:
          - "recomputed ProductComponent.coverage_pct < 45.00"
        side_effects:
          - "every CriterionAssessment with component_id == this component AND attestation_state == ATTESTED transitions ATTESTED -> NEEDS_REVALIDATION (cascade hop 3 of transitive_cascade/run_void_revalidation_chain)"
          - "Product.components_complete_count and Product.assessment_readiness recomputed"
          - "Product.conformance_index_provisional and Product.publication_posture recomputed"

  - entity: ProductComponent
    dimension: design_review_state
    initial_state: NOT_REVIEWED
    terminal_states: []
    note: "Development-lifecycle dimension: design review verdict + acceptance criteria sign-off. Cyclic: a BLOCKED component can be re-reviewed to PASS and back."
    transitions:
      - from: NOT_REVIEWED
        to: REVIEWED_PASS
        trigger: "POST /components/{id}/design-review with review_decision = PASS"
        actor: ConformanceReviewer
        preconditions:
          - "Product.publication_posture of product_id != FROZEN"
        side_effects:
          - "ProductComponent.design_review_note set to review_note"
      - from: NOT_REVIEWED
        to: REVIEWED_BLOCKED
        trigger: "POST /components/{id}/design-review with review_decision = BLOCK"
        actor: ConformanceReviewer
        preconditions:
          - "Product.publication_posture of product_id != FROZEN"
        side_effects:
          - "ProductComponent.design_review_note set to review_note"
      - from: REVIEWED_BLOCKED
        to: REVIEWED_PASS
        trigger: "POST /components/{id}/design-review with review_decision = PASS"
        actor: ConformanceReviewer
        preconditions:
          - "Product.publication_posture of product_id != FROZEN"
        side_effects:
          - "ProductComponent.design_review_note replaced"
      - from: REVIEWED_PASS
        to: REVIEWED_BLOCKED
        trigger: "POST /components/{id}/design-review with review_decision = BLOCK"
        actor: ConformanceReviewer
        preconditions:
          - "Product.publication_posture of product_id != FROZEN"
        side_effects:
          - "ProductComponent.design_review_note replaced"

  # ------------------------------------------------------------ assessment run
  - entity: AssessmentRun
    initial_state: SCHEDULED
    terminal_states: [VOID]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /assessment-runs/{id}/complete"
        actor: AccessibilityTester
        preconditions:
          - "AssessmentRun.status == SCHEDULED"
        side_effects:
          - "AssessmentRun.completed_at set to the logical clock"
          - "ProductComponent.evidence_units_total of component_id increased by AssessmentRun.criteria_exercised (cascade hop 1 of transitive_cascade/run_completion_readiness_chain)"
          - "ProductComponent.coverage_pct recomputed per §1.3 component_testing_coverage_pct (hop 2, caused by the evidence_units_total change)"
          - "ProductComponent.validated_disability_categories recomputed (MANUAL runs only)"
          - "ProductComponent.assessment_state may transition IN_TESTING -> COMPLETE (hop 3)"
      - from: SCHEDULED
        to: VOID
        trigger: "POST /assessment-runs/{id}/void"
        actor: AccessibilityTester
        preconditions:
          - "AssessmentRun.status == SCHEDULED"
        side_effects:
          - "AssessmentRun.void_reason set"
          - "TestEnvironment.scheduled_run_count decremented by 1; the run's window no longer occupies the bench"
      - from: COMPLETED
        to: VOID
        trigger: "POST /assessment-runs/{id}/void"
        actor: AccessibilityTester
        preconditions:
          - "AssessmentRun.status == COMPLETED"
          - "no KnownIssue has resolution_run_id == this AssessmentRun.id"
        side_effects:
          - "ProductComponent.evidence_units_total of component_id decreased by exactly AssessmentRun.criteria_exercised (compensating_invariant/evidence_units_conservation; cascade hop 1 of transitive_cascade/run_void_revalidation_chain)"
          - "ProductComponent.coverage_pct and validated_disability_categories recomputed (hop 2, caused by the evidence_units_total change)"
          - "ProductComponent.assessment_state may transition COMPLETE -> IN_TESTING (hop 3), which itself flips ATTESTED CriterionAssessment rows to NEEDS_REVALIDATION (hop 4)"
          - "TestEnvironment.scheduled_run_count decremented by 1"

  # ------------------------------------------------------- criterion assessment
  - entity: CriterionAssessment
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ATTESTED
        trigger: "POST /criterion-assessments/{id}/attest"
        actor: ConformanceReviewer
        preconditions:
          - "CriterionAssessment.attestation_state == DRAFT"
          - "ProductComponent.assessment_state of component_id == COMPLETE (cross_entity_state_dependency/attest_requires_component_complete)"
          - "X-User-ID != CriterionAssessment.authored_by_user_id (segregation of duties)"
          - "logical clock - CriterionAssessment.created_at <= EVIDENCE_MAX_AGE_DAYS (90 days)"
        side_effects:
          - "attested_by_user_id, attested_at, attestation_note recorded"
          - "Product.conformance_index_provisional and Product.assessed_criteria_count recomputed per §1.3 product_conformance_index (PROVISIONAL)"
          - "Product.publication_posture recomputed"
      - from: ATTESTED
        to: NEEDS_REVALIDATION
        trigger: "system, when the owning ProductComponent leaves COMPLETE, or when the cited evidence_run_id is voided"
        actor: system
        preconditions:
          - "CriterionAssessment.attestation_state == ATTESTED"
        side_effects:
          - "attested_by_user_id and attested_at retained for audit; the row stops qualifying for both index variants"
          - "Product.conformance_index_provisional and Product.publication_posture recomputed"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "POST /criterion-assessments (new assessment created for the same component_id + criterion_id)"
        actor: AccessibilityTester
        preconditions:
          - "CriterionAssessment.attestation_state IN {DRAFT, ATTESTED, NEEDS_REVALIDATION}"
        side_effects:
          - "superseded_by_assessment_id set to the new assessment's id"
      - from: ATTESTED
        to: SUPERSEDED
        trigger: "POST /criterion-assessments (new assessment created for the same component_id + criterion_id)"
        actor: AccessibilityTester
        preconditions:
          - "CriterionAssessment.attestation_state IN {DRAFT, ATTESTED, NEEDS_REVALIDATION}"
        side_effects:
          - "superseded_by_assessment_id set to the new assessment's id"
          - "Product.conformance_index_provisional and Product.publication_posture recomputed"
      - from: NEEDS_REVALIDATION
        to: SUPERSEDED
        trigger: "POST /criterion-assessments (new assessment created for the same component_id + criterion_id)"
        actor: AccessibilityTester
        preconditions:
          - "CriterionAssessment.attestation_state IN {DRAFT, ATTESTED, NEEDS_REVALIDATION}"
        side_effects:
          - "superseded_by_assessment_id set to the new assessment's id"

  # ----------------------------------------------------------- conformance report
  - entity: ConformanceReport
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, WITHDRAWN]
    note: "Cyclic: IN_REVIEW -> CHANGES_REQUESTED -> DRAFT -> IN_REVIEW can repeat without bound; change_request_count records the loop count."
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /conformance-reports/{id}/submit"
        actor: ProductOwner
        preconditions:
          - "ConformanceReport.state IN {DRAFT, CHANGES_REQUESTED}"
          - "X-User-ID == ConformanceReport.product_id (ProductOwner acts only on own product)"
        side_effects:
          - "submitted_by_user_id set to X-User-ID"
      - from: CHANGES_REQUESTED
        to: IN_REVIEW
        trigger: "POST /conformance-reports/{id}/submit"
        actor: ProductOwner
        preconditions:
          - "ConformanceReport.state IN {DRAFT, CHANGES_REQUESTED}"
          - "X-User-ID == ConformanceReport.product_id"
        side_effects:
          - "submitted_by_user_id overwritten with X-User-ID"
      - from: IN_REVIEW
        to: CHANGES_REQUESTED
        trigger: "POST /conformance-reports/{id}/request-changes"
        actor: ConformanceReviewer
        preconditions:
          - "ConformanceReport.state == IN_REVIEW"
        side_effects:
          - "change_request_count incremented by 1"
          - "pinned_assessment_ids and pinned_assessment_versions cleared to []"
      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /conformance-reports/{id}/approve"
        actor: ConformanceReviewer
        preconditions:
          - "ConformanceReport.state == IN_REVIEW"
          - "X-User-ID != ConformanceReport.submitted_by_user_id (segregation of duties)"
        side_effects:
          - "approved_by_user_id set to X-User-ID"
          - "pinned_assessment_ids / pinned_assessment_versions frozen from the currently ATTESTED assessments of in-scope components, ordered by CriterionAssessment.created_at ASC"
      - from: APPROVED
        to: PUBLISHED
        trigger: "POST /conformance-reports/{id}/publish"
        actor: AccessibilityLead
        preconditions:
          - "ConformanceReport.state == APPROVED"
          - "Product.publication_posture of product_id IN {OPEN, RESTRICTED}"
          - "Product.components_in_scope_count >= 1"
          - "every in-scope ProductComponent has design_review_state == REVIEWED_PASS"
          - "every in-scope ProductComponent.validated_disability_categories is a superset of the union of SuccessCriterion.disability_categories over in-scope criteria"
          - "for every index i, CriterionAssessment[pinned_assessment_ids[i]].version == pinned_assessment_versions[i] AND its attestation_state == ATTESTED"
        side_effects:
          - "published_at set to the logical clock; conformance_index_certified frozen per §1.3 product_conformance_index (CERTIFIED); criterion_support_snapshot frozen"
          - "every prior ConformanceReport of the same product_id + standard_id with state == PUBLISHED transitions PUBLISHED -> SUPERSEDED and gets superseded_by_report_id set to this report"
          - "cascade hop 1: every KnownIssue with product_id == this report's product_id, publish_intent == INCLUDED and state == COMMITTED transitions COMMITTED -> PUBLISHED_COMMITTED, gets public_target_date = target_remediation_date and published_report_id = this report; published_issue_count set to that count"
          - "cascade hop 2: Product.overdue_committed_blocker_count recomputed from the newly PUBLISHED_COMMITTED rows, then Product.publication_posture recomputed per §1.3 (hop 3)"
          - "cascade hop 4: a posture transition into FROZEN flips every QuestionnaireResponse of the product with accuracy_status IN {CURRENT, STALE} to CORRECTION_REQUIRED with correction_due_at = clock + 10 days; a transition into RESTRICTED flips CURRENT rows to STALE with update_due_at = clock + 30 days"
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system, on publication of a newer report for the same product_id + standard_id"
        actor: system
        preconditions:
          - "ConformanceReport.state == PUBLISHED"
        side_effects:
          - "superseded_by_report_id set to the newer report's id"
      - from: PUBLISHED
        to: WITHDRAWN
        trigger: "POST /conformance-reports/{id}/withdraw"
        actor: AccessibilityLead
        preconditions:
          - "ConformanceReport.state == PUBLISHED"
        side_effects:
          - "withdrawal_reason recorded"
          - "compensation: every KnownIssue with published_report_id == this report and state == PUBLISHED_COMMITTED transitions PUBLISHED_COMMITTED -> COMMITTED, public_target_date and published_report_id cleared to null"
          - "Product.overdue_committed_blocker_count and Product.publication_posture recomputed"
          - "every QuestionnaireResponse with report_id == this report and accuracy_status IN {CURRENT, STALE} flips to CORRECTION_REQUIRED with correction_due_at = clock + 10 days (the cited report is no longer public)"
      - from: APPROVED
        to: WITHDRAWN
        trigger: "POST /conformance-reports/{id}/withdraw"
        actor: AccessibilityLead
        preconditions:
          - "ConformanceReport.state == APPROVED"
        side_effects:
          - "withdrawal_reason recorded; no KnownIssue or QuestionnaireResponse side effects (nothing was published)"

  # ------------------------------------------------------------------ known issue
  - entity: KnownIssue
    initial_state: OPEN
    terminal_states: [RESOLVED, DEFERRED]
    note: "Cyclic through the publication boundary: COMMITTED -> PUBLISHED_COMMITTED -> COMMITTED on report withdrawal."
    transitions:
      - from: OPEN
        to: TRIAGED
        trigger: "POST /known-issues/{id}/triage"
        actor: AccessibilityLead
        preconditions:
          - "KnownIssue.state == OPEN"
        side_effects:
          - "triage_note recorded; severity optionally replaced, then risk_score recomputed under the INTAKE_ESTIMATE variant"
      - from: TRIAGED
        to: DEFERRED
        trigger: "POST /known-issues/{id}/board-review with defer = true"
        actor: AccessibilityLead
        preconditions:
          - "KnownIssue.state == TRIAGED"
          - "KnownIssue.release_train_id IS NULL"
        side_effects:
          - "risk_score recomputed under the BOARD_REVIEW variant; risk_variant set to BOARD_REVIEW; board_review_note recorded"
      - from: TRIAGED
        to: TRIAGED
        trigger: "POST /known-issues/{id}/board-review with defer = false"
        actor: AccessibilityLead
        preconditions:
          - "KnownIssue.state == TRIAGED"
        side_effects:
          - "risk_score recomputed under the BOARD_REVIEW variant (§1.3 remediation_risk_score); risk_variant set to BOARD_REVIEW; board_review_note recorded"
      - from: TRIAGED
        to: COMMITTED
        trigger: "POST /known-issues/{id}/commit"
        actor: AccessibilityLead
        preconditions:
          - "KnownIssue.state == TRIAGED"
          - "ReleaseTrain.window_start <= KnownIssue.target_remediation_date <= ReleaseTrain.window_end - freeze_days (closed-interval usable window)"
          - "ReleaseTrain.committed_effort_points + KnownIssue.effort_points <= ReleaseTrain.effort_capacity_points"
        side_effects:
          - "release_train_id set; ReleaseTrain.committed_effort_points increased by effort_points"
      - from: COMMITTED
        to: PUBLISHED_COMMITTED
        trigger: "system, on POST /conformance-reports/{id}/publish for the issue's product when publish_intent == INCLUDED"
        actor: system
        preconditions:
          - "KnownIssue.state == COMMITTED"
          - "KnownIssue.publish_intent == INCLUDED"
        side_effects:
          - "public_target_date = target_remediation_date; published_report_id = the publishing report"
          - "Product.overdue_committed_blocker_count recomputed; Product.publication_posture recomputed"
      - from: PUBLISHED_COMMITTED
        to: COMMITTED
        trigger: "system, on POST /conformance-reports/{id}/withdraw of published_report_id"
        actor: system
        preconditions:
          - "KnownIssue.state == PUBLISHED_COMMITTED"
        side_effects:
          - "public_target_date and published_report_id cleared to null (compensation for the publish cascade)"
      - from: COMMITTED
        to: RESOLVED
        trigger: "POST /known-issues/{id}/resolve"
        actor: AccessibilityTester
        preconditions:
          - "KnownIssue.state IN {COMMITTED, PUBLISHED_COMMITTED}"
          - "AssessmentRun.status of resolution_run_id == COMPLETED AND its component_id == KnownIssue.component_id"
        side_effects:
          - "resolution_note and resolution_run_id recorded"
          - "ReleaseTrain.committed_effort_points decreased by effort_points; ReleaseTrain.unallocated_cents increased by KnownIssue.funded_cents; KnownIssue.funded_cents set to 0 and funding_state set to UNFUNDED (compensating_invariant/remediation_budget_conservation)"
          - "Product.overdue_committed_blocker_count and Product.publication_posture recomputed"
      - from: PUBLISHED_COMMITTED
        to: RESOLVED
        trigger: "POST /known-issues/{id}/resolve"
        actor: AccessibilityTester
        preconditions:
          - "KnownIssue.state IN {COMMITTED, PUBLISHED_COMMITTED}"
          - "AssessmentRun.status of resolution_run_id == COMPLETED AND its component_id == KnownIssue.component_id"
        side_effects:
          - "resolution_note and resolution_run_id recorded; public_target_date retained for audit"
          - "ReleaseTrain.committed_effort_points decreased by effort_points; ReleaseTrain.unallocated_cents increased by KnownIssue.funded_cents; funded_cents set to 0 and funding_state set to UNFUNDED"
          - "Product.overdue_committed_blocker_count and Product.publication_posture recomputed"

  # ------------------------------------------------------------- questionnaire
  - entity: QuestionnaireResponse
    dimension: review_status
    initial_state: DRAFT
    terminal_states: []
    note: "Authoring dimension. Independent of accuracy_status below — a SUBMITTED response can be CURRENT, STALE or CORRECTION_REQUIRED, and every combination is reachable. Cyclic: ATTESTED -> SUBMITTED on revision."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /questionnaire-responses/{id}/submit"
        actor: CustomerLiaison
        preconditions:
          - "QuestionnaireResponse.review_status == DRAFT"
        side_effects:
          - "submitted_at set to the logical clock"
          - "disclosure_debt and disclosure_tier computed per §1.3 questionnaire_disclosure_debt"
      - from: SUBMITTED
        to: ATTESTED
        trigger: "POST /questionnaire-responses/{id}/attest"
        actor: AccessibilityLead
        preconditions:
          - "QuestionnaireResponse.review_status == SUBMITTED"
          - "ConformanceReport.state of report_id == PUBLISHED (cross_entity_state_dependency/questionnaire_attest_requires_published_report)"
          - "Product.publication_posture of product_id == OPEN"
        side_effects:
          - "last_attested_at set to the logical clock; accuracy_status set to CURRENT; correction_due_at cleared to null; update_due_at set to last_attested_at + UPDATE_CADENCE_DAYS (90 days)"
          - "disclosure_debt and disclosure_tier recomputed"
          - "Product.stale_questionnaire_count and Product.correction_required_questionnaire_count recomputed, then Product.publication_posture recomputed"
      - from: ATTESTED
        to: SUBMITTED
        trigger: "POST /questionnaire-responses/{id}/revise"
        actor: CustomerLiaison
        preconditions:
          - "QuestionnaireResponse.review_status IN {SUBMITTED, ATTESTED}"
        side_effects:
          - "answers_summary replaced; revision_count incremented by 1; submitted_at set to the logical clock"
          - "accuracy_status set to CURRENT; update_due_at and correction_due_at cleared to null"
          - "disclosure_debt and disclosure_tier recomputed; Product counters and publication_posture recomputed"
      - from: SUBMITTED
        to: SUBMITTED
        trigger: "POST /questionnaire-responses/{id}/revise"
        actor: CustomerLiaison
        preconditions:
          - "QuestionnaireResponse.review_status IN {SUBMITTED, ATTESTED}"
        side_effects:
          - "answers_summary replaced; revision_count incremented by 1; accuracy_status set to CURRENT; deadlines cleared; disclosure_debt recomputed"

  - entity: QuestionnaireResponse
    dimension: accuracy_status
    initial_state: CURRENT
    terminal_states: []
    note: "Accuracy-obligation dimension, driven by the product's posture cascade and by explicit revision/attestation. Recovery is asymmetric: posture returning to OPEN never clears STALE or CORRECTION_REQUIRED."
    transitions:
      - from: CURRENT
        to: STALE
        trigger: "system, when Product.publication_posture transitions into RESTRICTED, or on POST /products/{id}/recompute-posture when accuracy_status == CURRENT and update_due_at < the logical clock (the update cadence has lapsed)"
        actor: system
        preconditions:
          - "QuestionnaireResponse.accuracy_status == CURRENT"
        side_effects:
          - "update_due_at = logical clock + 30 days; Product.stale_questionnaire_count recomputed"
      - from: CURRENT
        to: CORRECTION_REQUIRED
        trigger: "system, when Product.publication_posture transitions into FROZEN, or when the cited report is withdrawn"
        actor: system
        preconditions:
          - "QuestionnaireResponse.accuracy_status IN {CURRENT, STALE}"
        side_effects:
          - "correction_due_at = logical clock + 10 days; update_due_at cleared; Product.correction_required_questionnaire_count recomputed"
      - from: STALE
        to: CORRECTION_REQUIRED
        trigger: "system, when Product.publication_posture transitions into FROZEN, or when the cited report is withdrawn"
        actor: system
        preconditions:
          - "QuestionnaireResponse.accuracy_status IN {CURRENT, STALE}"
        side_effects:
          - "correction_due_at = logical clock + 10 days; update_due_at cleared; Product counters recomputed"
      - from: STALE
        to: CURRENT
        trigger: "POST /questionnaire-responses/{id}/revise or POST /questionnaire-responses/{id}/attest"
        actor: CustomerLiaison
        preconditions:
          - "QuestionnaireResponse.accuracy_status IN {STALE, CORRECTION_REQUIRED}"
        side_effects:
          - "update_due_at and correction_due_at cleared; Product counters and publication_posture recomputed"
      - from: CORRECTION_REQUIRED
        to: CURRENT
        trigger: "POST /questionnaire-responses/{id}/revise"
        actor: CustomerLiaison
        preconditions:
          - "QuestionnaireResponse.accuracy_status IN {STALE, CORRECTION_REQUIRED}"
        side_effects:
          - "correction_due_at cleared; Product.correction_required_questionnaire_count recomputed, then Product.publication_posture recomputed (a FROZEN product can return to RESTRICTED/OPEN this way)"

  # ------------------------------------------------------------------- complaint
  - entity: Complaint
    initial_state: NEW
    terminal_states: [CLOSED]
    note: "Fork-join: TRIAGED forks on route into the REMEDIATION branch (LINKED) or the ACCOMMODATION branch (ACCOMMODATED); both join at CLOSED with different preconditions and different side-effect sets."
    transitions:
      - from: NEW
        to: TRIAGED
        trigger: "POST /complaints/{id}/triage"
        actor: AccessibilityLead
        preconditions:
          - "Complaint.state == NEW"
          - "when route == ACCOMMODATION: requested_accommodation and needed_by_date are present and needed_by_date >= the logical clock date"
        side_effects:
          - "route recorded; on the ACCOMMODATION route requested_accommodation and needed_by_date persisted"
      - from: TRIAGED
        to: LINKED
        trigger: "POST /complaints/{id}/link-issue"
        actor: AccessibilityLead
        preconditions:
          - "Complaint.state == TRIAGED"
          - "Complaint.route == REMEDIATION"
          - "KnownIssue.product_id of known_issue_id == Complaint.product_id"
        side_effects:
          - "linked_issue_id set; KnownIssue.linked_complaint_count incremented by 1"
          - "KnownIssue.risk_score recomputed under the issue's current risk_variant (BOARD_REVIEW amplifies by linked_complaint_count)"
      - from: TRIAGED
        to: ACCOMMODATED
        trigger: "POST /complaints/{id}/fulfill-accommodation"
        actor: CustomerLiaison
        preconditions:
          - "Complaint.state == TRIAGED"
          - "Complaint.route == ACCOMMODATION"
        side_effects:
          - "accommodation_fulfilled_at set to the logical clock; Product.accommodations_fulfilled_count recomputed"
      - from: LINKED
        to: CLOSED
        trigger: "POST /complaints/{id}/close"
        actor: AccessibilityLead
        preconditions:
          - "Complaint.state == LINKED"
          - "KnownIssue.state of linked_issue_id IN {RESOLVED, DEFERRED} (cross_entity_state_dependency/complaint_close_requires_issue_terminal)"
          - "closure_outcome IN {REMEDIATION_SCHEDULED, NOT_A_DEFECT}"
        side_effects:
          - "closed_at and closure_outcome recorded"
      - from: ACCOMMODATED
        to: CLOSED
        trigger: "POST /complaints/{id}/close"
        actor: AccessibilityLead
        preconditions:
          - "Complaint.state == ACCOMMODATED"
          - "closure_outcome IN {ACCOMMODATION_PROVIDED, ACCOMMODATION_DENIED}"
        side_effects:
          - "closed_at and closure_outcome recorded; no KnownIssue is touched on this branch"

  # --------------------------------------------------------------------- product
  - entity: Product
    dimension: publication_posture
    initial_state: OPEN
    terminal_states: []
    note: |
      Compound derived gate. Recomputed by §1.3 product_publication_posture after every
      CriterionAssessment attest/create/supersede, AssessmentRun complete/void, KnownIssue
      state change, QuestionnaireResponse accuracy change originating from an API action,
      report publish/withdraw, and POST /products/{id}/recompute-posture. Cascade writes made
      BY a posture transition (questionnaire flips) do not re-trigger posture recompute inside
      the same request.
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "system, on posture recompute"
        actor: system
        preconditions:
          - "no FROZEN condition holds AND (assessed_criteria_count >= 1 AND conformance_index_provisional < 85.00) OR stale_questionnaire_count >= 2"
        side_effects:
          - "every QuestionnaireResponse of this product with accuracy_status == CURRENT flips CURRENT -> STALE with update_due_at = clock + 30 days"
      - from: OPEN
        to: FROZEN
        trigger: "system, on posture recompute"
        actor: system
        preconditions:
          - "overdue_committed_blocker_count >= 1 OR correction_required_questionnaire_count >= 1"
        side_effects:
          - "every QuestionnaireResponse of this product with accuracy_status IN {CURRENT, STALE} flips to CORRECTION_REQUIRED with correction_due_at = clock + 10 days"
      - from: RESTRICTED
        to: FROZEN
        trigger: "system, on posture recompute"
        actor: system
        preconditions:
          - "overdue_committed_blocker_count >= 1 OR correction_required_questionnaire_count >= 1"
        side_effects:
          - "every QuestionnaireResponse of this product with accuracy_status IN {CURRENT, STALE} flips to CORRECTION_REQUIRED with correction_due_at = clock + 10 days"
      - from: RESTRICTED
        to: OPEN
        trigger: "system, on posture recompute"
        actor: system
        preconditions:
          - "no FROZEN condition holds AND NOT (assessed_criteria_count >= 1 AND conformance_index_provisional < 85.00) AND stale_questionnaire_count <= 1"
        side_effects:
          - "no questionnaire flips (recovery is asymmetric: STALE rows stay STALE until revised or attested)"
      - from: FROZEN
        to: RESTRICTED
        trigger: "system, on posture recompute"
        actor: system
        preconditions:
          - "no FROZEN condition holds AND ((assessed_criteria_count >= 1 AND conformance_index_provisional < 85.00) OR stale_questionnaire_count >= 2)"
        side_effects:
          - "no questionnaire flips"
      - from: FROZEN
        to: OPEN
        trigger: "system, on posture recompute"
        actor: system
        preconditions:
          - "no FROZEN condition holds AND NOT (assessed_criteria_count >= 1 AND conformance_index_provisional < 85.00) AND stale_questionnaire_count <= 1"
        side_effects:
          - "no questionnaire flips"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: report-create-stale-product
    parent_entity: Product
    write_endpoint: "POST /conformance-reports"
    occ_field: "expected_product_version"
    description: |
      Creating a ConformanceReport against a Product whose version has advanced since
      the client last read it is rejected. A new report legitimately supersedes the
      product's prior published report on publication, so a writer holding a stale view
      of the product (its posture, index, component counts or an already-created open
      report) must re-read before authoring.
    error_id: ERR_STALE_PRODUCT_VERSION
    http_status: 412

  - rule_id: assessment-create-stale-component
    parent_entity: ProductComponent
    write_endpoint: "POST /criterion-assessments"
    occ_field: "expected_component_version"
    description: |
      Creating a CriterionAssessment against a ProductComponent whose version has advanced
      since the client last read it is rejected. A new assessment for the same
      component_id + criterion_id legitimately supersedes the prior row, so a writer whose
      view of the component (coverage_pct, assessment_state, evidence) is stale must re-read
      before authoring a superseding assessment.
    error_id: ERR_STALE_COMPONENT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: component_testing_coverage_pct
    trigger: "On AssessmentRun SCHEDULED->COMPLETED and COMPLETED->VOID; writes ProductComponent.coverage_pct"
    algorithm: weighted_scoring
    formula: |
      # AT-profile weighted coverage with an automated-evidence cap.
      # Non-linear: nested min(), plus a conditional branch on the presence of MANUAL evidence.
      denom = ProductComponent.applicable_criteria_count          # >= 1 by field constraint
      for p in [SCREEN_READER, KEYBOARD, MAGNIFICATION]:
          auto_p = SUM(AssessmentRun.criteria_exercised
                       WHERE component_id = C AND status = COMPLETED
                         AND method = AUTOMATED AND at_profile = p)
          man_p  = SUM(AssessmentRun.criteria_exercised
                       WHERE component_id = C AND status = COMPLETED
                         AND method = MANUAL AND at_profile = p)
          raw_p  = min(1.0, (AUTOMATED_CREDIT * auto_p + MANUAL_CREDIT * man_p) / denom)
          cap_p  = AUTOMATED_ONLY_CAP if man_p == 0 else 1.00     # conditional branch
          score_p = min(raw_p, cap_p)
      coverage_raw = 100 * ( W_SCREEN_READER  * score_SCREEN_READER
                           + W_KEYBOARD      * score_KEYBOARD
                           + W_MAGNIFICATION * score_MAGNIFICATION )
      ProductComponent.coverage_pct = round_half_up(coverage_raw, 2)
      # Rounding order is pinned: per-profile scores are kept at full precision and
      # exactly ONE rounding happens, on the final weighted sum.
    input_set: "AssessmentRun rows for the component with status == COMPLETED only; SCHEDULED and VOID runs contribute nothing"
    constants:
      W_SCREEN_READER: 0.45
      W_KEYBOARD: 0.35
      W_MAGNIFICATION: 0.20
      AUTOMATED_CREDIT: 0.4
      MANUAL_CREDIT: 1.0
      AUTOMATED_ONLY_CAP: 0.60
      MIN_ATTEST_COVERAGE_PCT: 45.00
    precision: "2 decimal places, round_half_up"

  - name: product_conformance_index
    trigger: "PROVISIONAL: after every CriterionAssessment attest/create/supersede/NEEDS_REVALIDATION flip and after coverage-driven component state changes; writes Product.conformance_index_provisional and Product.assessed_criteria_count. CERTIFIED: on ConformanceReport APPROVED->PUBLISHED; writes ConformanceReport.conformance_index_certified and criterion_support_snapshot."
    algorithm: aggregation
    formula: |
      # Step 1 — in-scope criteria (identical for both variants):
      #   SuccessCriterion rows with standard_id = Product.standard_id
      #   AND level IN LEVELS_FOR_TARGET[Product.target_level]
      #   ordered by criterion_number ASC (order is presentational only).
      # Step 2 — in-scope components: ProductComponent rows with product_id = P AND in_scope = true.
      # Step 3 — per criterion K, per in-scope component C, pick the qualifying assessment:
      #   the CriterionAssessment with component_id = C AND criterion_id = K whose
      #   attestation_state is in QUALIFYING_STATES[variant]; when more than one qualifies,
      #   take the one with the greatest created_at (tie-break: greatest version).
      # Step 4 — rollup per criterion K = worst-of over in-scope components:
      #   ignore rows with support_level = NOT_APPLICABLE;
      #   if NO in-scope component has a non-NOT_APPLICABLE qualifying row:
      #       PROVISIONAL -> K is EXCLUDED from numerator and denominator
      #       CERTIFIED   -> if at least one in-scope component has a NOT_APPLICABLE
      #                      qualifying row for K and none has another kind, K is EXCLUDED;
      #                      otherwise K is INCLUDED with weight 0.0
      #   else rolled_weight(K) = MIN over contributing rows of
      #        SUPPORT_WEIGHT[support_level]      # DOES_NOT_SUPPORT < PARTIALLY < SUPPORTS
      #   CERTIFIED additionally: if any in-scope component has NO qualifying row for K
      #        (i.e. no ATTESTED row at all), rolled_weight(K) = 0.0 and K is INCLUDED.
      # Step 5:
      #   denominator = count of INCLUDED criteria
      #   numerator   = SUM of rolled_weight over INCLUDED criteria
      #   index = 0.00 when denominator == 0 else round_half_up(100 * numerator / denominator, 2)
      # Product.assessed_criteria_count = the PROVISIONAL denominator.
    input_set: |
      PROVISIONAL: QUALIFYING_STATES = {DRAFT, ATTESTED}; unassessed criteria are EXCLUDED from
      the denominator. CERTIFIED: QUALIFYING_STATES = {ATTESTED} only (DRAFT rows are invisible);
      criteria lacking an ATTESTED row on any in-scope component are INCLUDED with weight 0.0.
      SUPERSEDED and NEEDS_REVALIDATION rows never qualify in either variant.
    constants:
      SUPPORT_WEIGHT: { SUPPORTS: 1.0, PARTIALLY_SUPPORTS: 0.5, DOES_NOT_SUPPORT: 0.0 }
      LEVELS_FOR_TARGET: { A: [A], AA: [A, AA], AAA: [A, AA, AAA] }
      POSTURE_INDEX_FLOOR: 85.00
    precision: "2 decimal places, round_half_up"
    variants:
      - name: PROVISIONAL
        when: "Continuously, on Product.conformance_index_provisional; drives the RESTRICTED posture threshold"
        difference: "Accepts DRAFT evidence and silently drops unassessed criteria from the denominator — an optimistic view that rises as soon as any assessment is authored"
      - name: CERTIFIED
        when: "Frozen once, into ConformanceReport.conformance_index_certified at publication"
        difference: "Accepts only ATTESTED evidence and charges every unassessed in-scope criterion as 0.0 inside the denominator — a pessimistic view that can be far lower than PROVISIONAL on identical data"

  - name: remediation_risk_score
    trigger: "INTAKE_ESTIMATE: on POST /known-issues and on OPEN->TRIAGED. BOARD_REVIEW: on POST /known-issues/{id}/board-review and on Complaint TRIAGED->LINKED for an issue whose risk_variant is already BOARD_REVIEW. Writes KnownIssue.risk_score and KnownIssue.risk_variant."
    algorithm: decay_function
    formula: |
      breadth      = COUNT(DISTINCT SuccessCriterion.disability_categories of criterion_id)   # 1..4
      usage_weight = ProductComponent.user_reach_pct of component_id / 100                    # 0.00..1.00
      base = SEVERITY_POINTS[severity]
             * (1 + BREADTH_STEP * (breadth - 1))
             * (REACH_FLOOR + (1 - REACH_FLOOR) * usage_weight)
      # INTAKE_ESTIMATE
      risk_score = round_half_up(base, 2)
      # BOARD_REVIEW
      days_late     = max(0, floor((clock_date - target_remediation_date) / 1 day))
      aging         = 1 + AGING_STEP * min(days_late, AGING_CAP_DAYS)
      complaint_amp = 1 + COMPLAINT_STEP * min(KnownIssue.linked_complaint_count, COMPLAINT_CAP)
      risk_score    = round_half_up(min(RISK_CEILING, base * aging * complaint_amp), 2)
      # base is NEVER pre-rounded: the single rounding happens on the final product.
    input_set: "The issue's own severity, its criterion's disability_categories, its component's user_reach_pct, its linked_complaint_count, and the logical clock date. Issue state is irrelevant; DEFERRED and RESOLVED issues keep their last computed score."
    constants:
      SEVERITY_POINTS: { BLOCKER: 40, SERIOUS: 25, MODERATE: 12, MINOR: 5 }
      BREADTH_STEP: 0.15
      REACH_FLOOR: 0.5
      AGING_STEP: 0.02
      AGING_CAP_DAYS: 60
      COMPLAINT_STEP: 0.10
      COMPLAINT_CAP: 5
      RISK_CEILING: 100.0
    precision: "2 decimal places, round_half_up"
    variants:
      - name: INTAKE_ESTIMATE
        when: "At intake and at triage, before the prioritization board has looked at the issue"
        difference: "Severity x disability breadth x user reach only; no aging, no complaint amplification, no ceiling clamp"
      - name: BOARD_REVIEW
        when: "At prioritization board review and whenever a complaint is linked to an already board-reviewed issue"
        difference: "Multiplies the same base by an aging factor derived from days past target_remediation_date (capped at 60 days) and by a complaint amplification factor (capped at 5 complaints), then clamps at 100.00"

  - name: remediation_budget_allocation
    trigger: "POST /release-trains/{id}/allocate-budget; writes KnownIssue.funded_cents, KnownIssue.funding_state, ReleaseTrain.unallocated_cents, ReleaseTrain.allocation_state"
    algorithm: waterfall_allocation
    formula: |
      candidates = KnownIssue rows WHERE release_train_id = T
                                     AND product_id = payload.product_id
                                     AND state IN {COMMITTED, PUBLISHED_COMMITTED}
      ORDER BY risk_score DESC, target_remediation_date ASC, created_at ASC   # total order, no id
      remaining = ReleaseTrain.remediation_budget_cents
      for issue in candidates:                                # strict waterfall
          ask_raw   = issue.effort_points * COST_PER_POINT_CENTS * OVERHEAD_MULT
          ask_cents = round_half_up(ask_raw, 0)               # PINNED: round PER ISSUE, then sum
          grant     = min(remaining, ask_cents)
          issue.funded_cents  = grant
          issue.funding_state = FULLY_FUNDED   if grant == ask_cents and grant > 0
                                else PARTIALLY_FUNDED if grant > 0
                                else UNFUNDED
          remaining -= grant
      ReleaseTrain.unallocated_cents = remaining
      ReleaseTrain.allocation_state  = ALLOCATED
      # ORDER OF ROUNDING IS NORMATIVE: each issue's ask is rounded to whole cents BEFORE the
      # waterfall consumes the budget. Summing raw asks and rounding the total (the rejected
      # order) yields a different per-issue split at the exhaustion boundary.
    input_set: "Only issues already committed to this train for the requested product, in states COMMITTED or PUBLISHED_COMMITTED; TRIAGED, DEFERRED, OPEN and RESOLVED issues are excluded even when release_train_id is set"
    constants:
      COST_PER_POINT_CENTS: 18750
      OVERHEAD_MULT: 1.0725
    precision: "whole cents, round_half_up, applied per issue before allocation"

  - name: questionnaire_disclosure_debt
    trigger: "On QuestionnaireResponse DRAFT->SUBMITTED, SUBMITTED->ATTESTED and on every revise; writes QuestionnaireResponse.disclosure_debt and disclosure_tier"
    algorithm: constraint_propagation
    formula: |
      # Circular-looking by construction: the staleness penalty depends on a tier that is
      # itself keyed on a debt figure. EVALUATION ORDER IS PINNED and MUST NOT be iterated.
      # (1) base_debt
      base_debt = SUM over KnownIssue rows WHERE product_id = P
                       AND publish_intent = INCLUDED
                       AND state IN {OPEN, TRIAGED, COMMITTED, PUBLISHED_COMMITTED} of:
                     ISSUE_DEBT[severity]
                   + (OVERDUE_SURCHARGE if target_remediation_date < clock_date else 0)
      # (2) tier — derived from base_debt ONLY, never from disclosure_debt
      tier = STANDARD if base_debt <= TIER_STANDARD_MAX
             else ELEVATED if base_debt <= TIER_ELEVATED_MAX
             else CRITICAL
      # (3) staleness penalty
      reference_at   = last_attested_at if last_attested_at IS NOT NULL else created_at
      days_since     = floor((clock - reference_at) / 1 day)
      bucket         = min(STALENESS_BUCKET_CAP, floor(days_since / STALENESS_BUCKET_DAYS))
      penalty        = TIER_PENALTY[tier] * bucket
      # (4) result
      disclosure_debt  = round_half_up(base_debt + penalty, 2)
      disclosure_tier  = tier
      # Recomputing tier from disclosure_debt (fixed-point iteration) is explicitly FORBIDDEN.
    input_set: "KnownIssue rows of the product with publish_intent == INCLUDED in states {OPEN, TRIAGED, COMMITTED, PUBLISHED_COMMITTED}; DEFERRED, RESOLVED and EXCLUDED-intent issues never contribute"
    constants:
      ISSUE_DEBT: { BLOCKER: 8, SERIOUS: 5, MODERATE: 3, MINOR: 1 }
      OVERDUE_SURCHARGE: 2
      TIER_STANDARD_MAX: 6
      TIER_ELEVATED_MAX: 12
      TIER_PENALTY: { STANDARD: 0.5, ELEVATED: 1.0, CRITICAL: 2.0 }
      STALENESS_BUCKET_DAYS: 30
      STALENESS_BUCKET_CAP: 4
    precision: "2 decimal places, round_half_up"

  - name: product_publication_posture
    trigger: "System recompute after CriterionAssessment attest/create/supersede/revalidation flips, AssessmentRun complete/void, KnownIssue state changes, questionnaire accuracy changes originating from an API action, ConformanceReport publish/withdraw, and POST /products/{id}/recompute-posture; writes Product.publication_posture"
    algorithm: threshold
    formula: |
      overdue_committed_blocker_count = COUNT(KnownIssue WHERE product_id = P
              AND severity = BLOCKER AND state = PUBLISHED_COMMITTED
              AND public_target_date < clock_date)
      correction_required_questionnaire_count = COUNT(QuestionnaireResponse
              WHERE product_id = P AND accuracy_status = CORRECTION_REQUIRED)
      stale_questionnaire_count = COUNT(QuestionnaireResponse
              WHERE product_id = P AND accuracy_status = STALE)
      if overdue_committed_blocker_count >= 1
         OR correction_required_questionnaire_count >= 1:            posture = FROZEN
      elif (assessed_criteria_count >= 1
            AND conformance_index_provisional < POSTURE_INDEX_FLOOR)
         OR stale_questionnaire_count >= STALE_QUESTIONNAIRE_LIMIT:  posture = RESTRICTED
      else:                                                          posture = OPEN
      # A product with zero assessed criteria is never RESTRICTED on index grounds:
      # the index floor only bites once assessed_criteria_count >= 1.
    input_set: "All KnownIssue and QuestionnaireResponse rows of the product plus the product's own PROVISIONAL index and assessed_criteria_count; component and run rows influence the posture only through the index"
    constants:
      POSTURE_INDEX_FLOOR: 85.00
      STALE_QUESTIONNAIRE_LIMIT: 2
      STALE_WINDOW_DAYS: 30
      CORRECTION_WINDOW_DAYS: 10
      UPDATE_CADENCE_DAYS: 90
    precision: "enum output; comparisons on 2-decimal index values"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is one of the five declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 5
    category: auth
    check: "The acting role appears in the endpoint's roles list in §1.5"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 8
    category: auth
    check: "When X-User-Role is ProductOwner, X-User-ID equals the Product.id that owns the target resource (product_id of the report/component/issue, or the path product id)"
    error_id: ERR_PRODUCT_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: "POST /conformance-reports/{id}/submit and every endpoint ProductOwner may call"

  - priority: 12
    category: existence
    check: "Every path-segment resource exists, validated left to right"
    error_id: "ERR_STANDARD_NOT_FOUND | ERR_PRODUCT_NOT_FOUND | ERR_COMPONENT_NOT_FOUND | ERR_ENVIRONMENT_NOT_FOUND | ERR_RUN_NOT_FOUND | ERR_ASSESSMENT_NOT_FOUND | ERR_REPORT_NOT_FOUND | ERR_RELEASE_TRAIN_NOT_FOUND | ERR_KNOWN_ISSUE_NOT_FOUND | ERR_QUESTIONNAIRE_NOT_FOUND | ERR_COMPLAINT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 16
    category: existence
    check: "Every foreign key supplied in the request body resolves to an existing row"
    error_id: "ERR_STANDARD_NOT_FOUND | ERR_PRODUCT_NOT_FOUND | ERR_COMPONENT_NOT_FOUND | ERR_ENVIRONMENT_NOT_FOUND | ERR_RUN_NOT_FOUND | ERR_CRITERION_NOT_FOUND | ERR_RELEASE_TRAIN_NOT_FOUND | ERR_KNOWN_ISSUE_NOT_FOUND | ERR_REPORT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with FK fields in the body"

  - priority: 20
    category: business_constraint
    check: "Request body shape: required fields present, types correct, enum members valid, numeric ranges respected, limit in 1..100, offset >= 0, arrays non-empty and duplicate-free, scheduled_end strictly after scheduled_start, window_end >= window_start"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 24
    category: state
    check: "OCC: expected_product_version equals Product.version (POST /conformance-reports); expected_component_version equals ProductComponent.version (POST /criterion-assessments)"
    error_id: "ERR_STALE_PRODUCT_VERSION | ERR_STALE_COMPONENT_VERSION"
    http_status: 412
    applies_to: "POST /conformance-reports, POST /criterion-assessments"

  - priority: 28
    category: state
    check: "AssessmentRun.status is SCHEDULED for complete, and SCHEDULED or COMPLETED for void"
    error_id: ERR_RUN_NOT_ACTIONABLE
    http_status: 409
    applies_to: "POST /assessment-runs/{id}/complete, POST /assessment-runs/{id}/void"

  - priority: 30
    category: state
    check: "CriterionAssessment.attestation_state == DRAFT for attest"
    error_id: ERR_ASSESSMENT_NOT_DRAFT
    http_status: 409
    applies_to: "POST /criterion-assessments/{id}/attest"

  - priority: 32
    category: state
    check: "ConformanceReport is in the from-state required by the requested transition (submit: DRAFT|CHANGES_REQUESTED; request-changes/approve: IN_REVIEW; publish: APPROVED; withdraw: APPROVED|PUBLISHED)"
    error_id: "ERR_REPORT_NOT_SUBMITTABLE | ERR_REPORT_NOT_IN_REVIEW | ERR_REPORT_NOT_APPROVED | ERR_REPORT_NOT_WITHDRAWABLE"
    http_status: 409
    applies_to: "POST /conformance-reports/{id}/submit, /request-changes, /approve, /publish, /withdraw"

  - priority: 34
    category: state
    check: "KnownIssue is in the from-state required by the requested transition (triage: OPEN; board-review: TRIAGED; commit: TRIAGED; resolve: COMMITTED|PUBLISHED_COMMITTED)"
    error_id: "ERR_ISSUE_NOT_OPEN | ERR_ISSUE_NOT_TRIAGED | ERR_ISSUE_NOT_RESOLVABLE"
    http_status: 409
    applies_to: "POST /known-issues/{id}/triage, /board-review, /commit, /resolve"

  - priority: 36
    category: state
    check: "QuestionnaireResponse.review_status is DRAFT for submit, SUBMITTED for attest, and SUBMITTED or ATTESTED for revise"
    error_id: "ERR_QUESTIONNAIRE_NOT_DRAFT | ERR_QUESTIONNAIRE_NOT_SUBMITTED | ERR_QUESTIONNAIRE_NOT_REVISABLE"
    http_status: 409
    applies_to: "POST /questionnaire-responses/{id}/submit, /attest, /revise"

  - priority: 38
    category: state
    check: "Complaint is in the from-state required by the requested transition (triage: NEW; link-issue: TRIAGED; fulfill-accommodation: TRIAGED; close: LINKED|ACCOMMODATED)"
    error_id: "ERR_COMPLAINT_NOT_NEW | ERR_COMPLAINT_NOT_TRIAGED | ERR_COMPLAINT_NOT_CLOSABLE"
    http_status: 409
    applies_to: "POST /complaints/{id}/triage, /link-issue, /fulfill-accommodation, /close"

  - priority: 40
    category: state
    check: "ReleaseTrain.allocation_state == UNALLOCATED for allocate-budget and ALLOCATED for deallocate-budget"
    error_id: "ERR_TRAIN_BUDGET_ALREADY_ALLOCATED | ERR_TRAIN_BUDGET_NOT_ALLOCATED"
    http_status: 409
    applies_to: "POST /release-trains/{id}/allocate-budget, POST /release-trains/{id}/deallocate-budget"

  - priority: 50
    category: business_safety
    check: "Product.publication_posture != FROZEN for report publication, questionnaire attestation, design review and budget allocation"
    error_id: ERR_PRODUCT_POSTURE_FROZEN
    http_status: 409
    applies_to: "POST /conformance-reports/{id}/publish, POST /questionnaire-responses/{id}/attest, POST /components/{id}/design-review, POST /release-trains/{id}/allocate-budget"

  - priority: 52
    category: business_safety
    check: "Segregation of duties: the attesting reviewer's X-User-ID differs from CriterionAssessment.authored_by_user_id; the approving reviewer's X-User-ID differs from ConformanceReport.submitted_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /criterion-assessments/{id}/attest, POST /conformance-reports/{id}/approve"

  - priority: 54
    category: business_safety
    check: "Product.publication_posture == OPEN (not merely non-FROZEN) for questionnaire accuracy attestation"
    error_id: ERR_PRODUCT_POSTURE_NOT_OPEN
    http_status: 409
    applies_to: "POST /questionnaire-responses/{id}/attest"

  - priority: 56
    category: business_safety
    check: "At publication, every in-scope ProductComponent.validated_disability_categories is a superset of the union of SuccessCriterion.disability_categories over in-scope criteria"
    error_id: ERR_DISABILITY_COVERAGE_GAP
    http_status: 422
    applies_to: "POST /conformance-reports/{id}/publish"

  - priority: 58
    category: business_constraint
    check: "ProductComponent.assessment_state of the assessment's component == COMPLETE before attestation"
    error_id: ERR_COMPONENT_ASSESSMENT_INCOMPLETE
    http_status: 409
    applies_to: "POST /criterion-assessments/{id}/attest"

  - priority: 59
    category: business_constraint
    check: "At publication, every in-scope ProductComponent has design_review_state == REVIEWED_PASS"
    error_id: ERR_DESIGN_REVIEW_INCOMPLETE
    http_status: 422
    applies_to: "POST /conformance-reports/{id}/publish"

  - priority: 60
    category: business_constraint
    check: "CriterionAssessment.remarks present with length >= 10 whenever support_level != SUPPORTS"
    error_id: ERR_REMARKS_REQUIRED
    http_status: 422
    applies_to: "POST /criterion-assessments"

  - priority: 61
    category: business_constraint
    check: "AssessmentRun.criteria_exercised <= ProductComponent.applicable_criteria_count of component_id"
    error_id: ERR_EXERCISED_EXCEEDS_SCOPE
    http_status: 422
    applies_to: "POST /assessment-runs"

  - priority: 62
    category: business_temporal
    check: "Attestation happens no later than EVIDENCE_MAX_AGE_DAYS (90) days after CriterionAssessment.created_at, measured on the logical clock"
    error_id: ERR_ASSESSMENT_EVIDENCE_EXPIRED
    http_status: 422
    applies_to: "POST /criterion-assessments/{id}/attest"

  - priority: 63
    category: business_temporal
    check: "The new run's [scheduled_start, scheduled_end) must not intersect [scheduled_start, scheduled_end + reconfiguration_buffer_minutes) of any run on the same environment whose status IN {SCHEDULED, COMPLETED}"
    error_id: ERR_ENVIRONMENT_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /assessment-runs"

  - priority: 64
    category: business_temporal
    check: "A new ReleaseTrain's closed window [window_start, window_end] must neither intersect nor touch an existing train's closed window: a gap of at least one full calendar day is required on both sides"
    error_id: ERR_TRAIN_WINDOW_ADJACENT
    http_status: 409
    applies_to: "POST /release-trains"

  - priority: 65
    category: business_temporal
    check: "KnownIssue.target_remediation_date lies within the train's usable window: window_start <= target_remediation_date <= window_end - freeze_days"
    error_id: ERR_TARGET_DATE_OUTSIDE_TRAIN_WINDOW
    http_status: 422
    applies_to: "POST /known-issues/{id}/commit"

  - priority: 66
    category: business_temporal
    check: "On the ACCOMMODATION route, needed_by_date >= the logical clock date"
    error_id: ERR_ACCOMMODATION_DATE_IN_PAST
    http_status: 422
    applies_to: "POST /complaints/{id}/triage"

  - priority: 68
    category: business_referential
    check: "Product.components_in_scope_count >= 1 at publication (an empty component inventory cannot be certified)"
    error_id: ERR_NO_IN_SCOPE_COMPONENTS
    http_status: 422
    applies_to: "POST /conformance-reports/{id}/publish"

  - priority: 69
    category: business_referential
    check: "Every pinned assessment still exists with the pinned version and attestation_state == ATTESTED at publication"
    error_id: ERR_PINNED_ASSESSMENT_CHANGED
    http_status: 409
    applies_to: "POST /conformance-reports/{id}/publish"

  - priority: 70
    category: business_referential
    check: "ConformanceReport.state of the cited report == PUBLISHED at questionnaire attestation"
    error_id: ERR_REPORT_NOT_PUBLISHED
    http_status: 409
    applies_to: "POST /questionnaire-responses/{id}/attest"

  - priority: 71
    category: business_referential
    check: "Complaint route matches the requested branch action: link-issue requires route == REMEDIATION, fulfill-accommodation requires route == ACCOMMODATION, and closure_outcome must belong to the branch's set (REMEDIATION -> {REMEDIATION_SCHEDULED, NOT_A_DEFECT}; ACCOMMODATION -> {ACCOMMODATION_PROVIDED, ACCOMMODATION_DENIED})"
    error_id: ERR_COMPLAINT_ROUTE_MISMATCH
    http_status: 409
    applies_to: "POST /complaints/{id}/link-issue, POST /complaints/{id}/fulfill-accommodation, POST /complaints/{id}/close"

  - priority: 72
    category: business_referential
    check: "On the REMEDIATION branch, KnownIssue.state of linked_issue_id IN {RESOLVED, DEFERRED} before closure"
    error_id: ERR_LINKED_ISSUE_UNRESOLVED
    http_status: 409
    applies_to: "POST /complaints/{id}/close"

  - priority: 73
    category: business_referential
    check: "SuccessCriterion.standard_id of criterion_id equals the standard of the referenced product (assessments, issues, complaints); ConformanceReport.standard_id equals Product.standard_id; AssessmentRun.at_profile equals TestEnvironment.at_profile; KnownIssue.component_id belongs to KnownIssue.product_id; QuestionnaireResponse.report_id belongs to product_id; Complaint.linked_issue candidate belongs to the same product"
    error_id: "ERR_CRITERION_STANDARD_MISMATCH | ERR_REPORT_STANDARD_MISMATCH | ERR_ENVIRONMENT_PROFILE_MISMATCH | ERR_CROSS_PRODUCT_REFERENCE"
    http_status: 422
    applies_to: "POST /criterion-assessments, POST /known-issues, POST /complaints, POST /conformance-reports, POST /assessment-runs, POST /questionnaire-responses, POST /complaints/{id}/link-issue"

  - priority: 74
    category: business_referential
    check: "KnownIssue.resolution_run_id names a run with status == COMPLETED whose component_id equals the issue's component_id"
    error_id: ERR_RESOLUTION_EVIDENCE_INVALID
    http_status: 422
    applies_to: "POST /known-issues/{id}/resolve"

  - priority: 76
    category: business_constraint
    check: "Uniqueness: Standard.code globally; SuccessCriterion.criterion_number within a standard; ProductComponent.name within a product; TestEnvironment.name and ReleaseTrain.name globally"
    error_id: "ERR_DUPLICATE_STANDARD_CODE | ERR_DUPLICATE_CRITERION_NUMBER | ERR_DUPLICATE_COMPONENT_NAME | ERR_DUPLICATE_ENVIRONMENT_NAME | ERR_DUPLICATE_TRAIN_NAME"
    http_status: 409
    applies_to: "POST /standards, POST /standards/{id}/criteria, POST /products/{id}/components, POST /test-environments, POST /release-trains"

  - priority: 78
    category: business_constraint
    check: "At most one ConformanceReport per (product_id, standard_id) in a non-terminal authoring state {DRAFT, IN_REVIEW, CHANGES_REQUESTED, APPROVED}"
    error_id: ERR_REPORT_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /conformance-reports"

  - priority: 80
    category: business_constraint
    check: "SuccessCriterion.level <= Standard.max_target_level; Product.target_level <= Standard.max_target_level; Product.surface_type compatible with Standard.surface_scope (BOTH accepts anything, otherwise they must match)"
    error_id: ERR_LEVEL_OR_SURFACE_UNSUPPORTED
    http_status: 422
    applies_to: "POST /standards/{id}/criteria, POST /products"

  - priority: 82
    category: business_fiscal
    check: "ReleaseTrain.committed_effort_points + KnownIssue.effort_points <= ReleaseTrain.effort_capacity_points at commit"
    error_id: ERR_TRAIN_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /known-issues/{id}/commit"

  - priority: 84
    category: business_fiscal
    check: "allocate-budget requires at least one candidate issue for the requested product on this train"
    error_id: ERR_NO_FUNDABLE_ISSUES
    http_status: 422
    applies_to: "POST /release-trains/{id}/allocate-budget"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Standards and success criteria (immutable configuration) ---
  - method: POST
    path: /standards
    purpose: "Register an accessibility standard (web content or software guidelines) with its surface scope and highest supported conformance level"
    roles: [AccessibilityLead]
    input: [code, title, surface_scope, max_target_level]
    output: Standard
    status: 201
    side_effects: []

  - method: GET
    path: /standards/{id}
    purpose: "Read one standard"
    roles: [AccessibilityLead, AccessibilityTester, ConformanceReviewer, ProductOwner, CustomerLiaison]
    input: []
    output: Standard
    status: 200
    side_effects: []

  - method: POST
    path: /standards/{id}/criteria
    purpose: "Add a success criterion to a standard, tagged with the disability categories it protects and the surfaces it applies to"
    roles: [AccessibilityLead]
    input: [criterion_number, title, level, disability_categories, applies_to_surfaces]
    output: SuccessCriterion
    status: 201
    side_effects: []

  - method: GET
    path: /standards/{id}/criteria
    purpose: "List the success criteria of a standard, optionally filtered by conformance level"
    roles: [AccessibilityLead, AccessibilityTester, ConformanceReviewer, ProductOwner, CustomerLiaison]
    input: ["level?", "limit?", "offset?"]
    output: SuccessCriterion[]
    status: 200
    side_effects: []

  - method: GET
    path: /criteria/{id}
    purpose: "Read one success criterion (immutable: no update endpoint and no version field)"
    roles: [AccessibilityLead, AccessibilityTester, ConformanceReviewer, ProductOwner, CustomerLiaison]
    input: []
    output: SuccessCriterion
    status: 200
    side_effects: []

  # --- Products and component inventory ---
  - method: POST
    path: /products
    purpose: "Create a software product enrolled in the accessibility program with its selected standard and conformance level target"
    roles: [AccessibilityLead]
    input: [name, version_label, standard_id, target_level, surface_type]
    output: Product
    status: 201
    side_effects: ["Derived counters initialise to 0, conformance_index_provisional to 0.00, assessment_readiness to NOT_READY, publication_posture to OPEN"]

  - method: GET
    path: /products/{id}
    purpose: "Read a product with all derived counters, the provisional conformance index and the current publication posture"
    roles: [AccessibilityLead, AccessibilityTester, ConformanceReviewer, ProductOwner, CustomerLiaison]
    input: []
    output: Product
    status: 200
    side_effects: []

  - method: GET
    path: /products
    purpose: "List products, filterable by standard, posture and readiness"
    roles: [AccessibilityLead, AccessibilityTester, ConformanceReviewer, ProductOwner, CustomerLiaison]
    input: ["standard_id?", "publication_posture?", "assessment_readiness?", "limit?", "offset?"]
    output: Product[]
    status: 200
    side_effects: []

  - method: POST
    path: /products/{id}/recompute-posture
    purpose: "Force a recomputation of every derived Product field and the publication posture (used after the logical clock moves, since clock movement alone performs no writes)"
    roles: [AccessibilityLead]
    input: [reason]
    output: Product
    status: 200
    side_effects:
      - "Recomputes components_in_scope_count, components_complete_count, assessment_readiness, assessed_criteria_count, conformance_index_provisional"
      - "Re-evaluates QuestionnaireResponse.accuracy_status: CURRENT rows whose update_due_at < clock become STALE"
      - "Recomputes stale_questionnaire_count, correction_required_questionnaire_count, overdue_committed_blocker_count, accommodations_fulfilled_count, then publication_posture"
      - "Increments Product.version by 1"

  - method: POST
    path: /products/{id}/components
    purpose: "Add a product component to the assessment inventory with its assessment scope and applicable criteria count"
    roles: [AccessibilityLead]
    input: [name, component_type, in_scope, assessment_scope, applicable_criteria_count, user_reach_pct]
    output: ProductComponent
    status: 201
    side_effects:
      - "assessment_state initialises to PLANNED, design_review_state to NOT_REVIEWED, coverage_pct to 0.00, evidence_units_total to 0, validated_disability_categories to []"
      - "Recomputes Product.components_in_scope_count, assessment_readiness, conformance_index_provisional, publication_posture; increments Product.version by 1"

  - method: GET
    path: /products/{id}/components
    purpose: "List the components of a product, filterable by scope flag and assessment state"
    roles: [AccessibilityLead, AccessibilityTester, ConformanceReviewer, ProductOwner, CustomerLiaison]
    input: ["in_scope?", "assessment_state?", "limit?", "offset?"]
    output: ProductComponent[]
    status: 200
    side_effects: []

  - method: GET
    path: /components/{id}
    purpose: "Read a component with its coverage percentage, validated disability categories and both state dimensions"
    roles: [AccessibilityLead, AccessibilityTester, ConformanceReviewer, ProductOwner, CustomerLiaison]
    input: []
    output: ProductComponent
    status: 200
    side_effects: []

  - method: POST
    path: /components/{id}/design-review
    purpose: "Record the development-lifecycle design review decision and acceptance-criteria sign-off for a component"
    roles: [ConformanceReviewer]
    input: [review_decision, review_note]
    output: ProductComponent
    status: 200
    side_effects:
      - "design_review_state becomes REVIEWED_PASS on PASS and REVIEWED_BLOCKED on BLOCK; design_reviewed_at set to the logical clock"
      - "Leaves assessment_state, coverage_pct and Product.assessment_readiness untouched (the two component dimensions are independent); increments ProductComponent.version by 1 and Product.version by 1"

  # --- Assistive-technology test benches ---
  - method: POST
    path: /test-environments
    purpose: "Register an assistive-technology bench (screen reader, keyboard-only or magnification) with its reconfiguration buffer"
    roles: [AccessibilityLead]
    input: ["name", "at_profile", "at_product_name", "os_platform", "reconfiguration_buffer_minutes?"]
    output: TestEnvironment
    status: 201
    side_effects: []

  - method: GET
    path: /test-environments/{id}
    purpose: "Read one test environment"
    roles: [AccessibilityLead, AccessibilityTester, ConformanceReviewer, ProductOwner, CustomerLiaison]
    input: []
    output: TestEnvironment
    status: 200
    side_effects: []

  # --- Assessment runs (automated and manual testing) ---
  - method: POST
    path: /assessment-runs
    purpose: "Schedule an automated or manual assessment run on a bench, declaring how many criteria it exercises and which disability categories it validates"
    roles: [AccessibilityTester]
    input: [component_id, environment_id, method, at_profile, scheduled_start, scheduled_end, criteria_exercised, disability_categories_validated]
    output: AssessmentRun
    status: 201
    side_effects: ["status initialises to SCHEDULED; no coverage is credited until the run completes"]

  - method: GET
    path: /assessment-runs/{id}
    purpose: "Read one assessment run"
    roles: [AccessibilityLead, AccessibilityTester, ConformanceReviewer, ProductOwner, CustomerLiaison]
    input: []
    output: AssessmentRun
    status: 200
    side_effects: []

  - method: GET
    path: /assessment-runs
    purpose: "List assessment runs, filterable by component, bench, status and method"
    roles: [AccessibilityLead, AccessibilityTester, ConformanceReviewer, ProductOwner, CustomerLiaison]
    input: ["component_id?", "environment_id?", "status?", "method?", "limit?", "offset?"]
    output: AssessmentRun[]
    status: 200
    side_effects: []

  - method: POST
    path: /assessment-runs/{id}/complete
    purpose: "Close out a run with its defect count, crediting its exercised criteria to the component's coverage"
    roles: [AccessibilityTester]
    input: [defects_found]
    output: AssessmentRun
    status: 200
    side_effects:
      - "status becomes COMPLETED, completed_at set to the logical clock"
      - "ProductComponent.evidence_units_total increases by criteria_exercised; for MANUAL runs only, validated_disability_categories unions in disability_categories_validated"
      - "Recomputes ProductComponent.coverage_pct via component_testing_coverage_pct; may move assessment_state PLANNED/IN_TESTING -> COMPLETE"
      - "Recomputes Product.components_complete_count, assessment_readiness, publication_posture; increments ProductComponent.version by 1 and Product.version by 1"

  - method: POST
    path: /assessment-runs/{id}/void
    purpose: "Void a run whose evidence turned out to be unusable, withdrawing its coverage credit"
    roles: [AccessibilityTester]
    input: [void_reason]
    output: AssessmentRun
    status: 200
    side_effects:
      - "status becomes VOID (terminal)"
      - "If the run had been COMPLETED: ProductComponent.evidence_units_total decreases by criteria_exercised and coverage_pct is recomputed"
      - "validated_disability_categories is rebuilt as the union over the component's remaining COMPLETED MANUAL runs"
      - "If coverage_pct falls below MIN_ATTEST_COVERAGE_PCT, ProductComponent.assessment_state reverts COMPLETE -> IN_TESTING and every ATTESTED CriterionAssessment on that component becomes NEEDS_REVALIDATION"
      - "Recomputes Product.components_complete_count, assessed_criteria_count, conformance_index_provisional, assessment_readiness, publication_posture; increments ProductComponent.version by 1 and Product.version by 1"

  # --- Per-criterion conformance authoring ---
  - method: POST
    path: /criterion-assessments
    purpose: "Author a per-criterion support level with explanatory remarks for one component, optimistically locked on the component"
    roles: [AccessibilityTester]
    input: ["component_id", "criterion_id", "support_level", "remarks?", "evidence_run_id?", "expected_component_version"]
    output: CriterionAssessment
    status: 201
    side_effects:
      - "attestation_state initialises to DRAFT; authored_by_user_id records the acting X-User-ID"
      - "Any earlier non-SUPERSEDED assessment for the same (component_id, criterion_id) becomes SUPERSEDED with superseded_by_assessment_id set to the new row"
      - "Recomputes Product.assessed_criteria_count, conformance_index_provisional, publication_posture"
      - "Increments ProductComponent.version by 1 and Product.version by 1"

  - method: GET
    path: /criterion-assessments/{id}
    purpose: "Read one criterion assessment"
    roles: [AccessibilityLead, AccessibilityTester, ConformanceReviewer, ProductOwner, CustomerLiaison]
    input: []
    output: CriterionAssessment
    status: 200
    side_effects: []

  - method: GET
    path: /criterion-assessments
    purpose: "List criterion assessments, filterable by component, criterion, cited evidence run, superseding row and attestation state"
    roles: [AccessibilityLead, AccessibilityTester, ConformanceReviewer, ProductOwner, CustomerLiaison]
    input: ["component_id?", "criterion_id?", "evidence_run_id?", "superseded_by_assessment_id?", "attestation_state?", "limit?", "offset?"]
    output: CriterionAssessment[]
    status: 200
    side_effects: []

  - method: POST
    path: /criterion-assessments/{id}/attest
    purpose: "Attest a drafted criterion assessment as review-grade evidence, subject to segregation of duties, component completeness and evidence freshness"
    roles: [ConformanceReviewer]
    input: [attestation_note]
    output: CriterionAssessment
    status: 200
    side_effects:
      - "attestation_state becomes ATTESTED, attested_at set to the logical clock, attested_by_user_id records the acting X-User-ID"
      - "Recomputes Product.conformance_index_provisional and publication_posture; increments Product.version by 1"

  # --- Conformance reports ---
  - method: POST
    path: /conformance-reports
    purpose: "Open a conformance report for a product against its standard, optimistically locked on the product"
    roles: [AccessibilityLead]
    input: [product_id, standard_id, report_title, expected_product_version]
    output: ConformanceReport
    status: 201
    side_effects: ["state initialises to DRAFT with empty pinned_assessment_ids", "Increments Product.version by 1"]

  - method: GET
    path: /conformance-reports/{id}
    purpose: "Read a conformance report with its pinned evidence, per-criterion snapshot and certified index"
    roles: [AccessibilityLead, AccessibilityTester, ConformanceReviewer, ProductOwner, CustomerLiaison]
    input: []
    output: ConformanceReport
    status: 200
    side_effects: []

  - method: GET
    path: /conformance-reports
    purpose: "List conformance reports, filterable by product, standard, state and superseding report"
    roles: [AccessibilityLead, AccessibilityTester, ConformanceReviewer, ProductOwner, CustomerLiaison]
    input: ["product_id?", "standard_id?", "state?", "superseded_by_report_id?", "limit?", "offset?"]
    output: ConformanceReport[]
    status: 200
    side_effects: []

  - method: POST
    path: /conformance-reports/{id}/submit
    purpose: "Submit a drafted or returned report for reviewer sign-off; only the owning product may submit"
    roles: [ProductOwner]
    input: [submission_note]
    output: ConformanceReport
    status: 200
    side_effects:
      - "state becomes IN_REVIEW; submitted_by_user_id records the acting X-User-ID; submitted_at set to the logical clock"
      - "pinned_assessment_ids and pinned_assessment_versions are left untouched; evidence is pinned later, at approval"

  - method: POST
    path: /conformance-reports/{id}/request-changes
    purpose: "Return a report under review to the authors, clearing the pinned evidence"
    roles: [ConformanceReviewer]
    input: [change_request_note]
    output: ConformanceReport
    status: 200
    side_effects: ["state becomes CHANGES_REQUESTED, from which a fresh submit returns the report to IN_REVIEW", "pinned_assessment_ids and pinned_assessment_versions are cleared to []", "change_request_count increases by 1"]

  - method: POST
    path: /conformance-reports/{id}/approve
    purpose: "Approve a report under review, subject to segregation of duties against the submitter"
    roles: [ConformanceReviewer]
    input: [approval_note]
    output: ConformanceReport
    status: 200
    side_effects:
      - "state becomes APPROVED; approved_by_user_id records the acting X-User-ID; approved_at set to the logical clock"
      - "pinned_assessment_ids and pinned_assessment_versions are frozen from the currently ATTESTED assessments of the product's in-scope components, ordered by CriterionAssessment.created_at ASC"

  - method: POST
    path: /conformance-reports/{id}/publish
    purpose: "Publish an approved report to customers, freezing the certified index and the customer-facing known-issue roadmap"
    roles: [AccessibilityLead]
    input: [publication_channel]
    output: ConformanceReport
    status: 200
    side_effects:
      - "state becomes PUBLISHED; published_at set to the logical clock; conformance_index_certified and criterion_support_snapshot frozen via the CERTIFIED variant"
      - "Every KnownIssue of the product in state COMMITTED with publish_intent INCLUDED becomes PUBLISHED_COMMITTED with public_target_date = target_remediation_date and published_report_id set; published_issue_count records how many"
      - "Any previously PUBLISHED report for the same (product_id, standard_id) becomes SUPERSEDED with superseded_by_report_id set to this report"
      - "Recomputes Product.overdue_committed_blocker_count and publication_posture; a newly overdue published blocker flips the posture to FROZEN"
      - "When the posture becomes FROZEN, every QuestionnaireResponse of the product with accuracy_status CURRENT or STALE becomes CORRECTION_REQUIRED with correction_due_at = clock + CORRECTION_WINDOW_DAYS"
      - "Increments Product.version by 1"

  - method: POST
    path: /conformance-reports/{id}/withdraw
    purpose: "Withdraw an approved or published report, reversing its customer-facing publication effects"
    roles: [AccessibilityLead]
    input: [withdrawal_reason]
    output: ConformanceReport
    status: 200
    side_effects:
      - "state becomes WITHDRAWN (terminal)"
      - "Every KnownIssue whose published_report_id is this report reverts PUBLISHED_COMMITTED -> COMMITTED with public_target_date and published_report_id cleared"
      - "Every QuestionnaireResponse with report_id equal to this report and accuracy_status CURRENT or STALE becomes CORRECTION_REQUIRED with correction_due_at = clock + CORRECTION_WINDOW_DAYS"
      - "Recomputes Product.overdue_committed_blocker_count, correction_required_questionnaire_count and publication_posture; increments Product.version by 1"

  # --- Remediation roadmap: release trains ---
  - method: POST
    path: /release-trains
    purpose: "Create a remediation release train with a delivery window, effort capacity and remediation budget"
    roles: [AccessibilityLead]
    input: ["name", "window_start", "window_end", "freeze_days?", "effort_capacity_points", "remediation_budget_cents"]
    output: ReleaseTrain
    status: 201
    side_effects: ["committed_effort_points initialises to 0, unallocated_cents to remediation_budget_cents, allocation_state to UNALLOCATED"]

  - method: GET
    path: /release-trains/{id}
    purpose: "Read a release train with its committed effort and unallocated budget"
    roles: [AccessibilityLead, AccessibilityTester, ConformanceReviewer, ProductOwner, CustomerLiaison]
    input: []
    output: ReleaseTrain
    status: 200
    side_effects: []

  - method: POST
    path: /release-trains/{id}/allocate-budget
    purpose: "Run the remediation budget waterfall over the train's committed issues for one product, in risk order"
    roles: [AccessibilityLead]
    input: [product_id]
    output: ReleaseTrain
    status: 200
    side_effects:
      - "Each candidate KnownIssue receives funded_cents and a funding_state of FULLY_FUNDED, PARTIALLY_FUNDED or UNFUNDED per remediation_budget_allocation"
      - "unallocated_cents becomes the untouched remainder; allocation_state becomes ALLOCATED"
      - "Invariant: remediation_budget_cents == unallocated_cents + SUM(funded_cents of the train's issues)"

  - method: POST
    path: /release-trains/{id}/deallocate-budget
    purpose: "Reverse a budget allocation for one product, returning every granted cent to the train"
    roles: [AccessibilityLead]
    input: [product_id, reason]
    output: ReleaseTrain
    status: 200
    side_effects:
      - "Each affected KnownIssue.funded_cents resets to 0 and funding_state to UNFUNDED"
      - "unallocated_cents increases by exactly the reclaimed total; allocation_state returns to UNALLOCATED"

  # --- Known issues and remediation roadmap ---
  - method: POST
    path: /known-issues
    purpose: "Log a known accessibility issue against a criterion and component, with severity, effort and a target remediation date"
    roles: [AccessibilityTester, AccessibilityLead]
    input: [product_id, component_id, criterion_id, severity, summary, effort_points, target_remediation_date, publish_intent]
    output: KnownIssue
    status: 201
    side_effects:
      - "state initialises to OPEN; risk_score computed with the INTAKE_ESTIMATE variant and risk_variant set to INTAKE_ESTIMATE"
      - "Recomputes Product.publication_posture and every SUBMITTED or ATTESTED QuestionnaireResponse.disclosure_debt of the product"
      - "Increments Product.version by 1"

  - method: GET
    path: /known-issues/{id}
    purpose: "Read a known issue with its risk score, funding and customer-facing target date"
    roles: [AccessibilityLead, AccessibilityTester, ConformanceReviewer, ProductOwner, CustomerLiaison]
    input: []
    output: KnownIssue
    status: 200
    side_effects: []

  - method: GET
    path: /known-issues
    purpose: "List known issues, filterable by product, component, criterion, train, resolving run, publishing report and state"
    roles: [AccessibilityLead, AccessibilityTester, ConformanceReviewer, ProductOwner, CustomerLiaison]
    input: ["product_id?", "component_id?", "criterion_id?", "release_train_id?", "resolution_run_id?", "published_report_id?", "state?", "limit?", "offset?"]
    output: KnownIssue[]
    status: 200
    side_effects: []

  - method: POST
    path: /known-issues/{id}/triage
    purpose: "Triage an open issue, optionally re-grading its severity, and refresh the intake risk estimate"
    roles: [AccessibilityLead]
    input: ["triage_note", "severity?"]
    output: KnownIssue
    status: 200
    side_effects: ["state becomes TRIAGED; triaged_at set to the logical clock", "risk_score recomputed with the INTAKE_ESTIMATE variant", "Recomputes questionnaire disclosure debt and Product.publication_posture"]

  - method: POST
    path: /known-issues/{id}/board-review
    purpose: "Record the prioritization board decision, switching the issue to the board-review risk variant and either deferring it or leaving it committable"
    roles: [AccessibilityLead]
    input: [board_review_note, defer]
    output: KnownIssue
    status: 200
    side_effects:
      - "risk_score recomputed with the BOARD_REVIEW variant; risk_variant becomes BOARD_REVIEW; board_reviewed_at set to the logical clock"
      - "When defer is true the state becomes DEFERRED and the issue leaves the disclosure-debt input set; when false the state stays TRIAGED"
      - "Recomputes questionnaire disclosure debt and Product.publication_posture"

  - method: POST
    path: /known-issues/{id}/commit
    purpose: "Commit a triaged issue to a release train, consuming train effort capacity"
    roles: [AccessibilityLead]
    input: [release_train_id]
    output: KnownIssue
    status: 200
    side_effects: ["state becomes COMMITTED; release_train_id set", "ReleaseTrain.committed_effort_points increases by effort_points", "Recomputes Product.publication_posture"]

  - method: POST
    path: /known-issues/{id}/resolve
    purpose: "Resolve a committed issue against a completed verification run, releasing its funding and train capacity"
    roles: [AccessibilityTester]
    input: [resolution_note, resolution_run_id]
    output: KnownIssue
    status: 200
    side_effects:
      - "state becomes RESOLVED (terminal); resolved_at set to the logical clock; public_target_date cleared"
      - "funded_cents returns to ReleaseTrain.unallocated_cents and funding_state becomes UNFUNDED; ReleaseTrain.committed_effort_points decreases by effort_points"
      - "Recomputes questionnaire disclosure debt, Product.overdue_committed_blocker_count and publication_posture"

  # --- Customer procurement questionnaires ---
  - method: POST
    path: /questionnaire-responses
    purpose: "Draft a customer procurement questionnaire response citing a conformance report"
    roles: [CustomerLiaison]
    input: [product_id, report_id, customer_name, questionnaire_kind, answers_summary]
    output: QuestionnaireResponse
    status: 201
    side_effects: ["review_status initialises to DRAFT, accuracy_status to CURRENT, disclosure_debt to 0.00, revision_count to 0"]

  - method: GET
    path: /questionnaire-responses/{id}
    purpose: "Read a questionnaire response with its disclosure debt, tier and accuracy status"
    roles: [AccessibilityLead, AccessibilityTester, ConformanceReviewer, ProductOwner, CustomerLiaison]
    input: []
    output: QuestionnaireResponse
    status: 200
    side_effects: []

  - method: GET
    path: /questionnaire-responses
    purpose: "List questionnaire responses, filterable by product, cited report, review status and accuracy status"
    roles: [AccessibilityLead, AccessibilityTester, ConformanceReviewer, ProductOwner, CustomerLiaison]
    input: ["product_id?", "report_id?", "review_status?", "accuracy_status?", "limit?", "offset?"]
    output: QuestionnaireResponse[]
    status: 200
    side_effects: []

  - method: POST
    path: /questionnaire-responses/{id}/submit
    purpose: "Submit a drafted questionnaire response for accuracy attestation, computing its disclosure debt and tier"
    roles: [CustomerLiaison]
    input: []
    output: QuestionnaireResponse
    status: 200
    side_effects: ["review_status becomes SUBMITTED; submitted_at set to the logical clock", "disclosure_debt and disclosure_tier computed via questionnaire_disclosure_debt"]

  - method: POST
    path: /questionnaire-responses/{id}/attest
    purpose: "Attest the accuracy of a submitted response, which requires a published report and an OPEN publication posture, and start the update cadence clock"
    roles: [AccessibilityLead]
    input: [accuracy_attestation]
    output: QuestionnaireResponse
    status: 200
    side_effects:
      - "review_status becomes ATTESTED; last_attested_at set to the logical clock; accuracy_status set to CURRENT; correction_due_at cleared to null"
      - "update_due_at set to last_attested_at + UPDATE_CADENCE_DAYS (90 days)"
      - "disclosure_debt and disclosure_tier recomputed from the new reference timestamp"

  - method: POST
    path: /questionnaire-responses/{id}/revise
    purpose: "Revise the answers of a submitted or attested response, returning it to SUBMITTED for re-attestation"
    roles: [CustomerLiaison]
    input: [answers_summary]
    output: QuestionnaireResponse
    status: 200
    side_effects:
      - "review_status returns to SUBMITTED; revision_count increases by 1; submitted_at set to the logical clock"
      - "accuracy_status returns to CURRENT and both update_due_at and correction_due_at are cleared to null; a FROZEN product can return to RESTRICTED or OPEN through this path"
      - "disclosure_debt and disclosure_tier recomputed; recomputes Product.publication_posture"

  # --- Complaint intake and accommodation requests ---
  - method: POST
    path: /complaints
    purpose: "Record an accessibility complaint or accommodation request from a customer or end user"
    roles: [CustomerLiaison]
    input: ["product_id", "component_id?", "criterion_id?", "channel", "description", "disability_category"]
    output: Complaint
    status: 201
    side_effects: ["state initialises to NEW; route stays null until triage assigns a branch"]

  - method: GET
    path: /complaints/{id}
    purpose: "Read one complaint with its route and linkage"
    roles: [AccessibilityLead, AccessibilityTester, ConformanceReviewer, ProductOwner, CustomerLiaison]
    input: []
    output: Complaint
    status: 200
    side_effects: []

  - method: GET
    path: /complaints
    purpose: "List complaints, filterable by product, component, criterion, linked issue, state and route"
    roles: [AccessibilityLead, AccessibilityTester, ConformanceReviewer, ProductOwner, CustomerLiaison]
    input: ["product_id?", "component_id?", "criterion_id?", "linked_issue_id?", "state?", "route?", "limit?", "offset?"]
    output: Complaint[]
    status: 200
    side_effects: []

  - method: POST
    path: /complaints/{id}/triage
    purpose: "Triage a new complaint onto the remediation branch or the accommodation branch"
    roles: [AccessibilityLead]
    input: ["route", "requested_accommodation?", "needed_by_date?"]
    output: Complaint
    status: 200
    side_effects: ["state becomes TRIAGED; route set to REMEDIATION or ACCOMMODATION; triaged_at set to the logical clock"]

  - method: POST
    path: /complaints/{id}/link-issue
    purpose: "Link a remediation-routed complaint to a known issue, amplifying that issue's board-review risk score"
    roles: [AccessibilityLead]
    input: [known_issue_id]
    output: Complaint
    status: 200
    side_effects:
      - "state becomes LINKED; linked_issue_id set"
      - "KnownIssue.linked_complaint_count increases by 1; when that issue's risk_variant is BOARD_REVIEW its risk_score is recomputed with the complaint amplification factor"
      - "Recomputes Product.publication_posture"

  - method: POST
    path: /complaints/{id}/fulfill-accommodation
    purpose: "Record fulfilment of an accommodation request"
    roles: [CustomerLiaison]
    input: []
    output: Complaint
    status: 200
    side_effects: ["state becomes ACCOMMODATED; accommodation_fulfilled_at set to the logical clock", "Recomputes Product.accommodations_fulfilled_count"]

  - method: POST
    path: /complaints/{id}/close
    purpose: "Close a complaint whose branch has come to rest"
    roles: [AccessibilityLead]
    input: [closure_outcome]
    output: Complaint
    status: 200
    side_effects: ["state becomes CLOSED (terminal); closed_at set to the logical clock"]

  # --- Logical clock ---
  - method: POST
    path: /_clock/set_current_utc
    purpose: "Set the logical current UTC instant used by every temporal rule. The clock defaults to 2026-08-01T00:00:00Z; moving it performs no writes of its own, so derived fields refresh on the next mutating call or via POST /products/{id}/recompute-posture."
    roles: [AccessibilityLead]
    input: [to_iso8601]
    output: "null"
    status: 200
    side_effects: []

# =============================================================================
# §1.6 Error Catalog
# =============================================================================
errors:
  - error_id: ERR_UNAUTHENTICATED
    http_status: 401
    message_template: "Authentication headers are missing or invalid"
    trigger_condition: "X-User-Role or X-User-ID absent, or the role is not one of the five declared roles"
  - error_id: ERR_UNAUTHORIZED
    http_status: 403
    message_template: "Role {role} may not perform this operation"
    trigger_condition: "The acting role is not listed in the endpoint's roles"
  - error_id: ERR_PRODUCT_OWNERSHIP_MISMATCH
    http_status: 403
    message_template: "ProductOwner {user_id} does not own product {product_id}"
    trigger_condition: "A ProductOwner acts on a resource belonging to a different product"
  - error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    message_template: "User {user_id} may not both author and sign off on {entity} {entity_id}"
    trigger_condition: "Attesting reviewer equals the assessment's author, or approving reviewer equals the report's submitter"
  - error_id: ERR_INVALID_REQUEST
    http_status: 400
    message_template: "Request body is invalid: {details}"
    trigger_condition: "Missing required field, wrong type, unknown enum member, out-of-range number, empty or duplicated array, or end before start"
  - error_id: ERR_STANDARD_NOT_FOUND
    http_status: 404
    message_template: "Standard {id} not found"
    trigger_condition: "standard_id in path or body does not resolve"
  - error_id: ERR_CRITERION_NOT_FOUND
    http_status: 404
    message_template: "Success criterion {id} not found"
    trigger_condition: "criterion_id in path or body does not resolve"
  - error_id: ERR_PRODUCT_NOT_FOUND
    http_status: 404
    message_template: "Product {id} not found"
    trigger_condition: "product_id in path or body does not resolve"
  - error_id: ERR_COMPONENT_NOT_FOUND
    http_status: 404
    message_template: "Product component {id} not found"
    trigger_condition: "component_id in path or body does not resolve"
  - error_id: ERR_ENVIRONMENT_NOT_FOUND
    http_status: 404
    message_template: "Test environment {id} not found"
    trigger_condition: "environment_id in path or body does not resolve"
  - error_id: ERR_RUN_NOT_FOUND
    http_status: 404
    message_template: "Assessment run {id} not found"
    trigger_condition: "run id in path, evidence_run_id or resolution_run_id does not resolve"
  - error_id: ERR_ASSESSMENT_NOT_FOUND
    http_status: 404
    message_template: "Criterion assessment {id} not found"
    trigger_condition: "criterion assessment id in path does not resolve"
  - error_id: ERR_REPORT_NOT_FOUND
    http_status: 404
    message_template: "Conformance report {id} not found"
    trigger_condition: "report id in path or report_id in body does not resolve"
  - error_id: ERR_RELEASE_TRAIN_NOT_FOUND
    http_status: 404
    message_template: "Release train {id} not found"
    trigger_condition: "train id in path or release_train_id in body does not resolve"
  - error_id: ERR_KNOWN_ISSUE_NOT_FOUND
    http_status: 404
    message_template: "Known issue {id} not found"
    trigger_condition: "issue id in path or known_issue_id in body does not resolve"
  - error_id: ERR_QUESTIONNAIRE_NOT_FOUND
    http_status: 404
    message_template: "Questionnaire response {id} not found"
    trigger_condition: "questionnaire id in path does not resolve"
  - error_id: ERR_COMPLAINT_NOT_FOUND
    http_status: 404
    message_template: "Complaint {id} not found"
    trigger_condition: "complaint id in path does not resolve"
  - error_id: ERR_STALE_PRODUCT_VERSION
    http_status: 412
    message_template: "Product {product_id} version {expected} no longer current (now {actual})"
    trigger_condition: "expected_product_version does not equal Product.version on POST /conformance-reports"
  - error_id: ERR_STALE_COMPONENT_VERSION
    http_status: 412
    message_template: "Component {component_id} version {expected} no longer current (now {actual})"
    trigger_condition: "expected_component_version does not equal ProductComponent.version on POST /criterion-assessments"
  - error_id: ERR_RUN_NOT_ACTIONABLE
    http_status: 409
    message_template: "Assessment run {id} is {status} and cannot accept this transition"
    trigger_condition: "complete on a non-SCHEDULED run, or void on an already VOID run"
  - error_id: ERR_ASSESSMENT_NOT_DRAFT
    http_status: 409
    message_template: "Criterion assessment {id} is {attestation_state}, not DRAFT"
    trigger_condition: "attest called on an ATTESTED, SUPERSEDED or NEEDS_REVALIDATION assessment"
  - error_id: ERR_REPORT_NOT_SUBMITTABLE
    http_status: 409
    message_template: "Conformance report {id} is {state} and cannot be submitted"
    trigger_condition: "submit called from a state other than DRAFT or CHANGES_REQUESTED"
  - error_id: ERR_REPORT_NOT_IN_REVIEW
    http_status: 409
    message_template: "Conformance report {id} is {state}, not IN_REVIEW"
    trigger_condition: "request-changes or approve called from a state other than IN_REVIEW"
  - error_id: ERR_REPORT_NOT_APPROVED
    http_status: 409
    message_template: "Conformance report {id} is {state}, not APPROVED"
    trigger_condition: "publish called from a state other than APPROVED"
  - error_id: ERR_REPORT_NOT_WITHDRAWABLE
    http_status: 409
    message_template: "Conformance report {id} is {state} and cannot be withdrawn"
    trigger_condition: "withdraw called from a state other than APPROVED or PUBLISHED"
  - error_id: ERR_ISSUE_NOT_OPEN
    http_status: 409
    message_template: "Known issue {id} is {state}, not OPEN"
    trigger_condition: "triage called on an already triaged, deferred, committed or resolved issue"
  - error_id: ERR_ISSUE_NOT_TRIAGED
    http_status: 409
    message_template: "Known issue {id} is {state}, not TRIAGED"
    trigger_condition: "board-review or commit called from a state other than TRIAGED"
  - error_id: ERR_ISSUE_NOT_RESOLVABLE
    http_status: 409
    message_template: "Known issue {id} is {state} and cannot be resolved"
    trigger_condition: "resolve called from a state other than COMMITTED or PUBLISHED_COMMITTED"
  - error_id: ERR_QUESTIONNAIRE_NOT_DRAFT
    http_status: 409
    message_template: "Questionnaire response {id} is {review_status}, not DRAFT"
    trigger_condition: "submit called on an already submitted or attested response"
  - error_id: ERR_QUESTIONNAIRE_NOT_SUBMITTED
    http_status: 409
    message_template: "Questionnaire response {id} is {review_status}, not SUBMITTED"
    trigger_condition: "attest called from a state other than SUBMITTED"
  - error_id: ERR_QUESTIONNAIRE_NOT_REVISABLE
    http_status: 409
    message_template: "Questionnaire response {id} is {review_status} and cannot be revised"
    trigger_condition: "revise called on a DRAFT response"
  - error_id: ERR_COMPLAINT_NOT_NEW
    http_status: 409
    message_template: "Complaint {id} is {state}, not NEW"
    trigger_condition: "triage called on an already triaged, linked, accommodated or closed complaint"
  - error_id: ERR_COMPLAINT_NOT_TRIAGED
    http_status: 409
    message_template: "Complaint {id} is {state}, not TRIAGED"
    trigger_condition: "link-issue or fulfill-accommodation called from a state other than TRIAGED"
  - error_id: ERR_COMPLAINT_NOT_CLOSABLE
    http_status: 409
    message_template: "Complaint {id} is {state} and cannot be closed"
    trigger_condition: "close called from a state other than LINKED or ACCOMMODATED"
  - error_id: ERR_COMPLAINT_ROUTE_MISMATCH
    http_status: 409
    message_template: "Complaint {id} is routed {route}; this action requires {required_route}"
    trigger_condition: "link-issue on an ACCOMMODATION complaint, or fulfill-accommodation on a REMEDIATION complaint"
  - error_id: ERR_TRAIN_BUDGET_ALREADY_ALLOCATED
    http_status: 409
    message_template: "Release train {id} has already allocated its remediation budget"
    trigger_condition: "allocate-budget called while allocation_state is ALLOCATED"
  - error_id: ERR_TRAIN_BUDGET_NOT_ALLOCATED
    http_status: 409
    message_template: "Release train {id} has no allocation to reverse"
    trigger_condition: "deallocate-budget called while allocation_state is UNALLOCATED"
  - error_id: ERR_PRODUCT_POSTURE_FROZEN
    http_status: 409
    message_template: "Product {id} publication posture is FROZEN"
    trigger_condition: "Report publication, questionnaire attestation, design review or budget allocation attempted on a FROZEN product"
  - error_id: ERR_PRODUCT_POSTURE_NOT_OPEN
    http_status: 409
    message_template: "Product {id} publication posture is {posture}, not OPEN"
    trigger_condition: "Questionnaire accuracy attestation attempted while the posture is RESTRICTED"
  - error_id: ERR_COMPONENT_ASSESSMENT_INCOMPLETE
    http_status: 409
    message_template: "Component {id} assessment state is {assessment_state}, not COMPLETE"
    trigger_condition: "attest attempted while the component's testing coverage has not reached MIN_ATTEST_COVERAGE_PCT"
  - error_id: ERR_PINNED_ASSESSMENT_CHANGED
    http_status: 409
    message_template: "Pinned assessment {assessment_id} changed after submission"
    trigger_condition: "A pinned assessment's version differs from the pinned version, or it is no longer ATTESTED, at publication time"
  - error_id: ERR_REPORT_NOT_PUBLISHED
    http_status: 409
    message_template: "Cited conformance report {id} is {state}, not PUBLISHED"
    trigger_condition: "Questionnaire attestation citing a report that has not been published"
  - error_id: ERR_LINKED_ISSUE_UNRESOLVED
    http_status: 409
    message_template: "Linked known issue {id} is {state}; it must be RESOLVED or DEFERRED before closure"
    trigger_condition: "close called on a REMEDIATION complaint whose linked issue is still open work"
  - error_id: ERR_ENVIRONMENT_WINDOW_CONFLICT
    http_status: 409
    message_template: "Test environment {id} is occupied until {busy_until}"
    trigger_condition: "A new run's half-open window intersects an existing run's window extended by the bench's reconfiguration buffer"
  - error_id: ERR_TRAIN_WINDOW_ADJACENT
    http_status: 409
    message_template: "Release train window touches or overlaps train {id}"
    trigger_condition: "A new train's closed window overlaps an existing window or abuts it with a zero-day gap"
  - error_id: ERR_TRAIN_CAPACITY_EXCEEDED
    http_status: 409
    message_template: "Release train {id} has {remaining} effort points remaining, {requested} requested"
    trigger_condition: "committed_effort_points + effort_points would exceed effort_capacity_points"
  - error_id: ERR_REPORT_ALREADY_OPEN
    http_status: 409
    message_template: "Product {product_id} already has an open report {report_id} for standard {standard_id}"
    trigger_condition: "A second report is opened for the same product and standard while one is DRAFT, IN_REVIEW, CHANGES_REQUESTED or APPROVED"
  - error_id: ERR_DUPLICATE_STANDARD_CODE
    http_status: 409
    message_template: "Standard code {code} already registered"
    trigger_condition: "POST /standards with an existing code"
  - error_id: ERR_DUPLICATE_CRITERION_NUMBER
    http_status: 409
    message_template: "Criterion {criterion_number} already exists on standard {standard_id}"
    trigger_condition: "POST /standards/{id}/criteria with a duplicate criterion_number"
  - error_id: ERR_DUPLICATE_COMPONENT_NAME
    http_status: 409
    message_template: "Component name {name} already used on product {product_id}"
    trigger_condition: "POST /products/{id}/components with a duplicate name"
  - error_id: ERR_DUPLICATE_ENVIRONMENT_NAME
    http_status: 409
    message_template: "Test environment name {name} already registered"
    trigger_condition: "POST /test-environments with a duplicate name"
  - error_id: ERR_DUPLICATE_TRAIN_NAME
    http_status: 409
    message_template: "Release train name {name} already registered"
    trigger_condition: "POST /release-trains with a duplicate name"
  - error_id: ERR_DISABILITY_COVERAGE_GAP
    http_status: 422
    message_template: "Component {component_id} has not validated disability categories {missing}"
    trigger_condition: "At publication an in-scope component lacks assistive-technology validation for a disability category required by the in-scope criteria"
  - error_id: ERR_DESIGN_REVIEW_INCOMPLETE
    http_status: 422
    message_template: "Component {component_id} design review state is {design_review_state}"
    trigger_condition: "At publication an in-scope component is not REVIEWED_PASS"
  - error_id: ERR_REMARKS_REQUIRED
    http_status: 422
    message_template: "Explanatory remarks of at least 10 characters are required for support level {support_level}"
    trigger_condition: "A criterion assessment with support_level other than SUPPORTS omits remarks or supplies fewer than 10 characters"
  - error_id: ERR_EXERCISED_EXCEEDS_SCOPE
    http_status: 422
    message_template: "criteria_exercised {value} exceeds component applicable_criteria_count {limit}"
    trigger_condition: "A run claims to exercise more criteria than the component has in scope"
  - error_id: ERR_ASSESSMENT_EVIDENCE_EXPIRED
    http_status: 422
    message_template: "Criterion assessment {id} evidence is older than 90 days"
    trigger_condition: "attest called more than EVIDENCE_MAX_AGE_DAYS after the assessment was authored"
  - error_id: ERR_TARGET_DATE_OUTSIDE_TRAIN_WINDOW
    http_status: 422
    message_template: "Target remediation date {date} is outside the usable window of train {train_id}"
    trigger_condition: "commit with a target_remediation_date before window_start or after window_end minus freeze_days"
  - error_id: ERR_ACCOMMODATION_DATE_IN_PAST
    http_status: 422
    message_template: "needed_by_date {date} is before the current date"
    trigger_condition: "Accommodation triage with a needed_by_date in the past"
  - error_id: ERR_NO_IN_SCOPE_COMPONENTS
    http_status: 422
    message_template: "Product {id} has no in-scope components to certify"
    trigger_condition: "publish attempted while components_in_scope_count is 0"
  - error_id: ERR_NO_FUNDABLE_ISSUES
    http_status: 422
    message_template: "Release train {id} has no committed issues for product {product_id}"
    trigger_condition: "allocate-budget with an empty candidate set"
  - error_id: ERR_CRITERION_STANDARD_MISMATCH
    http_status: 422
    message_template: "Criterion {criterion_id} does not belong to standard {standard_id}"
    trigger_condition: "A criterion from another standard is cited for a product's assessment, issue or complaint"
  - error_id: ERR_REPORT_STANDARD_MISMATCH
    http_status: 422
    message_template: "Report standard {standard_id} does not match product standard {product_standard_id}"
    trigger_condition: "POST /conformance-reports with a standard other than the product's own"
  - error_id: ERR_ENVIRONMENT_PROFILE_MISMATCH
    http_status: 422
    message_template: "Run profile {at_profile} does not match environment profile {environment_profile}"
    trigger_condition: "A run declares an assistive-technology profile the bench does not provide"
  - error_id: ERR_CROSS_PRODUCT_REFERENCE
    http_status: 422
    message_template: "{entity} {id} belongs to a different product"
    trigger_condition: "A component, report or known issue from another product is referenced"
  - error_id: ERR_RESOLUTION_EVIDENCE_INVALID
    http_status: 422
    message_template: "Run {run_id} cannot evidence resolution of issue {issue_id}"
    trigger_condition: "resolution_run_id names a run that is not COMPLETED or belongs to another component"
  - error_id: ERR_LEVEL_OR_SURFACE_UNSUPPORTED
    http_status: 422
    message_template: "Level {level} or surface {surface} is not supported by standard {standard_id}"
    trigger_condition: "A criterion level or product target level exceeds max_target_level, or the product surface is outside the standard's surface scope"

# =============================================================================
# §1.7 RBAC Table
# =============================================================================
roles:
  - role: AccessibilityLead
    identity: opaque
    description: "Programme owner. Configures standards, criteria, products, components, benches and release trains; runs the remediation roadmap and publishes reports; attests questionnaire accuracy; owns the logical clock."
    exclusive_operations:
      - "POST /standards"
      - "POST /standards/{id}/criteria"
      - "POST /products"
      - "POST /products/{id}/recompute-posture"
      - "POST /products/{id}/components"
      - "POST /test-environments"
      - "POST /conformance-reports"
      - "POST /conformance-reports/{id}/publish"
      - "POST /conformance-reports/{id}/withdraw"
      - "POST /release-trains"
      - "POST /release-trains/{id}/allocate-budget"
      - "POST /release-trains/{id}/deallocate-budget"
      - "POST /known-issues/{id}/triage"
      - "POST /known-issues/{id}/board-review"
      - "POST /known-issues/{id}/commit"
      - "POST /questionnaire-responses/{id}/attest"
      - "POST /complaints/{id}/triage"
      - "POST /complaints/{id}/link-issue"
      - "POST /complaints/{id}/close"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /known-issues (shared with AccessibilityTester)"
      - "All GET endpoints"

  - role: AccessibilityTester
    identity: opaque
    description: "Performs automated and manual assistive-technology testing, authors per-criterion support levels, and verifies fixes. May never attest its own work."
    exclusive_operations:
      - "POST /assessment-runs"
      - "POST /assessment-runs/{id}/complete"
      - "POST /assessment-runs/{id}/void"
      - "POST /criterion-assessments"
      - "POST /known-issues/{id}/resolve"
    shared_operations:
      - "POST /known-issues (shared with AccessibilityLead)"
      - "All GET endpoints"

  - role: ConformanceReviewer
    identity: opaque
    description: "Independent reviewer. Signs off design reviews, attests criterion assessments authored by others, and reviews conformance reports submitted by others."
    exclusive_operations:
      - "POST /components/{id}/design-review"
      - "POST /criterion-assessments/{id}/attest"
      - "POST /conformance-reports/{id}/request-changes"
      - "POST /conformance-reports/{id}/approve"
    shared_operations:
      - "All GET endpoints"

  - role: ProductOwner
    identity: "entity_backed:Product"
    description: "Accountable owner of one product; X-User-ID is that Product.id. Submits its own product's conformance report for review and may not touch another product's report."
    exclusive_operations:
      - "POST /conformance-reports/{id}/submit"
    shared_operations:
      - "All GET endpoints"

  - role: CustomerLiaison
    identity: opaque
    description: "Customer-facing role. Drafts, submits and revises procurement questionnaire responses, takes complaint and accommodation intake, and records accommodation fulfilment."
    exclusive_operations:
      - "POST /questionnaire-responses"
      - "POST /questionnaire-responses/{id}/submit"
      - "POST /questionnaire-responses/{id}/revise"
      - "POST /complaints"
      - "POST /complaints/{id}/fulfill-accommodation"
    shared_operations:
      - "All GET endpoints"
