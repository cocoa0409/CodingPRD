              captures: { round_2: $.data.id }
          assert:
            - "the first create returns HTTP 201 with AllocationRound.${round_1}.status == DRAFTING, round_number == 1 and share_count == 2"
            - "the second create carrying the now-stale ${site_v} returns HTTP 412 with $.data.error_id == ERR_STALE_SITE_VERSION"
            - "the refusal changes nothing: AllocationRound.${round_1}.status is still DRAFTING and GET /sites/${site_id}/allocation-rounds still reports total_count 1"
            - "the re-read version ${site_v2} is strictly greater than ${site_v} - the round create incremented Site.version - and the retried create returns HTTP 201"
            - "AllocationRound.${round_2}.round_number == 2 with status DRAFTING, and ${round_1} has been superseded to SUPERSEDED, which is exactly the destructive outcome the 412 forced the client to opt into"
            - "the priority-7 check runs before the priority-31 weight check: both retried payloads sum to 10000 bp, so the 412 cannot be confused with a normalisation refusal"

