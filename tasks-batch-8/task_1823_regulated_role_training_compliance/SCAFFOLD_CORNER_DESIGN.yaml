        claim_type: violation_to_error
        grounds:
          - "errors[ERR_ATTESTATION_NOT_ACTIONABLE]"
          - "state_machines.Attestation"
          - "calculations.posture_block_evaluation"
        distinguishing_aspect: "A BLOCKED attestation (HARD escalation cascaded) rejects attest with the same state error, and the block is attributable to the employee's compliance_blocked flag."
        test_recipe:
          setup: ["Clock 2026-08-03T09:00:00Z; regulator REG-BA (interval 10, reminder 7); curriculum CUR-BA ACTIVE; role R-BA with HARD req due_in_days 2; employee E-BA with assignment due 2026-08-05T09:00:00Z; campaign CMP-BA OPEN with PENDING attestation ATT"]
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /compliance/regulators", payload: { code: "REG-BA", name: "BA Regulator", deadline_mode: "CALENDAR", recordkeeping_years: 7, escalation_interval_days: 10, reminder_days_before_due: 7 }, as: ComplianceAdmin, captures: { reg_id: "$.data.id" } }
            - { call: "POST /compliance/curricula", payload: { regulator_id: "${reg_id}", code: "CUR-BA", title: "BA Course", passing_score_pct: 80, validity_months: 12, evidence_requirement: "NONE" }, as: ComplianceAdmin, captures: { cur_id: "$.data.id", cur_v: "$.data.version" } }
