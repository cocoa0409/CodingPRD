              as: CommunityManager
              payload: { attending_owner_ids: ["${dir1}"] }
          trigger:
            - call: "POST /budgets/${budget1}/ratify"
              as: BoardDirector
              as_user_id: "${dir1}"
              payload: {}
          assert:
            - "HTTP 200 and the response body already contains status \"ADOPTED\", adopted_at \"2026-09-01T10:00:00Z\", assessment_total_cents 13200000, monthly_assessable_cents 1100000 and revision_round 0"
            - "the same response body's allocation_snapshot lists both units at 550000 with remainder_cent_awarded false and sums to 1100000"
            - "a GET /budgets/${budget1} issued immediately afterwards is byte-identical on those fields — no lag, no recomputation difference"
            - "GET /units/${unit1} and GET /units/${unit2} both already return monthly_assessment_cents == 550000"

      - name: payment_response_already_shows_the_re_derived_delinquency_posture
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.late_fee_and_delinquency_ladder
          - endpoints[POST /units/{unit_id}/payments]
        distinguishing_aspect: "The posture derived fields must move inside the writing request: the payment response itself reports balance_due_cents 0, delinquency_stage \"CURRENT\" and voting_eligible true — a design that leaves the unit reading LIEN_FILED until the next read or the next billing run fails the immediate model."
        test_recipe:
          setup:
            - "Unit 101 with a 200000-cent charge due 2026-04-01 at clock 2026-08-01, i.e. LIEN_FILED with voting_eligible false."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              as: CommunityManager
              payload: { current_utc: "2026-08-01T00:00:00Z" }
            - call: "POST /associations"
              as: CommunityManager
              payload: { legal_name: "Harbor Point Condominium Association" }
              captures: { assoc: "$.data.id" }
            - call: "POST /associations/${assoc}/owners"
              as: CommunityManager
              payload: { full_name: "Owen Pratt", email: "owen@example.com" }
              captures: { owner1: "$.data.id" }
            - call: "POST /associations/${assoc}/units"
              as: CommunityManager
              payload: { current_owner_id: "${owner1}", unit_label: "101", interest_bp: 10000, heated_sqft: 1000 }
              captures: { unit1: "$.data.id" }
            - call: "POST /units/${unit1}/charges"
              as: CommunityManager
              payload: { entry_type: "COLLECTION_COST", amount_cents: 200000, due_on: "2026-04-01T00:00:00Z", effective_period: "2026-04", memo: "collection counsel" }
          trigger:
            - call: "POST /units/${unit1}/payments"
              as: UnitOwner
              as_user_id: "${owner1}"
              payload: { amount_cents: 200000, effective_period: "2026-08", memo: "payoff" }
          assert:
            - "HTTP 201 and the response already reflects the unit's re-derived posture: balance_due_cents 0, delinquency_stage \"CURRENT\", voting_eligible true and lien_recorded_at cleared per the ladder"
            - "an immediately following GET /units/${unit1}/statement as UnitOwner ${owner1} agrees: balance_due_cents 0 over two rows (+200000 COLLECTION_COST, -200000 PAYMENT)"
            - "the unit version advanced by exactly 1 across the payment, so an OCC token read before the payment is already stale for POST /units/${unit1}/resale-certificates"
