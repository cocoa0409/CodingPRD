      - name: unknown_role_header_unauthorized
        claim_type: unauthorized_operation
        grounds:
          - validations.priority_1
          - validations.priority_2
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: |
          An X-Role value outside the seven declared roles is a 403
          ERR_UNAUTHORIZED at priority 1/2 — before existence, before payload
          shape and before any business rule — so a request naming a nonexistent
          licensee id with a bogus role still answers 403, never 404 or 422.
        test_recipe:
          setup:
            - "clock at the mandatory default 2026-08-01T00:00:00Z"
            - "the seven declared roles are LeagueLicensingManager, MarkComplianceOfficer, FinanceController, RoyaltyAuditor, Licensee, ClubRepresentative and PlayerAgent"
          setup_api_calls:
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
          trigger:
            - call: "GET /licensing/licensees/11111111-1111-1111-1111-111111111111"
              as: LicensingIntern
              as_user_id: "u_intern_1"
          assert:
            - "the request is sent with header X-Role: LicensingIntern, which is not one of the seven declared roles"
            - "response status is 403 with data.error_id == 'ERR_UNAUTHORIZED'"
            - "the response is NOT 404 ERR_LICENSEE_NOT_FOUND even though the id does not exist — authorization precedes existence"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: stale_expected_agreement_version_on_report_create_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.report-create-stale-agreement
          - validations.priority_11
          - errors.ERR_STALE_AGREEMENT_VERSION
        distinguishing_aspect: |
          The agreement's version moves for reasons the reporting licensee never
          sees: accepting the 2026Q1 report writes the ledger and bumps it. A
          2026Q2 create that replays the version captured before that acceptance is
          a 412 ERR_STALE_AGREEMENT_VERSION, and re-reading the agreement makes the
          identical payload succeed. The OCC check runs at priority 11, ahead of
          the duplicate-period and term checks.
        test_recipe:
          setup:
            - "clock at the mandatory default 2026-08-01T00:00:00Z"
            - "licensee LIC_Q3 ACTIVE with an ACTIVE agreement AGR_Q3 and an AUTHORIZED DEPARTMENT authorization"
            - "the agreement version is captured, then a 2026Q1 report of gross 1000000 is filed and ACCEPTED, which bumps that version"
          setup_api_calls:
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "POST /licensing/product-categories"
              payload: { category_code: "JERSEY", display_name: "JERSEY products", base_royalty_rate_bps: 1200, tier_schedule: [{ from_cents: 0, to_cents: 2000000, rate_bps: 1200 }, { from_cents: 2000000, to_cents: 5000000, rate_bps: 1000 }, { from_cents: 5000000, to_cents: null, rate_bps: 800 }], closeout_rate_bps: 500, exclusivity_allowed: true, minimum_guarantee_floor_cents: 1000000, mark_usage_class: "LEAGUE_CLUB_AND_PLAYER", closeout_cap_pct_bps: 1500, closeout_hard_limit_bps: 4000, deduction_cap_pct_bps: 500, deduction_hard_limit_bps: 2000, advance_floor_bps_of_mg: 2500, central_licensing_default: true }
