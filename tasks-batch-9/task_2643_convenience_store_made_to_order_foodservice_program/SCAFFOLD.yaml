scenario: |
  Generate task harder than expert level!

  2643. Convenience-Store Made-to-Order Foodservice Program (Wawa): touchscreen order capture with
  build customization and modifier pricing, kitchen sequencing across sandwich, beverage and hot-food
  stations, par-baked and hot-case production planning with hold times and discard logs, fresh-food
  waste tracking and daypart menu transitions, fuel-and-food combined promotions and loyalty points,
  food-safety temperature logging and health inspection readiness, labor scheduling to forecast
  transaction counts by hour, catering trays and pre-order pickup windows

domain_name: convenience-store-foodservice-program
api_prefix: "/"

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
    - derived_field_reconciliation
    - pagination_with_filtering

  entity_topology: graph
  # Store, MenuItem, LoyaltyAccount and HoldingUnit are peer roots; Order/OrderLine/KitchenTicket/
  # ProductionBatch form a many-to-many fulfilment mesh (an OrderLine of a PAR_BAKED_CASE item points
  # at a ProductionBatch that belongs to a different root than the Order's store hierarchy), and
  # TemperatureLog -> CorrectiveAction -> HoldingUnit closes a cycle back onto the unit that produced
  # the reading. URL paths are therefore mostly flat with FK bodies, not a single nesting tree.

  state_machine_shape: parallel
  # Order carries two INDEPENDENT axes on one row: production_status (DRAFT..PICKED_UP/VOIDED) and
  # settlement_status (UNPAID..REFUNDED/RELEASED). KitchenTicket is cyclic (DONE -> IN_PROGRESS via
  # rework reopen), ProductionBatch is cyclic (HOLDING -> BAKING via top-off bake), HoldingUnit is
  # cyclic (OPERATIONAL -> IMPAIRED -> OPERATIONAL). StaffingPlan and CorrectiveAction are linear.

  relationship_patterns:
    - one_to_many        # Store -> HoldingUnit / StaffingPlan / Order / ProductionBatch
    - many_to_many       # OrderLine <-> ProductionBatch fulfilment (a batch serves lines of many orders)
    - cross_aggregate    # Order placement reads StaffingPlan; ProductionBatch pull reads HoldingUnit
    - polymorphic        # WasteLog.reason distinguishes operator-driven vs system-cascade provenance

  role_model: segregation_of_duties
  # The associate who recorded a temperature reading may not verify its CorrectiveAction, and the
  # associate who completed a KitchenTicket may not be the actor who reopens it for rework.

  consistency_model: immediate

  difficulty_level: beyond_expert
  # 15 entities / 58 endpoints / 60 error codes / 17 calculations / 7 state machines / 2 OCC rules.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

global_conventions:
  logical_clock:
    default: "2026-08-01T00:00:00Z"
    note: |
      All time-dependent behaviour (hold expiry, pickup windows, fuel look-back, temperature-log
      compliance, service_date) reads the logical clock, never wall-clock time. Before any
      POST /_clock/set_current_utc the clock reads exactly 2026-08-01T00:00:00Z. The clock is
      monotonic non-decreasing: a set to an earlier instant is rejected with ERR_CLOCK_REGRESSION.
  daypart_windows:
    note: "Evaluated on the logical clock's UTC time-of-day, half-open [start, end)."
    BREAKFAST: "[04:00:00, 11:00:00)"
    LUNCH: "[11:00:00, 16:00:00)"
    DINNER: "[16:00:00, 22:00:00)"
    OVERNIGHT: "[22:00:00, 24:00:00) union [00:00:00, 04:00:00)"
  daypart_authority: |
    Store.current_daypart is OPERATIONAL state, not a derived clock read. It starts at BREAKFAST and
    changes ONLY through POST /stores/{id}/daypart-transitions. Every menu-eligibility, promotion and
    staffing-plan lookup compares against Store.current_daypart, never against the clock directly.
    The clock only gates whether a requested transition is due.
  money: "All monetary amounts are integer cents. No floats are persisted."
  rounding: "round_half_up on the absolute value, to whole cents / whole integers, unless stated."

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Store
    parent: null
    common_fields: true
    fields:
      - name: store_code
        type: string
        source: input
        description: chain-unique site code
        constraints: "unique across Store; 1-16 chars; ERR_DUPLICATE_CODE on collision"
      - name: name
        type: string
        source: input
        description: site display name
      - name: is_fuel_site
        type: boolean
        source: input
        description: whether the site sells fuel (gates FUEL_FOOD_COMBO promotions at this store)
        default: true
      - name: current_daypart
        type: enum
        source: system
        description: operational daypart driving menu eligibility, promotions and plan lookup
        default: BREAKFAST
        constraints: "one of {BREAKFAST, LUNCH, DINNER, OVERNIGHT}; changed only by POST /stores/{id}/daypart-transitions"
      - name: daypart_epoch
        type: integer
        source: system
        description: monotonic counter incremented by every accepted daypart transition; stamped onto WasteLog rows
        default: 0
      - name: hot_case_slot_capacity
        type: integer
        source: input
        description: maximum number of ProductionBatch rows this store may hold in status BAKING or HOLDING at once
        constraints: ">= 1"
      - name: hot_case_slots_used
        type: integer
        source: computed
        description: "count of ProductionBatch with store_id == this.id and status IN {BAKING, HOLDING}"
        default: 0
      - name: pickup_slot_capacity
        type: integer
        source: input
        description: maximum number of other in-flight pre-order/catering Orders whose pickup window may overlap a new one
        constraints: ">= 1"
      - name: waste_cost_cents_mtd
        type: integer
        source: computed
        description: "running sum of WasteLog.food_cost_cents for batches of this store (FOOD_COST variant of waste_valuation)"
        default: 0
      - name: rework_waste_cents_mtd
        type: integer
        source: computed
        description: "running sum of made-to-order rework food cost booked by KitchenTicket reopen (FOOD_COST variant, no WasteLog row)"
        default: 0

  - name: HoldingUnit
    parent: Store
    common_fields: true
    fields:
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; the site this unit lives in"
      - name: unit_code
        type: string
        source: input
        description: unit label on the floor plan
        constraints: "unique per store_id; ERR_DUPLICATE_CODE on collision"
      - name: unit_type
        type: enum
        source: input
        description: equipment class
        constraints: "one of {HOT_CASE, COLD_CASE, BAKERY_CASE}"
      - name: min_temp_f
        type: number
        source: input
        description: inclusive lower bound of the safe holding band in degrees F
      - name: max_temp_f
        type: number
        source: input
        description: inclusive upper bound of the safe holding band in degrees F
        constraints: "must be > min_temp_f"
      - name: slot_count
        type: integer
        source: input
        description: number of independently schedulable pan slots in this unit
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: food-safety posture gating every batch operation targeting this unit
        default: OPERATIONAL
        constraints: "one of {OPERATIONAL, IMPAIRED, LOCKED_OUT}"
      - name: consecutive_out_of_range_count
        type: integer
        source: computed
        description: number of consecutive TemperatureLog rows with in_range false since the last verified CorrectiveAction
        default: 0
      - name: last_temp_log_at
        type: datetime
        source: computed
        description: recorded_at of the newest TemperatureLog for this unit; null before the first reading
        default: null

  - name: MenuItem
    parent: null
    common_fields: true
    fields:
      - name: sku
        type: string
        source: input
        description: chain-unique menu SKU
        constraints: "unique across MenuItem; ERR_DUPLICATE_CODE on collision"
      - name: name
        type: string
        source: input
        description: menu display name
      - name: station
        type: enum
        source: input
        description: kitchen station that produces this item
        constraints: "one of {SANDWICH, BEVERAGE, HOT_FOOD, BAKERY}"
      - name: fulfillment_mode
        type: enum
        source: input
        description: MADE_TO_ORDER items generate KitchenTicket work; PAR_BAKED_CASE items are reserved out of a ProductionBatch
        constraints: "one of {MADE_TO_ORDER, PAR_BAKED_CASE}"
      - name: base_price_cents
        type: integer
        source: input
        description: menu retail price of one unit before modifiers
        constraints: ">= 0"
      - name: unit_food_cost_cents
        type: integer
        source: input
        description: ingredient cost of one unit; the FOOD_COST basis of waste_valuation
        constraints: ">= 0 and <= base_price_cents"
      - name: prep_seconds
        type: integer
        source: input
        description: hands-on make time for one unit at its station (0 for PAR_BAKED_CASE items)
        default: 0
      - name: bake_minutes
        type: integer
        source: input
        description: oven time for one production batch of this item (0 for MADE_TO_ORDER items)
        default: 0
      - name: hold_minutes
        type: integer
        source: input
        description: maximum safe hot-case hold duration once a batch is pulled
        default: 0
      - name: valid_dayparts
        type: array
        source: input
        description: dayparts in which this item may be ordered
        constraints: "non-empty subset of {BREAKFAST, LUNCH, DINNER, OVERNIGHT}"
      - name: included_premium_count
        type: integer
        source: input
        description: number of is_premium modifiers included per unit before PREMIUM_SURCHARGE_CENTS applies
        default: 0
      - name: is_catering_eligible
        type: boolean
        source: input
        description: whether this item may appear on a CATERING channel order
        default: false

  - name: ModifierOption
    parent: MenuItem
    common_fields: false
    fields:
      - name: menu_item_id
        type: string
        source: input
        description: "FK -> MenuItem.id; the build this option belongs to"
      - name: code
        type: string
        source: input
        description: option code
        constraints: "unique per menu_item_id; ERR_DUPLICATE_CODE on collision"
      - name: modifier_class
        type: enum
        source: input
        description: build slot this option occupies
        constraints: "one of {BREAD, PROTEIN, CHEESE, TOPPING, PREP, SIZE}"
      - name: price_delta_cents
        type: integer
        source: input
        description: per-unit price added to the line's unit price for each unit of this option
        constraints: ">= 0"
      - name: is_premium
        type: boolean
        source: input
        description: whether this option counts against MenuItem.included_premium_count
        default: false
      - name: max_qty
        type: integer
        source: input
        description: maximum qty of this option permitted on one order line
        default: 1
        constraints: ">= 1"

  - name: PromotionRule
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: chain-unique promotion code
        constraints: "unique across PromotionRule; ERR_DUPLICATE_CODE on collision"
      - name: kind
        type: enum
        source: input
        description: FUEL_FOOD_COMBO additionally requires recent fuel gallons on the order's loyalty account
        constraints: "one of {FUEL_FOOD_COMBO, DAYPART_BUNDLE}"
      - name: discount_kind
        type: enum
        source: input
        description: PCT_PER_LINE discounts each eligible line and sums; CENTS_OFF discounts the order once
        constraints: "one of {PCT_PER_LINE, CENTS_OFF}"
      - name: discount_bp
        type: integer
        source: input
        description: basis points off each eligible line; required when discount_kind == PCT_PER_LINE
        default: 0
        constraints: "0..10000"
      - name: discount_cents
        type: integer
        source: input
        description: flat cents off the order; required when discount_kind == CENTS_OFF
        default: 0
        constraints: ">= 0"
      - name: max_discount_cents
        type: integer
        source: input
        description: hard cap applied to the rule's computed discount
        constraints: ">= 0"
      - name: min_food_subtotal_cents
        type: integer
        source: input
        description: minimum Order.subtotal_gross_cents required for eligibility (compared with >=)
        default: 0
      - name: requires_fuel_gallons
        type: number
        source: input
        description: minimum fuel_gallons_30d on the order's loyalty account (compared with >=); only meaningful for FUEL_FOOD_COMBO
        default: 0
      - name: target_station
        type: enum
        source: input
        description: which lines PCT_PER_LINE applies to; ALL means every line
        default: ALL
        constraints: "one of {SANDWICH, BEVERAGE, HOT_FOOD, BAKERY, ALL}"
      - name: valid_dayparts
        type: array
        source: input
        description: dayparts in which this rule is eligible, compared against Store.current_daypart
        constraints: "non-empty subset of {BREAKFAST, LUNCH, DINNER, OVERNIGHT}"
      - name: stacking_rank
        type: integer
        source: input
        description: first tie-break of promotion_selection; lower rank wins
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: only ACTIVE rules enter the promotion_selection candidate set
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED}; SUSPENDED produced by POST /promotion-rules/{id}/suspend"

  - name: LoyaltyAccount
    parent: null
    common_fields: true
    fields:
      - name: member_code
        type: string
        source: input
        description: chain-unique loyalty member code
        constraints: "unique across LoyaltyAccount; ERR_DUPLICATE_CODE on collision"
      - name: email
        type: string
        source: input
        description: member contact email
      - name: points_balance
        type: integer
        source: computed
        description: "spendable points; invariant points_balance == lifetime_points_earned - lifetime_points_redeemed - points_reversed_total"
        default: 0
      - name: lifetime_points_earned
        type: integer
        source: computed
        description: cumulative points ever accrued (provisional accruals plus settlement deltas); never decreases
        default: 0
      - name: lifetime_points_redeemed
        type: integer
        source: computed
        description: cumulative points removed by negative points-adjustments
        default: 0
      - name: points_reversed_total
        type: integer
        source: computed
        description: cumulative points clawed back by order refunds
        default: 0
      - name: tier
        type: enum
        source: computed
        description: "derived from lifetime_points_earned: BASIC < 500, PLUS 500..1999, ELITE >= 2000"
        default: BASIC
        constraints: "one of {BASIC, PLUS, ELITE}"

  - name: FuelTransaction
    parent: LoyaltyAccount
    common_fields: false
    fields:
      - name: loyalty_account_id
        type: string
        source: input
        description: "FK -> LoyaltyAccount.id; the member who fuelled"
      - name: gallons
        type: number
        source: input
        description: gallons dispensed, 3 decimal places
        constraints: "> 0"
      - name: price_per_gallon_cents
        type: integer
        source: input
        description: posted price per gallon in cents
        constraints: "> 0"
      - name: occurred_at
        type: datetime
        source: input
        description: when the fuel sale happened; drives the fuel_gallons_30d look-back window
      - name: fuel_spend_cents
        type: integer
        source: computed
        description: "round_half_up(gallons * price_per_gallon_cents)"

  - name: Order
    parent: Store
    common_fields: true
    fields:
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; the site fulfilling this order"
      - name: loyalty_account_id
        type: string
        source: input
        description: "FK -> LoyaltyAccount.id; null for an anonymous walk-in touchscreen order"
        default: null
      - name: channel
        type: enum
        source: input
        description: capture channel; drives pickup-window rules, catering rules and service fee
        constraints: "one of {TOUCHSCREEN, MOBILE_PREORDER, CATERING}"
      - name: production_status
        type: enum
        source: system
        description: kitchen/fulfilment axis; evolves independently of settlement_status
        default: DRAFT
        constraints: "one of {DRAFT, PLACED, IN_PRODUCTION, ASSEMBLED, READY, PICKED_UP, VOIDED}"
      - name: settlement_status
        type: enum
        source: system
        description: money axis; evolves independently of production_status
        default: UNPAID
        constraints: "one of {UNPAID, AUTHORIZED, SETTLED, REFUNDED, RELEASED}"
      - name: pickup_window_start
        type: datetime
        source: input
        description: inclusive start of the promised pickup window; required for MOBILE_PREORDER and CATERING, must be null for TOUCHSCREEN
        default: null
      - name: pickup_window_end
        type: datetime
        source: input
        description: exclusive end of the promised pickup window; window arithmetic is half-open [start, end)
        default: null
      - name: daypart_at_placement
        type: enum
        source: computed
        description: snapshot of Store.current_daypart taken at placement; null while DRAFT
        default: null
      - name: subtotal_gross_cents
        type: integer
        source: computed
        description: "sum of OrderLine.line_gross_cents over all lines of this order"
        default: 0
      - name: promo_discount_cents
        type: integer
        source: computed
        description: discount produced by the single selected PromotionRule; 0 when the candidate set is empty
        default: 0
      - name: service_fee_cents
        type: integer
        source: computed
        description: catering service fee; 0 for TOUCHSCREEN and MOBILE_PREORDER
        default: 0
      - name: total_cents
        type: integer
        source: computed
        description: "subtotal_gross_cents - promo_discount_cents + service_fee_cents"
        default: 0
      - name: applied_promotion_id
        type: string
        source: computed
        description: "FK -> PromotionRule.id; the winner of promotion_selection, null when no rule was eligible"
        default: null
      - name: points_provisional
        type: integer
        source: computed
        description: PROVISIONAL variant of loyalty_points_accrual, credited at placement; 0 for anonymous orders
        default: 0
      - name: points_final
        type: integer
        source: computed
        description: FINAL variant of loyalty_points_accrual, computed at settlement; null before settlement
        default: null
      - name: expected_ready_at
        type: datetime
        source: computed
        description: promised ready instant computed at placement from the store's station queues; equals placed_at when the order has no kitchen tickets
        default: null
      - name: placed_at
        type: datetime
        source: system
        description: logical-clock instant of the DRAFT -> PLACED transition
        default: null
      - name: ready_at
        type: datetime
        source: system
        description: logical-clock instant the order entered READY
        default: null
      - name: rework_count
        type: integer
        source: computed
        description: number of KitchenTicket reopen events booked against this order
        default: 0
      - name: tender_type
        type: enum
        source: system
        description: tender captured at authorization; null before authorization
        default: null
        constraints: "one of {CARD, CASH, APP_WALLET}"

  - name: OrderLine
    parent: Order
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id; the owning order (taken from the path, not the body)"
      - name: menu_item_id
        type: string
        source: input
        description: "FK -> MenuItem.id; the item being built"
      - name: qty
        type: integer
        source: input
        description: number of units of this build
        constraints: ">= 1"
      - name: modifiers
        type: array
        source: input
        description: "build customization: array of objects { modifier_option_id, qty }; each modifier_option_id must belong to menu_item_id; qty <= ModifierOption.max_qty"
        default: []
      - name: station
        type: enum
        source: computed
        description: copied from MenuItem.station at line creation
      - name: unit_price_cents
        type: integer
        source: computed
        description: "MenuItem.base_price_cents + sum(ModifierOption.price_delta_cents * modifier qty)"
      - name: premium_surcharge_cents
        type: integer
        source: computed
        description: "PREMIUM_SURCHARGE_CENTS * max(0, premium modifier units - MenuItem.included_premium_count), per unit"
        default: 0
      - name: line_gross_cents
        type: integer
        source: computed
        description: "(unit_price_cents + premium_surcharge_cents) * qty"
      - name: line_discount_cents
        type: integer
        source: computed
        description: this line's share of promo_discount_cents under PCT_PER_LINE; 0 otherwise; assigned at placement
        default: 0
      - name: line_net_cents
        type: integer
        source: computed
        description: "line_gross_cents - line_discount_cents"
      - name: fulfillment_batch_id
        type: string
        source: computed
        description: "FK -> ProductionBatch.id; the batch reserved for this line at placement (PAR_BAKED_CASE items only), null otherwise"
        default: null
      - name: reserved_qty
        type: integer
        source: computed
        description: units currently reserved against fulfillment_batch_id; released to 0 on order void
        default: 0

  - name: KitchenTicket
    parent: Order
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: system
        description: "FK -> Order.id; created by placement, one ticket per distinct station among MADE_TO_ORDER lines"
      - name: store_id
        type: string
        source: system
        description: "FK -> Store.id; denormalized from the order so the station queue can be read per store"
      - name: station
        type: enum
        source: system
        description: station this ticket belongs to
        constraints: "one of {SANDWICH, BEVERAGE, HOT_FOOD, BAKERY}"
      - name: status
        type: enum
        source: system
        description: ticket progress; DONE is not terminal because rework can reopen it
        default: QUEUED
        constraints: "one of {QUEUED, IN_PROGRESS, DONE, VOIDED}; VOIDED produced by the POST /orders/{id}/void sweep"
      - name: sequence_position
        type: integer
        source: computed
        description: "1 + count of tickets already open in the same (store_id, station) queue at creation time"
      - name: prep_seconds
        type: integer
        source: computed
        description: "sum over this ticket's lines of (MenuItem.prep_seconds * qty + MODIFIER_PREP_SECONDS * total modifier units * qty)"
      - name: lead_seconds
        type: integer
        source: computed
        description: sum of prep_seconds of the tickets ahead of this one in the same station queue at creation time
      - name: promised_ready_at
        type: datetime
        source: computed
        description: "creation-time logical clock + lead_seconds + prep_seconds"
      - name: started_by_user_id
        type: string
        source: system
        description: X-User-ID of the actor who started the ticket; null while QUEUED
        default: null
      - name: completed_by_user_id
        type: string
        source: system
        description: X-User-ID of the actor who last completed the ticket; the reopen actor must differ from it
        default: null
      - name: rework_count
        type: integer
        source: computed
        description: number of times this ticket has been reopened
        default: 0

  - name: ProductionBatch
    parent: Store
    common_fields: true
    fields:
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; site producing the batch"
      - name: menu_item_id
        type: string
        source: input
        description: "FK -> MenuItem.id; must be a PAR_BAKED_CASE item"
      - name: holding_unit_id
        type: string
        source: input
        description: "FK -> HoldingUnit.id; unit whose slot this batch occupies"
      - name: slot_index
        type: integer
        source: input
        description: which pan slot of the unit this batch occupies
        constraints: "1 <= slot_index <= HoldingUnit.slot_count"
      - name: planned_qty
        type: integer
        source: input
        description: units planned for the first bake
        constraints: ">= 1"
      - name: bake_start_at
        type: datetime
        source: input
        description: planned oven-in instant; start of the slot occupancy interval
      - name: occupancy_end_at
        type: datetime
        source: computed
        description: "bake_start_at + MenuItem.bake_minutes + MenuItem.hold_minutes + SANITATION_BUFFER_MINUTES; exclusive end of the slot occupancy interval"
      - name: baked_qty
        type: integer
        source: computed
        description: cumulative units ever baked into this batch (initial bake plus top-off bakes)
        default: 0
      - name: remaining_qty
        type: integer
        source: computed
        description: units available on the case right now
        default: 0
      - name: reserved_qty
        type: integer
        source: computed
        description: units held for placed orders that have not yet gone READY
        default: 0
      - name: sold_qty
        type: integer
        source: computed
        description: units converted to sales when their order reached READY
        default: 0
      - name: discarded_qty
        type: integer
        source: computed
        description: units written off through WasteLog rows
        default: 0
      - name: hold_started_at
        type: datetime
        source: computed
        description: logical-clock instant of the most recent BAKING -> HOLDING pull
        default: null
      - name: hold_expires_at
        type: datetime
        source: computed
        description: "hold_started_at + MenuItem.hold_minutes; a batch at or past this instant may no longer fulfil lines"
        default: null
      - name: status
        type: enum
        source: system
        description: batch lifecycle; SOLD_OUT means exhausted by sales, DISCARDED means exhausted by write-off
        default: PLANNED
        constraints: "one of {PLANNED, BAKING, HOLDING, SOLD_OUT, DISCARDED}"

  - name: WasteLog
    parent: ProductionBatch
    common_fields: false
    fields:
      - name: production_batch_id
        type: string
        source: system
        description: "FK -> ProductionBatch.id; the batch written off"
      - name: qty
        type: integer
        source: system
        description: units written off by this event
        constraints: ">= 1"
      - name: reason
        type: enum
        source: system
        description: "provenance: QUALITY_REJECT and HOLD_EXPIRED are operator-declared; UNIT_IMPAIRED and DAYPART_TRANSITION are system cascades only"
        constraints: "one of {HOLD_EXPIRED, QUALITY_REJECT, UNIT_IMPAIRED, DAYPART_TRANSITION}"
      - name: food_cost_cents
        type: integer
        source: computed
        description: "FOOD_COST variant of waste_valuation: qty * MenuItem.unit_food_cost_cents"
      - name: retail_value_cents
        type: integer
        source: computed
        description: "RETAIL variant of waste_valuation: qty * MenuItem.base_price_cents"
      - name: logged_by_user_id
        type: string
        source: system
        description: "X-User-ID of the operator, or the literal string \"system\" for cascade-generated rows"
      - name: daypart_epoch
        type: integer
        source: system
        description: Store.daypart_epoch at the moment the write-off was booked

  - name: TemperatureLog
    parent: HoldingUnit
    common_fields: false
    fields:
      - name: holding_unit_id
        type: string
        source: input
        description: "FK -> HoldingUnit.id; unit being probed"
      - name: reading_f
        type: number
        source: input
        description: probe reading in degrees F
      - name: in_range
        type: boolean
        source: computed
        description: "HoldingUnit.min_temp_f <= reading_f <= HoldingUnit.max_temp_f, both bounds inclusive"
      - name: logged_by_user_id
        type: string
        source: system
        description: X-User-ID of the actor who recorded the reading; barred from verifying its CorrectiveAction
      - name: recorded_at
        type: datetime
        source: system
        description: logical-clock instant of the reading; drives temp_log_compliance

  - name: CorrectiveAction
    parent: TemperatureLog
    common_fields: true
    fields:
      - name: temperature_log_id
        type: string
        source: input
        description: "FK -> TemperatureLog.id; the out-of-range reading being remediated"
      - name: action_taken
        type: string
        source: input
        description: free-text remediation narrative for the inspection binder
      - name: status
        type: enum
        source: system
        description: OPEN until a second actor verifies it
        default: OPEN
        constraints: "one of {OPEN, VERIFIED}"
      - name: opened_by_user_id
        type: string
        source: system
        description: X-User-ID of the actor who opened the action
      - name: verified_by_user_id
        type: string
        source: system
        description: X-User-ID of the verifying actor; must differ from the reading's logged_by_user_id
        default: null
      - name: verified_at
        type: datetime
        source: system
        description: logical-clock instant of verification
        default: null

  - name: StaffingPlan
    parent: Store
    common_fields: true
    fields:
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; site the plan staffs"
      - name: service_date
        type: string
        source: input
        description: "calendar date in YYYY-MM-DD (UTC) the plan covers"
      - name: daypart
        type: enum
        source: input
        description: daypart the plan covers
        constraints: "one of {BREAKFAST, LUNCH, DINNER, OVERNIGHT}"
      - name: forecast_txn_count
        type: integer
        source: input
        description: forecast transaction count for the daypart; drives staffing_labor_minutes
        constraints: ">= 0"
      - name: mto_share_bp
        type: integer
        source: input
        description: basis points of forecast transactions expected to be made-to-order foodservice
        constraints: "0..10000"
      - name: planned_labor_minutes
        type: integer
        source: computed
        description: output of staffing_labor_minutes
      - name: peak_multiplier_bp
        type: integer
        source: computed
        description: "11500 when forecast_txn_count >= PEAK_TXN_THRESHOLD, else 10000"
      - name: status
        type: enum
        source: system
        description: plan lifecycle; only PUBLISHED or LOCKED plans authorize order placement in their daypart
        default: DRAFT
        constraints: "one of {DRAFT, PUBLISHED, LOCKED, SUPERSEDED}"

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: Order
    axis: production_status
    initial_state: DRAFT
    terminal_states: [PICKED_UP, VOIDED]
    note: |
      Parallel dimension 1 of 2 on the Order row. This axis never reads or writes settlement_status;
      the only coupling is by precondition (a ticket may not start unless the money axis is AUTHORIZED).
    transitions:
      - from: DRAFT
        to: PLACED
        trigger: "POST /orders/{id}/place"
        actor: StoreTerminal | Customer
        preconditions:
          - "production_status == DRAFT"
          - "the order has >= 1 OrderLine (else ERR_ORDER_EMPTY)"
          - "exactly one StaffingPlan exists with store_id == order.store_id, daypart == Store.current_daypart, service_date == date(logical clock) and status IN {PUBLISHED, LOCKED} (else ERR_DAYPART_PLAN_NOT_PUBLISHED)"
          - "for every line, MenuItem.valid_dayparts contains Store.current_daypart (else ERR_MENU_ITEM_NOT_IN_DAYPART)"
          - "channel == TOUCHSCREEN => pickup_window_start and pickup_window_end are both null (else ERR_PICKUP_WINDOW_NOT_ALLOWED)"
          - "channel IN {MOBILE_PREORDER, CATERING} => both window bounds non-null (else ERR_PICKUP_WINDOW_REQUIRED), pickup_window_end > pickup_window_start (else ERR_PICKUP_WINDOW_INVALID), pickup_window_end > clock (else ERR_PICKUP_WINDOW_ELAPSED)"
          - "channel == MOBILE_PREORDER => pickup_window_start - clock >= PREORDER_LEAD_MINUTES; channel == CATERING => pickup_window_start - clock >= CATERING_LEAD_MINUTES (else ERR_PREORDER_LEAD_TIME_TOO_SHORT)"
          - "channel IN {MOBILE_PREORDER, CATERING} => pickup_window_capacity < Store.pickup_slot_capacity (else ERR_PICKUP_WINDOW_FULL)"
          - "channel == CATERING => every line's MenuItem.is_catering_eligible is true (else ERR_ITEM_NOT_CATERING_ELIGIBLE) and subtotal_gross_cents >= CATERING_MIN_SUBTOTAL_CENTS (else ERR_ORDER_MINIMUM_NOT_MET)"
          - "for every PAR_BAKED_CASE line, batch_selection_fefo returns a batch (else ERR_INSUFFICIENT_BATCH_QTY)"
        side_effects:
          - "placed_at = logical clock; daypart_at_placement = Store.current_daypart"
          - "recompute subtotal_gross_cents = sum(OrderLine.line_gross_cents)"
          - "run promotion_selection -> applied_promotion_id (nullable); run promotion_discount -> each eligible OrderLine.line_discount_cents and OrderLine.line_net_cents, then promo_discount_cents"
          - "run order_total_assembly -> service_fee_cents, total_cents"
          - "for each PAR_BAKED_CASE line: fulfillment_batch_id = selected batch, reserved_qty = line.qty; batch.remaining_qty -= line.qty; batch.reserved_qty += line.qty; batch.version += 1"
          - "create one KitchenTicket per distinct station among MADE_TO_ORDER lines with station_queue_sequencing outputs (sequence_position, prep_seconds, lead_seconds, promised_ready_at)"
          - "expected_ready_at = max(KitchenTicket.promised_ready_at) over the created tickets, or placed_at when zero tickets were created"
          - "if loyalty_account_id is non-null: points_provisional = loyalty_points_accrual/PROVISIONAL; account.points_balance += points_provisional; account.lifetime_points_earned += points_provisional; recompute account.tier; account.version += 1"
          - "increments Order.version by 1"
      - from: PLACED
        to: ASSEMBLED
        trigger: "system, inside POST /orders/{id}/place when zero KitchenTicket rows were created (every line is PAR_BAKED_CASE)"
        actor: system
        preconditions:
          - "the placement created zero KitchenTicket rows"
        side_effects:
          - "no ticket work exists, so the order is assembled the instant it is placed"
          - "may cascade ASSEMBLED -> READY in the same request when the ready gate is satisfied"
      - from: PLACED
        to: IN_PRODUCTION
        trigger: "system, on the first POST /kitchen-tickets/{id}/start of any ticket of this order"
        actor: system
        preconditions:
          - "the starting ticket belongs to this order"
        side_effects:
          - "increments Order.version by 1"
      - from: IN_PRODUCTION
        to: ASSEMBLED
        trigger: "system, on POST /kitchen-tickets/{id}/complete when every non-VOIDED ticket of the order is DONE"
        actor: system
        preconditions:
          - "no ticket of this order remains in QUEUED or IN_PROGRESS"
        side_effects:
          - "increments Order.version by 1"
          - "may cascade ASSEMBLED -> READY in the same request when the ready gate is satisfied"
      - from: ASSEMBLED
        to: READY
        trigger: "system, immediately on entering ASSEMBLED when the ready gate holds"
        actor: system
        preconditions:
          - "channel == TOUCHSCREEN, or logical clock >= pickup_window_start"
        side_effects:
          - "ready_at = logical clock"
          - "for every line with fulfillment_batch_id: batch.reserved_qty -= line.reserved_qty; batch.sold_qty += line.reserved_qty; line.reserved_qty = 0; batch.version += 1"
          - "for every touched batch, if remaining_qty == 0 and reserved_qty == 0 the batch transitions HOLDING -> SOLD_OUT (sale-driven exhaustion), which decrements Store.hot_case_slots_used by 1 and increments Store.version by 1"
          - "increments Order.version by 1"
      - from: ASSEMBLED
        to: READY
        trigger: "POST /orders/{id}/release"
        actor: StoreTerminal | StoreManager
        preconditions:
          - "production_status == ASSEMBLED (else ERR_ORDER_PRODUCTION_STATE_INVALID)"
          - "logical clock >= pickup_window_start (else ERR_PICKUP_WINDOW_NOT_OPEN)"
        side_effects:
          - "identical side-effect set to the automatic ASSEMBLED -> READY transition above"
        note: "explicit operator path for pre-order/catering orders assembled before their window opened"
      - from: READY
        to: PICKED_UP
        trigger: "POST /orders/{id}/pickup"
        actor: StoreTerminal | Customer
        preconditions:
          - "production_status == READY (else ERR_ORDER_PRODUCTION_STATE_INVALID)"
          - "channel IN {MOBILE_PREORDER, CATERING} => logical clock >= pickup_window_start (else ERR_PICKUP_WINDOW_NOT_OPEN)"
        side_effects:
          - "increments Order.version by 1"
      - from: DRAFT
        to: VOIDED
        trigger: "POST /orders/{id}/void"
        actor: StoreTerminal | ShiftLead
        preconditions:
          - "production_status IN {DRAFT, PLACED, IN_PRODUCTION, ASSEMBLED} (else ERR_ORDER_PRODUCTION_STATE_INVALID)"
          - "settlement_status != SETTLED (else ERR_ORDER_SETTLEMENT_STATE_INVALID; a settled order must be refunded, not voided)"
        side_effects:
          - "no reservations, tickets or points exist yet for a DRAFT order; only production_status and version change"
      - from: PLACED
        to: VOIDED
        trigger: "POST /orders/{id}/void"
        actor: StoreTerminal | ShiftLead
        preconditions:
          - "production_status IN {DRAFT, PLACED, IN_PRODUCTION, ASSEMBLED}"
          - "settlement_status != SETTLED"
        side_effects:
          - "every KitchenTicket of the order with status IN {QUEUED, IN_PROGRESS} transitions to VOIDED"
          - "for every line with fulfillment_batch_id and reserved_qty > 0: batch.remaining_qty += line.reserved_qty; batch.reserved_qty -= line.reserved_qty; line.reserved_qty = 0; batch.version += 1 (batch status is unchanged; released units return to the case)"
          - "if points_provisional > 0: account.points_balance -= points_provisional; account.points_reversed_total += points_provisional; account.version += 1 (lifetime_points_earned and tier are historical and do not move)"
          - "if settlement_status == AUTHORIZED it moves to RELEASED on the settlement axis"
          - "increments Order.version by 1"
      - from: IN_PRODUCTION
        to: VOIDED
        trigger: "POST /orders/{id}/void"
        actor: StoreTerminal | ShiftLead
        preconditions:
          - "production_status IN {DRAFT, PLACED, IN_PRODUCTION, ASSEMBLED}"
          - "settlement_status != SETTLED"
        side_effects:
          - "identical side-effect set to the PLACED -> VOIDED transition"
      - from: ASSEMBLED
        to: VOIDED
        trigger: "POST /orders/{id}/void"
        actor: StoreTerminal | ShiftLead
        preconditions:
          - "production_status IN {DRAFT, PLACED, IN_PRODUCTION, ASSEMBLED}"
          - "settlement_status != SETTLED"
        side_effects:
          - "identical side-effect set to the PLACED -> VOIDED transition"
        note: "READY and PICKED_UP orders are NOT voidable - their reservations have already converted to sales"

  - entity: Order
    axis: settlement_status
    initial_state: UNPAID
    terminal_states: [REFUNDED, RELEASED]
    note: "Parallel dimension 2 of 2 on the Order row. Money moves without reading production_status except to exclude VOIDED orders."
    transitions:
      - from: UNPAID
        to: AUTHORIZED
        trigger: "POST /orders/{id}/authorize"
        actor: StoreTerminal | Customer
        preconditions:
          - "settlement_status == UNPAID (else ERR_ORDER_SETTLEMENT_STATE_INVALID)"
          - "production_status IN {PLACED, IN_PRODUCTION, ASSEMBLED, READY} (else ERR_ORDER_PRODUCTION_STATE_INVALID)"
        side_effects:
          - "tender_type = request tender_type; increments Order.version by 1"
          - "unblocks POST /kitchen-tickets/{id}/start for every ticket of this order"
      - from: AUTHORIZED
        to: SETTLED
        trigger: "POST /orders/{id}/settle"
        actor: StoreTerminal | Customer
        preconditions:
          - "settlement_status == AUTHORIZED (else ERR_ORDER_SETTLEMENT_STATE_INVALID)"
          - "production_status != VOIDED (else ERR_ORDER_PRODUCTION_STATE_INVALID)"
        side_effects:
          - "if loyalty_account_id is non-null: points_final = loyalty_points_accrual/FINAL; delta = points_final - points_provisional; account.points_balance += delta; account.lifetime_points_earned += delta; recompute account.tier; account.version += 1"
          - "if loyalty_account_id is null: points_final = 0"
          - "increments Order.version by 1"
      - from: SETTLED
        to: REFUNDED
        trigger: "POST /orders/{id}/refund"
        actor: StoreManager | ShiftLead
        preconditions:
          - "settlement_status == SETTLED (else ERR_ORDER_SETTLEMENT_STATE_INVALID)"
        side_effects:
          - "if loyalty_account_id is non-null: account.points_balance -= points_final; account.points_reversed_total += points_final; account.version += 1 (lifetime_points_earned and tier stay where settlement left them)"
          - "increments Order.version by 1"
      - from: AUTHORIZED
        to: RELEASED
        trigger: "system, on POST /orders/{id}/void of an authorized order"
        actor: system
        preconditions:
          - "the production axis is executing a transition to VOIDED"
        side_effects:
          - "the authorization hold is released; no points move here (the production-axis void already reversed points_provisional)"

  - entity: KitchenTicket
    initial_state: QUEUED
    terminal_states: [VOIDED]
    note: "Cyclic: DONE is not terminal because rework sends the ticket back to IN_PROGRESS."
    transitions:
      - from: QUEUED
        to: IN_PROGRESS
        trigger: "POST /kitchen-tickets/{id}/start"
        actor: KitchenAssociate
        preconditions:
          - "status == QUEUED (else ERR_TICKET_STATE_INVALID)"
          - "Order.settlement_status == AUTHORIZED (else ERR_ORDER_NOT_AUTHORIZED)"
          - "Order.production_status IN {PLACED, IN_PRODUCTION} (else ERR_ORDER_PRODUCTION_STATE_INVALID)"
        side_effects:
          - "started_by_user_id = X-User-ID"
          - "if Order.production_status == PLACED the order transitions PLACED -> IN_PRODUCTION"
          - "increments KitchenTicket.version by 1"
      - from: IN_PROGRESS
        to: DONE
        trigger: "POST /kitchen-tickets/{id}/complete"
        actor: KitchenAssociate
        preconditions:
          - "status == IN_PROGRESS (else ERR_TICKET_STATE_INVALID)"
        side_effects:
          - "completed_by_user_id = X-User-ID"
          - "if no ticket of the order remains QUEUED or IN_PROGRESS, the order transitions IN_PRODUCTION -> ASSEMBLED, which may itself cascade ASSEMBLED -> READY, which may itself cascade a batch HOLDING -> SOLD_OUT, which decrements Store.hot_case_slots_used"
          - "increments KitchenTicket.version by 1"
      - from: DONE
        to: IN_PROGRESS
        trigger: "POST /kitchen-tickets/{id}/reopen"
        actor: ShiftLead
        preconditions:
          - "status == DONE (else ERR_TICKET_STATE_INVALID)"
          - "Order.production_status IN {IN_PRODUCTION, ASSEMBLED} (else ERR_ORDER_NOT_REWORKABLE)"
          - "X-User-ID != completed_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "rework_count += 1; Order.rework_count += 1; Order.version += 1"
          - "if Order.production_status == ASSEMBLED the order transitions ASSEMBLED -> IN_PRODUCTION"
          - "Store.rework_waste_cents_mtd += sum over this ticket's lines of (MenuItem.unit_food_cost_cents * OrderLine.qty); Store.version += 1"
          - "increments KitchenTicket.version by 1"
      - from: QUEUED
        to: VOIDED
        trigger: "system, on POST /orders/{id}/void"
        actor: system
        preconditions:
          - "the owning order is transitioning to VOIDED"
        side_effects:
          - "increments KitchenTicket.version by 1; the ticket leaves its station queue"
      - from: IN_PROGRESS
        to: VOIDED
        trigger: "system, on POST /orders/{id}/void"
        actor: system
        preconditions:
          - "the owning order is transitioning to VOIDED"
        side_effects:
          - "increments KitchenTicket.version by 1; the ticket leaves its station queue"

  - entity: ProductionBatch
    initial_state: PLANNED
    terminal_states: [SOLD_OUT, DISCARDED]
    note: |
      Cyclic: HOLDING -> BAKING is the top-off bake that adds units to a case that is already holding.
      Exhaustion status is decided by the action that drove remaining_qty and reserved_qty to zero:
      a sale conversion produces SOLD_OUT, a write-off produces DISCARDED.
    transitions:
      - from: PLANNED
        to: BAKING
        trigger: "POST /production-batches/{id}/bake"
        actor: KitchenAssociate
        preconditions:
          - "status == PLANNED (else ERR_BATCH_STATE_INVALID)"
          - "HoldingUnit.status == OPERATIONAL (else ERR_HOLDING_UNIT_NOT_OPERATIONAL)"
          - "Store.hot_case_slots_used < Store.hot_case_slot_capacity (else ERR_HOT_CASE_CAPACITY_EXCEEDED)"
        side_effects:
          - "baked_qty = planned_qty; remaining_qty = planned_qty"
          - "Store.hot_case_slots_used += 1; Store.version += 1"
          - "increments ProductionBatch.version by 1"
      - from: BAKING
        to: HOLDING
        trigger: "POST /production-batches/{id}/pull"
        actor: KitchenAssociate
        preconditions:
          - "status == BAKING (else ERR_BATCH_STATE_INVALID)"
          - "HoldingUnit.status == OPERATIONAL (else ERR_HOLDING_UNIT_NOT_OPERATIONAL)"
        side_effects:
          - "hold_started_at = logical clock; hold_expires_at = hold_started_at + MenuItem.hold_minutes"
          - "the batch becomes visible to batch_selection_fefo"
          - "increments ProductionBatch.version by 1"
      - from: HOLDING
        to: BAKING
        trigger: "POST /production-batches/{id}/bake with additional_qty"
        actor: KitchenAssociate
        preconditions:
          - "status == HOLDING (else ERR_BATCH_STATE_INVALID)"
          - "additional_qty is present and >= 1 (else ERR_INVALID_REQUEST)"
          - "HoldingUnit.status == OPERATIONAL (else ERR_HOLDING_UNIT_NOT_OPERATIONAL)"
        side_effects:
          - "baked_qty += additional_qty; remaining_qty += additional_qty"
          - "hold_started_at = null; hold_expires_at = null (the case clock restarts only on the next pull)"
          - "Store.hot_case_slots_used is unchanged - the batch already occupies its slot"
          - "increments ProductionBatch.version by 1"
        note: "top-off bake; this is the cycle edge that makes the machine non-linear"
      - from: HOLDING
        to: HOLDING
        trigger: "POST /production-batches/{id}/discard with qty < remaining_qty"
        actor: KitchenAssociate | ShiftLead
        preconditions:
          - "status == HOLDING (else ERR_BATCH_STATE_INVALID)"
          - "expected_batch_version matches ProductionBatch.version (else ERR_STALE_BATCH_VERSION)"
          - "reason IN {HOLD_EXPIRED, QUALITY_REJECT} (else ERR_RESERVED_DISCARD_REASON)"
          - "qty <= remaining_qty (else ERR_DISCARD_QTY_EXCEEDS_REMAINING)"
        side_effects:
          - "remaining_qty -= qty; discarded_qty += qty"
          - "append WasteLog { production_batch_id, qty, reason, food_cost_cents (waste_valuation/FOOD_COST), retail_value_cents (waste_valuation/RETAIL), logged_by_user_id = X-User-ID, daypart_epoch = Store.daypart_epoch }"
          - "Store.waste_cost_cents_mtd += WasteLog.food_cost_cents; Store.version += 1"
          - "increments ProductionBatch.version by 1"
        note: "partial write-off keeps the case open; status is unchanged"
      - from: HOLDING
        to: DISCARDED
        trigger: "POST /production-batches/{id}/discard with qty == remaining_qty and reserved_qty == 0"
        actor: KitchenAssociate | ShiftLead
        preconditions:
          - "status == HOLDING (else ERR_BATCH_STATE_INVALID)"
          - "expected_batch_version matches ProductionBatch.version (else ERR_STALE_BATCH_VERSION)"
          - "reason IN {HOLD_EXPIRED, QUALITY_REJECT} (else ERR_RESERVED_DISCARD_REASON)"
          - "qty <= remaining_qty (else ERR_DISCARD_QTY_EXCEEDS_REMAINING)"
          - "reserved_qty == 0 after the write-off, otherwise the batch stays HOLDING"
        side_effects:
          - "remaining_qty -= qty; discarded_qty += qty"
          - "append WasteLog as in the partial-discard transition"
          - "Store.waste_cost_cents_mtd += WasteLog.food_cost_cents; Store.hot_case_slots_used -= 1; Store.version += 1"
          - "increments ProductionBatch.version by 1"
      - from: HOLDING
        to: DISCARDED
        trigger: "system, on the HoldingUnit impairment sweep fired by an out-of-range TemperatureLog"
        actor: system
        preconditions:
          - "the batch's HoldingUnit is transitioning OPERATIONAL -> IMPAIRED or IMPAIRED -> LOCKED_OUT"
          - "reserved_qty == 0 (batches with units already reserved to placed orders keep status HOLDING; only their remaining_qty is written off)"
        side_effects:
          - "discarded_qty += remaining_qty; remaining_qty = 0"
          - "append WasteLog with reason UNIT_IMPAIRED, qty = the written-off units, logged_by_user_id = \"system\""
          - "Store.waste_cost_cents_mtd += WasteLog.food_cost_cents; Store.hot_case_slots_used -= 1; Store.version += 1"
          - "increments ProductionBatch.version by 1"
      - from: HOLDING
        to: DISCARDED
        trigger: "system, on the daypart-transition sweep fired by POST /stores/{id}/daypart-transitions"
        actor: system
        preconditions:
          - "hold_expires_at <= logical clock, OR MenuItem.valid_dayparts does not contain the new Store.current_daypart"
          - "reserved_qty == 0"
        side_effects:
          - "discarded_qty += remaining_qty; remaining_qty = 0"
          - "append WasteLog with reason DAYPART_TRANSITION, logged_by_user_id = \"system\", daypart_epoch = the NEW Store.daypart_epoch"
          - "Store.waste_cost_cents_mtd += WasteLog.food_cost_cents; Store.hot_case_slots_used -= 1; Store.version += 1"
          - "increments ProductionBatch.version by 1"
        note: "sweep order is deterministic: batches are processed by bake_start_at ASC, then created_at ASC"
      - from: HOLDING
        to: SOLD_OUT
        trigger: "system, when an Order reaching READY converts the last reserved units of this batch"
        actor: system
        preconditions:
          - "after the conversion remaining_qty == 0 and reserved_qty == 0"
        side_effects:
          - "Store.hot_case_slots_used -= 1; Store.version += 1"
          - "increments ProductionBatch.version by 1"

  - entity: HoldingUnit
    initial_state: OPERATIONAL
    terminal_states: []
    note: "Cyclic posture machine; a verified CorrectiveAction always returns the unit to OPERATIONAL."
    transitions:
      - from: OPERATIONAL
        to: IMPAIRED
        trigger: "system, on POST /holding-units/{id}/temperature-logs whose reading is out of band"
        actor: system
        preconditions:
          - "the new TemperatureLog.in_range == false"
        side_effects:
          - "consecutive_out_of_range_count += 1 (now 1); last_temp_log_at = TemperatureLog.recorded_at"
          - "run the impairment sweep: every ProductionBatch in this unit with status == HOLDING and reserved_qty == 0 goes HOLDING -> DISCARDED, each appending a WasteLog with reason UNIT_IMPAIRED, each incrementing Store.waste_cost_cents_mtd and decrementing Store.hot_case_slots_used"
          - "bake and pull on this unit are blocked until a CorrectiveAction is verified"
          - "increments HoldingUnit.version by 1"
      - from: IMPAIRED
        to: LOCKED_OUT
        trigger: "system, on a further POST /holding-units/{id}/temperature-logs whose reading is out of band"
        actor: system
        preconditions:
          - "status == IMPAIRED and the new TemperatureLog.in_range == false (consecutive_out_of_range_count reaches 2)"
        side_effects:
          - "consecutive_out_of_range_count += 1; last_temp_log_at = TemperatureLog.recorded_at"
          - "run the same impairment sweep as OPERATIONAL -> IMPAIRED"
          - "only FoodSafetyLead may clear a LOCKED_OUT unit"
          - "increments HoldingUnit.version by 1"
      - from: IMPAIRED
        to: OPERATIONAL
        trigger: "POST /corrective-actions/{id}/verify"
        actor: ShiftLead | FoodSafetyLead
        preconditions:
          - "the action's TemperatureLog belongs to this unit"
          - "X-User-ID != TemperatureLog.logged_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "consecutive_out_of_range_count = 0"
          - "increments HoldingUnit.version by 1"
      - from: LOCKED_OUT
        to: OPERATIONAL
        trigger: "POST /corrective-actions/{id}/verify"
        actor: FoodSafetyLead
        preconditions:
          - "X-User-Role == FoodSafetyLead (else ERR_LOCKOUT_REQUIRES_SAFETY_LEAD)"
          - "X-User-ID != TemperatureLog.logged_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "consecutive_out_of_range_count = 0"
          - "increments HoldingUnit.version by 1"

  - entity: CorrectiveAction
    initial_state: OPEN
    terminal_states: [VERIFIED]
    transitions:
      - from: OPEN
        to: VERIFIED
        trigger: "POST /corrective-actions/{id}/verify"
        actor: ShiftLead | FoodSafetyLead
        preconditions:
          - "status == OPEN (else ERR_ACTION_ALREADY_VERIFIED)"
          - "the TemperatureLog's HoldingUnit.status IN {IMPAIRED, LOCKED_OUT} (else ERR_UNIT_NOT_IMPAIRED)"
          - "X-User-ID != TemperatureLog.logged_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "if the unit is LOCKED_OUT then X-User-Role == FoodSafetyLead (else ERR_LOCKOUT_REQUIRES_SAFETY_LEAD)"
        side_effects:
          - "verified_by_user_id = X-User-ID; verified_at = logical clock"
          - "the unit transitions IMPAIRED -> OPERATIONAL or LOCKED_OUT -> OPERATIONAL"
          - "increments CorrectiveAction.version by 1"

  - entity: StaffingPlan
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /staffing-plans/{id}/publish"
        actor: StoreManager
        preconditions:
          - "status == DRAFT (else ERR_PLAN_STATE_INVALID)"
        side_effects:
          - "orders may now be placed at this store in this daypart on this service_date"
          - "increments StaffingPlan.version by 1"
      - from: PUBLISHED
        to: LOCKED
        trigger: "POST /staffing-plans/{id}/lock"
        actor: StoreManager
        preconditions:
          - "status == PUBLISHED (else ERR_PLAN_STATE_INVALID)"
        side_effects:
          - "the plan can no longer be superseded by a new plan for the same (store_id, service_date, daypart)"
          - "increments StaffingPlan.version by 1"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system, on POST /stores/{id}/staffing-plans for the same (store_id, service_date, daypart)"
        actor: system
        preconditions:
          - "status IN {DRAFT, PUBLISHED} (a LOCKED plan rejects the new plan with ERR_PLAN_LOCKED)"
        side_effects:
          - "increments StaffingPlan.version by 1"
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system, on POST /stores/{id}/staffing-plans for the same (store_id, service_date, daypart)"
        actor: system
        preconditions:
          - "status IN {DRAFT, PUBLISHED}"
        side_effects:
          - "increments StaffingPlan.version by 1"
        note: "this legitimate supersede is what makes plan creation a true OCC race - see concurrency_rules"

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules (OCC on the parent's version - the only sanctioned mechanism)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: staffing-plan-create-stale-store
    parent_entity: Store
    write_endpoint: "POST /stores/{id}/staffing-plans"
    occ_field: "expected_store_version"
    description: |
      Creating a StaffingPlan against a Store whose version has advanced since the client last read it
      is rejected with 412. A plan create legitimately supersedes any DRAFT or PUBLISHED plan for the
      same (store_id, service_date, daypart), so a second sequential create carrying the version the
      client observed before the first create would otherwise silently overwrite a plan it never saw.
      The stale-version check makes that rejection deterministic.
    error_id: ERR_STALE_STORE_VERSION
    http_status: 412
  - rule_id: batch-discard-stale-batch
    parent_entity: ProductionBatch
    write_endpoint: "POST /production-batches/{id}/discard"
    occ_field: "expected_batch_version"
    description: |
      Writing off units from a ProductionBatch whose version has advanced since the client last read it
      is rejected with 412. Partial write-offs are repeatable by design - a second sequential discard of
      the same qty against a batch that still holds units is a legitimate operation and no state
      precondition rejects it - so the only deterministic guard against writing off units the client
      never saw (because a top-off bake, a reservation or an earlier write-off already moved them) is
      the stale-version check on the batch.
    error_id: ERR_STALE_BATCH_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: line_gross_pricing
    trigger: "POST /orders/{id}/lines (line creation) and re-verified on POST /orders/{id}/place"
    algorithm: threshold
    formula: |
      premium_units      = sum(m.qty for m in modifiers if ModifierOption(m).is_premium)
      unit_price_cents   = MenuItem.base_price_cents
                           + sum(ModifierOption(m).price_delta_cents * m.qty for m in modifiers)
      premium_surcharge_cents = PREMIUM_SURCHARGE_CENTS
                           * max(0, premium_units - MenuItem.included_premium_count)
      line_gross_cents   = (unit_price_cents + premium_surcharge_cents) * qty
    input_set: "the modifiers array of this line only; premium_units counts modifier UNITS, not distinct options"
    constants:
      PREMIUM_SURCHARGE_CENTS: 75
    precision: "integer cents throughout; no rounding is required because every term is an integer"
    note: |
      premium_surcharge_cents is a PER-UNIT amount that is multiplied by qty together with
      unit_price_cents. Reading it as a per-line amount added once produces a different
      line_gross_cents for any qty > 1; the per-unit reading is the pinned one.

  - name: promotion_selection
    trigger: "POST /orders/{id}/place, after subtotal_gross_cents is recomputed"
    algorithm: weighted_scoring
    formula: |
      candidates = [ r for r in PromotionRule
                     if r.status == ACTIVE
                     and Store.current_daypart in r.valid_dayparts
                     and Order.subtotal_gross_cents >= r.min_food_subtotal_cents
                     and ( r.kind != FUEL_FOOD_COMBO
                           or ( Store.is_fuel_site == true
                                and Order.loyalty_account_id is not null
                                and fuel_gallons_30d(Order.loyalty_account_id) >= r.requires_fuel_gallons ) ) ]
      # candidate_discount(r) is the value promotion_discount would produce for r, cap included
      rank_key(r) = ( -candidate_discount(r), r.stacking_rank, r.created_at )
      winner = min(candidates, key=rank_key)           # highest discount, then lowest stacking_rank,
                                                       # then earliest created_at
      if candidates is empty:
          applied_promotion_id = null; promo_discount_cents = 0   # no error is raised
    input_set: "all PromotionRule rows with status == ACTIVE; SUSPENDED rules are excluded"
    constants: {}
    precision: "candidate_discount is evaluated in whole cents before ranking"
    note: |
      Exactly ONE rule is applied - promotions never stack. Eligibility uses subtotal_gross_cents
      (BEFORE any discount) while ranking uses the capped discount value; both are pinned here so the
      selector is total: eligibility filter, ranking expression, two tie-breaks, empty-pool fallback.

  - name: promotion_discount
    trigger: "POST /orders/{id}/place, immediately after promotion_selection picks a winner"
    algorithm: tiered_pricing
    formula: |
      if winner.discount_kind == PCT_PER_LINE:
          eligible_lines = [ l for l in OrderLine
                             if winner.target_station == ALL or l.station == winner.target_station ]
          for l in eligible_lines (ordered by OrderLine.created_at ASC):
              l.line_discount_cents = round_half_up(l.line_gross_cents * winner.discount_bp / 10000)
          raw_discount = sum(l.line_discount_cents for l in eligible_lines)
      else:  # CENTS_OFF
          raw_discount = min(winner.discount_cents, Order.subtotal_gross_cents)
      promo_discount_cents = min(raw_discount, winner.max_discount_cents)
      # cap redistribution: when the cap bites under PCT_PER_LINE, line_discount_cents values are
      # scaled down by removing cents from the LAST eligible line (created_at DESC) until the sum
      # equals promo_discount_cents, so sum(line_discount_cents) == promo_discount_cents always holds
      line_net_cents = line_gross_cents - line_discount_cents
    input_set: "all OrderLine rows of the order; under PCT_PER_LINE only lines whose station matches target_station receive a discount"
    constants: {}
    precision: |
      2-step rounding, ORDER PINNED: round_half_up per LINE first, then SUM the rounded line
      discounts. The alternative order (sum the un-rounded line amounts, then round once) yields a
      different total - e.g. two eligible lines of 1010 cents at 1500 bp give 152 + 152 = 304 under
      the pinned order but round_half_up(2020 * 0.15) = 303 under the other. 304 is correct.

  - name: order_total_assembly
    trigger: "POST /orders/{id}/place, after promotion_discount"
    algorithm: constraint_propagation
    formula: |
      # EVALUATION ORDER IS PINNED - the fee depends on the discounted subtotal while the discount
      # depends on the UNDISCOUNTED subtotal, so the pipeline only has one well-defined reading:
      #   step 1: subtotal_gross_cents = sum(OrderLine.line_gross_cents)
      #   step 2: promotion_selection eligibility compares against subtotal_gross_cents (step 1 value)
      #   step 3: promo_discount_cents = promotion_discount output
      #   step 4: discounted_food = subtotal_gross_cents - promo_discount_cents
      #   step 5: service_fee_cents = 0                                       if channel != CATERING
      #           service_fee_cents = max( CATERING_MIN_FEE_CENTS,
      #                                    round_half_up(discounted_food * CATERING_FEE_BP / 10000) )
      #                                                                       if channel == CATERING
      #   step 6: total_cents = subtotal_gross_cents - promo_discount_cents + service_fee_cents
      # The service fee is NEVER part of promotion eligibility, and the fee never charges itself.
    input_set: "the order's own lines and the selected promotion; no other order participates"
    constants:
      CATERING_FEE_BP: 800
      CATERING_MIN_FEE_CENTS: 500
    precision: "single round_half_up inside step 5 only; every other step is integer arithmetic"

  - name: loyalty_points_accrual
    trigger: "PROVISIONAL on POST /orders/{id}/place; FINAL on POST /orders/{id}/settle"
    algorithm: threshold
    formula: |
      tier_multiplier_bp(tier) = { BASIC: 10000, PLUS: 12500, ELITE: 15000 }[tier]
      PROVISIONAL:
        basis  = Order.total_cents                       # INCLUDES service_fee_cents
        tier   = LoyaltyAccount.tier as of placement     # before this order's own accrual
        points = floor(basis * tier_multiplier_bp(tier) / 1000000)
      FINAL:
        basis  = Order.subtotal_gross_cents - Order.promo_discount_cents   # EXCLUDES service_fee_cents
        tier   = LoyaltyAccount.tier as of settlement    # already lifted by the provisional accrual
        points = floor(basis * tier_multiplier_bp(tier) / 1000000)
                 + (FUEL_COMBO_BONUS_POINTS if the applied promotion's kind == FUEL_FOOD_COMBO else 0)
      settlement_delta = points_final - points_provisional      # may be positive or negative
    input_set: "one order; anonymous orders (loyalty_account_id null) accrue 0 in both variants"
    constants:
      FUEL_COMBO_BONUS_POINTS: 50
    precision: "floor division on integers; never round_half_up - fractional points are always dropped"
    variants:
      - name: PROVISIONAL
        when: "credited at placement so the touchscreen can print an earned-points line on the receipt"
        difference: "basis includes the catering service fee and the tier is read BEFORE this order's own accrual"
      - name: FINAL
        when: "recomputed at settlement and reconciled by applying settlement_delta to the account"
        difference: "basis excludes the service fee (fees never earn points), the tier is re-read AFTER the provisional accrual (so an order that crosses a tier boundary earns at the higher multiplier), and a fuel-and-food combo adds FUEL_COMBO_BONUS_POINTS"

  - name: loyalty_tier_derivation
    trigger: "after every mutation of LoyaltyAccount.lifetime_points_earned"
    algorithm: threshold
    formula: |
      tier = ELITE if lifetime_points_earned >= ELITE_THRESHOLD
             else PLUS if lifetime_points_earned >= PLUS_THRESHOLD
             else BASIC
    input_set: "lifetime_points_earned only - reversals and redemptions never lower the tier"
    constants:
      PLUS_THRESHOLD: 500
      ELITE_THRESHOLD: 2000
    precision: "integer comparison with >= at both boundaries"

  - name: waste_valuation
    trigger: "every WasteLog append (operator discard, impairment sweep, daypart sweep) and every KitchenTicket reopen"
    algorithm: aggregation
    formula: |
      FOOD_COST variant:  value_cents = qty * MenuItem.unit_food_cost_cents
      RETAIL    variant:  value_cents = qty * MenuItem.base_price_cents
      WasteLog.food_cost_cents    = FOOD_COST(qty)
      WasteLog.retail_value_cents = RETAIL(qty)
      Store.waste_cost_cents_mtd += FOOD_COST(qty)                       # food-cost basis only
      readiness.retail_waste_exposure_cents = sum(RETAIL over WasteLog rows of this store)
      reopen: Store.rework_waste_cents_mtd += sum(MenuItem.unit_food_cost_cents * OrderLine.qty
                                                  for lines of the reopened ticket)   # FOOD_COST basis
    input_set: |
      Store.waste_cost_cents_mtd accumulates every WasteLog whose ProductionBatch.store_id == store.id,
      with no date filter (the benchmark treats the whole run as one month-to-date period).
      readiness.retail_waste_exposure_cents aggregates the same row set on the RETAIL basis.
    constants: {}
    precision: "integer cents; both variants are exact multiplications"
    variants:
      - name: FOOD_COST
        when: "operational cost accounting - WasteLog.food_cost_cents, Store.waste_cost_cents_mtd, Store.rework_waste_cents_mtd"
        difference: "values each unit at MenuItem.unit_food_cost_cents (ingredient cost)"
      - name: RETAIL
        when: "health-inspection and shrink reporting - WasteLog.retail_value_cents and GET /stores/{id}/readiness"
        difference: "values each unit at MenuItem.base_price_cents (menu price), producing a strictly larger number whenever unit_food_cost_cents < base_price_cents"

  - name: kitchen_ticket_prep_seconds
    trigger: "KitchenTicket creation inside POST /orders/{id}/place"
    algorithm: aggregation
    formula: |
      modifier_units(l) = sum(m.qty for m in l.modifiers)
      prep_seconds = sum( MenuItem(l).prep_seconds * l.qty
                          + MODIFIER_PREP_SECONDS * modifier_units(l) * l.qty
                          for l in lines of this order
                          where MenuItem(l).fulfillment_mode == MADE_TO_ORDER
                            and MenuItem(l).station == this ticket's station )
    input_set: "only MADE_TO_ORDER lines of this order routed to this ticket's station; PAR_BAKED_CASE lines never contribute"
    constants:
      MODIFIER_PREP_SECONDS: 15
    precision: "integer seconds"

  - name: station_queue_sequencing
    trigger: "KitchenTicket creation inside POST /orders/{id}/place"
    algorithm: chronological
    formula: |
      queue(store, station) = [ t for t in KitchenTicket
                                if t.store_id == store.id and t.station == station
                                and t.status IN {QUEUED, IN_PROGRESS} ]
                              ordered by t.created_at ASC, then t.sequence_position ASC
      sequence_position = 1 + count(queue(store, station))          # evaluated BEFORE inserting
      lead_seconds      = sum(t.prep_seconds for t in queue(store, station))
      promised_ready_at = logical_clock + lead_seconds + prep_seconds        # whole seconds
      Order.expected_ready_at = max(promised_ready_at over the tickets created by this placement)
                                if at least one ticket was created, else Order.placed_at
    input_set: |
      DONE and VOIDED tickets are excluded from the queue, so completing or voiding work shortens the
      lead time seen by the NEXT placement. Tickets created earlier in the same placement are already
      inserted when the next station's ticket is computed (stations are processed in the fixed order
      SANDWICH, BEVERAGE, HOT_FOOD, BAKERY), but they never share a queue so they never affect it.
    constants: {}
    precision: "integer seconds; promised_ready_at is serialized like every other datetime, as
      YYYY-MM-DDTHH:MM:SSZ with no fractional part"

  - name: batch_selection_fefo
    trigger: "POST /orders/{id}/place, once per PAR_BAKED_CASE line"
    algorithm: waterfall_allocation
    formula: |
      candidates = [ b for b in ProductionBatch
                     if b.store_id == Order.store_id
                     and b.menu_item_id == line.menu_item_id
                     and b.status == HOLDING
                     and b.hold_expires_at > logical_clock          # STRICTLY greater
                     and b.remaining_qty >= line.qty ]              # no split across batches
      rank_key(b) = ( b.hold_expires_at, b.created_at )             # first-expiring-first-out
      selected = min(candidates, key=rank_key)
      if candidates is empty: reject the placement with ERR_INSUFFICIENT_BATCH_QTY
    input_set: "only HOLDING batches of the same store and menu item whose hold has not expired and which can cover the whole line by themselves"
    constants: {}
    precision: "datetime comparison at millisecond resolution"
    note: |
      A batch whose hold_expires_at equals the logical clock is EXPIRED and excluded (the comparison
      is strictly greater). Lines are processed in OrderLine.created_at ASC order, so two par-baked
      lines competing for the same scarce batch are served oldest-line-first.

  - name: slot_occupancy_conflict
    trigger: "POST /production-batches"
    algorithm: interval_merge
    formula: |
      occupancy(b) = [ b.bake_start_at,
                       b.bake_start_at + MenuItem(b).bake_minutes
                                       + MenuItem(b).hold_minutes
                                       + SANITATION_BUFFER_MINUTES )      # half-open, buffer folded in
      b.occupancy_end_at = the right bound above
      conflict = exists e in ProductionBatch
                 where e.holding_unit_id == new.holding_unit_id
                   and e.slot_index      == new.slot_index
                   and e.status IN {PLANNED, BAKING, HOLDING}
                   and new.bake_start_at < e.occupancy_end_at
                   and e.bake_start_at   < new.occupancy_end_at
      if conflict: reject with ERR_UNIT_SLOT_CONFLICT
    input_set: "non-terminal batches (PLANNED, BAKING, HOLDING) on the SAME (holding_unit_id, slot_index) pair; SOLD_OUT and DISCARDED batches free their slot immediately"
    constants:
      SANITATION_BUFFER_MINUTES: 15
    precision: "minute arithmetic on ISO instants"
    note: |
      Interval semantics: EXCLUSIVE-BUFFERED. The mandatory sanitation window is folded into
      occupancy_end_at, so a new batch whose bake_start_at equals an existing occupancy_end_at is
      ACCEPTED (touching is legal) while a start one minute earlier is rejected.

  - name: pickup_window_capacity
    trigger: "POST /orders/{id}/place for channel IN {MOBILE_PREORDER, CATERING}"
    algorithm: aggregation
    formula: |
      overlapping = count( o for o in Order
                           where o.id != this order's id
                           and o.store_id == this.store_id
                           and o.channel IN {MOBILE_PREORDER, CATERING}
                           and o.production_status IN {PLACED, IN_PRODUCTION, ASSEMBLED, READY}
                           and this.pickup_window_start < o.pickup_window_end
                           and o.pickup_window_start   < this.pickup_window_end )
      if overlapping >= Store.pickup_slot_capacity: reject with ERR_PICKUP_WINDOW_FULL
    input_set: "other orders of the same store in a non-terminal production state; DRAFT, PICKED_UP and VOIDED orders are excluded and TOUCHSCREEN orders never occupy a window"
    constants:
      PREORDER_LEAD_MINUTES: 15
      CATERING_LEAD_MINUTES: 720
      CATERING_MIN_SUBTOTAL_CENTS: 5000
    precision: "millisecond datetime comparison"
    note: |
      Interval semantics: HALF-OPEN AGGREGATE. Windows that merely touch (one ends exactly when the
      other starts) do NOT overlap, and the capacity is a COUNT of concurrent windows rather than an
      exclusive single-occupant reservation - deliberately different geometry from
      slot_occupancy_conflict.

  - name: staffing_labor_minutes
    trigger: "POST /stores/{id}/staffing-plans"
    algorithm: tiered_pricing
    formula: |
      mto_txn  = ceil(forecast_txn_count * mto_share_bp / 10000)
      grab_txn = forecast_txn_count - mto_txn
      raw = ceil(mto_txn  / MTO_TXNS_PER_LABOR_HOUR)  * 60
          + ceil(grab_txn / GRAB_TXNS_PER_LABOR_HOUR) * 60
          + (BAKERY_PREP_MINUTES if daypart == BREAKFAST else 0)
      peak_multiplier_bp = PEAK_MULTIPLIER_BP if forecast_txn_count >= PEAK_TXN_THRESHOLD else 10000
      planned_labor_minutes = max( MIN_DAYPART_MINUTES,
                                   round_half_up(raw * peak_multiplier_bp / 10000) )
    input_set: "the plan's own forecast_txn_count, mto_share_bp and daypart; no other plan participates"
    constants:
      MTO_TXNS_PER_LABOR_HOUR: 18
      GRAB_TXNS_PER_LABOR_HOUR: 45
      BAKERY_PREP_MINUTES: 120
      PEAK_TXN_THRESHOLD: 400
      PEAK_MULTIPLIER_BP: 11500
      MIN_DAYPART_MINUTES: 180
    precision: "ceil on each station term BEFORE summing; a single round_half_up after the peak multiplier; the max() floor is applied last"
    note: |
      Three inputs interact non-linearly: the two ceil() terms are per-station (so the split matters,
      not just the total), the BREAKFAST branch adds a constant, the peak multiplier is a threshold
      selection at exactly PEAK_TXN_THRESHOLD (>=), and MIN_DAYPART_MINUTES is a floor applied after
      the multiplier rather than before it.

  - name: fuel_gallons_30d
    trigger: "promotion_selection eligibility for FUEL_FOOD_COMBO rules"
    algorithm: aggregation
    formula: |
      window_start = logical_clock - FUEL_LOOKBACK_DAYS days
      fuel_gallons_30d = sum( f.gallons for f in FuelTransaction
                              where f.loyalty_account_id == Order.loyalty_account_id
                              and f.occurred_at >= window_start        # inclusive lower bound
                              and f.occurred_at <= logical_clock )    # inclusive upper bound
    input_set: "FuelTransaction rows of exactly one loyalty account inside the closed look-back window"
    constants:
      FUEL_LOOKBACK_DAYS: 30
    precision: "gallons summed at 3 decimal places; the comparison against requires_fuel_gallons uses >="

  - name: inspection_readiness
    trigger: "GET /stores/{id}/readiness"
    algorithm: weighted_scoring
    formula: |
      units          = [ u for u in HoldingUnit where u.store_id == store.id ]
      logged_recently = [ u for u in units
                          if exists t in TemperatureLog with t.holding_unit_id == u.id
                             and t.recorded_at >= logical_clock - TEMP_LOG_WINDOW_MINUTES minutes ]
      temp_log_compliance_pct = 100 if units is empty
                                else round_half_up(100 * len(logged_recently) / len(units))
      units_impaired_count    = count(u in units where u.status == IMPAIRED)
      units_locked_out_count  = count(u in units where u.status == LOCKED_OUT)
      open_corrective_actions_count = count(CorrectiveAction with status == OPEN whose
                                            TemperatureLog.holding_unit_id is in units)
      food_cost_waste_cents_mtd = Store.waste_cost_cents_mtd + Store.rework_waste_cents_mtd
      retail_waste_exposure_cents = sum(WasteLog.retail_value_cents over batches of this store)
      readiness_status = NOT_READY if units_locked_out_count >= 1
                                     or temp_log_compliance_pct < NOT_READY_COMPLIANCE_PCT
                         else AT_RISK if open_corrective_actions_count >= 1
                                     or units_impaired_count >= 1
                                     or temp_log_compliance_pct < READY_COMPLIANCE_PCT
                         else READY
    input_set: "all HoldingUnit rows of the store, their newest TemperatureLog inside the window, all OPEN CorrectiveAction rows reachable from those units, and every WasteLog of the store's batches"
    constants:
      TEMP_LOG_WINDOW_MINUTES: 240
      READY_COMPLIANCE_PCT: 90
      NOT_READY_COMPLIANCE_PCT: 75
    precision: "temp_log_compliance_pct is an integer percentage, round_half_up, 0 decimals"

  - name: batch_qty_invariant
    trigger: "asserted after every ProductionBatch mutation (bake, top-off, pull, reserve, release, sale conversion, discard, sweep)"
    algorithm: aggregation
    formula: |
      ProductionBatch.baked_qty
        == ProductionBatch.remaining_qty + ProductionBatch.reserved_qty
         + ProductionBatch.sold_qty      + ProductionBatch.discarded_qty
      # and, per batch:
      ProductionBatch.reserved_qty == sum(OrderLine.reserved_qty
                                          for lines with fulfillment_batch_id == batch.id)
    input_set: "one batch and every OrderLine pointing at it"
    constants: {}
    precision: "exact integer equality - the placement/void pair is the compensating pair that must not drift"

  - name: loyalty_points_invariant
    trigger: "asserted after every LoyaltyAccount mutation (placement accrual, settlement delta, refund reversal, void reversal, points adjustment)"
    algorithm: aggregation
    formula: |
      LoyaltyAccount.points_balance
        == LoyaltyAccount.lifetime_points_earned
         - LoyaltyAccount.lifetime_points_redeemed
         - LoyaltyAccount.points_reversed_total
    input_set: "one loyalty account"
    constants: {}
    precision: "exact integer equality - the settle/refund pair and the place/void pair are the compensating pairs that must not drift"

# ---------------------------------------------------------------------------
# 1.4 Validation Rules Table (evaluated in ascending priority; first failure wins)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list in section 1.5"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all
  - priority: 3
    category: business_constraint
    check: "request body schema: every required field present, enum members valid, integers within their declared constraints (qty >= 1, capacities >= 1, mto_share_bp in 0..10000), datetimes ISO 8601 UTC, additional_qty present and >= 1 when baking a HOLDING batch, discount_bp present for PCT_PER_LINE rules and discount_cents present for CENTS_OFF rules"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 4
    category: existence
    check: "every path id resolves, validated left to right (store before holding-unit, order before line)"
    error_id: "ERR_STORE_NOT_FOUND | ERR_HOLDING_UNIT_NOT_FOUND | ERR_MENU_ITEM_NOT_FOUND | ERR_LOYALTY_ACCOUNT_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_ORDER_LINE_NOT_FOUND | ERR_KITCHEN_TICKET_NOT_FOUND | ERR_PRODUCTION_BATCH_NOT_FOUND | ERR_CORRECTIVE_ACTION_NOT_FOUND | ERR_STAFFING_PLAN_NOT_FOUND | ERR_PROMOTION_RULE_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 5
    category: existence
    check: "every foreign key in the body resolves, validated in the order the fields are declared in the endpoint's input list"
    error_id: "ERR_STORE_NOT_FOUND | ERR_MENU_ITEM_NOT_FOUND | ERR_MODIFIER_OPTION_NOT_FOUND | ERR_HOLDING_UNIT_NOT_FOUND | ERR_LOYALTY_ACCOUNT_NOT_FOUND | ERR_TEMPERATURE_LOG_NOT_FOUND"
    http_status: 404
    applies_to: "POST /orders, POST /orders/{id}/lines, POST /production-batches, POST /corrective-actions"
  - priority: 6
    category: business_constraint
    check: "code uniqueness: Store.store_code, MenuItem.sku, PromotionRule.code, LoyaltyAccount.member_code chain-wide; HoldingUnit.unit_code per store; ModifierOption.code per menu item"
    error_id: ERR_DUPLICATE_CODE
    http_status: 409
    applies_to: "POST /stores, POST /menu-items, POST /menu-items/{id}/modifier-options, POST /promotion-rules, POST /loyalty-accounts, POST /stores/{id}/holding-units"
  - priority: 7
    category: auth
    check: "when X-User-Role is Customer, the target Order's loyalty_account_id equals X-User-ID"
    error_id: ERR_ORDER_NOT_OWNED
    http_status: 403
    applies_to: "POST /orders/{id}/lines, DELETE /orders/{id}/lines/{line_id}, POST /orders/{id}/place, POST /orders/{id}/authorize, POST /orders/{id}/settle, POST /orders/{id}/pickup, GET /orders/{id}"
  - priority: 8
    category: auth
    check: "segregation of duties: the acting X-User-ID must differ from the actor recorded on the prior step - the TemperatureLog.logged_by_user_id when verifying a CorrectiveAction, the KitchenTicket.completed_by_user_id when reopening a ticket"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /corrective-actions/{id}/verify, POST /kitchen-tickets/{id}/reopen"
  - priority: 9
    category: auth
    check: "clearing a LOCKED_OUT HoldingUnit requires X-User-Role == FoodSafetyLead"
    error_id: ERR_LOCKOUT_REQUIRES_SAFETY_LEAD
    http_status: 403
    applies_to: "POST /corrective-actions/{id}/verify"
  - priority: 10
    category: state
    check: "optimistic concurrency: expected_store_version equals Store.version; expected_batch_version equals ProductionBatch.version"
    error_id: "ERR_STALE_STORE_VERSION | ERR_STALE_BATCH_VERSION"
    http_status: 412
    applies_to: "POST /stores/{id}/staffing-plans, POST /production-batches/{id}/discard"
  - priority: 11
    category: state
    check: "the target resource is in a state that permits the requested transition (see section 1.2 preconditions)"
    error_id: "ERR_ORDER_NOT_DRAFT | ERR_ORDER_PRODUCTION_STATE_INVALID | ERR_ORDER_SETTLEMENT_STATE_INVALID | ERR_ORDER_NOT_REWORKABLE | ERR_TICKET_STATE_INVALID | ERR_BATCH_STATE_INVALID | ERR_PLAN_STATE_INVALID | ERR_ACTION_ALREADY_VERIFIED | ERR_UNIT_NOT_IMPAIRED"
    http_status: 409
    applies_to: "every state-transition endpoint"
  - priority: 12
    category: state
    check: "a LOCKED StaffingPlan for the same (store_id, service_date, daypart) blocks creation of a superseding plan"
    error_id: ERR_PLAN_LOCKED
    http_status: 409
    applies_to: "POST /stores/{id}/staffing-plans"
  - priority: 13
    category: state
    check: "the order has at least one line before it may be placed"
    error_id: ERR_ORDER_EMPTY
    http_status: 422
    applies_to: "POST /orders/{id}/place"
  - priority: 14
    category: state
    check: "cross-entity state: placement requires a StaffingPlan for (store_id, Store.current_daypart, date(clock)) with status IN {PUBLISHED, LOCKED}"
    error_id: ERR_DAYPART_PLAN_NOT_PUBLISHED
    http_status: 409
    applies_to: "POST /orders/{id}/place"
  - priority: 15
    category: state
    check: "cross-entity state: a KitchenTicket may not start until its Order.settlement_status == AUTHORIZED"
    error_id: ERR_ORDER_NOT_AUTHORIZED
    http_status: 409
    applies_to: "POST /kitchen-tickets/{id}/start"
  - priority: 16
    category: business_safety
    check: "cross-entity safety posture: the target HoldingUnit.status must be OPERATIONAL to create, bake or pull a batch in it"
    error_id: ERR_HOLDING_UNIT_NOT_OPERATIONAL
    http_status: 409
    applies_to: "POST /production-batches, POST /production-batches/{id}/bake, POST /production-batches/{id}/pull"
  - priority: 17
    category: business_safety
    check: "a par-baked line may not be fulfilled from a batch whose hold_expires_at <= logical clock"
    error_id: ERR_BATCH_HOLD_EXPIRED
    http_status: 422
    applies_to: "POST /orders/{id}/place"
  - priority: 18
    category: business_safety
    check: "the temperature reading is a number between ABSOLUTE_MIN_READING_F (-40) and ABSOLUTE_MAX_READING_F (250)"
    error_id: ERR_TEMP_READING_OUT_OF_SENSOR_RANGE
    http_status: 422
    applies_to: "POST /holding-units/{id}/temperature-logs"
  - priority: 19
    category: business_referential
    check: "every referenced ModifierOption belongs to the line's menu_item_id"
    error_id: ERR_MODIFIER_NOT_FOR_ITEM
    http_status: 422
    applies_to: "POST /orders/{id}/lines"
  - priority: 20
    category: business_referential
    check: "the MenuItem's valid_dayparts contains Store.current_daypart, checked at line creation and re-checked at placement"
    error_id: ERR_MENU_ITEM_NOT_IN_DAYPART
    http_status: 422
    applies_to: "POST /orders/{id}/lines, POST /orders/{id}/place"
  - priority: 21
    category: business_referential
    check: "on a CATERING order every line's MenuItem.is_catering_eligible is true"
    error_id: ERR_ITEM_NOT_CATERING_ELIGIBLE
    http_status: 422
    applies_to: "POST /orders/{id}/lines, POST /orders/{id}/place"
  - priority: 22
    category: business_referential
    check: "a ProductionBatch may only be planned for a MenuItem whose fulfillment_mode == PAR_BAKED_CASE"
    error_id: ERR_ITEM_NOT_PAR_BAKED
    http_status: 422
    applies_to: "POST /production-batches"
  - priority: 23
    category: business_constraint
    check: "each modifier qty is <= ModifierOption.max_qty and modifier qty >= 1"
    error_id: ERR_MODIFIER_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /orders/{id}/lines"
  - priority: 24
    category: business_constraint
    check: "1 <= slot_index <= HoldingUnit.slot_count"
    error_id: ERR_SLOT_INDEX_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /production-batches"
  - priority: 25
    category: business_constraint
    check: "slot_occupancy_conflict finds no non-terminal batch occupying the same (holding_unit_id, slot_index) interval"
    error_id: ERR_UNIT_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /production-batches"
  - priority: 26
    category: business_constraint
    check: "an operator-declared discard reason must be HOLD_EXPIRED or QUALITY_REJECT; UNIT_IMPAIRED and DAYPART_TRANSITION are system-only"
    error_id: ERR_RESERVED_DISCARD_REASON
    http_status: 422
    applies_to: "POST /production-batches/{id}/discard"
  - priority: 27
    category: business_constraint
    check: "discard qty <= ProductionBatch.remaining_qty"
    error_id: ERR_DISCARD_QTY_EXCEEDS_REMAINING
    http_status: 422
    applies_to: "POST /production-batches/{id}/discard"
  - priority: 28
    category: business_constraint
    check: "the requested to_daypart equals the daypart implied by the logical clock's UTC time-of-day AND differs from Store.current_daypart"
    error_id: ERR_DAYPART_NOT_DUE
    http_status: 409
    applies_to: "POST /stores/{id}/daypart-transitions"
  - priority: 29
    category: business_constraint
    check: "the logical clock may not move backwards: to_iso8601 >= current clock"
    error_id: ERR_CLOCK_REGRESSION
    http_status: 422
    applies_to: "POST /_clock/set_current_utc"
  - priority: 30
    category: business_constraint
    check: "a negative points adjustment may not drive points_balance below zero"
    error_id: ERR_POINTS_BALANCE_NEGATIVE
    http_status: 422
    applies_to: "POST /loyalty-accounts/{id}/points-adjustments"
  - priority: 31
    category: business_temporal
    check: "TOUCHSCREEN orders must carry no pickup window"
    error_id: ERR_PICKUP_WINDOW_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /orders, POST /orders/{id}/place"
  - priority: 32
    category: business_temporal
    check: "MOBILE_PREORDER and CATERING orders must carry both pickup window bounds"
    error_id: ERR_PICKUP_WINDOW_REQUIRED
    http_status: 422
    applies_to: "POST /orders, POST /orders/{id}/place"
  - priority: 33
    category: business_temporal
    check: "pickup_window_end > pickup_window_start"
    error_id: ERR_PICKUP_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /orders"
  - priority: 34
    category: business_temporal
    check: "pickup_window_start - logical clock >= PREORDER_LEAD_MINUTES (15) for MOBILE_PREORDER, >= CATERING_LEAD_MINUTES (720) for CATERING"
    error_id: ERR_PREORDER_LEAD_TIME_TOO_SHORT
    http_status: 422
    applies_to: "POST /orders/{id}/place"
  - priority: 35
    category: business_temporal
    check: "pickup_window_end > logical clock at placement (a window that ends exactly now has elapsed)"
    error_id: ERR_PICKUP_WINDOW_ELAPSED
    http_status: 409
    applies_to: "POST /orders/{id}/place"
  - priority: 36
    category: business_temporal
    check: "pickup_window_capacity: the count of other overlapping in-flight pre-order/catering orders is < Store.pickup_slot_capacity"
    error_id: ERR_PICKUP_WINDOW_FULL
    http_status: 409
    applies_to: "POST /orders/{id}/place"
  - priority: 37
    category: business_temporal
    check: "release and pickup of a MOBILE_PREORDER or CATERING order require logical clock >= pickup_window_start"
    error_id: ERR_PICKUP_WINDOW_NOT_OPEN
    http_status: 409
    applies_to: "POST /orders/{id}/release, POST /orders/{id}/pickup"
  - priority: 38
    category: business_fiscal
    check: "Store.hot_case_slots_used < Store.hot_case_slot_capacity before a batch enters BAKING"
    error_id: ERR_HOT_CASE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /production-batches/{id}/bake"
  - priority: 39
    category: business_fiscal
    check: "batch_selection_fefo yields a covering batch for every PAR_BAKED_CASE line"
    error_id: ERR_INSUFFICIENT_BATCH_QTY
    http_status: 422
    applies_to: "POST /orders/{id}/place"
  - priority: 40
    category: business_fiscal
    check: "a CATERING order's subtotal_gross_cents >= CATERING_MIN_SUBTOTAL_CENTS (5000)"
    error_id: ERR_ORDER_MINIMUM_NOT_MET
    http_status: 422
    applies_to: "POST /orders/{id}/place"

# ---------------------------------------------------------------------------
# 1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  # --- chain configuration -------------------------------------------------
  - method: POST
    path: "/stores"
    description: "register a store site"
    roles: [ChainAdmin]
    code: 201
    input: [store_code, name, hot_case_slot_capacity, pickup_slot_capacity, "is_fuel_site?"]
    output: Store
    side_effects: ["Store created with current_daypart BREAKFAST, daypart_epoch 0, version 1"]
  - method: GET
    path: "/stores/{id}"
    description: "read one store, including current_daypart, slot usage, waste totals and version"
    roles: [ChainAdmin, StoreManager, KitchenAssociate, ShiftLead, FoodSafetyLead, StoreTerminal]
    code: 200
    input: []
    output: Store
    side_effects: []
  - method: POST
    path: "/stores/{id}/holding-units"
    description: "add a holding unit to a store"
    roles: [ChainAdmin, StoreManager]
    code: 201
    input: [unit_code, unit_type, min_temp_f, max_temp_f, slot_count]
    output: HoldingUnit
    side_effects: ["HoldingUnit created with status OPERATIONAL and consecutive_out_of_range_count 0"]
  - method: GET
    path: "/stores/{id}/holding-units"
    description: "list the store's holding units with their safety posture"
    roles: [ChainAdmin, StoreManager, KitchenAssociate, ShiftLead, FoodSafetyLead]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: HoldingUnit[]
    side_effects: []
  - method: GET
    path: "/holding-units/{id}"
    description: "read one holding unit"
    roles: [ChainAdmin, StoreManager, KitchenAssociate, ShiftLead, FoodSafetyLead]
    code: 200
    input: []
    output: HoldingUnit
    side_effects: []
  - method: POST
    path: "/menu-items"
    description: "create a chain menu item"
    roles: [ChainAdmin]
    code: 201
    input: [sku, name, station, fulfillment_mode, base_price_cents, unit_food_cost_cents, valid_dayparts, "prep_seconds?", "bake_minutes?", "hold_minutes?", "included_premium_count?", "is_catering_eligible?"]
    output: MenuItem
    side_effects: []
  - method: GET
    path: "/menu-items/{id}"
    description: "read one menu item"
    roles: [ChainAdmin, StoreManager, StoreTerminal, Customer, KitchenAssociate]
    code: 200
    input: []
    output: MenuItem
    side_effects: []
  - method: POST
    path: "/menu-items/{id}/modifier-options"
    description: "add a build customization option to a menu item"
    roles: [ChainAdmin]
    code: 201
    input: [code, modifier_class, price_delta_cents, "is_premium?", "max_qty?"]
    output: ModifierOption
    side_effects: []
  - method: GET
    path: "/menu-items/{id}/modifier-options"
    description: "list a menu item's build options"
    roles: [ChainAdmin, StoreTerminal, Customer, KitchenAssociate]
    code: 200
    input: ["modifier_class?", "limit?", "offset?"]
    output: ModifierOption[]
    side_effects: []
  - method: POST
    path: "/promotion-rules"
    description: "create a promotion rule"
    roles: [ChainAdmin]
    code: 201
    input: [code, kind, discount_kind, max_discount_cents, valid_dayparts, stacking_rank, "discount_bp?", "discount_cents?", "min_food_subtotal_cents?", "requires_fuel_gallons?", "target_station?"]
    output: PromotionRule
    side_effects: ["PromotionRule created with status ACTIVE"]
  - method: POST
    path: "/promotion-rules/{id}/suspend"
    description: "suspend a promotion rule so promotion_selection stops considering it"
    roles: [ChainAdmin]
    code: 200
    input: []
    output: PromotionRule
    side_effects: ["status -> SUSPENDED; already-placed orders keep their applied_promotion_id and discount"]
  - method: GET
    path: "/promotion-rules"
    description: "list promotion rules"
    roles: [ChainAdmin, StoreManager]
    code: 200
    input: ["status?", "kind?", "limit?", "offset?"]
    output: PromotionRule[]
    side_effects: []

  # --- loyalty and fuel ----------------------------------------------------
  - method: POST
    path: "/loyalty-accounts"
    description: "enroll a loyalty member"
    roles: [ChainAdmin, StoreTerminal]
    code: 201
    input: [member_code, email]
    output: LoyaltyAccount
    side_effects: ["account created with all point counters 0 and tier BASIC"]
  - method: GET
    path: "/loyalty-accounts/{id}"
    description: "read one loyalty account with its point counters and tier"
    roles: [ChainAdmin, StoreManager, StoreTerminal, Customer]
    code: 200
    input: []
    output: LoyaltyAccount
    side_effects: []
  - method: POST
    path: "/loyalty-accounts/{id}/points-adjustments"
    description: "customer-care point adjustment; positive deltas count as earned, negative deltas as redeemed"
    roles: [ChainAdmin]
    code: 200
    input: [delta_points, reason]
    output: LoyaltyAccount
    side_effects:
      - "delta_points > 0: points_balance += delta; lifetime_points_earned += delta"
      - "delta_points < 0: points_balance += delta; lifetime_points_redeemed += -delta"
      - "recompute tier via loyalty_tier_derivation; increments LoyaltyAccount.version by 1"
  - method: POST
    path: "/loyalty-accounts/{id}/fuel-transactions"
    description: "record a fuel sale against a loyalty account (feeds fuel_gallons_30d)"
    roles: [ChainAdmin, StoreTerminal]
    code: 201
    input: [gallons, price_per_gallon_cents, occurred_at]
    output: FuelTransaction
    side_effects: ["FuelTransaction appended with computed fuel_spend_cents"]
  - method: GET
    path: "/loyalty-accounts/{id}/fuel-transactions"
    description: "list a member's fuel sales"
    roles: [ChainAdmin, StoreManager, StoreTerminal, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: FuelTransaction[]
    side_effects: []

  # --- labor scheduling ----------------------------------------------------
  - method: POST
    path: "/stores/{id}/staffing-plans"
    description: "create a daypart labor plan from a forecast transaction count; supersedes any DRAFT or PUBLISHED plan for the same (store, service_date, daypart)"
    roles: [StoreManager]
    code: 201
    input: [service_date, daypart, forecast_txn_count, mto_share_bp, expected_store_version]
    output: StaffingPlan
    side_effects:
      - "runs staffing_labor_minutes -> planned_labor_minutes, peak_multiplier_bp"
      - "any existing DRAFT or PUBLISHED plan for the same (store_id, service_date, daypart) transitions to SUPERSEDED"
      - "increments Store.version by 1"
  - method: GET
    path: "/stores/{id}/staffing-plans"
    description: "list a store's labor plans"
    roles: [ChainAdmin, StoreManager]
    code: 200
    input: ["daypart?", "service_date?", "status?", "limit?", "offset?"]
    output: StaffingPlan[]
    side_effects: []
  - method: POST
    path: "/staffing-plans/{id}/publish"
    description: "publish a labor plan, authorizing order placement in its daypart"
    roles: [StoreManager]
    code: 200
    input: []
    output: StaffingPlan
    side_effects: ["status DRAFT -> PUBLISHED; increments StaffingPlan.version by 1"]
  - method: POST
    path: "/staffing-plans/{id}/lock"
    description: "lock a published plan so it can no longer be superseded"
    roles: [StoreManager]
    code: 200
    input: []
    output: StaffingPlan
    side_effects: ["status PUBLISHED -> LOCKED; increments StaffingPlan.version by 1"]

  # --- par-baked production ------------------------------------------------
  - method: POST
    path: "/production-batches"
    description: "plan a par-baked production batch into a holding-unit slot"
    roles: [StoreManager, KitchenAssociate]
    code: 201
    input: [store_id, menu_item_id, holding_unit_id, slot_index, planned_qty, bake_start_at]
    output: ProductionBatch
    side_effects:
      - "runs slot_occupancy_conflict; computes occupancy_end_at"
      - "batch created with status PLANNED and all quantity counters 0"
  - method: GET
    path: "/production-batches/{id}"
    description: "read one batch with its quantity ledger, hold clock and version"
    roles: [ChainAdmin, StoreManager, KitchenAssociate, ShiftLead, FoodSafetyLead]
    code: 200
    input: []
    output: ProductionBatch
    side_effects: []
  - method: GET
    path: "/production-batches"
    description: "list batches filtered by store, item, unit or status"
    roles: [ChainAdmin, StoreManager, KitchenAssociate, ShiftLead]
    code: 200
    input: ["store_id?", "menu_item_id?", "holding_unit_id?", "status?", "limit?", "offset?"]
    output: ProductionBatch[]
    side_effects: []
  - method: POST
    path: "/production-batches/{id}/bake"
    description: "oven-in a PLANNED batch, or top off a HOLDING batch with additional_qty (the cycle edge)"
    roles: [KitchenAssociate]
    code: 200
    input: ["additional_qty?"]
    output: ProductionBatch
    side_effects:
      - "PLANNED -> BAKING: baked_qty = remaining_qty = planned_qty; Store.hot_case_slots_used += 1; Store.version += 1"
      - "HOLDING -> BAKING: baked_qty += additional_qty; remaining_qty += additional_qty; hold clock cleared"
      - "increments ProductionBatch.version by 1"
  - method: POST
    path: "/production-batches/{id}/pull"
    description: "pull a baked batch into the case, starting its hold clock"
    roles: [KitchenAssociate]
    code: 200
    input: []
    output: ProductionBatch
    side_effects: ["BAKING -> HOLDING; hold_started_at = clock; hold_expires_at = clock + MenuItem.hold_minutes; increments ProductionBatch.version by 1"]
  - method: POST
    path: "/production-batches/{id}/discard"
    description: "write off units from a holding batch and append a WasteLog"
    roles: [KitchenAssociate, ShiftLead]
    code: 200
    input: [qty, reason, expected_batch_version]
    output: ProductionBatch
    side_effects:
      - "remaining_qty -= qty; discarded_qty += qty; WasteLog appended with both waste_valuation variants"
      - "Store.waste_cost_cents_mtd += WasteLog.food_cost_cents; Store.version += 1"
      - "batch -> DISCARDED and Store.hot_case_slots_used -= 1 when remaining_qty and reserved_qty both reach 0"
      - "increments ProductionBatch.version by 1"
  - method: GET
    path: "/production-batches/{id}/waste-logs"
    description: "list the write-off events of a batch (inspection binder evidence)"
    roles: [ChainAdmin, StoreManager, ShiftLead, FoodSafetyLead]
    code: 200
    input: ["reason?", "limit?", "offset?"]
    output: WasteLog[]
    side_effects: []

  # --- food safety ---------------------------------------------------------
  - method: POST
    path: "/holding-units/{id}/temperature-logs"
    description: "record a probe reading; an out-of-band reading impairs or locks out the unit and sweeps its holding batches"
    roles: [KitchenAssociate, ShiftLead, FoodSafetyLead]
    code: 201
    input: [reading_f]
    output: TemperatureLog
    side_effects:
      - "in_range computed against the unit's band (both bounds inclusive); logged_by_user_id = X-User-ID; recorded_at = clock"
      - "unit.last_temp_log_at updated"
      - "out of band: OPERATIONAL -> IMPAIRED or IMPAIRED -> LOCKED_OUT, then the impairment sweep discards the unit's unreserved HOLDING batches, appending UNIT_IMPAIRED WasteLog rows and updating Store.waste_cost_cents_mtd and Store.hot_case_slots_used"
  - method: GET
    path: "/holding-units/{id}/temperature-logs"
    description: "list a unit's probe readings newest-first"
    roles: [ChainAdmin, StoreManager, KitchenAssociate, ShiftLead, FoodSafetyLead]
    code: 200
    input: ["in_range?", "limit?", "offset?"]
    output: TemperatureLog[]
    side_effects: []
  - method: POST
    path: "/corrective-actions"
    description: "open a corrective action against an out-of-range reading"
    roles: [ShiftLead, FoodSafetyLead, KitchenAssociate]
    code: 201
    input: [temperature_log_id, action_taken]
    output: CorrectiveAction
    side_effects: ["created with status OPEN and opened_by_user_id = X-User-ID"]
  - method: POST
    path: "/corrective-actions/{id}/verify"
    description: "verify a corrective action; a second actor is required and the unit returns to OPERATIONAL"
    roles: [ShiftLead, FoodSafetyLead]
    code: 200
    input: []
    output: CorrectiveAction
    side_effects:
      - "status OPEN -> VERIFIED; verified_by_user_id = X-User-ID; verified_at = clock"
      - "HoldingUnit IMPAIRED -> OPERATIONAL or LOCKED_OUT -> OPERATIONAL; consecutive_out_of_range_count = 0"
      - "increments CorrectiveAction.version and HoldingUnit.version by 1"
  - method: GET
    path: "/corrective-actions"
    description: "list corrective actions filtered by reading or status"
    roles: [ChainAdmin, StoreManager, ShiftLead, FoodSafetyLead]
    code: 200
    input: ["temperature_log_id?", "status?", "limit?", "offset?"]
    output: CorrectiveAction[]
    side_effects: []
  - method: GET
    path: "/corrective-actions/{id}"
    description: "read one corrective action"
    roles: [ChainAdmin, StoreManager, ShiftLead, FoodSafetyLead]
    code: 200
    input: []
    output: CorrectiveAction
    side_effects: []
  - method: GET
    path: "/stores/{id}/readiness"
    description: "health-inspection readiness summary (computed read, nothing persisted)"
    roles: [StoreManager, FoodSafetyLead, ChainAdmin]
    code: 200
    input: []
    output: { temp_log_compliance_pct: integer, units_impaired_count: integer, units_locked_out_count: integer, open_corrective_actions_count: integer, food_cost_waste_cents_mtd: integer, retail_waste_exposure_cents: integer, readiness_status: string }
    side_effects: []

  # --- touchscreen order capture -------------------------------------------
  - method: POST
    path: "/orders"
    description: "open a DRAFT order on the TOUCHSCREEN, MOBILE_PREORDER or CATERING channel"
    roles: [StoreTerminal, Customer]
    code: 201
    input: [store_id, channel, "loyalty_account_id?", "pickup_window_start?", "pickup_window_end?"]
    output: Order
    side_effects: ["Order created with production_status DRAFT and settlement_status UNPAID; subtotal_gross_cents, promo_discount_cents, service_fee_cents, total_cents, points_provisional, points_final and rework_count all 0; daypart_at_placement null until placement"]
  - method: GET
    path: "/orders/{id}"
    description: "read one order with both status axes, the money ledger and the promised ready time"
    roles: [StoreTerminal, Customer, StoreManager, ShiftLead, KitchenAssociate, ChainAdmin]
    code: 200
    input: []
    output: Order
    side_effects: []
  - method: GET
    path: "/orders"
    description: "list orders filtered by store, member, applied promotion or production status"
    roles: [StoreManager, ShiftLead, ChainAdmin, StoreTerminal]
    code: 200
    input: ["store_id?", "loyalty_account_id?", "applied_promotion_id?", "production_status?", "settlement_status?", "channel?", "limit?", "offset?"]
    output: Order[]
    side_effects: []
  - method: POST
    path: "/orders/{id}/lines"
    description: "add a customized build to a DRAFT order; modifiers is a list of {modifier_option_id, qty}"
    roles: [StoreTerminal, Customer]
    code: 201
    input: [menu_item_id, qty, "modifiers?"]
    output: OrderLine
    side_effects:
      - "station = MenuItem.station; runs line_gross_pricing -> unit_price_cents, premium_surcharge_cents, line_gross_cents"
      - "line_discount_cents and line_net_cents stay 0 until placement; reserved_qty 0 and fulfillment_batch_id null"
      - "recomputes Order.subtotal_gross_cents = sum(OrderLine.line_gross_cents); increments Order.version by 1"
  - method: DELETE
    path: "/orders/{id}/lines/{line_id}"
    description: "remove a build from a DRAFT order"
    roles: [StoreTerminal, Customer]
    code: 204
    input: []
    output: null
    side_effects: ["OrderLine deleted; Order.subtotal_gross_cents recomputed as sum(OrderLine.line_gross_cents); increments Order.version by 1"]
  - method: GET
    path: "/order-lines/{id}"
    description: "read one order line with its modifier pricing breakdown"
    roles: [StoreTerminal, Customer, StoreManager, ShiftLead, KitchenAssociate]
    code: 200
    input: []
    output: OrderLine
    side_effects: []
  - method: GET
    path: "/order-lines"
    description: "list order lines filtered by order, menu item or fulfilling batch"
    roles: [StoreTerminal, Customer, StoreManager, ShiftLead, KitchenAssociate]
    code: 200
    input: ["order_id?", "menu_item_id?", "fulfillment_batch_id?", "limit?", "offset?"]
    output: OrderLine[]
    side_effects: []
  - method: POST
    path: "/orders/{id}/place"
    description: "commit a DRAFT order: price it, select the promotion, reserve par-baked stock and cut kitchen tickets"
    roles: [StoreTerminal, Customer]
    code: 200
    input: []
    output: Order
    side_effects:
      - "placed_at = clock; daypart_at_placement = Store.current_daypart"
      - "runs promotion_selection -> applied_promotion_id, then promotion_discount -> per-line line_discount_cents and line_net_cents and Order.promo_discount_cents, then order_total_assembly -> service_fee_cents and total_cents"
      - "for each PAR_BAKED_CASE line batch_selection_fefo reserves stock: line.fulfillment_batch_id set, line.reserved_qty = line.qty, batch.remaining_qty -= qty, batch.reserved_qty += qty, batch.version += 1"
      - "one KitchenTicket per distinct station among the MADE_TO_ORDER lines is cut in QUEUED with sequence_position, prep_seconds, lead_seconds and promised_ready_at from station_queue_sequencing"
      - "expected_ready_at = max(KitchenTicket.promised_ready_at) over the created tickets, else placed_at"
      - "production_status DRAFT -> PLACED, cascading -> ASSEMBLED -> READY when zero tickets were created and the ready gate holds"
      - "if loyalty_account_id is non-null: points_provisional = loyalty_points_accrual/PROVISIONAL, account.points_balance += it, account.lifetime_points_earned += it, tier re-derived, account.version += 1"
      - "increments Order.version by 1"
  - method: POST
    path: "/orders/{id}/authorize"
    description: "authorize tender for a placed order"
    roles: [StoreTerminal, Customer]
    code: 200
    input: [tender_type]
    output: Order
    side_effects:
      - "settlement_status UNPAID -> AUTHORIZED; tender_type recorded"
      - "unblocks POST /kitchen-tickets/{id}/start for every ticket of this order"
      - "no points move on this axis; increments Order.version by 1"
  - method: POST
    path: "/orders/{id}/settle"
    description: "settle an authorized order and post final loyalty points"
    roles: [StoreTerminal, Customer]
    code: 200
    input: []
    output: Order
    side_effects:
      - "settlement_status AUTHORIZED -> SETTLED"
      - "if loyalty_account_id is non-null: points_final = loyalty_points_accrual/FINAL; delta = points_final - points_provisional; account.points_balance += delta; account.lifetime_points_earned += delta; tier re-derived; account.version += 1"
      - "if loyalty_account_id is null: points_final = 0"
      - "increments Order.version by 1"
  - method: POST
    path: "/orders/{id}/refund"
    description: "refund a settled order and reverse its posted points"
    roles: [StoreManager, ShiftLead]
    code: 200
    input: [reason]
    output: Order
    side_effects:
      - "settlement_status SETTLED -> REFUNDED; the refunded amount is Order.total_cents"
      - "if loyalty_account_id is non-null: account.points_balance -= points_final; account.points_reversed_total += points_final; account.version += 1 (lifetime_points_earned and tier stay where settlement left them)"
      - "increments Order.version by 1"
  - method: POST
    path: "/orders/{id}/release"
    description: "operator path that releases an ASSEMBLED pre-order or catering order to READY once its pickup window has opened"
    roles: [StoreTerminal, StoreManager]
    code: 200
    input: []
    output: Order
    side_effects:
      - "production_status ASSEMBLED -> READY; ready_at = clock"
      - "for every line with fulfillment_batch_id: batch.reserved_qty -= line.reserved_qty; batch.sold_qty += line.reserved_qty; line.reserved_qty = 0; batch.version += 1"
      - "a touched batch with remaining_qty 0 and reserved_qty 0 transitions HOLDING -> SOLD_OUT, decrementing Store.hot_case_slots_used by 1 and incrementing Store.version by 1"
      - "increments Order.version by 1"
  - method: POST
    path: "/orders/{id}/void"
    description: "void an order before pickup, returning reserved par-baked stock and voiding open tickets"
    roles: [StoreTerminal, ShiftLead]
    code: 200
    input: [reason]
    output: Order
    side_effects:
      - "production_status -> VOIDED from DRAFT, PLACED, IN_PRODUCTION or ASSEMBLED"
      - "every KitchenTicket of the order in QUEUED or IN_PROGRESS -> VOIDED; DONE tickets are left untouched"
      - "for every line with fulfillment_batch_id and reserved_qty > 0: batch.remaining_qty += line.reserved_qty; batch.reserved_qty -= line.reserved_qty; line.reserved_qty = 0; batch.version += 1 (batch status unchanged)"
      - "if points_provisional > 0: account.points_balance -= points_provisional; account.points_reversed_total += points_provisional; account.version += 1"
      - "if settlement_status == AUTHORIZED it moves to RELEASED on the settlement axis; no points move there"
      - "increments Order.version by 1"
  - method: POST
    path: "/orders/{id}/pickup"
    description: "hand a READY order to the customer inside its pickup window"
    roles: [StoreTerminal, Customer]
    code: 200
    input: []
    output: Order
    side_effects:
      - "production_status READY -> PICKED_UP (terminal); the reservation-to-sale conversion already happened on entering READY"
      - "increments Order.version by 1"

  # --- kitchen sequencing --------------------------------------------------
  - method: GET
    path: "/orders/{id}/kitchen-tickets"
    description: "list the tickets cut for an order"
    roles: [KitchenAssociate, ShiftLead, StoreManager, StoreTerminal, Customer]
    code: 200
    input: ["station?", "status?", "limit?", "offset?"]
    output: KitchenTicket[]
    side_effects: []
  - method: GET
    path: "/stores/{id}/kitchen-queue"
    description: "station make-line queue ordered by sequence_position then created_at"
    roles: [KitchenAssociate, ShiftLead, StoreManager]
    code: 200
    input: ["station?", "status?", "limit?", "offset?"]
    output: KitchenTicket[]
    side_effects: []
  - method: GET
    path: "/kitchen-tickets/{id}"
    description: "read one kitchen ticket"
    roles: [KitchenAssociate, ShiftLead, StoreManager, StoreTerminal]
    code: 200
    input: []
    output: KitchenTicket
    side_effects: []
  - method: GET
    path: "/kitchen-tickets"
    description: "list kitchen tickets filtered by order, station or status"
    roles: [KitchenAssociate, ShiftLead, StoreManager]
    code: 200
    input: ["order_id?", "order_line_id?", "station?", "status?", "limit?", "offset?"]
    output: KitchenTicket[]
    side_effects: []
  - method: POST
    path: "/kitchen-tickets/{id}/start"
    description: "an associate claims a queued ticket"
    roles: [KitchenAssociate]
    code: 200
    input: []
    output: KitchenTicket
    side_effects:
      - "status QUEUED -> IN_PROGRESS; started_by_user_id = X-User-ID"
      - "if Order.production_status == PLACED the order moves PLACED -> IN_PRODUCTION and Order.version += 1"
      - "increments KitchenTicket.version by 1"
  - method: POST
    path: "/kitchen-tickets/{id}/complete"
    description: "an associate finishes a ticket; the last open ticket assembles and readies the order"
    roles: [KitchenAssociate]
    code: 200
    input: []
    output: KitchenTicket
    side_effects:
      - "status IN_PROGRESS -> DONE; completed_by_user_id = X-User-ID"
      - "when no ticket of the order remains QUEUED or IN_PROGRESS: Order.production_status IN_PRODUCTION -> ASSEMBLED, cascading -> READY when the ready gate holds, which converts reservations to sales and may drive a batch HOLDING -> SOLD_OUT and decrement Store.hot_case_slots_used"
      - "increments KitchenTicket.version and Order.version by 1"
  - method: POST
    path: "/kitchen-tickets/{id}/reopen"
    description: "a shift lead sends a finished ticket back to the make line (the cycle edge)"
    roles: [ShiftLead]
    code: 200
    input: [reason]
    output: KitchenTicket
    side_effects:
      - "status DONE -> IN_PROGRESS; rework_count += 1; Order.rework_count += 1"
      - "if Order.production_status == ASSEMBLED the order moves ASSEMBLED -> IN_PRODUCTION"
      - "Store.rework_waste_cents_mtd += sum over this ticket's lines of (MenuItem.unit_food_cost_cents * OrderLine.qty); Store.version += 1"
      - "increments KitchenTicket.version and Order.version by 1"

  # --- daypart menu transition and clock -----------------------------------
  - method: POST
    path: "/stores/{id}/daypart-transitions"
    description: "flip the store to the next daypart menu; menu and promotion eligibility follow this operational state, never the wall clock"
    roles: [StoreManager]
    code: 200
    input: [to_daypart]
    output: Store
    side_effects:
      - "Store.current_daypart -> to_daypart; daypart_epoch += 1; Store.version += 1"
      - "daypart-transition sweep, processing batches by bake_start_at ASC then created_at ASC: every HOLDING batch of the store with reserved_qty == 0 whose hold_expires_at <= clock or whose MenuItem.valid_dayparts excludes the new daypart goes HOLDING -> DISCARDED, appending a WasteLog with reason DAYPART_TRANSITION and daypart_epoch = the NEW Store.daypart_epoch, adding to Store.waste_cost_cents_mtd and decrementing Store.hot_case_slots_used"
  - method: POST
    path: "/_clock/set_current_utc"
    description: "set the logical clock used by every timestamp, hold-time and window computation; the clock defaults to 2026-08-01T00:00:00Z before any call and may only move forward"
    roles: [ChainAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["logical clock advanced; no domain entity is modified"]

# ---------------------------------------------------------------------------
# 1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  # --- authentication / authorization --------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header absent or blank on any endpoint"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the acting X-User-Role is not listed in the endpoint's roles"
  - id: ERR_ORDER_NOT_OWNED
    http: 403
    condition: "role Customer acts on an order whose loyalty_account_id differs from X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "POST /corrective-actions/{id}/verify by the X-User-ID that logged the reading, or POST /kitchen-tickets/{id}/reopen by the X-User-ID recorded in completed_by_user_id"
  - id: ERR_LOCKOUT_REQUIRES_SAFETY_LEAD
    http: 403
    condition: "POST /corrective-actions/{id}/verify on an action whose holding unit is LOCKED_OUT and the acting role is ShiftLead rather than FoodSafetyLead"
  # --- request shape --------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, wrong JSON type, unknown enum value, non-positive qty or gallons, or malformed ISO-8601 timestamp"
  # --- not found ------------------------------------------------------------
  - id: ERR_STORE_NOT_FOUND
    http: 404
    condition: "path or body store_id matches no Store"
  - id: ERR_HOLDING_UNIT_NOT_FOUND
    http: 404
    condition: "path or body holding_unit_id matches no HoldingUnit"
  - id: ERR_MENU_ITEM_NOT_FOUND
    http: 404
    condition: "path or body menu_item_id matches no MenuItem"
  - id: ERR_MODIFIER_OPTION_NOT_FOUND
    http: 404
    condition: "a modifiers[] entry references a modifier_option_id that matches no ModifierOption"
  - id: ERR_PROMOTION_RULE_NOT_FOUND
    http: 404
    condition: "path promotion rule id matches no PromotionRule"
  - id: ERR_LOYALTY_ACCOUNT_NOT_FOUND
    http: 404
    condition: "path or body loyalty_account_id matches no LoyaltyAccount"
  - id: ERR_STAFFING_PLAN_NOT_FOUND
    http: 404
    condition: "path staffing plan id matches no StaffingPlan"
  - id: ERR_PRODUCTION_BATCH_NOT_FOUND
    http: 404
    condition: "path production batch id matches no ProductionBatch"
  - id: ERR_TEMPERATURE_LOG_NOT_FOUND
    http: 404
    condition: "body temperature_log_id matches no TemperatureLog"
  - id: ERR_CORRECTIVE_ACTION_NOT_FOUND
    http: 404
    condition: "path corrective action id matches no CorrectiveAction"
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "path or filter order id matches no Order"
  - id: ERR_ORDER_LINE_NOT_FOUND
    http: 404
    condition: "path line_id matches no OrderLine, or the line belongs to a different order"
  - id: ERR_KITCHEN_TICKET_NOT_FOUND
    http: 404
    condition: "path kitchen ticket id matches no KitchenTicket"
  # --- uniqueness -----------------------------------------------------------
  - id: ERR_DUPLICATE_CODE
    http: 409
    condition: "Store.store_code, MenuItem.sku, PromotionRule.code or LoyaltyAccount.member_code already exists chain-wide; HoldingUnit.unit_code already exists within the store; ModifierOption.code already exists within the menu item"
  # --- optimistic concurrency ----------------------------------------------
  - id: ERR_STALE_STORE_VERSION
    http: 412
    condition: "expected_store_version on POST /stores/{id}/staffing-plans does not equal the store's current version"
  - id: ERR_STALE_BATCH_VERSION
    http: 412
    condition: "expected_batch_version on POST /production-batches/{id}/discard does not equal the batch's current version"
  # --- state machine guards -------------------------------------------------
  - id: ERR_ORDER_NOT_DRAFT
    http: 409
    condition: "line add, line delete or place attempted on an order whose production_status is not DRAFT"
  - id: ERR_ORDER_PRODUCTION_STATE_INVALID
    http: 409
    condition: "the order's production_status has no transition for the requested trigger (place, void, pickup) including from terminal PICKED_UP or VOIDED"
  - id: ERR_ORDER_SETTLEMENT_STATE_INVALID
    http: 409
    condition: "the order's settlement_status has no transition for the requested trigger (authorize, settle, refund, release) including a second settle or refund"
  - id: ERR_TICKET_STATE_INVALID
    http: 409
    condition: "start on a non-QUEUED ticket, complete on a non-IN_PROGRESS ticket, reopen on a non-DONE ticket, or any trigger on a VOIDED ticket"
  - id: ERR_BATCH_STATE_INVALID
    http: 409
    condition: "bake on a batch that is neither PLANNED nor HOLDING, pull on a non-BAKING batch, or discard on a batch that is not HOLDING (including DISCARDED or SOLD_OUT)"
  - id: ERR_PLAN_STATE_INVALID
    http: 409
    condition: "publish on a non-DRAFT staffing plan or lock on a non-PUBLISHED staffing plan"
  - id: ERR_PLAN_LOCKED
    http: 409
    condition: "a new staffing plan would supersede a LOCKED plan for the same (store_id, service_date, daypart)"
  - id: ERR_UNIT_NOT_IMPAIRED
    http: 409
    condition: "corrective-action verify would return a holding unit that is already OPERATIONAL"
  - id: ERR_ACTION_ALREADY_VERIFIED
    http: 409
    condition: "verify on a CorrectiveAction whose status is already VERIFIED"
  - id: ERR_ORDER_NOT_AUTHORIZED
    http: 409
    condition: "POST /kitchen-tickets/{id}/start while the owning order's settlement_status is not AUTHORIZED"
  - id: ERR_ORDER_NOT_REWORKABLE
    http: 409
    condition: "reopen requested for a ticket whose order is PICKED_UP or VOIDED"
  # --- business rules: capture and menu -------------------------------------
  - id: ERR_ORDER_EMPTY
    http: 422
    condition: "place attempted on an order with no order lines"
  - id: ERR_MODIFIER_NOT_FOR_ITEM
    http: 422
    condition: "a modifiers[] entry references a ModifierOption belonging to a different menu item"
  - id: ERR_MODIFIER_LIMIT_EXCEEDED
    http: 422
    condition: "a modifiers[] entry qty exceeds the option's max_qty, or a modifier_class appears more times than the class permits"
  - id: ERR_MENU_ITEM_NOT_IN_DAYPART
    http: 422
    condition: "the menu item's valid_dayparts does not contain the store's current_daypart at line-add time"
  - id: ERR_ITEM_NOT_CATERING_ELIGIBLE
    http: 422
    condition: "a line on a CATERING channel order references a menu item whose is_catering_eligible is false"
  - id: ERR_ORDER_MINIMUM_NOT_MET
    http: 422
    condition: "a CATERING order's subtotal_gross_cents is below CATERING_MIN_SUBTOTAL_CENTS at place time"
  - id: ERR_DAYPART_PLAN_NOT_PUBLISHED
    http: 409
    condition: "place attempted with no PUBLISHED or LOCKED StaffingPlan for (store_id, date(clock), Store.current_daypart)"
  - id: ERR_DAYPART_NOT_DUE
    http: 409
    condition: "a daypart transition targets the daypart the store is already in, or skips the successor in the BREAKFAST -> LUNCH -> DINNER -> OVERNIGHT -> BREAKFAST cycle"
  # --- business rules: pickup windows ---------------------------------------
  - id: ERR_PICKUP_WINDOW_NOT_ALLOWED
    http: 422
    condition: "pickup_window_start or pickup_window_end supplied on a TOUCHSCREEN order"
  - id: ERR_PICKUP_WINDOW_REQUIRED
    http: 422
    condition: "a MOBILE_PREORDER or CATERING order is created without both pickup window bounds"
  - id: ERR_PICKUP_WINDOW_INVALID
    http: 422
    condition: "pickup_window_end is not strictly after pickup_window_start"
  - id: ERR_PREORDER_LEAD_TIME_TOO_SHORT
    http: 422
    condition: "pickup_window_start is less than PREORDER_LEAD_MINUTES (MOBILE_PREORDER) or CATERING_LEAD_MINUTES (CATERING) after the clock at creation"
  - id: ERR_PICKUP_WINDOW_ELAPSED
    http: 409
    condition: "place attempted after the order's pickup_window_end has passed"
  - id: ERR_PICKUP_WINDOW_FULL
    http: 409
    condition: "the count of live orders overlapping the requested window already equals Store.pickup_slot_capacity"
  - id: ERR_PICKUP_WINDOW_NOT_OPEN
    http: 409
    condition: "pickup attempted before pickup_window_start or after pickup_window_end"
  # --- business rules: production and safety --------------------------------
  - id: ERR_SLOT_INDEX_OUT_OF_RANGE
    http: 422
    condition: "slot_index is outside 1..HoldingUnit.slot_count"
  - id: ERR_UNIT_SLOT_CONFLICT
    http: 409
    condition: "the requested slot's buffered occupancy interval overlaps a live batch already assigned to that (holding_unit_id, slot_index)"
  - id: ERR_HOLDING_UNIT_NOT_OPERATIONAL
    http: 409
    condition: "batch plan, bake or pull targets a HoldingUnit whose status is IMPAIRED or LOCKED_OUT"
  - id: ERR_HOT_CASE_CAPACITY_EXCEEDED
    http: 409
    condition: "a bake would push Store.hot_case_slots_used above Store.hot_case_slot_capacity"
  - id: ERR_ITEM_NOT_PAR_BAKED
    http: 422
    condition: "a production batch references a menu item whose fulfillment_mode is not PAR_BAKED"
  - id: ERR_INSUFFICIENT_BATCH_QTY
    http: 422
    condition: "batch_selection_fefo finds no unexpired HOLDING batch with enough remaining_qty for a PAR_BAKED line at place time"
  - id: ERR_BATCH_HOLD_EXPIRED
    http: 422
    condition: "a discard or sale references a batch whose hold_expires_at is at or before the clock and the reason is not HOLD_EXPIRED"
  - id: ERR_DISCARD_QTY_EXCEEDS_REMAINING
    http: 422
    condition: "discard qty is greater than the batch's remaining_qty"
  - id: ERR_RESERVED_DISCARD_REASON
    http: 422
    condition: "discard supplies reason UNIT_IMPAIRED, which only the temperature-log impairment sweep may write"
  - id: ERR_TEMP_READING_OUT_OF_SENSOR_RANGE
    http: 422
    condition: "reading_f is outside the physical probe range -40..250"
  # --- business rules: loyalty and clock ------------------------------------
  - id: ERR_POINTS_BALANCE_NEGATIVE
    http: 422
    condition: "a points adjustment or refund reversal would drive points_balance below zero"
  - id: ERR_CLOCK_REGRESSION
    http: 422
    condition: "to_iso8601 on POST /_clock/set_current_utc is at or before the current logical clock value"

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: ChainAdmin
    description: "chain-office operator who owns menu, modifier, promotion and store configuration and the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /stores"
      - "POST /menu-items"
      - "POST /menu-items/{id}/modifier-options"
      - "POST /promotion-rules"
      - "POST /promotion-rules/{id}/suspend"
      - "POST /loyalty-accounts/{id}/points-adjustments"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /stores/{id}/holding-units"
      - "POST /loyalty-accounts"
      - "POST /loyalty-accounts/{id}/fuel-transactions"
      - "all GET reads including GET /stores/{id}/readiness"
  - name: StoreManager
    description: "site general manager who owns labor plans, daypart menu transitions, refunds and authorization releases"
    identity: "opaque"
    exclusive_operations:
      - "POST /stores/{id}/staffing-plans"
      - "POST /staffing-plans/{id}/publish"
      - "POST /staffing-plans/{id}/lock"
      - "POST /stores/{id}/daypart-transitions"
    shared_operations:
