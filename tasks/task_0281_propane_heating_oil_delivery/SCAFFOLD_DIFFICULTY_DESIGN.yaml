  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: route_window_buffer_conflict_on_truck
        grounds:
          - validations[priority=9]
          - entities.DeliveryRoute.fields.window_start
          - entities.DeliveryRoute.fields.window_end
          - entities.Truck.fields.turnaround_buffer_minutes
        distinguishing_aspect: |
          Closed-interval + turnaround-buffer semantics on the Truck resource: an existing
          route 09:00-12:00 with a 60-min buffer rejects a new 12:30-14:00 route (gap 30 < 60)
          with ERR_ROUTE_WINDOW_CONFLICT, but admits 13:00-15:00 (gap 60 == buffer).
        test_recipe:
          setup:
            - "Truck NE_01 daily_capacity 1000 turnaround_buffer_minutes 60; existing PLANNING route 2026-02-11 09:00-12:00."
          setup_api_calls:
            - call: "POST /trucks"
              payload: { region_code: "NE_01", daily_capacity_gallons: 1000, turnaround_buffer_minutes: 60 }
              as: Dispatcher
              captures: { truck_id: $.data.id }
            - call: "POST /trucks/${truck_id}/routes"
              payload: { route_date: "2026-02-11T00:00:00Z", window_start: "2026-02-11T09:00:00Z", window_end: "2026-02-11T12:00:00Z" }
              as: Dispatcher
              captures: { route1_id: $.data.id }
          trigger:
            - call: "POST /trucks/${truck_id}/routes"
              payload: { route_date: "2026-02-11T00:00:00Z", window_start: "2026-02-11T12:30:00Z", window_end: "2026-02-11T14:00:00Z" }
              as: Dispatcher
              captures: { err: $.data.error_id }
            - call: "POST /trucks/${truck_id}/routes"
              payload: { route_date: "2026-02-11T00:00:00Z", window_start: "2026-02-11T13:00:00Z", window_end: "2026-02-11T15:00:00Z" }
              as: Dispatcher
              captures: { ok_status: $.data.status }
          assert:
            - "err == ERR_ROUTE_WINDOW_CONFLICT   # gap 30 min < 60 buffer (closed interval adjacency)"
            - "ok_status == PLANNING   # gap exactly 60 == buffer is admitted"

      - name: lease_halfopen_overlap_on_tank
        grounds:
          - validations[priority=10]
          - entities.TankLease.fields.lease_start
          - entities.TankLease.fields.lease_end
          - entities.TankLease.fields.status
        distinguishing_aspect: |
          Half-open [start,end) interval semantics on a DIFFERENT resource (Tank): an ACTIVE
          lease [2026-01-01,2026-04-01) admits a touching lease starting exactly 2026-04-01
          (no overlap) but rejects [2026-03-15,2026-06-01) with ERR_LEASE_PERIOD_OVERLAP.
        test_recipe:
          setup:
            - "Account NE_01 tank; existing ACTIVE lease [2026-01-01,2026-04-01)."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { customer_name: "Lease Lena", region_code: "NE_01", fuel_type: "PROPANE" }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/tanks"
              payload: { capacity_gallons: 500, k_factor: 1500, current_gallons: 100 }
              as: AccountManager
              captures: { tank_id: $.data.id }
            - call: "POST /tanks/${tank_id}/leases"
              payload: { monthly_rent_cents: 5000, lease_start: "2026-01-01T00:00:00Z", lease_end: "2026-04-01T00:00:00Z" }
              as: AccountManager
              captures: { lease1_id: $.data.id }
          trigger:
            - call: "POST /tanks/${tank_id}/leases"
              payload: { monthly_rent_cents: 5000, lease_start: "2026-04-01T00:00:00Z", lease_end: "2026-07-01T00:00:00Z" }
              as: AccountManager
              captures: { ok_status: $.data.status }
            - call: "POST /tanks/${tank_id}/leases"
              payload: { monthly_rent_cents: 5000, lease_start: "2026-03-15T00:00:00Z", lease_end: "2026-06-01T00:00:00Z" }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "ok_status == ACTIVE   # touching at 2026-04-01 is not an overlap under [start,end)"
            - "err == ERR_LEASE_PERIOD_OVERLAP   # [2026-03-15,2026-06-01) overlaps [2026-01-01,2026-04-01)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: truck_capacity_conserved_across_assign_unassign
        grounds:
          - state_machines.DeliveryOrder.CREATED_to_SCHEDULED
          - state_machines.DeliveryOrder.SCHEDULED_to_CREATED
          - entities.DeliveryRoute.fields.reserved_gallons
        distinguishing_aspect: |
          Conserved quantity = truck reserved gallons. Invariant pinned:
          DeliveryRoute.reserved_gallons == sum(requested_gallons over SCHEDULED orders on it).
          assign(+200) then unassign(-200) returns reserved_gallons to its original 0 with no
          drift.
        test_recipe:
          setup:
            - "Account NE_01 PASSED tank; route PLANNING reserved_gallons 0; one CREATED order 200 gal."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { customer_name: "Conserve Cal", region_code: "NE_01", fuel_type: "PROPANE" }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/tanks"
              payload: { capacity_gallons: 500, k_factor: 1500, current_gallons: 100 }
              as: AccountManager
              captures: { tank_id: $.data.id }
            - call: "POST /tanks/${tank_id}/inspections"
              payload: { result: "PASSED", inspected_at: "2026-01-01T00:00:00Z" }
              as: Inspector
            - call: "POST /trucks"
              payload: { region_code: "NE_01", daily_capacity_gallons: 1000 }
              as: Dispatcher
              captures: { truck_id: $.data.id }
            - call: "POST /trucks/${truck_id}/routes"
              payload: { route_date: "2026-02-12T00:00:00Z", window_start: "2026-02-12T09:00:00Z", window_end: "2026-02-12T12:00:00Z" }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /accounts/${acct_id}/delivery-orders"
              payload: { tank_id: "${tank_id}", requested_gallons: 200 }
              as: Dispatcher
              captures: { order_id: $.data.id }
            - call: "POST /accounts/${acct_id}/delivery-orders/${order_id}/assign"
              payload: { route_id: "${route_id}" }
              as: Dispatcher
            - call: "GET /routes/${route_id}"
              payload: {}
              as: Dispatcher
              captures: { reserved_mid: $.data.reserved_gallons }
          trigger:
            - call: "POST /accounts/${acct_id}/delivery-orders/${order_id}/unassign"
              payload: {}
              as: Dispatcher
            - call: "GET /routes/${route_id}"
              payload: {}
              as: Dispatcher
              captures: { reserved_final: $.data.reserved_gallons }
          assert:
            - "reserved_mid == 200   # reserved after assign"
            - "DeliveryRoute.${route_id}.reserved_gallons == 0   # conserved: returns to original after unassign"

      - name: budget_ledger_conserved_across_deliver_reverse
        grounds:
          - state_machines.DeliveryOrder.SCHEDULED_to_DELIVERED
          - state_machines.DeliveryOrder.DELIVERED_to_CANCELLED
          - entities.BudgetPlan.fields.actual_cost_to_date_cents
          - entities.Account.fields.credit_balance_cents
        distinguishing_aspect: |
          Different conserved quantity = money ledger. Invariant pinned:
          BudgetPlan.actual_cost_to_date_cents == sum(invoice_total over DELIVERED orders on the
          plan), and Account.credit_balance_cents returns to its pre-delivery value. deliver
          (+61500 actuals, -61500 credit) then reverse backs both out to 0.
        test_recipe:
          setup:
            - "Account NE_01 ACTIVE FIXED plan 300; tank PASSED current 100; budget plan (no installments); order 200 gal STANDARD will-call DELIVERED, then reversed."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { customer_name: "Reverse Rho", region_code: "NE_01", fuel_type: "PROPANE" }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/price-plans"
              payload: { plan_type: "FIXED", locked_price_cents_per_gallon: 300 }
              as: AccountManager
              captures: { plan_id: $.data.id }
            - call: "POST /accounts/${acct_id}/price-plans/${plan_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /accounts/${acct_id}/tanks"
              payload: { capacity_gallons: 500, k_factor: 1500, current_gallons: 100 }
              as: AccountManager
              captures: { tank_id: $.data.id }
            - call: "POST /tanks/${tank_id}/inspections"
              payload: { result: "PASSED", inspected_at: "2026-01-01T00:00:00Z" }
              as: Inspector
            - call: "POST /accounts/${acct_id}/budget-plans"
              payload: { plan_year_start: "2026-01-01T00:00:00Z", estimated_annual_gallons: 1200, estimated_price_cents_per_gallon: 300 }
              as: AccountManager
              captures: { bp_id: $.data.id }
            - call: "POST /trucks"
              payload: { region_code: "NE_01", daily_capacity_gallons: 1000 }
              as: Dispatcher
              captures: { truck_id: $.data.id }
            - call: "POST /trucks/${truck_id}/routes"
              payload: { route_date: "2026-02-13T00:00:00Z", window_start: "2026-02-13T09:00:00Z", window_end: "2026-02-13T12:00:00Z" }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /accounts/${acct_id}/delivery-orders"
              payload: { tank_id: "${tank_id}", requested_gallons: 200 }
              as: Dispatcher
              captures: { order_id: $.data.id }
            - call: "POST /accounts/${acct_id}/delivery-orders/${order_id}/assign"
              payload: { route_id: "${route_id}" }
              as: Dispatcher
            - call: "POST /trucks/${truck_id}/routes/${route_id}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: AccountManager
              captures: { acct_v1: $.data.version, credit_pre: $.data.credit_balance_cents }
            - call: "POST /accounts/${acct_id}/delivery-orders/${order_id}/deliver"
              payload: { delivered_gallons: 200, expected_account_version: "${acct_v1}" }
              as: Driver
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: AccountManager
              captures: { acct_v2: $.data.version }
          trigger:
            - call: "POST /accounts/${acct_id}/delivery-orders/${order_id}/reverse"
              payload: { expected_account_version: "${acct_v2}" }
              as: AccountManager
            - call: "GET /budget-plans/${bp_id}"
              payload: {}
              as: AccountManager
              captures: { actuals_final: $.data.actual_cost_to_date_cents }
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: AccountManager
              captures: { credit_final: $.data.credit_balance_cents }
          assert:
            - "credit_pre == 0   # no installments, before delivery"
            - "BudgetPlan.${bp_id}.actual_cost_to_date_cents == 0   # deliver +61500 then reverse -61500"
            - "Account.${acct_id}.credit_balance_cents == 0   # ledger conserved: debit then credit back"
