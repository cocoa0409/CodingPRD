          assert:
            - "AnnualReport.${rp_edge_id}.recorded_land_applied_gallons == 0.00, recorded_transferred_gallons == 0.00 and recorded_total_gallons == 2868153.30"
            - "AnnualReport.${rp_edge_id}.mass_balance_expected_gallons == 3374298.00, variance_pct == -15.00 and variance_classification == WITHIN_TOLERANCE, the inclusive edge"
            - "AnnualReport.${rp_out_id}.recorded_total_gallons == 2865000.00, variance_pct == -15.09 and variance_classification == EXCEEDS_TOLERANCE"
