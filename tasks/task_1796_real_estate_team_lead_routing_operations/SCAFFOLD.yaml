    description: "Create a DRAFT routing policy (version_no = next per-team sequence)"
    roles: [TeamAdmin]
    code: 201
    input: [team_id, mode, "tier_weight_bps?", "source_mode_overrides?", "claim_window_seconds?", "speed_to_lead_window_seconds?"]
    output: RoutingPolicy
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/crm/routing-policies/{policyId}"
