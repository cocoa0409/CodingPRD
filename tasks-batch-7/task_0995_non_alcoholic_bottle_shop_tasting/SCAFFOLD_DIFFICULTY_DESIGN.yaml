                order17_v: "$.data.version"
            - call: "POST /nabs/orders/${order17_id}/submit"
              payload: { expected_order_version: "${order17_v}" }
              as: Member
              as_user_id: "${member17_id}"
            - call: "GET /nabs/lots/${lot17_id}"
              as: ShopStaff
              captures:
                qty_post_submit: "$.data.qty_remaining"
          trigger:
            - call: "POST /nabs/orders/${order17_id}/cancel"
              as: ShopStaff
            - call: "GET /nabs/lots/${lot17_id}"
              as: ShopStaff
              captures:
                qty_post_cancel: "$.data.qty_remaining"
          assert:
            - "qty_pre_submit == 20"
            - "qty_post_submit == 14 (20 - 6 allocated)"
            - "qty_post_cancel == 20 (invariant: restored exactly)"

      - name: seat_cancel_conserves_wallet_and_capacity
        grounds:
          - state_machines.TastingSeat.CONFIRMED_to_CANCELLED
          - entities.Member.fields.wallet_credit_cents
          - entities.TastingEvent.fields.seats_booked
        distinguishing_aspect: |
          Conserved quantities = Member.wallet_credit_cents AND
          TastingEvent.seats_booked. Forward (seat confirm at price P) does not
          touch wallet (payment is external) but increments seats_booked.
          Compensating (seat cancel from CONFIRMED) credits wallet by exactly
          price_paid_cents and decrements seats_booked by 1. Two different
          conserved quantities from instance 1 (wallet cents + capacity count
          vs inventory bottles).
        test_recipe:
          setup:
            - "TastingEvent capacity=5 PUBLISHED; flight_price_cents = 2500"
            - "Member m18 books + confirms; wallet starts at 0"
          setup_api_calls:
            - call: "POST /nabs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /nabs/categories"
              payload: { code: "tea18", display_name: "Tea18", compliance_class: "STANDARD" }
              as: PlatformAdmin
              captures:
                cat18_id: "$.data.id"
            - call: "POST /nabs/skus"
              payload: { category_id: "${cat18_id}", sku_code: "sku-18", title: "S18", base_price_cents: 100, abv_basis_points: 0 }
              as: PlatformAdmin
              captures:
                sku18_id: "$.data.id"
            - call: "POST /nabs/skus/${sku18_id}/lots"
              payload: { lot_code: "L18", qty_received: 50, unit_cost_cents: 10, expires_on: "2027-01-01" }
              as: PlatformAdmin
            - call: "POST /nabs/members"
              payload: { email: "host18@x.com", full_name: "H18", date_of_birth: "1980-01-01", home_state_code: "CA" }
              as: PlatformAdmin
              captures:
                host18_id: "$.data.id"
            - call: "POST /nabs/members"
              payload: { email: "m18@x.com", full_name: "M18", date_of_birth: "1990-01-01", home_state_code: "CA" }
              as: PlatformAdmin
              captures:
                member18_id: "$.data.id"
            - call: "POST /nabs/tasting-events"
              payload: { title: "T18", host_member_id: "${host18_id}", starts_at: "2026-05-10T10:00:00Z", ends_at: "2026-05-10T12:00:00Z", capacity: 5, flight_price_cents: 2500, min_attendee_age_years: 0 }
              as: ShopStaff
              captures:
                ev18_id: "$.data.id"
            - call: "POST /nabs/tasting-events/${ev18_id}/flight-items"
              payload: { sku_id: "${sku18_id}", pour_size_ml: 30, sequence_no: 1 }
              as: ShopStaff
            - call: "POST /nabs/tasting-events/${ev18_id}/publish"
              as: ShopStaff
            - call: "GET /nabs/tasting-events/${ev18_id}"
              as: ShopStaff
              captures:
                ev18_v: "$.data.version"
                ev18_booked_pre: "$.data.seats_booked"
            - call: "POST /nabs/tasting-events/${ev18_id}/seats"
              payload: { member_id: "${member18_id}", expected_event_version: "${ev18_v}" }
              as: Member
              as_user_id: "${member18_id}"
              captures:
                seat18_id: "$.data.id"
                seat18_price: "$.data.price_paid_cents"
            - call: "POST /nabs/tasting-seats/${seat18_id}/confirm"
              as: Member
              as_user_id: "${member18_id}"
            - call: "GET /nabs/tasting-events/${ev18_id}"
              as: ShopStaff
              captures:
                ev18_booked_post: "$.data.seats_booked"
            - call: "GET /nabs/members/${member18_id}"
              as: ShopStaff
              captures:
                m18_wallet_pre: "$.data.wallet_credit_cents"
          trigger:
            - call: "POST /nabs/tasting-seats/${seat18_id}/cancel"
              as: Member
              as_user_id: "${member18_id}"
            - call: "GET /nabs/tasting-events/${ev18_id}"
              as: ShopStaff
              captures:
                ev18_booked_cancel: "$.data.seats_booked"
            - call: "GET /nabs/members/${member18_id}"
              as: ShopStaff
              captures:
                m18_wallet_post: "$.data.wallet_credit_cents"
          assert:
            - "seats_booked pre-booking == 0"
            - "seats_booked post-booking == 1"
            - "seats_booked post-cancel == 0 (capacity invariant restored)"
            - "Member wallet pre-cancel == 0"
            - "Member wallet post-cancel == 2500 (price_paid_cents credited exactly)"
