              captures: { err: $.data.error_id }
          assert:
            - "POST /plans .status == 409"
            - "POST /plans .data.error_id == ERR_NOT_CHAPTER_13"

      - name: claim_filing_on_terminated_stay_rejected
        claim_type: Cross-entity validation
        grounds: ["validations[priority=13]", "errors[ERR_STAY_TERMINATED]"]
        distinguishing_aspect: "Filing a claim (correct creditor) on a DISMISSED case whose stay is TERMINATED returns ERR_STAY_TERMINATED (409)."
        test_recipe:
          setup: ["A DISMISSED case (stay TERMINATED) with a debt owned by creditor A; A files a claim on its own debt after dismissal."]
          setup_api_calls:
            - call: "POST /debtors"
              payload: { full_name: "Stay Debtor", email: "stayterm@x.com" }
              as: Debtor
              captures: { dbtr_id: $.data.id }
            - call: "POST /trustees"
              payload: { name: "T-stay" }
              as: Trustee
              captures: { tr_id: $.data.id }
            - call: "POST /creditors"
              payload: { name: "Cr stay" }
              as: Creditor
              captures: { cr_id: $.data.id }
            - call: "POST /cases"
              payload: { debtor_id: "${dbtr_id}", filed_chapter: "CHAPTER_13", state_code: "CA", household_size: 1 }
              as: Debtor
              as_user_id: "${dbtr_id}"
              captures: { case_id: $.data.id }
            - call: "POST /means-tests"
              payload: { case_id: "${case_id}", cmi_monthly_cents: 400000, monthly_expenses_cents: 300000, median_annual_income_cents: 6000000 }
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /schedules"
              payload: { case_id: "${case_id}", schedule_letter: "I", description: "wages" }
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /schedules"
              payload: { case_id: "${case_id}", schedule_letter: "J", description: "rent" }
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /debts"
              payload: { case_id: "${case_id}", creditor_id: "${cr_id}", debt_class: "UNSECURED", scheduled_amount_cents: 70000 }
              as: Debtor
              as_user_id: "${dbtr_id}"
              captures: { debt_id: $.data.id }
            - call: "POST /cases/${case_id}/petition"
              payload: {}
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /cases/${case_id}/dismiss"
              payload: {}
              as: Trustee
              as_user_id: "${tr_id}"
          trigger:
            - call: "POST /claims"
              payload: { case_id: "${case_id}", debt_id: "${debt_id}", filed_by_creditor_id: "${cr_id}", claimed_amount_cents: 70000 }
              as: Creditor
              as_user_id: "${cr_id}"
              captures: { err: $.data.error_id }
          assert:
            - "POST /claims .status == 409"
            - "POST /claims .data.error_id == ERR_STAY_TERMINATED"

  # =========================================================================
  # Endpoints
  # =========================================================================
  - section: endpoints
    instances:
      - name: list_cases_pagination_envelope
        claim_type: Computed read
        grounds: [endpoints, response_envelope]
        distinguishing_aspect: "GET /cases returns response_type array with pagination fields total_count and has_more."
        test_recipe:
          setup: ["Two cases exist for one debtor."]
          setup_api_calls:
            - call: "POST /debtors"
              payload: { full_name: "Page Debtor", email: "page@x.com" }
              as: Debtor
              captures: { dbtr_id: $.data.id }
            - call: "POST /cases"
              payload: { debtor_id: "${dbtr_id}", filed_chapter: "CHAPTER_7", state_code: "CA", household_size: 1 }
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /cases"
              payload: { debtor_id: "${dbtr_id}", filed_chapter: "CHAPTER_13", state_code: "CA", household_size: 1 }
              as: Debtor
              as_user_id: "${dbtr_id}"
          trigger:
            - call: "GET /cases?debtor_id=${dbtr_id}&limit=1&offset=0"
              payload: {}
              as: Trustee
              as_user_id: "audit-1"
          assert:
            - "GET /cases?debtor_id=${dbtr_id}&limit=1&offset=0 .status == 200"
            - "GET /cases?debtor_id=${dbtr_id}&limit=1&offset=0 returns total_count == 2"
            - "GET /cases?debtor_id=${dbtr_id}&limit=1&offset=0 returns has_more == true"

      - name: distribution_computed_read_matches_waterfall
        claim_type: Computed read
        grounds: [endpoints, calculations.chapter13_waterfall_distribution]
        excluded_because:
          difficulty_instance: combinatorial_formula / waterfall_evaluation_order_fill_in_full_mode_c
          rationale: "GET /plans/{id}/distribution output (distribution map + surplus_cents) is asserted directly by the named §1.8 instance."

