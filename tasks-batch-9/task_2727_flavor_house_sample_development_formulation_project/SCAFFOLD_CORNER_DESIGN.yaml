          - validations[priority=40]
          - errors.ERR_SUBSTANTIATION_STATE_INVALID
        distinguishing_aspect: "VERIFIED appears in no from-set of the verify trigger (only PENDING and REVOKED do), so verifying twice returns ERR_SUBSTANTIATION_STATE_INVALID (409) and verified_at keeps its first value."
        test_recipe:
          setup:
            - "Material GUM-BASE with one KOSHER certificate already VERIFIED at the pinned clock instant."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegulatoryAffairs
            - call: "POST /raw-materials"
              payload: { material_code: "GUM-BASE", name: "Gum Base 40", cost_per_kg_cents: 2000, natural_status: "NATURE_IDENTICAL", potency_class: "STANDARD", max_use_ppm: 1000000 }
              as: PurchasingManager
              captures: { m1: "$.data.id" }
            - call: "POST /substantiation-records"
              payload: { raw_material_id: "${m1}", claim_type: "KOSHER", issuing_body: "OU Kosher", document_ref: "K-11", valid_until: "2027-06-30T00:00:00Z" }
              as: RegulatoryAffairs
              captures: { r1: "$.data.id" }
            - call: "POST /substantiation-records/${r1}/verify"
