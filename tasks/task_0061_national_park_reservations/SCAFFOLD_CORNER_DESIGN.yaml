scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:
      - name: create_account_returns_201_with_fields
        claim_type: Creation
        grounds: [entities.Account.fields.email]
        distinguishing_aspect: "POST /v1/accounts with email, full_name, birth_date returns 201 and an Account with status=active and credit_balance_cents=0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /v1/accounts"
              payload: { email: "c1@x.com", full_name: "C1", birth_date: "1990-01-01" }
              as: visitor
              captures: { acc_id: $.data.id, st: $.data.status, bal: $.data.credit_balance_cents }
          assert:
            - "response status == 201"
            - "Account.${acc_id}.status == active"
            - "Account.${acc_id}.credit_balance_cents == 0"

      - name: get_account_not_found
        claim_type: Not Found
        grounds: [entities.Account.fields.id]
        distinguishing_aspect: "GET /v1/accounts/{id} with a non-existent id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /v1/accounts/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: system
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "data.error_id == ERR_NOT_FOUND"

      - name: account_email_required_field_missing
        claim_type: Required Fields
        grounds: [entities.Account.fields.email]
        distinguishing_aspect: "POST /v1/accounts missing email returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /v1/accounts"
              payload: { full_name: "NoEmail", birth_date: "1990-01-01" }
              as: visitor
              captures: { err: $.data.error_id }
          assert:
            - "response status == 400"
            - "data.error_id == ERR_VALIDATION"

      - name: account_role_default_visitor
        claim_type: Defaults
        grounds: [entities.Account.fields.role]
        distinguishing_aspect: "Omitting role on POST /v1/accounts yields role=visitor."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /v1/accounts"
              payload: { email: "def@x.com", full_name: "Def", birth_date: "1990-01-01" }
              as: visitor
              captures: { role: $.data.role }
          assert:
            - "Account role == visitor"

      - name: campsite_invalid_site_type_enum
        claim_type: Type Constraints
        grounds: [entities.Campsite.fields.site_type]
        distinguishing_aspect: "POST /v1/campsites with site_type=cabin (not in {tent,rv,group}) returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["One park; one park_admin."]
          setup_api_calls:
            - call: "POST /v1/parks"
              payload: { code: "EN01", name: "Enum Park", utc_offset_minutes: 0 }
              as: system
              captures: { park_id: $.data.id }
            - call: "POST /v1/accounts"
              payload: { email: "paE@x.com", full_name: "PAE", birth_date: "1980-01-01", role: "park_admin", home_park_id: "${park_id}" }
              as: system
              captures: { pa_id: $.data.id }
          trigger:
            - call: "POST /v1/campsites"
              payload: { park_id: "${park_id}", site_number: "X1", site_type: "cabin", max_occupancy: 4, base_nightly_cents: 4000 }
              as: park_admin
              as_user_id: "${pa_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 400"
            - "data.error_id == ERR_VALIDATION"

      - name: clock_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.Clock.fields.now_utc]
        distinguishing_aspect: "Clock is common_fields:false; GET /v1/_clock returns now_utc and has no version field."
        test_recipe:
          setup: ["Set the clock once."]
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { now_utc: "2026-06-01T00:00:00Z" }
              as: park_admin
          trigger:
            - call: "GET /v1/_clock"
              payload: {}
              as: visitor
              captures: { now: $.data.now_utc }
          assert:
            - "Clock.now_utc == 2026-06-01T00:00:00Z"

      - name: timed_entry_slot_fk_park_reverse_list
        claim_type: Parent Relationships
        grounds: [entities.TimedEntrySlot.fields.park_id]
        distinguishing_aspect: "GET /v1/timed-entry-slots?park_id=X returns only slots whose park_id == X (FK reverse-reachability)."
        test_recipe:
          setup: ["One park with one slot."]
          setup_api_calls:
            - call: "POST /v1/parks"
              payload: { code: "FK01", name: "FK Park", utc_offset_minutes: 0, timed_entry_required: true }
              as: system
              captures: { park_id: $.data.id }
            - call: "POST /v1/_clock/set_current_utc"
              payload: { now_utc: "2026-06-01T00:00:00Z" }
              as: park_admin
            - call: "POST /v1/accounts"
              payload: { email: "paF@x.com", full_name: "PAF", birth_date: "1980-01-01", role: "park_admin", home_park_id: "${park_id}" }
              as: system
              captures: { pa_id: $.data.id }
            - call: "POST /v1/timed-entry-slots"
              payload: { park_id: "${park_id}", entry_date: "2026-06-05", window_start_local: "07:00", window_end_local: "09:00", capacity: 5, release_at: "2026-06-01T00:00:00Z" }
              as: park_admin
              as_user_id: "${pa_id}"
              captures: { slot_id: $.data.id }
          trigger:
            - call: "GET /v1/timed-entry-slots?park_id=${park_id}"
              payload: {}
              as: visitor
              captures: { total: $.data }
          assert:
            - "list contains slot ${slot_id}; every element has park_id == ${park_id}"

  # =========================================================================
  - section: state_machines
    instances:
      - name: timed_entry_confirm_from_cancelled_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.TimedEntryReservation.held_to_cancelled]
        distinguishing_aspect: "Confirming a reservation already in cancelled returns ERR_STATE_INVALID (409); no payment captured."
        test_recipe:
          setup: ["A released slot; a held reservation that is then cancelled."]
          setup_api_calls:
            - call: "POST /v1/parks"
              payload: { code: "SM01", name: "SM Park", utc_offset_minutes: 0, timed_entry_required: true }
              as: system
              captures: { park_id: $.data.id }
            - call: "POST /v1/_clock/set_current_utc"
              payload: { now_utc: "2026-06-05T08:00:00Z" }
              as: park_admin
            - call: "POST /v1/accounts"
              payload: { email: "paG@x.com", full_name: "PAG", birth_date: "1980-01-01", role: "park_admin", home_park_id: "${park_id}" }
              as: system
              captures: { pa_id: $.data.id }
            - call: "POST /v1/accounts"
              payload: { email: "vG@x.com", full_name: "VG", birth_date: "1990-01-01" }
              as: visitor
              captures: { v_id: $.data.id }
            - call: "POST /v1/timed-entry-slots"
              payload: { park_id: "${park_id}", entry_date: "2026-06-08", window_start_local: "07:00", window_end_local: "09:00", capacity: 3, release_at: "2026-06-05T07:00:00Z" }
              as: park_admin
              as_user_id: "${pa_id}"
              captures: { slot_id: $.data.id, slot_v0: $.data.version }
            - call: "POST /v1/timed-entry-reservations"
              payload: { slot_id: "${slot_id}", account_id: "${v_id}", vehicle_plate: "SMC1", expected_slot_version: "${slot_v0}" }
              as: visitor
              as_user_id: "${v_id}"
              captures: { resv_id: $.data.id }
            - call: "POST /v1/timed-entry-reservations/${resv_id}/cancel"
              payload: {}
              as: visitor
              as_user_id: "${v_id}"
          trigger:
            - call: "POST /v1/timed-entry-reservations/${resv_id}/confirm"
              payload: {}
              as: visitor
              as_user_id: "${v_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_STATE_INVALID"

      - name: timed_entry_reservation_initial_state_held
        claim_type: Initial State
        grounds: [state_machines.TimedEntryReservation.held_to_confirmed]
        distinguishing_aspect: "A newly created timed-entry reservation starts in held with a non-null hold_expires_at."
        test_recipe:
          setup: ["A released slot."]
          setup_api_calls:
            - call: "POST /v1/parks"
              payload: { code: "SM02", name: "SM2 Park", utc_offset_minutes: 0, timed_entry_required: true }
              as: system
              captures: { park_id: $.data.id }
            - call: "POST /v1/_clock/set_current_utc"
              payload: { now_utc: "2026-06-05T08:00:00Z" }
              as: park_admin
            - call: "POST /v1/accounts"
              payload: { email: "paH@x.com", full_name: "PAH", birth_date: "1980-01-01", role: "park_admin", home_park_id: "${park_id}" }
              as: system
              captures: { pa_id: $.data.id }
            - call: "POST /v1/accounts"
              payload: { email: "vH@x.com", full_name: "VH", birth_date: "1990-01-01" }
              as: visitor
              captures: { v_id: $.data.id }
            - call: "POST /v1/timed-entry-slots"
              payload: { park_id: "${park_id}", entry_date: "2026-06-08", window_start_local: "07:00", window_end_local: "09:00", capacity: 3, release_at: "2026-06-05T07:00:00Z" }
              as: park_admin
              as_user_id: "${pa_id}"
              captures: { slot_id: $.data.id, slot_v0: $.data.version }
          trigger:
            - call: "POST /v1/timed-entry-reservations"
              payload: { slot_id: "${slot_id}", account_id: "${v_id}", vehicle_plate: "INIT1", expected_slot_version: "${slot_v0}" }
              as: visitor
              as_user_id: "${v_id}"
              captures: { st: $.data.status, hexp: $.data.hold_expires_at }
          assert:
            - "TimedEntryReservation status == held"
            - "TimedEntryReservation hold_expires_at is not null"

      - name: backcountry_cancel_from_expired_terminal_locked
        claim_type: Terminal State Lockdown
        grounds: [state_machines.BackcountryPermit.held_to_expired]
        distinguishing_aspect: "After a held permit lapses to expired via ops sweep, cancel returns ERR_STATE_INVALID (terminal)."
        test_recipe:
          setup: ["A held permit; clock advanced past hold_expires_at; ops run expires it."]
          setup_api_calls:
            - call: "POST /v1/parks"
              payload: { code: "SM03", name: "SM3 Park", utc_offset_minutes: 0 }
              as: system
              captures: { park_id: $.data.id }
            - call: "POST /v1/_clock/set_current_utc"
              payload: { now_utc: "2026-06-01T00:00:00Z" }
              as: park_admin
            - call: "POST /v1/accounts"
              payload: { email: "paI@x.com", full_name: "PAI", birth_date: "1980-01-01", role: "park_admin", home_park_id: "${park_id}" }
              as: system
              captures: { pa_id: $.data.id }
            - call: "POST /v1/accounts"
              payload: { email: "vI@x.com", full_name: "VI", birth_date: "1990-01-01" }
              as: visitor
              captures: { v_id: $.data.id }
            - call: "POST /v1/trailheads"
              payload: { park_id: "${park_id}", name: "THI", daily_exit_quota: 5, reservation_fee_cents: 500, per_person_per_night_cents: 800 }
              as: park_admin
              as_user_id: "${pa_id}"
              captures: { th_id: $.data.id }
            - call: "POST /v1/wilderness-zones"
              payload: { park_id: "${park_id}", name: "ZI", nightly_party_quota: 5 }
              as: park_admin
              as_user_id: "${pa_id}"
              captures: { z_id: $.data.id }
            - call: "POST /v1/backcountry-permits"
              payload: { park_id: "${park_id}", account_id: "${v_id}", trailhead_id: "${th_id}", entry_date: "2026-06-20", nights: 1, party_size: 2, zone_nights: [ { zone_id: "${z_id}", date: "2026-06-20" } ] }
              as: visitor
              as_user_id: "${v_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /v1/_clock/set_current_utc"
              payload: { now_utc: "2026-06-01T01:00:00Z" }
              as: park_admin
            - call: "POST /v1/_ops/run"
              payload: {}
              as: park_admin
              as_user_id: "${pa_id}"
          trigger:
            - call: "POST /v1/backcountry-permits/${permit_id}/cancel"
              payload: {}
              as: visitor
              as_user_id: "${v_id}"
              captures: { err: $.data.error_id }
          assert:
            - "BackcountryPermit.${permit_id}.status == expired"
            - "response status == 409"
            - "data.error_id == ERR_STATE_INVALID"

      - name: waitlist_offer_cascade_skip_position_no_renumber
        claim_type: Side Effect Execution
        grounds: [state_machines.WaitlistEntry.offered_to_expired]
        distinguishing_aspect: "When the position-1 offer expires via ops, the offer advances to position-2 and positions are NOT renumbered (pos2 keeps position=2)."
        test_recipe:
          setup: ["A cancelled reservation freeing a range with two waiting entries (pos1, pos2); pos1 offered; clock advanced past pos1 offer_expires_at; ops run."]
          setup_api_calls:
            - call: "POST /v1/parks"
              payload: { code: "SM04", name: "SM4 Park", utc_offset_minutes: 0 }
              as: system
              captures: { park_id: $.data.id }
            - call: "POST /v1/_clock/set_current_utc"
              payload: { now_utc: "2026-06-01T00:00:00Z" }
              as: park_admin
            - call: "POST /v1/accounts"
              payload: { email: "paJ@x.com", full_name: "PAJ", birth_date: "1980-01-01", role: "park_admin", home_park_id: "${park_id}" }
              as: system
              captures: { pa_id: $.data.id }
            - call: "POST /v1/accounts"
              payload: { email: "h@x.com", full_name: "H", birth_date: "1990-01-01" }
              as: visitor
              captures: { h_id: $.data.id }
            - call: "POST /v1/accounts"
              payload: { email: "w1@x.com", full_name: "W1", birth_date: "1990-01-01" }
              as: visitor
              captures: { w1_id: $.data.id }
            - call: "POST /v1/accounts"
              payload: { email: "w2@x.com", full_name: "W2", birth_date: "1990-01-01" }
              as: visitor
              captures: { w2_id: $.data.id }
            - call: "POST /v1/campsites"
              payload: { park_id: "${park_id}", site_number: "TJ", site_type: "tent", max_occupancy: 6, base_nightly_cents: 4000 }
              as: park_admin
              as_user_id: "${pa_id}"
              captures: { site_id: $.data.id }
            - call: "POST /v1/camp-reservations"
              payload: { campsite_id: "${site_id}", account_id: "${h_id}", check_in: "2026-06-25", check_out: "2026-06-27", party_size: 2 }
              as: visitor
              as_user_id: "${h_id}"
              captures: { r_id: $.data.id }
            - call: "POST /v1/camp-reservations/${r_id}/confirm"
              payload: {}
              as: visitor
              as_user_id: "${h_id}"
            - call: "GET /v1/campsites/${site_id}"
              payload: {}
              as: visitor
              as_user_id: "${w1_id}"
              captures: { site_v1: $.data.version }
            - call: "POST /v1/waitlist-entries"
              payload: { campsite_id: "${site_id}", account_id: "${w1_id}", check_in: "2026-06-25", check_out: "2026-06-27", party_size: 2, expected_campsite_version: "${site_v1}" }
              as: visitor
              as_user_id: "${w1_id}"
              captures: { wl1: $.data.id, pos1: $.data.position }
            - call: "GET /v1/campsites/${site_id}"
              payload: {}
              as: visitor
              as_user_id: "${w2_id}"
              captures: { site_v2: $.data.version }
            - call: "POST /v1/waitlist-entries"
              payload: { campsite_id: "${site_id}", account_id: "${w2_id}", check_in: "2026-06-25", check_out: "2026-06-27", party_size: 2, expected_campsite_version: "${site_v2}" }
              as: visitor
              as_user_id: "${w2_id}"
              captures: { wl2: $.data.id, pos2: $.data.position }
            - call: "POST /v1/camp-reservations/${r_id}/cancel"
              payload: {}
              as: visitor
              as_user_id: "${h_id}"
            - call: "POST /v1/_clock/set_current_utc"
              payload: { now_utc: "2026-06-02T01:00:00Z" }
              as: park_admin
          trigger:
            - call: "POST /v1/_ops/run"
              payload: {}
              as: park_admin
              as_user_id: "${pa_id}"
              captures: { advanced: $.data.advanced_offers }
            - call: "GET /v1/waitlist-entries/${wl1}"
              payload: {}
              as: visitor
              as_user_id: "${w1_id}"
              captures: { wl1_status: $.data.status }
            - call: "GET /v1/waitlist-entries/${wl2}"
              payload: {}
              as: visitor
              as_user_id: "${w2_id}"
              captures: { wl2_status: $.data.status, wl2_pos: $.data.position }
          assert:
            - "WaitlistEntry.${wl1}.status == expired"
            - "WaitlistEntry.${wl2}.status == offered"
            - "WaitlistEntry.${wl2}.position == 2 (not renumbered)"

      - name: atb_pass_void_compensation_full_refund
        claim_type: Compensation
        grounds: [state_machines.AtbPass.active_to_voided]
        distinguishing_aspect: "Voiding an annual pass within 30 days fully refunds the purchase Payment and credits Account.credit_balance_cents by 8000."
        test_recipe:
          setup: ["A visitor who bought an annual pass for 8000c; finance voids it within 30 days."]
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { now_utc: "2026-06-01T00:00:00Z" }
              as: park_admin
            - call: "POST /v1/accounts"
              payload: { email: "vK@x.com", full_name: "VK", birth_date: "1990-01-01" }
              as: visitor
              captures: { v_id: $.data.id }
            - call: "POST /v1/accounts"
              payload: { email: "finK@x.com", full_name: "FINK", birth_date: "1980-01-01", role: "finance" }
              as: system
              captures: { fin_id: $.data.id }
            - call: "POST /v1/atb-passes"
              payload: { account_id: "${v_id}", pass_type: "annual", valid_from: "2026-06-01" }
              as: visitor
              as_user_id: "${v_id}"
              captures: { pass_id: $.data.id }
          trigger:
            - call: "POST /v1/atb-passes/${pass_id}/void"
              payload: {}
              as: finance
              captures: { st: $.data.status }
            - call: "GET /v1/accounts/${v_id}"
              payload: {}
              as: visitor
              as_user_id: "${v_id}"
              captures: { bal: $.data.credit_balance_cents }
          assert:
            - "AtbPass.${pass_id}.status == voided"
            - "Account.${v_id}.credit_balance_cents == 8000"

  # =========================================================================
  - section: calculations
    instances:
      - name: atb_price_senior_annual_correct
        claim_type: Correct Result
        grounds: [calculations.atb_price]
        distinguishing_aspect: "A senior_annual pass for a 65-year-old snapshots price_cents == 2000 with a 365-day valid_to."
        test_recipe:
          setup: ["A visitor born 1958-01-01 (age 68); clock 2026-06-01."]
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { now_utc: "2026-06-01T00:00:00Z" }
              as: park_admin
            - call: "POST /v1/accounts"
              payload: { email: "snr@x.com", full_name: "Senior", birth_date: "1958-01-01" }
              as: visitor
              captures: { v_id: $.data.id }
          trigger:
            - call: "POST /v1/atb-passes"
              payload: { account_id: "${v_id}", pass_type: "senior_annual", valid_from: "2026-06-01" }
              as: visitor
              as_user_id: "${v_id}"
              captures: { price: $.data.price_cents, vt: $.data.valid_to }
          assert:
            - "AtbPass.price_cents == 2000"
            - "AtbPass.valid_to == 2027-06-01"

      - name: atb_price_senior_lifetime_never_expires
        claim_type: Constants Applied
        grounds: [calculations.atb_price]
        distinguishing_aspect: "A senior_lifetime pass snapshots price_cents == 8000 and valid_to == null (never expires)."
        test_recipe:
          setup: ["A senior visitor; clock 2026-06-01."]
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { now_utc: "2026-06-01T00:00:00Z" }
              as: park_admin
            - call: "POST /v1/accounts"
              payload: { email: "life@x.com", full_name: "Life", birth_date: "1955-01-01" }
              as: visitor
              captures: { v_id: $.data.id }
          trigger:
            - call: "POST /v1/atb-passes"
              payload: { account_id: "${v_id}", pass_type: "senior_lifetime", valid_from: "2026-06-01" }
              as: visitor
              as_user_id: "${v_id}"
              captures: { price: $.data.price_cents, vt: $.data.valid_to }
          assert:
            - "AtbPass.price_cents == 8000"
            - "AtbPass.valid_to == null"

      - name: lottery_selection_greedy_skip_oversized
        claim_type: Correct Result
        grounds: [calculations.lottery_selection]
        distinguishing_aspect: "Quota 5, equal preference_rank, party sizes [3,4,2] by created order: app1(3) won, app2(4) lost (4>2 remaining), app3(2) won — greedy skip, no partial award."
        test_recipe:
          setup: ["A draw quota 5; three applications party [3,4,2] same preference_rank in that creation order; clock past draw_at; draw run."]
          setup_api_calls:
            - call: "POST /v1/parks"
              payload: { code: "CL01", name: "Calc Park", utc_offset_minutes: 0 }
              as: system
              captures: { park_id: $.data.id }
            - call: "POST /v1/_clock/set_current_utc"
              payload: { now_utc: "2026-05-10T00:00:00Z" }
              as: park_admin
            - call: "POST /v1/accounts"
              payload: { email: "paL@x.com", full_name: "PAL", birth_date: "1980-01-01", role: "park_admin", home_park_id: "${park_id}" }
              as: system
              captures: { pa_id: $.data.id }
            - call: "POST /v1/accounts"
              payload: { email: "a@x.com", full_name: "A", birth_date: "1990-01-01" }
              as: visitor
              captures: { a_id: $.data.id }
            - call: "POST /v1/accounts"
              payload: { email: "b@x.com", full_name: "B", birth_date: "1990-01-01" }
              as: visitor
              captures: { b_id: $.data.id }
            - call: "POST /v1/accounts"
