scaffold_corner_design:
  # =========================================================================
  # Entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_operator_returns_201_with_defaults
        claim_type: Creation
        grounds:
          - entities.Operator
          - endpoints["POST /operators"]
        distinguishing_aspect: "POST /operators with legal_name+contact_email returns 201, account_status=ACTIVE, jeta_month_cumulative_gallons=0, open_invoice_balance_cents=0, and a server-minted UUID id."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /operators"
              payload: { legal_name: "Aero Ops", contact_email: "ops@aero.test" }
              as: BillingClerk
              captures: { op_id: $.data.id }
          assert:
            - "response.http_status == 201"
            - "Operator.${op_id}.account_status == ACTIVE"
            - "Operator.${op_id}.jeta_month_cumulative_gallons == 0"
            - "Operator.${op_id}.open_invoice_balance_cents == 0"
            - "Operator.${op_id}.version == 1"

      - name: create_aircraft_computes_weight_class
        claim_type: Computed Fields
        grounds:
          - entities.Aircraft.fields.weight_class
          - endpoints["POST /aircraft"]
        distinguishing_aspect: "Aircraft with mtow_lb=30000 derives weight_class=MID; the client cannot set weight_class directly (computed)."
        test_recipe:
          setup: ["An operator exists."]
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Aero Ops", contact_email: "ops@aero.test" }
              as: BillingClerk
              captures: { op_id: $.data.id }
          trigger:
            - call: "POST /aircraft"
              payload: { operator_id: "${op_id}", tail_number: "N100AA", fuel_type: "JET_A", mtow_lb: 30000 }
              as: OpsDispatcher
              captures: { ac_id: $.data.id }
          assert:
            - "Aircraft.${ac_id}.weight_class == MID"

      - name: create_service_visit_computes_nights
        claim_type: Computed Fields
        grounds:
          - entities.ServiceVisit.fields.nights
          - endpoints["POST /service-visits"]
        distinguishing_aspect: "A visit arriving 2026-06-14T08:00Z departing 2026-06-17T08:00Z spans exactly 3 24h periods -> nights=3."
        test_recipe:
          setup: ["An operator and JET_A aircraft exist."]
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Aero Ops", contact_email: "ops@aero.test" }
              as: BillingClerk
              captures: { op_id: $.data.id }
            - call: "POST /aircraft"
              payload: { operator_id: "${op_id}", tail_number: "N100AA", fuel_type: "JET_A", mtow_lb: 30000 }
              as: OpsDispatcher
              captures: { ac_id: $.data.id }
          trigger:
            - call: "POST /service-visits"
              payload: { operator_id: "${op_id}", aircraft_id: "${ac_id}", arrival_utc: "2026-06-14T08:00:00.000Z", departure_utc: "2026-06-17T08:00:00.000Z" }
              as: OpsDispatcher
              captures: { v_id: $.data.id }
          assert:
            - "ServiceVisit.${v_id}.nights == 3"
            - "ServiceVisit.${v_id}.status == SCHEDULED"
            - "ServiceVisit.${v_id}.services_outstanding == 0"

      - name: get_operator_not_found
        claim_type: Not Found
        grounds:
          - endpoints["GET /operators/{id}"]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /operators/{random uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /operators/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: BillingClerk
          assert:
            - "response.error_id == ERR_NOT_FOUND"
            - "response.http_status == 404"

      - name: create_fuel_order_missing_required_field
        claim_type: Required Fields
        grounds:
          - entities.FuelOrder
          - endpoints["POST /fuel-orders"]
          - errors[ERR_MISSING_FIELD]
        distinguishing_aspect: "POST /fuel-orders omitting ordered_gallons returns ERR_MISSING_FIELD (400)."
        test_recipe:
          setup: ["Operator, JET_A aircraft, ACTIVE JET_A contract, ON_GROUND visit exist."]
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Aero Ops", contact_email: "ops@aero.test" }
              as: BillingClerk
              captures: { op_id: $.data.id }
            - call: "POST /aircraft"
              payload: { operator_id: "${op_id}", tail_number: "N100AA", fuel_type: "JET_A", mtow_lb: 30000 }
              as: OpsDispatcher
              captures: { ac_id: $.data.id }
            - call: "POST /fuel-contracts"
              payload: { operator_id: "${op_id}", product: "JET_A", base_price_cents_per_gal: 520, tankering_fee_cents_per_gal: 30 }
              as: BillingClerk
              captures: { fc_id: $.data.id }
            - call: "POST /service-visits"
              payload: { operator_id: "${op_id}", aircraft_id: "${ac_id}", arrival_utc: "2026-06-14T08:00:00.000Z", departure_utc: "2026-06-15T08:00:00.000Z" }
              as: OpsDispatcher
              captures: { v_id: $.data.id }
          trigger:
            - call: "POST /fuel-orders"
              payload: { service_visit_id: "${v_id}", aircraft_id: "${ac_id}", fuel_contract_id: "${fc_id}", product: "JET_A" }
              as: FuelTech
          assert:
            - "response.error_id == ERR_MISSING_FIELD"
            - "response.http_status == 400"

      - name: create_fuel_order_zero_gallons_rejected
        claim_type: Type Constraints
        grounds:
          - entities.FuelOrder.fields.ordered_gallons
          - endpoints["POST /fuel-orders"]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "ordered_gallons=0 violates the >=1 constraint -> ERR_VALIDATION (422)."
        test_recipe:
          setup: ["Operator, JET_A aircraft, ACTIVE JET_A contract, a visit exist."]
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Aero Ops", contact_email: "ops@aero.test" }
              as: BillingClerk
              captures: { op_id: $.data.id }
            - call: "POST /aircraft"
              payload: { operator_id: "${op_id}", tail_number: "N100AA", fuel_type: "JET_A", mtow_lb: 30000 }
              as: OpsDispatcher
              captures: { ac_id: $.data.id }
            - call: "POST /fuel-contracts"
              payload: { operator_id: "${op_id}", product: "JET_A", base_price_cents_per_gal: 520, tankering_fee_cents_per_gal: 30 }
              as: BillingClerk
              captures: { fc_id: $.data.id }
            - call: "POST /service-visits"
              payload: { operator_id: "${op_id}", aircraft_id: "${ac_id}", arrival_utc: "2026-06-14T08:00:00.000Z", departure_utc: "2026-06-15T08:00:00.000Z" }
              as: OpsDispatcher
              captures: { v_id: $.data.id }
          trigger:
            - call: "POST /fuel-orders"
              payload: { service_visit_id: "${v_id}", aircraft_id: "${ac_id}", fuel_contract_id: "${fc_id}", product: "JET_A", ordered_gallons: 0 }
              as: FuelTech
          assert:
            - "response.error_id == ERR_VALIDATION"
            - "response.http_status == 422"

      - name: fuel_order_defaults_tankering_false
        claim_type: Defaults
        grounds:
          - entities.FuelOrder.fields.tankering
          - endpoints["POST /fuel-orders"]
        distinguishing_aspect: "Omitting tankering defaults it to false; the order prices via the volume-discount variant on dispatch."
        test_recipe:
          setup: ["Operator, JET_A aircraft, ACTIVE JET_A contract, ON_GROUND visit."]
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Aero Ops", contact_email: "ops@aero.test" }
              as: BillingClerk
              captures: { op_id: $.data.id }
            - call: "POST /aircraft"
              payload: { operator_id: "${op_id}", tail_number: "N100AA", fuel_type: "JET_A", mtow_lb: 30000 }
              as: OpsDispatcher
              captures: { ac_id: $.data.id }
            - call: "POST /fuel-contracts"
              payload: { operator_id: "${op_id}", product: "JET_A", base_price_cents_per_gal: 520, tankering_fee_cents_per_gal: 30 }
              as: BillingClerk
              captures: { fc_id: $.data.id }
            - call: "POST /service-visits"
              payload: { operator_id: "${op_id}", aircraft_id: "${ac_id}", arrival_utc: "2026-06-14T08:00:00.000Z", departure_utc: "2026-06-15T08:00:00.000Z" }
              as: OpsDispatcher
              captures: { v_id: $.data.id }
          trigger:
            - call: "POST /fuel-orders"
              payload: { service_visit_id: "${v_id}", aircraft_id: "${ac_id}", fuel_contract_id: "${fc_id}", product: "JET_A", ordered_gallons: 6000 }
              as: FuelTech
              captures: { fo_id: $.data.id }
          assert:
            - "FuelOrder.${fo_id}.tankering == false"

      - name: create_aircraft_unknown_operator_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.Aircraft.fields.operator_id
          - endpoints["POST /aircraft"]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "POST /aircraft with a non-existent operator_id FK returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /aircraft"
              payload: { operator_id: "00000000-0000-4000-8000-000000000000", tail_number: "N1", fuel_type: "JET_A", mtow_lb: 9000 }
              as: OpsDispatcher
          assert:
            - "response.error_id == ERR_NOT_FOUND"
            - "response.http_status == 404"

  # =========================================================================
  # State Machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: dispatch_already_dispatched_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.FuelOrder.REQUESTED_to_DISPATCHED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Dispatching an order already DISPATCHED -> ERR_INVALID_STATE (409); priced_amount_cents unchanged."
        test_recipe:
          setup: ["A DISPATCHED non-tankering JET_A 6000-gal order priced 3115000."]
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Aero Ops", contact_email: "ops@aero.test" }
              as: BillingClerk
              captures: { op_id: $.data.id }
            - call: "POST /aircraft"
              payload: { operator_id: "${op_id}", tail_number: "N100AA", fuel_type: "JET_A", mtow_lb: 30000 }
              as: OpsDispatcher
              captures: { ac_id: $.data.id }
            - call: "POST /fuel-contracts"
              payload: { operator_id: "${op_id}", product: "JET_A", base_price_cents_per_gal: 520, tankering_fee_cents_per_gal: 30 }
              as: BillingClerk
              captures: { fc_id: $.data.id }
            - call: "POST /service-visits"
              payload: { operator_id: "${op_id}", aircraft_id: "${ac_id}", arrival_utc: "2026-06-14T08:00:00.000Z", departure_utc: "2026-06-15T08:00:00.000Z" }
              as: OpsDispatcher
              captures: { v_id: $.data.id }
            - call: "POST /service-visits/${v_id}/arrive"
              payload: {}
              as: OpsDispatcher
            - call: "POST /fuel-orders"
              payload: { service_visit_id: "${v_id}", aircraft_id: "${ac_id}", fuel_contract_id: "${fc_id}", product: "JET_A", ordered_gallons: 6000, tankering: false }
              as: FuelTech
              captures: { fo_id: $.data.id }
            - call: "POST /fuel-orders/${fo_id}/dispatch"
              payload: {}
              as: FuelTech
          trigger:
            - call: "POST /fuel-orders/${fo_id}/dispatch"
              payload: {}
              as: FuelTech
          assert:
            - "response.error_id == ERR_INVALID_STATE"
            - "FuelOrder.${fo_id}.priced_amount_cents == 3115000"

      - name: depart_from_scheduled_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.ServiceVisit.READY_FOR_DEPARTURE_to_DEPARTED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Departing a SCHEDULED visit (never arrived) -> ERR_INVALID_STATE; no Invoice is created."
        test_recipe:
          setup: ["A SCHEDULED visit, never arrived."]
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Aero Ops", contact_email: "ops@aero.test" }
              as: BillingClerk
              captures: { op_id: $.data.id }
            - call: "POST /aircraft"
              payload: { operator_id: "${op_id}", tail_number: "N100AA", fuel_type: "JET_A", mtow_lb: 30000 }
              as: OpsDispatcher
              captures: { ac_id: $.data.id }
            - call: "POST /service-visits"
              payload: { operator_id: "${op_id}", aircraft_id: "${ac_id}", arrival_utc: "2026-06-14T08:00:00.000Z", departure_utc: "2026-06-15T08:00:00.000Z" }
              as: OpsDispatcher
              captures: { v_id: $.data.id }
          trigger:
            - call: "POST /service-visits/${v_id}/depart"
              payload: {}
              as: OpsDispatcher
          assert:
            - "response.error_id == ERR_INVALID_STATE"
            - "ServiceVisit.${v_id}.status == SCHEDULED"

      - name: cancel_departed_visit_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.ServiceVisit.terminal_states
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Cancelling a DEPARTED (terminal) visit -> ERR_INVALID_STATE; no cascade fires."
        test_recipe:
          setup: ["A DEPARTED visit (arrived, occupied a TIE_DOWN spot, marked ready, departed) with an Invoice already issued."]
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Aero Ops", contact_email: "ops@aero.test" }
              as: BillingClerk
              captures: { op_id: $.data.id }
            - call: "POST /aircraft"
              payload: { operator_id: "${op_id}", tail_number: "N100AA", fuel_type: "JET_A", mtow_lb: 30000 }
              as: OpsDispatcher
              captures: { ac_id: $.data.id }
            - call: "POST /parking-spots"
              payload: { label: "TD-22", spot_type: "TIE_DOWN", max_weight_class: "HEAVY" }
              as: OpsDispatcher
              captures: { spot_id: $.data.id }
            - call: "POST /service-visits"
              payload: { operator_id: "${op_id}", aircraft_id: "${ac_id}", arrival_utc: "2026-06-14T08:00:00.000Z", departure_utc: "2026-06-15T08:00:00.000Z" }
              as: OpsDispatcher
              captures: { v_id: $.data.id }
            - call: "POST /service-visits/${v_id}/arrive"
              payload: {}
              as: OpsDispatcher
            - call: "POST /parking-assignments"
              payload: { service_visit_id: "${v_id}", spot_id: "${spot_id}", occupy_start_utc: "2026-06-14T08:00:00.000Z", occupy_end_utc: "2026-06-15T08:00:00.000Z" }
              as: OpsDispatcher
              captures: { pa_id: $.data.id, pa_ver: $.data.version }
            - call: "POST /parking-assignments/${pa_id}/occupy"
              payload: { expected_assignment_version: "${pa_ver}" }
              as: OpsDispatcher
            - call: "POST /service-visits/${v_id}/start-servicing"
              payload: {}
              as: OpsDispatcher
            - call: "POST /service-visits/${v_id}/mark-ready"
              payload: {}
              as: OpsDispatcher
            - call: "POST /service-visits/${v_id}/depart"
              payload: {}
              as: OpsDispatcher
          trigger:
            - call: "POST /service-visits/${v_id}/cancel"
              payload: {}
              as: OpsDispatcher
          assert:
            - "response.error_id == ERR_INVALID_STATE"
            - "ServiceVisit.${v_id}.status == DEPARTED"

      - name: mark_past_due_suspends_operator_cross_entity
        claim_type: Cross-entity
        grounds:
          - state_machines.Invoice.ISSUED_to_PAST_DUE
          - entities.Operator.fields.account_status
        distinguishing_aspect: "Marking an ISSUED invoice PAST_DUE sets the owning operator.account_status=SUSPENDED (cross-entity side effect)."
        test_recipe:
          setup: ["A DEPARTED visit with one ISSUED Invoice (total 180000 from a tankered 6000-gal order)."]
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Aero Ops", contact_email: "ops@aero.test" }
              as: BillingClerk
              captures: { op_id: $.data.id }
            - call: "POST /aircraft"
              payload: { operator_id: "${op_id}", tail_number: "N100AA", fuel_type: "JET_A", mtow_lb: 30000 }
              as: OpsDispatcher
              captures: { ac_id: $.data.id }
            - call: "POST /fuel-contracts"
              payload: { operator_id: "${op_id}", product: "JET_A", base_price_cents_per_gal: 520, tankering_fee_cents_per_gal: 30 }
              as: BillingClerk
              captures: { fc_id: $.data.id }
            - call: "POST /service-visits"
              payload: { operator_id: "${op_id}", aircraft_id: "${ac_id}", arrival_utc: "2026-06-14T08:00:00.000Z", departure_utc: "2026-06-15T08:00:00.000Z" }
              as: OpsDispatcher
              captures: { v_id: $.data.id }
            - call: "POST /service-visits/${v_id}/arrive"
              payload: {}
              as: OpsDispatcher
            - call: "POST /fuel-orders"
              payload: { service_visit_id: "${v_id}", aircraft_id: "${ac_id}", fuel_contract_id: "${fc_id}", product: "JET_A", ordered_gallons: 6000, tankering: true }
              as: FuelTech
              captures: { fo_id: $.data.id }
            - call: "POST /fuel-orders/${fo_id}/dispatch"
              payload: {}
              as: FuelTech
            - call: "POST /fuel-orders/${fo_id}/complete-fueling"
              payload: {}
              as: FuelTech
            - call: "POST /service-visits/${v_id}/mark-ready"
              payload: {}
              as: OpsDispatcher
            - call: "POST /service-visits/${v_id}/depart"
              payload: {}
              as: OpsDispatcher
            - call: "GET /invoices"
              payload: { service_visit_id: "${v_id}" }
              as: BillingClerk
              captures: { inv_id: $.data.0.id }
          trigger:
            - call: "POST /invoices/${inv_id}/mark-past-due"
              payload: {}
              as: BillingClerk
          assert:
            - "Invoice.${inv_id}.status == PAST_DUE"
            - "Operator.${op_id}.account_status == SUSPENDED"

      - name: complete_ramp_service_bubbles_up_counter
        claim_type: Bubble up
        grounds:
          - state_machines.RampService.IN_PROGRESS_to_COMPLETED
          - entities.ServiceVisit.fields.services_outstanding
        distinguishing_aspect: "Completing the last outstanding service decrements ServiceVisit.services_outstanding to 0, enabling mark-ready."
        test_recipe:
          setup: ["A SERVICING visit with one IN_PROGRESS GPU service (services_outstanding==1)."]
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Aero Ops", contact_email: "ops@aero.test" }
              as: BillingClerk
              captures: { op_id: $.data.id }
            - call: "POST /aircraft"
              payload: { operator_id: "${op_id}", tail_number: "N100AA", fuel_type: "JET_A", mtow_lb: 30000 }
              as: OpsDispatcher
              captures: { ac_id: $.data.id }
            - call: "POST /parking-spots"
              payload: { label: "TD-31", spot_type: "TIE_DOWN", max_weight_class: "HEAVY" }
              as: OpsDispatcher
              captures: { spot_id: $.data.id }
            - call: "POST /service-visits"
              payload: { operator_id: "${op_id}", aircraft_id: "${ac_id}", arrival_utc: "2026-06-14T08:00:00.000Z", departure_utc: "2026-06-15T08:00:00.000Z" }
              as: OpsDispatcher
              captures: { v_id: $.data.id }
            - call: "POST /service-visits/${v_id}/arrive"
              payload: {}
              as: OpsDispatcher
            - call: "POST /parking-assignments"
              payload: { service_visit_id: "${v_id}", spot_id: "${spot_id}", occupy_start_utc: "2026-06-14T08:00:00.000Z", occupy_end_utc: "2026-06-15T08:00:00.000Z" }
              as: OpsDispatcher
              captures: { pa_id: $.data.id, pa_ver: $.data.version }
            - call: "POST /parking-assignments/${pa_id}/occupy"
              payload: { expected_assignment_version: "${pa_ver}" }
              as: OpsDispatcher
            - call: "POST /service-visits/${v_id}/start-servicing"
              payload: {}
              as: OpsDispatcher
            - call: "POST /ramp-services"
              payload: { service_visit_id: "${v_id}", service_type: "GPU" }
              as: OpsDispatcher
              captures: { rs_id: $.data.id }
            - call: "POST /ramp-services/${rs_id}/start"
              payload: {}
              as: LineManager
          trigger:
            - call: "POST /ramp-services/${rs_id}/complete"
              payload: {}
              as: LineManager
          assert:
            - "RampService.${rs_id}.status == COMPLETED"
            - "ServiceVisit.${v_id}.services_outstanding == 0"

      - name: re_request_from_approved_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.RampSlot.REVOKED_to_REQUESTED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Re-requesting a slot that is APPROVED (not REVOKED) -> ERR_INVALID_STATE; status stays APPROVED."
        test_recipe:
          setup: ["An APPROVED RampSlot on a RAMP pad for a SCHEDULED visit."]
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Aero Ops", contact_email: "ops@aero.test" }
              as: BillingClerk
              captures: { op_id: $.data.id }
            - call: "POST /aircraft"
              payload: { operator_id: "${op_id}", tail_number: "N100AA", fuel_type: "JET_A", mtow_lb: 30000 }
              as: OpsDispatcher
              captures: { ac_id: $.data.id }
            - call: "POST /parking-spots"
              payload: { label: "PAD-13", spot_type: "RAMP", max_weight_class: "HEAVY" }
              as: OpsDispatcher
              captures: { pad_id: $.data.id }
            - call: "POST /service-visits"
              payload: { operator_id: "${op_id}", aircraft_id: "${ac_id}", arrival_utc: "2026-06-14T08:00:00.000Z", departure_utc: "2026-06-15T08:00:00.000Z" }
              as: OpsDispatcher
              captures: { v_id: $.data.id }
            - call: "POST /ramp-slots"
              payload: { service_visit_id: "${v_id}", pad_id: "${pad_id}", window_start_utc: "2026-06-14T10:00:00.000Z", window_end_utc: "2026-06-14T11:00:00.000Z" }
              as: OpsDispatcher
              captures: { slot_id: $.data.id }
            - call: "POST /ramp-slots/${slot_id}/approve"
              payload: {}
              as: OpsDispatcher
          trigger:
            - call: "POST /ramp-slots/${slot_id}/re-request"
              payload: {}
              as: Operator
              as_user_id: "${op_id}"
          assert:
            - "response.error_id == ERR_INVALID_STATE"
            - "RampSlot.${slot_id}.status == APPROVED"

      - name: fuel_order_parallel_axes_independent_covered
        claim_type: parallel
        grounds:
          - state_machines.FuelOrder.NOT_STARTED_to_RECONCILED
        excluded_because:
          difficulty_instance: non_linear_state_machine / fuel_order_parallel_axes_independent
          rationale: "The independent evolution of logistics_status and reconciliation_status on one FuelOrder is asserted by the named §1.8 instance."

      - name: ramp_slot_cycle_covered
        claim_type: cyclic
        grounds:
          - state_machines.RampSlot.REVOKED_to_REQUESTED
        excluded_because:
          difficulty_instance: non_linear_state_machine / ramp_slot_revoke_re_request_cycle
