    output: PriceList[]
    side_effects: []
  - method: GET
    path: "/vehicles/{id}/orders"
    description: "Reverse FK: orders on vehicle"
    roles: [PlatformAdmin, ContractsManager, ComplianceOfficer, Auditor, FinanceOps, ResellerOps]
