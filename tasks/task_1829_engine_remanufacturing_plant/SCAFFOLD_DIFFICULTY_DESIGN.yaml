            - "captured c2_credit == 0 (months 11: prorated round_half_up(212500 x 1/12) == 17708, then max(0, 17708 - 20000) floors at 0)"
            - "captured dbuy_credit == 151875 (sum of both settlements)"

  # =================================================================
  # Rule 3 — non_linear_state_machine
  # =================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: work_order_dyno_rework_loop
        grounds:
          - state_machines.RemanWorkOrder.DYNO_TEST_to_MACHINING
          - state_machines.RemanEngine.BUILT_to_BUILT
        distinguishing_aspect: |
          Cyclic machine on RemanWorkOrder: DYNO_TEST -> MACHINING rework loop
          (triggered by a failed dyno) resets all route operations to PENDING and
          the second pass through ASSEMBLY must NOT mint a second engine.
        test_recipe:
          setup:
            - "1-op spec ACTIVE; Distributor D-R supplied a graded core; work order W driven to DYNO_TEST with engine E created; first dyno FAIL (horsepower 250 < 300)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /distributors"
              payload: { distributor_code: "D-R", name: "Reman Core Co", emissions_requirement: "FEDERAL", credit_limit_cents: 1000000, volume_discount_pct: 0.0 }
              as: PlantAdmin
              captures: { d1: $.data.id }
            - call: "POST /build-specs"
              payload: { engine_family: "SBC-350", application_code: "BLAZER-1995", emissions_tier: "FEDERAL", list_price_cents: 250000, core_deposit_cents: 200000, core_base_credit_cents: 100000, allowed_reuse_grades: ["REUSE_OK"], allowed_interchange_groups: ["CRANK-SBC-3.48"], dyno_min_horsepower: 300, dyno_min_oil_pressure_psi: 20.0, dyno_max_coolant_temp_f: 210, required_op_sequence: ["CRANK_GRIND"] }
              as: PlantAdmin
              captures: { s1: $.data.id }
            - call: "POST /build-specs/${s1}/activate"
              as: PlantAdmin
            - call: "POST /core-returns"
              payload: { distributor_id: "${d1}", build_spec_id: "${s1}" }
              as: Distributor
              as_user_id: "${d1}"
              captures: { r1: $.data.id }
            - call: "POST /core-returns/${r1}/grade"
              payload: { grade: "GRADE_A", missing_components: [] }
              as: CoreInspector
            - call: "POST /work-orders"
              payload: { core_return_id: "${r1}" }
              as: PlantAdmin
              captures: { w1: $.data.id }
            - call: "POST /work-orders/${w1}/advance"
              payload: { target: "TEARDOWN" }
              as: ShopTechnician
              captures: { w1v: $.data.version }
            - call: "POST /work-orders/${w1}/operations"
              payload: { op_type: "CRANK_GRIND", sequence: 1, expected_work_order_version: "${w1v}" }
              as: ShopTechnician
              captures: { o1: $.data.id }
            - call: "POST /work-orders/${w1}/advance"
              payload: { target: "MACHINING" }
              as: ShopTechnician
            - call: "POST /operations/${o1}/perform"
              payload: { station_code: "STN-CRANK-3", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T09:00:00Z", result: "PASS" }
              as: ShopTechnician
            - call: "POST /work-orders/${w1}/advance"
              payload: { target: "ASSEMBLY" }
              as: ShopTechnician
            - call: "GET /work-orders/${w1}"
              as: PlantAdmin
              captures: { e1: $.data.reman_engine_id }
            - call: "POST /work-orders/${w1}/advance"
              payload: { target: "DYNO_TEST" }
              as: ShopTechnician
            - call: "POST /reman-engines/${e1}/dyno-tests"
              payload: { dyno_cell_code: "CELL-3", started_at: "2026-08-03T08:00:00Z", ended_at: "2026-08-03T09:00:00Z", horsepower: 250, oil_pressure_psi: 25.0, coolant_temp_f: 195 }
              as: ShopTechnician
              as_user_id: "tech-1"
              captures: { dt1_result: $.data.result }
          trigger:
            - call: "POST /work-orders/${w1}/advance"
              payload: { target: "MACHINING" }
              as: ShopTechnician
              captures: { w1_rework: $.data.rework_count }
            - call: "GET /work-orders/${w1}/operations"
              as: PlantAdmin
              captures: { o1_status_after_rework: $.data.0.status }
            - call: "POST /operations/${o1}/perform"
              payload: { station_code: "STN-CRANK-3", scheduled_start: "2026-08-04T08:00:00Z", scheduled_end: "2026-08-04T09:00:00Z", result: "PASS" }
              as: ShopTechnician
              captures: { o1_attempts: $.data.attempt_count }
            - call: "POST /work-orders/${w1}/advance"
              payload: { target: "ASSEMBLY" }
              as: ShopTechnician
            - call: "GET /work-orders/${w1}"
              as: PlantAdmin
              captures: { e1_again: $.data.reman_engine_id }
            - call: "POST /work-orders/${w1}/advance"
              payload: { target: "DYNO_TEST" }
              as: ShopTechnician
            - call: "POST /reman-engines/${e1}/dyno-tests"
              payload: { dyno_cell_code: "CELL-3", started_at: "2026-08-05T08:00:00Z", ended_at: "2026-08-05T09:00:00Z", horsepower: 320, oil_pressure_psi: 25.0, coolant_temp_f: 195 }
              as: ShopTechnician
              as_user_id: "tech-1"
            - call: "POST /reman-engines/${e1}/seal"
              as: QualityInspector
              as_user_id: "qi-1"
            - call: "GET /work-orders/${w1}"
              as: PlantAdmin
              captures: { w1_final: $.data.status }
          assert:
            - "captured dt1_result == FAIL and engine stayed BUILT"
            - "captured w1_rework == 1 (one DYNO_TEST -> MACHINING loop)"
            - "captured o1_status_after_rework == PENDING (rework resets the route)"
            - "captured o1_attempts == 2 (re-perform after reset)"
            - "captured e1_again == captured e1 (re-entering ASSEMBLY does not mint a new engine)"
            - "captured w1_final == CLOSED (seal bubbles up)"
            - "RemanEngine.${e1}.status == SEALED"

      - name: core_return_dispute_regrade_cycle
        grounds:
          - state_machines.CoreReturn.GRADED_to_DISPUTED
          - state_machines.CoreReturn.DISPUTED_to_GRADED
        distinguishing_aspect: |
          Cyclic machine on CoreReturn (different entity than the sibling
          instance): GRADED -> DISPUTED -> GRADED reverses and re-posts the
          distributor credit, so the ledger tracks each loop without drift.
        test_recipe:
          setup:
            - "Distributor D-300; ACTIVE spec with core_base_credit_cents=100000; return R received"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /distributors"
              payload: { distributor_code: "D-300", name: "Cycle Parts", emissions_requirement: "FEDERAL", credit_limit_cents: 1000000, volume_discount_pct: 0.0 }
              as: PlantAdmin
              captures: { d1: $.data.id }
            - call: "POST /build-specs"
              payload: { engine_family: "SBC-350", application_code: "S10-1994", emissions_tier: "FEDERAL", list_price_cents: 250000, core_deposit_cents: 200000, core_base_credit_cents: 100000, allowed_reuse_grades: ["REUSE_OK"], allowed_interchange_groups: ["CRANK-SBC-3.48"], dyno_min_horsepower: 300, dyno_min_oil_pressure_psi: 20.0, dyno_max_coolant_temp_f: 210, required_op_sequence: ["CRANK_GRIND"] }
              as: PlantAdmin
              captures: { s1: $.data.id }
            - call: "POST /build-specs/${s1}/activate"
              as: PlantAdmin
            - call: "POST /core-returns"
              payload: { distributor_id: "${d1}", build_spec_id: "${s1}" }
              as: Distributor
              as_user_id: "${d1}"
              captures: { r1: $.data.id }
            - call: "POST /core-returns/${r1}/grade"
              payload: { grade: "GRADE_B", missing_components: [] }
              as: CoreInspector
              captures: { g1_final: $.data.final_credit_cents }
            - call: "GET /distributors/${d1}"
              as: PlantAdmin
              captures: { bal_after_grade: $.data.credit_balance_cents }
          trigger:
            - call: "POST /core-returns/${r1}/respond"
              payload: { action: "DISPUTE" }
              as: Distributor
              as_user_id: "${d1}"
              captures: { disp_status: $.data.status, disp_count: $.data.dispute_count }
            - call: "GET /distributors/${d1}"
              as: PlantAdmin
              captures: { bal_after_dispute: $.data.credit_balance_cents }
            - call: "POST /core-returns/${r1}/grade"
              payload: { grade: "GRADE_A", missing_components: [] }
              as: CoreInspector
              captures: { g2_final: $.data.final_credit_cents }
            - call: "GET /distributors/${d1}"
              as: PlantAdmin
              captures: { bal_after_regrade: $.data.credit_balance_cents }
            - call: "POST /core-returns/${r1}/respond"
              payload: { action: "ACCEPT" }
              as: Distributor
              as_user_id: "${d1}"
              captures: { final_status: $.data.status }
          assert:
            - "captured g1_final == 60000 (GRADE_B x 100000)"
            - "captured bal_after_grade == 60000"
            - "captured disp_status == DISPUTED and captured disp_count == 1"
            - "captured bal_after_dispute == 0 (dispute suspends the credit)"
            - "captured g2_final == 100000 (re-grade to GRADE_A)"
            - "captured bal_after_regrade == 100000 (re-grade re-posts the new credit; net delta +40000 vs first grading)"
            - "captured final_status == CLOSED"

  # =================================================================
  # Rule 4 — transitive_cascade
  # =================================================================
  - rule_id: transitive_cascade
    instances:
      - name: replacement_adjudication_depth3_chain
        grounds:
          - state_machines.WarrantyClaim.TEARDOWN_COMPLETE_to_APPROVED_REPLACEMENT
          - state_machines.RemanEngine.SEALED_to_SOLD
          - state_machines.CoreDeposit.transitions
        distinguishing_aspect: |
          Depth-3 chain from the adjudicate trigger: claim adjudication (A) moves
          the replacement engine SEALED -> SOLD (B); that sale itself creates a
          HELD CoreDeposit (C); the deposit creation then debits the distributor
          ledger deposits_held_cents (D). Each link is caused by the previous one.
        test_recipe:
          setup:
            - "Distributor D-CL bought engine E-F (deposit 200000 HELD, deposits_held_cents == 200000)"
            - "Claim C on E-F filed and torn down (claim TEARDOWN_COMPLETE, E-F RETURNED)"
            - "Engine E-R of the same spec sits SEALED and unsold as the replacement pool"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /distributors"
              payload: { distributor_code: "D-SRC", name: "Core Source", emissions_requirement: "FEDERAL", credit_limit_cents: 1000000, volume_discount_pct: 0.0 }
              as: PlantAdmin
              captures: { dcore: $.data.id }
            - call: "POST /distributors"
              payload: { distributor_code: "D-CL", name: "Claimant Dist", emissions_requirement: "FEDERAL", credit_limit_cents: 2000000, volume_discount_pct: 0.0 }
              as: PlantAdmin
              captures: { dcl: $.data.id }
            - call: "POST /build-specs"
              payload: { engine_family: "SBC-350", application_code: "ASTRO-1996", emissions_tier: "FEDERAL", list_price_cents: 250000, core_deposit_cents: 200000, core_base_credit_cents: 100000, allowed_reuse_grades: ["REUSE_OK"], allowed_interchange_groups: ["CRANK-SBC-3.48"], dyno_min_horsepower: 300, dyno_min_oil_pressure_psi: 20.0, dyno_max_coolant_temp_f: 210, required_op_sequence: ["CRANK_GRIND"] }
              as: PlantAdmin
              captures: { s1: $.data.id }
            - call: "POST /build-specs/${s1}/activate"
              as: PlantAdmin
            # E-F chain
            - call: "POST /core-returns"
              payload: { distributor_id: "${dcore}", build_spec_id: "${s1}" }
              as: Distributor
              as_user_id: "${dcore}"
              captures: { r1: $.data.id }
            - call: "POST /core-returns/${r1}/grade"
              payload: { grade: "GRADE_A", missing_components: [] }
              as: CoreInspector
            - call: "POST /work-orders"
              payload: { core_return_id: "${r1}" }
              as: PlantAdmin
              captures: { w1: $.data.id }
            - call: "POST /work-orders/${w1}/advance"
              payload: { target: "TEARDOWN" }
              as: ShopTechnician
              captures: { w1v: $.data.version }
            - call: "POST /work-orders/${w1}/operations"
              payload: { op_type: "CRANK_GRIND", sequence: 1, expected_work_order_version: "${w1v}" }
              as: ShopTechnician
              captures: { o1: $.data.id }
            - call: "POST /work-orders/${w1}/advance"
              payload: { target: "MACHINING" }
              as: ShopTechnician
            - call: "POST /operations/${o1}/perform"
              payload: { station_code: "STN-CRANK-4", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T09:00:00Z", result: "PASS" }
              as: ShopTechnician
            - call: "POST /work-orders/${w1}/advance"
              payload: { target: "ASSEMBLY" }
              as: ShopTechnician
            - call: "GET /work-orders/${w1}"
              as: PlantAdmin
              captures: { ef: $.data.reman_engine_id }
            - call: "POST /work-orders/${w1}/advance"
              payload: { target: "DYNO_TEST" }
              as: ShopTechnician
            - call: "POST /reman-engines/${ef}/dyno-tests"
              payload: { dyno_cell_code: "CELL-4", started_at: "2026-08-03T08:00:00Z", ended_at: "2026-08-03T09:00:00Z", horsepower: 320, oil_pressure_psi: 25.0, coolant_temp_f: 195 }
              as: ShopTechnician
              as_user_id: "tech-1"
            - call: "POST /reman-engines/${ef}/seal"
              as: QualityInspector
              as_user_id: "qi-1"
            # E-R chain (replacement pool)
            - call: "POST /core-returns"
              payload: { distributor_id: "${dcore}", build_spec_id: "${s1}" }
              as: Distributor
              as_user_id: "${dcore}"
              captures: { r2: $.data.id }
            - call: "POST /core-returns/${r2}/grade"
              payload: { grade: "GRADE_A", missing_components: [] }
              as: CoreInspector
            - call: "POST /work-orders"
              payload: { core_return_id: "${r2}" }
              as: PlantAdmin
              captures: { w2: $.data.id }
            - call: "POST /work-orders/${w2}/advance"
              payload: { target: "TEARDOWN" }
              as: ShopTechnician
              captures: { w2v: $.data.version }
            - call: "POST /work-orders/${w2}/operations"
              payload: { op_type: "CRANK_GRIND", sequence: 1, expected_work_order_version: "${w2v}" }
              as: ShopTechnician
              captures: { o2: $.data.id }
            - call: "POST /work-orders/${w2}/advance"
              payload: { target: "MACHINING" }
              as: ShopTechnician
            - call: "POST /operations/${o2}/perform"
              payload: { station_code: "STN-CRANK-4", scheduled_start: "2026-08-02T09:00:00Z", scheduled_end: "2026-08-02T10:00:00Z", result: "PASS" }
              as: ShopTechnician
            - call: "POST /work-orders/${w2}/advance"
              payload: { target: "ASSEMBLY" }
              as: ShopTechnician
            - call: "GET /work-orders/${w2}"
              as: PlantAdmin
              captures: { er: $.data.reman_engine_id }
            - call: "POST /work-orders/${w2}/advance"
              payload: { target: "DYNO_TEST" }
              as: ShopTechnician
            - call: "POST /reman-engines/${er}/dyno-tests"
              payload: { dyno_cell_code: "CELL-4", started_at: "2026-08-03T10:00:00Z", ended_at: "2026-08-03T11:00:00Z", horsepower: 320, oil_pressure_psi: 25.0, coolant_temp_f: 195 }
              as: ShopTechnician
              as_user_id: "tech-1"
            - call: "POST /reman-engines/${er}/seal"
              as: QualityInspector
              as_user_id: "qi-1"
            # sell E-F to D-CL, file + teardown claim
            - call: "GET /distributors/${dcl}"
              as: PlantAdmin
              captures: { dclv: $.data.version }
            - call: "POST /reman-engines/sell"
              payload: { build_spec_id: "${s1}", expected_distributor_version: "${dclv}" }
              as: Distributor
              as_user_id: "${dcl}"
              captures: { ef_sold: $.data.id }
            - call: "POST /warranty-claims"
              payload: { reman_engine_id: "${ef_sold}", distributor_id: "${dcl}", failure_description: "oil consumption" }
              as: Distributor
              as_user_id: "${dcl}"
              captures: { c1: $.data.id }
            - call: "POST /warranty-claims/${c1}/teardown"
              payload: { teardown_findings: "valve seal failure" }
              as: ShopTechnician
              as_user_id: "tech-9"
          trigger:
            - call: "POST /warranty-claims/${c1}/adjudicate"
              payload: { outcome: "APPROVED_REPLACEMENT", teardown_fee_cents: 0 }
              as: WarrantyAdjuster
              as_user_id: "adj-1"
              captures: { c1_status: $.data.status }
            - call: "GET /reman-engines/${er}"
              as: PlantAdmin
              captures: { er_status: $.data.status, er_dist: $.data.distributor_id, er_price: $.data.sale_price_cents }
            - call: "GET /reman-engines/${ef_sold}"
              as: PlantAdmin
              captures: { ef_status: $.data.status }
            - call: "GET /core-deposits"
              payload: { reman_engine_id: "${er}" }
              as: PlantAdmin
              captures: { er_dep: $.data.0.id, er_dep_status: $.data.0.status, er_dep_amount: $.data.0.amount_cents }
            - call: "GET /distributors/${dcl}"
              as: PlantAdmin
              captures: { dcl_held: $.data.deposits_held_cents }
          assert:
            - "captured ef_sold == ${ef} (selector picked the only sealed engine at sale time)"
            - "captured c1_status == APPROVED_REPLACEMENT and settled_credit_cents == 0"
            - "link 1: captured er_status == SOLD, er_dist == ${dcl}, er_price == 0"
            - "link 2: captured er_dep_status == HELD and er_dep_amount == 200000 (deposit created by the replacement sale itself)"
            - "link 3: captured dcl_held == 400000 (original E-F deposit 200000 plus replacement deposit 200000)"
            - "captured ef_status == SCRAPPED (failed unit torn down and scrapped)"

      - name: grade_closes_linked_deposit_chain
        grounds:
          - state_machines.CoreReturn.RECEIVED_to_GRADED
          - state_machines.CoreDeposit.HELD_to_CLOSED_REFUNDED
          - calculations.deposit_refund_calculation
        distinguishing_aspect: |
          Depth-2 chain from the grade trigger (different trigger than the
          adjudication chain): grading (A: CoreReturn) closes the linked deposit
          (B: CoreDeposit HELD -> CLOSED_REFUNDED via deposit_refund_calculation);
          that close itself recomputes the distributor ledger (C). At age 40 days
          the 80% bracket applies.
        test_recipe:
          setup:
            - "Distributor D-G bought engine E at 2026-08-01; deposit DEP (200000) HELD; deposits_held_cents == 200000"
            - "CoreReturn R linked to DEP, received from D-G"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /distributors"
              payload: { distributor_code: "D-SRC2", name: "Core Source 2", emissions_requirement: "FEDERAL", credit_limit_cents: 1000000, volume_discount_pct: 0.0 }
              as: PlantAdmin
              captures: { dcore: $.data.id }
            - call: "POST /distributors"
              payload: { distributor_code: "D-G", name: "Grading Buyer", emissions_requirement: "FEDERAL", credit_limit_cents: 2000000, volume_discount_pct: 0.0 }
              as: PlantAdmin
