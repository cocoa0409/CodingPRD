  # ---------------------------------------------------------------- RateCard
  - method: POST
    path: "/rate-cards"
    description: "Propose an item-level rebate rate card. Requires the caller's observed ContractedItem.version. When supersede == true the incumbent APPROVED card is truncated instead of colliding."
    roles: [GpoAdmin]
