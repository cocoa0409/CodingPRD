          carried across the loop (rollover_count, rolled_reason,
          pending_rollover_fee_cents). Shipper-requested rollover prices at the
          fresh quote PLUS a 150000-cent fee — a carrier-caused roll of the same
          booking would charge min(old, fresh) and no fee.
