              captures: {ord_id: $.data.id}
            - {call: "POST /legal-research/removal-orders/${ord_id}/transition", payload: {target_status: APPLIED}, as: ComplianceOfficer}
          trigger:
            - {call: "POST /legal-research/removal-orders/${ord_id}/transition", payload: {target_status: REVERSED}, as: ComplianceOfficer}
          assert:
            - "PrimaryDocument.${doc_id}.visibility_status == PUBLIC (document restored)"
            - "Headnote.${hn_id}.status == RETRACTED (NOT restored) — retraction is terminal"

  - section: calculations
    instances:
      - name: citator_red_at_exactly_80
        claim_type: constants_applied
        grounds: [calculations.citator_signal_derivation]
        distinguishing_aspect: "RED threshold uses >=: a single OVERRULED/DISCUSSED reference scores exactly 80 and flips the signal to RED (80 >= SIGNAL_RED_MIN); a 79 score would stay YELLOW."
        test_recipe:
          setup: ["B published; A published citing B OVERRULED/DISCUSSED"]
          setup_api_calls:
            - {call: "POST /legal-research/_clock/set_current_utc", payload: {to_iso8601: "2026-09-05T00:00:00Z"}, as: PlatformAdmin}
            - call: "POST /legal-research/documents"
              payload: {source_type: COURT, jurisdiction_code: "US", document_type: CASE, title: "B v. Eighty", raw_citation_string: "60 U.S. 80", decision_date: "2026-01-01"}
              as: ContentIngester
              captures: {doc_b: $.data.id}
            - {call: "POST /legal-research/documents/${doc_b}/publish", payload: {references: []}, as: ContentIngester}
            - call: "POST /legal-research/documents"
              payload: {source_type: COURT, jurisdiction_code: "US", document_type: CASE, title: "A v. Eighty", raw_citation_string: "61 U.S. 81", decision_date: "2026-02-01"}
              as: ContentIngester
              captures: {doc_a: $.data.id}
            - call: "POST /legal-research/documents/${doc_a}/publish"
              payload: {references: [{cited_document_id: "${doc_b}", treatment: OVERRULED, depth: DISCUSSED}]}
              as: ContentIngester
          trigger:
            - {call: "GET /legal-research/documents/${doc_b}", as: CitatorAnalyst}
          assert:
            - "PrimaryDocument.${doc_b}.citator_score == 80 and citator_signal == RED (>= boundary is inclusive)"

      - name: citator_yellow_at_exactly_40
        claim_type: constants_applied
        grounds: [calculations.citator_signal_derivation]
        distinguishing_aspect: "YELLOW threshold uses >=: two DISTINGUISHED/EXAMINED references score exactly 40 and produce YELLOW, not GREEN (40 >= SIGNAL_YELLOW_MIN, < 80)."
        test_recipe:
          setup: ["B published; A1 and A2 each cite B with DISTINGUISHED/EXAMINED"]
          setup_api_calls:
            - {call: "POST /legal-research/_clock/set_current_utc", payload: {to_iso8601: "2026-09-05T00:00:00Z"}, as: PlatformAdmin}
            - call: "POST /legal-research/documents"
              payload: {source_type: COURT, jurisdiction_code: "US", document_type: CASE, title: "B v. Forty", raw_citation_string: "62 U.S. 40", decision_date: "2026-01-01"}
              as: ContentIngester
              captures: {doc_b: $.data.id}
            - {call: "POST /legal-research/documents/${doc_b}/publish", payload: {references: []}, as: ContentIngester}
            - call: "POST /legal-research/documents"
              payload: {source_type: COURT, jurisdiction_code: "US", document_type: CASE, title: "A1 v. Forty", raw_citation_string: "63 U.S. 41", decision_date: "2026-02-01"}
              as: ContentIngester
              captures: {doc_a1: $.data.id}
            - call: "POST /legal-research/documents/${doc_a1}/publish"
              payload: {references: [{cited_document_id: "${doc_b}", treatment: DISTINGUISHED, depth: EXAMINED}]}
              as: ContentIngester
            - call: "POST /legal-research/documents"
              payload: {source_type: COURT, jurisdiction_code: "US", document_type: CASE, title: "A2 v. Forty", raw_citation_string: "64 U.S. 42", decision_date: "2026-03-01"}
              as: ContentIngester
              captures: {doc_a2: $.data.id}
            - call: "POST /legal-research/documents/${doc_a2}/publish"
              payload: {references: [{cited_document_id: "${doc_b}", treatment: DISTINGUISHED, depth: EXAMINED}]}
              as: ContentIngester
          trigger:
            - {call: "GET /legal-research/documents/${doc_b}", as: CitatorAnalyst}
          assert:
            - "PrimaryDocument.${doc_b}.citator_score == 40 (20 + 20) and citator_signal == YELLOW"

      - name: citator_negative_weight_offsets_to_green
        claim_type: correct_result
        grounds: [calculations.citator_signal_derivation]
        distinguishing_aspect: "FOLLOWED references carry NEGATIVE weights: OVERRULED/CITED (50) plus FOLLOWED/EXAMINED (-30) nets 20, which is below the YELLOW floor, so the signal is GREEN despite an overruling reference existing."
        test_recipe:
          setup: ["B published; A1 cites B OVERRULED/CITED; A2 cites B FOLLOWED/EXAMINED"]
          setup_api_calls:
            - {call: "POST /legal-research/_clock/set_current_utc", payload: {to_iso8601: "2026-09-05T00:00:00Z"}, as: PlatformAdmin}
