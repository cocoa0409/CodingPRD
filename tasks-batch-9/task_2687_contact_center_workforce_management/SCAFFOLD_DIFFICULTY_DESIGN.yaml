              payload: { decision: "APPROVE", coach_note: "Outage confirmed by incident log" }
              as: TeamCoach
              as_user_id: "u-coach-1"
          assert:
            - "flagged_pct == 0.8481 and flagged_state == \"OUT_OF_ADHERENCE\""
            - "coach_status_before == \"COACHING_ACTIVE\" and flag_count_before == 1"
            - "AdherenceException.${exc_id}.status == \"APPROVED\""
            - "AdherenceException.${exc_id}.decided_by_user_id == \"u-coach-1\""
            - "ScheduleShift.${sh1_id}.adherence_status == \"EXCUSED\""
            - "ScheduleShift.${sh1_id}.excused_seconds == 4100"
            - "ScheduleShift.${sh1_id}.adherence_pct == 1.0000"
            - "Agent.${ag1_id}.adherence_pct == 1.0000"
            - "Agent.${ag1_id}.coaching_flag_count == 0"
            - "Agent.${ag1_id}.coaching_status == \"CLEARED\""

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: frozen_cycle_beats_ot_budget
        grounds:
          - validations.priority_70
          - validations.priority_200
          - errors.ERR_CYCLE_FROZEN
          - errors.ERR_OT_BUDGET_EXCEEDED
          - state_machines.PlanningCycle.REQUIREMENTS_LOCKED_to_FROZEN
        distinguishing_aspect: |
          The accept request violates the state gate at priority 70 (the cycle is FROZEN) and the
          fiscal gate at priority 200 (14400 cents of OT against a 1000-cent budget) at once. Only
          ERR_CYCLE_FROZEN (409) may come back; an implementation that runs the money check first
          returns ERR_OT_BUDGET_EXCEEDED (422) and fails. Both ledgers must be untouched either
          way, so the assert also pins ot_spend_committed_cents at 0.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "LA-CORE; cycle W37-FREEZE with ot_budget_cents 1000; FG-A with the 2026-09-07 grid."
            - "Agent E-001 (hourly_rate_cents 2400, skills [VOICE_EN]) with a PUBLISHED 08:00-16:00 shift on 2026-09-07."
            - "One OFFERED OT_OFFER of 4.0 hours (which would cost 14400 cents at the 1.50 tier)."
            - "The cycle is then driven to FROZEN."
