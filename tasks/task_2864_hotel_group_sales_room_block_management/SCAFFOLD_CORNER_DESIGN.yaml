      - call: POST /group-sales/displacement-analyses
        payload: {lead_id: '${lead_id}', analysis_variant: HISTORICAL_BASED}
        as: RevenueManager
        as_user_id: rm-001
        captures: {an2_id: $.data.id}
      - call: GET /group-sales/leads/${lead_id}
        payload: {}
        as: SalesManager
        as_user_id: sm-001
        captures: {v_after_restudy: $.data.version, stage_after_restudy: $.data.status}
      - call: POST /group-sales/rate-quotes
        payload: {lead_id: '${lead_id}', concession_package_id: '${pkg_id}', base_rate_cents: 23950, quoted_peak_rooms: 4,
