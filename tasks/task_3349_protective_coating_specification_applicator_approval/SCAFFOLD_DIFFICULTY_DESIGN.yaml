              as: TechnicalServiceEngineer
              captures: { sys_id: "$.data.id" }
            - call: "POST /coating/qualification-programs"
              payload: { program_code: "QP-LIFE-100", coating_system_id: "${sys_id}", min_quality_history_score: 300, min_consecutive_passed_inspections: 0, requires_training: false, requires_equipment_audit: false }
              as: TechnicalServiceEngineer
