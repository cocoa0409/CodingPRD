            - call: "POST /enrollments/${enr_a}/hour-entries"
              payload: { service_date: "2026-10-15", minutes: 60, activity_code: "DIRECT_SERVICE" }
              as: GranteeStaff
              as_user_id: "${org_id}"
          assert:
            - "2026-10-14: 422 ERR_SERVICE_DATE_OUT_OF_RANGE"
            - "2027-08-15 (the exclusive end): 422 ERR_SERVICE_DATE_OUT_OF_RANGE (error_id2)"
            - "2026-10-15 (the inclusive start): 201 created"

      - name: member_younger_than_17_rejected
        claim_type: Violation -> Error
        grounds: ["validations[priority=15]", "errors.ERR_MEMBER_TOO_YOUNG"]
        distinguishing_aspect: "date_of_birth 2010-01-01 against service_start_date 2026-10-15 makes the member 16 — 422 ERR_MEMBER_TOO_YOUNG; a member born 2009-10-15 turns 17 exactly on the start date and is accepted."
