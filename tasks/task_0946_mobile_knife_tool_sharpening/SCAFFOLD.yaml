    roles: [PlatformAdmin, Technician]
    code: 200
    input: ["item_class_spec_id?", "grade?", "status?", "limit?", "offset?"]
    output: LoanerUnit[]
    side_effects: []
  - method: POST
    path: "/sharpening/loaner-issues"
    description: "Issues a loaner for a request; the unit is chosen by calculations.loaner_unit_selector, which substitutes a higher grade when the exact grade is out of stock."
    roles: [Technician]
    code: 201
    input: [service_request_id, item_class_spec_id, requested_grade]
    output: LoanerIssue
    side_effects:
      - "LoanerUnit.status IN_STOCK -> ISSUED"
      - "sets issued_at, due_at and substituted"
  - method: GET
    path: "/sharpening/loaner-issues/{id}"
    description: "Reads a loaner issue including its late fee and delay attribution."
    roles: [PlatformAdmin, Technician, AccountOwner]
    code: 200
    input: []
    output: LoanerIssue
    side_effects: []
  - method: GET
    path: "/sharpening/loaner-issues"
    description: "Lists loaner issues, filterable by unit, request and status."
    roles: [PlatformAdmin, Technician, AccountOwner]
    code: 200
    input: ["loaner_unit_id?", "service_request_id?", "status?", "limit?", "offset?"]
    output: LoanerIssue[]
    side_effects: []
  - method: POST
    path: "/sharpening/loaner-issues/{id}/return"
    description: "Returns a loaner outside the delivery cascade; computes the late fee and runs the inspection chain."
    roles: [Technician]
    code: 200
    input: ["damage_reported?"]
    output: LoanerIssue
    side_effects:
      - "LoanerIssue.status OPEN -> RETURNED with returned_at, delay_attribution and late_fee_cents set per calculations.loaner_late_fee"
      - "LoanerUnit.status ISSUED -> INSPECTION, then cycle_count += 1 and INSPECTION -> RETIRED or IN_STOCK"
      - "appends a LATE_FEE InvoiceLine to the account's DRAFT Invoice when late_fee_cents > 0"

  # --- quality and warranty -------------------------------------------------
  - method: POST
    path: "/sharpening/warranty-claims"
    description: "Raises a workmanship claim against a delivered item, inside the warranty window."
    roles: [AccountOwner]
    code: 201
    input: [request_item_id, reason]
    output: WarrantyClaim
    side_effects:
      - "copies account_id from the claimed item's request and computes credit_basis_cents per calculations.warranty_credit"
  - method: GET
    path: "/sharpening/warranty-claims/{id}"
    description: "Reads a claim including its resubmit count and credit basis."
    roles: [AccountOwner, Technician, PlatformAdmin, BillingClerk]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []
  - method: GET
    path: "/sharpening/warranty-claims"
    description: "Lists claims, filterable by item, account, rework order, deciding technician and status."
    roles: [AccountOwner, Technician, PlatformAdmin, BillingClerk]
    code: 200
    input: ["request_item_id?", "account_id?", "rework_service_request_id?", "decided_by_technician_id?", "status?", "limit?", "offset?"]
    output: WarrantyClaim[]
    side_effects: []
  - method: POST
    path: "/sharpening/warranty-claims/{id}/approve"
    description: "Grants the claim; drives the six-link rework and credit cascade. The approving technician may not be the one who assessed the item."
    roles: [Technician]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects:
      - "WarrantyClaim.status SUBMITTED -> APPROVED"
      - "the claimed RequestItem moves DELIVERED -> REWORK_QUEUED and custody DELIVERED -> CUSTOMER"
      - "a channel=REWORK ServiceRequest and its pre-assessed rework RequestItem are created"
      - "a WARRANTY_CREDIT InvoiceLine is appended to the account's DRAFT Invoice, which is created when none exists"
      - "that Invoice is recomputed per calculations.invoice_totals"
      - "the original ServiceRequest.billing_status moves to CREDITED"
  - method: POST
    path: "/sharpening/warranty-claims/{id}/deny"
    description: "Denies the claim on an abuse finding; no rework and no credit are created."
    roles: [Technician]
    code: 200
    input: [abuse_finding]
    output: WarrantyClaim
    side_effects:
      - "WarrantyClaim.status SUBMITTED -> DENIED with decided_by_technician_id and abuse_finding recorded"
  - method: POST
    path: "/sharpening/warranty-claims/{id}/resubmit"
    description: "Resubmits a denied claim; refused once resubmit_count has reached WARRANTY_RESUBMIT_CAP."
    roles: [AccountOwner]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects:
      - "WarrantyClaim.status DENIED -> SUBMITTED with resubmit_count incremented"

  # --- billing --------------------------------------------------------------
  - method: POST
    path: "/sharpening/invoices"
    description: "Creates a DRAFT invoice; the scope and the allowance treatment fork on the account's billing_mode."
    roles: [BillingClerk]
    code: 201
    input: [account_id, "service_request_id?", "billing_period?"]
    output: Invoice
    side_effects:
      - "attaches the in-scope COMPLETED requests and moves each UNBILLED -> INVOICED"
      - "emits exactly one SERVICE line per covered item (amount 0 when the allowance absorbed it), one PART line per item with a positive part fee, and for MONTHLY_ROLLUP one SUBSCRIPTION_FEE line"
      - "consumes allowance per calculations.allowance_consumption_plan and appends AllowanceLedgerEntry kind=CONSUMED rows"
      - "computes the totals per calculations.invoice_totals"
  - method: GET
    path: "/sharpening/invoices/{id}"
    description: "Reads an invoice with all of its money fields."
    roles: [BillingClerk, AccountOwner, PlatformAdmin]
    code: 200
    input: []
    output: Invoice
    side_effects: []
  - method: GET
    path: "/sharpening/invoices"
    description: "Lists invoices, filterable by account, covered request, status and period."
    roles: [BillingClerk, AccountOwner, PlatformAdmin]
    code: 200
    input: ["account_id?", "service_request_id?", "status?", "billing_period?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []
  - method: GET
    path: "/sharpening/invoices/{id}/lines"
    description: "Lists the lines of one invoice in sequence_index order."
    roles: [BillingClerk, AccountOwner, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: InvoiceLine[]
    side_effects: []
  - method: GET
    path: "/sharpening/invoice-lines/{id}"
    description: "Reads a single invoice line."
    roles: [BillingClerk, AccountOwner, PlatformAdmin]
    code: 200
    input: []
    output: InvoiceLine
    side_effects: []
  - method: GET
    path: "/sharpening/invoice-lines"
    description: "Lists invoice lines, filterable by invoice, source item, source claim and line kind."
    roles: [BillingClerk, AccountOwner, PlatformAdmin]
    code: 200
    input: ["invoice_id?", "request_item_id?", "source_warranty_claim_id?", "source?", "limit?", "offset?"]
    output: InvoiceLine[]
    side_effects: []
  - method: POST
    path: "/sharpening/invoices/{id}/issue"
    description: "Issues a DRAFT invoice, freezing its totals and moving the money onto the account balance."
    roles: [BillingClerk]
    code: 200
    input: []
    output: Invoice
    side_effects:
      - "Invoice.status DRAFT -> ISSUED"
      - "increments Account.outstanding_balance_cents by amount_due_cents"
  - method: POST
    path: "/sharpening/invoices/{id}/void"
    description: "Voids an unpaid invoice, returning its requests to UNBILLED and restoring the allowance it consumed."
    roles: [BillingClerk]
    code: 200
    input: []
    output: Invoice
    side_effects:
      - "Invoice.status -> VOID"
      - "covered ServiceRequests INVOICED -> UNBILLED"
      - "appends AllowanceLedgerEntry kind=RESTORED rows and raises Subscription.allowance_remaining"
      - "decrements Account.outstanding_balance_cents when the invoice was ISSUED"
  - method: POST
    path: "/sharpening/invoices/{id}/payments"
    description: "Applies a payment; OCC-guarded on the invoice's version so partial payments cannot stack against a stale view."
    roles: [AccountOwner, BillingClerk]
    code: 201
    input: [amount_cents, method, expected_invoice_version]
    output: Payment
    side_effects:
      - "raises Invoice.amount_paid_cents and lowers amount_due_cents and Account.outstanding_balance_cents"
      - "Invoice.status -> PARTIALLY_PAID or PAID"
      - "covered ServiceRequests INVOICED -> SETTLED when the invoice reaches PAID"
      - "increments Invoice.version by 1"
  - method: GET
    path: "/sharpening/payments/{id}"
    description: "Reads a payment."
    roles: [BillingClerk, AccountOwner]
    code: 200
    input: []
    output: Payment
    side_effects: []
  - method: GET
    path: "/sharpening/payments"
    description: "Lists payments, filterable by invoice."
    roles: [BillingClerk, AccountOwner]
    code: 200
    input: ["invoice_id?", "limit?", "offset?"]
    output: Payment[]
    side_effects: []

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  # --- authentication and authorization ------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID missing, or X-User-Role is not one of the five declared roles."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The acting role is not listed in the endpoint's roles."
  - id: ERR_NOT_ACCOUNT_OWNER
    http: 403
    condition: "An entity_backed role acts on a resource it does not own."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The technician deciding a warranty claim is the same technician who assessed the claimed item."
  # --- existence ------------------------------------------------------------
  - id: ERR_ACCOUNT_NOT_FOUND
    http: 404
    condition: "No Account with the supplied id."
  - id: ERR_PLAN_TIER_NOT_FOUND
    http: 404
    condition: "No PlanTier with the supplied plan_tier_id."
  - id: ERR_SUBSCRIPTION_NOT_FOUND
    http: 404
    condition: "No Subscription with the supplied id."
  - id: ERR_ITEM_CLASS_SPEC_NOT_FOUND
    http: 404
    condition: "No ItemClassSpec with the supplied item_class_spec_id."
  - id: ERR_SERVICE_REQUEST_NOT_FOUND
    http: 404
    condition: "No ServiceRequest with the supplied id."
  - id: ERR_REQUEST_ITEM_NOT_FOUND
    http: 404
    condition: "No RequestItem with the supplied id."
  - id: ERR_TECHNICIAN_NOT_FOUND
    http: 404
    condition: "No Technician with the supplied technician_id."
  - id: ERR_VAN_NOT_FOUND
    http: 404
    condition: "No Van with the supplied van_id."
  - id: ERR_ROUTE_RUN_NOT_FOUND
    http: 404
    condition: "No RouteRun with the supplied id."
  - id: ERR_ROUTE_STOP_NOT_FOUND
    http: 404
    condition: "No RouteStop with the supplied id."
  - id: ERR_LOCKER_COMPARTMENT_NOT_FOUND
    http: 404
    condition: "No LockerCompartment with the supplied id."
  - id: ERR_BENCH_DAY_NOT_FOUND
    http: 404
    condition: "No BenchDay with the supplied id."
  - id: ERR_LOANER_UNIT_NOT_FOUND
    http: 404
    condition: "No LoanerUnit with the supplied id."
  - id: ERR_LOANER_ISSUE_NOT_FOUND
    http: 404
    condition: "No LoanerIssue with the supplied id."
  - id: ERR_WARRANTY_CLAIM_NOT_FOUND
    http: 404
    condition: "No WarrantyClaim with the supplied id."
  - id: ERR_INVOICE_NOT_FOUND
    http: 404
    condition: "No Invoice with the supplied id."
  - id: ERR_INVOICE_LINE_NOT_FOUND
    http: 404
    condition: "No InvoiceLine with the supplied id."
  - id: ERR_PAYMENT_NOT_FOUND
    http: 404
    condition: "No Payment with the supplied id."
  - id: ERR_ALLOWANCE_ENTRY_NOT_FOUND
    http: 404
    condition: "No AllowanceLedgerEntry with the supplied id."
  # --- request shape --------------------------------------------------------
  - id: ERR_VALIDATION
    http: 400
    condition: "A required body field is missing or has the wrong JSON type."
  - id: ERR_INVALID_ENUM
    http: 422
    condition: "An enum-typed field carries a value that is not a declared member of that enum. The closed list of fields that route here is exactly: account_type, zone_code, billing_mode, cadence, allowed_cadences members, item_class, declared_damage_tier, assessed_damage_tier, channel, priority, required_certification, price_tier, min_locker_size, size, grade, requested_grade, method, source, status, billing_status, custody_location, service_status and kind. No other field routes here; every other malformed or wrongly typed field routes to ERR_VALIDATION, and numeric fields that parse but fall outside their range route to ERR_VALUE_OUT_OF_RANGE."
  - id: ERR_VALUE_OUT_OF_RANGE
    http: 422
    condition: "A numeric field violates its declared range, a date/time field does not parse as ISO 8601, or POST /_clock/set_current_utc would move the logical clock backwards."
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit is outside [1, 100] or offset is negative."
  - id: ERR_ACCESS_CODE_INVALID
    http: 403
    condition: "The access_code supplied to a locker deposit or release does not equal LockerCompartment.access_code."
  # --- global write gates ---------------------------------------------------
  - id: ERR_ACCOUNT_SUSPENDED
    http: 409
    condition: "The account the operation resolves to has status SUSPENDED."
  - id: ERR_CREDIT_LIMIT_BLOCKED
    http: 402
    condition: "Account.outstanding_balance_cents exceeds Account.credit_limit_cents on a new-work endpoint."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "An expected_*_version input does not equal the parent entity's current version."
  # --- state ----------------------------------------------------------------
  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "The target entity is already in a terminal state of the axis the transition acts on."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The target entity's current state is not a declared from-state of the requested transition."
  - id: ERR_RUN_NOT_MUTABLE
    http: 409
    condition: "The parent RouteRun's status does not permit this stop operation."
  - id: ERR_REQUEST_NOT_MUTABLE
    http: 409
    condition: "The parent ServiceRequest's status does not permit this item operation."
  - id: ERR_SUBSCRIPTION_NOT_ACTIVE
    http: 409
    condition: "A ServiceRequest names a subscription_id whose Subscription has been CANCELLED."
  - id: ERR_INVOICE_NOT_PAYABLE
    http: 409
    condition: "The invoice is not ISSUED or PARTIALLY_PAID, or its amount_due_cents is below 1."
  - id: ERR_ITEM_NOT_IN_CUSTODY
    http: 409
    condition: "A RequestItem is not in the custody_location the operation requires."
  - id: ERR_BENCH_DAY_DATE_MISMATCH
    http: 409
    condition: "A bench intake names a BenchDay whose bench_date is not the logical clock date."
  - id: ERR_LOCKER_HOLD_EXPIRED
    http: 409
    condition: "A locker deposit or release is attempted at or after hold_expires_at."
  # --- safety ---------------------------------------------------------------
  - id: ERR_CERTIFICATION_MISSING
    http: 422
    condition: "The acting technician lacks the certification the item class requires."
  - id: ERR_AUTHORIZATION_REQUIRED
    http: 409
    condition: "Work is started on an item whose authorization_status is PENDING or DECLINED."
  - id: ERR_LOCKER_VALUE_AUTHORIZATION_REQUIRED
    http: 409
    condition: "Re-pricing a locker-held item would push the compartment's stored_value_cents above LOCKER_VALUE_AUTHORIZATION_CENTS without a customer pre-authorization."
  # --- referential ----------------------------------------------------------
  - id: ERR_ITEM_CLASS_MISMATCH
    http: 422
    condition: "The item_class supplied does not equal the item_class of the referenced ItemClassSpec."
  - id: ERR_STOP_ACCOUNT_MISMATCH
    http: 422
    condition: "The request's account zone_code does not equal the run's zone_code."
  - id: ERR_CLAIM_ITEM_ACCOUNT_MISMATCH
    http: 422
    condition: "The claimed item belongs to a different account than the acting AccountOwner."
  - id: ERR_LOANER_NOT_ELIGIBLE
    http: 422
    condition: "A loaner is created or issued for an ItemClassSpec whose loaner_eligible is false."
  - id: ERR_INVOICE_SCOPE_MISMATCH
    http: 422
    condition: "A PER_VISIT invoice omits service_request_id or carries billing_period, or a MONTHLY_ROLLUP invoice omits billing_period or carries service_request_id."
  # --- temporal -------------------------------------------------------------
  - id: ERR_DATE_IN_PAST
    http: 422
    condition: "A run_date or requested_date is earlier than the logical clock date."
  - id: ERR_WINDOW_OUT_OF_DAY
    http: 422
    condition: "An arrival window starts before the run's day_window_start or ends after its day_window_end."
  - id: ERR_WINDOW_OVERLAP
    http: 409
    condition: "The half-open arrival window intersects another non-terminal stop's window on the same run; touching endpoints do not intersect."
  - id: ERR_LOCKER_TURNAROUND_CONFLICT
    http: 409
    condition: "Every size-fitting AVAILABLE compartment at the site was released less than LOCKER_TURNAROUND_BUFFER_MINUTES ago."
  - id: ERR_SKIP_WINDOW_CLOSED
    http: 409
    condition: "A skip is requested less than SKIP_WINDOW_HOURS before the next service date."
  - id: ERR_CADENCE_CHANGE_TOO_LATE
    http: 409
    condition: "A cadence change is requested less than SKIP_WINDOW_HOURS before the next service date."
  - id: ERR_WARRANTY_WINDOW_EXPIRED
    http: 409
    condition: "A claim is raised or resubmitted more than WARRANTY_WINDOW_DAYS days after the item was delivered."
  # --- constraints ----------------------------------------------------------
  - id: ERR_ITEM_LIMIT_EXCEEDED
    http: 422
    condition: "Adding an item would push the request past MAX_ITEMS_PER_REQUEST."
  - id: ERR_RESUBMIT_CAP_REACHED
    http: 409
    condition: "A denied claim is resubmitted after resubmit_count has reached WARRANTY_RESUBMIT_CAP."
  - id: ERR_SPILL_LIMIT_REACHED
    http: 409
    condition: "A stop would be spilled past SPILL_MAX_HOPS hops."
  - id: ERR_COMPARTMENT_SIZE_UNFIT
    http: 422
    condition: "Every AVAILABLE compartment at the site fails the size-rank or the item-capacity test."
  - id: ERR_DUPLICATE_ACTIVE_SUBSCRIPTION
    http: 409
    condition: "The account already has a Subscription whose status is ACTIVE or PAUSED."
  - id: ERR_DUPLICATE_ITEM_CLASS_SPEC
    http: 409
    condition: "An ItemClassSpec already exists for that item_class."
  - id: ERR_DUPLICATE_BENCH_DAY
    http: 409
    condition: "A BenchDay already exists for that bench_date."
  - id: ERR_DUPLICATE_DRAFT_INVOICE
    http: 409
    condition: "The account already has an Invoice with status DRAFT."
  - id: ERR_DUPLICATE_INVOICE
    http: 409
    condition: "A ServiceRequest the invoice would cover is not UNBILLED."
  - id: ERR_NO_AVAILABLE_COMPARTMENT
    http: 409
    condition: "The compartment candidate pool is empty for a reason other than size or turnaround."
  - id: ERR_NO_ELIGIBLE_RUN
    http: 409
    condition: "No PLANNED run in the account's zone after the source run's date can absorb the spilled stop."
  - id: ERR_LOANER_STOCK_EXHAUSTED
    http: 409
    condition: "No IN_STOCK loaner unit of the requested class at or above the requested grade exists."
  # --- fiscal ---------------------------------------------------------------
  - id: ERR_STOP_CAP_EXCEEDED
    http: 409
    condition: "Adding a stop would push scheduled_stop_count past RouteRun.stop_cap."
  - id: ERR_RUN_MINUTES_EXCEEDED
    http: 409
    condition: "Adding a stop would push committed_minutes_provisional past RouteRun.service_minute_budget."
  - id: ERR_BENCH_CAPACITY_EXCEEDED
    http: 409
    condition: "A bench intake would push BenchDay.booked_minutes past its bench_minute_budget."
  - id: ERR_EMPTY_INVOICE
    http: 409
    condition: "An invoice would be created or issued with no InvoiceLine."
  - id: ERR_OVERPAYMENT
    http: 422
    condition: "Payment.amount_cents exceeds Invoice.amount_due_cents."

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: PlatformAdmin
    description: "Operator who owns configuration, physical infrastructure and the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /sharpening/plan-tiers"
      - "POST /sharpening/item-class-specs"
      - "POST /sharpening/technicians"
      - "POST /sharpening/vans"
      - "POST /sharpening/bench-days"
      - "POST /sharpening/locker-compartments"
      - "POST /sharpening/accounts"
      - "PATCH /sharpening/accounts/{id}"
      - "POST /sharpening/accounts/{id}/suspend"
      - "POST /sharpening/accounts/{id}/reinstate"
      - "POST /sharpening/subscriptions/{id}/advance-cycle"
      - "POST /sharpening/locker-compartments/{id}/expire-hold"
      - "POST /sharpening/locker-compartments/{id}/abandon"
      - "POST /sharpening/loaner-units"
    shared_operations:
      - "all GET endpoints except /sharpening/payments and /sharpening/invoice-lines"
  - name: Dispatcher
    description: "Plans van runs, places stops, dispatches and spills."
    identity: "opaque"
    exclusive_operations:
      - "POST /sharpening/route-runs"
      - "POST /sharpening/route-runs/{id}/stops"
      - "DELETE /sharpening/route-stops/{id}"
      - "POST /sharpening/route-stops/{id}/spill"
      - "POST /sharpening/route-stops/{id}/reschedule"
      - "POST /sharpening/route-runs/{id}/dispatch"
      - "POST /sharpening/route-runs/{id}/complete"
      - "POST /sharpening/route-runs/{id}/cancel"
    shared_operations:
      - "GET /sharpening/route-runs, GET /sharpening/route-stops, GET /sharpening/service-requests, GET /sharpening/accounts/{id}"
  - name: Technician
    description: "Drives a run, takes custody of items, assesses damage, works the bench and adjudicates warranty claims on items they did not assess."
    identity: "entity_backed:Technician"
    exclusive_operations:
      - "POST /sharpening/route-stops/{id}/arrive"
      - "POST /sharpening/service-requests/{id}/pickup"
      - "POST /sharpening/service-requests/{id}/bench-intake"
      - "POST /sharpening/service-requests/{id}/deliver"
      - "POST /sharpening/request-items/{id}/assess"
      - "POST /sharpening/request-items/{id}/start-work"
      - "POST /sharpening/request-items/{id}/complete-work"
      - "POST /sharpening/loaner-issues"
      - "POST /sharpening/loaner-issues/{id}/return"
      - "POST /sharpening/warranty-claims/{id}/approve"
      - "POST /sharpening/warranty-claims/{id}/deny"
    shared_operations:
      - "GET /sharpening/route-runs, GET /sharpening/route-stops, GET /sharpening/service-requests, GET /sharpening/request-items, GET /sharpening/loaner-units, GET /sharpening/loaner-issues, GET /sharpening/bench-days/{id}, GET /sharpening/locker-compartments, GET /sharpening/warranty-claims"
  - name: AccountOwner
    description: "The customer; opens requests, runs the subscription, uses the locker, raises warranty claims and pays."
    identity: "entity_backed:Account"
    exclusive_operations:
      - "POST /sharpening/subscriptions"
      - "POST /sharpening/subscriptions/{id}/pause"
      - "POST /sharpening/subscriptions/{id}/resume"
      - "POST /sharpening/subscriptions/{id}/cadence"
      - "POST /sharpening/subscriptions/{id}/skip"
      - "POST /sharpening/subscriptions/{id}/cancel"
      - "POST /sharpening/service-requests"
      - "POST /sharpening/service-requests/{id}/items"
      - "POST /sharpening/service-requests/{id}/submit"
      - "POST /sharpening/service-requests/{id}/cancel"
      - "POST /sharpening/service-requests/{id}/locker-assign"
      - "POST /sharpening/request-items/{id}/authorize"
      - "POST /sharpening/request-items/{id}/decline"
      - "POST /sharpening/locker-compartments/{id}/deposit"
      - "POST /sharpening/locker-compartments/{id}/release"
      - "POST /sharpening/warranty-claims"
      - "POST /sharpening/warranty-claims/{id}/resubmit"
    shared_operations:
      - "POST /sharpening/invoices/{id}/payments (shared with BillingClerk)"
      - "GET on their own accounts, subscriptions, service-requests, request-items, allowance-entries, locker-compartments, loaner-issues, warranty-claims, invoices, invoice-lines and payments"
  - name: BillingClerk
    description: "Owns the money surface: invoice creation, issuing, voiding and payment application."
    identity: "opaque"
    exclusive_operations:
      - "POST /sharpening/invoices"
      - "POST /sharpening/invoices/{id}/issue"
      - "POST /sharpening/invoices/{id}/void"
    shared_operations:
      - "POST /sharpening/invoices/{id}/payments (shared with AccountOwner)"
      - "GET /sharpening/invoices, GET /sharpening/invoices/{id}/lines, GET /sharpening/invoice-lines, GET /sharpening/payments, GET /sharpening/accounts/{id}/statement, GET /sharpening/allowance-entries, GET /sharpening/service-requests, GET /sharpening/request-items, GET /sharpening/subscriptions, GET /sharpening/warranty-claims"
