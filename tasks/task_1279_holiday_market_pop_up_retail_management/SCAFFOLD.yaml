# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or malformed X-User-Role / X-User-ID" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this endpoint per §1.7" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-templated resource does not exist (or scope mismatch)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match parent's current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target entity is in a state that forbids the requested transition" }
  - { id: ERR_POSTURE_FORBIDDEN, http: 409, condition: "Market posture forbids the operation (e.g. POS activate requires OPEN)" }
  - { id: ERR_PERMIT_REQUIRED, http: 409, condition: "Operation requires an ACTIVE Permit of the matching type" }
  - { id: ERR_APPLICATION_WINDOW_CLOSED, http: 409, condition: "Application submitted outside [application_opens_at, application_closes_at]" }
  - { id: ERR_SLOT_CONFLICT, http: 409, condition: "ProgrammingSlot or LoadSlot interval overlaps another on the same key, or starts_at >= ends_at" }
  - { id: ERR_CATEGORY_CAP_REACHED, http: 409, condition: "Acceptance would exceed market.category_caps[applicant.category]" }
  - { id: ERR_JURY_QUORUM_NOT_MET, http: 409, condition: "decide requires len(jury_scores) >= market.jury_quorum; also raised on duplicate juror score" }
  - { id: ERR_BOOTH_UNAVAILABLE, http: 409, condition: "Booth not AVAILABLE (or lacks has_power for ELECTRIC_*)" }
  - { id: ERR_BOOTH_NO_LONGER_AVAILABLE, http: 409, condition: "RenewalOffer offered Booth has been RESERVED/OCCUPIED since offer was extended" }
  - { id: ERR_DUPLICATE_SETTLEMENT, http: 409, condition: "A SUBMITTED settlement already exists for (assignment_id, business_date)" }
  - { id: ERR_INVALID_SETTLEMENT_AMOUNTS, http: 422, condition: "refund_cents exceeds gross, negative gross, or non-integer cents" }
  - { id: ERR_PAYMENT_NOT_SATISFIED, http: 409, condition: "BoothAssignment cannot activate because payment precondition is not met or application not ACCEPTED" }
  - { id: ERR_NO_SHARED_POS, http: 409, condition: "Operation requires market.shared_pos_enabled == true" }
  - { id: ERR_DEVICE_HAS_OPEN_SETTLEMENTS, http: 409, condition: "PosDevice cannot be RETURNED while assignment has DRAFT or SUBMITTED SalesSettlements" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: MarketOperator
    description: "Market staff responsible for overall market operations, booth assignment, permits, POS, programming, load slots, weather, run_ops"
    identity: opaque
    exclusive_operations:
      - "POST /markets"
      - "POST /markets/{id}/open_market"
      - "POST /markets/{id}/clear_weather_alert"
      - "POST /markets/{id}/cancel"
      - "POST /markets/{id}/run_ops"
      - "POST /markets/{id}/booths"
      - "POST /markets/{id}/assignments"
      - "POST /markets/{id}/assignments/{id}/activate"
      - "POST /markets/{id}/assignments/{id}/release"
      - "POST /markets/{id}/assignments/{id}/forfeit"
      - "POST /markets/{id}/permits"
      - "POST /markets/{id}/permits/{id}/revoke"
      - "POST /markets/{id}/pos_devices"
      - "POST /markets/{id}/pos_devices/{id}/activate"
      - "POST /markets/{id}/pos_devices/{id}/suspend"
      - "POST /markets/{id}/pos_devices/{id}/return_device"
      - "POST /markets/{id}/programming"
      - "POST /markets/{id}/programming/{id}/cancel"
      - "POST /markets/{id}/load_slots"
      - "POST /markets/{id}/weather_events"
      - "POST /markets/{id}/renewal_offers"
      - "POST /vendors"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET endpoints for markets, vendors, applications, booths, assignments, permits, hookups, pos_devices, settlements, programming, load_slots, weather_events, renewal_offers"

  - name: VendorRole
    description: "A vendor; X-User-ID equals Vendor.id"
    identity: "entity_backed:Vendor"
    exclusive_operations:
      - "POST /markets/{id}/applications"
      - "POST /markets/{id}/applications/{id}/submit"
      - "POST /markets/{id}/applications/{id}/withdraw"
      - "POST /markets/{id}/settlements"
      - "PUT /markets/{id}/settlements/{id}"
      - "POST /markets/{id}/settlements/{id}/submit"
