              payload: { project_id: "${proj_id}", kind: "MASTER_LEASE_LESSEE", party_legal_name: "Buckeye Credit Fund LP", party_tax_status: "PARTNERSHIP", capital_committed_cents: 12000000, credit_allocation_pct: 100.00, lease_term_years: 30 }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { int_id: $.data.id, admission_score: $.data.disqualification_risk_score }
            - call: "POST /investor-interests/${int_id}/elect-pass-through"
              payload: {}
              as: InvestorAdmin
              as_user_id: "${int_id}"
            - call: "POST /compliance-covenants"
              payload: { project_id: "${proj_id}", covenant_type: "USE_RESTRICTION", monitoring_frequency: "ANNUAL", window_start_date: "2029-01-15", window_end_date: "2029-01-31" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { cov_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2029-02-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /compliance-covenants/${cov_id}/attest"
              payload: { period_end_date: "2029-01-31", outcome: "EXCEPTION" }
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /credit-claims"
              payload: { project_id: "${proj_id}", tax_year: 2029 }
              as: InvestorAdmin
              as_user_id: "${int_id}"
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /credit-claims/${claim_id}/file"
              payload: {}
              as: InvestorAdmin
              as_user_id: "${int_id}"
          assert:
            - "response HTTP status == 200"
            - "the captured admission_score == 61"
            - "InvestorInterest.${int_id}.disqualification_risk_score == 69"
            - "InvestorInterest.${int_id}.risk_variant_applied == IN_SERVICE"
            - "Project.${proj_id}.max_investor_risk_score == 69"
            - "CreditClaim.${claim_id}.status == FILED"
            - "CreditClaim.${claim_id}.gross_credit_cents == 2400000"
            - "CreditClaim.${claim_id}.recapture_offset_cents == 0"
            - "CreditClaim.${claim_id}.net_claim_cents == 2400000"
            - "CreditClaim.${claim_id}.filed_by_user_id == ${int_id}"
            - "Project.${proj_id}.credit_claimed_to_date_cents == 2400000"
            - "Project.${proj_id}.credit_recaptured_cents == 0"
            - "Project.${proj_id}.credit_unclaimed_cents == 9600000"
            - "Project.${proj_id}.compliance_status == CURE_PENDING"

      - name: substantial_test_threshold_boundary_at_exact_equality
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.substantial_rehabilitation_test
        excluded_because:
          difficulty_instance: boundary_precision_check / substantial_test_met_at_exact_threshold_then_not_met_one_cent_above
          rationale: "The named §1.8 instance already probes threshold-1, threshold and threshold+1 on the substantial-rehabilitation test."

      - name: amendment_concurrence_cascade_verified_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Amendment.transitions.SHPO_CONCURRED_to_CONCURRED
        excluded_because:
          difficulty_instance: transitive_cascade / amendment_concurrence_resolves_finding_then_auto_approves_part2_then_certifies_project
          rationale: "The named §1.8 instance verifies the full three-level finding-to-application-to-project chain end to end."

      - name: disallowance_cascade_ordering_sensitivity_verified
        claim_type: cascading_side_effects
        grounds:
          - calculations.recapture_assessment
        excluded_because:
          difficulty_instance: transitive_cascade / locked_cost_disallowance_flips_substantial_test_then_assesses_recapture_then_adjusts_filed_claim
          rationale: "The named §1.8 instance pins the ordering of the disallowance cascade and its effect on an already-filed claim."

      - name: qre_variant_delta_applied_on_switch_to_final
        claim_type: dual_variant_calculation
        grounds:
          - calculations.qre_totals
        excluded_because:
          difficulty_instance: dual_variant_calc / qre_provisional_vs_final_divergence_flips_substantial_test
          rationale: "The named §1.8 instance computes both QRE variants on identical data and asserts the delta and its effect on the test."

      - name: investor_risk_variant_delta_after_placed_in_service
        claim_type: dual_variant_calculation
        grounds:
          - calculations.investor_disqualification_risk
        excluded_because:
          difficulty_instance: dual_variant_calc / investor_risk_admission_vs_in_service_variant_divergence
          rationale: "The named §1.8 instance asserts both risk variants for the same party and the delta between them."

  - section: consistency_model
    instances:
      - name: part_one_approval_cascade_is_visible_in_the_same_response_cycle
        claim_type: immediate
        grounds:
          - state_machines.Project.certification_status.transitions.PRE_CERTIFICATION_to_PART1_CERTIFIED
          - state_machines.Property.evaluation_status
        distinguishing_aspect: "The nps-determination response itself already reports the application APPROVED, and reads issued immediately afterwards with no clock advance show Project.certification_status PART1_CERTIFIED and Property.evaluation_status CERTIFIED_HISTORIC — no denormalized field lags behind the write."
        test_recipe:
          setup:
            - "Part 1 application in NPS_REVIEW on a PRE_CERTIFICATION project whose property is UNDER_EVALUATION."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /developers"
              payload: { legal_name: "Elm Mill Partners LLC", taxpayer_id_last4: "4821", entity_type: "LLC" }
              as: PlatformAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /reviewers"
              payload: { full_name: "S. Hale", agency: "SHPO", state_code: "OH" }
              as: PlatformAdmin
              captures: { shpo_id: $.data.id }
            - call: "POST /reviewers"
              payload: { full_name: "N. Park", agency: "NPS", state_code: "DC" }
              as: PlatformAdmin
              captures: { nps_id: $.data.id }
            - call: "POST /properties"
              payload: { name: "Elm Mill", street_address: "120 Elm Street", city: "Dayton", state_code: "OH", year_built: 1912, listing_status: "INDIVIDUAL_LISTED" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /projects"
              payload: { developer_id: "${dev_id}", property_id: "${prop_id}", project_name: "Elm Mill Rehab", structure_type: "MASTER_LEASE", adjusted_basis_cents: 60000000, measuring_period_months: 24, measuring_period_start_date: "2026-09-01" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { proj_id: $.data.id, proj_v1: $.data.version }
            - call: "POST /part-applications"
              payload: { project_id: "${proj_id}", part_number: 1, narrative: "Evaluation of significance for the 1912 Elm Mill.", expected_project_version: "${proj_v1}" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { app1_id: $.data.id }
            - call: "POST /part-applications/${app1_id}/submit"
              payload: { shpo_reviewer_id: "${shpo_id}" }
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /part-applications/${app1_id}/shpo-recommend"
              payload: { recommendation: "RECOMMEND_APPROVAL" }
              as: ShpoReviewer
              as_user_id: "${shpo_id}"
          trigger:
            - call: "POST /part-applications/${app1_id}/nps-determination"
              payload: { determination: "APPROVED" }
              as: NpsReviewer
              as_user_id: "${nps_id}"
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: Developer
              as_user_id: "${dev_id}"
              captures: { proj_v_after: $.data.version, cert_after: $.data.certification_status }
            - call: "GET /properties/${prop_id}"
              payload: {}
              as: Developer
              as_user_id: "${dev_id}"
              captures: { eval_after: $.data.evaluation_status }
          assert:
            - "the first trigger response HTTP status == 200"
            - "the first trigger response data.status == APPROVED"
            - "the first trigger response data.nps_reviewer_id == ${nps_id}"
            - "the captured cert_after == PART1_CERTIFIED"
            - "the captured eval_after == CERTIFIED_HISTORIC"
            - "the captured proj_v_after == ${proj_v1} + 2"
            - "no clock advance occurs between the write and the two reads"
