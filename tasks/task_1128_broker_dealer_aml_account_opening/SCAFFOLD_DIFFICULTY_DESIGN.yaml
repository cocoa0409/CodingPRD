  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: low_priced_price_boundary_5_dollars
        grounds:
          - entities.SecurityTransaction.fields.is_low_priced
          - calculations.low_priced_liquidation_proceeds
        distinguishing_aspect: |
          Metric = unit price in dollars on POST /aml/accounts/{id}/transactions
          (distinct metric and endpoint from the ownership-percentage and wire-velocity
          instances): unit_price exactly 5.00 is NOT low-priced (strict <), 4.99 IS.
        test_recipe:
          setup: ["Clock 2026-05-01. OPEN LOW account."]
          setup_api_calls:
            - { call: "POST /aml/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /aml/reps", payload: { full_name: "Rep M", crd_number: "CRD-BP1" }, as: SystemAdmin, captures: { rep_id: "$.data.id" } }
            - { call: "POST /aml/customers", payload: { customer_type: "INDIVIDUAL", full_name: "M Low", tax_id: "TIN-BP1", country_risk_tier: "LOW" }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { cust_id: "$.data.id" } }
            - { call: "POST /aml/customers/${cust_id}/identification-documents", payload: { doc_type: "GOVERNMENT_ID", document_number: "P-BP1", expiry_date: "2030-01-01" }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { doc_id: "$.data.id" } }
            - { call: "POST /aml/identification-documents/${doc_id}/verify", payload: {}, as: AMLAnalyst }
            - { call: "POST /aml/accounts", payload: { customer_id: "${cust_id}", product_set: ["CASH"] }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { acct_id: "$.data.id" } }
            - { call: "POST /aml/accounts/${acct_id}/approve", payload: {}, as: ComplianceOfficer }
          trigger:
            - { call: "POST /aml/accounts/${acct_id}/transactions", payload: { txn_type: "BUY", security_id: "EDGE5", quantity: 10, unit_price: 5.00 }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { lp5: "$.data.is_low_priced" } }
            - { call: "POST /aml/accounts/${acct_id}/transactions", payload: { txn_type: "BUY", security_id: "EDGE499", quantity: 10, unit_price: 4.99 }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { lp499: "$.data.is_low_priced" } }
          assert:
            - "captured lp5 == false (exactly 5.00 is NOT low-priced)"
            - "captured lp499 == true (4.99 < 5.00)"

      - name: beneficial_ownership_25pct_inclusive_boundary
        grounds:
          - calculations.beneficial_ownership_coverage
          - entities.BeneficialOwner.fields.ownership_pct
        distinguishing_aspect: |
          Metric = ownership percentage on POST .../certify (distinct from the price
          and velocity boundaries): ownership_pct exactly 25.00 IS a covered owner
          (inclusive >=) and MUST have full KYC; 24.99 is NOT covered and certifies
          without KYC when the no-25% attestation is present.
        test_recipe:
          setup:
            - "Clock 2026-05-01. Two LEGAL_ENTITY customers."
            - "Cert A: single owner at 25.00 WITHOUT tax_id/date_of_birth/address, attested=false, plus a control person at 10.00."
            - "Cert B: single owner at 24.99 without KYC, attested=true, plus a control person at 10.00."
          setup_api_calls:
            - { call: "POST /aml/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /aml/reps", payload: { full_name: "Rep N", crd_number: "CRD-BP2" }, as: SystemAdmin, captures: { rep_id: "$.data.id" } }
            - { call: "POST /aml/customers", payload: { customer_type: "LEGAL_ENTITY", full_name: "N Corp A", tax_id: "EIN-BP2a", country_risk_tier: "LOW" }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { ca: "$.data.id" } }
            - { call: "POST /aml/customers", payload: { customer_type: "LEGAL_ENTITY", full_name: "N Corp B", tax_id: "EIN-BP2b", country_risk_tier: "LOW" }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { cb: "$.data.id" } }
            - { call: "POST /aml/customers/${ca}/beneficial-ownership-certifications", payload: { no_25pct_owner_attested: false }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { cert_a: "$.data.id" } }
            - { call: "POST /aml/beneficial-ownership-certifications/${cert_a}/owners", payload: { full_name: "Owner 25", ownership_pct: 25.00, is_control_person: false }, as: RegisteredRep, as_user_id: "${rep_id}" }
            - { call: "POST /aml/beneficial-ownership-certifications/${cert_a}/owners", payload: { full_name: "Ctrl A", ownership_pct: 10.00, is_control_person: true, tax_id: "TIN-CTRL-A", date_of_birth: "1970-01-01", address: "1 Main St" }, as: RegisteredRep, as_user_id: "${rep_id}" }
            - { call: "POST /aml/customers/${cb}/beneficial-ownership-certifications", payload: { no_25pct_owner_attested: true }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { cert_b: "$.data.id" } }
            - { call: "POST /aml/beneficial-ownership-certifications/${cert_b}/owners", payload: { full_name: "Owner 2499", ownership_pct: 24.99, is_control_person: false }, as: RegisteredRep, as_user_id: "${rep_id}" }
            - { call: "POST /aml/beneficial-ownership-certifications/${cert_b}/owners", payload: { full_name: "Ctrl B", ownership_pct: 10.00, is_control_person: true, tax_id: "TIN-CTRL-B", date_of_birth: "1970-01-01", address: "2 Main St" }, as: RegisteredRep, as_user_id: "${rep_id}" }
          trigger:
            - { call: "POST /aml/beneficial-ownership-certifications/${cert_a}/certify", payload: {}, as: ComplianceOfficer, captures: { err_a: "$.data.error_id" } }
            - { call: "POST /aml/beneficial-ownership-certifications/${cert_b}/certify", payload: {}, as: ComplianceOfficer, captures: { st_b: "$.data.status" } }
          assert:
            - "captured err_a == ERR_OWNER_KYC_REQUIRED (25.00 is covered, KYC missing)"
            - "HTTP status for cert A == 422"
            - "captured st_b == CERTIFIED (24.99 not covered; attestation suffices)"

      - name: wire_velocity_equality_at_limit
        grounds:
          - calculations.wire_velocity_30d
          - errors[ERR_VELOCITY_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Metric = trailing-30d wire aggregate on POST /aml/accounts/{id}/transactions
          (distinct endpoint-level assertion from the price and percentage instances):
          projected aggregate EXACTLY equal to the LOW limit 250000.00 passes;
          one cent over (250000.01) rejects with ERR_VELOCITY_LIMIT_EXCEEDED.
        test_recipe:
          setup: ["Clock 2026-05-01. OPEN LOW account (limit 250000.00)."]
          setup_api_calls:
            - { call: "POST /aml/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /aml/reps", payload: { full_name: "Rep O", crd_number: "CRD-BP3" }, as: SystemAdmin, captures: { rep_id: "$.data.id" } }
            - { call: "POST /aml/customers", payload: { customer_type: "INDIVIDUAL", full_name: "O Low", tax_id: "TIN-BP3", country_risk_tier: "LOW" }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { cust_id: "$.data.id" } }
            - { call: "POST /aml/customers/${cust_id}/identification-documents", payload: { doc_type: "GOVERNMENT_ID", document_number: "P-BP3", expiry_date: "2030-01-01" }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { doc_id: "$.data.id" } }
            - { call: "POST /aml/identification-documents/${doc_id}/verify", payload: {}, as: AMLAnalyst }
            - { call: "POST /aml/accounts", payload: { customer_id: "${cust_id}", product_set: ["CASH"] }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { acct_id: "$.data.id" } }
            - { call: "POST /aml/accounts/${acct_id}/approve", payload: {}, as: ComplianceOfficer }
          trigger:
            - { call: "POST /aml/accounts/${acct_id}/transactions", payload: { txn_type: "WIRE_OUT", amount: 200000.00 }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { w1: "$.data.status" } }
            - { call: "POST /aml/accounts/${acct_id}/transactions", payload: { txn_type: "WIRE_OUT", amount: 50000.00 }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { w2: "$.data.status" } }
            - { call: "GET /aml/accounts/${acct_id}", payload: {}, as: RegisteredRep, as_user_id: "${rep_id}", captures: { vel: "$.data.wire_velocity_30d_amount" } }
            - { call: "POST /aml/accounts/${acct_id}/transactions", payload: { txn_type: "WIRE_OUT", amount: 0.01 }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "captured w1 == POSTED and w2 == POSTED (equality at the limit passes)"
            - "captured vel == 250000.00"
            - "captured err == ERR_VELOCITY_LIMIT_EXCEEDED (250000.01 > 250000.00)"
            - "HTTP status for the 0.01 wire == 422"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: transaction_posting_requires_account_open
        grounds:
          - state_machines.BrokerageAccount
          - validations[priority=6]
          - errors[ERR_ACCOUNT_NOT_OPEN]
        distinguishing_aspect: |
          Entity pair = SecurityTransaction -> BrokerageAccount (distinct from the
          Account->EDDReview and SARFiling->AMLCase pairs): posting against a
          PENDING_APPROVAL account fails ERR_ACCOUNT_NOT_OPEN; after the account's
          approve transition the identical payload succeeds.
        test_recipe:
          setup: ["Clock 2026-05-01. Customer with VERIFIED doc; account created but NOT yet approved."]
          setup_api_calls:
            - { call: "POST /aml/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /aml/reps", payload: { full_name: "Rep P", crd_number: "CRD-CE1" }, as: SystemAdmin, captures: { rep_id: "$.data.id" } }
            - { call: "POST /aml/customers", payload: { customer_type: "INDIVIDUAL", full_name: "P Low", tax_id: "TIN-CE1", country_risk_tier: "LOW" }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { cust_id: "$.data.id" } }
            - { call: "POST /aml/customers/${cust_id}/identification-documents", payload: { doc_type: "GOVERNMENT_ID", document_number: "P-CE1", expiry_date: "2030-01-01" }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { doc_id: "$.data.id" } }
            - { call: "POST /aml/identification-documents/${doc_id}/verify", payload: {}, as: AMLAnalyst }
            - { call: "POST /aml/accounts", payload: { customer_id: "${cust_id}", product_set: ["CASH"] }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { acct_id: "$.data.id" } }
          trigger:
            - { call: "POST /aml/accounts/${acct_id}/transactions", payload: { txn_type: "WIRE_OUT", amount: 100.00 }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { err: "$.data.error_id" } }
            - { call: "POST /aml/accounts/${acct_id}/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /aml/accounts/${acct_id}/transactions", payload: { txn_type: "WIRE_OUT", amount: 100.00 }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { st: "$.data.status" } }
          assert:
            - "captured err == ERR_ACCOUNT_NOT_OPEN (HTTP 409)"
            - "captured st == POSTED after approval"

      - name: high_tier_approval_requires_approved_edd
        grounds:
          - state_machines.BrokerageAccount.PENDING_APPROVAL_to_OPEN
          - state_machines.EDDReview.IN_REVIEW_to_APPROVED
          - errors[ERR_EDD_APPROVAL_REQUIRED]
        distinguishing_aspect: |
          Entity pair = BrokerageAccount -> EDDReview (distinct from
          Transaction->Account and SARFiling->AMLCase): a HIGH-tier (score 70) account
          cannot be approved while its EDD review is PENDING or IN_REVIEW; only the
          EDDReview's APPROVED transition unblocks the account approval.
        test_recipe:
          setup:
            - "Clock 2026-05-01. Customer HIGH country + PEP; products [LOW_PRICED_SECURITIES, MARGIN, OPTIONS] -> score 25+20+25 = 70 -> HIGH tier; EDD review PENDING for period [2026-04-01, 2026-05-01)."
          setup_api_calls:
            - { call: "POST /aml/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /aml/reps", payload: { full_name: "Rep Q", crd_number: "CRD-CE2" }, as: SystemAdmin, captures: { rep_id: "$.data.id" } }
            - { call: "POST /aml/customers", payload: { customer_type: "INDIVIDUAL", full_name: "Q Pep", tax_id: "TIN-CE2", country_risk_tier: "HIGH", is_pep: true }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { cust_id: "$.data.id" } }
            - { call: "POST /aml/customers/${cust_id}/identification-documents", payload: { doc_type: "GOVERNMENT_ID", document_number: "P-CE2", expiry_date: "2030-01-01" }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { doc_id: "$.data.id" } }
            - { call: "POST /aml/identification-documents/${doc_id}/verify", payload: {}, as: AMLAnalyst }
            - { call: "POST /aml/accounts", payload: { customer_id: "${cust_id}", product_set: ["LOW_PRICED_SECURITIES", "MARGIN", "OPTIONS"] }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { acct_id: "$.data.id", s0: "$.data.risk_score", t0: "$.data.risk_tier" } }
            - { call: "POST /aml/accounts/${acct_id}/edd-reviews", payload: { period_start: "2026-04-01", period_end: "2026-05-01", trigger_reason: "HIGH tier onboarding" }, as: AMLAnalyst, captures: { edd_id: "$.data.id" } }
          trigger:
            - { call: "POST /aml/accounts/${acct_id}/approve", payload: {}, as: ComplianceOfficer, captures: { err1: "$.data.error_id" } }
            - { call: "POST /aml/edd-reviews/${edd_id}/begin", payload: {}, as: AMLAnalyst }
            - { call: "POST /aml/accounts/${acct_id}/approve", payload: {}, as: ComplianceOfficer, captures: { err2: "$.data.error_id" } }
            - { call: "POST /aml/edd-reviews/${edd_id}/complete", payload: { decision: "APPROVED", notes: "verified source of funds" }, as: ComplianceOfficer, captures: { edd_st: "$.data.status", due: "$.data.refresh_due_date" } }
            - { call: "POST /aml/accounts/${acct_id}/approve", payload: {}, as: ComplianceOfficer, captures: { final_st: "$.data.lifecycle_status" } }
          assert:
            - "captured s0 == 70 and t0 == HIGH (inclusive 70 boundary)"
            - "captured err1 == ERR_EDD_APPROVAL_REQUIRED (PENDING review insufficient)"
            - "captured err2 == ERR_EDD_APPROVAL_REQUIRED (IN_REVIEW still insufficient)"
            - "captured edd_st == APPROVED and due == 2027-05-01 (HIGH -> 12 months)"
            - "captured final_st == OPEN"

      - name: sar_draft_requires_case_sar_recommended
        grounds:
          - state_machines.AMLCase.INVESTIGATING_to_SAR_RECOMMENDED
          - state_machines.SARFiling.DRAFT_to_FILED
          - errors[ERR_CASE_NOT_SAR_RECOMMENDED]
        distinguishing_aspect: |
          Entity pair = SARFiling -> AMLCase (distinct from Transaction->Account and
          Account->EDDReview): drafting an initial SAR while the case is merely
          INVESTIGATING fails; only after recommend-sar transitions the case to
          SAR_RECOMMENDED does the identical draft request succeed.
        test_recipe:
          setup: ["OPEN LOW account; manual case created and INVESTIGATING (no SAR recommendation yet)."]
          setup_api_calls:
            - { call: "POST /aml/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /aml/reps", payload: { full_name: "Rep R", crd_number: "CRD-CE3" }, as: SystemAdmin, captures: { rep_id: "$.data.id" } }
            - { call: "POST /aml/customers", payload: { customer_type: "INDIVIDUAL", full_name: "R Low", tax_id: "TIN-CE3", country_risk_tier: "LOW" }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { cust_id: "$.data.id" } }
            - { call: "POST /aml/customers/${cust_id}/identification-documents", payload: { doc_type: "GOVERNMENT_ID", document_number: "P-CE3", expiry_date: "2030-01-01" }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { doc_id: "$.data.id" } }
            - { call: "POST /aml/identification-documents/${doc_id}/verify", payload: {}, as: AMLAnalyst }
            - { call: "POST /aml/accounts", payload: { customer_id: "${cust_id}", product_set: ["CASH"] }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { acct_id: "$.data.id" } }
            - { call: "POST /aml/accounts/${acct_id}/approve", payload: {}, as: ComplianceOfficer }
            - { call: "GET /aml/accounts/${acct_id}", payload: {}, as: AMLAnalyst, captures: { av: "$.data.version" } }
            - { call: "POST /aml/aml-cases", payload: { account_id: "${acct_id}", expected_account_version: "${av}" }, as: AMLAnalyst, captures: { case_id: "$.data.id" } }
            - { call: "POST /aml/aml-cases/${case_id}/begin-investigation", payload: {}, as: AMLAnalyst }
          trigger:
            - { call: "POST /aml/sar-filings", payload: { case_id: "${case_id}", narrative: "early draft", activity_start: "2026-05-01", activity_end: "2026-05-01" }, as: SAROfficer, captures: { err: "$.data.error_id" } }
            - { call: "POST /aml/aml-cases/${case_id}/recommend-sar", payload: { recommendation_note: "file", initial_detection_date: "2026-05-01" }, as: AMLAnalyst, as_user_id: "analyst-ce3" }
            - { call: "POST /aml/sar-filings", payload: { case_id: "${case_id}", narrative: "early draft", activity_start: "2026-05-01", activity_end: "2026-05-01" }, as: SAROfficer, captures: { sar_id: "$.data.id", sar_st: "$.data.status" } }
          assert:
            - "captured err == ERR_CASE_NOT_SAR_RECOMMENDED (HTTP 409)"
            - "captured sar_st == DRAFT after recommendation"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: edd_review_half_open_overlap
        grounds:
          - validations[priority=12]
          - errors[ERR_OVERLAPPING_EDD_REVIEW]
          - entities.EDDReview.fields.period_start
        distinguishing_aspect: |
          Resource = EDDReview per account; interval semantics = HALF-OPEN
          [period_start, period_end): an interior overlap [2026-02-15, 2026-04-01) is
          rejected, while exact adjacency (new start == existing end, 2026-03-01) is
          ACCEPTED — the opposite adjacency treatment from the audit-engagement rule.
        test_recipe:
          setup: ["Clock 2026-05-01. Account (PENDING_APPROVAL fine) with an APPROVED... any-status review A [2026-01-01, 2026-03-01)."]
          setup_api_calls:
            - { call: "POST /aml/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /aml/reps", payload: { full_name: "Rep S", crd_number: "CRD-OV1" }, as: SystemAdmin, captures: { rep_id: "$.data.id" } }
            - { call: "POST /aml/customers", payload: { customer_type: "INDIVIDUAL", full_name: "S Med", tax_id: "TIN-OV1", country_risk_tier: "MEDIUM" }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { cust_id: "$.data.id" } }
            - { call: "POST /aml/accounts", payload: { customer_id: "${cust_id}", product_set: ["CASH"] }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { acct_id: "$.data.id" } }
            - { call: "POST /aml/accounts/${acct_id}/edd-reviews", payload: { period_start: "2026-01-01", period_end: "2026-03-01", trigger_reason: "baseline" }, as: AMLAnalyst, captures: { edd_a: "$.data.id", st_a: "$.data.status" } }
          trigger:
            - { call: "POST /aml/accounts/${acct_id}/edd-reviews", payload: { period_start: "2026-02-15", period_end: "2026-04-01", trigger_reason: "overlap" }, as: AMLAnalyst, captures: { err: "$.data.error_id" } }
            - { call: "POST /aml/accounts/${acct_id}/edd-reviews", payload: { period_start: "2026-03-01", period_end: "2026-05-01", trigger_reason: "adjacent" }, as: AMLAnalyst, captures: { edd_c: "$.data.id", st_c: "$.data.status" } }
          assert:
            - "captured err == ERR_OVERLAPPING_EDD_REVIEW (HTTP 409) for interior overlap"
            - "captured st_c == PENDING (adjacent start == existing end accepted under half-open semantics)"

      - name: audit_engagement_closed_interval_overlap
        grounds:
          - validations[priority=12]
          - errors[ERR_OVERLAPPING_AUDIT_ENGAGEMENT]
          - entities.AuditEngagement.fields.start_date
        distinguishing_aspect: |
          Resource = AuditEngagement per scope_unit; interval semantics = CLOSED
          [start_date, end_date]: exact adjacency (new start 2026-03-01 == existing end
          2026-03-01) IS a conflict — the opposite adjacency treatment from the EDD
          half-open rule; next-day start (2026-03-02) passes, and a different
          scope_unit over the same dates also passes.
        test_recipe:
          setup: ["Engagement A scope AML_PROGRAM [2026-01-01, 2026-03-01] PLANNED."]
          setup_api_calls:
            - { call: "POST /aml/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /aml/audit-engagements", payload: { scope_unit: "AML_PROGRAM", start_date: "2026-01-01", end_date: "2026-03-01" }, as: IndependentAuditor, captures: { eng_a: "$.data.id" } }
          trigger:
            - { call: "POST /aml/audit-engagements", payload: { scope_unit: "AML_PROGRAM", start_date: "2026-03-01", end_date: "2026-04-01" }, as: IndependentAuditor, captures: { err: "$.data.error_id" } }
            - { call: "POST /aml/audit-engagements", payload: { scope_unit: "AML_PROGRAM", start_date: "2026-03-02", end_date: "2026-04-01" }, as: IndependentAuditor, captures: { eng_c: "$.data.id" } }
            - { call: "POST /aml/audit-engagements", payload: { scope_unit: "SANCTIONS_SCREENING", start_date: "2026-01-15", end_date: "2026-02-15" }, as: IndependentAuditor, captures: { eng_d: "$.data.id" } }
          assert:
            - "captured err == ERR_OVERLAPPING_AUDIT_ENGAGEMENT (adjacent closed intervals DO conflict)"
            - "engagement ${eng_c} created (gap of one day suffices)"
            - "engagement ${eng_d} created (different scope_unit, same dates — no conflict)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: post_then_reverse_conserves_exposure
        grounds:
          - state_machines.SecurityTransaction.POSTED_to_REVERSED
          - calculations.exposure_tier_30d
          - entities.BrokerageAccount.fields.exposure_30d_amount
        distinguishing_aspect: |
          Conserved quantity = monetary 30d exposure (distinct from the open-workload
          count invariant): exposure_30d_amount AFTER post+reverse equals the value
          BEFORE the pair (10000.00), and exposure_tier returns to T1 — the invariant
          is pinned as sum(amount | status != REVERSED, trailing 30d).
        test_recipe:
          setup: ["Clock 2026-05-01. OPEN LOW account; DEPOSIT_DTC 250 @ 40.00 = 10000.00 already posted."]
          setup_api_calls:
            - { call: "POST /aml/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /aml/reps", payload: { full_name: "Rep T", crd_number: "CRD-CI1" }, as: SystemAdmin, captures: { rep_id: "$.data.id" } }
            - { call: "POST /aml/customers", payload: { customer_type: "INDIVIDUAL", full_name: "T Low", tax_id: "TIN-CI1", country_risk_tier: "LOW" }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { cust_id: "$.data.id" } }
            - { call: "POST /aml/customers/${cust_id}/identification-documents", payload: { doc_type: "GOVERNMENT_ID", document_number: "P-CI1", expiry_date: "2030-01-01" }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { doc_id: "$.data.id" } }
            - { call: "POST /aml/identification-documents/${doc_id}/verify", payload: {}, as: AMLAnalyst }
            - { call: "POST /aml/accounts", payload: { customer_id: "${cust_id}", product_set: ["CASH"] }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { acct_id: "$.data.id" } }
            - { call: "POST /aml/accounts/${acct_id}/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /aml/accounts/${acct_id}/transactions", payload: { txn_type: "DEPOSIT_DTC", security_id: "BLUE", quantity: 250, unit_price: 40.00 }, as: OperationsAnalyst }
            - { call: "GET /aml/accounts/${acct_id}", payload: {}, as: OperationsAnalyst, captures: { e0: "$.data.exposure_30d_amount", tier0: "$.data.exposure_tier" } }
          trigger:
            - { call: "POST /aml/accounts/${acct_id}/transactions", payload: { txn_type: "SELL", security_id: "PNY", quantity: 1000, unit_price: 4.50 }, as: OperationsAnalyst, captures: { txn_id: "$.data.id" } }
            - { call: "GET /aml/accounts/${acct_id}", payload: {}, as: OperationsAnalyst, captures: { e1: "$.data.exposure_30d_amount" } }
            - { call: "POST /aml/transactions/${txn_id}/reverse", payload: { reason: "erroneous trade" }, as: OperationsAnalyst, captures: { rst: "$.data.status" } }
            - { call: "GET /aml/accounts/${acct_id}", payload: {}, as: OperationsAnalyst, captures: { e2: "$.data.exposure_30d_amount", tier2: "$.data.exposure_tier" } }
          assert:
            - "captured e0 == 10000.00 and tier0 == T1"
            - "captured e1 == 14500.00 (post added 4500.00)"
            - "captured rst == REVERSED"
            - "captured e2 == 10000.00 and tier2 == T1 (post+reverse conserves exposure exactly)"

      - name: escalate_then_decide_no_file_conserves_open_workload
        grounds:
          - state_machines.MonitoringAlert.UNDER_REVIEW_to_ESCALATED_TO_CASE
          - state_machines.MonitoringAlert.ESCALATED_TO_CASE_to_UNDER_REVIEW
          - state_machines.AMLCase.INVESTIGATING_to_DECIDED_NO_FILE
          - entities.BrokerageAccount.fields.open_alert_count
          - entities.BrokerageAccount.fields.open_case_count
        distinguishing_aspect: |
          Conserved quantity = open-workload count (distinct from monetary exposure):
          W = open_alert_count + open_case_count (alerts in {NEW, UNDER_REVIEW} plus
          cases in {OPEN, INVESTIGATING, SAR_RECOMMENDED, REOPENED}). Escalation moves
          the alert out and the case in (W stays 1); decide-no-file removes the case
          and returns the alert to UNDER_REVIEW (W returns to the pre-escalation 1).
        test_recipe:
          setup: ["OPEN LOW account; STRUCTURING alert generated and UNDER_REVIEW (W = 1 + 0 = 1)."]
          setup_api_calls:
            - { call: "POST /aml/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /aml/reps", payload: { full_name: "Rep U", crd_number: "CRD-CI2" }, as: SystemAdmin, captures: { rep_id: "$.data.id" } }
            - { call: "POST /aml/customers", payload: { customer_type: "INDIVIDUAL", full_name: "U Low", tax_id: "TIN-CI2", country_risk_tier: "LOW" }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { cust_id: "$.data.id" } }
            - { call: "POST /aml/customers/${cust_id}/identification-documents", payload: { doc_type: "GOVERNMENT_ID", document_number: "P-CI2", expiry_date: "2030-01-01" }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { doc_id: "$.data.id" } }
            - { call: "POST /aml/identification-documents/${doc_id}/verify", payload: {}, as: AMLAnalyst }
            - { call: "POST /aml/accounts", payload: { customer_id: "${cust_id}", product_set: ["CASH"] }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { acct_id: "$.data.id" } }
            - { call: "POST /aml/accounts/${acct_id}/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /aml/monitoring-rules", payload: { rule_code: "STRUCTURING", threshold_amount: 10000.00, window_days: 2, min_transaction_count: 3 }, as: SystemAdmin }
            - { call: "POST /aml/accounts/${acct_id}/transactions", payload: { txn_type: "BUY", security_id: "ACME", quantity: 100, unit_price: 40.00 }, as: RegisteredRep, as_user_id: "${rep_id}" }
            - { call: "POST /aml/accounts/${acct_id}/transactions", payload: { txn_type: "BUY", security_id: "ACME", quantity: 100, unit_price: 40.00 }, as: RegisteredRep, as_user_id: "${rep_id}" }
            - { call: "POST /aml/accounts/${acct_id}/transactions", payload: { txn_type: "BUY", security_id: "ACME", quantity: 100, unit_price: 40.00 }, as: RegisteredRep, as_user_id: "${rep_id}" }
            - { call: "POST /aml/monitoring-scans/run", payload: {}, as: AMLAnalyst }
            - { call: "GET /aml/alerts", payload: { account_id: "${acct_id}" }, as: AMLAnalyst, captures: { alert_id: "$.data[0].id" } }
            - { call: "POST /aml/alerts/${alert_id}/begin-review", payload: {}, as: AMLAnalyst }
            - { call: "GET /aml/accounts/${acct_id}", payload: {}, as: AMLAnalyst, captures: { oa0: "$.data.open_alert_count", oc0: "$.data.open_case_count" } }
          trigger:
            - { call: "POST /aml/alerts/${alert_id}/escalate", payload: {}, as: AMLAnalyst, captures: { case_id: "$.data.case_id" } }
            - { call: "GET /aml/accounts/${acct_id}", payload: {}, as: AMLAnalyst, captures: { oa1: "$.data.open_alert_count", oc1: "$.data.open_case_count" } }
            - { call: "POST /aml/aml-cases/${case_id}/begin-investigation", payload: {}, as: AMLAnalyst }
            - { call: "POST /aml/aml-cases/${case_id}/decide-no-file", payload: { rationale: "legitimate client behavior" }, as: SAROfficer, as_user_id: "saroff-ci2" }
            - { call: "GET /aml/accounts/${acct_id}", payload: {}, as: AMLAnalyst, captures: { oa2: "$.data.open_alert_count", oc2: "$.data.open_case_count" } }
            - { call: "GET /aml/alerts/${alert_id}", payload: {}, as: AMLAnalyst, captures: { alert_st: "$.data.status" } }
          assert:
            - "captured oa0 == 1 and oc0 == 0 (W = 1 before escalation)"
            - "captured oa1 == 0 and oc1 == 1 (W = 1: alert out, case in)"
            - "captured oa2 == 1 and oc2 == 0 (W = 1: compensating pair conserves workload)"
            - "captured alert_st == UNDER_REVIEW (alert returned for re-triage, not closed)"
