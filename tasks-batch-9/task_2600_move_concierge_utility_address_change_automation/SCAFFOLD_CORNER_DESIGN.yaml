        excluded_because:
          difficulty_instance: dual_variant_calc / readiness_pre_vs_post_verification_divergence
          rationale: "That instance asserts both readiness variants on identical inputs, which covers the correct-result claim for this rule at full strength."

      - name: weighted_scoring_readiness_weights_renormalize
        claim_type: weighted_scoring_weight_application
        grounds:
          - calculations.move_readiness_score.formula
        excluded_because:
          difficulty_instance: combinatorial_formula / readiness_weight_renormalization_with_clamp
          rationale: "The weight renormalization and the 100 clamp are asserted there across the full component matrix."

      - name: threshold_duplicate_suspect_boundary
        claim_type: threshold_boundary
        grounds:
          - calculations.duplicate_match_score.constants.DUP_SUSPECT_THRESHOLD
        excluded_because:
          difficulty_instance: boundary_precision_check / duplicate_score_exactly_080_threshold_vs_079
          rationale: "Exactly 0.80 versus 0.79 is asserted there, including the blocking consequence of the SUSPECTED flag."

      - name: aggregation_feed_source_share_rounds_per_placement
        claim_type: aggregation_order
        grounds:
          - calculations.referral_attributed_share_cents.precision
        excluded_because:
          difficulty_instance: combinatorial_formula / feed_source_share_round_per_placement_then_sum
          rationale: "Round-then-sum against sum-then-round is the entire point of that instance, which produces a one-cent observable difference."

      - name: reconciliation_provisional_against_settled_commission
        claim_type: reconciliation
        grounds:
          - calculations.referral_attributed_share_cents.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / referral_share_provisional_vs_settled_divergence
          rationale: "The ADJUSTMENT and FEED_SOURCE_SHARE_ADJUSTMENT reconciliation entries are asserted there."

      - name: variant_divergence_deposit_estimate_against_final
        claim_type: variant_divergence
        grounds:
          - calculations.credit_deposit_amount_cents.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / deposit_estimate_vs_bureau_final_divergence
          rationale: "Both deposit variants are computed on identical provider data and asserted to differ there."

      - name: variant_divergence_open_against_cancelled_candidate_pool
        claim_type: variant_divergence
        grounds:
          - calculations.duplicate_match_score.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / duplicate_open_vs_cancelled_pool_divergence
          rationale: "The two pool variants produce the same number with different observable outcomes there, which is the sharper form of this claim."

  - section: validations
    instances:

      - name: satisfaction_to_pass_schedule_at_the_exact_lead_time_floor
        claim_type: satisfaction_to_pass
        grounds:
          - "validations[priority=31]"
          - "errors[ERR_LEAD_TIME_VIOLATION]"
          - entities.UtilityProvider.fields.scheduling_lead_days
        distinguishing_aspect: |
          The inclusive edge of the lead-time floor on a provider with a non-zero lead: clock_date
          2026-08-01 plus scheduling_lead_days 3 makes 2026-08-04 the first legal service date, so
          2026-08-03 must fail and 2026-08-04 must pass. An implementation using a strict > on the
          floor rejects both dates and still looks correct against a violation-only test.
        test_recipe:
          setup:
            - "A SCHEDULING move with one DRAFT electric order whose provider has scheduling_lead_days 3, at clock 2026-08-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
