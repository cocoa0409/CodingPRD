              payload: { field_id: "${f_sy}", inspector_staff_member_id: "${s_insp}", assessment_type: "IMPACT_ATTENUATION", assessed_at_utc: "2026-08-01T00:00:00Z", gmax_readings: [164.9, 165.0, 165.1] }
              as: SafetyInspector
              as_user_id: "${s_insp}"
              captures: { a_impact: $.data.id, a_mean: $.data.gmax_mean_value }
          assert:
            - "the trigger returns 201 with data.gmax_mean_value == 165.0 ((164.9 + 165.0 + 165.1) / 3 = 165.0 exactly, 1dp) and data.result == \"PASS\""
            - "the trigger returns data.status == \"RECORDED\" and data.declared_result == null"
            - "GET /turf/remediation-orders?field_id=${f_sy} returns meta.total_count == 0 - a PASS opens no order"
            - "GET /turf/fields/${f_sy} returns data.latest_gmax_mean_value == 165.0, data.open_mandatory_remediation_count == 0, data.open_advisory_remediation_count == 0 and data.play_status == \"OPEN\""
            - "GET /turf/fields/${f_sy} returns data.condition_index_agronomic == 59.55 (wear_component 100.00 x 0.50 + age_component 0.00 x 0.20 + safety_component 31.82 x 0.30)"

      - name: rest_requirement_hours_uses_marginal_tier_spans_not_a_flat_rate
        claim_type: tiered_pricing
        grounds:
          - calculations.rest_requirement_hours
          - calculations.wear_load_units
          - state_machines.UsageBooking
        distinguishing_aspect: "One close-out lands 8.64 wear units, which straddles the first REST_TIERS boundary (6.00), so the marginal schedule yields 6.00 x 0.50 + 2.64 x 1.00 = 5.64 hours. A flat 1.00 h/unit schedule yields 8.64 and applying the top tier rate 1.75 to the whole amount yields 15.12. A second close-out on a SYNTHETIC_TURF field shows the 0.40 multiplier turning 0.80 tier hours into 0.32; omitting SYNTHETIC_REST_MULTIPLIER leaves 0.80."
        test_recipe:
          setup:
            - "Empty database; the logical clock sits at its mandatory default 2026-08-01T00:00:00Z unless a POST /_clock/set_current_utc call below moves it forward."
            - "The setup_api_calls chain below is the authoritative, executable statement of this precondition - every fixture value is a literal and every id is captured from a prior response."
