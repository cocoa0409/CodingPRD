# §1.9 Scaffold Corner Design — breadth probe over the §1.1-§1.7 surface of
# task_2562 Short-Term Rental Guest Screening & Damage Protection.
# Sections and claim_type values are taken verbatim from
# references/claim-extraction-guide.md; corners already asserted by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml carry an excluded_because stub and no test_recipe.
scaffold_corner_design:
  - section: entities
    instances:
      - name: guest_creation_returns_declared_defaults_and_system_fields
        claim_type: creation
        grounds:
          - endpoints.POST_rentals_guests
          - entities.Guest
          - calculations.guest_risk_score
        distinguishing_aspect: "A guest created with only the three input fields comes back 201 with verification_state UNVERIFIED, every counter 0, payment_risk_signal CLEAN and risk_score exactly BASE_RISK 35 / risk_tier ELEVATED."
        test_recipe:
          setup:
            - "Empty DB with the logical clock pinned at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /rentals/guests"
              payload: { full_name: "Corner Guest One", email: "corner1@guest.test", country_code: "US" }
              as: PlatformAdmin
              captures: { g1: $.data.id }
          assert:
            - "HTTP 201 and response_type object"
            - "Guest.${g1}.full_name == Corner Guest One and Guest.${g1}.email == corner1@guest.test and Guest.${g1}.country_code == US"
            - "Guest.${g1}.verification_state == UNVERIFIED"
            - "Guest.${g1}.accepted_doc_count == 0 and Guest.${g1}.accepted_gov_id_count == 0"
            - "Guest.${g1}.completed_stay_count == 0 and Guest.${g1}.substantiated_incident_count == 0 and Guest.${g1}.escalated_incident_count == 0 and Guest.${g1}.approved_claim_count == 0"
            - "Guest.${g1}.payment_risk_signal == CLEAN and Guest.${g1}.chargeback_count == 0"
            - "Guest.${g1}.risk_score == 35 and Guest.${g1}.risk_tier == ELEVATED"
            - "Guest.${g1}.deposit_held_cents == 0 and Guest.${g1}.active_blocklist_scope_count == 0"
            - "Guest.${g1}.version == 1 and Guest.${g1}.created_at == 2026-08-01T00:00:00Z"

      - name: property_retrieval_returns_stored_listing_configuration
        claim_type: retrieval
        grounds:
          - endpoints.GET_rentals_properties_id
          - entities.Property
          - calculations.sensor_compliance_state
          - calculations.coverage_posture
        distinguishing_aspect: "GET on a freshly created listing echoes every input field and reports the three derived postures for an empty listing: listing_state DRAFT, sensor_compliance_state COMPLIANT (empty device set) and coverage_posture UNPROTECTED (0 visible layers)."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One host, one jurisdiction rule and one DRAFT listing with no devices and no coverage layers."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rentals/hosts"
              payload: { legal_name: "Corner Stays LLC", email: "cornerhost1@stays.test" }
              as: PlatformAdmin
              captures: { h1: $.data.id }
            - call: "POST /rentals/jurisdiction-rules"
              payload: { jurisdiction_code: "US-CA-SFO", min_stay_nights: 2, max_occupancy_cap: 8, events_prohibited: false, registration_required: false, indoor_camera_allowed: true, indoor_audio_allowed: false, sensor_notice_required: true, noise_threshold_db: 70 }
              as: ComplianceOfficer
              captures: { j1: $.data.id }
            - call: "POST /rentals/properties"
              payload: { host_id: "${h1}", jurisdiction_rule_id: "${j1}", address_line: "14 Harbor Way", city: "San Francisco", max_occupancy: 6, bedrooms: 3, nightly_rate_cents: 30000, protection_product: "WAIVER", deposit_amount_cents: 0, waiver_nightly_fee_cents: 3000, claim_ceiling_cents: 500000, event_policy: "EVENTS_ALLOWED", turnover_buffer_nights: 0 }
              as: Host
              as_user_id: "${h1}"
              captures: { p1: $.data.id }
          trigger:
            - call: "GET /rentals/properties/${p1}"
              payload: {}
              as: Host
              as_user_id: "${h1}"
          assert:
            - "HTTP 200"
            - "Property.${p1}.host_id == ${h1} and Property.${p1}.jurisdiction_rule_id == ${j1}"
            - "Property.${p1}.nightly_rate_cents == 30000 and Property.${p1}.protection_product == WAIVER and Property.${p1}.waiver_nightly_fee_cents == 3000 and Property.${p1}.deposit_amount_cents == 0"
            - "Property.${p1}.claim_ceiling_cents == 500000 and Property.${p1}.event_policy == EVENTS_ALLOWED and Property.${p1}.turnover_buffer_nights == 0"
            - "Property.${p1}.listing_state == DRAFT and Property.${p1}.suspension_reason == null"
            - "Property.${p1}.sensor_compliance_state == COMPLIANT"
            - "Property.${p1}.coverage_posture == UNPROTECTED"
            - "Property.${p1}.open_reservation_count == 0 and Property.${p1}.open_claim_count == 0"
            - "Property.${p1}.registration_number == null and Property.${p1}.version == 1"

      - name: guest_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints.GET_rentals_guests
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three guests stored, limit 2 / offset 0 returns exactly 2 items with total_count 3 and has_more true; offset 2 returns 1 item with has_more false."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z and exactly three guests."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rentals/guests"
              payload: { full_name: "Page Guest A", email: "page-a@guest.test", country_code: "US" }
              as: PlatformAdmin
            - call: "POST /rentals/guests"
              payload: { full_name: "Page Guest B", email: "page-b@guest.test", country_code: "US" }
              as: PlatformAdmin
            - call: "POST /rentals/guests"
              payload: { full_name: "Page Guest C", email: "page-c@guest.test", country_code: "CA" }
              as: PlatformAdmin
          trigger:
            - call: "GET /rentals/guests"
              payload: { limit: 2, offset: 0 }
              as: PlatformAdmin
          assert:
            - "HTTP 200 and response_type array"
            - "The response reports limit 2, offset 0, total_count 3 and has_more true, with exactly 2 items in data"
            - "The same endpoint with limit 2 and offset 2 reports total_count 3, has_more false and exactly 1 item"
            - "The same endpoint with limit 10 and offset 0 filtered by risk_tier ELEVATED reports total_count 3, because every fresh guest scores 35"

      - name: damage_claim_read_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - validations.priority_4_existence
          - errors.ERR_CLAIM_NOT_FOUND
        distinguishing_aspect: "A well-formed but unstored claim id returns 404 ERR_CLAIM_NOT_FOUND, not 200 with an empty body and not 403 — the existence check at priority 4 runs before ownership at priority 6."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; no DamageClaim rows exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /rentals/damage-claims/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "${err} == ERR_CLAIM_NOT_FOUND"
            - "The error envelope carries both error_id and message under data"

      - name: property_create_missing_required_nightly_rate_rejected
        claim_type: required_fields
        grounds:
          - endpoints.POST_rentals_properties
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "Omitting nightly_rate_cents — an input field with no default — returns 400 ERR_INVALID_REQUEST and persists no Property row."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z, one host and one jurisdiction rule."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rentals/hosts"
              payload: { legal_name: "Corner Stays LLC", email: "cornerhost2@stays.test" }
              as: PlatformAdmin
              captures: { h1: $.data.id }
            - call: "POST /rentals/jurisdiction-rules"
              payload: { jurisdiction_code: "US-CA-SFO", min_stay_nights: 2, max_occupancy_cap: 8, events_prohibited: false, registration_required: false, indoor_camera_allowed: true, indoor_audio_allowed: false, sensor_notice_required: true, noise_threshold_db: 70 }
              as: ComplianceOfficer
              captures: { j1: $.data.id }
          trigger:
            - call: "POST /rentals/properties"
              payload: { host_id: "${h1}", jurisdiction_rule_id: "${j1}", address_line: "14 Harbor Way", city: "San Francisco", max_occupancy: 6, bedrooms: 3, protection_product: "WAIVER", deposit_amount_cents: 0, waiver_nightly_fee_cents: 3000, claim_ceiling_cents: 500000, event_policy: "EVENTS_ALLOWED" }
              as: Host
              as_user_id: "${h1}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400"
            - "${err} == ERR_INVALID_REQUEST"
            - "GET /rentals/properties?host_id=${h1} returns total_count 0"

      - name: property_omitted_optionals_take_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Property.fields.turnover_buffer_nights
          - entities.Property.fields.registration_number
          - entities.Property.fields.listing_state
        distinguishing_aspect: "Omitting turnover_buffer_nights yields the declared default 0 (not null), omitting registration_number yields null, and listing_state defaults to DRAFT."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z, one host and one jurisdiction rule with registration_required false."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rentals/hosts"
              payload: { legal_name: "Corner Stays LLC", email: "cornerhost3@stays.test" }
              as: PlatformAdmin
              captures: { h1: $.data.id }
            - call: "POST /rentals/jurisdiction-rules"
              payload: { jurisdiction_code: "US-CA-SFO", min_stay_nights: 2, max_occupancy_cap: 8, events_prohibited: false, registration_required: false, indoor_camera_allowed: true, indoor_audio_allowed: false, sensor_notice_required: true, noise_threshold_db: 70 }
              as: ComplianceOfficer
              captures: { j1: $.data.id }
          trigger:
            - call: "POST /rentals/properties"
              payload: { host_id: "${h1}", jurisdiction_rule_id: "${j1}", address_line: "8 Beach Street", city: "San Francisco", max_occupancy: 4, bedrooms: 2, nightly_rate_cents: 20000, protection_product: "DEPOSIT", deposit_amount_cents: 50000, waiver_nightly_fee_cents: 0, claim_ceiling_cents: 400000, event_policy: "EVENTS_PROHIBITED" }
              as: Host
              as_user_id: "${h1}"
              captures: { p1: $.data.id }
          assert:
            - "HTTP 201"
            - "Property.${p1}.turnover_buffer_nights == 0"
            - "Property.${p1}.registration_number == null"
            - "Property.${p1}.listing_state == DRAFT and Property.${p1}.suspension_reason == null"
            - "Property.${p1}.deposit_amount_cents == 50000 and Property.${p1}.waiver_nightly_fee_cents == 0"

      - name: guest_risk_score_input_ignored_on_create
        claim_type: computed_fields
        grounds:
          - entities.Guest.fields.risk_score
          - entities.Guest.fields.verification_state
          - calculations.guest_risk_score
        distinguishing_aspect: "A create request that smuggles risk_score 0 and verification_state VERIFIED is not honoured: the stored guest still reads risk_score 35, risk_tier ELEVATED and verification_state UNVERIFIED, because both fields are computed from documents and counters."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /rentals/guests"
              payload: { full_name: "Sneaky Input", email: "sneaky@guest.test", country_code: "US", risk_score: 0, verification_state: "VERIFIED" }
              as: PlatformAdmin
              captures: { g1: $.data.id }
          assert:
            - "Guest.${g1}.risk_score == 35 and Guest.${g1}.risk_tier == ELEVATED"
            - "Guest.${g1}.verification_state == UNVERIFIED"
            - "Guest.${g1}.accepted_doc_count == 0"

      - name: host_system_fields_are_server_minted_from_logical_clock
        claim_type: system_fields
        grounds:
          - entities.Host.common_fields
          - entities.Host.fields.payout_hold
          - endpoints.POST_clock_set_current_utc
        distinguishing_aspect: "id, created_at, updated_at and version are server-minted: created_at equals the logical clock instant 2026-08-04T09:30:00Z rather than wall-clock time, version starts at 1, and payout_hold starts false."
        test_recipe:
          setup:
            - "Logical clock deliberately set to 2026-08-04T09:30:00Z before the host is registered."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-04T09:30:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /rentals/hosts"
              payload: { legal_name: "Clock Stamped Stays", email: "clockhost@stays.test" }
              as: PlatformAdmin
              captures: { h1: $.data.id }
          assert:
            - "HTTP 201 and ${h1} is a server-generated id present in the response"
            - "Host.${h1}.created_at == 2026-08-04T09:30:00Z and Host.${h1}.updated_at == 2026-08-04T09:30:00Z"
            - "Host.${h1}.version == 1"
            - "Host.${h1}.payout_hold == false and Host.${h1}.settled_claim_count == 0 and Host.${h1}.denied_claim_count == 0 and Host.${h1}.total_recovered_cents == 0"

      - name: property_invalid_enum_protection_product_rejected
        claim_type: type_constraints
        grounds:
          - entities.Property.fields.protection_product
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "protection_product accepts only DEPOSIT or WAIVER; the undeclared value INSURANCE returns 400 ERR_INVALID_REQUEST before any product-coherence check at priority 48 can run."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z, one host and one jurisdiction rule."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rentals/hosts"
              payload: { legal_name: "Corner Stays LLC", email: "cornerhost4@stays.test" }
              as: PlatformAdmin
              captures: { h1: $.data.id }
            - call: "POST /rentals/jurisdiction-rules"
              payload: { jurisdiction_code: "US-CA-SFO", min_stay_nights: 2, max_occupancy_cap: 8, events_prohibited: false, registration_required: false, indoor_camera_allowed: true, indoor_audio_allowed: false, sensor_notice_required: true, noise_threshold_db: 70 }
              as: ComplianceOfficer
              captures: { j1: $.data.id }
          trigger:
            - call: "POST /rentals/properties"
              payload: { host_id: "${h1}", jurisdiction_rule_id: "${j1}", address_line: "14 Harbor Way", city: "San Francisco", max_occupancy: 6, bedrooms: 3, nightly_rate_cents: 30000, protection_product: "INSURANCE", deposit_amount_cents: 0, waiver_nightly_fee_cents: 3000, claim_ceiling_cents: 500000, event_policy: "EVENTS_ALLOWED" }
              as: Host
              as_user_id: "${h1}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400"
            - "${err} == ERR_INVALID_REQUEST"
            - "${err} != ERR_PRODUCT_CONFIG_INVALID"
            - "GET /rentals/properties?host_id=${h1} returns total_count 0"

      - name: jurisdiction_rule_is_immutable_with_no_version_field
        claim_type: immutability
        grounds:
          - entities.JurisdictionRule.common_fields
          - endpoints.POST_rentals_jurisdiction_rules
        distinguishing_aspect: "JurisdictionRule declares common_fields false: the created row exposes id and created_at but no version and no updated_at, and §1.5 offers no update or delete endpoint for it — a published rule is superseded by a new code, never edited."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /rentals/jurisdiction-rules"
              payload: { jurisdiction_code: "US-WA-SEA", min_stay_nights: 3, max_occupancy_cap: 6, events_prohibited: true, registration_required: true, indoor_camera_allowed: false, indoor_audio_allowed: false, sensor_notice_required: true, noise_threshold_db: 65 }
              as: ComplianceOfficer
              captures: { j1: $.data.id }
          assert:
            - "HTTP 201 and JurisdictionRule.${j1}.jurisdiction_code == US-WA-SEA"
            - "The response carries id and created_at but NO version field and NO updated_at field"
            - "GET /rentals/jurisdiction-rules/${j1} returns the same row with min_stay_nights 3, max_occupancy_cap 6, events_prohibited true, registration_required true, indoor_camera_allowed false, indoor_audio_allowed false, sensor_notice_required true, noise_threshold_db 65"
            - "§1.5 declares no PATCH, PUT or DELETE for /rentals/jurisdiction-rules/{id}"

      - name: property_create_with_unknown_jurisdiction_rule_not_found
        claim_type: parent_relationships
        grounds:
          - validations.priority_5_existence
          - errors.ERR_JURISDICTION_RULE_NOT_FOUND
        distinguishing_aspect: "Foreign keys are resolved in the §1.1 field order, so a valid host_id with an unstored jurisdiction_rule_id returns 404 ERR_JURISDICTION_RULE_NOT_FOUND (not ERR_HOST_NOT_FOUND, and not a 422)."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z and one host; no JurisdictionRule row exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rentals/hosts"
              payload: { legal_name: "Corner Stays LLC", email: "cornerhost5@stays.test" }
              as: PlatformAdmin
              captures: { h1: $.data.id }
          trigger:
            - call: "POST /rentals/properties"
              payload: { host_id: "${h1}", jurisdiction_rule_id: "00000000-0000-0000-0000-0000000000aa", address_line: "14 Harbor Way", city: "San Francisco", max_occupancy: 6, bedrooms: 3, nightly_rate_cents: 30000, protection_product: "WAIVER", deposit_amount_cents: 0, waiver_nightly_fee_cents: 3000, claim_ceiling_cents: 500000, event_policy: "EVENTS_ALLOWED" }
              as: Host
              as_user_id: "${h1}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "${err} == ERR_JURISDICTION_RULE_NOT_FOUND"
            - "${err} != ERR_HOST_NOT_FOUND"
            - "GET /rentals/properties?host_id=${h1} returns total_count 0"

      - name: settlement_allocation_junction_links_claim_and_coverage_layer
        claim_type: graph
        grounds:
          - entities.SettlementAllocation
          - entities.DamageClaim
          - entities.CoverageLayer
        excluded_because:
          difficulty_instance: transitive_cascade / claim_approval_cascade_exhausts_last_layer_and_suspends_listing
          rationale: "The graph-topology junction claim — SettlementAllocation joining DamageClaim to CoverageLayer with sequence_index, gross_cents and allocated_cents — is asserted end-to-end by that §1.8 instance, including the reverse read GET /rentals/settlement-allocations?claim_id=."

  - section: state_machines
    instances:
      - name: property_activate_moves_draft_listing_to_active
        claim_type: valid_transition
        grounds:
          - state_machines.Property.listing_state.DRAFT_to_ACTIVE
          - endpoints.POST_rentals_properties_id_activate
        distinguishing_aspect: "activate on a DRAFT listing whose jurisdiction does not require registration returns 200 with listing_state ACTIVE, suspension_reason null and Property.version incremented from 1 to 2."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z, one host, one jurisdiction rule with registration_required false, one DRAFT listing with no devices."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rentals/hosts"
              payload: { legal_name: "Corner Stays LLC", email: "cornerhost6@stays.test" }
              as: PlatformAdmin
              captures: { h1: $.data.id }
            - call: "POST /rentals/jurisdiction-rules"
              payload: { jurisdiction_code: "US-CA-SFO", min_stay_nights: 2, max_occupancy_cap: 8, events_prohibited: false, registration_required: false, indoor_camera_allowed: true, indoor_audio_allowed: false, sensor_notice_required: true, noise_threshold_db: 70 }
              as: ComplianceOfficer
              captures: { j1: $.data.id }
            - call: "POST /rentals/properties"
              payload: { host_id: "${h1}", jurisdiction_rule_id: "${j1}", address_line: "14 Harbor Way", city: "San Francisco", max_occupancy: 6, bedrooms: 3, nightly_rate_cents: 30000, protection_product: "WAIVER", deposit_amount_cents: 0, waiver_nightly_fee_cents: 3000, claim_ceiling_cents: 500000, event_policy: "EVENTS_ALLOWED", turnover_buffer_nights: 0 }
              as: Host
              as_user_id: "${h1}"
              captures: { p1: $.data.id, v_before: $.data.version }
          trigger:
            - call: "POST /rentals/properties/${p1}/activate"
              payload: {}
              as: Host
              as_user_id: "${h1}"
              captures: { state_after: $.data.listing_state }
          assert:
            - "HTTP 200 and ${state_after} == ACTIVE"
            - "${v_before} == 1 and Property.${p1}.version == 2"
            - "Property.${p1}.suspension_reason == null and Property.${p1}.sensor_compliance_state == COMPLIANT"

      - name: property_activate_without_registration_number_rejected
        claim_type: precondition_enforcement
        grounds:
          - validations.priority_23_ERR_REGISTRATION_REQUIRED
          - state_machines.Property.listing_state.DRAFT_to_ACTIVE
        distinguishing_aspect: "In a jurisdiction with registration_required true, activating a listing whose registration_number is null returns 422 ERR_REGISTRATION_REQUIRED and leaves listing_state DRAFT."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Jurisdiction US-WA-SEA with registration_required true and min_stay_nights 3."
            - "One DRAFT listing in that jurisdiction created WITHOUT registration_number."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rentals/hosts"
              payload: { legal_name: "Sound Stays LLC", email: "cornerhost7@stays.test" }
              as: PlatformAdmin
              captures: { h1: $.data.id }
            - call: "POST /rentals/jurisdiction-rules"
              payload: { jurisdiction_code: "US-WA-SEA", min_stay_nights: 3, max_occupancy_cap: 6, events_prohibited: true, registration_required: true, indoor_camera_allowed: false, indoor_audio_allowed: false, sensor_notice_required: true, noise_threshold_db: 65 }
              as: ComplianceOfficer
              captures: { j1: $.data.id }
            - call: "POST /rentals/properties"
              payload: { host_id: "${h1}", jurisdiction_rule_id: "${j1}", address_line: "9 Pike Lane", city: "Seattle", max_occupancy: 4, bedrooms: 2, nightly_rate_cents: 25000, protection_product: "DEPOSIT", deposit_amount_cents: 40000, waiver_nightly_fee_cents: 0, claim_ceiling_cents: 300000, event_policy: "EVENTS_PROHIBITED" }
              as: Host
              as_user_id: "${h1}"
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /rentals/properties/${p1}/activate"
              payload: {}
              as: Host
              as_user_id: "${h1}"
