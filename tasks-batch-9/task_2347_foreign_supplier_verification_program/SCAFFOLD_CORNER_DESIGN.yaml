              payload: { pair_id: "${pair1}", activity_type: "SAMPLING_AND_TESTING", frequency_per_year: 3, justification_text: "Three sampling events per year covering the pathogen profile of this frozen ready to eat fruit", window_start: "2026-10-01T00:00:00Z", window_end: "2026-10-15T00:00:00Z", assigned_qi_id: "${qi_b}" }
              as: QualifiedIndividual
              as_user_id: "${qi_a}"
              captures: { act1: $.data.id }
            - call: "POST /fsvp/verification-activities/${act1}/review"
              payload: { decision: "APPROVE", reviewer_note: "Sampling plan matches the pathogen profile of the food" }
              as: QualifiedIndividual
              as_user_id: "${qi_b}"
            - call: "POST /fsvp/supplier-food-pairs/${pair1}/verification-approval"
              payload: { approval_note: "Selected verification activities are adequate for the hazards requiring control" }
              as: QualifiedIndividual
              as_user_id: "${qi_a}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-20T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fsvp/verification-records"
              payload: { activity_id: "${act1}", outcome: "FAIL", performed_start: "2026-10-05T00:00:00Z", performed_end: "2026-10-06T00:00:00Z", findings_count: 0, document_reference: "LAB-2026-1006" }
              as: QualifiedIndividual
              as_user_id: "${qi_a}"
              captures: { rec1: $.data.id }
            - call: "POST /fsvp/verification-records/${rec1}/attestation"
              payload: { attestation_note: "Failing sampling result attested after laboratory confirmation" }
              as: QualifiedIndividual
              as_user_id: "${qi_b}"
            - call: "GET /fsvp/corrective-actions?supplier_id=${sup}&status=OPEN&limit=50&offset=0"
              payload: {}
              as: ComplianceOfficer
              captures: { ca1: "$.data[0].id" }
            - call: "GET /fsvp/foreign-suppliers/${sup}"
              payload: {}
              as: ComplianceOfficer
              captures: { sup_v: $.data.version }
            - call: "POST /fsvp/corrective-actions/${ca1}/decision"
              payload: { decision: "IMPORT_SUSPENSION", rationale: "Pathogen finding at the supplier warrants suspending imports pending remediation", expected_supplier_version: "${sup_v}" }
              as: ComplianceOfficer
            - call: "POST /fsvp/foods"
              payload: { importer_id: "${imp}", food_name: "Pasteurised mango juice", fda_product_code: "20-JUI-05", is_raw_agricultural_commodity: false, intended_consumer_group: "GENERAL", process_control_category: "JUICE_HACCP", ready_to_eat: true }
              as: ComplianceOfficer
              captures: { food_j: $.data.id }
            - call: "POST /fsvp/supplier-food-pairs"
              payload: { importer_id: "${imp}", supplier_id: "${sup}", food_id: "${food_j}", designated_qi_id: "${qi_a}" }
              as: ComplianceOfficer
              captures: { pair_j: $.data.id }
            - call: "POST /fsvp/supplier-food-pairs/${pair_j}/exemption"
              payload: { action: "CLAIM", exemption_type: "JUICE_HACCP_CONTROL", basis_note: "The juice is produced under a compliant juice HACCP programme" }
              as: QualifiedIndividual
              as_user_id: "${qi_a}"
            - call: "POST /fsvp/supplier-food-pairs/${pair_j}/exemption"
              payload: { action: "VERIFY", determination_note: "Juice HACCP exemption verified from the filed process documentation" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /fsvp/entry-submissions"
              payload: { pair_id: "${pair_j}", entry_number: "ENT-2026-0003", entry_line_number: 1, dnb_number_submitted: "123456789", ufi_submitted: "UFI-NB-0001", arrival_date: "2026-10-25T00:00:00Z" }
              as: EntryFiler
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with ERR_IMPORT_SUSPENSION_ACTIVE (NOT ERR_SUPPLIER_NOT_APPROVED, which rung 27 skips for a non-modified verified exemption)"
            - "ForeignSupplier.${sup}.status == SUSPENDED_PENDING_REVIEW"
            - "ForeignSupplier.${sup}.performance_score_final == 20.00"
            - "CorrectiveAction.${ca1}.status == IMPORT_SUSPENSION"
            - "SupplierFoodPair.${pair_j}.entry_eligibility_status == ELIGIBLE with exemption_status VERIFIED and modified_requirements_only false"
            - "SupplierFoodPair.${pair1}.entry_eligibility_status == BLOCKED"
            - "no EntrySubmission row is created"

      - name: pair_entry_blocked_on_a_blocked_pair
        claim_type: error_triggerable
        excluded_because:
          difficulty_instance: entry_blocked_masks_identifier_mismatch_on_entry_filing
          rationale: "That §1.8 instance files an entry line against a BLOCKED pair with deliberately wrong identifiers and asserts ERR_PAIR_ENTRY_BLOCKED wins, which is strictly stronger than a bare trigger of the code."
      - name: supplier_not_approved_on_entry_filing
        claim_type: error_triggerable
        excluded_because:
          difficulty_instance: entry_filing_blocked_by_unevaluated_supplier_under_modified_requirements
          rationale: "The conditional half of rung 27 — the supplier-status check applying only when the pair rests on modified requirements or full verification — is the whole subject of that §1.8 instance."
      - name: audit_window_conflict_on_a_second_onsite_audit_record
        claim_type: error_triggerable
        excluded_because:
          difficulty_instance: onsite_audit_cooloff_closed_interval_conflict_on_supplier
          rationale: "The 30-day cool-off widening of the closed audit interval, including its exact boundary day, is asserted there; a bare trigger would duplicate the same fixture."
      - name: qi_window_capacity_exceeded_on_activity_assignment
        claim_type: error_triggerable
        excluded_because:
          difficulty_instance: qi_assignment_capacity_half_open_window_aggregate
          rationale: "That §1.8 instance drives the assigned-QI capacity aggregate over half-open windows to exactly the cap and one past it, which subsumes a single trigger of the code."
      - name: reverification_missing_on_corrective_action_closure
        claim_type: error_triggerable
        excluded_because:
          difficulty_instance: corrective_action_closure_blocked_by_missing_post_decision_pass_record
          rationale: "The 'ATTESTED PASS record dated strictly after decided_at' requirement is exactly what that §1.8 instance falsifies and then satisfies."

  - section: rbac
    instances:
      - name: unauthenticated_request_missing_x_user_headers_returns_unauthenticated
        claim_type: cannot_perform_other_roles_exclusive_operations
        grounds:
          - errors.ERR_UNAUTHENTICATED
          - validations[priority=1]
        distinguishing_aspect: "The payload is entirely valid and would succeed with a ComplianceOfficer identity, so the 401 isolates rung 1 — identity resolution — ahead of the role check at rung 2 and the shape check at rung 3."
        test_recipe:
          setup:
            - "Empty system; the request carries no identity headers at all."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /fsvp/importers"
              payload: { legal_name: "Northbrook Foods Import LLC", dnb_number: "123456789", unique_facility_identifier: "UFI-NB-0001" }
              as: none
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 401 with ERR_UNAUTHENTICATED"
            - "no Importer row is created"
            - "the identical request sent as ComplianceOfficer returns 201"

      - name: entry_filer_cannot_create_a_supplier_food_pair
        claim_type: cannot_perform_other_roles_exclusive_operations
        grounds:
          - roles.EntryFiler.exclusive_operations
          - roles.ComplianceOfficer.exclusive_operations
          - errors.ERR_ROLE_NOT_PERMITTED
        distinguishing_aspect: "EntryFiler owns exactly one write — POST /fsvp/entry-submissions — so pair creation is another role's exclusive operation and is refused at rung 2 even though every referenced id is real and valid."
        test_recipe:
          setup:
            - "Importer, ACTIVE QI Ada, supplier and food all exist; only the pair is missing."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fsvp/importers"
              payload: { legal_name: "Northbrook Foods Import LLC", dnb_number: "123456789", unique_facility_identifier: "UFI-NB-0001" }
              as: ComplianceOfficer
              captures: { imp: $.data.id }
            - call: "POST /fsvp/qualified-individuals"
              payload: { importer_id: "${imp}", full_name: "Ada Ruiz", email: "ada@northbrook.example", qualification_summary: "PCQI and FSVP training plus eight years of supplier audit experience", training_completed_at: "2025-06-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { qi_a: $.data.id }
            - call: "POST /fsvp/qualified-individuals/${qi_a}/designation"
              payload: { action: "DESIGNATE" }
              as: ComplianceOfficer
            - call: "POST /fsvp/foreign-suppliers"
              payload: { importer_id: "${imp}", name: "Rio Verde SA", country_code: "PE", facility_registration_number: "FRN-PE-77001", regulatory_compliance_status: "NO_ADVERSE_FINDINGS" }
              as: ComplianceOfficer
              captures: { sup: $.data.id }
            - call: "POST /fsvp/foods"
              payload: { importer_id: "${imp}", food_name: "Frozen mango chunks", fda_product_code: "20-MAN-01", is_raw_agricultural_commodity: false, intended_consumer_group: "GENERAL", ready_to_eat: true }
              as: ComplianceOfficer
              captures: { food1: $.data.id }
          trigger:
            - call: "POST /fsvp/supplier-food-pairs"
              payload: { importer_id: "${imp}", supplier_id: "${sup}", food_id: "${food1}", designated_qi_id: "${qi_a}" }
              as: EntryFiler
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403 with ERR_ROLE_NOT_PERMITTED"
            - "no SupplierFoodPair row is created"
            - "the identical request as ComplianceOfficer returns 201 with version 1"

      - name: compliance_officer_cannot_sign_the_pair_verification_approval
        claim_type: cannot_perform_other_roles_exclusive_operations
        grounds:
          - roles.QualifiedIndividual.exclusive_operations
          - roles.ComplianceOfficer.description
          - errors.ERR_ROLE_NOT_PERMITTED
        distinguishing_aspect: "The compliance office may register everything and decide suspensions but never performs the technical FSVP judgement; the refusal at rung 2 lands even though the pair would satisfy every numeric rung (adequacy 86.96, frequency 3)."
        test_recipe:
          setup:
