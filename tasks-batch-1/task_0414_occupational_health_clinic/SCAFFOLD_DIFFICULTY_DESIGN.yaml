              payload: { employer_id: "${emp_id}", period_start: "2026-03-01", period_end: "2026-03-31" }
              as: ClinicAdmin
              captures: { inv_id: $.data.id }
          assert:
            - "Invoice.${inv_id}.subtotal_cents == 61725"
            - "Invoice.${inv_id}.discount_cents == 3086"
            - "Invoice.${inv_id}.total_cents == 58639"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: drug_screen_recollection_cycle
        grounds:
          - state_machines.DrugScreen.MRO_REVIEW_to_RECOLLECT_ORDERED
          - state_machines.DrugScreen.RECOLLECT_ORDERED_to_AWAITING_COLLECTION
          - entities.DrugScreen.fields.recollection_count
          - entities.DrugScreen.fields.status
        distinguishing_aspect: |
          On DrugScreen: a cycle MRO_REVIEW -> RECOLLECT_ORDERED -> AWAITING_COLLECTION returns the screen
          to its initial state with recollection_count incremented and lab_result/mro_verified_result reset;
          this is a true loop, not a linear pipeline.
        test_recipe:
          setup:
            - "Employer ACTIVE; worker; DRUG_NON_DOT encounter checked in; drug screen created with specimen_seal_intact=false."
            - "Screen collected, received at lab, lab-reported REJECTED_FOR_TESTING, MRO received."
          setup_api_calls:
            - call: "POST /clinic/employers"
              payload: { legal_name: "Epsilon", mro_user_id: "mro-1" }
              as: ClinicAdmin
              captures: { emp_id: $.data.id, emp_v0: $.data.version }
            - call: "POST /clinic/protocols"
              payload: { employer_id: "${emp_id}", effective_date: "2026-01-01", panels: [ { panel_code: "DRUG_NON_DOT", required_for_job_category: "PACKER", price_cents: 8000, recheck_interval_days: 0 } ] }
              as: ClinicAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /clinic/protocols/${p1_id}/activate"
              payload: { expected_employer_version: "${emp_v0}" }
              as: ClinicAdmin
            - call: "POST /clinic/workers"
              payload: { employer_id: "${emp_id}", full_name: "Polly Packer", job_category: "PACKER", dob: "1995-09-09" }
              as: ClinicAdmin
              captures: { wkr_id: $.data.id }
            - call: "POST /clinic/encounters"
              payload: { employer_id: "${emp_id}", worker_id: "${wkr_id}", encounter_type: "DRUG_SCREEN", panel_code: "DRUG_NON_DOT" }
              as: Clinician
              as_user_id: "clin-1"
              captures: { enc_id: $.data.id }
            - call: "POST /clinic/encounters/${enc_id}/check-in"
              payload: {}
              as: Clinician
              as_user_id: "clin-1"
            - call: "POST /clinic/drug-screens"
              payload: { encounter_id: "${enc_id}", specimen_seal_intact: false }
              as: Clinician
              as_user_id: "clin-1"
              captures: { ds_id: $.data.id }
            - call: "POST /clinic/custody-events"
              payload: { drug_screen_id: "${ds_id}", step: "COLLECT" }
              as: Collector
            - call: "POST /clinic/custody-events"
              payload: { drug_screen_id: "${ds_id}", step: "LAB_RECEIVE" }
              as: Collector
            - call: "POST /clinic/drug-screens/${ds_id}/lab-result"
              payload: { lab_result: "REJECTED_FOR_TESTING" }
              as: Clinician
              as_user_id: "clin-1"
            - call: "POST /clinic/drug-screens/${ds_id}/mro-receive"
              payload: {}
              as: MRO
              as_user_id: "mro-1"
          trigger:
            - call: "POST /clinic/drug-screens/${ds_id}/order-recollection"
              payload: {}
              as: MRO
              as_user_id: "mro-1"
              captures: { st: $.data.status, rc: $.data.recollection_count }
          assert:
            - "DrugScreen.${ds_id}.status == AWAITING_COLLECTION"
            - "DrugScreen.${ds_id}.recollection_count == 1"
            - "DrugScreen.${ds_id}.lab_result == null"

      - name: injury_case_reopen_cycle
        grounds:
          - state_machines.InjuryCase.CLOSED_to_OPEN
          - state_machines.InjuryCase.RTW_PENDING_to_CLOSED
          - entities.InjuryCase.fields.status
        distinguishing_aspect: |
          On InjuryCase: a CLOSED case can transition back to OPEN via reopen, forming a cycle distinct
          from DrugScreen's; a fresh WorkStatus chain is then admissible from the reopened OPEN state.
        test_recipe:
          setup:
            - "Employer ACTIVE; worker; INJURY encounter checked in; injury case OPEN."
            - "A FULL_DUTY work-status closes the case (OPEN -> CLOSED)."
          setup_api_calls:
            - call: "POST /clinic/employers"
              payload: { legal_name: "Zeta", mro_user_id: "mro-1" }
              as: ClinicAdmin
              captures: { emp_id: $.data.id, emp_v0: $.data.version }
            - call: "POST /clinic/protocols"
              payload: { employer_id: "${emp_id}", effective_date: "2026-01-01", panels: [ { panel_code: "PHYSICAL", required_for_job_category: "OP", price_cents: 9000, recheck_interval_days: 0 } ] }
              as: ClinicAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /clinic/protocols/${p1_id}/activate"
              payload: { expected_employer_version: "${emp_v0}" }
              as: ClinicAdmin
            - call: "POST /clinic/workers"
              payload: { employer_id: "${emp_id}", full_name: "Ian Injured", job_category: "OP", dob: "1988-08-08" }
              as: ClinicAdmin
              captures: { wkr_id: $.data.id }
            - call: "POST /clinic/encounters"
              payload: { employer_id: "${emp_id}", worker_id: "${wkr_id}", encounter_type: "INJURY" }
              as: Clinician
              as_user_id: "clin-1"
              captures: { enc_id: $.data.id }
            - call: "POST /clinic/encounters/${enc_id}/check-in"
              payload: {}
              as: Clinician
              as_user_id: "clin-1"
            - call: "POST /clinic/injury-cases"
              payload: { encounter_id: "${enc_id}", injury_date: "2026-01-02", treatment_level: "MEDICAL_TREATMENT", days_away: 0, days_restricted: 0 }
              as: Clinician
              as_user_id: "clin-1"
              captures: { ic_id: $.data.id }
            - call: "POST /clinic/work-statuses"
              payload: { injury_case_id: "${ic_id}", disposition: "FULL_DUTY", valid_from: "2026-01-10", valid_to: "2026-01-10" }
              as: Clinician
              as_user_id: "clin-1"
          trigger:
            - call: "POST /clinic/injury-cases/${ic_id}/reopen"
              payload: {}
              as: Clinician
              as_user_id: "clin-1"
              captures: { st: $.data.status }
          assert:
            - "InjuryCase.${ic_id}.status == OPEN"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: void_rescinds_clearance_reverts_hire_status
        grounds:
          - state_machines.Encounter.COMPLETED_to_VOIDED
          - state_machines.Clearance.ISSUED_to_RESCINDED
          - entities.Worker.fields.hire_status
          - entities.Clearance.fields.status
        distinguishing_aspect: |
          Depth-3 chain from a single trigger: void (A) -> Clearance RESCINDED (B, caused by A) ->
          Worker.hire_status reverts CLEARED->CANDIDATE (C, caused by B's rescission). Each hop is caused
          by the previous, not directly by void.
        test_recipe:
          setup:
            - "Employer ACTIVE; worker; PHYSICAL encounter checked in; FIT clearance issued; encounter COMPLETED -> Worker.hire_status CLEARED."
            - "The encounter is not billed (no invoice)."
          setup_api_calls:
            - call: "POST /clinic/employers"
              payload: { legal_name: "Eta", mro_user_id: "mro-1" }
              as: ClinicAdmin
              captures: { emp_id: $.data.id, emp_v0: $.data.version }
            - call: "POST /clinic/protocols"
