# =============================================================================
# §1.6 Error Code Catalog (30 codes)
# =============================================================================
errors:

  - { id: ERR_UNAUTHENTICATED,          http: 401, condition: "Missing or invalid X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN,                http: 403, condition: "Role not permitted for this endpoint per RBAC" }
  - { id: ERR_NOT_FOUND,                http: 404, condition: "Path or body FK references a non-existent resource" }
  - { id: ERR_INVALID_REQUEST,          http: 400, condition: "Missing required field, malformed value, enum out of range" }
  - { id: ERR_INVALID_STATE,            http: 409, condition: "Target resource not in a state that permits the requested transition" }
  - { id: ERR_STALE_VERSION,            http: 412, condition: "expected_film_version does not match current Film.version (OCC)" }
  - { id: ERR_DUTY_SEPARATION_VIOLATION, http: 403, condition: "Same user cannot create and accept the same offer, or create and submit the same campaign" }

  - { id: ERR_OFFER_EXPIRED,            http: 410, condition: "Offer expiry_at has passed relative to the logical clock" }
  - { id: ERR_OFFER_ALREADY_TERMINAL,   http: 409, condition: "Offer is in a terminal state (ACCEPTED, REJECTED, WITHDRAWN, EXPIRED)" }
  - { id: ERR_DEAL_ALREADY_EXISTS,      http: 409, condition: "An EXECUTED or IN_RELEASE AcquisitionDeal already exists for this film" }
  - { id: ERR_NO_OPEN_OFFERS_TO_PASS,   http: 409, condition: "Cannot pass while an OPEN offer exists" }
  - { id: ERR_WINDOW_NOT_AVAILABLE,     http: 422, condition: "HOME_ENT window requested for territory where is_home_ent_eligible is false" }
  - { id: ERR_TERRITORY_UNKNOWN,        http: 422, condition: "requested_territory_codes includes an unregistered territory code" }

  - { id: ERR_FILM_NOT_ACQUIRED,        http: 409, condition: "Operation requires Film.acquisition_status == ACQUIRED" }
  - { id: ERR_PREMIERE_REQUIRED,        http: 409, condition: "Operation requires at least one BOOKED PremiereSlot for the film" }
  - { id: ERR_OPEN_BEFORE_PREMIERE,     http: 422, condition: "ReleasePlan.opening_weekend_date precedes earliest BOOKED slot's screening_starts_at" }
  - { id: ERR_SLOT_NOT_HELD,            http: 409, condition: "Slot must be HELD before booking" }
  - { id: ERR_SLOT_ALREADY_BOOKED,      http: 409, condition: "Slot already BOOKED or CANCELLED" }
  - { id: ERR_FILM_DOUBLE_BOOKED,       http: 409, condition: "Another BOOKED slot on the same film overlaps the requested screening interval" }
  - { id: ERR_VENUE_OVERLAP,            http: 409, condition: "Another BOOKED slot at the same festival overlaps the requested screening interval" }
  - { id: ERR_INVALID_WINDOW,           http: 422, condition: "End before start, embargo before screening end, or offer expiry in the past" }
  - { id: ERR_EMBARGO_TOO_LONG,         http: 422, condition: "Embargo delay exceeds 168 hours (1 week) — embargo window sanity cap" }

  - { id: ERR_CAMPAIGN_BUDGET_EXCEEDED, http: 402, condition: "Adding spend would exceed AwardsCampaign.budget_total_cents" }
  - { id: ERR_CATEGORY_NOT_TARGETED,    http: 422, condition: "CampaignSpend.target_category not in campaign.target_categories" }
  - { id: ERR_CAMPAIGN_NOT_ACTIVE,      http: 409, condition: "Spend requires campaign status ACTIVE" }
  - { id: ERR_OBLIGATIONS_OUTSTANDING,  http: 409, condition: "Campaign submit blocked: some TalentObligation still in REQUESTED or CONFIRMED" }
  - { id: ERR_CAMPAIGN_ALREADY_ACTIVE,  http: 409, condition: "Activate from non-PLANNING state" }

  - { id: ERR_TALENT_NOT_ON_FILM,       http: 422, condition: "talent_name not in Film.principal_cast and != Film.director_name" }
  - { id: ERR_WINDOW_CONFLICT,          http: 409, condition: "Half-open interval overlap with another CONFIRMED obligation for the same talent" }
  - { id: ERR_TRAVEL_BUFFER_VIOLATION,  http: 422, condition: "Same-city CONFIRMED obligations with 0 < gap_hours < TRAVEL_BUFFER_HOURS" }
  - { id: ERR_FULFILL_TOO_EARLY,        http: 409, condition: "Cannot fulfill before obligation window_ends_at (per logical clock)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:

  - name: PlatformAdmin
    description: "Back-office operator; manages reference data (films, festivals, territories) and the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /films"
      - "POST /territories"
      - "POST /festivals"
    shared_operations:
      - "GET on any resource"

  - name: AcquisitionExec
    description: "Acquires films — issues, counters, accepts, rejects, withdraws offers"
    identity: "opaque"
    exclusive_operations:
      - "POST /films/{film_id}/offers"
      - "POST /films/{film_id}/offers/{offer_id}/counter"
