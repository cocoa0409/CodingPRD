scenario: "Residential Trash & Recycling Account: service plan & cart size, pickup-day schedule, extra/bulk pickup, missed-pickup credit, billing & autopay, start/stop/transfer on move, holiday schedule shift, contamination notice"
domain_name: residential-trash-recycling-account
api_prefix: /

complexity_profile:
  primary_archetype: Ledger reconciliation
  secondary_archetype: Temporal windowing
  complexity_layers:
    - Dual-variant calculation
    - Cascading side effects
    - Rate / threshold triggers
    - Derived field reconciliation
    - Optimistic concurrency
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: peer_roles
  consistency_model: immediate

# ---------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — verbatim)
# ---------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: ServicePlan
    parent: null
    common_fields: true
    fields:
      - name: tier
        type: enum
        source: input
        description: "Plan tier name."
        constraints: "one of {BASIC, STANDARD, PREMIUM}; unique among non-archived plans"
      - name: trash_cart_size_gallons
        type: integer
        source: input
        description: "Trash cart size this plan provisions."
        constraints: "one of {35, 65, 96}"
      - name: recycling_cart_size_gallons
        type: integer
        source: input
        description: "Recycling cart size this plan provisions."
        constraints: "one of {35, 65, 96}"
      - name: monthly_base_cents
        type: integer
        source: input
        description: "Base monthly service charge in cents."
        constraints: ">= 0"
      - name: extra_cart_monthly_cents
        type: integer
        source: input
        description: "Per-extra-cart monthly surcharge in cents (carts beyond the two the plan provisions)."
        constraints: ">= 0"
      - name: extra_pickup_base_cents
        type: integer
        source: input
        description: "Flat charge for an on-request extra/bulk pickup before per-item bulk fees."
        constraints: ">= 0"
      - name: bulk_item_cents
        type: integer
        source: input
        description: "Per-item charge for bulk items on an extra pickup."
        constraints: ">= 0"
      - name: archived
        type: boolean
        source: system
        description: "Soft-delete flag; archived plans excluded from default plan lists and cannot be newly assigned."
        default: false
  - name: ServiceAccount
    parent: null
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: "FK -> ServicePlan.id; the plan governing this account's rates and provisioned cart sizes."
      - name: zone_id
        type: string
        source: input
        description: "FK -> CollectionZone.id; the collection zone whose base pickup weekday and holiday calendar drive this account's schedule."
      - name: service_address
        type: string
        source: input
        description: "Street address served by this account."
        constraints: "non-empty; unique among accounts whose status IN {PENDING_START, ACTIVE, SUSPENDED}"
      - name: holder_name
        type: string
        source: input
        description: "Name of the account holder (resident)."
      - name: status
        type: enum
        source: system
        description: "Service lifecycle dimension."
        default: PENDING_START
        constraints: "one of {PENDING_START, ACTIVE, SUSPENDED, STOPPED, TRANSFERRED_OUT}"
      - name: billing_status
        type: enum
        source: system
        description: "Billing dimension, independent of service lifecycle."
        default: CURRENT
        constraints: "one of {CURRENT, PAST_DUE, IN_COLLECTIONS}"
      - name: autopay_enabled
        type: boolean
        source: system
        description: "Whether invoices auto-charge the stored payment method on their due date."
        default: false
      - name: stored_payment_token
        type: string
        source: system
        description: "Opaque tokenized payment method; null until a method is added."
        default: null
      - name: account_balance_cents
        type: integer
        source: computed
        description: "Derived: sum of OPEN/PAST_DUE Invoice.amount_due_cents minus unapplied credit balance; see §1.3 account_balance."
      - name: credit_balance_cents
        type: integer
        source: computed
        description: "Derived: total MissedPickupCredit.amount_cents in state ISSUED not yet APPLIED to an invoice."
      - name: service_start_date
        type: datetime
        source: system
        description: "Date service became ACTIVE (set when start is activated)."
        default: null
      - name: transferred_from_account_id
        type: string
        source: input
        description: "FK -> ServiceAccount.id; set on an account created via transfer, points at the prior (TRANSFERRED_OUT) account at the old address; null for fresh starts."
        default: null
  - name: CollectionZone
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Zone label, e.g. 'North Route 12'."
      - name: base_pickup_weekday
        type: integer
        source: input
        description: "Normal pickup weekday for this zone; 0=Monday .. 6=Sunday."
        constraints: "0..6"
      - name: recycling_week_parity
        type: enum
        source: input
        description: "Which alternating weeks recycling is collected (every-other-week)."
        constraints: "one of {EVEN, ODD}; parity computed on ISO week number"
  - name: Holiday
    parent: null
    common_fields: false
    fields:
      - name: zone_id
        type: string
        source: input
        description: "FK -> CollectionZone.id; the zone whose calendar this holiday belongs to."
      - name: holiday_date
        type: datetime
        source: input
        description: "Observed holiday date (UTC midnight)."
        constraints: "unique per (zone_id, holiday_date)"
      - name: shift_direction
        type: enum
        source: input
        description: "Whether pickups on/after the holiday in that week slip later or are pulled earlier."
        constraints: "one of {DELAY_ONE_DAY, NONE}"
  - name: CartAssignment
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> ServiceAccount.id; the account this cart belongs to."
      - name: cart_type
        type: enum
        source: input
        description: "Stream the cart serves."
        constraints: "one of {TRASH, RECYCLING}"
      - name: size_gallons
        type: integer
        source: input
        description: "Cart size."
        constraints: "one of {35, 65, 96}"
      - name: is_extra
        type: boolean
        source: computed
        description: "Derived: true when this cart is beyond the one TRASH + one RECYCLING the plan provisions; drives extra_cart_monthly_cents surcharge."
      - name: status
        type: enum
        source: system
        description: "Cart lifecycle."
        default: ACTIVE
        constraints: "one of {ACTIVE, REMOVED}"
  - name: PickupSchedule
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> ServiceAccount.id; account this schedule entry serves."
      - name: service_date
        type: datetime
        source: input
        description: "Calendar date a pickup is planned (UTC midnight), before any holiday shift."
      - name: stream
        type: enum
        source: input
        description: "Which stream is collected on this date."
        constraints: "one of {TRASH, RECYCLING}"
      - name: effective_pickup_date
        type: datetime
        source: computed
        description: "Derived: service_date shifted by the zone's holiday rule; see §1.3 holiday_shift."
      - name: status
        type: enum
        source: system
        description: "Schedule entry lifecycle."
        default: PLANNED
        constraints: "one of {PLANNED, COMPLETED, MISSED, CANCELLED}"
  - name: PickupEvent
    parent: null
    common_fields: true
    fields:
      - name: schedule_id
        type: string
        source: input
        description: "FK -> PickupSchedule.id; the planned pickup this event reports against."
      - name: outcome
        type: enum
        source: input
        description: "What happened at the curb."
        constraints: "one of {COLLECTED, MISSED, CONTAMINATED}"
      - name: reported_at
        type: datetime
        source: input
        description: "When the crew reported the outcome (UTC)."
  - name: ExtraPickupRequest
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> ServiceAccount.id; account requesting the extra/bulk pickup."
      - name: requested_date
        type: datetime
        source: input
        description: "Requested service date (UTC midnight) for the extra pickup."
      - name: bulk_item_count
        type: integer
        source: input
        description: "Number of bulk items in this request."
        constraints: ">= 0"
      - name: charge_cents
        type: integer
        source: computed
        description: "Derived at scheduling: extra_pickup_base_cents + bulk_item_count * bulk_item_cents; see §1.3 extra_pickup_charge."
      - name: status
        type: enum
        source: system
        description: "Request lifecycle."
        default: REQUESTED
        constraints: "one of {REQUESTED, SCHEDULED, COMPLETED, CANCELLED}"
  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> ServiceAccount.id; account billed by this invoice."
      - name: period_start
        type: datetime
        source: input
        description: "Inclusive start of the billing period (UTC midnight)."
      - name: period_end
        type: datetime
        source: input
        description: "Exclusive end of the billing period (UTC midnight)."
      - name: gross_amount_cents
        type: integer
        source: computed
        description: "Derived: base + extra-cart surcharge + scheduled extra-pickup charges for the period; see §1.3 invoice_gross."
      - name: credit_applied_cents
        type: integer
        source: computed
        description: "Derived: missed-pickup credit consumed by this invoice; see §1.3 invoice_gross."
      - name: amount_due_cents
        type: integer
        source: computed
        description: "Derived: max(0, gross_amount_cents - credit_applied_cents)."
      - name: due_date
        type: datetime
        source: input
        description: "Date payment is due (UTC midnight)."
      - name: status
        type: enum
        source: system
        description: "Invoice lifecycle."
        default: OPEN
        constraints: "one of {OPEN, PAID, PAST_DUE, VOID}"
  - name: Payment
    parent: null
    common_fields: true
    fields:
      - name: invoice_id
        type: string
        source: input
        description: "FK -> Invoice.id; the invoice this payment settles."
      - name: amount_cents
        type: integer
        source: input
        description: "Payment amount in cents."
        constraints: "> 0"
      - name: method
        type: enum
        source: input
        description: "How the payment was made."
        constraints: "one of {MANUAL, AUTOPAY}"
      - name: status
        type: enum
        source: system
        description: "Payment lifecycle; payments are append-only and always settle on creation."
        default: APPLIED
        constraints: "one of {APPLIED}"
  - name: MissedPickupCredit
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> ServiceAccount.id; account receiving the credit."
      - name: pickup_event_id
        type: string
        source: input
        description: "FK -> PickupEvent.id; the MISSED event that originated this credit."
      - name: amount_cents
        type: integer
        source: computed
        description: "Derived: per-stream credit at issuance; see §1.3 missed_credit."
      - name: applied_invoice_id
        type: string
        source: system
        description: "FK -> Invoice.id; the invoice that consumed this credit, null while ISSUED."
        default: null
      - name: status
        type: enum
        source: system
        description: "Credit lifecycle."
        default: ISSUED
        constraints: "one of {ISSUED, APPLIED, EXPIRED}"
  - name: ContaminationNotice
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> ServiceAccount.id; account whose recycling was contaminated."
      - name: pickup_event_id
        type: string
        source: input
        description: "FK -> PickupEvent.id; the CONTAMINATED event that raised this notice."
      - name: severity
        type: enum
        source: input
        description: "Contamination severity reported by the crew."
        constraints: "one of {MINOR, MAJOR}"
      - name: fee_cents
        type: integer
        source: computed
        description: "Derived contamination fee at issuance; see §1.3 contamination_fee."
      - name: status
        type: enum
        source: system
        description: "Notice lifecycle."
        default: OPEN
        constraints: "one of {OPEN, ACKNOWLEDGED, WAIVED}"

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: ServiceAccount
    initial_state: PENDING_START
    terminal_states: [STOPPED, TRANSFERRED_OUT]
    note: |
      Parallel dimensions: `status` (service lifecycle, below) evolves
      independently of `billing_status` (CURRENT/PAST_DUE/IN_COLLECTIONS, in the
      separate machine on this same entity). A STOPPED account can still be
      PAST_DUE; an ACTIVE account can be IN_COLLECTIONS.
    transitions:
      - from: PENDING_START
        to: ACTIVE
        trigger: "POST /accounts/{id}/activate-start"
        actor: Dispatcher
        preconditions:
          - "account.status == PENDING_START"
          - "account.plan.archived == false"
          - "account has >= 1 ACTIVE CartAssignment of cart_type TRASH AND >= 1 of cart_type RECYCLING"
        side_effects:
          - "set service_start_date = clock date"
          - "generate the first PickupSchedule rows for the next 28 days from zone.base_pickup_weekday and zone.recycling_week_parity"
          - "increments ServiceAccount.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /accounts/{id}/suspend"
        actor: Dispatcher
        preconditions:
          - "account.status == ACTIVE"
        side_effects:
          - "cancel all PLANNED PickupSchedule rows with effective_pickup_date >= clock date (set status CANCELLED)"
          - "increments ServiceAccount.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /accounts/{id}/resume"
        actor: Dispatcher
        preconditions:
          - "account.status == SUSPENDED"
        side_effects:
          - "regenerate PLANNED PickupSchedule rows for the next 28 days"
          - "increments ServiceAccount.version by 1"
      - from: ACTIVE
        to: STOPPED
        trigger: "POST /accounts/{id}/stop"
        actor: Dispatcher
        preconditions:
          - "account.status == ACTIVE"
        side_effects:
          - "cancel all PLANNED PickupSchedule rows (status CANCELLED)"
          - "mark all ACTIVE CartAssignment rows REMOVED"
          - "cascade: expire all ISSUED MissedPickupCredit (status EXPIRED) — credit is forfeited on stop"
          - "increments ServiceAccount.version by 1"
      - from: SUSPENDED
        to: STOPPED
        trigger: "POST /accounts/{id}/stop"
        actor: Dispatcher
        preconditions:
          - "account.status == SUSPENDED"
        side_effects:
          - "mark all ACTIVE CartAssignment rows REMOVED"
          - "cascade: expire all ISSUED MissedPickupCredit (status EXPIRED)"
          - "increments ServiceAccount.version by 1"
      - from: ACTIVE
        to: TRANSFERRED_OUT
        trigger: "POST /accounts/{id}/transfer-out (creates a new ServiceAccount at the destination address)"
        actor: Dispatcher
        preconditions:
          - "account.status == ACTIVE"
          - "destination plan referenced in body is not archived"
        side_effects:
          - "create a new ServiceAccount in PENDING_START with transferred_from_account_id = this account.id, copying plan_id and autopay_enabled and stored_payment_token"
          - "cascade: transfer all ISSUED MissedPickupCredit to the new account (re-point account_id; credit survives the move, unlike a stop)"
          - "cancel all PLANNED PickupSchedule rows on this account (status CANCELLED)"
          - "mark all ACTIVE CartAssignment rows REMOVED"
          - "increments ServiceAccount.version by 1"
  - entity: ServiceAccount
    initial_state: CURRENT
    terminal_states: []
    note: "Billing dimension (`billing_status`), parallel to the service `status` machine above on the same row."
    transitions:
      - from: CURRENT
        to: PAST_DUE
        trigger: "system: invoice passes due_date unpaid (evaluated on POST /_clock/set_current_utc)"
        actor: system
        preconditions:
          - "an Invoice on this account has status OPEN and due_date < clock date"
        side_effects:
          - "set the invoice status PAST_DUE"
          - "increments ServiceAccount.version by 1"
      - from: PAST_DUE
        to: CURRENT
        trigger: "system: all PAST_DUE invoices on the account settle (POST /invoices/{id}/pay or autopay)"
        actor: system
        preconditions:
          - "no Invoice on this account has status OPEN or PAST_DUE"
        side_effects:
          - "increments ServiceAccount.version by 1"
      - from: PAST_DUE
        to: IN_COLLECTIONS
        trigger: "system: an invoice remains PAST_DUE > 60 days (evaluated on POST /_clock/set_current_utc)"
        actor: system
        preconditions:
          - "an Invoice on this account has status PAST_DUE and clock date - due_date > 60 days"
        side_effects:
          - "increments ServiceAccount.version by 1"
      - from: IN_COLLECTIONS
        to: CURRENT
        trigger: "system: all invoices settle"
        actor: system
        preconditions:
          - "no Invoice on this account has status OPEN or PAST_DUE"
        side_effects:
          - "increments ServiceAccount.version by 1"
  - entity: ExtraPickupRequest
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: SCHEDULED
        trigger: "POST /extra-pickups/{id}/schedule"
        actor: Dispatcher
        preconditions:
          - "request.status == REQUESTED"
          - "the parent ServiceAccount.status == ACTIVE"
          - "no other ExtraPickupRequest on the same account in status SCHEDULED has the same requested_date (no double-booking the same calendar day)"
        side_effects:
          - "compute charge_cents per §1.3 extra_pickup_charge and freeze it"
          - "create a PickupSchedule row (stream TRASH) for requested_date in status PLANNED flagged as extra"
          - "increments ExtraPickupRequest.version by 1"
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /extra-pickups/{id}/complete"
        actor: CrewLead
        preconditions:
          - "request.status == SCHEDULED"
        side_effects:
          - "increments ExtraPickupRequest.version by 1"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /extra-pickups/{id}/cancel"
        actor: Dispatcher
        preconditions:
          - "request.status == REQUESTED"
        side_effects:
          - "increments ExtraPickupRequest.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /extra-pickups/{id}/cancel"
        actor: Dispatcher
        preconditions:
          - "request.status == SCHEDULED"
        side_effects:
          - "cancel the linked PickupSchedule row (status CANCELLED)"
          - "set charge_cents = 0 (charge reversed on cancel)"
          - "increments ExtraPickupRequest.version by 1"
  - entity: PickupSchedule
    initial_state: PLANNED
    terminal_states: [COMPLETED, MISSED, CANCELLED]
    transitions:
      - from: PLANNED
        to: COMPLETED
        trigger: "POST /pickup-schedules/{id}/events (outcome COLLECTED)"
        actor: CrewLead
        preconditions:
          - "schedule.status == PLANNED"
          - "the parent ServiceAccount.status == ACTIVE"
        side_effects:
          - "create a PickupEvent (outcome COLLECTED)"
          - "increments PickupSchedule.version by 1"
      - from: PLANNED
        to: MISSED
        trigger: "POST /pickup-schedules/{id}/events (outcome MISSED)"
        actor: CrewLead
        preconditions:
          - "schedule.status == PLANNED"
          - "the parent ServiceAccount.status == ACTIVE"
        side_effects:
          - "create a PickupEvent (outcome MISSED)"
          - "cascade: issue a MissedPickupCredit (status ISSUED) with amount per §1.3 missed_credit; that issuance itself raises the account's credit_balance_cents and re-derives account_balance_cents"
          - "increments PickupSchedule.version by 1"
      - from: PLANNED
        to: COMPLETED
        trigger: "POST /pickup-schedules/{id}/events (outcome CONTAMINATED) — recycling only"
        actor: CrewLead
        preconditions:
          - "schedule.status == PLANNED"
          - "schedule.stream == RECYCLING"
          - "the parent ServiceAccount.status == ACTIVE"
        side_effects:
          - "create a PickupEvent (outcome CONTAMINATED); the recycling is still collected so the schedule completes"
          - "cascade: open a ContaminationNotice (status OPEN) with fee per §1.3 contamination_fee; the notice's fee posts to the account's next invoice gross"
          - "increments PickupSchedule.version by 1"
  - entity: ContaminationNotice
    initial_state: OPEN
    terminal_states: [WAIVED]
    transitions:
      - from: OPEN
        to: ACKNOWLEDGED
        trigger: "POST /contamination-notices/{id}/acknowledge"
        actor: AccountHolder
        preconditions:
          - "notice.status == OPEN"
        side_effects:
          - "increments ContaminationNotice.version by 1"
      - from: OPEN
        to: WAIVED
        trigger: "POST /contamination-notices/{id}/waive"
        actor: Dispatcher
        preconditions:
          - "notice.status == OPEN"
        side_effects:
          - "set fee_cents = 0 (fee waived; reverses the posting to the next invoice gross)"
          - "increments ContaminationNotice.version by 1"
      - from: ACKNOWLEDGED
        to: WAIVED
        trigger: "POST /contamination-notices/{id}/waive"
        actor: Dispatcher
        preconditions:
          - "notice.status == ACKNOWLEDGED"
        side_effects:
          - "set fee_cents = 0 (fee waived)"
          - "increments ContaminationNotice.version by 1"
  - entity: Invoice
    initial_state: OPEN
    terminal_states: [PAID, VOID]
    transitions:
      - from: OPEN
        to: PAID
        trigger: "POST /invoices/{id}/pay"
        actor: AccountHolder
        preconditions:
          - "invoice.status == OPEN"
          - "payment amount_cents == invoice.amount_due_cents (exact settlement only)"
        side_effects:
          - "create a Payment (status APPLIED)"
          - "cascade: if this was the last OPEN/PAST_DUE invoice, account.billing_status returns to CURRENT"
          - "increments Invoice.version by 1"
      - from: PAST_DUE
        to: PAID
        trigger: "POST /invoices/{id}/pay"
        actor: AccountHolder
        preconditions:
          - "invoice.status == PAST_DUE"
          - "payment amount_cents == invoice.amount_due_cents"
        side_effects:
          - "create a Payment (status APPLIED)"
          - "cascade: re-evaluate account.billing_status (PAST_DUE/IN_COLLECTIONS -> CURRENT when no open/past-due invoices remain)"
          - "increments Invoice.version by 1"
      - from: OPEN
        to: VOID
        trigger: "POST /invoices/{id}/void"
        actor: Dispatcher
        preconditions:
          - "invoice.status == OPEN"
        side_effects:
          - "cascade: restore any MissedPickupCredit this invoice consumed back to ISSUED (re-point applied_invoice_id to null) so credit_balance_cents is conserved"
          - "increments Invoice.version by 1"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: invoice-generate-stale-account
    parent_entity: ServiceAccount
    write_endpoint: "POST /accounts/{id}/invoices"
    occ_field: "expected_account_version"
    description: |
      Generating a new billing-period Invoice against a ServiceAccount whose
      version has advanced since the client last observed it is rejected. A new
      invoice legitimately supersedes the client's costing assumptions (a credit
      issuance, contamination posting, or cart change between the read and this
      write all bump the account version and change the gross), so the stale
      view must be refused rather than silently billing an outdated amount.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: transfer-out-stale-account
    parent_entity: ServiceAccount
    write_endpoint: "POST /accounts/{id}/transfer-out"
    occ_field: "expected_account_version"
    description: |
      Transferring service out of a ServiceAccount whose version has advanced
      since the client last observed it is rejected. The transfer migrates
      ISSUED credits and cancels the schedule; if the account state shifted
      (credit issued, suspended, invoice generated) since the read, the client's
      transfer plan is stale and must be refused.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: invoice_gross
    trigger: "POST /accounts/{id}/invoices (period invoice generation)"
    algorithm: aggregation
    formula: |
      # Forward-looking period bill. Evaluation order is PINNED:
      #   1) base       = plan.monthly_base_cents
      #   2) extra_cart = (count of ACTIVE CartAssignment on account) minus 2, floored at 0,
      #                    times plan.extra_cart_monthly_cents
      #                    (the 2 provisioned carts = one TRASH + one RECYCLING)
      #   3) extras     = sum of ExtraPickupRequest.charge_cents for requests whose
      #                    status IN {SCHEDULED, COMPLETED} and requested_date in [period_start, period_end)
      #   4) contam     = sum of ContaminationNotice.fee_cents for notices whose
      #                    status IN {OPEN, ACKNOWLEDGED} linked (via PickupEvent->PickupSchedule)
      #                    to a service_date in [period_start, period_end)
      #   gross_amount_cents = base + extra_cart + extras + contam
      #
      # Credit application is computed AFTER gross, then frozen on the invoice:
      #   credit_applied_cents = min(gross_amount_cents, account.credit_balance_cents)
      #     consume ISSUED MissedPickupCredit oldest-first by created_at ASC
      #     (tie-break created_at ASC then... credits never tie on created_at in practice;
      #      if equal created_at, lower amount_cents first) until credit_applied_cents reached
      #   amount_due_cents = max(0, gross_amount_cents - credit_applied_cents)
    input_set: "ACTIVE carts; ExtraPickupRequest in {SCHEDULED, COMPLETED} within period; ContaminationNotice in {OPEN, ACKNOWLEDGED} within period; MissedPickupCredit in ISSUED."
    constants:
      PROVISIONED_CART_COUNT: 2
    precision: "integer cents; no rounding needed (all inputs are integer cents)"
    variants:
      - name: provisional_at_generation
        when: "invoice freshly generated and still OPEN"
        difference: "credit_applied_cents reflects ISSUED credit available at generation time; later credits do NOT retro-apply to an already-generated invoice."
      - name: final_at_void_restore
        when: "invoice VOIDed"
        difference: "credit_applied_cents released back to ISSUED, so the same account re-billed for the same period yields a different amount_due if credits or contamination changed in the interim."
  - name: account_balance
    trigger: "read of ServiceAccount.account_balance_cents and credit_balance_cents (computed on every account read and after each mutation)"
    algorithm: aggregation
    formula: |
      credit_balance_cents = sum of MissedPickupCredit.amount_cents
                             for credits on this account with status == ISSUED
      account_balance_cents = sum of Invoice.amount_due_cents
                              for invoices on this account with status IN {OPEN, PAST_DUE}
      # credit_balance is NOT subtracted from account_balance again here — credit is
      # consumed at invoice generation (invoice_gross), so double-counting is avoided.
    input_set: "Invoices in {OPEN, PAST_DUE}; MissedPickupCredit in ISSUED."
    constants: {}
    precision: "integer cents"
  - name: extra_pickup_charge
    trigger: "POST /extra-pickups/{id}/schedule (REQUESTED -> SCHEDULED)"
    algorithm: tiered_pricing
    formula: |
      # ≥3 inputs with conditional branch on bulk_item_count (non-linear interaction):
      base = plan.extra_pickup_base_cents
      if bulk_item_count == 0:
          charge_cents = base                      # plain extra pickup, no bulk surcharge
      elif bulk_item_count <= FREE_BULK_ALLOWANCE:
          charge_cents = base                      # first FREE_BULK_ALLOWANCE items included in base
      else:
          billable = bulk_item_count - FREE_BULK_ALLOWANCE
          charge_cents = base + billable * plan.bulk_item_cents
      # Frozen onto ExtraPickupRequest.charge_cents at SCHEDULED; reset to 0 on cancel.
    input_set: "the requesting account's plan + the request's bulk_item_count at schedule time"
    constants:
      FREE_BULK_ALLOWANCE: 2
    precision: "integer cents"
    variants:
      - name: frozen_at_schedule
        when: "request transitions REQUESTED -> SCHEDULED"
        difference: "charge_cents is the full base+bulk computation and is billed by any invoice_gross whose period covers requested_date."
      - name: reversed_on_cancel
        when: "a SCHEDULED request transitions SCHEDULED -> CANCELLED"
        difference: "same request, same plan inputs, but charge_cents is reset to 0 so the period invoice bills nothing for it — identical inputs, divergent result by context."
  - name: missed_credit
    trigger: "PickupSchedule PLANNED -> MISSED (POST /pickup-schedules/{id}/events outcome MISSED)"
    algorithm: threshold
    formula: |
      # Per-stream credit, with an escalation threshold on repeat misses in a
      # rolling 90-day window (cumulative count, boundary is '>'):
      prior_misses = count of MissedPickupCredit on this account whose
                     status IN {ISSUED, APPLIED} AND originating PickupEvent.reported_at
                     within (clock - 90 days, clock]   # half-open lower, inclusive upper
      base_credit = STREAM_CREDIT[schedule.stream]      # TRASH=300, RECYCLING=200
      if prior_misses > REPEAT_THRESHOLD:               # strictly greater than 2
          amount_cents = base_credit + REPEAT_BONUS_CENTS
      else:
          amount_cents = base_credit
    input_set: "the missed schedule's stream + prior ISSUED/APPLIED credits in the rolling 90-day window"
    constants:
      STREAM_CREDIT: { TRASH: 300, RECYCLING: 200 }
      REPEAT_THRESHOLD: 2
      REPEAT_BONUS_CENTS: 150
    precision: "integer cents"
  - name: contamination_fee
    trigger: "PickupSchedule (RECYCLING) PLANNED -> COMPLETED with outcome CONTAMINATED (opens ContaminationNotice)"
    algorithm: threshold
    formula: |
      # Dual-variant on the SAME notice subject is avoided; this is a distinct
      # entity domain (recycling quality) from missed_credit (service reliability).
      # First contamination in a rolling 365-day window is a warning (fee 0),
      # subsequent ones are charged; MAJOR doubles MINOR:
      prior_contam = count of ContaminationNotice on this account whose
                     status IN {OPEN, ACKNOWLEDGED, WAIVED} created strictly before this one
      if prior_contam == 0:
          fee_cents = 0                          # first notice ever = free warning
      else:
          fee_cents = MINOR_FEE_CENTS if severity == MINOR else MINOR_FEE_CENTS * MAJOR_MULTIPLIER
    input_set: "this notice's severity + count of prior notices on the account"
    constants:
      MINOR_FEE_CENTS: 1500
      MAJOR_MULTIPLIER: 2
    precision: "integer cents"
  - name: holiday_shift
    trigger: "PickupSchedule row generation (activate-start, resume) and read of effective_pickup_date"
    algorithm: interval_merge
    formula: |
      # Map each PLANNED PickupSchedule.service_date to an effective_pickup_date
      # using the zone's holiday calendar. Lookup is by exact date match:
      hol = the Holiday on this account's zone whose holiday_date == service_date, if any
      if hol exists and hol.shift_direction == DELAY_ONE_DAY:
          effective_pickup_date = service_date + 1 day
      else:
          effective_pickup_date = service_date    # NONE or no holiday -> unchanged
      # Only the schedule whose service_date lands exactly on the holiday slips;
      # later same-week pickups are NOT cascaded (single-day shift, no ripple).
    input_set: "the schedule's service_date + the zone's Holiday rows"
    constants: {}
    precision: "whole days (UTC midnight)"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a recognized role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the role is permitted for this endpoint per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "every path-referenced resource exists, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path id"
  - priority: 4
    category: existence
    check: "every FK in the request body references an existing resource"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "POST/PUT endpoints carrying FK fields"
  - priority: 5
    category: business_constraint
    check: "request body and query params well-formed: required fields present, enum members valid, integers in declared ranges, pagination limit within [1,100] and offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all
  - priority: 6
    category: state
    check: "OCC: expected_<parent>_version matches the parent's current version on guarded writes"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /accounts/{id}/invoices, POST /accounts/{id}/transfer-out"
  - priority: 7
    category: state
    check: "the target resource is in a state from which the requested transition is defined in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 8
    category: business_referential
    check: "an account cannot be activated unless it has >= 1 ACTIVE TRASH cart AND >= 1 ACTIVE RECYCLING cart"
    error_id: ERR_CARTS_INCOMPLETE
    http_status: 409
    applies_to: "POST /accounts/{id}/activate-start"
  - priority: 9
    category: business_constraint
    check: "a plan cannot be newly assigned (on account create or transfer) if it is archived"
    error_id: ERR_PLAN_ARCHIVED
    http_status: 409
    applies_to: "POST /accounts, POST /accounts/{id}/transfer-out"
  - priority: 10
    category: business_referential
    check: "service_address must be unique among accounts whose status IN {PENDING_START, ACTIVE, SUSPENDED}"
    error_id: ERR_ADDRESS_IN_USE
    http_status: 409
    applies_to: "POST /accounts, POST /accounts/{id}/transfer-out"
  - priority: 11
    category: business_temporal
    check: "an extra-pickup request cannot be scheduled on a requested_date already held by another SCHEDULED ExtraPickupRequest on the same account"
    error_id: ERR_DATE_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /extra-pickups/{id}/schedule"
  - priority: 12
    category: business_temporal
    check: "a PickupEvent's reported_at must be >= the parent schedule's effective_pickup_date (cannot report a pickup before it was due)"
    error_id: ERR_REPORT_TOO_EARLY
    http_status: 409
    applies_to: "POST /pickup-schedules/{id}/events"
  - priority: 13
    category: business_constraint
    check: "a contamination outcome may only be reported on a RECYCLING schedule"
    error_id: ERR_CONTAMINATION_NOT_RECYCLING
    http_status: 409
    applies_to: "POST /pickup-schedules/{id}/events"
  - priority: 14
    category: business_constraint
    check: "autopay cannot be enabled unless the account has a non-null stored_payment_token"
    error_id: ERR_NO_PAYMENT_METHOD
    http_status: 409
    applies_to: "POST /accounts/{id}/autopay"
  - priority: 15
    category: business_fiscal
    check: "a payment's amount_cents must exactly equal the invoice's amount_due_cents"
    error_id: ERR_PAYMENT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /invoices/{id}/pay"

