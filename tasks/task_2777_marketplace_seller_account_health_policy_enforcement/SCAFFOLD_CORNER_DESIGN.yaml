            - call: "POST /violations"
              payload: { seller_id: "${s_id}", policy_rule_id: "${rule_sp}", reporter_type: "PLATFORM_AUTOMATION", evidence_reference: "EV-AGE-0002" }
              as: PolicyInvestigator
