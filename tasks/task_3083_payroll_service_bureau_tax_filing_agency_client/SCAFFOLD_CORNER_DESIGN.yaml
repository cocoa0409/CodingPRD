      - name: c_settlement_timing_weekend_rollover
        claim_type: algorithm_chronological
        grounds: [calculations.settlement_timing, entities.Impound.fields.due_by]
        distinguishing_aspect: "A STANDARD impound initiated Friday 2026-09-04 rolls +2 business days over the weekend to Tuesday 2026-09-08; the Wednesday 2026-09-02 initiation lands Thursday 2026-09-03 — weekend rollover is the only calendar arithmetic applied."
        test_recipe:
          setup: ["Clock set to Friday 2026-09-04T10:00:00Z for the first impound; client ACTIVE."]
          setup_api_calls:
            - *ck_jfed
            - *ck_client
