scenario: "Financial Aid Packaging & Verification (university financial aid office): FAFSA/ISIR import & need calculation, verification selection & document collection with conflicting-information resolution, packaging rules by fund type & priority deadline, professional judgment adjustment documentation, award notification, acceptance & revision, disbursement eligibility (enrollment/SAP) checks, over-award resolution, year-end reconciliation with federal systems"
domain_name: financial-aid-packaging-verification
api_prefix: /api

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - rate_threshold_triggers
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: AidYear
    parent: null
    common_fields: true
    fields:
      - name: year_code
        type: string
        source: input
        description: "Academic-year code, e.g. '2026-2027'. Unique across AidYear."
      - name: coa_in_state_cents
        type: integer
        source: input
        description: "Cost of attendance, in-state students, cents. Must be > 0."
      - name: coa_out_of_state_cents
        type: integer
        source: input
        description: "Cost of attendance, out-of-state students, cents. Must be > coa_in_state_cents."
      - name: priority_deadline
        type: datetime
        source: input
        description: "ISO8601 UTC. ISIRs received on or before this stamp are PRIORITY cohort; after are STANDARD cohort."
      - name: pell_schedule
        type: object
        source: input
        description: "Array of {efc_min, efc_max, award_cents} rows sorted by efc_min ASC, contiguous, covering [0, 999999]. EFC is looked up as the single row whose [efc_min, efc_max] inclusive range contains the EFC."
      - name: verification_tracking_flag_rate
        type: number
        source: input
        description: "Fraction (0 < r <= 1) of imported ISIRs flagged for verification when cps_selection_flag is false. Selection is deterministic: flag when (sha256(student.ssn || '-' || aid_year) mod 10000) < r*10000."
      - name: status
        type: enum
        source: system
        description: "Lifecycle. DRAFT -> OPEN -> PACKAGING_LOCKED -> RECONCILING -> CLOSED."
        constraints: "enum: DRAFT, OPEN, PACKAGING_LOCKED, RECONCILING, CLOSED"
      - name: total_packaged_cents
        type: integer
        source: computed
        description: "Sum over all AwardLine of AwardLine.offered_cents where AwardLine.status IN {OFFERED, ACCEPTED, PARTIALLY_ACCEPTED, DISBURSING, DISBURSED} and line's package belongs to this AidYear. Recomputed on every AwardLine mutation."
      - name: total_disbursed_cents
        type: integer
        source: computed
        description: "Sum over all Disbursement of Disbursement.disbursed_cents where Disbursement.status = POSTED and its AwardLine's package belongs to this AidYear. Recomputed on every Disbursement POSTED/RETURNED transition."

  - name: FundType
    parent: AidYear
    common_fields: true
    fields:
      - name: aid_year_id
        type: string
        source: input
        description: "FK -> AidYear.id; owning aid year."
      - name: fund_code
        type: string
        source: input
        description: "Short code, e.g. PELL, SEOG, SUB, UNSUB, PLUS, INST_GRANT, WORK_STUDY. Unique within the AidYear."
      - name: category
        type: enum
        source: input
        description: "FEDERAL_TITLE_IV (Pell/SEOG/Sub/Unsub/PLUS), INSTITUTIONAL, STATE, EXTERNAL."
        constraints: "enum: FEDERAL_TITLE_IV, INSTITUTIONAL, STATE, EXTERNAL"
      - name: need_based
        type: boolean
        source: input
        description: "When true, the fund's offered amount is constrained by remaining need (COA - EFC - other gift aid). When false, constrained by COA gap only."
      - name: annual_cap_cents
        type: integer
        source: input
        description: "Per-student per-year maximum for this fund. Must be > 0."
      - name: pool_budget_cents
        type: integer
        source: input
        description: "Total fund pool available to all students in this AidYear. Must be >= 0. PELL is exempt from pool exhaustion (treated as entitlement): when fund_code == PELL the pool check is skipped."
      - name: pool_reserved_cents
        type: integer
        source: computed
        description: "Sum of AwardLine.offered_cents for lines of this fund in status IN {OFFERED, ACCEPTED, PARTIALLY_ACCEPTED, DISBURSING, DISBURSED}. Recomputed on every AwardLine transition into or out of that set and on any offered_cents change."
      - name: pool_disbursed_cents
        type: integer
        source: computed
        description: "Sum of Disbursement.disbursed_cents for POSTED disbursements against lines of this fund."
      - name: priority_cohort_only
        type: boolean
        source: input
        description: "When true, only students whose ISIR is PRIORITY cohort may receive this fund."
        default: false
      - name: packaging_rank
        type: integer
        source: input
        description: "Waterfall order: packaging considers funds in ascending packaging_rank. Ties broken by fund_code ASC. Must be unique within the AidYear."
      - name: requires_verification_complete
        type: boolean
        source: input
        description: "When true, this fund may not be offered while the student's VerificationCase.status is not COMPLETED_SATISFIED or NOT_SELECTED."
        default: true
      - name: status
        type: enum
        source: system
        description: "DRAFT -> ACTIVE -> EXHAUSTED -> CLOSED. EXHAUSTED is auto-set when pool_reserved_cents >= pool_budget_cents (only for non-PELL funds)."
        constraints: "enum: DRAFT, ACTIVE, EXHAUSTED, CLOSED"

  - name: Student
    parent: null
    common_fields: true
    fields:
      - name: ssn
        type: string
        source: input
        description: "Nine digits, stored as 'NNNNNNNNN'. Unique across all Students. Used in the deterministic verification-selection hash."
      - name: full_name
        type: string
        source: input
        description: "Student legal name."
      - name: email
        type: string
        source: input
        description: "Notification address. Unique."
      - name: residency
        type: enum
        source: input
        description: "IN_STATE or OUT_OF_STATE; selects the COA figure used in need calculation."
        constraints: "enum: IN_STATE, OUT_OF_STATE"
      - name: dependency_status
        type: enum
        source: input
        description: "DEPENDENT or INDEPENDENT as reported on the FAFSA; drives which household fields the ISIR must carry."
        constraints: "enum: DEPENDENT, INDEPENDENT"
      - name: enrollment_status
        type: enum
        source: input
        description: "FULL_TIME, THREE_QUARTER, HALF_TIME, LESS_THAN_HALF. Gates disbursement: funds with category FEDERAL_TITLE_IV require at least HALF_TIME; institutional funds require at least THREE_QUARTER unless fund rule overrides."
        constraints: "enum: FULL_TIME, THREE_QUARTER, HALF_TIME, LESS_THAN_HALF"
      - name: grade_level
        type: integer
        source: input
        description: "Undergraduate grade level 1-5. Drives Stafford (SUB/UNSUB) annual caps via the stafford_cap schedule constant."
        constraints: "1 <= grade_level <= 5"
      - name: sap_status
        type: enum
        source: system
        description: "Satisfactory Academic Progress evaluation outcome. GOOD_STANDING, WARNING, SUSPENDED, APPEAL_APPROVED. Initially NOT_EVALUATED; set by SAP evaluation endpoint."
        constraints: "enum: NOT_EVALUATED, GOOD_STANDING, WARNING, SUSPENDED, APPEAL_APPROVED"
      - name: cumulative_attempted_credits
        type: integer
        source: input
        description: "Lifetime attempted credits for SAP pace calculation."
        default: 0
      - name: cumulative_completed_credits
        type: integer
        source: input
        description: "Lifetime completed credits for SAP pace calculation. Must be <= cumulative_attempted_credits."
        default: 0
      - name: max_timeframe_credits
        type: integer
        source: input
        description: "Maximum attempted credits allowed for the program (150% of program length). SAP fails when cumulative_attempted_credits > max_timeframe_credits."
        default: 180
      - name: gpa_hundredths
        type: integer
        source: input
        description: "Cumulative GPA * 100 (e.g. 250 == 2.50). SAP qualitative floor is 200."
        default: 0

  - name: ISIRRecord
    parent: Student
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; student this FAFSA transaction belongs to."
      - name: aid_year_id
        type: string
        source: input
        description: "FK -> AidYear.id; aid year of this application."
      - name: transaction_number
        type: integer
        source: input
        description: "ISIR transaction number, starts at 1 and increments per correction. Unique within (student_id, aid_year_id)."
      - name: received_at
        type: datetime
        source: input
        description: "ISO8601 UTC receipt stamp. Determines priority cohort: PRIORITY when received_at <= AidYear.priority_deadline, else STANDARD."
      - name: cohort
        type: enum
        source: computed
        description: "PRIORITY when received_at <= aid year's priority_deadline else STANDARD. Set at import; never recomputed even if priority_deadline later changes."
        constraints: "enum: PRIORITY, STANDARD"
      - name: household_size
        type: integer
        source: input
        description: "Number in household. DEPENDENT students: >= 2; INDEPENDENT: >= 1."
      - name: number_in_college
        type: integer
        source: input
        description: "Household members enrolled in college at least half time. 1 <= number_in_college <= household_size."
      - name: agi_cents
        type: integer
        source: input
        description: "Adjusted gross income, cents. >= 0."
      - name: untaxed_income_cents
        type: integer
        source: input
        description: "Untaxed income, cents. >= 0."
      - name: asset_net_worth_cents
        type: integer
        source: input
        description: "Reported assets, cents. >= 0."
      - name: cps_selection_flag
        type: boolean
        source: input
        description: "Federal CPS pre-selected this record for verification."
        default: false
      - name: efc_provisional_cents
        type: integer
        source: computed
        description: "EFC computed from unverified ISIR data via calculation efc_calculation with variant PROVISIONAL."
      - name: efc_verified_cents
        type: integer
        source: computed
        description: "Null until verification completes; then EFC recomputed via efc_calculation variant VERIFIED using verified data. Null serializes as null."
        default: null
      - name: efc_official_cents
        type: integer
        source: computed
        description: "The EFC used for packaging: efc_verified_cents when the linked VerificationCase is COMPLETED_SATISFIED, else efc_provisional_cents."
      - name: is_current
        type: boolean
        source: system
        description: "Exactly one ISIR per (student_id, aid_year_id) has is_current=true: the one with the highest transaction_number. Importing a new transaction flips the previous current record to false."
        default: true
      - name: verification_selection
        type: enum
        source: computed
        description: "SELECTED when cps_selection_flag is true OR the deterministic hash selects the record; else NOT_SELECTED. Set at import. When SELECTED, a VerificationCase is created in DOCUMENTS_REQUESTED."
        constraints: "enum: SELECTED, NOT_SELECTED"

  - name: VerificationCase
    parent: Student
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; student under verification."
      - name: aid_year_id
        type: string
        source: input
        description: "FK -> AidYear.id; aid year under verification."
      - name: isir_id
        type: string
        source: system
        description: "FK -> ISIRRecord.id; the ISIR transaction this case verifies (the current record at case creation)."
      - name: tracking_group
        type: enum
        source: system
        description: "V1 standard verification group assigned at creation."
        constraints: "enum: V1"
        default: V1
      - name: status
        type: enum
        source: system
        description: "Cyclic machine. DOCUMENTS_REQUESTED -> DOCUMENTS_RECEIVED -> UNDER_REVIEW -> {COMPLETED_SATISFIED, COMPLETED_CORRECTION_SENT} ; COMPLETED_CORRECTION_SENT -> DOCUMENTS_REQUESTED (re-review loop when the corrected ISIR is re-selected); UNDER_REVIEW -> DOCUMENTS_REQUESTED (additional documents requested); any non-terminal state -> WAIVED by Director override."
        constraints: "enum: DOCUMENTS_REQUESTED, DOCUMENTS_RECEIVED, UNDER_REVIEW, COMPLETED_SATISFIED, COMPLETED_CORRECTION_SENT, WAIVED"
      - name: waived_reason
        type: string
        source: input
        description: "Required when status transitions to WAIVED. Null otherwise."
        default: null
      - name: resolution_notes
        type: string
        source: input
        description: "Required when status transitions to COMPLETED_SATISFIED or COMPLETED_CORRECTION_SENT."
        default: null
      - name: completed_at
        type: datetime
        source: system
        description: "Set when entering COMPLETED_SATISFIED or WAIVED; null before."
        default: null

  - name: VerificationDocument
    parent: VerificationCase
    common_fields: true
    fields:
      - name: verification_case_id
        type: string
        source: input
        description: "FK -> VerificationCase.id; owning case."
      - name: doc_type
        type: enum
        source: input
        description: "TAX_RETURN_TRANSCRIPT, W2, HOUSEHOLD_FORM, IDENTITY_STATEMENT, OTHER."
        constraints: "enum: TAX_RETURN_TRANSCRIPT, W2, HOUSEHOLD_FORM, IDENTITY_STATEMENT, OTHER"
      - name: status
        type: enum
        source: system
        description: "REQUESTED -> RECEIVED -> {ACCEPTED, REJECTED}. REJECTED -> REQUESTED via resubmission request."
        constraints: "enum: REQUESTED, RECEIVED, ACCEPTED, REJECTED"
      - name: rejection_reason
        type: string
        source: input
        description: "Required when transitioning to REJECTED; null otherwise."
        default: null
      - name: received_at
        type: datetime
        source: system
        description: "Set on REQUESTED -> RECEIVED; null before."
        default: null

  - name: ConflictingInfoCase
    parent: Student
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; student with conflicting information."
      - name: aid_year_id
        type: string
        source: input
        description: "FK -> AidYear.id; aid year in scope."
      - name: subject_field
        type: string
        source: input
        description: "The ISIR field under dispute, e.g. 'agi_cents', 'household_size', 'dependency_status'."
      - name: claimed_value_cents
        type: integer
        source: input
        description: "Value asserted by the conflicting document or third-party statement, cents when numeric. Null for non-numeric subjects."
        default: null
      - name: status
        type: enum
        source: system
        description: "OPEN -> SUBSTANTIATED -> RESOLVED_REQUIRES_CORRECTION -> RESOLVED (after corrected ISIR imported); OPEN -> UNSUBSTANTIATED -> RESOLVED. Branching fork at OPEN."
        constraints: "enum: OPEN, SUBSTANTIATED, UNSUBSTANTIATED, RESOLVED_REQUIRES_CORRECTION, RESOLVED"
      - name: resolution
        type: string
        source: input
        description: "Required on every transition out of SUBSTANTIATED or UNSUBSTANTIATED; narrative of the determination."
        default: null
      - name: resolved_by_user_id
        type: string
        source: system
        description: "X-User-ID of the AidOfficer who performed the resolving transition. Segregation: may not equal the user who opened the case (opened_by_user_id)."
        default: null
      - name: opened_by_user_id
        type: string
        source: system
        description: "X-User-ID captured at case creation from the calling AidOfficer."

  - name: ProfessionalJudgmentCase
    parent: Student
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; student requesting special-circumstance adjustment."
      - name: aid_year_id
        type: string
        source: input
        description: "FK -> AidYear.id; aid year in scope."
      - name: adjustment_type
        type: enum
        source: input
        description: "EFC_ADJUSTMENT (recompute EFC with adjusted inputs), COA_ADJUSTMENT (raise cost of attendance), DEPENDENCY_OVERRIDE (flip dependency_status)."
        constraints: "enum: EFC_ADJUSTMENT, COA_ADJUSTMENT, DEPENDENCY_OVERRIDE"
      - name: requested_delta_cents
        type: integer
        source: input
        description: "Signed requested adjustment amount. For EFC_ADJUSTMENT must be <= 0 (EFC can only be lowered); for COA_ADJUSTMENT must be > 0; for DEPENDENCY_OVERRIDE must be 0."
      - name: justification
        type: string
        source: input
        description: "Narrative justification, >= 20 characters."
      - name: documentation_complete
        type: boolean
        source: input
        description: "Counselor attestation that supporting documents are on file. APPROVE requires true."
        default: false
      - name: status
        type: enum
        source: system
        description: "SUBMITTED -> UNDER_REVIEW -> {APPROVED, DENIED}. Segregation of duties: the reviewing officer (UNDER_REVIEW setter) may not approve or deny their own review (approver X-User-ID != reviewer X-User-ID)."
        constraints: "enum: SUBMITTED, UNDER_REVIEW, APPROVED, DENIED"
      - name: reviewed_by_user_id
        type: string
        source: system
        description: "X-User-ID captured on SUBMITTED -> UNDER_REVIEW."
        default: null
      - name: decided_by_user_id
        type: string
        source: system
        description: "X-User-ID captured on the APPROVE/DENY transition."
        default: null
      - name: applied_efc_delta_cents
        type: integer
        source: system
        description: "On APPROVED with adjustment_type=EFC_ADJUSTMENT: equals requested_delta_cents and is applied to the student's current ISIR efc_official_cents (floor 0). 0 otherwise."
        default: 0
      - name: applied_coa_delta_cents
        type: integer
        source: system
        description: "On APPROVED with adjustment_type=COA_ADJUSTMENT: equals requested_delta_cents and is added to the student's effective COA for packaging. 0 otherwise."
        default: 0

  - name: AwardPackage
    parent: Student
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; packaged student."
      - name: aid_year_id
        type: string
        source: input
        description: "FK -> AidYear.id; packaged aid year."
      - name: coa_used_cents
        type: integer
        source: computed
        description: "COA snapshot at packaging time: base by residency plus sum of applied_coa_delta_cents over the student's APPROVED PJ cases for this aid year."
      - name: efc_used_cents
        type: integer
        source: computed
        description: "EFC snapshot at packaging time: current ISIR efc_official_cents minus sum of applied_efc_delta_cents over APPROVED PJ cases, floored at 0."
      - name: need_cents
        type: integer
        source: computed
        description: "max(0, coa_used_cents - efc_used_cents). Recomputed whenever the package is (re)built."
      - name: total_offered_cents
        type: integer
        source: computed
        description: "Sum of offered_cents over child AwardLine with status IN {OFFERED, ACCEPTED, PARTIALLY_ACCEPTED, DISBURSING, DISBURSED}."
      - name: total_accepted_cents
        type: integer
        source: computed
        description: "Sum of accepted_cents over child AwardLine with status IN {ACCEPTED, PARTIALLY_ACCEPTED, DISBURSING, DISBURSED}."
      - name: gift_aid_cents
        type: integer
        source: computed
        description: "Sum of offered_cents over child lines whose fund's need_based is true and category is not a loan fund (fund_code NOT IN {SUB, UNSUB, PLUS}); used by the need-based cap in packaging."
      - name: status
        type: enum
        source: system
        description: "DRAFT -> PACKAGED -> NOTIFIED -> {PARTIALLY_ACCEPTED, ACCEPTED, DECLINED} -> LOCKED; NOTIFIED -> REVISION_REQUESTED -> NOTIFIED (revision loop). LOCKED is terminal and gates disbursement creation."
        constraints: "enum: DRAFT, PACKAGED, NOTIFIED, PARTIALLY_ACCEPTED, ACCEPTED, DECLINED, REVISION_REQUESTED, LOCKED"
      - name: needs_repack
        type: boolean
        source: computed
        description: "Set true when a VerificationCase COMPLETED_SATISFIED or PJ APPROVED changes efc_official_cents or COA deltas relative to the frozen snapshots (efc_used_cents / coa_used_cents) while the package is in NOTIFIED, PARTIALLY_ACCEPTED, or ACCEPTED. Cleared when a repack (build re-run via approved revision) executes. Packages with needs_repack == true and status == NOTIFIED keep the old snapshots until repack."
        default: false
      - name: version_locked_at
        type: datetime
        source: system
        description: "Set on entry to LOCKED; null before."
        default: null

  - name: AwardLine
    parent: AwardPackage
    common_fields: true
    fields:
      - name: package_id
        type: string
        source: input
        description: "FK -> AwardPackage.id; owning package."
      - name: fund_type_id
        type: string
        source: input
        description: "FK -> FundType.id; fund of this award."
      - name: offered_cents
        type: integer
        source: computed
        description: "Amount computed by the packaging waterfall; > 0. Recomputed on REPACKAGED lines only (see AwardPackage transitions)."
      - name: accepted_cents
        type: integer
        source: computed
        description: "Amount the student accepted. 0 until acceptance; on PARTIAL acceptance equals the requested amount; on full acceptance equals offered_cents."
        default: 0
      - name: disbursed_cents
        type: integer
        source: computed
        description: "Sum of POSTED Disbursement.disbursed_cents minus RETURNED amounts for this line. Maintained on every Disbursement transition."
        default: 0
      - name: status
        type: enum
        source: system
        description: "OFFERED -> {ACCEPTED, PARTIALLY_ACCEPTED, DECLINED}; {ACCEPTED, PARTIALLY_ACCEPTED} -> DISBURSING -> DISBURSED; DISBURSED -> RETURN_REQUESTED -> RETURNED (R2T4 / over-award reversal). OFFERED -> CANCELLED when verification or PJ voids eligibility."
        constraints: "enum: OFFERED, ACCEPTED, PARTIALLY_ACCEPTED, DECLINED, CANCELLED, DISBURSING, DISBURSED, RETURN_REQUESTED, RETURNED"
      - name: sequence_number
        type: integer
        source: system
        description: "Order of the line within the package waterfall, starting at 1, assigned in ascending FundType.packaging_rank."

  - name: AwardNotification
    parent: AwardPackage
    common_fields: true
    fields:
      - name: package_id
        type: string
        source: input
        description: "FK -> AwardPackage.id; package notified."
      - name: notification_seq
        type: integer
        source: system
        description: "1 for the first notification of this package, increments on each re-notification after revision."
      - name: status
        type: enum
        source: system
        description: "DRAFT -> SENT -> ACKNOWLEDGED. Terminal: ACKNOWLEDGED."
        constraints: "enum: DRAFT, SENT, ACKNOWLEDGED"
      - name: sent_at
        type: datetime
        source: system
        description: "Set on DRAFT -> SENT; null before."
        default: null
      - name: snapshot_total_offered_cents
        type: integer
        source: computed
        description: "Package total_offered_cents frozen at SENT time; used by tests to detect drift between notification and later package mutations."

  - name: RevisionRequest
    parent: AwardPackage
    common_fields: true
    fields:
      - name: package_id
        type: string
        source: input
        description: "FK -> AwardPackage.id; package under revision."
      - name: reason
        type: enum
        source: input
        description: "CHANGE_ENROLLMENT, CHANGE_CIRCUMSTANCE, APPEAL_AMOUNT, DECLINE_LOAN_ONLY."
        constraints: "enum: CHANGE_ENROLLMENT, CHANGE_CIRCUMSTANCE, APPEAL_AMOUNT, DECLINE_LOAN_ONLY"
      - name: requested_by_role
        type: enum
        source: system
        description: "Captured caller role: Student or AidOfficer."
        constraints: "enum: Student, AidOfficer"
      - name: status
        type: enum
        source: system
        description: "Cyclic: SUBMITTED -> UNDER_REVIEW -> {APPROVED, DENIED}; APPROVED triggers a package repack and returns the package to NOTIFIED."
        constraints: "enum: SUBMITTED, UNDER_REVIEW, APPROVED, DENIED"
      - name: decision_notes
        type: string
        source: input
        description: "Required on APPROVED and DENIED transitions."
        default: null

  - name: Disbursement
    parent: AwardLine
    common_fields: true
    fields:
      - name: award_line_id
        type: string
        source: input
        description: "FK -> AwardLine.id; line being disbursed."
      - name: scheduled_cents
        type: integer
        source: input
        description: "Amount scheduled; > 0. Must be <= line's accepted_cents - line's disbursed_cents at creation."
      - name: disbursed_cents
        type: integer
        source: system
        description: "0 until POSTED; then equals scheduled_cents."
        default: 0
      - name: term_code
        type: string
        source: input
        description: "Term the disbursement pays, e.g. '2026-FALL'."
      - name: status
        type: enum
        source: system
        description: "SCHEDULED -> ELIGIBILITY_PASSED -> POSTED; SCHEDULED -> ELIGIBILITY_FAILED -> SCHEDULED (re-check loop after enrollment/SAP fix); POSTED -> RETURN_REQUESTED -> RETURNED."
        constraints: "enum: SCHEDULED, ELIGIBILITY_PASSED, ELIGIBILITY_FAILED, POSTED, RETURN_REQUESTED, RETURNED"
      - name: failure_reasons
        type: array
        source: computed
        description: "Array of failure codes from the last eligibility evaluation, e.g. ['ENROLLMENT_BELOW_HALF_TIME', 'SAP_SUSPENDED']. Empty array when ELIGIBILITY_PASSED."

  - name: OverawardCase
    parent: Student
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; over-awarded student."
      - name: aid_year_id
        type: string
        source: input
        description: "FK -> AidYear.id; aid year in scope."
      - name: detected_total_aid_cents
        type: integer
        source: computed
        description: "Total aid counted at detection: package total_accepted_cents plus external aid reported for the student in this aid year (ExternalAid sum)."
      - name: overage_cents
        type: integer
        source: computed
        description: "detected_total_aid_cents - package.coa_used_cents. Must be > 0 to open."
      - name: status
        type: enum
        source: system
        description: "OPEN -> RESOLVING -> RESOLVED -> VERIFIED. RESOLVING -> OPEN if a reduction is rolled back. Terminal VERIFIED after an AidDirector confirms."
        constraints: "enum: OPEN, RESOLVING, RESOLVED, VERIFIED"
      - name: resolution_plan
        type: array
        source: input
        description: "Ordered list of {award_line_id, reduce_by_cents} steps. Applied in array order; each step reduces the target AwardLine.accepted_cents and may cascade to line/package status."

  - name: ExternalAid
    parent: Student
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; receiving student."
      - name: aid_year_id
        type: string
        source: input
        description: "FK -> AidYear.id; aid year in scope."
      - name: source_name
        type: string
        source: input
        description: "External donor/source label."
      - name: amount_cents
        type: integer
        source: input
        description: "Reported amount, > 0."
      - name: counts_against_coa
        type: boolean
        source: input
        description: "When true, the amount is included in over-award detection's total-aid figure."
        default: true

  - name: ReconciliationRun
    parent: AidYear
    common_fields: true
    fields:
      - name: aid_year_id
        type: string
        source: input
        description: "FK -> AidYear.id; aid year being reconciled."
      - name: run_seq
        type: integer
        source: system
        description: "1 for the first run of the aid year, increments per run."
      - name: status
        type: enum
        source: system
        description: "DRAFT -> IMPORTED -> COMPARED -> {BALANCED, VARIANCE_FOUND}; VARIANCE_FOUND -> ADJUSTED -> BALANCED. Terminal: BALANCED."
        constraints: "enum: DRAFT, IMPORTED, COMPARED, BALANCED, VARIANCE_FOUND, ADJUSTED"
      - name: federal_reported_cents
        type: integer
        source: input
        description: "Total disbursement amount reported by the federal system import, cents. >= 0."
      - name: internal_posted_cents
        type: integer
        source: computed
        description: "Sum of Disbursement.disbursed_cents where status=POSTED and the line's package aid year equals this run's aid year, snapshot taken at COMPARED."
        default: 0
      - name: variance_cents
        type: integer
        source: computed
        description: "federal_reported_cents - internal_posted_cents, computed at COMPARED. Zero routes to BALANCED; non-zero routes to VARIANCE_FOUND."

  - name: ReconciliationAdjustment
    parent: ReconciliationRun
    common_fields: true
    fields:
      - name: reconciliation_run_id
        type: string
        source: input
        description: "FK -> ReconciliationRun.id; owning run."
      - name: award_line_id
        type: string
        source: input
        description: "FK -> AwardLine.id; line whose posted disbursement is adjusted."
      - name: adjust_cents
        type: integer
        source: input
        description: "Signed delta applied to internal books. Non-zero. Positive books additional amount; negative reverses."
      - name: reason_code
        type: enum
        source: input
        description: "FEDERAL_UNDERREPORT, FEDERAL_OVERREPORT, TIMING_DIFFERENCE, DATA_ENTRY_ERROR."
        constraints: "enum: FEDERAL_UNDERREPORT, FEDERAL_OVERREPORT, TIMING_DIFFERENCE, DATA_ENTRY_ERROR"

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: AidYear
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /aid-years/{id}/open"
        actor: AidDirector
        preconditions:
          - "AidYear.status == DRAFT"
          - "AidYear.pell_schedule is non-empty, contiguous, and covers [0, 999999]"
          - "At least one FundType with status ACTIVE exists under this AidYear"
        side_effects:
          - "Increments AidYear.version"
      - from: OPEN
        to: PACKAGING_LOCKED
        trigger: "POST /aid-years/{id}/lock-packaging"
        actor: AidDirector
        preconditions:
          - "AidYear.status == OPEN"
          - "Every AwardPackage under this AidYear has status IN {NOTIFIED, PARTIALLY_ACCEPTED, ACCEPTED, DECLINED, LOCKED} (no DRAFT or PACKAGED or REVISION_REQUESTED packages remain)"
        side_effects:
          - "Increments AidYear.version"
      - from: PACKAGING_LOCKED
        to: RECONCILING
        trigger: "POST /aid-years/{id}/begin-reconciliation"
        actor: AidDirector
        preconditions:
          - "AidYear.status == PACKAGING_LOCKED"
        side_effects:
          - "Creates a ReconciliationRun with run_seq = 1 + max(existing run_seq for the aid year, default 0), status DRAFT"
          - "Increments AidYear.version"
      - from: RECONCILING
        to: CLOSED
        trigger: "POST /aid-years/{id}/close"
        actor: AidDirector
        preconditions:
          - "AidYear.status == RECONCILING"
          - "The latest ReconciliationRun (highest run_seq) for this aid year has status == BALANCED"
        side_effects:
          - "Sets every FundType under the aid year to CLOSED"
          - "Increments AidYear.version"

  - entity: FundType
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /fund-types/{id}/activate"
        actor: AidDirector
        preconditions:
          - "FundType.status == DRAFT"
          - "Parent AidYear.status == DRAFT or OPEN"
        side_effects:
          - "Increments FundType.version and AidYear.version"
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system auto-transition evaluated after every AwardLine mutation that changes pool_reserved_cents"
        actor: system
        preconditions:
          - "FundType.status == ACTIVE"
          - "FundType.fund_code != 'PELL'"
          - "FundType.pool_reserved_cents >= FundType.pool_budget_cents"
        side_effects:
          - "Increments FundType.version"
      - from: EXHAUSTED
        to: ACTIVE
        trigger: "system auto-transition evaluated after every AwardLine mutation that reduces pool_reserved_cents"
        actor: system
        preconditions:
          - "FundType.status == EXHAUSTED"
          - "FundType.pool_reserved_cents < FundType.pool_budget_cents"
        side_effects:
          - "Increments FundType.version"
      - from: ACTIVE
        to: CLOSED
        trigger: "AidYear close cascade"
        actor: system
        preconditions:
          - "Parent AidYear transition RECONCILING -> CLOSED executing"
        side_effects: []
      - from: EXHAUSTED
        to: CLOSED
        trigger: "AidYear close cascade"
        actor: system
        preconditions:
          - "Parent AidYear transition RECONCILING -> CLOSED executing"
        side_effects: []

  - entity: ISIRRecord
    initial_state: IMPORTED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: IMPORTED
        to: CURRENT
        trigger: "system: on import when it is the highest transaction_number for (student_id, aid_year_id)"
        actor: system
        preconditions:
          - "No other ISIRRecord for (student_id, aid_year_id) has a higher transaction_number"
        side_effects:
          - "Sets is_current=true"
          - "Sets cohort by comparing received_at to AidYear.priority_deadline"
          - "Computes verification_selection; when SELECTED creates VerificationCase(DOCUMENTS_REQUESTED) linked to this ISIR"
      - from: CURRENT
        to: SUPERSEDED
        trigger: "system: a new ISIRRecord import with a higher transaction_number for the same (student_id, aid_year_id)"
        actor: system
        preconditions:
          - "Incoming record's transaction_number > this record's transaction_number"
        side_effects:
          - "Sets is_current=false"
          - "If the new record's verification_selection == SELECTED and the student's VerificationCase is COMPLETED_SATISFIED, transitions that VerificationCase back to DOCUMENTS_REQUESTED (re-verification loop)"
          - "Triggers recalculation of efc_official_cents consumers: any AwardPackage in status PACKAGED/NOTIFIED for the student stays as-is until repack, but its efc_used_cents snapshot is unchanged (snapshots are frozen)"

  - entity: VerificationCase
    initial_state: DOCUMENTS_REQUESTED
    terminal_states: [COMPLETED_SATISFIED, WAIVED]
    transitions:
      - from: DOCUMENTS_REQUESTED
        to: DOCUMENTS_RECEIVED
        trigger: "system auto-transition: all required VerificationDocument rows (TAX_RETURN_TRANSCRIPT, W2, HOUSEHOLD_FORM for tracking_group V1) reach status RECEIVED or ACCEPTED"
        actor: system
        preconditions:
          - "Count of required doc types with status IN {RECEIVED, ACCEPTED} equals 3"
        side_effects:
          - "Increments VerificationCase.version"
      - from: DOCUMENTS_RECEIVED
        to: UNDER_REVIEW
        trigger: "POST /verification-cases/{id}/begin-review"
        actor: AidOfficer
        preconditions:
          - "VerificationCase.status == DOCUMENTS_RECEIVED"
        side_effects:
          - "Increments VerificationCase.version"
      - from: UNDER_REVIEW
        to: DOCUMENTS_REQUESTED
        trigger: "POST /verification-cases/{id}/request-documents"
        actor: AidOfficer
        preconditions:
          - "VerificationCase.status == UNDER_REVIEW"
        side_effects:
          - "Creates or resets VerificationDocument rows named in the request to REQUESTED (rejection_reason preserved on rejected ones)"
          - "Increments VerificationCase.version"
      - from: UNDER_REVIEW
        to: COMPLETED_SATISFIED
        trigger: "POST /verification-cases/{id}/complete-satisfied"
        actor: AidOfficer
        preconditions:
          - "VerificationCase.status == UNDER_REVIEW"
          - "All required doc types have status == ACCEPTED"
          - "resolution_notes present in the request (non-empty)"
          - "No ConflictingInfoCase for the same (student_id, aid_year_id) has status IN {OPEN, SUBSTANTIATED, RESOLVED_REQUIRES_CORRECTION}"
        side_effects:
          - "Sets completed_at to now; sets efc_verified_cents on the linked ISIRRecord via efc_calculation variant VERIFIED; sets efc_official_cents = efc_verified_cents"
          - "If verified data changes efc_official_cents relative to the snapshot used by an existing AwardPackage in status NOTIFIED/PARTIALLY_ACCEPTED/ACCEPTED, sets AwardPackage.needs_repack = true (observed via recompute on next packaging action) — packaged lines are NOT auto-changed"
          - "Increments VerificationCase.version"
      - from: UNDER_REVIEW
        to: COMPLETED_CORRECTION_SENT
        trigger: "POST /verification-cases/{id}/complete-correction"
        actor: AidOfficer
        preconditions:
          - "VerificationCase.status == UNDER_REVIEW"
          - "At least one required doc type has status == ACCEPTED"
          - "resolution_notes present in the request"
        side_effects:
          - "Records correction payload; the corrected values will arrive as a new ISIR transaction"
          - "Increments VerificationCase.version"
      - from: COMPLETED_CORRECTION_SENT
        to: DOCUMENTS_REQUESTED
        trigger: "system: a new ISIRRecord import for the same (student_id, aid_year_id) whose verification_selection == SELECTED"
        actor: system
        preconditions:
          - "New ISIR imported and selected"
        side_effects:
          - "Resets required VerificationDocument rows to REQUESTED; clears completed_at"
          - "Increments VerificationCase.version"
      - from: DOCUMENTS_REQUESTED
        to: WAIVED
        trigger: "POST /verification-cases/{id}/waive"
        actor: AidDirector
        preconditions:
          - "VerificationCase.status IN {DOCUMENTS_REQUESTED, DOCUMENTS_RECEIVED, UNDER_REVIEW}"
          - "waived_reason present in the request (non-empty)"
        side_effects:
          - "Sets completed_at; sets linked ISIRRecord.efc_official_cents = efc_provisional_cents (provisional stands)"
          - "Increments VerificationCase.version"
      - from: DOCUMENTS_RECEIVED
        to: WAIVED
        trigger: "POST /verification-cases/{id}/waive"
        actor: AidDirector
        preconditions:
          - "VerificationCase.status IN {DOCUMENTS_REQUESTED, DOCUMENTS_RECEIVED, UNDER_REVIEW}"
          - "waived_reason present in the request (non-empty)"
        side_effects:
          - "Sets completed_at; sets linked ISIRRecord.efc_official_cents = efc_provisional_cents"
          - "Increments VerificationCase.version"
      - from: UNDER_REVIEW
        to: WAIVED
        trigger: "POST /verification-cases/{id}/waive"
        actor: AidDirector
        preconditions:
          - "VerificationCase.status IN {DOCUMENTS_REQUESTED, DOCUMENTS_RECEIVED, UNDER_REVIEW}"
          - "waived_reason present in the request (non-empty)"
        side_effects:
          - "Sets completed_at; sets linked ISIRRecord.efc_official_cents = efc_provisional_cents"
          - "Increments VerificationCase.version"

  - entity: VerificationDocument
    initial_state: REQUESTED
    terminal_states: [ACCEPTED]
    transitions:
      - from: REQUESTED
        to: RECEIVED
        trigger: "POST /verification-documents/{id}/mark-received"
        actor: AidOfficer
        preconditions:
          - "VerificationDocument.status == REQUESTED"
        side_effects:
          - "Sets received_at to now"
          - "Evaluates parent VerificationCase auto-transition to DOCUMENTS_RECEIVED"
      - from: RECEIVED
        to: ACCEPTED
        trigger: "POST /verification-documents/{id}/accept"
        actor: AidOfficer
        preconditions:
          - "VerificationDocument.status == RECEIVED"
        side_effects:
          - "Evaluates parent VerificationCase auto-transition to DOCUMENTS_RECEIVED"
      - from: RECEIVED
        to: REJECTED
        trigger: "POST /verification-documents/{id}/reject"
        actor: AidOfficer
        preconditions:
          - "VerificationDocument.status == RECEIVED"
          - "rejection_reason present in the request (non-empty)"
        side_effects:
          - "Sets rejection_reason"
      - from: REJECTED
        to: REQUESTED
        trigger: "POST /verification-documents/{id}/request-resubmission"
        actor: AidOfficer
        preconditions:
          - "VerificationDocument.status == REJECTED"
        side_effects:
          - "Clears received_at; retains rejection_reason as history"

  - entity: ConflictingInfoCase
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: SUBSTANTIATED
        trigger: "POST /conflicting-info-cases/{id}/substantiate"
        actor: AidOfficer
        preconditions:
          - "ConflictingInfoCase.status == OPEN"
        side_effects:
          - "Increments version"
      - from: OPEN
        to: UNSUBSTANTIATED
        trigger: "POST /conflicting-info-cases/{id}/unsubstantiate"
        actor: AidOfficer
        preconditions:
          - "ConflictingInfoCase.status == OPEN"
        side_effects:
          - "Increments version"
      - from: SUBSTANTIATED
        to: RESOLVED_REQUIRES_CORRECTION
        trigger: "POST /conflicting-info-cases/{id}/resolve-requires-correction"
        actor: AidOfficer
        preconditions:
          - "ConflictingInfoCase.status == SUBSTANTIATED"
          - "resolution present (non-empty)"
          - "Caller X-User-ID != opened_by_user_id (segregation of duties)"
        side_effects:
          - "Sets resolved_by_user_id"
      - from: UNSUBSTANTIATED
        to: RESOLVED
        trigger: "POST /conflicting-info-cases/{id}/resolve"
        actor: AidOfficer
        preconditions:
          - "ConflictingInfoCase.status == UNSUBSTANTIATED"
          - "resolution present (non-empty)"
          - "Caller X-User-ID != opened_by_user_id"
        side_effects:
          - "Sets resolved_by_user_id"
      - from: RESOLVED_REQUIRES_CORRECTION
        to: RESOLVED
        trigger: "system: import of a new current ISIRRecord whose subject_field value equals claimed_value_cents (or claimed value for non-numeric subjects)"
        actor: system
        preconditions:
          - "New current ISIR exists for (student_id, aid_year_id)"
          - "The corrected field matches the claimed value"
        side_effects:
          - "Closes the case"

  - entity: ProfessionalJudgmentCase
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /pj-cases/{id}/begin-review"
        actor: AidOfficer
        preconditions:
          - "ProfessionalJudgmentCase.status == SUBMITTED"
        side_effects:
          - "Sets reviewed_by_user_id from caller X-User-ID"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /pj-cases/{id}/approve"
        actor: AidDirector
        preconditions:
          - "ProfessionalJudgmentCase.status == UNDER_REVIEW"
          - "documentation_complete == true"
          - "Caller X-User-ID != reviewed_by_user_id (segregation of duties)"
          - "For adjustment_type == EFC_ADJUSTMENT: requested_delta_cents <= 0 and current ISIR efc_official_cents + requested_delta_cents >= 0"
          - "For adjustment_type == COA_ADJUSTMENT: requested_delta_cents > 0"
          - "For adjustment_type == DEPENDENCY_OVERRIDE: Student.dependency_status == DEPENDENT"
        side_effects:
          - "Sets decided_by_user_id; sets applied_efc_delta_cents (EFC_ADJUSTMENT) or applied_coa_delta_cents (COA_ADJUSTMENT); DEPENDENCY_OVERRIDE flips Student.dependency_status to INDEPENDENT"
          - "Increments version; bumps Student.version"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /pj-cases/{id}/deny"
        actor: AidDirector
        preconditions:
          - "ProfessionalJudgmentCase.status == UNDER_REVIEW"
          - "Caller X-User-ID != reviewed_by_user_id"
        side_effects:
          - "Sets decided_by_user_id"

  - entity: AwardPackage
    initial_state: DRAFT
    terminal_states: [LOCKED, DECLINED]
    transitions:
      - from: DRAFT
        to: PACKAGED
        trigger: "POST /award-packages/{id}/build"
        actor: AidOfficer
        preconditions:
          - "AwardPackage.status == DRAFT"
          - "Parent AidYear.status == OPEN"
          - "Student has a current ISIRRecord for the aid year (is_current == true)"
          - "If the student's VerificationCase exists and status NOT IN {COMPLETED_SATISFIED, WAIVED}: only funds with requires_verification_complete == false may be awarded (enforced in packaging waterfall by skipping restricted funds)"
        side_effects:
          - "Runs packaging_waterfall: snapshots coa_used_cents / efc_used_cents / need_cents; creates child AwardLine rows in ascending FundType.packaging_rank for every fund that yields offered_cents > 0; sets each line sequence_number"
          - "Recomputes FundType.pool_reserved_cents for every fund touched; fires FundType ACTIVE->EXHAUSTED auto-transitions as needed"
          - "Recomputes AidYear.total_packaged_cents"
      - from: PACKAGED
        to: NOTIFIED
        trigger: "POST /award-packages/{id}/notify"
        actor: AidOfficer
        preconditions:
          - "AwardPackage.status == PACKAGED"
          - "At least one child AwardLine with status == OFFERED exists"
        side_effects:
          - "Creates an AwardNotification (DRAFT) then transitions it to SENT, stamping notification_seq and snapshot_total_offered_cents"
      - from: NOTIFIED
        to: ACCEPTED
        trigger: "POST /award-packages/{id}/accept"
        actor: Student
        preconditions:
          - "AwardPackage.status == NOTIFIED"
          - "Caller X-User-ID == AwardPackage.student_id"
          - "Request accepts every non-DECLINED line at full offered_cents"
        side_effects:
          - "Each OFFERED AwardLine -> ACCEPTED with accepted_cents = offered_cents; recomputes total_accepted_cents; runs overaward_detection"
      - from: NOTIFIED
        to: PARTIALLY_ACCEPTED
        trigger: "POST /award-packages/{id}/accept with per-line amounts where at least one line is partial or declined"
        actor: Student
        preconditions:
          - "AwardPackage.status == NOTIFIED"
          - "Caller X-User-ID == AwardPackage.student_id"
          - "Every per-line accepted amount in [0, offered_cents]"
        side_effects:
          - "Applies per-line acceptance: amount == offered -> ACCEPTED; 0 < amount < offered -> PARTIALLY_ACCEPTED with accepted_cents = amount; amount == 0 -> DECLINED"
          - "Pool release: for each DECLINED line, FundType.pool_reserved_cents decreases by offered_cents (may fire EXHAUSTED->ACTIVE)"
          - "Runs overaward_detection on the new total"
      - from: NOTIFIED
        to: DECLINED
        trigger: "POST /award-packages/{id}/decline"
        actor: Student
        preconditions:
          - "AwardPackage.status == NOTIFIED"
          - "Caller X-User-ID == AwardPackage.student_id"
        side_effects:
          - "All OFFERED lines -> DECLINED; pool_reserved_cents released for each fund (may fire EXHAUSTED->ACTIVE per fund); AidYear.total_packaged_cents recomputed"
      - from: NOTIFIED
        to: REVISION_REQUESTED
        trigger: "POST /award-packages/{id}/revision-requests"
        actor: Student
        preconditions:
          - "AwardPackage.status == NOTIFIED"
          - "No RevisionRequest for this package in status IN {SUBMITTED, UNDER_REVIEW}"
        side_effects:
          - "Creates RevisionRequest(SUBMITTED); requested_by_role=Student"
      - from: REVISION_REQUESTED
        to: NOTIFIED
        trigger: "system: linked RevisionRequest transitions to DENIED (no repack) or to APPROVED (after repack completes)"
        actor: system
        preconditions:
          - "Linked RevisionRequest reached a terminal state"
        side_effects:
          - "On APPROVED path: re-runs packaging_waterfall with current data (repack): lines may be adjusted, added, or CANCELLED; then creates a new AwardNotification with incremented notification_seq"
      - from: ACCEPTED
        to: LOCKED
        trigger: "POST /award-packages/{id}/lock"
        actor: AidOfficer
        preconditions:
          - "AwardPackage.status IN {ACCEPTED, PARTIALLY_ACCEPTED}"
          - "expected_package_version matches current version (OCC)"
        side_effects:
          - "Sets version_locked_at; increments version"
      - from: PARTIALLY_ACCEPTED
        to: LOCKED
        trigger: "POST /award-packages/{id}/lock"
        actor: AidOfficer
        preconditions:
          - "AwardPackage.status IN {ACCEPTED, PARTIALLY_ACCEPTED}"
          - "expected_package_version matches current version (OCC)"
        side_effects:
          - "Sets version_locked_at; increments version"

  - entity: AwardLine
    initial_state: OFFERED
    terminal_states: [DECLINED, CANCELLED, RETURNED, DISBURSED]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "package accept (full) or per-line acceptance at offered_cents"
        actor: Student
        preconditions:
          - "Parent AwardPackage.status == NOTIFIED"
        side_effects:
          - "Sets accepted_cents = offered_cents; recomputes package totals"
      - from: OFFERED
        to: PARTIALLY_ACCEPTED
        trigger: "per-line acceptance with 0 < amount < offered_cents"
        actor: Student
        preconditions:
          - "Parent AwardPackage.status == NOTIFIED"
        side_effects:
          - "Sets accepted_cents = amount; releases (offered_cents - accepted_cents) from FundType.pool_reserved_cents; recomputes package totals"
      - from: OFFERED
        to: DECLINED
        trigger: "per-line acceptance with amount == 0, or package decline"
        actor: Student
        preconditions:
          - "Parent AwardPackage.status == NOTIFIED"
        side_effects:
          - "Releases offered_cents from FundType.pool_reserved_cents; recomputes package totals; may fire FundType EXHAUSTED->ACTIVE"
      - from: OFFERED
        to: CANCELLED
        trigger: "system: repack (revision approved or verification-driven repack) determines the line is no longer eligible"
        actor: system
        preconditions:
          - "A packaging_waterfall run on the parent package is executing"
        side_effects:
          - "Releases offered_cents from pool_reserved_cents; recomputes package totals"
      - from: ACCEPTED
        to: DISBURSING
        trigger: "POST /award-lines/{id}/begin-disbursement"
        actor: AidOfficer
        preconditions:
          - "AwardLine.status IN {ACCEPTED, PARTIALLY_ACCEPTED}"
          - "Parent AwardPackage.status == LOCKED"
        side_effects:
          - "Increments version"
      - from: PARTIALLY_ACCEPTED
        to: DISBURSING
        trigger: "POST /award-lines/{id}/begin-disbursement"
        actor: AidOfficer
        preconditions:
          - "AwardLine.status IN {ACCEPTED, PARTIALLY_ACCEPTED}"
          - "Parent AwardPackage.status == LOCKED"
        side_effects:
          - "Increments version"
      - from: DISBURSING
        to: DISBURSED
        trigger: "system: the sum of POSTED Disbursement.disbursed_cents for the line equals accepted_cents and at least one Disbursement is POSTED"
        actor: system
        preconditions:
          - "line.disbursed_cents == line.accepted_cents"
          - "line.disbursed_cents > 0"
        side_effects:
          - "Increments version"
      - from: DISBURSED
        to: RETURN_REQUESTED
        trigger: "POST /award-lines/{id}/request-return"
        actor: AidOfficer
        preconditions:
          - "AwardLine.status == DISBURSED"
          - "An OverawardCase in status IN {OPEN, RESOLVING} references this line, or a manual return reason is supplied"
        side_effects:
          - "Increments version"
      - from: RETURN_REQUESTED
        to: RETURNED
        trigger: "POST /award-lines/{id}/confirm-return"
        actor: AidOfficer
        preconditions:
          - "AwardLine.status == RETURN_REQUESTED"
          - "return_cents in request is > 0 and <= disbursed_cents"
        side_effects:
          - "Reduces disbursed_cents by return_cents; reduces FundType.pool_disbursed_cents; reduces AidYear.total_disbursed_cents; may fire FundType EXHAUSTED->ACTIVE"

  - entity: AwardNotification
    initial_state: DRAFT
    terminal_states: [ACKNOWLEDGED]
    transitions:
      - from: DRAFT
        to: SENT
        trigger: "system: fired by package notify transition"
        actor: system
        preconditions:
          - "AwardNotification.status == DRAFT"
        side_effects:
          - "Sets sent_at; snapshots snapshot_total_offered_cents"
      - from: SENT
        to: ACKNOWLEDGED
        trigger: "POST /award-notifications/{id}/acknowledge"
        actor: Student
        preconditions:
          - "AwardNotification.status == SENT"
          - "Caller X-User-ID == student_id of the notification's package"
        side_effects: []

  - entity: RevisionRequest
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /revision-requests/{id}/begin-review"
        actor: AidOfficer
        preconditions:
          - "RevisionRequest.status == SUBMITTED"
        side_effects: []
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /revision-requests/{id}/approve"
        actor: AidDirector
        preconditions:
          - "RevisionRequest.status == UNDER_REVIEW"
          - "decision_notes present (non-empty)"
        side_effects:
          - "Re-runs packaging_waterfall on the parent package with current inputs (enrollment, EFC, PJ deltas); lines adjusted/CANCELLED/created; pool_reserved_cents recomputed per fund with EXHAUSTED transitions both directions; parent AwardPackage returns to NOTIFIED via system transition; new AwardNotification created with incremented notification_seq"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /revision-requests/{id}/deny"
        actor: AidDirector
        preconditions:
          - "RevisionRequest.status == UNDER_REVIEW"
          - "decision_notes present (non-empty)"
        side_effects:
          - "Parent AwardPackage returns to NOTIFIED unchanged"

  - entity: Disbursement
    initial_state: SCHEDULED
    terminal_states: [POSTED, RETURNED]
    transitions:
      - from: SCHEDULED
        to: ELIGIBILITY_PASSED
        trigger: "POST /disbursements/{id}/evaluate-eligibility"
        actor: AidOfficer
        preconditions:
          - "Disbursement.status IN {SCHEDULED, ELIGIBILITY_FAILED}"
        side_effects:
          - "Runs disbursement_eligibility: enrollment floor per fund category, SAP status gate, verification-complete gate for Title IV, COA headroom check; sets failure_reasons = []"
      - from: SCHEDULED
        to: ELIGIBILITY_FAILED
        trigger: "POST /disbursements/{id}/evaluate-eligibility"
        actor: AidOfficer
        preconditions:
          - "Disbursement.status IN {SCHEDULED, ELIGIBILITY_FAILED}"
        side_effects:
          - "Sets failure_reasons to the ordered list of failed checks"
      - from: ELIGIBILITY_FAILED
        to: SCHEDULED
        trigger: "POST /disbursements/{id}/reset"
        actor: AidOfficer
        preconditions:
          - "Disbursement.status == ELIGIBILITY_FAILED"
        side_effects:
          - "Clears failure_reasons to []"
      - from: ELIGIBILITY_PASSED
        to: POSTED
        trigger: "POST /disbursements/{id}/post"
        actor: AidOfficer
        preconditions:
          - "Disbursement.status == ELIGIBILITY_PASSED"
          - "Parent AwardLine.status == DISBURSING"
          - "line.disbursed_cents + scheduled_cents <= line.accepted_cents"
        side_effects:
          - "Sets disbursed_cents = scheduled_cents; increments AwardLine.disbursed_cents; FundType.pool_disbursed_cents += scheduled_cents; AidYear.total_disbursed_cents += scheduled_cents; evaluates AwardLine DISBURSING->DISBURSED auto-transition"
      - from: POSTED
        to: RETURN_REQUESTED
        trigger: "POST /disbursements/{id}/request-return"
        actor: AidOfficer
        preconditions:
          - "Disbursement.status == POSTED"
        side_effects: []
      - from: RETURN_REQUESTED
        to: RETURNED
        trigger: "POST /disbursements/{id}/confirm-return"
        actor: AidOfficer
        preconditions:
          - "Disbursement.status == RETURN_REQUESTED"
        side_effects:
          - "AwardLine.disbursed_cents -= this.disbursed_cents; FundType.pool_disbursed_cents -= this.disbursed_cents; AidYear.total_disbursed_cents -= this.disbursed_cents"

  - entity: OverawardCase
    initial_state: OPEN
    terminal_states: [VERIFIED]
    transitions:
      - from: OPEN
        to: RESOLVING
        trigger: "POST /overaward-cases/{id}/begin-resolution"
        actor: AidOfficer
        preconditions:
          - "OverawardCase.status == OPEN"
          - "resolution_plan present and non-empty; every referenced AwardLine belongs to a package of the same (student_id, aid_year_id); sum of reduce_by_cents >= overage_cents; each reduce_by_cents > 0 and <= target line accepted_cents"
        side_effects:
          - "Applies the plan in array order: for each step, reduces AwardLine.accepted_cents by reduce_by_cents (line may drop from ACCEPTED to PARTIALLY_ACCEPTED when reduced but still > 0; to CANCELLED-adjacent DECLINED only when reduce equals accepted_cents and no disbursements posted); recomputes package totals and FundType.pool_reserved_cents per affected fund; fires EXHAUSTED->ACTIVE as needed"
      - from: RESOLVING
        to: RESOLVED
        trigger: "system: after plan application, recomputed total aid <= package.coa_used_cents"
        actor: system
        preconditions:
          - "package.total_accepted_cents + ExternalAid(counts_against_coa=true) sum <= package.coa_used_cents"
        side_effects: []
      - from: RESOLVING
        to: OPEN
        trigger: "POST /overaward-cases/{id}/rollback"
        actor: AidOfficer
        preconditions:
          - "OverawardCase.status IN {RESOLVING, RESOLVED} (rollback reopens a resolved case any time before Director verification)"
          - "No POSTED disbursement exists on any line modified by the plan"
        side_effects:
          - "Reverts every plan step (restores accepted_cents), recomputes package and fund aggregates; the named conserved quantity (total_accepted_cents) returns to its pre-plan value exactly"
      - from: RESOLVED
        to: OPEN
        trigger: "POST /overaward-cases/{id}/rollback"
        actor: AidOfficer
        preconditions:
          - "OverawardCase.status IN {RESOLVING, RESOLVED}"
          - "No POSTED disbursement exists on any line modified by the plan"
        side_effects:
          - "Reverts every plan step (restores accepted_cents), recomputes package and fund aggregates; the named conserved quantity (total_accepted_cents) returns to its pre-plan value exactly"
      - from: RESOLVED
        to: VERIFIED
        trigger: "POST /overaward-cases/{id}/verify"
        actor: AidDirector
        preconditions:
          - "OverawardCase.status == RESOLVED"
        side_effects: []

  - entity: ReconciliationRun
    initial_state: DRAFT
    terminal_states: [BALANCED]
    transitions:
      - from: DRAFT
        to: IMPORTED
        trigger: "POST /reconciliation-runs/{id}/import-federal"
        actor: AidDirector
        preconditions:
          - "ReconciliationRun.status == DRAFT"
          - "federal_reported_cents present and >= 0"
        side_effects: []
      - from: IMPORTED
        to: COMPARED
        trigger: "POST /reconciliation-runs/{id}/compare"
        actor: AidDirector
        preconditions:
          - "ReconciliationRun.status == IMPORTED"
        side_effects:
          - "Snapshots internal_posted_cents (sum of POSTED disbursements in the aid year); computes variance_cents = federal_reported_cents - internal_posted_cents"
      - from: COMPARED
        to: BALANCED
        trigger: "system auto-transition at compare time when variance_cents == 0"
        actor: system
        preconditions:
          - "variance_cents == 0"
        side_effects: []
      - from: COMPARED
        to: VARIANCE_FOUND
        trigger: "system auto-transition at compare time when variance_cents != 0"
        actor: system
        preconditions:
          - "variance_cents != 0"
        side_effects: []
      - from: VARIANCE_FOUND
        to: ADJUSTED
        trigger: "POST /reconciliation-runs/{id}/adjustments"
        actor: AidDirector
        preconditions:
          - "ReconciliationRun.status == VARIANCE_FOUND"
          - "Sum of adjust_cents over all ReconciliationAdjustment rows of this run plus internal_posted_cents equals federal_reported_cents (net adjustment zeroes the variance)"
        side_effects:
          - "Creates the ReconciliationAdjustment row(s)"
      - from: ADJUSTED
        to: BALANCED
        trigger: "POST /reconciliation-runs/{id}/finalize"
        actor: AidDirector
        preconditions:
          - "ReconciliationRun.status == ADJUSTED"
        side_effects:
          - "Recomputes variance_cents to 0 by applying adjustments"

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: package-lock-stale-version
    parent_entity: AwardPackage
    write_endpoint: "POST /award-packages/{id}/lock"
    occ_field: "expected_package_version"
    description: |
      Locking an AwardPackage whose version has advanced since the client last
      observed it is rejected. This captures the case where another writer has
      just mutated the package (per-line acceptance released pool reservations
      and bumped the version) and the current writer's view is therefore stale.
    error_id: ERR_STALE_PACKAGE_VERSION
    http_status: 412
  - rule_id: pj-approve-stale-version
    parent_entity: ProfessionalJudgmentCase
    write_endpoint: "POST /pj-cases/{id}/approve"
    occ_field: "expected_pj_version"
    description: |
      Approving a ProfessionalJudgmentCase whose version has advanced since the
      client last observed it is rejected. This captures the case where another
      writer has just modified the case (e.g., a denial) and the approver's
      view of the case is therefore stale.
    error_id: ERR_STALE_PJ_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: efc_calculation
    trigger: "On ISIRRecord import (variant PROVISIONAL) and on VerificationCase COMPLETED_SATISFIED (variant VERIFIED)"
    algorithm: weighted_scoring
    formula: |
      # Simplified federal-methodology-style EFC, fully deterministic.
      # Step 1: total income = agi_cents + untaxed_income_cents
      # Step 2: income protection allowance (IPA) = IPA_TABLE[dependency][min(household_size,5)]
      # Step 3: available income AI = max(0, total_income - IPA)
      # Step 4: income contribution IC = tiered marginal on AI:
      #   first  TIER1_MAX cents at TIER1_RATE,
      #   next   (TIER2_MAX - TIER1_MAX) at TIER2_RATE,
      #   remainder at TIER3_RATE. Each tier's product rounded to cents half-up
      #   BEFORE summing (pinned rounding order: round per tier, then sum).
      # Step 5: asset contribution AC = floor(asset_net_worth_cents * ASSET_RATE / 100) when
      #   asset_net_worth_cents > ASSET_ALLOWANCE else 0. (ASSET_ALLOWANCE subtracted first:
      #   AC = floor((asset_net_worth_cents - ASSET_ALLOWANCE) * ASSET_RATE / 100).)
      # Step 6: EFC_raw = (IC + AC) / number_in_college, integer division rounding half-up.
      # Step 7: EFC = max(EFC_FLOOR, min(EFC_RAW, EFC_CAP))
      # Variant VERIFIED uses the verified field values from accepted documents;
      # variant PROVISIONAL uses as-reported ISIR values.
    input_set: "The single current ISIRRecord for (student_id, aid_year_id). For VERIFIED: field values after applying accepted VerificationDocument data."
    constants:
      IPA_DEPENDENT: "10000_00, 15000_00, 20000_00, 24000_00, 28000_00"
      IPA_INDEPENDENT: "17000_00, 22000_00, 26000_00, 30000_00, 33000_00"
      TIER1_MAX: 500000
      TIER1_RATE: "0.22"
      TIER2_MAX: 1500000
      TIER2_RATE: "0.35"
      TIER3_RATE: "0.47"
      ASSET_RATE: "5.64"
      ASSET_ALLOWANCE: 1000000
      EFC_FLOOR: 0
      EFC_CAP: 99999900
    precision: "integer cents; per-tier round_half_up before summing; division rounding half-up"
    variants:
      - name: PROVISIONAL
        when: "ISIR import, verification not yet completed"
        difference: "Uses as-reported field values (agi_cents etc. as imported)."
      - name: VERIFIED
        when: "VerificationCase transitions to COMPLETED_SATISFIED"
        difference: "Uses verified values; produces a different EFC whenever any accepted document changed agi_cents, untaxed_income_cents, asset_net_worth_cents, household_size, or number_in_college."

  - name: pell_award_lookup
    trigger: "During packaging_waterfall when fund PELL is considered"
    algorithm: threshold
    formula: |
      # Pell is table-driven off the student's efc_used_cents snapshot.
      # Find the single AidYear.pell_schedule row with efc_min <= efc_used_cents <= efc_max;
      # award_cents of that row is the Pell offer BEFORE enrollment proration.
      # Proration: FULL_TIME -> 100%, THREE_QUARTER -> 75%, HALF_TIME -> 50%, LESS_THAN_HALF -> 0.
      # pell_offer = floor(row.award_cents * proration_pct / 100).
    input_set: "AwardPackage.efc_used_cents snapshot; AidYear.pell_schedule; Student.enrollment_status at packaging time."
    constants:
      PRORATION_FULL_TIME: 100
      PRORATION_THREE_QUARTER: 75
      PRORATION_HALF_TIME: 50
      PRORATION_LESS_THAN_HALF: 0
    precision: "integer cents; floor after proration multiply"

  - name: stafford_cap_schedule
    trigger: "During packaging_waterfall when SUB or UNSUB funds are considered"
    algorithm: tiered_pricing
    formula: |
      # Annual Stafford caps by grade_level and dependency_status (cents):
      # SUB_CAP[grade][dep] and UNSUB_CAP[grade][dep] are constants below.
      # SUB offer = min(SUB_CAP[grade_level][dependency_status], remaining_need) where
      #   remaining_need = max(0, need_cents - gift_aid_cents_so_far_in_waterfall).
      # UNSUB offer = min(UNSUB_CAP[grade_level][dependency_status], remaining_coa_gap) where
      #   remaining_coa_gap = max(0, coa_used_cents - total_offered_so_far_in_waterfall).
      # SUB is need_based; UNSUB is not.
    input_set: "AwardPackage snapshots; Student.grade_level; Student.dependency_status; running waterfall accumulators."
    constants:
      SUB_CAP_DEP: "350000, 450000, 550000, 550000, 550000"
      SUB_CAP_INDEP: "350000, 450000, 550000, 550000, 550000"
      UNSUB_CAP_DEP: "200000, 200000, 200000, 200000, 200000"
      UNSUB_CAP_INDEP: "600000, 600000, 700000, 700000, 700000"
    precision: "integer cents"

  - name: packaging_waterfall
    trigger: "POST /award-packages/{id}/build and revision-approved repack"
    algorithm: waterfall_allocation
    formula: |
      # Evaluation order is pinned and circular-looking dependencies are broken as follows:
      #  1. Compute snapshots: coa_used_cents, efc_used_cents, need_cents = max(0, coa - efc).
      #  2. Candidate funds = FundType rows of the AidYear with status == ACTIVE, ordered by
      #     packaging_rank ASC, tie-break fund_code ASC.
      #  3. Eligibility filter per fund (evaluated in order):
      #     a. fund.priority_cohort_only == true  -> skip unless current ISIR cohort == PRIORITY.
      #     b. fund.requires_verification_complete == true -> skip unless the student's
      #        VerificationCase is absent (NOT_SELECTED) or status IN {COMPLETED_SATISFIED, WAIVED}.
      #     c. PELL -> pell_award_lookup; SUB/UNSUB -> stafford_cap_schedule; other funds:
      #        base_offer = min(fund.annual_cap_cents, remaining_need when need_based else remaining_coa_gap).
      #     d. Pool check (non-PELL): offer = min(base_offer, fund.pool_budget_cents - fund.pool_reserved_cents);
      #        skip fund when the result <= 0. PELL skips the pool check entirely (entitlement).
      #  4. Accumulator updates AFTER each fund's offer is fixed:
      #     remaining_need    = max(0, remaining_need    - offer) when fund.need_based
      #     remaining_coa_gap = max(0, remaining_coa_gap - offer) for EVERY fund (gift or loan)
      #     gift_aid_cents accumulates offers of need_based non-loan funds.
      #  5. Create an AwardLine per fund whose offer > 0, sequence_number assigned in evaluation
      #     order starting at 1. Funds offering 0 produce NO line.
      # Rounding: all amounts integer cents; no rounding beyond the per-fund rules above.
    input_set: "AwardPackage draft, current ISIRRecord, FundType rows (status ACTIVE), Student, VerificationCase, APPROVED ProfessionalJudgmentCase rows for (student, aid year)."
    constants: {}
    precision: "integer cents"

  - name: sap_evaluation
    trigger: "POST /students/{id}/evaluate-sap"
    algorithm: threshold
    formula: |
      # Qualitative: pass when gpa_hundredths >= GPA_FLOOR (200).
      # Quantitative pace: pace_bps = effective_completed * 10000 / effective_attempted
      #   (integer division; effective_attempted == 0 -> pace treated as 10000 bps).
      #   pass when pace_bps >= PACE_FLOOR_BPS (6667 i.e. 66.67%).
      # Max timeframe: fail when cumulative_attempted_credits > max_timeframe_credits.
      # Result mapping:
      #   all pass and prior IN {NOT_EVALUATED, GOOD_STANDING, WARNING} -> GOOD_STANDING
      #   all pass and prior == SUSPENDED -> SUSPENDED (only a Director appeal lifts suspension)
      #   any failure and prior IN {NOT_EVALUATED, GOOD_STANDING} -> WARNING
      #   any failure and prior IN {WARNING, APPEAL_APPROVED} -> SUSPENDED
      # APPEAL_APPROVED is only reachable via POST /students/{id}/sap-appeal (Director).
      # Variant STANDARD: effective_* = cumulative_* (as-reported credits only).
      # Variant TRANSFER: effective_attempted = cumulative_attempted_credits + transfer_credits,
      #   effective_completed = cumulative_completed_credits + transfer_credits (all transfer
      #   credits count as both attempted and completed). transfer_credits is a request field
      #   defaulting to 0; variant TRANSFER is selected by passing transfer_credits > 0.
    input_set: "Single Student row plus optional transfer_credits request field."
    constants:
      GPA_FLOOR: 200
      PACE_FLOOR_BPS: 6667
    precision: "basis points, integer division floor"
    variants:
      - name: STANDARD
        when: "transfer_credits omitted or 0"
        difference: "Pace uses as-reported cumulative credits only."
      - name: TRANSFER
        when: "transfer_credits > 0 in the evaluate-sap request"
        difference: "Transfer credits added to BOTH attempted and completed before the pace division, which can flip a failing pace to passing (e.g. 30/45 = 6666 bps fails, but (30+12)/(45+12) = 7368 bps passes)."

  - name: disbursement_eligibility
    trigger: "POST /disbursements/{id}/evaluate-eligibility"
    algorithm: constraint_propagation
    formula: |
      # Ordered checks; failure_reasons collects ALL failing codes in this pinned order:
      #  1. ENROLLMENT_BELOW_REQUIRED: FEDERAL_TITLE_IV requires enrollment_status IN
      #     {FULL_TIME, THREE_QUARTER, HALF_TIME}; INSTITUTIONAL requires IN
      #     {FULL_TIME, THREE_QUARTER}; STATE/EXTERNAL: no floor.
      #  2. SAP_NOT_SATISFACTORY: requires sap_status IN {GOOD_STANDING, WARNING, APPEAL_APPROVED}.
      #  3. VERIFICATION_INCOMPLETE: for FEDERAL_TITLE_IV funds only, requires the student's
      #     VerificationCase absent or status IN {COMPLETED_SATISFIED, WAIVED}.
      #  4. COA_HEADROOM_EXCEEDED: line.disbursed_cents + scheduled_cents <= line.accepted_cents
      #     AND package.total_disbursed_cents + scheduled_cents <= package.coa_used_cents.
      #  5. AID_YEAR_LOCKED: parent AidYear.status must be IN {OPEN, PACKAGING_LOCKED}; disbursement
      #     evaluation during RECONCILING or CLOSED fails.
      # ELIGIBILITY_PASSED iff failure_reasons is empty.
    input_set: "Disbursement, AwardLine, FundType, AwardPackage, Student, VerificationCase, AidYear."
    constants: {}
    precision: "n/a (boolean checks)"

  - name: overaward_detection
    trigger: "On POST /award-packages/{id}/build, on every package acceptance transition, and on POST /external-aid"
    algorithm: aggregation
    formula: |
      # The counted total depends on package status (pinned, no ambiguity):
      #   package status IN {DRAFT, PACKAGED, NOTIFIED, REVISION_REQUESTED}:
      #     counted = package.total_offered_cents
      #   package status IN {PARTIALLY_ACCEPTED, ACCEPTED, LOCKED}:
      #     counted = package.total_accepted_cents
      # total_aid = counted + sum(ExternalAid.amount_cents where
      #   counts_against_coa == true for (student_id, aid_year_id)).
      # overage = total_aid - package.coa_used_cents.
      # When overage > 0 and no OverawardCase exists in status IN {OPEN, RESOLVING} for
      #   (student_id, aid_year_id): create OverawardCase(OPEN) with detected_total_aid_cents
      #   and overage_cents.
      # When overage <= 0 and a case exists in OPEN: leave it (manual rollback path); no auto-close.
    input_set: "AwardPackage totals (offered or accepted per the status pin), ExternalAid rows for (student_id, aid_year_id) with counts_against_coa == true."
    constants: {}
    precision: "integer cents"

  - name: reconciliation_compare
    trigger: "POST /reconciliation-runs/{id}/compare"
    algorithm: aggregation
    formula: |
      # internal_posted_cents = sum(Disbursement.disbursed_cents) over Disbursement rows whose
      #   status == POSTED at compare time and whose AwardLine's package aid_year_id == run.aid_year_id.
      # variance_cents = federal_reported_cents - internal_posted_cents.
      # variance == 0 -> BALANCED; != 0 -> VARIANCE_FOUND.
      # Adjustment reconciliation invariant: at finalize, internal_posted_cents + sum(adjust_cents)
      #   == federal_reported_cents (net zero variance).
    input_set: "Disbursement rows joined to packages of the run's aid year, status filter POSTED at compare time."
    constants: {}
    precision: "integer cents"

# ---------------------------------------------------------------------------
# 1.4 Validation Rules Table (ordered by priority)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role is a declared role name"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Caller role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Every id in the path exists (validated left-to-right: aid year, then student, then package, then line, then child resource)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: existence
    check: "Every FK in the request body references an existing entity (e.g. fund_type_id on award-line creation, student_id on ISIR import)"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "POST endpoints with body FKs"
  - priority: 5
    category: state
    check: "Target entity's state machine permits the requested transition from its current state"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 6
    category: state
    check: "Parent-aggregate state gate: AidYear must be OPEN for packaging build; AwardPackage must be LOCKED for begin-disbursement; AidYear must not be CLOSED for any student-level write"
    error_id: ERR_PARENT_STATE_BLOCKS
    http_status: 409
    applies_to: "POST /award-packages/{id}/build, POST /award-lines/{id}/begin-disbursement, POST /disbursements, POST /isir-records"
  - priority: 7
    category: business_safety
    check: "Segregation of duties: ConflictingInfoCase resolving caller != opened_by_user_id; PJ approve/deny caller != reviewed_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /conflicting-info-cases/{id}/resolve, POST /conflicting-info-cases/{id}/resolve-requires-correction, POST /pj-cases/{id}/approve, POST /pj-cases/{id}/deny"
  - priority: 8
    category: business_safety
    check: "Ownership: Student-role callers may only act on their own package/notification resources (X-User-ID == package.student_id)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /award-packages/{id}/accept, POST /award-packages/{id}/decline, POST /award-packages/{id}/revision-requests, POST /award-notifications/{id}/acknowledge"
  - priority: 9
    category: business_constraint
    check: "Required request fields present and well-typed (non-empty strings where required, enums in range, integers in range)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 10
    category: business_constraint
    check: "Field-level domain constraints: household_size >= 2 for DEPENDENT / >= 1 for INDEPENDENT; number_in_college <= household_size; coa_out_of_state_cents > coa_in_state_cents; requested_delta_cents sign matches adjustment_type; cumulative_completed_credits <= cumulative_attempted_credits"
    error_id: ERR_FIELD_CONSTRAINT
    http_status: 422
    applies_to: "POST /isir-records, POST /aid-years, POST /students, POST /pj-cases"
  - priority: 11
    category: business_constraint
    check: "Uniqueness: Student.ssn unique; Student.email unique; FundType.fund_code unique per aid year; (student_id, aid_year_id, transaction_number) unique on ISIRRecord; AwardPackage unique per (student_id, aid_year_id)"
    error_id: ERR_DUPLICATE
    http_status: 409
    applies_to: "POST /students, POST /fund-types, POST /isir-records, POST /award-packages"
  - priority: 12
    category: business_temporal
    check: "ISIR received_at must be <= now (logical clock) and >= aid year start (aid-year window: received_at within [AidYear created_at - 1 year, now])"
    error_id: ERR_RECEIVED_AT_OUT_OF_WINDOW
    http_status: 422
    applies_to: "POST /isir-records"
  - priority: 13
    category: business_referential
    check: "Cross-entity precondition: packaging build requires a current ISIRRecord for (student, aid year); ISIR import requires AidYear.status == OPEN; fund activation requires AidYear DRAFT or OPEN"
    error_id: ERR_PREREQUISITE_MISSING
    http_status: 422
    applies_to: "POST /award-packages/{id}/build, POST /isir-records, POST /fund-types/{id}/activate"
  - priority: 14
    category: business_fiscal
    check: "OCC: expected_package_version / expected_pj_version equals the entity's current version"
    error_id: ERR_STALE_PACKAGE_VERSION
    http_status: 412
    applies_to: "POST /award-packages/{id}/lock, POST /pj-cases/{id}/approve"
  - priority: 15
    category: business_fiscal
    check: "Fund pool sufficiency during repack adjustments: a repack or per-line change may not push any non-PELL fund's pool_reserved_cents above pool_budget_cents"
    error_id: ERR_FUND_POOL_EXHAUSTED
    http_status: 422
    applies_to: "POST /revision-requests/{id}/approve"
  - priority: 16
    category: business_fiscal
    check: "Over-award gate at acceptance: when an OverawardCase for (student, aid year) is OPEN or RESOLVING and the offered-total-based detection still exceeds COA, POST /award-packages/{id}/accept is rejected (the student must wait for resolution)"
    error_id: ERR_OVERAWARD_UNRESOLVED
    http_status: 422
    applies_to: "POST /award-packages/{id}/accept"
  - priority: 17
    category: business_fiscal
    check: "Disbursement schedule amount: scheduled_cents > 0 and <= line.accepted_cents - line.disbursed_cents; line status == DISBURSING; package status == LOCKED"
    error_id: ERR_DISBURSEMENT_AMOUNT
    http_status: 422
    applies_to: "POST /disbursements"
  - priority: 18
    category: business_fiscal
    check: "Reconciliation adjustment arithmetic: sum(adjust_cents) + internal_posted_cents == federal_reported_cents when transitioning VARIANCE_FOUND -> ADJUSTED"
    error_id: ERR_VARIANCE_NOT_ZEROED
    http_status: 422
    applies_to: "POST /reconciliation-runs/{id}/adjustments"

# ---------------------------------------------------------------------------
# 1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  # --- logical clock (test-driving, required for time-gated rules) ---
  - method: POST
    path: /api/_clock/set_current_utc
    description: "Sets the logical clock. Before any call, the clock reads exactly 2026-08-01T00:00:00Z (server default) and MUST NOT fall back to wall-clock time."
    roles: [AidDirector]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["All 'now' references (received_at window checks, sent_at, completed_at) use this clock"]

  # --- AidYear ---
  - method: POST
    path: /api/aid-years
    description: "Create an AidYear in DRAFT with Pell schedule and COA figures."
    roles: [AidDirector]
    code: 201
    input: [year_code, coa_in_state_cents, coa_out_of_state_cents, priority_deadline, pell_schedule, verification_tracking_flag_rate]
    output: AidYear
    side_effects: []
  - method: GET
    path: /api/aid-years
    description: "List aid years with pagination."
    roles: [AidDirector, AidOfficer, Student]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: AidYear[]
    side_effects: []
  - method: GET
    path: /api/aid-years/{id}
    description: "Fetch one aid year including computed totals."
    roles: [AidDirector, AidOfficer]
    code: 200
    input: []
    output: AidYear
    side_effects: []
  - method: POST
    path: /api/aid-years/{id}/open
    description: "DRAFT -> OPEN; requires at least one ACTIVE FundType."
    roles: [AidDirector]
    code: 200
    input: []
    output: AidYear
    side_effects: ["AidYear.version += 1"]
  - method: POST
    path: /api/aid-years/{id}/lock-packaging
    description: "OPEN -> PACKAGING_LOCKED; requires no in-flight packages."
    roles: [AidDirector]
    code: 200
    input: []
    output: AidYear
    side_effects: ["AidYear.version += 1"]
  - method: POST
    path: /api/aid-years/{id}/begin-reconciliation
    description: "PACKAGING_LOCKED -> RECONCILING; creates ReconciliationRun."
    roles: [AidDirector]
    code: 200
    input: []
    output: AidYear
    side_effects: ["Creates ReconciliationRun(DRAFT, run_seq incremented)"]
  - method: POST
    path: /api/aid-years/{id}/close
    description: "RECONCILING -> CLOSED when the latest run is BALANCED; cascades FundType CLOSED."
    roles: [AidDirector]
    code: 200
    input: []
    output: AidYear
    side_effects: ["All child FundType -> CLOSED"]
  - method: GET
    path: /api/aid-years/{id}/fund-types
    description: "Sub-resource list of funds for an aid year."
    roles: [AidDirector, AidOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: FundType[]
    side_effects: []
  - method: GET
    path: /api/aid-years/{id}/reconciliation-runs
    description: "Sub-resource list of reconciliation runs for an aid year."
    roles: [AidDirector]
    code: 200
    input: ["limit?", "offset?"]
    output: ReconciliationRun[]
    side_effects: []

  # --- FundType ---
  - method: POST
    path: /api/fund-types
    description: "Create a fund under an aid year (DRAFT)."
    roles: [AidDirector]
    code: 201
    input: [aid_year_id, fund_code, category, need_based, annual_cap_cents, pool_budget_cents, "priority_cohort_only?", packaging_rank, "requires_verification_complete?"]
    output: FundType
    side_effects: []
  - method: GET
    path: /api/fund-types
    description: "List funds; filterable by aid_year_id."
    roles: [AidDirector, AidOfficer]
    code: 200
    input: ["aid_year_id?", "status?", "limit?", "offset?"]
    output: FundType[]
    side_effects: []
  - method: GET
    path: /api/fund-types/{id}
    description: "Fetch one fund including pool aggregates."
    roles: [AidDirector, AidOfficer]
    code: 200
    input: []
    output: FundType
    side_effects: []
  - method: POST
    path: /api/fund-types/{id}/activate
    description: "DRAFT -> ACTIVE."
    roles: [AidDirector]
    code: 200
    input: []
    output: FundType
    side_effects: ["FundType.version += 1", "AidYear.version += 1"]

  # --- Student ---
  - method: POST
    path: /api/students
    description: "Register a student record."
    roles: [AidOfficer]
    code: 201
    input: [ssn, full_name, email, residency, dependency_status, enrollment_status, grade_level, "cumulative_attempted_credits?", "cumulative_completed_credits?", "max_timeframe_credits?", "gpa_hundredths?"]
    output: Student
    side_effects: []
  - method: GET
    path: /api/students
    description: "List students with pagination/filtering."
    roles: [AidDirector, AidOfficer]
    code: 200
    input: ["limit?", "offset?", "sap_status?", "enrollment_status?"]
    output: Student[]
    side_effects: []
  - method: GET
    path: /api/students/{id}
    description: "Fetch one student."
    roles: [AidDirector, AidOfficer, Student]
    code: 200
    input: []
    output: Student
    side_effects: []
  - method: PATCH
    path: /api/students/{id}
    description: "Update mutable student attributes (enrollment_status, grade_level, residency, credit/GPA inputs)."
    roles: [AidOfficer]
    code: 200
    input: ["enrollment_status?", "grade_level?", "residency?", "cumulative_attempted_credits?", "cumulative_completed_credits?", "gpa_hundredths?", "max_timeframe_credits?"]
    output: Student
    side_effects: ["Student.version += 1"]
  - method: POST
    path: /api/students/{id}/evaluate-sap
    description: "Run sap_evaluation; sets sap_status per the threshold mapping. Optional transfer_credits selects the TRANSFER variant."
    roles: [AidOfficer]
    code: 200
    input: ["transfer_credits?"]
    output: Student
    side_effects: ["Sets sap_status", "Student.version += 1"]
  - method: POST
    path: /api/students/{id}/sap-appeal
    description: "Director grants SAP appeal: SUSPENDED -> APPEAL_APPROVED."
    roles: [AidDirector]
    code: 200
    input: [appeal_reason]
    output: Student
    side_effects: ["sap_status = APPEAL_APPROVED", "Student.version += 1"]
  - method: GET
    path: /api/students/{id}/isir-records
    description: "Sub-resource: ISIR transactions for a student."
    roles: [AidDirector, AidOfficer]
    code: 200
    input: ["aid_year_id?", "limit?", "offset?"]
    output: ISIRRecord[]
    side_effects: []
  - method: GET
    path: /api/students/{id}/verification-cases
    description: "Sub-resource: verification cases for a student."
    roles: [AidDirector, AidOfficer]
    code: 200
    input: ["aid_year_id?", "limit?", "offset?"]
    output: VerificationCase[]
    side_effects: []
  - method: GET
    path: /api/students/{id}/award-packages
    description: "Sub-resource: packages for a student."
    roles: [AidDirector, AidOfficer, Student]
    code: 200
    input: ["aid_year_id?", "limit?", "offset?"]
    output: AwardPackage[]
    side_effects: []
  - method: GET
    path: /api/students/{id}/external-aid
    description: "Sub-resource: external aid rows for a student."
    roles: [AidDirector, AidOfficer]
    code: 200
    input: ["aid_year_id?", "limit?", "offset?"]
    output: ExternalAid[]
    side_effects: []
  - method: GET
    path: /api/students/{id}/overaward-cases
    description: "Sub-resource: over-award cases for a student."
    roles: [AidDirector, AidOfficer]
    code: 200
    input: ["aid_year_id?", "limit?", "offset?"]
    output: OverawardCase[]
    side_effects: []
  - method: GET
    path: /api/students/{id}/pj-cases
    description: "Sub-resource: professional judgment cases for a student."
    roles: [AidDirector, AidOfficer]
    code: 200
    input: ["aid_year_id?", "limit?", "offset?"]
    output: ProfessionalJudgmentCase[]
    side_effects: []
  - method: GET
    path: /api/students/{id}/conflicting-info-cases
    description: "Sub-resource: conflicting-information cases for a student."
    roles: [AidDirector, AidOfficer]
    code: 200
    input: ["aid_year_id?", "limit?", "offset?"]
    output: ConflictingInfoCase[]
    side_effects: []

  # --- ISIR ---
  - method: POST
    path: /api/isir-records
    description: "Import an ISIR transaction. Assigns cohort, EFC (provisional), verification selection; supersedes prior current record; may create/loop a VerificationCase."
    roles: [AidOfficer]
    code: 201
    input: [student_id, aid_year_id, transaction_number, received_at, household_size, number_in_college, agi_cents, untaxed_income_cents, asset_net_worth_cents, "cps_selection_flag?"]
    output: ISIRRecord
    side_effects:
      - "Computes cohort, efc_provisional_cents, verification_selection, is_current"
      - "Supersedes prior current ISIR (is_current=false)"
      - "When SELECTED: creates VerificationCase(DOCUMENTS_REQUESTED) with 3 required VerificationDocument rows (TAX_RETURN_TRANSCRIPT, W2, HOUSEHOLD_FORM) in REQUESTED"
      - "When a VerificationCase in COMPLETED_CORRECTION_SENT exists and new ISIR is SELECTED: loops case back to DOCUMENTS_REQUESTED"
      - "When a ConflictingInfoCase in RESOLVED_REQUIRES_CORRECTION exists and the corrected field matches: transitions it to RESOLVED"
  - method: GET
    path: /api/isir-records
    description: "List ISIR records; filterable."
    roles: [AidDirector, AidOfficer]
    code: 200
    input: ["student_id?", "aid_year_id?", "is_current?", "limit?", "offset?"]
    output: ISIRRecord[]
    side_effects: []
  - method: GET
    path: /api/isir-records/{id}
    description: "Fetch one ISIR record including computed EFC fields."
    roles: [AidDirector, AidOfficer]
    code: 200
    input: []
    output: ISIRRecord
    side_effects: []

  # --- Verification ---
  - method: GET
    path: /api/verification-cases
    description: "List verification cases; filterable by student_id, aid_year_id, isir_id."
    roles: [AidDirector, AidOfficer]
    code: 200
    input: ["student_id?", "aid_year_id?", "isir_id?", "limit?", "offset?"]
    output: VerificationCase[]
    side_effects: []
  - method: GET
    path: /api/verification-cases/{id}
    description: "Fetch a verification case."
    roles: [AidDirector, AidOfficer]
    code: 200
    input: []
    output: VerificationCase
    side_effects: []
  - method: POST
    path: /api/verification-cases/{id}/begin-review
    description: "DOCUMENTS_RECEIVED -> UNDER_REVIEW."
    roles: [AidOfficer]
    code: 200
    input: []
    output: VerificationCase
    side_effects: ["VerificationCase.version += 1"]
  - method: POST
    path: /api/verification-cases/{id}/request-documents
    description: "UNDER_REVIEW -> DOCUMENTS_REQUESTED with doc reset."
    roles: [AidOfficer]
    code: 200
    input: [doc_types]
    output: VerificationCase
    side_effects: ["Named VerificationDocument rows reset to REQUESTED"]
  - method: POST
    path: /api/verification-cases/{id}/complete-satisfied
    description: "UNDER_REVIEW -> COMPLETED_SATISFIED; computes verified EFC."
    roles: [AidOfficer]
    code: 200
    input: [resolution_notes, "verified_agi_cents?", "verified_untaxed_income_cents?", "verified_asset_net_worth_cents?", "verified_household_size?", "verified_number_in_college?"]
    output: VerificationCase
    side_effects:
      - "ISIRRecord.efc_verified_cents computed via efc_calculation VERIFIED (verified_* fields default to as-reported values when omitted)"
      - "ISIRRecord.efc_official_cents = efc_verified_cents"
  - method: POST
    path: /api/verification-cases/{id}/complete-correction
    description: "UNDER_REVIEW -> COMPLETED_CORRECTION_SENT."
    roles: [AidOfficer]
    code: 200
    input: [resolution_notes]
    output: VerificationCase
    side_effects: []
  - method: POST
    path: /api/verification-cases/{id}/waive
    description: "Any non-terminal -> WAIVED (Director override)."
    roles: [AidDirector]
    code: 200
    input: [waived_reason]
    output: VerificationCase
    side_effects: ["ISIRRecord.efc_official_cents = efc_provisional_cents"]
  - method: GET
    path: /api/verification-cases/{id}/documents
    description: "Sub-resource: documents of a case."
    roles: [AidDirector, AidOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: VerificationDocument[]
    side_effects: []
  - method: POST
    path: /api/verification-documents/{id}/mark-received
    description: "REQUESTED -> RECEIVED; may auto-advance case."
    roles: [AidOfficer]
    code: 200
    input: []
    output: VerificationDocument
    side_effects: ["received_at set; evaluates VerificationCase auto-transition"]
  - method: POST
    path: /api/verification-documents/{id}/accept
    description: "RECEIVED -> ACCEPTED."
    roles: [AidOfficer]
    code: 200
    input: []
    output: VerificationDocument
    side_effects: []
  - method: POST
    path: /api/verification-documents/{id}/reject
    description: "RECEIVED -> REJECTED."
    roles: [AidOfficer]
    code: 200
    input: [rejection_reason]
    output: VerificationDocument
    side_effects: []
  - method: POST
    path: /api/verification-documents/{id}/request-resubmission
    description: "REJECTED -> REQUESTED."
    roles: [AidOfficer]
    code: 200
    input: []
    output: VerificationDocument
    side_effects: ["received_at cleared"]

  # --- Conflicting info ---
  - method: POST
    path: /api/conflicting-info-cases
    description: "Open a conflicting-information case; captures opened_by_user_id."
    roles: [AidOfficer]
    code: 201
    input: [student_id, aid_year_id, subject_field, "claimed_value_cents?"]
    output: ConflictingInfoCase
    side_effects: ["opened_by_user_id = X-User-ID"]
  - method: GET
    path: /api/conflicting-info-cases
    description: "List conflicting-info cases; filterable by student_id, aid_year_id."
    roles: [AidDirector, AidOfficer]
    code: 200
    input: ["student_id?", "aid_year_id?", "limit?", "offset?"]
    output: ConflictingInfoCase[]
    side_effects: []
  - method: GET
    path: /api/conflicting-info-cases/{id}
    description: "Fetch a case."
    roles: [AidDirector, AidOfficer]
    code: 200
    input: []
    output: ConflictingInfoCase
    side_effects: []
  - method: POST
    path: /api/conflicting-info-cases/{id}/substantiate
    description: "OPEN -> SUBSTANTIATED."
    roles: [AidOfficer]
    code: 200
    input: []
    output: ConflictingInfoCase
    side_effects: []
  - method: POST
    path: /api/conflicting-info-cases/{id}/unsubstantiate
    description: "OPEN -> UNSUBSTANTIATED."
    roles: [AidOfficer]
    code: 200
    input: []
    output: ConflictingInfoCase
    side_effects: []
  - method: POST
    path: /api/conflicting-info-cases/{id}/resolve-requires-correction
    description: "SUBSTANTIATED -> RESOLVED_REQUIRES_CORRECTION (segregation enforced)."
    roles: [AidOfficer]
    code: 200
    input: [resolution]
    output: ConflictingInfoCase
    side_effects: ["resolved_by_user_id set"]
  - method: POST
    path: /api/conflicting-info-cases/{id}/resolve
    description: "UNSUBSTANTIATED -> RESOLVED (segregation enforced)."
    roles: [AidOfficer]
    code: 200
    input: [resolution]
    output: ConflictingInfoCase
    side_effects: ["resolved_by_user_id set"]

  # --- Professional judgment ---
  - method: POST
    path: /api/pj-cases
    description: "Submit a professional judgment case."
    roles: [AidOfficer]
    code: 201
    input: [student_id, aid_year_id, adjustment_type, requested_delta_cents, justification, "documentation_complete?"]
    output: ProfessionalJudgmentCase
    side_effects: []
  - method: GET
    path: /api/pj-cases
    description: "List PJ cases; filterable by student_id, aid_year_id."
    roles: [AidDirector, AidOfficer]
    code: 200
    input: ["student_id?", "aid_year_id?", "status?", "limit?", "offset?"]
    output: ProfessionalJudgmentCase[]
    side_effects: []
  - method: GET
    path: /api/pj-cases/{id}
    description: "Fetch a PJ case."
    roles: [AidDirector, AidOfficer]
    code: 200
    input: []
    output: ProfessionalJudgmentCase
    side_effects: []
  - method: POST
    path: /api/pj-cases/{id}/begin-review
    description: "SUBMITTED -> UNDER_REVIEW; captures reviewer."
    roles: [AidOfficer]
    code: 200
    input: []
    output: ProfessionalJudgmentCase
    side_effects: ["reviewed_by_user_id = X-User-ID"]
  - method: POST
    path: /api/pj-cases/{id}/approve
    description: "UNDER_REVIEW -> APPROVED; applies EFC/COA delta or dependency override. OCC via expected_pj_version."
    roles: [AidDirector]
    code: 200
    input: [expected_pj_version]
    output: ProfessionalJudgmentCase
    side_effects:
      - "Applies applied_efc_delta_cents or applied_coa_delta_cents or flips dependency_status"
      - "ProfessionalJudgmentCase.version += 1; Student.version += 1"
  - method: POST
    path: /api/pj-cases/{id}/deny
    description: "UNDER_REVIEW -> DENIED."
    roles: [AidDirector]
    code: 200
    input: []
    output: ProfessionalJudgmentCase
    side_effects: []

  # --- Award packages ---
  - method: POST
    path: /api/award-packages
    description: "Create a DRAFT package shell for (student_id, aid_year_id)."
    roles: [AidOfficer]
    code: 201
    input: [student_id, aid_year_id]
    output: AwardPackage
    side_effects: []
  - method: GET
    path: /api/award-packages
    description: "List packages; filterable by student_id, aid_year_id, status."
    roles: [AidDirector, AidOfficer]
    code: 200
    input: ["student_id?", "aid_year_id?", "status?", "limit?", "offset?"]
    output: AwardPackage[]
    side_effects: []
  - method: GET
    path: /api/award-packages/{id}
    description: "Fetch a package with computed totals."
    roles: [AidDirector, AidOfficer, Student]
    code: 200
    input: []
    output: AwardPackage
    side_effects: []
  - method: POST
    path: /api/award-packages/{id}/build
    description: "DRAFT -> PACKAGED; runs packaging_waterfall and creates AwardLine rows."
    roles: [AidOfficer]
    code: 200
    input: []
    output: AwardPackage
    side_effects:
      - "Creates AwardLine rows; sets snapshots; recomputes FundType.pool_reserved_cents; fires EXHAUSTED transitions; recomputes AidYear.total_packaged_cents"
  - method: POST
    path: /api/award-packages/{id}/notify
    description: "PACKAGED -> NOTIFIED; creates and sends AwardNotification."
    roles: [AidOfficer]
    code: 200
    input: []
    output: AwardPackage
    side_effects: ["Creates AwardNotification(SENT) with snapshot_total_offered_cents"]
  - method: POST
    path: /api/award-packages/{id}/accept
    description: "Student accepts full or per-line amounts. Opens OverawardCase when totals exceed COA."
    roles: [Student]
    code: 200
    input: [line_acceptances]
    output: AwardPackage
    side_effects:
      - "Per-line AwardLine transitions; pool releases; overaward_detection run"
  - method: POST
    path: /api/award-packages/{id}/decline
    description: "Student declines the entire package."
    roles: [Student]
    code: 200
    input: []
    output: AwardPackage
    side_effects: ["All OFFERED lines DECLINED; pool releases per fund"]
  - method: POST
    path: /api/award-packages/{id}/lock
    description: "ACCEPTED/PARTIALLY_ACCEPTED -> LOCKED. OCC via expected_package_version."
    roles: [AidOfficer]
    code: 200
    input: [expected_package_version]
    output: AwardPackage
    side_effects: ["version_locked_at set; AwardPackage.version += 1"]
  - method: POST
    path: /api/award-packages/{id}/revision-requests
    description: "Student requests a revision; package -> REVISION_REQUESTED."
    roles: [Student]
    code: 201
    input: [reason]
    output: RevisionRequest
    side_effects: ["AwardPackage -> REVISION_REQUESTED"]
  - method: GET
    path: /api/award-packages/{id}/award-lines
    description: "Sub-resource: lines of a package."
    roles: [AidDirector, AidOfficer, Student]
    code: 200
    input: ["limit?", "offset?"]
    output: AwardLine[]
    side_effects: []
  - method: GET
    path: /api/award-packages/{id}/notifications
    description: "Sub-resource: notifications of a package."
    roles: [AidDirector, AidOfficer, Student]
    code: 200
    input: ["limit?", "offset?"]
    output: AwardNotification[]
    side_effects: []
  - method: GET
    path: /api/award-packages/{id}/revision-requests
    description: "Sub-resource: revision requests of a package."
    roles: [AidDirector, AidOfficer, Student]
    code: 200
    input: ["limit?", "offset?"]
    output: RevisionRequest[]
    side_effects: []

  # --- Award lines / notifications / revisions ---
  - method: GET
    path: /api/award-lines
    description: "List award lines; filterable by package_id, fund_type_id, status."
    roles: [AidDirector, AidOfficer]
    code: 200
    input: ["package_id?", "fund_type_id?", "status?", "limit?", "offset?"]
    output: AwardLine[]
    side_effects: []
  - method: GET
    path: /api/award-lines/{id}
    description: "Fetch an award line."
    roles: [AidDirector, AidOfficer, Student]
    code: 200
    input: []
    output: AwardLine
    side_effects: []
  - method: POST
    path: /api/award-lines/{id}/begin-disbursement
    description: "ACCEPTED/PARTIALLY_ACCEPTED -> DISBURSING; requires package LOCKED."
    roles: [AidOfficer]
    code: 200
    input: []
    output: AwardLine
    side_effects: []
  - method: POST
    path: /api/award-lines/{id}/request-return
    description: "DISBURSED -> RETURN_REQUESTED."
    roles: [AidOfficer]
    code: 200
    input: ["reason?"]
    output: AwardLine
    side_effects: []
  - method: POST
    path: /api/award-lines/{id}/confirm-return
    description: "RETURN_REQUESTED -> RETURNED; reduces disbursed aggregates."
    roles: [AidOfficer]
    code: 200
    input: [return_cents]
    output: AwardLine
    side_effects: ["AwardLine.disbursed_cents -= return_cents", "FundType.pool_disbursed_cents -= return_cents", "AidYear.total_disbursed_cents -= return_cents"]
  - method: POST
    path: /api/award-notifications/{id}/acknowledge
    description: "SENT -> ACKNOWLEDGED by owning student."
    roles: [Student]
    code: 200
    input: []
    output: AwardNotification
    side_effects: []
  - method: GET
    path: /api/revision-requests/{id}
    description: "Fetch a revision request."
    roles: [AidDirector, AidOfficer, Student]
    code: 200
    input: []
    output: RevisionRequest
    side_effects: []
  - method: POST
    path: /api/revision-requests/{id}/begin-review
    description: "SUBMITTED -> UNDER_REVIEW."
    roles: [AidOfficer]
    code: 200
    input: []
    output: RevisionRequest
    side_effects: []
  - method: POST
    path: /api/revision-requests/{id}/approve
    description: "UNDER_REVIEW -> APPROVED; repacks the package and re-notifies."
    roles: [AidDirector]
    code: 200
    input: [decision_notes]
    output: RevisionRequest
    side_effects: ["packaging_waterfall re-run on parent package", "Package -> NOTIFIED", "New AwardNotification with incremented seq"]
  - method: POST
    path: /api/revision-requests/{id}/deny
    description: "UNDER_REVIEW -> DENIED; package returns to NOTIFIED unchanged."
    roles: [AidDirector]
    code: 200
    input: [decision_notes]
    output: RevisionRequest
    side_effects: ["Package -> NOTIFIED"]

  # --- Disbursements ---
  - method: POST
    path: /api/disbursements
    description: "Schedule a disbursement against a DISBURSING line."
    roles: [AidOfficer]
    code: 201
    input: [award_line_id, scheduled_cents, term_code]
    output: Disbursement
    side_effects: []
  - method: GET
    path: /api/disbursements
    description: "List disbursements; filterable by award_line_id."
    roles: [AidDirector, AidOfficer]
    code: 200
    input: ["award_line_id?", "status?", "limit?", "offset?"]
    output: Disbursement[]
    side_effects: []
  - method: GET
    path: /api/disbursements/{id}
    description: "Fetch a disbursement."
    roles: [AidDirector, AidOfficer]
    code: 200
    input: []
    output: Disbursement
    side_effects: []
  - method: POST
    path: /api/disbursements/{id}/evaluate-eligibility
    description: "Runs disbursement_eligibility; moves to ELIGIBILITY_PASSED or ELIGIBILITY_FAILED."
    roles: [AidOfficer]
    code: 200
    input: []
    output: Disbursement
    side_effects: ["Sets failure_reasons"]
  - method: POST
    path: /api/disbursements/{id}/reset
    description: "ELIGIBILITY_FAILED -> SCHEDULED."
    roles: [AidOfficer]
    code: 200
    input: []
    output: Disbursement
    side_effects: ["failure_reasons cleared"]
  - method: POST
    path: /api/disbursements/{id}/post
    description: "ELIGIBILITY_PASSED -> POSTED; updates all disbursed aggregates."
    roles: [AidOfficer]
    code: 200
    input: []
    output: Disbursement
    side_effects: ["AwardLine.disbursed_cents += scheduled_cents", "FundType.pool_disbursed_cents += scheduled_cents", "AidYear.total_disbursed_cents += scheduled_cents", "Evaluates AwardLine DISBURSING->DISBURSED"]
  - method: POST
    path: /api/disbursements/{id}/request-return
    description: "POSTED -> RETURN_REQUESTED."
    roles: [AidOfficer]
    code: 200
    input: []
    output: Disbursement
    side_effects: []
  - method: POST
    path: /api/disbursements/{id}/confirm-return
    description: "RETURN_REQUESTED -> RETURNED; reverses aggregates."
    roles: [AidOfficer]
    code: 200
    input: []
    output: Disbursement
    side_effects: ["Aggregates reduced by disbursed_cents"]

  # --- External aid & over-award ---
  - method: POST
    path: /api/external-aid
    description: "Report external aid; runs overaward_detection."
    roles: [AidOfficer]
    code: 201
    input: [student_id, aid_year_id, source_name, amount_cents, "counts_against_coa?"]
    output: ExternalAid
    side_effects: ["overaward_detection run; may create OverawardCase(OPEN)"]
  - method: GET
    path: /api/external-aid
    description: "List external aid; filterable by student_id, aid_year_id."
    roles: [AidDirector, AidOfficer]
    code: 200
    input: ["student_id?", "aid_year_id?", "limit?", "offset?"]
    output: ExternalAid[]
    side_effects: []
  - method: GET
    path: /api/external-aid/{id}
    description: "Fetch an external aid row."
    roles: [AidDirector, AidOfficer]
    code: 200
    input: []
    output: ExternalAid
    side_effects: []
  - method: GET
    path: /api/overaward-cases
    description: "List over-award cases; filterable by student_id, aid_year_id, status."
    roles: [AidDirector, AidOfficer]
    code: 200
    input: ["student_id?", "aid_year_id?", "status?", "limit?", "offset?"]
    output: OverawardCase[]
    side_effects: []
  - method: GET
    path: /api/overaward-cases/{id}
    description: "Fetch an over-award case."
    roles: [AidDirector, AidOfficer]
    code: 200
    input: []
    output: OverawardCase
    side_effects: []
  - method: POST
    path: /api/overaward-cases/{id}/begin-resolution
    description: "OPEN -> RESOLVING; applies ordered resolution plan."
    roles: [AidOfficer]
    code: 200
    input: [resolution_plan]
    output: OverawardCase
    side_effects: ["Per-step AwardLine.accepted_cents reductions; package/fund aggregates recomputed; may auto-transition to RESOLVED"]
  - method: POST
    path: /api/overaward-cases/{id}/rollback
    description: "RESOLVING -> OPEN; reverts plan steps exactly."
    roles: [AidOfficer]
    code: 200
    input: []
    output: OverawardCase
    side_effects: ["Plan reverted; total_accepted_cents restored exactly"]
  - method: POST
    path: /api/overaward-cases/{id}/verify
    description: "RESOLVED -> VERIFIED (Director sign-off)."
    roles: [AidDirector]
    code: 200
    input: []
    output: OverawardCase
    side_effects: []

  # --- Reconciliation ---
  - method: GET
    path: /api/reconciliation-runs/{id}
    description: "Fetch a reconciliation run."
    roles: [AidDirector]
    code: 200
    input: []
    output: ReconciliationRun
    side_effects: []
  - method: POST
    path: /api/reconciliation-runs/{id}/import-federal
    description: "DRAFT -> IMPORTED with federal reported total."
    roles: [AidDirector]
    code: 200
    input: [federal_reported_cents]
    output: ReconciliationRun
    side_effects: []
  - method: POST
    path: /api/reconciliation-runs/{id}/compare
    description: "IMPORTED -> COMPARED then auto BALANCED or VARIANCE_FOUND."
    roles: [AidDirector]
    code: 200
    input: []
    output: ReconciliationRun
    side_effects: ["Snapshots internal_posted_cents; computes variance_cents"]
  - method: POST
    path: /api/reconciliation-runs/{id}/adjustments
    description: "VARIANCE_FOUND -> ADJUSTED; net adjustment must zero the variance."
    roles: [AidDirector]
    code: 201
    input: [award_line_id, adjust_cents, reason_code]
    output: ReconciliationAdjustment
    side_effects: ["Creates adjustment row; validates net-zero rule"]
  - method: POST
    path: /api/reconciliation-runs/{id}/finalize
    description: "ADJUSTED -> BALANCED."
    roles: [AidDirector]
    code: 200
    input: []
    output: ReconciliationRun
    side_effects: ["variance_cents recomputed to 0"]
  - method: GET
    path: /api/award-lines/{id}/reconciliation-adjustments
    description: "Sub-resource: reconciliation adjustments touching an award line."
    roles: [AidDirector]
    code: 200
    input: ["limit?", "offset?"]
    output: ReconciliationAdjustment[]
    side_effects: []
  - method: GET
    path: /api/reconciliation-runs/{id}/adjustments
    description: "Sub-resource: adjustments of a run."
    roles: [AidDirector]
    code: 200
    input: ["limit?", "offset?"]
    output: ReconciliationAdjustment[]
    side_effects: []

# ---------------------------------------------------------------------------
# 1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or malformed X-User-Role / X-User-ID headers."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Caller role not in the endpoint's allowed roles."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A path id does not reference an existing entity."
  - id: ERR_REFERENCE_NOT_FOUND
    http: 404
    condition: "A foreign-key field in the request body references a non-existent entity."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The target entity's state machine has no transition for this trigger from its current state."
  - id: ERR_PARENT_STATE_BLOCKS
    http: 409
    condition: "A parent/aggregate entity's state forbids the operation (e.g., packaging while AidYear is not OPEN, disbursement while package not LOCKED)."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Caller is the same user who performed a prior step that must be segregated (conflict resolver == opener; PJ approver == reviewer)."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "Student-role caller attempts an action on a package/notification not owned by their student id."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Required field missing, wrong type, empty string where non-empty required, or unknown enum member."
  - id: ERR_FIELD_CONSTRAINT
    http: 422
    condition: "Field-level domain constraint violated (household size floor, number_in_college <= household_size, COA ordering, PJ delta sign, credits ordering)."
  - id: ERR_DUPLICATE
    http: 409
    condition: "Uniqueness constraint violated (ssn, email, fund_code per year, ISIR transaction key, package per student-year)."
  - id: ERR_RECEIVED_AT_OUT_OF_WINDOW
    http: 422
    condition: "ISIR received_at is in the future relative to the logical clock or outside the aid-year import window."
  - id: ERR_PREREQUISITE_MISSING
    http: 422
    condition: "Cross-entity prerequisite missing (no current ISIR for packaging; aid year not OPEN for import; fund activate outside DRAFT/OPEN)."
  - id: ERR_STALE_PACKAGE_VERSION
    http: 412
    condition: "expected_package_version does not match the AwardPackage's current version."
  - id: ERR_STALE_PJ_VERSION
    http: 412
    condition: "expected_pj_version does not match the ProfessionalJudgmentCase's current version."
  - id: ERR_FUND_POOL_EXHAUSTED
    http: 422
    condition: "A repack or line change would push a non-PELL fund's pool_reserved_cents above pool_budget_cents."
  - id: ERR_OVERAWARD_UNRESOLVED
    http: 422
    condition: "Acceptance attempted while an OverawardCase for (student, aid year) is OPEN/RESOLVING and totals still exceed COA."
  - id: ERR_DISBURSEMENT_AMOUNT
    http: 422
    condition: "scheduled_cents is non-positive, exceeds remaining line headroom, line not DISBURSING, or package not LOCKED."
  - id: ERR_VARIANCE_NOT_ZEROED
    http: 422
    condition: "Reconciliation adjustments do not net the variance to zero."
  - id: ERR_VERIFICATION_DOCS_INCOMPLETE
    http: 422
    condition: "complete-satisfied attempted while required doc types are not all ACCEPTED."
  - id: ERR_CONFLICTING_INFO_OPEN
    http: 422
    condition: "Verification completion attempted while a ConflictingInfoCase for the same student-year is OPEN, SUBSTANTIATED, or RESOLVED_REQUIRES_CORRECTION."
  - id: ERR_REVISION_ALREADY_PENDING
    http: 409
    condition: "A RevisionRequest in SUBMITTED or UNDER_REVIEW already exists for the package."
  - id: ERR_OVERAWARD_PLAN_INVALID
    http: 422
    condition: "Resolution plan empty, references foreign lines, reduces by non-positive or more than accepted_cents, or sums below overage_cents."

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: AidDirector
    description: "Senior financial aid director. Owns aid-year lifecycle, fund setup, PJ decisions, SAP appeals, verification waivers, revision decisions, over-award verification, reconciliation."
    identity: "opaque"
    exclusive_operations:
      - "POST /api/aid-years and all /api/aid-years/{id}/* lifecycle actions"
      - "POST /api/fund-types, POST /api/fund-types/{id}/activate"
      - "POST /api/verification-cases/{id}/waive"
      - "POST /api/pj-cases/{id}/approve, POST /api/pj-cases/{id}/deny"
      - "POST /api/students/{id}/sap-appeal"
      - "POST /api/revision-requests/{id}/approve, POST /api/revision-requests/{id}/deny"
      - "POST /api/overaward-cases/{id}/verify"
      - "All /api/reconciliation-runs/* endpoints"
      - "POST /api/_clock/set_current_utc"
    shared_operations:
      - "GET endpoints scoped to AidDirector, AidOfficer"
  - name: AidOfficer
    description: "Financial aid counselor/officer. Runs day-to-day operations: student registration, ISIR import, verification processing, conflict substantiation, packaging, disbursement operations."
    identity: "opaque"
    exclusive_operations:
      - "POST /api/students, PATCH /api/students/{id}, POST /api/students/{id}/evaluate-sap"
      - "POST /api/isir-records"
      - "All /api/verification-cases/{id}/* and /api/verification-documents/{id}/* except waive"
      - "POST /api/conflicting-info-cases and resolution actions"
      - "POST /api/pj-cases, POST /api/pj-cases/{id}/begin-review"
      - "POST /api/award-packages, build/notify/lock actions"
      - "POST /api/award-lines/{id}/begin-disbursement, request-return, confirm-return"
      - "All /api/disbursements* writes"
      - "POST /api/external-aid"
      - "POST /api/overaward-cases/{id}/begin-resolution, rollback"
      - "POST /api/revision-requests/{id}/begin-review"
    shared_operations:
      - "GET endpoints scoped to AidOfficer"
  - name: Student
    description: "The aid applicant. May view own records and act on own award package (accept/decline/revision) and acknowledge notifications."
    identity: "entity_backed:Student"
    exclusive_operations:
      - "POST /api/award-packages/{id}/accept"
      - "POST /api/award-packages/{id}/decline"
      - "POST /api/award-packages/{id}/revision-requests"
      - "POST /api/award-notifications/{id}/acknowledge"
    shared_operations:
      - "GET /api/students/{id} (self), GET /api/students/{id}/award-packages (self), GET /api/award-packages/{id} and child lists (own), GET /api/aid-years"
