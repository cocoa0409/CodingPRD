          assert:
            - "Appointment.${ap1}.start_minute == 540 and end_minute == 780 and chair_id == ${ch1}"
            - "Appointment.${ap2}.start_minute == 795 — NOT 780, because 780 < 780 + 15 still collides"
            - "Appointment.${ap2}.start_minute != 810 — one grid step is enough; the selector takes the FIRST non-colliding candidate"
            - "Appointment.${ap2}.end_minute == 1035 and chair_minutes == 240 and acuity_points == 3"
            - "Appointment.${ap2}.chair_id == ${ch1} — the same single chair, legally reused after the buffer"
            - "Appointment.${ap2}.nurse_id == ${nr1}"
            - "Chair.${ch1}.committed_minutes == 480 (240 + 240)"
            - "Nurse.${nr1}.assigned_acuity_points == 6 — admitted because [540,780) and [795,1035) share no 30-minute acuity slot, so no slot ever carries more than 3"

      - name: patient_unbuffered_half_open_double_booking_refused_at_765_then_admitted_at_780
        grounds:
          - validations.priority_97
          - calculations.staggered_start_assignment
          - errors.ERR_PATIENT_DOUBLE_BOOKED
          - entities.Appointment.fields.end_minute
        distinguishing_aspect: |
          The resource here is the PATIENT's own body, and its overlap test is
          deliberately UNBUFFERED while the chair test is buffered — the same fixture proves
          both edges at once. A second visit for the same patient starting at 765 is refused
          because 765 < 780, but a start at exactly 780 is admitted even though the chair
          rule would still reject 780 for chair A1, which is why the admitted booking lands
          on chair A2 at minute 780 rather than being pushed to 795.
        test_recipe:
          setup:
            - "One center with TWO available chairs A1 and A2, turnover buffer 15, grid 15."
            - "One nurse with acuity capacity 6 on shift 480-1140."
            - "Drug One (MID, 240-minute window, acuity 3 on a first dose) and Drug Three (LOW, 90-minute window, acuity 2 on a first dose), both without a lab gate."
            - "Patient One holds two plans: a Drug One plan and a Drug Three plan."
            - "Patient One's Drug One visit occupies [540, 780) on chair A1."
            - "The refused attempt asks for the Drug Three visit at requested_start 765, which the selector can place on the free chair A2 as [765, 855) — the chair is fine, the patient is not."
