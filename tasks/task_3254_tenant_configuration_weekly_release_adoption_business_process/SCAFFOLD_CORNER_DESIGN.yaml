scaffold_corner_design:

  # ===========================================================================
  # Section: entities — creation, defaults, computed/system fields, not-found,
  # immutability, parent relationships, enum/type constraints.
  # ===========================================================================
  - section: entities
    instances:
      - name: tenant_creation_defaults_and_system_fields
        claim_type: defaults_and_system_fields
        grounds:
          - entities.Tenant.fields.service_level_tier
          - entities.Tenant.fields.code_version
          - entities.Tenant.fields.bootstrap_admin_worker_id
        distinguishing_aspect: "Omitting service_level_tier and weekly_update_auto_apply applies defaults STANDARD/true; code_version, bootstrap_admin_worker_id, adopted_feature_count, active_membership_count are system/computed and ignore client input."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /tenants"
              payload: { tenant_name: "T-ENT1", tenant_kind: "PRODUCTION", maintenance_slot_utc: 2, service_level_tier: "BOGUS" }
              as: PlatformOperator
              captures: { err_id: $.data.error_id }
            - call: "POST /tenants"
              payload: { tenant_name: "T-ENT1", tenant_kind: "PRODUCTION", maintenance_slot_utc: 2 }
              as: PlatformOperator
              captures: { t1: $.data.id, tier: $.data.service_level_tier, auto: $.data.weekly_update_auto_apply, afc: $.data.adopted_feature_count, baw: $.data.bootstrap_admin_worker_id }
          assert:
            - "invalid enum service_level_tier BOGUS rejected: err_id == ERR_INVALID_REQUEST"
            - "tier == STANDARD and auto == true (defaults applied)"
            - "afc == 0 and active_membership_count == 0"
            - "baw references an existing Worker on ${t1} (GET /tenants/${t1}/workers/${baw} returns 200 with worker_ref BOOTSTRAP-ADMIN)"

      - name: entity_not_found_returns_404
        claim_type: not_found
        grounds:
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET with a well-formed but non-existent UUID on a nested path returns ERR_NOT_FOUND (404), validated left-to-right."
        test_recipe:
          setup: ["tenant t1 exists"]
          setup_api_calls:
            - call: "POST /tenants"
              payload: { tenant_name: "T-ENT2", tenant_kind: "PRODUCTION", maintenance_slot_utc: 2 }
              as: PlatformOperator
              captures: { t1: $.data.id, t1_admin: $.data.bootstrap_admin_worker_id }
          trigger:
            - call: "GET /tenants/${t1}/organization-units/00000000-0000-0000-0000-000000000000"
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_NOT_FOUND with http 404"

      - name: transaction_step_event_immutable_no_update
        claim_type: immutability
        grounds:
          - entities.TransactionStepEvent.fields.occurred_at
        distinguishing_aspect: "TransactionStepEvent has common_fields: false — no update endpoint exists and no version field is carried; append-only audit."
        test_recipe:
          setup: ["tenant t1 with a transaction instance that has events (reuse any initiation)"]
          setup_api_calls:
            - call: "POST /tenants"
              payload: { tenant_name: "T-ENT3", tenant_kind: "PRODUCTION", maintenance_slot_utc: 2 }
              as: PlatformOperator
              captures: { t1: $.data.id, t1_admin: $.data.bootstrap_admin_worker_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /tenants/${t1}/organization-units"
              payload: { unit_name: "U1", unit_type: "TEAM", effective_date: "2026-09-02T00:00:00Z" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { u1: $.data.id }
            - call: "POST /tenants/${t1}/workers"
              payload: { worker_ref: "MGR", full_name: "Approver", org_unit_id: "${u1}", hire_date: "2026-09-02T00:00:00Z" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { w_mgr: $.data.id }
            - call: "POST /tenants/${t1}/security-groups"
              payload: { group_name: "G1", assignment_mode: "USER_BASED", min_approvers: 1 }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { g1: $.data.id }
            - call: "POST /tenants/${t1}/security-groups/${g1}/memberships"
              payload: { worker_id: "${w_mgr}" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
            - call: "POST /tenants/${t1}/business-process-definitions"
              payload: { transaction_type: "HIRE", definition_name: "Flow" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { d1: $.data.id, d1_v: $.data.version }
            - call: "POST /tenants/${t1}/business-process-definitions/${d1}/steps"
              payload: { step_order: 1, step_kind: "APPROVAL", approver_security_group_id: "${g1}", inclusion_condition: "ALWAYS" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
            - call: "POST /tenants/${t1}/business-process-definitions/${d1}/activate"
              payload: { expected_definition_version: "${d1_v}" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
            - call: "POST /tenants/${t1}/transaction-instances"
              payload: { transaction_type: "HIRE", target_org_unit_id: "${u1}", amount: 0 }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { inst: $.data.id }
          trigger:
            - call: "GET /tenants/${t1}/transaction-instances/${inst}/events"
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
          assert:
            - "event rows expose id and created_at but no updated_at and no version (common_fields: false)"
            - "there is no PUT/PATCH/DELETE endpoint for transaction-step-events in the API surface (a PATCH to /transaction-step-events/{id} returns 404 or 405)"

      - name: cross_tenant_fk_reference_rejected
        claim_type: parent_relationship_integrity
        grounds:
          - validations[priority=4]
          - errors[ERR_CROSS_TENANT_REFERENCE]
        distinguishing_aspect: "A worker creation on tenant A naming an org unit owned by tenant B is rejected as a cross-tenant reference even though both resources exist."
        test_recipe:
          setup: ["tenants tA and tB; unit uB on tB"]
          setup_api_calls:
            - call: "POST /tenants"
              payload: { tenant_name: "T-A", tenant_kind: "PRODUCTION", maintenance_slot_utc: 2 }
              as: PlatformOperator
              captures: { tA: $.data.id, tA_admin: $.data.bootstrap_admin_worker_id }
            - call: "POST /tenants"
              payload: { tenant_name: "T-B", tenant_kind: "PRODUCTION", maintenance_slot_utc: 2 }
              as: PlatformOperator
              captures: { tB: $.data.id, tB_admin: $.data.bootstrap_admin_worker_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /tenants/${tB}/organization-units"
              payload: { unit_name: "UB", unit_type: "TEAM", effective_date: "2026-09-02T00:00:00Z" }
              as: TenantAdministrator
              as_user_id: "${tB_admin}"
              captures: { uB: $.data.id }
          trigger:
            - call: "POST /tenants/${tA}/workers"
              payload: { worker_ref: "WX", full_name: "Cross", org_unit_id: "${uB}", hire_date: "2026-09-02T00:00:00Z" }
              as: TenantAdministrator
              as_user_id: "${tA_admin}"
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_CROSS_TENANT_REFERENCE (422) — existence passed but tenant-scope isolation rejected the FK"

  # ===========================================================================
  # Section: state_machines — valid/invalid transitions, terminal lockdown,
  # initial state, side effects not covered by §1.8.
  # ===========================================================================
  - section: state_machines
    instances:
      - name: release_train_weekly_skips_opt_in
        claim_type: valid_transition
        grounds:
          - state_machines.ReleaseTrain.ANNOUNCED_to_MANDATORY_LIVE
        distinguishing_aspect: "WEEKLY_SERVICE trains move ANNOUNCED → MANDATORY_LIVE directly (no opt-in states); auto-apply tenants get code_version bumped, opt-out tenants queue until acknowledged."
        test_recipe:
          setup: ["tenants t_auto (auto apply true) and t_manual (auto apply false); weekly train w1 ANNOUNCED with mandatory_date reached"]
          setup_api_calls:
            - call: "POST /tenants"
              payload: { tenant_name: "T-WA", tenant_kind: "PRODUCTION", maintenance_slot_utc: 2 }
              as: PlatformOperator
              captures: { t_auto: $.data.id, t_auto_admin: $.data.bootstrap_admin_worker_id, cv_auto0: $.data.code_version }
            - call: "POST /tenants"
              payload: { tenant_name: "T-WM", tenant_kind: "PRODUCTION", maintenance_slot_utc: 2, weekly_update_auto_apply: false }
              as: PlatformOperator
              captures: { t_manual: $.data.id, t_manual_admin: $.data.bootstrap_admin_worker_id, cv_manual0: $.data.code_version }
            - call: "POST /release-trains"
              payload: { release_label: "W37", release_kind: "WEEKLY_SERVICE", mandatory_date: "2026-09-05T00:00:00Z" }
              as: PlatformOperator
              captures: { w1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-06T00:00:00Z" }
              as: PlatformOperator
          trigger:
            - call: "GET /tenants/${t_auto}"
              as: PlatformOperator
              captures: { cv_auto1: $.data.code_version }
            - call: "GET /tenants/${t_manual}"
              as: PlatformOperator
              captures: { cv_manual1: $.data.code_version }
            - call: "POST /tenants/${t_manual}/acknowledge-weekly-update"
              as: TenantAdministrator
              as_user_id: "${t_manual_admin}"
              captures: { cv_manual2: $.data.code_version }
          assert:
            - "ReleaseTrain.${w1}.status == MANDATORY_LIVE (no OPT_IN_OPEN/OPT_IN_CLOSED visited)"
            - "cv_auto1 != cv_auto0 (auto-applied) while cv_manual1 == cv_manual0 (queued)"
            - "cv_manual2 == cv_auto1 after acknowledgement"

      - name: terminal_state_lockdown_completed_transaction
        claim_type: terminal_lockdown
        grounds:
          - state_machines.TransactionInstance.IN_PROGRESS_to_COMPLETED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A COMPLETED transaction instance rejects further approve/return/cancel with a state error; no transitions leave terminal states."
        test_recipe:
          setup: ["tenant t1 with definition d1 (single ALWAYS APPROVAL step, approver w_mgr); instance inst COMPLETED by approval"]
          setup_api_calls:
            - call: "POST /tenants"
              payload: { tenant_name: "T-SM2", tenant_kind: "PRODUCTION", maintenance_slot_utc: 2 }
              as: PlatformOperator
              captures: { t1: $.data.id, t1_admin: $.data.bootstrap_admin_worker_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /tenants/${t1}/organization-units"
              payload: { unit_name: "U1", unit_type: "TEAM", effective_date: "2026-09-02T00:00:00Z" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { u1: $.data.id }
            - call: "POST /tenants/${t1}/workers"
              payload: { worker_ref: "INIT", full_name: "Initiator", org_unit_id: "${u1}", hire_date: "2026-09-02T00:00:00Z" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { w_init: $.data.id }
            - call: "POST /tenants/${t1}/workers"
              payload: { worker_ref: "MGR", full_name: "Approver", org_unit_id: "${u1}", hire_date: "2026-09-02T00:00:00Z" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { w_mgr: $.data.id }
            - call: "POST /tenants/${t1}/security-groups"
              payload: { group_name: "G1", assignment_mode: "USER_BASED", min_approvers: 1 }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { g1: $.data.id }
            - call: "POST /tenants/${t1}/security-groups/${g1}/memberships"
              payload: { worker_id: "${w_mgr}" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
            - call: "POST /tenants/${t1}/business-process-definitions"
              payload: { transaction_type: "HIRE", definition_name: "Flow" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { d1: $.data.id, d1_v: $.data.version }
            - call: "POST /tenants/${t1}/business-process-definitions/${d1}/steps"
              payload: { step_order: 1, step_kind: "APPROVAL", approver_security_group_id: "${g1}", inclusion_condition: "ALWAYS" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
            - call: "POST /tenants/${t1}/business-process-definitions/${d1}/activate"
              payload: { expected_definition_version: "${d1_v}" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
            - call: "POST /tenants/${t1}/transaction-instances"
              payload: { transaction_type: "HIRE", target_org_unit_id: "${u1}", amount: 0 }
              as: TenantAdministrator
              as_user_id: "${w_init}"
              captures: { inst: $.data.id }
            - call: "POST /tenants/${t1}/transaction-instances/${inst}/steps/1/approve"
              payload: {}
              as: Approver
              as_user_id: "${w_mgr}"
          trigger:
            - call: "POST /tenants/${t1}/transaction-instances/${inst}/cancel"
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_INVALID_STATE (COMPLETED is terminal)"
            - "TransactionInstance.${inst}.status remains COMPLETED"

      - name: org_unit_auto_activation_at_effective_date
        claim_type: auto_transition
        grounds:
          - state_machines.OrganizationUnit.PROPOSED_to_ACTIVE
        distinguishing_aspect: "A PROPOSED org unit auto-activates when the logical clock reaches its effective_date, and only then may it accept workers."
        test_recipe:
          setup: ["tenant t1; unit u1 created with effective_date 2026-09-10 (future) — status PROPOSED"]
          setup_api_calls:
            - call: "POST /tenants"
              payload: { tenant_name: "T-SM3", tenant_kind: "PRODUCTION", maintenance_slot_utc: 2 }
              as: PlatformOperator
              captures: { t1: $.data.id, t1_admin: $.data.bootstrap_admin_worker_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /tenants/${t1}/organization-units"
              payload: { unit_name: "U1", unit_type: "TEAM", effective_date: "2026-09-10T00:00:00Z" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { u1: $.data.id, u1_status0: $.data.status }
          trigger:
            - call: "POST /tenants/${t1}/workers"
              payload: { worker_ref: "W1", full_name: "Early", org_unit_id: "${u1}", hire_date: "2026-09-02T00:00:00Z" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { err_id: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /tenants/${t1}/workers"
              payload: { worker_ref: "W1", full_name: "Early", org_unit_id: "${u1}", hire_date: "2026-09-10T00:00:00Z" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { w1: $.data.id }
          assert:
            - "u1_status0 == PROPOSED"
            - "worker creation against a PROPOSED unit rejected: err_id == ERR_INVALID_STATE or ERR_INVALID_REQUEST (unit not ACTIVE)"
            - "after clock reaches effective_date: OrganizationUnit.${u1}.status == ACTIVE and worker ${w1} created"

      - name: tenant_suspend_blocked_by_refresh_in_flight
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Tenant.ACTIVE_to_SUSPENDED
          - errors[ERR_REFRESH_IN_FLIGHT]
        distinguishing_aspect: "Suspend on a tenant with a PLANNED refresh job is rejected with ERR_REFRESH_IN_FLIGHT."
        test_recipe:
          setup: ["t_src PRODUCTION, t_tgt SANDBOX with refresh_source t_src; PLANNED refresh job on t_tgt"]
          setup_api_calls:
            - call: "POST /tenants"
              payload: { tenant_name: "T-S4S", tenant_kind: "PRODUCTION", maintenance_slot_utc: 2 }
              as: PlatformOperator
              captures: { t_src: $.data.id }
            - call: "POST /tenants"
              payload: { tenant_name: "T-S4T", tenant_kind: "SANDBOX", maintenance_slot_utc: 2, refresh_source_tenant_id: "${t_src}" }
              as: PlatformOperator
              captures: { t_tgt: $.data.id, t_tgt_admin: $.data.bootstrap_admin_worker_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /tenants/${t_tgt}/refresh-jobs"
              payload: { source_tenant_id: "${t_src}", scheduled_at: "2026-09-05T02:00:00Z", migration_mode: "FULL_COPY" }
              as: TenantAdministrator
              as_user_id: "${t_tgt_admin}"
              captures: { rj: $.data.id }
          trigger:
            - call: "POST /tenants/${t_tgt}/suspend"
              as: PlatformOperator
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_REFRESH_IN_FLIGHT (409)"
            - "Tenant.${t_tgt}.status remains ACTIVE"

      - name: refresh_failure_leaves_target_config_atomic
        claim_type: side_effect_execution
        grounds:
          - state_machines.TenantRefreshJob.RUNNING_to_FAILED
        distinguishing_aspect: "A FAILED refresh applies zero configuration to the target tenant (all-or-nothing): definitions/groups on the target are unchanged."
        test_recipe:
          setup: ["t_src PRODUCTION with 1 ACTIVE definition; t_tgt SANDBOX; refresh job RUNNING then failed"]
          setup_api_calls:
            - call: "POST /tenants"
              payload: { tenant_name: "T-S5S", tenant_kind: "PRODUCTION", maintenance_slot_utc: 2 }
              as: PlatformOperator
              captures: { t_src: $.data.id, t_src_admin: $.data.bootstrap_admin_worker_id }
            - call: "POST /tenants"
              payload: { tenant_name: "T-S5T", tenant_kind: "SANDBOX", maintenance_slot_utc: 2, refresh_source_tenant_id: "${t_src}" }
              as: PlatformOperator
              captures: { t_tgt: $.data.id, t_tgt_admin: $.data.bootstrap_admin_worker_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /tenants/${t_src}/security-groups"
              payload: { group_name: "G", assignment_mode: "USER_BASED", min_approvers: 1 }
              as: TenantAdministrator
              as_user_id: "${t_src_admin}"
              captures: { g_src: $.data.id }
            - call: "POST /tenants/${t_src}/business-process-definitions"
              payload: { transaction_type: "EXPENSE", definition_name: "SrcFlow" }
              as: TenantAdministrator
              as_user_id: "${t_src_admin}"
              captures: { d_src: $.data.id, d_src_v: $.data.version }
            - call: "POST /tenants/${t_src}/business-process-definitions/${d_src}/steps"
              payload: { step_order: 1, step_kind: "APPROVAL", approver_security_group_id: "${g_src}", inclusion_condition: "ALWAYS" }
              as: TenantAdministrator
              as_user_id: "${t_src_admin}"
            - call: "POST /tenants/${t_src}/business-process-definitions/${d_src}/activate"
              payload: { expected_definition_version: "${d_src_v}" }
              as: TenantAdministrator
              as_user_id: "${t_src_admin}"
            - call: "POST /tenants/${t_tgt}/refresh-jobs"
              payload: { source_tenant_id: "${t_src}", scheduled_at: "2026-09-02T02:00:00Z", migration_mode: "FULL_COPY" }
              as: TenantAdministrator
              as_user_id: "${t_tgt_admin}"
              captures: { rj: $.data.id }
            - call: "POST /tenants/${t_tgt}/refresh-jobs/${rj}/start"
              as: TenantAdministrator
              as_user_id: "${t_tgt_admin}"
          trigger:
            - call: "POST /tenants/${t_tgt}/refresh-jobs/${rj}/fail"
              as: TenantAdministrator
              as_user_id: "${t_tgt_admin}"
            - call: "GET /tenants/${t_tgt}/business-process-definitions"
              as: TenantAdministrator
              as_user_id: "${t_tgt_admin}"
          assert:
            - "TenantRefreshJob.${rj}.status == FAILED"
            - "GET definitions on ${t_tgt} returns total_count == 0 (atomic no-op on failure)"

      - name: refresh_completed_fires_event_driven_connector
        claim_type: side_effect_execution
        grounds:
          - state_machines.TenantRefreshJob.RUNNING_to_COMPLETED
          - entities.IntegrationConnector.fields.subscribed_event
        distinguishing_aspect: "Completing a refresh on the target tenant enqueues an IntegrationRun (trigger_source EVENT) on each ACTIVE connector subscribed to REFRESH_COMPLETED, plus a REFRESH_COMPLETED notification."
        test_recipe:
          setup: ["t_src PRODUCTION (empty), t_tgt SANDBOX with ACTIVE EVENT_DRIVEN connector subscribed to REFRESH_COMPLETED; refresh job RUNNING"]
          setup_api_calls:
            - call: "POST /tenants"
              payload: { tenant_name: "T-S6S", tenant_kind: "PRODUCTION", maintenance_slot_utc: 2 }
              as: PlatformOperator
              captures: { t_src: $.data.id }
            - call: "POST /tenants"
              payload: { tenant_name: "T-S6T", tenant_kind: "SANDBOX", maintenance_slot_utc: 2, refresh_source_tenant_id: "${t_src}" }
              as: PlatformOperator
              captures: { t_tgt: $.data.id, t_tgt_admin: $.data.bootstrap_admin_worker_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /tenants/${t_tgt}/integration-connectors"
              payload: { connector_name: "CEV", trigger_mode: "EVENT_DRIVEN", subscribed_event: "REFRESH_COMPLETED", blackout_window_start_utc: 3, blackout_window_end_utc: 4 }
              as: IntegrationDeveloper
              captures: { c_ev: $.data.id }
            - call: "POST /tenants/${t_tgt}/integration-connectors/${c_ev}/activate"
              as: IntegrationDeveloper
            - call: "POST /tenants/${t_tgt}/refresh-jobs"
              payload: { source_tenant_id: "${t_src}", scheduled_at: "2026-09-02T02:00:00Z", migration_mode: "FULL_COPY" }
              as: TenantAdministrator
              as_user_id: "${t_tgt_admin}"
              captures: { rj: $.data.id }
            - call: "POST /tenants/${t_tgt}/refresh-jobs/${rj}/start"
              as: TenantAdministrator
              as_user_id: "${t_tgt_admin}"
          trigger:
            - call: "POST /tenants/${t_tgt}/refresh-jobs/${rj}/complete"
              as: TenantAdministrator
              as_user_id: "${t_tgt_admin}"
            - call: "GET /tenants/${t_tgt}/integration-connectors/${c_ev}/runs"
              as: IntegrationDeveloper
            - call: "GET /tenants/${t_tgt}/notifications"
              payload: {}
              as: TenantAdministrator
              as_user_id: "${t_tgt_admin}"
          assert:
            - "TenantRefreshJob.${rj}.status == COMPLETED"
            - "runs list for ${c_ev} has total_count >= 1 with trigger_source == EVENT"
            - "a Notification of kind REFRESH_COMPLETED exists for tenant ${t_tgt}"

      - name: transaction_completion_fires_event_driven_connector
