    side_effects:
      - "opening_state = CLOSED; park_state = NO_PARK; base_depth_in = 0.0; base_depth_stake_count = 0; groom_ready = false; assigned_patroller_count = 0; machine_swe_af = 0.0; park_risk_score = 0.0"
      - "rejects a serving_lift_id belonging to another season (ERR_CROSS_SEASON_REFERENCE)"

  - method: GET
    path: "/mountain-ops/terrain-areas/{id}"
    description: "Read a terrain area with its readiness, park and depth fields"
    roles: [MountainOpsDirector, SnowmakingSupervisor, GroomingLead, LiftOpsManager, Patroller, GuestServicesAgent]
    code: 200
    input: []
    output: TerrainArea
    side_effects: []

  - method: GET
    path: "/mountain-ops/terrain-areas"
    description: "List terrain areas, filterable by season, serving lift, opening state and class"
    roles: [MountainOpsDirector, SnowmakingSupervisor, GroomingLead, LiftOpsManager, Patroller, GuestServicesAgent]
    code: 200
    input: ["season_id?", "serving_lift_id?", "opening_state?", "terrain_class?", "limit?", "offset?"]
    output: TerrainArea[]
    side_effects: []

  - method: POST
    path: "/mountain-ops/terrain-areas/{id}/snow-depth-readings"
    description: "Record a snow stake reading; re-derives the area's base depth under the season policy"
    roles: [GroomingLead, SnowmakingSupervisor, Patroller, MountainOpsDirector]
    code: 201
    input: ["stake_code", "depth_in", "measured_at", "density_pct?", "source?"]
    output: SnowDepthReading
    side_effects:
      - "TerrainArea.base_depth_in and base_depth_stake_count recomputed by calculations.terrain_base_depth"
      - "readiness re-evaluation may move the area PREP -> READY or READY -> PREP"
      - "increments TerrainArea.version by 1"

  - method: GET
    path: "/mountain-ops/terrain-areas/{id}/snow-depth-readings"
    description: "List the stake readings of one terrain area"
    roles: [MountainOpsDirector, SnowmakingSupervisor, GroomingLead, LiftOpsManager, Patroller, GuestServicesAgent]
    code: 200
    input: ["stake_code?", "source?", "limit?", "offset?"]
    output: SnowDepthReading[]
    side_effects: []

  - method: POST
    path: "/mountain-ops/terrain-areas/{id}/park-build"
    description: "Declare the feature set of a terrain park; scores feature risk and records the builder for segregation of duties"
    roles: [GroomingLead, Patroller]
    code: 200
    input: [features]
    output: TerrainArea
    side_effects:
      - "park_feature_count and park_risk_score recomputed by calculations.park_risk_score"
      - "park_built_by_user_id = X-User-ID; park_inspected_by_user_id reset to null"
      - "park_state = PARK_BUILT, or PARK_CLOSED when features is empty (which also drops an OPEN park area to PATROL_HOLD)"
      - "increments TerrainArea.version by 1"

  - method: POST
    path: "/mountain-ops/terrain-areas/{id}/park-inspection"
    description: "Sign off a built terrain park; must be a different user than the builder"
    roles: [Patroller]
    code: 200
    input: ["inspection_note?"]
    output: TerrainArea
    side_effects:
      - "park_state = PARK_INSPECTED; park_inspected_by_user_id = X-User-ID"
      - "rejects X-User-ID equal to park_built_by_user_id (ERR_SOD_VIOLATION)"
      - "readiness re-evaluation may move the area PREP -> READY"
      - "increments TerrainArea.version by 1"

  - method: POST
    path: "/mountain-ops/terrain-areas/{id}/opening-decision"
    description: "Daily open/close decision for one terrain area; re-checks every readiness gate in priority order"
    roles: [MountainOpsDirector]
    code: 200
    input: ["decision", "note?"]
    output: TerrainArea
    side_effects:
      - "decision=OPEN moves READY|PATROL_HOLD -> OPEN after the ordered gate ladder (base depth, groom currency, mitigation currency, patrol staffing, park inspection, park risk, serving lift open, lift inspection validity)"
      - "decision=CLOSE moves OPEN|PATROL_HOLD -> CLOSED and defers the area's PLANNED and DISPATCHED grooming tasks"
      - "SeasonConfig.open_area_count recomputed; increments SeasonConfig.version by 1"
      - "active DayPlan open_terrain_count, terrain_open_acres, raw_ccc, guest_capacity, non_season_pool and posture recomputed; increments DayPlan.version by 1"
      - "increments TerrainArea.version by 1"

  # -- pump houses ----------------------------------------------------------
  - method: POST
    path: "/mountain-ops/pump-houses"
    description: "Register a snowmaking pump house with its pumping ceiling and gun count"
    roles: [SnowmakingSupervisor, MountainOpsDirector]
    code: 201
    input: ["season_id", "pump_house_code", "max_gpm", "gun_count", "name?", "status?"]
