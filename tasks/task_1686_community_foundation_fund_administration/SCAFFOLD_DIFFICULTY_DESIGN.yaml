            - "First approve -> error_id == ERR_GRANTEE_NOT_CLEARED"
            - "After grantee clear, second approve succeeds -> status APPROVED"

      - name: fund_activation_depends_on_agreement_executed
        grounds:
          - state_machines.Fund.PENDING_AGREEMENT_to_ACTIVE
          - state_machines.FundAgreement.DRAFT_to_EXECUTED
          - errors[ERR_AGREEMENT_NOT_EXECUTED]
        distinguishing_aspect: |
          Pair Fund -> FundAgreement (different pair than grant->grantee):
          POST /funds/{id}/activate is legal only when the fund's agreement is
          EXECUTED; with the agreement still DRAFT the activation fails
          ERR_AGREEMENT_NOT_EXECUTED even when the contribution minimum is met.
        test_recipe:
          setup:
