        distinguishing_aspect: "Dispatch is only legal to an ACTIVE PSAP whose region_code equals the crash location; an ACTIVE PSAP in OK for a TX crash fails with 409 ERR_PSAP_UNAVAILABLE and no DispatchRequest row persists."
