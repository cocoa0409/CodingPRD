          assert:
            - "HTTP 403 with data.error_id == 'ERR_ROLE_NOT_PERMITTED'"
            - "GET /advance-payments?claim_id=${cl} as ClaimsExaminer returns total_count == 0"
            - "GET /claims/${cl} as ClaimsExaminer returns payment_status == 'NONE', advance_paid_total == 0.00 and case_reserve == 28750.00"
            - "GET /reserve-entries?claim_id=${cl} as ClaimsExaminer returns total_count == 1 with entry_type == 'INITIAL_CASE'"

      - name: corner_rbac_vendor_coordinator_denied_dispatching_work_to_itself
        claim_type: peer_roles
