              as_user_id: "${seller_id}"
              captures: { asset_x: $.data.id }
            - call: "POST /asset-listings/${asset_x}/disclosures"
              payload: { occupancy_status: "VACANT", title_condition: "CLEAR" }
              as: Seller
              as_user_id: "${seller_id}"
            - call: "POST /asset-listings"
              payload: { seller_id: "${seller_id}", street_address: "12 Junction Rd", city: "Oakland", county_code: "CA-ALAMEDA", state_code: "CA", estimated_value_cents: 31000000 }
              as: Seller
              as_user_id: "${seller_id}"
              captures: { asset_y: $.data.id }
            - call: "POST /asset-listings/${asset_y}/disclosures"
              payload: { occupancy_status: "VACANT", title_condition: "CLEAR" }
              as: Seller
              as_user_id: "${seller_id}"
            - call: "POST /auction-events"
              payload: { title: "Junction Event A", county_code: "CA-ALAMEDA", starts_at: "2026-09-15T17:00:00Z", ends_at: "2026-09-15T18:00:00Z" }
              as: AuctionOps
              captures: { event_a: $.data.id, ev_a_v1: $.data.version }
            - call: "POST /auction-events"
              payload: { title: "Junction Event B", county_code: "CA-CONTRA-COSTA", starts_at: "2026-09-15T18:00:00Z", ends_at: "2026-09-15T19:00:00Z" }
              as: AuctionOps
              captures: { event_b: $.data.id, ev_b_v1: $.data.version }
            - call: "POST /auction-events/${event_a}/lots"
              payload: { asset_listing_id: "${asset_x}", lot_number: 1, lot_window_start_at: "2026-09-15T17:00:00Z", lot_window_end_at: "2026-09-15T17:30:00Z", opening_bid_cents: 20000000, reserve_price_cents: 20000000, expected_auction_event_version: "${ev_a_v1}" }
              as: AuctionOps
              captures: { lot_ax: $.data.id }
            - call: "GET /auction-events/${event_a}"
              payload: {}
              as: AuctionOps
              captures: { ev_a_v2: $.data.version }
            - call: "POST /auction-events/${event_a}/lots"
              payload: { asset_listing_id: "${asset_y}", lot_number: 2, lot_window_start_at: "2026-09-15T17:30:00Z", lot_window_end_at: "2026-09-15T18:00:00Z", opening_bid_cents: 21000000, reserve_price_cents: 21000000, expected_auction_event_version: "${ev_a_v2}" }
              as: AuctionOps
              captures: { lot_ay: $.data.id }
          trigger:
            - call: "POST /auction-events/${event_b}/lots"
              payload: { asset_listing_id: "${asset_x}", lot_number: 1, lot_window_start_at: "2026-09-15T18:00:00Z", lot_window_end_at: "2026-09-15T19:00:00Z", opening_bid_cents: 22000000, reserve_price_cents: 22000000, expected_auction_event_version: "${ev_b_v1}" }
              as: AuctionOps
              captures: { lot_bx: $.data.id }
          assert:
            - "HTTP status is 201 for the second lot on asset X"
            - "GET /auction-lots?auction_event_id=${event_a} returns total_count == 2 with ids {${lot_ax}, ${lot_ay}}"
            - "GET /auction-lots?auction_event_id=${event_b} returns total_count == 1 with id ${lot_bx}"
            - "GET /auction-lots?asset_listing_id=${asset_x} returns total_count == 2 with ids {${lot_ax}, ${lot_bx}}"
            - "GET /auction-lots?asset_listing_id=${asset_y} returns total_count == 1 with id ${lot_ay}"
            - "AuctionEvent.${event_a}.lot_count == 2 and AuctionEvent.${event_b}.lot_count == 1"
            - "AssetListing.${asset_x}.listing_status == LISTED and AssetListing.${asset_y}.listing_status == LISTED"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: trustee_sale_confirm_moves_pending_to_confirmed
        claim_type: valid_transition
        grounds:
          - state_machines.TrusteeSale.PENDING_to_CONFIRMED
          - endpoints[POST /trustee-sales/{id}/confirm]
        distinguishing_aspect: "The confirm trigger moves a PENDING sale to CONFIRMED, stores confirmation_reference and leaves postponement_count at 0 — the county reference is recorded, not merely acknowledged."
        test_recipe:
          setup:
            - "One DISCLOSURE_READY asset in CA-ALAMEDA with a PENDING TrusteeSale scheduled for 2026-09-15T18:00:00Z; the clock is 2026-08-05T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sellers"
              payload: { org_name: "Confirm Path Servicing", seller_type: "SERVICER", contact_email: "c@confirm.example", settlement_account_ref: "ACH-CONF" }
              as: PlatformAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /asset-listings"
              payload: { seller_id: "${seller_id}", street_address: "3 Confirm Way", city: "Oakland", county_code: "CA-ALAMEDA", state_code: "CA", estimated_value_cents: 25000000 }
              as: Seller
              as_user_id: "${seller_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /asset-listings/${listing_id}/disclosures"
              payload: { occupancy_status: "VACANT", title_condition: "CLEAR" }
              as: Seller
              as_user_id: "${seller_id}"
            - call: "POST /trustee-sales"
              payload: { asset_listing_id: "${listing_id}", county_code: "CA-ALAMEDA", sale_scheduled_at: "2026-09-15T18:00:00Z" }
              as: Trustee
              captures: { sale_id: $.data.id, init_status: $.data.status }
          trigger:
            - call: "POST /trustee-sales/${sale_id}/confirm"
              payload: { confirmation_reference: "TS-ALA-CONF-1" }
              as: Trustee
              captures: { status: $.data.status }
          assert:
            - "${init_status} == PENDING and ${status} == CONFIRMED"
            - "TrusteeSale.${sale_id}.confirmation_reference == TS-ALA-CONF-1"
            - "TrusteeSale.${sale_id}.postponement_count == 0 and sale_scheduled_at == 2026-09-15T18:00:00Z"
            - "AssetListing.${listing_id}.listing_status == DISCLOSURE_READY (confirming a sale does not list the asset)"

      - name: disclosures_on_already_disclosed_listing_rejected
        claim_type: precondition_enforcement
        grounds:
          - validations[priority=17]
          - errors[ERR_LISTING_NOT_IN_INTAKE]
          - state_machines.AssetListing.INTAKE_to_DISCLOSURE_READY
        distinguishing_aspect: "The INTAKE precondition is enforced per transition, so a second disclosure filing is ERR_LISTING_NOT_IN_INTAKE (409) and the first filing's occupancy_status survives untouched — the endpoint is not an upsert."
        test_recipe:
          setup:
            - "One asset listing has already filed disclosures (VACANT / CLEAR) and is DISCLOSURE_READY."
          setup_api_calls:
            - call: "POST /sellers"
              payload: { org_name: "Single Filing Bank", seller_type: "BANK", contact_email: "s@single.example", settlement_account_ref: "ACH-SING" }
              as: PlatformAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /asset-listings"
              payload: { seller_id: "${seller_id}", street_address: "6 Single St", city: "Oakland", county_code: "CA-ALAMEDA", state_code: "CA", estimated_value_cents: 24000000 }
              as: Seller
              as_user_id: "${seller_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /asset-listings/${listing_id}/disclosures"
              payload: { occupancy_status: "VACANT", title_condition: "CLEAR" }
              as: Seller
              as_user_id: "${seller_id}"
              captures: { first_ack: $.data.disclosure_ack_at }
          trigger:
            - call: "POST /asset-listings/${listing_id}/disclosures"
              payload: { occupancy_status: "OWNER_OCCUPIED", title_condition: "CLOUDED" }
              as: Seller
              as_user_id: "${seller_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 409 and ${err_id} == ERR_LISTING_NOT_IN_INTAKE"
            - "AssetListing.${listing_id}.occupancy_status == VACANT and title_condition == CLEAR"
            - "AssetListing.${listing_id}.eviction_risk_tier == LOW (unchanged by the rejected call)"
            - "AssetListing.${listing_id}.disclosure_ack_at == ${first_ack}"

      - name: open_event_stamps_opened_at_and_opens_every_pending_lot
        claim_type: side_effect_execution
        grounds:
          - state_machines.AuctionEvent.SCHEDULED_to_LIVE
          - state_machines.AuctionLot.PENDING_to_OPEN
          - entities.AuctionEvent.fields.opened_at
          - entities.AuctionLot.fields.bid_close_at
        distinguishing_aspect: "One open call fans out to EVERY PENDING lot of the event (two here) and stamps opened_at with the logical clock, while each lot's bid_close_at is seeded from its own lot_window_end_at rather than from the event's ends_at."
        test_recipe:
          setup:
            - "A REO event in CA-ALAMEDA (17:00:00Z..19:00:00Z) holds two PENDING lots on two assets with different windows: 17:00..17:30 and 17:30..19:00."
            - "Logical clock at 2026-09-15T17:05:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sellers"
              payload: { org_name: "Fanout REO", seller_type: "BANK", contact_email: "f@fanout.example", settlement_account_ref: "ACH-FAN" }
              as: PlatformAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /asset-listings"
              payload: { seller_id: "${seller_id}", street_address: "1 Fanout Rd", city: "Oakland", county_code: "CA-ALAMEDA", state_code: "CA", estimated_value_cents: 24000000 }
              as: Seller
              as_user_id: "${seller_id}"
              captures: { listing_a: $.data.id }
            - call: "POST /asset-listings/${listing_a}/disclosures"
              payload: { occupancy_status: "VACANT", title_condition: "CLEAR" }
              as: Seller
              as_user_id: "${seller_id}"
            - call: "POST /asset-listings"
              payload: { seller_id: "${seller_id}", street_address: "2 Fanout Rd", city: "Oakland", county_code: "CA-ALAMEDA", state_code: "CA", estimated_value_cents: 25000000 }
              as: Seller
              as_user_id: "${seller_id}"
              captures: { listing_b: $.data.id }
            - call: "POST /asset-listings/${listing_b}/disclosures"
              payload: { occupancy_status: "VACANT", title_condition: "CLEAR" }
              as: Seller
              as_user_id: "${seller_id}"
            - call: "POST /auction-events"
              payload: { title: "Fanout Event", county_code: "CA-ALAMEDA", starts_at: "2026-09-15T17:00:00Z", ends_at: "2026-09-15T19:00:00Z" }
              as: AuctionOps
              captures: { event_id: $.data.id, ev_v1: $.data.version }
            - call: "POST /auction-events/${event_id}/lots"
              payload: { asset_listing_id: "${listing_a}", lot_number: 1, lot_window_start_at: "2026-09-15T17:00:00Z", lot_window_end_at: "2026-09-15T17:30:00Z", opening_bid_cents: 20000000, reserve_price_cents: 20000000, expected_auction_event_version: "${ev_v1}" }
              as: AuctionOps
              captures: { lot_a: $.data.id }
            - call: "GET /auction-events/${event_id}"
              payload: {}
              as: AuctionOps
              captures: { ev_v2: $.data.version }
            - call: "POST /auction-events/${event_id}/lots"
              payload: { asset_listing_id: "${listing_b}", lot_number: 2, lot_window_start_at: "2026-09-15T17:30:00Z", lot_window_end_at: "2026-09-15T19:00:00Z", opening_bid_cents: 21000000, reserve_price_cents: 21000000, expected_auction_event_version: "${ev_v2}" }
              as: AuctionOps
              captures: { lot_b: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T17:05:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /auction-events/${event_id}/open"
              payload: {}
              as: AuctionOps
              captures: { opened_at: $.data.opened_at, status: $.data.event_status }
          assert:
            - "${status} == LIVE and ${opened_at} == 2026-09-15T17:05:00Z"
            - "AuctionLot.${lot_a}.lot_status == OPEN and bid_close_at == 2026-09-15T17:30:00Z"
            - "AuctionLot.${lot_b}.lot_status == OPEN and bid_close_at == 2026-09-15T19:00:00Z"
            - "AuctionLot.${lot_a}.extension_count == 0 and AuctionLot.${lot_b}.extension_count == 0"
            - "AuctionEvent.${event_id}.lot_count == 2"

      - name: relist_on_listed_asset_rejected
        claim_type: invalid_transitions
        grounds:
          - validations[priority=19]
          - errors[ERR_LISTING_NOT_RELISTABLE]
          - state_machines.AssetListing.UNSOLD_to_DISCLOSURE_READY
        distinguishing_aspect: "relist is legal only from {RELIST_PENDING, UNSOLD}; from LISTED it is ERR_LISTING_NOT_RELISTABLE (409) and relist_count stays 0, so an operator cannot reset the title axis on an asset that is currently in an auction roster."
        test_recipe:
          setup:
            - "One asset is LISTED because it was added as a lot to a SCHEDULED REO event; nothing has closed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sellers"
              payload: { org_name: "Relist Guard Bank", seller_type: "BANK", contact_email: "r@relist.example", settlement_account_ref: "ACH-REL" }
              as: PlatformAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /asset-listings"
              payload: { seller_id: "${seller_id}", street_address: "8 Relist Rd", city: "Oakland", county_code: "CA-ALAMEDA", state_code: "CA", estimated_value_cents: 23000000 }
              as: Seller
              as_user_id: "${seller_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /asset-listings/${listing_id}/disclosures"
              payload: { occupancy_status: "VACANT", title_condition: "CLEAR" }
              as: Seller
              as_user_id: "${seller_id}"
            - call: "POST /auction-events"
              payload: { title: "Relist Guard Event", county_code: "CA-ALAMEDA", starts_at: "2026-09-15T17:00:00Z", ends_at: "2026-09-15T19:00:00Z" }
              as: AuctionOps
              captures: { event_id: $.data.id, ev_v: $.data.version }
            - call: "POST /auction-events/${event_id}/lots"
              payload: { asset_listing_id: "${listing_id}", lot_number: 1, lot_window_start_at: "2026-09-15T17:00:00Z", lot_window_end_at: "2026-09-15T18:00:00Z", opening_bid_cents: 20000000, reserve_price_cents: 20000000, expected_auction_event_version: "${ev_v}" }
              as: AuctionOps
              captures: { lot_id: $.data.id }
          trigger:
            - call: "POST /asset-listings/${listing_id}/relist"
              payload: {}
              as: Seller
              as_user_id: "${seller_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 409 and ${err_id} == ERR_LISTING_NOT_RELISTABLE"
            - "AssetListing.${listing_id}.listing_status == LISTED and relist_count == 0"
            - "AssetListing.${listing_id}.title_clearance_status == PENDING (not reset by the rejected call)"
            - "AuctionLot.${lot_id}.lot_status == PENDING"

      - name: reschedule_on_scheduled_event_rejected
        claim_type: invalid_transitions
        grounds:
          - validations[priority=23]
          - errors[ERR_EVENT_NOT_POSTPONED]
          - state_machines.AuctionEvent.POSTPONED_to_SCHEDULED
        distinguishing_aspect: "reschedule is reachable only from POSTPONED; invoking it on a SCHEDULED event is ERR_EVENT_NOT_POSTPONED (409) and neither the window nor reschedule_count moves — the endpoint is not a generic window editor."
        test_recipe:
          setup:
            - "One SCHEDULED REO event in CA-ALAMEDA (17:00:00Z..19:00:00Z) that was never postponed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /auction-events"
              payload: { title: "Never Postponed Event", county_code: "CA-ALAMEDA", starts_at: "2026-09-15T17:00:00Z", ends_at: "2026-09-15T19:00:00Z" }
              as: AuctionOps
              captures: { event_id: $.data.id }
          trigger:
            - call: "POST /auction-events/${event_id}/reschedule"
              payload: { new_starts_at: "2026-09-22T17:00:00Z", new_ends_at: "2026-09-22T19:00:00Z" }
              as: AuctionOps
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 409 and ${err_id} == ERR_EVENT_NOT_POSTPONED"
            - "AuctionEvent.${event_id}.event_status == SCHEDULED and reschedule_count == 0"
            - "AuctionEvent.${event_id}.starts_at == 2026-09-15T17:00:00Z and ends_at == 2026-09-15T19:00:00Z"

      - name: fresh_entities_start_in_their_declared_initial_states
        claim_type: initial_state
        grounds:
          - state_machines.AssetListing.initial_state
          - state_machines.TrusteeSale.initial_state
          - state_machines.AuctionEvent.initial_state
          - state_machines.AuctionLot.initial_state
          - state_machines.Bidder.initial_state
        distinguishing_aspect: "Five state machines are seeded in one chain and each new row lands in its own declared initial state (INTAKE / PENDING / SCHEDULED / PENDING / PENDING_REVIEW) — creating a child never advances the parent's machine."
        test_recipe:
          setup:
            - "Empty database; the clock is set once to 2026-08-05T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sellers"
              payload: { org_name: "Initial States Inc", seller_type: "GSE", contact_email: "i@initial.example", settlement_account_ref: "ACH-INIT" }
              as: PlatformAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /asset-listings"
              payload: { seller_id: "${seller_id}", street_address: "1 Initial Way", city: "Oakland", county_code: "CA-ALAMEDA", state_code: "CA", estimated_value_cents: 22000000 }
              as: Seller
              as_user_id: "${seller_id}"
              captures: { listing_id: $.data.id, listing_status0: $.data.listing_status }
            - call: "POST /asset-listings/${listing_id}/disclosures"
              payload: { occupancy_status: "VACANT", title_condition: "CLEAR" }
              as: Seller
              as_user_id: "${seller_id}"
            - call: "POST /trustee-sales"
              payload: { asset_listing_id: "${listing_id}", county_code: "CA-ALAMEDA", sale_scheduled_at: "2026-09-15T18:00:00Z" }
              as: Trustee
              captures: { sale_id: $.data.id, sale_status0: $.data.status }
            - call: "POST /auction-events"
              payload: { title: "Initial States Event", county_code: "CA-ALAMEDA", starts_at: "2026-09-15T17:00:00Z", ends_at: "2026-09-15T19:00:00Z", trustee_sale_id: "${sale_id}" }
              as: AuctionOps
              captures: { event_id: $.data.id, event_status0: $.data.event_status, ev_v: $.data.version }
          trigger:
            - call: "POST /auction-events/${event_id}/lots"
              payload: { asset_listing_id: "${listing_id}", lot_number: 1, lot_window_start_at: "2026-09-15T17:00:00Z", lot_window_end_at: "2026-09-15T18:00:00Z", opening_bid_cents: 20000000, reserve_price_cents: 20000000, expected_auction_event_version: "${ev_v}" }
              as: AuctionOps
              captures: { lot_id: $.data.id, lot_status0: $.data.lot_status }
            - call: "POST /bidders"
              payload: { legal_name: "Initial State Bidder LLC", email: "b@initial.example", mailing_address: "2 Initial Way, Oakland CA" }
              as: Anonymous
              captures: { bidder_id: $.data.id, reg0: $.data.registration_status }
          assert:
            - "${listing_status0} == INTAKE"
            - "${sale_status0} == PENDING"
            - "${event_status0} == SCHEDULED"
            - "${lot_status0} == PENDING"
            - "${reg0} == PENDING_REVIEW"
            - "AssetListing.${listing_id}.title_clearance_status == PENDING (second axis also starts at its initial state)"
            - "AuctionEvent.${event_id}.event_status == SCHEDULED after the lot was added (adding a lot does not open the event)"
            - "TrusteeSale.${sale_id}.status == PENDING (binding an event does not confirm the sale)"

      - name: cancelled_trustee_sale_cannot_be_confirmed_again
        claim_type: terminal_state_lockdown
        grounds:
