  - rule_id: cross_entity_state_dependency
    instances:
      - name: flight_launch_depends_on_remote_id_module_state
        grounds:
          - validations.priority_21
          - state_machines.RemoteIdModule
          - state_machines.Flight
          - entities.RemoteIdModule.fields.verified_until
          - endpoints.POST_/drone-ops/remote-id-modules/{id}/submit-verification
        distinguishing_aspect: |
          Entity pair Flight x RemoteIdModule: an otherwise perfect PREFLIGHT_CLEARED flight
          cannot be launched because a row of a completely different entity has gone stale, and
          the rejection itself mutates that other entity (VERIFIED -> EXPIRED). Re-verifying the
          module - with no change whatsoever to the Flight row - makes the identical launch
          request succeed.
        test_recipe:
          setup:
            - "One COMMERCIAL pilot CERTIFIED at 2026-08-05T00:00:00Z, one 900 g airframe (remote_id_required true) REGISTERED at 2026-08-05T00:00:00Z."
            - "One RemoteIdModule VERIFIED with verified_until 2026-08-15T00:00:00Z."
            - "One uncontrolled class G zone and one RECREATIONAL flight for 2026-08-16T10:00:00Z .. 2026-08-16T11:00:00Z at 380 ft, pre-flight-checked and PREFLIGHT_CLEARED while the clock was still 2026-08-05T00:00:00Z."
            - "Logical clock then advanced to 2026-08-16T10:00:00Z, past the module's verified_until."
          setup_api_calls:
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/pilots"
              payload: { full_name: "Elin Haugen", email: "elin.haugen@example.com", operator_category: "COMMERCIAL" }
              as: ComplianceOfficer
              captures: { pid: $.data.id }
            - call: "POST /drone-ops/pilots/${pid}/knowledge-tests"
              payload: { test_code: "PART107_COMMERCIAL", scheduled_at: "2026-08-05T00:00:00Z" }
              as: ComplianceOfficer
              captures: { ktid: $.data.id }
            - call: "POST /drone-ops/knowledge-tests/${ktid}/grade"
              payload: { raw_score: 89 }
              as: ComplianceOfficer
            - call: "POST /drone-ops/aircraft"
              payload: { owner_pilot_id: "${pid}", model: "Lift 900", serial_number: "SN-XRID-01", takeoff_weight_g: 900, max_altitude_ft: 1000 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { acid: $.data.id }
            - call: "POST /drone-ops/aircraft/${acid}/remote-id-modules"
              payload: { module_serial: "RID-7100", broadcast_protocol: "WIFI_NAN", firmware_version: "3.0.0" }
              as: Pilot
              as_user_id: "${pid}"
              captures: { mid: $.data.id }
            - call: "POST /drone-ops/remote-id-modules/${mid}/submit-verification"
              payload: { broadcast_sample_ref: "sample-rid-7100-a" }
              as: Pilot
              as_user_id: "${pid}"
            - call: "POST /drone-ops/remote-id-modules/${mid}/verify"
              payload: { outcome: "VERIFIED", verified_until: "2026-08-15T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/aircraft/${acid}/register"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /drone-ops/airspace-zones"
              payload: { designator: "ZONE-G-XRID", class_code: "G", class_ceiling_ft: 400, requires_authorization: false, max_concurrent_authorizations: 2 }
              as: AirspaceAuthority
              captures: { zid: $.data.id }
            - call: "POST /drone-ops/flights"
              payload: { pilot_id: "${pid}", aircraft_id: "${acid}", zone_id: "${zid}", operation_category: "RECREATIONAL", planned_start: "2026-08-16T10:00:00Z", planned_end: "2026-08-16T11:00:00Z", planned_max_altitude_ft: 380, launch_latitude: 47.68, launch_longitude: -122.41 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { fid: $.data.id }
            - call: "POST /drone-ops/flights/${fid}/preflight-check"
              payload: {}
              as: Pilot
              as_user_id: "${pid}"
              captures: { check_result: $.data.result }
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-16T10:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /drone-ops/flights/${fid}/launch"
              payload: {}
              as: Pilot
              as_user_id: "${pid}"
              captures: { err: $.data.error_id }
            - call: "GET /drone-ops/remote-id-modules/${mid}"
              payload: {}
              as: Pilot
              as_user_id: "${pid}"
              captures: { module_state_after_reject: $.data.status }
            - call: "POST /drone-ops/remote-id-modules/${mid}/submit-verification"
              payload: { broadcast_sample_ref: "sample-rid-7100-b" }
              as: Pilot
              as_user_id: "${pid}"
            - call: "POST /drone-ops/remote-id-modules/${mid}/verify"
              payload: { outcome: "VERIFIED", verified_until: "2026-09-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/flights/${fid}/launch"
              payload: {}
              as: Pilot
              as_user_id: "${pid}"
              captures: { flight_state: $.data.status, started: $.data.actual_start }
          assert:
            - "${check_result} == \"PASSED\" - at check time the module was still VERIFIED with verified_until in the future, so the flight reached PREFLIGHT_CLEARED"
            - "${err} == \"ERR_REMOTE_ID_EXPIRED\" with HTTP 422 on the first launch, even though nothing about the Flight row is wrong"
            - "${module_state_after_reject} == \"EXPIRED\" - the gate transitioned the module row on its way to rejecting the launch"
            - "immediately after the rejection Flight.${fid}.status is still \"PREFLIGHT_CLEARED\" with actual_start null"
            - "the EXPIRED module accepts submit-verification (EXPIRED -> VERIFICATION_PENDING) and then verify (-> VERIFIED with verified_until \"2026-09-01T00:00:00Z\")"
            - "${flight_state} == \"IN_PROGRESS\" and ${started} == \"2026-08-16T10:00:00Z\" - the identical request now succeeds with no Flight field having been touched in between"
            - "Aircraft.${acid}.registration_status stayed \"REGISTERED\" throughout; the expiry gate never grounds the airframe"

      - name: authorization_request_depends_on_insurance_policy_state
