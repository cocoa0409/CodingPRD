          setup:
            - "One route R1 and one dock bay with parallel_van_capacity 2."
            - "Four delivery slots on R1, because at most one wave may exist per delivery_slot_id."
            - "Four FORMING waves W1..W4 on R1 with no orders (assign-dock has no order precondition)."
            - "W1 holds [08:00, 09:00), W2 holds [08:30, 09:30) — two deep, at capacity — and W4 holds [09:30, 10:00), accepted as adjacent to W2's exclusive end."
