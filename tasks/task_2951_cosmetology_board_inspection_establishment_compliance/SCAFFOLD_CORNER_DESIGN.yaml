      - name: calculation_notification_window_shrinks_to_twenty_four_hours_at_two_cases
        claim_type: constants_applied
        grounds:
          - calculations.infection_notification_deadline
          - entities.InfectionIncident.fields.notification_deadline_at
        distinguishing_aspect: "MULTI_CASE_THRESHOLD is inclusive at 2: a one-case incident reported at 2026-08-01T00:00:00Z is due 72 hours later (2026-08-04T00:00:00Z) while a two-case incident reported at the same instant is due in 24 hours (2026-08-02T00:00:00Z) — the window is chosen from case_count, never from the establishment's posture."
        test_recipe:
          setup:
            - "One establishment 'Window Spa'."
          setup_api_calls:
            - call: "POST /cosmetology/establishments"
              payload: { legal_name: "Window Spa", establishment_type: "ESTHETICS_SPA", county_code: "ABY", station_capacity: 4 }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { est_id: $.data.id }
          trigger:
            - call: "POST /cosmetology/infection-incidents"
              payload: { establishment_id: "${est_id}", case_count: 1, onset_date: "2026-07-28", narrative: "Single client reported a post-facial rash." }
              as: Inspector
              as_user_id: "insp-056"
              captures: { inc_one_id: $.data.id }
            - call: "POST /cosmetology/infection-incidents"
              payload: { establishment_id: "${est_id}", case_count: 2, onset_date: "2026-07-29", narrative: "Two clients reported post-facial folliculitis." }
              as: Inspector
              as_user_id: "insp-056"
              captures: { inc_two_id: $.data.id }
          assert:
            - "both calls return HTTP 201"
            - "InfectionIncident.${inc_one_id}.reported_at == 2026-08-01T00:00:00.000Z"
            - "InfectionIncident.${inc_one_id}.notification_deadline_at == 2026-08-04T00:00:00.000Z"
            - "InfectionIncident.${inc_two_id}.notification_deadline_at == 2026-08-02T00:00:00.000Z"
            - "both incidents have status == REPORTED and suspected_practitioner_id null"
            - "Establishment.${est_id}.compliance_posture == CLEAR"
            - "GET /cosmetology/infection-incidents?establishment_id=${est_id} returns total_count == 2"

