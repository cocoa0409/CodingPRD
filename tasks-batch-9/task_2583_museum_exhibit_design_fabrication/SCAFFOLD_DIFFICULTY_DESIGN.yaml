            - "${c1st} == APPROVED - one closure is exactly the capacity"
            - "the c2 approval -> ERR_CLOSURE_CAPACITY_EXCEEDED (409): the closed-interval sweep processes the +1 at 10:00 before the -1 at 10:00, so concurrent_peak == 2 > 1, even though the two windows are on different zones and share only a single instant"
            - "${c2st} == CANCELLED, which removes c2 from both geometries"
            - "${c3st} == APPROVED - moving the start one minute to 10:01 drops the peak back to 1, which is the precise boundary of the closed-interval semantics"
            - "${c4st} == APPROVED - the same 10:00-12:00 span that was refused project-wide is accepted on Z-A itself once requires_gallery_closure is false, because the per-zone rule is half-open and c1 merely touches it; the noise ceiling now applies and 50.0 <= 85.0 passes"
