            - { call: "POST /ltl/shipments", payload: { origin_terminal_id: "${t_chi}", destination_terminal_id: "${t_atl}", nmfc_class: "CLASS_60", actual_weight_lbs: 700, length_in: 48, width_in: 40, height_in: 48, service_standard: "STANDARD" }, as: Dispatcher, captures: { s_c: $.data.id } }
            - { call: "POST /ltl/pickup-routes", payload: { terminal_id: "${t_chi}", route_date: "2026-08-01", driver_id: "DRV-7", shift_start_minute: 480, shift_end_minute: 1020 }, as: Dispatcher, captures: { r_id: $.data.id } }
          trigger:
            - { call: "POST /ltl/pickup-stops", payload: { route_id: "${r_id}", shipment_id: "${s_a}", stop_sequence: 1, planned_arrival_minute: 480 }, as: Dispatcher, captures: { stop_a: $.data.id } }
            - { call: "POST /ltl/pickup-stops", payload: { route_id: "${r_id}", shipment_id: "${s_b}", stop_sequence: 2, planned_arrival_minute: 1020 }, as: Dispatcher, captures: { stop_b: $.data.id } }
            - { call: "POST /ltl/pickup-stops", payload: { route_id: "${r_id}", shipment_id: "${s_c}", stop_sequence: 3, planned_arrival_minute: 1021 }, as: Dispatcher, captures: { err_c: $.data.error_id } }
          assert:
            - "Stop at shift_start (480) accepted: PickupStop.${stop_a}.status == PLANNED"
            - "Stop at shift_end (1020) accepted: PickupStop.${stop_b}.status == PLANNED (closed interval)"
            - "Stop at 1021 rejected: ${err_c} == ERR_STOP_OUTSIDE_SHIFT"

