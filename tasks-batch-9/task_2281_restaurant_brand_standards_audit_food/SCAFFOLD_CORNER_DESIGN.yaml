    - name: escalation_level_is_replayed_from_the_event_ledger
      claim_type: ledger_sync
      grounds:
      - entities.EscalationEvent
      - calculations.location_agreement_status
      excluded_because:
        difficulty_instance: compensating_invariant / escalation_ledger_conserves_level_across_escalate_and_cure
        rationale: Location.escalation_level is a projection of the append-only EscalationEvent ledger, and the difficulty instance already appends OVERDUE_CRITICAL and CURE_ACCEPTED rows and asserts that
          the replayed sum, the derived agreement status and every resulting_escalation_level stamp agree at each step.
    - name: voiding_a_finalized_visit_reverses_its_entire_side_effect_set
      claim_type: compensation
      grounds:
      - state_machines.AuditVisit.FINALIZED->VOIDED
      excluded_because:
        difficulty_instance: compensating_invariant / finalize_then_void_conserves_open_action_count_and_standing
        rationale: FINALIZED -> VOIDED is a pure compensating transition, and the difficulty instance already asserts the full reversal - corrective actions to VOIDED, one VOID_REVERSAL event per appended
          event, open count and standing and brand index back to their pre-finalize values - so a corner variant would only re-check a subset.
