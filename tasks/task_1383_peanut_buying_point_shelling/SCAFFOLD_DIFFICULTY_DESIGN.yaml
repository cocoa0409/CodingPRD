  # ---------------------------------------------------------------- Rule 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: allocate_state_error_beats_fiscal_error
        grounds:
          - validations[priority=6]
          - validations[priority=11]
          - state_machines.DeliveryCall
          - errors[ERR_INVALID_STATE]
          - errors[ERR_INSUFFICIENT_ALLOCABLE_TONS]
        distinguishing_aspect: |
          Error-category pair (state vs business_fiscal): an allocate against a
          CANCELLED call with ZERO eligible stock violates both p6 (state) and
          p11 (fiscal: insufficient allocable tons); the state error must win.
          Different category pair than the safety-vs-constraint store instance.
        test_recipe:
          setup:
            - "Foundation (schedule ACTIVE, WH-G 2000 EMPTY — no receipts, so any allocate fails fiscally); contract 20t ACTIVE"
            - "Call1 (20t, dock 2026-09-10T08:00-12:00Z) created then CANCELLED (version captured after cancel)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T09:00:00Z" }, as: BuyingPointAdmin }
            - call: "POST /buying-points"
              payload: { name: "Tifton BP", crop_year: 2026, drying_rate_per_cycle_cents: 9000, quota_price_cents_per_ton: 56000, additional_price_cents_per_ton: 40000, loan_rate_quota_cents_per_ton: 35500, loan_rate_additional_cents_per_ton: 30000 }
              as: BuyingPointAdmin
              captures: { bp: $.data.id }
            - call: "POST /buying-points/growers"
              payload: { name: "Grower One", farm_number: "F-1001" }
              as: BuyingPointAdmin
              captures: { g1: $.data.id }
            - { call: "POST /buying-points/warehouses", payload: { buying_point_id: "${bp}", name: "WH-G", compartment: GENERAL, capacity_tons: 2000 }, as: BuyingPointAdmin }
            - call: "POST /buying-points/sheller-contracts"
              payload: { buying_point_id: "${bp}", sheller_ref: "sheller-acme", total_units_tons: 40.0, price_per_ton_cents: 61000, accepts_segregated: false, window_start: "2026-09-01T00:00:00Z", window_end: "2026-11-01T00:00:00Z" }
              as: BuyingPointAdmin
              captures: { ct: $.data.id }
            - { call: "POST /buying-points/sheller-contracts/${ct}/activate", payload: {}, as: BuyingPointAdmin }
            - call: "POST /buying-points/delivery-calls"
              payload: { contract_id: "${ct}", requested_tons: 20.0, dock_window_start: "2026-09-10T08:00:00Z", dock_window_end: "2026-09-10T12:00:00Z" }
              as: ShellerRep
              as_user_id: sheller-acme
              captures: { dc1: $.data.id }
            - call: "POST /buying-points/delivery-calls/${dc1}/cancel"
              payload: {}
              as: BuyingPointAdmin
              captures: { dc1_v: $.data.version }
          trigger:
            - call: "POST /buying-points/delivery-calls/${dc1}/allocate"
              payload: { expected_delivery_call_version: "${dc1_v}" }
              as: BuyingPointAdmin
              captures: { err1: $.data.error_id }
            - call: "POST /buying-points/delivery-calls"
              payload: { contract_id: "${ct}", requested_tons: 20.0, dock_window_start: "2026-09-11T08:00:00Z", dock_window_end: "2026-09-11T12:00:00Z" }
              as: ShellerRep
              as_user_id: sheller-acme
              captures: { dc2: $.data.id, dc2_v: $.data.version }
            - call: "POST /buying-points/delivery-calls/${dc2}/allocate"
              payload: { expected_delivery_call_version: "${dc2_v}" }
              as: BuyingPointAdmin
              captures: { err2: $.data.error_id }
          assert:
            - "Dual-failure call (CANCELLED + empty stock): error_id == ERR_INVALID_STATE (state p6 beats business_fiscal p11)"
            - "Contrast call (ISSUED, empty stock): error_id == ERR_INSUFFICIENT_ALLOCABLE_TONS (fiscal fires only when state is clean)"
            - "DeliveryCall.${dc1}.status == CANCELLED and DeliveryCall.${dc2}.status == ISSUED (no partial allocation persisted)"

      - name: store_safety_error_beats_capacity_error
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - state_machines.FarmerStockLoad.GRADED_to_STORED
          - errors[ERR_COMPARTMENT_SEGREGATION]
          - errors[ERR_WAREHOUSE_CAPACITY]
        distinguishing_aspect: |
          Error-category pair (business_safety vs business_constraint): storing
          a SEGREGATED load into a GENERAL warehouse that is ALSO too small
          violates p8 (aflatoxin segregation) and p9 (capacity); the safety
          error must win. Different category pair than the state-vs-fiscal
          allocate instance.
        test_recipe:
          setup:
            - "Foundation: schedule ACTIVE; WH-G GENERAL capacity 24, WH-S SEGREGATED capacity 24 (posture RESTRICTED, weigh cap 50 satisfied by 25t)"
            - "Load A 25.0t graded clean (m 9.2), aflatoxin 18.5ppb CONFIRMED => SEGREGATED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T09:00:00Z" }, as: BuyingPointAdmin }
            - call: "POST /buying-points"
              payload: { name: "Tifton BP", crop_year: 2026, drying_rate_per_cycle_cents: 9000, quota_price_cents_per_ton: 56000, additional_price_cents_per_ton: 40000, loan_rate_quota_cents_per_ton: 35500, loan_rate_additional_cents_per_ton: 30000 }
              as: BuyingPointAdmin
              captures: { bp: $.data.id }
            - call: "POST /buying-points/discount-schedules"
              payload: { schedule_code: "FALL-2026", effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", moisture_tiers: [ { up_to_pct: 8.0, discount_cents_per_ton: 0 }, { up_to_pct: 10.49, discount_cents_per_ton: 250 }, { up_to_pct: 12.0, discount_cents_per_ton: 700 }, { up_to_pct: 15.0, discount_cents_per_ton: 1500 }, { up_to_pct: null, discount_cents_per_ton: 3000 } ], foreign_material_tiers: [ { up_to_pct: 4.0, discount_cents_per_ton: 0 }, { up_to_pct: 7.0, discount_cents_per_ton: 400 }, { up_to_pct: 10.0, discount_cents_per_ton: 1000 }, { up_to_pct: null, discount_cents_per_ton: 2000 } ], damage_rate_cents_per_pct: 150 }
              as: BuyingPointAdmin
              captures: { ds: $.data.id }
            - { call: "POST /buying-points/discount-schedules/${ds}/activate", payload: {}, as: BuyingPointAdmin }
            - call: "POST /buying-points/growers"
              payload: { name: "Grower One", farm_number: "F-1001" }
              as: BuyingPointAdmin
              captures: { g1: $.data.id }
            - call: "POST /buying-points/warehouses"
              payload: { buying_point_id: "${bp}", name: "WH-G", compartment: GENERAL, capacity_tons: 24 }
              as: BuyingPointAdmin
              captures: { whg: $.data.id }
            - call: "POST /buying-points/warehouses"
              payload: { buying_point_id: "${bp}", name: "WH-S", compartment: SEGREGATED, capacity_tons: 24 }
              as: BuyingPointAdmin
              captures: { whs: $.data.id }
            - call: "POST /buying-points/loads"
              payload: { grower_id: "${g1}", crop_year: 2026 }
              as: Grower
              as_user_id: "${g1}"
              captures: { loadA: $.data.id }
            - call: "POST /buying-points/loads/${loadA}/weigh"
              payload: { gross_tons: 25.0 }
              as: BuyingPointAdmin
              captures: { la_v: $.data.version }
            - call: "POST /buying-points/loads/${loadA}/grade-sheets"
              payload: { moisture_pct: 9.2, foreign_material_pct: 5.5, damage_pct: 2.0, lsk_pct: 1.0, expected_farmer_stock_load_version: "${la_v}" }
              as: GradingInspector
              as_user_id: insp-1
              captures: { gsA: $.data.id }
            - { call: "POST /buying-points/grade-sheets/${gsA}/finalize", payload: {}, as: GradingInspector, as_user_id: insp-1 }
            - call: "POST /buying-points/loads/${loadA}/aflatoxin-certificates"
              payload: { sample_ref: "SAMP-A1" }
              as: LabTechnician
              as_user_id: lab-1
              captures: { certA: $.data.id }
            - { call: "POST /buying-points/aflatoxin-certificates/${certA}/record-result", payload: { result_ppb: 18.5 }, as: LabTechnician, as_user_id: lab-1 }
            - { call: "POST /buying-points/aflatoxin-certificates/${certA}/confirm", payload: {}, as: LabTechnician, as_user_id: lab-2 }
          trigger:
            - call: "POST /buying-points/storage-receipts"
              payload: { load_id: "${loadA}", warehouse_id: "${whg}" }
              as: BuyingPointAdmin
              captures: { err1: $.data.error_id }
            - call: "POST /buying-points/storage-receipts"
              payload: { load_id: "${loadA}", warehouse_id: "${whs}" }
              as: BuyingPointAdmin
              captures: { err2: $.data.error_id }
          assert:
            - "Dual-failure store (SEGR load into GENERAL 24t warehouse, free 24 < gross 25): error_id == ERR_COMPARTMENT_SEGREGATION (safety p8 beats constraint p9)"
            - "Contrast store into SEGREGATED 24t warehouse (compartment clean, capacity still short): error_id == ERR_WAREHOUSE_CAPACITY"
            - "FarmerStockLoad.${loadA}.status remains GRADED; no StorageReceipt exists for the load (list total_count == 0)"

  # ---------------------------------------------------------------- Rule 6
  - rule_id: boundary_precision_check
    instances:
      - name: aflatoxin_ppb_inclusive_thresholds
        grounds:
          - calculations.aflatoxin_determination
          - state_machines.AflatoxinCertificate
        distinguishing_aspect: |
          Metric ppb via record-result/confirm: 15.00 is INCLUSIVE PASS,
          50.00 is INCLUSIVE SEGREGATE, 50.01 REJECTs the load terminally —
          exact-boundary behavior on a different metric (ppb) and endpoint
          than the moisture-threshold instance.
        test_recipe:
          setup:
            - "Foundation (schedule ACTIVE, WH-G 2000); grower G1; loads A1/A2/A3 each WEIGHED 25.0t; certificate created per load"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T09:00:00Z" }, as: BuyingPointAdmin }
            - call: "POST /buying-points"
