            - { call: "POST /cohorts/${coh_id}/advance", payload: { to_status: "SCHEDULED" }, as: ProgramCoordinator, as_user_id: "coord-admin-0" }
            - { call: "POST /cohorts/${coh_id}/advance", payload: { to_status: "IN_SESSION" }, as: ProgramCoordinator, as_user_id: "coord-admin-0" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T12:00:00Z" }, as: ProgramCoordinator, as_user_id: "coord-admin-0" }
            - { call: "POST /class-sessions/${ses_a_id}/deliver", payload: {}, as: Instructor, as_user_id: "${ins_1_id}" }
            - { call: "POST /module-completions", payload: { trainee_id: "${t1_id}", class_session_id: "${ses_a_id}", attendance_minutes: 150 }, as: Instructor, as_user_id: "${ins_1_id}", captures: { mc_a_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T12:00:00Z" }, as: ProgramCoordinator, as_user_id: "coord-admin-0" }
            - { call: "POST /class-sessions/${ses_b_id}/deliver", payload: {}, as: Instructor, as_user_id: "${ins_1_id}" }
            - { call: "POST /module-completions", payload: { trainee_id: "${t1_id}", class_session_id: "${ses_b_id}", attendance_minutes: 150 }, as: Instructor, as_user_id: "${ins_1_id}", captures: { mc_b_id: $.data.id } }
            - { call: "POST /module-completions/${mc_b_id}/skills-demo", payload: { outcome: "PASS", demo_score: 88 }, as: SkillsEvaluator, as_user_id: "${ins_2_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T15:00:00Z" }, as: ProgramCoordinator, as_user_id: "coord-admin-0" }
            - { call: "POST /class-sessions/${ses_c_id}/deliver", payload: {}, as: Instructor, as_user_id: "${ins_1_id}" }
            - { call: "POST /module-completions", payload: { trainee_id: "${t1_id}", class_session_id: "${ses_c_id}", attendance_minutes: 300 }, as: Instructor, as_user_id: "${ins_1_id}", captures: { mc_c_id: $.data.id } }
          trigger:
            - { call: "GET /trainees/${t1_id}/readiness", payload: {}, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { cert_score: $.data.certified_readiness_score, prov_score: $.data.provisional_readiness_score } }
          assert:
            - "readiness.core_hours_total == 10.0"
            - "readiness.core_hours_earned_certified == 5.0"
            - "readiness.core_hours_earned_provisional == 7.5"
            - "readiness.core_ratio_certified == 0.5"
            - "readiness.core_ratio_provisional == 0.75"
            - "readiness.demo_avg_certified == 88.0"
            - "readiness.demo_avg_provisional == 79.0"
            - "readiness.recency_factor == 1.0"
            - "readiness.exercise_bonus == 0.0"
            - "readiness.certified_readiness_score == 65.20"
            - "readiness.provisional_readiness_score == 76.60"
            - "Trainee.${t1_id}.readiness_score == 65.20 - only the certified variant is ever persisted"
            - "ModuleCompletion.${mc_c_id}.status == SKILLS_PENDING and ModuleCompletion.${mc_c_id}.credited_contact_hours == 0"

      - name: equipment_settlement_depreciated_vs_full_replacement
