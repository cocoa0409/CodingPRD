scaffold_corner_design:
  - section: entities
    instances:
      - name: dca_create_success_returns_envelope_and_computed_epz
        claim_type: creation
        grounds:
          - 'endpoints."POST /licensing/dcas'
          - "entities.DesignCertification"
        distinguishing_aspect: "201 response carries response envelope meta fields plus system-computed EPZ fields; client-supplied computed fields are ignored."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /licensing/dcas"
              payload: { docket_number: "52-900", reactor_model: "SMR-77", target_power_mwt: 250, plant_net_capacity_mw: 77, source_term_fraction: 0.10, site_boundary_miles: 0.25 }
              as: DcaApplicant
              captures: { dca_id: $.data.id }
          trigger:
            - call: "GET /licensing/dcas/${dca_id}"
              payload: {}
              as: DcaApplicant
          assert:
            - "DesignCertification.${dca_id}.status == SUBMITTED (initial state)"
            - "epz_radius_deterministic_miles == 1.00"
            - "epz_radius_dose_based_miles == 5.50 (2*sqrt(0.25)=1.0 + 5*0.9=4.5)"
            - "epz_radius_selected_miles == 5.50"
            - "version == 1"
      - name: dca_missing_required_field_returns_validation_error
        claim_type: required_fields
        grounds:
          - 'endpoints."POST /licensing/dcas'
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "Omitting required docket_number produces ERR_VALIDATION 400."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /licensing/dcas"
              payload: { reactor_model: "SMR-77", target_power_mwt: 250, plant_net_capacity_mw: 77, source_term_fraction: 0.1, site_boundary_miles: 1.0 }
              as: DcaApplicant
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_VALIDATION"
      - name: get_nonexistent_dca_returns_not_found
        claim_type: not_found
        grounds:
          - 'endpoints."GET /licensing/dcas/{id}'
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "Unknown UUID on GET yields ERR_NOT_FOUND 404 with error envelope shape."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /licensing/dcas/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: DcaApplicant
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"
      - name: duplicate_docket_number_rejected
        claim_type: type_constraints
        grounds:
          - "validations[priority=17]"
          - "errors[ERR_DUPLICATE]"
        distinguishing_aspect: "Second DCA with identical docket_number fails ERR_DUPLICATE 409."
        test_recipe:
          setup: ["one DCA with docket 52-901"]
          setup_api_calls:
            - call: "POST /licensing/dcas"
              payload: { docket_number: "52-901", reactor_model: "SMR-1", target_power_mwt: 100, plant_net_capacity_mw: 50, source_term_fraction: 0.5, site_boundary_miles: 1.0 }
              as: DcaApplicant
          trigger:
            - call: "POST /licensing/dcas"
              payload: { docket_number: "52-901", reactor_model: "SMR-2", target_power_mwt: 200, plant_net_capacity_mw: 60, source_term_fraction: 0.5, site_boundary_miles: 1.0 }
              as: DcaApplicant
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_DUPLICATE"
      - name: sars_list_filtered_by_dca_id_reverse_reachability
        claim_type: listing
        grounds:
          - 'endpoints."GET /licensing/sars'
          - "entities.SafetyAnalysisReport.fields.dca_id"
        distinguishing_aspect: "GET /licensing/sars?dca_id= returns only SARs of that DCA and pagination envelope fields total_count/has_more."
        test_recipe:
          setup: ["two DCAs, one SAR on each"]
          setup_api_calls:
            - call: "POST /licensing/dcas"
              payload: { docket_number: "52-910", reactor_model: "SMR-1", target_power_mwt: 100, plant_net_capacity_mw: 50, source_term_fraction: 0.5, site_boundary_miles: 1.0 }
              as: DcaApplicant
              captures: { dca_a: $.data.id }
            - call: "POST /licensing/dcas"
              payload: { docket_number: "52-911", reactor_model: "SMR-1", target_power_mwt: 100, plant_net_capacity_mw: 50, source_term_fraction: 0.5, site_boundary_miles: 1.0 }
              as: DcaApplicant
              captures: { dca_b: $.data.id }
            - call: "POST /licensing/dcas/${dca_a}/sars"
              payload: { section_code: "CH01", revision_number: 0 }
              as: DcaApplicant
            - call: "POST /licensing/dcas/${dca_b}/sars"
              payload: { section_code: "CH01", revision_number: 0 }
              as: DcaApplicant
          trigger:
            - call: "GET /licensing/sars"
              payload: { dca_id: "${dca_a}" }
              as: DcaApplicant
              captures: { total: $.total_count }
          assert:
            - "list contains exactly the SAR of ${dca_a}; total_count == 1; has_more == false"
  - section: state_machines
    instances:
      - name: rai_accept_by_author_forbidden_segregation_of_duties
        claim_type: precondition_enforcement
        grounds:
          - "validations[priority=6]"
          - "errors[ERR_SELF_ACCEPT_FORBIDDEN]"
        distinguishing_aspect: "The NrcReviewer whose X-User-ID authored the RAI cannot accept its response; a different reviewer can."
        test_recipe:
          setup: ["RAI authored by reviewer R1 in RESPONSE_SUBMITTED"]
          setup_api_calls:
            - call: "POST /licensing/dcas"
              payload: { docket_number: "52-920", reactor_model: "SMR-1", target_power_mwt: 100, plant_net_capacity_mw: 50, source_term_fraction: 0.5, site_boundary_miles: 1.0 }
              as: DcaApplicant
              captures: { dca_id: $.data.id }
            - call: "POST /licensing/dcas/${dca_id}/sars"
              payload: { section_code: "CH03", revision_number: 0 }
              as: DcaApplicant
            - call: "POST /licensing/dcas/${dca_id}/rais"
              payload: { sar_section_code: "CH03", question_text: "Q", due_date: "2027-01-01T00:00:00Z" }
              as: NrcReviewer
              as_user_id: "rev-1"
              captures: { rai_id: $.data.id }
            - call: "POST /licensing/rais/${rai_id}/respond"
              payload: { response_text: "A" }
              as: DcaApplicant
          trigger:
            - call: "POST /licensing/rais/${rai_id}/accept"
              payload: {}
              as: NrcReviewer
              as_user_id: "rev-1"
              captures: { err: $.data.error_id }
            - call: "POST /licensing/rais/${rai_id}/accept"
              payload: {}
              as: NrcReviewer
              as_user_id: "rev-2"
          assert:
            - "first accept: err == ERR_SELF_ACCEPT_FORBIDDEN (403)"
            - "second accept by rev-2 succeeds; RAI.${rai_id}.status == ACCEPTED"
      - name: dca_terminal_withdrawn_locks_transitions
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.DesignCertification"
        distinguishing_aspect: "After WITHDRAWN, enter-safety-review and certify both fail ERR_INVALID_STATE."
        test_recipe:
          setup: ["DCA withdrawn"]
          setup_api_calls:
            - call: "POST /licensing/dcas"
              payload: { docket_number: "52-921", reactor_model: "SMR-1", target_power_mwt: 100, plant_net_capacity_mw: 50, source_term_fraction: 0.5, site_boundary_miles: 1.0 }
              as: DcaApplicant
              captures: { dca_id: $.data.id }
            - call: "POST /licensing/dcas/${dca_id}/withdraw"
              payload: {}
              as: DoeProgram
          trigger:
            - call: "POST /licensing/dcas/${dca_id}/enter-safety-review"
              payload: {}
              as: NrcReviewer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
      - name: rai_terminal_accepted_rejects_respond
        claim_type: invalid_transition
        grounds:
          - "state_machines.RAI"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Responding to an ACCEPTED RAI fails; no transition out of ACCEPTED exists."
        test_recipe:
          setup: ["RAI accepted"]
          setup_api_calls:
            - call: "POST /licensing/dcas"
              payload: { docket_number: "52-922", reactor_model: "SMR-1", target_power_mwt: 100, plant_net_capacity_mw: 50, source_term_fraction: 0.5, site_boundary_miles: 1.0 }
              as: DcaApplicant
              captures: { dca_id: $.data.id }
            - call: "POST /licensing/dcas/${dca_id}/sars"
              payload: { section_code: "CH03", revision_number: 0 }
              as: DcaApplicant
            - call: "POST /licensing/dcas/${dca_id}/rais"
              payload: { sar_section_code: "CH03", question_text: "Q", due_date: "2027-01-01T00:00:00Z" }
              as: NrcReviewer
              captures: { rai_id: $.data.id }
            - call: "POST /licensing/rais/${rai_id}/respond"
              payload: { response_text: "A" }
              as: DcaApplicant
            - call: "POST /licensing/rais/${rai_id}/accept"
              payload: {}
              as: NrcReviewer
          trigger:
            - call: "POST /licensing/rais/${rai_id}/respond"
              payload: { response_text: "A2" }
              as: DcaApplicant
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
      - name: workforce_attrition_regresses_pipeline
        claim_type: side_effect_execution
        grounds:
          - "state_machines.WorkforcePipeline.GRADUATING_to_ENROLLING"
          - "state_machines.OperatorLicense"
        distinguishing_aspect: "Revoking a license that drops graduates below required_operators regresses a STAFFED-adjacent GRADUATING pipeline to ENROLLING."
        test_recipe:
          setup: ["pipeline GRADUATING with graduates == required (1) then one revoke"]
          setup_api_calls:
            - call: "POST /licensing/dcas"
              payload: { docket_number: "52-923", reactor_model: "SMR-1", target_power_mwt: 100, plant_net_capacity_mw: 50, source_term_fraction: 0.5, site_boundary_miles: 1.0 }
              as: DcaApplicant
              captures: { dca_id: $.data.id }
            - call: "POST /licensing/dcas/${dca_id}/workforce-pipelines"
              payload: { cohort_code: "C-1", required_operators: 1 }
              as: WorkforceCoordinator
              captures: { pipe_id: $.data.id }
            - call: "POST /licensing/workforce-pipelines/${pipe_id}/start-training"
              payload: {}
              as: WorkforceCoordinator
            - call: "POST /licensing/workforce-pipelines/${pipe_id}/licenses"
              payload: { candidate_name: "Op A" }
              as: WorkforceCoordinator
              captures: { lic_id: $.data.id }
            - call: "POST /licensing/operator-licenses/${lic_id}/license"
              payload: {}
              as: WorkforceCoordinator
            - call: "POST /licensing/workforce-pipelines/${pipe_id}/advance"
              payload: {}
              as: WorkforceCoordinator
          trigger:
            - call: "POST /licensing/operator-licenses/${lic_id}/revoke"
              payload: {}
              as: WorkforceCoordinator
          assert:
            - "OperatorLicense.${lic_id}.license_status == REVOKED"
            - "WorkforcePipeline.${pipe_id}.graduates == 0"
            - "WorkforcePipeline.${pipe_id}.status == ENROLLING (attrition regression)"
      - name: test_program_fail_cascade_rejects_procured_lots
        claim_type: cascade_down
        grounds:
          - "state_machines.TestProgram.ADEQUATE_to_INSUFFICIENT"
        distinguishing_aspect: "A FAIL result on an ADEQUATE program flips it INSUFFICIENT and cascades REJECTED to PROCURED lots; DELIVERED lots are untouched (conditional cascade)."
        test_recipe:
          setup: ["ADEQUATE program with one PROCURED lot and one DELIVERED lot"]
          setup_api_calls:
            - call: "POST /licensing/dcas"
              payload: { docket_number: "52-924", reactor_model: "SMR-1", target_power_mwt: 100, plant_net_capacity_mw: 50, source_term_fraction: 0.5, site_boundary_miles: 1.0 }
              as: DcaApplicant
              captures: { dca_id: $.data.id }
            - call: "POST /licensing/dcas/${dca_id}/test-programs"
              payload: { program_code: "TP-9", required_tests: 1 }
              as: DcaApplicant
              captures: { tp_id: $.data.id }
            - call: "POST /licensing/test-programs/${tp_id}/start"
              payload: {}
              as: DcaApplicant
            - call: "POST /licensing/test-programs/${tp_id}/results"
              payload: { outcome: "PASS", run_at: "2026-09-01T00:00:00Z" }
              as: DcaApplicant
            - call: "POST /licensing/vendors"
              payload: { name: "Zeta Valves", capability_scope: "valves" }
              as: SupplyChainManager
              captures: { vendor_id: $.data.id }
            - call: "POST /licensing/vendors/${vendor_id}/qualifications"
              payload: { audit_date: "2026-09-05T00:00:00Z", defects_found: 0 }
              as: VendorAuditor
              captures: { qual_id: $.data.id }
            - call: "POST /licensing/vendors/${vendor_id}/qualifications/${qual_id}/complete-audit"
              payload: {}
              as: VendorAuditor
            - call: "POST /licensing/component-lots"
              payload: { vendor_id: "${vendor_id}", program_id: "${tp_id}", component_type: "valve", quantity: 1 }
              as: SupplyChainManager
              captures: { lot_proc: $.data.id }
            - call: "POST /licensing/component-lots"
              payload: { vendor_id: "${vendor_id}", program_id: "${tp_id}", component_type: "valve", quantity: 2 }
              as: SupplyChainManager
              captures: { lot_del: $.data.id }
            - call: "POST /licensing/component-lots/${lot_del}/deliver"
              payload: {}
              as: SupplyChainManager
          trigger:
            - call: "POST /licensing/test-programs/${tp_id}/results"
              payload: { outcome: "FAIL", run_at: "2026-09-10T00:00:00Z" }
              as: DcaApplicant
          assert:
            - "TestProgram.${tp_id}.status == INSUFFICIENT"
            - "ComponentLot.${lot_proc}.status == REJECTED (cascade)"
            - "ComponentLot.${lot_del}.status == DELIVERED (not cascaded — only PROCURED lots rejected)"
  - section: calculations
    instances:
      - name: epz_floor_and_cap_clamping
        claim_type: correct_result
        grounds:
          - "calculations.epz_radius_determination"
        distinguishing_aspect: "EPZ clamping: very low source_term (0.01) with tiny boundary (0.25) still floors selected radius at 0.5; very high source_term (1.0) caps deterministic at 10.0."
        test_recipe:
          setup: ["two DCAs at extremes"]
          setup_api_calls:
            - call: "POST /licensing/dcas"
              payload: { docket_number: "52-930", reactor_model: "SMR-1", target_power_mwt: 100, plant_net_capacity_mw: 50, source_term_fraction: 0.01, site_boundary_miles: 0.25 }
              as: DcaApplicant
              captures: { dca_lo: $.data.id }
            - call: "POST /licensing/dcas"
              payload: { docket_number: "52-931", reactor_model: "SMR-1", target_power_mwt: 100, plant_net_capacity_mw: 50, source_term_fraction: 1.0, site_boundary_miles: 100.0 }
              as: DcaApplicant
              captures: { dca_hi: $.data.id }
          trigger:
            - call: "GET /licensing/dcas/${dca_lo}"
              payload: {}
              as: DcaApplicant
            - call: "GET /licensing/dcas/${dca_hi}"
              payload: {}
              as: DcaApplicant
          assert:
            - "lo: deterministic == 0.10; dose_based == max(0.5, 2*0.5 + 5*0.99) == 5.95; selected == 5.95"
            - "hi: deterministic == 10.00; dose_based == max(0.5, 2*10 + 0) == 20.00; selected == min(10, max(10,20)) == 10.00 (cap binds)"
      - name: rai_late_response_boundary_inclusive_due_date
        claim_type: constants_applied
        grounds:
          - "entities.RAI.fields.late_response"
          - "validations[priority=7]"
        distinguishing_aspect: "responded_at exactly == due_date is timely (inclusive boundary); one second later is late."
        test_recipe:
          setup: ["two RAIs due 2026-10-01T00:00:00Z; respond at exactly due and one second after"]
          setup_api_calls:
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: DoeProgram
            - call: "POST /licensing/dcas"
              payload: { docket_number: "52-932", reactor_model: "SMR-1", target_power_mwt: 100, plant_net_capacity_mw: 50, source_term_fraction: 0.5, site_boundary_miles: 1.0 }
              as: DcaApplicant
              captures: { dca_id: $.data.id }
            - call: "POST /licensing/dcas/${dca_id}/sars"
              payload: { section_code: "CH03", revision_number: 0 }
              as: DcaApplicant
            - call: "POST /licensing/dcas/${dca_id}/rais"
              payload: { sar_section_code: "CH03", question_text: "Q1", due_date: "2026-10-01T00:00:00Z" }
              as: NrcReviewer
              captures: { rai1: $.data.id }
            - call: "POST /licensing/dcas/${dca_id}/rais"
              payload: { sar_section_code: "CH03", question_text: "Q2", due_date: "2026-10-01T00:00:00Z" }
              as: NrcReviewer
              captures: { rai2: $.data.id }
            - call: "POST /licensing/rais/${rai1}/respond"
              payload: { response_text: "on time" }
              as: DcaApplicant
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:01Z" }
              as: DoeProgram
            - call: "POST /licensing/rais/${rai2}/respond"
              payload: { response_text: "late" }
              as: DcaApplicant
          trigger:
            - call: "GET /licensing/rais"
              payload: { dca_id: "${dca_id}" }
              as: DcaApplicant
          assert:
            - "RAI.${rai1}.late_response == false (responded_at == due_date, inclusive)"
            - "RAI.${rai2}.late_response == true (responded_at > due_date)"
      - name: out_of_order_test_result_rejected
        claim_type: input_set_filtering
        grounds:
          - "validations[priority=12]"
          - "errors[ERR_OUT_OF_ORDER_RESULT]"
        distinguishing_aspect: "Chronological recording: a TestResult with run_at earlier than an existing result of the same program is rejected."
        test_recipe:
          setup: ["IN_PROGRESS program with one result at 2026-09-10"]
          setup_api_calls:
            - call: "POST /licensing/dcas"
              payload: { docket_number: "52-933", reactor_model: "SMR-1", target_power_mwt: 100, plant_net_capacity_mw: 50, source_term_fraction: 0.5, site_boundary_miles: 1.0 }
              as: DcaApplicant
              captures: { dca_id: $.data.id }
            - call: "POST /licensing/dcas/${dca_id}/test-programs"
              payload: { program_code: "TP-1", required_tests: 2 }
              as: DcaApplicant
              captures: { tp_id: $.data.id }
            - call: "POST /licensing/test-programs/${tp_id}/start"
              payload: {}
              as: DcaApplicant
            - call: "POST /licensing/test-programs/${tp_id}/results"
              payload: { outcome: "PASS", run_at: "2026-09-10T00:00:00Z" }
              as: DcaApplicant
          trigger:
            - call: "POST /licensing/test-programs/${tp_id}/results"
              payload: { outcome: "PASS", run_at: "2026-09-05T00:00:00Z" }
              as: DcaApplicant
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_OUT_OF_ORDER_RESULT"
            - "TestProgram.${tp_id}.completed_tests == 1 (rejected result not counted)"
  - section: validations
    instances:
      - name: sar_advance_blocked_by_open_rai
        claim_type: violation_to_error
        grounds:
          - "state_machines.SafetyAnalysisReport.UNDER_REVIEW_to_READY_FOR_PHASE_ADVANCE"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "SAR advance with open_rais > 0 fails ERR_INVALID_STATE; superseding the RAI clears the gate."
        test_recipe:
          setup: ["SAR UNDER_REVIEW with one OPEN RAI"]
          setup_api_calls:
            - call: "POST /licensing/dcas"
              payload: { docket_number: "52-940", reactor_model: "SMR-1", target_power_mwt: 100, plant_net_capacity_mw: 50, source_term_fraction: 0.5, site_boundary_miles: 1.0 }
              as: DcaApplicant
              captures: { dca_id: $.data.id }
            - call: "POST /licensing/dcas/${dca_id}/sars"
              payload: { section_code: "CH03", revision_number: 0 }
              as: DcaApplicant
              captures: { sar_id: $.data.id }
            - call: "POST /licensing/sars/${sar_id}/review"
              payload: {}
              as: NrcReviewer
            - call: "POST /licensing/dcas/${dca_id}/rais"
              payload: { sar_section_code: "CH03", question_text: "Q", due_date: "2027-01-01T00:00:00Z" }
              as: NrcReviewer
              captures: { rai_id: $.data.id }
          trigger:
            - call: "POST /licensing/sars/${sar_id}/advance"
              payload: {}
              as: NrcReviewer
              captures: { err: $.data.error_id }
            - call: "POST /licensing/rais/${rai_id}/supersede"
              payload: {}
              as: NrcReviewer
            - call: "POST /licensing/sars/${sar_id}/advance"
              payload: {}
              as: NrcReviewer
          assert:
            - "first advance: err == ERR_INVALID_STATE (open RAI blocks)"
            - "after supersede: advance succeeds; SAR.${sar_id}.status == READY_FOR_PHASE_ADVANCE"
      - name: rai_unknown_sar_section_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=13]"
          - "errors[ERR_SAR_SECTION_UNKNOWN]"
        distinguishing_aspect: "RAI against a section with no SAR on the same DCA fails ERR_SAR_SECTION_UNKNOWN 422."
        test_recipe:
          setup: ["DCA with SAR CH03 only"]
          setup_api_calls:
            - call: "POST /licensing/dcas"
              payload: { docket_number: "52-941", reactor_model: "SMR-1", target_power_mwt: 100, plant_net_capacity_mw: 50, source_term_fraction: 0.5, site_boundary_miles: 1.0 }
              as: DcaApplicant
              captures: { dca_id: $.data.id }
            - call: "POST /licensing/dcas/${dca_id}/sars"
              payload: { section_code: "CH03", revision_number: 0 }
              as: DcaApplicant
          trigger:
            - call: "POST /licensing/dcas/${dca_id}/rais"
              payload: { sar_section_code: "CH15", question_text: "Q", due_date: "2027-01-01T00:00:00Z" }
              as: NrcReviewer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_SAR_SECTION_UNKNOWN"
      - name: escalate_out_of_range_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=16]"
          - "errors[ERR_ESCALATION_OUT_OF_RANGE]"
        distinguishing_aspect: "overrun_usd of 0 and of 4x participant_share both rejected; only (0, 3x] accepted."
        test_recipe:
          setup: ["CSA with participant_share 1000"]
          setup_api_calls:
            - call: "POST /licensing/dcas"
              payload: { docket_number: "52-942", reactor_model: "SMR-1", target_power_mwt: 100, plant_net_capacity_mw: 50, source_term_fraction: 0.5, site_boundary_miles: 1.0 }
              as: DcaApplicant
              captures: { dca_id: $.data.id }
            - call: "POST /licensing/cost-share-agreements"
