- rule_id: priority_pair_validation_conflict
  instances:
  - name: state_beats_fiscal_on_contribution_over_limit_in_locked_year
    grounds:
    - validations[priority=6]
    - validations[priority=19]
    distinguishing_aspect: 'Category pair state (p6) vs business_fiscal (p19): a contribution POST

      that would exceed the 402(g) limit AND is aimed at a plan year in

      DRAFT (state-closed) must return ERR_INVALID_STATE (409), proving the

      state check outranks the fiscal check.

      '
    test_recipe:
      setup:
      - 'Plan year in DRAFT (never opened); one census employee cannot be created in DRAFT, so the fiscal overage is exercised
        via a contribution against an employee whose plan year regressed — instead the fixture uses CENSUS_COLLECTING -> add
        employee -> terminate-year path: simpler legal fixture is plan year DRAFT with contribution attempted against a nonexistent-in-year
        employee is FK error; to keep the dual-failure pure, the fixture uses a year that is CENSUS_COLLECTING then TERMINATED:
        contribution POST then violates both state (year TERMINATED) and fiscal (amount > 402g)'
      setup_api_calls:
      - call: POST /ndt/employers
        payload:
          legal_name: India Corp
          ein: '923456789'
          entity_type: CORPORATION
        as: PlatformAdmin
        captures:
          emp9_id: $.data.id
      - call: POST /ndt/regulatory-limits
        payload:
          year_label: 2026
          hce_comp_threshold_cents: 15500000
          key_officer_comp_threshold_cents: 22000000
          sec402g_limit_cents: 2350000
          sec415_annual_additions_limit_cents: 6900000
          dependent_care_limit_cents: 500000
