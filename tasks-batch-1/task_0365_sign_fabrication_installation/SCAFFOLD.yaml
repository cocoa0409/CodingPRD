# =============================================================================
# Sign Fabrication & Installation — benchmark seed tables (Expert)
# =============================================================================

scenario: |
  Sign Fabrication & Installation: design/art proof, material & size estimate,
  permit & site survey, fabrication work order, install crew & equipment (bucket
  truck), change order, warranty/maintenance, reorder。

domain_name: sign-fab-install
api_prefix: ""   # root-level prefix; collections are /sign-projects, /crews, /equipment, plus top-level filtered child lists

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: SignProject
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: customer_name, type: string, source: input, description: "Customer / business name" }
      - { name: site_address, type: string, source: input, description: "Street address of the install site" }
      - { name: jurisdiction_code, type: enum, source: input, description: "Permitting jurisdiction: CITY_A | CITY_B | COUNTY_C — drives permit_required and permit fee table" }
      - { name: sign_type, type: enum, source: input, description: "MONUMENT | PYLON | WALL | BLADE — drives placement_height_ft floor and equipment class" }
      - { name: face_width_in, type: number, source: input, description: "Sign face width in inches", constraints: "> 0" }
      - { name: face_height_in, type: number, source: input, description: "Sign face height in inches", constraints: "> 0" }
      - { name: placement_height_ft, type: number, source: input, description: "Height above grade where the sign face bottom sits, in feet", constraints: ">= 0" }
      - { name: illuminated, type: boolean, source: input, default: false, description: "Whether the sign is internally/externally lit (adds electrical permit requirement)" }
      - { name: rush, type: boolean, source: input, default: false, description: "Rush flag — applies rush surcharge in estimate calculation" }
      - { name: phase, type: enum, source: computed, description: "DESIGN | ESTIMATING | PERMITTING | FABRICATION | INSTALL | WARRANTY | CLOSED | CANCELLED — see §1.2 SignProject" }
      - { name: approved_estimate_id, type: string, source: computed, required: false, description: "FK -> Estimate.id; the single ACCEPTED estimate, set when an estimate is accepted, null otherwise" }
      - { name: permit_required, type: boolean, source: computed, description: "True iff jurisdiction_code != COUNTY_C OR illuminated == true — see §1.3 permit_requirement" }
      - { name: contract_total_cents, type: integer, source: computed, default: 0, description: "Running contracted amount: accepted estimate total plus sum of APPLIED ChangeOrder.delta_total_cents — see §1.3 contract_total" }

  - name: ArtProof
    parent: SignProject
    common_fields: true
    fields:
      - { name: sign_project_id, type: string, source: system, description: "FK -> SignProject.id" }
      - { name: revision_no, type: integer, source: computed, description: "1 for the first proof of a project; each successive proof is prior max + 1" }
      - { name: artwork_uri, type: string, source: input, description: "URI of the uploaded artwork asset" }
      - { name: color_count, type: integer, source: input, description: "Distinct ink/vinyl colors in the artwork", constraints: ">= 1" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | REJECTED | SUPERSEDED — see §1.2 ArtProof" }
      - { name: reject_reason, type: string, source: input, required: false, description: "Customer reason captured on REJECTED" }

  - name: Estimate
    parent: SignProject
    common_fields: true
    fields:
      - { name: sign_project_id, type: string, source: system, description: "FK -> SignProject.id" }
      - { name: art_proof_id, type: string, source: input, description: "FK -> ArtProof.id; the APPROVED proof this estimate is priced against" }
      - { name: substrate, type: enum, source: input, description: "ALUMINUM | ACRYLIC | STEEL — drives material rate in §1.3 estimate_total" }
      - { name: material_rate_cents_per_sqft, type: integer, source: computed, description: "Per-sqft material rate selected from substrate constant table" }
      - { name: area_sqft, type: number, source: computed, description: "ceil((face_width_in * face_height_in) / 144) — billed square feet, rounded UP to whole sqft" }
      - { name: material_cost_cents, type: integer, source: computed, description: "area_sqft * material_rate_cents_per_sqft" }
      - { name: labor_cost_cents, type: integer, source: computed, description: "Fabrication labor: color_count and substrate driven — see §1.3 estimate_total" }
      - { name: subtotal_cents, type: integer, source: computed, description: "material_cost_cents + labor_cost_cents" }
      - { name: surcharge_cents, type: integer, source: computed, description: "Rush + illumination surcharges — see §1.3 estimate_total" }
      - { name: total_cents, type: integer, source: computed, description: "subtotal_cents + surcharge_cents, rounded to whole cents per §1.3" }
      - { name: status, type: enum, source: system, description: "DRAFT | SENT | ACCEPTED | DECLINED | EXPIRED | SUPERSEDED — see §1.2 Estimate" }
      - { name: valid_until_iso, type: datetime, source: input, description: "Quote expiry timestamp; estimate auto-EXPIRES when clock passes this on a state read or accept attempt" }

  - name: SiteSurvey
    parent: SignProject
    common_fields: true
    fields:
      - { name: sign_project_id, type: string, source: system, description: "FK -> SignProject.id" }
      - { name: measured_clearance_ft, type: number, source: input, description: "Vertical clearance measured at the site, in feet", constraints: ">= 0" }
      - { name: overhead_obstruction, type: boolean, source: input, description: "True if power lines / canopy overhead require an aerial-restricted equipment class" }
      - { name: ground_bearing_ok, type: boolean, source: input, description: "True if footing/soil supports a MONUMENT or PYLON base" }
      - { name: status, type: enum, source: system, description: "PENDING | PASSED | FAILED — see §1.2 SiteSurvey" }

  - name: Permit
    parent: SignProject
    common_fields: true
    fields:
      - { name: sign_project_id, type: string, source: system, description: "FK -> SignProject.id" }
      - { name: permit_kind, type: enum, source: input, description: "STRUCTURAL | ELECTRICAL — ELECTRICAL is mandatory when project.illuminated" }
      - { name: fee_cents, type: integer, source: computed, description: "Jurisdiction + kind fee from §1.3 permit_fee table" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | DENIED | EXPIRED — see §1.2 Permit" }
      - { name: expires_iso, type: datetime, source: input, required: false, description: "Permit approval expiry; an APPROVED permit past this on read becomes EXPIRED" }

  - name: FabricationWorkOrder
    parent: SignProject
    common_fields: true
    fields:
      - { name: sign_project_id, type: string, source: system, description: "FK -> SignProject.id" }
      - { name: estimate_id, type: string, source: system, description: "FK -> Estimate.id; the accepted estimate snapshotted at release" }
      - { name: snapshot_total_cents, type: integer, source: computed, description: "Copy of estimate.total_cents at release time; frozen for the WO lifetime" }
      - { name: status, type: enum, source: system, description: "RELEASED | IN_PRODUCTION | QC_HOLD | READY_FOR_INSTALL | CANCELLED — see §1.2 FabricationWorkOrder" }
      - { name: qc_pass, type: boolean, source: input, required: false, description: "QC outcome supplied on the QC_HOLD -> READY_FOR_INSTALL / IN_PRODUCTION decision" }

  - name: InstallJob
    parent: SignProject
    common_fields: true
    fields:
      - { name: sign_project_id, type: string, source: system, description: "FK -> SignProject.id" }
      - { name: work_order_id, type: string, source: system, description: "FK -> FabricationWorkOrder.id; the READY_FOR_INSTALL work order being installed" }
      - { name: crew_id, type: string, source: input, description: "FK -> Crew.id; assigned install crew" }
      - { name: equipment_id, type: string, source: input, required: false, description: "FK -> Equipment.id; required only when required_equipment_class != NONE" }
      - { name: required_equipment_class, type: enum, source: computed, description: "NONE | LADDER | BUCKET_TRUCK — derived from placement_height_ft and site survey — see §1.3 equipment_requirement" }
      - { name: window_start_iso, type: datetime, source: input, description: "Scheduled install window start (UTC)" }
      - { name: window_end_iso, type: datetime, source: input, description: "Scheduled install window end (UTC)", constraints: "window_end_iso > window_start_iso" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | DISPATCHED | INSTALLED | FAILED | CANCELLED — see §1.2 InstallJob" }

  - name: Crew
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Crew identifier / lead name" }
      - { name: certified_aerial, type: boolean, source: input, default: false, description: "True if crew is certified to operate BUCKET_TRUCK equipment" }
      - { name: active, type: boolean, source: input, default: true, description: "Whether crew is available for assignment" }

  - name: Equipment
    parent: null
    common_fields: true
    fields:
      - { name: asset_tag, type: string, source: input, description: "Asset tag / unit number" }
      - { name: equipment_class, type: enum, source: input, description: "LADDER | BUCKET_TRUCK" }
      - { name: max_reach_ft, type: number, source: input, description: "Maximum working reach height in feet", constraints: "> 0" }
      - { name: in_service, type: boolean, source: input, default: true, description: "False if the unit is down for maintenance and unbookable" }

  - name: ChangeOrder
    parent: SignProject
    common_fields: true
    fields:
      - { name: sign_project_id, type: string, source: system, description: "FK -> SignProject.id" }
      - { name: reason, type: string, source: input, description: "Why the change is requested" }
      - { name: new_face_width_in, type: number, source: input, required: false, description: "Proposed new face width (inches); null = unchanged" }
      - { name: new_face_height_in, type: number, source: input, required: false, description: "Proposed new face height (inches); null = unchanged" }
      - { name: new_substrate, type: enum, source: input, required: false, description: "Proposed new substrate ALUMINUM|ACRYLIC|STEEL; null = unchanged" }
      - { name: delta_total_cents, type: integer, source: computed, description: "Re-priced estimate total under the new scope minus the accepted estimate total — signed — see §1.3 change_order_delta" }
      - { name: status, type: enum, source: system, description: "PROPOSED | APPROVED | APPLIED | REJECTED — see §1.2 ChangeOrder" }

  - name: WarrantyClaim
    parent: SignProject
    common_fields: true
    fields:
      - { name: sign_project_id, type: string, source: system, description: "FK -> SignProject.id" }
      - { name: install_job_id, type: string, source: input, description: "FK -> InstallJob.id; the INSTALLED job being claimed against" }
      - { name: defect_kind, type: enum, source: input, description: "ELECTRICAL | STRUCTURAL | COSMETIC — drives coverage window in §1.3 warranty_coverage" }
      - { name: reported_iso, type: datetime, source: input, description: "When the defect was reported (UTC)" }
      - { name: covered, type: boolean, source: computed, description: "True iff reported_iso is within the defect_kind coverage window measured from install date — see §1.3 warranty_coverage" }
      - { name: status, type: enum, source: system, description: "OPEN | APPROVED | DENIED | RESOLVED — see §1.2 WarrantyClaim" }

  - name: Reorder
    parent: SignProject
    common_fields: true
    fields:
      - { name: sign_project_id, type: string, source: system, description: "FK -> SignProject.id; the CLOSED source project being re-ordered" }
      - { name: reorder_project_id, type: string, source: computed, description: "FK -> SignProject.id; the new project cloned from the source on confirm" }
      - { name: quantity, type: integer, source: input, description: "Number of identical signs to reproduce", constraints: ">= 1" }
      - { name: reprice, type: boolean, source: input, default: true, description: "If true, the cloned project re-prices at current material rates; if false, it carries the source contract_total_cents" }
      - { name: status, type: enum, source: system, description: "REQUESTED | CONFIRMED | CANCELLED — see §1.2 Reorder" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # --- SignProject phase (compound: derived/advanced by child milestones) -----
  - entity: SignProject
    initial_state: DESIGN
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DESIGN
        to: ESTIMATING
        trigger: "system: an ArtProof for the project transitions to APPROVED"
        actor: system
        preconditions: ["project.phase == DESIGN"]
        side_effects: ["phase -> ESTIMATING"]

      - from: ESTIMATING
        to: PERMITTING
        trigger: "system: an Estimate for the project transitions to ACCEPTED"
        actor: system
        preconditions: ["project.phase == ESTIMATING"]
        side_effects:
          - "approved_estimate_id set to the accepted Estimate.id"
          - "contract_total_cents set to accepted Estimate.total_cents"
          - "phase -> PERMITTING"

      - from: PERMITTING
        to: FABRICATION
        trigger: "POST /sign-projects/{id}/fabrication-work-orders (release work order)"
        actor: ShopManager
        preconditions:
          - "project.phase == PERMITTING"
          - "SiteSurvey exists with status == PASSED (ERR_SURVEY_NOT_PASSED)"
          - "If permit_required: every required Permit kind is APPROVED and not EXPIRED (ERR_PERMIT_NOT_APPROVED)"
        side_effects: ["phase -> FABRICATION", "a FabricationWorkOrder is created in RELEASED"]

      - from: FABRICATION
        to: INSTALL
        trigger: "system: the FabricationWorkOrder transitions to READY_FOR_INSTALL"
        actor: system
        preconditions: ["project.phase == FABRICATION"]
        side_effects: ["phase -> INSTALL"]

      - from: INSTALL
        to: WARRANTY
        trigger: "system: the InstallJob transitions to INSTALLED"
        actor: system
        preconditions: ["project.phase == INSTALL"]
        side_effects: ["phase -> WARRANTY", "warranty clock starts at InstallJob INSTALLED timestamp"]

      - from: WARRANTY
        to: CLOSED
        trigger: "POST /sign-projects/{id}/close"
        actor: ShopManager
        preconditions:
          - "project.phase == WARRANTY"
          - "No WarrantyClaim for the project is in OPEN or APPROVED (ERR_OPEN_CLAIM)"
        side_effects: ["phase -> CLOSED"]

      - from: DESIGN
        to: CANCELLED
        trigger: "POST /sign-projects/{id}/cancel"
        actor: ShopManager
        preconditions: ["project.phase IN {DESIGN, ESTIMATING, PERMITTING}"]
        side_effects:
          - "phase -> CANCELLED"
          - "every non-terminal ArtProof (DRAFT/SUBMITTED) -> SUPERSEDED"
          - "every non-terminal Estimate (DRAFT/SENT) -> SUPERSEDED"
        note: "Same cancel transition is valid from ESTIMATING and PERMITTING; FABRICATION onward cannot cancel (ERR_INVALID_STATE)."

      - from: ESTIMATING
        to: CANCELLED
        trigger: "POST /sign-projects/{id}/cancel"
        actor: ShopManager
        preconditions: ["project.phase IN {DESIGN, ESTIMATING, PERMITTING}"]
        side_effects:
          - "phase -> CANCELLED"
          - "every non-terminal ArtProof (DRAFT/SUBMITTED) -> SUPERSEDED"
          - "every non-terminal Estimate (DRAFT/SENT) -> SUPERSEDED"

      - from: PERMITTING
        to: CANCELLED
        trigger: "POST /sign-projects/{id}/cancel"
        actor: ShopManager
        preconditions: ["project.phase IN {DESIGN, ESTIMATING, PERMITTING}"]
        side_effects:
          - "phase -> CANCELLED"
          - "every non-terminal ArtProof (DRAFT/SUBMITTED) -> SUPERSEDED"
          - "every non-terminal Estimate (DRAFT/SENT) -> SUPERSEDED"

  # --- ArtProof (cyclic: revision loop via SUPERSEDED) ------------------------
  - entity: ArtProof
    initial_state: DRAFT
    terminal_states: [APPROVED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /sign-projects/{id}/art-proofs/{proof_id}/submit"
        actor: Designer
        preconditions: ["proof.status == DRAFT", "project.phase == DESIGN"]
        side_effects: []

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /sign-projects/{id}/art-proofs/{proof_id}/decision (decision=APPROVE)"
        actor: Customer
        preconditions:
          - "proof.status == SUBMITTED"
          - "No other ArtProof of this project is already APPROVED (ERR_PROOF_ALREADY_APPROVED)"
        side_effects:
          - "project.phase DESIGN -> ESTIMATING (cross-entity bubble-up)"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /sign-projects/{id}/art-proofs/{proof_id}/decision (decision=REJECT)"
        actor: Customer
        preconditions: ["proof.status == SUBMITTED"]
        side_effects: ["reject_reason stored"]
        note: "REJECTED is not terminal: a new revision proof may be created, looping the design back."

      - from: REJECTED
        to: SUPERSEDED
        trigger: "system: a new ArtProof revision is created for the same project"
        actor: system
        preconditions: []
        side_effects: ["new ArtProof created in DRAFT with revision_no = prior max + 1"]
        note: "Cycle: REJECTED proof is closed out as SUPERSEDED while the new DRAFT revision continues the loop."

  # --- Estimate (auto-expiry; supersede on re-quote) --------------------------
  - entity: Estimate
    initial_state: DRAFT
    terminal_states: [ACCEPTED, DECLINED, EXPIRED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SENT
        trigger: "POST /sign-projects/{id}/estimates/{estimate_id}/send"
        actor: ShopManager
        preconditions: ["estimate.status == DRAFT"]
        side_effects: []

      - from: SENT
        to: ACCEPTED
        trigger: "POST /sign-projects/{id}/estimates/{estimate_id}/accept"
        actor: Customer
        preconditions:
          - "estimate.status == SENT"
          - "clock now < estimate.valid_until_iso (else auto -> EXPIRED, ERR_ESTIMATE_EXPIRED)"
          - "No other Estimate of this project is ACCEPTED (ERR_ESTIMATE_ALREADY_ACCEPTED)"
        side_effects:
          - "project.approved_estimate_id set; project.contract_total_cents = estimate.total_cents"
          - "project.phase ESTIMATING -> PERMITTING (cross-entity bubble-up)"
          - "every other SENT/DRAFT Estimate of this project -> SUPERSEDED"

      - from: SENT
        to: DECLINED
        trigger: "POST /sign-projects/{id}/estimates/{estimate_id}/decline"
        actor: Customer
        preconditions: ["estimate.status == SENT"]
        side_effects: []

      - from: SENT
        to: EXPIRED
        trigger: "system: clock passes valid_until_iso (observed on read/accept)"
        actor: system
        preconditions: ["estimate.status == SENT", "clock now >= valid_until_iso"]
        side_effects: []

  # --- SiteSurvey -------------------------------------------------------------
  - entity: SiteSurvey
    initial_state: PENDING
    terminal_states: [PASSED, FAILED]
    transitions:
      - from: PENDING
        to: PASSED
        trigger: "POST /sign-projects/{id}/site-surveys/{survey_id}/decide (result=PASS)"
        actor: Surveyor
        preconditions:
          - "survey.status == PENDING"
          - "measured_clearance_ft >= placement_height_ft (ERR_CLEARANCE_INSUFFICIENT)"
          - "If sign_type IN {MONUMENT, PYLON}: ground_bearing_ok == true (ERR_GROUND_BEARING_FAILED)"
        side_effects: []

      - from: PENDING
        to: FAILED
        trigger: "POST /sign-projects/{id}/site-surveys/{survey_id}/decide (result=FAIL)"
        actor: Surveyor
        preconditions: ["survey.status == PENDING"]
        side_effects: []

  # --- Permit -----------------------------------------------------------------
  - entity: Permit
    initial_state: DRAFT
    terminal_states: [APPROVED, DENIED, EXPIRED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /sign-projects/{id}/permits/{permit_id}/submit"
        actor: PermitClerk
        preconditions: ["permit.status == DRAFT", "project.permit_required == true (ERR_PERMIT_NOT_REQUIRED)"]
        side_effects: []

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /sign-projects/{id}/permits/{permit_id}/decide (decision=APPROVE)"
        actor: PermitClerk
        preconditions: ["permit.status == SUBMITTED"]
        side_effects: []

      - from: SUBMITTED
        to: DENIED
        trigger: "POST /sign-projects/{id}/permits/{permit_id}/decide (decision=DENY)"
        actor: PermitClerk
        preconditions: ["permit.status == SUBMITTED"]
        side_effects: []

      - from: APPROVED
        to: EXPIRED
        trigger: "system: clock passes expires_iso (observed on read or work-order release)"
        actor: system
        preconditions: ["permit.status == APPROVED", "clock now >= expires_iso"]
        side_effects: []

  # --- FabricationWorkOrder (branching: QC fork) ------------------------------
  - entity: FabricationWorkOrder
    initial_state: RELEASED
    terminal_states: [READY_FOR_INSTALL, CANCELLED]
    transitions:
      - from: RELEASED
        to: IN_PRODUCTION
        trigger: "POST /sign-projects/{id}/fabrication-work-orders/{wo_id}/start"
        actor: ShopManager
        preconditions: ["wo.status == RELEASED"]
        side_effects: []

      - from: IN_PRODUCTION
        to: QC_HOLD
        trigger: "POST /sign-projects/{id}/fabrication-work-orders/{wo_id}/qc-hold"
        actor: ShopManager
        preconditions: ["wo.status == IN_PRODUCTION"]
        side_effects: []

      - from: QC_HOLD
        to: READY_FOR_INSTALL
        trigger: "POST /sign-projects/{id}/fabrication-work-orders/{wo_id}/qc-decide (qc_pass=true)"
        actor: ShopManager
        preconditions: ["wo.status == QC_HOLD"]
        side_effects: ["project.phase FABRICATION -> INSTALL (cross-entity bubble-up)"]
        note: "Branch A of the QC fork."

      - from: QC_HOLD
        to: IN_PRODUCTION
        trigger: "POST /sign-projects/{id}/fabrication-work-orders/{wo_id}/qc-decide (qc_pass=false)"
        actor: ShopManager
        preconditions: ["wo.status == QC_HOLD"]
        side_effects: []
        note: "Branch B of the QC fork: rework loop back to production (cycle)."

      - from: RELEASED
        to: CANCELLED
        trigger: "POST /sign-projects/{id}/fabrication-work-orders/{wo_id}/cancel"
        actor: ShopManager
        preconditions: ["wo.status IN {RELEASED, IN_PRODUCTION, QC_HOLD}"]
        side_effects: ["project.phase FABRICATION -> CANCELLED"]

  # --- InstallJob (cross-entity + temporal overlap) ---------------------------
  - entity: InstallJob
    initial_state: SCHEDULED
    terminal_states: [INSTALLED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: DISPATCHED
        trigger: "POST /sign-projects/{id}/install-jobs/{job_id}/dispatch"
        actor: ShopManager
        preconditions:
          - "job.status == SCHEDULED"
          - "Crew.active == true (ERR_CREW_UNAVAILABLE)"
          - "If required_equipment_class == BUCKET_TRUCK: Crew.certified_aerial == true (ERR_CREW_NOT_CERTIFIED)"
        side_effects: []

      - from: DISPATCHED
        to: INSTALLED
        trigger: "POST /sign-projects/{id}/install-jobs/{job_id}/complete"
        actor: ShopManager
        preconditions: ["job.status == DISPATCHED"]
        side_effects:
          - "project.phase INSTALL -> WARRANTY (cross-entity bubble-up)"
          - "warranty coverage clock anchored at this completion timestamp"

      - from: DISPATCHED
        to: FAILED
        trigger: "POST /sign-projects/{id}/install-jobs/{job_id}/fail"
        actor: ShopManager
        preconditions: ["job.status == DISPATCHED"]
        side_effects: ["crew & equipment booking released for the window"]
        note: "FAILED is not terminal: a new InstallJob may be scheduled (reschedule loop)."

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /sign-projects/{id}/install-jobs/{job_id}/cancel"
        actor: ShopManager
        preconditions: ["job.status IN {SCHEDULED, DISPATCHED}"]
        side_effects: ["crew & equipment booking released for the window"]

  # --- ChangeOrder ------------------------------------------------------------
  - entity: ChangeOrder
    initial_state: PROPOSED
    terminal_states: [APPLIED, REJECTED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /sign-projects/{id}/change-orders/{co_id}/approve"
        actor: Customer
        preconditions:
          - "co.status == PROPOSED"
          - "project.phase IN {PERMITTING, FABRICATION} (ERR_CHANGE_WINDOW_CLOSED)"
        side_effects: []

      - from: APPROVED
        to: APPLIED
        trigger: "POST /sign-projects/{id}/change-orders/{co_id}/apply"
        actor: ShopManager
        preconditions:
          - "co.status == APPROVED"
          - "project.phase IN {PERMITTING, FABRICATION} (ERR_CHANGE_WINDOW_CLOSED)"
        side_effects:
          - "project face_width_in/face_height_in/substrate updated to the proposed scope"
          - "project.contract_total_cents += co.delta_total_cents (compensating ledger sync)"
          - "If a FabricationWorkOrder exists in IN_PRODUCTION/QC_HOLD: WO -> CANCELLED and a new RELEASED WO is created (cascade); project.phase reset to FABRICATION if it had advanced"

      - from: PROPOSED
        to: REJECTED
        trigger: "POST /sign-projects/{id}/change-orders/{co_id}/reject"
        actor: Customer
        preconditions: ["co.status == PROPOSED"]
        side_effects: []

  # --- WarrantyClaim ----------------------------------------------------------
  - entity: WarrantyClaim
    initial_state: OPEN
    terminal_states: [RESOLVED, DENIED]
    transitions:
      - from: OPEN
        to: APPROVED
        trigger: "POST /sign-projects/{id}/warranty-claims/{claim_id}/decide (decision=APPROVE)"
        actor: ShopManager
        preconditions: ["claim.status == OPEN", "claim.covered == true (ERR_OUT_OF_WARRANTY)"]
        side_effects: []

      - from: OPEN
        to: DENIED
        trigger: "POST /sign-projects/{id}/warranty-claims/{claim_id}/decide (decision=DENY)"
        actor: ShopManager
        preconditions: ["claim.status == OPEN"]
        side_effects: []

      - from: APPROVED
        to: RESOLVED
        trigger: "POST /sign-projects/{id}/warranty-claims/{claim_id}/resolve"
        actor: ShopManager
        preconditions: ["claim.status == APPROVED"]
        side_effects: []

  # --- Reorder ----------------------------------------------------------------
  - entity: Reorder
    initial_state: REQUESTED
    terminal_states: [CONFIRMED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /sign-projects/{id}/reorders/{reorder_id}/confirm"
        actor: ShopManager
        preconditions:
          - "reorder.status == REQUESTED"
          - "source project.phase == CLOSED (ERR_SOURCE_NOT_CLOSED)"
        side_effects:
          - "a new SignProject is created in DESIGN cloning the source's sign/dimension fields"
          - "reorder_project_id set to the new project's id"
          - "If reprice==false: new project.contract_total_cents = source.contract_total_cents"

      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /sign-projects/{id}/reorders/{reorder_id}/cancel"
        actor: ShopManager
        preconditions: ["reorder.status == REQUESTED"]
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: estimate-accept-stale-project
    parent_entity: SignProject
    write_endpoint: "POST /sign-projects/{id}/estimates/{estimate_id}/accept"
    occ_field: "expected_sign_project_version"
    description: |
      Accepting an Estimate against a SignProject whose version has advanced
      since the client last observed it is rejected. The accept legitimately
      supersedes any other SENT/DRAFT estimate and mutates the project ledger;
      a stale client view (e.g. another estimate was accepted and the project
      already left ESTIMATING) must lose on the version check.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: change-order-apply-stale-project
    parent_entity: SignProject
    write_endpoint: "POST /sign-projects/{id}/change-orders/{co_id}/apply"
    occ_field: "expected_sign_project_version"
    description: |
      Applying an approved ChangeOrder against a SignProject whose version has
      advanced since the client last observed it is rejected. Apply re-prices
      the contract ledger and may supersede the in-flight work order; a stale
      view (another change order already applied, advancing the version) must
      lose on the version check rather than double-apply a delta.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: estimate_total
    trigger: "POST /sign-projects/{id}/estimates (estimate creation); re-run by change_order_delta"
    algorithm: tiered_pricing
    formula: |
      area_sqft = ceil((face_width_in * face_height_in) / 144.0)        # whole sqft, ceil
      material_rate_cents_per_sqft = MATERIAL_RATE[substrate]
      material_cost_cents = area_sqft * material_rate_cents_per_sqft
      # labor: base color setup PER COLOR, then a substrate multiplier on the color labor only
      color_labor_cents = color_count * COLOR_SETUP_CENTS
      labor_cost_cents = round_half_up(color_labor_cents * SUBSTRATE_LABOR_MULT[substrate])
      subtotal_cents = material_cost_cents + labor_cost_cents
      # surcharges computed on subtotal, applied in PINNED order: illumination first, THEN rush
      illum_surcharge_cents = (project.illuminated ? round_half_up(subtotal_cents * ILLUM_PCT) : 0)
      rush_base_cents        = subtotal_cents + illum_surcharge_cents      # rush stacks on illum-inflated base
      rush_surcharge_cents   = (project.rush ? round_half_up(rush_base_cents * RUSH_PCT) : 0)
      surcharge_cents = illum_surcharge_cents + rush_surcharge_cents
      total_cents = subtotal_cents + surcharge_cents
    input_set: "face dims + illuminated + rush from the SignProject; substrate + color_count from the Estimate; the APPROVED art proof's color_count is authoritative"
    constants:
      MATERIAL_RATE: { ALUMINUM: 1800, ACRYLIC: 2600, STEEL: 3400 }   # cents per sqft
      COLOR_SETUP_CENTS: 4500
      SUBSTRATE_LABOR_MULT: { ALUMINUM: 1.00, ACRYLIC: 1.25, STEEL: 1.50 }
      ILLUM_PCT: 0.15
      RUSH_PCT: 0.20
    precision: "integer cents; each round_half_up applied at the named step (rounding order is pinned: per-component round, illum before rush)"
    variants:
      - name: base_quote
        when: "Estimate creation on the original project scope"
        difference: "uses the SignProject's current face dims and the Estimate's substrate/color_count"
      - name: rescope_quote
        when: "invoked inside change_order_delta against the ChangeOrder's proposed scope"
        difference: "substitutes new_face_width_in / new_face_height_in / new_substrate where non-null, keeps color_count from the accepted estimate's proof; the delta is rescope_total - accepted_estimate.total_cents"

  - name: change_order_delta
    trigger: "POST /sign-projects/{id}/change-orders (change order creation)"
    algorithm: forward_looking
    formula: |
      # re-price the WHOLE sign under the proposed scope, then diff against the accepted contract baseline
      effective_width  = co.new_face_width_in  ?? project.face_width_in
      effective_height = co.new_face_height_in ?? project.face_height_in
      effective_substrate = co.new_substrate   ?? accepted_estimate.substrate
      rescope_total = estimate_total(width=effective_width, height=effective_height,
                                     substrate=effective_substrate,
                                     color_count=accepted_estimate_proof.color_count,
                                     illuminated=project.illuminated, rush=project.rush)
      delta_total_cents = rescope_total - accepted_estimate.total_cents      # signed
    input_set: "the project's accepted Estimate (baseline) and the ChangeOrder's proposed overrides"
    constants: {}
    precision: "integer cents; delta is the signed difference of two estimate_total runs (final round occurs inside each run, not on the difference)"
    variants:
      - name: dimensional_delta
        when: "only face dimensions change"
        difference: "substrate held from accepted estimate; area-driven material + labor multiplier re-evaluated"
      - name: substrate_delta
        when: "substrate changes (with or without dims)"
        difference: "material rate AND labor multiplier both shift; can be negative if downgrading STEEL->ALUMINUM"

  - name: equipment_requirement
    trigger: "POST /sign-projects/{id}/install-jobs (install job creation)"
    algorithm: threshold
    formula: |
      # required equipment derived from placement height and survey obstruction
      if placement_height_ft <= LADDER_MAX_FT and not survey.overhead_obstruction:
          required_equipment_class = (placement_height_ft <= HANDS_MAX_FT ? NONE : LADDER)
      else:
          required_equipment_class = BUCKET_TRUCK
      # boundary: exactly LADDER_MAX_FT with no obstruction => LADDER (uses <=)
      # validation at create time: if required is BUCKET_TRUCK, equipment_id REQUIRED and
      #   chosen Equipment.equipment_class == BUCKET_TRUCK and max_reach_ft >= placement_height_ft
    input_set: "SignProject.placement_height_ft and the project's latest PASSED SiteSurvey.overhead_obstruction"
    constants:
      HANDS_MAX_FT: 8
      LADDER_MAX_FT: 20
    precision: "exact feet comparison; <= at each boundary"
    variants:
      - name: height_only
        when: "no overhead obstruction"
        difference: "class is NONE / LADDER / BUCKET_TRUCK purely by height tier (8 ft, 20 ft breakpoints, inclusive lower edge)"
      - name: obstruction_override
        when: "survey.overhead_obstruction == true"
        difference: "forces BUCKET_TRUCK regardless of height, even when placement_height_ft <= LADDER_MAX_FT"

  - name: contract_total
    trigger: "Estimate accept; ChangeOrder apply"
    algorithm: aggregation
    formula: |
      contract_total_cents = accepted_estimate.total_cents
                             + sum(co.delta_total_cents for co in ChangeOrders where co.status == APPLIED)
      # APPLIED change orders only; PROPOSED/APPROVED/REJECTED excluded.
      # Applied in event order (ChangeOrder APPLIED transition time ASC; tie-break created_at ASC).
    input_set: "the single ACCEPTED estimate plus every APPLIED ChangeOrder of the project"
    constants: {}
    precision: "integer cents; running sum, no re-rounding (each delta already whole cents)"
    variants:
      - name: at_accept
        when: "set when an estimate is accepted"
        difference: "equals accepted_estimate.total_cents with no deltas yet"
      - name: post_apply
        when: "after each ChangeOrder apply"
        difference: "previous contract_total + this change order's delta_total_cents"

  - name: warranty_coverage
    trigger: "POST /sign-projects/{id}/warranty-claims (claim creation, sets covered)"
    algorithm: threshold
    formula: |
      install_date = InstallJob INSTALLED completion timestamp
      coverage_days = COVERAGE[defect_kind]
      covered = (reported_iso < install_date + coverage_days days)     # STRICT '<' boundary
      # exactly at install_date + coverage_days => NOT covered (boundary is exclusive)
    input_set: "the referenced InstallJob's completion timestamp and the claim's defect_kind + reported_iso"
    constants:
      COVERAGE: { ELECTRICAL: 365, STRUCTURAL: 1825, COSMETIC: 90 }   # days
    precision: "day arithmetic in UTC; strict '<' at the boundary"
    variants:
      - name: within_window
        when: "reported strictly before install_date + coverage_days"
        difference: "covered == true; OPEN claim may be APPROVED"
      - name: at_or_after_window
        when: "reported at or after the boundary instant"
        difference: "covered == false; APPROVE attempt -> ERR_OUT_OF_WARRANTY"

  - name: permit_fee
    trigger: "POST /sign-projects/{id}/permits (permit creation)"
    algorithm: aggregation
    formula: |
      fee_cents = PERMIT_FEE[jurisdiction_code][permit_kind]
    input_set: "SignProject.jurisdiction_code and the Permit.permit_kind"
    constants:
      PERMIT_FEE:
        CITY_A:   { STRUCTURAL: 25000, ELECTRICAL: 18000 }
        CITY_B:   { STRUCTURAL: 32000, ELECTRICAL: 21000 }
        COUNTY_C: { STRUCTURAL: 0,     ELECTRICAL: 12000 }
    precision: "integer cents lookup"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is authorized for this operation per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path resource ids exist (left-to-right: project, then nested child), child belongs to the project"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_constraint
    check: "Request body required fields present and typed; enums in range; positive dimensions; window_end > window_start"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all POST

  - priority: 5
    category: state
    check: "Target resource is in a state from which this transition is defined in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all transition endpoints

  - priority: 6
    category: business_referential
    check: "Estimate.art_proof_id references an APPROVED proof of this project; InstallJob.work_order_id references a READY_FOR_INSTALL WO; WarrantyClaim.install_job_id references an INSTALLED job of this project"
    error_id: ERR_REFERENCE_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST estimates, POST install-jobs, POST warranty-claims"

  - priority: 7
    category: business_safety
    check: "Site survey gating: PASS requires measured_clearance_ft >= placement_height_ft; MONUMENT/PYLON require ground_bearing_ok"
    error_id: ERR_CLEARANCE_INSUFFICIENT
    http_status: 409
    applies_to: "POST site-surveys/{id}/decide"

  - priority: 8
    category: business_safety
    check: "Crew aerial certification: a BUCKET_TRUCK install requires Crew.certified_aerial on dispatch"
    error_id: ERR_CREW_NOT_CERTIFIED
    http_status: 409
    applies_to: "POST install-jobs/{id}/dispatch"

  - priority: 9
    category: business_temporal
    check: "Equipment double-booking: the chosen Equipment must not have an overlapping booked window across install jobs (half-open [start,end) overlap)"
    error_id: ERR_EQUIPMENT_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST install-jobs"

  - priority: 10
    category: business_temporal
    check: "Crew double-booking: the chosen Crew must not have a same-day overlapping window; same-day buffer of CREW_BUFFER_MIN minutes between adjacent jobs (closed-interval + buffer)"
    error_id: ERR_CREW_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST install-jobs"

  - priority: 11
    category: business_constraint
    check: "Permit prerequisites for work-order release: required permits APPROVED & not EXPIRED; passing site survey present"
    error_id: ERR_PERMIT_NOT_APPROVED
    http_status: 409
    applies_to: "POST fabrication-work-orders"

  - priority: 12
    category: business_fiscal
    check: "OCC: expected_<parent>_version on accept/apply endpoints must equal current SignProject.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST estimates/{id}/accept, POST change-orders/{id}/apply"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- SignProject ----
  - method: POST
    path: "/sign-projects"
    description: "Create a sign project"
    roles: [ShopManager]
    code: 201
    input: [customer_name, site_address, jurisdiction_code, sign_type, face_width_in, face_height_in, placement_height_ft, "illuminated?", "rush?"]
    output: SignProject
    side_effects: ["phase=DESIGN", "permit_required computed", "contract_total_cents=0"]

  - method: GET
    path: "/sign-projects/{id}"
    description: "Get a sign project (re-evaluates auto-expiries on read)"
    roles: [ShopManager, Designer, Customer, Surveyor, PermitClerk]
    code: 200
    input: []
    output: SignProject
    side_effects: ["lazy expiry of SENT estimates / APPROVED permits past their expiry"]

  - method: GET
    path: "/sign-projects"
    description: "List sign projects (paginated; filter by phase or approved_estimate_id for reverse-reachability of SignProject.approved_estimate_id)"
    roles: [ShopManager, Designer, Customer, Surveyor, PermitClerk]
    code: 200
    input: ["phase?", "approved_estimate_id?", "limit?", "offset?"]
    output: SignProject[]
    side_effects: []

  - method: POST
    path: "/sign-projects/{id}/cancel"
    description: "Cancel a project (only in DESIGN/ESTIMATING/PERMITTING)"
    roles: [ShopManager]
    code: 200
    input: []
    output: SignProject
    side_effects: ["phase->CANCELLED", "non-terminal proofs/estimates -> SUPERSEDED"]

  - method: POST
    path: "/sign-projects/{id}/close"
    description: "Close a project from WARRANTY"
    roles: [ShopManager]
    code: 200
    input: []
    output: SignProject
    side_effects: ["phase->CLOSED"]

  # ---- ArtProof ----
  - method: POST
    path: "/sign-projects/{id}/art-proofs"
    description: "Create an art proof revision (auto revision_no)"
    roles: [Designer]
    code: 201
    input: [artwork_uri, color_count]
    output: ArtProof
    side_effects: ["status=DRAFT", "revision_no = prior max + 1", "any REJECTED proof -> SUPERSEDED"]

  - method: GET
    path: "/sign-projects/{id}/art-proofs"
    description: "List art proofs of a project (reverse-reachability for SignProject FK)"
    roles: [ShopManager, Designer, Customer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ArtProof[]
    side_effects: []

  - method: POST
    path: "/sign-projects/{id}/art-proofs/{proof_id}/submit"
    description: "Submit a DRAFT proof for customer review"
    roles: [Designer]
    code: 200
    input: []
    output: ArtProof
    side_effects: ["status->SUBMITTED"]

  - method: POST
    path: "/sign-projects/{id}/art-proofs/{proof_id}/decision"
    description: "Customer approves or rejects a SUBMITTED proof"
    roles: [Customer]
    code: 200
    input: [decision, "reject_reason?"]
    output: ArtProof
    side_effects: ["APPROVE: status->APPROVED, project.phase DESIGN->ESTIMATING", "REJECT: status->REJECTED, reject_reason stored"]

  # ---- Estimate ----
  - method: POST
    path: "/sign-projects/{id}/estimates"
    description: "Create an estimate against an APPROVED proof (computes total_cents)"
    roles: [ShopManager]
    code: 201
    input: [art_proof_id, substrate, valid_until_iso]
    output: Estimate
    side_effects: ["status=DRAFT", "estimate_total computed (area_sqft, material/labor/surcharge/total)"]

  - method: GET
    path: "/sign-projects/{id}/estimates"
    description: "List estimates of a project (reverse-reachability for SignProject FK; lazy-expires SENT past valid_until)"
    roles: [ShopManager, Customer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Estimate[]
    side_effects: ["lazy expiry of SENT estimates past valid_until_iso"]

  - method: POST
    path: "/sign-projects/{id}/estimates/{estimate_id}/send"
    description: "Send a DRAFT estimate to the customer"
    roles: [ShopManager]
    code: 200
    input: []
    output: Estimate
    side_effects: ["status->SENT"]

  - method: POST
    path: "/sign-projects/{id}/estimates/{estimate_id}/accept"
    description: "Customer accepts a SENT estimate (OCC on project)"
    roles: [Customer]
    code: 200
    input: [expected_sign_project_version]
    output: Estimate
    side_effects: ["status->ACCEPTED", "project.approved_estimate_id + contract_total_cents set", "phase ESTIMATING->PERMITTING", "other SENT/DRAFT estimates -> SUPERSEDED", "increments SignProject.version by 1"]

  - method: POST
    path: "/sign-projects/{id}/estimates/{estimate_id}/decline"
    description: "Customer declines a SENT estimate"
    roles: [Customer]
    code: 200
    input: []
    output: Estimate
    side_effects: ["status->DECLINED"]

  # ---- SiteSurvey ----
  - method: POST
    path: "/sign-projects/{id}/site-surveys"
    description: "Create a pending site survey"
    roles: [Surveyor]
    code: 201
    input: [measured_clearance_ft, overhead_obstruction, ground_bearing_ok]
    output: SiteSurvey
    side_effects: ["status=PENDING"]

  - method: GET
    path: "/sign-projects/{id}/site-surveys"
    description: "List site surveys of a project (reverse-reachability for SignProject FK)"
    roles: [ShopManager, Surveyor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: SiteSurvey[]
    side_effects: []

  - method: POST
    path: "/sign-projects/{id}/site-surveys/{survey_id}/decide"
    description: "Surveyor passes or fails a PENDING survey"
    roles: [Surveyor]
    code: 200
    input: [result]
    output: SiteSurvey
    side_effects: ["PASS: clearance & ground-bearing gates enforced -> status PASSED", "FAIL: status FAILED"]

  # ---- Permit ----
  - method: POST
    path: "/sign-projects/{id}/permits"
    description: "Create a permit (computes fee_cents)"
    roles: [PermitClerk]
    code: 201
    input: [permit_kind, "expires_iso?"]
    output: Permit
    side_effects: ["status=DRAFT", "permit_fee computed"]

  - method: GET
    path: "/sign-projects/{id}/permits"
    description: "List permits of a project (reverse-reachability for SignProject FK; lazy-expires APPROVED past expiry)"
    roles: [ShopManager, PermitClerk]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Permit[]
    side_effects: ["lazy expiry of APPROVED permits past expires_iso"]

  - method: POST
    path: "/sign-projects/{id}/permits/{permit_id}/submit"
    description: "Submit a DRAFT permit (requires permit_required)"
    roles: [PermitClerk]
    code: 200
    input: []
    output: Permit
    side_effects: ["status->SUBMITTED"]

  - method: POST
    path: "/sign-projects/{id}/permits/{permit_id}/decide"
    description: "Approve or deny a SUBMITTED permit"
    roles: [PermitClerk]
    code: 200
    input: [decision]
    output: Permit
    side_effects: ["status->APPROVED or DENIED"]

  # ---- FabricationWorkOrder ----
  - method: POST
    path: "/sign-projects/{id}/fabrication-work-orders"
    description: "Release a fabrication work order (advances project to FABRICATION)"
    roles: [ShopManager]
    code: 201
    input: []
    output: FabricationWorkOrder
    side_effects: ["status=RELEASED", "snapshot_total_cents = accepted estimate total", "phase PERMITTING->FABRICATION", "permit & survey gates enforced"]

  - method: GET
    path: "/sign-projects/{id}/fabrication-work-orders"
    description: "List work orders of a project (reverse-reachability for SignProject FK)"
    roles: [ShopManager]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: FabricationWorkOrder[]
    side_effects: []

  - method: POST
    path: "/sign-projects/{id}/fabrication-work-orders/{wo_id}/start"
    description: "Start production on a RELEASED work order"
    roles: [ShopManager]
    code: 200
    input: []
    output: FabricationWorkOrder
    side_effects: ["status->IN_PRODUCTION"]

  - method: POST
    path: "/sign-projects/{id}/fabrication-work-orders/{wo_id}/qc-hold"
    description: "Place an IN_PRODUCTION work order on QC hold"
    roles: [ShopManager]
    code: 200
    input: []
    output: FabricationWorkOrder
    side_effects: ["status->QC_HOLD"]

  - method: POST
    path: "/sign-projects/{id}/fabrication-work-orders/{wo_id}/qc-decide"
    description: "QC decision: pass to READY_FOR_INSTALL or fail back to IN_PRODUCTION"
    roles: [ShopManager]
    code: 200
    input: [qc_pass]
    output: FabricationWorkOrder
    side_effects: ["qc_pass=true: status->READY_FOR_INSTALL, phase FABRICATION->INSTALL", "qc_pass=false: status->IN_PRODUCTION"]

  - method: POST
    path: "/sign-projects/{id}/fabrication-work-orders/{wo_id}/cancel"
    description: "Cancel a work order"
    roles: [ShopManager]
    code: 200
    input: []
    output: FabricationWorkOrder
    side_effects: ["status->CANCELLED", "phase FABRICATION->CANCELLED"]

  # ---- Crew & Equipment ----
  - method: POST
    path: "/crews"
    description: "Register an install crew"
    roles: [ShopManager]
    code: 201
    input: [name, "certified_aerial?", "active?"]
    output: Crew
    side_effects: []

  - method: GET
    path: "/crews/{id}"
    description: "Get a crew"
    roles: [ShopManager]
    code: 200
    input: []
    output: Crew
    side_effects: []

  - method: PATCH
    path: "/crews/{id}"
    description: "Update crew availability/certification"
    roles: [ShopManager]
    code: 200
    input: ["certified_aerial?", "active?"]
    output: Crew
    side_effects: ["increments Crew.version by 1"]

  - method: POST
    path: "/equipment"
    description: "Register an equipment unit (ladder or bucket truck)"
    roles: [ShopManager]
    code: 201
    input: [asset_tag, equipment_class, max_reach_ft, "in_service?"]
    output: Equipment
    side_effects: []

  - method: GET
    path: "/equipment/{id}"
    description: "Get an equipment unit"
    roles: [ShopManager]
    code: 200
    input: []
    output: Equipment
    side_effects: []

  # ---- Top-level child fetch + filtered lists (cross-aggregate FK reverse-reachability) ----
  - method: GET
    path: "/estimates/{id}"
    description: "Get an estimate by id (cross-aggregate direct fetch)"
    roles: [ShopManager, Customer]
    code: 200
    input: []
    output: Estimate
    side_effects: ["lazy expiry of a SENT estimate past valid_until_iso"]

  - method: GET
    path: "/estimates"
    description: "List estimates filtered by FK (reverse-reachability for Estimate.art_proof_id and SignProject.approved_estimate_id discovery)"
    roles: [ShopManager, Customer]
    code: 200
    input: ["art_proof_id?", "sign_project_id?", "status?", "limit?", "offset?"]
    output: Estimate[]
    side_effects: []

  - method: GET
    path: "/fabrication-work-orders/{id}"
    description: "Get a work order by id (cross-aggregate direct fetch)"
    roles: [ShopManager]
    code: 200
    input: []
    output: FabricationWorkOrder
    side_effects: []

  - method: GET
    path: "/fabrication-work-orders"
    description: "List work orders filtered by FK (reverse-reachability for FabricationWorkOrder.estimate_id)"
    roles: [ShopManager]
    code: 200
    input: ["estimate_id?", "sign_project_id?", "status?", "limit?", "offset?"]
    output: FabricationWorkOrder[]
    side_effects: []

  - method: GET
    path: "/install-jobs/{id}"
    description: "Get an install job by id (cross-aggregate direct fetch)"
    roles: [ShopManager]
    code: 200
    input: []
    output: InstallJob
    side_effects: []

  - method: GET
    path: "/install-jobs"
    description: "List install jobs filtered by FK (reverse-reachability for InstallJob.work_order_id / crew_id / equipment_id)"
    roles: [ShopManager]
    code: 200
    input: ["work_order_id?", "crew_id?", "equipment_id?", "sign_project_id?", "status?", "limit?", "offset?"]
    output: InstallJob[]
    side_effects: []

  - method: GET
    path: "/warranty-claims/{id}"
    description: "Get a warranty claim by id (cross-aggregate direct fetch)"
    roles: [ShopManager, Customer]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []

  - method: GET
    path: "/warranty-claims"
    description: "List warranty claims filtered by FK (reverse-reachability for WarrantyClaim.install_job_id)"
    roles: [ShopManager, Customer]
    code: 200
    input: ["install_job_id?", "sign_project_id?", "status?", "limit?", "offset?"]
    output: WarrantyClaim[]
    side_effects: []

  # ---- InstallJob ----
  - method: POST
    path: "/sign-projects/{id}/install-jobs"
    description: "Schedule an install job (derives required_equipment_class; enforces overlap + reference gates)"
    roles: [ShopManager]
    code: 201
    input: [work_order_id, crew_id, "equipment_id?", window_start_iso, window_end_iso]
    output: InstallJob
    side_effects: ["status=SCHEDULED", "required_equipment_class computed", "crew & equipment booked for the window"]

  - method: GET
    path: "/sign-projects/{id}/install-jobs"
    description: "List install jobs of a project (reverse-reachability for SignProject FK)"
    roles: [ShopManager]
    code: 200
    input: ["crew_id?", "work_order_id?", "status?", "limit?", "offset?"]
    output: InstallJob[]
    side_effects: []

  - method: POST
    path: "/sign-projects/{id}/install-jobs/{job_id}/dispatch"
    description: "Dispatch a SCHEDULED job (crew availability + aerial cert gates)"
    roles: [ShopManager]
    code: 200
    input: []
    output: InstallJob
    side_effects: ["status->DISPATCHED"]

  - method: POST
    path: "/sign-projects/{id}/install-jobs/{job_id}/complete"
    description: "Mark a DISPATCHED job INSTALLED (advances project to WARRANTY)"
    roles: [ShopManager]
    code: 200
    input: []
    output: InstallJob
    side_effects: ["status->INSTALLED", "phase INSTALL->WARRANTY", "warranty clock anchored"]

  - method: POST
    path: "/sign-projects/{id}/install-jobs/{job_id}/fail"
    description: "Mark a DISPATCHED job FAILED (releases bookings; reschedule allowed)"
    roles: [ShopManager]
    code: 200
    input: []
    output: InstallJob
    side_effects: ["status->FAILED", "crew & equipment bookings released"]

  - method: POST
    path: "/sign-projects/{id}/install-jobs/{job_id}/cancel"
    description: "Cancel a SCHEDULED/DISPATCHED job (releases bookings)"
    roles: [ShopManager]
    code: 200
    input: []
    output: InstallJob
    side_effects: ["status->CANCELLED", "crew & equipment bookings released"]

  # ---- ChangeOrder ----
  - method: POST
    path: "/sign-projects/{id}/change-orders"
    description: "Propose a change order (computes delta_total_cents)"
    roles: [ShopManager]
    code: 201
    input: [reason, "new_face_width_in?", "new_face_height_in?", "new_substrate?"]
    output: ChangeOrder
    side_effects: ["status=PROPOSED", "change_order_delta computed"]

  - method: GET
    path: "/sign-projects/{id}/change-orders"
    description: "List change orders of a project (reverse-reachability for SignProject FK)"
    roles: [ShopManager, Customer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ChangeOrder[]
    side_effects: []

  - method: POST
    path: "/sign-projects/{id}/change-orders/{co_id}/approve"
    description: "Customer approves a PROPOSED change order"
    roles: [Customer]
    code: 200
    input: []
    output: ChangeOrder
    side_effects: ["status->APPROVED"]

  - method: POST
    path: "/sign-projects/{id}/change-orders/{co_id}/apply"
    description: "Apply an APPROVED change order (OCC on project; cascades WO + contract ledger)"
    roles: [ShopManager]
    code: 200
    input: [expected_sign_project_version]
    output: ChangeOrder
    side_effects: ["status->APPLIED", "project scope fields updated", "contract_total_cents += delta", "in-flight WO cascade-cancelled + new RELEASED WO", "increments SignProject.version by 1"]

  - method: POST
    path: "/sign-projects/{id}/change-orders/{co_id}/reject"
    description: "Customer rejects a PROPOSED change order"
    roles: [Customer]
    code: 200
    input: []
    output: ChangeOrder
    side_effects: ["status->REJECTED"]

  # ---- WarrantyClaim ----
  - method: POST
    path: "/sign-projects/{id}/warranty-claims"
    description: "File a warranty claim against an INSTALLED job (computes covered)"
    roles: [Customer, ShopManager]
    code: 201
    input: [install_job_id, defect_kind, reported_iso]
    output: WarrantyClaim
    side_effects: ["status=OPEN", "warranty_coverage computed -> covered"]

  - method: GET
    path: "/sign-projects/{id}/warranty-claims"
    description: "List warranty claims of a project (reverse-reachability for SignProject FK)"
    roles: [ShopManager, Customer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: WarrantyClaim[]
    side_effects: []

  - method: POST
    path: "/sign-projects/{id}/warranty-claims/{claim_id}/decide"
    description: "Approve (requires covered) or deny an OPEN claim"
    roles: [ShopManager]
    code: 200
    input: [decision]
    output: WarrantyClaim
    side_effects: ["APPROVE: covered gate -> status APPROVED", "DENY: status DENIED"]

  - method: POST
    path: "/sign-projects/{id}/warranty-claims/{claim_id}/resolve"
    description: "Resolve an APPROVED claim"
    roles: [ShopManager]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["status->RESOLVED"]

  # ---- Reorder ----
  - method: POST
    path: "/sign-projects/{id}/reorders"
    description: "Request a reorder of a CLOSED project"
    roles: [ShopManager, Customer]
    code: 201
    input: [quantity, "reprice?"]
    output: Reorder
    side_effects: ["status=REQUESTED"]

  - method: GET
    path: "/sign-projects/{id}/reorders"
    description: "List reorders of a project (reverse-reachability for SignProject FK)"
    roles: [ShopManager, Customer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Reorder[]
    side_effects: []

  - method: POST
    path: "/sign-projects/{id}/reorders/{reorder_id}/confirm"
    description: "Confirm a reorder (clones source into a new DESIGN project)"
    roles: [ShopManager]
    code: 200
    input: []
    output: Reorder
    side_effects: ["status->CONFIRMED", "new SignProject cloned", "reorder_project_id set"]

  - method: POST
    path: "/sign-projects/{id}/reorders/{reorder_id}/cancel"
    description: "Cancel a REQUESTED reorder"
    roles: [ShopManager]
    code: 200
    input: []
    output: Reorder
    side_effects: ["status->CANCELLED"]

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's current UTC clock (test-driving; drives estimate/permit expiry and warranty windows)"
    roles: [ShopManager]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["server now() = to_iso8601 for all subsequent time-dependent evaluation"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or unknown" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path resource id does not exist or child does not belong to project" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Missing/invalid body field, bad enum, non-positive dimension, or window_end <= window_start" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state from which this transition is defined" }
  - { id: ERR_PROOF_ALREADY_APPROVED, http: 409, condition: "Approving a proof when another proof of the project is already APPROVED" }
  - { id: ERR_REFERENCE_NOT_ELIGIBLE, http: 409, condition: "Referenced proof not APPROVED / work order not READY_FOR_INSTALL / install job not INSTALLED" }
  - { id: ERR_ESTIMATE_EXPIRED, http: 409, condition: "Accepting a SENT estimate at/after valid_until_iso" }
  - { id: ERR_ESTIMATE_ALREADY_ACCEPTED, http: 409, condition: "Accepting a second estimate when one is already ACCEPTED for the project" }
  - { id: ERR_CLEARANCE_INSUFFICIENT, http: 409, condition: "Survey PASS with measured_clearance_ft < placement_height_ft" }
  - { id: ERR_GROUND_BEARING_FAILED, http: 409, condition: "Survey PASS for MONUMENT/PYLON without ground_bearing_ok" }
  - { id: ERR_PERMIT_NOT_REQUIRED, http: 409, condition: "Submitting a permit when project.permit_required is false" }
  - { id: ERR_SURVEY_NOT_PASSED, http: 409, condition: "Work-order release without a PASSED site survey" }
  - { id: ERR_PERMIT_NOT_APPROVED, http: 409, condition: "Work-order release while a required permit is not APPROVED or is EXPIRED" }
  - { id: ERR_EQUIPMENT_REQUIRED, http: 409, condition: "Install job needs LADDER/BUCKET_TRUCK but equipment_id omitted or wrong class/reach" }
  - { id: ERR_EQUIPMENT_DOUBLE_BOOKED, http: 409, condition: "Chosen equipment's window overlaps another active install job [start,end)" }
  - { id: ERR_CREW_DOUBLE_BOOKED, http: 409, condition: "Chosen crew has an overlapping or insufficiently-buffered same-day window" }
  - { id: ERR_CREW_UNAVAILABLE, http: 409, condition: "Dispatching with Crew.active == false" }
  - { id: ERR_CREW_NOT_CERTIFIED, http: 409, condition: "Dispatching a BUCKET_TRUCK install with a crew lacking certified_aerial" }
  - { id: ERR_CHANGE_WINDOW_CLOSED, http: 409, condition: "Approving/applying a change order when project.phase not in {PERMITTING, FABRICATION}" }
  - { id: ERR_OUT_OF_WARRANTY, http: 409, condition: "Approving a warranty claim whose covered == false" }
  - { id: ERR_OPEN_CLAIM, http: 409, condition: "Closing a project with an OPEN or APPROVED warranty claim" }
  - { id: ERR_SOURCE_NOT_CLOSED, http: 409, condition: "Confirming a reorder whose source project is not CLOSED" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_sign_project_version does not equal current SignProject.version on accept/apply" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ShopManager
    description: "Shop/operations manager: owns project lifecycle, estimates, work orders, scheduling, claims, reorders"
    identity: "opaque"
    exclusive_operations:
      - "POST /sign-projects — create project"
      - "POST /sign-projects/{id}/cancel — cancel project"
      - "POST /sign-projects/{id}/close — close project"
      - "POST /sign-projects/{id}/estimates — create estimate"
      - "POST /sign-projects/{id}/estimates/{id}/send — send estimate"
      - "POST /sign-projects/{id}/fabrication-work-orders (+ start/qc-hold/qc-decide/cancel) — work order lifecycle"
      - "POST /crews, PATCH /crews/{id}, POST /equipment — resource registration"
      - "POST /sign-projects/{id}/install-jobs (+ dispatch/complete/fail/cancel) — install scheduling"
      - "POST /sign-projects/{id}/change-orders, .../apply — propose & apply change orders"
      - "POST /sign-projects/{id}/warranty-claims/{id}/decide (+ resolve) — claim adjudication"
      - "POST /sign-projects/{id}/reorders/{id}/confirm (+ cancel) — reorder lifecycle"
      - "POST /_clock/set_current_utc — test clock"
    shared_operations:
      - "POST /sign-projects/{id}/warranty-claims — file claim (with Customer)"
      - "POST /sign-projects/{id}/reorders — request reorder (with Customer)"
      - "GET reads of projects and children"

  - name: Designer
    description: "Creates and submits art proofs"
    identity: "opaque"
    exclusive_operations:
      - "POST /sign-projects/{id}/art-proofs — create proof revision"
      - "POST /sign-projects/{id}/art-proofs/{id}/submit — submit proof"
    shared_operations:
      - "GET reads of projects, art proofs"

  - name: Customer
    description: "Approves proofs, accepts/declines estimates, approves/rejects change orders, may file claims & reorders"
    identity: "opaque"
    exclusive_operations:
      - "POST /sign-projects/{id}/art-proofs/{id}/decision — approve/reject proof"
      - "POST /sign-projects/{id}/estimates/{id}/accept — accept estimate"
      - "POST /sign-projects/{id}/estimates/{id}/decline — decline estimate"
      - "POST /sign-projects/{id}/change-orders/{id}/approve — approve change order"
      - "POST /sign-projects/{id}/change-orders/{id}/reject — reject change order"
    shared_operations:
      - "POST /sign-projects/{id}/warranty-claims — file claim (with ShopManager)"
      - "POST /sign-projects/{id}/reorders — request reorder (with ShopManager)"
      - "GET reads of projects and children"

  - name: Surveyor
    description: "Performs and decides site surveys"
    identity: "opaque"
    exclusive_operations:
      - "POST /sign-projects/{id}/site-surveys — create survey"
      - "POST /sign-projects/{id}/site-surveys/{id}/decide — pass/fail survey"
    shared_operations:
      - "GET reads of projects, site surveys"

  - name: PermitClerk
    description: "Manages permit lifecycle"
    identity: "opaque"
    exclusive_operations:
      - "POST /sign-projects/{id}/permits — create permit"
      - "POST /sign-projects/{id}/permits/{id}/submit — submit permit"
      - "POST /sign-projects/{id}/permits/{id}/decide — approve/deny permit"
    shared_operations:
      - "GET reads of projects, permits"
