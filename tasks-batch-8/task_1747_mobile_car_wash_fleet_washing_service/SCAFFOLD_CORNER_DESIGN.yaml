          assert:
            - "a_total == 80 and a_result == PASS (>= boundary)"
            - "o_status == COMPLETED (no rewash, no REWASH_PENDING); GET /wash-orders?rewash_of_id=${order_id} returns total_count 0"

      - name: rain_advisory_threshold_60
        claim_type: correct_result
        grounds: ["calculations.weather_policy_evaluation", "endpoints: POST /fleet-wash/weather/evaluations"]
        distinguishing_aspect: "The rain advisory threshold is inclusive at 60 with temperature above freezing: precip 60 yields advisory=true with no state changes; precip 59 yields advisory=false. Freeze takes precedence over advisory when both thresholds hold."
        test_recipe:
          setup: ["empty database (no routes or orders required — advisory changes nothing)"]
          setup_api_calls: []
          trigger:
            - { call: "POST /fleet-wash/weather/evaluations", payload: { evaluation_date: "2026-08-12", forecast_low_f: 40, precip_probability_pct: 60 }, as: Dispatcher, captures: { f60: $.data.freeze, a60: $.data.advisory } }
            - { call: "POST /fleet-wash/weather/evaluations", payload: { evaluation_date: "2026-08-13", forecast_low_f: 40, precip_probability_pct: 59 }, as: Dispatcher, captures: { f59: $.data.freeze, a59: $.data.advisory } }
            - { call: "POST /fleet-wash/weather/evaluations", payload: { evaluation_date: "2026-08-14", forecast_low_f: 32, precip_probability_pct: 90 }, as: Dispatcher, captures: { f32: $.data.freeze, a32: $.data.advisory } }
          assert:
            - "f60 == false and a60 == true (>= 60 boundary with low > 32)"
            - "f59 == false and a59 == false"
            - "f32 == true and a32 == false (freeze path, not advisory, when low <= 32)"

      - name: weather_held_auto_expire_after_14_days
        claim_type: correct_result
        grounds: ["calculations.guarantee_windows", "entities.WashOrder.fields.cancel_reason", "endpoints: POST /fleet-wash/ops/run-daily"]
        distinguishing_aspect: "run-daily cancels WEATHER_HELD orders only when held more than 14 days ago (held_at date + 14 < clock date): at exactly day 14 the order survives, at day 15 it is CANCELLED with cancel_reason WEATHER_EXPIRED."
        test_recipe:
          setup: ["RETAIL customer; site; 1 SEDAN; order SCHEDULED for window date 2026-08-10, freeze-held at clock 2026-08-10T08:00:00Z"]
          setup_api_calls:
            - { call: "POST /fleet-wash/_clock/set_current_utc", payload: { to_iso8601: "2026-08-09T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /fleet-wash/customers", payload: { name: "CE", email: "ce@x.com" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /fleet-wash/sites", payload: { customer_id: "${cust_id}", name: "CES", lot_size_sqft: 8000, containment_type: "VACUUM_RECOVERY", water_reclaim_required: false, max_discharge_gal: 100 }, as: PlatformAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_id}", plate: "CE1", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { v1: $.data.id } }
            - { call: "POST /fleet-wash/wash-orders", payload: { customer_id: "${cust_id}", site_id: "${site_id}", vehicle_ids: ["${v1}"], scheduled_window_start: "2026-08-10T13:00:00Z", scheduled_window_end: "2026-08-10T14:00:00Z" }, as: PlatformAdmin, captures: { order_id: $.data.id } }
            - { call: "POST /fleet-wash/wash-orders/${order_id}/events", payload: { event_type: "CONFIRM" }, as: Dispatcher }
            - { call: "POST /fleet-wash/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T08:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /fleet-wash/weather/evaluations", payload: { evaluation_date: "2026-08-10", forecast_low_f: 28, precip_probability_pct: 0 }, as: Dispatcher }
          trigger:
            - { call: "POST /fleet-wash/_clock/set_current_utc", payload: { to_iso8601: "2026-08-24T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /fleet-wash/ops/run-daily", payload: {}, as: Dispatcher, captures: { exp14: $.data.expired_order_ids } }
            - { call: "POST /fleet-wash/_clock/set_current_utc", payload: { to_iso8601: "2026-08-25T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /fleet-wash/ops/run-daily", payload: {}, as: Dispatcher, captures: { exp15: $.data.expired_order_ids } }
            - { call: "GET /fleet-wash/wash-orders/${order_id}", payload: {}, as: Dispatcher, captures: { o_status: $.data.status, o_reason: $.data.cancel_reason } }
          assert:
            - "At held date + 14 (2026-08-24): exp14 does NOT contain ${order_id} (not yet expired)"
            - "At held date + 15 (2026-08-25): exp15 contains ${order_id}"
            - "o_status == CANCELLED and o_reason == WEATHER_EXPIRED"

      - name: early_termination_fee_four_months
        claim_type: correct_result
        grounds: ["calculations.early_termination_fee", "state_machines.FleetContract.ACTIVE_to_TERMINATED", "entities.FleetContract.fields.early_termination_fee_cents"]
        distinguishing_aspect: "Chronological month counting: terminating on 2026-08-14 with end_date 2026-12-31 leaves exactly 4 full months (Sep-Dec), so fee == 4 x 200000 x 0.50 == 400000; terminating at end_date yields 0."
        test_recipe:
          setup: ["FLEET customer; contract A (2026-01-01 to 2026-12-31, minimum 200000) ACTIVE; contract B (2026-01-01 to 2026-08-14, minimum 200000) ACTIVE; clock 2026-08-14"]
          setup_api_calls:
            - { call: "POST /fleet-wash/_clock/set_current_utc", payload: { to_iso8601: "2026-08-14T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /fleet-wash/customers", payload: { name: "C7", email: "c7@x.com", customer_type: "FLEET" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /fleet-wash/fleet-contracts", payload: { customer_id: "${cust_id}", start_date: "2026-01-01", end_date: "2026-12-31", monthly_minimum_cents: 200000, sedan_rate_cents: 3000, suv_pickup_rate_cents: 4000, van_boxtruck_rate_cents: 6000, heavy_fleet_rate_cents: 10000 }, as: PlatformAdmin, captures: { fca: $.data.id } }
            - { call: "POST /fleet-wash/fleet-contracts/${fca}/events", payload: { event_type: "ACTIVATE" }, as: PlatformAdmin }
            - { call: "POST /fleet-wash/fleet-contracts", payload: { customer_id: "${cust_id}", start_date: "2026-01-01", end_date: "2026-08-14", monthly_minimum_cents: 200000, sedan_rate_cents: 3000, suv_pickup_rate_cents: 4000, van_boxtruck_rate_cents: 6000, heavy_fleet_rate_cents: 10000 }, as: PlatformAdmin, captures: { fcb: $.data.id } }
            - { call: "POST /fleet-wash/fleet-contracts/${fcb}/events", payload: { event_type: "ACTIVATE" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /fleet-wash/fleet-contracts/${fca}/events", payload: { event_type: "TERMINATE" }, as: PlatformAdmin, captures: { fee_a: $.data.early_termination_fee_cents, st_a: $.data.status } }
            - { call: "POST /fleet-wash/fleet-contracts/${fcb}/events", payload: { event_type: "TERMINATE" }, as: PlatformAdmin, captures: { fee_b: $.data.early_termination_fee_cents } }
          assert:
            - "fee_a == 400000 (4 full months x 200000 x 0.50) and st_a == TERMINATED"
            - "fee_b == 0 (clock date 2026-08-14 >= end_date 2026-08-14: on-time termination carries no fee)"

  - section: validations
    instances:
      - name: missing_role_header_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request without a valid X-User-Role header is rejected 401 ERR_UNAUTHENTICATED before any existence or business check."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /fleet-wash/customers", payload: { name: "NoRole", email: "norole@x.com" }, as: "(no X-User-Role header sent)", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_UNAUTHENTICATED with http 401; no customer is created"

      - name: window_inverted_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "scheduled_window_end not strictly after scheduled_window_start is a format-level rejection (400 ERR_VALIDATION) before state or business checks."
        test_recipe:
          setup: ["RETAIL customer, site, 1 SEDAN"]
          setup_api_calls:
            - { call: "POST /fleet-wash/customers", payload: { name: "V2", email: "v2@x.com" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /fleet-wash/sites", payload: { customer_id: "${cust_id}", name: "V2S", lot_size_sqft: 8000, containment_type: "VACUUM_RECOVERY", water_reclaim_required: false, max_discharge_gal: 100 }, as: PlatformAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_id}", plate: "V2", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { v1: $.data.id } }
          trigger:
            - { call: "POST /fleet-wash/wash-orders", payload: { customer_id: "${cust_id}", site_id: "${site_id}", vehicle_ids: ["${v1}"], scheduled_window_start: "2026-08-06T14:00:00Z", scheduled_window_end: "2026-08-06T13:00:00Z" }, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_VALIDATION with http 400"

      - name: confirm_with_suspended_customer
        claim_type: violation_to_error
        grounds: ["validations[priority=25]", "errors[ERR_CUSTOMER_SUSPENDED]", "state_machines.Customer.ACTIVE_to_SUSPENDED"]
        distinguishing_aspect: "Suspending a customer does not touch existing DRAFT orders (no cascade) but blocks their CONFIRM with ERR_CUSTOMER_SUSPENDED."
        test_recipe:
          setup: ["RETAIL customer with site, 1 SEDAN, and a DRAFT order; customer then SUSPENDED"]
          setup_api_calls:
            - { call: "POST /fleet-wash/customers", payload: { name: "V3", email: "v3@x.com" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /fleet-wash/sites", payload: { customer_id: "${cust_id}", name: "V3S", lot_size_sqft: 8000, containment_type: "VACUUM_RECOVERY", water_reclaim_required: false, max_discharge_gal: 100 }, as: PlatformAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_id}", plate: "V3", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { v1: $.data.id } }
            - { call: "POST /fleet-wash/wash-orders", payload: { customer_id: "${cust_id}", site_id: "${site_id}", vehicle_ids: ["${v1}"], scheduled_window_start: "2026-08-06T13:00:00Z", scheduled_window_end: "2026-08-06T14:00:00Z" }, as: PlatformAdmin, captures: { order_id: $.data.id } }
            - { call: "POST /fleet-wash/customers/${cust_id}/events", payload: { event_type: "SUSPEND" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /fleet-wash/wash-orders/${order_id}/events", payload: { event_type: "CONFIRM" }, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_CUSTOMER_SUSPENDED; WashOrder.${order_id}.status remains DRAFT"

      - name: route_create_inactive_technician
        claim_type: violation_to_error
        grounds: ["validations[priority=18]", "errors[ERR_TECHNICIAN_NOT_ACTIVE]", "state_machines.Technician.ACTIVE_to_INACTIVE"]
        distinguishing_aspect: "Route creation requires an ACTIVE lead technician; a DEACTIVATED technician yields ERR_TECHNICIAN_NOT_ACTIVE."
        test_recipe:
          setup: ["van exists; technician created then DEACTIVATED"]
          setup_api_calls:
            - { call: "POST /fleet-wash/vans", payload: { name: "VAN-V4", tank_capacity_gal: 100, reclaim_system: "BASIC" }, as: PlatformAdmin, captures: { van_id: $.data.id } }
            - { call: "POST /fleet-wash/technicians", payload: { name: "Tech V4" }, as: PlatformAdmin, captures: { tech_id: $.data.id } }
            - { call: "POST /fleet-wash/technicians/${tech_id}/events", payload: { event_type: "DEACTIVATE" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /fleet-wash/routes", payload: { route_date: "2026-08-05", van_id: "${van_id}", lead_technician_id: "${tech_id}" }, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_TECHNICIAN_NOT_ACTIVE with http 409"

      - name: van_route_conflict_same_date
        claim_type: violation_to_error
        grounds: ["validations[priority=17]", "errors[ERR_VAN_ROUTE_CONFLICT]"]
        distinguishing_aspect: "A van may hold only one non-terminal route per date: the second route for the same van and route_date is rejected with ERR_VAN_ROUTE_CONFLICT."
        test_recipe:
          setup: ["van, ACTIVE technician, and a first DRAFT route on 2026-08-05"]
          setup_api_calls:
            - { call: "POST /fleet-wash/vans", payload: { name: "VAN-V5", tank_capacity_gal: 100, reclaim_system: "BASIC" }, as: PlatformAdmin, captures: { van_id: $.data.id } }
            - { call: "POST /fleet-wash/technicians", payload: { name: "Tech V5" }, as: PlatformAdmin, captures: { tech_id: $.data.id } }
            - { call: "POST /fleet-wash/routes", payload: { route_date: "2026-08-05", van_id: "${van_id}", lead_technician_id: "${tech_id}" }, as: Dispatcher, captures: { r1: $.data.id } }
          trigger:
            - { call: "POST /fleet-wash/routes", payload: { route_date: "2026-08-05", van_id: "${van_id}", lead_technician_id: "${tech_id}" }, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_VAN_ROUTE_CONFLICT with http 409; GET /fleet-wash/routes?van_id=${van_id} returns total_count 1"

      - name: duplicate_subscription_same_vehicle
        claim_type: violation_to_error
        grounds: ["validations[priority=19]", "errors[ERR_DUPLICATE_SUBSCRIPTION]"]
        distinguishing_aspect: "A vehicle with an ACTIVE (or PAUSED) subscription rejects a second subscription with ERR_DUPLICATE_SUBSCRIPTION; after CANCEL the vehicle can be re-subscribed."
        test_recipe:
          setup: ["RETAIL customer, site, vehicle with an ACTIVE subscription"]
          setup_api_calls:
            - { call: "POST /fleet-wash/customers", payload: { name: "V6", email: "v6@x.com" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /fleet-wash/sites", payload: { customer_id: "${cust_id}", name: "V6S", lot_size_sqft: 5000, containment_type: "VACUUM_RECOVERY", water_reclaim_required: false, max_discharge_gal: 100 }, as: PlatformAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_id}", plate: "V6", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { veh_id: $.data.id } }
            - { call: "POST /fleet-wash/subscriptions", payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}", cadence: "WEEKLY", next_service_date: "2026-08-10" }, as: PlatformAdmin, captures: { sub_id: $.data.id } }
          trigger:
            - { call: "POST /fleet-wash/subscriptions", payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}", cadence: "MONTHLY", next_service_date: "2026-09-01" }, as: PlatformAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /fleet-wash/subscriptions/${sub_id}/events", payload: { event_type: "CANCEL" }, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /fleet-wash/subscriptions", payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}", cadence: "MONTHLY", next_service_date: "2026-09-01" }, as: PlatformAdmin, captures: { sub2_status: $.data.status } }
          assert:
            - "err == ERR_DUPLICATE_SUBSCRIPTION while the first is ACTIVE"
            - "After CANCEL: sub2_status == ACTIVE (CANCELLED subscriptions do not block)"

      - name: start_without_required_inspection
        claim_type: violation_to_error
        grounds: ["validations[priority=23]", "errors[ERR_INSPECTION_REQUIRED]", "entities.WashOrder.fields.requires_inspection"]
        distinguishing_aspect: "An order with requires_inspection=true and no SUBMITTED InspectionReport rejects START with ERR_INSPECTION_REQUIRED even though the stop is ARRIVED."
        test_recipe:
          setup: ["1-SEDAN order (requires_inspection true) ASSIGNED; route PUBLISHED; stop ARRIVED"]
          setup_api_calls:
            - { call: "POST /fleet-wash/customers", payload: { name: "V7", email: "v7@x.com" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /fleet-wash/sites", payload: { customer_id: "${cust_id}", name: "V7S", lot_size_sqft: 8000, containment_type: "VACUUM_RECOVERY", water_reclaim_required: false, max_discharge_gal: 100 }, as: PlatformAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_id}", plate: "V7", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { v1: $.data.id } }
            - { call: "POST /fleet-wash/wash-orders", payload: { customer_id: "${cust_id}", site_id: "${site_id}", vehicle_ids: ["${v1}"], scheduled_window_start: "2026-08-05T13:00:00Z", scheduled_window_end: "2026-08-05T14:00:00Z", requires_inspection: true }, as: PlatformAdmin, captures: { order_id: $.data.id } }
            - { call: "POST /fleet-wash/wash-orders/${order_id}/events", payload: { event_type: "CONFIRM" }, as: Dispatcher }
            - { call: "POST /fleet-wash/vans", payload: { name: "VAN-V7", tank_capacity_gal: 100, reclaim_system: "BASIC" }, as: PlatformAdmin, captures: { van_id: $.data.id } }
            - { call: "POST /fleet-wash/vans/${van_id}/events", payload: { event_type: "LOAD_WATER", gallons: 96 }, as: Dispatcher }
            - { call: "POST /fleet-wash/technicians", payload: { name: "Tech V7" }, as: PlatformAdmin, captures: { tech_id: $.data.id } }
            - { call: "POST /fleet-wash/routes", payload: { route_date: "2026-08-05", van_id: "${van_id}", lead_technician_id: "${tech_id}" }, as: Dispatcher, captures: { route_id: $.data.id, route_v: $.data.version } }
            - { call: "POST /fleet-wash/routes/${route_id}/stops", payload: { wash_order_id: "${order_id}", expected_route_version: "${route_v}" }, as: Dispatcher, captures: { stop_id: $.data.id } }
            - { call: "POST /fleet-wash/routes/${route_id}/events", payload: { event_type: "PUBLISH" }, as: Dispatcher }
            - { call: "POST /fleet-wash/routes/${route_id}/stops/${stop_id}/events", payload: { event_type: "ARRIVE" }, as: Technician, as_user_id: "${tech_id}" }
          trigger:
            - { call: "POST /fleet-wash/wash-orders/${order_id}/events", payload: { event_type: "START" }, as: Technician, as_user_id: "${tech_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INSPECTION_REQUIRED; WashOrder.${order_id}.status remains ASSIGNED"

      - name: rewash_after_window_expired
        claim_type: violation_to_error
        grounds: ["validations[priority=13]", "calculations.guarantee_windows", "errors[ERR_REWASH_WINDOW_EXPIRED]"]
        distinguishing_aspect: "A rewash request at completed_at + 73 hours exceeds the inclusive 72-hour window and is rejected with ERR_REWASH_WINDOW_EXPIRED."
        test_recipe:
          setup: ["1-SEDAN order COMPLETED with completed_at == 2026-08-05T10:00:00Z; clock advanced to 2026-08-08T11:00:00Z"]
          setup_api_calls:
            - { call: "POST /fleet-wash/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T10:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /fleet-wash/customers", payload: { name: "V8", email: "v8@x.com" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
