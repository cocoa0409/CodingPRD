            - "Trigger 6: season A water_reserved_af == 0.000 - the rejected session reserved nothing."
            - "Trigger 7: HTTP 201 - trail_code T7 with both FKs inside season B is accepted, and it is accepted at the same trail_code the three rejections used, so none of them persisted a row."
            - "Trigger 8: HTTP 201 with water_af_reserved == 1.547; ${ta_v} is still valid because the four rejected creates did not bump the TerrainArea version."

      - name: an_unresolvable_acting_patroller_is_unauthorized_and_an_ineligible_one_is_not
        claim_type: error_triggerable
        grounds:
          - errors[ERR_UNAUTHORIZED]
          - errors[ERR_PATROLLER_NOT_ON_DUTY]
          - validations[priority=2]
          - validations[priority=20]
          - roles[Patroller]
        distinguishing_aspect: |
          Priority 2 covers two very different failures behind one id: the role is not permitted for the
          endpoint, OR the role IS permitted but X-User-ID does not resolve to the entity the role is
          backed by. The second half is the corner: the request carries a legitimate Patroller role header
          and a well-formed X-User-ID that simply is not a Patroller, and the answer must be 403 rather
          than a 404 or a 422. The very next trigger sends a Patroller who DOES resolve but is off duty and
          must get a 422 instead, so the two failure modes cannot be collapsed into one check.
        test_recipe:
          setup:
            - "A PRESEASON season with a CLOSED terrain area, patroller P1 (EMT, blaster, on duty) and patroller P2 (PARAMEDIC, blaster, OFF duty)."
            - "One PLANNED mitigation mission AV-1 with method EXPLOSIVE and planned_charges 2 over that area."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MountainOpsDirector
            - call: "POST /mountain-ops/seasons"
              payload: { season_label: "2026-27", base_depth_policy: "MEAN_OF_STAKES", water_right_seasonal_af: 250.000, plant_max_gpm: 6000, snowmaking_kwh_per_af: 620.0, min_patrollers_per_open_area: 2, groom_freshness_hours: 18, energy_windows: [{ code: "OFF_1", start_hour_utc: 0, end_hour_utc: 6, price_usd_per_kwh: 0.062, tier: "OFF_PEAK" }, { code: "MID_1", start_hour_utc: 6, end_hour_utc: 9, price_usd_per_kwh: 0.113, tier: "MID_PEAK" }, { code: "ON_1", start_hour_utc: 9, end_hour_utc: 21, price_usd_per_kwh: 0.187, tier: "ON_PEAK" }, { code: "MID_2", start_hour_utc: 21, end_hour_utc: 24, price_usd_per_kwh: 0.113, tier: "MID_PEAK" }] }
              as: MountainOpsDirector
              captures: { season_id: $.data.id }
            - call: "POST /mountain-ops/lifts"
              payload: { season_id: "${season_id}", lift_code: "L1", name: "Summit Express", lift_type: "DETACHABLE", wind_hold_threshold_mph: 40.0, hourly_capacity_pph: 1800, required_operator_count: 2 }
              as: LiftOpsManager
              captures: { lift_id: $.data.id }
            - call: "POST /mountain-ops/lifts/${lift_id}/inspections"
              payload: { result: "PASS", notes: "daily pre-op" }
              as: LiftOpsManager
            - call: "POST /mountain-ops/terrain-areas"
              payload: { season_id: "${season_id}", serving_lift_id: "${lift_id}", trail_code: "T1", name: "Sunbowl", terrain_class: "BLUE", acres: 18.0, min_open_base_depth_in: 30, avalanche_terrain: true }
              as: MountainOpsDirector
              captures: { area_id: $.data.id }
            - call: "POST /mountain-ops/patrollers"
              payload: { season_id: "${season_id}", patroller_code: "P1", full_name: "Ada Patrol", cert_level: "EMT", blaster_certified: true, on_duty: true, assigned_terrain_area_id: "${area_id}" }
              as: MountainOpsDirector
              captures: { p1_id: $.data.id }
            - call: "POST /mountain-ops/patrollers"
              payload: { season_id: "${season_id}", patroller_code: "P2", full_name: "Bo Patrol", cert_level: "PARAMEDIC", blaster_certified: true, on_duty: false, assigned_terrain_area_id: "${area_id}" }
              as: MountainOpsDirector
              captures: { p2_id: $.data.id }
            - call: "POST /mountain-ops/mitigation-missions"
              payload: { terrain_area_id: "${area_id}", route_code: "AV-1", method: "EXPLOSIVE", hazard_rating_pre: "CONSIDERABLE", planned_charges: 2 }
              as: MountainOpsDirector
              captures: { m1: $.data.id }
          trigger:
            - call: "POST /mountain-ops/mitigation-missions/${m1}/execute"
              payload: { charges_used: 2 }
              as: Patroller
              as_user_id: "00000000-0000-0000-0000-0000000000ff"
              captures: { err: $.data.error_id }
            - call: "POST /mountain-ops/mitigation-missions/${m1}/execute"
              payload: { charges_used: 2 }
              as: Patroller
              as_user_id: "${season_id}"
              captures: { err: $.data.error_id }
            - call: "POST /mountain-ops/mitigation-missions/${m1}/execute"
              payload: { charges_used: 2 }
              as: Patroller
              as_user_id: "${p2_id}"
              captures: { err: $.data.error_id }
            - call: "POST /mountain-ops/mitigation-missions/${m1}/execute"
              payload: { charges_used: 2 }
              as: Patroller
              as_user_id: "${p1_id}"
            - call: "GET /mountain-ops/mitigation-missions/${m1}"
              payload: {  }
              as: MountainOpsDirector
            - call: "POST /mountain-ops/mitigation-missions/${m1}/clear"
              payload: { hazard_rating_post: "LOW" }
              as: Patroller
              as_user_id: "00000000-0000-0000-0000-0000000000ff"
              captures: { err: $.data.error_id }
            - call: "POST /mountain-ops/mitigation-missions/${m1}/clear"
              payload: { hazard_rating_post: "LOW" }
              as: Patroller
              as_user_id: "${p1_id}"
              captures: { err: $.data.error_id }
            - call: "POST /mountain-ops/mitigation-missions/${m1}/clear"
              payload: { hazard_rating_post: "LOW" }
              as: Patroller
              as_user_id: "${p2_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Trigger 1: HTTP 403 with data.error_id == 'ERR_UNAUTHORIZED' - the X-User-Role header is the permitted role Patroller, so the failure is purely that X-User-ID resolves to nothing."
            - "Trigger 2: HTTP 403 with data.error_id == 'ERR_UNAUTHORIZED' - the id resolves, but to a SeasonConfig rather than a Patroller, so a bare 'row exists' check is not enough."
            - "Trigger 3: HTTP 422 with data.error_id == 'ERR_PATROLLER_NOT_ON_DUTY' - P2 resolves to a real Patroller, so priority 2 passes and the eligibility rule at priority 20 is the reported failure."
            - "Trigger 4: HTTP 200 with state == 'EXECUTED', charges_used == 2 and road_closure_minutes == 40 (20 per charge)."
            - "Trigger 5: executed_by_patroller_id == ${p1_id} and executed_at == 2026-08-01T00:00:00Z; the three rejected attempts stamped nothing."
            - "Trigger 6: HTTP 403 with data.error_id == 'ERR_UNAUTHORIZED' on the clear endpoint too - the identity check is per request, not per workflow."
            - "Trigger 7: HTTP 409 with data.error_id == 'ERR_SOD_VIOLATION' - P1 resolves and is on duty, so the segregation-of-duties rule at priority 19 is what stops him, not the identity rule."
            - "Trigger 8: HTTP 422 with data.error_id == 'ERR_PATROLLER_NOT_ON_DUTY' - P2 is a different user from the executor, so priority 19 passes and priority 20 reports; the mission is still EXECUTED."

      - name: a_schema_violation_is_reported_ahead_of_every_business_rule_it_coincides_with
        claim_type: error_triggerable
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - errors[ERR_ENERGY_WINDOW_COVERAGE_GAP]
          - errors[ERR_SEASON_NOT_OPERATING]
          - errors[ERR_READING_TIMESTAMP_FUTURE]
          - validations[priority=5]
        distinguishing_aspect: |
          Priority 5 sits above every business rule, so a request that is BOTH schema-invalid and
          business-invalid must report ERR_INVALID_REQUEST. Each pair here is constructed so the business
          rule is guaranteed to fire once the schema defect is removed - the same payload minus the bad
          enum reports the tiling error, the same decision minus the bad enum reports the season-state
          error, and the same reading minus the negative depth reports the future-timestamp error - which
          is what proves the 400 was a masking win and not an accident of validation shape.
