            - call: "POST /psc/specimens"
              payload: { test_order_id: "${o1}", tube_code: "EDTA_LAVENDER", volume_ml: 4.0, order_of_draw: 1, special_handling_codes: [] }
              as: Phlebotomist
              captures: { s1: $.data.id }
          trigger:
            - call: "GET /psc/courier-runs/${r1}"
              payload: {}
              as: LabLiaison
              captures: { count_0: $.data.committed_specimen_count }
            - call: "POST /psc/specimens/${s1}/assign-courier"
              payload: { courier_run_id: "${r1}" }
              as: LabLiaison
            - call: "GET /psc/courier-runs/${r1}"
              payload: {}
              as: LabLiaison
              captures: { count_1: $.data.committed_specimen_count }
            - call: "POST /psc/specimens/${s1}/compromise"
              payload: { compromise_reason: "INSUFFICIENT_VOLUME" }
              as: LabLiaison
            - call: "GET /psc/courier-runs/${r1}"
              payload: {}
              as: LabLiaison
              captures: { count_2: $.data.committed_specimen_count }
          assert:
            - "${count_0} == 0 and ${count_1} == 1 and ${count_2} == 0"
            - "${count_2} == ${count_0}, so the round trip left committed_specimen_count exactly unchanged"
            - "Specimen.${s1}.status == COMPROMISED"
            - "CourierRun.${r1}.status == PLANNED, untouched by the compensating action"

      - name: specimen_reassignment_chain_preserves_total_specimen_count
        grounds:
          - validations[priority=7]
          - entities.Specimen.fields.status
          - state_machines.Specimen.transitions.UNASSIGNED_to_ASSIGNED
          - endpoints.POST_/psc/specimens/{specimenId}/recollect
        distinguishing_aspect: "A different conserved quantity: the COUNT of non-terminal specimens in the center. A put-back followed by a recollection must leave the non-terminal inventory exactly as large as it began — the release and the replacement are a matched pair, and the centre's specimen census never shrinks."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T13:00:00Z. One center, one ELIGIBLE order, one EDTA_LAVENDER specimen assigned to an OUTBOUND run at 16:00Z and then compromised; the plan's references are in place so the recollection route is available."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T13:00:00Z" }
              as: CenterSupervisor
            - call: "POST /psc/service-centers"
              payload: { name: "Aurora Draw Station", state_code: "TX", timezone_offset_minutes: -300, station_count: 2, open_local_minutes: 480, close_local_minutes: 1020 }
              as: CenterSupervisor
              captures: { c1: $.data.id }
            - call: "POST /_scenarios/seed-reference"
              payload: {}
              as: CenterSupervisor
              captures: { plan_id: $.data.insurance_plan_id }
            - call: "POST /psc/courier-runs"
              payload: { service_center_id: "${c1}", direction: "OUTBOUND", dispatch_utc: "2026-09-01T16:00:00Z" }
              as: LabLiaison
              captures: { r1: $.data.id }
            - call: "POST /psc/patients"
              payload: { full_name: "Dee Park", birth_date: "1991-02-08T00:00:00Z", mrn: "MRN-3103-K2" }
              as: IntakeCoordinator
              captures: { p1: $.data.id }
            - call: "POST /psc/test-orders"
              payload: { service_center_id: "${c1}", patient_id: "${p1}", ordering_provider_npi: "1700111225", test_panel: "CMP", collection_mode: "STANDARD", list_price_cents: 5000, is_fasting_required: false, fasting_hours_required: 0, patient_last_food_utc: "2026-09-01T12:00:00Z", icd10_codes: [], insurance_plan_id: "${plan_id}" }
              as: IntakeCoordinator
              captures: { o1: $.data.id }
            - call: "POST /psc/specimens"
              payload: { test_order_id: "${o1}", tube_code: "EDTA_LAVENDER", volume_ml: 4.0, order_of_draw: 1, special_handling_codes: [] }
              as: Phlebotomist
              captures: { s1: $.data.id }
            - call: "POST /psc/specimens/${s1}/assign-courier"
              payload: { courier_run_id: "${r1}" }
              as: LabLiaison
            - call: "POST /psc/specimens/${s1}/compromise"
              payload: { compromise_reason: "HEMOLYZED" }
              as: LabLiaison
          trigger:
            - call: "GET /psc/specimens"
              payload: { service_center_id: "${c1}" }
              as: LabLiaison
              captures: { census_before_first: "$.data[0].id" }
            - call: "POST /psc/specimens/${s1}/recollect"
              payload: {}
              as: LabLiaison
              captures: { recollected_status: $.data.status }
            - call: "POST /psc/specimens"
              payload: { test_order_id: "${o1}", tube_code: "EDTA_LAVENDER", volume_ml: 4.0, order_of_draw: 1, special_handling_codes: [] }
              as: Phlebotomist
              captures: { s2: $.data.id }
            - call: "GET /psc/specimens"
              payload: { service_center_id: "${c1}" }
              as: LabLiaison
              captures: { census_final_second: "$.data[1].id" }
          assert:
            - "${recollected_status} == RECOLLECTED and recollection_approved_at_utc is non-null"
            - "the first specimen census read returned exactly one row beginning ${census_before_first}"
            - "the second census read returned two rows, the second being ${census_final_second}, so the inventory grew by exactly the one recollection specimen"
            - "Specimen.${s1}.status == RECOLLECTED and Specimen.${s2}.status == UNASSIGNED"
            - "TestOrder.${o1}.status == SCHEDULED, re-opened by the recollection rather than left COLLECTED"
