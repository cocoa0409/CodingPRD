# =============================================================================
# Air-Duct & Dryer-Vent Cleaning — Scaffold Seed Tables (Expert)
# §1.0–§1.7 live in this file. §1.8 → SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# §1.9 → SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  655. Air-Duct & Dryer-Vent Cleaning: home profile & system count, inspection &
  before/after camera, service (duct/dryer-vent/sanitize) & pricing, add-on
  (sanitizer/UV/coil), recurring plan & reminder, route/crew, HVAC-repair upsell
  referral, callback

domain_name: air-duct-dryer-vent-cleaning
api_prefix: ""

# -----------------------------------------------------------------------------
# Complexity Profile (§0.1–§0.3)
# -----------------------------------------------------------------------------
complexity_profile:
  difficulty: Expert
  primary_archetype: pricing_engine
  secondary_archetype: temporal_windowing
  complexity_layers:
    - dual_variant_calculation        # estimate quote vs finalized invoice on a WorkOrder
    - cascading_side_effects          # WorkOrder completion cascades to inspection, plan, referral
    - derived_field_reconciliation    # Home.active_system_count, RoutePlan.committed_minutes
    - scheduled_actions               # RecurringPlan reminder due-dates against a logical clock
    - optimistic_concurrency          # OCC on RoutePlan.version for slot commit, Home.version for plan create

  entity_topology: hybrid
  # Home is a small tree root (HvacSystem children); WorkOrder, RoutePlan, CrewMember,
  # RecurringPlan, UpsellReferral, CallbackTicket are peers linked by FK across the tree.

  state_machine_shape: cyclic
  # WorkOrder has a revision cycle (INSPECTED -> QUOTED -> INSPECTED on re-inspect),
  # CallbackTicket has a reopen cycle, RecurringPlan has parallel dimensions,
  # RoutePlan is compound over its committed WorkOrders.

  relationship_patterns:
    - one_to_many        # Home -> HvacSystem; RoutePlan -> WorkOrder (via committed slot)
    - cross_aggregate    # WorkOrder references Home, HvacSystem, RoutePlan, CrewMember
    - self_referential   # CallbackTicket.reopened_from_ticket_id -> CallbackTicket.id

  role_model: peer_roles
  # Dispatcher owns routes/crews; Technician executes work orders & inspections;
  # PlanAdmin owns recurring plans & pricing config; Homeowner is the customer entity.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  # ---------------------------------------------------------------------------
  - name: PricingConfig
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC; refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "Starts at 1; +1 on every mutation" }
      - { name: duct_base_cents, type: integer, source: input, description: "Flat base price (cents) for a duct-cleaning service line", constraints: ">= 0" }
      - { name: duct_per_system_cents, type: integer, source: input, description: "Marginal price (cents) per HVAC system beyond the first, for duct service", constraints: ">= 0" }
      - { name: dryer_vent_flat_cents, type: integer, source: input, description: "Flat price (cents) for a dryer-vent service line", constraints: ">= 0" }
      - { name: sanitize_per_system_cents, type: integer, source: input, description: "Price (cents) per system for a sanitize service line", constraints: ">= 0" }
      - { name: addon_sanitizer_cents, type: integer, source: input, description: "Price (cents) for the SANITIZER add-on", constraints: ">= 0" }
      - { name: addon_uv_cents, type: integer, source: input, description: "Price (cents) for the UV add-on", constraints: ">= 0" }
      - { name: addon_coil_cents, type: integer, source: input, description: "Price (cents) for the COIL add-on", constraints: ">= 0" }
      - { name: multi_system_discount_pct, type: number, source: input, description: "Fraction (0..1) discount applied to the duct service line subtotal when active_system_count >= MULTI_SYSTEM_THRESHOLD", constraints: "0 <= x <= 1" }
      - { name: plan_member_discount_pct, type: number, source: input, description: "Fraction (0..1) discount applied to the whole service subtotal when the Home has an ACTIVE RecurringPlan", constraints: "0 <= x <= 1" }
      - { name: tax_pct, type: number, source: input, description: "Fraction (0..1) sales tax applied after discounts", constraints: "0 <= x <= 1" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | RETIRED — only one ACTIVE config at a time", constraints: "DRAFT | ACTIVE | RETIRED", default: "DRAFT" }

  # ---------------------------------------------------------------------------
  - name: Homeowner
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; equals X-User-ID when acting as Homeowner" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: version, type: integer, source: system, description: "Starts at 1; +1 on every mutation" }
      - { name: full_name, type: string, source: input, description: "Homeowner display name" }
      - { name: email, type: string, source: input, description: "Contact email; unique among homeowners", constraints: "unique" }
      - { name: phone, type: string, source: input, description: "Contact phone for reminders and callbacks" }

  # ---------------------------------------------------------------------------
  - name: Home
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC; refreshed on every mutation including cascades" }
      - { name: version, type: integer, source: system, description: "Starts at 1; +1 on every mutation (OCC parent for plan create)" }
      - { name: homeowner_id, type: string, source: input, description: "FK -> Homeowner.id; the owning customer" }
      - { name: address_line, type: string, source: input, description: "Street address" }
      - { name: zone_code, type: string, source: input, description: "Service zone code used for route grouping (e.g., Z1, Z2)" }
      - { name: square_footage, type: integer, source: input, description: "Conditioned square footage of the home", constraints: "> 0" }
      - { name: active_system_count, type: integer, source: computed, description: "Count of child HvacSystem rows whose status == ACTIVE; recomputed on system add/decommission", default: 0 }
      - { name: has_active_plan, type: boolean, source: computed, description: "True iff this Home has a RecurringPlan with status == ACTIVE", default: false }

  # ---------------------------------------------------------------------------
  - name: HvacSystem
    parent: Home
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: version, type: integer, source: system, description: "Starts at 1; +1 on every mutation" }
      - { name: home_id, type: string, source: system, description: "FK -> Home.id; the parent home" }
      - { name: label, type: string, source: input, description: "Human label (e.g., 'Upstairs furnace')" }
      - { name: register_count, type: integer, source: input, description: "Number of supply/return registers on this system", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DECOMMISSIONED", constraints: "ACTIVE | DECOMMISSIONED", default: "ACTIVE" }

  # ---------------------------------------------------------------------------
  - name: CrewMember
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; equals X-User-ID when acting as Technician" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: version, type: integer, source: system, description: "Starts at 1; +1 on every mutation" }
      - { name: full_name, type: string, source: input, description: "Crew member name" }
      - { name: home_zone_code, type: string, source: input, description: "Primary service zone the crew member is based in" }
      - { name: certified_for_uv, type: boolean, source: input, description: "Whether this crew member may perform the UV add-on", default: false }

  # ---------------------------------------------------------------------------
  - name: RoutePlan
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID (OCC parent for slot commit)" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC; refreshed on every mutation including committed-slot cascades" }
      - { name: version, type: integer, source: system, description: "Starts at 1; +1 on every mutation; OCC field for slot commits" }
      - { name: crew_member_id, type: string, source: input, description: "FK -> CrewMember.id; the assigned crew member for the day" }
      - { name: zone_code, type: string, source: input, description: "Service zone this route covers" }
      - { name: service_date, type: string, source: input, description: "Calendar date (YYYY-MM-DD) the route runs" }
      - { name: shift_start_minute, type: integer, source: input, description: "Minute-of-day the shift opens (0..1440)", constraints: "0 <= x < 1440" }
      - { name: shift_end_minute, type: integer, source: input, description: "Minute-of-day the shift closes; must be > shift_start_minute", constraints: "shift_start_minute < x <= 1440" }
      - { name: committed_minutes, type: integer, source: computed, description: "Sum of duration_minutes over WorkOrders committed to this route in non-cancelled states; recomputed on commit and on WorkOrder cancel", default: 0 }
      - { name: status, type: enum, source: system, description: "OPEN | LOCKED | CLOSED", constraints: "OPEN | LOCKED | CLOSED", default: "OPEN" }

  # ---------------------------------------------------------------------------
  - name: WorkOrder
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC; also the chronological tie-break key for route packing" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC; refreshed on every mutation including cascades" }
      - { name: version, type: integer, source: system, description: "Starts at 1; +1 on every mutation" }
      - { name: home_id, type: string, source: input, description: "FK -> Home.id; the home being serviced" }
      - { name: route_plan_id, type: string, source: computed, description: "FK -> RoutePlan.id; set when a slot is committed, cleared on cancel" }
      - { name: crew_member_id, type: string, source: computed, description: "FK -> CrewMember.id; copied from the committed RoutePlan" }
      - { name: service_lines, type: array, source: input, description: "Array of {service_type, system_id?} where service_type in {DUCT, DRYER_VENT, SANITIZE}; DUCT/SANITIZE require a system_id, DRYER_VENT does not" }
      - { name: addons, type: array, source: input, description: "Array of add-on codes, each in {SANITIZER, UV, COIL}; deduplicated", default: [] }
      - { name: requested_start_minute, type: integer, source: input, description: "Minute-of-day the homeowner requests the visit start (0..1440)", constraints: "0 <= x < 1440" }
      - { name: scheduled_start_minute, type: integer, source: computed, description: "Minute-of-day the slot was committed at; null until committed" }
      - { name: duration_minutes, type: integer, source: computed, description: "Estimated on-site duration; SETUP_MINUTES + per-line minutes + per-addon minutes" }
      - { name: estimate_total_cents, type: integer, source: computed, description: "Provisional grand total computed at QUOTE time from the ACTIVE PricingConfig snapshot" }
      - { name: invoice_total_cents, type: integer, source: computed, description: "Finalized grand total computed at COMPLETE time from actual service lines/add-ons performed" }
      - { name: pricing_config_id, type: string, source: computed, description: "FK -> PricingConfig.id; the config snapshot pinned at QUOTE time" }
      - { name: status, type: enum, source: system, description: "DRAFT | INSPECTED | QUOTED | SCHEDULED | IN_PROGRESS | COMPLETED | CANCELLED", constraints: "DRAFT | INSPECTED | QUOTED | SCHEDULED | IN_PROGRESS | COMPLETED | CANCELLED", default: "DRAFT" }

  # ---------------------------------------------------------------------------
  - name: Inspection
    parent: WorkOrder
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: version, type: integer, source: system, description: "Starts at 1; +1 on every mutation" }
      - { name: work_order_id, type: string, source: system, description: "FK -> WorkOrder.id; the inspected work order" }
      - { name: before_photo_count, type: integer, source: input, description: "Number of before-service photos captured", constraints: ">= 0" }
      - { name: after_photo_count, type: integer, source: input, description: "Number of after-service photos captured; required at completion", constraints: ">= 0", default: 0 }
      - { name: dust_severity, type: integer, source: input, description: "Technician-rated contamination severity 0..10", constraints: "0 <= x <= 10" }
      - { name: recommend_hvac_repair, type: boolean, source: input, description: "Whether the technician flags an HVAC repair upsell", default: false }
      - { name: phase, type: enum, source: system, description: "BEFORE | AFTER — BEFORE captured at inspection, AFTER captured at completion", constraints: "BEFORE | AFTER", default: "BEFORE" }

  # ---------------------------------------------------------------------------
  - name: RecurringPlan
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC; refreshed on every mutation including reminder advances" }
      - { name: version, type: integer, source: system, description: "Starts at 1; +1 on every mutation" }
      - { name: home_id, type: string, source: input, description: "FK -> Home.id; the enrolled home" }
      - { name: cadence_months, type: integer, source: input, description: "Months between scheduled services", constraints: "x IN {6, 12, 24}" }
      - { name: enrolled_at, type: datetime, source: system, description: "Logical-clock time the plan was activated; anchor for reminder math" }
      - { name: next_reminder_at, type: datetime, source: computed, description: "Logical time the next reminder is due = anchor + cadence_months; advances on acknowledge" }
      - { name: reminder_status, type: enum, source: system, description: "Parallel dimension: WAITING | DUE | ACKNOWLEDGED", constraints: "WAITING | DUE | ACKNOWLEDGED", default: "WAITING" }
      - { name: lifecycle_status, type: enum, source: system, description: "Parallel dimension: ACTIVE | PAUSED | CANCELLED", constraints: "ACTIVE | PAUSED | CANCELLED", default: "ACTIVE" }

  # ---------------------------------------------------------------------------
  - name: UpsellReferral
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: version, type: integer, source: system, description: "Starts at 1; +1 on every mutation" }
      - { name: work_order_id, type: string, source: input, description: "FK -> WorkOrder.id; the originating work order" }
      - { name: home_id, type: string, source: input, description: "FK -> Home.id; the referred home (denormalized from work order for query)" }
      - { name: severity_at_referral, type: integer, source: system, description: "Snapshot of the AFTER inspection dust_severity at referral time" }
      - { name: status, type: enum, source: system, description: "PENDING | DECLINED | EXPIRED", constraints: "PENDING | DECLINED | EXPIRED", default: "PENDING" }

  # ---------------------------------------------------------------------------
  - name: CallbackTicket
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC; chronological tie-break for resolution ordering" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: version, type: integer, source: system, description: "Starts at 1; +1 on every mutation" }
      - { name: work_order_id, type: string, source: input, description: "FK -> WorkOrder.id; the completed work order being complained about" }
      - { name: reopened_from_ticket_id, type: string, source: input, description: "FK -> CallbackTicket.id; set when this ticket reopens a prior RESOLVED ticket (self-referential)", default: null }
      - { name: reason, type: string, source: input, description: "Free-text complaint reason" }
      - { name: redo_required, type: boolean, source: input, description: "Whether a no-charge redo visit is required", default: false }
      - { name: status, type: enum, source: system, description: "OPEN | RESOLVED | REOPENED", constraints: "OPEN | RESOLVED | REOPENED", default: "OPEN" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---------------------------------------------------------------------------
  # WorkOrder — cyclic (QUOTED -> INSPECTED re-inspect loop) + cross-entity guards
  # ---------------------------------------------------------------------------
  - entity: WorkOrder
    field: status
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: INSPECTED
        trigger: "POST /work-orders/{id}/inspect"
        actor: Technician
        preconditions:
          - "WorkOrder.status == DRAFT (else ERR_WORK_ORDER_BAD_STATE)"
          - "All service_lines reference systems whose status == ACTIVE on the WorkOrder's home (else ERR_SYSTEM_NOT_ACTIVE)"
        side_effects:
          - "Creates one Inspection row with phase=BEFORE from the request body (before_photo_count, dust_severity, recommend_hvac_repair)"
          - "WorkOrder.updated_at refreshed"

      - from: INSPECTED
        to: QUOTED
        trigger: "POST /work-orders/{id}/quote"
        actor: Technician
        preconditions:
          - "WorkOrder.status == INSPECTED (else ERR_WORK_ORDER_BAD_STATE)"
          - "Exactly one PricingConfig has status == ACTIVE (else ERR_NO_ACTIVE_PRICING_CONFIG)"
        side_effects:
          - "pricing_config_id pinned to the ACTIVE PricingConfig.id (version-pinned snapshot)"
          - "estimate_total_cents computed via calculation estimate_total (CROSS-ENTITY: reads Home.active_system_count and Home.has_active_plan)"
          - "duration_minutes computed via calculation work_order_duration"
          - "WorkOrder.updated_at refreshed"

      - from: QUOTED
        to: INSPECTED
        trigger: "POST /work-orders/{id}/inspect"
        actor: Technician
        preconditions:
          - "WorkOrder.status == QUOTED (re-inspection loop; else ERR_WORK_ORDER_BAD_STATE)"
          - "WorkOrder.route_plan_id is null — a committed order cannot be re-inspected (else ERR_WORK_ORDER_ALREADY_SCHEDULED)"
        side_effects:
          - "Replaces the BEFORE Inspection row with a fresh one from the request body"
          - "estimate_total_cents and pricing_config_id cleared back to null (re-quote required)"
          - "WorkOrder.updated_at refreshed"
        note: "Cyclic edge: QUOTED -> INSPECTED -> QUOTED enables a revision round."

      - from: QUOTED
        to: SCHEDULED
        trigger: "POST /route-plans/{id}/commit"
        actor: Dispatcher
        preconditions:
          - "WorkOrder.status == QUOTED (else ERR_WORK_ORDER_BAD_STATE)"
          - "RoutePlan.status == OPEN (else ERR_ROUTE_NOT_OPEN)"
          - "RoutePlan.zone_code == WorkOrder's Home.zone_code (CROSS-ENTITY: WorkOrder->RoutePlan zone match; else ERR_ZONE_MISMATCH)"
          - "If addons contains UV then the RoutePlan's CrewMember.certified_for_uv == true (CROSS-ENTITY: WorkOrder->CrewMember; else ERR_CREW_NOT_UV_CERTIFIED)"
          - "Committed [scheduled_start_minute, scheduled_start_minute+duration_minutes) plus BUFFER_MINUTES does not overlap any existing committed slot on the route (else ERR_SLOT_OVERLAP)"
          - "scheduled_start_minute >= RoutePlan.shift_start_minute and scheduled_start_minute+duration_minutes <= RoutePlan.shift_end_minute (else ERR_OUTSIDE_SHIFT)"
          - "expected_route_plan_version matches RoutePlan.version (else ERR_STALE_ROUTE_VERSION)"
        side_effects:
          - "WorkOrder.route_plan_id set to the route; crew_member_id copied from RoutePlan; scheduled_start_minute set"
          - "RoutePlan.committed_minutes += WorkOrder.duration_minutes (CASCADE: derived field on RoutePlan)"
          - "RoutePlan.version += 1"
          - "RoutePlan.updated_at refreshed"

      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /work-orders/{id}/start"
        actor: Technician
        preconditions:
          - "WorkOrder.status == SCHEDULED (else ERR_WORK_ORDER_BAD_STATE)"
          - "RoutePlan.status == LOCKED (CROSS-ENTITY: WorkOrder->RoutePlan; route must be locked before work starts; else ERR_ROUTE_NOT_LOCKED)"
        side_effects:
          - "WorkOrder.updated_at refreshed"

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /work-orders/{id}/complete"
        actor: Technician
        preconditions:
          - "WorkOrder.status == IN_PROGRESS (else ERR_WORK_ORDER_BAD_STATE)"
          - "after_photo_count in request body >= MIN_AFTER_PHOTOS where MIN_AFTER_PHOTOS == 1 (else ERR_INSUFFICIENT_AFTER_PHOTOS)"
        side_effects:
          - "Inspection AFTER row created/updated from request (after_photo_count, dust_severity, recommend_hvac_repair)"
          - "invoice_total_cents computed via calculation invoice_total from performed_service_lines/performed_addons in the request body"
          - "CASCADE depth-3: if AFTER inspection recommend_hvac_repair == true -> create UpsellReferral(status=PENDING); that referral creation itself bumps Home.updated_at via the home denormalization touch"
          - "If the Home has a RecurringPlan with lifecycle_status==ACTIVE and reminder_status==DUE -> that plan's reminder_status set to ACKNOWLEDGED and next_reminder_at advanced by cadence_months (CASCADE to RecurringPlan)"
          - "WorkOrder.updated_at refreshed"

      - from: [DRAFT, INSPECTED, QUOTED, SCHEDULED]
        to: CANCELLED
        trigger: "POST /work-orders/{id}/cancel"
        actor: Dispatcher
        preconditions:
          - "WorkOrder.status IN {DRAFT, INSPECTED, QUOTED, SCHEDULED} (else ERR_WORK_ORDER_BAD_STATE)"
        side_effects:
          - "If route_plan_id is set: RoutePlan.committed_minutes -= WorkOrder.duration_minutes; RoutePlan.version += 1 (CASCADE: derived-field reversal — compensating invariant)"
          - "route_plan_id, crew_member_id, scheduled_start_minute cleared to null"
          - "WorkOrder.updated_at refreshed"

  # ---------------------------------------------------------------------------
  # RoutePlan — compound (committed_minutes derived from child WorkOrders) + lifecycle
  # ---------------------------------------------------------------------------
  - entity: RoutePlan
    field: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: LOCKED
        trigger: "POST /route-plans/{id}/lock"
        actor: Dispatcher
        preconditions:
          - "RoutePlan.status == OPEN (else ERR_ROUTE_BAD_STATE)"
          - "committed_minutes > 0 — cannot lock an empty route (else ERR_ROUTE_EMPTY)"
        side_effects:
          - "No further commits accepted (commit requires OPEN)"
          - "RoutePlan.version += 1"
          - "RoutePlan.updated_at refreshed"

      - from: LOCKED
        to: CLOSED
        trigger: "POST /route-plans/{id}/close"
        actor: Dispatcher
        preconditions:
          - "RoutePlan.status == LOCKED (else ERR_ROUTE_BAD_STATE)"
          - "No WorkOrder committed to this route is in status SCHEDULED or IN_PROGRESS (CROSS-ENTITY: RoutePlan->WorkOrder; every committed order must be COMPLETED or CANCELLED; else ERR_ROUTE_HAS_OPEN_WORK)"
        side_effects:
          - "RoutePlan.version += 1"
          - "RoutePlan.updated_at refreshed"

  # ---------------------------------------------------------------------------
  # RecurringPlan — parallel state dimensions (reminder_status × lifecycle_status)
  # ---------------------------------------------------------------------------
  - entity: RecurringPlan
    field: reminder_status
    initial_state: WAITING
    terminal_states: []
    transitions:
      - from: WAITING
        to: DUE
        trigger: "POST /_clock/set_current_utc (system re-evaluates when clock >= next_reminder_at) or POST /recurring-plans/{id}/refresh-reminder"
        actor: system
        preconditions:
          - "RecurringPlan.lifecycle_status == ACTIVE (PAUSED/CANCELLED plans never go DUE; else ERR_PLAN_NOT_ACTIVE)"
          - "logical clock now >= next_reminder_at (else no transition; ERR_REMINDER_NOT_DUE on explicit force)"
        side_effects:
          - "reminder_status -> DUE"
          - "RecurringPlan.updated_at refreshed"

      - from: DUE
        to: ACKNOWLEDGED
        trigger: "POST /recurring-plans/{id}/acknowledge OR system cascade from WorkOrder COMPLETE on the same Home"
        actor: PlanAdmin
        preconditions:
          - "RecurringPlan.reminder_status == DUE (else ERR_REMINDER_NOT_DUE)"
          - "RecurringPlan.lifecycle_status == ACTIVE (else ERR_PLAN_NOT_ACTIVE)"
        side_effects:
          - "next_reminder_at advanced by cadence_months from the prior next_reminder_at (calculation next_reminder_advance)"
          - "reminder_status -> ACKNOWLEDGED"
          - "RecurringPlan.updated_at refreshed"

      - from: ACKNOWLEDGED
        to: WAITING
        trigger: "system (immediately after acknowledge, re-arms the reminder for the next cycle)"
        actor: system
        preconditions:
          - "RecurringPlan.lifecycle_status == ACTIVE"
        side_effects:
          - "reminder_status -> WAITING (cyclic re-arm)"
        note: "Parallel-dimension cycle: WAITING -> DUE -> ACKNOWLEDGED -> WAITING evolves independently of lifecycle_status."

  - entity: RecurringPlan
    field: lifecycle_status
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /recurring-plans/{id}/pause"
        actor: PlanAdmin
        preconditions:
          - "RecurringPlan.lifecycle_status == ACTIVE (else ERR_PLAN_BAD_STATE)"
        side_effects:
          - "Home.has_active_plan recomputed (CROSS-ENTITY CASCADE to Home; becomes false if no other ACTIVE plan)"
          - "RecurringPlan.updated_at refreshed"

      - from: PAUSED
        to: ACTIVE
        trigger: "POST /recurring-plans/{id}/resume"
        actor: PlanAdmin
        preconditions:
          - "RecurringPlan.lifecycle_status == PAUSED (else ERR_PLAN_BAD_STATE)"
        side_effects:
          - "Home.has_active_plan recomputed -> true (CROSS-ENTITY CASCADE to Home)"
          - "RecurringPlan.updated_at refreshed"

      - from: [ACTIVE, PAUSED]
        to: CANCELLED
        trigger: "POST /recurring-plans/{id}/cancel"
        actor: PlanAdmin
        preconditions:
          - "RecurringPlan.lifecycle_status IN {ACTIVE, PAUSED} (else ERR_PLAN_BAD_STATE)"
        side_effects:
          - "reminder_status frozen at its current value (no further reminder transitions)"
          - "Home.has_active_plan recomputed (CROSS-ENTITY CASCADE to Home)"
          - "RecurringPlan.updated_at refreshed"

  # ---------------------------------------------------------------------------
  # UpsellReferral — branching fork from PENDING with divergent side-effects
  # ---------------------------------------------------------------------------
  - entity: UpsellReferral
    field: status
    initial_state: PENDING
    terminal_states: [DECLINED, EXPIRED]
    transitions:
      - from: PENDING
        to: DECLINED
        trigger: "POST /upsell-referrals/{id}/decline"
        actor: PlanAdmin
        preconditions:
          - "UpsellReferral.status == PENDING (else ERR_REFERRAL_BAD_STATE)"
        side_effects:
          - "UpsellReferral.updated_at refreshed"
        note: "Branch fork from PENDING: DECLINED (manual) vs EXPIRED (clock-driven) diverge — DECLINED records an explicit operator decision, EXPIRED records a lapse with no operator action."

      - from: PENDING
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc (system expires referrals older than REFERRAL_TTL_DAYS) or POST /upsell-referrals/{id}/expire"
        actor: system
        preconditions:
          - "UpsellReferral.status == PENDING (else ERR_REFERRAL_BAD_STATE)"
          - "logical clock now >= created_at + REFERRAL_TTL_DAYS days, where REFERRAL_TTL_DAYS == 30"
        side_effects:
          - "UpsellReferral.updated_at refreshed"

  # ---------------------------------------------------------------------------
  # CallbackTicket — self-referential reopen cycle
  # ---------------------------------------------------------------------------
  - entity: CallbackTicket
    field: status
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "POST /callback-tickets/{id}/resolve"
        actor: Dispatcher
        preconditions:
          - "CallbackTicket.status == OPEN (else ERR_TICKET_BAD_STATE)"
          - "The referenced WorkOrder.status == COMPLETED (CROSS-ENTITY: CallbackTicket->WorkOrder; else ERR_WORK_ORDER_NOT_COMPLETED)"
        side_effects:
          - "CallbackTicket.updated_at refreshed"

      - from: RESOLVED
        to: REOPENED
        trigger: "POST /callback-tickets/{id}/reopen"
        actor: Dispatcher
        preconditions:
          - "CallbackTicket.status == RESOLVED (else ERR_TICKET_BAD_STATE)"
        side_effects:
          - "CallbackTicket.updated_at refreshed"
        note: "Self-referential cycle: a reopen may also be modeled by a new ticket whose reopened_from_ticket_id points at this one."

      - from: REOPENED
        to: RESOLVED
        trigger: "POST /callback-tickets/{id}/resolve"
        actor: Dispatcher
        preconditions:
          - "CallbackTicket.status == REOPENED (else ERR_TICKET_BAD_STATE)"
        side_effects:
          - "CallbackTicket.updated_at refreshed"
        note: "Cyclic: RESOLVED -> REOPENED -> RESOLVED revision loop."

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: slot-commit-stale-route
    parent_entity: RoutePlan
    write_endpoint: "POST /route-plans/{id}/commit"
    occ_field: "expected_route_plan_version"
    description: |
      Committing a WorkOrder slot against a RoutePlan whose version has advanced
      since the dispatcher last read it is rejected. A prior commit legitimately
      filled an overlapping window and bumped committed_minutes and version; the
      current commit carries a stale version and is rejected on the stale-version
      check before any overlap arithmetic mutates the route.
    error_id: ERR_STALE_ROUTE_VERSION
    http_status: 412

  - rule_id: plan-create-stale-home
    parent_entity: Home
    write_endpoint: "POST /homes/{id}/recurring-plans"
    occ_field: "expected_home_version"
    description: |
      Enrolling a Home in a RecurringPlan against a Home whose version has
      advanced since the client last observed it is rejected. Another writer may
      have just enrolled the home in a plan (which legitimately makes the home a
      plan member and flips has_active_plan); the current writer's view of the
      home is therefore stale and the create is rejected.
    error_id: ERR_STALE_HOME_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  # --- (1) Pricing engine: ESTIMATE variant ------------------------------------
  - name: estimate_total
    trigger: "WorkOrder INSPECTED -> QUOTED transition (POST /work-orders/{id}/quote)"
    algorithm: tiered_pricing
    formula: |
      cfg = ACTIVE PricingConfig (snapshot pinned as pricing_config_id)
      n = Home.active_system_count   # quoted off the HOME's CURRENT active system count
      # Per-service-line subtotals from the QUOTED service_lines:
      duct_lines    = count of service_lines with service_type == DUCT
      sanitize_lines= count of service_lines with service_type == SANITIZE
      dryer_lines   = count of service_lines with service_type == DRYER_VENT
      duct_subtotal     = duct_lines  * (cfg.duct_base_cents + max(0, n - 1) * cfg.duct_per_system_cents)
      sanitize_subtotal = sanitize_lines * cfg.sanitize_per_system_cents
      dryer_subtotal    = dryer_lines * cfg.dryer_vent_flat_cents
      # Multi-system discount applies ONLY to the duct line subtotal:
      if n >= MULTI_SYSTEM_THRESHOLD:
        duct_subtotal = round_half_up(duct_subtotal * (1 - cfg.multi_system_discount_pct))
      addon_subtotal = sum over DISTINCT addons of cfg.addon_<code>_cents
      service_subtotal = duct_subtotal + sanitize_subtotal + dryer_subtotal + addon_subtotal
      # Plan-member discount applies to the WHOLE service_subtotal, computed AFTER
      # the multi-system discount (EVALUATION ORDER PINNED — circular-looking dep):
      if Home.has_active_plan == true:
        service_subtotal = round_half_up(service_subtotal * (1 - cfg.plan_member_discount_pct))
      tax = round_half_up(service_subtotal * cfg.tax_pct)
      estimate_total_cents = service_subtotal + tax
    input_set: "service_lines and addons supplied on the WorkOrder at QUOTE time; Home.active_system_count and Home.has_active_plan read live at QUOTE time"
    constants:
      MULTI_SYSTEM_THRESHOLD: 2
    precision: "integer cents; round_half_up applied at each pinned step (discount step, then plan step, then tax) — round-per-step then sum, NOT sum-then-round"
    variants:
      - name: estimate_variant
        when: "computed at QUOTE time off the Home's CURRENT active_system_count and has_active_plan, over the REQUESTED service_lines/addons"
        difference: "Uses live Home counts; a system added/decommissioned AFTER quote does NOT change estimate_total_cents (snapshot semantics on the WorkOrder)."

  # --- (2) Pricing engine: INVOICE variant (dual-variant on same WorkOrder domain
  #         but DIFFERENT subject than risk scoring — see Rule 1 pairing) ----------
  - name: invoice_total
    trigger: "WorkOrder IN_PROGRESS -> COMPLETED transition (POST /work-orders/{id}/complete)"
    algorithm: tiered_pricing
    formula: |
      cfg = the PINNED PricingConfig (WorkOrder.pricing_config_id), NOT the live ACTIVE one
      n_at_complete = Home.active_system_count   # read LIVE at COMPLETE time
      # performed_service_lines / performed_addons come from the COMPLETE request body
      # (technician may have performed fewer/more lines than quoted):
      duct_lines    = count of performed_service_lines with service_type == DUCT
      sanitize_lines= count of performed_service_lines with service_type == SANITIZE
      dryer_lines   = count of performed_service_lines with service_type == DRYER_VENT
      duct_subtotal     = duct_lines  * (cfg.duct_base_cents + max(0, n_at_complete - 1) * cfg.duct_per_system_cents)
      sanitize_subtotal = sanitize_lines * cfg.sanitize_per_system_cents
      dryer_subtotal    = dryer_lines * cfg.dryer_vent_flat_cents
      if n_at_complete >= MULTI_SYSTEM_THRESHOLD:
        duct_subtotal = round_half_up(duct_subtotal * (1 - cfg.multi_system_discount_pct))
      addon_subtotal = sum over DISTINCT performed_addons of cfg.addon_<code>_cents
      service_subtotal = duct_subtotal + sanitize_subtotal + dryer_subtotal + addon_subtotal
      if Home.has_active_plan == true:
        service_subtotal = round_half_up(service_subtotal * (1 - cfg.plan_member_discount_pct))
      tax = round_half_up(service_subtotal * cfg.tax_pct)
      invoice_total_cents = service_subtotal + tax
    input_set: "performed_service_lines/performed_addons from the COMPLETE request; Home.active_system_count and has_active_plan read live at COMPLETE time; cfg is the PINNED snapshot"
    constants:
      MULTI_SYSTEM_THRESHOLD: 2
    precision: "integer cents; round_half_up at each pinned step in the same fixed order as estimate_total"
    variants:
      - name: invoice_variant
        when: "computed at COMPLETE time off PERFORMED lines and the PINNED config, with live Home counts"
        difference: "Same prose, different number: estimate uses requested lines + config-at-quote; invoice uses performed lines + pinned config + Home counts that may have changed since quote. For identical lines and unchanged home, estimate_total_cents == invoice_total_cents."

  # --- (3) Risk scoring on a DIFFERENT entity domain (Inspection/Home) ----------
  - name: contamination_risk_score
    trigger: "WorkOrder COMPLETED (reads the AFTER Inspection) and on UpsellReferral creation"
    algorithm: weighted_scoring
    formula: |
      # Scored on the AFTER Inspection of the work order, NOT on price.
      after = AFTER Inspection of the work order
      n = Home.active_system_count
      base = after.dust_severity * SEVERITY_WEIGHT
      density = round_half_up( (sum of register_count over ACTIVE HvacSystem on the home) / max(1, n) )
      score = base + density * DENSITY_WEIGHT
      if score > RISK_CEILING: score = RISK_CEILING
      if score < 0: score = 0
      # Referral is recommended iff score >= REFERRAL_RISK_THRESHOLD
    input_set: "AFTER Inspection.dust_severity; ACTIVE HvacSystem register_count for the home"
    constants:
      SEVERITY_WEIGHT: 8
      DENSITY_WEIGHT: 2
      RISK_CEILING: 100
      REFERRAL_RISK_THRESHOLD: 40
    precision: "integer; round_half_up on the density term before weighting"
    variants:
      - name: risk_scoring_variant
        when: "evaluated on Inspection/Home domain, independent of cost accounting"
        difference: "Operates on a different entity domain (Inspection severity + system density) than estimate/invoice cost — satisfies dual-variant across domains (Rule 1)."

  # --- (4) On-site duration estimate (combinatorial formula, mode (a)) ----------
  - name: work_order_duration
    trigger: "WorkOrder INSPECTED -> QUOTED transition"
    algorithm: aggregation
    formula: |
      n = Home.active_system_count
      duct_lines     = count of service_lines with service_type == DUCT
      sanitize_lines = count of service_lines with service_type == SANITIZE
      dryer_lines    = count of service_lines with service_type == DRYER_VENT
      per_line = duct_lines * DUCT_MINUTES_PER_LINE
               + sanitize_lines * SANITIZE_MINUTES_PER_LINE
               + dryer_lines * DRYER_MINUTES_PER_LINE
      per_addon = (count of DISTINCT addons) * ADDON_MINUTES_EACH
      # Non-linear interaction: a "big home" surcharge multiplies only the per_line
      # portion, and only when BOTH system count high AND square footage high:
      if n >= MULTI_SYSTEM_THRESHOLD and Home.square_footage >= LARGE_HOME_SQFT:
        per_line = round_half_up(per_line * BIG_HOME_FACTOR)
      duration_minutes = SETUP_MINUTES + per_line + per_addon
    input_set: "service_lines, addons on the WorkOrder; Home.active_system_count and Home.square_footage"
    constants:
      SETUP_MINUTES: 20
      DUCT_MINUTES_PER_LINE: 35
      SANITIZE_MINUTES_PER_LINE: 15
      DRYER_MINUTES_PER_LINE: 25
      ADDON_MINUTES_EACH: 10
      MULTI_SYSTEM_THRESHOLD: 2
      LARGE_HOME_SQFT: 3000
      BIG_HOME_FACTOR: 1.25
    precision: "integer minutes; round_half_up after applying BIG_HOME_FACTOR to per_line"

  # --- (5) Reminder advance (scheduled action over the logical clock) -----------
  - name: next_reminder_advance
    trigger: "RecurringPlan DUE -> ACKNOWLEDGED transition (acknowledge or cascade from WorkOrder COMPLETE)"
    algorithm: projection
    formula: |
      # Advance the reminder anchor by cadence_months from the PRIOR next_reminder_at,
      # NOT from the current clock — keeps the cadence drift-free across cycles.
      next_reminder_at = add_months(prior_next_reminder_at, cadence_months)
      # add_months clamps day-of-month to the last valid day of the target month.
    input_set: "RecurringPlan.next_reminder_at (prior), cadence_months"
    constants: {}
    precision: "calendar-month arithmetic; day clamped to end-of-month when overflow"

  # --- (6) Route committed-minutes ledger (derived-field reconciliation) --------
  - name: route_committed_minutes
    trigger: "WorkOrder commit / cancel against a RoutePlan"
    algorithm: aggregation
    formula: |
      committed_minutes = sum of duration_minutes over WorkOrders whose
        route_plan_id == this RoutePlan.id AND status IN {SCHEDULED, IN_PROGRESS, COMPLETED}
      # Conserved-quantity invariant: a commit (+d) paired with its compensating
      # cancel (-d) leaves committed_minutes exactly as it was before the commit.
    input_set: "WorkOrders with route_plan_id == route.id and status IN {SCHEDULED, IN_PROGRESS, COMPLETED}"
    constants: {}
    precision: "integer minutes; exact"
    variants:
      - name: committed_minutes_incremental
        when: "applied incrementally on each commit/cancel side-effect"
        difference: "Incremental += / -= must equal a full recompute over the filtered set; the two must reconcile (derived-field reconciliation)."

  # --- (7) Route slot overlap geometry (pins BUFFER_MINUTES; interval semantics) -
  - name: route_slot_overlap
    trigger: "POST /route-plans/{id}/commit (slot collision check)"
    algorithm: interval_merge
    formula: |
      new = [scheduled_start_minute, scheduled_start_minute + duration_minutes)   # HALF-OPEN
      For each existing committed WorkOrder w (status IN {SCHEDULED, IN_PROGRESS, COMPLETED}) on the route:
        ex = [w.scheduled_start_minute, w.scheduled_start_minute + w.duration_minutes)
        # Expand each interval by BUFFER_MINUTES on BOTH sides, then test half-open overlap:
        new_b = [new.start - BUFFER_MINUTES, new.end + BUFFER_MINUTES)
        overlap if new_b.start < ex.end AND ex.start < new_b.end
        # Two slots that merely touch with zero gap (gap == 0) DO collide once buffered;
        # a gap >= BUFFER_MINUTES is required between adjacent slots.
      reject with ERR_SLOT_OVERLAP on any overlap.
    input_set: "committed WorkOrders on the route with status IN {SCHEDULED, IN_PROGRESS, COMPLETED}"
    constants:
      BUFFER_MINUTES: 15
    precision: "integer minutes; half-open interval arithmetic with symmetric buffer"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and X-User-Role is a known role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path resources exist, validated left-to-right (home, then nested system/work-order; route, work-order, plan, referral, ticket by id)"
    error_id: "ERR_HOME_NOT_FOUND / ERR_SYSTEM_NOT_FOUND / ERR_WORK_ORDER_NOT_FOUND / ERR_ROUTE_NOT_FOUND / ERR_PLAN_NOT_FOUND / ERR_REFERRAL_NOT_FOUND / ERR_TICKET_NOT_FOUND / ERR_PRICING_CONFIG_NOT_FOUND / ERR_HOMEOWNER_NOT_FOUND / ERR_CREW_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints with path ids

  - priority: 4
    category: business_referential
    check: "FK fields in request body reference existing rows (homeowner_id, home_id, crew_member_id, work_order_id, reopened_from_ticket_id); service_line.system_id references an HvacSystem on the SAME home"
    error_id: "ERR_HOME_NOT_FOUND / ERR_HOMEOWNER_NOT_FOUND / ERR_CREW_NOT_FOUND / ERR_WORK_ORDER_NOT_FOUND / ERR_SYSTEM_NOT_FOUND / ERR_TICKET_NOT_FOUND"
    http_status: 404
    applies_to: "create endpoints with FK body fields"

  - priority: 5
    category: business_constraint
    check: "Request body shape valid: required fields present, enums in range, service_lines non-empty, service_type in {DUCT,DRYER_VENT,SANITIZE}, addon codes in {SANITIZER,UV,COIL}, DUCT/SANITIZE lines carry system_id, DRYER_VENT lines omit system_id, integers within declared bounds"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all write endpoints

  - priority: 6
    category: state
    check: "Target resource in correct state for the requested transition (WorkOrder/RoutePlan/RecurringPlan/UpsellReferral/CallbackTicket)"
    error_id: "ERR_WORK_ORDER_BAD_STATE / ERR_ROUTE_BAD_STATE / ERR_PLAN_BAD_STATE / ERR_REFERRAL_BAD_STATE / ERR_TICKET_BAD_STATE"
    http_status: 409
    applies_to: transition endpoints

  - priority: 7
    category: state
    check: "Cross-entity state guards: re-inspect requires route_plan_id null (ERR_WORK_ORDER_ALREADY_SCHEDULED); start requires RoutePlan LOCKED (ERR_ROUTE_NOT_LOCKED); resolve callback requires WorkOrder COMPLETED (ERR_WORK_ORDER_NOT_COMPLETED); reminder DUE requires plan ACTIVE (ERR_PLAN_NOT_ACTIVE)"
    error_id: "ERR_WORK_ORDER_ALREADY_SCHEDULED / ERR_ROUTE_NOT_LOCKED / ERR_WORK_ORDER_NOT_COMPLETED / ERR_PLAN_NOT_ACTIVE"
    http_status: 409
    applies_to: "inspect (re), start, callback resolve, reminder transitions"

  - priority: 8
    category: business_safety
    check: "Commit with a UV add-on requires the route's CrewMember.certified_for_uv == true"
    error_id: ERR_CREW_NOT_UV_CERTIFIED
    http_status: 422
    applies_to: "POST /route-plans/{id}/commit"

  - priority: 9
    category: business_constraint
    check: "Commit zone match: RoutePlan.zone_code == Home.zone_code of the work order"
    error_id: ERR_ZONE_MISMATCH
    http_status: 422
    applies_to: "POST /route-plans/{id}/commit"

  - priority: 10
    category: business_temporal
    check: "Commit slot must lie within the shift window: scheduled_start_minute >= shift_start_minute AND scheduled_start_minute + duration_minutes <= shift_end_minute"
    error_id: ERR_OUTSIDE_SHIFT
    http_status: 422
    applies_to: "POST /route-plans/{id}/commit"

  - priority: 11
    category: business_temporal
    check: "Commit slot [start, start+duration) extended by BUFFER_MINUTES (== 15) on each side must not overlap any existing committed slot on the same route (half-open intervals per calculation route_slot_overlap; adjacent slots need a gap >= BUFFER_MINUTES)"
    error_id: ERR_SLOT_OVERLAP
    http_status: 409
    applies_to: "POST /route-plans/{id}/commit"

  - priority: 11b
    category: business_temporal
    check: "Crew double-booking on RoutePlan create: the chosen crew_member_id must not already own another RoutePlan on the same service_date whose closed shift window [shift_start_minute, shift_end_minute] overlaps the new one. Whole-window overlap with NO buffer and CLOSED-interval semantics (windows that merely touch at a shared boundary minute DO overlap) — distinct from the buffered half-open slot-collision in priority 11."
    error_id: ERR_CREW_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /route-plans"

  - priority: 12
    category: business_safety
    check: "Completion requires after_photo_count >= MIN_AFTER_PHOTOS (MIN_AFTER_PHOTOS == 1)"
    error_id: ERR_INSUFFICIENT_AFTER_PHOTOS
    http_status: 422
    applies_to: "POST /work-orders/{id}/complete"

  - priority: 13
    category: business_constraint
    check: "At most one PricingConfig may be ACTIVE; quoting requires exactly one ACTIVE config"
    error_id: "ERR_NO_ACTIVE_PRICING_CONFIG / ERR_PRICING_CONFIG_ALREADY_ACTIVE"
    http_status: 409
    applies_to: "POST /work-orders/{id}/quote, POST /pricing-configs/{id}/activate"

  - priority: 14
    category: business_constraint
    check: "A Home may have at most one RecurringPlan whose lifecycle_status IN {ACTIVE, PAUSED} at a time"
    error_id: ERR_PLAN_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /homes/{id}/recurring-plans"

  - priority: 15
    category: business_fiscal
    check: "OCC: expected_route_plan_version must equal RoutePlan.version on commit; expected_home_version must equal Home.version on plan create"
    error_id: "ERR_STALE_ROUTE_VERSION / ERR_STALE_HOME_VERSION"
    http_status: 412
    applies_to: "POST /route-plans/{id}/commit, POST /homes/{id}/recurring-plans"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- PricingConfig -----------------------------------------------------------
  - method: POST
    path: "/pricing-configs"
    description: "Create a DRAFT PricingConfig"
    roles: [PlanAdmin]
    code: 201
    input: [duct_base_cents, duct_per_system_cents, dryer_vent_flat_cents, sanitize_per_system_cents, addon_sanitizer_cents, addon_uv_cents, addon_coil_cents, multi_system_discount_pct, plan_member_discount_pct, tax_pct]
    output: PricingConfig
    side_effects: ["status=DRAFT, version=1"]

  - method: GET
    path: "/pricing-configs/{id}"
    description: "Get one PricingConfig"
    roles: [PlanAdmin, Dispatcher, Technician]
    code: 200
    input: []
    output: PricingConfig
    side_effects: []

  - method: POST
    path: "/pricing-configs/{id}/activate"
    description: "Activate a DRAFT config; retires the currently ACTIVE one"
    roles: [PlanAdmin]
    code: 200
    input: []
    output: PricingConfig
    side_effects: ["status DRAFT->ACTIVE", "any prior ACTIVE config -> RETIRED (CASCADE)", "version += 1"]

  # --- Homeowner ---------------------------------------------------------------
  - method: POST
    path: "/homeowners"
    description: "Register a Homeowner (customer identity)"
    roles: [PlanAdmin, Dispatcher]
    code: 201
    input: [full_name, email, phone]
    output: Homeowner
    side_effects: ["version=1"]

  # --- Home --------------------------------------------------------------------
  - method: POST
    path: "/homes"
    description: "Create a Home for a Homeowner"
    roles: [PlanAdmin, Dispatcher]
    code: 201
    input: [homeowner_id, address_line, zone_code, square_footage]
    output: Home
    side_effects: ["active_system_count=0, has_active_plan=false, version=1"]

  - method: GET
    path: "/homes"
    description: "List Homes; filter by homeowner_id or zone_code"
    roles: [PlanAdmin, Dispatcher, Technician]
    code: 200
    input: ["homeowner_id?", "zone_code?", "limit?", "offset?"]
    output: Home[]
    side_effects: []

  - method: GET
    path: "/homes/{id}"
    description: "Get one Home (includes computed active_system_count, has_active_plan)"
    roles: [PlanAdmin, Dispatcher, Technician, Homeowner]
    code: 200
    input: []
    output: Home
    side_effects: []

  # --- HvacSystem (nested under Home) ------------------------------------------
  - method: POST
    path: "/homes/{id}/systems"
    description: "Add an HvacSystem to a Home"
    roles: [PlanAdmin, Dispatcher]
    code: 201
    input: [label, register_count]
    output: HvacSystem
    side_effects: ["status=ACTIVE", "Home.active_system_count recomputed (CASCADE)", "Home.version += 1"]

  - method: GET
    path: "/homes/{id}/systems"
    description: "List HvacSystems for a Home (reverse-reachability for HvacSystem.home_id)"
    roles: [PlanAdmin, Dispatcher, Technician]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: HvacSystem[]
    side_effects: []

  - method: POST
    path: "/homes/{id}/systems/{systemId}/decommission"
    description: "Decommission an HvacSystem"
    roles: [PlanAdmin, Dispatcher]
    code: 200
    input: []
    output: HvacSystem
    side_effects: ["status ACTIVE->DECOMMISSIONED", "Home.active_system_count recomputed (CASCADE)", "Home.version += 1"]

  # --- RecurringPlan (nested create under Home for OCC parent) -----------------
  - method: POST
    path: "/homes/{id}/recurring-plans"
    description: "Enroll a Home in a RecurringPlan (OCC on Home.version)"
    roles: [PlanAdmin]
    code: 201
    input: [cadence_months, expected_home_version]
    output: RecurringPlan
    side_effects: ["lifecycle_status=ACTIVE, reminder_status=WAITING", "enrolled_at = clock now; next_reminder_at = clock now + cadence_months", "Home.has_active_plan recomputed -> true (CASCADE)", "Home.version += 1"]

  - method: GET
    path: "/homes/{id}/recurring-plans"
    description: "List RecurringPlans for a Home (reverse-reachability for RecurringPlan.home_id)"
    roles: [PlanAdmin, Dispatcher, Homeowner]
    code: 200
    input: ["lifecycle_status?", "limit?", "offset?"]
    output: RecurringPlan[]
    side_effects: []

  - method: POST
    path: "/recurring-plans/{id}/acknowledge"
    description: "Acknowledge a DUE reminder; advances next_reminder_at and re-arms"
    roles: [PlanAdmin]
    code: 200
    input: []
    output: RecurringPlan
    side_effects: ["reminder_status DUE->ACKNOWLEDGED->WAITING", "next_reminder_at += cadence_months (calc next_reminder_advance)", "version += 1"]

  - method: POST
    path: "/recurring-plans/{id}/refresh-reminder"
    description: "Force a reminder re-evaluation against the logical clock (WAITING->DUE if due)"
    roles: [PlanAdmin, Dispatcher]
    code: 200
    input: []
    output: RecurringPlan
    side_effects: ["reminder_status WAITING->DUE if clock now >= next_reminder_at and lifecycle ACTIVE", "version += 1"]

  - method: POST
    path: "/recurring-plans/{id}/pause"
    description: "Pause an ACTIVE plan"
    roles: [PlanAdmin]
    code: 200
    input: []
    output: RecurringPlan
    side_effects: ["lifecycle_status ACTIVE->PAUSED", "Home.has_active_plan recomputed (CASCADE)", "version += 1"]

  - method: POST
    path: "/recurring-plans/{id}/resume"
    description: "Resume a PAUSED plan"
    roles: [PlanAdmin]
    code: 200
    input: []
    output: RecurringPlan
    side_effects: ["lifecycle_status PAUSED->ACTIVE", "Home.has_active_plan recomputed -> true (CASCADE)", "version += 1"]

  - method: POST
    path: "/recurring-plans/{id}/cancel"
    description: "Cancel a plan"
    roles: [PlanAdmin]
    code: 200
    input: []
    output: RecurringPlan
    side_effects: ["lifecycle_status ->CANCELLED", "Home.has_active_plan recomputed (CASCADE)", "version += 1"]

  # --- CrewMember --------------------------------------------------------------
  - method: POST
    path: "/crew-members"
    description: "Create a CrewMember"
    roles: [Dispatcher]
    code: 201
    input: [full_name, home_zone_code, "certified_for_uv?"]
    output: CrewMember
    side_effects: ["version=1"]

  # --- RoutePlan ---------------------------------------------------------------
  - method: POST
    path: "/route-plans"
    description: "Create a RoutePlan for a crew/zone/date; rejects crew double-booking (ERR_CREW_DOUBLE_BOOKED) when the crew already has an overlapping-window route on the same service_date"
    roles: [Dispatcher]
    code: 201
    input: [crew_member_id, zone_code, service_date, shift_start_minute, shift_end_minute]
    output: RoutePlan
    side_effects: ["status=OPEN, committed_minutes=0, version=1", "validates crew_member has no overlapping RoutePlan on service_date (else ERR_CREW_DOUBLE_BOOKED)"]

  - method: GET
    path: "/route-plans"
    description: "List RoutePlans; filter by crew_member_id, zone_code, or status"
    roles: [PlanAdmin, Dispatcher, Technician]
    code: 200
    input: ["crew_member_id?", "zone_code?", "status?", "limit?", "offset?"]
    output: RoutePlan[]
    side_effects: []

  - method: GET
    path: "/route-plans/{id}"
    description: "Get one RoutePlan (includes computed committed_minutes)"
    roles: [PlanAdmin, Dispatcher, Technician]
    code: 200
    input: []
    output: RoutePlan
    side_effects: []

  - method: POST
    path: "/route-plans/{id}/commit"
    description: "Commit a QUOTED WorkOrder into a time slot on this route (OCC on RoutePlan.version)"
    roles: [Dispatcher]
    code: 200
    input: [work_order_id, scheduled_start_minute, expected_route_plan_version]
    output: WorkOrder
    side_effects: ["WorkOrder QUOTED->SCHEDULED; route_plan_id/crew_member_id/scheduled_start_minute set", "RoutePlan.committed_minutes += duration_minutes (CASCADE)", "RoutePlan.version += 1"]

  - method: POST
    path: "/route-plans/{id}/lock"
    description: "Lock a route so no further commits are accepted"
    roles: [Dispatcher]
    code: 200
    input: []
    output: RoutePlan
    side_effects: ["status OPEN->LOCKED", "version += 1"]

  - method: POST
    path: "/route-plans/{id}/close"
    description: "Close a locked route after all committed work is resolved"
    roles: [Dispatcher]
    code: 200
    input: []
    output: RoutePlan
    side_effects: ["status LOCKED->CLOSED", "version += 1"]

  # --- WorkOrder ---------------------------------------------------------------
  - method: POST
    path: "/work-orders"
    description: "Create a DRAFT WorkOrder for a Home"
    roles: [Dispatcher, Technician]
    code: 201
    input: [home_id, service_lines, "addons?", requested_start_minute]
    output: WorkOrder
    side_effects: ["status=DRAFT, version=1"]

  - method: GET
    path: "/work-orders"
    description: "List WorkOrders; filter by home_id, route_plan_id, crew_member_id, pricing_config_id, or status (reverse-reachability for WorkOrder.home_id, route_plan_id, crew_member_id, pricing_config_id)"
    roles: [PlanAdmin, Dispatcher, Technician]
    code: 200
    input: ["home_id?", "route_plan_id?", "crew_member_id?", "pricing_config_id?", "status?", "limit?", "offset?"]
    output: WorkOrder[]
    side_effects: []

  - method: GET
    path: "/work-orders/{id}"
    description: "Get one WorkOrder (includes computed estimate_total_cents, invoice_total_cents, duration_minutes)"
    roles: [PlanAdmin, Dispatcher, Technician, Homeowner]
    code: 200
    input: []
    output: WorkOrder
    side_effects: []

  - method: POST
    path: "/work-orders/{id}/inspect"
    description: "Record a BEFORE inspection; DRAFT->INSPECTED, or QUOTED->INSPECTED re-inspection"
    roles: [Technician]
    code: 200
    input: [before_photo_count, dust_severity, "recommend_hvac_repair?"]
    output: WorkOrder
    side_effects: ["Creates/replaces BEFORE Inspection", "On re-inspect: estimate_total_cents and pricing_config_id cleared", "version += 1"]

  - method: POST
    path: "/work-orders/{id}/quote"
    description: "Quote an inspected WorkOrder; INSPECTED->QUOTED, pins config, computes estimate + duration"
    roles: [Technician]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["pricing_config_id pinned", "estimate_total_cents computed (calc estimate_total)", "duration_minutes computed (calc work_order_duration)", "version += 1"]

  - method: POST
    path: "/work-orders/{id}/start"
    description: "Begin on-site work; SCHEDULED->IN_PROGRESS (route must be LOCKED)"
    roles: [Technician]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["status SCHEDULED->IN_PROGRESS", "version += 1"]

  - method: POST
    path: "/work-orders/{id}/complete"
    description: "Complete work; IN_PROGRESS->COMPLETED, records AFTER inspection, computes invoice, cascades"
    roles: [Technician]
    code: 200
    input: [after_photo_count, dust_severity, "recommend_hvac_repair?", performed_service_lines, "performed_addons?"]
    output: WorkOrder
    side_effects: ["AFTER Inspection recorded", "invoice_total_cents computed (calc invoice_total)", "If recommend_hvac_repair: UpsellReferral created (CASCADE depth-3)", "If home has a DUE ACTIVE plan: plan acknowledged + reminder advanced (CASCADE)", "version += 1"]

  - method: POST
    path: "/work-orders/{id}/cancel"
    description: "Cancel a non-terminal WorkOrder; reverses route committed_minutes if scheduled"
    roles: [Dispatcher]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["status ->CANCELLED", "If was scheduled: RoutePlan.committed_minutes -= duration_minutes; RoutePlan.version += 1 (CASCADE reversal)", "version += 1"]

  - method: GET
    path: "/work-orders/{id}/inspections"
    description: "List Inspections for a WorkOrder (reverse-reachability for Inspection.work_order_id)"
    roles: [PlanAdmin, Dispatcher, Technician, Homeowner]
    code: 200
    input: ["phase?", "limit?", "offset?"]
    output: Inspection[]
    side_effects: []

  # --- UpsellReferral ----------------------------------------------------------
  - method: GET
    path: "/upsell-referrals"
    description: "List UpsellReferrals; filter by work_order_id, home_id, or status (reverse-reachability for UpsellReferral.work_order_id and home_id)"
    roles: [PlanAdmin, Dispatcher]
    code: 200
    input: ["work_order_id?", "home_id?", "status?", "limit?", "offset?"]
    output: UpsellReferral[]
    side_effects: []

  - method: GET
    path: "/upsell-referrals/{id}"
    description: "Get one UpsellReferral"
    roles: [PlanAdmin, Dispatcher]
    code: 200
    input: []
    output: UpsellReferral
    side_effects: []

  - method: POST
    path: "/upsell-referrals/{id}/decline"
    description: "Decline a PENDING referral"
    roles: [PlanAdmin]
    code: 200
    input: []
    output: UpsellReferral
    side_effects: ["status PENDING->DECLINED", "version += 1"]

  - method: POST
    path: "/upsell-referrals/{id}/expire"
    description: "Expire a PENDING referral past its TTL"
    roles: [PlanAdmin, Dispatcher]
    code: 200
    input: []
    output: UpsellReferral
    side_effects: ["status PENDING->EXPIRED (only if clock now >= created_at + REFERRAL_TTL_DAYS where REFERRAL_TTL_DAYS == 30; otherwise no-op leaving PENDING)", "version += 1"]

  # --- CallbackTicket ----------------------------------------------------------
  - method: POST
    path: "/callback-tickets"
    description: "File a callback ticket against a completed WorkOrder"
    roles: [Dispatcher, Homeowner]
    code: 201
    input: [work_order_id, reason, "redo_required?", "reopened_from_ticket_id?"]
    output: CallbackTicket
    side_effects: ["status=OPEN, version=1"]

  - method: GET
    path: "/callback-tickets"
    description: "List CallbackTickets; filter by work_order_id, reopened_from_ticket_id, or status (reverse-reachability for CallbackTicket.work_order_id and reopened_from_ticket_id)"
    roles: [PlanAdmin, Dispatcher]
    code: 200
    input: ["work_order_id?", "reopened_from_ticket_id?", "status?", "limit?", "offset?"]
    output: CallbackTicket[]
    side_effects: []

  - method: GET
    path: "/callback-tickets/{id}"
    description: "Get one CallbackTicket"
    roles: [PlanAdmin, Dispatcher, Homeowner]
    code: 200
    input: []
    output: CallbackTicket
    side_effects: []

  - method: POST
    path: "/callback-tickets/{id}/resolve"
    description: "Resolve an OPEN or REOPENED ticket"
    roles: [Dispatcher]
    code: 200
    input: []
    output: CallbackTicket
    side_effects: ["status ->RESOLVED", "version += 1"]

  - method: POST
    path: "/callback-tickets/{id}/reopen"
    description: "Reopen a RESOLVED ticket"
    roles: [Dispatcher]
    code: 200
    input: []
    output: CallbackTicket
    side_effects: ["status RESOLVED->REOPENED", "version += 1"]

  # --- Test-driving clock ------------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-04-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock time. Setting the clock re-evaluates due reminders (WAITING->DUE) and TTL-expired referrals (PENDING->EXPIRED)."
    roles: [PlanAdmin, Dispatcher]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advanced", "due RecurringPlans (ACTIVE) -> reminder_status DUE", "TTL-expired PENDING UpsellReferrals -> EXPIRED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT, http: 401, condition: "X-User-ID or X-User-Role header missing or X-User-Role not a known role" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Authenticated role not permitted for this operation" }
  # --- Not found ---
  - { id: ERR_HOME_NOT_FOUND, http: 404, condition: "Home id in path or body does not exist" }
  - { id: ERR_HOMEOWNER_NOT_FOUND, http: 404, condition: "Homeowner id in path or body does not exist" }
  - { id: ERR_SYSTEM_NOT_FOUND, http: 404, condition: "HvacSystem id in path or service_line.system_id does not exist" }
  - { id: ERR_WORK_ORDER_NOT_FOUND, http: 404, condition: "WorkOrder id in path or body does not exist" }
  - { id: ERR_ROUTE_NOT_FOUND, http: 404, condition: "RoutePlan id in path does not exist" }
  - { id: ERR_CREW_NOT_FOUND, http: 404, condition: "CrewMember id in path or body does not exist" }
  - { id: ERR_PLAN_NOT_FOUND, http: 404, condition: "RecurringPlan id in path does not exist" }
  - { id: ERR_REFERRAL_NOT_FOUND, http: 404, condition: "UpsellReferral id in path does not exist" }
  - { id: ERR_TICKET_NOT_FOUND, http: 404, condition: "CallbackTicket id in path or reopened_from_ticket_id does not exist" }
  - { id: ERR_PRICING_CONFIG_NOT_FOUND, http: 404, condition: "PricingConfig id in path does not exist" }
  # --- Request shape ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, bad enum, out-of-range integer, empty service_lines, or service_line system_id rule violated" }
  # --- WorkOrder state ---
  - { id: ERR_WORK_ORDER_BAD_STATE, http: 409, condition: "WorkOrder not in the state required for the requested transition" }
  - { id: ERR_WORK_ORDER_ALREADY_SCHEDULED, http: 409, condition: "Re-inspect attempted on a WorkOrder whose route_plan_id is set" }
  - { id: ERR_SYSTEM_NOT_ACTIVE, http: 409, condition: "A service_line references an HvacSystem whose status != ACTIVE" }
  - { id: ERR_NO_ACTIVE_PRICING_CONFIG, http: 409, condition: "Quote attempted with no ACTIVE PricingConfig" }
  - { id: ERR_PRICING_CONFIG_ALREADY_ACTIVE, http: 409, condition: "Activate attempted when config is not DRAFT (already ACTIVE/RETIRED)" }
  - { id: ERR_INSUFFICIENT_AFTER_PHOTOS, http: 422, condition: "Completion with after_photo_count < MIN_AFTER_PHOTOS" }
  # --- RoutePlan state & commit ---
  - { id: ERR_ROUTE_BAD_STATE, http: 409, condition: "RoutePlan not in the state required for the requested transition" }
  - { id: ERR_ROUTE_NOT_OPEN, http: 409, condition: "Commit attempted on a route not in OPEN status" }
  - { id: ERR_ROUTE_NOT_LOCKED, http: 409, condition: "Start requires the committed route to be LOCKED" }
  - { id: ERR_ROUTE_EMPTY, http: 409, condition: "Lock attempted on a route with committed_minutes == 0" }
  - { id: ERR_ROUTE_HAS_OPEN_WORK, http: 409, condition: "Close attempted while a committed WorkOrder is still SCHEDULED or IN_PROGRESS" }
  - { id: ERR_ZONE_MISMATCH, http: 422, condition: "RoutePlan.zone_code != Home.zone_code on commit" }
  - { id: ERR_CREW_NOT_UV_CERTIFIED, http: 422, condition: "Commit of a UV-addon work order onto a route whose crew is not certified_for_uv" }
  - { id: ERR_OUTSIDE_SHIFT, http: 422, condition: "Committed slot falls outside [shift_start_minute, shift_end_minute]" }
  - { id: ERR_SLOT_OVERLAP, http: 409, condition: "Committed slot (with buffer) overlaps an existing committed slot on the route" }
  - { id: ERR_CREW_DOUBLE_BOOKED, http: 409, condition: "Crew member already has a RoutePlan on the same service_date whose shift window overlaps the new route's window (closed-interval, no buffer)" }
  - { id: ERR_STALE_ROUTE_VERSION, http: 412, condition: "expected_route_plan_version != RoutePlan.version on commit" }
  # --- RecurringPlan ---
  - { id: ERR_PLAN_BAD_STATE, http: 409, condition: "RecurringPlan lifecycle not in the state required for the transition" }
  - { id: ERR_PLAN_NOT_ACTIVE, http: 409, condition: "Reminder transition on a non-ACTIVE plan" }
  - { id: ERR_REMINDER_NOT_DUE, http: 409, condition: "Acknowledge on a plan whose reminder_status != DUE, or force-DUE before next_reminder_at" }
  - { id: ERR_PLAN_ALREADY_EXISTS, http: 409, condition: "Home already has a RecurringPlan with lifecycle_status IN {ACTIVE, PAUSED}" }
  - { id: ERR_STALE_HOME_VERSION, http: 412, condition: "expected_home_version != Home.version on recurring-plan create" }
  # --- UpsellReferral ---
  - { id: ERR_REFERRAL_BAD_STATE, http: 409, condition: "UpsellReferral not PENDING for accept/decline/expire" }
  # --- CallbackTicket ---
  - { id: ERR_TICKET_BAD_STATE, http: 409, condition: "CallbackTicket not in the state required for resolve/reopen" }
  - { id: ERR_WORK_ORDER_NOT_COMPLETED, http: 409, condition: "Resolve attempted while the referenced WorkOrder is not COMPLETED" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlanAdmin
    description: "Owns pricing configs and recurring-plan lifecycle; manages upsell referrals."
    identity: "opaque"
    exclusive_operations:
      - "POST /pricing-configs — create config"
      - "POST /pricing-configs/{id}/activate — activate config"
      - "POST /homes/{id}/recurring-plans — enroll plan"
      - "POST /recurring-plans/{id}/acknowledge — acknowledge reminder"
      - "POST /recurring-plans/{id}/pause — pause plan"
      - "POST /recurring-plans/{id}/resume — resume plan"
      - "POST /recurring-plans/{id}/cancel — cancel plan"
      - "POST /upsell-referrals/{id}/decline — decline referral"
    shared_operations:
      - "POST /homeowners — register homeowner (with Dispatcher)"
      - "POST /homes — create home (with Dispatcher)"
      - "POST /homes/{id}/systems — add system (with Dispatcher)"
      - "POST /homes/{id}/systems/{systemId}/decommission — decommission (with Dispatcher)"
      - "POST /recurring-plans/{id}/refresh-reminder — refresh reminder (with Dispatcher)"
      - "POST /upsell-referrals/{id}/expire — expire referral (with Dispatcher)"
      - "POST /_clock/set_current_utc — set clock (with Dispatcher)"
      - "GET endpoints (reads)"

  - name: Dispatcher
    description: "Owns routes, crews, commits, work-order scheduling lifecycle, and callbacks."
    identity: "opaque"
    exclusive_operations:
      - "POST /crew-members — create crew"
      - "POST /route-plans — create route"
      - "POST /route-plans/{id}/commit — commit slot"
      - "POST /route-plans/{id}/lock — lock route"
      - "POST /route-plans/{id}/close — close route"
      - "POST /work-orders/{id}/cancel — cancel work order"
      - "POST /callback-tickets/{id}/resolve — resolve ticket"
      - "POST /callback-tickets/{id}/reopen — reopen ticket"
    shared_operations:
      - "POST /homeowners — register homeowner (with PlanAdmin)"
      - "POST /homes — create home (with PlanAdmin)"
      - "POST /homes/{id}/systems — add system (with PlanAdmin)"
      - "POST /homes/{id}/systems/{systemId}/decommission — decommission (with PlanAdmin)"
      - "POST /work-orders — create work order (with Technician)"
      - "POST /recurring-plans/{id}/refresh-reminder — refresh reminder (with PlanAdmin)"
      - "POST /upsell-referrals/{id}/expire — expire referral (with PlanAdmin)"
      - "POST /callback-tickets — file callback (with Homeowner)"
      - "POST /_clock/set_current_utc — set clock (with PlanAdmin)"
      - "GET endpoints (reads)"

  - name: Technician
    description: "Executes inspections, quotes, and on-site work order lifecycle."
    identity: "entity_backed:CrewMember"
    exclusive_operations:
      - "POST /work-orders/{id}/inspect — record inspection"
      - "POST /work-orders/{id}/quote — quote work order"
      - "POST /work-orders/{id}/start — start work"
      - "POST /work-orders/{id}/complete — complete work"
    shared_operations:
      - "POST /work-orders — create work order (with Dispatcher)"
      - "GET endpoints (reads)"

  - name: Homeowner
    description: "Customer; reads own homes/plans/work-orders and files callbacks."
    identity: "entity_backed:Homeowner"
    exclusive_operations: []
    shared_operations:
      - "POST /callback-tickets — file callback (with Dispatcher)"
      - "GET /homes/{id}, GET /homes/{id}/recurring-plans, GET /work-orders/{id}, GET /work-orders/{id}/inspections, GET /callback-tickets/{id} — read own resources"
