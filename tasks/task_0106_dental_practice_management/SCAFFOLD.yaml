    roles: [BillingSpecialist]
    code: 201
    input: [carrier_name, annual_maximum_cents, deductible_cents, preventive_coinsurance_pct, basic_coinsurance_pct, major_coinsurance_pct, "major_waiting_period_months?", "frequency_limit_months?"]
