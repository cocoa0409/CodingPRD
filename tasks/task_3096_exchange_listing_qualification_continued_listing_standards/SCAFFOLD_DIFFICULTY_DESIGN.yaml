  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: snapshot_trade_date_uniqueness_half_open_day
        grounds:
          - validations[priority=10]
          - entities.MarketDataSnapshot.fields.trade_date
          - errors.ERR_SNAPSHOT_DATE_MISMATCH
        distinguishing_aspect: "Interval semantics: each trading day is a half-open slot [00:00, 24:00) that admits exactly one snapshot per issuer; a second snapshot for the same trade_date collides with the occupied slot and is rejected even though its price payload differs."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Issuer APP16 registered (PRE_LISTING). One snapshot already recorded for trade_date 2026-09-01."
          setup_api_calls:
            - *dv1_clock
            - call: "POST /issuers"
              payload: { legal_name: "Overlap Day Corp", ticker_symbol: "OVDY" }
              as: ListingAnalyst
              captures: { issuer_id: $.data.id }
            - call: "POST /issuers/${issuer_id}/market-data-snapshots"
              payload: { trade_date: "2026-09-01", closing_bid_cents: 150, market_value_publicly_held_cents: 500000000, market_value_listed_securities_cents: 600000000000, round_lot_holders: 400, total_shareholders: 400 }
              as: ListingAnalyst
          trigger:
            - call: "POST /issuers/${issuer_id}/market-data-snapshots"
              payload: { trade_date: "2026-09-01", closing_bid_cents: 90, market_value_publicly_held_cents: 500000000, market_value_listed_securities_cents: 600000000000, round_lot_holders: 400, total_shareholders: 400 }
              as: ListingAnalyst
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_SNAPSHOT_DATE_MISMATCH"
            - "GET /issuers/${issuer_id}/market-data-snapshots returns exactly 1 row — the day slot was already occupied"
            - "the stored snapshot's closing_bid_cents == 150 (the occupying row was not overwritten)"

      - name: appeal_window_half_open_vs_cure_interval_gap
        grounds:
          - validations[priority=12]
          - validations[priority=13]
          - entities.Deficiency.fields.compliance_due_at
          - entities.Deficiency.fields.staff_determined_at
          - errors.ERR_CURE_PERIOD_ACTIVE
          - errors.ERR_APPEAL_WINDOW_CLOSED
        distinguishing_aspect: "Different interval semantics than the snapshot slot: the 180-day cure interval and the 7-day appeal window are contiguous half-open windows — filing an appeal on day +8 after the staff determination misses the appeal slot entirely (ERR_APPEAL_WINDOW_CLOSED), while the appeal endpoint is never reachable during the cure interval because staff-determine is itself blocked by ERR_CURE_PERIOD_ACTIVE inside it."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Issuer APP17 LISTED on CAPITAL with a BID_PRICE deficiency detected at 2026-10-01 (compliance_due_at 2027-03-30). Clock at 2027-03-30 — the last instant inside the cure window."
          setup_api_calls:
            - *dv1_clock
