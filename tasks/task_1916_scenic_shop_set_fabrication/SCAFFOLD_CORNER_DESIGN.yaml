        claim_type: side_effect_execution
        grounds:
          - state_machines.ChangeOrder.PROPOSED_to_APPROVED
        excluded_because:
          difficulty_instance: transitive_cascade / change_order_approval_cascade_releases_bays_and_recomputes_posture
          rationale: "The full 4-hop approval cascade (price/deadline/hours -> bay release -> committed hours -> posture) is asserted hop-by-hop in the named §1.8 instance."
      - name: corner_cascade_bid_acceptance
        claim_type: side_effect_execution
        grounds:
          - state_machines.Bid.SUBMITTED_to_ACCEPTED
        excluded_because:
          difficulty_instance: transitive_cascade / bid_acceptance_cascade_spawns_production_reviews_and_posture
          rationale: "Production spawn, required-scope materialization, and posture flip to SATURATED (including the ERR_SHOP_SATURATED gate on the next submit) are asserted in the named §1.8 instance."
      - name: corner_cascade_strike_reclaim
