scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: escrow_disbursable_now_vs_projected_liability_diverge
        grounds:
          - calculations.escrow_disbursable_now
          - calculations.escrow_projected_liability
          - entities.EscrowAccount.fields.available_cents
          - entities.CompensationSchedule.fields.amount_cents
        distinguishing_aspect: "On identical CompensationSchedule data, disbursable_now (gated/chronological, ACHIEVED-only, capped) yields 1000000 while projected_liability (forward-looking, all non-FAILED lines) yields 6000000 — two algorithms, one EscrowAccount subject, different numbers."
        test_recipe:
          setup:
            - "A journey exists with EscrowAccount available 6000000 (deposited 6000000, nothing disbursed/reserved)."
            - "Three CompensationSchedule lines: EMBRYO_TRANSFER/CARRIER/1000000, HEARTBEAT/CARRIER/2000000, BIRTH/CARRIER/3000000."
            - "Only the EMBRYO_TRANSFER milestone is ACHIEVED."
          setup_api_calls:
            - call: "POST /intended-parents"
              payload: { legal_name: "IP One", state_code: "CA", budget_cents: 6000000 }
              as: CaseManager
              captures: { ip_id: $.data.id }
            - call: "POST /intended-parents/${ip_id}/submit"
              payload: {}
              as: CaseManager
            - call: "POST /intended-parents/${ip_id}/start-screening"
              payload: {}
              as: Screener
            - call: "POST /intended-parents/${ip_id}/set-psych"
              payload: { psych_clearance: "PASSED" }
              as: Screener
            - call: "POST /intended-parents/${ip_id}/clear"
              payload: {}
              as: Screener
            - call: "POST /carriers"
              payload: { legal_name: "Carrier One", state_code: "TX", prior_deliveries: 3, base_compensation_cents: 4000000 }
              as: CaseManager
              captures: { car_id: $.data.id }
            - call: "POST /carriers/${car_id}/submit"
              payload: {}
              as: CaseManager
            - call: "POST /carriers/${car_id}/start-screening"
              payload: {}
              as: Screener
            - call: "POST /carriers/${car_id}/set-psych"
              payload: { psych_clearance: "PASSED" }
              as: Screener
            - call: "POST /insurance-reviews"
              payload: { carrier_id: "${car_id}", policy_kind: "SURROGACY_FRIENDLY" }
              as: Screener
              captures: { ins_id: $.data.id }
            - call: "POST /insurance-reviews/${ins_id}/approve"
              payload: {}
              as: Screener
            - call: "POST /carriers/${car_id}/clear"
              payload: {}
              as: Screener
            - call: "POST /matches"
              payload: { intended_parent_id: "${ip_id}", carrier_id: "${car_id}", proposed_carrier_comp_cents: 4000000 }
              as: CaseManager
              captures: { match_id: $.data.id, match_v: $.data.version }
            - call: "POST /matches/${match_id}/accept"
              payload: { expected_match_version: "${match_v}" }
              as: CaseManager
              captures: { match_v2: $.data.version }
            - call: "POST /matches/${match_id}/psych-clear"
              payload: {}
              as: Screener
            - call: "POST /contracts"
              payload: { match_id: "${match_id}" }
              as: CaseManager
              captures: { con_id: $.data.id }
            - call: "POST /contracts/${con_id}/ip-sign"
              payload: {}
              as: IntendedParentActor
              as_user_id: "${ip_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: CaseManager
            - call: "POST /contracts/${con_id}/carrier-sign"
              payload: {}
              as: CarrierActor
              as_user_id: "${car_id}"
            - call: "POST /journeys"
              payload: { match_id: "${match_id}" }
              as: CaseManager
              captures: { jr_id: $.data.id }
            - call: "GET /escrow-accounts?journey_id=${jr_id}"
              payload: {}
              as: FinanceOfficer
              captures: { esc_id: "$.data[0].id", esc_v: "$.data[0].version" }
            - call: "POST /escrow-accounts/${esc_id}/deposit"
              payload: { amount_cents: 6000000, expected_escrow_version: "${esc_v}" }
              as: IntendedParentActor
              as_user_id: "${ip_id}"
            - call: "POST /journeys/${jr_id}/comp-schedule"
              payload: { trigger_milestone_type: "EMBRYO_TRANSFER", recipient: "CARRIER", amount_cents: 1000000 }
              as: CaseManager
            - call: "POST /journeys/${jr_id}/comp-schedule"
              payload: { trigger_milestone_type: "HEARTBEAT", recipient: "CARRIER", amount_cents: 2000000 }
              as: CaseManager
            - call: "POST /journeys/${jr_id}/comp-schedule"
              payload: { trigger_milestone_type: "BIRTH", recipient: "CARRIER", amount_cents: 3000000 }
              as: CaseManager
            - call: "POST /journeys/${jr_id}/milestones"
              payload: { milestone_type: "EMBRYO_TRANSFER", scheduled_utc: "2026-05-15T00:00:00Z" }
              as: CaseManager
              captures: { ms_et_id: $.data.id }
            - call: "POST /journeys/${jr_id}/milestones/${ms_et_id}/achieve"
              payload: {}
              as: CaseManager
          trigger:
            - call: "GET /escrow-accounts/${esc_id}/summary"
              payload: {}
              as: FinanceOfficer
          assert:
            - "response.data.available_cents == 6000000"
            - "response.data.disbursable_now_cents == 1000000"
            - "response.data.projected_liability_cents == 6000000"
            - "response.data.disbursable_now_cents != response.data.projected_liability_cents"

      - name: carrier_total_comp_vs_insurance_gap_premium_distinct_domains
        grounds:
          - calculations.carrier_total_compensation
          - calculations.insurance_gap_premium
          - entities.GestationalCarrier.fields.prior_deliveries
          - entities.InsuranceReview.fields.gap_premium_cents
        distinguishing_aspect: "carrier_total_compensation is tiered comp accounting on Match/Carrier (total 4200000) while insurance_gap_premium is nested-rounding premium accounting on InsuranceReview (540000) — two different entity domains carry the dual-variant logic."
        test_recipe:
          setup:
            - "A carrier exists with base_compensation_cents 4000033, prior_deliveries 3, screening in progress."
            - "An InsuranceReview with policy_kind EXCLUSION exists for that carrier, still PENDING."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { legal_name: "Carrier Gap", state_code: "TX", prior_deliveries: 3, base_compensation_cents: 4000033 }
              as: CaseManager
              captures: { car_id: $.data.id }
            - call: "POST /carriers/${car_id}/submit"
              payload: {}
              as: CaseManager
            - call: "POST /carriers/${car_id}/start-screening"
              payload: {}
              as: Screener
            - call: "POST /insurance-reviews"
              payload: { carrier_id: "${car_id}", policy_kind: "EXCLUSION" }
              as: Screener
              captures: { ins_id: $.data.id }
          trigger:
            - call: "POST /insurance-reviews/${ins_id}/identify-gap"
              payload: {}
              as: Screener
          assert:
            - "InsuranceReview.${ins_id}.status == GAP_IDENTIFIED"
            - "InsuranceReview.${ins_id}.gap_premium_cents == 540000"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: carrier_total_compensation_tiered_conditional_mode_a
        grounds:
          - calculations.carrier_total_compensation
          - entities.Match.fields.proposed_carrier_comp_cents
          - entities.GestationalCarrier.fields.prior_deliveries
        distinguishing_aspect: "Mode (a): >=3 inputs with tiered multiplier on prior_deliveries plus conditional multiples add-on; base 4000000 + tier1 bonus 200000 + 0 add-on = 4200000, non-linear because tier selection branches on prior_deliveries."
        test_recipe:
          setup:
            - "A match exists in PROPOSED with proposed_carrier_comp_cents 4000000 whose carrier has prior_deliveries 3, no journey/heartbeat yet."
          setup_api_calls:
            - call: "POST /intended-parents"
              payload: { legal_name: "IP Comp", state_code: "CA", budget_cents: 6000000 }
              as: CaseManager
              captures: { ip_id: $.data.id }
            - call: "POST /carriers"
              payload: { legal_name: "Carrier Comp", state_code: "TX", prior_deliveries: 3, base_compensation_cents: 4000000 }
              as: CaseManager
              captures: { car_id: $.data.id }
            - call: "POST /matches"
              payload: { intended_parent_id: "${ip_id}", carrier_id: "${car_id}", proposed_carrier_comp_cents: 4000000 }
              as: CaseManager
              captures: { match_id: $.data.id }
          trigger:
            - call: "GET /matches/${match_id}/comp-breakdown"
              payload: {}
              as: CaseManager
          assert:
            - "response.data.base_cents == 4000000"
            - "response.data.experience_bonus_cents == 200000"
            - "response.data.multiples_addon_cents == 0"
            - "response.data.total_cents == 4200000"

      - name: insurance_gap_premium_nested_rounding_mode_b
        grounds:
          - calculations.insurance_gap_premium
          - entities.GestationalCarrier.fields.base_compensation_cents
          - entities.InsuranceReview.fields.gap_premium_cents
        distinguishing_aspect: "Mode (b): nested rounding where per-month round-then-multiply (60000*9=540000) diverges from sum-then-round (round(4000033*0.015*9)=540004); scaffold pins round-per-month-first, so the observed value is 540000."
        test_recipe:
          setup:
            - "A carrier with base_compensation_cents 4000033 in SCREENING has a PENDING InsuranceReview of policy_kind EXCLUSION."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { legal_name: "Carrier Round", state_code: "TX", prior_deliveries: 2, base_compensation_cents: 4000033 }
              as: CaseManager
              captures: { car_id: $.data.id }
            - call: "POST /carriers/${car_id}/submit"
              payload: {}
              as: CaseManager
            - call: "POST /carriers/${car_id}/start-screening"
              payload: {}
              as: Screener
            - call: "POST /insurance-reviews"
              payload: { carrier_id: "${car_id}", policy_kind: "EXCLUSION" }
              as: Screener
              captures: { ins_id: $.data.id }
          trigger:
            - call: "POST /insurance-reviews/${ins_id}/identify-gap"
              payload: {}
              as: Screener
          assert:
            - "InsuranceReview.${ins_id}.gap_premium_cents == 540000"
            - "InsuranceReview.${ins_id}.gap_premium_cents != 540004"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: match_negotiation_cycle_proposed_countered_proposed
        grounds:
          - state_machines.Match.PROPOSED_to_COUNTERED
          - state_machines.Match.COUNTERED_to_PROPOSED
          - entities.Match.fields.offer_round
        distinguishing_aspect: "Match cycles PROPOSED->COUNTERED->PROPOSED with offer_round incrementing to 1 on the re-propose hop — a genuine cycle on the Match entity, not a linear pipeline."
        test_recipe:
          setup:
            - "A match exists in PROPOSED, offer_round 0, version known."
          setup_api_calls:
            - call: "POST /intended-parents"
              payload: { legal_name: "IP Cyc", state_code: "CA", budget_cents: 6000000 }
              as: CaseManager
              captures: { ip_id: $.data.id }
            - call: "POST /carriers"
              payload: { legal_name: "Carrier Cyc", state_code: "TX", prior_deliveries: 2, base_compensation_cents: 4000000 }
              as: CaseManager
              captures: { car_id: $.data.id }
            - call: "POST /matches"
              payload: { intended_parent_id: "${ip_id}", carrier_id: "${car_id}", proposed_carrier_comp_cents: 4000000 }
              as: CaseManager
              captures: { match_id: $.data.id, mv0: $.data.version }
            - call: "POST /matches/${match_id}/counter"
              payload: { proposed_carrier_comp_cents: 4500000, expected_match_version: "${mv0}" }
              as: CaseManager
              captures: { mv1: $.data.version }
          trigger:
            - call: "POST /matches/${match_id}/re-propose"
              payload: { proposed_carrier_comp_cents: 4300000, expected_match_version: "${mv1}" }
              as: CaseManager
          assert:
            - "Match.${match_id}.status == PROPOSED"
            - "Match.${match_id}.offer_round == 1"
            - "Match.${match_id}.proposed_carrier_comp_cents == 4300000"

      - name: disbursement_branch_reject_from_approved_returns_reservation
        grounds:
          - state_machines.Disbursement.REQUESTED_to_APPROVED
          - state_machines.Disbursement.APPROVED_to_REJECTED
          - state_machines.Disbursement.REQUESTED_to_REJECTED
        distinguishing_aspect: "Disbursement branches REQUESTED->{APPROVED,REJECTED} then APPROVED->REJECTED with divergent side-effects (APPROVED reserves; APPROVED->REJECTED returns the reservation while REQUESTED->REJECTED does not) — branching fork with per-branch side-effects on the Disbursement entity."
        test_recipe:
          setup:
            - "A journey with escrow available 6000000, an EMBRYO_TRANSFER schedule line 1000000, EMBRYO_TRANSFER ACHIEVED, and a Disbursement APPROVED (reserved 1000000)."
          setup_api_calls:
            - call: "POST /intended-parents"
              payload: { legal_name: "IP Dis", state_code: "CA", budget_cents: 6000000 }
              as: CaseManager
              captures: { ip_id: $.data.id }
            - call: "POST /intended-parents/${ip_id}/submit"
              payload: {}
              as: CaseManager
            - call: "POST /intended-parents/${ip_id}/start-screening"
              payload: {}
              as: Screener
            - call: "POST /intended-parents/${ip_id}/set-psych"
              payload: { psych_clearance: "PASSED" }
              as: Screener
            - call: "POST /intended-parents/${ip_id}/clear"
              payload: {}
              as: Screener
            - call: "POST /carriers"
              payload: { legal_name: "Carrier Dis", state_code: "TX", prior_deliveries: 2, base_compensation_cents: 4000000 }
              as: CaseManager
              captures: { car_id: $.data.id }
            - call: "POST /carriers/${car_id}/submit"
              payload: {}
              as: CaseManager
            - call: "POST /carriers/${car_id}/start-screening"
              payload: {}
              as: Screener
            - call: "POST /carriers/${car_id}/set-psych"
              payload: { psych_clearance: "PASSED" }
              as: Screener
            - call: "POST /insurance-reviews"
              payload: { carrier_id: "${car_id}", policy_kind: "SURROGACY_FRIENDLY" }
              as: Screener
              captures: { ins_id: $.data.id }
            - call: "POST /insurance-reviews/${ins_id}/approve"
              payload: {}
              as: Screener
            - call: "POST /carriers/${car_id}/clear"
              payload: {}
              as: Screener
            - call: "POST /matches"
              payload: { intended_parent_id: "${ip_id}", carrier_id: "${car_id}", proposed_carrier_comp_cents: 4000000 }
              as: CaseManager
              captures: { match_id: $.data.id, mv: $.data.version }
            - call: "POST /matches/${match_id}/accept"
              payload: { expected_match_version: "${mv}" }
              as: CaseManager
            - call: "POST /matches/${match_id}/psych-clear"
              payload: {}
              as: Screener
            - call: "POST /contracts"
              payload: { match_id: "${match_id}" }
              as: CaseManager
              captures: { con_id: $.data.id }
            - call: "POST /contracts/${con_id}/ip-sign"
              payload: {}
              as: IntendedParentActor
              as_user_id: "${ip_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: CaseManager
            - call: "POST /contracts/${con_id}/carrier-sign"
              payload: {}
              as: CarrierActor
              as_user_id: "${car_id}"
            - call: "POST /journeys"
              payload: { match_id: "${match_id}" }
              as: CaseManager
              captures: { jr_id: $.data.id }
            - call: "GET /escrow-accounts?journey_id=${jr_id}"
              payload: {}
              as: FinanceOfficer
              captures: { esc_id: "$.data[0].id", esc_v: "$.data[0].version" }
            - call: "POST /escrow-accounts/${esc_id}/deposit"
              payload: { amount_cents: 6000000, expected_escrow_version: "${esc_v}" }
              as: IntendedParentActor
              as_user_id: "${ip_id}"
            - call: "POST /journeys/${jr_id}/comp-schedule"
              payload: { trigger_milestone_type: "EMBRYO_TRANSFER", recipient: "CARRIER", amount_cents: 1000000 }
              as: CaseManager
              captures: { sch_id: $.data.id }
            - call: "POST /journeys/${jr_id}/milestones"
              payload: { milestone_type: "EMBRYO_TRANSFER", scheduled_utc: "2026-05-15T00:00:00Z" }
              as: CaseManager
              captures: { ms_id: $.data.id }
            - call: "POST /journeys/${jr_id}/milestones/${ms_id}/achieve"
              payload: {}
              as: CaseManager
            - call: "POST /journeys/${jr_id}/disbursements"
              payload: { schedule_id: "${sch_id}", escrow_account_id: "${esc_id}" }
              as: CaseManager
              captures: { dis_id: $.data.id }
            - call: "POST /journeys/${jr_id}/disbursements/${dis_id}/approve"
              payload: {}
              as: CaseManager
              as_user_id: "cm-approver-1"
          trigger:
            - call: "POST /journeys/${jr_id}/disbursements/${dis_id}/reject"
              payload: {}
              as: CaseManager
          assert:
            - "Disbursement.${dis_id}.status == REJECTED"
            - "EscrowAccount.${esc_id}.reserved_cents == 0"
            - "EscrowAccount.${esc_id}.available_cents == 6000000"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: match_void_cascades_contract_void_then_escrow_freeze_depth3
        grounds:
          - state_machines.Match.PROPOSED_to_VOID
          - state_machines.Contract.DRAFTED_to_VOID
          - state_machines.EscrowAccount.OPEN_to_FROZEN
        distinguishing_aspect: "Depth-3 chain: void Match -> that void transitions Contract to VOID -> the Contract void transitions the journey's EscrowAccount to FROZEN; each hop is caused by the prior hop, not directly by the match-void."
        test_recipe:
          setup:
            - "A journey exists (match PSYCH_CLEARED) with an EXECUTED contract and an OPEN EscrowAccount."
          setup_api_calls:
            - call: "POST /intended-parents"
              payload: { legal_name: "IP Cas", state_code: "CA", budget_cents: 6000000 }
              as: CaseManager
              captures: { ip_id: $.data.id }
            - call: "POST /intended-parents/${ip_id}/submit"
              payload: {}
              as: CaseManager
            - call: "POST /intended-parents/${ip_id}/start-screening"
              payload: {}
              as: Screener
            - call: "POST /intended-parents/${ip_id}/set-psych"
              payload: { psych_clearance: "PASSED" }
              as: Screener
            - call: "POST /intended-parents/${ip_id}/clear"
              payload: {}
              as: Screener
            - call: "POST /carriers"
              payload: { legal_name: "Carrier Cas", state_code: "TX", prior_deliveries: 2, base_compensation_cents: 4000000 }
              as: CaseManager
              captures: { car_id: $.data.id }
            - call: "POST /carriers/${car_id}/submit"
              payload: {}
              as: CaseManager
            - call: "POST /carriers/${car_id}/start-screening"
              payload: {}
              as: Screener
            - call: "POST /carriers/${car_id}/set-psych"
              payload: { psych_clearance: "PASSED" }
              as: Screener
            - call: "POST /insurance-reviews"
              payload: { carrier_id: "${car_id}", policy_kind: "SURROGACY_FRIENDLY" }
              as: Screener
              captures: { ins_id: $.data.id }
            - call: "POST /insurance-reviews/${ins_id}/approve"
              payload: {}
              as: Screener
            - call: "POST /carriers/${car_id}/clear"
              payload: {}
              as: Screener
            - call: "POST /matches"
              payload: { intended_parent_id: "${ip_id}", carrier_id: "${car_id}", proposed_carrier_comp_cents: 4000000 }
              as: CaseManager
              captures: { match_id: $.data.id, mv: $.data.version }
            - call: "POST /matches/${match_id}/accept"
              payload: { expected_match_version: "${mv}" }
              as: CaseManager
            - call: "POST /matches/${match_id}/psych-clear"
              payload: {}
              as: Screener
            - call: "POST /contracts"
              payload: { match_id: "${match_id}" }
              as: CaseManager
              captures: { con_id: $.data.id }
            - call: "POST /contracts/${con_id}/ip-sign"
              payload: {}
              as: IntendedParentActor
              as_user_id: "${ip_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: CaseManager
            - call: "POST /contracts/${con_id}/carrier-sign"
              payload: {}
              as: CarrierActor
              as_user_id: "${car_id}"
            - call: "POST /journeys"
              payload: { match_id: "${match_id}" }
              as: CaseManager
              captures: { jr_id: $.data.id }
            - call: "GET /escrow-accounts?journey_id=${jr_id}"
              payload: {}
              as: FinanceOfficer
              captures: { esc_id: "$.data[0].id" }
          trigger:
            - call: "POST /matches/${match_id}/void"
              payload: {}
              as: CaseManager
          assert:
            - "Match.${match_id}.status == VOID"
            - "Contract.${con_id}.status == VOID"
            - "EscrowAccount.${esc_id}.status == FROZEN"

      - name: journey_terminate_freezes_escrow_depth2
        grounds:
          - state_machines.Journey.ACTIVE_to_TERMINATED
          - state_machines.EscrowAccount.OPEN_to_FROZEN
        distinguishing_aspect: "Depth-2 chain from a DIFFERENT trigger (journey terminate, not match void): terminate Journey -> that termination transitions the linked OPEN EscrowAccount to FROZEN."
        test_recipe:
          setup:
            - "An ACTIVE journey exists with an OPEN EscrowAccount."
          setup_api_calls:
            - call: "POST /intended-parents"
              payload: { legal_name: "IP Term", state_code: "CA", budget_cents: 6000000 }
              as: CaseManager
              captures: { ip_id: $.data.id }
            - call: "POST /intended-parents/${ip_id}/submit"
              payload: {}
              as: CaseManager
            - call: "POST /intended-parents/${ip_id}/start-screening"
              payload: {}
              as: Screener
            - call: "POST /intended-parents/${ip_id}/set-psych"
              payload: { psych_clearance: "PASSED" }
              as: Screener
            - call: "POST /intended-parents/${ip_id}/clear"
              payload: {}
              as: Screener
            - call: "POST /carriers"
              payload: { legal_name: "Carrier Term", state_code: "TX", prior_deliveries: 2, base_compensation_cents: 4000000 }
              as: CaseManager
              captures: { car_id: $.data.id }
            - call: "POST /carriers/${car_id}/submit"
              payload: {}
              as: CaseManager
            - call: "POST /carriers/${car_id}/start-screening"
              payload: {}
              as: Screener
            - call: "POST /carriers/${car_id}/set-psych"
              payload: { psych_clearance: "PASSED" }
              as: Screener
            - call: "POST /insurance-reviews"
              payload: { carrier_id: "${car_id}", policy_kind: "SURROGACY_FRIENDLY" }
              as: Screener
              captures: { ins_id: $.data.id }
            - call: "POST /insurance-reviews/${ins_id}/approve"
              payload: {}
              as: Screener
            - call: "POST /carriers/${car_id}/clear"
              payload: {}
              as: Screener
            - call: "POST /matches"
              payload: { intended_parent_id: "${ip_id}", carrier_id: "${car_id}", proposed_carrier_comp_cents: 4000000 }
              as: CaseManager
              captures: { match_id: $.data.id, mv: $.data.version }
            - call: "POST /matches/${match_id}/accept"
