  - method: POST
    path: "/otb/category-plans/{id}/submit"
    description: "submit a DRAFT or REFORECAST_OPEN plan for director review; records the submitter's X-User-ID"
    roles: [MerchandisePlanner]
    code: 200
    input: ["submission_note?"]
