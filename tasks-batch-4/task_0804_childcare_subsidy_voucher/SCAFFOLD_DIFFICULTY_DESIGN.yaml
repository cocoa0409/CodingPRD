              as: CaseWorker
            - call: "POST /ccdf/providers"
              payload: { name: "Sunny Center", provider_type: "CENTER", published_daily_rate_cents: 6000, license_expiry_date: "2027-01-01T00:00:00Z", state_code: "CA" }
              as: ProgramAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /ccdf/providers/${prov_id}/license"
              payload: { action: "VERIFY" }
              as: ProgramAdmin
            - call: "GET /ccdf/families/${fam_id}"
              payload: {}
              as: CaseWorker
              captures: { fam_v: $.data.version }
            - call: "POST /ccdf/authorizations"
              payload: { family_id: "${fam_id}", provider_id: "${prov_id}", determination_id: "${det_id}", child_name: "Kid One", care_level: "TODDLER", start_date: "2026-03-01T00:00:00Z", end_date: "2026-09-01T00:00:00Z", authorized_days_per_month: 22, expected_family_version: "${fam_v}" }
              as: CaseWorker
              captures: { auth_id: $.data.id }
            - call: "POST /ccdf/authorizations/${auth_id}/activate"
              payload: {}
              as: CaseWorker
            - call: "POST /ccdf/attendance-records"
              payload: { authorization_id: "${auth_id}", service_month: "2026-03", present_days: 18, absent_days: 3 }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { att_id: $.data.id }
          trigger:
            - call: "POST /ccdf/attendance-records/${att_id}/approve"
              payload: {}
              as: CaseWorker
            - call: "GET /ccdf/payments?attendance_record_id=${att_id}"
              payload: {}
              as: CaseWorker
              captures: { pay_id: "$.data[0].id" }
          assert:
            - "Payment.${pay_id}.copay_deducted_cents == 11928"
            - "Payment.${pay_id}.net_provider_payment_cents == 93072"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: authorization_suspend_reinstate_cycle
        grounds:
          - state_machines.Authorization.ACTIVE_to_SUSPENDED
          - state_machines.Authorization.SUSPENDED_to_ACTIVE
        distinguishing_aspect: |
          Authorization cycles ACTIVE->SUSPENDED->ACTIVE via suspend then reinstate, returning to ACTIVE
          (non-linear cycle on the Authorization entity).
        test_recipe:
          setup:
            - "ACTIVE Authorization on a LICENSED provider"
          setup_api_calls:
            - call: "POST /ccdf/income-standards"
              payload: { household_size: 3, entry_monthly_limit_cents: 400000, exit_monthly_limit_cents: 500000, state_code: "CA" }
              as: ProgramAdmin
            - call: "POST /ccdf/rate-ceilings"
              payload: { provider_type: "CENTER", care_level: "TODDLER", max_daily_rate_cents: 5000, effective_start: "2020-01-01T00:00:00Z", effective_end: "2030-01-01T00:00:00Z", state_code: "CA" }
              as: ProgramAdmin
            - call: "POST /ccdf/families"
              payload: { applicant_name: "A Fam", household_size: 3, monthly_gross_income_cents: 250000, monthly_self_employment_income_cents: 100000, state_code: "CA" }
              as: CaseWorker
              captures: { fam_id: $.data.id }
            - call: "POST /ccdf/parent-activities"
              payload: { family_id: "${fam_id}", activity_type: "WORK", weekly_hours: 40 }
              as: CaseWorker
            - call: "POST /ccdf/determinations"
              payload: { family_id: "${fam_id}", determination_type: "INITIAL" }
              as: CaseWorker
              captures: { det_id: $.data.id }
            - call: "POST /ccdf/determinations/${det_id}/finalize"
              payload: {}
              as: CaseWorker
            - call: "POST /ccdf/providers"
              payload: { name: "Sunny Center", provider_type: "CENTER", published_daily_rate_cents: 6000, license_expiry_date: "2027-01-01T00:00:00Z", state_code: "CA" }
              as: ProgramAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /ccdf/providers/${prov_id}/license"
              payload: { action: "VERIFY" }
              as: ProgramAdmin
            - call: "GET /ccdf/families/${fam_id}"
              payload: {}
              as: CaseWorker
              captures: { fam_v: $.data.version }
            - call: "POST /ccdf/authorizations"
              payload: { family_id: "${fam_id}", provider_id: "${prov_id}", determination_id: "${det_id}", child_name: "Kid One", care_level: "TODDLER", start_date: "2026-03-01T00:00:00Z", end_date: "2026-09-01T00:00:00Z", authorized_days_per_month: 22, expected_family_version: "${fam_v}" }
              as: CaseWorker
              captures: { auth_id: $.data.id }
            - call: "POST /ccdf/authorizations/${auth_id}/activate"
              payload: {}
              as: CaseWorker
            - call: "POST /ccdf/authorizations/${auth_id}/suspend"
              payload: {}
              as: CaseWorker
          trigger:
            - call: "POST /ccdf/authorizations/${auth_id}/reinstate"
              payload: {}
              as: CaseWorker
          assert:
            - "Authorization.${auth_id}.status == ACTIVE"

      - name: attendance_reject_resubmit_cycle
        grounds:
          - state_machines.AttendanceRecord.SUBMITTED_to_REJECTED
          - state_machines.AttendanceRecord.REJECTED_to_SUBMITTED
        distinguishing_aspect: |
          AttendanceRecord cycles SUBMITTED->REJECTED->SUBMITTED via reject then resubmit, returning to
          SUBMITTED (non-linear cycle on a different entity than Authorization).
        test_recipe:
          setup:
            - "ACTIVE Authorization; a SUBMITTED AttendanceRecord"
          setup_api_calls:
            - call: "POST /ccdf/income-standards"
              payload: { household_size: 3, entry_monthly_limit_cents: 400000, exit_monthly_limit_cents: 500000, state_code: "CA" }
              as: ProgramAdmin
            - call: "POST /ccdf/rate-ceilings"
              payload: { provider_type: "CENTER", care_level: "TODDLER", max_daily_rate_cents: 5000, effective_start: "2020-01-01T00:00:00Z", effective_end: "2030-01-01T00:00:00Z", state_code: "CA" }
              as: ProgramAdmin
            - call: "POST /ccdf/families"
              payload: { applicant_name: "A Fam", household_size: 3, monthly_gross_income_cents: 250000, monthly_self_employment_income_cents: 100000, state_code: "CA" }
              as: CaseWorker
              captures: { fam_id: $.data.id }
            - call: "POST /ccdf/parent-activities"
              payload: { family_id: "${fam_id}", activity_type: "WORK", weekly_hours: 40 }
              as: CaseWorker
            - call: "POST /ccdf/determinations"
              payload: { family_id: "${fam_id}", determination_type: "INITIAL" }
              as: CaseWorker
              captures: { det_id: $.data.id }
            - call: "POST /ccdf/determinations/${det_id}/finalize"
              payload: {}
              as: CaseWorker
            - call: "POST /ccdf/providers"
              payload: { name: "Sunny Center", provider_type: "CENTER", published_daily_rate_cents: 6000, license_expiry_date: "2027-01-01T00:00:00Z", state_code: "CA" }
              as: ProgramAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /ccdf/providers/${prov_id}/license"
              payload: { action: "VERIFY" }
              as: ProgramAdmin
            - call: "GET /ccdf/families/${fam_id}"
              payload: {}
              as: CaseWorker
              captures: { fam_v: $.data.version }
            - call: "POST /ccdf/authorizations"
              payload: { family_id: "${fam_id}", provider_id: "${prov_id}", determination_id: "${det_id}", child_name: "Kid One", care_level: "TODDLER", start_date: "2026-03-01T00:00:00Z", end_date: "2026-09-01T00:00:00Z", authorized_days_per_month: 22, expected_family_version: "${fam_v}" }
              as: CaseWorker
              captures: { auth_id: $.data.id }
            - call: "POST /ccdf/authorizations/${auth_id}/activate"
              payload: {}
              as: CaseWorker
            - call: "POST /ccdf/attendance-records"
              payload: { authorization_id: "${auth_id}", service_month: "2026-03", present_days: 18, absent_days: 3 }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { att_id: $.data.id }
            - call: "POST /ccdf/attendance-records/${att_id}/reject"
              payload: { reason: "documents missing" }
              as: CaseWorker
          trigger:
            - call: "POST /ccdf/attendance-records/${att_id}/resubmit"
              payload: { present_days: 19, absent_days: 2 }
              as: Provider
              as_user_id: "${prov_id}"
          assert:
            - "AttendanceRecord.${att_id}.status == SUBMITTED"
            - "AttendanceRecord.${att_id}.present_days == 19"

  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: license_revoke_cascade_provider_authorization_attendance
        grounds:
          - state_machines.Provider.LICENSED_to_REVOKED
          - state_machines.Authorization.ACTIVE_to_SUSPENDED
          - state_machines.AttendanceRecord.SUBMITTED_to_REJECTED
        distinguishing_aspect: |
          Depth-3 chain from provider REVOKE: Provider->REVOKED causes ACTIVE Authorization->SUSPENDED, and
          that suspension itself causes the authorization's SUBMITTED AttendanceRecord->REJECTED. Each hop is
          caused by the previous hop, not by the revoke directly.
        test_recipe:
          setup:
            - "ACTIVE Authorization on a LICENSED provider with a SUBMITTED (not yet approved) AttendanceRecord"
          setup_api_calls:
            - call: "POST /ccdf/income-standards"
