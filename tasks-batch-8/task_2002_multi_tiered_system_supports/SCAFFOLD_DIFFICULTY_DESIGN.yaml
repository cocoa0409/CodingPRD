            - "StudentPlan.status == 'EXIT_MOVED' (cascade because plan.tier_at_start='TIER_2' mismatches new current_tier='TIER_3')"
            - "Interventionist.committed_minutes_per_week == 0 (decremented by weekly_minute_cost=90)"
            - "Cascade originates from ratify endpoint, not a probe write — distinguishes from probe_non_responsive_cascades_to_sped_referral"

  # ---------------------------------------------------------------------------
  # Rule 5: priority_pair_validation_conflict — different error-category pairs
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_temporal_on_score_creation
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_WINDOW_NOT_OPEN]
        distinguishing_aspect: |
          Pair (state, business_temporal): a score POSTed against a window that is both
          (a) not OPEN (status==CLOSED) and (b) outside its [opens_on, closes_on] date range
          violates two rules; the higher-priority state category wins and ERR_INVALID_STATE
          must be returned, NOT ERR_WINDOW_NOT_OPEN.
        test_recipe:
          setup:
            - "Window W already CLOSED (closed early via /close) and current clock is past closes_on"
            - "Student S enrolled; benchmark cut point defined"
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "D", academic_year: "2025-2026" }
              as: PlatformAdmin
              captures: { d_id: $.data.id }
            - call: "POST /districts/${d_id}/schools"
              payload: { name: "S", grade_span_low: 3, grade_span_high: 5 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /districts/${d_id}/schools/${s_id}/benchmark-cut-points"
              payload: { window_kind: "FALL", grade_level: 3, subject: "READING", tier2_max_score: 100, tier3_max_score: 70 }
              as: DistrictCoordinator
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows"
              payload: { window_kind: "FALL", opens_on: "2026-08-01", closes_on: "2026-08-31" }
              as: DistrictCoordinator
              captures: { w_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows/${w_id}/close"
              payload: {}
              as: DistrictCoordinator
            # Advance clock past closes_on so the request violates both the state rule
            # (window.status==CLOSED) and the temporal rule (clock outside window range).
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /districts/${d_id}/schools/${s_id}/students"
              payload: { full_name: "S", grade_level: 3 }
              as: SchoolRegistrar
              captures: { st_id: $.data.id }
          trigger:
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows/${w_id}/scores"
              payload: { student_id: "${st_id}", subject: "READING", raw_score: 50 }
              as: Teacher
              captures: { err: $.data.error_id }
          assert:
            - "Response is an error envelope"
            - "error_id == 'ERR_INVALID_STATE' (state priority 5 wins over business_temporal priority 6)"
            - "NOT ERR_WINDOW_NOT_OPEN — the temporal check is lower priority and must be masked"

      - name: business_constraint_vs_business_fiscal_on_plan_create
        grounds:
          - validations[priority=8]
          - validations[priority=11]
          - errors[ERR_CATALOG_MISMATCH]
          - errors[ERR_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Pair (business_constraint, business_fiscal): plan POST violates both
          (a) catalog mismatch (catalog tier_target=TIER_3 but student.current_tier=TIER_2)
          AND (b) interventionist capacity would be exceeded. Higher-priority
          business_constraint wins → ERR_CATALOG_MISMATCH, not ERR_CAPACITY_EXCEEDED.
        test_recipe:
          setup:
            - "Student W at TIER_2 (ratified)"
            - "Catalog entry E has tier_target=TIER_3 (mismatched) AND session_minutes*sessions_per_week=300"
            - "Interventionist I has weekly_minute_capacity=200 (so any plan would exceed capacity)"
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "D", academic_year: "2025-2026" }
              as: PlatformAdmin
              captures: { d_id: $.data.id }
            - call: "POST /districts/${d_id}/schools"
              payload: { name: "S", grade_span_low: 3, grade_span_high: 5 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /districts/${d_id}/schools/${s_id}/benchmark-cut-points"
              payload: { window_kind: "FALL", grade_level: 3, subject: "READING", tier2_max_score: 100, tier3_max_score: 70 }
              as: DistrictCoordinator
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows"
              payload: { window_kind: "FALL", opens_on: "2026-08-01", closes_on: "2026-08-31" }
              as: DistrictCoordinator
              captures: { w_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /districts/${d_id}/schools/${s_id}/students"
              payload: { full_name: "W", grade_level: 3 }
              as: SchoolRegistrar
              captures: { st_id: $.data.id }
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows/${w_id}/scores"
              payload: { student_id: "${st_id}", subject: "READING", raw_score: 80 }
              as: Teacher
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows/${w_id}/close"
              payload: {}
              as: DistrictCoordinator
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows/${w_id}/score"
              payload: {}
              as: DistrictCoordinator
            - call: "POST /districts/${d_id}/schools/${s_id}/team-meetings"
              payload: { scheduled_on: "2026-08-06" }
              as: TeamLead
              captures: { m_id: $.data.id }
            - call: "POST /districts/${d_id}/schools/${s_id}/team-meetings/${m_id}/convene"
              payload: {}
              as: TeamLead
            - call: "GET /districts/${d_id}/schools/${s_id}/students/${st_id}/tier-movements"
              payload: {}
              as: TeamLead
              captures: { mv_id: "$.data[0].id" }
            - call: "GET /districts/${d_id}/schools/${s_id}/students/${st_id}"
              payload: {}
              as: TeamLead
              captures: { st_v: $.data.version }
            - call: "POST /districts/${d_id}/schools/${s_id}/team-meetings/${m_id}/ratify"
              payload: { movement_id: "${mv_id}", expected_student_version: "${st_v}" }
              as: TeamLead
            - call: "POST /districts/${d_id}/intervention-catalog"
              payload: { title: "T3Only", subject: "READING", tier_target: "TIER_3", grade_min: 3, grade_max: 5, session_minutes: 60, sessions_per_week: 5, probe_frequency: "WEEKLY" }
              as: DistrictCoordinator
              captures: { ce_id: $.data.id }
            - call: "POST /districts/${d_id}/schools/${s_id}/interventionists"
              payload: { full_name: "I", weekly_minute_capacity: 200, subjects: ["READING"] }
              as: SchoolRegistrar
              captures: { i_id: $.data.id }
            - call: "GET /districts/${d_id}/schools/${s_id}/students/${st_id}"
              payload: {}
              as: TeamLead
              captures: { st_v2: $.data.version }
          trigger:
            - call: "POST /districts/${d_id}/schools/${s_id}/students/${st_id}/plans"
              payload: { catalog_entry_id: "${ce_id}", interventionist_id: "${i_id}", expected_student_version: "${st_v2}" }
              as: TeamLead
              captures: { err: $.data.error_id }
          assert:
            - "error_id == 'ERR_CATALOG_MISMATCH' (business_constraint priority 8 wins over business_fiscal priority 11)"
            - "Catalog mismatch: catalog.tier_target=TIER_3 vs student.current_tier=TIER_2 (so the request also violates priority 8)"
            - "Capacity would also be exceeded (weekly cost 300 > capacity 200) — but that error is masked"

