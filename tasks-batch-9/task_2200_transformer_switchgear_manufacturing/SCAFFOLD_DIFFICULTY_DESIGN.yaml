              as: ContractAdmin
              captures: { wc2_id: $.data.id }
            - call: "POST /warranty-claims/${wc2_id}/issue-rma"
              payload: { rma_number: "RMA-0202" }
              as: ContractAdmin
            - call: "POST /warranty-claims/${wc2_id}/receive-unit"
