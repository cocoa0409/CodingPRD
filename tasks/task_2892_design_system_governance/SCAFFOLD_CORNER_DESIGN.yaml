            - call: "POST /design-system/components"
              payload: { name: "Badge", slug: "badge", owning_team_id: "${team_id}" }
              as: DesignSystemLead
              captures: { consumer: $.data.id }
            - call: "POST /design-system/components/${consumer}/platform-implementations"
              payload: { platform: "WEB", package_name: "@ds/badge-web", package_version: "1.0.0", token_compliance_ratio: 0.93 }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { impl_id: $.data.id }
            - call: "POST /design-system/platform-implementations/${impl_id}/accessibility-audits"
              payload: { method: "AUTOMATED", wcag_level: "AA", violations_critical: 0, violations_serious: 0, violations_moderate: 0, evidence_url: "https://ds.example.com/a11y/clean" }
              as: ContributingTeam
              as_user_id: "${team_id}"
            - call: "POST /design-system/components/${consumer}/dependencies"
              payload: { provider_component_id: "${provider}", pinned_provider_major: 2 }
              as: DesignSystemLead
              captures: { dep_id: $.data.id, dep_state: $.data.compatibility_state }
            - call: "GET /design-system/components/${consumer}"
              payload: {}
              as: DesignSystemLead
              captures: { blocked_before: $.data.blocked_dependency_count }
          trigger:
            - call: "POST /design-system/platform-implementations/${impl_id}/ship"
              payload: { package_version: "1.0.0", token_compliance_ratio: 0.93 }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { err: $.data.error_id }
            - call: "GET /design-system/platform-implementations/${impl_id}"
              payload: {}
              as: DesignSystemLead
              captures: { status_mid: $.data.status, blocked_reason_mid: $.data.blocked_reason }
            - call: "PUT /design-system/component-dependencies/${dep_id}"
              payload: { pinned_provider_major: 1 }
              as: DesignSystemLead
              captures: { dep_state_2: $.data.compatibility_state }
            - call: "POST /design-system/platform-implementations/${impl_id}/ship"
              payload: { package_version: "1.0.0", token_compliance_ratio: 0.93 }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { status_after: $.data.status, shipped_at: $.data.shipped_at }
            - call: "GET /design-system/components/${consumer}"
              payload: {}
              as: DesignSystemLead
              captures: { blocked_after: $.data.blocked_dependency_count, coverage_after: $.data.coverage_state }
          assert:
            - "${dep_state} == INCOMPATIBLE and ${blocked_before} == 1"
            - "${err} == ERR_BLOCKED_DEPENDENCY"
            - "HTTP status == 409"
            - "${status_mid} == PLANNED and ${blocked_reason_mid} == NONE (a refused ship is not a block)"
            - "${dep_state_2} == COMPATIBLE"
            - "${status_after} == SHIPPED and ${shipped_at} == 2026-08-01T00:00:00.000Z"
            - "${blocked_after} == 0 and ${coverage_after} == WEB_ONLY"

