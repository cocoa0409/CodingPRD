        distinguishing_aspect: "Conditional feature-flag gating via entitlements: detail=FULL on sleep-nights is 403 ERR_ENTITLEMENT_REQUIRED for a FREE customer, succeeds after PlatformAdmin upgrades the tier to PLUS (entitlements recomputed), and detail=BASIC works for both."
