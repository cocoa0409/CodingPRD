          - errors[ERR_ONSITE_CAPACITY_CONFLICT]
          - endpoints[POST /coaching-allocations/{coaching_allocation_id}/sessions]
        distinguishing_aspect: "A second SCHEDULED coaching session starting exactly when the first ends (12:00:00Z) is rejected 409 ERR_ONSITE_CAPACITY_CONFLICT because coaching intervals are CLOSED, even though the combined 5.0 hours sits well under weekly_onsite_cap_hours 12 and remaining_hours 7.0 - the touching rule fires, not the aggregate rule."
