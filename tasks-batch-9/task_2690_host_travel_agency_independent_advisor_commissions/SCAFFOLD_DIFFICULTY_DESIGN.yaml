              as: HostController
              as_user_id: "ctrl-1"
              captures: { err_over: $.data.error_id }
            - call: "POST /host-agency/clients/${cli_id}/trust-ledger-entries"
              payload: { direction: "REFUND", amount_cents: 300000, memo: "Full refund to client", expected_client_version: "${cli_v_after_comp}" }
              as: HostController
              as_user_id: "ctrl-1"
              captures: { tle_ref_id: $.data.id, bal_final: $.data.balance_after_cents }
          assert:
            - "FORWARD: the confirm appended a DISBURSEMENT of 100000 and left Client.${cli_id}.trust_balance_cents == 200000"
            - "CANCEL APPENDS NOTHING: bal_after_cancel == 200000"
            - "COMPENSATION: TrustLedgerEntry.${tle_dep2_id}.direction == DEPOSIT, amount_cents == 100000, balance_after_cents == 300000"
            - "OVER-REFUND REJECTED: HTTP 402 with error_id == ERR_TRUST_FUNDS_INSUFFICIENT"
            - "OVER-REFUND APPENDED NOTHING: Client.${cli_id}.trust_balance_cents is still 300000 and the ledger still has 3 rows"
            - "DRAINED: TrustLedgerEntry.${tle_ref_id}.balance_after_cents == 0 and Client.${cli_id}.trust_balance_cents == 0"
            - "CONSERVATION: GET /host-agency/clients/${cli_id}/trust-ledger-entries returns 4 rows whose balance_after_cents sequence is exactly [300000, 200000, 300000, 0]"
            - "CONSERVATION: (+300000) + (-100000) + (+100000) + (-300000) == 0 == Client.${cli_id}.trust_balance_cents"
            - "IMMUTABILITY: TrustLedgerEntry.${tle_dep1_id} still reports balance_after_cents == 300000 — earlier lines are never rewritten"
            - "SCOPED: GET /host-agency/bookings/${bk_id}/trust-ledger-entries returns exactly 2 rows summing to 0"

      - name: recognized_advisor_share_conserved_across_chargeback_reversal
        grounds:
          - calculations.advisor_recognized_share_invariant
          - calculations.cancellation_chargeback
          - calculations.host_platform_fee
          - entities.Advisor.fields.lifetime_settled_share_cents
          - entities.Advisor.fields.lifetime_chargeback_cents
          - entities.Booking.fields.chargeback_recognized_at
        distinguishing_aspect: |
          A different conserved quantity: advisor_recognized_share_cents
          (lifetime_settled_share_cents - lifetime_chargeback_cents) must always equal the sum
          of (advisor_share_cents - chargeback_cents) over the advisor's POSTED-or-PAID
          statements. The forward action credits 112000 through a posted settlement; the
          compensating action charges back exactly those 112000 cents — reversing what was paid,
          not what today's tier would produce — and a subsequent empty run proves the
          compensation is recognized once and only once (chargeback_recognized_at prevents a
          second debit), so the identity holds with zero drift.
        test_recipe:
          setup:
            - "One ACTIVE advisor in NY with no consortium, so marketing_fund_cents is always 0 and the arithmetic is unobscured."
            - "Meridian Air STANDARD, base 0.10, cap 9000000, probation_chargeback_threshold left at its default 2 so a single chargeback cannot demote it."
            - "Booking B1: gross 1600000 -> expected 160000, CONFIRMED, remitted in full on 2026-06-10."
            - "Settlement run 2026-06 calculated by ctrl-1 and posted by ctrl-2."
            - "Booking B2: gross 3000000 -> expected 300000, CONFIRMED, remitted in full on 2026-07-10."
          setup_api_calls:
            - call: "POST /host-agency/split-schedules"
              payload: { name: "Standard 2026", tiers: [{ tier_level: 1, min_production_cents: 0, advisor_pct: 0.70 }, { tier_level: 2, min_production_cents: 5000000, advisor_pct: 0.80 }, { tier_level: 3, min_production_cents: 15000000, advisor_pct: 0.90 }], platform_fee_tiers: [{ min_share_cents: 0, fee_pct: 0.05 }, { min_share_cents: 1000000, fee_pct: 0.03 }], chargeback_retention_pct: 0.10 }
              as: HostOperations
