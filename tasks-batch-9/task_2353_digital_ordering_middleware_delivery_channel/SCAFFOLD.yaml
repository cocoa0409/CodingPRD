# =============================================================================
# PRD Benchmark Scaffold — task_2353
# Digital Ordering Middleware & Delivery Channel Integration (Olo)
#
# Difficulty target: ABOVE Expert (14 entities / 58 endpoints / 47 errors).
# =============================================================================

scenario: |
  Digital Ordering Middleware & Delivery Channel Integration (Olo): menu
  single-source publishing with per-channel item suppression, channel-specific
  price markup and fee configuration, order injection into the point-of-sale
  with failure fallback to tablet, store-hours, capacity throttling and
  quote-time calculation, delivery dispatch across marketplace and courier
  networks with handoff SLAs, refund and adjustment routing back to the
  originating channel, item 86-ing propagation across channels in near real
  time, order reconciliation and channel remittance settlement.

domain_name: "digital-ordering-middleware"
api_prefix: ""

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetypes: [pricing_engine, settlement_ledger]
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy
    - derived_field_reconciliation
    - rate_threshold_triggers
    - pagination_with_filtering
  entity_topology: flat
  state_machine_shape: parallel        # plus cyclic and branching dimensions
  relationship_patterns: [one_to_many, many_to_many, cross_aggregate]
  role_model: segregation_of_duties    # peer entity-backed roles + SoD on reversal
  consistency_model: immediate
  logical_clock:
    endpoint: "POST /_clock/set_current_utc"
    default_current_utc: "2026-08-01T00:00:00Z"
    note: |
      All time-dependent behaviour (store hours, capacity buckets, quote times,
      handoff SLAs, courier occupancy, remittance periods) reads the logical
      clock, never the wall clock. Tests advance the clock explicitly.

# =============================================================================
# Table 1: Entity-Relationship Table  (§1.1)
# =============================================================================
entities:

  # ---------------------------------------------------------------- Store ----
  - name: Store
    parent: null
    common_fields: true
    fields:
      - name: brand_code
        type: string
        source: input
        required: true
        description: "Brand this store belongs to; menu versions are published per brand_code"
      - name: name
        type: string
        source: input
        required: true
        description: "Human-readable store name"
      - name: timezone_offset_minutes
        type: integer
        source: input
        required: true
        description: "Fixed offset from UTC in minutes used to derive local minute-of-day and day_of_week"
        constraints: "-720..840"
      - name: base_prep_minutes
        type: integer
        source: input
        required: true
        description: "Unloaded kitchen preparation time in minutes"
        constraints: "1..60"
      - name: prep_capacity_per_bucket
        type: integer
        source: input
        required: true
        description: "Maximum number of open orders admitted per 15-minute capacity bucket"
        constraints: ">= 1"
      - name: pos_retry_limit
        type: integer
        source: input
        required: true
        description: "Maximum number of POS injection attempts before tablet fallback is evaluated"
        constraints: "1..5"
      - name: tablet_backlog_threshold
        type: integer
        source: input
        required: true
        description: "Number of tablet-fallback orders tolerated before further POS failures become terminal FAILED"
        constraints: ">= 1"
      - name: active_menu_version_id
        type: string
        source: computed
        required: false
        description: "FK -> MenuVersion.id; the MenuVersion currently published to this store, null until first publish"
        default: null
      - name: throttle_state
        type: enum
        source: computed
        required: false
        description: "Capacity posture of the store: NORMAL | THROTTLED | PAUSED"
        default: "PAUSED"
        constraints: "NORMAL | THROTTLED | PAUSED"
      - name: open_order_count
        type: integer
        source: computed
        required: false
        description: "Count of Orders at this store whose fulfillment_status is PREPARING or READY (not HANDED_OFF, DELIVERED or CANCELLED)"
        default: 0
      - name: reserved_prep_slots
        type: integer
        source: computed
        required: false
        description: "Capacity slots currently held by orders whose injection_status is PENDING, ACCEPTED or TABLET_FALLBACK; released on ready, cancel or injection hold"
        default: 0
      - name: tablet_backlog_count
        type: integer
        source: computed
        required: false
        description: "Count of Orders at this store with injection_status = TABLET_FALLBACK"
        default: 0
      - name: last_published_at
        type: datetime
        source: computed
        required: false
        description: "Logical-clock timestamp of the most recent successful publish-menu"
        default: null

  # ------------------------------------------------------- StoreHourWindow ---
  - name: StoreHourWindow
    parent: Store
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
        required: false
        description: "Server-generated identifier"
      - name: created_at
        type: datetime
        source: system
        required: false
        description: "Logical-clock creation timestamp"
      - name: store_id
        type: string
        source: input
        required: true
        description: "FK -> Store.id"
      - name: day_of_week
        type: integer
        source: input
        required: true
        description: "Local day of week, 0 = Monday through 6 = Sunday"
        constraints: "0..6"
      - name: opens_at_minute
        type: integer
        source: input
        required: true
        description: "Local opening time as minutes from local midnight, inclusive"
        constraints: "0..1439"
      - name: closes_at_minute
        type: integer
        source: input
        required: true
        description: "Local closing time as minutes from local midnight, exclusive; must be strictly greater than opens_at_minute"
        constraints: "1..1440"
      - name: window_minutes
        type: integer
        source: computed
        required: false
        description: "closes_at_minute - opens_at_minute"

  # -------------------------------------------------------------- Channel ---
  - name: Channel
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        required: true
        description: "Unique channel code, e.g. MARKETMAX"
        constraints: "unique across Channel"
      - name: name
        type: string
        source: input
        required: true
        description: "Human-readable channel name"
      - name: channel_type
        type: enum
        source: input
        required: true
        description: "MARKETPLACE (third-party storefront) | DIRECT (brand-owned app or web) | AGGREGATOR"
        constraints: "MARKETPLACE | DIRECT | AGGREGATOR"
      - name: markup_bps
        type: integer
        source: input
        required: true
        description: "Channel price markup in basis points applied to MenuItem.base_price_cents"
        constraints: "0..5000"
      - name: rounding_mode
        type: enum
        source: input
        required: true
        description: "CENT (round half up to the cent) | NICKEL (round half up to the cent, then ceil to the next 5-cent step)"
        constraints: "CENT | NICKEL"
      - name: service_fee_cents
        type: integer
        source: input
        required: true
        description: "Flat per-order service fee collected by the channel"
        constraints: ">= 0"
      - name: commission_bps
        type: integer
        source: input
        required: true
        description: "Channel commission in basis points, charged on (subtotal + service fee)"
        constraints: "0..5000"
      - name: settlement_mode
        type: enum
        source: input
        required: true
        description: "GROSS_MODE (channel remits gross, brand is invoiced for commission separately) | NET_MODE (channel withholds commission before remitting)"
        constraints: "GROSS_MODE | NET_MODE"
      - name: eighty_six_policy
        type: enum
        source: input
        required: true
        description: "HONOR_86 (86 events propagate to this channel's listings) | IGNORE_86 (listings stay available)"
        constraints: "HONOR_86 | IGNORE_86"
      - name: throttle_policy
        type: enum
        source: input
        required: true
        description: "SUPPRESS_ON_THROTTLE (listings become THROTTLE_SUPPRESSED while the store is THROTTLED or PAUSED) | IGNORE_THROTTLE"
        constraints: "SUPPRESS_ON_THROTTLE | IGNORE_THROTTLE"
      - name: adjustment_review_mode
        type: enum
        source: input
        required: true
        description: "CHANNEL_REVIEW (submitted adjustments wait for the channel partner) | AUTO_ACCEPT (submit accepts immediately)"
        constraints: "CHANNEL_REVIEW | AUTO_ACCEPT"
      - name: accepts_delivery
        type: boolean
        source: input
        required: false
        description: "Whether DELIVERY orders may be placed on this channel"
        default: true
      - name: listing_count
        type: integer
        source: computed
        required: false
        description: "Number of ChannelListing rows currently published to this channel"
        default: 0

  # ---------------------------------------------------------- MenuVersion ---
  - name: MenuVersion
    parent: null
    common_fields: true
    fields:
      - name: brand_code
        type: string
        source: input
        required: true
        description: "Brand whose stores may publish this version"
      - name: version_label
        type: string
        source: input
        required: true
        description: "Label such as 2026-Q3-CORE; unique per brand_code"
        constraints: "unique per brand_code"
      - name: state
        type: enum
        source: computed
        required: false
        description: "DRAFT | PUBLISHED | EXHAUSTED | SUPERSEDED"
        default: "DRAFT"
        constraints: "DRAFT | PUBLISHED | EXHAUSTED | SUPERSEDED"
      - name: item_count
        type: integer
        source: computed
        required: false
        description: "Number of MenuItem children"
        default: 0
      - name: published_store_count
        type: integer
        source: computed
        required: false
        description: "Number of Stores whose active_menu_version_id is this version"
        default: 0
      - name: published_at
        type: datetime
        source: computed
        required: false
        description: "Logical-clock timestamp at which the version was finalized to PUBLISHED"
        default: null
      - name: superseded_at
        type: datetime
        source: computed
        required: false
        description: "Logical-clock timestamp at which the version left PUBLISHED for the last time"
        default: null

  # ------------------------------------------------------------- MenuItem ---
  - name: MenuItem
    parent: MenuVersion
    common_fields: true
    fields:
      - name: menu_version_id
        type: string
        source: input
        required: true
        description: "FK -> MenuVersion.id"
      - name: sku
        type: string
        source: input
        required: true
        description: "Stock keeping unit, unique within the MenuVersion"
        constraints: "unique per menu_version_id"
      - name: name
        type: string
        source: input
        required: true
        description: "Item display name"
      - name: base_price_cents
        type: integer
        source: input
        required: true
        description: "Single-source base price in cents before any channel markup"
        constraints: "> 0"
      - name: tax_bps
        type: integer
        source: input
        required: true
        description: "Item tax rate in basis points applied per order line"
        constraints: "0..2000"
      - name: is_delivery_eligible
        type: boolean
        source: input
        required: false
        description: "Whether the item may appear in DELIVERY orders"
        default: true

  # -------------------------------------------------------- ChannelListing ---
  - name: ChannelListing
    parent: null
    common_fields: true
    fields:
      - name: store_id
        type: string
        source: computed
        required: false
        description: "FK -> Store.id; set when publish-menu materializes the listing"
      - name: channel_id
        type: string
        source: computed
        required: false
        description: "FK -> Channel.id; set when publish-menu materializes the listing"
      - name: menu_item_id
        type: string
        source: computed
        required: false
        description: "FK -> MenuItem.id; set when publish-menu materializes the listing"
      - name: sku
        type: string
        source: computed
        required: false
        description: "Snapshot of MenuItem.sku at publish time"
      - name: base_price_cents
        type: integer
        source: computed
        required: false
        description: "Snapshot of MenuItem.base_price_cents at publish time"
      - name: price_cents
        type: integer
        source: computed
        required: false
        description: "Channel-specific price from the channel_listing_price calculation"
      - name: suppressed
        type: boolean
        source: input
        required: false
        description: "Channel-partner suppression flag; hides the item on this channel only"
        default: false
      - name: eighty_sixed
        type: boolean
        source: computed
        required: false
        description: "True while the most recent honored AvailabilityEvent for (store_id, menu_item_id) was an EIGHTY_SIX"
        default: false
      - name: availability_state
        type: enum
        source: computed
        required: false
        description: "Derived from the listing_availability_state precedence rule: SUPPRESSED | EIGHTY_SIXED | THROTTLE_SUPPRESSED | AVAILABLE"
        default: "AVAILABLE"
        constraints: "SUPPRESSED | EIGHTY_SIXED | THROTTLE_SUPPRESSED | AVAILABLE"

  # ------------------------------------------------------ AvailabilityEvent --
  - name: AvailabilityEvent
    parent: null
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
        required: false
        description: "Server-generated identifier"
      - name: created_at
        type: datetime
        source: system
        required: false
        description: "Logical-clock creation timestamp"
      - name: store_id
        type: string
        source: input
        required: true
        description: "FK -> Store.id"
      - name: menu_item_id
        type: string
        source: input
        required: true
        description: "FK -> MenuItem.id"
      - name: actor_channel_id
        type: string
        source: input
        required: false
        description: "FK -> Channel.id; the channel that reported the 86, null when reported by the store operator"
        default: null
      - name: event_type
        type: enum
        source: input
        required: true
        description: "EIGHTY_SIX (item out of stock) | RESTORE (item back in stock)"
        constraints: "EIGHTY_SIX | RESTORE"
      - name: effective_at
        type: datetime
        source: computed
        required: false
        description: "Logical clock at the moment the event was recorded"
      - name: propagated_listing_count
        type: integer
        source: computed
        required: false
        description: "Number of ChannelListing rows whose eighty_sixed flag changed as a result of this event"
      - name: skipped_listing_count
        type: integer
        source: computed
        required: false
        description: "Number of ChannelListing rows left untouched because their Channel.eighty_six_policy is IGNORE_86"
      - name: held_order_count
        type: integer
        source: computed
        required: false
        description: "Number of Orders moved to INJECTION_HELD by the 86 cascade"

  # ---------------------------------------------------------------- Order ----
  - name: Order
    parent: null
    common_fields: true
    fields:
      - name: store_id
        type: string
        source: input
        required: true
        description: "FK -> Store.id"
      - name: channel_id
        type: string
        source: input
        required: true
        description: "FK -> Channel.id; the originating channel for refunds and remittance"
      - name: menu_version_id
        type: string
        source: computed
        required: false
        description: "FK -> MenuVersion.id; snapshot of Store.active_menu_version_id at order creation"
      - name: remittance_statement_id
        type: string
        source: computed
        required: false
        description: "FK -> RemittanceStatement.id; null until the order is assigned to a statement"
        default: null
      - name: external_ref
        type: string
        source: input
        required: true
        description: "Channel-side order reference, unique per channel_id"
        constraints: "unique per channel_id"
      - name: fulfillment_mode
        type: enum
        source: input
        required: true
        description: "PICKUP | DELIVERY"
        constraints: "PICKUP | DELIVERY"
      - name: tip_cents
        type: integer
        source: input
        required: false
        description: "Tip collected by the channel and passed through to the brand"
        default: 0
        constraints: ">= 0"
      - name: subtotal_cents
        type: integer
        source: computed
        required: false
        description: "Sum of OrderLine.line_subtotal_cents"
      - name: markup_cents
        type: integer
        source: computed
        required: false
        description: "subtotal_cents minus the sum of base_price_cents * quantity across lines"
      - name: tax_cents
        type: integer
        source: computed
        required: false
        description: "Sum of per-line rounded taxes; never recomputed from subtotal_cents"
      - name: service_fee_cents
        type: integer
        source: computed
        required: false
        description: "Snapshot of Channel.service_fee_cents at order creation"
      - name: commission_cents
        type: integer
        source: computed
        required: false
        description: "Channel commission on this order, reduced by accepted refund commission relief"
      - name: channel_collected_cents
        type: integer
        source: computed
        required: false
        description: "subtotal_cents + tax_cents + service_fee_cents + tip_cents; the amount the channel charged the guest"
      - name: brand_net_cents
        type: integer
        source: computed
        required: false
        description: "Amount owed to the brand for this order; maintained by the compensating money identity"
      - name: refunded_total_cents
        type: integer
        source: computed
        required: false
        description: "Sum of amount_cents over Adjustments in state ACCEPTED"
        default: 0
      - name: bucket_index
        type: integer
        source: computed
        required: false
        description: "15-minute capacity bucket the order was admitted into, from capacity_bucket_load"
      - name: promised_ready_at
        type: datetime
        source: computed
        required: false
        description: "CONFIRMED-variant quote time pinned at order creation; never recomputed afterwards"
      - name: injection_status
        type: enum
        source: computed
        required: false
        description: "PENDING | INJECTION_HELD | ACCEPTED | TABLET_FALLBACK | FAILED"
        default: "PENDING"
        constraints: "PENDING | INJECTION_HELD | ACCEPTED | TABLET_FALLBACK | FAILED"
      - name: injection_attempt_count
        type: integer
        source: computed
        required: false
        description: "Number of PosInjectionAttempt children"
        default: 0
      - name: fulfillment_status
        type: enum
        source: computed
        required: false
        description: "PREPARING | READY | HANDED_OFF | DELIVERED | CANCELLED"
        default: "PREPARING"
        constraints: "PREPARING | READY | HANDED_OFF | DELIVERED | CANCELLED"
      - name: settlement_status
        type: enum
        source: computed
        required: false
        description: "SETTLEABLE | STATEMENT_ASSIGNED | SETTLED"
        default: "SETTLEABLE"
        constraints: "SETTLEABLE | STATEMENT_ASSIGNED | SETTLED"

  # ------------------------------------------------------------ OrderLine ----
  - name: OrderLine
    parent: Order
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
        required: false
        description: "Server-generated identifier"
      - name: created_at
        type: datetime
        source: system
        required: false
        description: "Logical-clock creation timestamp"
      - name: order_id
        type: string
        source: computed
        required: false
        description: "FK -> Order.id"
      - name: sku
        type: string
        source: input
        required: true
        description: "SKU resolved against the store's published ChannelListing set for the order's channel"
      - name: quantity
        type: integer
        source: input
        required: true
        description: "Units ordered"
        constraints: "1..50"
      - name: base_price_cents
        type: integer
        source: computed
        required: false
        description: "Snapshot of ChannelListing.base_price_cents"
      - name: unit_price_cents
        type: integer
        source: computed
        required: false
        description: "Snapshot of ChannelListing.price_cents at order creation"
      - name: tax_bps
        type: integer
        source: computed
        required: false
        description: "Snapshot of MenuItem.tax_bps at order creation"
      - name: line_subtotal_cents
        type: integer
        source: computed
        required: false
        description: "unit_price_cents * quantity"
      - name: line_tax_cents
        type: integer
        source: computed
        required: false
        description: "round_half_up(line_subtotal_cents * tax_bps / 10000), rounded per line"

  # --------------------------------------------------- PosInjectionAttempt ---
  - name: PosInjectionAttempt
    parent: Order
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
        required: false
        description: "Server-generated identifier"
      - name: created_at
        type: datetime
        source: system
        required: false
        description: "Logical-clock creation timestamp"
      - name: order_id
        type: string
        source: computed
        required: false
        description: "FK -> Order.id"
      - name: attempt_number
        type: integer
        source: computed
        required: false
        description: "1-based sequence number within the order"
      - name: pos_result_code
        type: string
        source: input
        required: true
        description: "Result reported by the point-of-sale adapter: OK, TIMEOUT, PRINTER_DOWN or MENU_MISMATCH"
        constraints: "OK | TIMEOUT | PRINTER_DOWN | MENU_MISMATCH"
      - name: outcome
        type: enum
        source: computed
        required: false
        description: "ACCEPTED when pos_result_code is OK, otherwise REJECTED"
        constraints: "ACCEPTED | REJECTED"
      - name: attempted_at
        type: datetime
        source: computed
        required: false
        description: "Logical clock at the moment of the attempt"

  # -------------------------------------------------------- CourierNetwork ---
  - name: CourierNetwork
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        required: true
        description: "Unique network code, e.g. N_FAST"
        constraints: "unique across CourierNetwork"
      - name: name
        type: string
        source: input
        required: true
        description: "Human-readable network name"
      - name: network_type
        type: enum
        source: input
        required: true
        description: "MARKETPLACE (only eligible for orders whose Channel.channel_type is MARKETPLACE) | COURIER (eligible for any channel)"
        constraints: "MARKETPLACE | COURIER"
      - name: priority_rank
        type: integer
        source: input
        required: true
        description: "Selector rank; lower ranks are preferred"
        constraints: "1..99"
      - name: per_delivery_fee_cents
        type: integer
        source: input
        required: true
        description: "Fee charged per accepted delivery"
        constraints: ">= 0"
      - name: handoff_sla_seconds
        type: integer
        source: input
        required: true
        description: "Seconds after acceptance within which the courier must take handoff"
        constraints: "60..7200"
      - name: dispatch_buffer_seconds
        type: integer
        source: input
        required: true
        description: "Extra seconds after the handoff deadline during which the assignment still occupies network capacity"
        constraints: "0..3600"
      - name: max_concurrent_assignments
        type: integer
        source: input
        required: true
        description: "Maximum number of assignments whose occupancy interval may contain the same instant"
        constraints: "1..20"
      - name: is_active
        type: boolean
        source: input
        required: false
        description: "Inactive networks are excluded from selection"
        default: true
      - name: open_assignment_count
        type: integer
        source: computed
        required: false
        description: "Number of DeliveryAssignments on this network in state OFFERED or ACCEPTED whose occupancy interval contains the current logical clock"
        default: 0
      - name: penalty_accrued_cents
        type: integer
        source: computed
        required: false
        description: "Running sum of handoff_penalty_cents across this network's assignments"
        default: 0

  # ----------------------------------------------------- DeliveryAssignment --
  - name: DeliveryAssignment
    parent: null
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: computed
        required: false
        description: "FK -> Order.id"
      - name: courier_network_id
        type: string
        source: computed
        required: false
        description: "FK -> CourierNetwork.id; chosen by the courier_network_selection policy"
      - name: state
        type: enum
        source: computed
        required: false
        description: "OFFERED | ACCEPTED | DECLINED | HANDED_OFF | DELIVERED | WITHDRAWN"
        default: "OFFERED"
        constraints: "OFFERED | ACCEPTED | DECLINED | HANDED_OFF | DELIVERED | WITHDRAWN"
      - name: offered_at
        type: datetime
        source: computed
        required: false
        description: "Logical clock at dispatch"
      - name: accepted_at
        type: datetime
        source: computed
        required: false
        description: "Logical clock at acceptance, null while OFFERED"
        default: null
      - name: handoff_deadline_at
        type: datetime
        source: computed
        required: false
        description: "accepted_at + CourierNetwork.handoff_sla_seconds"
        default: null
      - name: occupancy_until
        type: datetime
        source: computed
        required: false
        description: "For OFFERED: offered_at + handoff_sla_seconds + dispatch_buffer_seconds; for ACCEPTED: accepted_at + handoff_sla_seconds + dispatch_buffer_seconds"
      - name: handoff_at
        type: datetime
        source: computed
        required: false
        description: "Logical clock at handoff"
        default: null
      - name: delivered_at
        type: datetime
        source: computed
        required: false
        description: "Logical clock at delivery"
        default: null
      - name: handoff_lateness_seconds
        type: integer
        source: computed
        required: false
        description: "max(0, handoff_at - handoff_deadline_at) in seconds"
        default: null
      - name: handoff_penalty_cents
        type: integer
        source: computed
        required: false
        description: "Tiered penalty from handoff_sla_penalty"
        default: 0
      - name: sla_breached
        type: boolean
        source: computed
        required: false
        description: "True when handoff_lateness_seconds is strictly greater than HANDOFF_GRACE_SECONDS"
        default: false
      - name: delivery_fee_cents
        type: integer
        source: computed
        required: false
        description: "Snapshot of CourierNetwork.per_delivery_fee_cents at acceptance"
        default: 0

  # ----------------------------------------------------------- Adjustment ----
  - name: Adjustment
    parent: null
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        required: true
        description: "FK -> Order.id"
      - name: channel_id
        type: string
        source: computed
        required: false
        description: "FK -> Channel.id; copied from the order so the adjustment routes back to the originating channel"
      - name: remittance_statement_id
        type: string
        source: computed
        required: false
        description: "FK -> RemittanceStatement.id; null until assigned to a statement"
        default: null
      - name: adjustment_type
        type: enum
        source: input
        required: true
        description: "REFUND (returns money to the guest) | FEE_CREDIT (credits a channel fee back to the brand)"
        constraints: "REFUND | FEE_CREDIT"
      - name: amount_cents
        type: integer
        source: input
        required: true
        description: "Adjustment amount in cents"
        constraints: "> 0"
      - name: reason_code
        type: string
        source: input
        required: true
        description: "Reason code such as MISSING_ITEM or LATE_DELIVERY"
      - name: state
        type: enum
        source: computed
        required: false
        description: "DRAFT | CHANNEL_REVIEW | REVISION_REQUESTED | ACCEPTED | REVERSED"
        default: "DRAFT"
        constraints: "DRAFT | CHANNEL_REVIEW | REVISION_REQUESTED | ACCEPTED | REVERSED"
      - name: revision_round
        type: integer
        source: computed
        required: false
        description: "Number of completed revision cycles; capped by MAX_REVISION_ROUNDS"
        default: 0
      - name: commission_relief_cents
        type: integer
        source: computed
        required: false
        description: "round_half_up(amount_cents * Channel.commission_bps / 10000) for REFUND; 0 for FEE_CREDIT"
        default: 0
      - name: proposed_by_user_id
        type: string
        source: computed
        required: false
        description: "X-User-ID of the SettlementAnalyst that created the adjustment"
      - name: accepted_at
        type: datetime
        source: computed
        required: false
        description: "Logical clock at acceptance"
        default: null
      - name: reversed_at
        type: datetime
        source: computed
        required: false
        description: "Logical clock at reversal"
        default: null

  # ---------------------------------------------------- RemittanceStatement --
  - name: RemittanceStatement
    parent: null
    common_fields: true
    fields:
      - name: channel_id
        type: string
        source: input
        required: true
        description: "FK -> Channel.id"
      - name: period_start
        type: datetime
        source: input
        required: true
        description: "Inclusive start of the settlement period"
      - name: period_end
        type: datetime
        source: input
        required: true
        description: "Exclusive end of the settlement period; must be strictly after period_start and not in the future"
      - name: state
        type: enum
        source: computed
        required: false
        description: "OPEN | RECONCILED | DISPUTED | SETTLED"
        default: "OPEN"
        constraints: "OPEN | RECONCILED | DISPUTED | SETTLED"
      - name: order_count
        type: integer
        source: computed
        required: false
        description: "Number of Orders assigned to this statement"
        default: 0
      - name: gross_sales_cents
        type: integer
        source: computed
        required: false
        description: "Sum over assigned orders of (subtotal_cents + service_fee_cents)"
        default: 0
      - name: adjustment_total_cents
        type: integer
        source: computed
        required: false
        description: "Sum of amount_cents over ACCEPTED Adjustments assigned to this statement"
        default: 0
      - name: tier_base_cents
        type: integer
        source: computed
        required: false
        description: "gross_sales_cents - adjustment_total_cents; the volume figure that selects the tier"
        default: 0
      - name: tier
        type: enum
        source: computed
        required: false
        description: "TIER_1 | TIER_2 | TIER_3, selected from tier_base_cents"
        default: "TIER_1"
        constraints: "TIER_1 | TIER_2 | TIER_3"
      - name: commission_cents
        type: integer
        source: computed
        required: false
        description: "Tier-discounted commission on tier_base_cents"
        default: 0
      - name: rebate_cents
        type: integer
        source: computed
        required: false
        description: "Tier volume rebate on tier_base_cents"
        default: 0
      - name: net_payable_cents
        type: integer
        source: computed
        required: false
        description: "Amount payable to the brand; depends on Channel.settlement_mode"
        default: 0
      - name: open_adjustment_count
        type: integer
        source: computed
        required: false
        description: "Number of Adjustments on assigned orders whose state is DRAFT, CHANNEL_REVIEW or REVISION_REQUESTED"
        default: 0
      - name: reconciled_by_user_id
        type: string
        source: computed
        required: false
        description: "X-User-ID of the SettlementAnalyst that reconciled the statement"
        default: null
      - name: settled_at
        type: datetime
        source: computed
        required: false
        description: "Logical clock at settlement"
        default: null

# =============================================================================
# Table 2: State Machine Table  (§1.2)
#
# Order carries THREE independent state dimensions (injection_status,
# fulfillment_status, settlement_status) — the `parallel` shape.
# Store.throttle_state, MenuVersion.state, Adjustment.state and
# RemittanceStatement.state are cyclic. DeliveryAssignment.state branches.
# =============================================================================
state_machines:

  - entity: Store
    field: throttle_state
    initial_state: PAUSED
    terminal_states: []
    transitions:
      - from: PAUSED
        to: NORMAL
        trigger: "POST /stores/{id}/publish-menu"
        actor: StoreOperator
        preconditions:
          - "MenuVersion.state == PUBLISHED"
          - "MenuVersion.brand_code == Store.brand_code"
          - "expected_store_version == Store.version"
          - "Store has at least one StoreHourWindow"
        side_effects:
          - "Store.active_menu_version_id = menu_version_id"
          - "One ChannelListing materialized per (MenuItem in version) x (Channel) with price_cents from channel_listing_price"
          - "Previous version's ChannelListings for this store are deleted; previous MenuVersion.published_store_count decremented and it moves to SUPERSEDED when that count reaches 0"
          - "MenuVersion.published_store_count incremented"
          - "Store.last_published_at = current logical clock; Store.version incremented"
      - from: NORMAL
        to: NORMAL
        trigger: "POST /stores/{id}/publish-menu"
        actor: StoreOperator
        preconditions:
          - "MenuVersion.state == PUBLISHED"
          - "expected_store_version == Store.version"
        side_effects:
          - "Same republish side effects; eighty_sixed flags are NOT carried across a version change and reset to false"
          - "Store.version incremented"
      - from: NORMAL
        to: THROTTLED
        trigger: "POST /stores/{id}/recompute-throttle"
        actor: StoreOperator
        preconditions:
          - "store_throttle_state target == THROTTLED"
        side_effects:
          - "Every ChannelListing of this store on a Channel with throttle_policy = SUPPRESS_ON_THROTTLE re-derives availability_state (THROTTLE_SUPPRESSED unless already SUPPRESSED or EIGHTY_SIXED)"
      - from: THROTTLED
        to: NORMAL
        trigger: "POST /stores/{id}/recompute-throttle"
        actor: StoreOperator
        preconditions:
          - "store_throttle_state target == NORMAL"
        side_effects:
          - "THROTTLE_SUPPRESSED listings re-derive availability_state and return to AVAILABLE unless suppressed or eighty_sixed"
      - from: NORMAL
        to: PAUSED
        trigger: "POST /stores/{id}/recompute-throttle"
        actor: StoreOperator
        preconditions:
          - "store_throttle_state target == PAUSED"
        side_effects:
          - "All listings on SUPPRESS_ON_THROTTLE channels re-derive availability_state"
      - from: THROTTLED
        to: PAUSED
        trigger: "POST /stores/{id}/recompute-throttle"
        actor: StoreOperator
        preconditions:
          - "store_throttle_state target == PAUSED"
        side_effects:
          - "All listings on SUPPRESS_ON_THROTTLE channels re-derive availability_state"
      - from: PAUSED
        to: THROTTLED
        trigger: "POST /stores/{id}/recompute-throttle"
        actor: StoreOperator
        preconditions:
          - "Store.active_menu_version_id is not null"
          - "store_throttle_state target == THROTTLED"
        side_effects:
          - "Listings re-derive availability_state"

  - entity: MenuVersion
    field: state
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /menu-versions/{id}/finalize"
        actor: PlatformAdmin
        preconditions:
          - "item_count >= 1"
        side_effects:
          - "published_at = current logical clock"
          - "MenuItems become immutable (no further POST /menu-versions/{id}/items)"
      - from: PUBLISHED
        to: EXHAUSTED
        trigger: "POST /availability-events (event_type = EIGHTY_SIX)"
        actor: StoreOperator
        preconditions:
          - "After propagation, every ChannelListing referencing a MenuItem of this version has eighty_sixed = true"
          - "published_store_count >= 1"
        side_effects:
          - "Bubble-up only; no listing is changed by the transition itself"
      - from: EXHAUSTED
        to: PUBLISHED
        trigger: "POST /availability-events (event_type = RESTORE)"
        actor: StoreOperator
        preconditions:
          - "After propagation, at least one ChannelListing of this version has eighty_sixed = false"
        side_effects: []
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "POST /stores/{id}/publish-menu (a different version)"
        actor: StoreOperator
        preconditions:
          - "published_store_count reaches 0 as a result of the publish"
        side_effects:
          - "superseded_at = current logical clock"
      - from: EXHAUSTED
        to: SUPERSEDED
        trigger: "POST /stores/{id}/publish-menu (a different version)"
        actor: StoreOperator
        preconditions:
          - "published_store_count reaches 0 as a result of the publish"
        side_effects:
          - "superseded_at = current logical clock"

  - entity: Order
    field: injection_status
    initial_state: PENDING
    terminal_states: [FAILED]
    transitions:
      - from: PENDING
        to: PENDING
        trigger: "POST /orders/{id}/inject"
        actor: StoreOperator
        preconditions:
          - "pos_result_code != OK"
          - "injection_attempt_count + 1 < Store.pos_retry_limit"
        side_effects:
          - "PosInjectionAttempt created with outcome REJECTED"
          - "Order.injection_attempt_count incremented"
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /orders/{id}/inject"
        actor: StoreOperator
        preconditions:
          - "pos_result_code == OK"
        side_effects:
          - "PosInjectionAttempt created with outcome ACCEPTED"
          - "Order.injection_attempt_count incremented"
      - from: PENDING
        to: TABLET_FALLBACK
        trigger: "POST /orders/{id}/inject"
        actor: StoreOperator
        preconditions:
          - "pos_result_code != OK"
          - "injection_attempt_count + 1 >= Store.pos_retry_limit"
          - "Store.tablet_backlog_count < Store.tablet_backlog_threshold"
        side_effects:
          - "PosInjectionAttempt created with outcome REJECTED"
          - "Store.tablet_backlog_count incremented"
      - from: PENDING
        to: FAILED
        trigger: "POST /orders/{id}/inject"
        actor: StoreOperator
        preconditions:
          - "pos_result_code != OK"
          - "injection_attempt_count + 1 >= Store.pos_retry_limit"
          - "Store.tablet_backlog_count >= Store.tablet_backlog_threshold"
        side_effects:
          - "PosInjectionAttempt created with outcome REJECTED"
          - "Order.fulfillment_status = CANCELLED"
          - "Store.reserved_prep_slots decremented; Store.open_order_count decremented"
          - "Any OFFERED or ACCEPTED DeliveryAssignment for the order moves to WITHDRAWN"
      - from: TABLET_FALLBACK
        to: ACCEPTED
        trigger: "POST /orders/{id}/inject"
        actor: StoreOperator
        preconditions:
          - "pos_result_code == OK"
        side_effects:
          - "PosInjectionAttempt created with outcome ACCEPTED"
          - "Store.tablet_backlog_count decremented"
      - from: PENDING
        to: INJECTION_HELD
        trigger: "POST /availability-events (event_type = EIGHTY_SIX)"
        actor: StoreOperator
        preconditions:
          - "The order has an OrderLine whose sku matches the 86-ed MenuItem"
          - "The order's Channel.eighty_six_policy == HONOR_86"
          - "Order.injection_status == PENDING"
        side_effects:
          - "Store.reserved_prep_slots decremented"
          - "Any OFFERED DeliveryAssignment for the order moves to WITHDRAWN"
      - from: INJECTION_HELD
        to: PENDING
        trigger: "POST /orders/{id}/resume-injection"
        actor: StoreOperator
        preconditions:
          - "No OrderLine of the order maps to a ChannelListing whose availability_state != AVAILABLE"
          - "Store.throttle_state != PAUSED"
          - "capacity_bucket_load admits the order into its bucket_index"
        side_effects:
          - "Store.reserved_prep_slots incremented"

  - entity: Order
    field: fulfillment_status
    initial_state: PREPARING
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: PREPARING
        to: READY
        trigger: "POST /orders/{id}/ready"
        actor: StoreOperator
        preconditions:
          - "Order.injection_status in [ACCEPTED, TABLET_FALLBACK]"
        side_effects:
          - "Store.reserved_prep_slots decremented"
      - from: READY
        to: HANDED_OFF
        trigger: "POST /delivery-assignments/{id}/handoff"
        actor: CourierNetworkAgent
        preconditions:
          - "Order.fulfillment_mode == DELIVERY"
          - "DeliveryAssignment.state == ACCEPTED"
        side_effects:
          - "Store.open_order_count decremented"
      - from: HANDED_OFF
        to: DELIVERED
        trigger: "POST /delivery-assignments/{id}/deliver"
        actor: CourierNetworkAgent
        preconditions:
          - "DeliveryAssignment.state == HANDED_OFF"
        side_effects: []
      - from: PREPARING
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: StoreOperator
        preconditions:
          - "Order.settlement_status == SETTLEABLE"
          - "Order.refunded_total_cents == 0"
        side_effects:
          - "Store.reserved_prep_slots decremented (skipped when injection_status == INJECTION_HELD, which already released the slot)"
          - "Store.open_order_count decremented"
          - "Store.tablet_backlog_count decremented when injection_status == TABLET_FALLBACK"
          - "Any OFFERED or ACCEPTED DeliveryAssignment moves to WITHDRAWN"
      - from: READY
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: StoreOperator
        preconditions:
          - "Order.settlement_status == SETTLEABLE"
          - "Order.refunded_total_cents == 0"
        side_effects:
          - "Store.open_order_count decremented"
          - "Any OFFERED or ACCEPTED DeliveryAssignment moves to WITHDRAWN"

  - entity: Order
    field: settlement_status
    initial_state: SETTLEABLE
    terminal_states: [SETTLED]
    transitions:
      - from: SETTLEABLE
        to: STATEMENT_ASSIGNED
        trigger: "POST /remittance-statements/{id}/assign-orders"
        actor: SettlementAnalyst
        preconditions:
          - "RemittanceStatement.state in [OPEN, DISPUTED]"
          - "Order.channel_id == RemittanceStatement.channel_id"
          - "Order.fulfillment_status in [READY, HANDED_OFF, DELIVERED]"
          - "period_start <= Order.created_at < period_end"
        side_effects:
          - "Order.remittance_statement_id set; every ACCEPTED Adjustment of the order is assigned to the same statement"
          - "Statement aggregates recomputed by remittance_settlement"
      - from: STATEMENT_ASSIGNED
        to: SETTLEABLE
        trigger: "POST /remittance-statements/{id}/dispute"
        actor: ChannelPartner
        preconditions:
          - "RemittanceStatement.state == RECONCILED"
        side_effects:
          - "Order.remittance_statement_id cleared; adjustments unassigned; statement aggregates zeroed"
      - from: STATEMENT_ASSIGNED
        to: SETTLED
        trigger: "POST /remittance-statements/{id}/settle"
        actor: SettlementAnalyst
        preconditions:
          - "RemittanceStatement.state == RECONCILED"
        side_effects:
          - "RemittanceStatement.settled_at set"

  - entity: DeliveryAssignment
    field: state
    initial_state: OFFERED
    terminal_states: [DECLINED, WITHDRAWN, DELIVERED]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /delivery-assignments/{id}/accept"
        actor: CourierNetworkAgent
        preconditions:
          - "CourierNetwork.is_active == true"
          - "Order.injection_status in [ACCEPTED, TABLET_FALLBACK]"
        side_effects:
          - "accepted_at = clock; handoff_deadline_at = accepted_at + handoff_sla_seconds"
          - "occupancy_until = handoff_deadline_at + dispatch_buffer_seconds"
          - "delivery_fee_cents = CourierNetwork.per_delivery_fee_cents"
      - from: OFFERED
        to: DECLINED
        trigger: "POST /delivery-assignments/{id}/decline"
        actor: CourierNetworkAgent
        preconditions: []
        side_effects:
          - "occupancy_until = current logical clock, releasing network capacity immediately"
          - "The order becomes re-dispatchable"
      - from: ACCEPTED
        to: HANDED_OFF
        trigger: "POST /delivery-assignments/{id}/handoff"
        actor: CourierNetworkAgent
        preconditions:
          - "Order.fulfillment_status == READY"
        side_effects:
          - "handoff_at, handoff_lateness_seconds, sla_breached and handoff_penalty_cents computed by handoff_sla_penalty"
          - "CourierNetwork.penalty_accrued_cents increased by handoff_penalty_cents"
          - "Order.fulfillment_status = HANDED_OFF; Store.open_order_count decremented"
      - from: HANDED_OFF
        to: DELIVERED
        trigger: "POST /delivery-assignments/{id}/deliver"
        actor: CourierNetworkAgent
        preconditions: []
        side_effects:
          - "delivered_at = clock; Order.fulfillment_status = DELIVERED"
      - from: OFFERED
        to: WITHDRAWN
        trigger: "POST /orders/{id}/cancel or the 86 cascade of POST /availability-events"
        actor: StoreOperator
        preconditions:
          - "Order leaves a dispatchable state"
        side_effects:
          - "occupancy_until = current logical clock"
      - from: ACCEPTED
        to: WITHDRAWN
        trigger: "POST /orders/{id}/cancel"
        actor: StoreOperator
        preconditions:
          - "Order.fulfillment_status becomes CANCELLED"
        side_effects:
          - "occupancy_until = current logical clock"

  - entity: Adjustment
    field: state
    initial_state: DRAFT
    terminal_states: [REVERSED]
    transitions:
      - from: DRAFT
        to: CHANNEL_REVIEW
        trigger: "POST /adjustments/{id}/submit"
        actor: SettlementAnalyst
        preconditions:
          - "Channel.adjustment_review_mode == CHANNEL_REVIEW"
        side_effects:
          - "RemittanceStatement.open_adjustment_count recomputed for any statement holding the order"
      - from: DRAFT
        to: ACCEPTED
        trigger: "POST /adjustments/{id}/submit"
        actor: SettlementAnalyst
        preconditions:
          - "Channel.adjustment_review_mode == AUTO_ACCEPT"
        side_effects:
          - "Money side effects of acceptance applied (see CHANNEL_REVIEW -> ACCEPTED)"
      - from: CHANNEL_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /adjustments/{id}/request-revision"
        actor: ChannelPartner
        preconditions:
          - "revision_round < MAX_REVISION_ROUNDS"
        side_effects: []
      - from: REVISION_REQUESTED
        to: CHANNEL_REVIEW
        trigger: "POST /adjustments/{id}/revise"
        actor: SettlementAnalyst
        preconditions:
          - "amount_cents, when supplied, still satisfies the refund ceiling"
        side_effects:
          - "revision_round incremented"
          - "amount_cents replaced when supplied; commission_relief_cents recomputed"
      - from: CHANNEL_REVIEW
        to: ACCEPTED
        trigger: "POST /adjustments/{id}/accept"
        actor: ChannelPartner
        preconditions:
          - "Order.settlement_status != SETTLED"
        side_effects:
          - "accepted_at = clock"
          - "Order.refunded_total_cents increased by amount_cents"
          - "Order.commission_cents decreased by commission_relief_cents"
          - "Order.brand_net_cents decreased by (amount_cents - commission_relief_cents)"
          - "When the order already belongs to a statement, the adjustment inherits Order.remittance_statement_id and the statement's tier_base_cents, tier, commission_cents, rebate_cents and net_payable_cents are recomputed in that order"
      - from: ACCEPTED
        to: REVERSED
        trigger: "POST /adjustments/{id}/reverse"
        actor: SettlementAnalyst
        preconditions:
          - "X-User-ID != Adjustment.proposed_by_user_id"
          - "Order.settlement_status != SETTLED"
        side_effects:
          - "reversed_at = clock"
          - "Every money side effect of acceptance is undone exactly: refunded_total_cents, commission_cents and brand_net_cents return to their pre-acceptance values"

  - entity: RemittanceStatement
    field: state
    initial_state: OPEN
    terminal_states: [SETTLED]
    transitions:
      - from: OPEN
        to: RECONCILED
        trigger: "POST /remittance-statements/{id}/reconcile"
        actor: SettlementAnalyst
        preconditions:
          - "order_count >= 1"
          - "open_adjustment_count == 0"
        side_effects:
          - "Aggregates frozen by remittance_settlement; reconciled_by_user_id = X-User-ID"
      - from: RECONCILED
        to: DISPUTED
        trigger: "POST /remittance-statements/{id}/dispute"
        actor: ChannelPartner
        preconditions: []
        side_effects:
          - "Every assigned Order returns to SETTLEABLE with remittance_statement_id cleared"
          - "order_count, gross_sales_cents, adjustment_total_cents, tier_base_cents, commission_cents, rebate_cents and net_payable_cents reset to 0; tier reset to TIER_1"
      - from: DISPUTED
        to: RECONCILED
        trigger: "POST /remittance-statements/{id}/reconcile"
        actor: SettlementAnalyst
        preconditions:
          - "order_count >= 1"
          - "open_adjustment_count == 0"
        side_effects:
          - "Aggregates recomputed; reconciled_by_user_id overwritten with the current X-User-ID"
      - from: RECONCILED
        to: SETTLED
        trigger: "POST /remittance-statements/{id}/settle"
        actor: SettlementAnalyst
        preconditions:
          - "X-User-ID != reconciled_by_user_id"
        side_effects:
          - "settled_at = clock; every assigned Order.settlement_status = SETTLED"

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent entity's `version` only
# =============================================================================
concurrency_rules:

  - rule_id: menu-publish-stale-store
    parent_entity: Store
    write_endpoint: "POST /stores/{id}/publish-menu"
    occ_field: "expected_store_version"
    description: |
      Publishing a MenuVersion to a Store whose version has advanced since the
      client last read it is rejected. A publish legitimately supersedes the
      store's previous menu and rebuilds every ChannelListing, so a writer
      holding a stale view of the store would silently discard listing state
      (suppression flags, 86 flags) that another writer has already replaced.
    error_id: ERR_STALE_STORE_VERSION
    http_status: 412

  - rule_id: adjustment-create-stale-order
    parent_entity: Order
    write_endpoint: "POST /adjustments"
    occ_field: "expected_order_version"
    description: |
      Creating an Adjustment against an Order whose version has advanced since
      the client last read it is rejected. The refund ceiling is derived from
      Order.refunded_total_cents and Order.channel_collected_cents, both of
      which move whenever another adjustment is accepted or reversed, so a
      stale view of the order would let a refund be proposed against money
      that is no longer available.
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412

  - rule_id: channel-config-update-stale
    parent_entity: Channel
    write_endpoint: "PATCH /channels/{id}"
    occ_field: "expected_channel_version"
    description: |
      Updating channel fee, markup, 86 or settlement configuration against a
      Channel whose version has advanced since the client last read it is
      rejected. A configuration write legitimately overwrites the previous
      configuration, so a writer holding a stale view would blindly revert
      values another writer has already changed.
    error_id: ERR_STALE_CHANNEL_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table  (§1.3)
# =============================================================================
calculations:

  - name: channel_listing_price
    description: |
      Channel-specific price for a single-source menu item: the brand base
      price marked up in basis points, rounded to the cent, then lifted to the
      channel's price grid.
    trigger: "POST /stores/{id}/publish-menu materializes or rebuilds ChannelListing rows"
    inputs:
      - "MenuItem.base_price_cents"
      - "Channel.markup_bps"
      - "Channel.rounding_mode"
    algorithm: rounding_ladder
    formula: |
      raw = base_price_cents * (BPS_DENOMINATOR + markup_bps) / BPS_DENOMINATOR   # exact rational
      cent_price = round_half_up(raw)                                             # integer cents
      if rounding_mode == NICKEL:
          price_cents = NICKEL_STEP_CENTS * ceil(cent_price / NICKEL_STEP_CENTS)
      else:
          price_cents = cent_price
      # The nickel step is applied AFTER the half-up rounding, never before.
      # Worked example: base 249, markup 1500 bps, NICKEL
      #   raw = 286.35 -> cent_price = 286 -> price_cents = 290
    constants:
      BPS_DENOMINATOR: 10000
      NICKEL_STEP_CENTS: 5
    precision: "integer cents; round_half_up to the cent, then ceiling to the nickel step for NICKEL channels"

  - name: order_channel_totals
    description: |
      Money breakdown for an order on its originating channel. Tax is rounded
      per line and then summed; it is never recomputed from the order subtotal.
    trigger: "POST /orders, after every OrderLine has resolved its ChannelListing"
    inputs:
      - "OrderLine.unit_price_cents, quantity, tax_bps, base_price_cents"
      - "Channel.service_fee_cents"
      - "Channel.commission_bps"
      - "Order.tip_cents"
    algorithm: aggregation
    formula: |
      per line:
        line_subtotal_cents = unit_price_cents * quantity
        line_tax_cents      = round_half_up(line_subtotal_cents * tax_bps / BPS_DENOMINATOR)
      subtotal_cents = SUM(line_subtotal_cents)
      tax_cents      = SUM(line_tax_cents)          # sum of per-line rounded taxes
      markup_cents   = subtotal_cents - SUM(base_price_cents * quantity)
      service_fee_cents = Channel.service_fee_cents
      channel_collected_cents = subtotal_cents + tax_cents + service_fee_cents + tip_cents
      commission_cents = round_half_up((subtotal_cents + service_fee_cents)
                                       * Channel.commission_bps / BPS_DENOMINATOR)
      brand_net_cents  = subtotal_cents + tax_cents + tip_cents - commission_cents
      # Money identity maintained for the whole life of the order:
      #   channel_collected_cents ==
      #       brand_net_cents + commission_cents + service_fee_cents + refunded_total_cents
      # Worked example: lines 2 x 1265 and 1 x 460 at 875 bps tax
      #   line taxes 221 and 40 -> tax_cents = 261 (NOT round_half_up(2990*0.0875) = 262)
    constants:
      BPS_DENOMINATOR: 10000
    precision: "integer cents, round_half_up, rounded once per line before summation"

  - name: quote_time_calculation
    description: |
      Quote time for a store/channel pair. The provisional quote shown to a
      channel before ordering and the confirmed promise pinned onto the order
      are computed from different order populations and therefore diverge.
    trigger: "GET /stores/{id}/quote (PROVISIONAL) and POST /orders (CONFIRMED)"
    inputs:
      - "Store.base_prep_minutes, Store.throttle_state, Store.timezone_offset_minutes"
      - "Set of the store's open Orders"
      - "Order.fulfillment_mode"
      - "current logical clock"
    algorithm: forward_looking
    formula: |
      prep_minutes = base_prep_minutes
                   + LOAD_PAD_MINUTES_PER_ORDER * load_count
                   + (THROTTLE_PAD_MINUTES if throttle_state == THROTTLED else 0)
      travel_minutes = COURIER_TRAVEL_MINUTES if fulfillment_mode == DELIVERY else 0
      total_minutes = prep_minutes + travel_minutes
      if total_minutes > MAX_QUOTE_MINUTES: reject with ERR_QUOTE_WINDOW_EXCEEDED
      ready_at = current_logical_clock + total_minutes
    constants:
      LOAD_PAD_MINUTES_PER_ORDER: 2
      THROTTLE_PAD_MINUTES: 8
      COURIER_TRAVEL_MINUTES: 11
      MAX_QUOTE_MINUTES: 90
    precision: "whole minutes; ready_at is an exact ISO-8601 instant with zero seconds offset from the clock"
    variants:
      - name: PROVISIONAL
        when: "GET /stores/{id}/quote — a channel asking what it may promise right now"
        difference: |
          load_count = number of Orders at the store whose injection_status is
          PENDING, INJECTION_HELD, ACCEPTED or TABLET_FALLBACK and whose
          fulfillment_status is PREPARING, evaluated at request time. The
          store's live throttle_state supplies the throttle pad. Nothing is
          persisted.
      - name: CONFIRMED
        when: "POST /orders — pinning Order.promised_ready_at"
        difference: |
          load_count counts only those orders created STRICTLY BEFORE the new
          order's created_at (chronological replay), and the throttle_state as
          of that instant is used. promised_ready_at is pinned at creation and
          is never recomputed, so a later throttle change or a later order does
          not move it.

  - name: courier_network_selection
    description: |
      Chooses the courier or marketplace network that receives the delivery
      offer, honouring network eligibility, live occupancy and a deterministic
      ranking ladder.
    trigger: "POST /orders/{id}/dispatch"
    inputs:
      - "CourierNetwork.is_active, network_type, priority_rank, per_delivery_fee_cents, handoff_sla_seconds, max_concurrent_assignments, created_at"
      - "Channel.channel_type of the order"
      - "Occupancy intervals of existing DeliveryAssignments"
      - "current logical clock"
    algorithm: selector_policy
    formula: |
      occupancy_count(network, at) =
        count of DeliveryAssignments on the network whose state is OFFERED or
        ACCEPTED and whose CLOSED interval [offered_at, occupancy_until]
        contains `at`
      eligible(network) =
        network.is_active == true
        AND (network.network_type == COURIER
             OR order.channel.channel_type == MARKETPLACE)
        AND occupancy_count(network, clock) < network.max_concurrent_assignments
      candidates = [n for n in CourierNetwork if eligible(n)]
      if candidates is empty: reject with ERR_NO_ELIGIBLE_COURIER_NETWORK
      order candidates by
        priority_rank ASC,
        per_delivery_fee_cents ASC,
        handoff_sla_seconds ASC,
        created_at ASC                       # final deterministic tie-break, never id
      selected = candidates[0]
    constants: {}
    precision: "exact integer comparisons; occupancy interval endpoints are inclusive on both ends"

  - name: handoff_sla_penalty
    description: |
      Tiered penalty accrued against a courier network when handoff happens
      after the SLA deadline.
    trigger: "POST /delivery-assignments/{id}/handoff"
    inputs:
      - "DeliveryAssignment.handoff_deadline_at"
      - "current logical clock as handoff_at"
    algorithm: threshold
    formula: |
      lateness_seconds = max(0, seconds(handoff_at - handoff_deadline_at))
      sla_breached = lateness_seconds > HANDOFF_GRACE_SECONDS          # STRICT >
      if lateness_seconds <= HANDOFF_GRACE_SECONDS:      penalty = 0
      elif lateness_seconds <= PENALTY_TIER_2_SECONDS:   penalty = PENALTY_TIER_1_CENTS
      elif lateness_seconds <= PENALTY_TIER_3_SECONDS:   penalty = PENALTY_TIER_2_CENTS
      else:                                              penalty = PENALTY_TIER_3_CENTS
      CourierNetwork.penalty_accrued_cents += penalty
    constants:
      HANDOFF_GRACE_SECONDS: 300
      PENALTY_TIER_2_SECONDS: 900
      PENALTY_TIER_3_SECONDS: 1800
      PENALTY_TIER_1_CENTS: 150
      PENALTY_TIER_2_CENTS: 400
      PENALTY_TIER_3_CENTS: 900
    precision: "whole seconds, whole cents; each band is closed at its upper bound"

  - name: remittance_settlement
    description: |
      Statement-level settlement. Volume tier, commission and rebate all read
      the same adjusted volume figure, so the pipeline order below is normative:
      tier base first, then tier, then commission, then rebate, then net.
    trigger: "POST /remittance-statements/{id}/assign-orders, /reconcile, GET .../preview, and any adjustment acceptance or reversal touching an assigned order"
    inputs:
      - "Assigned Orders: subtotal_cents, service_fee_cents"
      - "Assigned ACCEPTED Adjustments: amount_cents"
      - "Channel.commission_bps, Channel.settlement_mode"
    algorithm: tiered_pricing
    formula: |
      1. gross_sales_cents      = SUM(order.subtotal_cents + order.service_fee_cents)
         adjustment_total_cents = SUM(accepted adjustment.amount_cents)
      2. tier_base_cents        = max(0, gross_sales_cents - adjustment_total_cents)
      3. tier = TIER_1 if tier_base_cents < TIER_2_THRESHOLD_CENTS
                TIER_2 if TIER_2_THRESHOLD_CENTS <= tier_base_cents < TIER_3_THRESHOLD_CENTS
                TIER_3 otherwise
      4. effective_commission_bps = max(0, Channel.commission_bps - TIER_DISCOUNT_BPS[tier])
      5. commission_cents = round_half_up(tier_base_cents * effective_commission_bps / BPS_DENOMINATOR)
      6. rebate_cents     = round_half_up(tier_base_cents * TIER_REBATE_BPS[tier] / BPS_DENOMINATOR)
      7. net_payable_cents = per the settlement_mode variant below
      # Worked example: gross 6578, adjustments 1000, commission 2500 bps
      #   tier_base 5578 -> TIER_1 -> eff 2500 bps -> commission 1395, rebate 0
      #   GROSS_MODE net 5578 ; NET_MODE net 4183
    constants:
      BPS_DENOMINATOR: 10000
      TIER_2_THRESHOLD_CENTS: 50000
      TIER_3_THRESHOLD_CENTS: 200000
      TIER_DISCOUNT_BPS: { TIER_1: 0, TIER_2: 50, TIER_3: 125 }
      TIER_REBATE_BPS: { TIER_1: 0, TIER_2: 25, TIER_3: 75 }
    precision: "integer cents, round_half_up, applied independently to commission and rebate"
    variants:
      - name: GROSS_MODE
        when: "Channel.settlement_mode == GROSS_MODE"
        difference: |
          The channel remits the adjusted volume and the brand is invoiced for
          commission separately:
            net_payable_cents = tier_base_cents + rebate_cents
          commission_cents is still computed and reported, but is NOT withheld.
      - name: NET_MODE
        when: "Channel.settlement_mode == NET_MODE"
        difference: |
          The channel withholds commission before remitting:
            net_payable_cents = tier_base_cents - commission_cents + rebate_cents

  - name: store_throttle_state
    description: |
      Target capacity posture of a store, derived from how many prep slots are
      currently reserved relative to the per-bucket capacity.
    trigger: "POST /stores/{id}/recompute-throttle"
    inputs:
      - "Store.active_menu_version_id"
      - "Store.reserved_prep_slots"
      - "Store.prep_capacity_per_bucket"
    algorithm: threshold
    formula: |
      # First match wins; the order of the clauses is normative.
      if active_menu_version_id is null:                              target = PAUSED
      elif reserved_prep_slots >= 2 * prep_capacity_per_bucket:       target = PAUSED
      elif reserved_prep_slots >= prep_capacity_per_bucket:           target = THROTTLED
      else:                                                           target = NORMAL
    constants:
      PAUSE_CAPACITY_MULTIPLIER: 2
    precision: "integer comparisons; both thresholds are inclusive (>=)"

  - name: capacity_bucket_load
    description: |
      Admission control for new and resumed orders: 15-minute local buckets
      each admit at most prep_capacity_per_bucket open orders.
    trigger: "POST /orders and POST /orders/{id}/resume-injection"
    inputs:
      - "current logical clock"
      - "Store.timezone_offset_minutes"
      - "Store.prep_capacity_per_bucket"
      - "Existing Orders' bucket_index, injection_status and fulfillment_status"
    algorithm: aggregation
    formula: |
      local_minute_of_day = (utc_minute_of_day + timezone_offset_minutes) mod 1440
      bucket_index = floor(local_minute_of_day / BUCKET_MINUTES)
      bucket_load  = count of Orders at the store with the same bucket_index
                     whose injection_status is PENDING, ACCEPTED or
                     TABLET_FALLBACK and whose fulfillment_status is PREPARING
      if bucket_load >= prep_capacity_per_bucket:
          reject with ERR_CAPACITY_BUCKET_FULL      # inclusive boundary
      # Worked example: clock 2026-08-03T16:00:00Z, offset -300
      #   local_minute_of_day = 660 -> bucket_index = 44
    constants:
      BUCKET_MINUTES: 15
    precision: "integer bucket index; admission comparison is >= (a full bucket rejects)"

  - name: listing_availability_state
    description: |
      Near-real-time availability of a listing, replayed from the store's
      availability event log and then resolved against suppression and
      throttle precedence.
    trigger: "POST /availability-events, PATCH /channel-listings/{id}, POST /stores/{id}/recompute-throttle, POST /stores/{id}/publish-menu"
    inputs:
      - "AvailabilityEvent log for (store_id, menu_item_id) ordered by created_at"
      - "Channel.eighty_six_policy"
      - "Channel.throttle_policy"
      - "ChannelListing.suppressed"
      - "Store.throttle_state"
    algorithm: projection
    formula: |
      # 1. Event replay (only listings on HONOR_86 channels adopt the flag)
      eighty_sixed = false
      for event in AvailabilityEvents(store_id, menu_item_id) ordered by created_at ASC:
          if Channel.eighty_six_policy == IGNORE_86: continue
          eighty_sixed = (event.event_type == EIGHTY_SIX)
      # A publish-menu that changes Store.active_menu_version_id resets
      # eighty_sixed to false for every rebuilt listing: the replay window
      # starts at Store.last_published_at.
      #
      # 2. Precedence — first match wins
      if suppressed:                                            SUPPRESSED
      elif eighty_sixed:                                        EIGHTY_SIXED
      elif Channel.throttle_policy == SUPPRESS_ON_THROTTLE
           and Store.throttle_state in [THROTTLED, PAUSED]:     THROTTLE_SUPPRESSED
      else:                                                     AVAILABLE
    constants: {}
    precision: "exact enum resolution; replay order is created_at ASC, ties broken by insertion order"

# =============================================================================
# Table 4: Validation Rules Table  (§1.4) — evaluated in ascending priority
# order; the FIRST violated rule determines the response.
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-Role header present and names a role declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
    description: "Requests without a recognised X-Role header are rejected before anything else is read."

  - priority: 2
    category: auth
    check: "X-Role is listed in the endpoint's roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
    description: "Role-based access control on the endpoint itself, independent of which resource is addressed."

  - priority: 3
    category: request
    check: "Body and query shape: every required input present, correct type, enum values recognised, integers inside their declared range, limit within 1..100 and offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
    description: |
      Covers missing required fields, unknown enum values, non-positive
      quantities and amounts, an empty `lines` array, day_of_week outside 0..6,
      closes_at_minute <= opens_at_minute and out-of-range pagination.

  - priority: 4
    category: existence
    check: "Every entity referenced by a path segment or a body foreign key resolves to an existing row"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "all"
    description: |
      Concrete ids by entity: ERR_STORE_NOT_FOUND, ERR_CHANNEL_NOT_FOUND,
      ERR_MENU_VERSION_NOT_FOUND, ERR_MENU_ITEM_NOT_FOUND,
      ERR_LISTING_NOT_FOUND, ERR_ORDER_NOT_FOUND, ERR_ORDER_LINE_NOT_FOUND,
      ERR_AVAILABILITY_EVENT_NOT_FOUND, ERR_COURIER_NETWORK_NOT_FOUND,
      ERR_ASSIGNMENT_NOT_FOUND, ERR_ADJUSTMENT_NOT_FOUND,
      ERR_STATEMENT_NOT_FOUND. A body FK pointing at a row that exists but
      belongs to a different parent is treated as not found, never as a
      permission error.

  - priority: 5
    category: auth
    check: "An entity-backed role's scope header identifies the resource being addressed"
    error_id: ERR_FORBIDDEN_SCOPE
    http_status: 403
    applies_to: "all endpoints reachable by StoreOperator, ChannelPartner or CourierNetworkAgent"
    description: |
      StoreOperator sends X-Store-ID and may only act on that Store and its
      orders; ChannelPartner sends X-Channel-ID and may only act on its own
      channel, listings, adjustments and statements; CourierNetworkAgent sends
      X-Courier-Network-ID and may only act on assignments offered to that
      network. Evaluated after existence so a wrong-scope request on a
      non-existent id still returns 404.

  - priority: 6
    category: auth
    check: "Segregation of duties: the acting X-User-ID differs from the user recorded for the preceding step"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: ["POST /adjustments/{id}/reverse", "POST /remittance-statements/{id}/settle"]
    description: |
      The analyst who proposed an adjustment may not reverse it
      (X-User-ID != Adjustment.proposed_by_user_id) and the analyst who
      reconciled a statement may not settle it
      (X-User-ID != RemittanceStatement.reconciled_by_user_id).

  - priority: 7
    category: concurrency
    check: "expected_<parent>_version equals the parent entity's current version"
    error_id: "ERR_STALE_STORE_VERSION | ERR_STALE_ORDER_VERSION | ERR_STALE_CHANNEL_VERSION"
    http_status: 412
    applies_to: ["POST /stores/{id}/publish-menu", "POST /adjustments", "PATCH /channels/{id}"]
    description: "Optimistic concurrency control per §1.2.1; checked before any state or business rule so a stale writer never observes downstream errors."

  - priority: 8
    category: uniqueness
    check: "Scoped uniqueness constraints hold"
    error_id: "ERR_DUPLICATE_CHANNEL_CODE | ERR_DUPLICATE_NETWORK_CODE | ERR_DUPLICATE_VERSION_LABEL | ERR_DUPLICATE_SKU | ERR_DUPLICATE_EXTERNAL_REF"
    http_status: 409
    applies_to: ["POST /channels", "POST /courier-networks", "POST /menu-versions", "POST /menu-versions/{id}/items", "POST /orders"]
    description: "Channel.code and CourierNetwork.code are globally unique; MenuVersion.version_label is unique per brand_code; MenuItem.sku is unique per menu_version_id; Order.external_ref is unique per channel_id."

  - priority: 9
    category: state
    check: "MenuVersion.state == DRAFT when adding items or finalizing"
    error_id: ERR_MENU_VERSION_LOCKED
    http_status: 409
    applies_to: ["POST /menu-versions/{id}/items", "POST /menu-versions/{id}/finalize"]
    description: "A finalized menu version is a frozen single source; items may only be added while it is DRAFT, and finalize is only legal from DRAFT."

  - priority: 10
    category: state
    check: "MenuVersion.item_count >= 1 when finalizing"
    error_id: ERR_MENU_VERSION_EMPTY
    http_status: 409
    applies_to: ["POST /menu-versions/{id}/finalize"]
    description: "An empty menu version cannot be published to any store."

  - priority: 11
    category: state
    check: "MenuVersion.state == PUBLISHED when publishing to a store"
    error_id: ERR_MENU_VERSION_NOT_PUBLISHED
    http_status: 409
    applies_to: ["POST /stores/{id}/publish-menu"]
    description: "Only a finalized (PUBLISHED) or EXHAUSTED-then-restored version may be pushed to a store; DRAFT and SUPERSEDED versions are rejected."

  - priority: 12
    category: business_referential
    check: "MenuVersion.brand_code == Store.brand_code"
    error_id: ERR_BRAND_MISMATCH
    http_status: 422
    applies_to: ["POST /stores/{id}/publish-menu"]
    description: "Menu versions are brand-scoped; a store may not publish another brand's menu."

  - priority: 13
    category: business_safety
    check: "Store has at least one StoreHourWindow before its first publish"
    error_id: ERR_STORE_HOURS_MISSING
    http_status: 409
    applies_to: ["POST /stores/{id}/publish-menu"]
    description: "A store with no operating hours cannot be brought online because quote times and ordering windows would be undefined."

  - priority: 14
    category: business_safety
    check: "A new StoreHourWindow does not overlap an existing window for the same day_of_week"
    error_id: ERR_HOUR_WINDOW_OVERLAP
    http_status: 409
    applies_to: ["POST /stores/{id}/hour-windows"]
    description: |
      Windows are half-open intervals [opens_at_minute, closes_at_minute).
      Two windows overlap when new.opens_at_minute < existing.closes_at_minute
      AND existing.opens_at_minute < new.closes_at_minute. Exact adjacency
      (new.opens_at_minute == existing.closes_at_minute) is allowed.

  - priority: 15
    category: state
    check: "Store.active_menu_version_id is not null"
    error_id: ERR_STORE_MENU_NOT_PUBLISHED
    http_status: 409
    applies_to: ["POST /orders", "GET /stores/{id}/quote", "POST /availability-events"]
    description: "A store with no published menu cannot quote, accept orders or 86 items."

  - priority: 16
    category: business_temporal
    check: "The current logical clock falls inside one of the store's StoreHourWindows for the local day_of_week"
    error_id: ERR_STORE_CLOSED
    http_status: 422
    applies_to: ["POST /orders", "GET /stores/{id}/quote"]
    description: |
      local_minute_of_day is derived with Store.timezone_offset_minutes and
      must satisfy opens_at_minute <= local_minute_of_day < closes_at_minute
      for a window whose day_of_week matches the local day. Ranks BELOW
      ERR_STORE_MENU_NOT_PUBLISHED, so an unpublished closed store reports the
      menu error.

  - priority: 17
    category: state
    check: "Store.throttle_state != PAUSED"
    error_id: ERR_STORE_PAUSED
    http_status: 409
    applies_to: ["POST /orders", "POST /orders/{id}/resume-injection"]
    description: "A paused store accepts no new or resumed orders. Ranks below both the menu and hours checks."

  - priority: 18
    category: business_referential
    check: "Channel.accepts_delivery is true for a DELIVERY order"
    error_id: ERR_CHANNEL_DELIVERY_UNSUPPORTED
    http_status: 422
    applies_to: ["POST /orders"]
    description: "A pickup-only channel cannot create DELIVERY orders."

  - priority: 19
    category: business_referential
    check: "Every line sku resolves to a ChannelListing for (store_id, channel_id)"
    error_id: ERR_SKU_NOT_LISTED
    http_status: 422
    applies_to: ["POST /orders"]
    description: "Order lines are resolved against the store's published listings for the originating channel, not against the raw menu."

  - priority: 20
    category: business_safety
    check: "Every resolved ChannelListing.availability_state == AVAILABLE"
    error_id: ERR_ITEM_NOT_AVAILABLE
    http_status: 409
    applies_to: ["POST /orders"]
    description: "Suppressed, 86-ed and throttle-suppressed listings cannot be ordered. Ranks below ERR_STORE_CLOSED."

  - priority: 21
    category: business_referential
    check: "Every line's MenuItem.is_delivery_eligible is true for a DELIVERY order"
    error_id: ERR_ITEM_NOT_DELIVERY_ELIGIBLE
    http_status: 422
    applies_to: ["POST /orders"]
    description: "Dine-in-only items cannot leave the store on a delivery order."

  - priority: 22
    category: business_safety
    check: "capacity_bucket_load admits the order: bucket_load < Store.prep_capacity_per_bucket"
    error_id: ERR_CAPACITY_BUCKET_FULL
    http_status: 409
    applies_to: ["POST /orders", "POST /orders/{id}/resume-injection"]
    description: "Throttling is enforced at the 15-minute bucket boundary with an inclusive comparison: a bucket holding exactly prep_capacity_per_bucket open orders is full."

  - priority: 23
    category: business_safety
    check: "quote_time_calculation total_minutes <= MAX_QUOTE_MINUTES"
    error_id: ERR_QUOTE_WINDOW_EXCEEDED
    http_status: 422
    applies_to: ["POST /orders", "GET /stores/{id}/quote"]
    description: "A store so loaded that its quote exceeds 90 minutes must stop quoting rather than promise an unachievable time."

  - priority: 24
    category: state
    check: "Order.injection_status permits the requested injection operation"
    error_id: ERR_INVALID_INJECTION_STATE
    http_status: 409
    applies_to: ["POST /orders/{id}/inject", "POST /orders/{id}/resume-injection"]
    description: "inject requires PENDING or TABLET_FALLBACK (FAILED is terminal); resume-injection requires INJECTION_HELD."

  - priority: 25
    category: business_safety
    check: "No OrderLine of the order maps to a listing whose availability_state != AVAILABLE"
    error_id: ERR_ITEM_STILL_UNAVAILABLE
    http_status: 409
    applies_to: ["POST /orders/{id}/resume-injection"]
    description: "A held order may only resume once every 86-ed or suppressed item on it is available again."

  - priority: 26
    category: state
    check: "Order.fulfillment_status permits the requested fulfillment operation"
    error_id: ERR_INVALID_ORDER_STATE
    http_status: 409
    applies_to: ["POST /orders/{id}/ready", "POST /orders/{id}/cancel", "POST /orders/{id}/dispatch"]
    description: "ready requires PREPARING; cancel requires PREPARING or READY; dispatch requires PREPARING or READY."

  - priority: 27
    category: state
    check: "Order.injection_status in [ACCEPTED, TABLET_FALLBACK] before the kitchen or a courier may act"
    error_id: ERR_ORDER_NOT_INJECTED
    http_status: 409
    applies_to: ["POST /orders/{id}/ready", "POST /orders/{id}/dispatch"]
    description: "An order that the point-of-sale has not accepted, and that has not fallen back to the tablet, is not yet a real kitchen ticket."

  - priority: 28
    category: business_referential
    check: "Order.fulfillment_mode == DELIVERY when dispatching"
    error_id: ERR_ORDER_NOT_DELIVERY
    http_status: 422
    applies_to: ["POST /orders/{id}/dispatch"]
    description: "Pickup orders are never dispatched to a courier network."

  - priority: 29
    category: state
    check: "The order has no DeliveryAssignment in state OFFERED or ACCEPTED"
    error_id: ERR_ASSIGNMENT_ALREADY_OPEN
    http_status: 409
    applies_to: ["POST /orders/{id}/dispatch"]
    description: "Re-dispatch is only allowed after the previous offer was declined or withdrawn."

  - priority: 30
    category: business_safety
    check: "courier_network_selection yields at least one eligible network"
    error_id: ERR_NO_ELIGIBLE_COURIER_NETWORK
    http_status: 409
    applies_to: ["POST /orders/{id}/dispatch"]
    description: "Inactive networks, marketplace-only networks on a direct channel and networks at concurrent-occupancy capacity are all excluded; an empty candidate set is an error, never a null assignment."

  - priority: 31
    category: state
    check: "DeliveryAssignment.state permits the requested courier operation"
    error_id: ERR_INVALID_ASSIGNMENT_STATE
    http_status: 409
    applies_to: ["POST /delivery-assignments/{id}/accept", "POST /delivery-assignments/{id}/decline", "POST /delivery-assignments/{id}/handoff", "POST /delivery-assignments/{id}/deliver"]
    description: "accept and decline require OFFERED; handoff requires ACCEPTED; deliver requires HANDED_OFF; DECLINED, WITHDRAWN and DELIVERED are terminal."

  - priority: 32
    category: business_safety
    check: "CourierNetwork occupancy still admits the assignment at acceptance time"
    error_id: ERR_NETWORK_AT_CAPACITY
    http_status: 409
    applies_to: ["POST /delivery-assignments/{id}/accept"]
    description: "Occupancy is re-checked at acceptance, excluding the assignment being accepted, because the clock may have advanced since the offer."

  - priority: 33
    category: state
    check: "Order.fulfillment_status == READY at handoff"
    error_id: ERR_ORDER_NOT_READY
    http_status: 409
    applies_to: ["POST /delivery-assignments/{id}/handoff"]
    description: "A courier cannot take handoff of food the kitchen has not marked ready."

  - priority: 34
    category: business_referential
    check: "Order.settlement_status != SETTLED"
    error_id: ERR_ORDER_ALREADY_SETTLED
    http_status: 409
    applies_to: ["POST /adjustments", "POST /adjustments/{id}/accept", "POST /adjustments/{id}/reverse"]
    description: "Money on a settled order is closed; refunds must be raised before settlement. Ranks ABOVE ERR_REFUND_EXCEEDS_COLLECTED."

  - priority: 35
    category: business_fiscal
    check: "For REFUND adjustments: refunded_total_cents + amount_cents <= Order.channel_collected_cents"
    error_id: ERR_REFUND_EXCEEDS_COLLECTED
    http_status: 422
    applies_to: ["POST /adjustments", "POST /adjustments/{id}/revise"]
    description: "A refund may never exceed what the channel actually collected, counting refunds already accepted. Ranks BELOW ERR_ORDER_ALREADY_SETTLED."

  - priority: 36
    category: state
    check: "Adjustment.state permits the requested adjustment operation"
    error_id: ERR_INVALID_ADJUSTMENT_STATE
    http_status: 409
    applies_to: ["POST /adjustments/{id}/submit", "POST /adjustments/{id}/request-revision", "POST /adjustments/{id}/revise", "POST /adjustments/{id}/accept", "POST /adjustments/{id}/reverse"]
    description: "submit requires DRAFT; request-revision and accept require CHANNEL_REVIEW; revise requires REVISION_REQUESTED; reverse requires ACCEPTED; REVERSED is terminal."

  - priority: 37
    category: business_safety
    check: "Adjustment.revision_round < MAX_REVISION_ROUNDS"
    error_id: ERR_REVISION_LIMIT_REACHED
    http_status: 409
    applies_to: ["POST /adjustments/{id}/request-revision"]
    description: "The channel may bounce an adjustment back at most MAX_REVISION_ROUNDS = 2 times; after that it must accept or leave it in review."

  - priority: 38
    category: business_temporal
    check: "period_start < period_end and period_end <= current logical clock"
    error_id: ERR_INVALID_PERIOD
    http_status: 422
    applies_to: ["POST /remittance-statements"]
    description: "A statement may only cover a closed past period; an inverted or future-ending period is rejected."

  - priority: 39
    category: state
    check: "RemittanceStatement.state permits the requested settlement operation"
    error_id: ERR_INVALID_STATEMENT_STATE
    http_status: 409
    applies_to: ["POST /remittance-statements/{id}/assign-orders", "POST /remittance-statements/{id}/reconcile", "POST /remittance-statements/{id}/dispute", "POST /remittance-statements/{id}/settle"]
    description: "assign-orders requires OPEN or DISPUTED; reconcile requires OPEN or DISPUTED; dispute requires RECONCILED; settle requires RECONCILED; SETTLED is terminal."

  - priority: 40
    category: business_referential
    check: "Every order in assign-orders belongs to the statement's channel (Order.channel_id == RemittanceStatement.channel_id), satisfies period_start <= Order.created_at < period_end, and has fulfillment_status in [READY, HANDED_OFF, DELIVERED]"
    error_id: ERR_ORDER_NOT_ELIGIBLE
    http_status: 422
    applies_to: ["POST /remittance-statements/{id}/assign-orders"]
    description: "Eligibility is all-or-nothing for the request: if any listed order fails, no order is assigned. Assignment state is NOT checked here; that is priority 41's job, so an order already on a statement yields ERR_ORDER_ALREADY_ASSIGNED."

  - priority: 41
    category: state
    check: "Order.settlement_status == SETTLEABLE for every order being assigned"
    error_id: ERR_ORDER_ALREADY_ASSIGNED
    http_status: 409
    applies_to: ["POST /remittance-statements/{id}/assign-orders"]
    description: "An order may belong to at most one statement at a time; a disputed statement releases its orders before they can be reassigned."

  - priority: 42
    category: business_referential
    check: "RemittanceStatement.order_count >= 1 at reconcile"
    error_id: ERR_STATEMENT_EMPTY
    http_status: 409
    applies_to: ["POST /remittance-statements/{id}/reconcile"]
    description: "An empty statement has nothing to reconcile."

  - priority: 43
    category: business_referential
    check: "RemittanceStatement.open_adjustment_count == 0 at reconcile"
    error_id: ERR_OPEN_ADJUSTMENTS_PRESENT
    http_status: 409
    applies_to: ["POST /remittance-statements/{id}/reconcile"]
    description: "Reconciliation is blocked while any adjustment on an assigned order is still DRAFT, CHANNEL_REVIEW or REVISION_REQUESTED, because the tier base would move afterwards."

  - priority: 44
    category: business_safety
    check: "Order.refunded_total_cents == 0 at cancel"
    error_id: ERR_ORDER_HAS_ACCEPTED_ADJUSTMENTS
    http_status: 409
    applies_to: ["POST /orders/{id}/cancel"]
    description: "An order carrying accepted refunds cannot be cancelled; the refunds must be reversed first so the money identity stays intact."

# =============================================================================
# Table 5: API Endpoint Table  (§1.5)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:

  # ------------------------------------------------------- logical clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the logical clock that every time-dependent rule reads. Default is 2026-08-01T00:00:00Z."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: "{ current_utc: datetime }"
    side_effects:
      - "The logical clock advances or rewinds; no entity is recomputed as a side effect"

  # --------------------------------------------------------------- Store ----
  - method: POST
    path: "/stores"
    description: "Register a store"
    roles: [PlatformAdmin]
    code: 201
    input: [brand_code, name, timezone_offset_minutes, base_prep_minutes, prep_capacity_per_bucket, pos_retry_limit, tablet_backlog_threshold]
    output: Store
    side_effects:
      - "throttle_state=PAUSED, active_menu_version_id=null"
      - "open_order_count=0, reserved_prep_slots=0, tablet_backlog_count=0"

  - method: GET
    path: "/stores/{id}"
    description: "Read a store"
    roles: [PlatformAdmin, StoreOperator, ChannelPartner, SettlementAnalyst]
    code: 200
    input: []
    output: Store
    side_effects: []

  - method: GET
    path: "/stores"
    description: "List stores, optionally filtered by the menu version they are currently on or by throttle posture"
    roles: [PlatformAdmin, StoreOperator, ChannelPartner, SettlementAnalyst]
    code: 200
    input: ["brand_code?", "active_menu_version_id?", "throttle_state?", "limit?", "offset?"]
    output: Store[]
    side_effects: []

  - method: PATCH
    path: "/stores/{id}"
    description: "Update mutable store capacity configuration"
    roles: [PlatformAdmin]
    code: 200
    input: ["base_prep_minutes?", "prep_capacity_per_bucket?", "pos_retry_limit?", "tablet_backlog_threshold?"]
    output: Store
    side_effects:
      - "increments Store.version by 1"
      - "Does NOT recompute throttle_state; POST /stores/{id}/recompute-throttle does that"

  - method: POST
    path: "/stores/{id}/hour-windows"
    description: "Add an operating-hours window for one local day"
    roles: [PlatformAdmin, StoreOperator]
    code: 201
    input: [day_of_week, opens_at_minute, closes_at_minute]
    output: StoreHourWindow
    side_effects:
      - "window_minutes = closes_at_minute - opens_at_minute"
      - "Rejected with ERR_HOUR_WINDOW_OVERLAP when it overlaps an existing window for the same day_of_week"

  - method: GET
    path: "/stores/{id}/hour-windows"
    description: "List a store's operating-hours windows"
    roles: [PlatformAdmin, StoreOperator, ChannelPartner]
    code: 200
    input: ["day_of_week?", "limit?", "offset?"]
    output: StoreHourWindow[]
    side_effects: []

  - method: POST
    path: "/stores/{id}/publish-menu"
    description: "Publish a brand MenuVersion to this store, rebuilding every ChannelListing"
    roles: [StoreOperator]
    code: 200
    input: [menu_version_id, expected_store_version]
    output: Store
    side_effects:
      - "increments Store.version by 1"
      - "Store.active_menu_version_id = menu_version_id; Store.last_published_at = clock"
      - "One ChannelListing per (MenuItem, Channel) with price_cents from channel_listing_price; suppressed=false, eighty_sixed=false"
      - "Listings of the previously active version are removed; Channel.listing_count recomputed"
      - "Previous MenuVersion.published_store_count decremented and it moves to SUPERSEDED when the count reaches 0; new MenuVersion.published_store_count incremented"
      - "Store.throttle_state moves PAUSED->NORMAL on the first successful publish"

  - method: POST
    path: "/stores/{id}/recompute-throttle"
    description: "Re-derive the store's throttle posture from current reserved capacity and cascade listing availability"
    roles: [StoreOperator]
    code: 200
    input: []
    output: Store
    side_effects:
      - "throttle_state set to the store_throttle_state target"
      - "Every ChannelListing of the store re-derives availability_state through listing_availability_state"

  - method: GET
    path: "/stores/{id}/quote"
    description: "Provisional quote a channel may promise right now (PROVISIONAL variant of quote_time_calculation)"
    roles: [StoreOperator, ChannelPartner]
    code: 200
    input: [channel_id, fulfillment_mode]
    output: "{ store_id: string, channel_id: string, variant: string, load_count: integer, prep_minutes: integer, travel_minutes: integer, total_minutes: integer, bucket_index: integer, bucket_load: integer, quoted_ready_at: datetime }"
    side_effects: []

  # ------------------------------------------------------------- Channel ----
  - method: POST
    path: "/channels"
    description: "Register an ordering channel with its markup, fee, settlement and policy configuration"
    roles: [PlatformAdmin]
    code: 201
    input: [code, name, channel_type, markup_bps, rounding_mode, service_fee_cents, commission_bps, settlement_mode, eighty_six_policy, throttle_policy, adjustment_review_mode, "accepts_delivery?"]
    output: Channel
    side_effects:
      - "listing_count=0"
      - "accepts_delivery defaults to true"

  - method: GET
    path: "/channels/{id}"
    description: "Read a channel configuration"
    roles: [PlatformAdmin, StoreOperator, ChannelPartner, SettlementAnalyst]
    code: 200
    input: []
    output: Channel
    side_effects: []

  - method: PATCH
    path: "/channels/{id}"
    description: "Update channel markup, fee, settlement or policy configuration under optimistic concurrency"
    roles: [ChannelPartner, PlatformAdmin]
    code: 200
    input: [expected_channel_version, "markup_bps?", "rounding_mode?", "service_fee_cents?", "commission_bps?", "settlement_mode?", "eighty_six_policy?", "throttle_policy?", "adjustment_review_mode?", "accepts_delivery?"]
    output: Channel
    side_effects:
      - "increments Channel.version by 1"
      - "Existing ChannelListing.price_cents values are NOT repriced; only the next publish-menu applies the new markup"

  # --------------------------------------------------------- MenuVersion ----
  - method: POST
    path: "/menu-versions"
    description: "Create a draft brand menu version"
    roles: [PlatformAdmin]
    code: 201
    input: [brand_code, version_label]
    output: MenuVersion
    side_effects:
      - "state=DRAFT, item_count=0, published_store_count=0, published_at=null"

  - method: GET
    path: "/menu-versions/{id}"
    description: "Read a menu version"
    roles: [PlatformAdmin, StoreOperator, ChannelPartner]
    code: 200
    input: []
    output: MenuVersion
    side_effects: []

  - method: POST
    path: "/menu-versions/{id}/items"
    description: "Add a single-source item to a draft menu version"
    roles: [PlatformAdmin]
    code: 201
    input: [sku, name, base_price_cents, tax_bps, "is_delivery_eligible?"]
    output: MenuItem
    side_effects:
      - "MenuVersion.item_count incremented"
      - "Rejected with ERR_MENU_VERSION_LOCKED unless the version is DRAFT"

  - method: GET
    path: "/menu-versions/{id}/items"
    description: "List the items of a menu version"
    roles: [PlatformAdmin, StoreOperator, ChannelPartner]
    code: 200
    input: ["sku?", "limit?", "offset?"]
    output: MenuItem[]
    side_effects: []

  - method: POST
    path: "/menu-versions/{id}/finalize"
    description: "Freeze a draft menu version so stores may publish it"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: MenuVersion
    side_effects:
      - "state DRAFT->PUBLISHED; published_at = clock"
      - "Items become immutable"

  # ------------------------------------------------------ ChannelListing ----
  - method: GET
    path: "/channel-listings/{id}"
    description: "Read one channel listing"
    roles: [PlatformAdmin, StoreOperator, ChannelPartner, SettlementAnalyst]
    code: 200
    input: []
    output: ChannelListing
    side_effects: []

  - method: GET
    path: "/channel-listings"
    description: "List channel listings filtered by store, channel, item or availability"
    roles: [PlatformAdmin, StoreOperator, ChannelPartner, SettlementAnalyst]
    code: 200
    input: ["store_id?", "channel_id?", "menu_item_id?", "sku?", "availability_state?", "limit?", "offset?"]
    output: ChannelListing[]
    side_effects: []

  - method: PATCH
    path: "/channel-listings/{id}"
    description: "Channel-partner suppression of a single item on a single channel"
    roles: [ChannelPartner]
    code: 200
    input: [suppressed]
    output: ChannelListing
    side_effects:
      - "increments ChannelListing.version by 1"
      - "availability_state re-derived through listing_availability_state; suppression outranks 86 and throttle"

  # ---------------------------------------------------- AvailabilityEvent ---
  - method: POST
    path: "/availability-events"
    description: "Record an item 86 or restore at a store and propagate it across channels in near real time"
    roles: [StoreOperator, ChannelPartner]
    code: 201
    input: [store_id, menu_item_id, event_type, "actor_channel_id?"]
    output: AvailabilityEvent
    side_effects:
      - "effective_at = clock"
      - "Every ChannelListing for (store_id, menu_item_id) on a HONOR_86 channel updates eighty_sixed and re-derives availability_state; propagated_listing_count counts them"
      - "Listings on IGNORE_86 channels are untouched; skipped_listing_count counts them"
      - "For EIGHTY_SIX: every Order at the store with injection_status PENDING and a line for the item on a HONOR_86 channel moves to INJECTION_HELD, releasing one reserved prep slot each; held_order_count counts them; their OFFERED DeliveryAssignments move to WITHDRAWN"
      - "MenuVersion may bubble PUBLISHED->EXHAUSTED or EXHAUSTED->PUBLISHED"

  - method: GET
    path: "/availability-events/{id}"
    description: "Read one availability event"
    roles: [PlatformAdmin, StoreOperator, ChannelPartner]
    code: 200
    input: []
    output: AvailabilityEvent
    side_effects: []

  - method: GET
    path: "/availability-events"
    description: "List availability events, newest last, filtered by store, item or reporting channel"
    roles: [PlatformAdmin, StoreOperator, ChannelPartner]
    code: 200
    input: ["store_id?", "menu_item_id?", "actor_channel_id?", "event_type?", "limit?", "offset?"]
    output: AvailabilityEvent[]
    side_effects: []

  # --------------------------------------------------------------- Order ----
  - method: POST
    path: "/orders"
    description: "Inject a digital order from a channel into the middleware"
    roles: [ChannelPartner]
    code: 201
    input: [store_id, channel_id, external_ref, fulfillment_mode, lines, "tip_cents?"]
    output: Order
    side_effects:
      - "menu_version_id = Store.active_menu_version_id"
      - "One OrderLine per entry in lines, resolved against the store's ChannelListings for the channel; unit_price_cents, base_price_cents and tax_bps snapshotted"
      - "order_channel_totals computed: subtotal_cents, markup_cents, tax_cents, service_fee_cents, commission_cents, channel_collected_cents, brand_net_cents"
      - "bucket_index and bucket_load from capacity_bucket_load; admission is rejected when the bucket is full"
      - "promised_ready_at pinned from the CONFIRMED variant of quote_time_calculation and never recomputed"
      - "injection_status=PENDING, fulfillment_status=PREPARING, settlement_status=SETTLEABLE, refunded_total_cents=0"
      - "Store.open_order_count and Store.reserved_prep_slots each incremented by 1"

  - method: GET
    path: "/orders/{id}"
    description: "Read an order with its money and status breakdown"
    roles: [PlatformAdmin, StoreOperator, ChannelPartner, SettlementAnalyst]
    code: 200
    input: []
    output: Order
    side_effects: []

  - method: GET
    path: "/orders"
    description: "List orders filtered by store, channel, menu version, statement or settlement status"
    roles: [PlatformAdmin, StoreOperator, ChannelPartner, SettlementAnalyst]
    code: 200
    input: ["store_id?", "channel_id?", "menu_version_id?", "remittance_statement_id?", "settlement_status?", "injection_status?", "fulfillment_status?", "limit?", "offset?"]
    output: Order[]
    side_effects: []

  - method: GET
    path: "/orders/{id}/lines"
    description: "List the lines of an order with their snapshotted prices and per-line tax"
    roles: [PlatformAdmin, StoreOperator, ChannelPartner, SettlementAnalyst]
    code: 200
    input: ["limit?", "offset?"]
    output: OrderLine[]
    side_effects: []

  - method: POST
    path: "/orders/{id}/inject"
    description: "Attempt to inject the order into the point-of-sale, reporting the adapter result"
    roles: [StoreOperator]
    code: 200
    input: [pos_result_code]
    output: Order
    side_effects:
      - "A PosInjectionAttempt child is created with attempt_number and outcome"
      - "Order.injection_attempt_count incremented"
      - "OK -> injection_status ACCEPTED (and TABLET_FALLBACK -> ACCEPTED decrements Store.tablet_backlog_count)"
      - "Non-OK below the retry limit -> injection_status stays PENDING"
      - "Non-OK at the retry limit -> TABLET_FALLBACK (Store.tablet_backlog_count incremented) when the backlog threshold allows, otherwise FAILED with fulfillment_status=CANCELLED, one reserved prep slot and one open order released, and open assignments WITHDRAWN"

  - method: GET
    path: "/orders/{id}/injection-attempts"
    description: "List the point-of-sale injection attempts recorded for an order"
    roles: [PlatformAdmin, StoreOperator]
    code: 200
    input: ["limit?", "offset?"]
    output: PosInjectionAttempt[]
    side_effects: []

  - method: POST
    path: "/orders/{id}/resume-injection"
    description: "Release a 86-held order back into the injection queue"
    roles: [StoreOperator]
    code: 200
    input: []
    output: Order
    side_effects:
      - "injection_status INJECTION_HELD->PENDING"
      - "Store.reserved_prep_slots incremented by 1"
      - "Rejected when any line is still unavailable, the store is PAUSED or the bucket is full"

  - method: POST
    path: "/orders/{id}/ready"
    description: "Mark the order ready in the kitchen"
    roles: [StoreOperator]
    code: 200
    input: []
    output: Order
    side_effects:
      - "fulfillment_status PREPARING->READY"
      - "Store.reserved_prep_slots decremented by 1 (open_order_count unchanged)"

  - method: POST
    path: "/orders/{id}/cancel"
    description: "Cancel an order that has not been settled and carries no accepted refunds"
    roles: [StoreOperator, ChannelPartner]
    code: 200
    input: [reason_code]
    output: Order
    side_effects:
      - "fulfillment_status -> CANCELLED"
      - "Store.open_order_count decremented; reserved_prep_slots decremented unless it was already released by READY or INJECTION_HELD"
      - "Store.tablet_backlog_count decremented when injection_status was TABLET_FALLBACK"
      - "Every OFFERED or ACCEPTED DeliveryAssignment moves to WITHDRAWN with occupancy_until set to the clock"

  # ------------------------------------------------------- CourierNetwork ---
  - method: POST
    path: "/courier-networks"
    description: "Register a courier or marketplace delivery network"
    roles: [PlatformAdmin]
    code: 201
    input: [code, name, network_type, priority_rank, per_delivery_fee_cents, handoff_sla_seconds, dispatch_buffer_seconds, max_concurrent_assignments, "is_active?"]
    output: CourierNetwork
    side_effects:
      - "open_assignment_count=0, penalty_accrued_cents=0"
      - "is_active defaults to true"

  - method: GET
    path: "/courier-networks/{id}"
    description: "Read a delivery network including its live occupancy and accrued penalties"
    roles: [PlatformAdmin, StoreOperator, CourierNetworkAgent]
    code: 200
    input: []
    output: CourierNetwork
    side_effects: []

  # ---------------------------------------------------- DeliveryAssignment --
  - method: POST
    path: "/orders/{id}/dispatch"
    description: "Offer the delivery to the best eligible network per courier_network_selection"
    roles: [StoreOperator]
    code: 201
    input: []
    output: DeliveryAssignment
    side_effects:
      - "courier_network_id chosen by courier_network_selection; state=OFFERED, offered_at=clock"
      - "occupancy_until = offered_at + handoff_sla_seconds + dispatch_buffer_seconds"
      - "CourierNetwork.open_assignment_count recomputed"
      - "Rejected with ERR_NO_ELIGIBLE_COURIER_NETWORK when the candidate set is empty"

  - method: GET
    path: "/delivery-assignments/{id}"
    description: "Read a delivery assignment with its SLA and penalty fields"
    roles: [PlatformAdmin, StoreOperator, CourierNetworkAgent, SettlementAnalyst]
    code: 200
    input: []
    output: DeliveryAssignment
    side_effects: []

  - method: GET
    path: "/delivery-assignments"
    description: "List delivery assignments filtered by order, network or state"
    roles: [PlatformAdmin, StoreOperator, CourierNetworkAgent, SettlementAnalyst]
    code: 200
    input: ["order_id?", "courier_network_id?", "state?", "limit?", "offset?"]
    output: DeliveryAssignment[]
    side_effects: []

  - method: POST
    path: "/delivery-assignments/{id}/accept"
    description: "Courier network accepts the offer"
    roles: [CourierNetworkAgent]
    code: 200
    input: []
    output: DeliveryAssignment
    side_effects:
      - "state OFFERED->ACCEPTED; accepted_at=clock"
      - "handoff_deadline_at = accepted_at + CourierNetwork.handoff_sla_seconds"
      - "occupancy_until = handoff_deadline_at + dispatch_buffer_seconds"
      - "delivery_fee_cents = CourierNetwork.per_delivery_fee_cents"
      - "Occupancy re-checked excluding this assignment; ERR_NETWORK_AT_CAPACITY when the network is full"

  - method: POST
    path: "/delivery-assignments/{id}/decline"
    description: "Courier network declines the offer, freeing the order for re-dispatch"
    roles: [CourierNetworkAgent]
    code: 200
    input: ["reason_code?"]
    output: DeliveryAssignment
    side_effects:
      - "state OFFERED->DECLINED; occupancy_until = clock so the network's capacity is released immediately"
      - "CourierNetwork.open_assignment_count recomputed"

  - method: POST
    path: "/delivery-assignments/{id}/handoff"
    description: "Courier takes physical handoff; SLA lateness and penalty are evaluated here"
    roles: [CourierNetworkAgent]
    code: 200
    input: []
    output: DeliveryAssignment
    side_effects:
      - "state ACCEPTED->HANDED_OFF; handoff_at=clock"
      - "handoff_lateness_seconds, sla_breached and handoff_penalty_cents from handoff_sla_penalty"
      - "CourierNetwork.penalty_accrued_cents increased by handoff_penalty_cents"
      - "Order.fulfillment_status READY->HANDED_OFF; Store.open_order_count decremented"

  - method: POST
    path: "/delivery-assignments/{id}/deliver"
    description: "Courier confirms delivery"
    roles: [CourierNetworkAgent]
    code: 200
    input: []
    output: DeliveryAssignment
    side_effects:
      - "state HANDED_OFF->DELIVERED; delivered_at=clock"
      - "Order.fulfillment_status HANDED_OFF->DELIVERED"

  # ----------------------------------------------------------- Adjustment ---
  - method: POST
    path: "/adjustments"
    description: "Propose a refund or fee credit that will route back to the originating channel"
    roles: [SettlementAnalyst]
    code: 201
    input: [order_id, adjustment_type, amount_cents, reason_code, expected_order_version]
    output: Adjustment
    side_effects:
      - "increments Order.version by 1"
      - "channel_id copied from the order; state=DRAFT, revision_round=0"
      - "commission_relief_cents = round_half_up(amount_cents * Channel.commission_bps / 10000) for REFUND, 0 for FEE_CREDIT"
      - "proposed_by_user_id = X-User-ID"
      - "RemittanceStatement.open_adjustment_count recomputed when the order is already assigned"

  - method: GET
    path: "/adjustments/{id}"
    description: "Read an adjustment"
    roles: [PlatformAdmin, ChannelPartner, SettlementAnalyst]
    code: 200
    input: []
    output: Adjustment
    side_effects: []

  - method: GET
    path: "/adjustments"
    description: "List adjustments filtered by order, channel, statement or state"
    roles: [PlatformAdmin, ChannelPartner, SettlementAnalyst]
    code: 200
    input: ["order_id?", "channel_id?", "remittance_statement_id?", "state?", "adjustment_type?", "limit?", "offset?"]
    output: Adjustment[]
    side_effects: []

  - method: POST
    path: "/adjustments/{id}/submit"
    description: "Route the adjustment to the channel, or accept it immediately on AUTO_ACCEPT channels"
    roles: [SettlementAnalyst]
    code: 200
    input: []
    output: Adjustment
    side_effects:
      - "CHANNEL_REVIEW when Channel.adjustment_review_mode == CHANNEL_REVIEW"
      - "ACCEPTED with the full acceptance money cascade when Channel.adjustment_review_mode == AUTO_ACCEPT"

  - method: POST
    path: "/adjustments/{id}/request-revision"
    description: "Channel bounces the adjustment back for revision"
    roles: [ChannelPartner]
    code: 200
    input: ["note?"]
    output: Adjustment
    side_effects:
      - "state CHANNEL_REVIEW->REVISION_REQUESTED"
      - "Rejected with ERR_REVISION_LIMIT_REACHED once revision_round == MAX_REVISION_ROUNDS"

  - method: POST
    path: "/adjustments/{id}/revise"
    description: "Analyst revises the amount and resubmits it to the channel"
    roles: [SettlementAnalyst]
    code: 200
    input: ["amount_cents?", "reason_code?"]
    output: Adjustment
    side_effects:
      - "state REVISION_REQUESTED->CHANNEL_REVIEW; revision_round incremented"
      - "amount_cents replaced when supplied and commission_relief_cents recomputed; the refund ceiling is re-checked"

  - method: POST
    path: "/adjustments/{id}/accept"
    description: "Channel accepts the adjustment, applying it to the order's money"
    roles: [ChannelPartner]
    code: 200
    input: []
    output: Adjustment
    side_effects:
      - "state -> ACCEPTED; accepted_at=clock"
      - "Order.refunded_total_cents += amount_cents"
      - "Order.commission_cents -= commission_relief_cents"
      - "Order.brand_net_cents -= (amount_cents - commission_relief_cents)"
      - "When the order already belongs to a statement, the adjustment inherits Order.remittance_statement_id and the statement's aggregates are recomputed by remittance_settlement"

  - method: POST
    path: "/adjustments/{id}/reverse"
    description: "A second analyst reverses an accepted adjustment, undoing every money effect"
    roles: [SettlementAnalyst]
    code: 200
    input: [reason_code]
    output: Adjustment
    side_effects:
      - "state ACCEPTED->REVERSED; reversed_at=clock"
      - "Order.refunded_total_cents, commission_cents and brand_net_cents restored to their pre-acceptance values"
      - "Statement aggregates recomputed; ERR_SEGREGATION_OF_DUTIES when X-User-ID == proposed_by_user_id"

  # -------------------------------------------------- RemittanceStatement ---
  - method: POST
    path: "/remittance-statements"
    description: "Open a settlement statement for a channel over a closed past period"
    roles: [SettlementAnalyst]
    code: 201
    input: [channel_id, period_start, period_end]
    output: RemittanceStatement
    side_effects:
      - "state=OPEN; every aggregate 0; tier=TIER_1; reconciled_by_user_id=null"

  - method: GET
    path: "/remittance-statements/{id}"
    description: "Read a statement with its tier and settlement figures"
    roles: [PlatformAdmin, ChannelPartner, SettlementAnalyst]
    code: 200
    input: []
    output: RemittanceStatement
    side_effects: []

  - method: GET
    path: "/remittance-statements"
    description: "List statements filtered by channel or state"
    roles: [PlatformAdmin, ChannelPartner, SettlementAnalyst]
    code: 200
    input: ["channel_id?", "state?", "limit?", "offset?"]
    output: RemittanceStatement[]
    side_effects: []

  - method: POST
    path: "/remittance-statements/{id}/assign-orders"
    description: "Attach eligible fulfilled orders to the statement, all-or-nothing"
    roles: [SettlementAnalyst]
    code: 200
    input: [order_ids]
    output: RemittanceStatement
    side_effects:
      - "Each order's settlement_status SETTLEABLE->STATEMENT_ASSIGNED and remittance_statement_id set"
      - "Every ACCEPTED Adjustment on those orders is assigned to the statement"
      - "order_count, gross_sales_cents, adjustment_total_cents, tier_base_cents, tier, commission_cents, rebate_cents and net_payable_cents recomputed by remittance_settlement"
      - "open_adjustment_count recomputed"

  - method: GET
    path: "/remittance-statements/{id}/preview"
    description: "Settlement preview showing both settlement-mode variants side by side without persisting anything"
    roles: [PlatformAdmin, ChannelPartner, SettlementAnalyst]
    code: 200
    input: []
    output: "{ statement_id: string, settlement_mode: string, gross_sales_cents: integer, adjustment_total_cents: integer, tier_base_cents: integer, tier: string, effective_commission_bps: integer, commission_cents: integer, rebate_cents: integer, net_payable_cents: integer, gross_mode_net_payable_cents: integer, net_mode_net_payable_cents: integer }"
    side_effects: []

  - method: POST
    path: "/remittance-statements/{id}/reconcile"
    description: "Freeze the statement's figures once no adjustment is still open"
    roles: [SettlementAnalyst]
    code: 200
    input: []
    output: RemittanceStatement
    side_effects:
      - "state OPEN|DISPUTED -> RECONCILED; reconciled_by_user_id = X-User-ID"
      - "Aggregates recomputed and frozen by remittance_settlement"

  - method: POST
    path: "/remittance-statements/{id}/dispute"
    description: "Channel disputes the reconciled statement, releasing every assigned order"
    roles: [ChannelPartner]
    code: 200
    input: [reason_code]
    output: RemittanceStatement
    side_effects:
      - "state RECONCILED->DISPUTED"
      - "Every assigned Order returns to SETTLEABLE with remittance_statement_id cleared; adjustments unassigned"
      - "order_count and every money aggregate reset to 0; tier reset to TIER_1"

  - method: POST
    path: "/remittance-statements/{id}/settle"
    description: "A second analyst settles the reconciled statement"
    roles: [SettlementAnalyst]
    code: 200
    input: []
    output: RemittanceStatement
    side_effects:
      - "state RECONCILED->SETTLED; settled_at=clock"
      - "Every assigned Order.settlement_status -> SETTLED"
      - "ERR_SEGREGATION_OF_DUTIES when X-User-ID == reconciled_by_user_id"

# =============================================================================
# Table 6: Error Code Catalog  (§1.6)
# =============================================================================
errors:

  # --- auth / request -------------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http_status: 401
    condition: "X-Role header absent or not a declared role"
    applies_to: ["all"]
  - id: ERR_UNAUTHORIZED
    http_status: 403
    condition: "X-Role is not listed in the endpoint's roles"
    applies_to: ["all"]
  - id: ERR_FORBIDDEN_SCOPE
    http_status: 403
    condition: "An entity-backed role addresses a resource outside its own Store, Channel or CourierNetwork"
    applies_to: ["all endpoints reachable by StoreOperator, ChannelPartner or CourierNetworkAgent"]
  - id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    condition: "X-User-ID equals Adjustment.proposed_by_user_id on reverse, or RemittanceStatement.reconciled_by_user_id on settle"
    applies_to: ["POST /adjustments/{id}/reverse", "POST /remittance-statements/{id}/settle"]
  - id: ERR_INVALID_REQUEST
    http_status: 400
    condition: "Missing required field, wrong type, unknown enum value, out-of-range integer, empty lines array, or pagination outside limit 1..100 / offset >= 0"
    applies_to: ["all"]

  # --- existence ------------------------------------------------------------
  - id: ERR_STORE_NOT_FOUND
    http_status: 404
    condition: "storeId or store_id does not resolve"
    applies_to: ["/stores/*", "POST /orders", "POST /availability-events"]
  - id: ERR_CHANNEL_NOT_FOUND
    http_status: 404
    condition: "channelId, channel_id or actor_channel_id does not resolve"
    applies_to: ["/channels/*", "POST /orders", "POST /availability-events", "POST /remittance-statements", "GET /stores/{id}/quote"]
  - id: ERR_MENU_VERSION_NOT_FOUND
    http_status: 404
    condition: "menuVersionId or menu_version_id does not resolve"
    applies_to: ["/menu-versions/*", "POST /stores/{id}/publish-menu"]
  - id: ERR_MENU_ITEM_NOT_FOUND
    http_status: 404
    condition: "menu_item_id does not resolve"
    applies_to: ["POST /availability-events"]
  - id: ERR_LISTING_NOT_FOUND
    http_status: 404
    condition: "listingId does not resolve"
    applies_to: ["GET /channel-listings/{id}", "PATCH /channel-listings/{id}"]
  - id: ERR_AVAILABILITY_EVENT_NOT_FOUND
    http_status: 404
    condition: "eventId does not resolve"
    applies_to: ["GET /availability-events/{id}"]
  - id: ERR_ORDER_NOT_FOUND
    http_status: 404
    condition: "orderId, order_id or an entry of order_ids does not resolve"
    applies_to: ["/orders/*", "POST /adjustments", "POST /remittance-statements/{id}/assign-orders"]
  - id: ERR_COURIER_NETWORK_NOT_FOUND
    http_status: 404
    condition: "networkId does not resolve"
    applies_to: ["GET /courier-networks/{id}"]
  - id: ERR_ASSIGNMENT_NOT_FOUND
    http_status: 404
    condition: "assignmentId does not resolve"
    applies_to: ["/delivery-assignments/*"]
  - id: ERR_ADJUSTMENT_NOT_FOUND
    http_status: 404
    condition: "adjustmentId does not resolve"
    applies_to: ["/adjustments/*"]
  - id: ERR_STATEMENT_NOT_FOUND
    http_status: 404
    condition: "statementId does not resolve"
    applies_to: ["/remittance-statements/*"]

  # --- optimistic concurrency ----------------------------------------------
  - id: ERR_STALE_STORE_VERSION
    http_status: 412
    condition: "expected_store_version != Store.version"
    applies_to: ["POST /stores/{id}/publish-menu"]
  - id: ERR_STALE_ORDER_VERSION
    http_status: 412
    condition: "expected_order_version != Order.version"
    applies_to: ["POST /adjustments"]
  - id: ERR_STALE_CHANNEL_VERSION
    http_status: 412
    condition: "expected_channel_version != Channel.version"
    applies_to: ["PATCH /channels/{id}"]

  # --- uniqueness -----------------------------------------------------------
  - id: ERR_DUPLICATE_CHANNEL_CODE
    http_status: 409
    condition: "Channel.code already exists"
    applies_to: ["POST /channels"]
  - id: ERR_DUPLICATE_NETWORK_CODE
    http_status: 409
    condition: "CourierNetwork.code already exists"
    applies_to: ["POST /courier-networks"]
  - id: ERR_DUPLICATE_VERSION_LABEL
    http_status: 409
    condition: "MenuVersion.version_label already exists for the brand_code"
    applies_to: ["POST /menu-versions"]
  - id: ERR_DUPLICATE_SKU
    http_status: 409
    condition: "MenuItem.sku already exists in the menu version"
    applies_to: ["POST /menu-versions/{id}/items"]
  - id: ERR_DUPLICATE_EXTERNAL_REF
    http_status: 409
    condition: "Order.external_ref already exists for the channel"
    applies_to: ["POST /orders"]

  # --- menu publishing ------------------------------------------------------
  - id: ERR_MENU_VERSION_LOCKED
    http_status: 409
    condition: "MenuVersion.state != DRAFT when adding an item or when finalizing"
    applies_to: ["POST /menu-versions/{id}/items", "POST /menu-versions/{id}/finalize"]
  - id: ERR_MENU_VERSION_EMPTY
    http_status: 409
    condition: "item_count == 0 at finalize"
    applies_to: ["POST /menu-versions/{id}/finalize"]
  - id: ERR_MENU_VERSION_NOT_PUBLISHED
    http_status: 409
    condition: "MenuVersion.state is DRAFT or SUPERSEDED at publish-menu"
    applies_to: ["POST /stores/{id}/publish-menu"]
  - id: ERR_BRAND_MISMATCH
    http_status: 422
    condition: "MenuVersion.brand_code != Store.brand_code"
    applies_to: ["POST /stores/{id}/publish-menu"]
  - id: ERR_STORE_HOURS_MISSING
    http_status: 409
    condition: "Store has no StoreHourWindow at publish-menu"
    applies_to: ["POST /stores/{id}/publish-menu"]
  - id: ERR_HOUR_WINDOW_OVERLAP
    http_status: 409
    condition: "New window's half-open interval overlaps an existing window for the same day_of_week"
    applies_to: ["POST /stores/{id}/hour-windows"]

  # --- ordering gates -------------------------------------------------------
  - id: ERR_STORE_MENU_NOT_PUBLISHED
    http_status: 409
    condition: "Store.active_menu_version_id is null"
    applies_to: ["POST /orders", "GET /stores/{id}/quote", "POST /availability-events"]
  - id: ERR_STORE_CLOSED
    http_status: 422
    condition: "The logical clock falls outside every StoreHourWindow for the local day_of_week"
    applies_to: ["POST /orders", "GET /stores/{id}/quote"]
  - id: ERR_STORE_PAUSED
    http_status: 409
    condition: "Store.throttle_state == PAUSED"
    applies_to: ["POST /orders", "POST /orders/{id}/resume-injection"]
  - id: ERR_CHANNEL_DELIVERY_UNSUPPORTED
    http_status: 422
    condition: "fulfillment_mode == DELIVERY on a channel whose accepts_delivery is false"
    applies_to: ["POST /orders"]
  - id: ERR_SKU_NOT_LISTED
    http_status: 422
    condition: "A line sku has no ChannelListing for (store_id, channel_id)"
    applies_to: ["POST /orders"]
  - id: ERR_ITEM_NOT_AVAILABLE
    http_status: 409
    condition: "A resolved listing's availability_state is SUPPRESSED, EIGHTY_SIXED or THROTTLE_SUPPRESSED"
    applies_to: ["POST /orders"]
  - id: ERR_ITEM_NOT_DELIVERY_ELIGIBLE
    http_status: 422
    condition: "A DELIVERY order contains an item whose is_delivery_eligible is false"
    applies_to: ["POST /orders"]
  - id: ERR_CAPACITY_BUCKET_FULL
    http_status: 409
    condition: "bucket_load >= Store.prep_capacity_per_bucket"
    applies_to: ["POST /orders", "POST /orders/{id}/resume-injection"]
  - id: ERR_QUOTE_WINDOW_EXCEEDED
    http_status: 422
    condition: "quote_time_calculation total_minutes > MAX_QUOTE_MINUTES"
    applies_to: ["POST /orders", "GET /stores/{id}/quote"]

  # --- injection and fulfillment -------------------------------------------
  - id: ERR_INVALID_INJECTION_STATE
    http_status: 409
    condition: "inject called when injection_status is INJECTION_HELD, ACCEPTED or FAILED; resume-injection called when it is not INJECTION_HELD"
    applies_to: ["POST /orders/{id}/inject", "POST /orders/{id}/resume-injection"]
  - id: ERR_ITEM_STILL_UNAVAILABLE
    http_status: 409
    condition: "resume-injection while at least one line's listing is not AVAILABLE"
    applies_to: ["POST /orders/{id}/resume-injection"]
  - id: ERR_INVALID_ORDER_STATE
    http_status: 409
    condition: "fulfillment_status does not permit ready, cancel or dispatch"
    applies_to: ["POST /orders/{id}/ready", "POST /orders/{id}/cancel", "POST /orders/{id}/dispatch"]
  - id: ERR_ORDER_NOT_INJECTED
    http_status: 409
    condition: "injection_status is not ACCEPTED or TABLET_FALLBACK"
    applies_to: ["POST /orders/{id}/ready", "POST /orders/{id}/dispatch"]
  - id: ERR_ORDER_HAS_ACCEPTED_ADJUSTMENTS
    http_status: 409
    condition: "cancel while Order.refunded_total_cents > 0"
    applies_to: ["POST /orders/{id}/cancel"]

  # --- dispatch and delivery ------------------------------------------------
  - id: ERR_ORDER_NOT_DELIVERY
    http_status: 422
    condition: "dispatch on a PICKUP order"
    applies_to: ["POST /orders/{id}/dispatch"]
  - id: ERR_ASSIGNMENT_ALREADY_OPEN
    http_status: 409
    condition: "dispatch while a DeliveryAssignment for the order is OFFERED or ACCEPTED"
    applies_to: ["POST /orders/{id}/dispatch"]
  - id: ERR_NO_ELIGIBLE_COURIER_NETWORK
    http_status: 409
    condition: "courier_network_selection candidate set is empty"
    applies_to: ["POST /orders/{id}/dispatch"]
  - id: ERR_INVALID_ASSIGNMENT_STATE
    http_status: 409
    condition: "accept/decline outside OFFERED, handoff outside ACCEPTED, deliver outside HANDED_OFF"
    applies_to: ["/delivery-assignments/{id}/*"]
  - id: ERR_NETWORK_AT_CAPACITY
    http_status: 409
    condition: "At acceptance, the network's occupancy count excluding this assignment already equals max_concurrent_assignments"
    applies_to: ["POST /delivery-assignments/{id}/accept"]
  - id: ERR_ORDER_NOT_READY
    http_status: 409
    condition: "handoff while Order.fulfillment_status != READY"
    applies_to: ["POST /delivery-assignments/{id}/handoff"]

  # --- adjustments ----------------------------------------------------------
  - id: ERR_ORDER_ALREADY_SETTLED
    http_status: 409
    condition: "Order.settlement_status == SETTLED"
    applies_to: ["POST /adjustments", "POST /adjustments/{id}/accept", "POST /adjustments/{id}/reverse"]
  - id: ERR_REFUND_EXCEEDS_COLLECTED
    http_status: 422
    condition: "refunded_total_cents + amount_cents > Order.channel_collected_cents for a REFUND"
    applies_to: ["POST /adjustments", "POST /adjustments/{id}/revise"]
  - id: ERR_INVALID_ADJUSTMENT_STATE
    http_status: 409
    condition: "The adjustment's state does not permit submit, request-revision, revise, accept or reverse"
    applies_to: ["/adjustments/{id}/*"]
  - id: ERR_REVISION_LIMIT_REACHED
    http_status: 409
    condition: "request-revision while revision_round == MAX_REVISION_ROUNDS"
    applies_to: ["POST /adjustments/{id}/request-revision"]

  # --- remittance -----------------------------------------------------------
  - id: ERR_INVALID_PERIOD
    http_status: 422
    condition: "period_start >= period_end, or period_end is after the logical clock"
    applies_to: ["POST /remittance-statements"]
  - id: ERR_INVALID_STATEMENT_STATE
    http_status: 409
    condition: "The statement's state does not permit assign-orders, reconcile, dispute or settle"
    applies_to: ["/remittance-statements/{id}/*"]
  - id: ERR_ORDER_NOT_ELIGIBLE
    http_status: 422
    condition: "An order's channel, period membership or fulfillment_status disqualifies it from the statement"
    applies_to: ["POST /remittance-statements/{id}/assign-orders"]
  - id: ERR_ORDER_ALREADY_ASSIGNED
    http_status: 409
    condition: "An order's settlement_status is already STATEMENT_ASSIGNED or SETTLED"
    applies_to: ["POST /remittance-statements/{id}/assign-orders"]
  - id: ERR_STATEMENT_EMPTY
    http_status: 409
    condition: "reconcile with order_count == 0"
    applies_to: ["POST /remittance-statements/{id}/reconcile"]
  - id: ERR_OPEN_ADJUSTMENTS_PRESENT
    http_status: 409
    condition: "reconcile with open_adjustment_count > 0"
    applies_to: ["POST /remittance-statements/{id}/reconcile"]

# =============================================================================
# Table 7: RBAC Permission Matrix  (§1.7)
#
# Identity headers: X-Role (always), X-User-ID (always, used for segregation of
# duties), plus the scope header of the acting entity-backed role.
# =============================================================================
roles:

  - name: PlatformAdmin
    description: "Middleware operator. Owns the brand catalog, channel registry, courier registry and the logical clock. Cannot place, inject, dispatch or settle orders."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /stores"
      - "PATCH /stores/{id}"
      - "POST /channels"
      - "POST /menu-versions"
      - "POST /menu-versions/{id}/items"
      - "POST /menu-versions/{id}/finalize"
      - "POST /courier-networks"
    shared_operations:
      - "All GET endpoints"
      - "POST /stores/{id}/hour-windows (shared with StoreOperator)"
      - "PATCH /channels/{id} (shared with ChannelPartner)"

  - name: StoreOperator
    description: "Store-side actor identified by X-Store-ID. Publishes the brand menu to the store, manages 86-ing, drives POS injection, marks orders ready and dispatches deliveries."
    identity: "entity_backed:Store"
    exclusive_operations:
      - "POST /stores/{id}/publish-menu"
      - "POST /stores/{id}/recompute-throttle"
      - "POST /orders/{id}/inject"
      - "POST /orders/{id}/resume-injection"
      - "POST /orders/{id}/ready"
      - "POST /orders/{id}/dispatch"
    shared_operations:
      - "POST /stores/{id}/hour-windows (shared with PlatformAdmin)"
      - "POST /availability-events (shared with ChannelPartner)"
      - "POST /orders/{id}/cancel (shared with ChannelPartner)"
      - "GET /stores/{id}/quote (shared with ChannelPartner)"
      - "Read access to stores, listings, orders, assignments and networks in its own scope"

  - name: ChannelPartner
    description: "Ordering channel identified by X-Channel-ID. Places orders, suppresses items on its own channel, reports 86s, reviews adjustments and disputes statements."
    identity: "entity_backed:Channel"
    exclusive_operations:
      - "POST /orders"
      - "PATCH /channel-listings/{id}"
      - "POST /adjustments/{id}/request-revision"
      - "POST /adjustments/{id}/accept"
      - "POST /remittance-statements/{id}/dispute"
    shared_operations:
      - "PATCH /channels/{id} (shared with PlatformAdmin)"
      - "POST /availability-events (shared with StoreOperator)"
      - "POST /orders/{id}/cancel (shared with StoreOperator)"
      - "GET /stores/{id}/quote (shared with StoreOperator)"
      - "Read access to its own channel's listings, orders, adjustments and statements"

  - name: CourierNetworkAgent
    description: "Delivery network identified by X-Courier-Network-ID. Accepts or declines offers, takes handoff and confirms delivery."
    identity: "entity_backed:CourierNetwork"
    exclusive_operations:
      - "POST /delivery-assignments/{id}/accept"
      - "POST /delivery-assignments/{id}/decline"
      - "POST /delivery-assignments/{id}/handoff"
      - "POST /delivery-assignments/{id}/deliver"
    shared_operations:
      - "Read access to its own assignments and network"

  - name: SettlementAnalyst
    description: "Brand-side money actor. Proposes and reverses adjustments and runs the remittance lifecycle. Segregation of duties applies: the proposer cannot reverse and the reconciler cannot settle."
    identity: opaque
    exclusive_operations:
      - "POST /adjustments"
      - "POST /adjustments/{id}/submit"
      - "POST /adjustments/{id}/revise"
      - "POST /adjustments/{id}/reverse"
      - "POST /remittance-statements"
      - "POST /remittance-statements/{id}/assign-orders"
      - "POST /remittance-statements/{id}/reconcile"
      - "POST /remittance-statements/{id}/settle"
    shared_operations:
      - "GET /remittance-statements/{id}/preview (shared with PlatformAdmin and ChannelPartner)"
      - "Read access to orders, adjustments, statements and assignments"

