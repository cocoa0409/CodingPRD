  # =====================================================================
  # Rule 8: resource_temporal_overlap — different interval semantics
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: weekly_bucket_half_open_window_membership
        grounds:
          - calculations.weekly_bucket_grant
          - entities.ReservationCreditBucket.fields.week_index
        distinguishing_aspect: |
          Resource: program week. Semantics: half-open intervals [anchor+7k,
          anchor+7(k+1)) — a reservation created at exactly 2026-09-08T00:00:00Z
          (the week boundary) debits week 1's bucket, never week 0's, and week 0
          is EXPIRED at that instant.
        test_recipe:
          setup:
            - "Clock 2026-09-01; plan ALIST_BASIC quota=3 PUBLISHED; member m16 ACTIVE with subscription s16 (week 0 = [09-01, 09-08))"
            - "Showtime st16 ON_SALE at 2026-09-09T19:00:00Z; week-0 bucket untouched (credits_used == 0)"
            - "Clock parked at exactly the boundary 2026-09-08T00:00:00Z"
          setup_api_calls:
            - call: "POST /cinemas/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /cinemas/subscription-plans"
              payload: { code: "ALIST_BASIC", tier: "BASIC", monthly_fee_cents: 1999, weekly_reservation_quota: 3, max_rollover_credits: 2, premium_format_allowed: false, max_future_reservations: 5, loyalty_points_multiplier_pct: 100, concession_discount_pct: 0 }
              as: ProgramAdmin
              captures: { plan16: $.data.id }
            - call: "POST /cinemas/subscription-plans/${plan16}/publish"
              payload: {}
              as: ProgramAdmin
            - call: "POST /cinemas/theaters"
              payload: { name: "T16", timezone: "America/Chicago" }
              as: ProgramAdmin
              captures: { th16: $.data.id }
            - call: "POST /cinemas/theaters/${th16}/auditoriums"
              payload: { label: "Aud 1", seat_count: 10, supported_formats: ["STANDARD"] }
              as: ProgramAdmin
              captures: { aud16: $.data.id }
            - call: "POST /cinemas/showtimes"
              payload: { auditorium_id: "${aud16}", film_title: "F16", studio_code: "WB", format: "STANDARD", starts_at: "2026-09-09T19:00:00Z", runtime_minutes: 120, base_price_cents: 1200, premium_surcharge_cents: 0, opening_weekend: false }
              as: ProgramAdmin
              captures: { st16: $.data.id, st16_v: $.data.version }
            - call: "POST /cinemas/showtimes/${st16}/open_sales"
              payload: {}
              as: ProgramAdmin
            - call: "POST /cinemas/members"
              payload: { email: "m16@x.com", full_name: "M Sixteen" }
              as: MemberServices
              captures: { m16: $.data.id }
            - call: "POST /cinemas/members/${m16}/activate"
              payload: {}
              as: MemberServices
            - call: "POST /cinemas/members/${m16}/subscriptions"
              payload: { plan_id: "${plan16}" }
              as: MemberServices
              captures: { s16: $.data.id }
            - call: "POST /cinemas/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /cinemas/reservations"
              payload: { subscription_id: "${s16}", showtime_id: "${st16}", expected_showtime_version: "${st16_v}" }
              as: Member
              as_user_id: "${m16}"
              captures: { r16: $.data.id, r16_bucket: $.data.bucket_id }
            - call: "GET /cinemas/subscriptions/${s16}/credit-buckets"
              payload: {}
              as: ProgramAdmin
              captures: { w0_used: "$.data[0].credits_used", w0_posture: "$.data[0].posture", w1_idx: "$.data[1].week_index", w1_used: "$.data[1].credits_used", w1_rollover: "$.data[1].rollover_in" }
          assert:
            - "reservation.bucket_id == the week_index 1 bucket (boundary instant belongs to the new week)"
            - "week 0 bucket.credits_used == 0 and posture == EXPIRED at the boundary"
            - "week 1 bucket.rollover_in == 2 (min(3 unused, cap 2)) and credits_used == 1"

      - name: settlement_period_overlap_exclusion
        grounds:
          - calculations.settlement_valuation
          - validations[priority=16]
        distinguishing_aspect: |
          Resource: SettlementReport period. Different semantics: reports settle
          admissions over half-open [period_start, period_end) on showtime
          start — a showtime at exactly period_end belongs to the NEXT period,
