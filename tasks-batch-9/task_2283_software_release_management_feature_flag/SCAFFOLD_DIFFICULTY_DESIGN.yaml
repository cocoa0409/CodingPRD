              as: Engineer
              as_user_id: "u-eng-1"
              captures: { cr_crit: $.data.id }
            - call: "POST /releases/${rel_id}/change-requests"
              payload: { title: "Fix typo in admin nav", summary_internal: "One-line label fix", lines_changed: 40, touched_subsystem_count: 1, declared_blast_radius: "INTERNAL" }
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { cr_low: $.data.id }
          trigger:
            - call: "POST /change-requests/${cr_crit}/submit"
              payload: {}
