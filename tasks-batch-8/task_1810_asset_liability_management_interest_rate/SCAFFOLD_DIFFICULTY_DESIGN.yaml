            - { call: "POST /assumption-sets/${ps}/submit", payload: {}, as: TreasuryAnalyst, as_user_id: an-1 }
            - { call: "POST /assumption-sets/${ps}/approve", payload: {}, as: ALCOChair, as_user_id: ch-1 }
            - { call: "POST /books/${b}/assumption-sets", payload: { domain: DEPOSIT_DECAY, params: { base_annual_decay_pct: 5.0, surge_decay_per_100bps: 1.0 } }, as: TreasuryAnalyst, as_user_id: an-1, captures: { ds: $.data.id } }
