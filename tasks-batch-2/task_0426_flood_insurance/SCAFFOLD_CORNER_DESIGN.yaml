# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Flood Insurance (NFIP / FEMA) — breadth probe. Walks references/claim-extraction-guide.md
# section-by-section against SCAFFOLD.yaml §1.1-§1.7. Corners already exercised by a §1.8
# instance are emitted as excluded_because: stubs (no test_recipe). Names are unique across
# the union of this file and SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_community_returns_201_with_computed_discount
        claim_type: Creation
        grounds:
          - "entities.Community"
          - "calculations.crs_community_discount"
        distinguishing_aspect: "POST /communities with crs_class 3 returns 201 and crs_discount_pct == 0.35 (table lookup), version 1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /communities"
              payload: { name: "Harbor", county_code: "C100", participating: true, crs_class: 3 }
              as: FemaAdmin
              captures: { cid: $.data.id, disc: $.data.crs_discount_pct }
          assert:
            - "response.status == 201"
            - "Community.${cid}.crs_discount_pct == 0.35"
            - "Community.${cid}.version == 1"

      - name: create_community_default_crs_class_10_zero_discount
        claim_type: Defaults
        grounds:
          - "entities.Community.fields.crs_class"
          - "entities.Community.fields.participating"
        distinguishing_aspect: "Omitting crs_class defaults to 10 (crs_discount_pct 0.00) and participating defaults to true."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /communities"
              payload: { name: "Default Town", county_code: "C101" }
              as: FemaAdmin
              captures: { cid: $.data.id, disc: $.data.crs_discount_pct }
          assert:
            - "Community.${cid}.crs_class == 10"
            - "Community.${cid}.crs_discount_pct == 0.0"
            - "Community.${cid}.participating == true"

      - name: property_is_sfha_computed_from_flood_zone
        claim_type: Computed Fields
        grounds:
          - "entities.Property.fields.is_sfha"
          - "entities.Property.fields.flood_zone"
        distinguishing_aspect: "An AE-zone property has is_sfha true; an X-zone property has is_sfha false; client cannot override the computed flag."
        test_recipe:
          setup: ["A participating community."]
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "Zone Test", county_code: "C102" }
              as: FemaAdmin
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /properties"
              payload: { community_id: "${cid}", owner_id: "h-sfha", address: "A1", flood_zone: "AE", occupancy: "PRIMARY_RESIDENCE", base_flood_elevation_ft: 8.0 }
              as: PolicyHolder
              as_user_id: "h-sfha"
              captures: { pa: $.data.id }
            - call: "POST /properties"
              payload: { community_id: "${cid}", owner_id: "h-sfha", address: "A2", flood_zone: "X", occupancy: "PRIMARY_RESIDENCE", base_flood_elevation_ft: 10.0 }
              as: PolicyHolder
              as_user_id: "h-sfha"
              captures: { px: $.data.id }
          assert:
            - "Property.${pa}.is_sfha == true"
            - "Property.${px}.is_sfha == false"

      - name: elevation_certificate_freeboard_computed_immutable_record
        claim_type: Computed Fields
        grounds:
          - "entities.ElevationCertificate.fields.freeboard_ft"
          - "entities.ElevationCertificate"
        distinguishing_aspect: "freeboard_ft == lowest_floor_elevation_ft - Property.base_flood_elevation_ft; the certificate is common_fields:false (no version field exposed)."
        test_recipe:
          setup: ["A property with BFE 8.0."]
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "EC Town", county_code: "C103" }
              as: FemaAdmin
              captures: { cid: $.data.id }
            - call: "POST /properties"
              payload: { community_id: "${cid}", owner_id: "h-ec", address: "EC1", flood_zone: "AE", occupancy: "PRIMARY_RESIDENCE", base_flood_elevation_ft: 8.0 }
              as: PolicyHolder
              as_user_id: "h-ec"
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /elevation-certificates"
              payload: { property_id: "${pid}", surveyor_license: "SURV-EC", lowest_floor_elevation_ft: 11.5 }
              as: PolicyHolder
              as_user_id: "h-ec"
              captures: { ecid: $.data.id, fb: $.data.freeboard_ft }
          assert:
            - "ElevationCertificate.${ecid}.freeboard_ft == 3.5"

      - name: get_policy_not_found_returns_404
        claim_type: Not Found
        grounds:
          - "entities.Policy"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /policies/{random-uuid} for a non-existent policy returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /policies/00000000-0000-4000-8000-000000000000"
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_property_missing_required_flood_zone_returns_400
        claim_type: Required Fields
        grounds:
          - "entities.Property.fields.flood_zone"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "POST /properties omitting the required flood_zone field returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["A community."]
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "Req Town", county_code: "C104" }
              as: FemaAdmin
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /properties"
              payload: { community_id: "${cid}", owner_id: "h-req", address: "R1", occupancy: "PRIMARY_RESIDENCE", base_flood_elevation_ft: 8.0 }
              as: PolicyHolder
              as_user_id: "h-req"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_VALIDATION"

      - name: create_property_invalid_flood_zone_enum_returns_400
        claim_type: Type Constraints
        grounds:
          - "entities.Property.fields.flood_zone"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "flood_zone outside {VE, AE, X} (e.g. 'B') returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["A community."]
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "Enum Town", county_code: "C105" }
              as: FemaAdmin
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /properties"
              payload: { community_id: "${cid}", owner_id: "h-enum", address: "E1", flood_zone: "B", occupancy: "PRIMARY_RESIDENCE", base_flood_elevation_ft: 8.0 }
              as: PolicyHolder
              as_user_id: "h-enum"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_VALIDATION"

      - name: policy_system_fields_ignored_on_create
        claim_type: System Fields
        grounds:
          - "entities.Policy.fields.status"
          - "entities.Policy.fields.quoted_premium"
        distinguishing_aspect: "POST quote ignores any client-supplied status/quoted_premium; status is always QUOTED and quoted_premium is server-computed (320 for X RR2 100000/40000 freeboard+1 crs10 primary)."
        test_recipe:
          setup: ["A participating community CRS 10; X-zone primary property BFE 10.0 with elevation cert at 11.0 (freeboard +1)."]
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "Sys Town", county_code: "C106" }
              as: FemaAdmin
              captures: { cid: $.data.id }
            - call: "POST /properties"
              payload: { community_id: "${cid}", owner_id: "h-sys", address: "S1", flood_zone: "X", occupancy: "PRIMARY_RESIDENCE", base_flood_elevation_ft: 10.0 }
              as: PolicyHolder
              as_user_id: "h-sys"
              captures: { pid: $.data.id }
            - call: "POST /elevation-certificates"
              payload: { property_id: "${pid}", surveyor_license: "SURV-S", lowest_floor_elevation_ft: 11.0 }
              as: PolicyHolder
              as_user_id: "h-sys"
          trigger:
            - call: "POST /properties/${pid}/policies"
              payload: { rating_method: "RISK_RATING_2_0", building_coverage: 100000, contents_coverage: 40000 }
              as: PolicyHolder
              as_user_id: "h-sys"
              captures: { pol_id: $.data.id, st: $.data.status, prem: $.data.quoted_premium }
          assert:
            - "Policy.${pol_id}.status == QUOTED"
            - "Policy.${pol_id}.quoted_premium == 320"
            - "Policy.${pol_id}.version == 1"

      - name: create_property_nonexistent_community_returns_404
        claim_type: Parent Relationships
        grounds:
          - "entities.Property.fields.community_id"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "POST /properties with a community_id FK that does not resolve returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /properties"
              payload: { community_id: "00000000-0000-4000-8000-0000000000aa", owner_id: "h-x", address: "X1", flood_zone: "AE", occupancy: "PRIMARY_RESIDENCE", base_flood_elevation_ft: 8.0 }
              as: PolicyHolder
              as_user_id: "h-x"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: list_properties_pagination_envelope
        claim_type: Listing
        grounds:
          - "entities.Property"
          - "endpoints"
        distinguishing_aspect: "GET /properties?owner_id=...&limit=1 returns a paginated array with total_count and has_more reflecting the two owned properties."
        test_recipe:
          setup: ["One owner with two registered properties in a community."]
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "Page Town", county_code: "C107" }
              as: FemaAdmin
              captures: { cid: $.data.id }
            - call: "POST /properties"
              payload: { community_id: "${cid}", owner_id: "h-page", address: "P1", flood_zone: "X", occupancy: "PRIMARY_RESIDENCE", base_flood_elevation_ft: 10.0 }
              as: PolicyHolder
              as_user_id: "h-page"
            - call: "POST /properties"
              payload: { community_id: "${cid}", owner_id: "h-page", address: "P2", flood_zone: "X", occupancy: "PRIMARY_RESIDENCE", base_flood_elevation_ft: 10.0 }
              as: PolicyHolder
              as_user_id: "h-page"
          trigger:
            - call: "GET /properties?owner_id=h-page&limit=1&offset=0"
              as: Underwriter
          assert:
            - "response.data length == 1"
            - "response.meta.total_count == 2 (or pagination has_more == true)"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: bind_from_already_bound_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.Policy.QUOTED_to_BOUND"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Binding a policy already in BOUND (re-issuing bind) fails with ERR_INVALID_STATE (409); no second bind_date stamp."
        test_recipe:
          setup: ["A BOUND lender policy (clock 2026-03-01)."]
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "Bind Twice", county_code: "C108" }
              as: FemaAdmin
              captures: { cid: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: FemaAdmin
            - call: "POST /properties"
              payload: { community_id: "${cid}", owner_id: "h-b2", address: "B2", flood_zone: "X", occupancy: "PRIMARY_RESIDENCE", base_flood_elevation_ft: 10.0 }
              as: PolicyHolder
              as_user_id: "h-b2"
              captures: { pid: $.data.id }
            - call: "POST /elevation-certificates"
              payload: { property_id: "${pid}", surveyor_license: "SURV-B2", lowest_floor_elevation_ft: 11.0 }
              as: PolicyHolder
              as_user_id: "h-b2"
            - call: "POST /properties/${pid}/policies"
              payload: { rating_method: "RISK_RATING_2_0", building_coverage: 100000, contents_coverage: 40000, is_lender_required: true }
              as: Underwriter
              captures: { pol_id: $.data.id }
            - call: "POST /policies/${pol_id}/bind"
              payload: {}
              as: Underwriter
          trigger:
            - call: "POST /policies/${pol_id}/bind"
              payload: {}
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: approve_claim_from_terminal_denied_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - "state_machines.Claim"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "A DENIED claim is terminal; approve attempts on it fail with ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A DENIED claim on an ACTIVE lender policy (reviewed then denied)."]
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "Deny Town", county_code: "C109" }
              as: FemaAdmin
              captures: { cid: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: FemaAdmin
            - call: "POST /properties"
              payload: { community_id: "${cid}", owner_id: "h-dn", address: "DN1", flood_zone: "X", occupancy: "PRIMARY_RESIDENCE", base_flood_elevation_ft: 10.0 }
              as: PolicyHolder
              as_user_id: "h-dn"
              captures: { pid: $.data.id }
            - call: "POST /elevation-certificates"
              payload: { property_id: "${pid}", surveyor_license: "SURV-DN", lowest_floor_elevation_ft: 11.0 }
              as: PolicyHolder
              as_user_id: "h-dn"
            - call: "POST /properties/${pid}/policies"
              payload: { rating_method: "RISK_RATING_2_0", building_coverage: 100000, contents_coverage: 40000, is_lender_required: true }
              as: Underwriter
              captures: { pol_id: $.data.id }
            - call: "POST /policies/${pol_id}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /policies/${pol_id}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /claims"
              payload: { policy_id: "${pol_id}", claimant_id: "h-dn", date_of_loss: "2026-04-10T00:00:00Z", building_loss: 5000 }
              as: PolicyHolder
              as_user_id: "h-dn"
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/open-review"
              payload: {}
              as: Adjuster
              captures: { cv: $.data.version }
            - call: "POST /claims/${claim_id}/deny"
              payload: { expected_claim_version: "${cv}" }
              as: Adjuster
              captures: { cv2: $.data.version }
          trigger:
            - call: "POST /claims/${claim_id}/approve"
              payload: { expected_claim_version: "${cv2}" }
              as: Adjuster
              captures: { err: $.data.error_id }
          assert:
            - "Claim.${claim_id}.status == DENIED"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: lapse_before_expiration_returns_policy_not_expired
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.Policy.ACTIVE_to_LAPSED"
          - "validations[priority=5]"
          - "errors[ERR_POLICY_NOT_EXPIRED]"
        distinguishing_aspect: "Lapsing an ACTIVE policy before the clock reaches expiration_date fails with ERR_POLICY_NOT_EXPIRED (409)."
        test_recipe:
          setup: ["An ACTIVE lender policy effective 2026-03-01 (expiration 2027-03-01); clock at 2026-06-01."]
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "Lapse Town", county_code: "C110" }
              as: FemaAdmin
              captures: { cid: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: FemaAdmin
            - call: "POST /properties"
              payload: { community_id: "${cid}", owner_id: "h-lp", address: "LP1", flood_zone: "X", occupancy: "PRIMARY_RESIDENCE", base_flood_elevation_ft: 10.0 }
              as: PolicyHolder
              as_user_id: "h-lp"
              captures: { pid: $.data.id }
            - call: "POST /elevation-certificates"
              payload: { property_id: "${pid}", surveyor_license: "SURV-LP", lowest_floor_elevation_ft: 11.0 }
              as: PolicyHolder
              as_user_id: "h-lp"
            - call: "POST /properties/${pid}/policies"
              payload: { rating_method: "RISK_RATING_2_0", building_coverage: 100000, contents_coverage: 40000, is_lender_required: true }
              as: Underwriter
              captures: { pol_id: $.data.id }
            - call: "POST /policies/${pol_id}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /policies/${pol_id}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: FemaAdmin
          trigger:
            - call: "POST /policies/${pol_id}/lapse"
              payload: {}
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_POLICY_NOT_EXPIRED"

      - name: expire_quote_retires_unbound_quote
        claim_type: Valid Transition
        grounds:
          - "state_machines.Policy.QUOTED_to_EXPIRED"
          - "entities.Policy.fields.status"
        distinguishing_aspect: "A QUOTED policy that is never bound moves to EXPIRED (terminal) via /expire-quote; status == EXPIRED."
        test_recipe:
          setup: ["A QUOTED RR2 policy on an X property."]
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "Quote Exp", county_code: "C111" }
              as: FemaAdmin
              captures: { cid: $.data.id }
            - call: "POST /properties"
              payload: { community_id: "${cid}", owner_id: "h-qe", address: "QE1", flood_zone: "X", occupancy: "PRIMARY_RESIDENCE", base_flood_elevation_ft: 10.0 }
              as: PolicyHolder
              as_user_id: "h-qe"
              captures: { pid: $.data.id }
            - call: "POST /elevation-certificates"
              payload: { property_id: "${pid}", surveyor_license: "SURV-QE", lowest_floor_elevation_ft: 11.0 }
              as: PolicyHolder
              as_user_id: "h-qe"
            - call: "POST /properties/${pid}/policies"
              payload: { rating_method: "RISK_RATING_2_0", building_coverage: 100000, contents_coverage: 40000 }
              as: PolicyHolder
              as_user_id: "h-qe"
              captures: { pol_id: $.data.id }
          trigger:
            - call: "POST /policies/${pol_id}/expire-quote"
              payload: {}
              as: Underwriter
              captures: { st: $.data.status }
          assert:
            - "Policy.${pol_id}.status == EXPIRED"

      - name: claim_initial_state_submitted
        claim_type: Initial State
        grounds:
          - "state_machines.Claim"
          - "entities.Claim.fields.status"
        distinguishing_aspect: "A newly filed claim starts in SUBMITTED with settlement_total 0."
        test_recipe:
          setup: ["An ACTIVE lender policy on an X property."]
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "Init Town", county_code: "C112" }
              as: FemaAdmin
              captures: { cid: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: FemaAdmin
            - call: "POST /properties"
              payload: { community_id: "${cid}", owner_id: "h-in", address: "IN1", flood_zone: "X", occupancy: "PRIMARY_RESIDENCE", base_flood_elevation_ft: 10.0 }
              as: PolicyHolder
              as_user_id: "h-in"
              captures: { pid: $.data.id }
            - call: "POST /elevation-certificates"
              payload: { property_id: "${pid}", surveyor_license: "SURV-IN", lowest_floor_elevation_ft: 11.0 }
              as: PolicyHolder
              as_user_id: "h-in"
            - call: "POST /properties/${pid}/policies"
              payload: { rating_method: "RISK_RATING_2_0", building_coverage: 100000, contents_coverage: 40000, is_lender_required: true }
              as: Underwriter
              captures: { pol_id: $.data.id }
            - call: "POST /policies/${pol_id}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /policies/${pol_id}/activate"
              payload: {}
              as: Underwriter
          trigger:
            - call: "POST /claims"
              payload: { policy_id: "${pol_id}", claimant_id: "h-in", date_of_loss: "2026-04-10T00:00:00Z", building_loss: 5000 }
              as: PolicyHolder
              as_user_id: "h-in"
              captures: { claim_id: $.data.id, st: $.data.status }
          assert:
            - "Claim.${claim_id}.status == SUBMITTED"
            - "Claim.${claim_id}.settlement_total == 0"

      - name: open_review_twice_idempotency_invalid_state
        claim_type: Idempotency
        grounds:
          - "state_machines.Claim.SUBMITTED_to_UNDER_REVIEW"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Opening review a second time on an already UNDER_REVIEW claim fails with ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A claim already UNDER_REVIEW on an ACTIVE lender policy."]
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "Idem Town", county_code: "C113" }
              as: FemaAdmin
              captures: { cid: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: FemaAdmin
            - call: "POST /properties"
              payload: { community_id: "${cid}", owner_id: "h-id", address: "ID1", flood_zone: "X", occupancy: "PRIMARY_RESIDENCE", base_flood_elevation_ft: 10.0 }
              as: PolicyHolder
              as_user_id: "h-id"
              captures: { pid: $.data.id }
            - call: "POST /elevation-certificates"
              payload: { property_id: "${pid}", surveyor_license: "SURV-ID", lowest_floor_elevation_ft: 11.0 }
              as: PolicyHolder
              as_user_id: "h-id"
            - call: "POST /properties/${pid}/policies"
              payload: { rating_method: "RISK_RATING_2_0", building_coverage: 100000, contents_coverage: 40000, is_lender_required: true }
              as: Underwriter
              captures: { pol_id: $.data.id }
            - call: "POST /policies/${pol_id}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /policies/${pol_id}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /claims"
              payload: { policy_id: "${pol_id}", claimant_id: "h-id", date_of_loss: "2026-04-10T00:00:00Z", building_loss: 5000 }
              as: PolicyHolder
              as_user_id: "h-id"
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/open-review"
              payload: {}
              as: Adjuster
          trigger:
            - call: "POST /claims/${claim_id}/open-review"
              payload: {}
              as: Adjuster
