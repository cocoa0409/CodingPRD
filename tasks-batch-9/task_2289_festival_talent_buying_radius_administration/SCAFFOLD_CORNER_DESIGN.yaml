              as: TalentBuyer
              captures: { wave: "$.data.id", wave_v: "$.data.version" }
          trigger:
            - call: "POST /festival-ops/budget-tiers"
              payload: { festival_id: "${fest}", tier_code: "HEADLINER", tier_rank: 9, allocation_pct: 0.1, max_slots: 2 }
              as: TalentBuyer
              captures: { e_code: "$.data.error_id" }
            - call: "POST /festival-ops/budget-tiers"
              payload: { festival_id: "${fest}", tier_code: "MID_CARD", tier_rank: 1, allocation_pct: 0.1, max_slots: 2 }
              as: TalentBuyer
              captures: { e_rank: "$.data.error_id" }
            - call: "POST /festival-ops/stages"
              payload: { festival_id: "${fest}", name: "Aurora Main", capacity: 5000, daily_curfew_minute: 1200, daily_program_minutes_cap: 300 }
              as: ProductionManager
              captures: { e_stage: "$.data.error_id" }
            - call: "POST /festival-ops/artists"
              payload: { legal_name: "Nova Kade Touring GmbH", performing_name: "Nova Kade", primary_genre: "ROCK", agency: "Other Agency", draw_score: 10 }
              as: TalentBuyer
