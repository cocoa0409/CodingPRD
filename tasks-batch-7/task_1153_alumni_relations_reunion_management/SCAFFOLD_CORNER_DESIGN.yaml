scaffold_corner_design:

  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: create_alumni_record_success_and_defaults
        claim_type: creation_and_defaults
        grounds: [entities.AlumniRecord]
        distinguishing_aspect: "POST /alumni/records with all required fields returns 201 with status=ACTIVE, engagement_score=0.00, engagement_tier=LOW, giving_propensity=0.00, lifetime_giving_cents=0, version=1."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /alumni/records"
              payload: { full_name: "New Alum", primary_email: "newalum@x.com", class_year: 2015, degree_code: "BS" }
              as: AlumniRelationsStaff
              captures: { na_id: $.data.id }
          assert:
            - "AlumniRecord.${na_id}.status == ACTIVE"
            - "AlumniRecord.${na_id}.engagement_tier == LOW"
            - "AlumniRecord.${na_id}.lifetime_giving_cents == 0"
            - "AlumniRecord.${na_id}.version == 1"

      - name: create_alumni_record_missing_required_field_rejected
        claim_type: required_fields
        grounds:
          - "entities.AlumniRecord"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Omitting required input field primary_email returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /alumni/records"
              payload: { full_name: "No Email", class_year: 2015, degree_code: "BS" }
              as: AlumniRelationsStaff
              captures: { e_id: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: get_alumni_record_not_found
        claim_type: not_found
        grounds:
          - "entities.AlumniRecord"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET with a random UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /alumni/records/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: AlumniRelationsStaff
              captures: { e_id: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND"

      - name: list_records_pagination_envelope
        claim_type: listing_pagination
        grounds: [entities.AlumniRecord, response_envelope]
        distinguishing_aspect: "GET /alumni/records returns envelope with data array and meta; pagination fields limit/offset/total_count/has_more present."
        test_recipe:
          setup: ["Three records created"]
          setup_api_calls:
            - call: "POST /alumni/records"
              payload: { full_name: "P1", primary_email: "p1@x.com", class_year: 2010, degree_code: "BA" }
              as: AlumniRelationsStaff
            - call: "POST /alumni/records"
              payload: { full_name: "P2", primary_email: "p2@x.com", class_year: 2010, degree_code: "BA" }
              as: AlumniRelationsStaff
            - call: "POST /alumni/records"
              payload: { full_name: "P3", primary_email: "p3@x.com", class_year: 2010, degree_code: "BA" }
              as: AlumniRelationsStaff
          trigger:
            - call: "GET /alumni/records?limit=2&offset=0"
              as: AlumniRelationsStaff
          assert:
            - "response contains data array of length 2"
            - "total_count == 3 and has_more == true"

      - name: ticket_tier_capacity_zero_unlimited_already_covered
        claim_type: boundary_default
        grounds: [entities.TicketTier.fields.capacity]
        excluded_because:
          difficulty_instance: boundary_precision_check / tier_capacity_zero_is_unlimited_not_sold_out
          rationale: "Boundary semantics of capacity==0 asserted there."

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: event_initial_state_planning_and_gated_posture
        claim_type: initial_state
        grounds: [state_machines.ReunionEvent]
        distinguishing_aspect: "Newly created event has status PLANNING and posture GATED (committee_count 0 < quorum)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /alumni/events"
              payload: { class_year: 2001, title: "R", event_date: "2026-09-01T18:00:00Z", committee_quorum_required: 3 }
              as: AlumniRelationsStaff
              captures: { evi_id: $.data.id }
          assert:
            - "ReunionEvent.${evi_id}.status == PLANNING"
            - "ReunionEvent.${evi_id}.posture == GATED"

      - name: open_registration_without_quorum_rejected
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.ReunionEvent.COMMITTEE_FORMED_to_OPEN_FOR_REGISTRATION"
          - "errors[ERR_QUORUM_NOT_MET]"
        distinguishing_aspect: "committee_count (1) < committee_quorum_required (3) -> ERR_QUORUM_NOT_MET."
        test_recipe:
          setup: ["Event COMMITTEE_FORMED with 1 ACTIVE member, quorum 3"]
          setup_api_calls:
            - call: "POST /alumni/records"
              payload: { full_name: "QChair", primary_email: "qchair@x.com", class_year: 2001, degree_code: "BA" }
              as: AlumniRelationsStaff
              captures: { qc_id: $.data.id }
            - call: "POST /alumni/events"
              payload: { class_year: 2001, title: "R", event_date: "2026-09-01T18:00:00Z", committee_quorum_required: 3 }
              as: AlumniRelationsStaff
              captures: { qev_id: $.data.id }
            - call: "POST /alumni/events/${qev_id}/committee"
              payload: { name: "C" }
              as: AlumniRelationsStaff
              captures: { qcom_id: $.data.id }
            - call: "POST /alumni/committees/${qcom_id}/memberships"
              payload: { alumni_id: "${qc_id}", role: "CHAIR" }
              as: AlumniRelationsStaff
              captures: { qmem_id: $.data.id }
            - call: "POST /alumni/memberships/${qmem_id}/accept"
              payload: {}
              as: CommitteeVolunteer
              as_user_id: "${qc_id}"
            - call: "POST /alumni/events/${qev_id}/form-committee"
              payload: {}
              as: AlumniRelationsStaff
          trigger:
            - call: "POST /alumni/events/${qev_id}/open-registration"
              payload: {}
              as: AlumniRelationsStaff
              captures: { qerr: $.data.error_id }
          assert:
            - "error_id == ERR_QUORUM_NOT_MET"
            - "ReunionEvent.${qev_id}.status == COMMITTEE_FORMED"

      - name: terminal_state_lockdown_deceased_record
        claim_type: terminal_state_lockdown
        grounds: [state_machines.AlumniRecord]
        distinguishing_aspect: "From DECEASED, mark-lost is invalid -> ERR_INVALID_STATE."
        test_recipe:
          setup: ["Record marked deceased"]
          setup_api_calls:
            - call: "POST /alumni/records"
              payload: { full_name: "Dec", primary_email: "dec@x.com", class_year: 1980, degree_code: "BA" }
              as: AlumniRelationsStaff
              captures: { dec_id: $.data.id }
            - call: "POST /alumni/records/${dec_id}/mark-deceased"
              payload: {}
              as: AlumniRelationsStaff
          trigger:
            - call: "POST /alumni/records/${dec_id}/mark-lost"
              payload: {}
              as: AlumniRelationsStaff
              captures: { derr: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"

      - name: invalid_from_transition_pledge_fulfill_on_lapsed
        claim_type: invalid_transition
        grounds: [state_machines.GiftPledge]
        distinguishing_aspect: "fulfill on a LAPSED pledge -> ERR_INVALID_STATE (fulfill only valid from PLEDGED)."
        test_recipe:
          setup: ["ACTIVE campaign with one pledge already LAPSED"]
          setup_api_calls:
            - call: "POST /alumni/records"
              payload: { full_name: "Ch", primary_email: "chx@x.com", class_year: 2001, degree_code: "BA" }
              as: AlumniRelationsStaff
              captures: { chx_id: $.data.id }
            - call: "POST /alumni/records"
              payload: { full_name: "Dn", primary_email: "dnx@x.com", class_year: 2001, degree_code: "BA" }
              as: AlumniRelationsStaff
              captures: { dnx_id: $.data.id }
            - call: "POST /alumni/events"
              payload: { class_year: 2001, title: "R", event_date: "2026-08-10T18:00:00Z", committee_quorum_required: 1 }
              as: AlumniRelationsStaff
              captures: { evx_id: $.data.id }
            - call: "POST /alumni/events/${evx_id}/committee"
              payload: { name: "C" }
              as: AlumniRelationsStaff
              captures: { comx_id: $.data.id }
            - call: "POST /alumni/committees/${comx_id}/memberships"
              payload: { alumni_id: "${chx_id}", role: "CHAIR" }
              as: AlumniRelationsStaff
              captures: { memx_id: $.data.id }
            - call: "POST /alumni/memberships/${memx_id}/accept"
              payload: {}
              as: CommitteeVolunteer
              as_user_id: "${chx_id}"
            - call: "POST /alumni/events/${evx_id}/campaigns"
              payload: { name: "F", goal_cents: 100000, matching_multiplier_bps: 0 }
              as: AlumniRelationsStaff
              captures: { campx_id: $.data.id }
            - call: "POST /alumni/campaigns/${campx_id}/activate"
              payload: {}
              as: AlumniRelationsStaff
            - call: "POST /alumni/campaigns/${campx_id}/pledges"
              payload: { alumni_id: "${dnx_id}", amount_cents: 5000 }
              as: Alumni
              as_user_id: "${dnx_id}"
              captures: { plx_id: $.data.id }
            - call: "POST /alumni/pledges/${plx_id}/lapse"
              payload: {}
              as: AlumniRelationsStaff
          trigger:
            - call: "POST /alumni/pledges/${plx_id}/fulfill"
              payload: {}
              as: AlumniRelationsStaff
              captures: { plxerr: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"

      - name: publication_review_loop_increments_review_round
        claim_type: cyclic_loop
        grounds: [state_machines.MemorabiliaPublication.IN_REVIEW_to_DRAFT]
        distinguishing_aspect: "IN_REVIEW -> DRAFT revert increments review_round by exactly 1 per loop."
        test_recipe:
          setup: ["Publication submitted to review once"]
          setup_api_calls:
            - call: "POST /alumni/events"
              payload: { class_year: 2001, title: "R", event_date: "2026-09-01T18:00:00Z", committee_quorum_required: 1 }
              as: AlumniRelationsStaff
              captures: { evp_id: $.data.id }
            - call: "POST /alumni/events/${evp_id}/publications"
              payload: { title: "Memory Book", class_notes_body: "Notes..." }
              as: AlumniRelationsStaff
              captures: { pub_id: $.data.id }
            - call: "POST /alumni/publications/${pub_id}/submit-review"
              payload: {}
              as: AlumniRelationsStaff
          trigger:
            - call: "POST /alumni/publications/${pub_id}/return-for-edits"
              payload: {}
              as: AlumniRelationsDirector
          assert:
            - "MemorabiliaPublication.${pub_id}.status == DRAFT"
            - "MemorabiliaPublication.${pub_id}.review_round == 1"

      - name: membership_accept_on_locked_committee_rejected
        claim_type: cross_entity_guard
        grounds:
          - "state_machines.CommitteeMembership.INVITED_to_ACTIVE"
          - "errors[ERR_COMMITTEE_LOCKED]"
        distinguishing_aspect: "After open-registration locks the committee, accepting a still-INVITED membership fails with ERR_COMMITTEE_LOCKED."
        test_recipe:
          setup: ["Event OPEN_FOR_REGISTRATION (committee locked); one INVITED membership still outstanding"]
          setup_api_calls:
            - call: "POST /alumni/records"
              payload: { full_name: "LChair", primary_email: "lchair@x.com", class_year: 2001, degree_code: "BA" }
              as: AlumniRelationsStaff
              captures: { lch_id: $.data.id }
            - call: "POST /alumni/records"
              payload: { full_name: "LVol", primary_email: "lvol@x.com", class_year: 2001, degree_code: "BA" }
              as: AlumniRelationsStaff
              captures: { lvol_id: $.data.id }
            - call: "POST /alumni/events"
              payload: { class_year: 2001, title: "R", event_date: "2026-09-01T18:00:00Z", committee_quorum_required: 1 }
              as: AlumniRelationsStaff
              captures: { lev_id: $.data.id, lev_v: $.data.version }
            - call: "POST /alumni/events/${lev_id}/committee"
              payload: { name: "C" }
              as: AlumniRelationsStaff
              captures: { lcom_id: $.data.id }
            - call: "POST /alumni/committees/${lcom_id}/memberships"
              payload: { alumni_id: "${lch_id}", role: "CHAIR" }
              as: AlumniRelationsStaff
              captures: { lmem1_id: $.data.id }
            - call: "POST /alumni/committees/${lcom_id}/memberships"
              payload: { alumni_id: "${lvol_id}", role: "MEMBER" }
              as: AlumniRelationsStaff
              captures: { lmem2_id: $.data.id }
            - call: "POST /alumni/memberships/${lmem1_id}/accept"
              payload: {}
              as: CommitteeVolunteer
              as_user_id: "${lch_id}"
            - call: "POST /alumni/events/${lev_id}/form-committee"
              payload: {}
              as: AlumniRelationsStaff
            - call: "POST /alumni/events/${lev_id}/ticket-tiers"
              payload: { name: "GA", base_price_cents: 1000, capacity: 0, sales_start: "2026-05-01T00:00:00Z", sales_end: "2026-09-01T00:00:00Z", early_bird_discount_pct: 0, expected_event_version: "${lev_v}" }
              as: AlumniRelationsStaff
            - call: "POST /alumni/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: AlumniRelationsStaff
            - call: "POST /alumni/events/${lev_id}/open-registration"
              payload: {}
              as: AlumniRelationsStaff
          trigger:
            - call: "POST /alumni/memberships/${lmem2_id}/accept"
              payload: {}
              as: CommitteeVolunteer
              as_user_id: "${lvol_id}"
              captures: { lerr: $.data.error_id }
          assert:
            - "error_id == ERR_COMMITTEE_LOCKED"
            - "CommitteeMembership.${lmem2_id}.status == INVITED"

      - name: campaign_close_blocked_by_outstanding_pledges
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.GiftCampaign.ACTIVE_to_CLOSED"
          - "errors[ERR_PLEDGES_OUTSTANDING]"
        distinguishing_aspect: "Close with a PLEDGED pledge outstanding -> ERR_PLEDGES_OUTSTANDING."
        test_recipe:
          setup: ["ACTIVE campaign with one PLEDGED pledge"]
          setup_api_calls:
            - call: "POST /alumni/records"
              payload: { full_name: "CCh", primary_email: "cch@x.com", class_year: 2001, degree_code: "BA" }
              as: AlumniRelationsStaff
              captures: { cch_id: $.data.id }
            - call: "POST /alumni/records"
              payload: { full_name: "CDn", primary_email: "cdn@x.com", class_year: 2001, degree_code: "BA" }
              as: AlumniRelationsStaff
              captures: { cdn_id: $.data.id }
            - call: "POST /alumni/events"
              payload: { class_year: 2001, title: "R", event_date: "2026-08-10T18:00:00Z", committee_quorum_required: 1 }
              as: AlumniRelationsStaff
              captures: { cev_id: $.data.id }
            - call: "POST /alumni/events/${cev_id}/committee"
              payload: { name: "C" }
              as: AlumniRelationsStaff
              captures: { ccom_id: $.data.id }
            - call: "POST /alumni/committees/${ccom_id}/memberships"
              payload: { alumni_id: "${cch_id}", role: "CHAIR" }
              as: AlumniRelationsStaff
              captures: { cmem_id: $.data.id }
            - call: "POST /alumni/memberships/${cmem_id}/accept"
              payload: {}
              as: CommitteeVolunteer
              as_user_id: "${cch_id}"
            - call: "POST /alumni/events/${cev_id}/campaigns"
              payload: { name: "F", goal_cents: 100000, matching_multiplier_bps: 0 }
              as: AlumniRelationsStaff
              captures: { ccamp_id: $.data.id }
            - call: "POST /alumni/campaigns/${ccamp_id}/activate"
              payload: {}
              as: AlumniRelationsStaff
            - call: "POST /alumni/campaigns/${ccamp_id}/pledges"
              payload: { alumni_id: "${cdn_id}", amount_cents: 5000 }
              as: Alumni
              as_user_id: "${cdn_id}"
          trigger:
            - call: "POST /alumni/campaigns/${ccamp_id}/close"
              payload: {}
              as: AlumniRelationsStaff
              captures: { ccerr: $.data.error_id }
          assert:
            - "error_id == ERR_PLEDGES_OUTSTANDING"
            - "GiftCampaign.${ccamp_id}.status == ACTIVE"

      - name: registration_cancel_idempotent_second_cancel_rejected
        claim_type: idempotency
        grounds: [state_machines.EventRegistration.PENDING_PAYMENT_to_CANCELLED]
        distinguishing_aspect: "Second cancel on already-CANCELLED registration -> ERR_INVALID_STATE."
        test_recipe:
          setup: ["Registration created then cancelled by registrant"]
          setup_api_calls:
            - call: "POST /alumni/records"
              payload: { full_name: "IChair", primary_email: "ichair@x.com", class_year: 2001, degree_code: "BA" }
              as: AlumniRelationsStaff
              captures: { ich_id: $.data.id }
            - call: "POST /alumni/records"
              payload: { full_name: "IGuest", primary_email: "iguest@x.com", class_year: 2001, degree_code: "BA" }
              as: AlumniRelationsStaff
              captures: { ig_id: $.data.id }
            - call: "POST /alumni/events"
              payload: { class_year: 2001, title: "R", event_date: "2026-09-01T18:00:00Z", committee_quorum_required: 1 }
              as: AlumniRelationsStaff
              captures: { iev_id: $.data.id, iev_v: $.data.version }
            - call: "POST /alumni/events/${iev_id}/committee"
              payload: { name: "C" }
              as: AlumniRelationsStaff
              captures: { icom_id: $.data.id }
            - call: "POST /alumni/committees/${icom_id}/memberships"
              payload: { alumni_id: "${ich_id}", role: "CHAIR" }
              as: AlumniRelationsStaff
              captures: { imem_id: $.data.id }
            - call: "POST /alumni/memberships/${imem_id}/accept"
              payload: {}
              as: CommitteeVolunteer
              as_user_id: "${ich_id}"
            - call: "POST /alumni/events/${iev_id}/form-committee"
              payload: {}
              as: AlumniRelationsStaff
            - call: "POST /alumni/events/${iev_id}/ticket-tiers"
              payload: { name: "GA", base_price_cents: 1000, capacity: 0, sales_start: "2026-05-01T00:00:00Z", sales_end: "2026-09-01T00:00:00Z", early_bird_discount_pct: 0, expected_event_version: "${iev_v}" }
              as: AlumniRelationsStaff
              captures: { itier_id: $.data.id }
            - call: "POST /alumni/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: AlumniRelationsStaff
            - call: "POST /alumni/events/${iev_id}/open-registration"
              payload: {}
              as: AlumniRelationsStaff
            - call: "POST /alumni/events/${iev_id}/registrations"
              payload: { tier_id: "${itier_id}", alumni_id: "${ig_id}" }
              as: Alumni
              as_user_id: "${ig_id}"
              captures: { iregn_id: $.data.id }
            - call: "POST /alumni/registrations/${iregn_id}/cancel"
              payload: {}
              as: Alumni
              as_user_id: "${ig_id}"
          trigger:
            - call: "POST /alumni/registrations/${iregn_id}/cancel"
              payload: {}
              as: Alumni
              as_user_id: "${ig_id}"
              captures: { ierr: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"

  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: engagement_score_constants_and_cap
        claim_type: constants_applied
        grounds: [calculations.engagement_score_calc]
        distinguishing_aspect: "Two confirmed registrations with no giving/service: event_points=50, score = 0.50*50 = 25.00 exactly; cap min(100,...) respected (5+ registrations stay at 50.00 contribution)."
        test_recipe:
          setup: ["Event OPEN, unlimited tier; alumnus with 2 confirmed registrations"]
          setup_api_calls:
            - call: "POST /alumni/records"
              payload: { full_name: "CalcChair", primary_email: "calcchair@x.com", class_year: 2001, degree_code: "BA" }
              as: AlumniRelationsStaff
              captures: { cch2_id: $.data.id }
            - call: "POST /alumni/records"
              payload: { full_name: "CalcAlum", primary_email: "calcalum@x.com", class_year: 2001, degree_code: "BA" }
              as: AlumniRelationsStaff
              captures: { ca_id: $.data.id }
            - call: "POST /alumni/events"
              payload: { class_year: 2001, title: "R", event_date: "2026-09-01T18:00:00Z", committee_quorum_required: 1 }
              as: AlumniRelationsStaff
              captures: { cev2_id: $.data.id, cev2_v: $.data.version }
            - call: "POST /alumni/events/${cev2_id}/committee"
              payload: { name: "C" }
              as: AlumniRelationsStaff
              captures: { ccom2_id: $.data.id }
            - call: "POST /alumni/committees/${ccom2_id}/memberships"
              payload: { alumni_id: "${cch2_id}", role: "CHAIR" }
              as: AlumniRelationsStaff
              captures: { cmem2_id: $.data.id }
            - call: "POST /alumni/memberships/${cmem2_id}/accept"
              payload: {}
              as: CommitteeVolunteer
              as_user_id: "${cch2_id}"
            - call: "POST /alumni/events/${cev2_id}/form-committee"
              payload: {}
              as: AlumniRelationsStaff
            - call: "POST /alumni/events/${cev2_id}/ticket-tiers"
              payload: { name: "GA", base_price_cents: 1000, capacity: 0, sales_start: "2026-05-01T00:00:00Z", sales_end: "2026-09-01T00:00:00Z", early_bird_discount_pct: 0, expected_event_version: "${cev2_v}" }
              as: AlumniRelationsStaff
              captures: { ctier_id: $.data.id }
            - call: "POST /alumni/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: AlumniRelationsStaff
            - call: "POST /alumni/events/${cev2_id}/open-registration"
              payload: {}
              as: AlumniRelationsStaff
          trigger:
            - call: "POST /alumni/events/${cev2_id}/registrations"
              payload: { tier_id: "${ctier_id}", alumni_id: "${ca_id}" }
              as: Alumni
              as_user_id: "${ca_id}"
              captures: { cr1: $.data.id }
            - call: "POST /alumni/registrations/${cr1}/confirm-payment"
              payload: {}
              as: Alumni
              as_user_id: "${ca_id}"
            - call: "POST /alumni/events/${cev2_id}/registrations"
              payload: { tier_id: "${ctier_id}", alumni_id: "${ca_id}" }
              as: Alumni
              as_user_id: "${ca_id}"
              captures: { cr2: $.data.id }
            - call: "POST /alumni/registrations/${cr2}/confirm-payment"
              payload: {}
              as: Alumni
              as_user_id: "${ca_id}"
          assert:
            - "AlumniRecord.${ca_id}.engagement_score == 25.00"
            - "AlumniRecord.${ca_id}.engagement_tier == LOW (25.00 < 30.00)"

      - name: giving_propensity_recency_window
        claim_type: input_set_filtering
        grounds: [calculations.giving_propensity_calc]
        distinguishing_aspect: "recency_bonus applies only when a FULFILLED pledge exists within [now-365d, now]; fulfillment then a clock jump of 400 days drops the bonus on next recompute."
        test_recipe:
          setup: ["Donor with one fulfilled pledge of 100000 cents at clock 2026-06-01; later clock moved +400 days and a second pledge lapsed to trigger propensity recompute"]
          setup_api_calls:
            - call: "POST /alumni/records"
