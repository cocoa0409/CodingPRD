          Dual failure on POST /certification-packages/{id}/certify pits category `state` (priority 24,
          ERR_MEMBER_BATCH_NOT_VALIDATED, 409) against category `business_temporal` (priority 71,
          ERR_CERTIFICATION_DEADLINE_PASSED, 422); the lower priority number wins, so the response is 409
