              as_user_id: "finance-filer-1"
              captures: { hca2_state2: $.data.status }
            - call: "POST /host-community-agreements/${hca2_id}/open-amendment"
              payload: { amendment_reason: "Second reopener" }
              as: FinanceOfficer
              as_user_id: "finance-filer-1"
              captures: { e_amend: $.data.error_id }
            - call: "GET /landfills/${lf_id}"
              payload: {}
              as: FinanceOfficer
              as_user_id: "finance-filer-1"
              captures: { lf_v3: $.data.version }
