            - { call: "POST /order-lines", payload: { sales_order_id: "${o_id}", species_id: "${sp1_id}", requested_grade: "GRADE_A", requested_qty_kg: 10.00, allow_substitution: true }, as: Customer, as_user_id: "${c_id}", captures: { ol_id: $.data.id } }
            - { call: "POST /sales-orders/${o_id}/submit", payload: {}, as: Customer, as_user_id: "${c_id}" }
