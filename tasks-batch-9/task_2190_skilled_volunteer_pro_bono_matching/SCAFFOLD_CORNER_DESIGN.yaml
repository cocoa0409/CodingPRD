            - "data.status == \"SUSPENDED\""
            - "data.suspended_at == \"2026-08-01T00:00:00Z\""
            - "GET /project-requests/${req_id} shows status == \"ABANDONED\" with closed_at == \"2026-08-01T00:00:00Z\""
            - "GET /match-offers/${offer_id} shows status == \"WITHDRAWN\", withdraw_reason == \"PARTNER_SUSPENDED\", responded_at == \"2026-08-01T00:00:00Z\""
            - "GET /volunteers/${vol_id}/availability-windows shows data[0].hours_committed == 0.00 and hours_remaining == 200.00"
