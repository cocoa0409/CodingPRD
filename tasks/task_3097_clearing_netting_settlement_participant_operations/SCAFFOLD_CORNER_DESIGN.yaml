              as: PlatformAdmin
              captures: { p_ma3: $.data.id }
            - call: "POST /clearing/participants"
              payload: { legal_name: "Mtm Beta", lei: "LEI-MB3", participant_class: "BANK", net_capital_cents: 2000000000 }
