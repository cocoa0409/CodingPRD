            - call: "POST /film-sales/pre-sale-contracts/${contract_id}/payment-milestones"
              payload: { label: "ON_SIGNATURE", pct_of_mg: 0.45, due_date: "2026-09-01T00:00:00Z" }
              as: SalesAgent
              captures: { ms_sig_id: $.data.id }
            - call: "POST /film-sales/pre-sale-contracts/${contract_id}/payment-milestones"
              payload: { label: "ON_DELIVERY", pct_of_mg: 0.20, due_date: "2027-06-15T00:00:00Z" }
              as: SalesAgent
              captures: { ms_del_id: $.data.id }
            - call: "POST /film-sales/pre-sale-contracts/${contract_id}/payment-milestones"
              payload: { label: "ON_RELEASE", pct_of_mg: 0.10, due_date: "2027-07-15T00:00:00Z" }
              as: SalesAgent
              captures: { ms_rel_id: $.data.id }
            - call: "POST /film-sales/pre-sale-contracts/${contract_id}/payment-milestones"
              payload: { label: "ON_TERM_END", pct_of_mg: 0.25, due_date: "2028-08-01T00:00:00Z" }
              as: SalesAgent
              captures: { ms_end_id: $.data.id }
            - call: "POST /film-sales/pre-sale-contracts/${contract_id}/accept"
              payload: {}
              as: Buyer
              as_user_id: "${buyer_de_id}"
            - call: "POST /film-sales/pre-sale-contracts/${contract_id}/execute"
              payload: {}
              as: HeadOfSales
              as_user_id: "hos-closer-9"
            - call: "POST /film-sales/films/${film_id}/collection-accounts"
              payload: { bank_name: "Fiduciary Trust", account_reference: "CAM-2793" }
              as: CollectionAgent
              captures: { acct_id: $.data.id }
            - call: "POST /film-sales/collection-accounts/${acct_id}/waterfall-tiers"
              payload: { tier_order: 1, tier_type: "COLLECTION_FEE", recipient_name: "Fiduciary Trust", pct_of_available: 0.0125, cap_usd: 25000.00 }
              as: CollectionAgent
              captures: { tier1_id: $.data.id }
            - call: "POST /film-sales/collection-accounts/${acct_id}/waterfall-tiers"
              payload: { tier_order: 2, tier_type: "SALES_COMMISSION", recipient_name: "Aurora Sales", pct_of_available: 1.00, cap_usd: 0.01 }
              as: CollectionAgent
              captures: { tier2_id: $.data.id }
            - call: "POST /film-sales/payment-milestones/${ms_sig_id}/receipt"
              payload: { amount_usd: 900000.00, received_at: "2026-08-05T00:00:00Z" }
              as: CollectionAgent
              as_user_id: "collect-1"
            - call: "POST /film-sales/payment-milestones/${ms_del_id}/receipt"
              payload: { amount_usd: 400000.00, received_at: "2026-08-06T00:00:00Z" }
              as: CollectionAgent
              as_user_id: "collect-1"
            - call: "POST /film-sales/collection-accounts/${acct_id}/distribute"
              payload: { amount_in_usd: 500000.00 }
              as: CollectionAgent
              as_user_id: "collect-1"
              captures: { run_id: $.data.id }
          trigger:
            - call: "POST /film-sales/payment-milestones/${ms_del_id}/reverse-receipt"
              payload: { reason: "wire posted against the wrong picture" }
              as: CollectionAgent
              as_user_id: "collect-2"
            - call: "GET /film-sales/collection-accounts/${acct_id}"
              payload: {}
              as: CollectionAgent
              captures: { receipts_after_reversal: $.data.total_receipts_usd, distributed_after_reversal: $.data.total_distributed_usd, balance_after_reversal: $.data.balance_usd }
            - call: "POST /film-sales/payment-milestones/${ms_del_id}/receipt"
              payload: { amount_usd: 400000.00, received_at: "2026-08-07T00:00:00Z" }
              as: CollectionAgent
              as_user_id: "collect-1"
            - call: "GET /film-sales/collection-accounts/${acct_id}"
              payload: {}
              as: CollectionAgent
              captures: { balance_after_repost: $.data.balance_usd }
          assert:
            - "before the trigger: SalesAgencyAgreement.${agr_id}.gross_collected_usd == 1300000.00 and commission_earned_usd == 130000.00; WaterfallTier.${tier2_id}.cap_usd == 130000.00 (resynced away from the authored 0.01)"
            - "before the trigger: DistributionRun.${run_id}.allocations[0].amount_usd == 6250.00, allocations[1].amount_usd == 130000.00, amount_allocated_usd == 136250.00, residual_usd == 363750.00"
            - "before the trigger: CollectionAccount.${acct_id}.total_receipts_usd 1300000.00 - total_distributed_usd 136250.00 - balance_usd 1163750.00 == 0.00"
            - "after the reversal: PaymentMilestone.${ms_del_id}.status == INVOICED with received_amount_usd == 0.00, received_at == null and accrued_commission_usd == 0.00"
            - "after the reversal: SalesAgencyAgreement.${agr_id}.gross_collected_usd == 900000.00 and commission_earned_usd == 90000.00 — exactly the 40000.00 that was stored on the milestone was removed, not a recomputed 32500.00"
            - "after the reversal: ${receipts_after_reversal} == 900000.00, ${distributed_after_reversal} == 136250.00, ${balance_after_reversal} == 763750.00 and 900000.00 - 136250.00 - 763750.00 == 0.00"
            - "after the reversal: Film.${film_id}.total_mg_collected_usd == 900000.00 and PreSaleContract.${contract_id}.collection_status == PARTIALLY_PAID (ON_SIGNATURE is still RECEIVED)"
            - "after the reversal: WaterfallTier.${tier2_id}.cap_usd == 90000.00 while recouped_usd stays 130000.00 and status stays SATISFIED — distributed cash is never clawed back by a reversal"
            - "after the re-post: SalesAgencyAgreement.${agr_id}.gross_collected_usd == 1300000.00 and commission_earned_usd == 130000.00 — bit-for-bit restoration with no drift"
            - "after the re-post: PaymentMilestone.${ms_del_id}.accrued_commission_usd == 40000.00 and ${balance_after_repost} == 1163750.00, so the conservation identity holds again"

      - name: lapse_restores_buyer_exposure_and_film_commitment_to_their_pre_offer_values
        grounds:
          - state_machines.PreSaleContract.OFFERED_to_LAPSED
          - state_machines.PreSaleContract.ACCEPTED_to_LAPSED
          - calculations.buyer_exposure
          - entities.Buyer.fields.outstanding_exposure_usd
          - entities.Film.fields.total_mg_committed_usd
          - entities.Film.fields.financing_gap_usd
        distinguishing_aspect: |
          A different conserved quantity and a different compensating edge from the cash instance:
          here the invariants are `outstanding_exposure_usd == sum of minimum_guarantee_usd over the
          buyer's live contracts` and `financing_gap_usd == production_budget_usd -
          total_mg_committed_usd`, and the undo is lapse rather than reverse-receipt. Lapsing from
          ACCEPTED must reverse two ledgers (exposure AND commitment), while lapsing from OFFERED
          must reverse only exposure, because an OFFERED contract was never committed. Both must land
          back on the exact pre-offer figures 0.00 and 24000000.00, and a fresh offer of the same
          500000.00 must then rebuild exposure to 500000.00 with no residue from the lapsed rows.
