              as: SafetyDataFeed
            - call: "POST /api/carriers/${car_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: ComplianceOfficer
            - call: "POST /api/vehicles"
              payload: { carrier_id: "${car_id}", vin: "VIN-0001", plate_number: "P-1", plate_state: "CA", home_state_code: "CA", gvwr_lbs: 80000 }
              as: CarrierManager
              as_user_id: "${car_id}"
              captures: { veh_id: $.data.id }
            - call: "POST /api/vehicle-subscriptions"
              payload: { carrier_id: "${car_id}", vehicle_id: "${veh_id}", service_start_date: "2026-08-01", service_end_date: "2026-09-30" }
              as: CarrierManager
              as_user_id: "${car_id}"
              captures: { sub1: $.data.id, sub1_status: $.data.status }
          trigger:
            - call: "POST /api/vehicle-subscriptions"
              payload: { carrier_id: "${car_id}", vehicle_id: "${veh_id}", service_start_date: "2026-09-30", service_end_date: "2026-12-31" }
              as: CarrierManager
              as_user_id: "${car_id}"
              captures: { adj_err: $.data.error_id }
            - call: "POST /api/vehicle-subscriptions"
              payload: { carrier_id: "${car_id}", vehicle_id: "${veh_id}", service_start_date: "2026-10-01", service_end_date: "2026-12-31" }
              as: CarrierManager
              as_user_id: "${car_id}"
              captures: { sub3: $.data.id, sub3_status: $.data.status }
          assert:
            - "sub1 [2026-08-01, 2026-09-30] status == ACTIVE"
            - "start 2026-09-30 == sub1.end 2026-09-30: rejected ERR_SUBSCRIPTION_WINDOW_OVERLAP (closed interval — adjacency conflicts)"
            - "sub3 [2026-10-01, 2026-12-31] created: start == end+1 day is the earliest legal renewal; status == SCHEDULED (start > today 2026-08-01)"
            - "vehicle has exactly 2 subscriptions after the three attempts"

