      - name: err_unauthenticated_when_identity_headers_are_absent
        claim_type: violation_to_error
        grounds:
          - validations.priority_1_auth
          - errors[ERR_UNAUTHENTICATED]
          - endpoints.GET_/treatment-facilities/{facilityId}
        distinguishing_aspect: "The request omits both X-User-Role and X-User-ID, so it is refused with ERR_UNAUTHENTICATED 401 at priority 1 even though the facility id resolves and every role in §1.7 is allowed to read it."
        test_recipe:
          setup:
            - "One facility exists. The trigger call is sent with no X-User-Role header and no X-User-ID header - the as: NONE marker means both identity headers are omitted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /treatment-facilities"
              payload: { name: "North Water Reclamation Plant", npdes_permit_number: "NP-1001", storage_capacity_wet_tons: 5000.00, daily_production_wet_tons: 40.00, loadout_bay_count: 2 }
              as: FacilityOperator
              captures: { fac_id: $.data.id }
          trigger:
            - call: "GET /treatment-facilities/${fac_id}"
              payload: {}
              as: NONE
              captures: { err: $.data.error_id }
          assert:
            - "${err} == \"ERR_UNAUTHENTICATED\""
            - "the response HTTP status == 401"
            - "the response response_type == \"error\""

