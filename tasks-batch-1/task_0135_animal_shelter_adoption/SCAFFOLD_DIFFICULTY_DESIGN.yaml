scaffold_difficulty_design:
  # =================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: adoption_fee_estimated_vs_final_diverges_on_microchip
        grounds:
          - calculations.adoption_fee
          - entities.AdoptionApplication.fields.estimated_fee_cents
          - entities.AdoptionApplication.fields.final_fee_cents
          - state_machines.AdoptionApplication.APPROVED_to_FINALIZED
        distinguishing_aspect: |
          Dual-variant lives on the AdoptionApplication (fee) entity domain: estimated_fee_cents
          (provisional, animal not yet microchipped) = 17500 diverges from final_fee_cents
          (final, animal microchipped between submit and finalize) = 15000.
        test_recipe:
          setup:
            - "Shelter with promo_active=false, default board rates"
            - "Animal species=DOG age_months=36 (ADULT band), SURRENDER intake -> IN_CUSTODY, medical CLEARED, AVAILABLE"
            - "AdoptionApplication SUBMITTED while animal NOT microchipped -> estimated_fee_cents=17500"
            - "Animal then microchipped; application APPROVED"
          setup_api_calls:
            - call: "POST /shelters"
              payload: { name: "Shelter", stray_hold_days: 5, promo_active: false }
              as: ShelterAdmin
              captures: { shelter_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ShelterAdmin
            - call: "POST /animals"
              payload: { name: "Rex", species: "DOG", age_months: 36 }
              as: IntakeOfficer
              captures: { animal_id: $.data.id }
            - call: "POST /intake-records"
              payload: { animal_id: "${animal_id}", source: "SURRENDER", surrendering_party: "Jane" }
              as: IntakeOfficer
            - call: "POST /medical-records"
              payload: { animal_id: "${animal_id}", record_type: "EXAM", outcome: "CLEAR" }
              as: Veterinarian
            - call: "POST /animals/${animal_id}/make-available"
              payload: {}
              as: AdoptionCounselor
            - call: "POST /adopter-accounts"
              payload: { full_name: "Bob Adopter", email: "bob@x.com" }
              as: AdoptionCounselor
              captures: { adopter_id: $.data.id }
            - call: "POST /adoption-applications"
              payload: { animal_id: "${animal_id}", adopter_id: "${adopter_id}" }
              as: AdoptionCounselor
              captures: { app_id: $.data.id, est_fee: $.data.estimated_fee_cents }
            - call: "POST /microchips"
              payload: { animal_id: "${animal_id}", chip_number: "CHIP-1001" }
              as: Veterinarian
            - call: "POST /adoption-applications/${app_id}/approve"
              payload: {}
              as: AdoptionCounselor
          trigger:
            - call: "POST /adoption-applications/${app_id}/finalize"
              payload: {}
              as: AdoptionCounselor
              captures: { final_fee: $.data.final_fee_cents }
          assert:
            - "AdoptionApplication.${app_id}.estimated_fee_cents == 17500"
            - "AdoptionApplication.${app_id}.final_fee_cents == 15000"
            - "AdoptionApplication.${app_id}.final_fee_cents != AdoptionApplication.${app_id}.estimated_fee_cents"

      - name: board_cost_projected_vs_actual_diverges_on_early_release
        grounds:
          - calculations.actual_board_cost
          - entities.KennelAssignment.fields.actual_board_cents
          - state_machines.KennelAssignment.ACTIVE_to_RELEASED
        distinguishing_aspect: |
          Dual-variant lives on the KennelAssignment (board cost) entity domain — a different
          domain from adoption fee: projected_board_cents (forward-looking to the 5-day stray
          hold) = 9945 diverges from actual_board_cents (chronological, released after 2 days)
          = 3978.
        test_recipe:
          setup:
            - "Shelter stray_hold_days=5, dog_daily_board_cents=1850"
            - "Animal DOG, STRAY intake at 2026-06-01 -> stray_hold_release_at=2026-06-06"
            - "KennelAssignment ACTIVE from 2026-06-01; projected board to release = 5 days = 9945"
            - "Clock advanced to 2026-06-03 (2 days); assignment released -> actual board = 2 days = 3978"
          setup_api_calls:
            - call: "POST /shelters"
              payload: { name: "Shelter", stray_hold_days: 5, dog_daily_board_cents: 1850 }
              as: ShelterAdmin
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ShelterAdmin
            - call: "POST /kennels"
              payload: { label: "A-1", capacity: 1 }
              as: ShelterAdmin
              captures: { kennel_id: $.data.id, kennel_v: $.data.version }
            - call: "POST /animals"
              payload: { name: "Stray Rex", species: "DOG", age_months: 36 }
              as: IntakeOfficer
              captures: { animal_id: $.data.id }
            - call: "POST /intake-records"
              payload: { animal_id: "${animal_id}", source: "STRAY" }
              as: IntakeOfficer
            - call: "POST /kennel-assignments"
              payload: { kennel_id: "${kennel_id}", animal_id: "${animal_id}", expected_kennel_version: "${kennel_v}" }
              as: IntakeOfficer
              captures: { ka_id: $.data.id }
            - call: "GET /kennel-assignments/${ka_id}/projected-board"
              payload: {}
              as: IntakeOfficer
              captures: { projected: $.data.projected_board_cents }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-03T00:00:00Z" }
              as: ShelterAdmin
          trigger:
            - call: "POST /kennel-assignments/${ka_id}/release"
              payload: {}
              as: IntakeOfficer
              captures: { actual: $.data.actual_board_cents }
          assert:
            - "GET /kennel-assignments/${ka_id}/projected-board returned projected_board_cents == 9945"
            - "KennelAssignment.${ka_id}.actual_board_cents == 3978"
            - "KennelAssignment.${ka_id}.actual_board_cents != 9945"

  # =================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: adoption_fee_nested_max_promo_discount_mode_a
        grounds:
          - calculations.adoption_fee
          - entities.Shelter.fields.promo_active
          - entities.Animal.fields.age_months
        distinguishing_aspect: |
          Mode (a): ≥3 inputs (age_band, microchipped, promo flags) with non-linear nested
          max — discount = max(PROMO_FLAT_CENTS=3000, round(0.20*gross)). For a PUPPY (25000)
          already chipped with promo on, pct_off=5000 > flat=3000, so fee = 25000-5000 = 20000.
        test_recipe:
          setup:
            - "Shelter promo_active=true"
            - "Animal PUPPY (age_months=4), already microchipped, AVAILABLE"
            - "AdoptionApplication submitted -> estimated_fee uses nested-max promo path"
          setup_api_calls:
            - call: "POST /shelters"
              payload: { name: "Shelter", stray_hold_days: 5, promo_active: true }
              as: ShelterAdmin
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ShelterAdmin
            - call: "POST /animals"
              payload: { name: "Pup", species: "DOG", age_months: 4 }
              as: IntakeOfficer
              captures: { animal_id: $.data.id }
            - call: "POST /intake-records"
              payload: { animal_id: "${animal_id}", source: "SURRENDER", surrendering_party: "Ana" }
              as: IntakeOfficer
            - call: "POST /microchips"
              payload: { animal_id: "${animal_id}", chip_number: "CHIP-2002" }
              as: Veterinarian
            - call: "POST /medical-records"
              payload: { animal_id: "${animal_id}", record_type: "EXAM", outcome: "CLEAR" }
              as: Veterinarian
            - call: "POST /animals/${animal_id}/make-available"
              payload: {}
              as: AdoptionCounselor
            - call: "POST /adopter-accounts"
              payload: { full_name: "Cara", email: "cara@x.com" }
              as: AdoptionCounselor
              captures: { adopter_id: $.data.id }
          trigger:
            - call: "POST /adoption-applications"
              payload: { animal_id: "${animal_id}", adopter_id: "${adopter_id}" }
              as: AdoptionCounselor
              captures: { app_id: $.data.id, est_fee: $.data.estimated_fee_cents }
          assert:
            - "AdoptionApplication.${app_id}.estimated_fee_cents == 20000"

      - name: board_cost_round_per_day_then_sum_mode_b
        grounds:
          - calculations.actual_board_cost
          - entities.KennelAssignment.fields.actual_board_cents
          - entities.Shelter.fields.cat_daily_board_cents
        distinguishing_aspect: |
          Mode (b): rounding order matters. round-per-day-then-sum for a CAT over 3 days =
          1344*3 = 4032; the forbidden sum-then-round = round(1250*3*1.075) = 4031. The
          scaffold pins round-per-day, so the asserted total is 4032, not 4031.
        test_recipe:
          setup:
            - "Shelter cat_daily_board_cents=1250"
            - "Animal CAT, SURRENDER intake at 2026-06-01, kennel-assigned"
            - "Clock advanced to 2026-06-04 (3 days); assignment released"
          setup_api_calls:
            - call: "POST /shelters"
              payload: { name: "Shelter", stray_hold_days: 5, cat_daily_board_cents: 1250 }
              as: ShelterAdmin
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ShelterAdmin
            - call: "POST /kennels"
              payload: { label: "C-1", capacity: 1 }
              as: ShelterAdmin
              captures: { kennel_id: $.data.id, kennel_v: $.data.version }
            - call: "POST /animals"
              payload: { name: "Tom", species: "CAT", age_months: 24 }
              as: IntakeOfficer
              captures: { animal_id: $.data.id }
            - call: "POST /intake-records"
              payload: { animal_id: "${animal_id}", source: "SURRENDER", surrendering_party: "Liz" }
              as: IntakeOfficer
            - call: "POST /kennel-assignments"
              payload: { kennel_id: "${kennel_id}", animal_id: "${animal_id}", expected_kennel_version: "${kennel_v}" }
              as: IntakeOfficer
              captures: { ka_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-04T00:00:00Z" }
              as: ShelterAdmin
          trigger:
            - call: "POST /kennel-assignments/${ka_id}/release"
              payload: {}
              as: IntakeOfficer
              captures: { actual: $.data.actual_board_cents }
          assert:
            - "KennelAssignment.${ka_id}.actual_board_cents == 4032"

  # =================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: animal_parallel_axes_medical_independent_of_lifecycle
        grounds:
          - entities.Animal.fields.lifecycle_status
          - entities.Animal.fields.medical_status
          - state_machines.Animal.UNEXAMINED_to_NEEDS_TREATMENT
        distinguishing_aspect: |
          Parallel dimensions on Animal: a HOLD exam moves medical_status UNEXAMINED ->
          NEEDS_TREATMENT while lifecycle_status stays IN_CUSTODY — the two axes evolve
          independently on the same row.
        test_recipe:
          setup:
            - "Animal SURRENDER intake -> lifecycle_status IN_CUSTODY, medical_status UNEXAMINED"
          setup_api_calls:
            - call: "POST /shelters"
              payload: { name: "Shelter" }
              as: ShelterAdmin
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ShelterAdmin
            - call: "POST /animals"
              payload: { name: "Max", species: "DOG", age_months: 50 }
              as: IntakeOfficer
              captures: { animal_id: $.data.id }
            - call: "POST /intake-records"
              payload: { animal_id: "${animal_id}", source: "SURRENDER", surrendering_party: "Pat" }
              as: IntakeOfficer
          trigger:
            - call: "POST /medical-records"
              payload: { animal_id: "${animal_id}", record_type: "EXAM", outcome: "HOLD" }
              as: Veterinarian
          assert:
            - "Animal.${animal_id}.medical_status == NEEDS_TREATMENT"
            - "Animal.${animal_id}.lifecycle_status == IN_CUSTODY"

      - name: foster_placement_cyclic_return_then_replace
        grounds:
          - state_machines.FosterPlacement.ACTIVE_to_RETURNED
          - state_machines.Animal.FOSTERED_to_AVAILABLE
          - entities.FosterPlacement.fields.status
        distinguishing_aspect: |
          Cyclic on FosterPlacement (different entity from Animal's parallel axes): an animal is
          FOSTERED, RETURNED back to AVAILABLE, then placed again into a second ACTIVE
          FosterPlacement — the loop closes on the same animal.
        test_recipe:
          setup:
            - "FosterHome max_concurrent=2 cooldown_days=0"
            - "Animal AVAILABLE; placed (FOSTERED) then returned (AVAILABLE)"
          setup_api_calls:
            - call: "POST /shelters"
              payload: { name: "Shelter" }
              as: ShelterAdmin
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ShelterAdmin
            - call: "POST /foster-homes"
              payload: { contact_name: "Home1", max_concurrent: 2, cooldown_days: 0 }
              as: FosterCoordinator
              captures: { home_id: $.data.id }
            - call: "POST /animals"
              payload: { name: "Loop", species: "CAT", age_months: 30 }
              as: IntakeOfficer
              captures: { animal_id: $.data.id }
            - call: "POST /intake-records"
              payload: { animal_id: "${animal_id}", source: "SURRENDER", surrendering_party: "Ivy" }
              as: IntakeOfficer
            - call: "POST /medical-records"
              payload: { animal_id: "${animal_id}", record_type: "EXAM", outcome: "CLEAR" }
              as: Veterinarian
            - call: "POST /animals/${animal_id}/make-available"
              payload: {}
              as: AdoptionCounselor
            - call: "POST /foster-placements"
              payload: { foster_home_id: "${home_id}", animal_id: "${animal_id}" }
              as: FosterCoordinator
              captures: { fp1_id: $.data.id }
            - call: "POST /foster-placements/${fp1_id}/return"
              payload: {}
              as: FosterCoordinator
          trigger:
            - call: "POST /foster-placements"
              payload: { foster_home_id: "${home_id}", animal_id: "${animal_id}" }
              as: FosterCoordinator
              captures: { fp2_id: $.data.id }
          assert:
            - "FosterPlacement.${fp1_id}.status == RETURNED"
            - "FosterPlacement.${fp2_id}.status == ACTIVE"
            - "Animal.${animal_id}.lifecycle_status == FOSTERED"

  # =================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =================================================================
  - rule_id: transitive_cascade
    instances:
      - name: finalize_cascade_depth4_app_animal_kennel_occupancy
        grounds:
          - state_machines.AdoptionApplication.APPROVED_to_FINALIZED
          - state_machines.Animal.AVAILABLE_to_ADOPTED
          - state_machines.KennelAssignment.ACTIVE_to_RELEASED
          - entities.Kennel.fields.occupied_count
        distinguishing_aspect: |
          Depth-4 chain, each link caused by the prior: finalize -> AdoptionApplication FINALIZED
          -> Animal ADOPTED -> the animal's ACTIVE KennelAssignment RELEASED -> Kennel.occupied_count
          decremented from 1 to 0.
        test_recipe:
          setup:
            - "Animal SURRENDER intake, kennel-assigned (Kennel.occupied_count=1), CLEARED, AVAILABLE"
            - "AdoptionApplication APPROVED"
          setup_api_calls:
            - call: "POST /shelters"
              payload: { name: "Shelter" }
              as: ShelterAdmin
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ShelterAdmin
            - call: "POST /kennels"
              payload: { label: "K-1", capacity: 1 }
              as: ShelterAdmin
              captures: { kennel_id: $.data.id, kennel_v: $.data.version }
            - call: "POST /animals"
              payload: { name: "Duke", species: "DOG", age_months: 40 }
              as: IntakeOfficer
              captures: { animal_id: $.data.id }
            - call: "POST /intake-records"
              payload: { animal_id: "${animal_id}", source: "SURRENDER", surrendering_party: "Sam" }
              as: IntakeOfficer
            - call: "POST /kennel-assignments"
              payload: { kennel_id: "${kennel_id}", animal_id: "${animal_id}", expected_kennel_version: "${kennel_v}" }
              as: IntakeOfficer
              captures: { ka_id: $.data.id }
            - call: "POST /medical-records"
              payload: { animal_id: "${animal_id}", record_type: "EXAM", outcome: "CLEAR" }
              as: Veterinarian
            - call: "POST /animals/${animal_id}/make-available"
              payload: {}
              as: AdoptionCounselor
            - call: "POST /adopter-accounts"
              payload: { full_name: "Dee", email: "dee@x.com" }
              as: AdoptionCounselor
              captures: { adopter_id: $.data.id }
            - call: "POST /adoption-applications"
              payload: { animal_id: "${animal_id}", adopter_id: "${adopter_id}" }
              as: AdoptionCounselor
              captures: { app_id: $.data.id }
            - call: "POST /adoption-applications/${app_id}/approve"
              payload: {}
              as: AdoptionCounselor
          trigger:
            - call: "POST /adoption-applications/${app_id}/finalize"
              payload: {}
              as: AdoptionCounselor
          assert:
            - "AdoptionApplication.${app_id}.status == FINALIZED"
            - "Animal.${animal_id}.lifecycle_status == ADOPTED"
            - "KennelAssignment.${ka_id}.status == RELEASED"
            - "Kennel.${kennel_id}.occupied_count == 0"

      - name: owner_claim_approve_cascade_depth3_different_trigger
        grounds:
          - state_machines.OwnerClaim.PENDING_to_APPROVED
          - state_machines.Animal.IN_CUSTODY_to_RECLAIMED
          - state_machines.KennelAssignment.ACTIVE_to_RELEASED
        distinguishing_aspect: |
          Depth-3 chain from a different trigger (owner-claim approval, not finalize): approve
          claim -> Animal RECLAIMED -> ACTIVE KennelAssignment RELEASED -> Kennel.occupied_count
          decremented to 0.
        test_recipe:
          setup:
            - "Animal STRAY intake IN_CUSTODY, microchipped (CHIP-3003), kennel-assigned (occupied_count=1)"
            - "OwnerClaim PENDING with proof_chip_number=CHIP-3003"
          setup_api_calls:
            - call: "POST /shelters"
              payload: { name: "Shelter", stray_hold_days: 5 }
              as: ShelterAdmin
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ShelterAdmin
            - call: "POST /kennels"
              payload: { label: "K-2", capacity: 1 }
              as: ShelterAdmin
              captures: { kennel_id: $.data.id, kennel_v: $.data.version }
            - call: "POST /animals"
              payload: { name: "Bella", species: "DOG", age_months: 60 }
              as: IntakeOfficer
              captures: { animal_id: $.data.id }
            - call: "POST /intake-records"
              payload: { animal_id: "${animal_id}", source: "STRAY" }
              as: IntakeOfficer
            - call: "POST /microchips"
              payload: { animal_id: "${animal_id}", chip_number: "CHIP-3003", owner_name: "Owner O" }
              as: Veterinarian
            - call: "POST /kennel-assignments"
              payload: { kennel_id: "${kennel_id}", animal_id: "${animal_id}", expected_kennel_version: "${kennel_v}" }
              as: IntakeOfficer
              captures: { ka_id: $.data.id }
            - call: "POST /owner-claims"
              payload: { animal_id: "${animal_id}", claimant_name: "Owner O", proof_chip_number: "CHIP-3003" }
              as: ShelterAdmin
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /owner-claims/${claim_id}/approve"
              payload: {}
              as: ShelterAdmin
          assert:
            - "OwnerClaim.${claim_id}.status == APPROVED"
            - "Animal.${animal_id}.lifecycle_status == RECLAIMED"
            - "KennelAssignment.${ka_id}.status == RELEASED"
            - "Kennel.${kennel_id}.occupied_count == 0"

  # =================================================================
  # Rule 5 — Validation priority conflicts across different category pairs
  # =================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: make_available_state_beats_medical_clearance
        grounds:
          - validations[priority=5]
          - validations[priority=9]
        distinguishing_aspect: |
          Category pair state (priority 5) vs business_safety (priority 9): an animal that is still
          INTAKE_PENDING (never intaken, so make-available's from-state IN_CUSTODY is unmet) AND is
          medical_status UNEXAMINED (clearance unmet) returns ERR_INVALID_STATE (5), NOT
          ERR_NOT_MEDICALLY_CLEARED (9) — the lower-priority state check wins the dual failure.
        test_recipe:
          setup:
            - "Animal freshly registered (lifecycle_status INTAKE_PENDING, medical_status UNEXAMINED); no intake recorded"
            - "make-available therefore violates BOTH the state precondition (priority 5) and the medical-clearance rule (priority 9)"
          setup_api_calls:
            - call: "POST /shelters"
              payload: { name: "Shelter" }
              as: ShelterAdmin
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ShelterAdmin
            - call: "POST /animals"
              payload: { name: "Fresh", species: "CAT", age_months: 36 }
              as: IntakeOfficer
              captures: { animal_id: $.data.id }
          trigger:
            - call: "POST /animals/${animal_id}/make-available"
              payload: {}
              as: AdoptionCounselor
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Animal.${animal_id}.lifecycle_status == INTAKE_PENDING"

      - name: kennel_assign_existence_beats_occupancy
        grounds:
          - validations[priority=3]
          - validations[priority=10]
        distinguishing_aspect: |
          Category pair existence (priority 3) vs business_constraint occupancy (priority 10):
          a kennel-assignment whose animal_id does not exist AND whose kennel is FULL returns
          ERR_NOT_FOUND (3), NOT ERR_KENNEL_OCCUPIED (10) — existence is checked left-to-right
          before occupancy.
        test_recipe:
          setup:
            - "Kennel K capacity=1 already FULL (one ACTIVE assignment from animal A)"
            - "Trigger assignment references a non-existent animal_id and the FULL kennel"
          setup_api_calls:
            - call: "POST /shelters"
              payload: { name: "Shelter" }
              as: ShelterAdmin
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ShelterAdmin
            - call: "POST /kennels"
              payload: { label: "K-3", capacity: 1 }
              as: ShelterAdmin
              captures: { kennel_id: $.data.id, kennel_v: $.data.version }
            - call: "POST /animals"
              payload: { name: "A", species: "DOG", age_months: 36 }
              as: IntakeOfficer
              captures: { animal_a: $.data.id }
            - call: "POST /intake-records"
              payload: { animal_id: "${animal_a}", source: "SURRENDER", surrendering_party: "Z" }
              as: IntakeOfficer
            - call: "POST /kennel-assignments"
              payload: { kennel_id: "${kennel_id}", animal_id: "${animal_a}", expected_kennel_version: "${kennel_v}" }
              as: IntakeOfficer
            - call: "GET /kennels/${kennel_id}"
              payload: {}
              as: IntakeOfficer
              captures: { kennel_v2: $.data.version }
          trigger:
            - call: "POST /kennel-assignments"
              payload: { kennel_id: "${kennel_id}", animal_id: "00000000-0000-4000-8000-000000000000", expected_kennel_version: "${kennel_v2}" }
              as: IntakeOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

  # =================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: stray_hold_release_exact_instant_allows_make_available
        grounds:
          - calculations.stray_hold_release
          - validations[priority=8]
          - state_machines.Animal.IN_CUSTODY_to_AVAILABLE
        distinguishing_aspect: |
          Time-threshold boundary on make-available endpoint: at clock == stray_hold_release_at
          (>= passes) make-available succeeds; one second before it would return
          ERR_STRAY_HOLD_ACTIVE. Metric: datetime threshold crossing.
        test_recipe:
          setup:
            - "Shelter stray_hold_days=5; Animal STRAY intake at 2026-06-01T00:00:00Z -> release_at 2026-06-06T00:00:00Z"
            - "Animal medically CLEARED; clock set to EXACTLY 2026-06-06T00:00:00Z"
          setup_api_calls:
            - call: "POST /shelters"
              payload: { name: "Shelter", stray_hold_days: 5 }
              as: ShelterAdmin
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ShelterAdmin
            - call: "POST /animals"
              payload: { name: "Hold", species: "DOG", age_months: 40 }
              as: IntakeOfficer
              captures: { animal_id: $.data.id }
            - call: "POST /intake-records"
              payload: { animal_id: "${animal_id}", source: "STRAY" }
              as: IntakeOfficer
            - call: "POST /medical-records"
              payload: { animal_id: "${animal_id}", record_type: "EXAM", outcome: "CLEAR" }
              as: Veterinarian
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-06T00:00:00Z" }
              as: ShelterAdmin
          trigger:
            - call: "POST /animals/${animal_id}/make-available"
              payload: {}
              as: AdoptionCounselor
          assert:
            - "HTTP status == 200"
            - "Animal.${animal_id}.lifecycle_status == AVAILABLE"

      - name: foster_home_capacity_boundary_rejects_at_equality
        grounds:
          - calculations.foster_home_occupancy
          - validations[priority=11]
          - entities.FosterHome.fields.active_placement_count
        distinguishing_aspect: |
          Count-threshold boundary on the foster-placements endpoint (different metric and
          endpoint than the time boundary): with max_concurrent=1, the placement that would make
          active_placement_count reach 1 succeeds, and the next placement at equality
          (active_placement_count == max_concurrent) is rejected ERR_FOSTER_HOME_FULL.
        test_recipe:
          setup:
            - "FosterHome max_concurrent=1 cooldown_days=0; two AVAILABLE animals"
            - "First animal placed (active_placement_count=1)"
          setup_api_calls:
            - call: "POST /shelters"
              payload: { name: "Shelter" }
              as: ShelterAdmin
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ShelterAdmin
            - call: "POST /foster-homes"
              payload: { contact_name: "Cap1", max_concurrent: 1, cooldown_days: 0 }
              as: FosterCoordinator
              captures: { home_id: $.data.id }
            - call: "POST /animals"
              payload: { name: "An1", species: "CAT", age_months: 20 }
              as: IntakeOfficer
              captures: { a1: $.data.id }
            - call: "POST /intake-records"
              payload: { animal_id: "${a1}", source: "SURRENDER", surrendering_party: "Q" }
              as: IntakeOfficer
            - call: "POST /medical-records"
              payload: { animal_id: "${a1}", record_type: "EXAM", outcome: "CLEAR" }
              as: Veterinarian
            - call: "POST /animals/${a1}/make-available"
              payload: {}
              as: AdoptionCounselor
            - call: "POST /animals"
              payload: { name: "An2", species: "CAT", age_months: 22 }
              as: IntakeOfficer
              captures: { a2: $.data.id }
            - call: "POST /intake-records"
              payload: { animal_id: "${a2}", source: "SURRENDER", surrendering_party: "R" }
              as: IntakeOfficer
            - call: "POST /medical-records"
              payload: { animal_id: "${a2}", record_type: "EXAM", outcome: "CLEAR" }
              as: Veterinarian
            - call: "POST /animals/${a2}/make-available"
              payload: {}
              as: AdoptionCounselor
            - call: "POST /foster-placements"
              payload: { foster_home_id: "${home_id}", animal_id: "${a1}" }
              as: FosterCoordinator
          trigger:
            - call: "POST /foster-placements"
              payload: { foster_home_id: "${home_id}", animal_id: "${a2}" }
              as: FosterCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_FOSTER_HOME_FULL"

  # =================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: adoption_approve_requires_animal_medically_cleared
        grounds:
          - state_machines.AdoptionApplication.SUBMITTED_to_APPROVED
          - entities.Animal.fields.medical_status
          - validations[priority=9]
        distinguishing_aspect: |
          Entity pair AdoptionApplication -> Animal: approving the application is gated on the
          Animal's medical_status == CLEARED. With the animal AVAILABLE but medical NEEDS_TREATMENT,
          approve returns ERR_NOT_MEDICALLY_CLEARED.
        test_recipe:
          setup:
            - "Animal SURRENDER intake; CLEARED then made AVAILABLE; later a HOLD exam flips medical back to NEEDS_TREATMENT while still AVAILABLE"
            - "AdoptionApplication SUBMITTED"
          setup_api_calls:
            - call: "POST /shelters"
              payload: { name: "Shelter" }
              as: ShelterAdmin
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ShelterAdmin
            - call: "POST /animals"
              payload: { name: "Sick", species: "DOG", age_months: 30 }
              as: IntakeOfficer
              captures: { animal_id: $.data.id }
            - call: "POST /intake-records"
              payload: { animal_id: "${animal_id}", source: "SURRENDER", surrendering_party: "T" }
              as: IntakeOfficer
            - call: "POST /medical-records"
              payload: { animal_id: "${animal_id}", record_type: "EXAM", outcome: "CLEAR" }
              as: Veterinarian
            - call: "POST /animals/${animal_id}/make-available"
              payload: {}
              as: AdoptionCounselor
            - call: "POST /adopter-accounts"
              payload: { full_name: "Uli", email: "uli@x.com" }
              as: AdoptionCounselor
              captures: { adopter_id: $.data.id }
            - call: "POST /adoption-applications"
              payload: { animal_id: "${animal_id}", adopter_id: "${adopter_id}" }
              as: AdoptionCounselor
              captures: { app_id: $.data.id }
            - call: "POST /medical-records"
              payload: { animal_id: "${animal_id}", record_type: "EXAM", outcome: "HOLD" }
              as: Veterinarian
          trigger:
            - call: "POST /adoption-applications/${app_id}/approve"
              payload: {}
              as: AdoptionCounselor
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_NOT_MEDICALLY_CLEARED"
            - "Animal.${animal_id}.medical_status == NEEDS_TREATMENT"

      - name: kennel_assignment_requires_kennel_open
        grounds:
          - state_machines.KennelAssignment.none_to_ACTIVE
          - entities.Kennel.fields.status
          - validations[priority=10]
        distinguishing_aspect: |
          Entity pair KennelAssignment -> Kennel (a different pair than Application -> Animal):
          assigning to a kennel whose status is FULL (occupied_count == capacity) is rejected
          ERR_KENNEL_OCCUPIED; the assignment's validity depends on the Kennel's derived status.
        test_recipe:
          setup:
            - "Kennel capacity=1 already FULL via animal A's ACTIVE assignment; animal B IN_CUSTODY"
          setup_api_calls:
            - call: "POST /shelters"
              payload: { name: "Shelter" }
              as: ShelterAdmin
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ShelterAdmin
            - call: "POST /kennels"
              payload: { label: "K-4", capacity: 1 }
              as: ShelterAdmin
              captures: { kennel_id: $.data.id, kennel_v: $.data.version }
            - call: "POST /animals"
              payload: { name: "A", species: "DOG", age_months: 36 }
              as: IntakeOfficer
              captures: { a_id: $.data.id }
            - call: "POST /intake-records"
              payload: { animal_id: "${a_id}", source: "SURRENDER", surrendering_party: "Z" }
              as: IntakeOfficer
            - call: "POST /kennel-assignments"
              payload: { kennel_id: "${kennel_id}", animal_id: "${a_id}", expected_kennel_version: "${kennel_v}" }
              as: IntakeOfficer
            - call: "POST /animals"
              payload: { name: "B", species: "DOG", age_months: 38 }
              as: IntakeOfficer
              captures: { b_id: $.data.id }
            - call: "POST /intake-records"
              payload: { animal_id: "${b_id}", source: "SURRENDER", surrendering_party: "Y" }
              as: IntakeOfficer
            - call: "GET /kennels/${kennel_id}"
              payload: {}
              as: IntakeOfficer
              captures: { kennel_v2: $.data.version }
          trigger:
            - call: "POST /kennel-assignments"
              payload: { kennel_id: "${kennel_id}", animal_id: "${b_id}", expected_kennel_version: "${kennel_v2}" }
              as: IntakeOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_KENNEL_OCCUPIED"

  # =================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: kennel_half_open_single_occupancy_overlap
        grounds:
          - state_machines.KennelAssignment.none_to_ACTIVE
          - entities.KennelAssignment.fields.start_at
          - entities.KennelAssignment.fields.end_at
          - validations[priority=10]
        distinguishing_aspect: |
          Kennel interval semantics: half-open [start_at, end_at) single-occupancy — while one
          assignment is ACTIVE (end_at=null, i.e. open-ended), any second assignment on the same
          kennel overlaps and is rejected ERR_KENNEL_OCCUPIED. No buffer, capacity exactly 1.
        test_recipe:
          setup:
            - "Kennel capacity=1; animal A ACTIVE assignment occupying [2026-06-01, open)"
            - "Animal B IN_CUSTODY"
          setup_api_calls:
            - call: "POST /shelters"
              payload: { name: "Shelter" }
              as: ShelterAdmin
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ShelterAdmin
            - call: "POST /kennels"
              payload: { label: "K-5", capacity: 1 }
              as: ShelterAdmin
              captures: { kennel_id: $.data.id, kennel_v: $.data.version }
            - call: "POST /animals"
              payload: { name: "A", species: "CAT", age_months: 24 }
              as: IntakeOfficer
              captures: { a_id: $.data.id }
            - call: "POST /intake-records"
              payload: { animal_id: "${a_id}", source: "SURRENDER", surrendering_party: "M" }
              as: IntakeOfficer
            - call: "POST /kennel-assignments"
              payload: { kennel_id: "${kennel_id}", animal_id: "${a_id}", expected_kennel_version: "${kennel_v}" }
              as: IntakeOfficer
            - call: "POST /animals"
              payload: { name: "B", species: "CAT", age_months: 26 }
              as: IntakeOfficer
              captures: { b_id: $.data.id }
            - call: "POST /intake-records"
              payload: { animal_id: "${b_id}", source: "SURRENDER", surrendering_party: "N" }
              as: IntakeOfficer
            - call: "GET /kennels/${kennel_id}"
              payload: {}
              as: IntakeOfficer
              captures: { kennel_v2: $.data.version }
          trigger:
            - call: "POST /kennel-assignments"
              payload: { kennel_id: "${kennel_id}", animal_id: "${b_id}", expected_kennel_version: "${kennel_v2}" }
              as: IntakeOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_KENNEL_OCCUPIED"

      - name: foster_cooldown_buffer_rejects_within_gap
        grounds:
          - state_machines.FosterPlacement.none_to_ACTIVE
          - entities.FosterHome.fields.cooldown_days
          - validations[priority=12]
        distinguishing_aspect: |
          FosterHome interval semantics differ from the kennel: closed interval [start,end] PLUS
          a cooldown_days buffer reserved after end_at. A new placement whose start_at falls within
          cooldown_days of the prior RETURNED placement's end_at is rejected ERR_FOSTER_COOLDOWN —
          even though aggregate capacity is free.
        test_recipe:
          setup:
            - "FosterHome max_concurrent=2 cooldown_days=3; animal A placed then returned at 2026-06-02"
            - "Clock advanced to 2026-06-03 (only 1 day after return, < 3-day cooldown)"
          setup_api_calls:
            - call: "POST /shelters"
              payload: { name: "Shelter" }
              as: ShelterAdmin
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ShelterAdmin
            - call: "POST /foster-homes"
              payload: { contact_name: "Cool", max_concurrent: 2, cooldown_days: 3 }
              as: FosterCoordinator
              captures: { home_id: $.data.id }
            - call: "POST /animals"
              payload: { name: "A", species: "DOG", age_months: 30 }
              as: IntakeOfficer
              captures: { a_id: $.data.id }
            - call: "POST /intake-records"
              payload: { animal_id: "${a_id}", source: "SURRENDER", surrendering_party: "P" }
              as: IntakeOfficer
            - call: "POST /medical-records"
              payload: { animal_id: "${a_id}", record_type: "EXAM", outcome: "CLEAR" }
              as: Veterinarian
            - call: "POST /animals/${a_id}/make-available"
              payload: {}
              as: AdoptionCounselor
            - call: "POST /foster-placements"
              payload: { foster_home_id: "${home_id}", animal_id: "${a_id}" }
              as: FosterCoordinator
              captures: { fp1: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-02T00:00:00Z" }
              as: ShelterAdmin
            - call: "POST /foster-placements/${fp1}/return"
              payload: {}
              as: FosterCoordinator
            - call: "POST /animals"
              payload: { name: "B", species: "DOG", age_months: 32 }
              as: IntakeOfficer
              captures: { b_id: $.data.id }
            - call: "POST /intake-records"
              payload: { animal_id: "${b_id}", source: "SURRENDER", surrendering_party: "Q" }
              as: IntakeOfficer
            - call: "POST /medical-records"
              payload: { animal_id: "${b_id}", record_type: "EXAM", outcome: "CLEAR" }
              as: Veterinarian
            - call: "POST /animals/${b_id}/make-available"
              payload: {}
              as: AdoptionCounselor
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-03T00:00:00Z" }
              as: ShelterAdmin
          trigger:
            - call: "POST /foster-placements"
              payload: { foster_home_id: "${home_id}", animal_id: "${b_id}" }
              as: FosterCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_FOSTER_COOLDOWN"

  # =================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =================================================================
  - rule_id: compensating_invariant
    instances:
      - name: refund_restores_shelter_fee_ledger_money_invariant
        grounds:
          - state_machines.AdoptionApplication.FINALIZED_to_REFUNDED
          - entities.Shelter.fields.collected_fee_cents
          - calculations.adoption_fee
        distinguishing_aspect: |
          Conserved quantity = money (Shelter.collected_fee_cents). Invariant:
          Shelter.collected_fee_cents == sum of final_fee_cents over FINALIZED, non-refunded
          applications. Finalize (+15000) then refund (-15000) returns the ledger to 0 — no drift.
        test_recipe:
          setup:
            - "Animal DOG age 36 SURRENDER, microchipped, CLEARED, AVAILABLE; application APPROVED then FINALIZED -> Shelter.collected_fee_cents=15000"
          setup_api_calls:
            - call: "POST /shelters"
              payload: { name: "Shelter", promo_active: false }
              as: ShelterAdmin
              captures: { shelter_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ShelterAdmin
            - call: "POST /animals"
              payload: { name: "Ledger", species: "DOG", age_months: 36 }
              as: IntakeOfficer
              captures: { animal_id: $.data.id }
            - call: "POST /intake-records"
              payload: { animal_id: "${animal_id}", source: "SURRENDER", surrendering_party: "L" }
              as: IntakeOfficer
            - call: "POST /microchips"
              payload: { animal_id: "${animal_id}", chip_number: "CHIP-4004" }
              as: Veterinarian
            - call: "POST /medical-records"
              payload: { animal_id: "${animal_id}", record_type: "EXAM", outcome: "CLEAR" }
              as: Veterinarian
            - call: "POST /animals/${animal_id}/make-available"
              payload: {}
              as: AdoptionCounselor
            - call: "POST /adopter-accounts"
              payload: { full_name: "Mo", email: "mo@x.com" }
              as: AdoptionCounselor
              captures: { adopter_id: $.data.id }
            - call: "POST /adoption-applications"
              payload: { animal_id: "${animal_id}", adopter_id: "${adopter_id}" }
              as: AdoptionCounselor
              captures: { app_id: $.data.id }
            - call: "POST /adoption-applications/${app_id}/approve"
              payload: {}
              as: AdoptionCounselor
            - call: "POST /adoption-applications/${app_id}/finalize"
              payload: {}
              as: AdoptionCounselor
          trigger:
            - call: "POST /adoption-applications/${app_id}/refund"
              payload: {}
              as: ShelterAdmin
          assert:
            - "AdoptionApplication.${app_id}.status == REFUNDED"
            - "AdoptionApplication.${app_id}.refunded == true"
            - "Shelter.${shelter_id}.collected_fee_cents == 0"

      - name: kennel_release_restores_occupancy_count_invariant
        grounds:
          - state_machines.KennelAssignment.none_to_ACTIVE
          - state_machines.KennelAssignment.ACTIVE_to_RELEASED
          - entities.Kennel.fields.occupied_count
        distinguishing_aspect: |
          Conserved quantity = kennel occupancy count (a different conserved quantity than money):
          invariant Kennel.occupied_count == count of ACTIVE KennelAssignments. Assign (+1) then
          release (-1) returns occupied_count to 0 with status back to OPEN.
        test_recipe:
          setup:
            - "Kennel capacity=1; animal SURRENDER intake; assignment created -> occupied_count=1, status FULL"
          setup_api_calls:
            - call: "POST /shelters"
              payload: { name: "Shelter" }
              as: ShelterAdmin
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ShelterAdmin
            - call: "POST /kennels"
              payload: { label: "K-6", capacity: 1 }
              as: ShelterAdmin
              captures: { kennel_id: $.data.id, kennel_v: $.data.version }
            - call: "POST /animals"
              payload: { name: "Occ", species: "DOG", age_months: 36 }
              as: IntakeOfficer
              captures: { animal_id: $.data.id }
            - call: "POST /intake-records"
              payload: { animal_id: "${animal_id}", source: "SURRENDER", surrendering_party: "O" }
              as: IntakeOfficer
            - call: "POST /kennel-assignments"
              payload: { kennel_id: "${kennel_id}", animal_id: "${animal_id}", expected_kennel_version: "${kennel_v}" }
              as: IntakeOfficer
              captures: { ka_id: $.data.id }
          trigger:
            - call: "POST /kennel-assignments/${ka_id}/release"
              payload: {}
              as: IntakeOfficer
          assert:
            - "KennelAssignment.${ka_id}.status == RELEASED"
            - "Kennel.${kennel_id}.occupied_count == 0"
            - "Kennel.${kennel_id}.status == OPEN"
