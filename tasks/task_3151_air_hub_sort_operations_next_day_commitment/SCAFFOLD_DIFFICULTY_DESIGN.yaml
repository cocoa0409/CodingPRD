              as: SortOperator
              captures: { pkg_f1: $.data.id }
            - &k_pkg_f2
              call: "POST /airhub/packages"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac1_id}", tracking_number: "1Z-F-0002", commodity_class: "GENERAL", destination_hub_code: "LAX", service_level: "NEXT_DAY_AIR", planned_weight_grams: 55000, dimension_weight_grams: 55000 }
              as: SortOperator
              captures: { pkg_f2: $.data.id }
            - call: "POST /airhub/packages/${pkg_f1}/induct"
              payload: { dimension_weight_grams: 50000 }
              as: SortOperator
            - call: "POST /airhub/packages/${pkg_f2}/induct"
