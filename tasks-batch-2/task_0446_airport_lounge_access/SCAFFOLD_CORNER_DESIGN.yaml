              payload: { member_id: "${ma_id}", card_status: "BASIC", fare_class: "ECONOMY", valid_until: "2027-01-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", full_name: "Occ B" }
              as: NetworkAdmin
              captures: { mb_id: $.data.id }
            - call: "POST /eligibility-cards"
              payload: { member_id: "${mb_id}", card_status: "BASIC", fare_class: "ECONOMY", valid_until: "2027-01-01T00:00:00Z" }
