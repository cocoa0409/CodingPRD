              captures: { rpt_id: $.data.id }
          trigger:
            - call: "POST /station/nffs-reports/${rpt_id}/finalize"
              payload: {}
              as: MembershipCoordinator
              as_user_id: "coord-8002"
              captures: { err_code: $.data.error_id }
          assert:
            - "${err_code} == ERR_UNAUTHORIZED (role denial fires at priority 2 before the SoD check)"

      - name: unauthenticated_request_missing_headers
        claim_type: rbac_denial
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request without X-User-Role/X-User-ID headers is rejected with ERR_UNAUTHENTICATED (401) before any other check."
        test_recipe:
