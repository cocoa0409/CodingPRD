            - "the second motion moved on the now-stale ${pv1} returns HTTP 412 with error_id == \"ERR_STALE_ELEMENT_VERSION\", even though a second amendment on the same element is entirely legitimate"
            - "the same motion re-moved on ${pv2} returns HTTP 201, and the element's version advances again to ${pv3} == ${pv2} + 1"
            - "the motion aimed at plan B's element returns HTTP 409 with error_id == \"ERR_CROSS_PLAN_AMENDMENT\" - the foreign element is APPROVED and its token ${fv} is CORRECT, so ownership is the only violation left and the 412 path cannot mask it"
            - "the RECOMMEND attempted while both motions are PROPOSED returns HTTP 409 with error_id == \"ERR_UNRESOLVED_AMENDMENTS\": the hearing is OPEN and the plan is STATE_CERTIFIED with a CERTIFIED review, so priority 74 is the only rule that can fire"
            - "withdrawing the second motion returns HTTP 200 with status \"WITHDRAWN\" and leaves policy_count at 6 - a withdrawal touches no element field"
            - "adopting the WITHDRAWN motion returns HTTP 409 error_id == \"ERR_AMENDMENT_NOT_PROPOSED\" and rescinding it returns HTTP 409 error_id == \"ERR_AMENDMENT_NOT_ADOPTED\": the same row yields two different wrong-status ids depending on the transition attempted"
            - "adopting the first motion under the proposing clerk's own X-User-ID returns HTTP 403 error_id == \"ERR_SEGREGATION_OF_DUTIES\" - the third arm of the duty split, after inventory certification and element review"
            - "adopting it as a different clerk returns HTTP 200 with status \"ADOPTED\", applied_policy_count == 8 and prior_element_status == \"APPROVED\""
            - "the element now reads policy_count == 8, status \"APPROVED\" and consistency_status \"STALE\", with version ${pv4} > ${pv3}"
            - "the motion striking 20 policies is accepted as PROPOSED - the arithmetic is only checked at adoption - and its adoption returns HTTP 409 with error_id == \"ERR_POLICY_COUNT_NEGATIVE\" because 8 + (-20) < 0"
            - "rescinding the adopted motion returns HTTP 200 with status \"RESCINDED\"; the element is back to policy_count == 6 with status \"APPROVED\" restored from prior_element_status and consistency_status recomputed to \"CLEARED\" - policy_count_conservation holds exactly, with no drift from the +2 / -2 round trip"
            - "the compliance summary still reports open_consistency_link_count == 0 and compliance_posture \"CLEAR\": no CLEARED link targeted the parks element, so the adoption cascade had no link to stale"
            - "the closing RECOMMEND returns HTTP 200 with outcome \"RECOMMEND\", and the plan reaches status \"COMMISSION_RECOMMENDED\" - three amendments exist but none is PROPOSED, so WITHDRAWN and RESCINDED both count as resolved"
            - "the hearing reports amendment_count == 3 and adopted_amendment_count == 0 - the adopt incremented the counter and the rescind decremented it back"

      - name: open_link_counter_tracks_every_link_write
        claim_type: derived_field_reconciliation
        grounds:
          - entities.PlanUpdate.open_consistency_link_count
          - entities.PlanElement.consistency_status
          - calculations.compliance_posture
          - state_machines.ConsistencyLink
          - errors[ERR_TARGET_ELEMENT_NOT_REVIEWABLE]
        distinguishing_aspect: |
          open_consistency_link_count is declared to count links whose status is in {OPEN, STALE},
          which is the definition an implementation most often gets wrong by counting "not CLEARED"
          or by incrementing on create and never recomputing. The counter is also the first input of
          compliance_posture, so an off-by-one here silently unblocks or blocks the whole adoption
          path - which makes it worth reconciling after every single write that can touch it rather
          than only at the end.
          The instance walks create, create, reconcile, reconcile and checks the counter, the two
          source elements' consistency_status and the posture after each step. The subtle part is
          asymmetry: a link may be CREATED against a DRAFT target, but it may not be RECONCILED
          against one - the target must have reached IN_REVIEW, APPROVED or ADOPTED. So the same pair
          of elements produces a legal create and an illegal reconcile with no state change in
          between, and the reconcile becomes legal only after the TARGET (not the source) is
          submitted for review. It also pins that the source element only flips to CLEARED when ALL
          of its own links are cleared, and that when the counter reaches 0 the posture moves off
          CONSISTENCY_HOLD to the next unmet gate in the precedence chain - CAPACITY_HOLD, because
          this plan has no adopted scenario - rather than to CLEAR.
        test_recipe:
          setup:
            - "One DRAFTING plan with three DRAFT elements: LAND_USE, TRANSPORTATION and PARKS, each with policy_count 3. No scenario is adopted and no allocations exist."
          setup_api_calls:
            - call: "POST /planning/plan-updates"
              payload: { title: "Horizon 2045 General Plan", jurisdiction_code: "CA-0451", base_year: 2025, horizon_year: 2045 }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { pu: $.data.id }
            - call: "POST /planning/plan-elements"
              payload: { plan_update_id: "${pu}", element_type: "LAND_USE", title: "Land Use Element", draft_body: "Centers and corridors.", policy_count: 3 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { el_lu: $.data.id }
            - call: "POST /planning/plan-elements"
              payload: { plan_update_id: "${pu}", element_type: "TRANSPORTATION", title: "Mobility Element", draft_body: "Network plan.", policy_count: 3 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { el_tra: $.data.id }
            - call: "POST /planning/plan-elements"
              payload: { plan_update_id: "${pu}", element_type: "PARKS", title: "Parks Element", draft_body: "Open space standards.", policy_count: 3 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { el_par: $.data.id }
          trigger:
            - call: "GET /planning/plan-updates/${pu}/compliance-summary"
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { c0: $.data.open_consistency_link_count, p0: $.data.compliance_posture }
            - call: "POST /planning/consistency-links"
              payload: { source_element_id: "${el_tra}", target_element_id: "${el_lu}", dependency_type: "LEVEL_OF_SERVICE" }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { lk1: $.data.id, lk1_st: $.data.status }
            - call: "GET /planning/plan-updates/${pu}/compliance-summary"
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { c1: $.data.open_consistency_link_count, p1: $.data.compliance_posture }
            - call: "POST /planning/consistency-links"
              payload: { source_element_id: "${el_par}", target_element_id: "${el_lu}", dependency_type: "POLICY_ALIGNMENT" }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { lk2: $.data.id }
            - call: "GET /planning/plan-updates/${pu}/compliance-summary"
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { c2: $.data.open_consistency_link_count }
            - call: "POST /planning/consistency-links/${lk2}/reconcile"
              payload: { reconciliation_note: "Parks policies aligned to the land use map." }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { e_target: $.data.error_id }
            - call: "GET /planning/plan-updates/${pu}/compliance-summary"
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { c2b: $.data.open_consistency_link_count }
            - call: "POST /planning/plan-elements/${el_lu}/submit-review"
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { lu_st: $.data.status }
            - call: "POST /planning/consistency-links/${lk2}/reconcile"
              payload: { reconciliation_note: "Parks policies aligned to the land use map." }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { lk2_st: $.data.status, lk2_by: $.data.reconciled_by_user_id }
            - call: "GET /planning/plan-elements/${el_par}"
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { par_cs: $.data.consistency_status }
            - call: "GET /planning/plan-elements/${el_tra}"
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { tra_cs: $.data.consistency_status }
            - call: "GET /planning/plan-updates/${pu}/compliance-summary"
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { c3: $.data.open_consistency_link_count, p3: $.data.compliance_posture }
            - call: "POST /planning/consistency-links/${lk1}/reconcile"
              payload: { reconciliation_note: "Mobility LOS realigned to the land use capacity." }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { lk1_cleared: $.data.status }
            - call: "GET /planning/plan-elements/${el_tra}"
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { tra_cs2: $.data.consistency_status }
            - call: "GET /planning/plan-updates/${pu}/compliance-summary"
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { c4: $.data.open_consistency_link_count, p4: $.data.compliance_posture }
            - call: "GET /planning/consistency-links"
              as: PlanningStaff
              as_user_id: "staff-1"
          assert:
            - "before any link exists the counter is 0 and the posture is \"CAPACITY_HOLD\" - the plan has no adopted scenario, so consistency is not yet the blocking gate"
            - "the first link is created with status \"OPEN\" and the counter becomes 1 with posture \"CONSISTENCY_HOLD\": open links outrank the capacity gate in the precedence chain"
            - "the second link takes the counter to 2 - creation is legal even though the shared TARGET element is still DRAFT"
            - "reconciling that link while the target is DRAFT returns HTTP 409 with error_id == \"ERR_TARGET_ELEMENT_NOT_REVIEWABLE\", and the counter is still 2 afterwards - the refused reconcile changed nothing"
            - "the gate is on the TARGET, not the source: submitting the LAND_USE element for review (status \"IN_REVIEW\") makes the identical reconcile succeed with status \"CLEARED\" and reconciled_by_user_id == \"director-1\""
            - "the counter recomputes to 1 while the posture is still \"CONSISTENCY_HOLD\" - one open link is enough to hold the plan"
            - "the PARKS element's consistency_status is now \"CLEARED\" because every link it sources is cleared, while the TRANSPORTATION element is still \"PENDING\" - the source flag is per-element, not per-plan"
            - "reconciling the last link takes the counter to 0, flips the TRANSPORTATION element to \"CLEARED\", and moves the posture to \"CAPACITY_HOLD\" - the next unmet gate, NOT \"CLEAR\""
            - "the link list reports total_count == 2 with both rows in status \"CLEARED\", so the counter's 0 is a recomputation over statuses and not a decrement of a create-time tally"

      - name: amendment_adoption_depth_five_cascade
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Amendment.PROPOSED_to_ADOPTED.side_effects
          - complexity_profile.complexity_layers
        distinguishing_aspect: |
          The deepest cascade in the API - element policy_count and consistency_status, then CLEARED
          links to STALE, then their source elements, then the plan's counter and posture, then
          SCHEDULED hearings to BLOCKED - is already driven end to end, in order, with the
          intermediate values checked at each depth, by the difficulty instance cited below. The
          compensating direction (rescission unwinding all five links) is covered there too, and the
          OCC/register instance above reuses the same trigger for its version arithmetic, so a third
          walk of the chain would add cost without adding a new claim.
        excluded_because:
          difficulty_instance: amendment_adoption_five_link_consistency_cascade
          rationale: |
            That instance is precisely this claim: it adopts an amendment against an element that is
            the target of a CLEARED link and asserts each of the five links of the chain separately,
            including the ordering-sensitive one (the hearing may only be BLOCKED after the posture
            has been recomputed). Duplicating it here would restate the same assertions against the
            same endpoints.

      - name: capacity_variant_divergence_on_identical_acreage
        claim_type: dual_variant_calculation
        grounds:
          - calculations.land_capacity_units.variants
          - complexity_profile.complexity_layers
        distinguishing_aspect: |
          The dual-variant layer in this API is land_capacity_units: GROSS_CAPACITY for a TREND
          scenario and NET_CAPACITY for a POLICY scenario, computed from the same certified acreage
          and diverging by 4585 units, which then propagates into the housing waterfall's pool and
          can flip the plan's compliance posture. Both variants, the exact delta and the selection
          rule are driven by the difficulty instance cited below, and the OCC instance above already
          creates one scenario of each method against a single dataset as a side benefit of its
          token ladder.
        excluded_because:
          difficulty_instance: land_capacity_gross_vs_net_variant_divergence
          rationale: |
            That instance pins 11700 against 7115 on identical inputs, the constrained-acre and
            underutilised-share terms that only the NET variant applies, and the variant selection
            keyed on method - the whole content of this claim type. Re-testing it here would only
            re-derive the same two numbers.

  - section: consistency_model
    instances:
      - name: every_derived_field_is_readable_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.housing_allocation_waterfall
          - calculations.land_capacity_units
          - calculations.compliance_posture
          - state_machines.GrowthScenario.DRAFT_to_ADOPTED.side_effects
        distinguishing_aspect: |
          The consistency model is immediate, and the two writes that make that expensive are scenario
          creation (which computes three fields onto its own row) and scenario adoption (which
          recomputes four fields on each of FOUR HousingAllocation rows, plus two fields on the plan,
          none of which is the row being written). An implementation that defers the fan-out to the
          next read of each allocation, or that recomputes the plan's total lazily, passes every
          single-entity test and fails here.
          The instance pins three distinct visibility claims. First, read-your-own-write: the
          scenario's POST response already carries land_capacity_units, capacity_variant and
          capacity_gap_units - no follow-up GET is needed to see them. Second, cross-entity fan-out:
          the FIRST read of the ABOVE_MODERATE allocation after the adopt already shows its waterfall
          result, so the recomputation happened inside the adopting request rather than on access.
          Third, stability: repeating the same read returns identical values, so nothing converges
          afterwards - which distinguishes immediate from eventual consistency, where a re-read is
          exactly what fixes a lagging field.
          The chosen numbers make a lazy implementation visible: the allocations are created BEFORE
          any scenario exists, so their waterfall fields start unresolved and can only be filled by
          the adopt's fan-out, and the POLICY pool of 7115 leaves a shortfall of exactly 4284 on the
          top tier - a value no other tier and no partial recomputation can produce.
        test_recipe:
          setup:
            - "One DRAFTING plan with horizon_year 2045 and all four inventory types CERTIFIED, the LAND_USE one carrying vacant 400, underutilized 250, constrained 100 and density 18."
            - "All four HousingAllocation rows created first, at 900 / 700 / 800 / 9000, while the plan still has no adopted scenario."
          setup_api_calls:
            - call: "POST /planning/plan-updates"
              payload: { title: "Horizon 2045 General Plan", jurisdiction_code: "CA-0451", base_year: 2025, horizon_year: 2045 }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { pu: $.data.id }
            - call: "POST /planning/inventory-datasets"
              payload: { plan_update_id: "${pu}", inventory_type: "DEMOGRAPHIC", vintage_year: 2025, record_count: 1200 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { i_dem: $.data.id }
            - call: "POST /planning/inventory-datasets"
              payload: { plan_update_id: "${pu}", inventory_type: "HOUSING", vintage_year: 2025, record_count: 900 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { i_hou: $.data.id }
            - call: "POST /planning/inventory-datasets"
              payload: { plan_update_id: "${pu}", inventory_type: "EMPLOYMENT", vintage_year: 2025, record_count: 700 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { i_emp: $.data.id }
            - call: "POST /planning/inventory-datasets"
              payload: { plan_update_id: "${pu}", inventory_type: "LAND_USE", vintage_year: 2025, vacant_acres: 400, underutilized_acres: 250, infrastructure_constrained_acres: 100, allowed_density_units_per_acre: 18 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { i_lu: $.data.id }
            - call: "POST /planning/inventory-datasets/${i_dem}/certify"
              as: PlanningDirector
              as_user_id: "director-1"
            - call: "POST /planning/inventory-datasets/${i_hou}/certify"
              as: PlanningDirector
              as_user_id: "director-1"
            - call: "POST /planning/inventory-datasets/${i_emp}/certify"
              as: PlanningDirector
              as_user_id: "director-1"
            - call: "POST /planning/inventory-datasets/${i_lu}/certify"
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { lu_v: $.data.version }
            - call: "POST /planning/housing-allocations"
              payload: { plan_update_id: "${pu}", income_tier: "VERY_LOW", assigned_units: 900, cycle_deadline: "2031-06-30T00:00:00Z" }
              as: StateReviewer
              as_user_id: "state-1"
            - call: "POST /planning/housing-allocations"
              payload: { plan_update_id: "${pu}", income_tier: "LOW", assigned_units: 700, cycle_deadline: "2031-06-30T00:00:00Z" }
              as: StateReviewer
              as_user_id: "state-1"
            - call: "POST /planning/housing-allocations"
              payload: { plan_update_id: "${pu}", income_tier: "MODERATE", assigned_units: 800, cycle_deadline: "2031-06-30T00:00:00Z" }
              as: StateReviewer
              as_user_id: "state-1"
            - call: "POST /planning/housing-allocations"
              payload: { plan_update_id: "${pu}", income_tier: "ABOVE_MODERATE", assigned_units: 9000, cycle_deadline: "2031-06-30T00:00:00Z" }
              as: StateReviewer
              as_user_id: "state-1"
              captures: { al_am: $.data.id, al_am_short: $.data.shortfall_units }
          trigger:
            - call: "GET /planning/plan-updates/${pu}/compliance-summary"
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { pre_short: $.data.housing_shortfall_total, pre_post: $.data.compliance_posture }
            - call: "POST /planning/growth-scenarios"
              payload: { plan_update_id: "${pu}", land_use_inventory_id: "${i_lu}", expected_inventory_version: "${lu_v}", label: "Policy 2045", method: "POLICY", horizon_year: 2045, base_households: 20000, annual_household_growth_rate: 0.012, job_growth_total: 15000, demolition_replacement_units: 500 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { sc: $.data.id, sc_cap: $.data.land_capacity_units, sc_var: $.data.capacity_variant, sc_dem: $.data.projected_demand_units, sc_gap: $.data.capacity_gap_units }
            - call: "GET /planning/growth-scenarios/${sc}"
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { sc_cap2: $.data.land_capacity_units, sc_gap2: $.data.capacity_gap_units }
            - call: "POST /planning/growth-scenarios/${sc}/adopt"
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { sc_st: $.data.status }
            - call: "GET /planning/plan-updates/${pu}/housing-allocations"
              payload: { income_tier: "ABOVE_MODERATE" }
              as: PlanningDirector
              as_user_id: "director-1"
            - call: "GET /planning/plan-updates/${pu}/compliance-summary"
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { post_short: $.data.housing_shortfall_total, post_cap: $.data.land_capacity_units, post_post: $.data.compliance_posture }
            - call: "GET /planning/plan-updates/${pu}/compliance-summary"
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { post_short2: $.data.housing_shortfall_total, post_post2: $.data.compliance_posture }
            - call: "GET /planning/plan-updates/${pu}/housing-allocations"
              as: PlanningDirector
              as_user_id: "director-1"
            - call: "GET /planning/plan-updates/${pu}"
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { pu_short: $.data.housing_shortfall_total, pu_sc: $.data.adopted_scenario_id }
          assert:
            - "before the scenario exists the plan reports housing_shortfall_total == 0 with posture \"CAPACITY_HOLD\" - the allocations were accepted but no pool has been computed for them yet"
            - "the scenario's own POST response already carries land_capacity_units == 7115, capacity_variant == \"NET_CAPACITY\" and a capacity_gap_units equal to max(projected_demand_units - 7115, 0) computed from that same body - read-your-own-write with no follow-up GET"
            - "the immediately following GET of the scenario returns byte-identical values for land_capacity_units and capacity_gap_units"
            - "the FIRST read of the ABOVE_MODERATE allocation after the adopt - a tier-filtered list returning total_count == 1 - already shows tier_capacity_units == 2135, carryover_in_units == 2581, accommodated_units == 4716 and shortfall_units == 4284: the four-row fan-out ran inside the adopting request, not on access"
            - "the plan's compliance summary read immediately after the adopt reports housing_shortfall_total == 4284, land_capacity_units == 7115 and posture \"CAPACITY_HOLD\" - three fields on a THIRD entity, all current on the first read"
            - "repeating the identical summary read returns identical values: nothing converges after the fact, which is what separates immediate from eventual consistency"
            - "the unfiltered allocation list returns all four rows with shortfall_units 0 / 0 / 0 / 4284 in TIER_ORDER, matching the tier-filtered read exactly - the list projection and the filtered read agree without a second recomputation"
            - "the plan row itself reports housing_shortfall_total == 4284 and adopted_scenario_id == ${sc}, so the denormalised copy on the aggregate root is written in the same request as the calculation"
