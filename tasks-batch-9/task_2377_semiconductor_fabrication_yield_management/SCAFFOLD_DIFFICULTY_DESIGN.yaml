              captures: { flow_b_tsh: $.data.total_standard_hours }
            - call: "POST /fab/wafer-start-plans"
              payload: { flow_id: "${flow_b}", product_family: "LOGIC_N7", week_start_date: "2026-08-03T00:00:00Z", planned_wafer_starts: 62, capacity_budget_hours: 500.0, cycle_time_target_days: 4.0 }
              as: FabPlanner
