  - rule_id: compensating_invariant
    instances:
      - name: denial_clawback_restores_limit_conservation
        grounds:
          - state_machines.Claim.DEFENSE_ADVANCING_to_DENIED
          - state_machines.DefenseInvoice.ADVANCED_to_CLAWED_BACK
          - state_machines.DefenseInvoice.SUBMITTED_to_VOIDED
          - calculations.defense_advancement_waterfall
          - calculations.tower_placement_posture
          - entities.Policy.fields.total_eroded_usd
          - entities.Policy.fields.aggregate_remaining_usd
        distinguishing_aspect: |
          Conserved quantity #1 — the policy limit ledger: shared_aggregate_limit_usd ==
          total_eroded_usd + aggregate_remaining_usd must hold before, during and after the reversal,
          and total_eroded_usd must land back on its exact pre-advancement value of 0.00 rather than
          merely near it. The late denial is a compensating action that has to unwind four layers of
          side effect (invoice, claim counters, coverage part status, layer status) and re-derive
          tower_posture from ERODED back to CONTIGUOUS.
        test_recipe:
          setup:
            - "One bound Policy of Vantiq Bio Inc: shared_aggregate_limit_usd 5,000,000, retention 250,000, no Side C sublimit, program target 10,000,000, gross_premium_usd 119,428.57, premium_status INVOICED (no ops run is taken, so the premium never becomes DELINQUENT)."
            - "A two-band tower: primary at attachment 0 with limit 5,000,000, and an excess band at attachment 5,000,000 with limit 5,000,000, both FOLLOWING_FORM at participation 1.00, so tower_posture is CONTIGUOUS."
            - "Clock at 2026-09-02T00:00:00Z; one SECURITIES_CLASS_ACTION Claim in DEFENSE_ADVANCING with allocation_method RELATIVE_EXPOSURE."
            - "DefenseInvoice A for 5,250,000 all covered has been ALLOCATED, exhausting the retention and the whole SIDE_B limit; DefenseInvoice B for 100,000 is still SUBMITTED."
          setup_api_calls:
            - call: "POST /dno/insureds"
              payload: { legal_name: "Vantiq Bio Inc", sector_code: "BIOTECH", exchange_listing: "LISTED", market_cap_usd: 1800000000, fiscal_year_end: "12-31", entity_capacity_cap_usd: 25000000 }
              as: Underwriter
              captures: { insured_id: "$.data.id" }
            - call: "POST /dno/insureds/${insured_id}/disclosure-packages"
              payload: { fiscal_year: 2025, filed_date: "2026-03-01T00:00:00Z", restatement_flag: true, material_weakness_count: 1, going_concern_flag: false, negative_operating_cash_flow_flag: false, debt_to_equity: 1.1, independent_director_ratio: 0.40, dual_class_shares_flag: false, staggered_board_flag: false, combined_ceo_chair_flag: true, auditor_change_flag: false }
              as: Underwriter
            - call: "POST /dno/insureds/${insured_id}/litigation-events"
              payload: { case_type: "SECURITIES_CLASS_ACTION", filed_date: "2024-06-15T00:00:00Z", resolved_date: "2025-01-15T00:00:00Z", indemnity_paid_usd: 4000000, outcome: "SETTLED" }
              as: Underwriter
            - call: "POST /dno/submissions"
              payload: { insured_id: "${insured_id}", requested_limit_usd: 5000000, requested_retention_usd: 250000, requested_side_c_sublimit_usd: 0, requested_program_target_limit_usd: 10000000, requested_period_start: "2026-09-01T00:00:00Z", requested_period_end: "2027-09-01T00:00:00Z", retroactive_date: "2024-01-01T00:00:00Z", erp_days: 90 }
              as: Underwriter
              captures: { sub_id: "$.data.id" }
            - call: "POST /dno/submissions/${sub_id}/score"
              payload: { variant: "INDICATIVE" }
              as: Underwriter
              captures: { sub_v: "$.data.version" }
            - call: "POST /dno/submissions/${sub_id}/quotes"
              payload: { expected_submission_version: "${sub_v}", offered_limit_usd: 5000000, offered_retention_usd: 250000, offered_side_c_sublimit_usd: 0, quote_valid_until: "2026-08-31T00:00:00Z" }
              as: Underwriter
              captures: { quote_id: "$.data.id" }
            - call: "GET /dno/quotes/${quote_id}/exclusion-terms"
              payload: {}
              as: Underwriter
              captures: { conduct_term_id: "$.data[0].id" }
