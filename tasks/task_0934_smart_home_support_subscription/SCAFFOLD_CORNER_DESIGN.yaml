  - section: consistency_model
    instances:
      - name: escalation_cascade_is_visible_immediately_without_a_second_request
        claim_type: immediate
        grounds: ["complexity_profile.consistency_model", "state_machines.RemoteSession.lifecycle.IN_PROGRESS_to_COMPLETED"]
        excluded_because:
          difficulty_instance: third_failed_remote_session_cascades_five_hops_to_campaign_completion
          rationale: "That instance asserts every hop of the five-entity cascade on reads taken straight after the single triggering request, which is exactly the immediate-consistency claim."

      - name: visit_completion_reconciliation_is_visible_immediately
        claim_type: immediate
        grounds: ["complexity_profile.consistency_model", "state_machines.Visit.lifecycle.SCHEDULED_to_COMPLETED"]
        excluded_because:
          difficulty_instance: visit_completion_cascades_four_hops_to_unblock_rollout
          rationale: "That instance reads the Ticket, Device, FirmwareRollout and FirmwareCampaign rows straight after the completion call and asserts the reconciled values, covering the immediate-consistency claim on the reverse cascade."
