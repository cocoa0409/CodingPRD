# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Merchant Chargeback Representment (acquirer side)
# Sections and claim_types follow references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: merchant_creation_defaults_and_reserve_cascade
        claim_type: defaults
        grounds:
          - entities.Merchant.fields.risk_tier
          - entities.Merchant.fields.reserve_mode
          - entities.Merchant.fields.reserve_rate_bps
          - entities.ReserveAccount.fields.merchant_id
        distinguishing_aspect: "A minimal create applies all documented defaults (STANDARD, FIXED_TIER, 500 bps), starts ACTIVE with zeroed computed fields, and cascades exactly one ReserveAccount row."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - call: "POST /acquirer/merchants"
              as: AcquirerOps
              payload: { legal_name: "Defaults M", merchant_category_code: "5411" }
              captures: { m_id: $.data.id, tier: $.data.risk_tier, mode: $.data.reserve_mode, rate: $.data.reserve_rate_bps, mstatus: $.data.status, clearing: $.data.clearing_balance_cents, ratio: $.data.current_count_ratio_bps }
          trigger:
            - call: "GET /acquirer/reserve-accounts"
              as: RiskOfficer
              payload: { merchant_id: "${m_id}" }
              captures: { ra_held: "$.data[0].held_cents", ra_target: "$.data[0].target_cents", ra_list: $.data }
          assert:
            - "tier == STANDARD and mode == FIXED_TIER and rate == 500 (defaults applied)"
            - "mstatus == ACTIVE and clearing == 0 and ratio == null"
            - "len(ra_list) == 1 with ra_held == 0 and ra_target == 0 (1:1 cascade-created account)"

      - name: chargeback_computed_deadlines
        claim_type: computed_fields
        grounds:
          - entities.Chargeback.fields.representment_due_at
          - entities.Chargeback.fields.merchant_response_due_at
          - calculations.deadline_computation
        distinguishing_aspect: "representment_due_at is stamped at receipt (received + 30d) while merchant_response_due_at stays null until notify, then equals notified_at + 7d — the two windows have different anchors."
        test_recipe:
          setup: ["rule with merchant_response_days 7 and representment_days 30; clock at 2026-07-15T00:00:00Z; one sale"]
          setup_api_calls:
            - { call: "POST /acquirer/reason-code-rules", as: AcquirerOps, payload: { network: VISA, reason_code: "10.4", category: FRAUD, required_evidence_types: [RECEIPT], merchant_response_days: 7, representment_days: 30, chargeback_fee_cents: 2500, effective_from: "2026-01-01T00:00:00Z" } }
            - call: "POST /acquirer/merchants"
              as: AcquirerOps
              payload: { legal_name: "Deadline Fields M", merchant_category_code: "5411", reserve_rate_bps: 0 }
              captures: { m_id: $.data.id }
            - { call: "POST /acquirer/transactions", as: AcquirerOps, payload: { merchant_id: "${m_id}", external_ref: "T-1", network: VISA, amount_cents: 10000, occurred_at: "2026-07-10T00:00:00Z" } }
            - { call: "POST /acquirer/_clock/set_current_utc", as: AcquirerOps, payload: { to_iso8601: "2026-07-15T00:00:00Z" } }
          trigger:
            - call: "POST /acquirer/chargebacks"
              as: AcquirerOps
              payload: { merchant_id: "${m_id}", transaction_external_ref: "T-1", network_case_id: "NC-C1", reason_code: "10.4", amount_cents: 10000 }
              captures: { cb_id: $.data.id, repr_due: $.data.representment_due_at, resp_due_pre: $.data.merchant_response_due_at, received: $.data.received_at }
            - call: "POST /acquirer/chargebacks/${cb_id}/notify"
              as: AcquirerOps
              payload: {}
              captures: { resp_due: $.data.merchant_response_due_at }
          assert:
            - "received == 2026-07-15T00:00:00Z (logical clock, not wall clock)"
            - "repr_due == 2026-08-14T00:00:00Z (received + 30 days)"
            - "resp_due_pre == null (not notified yet)"
            - "resp_due == 2026-07-22T00:00:00Z (notified_at + 7 days)"

      - name: reserve_ledger_append_only
        claim_type: immutability
        grounds:
          - entities.ReserveLedgerEntry
          - calculations.reserve_target
        distinguishing_aspect: "ReserveLedgerEntry is append-only: a target recompute triggered by a reserve-policy patch adds no entries and leaves prior rows byte-identical."
        test_recipe:
          setup: ["HIGH_RISK merchant with one settlement hold (rate 500 on a 10000 sale) and one receipt holdback (chargeback 5000)"]
          setup_api_calls:
            - { call: "POST /acquirer/reason-code-rules", as: AcquirerOps, payload: { network: VISA, reason_code: "10.4", category: FRAUD, required_evidence_types: [RECEIPT], merchant_response_days: 7, representment_days: 30, chargeback_fee_cents: 2500, effective_from: "2026-01-01T00:00:00Z" } }
            - call: "POST /acquirer/merchants"
              as: AcquirerOps
              payload: { legal_name: "Ledger M", merchant_category_code: "5411", risk_tier: HIGH_RISK, reserve_rate_bps: 500 }
              captures: { m_id: $.data.id, m_v: $.data.version }
            - { call: "POST /acquirer/transactions", as: AcquirerOps, payload: { merchant_id: "${m_id}", external_ref: "T-1", network: VISA, amount_cents: 10000, occurred_at: "2026-07-25T00:00:00Z" } }
            - { call: "POST /acquirer/transactions", as: AcquirerOps, payload: { merchant_id: "${m_id}", external_ref: "T-2", network: VISA, amount_cents: 10000, occurred_at: "2026-07-25T00:00:00Z" } }
            - { call: "POST /acquirer/chargebacks", as: AcquirerOps, payload: { merchant_id: "${m_id}", transaction_external_ref: "T-2", network_case_id: "NC-L1", reason_code: "10.4", amount_cents: 5000 } }
            - call: "GET /acquirer/reserve-accounts"
              as: RiskOfficer
              payload: { merchant_id: "${m_id}" }
              captures: { ra_id: "$.data[0].id" }
            - call: "GET /acquirer/reserve-accounts/${ra_id}/ledger-entries"
              as: RiskOfficer
              captures: { e1_amt: "$.data[0].amount_cents", e1_kind: "$.data[0].source_kind", e2_amt: "$.data[1].amount_cents", e2_kind: "$.data[1].source_kind", entries_pre: $.data }
            - call: "GET /acquirer/merchants/${m_id}"
              as: RiskOfficer
              captures: { m_v2: $.data.version }
          trigger:
            - { call: "PATCH /acquirer/merchants/${m_id}/reserve-policy", as: RiskOfficer, payload: { reserve_rate_bps: 700, expected_merchant_version: "${m_v2}" } }
            - call: "GET /acquirer/reserve-accounts/${ra_id}/ledger-entries"
              as: RiskOfficer
              captures: { entries_post: $.data }
          assert:
            - "entries_pre has 2 rows: e1_amt == 500 with e1_kind == TRANSACTION_SETTLEMENT and e2_amt == 5000 with e2_kind == CHARGEBACK_RECEIPT"
            - "entries_post deep-equals entries_pre (recompute of target_cents creates no ledger entries and never rewrites history)"

      - name: chargeback_get_nonexistent_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: "Reading a random UUID yields the 404 error envelope regardless of which collection is addressed."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /acquirer/chargebacks/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: AcquirerOps
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND with HTTP 404"
            - "error envelope: response_type == 'error', data.message non-empty, meta.api_request_id present"


  - section: state_machines
    instances:
      - name: initial_states_and_alert_window
        claim_type: initial_state
        grounds:
          - state_machines.Chargeback
          - state_machines.PreventionAlert
          - calculations.deadline_computation
        distinguishing_aspect: "Newly ingested objects start in their declared initial states (chargeback RECEIVED + MERCHANT_DEBITED, alert OPEN with a 72h window anchored to the default logical clock 2026-08-01T00:00:00Z)."
        test_recipe:
          setup: ["merchant and one sale; logical clock never set (default 2026-08-01T00:00:00Z)"]
          setup_api_calls:
            - { call: "POST /acquirer/reason-code-rules", as: AcquirerOps, payload: { network: VISA, reason_code: "10.4", category: FRAUD, required_evidence_types: [RECEIPT], merchant_response_days: 7, representment_days: 30, chargeback_fee_cents: 2500, effective_from: "2026-01-01T00:00:00Z" } }
            - call: "POST /acquirer/merchants"
              as: AcquirerOps
              payload: { legal_name: "Init M", merchant_category_code: "5411", reserve_rate_bps: 0 }
              captures: { m_id: $.data.id }
            - call: "POST /acquirer/transactions"
              as: AcquirerOps
              payload: { merchant_id: "${m_id}", external_ref: "T-1", network: VISA, amount_cents: 10000, occurred_at: "2026-07-25T00:00:00Z" }
              captures: { t_id: $.data.id }
          trigger:
            - call: "POST /acquirer/chargebacks"
              as: AcquirerOps
              payload: { merchant_id: "${m_id}", transaction_external_ref: "T-1", network_case_id: "NC-I1", reason_code: "10.4", amount_cents: 10000 }
              captures: { cb_case: $.data.case_status, cb_funds: $.data.funds_status, cb_counted: $.data.is_ratio_counted, cb_received: $.data.received_at }
            - call: "POST /acquirer/prevention-alerts"
              as: AcquirerOps
              payload: { transaction_id: "${t_id}", alert_type: FRAUD_ALERT }
              captures: { al_status: $.data.status, al_due: $.data.response_due_at }
          assert:
            - "cb_case == RECEIVED and cb_funds == MERCHANT_DEBITED and cb_counted == true"
            - "cb_received == 2026-08-01T00:00:00Z (server startup default clock)"
            - "al_status == OPEN and al_due == 2026-08-04T00:00:00Z (received + 72h)"

      - name: notify_twice_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Chargeback.RECEIVED_to_MERCHANT_NOTIFIED]
        distinguishing_aspect: "notify is only defined from RECEIVED; a second notify on MERCHANT_NOTIFIED fails ERR_INVALID_CASE_STATE and does not re-stamp merchant_response_due_at."
        test_recipe:
          setup: ["chargeback notified once at 2026-07-15"]
          setup_api_calls:
            - { call: "POST /acquirer/reason-code-rules", as: AcquirerOps, payload: { network: VISA, reason_code: "10.4", category: FRAUD, required_evidence_types: [RECEIPT], merchant_response_days: 7, representment_days: 30, chargeback_fee_cents: 2500, effective_from: "2026-01-01T00:00:00Z" } }
            - call: "POST /acquirer/merchants"
              as: AcquirerOps
              payload: { legal_name: "N2 M", merchant_category_code: "5411", reserve_rate_bps: 0 }
              captures: { m_id: $.data.id }
            - { call: "POST /acquirer/transactions", as: AcquirerOps, payload: { merchant_id: "${m_id}", external_ref: "T-1", network: VISA, amount_cents: 10000, occurred_at: "2026-07-10T00:00:00Z" } }
            - { call: "POST /acquirer/_clock/set_current_utc", as: AcquirerOps, payload: { to_iso8601: "2026-07-15T00:00:00Z" } }
            - call: "POST /acquirer/chargebacks"
              as: AcquirerOps
              payload: { merchant_id: "${m_id}", transaction_external_ref: "T-1", network_case_id: "NC-N1", reason_code: "10.4", amount_cents: 10000 }
              captures: { cb_id: $.data.id }
            - call: "POST /acquirer/chargebacks/${cb_id}/notify"
              as: AcquirerOps
              payload: {}
              captures: { due_first: $.data.merchant_response_due_at }
          trigger:
            - call: "POST /acquirer/chargebacks/${cb_id}/notify"
              as: AcquirerOps
              payload: {}
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_CASE_STATE"
            - "Chargeback.${cb_id}.merchant_response_due_at == due_first == 2026-07-22T00:00:00Z (unchanged)"

      - name: terminal_lockdown_merchant_accepted
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Chargeback.MERCHANT_NOTIFIED_to_MERCHANT_ACCEPTED]
        distinguishing_aspect: "MERCHANT_ACCEPTED is terminal: a second accept is rejected and the funds axis stays DEBIT_FINAL."
        test_recipe:
          setup: ["chargeback notified and accepted within the response window"]
          setup_api_calls:
            - { call: "POST /acquirer/reason-code-rules", as: AcquirerOps, payload: { network: VISA, reason_code: "10.4", category: FRAUD, required_evidence_types: [RECEIPT], merchant_response_days: 7, representment_days: 30, chargeback_fee_cents: 2500, effective_from: "2026-01-01T00:00:00Z" } }
            - call: "POST /acquirer/merchants"
              as: AcquirerOps
              payload: { legal_name: "Term M", merchant_category_code: "5411", reserve_rate_bps: 0 }
              captures: { m_id: $.data.id }
            - { call: "POST /acquirer/transactions", as: AcquirerOps, payload: { merchant_id: "${m_id}", external_ref: "T-1", network: VISA, amount_cents: 10000, occurred_at: "2026-07-10T00:00:00Z" } }
            - { call: "POST /acquirer/_clock/set_current_utc", as: AcquirerOps, payload: { to_iso8601: "2026-07-15T00:00:00Z" } }
            - call: "POST /acquirer/chargebacks"
              as: AcquirerOps
              payload: { merchant_id: "${m_id}", transaction_external_ref: "T-1", network_case_id: "NC-T1", reason_code: "10.4", amount_cents: 10000 }
              captures: { cb_id: $.data.id }
            - { call: "POST /acquirer/chargebacks/${cb_id}/notify", as: AcquirerOps, payload: {} }
            - { call: "POST /acquirer/chargebacks/${cb_id}/accept", as: MerchantUser, as_user_id: "${m_id}", payload: {} }
          trigger:
            - call: "POST /acquirer/chargebacks/${cb_id}/accept"
              as: MerchantUser
              as_user_id: "${m_id}"
              payload: {}
              captures: { err: $.data.error_id }
            - call: "GET /acquirer/chargebacks/${cb_id}"
              as: AcquirerOps
              captures: { case_s: $.data.case_status, funds_s: $.data.funds_status }
          assert:
            - "err == ERR_INVALID_CASE_STATE (terminal lockdown; also applies to notify/reverse/pre-arbitration from this state)"
            - "case_s == MERCHANT_ACCEPTED and funds_s == DEBIT_FINAL"

      - name: expiry_from_received_without_notify
        claim_type: valid_transition
        grounds: [state_machines.Chargeback.RECEIVED_to_EXPIRED]
        distinguishing_aspect: "The expiry sweep fires even when the merchant was never notified: a case still RECEIVED past representment_due_at becomes EXPIRED with funds DEBIT_FINAL."
        test_recipe:
          setup: ["chargeback received 2026-07-15T00:00:00Z (representment_due_at 2026-08-14T00:00:00Z), never notified"]
          setup_api_calls:
            - { call: "POST /acquirer/reason-code-rules", as: AcquirerOps, payload: { network: VISA, reason_code: "10.4", category: FRAUD, required_evidence_types: [RECEIPT], merchant_response_days: 7, representment_days: 30, chargeback_fee_cents: 2500, effective_from: "2026-01-01T00:00:00Z" } }
            - call: "POST /acquirer/merchants"
              as: AcquirerOps
              payload: { legal_name: "Expire M", merchant_category_code: "5411", reserve_rate_bps: 0 }
              captures: { m_id: $.data.id }
            - { call: "POST /acquirer/transactions", as: AcquirerOps, payload: { merchant_id: "${m_id}", external_ref: "T-1", network: VISA, amount_cents: 10000, occurred_at: "2026-07-10T00:00:00Z" } }
            - { call: "POST /acquirer/_clock/set_current_utc", as: AcquirerOps, payload: { to_iso8601: "2026-07-15T00:00:00Z" } }
            - call: "POST /acquirer/chargebacks"
              as: AcquirerOps
              payload: { merchant_id: "${m_id}", transaction_external_ref: "T-1", network_case_id: "NC-E1", reason_code: "10.4", amount_cents: 10000 }
              captures: { cb_id: $.data.id }
          trigger:
            - { call: "POST /acquirer/_clock/set_current_utc", as: AcquirerOps, payload: { to_iso8601: "2026-08-15T00:00:00Z" } }
            - call: "GET /acquirer/chargebacks/${cb_id}"
              as: AcquirerOps
              captures: { case_s: $.data.case_status, funds_s: $.data.funds_status, counted: $.data.is_ratio_counted }
          assert:
            - "case_s == EXPIRED and funds_s == DEBIT_FINAL (the receipt debit stands when the deadline lapses)"
            - "counted == true (only REVERSED excludes from the POSTED ratio; expiry still counts)"

      - name: double_submit_rejected
        claim_type: idempotency
        grounds: [state_machines.Representment.ASSEMBLED_to_SUBMITTED]
        distinguishing_aspect: "Submitting an already-SUBMITTED packet fails ERR_INVALID_REPRESENTMENT_STATE — submission is not silently idempotent."
        test_recipe:
          setup: ["complete packet submitted for a notified chargeback"]
          setup_api_calls:
            - { call: "POST /acquirer/reason-code-rules", as: AcquirerOps, payload: { network: VISA, reason_code: "10.4", category: FRAUD, required_evidence_types: [RECEIPT], merchant_response_days: 7, representment_days: 30, chargeback_fee_cents: 2500, effective_from: "2026-01-01T00:00:00Z" } }
            - call: "POST /acquirer/merchants"
              as: AcquirerOps
              payload: { legal_name: "DS M", merchant_category_code: "5411", reserve_rate_bps: 0 }
              captures: { m_id: $.data.id }
            - { call: "POST /acquirer/transactions", as: AcquirerOps, payload: { merchant_id: "${m_id}", external_ref: "T-1", network: VISA, amount_cents: 10000, occurred_at: "2026-07-10T00:00:00Z" } }
            - { call: "POST /acquirer/_clock/set_current_utc", as: AcquirerOps, payload: { to_iso8601: "2026-07-15T00:00:00Z" } }
            - call: "POST /acquirer/chargebacks"
              as: AcquirerOps
              payload: { merchant_id: "${m_id}", transaction_external_ref: "T-1", network_case_id: "NC-D1", reason_code: "10.4", amount_cents: 10000 }
              captures: { cb_id: $.data.id }
            - { call: "POST /acquirer/chargebacks/${cb_id}/notify", as: AcquirerOps, payload: {} }
            - call: "POST /acquirer/evidence-items"
              as: MerchantUser
              as_user_id: "${m_id}"
              payload: { chargeback_id: "${cb_id}", evidence_type: RECEIPT, document_uri: "s3://ev/r.pdf" }
              captures: { ev1: $.data.id }
            - call: "GET /acquirer/chargebacks/${cb_id}"
              as: AcquirerOps
              captures: { cb_v: $.data.version }
            - call: "POST /acquirer/representments"
              as: MerchantUser
              as_user_id: "${m_id}"
              payload: { chargeback_id: "${cb_id}", evidence_item_ids: ["${ev1}"], expected_chargeback_version: "${cb_v}" }
              captures: { rep_id: $.data.id }
            - { call: "POST /acquirer/representments/${rep_id}/submit", as: MerchantUser, as_user_id: "${m_id}", payload: {} }
          trigger:
            - call: "POST /acquirer/representments/${rep_id}/submit"
              as: MerchantUser
              as_user_id: "${m_id}"
              payload: {}
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REPRESENTMENT_STATE (packet already SUBMITTED)"

      - name: outcome_on_assembled_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.Representment.SUBMITTED_to_WON]
        distinguishing_aspect: "Network outcomes are only postable against SUBMITTED packets; an ASSEMBLED packet rejects with ERR_INVALID_REPRESENTMENT_STATE."
        test_recipe:
          setup: ["packet assembled but never submitted"]
          setup_api_calls:
            - { call: "POST /acquirer/reason-code-rules", as: AcquirerOps, payload: { network: VISA, reason_code: "10.4", category: FRAUD, required_evidence_types: [RECEIPT], merchant_response_days: 7, representment_days: 30, chargeback_fee_cents: 2500, effective_from: "2026-01-01T00:00:00Z" } }
            - call: "POST /acquirer/merchants"
              as: AcquirerOps
              payload: { legal_name: "OA M", merchant_category_code: "5411", reserve_rate_bps: 0 }
              captures: { m_id: $.data.id }
            - { call: "POST /acquirer/transactions", as: AcquirerOps, payload: { merchant_id: "${m_id}", external_ref: "T-1", network: VISA, amount_cents: 10000, occurred_at: "2026-07-10T00:00:00Z" } }
            - { call: "POST /acquirer/_clock/set_current_utc", as: AcquirerOps, payload: { to_iso8601: "2026-07-15T00:00:00Z" } }
            - call: "POST /acquirer/chargebacks"
              as: AcquirerOps
              payload: { merchant_id: "${m_id}", transaction_external_ref: "T-1", network_case_id: "NC-O1", reason_code: "10.4", amount_cents: 10000 }
              captures: { cb_id: $.data.id }
            - { call: "POST /acquirer/chargebacks/${cb_id}/notify", as: AcquirerOps, payload: {} }
            - call: "POST /acquirer/evidence-items"
              as: MerchantUser
              as_user_id: "${m_id}"
              payload: { chargeback_id: "${cb_id}", evidence_type: RECEIPT, document_uri: "s3://ev/r.pdf" }
              captures: { ev1: $.data.id }
            - call: "GET /acquirer/chargebacks/${cb_id}"
              as: AcquirerOps
              captures: { cb_v: $.data.version }
            - call: "POST /acquirer/representments"
              as: MerchantUser
              as_user_id: "${m_id}"
              payload: { chargeback_id: "${cb_id}", evidence_item_ids: ["${ev1}"], expected_chargeback_version: "${cb_v}" }
              captures: { rep_id: $.data.id }
          trigger:
            - call: "POST /acquirer/representments/${rep_id}/network-outcome"
              as: AcquirerOps
              payload: { outcome: WON }
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REPRESENTMENT_STATE (outcome requires SUBMITTED)"

      - name: accept_with_packet_in_flight_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.Chargeback.MERCHANT_NOTIFIED_to_MERCHANT_ACCEPTED]
        distinguishing_aspect: "A merchant cannot accept liability while a representment packet is ASSEMBLED — the in-flight packet blocks acceptance with ERR_REPRESENTMENT_ALREADY_OPEN."
        test_recipe:
          setup: ["notified chargeback with an ASSEMBLED packet, still inside the response window"]
          setup_api_calls:
            - { call: "POST /acquirer/reason-code-rules", as: AcquirerOps, payload: { network: VISA, reason_code: "10.4", category: FRAUD, required_evidence_types: [RECEIPT], merchant_response_days: 7, representment_days: 30, chargeback_fee_cents: 2500, effective_from: "2026-01-01T00:00:00Z" } }
            - call: "POST /acquirer/merchants"
              as: AcquirerOps
              payload: { legal_name: "Inflight M", merchant_category_code: "5411", reserve_rate_bps: 0 }
              captures: { m_id: $.data.id }
            - { call: "POST /acquirer/transactions", as: AcquirerOps, payload: { merchant_id: "${m_id}", external_ref: "T-1", network: VISA, amount_cents: 10000, occurred_at: "2026-07-10T00:00:00Z" } }
            - { call: "POST /acquirer/_clock/set_current_utc", as: AcquirerOps, payload: { to_iso8601: "2026-07-15T00:00:00Z" } }
            - call: "POST /acquirer/chargebacks"
              as: AcquirerOps
              payload: { merchant_id: "${m_id}", transaction_external_ref: "T-1", network_case_id: "NC-P1", reason_code: "10.4", amount_cents: 10000 }
              captures: { cb_id: $.data.id }
