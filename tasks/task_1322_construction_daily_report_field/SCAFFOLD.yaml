  - { id: ERR_NOT_FOUND, http: 404, condition: "Resource id does not exist (generic / crew / equipment / quantity / weather rows)" }
  - { id: ERR_PROJECT_NOT_FOUND, http: 404, condition: "Project id does not exist" }
