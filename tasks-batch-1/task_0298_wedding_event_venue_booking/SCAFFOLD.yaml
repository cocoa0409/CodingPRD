scenario: "298. Wedding & Event Venue Booking: date/space inventory & hold, package & food-beverage minimum, deposit & payment milestones, vendor list/COI requirement, guest-count guarantee, ceremony+reception block, reschedule/force-majeure, walkthrough & coordinator"
domain_name: "wedding-event-venue-booking"
api_prefix: "/"

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency        # OCC on Booking.version for hold-create supersede race
    - cascading_side_effects        # confirm/cancel/force-majeure cascade across holds, milestones, vendors, guarantee
    - dual_variant_calculation      # provisional vs final event charge; estimated vs guaranteed F&B floor
    - derived_field_reconciliation  # Booking.balance_due_cents, amount_paid_cents reconciled from Payment stream

  entity_topology: hybrid
  # Venue -> Space is a strict hierarchy; Booking is a flat hub with FK references
  # to Space, Package, Client, Coordinator, plus child rows (SpaceHold, PaymentMilestone,
  # Payment, Vendor, GuestCountGuarantee, Walkthrough, RescheduleRequest). SpaceHold is a
  # cross-aggregate occupation linking a Booking to a Space-date interval.

  state_machine_shape: parallel
  # Booking carries two independent state axes: booking_status (lifecycle) and
  # payment_status (deposit/milestone settlement). RescheduleRequest is cyclic
  # (negotiation rounds). SpaceHold is branching (HELD -> {COMMITTED, RELEASED}).

  relationship_patterns:
    - one_to_many           # Booking has many SpaceHold / PaymentMilestone / Payment / Vendor / Walkthrough
    - cross_aggregate       # SpaceHold occupies a Space (different aggregate) on behalf of a Booking
    - self_referential      # RescheduleRequest.supersedes_request_id chains negotiation rounds

  role_model: peer_roles
  # Client owns their own bookings; Coordinator (venue staff) manages venue-side
  # operations; VenueAdmin owns inventory/package configuration; FinanceOfficer
  # owns payment posting and refunds. Non-overlapping resource ownership.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: Venue
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Venue display name"
        constraints: "1..120 chars, required"
      - name: timezone
        type: string
        source: input
        description: "IANA timezone used to interpret event-day deadlines (guarantee cutoff, COI window)"
        default: "America/New_York"
      - name: cancellation_tier
        type: enum
        source: input
        description: "Refund schedule applied to deposit/payments on client cancellation"
        default: "STANDARD"
        constraints: "STANDARD | STRICT | FLEXIBLE"
      - name: force_majeure_fee_pct
        type: number
        source: input
        description: "Administrative fee retained as a fraction of amount_paid_cents when a force-majeure reschedule is approved"
        default: 0.0
        constraints: "0.0..0.25 inclusive"
      - name: status
        type: enum
        source: system
        description: "ACTIVE while bookable; ARCHIVED hides venue from new bookings but preserves existing ones"
        default: "ACTIVE"
        constraints: "ACTIVE | ARCHIVED"

  - name: Space
    parent: Venue
    common_fields: true
    fields:
      - name: venue_id
        type: string
        source: input
        description: "FK -> Venue.id; the venue this space belongs to"
      - name: name
        type: string
        source: input
        description: "Space name (e.g. Grand Ballroom, Garden Lawn)"
        constraints: "1..120 chars, required"
      - name: space_kind
        type: enum
        source: input
        description: "Whether the space hosts ceremonies, receptions, or both"
        constraints: "CEREMONY | RECEPTION | DUAL"
      - name: max_capacity
        type: integer
        source: input
        description: "Maximum seated guest count this space supports"
        constraints: ">= 1"
      - name: base_rental_cents
        type: integer
        source: input
        description: "Base rental fee in cents for occupying this space for one event block"
        constraints: ">= 0"
      - name: turnover_buffer_minutes
        type: integer
        source: input
        description: "Minimum gap in minutes required after one occupation ends before the next may begin on this space"
        default: 0
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "ACTIVE while bookable; ARCHIVED blocks new holds but keeps existing ones"
        default: "ACTIVE"
        constraints: "ACTIVE | ARCHIVED"

  - name: Package
    parent: Venue
    common_fields: true
    fields:
      - name: venue_id
        type: string
        source: input
        description: "FK -> Venue.id; the venue offering this package"
      - name: tier
        type: enum
        source: input
        description: "Package tier name"
        constraints: "SILVER | GOLD | PLATINUM"
      - name: per_head_cents
        type: integer
        source: input
        description: "Food-and-beverage charge per guaranteed head in cents"
        constraints: ">= 0"
      - name: fb_minimum_cents
        type: integer
        source: input
        description: "Food-and-beverage minimum spend in cents that the booking must meet regardless of head count"
        constraints: ">= 0"
      - name: service_charge_pct
        type: number
        source: input
        description: "Service charge applied to the F&B subtotal (after the minimum floor) as a fraction"
        default: 0.22
        constraints: "0.0..0.50 inclusive"
      - name: tax_pct
        type: number
        source: input
        description: "Sales tax applied after service charge as a fraction"
        default: 0.08
        constraints: "0.0..0.30 inclusive"
      - name: status
        type: enum
        source: system
        description: "ACTIVE while selectable on new bookings; ARCHIVED preserves bookings already on it"
        default: "ACTIVE"
        constraints: "ACTIVE | ARCHIVED"

  - name: Client
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Primary contact name on the account"
        constraints: "1..120 chars, required"
      - name: email
        type: string
        source: input
        description: "Contact email; unique across clients"
        constraints: "valid email, unique"

  - name: Coordinator
    parent: Venue
    common_fields: true
    fields:
      - name: venue_id
        type: string
        source: input
        description: "FK -> Venue.id; the venue this coordinator works for"
      - name: full_name
        type: string
        source: input
        description: "Coordinator display name"
        constraints: "1..120 chars, required"
      - name: active_booking_cap
        type: integer
        source: input
        description: "Maximum number of non-terminal bookings this coordinator may be assigned to at once"
        default: 8
        constraints: ">= 1"
      - name: assigned_active_count
        type: integer
        source: computed
        description: "Count of bookings assigned to this coordinator whose booking_status NOT IN {COMPLETED, CANCELLED}"
        default: 0

  - name: Booking
    parent: null
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; the client who owns this booking"
      - name: venue_id
        type: string
        source: input
        description: "FK -> Venue.id; the venue being booked"
      - name: package_id
        type: string
        source: input
        description: "FK -> Package.id; the F&B package selected for this booking"
      - name: coordinator_id
        type: string
        source: system
        description: "FK -> Coordinator.id; venue coordinator assigned to this booking, null until assigned"
        default: null
      - name: event_date
        type: string
        source: input
        description: "Calendar date of the event (YYYY-MM-DD); ceremony and reception both occur on this date"
        constraints: "ISO date, must be strictly in the future relative to current clock at creation"
      - name: ceremony_start
        type: datetime
        source: input
        description: "ISO8601 UTC start of the ceremony block"
      - name: ceremony_end
        type: datetime
        source: input
        description: "ISO8601 UTC end of the ceremony block; must be after ceremony_start"
      - name: reception_start
        type: datetime
        source: input
        description: "ISO8601 UTC start of the reception block; must be >= ceremony_end"
      - name: reception_end
        type: datetime
        source: input
        description: "ISO8601 UTC end of the reception block; must be after reception_start"
      - name: expected_guest_count
        type: integer
        source: input
        description: "Estimated guest count captured at booking time, used for the provisional event charge"
        constraints: ">= 1"
      - name: booking_status
        type: enum
        source: system
        description: "Lifecycle axis (independent of payment_status)"
        default: "INQUIRY"
        constraints: "INQUIRY | HELD | CONFIRMED | GUARANTEED | COMPLETED | CANCELLED"
      - name: payment_status
        type: enum
        source: system
        description: "Settlement axis (independent of booking_status)"
        default: "UNPAID"
        constraints: "UNPAID | DEPOSIT_PAID | PARTIALLY_PAID | PAID_IN_FULL | REFUNDED"
      - name: hold_expires_at
        type: datetime
        source: system
        description: "When booking_status=HELD, the UTC instant after which the soft hold lapses; null otherwise"
        default: null
      - name: amount_paid_cents
        type: integer
        source: computed
        description: "Sum of Payment.amount_cents for this booking where Payment.direction=INBOUND and Payment.status=POSTED, minus refunds (direction=OUTBOUND, status=POSTED)"
        default: 0
      - name: event_charge_cents
        type: integer
        source: computed
        description: "Total contracted event charge: provisional before GUARANTEED, final (guarantee-driven) once booking_status=GUARANTEED"
        default: 0
      - name: balance_due_cents
        type: integer
        source: computed
        description: "event_charge_cents minus amount_paid_cents; may be negative when overpaid pending refund"
        default: 0
      - name: cancelled_reason
        type: enum
        source: system
        description: "Why the booking ended in CANCELLED; null unless cancelled. CLIENT_CANCEL set by the cancel endpoint; NONPAYMENT set when a HELD booking lapses on the expire-hold sweep"
        default: null
        constraints: "CLIENT_CANCEL | NONPAYMENT | null"

  - name: SpaceHold
    parent: Booking
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; the booking this hold serves"
      - name: space_id
        type: string
        source: input
        description: "FK -> Space.id; the space being occupied"
      - name: block_role
        type: enum
        source: input
        description: "Which event block this hold covers"
        constraints: "CEREMONY | RECEPTION"
      - name: occupy_start
        type: datetime
        source: system
        description: "ISO8601 UTC occupation start, copied from the booking's matching block start at hold creation"
      - name: occupy_end
        type: datetime
        source: system
        description: "ISO8601 UTC occupation end, copied from the booking's matching block end at hold creation"
      - name: hold_status
        type: enum
        source: system
        description: "HELD (tentative) | COMMITTED (locked by confirmation) | RELEASED (freed)"
        default: "HELD"
        constraints: "HELD | COMMITTED | RELEASED"

  - name: PaymentMilestone
    parent: Booking
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; the booking this milestone belongs to"
      - name: kind
        type: enum
        source: system
        description: "DEPOSIT (due at confirmation) | INTERIM | FINAL (due before guarantee deadline)"
        constraints: "DEPOSIT | INTERIM | FINAL"
      - name: sequence
        type: integer
        source: system
        description: "1-based ordering of milestones within the booking; settlement and waterfall allocation proceed in ascending sequence"
        constraints: ">= 1"
      - name: amount_due_cents
        type: integer
        source: computed
        description: "Scheduled amount for this milestone in cents, derived from the event charge and the milestone split"
        constraints: ">= 0"
      - name: amount_allocated_cents
        type: integer
        source: computed
        description: "Portion of posted payments waterfall-allocated to this milestone so far"
        default: 0
      - name: due_date
        type: string
        source: input
        description: "Calendar date (YYYY-MM-DD) this milestone is due"
      - name: milestone_status
        type: enum
        source: computed
        description: "OPEN (unallocated) | PARTIAL | SETTLED (fully allocated) | WAIVED (zeroed by force-majeure)"
        default: "OPEN"
        constraints: "OPEN | PARTIAL | SETTLED | WAIVED"

  - name: Payment
    parent: Booking
    common_fields: false
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; the booking this payment is posted against"
      - name: direction
        type: enum
        source: input
        description: "INBOUND (client pays venue) | OUTBOUND (venue refunds client)"
        constraints: "INBOUND | OUTBOUND"
      - name: amount_cents
        type: integer
        source: input
        description: "Positive amount in cents moved by this payment event"
        constraints: ">= 1"
      - name: method
        type: enum
        source: input
        description: "Payment instrument"
        constraints: "CARD | ACH | CHECK | WIRE"
      - name: status
        type: enum
        source: system
        description: "POSTED on success; VOIDED if reversed before settlement"
        default: "POSTED"
        constraints: "POSTED | VOIDED"
      - name: posted_at
        type: datetime
        source: system
        description: "ISO8601 UTC instant the payment was posted; chronological allocation orders by this then created_at"

  - name: Vendor
    parent: Booking
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; the booking this vendor serves"
      - name: company_name
        type: string
        source: input
        description: "Vendor company name"
        constraints: "1..120 chars, required"
      - name: vendor_role
        type: enum
        source: input
        description: "Service category the vendor provides"
        constraints: "CATERING | FLORAL | PHOTOGRAPHY | MUSIC | RENTAL | OTHER"
      - name: coi_required
        type: boolean
        source: computed
        description: "Whether a Certificate of Insurance is required for this vendor_role at this venue"
        default: true
      - name: coi_on_file
        type: boolean
        source: system
        description: "True once a COI has been uploaded and not expired"
        default: false
      - name: coi_expires_on
        type: string
        source: input
        description: "Calendar date (YYYY-MM-DD) the uploaded COI expires; null until a COI is uploaded"
        default: null
      - name: vendor_status
        type: enum
        source: system
        description: "PENDING (no valid COI) | CLEARED (COI valid through event_date) | REJECTED"
        default: "PENDING"
        constraints: "PENDING | CLEARED | REJECTED"

  - name: GuestCountGuarantee
    parent: Booking
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; the booking this guarantee finalizes"
      - name: guaranteed_count
        type: integer
        source: input
        description: "Final guaranteed guest head count that the F&B charge is computed against"
        constraints: ">= 1"
      - name: guarantee_deadline
        type: string
        source: computed
        description: "Calendar date (YYYY-MM-DD) by which the guarantee must be locked, derived from event_date minus the venue guarantee window"
      - name: locked_at
        type: datetime
        source: system
        description: "ISO8601 UTC instant the guarantee was locked"

  - name: Walkthrough
    parent: Booking
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; the booking this walkthrough is for"
      - name: scheduled_start
        type: datetime
        source: input
        description: "ISO8601 UTC start of the walkthrough appointment"
      - name: scheduled_end
        type: datetime
        source: input
        description: "ISO8601 UTC end of the walkthrough appointment; must be after scheduled_start"
      - name: walkthrough_status
        type: enum
        source: system
        description: "SCHEDULED | COMPLETED | CANCELLED"
        default: "SCHEDULED"
        constraints: "SCHEDULED | COMPLETED | CANCELLED"

  - name: RescheduleRequest
    parent: Booking
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; the booking being rescheduled"
      - name: supersedes_request_id
        type: string
        source: input
        description: "FK -> RescheduleRequest.id; the prior request this round supersedes in a negotiation chain; null for the first round"
        default: null
      - name: reason_kind
        type: enum
        source: input
        description: "CLIENT_REQUEST (ordinary date move) | FORCE_MAJEURE (qualifying disruption with fee relief)"
        constraints: "CLIENT_REQUEST | FORCE_MAJEURE"
      - name: proposed_event_date
        type: string
        source: input
        description: "Proposed new calendar date (YYYY-MM-DD)"
      - name: proposed_ceremony_start
        type: datetime
        source: input
        description: "Proposed new ceremony start (ISO8601 UTC)"
      - name: proposed_ceremony_end
        type: datetime
        source: input
        description: "Proposed new ceremony end (ISO8601 UTC)"
      - name: proposed_reception_start
        type: datetime
        source: input
        description: "Proposed new reception start (ISO8601 UTC)"
      - name: proposed_reception_end
        type: datetime
        source: input
        description: "Proposed new reception end (ISO8601 UTC)"
      - name: request_status
        type: enum
        source: system
        description: "PROPOSED | COUNTERED (venue countered, awaiting client) | APPROVED | DECLINED | WITHDRAWN"
        default: "PROPOSED"
        constraints: "PROPOSED | COUNTERED | APPROVED | DECLINED | WITHDRAWN"

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: Booking
    initial_state: INQUIRY
    terminal_states: [COMPLETED, CANCELLED]
    note: |
      Booking has TWO independent state axes. This machine governs booking_status.
      payment_status is governed by the separate machine below and evolves
      independently driven by Payment posting and milestone allocation.
    transitions:
      - from: INQUIRY
        to: HELD
        trigger: "POST /bookings/{id}/place-hold"
        actor: Coordinator
        preconditions:
          - "booking_status == INQUIRY"
          - "Venue.status == ACTIVE and Package.status == ACTIVE"
          - "at least one SpaceHold exists for this booking with hold_status=HELD covering block_role=CEREMONY AND at least one covering block_role=RECEPTION"
        side_effects:
          - "set hold_expires_at = current_clock + HOLD_DURATION_HOURS hours"
          - "increments Booking.version by 1"
      - from: HELD
        to: CONFIRMED
        trigger: "POST /bookings/{id}/confirm"
        actor: Coordinator
        preconditions:
          - "booking_status == HELD"
          - "current_clock < hold_expires_at (hold not lapsed)"
          - "a Coordinator is assigned (coordinator_id != null)"
          - "payment_status == DEPOSIT_PAID or PAID_IN_FULL (deposit milestone SETTLED)"
        side_effects:
          - "for every SpaceHold of this booking with hold_status=HELD: transition it to COMMITTED (cascade down)"
          - "set hold_expires_at = null"
          - "recompute event_charge_cents via provisional_event_charge"
          - "increments Booking.version by 1"
      - from: CONFIRMED
        to: GUARANTEED
        trigger: "POST /bookings/{id}/guarantee (creates GuestCountGuarantee)"
        actor: Coordinator
        preconditions:
          - "booking_status == CONFIRMED"
          - "current_clock date <= GuestCountGuarantee.guarantee_deadline"
          - "every Vendor of this booking with coi_required=true has vendor_status=CLEARED"
          - "no PaymentMilestone of kind=DEPOSIT is OPEN"
        side_effects:
          - "recompute event_charge_cents via final_event_charge using guaranteed_count (dual-variant switch)"
          - "recompute every PaymentMilestone.amount_due_cents from the final event charge and re-run waterfall allocation"
          - "set GuestCountGuarantee.locked_at = current_clock"
          - "increments Booking.version by 1"
      - from: GUARANTEED
        to: COMPLETED
        trigger: "POST /bookings/{id}/complete"
        actor: Coordinator
        preconditions:
          - "booking_status == GUARANTEED"
          - "current_clock date > event_date (event has occurred)"
          - "payment_status == PAID_IN_FULL"
        side_effects:
          - "for every Walkthrough still SCHEDULED: transition to CANCELLED"
          - "decrement Coordinator.assigned_active_count by 1 (bubble up)"
          - "increments Booking.version by 1"
      - from: INQUIRY
        to: CANCELLED
        trigger: "POST /bookings/{id}/cancel"
        actor: Client
        preconditions:
          - "booking_status == INQUIRY"
        side_effects:
          - "set cancelled_reason = CLIENT_CANCEL"
          - "increments Booking.version by 1"
      - from: HELD
        to: CANCELLED
        trigger: "POST /bookings/{id}/cancel"
        actor: Client
        preconditions:
          - "booking_status == HELD"
        side_effects:
          - "for every SpaceHold with hold_status IN {HELD}: transition to RELEASED (cascade down)"
          - "set cancelled_reason = CLIENT_CANCEL"
          - "set hold_expires_at = null"
          - "increments Booking.version by 1"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /bookings/{id}/cancel"
        actor: Client
        preconditions:
          - "booking_status == CONFIRMED"
        side_effects:
          - "for every SpaceHold with hold_status IN {HELD, COMMITTED}: transition to RELEASED (cascade down, frees inventory)"
          - "compute cancellation_refund_cents and post an OUTBOUND Payment for that amount (cross-entity; triggers payment_status recompute -> REFUNDED if all inbound returned)"
          - "set every non-terminal PaymentMilestone.milestone_status = WAIVED (cascade)"
          - "set cancelled_reason = CLIENT_CANCEL"
          - "increments Booking.version by 1"
      - from: GUARANTEED
        to: CANCELLED
        trigger: "POST /bookings/{id}/cancel"
        actor: Client
        preconditions:
          - "booking_status == GUARANTEED"
        side_effects:
          - "for every SpaceHold with hold_status IN {HELD, COMMITTED}: transition to RELEASED (cascade down)"
          - "compute cancellation_refund_cents (STRICT tier yields 0 after guarantee) and post OUTBOUND Payment"
          - "set every non-terminal PaymentMilestone.milestone_status = WAIVED"
          - "set cancelled_reason = CLIENT_CANCEL"
          - "increments Booking.version by 1"
      - from: HELD
        to: CANCELLED
        trigger: "POST /_clock/advance then POST /bookings/{id}/expire-hold (system sweep when hold lapses)"
        actor: system
        preconditions:
          - "booking_status == HELD"
          - "current_clock >= hold_expires_at"
        side_effects:
          - "for every SpaceHold with hold_status=HELD: transition to RELEASED (cascade down)"
          - "set cancelled_reason = NONPAYMENT"
          - "set hold_expires_at = null"
          - "increments Booking.version by 1"

  - entity: Booking
    initial_state: UNPAID
    terminal_states: [REFUNDED]
    note: |
      Second parallel axis on Booking: payment_status. Recomputed after every
      Payment posting/void and after every milestone re-allocation. It does NOT
      gate booking_status transitions except where a precondition explicitly
      references it (e.g. confirm requires deposit settled).
    transitions:
      - from: UNPAID
        to: DEPOSIT_PAID
        trigger: "system recompute after POST /bookings/{id}/payments posts an INBOUND payment"
        actor: system
        preconditions:
          - "the DEPOSIT milestone (sequence 1) is SETTLED after waterfall allocation"
          - "at least one INTERIM/FINAL milestone is not SETTLED"
        side_effects:
          - "recompute milestone allocation; increments Booking.version by 1"
      - from: DEPOSIT_PAID
        to: PARTIALLY_PAID
        trigger: "system recompute after a further INBOUND payment that partially settles a later milestone"
        actor: system
        preconditions:
          - "amount_paid_cents > deposit milestone amount_due_cents"
          - "amount_paid_cents < event_charge_cents"
        side_effects:
          - "increments Booking.version by 1"
      - from: PARTIALLY_PAID
        to: PAID_IN_FULL
        trigger: "system recompute after an INBOUND payment brings amount_paid_cents >= event_charge_cents"
        actor: system
        preconditions:
          - "amount_paid_cents >= event_charge_cents and event_charge_cents > 0"
          - "every PaymentMilestone is SETTLED or WAIVED"
        side_effects:
          - "increments Booking.version by 1"
      - from: DEPOSIT_PAID
        to: PAID_IN_FULL
        trigger: "system recompute after a single large INBOUND payment settles all milestones at once"
        actor: system
        preconditions:
          - "amount_paid_cents >= event_charge_cents and event_charge_cents > 0"
          - "every PaymentMilestone is SETTLED or WAIVED"
        side_effects:
          - "increments Booking.version by 1"
      - from: PAID_IN_FULL
        to: REFUNDED
        trigger: "system recompute after an OUTBOUND refund Payment returns all inbound funds"
        actor: system
        preconditions:
          - "amount_paid_cents == 0 after netting OUTBOUND against INBOUND"
          - "booking_status == CANCELLED"
        side_effects:
          - "increments Booking.version by 1"
      - from: PARTIALLY_PAID
        to: REFUNDED
        trigger: "system recompute after cancellation refunds net inbound to zero"
        actor: system
        preconditions:
          - "amount_paid_cents == 0 after netting"
          - "booking_status == CANCELLED"
        side_effects:
          - "increments Booking.version by 1"
      - from: DEPOSIT_PAID
        to: REFUNDED
        trigger: "system recompute after cancellation refunds net inbound to zero"
        actor: system
        preconditions:
          - "amount_paid_cents == 0 after netting"
          - "booking_status == CANCELLED"
        side_effects:
          - "increments Booking.version by 1"

  - entity: SpaceHold
    initial_state: HELD
    terminal_states: [RELEASED]
    note: "Branching: HELD forks to COMMITTED (on booking confirm) or RELEASED (on cancel/expire/explicit release)."
    transitions:
      - from: HELD
        to: COMMITTED
        trigger: "side effect of Booking HELD->CONFIRMED"
        actor: system
        preconditions:
          - "parent Booking transitioning HELD->CONFIRMED"
        side_effects:
          - "occupation becomes a hard conflict blocker against other bookings' holds"
      - from: HELD
        to: RELEASED
        trigger: "side effect of Booking cancel/expire, or DELETE /bookings/{id}/holds/{holdId}"
        actor: Coordinator
        preconditions:
          - "hold_status == HELD"
        side_effects:
          - "frees the space-date interval for other holds"
      - from: COMMITTED
        to: RELEASED
        trigger: "side effect of Booking CONFIRMED/GUARANTEED -> CANCELLED, or approved reschedule moving the block"
        actor: system
        preconditions:
          - "hold_status == COMMITTED"
          - "parent Booking is CANCELLED, or an approved RescheduleRequest moved this block to a new interval"
        side_effects:
          - "frees the previously committed space-date interval"

  - entity: Vendor
    initial_state: PENDING
    terminal_states: [REJECTED]
    note: "Cyclic: a vendor may bounce CLEARED->PENDING when its COI expires, then return to CLEARED on a fresh upload."
    transitions:
      - from: PENDING
        to: CLEARED
        trigger: "POST /vendors/{id}/coi (upload COI)"
        actor: Coordinator
        preconditions:
          - "vendor_status == PENDING"
          - "uploaded coi_expires_on date >= parent Booking.event_date"
        side_effects:
          - "set coi_on_file = true; set coi_expires_on from upload"
      - from: CLEARED
        to: PENDING
        trigger: "POST /vendors/{id}/coi with a COI that expires before event_date, OR system revalidation after a reschedule moves event_date later than coi_expires_on"
        actor: Coordinator
        preconditions:
          - "vendor_status == CLEARED"
          - "the (new) coi_expires_on < parent Booking.event_date"
        side_effects:
          - "set coi_on_file = false"
      - from: PENDING
        to: REJECTED
        trigger: "POST /vendors/{id}/reject"
        actor: Coordinator
        preconditions:
          - "vendor_status == PENDING"
        side_effects:
          - "vendor excluded from the booking's cleared-vendor set; blocks GUARANTEED if coi_required"
      - from: CLEARED
        to: REJECTED
        trigger: "POST /vendors/{id}/reject"
        actor: Coordinator
        preconditions:
          - "vendor_status == CLEARED"
        side_effects:
          - "vendor excluded from cleared set"

  - entity: RescheduleRequest
    initial_state: PROPOSED
    terminal_states: [APPROVED, DECLINED, WITHDRAWN]
    note: |
      Cyclic negotiation. Client proposes; venue may COUNTER (creating a counter that
      awaits client); client may re-propose a new round superseding the prior; either
      side approves/declines/withdraws. APPROVED rewrites the parent Booking's block
      times and re-evaluates space-date conflicts.
    transitions:
      - from: PROPOSED
        to: COUNTERED
        trigger: "POST /reschedule-requests/{id}/counter"
        actor: Coordinator
        preconditions:
          - "request_status == PROPOSED"
          - "parent Booking.booking_status IN {CONFIRMED, GUARANTEED}"
        side_effects:
          - "record the venue's counter block times on the request"
      - from: COUNTERED
        to: PROPOSED
        trigger: "POST /bookings/{id}/reschedule-requests with supersedes_request_id pointing at the countered request (client re-proposes a new round)"
        actor: Client
        preconditions:
          - "the superseded request_status == COUNTERED"
        side_effects:
          - "set superseded request_status = WITHDRAWN; new RescheduleRequest starts at PROPOSED"
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /reschedule-requests/{id}/approve"
        actor: Coordinator
        preconditions:
          - "request_status == PROPOSED"
          - "proposed block times pass space-date overlap checks against the target space (excluding this booking's own holds)"
          - "no other PROPOSED/COUNTERED RescheduleRequest exists for this booking"
        side_effects:
          - "rewrite parent Booking.event_date and block times to the proposed values"
          - "for every COMMITTED SpaceHold of the booking: RELEASE the old interval and re-create a COMMITTED hold at the new interval (cascade: SpaceHold->Booking inventory)"
          - "re-derive GuestCountGuarantee.guarantee_deadline from the new event_date"
          - "if reason_kind=FORCE_MAJEURE: retain Venue.force_majeure_fee_pct of amount_paid_cents as fee and post an OUTBOUND Payment for the remainder of any overpayment (compensating cascade)"
          - "system revalidates every Vendor: any whose coi_expires_on < new event_date bounces CLEARED->PENDING"
          - "increments Booking.version by 1"
      - from: COUNTERED
        to: APPROVED
        trigger: "POST /reschedule-requests/{id}/approve (client accepts the venue counter)"
        actor: Client
        preconditions:
          - "request_status == COUNTERED"
          - "counter block times pass space-date overlap checks against the target space"
        side_effects:
          - "rewrite parent Booking to the counter block times"
          - "same SpaceHold re-creation, guarantee re-derivation, vendor revalidation cascade as the PROPOSED->APPROVED path"
          - "increments Booking.version by 1"
      - from: PROPOSED
        to: DECLINED
        trigger: "POST /reschedule-requests/{id}/decline"
        actor: Coordinator
        preconditions:
          - "request_status == PROPOSED"
        side_effects:
          - "no change to parent Booking block times"
      - from: COUNTERED
        to: WITHDRAWN
        trigger: "POST /reschedule-requests/{id}/withdraw"
        actor: Client
        preconditions:
          - "request_status == COUNTERED"
        side_effects:
          - "no change to parent Booking block times"
      - from: PROPOSED
        to: WITHDRAWN
        trigger: "POST /reschedule-requests/{id}/withdraw"
        actor: Client
        preconditions:
          - "request_status == PROPOSED"
        side_effects:
          - "no change to parent Booking block times"

# =====================================================================
# §1.2.1 Concurrency Rules
# =====================================================================
concurrency_rules:
  - rule_id: hold-create-stale-booking
    parent_entity: Booking
    write_endpoint: "POST /bookings/{id}/holds"
    occ_field: "expected_booking_version"
    description: |
      Creating a SpaceHold against a Booking whose version has advanced since the
      client last observed it is rejected. A SpaceHold creation legitimately
      supersedes the prior block assignment for the same block_role (the new hold
      replaces the client's earlier choice of space for that block); when another
      writer has already added or replaced a hold for this booking, the current
      writer's view of the booking is stale and the create is rejected on the
      version mismatch rather than silently double-occupying.
    error_id: ERR_STALE_BOOKING_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: provisional_event_charge
    trigger: "Booking HELD->CONFIRMED side effect; recomputed on package change while CONFIRMED"
    algorithm: forward_looking
    formula: |
      # Provisional charge uses expected_guest_count (estimate, not yet guaranteed).
      billable_heads = expected_guest_count
      fb_subtotal = max(billable_heads * Package.per_head_cents, Package.fb_minimum_cents)
      # service charge then tax, applied in THIS pinned order (service first, then tax on the serviced amount):
      service = round_half_up(fb_subtotal * Package.service_charge_pct)
      taxed_base = fb_subtotal + service
      tax = round_half_up(taxed_base * Package.tax_pct)
      rental = sum(Space.base_rental_cents for each DISTINCT space across this booking's SpaceHolds with hold_status IN {HELD, COMMITTED})
      event_charge_cents = fb_subtotal + service + tax + rental
    input_set: "Holds with hold_status IN {HELD, COMMITTED}; DISTINCT spaces so a ceremony+reception in the SAME dual space is charged rental once"
    constants:
      ROUNDING: "round_half_up to whole cents at each named step"
    precision: "integer cents, round_half_up at the service and tax steps independently"
    variants:
      - name: provisional
        when: "booking_status < GUARANTEED (INQUIRY/HELD/CONFIRMED)"
        difference: "billable_heads = expected_guest_count"

  - name: final_event_charge
    trigger: "Booking CONFIRMED->GUARANTEED side effect (guarantee locked)"
    algorithm: forward_looking
    formula: |
      # Final charge bills F&B against the GUARANTEED count, which is the contractual floor
      # the client pays even if fewer guests attend. It replaces expected_guest_count entirely
      # (NOT max(expected, guaranteed) — the locked guarantee is authoritative).
      billable_heads = GuestCountGuarantee.guaranteed_count
      fb_subtotal = max(billable_heads * Package.per_head_cents, Package.fb_minimum_cents)
      service = round_half_up(fb_subtotal * Package.service_charge_pct)
      tax = round_half_up((fb_subtotal + service) * Package.tax_pct)
      rental = sum(Space.base_rental_cents for each DISTINCT space across COMMITTED SpaceHolds)
      event_charge_cents = fb_subtotal + service + tax + rental
    input_set: "COMMITTED holds only (booking is past CONFIRMED); DISTINCT spaces"
    constants:
      ROUNDING: "round_half_up to whole cents"
    precision: "integer cents"
    variants:
      - name: final
        when: "booking_status == GUARANTEED"
        difference: "billable_heads = guaranteed_count (replaces expected_guest_count); produces a different event_charge than provisional whenever guaranteed_count != expected_guest_count OR the F&B minimum floor binds differently"

  - name: milestone_schedule
    trigger: "Booking HELD->CONFIRMED (initial schedule build); recomputed on CONFIRMED->GUARANTEED"
    algorithm: waterfall_allocation
    formula: |
      # Split the current event_charge_cents across three milestones by fixed fractions,
      # allocating the rounding remainder to the FINAL milestone so the three amounts
      # sum EXACTLY to event_charge_cents (conservation invariant).
      deposit = round_half_up(event_charge_cents * DEPOSIT_PCT)      # sequence 1, kind DEPOSIT
      interim = round_half_up(event_charge_cents * INTERIM_PCT)      # sequence 2, kind INTERIM
      final   = event_charge_cents - deposit - interim              # sequence 3, kind FINAL (absorbs remainder)
      # Then allocate posted INBOUND payments (net of OUTBOUND) across milestones in
      # ascending sequence: fill milestone 1 to its amount_due, overflow to 2, then 3.
      # milestone_status = SETTLED when amount_allocated == amount_due; PARTIAL if 0 < allocated < due; OPEN if 0.
    input_set: "All non-WAIVED milestones in ascending sequence; payments where status=POSTED ordered by posted_at ASC then created_at ASC"
    constants:
      DEPOSIT_PCT: 0.25
      INTERIM_PCT: 0.35
      # FINAL absorbs the remainder (0.40 nominal but computed as the exact residual)
    precision: "integer cents; remainder lands in FINAL so sum(milestones) == event_charge_cents exactly"
    variants:
      - name: deposit_due
        when: "milestone kind=DEPOSIT"
        difference: "due_date defaults to confirmation date; must be SETTLED before CONFIRMED"
      - name: final_residual
        when: "milestone kind=FINAL"
        difference: "amount_due = event_charge - deposit - interim (absorbs all rounding remainder, never independently rounded)"

  - name: cancellation_refund
    trigger: "Booking *->CANCELLED with cause CLIENT_CANCEL; also the remainder branch of FORCE_MAJEURE reschedule approval"
    algorithm: threshold
    formula: |
      # Refund of the net inbound amount, reduced by a retention fraction that depends on
      # BOTH the venue cancellation_tier AND how close booking_status is to the event.
      paid = amount_paid_cents   # net inbound (INBOUND POSTED minus OUTBOUND POSTED), pre-refund
      retention_pct = retention_table[Venue.cancellation_tier][booking_status_at_cancel]
      retained = round_half_up(paid * retention_pct)
      refund_cents = paid - retained          # OUTBOUND Payment posted for this amount when > 0
    input_set: "Single booking; retention keyed on (cancellation_tier, booking_status at the instant of cancel)"
    constants:
      retention_table: |
        STANDARD: { HELD: 0.00, CONFIRMED: 0.25, GUARANTEED: 0.50 }
        STRICT:   { HELD: 0.00, CONFIRMED: 0.50, GUARANTEED: 1.00 }
        FLEXIBLE: { HELD: 0.00, CONFIRMED: 0.00, GUARANTEED: 0.25 }
    precision: "integer cents, round_half_up on retained"
    variants:
      - name: client_cancel
        when: "cancelled_reason == CLIENT_CANCEL"
        difference: "retained uses the tier/status table above"
      - name: force_majeure_remainder
        when: "FORCE_MAJEURE RescheduleRequest approved with overpayment"
        difference: "retained = round_half_up(paid * Venue.force_majeure_fee_pct) instead of the tier table; refund only the overpayment beyond the new event_charge"

  - name: coordinator_load
    trigger: "Coordinator assignment (POST /bookings/{id}/assign-coordinator), and on Booking terminal transitions"
    algorithm: aggregation
    formula: |
      assigned_active_count = count(Booking b where b.coordinator_id == this.id
                                     and b.booking_status NOT IN {COMPLETED, CANCELLED})
    input_set: "Bookings assigned to the coordinator with non-terminal booking_status"
    constants: {}
    precision: "integer count"

# =====================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a recognized role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Acting role is permitted to invoke this endpoint per the RBAC matrix"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "For Client-owned operations, X-User-ID equals the Booking.client_id; for Coordinator operations, the coordinator belongs to the booking's venue"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "Client/Coordinator booking sub-operations"
  - priority: 4
    category: existence
    check: "Every path id resolves to an existing resource, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all path-parameterized endpoints"
  - priority: 5
    category: existence
    check: "Every FK in the request body references an existing, non-ARCHIVED parent (venue/package/space/client)"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "POST /bookings, POST /bookings/{id}/holds, POST /bookings/{id}/vendors"
  - priority: 6
    category: business_constraint
    check: "Required body fields present and well-typed; enums in range; numeric fields satisfy declared bounds"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all write endpoints"
  - priority: 7
    category: business_temporal
    check: "Block time ordering: ceremony_start < ceremony_end <= reception_start < reception_end; event_date strictly in the future at creation"
    error_id: ERR_INVALID_TIME_WINDOW
    http_status: 422
    applies_to: "POST /bookings, reschedule proposals, walkthroughs"
  - priority: 8
    category: state
    check: "Target resource is in a state from which the requested transition is defined (booking_status / hold_status / vendor_status / request_status)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 9
    category: state
    check: "OCC: expected_booking_version matches Booking.version on hold-create"
    error_id: ERR_STALE_BOOKING_VERSION
    http_status: 412
    applies_to: "POST /bookings/{id}/holds"
  - priority: 10
    category: business_safety
    check: "Guaranteed/expected guest count does not exceed the seated max_capacity of the reception space (capacity safety)"
    error_id: ERR_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /bookings, POST /bookings/{id}/guarantee, reschedule approval"
  - priority: 11
    category: business_referential
    check: "On hold creation, block_role is compatible with Space.space_kind (CEREMONY hold needs space_kind IN {CEREMONY, DUAL}; RECEPTION hold needs space_kind IN {RECEPTION, DUAL})"
    error_id: ERR_SPACE_KIND_MISMATCH
    http_status: 422
    applies_to: "POST /bookings/{id}/holds"
  - priority: 12
    category: business_temporal
    check: "Space-date overlap: the requested occupation interval must not collide (per the space's interval semantics, including turnover_buffer) with any other booking's blocking hold on the SAME space"
    error_id: ERR_SPACE_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /bookings/{id}/holds, reschedule approval"
  - priority: 13
    category: business_temporal
    check: "Walkthrough appointment must not overlap another SCHEDULED walkthrough on the same coordinator (coordinator calendar conflict)"
    error_id: ERR_WALKTHROUGH_CONFLICT
    http_status: 409
    applies_to: "POST /bookings/{id}/walkthroughs"
  - priority: 14
    category: business_constraint
    check: "Coordinator assignment must not push Coordinator.assigned_active_count above active_booking_cap"
    error_id: ERR_COORDINATOR_AT_CAPACITY
    http_status: 409
    applies_to: "POST /bookings/{id}/assign-coordinator"
  - priority: 15
    category: business_referential
    check: "Guarantee requires that every Vendor of the booking with coi_required=true has vendor_status=CLEARED (no PENDING or REJECTED required-COI vendor remains)"
    error_id: ERR_VENDOR_COI_MISSING
    http_status: 409
    applies_to: "POST /bookings/{id}/guarantee"
  - priority: 16
    category: business_temporal
    check: "Guarantee may only be locked on or before guarantee_deadline (event_date minus venue guarantee window)"
    error_id: ERR_GUARANTEE_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /bookings/{id}/guarantee"
  - priority: 17
    category: business_fiscal
    check: "Confirm requires the DEPOSIT milestone to be SETTLED (deposit paid)"
    error_id: ERR_DEPOSIT_NOT_SETTLED
    http_status: 402
    applies_to: "POST /bookings/{id}/confirm"
  - priority: 18
    category: business_fiscal
    check: "Complete requires payment_status == PAID_IN_FULL (no outstanding balance)"
    error_id: ERR_BALANCE_OUTSTANDING
    http_status: 402
    applies_to: "POST /bookings/{id}/complete"
  - priority: 19
    category: business_constraint
    check: "An INBOUND payment may not exceed the current balance_due_cents (no overpayment beyond the contracted charge)"
    error_id: ERR_OVERPAYMENT
    http_status: 422
    applies_to: "POST /bookings/{id}/payments where direction=INBOUND"
  - priority: 20
    category: business_constraint
    check: "Only one active (PROPOSED or COUNTERED) RescheduleRequest may exist per booking at a time"
    error_id: ERR_RESCHEDULE_IN_PROGRESS
    http_status: 409
    applies_to: "POST /bookings/{id}/reschedule-requests"
  - priority: 21
    category: business_temporal
    check: "Walkthrough must be scheduled strictly before the booking's event_date"
    error_id: ERR_WALKTHROUGH_AFTER_EVENT
    http_status: 422
    applies_to: "POST /bookings/{id}/walkthroughs"

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:
  # ---- Venue / inventory configuration (VenueAdmin) ----
  - method: POST
    path: "/venues"
    description: "Create a venue"
    roles: [VenueAdmin]
    code: 201
    input: ["name", "timezone?", "cancellation_tier?", "force_majeure_fee_pct?"]
    output: Venue
    side_effects: []
  - method: GET
    path: "/venues/{id}"
    description: "Fetch a venue"
    roles: [VenueAdmin, Coordinator, Client, FinanceOfficer]
    code: 200
    input: []
    output: Venue
    side_effects: []
  - method: POST
    path: "/venues/{id}/archive"
    description: "Archive a venue (blocks new bookings)"
    roles: [VenueAdmin]
    code: 200
    input: []
    output: Venue
    side_effects: ["set Venue.status = ARCHIVED"]
  - method: POST
    path: "/venues/{id}/spaces"
    description: "Create a bookable space under a venue"
    roles: [VenueAdmin]
    code: 201
    input: ["name", "space_kind", "max_capacity", "base_rental_cents", "turnover_buffer_minutes?"]
    output: Space
    side_effects: []
  - method: GET
    path: "/venues/{id}/spaces"
    description: "List spaces under a venue (reverse-reachability for Space.venue_id)"
    roles: [VenueAdmin, Coordinator, Client, FinanceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: Space[]
    side_effects: []
  - method: POST
    path: "/venues/{id}/packages"
    description: "Create an F&B package under a venue"
    roles: [VenueAdmin]
    code: 201
    input: ["tier", "per_head_cents", "fb_minimum_cents", "service_charge_pct?", "tax_pct?"]
    output: Package
    side_effects: []
  - method: GET
    path: "/venues/{id}/packages"
    description: "List packages under a venue (reverse-reachability for Package.venue_id)"
    roles: [VenueAdmin, Coordinator, Client, FinanceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: Package[]
    side_effects: []
  - method: POST
    path: "/venues/{id}/coordinators"
    description: "Create a coordinator under a venue"
    roles: [VenueAdmin]
    code: 201
    input: ["full_name", "active_booking_cap?"]
    output: Coordinator
    side_effects: []
  - method: GET
    path: "/venues/{id}/coordinators"
    description: "List coordinators under a venue (reverse-reachability for Coordinator.venue_id)"
    roles: [VenueAdmin, Coordinator, Client, FinanceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: Coordinator[]
    side_effects: []
  - method: GET
    path: "/coordinators/{id}"
    description: "Fetch a coordinator (with computed assigned_active_count)"
    roles: [VenueAdmin, Coordinator, FinanceOfficer]
    code: 200
    input: []
    output: Coordinator
    side_effects: []

  # ---- Clients ----
  - method: POST
    path: "/clients"
    description: "Register a client account"
    roles: [VenueAdmin, Client]
    code: 201
    input: ["full_name", "email"]
    output: Client
    side_effects: []
  - method: GET
    path: "/clients/{id}"
    description: "Fetch a client"
    roles: [VenueAdmin, Client, Coordinator]
    code: 200
    input: []
    output: Client
    side_effects: []

  # ---- Bookings (Client creates; Coordinator drives lifecycle) ----
  - method: POST
    path: "/bookings"
    description: "Create a booking inquiry"
    roles: [Client, Coordinator]
    code: 201
    input: ["client_id", "venue_id", "package_id", "event_date", "ceremony_start", "ceremony_end", "reception_start", "reception_end", "expected_guest_count"]
    output: Booking
    side_effects: ["booking_status=INQUIRY, payment_status=UNPAID"]
  - method: GET
    path: "/bookings/{id}"
    description: "Fetch a booking with computed charge fields"
    roles: [VenueAdmin, Coordinator, Client, FinanceOfficer]
    code: 200
    input: []
    output: Booking
    side_effects: []
  - method: GET
    path: "/bookings"
    description: "List bookings; filterable by client_id, venue_id, package_id, coordinator_id, booking_status (reverse-reachability for Booking.client_id/venue_id/package_id/coordinator_id)"
    roles: [VenueAdmin, Coordinator, FinanceOfficer]
    code: 200
    input: ["client_id?", "venue_id?", "package_id?", "coordinator_id?", "booking_status?", "limit?", "offset?"]
    output: Booking[]
    side_effects: []
  - method: POST
    path: "/bookings/{id}/assign-coordinator"
    description: "Assign a coordinator to a booking"
    roles: [VenueAdmin, Coordinator]
    code: 200
    input: ["coordinator_id"]
    output: Booking
    side_effects: ["set Booking.coordinator_id", "increment Coordinator.assigned_active_count (coordinator_load)"]
  - method: POST
    path: "/bookings/{id}/holds"
    description: "Create a SpaceHold for a block on this booking"
    roles: [Coordinator]
    code: 201
    input: ["space_id", "block_role", "expected_booking_version"]
    output: SpaceHold
    side_effects: ["create SpaceHold HELD copying block times from booking", "increments Booking.version by 1"]
  - method: GET
    path: "/bookings/{id}/holds"
    description: "List SpaceHolds for a booking (reverse-reachability for SpaceHold.booking_id)"
    roles: [VenueAdmin, Coordinator, Client, FinanceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: SpaceHold[]
    side_effects: []
  - method: GET
    path: "/holds"
    description: "List SpaceHolds filterable by space_id or booking_id (reverse-reachability for SpaceHold.space_id)"
    roles: [VenueAdmin, Coordinator, FinanceOfficer]
    code: 200
    input: ["space_id?", "booking_id?", "hold_status?", "limit?", "offset?"]
    output: SpaceHold[]
    side_effects: []
  - method: GET
    path: "/holds/{id}"
    description: "Fetch a single SpaceHold by id"
    roles: [VenueAdmin, Coordinator, Client, FinanceOfficer]
    code: 200
    input: []
    output: SpaceHold
    side_effects: []
  - method: DELETE
    path: "/bookings/{id}/holds/{holdId}"
    description: "Release a HELD SpaceHold explicitly"
    roles: [Coordinator]
    code: 200
    input: []
    output: SpaceHold
    side_effects: ["transition SpaceHold HELD->RELEASED"]
  - method: POST
    path: "/bookings/{id}/place-hold"
    description: "Transition booking INQUIRY->HELD (soft hold with expiry)"
    roles: [Coordinator]
    code: 200
    input: []
    output: Booking
    side_effects: ["set hold_expires_at", "increments Booking.version by 1"]
  - method: POST
    path: "/bookings/{id}/confirm"
    description: "Transition booking HELD->CONFIRMED; commits holds, builds milestone schedule, computes provisional charge"
    roles: [Coordinator]
    code: 200
    input: []
    output: Booking
    side_effects: ["commit holds", "provisional_event_charge", "milestone_schedule", "increments Booking.version by 1"]
  - method: POST
    path: "/bookings/{id}/guarantee"
    description: "Lock the guest-count guarantee; transition CONFIRMED->GUARANTEED; switch to final charge"
    roles: [Coordinator]
    code: 200
    input: ["guaranteed_count"]
    output: Booking
    side_effects: ["create GuestCountGuarantee", "final_event_charge", "recompute milestone_schedule", "increments Booking.version by 1"]
  - method: GET
    path: "/bookings/{id}/guarantee"
    description: "Fetch the guarantee for a booking (reverse-reachability for GuestCountGuarantee.booking_id)"
    roles: [VenueAdmin, Coordinator, Client, FinanceOfficer]
    code: 200
    input: []
    output: GuestCountGuarantee[]
    side_effects: []
  - method: POST
    path: "/bookings/{id}/complete"
    description: "Transition booking GUARANTEED->COMPLETED after the event"
    roles: [Coordinator]
    code: 200
    input: []
    output: Booking
    side_effects: ["cancel scheduled walkthroughs", "decrement coordinator load", "increments Booking.version by 1"]
  - method: POST
    path: "/bookings/{id}/cancel"
    description: "Cancel a booking (releases holds, refunds per tier, waives milestones)"
    roles: [Client, Coordinator]
    code: 200
    input: []
    output: Booking
    side_effects: ["release holds", "cancellation_refund -> OUTBOUND Payment", "waive milestones", "payment_status recompute", "increments Booking.version by 1"]

  # ---- Payments & milestones (FinanceOfficer) ----
  - method: GET
    path: "/bookings/{id}/milestones"
    description: "List payment milestones for a booking (reverse-reachability for PaymentMilestone.booking_id)"
    roles: [VenueAdmin, Coordinator, Client, FinanceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: PaymentMilestone[]
    side_effects: []
  - method: POST
    path: "/bookings/{id}/payments"
    description: "Post a payment (INBOUND client payment or OUTBOUND refund)"
    roles: [FinanceOfficer]
    code: 201
    input: ["direction", "amount_cents", "method"]
    output: Payment
    side_effects: ["waterfall-allocate to milestones", "recompute amount_paid_cents/balance_due_cents", "recompute payment_status", "increments Booking.version by 1"]
  - method: GET
    path: "/bookings/{id}/payments"
    description: "List payments for a booking (reverse-reachability for Payment.booking_id)"
    roles: [VenueAdmin, Coordinator, Client, FinanceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: Payment[]
    side_effects: []

  # ---- Vendors & COI (Coordinator) ----
  - method: POST
    path: "/bookings/{id}/vendors"
    description: "Add a vendor to the booking's vendor list"
    roles: [Coordinator, Client]
    code: 201
    input: ["company_name", "vendor_role"]
    output: Vendor
    side_effects: ["coi_required derived from vendor_role/venue policy", "vendor_status=PENDING"]
  - method: GET
    path: "/bookings/{id}/vendors"
    description: "List vendors for a booking (reverse-reachability for Vendor.booking_id)"
    roles: [VenueAdmin, Coordinator, Client, FinanceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: Vendor[]
    side_effects: []
  - method: POST
    path: "/vendors/{id}/coi"
    description: "Upload/replace a Certificate of Insurance for a vendor"
    roles: [Coordinator]
    code: 200
    input: ["coi_expires_on"]
    output: Vendor
    side_effects: ["set coi_on_file/coi_expires_on", "transition PENDING<->CLEARED per expiry vs event_date"]
  - method: POST
    path: "/vendors/{id}/reject"
    description: "Reject a vendor"
    roles: [Coordinator]
    code: 200
    input: []
    output: Vendor
    side_effects: ["vendor_status=REJECTED"]

  # ---- Walkthroughs (Coordinator) ----
  - method: POST
    path: "/bookings/{id}/walkthroughs"
    description: "Schedule a walkthrough appointment"
    roles: [Coordinator]
    code: 201
    input: ["scheduled_start", "scheduled_end"]
    output: Walkthrough
    side_effects: ["walkthrough_status=SCHEDULED"]
  - method: GET
    path: "/bookings/{id}/walkthroughs"
    description: "List walkthroughs for a booking (reverse-reachability for Walkthrough.booking_id)"
    roles: [VenueAdmin, Coordinator, Client, FinanceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: Walkthrough[]
    side_effects: []

  # ---- Reschedule / force-majeure (Client proposes, Coordinator counters) ----
  - method: POST
    path: "/bookings/{id}/reschedule-requests"
    description: "Propose a reschedule (CLIENT_REQUEST or FORCE_MAJEURE); optionally supersede a countered round"
    roles: [Client]
    code: 201
    input: ["reason_kind", "proposed_event_date", "proposed_ceremony_start", "proposed_ceremony_end", "proposed_reception_start", "proposed_reception_end", "supersedes_request_id?"]
    output: RescheduleRequest
    side_effects: ["request_status=PROPOSED; if superseding, prior COUNTERED -> WITHDRAWN"]
  - method: GET
    path: "/bookings/{id}/reschedule-requests"
    description: "List reschedule requests for a booking (reverse-reachability for RescheduleRequest.booking_id)"
    roles: [VenueAdmin, Coordinator, Client, FinanceOfficer]
    code: 200
    input: ["request_status?", "limit?", "offset?"]
    output: RescheduleRequest[]
    side_effects: []
  - method: GET
    path: "/reschedule-requests"
    description: "List reschedule requests filterable by booking_id or supersedes_request_id (reverse-reachability for RescheduleRequest.supersedes_request_id)"
    roles: [VenueAdmin, Coordinator, Client, FinanceOfficer]
    code: 200
    input: ["booking_id?", "supersedes_request_id?", "request_status?", "limit?", "offset?"]
    output: RescheduleRequest[]
    side_effects: []
  - method: GET
    path: "/reschedule-requests/{id}"
    description: "Fetch a single reschedule request by id"
    roles: [VenueAdmin, Coordinator, Client, FinanceOfficer]
    code: 200
    input: []
    output: RescheduleRequest
    side_effects: []
  - method: POST
    path: "/reschedule-requests/{id}/counter"
    description: "Venue counters a proposed reschedule with alternate block times"
    roles: [Coordinator]
    code: 200
    input: ["proposed_event_date", "proposed_ceremony_start", "proposed_ceremony_end", "proposed_reception_start", "proposed_reception_end"]
    output: RescheduleRequest
    side_effects: ["request_status PROPOSED->COUNTERED; record counter times"]
  - method: POST
    path: "/reschedule-requests/{id}/approve"
    description: "Approve a reschedule (Coordinator approves PROPOSED, Client approves COUNTERED); rewrites booking block times"
    roles: [Coordinator, Client]
    code: 200
    input: ["expected_booking_version"]
    output: RescheduleRequest
    side_effects: ["rewrite Booking block times", "re-create COMMITTED holds at new interval", "re-derive guarantee_deadline", "revalidate vendors", "FORCE_MAJEURE fee/refund", "increments Booking.version by 1"]
  - method: POST
    path: "/reschedule-requests/{id}/decline"
    description: "Decline a proposed reschedule"
    roles: [Coordinator]
    code: 200
    input: []
    output: RescheduleRequest
    side_effects: ["request_status PROPOSED->DECLINED"]
  - method: POST
    path: "/reschedule-requests/{id}/withdraw"
    description: "Client withdraws a PROPOSED or COUNTERED reschedule"
    roles: [Client]
    code: 200
    input: []
    output: RescheduleRequest
    side_effects: ["request_status -> WITHDRAWN"]

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set"
    description: "Set the server's current UTC clock (test-driving; deadlines and hold expiry read this clock)"
    roles: [VenueAdmin]
    code: 200
    input: ["to_iso8601"]
    output: null
    side_effects: ["sets the simulated current_clock used by all temporal checks"]
  - method: POST
    path: "/bookings/{id}/expire-hold"
    description: "System sweep: if current_clock >= hold_expires_at, expire a HELD booking (test-driving trigger for the lapse path)"
    roles: [VenueAdmin, Coordinator]
    code: 200
    input: []
    output: Booking
    side_effects: ["if lapsed: HELD->CANCELLED(NONPAYMENT), release HELD holds", "increments Booking.version by 1"]

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/unrecognized X-User-Role or missing X-User-ID"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Acting role not permitted for this endpoint"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "Client acting on a booking they do not own, or coordinator from a different venue"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A path id does not resolve to an existing resource"
  - id: ERR_REFERENCE_NOT_FOUND
    http: 404
    condition: "A body FK references a missing or ARCHIVED parent (venue/package/space/client)"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "Missing required field, wrong type, enum out of range, or numeric bound violation"
  - id: ERR_INVALID_TIME_WINDOW
    http: 422
    condition: "Block/walkthrough time ordering invalid, or event_date not strictly in the future at creation"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition not defined from the resource's current state"
  - id: ERR_STALE_BOOKING_VERSION
    http: 412
    condition: "expected_booking_version does not match Booking.version on a guarded write"
  - id: ERR_CAPACITY_EXCEEDED
    http: 422
    condition: "Guest count exceeds the seated max_capacity of the reception space"
  - id: ERR_SPACE_KIND_MISMATCH
    http: 422
    condition: "block_role incompatible with the space's space_kind"
  - id: ERR_SPACE_DOUBLE_BOOKED
    http: 409
    condition: "Occupation interval (with turnover buffer) collides with another booking's blocking hold on the same space"
  - id: ERR_WALKTHROUGH_CONFLICT
    http: 409
    condition: "Walkthrough overlaps another SCHEDULED walkthrough on the same coordinator"
  - id: ERR_COORDINATOR_AT_CAPACITY
    http: 409
    condition: "Assignment would push the coordinator above active_booking_cap"
  - id: ERR_VENDOR_COI_MISSING
    http: 409
    condition: "Guarantee attempted while a coi_required vendor is not CLEARED"
  - id: ERR_GUARANTEE_DEADLINE_PASSED
    http: 409
    condition: "Guarantee attempted after guarantee_deadline"
  - id: ERR_DEPOSIT_NOT_SETTLED
    http: 402
    condition: "Confirm attempted before the DEPOSIT milestone is SETTLED"
  - id: ERR_BALANCE_OUTSTANDING
    http: 402
    condition: "Complete attempted while payment_status != PAID_IN_FULL"
  - id: ERR_OVERPAYMENT
    http: 422
    condition: "INBOUND payment exceeds current balance_due_cents"
  - id: ERR_RESCHEDULE_IN_PROGRESS
    http: 409
    condition: "A PROPOSED/COUNTERED reschedule already exists for the booking when proposing a fresh (non-superseding) one"
  - id: ERR_WALKTHROUGH_AFTER_EVENT
    http: 422
    condition: "Walkthrough scheduled on or after the booking's event_date"
  - id: ERR_COI_EXPIRES_BEFORE_EVENT
    http: 422
    condition: "Uploaded COI's coi_expires_on is before the booking's event_date"
  - id: ERR_VALIDATION_LIMIT
    http: 422
    condition: "Pagination limit/offset outside the allowed [1,100]/[0,..] bounds"

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: VenueAdmin
    description: "Owns venue/space/package/coordinator configuration and the test clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /venues"
      - "POST /venues/{id}/archive"
      - "POST /venues/{id}/spaces"
      - "POST /venues/{id}/packages"
      - "POST /venues/{id}/coordinators"
      - "POST /_clock/set"
    shared_operations:
      - "POST /clients"
      - "POST /bookings/{id}/assign-coordinator"
      - "POST /bookings/{id}/expire-hold"
      - "GET (read endpoints)"
  - name: Coordinator
    description: "Venue-side staff who drive the booking lifecycle, holds, vendors, walkthroughs, counters"
    identity: "entity_backed:Coordinator"
    exclusive_operations:
      - "POST /bookings/{id}/place-hold"
      - "POST /bookings/{id}/confirm"
      - "POST /bookings/{id}/guarantee"
      - "POST /bookings/{id}/complete"
      - "POST /bookings/{id}/holds"
      - "DELETE /bookings/{id}/holds/{holdId}"
      - "POST /vendors/{id}/coi"
      - "POST /vendors/{id}/reject"
      - "POST /bookings/{id}/walkthroughs"
      - "POST /reschedule-requests/{id}/counter"
      - "POST /reschedule-requests/{id}/decline"
    shared_operations:
      - "POST /bookings"
      - "POST /bookings/{id}/vendors"
      - "POST /bookings/{id}/assign-coordinator"
      - "POST /bookings/{id}/cancel"
      - "POST /reschedule-requests/{id}/approve"
      - "POST /bookings/{id}/expire-hold"
      - "GET (read endpoints)"
  - name: Client
    description: "The booking owner; creates bookings, adds vendors, proposes reschedules, cancels"
    identity: "entity_backed:Client"
    exclusive_operations:
      - "POST /bookings/{id}/reschedule-requests"
      - "POST /reschedule-requests/{id}/withdraw"
    shared_operations:
      - "POST /clients"
      - "POST /bookings"
      - "POST /bookings/{id}/vendors"
      - "POST /bookings/{id}/cancel"
      - "POST /reschedule-requests/{id}/approve"
      - "GET (own booking read endpoints)"
  - name: FinanceOfficer
    description: "Owns payment posting and refunds; cannot drive booking lifecycle"
    identity: "opaque"
    exclusive_operations:
      - "POST /bookings/{id}/payments"
    shared_operations:
      - "GET (read endpoints)"
