            - call: "GET /distributors/${dx}"
              as: PlantAdmin
              captures: { dx_held: $.data.deposits_held_cents, dx_credit: $.data.credit_balance_cents }
          assert:
            - "captured d1_age == 30 and captured d1_ref == 200000 (100% bracket, inclusive boundary)"
            - "captured d2_age == 31 and captured d2_ref == 160000 (80% bracket)"
            - "captured d1_status == CLOSED_REFUNDED and captured d2_status == CLOSED_REFUNDED"
            - "captured dx_held == 0"
            - "captured dx_credit == 560000 (two GRADE_A credits 2 x 100000 plus refunds 200000 + 160000)"

      - name: dyno_oil_pressure_threshold_equality
        grounds:
