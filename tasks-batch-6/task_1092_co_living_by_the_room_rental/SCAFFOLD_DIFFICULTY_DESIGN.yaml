  # ===================================================================
  # Rule 9 - compensating-action invariants on different conserved quantities
  # ===================================================================
  - rule_id: compensating_invariant
    instances:

      - name: late_fee_assess_then_waive_conserves_membership_balance_due
        grounds:
          - calculations.membership_balance_due
          - calculations.invoice_charge_assembly
          - state_machines.Invoice.PAST_DUE_to_PAST_DUE
          - entities.Invoice.fields.late_fee_cents
          - entities.Membership.fields.balance_due_cents
        distinguishing_aspect: |
          The conserved quantity is MONEY: Membership.balance_due_cents, pinned as
          SUM over Invoice with status IN {OPEN, PARTIAL, PAST_DUE} of
          (total_amount_cents - amount_paid_cents). Assessing a 2500 late fee and then waiving
          it must return that sum to exactly 39000 with zero drift on either the invoice total
          or the membership balance.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-06T00:00:00Z; one-room house Peachtree A, Ada on an ACTIVE WEEKLY tenancy since 2026-06-01."
            - "One OPEN invoice covers 2026-06-01..2026-06-07 with subtotal_cents 39000, late_fee_cents 0 and amount_paid_cents 0."
            - "Membership.balance_due_cents therefore reads exactly 39000 before the trigger."
          setup_api_calls:
            - call: "POST /co-living/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /co-living/hosts"
