      - name: block_utilization_returns_to_open_on_cancel
        claim_type: aggregation
        grounds:
          - calculations.surgery_block_utilization
          - calculations.surgery_block_utilization.input_set
          - state_machines.SurgeryCenterBlock.FULL_to_OPEN
          - entities.SurgeryCenterBlock.fields.utilization_bps
        distinguishing_aspect: "Two 240-minute bookings fill a 480-minute capacity to exactly 10000 bps and flip the block to FULL; cancelling one drops booked_minutes to 240 and utilization_bps to 5000 and returns the block to OPEN, and a fresh 120-minute booking is then accepted — the running total after a reversal equals a full recompute."
        test_recipe:
          setup:
            - "PayerPolicy and three adult Patients, so no pediatric or overnight rule participates."
            - "SurgeryCenterBlock 2026-08-10T08:00Z..12:00Z, max_concurrent_cases 2, so duration 240 and capacity_minutes 480."
            - "Two TYMPANOSTOMY_TUBES / SURGERY_CENTER bookings spanning the whole window (08:00..12:00), which is 2 concurrent cases at every instant — exactly at the ceiling."
          setup_api_calls:
            - call: "POST /payer-policies"
              payload: { payer_name: "Aggregate Health", plan_code: "CALF-2999" }
              as: PracticeAdmin
              captures: { pol_id: $.data.id }
