              as: SafetyInvestigator
              captures: { inc_v_decided: $.data.version }
            - call: "GET /safety/accounts/${acct_id}"
              payload: {}
              as: PlatformAdmin
              captures: { standing_after_decision: $.data.standing_enforcement_count, deact_after_decision: $.data.deactivation_count }
