          Under effective_date_rule NEXT_QUARTER_START with the clock at 2026-10-11 the only
          admissible date is 2027-01-01 — the year must roll over because the computed next
          quarter month is 13. Today's own date is refused with ERR_EFFECTIVE_DATE_INVALID (422)
