          assert:
            - "${score_0} == 90 and ${subst_0} == 2: two MINOR incidents at decay 1.00 charge 5 + 5 == 10"
            - "${score_25w} == 95: at 2027-01-23 the incidents are 175 days == floor(175/7) == 25 whole weeks old, decay 0.50, charge 5.0 exactly"
            - "${score_26w} == 97: at 2027-01-30 they are 182 days == 26 whole weeks old, decay 0.25, charge 1.25 + 1.25 == 2.50, round_half_up(2.50) == 3"
            - "${score_26w} != 98 - the per-incident alternative round_half_up(1.25) == 1 twice is explicitly wrong"
