scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: rental_quoted_vs_final_charge_divergence
        grounds:
          - calculations.order_charge
          - entities.Order.fields.quoted_charge_cents
          - entities.Order.fields.final_charge_cents
          - state_machines.Rental.RETURN_INITIATED_to_CLOSED_RETURNED
        distinguishing_aspect: "On the Order/Rental domain, order_charge variant=quoted (6000, no fees) and variant=final (7750, +late 250 +damage 1500) differ for the same order."
        test_recipe:
          setup:
            - "Clock at 2026-03-01. One GOOD unit; customer topped up 50000. RENT 90-day order (quoted 6000), paid, confirmed."
            - "Rental returned and inspected at 2026-06-03 (4 days past due 2026-05-30) reported ACCEPTABLE, no highlighting."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: CatalogAdmin
            - call: "POST /catalog"
              payload: { isbn13: "9780000000001", edition: 1, title: "T", author: "A", list_price_cents: 12000, rental_base_cents: 6000, ebook_price_cents: 4000, buyback_base_cents: 3000, replacement_fee_cents: 10000 }
              as: CatalogAdmin
              captures: { cat_id: "$.data.id" }
            - call: "POST /inventory-units"
              payload: { catalog_item_id: "${cat_id}", condition_grade: "GOOD", acquisition_cost_cents: 5000 }
              as: CatalogAdmin
              captures: { unit_id: "$.data.id" }
            - call: "POST /customers"
              payload: { email: "a@x.com", full_name: "A" }
              as: CatalogAdmin
              captures: { cust_id: "$.data.id" }
            - call: "POST /customers/${cust_id}/wallet/adjustments"
              payload: { amount_cents: 50000, kind: "TOP_UP" }
              as: CatalogAdmin
            - call: "POST /orders"
              payload: { catalog_item_id: "${cat_id}", fulfillment_type: "RENT", rental_term_days: 90, desired_start_date: "2026-03-01T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: "$.data.id", quoted: "$.data.quoted_charge_cents" }
            - call: "POST /orders/${order_id}/pay"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/confirm"
              payload: {}
              as: WarehouseAgent
            - call: "GET /rentals?order_id=${order_id}"
              payload: {}
              as: WarehouseAgent
              captures: { rental_id: "$.data[0].id" }
            - call: "POST /rentals/${rental_id}/return"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { rs_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-03T00:00:00Z" }
              as: CatalogAdmin
          trigger:
            - call: "POST /return-shipments/${rs_id}/inspect"
              payload: { reported_condition: "ACCEPTABLE", highlight_pct_reported: 0, is_lost: false }
              as: WarehouseAgent
          assert:
            - "Order.${order_id}.quoted_charge_cents == 6000"
            - "Order.${order_id}.final_charge_cents == 7750"
            - "Rental.${rental_id}.late_fee_cents == 250"
            - "Rental.${rental_id}.damage_fee_cents == 1500"

      - name: buyback_quoted_vs_assessed_divergence
        grounds:
          - calculations.buyback_price
          - entities.BuybackQuote.fields.quoted_price_cents
          - entities.BuybackQuote.fields.revised_price_cents
          - state_machines.BuybackQuote.ACCEPTED_to_REVISED
        distinguishing_aspect: "On the BuybackQuote domain (distinct from Rental), buyback_price variant=quoted (2700 at LIKE_NEW) and variant=assessed (2250 at GOOD) differ."
        test_recipe:
          setup:
            - "A customer (version captured) requests a buyback quote declaring LIKE_NEW (quoted 2700), accepts it, and the warehouse inspects it as GOOD."
          setup_api_calls:
            - call: "POST /catalog"
              payload: { isbn13: "9780000000002", edition: 1, title: "T2", author: "A", list_price_cents: 12000, rental_base_cents: 6000, ebook_price_cents: 4000, buyback_base_cents: 3000, replacement_fee_cents: 10000 }
              as: CatalogAdmin
              captures: { cat_id: "$.data.id" }
            - call: "POST /customers"
              payload: { email: "b@x.com", full_name: "B" }
              as: CatalogAdmin
              captures: { cust_id: "$.data.id", cust_v: "$.data.version" }
            - call: "POST /buyback-quotes"
              payload: { catalog_item_id: "${cat_id}", declared_condition: "LIKE_NEW", expected_customer_version: "${cust_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { q_id: "$.data.id", quoted: "$.data.quoted_price_cents" }
            - call: "POST /buyback-quotes/${q_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /buyback-quotes/${q_id}/inspect"
              payload: { assessed_condition: "GOOD" }
              as: WarehouseAgent
          assert:
            - "BuybackQuote.${q_id}.status == REVISED"
            - "BuybackQuote.${q_id}.quoted_price_cents == 2700"
            - "BuybackQuote.${q_id}.revised_price_cents == 2250"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes (a) and (c)
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: damage_fee_nonlinear_min_cap
        grounds:
          - calculations.damage_fee
          - entities.Rental.fields.damage_fee_cents
          - entities.CatalogItem.fields.list_price_cents
        distinguishing_aspect: "Mode (a): damage_fee has >=3 inputs (original grade, reported grade, highlight pct, allowed flag) with a min() cap — condition_fee 4500 is clamped to list_price 3500."
        test_recipe:
          setup:
            - "Catalog with small list_price 3500. NEW unit rented 90 days, returned reported ACCEPTABLE (3 grade steps -> 4500) with 0 highlighting; damage clamps to 3500."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: CatalogAdmin
            - call: "POST /catalog"
              payload: { isbn13: "9780000000003", edition: 1, title: "T3", author: "A", list_price_cents: 3500, rental_base_cents: 6000, ebook_price_cents: 4000, buyback_base_cents: 3000, replacement_fee_cents: 10000 }
              as: CatalogAdmin
              captures: { cat_id: "$.data.id" }
            - call: "POST /inventory-units"
              payload: { catalog_item_id: "${cat_id}", condition_grade: "NEW", acquisition_cost_cents: 5000 }
              as: CatalogAdmin
              captures: { unit_id: "$.data.id" }
            - call: "POST /customers"
              payload: { email: "c@x.com", full_name: "C" }
              as: CatalogAdmin
              captures: { cust_id: "$.data.id" }
            - call: "POST /customers/${cust_id}/wallet/adjustments"
              payload: { amount_cents: 50000, kind: "TOP_UP" }
              as: CatalogAdmin
            - call: "POST /orders"
              payload: { catalog_item_id: "${cat_id}", fulfillment_type: "RENT", rental_term_days: 90, desired_start_date: "2026-03-01T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: "$.data.id" }
            - call: "POST /orders/${order_id}/pay"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/confirm"
              payload: {}
              as: WarehouseAgent
            - call: "GET /rentals?order_id=${order_id}"
              payload: {}
              as: WarehouseAgent
              captures: { rental_id: "$.data[0].id" }
            - call: "POST /rentals/${rental_id}/return"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { rs_id: "$.data.id" }
          trigger:
            - call: "POST /return-shipments/${rs_id}/inspect"
              payload: { reported_condition: "ACCEPTABLE", highlight_pct_reported: 0, is_lost: false }
              as: WarehouseAgent
          assert:
            - "Rental.${rental_id}.damage_fee_cents == 3500"
            - "ReturnShipment.${rs_id}.status == CLOSED_DAMAGED"

      - name: rental_final_loyalty_circular_credit
        grounds:
          - calculations.order_charge
          - entities.Order.fields.final_charge_cents
        distinguishing_aspect: "Mode (c): final = T0 - loyalty_credit where the loyalty tier is keyed on T0 itself (T0=10500 >= 10000 -> credit 500 -> final 10000); evaluation order pinned."
        test_recipe:
          setup:
            - "NEW unit rented 90 days (quoted 6000). Returned 5 days late (late 500) reported GOOD with 15% highlighting (damage 4000). T0=10500 crosses the 10000 loyalty tier -> 500 credit."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: CatalogAdmin
            - call: "POST /catalog"
              payload: { isbn13: "9780000000004", edition: 1, title: "T4", author: "A", list_price_cents: 12000, rental_base_cents: 6000, ebook_price_cents: 4000, buyback_base_cents: 3000, replacement_fee_cents: 10000, max_highlight_pct: 10 }
              as: CatalogAdmin
              captures: { cat_id: "$.data.id" }
            - call: "POST /inventory-units"
              payload: { catalog_item_id: "${cat_id}", condition_grade: "NEW", acquisition_cost_cents: 5000 }
              as: CatalogAdmin
              captures: { unit_id: "$.data.id" }
            - call: "POST /customers"
              payload: { email: "d@x.com", full_name: "D" }
              as: CatalogAdmin
              captures: { cust_id: "$.data.id" }
            - call: "POST /customers/${cust_id}/wallet/adjustments"
              payload: { amount_cents: 50000, kind: "TOP_UP" }
              as: CatalogAdmin
            - call: "POST /orders"
              payload: { catalog_item_id: "${cat_id}", fulfillment_type: "RENT", rental_term_days: 90, desired_start_date: "2026-03-01T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: "$.data.id" }
            - call: "POST /orders/${order_id}/pay"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/confirm"
              payload: {}
              as: WarehouseAgent
            - call: "GET /rentals?order_id=${order_id}"
              payload: {}
              as: WarehouseAgent
              captures: { rental_id: "$.data[0].id" }
            - call: "POST /rentals/${rental_id}/return"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { rs_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-04T00:00:00Z" }
              as: CatalogAdmin
          trigger:
            - call: "POST /return-shipments/${rs_id}/inspect"
              payload: { reported_condition: "GOOD", highlight_pct_reported: 15, is_lost: false }
              as: WarehouseAgent
          assert:
            - "Rental.${rental_id}.late_fee_cents == 500"
            - "Rental.${rental_id}.damage_fee_cents == 4000"
            - "Order.${order_id}.final_charge_cents == 10000"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: order_parallel_payment_and_fulfillment_axes
        grounds:
          - state_machines.Order
          - entities.Order.fields.payment_status
          - entities.Order.fields.fulfillment_status
        distinguishing_aspect: "Order carries two independent axes: after pay, payment_status=PAID while fulfillment_status stays PENDING; confirm then advances only fulfillment_status to CONFIRMED."
        test_recipe:
          setup:
            - "A paid-but-unconfirmed RENT order exists with an AVAILABLE unit; then it is confirmed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: CatalogAdmin
            - call: "POST /catalog"
              payload: { isbn13: "9780000000005", edition: 1, title: "T5", author: "A", list_price_cents: 12000, rental_base_cents: 6000, ebook_price_cents: 4000, buyback_base_cents: 3000, replacement_fee_cents: 10000 }
              as: CatalogAdmin
              captures: { cat_id: "$.data.id" }
            - call: "POST /inventory-units"
              payload: { catalog_item_id: "${cat_id}", condition_grade: "GOOD", acquisition_cost_cents: 5000 }
              as: CatalogAdmin
              captures: { unit_id: "$.data.id" }
            - call: "POST /customers"
              payload: { email: "e@x.com", full_name: "E" }
              as: CatalogAdmin
              captures: { cust_id: "$.data.id" }
            - call: "POST /customers/${cust_id}/wallet/adjustments"
              payload: { amount_cents: 50000, kind: "TOP_UP" }
              as: CatalogAdmin
            - call: "POST /orders"
              payload: { catalog_item_id: "${cat_id}", fulfillment_type: "RENT", rental_term_days: 90, desired_start_date: "2026-03-01T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: "$.data.id" }
            - call: "POST /orders/${order_id}/pay"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /orders/${order_id}/confirm"
              payload: {}
              as: WarehouseAgent
              captures: { pay_status: "$.data.payment_status", ful_status: "$.data.fulfillment_status" }
          assert:
            - "Order.${order_id}.payment_status == PAID"
            - "Order.${order_id}.fulfillment_status == CONFIRMED"

      - name: return_shipment_branching_fork_to_damaged
        grounds:
          - state_machines.ReturnShipment.LABEL_ISSUED_to_CLOSED_DAMAGED
          - state_machines.ReturnShipment.LABEL_ISSUED_to_CLOSED_GOOD
          - entities.ReturnShipment.fields.status
        distinguishing_aspect: "On ReturnShipment (distinct entity from Order), one inspect trigger forks: a damaged/late return lands CLOSED_DAMAGED with damage_fee_cents>0, not CLOSED_GOOD."
        test_recipe:
          setup:
            - "A rented GOOD unit is returned; inspection reports ACCEPTABLE (1 grade step -> damage 1500) so the fork resolves to CLOSED_DAMAGED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: CatalogAdmin
            - call: "POST /catalog"
              payload: { isbn13: "9780000000006", edition: 1, title: "T6", author: "A", list_price_cents: 12000, rental_base_cents: 6000, ebook_price_cents: 4000, buyback_base_cents: 3000, replacement_fee_cents: 10000 }
              as: CatalogAdmin
              captures: { cat_id: "$.data.id" }
            - call: "POST /inventory-units"
              payload: { catalog_item_id: "${cat_id}", condition_grade: "GOOD", acquisition_cost_cents: 5000 }
              as: CatalogAdmin
              captures: { unit_id: "$.data.id" }
            - call: "POST /customers"
              payload: { email: "f@x.com", full_name: "F" }
              as: CatalogAdmin
              captures: { cust_id: "$.data.id" }
            - call: "POST /customers/${cust_id}/wallet/adjustments"
              payload: { amount_cents: 50000, kind: "TOP_UP" }
              as: CatalogAdmin
            - call: "POST /orders"
              payload: { catalog_item_id: "${cat_id}", fulfillment_type: "RENT", rental_term_days: 90, desired_start_date: "2026-03-01T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: "$.data.id" }
            - call: "POST /orders/${order_id}/pay"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/confirm"
              payload: {}
              as: WarehouseAgent
            - call: "GET /rentals?order_id=${order_id}"
              payload: {}
              as: WarehouseAgent
              captures: { rental_id: "$.data[0].id" }
            - call: "POST /rentals/${rental_id}/return"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { rs_id: "$.data.id" }
          trigger:
            - call: "POST /return-shipments/${rs_id}/inspect"
              payload: { reported_condition: "ACCEPTABLE", highlight_pct_reported: 0, is_lost: false }
              as: WarehouseAgent
              captures: { st: "$.data.status" }
          assert:
            - "ReturnShipment.${rs_id}.status == CLOSED_DAMAGED"
            - "ReturnShipment.${rs_id}.damage_fee_cents == 1500"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: lost_return_cascade_depth3
        grounds:
          - state_machines.ReturnShipment.LABEL_ISSUED_to_CLOSED_LOST
          - state_machines.Rental.RETURN_INITIATED_to_CLOSED_LOST
          - entities.InventoryUnit.fields.status
          - entities.Order.fields.final_charge_cents
        distinguishing_aspect: "Depth-3 chain from return inspect(is_lost): ReturnShipment->CLOSED_LOST causes Rental->CLOSED_LOST, which causes InventoryUnit->RETIRED and a REPLACEMENT_CHARGE debit; each hop caused by the prior."
        test_recipe:
          setup:
            - "A GOOD unit rented 90 days (quoted 6000), returned, then inspected with is_lost=true. Wallet pre-inspect = 50000-6000 = 44000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: CatalogAdmin
            - call: "POST /catalog"
              payload: { isbn13: "9780000000007", edition: 1, title: "T7", author: "A", list_price_cents: 12000, rental_base_cents: 6000, ebook_price_cents: 4000, buyback_base_cents: 3000, replacement_fee_cents: 10000 }
              as: CatalogAdmin
              captures: { cat_id: "$.data.id" }
            - call: "POST /inventory-units"
              payload: { catalog_item_id: "${cat_id}", condition_grade: "GOOD", acquisition_cost_cents: 5000 }
              as: CatalogAdmin
              captures: { unit_id: "$.data.id" }
            - call: "POST /customers"
              payload: { email: "g@x.com", full_name: "G" }
              as: CatalogAdmin
              captures: { cust_id: "$.data.id" }
            - call: "POST /customers/${cust_id}/wallet/adjustments"
              payload: { amount_cents: 50000, kind: "TOP_UP" }
              as: CatalogAdmin
            - call: "POST /orders"
              payload: { catalog_item_id: "${cat_id}", fulfillment_type: "RENT", rental_term_days: 90, desired_start_date: "2026-03-01T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: "$.data.id" }
            - call: "POST /orders/${order_id}/pay"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/confirm"
              payload: {}
              as: WarehouseAgent
            - call: "GET /rentals?order_id=${order_id}"
              payload: {}
              as: WarehouseAgent
              captures: { rental_id: "$.data[0].id" }
            - call: "POST /rentals/${rental_id}/return"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { rs_id: "$.data.id" }
          trigger:
            - call: "POST /return-shipments/${rs_id}/inspect"
              payload: { reported_condition: "GOOD", highlight_pct_reported: 0, is_lost: true }
              as: WarehouseAgent
          assert:
            - "ReturnShipment.${rs_id}.status == CLOSED_LOST"
            - "Rental.${rental_id}.status == CLOSED_LOST"
            - "InventoryUnit.${unit_id}.status == RETIRED"
            - "Order.${order_id}.final_charge_cents == 16000"
            - "Customer.${cust_id}.wallet_credit_cents == 34000"

      - name: buyback_paid_cascade_depth2
        grounds:
          - state_machines.BuybackQuote.ACCEPTED_to_PAID
          - entities.BuybackQuote.fields.inventory_unit_id
          - entities.Customer.fields.wallet_credit_cents
        distinguishing_aspect: "Depth-2 chain from buyback inspect(match): BuybackQuote->PAID creates an InventoryUnit and credits the seller's wallet by 3000; different trigger than the lost-return cascade."
        test_recipe:
          setup:
            - "Customer requests a NEW-condition buyback quote (quoted 3000), accepts; warehouse inspects NEW (match). Wallet starts at 0."
          setup_api_calls:
            - call: "POST /catalog"
              payload: { isbn13: "9780000000008", edition: 1, title: "T8", author: "A", list_price_cents: 12000, rental_base_cents: 6000, ebook_price_cents: 4000, buyback_base_cents: 3000, replacement_fee_cents: 10000 }
              as: CatalogAdmin
              captures: { cat_id: "$.data.id" }
            - call: "POST /customers"
              payload: { email: "h@x.com", full_name: "H" }
              as: CatalogAdmin
              captures: { cust_id: "$.data.id", cust_v: "$.data.version" }
            - call: "POST /buyback-quotes"
              payload: { catalog_item_id: "${cat_id}", declared_condition: "NEW", expected_customer_version: "${cust_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { q_id: "$.data.id" }
            - call: "POST /buyback-quotes/${q_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /buyback-quotes/${q_id}/inspect"
              payload: { assessed_condition: "NEW" }
              as: WarehouseAgent
              captures: { new_unit: "$.data.inventory_unit_id" }
          assert:
            - "BuybackQuote.${q_id}.status == PAID"
            - "BuybackQuote.${q_id}.paid_price_cents == 3000"
            - "BuybackQuote.${q_id}.inventory_unit_id != null"
            - "Customer.${cust_id}.wallet_credit_cents == 3000"

  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: extend_max_extensions_beats_insufficient_credit
        grounds:
          - validations[priority=9]
          - validations[priority=11]
          - errors[ERR_MAX_EXTENSIONS_REACHED]
          - errors[ERR_INSUFFICIENT_CREDIT]
        distinguishing_aspect: "Pair {business_constraint, business_fiscal}: a rental at MAX_EXTENSIONS (2) with a drained wallet violates both; the constraint error (pri 9) wins over the fiscal error (pri 11)."
        test_recipe:
          setup:
            - "RENT order paid (quoted 6000); wallet topped up 9000 -> 3000 after pay. Two extensions applied (-1500 each) -> extension_count=2, wallet 0. A third extend now violates BOTH max-extensions AND insufficient-credit."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: CatalogAdmin
            - call: "POST /catalog"
              payload: { isbn13: "9780000000009", edition: 1, title: "T9", author: "A", list_price_cents: 12000, rental_base_cents: 6000, ebook_price_cents: 4000, buyback_base_cents: 3000, replacement_fee_cents: 10000 }
              as: CatalogAdmin
              captures: { cat_id: "$.data.id" }
            - call: "POST /inventory-units"
              payload: { catalog_item_id: "${cat_id}", condition_grade: "GOOD", acquisition_cost_cents: 5000 }
              as: CatalogAdmin
              captures: { unit_id: "$.data.id" }
            - call: "POST /customers"
              payload: { email: "i@x.com", full_name: "I" }
              as: CatalogAdmin
              captures: { cust_id: "$.data.id" }
            - call: "POST /customers/${cust_id}/wallet/adjustments"
              payload: { amount_cents: 9000, kind: "TOP_UP" }
              as: CatalogAdmin
            - call: "POST /orders"
              payload: { catalog_item_id: "${cat_id}", fulfillment_type: "RENT", rental_term_days: 90, desired_start_date: "2026-03-01T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
