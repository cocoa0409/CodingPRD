              as: Candidate
              as_user_id: "${cand_id}"
              captures: { acc2_id: $.data.id }
            - call: "POST /accommodation-requests/${acc2_id}/begin-review"
              payload: {}
              as: AccommodationReviewer
          trigger:
            - call: "POST /accommodation-requests/${acc2_id}/approve"
              payload: {}
              as: AccommodationReviewer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_CANDIDATE_SCHEDULE_CONFLICT  (sessions only 0h apart, below REST_BUFFER_HOURS)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: seat_conservation_register_then_cancel_restores_pool
        grounds:
          - state_machines.Registration.RESERVED_to_CANCELLED
          - entities.TestSession.fields.standard_seats_reserved
          - endpoints[POST /registrations]
          - endpoints[POST /registrations/{id}/cancel]
        distinguishing_aspect: |
          Conserved quantity = seats: standard_seats_reserved equals the count of
          registrations in {RESERVED,CONFIRMED,CHECKED_IN}. A register (+1) paired
          with its cancel (-1), with no standby to absorb the seat, returns the pool
          to its prior value exactly.
        test_recipe:
          setup:
            - "Empty capacity-5 session (standard_seats_reserved == 0), no standby entries."
          setup_api_calls:
            - call: "POST /test-centers"
              payload: { name: "Bay Center", state_code: "CA", room_capacity_standard: 5, room_capacity_accommodated: 5 }
              as: TestCenterAdmin
              captures: { center_id: $.data.id }
            - call: "POST /candidates"
              payload: { legal_first_name: "Ada", legal_last_name: "Lovelace", date_of_birth: "2008-12-10", home_state_code: "CA", id_document_state_code: "CA" }
              as: Candidate
              captures: { cand_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: TestCenterAdmin
            - call: "POST /test-sessions"
              payload: { test_center_id: "${center_id}", exam_type: "SAT", exam_subject: "GENERAL", test_date: "2026-09-01", window_start_utc: "2026-09-01T13:00:00.000Z", window_end_utc: "2026-09-01T17:00:00.000Z", base_fee_cents: 6000 }
              as: TestCenterAdmin
              captures: { sess_id: $.data.id, sess_v: $.data.version }
            - call: "POST /registrations"
              payload: { test_session_id: "${sess_id}", candidate_id: "${cand_id}", expected_test_session_version: "${sess_v}" }
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { reg_id: $.data.id }
          trigger:
            - call: "POST /registrations/${reg_id}/cancel"
              payload: {}
              as: Candidate
              as_user_id: "${cand_id}"
          assert:
            - "GET /test-sessions/${sess_id} -> data.standard_seats_reserved == 0  (back to prior value, no drift)"
            - "Registration.${reg_id}.lifecycle_status == CANCELLED"

      - name: net_revenue_conservation_charge_then_full_refund_nets_zero
        grounds:
          - state_machines.Registration.RESERVED_to_CANCELLED
          - calculations.tiered_refund
          - entities.TestCenter.fields.net_revenue_cents
          - entities.Registration.fields.amount_paid_cents
        distinguishing_aspect: |
          Conserved quantity = money (a different conserved quantity than seats):
          net_revenue_cents == sum(amount_paid_cents) - sum(amount_refunded_cents).
          A charge (+6000) paired with a FULL-tier refund (-6000, days_before>=60)
          returns net_revenue_cents to exactly 0.
        test_recipe:
          setup:
            - "Empty session; clock far before test_date so cancel lands in the FULL refund tier."
          setup_api_calls:
            - call: "POST /test-centers"
              payload: { name: "Bay Center", state_code: "CA", room_capacity_standard: 5, room_capacity_accommodated: 5 }
              as: TestCenterAdmin
              captures: { center_id: $.data.id }
            - call: "POST /candidates"
              payload: { legal_first_name: "Ada", legal_last_name: "Lovelace", date_of_birth: "2008-12-10", home_state_code: "CA", id_document_state_code: "CA" }
              as: Candidate
              captures: { cand_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: TestCenterAdmin
            - call: "POST /test-sessions"
              payload: { test_center_id: "${center_id}", exam_type: "SAT", exam_subject: "GENERAL", test_date: "2026-09-01", window_start_utc: "2026-09-01T13:00:00.000Z", window_end_utc: "2026-09-01T17:00:00.000Z", base_fee_cents: 6000 }
              as: TestCenterAdmin
              captures: { sess_id: $.data.id, sess_v: $.data.version }
            - call: "POST /registrations"
              payload: { test_session_id: "${sess_id}", candidate_id: "${cand_id}", expected_test_session_version: "${sess_v}" }
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { reg_id: $.data.id }
          trigger:
            - call: "POST /registrations/${reg_id}/cancel"
              payload: {}
              as: Candidate
              as_user_id: "${cand_id}"
          assert:
            - "Registration.${reg_id}.refund_tier == FULL"
            - "Registration.${reg_id}.amount_refunded_cents == 6000"
            - "GET /test-centers/${center_id} -> data.net_revenue_cents == 0  (6000 charged - 6000 refunded, no drift)"

