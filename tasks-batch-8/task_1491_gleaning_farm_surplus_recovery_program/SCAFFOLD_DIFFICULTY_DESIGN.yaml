  # ===========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: glean_event_open_full_open_cycle
        grounds:
          - state_machines.GleanEvent.OPEN_to_FULL
          - state_machines.GleanEvent.FULL_to_OPEN
          - calculations.crew_fill_projection
        distinguishing_aspect: |
          GleanEvent carries a capacity-driven cycle OPEN -> FULL -> OPEN: with
          crew_capacity 2, two confirms flip OPEN->FULL; one decline flips
          FULL->OPEN; a third confirm flips OPEN->FULL again. The state dimension
          is DERIVED from child CrewAssignment rows, not directly set. Entity:
          GleanEvent (distinct from GrantReport's RETURNED loop).
        test_recipe:
          setup:
            - "Offer/event crew_capacity 2, published OPEN; volunteers V_a, V_b, V_c each with waivers (witnessed by the crew leader); three PENDING assignments"
          setup_api_calls:
            - call: "POST /glean/farms"
              payload: { farm_name: "FN", contact_email: "fn@x.com", county_code: "NNN", donor_tin: "77-3456789" }
