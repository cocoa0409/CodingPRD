            - "a docket at 2026-10-05T14:00:00Z .. 16:00:00Z from the same actor is accepted with 201, so only the past window is refused"
            - "the inverted window 2026-10-05T16:00:00Z .. 2026-10-05T14:00:00Z is refused with the same code because session_end must be strictly after session_start"

