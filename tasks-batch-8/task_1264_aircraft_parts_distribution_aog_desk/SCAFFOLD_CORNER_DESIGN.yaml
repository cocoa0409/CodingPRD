# =============================================================================
# Task 1264 — §1.9 Scaffold Corner Design (Coverage Index)
# Breadth probe over every testable claim of SCAFFOLD.yaml §1.1–§1.7 that
# §1.8 does not already cover. Logical clock default: 2026-05-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: customer_create_defaults_and_system_fields
        claim_type: defaults
        grounds: [entities.Customer]
        distinguishing_aspect: "A minimal create yields server-managed defaults: status ACTIVE, priority_tier STANDARD, outstanding_balance_cents 0, version 1, UUID id without type prefix, ISO-8601 created_at with three fractional digits."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /aog/customers", payload: { name: "DefaultAir", country_code: "DE", credit_limit_cents: 5000000 }, as: FinanceController, captures: { cust_id: $.data.id, c_status: $.data.status, c_tier: $.data.priority_tier, c_bal: $.data.outstanding_balance_cents, c_ver: $.data.version, c_created: $.data.created_at } }
          trigger:
            - { call: "GET /aog/customers/${cust_id}", payload: {}, as: FinanceController }
          assert:
            - "status == ACTIVE, priority_tier == STANDARD, outstanding_balance_cents == 0, version == 1"
            - "id matches UUID shape without any 'cust_'-style prefix; created_at has millisecond precision"
            - "client-supplied status/priority_tier/outstanding_balance_cents would be rejected as unknown fields (ERR_INVALID_REQUEST)"

      - name: customer_get_not_found
        claim_type: not_found
        grounds: [entities.Customer, "errors[ERR_CUSTOMER_NOT_FOUND]"]
        distinguishing_aspect: "Reading a random UUID yields the typed 404, not a generic 400/500."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /aog/customers/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: FinanceController, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CUSTOMER_NOT_FOUND, HTTP 404"

      - name: part_rotable_core_value_coupling
        claim_type: type_constraints
        grounds: [entities.PartMaster, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "rotable=true requires core_value_cents > 0; rotable=false requires core_value_cents == 0 — both violations are 400."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /aog/parts", payload: { part_number: "PN-BAD1", description: "x", rotable: true, list_price_cents: 1000, core_value_cents: 0 }, as: WarehouseOperator, captures: { err1: $.data.error_id } }
            - { call: "POST /aog/parts", payload: { part_number: "PN-BAD2", description: "x", rotable: false, list_price_cents: 1000, core_value_cents: 500 }, as: WarehouseOperator, captures: { err2: $.data.error_id } }
          assert:
            - "both creates fail with error_id == ERR_INVALID_REQUEST, HTTP 400"

      - name: unit_serial_unique_per_part_only
        claim_type: type_constraints
        grounds: [entities.InventoryUnit, "errors[ERR_DUPLICATE_SERIAL]"]
        distinguishing_aspect: "serial_number uniqueness is scoped to part_id: duplicate on the same part is 409; the same serial on a different part succeeds."
        test_recipe:
          setup: ["two parts exist"]
          setup_api_calls:
            - { call: "POST /aog/parts", payload: { part_number: "PN-S1", description: "a", rotable: false, list_price_cents: 1000 }, as: WarehouseOperator, captures: { p1: $.data.id } }
            - { call: "POST /aog/parts", payload: { part_number: "PN-S2", description: "b", rotable: false, list_price_cents: 1000 }, as: WarehouseOperator, captures: { p2: $.data.id } }
            - { call: "POST /aog/inventory-units", payload: { part_id: "${p1}", serial_number: "SN-SHARED", condition: "NEW", trace_doc_level: "FAA_8130", warehouse_code: "WH-1" }, as: WarehouseOperator }
          trigger:
            - { call: "POST /aog/inventory-units", payload: { part_id: "${p1}", serial_number: "SN-SHARED", condition: "NEW", trace_doc_level: "FAA_8130", warehouse_code: "WH-1" }, as: WarehouseOperator, captures: { err_dup: $.data.error_id } }
            - { call: "POST /aog/inventory-units", payload: { part_id: "${p2}", serial_number: "SN-SHARED", condition: "NEW", trace_doc_level: "FAA_8130", warehouse_code: "WH-1" }, as: WarehouseOperator, captures: { ok2: $.data.id } }
          assert:
            - "same-part duplicate: error_id == ERR_DUPLICATE_SERIAL, HTTP 409"
            - "cross-part same serial: 201 with a new unit id"

      - name: unit_trace_downgrade_rejected
        claim_type: type_constraints
        grounds: [entities.InventoryUnit, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "certify-trace may only raise the trace_doc_level rank; a downgrade (DUAL_RELEASE -> FAA_8130) is 400."
        test_recipe:
          setup: ["part + unit with DUAL_RELEASE"]
          setup_api_calls:
            - { call: "POST /aog/parts", payload: { part_number: "PN-TD", description: "x", rotable: false, list_price_cents: 1000 }, as: WarehouseOperator, captures: { p1: $.data.id } }
            - { call: "POST /aog/inventory-units", payload: { part_id: "${p1}", serial_number: "SN-TD1", condition: "NEW", trace_doc_level: "DUAL_RELEASE", warehouse_code: "WH-1" }, as: WarehouseOperator, captures: { u1: $.data.id } }
          trigger:
            - { call: "POST /aog/inventory-units/${u1}/certify-trace", payload: { trace_doc_level: "FAA_8130" }, as: ComplianceOfficer, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST, HTTP 400; unit trace_doc_level remains DUAL_RELEASE"

      - name: inventory_units_filtered_list_and_pagination_shape
        claim_type: listing
        grounds: [entities.InventoryUnit, response_envelope]
        distinguishing_aspect: "Filtered list returns only matching rows and the fixed pagination block (limit, offset, total_count, has_more) with defaults limit=10/offset=0."
        test_recipe:
          setup: ["two parts, two units on part 1, one on part 2"]
          setup_api_calls:
            - { call: "POST /aog/parts", payload: { part_number: "PN-F1", description: "a", rotable: false, list_price_cents: 1000 }, as: WarehouseOperator, captures: { p1: $.data.id } }
            - { call: "POST /aog/parts", payload: { part_number: "PN-F2", description: "b", rotable: false, list_price_cents: 1000 }, as: WarehouseOperator, captures: { p2: $.data.id } }
            - { call: "POST /aog/inventory-units", payload: { part_id: "${p1}", serial_number: "SN-F1", condition: "NEW", trace_doc_level: "FAA_8130", warehouse_code: "WH-1" }, as: WarehouseOperator }
            - { call: "POST /aog/inventory-units", payload: { part_id: "${p1}", serial_number: "SN-F2", condition: "NEW", trace_doc_level: "FAA_8130", warehouse_code: "WH-1" }, as: WarehouseOperator }
            - { call: "POST /aog/inventory-units", payload: { part_id: "${p2}", serial_number: "SN-F3", condition: "NEW", trace_doc_level: "FAA_8130", warehouse_code: "WH-1" }, as: WarehouseOperator }
          trigger:
            - { call: "GET /aog/inventory-units", payload: { part_id: "${p1}", limit: 1, offset: 0 }, as: WarehouseOperator }
          assert:
            - "response_type == array; data rows all have part_id == ${p1}"
            - "pagination: limit == 1, offset == 0, total_count == 2, has_more == true"

      - name: ledger_entry_immutability
        claim_type: immutability
        grounds: [entities.AccountLedgerEntry]
        distinguishing_aspect: "AccountLedgerEntry is common_fields=false: entries expose id and created_at but no version/updated_at, and no update or delete endpoint exists in §1.5."
        test_recipe:
          setup: ["customer with one manual debit posted"]
          setup_api_calls:
            - { call: "POST /aog/customers", payload: { name: "LedgerAir", country_code: "US", credit_limit_cents: 9000000 }, as: FinanceController, captures: { cust_id: $.data.id, cust_v: $.data.version } }
            - { call: "POST /aog/customers/${cust_id}/credit-adjustments", payload: { entry_type: "MANUAL_DEBIT", amount_cents: 12345, expected_customer_version: "${cust_v}", memo: "audit fee" }, as: FinanceController, captures: { entry_id: $.data.id } }
          trigger:
            - { call: "GET /aog/customers/${cust_id}/ledger-entries", payload: {}, as: FinanceController }
          assert:
            - "the entry carries id, created_at, entry_type MANUAL_DEBIT, amount_cents 12345, reference_type CUSTOMER — and no version field"
            - "§1.5 declares no PUT/PATCH/DELETE for ledger entries (append-only)"

      - name: aog_request_cross_customer_create_forbidden
        claim_type: parent_relationships
        grounds: [entities.AogRequest, "errors[ERR_FORBIDDEN]", "roles[CustomerContact]"]
        distinguishing_aspect: "CustomerContact identity is entity-backed: X-User-ID must equal customer_id on create; a mismatch is 403 even though the role is allowed on the endpoint."
        test_recipe:
          setup: ["customers A and B, one part"]
          setup_api_calls:
            - { call: "POST /aog/customers", payload: { name: "AirA", country_code: "US", credit_limit_cents: 9000000 }, as: FinanceController, captures: { ca: $.data.id } }
            - { call: "POST /aog/customers", payload: { name: "AirB", country_code: "US", credit_limit_cents: 9000000 }, as: FinanceController, captures: { cb: $.data.id } }
            - { call: "POST /aog/parts", payload: { part_number: "PN-OC", description: "x", rotable: false, list_price_cents: 1000 }, as: WarehouseOperator, captures: { p1: $.data.id } }
          trigger:
            - { call: "POST /aog/aog-requests", payload: { customer_id: "${cb}", aircraft_tail: "N1XB", airport_code: "LAX", part_id: "${p1}", quantity: 1, condition_acceptable: ["NEW"], min_trace_doc: "FAA_8130", needed_by_utc: "2026-06-01T00:00:00Z" }, as: CustomerContact, as_user_id: "${ca}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN, HTTP 403 (user ${ca} cannot file for customer ${cb})"

  - section: state_machines
    instances:
      - name: quote_terminal_lockdown_after_accept
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Quote, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "ACCEPTED is terminal: a second accept and a reject both fail with ERR_INVALID_STATE (the OCC version check at priority 5 is never reached because state at priority 4 fires first... state precondition uses ERR_INVALID_STATE since the quote is not ISSUED)."
        test_recipe:
          setup: ["quote accepted (full minimal chain)"]
          setup_api_calls:
            - { call: "POST /aog/customers", payload: { name: "TermAir", country_code: "US", credit_limit_cents: 100000000 }, as: FinanceController, captures: { cust_id: $.data.id } }
            - { call: "POST /aog/parts", payload: { part_number: "PN-TM", description: "x", rotable: false, list_price_cents: 10000 }, as: WarehouseOperator, captures: { p1: $.data.id } }
            - { call: "POST /aog/aog-requests", payload: { customer_id: "${cust_id}", aircraft_tail: "N9TM", airport_code: "LAX", part_id: "${p1}", quantity: 1, condition_acceptable: ["NEW"], min_trace_doc: "FAA_8130", needed_by_utc: "2026-06-01T00:00:00Z" }, as: AogDeskAgent, captures: { aog: $.data.id } }
            - { call: "POST /aog/quotes", payload: { aog_request_id: "${aog}", customer_id: "${cust_id}", lines: [ { part_id: "${p1}", quantity: 1, sale_type: "OUTRIGHT", unit_price_cents: 10000, discount_pct: 0, condition_required: "NEW" } ], validity_hours: 24, freight_mode: "STANDARD", distance_km: 800, chargeable_weight_kg: 4, destination_country: "US" }, as: AogDeskAgent, captures: { q1: $.data.id } }
            - { call: "POST /aog/quotes/${q1}/issue", payload: {}, as: AogDeskAgent, captures: { qv: $.data.version } }
            - { call: "POST /aog/quotes/${q1}/accept", payload: { expected_quote_version: "${qv}" }, as: CustomerContact, as_user_id: "${cust_id}", captures: { qv2: $.data.version } }
          trigger:
            - { call: "POST /aog/quotes/${q1}/accept", payload: { expected_quote_version: "${qv2}" }, as: CustomerContact, as_user_id: "${cust_id}", captures: { err1: $.data.error_id } }
            - { call: "POST /aog/quotes/${q1}/reject", payload: {}, as: CustomerContact, as_user_id: "${cust_id}", captures: { err2: $.data.error_id } }
          assert:
            - "second accept: error_id == ERR_INVALID_STATE, HTTP 409"
            - "reject after accept: error_id == ERR_INVALID_STATE, HTTP 409"
            - "exactly one SalesOrder exists for the quote (GET /aog/orders?quote_id= total_count == 1)"

      - name: quote_double_issue_invalid
        claim_type: invalid_transition
        grounds: [state_machines.Quote.DRAFT_to_ISSUED]
        distinguishing_aspect: "ISSUED -> ISSUED is not a declared transition; the second issue is rejected and issued_at/expires_at are unchanged."
        test_recipe:
          setup: ["quote issued once"]
          setup_api_calls:
            - { call: "POST /aog/customers", payload: { name: "DblAir", country_code: "US", credit_limit_cents: 100000000 }, as: FinanceController, captures: { cust_id: $.data.id } }
            - { call: "POST /aog/parts", payload: { part_number: "PN-DI", description: "x", rotable: false, list_price_cents: 10000 }, as: WarehouseOperator, captures: { p1: $.data.id } }
            - { call: "POST /aog/aog-requests", payload: { customer_id: "${cust_id}", aircraft_tail: "N8DI", airport_code: "LAX", part_id: "${p1}", quantity: 1, condition_acceptable: ["NEW"], min_trace_doc: "FAA_8130", needed_by_utc: "2026-06-01T00:00:00Z" }, as: AogDeskAgent, captures: { aog: $.data.id } }
            - { call: "POST /aog/quotes", payload: { aog_request_id: "${aog}", customer_id: "${cust_id}", lines: [ { part_id: "${p1}", quantity: 1, sale_type: "OUTRIGHT", unit_price_cents: 10000, discount_pct: 0, condition_required: "NEW" } ], validity_hours: 24, freight_mode: "STANDARD", distance_km: 800, chargeable_weight_kg: 4, destination_country: "US" }, as: AogDeskAgent, captures: { q1: $.data.id } }
            - { call: "POST /aog/quotes/${q1}/issue", payload: {}, as: AogDeskAgent, captures: { iss1: $.data.issued_at } }
          trigger:
            - { call: "POST /aog/quotes/${q1}/issue", payload: {}, as: AogDeskAgent, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE, HTTP 409"
            - "Quote.issued_at unchanged on read-back"

      - name: aog_cancel_releases_reserved_unit
        claim_type: side_effect_execution
        grounds: [state_machines.AogRequest.OPEN_to_CANCELLED, state_machines.InventoryUnit.RESERVED_to_AVAILABLE]
        distinguishing_aspect: "Cancelling an OPEN request with a pinned unit releases the reservation (unit back to AVAILABLE, reserved_by_request_id cleared, reserved_count decremented); cancelling a FULFILLED request is ERR_INVALID_STATE."
        test_recipe:
          setup: ["request with reserved unit via source-search"]
          setup_api_calls:
            - { call: "POST /aog/customers", payload: { name: "RelAir", country_code: "US", credit_limit_cents: 100000000 }, as: FinanceController, captures: { cust_id: $.data.id } }
            - { call: "POST /aog/parts", payload: { part_number: "PN-RL", description: "x", rotable: false, list_price_cents: 10000 }, as: WarehouseOperator, captures: { p1: $.data.id } }
            - { call: "POST /aog/inventory-units", payload: { part_id: "${p1}", serial_number: "SN-RL1", condition: "NEW", trace_doc_level: "FAA_8130", warehouse_code: "WH-1" }, as: WarehouseOperator, captures: { u1: $.data.id } }
            - { call: "POST /aog/aog-requests", payload: { customer_id: "${cust_id}", aircraft_tail: "N7RL", airport_code: "LAX", part_id: "${p1}", quantity: 1, condition_acceptable: ["NEW"], min_trace_doc: "FAA_8130", needed_by_utc: "2026-06-01T00:00:00Z" }, as: AogDeskAgent, captures: { aog: $.data.id } }
            - { call: "POST /aog/aog-requests/${aog}/source-search", payload: {}, as: AogDeskAgent }
          trigger:
            - { call: "POST /aog/aog-requests/${aog}/cancel", payload: {}, as: AogDeskAgent, captures: { st: $.data.status, ru: $.data.reserved_unit_id } }
            - { call: "GET /aog/inventory-units/${u1}", payload: {}, as: AogDeskAgent, captures: { ust: $.data.status, urb: $.data.reserved_by_request_id } }
            - { call: "POST /aog/aog-requests/${aog}/cancel", payload: {}, as: AogDeskAgent, captures: { err: $.data.error_id } }
          assert:
            - "cancel: status == CANCELLED, reserved_unit_id == null"
            - "unit: status == AVAILABLE, reserved_by_request_id == null"
            - "second cancel (terminal): error_id == ERR_INVALID_STATE"

      - name: core_overdue_and_loan_overdue_sweeps
        claim_type: valid_transition
        grounds: [state_machines.CoreReturn.OPEN_to_OVERDUE, state_machines.LoanAgreement.ACTIVE_to_OVERDUE]
        distinguishing_aspect: "The sweep flips OPEN core returns and ACTIVE loans past their due_at to OVERDUE; rows not yet due are untouched (due_at == clock exactly is NOT overdue: the check is clock > due_at)."
        test_recipe:
          setup:
            - "core return OPEN due 2026-05-22 (from a delivered exchange) — reuse is unnecessary: build via loan-only check plus a standalone overdue loan"
            - "LOAN loan [2026-05-01, 2026-05-10) on unit SN-SW1; second LOAN [2026-05-01, 2026-06-10) on SN-SW2"
            - "clock advanced to 2026-05-10T00:00:01Z"
          setup_api_calls:
            - { call: "POST /aog/customers", payload: { name: "SweepAir", country_code: "US", credit_limit_cents: 100000000 }, as: FinanceController, captures: { cust_id: $.data.id } }
            - { call: "POST /aog/parts", payload: { part_number: "PN-SW", description: "x", rotable: true, list_price_cents: 100000, core_value_cents: 40000 }, as: WarehouseOperator, captures: { p1: $.data.id } }
            - { call: "POST /aog/inventory-units", payload: { part_id: "${p1}", serial_number: "SN-SW1", condition: "OVERHAULED", trace_doc_level: "FAA_8130", warehouse_code: "WH-1" }, as: WarehouseOperator, captures: { u1: $.data.id } }
            - { call: "POST /aog/inventory-units", payload: { part_id: "${p1}", serial_number: "SN-SW2", condition: "OVERHAULED", trace_doc_level: "FAA_8130", warehouse_code: "WH-1" }, as: WarehouseOperator, captures: { u2: $.data.id } }
            - { call: "POST /aog/loans", payload: { customer_id: "${cust_id}", unit_id: "${u1}", loan_type: "LOAN", daily_rate_cents: 10000, start_at: "2026-05-01T00:00:00Z", due_at: "2026-05-10T00:00:00Z" }, as: AogDeskAgent, captures: { ln1: $.data.id } }
            - { call: "POST /aog/loans", payload: { customer_id: "${cust_id}", unit_id: "${u2}", loan_type: "LOAN", daily_rate_cents: 10000, start_at: "2026-05-01T00:00:00Z", due_at: "2026-06-10T00:00:00Z" }, as: AogDeskAgent, captures: { ln2: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T00:00:01Z" }, as: PlatformOps }
          trigger:
            - { call: "POST /_system/run-sweeps", payload: {}, as: PlatformOps, captures: { n_overdue: $.data.overdue_loans } }
            - { call: "GET /aog/loans/${ln1}", payload: {}, as: AogDeskAgent, captures: { s1: $.data.status } }
            - { call: "GET /aog/loans/${ln2}", payload: {}, as: AogDeskAgent, captures: { s2: $.data.status } }
          assert:
            - "overdue_loans == 1; LoanAgreement.${ln1}.status == OVERDUE"
            - "LoanAgreement.${ln2}.status == ACTIVE (due 2026-06-10 not yet reached)"

      - name: warranty_segregation_of_duties
        claim_type: precondition_enforcement
        grounds: [state_machines.WarrantyClaim.UNDER_REVIEW_to_APPROVED, "errors[ERR_SEGREGATION_OF_DUTIES]", "roles[WarrantyApprover]"]
        distinguishing_aspect: "The approver's X-User-ID must differ from reviewed_by: the same operator id is rejected with 403 even though the role is correct; a different approver succeeds and the claim reaches CREDIT_ISSUED with the WARRANTY_CREDIT posted."
        test_recipe:
          setup: ["delivered OUTRIGHT order (line_total 20000: unit_price 20000, qty 1, discount 0); claim filed at clock 2026-05-15 (months_in_service 0, DOA 100%)"]
          setup_api_calls:
            - { call: "POST /aog/customers", payload: { name: "WarrAir", country_code: "US", credit_limit_cents: 100000000 }, as: FinanceController, captures: { cust_id: $.data.id } }
            - { call: "POST /aog/parts", payload: { part_number: "PN-WC", description: "x", rotable: false, list_price_cents: 20000, warranty_months: 12 }, as: WarehouseOperator, captures: { p1: $.data.id } }
            - { call: "POST /aog/inventory-units", payload: { part_id: "${p1}", serial_number: "SN-WC1", condition: "NEW", trace_doc_level: "FAA_8130", warehouse_code: "WH-1" }, as: WarehouseOperator, captures: { u1: $.data.id } }
            - { call: "POST /aog/aog-requests", payload: { customer_id: "${cust_id}", aircraft_tail: "N5WC", airport_code: "LAX", part_id: "${p1}", quantity: 1, condition_acceptable: ["NEW"], min_trace_doc: "FAA_8130", needed_by_utc: "2026-06-01T00:00:00Z" }, as: AogDeskAgent, captures: { aog: $.data.id } }
            - { call: "POST /aog/aog-requests/${aog}/source-search", payload: {}, as: AogDeskAgent }
            - { call: "POST /aog/quotes", payload: { aog_request_id: "${aog}", customer_id: "${cust_id}", lines: [ { part_id: "${p1}", quantity: 1, sale_type: "OUTRIGHT", unit_price_cents: 20000, discount_pct: 0, condition_required: "NEW" } ], validity_hours: 24, freight_mode: "STANDARD", distance_km: 800, chargeable_weight_kg: 4, destination_country: "US" }, as: AogDeskAgent, captures: { q1: $.data.id } }
            - { call: "POST /aog/quotes/${q1}/issue", payload: {}, as: AogDeskAgent, captures: { qv: $.data.version } }
            - { call: "POST /aog/quotes/${q1}/accept", payload: { expected_quote_version: "${qv}" }, as: CustomerContact, as_user_id: "${cust_id}" }
            - { call: "GET /aog/orders", payload: { quote_id: "${q1}" }, as: AogDeskAgent, captures: { ord: "$.data[0].id" } }
            - { call: "GET /aog/order-lines", payload: { order_id: "${ord}" }, as: AogDeskAgent, captures: { ln: "$.data[0].id" } }
            - { call: "POST /aog/order-lines/${ln}/allocate", payload: { unit_id: "${u1}" }, as: WarehouseOperator }
            - { call: "POST /aog/orders/${ord}/compliance-decision", payload: { decision: "CLEARED" }, as: ComplianceOfficer }
            - { call: "POST /aog/shipments", payload: { order_id: "${ord}" }, as: WarehouseOperator, captures: { sh: $.data.id } }
            - { call: "POST /aog/shipments/${sh}/tender", payload: {}, as: WarehouseOperator }
            - { call: "POST /aog/shipments/${sh}/deliver", payload: {}, as: WarehouseOperator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-15T00:00:00Z" }, as: PlatformOps }
            - { call: "POST /aog/warranty-claims", payload: { customer_id: "${cust_id}", order_line_id: "${ln}", fault_category: "DOA", description: "dead on arrival" }, as: CustomerContact, as_user_id: "${cust_id}", captures: { cl: $.data.id } }
            - { call: "POST /aog/warranty-claims/${cl}/review", payload: { review_notes: "verified dead" }, as: WarrantyAdjuster, as_user_id: "adjuster-7" }
          trigger:
            - { call: "POST /aog/warranty-claims/${cl}/approve", payload: {}, as: WarrantyApprover, as_user_id: "adjuster-7", captures: { err: $.data.error_id } }
            - { call: "POST /aog/warranty-claims/${cl}/approve", payload: {}, as: WarrantyApprover, as_user_id: "approver-2", captures: { st: $.data.status, credit: $.data.credit_cents } }
          assert:
