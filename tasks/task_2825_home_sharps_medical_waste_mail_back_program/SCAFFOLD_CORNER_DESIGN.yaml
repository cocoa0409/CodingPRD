              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /sharps/patients"
              payload: { full_name: "Bianca Ortiz", state_rule_id: "${sr_ca}", therapy_type: "INSULIN_PEN_NEEDLES", weekly_sharps_count: 20, contact_email: "bianca@example.com" }
              as: ProgramAdmin
              captures: { pat_b: $.data.id }
            - call: "POST /sharps/patients/${pat_b}/eligibility-review"
              payload: { decision: "APPROVE" }
              as: ProgramAdmin
            - call: "POST /sharps/patients"
              payload: { full_name: "Aaron Vance", state_rule_id: "${sr_ca}", therapy_type: "INSULIN_PEN_NEEDLES", weekly_sharps_count: 20, contact_email: "aaron@example.com" }
              as: ProgramAdmin
