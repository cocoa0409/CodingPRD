      - name: directive_window_adjacency_half_open
        grounds:
          - validations[priority=6]
          - errors[ERR_DIRECTIVE_WINDOW_OVERLAP]
          - entities.NoContactDirective.fields.effective_to
        distinguishing_aspect: |
          Metric: half-open interval adjacency on POST /api/cases/{id}/no-contact-directives. A new
          RESPONDENT-scope directive whose effective_from equals the existing directive's effective_to
          (gap == 0) is accepted; effective_from one second earlier overlaps [from, to) and is rejected -
          adjacency exactness on a different metric and endpoint than the appeal deadline.
        test_recipe:
          setup:
            - "Case [STALKING] with directive D1 RESPONDENT scope [2026-08-01T00:00:00Z, 2026-08-10T00:00:00Z)"
          setup_api_calls:
            - { call: "POST /api/party-profiles", payload: { full_name: "Comp One", university_id: "U-C-1", role_type: "STUDENT", email: "c1@example.edu" }, as: CaseAdministrator, captures: { comp_id: $.data.id } }
