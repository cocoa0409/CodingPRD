            - { call: "POST /midway/operating-days", payload: { fair_id: "${fair_a}", date: "2026-08-03", max_attendance: 100 }, as: FairManager, as_user_id: "${sup_a}", captures: { day_a: "$.data.id" } }
            - { call: "POST /midway/operating-days", payload: { fair_id: "${fair_b}", date: "2026-08-03", max_attendance: 100 }, as: FairManager, as_user_id: "${sup_b}", captures: { day_b: "$.data.id" } }
            - { call: "POST /midway/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T08:00:00Z" }, as: StateProgramAdmin }
            - { call: "POST /midway/operating-days/${day_a}/begin-checklists", payload: {}, as: FairManager, as_user_id: "${sup_a}" }
            - { call: "POST /midway/operating-days/${day_b}/begin-checklists", payload: {}, as: FairManager, as_user_id: "${sup_b}" }
            - { call: "POST /midway/daily-checklists", payload: { ride_id: "${ride_a}", operating_day_id: "${day_a}", items_total: 3 }, as: RideOperator, as_user_id: "${op_a}", captures: { chk_a: "$.data.id" } }
            - { call: "POST /midway/daily-checklists", payload: { ride_id: "${ride_b}", operating_day_id: "${day_b}", items_total: 3 }, as: RideOperator, as_user_id: "${op_b}", captures: { chk_b: "$.data.id" } }
            - { call: "POST /midway/daily-checklists/${chk_a}/submit", payload: { items_passed: 3 }, as: RideOperator, as_user_id: "${op_a}", captures: { chk_a_v: "$.data.version" } }
            - { call: "POST /midway/daily-checklists/${chk_b}/submit", payload: { items_passed: 3 }, as: RideOperator, as_user_id: "${op_b}", captures: { chk_b_v: "$.data.version" } }
            - { call: "POST /midway/daily-checklists/${chk_a}/countersign", payload: { expected_checklist_version: "${chk_a_v}" }, as: FairManager, as_user_id: "${sup_a}" }
