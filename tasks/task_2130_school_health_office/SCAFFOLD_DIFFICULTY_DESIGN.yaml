            - "HOP 2: MedicationAuthorization.${auth_id}.dispensable == false"
            - "HOP 3: AdministrationRecord.${adm_id}.status == VOIDED"
            - "HOP 3: HealthVisit.${visit_id}.pending_administration_count == 0"
            - "HOP 3: MedicationStockLot.${lot_id}.quantity_reserved == 0"
            - "HOP 3: MedicationStockLot.${lot_id}.quantity_on_hand == 5"
            - "HOP 4: MedicationStockLot.${lot_id}.days_of_supply == 4.17"
