# =============================================================================
# §1.9 Scaffold Corner Design — task_3094_experience_rating_computation_class_code_assignment
# Breadth coverage of §1.1–§1.7 claims not already exercised by §1.8.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: bureau_create_returns_all_declared_fields_and_version_one
        claim_type: Creation
        grounds:
          - entities.Bureau
          - endpoints.POST_/bureaus
        distinguishing_aspect: "POST /bureaus with all seven inputs returns 201 with version 1 and system id/created_at/updated_at; the constants persist verbatim."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z (default). Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: BureauAdmin
          trigger:
            - call: "POST /bureaus"
              payload: { code: "NCCI", name: "National Bureau", eligibility_threshold_cents: 500000, split_point_cents: 1000000, credibility_ballast_bp: 4000, credibility_excess_divisor_bp: 6000, underwriting_threshold_cents: 2500000 }
              as: BureauAdmin
              captures: { bureau_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Bureau.${bureau_id}.split_point_cents == 1000000 and credibility_ballast_bp == 4000"
            - "Bureau.${bureau_id}.version == 1"
            - "the response data carries non-null id, created_at, updated_at"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: employer_get_returns_stored_row_unchanged
        claim_type: Retrieval
        grounds:
          - entities.Employer
          - endpoints.GET_/employers/{id}
        distinguishing_aspect: "Every Employer field round-trips through GET exactly as posted, and status starts ACTIVE with version 1."
        test_recipe:
          setup:
            - "Bureau created; one employer created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /bureaus"
              payload: { code: "NCCI", name: "National Bureau", eligibility_threshold_cents: 500000, split_point_cents: 1000000, credibility_ballast_bp: 4000, credibility_excess_divisor_bp: 6000, underwriting_threshold_cents: 2500000 }
              as: BureauAdmin
            - call: "POST /employers"
              payload: { fein: "75-1000001", legal_name: "Pecos Machine Works", state_code: "TX" }
              as: BureauAdmin
              captures: { employer_a: $.data.id }
          trigger:
            - call: "GET /employers/${employer_a}"
              payload: {}
              as: Any
          assert:
            - "the response status is 200"
            - "Employer.${employer_a}.fein == \"75-1000001\" and legal_name == \"Pecos Machine Works\" and state_code == \"TX\""
            - "Employer.${employer_a}.status == ACTIVE and version == 1"

      - name: policies_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/policies
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three policies on one employer, limit=2 returns 2 rows with total_count 3 and has_more true; offset=2 returns 1 row with has_more false."
        test_recipe:
          setup:
            - "Bureau; carrier; employer A; class 3632; TX rating table promulgated; three policies for A."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-15T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /bureaus"
              payload: { code: "NCCI", name: "National Bureau", eligibility_threshold_cents: 500000, split_point_cents: 1000000, credibility_ballast_bp: 4000, credibility_excess_divisor_bp: 6000, underwriting_threshold_cents: 2500000 }
              as: BureauAdmin
            - call: "POST /carriers"
              payload: { naic_number: "10001", legal_name: "Alamo Mutual", assigned_risk_quota_cents: 100000000 }
              as: BureauAdmin
              captures: { carrier_id: $.data.id }
            - call: "POST /employers"
              payload: { fein: "75-1000001", legal_name: "Pecos Machine Works", state_code: "TX" }
              as: BureauAdmin
              captures: { employer_a: $.data.id }
            - call: "POST /class-codes"
              payload: { code: "3632", description: "Machine Shop NOC", state_code: "TX" }
              as: BureauAdmin
            - call: "POST /rating-tables"
              payload: { state_code: "TX", effective_date: "2024-01-01", values: [{ class_code: "3632", rate_per_100_payroll_cents: 250, elr_per_100_payroll_cents: 150, d_ratio_bp: 4000 } ] }
              as: BureauAdmin
              captures: { rt_tx: $.data.id }
            - call: "POST /rating-tables/${rt_tx}/promulgate"
              payload: {}
              as: BureauAdmin
            - call: "POST /policies"
              payload: { employer_id: "${employer_a}", carrier_id: "${carrier_id}", policy_number: "WC-P1", effective_date: "2024-01-01", expiration_date: "2025-01-01", class_codes: [{ class_code: "3632", payroll_dollars: 100000 } ] }
              as: CarrierDataReporter
              as_user_id: "${carrier_id}"
            - call: "POST /policies"
              payload: { employer_id: "${employer_a}", carrier_id: "${carrier_id}", policy_number: "WC-P2", effective_date: "2025-01-01", expiration_date: "2026-01-01", class_codes: [{ class_code: "3632", payroll_dollars: 100000 } ] }
              as: CarrierDataReporter
              as_user_id: "${carrier_id}"
            - call: "POST /policies"
              payload: { employer_id: "${employer_a}", carrier_id: "${carrier_id}", policy_number: "WC-P3", effective_date: "2026-01-01", expiration_date: "2027-01-01", class_codes: [{ class_code: "3632", payroll_dollars: 100000 } ] }
              as: CarrierDataReporter
              as_user_id: "${carrier_id}"
          trigger:
            - call: "GET /policies"
              payload: { employer_id: "${employer_a}", limit: 2, offset: 0 }
              as: Any
          assert:
            - "the response status is 200 and response_type is array"
            - "exactly 2 rows returned with total_count == 3 and has_more == true"
            - "GET /policies?employer_id=${employer_a}&limit=2&offset=2 returns 1 row with total_count == 3 and has_more == false"

      - name: employer_get_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/employers/{id}
          - errors.ERR_NOT_FOUND
        distinguishing_aspect: "A syntactically valid but unallocated employer id produces 404 ERR_NOT_FOUND with the error envelope shape."
        test_recipe:
          setup:
            - "Bureau created; no employers."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /bureaus"
              payload: { code: "NCCI", name: "National Bureau", eligibility_threshold_cents: 500000, split_point_cents: 1000000, credibility_ballast_bp: 4000, credibility_excess_divisor_bp: 6000, underwriting_threshold_cents: 2500000 }
              as: BureauAdmin
          trigger:
            - call: "GET /employers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Any
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"

      - name: policy_create_missing_class_codes_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Policy.fields.class_codes
          - errors.ERR_INVALID_REQUEST
          - validations[priority=8]
        distinguishing_aspect: "class_codes is a required input with no default; omitting it entirely yields 400 ERR_INVALID_REQUEST, not a referential error."
        test_recipe:
          setup:
            - "Bureau; carrier; employer B; class 3632; TX table promulgated."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-15T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /bureaus"
              payload: { code: "NCCI", name: "National Bureau", eligibility_threshold_cents: 500000, split_point_cents: 1000000, credibility_ballast_bp: 4000, credibility_excess_divisor_bp: 6000, underwriting_threshold_cents: 2500000 }
              as: BureauAdmin
            - call: "POST /carriers"
              payload: { naic_number: "10001", legal_name: "Alamo Mutual", assigned_risk_quota_cents: 100000000 }
              as: BureauAdmin
              captures: { carrier_id: $.data.id }
            - call: "POST /employers"
              payload: { fein: "75-1000002", legal_name: "Brazos Fabrication", state_code: "TX" }
              as: BureauAdmin
              captures: { employer_b: $.data.id }
            - call: "POST /class-codes"
              payload: { code: "3632", description: "Machine Shop NOC", state_code: "TX" }
              as: BureauAdmin
            - call: "POST /rating-tables"
              payload: { state_code: "TX", effective_date: "2026-01-01", values: [{ class_code: "3632", rate_per_100_payroll_cents: 250, elr_per_100_payroll_cents: 150, d_ratio_bp: 4000 } ] }
              as: BureauAdmin
              captures: { rt_tx: $.data.id }
            - call: "POST /rating-tables/${rt_tx}/promulgate"
              payload: {}
              as: BureauAdmin
          trigger:
            - call: "POST /policies"
              payload: { employer_id: "${employer_b}", carrier_id: "${carrier_id}", policy_number: "WC-MISS", effective_date: "2026-02-01", expiration_date: "2027-02-01" }
              as: CarrierDataReporter
              as_user_id: "${carrier_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /policies?employer_id=${employer_b} returns 0 rows"

      - name: unit_stat_report_submission_number_defaults_to_one
        claim_type: Defaults
        grounds:
          - entities.UnitStatReport.fields.submission_number
        distinguishing_aspect: "A first submission (no correction_of_report_id) gets submission_number 1 automatically; the client cannot set it."
        test_recipe:
          setup:
            - "Bureau; carrier; employer A; class 3632; TX table promulgated; policy P1 created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /bureaus"
              payload: { code: "NCCI", name: "National Bureau", eligibility_threshold_cents: 500000, split_point_cents: 1000000, credibility_ballast_bp: 4000, credibility_excess_divisor_bp: 6000, underwriting_threshold_cents: 2500000 }
              as: BureauAdmin
            - call: "POST /carriers"
              payload: { naic_number: "10001", legal_name: "Alamo Mutual", assigned_risk_quota_cents: 100000000 }
              as: BureauAdmin
              captures: { carrier_id: $.data.id }
            - call: "POST /employers"
              payload: { fein: "75-1000001", legal_name: "Pecos Machine Works", state_code: "TX" }
              as: BureauAdmin
              captures: { employer_a: $.data.id }
            - call: "POST /class-codes"
              payload: { code: "3632", description: "Machine Shop NOC", state_code: "TX" }
              as: BureauAdmin
            - call: "POST /rating-tables"
              payload: { state_code: "TX", effective_date: "2024-01-01", values: [{ class_code: "3632", rate_per_100_payroll_cents: 250, elr_per_100_payroll_cents: 150, d_ratio_bp: 4000 } ] }
              as: BureauAdmin
              captures: { rt_tx: $.data.id }
            - call: "POST /rating-tables/${rt_tx}/promulgate"
              payload: {}
              as: BureauAdmin
            - call: "POST /policies"
              payload: { employer_id: "${employer_a}", carrier_id: "${carrier_id}", policy_number: "WC-1001", effective_date: "2024-01-01", expiration_date: "2025-01-01", class_codes: [{ class_code: "3632", payroll_dollars: 100000 } ] }
              as: CarrierDataReporter
              as_user_id: "${carrier_id}"
              captures: { policy_p1: $.data.id }
          trigger:
            - call: "POST /unit-stat-reports"
              payload: { policy_id: "${policy_p1}", payroll_lines: [{ class_code: "3632", payroll_dollars: 100000 } ], claim_lines: [{ claim_number: "Q1", claim_type: "MEDICAL", incurred_cents: 50000, paid_cents: 50000, claim_status: "CLOSED", state_code: "TX" } ] }
              as: CarrierDataReporter
              as_user_id: "${carrier_id}"
              captures: { report_q: $.data.id }
          assert:
            - "UnitStatReport.${report_q}.submission_number == 1"
            - "UnitStatReport.${report_q}.status == SUBMITTED"

      - name: policy_manual_premium_is_computed_and_input_ignored
        claim_type: Computed Fields
        grounds:
          - entities.Policy.fields.manual_premium_cents
          - calculations.manual_premium
        distinguishing_aspect: "manual_premium_cents is source: computed; even if a client smuggles the field into the payload it is ignored and the system computes 250000 from payroll 100000 at rate 250."
        test_recipe:
          setup:
            - "Bureau; carrier; employer B; class 3632 rated 250; TX table promulgated."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-15T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /bureaus"
              payload: { code: "NCCI", name: "National Bureau", eligibility_threshold_cents: 500000, split_point_cents: 1000000, credibility_ballast_bp: 4000, credibility_excess_divisor_bp: 6000, underwriting_threshold_cents: 2500000 }
              as: BureauAdmin
            - call: "POST /carriers"
              payload: { naic_number: "10001", legal_name: "Alamo Mutual", assigned_risk_quota_cents: 100000000 }
              as: BureauAdmin
              captures: { carrier_id: $.data.id }
            - call: "POST /employers"
              payload: { fein: "75-1000002", legal_name: "Brazos Fabrication", state_code: "TX" }
              as: BureauAdmin
              captures: { employer_b: $.data.id }
            - call: "POST /class-codes"
              payload: { code: "3632", description: "Machine Shop NOC", state_code: "TX" }
              as: BureauAdmin
            - call: "POST /rating-tables"
              payload: { state_code: "TX", effective_date: "2026-01-01", values: [{ class_code: "3632", rate_per_100_payroll_cents: 250, elr_per_100_payroll_cents: 150, d_ratio_bp: 4000 } ] }
              as: BureauAdmin
              captures: { rt_tx: $.data.id }
            - call: "POST /rating-tables/${rt_tx}/promulgate"
              payload: {}
              as: BureauAdmin
          trigger:
            - call: "POST /policies"
              payload: { employer_id: "${employer_b}", carrier_id: "${carrier_id}", policy_number: "WC-CMP", effective_date: "2026-02-01", expiration_date: "2027-02-01", class_codes: [{ class_code: "3632", payroll_dollars: 100000 } ], manual_premium_cents: 999999 }
              as: CarrierDataReporter
              as_user_id: "${carrier_id}"
              captures: { policy_c: $.data.id }
          assert:
            - "the response status is 201"
            - "Policy.${policy_c}.manual_premium_cents == 250000"
            - "Policy.${policy_c}.manual_premium_cents != 999999"

      - name: policy_status_is_system_set_input_ignored
        claim_type: System Fields
        grounds:
          - entities.Policy.fields.status
          - endpoints.POST_/policies
        distinguishing_aspect: "A client that sends status CANCELLED on create is ignored: the policy is created ACTIVE with version 1."
        test_recipe:
          setup:
            - "Bureau; carrier; employer B; class 3632; TX table promulgated."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-15T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /bureaus"
              payload: { code: "NCCI", name: "National Bureau", eligibility_threshold_cents: 500000, split_point_cents: 1000000, credibility_ballast_bp: 4000, credibility_excess_divisor_bp: 6000, underwriting_threshold_cents: 2500000 }
              as: BureauAdmin
            - call: "POST /carriers"
              payload: { naic_number: "10001", legal_name: "Alamo Mutual", assigned_risk_quota_cents: 100000000 }
              as: BureauAdmin
              captures: { carrier_id: $.data.id }
            - call: "POST /employers"
              payload: { fein: "75-1000002", legal_name: "Brazos Fabrication", state_code: "TX" }
              as: BureauAdmin
              captures: { employer_b: $.data.id }
            - call: "POST /class-codes"
              payload: { code: "3632", description: "Machine Shop NOC", state_code: "TX" }
              as: BureauAdmin
            - call: "POST /rating-tables"
              payload: { state_code: "TX", effective_date: "2026-01-01", values: [{ class_code: "3632", rate_per_100_payroll_cents: 250, elr_per_100_payroll_cents: 150, d_ratio_bp: 4000 } ] }
              as: BureauAdmin
              captures: { rt_tx: $.data.id }
            - call: "POST /rating-tables/${rt_tx}/promulgate"
              payload: {}
              as: BureauAdmin
          trigger:
            - call: "POST /policies"
              payload: { employer_id: "${employer_b}", carrier_id: "${carrier_id}", policy_number: "WC-SYS", effective_date: "2026-02-01", expiration_date: "2027-02-01", class_codes: [{ class_code: "3632", payroll_dollars: 100000 } ], status: "CANCELLED" }
              as: CarrierDataReporter
              as_user_id: "${carrier_id}"
              captures: { policy_s: $.data.id }
          assert:
            - "the response status is 201"
            - "Policy.${policy_s}.status == ACTIVE"
            - "Policy.${policy_s}.version == 1"

      - name: policy_create_referencing_unknown_employer_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.Policy.fields.employer_id
          - validations[priority=3]
          - errors.ERR_NOT_FOUND
          - complexity_profile.entity_topology
        distinguishing_aspect: "Flat topology puts employer_id and carrier_id in the body; existence is checked left-to-right in the declared input order, so an unknown employer_id yields ERR_NOT_FOUND before any carrier check."
        test_recipe:
          setup:
            - "Bureau; carrier created; no employer."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-15T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /bureaus"
              payload: { code: "NCCI", name: "National Bureau", eligibility_threshold_cents: 500000, split_point_cents: 1000000, credibility_ballast_bp: 4000, credibility_excess_divisor_bp: 6000, underwriting_threshold_cents: 2500000 }
              as: BureauAdmin
            - call: "POST /carriers"
              payload: { naic_number: "10001", legal_name: "Alamo Mutual", assigned_risk_quota_cents: 100000000 }
              as: BureauAdmin
              captures: { carrier_id: $.data.id }
          trigger:
            - call: "POST /policies"
              payload: { employer_id: "00000000-0000-4000-8000-000000000001", carrier_id: "${carrier_id}", policy_number: "WC-NFK", effective_date: "2026-02-01", expiration_date: "2027-02-01", class_codes: [{ class_code: "3632", payroll_dollars: 100000 } ] }
              as: CarrierDataReporter
              as_user_id: "${carrier_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_NOT_FOUND"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: validate_unit_stat_report_moves_submitted_to_validated
        claim_type: valid_transition
        grounds:
          - state_machines.UnitStatReport.SUBMITTED_to_VALIDATED
        distinguishing_aspect: "The validate transition flips SUBMITTED -> VALIDATED and back-fills Policy.unit_stat_report_id."
        test_recipe:
          setup:
            - "Bureau; carrier; employer A; class 3632; TX table; policy P1; report R1 SUBMITTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /bureaus"
              payload: { code: "NCCI", name: "National Bureau", eligibility_threshold_cents: 500000, split_point_cents: 1000000, credibility_ballast_bp: 4000, credibility_excess_divisor_bp: 6000, underwriting_threshold_cents: 2500000 }
              as: BureauAdmin
            - call: "POST /carriers"
              payload: { naic_number: "10001", legal_name: "Alamo Mutual", assigned_risk_quota_cents: 100000000 }
              as: BureauAdmin
              captures: { carrier_id: $.data.id }
            - call: "POST /employers"
              payload: { fein: "75-1000001", legal_name: "Pecos Machine Works", state_code: "TX" }
              as: BureauAdmin
              captures: { employer_a: $.data.id }
            - call: "POST /class-codes"
              payload: { code: "3632", description: "Machine Shop NOC", state_code: "TX" }
              as: BureauAdmin
            - call: "POST /rating-tables"
              payload: { state_code: "TX", effective_date: "2024-01-01", values: [{ class_code: "3632", rate_per_100_payroll_cents: 250, elr_per_100_payroll_cents: 150, d_ratio_bp: 4000 } ] }
              as: BureauAdmin
              captures: { rt_tx: $.data.id }
            - call: "POST /rating-tables/${rt_tx}/promulgate"
              payload: {}
              as: BureauAdmin
            - call: "POST /policies"
              payload: { employer_id: "${employer_a}", carrier_id: "${carrier_id}", policy_number: "WC-1001", effective_date: "2024-01-01", expiration_date: "2025-01-01", class_codes: [{ class_code: "3632", payroll_dollars: 100000 } ] }
              as: CarrierDataReporter
              as_user_id: "${carrier_id}"
              captures: { policy_p1: $.data.id }
            - call: "POST /unit-stat-reports"
              payload: { policy_id: "${policy_p1}", payroll_lines: [{ class_code: "3632", payroll_dollars: 100000 } ], claim_lines: [{ claim_number: "Q1", claim_type: "MEDICAL", incurred_cents: 50000, paid_cents: 50000, claim_status: "CLOSED", state_code: "TX" } ] }
              as: CarrierDataReporter
              as_user_id: "${carrier_id}"
              captures: { report_q: $.data.id }
          trigger:
            - call: "POST /unit-stat-reports/${report_q}/validate"
              payload: {}
              as: BureauAnalyst
          assert:
            - "UnitStatReport.${report_q}.status == VALIDATED"
            - "Policy.${policy_p1}.unit_stat_report_id == ${report_q}"

      - name: second_validate_on_validated_report_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.UnitStatReport.SUBMITTED_to_VALIDATED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "VALIDATED is not a source state for validate; repeating the call yields 409 ERR_INVALID_STATE and no further mutation."
        test_recipe:
          setup:
            - "Report R1 already VALIDATED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /bureaus"
              payload: { code: "NCCI", name: "National Bureau", eligibility_threshold_cents: 500000, split_point_cents: 1000000, credibility_ballast_bp: 4000, credibility_excess_divisor_bp: 6000, underwriting_threshold_cents: 2500000 }
              as: BureauAdmin
            - call: "POST /carriers"
              payload: { naic_number: "10001", legal_name: "Alamo Mutual", assigned_risk_quota_cents: 100000000 }
              as: BureauAdmin
              captures: { carrier_id: $.data.id }
            - call: "POST /employers"
              payload: { fein: "75-1000001", legal_name: "Pecos Machine Works", state_code: "TX" }
              as: BureauAdmin
              captures: { employer_a: $.data.id }
            - call: "POST /class-codes"
              payload: { code: "3632", description: "Machine Shop NOC", state_code: "TX" }
              as: BureauAdmin
            - call: "POST /rating-tables"
              payload: { state_code: "TX", effective_date: "2024-01-01", values: [{ class_code: "3632", rate_per_100_payroll_cents: 250, elr_per_100_payroll_cents: 150, d_ratio_bp: 4000 } ] }
              as: BureauAdmin
              captures: { rt_tx: $.data.id }
            - call: "POST /rating-tables/${rt_tx}/promulgate"
              payload: {}
              as: BureauAdmin
