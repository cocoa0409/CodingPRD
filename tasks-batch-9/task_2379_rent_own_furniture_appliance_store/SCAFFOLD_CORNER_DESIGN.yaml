  # ===========================================================================
  # 7. RBAC
  # ===========================================================================
  - section: rbac
    instances:

      - name: each_role_cannot_reach_another_roles_exclusive_write
        claim_type: cannot_perform_other_roles_exclusive_operations
        grounds:
          - roles
          - validations[priority=3].ERR_ROLE_FORBIDDEN
          - endpoints[POST /customers]
          - endpoints[POST /customers/{id}/verify]
          - endpoints[POST /stores]
          - endpoints[POST /state-rto-rules]
          - endpoints[POST /stores/{id}/day-close]
        distinguishing_aspect: |
          The role model is segregation of duties, so each exclusive write is
          closed to the neighbouring roles even when they touch the same
          entities: CollectionsAgent may read customers but not create them,
          SalesAssociate creates them but may not verify them, StoreManager runs
          the store but may not open one, ComplianceOfficer audits every state
          rule but may not write one, and ServiceTechnician — who works units
          and tickets — may not read a customer row at all. Every refusal is a
          403 ERR_ROLE_FORBIDDEN raised at priority 3, before any body or state
          check, and none of them writes a row.
        test_recipe:
          setup:
            - "one TX StateRtoRule, one TX store and one PENDING customer created by a SalesAssociate"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /state-rto-rules"
              payload: { state_code: "TX", late_fee_grace_days: 3, late_fee_pct: 0.10, late_fee_max_cents: 1000, reinstate_threshold_months: 2, reinstate_days_short: 5, reinstate_days_long: 15, reinstatement_fee_cents: 500, early_purchase_formula: "PCT_OF_REMAINING", early_purchase_pct: 0.55, rent_credit_pct: 0.50, processing_fee_max_cents: 5000, disclosure_requires_total_of_payments: true, max_collection_contacts_per_week: 3, quiet_hours_start_utc_hour: 20, quiet_hours_end_utc_hour: 8, repossession_paid_pct_limit: 0.60, credit_inquiry_prohibited: true, max_term_renewals: 78 }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Austin Main", state_code: "TX", service_bay_capacity: 1 }
              as: PlatformAdmin
              captures: { store_tx_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Dana Reyes", email: "dana@example.com", phone: "+15125550101", state_code: "TX", employer_name: "Bluebonnet Foods", employer_verified: true, monthly_income_cents: 300000, residence_months: 18, government_id_verified: true, in_person_contact_consent: true }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /customers"
              payload: { full_name: "Mo Klein", email: "mo@example.com", phone: "+15125550131", state_code: "TX", employer_name: "Zilker Freight", employer_verified: true, monthly_income_cents: 300000, residence_months: 18, government_id_verified: true, in_person_contact_consent: true }
              as: CollectionsAgent
            - call: "POST /customers/${cust_id}/verify"
              payload: { decision: "APPROVE" }
              as: SalesAssociate
            - call: "POST /stores"
              payload: { name: "Dallas North", state_code: "TX", service_bay_capacity: 2 }
              as: StoreManager
            - call: "POST /state-rto-rules"
              payload: { state_code: "MN", late_fee_grace_days: 5, late_fee_pct: 0.05, late_fee_max_cents: 600, reinstate_threshold_months: 2, reinstate_days_short: 7, reinstate_days_long: 21, reinstatement_fee_cents: 0, early_purchase_formula: "CASH_PRICE_MINUS_CREDIT", early_purchase_pct: 0.55, rent_credit_pct: 0.55, processing_fee_max_cents: 0, disclosure_requires_total_of_payments: true, max_collection_contacts_per_week: 2, quiet_hours_start_utc_hour: 21, quiet_hours_end_utc_hour: 9, repossession_paid_pct_limit: 0.50, credit_inquiry_prohibited: false, max_term_renewals: 24 }
              as: ComplianceOfficer
            - call: "GET /customers/${cust_id}"
              as: ServiceTechnician
            - call: "POST /stores/${store_tx_id}/day-close"
              as: SalesAssociate
            - call: "POST /stores/${store_tx_id}/inventory-units"
              payload: { model_code: "SOFA-3S-GRY", category: "FURNITURE", serial_number: "SN-TX-0009", cash_price_cents: 120000 }
              as: CollectionsAgent
            - call: "GET /customers"
              as: CollectionsAgent
          assert:
            - "all seven cross-role calls return 403 ERR_ROLE_FORBIDDEN: customer creation by CollectionsAgent, verification by SalesAssociate, store creation by StoreManager, state-rule creation by ComplianceOfficer, customer read by ServiceTechnician, day-close by SalesAssociate and unit creation by CollectionsAgent"
            - "the refusals are raised at priority 3, ahead of every body and state check: the SalesAssociate verify body was well formed and the customer had zero VERIFIED references, yet the response is 403 and not 422 ERR_INSUFFICIENT_REFERENCES"
            - "no row was written: the final GET /customers reports total_count == 1 (only Dana Reyes), and no second store, no MN state rule and no inventory unit exists"
            - "Customer.${cust_id}.verification_status is still PENDING with verification_score == 0"
            - "the final GET /customers as CollectionsAgent returns 200 — the boundary is per operation, not per entity: collections may read the customer book it works from while being unable to write it"

      - name: customer_role_reads_are_shared_but_scoped_to_its_own_rows
        claim_type: shared_operations
        grounds:
          - roles[Customer].identity
          - validations[priority=5].ERR_NOT_RESOURCE_OWNER
          - endpoints[GET /customers/{id}]
          - endpoints[GET /agreements/{id}]
        distinguishing_aspect: |
          GET /customers/{id} and GET /agreements/{id} are shared operations —
          ComplianceOfficer, CollectionsAgent, StoreManager and the renter all
          get the identical row — but the entity-backed Customer role is scoped
          by X-User-ID: reading another renter's customer row or agreement is a
          403 ERR_NOT_RESOURCE_OWNER at priority 5, which is a different failure
          from the priority-3 role check and lands after authentication and
          before the 404 layer is even consulted.
        test_recipe:
          setup:
            - "one TX rule, one TX store, two VERIFIED customers, and one WEEKLY x 52 agreement belonging to the first customer"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /state-rto-rules"
