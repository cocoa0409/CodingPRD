  # ===========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: adjourned_vote_state_trumps_control_number_constraint
        grounds:
          - validations[priority=4]
          - validations[priority=8]
          - errors[ERR_VOTING_NOT_OPEN]
          - errors[ERR_INVALID_CONTROL_NUMBER]
        distinguishing_aspect: |
          Pair state(4) vs business_constraint(8): a vote attempted while the meeting is
          ADJOURNED with a wrong control_number violates both rules; the state error
          ERR_VOTING_NOT_OPEN must win over ERR_INVALID_CONTROL_NUMBER.
        test_recipe:
          setup:
            - "ANNUAL meeting convened then ADJOURNED; a1 holds 6000 COMMON; p1 ACTIVE"
          setup_api_calls:
