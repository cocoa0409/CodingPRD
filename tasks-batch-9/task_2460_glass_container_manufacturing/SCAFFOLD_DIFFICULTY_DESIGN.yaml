      - name: complaint_plant_attribution_cascades_quarantine_standing_and_program_suspension
        grounds:
          - state_machines.Complaint.OPEN_to_INVESTIGATING
          - state_machines.Complaint.INVESTIGATING_to_CREDIT_ISSUED
          - calculations.complaint_credit_usd
          - calculations.customer_quality_standing
          - state_machines.LightweightingProgram.ADOPTED_to_SUSPENDED
          - state_machines.PackLot.SHIPPED_to_RETURNED
        distinguishing_aspect: |
          A different trigger than the job-close cascade: complaint settle credits 465.75 (hop 1),
          which rewrites Customer.weighted_breakage_ppm to 2500.00 (hop 2), which crosses the
          customer's 2000.00 threshold into CRITICAL (hop 3), which suspends the ADOPTED
          lightweighting program on that customer's design (hop 4). An implementation that computes
          the credit but never re-derives standing leaves the program in ADOPTED.
        test_recipe:
          setup:
            - "Customer HOTEL-01 with complaint_ppm_threshold 2000.00 and palletization_standard EURO_1200x800"
            - "BottleDesign BD-09 APPROVED with container_price_usd 0.1725 and nominal_weight_g 190.00"
            - "PackLot lot RELEASED and SHIPPED with packed_units 2001000 and net_packed_units 2000000"
            - "LightweightingProgram LW-09 in ADOPTED on BD-09 (target_weight_g 180.00 so breakage_risk_delta is 0.00)"
            - "Complaint CO-09 in INVESTIGATING with attribution PLANT and affected_units 5000 (breakage_ppm 2500.0)"
            - "Logical clock at 2026-08-06T00:00:00Z"
          setup_api_calls:
            - call: "POST /glass-plant/furnaces"
              payload: { code: "F-09", design_pull_tpd: 300.00, refractory_life_total_units: 100000.00 }
              as: PlantManager
              captures: { f: "$.data.id" }
