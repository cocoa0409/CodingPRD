  # =============================================== From Table 3 (Calculations)
  - section: calculations
    instances:
      - name: standing_threshold_exact_30_suspends
        claim_type: constants_applied
        grounds: [calculations.calc_agent_standing, state_machines.Agent_standing]
        distinguishing_aspect: "Threshold is >= : exactly 20 points (2 late cancels) yields RESTRICTED; exactly 30 points (3 late cancels) yields SUSPENDED — no overshoot past the boundary needed."
        test_recipe:
          setup:
            - "clock 2026-05-01T00:00:00Z; verified buyer BA; LA; VACANT auto listing L (buffer 30, cap 5)"
            - "three showings 10:00/12:00/14:00 confirmed, each cancelled at t0 (all within 24h of start -> LATE_CANCEL each)"
          setup_api_calls:
            - { call: "POST /showing-desk/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /showing-desk/agents", payload: { full_name: "TH LA", license_number: "LIC-TH-LA", brokerage_name: "B1" }, as: Anonymous, captures: { la_id: $.data.id } }
            - { call: "POST /showing-desk/agents", payload: { full_name: "TH BA", license_number: "LIC-TH-BA", brokerage_name: "B2" }, as: Anonymous, captures: { ba_id: $.data.id } }
            - { call: "POST /showing-desk/agents/${ba_id}/verification-cases", payload: { license_document_ref: "doc-th" }, as: BuyerAgent, as_user_id: "${ba_id}", captures: { case_id: $.data.id } }
            - { call: "POST /showing-desk/verification-cases/${case_id}/review", payload: { decision: "APPROVE" }, as: PlatformAdmin }
            - { call: "POST /showing-desk/sellers", payload: { full_name: "TH S", contact_email: "th@x.com", auto_approve: true }, as: PlatformAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /showing-desk/listings", payload: { seller_id: "${s_id}", address: "23 Threshold Dr", occupancy_type: "VACANT" }, as: ListingAgent, as_user_id: "${la_id}", captures: { l_id: $.data.id } }
            - { call: "POST /showing-desk/showing-requests", payload: { listing_id: "${l_id}", start_at: "2026-05-01T10:00:00Z", end_at: "2026-05-01T10:30:00Z" }, as: BuyerAgent, as_user_id: "${ba_id}", captures: { r1_id: $.data.id } }
            - { call: "POST /showing-desk/showing-requests/${r1_id}/confirm", payload: {}, as: BuyerAgent, as_user_id: "${ba_id}" }
            - { call: "POST /showing-desk/showing-requests/${r1_id}/cancel", payload: {}, as: BuyerAgent, as_user_id: "${ba_id}" }
            - { call: "POST /showing-desk/showing-requests", payload: { listing_id: "${l_id}", start_at: "2026-05-01T12:00:00Z", end_at: "2026-05-01T12:30:00Z" }, as: BuyerAgent, as_user_id: "${ba_id}", captures: { r2_id: $.data.id } }
            - { call: "POST /showing-desk/showing-requests/${r2_id}/confirm", payload: {}, as: BuyerAgent, as_user_id: "${ba_id}" }
            - { call: "POST /showing-desk/showing-requests/${r2_id}/cancel", payload: {}, as: BuyerAgent, as_user_id: "${ba_id}" }
          trigger:
            - { call: "GET /showing-desk/agents/${ba_id}", payload: {}, as: PlatformAdmin, captures: { st_20: $.data.standing, pts_20: $.data.active_strike_points } }
            - { call: "POST /showing-desk/showing-requests", payload: { listing_id: "${l_id}", start_at: "2026-05-01T14:00:00Z", end_at: "2026-05-01T14:30:00Z" }, as: BuyerAgent, as_user_id: "${ba_id}", captures: { r3_id: $.data.id } }
            - { call: "POST /showing-desk/showing-requests/${r3_id}/confirm", payload: {}, as: BuyerAgent, as_user_id: "${ba_id}" }
            - { call: "POST /showing-desk/showing-requests/${r3_id}/cancel", payload: {}, as: BuyerAgent, as_user_id: "${ba_id}" }
            - { call: "GET /showing-desk/agents/${ba_id}", payload: {}, as: PlatformAdmin, captures: { st_30: $.data.standing, pts_30: $.data.active_strike_points } }
          assert:
            - "at 20 points: standing == RESTRICTED (20 >= 15 but < 30)"
            - "at exactly 30 points: standing == SUSPENDED (>= 30 boundary inclusive)"
      - name: report_final_zero_terminal_divide_by_zero
        claim_type: correct_result
        grounds: [calculations.calc_seller_report_metrics]
        distinguishing_aspect: "A fresh listing with zero terminal requests reports FINAL completion_rate == 0.00 (0/0 is pinned to 0.00, never an error) and all counts 0."
        test_recipe:
          setup: ["one listing, no requests"]
          setup_api_calls:
            - { call: "POST /showing-desk/sellers", payload: { full_name: "ZR S", contact_email: "zr@x.com" }, as: PlatformAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /showing-desk/agents", payload: { full_name: "ZR LA", license_number: "LIC-ZR-LA", brokerage_name: "B1" }, as: Anonymous, captures: { la_id: $.data.id } }
            - { call: "POST /showing-desk/listings", payload: { seller_id: "${s_id}", address: "25 Zero Rd", occupancy_type: "VACANT" }, as: ListingAgent, as_user_id: "${la_id}", captures: { l_id: $.data.id } }
          trigger:
            - { call: "GET /showing-desk/listings/${l_id}/activity-report", payload: { mode: "FINAL" }, as: ListingAgent, as_user_id: "${la_id}", captures: { rep_rate: $.data.completion_rate, rep_completed: $.data.completed_count, rep_avg: $.data.avg_feedback_score } }
          assert:
            - "completion_rate == 0.00, completed_count == 0, avg_feedback_score == 0.0"
      - name: strike_expiry_deescalates_standing
        claim_type: input_set_filtering
        grounds: [calculations.calc_agent_standing, state_machines.StrikeRecord.ACTIVE_to_EXPIRED]
        distinguishing_aspect: "After a strike's 90-day TTL passes and the sweep expires it, the strike leaves the ACTIVE input set: active_strike_points drops 10 -> 0 and standing de-escalates RESTRICTED/GOOD accordingly (EXPIRED strikes no longer count)."
        test_recipe:
          setup: ["buyer with one LATE_CANCEL strike created at 2026-05-01T00:00:00Z (expires_at 2026-07-30T00:00:00Z)"]
          setup_api_calls:
            - { call: "POST /showing-desk/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /showing-desk/agents", payload: { full_name: "EX LA", license_number: "LIC-EX-LA", brokerage_name: "B1" }, as: Anonymous, captures: { la_id: $.data.id } }
            - { call: "POST /showing-desk/agents", payload: { full_name: "EX BA", license_number: "LIC-EX-BA", brokerage_name: "B2" }, as: Anonymous, captures: { ba_id: $.data.id } }
            - { call: "POST /showing-desk/agents/${ba_id}/verification-cases", payload: { license_document_ref: "doc-ex" }, as: BuyerAgent, as_user_id: "${ba_id}", captures: { case_id: $.data.id } }
            - { call: "POST /showing-desk/verification-cases/${case_id}/review", payload: { decision: "APPROVE" }, as: PlatformAdmin }
            - { call: "POST /showing-desk/sellers", payload: { full_name: "EX S", contact_email: "ex@x.com", auto_approve: true }, as: PlatformAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /showing-desk/listings", payload: { seller_id: "${s_id}", address: "27 Expire Ave", occupancy_type: "VACANT" }, as: ListingAgent, as_user_id: "${la_id}", captures: { l_id: $.data.id } }
            - { call: "POST /showing-desk/showing-requests", payload: { listing_id: "${l_id}", start_at: "2026-05-01T10:00:00Z", end_at: "2026-05-01T10:30:00Z" }, as: BuyerAgent, as_user_id: "${ba_id}", captures: { r_id: $.data.id } }
            - { call: "POST /showing-desk/showing-requests/${r_id}/confirm", payload: {}, as: BuyerAgent, as_user_id: "${ba_id}" }
            - { call: "POST /showing-desk/showing-requests/${r_id}/cancel", payload: {}, as: BuyerAgent, as_user_id: "${ba_id}" }
            - { call: "GET /showing-desk/agents/${ba_id}/strikes", payload: {}, as: PlatformAdmin, captures: { sk_exp: "$.data[0].expires_at" } }
            - { call: "POST /showing-desk/_clock/set_current_utc", payload: { to_iso8601: "2026-07-31T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /showing-desk/_ops/run_expiration_sweep", payload: {}, as: PlatformAdmin, captures: { n_exp: $.data.strikes_expired_count } }
            - { call: "GET /showing-desk/agents/${ba_id}", payload: {}, as: PlatformAdmin, captures: { a_pts: $.data.active_strike_points, a_st: $.data.standing } }
          assert:
            - "strike expires_at == '2026-07-30T00:00:00Z' (created_at + 90 days)"
            - "sweep strikes_expired_count == 1"
            - "after sweep: active_strike_points == 0 and standing == GOOD_STANDING"
      - name: approval_deadline_formula_corner
        claim_type: correct_result
        grounds: [calculations.calc_approval_deadline]
        excluded_because:
          difficulty_instance: approval_deadline_nested_minmax
          rationale: "Formula branches and clamps asserted with literal deadlines in the named §1.8 instance."
      - name: feedback_rollup_corner
        claim_type: precision
        grounds: [calculations.calc_feedback_score_rollup]
        excluded_because:
          difficulty_instance: feedback_rollup_per_feedback_rounding_order
          rationale: "Rounding order and literal scores asserted in the named §1.8 instance."
