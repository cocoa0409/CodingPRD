              captures: { site_id: $.data.id }
            - call: "POST /posts"
              payload: { site_id: "${site_id}", name: "Real Post", bill_rate_cents_per_hour: 4500 }
              as: AccountManager
              captures: { post_id: $.data.id, post_v: $.data.version }
          trigger:
            - call: "POST /post-orders"
              payload: { post_id: "00000000-0000-4000-8000-000000000002", expected_post_version: "${post_v}", body_text: "Nowhere.", revision_label: "REV-X" }
              as: AccountManager
          assert:
            - "HTTP status == 404"
            - "data.error_id == 'ERR_POST_NOT_FOUND'"
            - "data.error_id != 'ERR_STALE_VERSION'"

