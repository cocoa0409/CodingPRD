        distinguishing_aspect: "SlicerAsset cycles CLEAN -> IN_USE -> NEEDS_SANITATION -> SANITIZING -> CLEAN and then re-enters the cycle a second time, and the SanitationCycle row that measured it takes the revert edge COMPLETE -> ABORTED — so the machine revisits a prior state rather than terminating in a linear pipeline."
