              payload: { provider_id: "${prov_id}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", variant: "PROVISIONAL", expected_provider_version: "${prov_v0}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { report_prov: $.data.id }
            - call: "GET /rmd/providers/${prov_id}"
              payload: {}
              as: Regulator
              captures: { prov_v1: $.data.version }
          trigger:
            - call: "POST /rmd/effectiveness-reports"
              payload: { provider_id: "${prov_id}", period_start: "2026-07-15T00:00:00Z", period_end: "2026-08-01T00:00:00Z", variant: "CERTIFIED", expected_provider_version: "${prov_v1}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { report_cert: $.data.id }
            - call: "POST /rmd/effectiveness-reports/${report_prov}/certify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-2"
              expect: { status: 409, error_id: ERR_REPORT_STATE_INVALID }
          assert:
            - "The second generation is 201 with data.variant == CERTIFIED, data.state == GENERATED and data.period_start == 2026-07-15T00:00:00Z"
            - "EffectivenessReport.${report_prov}.state == SUPERSEDED because 2026-07-15T00:00:00Z falls inside its period, and its variant is still PROVISIONAL"
            - "Certifying the superseded report is 409 with data.error_id == ERR_REPORT_STATE_INVALID"
            - "Both rows report data_sufficiency == INSUFFICIENT and attestation_component == 0.0000 over their empty periods, and neither carries signed_off_by_user_id"
            - "GET /rmd/effectiveness-reports?provider_id=${prov_id}&state=GENERATED returns total_count == 1 with data[0].id == ${report_cert}"

      - name: analytics_score_exactly_at_the_auto_suspend_boundary_suspends_origination
        claim_type: rate_threshold_triggers
        grounds:
          - "endpoints[POST /rmd/blocking-events]"
          - state_machines.Customer.origination_state.ENABLED_to_SUSPENDED
          - entities.BlockingEvent.fields.triggered_suspension
        distinguishing_aspect: "The instantaneous auto-suspend trigger is an inclusive >= 0.9500 comparison that is separate from the 0.6500 blocking floor: a 0.9400 block is recorded without touching origination, and the very next block at exactly 0.9500 suspends the customer and names itself as suspension_source_id."
        test_recipe:
          setup:
            - "One provider with one verified, origination-enabled customer holding one number"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-26T00:00:00Z" }
              as: Regulator
            - call: "POST /rmd/providers"
              payload: { legal_name: "Auto Suspend Voice", provider_type: "FACILITIES_BASED" }
              as: Regulator
              captures: { prov_id: $.data.id }
            - call: "POST /rmd/customers"
              payload: { provider_id: "${prov_id}", legal_name: "Boundary Score Co", contact_email: "ops@boundaryscore.example", kyc_evidence_level: "BUSINESS_REGISTRY_VERIFIED" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { cust_id: $.data.id }
            - call: "POST /rmd/customers/${cust_id}/kyc-submit"
              payload: {}
              as: KycAnalyst
              as_user_id: "kyc-1"
            - call: "POST /rmd/customers/${cust_id}/kyc-decision"
              payload: { decision: "VERIFY" }
              as: KycAnalyst
              as_user_id: "kyc-2"
            - call: "POST /rmd/customers/${cust_id}/origination-actions"
              payload: { action: "ENABLE" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
            - call: "POST /rmd/number-assignments"
              payload: { provider_id: "${prov_id}", customer_id: "${cust_id}", telephone_number: "+12025552501", ownership_evidence: "DIRECT_ALLOCATION", effective_from: "2026-08-01T00:00:00Z" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { asg_id: $.data.id }
          trigger:
            - call: "POST /rmd/blocking-events"
              payload: { provider_id: "${prov_id}", customer_id: "${cust_id}", calling_number: "+12025552501", analytics_score: 0.9400, reason: "ANALYTICS_SCORE" }
              as: FraudAnalyst
              as_user_id: "fraud-1"
              captures: { evt_below: $.data.id }
            - call: "POST /rmd/blocking-events"
              payload: { provider_id: "${prov_id}", customer_id: "${cust_id}", calling_number: "+12025552501", analytics_score: 0.9500, reason: "ANALYTICS_SCORE" }
              as: FraudAnalyst
              as_user_id: "fraud-1"
              captures: { evt_at: $.data.id }
          assert:
            - "BlockingEvent.${evt_below}.status == BLOCKED with triggered_suspension == false, and immediately after it Customer.${cust_id}.origination_state == ENABLED with suspension_cause == null"
            - "BlockingEvent.${evt_at}.status == BLOCKED with triggered_suspension == true"
            - "Customer.${cust_id}.origination_state == SUSPENDED with suspension_cause == BLOCKING_ANALYTICS and suspension_source_id == ${evt_at}"
            - "NumberAssignment.${asg_id}.status == SUSPENDED_BY_CUSTOMER with revoked_at == null, and Provider.${prov_id}.active_assigned_number_count == 0"
            - "Provider.${prov_id}.blocking_false_positive_rate == 0.0000 with two events in the denominator and none reversed"
            - "Customer.${cust_id}.kyc_state == VERIFIED and traffic_risk_index == 0.0000 - the analytics trigger never touches the observation-driven index"

      - name: four_hop_cascade_chain_is_verified_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - calculations.provider_posture_recompute
          - state_machines.IllegalTrafficNotice.NOTIFIED_to_EXPIRED_UNMITIGATED
        excluded_because:
          difficulty_instance: notice_expiry_cascades_four_hops_to_provider_posture
          rationale: "That §1.8 instance already walks notice expiry to customer suspension to assignment suspension to provider penalty_points and posture in one sweep, asserting every hop, so a second end-to-end chain test would restate it."

      - name: variant_switch_delta_on_one_period_is_correct
        claim_type: dual_variant_calculation
        grounds:
          - calculations.mitigation_effectiveness_score
          - entities.EffectivenessReport.fields.variant
        excluded_because:
          difficulty_instance: effectiveness_provisional_vs_certified_on_same_period
          rationale: "Both variants are generated over one identical period there, with every component and the resulting delta asserted as literals, which is exactly the both-variants-and-delta claim."

      - name: cumulative_risk_threshold_fires_exactly_at_the_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.customer_traffic_risk_index
          - "validations[priority=29]"
        excluded_because:
          difficulty_instance: risk_index_exactly_at_auto_suspend_threshold_suspends
          rationale: "The cumulative, observation-driven threshold is tested at exactly AUTO_SUSPEND = 0.9000 there, including the recency-weighted arithmetic that lands on the boundary, so the cumulative half of this layer is covered."

  - section: consistency_model
    instances:
      - name: sweep_response_already_carries_every_recomputed_counter
        claim_type: immediate_consistency
        grounds:
          - "endpoints[POST /rmd/compliance-sweeps]"
          - calculations.provider_assignment_and_blocking_metrics
          - calculations.provider_posture_recompute
        distinguishing_aspect: "Consistency is immediate, so the sweep's own 200 body must already show the post-cascade counters: the expiry it performed is reflected in penalty_points and open_notice_count inside the same response, and a read immediately afterwards returns the identical numbers and the identical version - there is no settle-then-read window."
        test_recipe:
          setup:
            - "One provider with one notice whose 48 hour mitigation window has lapsed"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: Regulator
            - call: "POST /rmd/providers"
              payload: { legal_name: "Immediate View Voice", provider_type: "FACILITIES_BASED" }
              as: Regulator
              captures: { prov_id: $.data.id }
            - call: "POST /rmd/illegal-traffic-notices"
              payload: { provider_id: "${prov_id}", calling_number: "+12025552601", description: "Notice that will lapse unmitigated" }
              as: Regulator
              captures: { notice_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-06T00:00:00Z" }
              as: Regulator
          trigger:
            - call: "POST /rmd/compliance-sweeps"
              payload: { provider_id: "${prov_id}" }
              as: Regulator
              captures: { swept_points: $.data.penalty_points, swept_open: $.data.open_notice_count, swept_version: $.data.version }
            - call: "GET /rmd/providers/${prov_id}"
              payload: {}
              as: Regulator
          assert:
            - "The sweep body itself returns data.penalty_points == 5, data.open_notice_count == 0, data.sweep_index == 1, data.overdue_traceback_count == 0 and data.auth_posture == SIGNING_SUSPENDED"
            - "The immediately following read returns the same data.penalty_points == 5, data.open_notice_count == 0, data.sweep_index == 1 and data.version == ${swept_version} - no counter settles later"
            - "IllegalTrafficNotice.${notice_id}.state == EXPIRED_UNMITIGATED with penalty_points_assessed == 5 and resolved_at == 2026-08-06T00:00:00Z, readable on the first attempt"
            - "Provider.${prov_id}.rmd_filing_status == UNFILED and outstanding_forfeiture_cents == 0"

      - name: denormalized_counters_never_lag_behind_their_source_rows
        claim_type: immediate_consistency
        grounds:
          - calculations.provider_outstanding_forfeiture
          - entities.Provider.fields.outstanding_forfeiture_cents
        excluded_because:
          difficulty_instance: outstanding_forfeiture_conserved_across_dismissal_and_payment
          rationale: "That §1.8 instance reads Provider.outstanding_forfeiture_cents after every enforcement write - proposal, dismissal and payment - and asserts the conserved total each time, which is the immediate-visibility claim for the denormalized money counter."
