              as_user_id: "${agent_id}"
              captures: { enrollment_three_id: $.data.id }
            - call: "GET /call-sessions/${call_id}"
              payload: {}
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { call_v_d: $.data.version }
            - call: "POST /enrollments"
              payload: { call_session_id: "${call_id}", member_id: "${member_id}", plan_id: "${plan_a_id}", agent_id: "${agent_id}", scope_of_appointment_id: "${soa_id}", effective_date: "2026-11-01T00:00:00Z", plan_type_discussed: "MAPD", expected_call_session_version: "${call_v_d}" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the REJECTED enrollment did not consume capacity: the second submission returns 201 because REJECTED rows are excluded from the committed count"
            - "the second submission returns 201 and brings committed to exactly 2"
            - "the third submission returns 201 and brings committed to exactly 3, the capacity"
            - "the fourth submission returns 409 with error_id == ERR_AEP_DAILY_SUBMISSION_CAPACITY_EXCEEDED — committed 3 equals capacity 3 and that blocks"
            - "GET /enrollments?carrier_id=${carrier_a_id} returns exactly 3 rows, so the blocked request persisted nothing"
            - "committed never exceeds capacity: capacity is a ceiling that the fourth submission may not touch"

      - name: boundary_coaching_due_on_is_not_yet_overdue
        grounds:
          - calculations.coaching_overdue_days
          - state_machines.CoachingAssignment.transitions.ASSIGNED_to_OVERDUE
          - entities.CoachingAssignment.fields.overdue_days
          - errors.ERR_COACHING_NOT_ASSIGNED
        distinguishing_aspect: "coaching_overdue_days is an inclusive-boundary whole-day metric on a different surface — the CoachingAssignment endpoint rather than the enrollment endpoint: at exactly due_on 2026-10-15T00:00:00Z the assignment reads ASSIGNED with overdue_days 0 and POST /start succeeds, and one day later it reads OVERDUE with overdue_days 1 and POST /start fails with ERR_COACHING_NOT_ASSIGNED."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z; the shared anchor chain plus a manual SOA_RETRAINING coaching assignment created 2026-10-01, so due_on is exactly 2026-10-15T00:00:00Z."
          setup_api_calls:
            - *d_clock
            - *d_agency
            - *d_carrier_a
            - *d_plan_a
            - *d_drug_a
            - *d_prov_a
            - *d_agent
            - *d_lic
            - *d_cert
            - *d_appt
            - *d_member
            - *d_member_two
            - *c_coaching
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /coaching-assignments/${coaching_id}"
              payload: {}
              as: Coach
              captures: { status_at_due: $.data.status, overdue_at_due: $.data.overdue_days }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-16T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /coaching-assignments/${coaching_id}"
              payload: {}
              as: Coach
              captures: { status_next: $.data.status, overdue_next: $.data.overdue_days }
            - call: "POST /coaching-assignments/${coaching_id}/start"
              payload: {}
              as: Coach
              captures: { start_error: $.data.error_id }
            - call: "POST /coaching-assignments/${coaching_id}/complete"
              payload: { notes: "Retraining delivered" }
              as: Coach
              captures: { final_status: $.data.status, final_overdue: $.data.overdue_days }
          assert:
            - "at exactly due_on 2026-10-15T00:00:00Z the assignment reads ASSIGNED with overdue_days == 0 — the boundary is inclusive, so the clock reading due_on is not yet overdue"
            - "at 2026-10-16T00:00:00Z the same assignment reads OVERDUE with overdue_days == 1"
            - "POST /coaching-assignments/${coaching_id}/start at 2026-10-16 returns 409 with start_error == ERR_COACHING_NOT_ASSIGNED"
            - "POST /coaching-assignments/${coaching_id}/complete from OVERDUE returns 200 and the assignment reads COMPLETED with overdue_days == 0"
            - "Agent.${agent_id}.compliance_risk_score == 0.00 at 2026-10-15 and == 3.00 at 2026-10-16, the 3.00 coming only from the OVERDUE_DAY_POINTS branch"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: cross_dependency_call_session_status_gates_enrollment
        grounds:
          - validations[priority=16]
          - state_machines.CallSession.transitions.IN_PROGRESS_to_COMPLETED
          - entities.Enrollment.fields.submission_status
          - errors.ERR_CALL_NOT_COMPLETED
        distinguishing_aspect: "The Enrollment to CallSession pair: POST /enrollments is legal only while the call session is COMPLETED or AMENDED, so the identical request succeeds against the completed call and is refused with ERR_CALL_NOT_COMPLETED against the same call left IN_PROGRESS."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z; the shared anchor chain with one completed call, plus a second scope and a second call session that is connected and left IN_PROGRESS."
          setup_api_calls:
            - *d_clock
            - *d_agency
            - *d_carrier_a
            - *d_plan_a
            - *d_drug_a
            - *d_prov_a
            - *d_agent
            - *d_lic
            - *d_cert
            - *d_appt
            - *d_member
            - *d_member_two
            - *d_soa
            - *d_call
            - *d_connect
            - *d_complete
            - *d_soa_two
            - &h_call_two
              call: "POST /call-sessions"
              payload: { agent_id: "${agent_id}", member_id: "${member_two_id}", scope_of_appointment_id: "${soa_two_id}", started_at: "2026-10-01T10:00:00Z", scheduled_end_at: "2026-10-01T10:30:00Z", recording_id: "REC-1002", disclaimer_script_code: "CMS-DISC-2026", disclaimer_delivered: true, marketing_rule_set_version: "MKT-2026-V3" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { call_two_id: $.data.id }
            - call: "POST /call-sessions/${call_two_id}/connect"
              payload: { disclaimer_delivered: true, plan_type_discussed: "MAPD", recording_id: "REC-1002", disclaimer_script_code: "CMS-DISC-2026", marketing_rule_set_version: "MKT-2026-V3" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { call_two_v_live: $.data.version }
          trigger:
            - call: "POST /enrollments"
              payload: { call_session_id: "${call_two_id}", member_id: "${member_two_id}", plan_id: "${plan_a_id}", agent_id: "${agent_id}", scope_of_appointment_id: "${soa_two_id}", effective_date: "2026-11-01T00:00:00Z", plan_type_discussed: "MAPD", expected_call_session_version: "${call_two_v_live}" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { error_id_open_call: $.data.error_id }
            - call: "POST /call-sessions/${call_two_id}/complete"
              payload: { recording_id: "REC-1002", disclaimer_delivered: true }
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { call_two_v_done: $.data.version }
            - call: "POST /enrollments"
              payload: { call_session_id: "${call_two_id}", member_id: "${member_two_id}", plan_id: "${plan_a_id}", agent_id: "${agent_id}", scope_of_appointment_id: "${soa_two_id}", effective_date: "2026-11-01T00:00:00Z", plan_type_discussed: "MAPD", expected_call_session_version: "${call_two_v_done}" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
          assert:
            - "the first submission returns 409 with error_id_open_call == ERR_CALL_NOT_COMPLETED"
            - "GET /enrollments?call_session_id=${call_two_id} returns 0 rows after that refusal, so nothing was persisted"
            - "the second submission, identical except that the call is now COMPLETED, returns 201 and creates an Enrollment with submission_status == SUBMITTED"
            - "GET /enrollments?call_session_id=${call_two_id} now returns exactly 1 row and GET /call-sessions/${call_two_id} reports status == COMPLETED"
            - "the dependency is read at request time, not computed at call creation: the same call row served both outcomes"

      - name: cross_dependency_member_agency_gates_call_completion
        grounds:
          - validations[priority=12]
          - state_machines.CallSession.transitions.IN_PROGRESS_to_COMPLETED
          - entities.Member.fields.agency_id
          - errors.ERR_MEMBER_NOT_IN_AGENCY
        distinguishing_aspect: "A second, structurally different cross-entity pair, CallSession to Member: completing a call requires the member's agency to equal the agent's agency, so completion is refused with ERR_MEMBER_NOT_IN_AGENCY for a member of another agency while the drop edge on the same row still succeeds."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. Alpine agency with the full anchor chain, plus a second agency Cascade Health Partners and a member owned by that second agency."
            - "A scope and a call session exist for the foreign member, handled by Alpine's agent, and the call is connected and left IN_PROGRESS."
          setup_api_calls:
            - *d_clock
            - *d_agency
            - *d_carrier_a
            - *d_plan_a
            - *d_drug_a
            - *d_prov_a
            - *d_agent
            - *d_lic
            - *d_cert
            - *d_appt
            - *d_member
            - *d_member_two
            - &i_agency_other
              call: "POST /agencies"
              payload: { name: "Cascade Health Partners", service_center_code: "CAS-PDX-02", aep_start_date: "2026-10-15T00:00:00Z", aep_end_date: "2026-12-07T00:00:00Z", aep_daily_submission_capacity: 2, recording_retention_days: 2555, soa_retention_days: 3650, soa_max_age_days: 30, rapid_disenrollment_day_limit: 90 }
              as: PlatformAdmin
              captures: { other_agency_id: $.data.id }
            - &i_foreign_member
              call: "POST /members"
              payload: { agency_id: "${other_agency_id}", full_name: "Rosa Klein", medicare_beneficiary_id: "2FG5-UF6-NL83", date_of_birth: "1950-07-02T00:00:00Z", state_code: "TX", county_code: "TX-201", drug_list: [{ drug_name: "Lisinopril 10mg", rxcui: "314076", monthly_fills: 1 }], provider_npis: ["1000000001"] }
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { foreign_member_id: $.data.id, foreign_member_v1: $.data.version }
            - &i_foreign_soa
              call: "POST /scope-of-appointments"
              payload: { member_id: "${foreign_member_id}", agent_id: "${agent_id}", capture_channel: "TELEPHONIC_RECORDED", plan_types_authorized: ["MAPD"], captured_on: "2026-10-01T00:00:00Z", expected_member_version: "${foreign_member_v1}" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { foreign_soa_id: $.data.id }
            - &i_foreign_call
              call: "POST /call-sessions"
              payload: { agent_id: "${agent_id}", member_id: "${foreign_member_id}", scope_of_appointment_id: "${foreign_soa_id}", started_at: "2026-10-01T12:00:00Z", scheduled_end_at: "2026-10-01T12:30:00Z", recording_id: "REC-1004", disclaimer_script_code: "CMS-DISC-2026", disclaimer_delivered: true, marketing_rule_set_version: "MKT-2026-V3" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { foreign_call_id: $.data.id }
            - call: "POST /call-sessions/${foreign_call_id}/connect"
              payload: { disclaimer_delivered: true, plan_type_discussed: "MAPD", recording_id: "REC-1004", disclaimer_script_code: "CMS-DISC-2026", marketing_rule_set_version: "MKT-2026-V3" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
          trigger:
            - call: "POST /call-sessions/${foreign_call_id}/complete"
              payload: { recording_id: "REC-1004", disclaimer_delivered: true }
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { error_id: $.data.error_id }
            - call: "POST /call-sessions/${foreign_call_id}/drop"
              payload: { reason: "MEMBER_ROUTING_CORRECTED" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
          assert:
            - "the completion returns 422 and error_id == ERR_MEMBER_NOT_IN_AGENCY"
            - "GET /call-sessions/${foreign_call_id} after that refusal still reports status == IN_PROGRESS with actual_end_at null"
            - "the drop returns 200 and GET /call-sessions/${foreign_call_id} then reports status == DROPPED, so the cross-agency block is specific to completion and not to every terminal edge"
            - "GET /members/${foreign_member_id} reports agency_id == ${other_agency_id} while GET /agents/${agent_id} reports agency_id == ${agency_id}"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: overlap_half_open_live_call_interval_on_agent
        grounds:
          - validations[priority=10]
          - entities.CallSession.fields.scheduled_end_at
          - entities.CallSession.fields.started_at
          - errors.ERR_AGENT_HAS_ACTIVE_CALL
        distinguishing_aspect: "Half-open interval arithmetic on the Agent resource: a live call occupies [started_at, scheduled_end_at), so a second call opening at 09:59 collides and is refused with ERR_AGENT_HAS_ACTIVE_CALL while one opening at exactly 10:00 — the prior call's scheduled_end_at — is accepted, because adjacency is free under a half-open treatment."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T09:00:00Z; the shared anchor chain plus two members and two scopes."
            - "Call A of the agent occupies [09:00, 10:00) and is live."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T09:00:00Z" }
              as: PlatformAdmin
            - *d_agency
            - *d_carrier_a
            - *d_plan_a
            - *d_drug_a
            - *d_prov_a
            - *d_agent
            - *d_lic
            - *d_cert
            - *d_appt
            - *d_member
            - *d_member_two
            - *d_soa
            - *d_soa_two
            - &j_call_a
              call: "POST /call-sessions"
              payload: { agent_id: "${agent_id}", member_id: "${member_id}", scope_of_appointment_id: "${soa_id}", started_at: "2026-10-01T09:00:00Z", scheduled_end_at: "2026-10-01T10:00:00Z", recording_id: "REC-A", disclaimer_script_code: "CMS-DISC-2026", disclaimer_delivered: true, marketing_rule_set_version: "MKT-2026-V3" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { call_a_id: $.data.id }
            - call: "POST /call-sessions/${call_a_id}/connect"
              payload: { disclaimer_delivered: true, plan_type_discussed: "MAPD", recording_id: "REC-A", disclaimer_script_code: "CMS-DISC-2026", marketing_rule_set_version: "MKT-2026-V3" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
          trigger:
            - call: "POST /call-sessions"
              payload: { agent_id: "${agent_id}", member_id: "${member_two_id}", scope_of_appointment_id: "${soa_two_id}", started_at: "2026-10-01T09:59:00Z", scheduled_end_at: "2026-10-01T10:29:00Z", recording_id: "REC-B", disclaimer_script_code: "CMS-DISC-2026", disclaimer_delivered: true, marketing_rule_set_version: "MKT-2026-V3" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { error_id_overlap: $.data.error_id }
            - call: "POST /call-sessions"
              payload: { agent_id: "${agent_id}", member_id: "${member_two_id}", scope_of_appointment_id: "${soa_two_id}", started_at: "2026-10-01T10:00:00Z", scheduled_end_at: "2026-10-01T10:30:00Z", recording_id: "REC-B", disclaimer_script_code: "CMS-DISC-2026", disclaimer_delivered: true, marketing_rule_set_version: "MKT-2026-V3" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { call_b_id: $.data.id }
          assert:
            - "the 09:59 submission returns 409 with error_id_overlap == ERR_AGENT_HAS_ACTIVE_CALL"
            - "the 10:00 submission returns 201 because an interval that only touches at the prior call's scheduled_end_at does not overlap under a half-open treatment"
            - "GET /call-sessions/${call_a_id} still reports status == IN_PROGRESS with scheduled_end_at == 2026-10-01T10:00:00Z"
            - "GET /agents/${agent_id}/call-sessions returns exactly 2 rows, so the refused request created nothing"
            - "GET /call-sessions/${call_b_id} reports started_at == 2026-10-01T10:00:00Z, exactly the instant the first interval closed"

      - name: overlap_closed_buffered_scope_validity_window
        grounds:
          - calculations.soa_validity_window
          - validations[priority=6]
          - entities.ScopeOfAppointment.fields.expires_on
          - errors.ERR_SCOPE_OF_APPOINTMENT_MISSING
        distinguishing_aspect: "A closed, buffered treatment on the ScopeOfAppointment resource, deliberately different arithmetic from the half-open call interval: the usable window is [captured_on, captured_on plus 30 days] inclusive at BOTH ends, so a submission at exactly 2026-10-31T00:00:00Z is authorized while one second past that instant is refused — a closed window where the other overlap rule is half-open."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z; the shared anchor chain with a scope captured at 2026-10-01T00:00:00Z so expires_on is 2026-10-31T00:00:00Z, and a completed call session."
          setup_api_calls:
            - *d_clock
            - *d_agency
            - *d_carrier_a
            - *d_plan_a
            - *d_drug_a
            - *d_prov_a
            - *d_agent
            - *d_lic
            - *d_cert
            - *d_appt
            - *d_member
            - *d_member_two
            - *d_soa
            - *d_call
            - *d_connect
            - *d_complete
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-31T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /scope-of-appointments/${soa_id}"
              payload: {}
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { status_at_boundary: $.data.status, expires_at_boundary: $.data.expires_on }
            - call: "POST /enrollments"
              payload: { call_session_id: "${call_id}", member_id: "${member_id}", plan_id: "${plan_a_id}", agent_id: "${agent_id}", scope_of_appointment_id: "${soa_id}", effective_date: "2026-11-01T00:00:00Z", plan_type_discussed: "MAPD", expected_call_session_version: "${call_v1}" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { enrollment_at_boundary: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /call-sessions/${call_id}"
              payload: {}
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { call_v_late: $.data.version }
            - call: "POST /enrollments"
              payload: { call_session_id: "${call_id}", member_id: "${member_id}", plan_id: "${plan_a_id}", agent_id: "${agent_id}", scope_of_appointment_id: "${soa_id}", effective_date: "2026-11-01T00:00:00Z", plan_type_discussed: "MAPD", expected_call_session_version: "${call_v_late}" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { error_id_late: $.data.error_id }
          assert:
            - "at exactly expires_on 2026-10-31T00:00:00Z the scope reads status == CAPTURED with expires_on == 2026-10-31T00:00:00Z"
            - "the enrollment submitted at that same instant returns 201, so the closed window is inclusive at its far end"
            - "after the clock moves to 2026-11-01T00:00:00Z the same enrollment request returns 422 with error_id_late == ERR_SCOPE_OF_APPOINTMENT_MISSING"
            - "GET /scope-of-appointments/${soa_id} still reports status == CAPTURED even though it is past expires_on, so the row is retained and only its usability lapsed"
            - "ScopeOfAppointment.${soa_id}.retained_until == 2036-09-28T00:00:00Z, far beyond expires_on"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: invariant_reverse_then_reinstate_restores_commission_balance
        grounds:
          - calculations.commission_ledger_entry
          - entities.Agency.fields.commission_balance_cents
          - state_machines.CommissionLedgerEntry.transitions.REVERSED_to_PROVISIONAL
          - state_machines.CommissionLedgerEntry.transitions.PROVISIONAL_to_REVERSED
        distinguishing_aspect: "A conserved money quantity: Agency.commission_balance_cents is the sum of amount_cents over entries in {PROVISIONAL, FINALIZED}, so the reverse-then-reinstate pair on a PROVISIONAL entry must return it to exactly 5400.00 from 1800.00 — the two entries' magnitudes 3600.00 and 1800.00 are unchanged, and no ADJUSTMENT is minted to hide drift."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z; the shared anchor chain through &d_enroll, then acknowledged so the RENEWAL entry exists, then effectuated."
          setup_api_calls:
            - *d_clock
            - *d_agency
            - *d_carrier_a
            - *d_plan_a
            - *d_drug_a
            - *d_prov_a
            - *d_agent
            - *d_lic
            - *d_cert
            - *d_appt
            - *d_member
            - *d_member_two
            - *d_soa
            - *d_call
            - *d_connect
            - *d_complete
            - *d_enroll
            - call: "POST /enrollments/${enrollment_id}/acknowledge"
              payload: { carrier_id: "${carrier_a_id}" }
              as: CarrierIntegration
            - call: "POST /enrollments/${enrollment_id}/effectuate"
              payload: {}
              as: CarrierIntegration
            - call: "GET /commission-ledger-entries"
              payload: { enrollment_id: "${enrollment_id}" }
              as: DirectorOfSales
              captures: { entry_initial_id: "$.data[0].id", entry_renewal_id: "$.data[1].id" }
          trigger:
            - call: "POST /commission-ledger-entries/${entry_initial_id}/reverse"
              payload: { reason: "Carrier confirmed a duplicate INITIAL posting" }
              as: DirectorOfSales
            - call: "POST /commission-ledger-entries/${entry_initial_id}/reinstate"
              payload: {}
              as: DirectorOfSales
          assert:
            - "before the reversal GET /agencies/${agency_id} reports commission_balance_cents == 5400.00, the sum of the INITIAL 3600.00 and the RENEWAL 1800.00"
            - "after the reversal the balance is 1800.00 and the REVERSED INITIAL contributes 0 because its status is neither PROVISIONAL nor FINALIZED"
            - "after the reinstatement the balance is restored to exactly 5400.00 — the compensating pair leaves the conserved quantity unchanged"
            - "CommissionLedgerEntry.${entry_initial_id}.status == PROVISIONAL and amount_cents == 3600.00 after reinstatement"
            - "GET /corrections?enrollment_id=${enrollment_id} returns 0 rows, so the reversal did not silently mint an ADJUSTMENT"
            - "CommissionLedgerEntry.${entry_renewal_id}.amount_cents == 1800.00 and its status is unchanged by the whole pair"

      - name: invariant_rapid_disenrollment_decrements_book_size_once
        grounds:
          - calculations.agency_compliance_loss_ratio
          - entities.Plan.fields.enrolled_member_count
          - entities.Agent.fields.active_enrollment_count
          - state_machines.Enrollment.transitions.ENROLLED_to_RAPID_DISENROLLED
        distinguishing_aspect: "A conserved count quantity on a different subject: Plan.enrolled_member_count and Agent.active_enrollment_count both count rows whose disenrollment_status is ENROLLED, so one rapid disenrollment must decrement each of them exactly once and leave them at 0 while the loss ratio moves because one FINALIZED negative chargeback now sits over a live book of size 0."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z; the shared anchor chain through &d_enroll, acknowledged and effectuated, so the plan holds one ENROLLED member and the agency book size is 1."
          setup_api_calls:
            - *d_clock
            - *d_agency
            - *d_carrier_a
            - *d_plan_a
