scenario: "1923. Inpatient Pharmacy & IV Compounding Workflow (hospital inpatient pharmacy): order verification & clinical intervention documentation, dose rounding, renal adjustment & protocol dosing, USP 797/800 compounding record & beyond-use dating, hazardous drug handling & segregation, ADC (cabinet) restocking & discrepancy resolution, controlled-substance diversion monitoring, drug shortage substitution protocol, batch preparation & waste accounting"

domain_name: inpatient-pharmacy-iv-compounding
api_prefix: /pharmacy

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: StaffMember
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Staff member's legal name"
      - name: staff_role
        type: enum
        source: input
        description: "One of PRESCRIBER | PHARMACIST | TECHNICIAN | NURSE; must match X-User-Role header on calls made as this staff member"
        constraints: "enum {PRESCRIBER, PHARMACIST, TECHNICIAN, NURSE}"
      - name: hd_compounding_certified
        type: boolean
        source: input
        description: "USP 800 hazardous-drug compounding certification held"
        default: false
      - name: hd_cert_expires_at
        type: datetime
        source: input
        description: "HD certification expiry; null when hd_compounding_certified is false"
        default: null
      - name: active
        type: boolean
        source: system
        description: "Soft-deactivation flag; inactive staff may not act"
        default: true

  - name: PatientProfile
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Patient name"
      - name: date_of_birth
        type: datetime
        source: input
        description: "Date of birth (ISO8601 date); age computed against the logical clock"
      - name: sex
        type: enum
        source: input
        description: "Biological sex used by Cockcroft-Gault"
        constraints: "enum {M, F}"
      - name: height_cm
        type: number
        source: input
        description: "Height in centimeters"
      - name: weight_kg
        type: number
        source: input
        description: "Actual body weight in kilograms"
      - name: scr_mg_dl
        type: number
        source: input
        description: "Serum creatinine mg/dL"
      - name: allergy_drug_product_ids
        type: array
        source: input
        description: "Array of DrugProduct.id values this patient is allergic to"
        default: []
      - name: age_years
        type: integer
        source: computed
        description: "Floor years between date_of_birth and the logical clock; birthday counts on the date itself"
      - name: bmi
        type: number
        source: computed
        description: "weight_kg / (height_cm/100)^2, 2dp round_half_up"
      - name: ibw_kg
        type: number
        source: computed
        description: "Ideal body weight: male 50 + 2.3*(height_in - 60); female 45.5 + 2.3*(height_in - 60); 2dp round_half_up"
      - name: abw_kg
        type: number
        source: computed
        description: "Adjusted body weight IBW + 0.4*(weight_kg - IBW), 2dp; null when bmi < 30"
      - name: crcl_ibw_ml_min
        type: number
        source: computed
        description: "Cockcroft-Gault CrCl using ibw_kg, 2dp round_half_up"
      - name: crcl_abw_ml_min
        type: number
        source: computed
        description: "Cockcroft-Gault CrCl using abw_kg, 2dp; null when bmi < 30"

  - name: DrugProduct
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Generic drug name and strength label"
      - name: schedule
        type: enum
        source: input
        description: "CSA schedule"
        constraints: "enum {NON_CONTROLLED, C_II, C_III, C_IV, C_V}"
      - name: is_hazardous
        type: boolean
        source: input
        description: "USP 800 hazardous drug flag; drives HD hood/certification gating"
        default: false
      - name: concentration_mg_per_ml
        type: number
        source: input
        description: "Final concentration used to convert mg dose to mL volume"
      - name: vial_size_ml
        type: number
        source: input
        description: "Single-vial volume in mL used by batch yield calculation"
      - name: has_stability_data
        type: boolean
        source: input
        description: "True when manufacturer stability data supports extended BUD"
        default: false
      - name: stability_hours_room
        type: integer
        source: input
        description: "Stability-data hours at ROOM storage; null when no data"
        default: null
      - name: stability_hours_refrigerated
        type: integer
        source: input
        description: "Stability-data hours at REFRIGERATED storage; null when no data"
        default: null
      - name: stability_hours_frozen
        type: integer
        source: input
        description: "Stability-data hours at FROZEN storage; null when no data"
        default: null
      - name: renal_dosing_policy
        type: enum
        source: input
        description: "Which weight variant feeds Cockcroft-Gault at verification"
        default: IBW
        constraints: "enum {IBW, ABW_WHEN_OBESE}"
      - name: in_shortage
        type: boolean
        source: input
        description: "True while the drug is on the shortage list; gates protocol activation"
        default: false
      - name: status
        type: enum
        source: input
        description: "Formulary status"
        default: ACTIVE
        constraints: "enum {ACTIVE, DISCONTINUED}"

  - name: CompoundingHood
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Hood / biological safety cabinet identifier"
      - name: iso_class
        type: enum
        source: input
        description: "Cleanroom ISO class of the hood"
        constraints: "enum {ISO_5, ISO_7, ISO_8}"
      - name: is_hd_rated
        type: boolean
        source: input
        description: "True when the hood is rated for USP 800 hazardous compounding"
        default: false

  - name: HoodSession
    parent: null
    common_fields: true
    fields:
      - name: hood_id
        type: string
        source: input
        description: "FK -> CompoundingHood.id; the hood this session occupies"
      - name: start_at
        type: datetime
        source: input
        description: "Session window start (half-open, inclusive)"
      - name: end_at
        type: datetime
        source: input
        description: "Session window end (half-open, exclusive); must be > start_at"
      - name: status
        type: enum
        source: system
        description: "Session lifecycle"
        default: SCHEDULED
        constraints: "enum {SCHEDULED, IN_USE, COMPLETED, CANCELLED}"

  - name: CoverageShift
    parent: null
    common_fields: true
    fields:
      - name: staff_id
        type: string
        source: input
        description: "FK -> StaffMember.id; pharmacist covering the zone"
      - name: zone
        type: string
        source: input
        description: "Coverage zone label (e.g. CENTRAL, SATELLITE_ER)"
      - name: start_at
        type: datetime
        source: input
        description: "Coverage start (half-open, inclusive)"
      - name: end_at
        type: datetime
        source: input
        description: "Coverage end (half-open, exclusive); must be > start_at"

  - name: MedicationOrder
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> PatientProfile.id; ordering patient"
      - name: prescriber_staff_id
        type: string
        source: system
        description: "FK -> StaffMember.id; taken from X-User-ID of the creating Prescriber"
      - name: drug_product_id
        type: string
        source: input
        description: "FK -> DrugProduct.id; ordered drug (swapped by substitution)"
      - name: substituted_by_protocol_id
        type: string
        source: system
        description: "FK -> SubstitutionProtocol.id; set when a substitution was applied, else null"
        default: null
      - name: route
        type: enum
        source: input
        description: "Administration route; IV orders flow through compounding"
        constraints: "enum {IV, PO, IM}"
      - name: ordered_dose_mg
        type: number
        source: input
        description: "Ordered dose in mg per administration"
      - name: frequency_per_day
        type: integer
        source: input
        description: "Doses per day"
      - name: duration_days
        type: integer
        source: input
        description: "Therapy duration in days"
        default: 1
      - name: verification_status
        type: enum
        source: system
        description: "Parallel dimension 1 (clinical): PENDING -> VERIFIED <-> ON_HOLD review loop; terminal DISCONTINUED | SUPERSEDED"
        default: PENDING
        constraints: "enum {PENDING, VERIFIED, ON_HOLD, DISCONTINUED, SUPERSEDED}"
      - name: fulfillment_status
        type: enum
        source: system
        description: "Parallel dimension 2 (operational): NONE -> QUEUED -> COMPOUNDING -> READY -> DISPENSED -> ADMINISTERED; non-IV orders go straight to READY at verification"
        default: NONE
        constraints: "enum {NONE, QUEUED, COMPOUNDING, READY, DISPENSED, ADMINISTERED}"
      - name: substitution_pending
        type: boolean
        source: system
        description: "True when a shortage protocol activation flagged this order for substitution"
        default: false
      - name: crcl_used_ml_min
        type: number
        source: computed
        description: "CrCl value selected by the drug's renal_dosing_policy at verification; null until verified"
        default: null
      - name: renal_adjusted_dose_mg
        type: number
        source: computed
        description: "ordered_dose_mg * renal tier factor, 2dp round_half_up; null until verified"
        default: null
      - name: final_dose_ml
        type: number
        source: computed
        description: "renal_adjusted_dose_mg / drug concentration, rounded per dose_rounding step ladder; null until verified"
        default: null
      - name: discontinue_reason
        type: string
        source: input
        description: "Reason captured at discontinuation; null otherwise"
        default: null

  - name: ClinicalIntervention
    parent: null
    common_fields: false
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> MedicationOrder.id; order this intervention documents"
      - name: pharmacist_staff_id
        type: string
        source: system
        description: "FK -> StaffMember.id; taken from X-User-ID of the documenting Pharmacist"
      - name: intervention_type
        type: enum
        source: input
        description: "Intervention category"
        constraints: "enum {DOSE_CLARIFICATION, ALLERGY, RENAL, SHORTAGE, OTHER}"
      - name: note
        type: string
        source: input
        description: "Free-text clinical note"
      - name: placed_on_hold
        type: boolean
        source: input
        description: "When true, moves the order verification_status to ON_HOLD"
        default: false

  - name: CompoundingBatch
    parent: null
    common_fields: true
    fields:
      - name: hood_session_id
        type: string
        source: input
        description: "FK -> HoodSession.id; hood occupation covering this batch"
      - name: compounder_staff_id
        type: string
        source: system
        description: "FK -> StaffMember.id; taken from X-User-ID of the creating PharmacyTechnician"
      - name: qa_pharmacist_staff_id
        type: string
        source: system
        description: "FK -> StaffMember.id; set from X-User-ID at qa-release; null until released"
        default: null
      - name: usp_risk_level
        type: enum
        source: input
        description: "USP 797 compounding risk level driving default BUD"
        constraints: "enum {LOW, MEDIUM, HIGH}"
      - name: documents_stability_source
        type: boolean
        source: input
        description: "True when the batch record cites the stability source enabling extended BUD"
        default: false
      - name: status
        type: enum
        source: system
        description: "Batch lifecycle with rework cycle"
        default: DRAFT
        constraints: "enum {DRAFT, IN_PROGRESS, QA_REVIEW, RELEASED, REJECTED, CANCELLED, FAILED}"
      - name: rework_count
        type: integer
        source: system
        description: "Number of REJECTED -> DRAFT rework cycles completed; cap 2"
        default: 0
      - name: demand_ml
        type: number
        source: computed
        description: "Sum of per-preparation rounded dose volumes over non-cancelled preparations (dose_rounding)"
      - name: vials_used
        type: integer
        source: computed
        description: "ceil(demand_ml / vial_size_ml of the batch's first drug)"
      - name: total_drawn_ml
        type: number
        source: computed
        description: "Cumulative vials_used * vial_size_ml across all completions (rework adds)"
      - name: delivered_ml
        type: number
        source: computed
        description: "Sum of prepared_volume_ml over preparations currently QA_PASSED or DISPENSED"
      - name: waste_ml
        type: number
        source: computed
        description: "Cumulative recorded waste plus volume of WASTED preparations"
      - name: overage_pct
        type: number
        source: computed
        description: "(waste_ml of latest completion / total_drawn_ml of latest completion) * 100, 2dp round_half_up"

  - name: CompoundedPreparation
    parent: null
    common_fields: true
    fields:
      - name: batch_id
        type: string
        source: system
        description: "FK -> CompoundingBatch.id; owning batch"
      - name: order_id
        type: string
        source: system
        description: "FK -> MedicationOrder.id; order this preparation fulfills"
      - name: drug_product_id
        type: string
        source: system
        description: "FK -> DrugProduct.id; denormalized from the order at batch creation"
      - name: status
        type: enum
        source: system
        description: "Preparation lifecycle"
        default: PLANNED
        constraints: "enum {PLANNED, COMPOUNDED, QA_PASSED, DISPENSED, CANCELLED, WASTED, EXPIRED}"
      - name: prepared_volume_ml
        type: number
        source: input
        description: "Actual prepared volume recorded at batch completion; null until then"
        default: null
      - name: storage_condition
        type: enum
        source: input
        description: "Storage condition recorded at completion; drives BUD table row"
        default: null
        constraints: "enum {ROOM, REFRIGERATED, FROZEN}"
      - name: bud_expiry
        type: datetime
        source: computed
        description: "Beyond-use expiry computed at batch completion per beyond_use_dating; null until then"
        default: null

  - name: ADCStation
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Cabinet identifier"
      - name: zone
        type: string
        source: input
        description: "Physical zone the cabinet serves"

  - name: ADCPocket
    parent: null
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: input
        description: "FK -> ADCStation.id; cabinet owning this pocket"
      - name: drug_product_id
        type: string
        source: input
        description: "FK -> DrugProduct.id; single drug stocked in this pocket"
      - name: max_units
        type: integer
        source: input
        description: "Physical capacity in units; restock may not push on_hand above it"
      - name: on_hand_units
        type: integer
        source: system
        description: "Ledger-derived units on hand; equals chronological replay of InventoryEvent.units_delta"
        default: 0
      - name: status
        type: enum
        source: system
        description: "ACTIVE <-> QUARANTINED cycle"
        default: ACTIVE
        constraints: "enum {ACTIVE, QUARANTINED}"
      - name: pick_blocked
        type: boolean
        source: system
        description: "True while an ACTIVE substitution protocol blocks picking the shortage drug"
        default: false

  - name: InventoryEvent
    parent: null
    common_fields: false
    fields:
      - name: pocket_id
        type: string
        source: input
        description: "FK -> ADCPocket.id; pocket this event mutates"
      - name: order_id
        type: string
        source: input
        description: "FK -> MedicationOrder.id; set on DISPENSE/RETURN events tied to an order, else null"
        default: null
      - name: recorded_by_staff_id
        type: string
        source: system
        description: "FK -> StaffMember.id; taken from X-User-ID"
      - name: witness_staff_id
        type: string
        source: input
        description: "FK -> StaffMember.id; required on WASTE of C_II drugs; must differ from recorder"
        default: null
      - name: event_type
        type: enum
        source: system
        description: "Ledger event kind"
        constraints: "enum {RESTOCK, DISPENSE, RETURN, WASTE, COUNT, ADJUSTMENT}"
      - name: units_delta
        type: integer
        source: system
        description: "Signed unit change (+restock/return/adjustment-up, -dispense/waste, 0 for COUNT)"
      - name: observed_count_units
        type: integer
        source: input
        description: "Physical count recorded on COUNT events; null otherwise"
        default: null
      - name: expected_on_hand_after
        type: integer
        source: computed
        description: "Pocket on_hand_units immediately after applying this event"
      - name: occurred_at
        type: datetime
        source: system
        description: "Logical-clock timestamp when the event was recorded"

  - name: DiscrepancyCase
    parent: null
    common_fields: true
    fields:
      - name: pocket_id
        type: string
        source: system
        description: "FK -> ADCPocket.id; pocket whose count breached threshold"
      - name: variance_units
        type: integer
        source: system
        description: "physical_count - expected_on_hand at the triggering count"
      - name: status
        type: enum
        source: system
        description: "Case lifecycle"
        default: OPEN
        constraints: "enum {OPEN, INVESTIGATING, RESOLVED, ESCALATED}"
      - name: resolution
        type: enum
        source: input
        description: "FOUND_ERROR applies a compensating ADJUSTMENT; UNRESOLVED_ESCALATE escalates to diversion"
        default: null
        constraints: "enum {FOUND_ERROR, UNRESOLVED_ESCALATE}"
      - name: adjustment_units
        type: integer
        source: input
        description: "Signed correction applied to the ledger on FOUND_ERROR resolution"
        default: null
      - name: resolved_by_staff_id
        type: string
        source: system
        description: "FK -> StaffMember.id; pharmacist who resolved; null until resolved"
        default: null

  - name: DiversionCase
    parent: null
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: input
        description: "FK -> ADCStation.id; cabinet under review"
      - name: subject_staff_id
        type: string
        source: input
        description: "FK -> StaffMember.id; staff member under review"
      - name: source_discrepancy_case_id
        type: string
        source: input
        description: "FK -> DiscrepancyCase.id; set when opened via escalation, else null"
        default: null
      - name: reason
        type: string
        source: input
        description: "Opening rationale"
      - name: status
        type: enum
        source: system
        description: "Case lifecycle with branching adjudication"
        default: OPEN
        constraints: "enum {OPEN, UNDER_REVIEW, SUBSTANTIATED, CLOSED_UNSUBSTANTIATED}"
      - name: outcome_note
        type: string
        source: input
        description: "Adjudication note; null until adjudicated"
        default: null
      - name: opened_via
        type: enum
        source: system
        description: "Creation path"
        constraints: "enum {MANUAL, RISK_SCORE, ESCALATION}"

  - name: SubstitutionProtocol
    parent: null
    common_fields: true
    fields:
      - name: shortage_drug_product_id
        type: string
        source: input
        description: "FK -> DrugProduct.id; drug in shortage"
      - name: substitute_drug_product_id
        type: string
        source: input
        description: "FK -> DrugProduct.id; therapeutic equivalent used instead"
      - name: conversion_factor
        type: number
        source: input
        description: "Multiply ordered mg by this factor to get substitute mg"
      - name: min_dose_mg
        type: number
        source: input
        description: "Lower clamp on converted dose"
        default: 0
      - name: max_dose_mg
        type: number
        source: input
        description: "Upper clamp on converted dose"
      - name: expires_at
        type: datetime
        source: input
        description: "Protocol auto-expires when the logical clock reaches this instant"
      - name: status
        type: enum
        source: system
        description: "Protocol lifecycle"
        default: DRAFT
        constraints: "enum {DRAFT, ACTIVE, EXPIRED, REVOKED}"

  - name: WasteRecord
    parent: null
    common_fields: false
    fields:
      - name: batch_id
        type: string
        source: system
        description: "FK -> CompoundingBatch.id; set for compounding waste, null for ADC waste"
        default: null
      - name: pocket_id
        type: string
        source: input
        description: "FK -> ADCPocket.id; set for ADC waste, null for compounding waste"
        default: null
      - name: volume_ml
        type: number
        source: system
        description: "Wasted volume in mL for compounding waste; null for unit-based ADC waste"
        default: null
      - name: units
        type: integer
        source: system
        description: "Wasted units for ADC waste; null for compounding waste"
        default: null
      - name: reason
        type: string
        source: input
        description: "Waste reason (e.g. PARTIAL_VIAL, QA_REJECT, EXPIRED, CONTAMINATION)"
      - name: recorded_by_staff_id
        type: string
        source: system
        description: "FK -> StaffMember.id; taken from X-User-ID"
      - name: witness_staff_id
        type: string
        source: input
        description: "FK -> StaffMember.id; required when the wasted drug is C_II; must differ from recorder"
        default: null

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: MedicationOrder
    initial_state: "verification_status=PENDING, fulfillment_status=NONE"
    terminal_states: ["verification_status=DISCONTINUED", "verification_status=SUPERSEDED", "fulfillment_status=ADMINISTERED"]
    transitions:
      - from: "verification:PENDING"
        to: "verification:VERIFIED"
        trigger: "POST /pharmacy/medication-orders/{id}/verify"
        actor: Pharmacist
        preconditions:
          - "verification_status == PENDING"
          - "ordered drug NOT IN patient.allergy_drug_product_ids (else ERR_ALLERGY_CONFLICT)"
          - "ordered drug status == ACTIVE (else ERR_DRUG_DISCONTINUED)"
        side_effects:
          - "compute renal_dose_adjustment -> crcl_used_ml_min, renal_adjusted_dose_mg"
          - "compute final_dose_ml via dose_rounding step ladder"
          - "fulfillment_status: NONE -> READY when route != IV; NONE -> QUEUED when route == IV"
          - "increments MedicationOrder.version by 1"
      - from: "verification:PENDING"
        to: "verification:ON_HOLD"
        trigger: "POST /pharmacy/medication-orders/{id}/interventions with placed_on_hold=true"
        actor: Pharmacist
        preconditions:
          - "verification_status == PENDING"
        side_effects:
          - "ClinicalIntervention row appended"
      - from: "verification:VERIFIED"
        to: "verification:ON_HOLD"
        trigger: "POST /pharmacy/medication-orders/{id}/interventions with placed_on_hold=true"
        actor: Pharmacist
        preconditions:
          - "verification_status == VERIFIED"
        side_effects:
          - "ClinicalIntervention row appended"
      - from: "verification:ON_HOLD"
        to: "verification:VERIFIED"
        trigger: "POST /pharmacy/medication-orders/{id}/resume"
        actor: Pharmacist
        preconditions:
          - "verification_status == ON_HOLD"
          - "ordered drug NOT IN patient.allergy_drug_product_ids (else ERR_ALLERGY_CONFLICT)"
        side_effects:
          - "recompute renal_dose_adjustment and final_dose_ml (patient panel may have changed)"
          - "fulfillment_status: NONE -> QUEUED (IV) or READY (non-IV) when fulfillment was still NONE"
          - "increments MedicationOrder.version by 1"
      - from: "verification:PENDING | VERIFIED | ON_HOLD"
        to: "verification:DISCONTINUED"
        trigger: "POST /pharmacy/medication-orders/{id}/discontinue"
        actor: Prescriber
        preconditions:
          - "verification_status IN {PENDING, VERIFIED, ON_HOLD}"
          - "X-User-ID == order.prescriber_staff_id (else ERR_NOT_ORDER_PRESCRIBER)"
          - "fulfillment_status NOT IN {DISPENSED, ADMINISTERED} (else ERR_INVALID_STATE)"
        side_effects:
          - "discontinue_reason stored"
          - "cascade L1: CompoundedPreparation rows of this order with status IN {PLANNED, COMPOUNDED} -> CANCELLED"
          - "cascade L2: each affected batch recomputes demand_ml/vials_used via batch_yield_and_waste; a batch left with zero preparations in {PLANNED, COMPOUNDED, QA_PASSED} auto-transitions DRAFT|IN_PROGRESS -> CANCELLED"
          - "cascade L3: a batch cancelled by L2 cancels its HoodSession when session status IN {SCHEDULED, IN_USE} -> CANCELLED"
          - "increments MedicationOrder.version by 1"
      - from: "verification:PENDING | VERIFIED | ON_HOLD"
        to: "verification:SUPERSEDED"
        trigger: "system: POST /pharmacy/medication-orders creating a new order for the same (patient_id, drug_product_id)"
        actor: system
        preconditions:
          - "existing order verification_status IN {PENDING, VERIFIED, ON_HOLD} AND fulfillment_status NOT IN {DISPENSED, ADMINISTERED}"
        side_effects:
          - "same preparation/batch/hood cancellation cascade as discontinue (L1-L3)"
          - "increments superseded MedicationOrder.version by 1"
      - from: "fulfillment:QUEUED"
        to: "fulfillment:COMPOUNDING"
        trigger: "system: POST /pharmacy/batches including this order"
        actor: system
        preconditions:
          - "verification_status == VERIFIED"
          - "route == IV"
        side_effects:
          - "CompoundedPreparation row created with status PLANNED"
      - from: "fulfillment:COMPOUNDING"
        to: "fulfillment:READY"
        trigger: "system: POST /pharmacy/batches/{id}/qa-release of the owning batch"
        actor: system
        preconditions:
          - "linked preparation reached QA_PASSED"
        side_effects: []
      - from: "fulfillment:READY"
        to: "fulfillment:DISPENSED"
        trigger: "POST /pharmacy/adc-pockets/{id}/dispense"
        actor: Nurse
        preconditions:
          - "verification_status == VERIFIED (else ERR_ORDER_NOT_VERIFIED)"
          - "pocket.drug_product_id == order.drug_product_id (else ERR_DRUG_MISMATCH)"
          - "pocket.status == ACTIVE (else ERR_POCKET_QUARANTINED)"
          - "pocket.on_hand_units >= units (else ERR_INSUFFICIENT_STOCK)"
          - "route == IV => a linked preparation in QA_PASSED exists (else ERR_PREPARATION_NOT_QA_PASSED) and logical clock < preparation.bud_expiry (else ERR_BUD_EXPIRED)"
        side_effects:
          - "InventoryEvent DISPENSE appended (units_delta = -units)"
          - "pocket.on_hand_units -= units"
          - "linked QA_PASSED preparation -> DISPENSED"
          - "increments MedicationOrder.version by 1"
      - from: "fulfillment:DISPENSED"
        to: "fulfillment:ADMINISTERED"
        trigger: "POST /pharmacy/medication-orders/{id}/administer"
        actor: Nurse
        preconditions:
          - "fulfillment_status == DISPENSED"
        side_effects:
          - "increments MedicationOrder.version by 1"
      - from: "verification:VERIFIED"
        to: "verification:VERIFIED"
        trigger: "POST /pharmacy/medication-orders/{id}/substitute"
        actor: Pharmacist
        preconditions:
          - "verification_status == VERIFIED"
          - "substitution_pending == true (else ERR_SUBSTITUTION_NOT_PENDING)"
          - "protocol status == ACTIVE (else ERR_NO_ACTIVE_PROTOCOL)"
          - "protocol.shortage_drug_product_id == order.drug_product_id (else ERR_NO_ACTIVE_PROTOCOL)"
          - "substitute drug status == ACTIVE (else ERR_NO_ELIGIBLE_SUBSTITUTE)"
          - "substitute drug NOT IN patient.allergy_drug_product_ids (else ERR_ALLERGY_CONFLICT)"
          - "fulfillment_status IN {QUEUED, COMPOUNDING} (else ERR_INVALID_STATE)"
        side_effects:
          - "drug_product_id := protocol.substitute_drug_product_id"
          - "ordered_dose_mg := substitution_equivalent_dose result"
          - "substituted_by_protocol_id := protocol.id; substitution_pending := false"
          - "recompute renal_adjusted_dose_mg and final_dose_ml for the new drug"
          - "increments MedicationOrder.version by 1"

  - entity: CompoundingBatch
    initial_state: DRAFT
    terminal_states: [RELEASED, CANCELLED, FAILED]
    transitions:
      - from: DRAFT
        to: IN_PROGRESS
        trigger: "POST /pharmacy/batches/{id}/start"
        actor: PharmacyTechnician
        preconditions:
          - "status == DRAFT"
          - "hood_session.status == IN_USE (else ERR_HOOD_SESSION_NOT_ACTIVE)"
          - "any preparation drug is_hazardous => hood.is_hd_rated == true (else ERR_HOOD_NOT_HD_RATED)"
          - "any preparation drug is_hazardous => compounder.hd_compounding_certified == true AND hd_cert_expires_at > logical clock (else ERR_HD_CERTIFICATION_REQUIRED)"
          - "at least one preparation in PLANNED (else ERR_INVALID_STATE)"
        side_effects:
          - "increments CompoundingBatch.version by 1"
      - from: IN_PROGRESS
        to: QA_REVIEW
        trigger: "POST /pharmacy/batches/{id}/complete"
        actor: PharmacyTechnician
        preconditions:
          - "status == IN_PROGRESS"
          - "len(prepared_volumes_ml) == count of preparations in PLANNED (else ERR_INVALID_REQUEST)"
          - "waste_ml >= 0 (else ERR_INVALID_QUANTITY)"
        side_effects:
          - "preparations PLANNED -> COMPOUNDED with prepared_volume_ml and storage_condition recorded"
          - "compute batch_yield_and_waste (demand_ml, vials_used, total_drawn_ml, waste_ml, overage_pct)"
          - "compute beyond_use_dating per preparation -> bud_expiry"
          - "WasteRecord row appended for compounding waste (batch_id set, volume_ml = recorded waste)"
          - "increments CompoundingBatch.version by 1"
      - from: QA_REVIEW
        to: RELEASED
        trigger: "POST /pharmacy/batches/{id}/qa-release"
        actor: Pharmacist
        preconditions:
          - "status == QA_REVIEW"
          - "X-User-ID != batch.compounder_staff_id (segregation of duties, else ERR_SOD_VIOLATION)"
          - "overage_pct <= waste tolerance of the batch's size tier (else ERR_WASTE_TOLERANCE_EXCEEDED)"
        side_effects:
          - "preparations COMPOUNDED -> QA_PASSED"
          - "orders with fulfillment COMPOUNDING -> READY"
          - "qa_pharmacist_staff_id := X-User-ID"
          - "increments CompoundingBatch.version by 1"
      - from: QA_REVIEW
        to: REJECTED
        trigger: "POST /pharmacy/batches/{id}/qa-reject"
        actor: Pharmacist
        preconditions:
          - "status == QA_REVIEW"
          - "X-User-ID != batch.compounder_staff_id (segregation of duties, else ERR_SOD_VIOLATION)"
        side_effects:
          - "preparations COMPOUNDED -> WASTED; their prepared_volume_ml is added to batch waste_ml"
          - "WasteRecord appended with reason QA_REJECT"
          - "increments CompoundingBatch.version by 1"
      - from: REJECTED
        to: DRAFT
        trigger: "POST /pharmacy/batches/{id}/rework"
        actor: PharmacyTechnician
        preconditions:
          - "status == REJECTED"
          - "rework_count < 2 (at rework_count == 2 the same call instead transitions to FAILED)"
        side_effects:
          - "rework_count += 1"
          - "new PLANNED preparations created for linked orders still VERIFIED; preparations of discontinued/superseded orders stay CANCELLED/WASTED"
          - "increments CompoundingBatch.version by 1"
      - from: REJECTED
        to: FAILED
        trigger: "POST /pharmacy/batches/{id}/rework when rework_count == 2"
        actor: PharmacyTechnician
        preconditions:
          - "status == REJECTED"
          - "rework_count == 2"
        side_effects:
          - "returns 200 with status FAILED (terminal; rework cap reached)"
      - from: "DRAFT | IN_PROGRESS"
        to: CANCELLED
        trigger: "system: order discontinue/supersede cascade removed the last preparation in {PLANNED, COMPOUNDED, QA_PASSED}"
        actor: system
        preconditions:
          - "zero preparations remain in {PLANNED, COMPOUNDED, QA_PASSED}"
        side_effects:
          - "hood session of this batch with status IN {SCHEDULED, IN_USE} -> CANCELLED"

  - entity: CompoundedPreparation
    initial_state: PLANNED
    terminal_states: [DISPENSED, WASTED, CANCELLED, EXPIRED]
    transitions:
      - from: PLANNED
        to: COMPOUNDED
        trigger: "system: POST /pharmacy/batches/{id}/complete"
        actor: system
        preconditions: []
        side_effects:
          - "bud_expiry computed via beyond_use_dating"
      - from: COMPOUNDED
        to: QA_PASSED
        trigger: "system: POST /pharmacy/batches/{id}/qa-release"
        actor: system
        preconditions: []
        side_effects: []
      - from: COMPOUNDED
        to: WASTED
        trigger: "system: POST /pharmacy/batches/{id}/qa-reject"
        actor: system
        preconditions: []
        side_effects:
          - "prepared_volume_ml added to batch waste_ml"
      - from: QA_PASSED
        to: DISPENSED
        trigger: "system: POST /pharmacy/adc-pockets/{id}/dispense for the linked order"
        actor: system
        preconditions:
          - "logical clock < bud_expiry (else ERR_BUD_EXPIRED on the dispense call)"
        side_effects: []
      - from: "PLANNED | COMPOUNDED"
        to: CANCELLED
        trigger: "system: order discontinue/supersede cascade"
        actor: system
        preconditions: []
        side_effects:
          - "triggers owning batch demand recompute (batch_yield_and_waste)"
      - from: "COMPOUNDED | QA_PASSED"
        to: EXPIRED
        trigger: "system: logical clock reaches or passes bud_expiry (sweep runs on POST /pharmacy/_clock/set_current_utc and is evaluated before any dispense)"
        actor: system
        preconditions:
          - "logical clock >= bud_expiry"
        side_effects:
          - "WasteRecord appended with reason EXPIRED"

  - entity: HoodSession
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_USE
        trigger: "POST /pharmacy/hood-sessions/{id}/start"
        actor: PharmacyTechnician
        preconditions:
          - "status == SCHEDULED"
          - "logical clock IN [start_at, end_at) (else ERR_HOOD_SESSION_OUTSIDE_WINDOW)"
        side_effects:
          - "increments HoodSession.version by 1"
      - from: IN_USE
        to: COMPLETED
        trigger: "POST /pharmacy/hood-sessions/{id}/complete"
        actor: PharmacyTechnician
        preconditions:
          - "status == IN_USE"
        side_effects: []
      - from: "SCHEDULED | IN_USE"
        to: CANCELLED
        trigger: "POST /pharmacy/hood-sessions/{id}/cancel or system cascade from batch cancellation"
        actor: PharmacyTechnician | system
        preconditions:
          - "status IN {SCHEDULED, IN_USE}"
        side_effects: []

  - entity: ADCPocket
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: QUARANTINED
        trigger: "POST /pharmacy/adc-pockets/{id}/quarantine"
        actor: Pharmacist
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "increments ADCPocket.version by 1"
      - from: QUARANTINED
        to: ACTIVE
        trigger: "POST /pharmacy/adc-pockets/{id}/release-quarantine"
        actor: Pharmacist
        preconditions:
          - "status == QUARANTINED"
        side_effects:
          - "increments ADCPocket.version by 1"

  - entity: DiscrepancyCase
    initial_state: OPEN
    terminal_states: [RESOLVED, ESCALATED]
    transitions:
      - from: OPEN
        to: INVESTIGATING
        trigger: "POST /pharmacy/discrepancy-cases/{id}/investigate"
        actor: Pharmacist
        preconditions:
          - "status == OPEN"
        side_effects:
          - "increments DiscrepancyCase.version by 1"
      - from: INVESTIGATING
        to: RESOLVED
        trigger: "POST /pharmacy/discrepancy-cases/{id}/resolve with resolution=FOUND_ERROR"
        actor: Pharmacist
        preconditions:
          - "status == INVESTIGATING"
          - "adjustment_units present and != 0 (else ERR_INVALID_REQUEST)"
        side_effects:
          - "InventoryEvent ADJUSTMENT appended (units_delta = adjustment_units); pocket.on_hand_units += adjustment_units"
          - "resolved_by_staff_id := X-User-ID"
          - "increments DiscrepancyCase.version by 1 and ADCPocket.version by 1"
      - from: INVESTIGATING
        to: ESCALATED
        trigger: "POST /pharmacy/discrepancy-cases/{id}/resolve with resolution=UNRESOLVED_ESCALATE"
        actor: Pharmacist
        preconditions:
          - "status == INVESTIGATING"
          - "subject_staff_id present (else ERR_INVALID_REQUEST)"
        side_effects:
          - "cross-entity: DiversionCase auto-created (status OPEN, opened_via ESCALATION, station from pocket, source_discrepancy_case_id = this case)"
          - "resolved_by_staff_id := X-User-ID"
          - "increments DiscrepancyCase.version by 1"

  - entity: DiversionCase
    initial_state: OPEN
    terminal_states: [SUBSTANTIATED, CLOSED_UNSUBSTANTIATED]
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "POST /pharmacy/diversion-cases/{id}/review"
        actor: DiversionOfficer
        preconditions:
          - "status == OPEN"
        side_effects:
          - "increments DiversionCase.version by 1"
      - from: UNDER_REVIEW
        to: SUBSTANTIATED
        trigger: "POST /pharmacy/diversion-cases/{id}/adjudicate with outcome=SUBSTANTIATED"
        actor: DiversionOfficer
        preconditions:
          - "status == UNDER_REVIEW"
        side_effects:
          - "outcome_note stored"
      - from: UNDER_REVIEW
        to: CLOSED_UNSUBSTANTIATED
        trigger: "POST /pharmacy/diversion-cases/{id}/adjudicate with outcome=CLOSED_UNSUBSTANTIATED"
        actor: DiversionOfficer
        preconditions:
          - "status == UNDER_REVIEW"
        side_effects:
          - "outcome_note stored"

  - entity: SubstitutionProtocol
    initial_state: DRAFT
    terminal_states: [EXPIRED, REVOKED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /pharmacy/substitution-protocols/{id}/activate"
        actor: PharmacyAdmin
        preconditions:
          - "status == DRAFT"
          - "shortage drug in_shortage == true (else ERR_DRUG_NOT_IN_SHORTAGE)"
          - "substitute drug status == ACTIVE (else ERR_NO_ELIGIBLE_SUBSTITUTE)"
          - "logical clock < expires_at (else ERR_PROTOCOL_EXPIRED)"
        side_effects:
          - "cascade L1: MedicationOrder rows with drug_product_id == shortage drug, verification_status IN {PENDING, VERIFIED, ON_HOLD}, fulfillment_status NOT IN {DISPENSED, ADMINISTERED} -> substitution_pending := true (each order.version + 1)"
          - "cascade L2: ADCPocket rows with drug_product_id == shortage drug -> pick_blocked := true (each pocket.version + 1)"
          - "increments SubstitutionProtocol.version by 1"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /pharmacy/substitution-protocols/{id}/revoke"
        actor: PharmacyAdmin
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "compensation: orders flagged by this protocol with substitution_pending == true AND substituted_by_protocol_id IS NULL -> substitution_pending := false"
          - "pockets blocked by this protocol -> pick_blocked := false"
          - "increments SubstitutionProtocol.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: logical clock >= expires_at (sweep on POST /pharmacy/_clock/set_current_utc)"
        actor: system
        preconditions:
          - "status == ACTIVE AND logical clock >= expires_at"
        side_effects:
          - "same compensation cascade as revoke (unflag orders, unblock pockets)"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: order-create-stale-patient-version
    parent_entity: PatientProfile
    write_endpoint: "POST /pharmacy/medication-orders"
    occ_field: "expected_patient_version"
    description: |
      Creating a MedicationOrder against a PatientProfile whose version has
      advanced since the client last observed it is rejected. A successful
      create supersedes the patient's prior open order for the same drug and
      bumps the patient's version, so a second create carrying the pre-supersede
      version is acting on a stale view even though the business state still
      permits a new order.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: pocket-restock-stale-version
    parent_entity: ADCPocket
    write_endpoint: "POST /pharmacy/adc-pockets/{id}/restock"
    occ_field: "expected_pocket_version"
    description: |
      Restocking an ADCPocket whose version has advanced since the client last
      observed it is rejected. Restock is otherwise always legitimate on an
      ACTIVE pocket, so the only grounds for rejection is that another ledger
      mutation (restock, dispense, return, waste, adjustment) changed
      on_hand_units after the client's physical count observation.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: renal_dose_adjustment
    trigger: "POST /pharmacy/medication-orders/{id}/verify, POST /pharmacy/medication-orders/{id}/resume, POST /pharmacy/medication-orders/{id}/substitute"
    algorithm: threshold
    formula: |
      age = floor_years(patient.date_of_birth, clock_now)   # birthday counts on the date itself
      height_in = patient.height_cm / 2.54
      ibw = (sex == M) ? 50 + 2.3*(height_in - 60) : 45.5 + 2.3*(height_in - 60)   # 2dp round_half_up
      bmi = patient.weight_kg / (patient.height_cm/100)^2                          # 2dp round_half_up
      if drug.renal_dosing_policy == IBW: weight_used = ibw
      if drug.renal_dosing_policy == ABW_WHEN_OBESE:
          weight_used = (bmi >= 30) ? ibw + 0.4*(patient.weight_kg - ibw) : patient.weight_kg   # abw 2dp
      crcl = ((140 - age) * weight_used * (sex == F ? 0.85 : 1.0)) / (72 * patient.scr_mg_dl)   # 2dp round_half_up
      tier factor on ROUNDED crcl:
        crcl >= 50          -> 1.00
        30 <= crcl < 50     -> 0.75
        10 <= crcl < 30     -> 0.50
        crcl < 10           -> 0.25
      renal_adjusted_dose_mg = round2_half_up(order.ordered_dose_mg * factor)
      order.crcl_used_ml_min = crcl
    input_set: "MedicationOrder being verified; its PatientProfile; its DrugProduct"
    constants:
      RENAL_TIER_FULL: 50
      RENAL_TIER_MID: 30
      RENAL_TIER_LOW: 10
      OBESITY_BMI: 30
    precision: "2 decimal places, round_half_up"
    variants:
      - name: ibw_variant
        when: "drug.renal_dosing_policy == IBW"
        difference: "weight_used = ibw_kg regardless of BMI"
      - name: abw_variant
        when: "drug.renal_dosing_policy == ABW_WHEN_OBESE and patient bmi >= 30"
        difference: "weight_used = abw_kg = ibw + 0.4*(actual - ibw); identical inputs yield a higher CrCl and potentially a higher tier"

  - name: dose_rounding
    trigger: "verification (final_dose_ml), substitution_equivalent_dose, batch_yield_and_waste per-preparation volumes"
    algorithm: aggregation
    formula: |
      step(v) = 0.1 when v < 1; 0.5 when 1 <= v <= 10; 1.0 when v > 10
      round_to_step(v) = round_half_up(v / step(v)) * step(v)
      POLICY (pinned order): round EACH component volume to its step FIRST, THEN sum.
      Sum-then-round is explicitly NOT the policy and yields different results.
      final_dose_ml = round_to_step(renal_adjusted_dose_mg / drug.concentration_mg_per_ml)
    input_set: "per-preparation raw volumes (dose_mg / concentration_mg_per_ml)"
    constants:
      STEP_SMALL: 0.1
      STEP_MID: 0.5
      STEP_LARGE: 1.0
      BAND_MID_MIN: 1.0
      BAND_LARGE_MIN: 10.0
    precision: "volume rounded to step via round_half_up; sums exact to 1dp"
    variants: []

  - name: beyond_use_dating
    trigger: "POST /pharmacy/batches/{id}/complete (per preparation)"
    algorithm: threshold
    formula: |
      base table (hours), keyed by batch.usp_risk_level x preparation.storage_condition:
        LOW:    ROOM 48,  REFRIGERATED 336, FROZEN 1080
        MEDIUM: ROOM 30,  REFRIGERATED 216, FROZEN 1080
        HIGH:   ROOM 24,  REFRIGERATED 72,  FROZEN 1080
      default variant: bud_hours = table value
      stability_extended variant: when drug.has_stability_data == true AND
        batch.documents_stability_source == true AND the drug's stability_hours for the
        storage condition is not null:
          bud_hours = min(stability_hours_for_condition, MAX_EXTENSION_HOURS)
      bud_expiry = completed_at (logical clock at completion) + bud_hours hours
      A preparation is expired when logical clock >= bud_expiry (inclusive boundary).
    input_set: "CompoundedPreparation rows of the completing batch; batch usp_risk_level and documents_stability_source; each drug's stability data"
    constants:
      MAX_EXTENSION_HOURS: 720
      LOW_ROOM_H: 48
      LOW_FRIDGE_H: 336
      LOW_FROZEN_H: 1080
      MED_ROOM_H: 30
      MED_FRIDGE_H: 216
      MED_FROZEN_H: 1080
      HIGH_ROOM_H: 24
      HIGH_FRIDGE_H: 72
      HIGH_FROZEN_H: 1080
    precision: "whole hours; bud_expiry stored as ISO8601 UTC"
    variants:
      - name: default_usp_table
        when: "drug.has_stability_data == false OR batch.documents_stability_source == false"
        difference: "BUD straight from the USP 797 risk-level table"
      - name: stability_extended
        when: "drug.has_stability_data == true AND batch.documents_stability_source == true"
        difference: "BUD from manufacturer stability hours capped at 720h; identical completion time yields a later expiry than the table variant"

  - name: batch_yield_and_waste
    trigger: "POST /pharmacy/batches/{id}/complete; recompute on order discontinue/supersede cascade and on rework"
    algorithm: constraint_propagation
    formula: |
      EVALUATION ORDER IS PINNED (circular-looking dependency resolved top-down):
      (1) demand_ml = SUM over preparations in {PLANNED, COMPOUNDED} of
          round_to_step(order.renal_adjusted_dose_mg / drug.concentration_mg_per_ml)
          -- per-component rounding per dose_rounding, THEN sum
      (2) vials_used = ceil(demand_ml / drug.vial_size_ml)
      (3) total_drawn_ml_this_run = vials_used * drug.vial_size_ml
      (4) waste_ml_this_run = recorded waste_ml input + 0
      (5) overage_pct = round2_half_up(waste_ml_this_run / total_drawn_ml_this_run * 100)
      (6) size tier from total_drawn_ml_this_run AFTER step 3:
            total < 25          -> SMALL  (tolerance 60%)
            25 <= total <= 100  -> MEDIUM (tolerance 30%)
            total > 100         -> LARGE  (tolerance 10%)
          Re-evaluating vials_used against the tier is FORBIDDEN.
      Batch lifetime accumulators: total_drawn_ml and waste_ml SUM across all completions
      (rework runs add); delivered_ml = SUM of prepared_volume_ml over preparations
      currently in {QA_PASSED, DISPENSED}.
      INVARIANT: total_drawn_ml == delivered_ml + waste_ml at every observable read.
    input_set: "the batch's non-cancelled preparations and their orders/drugs; waste_ml input at completion"
    constants:
      TIER_SMALL_MAX: 25
      TIER_MEDIUM_MAX: 100
      TOL_SMALL_PCT: 60
      TOL_MEDIUM_PCT: 30
      TOL_LARGE_PCT: 10
      MAX_REWORK: 2
    precision: "2 decimal places, round_half_up"
    variants: []

  - name: diversion_risk_score
    trigger: "POST /pharmacy/diversion-risk/evaluate"
    algorithm: weighted_scoring
    formula: |
      window = InventoryEvent rows with pocket.station_id == input station,
        recorded_by_staff_id == subject, drug schedule from pocket's drug,
        occurred_at IN [now - 30 days, now] (both bounds inclusive)
      v = SUM over COUNT events of abs(observed_count_units - expected_on_hand_after_before_count)
        -- i.e. abs variance recorded by the count; here expected_on_hand_after == on_hand at count time
      z = v / VARIANCE_DIVISOR
      w = count of WASTE events in window on pockets whose drug is controlled (schedule != NON_CONTROLLED)
      a = count of ALL events in window with hour(occurred_at) < 6 OR >= 22 (UTC)
      raw = W_VARIANCE*z + W_WASTE*w + W_AFTER_HOURS*a
      if any single COUNT in window has abs(variance) >= HARD_VARIANCE_TRIGGER and drug == C_II:
          raw = max(raw, ESCALATION_FLOOR)
      if drug.schedule == C_II: raw = raw * C_II_MULTIPLIER
      score = round2_half_up(raw)
      tier: score >= 75 -> OPEN_CASE ; 50 <= score < 75 -> WATCH ; else CLEAR
      OPEN_CASE auto-creates a DiversionCase (opened_via = RISK_SCORE, status OPEN).
    input_set: "InventoryEvent ledger for (station, subject staff) over the trailing 30 days inclusive"
    constants:
      WINDOW_DAYS: 30
      VARIANCE_DIVISOR: 2
      W_VARIANCE: 10
      W_WASTE: 5
      W_AFTER_HOURS: 3
      C_II_MULTIPLIER: 1.5
      HARD_VARIANCE_TRIGGER: 10
      ESCALATION_FLOOR: 80
      OPEN_CASE_THRESHOLD: 75
      WATCH_THRESHOLD: 50
      AFTER_HOURS_START: 22
      AFTER_HOURS_END: 6
    precision: "2 decimal places, round_half_up"
    variants: []

  - name: substitution_equivalent_dose
    trigger: "POST /pharmacy/medication-orders/{id}/substitute"
    algorithm: aggregation
    formula: |
      raw_mg = order.ordered_dose_mg * protocol.conversion_factor
      stepped_mg = round_to_step(raw_mg)   # same step ladder as dose_rounding, applied to mg
      equivalent_mg = clamp(stepped_mg, protocol.min_dose_mg, protocol.max_dose_mg)
      order.ordered_dose_mg := equivalent_mg
    input_set: "the order being substituted and the ACTIVE SubstitutionProtocol"
    constants: {}
    precision: "step rounding via round_half_up, then clamp"
    variants: []

  - name: adc_expected_on_hand
    trigger: "every pocket mutation (restock/dispense/return/waste/adjustment) and POST /pharmacy/adc-pockets/{id}/count"
    algorithm: chronological
    formula: |
      expected_on_hand = replay of InventoryEvent.units_delta in occurred_at ASC order
        (tie-break: created_at ASC) starting from 0
      RESTOCK +u | DISPENSE -u | RETURN +u | WASTE -u | ADJUSTMENT +/-u | COUNT 0
      ADCPocket.on_hand_units MUST equal this replay after every mutation.
      On COUNT: variance = observed_count_units - expected_on_hand
      if abs(variance) >= threshold -> open DiscrepancyCase (OPEN)
      threshold: drug.schedule == C_II -> 2 ; otherwise -> 5
    input_set: "all InventoryEvent rows for the pocket"
    constants:
      DISCREPANCY_THRESHOLD_CII: 2
      DISCREPANCY_THRESHOLD_OTHER: 5
    precision: "integer units"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role is permitted to call this endpoint per the RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "For entity-backed roles, the StaffMember row with id == X-User-ID exists, is active, and its staff_role matches X-User-Role"
    error_id: ERR_ROLE_MISMATCH
    http_status: 403
    applies_to: "all endpoints called as Prescriber | Pharmacist | PharmacyTechnician | Nurse"
  - priority: 4
    category: existence
    check: "Request body is well-formed: required fields present, types valid, enum values in range"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 5
    category: existence
    check: "Path-template ids resolve to existing resources, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all with path ids"
  - priority: 6
    category: existence
    check: "Body-referenced FK ids exist (patient_id, drug_product_id, hood_id, protocol_id, witness_staff_id, subject_staff_id, ...)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "endpoints with FK body fields"
  - priority: 7
    category: state
    check: "OCC: expected_<parent>_version matches the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /pharmacy/medication-orders; POST /pharmacy/adc-pockets/{id}/restock"
  - priority: 8
    category: state
    check: "Target resource is not in a terminal state for this operation"
    error_id: ERR_ORDER_ALREADY_TERMINAL
    http_status: 409
    applies_to: "MedicationOrder mutations when verification IN {DISCONTINUED, SUPERSEDED} or fulfillment == ADMINISTERED"
  - priority: 9
    category: state
    check: "State-machine from-state matches the transition being attempted"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 10
    category: business_safety
    check: "Allergy screen: ordered (or substitute) drug not in patient.allergy_drug_product_ids"
    error_id: ERR_ALLERGY_CONFLICT
    http_status: 422
    applies_to: "POST /pharmacy/medication-orders/{id}/verify; POST /pharmacy/medication-orders/{id}/resume; POST /pharmacy/medication-orders/{id}/substitute"
  - priority: 11
    category: business_safety
    check: "Hazardous compounding: hood is_hd_rated and compounder HD-certified with hd_cert_expires_at > clock"
    error_id: ERR_HD_CERTIFICATION_REQUIRED
    http_status: 422
    applies_to: "POST /pharmacy/batches/{id}/start"
  - priority: 12
    category: business_safety
    check: "Hazardous compounding: hood rating for HD batches"
    error_id: ERR_HOOD_NOT_HD_RATED
    http_status: 422
    applies_to: "POST /pharmacy/batches/{id}/start"
  - priority: 13
    category: business_safety
    check: "C_II waste requires witness_staff_id present"
    error_id: ERR_WITNESS_REQUIRED
    http_status: 422
    applies_to: "POST /pharmacy/adc-pockets/{id}/waste"
  - priority: 14
    category: business_safety
    check: "Waste witness must differ from recorder (segregation of duties)"
    error_id: ERR_WITNESS_SELF_FORBIDDEN
    http_status: 422
    applies_to: "POST /pharmacy/adc-pockets/{id}/waste"
  - priority: 15
    category: business_safety
    check: "QA release/reject must not be performed by the batch compounder (segregation of duties)"
    error_id: ERR_SOD_VIOLATION
    http_status: 403
    applies_to: "POST /pharmacy/batches/{id}/qa-release; POST /pharmacy/batches/{id}/qa-reject"
  - priority: 16
    category: business_safety
    check: "Only the ordering prescriber may discontinue the order"
    error_id: ERR_NOT_ORDER_PRESCRIBER
    http_status: 403
    applies_to: "POST /pharmacy/medication-orders/{id}/discontinue"
  - priority: 17
    category: business_constraint
    check: "Numeric quantities within domain bounds: units >= 1 on restock/dispense/return/waste; waste_ml >= 0; end_at > start_at"
    error_id: ERR_INVALID_QUANTITY
    http_status: 400
    applies_to: "pocket mutation endpoints; batch complete; hood-sessions; coverage-shifts"
  - priority: 18
    category: business_constraint
    check: "Hood temporal overlap: no two sessions on the same hood with status IN {SCHEDULED, IN_USE} may have overlapping half-open [start_at, end_at) intervals; adjacency (start == other end) is allowed"
    error_id: ERR_HOOD_OVERLAP
    http_status: 409
    applies_to: "POST /pharmacy/hood-sessions"
  - priority: 19
    category: business_constraint
    check: "Coverage aggregate capacity: at most 2 CoverageShift rows per zone may overlap at any instant (half-open intervals); a new shift creating a 3-way overlap is rejected"
    error_id: ERR_COVERAGE_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /pharmacy/coverage-shifts"
  - priority: 20
    category: business_constraint
    check: "Pocket capacity: on_hand_units + units <= max_units"
    error_id: ERR_POCKET_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /pharmacy/adc-pockets/{id}/restock"
  - priority: 21
    category: business_constraint
    check: "Pocket stock: on_hand_units >= units"
    error_id: ERR_INSUFFICIENT_STOCK
    http_status: 422
    applies_to: "POST /pharmacy/adc-pockets/{id}/dispense; POST /pharmacy/adc-pockets/{id}/waste"
  - priority: 22
    category: business_constraint
    check: "Dispense drug must match pocket drug"
    error_id: ERR_DRUG_MISMATCH
    http_status: 422
    applies_to: "POST /pharmacy/adc-pockets/{id}/dispense; POST /pharmacy/adc-pockets/{id}/return"
  - priority: 23
    category: business_constraint
    check: "Batch waste overage within size-tier tolerance at QA release"
    error_id: ERR_WASTE_TOLERANCE_EXCEEDED
    http_status: 422
    applies_to: "POST /pharmacy/batches/{id}/qa-release"
  - priority: 24
    category: business_temporal
    check: "Hood session start only inside [start_at, end_at) at the logical clock"
    error_id: ERR_HOOD_SESSION_OUTSIDE_WINDOW
    http_status: 422
    applies_to: "POST /pharmacy/hood-sessions/{id}/start"
  - priority: 25
    category: business_temporal
    check: "Hood session must be IN_USE before batch start"
    error_id: ERR_HOOD_SESSION_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /pharmacy/batches/{id}/start"
  - priority: 26
    category: business_temporal
    check: "Preparation not expired: logical clock < bud_expiry (clock >= bud_expiry fails; boundary is inclusive-expired)"
    error_id: ERR_BUD_EXPIRED
    http_status: 422
    applies_to: "POST /pharmacy/adc-pockets/{id}/dispense"
  - priority: 27
    category: business_temporal
    check: "Protocol activation before its expires_at"
    error_id: ERR_PROTOCOL_EXPIRED
    http_status: 422
    applies_to: "POST /pharmacy/substitution-protocols/{id}/activate"
  - priority: 28
    category: business_referential
    check: "Order must be VERIFIED for dispensing and batch inclusion"
    error_id: ERR_ORDER_NOT_VERIFIED
    http_status: 422
    applies_to: "POST /pharmacy/adc-pockets/{id}/dispense; POST /pharmacy/batches"
  - priority: 29
    category: business_referential
    check: "IV dispense requires a linked preparation in QA_PASSED"
    error_id: ERR_PREPARATION_NOT_QA_PASSED
    http_status: 422
    applies_to: "POST /pharmacy/adc-pockets/{id}/dispense"
  - priority: 30
    category: business_referential
    check: "Pocket must be ACTIVE (not QUARANTINED) for dispense"
    error_id: ERR_POCKET_QUARANTINED
    http_status: 409
    applies_to: "POST /pharmacy/adc-pockets/{id}/dispense"
  - priority: 31
    category: business_referential
    check: "Ordered drug formulary status must be ACTIVE at verification"
    error_id: ERR_DRUG_DISCONTINUED
    http_status: 422
    applies_to: "POST /pharmacy/medication-orders/{id}/verify"
  - priority: 32
    category: business_referential
    check: "Order must be flagged substitution_pending before substitution"
    error_id: ERR_SUBSTITUTION_NOT_PENDING
    http_status: 422
    applies_to: "POST /pharmacy/medication-orders/{id}/substitute"
  - priority: 33
    category: business_referential
    check: "An ACTIVE protocol for the order's current drug must exist"
    error_id: ERR_NO_ACTIVE_PROTOCOL
    http_status: 422
    applies_to: "POST /pharmacy/medication-orders/{id}/substitute"
  - priority: 34
    category: business_referential
    check: "Substitute drug must be formulary-ACTIVE (non-empty eligible substitute pool)"
    error_id: ERR_NO_ELIGIBLE_SUBSTITUTE
    http_status: 422
    applies_to: "POST /pharmacy/medication-orders/{id}/substitute; POST /pharmacy/substitution-protocols/{id}/activate"
  - priority: 35
    category: business_referential
    check: "Shortage drug must carry in_shortage == true before protocol activation"
    error_id: ERR_DRUG_NOT_IN_SHORTAGE
    http_status: 422
    applies_to: "POST /pharmacy/substitution-protocols/{id}/activate"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- staff / patients / formulary config ---
  - method: POST
