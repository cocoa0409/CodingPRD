          assert:
            - "precondition: Flock.${f1_id}.status == CANCELLED (quarantine cascade) and the complex holds no GROWING/LAYING/MOLT flock"
            - "p0 == 0 — PLANNED and CANCELLED flocks are both outside the input set"
            - "note the projection remains 0 even though the complex posture is QUARANTINE: the input-set filter, not the posture branch, drives this read endpoint"

