            - "Program.${prog}.compliance_status is still UNVERIFIED because serves_minors is false"

      - name: registration_on_a_cancelled_drop_in_program_reports_the_state_error
        claim_type: priority_conflict
        grounds:
          - validations[priority=11]
          - validations[priority=31]
          - errors[ERR_PROGRAM_STATE_INVALID]
        distinguishing_aspect: "A CANCELLED DROP_IN program violates both the state gate at priority 11 and the drop-in gate at priority 31, and the response is ERR_PROGRAM_STATE_INVALID (409), never ERR_DROP_IN_NO_REGISTRATION."
        test_recipe:
          setup:
            - "A DROP_IN program that has been cancelled from DRAFT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramManager
            - call: "POST /library/branches"
              payload: { name: "Central Library", branch_code: "CEN", overlapping_program_capacity: 2, per_program_fee_cap_cents: 150000 }
              as: ProgramManager
              captures: { br: $.data.id }
            - call: "POST /library/programs"
              payload: { branch_id: "${br}", title: "Drop In Lego Club", age_group: "ALL_AGES", delivery_mode: "IN_BRANCH", registration_policy: "DROP_IN", start_utc: "2026-08-12T14:00:00.000Z", end_utc: "2026-08-12T15:00:00.000Z", attendance_target: 10, attendance_cap: 20, supply_sku: "CRAFT-KIT", supply_units_per_attendee: 1, materials_budget_cents: 50000, presenter_fee_budget_cents: 200000 }
              as: ProgramCoordinator
              captures: { prog: $.data.id }
            - call: "POST /library/programs/${prog}/cancel"
              payload: { closure_reason: "LOW_ENROLMENT" }
              as: ProgramManager
          trigger:
            - call: "POST /library/programs/${prog}/registrations"
              payload: { registrant_reference: "card-0001" }
              as: ProgramCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 409 and ${err} == ERR_PROGRAM_STATE_INVALID (priority 11 outranks priority 31)"
            - "Program.${prog}.operational_status == CANCELLED, registered_count == 0 and closure_reason == LOW_ENROLMENT"

      - name: confirm_passes_when_every_gate_from_eighteen_to_forty_seven_is_satisfied
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=18]
          - validations[priority=26]
          - validations[priority=28]
          - validations[priority=46]
          - validations[priority=47]
          - state_machines[Program.operational_status]
        distinguishing_aspect: "The satisfaction case must return 200 with the full commit applied: an AVAILABLE room, a CONFIRMED reservation, a branch load of 1 within capacity 2, sufficient stock and a 2750-cent committed total all pass, so operational_status becomes CONFIRMED."
        test_recipe:
          setup:
            - "Branch CEN (capacity 2) with an AVAILABLE 60-seat room, a 100-unit CRAFT-KIT lot at 250 cents, and a SCHEDULED program (attendance_target 10, materials_budget 50000) whose reservation is CONFIRMED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramManager
            - call: "POST /library/branches"
              payload: { name: "Central Library", branch_code: "CEN", overlapping_program_capacity: 2, per_program_fee_cap_cents: 150000 }
              as: ProgramManager
              captures: { br: $.data.id }
            - call: "POST /library/branches/${br}/rooms"
              payload: { room_name: "Story Room", capacity_seats: 60, min_setup_minutes: 15, min_teardown_minutes: 15 }
              as: ProgramManager
              captures: { room: $.data.id }
            - call: "POST /library/inventory-lots"
              payload: { branch_id: "${br}", category: "PROGRAM_SUPPLY", sku: "CRAFT-KIT", unit_cost_cents: 250, quantity_procured: 100, reuse_pool: false }
              as: ProgramManager
              captures: { lot: $.data.id }
            - call: "POST /library/programs"
              payload: { branch_id: "${br}", title: "Craft Hour", age_group: "SCHOOL_AGE", delivery_mode: "IN_BRANCH", registration_policy: "REGISTRATION", start_utc: "2026-08-12T14:00:00.000Z", end_utc: "2026-08-12T15:00:00.000Z", attendance_target: 10, attendance_cap: 20, supply_sku: "CRAFT-KIT", supply_units_per_attendee: 1, materials_budget_cents: 50000, presenter_fee_budget_cents: 200000 }
              as: ProgramCoordinator
              captures: { prog: $.data.id, prog_v: $.data.version }
            - call: "POST /library/programs/${prog}/reservations"
              payload: { room_id: "${room}", start_utc: "2026-08-12T14:00:00.000Z", end_utc: "2026-08-12T15:00:00.000Z", setup_minutes: 15, teardown_minutes: 15, expected_program_version: "${prog_v}" }
              as: ProgramCoordinator
              captures: { resv: $.data.id }
            - call: "POST /library/reservations/${resv}/confirm"
              payload: {}
              as: ProgramCoordinator
            - call: "POST /library/programs/${prog}/schedule"
              payload: {}
              as: ProgramCoordinator
          trigger:
            - call: "POST /library/programs/${prog}/confirm"
              payload: {}
              as: ProgramManager
              captures: { st: $.data.operational_status, committed: $.data.materials_committed_cents }
          assert:
            - "HTTP status is 200 with ${st} == CONFIRMED and ${committed} == 2750 (10 x 250 == 2500 plus a 10 percent contingency of 250)"
            - "Program.${prog}.materials_available_cents == 47250, supply_draw_lines has exactly 1 line for lot ${lot} with units 10 and line_cost_cents 2500"
            - "Program.${prog}.budget_variance_cents == 247250 (250000 total budget minus the 2750 committed) and budget_posture == WITHIN_BUDGET"
            - "InventoryLot.${lot}.quantity_reserved == 10, quantity_available == 90 and status == ACTIVE"
            - "Branch.${br}.programs_over_budget_count == 0"

      - name: minors_program_execution_without_active_screening_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=19]
          - errors[ERR_PRESENTER_SCREENING_REQUIRED]
        excluded_because:
          difficulty_instance: child_safety_screening_priority_19_outranks_fee_cap_priority_45
          rationale: "The §1.8 instance already executes this exact violation as the winning half of a 19-versus-45 double breach, so a standalone priority-19 recipe would repeat its setup and assertions verbatim."

      - name: confirming_a_program_with_no_confirmed_room_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=26]
          - errors[ERR_NO_CONFIRMED_ROOM]
        excluded_because:
          difficulty_instance: missing_confirmed_room_priority_26_outranks_branch_staffing_priority_28
          rationale: "The §1.8 instance triggers ERR_NO_CONFIRMED_ROOM as the winner of a 26-versus-28 conflict, which subsumes the plain violation case."

      - name: overlapping_room_booking_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=25]
          - errors[ERR_ROOM_DOUBLE_BOOKED]
        excluded_because:
          difficulty_instance: room_half_open_occupancy_admits_adjacency_and_rejects_one_minute_overlap
          rationale: "The §1.8 instance pairs the accepted adjacent booking with the rejected one-minute overlap, so it already asserts both sides of priority 25 at its boundary."

      - name: fourth_offer_on_the_same_contract_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=44]
          - errors[ERR_NEGOTIATION_ROUNDS_EXHAUSTED]
        excluded_because:
          difficulty_instance: negotiation_cycle_terminates_on_the_fourth_offer_not_the_fourth_counter
          rationale: "The §1.8 instance walks the offer/counter loop to exhaustion and asserts that the fourth offer — not the third counter — is the failing call, which fully covers priority 44."

  # =============================================================== §1.5 ENDPOINTS
  - section: endpoints
    instances:

      - name: branch_and_room_create_read_and_filtered_list_round_trip
        claim_type: standard_crud
        grounds:
          - endpoints[POST /library/branches]
          - endpoints[GET /library/branches/{branch_id}]
          - endpoints[POST /library/branches/{branch_id}/rooms]
          - endpoints[GET /library/rooms]
        distinguishing_aspect: "The created branch and its two rooms read back byte-for-byte, and GET /library/rooms filtered by branch_id and status AVAILABLE returns exactly the one AVAILABLE room."
        test_recipe:
          setup:
            - "One branch with an AVAILABLE room and an OUT_OF_SERVICE room."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramManager
            - call: "POST /library/branches"
              payload: { name: "Central Library", branch_code: "CEN", overlapping_program_capacity: 2, per_program_fee_cap_cents: 150000 }
              as: ProgramManager
              captures: { br: $.data.id }
            - call: "POST /library/branches/${br}/rooms"
              payload: { room_name: "Story Room", capacity_seats: 60, min_setup_minutes: 15, min_teardown_minutes: 15, accessibility_features: ["WHEELCHAIR_ACCESSIBLE"] }
              as: ProgramManager
              captures: { room_a: $.data.id }
            - call: "POST /library/branches/${br}/rooms"
              payload: { room_name: "Annex Room", capacity_seats: 20, min_setup_minutes: 10, min_teardown_minutes: 10, status: "OUT_OF_SERVICE" }
              as: ProgramManager
              captures: { room_b: $.data.id }
          trigger:
            - call: "GET /library/branches/${br}"
              payload: {}
              as: ProgramCoordinator
              captures: { code: $.data.branch_code }
            - call: "GET /library/rooms/${room_a}"
              payload: {}
              as: ProgramCoordinator
              captures: { seats: $.data.capacity_seats }
            - call: "GET /library/rooms"
              payload: { branch_id: "${br}", status: "AVAILABLE", limit: 50 }
              as: ProgramCoordinator
              captures: { first_room: "$.data[0].id" }
          assert:
            - "${code} == CEN and Branch.${br}.overlapping_program_capacity == 2 and programs_over_budget_count == 0"
            - "${seats} == 60 and Room.${room_a}.accessibility_features == [\"WHEELCHAIR_ACCESSIBLE\"] and status == AVAILABLE"
            - "The filtered listing returns total_count == 1 with ${first_room} == ${room_a}; ${room_b} is excluded by the status filter"
            - "Both rooms carry branch_id == ${br} taken from the path, not from a body field"

      - name: library_cancellation_kill_fee_switches_at_exactly_fourteen_days_notice
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /library/programs/{program_id}/cancel]
          - calculations.contract_cancellation_fee
          - state_machines[PresenterContract]
        distinguishing_aspect: "With the clock at 2026-08-03, cancelling the 2026-08-13 program (10 days) charges the full 50000 while cancelling the 2026-08-17 program (exactly 14 days) charges the 25 percent early rate of 12500, because the late-window test is a strict less-than."
        test_recipe:
          setup:
            - "Clock 2026-08-03; branch CEN; one presenter with two EXECUTED 50000-cent ADULT contracts, one for a 2026-08-13 program and one for a 2026-08-17 program."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T00:00:00.000Z" }
              as: ProgramManager
            - call: "POST /library/branches"
              payload: { name: "Central Library", branch_code: "CEN", overlapping_program_capacity: 2, per_program_fee_cap_cents: 150000 }
              as: ProgramManager
              captures: { br: $.data.id }
            - call: "POST /library/programs"
              payload: { branch_id: "${br}", title: "Thursday Author Talk", age_group: "ADULT", delivery_mode: "IN_BRANCH", registration_policy: "REGISTRATION", start_utc: "2026-08-13T18:00:00.000Z", end_utc: "2026-08-13T19:00:00.000Z", attendance_target: 20, attendance_cap: 25, supply_sku: "CRAFT-KIT", supply_units_per_attendee: 1, materials_budget_cents: 50000, presenter_fee_budget_cents: 200000 }
              as: ProgramCoordinator
              captures: { p1: $.data.id }
            - call: "POST /library/programs"
              payload: { branch_id: "${br}", title: "Monday Author Talk", age_group: "ADULT", delivery_mode: "IN_BRANCH", registration_policy: "REGISTRATION", start_utc: "2026-08-17T18:00:00.000Z", end_utc: "2026-08-17T19:00:00.000Z", attendance_target: 20, attendance_cap: 25, supply_sku: "CRAFT-KIT", supply_units_per_attendee: 1, materials_budget_cents: 50000, presenter_fee_budget_cents: 200000 }
              as: ProgramCoordinator
              captures: { p2: $.data.id }
            - call: "POST /library/presenters"
              payload: { legal_name: "Twice Booked", presenter_type: "INDIVIDUAL", insurance_certificate_expires_on: "2027-01-01", quoted_fee_cents: 50000 }
              as: ProgramCoordinator
              captures: { pres: $.data.id }
            - call: "POST /library/contracts"
              payload: { presenter_id: "${pres}", program_id: "${p1}", round_trip_miles: 20 }
              as: ProgramCoordinator
              captures: { c1: $.data.id }
            - call: "POST /library/contracts/${c1}/offer"
              payload: { offered_fee_cents: 50000 }
              as: ProgramManager
              as_user_id: "mgr-001"
            - call: "POST /library/contracts/${c1}/execute"
              payload: {}
              as: ProgramManager
              as_user_id: "mgr-002"
            - call: "POST /library/contracts"
              payload: { presenter_id: "${pres}", program_id: "${p2}", round_trip_miles: 20 }
              as: ProgramCoordinator
              captures: { c2: $.data.id }
            - call: "POST /library/contracts/${c2}/offer"
              payload: { offered_fee_cents: 50000 }
              as: ProgramManager
              as_user_id: "mgr-001"
            - call: "POST /library/contracts/${c2}/execute"
              payload: {}
              as: ProgramManager
              as_user_id: "mgr-002"
          trigger:
            - call: "POST /library/programs/${p1}/cancel"
              payload: { closure_reason: "LOW_ENROLMENT" }
              as: ProgramManager
              captures: { committed1: $.data.presenter_fee_committed_cents }
            - call: "POST /library/programs/${p2}/cancel"
              payload: { closure_reason: "LOW_ENROLMENT" }
              as: ProgramManager
              captures: { committed2: $.data.presenter_fee_committed_cents }
          assert:
            - "${committed1} == 50000 (10 days notice is inside the 14-day late window, so the full total_fee_cents is owed)"
            - "${committed2} == 12500 (exactly 14 days notice takes round_half_up(50000 x 0.25))"
            - "PresenterContract.${c1}.status == CANCELLED_LIBRARY with kill_fee_cents == 50000 and total_fee_cents still 50000"
            - "PresenterContract.${c2}.status == CANCELLED_LIBRARY with kill_fee_cents == 12500"
            - "Program.${p1}.budget_variance_cents == 200000 and Program.${p2}.budget_variance_cents == 237500 (250000 total budget minus 50000 and 12500), both WITHIN_BUDGET, and Branch.${br}.programs_over_budget_count == 0"
            - "Presenter.${pres}.executed_contract_count == 2 and engagement_status == ACTIVE — cancellation does not retract the engagement"

      - name: contract_creation_links_an_existing_presenter_to_an_existing_program
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /library/contracts]
          - validations[priority=6]
