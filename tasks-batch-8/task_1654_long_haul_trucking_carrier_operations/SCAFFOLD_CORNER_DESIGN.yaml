            - { call: "POST /drivers", payload: { cdl_number: "CDL-B5", full_name: "B Five", home_terminal: "DAL", pay_model: "MILEAGE", pay_rate_cents_per_mile: 62, hired_at: "2025-01-01T00:00:00Z", last_home_at: "2026-07-28T00:00:00Z" }, as: FleetAdmin, captures: { drv: $.data.id } }
