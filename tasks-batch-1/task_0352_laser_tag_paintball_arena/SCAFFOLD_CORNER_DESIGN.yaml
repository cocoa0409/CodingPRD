          setup: ["Arena clock set; field; two AVAILABLE markers; HELD booking"]
          setup_api_calls:
            - call: "POST /arenas"
              payload: { name: "CX3", marker_pool_total: 2, vest_pool_total: 0 }
              as: ArenaManager
              captures: { arena_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { arena_id: "${arena_id}", to_iso8601: "2026-06-15T09:00:00Z" }
              as: ArenaManager
            - call: "POST /fields"
              payload: { arena_id: "${arena_id}", name: "Fx3", game_mode: "LASER_TAG", capacity_max: 8 }
              as: ArenaManager
              captures: { field_id: $.data.id }
            - call: "POST /equipment-units"
              payload: { arena_id: "${arena_id}", unit_type: "MARKER", asset_tag: "M-x3a", deposit_cents: 2000 }
              as: ArenaManager
              captures: { unit_a: $.data.id }
            - call: "POST /equipment-units"
              payload: { arena_id: "${arena_id}", unit_type: "MARKER", asset_tag: "M-x3b", deposit_cents: 2000 }
              as: ArenaManager
              captures: { unit_b: $.data.id }
            - call: "POST /bookings"
              payload: { arena_id: "${arena_id}", field_id: "${field_id}", booking_type: "WALK_IN", party_size: 4, window_start: "2026-06-15T09:00:00Z", window_end: "2026-06-15T10:00:00Z" }
              as: FrontDesk
              captures: { booking_id: $.data.id }
          trigger:
            - call: "POST /rentals"
              payload: { arena_id: "${arena_id}", booking_id: "${booking_id}", equipment_unit_id: "${unit_a}" }
              as: FrontDesk
          assert:
            - "Arena.${arena_id}.marker_available_count == 1"

      - name: cancel_booking_cascade_releases_rental_and_equipment
        claim_type: cascading_side_effects
        grounds: [state_machines.Booking.CONFIRMED_to_CANCELLED]
        excluded_because:
          difficulty_instance: transitive_cascade / cancel_booking_three_hop_rental_equipment_deposit
          rationale: "The full cancel cascade (rental release -> equipment available -> deposit ledger credit) is the named depth-3 §1.8 transitive_cascade instance."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_of_confirm_fee_in_same_response
        claim_type: immediate
        grounds: [entities.Booking.fields.field_fee_cents, state_machines.Booking.HELD_to_CONFIRMED]
        distinguishing_aspect: "The confirm response immediately reflects the computed field_fee_cents and CONFIRMED status in the same request (immediate consistency)."
        test_recipe:
          setup: ["Arena clock set; field; package base 9000 included 10; WALK_IN booking party 10 HELD"]
          setup_api_calls:
            - call: "POST /arenas"
              payload: { name: "CY1", marker_pool_total: 0, vest_pool_total: 0 }
              as: ArenaManager
              captures: { arena_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { arena_id: "${arena_id}", to_iso8601: "2026-06-15T09:00:00Z" }
              as: ArenaManager
            - call: "POST /fields"
              payload: { arena_id: "${arena_id}", name: "Fy1", game_mode: "LASER_TAG", capacity_max: 12 }
              as: ArenaManager
              captures: { field_id: $.data.id, field_v0: $.data.version }
            - call: "POST /party-packages"
              payload: { arena_id: "${arena_id}", name: "Py1", included_players: 10, extra_player_fee_cents: 500, base_fee_cents: 9000, active: true }
              as: ArenaManager
              captures: { pkg_id: $.data.id }
            - call: "POST /bookings"
              payload: { arena_id: "${arena_id}", field_id: "${field_id}", booking_type: "WALK_IN", party_size: 10, window_start: "2026-06-15T09:00:00Z", window_end: "2026-06-15T10:00:00Z", package_id: "${pkg_id}" }
              as: FrontDesk
              captures: { booking_id: $.data.id }
          trigger:
            - call: "POST /bookings/${booking_id}/confirm"
              payload: { expected_field_version: "${field_v0}" }
              as: FrontDesk
              captures: { fee: $.data.field_fee_cents, st: $.data.status }
          assert:
            - "Booking.${booking_id}.field_fee_cents == 9000"
            - "Booking.${booking_id}.status == CONFIRMED"
