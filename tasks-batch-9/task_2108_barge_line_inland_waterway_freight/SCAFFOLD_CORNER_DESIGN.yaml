            - "FleetingAssignment.${fa2_id}.billable_days == 2 and fee_cents == 90000"
            - "both rows carry estimated_fee_cents == 75000 from the planned interval"
            - "FleetingBerth.${fb_id}.occupied_barge_count == 0"

