  - section: calculations
    instances:
      - name: nqdc_funding_summary_excludes_settled_liabilities
        claim_type: input_set_filtering
        grounds:
          - calculations.nqdc_liability_valuation.input_set
          - endpoints[POST /nqdc-liabilities/{id}/settle]
          - endpoints[GET /nqdc-plans/{id}/funding-summary]
        distinguishing_aspect: "Only ACTIVE participant liabilities enter either basis: settling one of two participants drops its accrued amount from accrual_liability_usd, its discounted amount from pbo_liability_usd and its head from participant_count, on both bases at once."
        test_recipe:
          setup:
            - "One ACTIVE NqdcPlan with discount_rate_bps 500 and two unmatched liabilities: 600000.00 accrued / 800000.00 projected over 5 years (discounted 626820.93) and 400000.00 accrued / 500000.00 projected over 10 years (discounted 306956.63)."
          setup_api_calls:
            - call: "POST /nqdc-plans"
              payload: { plan_name: "Filter SERP", plan_type: "SERP", discount_rate_bps: 500 }
              as: TreasuryController
              captures: { plan_filter_id: $.data.id }
            - call: "POST /employees"
              payload: { full_name: "Ada Reyes", employee_number: "E-7901", annual_salary_usd: 700000.00 }
              as: BenefitsAnalyst
              captures: { emp_reyes_id: $.data.id }
            - call: "POST /employees"
              payload: { full_name: "Owen Diaz", employee_number: "E-7902", annual_salary_usd: 600000.00 }
              as: BenefitsAnalyst
              captures: { emp_diaz_id: $.data.id }
            - call: "POST /nqdc-liabilities"
              payload: { nqdc_plan_id: "${plan_filter_id}", employee_id: "${emp_reyes_id}", accrued_to_date_usd: 600000.00, projected_benefit_usd: 800000.00, years_to_payout: 5 }
              as: TreasuryController
