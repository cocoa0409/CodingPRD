      - name: zone_reschedule_lead_time_boundary
        claim_type: boundary_edge
        grounds:
          - "validations[priority=9]"
          - "errors[ERR_NOTIFICATION_LEAD_TIME]"
          - "endpoints['PATCH /zones/{id}]"
        distinguishing_aspect: "The 48h resident-notice rule is inclusive: a change at exactly collection_date-48h succeeds; one second later it is rejected."
        test_recipe:
          setup: ["Program ACTIVE; zones Z1 and Z2 both collecting 2027-01-09T00:00:00Z; clock movable"]
          setup_api_calls:
            - call: "POST /programs"
