scaffold_corner_design:
  - section: entities
    instances:
      - name: member_creation_defaults
        claim_type: creation
        grounds: [entities.Member.fields.membership_status, entities.Member.fields.equipment_privilege, entities.Member.fields.readiness_score]
        distinguishing_aspect: "A freshly created member starts PENDING with GOOD_STANDING privilege, readiness_score 20 (no-show-free bonus only), readiness_tier INELIGIBLE, and version 1."
        test_recipe:
          setup: ["empty database; default clock 2026-05-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - call: "POST /members"
              payload: { callsign: "K1NEW", full_name: "New Ham", license_class: "TECHNICIAN", license_expires_at: "2030-01-01T00:00:00Z" }
              as: ClubAdmin
              captures: { m: $.data.id }
          assert:
            - "Member.${m}.membership_status == PENDING"
            - "Member.${m}.equipment_privilege == GOOD_STANDING"
            - "Member.${m}.readiness_score == 20"
            - "Member.${m}.readiness_tier == INELIGIBLE"
            - "Member.${m}.version == 1"

      - name: member_duplicate_callsign_rejected
        claim_type: type_constraints
        grounds: [entities.Member.fields.callsign, "errors[ERR_CALLSIGN_TAKEN]"]
        distinguishing_aspect: "Callsign uniqueness is case-insensitive: K1DUP then k1dup collide."
        test_recipe:
          setup: ["one member K1DUP exists"]
          setup_api_calls:
            - call: "POST /members"
              payload: { callsign: "K1DUP", full_name: "First", license_class: "GENERAL", license_expires_at: "2030-01-01T00:00:00Z" }
              as: ClubAdmin
          trigger:
            - call: "POST /members"
              payload: { callsign: "k1dup", full_name: "Second", license_class: "EXTRA", license_expires_at: "2030-01-01T00:00:00Z" }
              as: ClubAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409 with data.error_id == ERR_CALLSIGN_TAKEN"

      - name: member_get_not_found
        claim_type: not_found
        grounds: ["validations[priority=3]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but non-existent UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /members/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ClubAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404 with data.error_id == ERR_NOT_FOUND"

      - name: checkin_immutable_no_version_field
        claim_type: immutability
        grounds: [entities.CheckIn]
        distinguishing_aspect: "CheckIn has common_fields false: its response rows carry id and created_at but no version or updated_at fields."
        test_recipe:
          setup: ["operational repeater; net OPEN; ACTIVE member checked in"]
          setup_api_calls:
            - call: "POST /antenna-site-agreements"
              payload: { site_name: "Hilltop", owner_name: "County", lease_start: "2026-01-01T00:00:00Z", lease_end: "2027-12-31T00:00:00Z" }
              as: ClubAdmin
              captures: { asa: $.data.id }
            - call: "POST /antenna-site-agreements/${asa}/set-status"
              payload: { to: "ACTIVE" }
              as: ClubAdmin
            - call: "POST /repeaters"
              payload: { callsign: "W1RPT", output_frequency_mhz: 146.94, site_agreement_id: "${asa}" }
              as: ClubAdmin
              captures: { rep: $.data.id, rep_ver: $.data.version }
            - call: "POST /coordination-requests"
              payload: { repeater_id: "${rep}", requested_frequency_mhz: 146.94, expected_repeater_version: "${rep_ver}" }
              as: ClubAdmin
              captures: { cr: $.data.id }
            - call: "POST /coordination-requests/${cr}/submit"
              payload: {}
              as: ClubAdmin
            - call: "POST /coordination-requests/${cr}/record-decision"
              payload: { outcome: "GRANTED", council_reference: "C-001" }
              as: ClubAdmin
            - call: "POST /repeaters/${rep}/set-status"
              payload: { to: "OPERATIONAL" }
              as: ClubAdmin
            - call: "POST /members"
              payload: { callsign: "W1NCS", full_name: "Net Control", license_class: "EXTRA", license_expires_at: "2030-01-01T00:00:00Z" }
              as: ClubAdmin
              captures: { nc: $.data.id }
            - call: "POST /members/${nc}/renew"
              payload: { periods: 1 }
              as: ClubAdmin
            - call: "POST /members"
              payload: { callsign: "K1OPR", full_name: "Operator", license_class: "EXTRA", license_expires_at: "2030-01-01T00:00:00Z" }
              as: ClubAdmin
              captures: { m: $.data.id }
            - call: "POST /members/${m}/renew"
              payload: { periods: 1 }
              as: ClubAdmin
            - call: "POST /net-sessions"
              payload: { name: "Net 1", repeater_id: "${rep}", scheduled_start: "2026-05-01T00:00:00Z", scheduled_end: "2026-05-02T00:00:00Z" }
              as: NetControl
              as_user_id: "${nc}"
              captures: { net: $.data.id }
            - call: "POST /net-sessions/${net}/set-status"
              payload: { to: "OPEN" }
              as: NetControl
              as_user_id: "${nc}"
          trigger:
            - call: "POST /check-ins"
              payload: { net_session_id: "${net}" }
              as: Member
              as_user_id: "${m}"
              captures: { ci: $.data.id }
          assert:
            - "CheckIn.${ci} response data contains no 'version' key and no 'updated_at' key"
            - "CheckIn.${ci}.checked_in_at == 2026-05-01T00:00:00Z"

      - name: fieldday_contact_points_input_ignored
        claim_type: computed_fields
        grounds: [entities.FieldDayContact.fields.points, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "points is computed-only: supplying it in the create payload is rejected as an unknown/read-only input field with 400 ERR_VALIDATION."
        test_recipe:
          setup: ["ACTIVE member K1AAA; FieldDayEvent OPEN"]
          setup_api_calls:
            - call: "POST /members"
              payload: { callsign: "K1AAA", full_name: "Op One", license_class: "EXTRA", license_expires_at: "2030-01-01T00:00:00Z" }
              as: ClubAdmin
              captures: { m1: $.data.id }
            - call: "POST /members/${m1}/renew"
              payload: { periods: 1 }
              as: ClubAdmin
            - call: "POST /field-day-events"
              payload: { name: "FD 2026", start_at: "2026-05-01T00:00:00Z", end_at: "2026-05-03T00:00:00Z" }
              as: ClubAdmin
              captures: { ev: $.data.id }
            - call: "POST /field-day-events/${ev}/set-status"
              payload: { to: "OPEN" }
              as: ClubAdmin
          trigger:
            - call: "POST /field-day-contacts"
              payload: { event_id: "${ev}", worked_callsign: "W1AW", band: "B2M", mode: "CW", power_category: "QRP", points: 999 }
              as: Member
              as_user_id: "${m1}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 400 with data.error_id == ERR_VALIDATION"

  - section: state_machines
    instances:
      - name: net_open_before_window_returns_window_error
        claim_type: precondition_enforcement
        grounds: [state_machines.NetSession.SCHEDULED_to_OPEN, "errors[ERR_NET_WINDOW_NOT_STARTED]"]
        distinguishing_aspect: "OPEN before scheduled_start is rejected; the default clock 2026-05-01T00:00:00Z is earlier than the 2026-05-02 window."
        test_recipe:
          setup: ["repeater OPERATIONAL; net-control member; net SCHEDULED for 2026-05-02T00:00:00Z-2026-05-03T00:00:00Z"]
          setup_api_calls:
            - call: "POST /antenna-site-agreements"
              payload: { site_name: "Hilltop", owner_name: "County", lease_start: "2026-01-01T00:00:00Z", lease_end: "2027-12-31T00:00:00Z" }
              as: ClubAdmin
              captures: { asa: $.data.id }
            - call: "POST /antenna-site-agreements/${asa}/set-status"
              payload: { to: "ACTIVE" }
              as: ClubAdmin
            - call: "POST /repeaters"
              payload: { callsign: "W1RPT", output_frequency_mhz: 146.94, site_agreement_id: "${asa}" }
              as: ClubAdmin
              captures: { rep: $.data.id, rep_ver: $.data.version }
            - call: "POST /coordination-requests"
              payload: { repeater_id: "${rep}", requested_frequency_mhz: 146.94, expected_repeater_version: "${rep_ver}" }
              as: ClubAdmin
              captures: { cr: $.data.id }
            - call: "POST /coordination-requests/${cr}/submit"
              payload: {}
              as: ClubAdmin
            - call: "POST /coordination-requests/${cr}/record-decision"
              payload: { outcome: "GRANTED", council_reference: "C-001" }
              as: ClubAdmin
            - call: "POST /repeaters/${rep}/set-status"
              payload: { to: "OPERATIONAL" }
              as: ClubAdmin
            - call: "POST /members"
              payload: { callsign: "W1NCS", full_name: "Net Control", license_class: "EXTRA", license_expires_at: "2030-01-01T00:00:00Z" }
              as: ClubAdmin
              captures: { nc: $.data.id }
            - call: "POST /members/${nc}/renew"
              payload: { periods: 1 }
              as: ClubAdmin
            - call: "POST /net-sessions"
              payload: { name: "Net 1", repeater_id: "${rep}", scheduled_start: "2026-05-02T00:00:00Z", scheduled_end: "2026-05-03T00:00:00Z" }
              as: NetControl
              as_user_id: "${nc}"
              captures: { net: $.data.id }
          trigger:
            - call: "POST /net-sessions/${net}/set-status"
              payload: { to: "OPEN" }
              as: NetControl
              as_user_id: "${nc}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409 with data.error_id == ERR_NET_WINDOW_NOT_STARTED"
            - "NetSession.${net}.status == SCHEDULED"

      - name: net_closed_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.NetSession.OPEN_to_CLOSED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A CLOSED net accepts no further transitions: re-opening fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["repeater OPERATIONAL; net-control member; net opened then CLOSED"]
          setup_api_calls:
            - call: "POST /antenna-site-agreements"
              payload: { site_name: "Hilltop", owner_name: "County", lease_start: "2026-01-01T00:00:00Z", lease_end: "2027-12-31T00:00:00Z" }
              as: ClubAdmin
              captures: { asa: $.data.id }
            - call: "POST /antenna-site-agreements/${asa}/set-status"
              payload: { to: "ACTIVE" }
              as: ClubAdmin
            - call: "POST /repeaters"
              payload: { callsign: "W1RPT", output_frequency_mhz: 146.94, site_agreement_id: "${asa}" }
              as: ClubAdmin
              captures: { rep: $.data.id, rep_ver: $.data.version }
            - call: "POST /coordination-requests"
              payload: { repeater_id: "${rep}", requested_frequency_mhz: 146.94, expected_repeater_version: "${rep_ver}" }
              as: ClubAdmin
              captures: { cr: $.data.id }
            - call: "POST /coordination-requests/${cr}/submit"
              payload: {}
              as: ClubAdmin
            - call: "POST /coordination-requests/${cr}/record-decision"
              payload: { outcome: "GRANTED", council_reference: "C-001" }
              as: ClubAdmin
            - call: "POST /repeaters/${rep}/set-status"
              payload: { to: "OPERATIONAL" }
              as: ClubAdmin
            - call: "POST /members"
              payload: { callsign: "W1NCS", full_name: "Net Control", license_class: "EXTRA", license_expires_at: "2030-01-01T00:00:00Z" }
              as: ClubAdmin
              captures: { nc: $.data.id }
            - call: "POST /members/${nc}/renew"
              payload: { periods: 1 }
              as: ClubAdmin
            - call: "POST /net-sessions"
              payload: { name: "Net 1", repeater_id: "${rep}", scheduled_start: "2026-05-01T00:00:00Z", scheduled_end: "2026-05-02T00:00:00Z" }
              as: NetControl
              as_user_id: "${nc}"
              captures: { net: $.data.id }
            - call: "POST /net-sessions/${net}/set-status"
              payload: { to: "OPEN" }
              as: NetControl
              as_user_id: "${nc}"
            - call: "POST /net-sessions/${net}/set-status"
              payload: { to: "CLOSED" }
              as: NetControl
              as_user_id: "${nc}"
          trigger:
            - call: "POST /net-sessions/${net}/set-status"
              payload: { to: "OPEN" }
              as: NetControl
              as_user_id: "${nc}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409 with data.error_id == ERR_INVALID_STATE"
            - "NetSession.${net}.status == CLOSED"

      - name: coordination_double_submit_rejected
        claim_type: invalid_transition
        grounds: [state_machines.CoordinationRequest.DRAFT_to_SUBMITTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "SUBMITTED is not a valid from-state for submit: the second submit fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["repeater with ACTIVE site agreement; coordination request SUBMITTED"]
          setup_api_calls:
            - call: "POST /antenna-site-agreements"
              payload: { site_name: "Hilltop", owner_name: "County", lease_start: "2026-01-01T00:00:00Z", lease_end: "2027-12-31T00:00:00Z" }
              as: ClubAdmin
              captures: { asa: $.data.id }
            - call: "POST /antenna-site-agreements/${asa}/set-status"
              payload: { to: "ACTIVE" }
              as: ClubAdmin
            - call: "POST /repeaters"
              payload: { callsign: "W1RPT", output_frequency_mhz: 146.94, site_agreement_id: "${asa}" }
              as: ClubAdmin
              captures: { rep: $.data.id, rep_ver: $.data.version }
            - call: "POST /coordination-requests"
              payload: { repeater_id: "${rep}", requested_frequency_mhz: 146.94, expected_repeater_version: "${rep_ver}" }
              as: ClubAdmin
              captures: { cr: $.data.id }
            - call: "POST /coordination-requests/${cr}/submit"
              payload: {}
              as: ClubAdmin
          trigger:
            - call: "POST /coordination-requests/${cr}/submit"
              payload: {}
              as: ClubAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409 with data.error_id == ERR_INVALID_STATE"
            - "CoordinationRequest.${cr}.status == SUBMITTED"

      - name: drill_message_deliver_without_relay_rejected
        claim_type: invalid_transition
        grounds: [state_machines.DrillMessage.RELAYED_to_DELIVERED, "errors[ERR_MESSAGE_NOT_RELAYED]"]
        distinguishing_aspect: "DELIVERED is reachable only from RELAYED: ORIGINATED -> DELIVERED fails with ERR_MESSAGE_NOT_RELAYED and relay_count stays 0."
        test_recipe:
          setup: ["EC member W1EC; ACTIVE member K1OPR; drill IN_PROGRESS; one ORIGINATED message"]
          setup_api_calls:
            - call: "POST /members"
              payload: { callsign: "W1EC", full_name: "EC One", license_class: "EXTRA", license_expires_at: "2030-01-01T00:00:00Z" }
              as: ClubAdmin
              captures: { ec: $.data.id }
            - call: "POST /members"
              payload: { callsign: "K1OPR", full_name: "Operator", license_class: "EXTRA", license_expires_at: "2030-01-01T00:00:00Z" }
              as: ClubAdmin
              captures: { m: $.data.id }
            - call: "POST /members/${m}/renew"
              payload: { periods: 1 }
              as: ClubAdmin
            - call: "POST /drills"
              payload: { title: "SET Drill", scheduled_start: "2026-05-01T00:00:00Z", scheduled_end: "2026-05-02T00:00:00Z" }
              as: EmergencyCoordinator
              as_user_id: "${ec}"
              captures: { dr: $.data.id }
            - call: "POST /drills/${dr}/set-status"
              payload: { to: "IN_PROGRESS" }
              as: EmergencyCoordinator
              as_user_id: "${ec}"
            - call: "POST /drill-messages"
              payload: { drill_id: "${dr}", precedence: "ROUTINE" }
              as: Member
              as_user_id: "${m}"
              captures: { msg: $.data.id }
          trigger:
            - call: "POST /drill-messages/${msg}/set-status"
              payload: { to: "DELIVERED" }
              as: Member
              as_user_id: "${m}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409 with data.error_id == ERR_MESSAGE_NOT_RELAYED"
            - "DrillMessage.${msg}.status == ORIGINATED"
            - "DrillMessage.${msg}.relay_count == 0"

      - name: roster_volunteer_ineligible_member_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.RosterEntry, "validations[priority=8]", "errors[ERR_ROSTER_ENTRY_INELIGIBLE]"]
        distinguishing_aspect: "A member with readiness_score 20 (INELIGIBLE, no activity history) cannot volunteer: rejected ERR_ROSTER_ENTRY_INELIGIBLE."
        test_recipe:
          setup: ["ACTIVE agreement; STANDBY activation; member K1OPR ACTIVE but with zero check-ins and drills (readiness 20)"]
          setup_api_calls:
            - call: "POST /members"
              payload: { callsign: "W1EC", full_name: "EC One", license_class: "EXTRA", license_expires_at: "2030-01-01T00:00:00Z" }
              as: ClubAdmin
              captures: { ec: $.data.id }
            - call: "POST /members"
              payload: { callsign: "K1OPR", full_name: "Operator", license_class: "EXTRA", license_expires_at: "2030-01-01T00:00:00Z" }
              as: ClubAdmin
              captures: { m: $.data.id }
            - call: "POST /members/${m}/renew"
              payload: { periods: 1 }
              as: ClubAdmin
            - call: "POST /served-agency-agreements"
              payload: { agency_name: "County OEM", max_operators: 10, effective_start: "2026-01-01T00:00:00Z", effective_end: "2027-12-31T00:00:00Z" }
              as: ClubAdmin
              captures: { sag: $.data.id }
            - call: "POST /served-agency-agreements/${sag}/set-status"
              payload: { to: "ACTIVE" }
              as: ClubAdmin
              captures: { sag_ver: $.data.version }
            - call: "POST /emergency-activations"
              payload: { agreement_id: "${sag}", title: "Flood", required_operators: 2, expected_served_agency_agreement_version: "${sag_ver}" }
              as: EmergencyCoordinator
              as_user_id: "${ec}"
              captures: { act: $.data.id }
          trigger:
            - call: "POST /roster-entries"
              payload: { activation_id: "${act}" }
              as: Member
              as_user_id: "${m}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409 with data.error_id == ERR_ROSTER_ENTRY_INELIGIBLE"

      - name: demobilize_segregation_of_duties
        claim_type: precondition_enforcement
        grounds: [state_machines.EmergencyActivation.ACTIVATED_to_DEMOBILIZED, "errors[ERR_SOD_DEMOBILIZE]"]
        distinguishing_aspect: "The EC member who activated cannot demobilize (ERR_SOD_DEMOBILIZE, 403); a different EC member can, driving ACTIVATED -> DEMOBILIZED."
        test_recipe:
          setup: ["ACTIVE agreement; activation ACTIVATED by EC member W1EC1; second EC member W2EC2 exists"]
          setup_api_calls:
            - call: "POST /members"
              payload: { callsign: "W1EC1", full_name: "EC One", license_class: "EXTRA", license_expires_at: "2030-01-01T00:00:00Z" }
              as: ClubAdmin
              captures: { ec1: $.data.id }
            - call: "POST /members"
              payload: { callsign: "W2EC2", full_name: "EC Two", license_class: "EXTRA", license_expires_at: "2030-01-01T00:00:00Z" }
              as: ClubAdmin
              captures: { ec2: $.data.id }
            - call: "POST /served-agency-agreements"
              payload: { agency_name: "County OEM", max_operators: 10, effective_start: "2026-01-01T00:00:00Z", effective_end: "2027-12-31T00:00:00Z" }
              as: ClubAdmin
              captures: { sag: $.data.id }
            - call: "POST /served-agency-agreements/${sag}/set-status"
              payload: { to: "ACTIVE" }
              as: ClubAdmin
              captures: { sag_ver: $.data.version }
            - call: "POST /emergency-activations"
              payload: { agreement_id: "${sag}", title: "Flood", required_operators: 2, expected_served_agency_agreement_version: "${sag_ver}" }
              as: EmergencyCoordinator
              as_user_id: "${ec1}"
              captures: { act: $.data.id }
            - call: "POST /emergency-activations/${act}/set-status"
              payload: { to: "ACTIVATED" }
              as: EmergencyCoordinator
              as_user_id: "${ec1}"
          trigger:
            - call: "POST /emergency-activations/${act}/set-status"
              payload: { to: "DEMOBILIZED" }
              as: EmergencyCoordinator
              as_user_id: "${ec1}"
              captures: { err: $.data.error_id }
            - call: "POST /emergency-activations/${act}/set-status"
              payload: { to: "DEMOBILIZED" }
              as: EmergencyCoordinator
              as_user_id: "${ec2}"
          assert:
            - "first demobilize: 403 ERR_SOD_DEMOBILIZE"
            - "second demobilize succeeds: EmergencyActivation.${act}.status == DEMOBILIZED"
            - "EmergencyActivation.${act}.activated_by_member_id == ${ec1}"

      - name: exam_close_with_pending_candidates_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.ExamSession.IN_PROGRESS_to_CLOSED, "errors[ERR_CANDIDATES_PENDING]"]
        distinguishing_aspect: "A session cannot close while a candidate is still REGISTERED: aggregate precondition over child entities."
        test_recipe:
          setup: ["exam session IN_PROGRESS with one REGISTERED candidate"]
          setup_api_calls:
            - call: "POST /members"
              payload: { callsign: "W1LIA", full_name: "Liaison", license_class: "EXTRA", license_expires_at: "2030-01-01T00:00:00Z" }
              as: ClubAdmin
              captures: { lia: $.data.id }
            - call: "POST /exam-sessions"
              payload: { location: "Library", scheduled_at: "2026-05-01T00:00:00Z", max_candidates: 5 }
              as: ExamLiaison
              as_user_id: "${lia}"
              captures: { ses: $.data.id }
            - call: "POST /exam-candidates"
              payload: { session_id: "${ses}", candidate_name: "Cand One", frn: "0001112223", element: "TECHNICIAN" }
              as: ExamLiaison
              as_user_id: "${lia}"
            - call: "POST /exam-sessions/${ses}/set-status"
              payload: { to: "IN_PROGRESS" }
              as: ExamLiaison
              as_user_id: "${lia}"
          trigger:
            - call: "POST /exam-sessions/${ses}/set-status"
              payload: { to: "CLOSED" }
              as: ExamLiaison
              as_user_id: "${lia}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409 with data.error_id == ERR_CANDIDATES_PENDING"
            - "ExamSession.${ses}.status == IN_PROGRESS"

      - name: exam_result_requires_checkedin
        claim_type: precondition_enforcement
        grounds: [state_machines.ExamCandidate.CHECKED_IN_to_PASSED, "errors[ERR_CANDIDATE_NOT_CHECKED_IN]"]
        distinguishing_aspect: "record-result on a REGISTERED (never checked-in) candidate fails with ERR_CANDIDATE_NOT_CHECKED_IN."
        test_recipe:
          setup: ["exam session IN_PROGRESS with one REGISTERED candidate"]
          setup_api_calls:
            - call: "POST /members"
              payload: { callsign: "W1LIA", full_name: "Liaison", license_class: "EXTRA", license_expires_at: "2030-01-01T00:00:00Z" }
              as: ClubAdmin
              captures: { lia: $.data.id }
            - call: "POST /exam-sessions"
              payload: { location: "Library", scheduled_at: "2026-05-01T00:00:00Z", max_candidates: 5 }
