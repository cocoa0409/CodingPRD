            - call: "POST /mobile-dentistry/patients"
              payload: { site_id: "${site_id}", patient_type: "STUDENT", external_ref: "S-001", first_name: "Mia", last_name: "Lopez", date_of_birth: "2016-03-04", grade_level: "4", household_size: 4 }
