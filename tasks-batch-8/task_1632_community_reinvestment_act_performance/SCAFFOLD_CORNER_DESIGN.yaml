            - call: "POST /cra/assessment-areas"
              payload: { area_code: "AA-V2", name: "RBAC Area", msa_code: "10180", state_code: "CA", census_tracts: ["T1"], effective_start_date: "2023-01-01", annual_cd_budget_cents: 500000 }
