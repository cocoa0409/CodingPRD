              as: ComplianceOfficer
              captures: { q1_id: $.data.id }
            - call: "POST /reit-compliance/ep-adjustments"
              payload: { reit_id: "${reit_id}", quarter_id: "${q1_id}", kind: "FEDERAL_TAX", amount_cents: 100000, effective_date: "2026-01-31", expected_reit_version: "${reit_v}" }
              as: TaxDirector
              captures: { adj_id: $.data.id }
            - call: "POST /reit-compliance/ep-adjustments/${adj_id}/post"
              payload: {}
              as: TaxDirector
            - call: "POST /reit-compliance/distribution-requirements"
              payload: { reit_id: "${reit_id}", taxable_year: 2026, taxable_income_cents: 0, net_capital_gain_cents: 0 }
              as: ComplianceOfficer
              captures: { req_id: $.data.id }
            - call: "POST /reit-compliance/distribution-requirements/${req_id}/post"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /reit-compliance/reits/${reit_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { rv1: $.data.version, ep_neg: $.data.current_ep_balance_cents }
            - call: "POST /reit-compliance/dividend-declarations"
              payload: { reit_id: "${reit_id}", taxable_year: 2026, amount_cents: 50000, declaration_date: "2026-03-01", record_date: "2026-03-10", payable_date: "2026-03-20", expected_reit_version: "${rv1}" }
              as: ComplianceOfficer
              captures: { d1_id: $.data.id }
            - call: "POST /reit-compliance/dividend-declarations/${d1_id}/approve"
              payload: {}
              as: BoardDirector
              as_user_id: "director-1"
          trigger:
            - call: "POST /reit-compliance/dividend-declarations/${d1_id}/declare"
              payload: {}
