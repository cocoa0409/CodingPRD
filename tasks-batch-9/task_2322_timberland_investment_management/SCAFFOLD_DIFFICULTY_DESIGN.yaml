              captures: { stand_v2: "$.data.version", ded_before: "$.data.dedicated_tons", avail_before: "$.data.available_tons" }
          trigger:
            - call: "POST /timberland/carbon-dedications/${ded_id}/release"
              payload: { release_reason: "Project re-scoped before validation." }
              as: CarbonDeveloper
              captures: { ded_status: "$.data.status" }
