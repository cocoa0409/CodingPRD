scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: fee_assessment_provisional_vs_final_variant_divergence
        grounds:
          - calculations.e911_fee_assessment
          - entities.FeeAssessment.fields.variant
          - entities.FeeAssessment.fields.unit_fee_breakdown
          - state_machines.FeeAssessment.ASSESSED_to_VOIDED
          - state_machines.FeeAssessment.ASSESSED_to_REMITTED
        distinguishing_aspect: |
          The PROVISIONAL variant prorates each billable unit by the days remaining in the month from
          that unit's own anchor, so three PER_LINE units anchored on the 1st, 17th and 17th of a
          31-day month at 175 cents produce amount_cents 345, while the FINAL variant produced by the
          remittance run charges the full 175 cents per unit for exactly the same three registrations
          and produces 525 - a 180-cent divergence on identical data.
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z; one ACTIVE account; one CA jurisdiction with fee_type PER_LINE, monthly_fee_cents 175, remit_day_of_month 5"
            - "one number block with three minted numbers, each assigned to its own device"
            - "device 1 has a VERIFIED registration with effective_from 2026-08-01T00:00:00Z (active_days 31)"
            - "devices 2 and 3 have VERIFIED registrations with effective_from 2026-08-17T10:00:00Z (active_days 15 each)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /voip/accounts"
              payload: { account_number: "ACCT0001", billing_name: "ACME CORP", service_state_code: "CA", status: "ACTIVE", intl_calling_enabled: false, intl_daily_cap_cents: 2000 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /voip/jurisdictions"
              payload: { state_code: "CA", county_fips: "06001", fee_type: "PER_LINE", monthly_fee_cents: 175, remit_day_of_month: 5 }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /voip/number-blocks"
              payload: { jurisdiction_id: "${jur_id}", npa_nxx: "415555", total_capacity: 20, max_concurrent_reservations: 5 }
              as: NumberingAdmin
              captures: { blk_id: $.data.id }
            - call: "POST /voip/number-blocks/${blk_id}/phone-numbers"
              payload: { line_number: "0101" }
              as: NumberingAdmin
              captures: { pn1_id: $.data.id }
            - call: "POST /voip/number-blocks/${blk_id}/phone-numbers"
              payload: { line_number: "0102" }
              as: NumberingAdmin
              captures: { pn2_id: $.data.id }
            - call: "POST /voip/number-blocks/${blk_id}/phone-numbers"
              payload: { line_number: "0103" }
              as: NumberingAdmin
              captures: { pn3_id: $.data.id }
            - call: "POST /voip/devices"
              payload: { account_id: "${acct_id}", mac_address: "AABBCC000001", device_type: "BASE_STATION", nomadic: false, assigned_number_id: "${pn1_id}" }
              as: AccountAdmin
              as_user_id: "${acct_id}"
              captures: { dev1_id: $.data.id }
            - call: "POST /voip/e911-registrations"
              payload: { device_id: "${dev1_id}", jurisdiction_id: "${jur_id}", address_line1: "100 MAIN ST", unit: "", city: "OAKLAND", state_code: "CA", postal_code: "94601" }
              as: AccountAdmin
              as_user_id: "${acct_id}"
              captures: { reg1_id: $.data.id }
            - call: "POST /voip/e911-registrations/${reg1_id}/verify"
              payload: { outcome: "VERIFIED" }
              as: E911Validator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-17T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /voip/devices"
              payload: { account_id: "${acct_id}", mac_address: "AABBCC000002", device_type: "HANDSET", nomadic: false, assigned_number_id: "${pn2_id}" }
              as: AccountAdmin
              as_user_id: "${acct_id}"
              captures: { dev2_id: $.data.id }
            - call: "POST /voip/e911-registrations"
              payload: { device_id: "${dev2_id}", jurisdiction_id: "${jur_id}", address_line1: "200 OAK AVE", unit: "3B", city: "OAKLAND", state_code: "CA", postal_code: "94602" }
              as: AccountAdmin
              as_user_id: "${acct_id}"
              captures: { reg2_id: $.data.id }
            - call: "POST /voip/e911-registrations/${reg2_id}/verify"
              payload: { outcome: "VERIFIED" }
              as: E911Validator
            - call: "POST /voip/devices"
              payload: { account_id: "${acct_id}", mac_address: "AABBCC000003", device_type: "SOFTPHONE", nomadic: false, assigned_number_id: "${pn3_id}" }
              as: AccountAdmin
              as_user_id: "${acct_id}"
              captures: { dev3_id: $.data.id }
            - call: "POST /voip/e911-registrations"
              payload: { device_id: "${dev3_id}", jurisdiction_id: "${jur_id}", address_line1: "300 PINE ST", unit: "", city: "OAKLAND", state_code: "CA", postal_code: "94603" }
              as: AccountAdmin
              as_user_id: "${acct_id}"
              captures: { reg3_id: $.data.id }
            - call: "POST /voip/e911-registrations/${reg3_id}/verify"
              payload: { outcome: "VERIFIED" }
              as: E911Validator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /voip/fee-assessments"
              payload: { account_id: "${acct_id}", jurisdiction_id: "${jur_id}", period_month: "2026-08" }
              as: BillingAdmin
              as_user_id: "billing-1"
              captures: { prov_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /voip/jurisdictions/${jur_id}/remittance-runs"
              payload: { period_month: "2026-08" }
              as: BillingAdmin
              as_user_id: "billing-2"
          assert:
            - "FeeAssessment.${prov_id}.variant == PROVISIONAL"
            - "FeeAssessment.${prov_id}.unit_basis == PER_LINE"
            - "FeeAssessment.${prov_id}.billable_units == 3"
            - "FeeAssessment.${prov_id}.unit_fee_breakdown == [175, 85, 85]"
            - "FeeAssessment.${prov_id}.amount_cents == 345"
            - "after the remittance run, FeeAssessment.${prov_id}.status == VOIDED and voided_by_user_id == 'system:remittance'"
            - "GET /voip/fee-assessments?account_id=${acct_id}&jurisdiction_id=${jur_id}&period_month=2026-08&variant=FINAL returns exactly 1 row with amount_cents == 525 and unit_fee_breakdown == [175, 175, 175]"
            - "that FINAL row has status == REMITTED and remitted_at == 2026-09-06T00:00:00Z"
            - "Jurisdiction.${jur_id}.pending_fee_cents == 0 and Jurisdiction.${jur_id}.remitted_fee_cents == 525"
            - "Account.${acct_id}.fee_liability_cents == 525"

      - name: fraud_score_realtime_vs_daily_review_variant_divergence
        grounds:
          - calculations.toll_fraud_risk_score
          - entities.CallAttempt.fields.realtime_risk_score
          - entities.Device.fields.toll_fraud_score
          - state_machines.Device.UNRESTRICTED_to_INTL_BLOCKED
          - state_machines.Device.INTL_BLOCKED_to_UNRESTRICTED
        distinguishing_aspect: |
          Over the exact same four call attempts to country codes 234, 252, 53 and 44, the REALTIME
          variant scores 69 (4 points per attempt, 6 per extra country, blocked rows retained) and so
          blocks the fourth attempt, while the DAILY_REVIEW variant scores 49 on the same device
          moments later (2 points per attempt, 4 per extra country, BLOCKED_FRAUD rows discarded) and
          therefore permits the unblock - a different entity domain (device call risk) from the
          FeeAssessment money variant instance.
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z when the device is created, so at attempt time the device is older than NEW_DEVICE_AGE_HOURS and the 1.5 multiplier does not apply"
            - "account ACTIVE with intl_calling_enabled true and intl_daily_cap_cents 100000 so the fiscal ceiling never fires"
            - "one non-nomadic device holding a number, with a VERIFIED E911 registration, calling_status UNRESTRICTED"
            - "clock moved to 2026-08-05T12:00:00Z and left there, so all attempts share one 60-minute REALTIME window and one UTC calendar day"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /voip/accounts"
              payload: { account_number: "ACCT0002", billing_name: "BOREAL LLC", service_state_code: "CA", status: "ACTIVE", intl_calling_enabled: true, intl_daily_cap_cents: 100000 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /voip/jurisdictions"
              payload: { state_code: "CA", county_fips: "06013", fee_type: "PER_LINE", monthly_fee_cents: 175, remit_day_of_month: 5 }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /voip/number-blocks"
              payload: { jurisdiction_id: "${jur_id}", npa_nxx: "415556", total_capacity: 20, max_concurrent_reservations: 5 }
              as: NumberingAdmin
              captures: { blk_id: $.data.id }
            - call: "POST /voip/number-blocks/${blk_id}/phone-numbers"
              payload: { line_number: "0201" }
              as: NumberingAdmin
              captures: { pn1_id: $.data.id }
            - call: "POST /voip/devices"
              payload: { account_id: "${acct_id}", mac_address: "AABBCC000011", device_type: "BASE_STATION", nomadic: false, assigned_number_id: "${pn1_id}" }
              as: AccountAdmin
              as_user_id: "${acct_id}"
              captures: { dev_id: $.data.id }
            - call: "POST /voip/e911-registrations"
              payload: { device_id: "${dev_id}", jurisdiction_id: "${jur_id}", address_line1: "10 BRIDGE RD", unit: "", city: "CONCORD", state_code: "CA", postal_code: "94520" }
              as: AccountAdmin
              as_user_id: "${acct_id}"
              captures: { reg_id: $.data.id }
            - call: "POST /voip/e911-registrations/${reg_id}/verify"
              payload: { outcome: "VERIFIED" }
              as: E911Validator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T12:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /voip/devices/${dev_id}/call-attempts"
              payload: { destination_e164: "+2348012345678", destination_country_code: "234", requested_duration_seconds: 60 }
              as: AccountAdmin
              as_user_id: "${acct_id}"
              captures: { ca1_id: $.data.id }
            - call: "POST /voip/devices/${dev_id}/call-attempts"
              payload: { destination_e164: "+252612345678", destination_country_code: "252", requested_duration_seconds: 60 }
              as: AccountAdmin
              as_user_id: "${acct_id}"
              captures: { ca2_id: $.data.id }
            - call: "POST /voip/devices/${dev_id}/call-attempts"
              payload: { destination_e164: "+5352345678", destination_country_code: "53", requested_duration_seconds: 60 }
              as: AccountAdmin
              as_user_id: "${acct_id}"
              captures: { ca3_id: $.data.id }
            - call: "POST /voip/devices/${dev_id}/call-attempts"
              payload: { destination_e164: "+447700900123", destination_country_code: "44", requested_duration_seconds: 60 }
              as: AccountAdmin
              as_user_id: "${acct_id}"
            - call: "POST /voip/devices/${dev_id}/calling-restrictions"
              payload: { action: "REVIEW_UNBLOCK", note: "manual review after burst" }
              as: SecurityAnalyst
              as_user_id: "analyst-1"
          assert:
            - "CallAttempt.${ca1_id}.realtime_risk_score == 34 and decision == ALLOWED"
            - "CallAttempt.${ca2_id}.realtime_risk_score == 49 and decision == ALLOWED"
            - "CallAttempt.${ca3_id}.realtime_risk_score == 59 and decision == ALLOWED"
            - "the fourth call-attempt POST returns 409 with error_id ERR_TOLL_FRAUD_THRESHOLD_BREACHED"
            - "GET /voip/devices/${dev_id}/call-attempts?decision=BLOCKED_FRAUD returns exactly 1 row whose realtime_risk_score == 69 and decision_error_id == 'ERR_TOLL_FRAUD_THRESHOLD_BREACHED'"
            - "Device.${dev_id}.fraud_block_count == 1"
            - "after REVIEW_UNBLOCK, Device.${dev_id}.toll_fraud_score == 49 (DAILY_REVIEW), not 69"
            - "Device.${dev_id}.calling_status == UNRESTRICTED"
            - "Device.${dev_id}.registration_status == REGISTERED"

  - rule_id: combinatorial_formula
    instances:
      - name: fee_proration_rounds_per_unit_before_summing
        grounds:
          - calculations.e911_fee_assessment
          - entities.FeeAssessment.fields.unit_fee_breakdown
          - entities.FeeAssessment.fields.amount_cents
          - entities.Jurisdiction.fields.monthly_fee_cents
        distinguishing_aspect: |
          Mode (b) - the pinned order of operations. Rounding each of the three per-unit prorations to
          whole cents BEFORE summing yields [175, 85, 85] = 345, whereas summing the exact fractions
          175*31/31 + 175*15/31 + 175*15/31 = 344.35 and rounding once at the end yields 344; the one
          cent of difference falsifies any implementation that rounds in the wrong order.
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z; CA jurisdiction PER_LINE at 175 cents per month; August 2026 has 31 days"
            - "three PER_LINE units: one anchored 2026-08-01 (active_days 31), two anchored 2026-08-17 (active_days 15 each)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /voip/accounts"
              payload: { account_number: "ACCT0003", billing_name: "CEDAR INC", service_state_code: "CA", status: "ACTIVE" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /voip/jurisdictions"
              payload: { state_code: "CA", county_fips: "06075", fee_type: "PER_LINE", monthly_fee_cents: 175, remit_day_of_month: 5 }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /voip/number-blocks"
              payload: { jurisdiction_id: "${jur_id}", npa_nxx: "415557", total_capacity: 20, max_concurrent_reservations: 5 }
              as: NumberingAdmin
              captures: { blk_id: $.data.id }
            - call: "POST /voip/number-blocks/${blk_id}/phone-numbers"
              payload: { line_number: "0301" }
              as: NumberingAdmin
              captures: { pn1_id: $.data.id }
            - call: "POST /voip/number-blocks/${blk_id}/phone-numbers"
              payload: { line_number: "0302" }
              as: NumberingAdmin
              captures: { pn2_id: $.data.id }
            - call: "POST /voip/number-blocks/${blk_id}/phone-numbers"
              payload: { line_number: "0303" }
              as: NumberingAdmin
              captures: { pn3_id: $.data.id }
            - call: "POST /voip/devices"
              payload: { account_id: "${acct_id}", mac_address: "AABBCC000021", device_type: "BASE_STATION", nomadic: false, assigned_number_id: "${pn1_id}" }
              as: AccountAdmin
              as_user_id: "${acct_id}"
              captures: { dev1_id: $.data.id }
            - call: "POST /voip/e911-registrations"
              payload: { device_id: "${dev1_id}", jurisdiction_id: "${jur_id}", address_line1: "1 FIRST ST", unit: "", city: "SAN FRANCISCO", state_code: "CA", postal_code: "94105" }
              as: AccountAdmin
              as_user_id: "${acct_id}"
              captures: { reg1_id: $.data.id }
            - call: "POST /voip/e911-registrations/${reg1_id}/verify"
              payload: { outcome: "VERIFIED" }
              as: E911Validator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-17T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /voip/devices"
              payload: { account_id: "${acct_id}", mac_address: "AABBCC000022", device_type: "HANDSET", nomadic: false, assigned_number_id: "${pn2_id}" }
              as: AccountAdmin
              as_user_id: "${acct_id}"
              captures: { dev2_id: $.data.id }
            - call: "POST /voip/e911-registrations"
              payload: { device_id: "${dev2_id}", jurisdiction_id: "${jur_id}", address_line1: "2 SECOND ST", unit: "", city: "SAN FRANCISCO", state_code: "CA", postal_code: "94105" }
              as: AccountAdmin
              as_user_id: "${acct_id}"
              captures: { reg2_id: $.data.id }
            - call: "POST /voip/e911-registrations/${reg2_id}/verify"
              payload: { outcome: "VERIFIED" }
              as: E911Validator
            - call: "POST /voip/devices"
              payload: { account_id: "${acct_id}", mac_address: "AABBCC000023", device_type: "SOFTPHONE", nomadic: false, assigned_number_id: "${pn3_id}" }
              as: AccountAdmin
              as_user_id: "${acct_id}"
              captures: { dev3_id: $.data.id }
            - call: "POST /voip/e911-registrations"
              payload: { device_id: "${dev3_id}", jurisdiction_id: "${jur_id}", address_line1: "3 THIRD ST", unit: "", city: "SAN FRANCISCO", state_code: "CA", postal_code: "94105" }
              as: AccountAdmin
              as_user_id: "${acct_id}"
              captures: { reg3_id: $.data.id }
            - call: "POST /voip/e911-registrations/${reg3_id}/verify"
              payload: { outcome: "VERIFIED" }
              as: E911Validator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /voip/fee-assessments"
              payload: { account_id: "${acct_id}", jurisdiction_id: "${jur_id}", period_month: "2026-08" }
              as: BillingAdmin
              as_user_id: "billing-3"
              captures: { fa_id: $.data.id }
          assert:
            - "FeeAssessment.${fa_id}.unit_fee_breakdown == [175, 85, 85]"
            - "FeeAssessment.${fa_id}.amount_cents == 345"
            - "FeeAssessment.${fa_id}.amount_cents != 344"
            - "FeeAssessment.${fa_id}.billable_units == 3"
            - "Jurisdiction.${jur_id}.pending_fee_cents == 345"

      - name: intl_surcharge_tier_keyed_on_subtotal_not_projected_total
        grounds:
          - calculations.international_spend_control
          - entities.CallAttempt.fields.day_subtotal_cents
          - entities.CallAttempt.fields.surcharge_pct_applied
          - entities.CallAttempt.fields.projected_day_total_cents
          - validations[priority=53]
        distinguishing_aspect: |
          Mode (c) - the pinned evaluation order that breaks an apparent circularity. The surcharge
          tier is selected from the surcharge-free day_subtotal_cents (2160 -> the 2000-cent tier ->
          5%), never from the projected total it helps produce; keying the tier on 2268 would still
          land on 5% here but keying it on the running total across attempts would not, so the third
          attempt must report day_subtotal_cents 2160, surcharge_pct_applied 5 and
          projected_day_total_cents 2268 - structurally different from the per-unit-then-sum rounding
          order pinned by the fee-proration instance.
        test_recipe:
          setup:
            - "account ACTIVE with intl_calling_enabled true and intl_daily_cap_cents 2268"
            - "one non-nomadic device holding a number with a VERIFIED registration, calling_status UNRESTRICTED"
            - "clock at 2026-08-05T12:00:00Z; the device was created 2026-08-01T00:00:00Z so no new-device multiplier applies"
            - "three 3600-second calls to country code 44 at 12 cents per minute produce 720 cents of base spend each"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /voip/accounts"
              payload: { account_number: "ACCT0004", billing_name: "DELTA WORKS", service_state_code: "CA", status: "ACTIVE", intl_calling_enabled: true, intl_daily_cap_cents: 2268 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /voip/jurisdictions"
              payload: { state_code: "CA", county_fips: "06085", fee_type: "PER_LINE", monthly_fee_cents: 175, remit_day_of_month: 5 }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /voip/number-blocks"
              payload: { jurisdiction_id: "${jur_id}", npa_nxx: "415558", total_capacity: 20, max_concurrent_reservations: 5 }
              as: NumberingAdmin
              captures: { blk_id: $.data.id }
            - call: "POST /voip/number-blocks/${blk_id}/phone-numbers"
              payload: { line_number: "0401" }
              as: NumberingAdmin
              captures: { pn1_id: $.data.id }
            - call: "POST /voip/devices"
              payload: { account_id: "${acct_id}", mac_address: "AABBCC000031", device_type: "BASE_STATION", nomadic: false, assigned_number_id: "${pn1_id}" }
              as: AccountAdmin
              as_user_id: "${acct_id}"
              captures: { dev_id: $.data.id }
            - call: "POST /voip/e911-registrations"
              payload: { device_id: "${dev_id}", jurisdiction_id: "${jur_id}", address_line1: "44 CAP WAY", unit: "", city: "SAN JOSE", state_code: "CA", postal_code: "95110" }
              as: AccountAdmin
              as_user_id: "${acct_id}"
              captures: { reg_id: $.data.id }
            - call: "POST /voip/e911-registrations/${reg_id}/verify"
              payload: { outcome: "VERIFIED" }
              as: E911Validator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T12:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /voip/devices/${dev_id}/call-attempts"
              payload: { destination_e164: "+447700900001", destination_country_code: "44", requested_duration_seconds: 3600 }
              as: AccountAdmin
              as_user_id: "${acct_id}"
              captures: { ca1_id: $.data.id }
            - call: "POST /voip/devices/${dev_id}/call-attempts"
              payload: { destination_e164: "+447700900002", destination_country_code: "44", requested_duration_seconds: 3600 }
              as: AccountAdmin
              as_user_id: "${acct_id}"
              captures: { ca2_id: $.data.id }
            - call: "POST /voip/devices/${dev_id}/call-attempts"
              payload: { destination_e164: "+447700900003", destination_country_code: "44", requested_duration_seconds: 3600 }
              as: AccountAdmin
              as_user_id: "${acct_id}"
              captures: { ca3_id: $.data.id }
          assert:
            - "CallAttempt.${ca1_id}.billable_minutes == 60 and rate_cents_per_minute == 12 and estimated_base_cents == 720"
            - "CallAttempt.${ca1_id}.day_subtotal_cents == 720 and surcharge_pct_applied == 0 and projected_day_total_cents == 720"
            - "CallAttempt.${ca2_id}.day_subtotal_cents == 1440 and surcharge_pct_applied == 0 and projected_day_total_cents == 1440"
            - "CallAttempt.${ca3_id}.day_subtotal_cents == 2160 and surcharge_pct_applied == 5 and projected_day_total_cents == 2268"
            - "CallAttempt.${ca3_id}.decision == ALLOWED and decision_error_id == null"
            - "CallAttempt.${ca3_id}.realtime_risk_score == 17"

  - rule_id: non_linear_state_machine
    instances:
      - name: port_request_cycles_csr_mismatch_back_to_submitted_then_validates
        grounds:
          - state_machines.PortRequest.SUBMITTED_to_CSR_MISMATCH
          - state_machines.PortRequest.CSR_MISMATCH_to_SUBMITTED
          - state_machines.PortRequest.SUBMITTED_to_VALIDATED
          - calculations.csr_match_evaluation
          - entities.PortRequest.fields.resubmission_count
          - concurrency_rules[csr-snapshot-create-stale-port-request]
        distinguishing_aspect: |
          The PortRequest machine is cyclic: a STRICT carrier snapshot scoring 70 of 100 drives
          SUBMITTED -> CSR_MISMATCH, a resubmission drives CSR_MISMATCH -> SUBMITTED (a backwards edge
          that re-enters an already-visited state and increments resubmission_count to 1 while
          resetting last_match_points to null), and a second snapshot scoring 100 then drives
          SUBMITTED -> VALIDATED - the same state visited twice with different outcomes.
        test_recipe:
          setup:
            - "clock at 2026-08-03T09:00:00Z (a Monday)"
            - "one ACTIVE account and one STRICT carrier with foc_business_days 3 and porting_buffer_minutes 60"
            - "one SUBMITTED port request filed by X-User-ID 'porting-1' claiming pin '9182'"
            - "the losing carrier's record has pin '0000' on file and matches on the other four compared fields"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /voip/accounts"
              payload: { account_number: "ACCT0005", billing_name: "EVERGREEN CO", service_state_code: "CA", status: "ACTIVE" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /voip/carriers"
              payload: { name: "Legacy Telco", ocn: "LT01", csr_match_policy: "STRICT", porting_buffer_minutes: 60, foc_business_days: 3 }
              as: PlatformAdmin
              captures: { car_id: $.data.id }
            - call: "POST /voip/port-requests"
              payload: { account_id: "${acct_id}", losing_carrier_id: "${car_id}", requested_numbers: ["+14155550001"], claimed_account_number: "CSR-ACC-001", claimed_pin: "9182", claimed_billing_name: "EVERGREEN CO", claimed_address_line1: "500 CEDAR ST", claimed_zip: "94601" }
              as: PortingSpecialist
              as_user_id: "porting-1"
              captures: { pr_id: $.data.id, pr_v1: $.data.version }
          trigger:
            - call: "POST /voip/port-requests/${pr_id}/csr-snapshots"
              payload: { account_number_on_file: "CSR-ACC-001", pin_on_file: "0000", billing_name_on_file: "EVERGREEN CO", address_line1_on_file: "500 CEDAR ST", zip_on_file: "94601", expected_port_request_version: "${pr_v1}" }
              as: CarrierLiaison
              as_user_id: "liaison-1"
              captures: { snap1_id: $.data.id }
            - call: "POST /voip/port-requests/${pr_id}/resubmit"
              payload: { claimed_account_number: "CSR-ACC-001", claimed_pin: "0000", claimed_billing_name: "EVERGREEN CO", claimed_address_line1: "500 CEDAR ST", claimed_zip: "94601" }
              as: PortingSpecialist
              as_user_id: "porting-1"
            - call: "GET /voip/port-requests/${pr_id}"
              payload: {}
              as: PortingSpecialist
              as_user_id: "porting-1"
              captures: { pr_v2: $.data.version }
            - call: "POST /voip/port-requests/${pr_id}/csr-snapshots"
              payload: { account_number_on_file: "CSR-ACC-001", pin_on_file: "0000", billing_name_on_file: "EVERGREEN CO", address_line1_on_file: "500 CEDAR ST", zip_on_file: "94601", expected_port_request_version: "${pr_v2}" }
              as: CarrierLiaison
              as_user_id: "liaison-1"
              captures: { snap2_id: $.data.id }
          assert:
            - "CarrierAccountSnapshot.${snap1_id}.match_points == 70 and threshold_applied == 100 and match_status == MISMATCHED"
            - "CarrierAccountSnapshot.${snap1_id}.mismatch_fields == ['pin']"
            - "immediately after the first snapshot, PortRequest.${pr_id}.status == CSR_MISMATCH and last_match_points == 70"
            - "immediately after the resubmit, PortRequest.${pr_id}.status == SUBMITTED, resubmission_count == 1, last_match_points == null, last_mismatch_fields == [] and validated_at == null"
            - "CarrierAccountSnapshot.${snap1_id}.superseded_at == 2026-08-03T09:00:00Z"
            - "CarrierAccountSnapshot.${snap2_id}.match_points == 100 and match_status == MATCHED and mismatch_fields == []"
            - "PortRequest.${pr_id}.status == VALIDATED, validated_at == 2026-08-03T09:00:00Z and earliest_cutover_at == 2026-08-06T00:00:00Z"
            - "GET /voip/port-requests/${pr_id}/csr-snapshots returns exactly 2 rows"

      - name: device_registration_and_calling_dimensions_advance_independently
        grounds:
          - state_machines.Device.UNRESTRICTED_to_INTL_BLOCKED
          - state_machines.Device.REGISTERED_to_RELOCATION_DETECTED
          - entities.Device.fields.registration_status
          - entities.Device.fields.calling_status
          - calculations.relocation_drift_class
        distinguishing_aspect: |
          A single Device carries two independent state dimensions: a SecurityAnalyst BLOCK_INTL moves
          calling_status UNRESTRICTED -> INTL_BLOCKED while registration_status stays REGISTERED, and a
          subsequent CROSS_JURISDICTION network report moves registration_status REGISTERED ->
          RELOCATION_DETECTED while calling_status stays INTL_BLOCKED - neither trigger resets or
          overwrites the other dimension, which a single flattened status field cannot express.
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z; one ACTIVE account in CA"
            - "one nomadic device holding a number, with a VERIFIED CA registration, so registration_status == REGISTERED and calling_status == UNRESTRICTED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /voip/accounts"
              payload: { account_number: "ACCT0006", billing_name: "FIRWOOD LTD", service_state_code: "CA", status: "ACTIVE", intl_calling_enabled: true, intl_daily_cap_cents: 100000 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /voip/jurisdictions"
              payload: { state_code: "CA", county_fips: "06001", fee_type: "PER_LINE", monthly_fee_cents: 175, remit_day_of_month: 5 }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /voip/number-blocks"
              payload: { jurisdiction_id: "${jur_id}", npa_nxx: "415559", total_capacity: 20, max_concurrent_reservations: 5 }
              as: NumberingAdmin
              captures: { blk_id: $.data.id }
            - call: "POST /voip/number-blocks/${blk_id}/phone-numbers"
              payload: { line_number: "0501" }
              as: NumberingAdmin
              captures: { pn1_id: $.data.id }
            - call: "POST /voip/devices"
              payload: { account_id: "${acct_id}", mac_address: "AABBCC000041", device_type: "SOFTPHONE", nomadic: true, assigned_number_id: "${pn1_id}" }
              as: AccountAdmin
              as_user_id: "${acct_id}"
              captures: { dev_id: $.data.id }
            - call: "POST /voip/e911-registrations"
              payload: { device_id: "${dev_id}", jurisdiction_id: "${jur_id}", address_line1: "700 ELM ST", unit: "", city: "OAKLAND", state_code: "CA", postal_code: "94601" }
              as: AccountAdmin
              as_user_id: "${acct_id}"
              captures: { reg_id: $.data.id }
            - call: "POST /voip/e911-registrations/${reg_id}/verify"
              payload: { outcome: "VERIFIED" }
              as: E911Validator
          trigger:
            - call: "POST /voip/devices/${dev_id}/calling-restrictions"
              payload: { action: "BLOCK_INTL", note: "carrier abuse alert" }
              as: SecurityAnalyst
              as_user_id: "analyst-2"
            - call: "POST /voip/devices/${dev_id}/network-reports"
              payload: { reported_state_code: "NV", reported_postal_code: "89101" }
              as: AccountAdmin
              as_user_id: "${acct_id}"
          assert:
            - "immediately after BLOCK_INTL, Device.${dev_id}.calling_status == INTL_BLOCKED and Device.${dev_id}.registration_status == REGISTERED"
            - "immediately after BLOCK_INTL, E911Registration.${reg_id}.verification_status == VERIFIED"
            - "after the network report, Device.${dev_id}.registration_status == RELOCATION_DETECTED"
            - "after the network report, Device.${dev_id}.calling_status == INTL_BLOCKED (unchanged by the relocation)"
            - "Device.${dev_id}.reported_state_code == 'NV' and reported_postal_code == '89101' and last_network_report_at == 2026-08-01T00:00:00Z"
            - "E911Registration.${reg_id}.verification_status == STALE"
            - "Account.${acct_id}.e911_compliance_posture == AT_RISK"

  - rule_id: transitive_cascade
    instances:
      - name: port_reject_cascades_slot_bridge_reservation_number_and_block_census
        grounds:
          - state_machines.PortRequest.SCHEDULED_to_REJECTED
          - state_machines.CutoverSlot.BOOKED_to_RELEASED
          - state_machines.TemporaryBridge.PROVISIONED_to_ORPHANED
          - state_machines.NumberReservation.CONSUMED_to_RELEASED
          - state_machines.PhoneNumber.RESERVED_to_PARKED
          - calculations.number_inventory_census
        distinguishing_aspect: |
          One POST /voip/port-requests/{id}/reject propagates five levels deep: PortRequest -> the
          booked CutoverSlot (RELEASED) -> the TemporaryBridge (ORPHANED) -> its NumberReservation
          (RELEASED with released_reason BRIDGE_ORPHANED) -> the PhoneNumber (PARKED with
          parked_until 2026-08-10T09:00:00Z) -> the NumberBlock census counters, and a single
          missing hop leaves the census invariant intact but a counter wrong.
