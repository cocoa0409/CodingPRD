              as: EligibilityOfficer
              as_user_id: "officer-a"
            - call: "POST /roster-slots/${rs_c_id}/verify-enrollment"
              payload: { enrollment_document_ref: "REG-C", verified_birthdate: "2009-07-20" }
              as: EligibilityOfficer
              as_user_id: "officer-a"
            - call: "POST /roster-slots/${rs_a_id}/verify-academics"
              payload: {}
              as: EligibilityOfficer
              as_user_id: "officer-b"
            - call: "POST /roster-slots/${rs_b_id}/verify-academics"
              payload: {}
              as: EligibilityOfficer
              as_user_id: "officer-b"
            - call: "POST /roster-slots/${rs_c_id}/verify-academics"
              payload: {}
              as: EligibilityOfficer
              as_user_id: "officer-b"
            - call: "POST /teams/${tm_a_id}/register"
              payload: {}
              as: Coach
              as_user_id: "${c_a_id}"
            - call: "POST /teams/${tm_b_id}/register"
              payload: {}
              as: Coach
              as_user_id: "${c_b_id}"
            - call: "POST /teams/${tm_c_id}/register"
              payload: {}
              as: Coach
              as_user_id: "${c_c_id}"
            - call: "POST /teams/${tm_a_id}/roster-lock"
              payload: {}
              as: Coach
              as_user_id: "${c_a_id}"
            - call: "POST /teams/${tm_b_id}/roster-lock"
              payload: {}
              as: Coach
              as_user_id: "${c_b_id}"
            - call: "POST /teams/${tm_c_id}/roster-lock"
              payload: {}
              as: Coach
              as_user_id: "${c_c_id}"
            - call: "POST /seasons/${se_id}/advance"
              payload: { to_status: "ROSTER_LOCKED" }
              as: LeagueAdmin
            - call: "POST /seasons/${se_id}/advance"
              payload: { to_status: "REGULAR_SEASON" }
              as: LeagueAdmin
            - call: "POST /matches"
              payload: { season_id: "${se_id}", home_team_id: "${tm_a_id}", away_team_id: "${tm_c_id}", scheduled_start_at: "2026-09-25T18:00:00.000Z" }
              as: LeagueAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /matches"
              payload: { season_id: "${se_id}", home_team_id: "${tm_a_id}", away_team_id: "${tm_b_id}", scheduled_start_at: "2026-09-25T19:00:00.000Z" }
