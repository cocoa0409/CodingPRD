            - "all five denied attempts return HTTP 403"
            - "${desk_employer_error} == ERR_ROLE_NOT_PERMITTED"
            - "${pay_category_error} == ERR_ROLE_NOT_PERMITTED"
            - "${rev_lock_error} == ERR_ROLE_NOT_PERMITTED"
            - "${admin_media_error} == ERR_ROLE_NOT_PERMITTED"
            - "${admin_batch_error} == ERR_ROLE_NOT_PERMITTED"
            - "the employer list carries total_count 1 and ${employer_head} == Deny Matrix Co - 'Desk Sneak Co' was never persisted"
            - "ElectionWindow.${win_id}.status is still SCHEDULED"

      - name: employee_acting_on_another_employees_records_is_rejected
