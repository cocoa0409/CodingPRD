              as: IsoAdmin
              captures: { adv: $.data.id }
            - call: "POST /merchants"
              payload: { owning_agent_id: "${a1}", processor_program_id: "${p1}", mid: "MID-9001", monthly_minimum_cents: 0, per_transaction_fee_cents: 10, equipment_lease_monthly_cents: 0, boarded_on: "2026-04-10" }
              as: IsoAdmin
              captures: { m1: $.data.id }
            - call: "POST /merchants"
              payload: { owning_agent_id: "${a1}", processor_program_id: "${p1}", mid: "MID-9002", monthly_minimum_cents: 0, per_transaction_fee_cents: 10, equipment_lease_monthly_cents: 0, boarded_on: "2026-04-10" }
              as: IsoAdmin
              captures: { m2: $.data.id }
            - call: "POST /merchants"
              payload: { owning_agent_id: "${a1}", processor_program_id: "${p1}", mid: "MID-9003", monthly_minimum_cents: 0, per_transaction_fee_cents: 10, equipment_lease_monthly_cents: 0, boarded_on: "2026-04-10" }
              as: IsoAdmin
              captures: { m3: $.data.id }
            - call: "POST /merchants"
              payload: { owning_agent_id: "${a1}", processor_program_id: "${p1}", mid: "MID-9004", monthly_minimum_cents: 0, per_transaction_fee_cents: 10, equipment_lease_monthly_cents: 0, boarded_on: "2026-04-10", upfront_bonus_cents: 27000 }
              as: IsoAdmin
              captures: { m4: $.data.id }
            - call: "POST /merchants/${m2}/activate"
              payload: {}
              as: IsoAdmin
            - call: "POST /merchants/${m3}/activate"
              payload: {}
              as: IsoAdmin
            - call: "POST /merchants/${m4}/activate"
              payload: {}
              as: IsoAdmin
            - call: "POST /merchants/${m4}/attrite"
              payload: { attrition_date: "2026-07-01" }
              as: IsoAdmin
            - call: "POST /residual-batches"
              payload: { processor_program_id: "${p1}", period_month: "2026-07", coverage_start: "2026-07-01", coverage_end: "2026-08-01", file_checksum: "sha256:ps-0001" }
              as: ResidualAnalyst
              captures: { b1: $.data.id }
            - call: "POST /residual-batches/${b1}/lines"
              payload: { merchant_id: "${m2}", transaction_count: 100, sales_volume_cents: 1000000, interchange_cents: 0, assessments_cents: 0, gross_income_cents: 45100 }
              as: ResidualAnalyst
            - call: "POST /residual-batches/${b1}/normalize"
              payload: {}
              as: ResidualAnalyst
            - call: "POST /residual-batches/${b1}/post"
              payload: {}
              as: ResidualController
          trigger:
            - call: "GET /agents/${a1}/portfolio-summary"
              payload: {}
              as: ResidualController
          assert:
            - "the response carries exactly the ten declared fields with agent_id == ${a1}"
            - "portfolio_merchant_count == 4 — PENDING M1 counts here"
            - "active_merchant_count == 2 (${m2}, ${m3}) and attrited_merchant_count == 1 (${m4})"
            - "portfolio_attrition_bps == 3333 == round_half_up(10000 x 1 / 3) — the PENDING merchant is excluded from BOTH numerator and denominator"
            - "residual_hold == true because 3333 >= ATTRITION_HOLD_THRESHOLD_BPS 2500"
            - "vested_pct == 50 — 30 whole months from 2024-01-15 to the 2026-08-01 clock, so 25 x floor(30 / 12)"
            - "trailing_residual_cents == 20000 — the single 2026-07 statement's gross_after_trueup_cents, not its net_payable_cents of 1200"
            - "advance_outstanding_cents == 200000 (AgentAdvance.${adv} is ACTIVE and its window has not opened) and lifetime_clawback_cents == 18800"
            - "every field equals the same-named field on GET /agents/${a1}, and the statement shows adjustment_cents -18800 with net_payable_cents 1200"

      - name: reassign_agent_links_two_agents_and_moves_the_portfolio_counters
        claim_type: Cross-reference link
        grounds:
          - endpoints.POST /merchants/{id}/reassign-agent
          - validations[priority 7 / ERR_REFERENCED_AGENT_NOT_FOUND]
          - validations[priority 9 / ERR_AGENT_STATE_INVALID]
          - validations[priority 9 / ERR_MERCHANT_STATE_INVALID]
        distinguishing_aspect: "Both ends of the link are validated before anything moves: an unknown new_agent_id is a 404 body-reference error, a DEPARTURE_NOTICE target is an agent-state error, and an ATTRITED merchant is a merchant-state error — and only then does the accepted call move owning_agent_id, decrement the old owner's portfolio_merchant_count, increment the new owner's, and recompute BOTH agents' attrition."
