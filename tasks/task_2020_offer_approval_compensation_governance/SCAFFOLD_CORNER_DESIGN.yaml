              as_user_id: hm-1
            - call: "POST /api/offers/${offer_id}/letters"
              payload: {}
              as: Recruiter
              as_user_id: rec-1
            - call: "POST /api/offers/${offer_id}/extend"
              payload: {}
              as: Recruiter
              as_user_id: rec-1
            - call: "GET /api/offers/${offer_id}"
              as: Recruiter
              as_user_id: rec-1
              captures: { ov: $.data.version }
            - call: "POST /api/offers/${offer_id}/negotiation-rounds"
              payload: { expected_offer_version: "${ov}", proposed_base_cents: 20500000 }
              as: Recruiter
              as_user_id: rec-1
              captures: { round_id: $.data.id }
            - call: "POST /api/negotiation-rounds/${round_id}/decision"
              payload: { outcome: REJECTED }
              as: Recruiter
              as_user_id: rec-1
          trigger:
            - call: "POST /api/negotiation-rounds/${round_id}/decision"
              payload: { outcome: ACCEPTED }
              as: VPPeople
              as_user_id: vp-1
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ROUND_NOT_PENDING 409 (round is REJECTED, terminal for decisions)"
            - "offer remains EXTENDED with base_cents 20000000"

      - name: salary_range_incoherent_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_SALARY_RANGE_INVALID]"]
        distinguishing_aspect: "Requisition with salary_min 18000000 > salary_mid 15000000 violates range coherence: ERR_SALARY_RANGE_INVALID 422 at create."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/requisitions"
              payload: { title: "Bad Range", department: "ENG", role_level: L5, geo_tier: T1, annual_budget_cents: 50000000, salary_min_cents: 18000000, salary_mid_cents: 15000000, salary_max_cents: 21000000, headcount_authorized: 1 }
              as: HiringManager
              as_user_id: hm-1
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SALARY_RANGE_INVALID 422; no requisition persisted"
