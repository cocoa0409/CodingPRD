            - "DeckFinding.${f1}.completed_at == 2026-08-01T00:00:00Z"
            - "ReroofProject.${p1}.scoped_upgrade_cost_cents == 106720"
            - "ReroofProject.${p1}.phase == INTAKE (the DECK_WORK to REINSTALL evaluation is a no-op from INTAKE)"

  - section: cross_cutting_complexity_layers
    instances:
      - name: corner_stale_expected_project_version_on_a_sourcing_order_is_412_then_succeeds_after_reread
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.sourcing-order-create-stale-project
          - errors.ERR_STALE_PROJECT_VERSION
          - endpoints["POST /reroof/sourcing-orders"]
        distinguishing_aspect: "The version the coordinator read is invalidated by a write that has nothing to do with sourcing, so the order is refused with 412 even though every business precondition holds; re-reading the project and resubmitting the identical body succeeds, and the accepted order itself bumps the version again - so the same stale token can never be replayed."
