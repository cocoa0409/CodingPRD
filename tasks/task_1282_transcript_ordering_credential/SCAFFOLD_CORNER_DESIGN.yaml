      - name: err_not_found_triggerable
        claim_type: triggerable
        grounds: ["errors[ERR_NOT_FOUND]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_vs_business_fiscal_cancel_captured_order
          rationale: "Covered by entities section student_get_not_found_returns_404."

      - name: err_invalid_state_triggerable
        claim_type: triggerable
        grounds: ["errors[ERR_INVALID_STATE]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_vs_business_fiscal_cancel_captured_order
          rationale: "State-machine section covers invalid transitions and terminal lockdown; difficulty instance covers priority interaction."

      - name: err_stale_version_triggerable
        claim_type: triggerable
        grounds: ["errors[ERR_STALE_VERSION]", "concurrency_rules[order-submit-stale-version]"]
        distinguishing_aspect: "Submitting with a stale expected_order_version returns 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["DRAFT order at version 2 after one line-item add"]
          setup_api_calls:
            - call: "POST /registrar/_clock/set_current_utc"
