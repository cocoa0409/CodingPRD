        claim_type: immediate
        grounds:
          - endpoints.POST_/payout-periods/{id}/net-settlement
          - response_envelope.success
        excluded_because:
          difficulty_instance: combinatorial_formula / net_settlement_waterfall_evaluation_order_and_override_basis
          rationale: "The same-request visibility of the pinned net settlement, pass-through and coverage amounts is asserted directly by that §1.8 instance, which reads all four fields back out of the settlement response."# ===========================================================================
  - section: rbac
    instances:

      - name: compliance_officer_cannot_open_a_payout_period
        claim_type: violation_to_error
        grounds:
          - roles[BranchManager].exclusive_operations
          - roles[ComplianceOfficer].shared_operations
          - validations[priority=2]
          - endpoints.POST_/payout-periods
        distinguishing_aspect: "Opening a payout period is exclusive to BranchManager, so a ComplianceOfficer request is refused with 403 ERR_UNAUTHORIZED while the identical body succeeds for a BranchManager."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Branch SUP-1 exists and no period is on file for September 2026."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /branches"
              payload: { branch_code: "SUP-1", name: "Superset Wealth", transmittal_account: "TA-4471", osj_name: "Superset OSJ" }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /payout-periods"
              payload: { branch_code: "SUP-1", year: 2026, month: 9, period_index: 1 }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_UNAUTHORIZED"
            - "GET /payout-periods returns 0 rows after the refused call"
            - "the same call issued as BranchManager returns 201 and GET /payout-periods returns 1 row"

