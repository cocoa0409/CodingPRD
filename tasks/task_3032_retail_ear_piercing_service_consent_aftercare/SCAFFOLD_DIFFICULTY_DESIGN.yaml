  - rule_id: non_linear_state_machine
    instances:

      - name: certification_resubmission_loop_reenters_expiring_soon
        grounds:
          - state_machines.CertificationRecord.EXPIRING_SOON_to_RECERTIFICATION_PENDING
          - state_machines.CertificationRecord.RECERTIFICATION_PENDING_to_EXPIRING_SOON
          - state_machines.CertificationRecord.EXPIRED_to_VALID
          - validations[priority=10]
        distinguishing_aspect: |
          The CertificationRecord machine is cyclic and returns to a state it already occupied: a
          failed practical (EXPIRING_SOON -> RECERTIFICATION_PENDING) followed by a retry
          (RECERTIFICATION_PENDING -> EXPIRING_SOON) re-enters EXPIRING_SOON with
          attempted_practical_count advanced, which no linear A->B->C->D pipeline can express.
        test_recipe:
          setup:
            - "Logical clock 2026-09-05T00:00:00Z. Jurisdiction IL. Store S1. Piercer P1 ACTIVE with a STANDARD certification issued 2025-11-01 and expiring 2026-11-01, so recertification_due_at is 2026-10-01."
