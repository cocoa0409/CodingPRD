      - name: withdrawn_claim_is_terminal_and_cannot_be_resubmitted
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.PlaClaim.assessment_status.terminal_states
          - state_machines.Portfolio.transitions.DRAFT_to_VOIDED
          - validations[priority 14]
          - errors[ERR_CLAIM_ALREADY_TERMINAL]
          - endpoints[POST /pla-claims/{claim_id}/withdraw]
        distinguishing_aspect: |
          Once withdrawn from DRAFT the claim is terminal: submit, withdraw again
          and request-revision all return HTTP 409 ERR_CLAIM_ALREADY_TERMINAL
          (priority 14 fires before the priority 15 not-DRAFT check), and the
          child Portfolio is left VOIDED rather than being resurrectable.
        test_recipe:
          setup:
            - "Program BSCS, Course CS150, Student S-1001."
            - "A DRAFT PORTFOLIO claim with a DRAFT portfolio attached, then withdrawn."
          setup_api_calls:
            - call: "POST /programs"
              payload: { program_code: "BSCS", title: "BS Computer Science", total_credits_required: 120, residency_min_credits: 30, pla_max_credits: 30, pla_max_pct_bp: 2500, pla_upper_division_max_credits: 6, allowed_source_types: ["CREDIT_BY_EXAM", "PORTFOLIO", "MILITARY_TRAINING", "INDUSTRY_CREDENTIAL"], status: "ACTIVE" }
              as: PlaCoordinator
              captures: { prog_id: "$.data.id" }
            - call: "POST /courses"
              payload: { course_code: "CS150", title: "Intro Programming", department_code: "CS", credits: 6, level: "LOWER", pla_eligible: true, learning_outcomes: [{ outcome_code: "OC1", description: "Design a program", weight_bp: 8000, mastery_threshold_bp: 7000 }, { outcome_code: "OC2", description: "Test a program", weight_bp: 2000, mastery_threshold_bp: 7000 }] }
              as: PlaCoordinator
              captures: { course_id: "$.data.id" }
            - call: "POST /students"
              payload: { student_number: "S-1001", full_name: "Ada Reyes", program_id: "${prog_id}", enrollment_status: "MATRICULATED", transfer_credits_accepted: 0, institutional_credits_earned: 60 }
              as: PlaCoordinator
              captures: { stu_id: "$.data.id" }
            - call: "POST /pla-claims"
              payload: { student_id: "${stu_id}", course_id: "${course_id}", source_type: "PORTFOLIO", credits_requested: 6 }
              as: Student
              as_user_id: "${stu_id}"
              captures: { claim_id: "$.data.id" }
            - call: "POST /portfolios"
              payload: { claim_id: "${claim_id}", narrative: "Eight years of production Python" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { pf_id: "$.data.id" }
            - call: "POST /pla-claims/${claim_id}/withdraw"
              payload: { withdraw_reason: "Student enrolled in the course instead" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { withdrawn_status: "$.data.assessment_status" }
          trigger:
            - call: "POST /pla-claims/${claim_id}/submit"
              as: Student
              as_user_id: "${stu_id}"
              captures: { err_submit: "$.data.error_id" }
            - call: "POST /pla-claims/${claim_id}/withdraw"
              payload: { withdraw_reason: "Second attempt" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { err_withdraw: "$.data.error_id" }
            - call: "POST /pla-claims/${claim_id}/request-revision"
              payload: { revision_note: "Please add evidence" }
              as: PlaCoordinator
              captures: { err_revision: "$.data.error_id" }
          assert:
            - "all three trigger calls return HTTP status == 409 with error_id == ERR_CLAIM_ALREADY_TERMINAL"
            - "PlaClaim.${claim_id}.assessment_status is still WITHDRAWN after all three attempts"
            - "PlaClaim.${claim_id}.revision_round == 0"
            - "Portfolio.${pf_id}.status == VOIDED (cascaded by the withdraw, never restored)"
            - "PlaClaim.${claim_id}.fee_status is still UNBILLED — no invoice was ever created for a claim withdrawn from DRAFT"
            - "Student.${stu_id}.pla_credits_reserved == 0"

      - name: recommendation_publish_moves_draft_to_published
        claim_type: valid_transition
        grounds:
          - state_machines.CredentialRecommendation.transitions.DRAFT_to_PUBLISHED
          - entities.CredentialRecommendation.fields.terms_version
          - endpoints[POST /credential-recommendations/{recommendation_id}/publish]
        distinguishing_aspect: |
          POST /credential-recommendations/{recommendation_id}/publish moves DRAFT
          -> PUBLISHED, bumps the generic version from 1 to 2 and deliberately
          leaves terms_version at 1, so no ArticulationRule pin is invalidated by
          publication.
        test_recipe:
          setup:
            - "A DRAFT CredentialRecommendation AWS-SAA (INDUSTRY_CREDENTIAL, 3 credits, LOWER, effective_from 2026-01-01T00:00:00Z)."
          setup_api_calls:
            - call: "POST /credential-recommendations"
              payload: { source_type: "INDUSTRY_CREDENTIAL", credential_code: "AWS-SAA", title: "AWS Solutions Architect Associate", issuing_body: "ACE", recommended_credits: 3, recommended_level: "LOWER", effective_from: "2026-01-01T00:00:00Z" }
              as: ArticulationOfficer
              captures: { rec_id: "$.data.id", rec_v0: "$.data.version", rec_tv0: "$.data.terms_version" }
          trigger:
            - call: "POST /credential-recommendations/${rec_id}/publish"
              as: ArticulationOfficer
              captures: { rec_status: "$.data.status", rec_v1: "$.data.version", rec_tv1: "$.data.terms_version" }
          assert:
            - "HTTP status == 200"
            - "CredentialRecommendation.${rec_id}.status == PUBLISHED"
            - "CredentialRecommendation.${rec_id}.version == 2 (was 1)"
            - "CredentialRecommendation.${rec_id}.terms_version == 1 — publish is not a terms change"
            - "CredentialRecommendation.${rec_id}.approved_rule_count == 0"
            - "CredentialRecommendation.${rec_id}.retire_reason == null"

      - name: portfolio_cyclic_revision_loop_and_round_limit
        claim_type: cyclic_shape
        grounds:
          - state_machines.Portfolio.transitions.REVISION_REQUESTED_to_SUBMITTED
          - validations[priority 33]
        excluded_because:
          difficulty_instance: non_linear_state_machine / portfolio_revision_cycle_reenters_submitted_twice_then_limit_blocks
          rationale: "That §1.8 instance drives Portfolio SUBMITTED -> REVISION_REQUESTED -> SUBMITTED twice and then asserts ERR_REVISION_LIMIT_REACHED at MAX_REVISION_ROUNDS 2, which is exactly the cyclic-shape claim."

      - name: recommendation_retire_cascade_down_to_children
        claim_type: cascade_down
        grounds:
          - endpoints[POST /credential-recommendations/{recommendation_id}/retire]
          - state_machines.ArticulationRule.transitions.APPROVED_to_SUSPENDED
        excluded_because:
          difficulty_instance: transitive_cascade / recommendation_retire_four_hop_cascade_to_invoice_and_student_ledger
          rationale: "The four-hop cascade asserted there is the cascade-down claim end to end: recommendation -> rules -> claims -> assignments and invoice -> Student ledger, including the deliberate exemption of SCORED claims."

      - name: transcript_reversal_compensation_leaves_no_drift
        claim_type: compensation
        grounds:
          - state_machines.PlaClaim.credit_status.transitions.POSTED_to_REVERSED
          - calculations.cap_unblock_waterfall
        excluded_because:
          difficulty_instance: compensating_invariant / transcript_reversal_restores_ledger_exactly_and_unblocks_only_the_upper_division_hold
          rationale: "That instance reconciles every counter before and after the reversal and proves reserved_inclusive consumption is unchanged, which is the compensation claim with zero drift."

      - name: assignment_creation_guarded_by_cross_entity_fee_state
        claim_type: cross_entity
        grounds:
          - validations[priority 42]
          - endpoints[POST /pla-claims/{claim_id}/assessor-assignments]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / assessor_assignment_gated_by_fee_status_on_a_separate_invoice_aggregate
          rationale: "The guarded transition SUBMITTED -> UNDER_ASSESSMENT only when the FeeInvoice aggregate is settled is asserted there in both polarities."

      - name: withdraw_ledger_sync_to_student_counters
        claim_type: ledger_sync
        grounds:
          - endpoints[POST /pla-claims/{claim_id}/withdraw]
          - calculations.cap_unblock_waterfall
        excluded_because:
          difficulty_instance: transitive_cascade / withdraw_cascade_waterfall_skips_oversized_then_unblocks_smaller_claim
          rationale: "Student.pla_credits_reserved is reconciled before and after the withdraw there, together with the first-fit waterfall order over the CAP_BLOCKED siblings."

  # =====================================================================
  # 3. CALCULATIONS
  # =====================================================================
  - section: calculations
    instances:
      - name: assignment_sla_state_boundaries_are_inclusive_on_both_rungs
        claim_type: threshold_boundary
        grounds:
          - calculations.assignment_sla_state
          - calculations.assessment_sla_due_at
          - entities.AssessorAssignment.fields.elapsed_bp
          - entities.AssessorAssignment.fields.sla_state
          - endpoints[GET /assessor-assignments/{assignment_id}]
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: |
          For a PORTFOLIO assignment with sla_hours 240 assigned at
          2026-08-01T00:00:00Z, four clock positions give elapsed_bp 7000 / 8000 /
          9000 / 10000 and sla_state ON_TRACK / AT_RISK / AT_RISK / BREACHED: both
          comparisons are >= so exactly 8000 is AT_RISK and exactly 10000 is
          BREACHED, and no sweep is needed for a read to reflect it.
        test_recipe:
          setup:
            - "Program BSCS, Course CS150 (6 credits, LOWER, dept CS), Student S-1001, FacultyAssessor E-9001 (dept CS, rank 2, max_concurrent_assignments 3)."
            - "A submitted PORTFOLIO claim with 2 artifacts (ARTIFACT_SLA_MULTIPLIER_BP TIER_0_TO_3 = 10000, so sla_hours = 240) whose 27000-cent invoice is waived."
            - "An assignment created at logical clock 2026-08-01T00:00:00Z, so due_at == 2026-08-11T00:00:00Z and at_risk_at == 2026-08-09T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
