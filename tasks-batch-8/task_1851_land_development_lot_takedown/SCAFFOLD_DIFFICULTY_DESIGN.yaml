          not Parcel phase windows): no interval geometry — the third connection on the
          same provider+calendar day exceeds max_connections_per_day 2 and is rejected,
          while the same provider on an adjacent day schedules fine.
        test_recipe:
          setup:
            - "Parcel P ACQUIRED; phase ACTIVE with >= 3 lots; provider PV max_connections_per_day 2"
            - "Connections C1, C2, C3 all requested for 2026-08-20; C4 requested for 2026-08-21"
          setup_api_calls:
            - call: "POST /api/parcels"
