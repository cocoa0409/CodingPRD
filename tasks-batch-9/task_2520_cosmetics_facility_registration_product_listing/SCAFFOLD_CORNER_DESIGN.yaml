  - section: state_machines
    instances:
      - name: facility_submit_registration_advances_draft_to_pending_review
        claim_type: valid_transition
        grounds:
          - state_machines.Facility.DRAFT_to_PENDING_REVIEW
          - endpoints[POST /cosmetics/facilities/{id}/submit-registration]
        distinguishing_aspect: |
          The declared edge fires on a DRAFT facility: registration_status becomes PENDING_REVIEW and
          Facility.version increments by exactly 1 — and NOTHING else moves (no FEI, no period, no
          cycle count, no ledger entry), because those belong to the later approval edge.
        test_recipe:
          setup:
            - "one DRAFT facility at version 1"
          setup_api_calls:
            - call: "POST /cosmetics/facilities"
              payload: { facility_name: "Aster Labs Newark", owner_operator_name: "Aster Holdings LLC", facility_type: "MANUFACTURER", country_code: "US", state_or_province: "NJ" }
              as: FacilityRegistrant
              captures: { fac_id: $.data.id, v0: $.data.version }
          trigger:
            - call: "POST /cosmetics/facilities/${fac_id}/submit-registration"
              payload: {}
              as: FacilityRegistrant
              as_user_id: "${fac_id}"
              captures: { v1: $.data.version }
          assert:
            - "HTTP 200 and Facility.registration_status == \"PENDING_REVIEW\""
            - "${v1} == ${v0} + 1"
            - "Facility.facility_fei is still null and registration_cycle_count is still 0"
            - "Facility.current_period_start and grace_end_date are still null"
            - "GET /cosmetics/facilities/${fac_id}/registration-periods returns total_count == 0"
            - "GET /cosmetics/facilities/${fac_id}/ledger-entries returns total_count == 0 — only the approval edge writes the ledger"

      - name: four_entities_begin_in_their_documented_initial_states
        claim_type: initial_state
        grounds:
          - state_machines.ProductListing.parallel_dimensions
          - state_machines.SafetySubstantiation.initial_state
          - state_machines.RecallAction.initial_state
          - state_machines.MarketWithdrawal.initial_state
        distinguishing_aspect: |
          Freshly created rows sit in their declared initial states, and for the parallel ProductListing
          machine BOTH dimensions initialise independently: listing_status DRAFT and safety_status
          UNSUBSTANTIATED. A SafetySubstantiation starts DRAFT with revision_round 0 and review_mode null,
          a RecallAction starts PLAN_REQUIRED with plan_round 0, a MarketWithdrawal starts OPEN with
          records_produced_count 0.
        test_recipe:
          setup:
            - "the standard ladder up to a LISTED listing (needed only so a recall action can be opened), then fresh child rows"
          setup_api_calls:
            - call: "POST /cosmetics/facilities"
              payload: { facility_name: "Aster Labs Newark", owner_operator_name: "Aster Holdings LLC", facility_type: "MANUFACTURER", country_code: "US", state_or_province: "NJ" }
              as: FacilityRegistrant
              captures: { fac_id: $.data.id }
            - call: "POST /cosmetics/facilities/${fac_id}/submit-registration"
              payload: {}
              as: FacilityRegistrant
              as_user_id: "${fac_id}"
            - call: "POST /cosmetics/facilities/${fac_id}/registration-decision"
              payload: { decision: "APPROVE" }
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
            - call: "POST /cosmetics/responsible-persons"
              payload: { legal_name: "Aster Brands Inc", us_address_line: "12 Market St, Newark NJ 07102", contact_phone: "+1-202-555-0110", contact_email: "safety@aster.example" }
              as: ResponsiblePersonAgent
              captures: { rp_id: $.data.id }
            - call: "POST /cosmetics/listings"
              payload: { facility_id: "${fac_id}", responsible_person_id: "${rp_id}", product_name: "Aster Blush Powder", category_code: "07A", product_form: "LEAVE_ON", label_contact_type: "ELECTRONIC_CONTACT", label_contact_value: "safety@aster.example", lot_authorized_units: 5000 }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /cosmetics/listings/${lst_id}/ingredients"
              payload: { inci_name: "GLYCERIN", function_code: "HUMECTANT", concentration_pct: 3.0000, is_fragrance_allergen: false }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
            - call: "POST /cosmetics/listings/${lst_id}/substantiations"
              payload: { assessor_name: "Dr. Imani Ferro", assessment_basis: "PRODUCT_SPECIFIC" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /cosmetics/substantiations/${sub_id}/review-items"
              payload: { evidence_type: "CLINICAL_SAFETY_STUDY", reviewer_credential: "BOARD_CERTIFIED_TOXICOLOGIST", citation: "Ferro 2025, human repeat insult patch test, n=214" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
            - call: "POST /cosmetics/substantiations/${sub_id}/review-items"
              payload: { evidence_type: "IN_VITRO_TOXICOLOGY", reviewer_credential: "ERT", citation: "OECD 439 reconstructed epidermis assay, lab ref 88-2" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
            - call: "POST /cosmetics/substantiations/${sub_id}/submit"
              payload: {}
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
            - call: "POST /cosmetics/substantiations/${sub_id}/review-decision"
              payload: { review_mode: "FULL" }
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
            - call: "POST /cosmetics/listings/${lst_id}/submit"
              payload: {}
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
            - call: "POST /cosmetics/listings/${lst_id}/listing-decision"
              payload: { decision: "LIST" }
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
            - call: "POST /cosmetics/listings"
              payload: { facility_id: "${fac_id}", responsible_person_id: "${rp_id}", product_name: "Aster Lip Balm", category_code: "12A", product_form: "LEAVE_ON", label_contact_type: "ELECTRONIC_CONTACT", label_contact_value: "safety@aster.example" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { lst2_id: $.data.id }
          trigger:
            - call: "POST /cosmetics/listings/${lst2_id}/substantiations"
              payload: { assessor_name: "Dr. Imani Ferro", assessment_basis: "PANEL_MONOGRAPH" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { sub2_id: $.data.id }
            - call: "POST /cosmetics/listings/${lst_id}/recall-actions"
              payload: { initiation_basis: "VOLUNTARY_NOTICE", hazard_class: "CLASS_II" }
              as: EnforcementOfficer
              as_user_id: "OFF-1"
              captures: { ra_id: $.data.id, ra_v: $.data.version }
            - call: "POST /cosmetics/recall-actions/${ra_id}/plan"
              payload: { corrective_summary: "Consumer-level retrieval of lot LOT-A", distribution_depth: "CONSUMER" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
            - call: "POST /cosmetics/recall-actions/${ra_id}/plan-decision"
              payload: { decision: "ACCEPT" }
              as: EnforcementOfficer
              as_user_id: "OFF-1"
              captures: { ra_v_accepted: $.data.version }
            - call: "POST /cosmetics/recall-actions/${ra_id}/withdrawals"
              payload: { scope_depth: "CONSUMER", expected_recall_action_version: "${ra_v_accepted}" }
              as: EnforcementOfficer
              as_user_id: "OFF-1"
              captures: { wd_id: $.data.id }
          assert:
            - "the second listing ${lst2_id} was created with listing_status == \"DRAFT\" AND safety_status == \"UNSUBSTANTIATED\" — both parallel dimensions initialise independently"
            - "the new SafetySubstantiation ${sub2_id}: status == \"DRAFT\", review_mode is null, adequacy_score is null, revision_round == 0"
            - "the new RecallAction ${ra_id}: status == \"PLAN_REQUIRED\", plan_round == 0, plan_decision_user_id is null, effectiveness_rate_final is null"
            - "the new MarketWithdrawal ${wd_id}: status == \"OPEN\", records_produced_count == 0, shipped_units_total == 0, effectiveness_verdict is null"
            - "creating the recall action set ProductListing ${lst_id}.open_recall_count to 1 while listing_status stayed \"LISTED\""

      - name: rejected_facility_is_terminal_and_admits_no_further_transition
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Facility.terminal_states
          - errors[ERR_INVALID_FACILITY_STATE]
          - errors[ERR_FACILITY_NOT_REGISTERED]
        distinguishing_aspect: |
          REJECTED is the only terminal Facility state: a re-submission is refused with
          ERR_INVALID_FACILITY_STATE (409), a second decision on the same facility is refused with the
          same code, and a listing may never be created against it — ERR_FACILITY_NOT_REGISTERED (409)
          rather than a 404 or a posture error, because the facility exists but is not registrable.
        test_recipe:
          setup:
            - "one facility submitted and then REJECTED"
          setup_api_calls:
            - call: "POST /cosmetics/facilities"
              payload: { facility_name: "Aster Labs Newark", owner_operator_name: "Aster Holdings LLC", facility_type: "MANUFACTURER", country_code: "US", state_or_province: "NJ" }
              as: FacilityRegistrant
              captures: { fac_id: $.data.id }
            - call: "POST /cosmetics/facilities/${fac_id}/submit-registration"
              payload: {}
              as: FacilityRegistrant
              as_user_id: "${fac_id}"
            - call: "POST /cosmetics/facilities/${fac_id}/registration-decision"
              payload: { decision: "REJECT", decision_note: "Ownership documentation unverifiable" }
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
              captures: { v_rejected: $.data.version }
            - call: "POST /cosmetics/responsible-persons"
              payload: { legal_name: "Aster Brands Inc", us_address_line: "12 Market St, Newark NJ 07102", contact_phone: "+1-202-555-0110", contact_email: "safety@aster.example" }
              as: ResponsiblePersonAgent
              captures: { rp_id: $.data.id }
          trigger:
            - call: "POST /cosmetics/facilities/${fac_id}/submit-registration"
              payload: {}
              as: FacilityRegistrant
              as_user_id: "${fac_id}"
              captures: { err_resubmit: $.data.error_id }
            - call: "POST /cosmetics/facilities/${fac_id}/registration-decision"
              payload: { decision: "APPROVE" }
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
              captures: { err_redecide: $.data.error_id }
            - call: "POST /cosmetics/listings"
              payload: { facility_id: "${fac_id}", responsible_person_id: "${rp_id}", product_name: "Aster Blush Powder", category_code: "07A", product_form: "LEAVE_ON", label_contact_type: "ELECTRONIC_CONTACT", label_contact_value: "safety@aster.example" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { err_listing: $.data.error_id }
          assert:
            - "${err_resubmit} == \"ERR_INVALID_FACILITY_STATE\" with HTTP 409"
            - "${err_redecide} == \"ERR_INVALID_FACILITY_STATE\" with HTTP 409 — a terminal decision cannot be re-opened"
            - "${err_listing} == \"ERR_FACILITY_NOT_REGISTERED\" with HTTP 409 (not a 404, and not ERR_FACILITY_POSTURE_FROZEN)"
            - "GET /cosmetics/facilities/${fac_id} still shows registration_status == \"REJECTED\" and version == ${v_rejected} — the three refusals mutated nothing"
            - "Facility.facility_fei is null — an FEI is only ever minted on the APPROVE edge"

      - name: second_submit_registration_is_rejected_rather_than_treated_as_idempotent
        claim_type: idempotency
        grounds:
          - state_machines.Facility.DRAFT_to_PENDING_REVIEW
          - errors[ERR_INVALID_FACILITY_STATE]
          - validations[priority=22]
        distinguishing_aspect: |
          The transition endpoints are state-guarded, not idempotent: replaying submit-registration on a
          PENDING_REVIEW facility returns 409 rather than a second 200, and Facility.version does not
          advance a third time — distinguishing "already in the target state" from "safe to repeat".
        test_recipe:
          setup:
            - "one facility already moved to PENDING_REVIEW (version 2)"
          setup_api_calls:
            - call: "POST /cosmetics/facilities"
              payload: { facility_name: "Aster Labs Newark", owner_operator_name: "Aster Holdings LLC", facility_type: "MANUFACTURER", country_code: "US", state_or_province: "NJ" }
              as: FacilityRegistrant
              captures: { fac_id: $.data.id }
            - call: "POST /cosmetics/facilities/${fac_id}/submit-registration"
              payload: {}
              as: FacilityRegistrant
              as_user_id: "${fac_id}"
              captures: { v_pending: $.data.version }
          trigger:
            - call: "POST /cosmetics/facilities/${fac_id}/submit-registration"
              payload: {}
              as: FacilityRegistrant
              as_user_id: "${fac_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 and ${err} == \"ERR_INVALID_FACILITY_STATE\""
            - "GET /cosmetics/facilities/${fac_id} still reports version == ${v_pending} — the refused replay incremented nothing"
            - "registration_status is still \"PENDING_REVIEW\""

      - name: listing_return_then_resubmit_releases_and_restores_the_designation_slot
        claim_type: cyclic
        grounds:
          - state_machines.ProductListing.SUBMITTED_to_RETURNED
          - state_machines.ProductListing.RETURNED_to_SUBMITTED
