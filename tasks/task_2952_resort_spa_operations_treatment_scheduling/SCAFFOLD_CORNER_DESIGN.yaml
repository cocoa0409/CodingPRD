      - "${c2} cancelled exactly SHORT_NOTICE_HOURS out returns schedule_status == LATE_CANCELLED with cancellation_charge_cents == 9000 == round_half_up(18000 * 5000 / 10000): the >= 4 comparison is inclusive, so the LATE band wins over the SHORT_NOTICE band"
      - "${c3} cancelled 3h59m out returns LATE_CANCELLED with cancellation_charge_cents == 18000 == round_half_up(18000 * 10000 / 10000) — the SHORT_NOTICE band, capped at CHARGE_CAP_BP, and the guest role may take this path on their own appointment"
