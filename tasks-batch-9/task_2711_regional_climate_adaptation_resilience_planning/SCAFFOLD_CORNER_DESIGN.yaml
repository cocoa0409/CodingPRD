  - section: rbac
    instances:
      - name: missing_x_user_headers_returns_unauthenticated
        claim_type: Deny
        grounds:
          - validations.priority_1_ERR_UNAUTHENTICATED
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "A call carrying neither X-User-Role nor X-User-ID returns 401 ERR_UNAUTHENTICATED before any 404 for the unknown id in the same request, so authentication precedes existence."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /resilience/jurisdictions/00000000-0000-0000-0000-000000000000"
              payload: {}
              note: "sent with no X-User-Role and no X-User-ID header"
            - call: "POST /resilience/jurisdictions"
              payload: { name: "Harbor City", jurisdiction_code: "CITY-HARBOR", population: 180000, svi_score: 0.62, endorsement_weight: 4 }
              note: "sent with X-User-Role RegionalAdministrator but no X-User-ID header"
          assert:
            - "first call: status 401 with data.error_id == ERR_UNAUTHENTICATED, not 404"
            - "second call: status 401 with data.error_id == ERR_UNAUTHENTICATED and no Jurisdiction row created"

      - name: unknown_role_header_returns_forbidden
        claim_type: Deny
        grounds:
          - validations.priority_2_ERR_UNKNOWN_ROLE
          - errors.ERR_UNKNOWN_ROLE
        distinguishing_aspect: "X-User-Role ClimateIntern is refused with 403 ERR_UNKNOWN_ROLE rather than ERR_ROLE_NOT_PERMITTED, because the membership check at priority 2 runs before the endpoint's own role list at priority 3."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /resilience/jurisdictions"
              payload: { name: "Harbor City", jurisdiction_code: "CITY-HARBOR", population: 180000, svi_score: 0.62, endorsement_weight: 4 }
              as: ClimateIntern
              as_user_id: "intern-01"
          assert:
            - "status 403 with data.error_id == ERR_UNKNOWN_ROLE"
            - "GET /resilience/jurisdictions as RegionalAdministrator returns meta.total_count == 0"

