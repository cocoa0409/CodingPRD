  # =========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: district_subsidy_pool_restored_exactly_on_team_withdrawal
        conserved_quantity: "District.subsidy_pool_cents (+ the sum of granted subsidies)"
        grounds:
          - conserved_quantity_invariants.district_subsidy_pool_conservation
          - state_machines.Team.DRAFT_to_REGISTERED
          - state_machines.Team.REGISTERED_to_WITHDRAWN
          - calculations.team_entry_fee
          - entities.District.fields.subsidy_pool_initial_cents
        distinguishing_aspect: |
          The conserved quantity is money: pool balance plus outstanding grants must always
          equal subsidy_pool_initial_cents. Registration debits an odd per-line-rounded figure
          (3962, not 3961) and withdrawal must credit back exactly that figure and zero the
          grant, so an implementation that recomputes the refund from the fee instead of
          reversing the recorded grant leaves a one-cent hole in the pool.
        test_recipe:
          setup:
            - "District with the default subsidy_pool_cents 5000000, one school, one CERTIFIED coach, one district-APPROVED title"
            - "Season in REGISTRATION_OPEN with fee defaults; one student with a 3.100 / 6-credit posting on an ACTIVE STARTER slot"
            - "The team registers, drawing a 3962 subsidy against a 15845 fee"
            - "Logical clock left at the 2026-08-01T00:00:00.000Z startup default"
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "Metro District", state_code: "CA" }
              as: LeagueAdmin
              captures: { d_id: $.data.id }
            - call: "POST /schools"
              payload: { district_id: "${d_id}", name: "North High", nces_code: "N-001" }
