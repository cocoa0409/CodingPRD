    path: "/cases/{id}/triage"
    description: "Triage/route: assign template, priority, and caseworker; compute final SLA deadline; move NEW -> IN_PROGRESS."
    roles: [Caseworker, OfficeAdmin]
    code: 200
    input: [template_id, priority, assignee_staff_id]
    output: Case
    side_effects: ["per §1.2 NEW->IN_PROGRESS; case_response_deadline final variant"]
  - method: POST
    path: "/cases/{id}/request-info"
    description: "Request more information from the constituent; pauses SLA clock (IN_PROGRESS -> AWAITING_CONSTITUENT)."
    roles: [Caseworker, OfficeAdmin]
    code: 200
    input: ["message?"]
    output: Case
    side_effects: ["paused_since set"]
  - method: POST
    path: "/cases/{id}/constituent-reply"
    description: "Constituent supplies the requested info; resumes SLA clock (AWAITING_CONSTITUENT -> IN_PROGRESS)."
    roles: [Constituent]
    code: 200
    input: ["message?"]
    output: Case
    side_effects: ["cumulative_paused_hours accrues; paused_since cleared"]
  - method: POST
    path: "/cases/{id}/respond"
    description: "Send the response and resolve the case (IN_PROGRESS -> RESOLVED)."
    roles: [Caseworker, OfficeAdmin]
    code: 200
    input: ["response_body?"]
    output: Case
    side_effects: ["resolved_at set; elapsed frozen"]
  - method: POST
    path: "/cases/{id}/close"
    description: "Close a resolved case (RESOLVED -> CLOSED); cascade-closes any lingering referrals."
    roles: [OfficeAdmin]
    code: 200
    input: []
    output: Case
    side_effects: ["closed_at set; referral cascade per §1.2"]
  - method: POST
    path: "/cases/{id}/withdraw"
    description: "Constituent withdraws the inquiry (non-terminal -> WITHDRAWN); cascade-recalls open referrals."
    roles: [Constituent]
    code: 200
    input: ["reason?"]
    output: Case
    side_effects: ["withdrawn_at set; referral recall cascade per §1.2"]
  - method: POST
    path: "/cases/{id}/referrals"
    description: "Refer a case to an agency (IN_PROGRESS -> AWAITING_AGENCY); creates the referral in DRAFT. Requires data-sharing consent and an active agency."
    roles: [Caseworker, OfficeAdmin]
    code: 201
    input: [agency_id, "referral_notes?"]
    output: AgencyReferral
    side_effects: ["case -> AWAITING_AGENCY; paused_since set; AgencyReferral created DRAFT"]
  - method: GET
    path: "/cases/{id}/referrals"
    description: "List referrals of a case (reverse lookup for AgencyReferral.case_id)."
    roles: [Caseworker, OfficeAdmin]
    code: 200
    input: []
    output: AgencyReferral[]
    side_effects: []

  - method: GET
    path: "/agency-referrals/{id}"
    description: "Fetch a referral."
    roles: [Caseworker, OfficeAdmin]
    code: 200
    input: []
    output: AgencyReferral
    side_effects: []
  - method: GET
    path: "/agency-referrals"
    description: "List referrals (reverse lookup for AgencyReferral.agency_id; case_id filter also supported)."
    roles: [Caseworker, OfficeAdmin]
    code: 200
    input: ["agency_id?", "case_id?", "status?", "limit?", "offset?"]
    output: AgencyReferral[]
    side_effects: []
  - method: POST
    path: "/agency-referrals/{id}/send"
    description: "Send a DRAFT referral to the agency (DRAFT -> SENT); increments the agency ledger."
    roles: [Caseworker, OfficeAdmin]
    code: 200
    input: []
    output: AgencyReferral
    side_effects: ["sent_at set; Agency.open_referral_count += 1"]
  - method: POST
    path: "/agency-referrals/{id}/resolve"
    description: "Agency resolved the referral (SENT -> RESOLVED); returns the case to IN_PROGRESS."
    roles: [Caseworker, OfficeAdmin]
    code: 200
    input: ["response_summary?"]
    output: AgencyReferral
    side_effects: ["Agency.open_referral_count -= 1; case resumes with last_agency_outcome=RESOLVED"]
  - method: POST
    path: "/agency-referrals/{id}/reject"
    description: "Agency rejected the referral (SENT -> REJECTED); returns the case to IN_PROGRESS and bumps reject_count."
    roles: [Caseworker, OfficeAdmin]
    code: 200
    input: ["reason?"]
    output: AgencyReferral
    side_effects: ["Agency.open_referral_count -= 1; case resumes with last_agency_outcome=REJECTED; reject_count += 1"]

  - method: GET
