- method: POST
  path: /invoices/{id}/prepare
  description: 'DRAFT only: synthesize InvoiceLines from binding service levels, compute gross/measured/staffing/withholding; creates PENDING
    CurePeriods for non-compliant lines'
  roles:
  - BillingAnalyst
  code: 200
  input: []
  output: Invoice
  side_effects:
  - create one InvoiceLine per binding (program_code, metric) service level at period end
  - per non-compliant line create CurePeriod(status=PENDING) and set InvoiceLine withheld via withholding_amount
  - update Contract.withheld_cents_cum
  - set auto_review when a recomputed line has a completed CurePeriod history
- method: POST
  path: /invoices/{id}/recompute
  description: 'DRAFT or REJECTED-revised invoices: recompute all lines with the official variant; existing PENDING CurePeriods whose line is
    now compliant are removed, new breaches open new CurePeriods'
  roles:
  - BillingAnalyst
  code: 200
  input: []
  output: Invoice
  side_effects:
  - official-variant recompute; cure period reconciliation; Contract.withheld_cents_cum resynced
- method: POST
  path: /cure-periods/{id}/pay-remedy
  description: PENDING -> REMEDIED before deadline; sets line withheld to 0 (cure) and resyncs invoice + contract totals
  roles:
  - BillingAnalyst
  code: 200
  input: []
  output: CurePeriod
  side_effects:
  - InvoiceLine.withheld_cents = 0 for the cured line
  - Invoice.withheld_cents and net_cents recomputed
  - Contract.withheld_cents_cum decremented by the released amount; Contract.cure_periods_used incremented
