# =============================================================================
# PRD Benchmark Seed Tables — Title Abstracting & Public Record Research
# =============================================================================

scenario: |
  Title Abstracting & Public Record Research (title abstracting company): chain-of-title
  search across grantor/grantee indexes, lien/judgment/tax search & scope by search period,
  legal description verification & survey exception, easement/restriction identification,
  abstract report production & examiner review, curative requirement list, county record
  retrieval & fee handling, turnaround SLA & liability limits

domain_name: title-abstracting
api_prefix: /api

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_actions
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: approval_chain
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: AbstractOrder
    parent: null
    common_fields: true
    fields:
      - { name: client_ref, type: string, source: input, description: "Opaque client identifier; MUST equal the creating Client role's X-User-ID" }
      - { name: property_address, type: string, source: input, description: "Street address of the subject property" }
      - { name: county, type: string, source: input, description: "County of record" }
      - { name: state_code, type: string, source: input, description: "Two-letter state code", constraints: "exactly 2 uppercase letters A-Z" }
      - { name: legal_description_text, type: string, source: input, description: "Legal description of record supplied at intake; overwritten by LegalDescriptionCheck resolution" }
      - { name: search_period_years, type: integer, source: input, description: "Scope of search: how many years back from effective_date the index search covers", constraints: "1..60" }
      - { name: effective_date, type: string, source: input, description: "Search 'as of' date, ISO YYYY-MM-DD; end of the scope window" }
      - { name: sla_tier, type: enum, source: input, default: STANDARD, description: "Turnaround tier", constraints: "STANDARD | RUSH" }
      - { name: liability_tier, type: enum, source: input, default: STANDARD, description: "Engagement liability tier driving the liability cap multiplier", constraints: "STANDARD | EXTENDED" }
      - { name: scope_start_date, type: string, source: computed, description: "Read-only = effective_date minus search_period_years calendar years (same month-day)" }
      - { name: received_at, type: datetime, source: system, description: "Logical-clock timestamp at order creation" }
      - { name: due_at, type: datetime, source: computed, description: "Read-only = received_at + SLA_HOURS[sla_tier]" }
      - { name: delivered_at, type: datetime, source: system, description: "Logical-clock timestamp of delivery; null until DELIVERED", default: null }
      - { name: is_overdue, type: boolean, source: computed, description: "Read-only = (logical clock > due_at) AND status NOT IN {DELIVERED, CANCELLED}" }
      - { name: status, type: enum, source: system, description: "RECEIVED | SEARCH_IN_PROGRESS | SEARCH_COMPLETE | REPORT_DRAFTING | REPORT_UNDER_REVIEW | READY_FOR_DELIVERY | DELIVERED | CANCELLED" }
      - { name: provisional_fee_cents, type: integer, source: computed, description: "Read-only fee estimate computed at creation (calculation order_fee_provisional)" }
      - { name: accrued_fees_cents, type: integer, source: computed, description: "Read-only running actual fee (calculation order_fee_actualization); recomputed on every fee post/reverse" }
      - { name: final_fee_cents, type: integer, source: computed, description: "Read-only; null until delivery, then set := accrued_fees_cents at delivery", default: null }
      - { name: late_credit_cents, type: integer, source: computed, description: "Read-only SLA late credit (calculation sla_due_and_late_credit)", default: 0 }
      - { name: billed_fee_cents, type: integer, source: computed, description: "Read-only = final_fee_cents - late_credit_cents; null until delivery", default: null }
      - { name: liability_cap_cents, type: integer, source: computed, description: "Read-only = min(LIABILITY_MULT[liability_tier] * fee_basis, ABSOLUTE_CAP_CENTS) per calculation liability_cap" }
      - { name: open_curative_count, type: integer, source: computed, description: "Read-only count of CurativeRequirement rows for this order with status OPEN", default: 0 }
      - { name: legal_hold, type: boolean, source: computed, description: "Read-only true while any LegalDescriptionCheck for this order has status MISMATCH", default: false }

  - name: SearchAssignment
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> AbstractOrder.id; the order this search serves" }
      - { name: abstracter_ref, type: string, source: input, description: "Opaque abstracter identifier; the acting Abstracter role's X-User-ID must match to work this assignment" }
      - { name: search_type, type: enum, source: input, description: "CHAIN_OF_TITLE | LIEN_JUDGMENT_TAX" }
      - { name: window_start, type: datetime, source: input, description: "Start of the abstracter's committed work window (half-open interval start)" }
      - { name: window_end, type: datetime, source: input, description: "End of the committed work window (half-open interval end); must be > window_start" }
      - { name: document_count, type: integer, source: computed, description: "Read-only count of RecordDocument rows with assignment_id = this and status != VOID", default: 0 }
      - { name: verified_count, type: integer, source: computed, description: "Read-only count of linked RecordDocument rows with status VERIFIED", default: 0 }
      - { name: revision_count, type: integer, source: computed, description: "Read-only; increments by 1 each time the assignment is returned for correction", default: 0 }
      - { name: return_reason, type: string, source: system, description: "Examiner-supplied reason from the most recent return; null until first return", default: null }
      - { name: status, type: enum, source: system, description: "IN_PROGRESS | SUBMITTED | RETURNED_FOR_CORRECTION | ACCEPTED | CANCELLED" }

  - name: RecordDocument
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> AbstractOrder.id" }
      - { name: assignment_id, type: string, source: input, description: "FK -> SearchAssignment.id; the search assignment that surfaced this instrument" }
      - { name: instrument_type, type: enum, source: input, description: "DEED | MORTGAGE | LIEN | JUDGMENT | TAX_LIEN | EASEMENT | RESTRICTION" }
      - { name: grantor_name, type: string, source: input, description: "Grantor exactly as indexed in the grantor index" }
      - { name: grantee_name, type: string, source: input, description: "Grantee exactly as indexed in the grantee index" }
      - { name: instrument_number, type: string, source: input, description: "County instrument / book-page identifier", constraints: "unique within (order_id, instrument_number) among non-VOID documents" }
      - { name: recording_date, type: string, source: input, description: "Date recorded at the county, ISO YYYY-MM-DD" }
      - { name: prior_document_id, type: string, source: input, description: "FK -> RecordDocument.id; optional chain-of-title predecessor deed", default: null }
      - { name: in_scope, type: boolean, source: computed, description: "Read-only = scope_start_date <= recording_date <= effective_date (both ends inclusive) using the parent order's window" }
      - { name: chain_break_flag, type: boolean, source: computed, description: "Read-only; for DEED with prior_document_id set: true when grantor_name (trimmed) != prior document's grantee_name (trimmed); otherwise false", default: false }
      - { name: exception_applies, type: boolean, source: input, default: false, description: "True when this instrument (typically EASEMENT or RESTRICTION) must appear as a title exception in the report" }
      - { name: status, type: enum, source: system, description: "REPORTED | VERIFIED | FLAGGED_FOR_CURATIVE | VOID" }

  - name: LegalDescriptionCheck
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> AbstractOrder.id" }
      - { name: survey_reference, type: string, source: input, description: "Survey or plat reference used for verification" }
      - { name: checked_legal_description, type: string, source: input, description: "Legal description as abstracted from the records, compared against the order's legal_description_text" }
      - { name: survey_exception_applied, type: boolean, source: system, description: "Set at submit-verdict; true when a standard survey exception must be carried into the report", default: false }
      - { name: resolved_description, type: string, source: system, description: "Corrected legal description recorded at resolve; null until then", default: null }
      - { name: status, type: enum, source: system, description: "PENDING | VERIFIED | MISMATCH | RESOLVED" }

  - name: AbstractReport
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> AbstractOrder.id" }
      - { name: title, type: string, source: input, description: "Report title" }
      - { name: revision_number, type: integer, source: computed, description: "Read-only; starts 0, increments by 1 on every require-revision", default: 0 }
      - { name: revision_reason, type: string, source: system, description: "Examiner-supplied reason from the most recent require-revision; null until first", default: null }
      - { name: reviewer_examiner_ref, type: string, source: system, description: "Opaque examiner identifier booked at start-review; null until then", default: null }
      - { name: review_slot_start, type: datetime, source: system, description: "Booked review slot start; null until start-review", default: null }
      - { name: review_slot_end, type: datetime, source: system, description: "Booked review slot end; null until start-review", default: null }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | UNDER_REVIEW | REVISION_REQUIRED | APPROVED | DELIVERED | CANCELLED" }

  - name: CurativeRequirement
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> AbstractOrder.id" }
      - { name: record_document_id, type: string, source: input, description: "FK -> RecordDocument.id; null for free-standing requirements", default: null }
      - { name: raised_by_examiner_ref, type: string, source: input, description: "Opaque examiner identifier of the raiser; null when system-raised by a document flag", default: null }
      - { name: description, type: string, source: input, description: "What must be cured before the report can be approved" }
      - { name: severity, type: enum, source: input, default: STANDARD, description: "LOW | STANDARD | CRITICAL" }
      - { name: resolution_note, type: string, source: system, description: "Note recorded at satisfy or waive; null until closed", default: null }
      - { name: status, type: enum, source: system, description: "OPEN | SATISFIED | WAIVED" }

  - name: CountyRetrieval
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> AbstractOrder.id" }
      - { name: record_document_id, type: string, source: input, description: "FK -> RecordDocument.id; the instrument to pull from county records" }
      - { name: county, type: string, source: input, description: "County the record is retrieved from" }
      - { name: fee_mode, type: enum, source: input, default: PER_DOCUMENT, description: "County charging mode: PER_DOCUMENT | PER_PAGE" }
      - { name: page_count, type: integer, source: input, description: "Number of pages; required and must be >= 1 when fee_mode = PER_PAGE, ignored otherwise", default: null }
      - { name: fee_cents, type: integer, source: computed, description: "Read-only county pass-through fee computed at post-fee (calculation retrieval_fee); null until FEE_POSTED", default: null }
      - { name: status, type: enum, source: system, description: "REQUESTED | FEE_POSTED | FEE_REVERSED | INVOICED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: AbstractOrder
    initial_state: RECEIVED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: RECEIVED
        to: SEARCH_IN_PROGRESS
        trigger: "system (automatic side effect of the first POST /search-assignments for this order)"
        actor: system
        preconditions:
          - "Order is in RECEIVED"
        side_effects:
          - "increments AbstractOrder.version by 1"
      - from: SEARCH_IN_PROGRESS
        to: SEARCH_COMPLETE
        trigger: "system (re-evaluated after every assignment acceptance and after every legal-hold clear)"
        actor: system
        preconditions:
          - "At least one SearchAssignment exists for the order with status != CANCELLED"
          - "Every SearchAssignment with status != CANCELLED has status ACCEPTED"
          - "order.legal_hold == false"
        side_effects:
          - "increments AbstractOrder.version by 1"
      - from: SEARCH_COMPLETE
        to: REPORT_DRAFTING
        trigger: "POST /api/abstract-reports (OCC-guarded by expected_abstract_order_version)"
        actor: Abstracter
        preconditions:
          - "Order is in SEARCH_COMPLETE (ERR_INVALID_STATE otherwise)"
          - "No other AbstractReport for this order has status IN {DRAFT, SUBMITTED, UNDER_REVIEW, REVISION_REQUIRED, APPROVED} (ERR_REPORT_ALREADY_ACTIVE)"
          - "expected_abstract_order_version == order.version (ERR_STALE_VERSION)"
        side_effects:
          - "creates AbstractReport in DRAFT"
          - "increments AbstractOrder.version by 1"
      - from: REPORT_DRAFTING
        to: REPORT_UNDER_REVIEW
        trigger: "POST /api/abstract-reports/{id}/submit"
        actor: Abstracter
        preconditions:
          - "The active report is in DRAFT or REVISION_REQUIRED"
        side_effects:
          - "AbstractReport -> SUBMITTED"
          - "increments AbstractOrder.version by 1"
      - from: REPORT_UNDER_REVIEW
        to: REPORT_DRAFTING
        trigger: "POST /api/abstract-reports/{id}/require-revision"
        actor: Examiner
        preconditions:
          - "The active report is in UNDER_REVIEW"
        side_effects:
          - "AbstractReport -> REVISION_REQUIRED; revision_number += 1"
          - "increments AbstractOrder.version by 1"
      - from: REPORT_UNDER_REVIEW
        to: READY_FOR_DELIVERY
        trigger: "POST /api/abstract-reports/{id}/approve"
        actor: Examiner
        preconditions:
          - "The active report is in UNDER_REVIEW"
          - "No CurativeRequirement for this order has status OPEN (ERR_OPEN_CURATIVE_REQUIREMENTS)"
        side_effects:
          - "AbstractReport -> APPROVED"
          - "increments AbstractOrder.version by 1"
      - from: READY_FOR_DELIVERY
        to: DELIVERED
        trigger: "POST /api/abstract-orders/{id}/deliver"
        actor: OperationsManager
        preconditions:
          - "Order is in READY_FOR_DELIVERY (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "delivered_at := logical clock"
          - "AbstractReport APPROVED -> DELIVERED (cascade link 1)"
          - "that report delivery sets every CountyRetrieval of the order with status FEE_POSTED -> INVOICED (cascade link 2)"
          - "the invoicing recomputes order.final_fee_cents := accrued_fees_cents, late_credit_cents and billed_fee_cents per calculation sla_due_and_late_credit, and liability_cap_cents per calculation liability_cap (cascade link 3)"
          - "increments AbstractOrder.version by 1"
      - from: RECEIVED
        to: CANCELLED
        trigger: "POST /api/abstract-orders/{id}/cancel"
        actor: Client | OperationsManager
        preconditions:
          - "Client actor: order.client_ref == X-User-ID (ERR_FORBIDDEN)"
        side_effects:
          - "Every SearchAssignment IN {IN_PROGRESS, SUBMITTED, RETURNED_FOR_CORRECTION} -> CANCELLED"
          - "Any AbstractReport IN {DRAFT, SUBMITTED, UNDER_REVIEW, REVISION_REQUIRED} -> CANCELLED"
          - "Every CountyRetrieval with status FEE_POSTED -> FEE_REVERSED, and accrued_fees_cents recomputed"
          - "increments AbstractOrder.version by 1"
      - from: SEARCH_IN_PROGRESS
        to: CANCELLED
        trigger: "POST /api/abstract-orders/{id}/cancel"
        actor: Client | OperationsManager
        preconditions: ["same as RECEIVED -> CANCELLED"]
        side_effects: ["same as RECEIVED -> CANCELLED"]
      - from: SEARCH_COMPLETE
        to: CANCELLED
        trigger: "POST /api/abstract-orders/{id}/cancel"
        actor: Client | OperationsManager
        preconditions: ["same as RECEIVED -> CANCELLED"]
        side_effects: ["same as RECEIVED -> CANCELLED"]
      - from: REPORT_DRAFTING
        to: CANCELLED
        trigger: "POST /api/abstract-orders/{id}/cancel"
        actor: Client | OperationsManager
        preconditions: ["same as RECEIVED -> CANCELLED"]
        side_effects: ["same as RECEIVED -> CANCELLED"]
      - from: REPORT_UNDER_REVIEW
        to: CANCELLED
        trigger: "POST /api/abstract-orders/{id}/cancel"
        actor: Client | OperationsManager
        preconditions: ["same as RECEIVED -> CANCELLED"]
        side_effects: ["same as RECEIVED -> CANCELLED"]
      - from: READY_FOR_DELIVERY
        to: CANCELLED
        trigger: "POST /api/abstract-orders/{id}/cancel"
        actor: Client | OperationsManager
        preconditions: ["same as RECEIVED -> CANCELLED"]
        side_effects: ["same as RECEIVED -> CANCELLED"]

  - entity: SearchAssignment
    initial_state: IN_PROGRESS
    terminal_states: [ACCEPTED, CANCELLED]
    transitions:
      - from: IN_PROGRESS
        to: SUBMITTED
        trigger: "POST /api/search-assignments/{id}/submit"
        actor: Abstracter
        preconditions:
          - "assignment.abstracter_ref == X-User-ID (ERR_FORBIDDEN)"
          - "Parent order status NOT IN {DELIVERED, CANCELLED} (ERR_ORDER_TERMINAL)"
          - "At least one RecordDocument with assignment_id = this and status != VOID (ERR_EMPTY_ASSIGNMENT)"
          - "No linked RecordDocument with status REPORTED (ERR_DOCUMENTS_NOT_EXAMINED)"
        side_effects: []
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /api/search-assignments/{id}/accept"
        actor: Examiner
        preconditions:
          - "Parent order status NOT IN {DELIVERED, CANCELLED} (ERR_ORDER_TERMINAL)"
        side_effects:
          - "Re-evaluate parent order SEARCH_IN_PROGRESS -> SEARCH_COMPLETE guard"
      - from: SUBMITTED
        to: RETURNED_FOR_CORRECTION
        trigger: "POST /api/search-assignments/{id}/return"
        actor: Examiner
        preconditions:
          - "Parent order status NOT IN {DELIVERED, CANCELLED} (ERR_ORDER_TERMINAL)"
        side_effects:
          - "revision_count += 1; return_reason := request reason"
      - from: RETURNED_FOR_CORRECTION
        to: IN_PROGRESS
        trigger: "POST /api/search-assignments/{id}/resume"
        actor: Abstracter
        preconditions:
          - "assignment.abstracter_ref == X-User-ID (ERR_FORBIDDEN)"
          - "Parent order status NOT IN {DELIVERED, CANCELLED} (ERR_ORDER_TERMINAL)"
        side_effects: []
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "system (cascade from parent order cancel)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: CANCELLED
        trigger: "system (cascade from parent order cancel)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RETURNED_FOR_CORRECTION
        to: CANCELLED
        trigger: "system (cascade from parent order cancel)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: RecordDocument
    initial_state: REPORTED
    terminal_states: [VERIFIED, VOID]
    transitions:
      - from: REPORTED
        to: VERIFIED
        trigger: "POST /api/record-documents/{id}/verify"
        actor: Abstracter
        preconditions:
          - "Document's assignment has abstracter_ref == X-User-ID (ERR_FORBIDDEN)"
          - "Document's assignment status == IN_PROGRESS (ERR_INVALID_STATE)"
          - "Parent order status NOT IN {DELIVERED, CANCELLED} (ERR_ORDER_TERMINAL)"
        side_effects:
          - "assignment.verified_count recomputed"
      - from: FLAGGED_FOR_CURATIVE
        to: VERIFIED
        trigger: "POST /api/record-documents/{id}/verify"
        actor: Abstracter
        preconditions: ["same as REPORTED -> VERIFIED"]
        side_effects:
          - "assignment.verified_count recomputed"
      - from: REPORTED
        to: FLAGGED_FOR_CURATIVE
        trigger: "POST /api/record-documents/{id}/flag"
        actor: Abstracter
        preconditions:
          - "Document's assignment has abstracter_ref == X-User-ID (ERR_FORBIDDEN)"
          - "Document's assignment status == IN_PROGRESS (ERR_INVALID_STATE)"
          - "Parent order status NOT IN {DELIVERED, CANCELLED} (ERR_ORDER_TERMINAL)"
        side_effects:
          - "system creates a CurativeRequirement: order_id = document.order_id, record_document_id = document.id, raised_by_examiner_ref = null, severity = CRITICAL when instrument_type IN {LIEN, JUDGMENT, TAX_LIEN} else STANDARD, description = flag reason (cascade link 1)"
          - "order.open_curative_count += 1 (cascade link 2)"
      - from: REPORTED
        to: VOID
        trigger: "POST /api/record-documents/{id}/void"
        actor: Abstracter | OperationsManager
        preconditions:
          - "Abstracter actor: document's assignment has abstracter_ref == X-User-ID (ERR_FORBIDDEN)"
          - "Parent order status NOT IN {DELIVERED, CANCELLED} (ERR_ORDER_TERMINAL)"
        side_effects:
          - "assignment.document_count recomputed (compensating invariant: create + void leaves document_count unchanged)"

  - entity: LegalDescriptionCheck
    initial_state: PENDING
    terminal_states: [VERIFIED, RESOLVED]
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /api/legal-description-checks/{id}/submit-verdict with verdict=VERIFIED"
        actor: OperationsManager
        preconditions:
          - "Parent order status NOT IN {DELIVERED, CANCELLED} (ERR_ORDER_TERMINAL)"
        side_effects:
          - "survey_exception_applied := request flag"
      - from: PENDING
        to: MISMATCH
        trigger: "POST /api/legal-description-checks/{id}/submit-verdict with verdict=MISMATCH"
        actor: OperationsManager
        preconditions:
          - "Parent order status NOT IN {DELIVERED, CANCELLED} (ERR_ORDER_TERMINAL)"
        side_effects:
          - "survey_exception_applied := request flag"
          - "order.legal_hold := true"
      - from: MISMATCH
        to: RESOLVED
        trigger: "POST /api/legal-description-checks/{id}/resolve"
        actor: OperationsManager
        preconditions:
          - "Parent order status NOT IN {DELIVERED, CANCELLED} (ERR_ORDER_TERMINAL)"
        side_effects:
          - "resolved_description := request value; order.legal_description_text := resolved_description"
          - "order.legal_hold := false when no other MISMATCH check remains"
          - "re-evaluate order SEARCH_IN_PROGRESS -> SEARCH_COMPLETE guard"
          - "increments AbstractOrder.version by 1"

  - entity: AbstractReport
    initial_state: DRAFT
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/abstract-reports/{id}/submit"
        actor: Abstracter
        preconditions:
          - "Parent order status == REPORT_DRAFTING (ERR_INVALID_STATE)"
        side_effects:
          - "order REPORT_DRAFTING -> REPORT_UNDER_REVIEW"
      - from: REVISION_REQUIRED
        to: SUBMITTED
        trigger: "POST /api/abstract-reports/{id}/submit"
        actor: Abstracter
        preconditions:
          - "Parent order status == REPORT_DRAFTING (ERR_INVALID_STATE)"
        side_effects:
          - "order REPORT_DRAFTING -> REPORT_UNDER_REVIEW"
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /api/abstract-reports/{id}/start-review"
        actor: Examiner
        preconditions:
          - "review_slot_end > review_slot_start (ERR_SLOT_INVALID)"
          - "Buffered slot rule: for every other non-CANCELLED AbstractReport booked to the same examiner_ref, the gap between the new slot and each existing slot must be >= REVIEW_BUFFER_MINUTES (30) on both sides (ERR_SLOT_CONFLICT); gap == exactly 30 minutes is allowed"
        side_effects:
          - "reviewer_examiner_ref := X-User-ID; review_slot_start/end := request values"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /api/abstract-reports/{id}/approve"
        actor: Examiner
        preconditions:
          - "report.reviewer_examiner_ref == X-User-ID (ERR_FORBIDDEN)"
          - "No CurativeRequirement for the order has status OPEN (ERR_OPEN_CURATIVE_REQUIREMENTS)"
        side_effects:
          - "order REPORT_UNDER_REVIEW -> READY_FOR_DELIVERY"
      - from: UNDER_REVIEW
        to: REVISION_REQUIRED
        trigger: "POST /api/abstract-reports/{id}/require-revision"
        actor: Examiner
        preconditions:
          - "report.reviewer_examiner_ref == X-User-ID (ERR_FORBIDDEN)"
        side_effects:
          - "revision_number += 1; revision_reason := request reason"
          - "order REPORT_UNDER_REVIEW -> REPORT_DRAFTING"
      - from: APPROVED
        to: DELIVERED
        trigger: "system (cascade from parent order deliver)"
        actor: system
        preconditions: []
        side_effects:
          - "triggers CountyRetrieval FEE_POSTED -> INVOICED for the order"
      - from: DRAFT
        to: CANCELLED
        trigger: "system (cascade from parent order cancel)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: CANCELLED
        trigger: "system (cascade from parent order cancel)"
        actor: system
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: CANCELLED
        trigger: "system (cascade from parent order cancel)"
        actor: system
        preconditions: []
        side_effects: []
      - from: REVISION_REQUIRED
        to: CANCELLED
        trigger: "system (cascade from parent order cancel)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: CurativeRequirement
    initial_state: OPEN
    terminal_states: [SATISFIED, WAIVED]
    transitions:
      - from: OPEN
        to: SATISFIED
        trigger: "POST /api/curative-requirements/{id}/satisfy"
        actor: Abstracter
        preconditions:
          - "Parent order status NOT IN {DELIVERED, CANCELLED} (ERR_ORDER_TERMINAL)"
        side_effects:
          - "resolution_note := request value; order.open_curative_count -= 1"
      - from: OPEN
        to: WAIVED
        trigger: "POST /api/curative-requirements/{id}/waive"
        actor: Examiner
        preconditions:
          - "severity != CRITICAL (ERR_CRITICAL_NOT_WAIVABLE)"
          - "raised_by_examiner_ref IS NULL OR raised_by_examiner_ref != X-User-ID (ERR_SOD_WAIVER_FORBIDDEN — segregation of duties)"
          - "Parent order status NOT IN {DELIVERED, CANCELLED} (ERR_ORDER_TERMINAL)"
        side_effects:
          - "resolution_note := request value; order.open_curative_count -= 1"

  - entity: CountyRetrieval
    initial_state: REQUESTED
    terminal_states: [INVOICED, FEE_REVERSED]
    transitions:
      - from: REQUESTED
        to: FEE_POSTED
        trigger: "POST /api/county-retrievals/{id}/post-fee"
        actor: OperationsManager
        preconditions:
          - "Parent order status NOT IN {DELIVERED, CANCELLED} (ERR_ORDER_TERMINAL)"
        side_effects:
          - "fee_cents computed per calculation retrieval_fee"
          - "order.accrued_fees_cents and liability_cap_cents recomputed per calculation order_fee_actualization"
      - from: FEE_POSTED
        to: FEE_REVERSED
        trigger: "POST /api/county-retrievals/{id}/reverse-fee"
        actor: OperationsManager
        preconditions:
          - "Parent order status NOT IN {DELIVERED, CANCELLED} (ERR_ORDER_TERMINAL)"
        side_effects:
          - "order.accrued_fees_cents and liability_cap_cents recomputed (compensating invariant: post + reverse leaves accrued_fees_cents unchanged)"
      - from: FEE_POSTED
        to: INVOICED
        trigger: "system (cascade from parent order deliver, via report delivery)"
        actor: system
        preconditions: []
        side_effects:
          - "triggers recompute of order.final_fee_cents, late_credit_cents, billed_fee_cents, liability_cap_cents"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: order-patch-stale-version
    parent_entity: AbstractOrder
    write_endpoint: "PATCH /api/abstract-orders/{id}"
    occ_field: expected_abstract_order_version
    description: |
      Updating an AbstractOrder's scope fields (search_period_years, effective_date,
      sla_tier, liability_tier, legal_description_text) against a version the client
      no longer holds current is rejected. A client whose last-observed order version
      is behind the server's version has a stale view of the engagement terms, so the
      update is refused with ERR_STALE_VERSION instead of silently superseding.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: report-create-stale-order
    parent_entity: AbstractOrder
    write_endpoint: "POST /api/abstract-reports"
    occ_field: expected_abstract_order_version
    description: |
      Creating an AbstractReport against an AbstractOrder whose version has advanced
      since the client last observed it is rejected. The report draft must be compiled
      from the order state the drafter actually reviewed; a stale version means the
      order changed underneath the drafter (e.g., a scope patch), so the create is
      refused with ERR_STALE_VERSION.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: order_fee_provisional
    trigger: "AbstractOrder creation"
    algorithm: forward_looking
    formula: |
      base = BASE_FEE_CENTS
      estimated_allowance = ESTIMATED_DOCUMENT_COUNT * PER_DOCUMENT_FEE_CENTS
      subtotal = base + estimated_allowance
      premium = (sla_tier == RUSH) ? round_half_up(subtotal * RUSH_PREMIUM_PCT) : 0
      provisional_fee_cents = subtotal + premium
      accrued_fees_cents initialized = base + ((sla_tier == RUSH) ? round_half_up(base * RUSH_PREMIUM_PCT) : 0)
      liability_cap_cents initialized per calculation liability_cap with fee_basis = accrued_fees_cents
    input_set: "The AbstractOrder being created; no documents or retrievals exist yet"
    constants:
      BASE_FEE_CENTS: 40000
      PER_DOCUMENT_FEE_CENTS: 2500
      ESTIMATED_DOCUMENT_COUNT: 8
      RUSH_PREMIUM_PCT: 0.25
    precision: "integer cents; round_half_up"
    variants:
      - name: provisional
        when: "At order creation; includes the estimated retrieval allowance"
        difference: "Uses ESTIMATED_DOCUMENT_COUNT projected retrievals instead of actual posted fees"
      - name: final
        when: "At order delivery (see order_fee_actualization for the running form)"
        difference: "Uses only actually posted, non-reversed retrieval fees; provisional allowance is discarded entirely"

  - name: retrieval_fee
    trigger: "POST /api/county-retrievals/{id}/post-fee"
    algorithm: threshold
    formula: |
      if fee_mode == PER_DOCUMENT:
        fee_cents = PER_DOCUMENT_FEE_CENTS
      else:  # PER_PAGE
        fee_cents = page_count * PER_PAGE_FEE_CENTS
    input_set: "The single CountyRetrieval being posted"
    constants:
      PER_DOCUMENT_FEE_CENTS: 2500
      PER_PAGE_FEE_CENTS: 125
    precision: "integer cents; no rounding needed (both branches yield whole cents)"
    variants:
      - name: per_document
        when: "fee_mode == PER_DOCUMENT (flat county instrument charge)"
        difference: "Flat 2500 regardless of page_count"
      - name: per_page
        when: "fee_mode == PER_PAGE"
        difference: "page_count * 125; a 10-page instrument costs 1250 instead of 2500"

  - name: order_fee_actualization
    trigger: "CountyRetrieval post-fee or reverse-fee; AbstractOrder cancel (after fee reversal); read at deliver to set final_fee_cents"
    algorithm: aggregation
    formula: |
      retrieval_sum = SUM(fee_cents) over CountyRetrieval rows of the order
                      with status IN {FEE_POSTED, INVOICED}
      subtotal = BASE_FEE_CENTS + retrieval_sum
      premium = (sla_tier == RUSH) ? round_half_up(subtotal * RUSH_PREMIUM_PCT) : 0
      accrued_fees_cents = subtotal + premium
      At deliver: final_fee_cents := accrued_fees_cents
    input_set: "All CountyRetrieval rows of the order; ONLY statuses FEE_POSTED and INVOICED contribute (REQUESTED has no fee; FEE_REVERSED is excluded)"
    constants:
      BASE_FEE_CENTS: 40000
      RUSH_PREMIUM_PCT: 0.25
    precision: |
      integer cents; PINNED ROUNDING ORDER: the rush premium is computed ONCE on the
      whole subtotal (base + full retrieval sum), never per retrieval line. Per-line
      premium rounding is a forbidden variant: it yields different cents (e.g. 3
      PER_PAGE lines of 375 cents give premium round_half_up(41125*0.25)=10281 on the
      subtotal, versus 3*round_half_up(375*0.25)+round_half_up(40000*0.25)=10282 per line).

  - name: liability_cap
    trigger: "AbstractOrder creation; every accrued_fees_cents recompute; PATCH change of liability_tier; deliver"
    algorithm: threshold
    formula: |
      fee_basis = final_fee_cents if final_fee_cents IS NOT NULL else accrued_fees_cents
      liability_cap_cents = MIN(LIABILITY_MULT[liability_tier] * fee_basis, ABSOLUTE_CAP_CENTS)
    input_set: "The AbstractOrder itself (liability_tier, accrued_fees_cents, final_fee_cents)"
    constants:
      LIABILITY_MULT_STANDARD: 3
      LIABILITY_MULT_EXTENDED: 5
      ABSOLUTE_CAP_CENTS: 200000
    precision: "integer cents"

  - name: sla_due_and_late_credit
    trigger: "due_at computed at creation; late credit evaluated at deliver against the logical clock; is_overdue evaluated on every read and clock set"
    algorithm: chronological
    formula: |
      due_at = received_at + SLA_HOURS[sla_tier]
      At deliver:
        if delivered_at > due_at:   # strictly greater; delivery exactly AT due_at is NOT late
          late_credit_cents = round_half_up(final_fee_cents * LATE_CREDIT_PCT)
        else:
          late_credit_cents = 0
        billed_fee_cents = final_fee_cents - late_credit_cents
      is_overdue = (logical_clock_now > due_at) AND status NOT IN {DELIVERED, CANCELLED}
    input_set: "The AbstractOrder; logical clock"
    constants:
      SLA_HOURS_STANDARD: 72
      SLA_HOURS_RUSH: 24
      LATE_CREDIT_PCT: 0.10
    precision: "integer cents; round_half_up; timestamps compared to the second"

  - name: document_scope
    trigger: "RecordDocument creation; re-derived if order effective_date/search_period_years is patched while RECEIVED or SEARCH_IN_PROGRESS"
    algorithm: threshold
    formula: |
      scope_start_date = effective_date - search_period_years calendar years (same month-day)
      in_scope = (scope_start_date <= recording_date) AND (recording_date <= effective_date)
      # Both bounds INCLUSIVE: recording_date == scope_start_date is in scope;
      # one day before scope_start_date is out of scope.
    input_set: "The RecordDocument's recording_date; parent order's effective_date and search_period_years"
    constants: {}
    precision: "date granularity (day)"

  - name: chain_break_detection
    trigger: "RecordDocument creation when instrument_type == DEED and prior_document_id is set"
    algorithm: constraint_propagation
    formula: |
      chain_break_flag = (TRIM(grantor_name) != TRIM(prior_document.grantee_name))
      # for non-DEED instruments or when prior_document_id is null: false
    input_set: "The new RecordDocument and its referenced prior RecordDocument"
    constants: {}
    precision: "exact string comparison after trimming surrounding whitespace; case-sensitive"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role is permitted to call this endpoint per §1.5 roles; attribute ownership rules (client_ref, abstracter_ref, reviewer_examiner_ref == X-User-ID) enforced here"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: business_constraint
    check: "Well-formed input: required fields present, enum values valid, ranges respected (search_period_years in 1..60, state_code 2 uppercase letters)"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all"
  - priority: 4
    category: existence
    check: "Path and body-referenced resources exist, validated left-to-right: order, then assignment/document/check/report/curative/retrieval"
    error_id: ERR_ORDER_NOT_FOUND
    http_status: 404
    applies_to: "all (resource-specific ids: ERR_ORDER_NOT_FOUND, ERR_ASSIGNMENT_NOT_FOUND, ERR_DOCUMENT_NOT_FOUND, ERR_CHECK_NOT_FOUND, ERR_REPORT_NOT_FOUND, ERR_CURATIVE_NOT_FOUND, ERR_RETRIEVAL_NOT_FOUND)"
  - priority: 5
    category: state
    check: "Domain-specific fee lifecycle guards (fiscal audit precedence — these fire BEFORE the order-terminal guard so an INVOICED retrieval always surfaces its fiscal error): post-fee from FEE_POSTED or FEE_REVERSED -> ERR_FEE_ALREADY_POSTED; post-fee from INVOICED -> ERR_ALREADY_INVOICED; reverse-fee from INVOICED -> ERR_ALREADY_INVOICED"
    error_id: ERR_FEE_ALREADY_POSTED
    http_status: 409
    applies_to: "POST /api/county-retrievals/{id}/post-fee; POST /api/county-retrievals/{id}/reverse-fee (second error_id: ERR_ALREADY_INVOICED)"
  - priority: 6
    category: state
    check: "Parent order is not terminal: any child mutation (documents, curatives, retrievals, checks, reports, assignments) while order.status IN {DELIVERED, CANCELLED} is rejected here BEFORE generic child-level state checks"
    error_id: ERR_ORDER_TERMINAL
    http_status: 409
    applies_to: "child mutation endpoints"
  - priority: 7
    category: state
    check: "Generic: target resource is in a state from which the requested transition exists (per §1.2); includes reverse-fee from REQUESTED or FEE_REVERSED"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 8
    category: business_safety
    check: "CurativeRequirement with severity CRITICAL cannot be waived"
    error_id: ERR_CRITICAL_NOT_WAIVABLE
    http_status: 422
    applies_to: "POST /api/curative-requirements/{id}/waive"
  - priority: 9
    category: business_safety
    check: "Segregation of duties: waiving examiner must not be the examiner who raised the requirement"
    error_id: ERR_SOD_WAIVER_FORBIDDEN
    http_status: 403
    applies_to: "POST /api/curative-requirements/{id}/waive"
  - priority: 10
    category: business_temporal
    check: "window_end > window_start (assignments, ERR_WINDOW_INVALID); review_slot_end > review_slot_start (reports, ERR_SLOT_INVALID)"
    error_id: ERR_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /api/search-assignments; POST /api/abstract-reports/{id}/start-review"
  - priority: 11
    category: business_constraint
    check: "Abstracter half-open window overlap: new [window_start, window_end) must not intersect any non-CANCELLED assignment window of the same abstracter_ref; touching endpoints (end == start) allowed"
    error_id: ERR_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /api/search-assignments"
  - priority: 12
    category: business_constraint
    check: "Examiner buffered review slots: gap between new slot and every existing non-CANCELLED slot of the same examiner_ref must be >= 30 minutes on both sides"
    error_id: ERR_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /api/abstract-reports/{id}/start-review"
  - priority: 13
    category: business_constraint
    check: "instrument_number unique within (order_id) among non-VOID RecordDocuments"
    error_id: ERR_DUPLICATE_INSTRUMENT
    http_status: 409
    applies_to: "POST /api/record-documents"
  - priority: 14
    category: business_constraint
    check: "Only one non-terminal AbstractReport per order"
    error_id: ERR_REPORT_ALREADY_ACTIVE
    http_status: 409
    applies_to: "POST /api/abstract-reports"
  - priority: 15
    category: business_constraint
    check: "Submit requires at least one non-VOID linked document"
    error_id: ERR_EMPTY_ASSIGNMENT
    http_status: 422
    applies_to: "POST /api/search-assignments/{id}/submit"
  - priority: 16
    category: business_constraint
    check: "Submit requires no linked document still in REPORTED"
    error_id: ERR_DOCUMENTS_NOT_EXAMINED
    http_status: 409
    applies_to: "POST /api/search-assignments/{id}/submit"
  - priority: 17
    category: business_referential
    check: "prior_document_id, when set, references a RecordDocument of the SAME order with instrument_type DEED and status != VOID"
    error_id: ERR_CHAIN_LINK_INVALID
    http_status: 422
    applies_to: "POST /api/record-documents"
  - priority: 18
    category: business_constraint
    check: "PER_PAGE fee_mode requires page_count present and >= 1"
    error_id: ERR_PAGE_COUNT_INVALID
    http_status: 422
    applies_to: "POST /api/county-retrievals"
  - priority: 19
    category: business_constraint
    check: "PATCH of search_period_years / effective_date / sla_tier / liability_tier / legal_description_text allowed only while order.status IN {RECEIVED, SEARCH_IN_PROGRESS}"
    error_id: ERR_SCOPE_LOCKED
    http_status: 409
    applies_to: "PATCH /api/abstract-orders/{id}"
  - priority: 20
    category: business_referential
    check: "Approve blocked while any CurativeRequirement of the order is OPEN"
    error_id: ERR_OPEN_CURATIVE_REQUIREMENTS
    http_status: 409
    applies_to: "POST /api/abstract-reports/{id}/approve"
  - priority: 21
    category: business_constraint
    check: "OCC: expected_abstract_order_version must equal the order's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "PATCH /api/abstract-orders/{id}; POST /api/abstract-reports"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/api/abstract-orders"
    description: "Place a new abstracting order; stamps received_at from the logical clock and computes provisional fee, accrued fee, due_at, liability cap"
    roles: [Client]
    code: 201
    input: [client_ref, property_address, county, state_code, legal_description_text, search_period_years, effective_date, "sla_tier?", "liability_tier?"]
    output: AbstractOrder
    side_effects: ["calculation order_fee_provisional", "calculation sla_due_and_late_credit (due_at)", "calculation liability_cap"]
  - method: GET
    path: "/api/abstract-orders/{id}"
    description: "Fetch one order with all computed fields (is_overdue evaluated against the logical clock at read time)"
    roles: [Client, Abstracter, Examiner, OperationsManager]
    code: 200
    input: []
    output: AbstractOrder
    side_effects: []
  - method: GET
    path: "/api/abstract-orders"
    description: "List orders with pagination; Client role sees only own orders"
    roles: [Client, Abstracter, Examiner, OperationsManager]
    code: 200
    input: ["client_ref?", "status?", "limit?", "offset?"]
    output: AbstractOrder[]
    side_effects: []
  - method: PATCH
    path: "/api/abstract-orders/{id}"
    description: "Amend engagement scope while RECEIVED or SEARCH_IN_PROGRESS; OCC-guarded"
    roles: [OperationsManager]
    code: 200
    input: [expected_abstract_order_version, "search_period_years?", "effective_date?", "sla_tier?", "liability_tier?", "legal_description_text?"]
    output: AbstractOrder
    side_effects: ["increments AbstractOrder.version by 1", "recomputes scope_start_date, due_at, provisional_fee_cents, accrued_fees_cents (premium portion), liability_cap_cents as applicable", "recomputes in_scope on every non-VOID RecordDocument of the order when the scope window changed"]
  - method: POST
    path: "/api/abstract-orders/{id}/cancel"
    description: "Cancel a non-terminal order; cascades to assignments, report, and reverses posted fees"
    roles: [Client, OperationsManager]
    code: 200
    input: ["reason?"]
    output: AbstractOrder
    side_effects: ["state machine AbstractOrder cancel transitions"]
  - method: POST
    path: "/api/abstract-orders/{id}/deliver"
    description: "Deliver an approved order; finalizes fees, applies late credit against the logical clock, invoices retrievals"
    roles: [OperationsManager]
    code: 200
    input: []
    output: AbstractOrder
    side_effects: ["state machine AbstractOrder READY_FOR_DELIVERY -> DELIVERED cascade (report -> DELIVERED, retrievals -> INVOICED, final fees + liability recompute)"]

  - method: POST
    path: "/api/search-assignments"
    description: "Dispatch a search assignment to an abstracter with a committed work window; first assignment moves the order to SEARCH_IN_PROGRESS"
    roles: [OperationsManager]
    code: 201
    input: [order_id, abstracter_ref, search_type, window_start, window_end]
    output: SearchAssignment
    side_effects: ["order RECEIVED -> SEARCH_IN_PROGRESS when this is the first assignment", "increments AbstractOrder.version by 1 on that transition"]
  - method: GET
    path: "/api/search-assignments/{id}"
    description: "Fetch one assignment"
    roles: [Client, Abstracter, Examiner, OperationsManager]
    code: 200
    input: []
    output: SearchAssignment
    side_effects: []
  - method: GET
    path: "/api/search-assignments"
    description: "List assignments with pagination and filters"
    roles: [Client, Abstracter, Examiner, OperationsManager]
    code: 200
    input: ["order_id?", "abstracter_ref?", "status?", "limit?", "offset?"]
    output: SearchAssignment[]
    side_effects: []
  - method: POST
    path: "/api/search-assignments/{id}/submit"
    description: "Abstracter submits completed search for examination"
    roles: [Abstracter]
    code: 200
    input: []
    output: SearchAssignment
    side_effects: ["state machine SearchAssignment IN_PROGRESS/RETURNED->SUBMITTED"]
  - method: POST
    path: "/api/search-assignments/{id}/accept"
    description: "Examiner accepts a submitted search; may complete the order's search phase"
    roles: [Examiner]
    code: 200
    input: []
    output: SearchAssignment
    side_effects: ["re-evaluate order SEARCH_IN_PROGRESS -> SEARCH_COMPLETE guard"]
  - method: POST
    path: "/api/search-assignments/{id}/return"
    description: "Examiner returns a submitted search for correction (revision loop)"
    roles: [Examiner]
    code: 200
    input: [reason]
    output: SearchAssignment
    side_effects: ["revision_count += 1", "return_reason := reason"]
  - method: POST
    path: "/api/search-assignments/{id}/resume"
    description: "Abstracter resumes work on a returned assignment"
    roles: [Abstracter]
    code: 200
    input: []
    output: SearchAssignment
    side_effects: []

  - method: POST
    path: "/api/record-documents"
    description: "Record a found instrument (deed, lien, judgment, easement, restriction...) against an assignment"
    roles: [Abstracter]
    code: 201
    input: [order_id, assignment_id, instrument_type, grantor_name, grantee_name, instrument_number, recording_date, "prior_document_id?", "exception_applies?"]
    output: RecordDocument
    side_effects: ["calculation document_scope (in_scope)", "calculation chain_break_detection", "assignment.document_count recomputed"]
  - method: GET
    path: "/api/record-documents/{id}"
    description: "Fetch one recorded document"
    roles: [Client, Abstracter, Examiner, OperationsManager]
    code: 200
    input: []
    output: RecordDocument
    side_effects: []
  - method: GET
    path: "/api/record-documents"
    description: "List recorded documents with pagination and filters (chain children via prior_document_id filter)"
    roles: [Client, Abstracter, Examiner, OperationsManager]
    code: 200
    input: ["order_id?", "assignment_id?", "prior_document_id?", "instrument_type?", "status?", "limit?", "offset?"]
    output: RecordDocument[]
    side_effects: []
  - method: POST
    path: "/api/record-documents/{id}/verify"
    description: "Abstracter verifies a reported or flagged document"
    roles: [Abstracter]
    code: 200
    input: []
    output: RecordDocument
    side_effects: ["assignment.verified_count recomputed"]
  - method: POST
    path: "/api/record-documents/{id}/flag"
    description: "Abstracter flags a reported document for curative action; auto-raises a CurativeRequirement"
    roles: [Abstracter]
    code: 200
    input: [reason]
    output: RecordDocument
    side_effects: ["cascade: creates CurativeRequirement (severity CRITICAL for LIEN/JUDGMENT/TAX_LIEN else STANDARD)", "order.open_curative_count += 1"]
  - method: POST
    path: "/api/record-documents/{id}/void"
    description: "Void a mistakenly recorded document (compensating action)"
    roles: [Abstracter, OperationsManager]
    code: 200
    input: ["reason?"]
    output: RecordDocument
    side_effects: ["assignment.document_count recomputed"]

  - method: POST
    path: "/api/legal-description-checks"
    description: "Open a legal-description verification / survey-exception check for an order"
    roles: [OperationsManager]
    code: 201
    input: [order_id, survey_reference, checked_legal_description]
    output: LegalDescriptionCheck
    side_effects: []
  - method: GET
    path: "/api/legal-description-checks/{id}"
    description: "Fetch one legal description check"
    roles: [Client, Abstracter, Examiner, OperationsManager]
    code: 200
    input: []
    output: LegalDescriptionCheck
    side_effects: []
  - method: GET
    path: "/api/legal-description-checks"
    description: "List legal description checks with pagination and filters"
    roles: [Client, Abstracter, Examiner, OperationsManager]
    code: 200
    input: ["order_id?", "status?", "limit?", "offset?"]
    output: LegalDescriptionCheck[]
    side_effects: []
  - method: POST
    path: "/api/legal-description-checks/{id}/submit-verdict"
    description: "Record the verification verdict; MISMATCH puts the order on legal hold"
    roles: [OperationsManager]
    code: 200
    input: [verdict, survey_exception_applied]
    output: LegalDescriptionCheck
    side_effects: ["order.legal_hold set when verdict == MISMATCH"]
  - method: POST
    path: "/api/legal-description-checks/{id}/resolve"
    description: "Resolve a mismatch with the corrected legal description; clears legal hold and may complete the search phase"
    roles: [OperationsManager]
    code: 200
    input: [resolved_description]
    output: LegalDescriptionCheck
    side_effects: ["order.legal_description_text := resolved_description", "order.legal_hold cleared when no other MISMATCH remains", "re-evaluate order SEARCH_IN_PROGRESS -> SEARCH_COMPLETE guard", "increments AbstractOrder.version by 1"]

  - method: POST
    path: "/api/abstract-reports"
    description: "Open the abstract report for a search-complete order; OCC-guarded by expected_abstract_order_version"
    roles: [Abstracter]
    code: 201
    input: [order_id, title, expected_abstract_order_version]
    output: AbstractReport
    side_effects: ["order SEARCH_COMPLETE -> REPORT_DRAFTING", "increments AbstractOrder.version by 1"]
  - method: GET
    path: "/api/abstract-reports/{id}"
    description: "Fetch one report"
    roles: [Client, Abstracter, Examiner, OperationsManager]
    code: 200
    input: []
    output: AbstractReport
    side_effects: []
  - method: GET
    path: "/api/abstract-reports"
    description: "List reports with pagination and filters"
    roles: [Client, Abstracter, Examiner, OperationsManager]
    code: 200
    input: ["order_id?", "status?", "reviewer_examiner_ref?", "limit?", "offset?"]
    output: AbstractReport[]
    side_effects: []
  - method: POST
    path: "/api/abstract-reports/{id}/submit"
    description: "Submit a draft (or revised) report for examination"
    roles: [Abstracter]
    code: 200
    input: []
    output: AbstractReport
    side_effects: ["order REPORT_DRAFTING -> REPORT_UNDER_REVIEW"]
  - method: POST
    path: "/api/abstract-reports/{id}/start-review"
    description: "Examiner books a buffered review slot and takes the report under review"
    roles: [Examiner]
    code: 200
    input: [review_slot_start, review_slot_end]
    output: AbstractReport
    side_effects: ["reviewer_examiner_ref := X-User-ID", "slots recorded"]
  - method: POST
    path: "/api/abstract-reports/{id}/approve"
    description: "Reviewing examiner approves the report; requires zero open curative requirements"
    roles: [Examiner]
    code: 200
    input: []
    output: AbstractReport
    side_effects: ["order REPORT_UNDER_REVIEW -> READY_FOR_DELIVERY"]
  - method: POST
    path: "/api/abstract-reports/{id}/require-revision"
    description: "Reviewing examiner sends the report back for revision (revision loop)"
    roles: [Examiner]
    code: 200
    input: [reason]
    output: AbstractReport
    side_effects: ["revision_number += 1", "revision_reason := reason", "order REPORT_UNDER_REVIEW -> REPORT_DRAFTING"]

  - method: POST
    path: "/api/curative-requirements"
    description: "Examiner raises a curative requirement against an order (optionally tied to a recorded document)"
    roles: [Examiner]
    code: 201
    input: [order_id, description, "record_document_id?", "severity?"]
    output: CurativeRequirement
    side_effects: ["raised_by_examiner_ref := X-User-ID", "order.open_curative_count += 1"]
  - method: GET
    path: "/api/curative-requirements/{id}"
    description: "Fetch one curative requirement"
    roles: [Client, Abstracter, Examiner, OperationsManager]
    code: 200
    input: []
    output: CurativeRequirement
    side_effects: []
  - method: GET
    path: "/api/curative-requirements"
    description: "List curative requirements with pagination and filters"
    roles: [Client, Abstracter, Examiner, OperationsManager]
    code: 200
    input: ["order_id?", "record_document_id?", "raised_by_examiner_ref?", "status?", "limit?", "offset?"]
    output: CurativeRequirement[]
    side_effects: []
  - method: POST
    path: "/api/curative-requirements/{id}/satisfy"
    description: "Abstracter marks a requirement cured"
    roles: [Abstracter]
    code: 200
    input: [resolution_note]
    output: CurativeRequirement
    side_effects: ["order.open_curative_count -= 1"]
  - method: POST
    path: "/api/curative-requirements/{id}/waive"
    description: "Examiner waives a non-CRITICAL requirement raised by a different examiner (segregation of duties)"
    roles: [Examiner]
    code: 200
    input: [resolution_note]
    output: CurativeRequirement
    side_effects: ["order.open_curative_count -= 1"]

  - method: POST
    path: "/api/county-retrievals"
    description: "Abstracter requests county retrieval of a recorded instrument"
    roles: [Abstracter]
    code: 201
    input: [order_id, record_document_id, county, "fee_mode?", "page_count?"]
    output: CountyRetrieval
    side_effects: []
  - method: GET
    path: "/api/county-retrievals/{id}"
    description: "Fetch one county retrieval"
    roles: [Client, Abstracter, Examiner, OperationsManager]
    code: 200
    input: []
    output: CountyRetrieval
    side_effects: []
  - method: GET
    path: "/api/county-retrievals"
    description: "List county retrievals with pagination and filters"
    roles: [Client, Abstracter, Examiner, OperationsManager]
    code: 200
    input: ["order_id?", "record_document_id?", "status?", "limit?", "offset?"]
    output: CountyRetrieval[]
    side_effects: []
  - method: POST
    path: "/api/county-retrievals/{id}/post-fee"
    description: "OperationsManager posts the county pass-through fee; recomputes order accrued fees and liability cap"
    roles: [OperationsManager]
    code: 200
    input: []
    output: CountyRetrieval
    side_effects: ["calculation retrieval_fee (fee_cents)", "calculation order_fee_actualization", "calculation liability_cap"]
  - method: POST
    path: "/api/county-retrievals/{id}/reverse-fee"
    description: "OperationsManager reverses a posted (not yet invoiced) fee; compensating action restoring accrued fees"
    roles: [OperationsManager]
    code: 200
    input: ["reason?"]
    output: CountyRetrieval
    side_effects: ["calculation order_fee_actualization", "calculation liability_cap"]

  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Test-driving logical clock. Server startup default is exactly 2026-08-01T00:00:00Z; before any set_current_utc call the logical clock reads this default and never falls back to wall-clock time. Sets the logical clock used for received_at, due_at, delivered_at, is_overdue, and late-credit evaluation."
    roles: [OperationsManager]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["re-evaluates is_overdue on all non-terminal orders"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or invalid X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not allowed on endpoint, or attribute ownership mismatch (client_ref / abstracter_ref / reviewer_examiner_ref != X-User-ID)" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "AbstractOrder id does not exist" }
  - { id: ERR_ASSIGNMENT_NOT_FOUND, http: 404, condition: "SearchAssignment id does not exist" }
  - { id: ERR_DOCUMENT_NOT_FOUND, http: 404, condition: "RecordDocument id (or prior_document_id) does not exist" }
  - { id: ERR_CHECK_NOT_FOUND, http: 404, condition: "LegalDescriptionCheck id does not exist" }
  - { id: ERR_REPORT_NOT_FOUND, http: 404, condition: "AbstractReport id does not exist" }
  - { id: ERR_CURATIVE_NOT_FOUND, http: 404, condition: "CurativeRequirement id does not exist" }
  - { id: ERR_RETRIEVAL_NOT_FOUND, http: 404, condition: "CountyRetrieval id does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a state from which the requested transition exists" }
  - { id: ERR_ORDER_TERMINAL, http: 409, condition: "Child mutation attempted while parent order is DELIVERED or CANCELLED" }
  - { id: ERR_CRITICAL_NOT_WAIVABLE, http: 422, condition: "Waive attempted on a CRITICAL curative requirement" }
  - { id: ERR_SOD_WAIVER_FORBIDDEN, http: 403, condition: "Waiving examiner is the same examiner who raised the requirement" }
  - { id: ERR_WINDOW_INVALID, http: 422, condition: "window_end <= window_start on assignment creation" }
  - { id: ERR_SLOT_INVALID, http: 422, condition: "review_slot_end <= review_slot_start on start-review" }
  - { id: ERR_WINDOW_OVERLAP, http: 409, condition: "New assignment window intersects an existing non-CANCELLED window of the same abstracter (half-open semantics)" }
  - { id: ERR_SLOT_CONFLICT, http: 409, condition: "New review slot has < 30 minutes gap to an existing non-CANCELLED slot of the same examiner" }
  - { id: ERR_DUPLICATE_INSTRUMENT, http: 409, condition: "instrument_number already recorded for this order on a non-VOID document" }
  - { id: ERR_REPORT_ALREADY_ACTIVE, http: 409, condition: "Order already has a non-terminal AbstractReport" }
  - { id: ERR_EMPTY_ASSIGNMENT, http: 422, condition: "Submit with zero non-VOID linked documents" }
  - { id: ERR_DOCUMENTS_NOT_EXAMINED, http: 409, condition: "Submit while a linked document is still REPORTED" }
  - { id: ERR_CHAIN_LINK_INVALID, http: 422, condition: "prior_document_id is not a DEED of the same order, or references a VOID document" }
  - { id: ERR_PAGE_COUNT_INVALID, http: 422, condition: "PER_PAGE retrieval without page_count >= 1" }
  - { id: ERR_FEE_ALREADY_POSTED, http: 409, condition: "post-fee on a retrieval not in REQUESTED" }
  - { id: ERR_ALREADY_INVOICED, http: 409, condition: "reverse-fee on an INVOICED retrieval" }
  - { id: ERR_SCOPE_LOCKED, http: 409, condition: "PATCH of scope fields after the order has left RECEIVED / SEARCH_IN_PROGRESS" }
  - { id: ERR_OPEN_CURATIVE_REQUIREMENTS, http: 409, condition: "Report approval attempted with OPEN curative requirements on the order" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_abstract_order_version does not match the order's current version" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed input: missing required field, invalid enum, out-of-range value" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Client
    description: "Ordering party (lender / buyer counsel); self-service order placement and tracking"
    identity: opaque
    exclusive_operations:
      - "POST /api/abstract-orders (client_ref must equal X-User-ID)"
    shared_operations:
      - "GET /api/abstract-orders* (own orders only; others -> ERR_FORBIDDEN)"
      - "POST /api/abstract-orders/{id}/cancel (own orders only)"
      - "GET on all other resources (read-only visibility)"
  - name: Abstracter
    description: "Performs the public-record search, records instruments, drafts the abstract report, cures requirements"
    identity: opaque
    exclusive_operations:
      - "POST /api/record-documents*, POST /api/record-documents/{id}/verify, /flag (own assignments only)"
      - "POST /api/search-assignments/{id}/submit, /resume (own assignments only)"
      - "POST /api/abstract-reports, POST /api/abstract-reports/{id}/submit"
      - "POST /api/curative-requirements/{id}/satisfy"
      - "POST /api/county-retrievals"
    shared_operations:
      - "POST /api/record-documents/{id}/void (own assignments; shared with OperationsManager)"
      - "GET on all resources"
  - name: Examiner
    description: "Reviews searches and reports, books review slots, raises and waives curative requirements"
    identity: opaque
    exclusive_operations:
      - "POST /api/search-assignments/{id}/accept, /return"
      - "POST /api/abstract-reports/{id}/start-review, /approve, /require-revision (approve/require-revision only as booked reviewer)"
      - "POST /api/curative-requirements (raise)"
      - "POST /api/curative-requirements/{id}/waive (never own-raised; non-CRITICAL only)"
    shared_operations:
      - "GET on all resources"
  - name: OperationsManager
    description: "Dispatches assignments, runs intake QC (legal description checks), posts county fees, delivers orders, administers scope changes and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /api/search-assignments"
      - "POST /api/legal-description-checks*, /submit-verdict, /resolve"
      - "POST /api/county-retrievals/{id}/post-fee, /reverse-fee"
      - "POST /api/abstract-orders/{id}/deliver"
      - "PATCH /api/abstract-orders/{id}"
      - "POST /api/_clock/set_current_utc"
    shared_operations:
      - "POST /api/abstract-orders/{id}/cancel (any order)"
      - "POST /api/record-documents/{id}/void"
      - "GET on all resources"
