            - call: "POST /vote-by-mail/elections/${e1}/canvass-sweep"
              payload: {}
              as: CanvassSupervisor
              captures: { sweep_role_err: $.data.error_id }
            - call: "POST /vote-by-mail/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T09:00:00Z" }
              as: CanvassSupervisor
              captures: { clock_role_err: $.data.error_id }
          assert:
            - "All three calls: HTTP 403 with data.error_id == \"ERR_ROLE_FORBIDDEN\""
            - "GET /vote-by-mail/elections/${e1} returns posture == \"PRE_MAIL\" and canvass_sweep_index == 0"
            - "GET /vote-by-mail/transparency-log?election_id=${e1}&event_type=POSTURE_CHANGED returns total_count == 0"

      - name: observer_reads_transparency_surfaces_but_not_voter_records
        claim_type: Shared operations
        grounds:
          - roles.Observer.shared_operations
          - roles.ElectionsClerk.shared_operations
          - validations[ERR_ROLE_FORBIDDEN]
        distinguishing_aspect: "Observer is listed on the election read, the accountability read and the transparency log but on no voter or signature-review read: the first three return 200 and the last two return 403 ERR_ROLE_FORBIDDEN for the same session."
