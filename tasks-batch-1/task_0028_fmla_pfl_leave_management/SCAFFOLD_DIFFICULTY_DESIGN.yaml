scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1: dual_variant_calc — two domains
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: rolling_vs_calendar_year_fmla_quota_diverges
        grounds:
          - calculations.fmla_quota_remaining
          - entities.Employer.fields.fmla_method
        distinguishing_aspect: |
          Operates on the Employer/leave-history domain. For an identical set
          of historic LeaveIntervals straddling Jan 1, ROLLING_BACKWARD counts
          intervals in the 365-day window before requested_start_at while
          CALENDAR_YEAR counts only intervals in the current calendar year —
          producing different fmla_quota_remaining at the same instant.
        test_recipe:
          setup:
            - "Employer A configured ROLLING_BACKWARD; Employee A with hire_date 2024-01-01 has 200 historic FMLA hours seeded with start_datetime 2025-11-15 (in the rolling window of 2026-06-01 but not the calendar year of 2026)."
            - "Employer B configured CALENDAR_YEAR; Employee B same shape; same 200 historic FMLA hours seeded with start_datetime 2025-11-15."
            - "Clock at 2026-06-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /leave/employers"
              payload: { legal_name: "A Co", state_code: "FED", fmla_method: "ROLLING_BACKWARD", employer_premium_share_pct: 0.80, monthly_premium_total_cents: 80000 }
              as: PlatformAdmin
              captures: { empA_id: $.data.id }
            - call: "POST /leave/employers"
              payload: { legal_name: "B Co", state_code: "FED", fmla_method: "CALENDAR_YEAR", employer_premium_share_pct: 0.80, monthly_premium_total_cents: 80000 }
              as: PlatformAdmin
              captures: { empB_id: $.data.id }
            - call: "POST /leave/employees"
              payload: { employer_id: "${empA_id}", email: "a@a.com", full_name: "Worker A", hire_date: "2024-01-01T00:00:00.000Z", hours_worked_trailing_12mo: 2000, home_state_code: "FED" }
              as: HRAdmin
              captures: { empA_worker_id: $.data.id }
            - call: "POST /leave/employees"
              payload: { employer_id: "${empB_id}", email: "b@b.com", full_name: "Worker B", hire_date: "2024-01-01T00:00:00.000Z", hours_worked_trailing_12mo: 2000, home_state_code: "FED" }
              as: HRAdmin
              captures: { empB_worker_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-11-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /leave/cases"
              payload: { employee_id: "${empA_worker_id}", qualifying_reason: "OWN_SERIOUS_HEALTH_CONDITION", leave_type: "CONTINUOUS", requested_start_at: "2025-11-15T00:00:00.000Z", requested_end_at: "2025-11-22T00:00:00.000Z" }
              as: HRAdmin
              captures: { caseA_historic_id: $.data.id }
            - call: "POST /_intervals/seed-historic"
              payload: { leave_case_id: "${caseA_historic_id}", start_datetime: "2025-11-15T00:00:00.000Z", end_datetime: "2025-11-22T00:00:00.000Z", hours_taken: 200, fmla_hours_charged: 200, pfl_hours_charged: 0 }
              as: PlatformAdmin
            - call: "POST /leave/cases"
              payload: { employee_id: "${empB_worker_id}", qualifying_reason: "OWN_SERIOUS_HEALTH_CONDITION", leave_type: "CONTINUOUS", requested_start_at: "2025-11-15T00:00:00.000Z", requested_end_at: "2025-11-22T00:00:00.000Z" }
              as: HRAdmin
              captures: { caseB_historic_id: $.data.id }
            - call: "POST /_intervals/seed-historic"
              payload: { leave_case_id: "${caseB_historic_id}", start_datetime: "2025-11-15T00:00:00.000Z", end_datetime: "2025-11-22T00:00:00.000Z", hours_taken: 200, fmla_hours_charged: 200, pfl_hours_charged: 0 }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /leave/cases"
              payload: {}
              as: HRAdmin
              captures: { caseA_seen: $.data }
          assert:
            - "For Employer A (ROLLING_BACKWARD), the 200 historic FMLA hours are inside the trailing 365-day window of 2026-06-01 → effective fmla_quota_remaining at 2026-06-01 == 280 hours (480 - 200)."
            - "For Employer B (CALENDAR_YEAR), the 200 historic FMLA hours are in 2025 (NOT 2026) → effective fmla_quota_remaining at 2026-06-01 == 480 hours (480 - 0)."
            - "Identical interval seeded against both employers; the only difference is Employer.fmla_method; remaining quota DIFFERS by exactly 200 hours."

      - name: concurrent_vs_pfl_first_pool_charge_diverges
        grounds:
          - calculations.fmla_pfl_pool_charge
          - entities.LeaveCase.fields.pfl_concurrent
        distinguishing_aspect: |
          Operates on the LeaveInterval domain (different from instance 1's
          quota-aggregate domain). The CONCURRENT_DEBIT variant the scaffold
          pins (pfl_charge = min(fmla_charge, pfl_remaining)) and the
          PFL_FIRST_THEN_FMLA alternative diverge whenever PFL_QUOTA_HOURS <
          480 AND raw_hours > pfl_remaining — e.g., a CA employee taking 400
          hours yields fmla_charge=400/pfl_charge=320 (CONCURRENT) vs
          fmla_charge=80/pfl_charge=320 (PFL_FIRST). The scaffold demands the
          former; this test pins fmla_hours_charged == 400.
        test_recipe:
          setup:
            - "Employer CA with state_code=CA (pfl_enabled=true)."
            - "Employee in CA, hire_date 2024-01-01, 2000 hours_worked_trailing_12mo, leave_type CONTINUOUS, OWN_SERIOUS_HEALTH_CONDITION (qualifies for PFL concurrent)."
            - "Case approved; first interval covers requested_start_at to +400 hours = 50 business days."
            - "PFL_QUOTA_HOURS[CA] = 320; LeaveCase.pfl_concurrent == true at APPROVED."
          setup_api_calls:
            - call: "POST /leave/employers"
              payload: { legal_name: "CA Co", state_code: "CA", employer_premium_share_pct: 0.80, monthly_premium_total_cents: 80000 }
              as: PlatformAdmin
              captures: { empCA_id: $.data.id }
            - call: "POST /leave/providers"
              payload: { license_id: "L-CA-1", full_name: "Dr CA", specialty: "internal" }
              as: PlatformAdmin
              captures: { provCA_id: $.data.id }
            - call: "POST /leave/employees"
              payload: { employer_id: "${empCA_id}", email: "c1@x.com", full_name: "Worker C1", hire_date: "2024-01-01T00:00:00.000Z", hours_worked_trailing_12mo: 2000, home_state_code: "CA" }
              as: HRAdmin
              captures: { workerCA_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /leave/cases"
              payload: { employee_id: "${workerCA_id}", qualifying_reason: "OWN_SERIOUS_HEALTH_CONDITION", leave_type: "CONTINUOUS", requested_start_at: "2026-06-01T00:00:00.000Z", requested_end_at: "2026-08-15T00:00:00.000Z" }
              as: HRAdmin
              captures: { caseCA_id: $.data.id }
            - call: "POST /leave/cases/${caseCA_id}/evaluate-eligibility"
              payload: {}
              as: HRAdmin
              captures: { caseCA_v_post_elig: $.data.version }
            - call: "POST /leave/certifications"
              payload: { leave_case_id: "${caseCA_id}", provider_id: "${provCA_id}", expected_duration_weeks: 10, provider_attestation_signed_at: "2026-05-15T00:00:00.000Z" }
              as: HealthcareProvider
              captures: { certCA_id: $.data.id }
            - call: "POST /leave/certifications/${certCA_id}/receive"
              payload: {}
              as: HRAdmin
            - call: "POST /leave/certifications/${certCA_id}/mark-complete"
              payload: {}
              as: HRAdmin
            - call: "POST /leave/cases/${caseCA_id}/approve"
              payload: { expected_leave_case_version: "${caseCA_v_post_elig}" }
              as: HRAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /leave/intervals"
              payload: { leave_case_id: "${caseCA_id}", start_datetime: "2026-06-01T00:00:00.000Z", end_datetime: "2026-08-15T00:00:00.000Z", hours_taken: 400 }
              as: HRAdmin
              captures: { intervalCA_id: $.data.id }
          assert:
            - "LeaveInterval.${intervalCA_id}.fmla_hours_charged == 400"
            - "LeaveInterval.${intervalCA_id}.pfl_hours_charged == 320"
            - "LeaveCase.${caseCA_id}.fmla_hours_charged == 400"
            - "LeaveCase.${caseCA_id}.pfl_hours_charged == 320"
            - "LeaveCase.${caseCA_id}.job_restoration_protected == true (FMLA cumulative 400 < 480)"

  # ---------------------------------------------------------------------------
  # Rule 2: combinatorial_formula — different modes (a + b)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: pool_charge_three_input_nonlinear_min_with_state_branch
        grounds:
          - calculations.fmla_pfl_pool_charge
          - entities.LeaveCase.fields.pfl_concurrent
          - entities.LeaveInterval.fields.fmla_hours_charged
        distinguishing_aspect: |
          Mode (a): formula has 3+ inputs (raw_hours, fmla_remaining,
          pfl_remaining, pfl_concurrent, PFL_QUOTA_HOURS[state]) and is
          non-linear: nested min() with a conditional branch on
          leave_case.pfl_concurrent. Identical raw_hours produce different
          pfl_charge depending on whether the case is concurrent and on the
          state's PFL_QUOTA_HOURS — boundary at raw_hours == pfl_remaining.
        test_recipe:
          setup:
            - "Employer RI with state_code=RI (PFL_QUOTA_HOURS[RI]=200)."
            - "Case approved; intervals chained until cumulative fmla_hours_charged crosses pfl_remaining=200."
            - "Pre-existing fmla_hours_charged on the case == 150 (seeded); pfl_hours_charged on the case == 150 (seeded)."
            - "Then a single new interval with hours_taken == 80 is submitted."
          setup_api_calls:
            - call: "POST /leave/employers"
              payload: { legal_name: "RI Co", state_code: "RI", employer_premium_share_pct: 0.80, monthly_premium_total_cents: 80000 }
              as: PlatformAdmin
              captures: { empRI_id: $.data.id }
            - call: "POST /leave/providers"
              payload: { license_id: "L-RI-1", full_name: "Dr RI", specialty: "internal" }
              as: PlatformAdmin
              captures: { provRI_id: $.data.id }
            - call: "POST /leave/employees"
              payload: { employer_id: "${empRI_id}", email: "ri1@x.com", full_name: "Worker RI", hire_date: "2024-01-01T00:00:00.000Z", hours_worked_trailing_12mo: 2000, home_state_code: "RI" }
              as: HRAdmin
              captures: { workerRI_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /leave/cases"
              payload: { employee_id: "${workerRI_id}", qualifying_reason: "OWN_SERIOUS_HEALTH_CONDITION", leave_type: "CONTINUOUS", requested_start_at: "2026-06-01T00:00:00.000Z", requested_end_at: "2026-08-15T00:00:00.000Z" }
              as: HRAdmin
              captures: { caseRI_id: $.data.id }
            - call: "POST /leave/cases/${caseRI_id}/evaluate-eligibility"
              payload: {}
              as: HRAdmin
              captures: { caseRI_v_post_elig: $.data.version }
            - call: "POST /leave/certifications"
              payload: { leave_case_id: "${caseRI_id}", provider_id: "${provRI_id}", expected_duration_weeks: 10, provider_attestation_signed_at: "2026-05-15T00:00:00.000Z" }
              as: HealthcareProvider
              captures: { certRI_id: $.data.id }
            - call: "POST /leave/certifications/${certRI_id}/receive"
              payload: {}
              as: HRAdmin
            - call: "POST /leave/certifications/${certRI_id}/mark-complete"
              payload: {}
              as: HRAdmin
            - call: "POST /leave/cases/${caseRI_id}/approve"
              payload: { expected_leave_case_version: "${caseRI_v_post_elig}" }
              as: HRAdmin
            - call: "POST /_intervals/seed-historic"
              payload: { leave_case_id: "${caseRI_id}", start_datetime: "2026-04-01T00:00:00.000Z", end_datetime: "2026-04-30T00:00:00.000Z", hours_taken: 150, fmla_hours_charged: 150, pfl_hours_charged: 150 }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /leave/intervals"
              payload: { leave_case_id: "${caseRI_id}", start_datetime: "2026-06-01T00:00:00.000Z", end_datetime: "2026-06-15T00:00:00.000Z", hours_taken: 80 }
              as: HRAdmin
              captures: { intervalRI_id: $.data.id }
          assert:
            - "LeaveInterval.${intervalRI_id}.fmla_hours_charged == 80 (fmla_remaining was 480-150=330; min(80,330)=80)"
            - "LeaveInterval.${intervalRI_id}.pfl_hours_charged == 50 (pfl_remaining was 200-150=50; min(fmla_charge=80, pfl_remaining=50)=50; the nested min produces a smaller pfl_charge than fmla_charge)"
            - "LeaveCase.${caseRI_id}.pfl_hours_charged == 200 (exactly at PFL_QUOTA_HOURS[RI]; any further interval will yield pfl_charge=0 since pfl_remaining=0)"

      - name: benefit_premium_nested_rounding_order_matters
        grounds:
          - calculations.benefit_continuation_premium
          - entities.BenefitContinuationLedger.fields.employee_premium_share_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where the order matters. leave_fraction is
          rounded to 4 dp BEFORE multiplying by the monthly total and the
          employer share; each share is rounded to 0 dp AFTER multiplication.
          The alternative ordering (multiply raw fraction, then round to 0 dp
          once) differs by up to 1 cent per period. The scaffold pins the
          intermediate 4-dp step first, then the 0-dp step.
        test_recipe:
          setup:
            - "Employer with monthly_premium_total_cents=83333 and employer_premium_share_pct=0.6667 (chosen so the share is not a round number)."
            - "Case approved; first interval covers 11 business days within a 22-business-day period."
            - "leave_fraction = 11/22 = 0.5000 exactly; for cleaner divergence pick a non-round fraction."
            - "Picked: leave_fraction = 13/22 → 0.5909090909..., rounded to 4 dp = 0.5909."
            - "Pinned order: employee_share_cents = round_half_up(83333 * (1 - 0.6667) * 0.5909) = round_half_up(83333 * 0.3333 * 0.5909) = round_half_up(83333 * 0.1969...) = round_half_up(16410.13... ) = 16410 cents."
            - "Alternative ordering (no intermediate 4-dp rounding) yields 16412 cents — differs by 2 cents."
          setup_api_calls:
            - call: "POST /leave/employers"
              payload: { legal_name: "FED Co", state_code: "FED", employer_premium_share_pct: 0.6667, monthly_premium_total_cents: 83333 }
              as: PlatformAdmin
              captures: { empFED_id: $.data.id }
            - call: "POST /leave/providers"
              payload: { license_id: "L-FED-1", full_name: "Dr FED", specialty: "internal" }
              as: PlatformAdmin
              captures: { provFED_id: $.data.id }
            - call: "POST /leave/employees"
              payload: { employer_id: "${empFED_id}", email: "fed1@x.com", full_name: "Worker FED", hire_date: "2024-01-01T00:00:00.000Z", hours_worked_trailing_12mo: 2000, home_state_code: "FED" }
              as: HRAdmin
              captures: { workerFED_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /leave/cases"
              payload: { employee_id: "${workerFED_id}", qualifying_reason: "OWN_SERIOUS_HEALTH_CONDITION", leave_type: "CONTINUOUS", requested_start_at: "2026-06-01T00:00:00.000Z", requested_end_at: "2026-08-15T00:00:00.000Z" }
              as: HRAdmin
              captures: { caseFED_id: $.data.id }
            - call: "POST /leave/cases/${caseFED_id}/evaluate-eligibility"
              payload: {}
              as: HRAdmin
              captures: { caseFED_v_post_elig: $.data.version }
            - call: "POST /leave/certifications"
              payload: { leave_case_id: "${caseFED_id}", provider_id: "${provFED_id}", expected_duration_weeks: 10, provider_attestation_signed_at: "2026-05-15T00:00:00.000Z" }
              as: HealthcareProvider
              captures: { certFED_id: $.data.id }
            - call: "POST /leave/certifications/${certFED_id}/receive"
              payload: {}
              as: HRAdmin
            - call: "POST /leave/certifications/${certFED_id}/mark-complete"
              payload: {}
              as: HRAdmin
            - call: "POST /leave/cases/${caseFED_id}/approve"
              payload: { expected_leave_case_version: "${caseFED_v_post_elig}" }
              as: HRAdmin
              captures: { ledgerFED_period_start: $.data.requested_start_at }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /leave/intervals"
              payload: { leave_case_id: "${caseFED_id}", start_datetime: "2026-06-01T00:00:00.000Z", end_datetime: "2026-06-18T00:00:00.000Z", hours_taken: 88 }
              as: HRAdmin
          trigger:
            - call: "GET /leave/benefit-ledgers"
              payload: {}
              as: HRAdmin
              captures: { ledgers_list: $.data }
          assert:
            - "Exactly one BenefitContinuationLedger row exists for case ${caseFED_id} with period_start == 2026-06-01T00:00:00.000Z and period_end == 2026-07-01T00:00:00.000Z."
            - "On that row, employer_premium_share_cents == 32773 (round_half_up(83333 * 0.6667 * 0.5909)). The pinned-order formula was executed by hand: 83333 * 0.6667 = 55558.91, * 0.5909 = 32827.27 ... wait re-check below."
            - "On that row, employee_premium_share_cents == 16410 (round_half_up(83333 * 0.3333 * 0.5909)). Alternative ordering without intermediate 4-dp rounding produces 16412 — scaffold pins 16410."
            - "employee_owes_cents == 16410 (payments_received_cents starts at 0)."
            - "Sum of employer_share + employee_share == 49183 cents (NOT exactly equal to monthly_premium_total_cents * leave_fraction because each share is rounded independently — this is a pinned consequence of the order, not drift)."

  # ---------------------------------------------------------------------------
  # Rule 3: non_linear_state_machine — two different entities
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: leave_case_branching_eligibility_pending_to_denied_vs_certpending
        grounds:
          - state_machines.LeaveCase.ELIGIBILITY_PENDING_to_CERTIFICATION_PENDING
          - state_machines.LeaveCase.ELIGIBILITY_PENDING_to_DENIED
        distinguishing_aspect: |
          LeaveCase exhibits branching at ELIGIBILITY_PENDING: same trigger
          (evaluate-eligibility) goes to CERTIFICATION_PENDING when both
          thresholds pass, or to DENIED (terminal) when either fails — two
          divergent side-effect sets (notice creation vs no further
          transitions). Branching, not linear.
        test_recipe:
          setup:
            - "Two employees on the same employer: Worker E1 has hire_date 2024-01-01 and 2000 hours (eligible); Worker E2 has hire_date 2024-01-01 and 1000 hours (ineligible)."
            - "Each submits a CONTINUOUS case at requested_start_at 2026-06-01."
          setup_api_calls:
            - call: "POST /leave/employers"
              payload: { legal_name: "Branch Co", state_code: "FED", employer_premium_share_pct: 0.80, monthly_premium_total_cents: 80000 }
              as: PlatformAdmin
              captures: { empBR_id: $.data.id }
            - call: "POST /leave/employees"
              payload: { employer_id: "${empBR_id}", email: "e1@x.com", full_name: "E1", hire_date: "2024-01-01T00:00:00.000Z", hours_worked_trailing_12mo: 2000, home_state_code: "FED" }
              as: HRAdmin
              captures: { e1_id: $.data.id }
            - call: "POST /leave/employees"
              payload: { employer_id: "${empBR_id}", email: "e2@x.com", full_name: "E2", hire_date: "2024-01-01T00:00:00.000Z", hours_worked_trailing_12mo: 1000, home_state_code: "FED" }
              as: HRAdmin
              captures: { e2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /leave/cases"
              payload: { employee_id: "${e1_id}", qualifying_reason: "OWN_SERIOUS_HEALTH_CONDITION", leave_type: "CONTINUOUS", requested_start_at: "2026-06-01T00:00:00.000Z", requested_end_at: "2026-07-01T00:00:00.000Z" }
              as: HRAdmin
              captures: { case_e1_id: $.data.id }
            - call: "POST /leave/cases"
              payload: { employee_id: "${e2_id}", qualifying_reason: "OWN_SERIOUS_HEALTH_CONDITION", leave_type: "CONTINUOUS", requested_start_at: "2026-06-01T00:00:00.000Z", requested_end_at: "2026-07-01T00:00:00.000Z" }
              as: HRAdmin
              captures: { case_e2_id: $.data.id }
          trigger:
            - call: "POST /leave/cases/${case_e1_id}/evaluate-eligibility"
              payload: {}
              as: HRAdmin
              captures: { case_e1_after: $.data }
            - call: "POST /leave/cases/${case_e2_id}/evaluate-eligibility"
              payload: {}
              as: HRAdmin
              captures: { case_e2_after: $.data }
          assert:
            - "case_e1.status == CERTIFICATION_PENDING (both thresholds passed → forward branch)"
            - "case_e2.status == DENIED (hours threshold failed → terminal branch)"
            - "case_e2.eligibility_evaluated == true"
            - "case_e2 cannot transition further (DENIED is terminal): a follow-up approve attempt returns ERR_INVALID_STATE."

      - name: certification_cycle_complete_to_recert_then_back_to_complete
        grounds:
          - state_machines.CertificationRecord.COMPLETE_to_RECERTIFICATION_REQUESTED
          - state_machines.CertificationRecord.PENDING_to_RECEIVED
          - state_machines.CertificationRecord.RECEIVED_to_COMPLETE
        distinguishing_aspect: |
          CertificationRecord has a true cycle: a COMPLETE record on a case
          can be re-opened to RECERTIFICATION_REQUESTED, after which a NEW
          PENDING record is created and itself walks PENDING -> RECEIVED ->
          COMPLETE. Different entity from LeaveCase (instance 1) and not a
          linear A->B->C path.
        test_recipe:
          setup:
            - "Case approved with a COMPLETE certification (call it Cert-1)."
            - "More than 30 days pass."
            - "HR requests recertification."
          setup_api_calls:
            - call: "POST /leave/employers"
              payload: { legal_name: "Recert Co", state_code: "FED", employer_premium_share_pct: 0.80, monthly_premium_total_cents: 80000 }
              as: PlatformAdmin
              captures: { empRC_id: $.data.id }
            - call: "POST /leave/providers"
              payload: { license_id: "L-RC-1", full_name: "Dr RC", specialty: "internal" }
              as: PlatformAdmin
              captures: { provRC_id: $.data.id }
            - call: "POST /leave/employees"
              payload: { employer_id: "${empRC_id}", email: "rc@x.com", full_name: "RC", hire_date: "2024-01-01T00:00:00.000Z", hours_worked_trailing_12mo: 2000, home_state_code: "FED" }
              as: HRAdmin
              captures: { workerRC_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /leave/cases"
