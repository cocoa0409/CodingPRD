  # ===========================================================================
  # RULE 9 — Compensating invariants over two different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: draw_reversal_restores_the_funding_ledger_with_no_drift
        grounds:
          - state_machines.FundingDraw.SETTLED_to_REVERSED
          - calculations.draw_settlement_economics
          - calculations.holdback_reserve_target
          - calculations.staged_funding_availability
          - entities.Merchant.fields.holdback_reserve_cents
          - entities.LoanAccount.fields.principal_balance_cents
          - endpoints.POST_/funding-draws/{id}/reversal
        distinguishing_aspect: |
          CONSERVED QUANTITY: the FUNDING LEDGER — the four-way tuple
          (LoanAccount.principal_balance_cents + total_funded_cents,
          Merchant.funded_volume_cents + holdback_reserve_cents,
          Project.settled_funded_cents + funded_pct_bps, ProjectMilestone.is_funded).
          A reversal must undo every settlement side effect exactly, so the tuple returns
          to its pre-draw values with zero drift even though the withheld holdback (42000)
          and the discount (47145) were computed by two rounding formulas. Monotonic
          counters are explicitly NOT conserved: both version numbers advance twice.
        test_recipe:
          setup:
            - "Program, APPROVED merchant (version 3), ACTIVE enrollment with negotiated_discount_bps 449, ACTIVATED application, PROMO_ACTIVE LoanAccount at version 1."
            - "Project 3500000 with milestone 1 (3000 bps) VERIFIED; the merchant has no other draws, so trailing90 and trailing180 volume are both 0 and risk_tier is STANDARD (400 bps target)."
            - "PRE-DRAW SNAPSHOT (all figures zero except headroom): funded_volume 0, holdback_reserve 0, holdback_target 0, reserve_coverage 10000, settled_funded 0, funded_pct 0, max_fundable_now 1050000, is_funded false, principal 0, total_funded 0, first_funding_on null."
            - "Logical clock stays at 2026-08-01T00:00:00Z for settlement and reversal, so accrual stays 0 and the reversal cannot be confused with an accrual change."
