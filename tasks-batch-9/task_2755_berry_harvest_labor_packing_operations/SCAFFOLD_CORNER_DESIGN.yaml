      - name: block_separation_ignores_cancelled_windows
        claim_type: input_set_filtering
        grounds:
          - calculations.block_window_separation
          - state_machines.HarvestWindow.PLANNED_to_CANCELLED
          - endpoints["POST /berry-ops/harvest-windows"]
        distinguishing_aspect: |
          The separation check reads only live windows (PLANNED, CONFIRMED, OPEN,
          SUSPENDED). After the first window is cancelled, a second window
          starting at exactly its former end_at is accepted with 201 — an
          instant that would have been a hard conflict while the first window
          was still PLANNED, because adjacency inside the 12-hour buffer is a
          conflict.
        test_recipe:
          setup:
            - "One block and one crew; one PLANNED window 2026-08-03T06:00:00Z -> 2026-08-03T14:00:00Z, then cancelled with reason WEATHER."
          setup_api_calls:
            - call: "POST /berry-ops/blocks"
              payload: { name: "BLK-C8", variety: "RASPBERRY", acres: 8.00, planting_year: 2021, irrigation_source_code: "WELL-C8" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { blk: $.data.id }
            - call: "POST /berry-ops/crews"
              payload: { name: "CREW-C8", labor_program: "DOMESTIC", supervisor_user_id: "sup-1", planned_head_count: 1, contract_start_date: "2026-07-01", contract_end_date: "2026-09-30" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { crew: $.data.id }
            - call: "POST /berry-ops/harvest-windows"
              payload: { block_id: "${blk}", crew_id: "${crew}", start_at: "2026-08-03T06:00:00Z", end_at: "2026-08-03T14:00:00Z", forecast_brix: 9.0, planned_volume_lbs: 100.00, piece_rate_cents_per_clamshell: 70, clamshell_net_weight_lbs: 0.50 }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { win1: $.data.id }
            - call: "POST /berry-ops/harvest-windows/${win1}/cancel"
              payload: { cancel_reason_code: "WEATHER" }
              as: HarvestManager
              as_user_id: "hm-1"
          trigger:
            - call: "POST /berry-ops/harvest-windows"
              payload: { block_id: "${blk}", crew_id: "${crew}", start_at: "2026-08-03T14:00:00Z", end_at: "2026-08-03T20:00:00Z", forecast_brix: 9.0, planned_volume_lbs: 100.00, piece_rate_cents_per_clamshell: 70, clamshell_net_weight_lbs: 0.50 }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { win2: $.data.id }
          assert:
            - "HTTP status is 201"
            - "HarvestWindow.${win1}.status == CANCELLED and HarvestWindow.${win1}.cancel_reason_code == WEATHER"
            - "HarvestWindow.${win2}.status == PLANNED and HarvestWindow.${win2}.window_hours == 6.00 and HarvestWindow.${win2}.block_id == ${blk}"

