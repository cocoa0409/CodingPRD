      - name: retention_precision_and_rounding_are_covered_by_the_boundary_difficulty_instances
        claim_type: precision
        grounds:
          - calculations.inventory_completeness_pct
          - calculations.pra_exposure_estimate
        excluded_because:
          difficulty_instance: pra_exposure_half_cent_rounds_up_to_14585_not_14584
          rationale: "Rounding mode and decimal places are asserted at the half-way point there and, for the 2-decimal percentage, in inventory_completeness_empty_scope_100_and_two_decimal_rounding_at_33_33_and_66_67; a generic precision corner test would assert strictly less."

      - name: destruction_variant_divergence_is_covered_by_the_dual_variant_difficulty_instance
        claim_type: variant_divergence
        grounds:
          - calculations.effective_retention_and_destruction.variants
        excluded_because:
          difficulty_instance: retention_destruction_purpose_limited_vs_schedule_only_divergence
          rationale: "That instance runs both variants over identical retention inputs and pins the two divergent destruction dates (2026-08-27 vs 2026-09-14), which is the entire variant-divergence claim."

      - name: exposure_variant_selection_is_covered_by_the_dual_variant_difficulty_instance
        claim_type: variant_selection
        grounds:
          - calculations.pra_exposure_estimate.variants
          - entities.ExposureAssessment.fields.variant
        excluded_because:
          difficulty_instance: pra_exposure_stacked_vs_subject_capped_divergence
          rationale: "Variant selection is driven solely by the assessment's own variant input, which that instance exercises in both settings against one shared consent population (875000 vs 500000)."

  - section: validations
    instances:
      - name: translation_locale_coverage_is_enforced_only_where_the_state_requires_it
        claim_type: conditional_validation
        grounds:
          - validations[priority=10]
          - entities.Jurisdiction.fields.translation_required
          - errors[ERR_TRANSLATION_LOCALE_MISSING]
        distinguishing_aspect: "Two notice packets carry the identical locales [en] against jurisdictions whose required_locales are both [en, es]; only the one whose translation_required flag is true is refused, so the rule is proved conditional on the flag and not on the locale array."
        test_recipe:
