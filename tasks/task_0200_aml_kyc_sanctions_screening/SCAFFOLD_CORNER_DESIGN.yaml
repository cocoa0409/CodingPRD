scaffold_corner_design:

  # =========================================================================
  # Entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_customer_individual_returns_201_with_defaults
        claim_type: Creation
        grounds: ["entities.Customer", "endpoints"]
        distinguishing_aspect: "POST /customers with required INDIVIDUAL fields returns 201; cdd_status==NEW, risk_rating==null, is_pep_self_declared defaults false."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { legal_name: "Jane Doe", customer_type: "INDIVIDUAL", country_code: "US", date_of_birth: "1980-01-01" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { cust_id: $.data.id, status: $.data.cdd_status, pep: $.data.is_pep_self_declared }
          assert:
            - "response code == 201"
            - "Customer.${cust_id}.cdd_status == NEW"
            - "Customer.${cust_id}.risk_rating == null"
            - "Customer.${cust_id}.is_pep_self_declared == false"
            - "Customer.${cust_id}.version == 1"

      - name: get_customer_returns_stored_entity
        claim_type: Retrieval
        grounds: ["entities.Customer", "endpoints"]
        distinguishing_aspect: "GET /customers/{id} returns the stored customer with matching legal_name and country_code."
        test_recipe:
          setup: ["A created customer."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { legal_name: "Read Me", customer_type: "LEGAL_ENTITY", country_code: "GB", incorporation_date: "2005-05-05" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { cust_id: $.data.id }
          trigger:
            - call: "GET /customers/${cust_id}"
              payload: {}
              as: Analyst
              as_user_id: "an-1"
              captures: { name: $.data.legal_name, cc: $.data.country_code }
          assert:
            - "Customer.${cust_id}.legal_name == \"Read Me\""
            - "Customer.${cust_id}.country_code == GB"

      - name: list_customers_paginated_envelope
        claim_type: Listing
        grounds: ["entities.Customer", "endpoints", "response_envelope"]
        distinguishing_aspect: "GET /customers returns array with pagination fields total_count and has_more present."
        test_recipe:
          setup: ["Two customers."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { legal_name: "C One", customer_type: "INDIVIDUAL", country_code: "US", date_of_birth: "1981-01-01" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /customers"
              payload: { legal_name: "C Two", customer_type: "INDIVIDUAL", country_code: "US", date_of_birth: "1982-02-02" }
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "GET /customers"
              payload: { limit: 1, offset: 0 }
              as: ComplianceOfficer
              as_user_id: "co-1"
          assert:
            - "meta.response_type == array"
            - "total_count == 2 and has_more == true (limit 1 of 2)"

      - name: get_customer_not_found_returns_404
        claim_type: Not Found
        grounds: ["entities.Customer", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /customers/{non-existent-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /customers/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { err: $.data.error_id }
          assert:
            - "response code == 404 and error_id == ERR_NOT_FOUND"

      - name: create_customer_missing_required_returns_invalid_request
        claim_type: Required Fields
        grounds: ["entities.Customer", "validations[priority=4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /customers missing legal_name returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { customer_type: "INDIVIDUAL", country_code: "US", date_of_birth: "1980-01-01" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { err: $.data.error_id }
          assert:
            - "response code == 422 and error_id == ERR_INVALID_REQUEST"

      - name: create_customer_invalid_enum_customer_type_returns_invalid_request
        claim_type: Type Constraints
        grounds: ["entities.Customer.fields.customer_type", "validations[priority=4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /customers with customer_type==\"PARTNERSHIP\" (not in enum) returns ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { legal_name: "Bad Enum", customer_type: "PARTNERSHIP", country_code: "US" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { err: $.data.error_id }
          assert:
            - "response code == 422 and error_id == ERR_INVALID_REQUEST"

      - name: create_customer_type_field_mismatch_individual_with_incorporation_date
        claim_type: Type Constraints
        grounds: ["entities.Customer.fields.date_of_birth", "validations[priority=5]", "errors[ERR_TYPE_FIELD_MISMATCH]"]
        distinguishing_aspect: "INDIVIDUAL with incorporation_date supplied (and no DOB) returns ERR_TYPE_FIELD_MISMATCH."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { legal_name: "Mismatch", customer_type: "INDIVIDUAL", country_code: "US", incorporation_date: "2000-01-01" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { err: $.data.error_id }
          assert:
            - "response code == 422 and error_id == ERR_TYPE_FIELD_MISMATCH"

      - name: system_fields_generated_input_ignored
        claim_type: System Fields
        grounds: ["entities.Customer"]
        distinguishing_aspect: "id, created_at, updated_at, version are server-minted; supplying them in the body is ignored and a fresh id/version=1 is returned."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { legal_name: "Sys Fields", customer_type: "INDIVIDUAL", country_code: "US", date_of_birth: "1983-03-03" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { cust_id: $.data.id, v: $.data.version }
          assert:
            - "Customer.${cust_id}.version == 1 (system-minted)"
            - "Customer.${cust_id}.id is a UUID with no type prefix"

      - name: transaction_immutable_no_version_field
        claim_type: Immutability
        grounds: ["entities.Transaction"]
        distinguishing_aspect: "Transaction has common_fields:false — it exposes id and created_at only, no version, and has no update endpoint."
        test_recipe:
          setup: ["An ACTIVE account."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { legal_name: "Imm Co", customer_type: "LEGAL_ENTITY", country_code: "US", incorporation_date: "2018-08-08" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { cust_id: $.data.id }
            - call: "POST /customers/${cust_id}/accounts"
              payload: { account_ref: "AC-IMM-1", opening_balance_cents: 0 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /accounts/${acct_id}/transactions"
              payload: { direction: "CASH_IN", amount_cents: 5000, posted_at: "2026-06-11T08:00:00Z", counterparty_country: "US" }
              as: SystemFeed
              captures: { txn_id: $.data.id }
          assert:
            - "Transaction.${txn_id}.id present and created_at present; no version field in response"

      - name: parent_relationship_account_requires_existing_customer
        claim_type: Parent Relationships
        grounds: ["entities.Account.fields.customer_id", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "POST /customers/{bad-id}/accounts with non-existent customer returns ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /customers/00000000-0000-0000-0000-000000000000/accounts"
              payload: { account_ref: "AC-NOPARENT", opening_balance_cents: 0 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { err: $.data.error_id }
          assert:
            - "response code == 404 and error_id == ERR_NOT_FOUND"

      - name: graph_topology_alert_fk_integrity_account_and_customer
        claim_type: graph
        grounds: ["entities.Alert.fields.account_id", "entities.Alert.fields.customer_id"]
        distinguishing_aspect: "A minted Alert references both its account_id and the denormalized customer_id; both resolve to the same customer that owns the account."
        test_recipe:
          setup: ["An account that fires a STRUCTURING alert."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { legal_name: "Graph Co", customer_type: "LEGAL_ENTITY", country_code: "US", incorporation_date: "2019-09-09" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { cust_id: $.data.id }
            - call: "POST /customers/${cust_id}/accounts"
              payload: { account_ref: "AC-GRAPH-1", opening_balance_cents: 0 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/transactions"
              payload: { direction: "CASH_IN", amount_cents: 950000, posted_at: "2026-06-12T08:00:00Z", counterparty_country: "US" }
              as: SystemFeed
          trigger:
            - call: "GET /alerts"
              payload: { account_id: "${acct_id}" }
              as: Analyst
              as_user_id: "an-1"
              captures: { a_acct: "$.data[0].account_id", a_cust: "$.data[0].customer_id" }
          assert:
            - "Alert[account_id=${acct_id}][0].account_id == ${acct_id}"
            - "Alert[account_id=${acct_id}][0].customer_id == ${cust_id}"

  # =========================================================================
  # State Machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: initial_state_customer_starts_new
        claim_type: Initial State
        grounds: ["state_machines.Customer"]
        distinguishing_aspect: "A newly created customer starts in cdd_status==NEW (the machine's initial_state)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { legal_name: "Init Co", customer_type: "INDIVIDUAL", country_code: "US", date_of_birth: "1984-04-04" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { cust_id: $.data.id, st: $.data.cdd_status }
          assert:
            - "Customer.${cust_id}.cdd_status == NEW"

      - name: clear_screening_from_new_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.Customer.RISK_RATED_to_SCREENING_CLEARED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "clear-screening on a NEW (un-rated) customer is not a defined transition; returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["A NEW customer (no rating applied)."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { legal_name: "Early Co", customer_type: "INDIVIDUAL", country_code: "US", date_of_birth: "1985-05-05" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /customers/${cust_id}/clear-screening"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409 and error_id == ERR_INVALID_STATE"

      - name: terminal_state_rejected_customer_locks_transitions
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.Customer.RISK_RATED_to_REJECTED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A PROHIBITED-rated customer auto-transitions to REJECTED (terminal); a subsequent clear-screening returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["A customer rated PROHIBITED (auto-REJECTED)."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { legal_name: "Proh Co", customer_type: "INDIVIDUAL", country_code: "US", date_of_birth: "1960-06-06" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { cust_id: $.data.id, cust_v0: $.data.version }
            - call: "POST /customers/${cust_id}/risk-assessments"
              payload: { variant: "PROVISIONAL", geography_factor: 5, product_factor: 5, pep_factor: 5, adverse_media_factor: 5 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { ra_id: $.data.id }
            - call: "POST /customers/${cust_id}/apply-rating"
              payload: { risk_assessment_id: "${ra_id}", expected_customer_version: "${cust_v0}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { status_after: $.data.cdd_status }
          trigger:
            - call: "POST /customers/${cust_id}/clear-screening"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { err: $.data.error_id }
          assert:
            - "Customer.${cust_id}.cdd_status == REJECTED after apply-rating (PROHIBITED auto-reject)"
            - "response error_id == ERR_INVALID_STATE on subsequent clear-screening"

      - name: prohibited_rating_cascades_account_blocked_frozen
        claim_type: Cross-entity
        grounds: ["state_machines.Customer.RISK_RATED_to_REJECTED", "state_machines.Account.kyc_status_KYC_OK_to_KYC_BLOCKED"]
        distinguishing_aspect: "When apply-rating yields PROHIBITED, the customer's accounts are cascaded to kyc_status==KYC_BLOCKED and monitoring_status==FROZEN."
        test_recipe:
          setup: ["A customer with one account, about to be rated PROHIBITED."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { legal_name: "Casc Proh", customer_type: "INDIVIDUAL", country_code: "US", date_of_birth: "1961-06-06" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { cust_id: $.data.id, cust_v0: $.data.version }
            - call: "POST /customers/${cust_id}/accounts"
              payload: { account_ref: "AC-PROH-1", opening_balance_cents: 0 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { acct_id: $.data.id }
            - call: "POST /customers/${cust_id}/risk-assessments"
              payload: { variant: "PROVISIONAL", geography_factor: 5, product_factor: 5, pep_factor: 5, adverse_media_factor: 5 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { ra_id: $.data.id }
          trigger:
            - call: "POST /customers/${cust_id}/apply-rating"
              payload: { risk_assessment_id: "${ra_id}", expected_customer_version: "${cust_v0}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { kyc: $.data.kyc_status, mon: $.data.monitoring_status }
          assert:
            - "Account.${acct_id}.kyc_status == KYC_BLOCKED"
            - "Account.${acct_id}.monitoring_status == FROZEN"

      - name: approve_cascades_pending_kyc_to_kyc_ok
        claim_type: Cascade down
        grounds: ["state_machines.Customer.SCREENING_CLEARED_to_APPROVED", "state_machines.Account.kyc_status_PENDING_KYC_to_KYC_OK"]
        distinguishing_aspect: "Approving a SCREENING_CLEARED LOW customer cascades each PENDING_KYC account to KYC_OK."
        test_recipe:
          setup: ["A SCREENING_CLEARED LOW customer with a PENDING_KYC account."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { legal_name: "Appr Co", customer_type: "INDIVIDUAL", country_code: "US", date_of_birth: "1986-06-06" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { cust_id: $.data.id, cust_v0: $.data.version }
            - call: "POST /customers/${cust_id}/accounts"
              payload: { account_ref: "AC-APPR-1", opening_balance_cents: 0 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { acct_id: $.data.id }
            - call: "POST /customers/${cust_id}/risk-assessments"
              payload: { variant: "PROVISIONAL", geography_factor: 1, product_factor: 1, pep_factor: 1, adverse_media_factor: 1 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { ra_id: $.data.id }
            - call: "POST /customers/${cust_id}/apply-rating"
              payload: { risk_assessment_id: "${ra_id}", expected_customer_version: "${cust_v0}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /customers/${cust_id}/clear-screening"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /customers/${cust_id}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { st: $.data.cdd_status }
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { kyc: $.data.kyc_status }
          assert:
            - "Customer.${cust_id}.cdd_status == APPROVED"
            - "Account.${acct_id}.kyc_status == KYC_OK"

      - name: high_rated_customer_routes_to_edd_required_on_approve
        claim_type: guarded transitions
        grounds: ["state_machines.Customer.SCREENING_CLEARED_to_EDD_REQUIRED", "calculations.edd_gate"]
        distinguishing_aspect: "Approving a SCREENING_CLEARED HIGH customer (edd_required==true) routes to EDD_REQUIRED, not APPROVED."
        test_recipe:
          setup: ["A SCREENING_CLEARED HIGH-rated customer with no open hits."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { legal_name: "Edd Co", customer_type: "LEGAL_ENTITY", country_code: "US", incorporation_date: "2007-07-07" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { cust_id: $.data.id, cust_v0: $.data.version }
            - call: "POST /customers/${cust_id}/risk-assessments"
              payload: { variant: "PROVISIONAL", geography_factor: 5, product_factor: 4, pep_factor: 4, adverse_media_factor: 4 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { ra_id: $.data.id }
            - call: "POST /customers/${cust_id}/apply-rating"
              payload: { risk_assessment_id: "${ra_id}", expected_customer_version: "${cust_v0}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { rating: $.data.risk_rating, edd: $.data.edd_required }
            - call: "POST /customers/${cust_id}/clear-screening"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /customers/${cust_id}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { st: $.data.cdd_status }
          assert:
            - "Customer.${cust_id}.risk_rating == HIGH and edd_required == true"
            - "Customer.${cust_id}.cdd_status == EDD_REQUIRED"

      - name: filing_reject_then_revise_returns_to_draft
        claim_type: Compensation
        grounds: ["state_machines.Filing.SUBMITTED_to_REJECTED", "state_machines.Filing.REJECTED_to_DRAFT"]
        distinguishing_aspect: "A REJECTED filing revised returns to DRAFT and clears approved_by_user_id (must be re-approved)."
        test_recipe:
          setup: ["A SUBMITTED SAR filing that FinCEN rejects."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { legal_name: "Rev Co", customer_type: "LEGAL_ENTITY", country_code: "US", incorporation_date: "2008-08-08" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { cust_id: $.data.id }
            - call: "POST /customers/${cust_id}/accounts"
              payload: { account_ref: "AC-REV-1", opening_balance_cents: 0 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/transactions"
              payload: { direction: "CASH_IN", amount_cents: 950000, posted_at: "2026-06-13T08:00:00Z", counterparty_country: "US" }
              as: SystemFeed
            - call: "GET /accounts/${acct_id}/alerts"
              payload: {}
              as: Analyst
              as_user_id: "an-1"
              captures: { alert_id: "$.data[0].id" }
            - call: "POST /cases"
              payload: { customer_id: "${cust_id}" }
              as: Analyst
              as_user_id: "an-1"
              captures: { case_id: $.data.id, case_v0: $.data.version }
            - call: "POST /cases/${case_id}/alerts"
              payload: { alert_id: "${alert_id}", expected_case_version: "${case_v0}" }
              as: Analyst
              as_user_id: "an-1"
            - call: "POST /cases/${case_id}/disposition"
              payload: { decision: "RECOMMEND_SAR" }
              as: Analyst
              as_user_id: "an-1"
            - call: "POST /cases/${case_id}/filings"
              payload: { filing_type: "SAR" }
              as: Analyst
              as_user_id: "an-1"
              captures: { filing_id: $.data.id }
            - call: "POST /filings/${filing_id}/approve"
              payload: {}
              as: QualityReviewer
              as_user_id: "qr-1"
            - call: "POST /filings/${filing_id}/submit"
              payload: {}
              as: QualityReviewer
              as_user_id: "qr-1"
            - call: "POST /filings/${filing_id}/acknowledge"
              payload: { decision: "REJECT" }
              as: SystemFeed
              captures: { st_rej: $.data.status }
          trigger:
            - call: "POST /filings/${filing_id}/revise"
              payload: {}
              as: Analyst
              as_user_id: "an-1"
              captures: { st: $.data.status, appr: $.data.approved_by_user_id }
          assert:
            - "Filing.${filing_id}.status == REJECTED before revise"
            - "Filing.${filing_id}.status == DRAFT after revise"
            - "Filing.${filing_id}.approved_by_user_id == null after revise"

      - name: filing_accepted_bubbles_case_to_filed
        claim_type: Bubble up
        grounds: ["state_machines.Filing.SUBMITTED_to_ACCEPTED", "state_machines.Case.SAR_RECOMMENDED_to_FILED"]
        distinguishing_aspect: "Acknowledging a SUBMITTED SAR filing with ACCEPT bubbles the owning Case SAR_RECOMMENDED->FILED and sets acknowledgement_code."
        test_recipe:
          setup: ["A SUBMITTED SAR filing for a SAR_RECOMMENDED case."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { legal_name: "Bub Co", customer_type: "LEGAL_ENTITY", country_code: "US", incorporation_date: "2006-06-06" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { cust_id: $.data.id }
            - call: "POST /customers/${cust_id}/accounts"
