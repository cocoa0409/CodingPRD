      - name: reopen_window_inclusive_72h_then_expired
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_REOPEN_WINDOW_EXPIRED]"]
        distinguishing_aspect: "Reopen at exactly resolved_at + 72h succeeds (inclusive); reopening one second past the second resolution's +72h fails ERR_REOPEN_WINDOW_EXPIRED."
        test_recipe:
          setup: ["site; incident resolved by op-bob at 2026-08-10T00:00:00Z"]
          setup_api_calls:
