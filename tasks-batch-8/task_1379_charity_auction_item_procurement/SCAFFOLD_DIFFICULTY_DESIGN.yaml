      - name: certificate_redeem_exactly_at_expiry
        grounds:
          - calculations.certificate_validity_window
          - errors[ERR_CERTIFICATE_NOT_REDEEMABLE]
        distinguishing_aspect: |
          Time metric on POST /certificates/{id}/redeem: the expiry bound is CLOSED
          (now <= expires_at) while the sweep bound is STRICT (now > expires_at) —
          redemption at exactly 2027-08-01T00:00:00Z succeeds; one second later the
          sweep has moved the certificate to EXPIRED and redemption fails.
