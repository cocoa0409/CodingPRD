      - name: match_pledge_capacity_counts_half_open_overlaps_and_ignores_touching_periods
        grounds:
          - calculations.federal_match_coverage
          - validations[priority=43]
          - entities.FederalGrant.fields.period_start
          - entities.FederalGrant.fields.period_end
          - entities.MatchCommitment.fields.committed_match_cents
        distinguishing_aspect: |
          Overlap is evaluated between grant performance periods pledged against one shared
          appropriation, and the aggregate is a monetary capacity rather than a slot: two
          600000000-cent pledges coexist because their grant periods only touch at
          2027-01-01 (half-open, not overlap), while a 100000000-cent pledge whose grant
          period straddles both is rejected because 1200000000 + 100000000 exceeds the
          appropriation's available authority of 1000000000.
        test_recipe:
          setup:
            - "Agency DOH; BudgetCycle 2027 driven to phase EXECUTION with one ADOPTED GENERAL forecast of 10000000000 cents"
            - "GENERAL Appropriation P100 enacted 1000000000 with no expenditures and no transfers, so available_authority_cents == 1000000000"
            - "G1 award 2400000000 ratio 0.25 over [2026-07-01, 2027-01-01), required_state_match_cents == 600000000"
            - "G2 award 2400000000 ratio 0.25 over [2027-01-01, 2027-07-01), required_state_match_cents == 600000000, touching G1 at 2027-01-01"
