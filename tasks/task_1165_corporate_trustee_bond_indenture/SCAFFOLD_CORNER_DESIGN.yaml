            - { call: "POST /payment-runs/${run}/fund", payload: { amount_cents: 10166667 }, as: Issuer, as_user_id: "issuer-1" }
            - { call: "POST /payment-runs/${run}/execute", payload: {}, as: TrustOfficer }
          trigger:
            - { call: "POST /payment-runs/${run}/execute", payload: {}, as: TrustOfficer, captures: { err: $.data.error_id } }
          assert:
            - "second execute returns error_id == ERR_INVALID_STATE"
            - "DistributionRecord count for the run remains 1 (no duplicate allocation)"
  # =====================================================================
  # Section: calculations
  # =====================================================================
  - section: calculations
    instances:
      - name: thirty_360_interest_correct_result
        claim_type: correct_result
        grounds: ["calculations.interest_accrual"]
        distinguishing_aspect: "THIRTY_360 over [2026-06-15, 2026-12-15) counts exactly 180 days: positions 300000000/200000000 at 600 bps accrue 9000000/6000000, gross 15000000."
        test_recipe:
          setup: ["active indenture; THIRTY_360 tranche 500000000 at 600 bps; positions D 300000000, E 200000000; funded INTEREST run"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
