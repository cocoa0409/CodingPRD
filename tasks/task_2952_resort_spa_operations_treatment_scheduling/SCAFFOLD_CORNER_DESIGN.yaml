      setup: A cleared guest, one DRY room, and three therapists that differ only in licence posture — T1 has a PENDING_REVIEW licence, T2 has a VERIFIED licence that expires before the probe date, T3 has a VERIFIED licence valid through 2027. All three hold an ACTIVE BASIC SWEDISH certification and an AVAILABLE shift block, so priorities 19 and 23 cannot pre-empt the licence rungs. Every licence is created with ce_hours_required 0 so the CE rungs stay inert.
      setup_api_calls:
