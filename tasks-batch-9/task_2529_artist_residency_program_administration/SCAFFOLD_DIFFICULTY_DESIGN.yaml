  # ===================================================================================
  # RULE 5 - priority_pair_validation_conflict
  # Differentiation: three DIFFERENT error-category pairs, each pair sharing one endpoint so
  # a single request really does violate both rules.
  #   state          < business_fiscal       P22 < P71  on POST /applications/{id}/offer-response
  #   business_safety< business_temporal     P35 < P46  on POST /studio-assignments
  #   state          < business_constraint   P26 < P57  on POST /housing-assignments
  # Each instance also fires the LOWER-priority rule on its own in a second call, which is the
  # only way to prove the ordering rather than merely observing one error.
  # ===================================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: offer_state_check_beats_stipend_pool_exhausted
        grounds: "§1.4 P22 ERR_APPLICATION_NOT_OFFERED (state, 409) with conflict_note, P71 ERR_STIPEND_POOL_EXHAUSTED (business_fiscal, 409); §1.5 POST /applications/{id}/offer-response; §1.3 calculations.slate_allocation and cycle_stipend_ledger"
        distinguishing_aspect: |
          Category pair: state < business_fiscal. Both rules are attached to
          POST /applications/{id}/offer-response and a WAITLISTED applicant accepting a slot in an
          under-funded cycle violates both simultaneously: the application was never OFFERED (P22)
          AND the 560000-cent award would not fit the 100000-cent pool (P71). The ordering is the
          whole point of the §1.4 ladder - money is reported last, so the applicant is told
          "you have no offer", never "we are out of money". The reverse order would leak the
          organisation's budget position to someone who was not selected.
        test_recipe:
          setup: |
            A deliberately starved cycle: cohort_target_size 1, alumni_reserve_pct 0.0 (so
            alumni_reserved_slots = ceil(0.0 * 1) = 0 and P62 passes), stipend_pool_cents 100000
            and stipend_weekly_rate_cents 70000 - an 8-week award costs 560000, five and a half
            times the whole pool. One discipline SCULPT with cohort_min_slots 1. Two applicants
            each submit one 8-week application; both are advanced to panel and scored by the same
            two panelists, app1 to 80.00 and app2 to 70.00. Locking the slate gives the single
            slot to app1 (bucket 1, merit order) and WAITLISTS app2.
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /cycles"
              payload: { code: "CY-2027", open_at: "2026-08-01T00:00:00Z", close_at: "2026-09-30T00:00:00Z",
                         application_fee_cents: 5000, panel_quorum: 2, cohort_target_size: 1,
                         alumni_reserve_pct: 0.0, stipend_pool_cents: 100000, slate_min_score: 60.00,
                         stipend_weekly_rate_cents: 70000, session_length_options_weeks: [4, 5, 8, 9] }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { cyc: "$.data.id" }
            - call: "POST /disciplines"
              payload: { cycle_id: "${cyc}", code: "SCULPT", name: "Sculpture", portfolio_min_items: 1,
                         portfolio_max_items: 6, required_media_types: ["IMAGE"], requires_hazmat_review: false,
                         cohort_min_slots: 1, cohort_max_slots: 6, required_capability_tags: ["WELDING"],
                         required_ventilation_class: "LOCAL" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { disc: "$.data.id" }
            - call: "POST /applicants"
              payload: { full_name: "Ada Rivet", email: "ada.rivet@example.org",
                         affiliation_org: "North Shore Collective", citizenship_country: "US",
                         treaty_country: false, declared_annual_income_cents: 2000000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { art1: "$.data.id" }
            - call: "POST /applicants"
              payload: { full_name: "Kell Osei", email: "kell.osei@example.org",
                         affiliation_org: "Press Room East", citizenship_country: "US",
                         treaty_country: false, declared_annual_income_cents: 2200000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { art2: "$.data.id" }
            - call: "POST /cycles/${cyc}/stage"
              payload: { to_status: "OPEN" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /applications"
              payload: { cycle_id: "${cyc}", applicant_id: "${art1}", discipline_id: "${disc}",
                         requested_session_length_weeks: 8, project_statement: "Welded steel forms",
                         fee_waiver_requested: true }
              as: Applicant
              as_user_id: "${art1}"
              captures: { app1: "$.data.id" }
            - call: "POST /applications"
              payload: { cycle_id: "${cyc}", applicant_id: "${art2}", discipline_id: "${disc}",
