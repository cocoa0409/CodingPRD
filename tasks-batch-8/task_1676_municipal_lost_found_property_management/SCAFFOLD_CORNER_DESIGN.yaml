scaffold_corner_design:
  # =========================================================================
  # Section: entities
  # =========================================================================
  - section: entities
    instances:
      - name: item_create_success_initial_state
        claim_type: creation
        grounds: [entities.Item]
        distinguishing_aspect: "POST /items with all required fields returns 201; server initializes status STORED, version 1, unsold_count 0, is_identification false, intake_officer_id from the X-User-ID header."
        test_recipe:
          setup: ["TRANSIT program with LOW policy and location"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Transit L&F", program_type: "TRANSIT", contact_email: "t@city.gov" }
              as: ProgramAdmin
              captures: { pt: $.data.id, pt_v: $.data.version }
            - call: "POST /retention-policies"
              payload: { program_id: "${pt}", item_category: "ELECTRONICS", value_tier: "LOW", retention_days: 10, disposal_method: "AUCTION", expected_program_version: "${pt_v}" }
              as: ProgramAdmin
            - call: "POST /storage-locations"
              payload: { program_id: "${pt}", name: "Cage T", capacity_slots: 10, supports_high_value: true }
              as: ProgramAdmin
              captures: { loc: $.data.id }
          trigger:
            - call: "POST /items"
              payload: { program_id: "${pt}", storage_location_id: "${loc}", category: "ELECTRONICS", declared_value_cents: 5000, description: "earbuds", found_at: "2026-08-01T09:00:00Z", found_location: "Bus 12" }
              as: IntakeOfficer
              as_user_id: "officer-intake-1"
              captures: { it: $.data.id }
          assert:
            - "response status 201; Item.${it}.status == STORED (initial state)"
            - "Item.${it}.version == 1 and Item.${it}.unsold_count == 0 (defaults)"
            - "Item.${it}.is_identification == false and Item.${it}.intake_officer_id == \"officer-intake-1\""
            - "Item.${it}.id is a server-minted UUID (client never supplies it)"
      - name: item_create_missing_required_category
        claim_type: required_fields
        grounds: [entities.Item, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required input field category yields ERR_INVALID_REQUEST (400) before any business rule runs."
        test_recipe:
          setup: ["TRANSIT program with LOW policy and location"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Transit L&F", program_type: "TRANSIT", contact_email: "t@city.gov" }
              as: ProgramAdmin
              captures: { pt: $.data.id, pt_v: $.data.version }
            - call: "POST /retention-policies"
              payload: { program_id: "${pt}", item_category: "ELECTRONICS", value_tier: "LOW", retention_days: 10, disposal_method: "AUCTION", expected_program_version: "${pt_v}" }
              as: ProgramAdmin
            - call: "POST /storage-locations"
              payload: { program_id: "${pt}", name: "Cage T", capacity_slots: 10, supports_high_value: true }
              as: ProgramAdmin
              captures: { loc: $.data.id }
          trigger:
            - call: "POST /items"
              payload: { program_id: "${pt}", storage_location_id: "${loc}", declared_value_cents: 5000, description: "earbuds", found_at: "2026-08-01T09:00:00Z", found_location: "Bus 12" }
              as: IntakeOfficer
              as_user_id: "officer-intake-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_INVALID_REQUEST\" and HTTP status 400"
      - name: item_create_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.Item.fields.category, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "category value outside the declared enum set is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["TRANSIT program with LOW policy and location"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Transit L&F", program_type: "TRANSIT", contact_email: "t@city.gov" }
              as: ProgramAdmin
              captures: { pt: $.data.id, pt_v: $.data.version }
            - call: "POST /retention-policies"
              payload: { program_id: "${pt}", item_category: "ELECTRONICS", value_tier: "LOW", retention_days: 10, disposal_method: "AUCTION", expected_program_version: "${pt_v}" }
              as: ProgramAdmin
            - call: "POST /storage-locations"
              payload: { program_id: "${pt}", name: "Cage T", capacity_slots: 10, supports_high_value: true }
              as: ProgramAdmin
              captures: { loc: $.data.id }
          trigger:
            - call: "POST /items"
              payload: { program_id: "${pt}", storage_location_id: "${loc}", category: "ROCKET", declared_value_cents: 5000, description: "odd", found_at: "2026-08-01T09:00:00Z", found_location: "Bus 12" }
              as: IntakeOfficer
              as_user_id: "officer-intake-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_INVALID_REQUEST\" (ROCKET is not in the category enum)"
      - name: item_computed_value_tier_input_ignored
        claim_type: computed_fields
        grounds: [entities.Item.fields.value_tier]
        distinguishing_aspect: "Client-sent value_tier is ignored: declared_value_cents 150000 always computes HIGH even when the client submits LOW."
        test_recipe:
          setup: ["TRANSIT program with HIGH policy and secure location"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Transit L&F", program_type: "TRANSIT", contact_email: "t@city.gov" }
              as: ProgramAdmin
              captures: { pt: $.data.id, pt_v: $.data.version }
            - call: "POST /retention-policies"
              payload: { program_id: "${pt}", item_category: "ELECTRONICS", value_tier: "HIGH", retention_days: 90, disposal_method: "AUCTION", expected_program_version: "${pt_v}" }
              as: ProgramAdmin
            - call: "POST /storage-locations"
              payload: { program_id: "${pt}", name: "Vault", capacity_slots: 10, supports_high_value: true }
              as: ProgramAdmin
              captures: { loc: $.data.id }
          trigger:
            - call: "POST /items"
              payload: { program_id: "${pt}", storage_location_id: "${loc}", category: "ELECTRONICS", declared_value_cents: 150000, value_tier: "LOW", description: "laptop", found_at: "2026-08-01T09:00:00Z", found_location: "Bus 12" }
              as: IntakeOfficer
              as_user_id: "officer-intake-1"
              captures: { it: $.data.id, tier: $.data.value_tier }
          assert:
            - "tier == \"HIGH\" (client-supplied LOW ignored; computed from declared_value_cents)"
      - name: item_get_not_found_returns_404
        claim_type: not_found
        grounds: [entities.Item, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent item id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /items/00000000-0000-0000-0000-000000000000"
              as: IntakeOfficer
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_NOT_FOUND\" and HTTP status 404"
      - name: claimant_defaults_id_verified_false
        claim_type: defaults
        grounds: [entities.Claimant.fields.id_verified]
        distinguishing_aspect: "Omitting nothing but the required fields, a new claimant defaults to id_verified false."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /claimants"
              payload: { full_name: "Pat Owner", email: "pat@x.com" }
              as: PublicUser
              captures: { c1: $.data.id }
          assert:
            - "Claimant.${c1}.id_verified == false"
            - "Claimant.${c1}.phone == null (optional field omitted)"
      - name: lotitem_immutable_no_version
        claim_type: immutability
        grounds: [entities.LotItem]
        distinguishing_aspect: "LotItem has common_fields false: its read payload carries id/created_at but no version or updated_at, and no update endpoint exists for it."
        test_recipe:
          setup: ["TRANSIT program with LOW policy, location, venue, event, DRAFT lot, and one AUCTION_ELIGIBLE item (5005 cents)"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Transit L&F", program_type: "TRANSIT", contact_email: "t@city.gov" }
              as: ProgramAdmin
              captures: { pt: $.data.id, pt_v: $.data.version }
            - call: "POST /retention-policies"
              payload: { program_id: "${pt}", item_category: "ELECTRONICS", value_tier: "LOW", retention_days: 10, disposal_method: "AUCTION", expected_program_version: "${pt_v}" }
              as: ProgramAdmin
            - call: "POST /storage-locations"
              payload: { program_id: "${pt}", name: "Cage T", capacity_slots: 10, supports_high_value: true }
              as: ProgramAdmin
              captures: { loc: $.data.id }
            - call: "POST /items"
              payload: { program_id: "${pt}", storage_location_id: "${loc}", category: "ELECTRONICS", declared_value_cents: 5005, description: "charger", found_at: "2026-08-01T09:00:00Z", found_location: "Bus 12" }
              as: IntakeOfficer
              as_user_id: "officer-intake-1"
              captures: { it: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /_sweeps/retention"
              as: ProgramAdmin
            - call: "POST /venues"
              payload: { program_id: "${pt}", name: "Depot Hall", address: "1 Depot St", insurance_cap_cents: 100000000 }
              as: ProgramAdmin
              captures: { ven: $.data.id }
            - call: "POST /auction-events"
              payload: { venue_id: "${ven}", program_id: "${pt}", name: "Aug Sale", starts_at: "2026-08-20T10:00:00Z", ends_at: "2026-08-20T12:00:00Z" }
              as: AuctionCoordinator
              as_user_id: "coord-1"
              captures: { ev: $.data.id }
            - call: "POST /auction-lots"
              payload: { event_id: "${ev}", title: "Lot X" }
              as: AuctionCoordinator
              as_user_id: "coord-1"
              captures: { lot: $.data.id, lot_v: $.data.version }
            - call: "POST /auction-lots/${lot}/items"
              payload: { item_id: "${it}", expected_lot_version: "${lot_v}" }
              as: AuctionCoordinator
              as_user_id: "coord-1"
          trigger:
            - call: "GET /auction-lots/${lot}/items"
              as: AuctionCoordinator
              captures: { li_floor: "$.data[0].floor_price_cents" }
          assert:
            - "li_floor == 501"
            - "each LotItem entry exposes id, lot_id, item_id, floor_price_cents, created_at and NO version / updated_at fields"
      - name: storage_location_child_of_missing_program_not_found
        claim_type: parent_relationships
        grounds: [entities.StorageLocation.fields.program_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Creating a storage location under a nonexistent program_id fails with ERR_NOT_FOUND (body FK existence)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /storage-locations"
              payload: { program_id: "00000000-0000-0000-0000-000000000000", name: "Cage X", capacity_slots: 5, supports_high_value: false }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_NOT_FOUND\" and HTTP status 404"

  # =========================================================================
  # Section: state_machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: item_publish_valid_transition
        claim_type: valid_transition
        grounds: [state_machines.Item.STORED_to_LISTED]
        distinguishing_aspect: "Publish moves a non-identification STORED item to LISTED and bumps version."
        test_recipe:
          setup: ["TRANSIT program, LOW policy, location, one LOW item"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Transit L&F", program_type: "TRANSIT", contact_email: "t@city.gov" }
              as: ProgramAdmin
              captures: { pt: $.data.id, pt_v: $.data.version }
            - call: "POST /retention-policies"
              payload: { program_id: "${pt}", item_category: "ELECTRONICS", value_tier: "LOW", retention_days: 10, disposal_method: "AUCTION", expected_program_version: "${pt_v}" }
              as: ProgramAdmin
            - call: "POST /storage-locations"
              payload: { program_id: "${pt}", name: "Cage T", capacity_slots: 10, supports_high_value: true }
              as: ProgramAdmin
              captures: { loc: $.data.id }
            - call: "POST /items"
              payload: { program_id: "${pt}", storage_location_id: "${loc}", category: "ELECTRONICS", declared_value_cents: 5000, description: "earbuds", found_at: "2026-08-01T09:00:00Z", found_location: "Bus 12" }
              as: IntakeOfficer
              as_user_id: "officer-intake-1"
              captures: { it: $.data.id }
          trigger:
            - call: "POST /items/${it}/publish"
              as: IntakeOfficer
              as_user_id: "officer-intake-1"
              captures: { st: $.data.status, v: $.data.version }
          assert:
            - "st == \"LISTED\" and v == 2"
      - name: item_unpublish_revert
        claim_type: valid_transition
        grounds: [state_machines.Item.LISTED_to_STORED]
        distinguishing_aspect: "Unpublish reverts LISTED back to STORED (branching revert, not terminal)."
        test_recipe:
          setup: ["TRANSIT program, LOW policy, location, one LISTED item"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Transit L&F", program_type: "TRANSIT", contact_email: "t@city.gov" }
              as: ProgramAdmin
              captures: { pt: $.data.id, pt_v: $.data.version }
            - call: "POST /retention-policies"
              payload: { program_id: "${pt}", item_category: "ELECTRONICS", value_tier: "LOW", retention_days: 10, disposal_method: "AUCTION", expected_program_version: "${pt_v}" }
              as: ProgramAdmin
            - call: "POST /storage-locations"
              payload: { program_id: "${pt}", name: "Cage T", capacity_slots: 10, supports_high_value: true }
              as: ProgramAdmin
              captures: { loc: $.data.id }
            - call: "POST /items"
              payload: { program_id: "${pt}", storage_location_id: "${loc}", category: "ELECTRONICS", declared_value_cents: 5000, description: "earbuds", found_at: "2026-08-01T09:00:00Z", found_location: "Bus 12" }
              as: IntakeOfficer
              as_user_id: "officer-intake-1"
              captures: { it: $.data.id }
            - call: "POST /items/${it}/publish"
              as: IntakeOfficer
              as_user_id: "officer-intake-1"
          trigger:
            - call: "POST /items/${it}/unpublish"
              as: IntakeOfficer
              as_user_id: "officer-intake-1"
              captures: { st: $.data.status }
          assert:
            - "st == \"STORED\""
      - name: item_publish_from_listed_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Item.STORED_to_LISTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Second publish on an already-LISTED item fails with ERR_INVALID_STATE; the publish trigger is not idempotent."
        test_recipe:
          setup: ["TRANSIT program, LOW policy, location, one LISTED item"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Transit L&F", program_type: "TRANSIT", contact_email: "t@city.gov" }
              as: ProgramAdmin
              captures: { pt: $.data.id, pt_v: $.data.version }
            - call: "POST /retention-policies"
              payload: { program_id: "${pt}", item_category: "ELECTRONICS", value_tier: "LOW", retention_days: 10, disposal_method: "AUCTION", expected_program_version: "${pt_v}" }
              as: ProgramAdmin
            - call: "POST /storage-locations"
              payload: { program_id: "${pt}", name: "Cage T", capacity_slots: 10, supports_high_value: true }
              as: ProgramAdmin
              captures: { loc: $.data.id }
            - call: "POST /items"
              payload: { program_id: "${pt}", storage_location_id: "${loc}", category: "ELECTRONICS", declared_value_cents: 5000, description: "earbuds", found_at: "2026-08-01T09:00:00Z", found_location: "Bus 12" }
              as: IntakeOfficer
              as_user_id: "officer-intake-1"
              captures: { it: $.data.id }
            - call: "POST /items/${it}/publish"
              as: IntakeOfficer
              as_user_id: "officer-intake-1"
          trigger:
            - call: "POST /items/${it}/publish"
              as: IntakeOfficer
              as_user_id: "officer-intake-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_INVALID_STATE\" and Item.${it}.status remains LISTED"
      - name: item_release_from_stored_returns_invalid_state
        claim_type: precondition_enforcement
        grounds: [state_machines.Item.RELEASE_PENDING_to_RELEASED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Release requires RELEASE_PENDING; a STORED item with no approved claim cannot be released."
        test_recipe:
          setup: ["TRANSIT program, LOW policy, location, one STORED item"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Transit L&F", program_type: "TRANSIT", contact_email: "t@city.gov" }
              as: ProgramAdmin
              captures: { pt: $.data.id, pt_v: $.data.version }
            - call: "POST /retention-policies"
              payload: { program_id: "${pt}", item_category: "ELECTRONICS", value_tier: "LOW", retention_days: 10, disposal_method: "AUCTION", expected_program_version: "${pt_v}" }
              as: ProgramAdmin
            - call: "POST /storage-locations"
              payload: { program_id: "${pt}", name: "Cage T", capacity_slots: 10, supports_high_value: true }
              as: ProgramAdmin
              captures: { loc: $.data.id }
            - call: "POST /items"
              payload: { program_id: "${pt}", storage_location_id: "${loc}", category: "ELECTRONICS", declared_value_cents: 5000, description: "earbuds", found_at: "2026-08-01T09:00:00Z", found_location: "Bus 12" }
              as: IntakeOfficer
              as_user_id: "officer-intake-1"
              captures: { it: $.data.id }
          trigger:
            - call: "POST /items/${it}/release"
              payload: { handover_method: "IN_PERSON", id_document_ref: "DL-1" }
              as: ReleaseOfficer
              as_user_id: "officer-release-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_INVALID_STATE\""
      - name: item_terminal_lockdown_disposed
        claim_type: terminal_lockdown
        grounds: [state_machines.Item]
        distinguishing_aspect: "DISPOSED is terminal: publish, move, refer, and dispose all fail with ERR_INVALID_STATE from it."
        test_recipe:
          setup: ["TRANSIT program with LOW DESTRUCTION policy, location, item swept to DISPOSAL_PENDING and disposed"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Transit L&F", program_type: "TRANSIT", contact_email: "t@city.gov" }
              as: ProgramAdmin
              captures: { pt: $.data.id, pt_v: $.data.version }
            - call: "POST /retention-policies"
              payload: { program_id: "${pt}", item_category: "ELECTRONICS", value_tier: "LOW", retention_days: 10, disposal_method: "DESTRUCTION", expected_program_version: "${pt_v}" }
              as: ProgramAdmin
            - call: "POST /storage-locations"
              payload: { program_id: "${pt}", name: "Cage T", capacity_slots: 10, supports_high_value: true }
              as: ProgramAdmin
              captures: { loc: $.data.id }
            - call: "POST /items"
              payload: { program_id: "${pt}", storage_location_id: "${loc}", category: "ELECTRONICS", declared_value_cents: 5000, description: "earbuds", found_at: "2026-08-01T09:00:00Z", found_location: "Bus 12" }
              as: IntakeOfficer
              as_user_id: "officer-intake-1"
              captures: { it: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /_sweeps/retention"
              as: ProgramAdmin
            - call: "POST /items/${it}/dispose"
              payload: { method: "DESTRUCTION" }
              as: PropertyCustodian
              as_user_id: "custodian-1"
          trigger:
            - call: "POST /items/${it}/publish"
              as: IntakeOfficer
              as_user_id: "officer-intake-1"
              captures: { err1: $.data.error_id }
            - call: "POST /items/${it}/refer-to-law-enforcement"
              payload: { agency_name: "CPD", case_number: "C-9" }
              as: PoliceLiaison
              as_user_id: "liaison-1"
              captures: { err2: $.data.error_id }
          assert:
            - "err1 == \"ERR_INVALID_STATE\" and err2 == \"ERR_INVALID_STATE\""
            - "Item.${it}.status == DISPOSED (terminal lockdown)"
      - name: claim_withdraw_from_approved_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Claim.SUBMITTED_to_WITHDRAWN, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Withdraw is only defined from {SUBMITTED, INFO_REQUESTED}; withdrawing an APPROVED claim fails."
        test_recipe:
          setup: ["TRANSIT program, LOW policy, location, item, claimant with claim APPROVED (proofs serial+photo, score 45 >= 40)"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Transit L&F", program_type: "TRANSIT", contact_email: "t@city.gov" }
              as: ProgramAdmin
              captures: { pt: $.data.id, pt_v: $.data.version }
            - call: "POST /retention-policies"
              payload: { program_id: "${pt}", item_category: "ELECTRONICS", value_tier: "LOW", retention_days: 10, disposal_method: "AUCTION", expected_program_version: "${pt_v}" }
              as: ProgramAdmin
            - call: "POST /storage-locations"
              payload: { program_id: "${pt}", name: "Cage T", capacity_slots: 10, supports_high_value: true }
              as: ProgramAdmin
              captures: { loc: $.data.id }
            - call: "POST /items"
              payload: { program_id: "${pt}", storage_location_id: "${loc}", category: "ELECTRONICS", declared_value_cents: 5000, description: "earbuds", found_at: "2026-08-01T09:00:00Z", found_location: "Bus 12" }
              as: IntakeOfficer
              as_user_id: "officer-intake-1"
              captures: { it: $.data.id, it_v: $.data.version }
            - call: "POST /claimants"
              payload: { full_name: "Pat Owner", email: "pat@x.com" }
              as: PublicUser
              captures: { c1: $.data.id }
            - call: "POST /claims"
              payload: { item_id: "${it}", claimant_id: "${c1}", proof_serial: true, proof_photo: true, proof_receipt: false, proof_description_detail: "BRIEF", expected_item_version: "${it_v}" }
              as: Claimant
              as_user_id: "${c1}"
              captures: { cl: $.data.id }
            - call: "POST /claims/${cl}/start-review"
              as: ClaimsExaminer
              as_user_id: "examiner-1"
            - call: "POST /claims/${cl}/approve"
              as: ClaimsExaminer
              as_user_id: "examiner-1"
          trigger:
            - call: "POST /claims/${cl}/withdraw"
              as: Claimant
              as_user_id: "${c1}"
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_INVALID_STATE\" and Claim.${cl}.status remains APPROVED"
      - name: lot_publish_empty_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.AuctionLot.DRAFT_to_PUBLISHED, "errors[ERR_LOT_EMPTY]"]
        distinguishing_aspect: "Publishing a lot with zero LotItem rows fails with ERR_LOT_EMPTY (aggregate emptiness precondition)."
        test_recipe:
          setup: ["TRANSIT program, venue, event, empty DRAFT lot"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Transit L&F", program_type: "TRANSIT", contact_email: "t@city.gov" }
              as: ProgramAdmin
              captures: { pt: $.data.id }
            - call: "POST /venues"
              payload: { program_id: "${pt}", name: "Depot Hall", address: "1 Depot St", insurance_cap_cents: 100000000 }
              as: ProgramAdmin
              captures: { ven: $.data.id }
