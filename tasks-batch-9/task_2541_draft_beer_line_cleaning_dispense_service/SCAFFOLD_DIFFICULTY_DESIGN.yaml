              as_user_id: "dispatch-1"
              captures: { prog: $.data.id }
            - call: "POST /draft-service/contracts"
              payload: { account_id: "${acct}", cleaning_frequency_days: 21, contracted_line_count: 2, per_line_rate_cents: 4175, visit_base_fee_cents: 7500, effective_from: "2026-08-01T00:00:00Z", expected_account_version: "${acct_v}", brewer_program_id: "${prog}" }
              as: DispatchCoordinator
