# =============================================================================
# PRD Benchmark Scaffold — Infant & Child Sleep Consulting
# =============================================================================

scenario: |
  Infant & Child Sleep Consulting (certified sleep consultant): intake
  questionnaire & sleep history assessment, plan creation by age/method
  preference, support package (calls/messages/duration) & response-time
  promise, nightly log review & plan adjustment, regression/travel
  troubleshooting sessions, refund/guarantee policy, group course vs
  one-on-one delivery, follow-up package & repeat client.

domain_name: infant-child-sleep-consulting
api_prefix: /sleep-consulting

# =============================================================================
# §0.3 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation        # finite call/message entitlements + course seats
  secondary_archetype: pricing_engine        # tier + age-band + repeat-client pricing with pinned rounding
  complexity_layers:
    - optimistic_concurrency                 # OCC on ClientCase.version / SupportPackage.version
    - cascading_side_effects                 # regression cascade depth-3; refund-paid cascade depth-2
    - rate_threshold_triggers                # SLA breach credit + per-package credit cap; guarantee thresholds
    - scheduled_actions                      # logical clock drives package expiry and window checks
  entity_topology: flat                      # peer entities joined by foreign keys; no nested ownership tree
  state_machine_shape: cyclic                # plan adjustment loop; case reopen loop; plus branching terminals
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: peer_roles                     # Parent / Consultant own disjoint surfaces; PracticeAdmin ops-only override
  consistency_model: immediate               # all mutations + derived fields visible in the same response

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (12 entities, flat topology)
# =============================================================================
entities:
  - name: Consultant
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Consultant display name" }
      - { name: certification_no, type: string, source: input, description: "Sleep-consultant certification number" }
      - { name: max_active_cases, type: integer, source: input, description: "Maximum number of cases in ACTIVE_SUPPORT status the consultant may hold at any given time; must be >= 1", constraints: "integer >= 1" }
      - { name: active_case_count, type: integer, source: computed, description: "Count of ClientCase rows with consultant_id = this id AND status == ACTIVE_SUPPORT (NEEDS_ATTENTION and all other statuses excluded); recomputed on every read and on every case status mutation" }

  - name: ClientFamily
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Primary parent/guardian name" }
      - { name: email, type: string, source: input, description: "Contact email (free-form, not unique)" }
      - { name: credit_balance_cents, type: integer, source: computed, description: "Ledger: sum of SLA credits and approved refund credits granted minus credit_applied_cents consumed by package purchases; never negative (purchases validate sufficiency)", default: 0 }
      - { name: is_repeat_client, type: boolean, source: computed, description: "True iff the family has at least one ClientCase with status COMPLETED; recomputed on every read and on case completion", default: false }

  - name: ClientCase
    parent: null
    common_fields: true
    fields:
      - { name: family_id, type: string, source: input, description: "FK -> ClientFamily.id; owning family (Parent role identity check)" }
      - { name: consultant_id, type: string, source: input, description: "FK -> Consultant.id; assigned consultant (Consultant role identity check for clinical actions)" }
      - { name: child_birth_date, type: string, source: input, description: "ISO date YYYY-MM-DD of the child's birth" }
      - { name: delivery_mode, type: enum, source: input, description: "ONE_ON_ONE | GROUP_COURSE; gates package purchase vs course enrollment" }
      - { name: guarantee_goal_night_wakings, type: integer, source: input, description: "Guarantee goal: max acceptable night_wake_count per night; integer >= 0" }
      - { name: child_age_months, type: integer, source: computed, description: "Whole months from child_birth_date to the logical clock date: (y2-y1)*12 + (m2-m1) minus 1 when clock day-of-month < birth day-of-month" }
      - { name: age_band, type: enum, source: computed, description: "NEWBORN when child_age_months <= 3; INFANT when 4..11; TODDLER when 12..35; PRESCHOOL when >= 36" }
      - { name: status, type: enum, source: system, description: "INTAKE | ASSESSMENT | PLANNING | ACTIVE_SUPPORT | NEEDS_ATTENTION | COMPLETED | CLOSED_REFUNDED" }
      - { name: completed_at, type: datetime, source: system, description: "Logical-clock timestamp when the case entered COMPLETED; null otherwise", default: null }

  - name: IntakeQuestionnaire
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> ClientCase.id; exactly one questionnaire per case" }
      - { name: answers, type: object, source: input, description: "Required keys: night_wakings (int>=0), night_feeds (int>=0), bedtime_resistance_minutes (int>=0), nap_total_minutes (int>=0), medical_flags (bool), preterm_birth (bool)" }
      - { name: provisional_severity_score, type: integer, source: computed, description: "Auto-scored at submission per calculations.assessment_severity_score (provisional variant); 0..100" }
      - { name: adjustment_points, type: integer, source: input, description: "Consultant-supplied adjustment at review, integer in [-30, 30]; null until reviewed", default: null }
      - { name: reviewed_severity_score, type: integer, source: computed, description: "Reviewed variant of assessment_severity_score; null until review", default: null }
      - { name: review_note, type: string, source: input, description: "Optional consultant note recorded at review", default: null }
      - { name: status, type: enum, source: system, description: "SUBMITTED | REVIEWED" }

  - name: SleepPlan
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> ClientCase.id" }
      - { name: plan_sequence, type: integer, source: computed, description: "Per-case monotonically increasing ordinal; new plan = max(existing plan_sequence for case) + 1, starting at 1" }
      - { name: age_band, type: enum, source: computed, description: "Case age_band snapshot at plan creation; drives method safety validation" }
      - { name: method, type: enum, source: input, description: "GENTLE_NO_CRY | FERBER_GRADUATED | CHAIR_METHOD | EXTINCTION" }
      - { name: target_night_wake_count, type: integer, source: input, description: "Plan goal for night wakings; integer >= 0" }
      - { name: target_longest_stretch_minutes, type: integer, source: input, description: "Plan goal for longest unbroken sleep stretch; integer > 0" }
      - { name: notes, type: string, source: input, description: "Free-form plan notes", default: null }
      - { name: status, type: enum, source: system, description: "ACTIVE | NEEDS_ADJUSTMENT | SUPERSEDED | COMPLETED | CANCELLED" }

  - name: SupportPackage
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> ClientCase.id" }
      - { name: tier, type: enum, source: input, description: "BASIC | STANDARD | PREMIUM" }
      - { name: kind, type: enum, source: input, description: "INITIAL | FOLLOW_UP; FOLLOW_UP requires case COMPLETED within follow-up window and grants repeat pricing" }
      - { name: purchased_at, type: datetime, source: system, description: "Logical-clock timestamp of purchase" }
      - { name: starts_on, type: string, source: input, description: "ISO date coverage start; defaults to the logical clock date when omitted", default: "<clock date>" }
      - { name: duration_weeks, type: integer, source: computed, description: "From tier: BASIC 2, STANDARD 4, PREMIUM 6" }
      - { name: expires_on, type: string, source: computed, description: "ISO date = starts_on + duration_weeks*7 days - 1 day; coverage interval is the CLOSED date interval [starts_on, expires_on]" }
      - { name: included_calls, type: integer, source: computed, description: "From tier: BASIC 1, STANDARD 3, PREMIUM 6" }
      - { name: included_messages, type: integer, source: computed, description: "From tier: BASIC 5, STANDARD 15, PREMIUM 40" }
      - { name: response_sla_hours, type: integer, source: computed, description: "From tier: BASIC 48, STANDARD 24, PREMIUM 12" }
      - { name: remaining_calls, type: integer, source: computed, description: "included_calls minus count of this package's TroubleshootingSession rows with status in {SCHEDULED, COMPLETED}; never negative" }
      - { name: remaining_messages, type: integer, source: computed, description: "included_messages minus count of this package's Message rows; never negative" }
      - { name: gross_price_cents, type: integer, source: computed, description: "tier_base + newborn surcharge per calculations.package_price_cents" }
      - { name: repeat_discount_cents, type: integer, source: computed, description: "round_half_up(gross_price_cents * 0.15) when family is_repeat_client at purchase, else 0" }
      - { name: credit_applied_cents, type: integer, source: computed, description: "Requested apply_credit_cents (default 0), validated <= min(family credit balance, net before credit)" }
      - { name: net_price_cents, type: integer, source: computed, description: "gross_price_cents - repeat_discount_cents - credit_applied_cents" }
      - { name: sla_credit_total_cents, type: integer, source: computed, description: "Sum of SLA breach credits granted under this package; capped at round_half_up(gross_price_cents * 0.10)", default: 0 }
      - { name: status, type: enum, source: system, description: "ACTIVE | DEPLETED | EXPIRED | CLOSED_EARLY" }

  - name: NightlySleepLog
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> ClientCase.id" }
      - { name: log_date, type: string, source: input, description: "ISO date the log describes; must be <= logical clock date; unique per case" }
      - { name: night_wake_count, type: integer, source: input, description: "Number of night wakings; integer >= 0" }
      - { name: longest_stretch_minutes, type: integer, source: input, description: "Longest unbroken sleep stretch; integer >= 0" }
      - { name: nap_count, type: integer, source: input, description: "Number of naps; integer >= 0" }
      - { name: nap_total_minutes, type: integer, source: input, description: "Total nap minutes; integer >= 0" }
      - { name: notes, type: string, source: input, description: "Optional parent notes", default: null }
      - { name: review_status, type: enum, source: system, description: "PENDING_REVIEW | REVIEWED_ON_TRACK | REVIEWED_REGRESSION" }
      - { name: review_note, type: string, source: input, description: "Consultant note recorded at review", default: null }

  - name: TroubleshootingSession
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> ClientCase.id" }
      - { name: package_id, type: string, source: system, description: "FK -> SupportPackage.id; the package charged (server-selected consumable package at booking)" }
      - { name: session_type, type: enum, source: input, description: "REGRESSION | TRAVEL" }
      - { name: scheduled_start, type: datetime, source: input, description: "ISO datetime; must be strictly after the logical clock" }
      - { name: scheduled_end, type: datetime, source: input, description: "ISO datetime; duration must be 15..120 minutes inclusive" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | CANCELLED" }

  - name: Message
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> ClientCase.id" }
      - { name: package_id, type: string, source: system, description: "FK -> SupportPackage.id; the package charged (server-selected consumable package)" }
      - { name: body, type: string, source: input, description: "Parent message text" }
      - { name: response_body, type: string, source: input, description: "Consultant first-response text; null until responded", default: null }
      - { name: first_responded_at, type: datetime, source: system, description: "Logical-clock timestamp of the consultant first response; null until responded", default: null }
      - { name: sla_breached, type: boolean, source: computed, description: "True iff first_responded_at - created_at > response_sla_hours (strictly greater; exactly at the SLA boundary is on time); null until responded", default: null }
      - { name: credit_granted_cents, type: integer, source: computed, description: "1000 when sla_breached and the package SLA credit cap not yet reached, else 0; null until responded", default: null }
      - { name: status, type: enum, source: system, description: "AWAITING_RESPONSE | RESPONDED" }

  - name: RefundRequest
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> ClientCase.id" }
      - { name: package_id, type: string, source: system, description: "FK -> SupportPackage.id; server-selected refund subject = package of the case with status in {ACTIVE, DEPLETED, EXPIRED} having the latest starts_on (tie: created_at DESC)" }
      - { name: refund_type, type: enum, source: input, description: "COOLING_OFF | GUARANTEE | PRO_RATA" }
      - { name: reason, type: string, source: input, description: "Optional free-form reason", default: null }
      - { name: amount_cents, type: integer, source: computed, description: "Computed at approval per calculations.refund_amount_cents; null until APPROVED", default: null }
      - { name: denial_reason, type: string, source: input, description: "PracticeAdmin note required at denial; null otherwise", default: null }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | DENIED | PAID" }

  - name: GroupCourse
    parent: null
    common_fields: true
    fields:
      - { name: consultant_id, type: string, source: input, description: "FK -> Consultant.id; course leader" }
      - { name: title, type: string, source: input, description: "Course title" }
      - { name: starts_on, type: string, source: input, description: "ISO date of first session; enrollment closes at 00:00:00Z on this date" }
      - { name: capacity, type: integer, source: input, description: "Maximum ENROLLED seats; integer >= 1" }
      - { name: price_cents, type: integer, source: input, description: "Course price (recorded; no payment flow); integer >= 0" }
      - { name: enrolled_count, type: integer, source: computed, description: "Count of CourseEnrollment rows with course_id = this id AND status == ENROLLED; recomputed on every read and enrollment mutation" }

  - name: CourseEnrollment
    parent: null
    common_fields: true
    fields:
      - { name: course_id, type: string, source: input, description: "FK -> GroupCourse.id" }
      - { name: case_id, type: string, source: input, description: "FK -> ClientCase.id; case must have delivery_mode GROUP_COURSE" }
      - { name: status, type: enum, source: system, description: "ENROLLED | WAITLISTED | CANCELLED | WITHDRAWN" }
      - { name: promoted_at, type: datetime, source: system, description: "Logical-clock timestamp of waitlist promotion; null unless promoted", default: null }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ClientCase
    initial_state: INTAKE
    terminal_states: [CLOSED_REFUNDED]
    transitions:
      - from: INTAKE
        to: ASSESSMENT
        trigger: "POST /sleep-consulting/cases/{caseId}/questionnaire"
        actor: Parent
        preconditions: ["case.status == INTAKE"]
        side_effects: ["IntakeQuestionnaire created (SUBMITTED) with provisional_severity_score", "ClientCase.version +1"]
      - from: ASSESSMENT
        to: PLANNING
        trigger: "POST /sleep-consulting/questionnaires/{questionnaireId}/review"
        actor: Consultant
        preconditions: ["questionnaire.status == SUBMITTED", "case.status == ASSESSMENT"]
        side_effects: ["questionnaire -> REVIEWED with reviewed_severity_score", "ClientCase.version +1"]
      - from: PLANNING
        to: ACTIVE_SUPPORT
        trigger: "POST /sleep-consulting/cases/{caseId}/plans (first plan)"
        actor: Consultant
        preconditions: ["case.status == PLANNING"]
        side_effects: ["new SleepPlan ACTIVE", "consultant.active_case_count recomputed (+1)", "ClientCase.version +1"]
      - from: ACTIVE_SUPPORT
        to: NEEDS_ATTENTION
        trigger: "system (log reviewed REGRESSION while case has a plan in ACTIVE)"
        actor: system
        preconditions: ["reviewed log transitions to REVIEWED_REGRESSION", "case.status == ACTIVE_SUPPORT"]
        side_effects: ["current SleepPlan ACTIVE -> NEEDS_ADJUSTMENT (link 1)", "this case transition is link 2 of the regression cascade", "consultant.active_case_count recomputed (-1) (link 3)", "ClientCase.version +1"]
      - from: NEEDS_ATTENTION
        to: ACTIVE_SUPPORT
        trigger: "POST /sleep-consulting/plans/{planId}/resume OR POST /sleep-consulting/cases/{caseId}/plans (superseding plan)"
        actor: Consultant
        preconditions: ["case.status == NEEDS_ATTENTION", "for resume: plan.status == NEEDS_ADJUSTMENT"]
        side_effects: ["plan NEEDS_ADJUSTMENT -> ACTIVE (resume) or new plan ACTIVE and old NEEDS_ADJUSTMENT -> SUPERSEDED", "consultant.active_case_count recomputed (+1)", "ClientCase.version +1"]
      - from: ACTIVE_SUPPORT
        to: COMPLETED
        trigger: "POST /sleep-consulting/cases/{caseId}/complete"
        actor: Consultant
        preconditions:
          - "case.status == ACTIVE_SUPPORT"
          - "no SupportPackage of the case in status ACTIVE (ERR_CASE_INVALID_STATE)"
          - "no TroubleshootingSession of the case in status SCHEDULED (ERR_CASE_INVALID_STATE)"
          - "no RefundRequest of the case in status REQUESTED or APPROVED (ERR_CASE_INVALID_STATE)"
          - "at least one SleepPlan exists for the case (ERR_CASE_INVALID_STATE)"
        side_effects: ["current ACTIVE SleepPlan -> COMPLETED", "completed_at = logical clock", "family.is_repeat_client recomputed (becomes true)", "ClientCase.version +1"]
      - from: COMPLETED
        to: ACTIVE_SUPPORT
        trigger: "POST /sleep-consulting/cases/{caseId}/packages with kind == FOLLOW_UP"
        actor: Parent
        preconditions: ["case.status == COMPLETED", "logical clock <= completed_at + 180 days (ERR_FOLLOW_UP_WINDOW_CLOSED)"]
        side_effects: ["new SupportPackage ACTIVE", "family.is_repeat_client stays true", "ClientCase.version +1"]
      - from: ACTIVE_SUPPORT
        to: CLOSED_REFUNDED
        trigger: "system (refund request transitions APPROVED -> PAID)"
        actor: system
        preconditions: ["a RefundRequest of the case became PAID", "case.status == ACTIVE_SUPPORT"]
        side_effects:
          - "this case transition is link 1 of the refund-paid cascade; it causes link 2:"
          - "every SleepPlan of the case in ACTIVE or NEEDS_ADJUSTMENT -> CANCELLED"
          - "every SupportPackage of the case in ACTIVE or DEPLETED -> CLOSED_EARLY with remaining_calls and remaining_messages frozen at 0"
          - "every TroubleshootingSession of the case in SCHEDULED -> CANCELLED without releasing call entitlement (package no longer ACTIVE)"
          - "consultant.active_case_count recomputed (-1)"
          - "ClientCase.version +1"
      - from: NEEDS_ATTENTION
        to: CLOSED_REFUNDED
        trigger: "system (refund request transitions APPROVED -> PAID)"
        actor: system
        preconditions: ["a RefundRequest of the case became PAID", "case.status == NEEDS_ATTENTION"]
        side_effects: ["same link-2 cascade as ACTIVE_SUPPORT -> CLOSED_REFUNDED", "ClientCase.version +1"]

  - entity: IntakeQuestionnaire
    initial_state: SUBMITTED
    terminal_states: [REVIEWED]
    transitions:
      - from: SUBMITTED
        to: REVIEWED
        trigger: "POST /sleep-consulting/questionnaires/{questionnaireId}/review"
        actor: Consultant
        preconditions: ["questionnaire.status == SUBMITTED (ERR_QUESTIONNAIRE_ALREADY_REVIEWED)"]
        side_effects: ["reviewed_severity_score computed (reviewed variant)", "case ASSESSMENT -> PLANNING"]

  - entity: SleepPlan
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED, COMPLETED, CANCELLED]
    transitions:
      - from: ACTIVE
        to: NEEDS_ADJUSTMENT
        trigger: "system (a NightlySleepLog of the case is reviewed REGRESSION)"
        actor: system
        preconditions: ["plan is the case's current plan (status ACTIVE)", "log review outcome == REGRESSION"]
        side_effects: ["link 1 of the regression cascade: causes case ACTIVE_SUPPORT -> NEEDS_ATTENTION (link 2)"]
      - from: NEEDS_ADJUSTMENT
        to: ACTIVE
        trigger: "POST /sleep-consulting/plans/{planId}/resume"
        actor: Consultant
        preconditions: ["plan.status == NEEDS_ADJUSTMENT (ERR_PLAN_INVALID_STATE)"]
        side_effects: ["case NEEDS_ATTENTION -> ACTIVE_SUPPORT when this plan is the case's latest non-SUPERSEDED plan"]
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (a new SleepPlan is created for the same case)"
        actor: system
        preconditions: ["new plan creation succeeds"]
        side_effects: ["plan no longer current"]
      - from: NEEDS_ADJUSTMENT
        to: SUPERSEDED
        trigger: "system (a new SleepPlan is created for the same case)"
        actor: system
        preconditions: ["new plan creation succeeds"]
        side_effects: ["plan no longer current; case NEEDS_ATTENTION -> ACTIVE_SUPPORT via the new plan's creation transition"]
      - from: ACTIVE
        to: COMPLETED
        trigger: "system (case completed)"
        actor: system
        preconditions: ["case ACTIVE_SUPPORT -> COMPLETED"]
        side_effects: []
      - from: ACTIVE
        to: CANCELLED
        trigger: "system (refund-paid cascade closes the case)"
        actor: system
        preconditions: ["case -> CLOSED_REFUNDED"]
        side_effects: []
      - from: NEEDS_ADJUSTMENT
        to: CANCELLED
        trigger: "system (refund-paid cascade closes the case)"
        actor: system
        preconditions: ["case -> CLOSED_REFUNDED"]
        side_effects: []

  - entity: SupportPackage
    initial_state: ACTIVE
    terminal_states: [DEPLETED, EXPIRED, CLOSED_EARLY]
    transitions:
      - from: ACTIVE
        to: DEPLETED
        trigger: "system (after any consumption, remaining_calls == 0 AND remaining_messages == 0)"
        actor: system
        preconditions: ["package.status == ACTIVE", "remaining_calls == 0 and remaining_messages == 0"]
        side_effects: ["SupportPackage.version +1"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (POST /sleep-consulting/_clock/set_current_utc advances the clock past expires_on)"
        actor: system
        preconditions: ["package.status == ACTIVE", "logical clock date > expires_on"]
        side_effects: ["guarantee-eligibility evaluation becomes possible", "SupportPackage.version +1; expiry never reverts on later clock moves"]
      - from: ACTIVE
        to: CLOSED_EARLY
        trigger: "system (refund-paid cascade closes the case)"
        actor: system
        preconditions: ["case -> CLOSED_REFUNDED"]
        side_effects: ["remaining_calls and remaining_messages frozen at 0; no entitlement release on subsequent session cancellation"]
      - from: DEPLETED
        to: CLOSED_EARLY
        trigger: "system (refund-paid cascade closes the case)"
        actor: system
        preconditions: ["case -> CLOSED_REFUNDED"]
        side_effects: []

  - entity: NightlySleepLog
    initial_state: PENDING_REVIEW
    terminal_states: [REVIEWED_ON_TRACK, REVIEWED_REGRESSION]
    transitions:
      - from: PENDING_REVIEW
        to: REVIEWED_ON_TRACK
        trigger: "POST /sleep-consulting/logs/{logId}/review with outcome == ON_TRACK"
        actor: Consultant
        preconditions: ["log.review_status == PENDING_REVIEW (ERR_LOG_ALREADY_REVIEWED)"]
        side_effects: []
      - from: PENDING_REVIEW
        to: REVIEWED_REGRESSION
        trigger: "POST /sleep-consulting/logs/{logId}/review with outcome == REGRESSION"
        actor: Consultant
        preconditions: ["log.review_status == PENDING_REVIEW (ERR_LOG_ALREADY_REVIEWED)"]
        side_effects: ["triggers the regression cascade: current plan ACTIVE -> NEEDS_ADJUSTMENT (link 1), case ACTIVE_SUPPORT -> NEEDS_ATTENTION (link 2), consultant.active_case_count recomputed (link 3)"]

  - entity: TroubleshootingSession
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /sleep-consulting/troubleshooting-sessions/{sessionId}/complete"
        actor: Consultant
        preconditions: ["session.status == SCHEDULED (ERR_SESSION_INVALID_STATE)"]
        side_effects: ["call entitlement remains consumed (no release on completion)"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /sleep-consulting/troubleshooting-sessions/{sessionId}/cancel"
        actor: Parent
        preconditions: ["session.status == SCHEDULED (ERR_SESSION_INVALID_STATE)", "logical clock < scheduled_start (ERR_SESSION_INVALID_STATE)"]
        side_effects: ["if the charged package.status == ACTIVE: package.remaining_calls += 1 (compensating release); otherwise no release"]

  - entity: Message
    initial_state: AWAITING_RESPONSE
    terminal_states: [RESPONDED]
    transitions:
      - from: AWAITING_RESPONSE
        to: RESPONDED
        trigger: "POST /sleep-consulting/messages/{messageId}/respond"
        actor: Consultant
        preconditions: ["message.status == AWAITING_RESPONSE (ERR_MESSAGE_ALREADY_RESPONDED)"]
        side_effects:
          - "first_responded_at = logical clock; sla_breached and credit_granted_cents computed"
          - "when credit_granted_cents > 0: family.credit_balance_cents += credit_granted_cents and package.sla_credit_total_cents += credit_granted_cents"
          - "package DEPLETED check re-evaluated (message was consumed at send time)"

  - entity: RefundRequest
    initial_state: REQUESTED
    terminal_states: [DENIED, PAID]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /sleep-consulting/refund-requests/{refundId}/approve"
        actor: PracticeAdmin
        preconditions: ["refund.status == REQUESTED (ERR_REFUND_INVALID_STATE)"]
        side_effects: ["amount_cents computed per calculations.refund_amount_cents (variant selected by refund_type)", "family.credit_balance_cents += amount_cents"]
      - from: REQUESTED
        to: DENIED
        trigger: "POST /sleep-consulting/refund-requests/{refundId}/deny"
        actor: PracticeAdmin
        preconditions: ["refund.status == REQUESTED (ERR_REFUND_INVALID_STATE)"]
        side_effects: ["denial_reason recorded"]
      - from: APPROVED
        to: PAID
        trigger: "POST /sleep-consulting/refund-requests/{refundId}/pay"
        actor: PracticeAdmin
        preconditions: ["refund.status == APPROVED (ERR_REFUND_INVALID_STATE)"]
        side_effects: ["triggers the refund-paid cascade: case -> CLOSED_REFUNDED (link 1); plans CANCELLED, packages CLOSED_EARLY, scheduled sessions CANCELLED (link 2)"]

  - entity: CourseEnrollment
    initial_state: ENROLLED
    terminal_states: [CANCELLED, WITHDRAWN]
    transitions:
      - from: null
        to: ENROLLED
        trigger: "POST /sleep-consulting/group-courses/{courseId}/enrollments when course.enrolled_count < course.capacity"
        actor: Parent
        preconditions: ["case.delivery_mode == GROUP_COURSE", "logical clock date < course.starts_on", "no non-terminal enrollment for (course, case)"]
        side_effects: ["course.enrolled_count recomputed (+1)"]
      - from: null
        to: WAITLISTED
        trigger: "POST /sleep-consulting/group-courses/{courseId}/enrollments when course.enrolled_count >= course.capacity"
        actor: Parent
        preconditions: ["same as enrollment"]
        side_effects: []
      - from: ENROLLED
        to: CANCELLED
        trigger: "POST /sleep-consulting/enrollments/{enrollmentId}/cancel"
        actor: Parent
        preconditions: ["enrollment.status == ENROLLED (ERR_ENROLLMENT_INVALID_STATE)"]
        side_effects: ["course.enrolled_count recomputed (-1)", "waitlist promotion: the WAITLISTED enrollment of the course with earliest created_at -> ENROLLED with promoted_at = clock (exactly one; seat stays open when none waitlisted); that promotion recomputes enrolled_count (+1)"]
      - from: WAITLISTED
        to: WITHDRAWN
        trigger: "POST /sleep-consulting/enrollments/{enrollmentId}/cancel"
        actor: Parent
        preconditions: ["enrollment.status == WAITLISTED (ERR_ENROLLMENT_INVALID_STATE)"]
        side_effects: ["no promotion (no seat freed)"]
      - from: WAITLISTED
        to: ENROLLED
        trigger: "system (waitlist promotion after an ENROLLED cancellation frees a seat)"
        actor: system
        preconditions: ["a seat was freed on the course", "this enrollment is the earliest-created WAITLISTED row"]
        side_effects: ["promoted_at = logical clock", "course.enrolled_count recomputed (+1)"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: plan-create-stale-case
    parent_entity: ClientCase
    write_endpoint: "POST /sleep-consulting/cases/{caseId}/plans"
    occ_field: "expected_case_version"
    description: |
      Creating a SleepPlan against a ClientCase whose version has advanced
      since the client last observed it is rejected. The product allows a new
      plan to legitimately supersede the current one, so a writer holding a
      stale case version would unknowingly supersede a plan they never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: session-book-stale-package
    parent_entity: SupportPackage
    write_endpoint: "POST /sleep-consulting/cases/{caseId}/troubleshooting-sessions"
    occ_field: "expected_package_version"
    description: |
      Booking a TroubleshootingSession against a SupportPackage whose version
      has advanced since the client last observed it is rejected. The package
      entitlement ledger mutates on every booking/cancellation/message, so a
      stale package version means the caller's view of remaining_calls is
      stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: child_age_and_band
    trigger: "case creation; every read of ClientCase; plan creation (band snapshot)"
    algorithm: chronological
    formula: |
      months = (clock_year - birth_year) * 12 + (clock_month - birth_month)
      if clock_day < birth_day: months -= 1
      child_age_months = max(0, months)
      age_band = NEWBORN  if child_age_months <= 3
                 INFANT   if 4 <= child_age_months <= 11
                 TODDLER  if 12 <= child_age_months <= 35
                 PRESCHOOL if child_age_months >= 36
    input_set: "ClientCase.child_birth_date and the logical clock date"
    constants: {}
    precision: "whole months; band boundaries inclusive at the lower edge (exactly 4 months is INFANT)"

  - name: method_age_safety
    trigger: "POST /cases/{caseId}/plans"
    algorithm: threshold
    formula: |
      allowed(age_band) =
        NEWBORN:   {GENTLE_NO_CRY}
        INFANT:    {GENTLE_NO_CRY, FERBER_GRADUATED, CHAIR_METHOD}
        TODDLER:   {GENTLE_NO_CRY, FERBER_GRADUATED, CHAIR_METHOD, EXTINCTION}
        PRESCHOOL: {GENTLE_NO_CRY, FERBER_GRADUATED, CHAIR_METHOD, EXTINCTION}
      if method not in allowed(plan.age_band): reject ERR_METHOD_NOT_AGE_APPROPRIATE
    input_set: "SleepPlan.age_band snapshot and requested method"
    constants: {}

  - name: assessment_severity_score
    trigger: "questionnaire submission (provisional variant); questionnaire review (reviewed variant)"
    algorithm: weighted_scoring
    formula: |
      base = 10 * night_wakings
           + 4 * night_feeds
           + floor(bedtime_resistance_minutes / 3)
           + max(0, ceil((150 - nap_total_minutes) / 15))
      if medical_flags: base -= 20
      if preterm_birth: base -= 10
      provisional_severity_score = clamp(0, 100, base)
      reviewed_severity_score = clamp(0, 100, provisional + adjustment_points + band_modifier)
      band_modifier = NEWBORN: -5, INFANT: 0, TODDLER: +5, PRESCHOOL: +10
    input_set: "the questionnaire's answers object; reviewed variant additionally uses adjustment_points and the case age_band at review time"
    constants:
      W_NIGHT_WAKING: 10
      W_NIGHT_FEED: 4
      BEDTIME_DIVISOR: 3
      NAP_BASELINE_MINUTES: 150
      NAP_DIVISOR: 15
      MEDICAL_PENALTY: -20
      PRETERM_PENALTY: -10
    precision: "integer; floor for bedtime term; ceil for nap term; clamp to [0, 100] last"
    variants:
      - name: provisional
        when: "at questionnaire submission (no consultant input yet)"
        difference: "computed from answers only; no adjustment_points, no band_modifier"
      - name: reviewed
        when: "at consultant review"
        difference: "same answers, but adds adjustment_points and the age-band modifier, so identical questionnaire data yields a different score once reviewed"

  - name: package_price_cents
    trigger: "POST /cases/{caseId}/packages"
    algorithm: tiered_pricing
    formula: |
      tier_base = BASIC: 29900, STANDARD: 54900, PREMIUM: 89900
      gross_price_cents = tier_base + (case.age_band == NEWBORN ? NEWBORN_SURCHARGE_CENTS : 0)
      repeat_discount_cents = round_half_up(gross_price_cents * REPEAT_DISCOUNT_PCT) if family.is_repeat_client else 0
      # PINNED ROUNDING ORDER: the discount is rounded half-up to whole cents FIRST,
      # then subtracted. (Rounding after subtraction would give a different cent.)
      credit_cap = gross_price_cents - repeat_discount_cents
      credit_applied_cents = requested apply_credit_cents (default 0);
        reject ERR_INVALID_REQUEST unless 0 <= apply_credit_cents <= min(family.credit_balance_cents, credit_cap)
      net_price_cents = gross_price_cents - repeat_discount_cents - credit_applied_cents
      family.credit_balance_cents -= credit_applied_cents
    input_set: "tier, case.age_band, family.is_repeat_client, apply_credit_cents, family.credit_balance_cents"
    constants:
      BASIC_BASE_CENTS: 29900
      STANDARD_BASE_CENTS: 54900
      PREMIUM_BASE_CENTS: 89900
      NEWBORN_SURCHARGE_CENTS: 4950
      REPEAT_DISCOUNT_PCT: 0.15
    precision: "integer cents; round_half_up applied to the discount only, before subtraction"
    variants:
      - name: new_client
        when: "family.is_repeat_client == false at purchase"
        difference: "repeat_discount_cents == 0"
      - name: repeat_client
        when: "family.is_repeat_client == true at purchase (mandatory for kind == FOLLOW_UP)"
        difference: "repeat_discount_cents = round_half_up(gross * 0.15); identical tier and age band price differently for a repeat family"

  - name: sla_breach_and_credit
    trigger: "POST /messages/{messageId}/respond (first response only)"
    algorithm: threshold
    formula: |
      elapsed_seconds = first_responded_at - message.created_at
      sla_breached = elapsed_seconds > package.response_sla_hours * 3600   # strictly greater; == is on time
      sla_credit_cap_cents = round_half_up(package.gross_price_cents * SLA_CREDIT_CAP_PCT)
      if sla_breached and package.sla_credit_total_cents + SLA_CREDIT_CENTS <= sla_credit_cap_cents:
        credit_granted_cents = SLA_CREDIT_CENTS
      else:
        credit_granted_cents = 0   # breach still recorded; cap reached
    input_set: "the message, its package's response_sla_hours / gross_price_cents / sla_credit_total_cents"
    constants:
      SLA_CREDIT_CENTS: 1000
      SLA_CREDIT_CAP_PCT: 0.10
    precision: "whole seconds; integer cents"

  - name: entitlement_ledger
    trigger: "session booking/cancellation/completion, message send, package read"
    algorithm: aggregation
    formula: |
      remaining_calls = included_calls - count(sessions of package with status in {SCHEDULED, COMPLETED})
      remaining_messages = included_messages - count(messages of package)
      # cancellation moves a session out of the counted set and, iff the package is ACTIVE,
      # remaining_calls is incremented by 1 — the forward+compensating pair conserves:
      #   remaining_calls + count(sessions in {SCHEDULED, COMPLETED}) == included_calls
      # packages in DEPLETED / EXPIRED / CLOSED_EARLY do not receive releases.
    input_set: "TroubleshootingSession rows with package_id = this package; Message rows with package_id = this package"
    constants: {}

  - name: guarantee_eligibility
    trigger: "POST /cases/{caseId}/refund-requests with refund_type == GUARANTEE"
    algorithm: threshold
    formula: |
      eligible iff ALL of:
        package.status == EXPIRED
        count(logs of case with review_status in {REVIEWED_ON_TRACK, REVIEWED_REGRESSION}) >= 14
        among the 7 most recent reviewed logs (order log_date DESC; log_date unique per case so no tie),
          count(night_wake_count > case.guarantee_goal_night_wakings) >= 4     # 3 of 7 is NOT enough
    input_set: "reviewed NightlySleepLog rows of the case (PENDING_REVIEW excluded); package; case goal"
    constants:
      GUARANTEE_MIN_REVIEWED_LOGS: 14
      GUARANTEE_WINDOW_LOGS: 7
      GUARANTEE_MIN_MISSES: 4

  - name: refund_amount_cents
    trigger: "POST /refund-requests/{refundId}/approve"
    algorithm: tiered_pricing
    formula: |
      # Evaluation order is pinned to break the apparent circle: consumption counts are
      # read from session/message/log ROWS (not from remaining_* fields), THEN the amount
      # is computed, THEN the refund-paid cascade may zero remaining_* fields.
      completed_sessions = count(sessions of package with status COMPLETED)
      sent_messages = count(messages of package)
      COOLING_OFF: amount_cents = package.net_price_cents
      GUARANTEE:   amount_cents = round_half_up(package.net_price_cents * 0.50)
      PRO_RATA:    consumed = completed_sessions * CALL_VALUE_CENTS + sent_messages * MESSAGE_VALUE_CENTS
                   amount_cents = max(0, package.net_price_cents - consumed)
    input_set: "the server-selected refund-subject package; its sessions and messages"
    constants:
      CALL_VALUE_CENTS: 7500
      MESSAGE_VALUE_CENTS: 1200
      GUARANTEE_REFUND_PCT: 0.50
    precision: "integer cents; round_half_up for the guarantee percentage"
    variants:
      - name: cooling_off
        when: "refund_type == COOLING_OFF"
        difference: "full 100% of net_price_cents"
      - name: guarantee
        when: "refund_type == GUARANTEE"
        difference: "50% of net_price_cents, rounded half-up"
      - name: pro_rata
        when: "refund_type == PRO_RATA"
        difference: "net minus consumed services at fixed unit values; identical package data yields a different amount per variant"

  - name: refund_eligibility
    trigger: "POST /cases/{caseId}/refund-requests"
    algorithm: threshold
    formula: |
      COOLING_OFF eligible iff: logical clock <= package.purchased_at + 48 hours
        AND count(package sessions with status COMPLETED) == 0
        AND count(package messages) == 0
        AND count(logs of case with review_status in {REVIEWED_ON_TRACK, REVIEWED_REGRESSION}) == 0
      GUARANTEE eligible iff calculations.guarantee_eligibility
      PRO_RATA eligible iff: package.status == ACTIVE
        AND logical clock > package.purchased_at + 48 hours
        AND computed PRO_RATA amount would be > 0
    input_set: "server-selected refund-subject package and case"
    constants:
      COOLING_OFF_HOURS: 48

  - name: consultant_capacity_check
    trigger: "POST /cases"
    algorithm: threshold
    formula: |
      active_case_count = count(cases with consultant_id = X and status == ACTIVE_SUPPORT)
      reject ERR_CONSULTANT_AT_CAPACITY iff active_case_count >= consultant.max_active_cases
      # boundary: count == max_active_cases - 1 accepts; count == max_active_cases rejects
    input_set: "ClientCase rows of the consultant (only status ACTIVE_SUPPORT counted)"
    constants: {}

  - name: session_overlap_check
    trigger: "POST /cases/{caseId}/troubleshooting-sessions"
    algorithm: interval_merge
    formula: |
      # Buffer semantics on the consultant's calendar: a 15-minute gap is required
      # between the new session and every existing SCHEDULED session of the SAME
      # consultant (the case's assigned consultant).
      conflict iff exists session s2 of consultant with s2.status == SCHEDULED such that
        new.scheduled_start < s2.scheduled_end + 15 minutes
        AND s2.scheduled_start < new.scheduled_end + 15 minutes
      # strict <: a gap of exactly 15 minutes is allowed; a gap of 14 is not;
      # direct adjacency (gap 0) is a conflict.
    input_set: "SCHEDULED TroubleshootingSession rows whose case.consultant_id == this case's consultant_id"
    constants:
      SESSION_BUFFER_MINUTES: 15
      SESSION_MIN_DURATION_MINUTES: 15
      SESSION_MAX_DURATION_MINUTES: 120

  - name: package_window_overlap
    trigger: "POST /cases/{caseId}/packages with kind == INITIAL"
    algorithm: interval_merge
    formula: |
      # CLOSED date-interval semantics on the case's coverage timeline:
      # coverage = [starts_on, expires_on], both endpoints inclusive.
      conflict iff exists package p of the case with p.status == ACTIVE such that
        NOT (new.expires_on < p.starts_on OR new.starts_on > p.expires_on)
      # touching boundaries DO conflict (new.starts_on == p.expires_on overlaps on that date).
    input_set: "SupportPackage rows of the case with status ACTIVE (DEPLETED/EXPIRED/CLOSED_EARLY excluded)"
    constants: {}

  - name: consumable_package_selector
    trigger: "session booking; message send; refund-request creation (subject selection differs, see RefundRequest.package_id)"
    algorithm: aggregation
    formula: |
      candidates = packages of the case with status == ACTIVE
        AND starts_on <= logical clock date <= expires_on
      if empty: reject ERR_PACKAGE_NOT_ACTIVE
      rank: starts_on ASC, tie created_at ASC (the package_window_overlap rule makes a
        window-membership tie impossible among ACTIVE packages; ordering pinned regardless)
      selected = first candidate
    input_set: "SupportPackage rows of the case"
    constants: {}

  - name: waitlist_promotion
    trigger: "enrollment cancellation that frees a seat (ENROLLED -> CANCELLED)"
    algorithm: aggregation
    formula: |
      candidates = enrollments of the course with status == WAITLISTED
      if empty: no promotion; seat stays open
      rank: created_at ASC (earliest waitlisted first)
      selected = first candidate -> ENROLLED, promoted_at = logical clock
    input_set: "CourseEnrollment rows of the course with status WAITLISTED"
    constants: {}

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role recognized"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "Role permitted for the endpoint per §1.5 roles; ownership: Parent X-User-ID must equal the target case's family_id (or familyId for family reads); Consultant X-User-ID must equal the case's consultant_id for clinical actions (questionnaire review, plan create/resume, log review, message respond, session complete)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "Request body shape: required fields present, enum members valid, integer ranges respected (max_active_cases >= 1, capacity >= 1, counts >= 0, adjustment_points in [-30,30], duration 15..120 min, scheduled_end > scheduled_start, log_date not in the future, apply_credit_cents within balance and credit cap)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all mutating endpoints"
  - priority: 4
    category: existence
    check: "Path resource ids exist, validated left-to-right (caseId before logId etc.); body FK references exist (family_id, consultant_id, case_id)"
    error_id: "ERR_CONSULTANT_NOT_FOUND | ERR_FAMILY_NOT_FOUND | ERR_CASE_NOT_FOUND | ERR_QUESTIONNAIRE_NOT_FOUND | ERR_PLAN_NOT_FOUND | ERR_PACKAGE_NOT_FOUND | ERR_LOG_NOT_FOUND | ERR_SESSION_NOT_FOUND | ERR_MESSAGE_NOT_FOUND | ERR_REFUND_REQUEST_NOT_FOUND | ERR_COURSE_NOT_FOUND | ERR_ENROLLMENT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids or FK body fields"
  - priority: 5
    category: state
    check: "Target resource in a state that permits the operation (case status sets per transition; questionnaire SUBMITTED; plan NEEDS_ADJUSTMENT for resume; consumable package ACTIVE and in-window; session SCHEDULED and not yet started; message AWAITING_RESPONSE; refund REQUESTED/APPROVED; enrollment ENROLLED/WAITLISTED)"
    error_id: "ERR_CASE_INVALID_STATE | ERR_PLAN_INVALID_STATE | ERR_PACKAGE_NOT_ACTIVE | ERR_SESSION_INVALID_STATE | ERR_REFUND_INVALID_STATE | ERR_MESSAGE_ALREADY_RESPONDED | ERR_ENROLLMENT_INVALID_STATE | ERR_QUESTIONNAIRE_ALREADY_REVIEWED | ERR_LOG_ALREADY_REVIEWED"
    http_status: 409
    applies_to: "state transition endpoints"
  - priority: 6
    category: business_safety
    check: "Method-age safety: requested method must be in the allowed set for the case's current age_band (per calculations.method_age_safety)"
    error_id: ERR_METHOD_NOT_AGE_APPROPRIATE
    http_status: 422
    applies_to: "POST /sleep-consulting/cases/{caseId}/plans"
  - priority: 7
    category: business_temporal
    check: "Temporal rules: session consultant-calendar overlap with 15-minute buffer; follow-up purchase within completed_at + 180 days; course enrollment before course starts_on"
    error_id: "ERR_SCHEDULING_CONFLICT | ERR_FOLLOW_UP_WINDOW_CLOSED | ERR_ENROLLMENT_CLOSED"
    http_status: 409
    applies_to: "session booking (409), follow-up package purchase (422), course enrollment (422)"
  - priority: 8
    category: business_constraint
    check: "Uniqueness/coverage constraints: one log per (case, log_date); no non-terminal enrollment per (course, case); no overlapping ACTIVE package coverage window (closed date interval); at most one refund in REQUESTED or APPROVED per case. (The one-questionnaire-per-case invariant is enforced by the case state machine at priority 5: submission requires INTAKE and the first submission leaves INTAKE.)"
    error_id: "ERR_DUPLICATE_LOG | ERR_ALREADY_ENROLLED | ERR_PACKAGE_WINDOW_OVERLAP | ERR_REFUND_ALREADY_PENDING"
    http_status: 409
    applies_to: "creation endpoints for questionnaire, logs, enrollments, packages, refunds"
  - priority: 9
    category: business_fiscal
    check: "Quota checks: consultant capacity at case creation; call/message entitlement availability at booking/send"
    error_id: "ERR_CONSULTANT_AT_CAPACITY | ERR_ENTITLEMENT_EXHAUSTED"
    http_status: 409
    applies_to: "POST /cases (capacity, 409); session booking and message send (entitlement, 422)"
  - priority: 10
    category: business_fiscal
    check: "Refund eligibility per calculations.refund_eligibility for the requested refund_type; delivery-mode match (packages require ONE_ON_ONE; enrollments require GROUP_COURSE)"
    error_id: "ERR_REFUND_NOT_ELIGIBLE | ERR_DELIVERY_MODE_MISMATCH"
    http_status: 422
    applies_to: "POST /cases/{caseId}/refund-requests; package purchase; course enrollment"

# =============================================================================
# §1.5 API Endpoint Table (44 endpoints)
# =============================================================================
endpoints:
  - method: POST
    path: "/sleep-consulting/consultants"
    description: "Create a Consultant"
    roles: [PracticeAdmin]
    code: 201
    input: [full_name, certification_no, max_active_cases]
    output: Consultant
    side_effects: ["active_case_count = 0"]
  - method: GET
    path: "/sleep-consulting/consultants/{consultantId}"
    description: "Get a Consultant (recomputes active_case_count)"
    roles: [PracticeAdmin, Consultant, Parent]
    code: 200
    input: []
    output: Consultant
    side_effects: []
  - method: POST
    path: "/sleep-consulting/families"
    description: "Register a ClientFamily (client portal self-registration)"
    roles: [Anonymous]
    code: 201
    input: [full_name, email]
    output: ClientFamily
    side_effects: ["credit_balance_cents = 0, is_repeat_client = false"]
  - method: GET
    path: "/sleep-consulting/families"
    description: "List ClientFamilies"
    roles: [PracticeAdmin, Consultant]
    code: 200
    input: ["limit?", "offset?"]
    output: "ClientFamily[]"
    side_effects: []
  - method: GET
    path: "/sleep-consulting/families/{familyId}"
    description: "Get a ClientFamily (Parent may read only own id)"
    roles: [PracticeAdmin, Consultant, Parent]
    code: 200
    input: []
    output: ClientFamily
    side_effects: []
  - method: POST
    path: "/sleep-consulting/cases"
    description: "Open a ClientCase (Parent opens for own family; capacity checked on consultant)"
    roles: [Parent, PracticeAdmin]
    code: 201
    input: [family_id, consultant_id, child_birth_date, delivery_mode, guarantee_goal_night_wakings]
    output: ClientCase
    side_effects: ["status = INTAKE", "consultant capacity check (consultant_capacity_check)"]
  - method: GET
    path: "/sleep-consulting/cases"
    description: "List ClientCases with optional filters (Parent sees only own family's cases)"
    roles: [PracticeAdmin, Consultant, Parent]
    code: 200
    input: ["family_id?", "consultant_id?", "status?", "limit?", "offset?"]
    output: "ClientCase[]"
    side_effects: []
  - method: GET
    path: "/sleep-consulting/cases/{caseId}"
    description: "Get a ClientCase (recomputes child_age_months and age_band against the logical clock)"
    roles: [PracticeAdmin, Consultant, Parent]
    code: 200
    input: []
    output: ClientCase
    side_effects: []
  - method: POST
    path: "/sleep-consulting/cases/{caseId}/complete"
    description: "Complete a case (Consultant assigned to the case)"
    roles: [Consultant]
    code: 200
    input: []
    output: ClientCase
    side_effects: ["ACTIVE_SUPPORT -> COMPLETED per §1.2 preconditions", "current plan -> COMPLETED", "completed_at = clock", "family.is_repeat_client recomputed"]
  - method: POST
    path: "/sleep-consulting/cases/{id}/questionnaire"
    description: "Submit the intake questionnaire & sleep history (one per case)"
    roles: [Parent]
    code: 201
    input: [answers]
    output: IntakeQuestionnaire
    side_effects: ["provisional_severity_score computed (assessment_severity_score provisional variant)", "case INTAKE -> ASSESSMENT"]
  - method: GET
    path: "/sleep-consulting/cases/{id}/questionnaire"
    description: "Get the case's questionnaire (array of length 0 or 1)"
    roles: [PracticeAdmin, Consultant, Parent]
    code: 200
    input: []
    output: "IntakeQuestionnaire[]"
    side_effects: []
  - method: POST
    path: "/sleep-consulting/questionnaires/{questionnaireId}/review"
    description: "Consultant reviews the questionnaire with a clinical adjustment"
    roles: [Consultant]
    code: 200
    input: [adjustment_points, "review_note?"]
    output: IntakeQuestionnaire
    side_effects: ["reviewed_severity_score computed (reviewed variant)", "questionnaire SUBMITTED -> REVIEWED", "case ASSESSMENT -> PLANNING"]
  - method: POST
    path: "/sleep-consulting/cases/{id}/plans"
    description: "Create a SleepPlan (immediately ACTIVE; supersedes the case's current ACTIVE/NEEDS_ADJUSTMENT plan). OCC-guarded on ClientCase.version."
    roles: [Consultant]
    code: 201
    input: [method, target_night_wake_count, target_longest_stretch_minutes, "notes?", expected_case_version]
    output: SleepPlan
    side_effects:
      - "OCC: reject ERR_STALE_VERSION when expected_case_version != case.version"
      - "method-age safety check on the case's current age_band"
      - "existing plans in ACTIVE or NEEDS_ADJUSTMENT -> SUPERSEDED"
      - "new plan ACTIVE with plan_sequence = max + 1; age_band snapshot"
      - "case PLANNING -> ACTIVE_SUPPORT or NEEDS_ATTENTION -> ACTIVE_SUPPORT"
      - "increments ClientCase.version by 1"
  - method: GET
    path: "/sleep-consulting/cases/{id}/plans"
    description: "List SleepPlans of a case"
    roles: [PracticeAdmin, Consultant, Parent]
    code: 200
    input: ["limit?", "offset?"]
    output: "SleepPlan[]"
    side_effects: []
  - method: POST
    path: "/sleep-consulting/plans/{planId}/resume"
    description: "Resume a NEEDS_ADJUSTMENT plan without superseding it (adjustment confirmed)"
    roles: [Consultant]
    code: 200
    input: []
    output: SleepPlan
    side_effects: ["plan NEEDS_ADJUSTMENT -> ACTIVE", "case NEEDS_ATTENTION -> ACTIVE_SUPPORT when this is the case's latest non-SUPERSEDED plan", "consultant.active_case_count recomputed"]
  - method: POST
    path: "/sleep-consulting/cases/{id}/packages"
    description: "Purchase a support package (INITIAL or FOLLOW_UP); computes tier/age/repeat pricing"
    roles: [Parent, PracticeAdmin]
    code: 201
    input: [tier, kind, "starts_on?", "apply_credit_cents?"]
    output: SupportPackage
    side_effects: ["package_price_cents computed (repeat variant when family is_repeat_client)", "credit_applied_cents debited from family credit_balance_cents", "INITIAL: package_window_overlap check", "FOLLOW_UP: case COMPLETED -> ACTIVE_SUPPORT"]
  - method: GET
    path: "/sleep-consulting/cases/{id}/packages"
    description: "List SupportPackages of a case"
    roles: [PracticeAdmin, Consultant, Parent]
    code: 200
    input: ["limit?", "offset?"]
    output: "SupportPackage[]"
    side_effects: []
  - method: GET
    path: "/sleep-consulting/packages/{packageId}"
    description: "Get a SupportPackage (recomputes remaining entitlements)"
    roles: [PracticeAdmin, Consultant, Parent]
    code: 200
    input: []
    output: SupportPackage
    side_effects: []
  - method: GET
    path: "/sleep-consulting/packages/{id}/troubleshooting-sessions"
    description: "List TroubleshootingSessions charged to a package (usage view)"
    roles: [PracticeAdmin, Consultant, Parent]
    code: 200
    input: ["limit?", "offset?"]
    output: "TroubleshootingSession[]"
    side_effects: []
  - method: GET
    path: "/sleep-consulting/packages/{id}/messages"
    description: "List Messages charged to a package (usage view)"
    roles: [PracticeAdmin, Consultant, Parent]
    code: 200
    input: ["limit?", "offset?"]
    output: "Message[]"
    side_effects: []
  - method: GET
    path: "/sleep-consulting/packages/{id}/refund-requests"
    description: "List RefundRequests whose subject is this package"
    roles: [PracticeAdmin, Consultant, Parent]
    code: 200
    input: ["limit?", "offset?"]
    output: "RefundRequest[]"
    side_effects: []
  - method: POST
    path: "/sleep-consulting/cases/{id}/logs"
    description: "Submit a nightly sleep log (unique per case and log_date)"
    roles: [Parent]
    code: 201
    input: [log_date, night_wake_count, longest_stretch_minutes, nap_count, nap_total_minutes, "notes?"]
    output: NightlySleepLog
    side_effects: ["review_status = PENDING_REVIEW"]
  - method: GET
    path: "/sleep-consulting/cases/{id}/logs"
    description: "List NightlySleepLogs of a case"
    roles: [PracticeAdmin, Consultant, Parent]
    code: 200
    input: ["log_date?", "review_status?", "limit?", "offset?"]
    output: "NightlySleepLog[]"
    side_effects: []
  - method: POST
    path: "/sleep-consulting/logs/{logId}/review"
    description: "Consultant reviews a log; REGRESSION outcome fires the regression cascade"
    roles: [Consultant]
    code: 200
    input: [outcome, "review_note?"]
    output: NightlySleepLog
    side_effects: ["ON_TRACK -> REVIEWED_ON_TRACK", "REGRESSION -> REVIEWED_REGRESSION + plan NEEDS_ADJUSTMENT + case NEEDS_ATTENTION + consultant count recompute (conditional on current states: links already in target state are no-ops)"]
  - method: POST
    path: "/sleep-consulting/cases/{id}/troubleshooting-sessions"
    description: "Book a regression/travel troubleshooting session; consumes one call entitlement. OCC-guarded on SupportPackage.version."
    roles: [Parent, Consultant]
    code: 201
    input: [session_type, scheduled_start, scheduled_end, expected_package_version]
    output: TroubleshootingSession
    side_effects:
      - "OCC: reject ERR_STALE_VERSION when expected_package_version != selected package.version"
      - "consumable_package_selector picks the package; package_id recorded"
      - "session_overlap_check (15-minute buffer, consultant calendar)"
      - "remaining_calls decremented by 1; increments SupportPackage.version by 1"
      - "package DEPLETED check re-evaluated"
  - method: GET
    path: "/sleep-consulting/cases/{id}/troubleshooting-sessions"
    description: "List TroubleshootingSessions of a case"
    roles: [PracticeAdmin, Consultant, Parent]
    code: 200
    input: ["limit?", "offset?"]
    output: "TroubleshootingSession[]"
    side_effects: []
  - method: POST
    path: "/sleep-consulting/troubleshooting-sessions/{sessionId}/complete"
    description: "Mark a session completed (Consultant assigned to the case)"
    roles: [Consultant]
    code: 200
    input: []
    output: TroubleshootingSession
    side_effects: ["SCHEDULED -> COMPLETED; entitlement stays consumed"]
  - method: POST
    path: "/sleep-consulting/troubleshooting-sessions/{sessionId}/cancel"
    description: "Cancel a scheduled session before it starts; releases the call entitlement when the package is ACTIVE"
    roles: [Parent, Consultant]
    code: 200
    input: []
    output: TroubleshootingSession
    side_effects: ["SCHEDULED -> CANCELLED", "compensating release: package.remaining_calls += 1 iff package.status == ACTIVE", "increments SupportPackage.version by 1 when a release occurs"]
  - method: POST
    path: "/sleep-consulting/cases/{id}/messages"
    description: "Send a support message; consumes one message entitlement"
    roles: [Parent]
    code: 201
    input: [body]
    output: Message
    side_effects: ["consumable_package_selector picks the package; package_id recorded", "remaining_messages decremented by 1", "package DEPLETED check re-evaluated"]
  - method: GET
    path: "/sleep-consulting/cases/{id}/messages"
    description: "List Messages of a case"
    roles: [PracticeAdmin, Consultant, Parent]
    code: 200
    input: ["limit?", "offset?"]
    output: "Message[]"
    side_effects: []
  - method: POST
    path: "/sleep-consulting/messages/{messageId}/respond"
    description: "Consultant first response; computes SLA breach and credit"
    roles: [Consultant]
    code: 200
    input: [response_body]
    output: Message
    side_effects: ["AWAITING_RESPONSE -> RESPONDED", "sla_breach_and_credit computed", "credit_granted_cents added to family.credit_balance_cents and package.sla_credit_total_cents when > 0"]
  - method: POST
    path: "/sleep-consulting/cases/{id}/refund-requests"
    description: "Request a refund (COOLING_OFF | GUARANTEE | PRO_RATA); subject package server-selected"
    roles: [Parent]
    code: 201
    input: [refund_type, "reason?"]
    output: RefundRequest
    side_effects: ["refund-subject package selected (latest starts_on among ACTIVE/DEPLETED/EXPIRED)", "refund_eligibility evaluated per type", "status = REQUESTED"]
  - method: GET
    path: "/sleep-consulting/cases/{id}/refund-requests"
    description: "List RefundRequests of a case"
    roles: [PracticeAdmin, Consultant, Parent]
    code: 200
    input: ["limit?", "offset?"]
    output: "RefundRequest[]"
    side_effects: []
  - method: POST
    path: "/sleep-consulting/refund-requests/{refundId}/approve"
    description: "Approve a refund; computes amount and grants family credit"
    roles: [PracticeAdmin]
    code: 200
    input: []
    output: RefundRequest
    side_effects: ["REQUESTED -> APPROVED", "refund_amount_cents computed (variant by refund_type)", "family.credit_balance_cents += amount_cents"]
  - method: POST
    path: "/sleep-consulting/refund-requests/{refundId}/deny"
    description: "Deny a refund with a reason"
    roles: [PracticeAdmin]
    code: 200
    input: [denial_reason]
    output: RefundRequest
    side_effects: ["REQUESTED -> DENIED"]
  - method: POST
    path: "/sleep-consulting/refund-requests/{refundId}/pay"
    description: "Pay an approved refund; fires the refund-paid cascade"
    roles: [PracticeAdmin]
    code: 200
    input: []
    output: RefundRequest
    side_effects: ["APPROVED -> PAID", "case -> CLOSED_REFUNDED (link 1)", "plans CANCELLED, packages CLOSED_EARLY, scheduled sessions CANCELLED (link 2)", "consultant.active_case_count recomputed"]
  - method: POST
    path: "/sleep-consulting/group-courses"
    description: "Create a GroupCourse"
    roles: [PracticeAdmin]
    code: 201
    input: [consultant_id, title, starts_on, capacity, price_cents]
    output: GroupCourse
    side_effects: ["enrolled_count = 0"]
  - method: GET
    path: "/sleep-consulting/group-courses"
    description: "List GroupCourses"
    roles: [PracticeAdmin, Consultant, Parent]
    code: 200
    input: ["consultant_id?", "limit?", "offset?"]
    output: "GroupCourse[]"
    side_effects: []
  - method: GET
    path: "/sleep-consulting/group-courses/{courseId}"
    description: "Get a GroupCourse (recomputes enrolled_count)"
    roles: [PracticeAdmin, Consultant, Parent]
    code: 200
    input: []
    output: GroupCourse
    side_effects: []
  - method: POST
    path: "/sleep-consulting/group-courses/{id}/enrollments"
    description: "Enroll a GROUP_COURSE case; ENROLLED when a seat is free, WAITLISTED when full"
    roles: [Parent]
    code: 201
    input: [case_id]
    output: CourseEnrollment
    side_effects: ["capacity check: enrolled_count < capacity -> ENROLLED else WAITLISTED", "course.enrolled_count recomputed"]
  - method: GET
    path: "/sleep-consulting/group-courses/{id}/enrollments"
    description: "List enrollments of a course"
    roles: [PracticeAdmin, Consultant, Parent]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "CourseEnrollment[]"
    side_effects: []
  - method: GET
    path: "/sleep-consulting/cases/{id}/enrollments"
    description: "List enrollments of a case"
    roles: [PracticeAdmin, Consultant, Parent]
    code: 200
    input: ["limit?", "offset?"]
    output: "CourseEnrollment[]"
    side_effects: []
  - method: POST
    path: "/sleep-consulting/enrollments/{enrollmentId}/cancel"
    description: "Cancel an enrollment (ENROLLED -> CANCELLED with waitlist promotion; WAITLISTED -> WITHDRAWN)"
    roles: [Parent, PracticeAdmin]
    code: 200
    input: []
    output: CourseEnrollment
    side_effects: ["waitlist_promotion runs when a seat is freed"]
  - method: POST
    path: "/sleep-consulting/_clock/set_current_utc"
    description: "Set the logical clock (ISO 8601 UTC). Startup default is exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time. Advancing past a package's expires_on transitions that package ACTIVE -> EXPIRED (never reverts)."
    roles: [PracticeAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string, expired_package_ids: string[] }"
    side_effects: ["package expiry sweep per §1.2 SupportPackage"]

# =============================================================================
# §1.6 Error Code Catalog (38 codes)
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role unrecognized" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for the endpoint, or Parent/Consultant identity does not match the target resource's owner/assignee" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum member, integer range violation, bad time range, future log_date, or apply_credit_cents exceeding balance/cap" }
  - { id: ERR_CONSULTANT_NOT_FOUND, http: 404, condition: "consultantId / consultant_id does not exist" }
  - { id: ERR_FAMILY_NOT_FOUND, http: 404, condition: "familyId / family_id does not exist" }
  - { id: ERR_CASE_NOT_FOUND, http: 404, condition: "caseId / case_id does not exist" }
  - { id: ERR_QUESTIONNAIRE_NOT_FOUND, http: 404, condition: "questionnaireId does not exist" }
  - { id: ERR_PLAN_NOT_FOUND, http: 404, condition: "planId does not exist" }
  - { id: ERR_PACKAGE_NOT_FOUND, http: 404, condition: "packageId does not exist" }
  - { id: ERR_LOG_NOT_FOUND, http: 404, condition: "logId does not exist (or does not belong to an existing case path)" }
  - { id: ERR_SESSION_NOT_FOUND, http: 404, condition: "sessionId does not exist" }
  - { id: ERR_MESSAGE_NOT_FOUND, http: 404, condition: "messageId does not exist" }
  - { id: ERR_REFUND_REQUEST_NOT_FOUND, http: 404, condition: "refundId does not exist" }
  - { id: ERR_COURSE_NOT_FOUND, http: 404, condition: "courseId does not exist" }
  - { id: ERR_ENROLLMENT_NOT_FOUND, http: 404, condition: "enrollmentId does not exist" }
  - { id: ERR_CASE_INVALID_STATE, http: 409, condition: "Case not in a status that permits the operation (plan create requires PLANNING/ACTIVE_SUPPORT/NEEDS_ATTENTION; log submit requires ACTIVE_SUPPORT/NEEDS_ATTENTION; complete requires ACTIVE_SUPPORT with clean children; refund requires ACTIVE_SUPPORT/NEEDS_ATTENTION/COMPLETED)" }
  - { id: ERR_PLAN_INVALID_STATE, http: 409, condition: "Resume requires plan.status == NEEDS_ADJUSTMENT" }
  - { id: ERR_PACKAGE_NOT_ACTIVE, http: 409, condition: "No consumable package (ACTIVE and within [starts_on, expires_on]) for session booking or message send" }
  - { id: ERR_SESSION_INVALID_STATE, http: 409, condition: "Complete/cancel requires SCHEDULED; cancel additionally requires the clock strictly before scheduled_start" }
  - { id: ERR_REFUND_INVALID_STATE, http: 409, condition: "Approve/deny require REQUESTED; pay requires APPROVED" }
  - { id: ERR_MESSAGE_ALREADY_RESPONDED, http: 409, condition: "Respond requires message.status == AWAITING_RESPONSE" }
  - { id: ERR_ENROLLMENT_INVALID_STATE, http: 409, condition: "Cancel requires ENROLLED or WAITLISTED; terminal enrollments reject" }
  - { id: ERR_QUESTIONNAIRE_ALREADY_REVIEWED, http: 409, condition: "Review requires questionnaire.status == SUBMITTED" }
  - { id: ERR_LOG_ALREADY_REVIEWED, http: 409, condition: "Review requires log.review_status == PENDING_REVIEW" }
  - { id: ERR_METHOD_NOT_AGE_APPROPRIATE, http: 422, condition: "Requested method not in the allowed set for the case's current age_band" }
  - { id: ERR_SCHEDULING_CONFLICT, http: 409, condition: "New session violates the 15-minute buffer against an existing SCHEDULED session on the same consultant's calendar" }
  - { id: ERR_FOLLOW_UP_WINDOW_CLOSED, http: 422, condition: "FOLLOW_UP purchase later than completed_at + 180 days" }
  - { id: ERR_ENROLLMENT_CLOSED, http: 422, condition: "Enrollment on or after the course starts_on date" }
  - { id: ERR_DUPLICATE_LOG, http: 409, condition: "A log already exists for (case_id, log_date)" }
  - { id: ERR_ALREADY_ENROLLED, http: 409, condition: "A non-terminal enrollment already exists for (course_id, case_id)" }
  - { id: ERR_PACKAGE_WINDOW_OVERLAP, http: 409, condition: "New package coverage (closed date interval) overlaps an existing ACTIVE package of the case" }
  - { id: ERR_REFUND_ALREADY_PENDING, http: 409, condition: "A refund in REQUESTED or APPROVED already exists for the case" }
  - { id: ERR_CONSULTANT_AT_CAPACITY, http: 409, condition: "consultant.active_case_count >= consultant.max_active_cases at case creation" }
  - { id: ERR_ENTITLEMENT_EXHAUSTED, http: 422, condition: "remaining_calls == 0 at session booking or remaining_messages == 0 at message send" }
  - { id: ERR_REFUND_NOT_ELIGIBLE, http: 422, condition: "Eligibility predicate for the requested refund_type is false (per calculations.refund_eligibility)" }
  - { id: ERR_DELIVERY_MODE_MISMATCH, http: 422, condition: "Package purchase requires delivery_mode ONE_ON_ONE; course enrollment requires GROUP_COURSE" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_case_version != case.version at plan creation, or expected_package_version != selected package.version at session booking" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated client-portal visitor; may only self-register a family"
    identity: opaque
    exclusive_operations:
      - "POST /sleep-consulting/families — register a ClientFamily"
    shared_operations: []
  - name: Parent
    description: "Parent/guardian customer; owns one ClientFamily and acts on its own cases"
    identity: "entity_backed:ClientFamily"
    exclusive_operations:
      - "POST /sleep-consulting/cases/{caseId}/questionnaire — submit intake questionnaire"
      - "POST /sleep-consulting/cases/{caseId}/logs — submit nightly log"
      - "POST /sleep-consulting/cases/{caseId}/messages — send message"
      - "POST /sleep-consulting/cases/{caseId}/refund-requests — request refund"
      - "POST /sleep-consulting/group-courses/{courseId}/enrollments — enroll own case"
    shared_operations:
      - "POST /sleep-consulting/cases — open case (own family only; shared with PracticeAdmin)"
      - "POST /sleep-consulting/cases/{caseId}/packages — purchase package (own case; shared with PracticeAdmin)"
      - "POST /sleep-consulting/cases/{caseId}/troubleshooting-sessions — book session (own case; shared with Consultant)"
      - "POST /sleep-consulting/troubleshooting-sessions/{sessionId}/cancel — cancel session (own case; shared with Consultant)"
      - "POST /sleep-consulting/enrollments/{enrollmentId}/cancel — cancel own enrollment (shared with PracticeAdmin)"
      - "GET reads of own family/cases/children (shared with Consultant and PracticeAdmin)"
  - name: Consultant
    description: "Certified sleep consultant; performs clinical work on assigned cases"
    identity: "entity_backed:Consultant"
    exclusive_operations:
      - "POST /sleep-consulting/questionnaires/{questionnaireId}/review — review questionnaire"
      - "POST /sleep-consulting/cases/{caseId}/plans — create/supersede plan"
      - "POST /sleep-consulting/plans/{planId}/resume — resume plan"
      - "POST /sleep-consulting/cases/{caseId}/complete — complete case"
      - "POST /sleep-consulting/logs/{logId}/review — review log"
      - "POST /sleep-consulting/messages/{messageId}/respond — respond to message"
      - "POST /sleep-consulting/troubleshooting-sessions/{sessionId}/complete — complete session"
    shared_operations:
      - "POST /sleep-consulting/cases/{caseId}/troubleshooting-sessions and .../cancel (shared with Parent)"
      - "GET reads (shared with Parent and PracticeAdmin)"
  - name: PracticeAdmin
    description: "Practice operator; manages consultants, courses, refunds, and the logical clock; no clinical operations"
    identity: opaque
    exclusive_operations:
      - "POST /sleep-consulting/consultants — create consultant"
      - "POST /sleep-consulting/group-courses — create course"
      - "POST /sleep-consulting/refund-requests/{refundId}/approve | /deny | /pay — refund decisions"
      - "POST /sleep-consulting/_clock/set_current_utc — advance the logical clock"
    shared_operations:
      - "POST /sleep-consulting/cases and .../packages (shared with Parent)"
      - "POST /sleep-consulting/enrollments/{enrollmentId}/cancel (shared with Parent)"
      - "GET reads (shared with Parent and Consultant)"
