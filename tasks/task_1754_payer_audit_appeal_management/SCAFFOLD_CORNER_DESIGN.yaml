  # ===================================================================
  # Section: endpoints
  # ===================================================================
  - section: endpoints
    instances:
      - name: list_pagination_envelope_and_defaults
        claim_type: listing
        grounds: ["response_envelope", "endpoints[GET /audit-cases]"]
        distinguishing_aspect: "Pagination contract: default limit 10; limit=2 returns 2 items with total_count 3 and has_more true; offset=2 returns the last item with has_more false."
        test_recipe:
          setup: ["one payer with three audit cases"]
          setup_api_calls:
            - { call: "POST /payers", payload: { name: "P1", payer_type: "RAC", records_submission_days: 30, l1_deadline_days: 30, l2_deadline_days: 30, l3_deadline_days: 30, l4_deadline_days: 30, l5_deadline_days: 30, external_review_deadline_days: 30, concurrent_audit_cap: 10, hold_levels: [], interest_rate_bps_tier1: 100, interest_rate_bps_tier2: 200, interest_cap_pct: 25 }, as: RevenueCycleAdmin, captures: { p1: $.data.id } }
            - { call: "POST /audit-cases", payload: { payer_id: "${p1}", audit_type: "RAC_COMPLEX", received_at: "2026-08-01T00:00:00Z" }, as: HIMCoordinator }
            - { call: "POST /audit-cases", payload: { payer_id: "${p1}", audit_type: "RAC_AUTOMATED", received_at: "2026-08-02T00:00:00Z" }, as: HIMCoordinator }
            - { call: "POST /audit-cases", payload: { payer_id: "${p1}", audit_type: "TARGETED_PROBE", received_at: "2026-08-03T00:00:00Z" }, as: HIMCoordinator }
          trigger:
            - { call: "GET /audit-cases", payload: { limit: 2, offset: 0 }, as: Any }
            - { call: "GET /audit-cases", payload: { limit: 2, offset: 2 }, as: Any }
          assert:
            - "page 1: 2 items, total_count == 3, has_more == true"
            - "page 2: 1 item, total_count == 3, has_more == false"

      - name: list_filters_status_and_payer
        claim_type: listing
        grounds: ["endpoints[GET /audit-cases]"]
        distinguishing_aspect: "Filter composition: payer_id + status together narrow the list; the other payer's case never leaks in."
        test_recipe:
          setup: ["payer A with one RECEIVED case and one DETERMINATION_ISSUED case; payer B with one RECEIVED case"]
          setup_api_calls:
