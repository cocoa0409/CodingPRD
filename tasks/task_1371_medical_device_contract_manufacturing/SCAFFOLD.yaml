    roles: [QualityManager]
    code: 200
    input: []
    output: ValidationProtocol
    side_effects: ["status advances (IQ_REVIEW->OQ_EXECUTION, OQ_REVIEW->PQ_EXECUTION, PQ_REVIEW->VALIDATED)", "<phase>_approver_user_id = X-User-ID", "on VALIDATED: validated_at=now, revalidation_due_at=+36mo"]

  - method: POST
    path: "/api/validation-protocols/{id}/reject-phase"
    description: "Reject current review phase back to execution (clears that phase's executor)"
    roles: [QualityManager]
    code: 200
    input: []
    output: ValidationProtocol
    side_effects: ["status -> *_EXECUTION", "<phase>_executor_user_id = null"]

