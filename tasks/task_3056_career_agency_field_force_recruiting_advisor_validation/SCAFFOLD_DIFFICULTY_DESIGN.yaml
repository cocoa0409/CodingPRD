              captures: { per_fin_id: $.data.id }
          assert:
            - "PersistencyRecord.${per_fin_id}.persistency_pct == 80.00 and persistency_tier == INELIGIBLE"
            - "PersistencyRecord.${per_fin_id}.renewal_rate_pct == 0.000 and renewal_commission_cents == 0"
            - "Advisor.${adv_rep_id}.renewal_commission_cents == 0"
            - "Advisor.${adv_rep_id}.contract_status == AT_RISK and validation_posture == AT_RISK"
            - "PersistencyRecord.${per_fin_id}.renewal_commission_cents != 42000"

  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: recruiting_pipeline_cycle_and_reengagement
        grounds:
          - state_machines.RecruitingCandidate.OFFER_DECLINED_to_REENGAGED
          - state_machines.RecruitingCandidate.REENGAGED_to_SCREENED
          - state_machines.RecruitingCandidate.ASSESSMENT_PENDING_to_REJECTED
          - state_machines.SelectionAssessment.SCORED_to_SUPERSEDED
          - entities.RecruitingCandidate.fields.reengagement_count
        distinguishing_aspect: |
          RecruitingCandidate is cyclic AND self-referential: OFFER_DECLINED -> REENGAGED ->
          SCREENED -> ... -> OFFER_EXTENDED -> OFFER_DECLINED closes a loop, and each
          traversal supersedes the prior cycle's SCORED assessment, so the second
          ASSESSED state is reached only through a newly created assessment.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One district office and one REFERRAL candidate that has been screened, assessed and offered once, then declined."
          setup_api_calls:
            - call: "POST /agency/district-offices"
              payload: { office_code: "DO-401", name: "Lakeshore District", region_code: "MW", state_code: "WI", override_rate_pct: 0.03, override_cap_cents: 300000 }
              as: ManagingDirector
              captures: { office_id: $.data.id }
            - call: "POST /agency/recruiting-candidates"
              payload: { full_name: "Morgan Cyclic", source_channel: "REFERRAL", district_office_id: "${office_id}", notes: "cycle arm" }
              as: RecruitingOfficer
              captures: { cand_id: $.data.id }
            - call: "POST /agency/recruiting-candidates/${cand_id}/screen"
              payload: {}
              as: RecruitingOfficer
            - call: "POST /agency/recruiting-candidates/${cand_id}/schedule-assessment"
              payload: { assessment_version: "V2", scheduled_date: "2026-09-02T00:00:00Z" }
              as: RecruitingOfficer
              captures: { asm_1_id: $.data.id }
            - call: "POST /agency/selection-assessments/${asm_1_id}/score"
              payload: { raw_score: 84, competency_scores: { MARKET_KNOWLEDGE: 8, RELATIONSHIP: 8, RESILIENCE: 7, ETHICS: 9 } }
              as: RecruitingOfficer
            - call: "POST /agency/recruiting-candidates/${cand_id}/advance-to-interview"
              payload: {}
              as: RecruitingOfficer
            - call: "POST /agency/recruiting-candidates/${cand_id}/extend-offer"
              payload: {}
              as: DistrictDirector
            - call: "POST /agency/recruiting-candidates/${cand_id}/decline-offer"
              payload: {}
              as: RecruitingOfficer
