              captures: { cook_v1: "$.data.version" }
            - call: POST /onboarding-documents
              payload: { cook_id: "${cook_id}", doc_type: "KITCHEN_INSPECTION", expected_cook_version: "${cook_v1}", kitchen_type_claimed: "HOME_COTTAGE", inspection_date: "2026-06-01" }
              as: Cook
              as_user_id: "${cook_id}"
              captures: { insp_doc_id: "$.data.id" }
          trigger:
            - call: GET /onboarding-documents
              payload: { cook_id: "${cook_id}", limit: 10, offset: 0 }
              as: ComplianceReviewer
              as_user_id: rev-1
              captures: { all_first_id: "$.data[0].id" }
            - call: GET /onboarding-documents
              payload: { cook_id: "${cook_id}", doc_type: "FOOD_HANDLER_CERT", limit: 10, offset: 0 }
              as: ComplianceReviewer
              as_user_id: rev-1
              captures: { cert_only_id: "$.data[0].id" }
          assert:
            - "unfiltered-by-type call: HTTP 200, total_count == 2, has_more == false"
            - "type-filtered call: total_count == 1 and ${cert_only_id} == ${cert_doc_id}"
            - "the KITCHEN_INSPECTION row ${insp_doc_id} is absent from the type-filtered page"
            - "${all_first_id} resolves to one of {${cert_doc_id}, ${insp_doc_id}}"

      - name: unknown_path_id_returns_entity_specific_not_found
        claim_type: not_found
        grounds:
          - endpoints.GET /state-policies/{id}
          - endpoints.GET /cooks/{id}
          - endpoints.GET /onboarding-documents/{id}
          - endpoints.GET /menu-items/{id}
          - endpoints.GET /production-windows/{id}
          - endpoints.GET /delivery-zones/{id}
          - endpoints.GET /pickup-hubs/{id}
          - endpoints.GET /orders/{id}
          - endpoints.GET /safety-incidents/{id}
          - endpoints.GET /payout-statements/{id}
          - endpoints.GET /refund-events/{id}
        distinguishing_aspect: >
          Eleven peer entities each own a distinct 404 code, and a generic "not found" is not
          acceptable: the eleven single-resource reads must map to ERR_STATE_POLICY_NOT_FOUND,
          ERR_COOK_NOT_FOUND, ERR_DOCUMENT_NOT_FOUND, ERR_MENU_ITEM_NOT_FOUND, ERR_WINDOW_NOT_FOUND,
          ERR_ZONE_NOT_FOUND, ERR_HUB_NOT_FOUND, ERR_ORDER_NOT_FOUND, ERR_INCIDENT_NOT_FOUND,
          ERR_STATEMENT_NOT_FOUND and ERR_REFUND_NOT_FOUND respectively, all at HTTP 404.
        test_recipe:
          setup:
            - "Empty system. The probed UUID 00000000-0000-0000-0000-0000000000ff matches no row of any entity."
          setup_api_calls: []
          trigger:
            - call: GET /state-policies/00000000-0000-0000-0000-0000000000ff
              payload: {}
              as: PlatformAdmin
              captures: { e_sp: "$.data.error_id" }
            - call: GET /cooks/00000000-0000-0000-0000-0000000000ff
              payload: {}
              as: PlatformAdmin
              captures: { e_cook: "$.data.error_id" }
            - call: GET /onboarding-documents/00000000-0000-0000-0000-0000000000ff
              payload: {}
              as: PlatformAdmin
              captures: { e_doc: "$.data.error_id" }
            - call: GET /menu-items/00000000-0000-0000-0000-0000000000ff
              payload: {}
              as: PlatformAdmin
              captures: { e_mi: "$.data.error_id" }
            - call: GET /production-windows/00000000-0000-0000-0000-0000000000ff
              payload: {}
              as: PlatformAdmin
              captures: { e_pw: "$.data.error_id" }
            - call: GET /delivery-zones/00000000-0000-0000-0000-0000000000ff
              payload: {}
              as: PlatformAdmin
              captures: { e_dz: "$.data.error_id" }
            - call: GET /pickup-hubs/00000000-0000-0000-0000-0000000000ff
              payload: {}
              as: PlatformAdmin
              captures: { e_hub: "$.data.error_id" }
            - call: GET /orders/00000000-0000-0000-0000-0000000000ff
              payload: {}
              as: PlatformAdmin
              captures: { e_ord: "$.data.error_id" }
            - call: GET /safety-incidents/00000000-0000-0000-0000-0000000000ff
              payload: {}
              as: PlatformAdmin
              captures: { e_inc: "$.data.error_id" }
            - call: GET /payout-statements/00000000-0000-0000-0000-0000000000ff
              payload: {}
              as: PlatformAdmin
              captures: { e_ps: "$.data.error_id" }
            - call: GET /refund-events/00000000-0000-0000-0000-0000000000ff
              payload: {}
              as: PlatformAdmin
              captures: { e_rf: "$.data.error_id" }
          assert:
            - "every call returns HTTP 404 with response_type == error"
            - "${e_sp} == ERR_STATE_POLICY_NOT_FOUND"
            - "${e_cook} == ERR_COOK_NOT_FOUND"
            - "${e_doc} == ERR_DOCUMENT_NOT_FOUND"
            - "${e_mi} == ERR_MENU_ITEM_NOT_FOUND"
            - "${e_pw} == ERR_WINDOW_NOT_FOUND"
            - "${e_dz} == ERR_ZONE_NOT_FOUND"
            - "${e_hub} == ERR_HUB_NOT_FOUND"
            - "${e_ord} == ERR_ORDER_NOT_FOUND"
            - "${e_inc} == ERR_INCIDENT_NOT_FOUND"
            - "${e_ps} == ERR_STATEMENT_NOT_FOUND"
            - "${e_rf} == ERR_REFUND_NOT_FOUND"

      - name: body_foreign_keys_validated_left_to_right_not_found
        claim_type: parent_relationships
        grounds:
          - entities.OnboardingDocument.fields.cook_id
          - entities.PickupHub.fields.delivery_zone_id
          - validations[priority=7]
          - complexity_profile.entity_topology
        distinguishing_aspect: >
          In a flat topology every parent link travels in the body, so FK integrity is a body-level
          check at priority 7 - before any state or OCC check. A document submitted for an unknown
          cook_id must fail with ERR_COOK_NOT_FOUND rather than ERR_STALE_COOK_VERSION even though
          the version it carries cannot possibly match a non-existent cook, and a hub created under
          an unknown zone must fail with ERR_ZONE_NOT_FOUND.
        test_recipe:
          setup:
            - "StatePolicy CA exists; Cook Dara exists in CA at version 1 (its version is captured for the OCC field)."
            - "No DeliveryZone exists."
          setup_api_calls:
            - call: POST /state-policies
              payload: { state_code: "CA", cottage_food_annual_cap_cents: 5000000, allowed_kitchen_types: ["HOME_COTTAGE", "HOME_INSPECTED", "COMMERCIAL_SHARED"], tcs_requires_commercial_kitchen: true, max_shelf_life_days_non_refrigerated: 14, label_required_fields: ["cook_name", "ingredients", "allergens", "net_weight", "cottage_food_disclaimer"], cert_validity_max_days: 1825 }
              as: PlatformAdmin
            - call: POST /cooks
              payload: { legal_name: "Dara Osei", email: "dara@example.com", state_code: "CA", claimed_kitchen_type: "HOME_COTTAGE" }
              as: Anonymous
              captures: { cook_id: "$.data.id", cook_v0: "$.data.version" }
          trigger:
            - call: POST /onboarding-documents
              payload: { cook_id: "00000000-0000-0000-0000-0000000000ff", doc_type: "FOOD_HANDLER_CERT", expected_cook_version: "${cook_v0}", certificate_number: "FH-0001", issuing_authority: "CA DPH", issued_on: "2026-01-15", expires_on: "2028-01-15" }
              as: PlatformAdmin
              captures: { e_fk_cook: "$.data.error_id" }
            - call: POST /pickup-hubs
              payload: { delivery_zone_id: "00000000-0000-0000-0000-0000000000ff", name: "Ghost Hub", address: "1 Nowhere St", slot_capacity_orders: 4, hub_window_start_at: "2026-08-08T15:00:00Z", hub_window_end_at: "2026-08-08T19:00:00Z" }
              as: PlatformAdmin
              captures: { e_fk_zone: "$.data.error_id" }
          assert:
            - "first trigger: HTTP 404 and ${e_fk_cook} == ERR_COOK_NOT_FOUND (not ERR_STALE_COOK_VERSION)"
            - "second trigger: HTTP 404 and ${e_fk_zone} == ERR_ZONE_NOT_FOUND"
            - "no OnboardingDocument and no PickupHub row was created"
            - "Cook.${cook_id}.version is still 1 (a rejected write never bumps the parent version)"

  # ===========================================================================
  # SECTION 2 - STATE MACHINES (1.2): initial states, valid transitions,
  # precondition enforcement, side-effect execution, invalid transitions,
  # terminal lockdown, idempotency, plus the `parallel` shape and the cascade
  # side-effect patterns.
  # ===========================================================================
  - section: state_machines
    instances:

      - name: newly_created_rows_start_in_declared_initial_state
        claim_type: initial_state
        grounds:
          - state_machines.Cook.onboarding_status.initial_state
          - state_machines.Cook.compliance_standing.initial_state
          - state_machines.OnboardingDocument.initial_state
          - state_machines.MenuItem.initial_state
          - state_machines.PickupHub.initial_state
          - state_machines.SafetyIncident.initial_state
        distinguishing_aspect: >
          Six state dimensions are seeded in a single pass with no transition ever requested: a Cook
          starts DRAFT on the onboarding dimension AND CLEAR on the independent standing dimension,
          a document starts SUBMITTED, a menu item DRAFT, a hub OPEN, an incident INTAKE. The pair
          on Cook is the interesting part: two dimensions on one row, each at its own initial value.
        test_recipe:
          setup:
            - "StatePolicy CA exists; one DOOR_DELIVERY zone exists to hang a hub on."
            - "Logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: POST /state-policies
              payload: { state_code: "CA", cottage_food_annual_cap_cents: 5000000, allowed_kitchen_types: ["HOME_COTTAGE", "HOME_INSPECTED", "COMMERCIAL_SHARED"], tcs_requires_commercial_kitchen: true, max_shelf_life_days_non_refrigerated: 14, label_required_fields: ["cook_name", "ingredients", "allergens", "net_weight", "cottage_food_disclaimer"], cert_validity_max_days: 1825 }
              as: PlatformAdmin
              captures: { sp_id: "$.data.id" }
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: POST /delivery-zones
              payload: { state_policy_id: "${sp_id}", zone_code: "CA-HUB-9", state_code: "CA", service_mode: "HUB_PICKUP", postal_codes: ["94110"], max_cold_chain_minutes: 240 }
              as: PlatformAdmin
              captures: { dz_id: "$.data.id" }
          trigger:
            - call: POST /cooks
              payload: { legal_name: "Dara Osei", email: "dara@example.com", state_code: "CA", claimed_kitchen_type: "HOME_COTTAGE" }
              as: Anonymous
              captures: { cook_id: "$.data.id", cook_v0: "$.data.version" }
            - call: POST /onboarding-documents
              payload: { cook_id: "${cook_id}", doc_type: "FOOD_HANDLER_CERT", expected_cook_version: "${cook_v0}", certificate_number: "FH-3300", issuing_authority: "CA DPH", issued_on: "2026-01-15", expires_on: "2028-01-15" }
              as: Cook
              as_user_id: "${cook_id}"
              captures: { doc_id: "$.data.id" }
            - call: POST /menu-items
              payload: { cook_id: "${cook_id}", name: "Plain Scone", food_category: "BAKED_NON_TCS", allergens: ["WHEAT"], allergen_free_attested: false, shelf_life_days: 5, requires_refrigeration: false, handoff_mode: "BATCH_COOK_AND_CHILL", unit_price_cents: 400, label_fields: ["cook_name", "ingredients", "allergens", "net_weight", "cottage_food_disclaimer"] }
              as: Cook
              as_user_id: "${cook_id}"
              captures: { mi_id: "$.data.id" }
            - call: POST /pickup-hubs
              payload: { delivery_zone_id: "${dz_id}", name: "Mission Hub", address: "1 Valencia St", slot_capacity_orders: 4, hub_window_start_at: "2026-08-08T15:00:00Z", hub_window_end_at: "2026-08-08T19:00:00Z" }
              as: PlatformAdmin
              captures: { hub_id: "$.data.id" }
            - call: POST /safety-incidents
              payload: { cook_id: "${cook_id}", subject_type: "COOK", category: "LABEL_MISSING", severity: "MINOR", description: "packaging photo lacked the disclaimer", occurred_at: "2026-07-30T12:00:00Z" }
              as: Diner
              as_user_id: diner-x
              captures: { inc_id: "$.data.id" }
          assert:
            - "Cook.${cook_id}.onboarding_status == DOCS_SUBMITTED after the document, but was DRAFT in the POST /cooks response"
            - "Cook.${cook_id}.compliance_standing == CLEAR (the second dimension never moved)"
            - "OnboardingDocument.${doc_id}.review_status == SUBMITTED"
            - "OnboardingDocument.${doc_id}.reviewed_by_user_id == null AND reviewed_at == null AND superseded_by_document_id == null"
            - "MenuItem.${mi_id}.review_status == DRAFT AND revision_round == 0"
            - "PickupHub.${hub_id}.status == OPEN AND assigned_order_count == 0"
            - "SafetyIncident.${inc_id}.status == INTAKE AND severity_points == 5 AND triaged_by_user_id == null"
            - "SafetyIncident.${inc_id}.reported_by_user_id == diner-x"

      - name: order_and_payment_dimensions_start_placed_and_authorized
        claim_type: initial_state
        grounds:
          - state_machines.Order.fulfillment_status.initial_state
          - state_machines.Order.payment_status.initial_state
        excluded_because:
          difficulty_instance: non_linear_state_machine / order_fulfillment_and_payment_dimensions_move_independently
          rationale: >
            That instance places an order and asserts fulfillment_status == PLACED with payment_status
            == AUTHORIZED as its baseline before driving each dimension separately, so both initial
            states of the Order row are already pinned there; repeating the creation-only assertion
            would add no discriminating power.

      - name: document_supersede_writes_back_pointer_and_reverts_cook_dimension
        claim_type: side_effect_execution
        grounds:
          - state_machines.OnboardingDocument.SUBMITTED_to_SUPERSEDED
          - state_machines.Cook.DOCS_SUBMITTED_to_DOCS_SUBMITTED
          - entities.OnboardingDocument.fields.superseded_by_document_id
          - endpoints.POST /onboarding-documents
        distinguishing_aspect: >
          The only self-referential FK in the model. Re-submitting the same doc_type must (a) push the
          prior row to SUPERSEDED, (b) write superseded_by_document_id on the OLD row pointing at the
          NEW one - never the reverse - and (c) keep the Cook on the DOCS_SUBMITTED self-loop while
          bumping Cook.version a second time. The supersede chain is then walkable through the
          superseded_by_document_id filter on the list endpoint.
        test_recipe:
          setup:
            - "StatePolicy CA exists; logical clock at 2026-08-01T00:00:00Z."
            - "Cook Dara exists and has submitted FOOD_HANDLER_CERT #1 (review_status SUBMITTED); Cook.version is 2."
          setup_api_calls:
            - call: POST /state-policies
              payload: { state_code: "CA", cottage_food_annual_cap_cents: 5000000, allowed_kitchen_types: ["HOME_COTTAGE", "HOME_INSPECTED", "COMMERCIAL_SHARED"], tcs_requires_commercial_kitchen: true, max_shelf_life_days_non_refrigerated: 14, label_required_fields: ["cook_name", "ingredients", "allergens", "net_weight", "cottage_food_disclaimer"], cert_validity_max_days: 1825 }
              as: PlatformAdmin
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: POST /cooks
              payload: { legal_name: "Dara Osei", email: "dara@example.com", state_code: "CA", claimed_kitchen_type: "HOME_COTTAGE" }
              as: Anonymous
              captures: { cook_id: "$.data.id", cook_v0: "$.data.version" }
            - call: POST /onboarding-documents
              payload: { cook_id: "${cook_id}", doc_type: "FOOD_HANDLER_CERT", expected_cook_version: "${cook_v0}", certificate_number: "FH-0001", issuing_authority: "CA DPH", issued_on: "2026-01-15", expires_on: "2028-01-15" }
              as: Cook
              as_user_id: "${cook_id}"
              captures: { cert1_id: "$.data.id" }
            - call: GET /cooks/${cook_id}
              payload: {}
              as: ComplianceReviewer
              as_user_id: rev-1
              captures: { cook_v1: "$.data.version" }
          trigger:
            - call: POST /onboarding-documents
              payload: { cook_id: "${cook_id}", doc_type: "FOOD_HANDLER_CERT", expected_cook_version: "${cook_v1}", certificate_number: "FH-0002", issuing_authority: "CA DPH", issued_on: "2026-02-01", expires_on: "2028-02-01" }
              as: Cook
              as_user_id: "${cook_id}"
              captures: { cert2_id: "$.data.id" }
            - call: GET /onboarding-documents
              payload: { superseded_by_document_id: "${cert2_id}", limit: 10, offset: 0 }
              as: ComplianceReviewer
              as_user_id: rev-1
              captures: { chain_head_id: "$.data[0].id" }
          assert:
            - "HTTP 201 on the second submission"
            - "OnboardingDocument.${cert1_id}.review_status == SUPERSEDED"
            - "OnboardingDocument.${cert1_id}.superseded_by_document_id == ${cert2_id}"
            - "OnboardingDocument.${cert2_id}.review_status == SUBMITTED AND superseded_by_document_id == null"
            - "Cook.${cook_id}.onboarding_status == DOCS_SUBMITTED (self-loop, not DRAFT)"
            - "Cook.${cook_id}.version == 3 (one bump per document write)"
            - "the filtered list returns exactly 1 row and ${chain_head_id} == ${cert1_id}"

      - name: document_second_review_rejected_as_already_reviewed
        claim_type: idempotency
        grounds:
          - state_machines.OnboardingDocument.SUBMITTED_to_VERIFIED
          - validations[priority=15].ERR_DOC_ALREADY_REVIEWED
          - errors.ERR_DOC_ALREADY_REVIEWED
        distinguishing_aspect: >
          Reviewing is not idempotent by design: the second identical VERIFY must be refused with
          ERR_DOC_ALREADY_REVIEWED (409) rather than silently re-stamping reviewed_by_user_id or
          reviewed_at, because a second reviewer's signature on an already-decided artifact would
          destroy the compliance audit trail.
        test_recipe:
          setup:
            - "StatePolicy CA exists; logical clock at 2026-08-01T00:00:00Z."
            - "Cook Dara has one SUBMITTED FOOD_HANDLER_CERT expiring 2028-01-15."
          setup_api_calls:
            - call: POST /state-policies
              payload: { state_code: "CA", cottage_food_annual_cap_cents: 5000000, allowed_kitchen_types: ["HOME_COTTAGE", "HOME_INSPECTED", "COMMERCIAL_SHARED"], tcs_requires_commercial_kitchen: true, max_shelf_life_days_non_refrigerated: 14, label_required_fields: ["cook_name", "ingredients", "allergens", "net_weight", "cottage_food_disclaimer"], cert_validity_max_days: 1825 }
              as: PlatformAdmin
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: POST /cooks
              payload: { legal_name: "Dara Osei", email: "dara@example.com", state_code: "CA", claimed_kitchen_type: "HOME_COTTAGE" }
              as: Anonymous
              captures: { cook_id: "$.data.id", cook_v0: "$.data.version" }
            - call: POST /onboarding-documents
              payload: { cook_id: "${cook_id}", doc_type: "FOOD_HANDLER_CERT", expected_cook_version: "${cook_v0}", certificate_number: "FH-0001", issuing_authority: "CA DPH", issued_on: "2026-01-15", expires_on: "2028-01-15" }
              as: Cook
              as_user_id: "${cook_id}"
              captures: { cert_id: "$.data.id" }
          trigger:
            - call: POST /onboarding-documents/${cert_id}/review
              payload: { decision: "VERIFY", note: "first pass" }
              as: ComplianceReviewer
              as_user_id: rev-1
            - call: POST /onboarding-documents/${cert_id}/review
              payload: { decision: "VERIFY", note: "second pass" }
              as: ComplianceReviewer
              as_user_id: rev-3
              captures: { e_again: "$.data.error_id" }
          assert:
            - "first review: HTTP 200 and OnboardingDocument.${cert_id}.review_status == VERIFIED"
            - "OnboardingDocument.${cert_id}.reviewed_by_user_id == rev-1 and reviewed_at == 2026-08-01T00:00:00Z"
            - "second review: HTTP 409 and ${e_again} == ERR_DOC_ALREADY_REVIEWED"
            - "OnboardingDocument.${cert_id}.reviewed_by_user_id is still rev-1 (rev-3 left no trace)"
            - "Cook.${cook_id}.onboarding_status == DOCS_SUBMITTED (no inspection exists, so VERIFIED alone cannot reach VERIFIED)"

      - name: undeclared_transitions_rejected_across_document_cook_incident_and_menu_item
        claim_type: invalid_transitions
        grounds:
          - state_machines.OnboardingDocument.transitions
          - state_machines.Cook.compliance_standing.transitions
          - state_machines.SafetyIncident.transitions
          - state_machines.MenuItem.transitions
          - validations[priority=11]
        distinguishing_aspect: >
          Four different "the verb exists but not from here" rejections in one world, each mapping to
          its own entity-specific 409 code: VERIFY is a FOOD_HANDLER_CERT-only decision so it cannot
          be applied to a KITCHEN_INSPECTION; REINSTATE is declared only from SUSPENDED; triage is
          declared only from INTAKE; and review is declared only from UNDER_REVIEW, so a DRAFT item
          that never got submitted cannot be approved.
        test_recipe:
          setup:
            - "StatePolicy CA exists; logical clock at 2026-08-01T00:00:00Z."
            - "Cook Dara (compliance_standing CLEAR) has a SUBMITTED KITCHEN_INSPECTION and a DRAFT MenuItem."
            - "One SafetyIncident on Dara in status INTAKE."
          setup_api_calls:
            - call: POST /state-policies
              payload: { state_code: "CA", cottage_food_annual_cap_cents: 5000000, allowed_kitchen_types: ["HOME_COTTAGE", "HOME_INSPECTED", "COMMERCIAL_SHARED"], tcs_requires_commercial_kitchen: true, max_shelf_life_days_non_refrigerated: 14, label_required_fields: ["cook_name", "ingredients", "allergens", "net_weight", "cottage_food_disclaimer"], cert_validity_max_days: 1825 }
              as: PlatformAdmin
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: POST /cooks
              payload: { legal_name: "Dara Osei", email: "dara@example.com", state_code: "CA", claimed_kitchen_type: "HOME_COTTAGE" }
              as: Anonymous
              captures: { cook_id: "$.data.id", cook_v0: "$.data.version" }
            - call: POST /onboarding-documents
              payload: { cook_id: "${cook_id}", doc_type: "KITCHEN_INSPECTION", expected_cook_version: "${cook_v0}", kitchen_type_claimed: "HOME_COTTAGE", inspection_date: "2026-06-01" }
              as: Cook
              as_user_id: "${cook_id}"
              captures: { insp_id: "$.data.id" }
            - call: POST /menu-items
              payload: { cook_id: "${cook_id}", name: "Plain Scone", food_category: "BAKED_NON_TCS", allergens: ["WHEAT"], allergen_free_attested: false, shelf_life_days: 5, requires_refrigeration: false, handoff_mode: "BATCH_COOK_AND_CHILL", unit_price_cents: 400, label_fields: ["cook_name", "ingredients", "allergens", "net_weight", "cottage_food_disclaimer"] }
              as: Cook
              as_user_id: "${cook_id}"
              captures: { mi_id: "$.data.id" }
            - call: POST /safety-incidents
              payload: { cook_id: "${cook_id}", subject_type: "COOK", category: "LABEL_MISSING", severity: "MINOR", description: "no disclaimer on the box", occurred_at: "2026-07-30T12:00:00Z" }
              as: Diner
              as_user_id: diner-x
              captures: { inc_id: "$.data.id" }
          trigger:
            - call: POST /onboarding-documents/${insp_id}/review
