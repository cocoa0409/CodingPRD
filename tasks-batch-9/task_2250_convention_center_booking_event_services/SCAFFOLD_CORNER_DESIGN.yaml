      - name: blackout_approve_releases_colliding_holds_only_where_it_collides
        claim_type: conditional_action
        grounds:
          - endpoints[POST /convention-center/maintenance-blackouts/{id}/approve]
          - state_machines.SpaceHold.CONFIRMED_to_RELEASED
          - entities.SpaceUnit.fields.active_blackout_count
        distinguishing_aspect: |
          The same action endpoint takes two different code paths on one call. A CONFIRMED
          hold on Ballroom B whose interval falls inside the capital-project window is
          released, while an equally CONFIRMED hold on Ballroom C is untouched, so the
          blanket interpretation of the cascade is caught by the surviving hold.
        test_recipe:
          setup:
            - "Ballroom B carries a CONFIRMED hold covering 2027-12-01 through 2027-12-10"
            - "Ballroom C carries a CONFIRMED hold covering 2027-06-09 through 2027-06-13"
            - "a PROPOSED CAPITAL_PROJECT blackout on Ballroom B covers 2027-12-01 through 2027-12-10 with buffer_days 2"
