              as: BankAdmin
              captures: { err: $.data.error_id }
          assert: ["403 ERR_FORBIDDEN_ROLE; no household persisted"]

      - name: warehouse_manager_cannot_submit_po
        claim_type: rbac_denial
        grounds: ["roles[WarehouseManager]"]
        distinguishing_aspect: "Submit is FinanceManager-exclusive: WarehouseManager -> 403 ERR_FORBIDDEN_ROLE (role check precedes the SoD check)."
        test_recipe:
          setup: ["Grant ACTIVE; PO DRAFT created by wm-user-1"]
          setup_api_calls:
            - call: "POST /grants"
              payload: { funder_name: "Funder RB", grant_code: "GR-RB", total_amount_cents: 100000, start_date: "2026-07-01T00:00:00Z", end_date: "2027-06-30T00:00:00Z" }
              as: FinanceManager
              captures: { g1: $.data.id }
            - call: "POST /purchase-orders"
              payload: { grant_id: "${g1}", vendor_name: "Wholesale Co", lines: [{ size_code: "SIZE_1", quantity: 1, unit_cost_cents: 1000 }] }
              as: WarehouseManager
              as_user_id: "wm-user-1"
              captures: { po: $.data.id }
          trigger:
            - call: "POST /purchase-orders/${po}/submit"
              payload: {}
              as: WarehouseManager
              as_user_id: "wm-user-2"
              captures: { err: $.data.error_id }
          assert: ["403 ERR_FORBIDDEN_ROLE; PO stays DRAFT"]

      - name: volunteer_cannot_create_shift
        claim_type: rbac_denial
        grounds: ["roles[Volunteer]"]
        distinguishing_aspect: "Shift creation is VolunteerCoordinator-exclusive: Volunteer -> 403 ERR_FORBIDDEN_ROLE."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /volunteer-shifts"
              payload: { title: "Nope", starts_at: "2026-08-10T09:00:00Z", ends_at: "2026-08-10T11:00:00Z", capacity: 3 }
              as: Volunteer
              captures: { err: $.data.error_id }
          assert: ["403 ERR_FORBIDDEN_ROLE"]

      - name: agency_coordinator_cannot_open_other_agency_event
        claim_type: rbac_denial
        grounds: ["roles[AgencyCoordinator]", "endpoints['POST /distribution-events/{id}/open']"]
        distinguishing_aspect: "Ownership binding: AgencyCoordinator with X-User-ID of agency B opening an event hosted by agency A -> 403 ERR_FORBIDDEN_ROLE."
        test_recipe:
          setup: ["Agencies A and B ACTIVE; event hosted by A, SCHEDULED"]
          setup_api_calls:
            - call: "POST /partner-agencies"
              payload: { name: "Agency A", agency_code: "AG-OA", contact_email: "a@x.org", children_served_monthly: 100, storage_capacity_units: 10000 }
              as: BankAdmin
              captures: { ag_a: $.data.id }
            - call: "POST /partner-agencies"
              payload: { name: "Agency B", agency_code: "AG-OB", contact_email: "b@x.org", children_served_monthly: 100, storage_capacity_units: 10000 }
              as: BankAdmin
              captures: { ag_b: $.data.id }
            - call: "POST /distribution-events"
              payload: { host_agency_id: "${ag_a}", site_name: "O-Site", starts_at: "2026-08-10T09:00:00Z", ends_at: "2026-08-10T12:00:00Z" }
              as: BankAdmin
              captures: { ev: $.data.id }
          trigger:
            - call: "POST /distribution-events/${ev}/open"
              payload: {}
              as: AgencyCoordinator
              as_user_id: "${ag_b}"
              captures: { err: $.data.error_id }
          assert: ["403 ERR_FORBIDDEN_ROLE; event stays SCHEDULED"]

  # ---------------------------------------------------------------------------
  - section: cross_cutting_layers
    instances:
      - name: inventory_adjustment_occ_stale_version
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[inventory-adjustment-stale-version]", "endpoints['POST /inventory/adjustments']"]
        distinguishing_aspect: "optimistic_concurrency layer: adjustment carrying the pre-write version (1) after a successful adjustment bumped it to 2 -> 412 ERR_STALE_VERSION; a fresh read then succeeds."
        test_recipe:
          setup: ["Inventory initialized (version 1)"]
          setup_api_calls:
            - call: "POST /inventory/initialize"
              payload: {}
              as: WarehouseManager
              captures: { inv_v: $.data.version }
          trigger:
            - call: "POST /inventory/adjustments"
              payload: { size_code: "SIZE_1", new_on_hand_units: 1000, reason: "cycle count", expected_inventory_version: "${inv_v}" }
              as: WarehouseManager
              captures: { inv_v2: $.data.version }
            - call: "POST /inventory/adjustments"
              payload: { size_code: "SIZE_1", new_on_hand_units: 900, reason: "recount", expected_inventory_version: "${inv_v}" }
              as: WarehouseManager
              captures: { err: $.data.error_id }
            - call: "POST /inventory/adjustments"
              payload: { size_code: "SIZE_1", new_on_hand_units: 900, reason: "recount", expected_inventory_version: "${inv_v2}" }
              as: WarehouseManager
              captures: { inv_v3: $.data.version }
          assert:
            - "First adjustment succeeds: version 1 -> 2, SIZE_1 on_hand == 1000"
            - "Second adjustment with stale expected_inventory_version 1 -> 412 ERR_STALE_VERSION; on_hand stays 1000"
            - "Retry with the fresh version 2 succeeds: on_hand == 900, version == 3"

      - name: derived_fields_reconcile_after_completion
        claim_type: derived_field_reconciliation
        grounds: [entities.DistributionEvent.fields.issued_total_units, entities.PartnerAgency.fields.active_allocated_units]
        distinguishing_aspect: "derived_field_reconciliation layer: after completion, event.issued_total_units == 45 and agency.active_allocated_units drops 100 -> 55; both recomputed in the same request's aftermath."
        test_recipe:
          setup: ["SIZE_1 on_hand 100 posted; agency (children 300); run published -> line 100; household 1 child ELIGIBLE; event OPEN with issuance 45; event LOCKED"]
          setup_api_calls:
            - { call: "POST /inventory/initialize", payload: {}, as: WarehouseManager }
            - call: "POST /intake-batches"
              payload: { donor_name: "Donor DR", lines: [{ size_code: "SIZE_1", quantity: 100 }] }
              as: WarehouseManager
              captures: { b1: $.data.id }
            - { call: "POST /intake-batches/${b1}/post", payload: {}, as: WarehouseManager }
            - call: "POST /partner-agencies"
              payload: { name: "Agency DR", agency_code: "AG-DR", contact_email: "dr@x.org", children_served_monthly: 300, storage_capacity_units: 100000 }
              as: BankAdmin
              captures: { ag: $.data.id }
            - call: "POST /allocation-runs"
              payload: { period: "2026-08" }
              as: BankAdmin
              captures: { r1: $.data.id }
            - { call: "POST /allocation-runs/${r1}/compute", payload: {}, as: BankAdmin }
            - { call: "POST /allocation-runs/${r1}/publish", payload: {}, as: BankAdmin }
            - call: "POST /households"
              payload: { household_code: "HH-DR", children_sizes: ["SIZE_1"], consent_on_file: true }
              as: PrivacyOfficer
              captures: { hh: $.data.id }
            - call: "PATCH /households/${hh}"
              payload: { eligibility_status: "ELIGIBLE" }
              as: PrivacyOfficer
            - call: "POST /distribution-events"
              payload: { host_agency_id: "${ag}", site_name: "DR-Site", starts_at: "2026-08-10T09:00:00Z", ends_at: "2026-08-10T12:00:00Z" }
              as: BankAdmin
              captures: { ev: $.data.id }
            - { call: "POST /distribution-events/${ev}/open", payload: {}, as: BankAdmin }
            - call: "POST /distribution-events/${ev}/issuances"
              payload: { household_id: "${hh}", lines: [{ size_code: "SIZE_1", quantity: 45 }] }
              as: PrivacyOfficer
            - { call: "POST /distribution-events/${ev}/lock", payload: {}, as: BankAdmin }
          trigger:
            - call: "POST /distribution-events/${ev}/complete"
              payload: {}
              as: BankAdmin
              captures: { ev_issued: $.data.issued_total_units }
            - call: "GET /partner-agencies/${ag}"
              payload: {}
              as: BankAdmin
              captures: { ag_active: $.data.active_allocated_units }
          assert:
            - "Event issued_total_units == 45 (sum over FULFILLED issuances)"
            - "Agency active_allocated_units == 55 (allocated 100 - fulfilled 45)"
            - "Inventory.sizes.SIZE_1.on_hand_units == 55 and reserved_units == 55"

      - name: finalize_checkpoint_releases_remainder
        claim_type: ops_run_checkpoint
        grounds: [state_machines.AllocationRun.PUBLISHED_to_FINALIZED]
        distinguishing_aspect: "ops_run_checkpoint layer: explicit finalize of a partially consumed run releases exactly the unfulfilled remainder (300) back to the available pool; FULFILLED-equivalent accounting stays intact."
        test_recipe:
          setup: ["SIZE_6 on_hand 500 posted; agency; run published -> line 500; household 4 children ELIGIBLE; event completed with issuance 200 -> line PARTIALLY_FULFILLED, reserved 300"]
          setup_api_calls:
            - { call: "POST /inventory/initialize", payload: {}, as: WarehouseManager }
            - call: "POST /intake-batches"
              payload: { donor_name: "Donor F6", lines: [{ size_code: "SIZE_6", quantity: 500 }] }
              as: WarehouseManager
              captures: { b1: $.data.id }
            - { call: "POST /intake-batches/${b1}/post", payload: {}, as: WarehouseManager }
            - call: "POST /partner-agencies"
              payload: { name: "Agency F6", agency_code: "AG-F6", contact_email: "f6@x.org", children_served_monthly: 300, storage_capacity_units: 100000 }
              as: BankAdmin
              captures: { ag: $.data.id }
            - call: "POST /allocation-runs"
              payload: { period: "2026-08" }
              as: BankAdmin
              captures: { r1: $.data.id }
            - { call: "POST /allocation-runs/${r1}/compute", payload: {}, as: BankAdmin }
            - { call: "POST /allocation-runs/${r1}/publish", payload: {}, as: BankAdmin }
            - call: "POST /households"
              payload: { household_code: "HH-F6", children_sizes: ["SIZE_6", "SIZE_6", "SIZE_6", "SIZE_6"], consent_on_file: true }
              as: PrivacyOfficer
              captures: { hh: $.data.id }
            - call: "PATCH /households/${hh}"
              payload: { eligibility_status: "ELIGIBLE" }
              as: PrivacyOfficer
            - call: "POST /distribution-events"
              payload: { host_agency_id: "${ag}", site_name: "F6-Site", starts_at: "2026-08-10T09:00:00Z", ends_at: "2026-08-10T12:00:00Z" }
              as: BankAdmin
              captures: { ev: $.data.id }
            - { call: "POST /distribution-events/${ev}/open", payload: {}, as: BankAdmin }
            - call: "POST /distribution-events/${ev}/issuances"
              payload: { household_id: "${hh}", lines: [{ size_code: "SIZE_6", quantity: 200 }] }
              as: PrivacyOfficer
            - { call: "POST /distribution-events/${ev}/lock", payload: {}, as: BankAdmin }
            - { call: "POST /distribution-events/${ev}/complete", payload: {}, as: BankAdmin }
          trigger:
            - call: "POST /allocation-runs/${r1}/finalize"
              payload: {}
              as: BankAdmin
              captures: { run_status: $.data.status }
            - call: "GET /allocation-runs/${r1}/lines"
              payload: {}
              as: BankAdmin
              captures: { line_status: "$.data[0].status", line_released: "$.data[0].released_units" }
            - { call: "GET /inventory", payload: {}, as: WarehouseManager }
          assert:
            - "Run status == FINALIZED via the explicit checkpoint"
            - "Line status == RELEASED with released_units == 300 (allocated 500 - fulfilled 200)"
            - "Inventory.sizes.SIZE_6.reserved_units == 0 and on_hand_units == 300 -> available 300 returned to the pool"

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: immediate_read_after_patch
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "immediate consistency: PATCH agency weight is visible in the very next GET with version bumped by exactly 1."
        test_recipe:
          setup: ["Agency with children_served_monthly 100"]
          setup_api_calls:
            - call: "POST /partner-agencies"
              payload: { name: "Agency IC", agency_code: "AG-IC", contact_email: "ic@x.org", children_served_monthly: 100, storage_capacity_units: 10000 }
              as: BankAdmin
              captures: { ag: $.data.id, v0: $.data.version }
          trigger:
            - call: "PATCH /partner-agencies/${ag}"
              payload: { children_served_monthly: 450 }
              as: BankAdmin
            - call: "GET /partner-agencies/${ag}"
              payload: {}
              as: BankAdmin
              captures: { cs: $.data.children_served_monthly, v1: $.data.version }
          assert:
            - "GET returns children_served_monthly == 450 in the immediately following request"
            - "version == 2 (exactly one mutation since creation)"
