          Conserved quantity 1: authorization visit units. Scheduling is the forward action and
          cancelling is its compensator; after the round trip visits_authorized + visits_released must
          still equal visits_consumed + visits_remaining, with visits_remaining back at 12 and
          visits_consumed deliberately NOT decremented.
