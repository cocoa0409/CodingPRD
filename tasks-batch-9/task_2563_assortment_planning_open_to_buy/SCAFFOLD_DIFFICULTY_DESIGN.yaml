              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { item_i1: $.data.id }
            - call: "POST /otb/assortment-items"
              payload: { option_plan_id: "${op1_id}", vendor_id: "${vendor_id}", sku_code: "DRSS-I2", color_code: "BLACK", lifecycle_stage: "CORE", unit_cost_cents: 2500, retail_price_cents: 6500, prior_season_sell_through_bps: 6000 }
