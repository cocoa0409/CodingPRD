# =============================================================================
# Example: drop-bite benchmark seed tables (v1)
# =============================================================================

scenario: |
  DropBite limited-run food delivery storefront API. Manages storefronts with
  posture-based intake control (OPEN/THROTTLED/PAUSED), limited-batch drops,
  order queuing with ticket-based fairness, kitchen progression, pickup bundles,
  and automatic makegood credits for ready-void scenarios. Ops runs drive
  settlement and posture changes based on waste voids.

domain_name: drop-bite
api_prefix: /storefronts

# =============================================================================
# Table 1: Entity Relationship Table
# =============================================================================
entities:
  - name: Storefront
    parent: null
    common_fields: true  # id, created_at, updated_at
    fields:
      - { name: posture, type: enum, source: computed, description: "OPEN | THROTTLED | PAUSED — derived from waste voids between ops runs" }
      - { name: ops_run_index, type: integer, source: computed, description: "Incremented on each run_ops call, starts at 0" }

  - name: Drop
    parent: Storefront
    common_fields: true
    fields:
      - { name: storefront_id, type: string, source: system, description: "Associated storefront ID" }
      - { name: title, type: string, source: input, description: "Drop title" }
      - { name: servings_total, type: integer, source: input, description: "Total servings in the batch" }
      - { name: servings_remaining, type: integer, source: computed, description: "Derived remaining servings; never negative; updated on accept/void/pickup" }
      - { name: status, type: enum, source: system, description: "PLANNED → LIVE → PAUSED / CLOSED" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: Order
    parent: Storefront
    common_fields: true
    fields:
      - { name: storefront_id, type: string, source: system, description: "Associated storefront ID" }
      - { name: drop_id, type: string, source: input, description: "Associated drop ID" }
      - { name: customer_ref, type: string, source: input, description: "External customer reference" }
      - { name: quantity, type: integer, source: input, description: "Number of servings requested" }
      - { name: note, type: string, source: input, required: false, description: "Optional note" }
      - { name: ticket_no, type: integer, source: system, description: "Fairness ordering; earlier tickets win" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | WAITLISTED | NEEDS_REVIEW | ACCEPTED | IN_KITCHEN | READY | PICKED_UP | CANCELLED | VOIDED" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: Bundle
    parent: Storefront
    common_fields: true
    fields:
      - { name: storefront_id, type: string, source: system, description: "Associated storefront ID" }
      - { name: drop_id, type: string, source: input, description: "Associated drop ID" }
      - { name: max_orders, type: integer, source: input, description: "Maximum number of orders in this bundle" }
      - { name: order_ids, type: array, source: system, description: "List of order IDs in this bundle" }
      - { name: status, type: enum, source: system, description: "DRAFT | SEALED" }

  - name: Makegood
    parent: Storefront
    common_fields: true
    fields:
      - { name: storefront_id, type: string, source: system, description: "Associated storefront ID" }
      - { name: order_id, type: string, source: system, description: "Associated voided order ID" }
      - { name: amount_cents, type: integer, source: computed, description: "$5 per serving, capped at $20 total (in cents)" }
      - { name: status, type: string, source: system, description: "Status of the makegood" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Storefront
    field: posture
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: "*"
        to: OPEN
        trigger: POST /storefronts/:storefront_id/run_ops
        actor: system
        preconditions:
          - "Zero waste voids since last ops run"
        side_effects: []

      - from: "*"
        to: THROTTLED
        trigger: POST /storefronts/:storefront_id/run_ops
        actor: system
        preconditions:
          - "Exactly one waste void since last ops run"
        side_effects:
          - "Max quantity per new order becomes 2"

      - from: "*"
        to: PAUSED
        trigger: POST /storefronts/:storefront_id/run_ops
        actor: system
        preconditions:
          - "Two or more waste voids since last ops run"
        side_effects:
          - "Storefront stops accepting new orders"

  - entity: Drop
    initial_state: PLANNED
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNED
        to: LIVE
        trigger: PATCH /storefronts/:storefront_id/drops/:drop_id
        actor: operator
        preconditions: []
        side_effects: []

      - from: LIVE
        to: PAUSED
        trigger: PATCH /storefronts/:storefront_id/drops/:drop_id
        actor: operator
        preconditions: []
        side_effects:
          - "All SUBMITTED and WAITLISTED orders for this drop become NEEDS_REVIEW"

      - from: PAUSED
        to: LIVE
        trigger: PATCH /storefronts/:storefront_id/drops/:drop_id
        actor: operator
        preconditions: []
        side_effects:
          - "NEEDS_REVIEW orders stay NEEDS_REVIEW until customer resubmits"

      - from: LIVE
        to: CLOSED
        trigger: PATCH /storefronts/:storefront_id/drops/:drop_id
        actor: operator
        preconditions: []
        side_effects:
          - "During next run_ops: SUBMITTED, WAITLISTED, NEEDS_REVIEW orders for this drop become CANCELLED"

      - from: PAUSED
        to: CLOSED
        trigger: PATCH /storefronts/:storefront_id/drops/:drop_id
        actor: operator
        preconditions: []
        side_effects:
          - "Same as LIVE → CLOSED"

  - entity: Order
    initial_state: DRAFT
    terminal_states: [PICKED_UP, CANCELLED, VOIDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: POST /storefronts/:storefront_id/orders/:order_id/submit
        actor: customer
        preconditions:
          - "Drop must be LIVE"
          - "Storefront posture must allow intake (OPEN or THROTTLED)"
          - "Quantity must comply with posture limit (OPEN: <=6, THROTTLED: <=2)"
        side_effects: []

      - from: NEEDS_REVIEW
        to: SUBMITTED
        trigger: POST /storefronts/:storefront_id/orders/:order_id/submit
        actor: customer
        preconditions:
          - "Drop must be LIVE"
          - "Storefront posture must allow intake"
          - "Quantity must comply with posture limit"
        side_effects: []

      - from: SUBMITTED
        to: ACCEPTED
        trigger: POST /storefronts/:storefront_id/run_ops (settlement)
        actor: system
        preconditions:
          - "Drop is LIVE"
          - "Sufficient servings_remaining for the order's quantity"
        side_effects:
          - "servings_remaining decremented by quantity"

      - from: SUBMITTED
        to: WAITLISTED
        trigger: POST /storefronts/:storefront_id/run_ops (settlement)
        actor: system
        preconditions:
          - "Insufficient servings_remaining for this ticket"
        side_effects:
          - "Later tickets do not leapfrog (no jumping the line)"

      - from: WAITLISTED
        to: ACCEPTED
        trigger: POST /storefronts/:storefront_id/run_ops (settlement)
        actor: system
        preconditions:
          - "Sufficient servings_remaining"
        side_effects:
          - "servings_remaining decremented by quantity"

      - from: SUBMITTED
        to: NEEDS_REVIEW
        trigger: "system (drop paused or storefront throttled with oversized quantity)"
        actor: system
        preconditions: []
        side_effects: []

      - from: WAITLISTED
        to: NEEDS_REVIEW
        trigger: "system (drop paused)"
        actor: system
        preconditions: []
        side_effects: []

      - from: SUBMITTED
        to: CANCELLED
        trigger: "system (run_ops on CLOSED drop)"
        actor: system
        preconditions:
          - "Drop is CLOSED"
        side_effects: []

      - from: WAITLISTED
        to: CANCELLED
        trigger: "system (run_ops on CLOSED drop)"
        actor: system
        preconditions:
          - "Drop is CLOSED"
        side_effects: []

      - from: NEEDS_REVIEW
        to: CANCELLED
        trigger: "system (run_ops on CLOSED drop)"
        actor: system
        preconditions:
          - "Drop is CLOSED"
        side_effects: []

      - from: DRAFT
        to: CANCELLED
        trigger: POST /storefronts/:storefront_id/orders/:order_id/cancel
        actor: customer
        preconditions: []
        side_effects: []

      - from: SUBMITTED
        to: CANCELLED
        trigger: POST /storefronts/:storefront_id/orders/:order_id/cancel
        actor: customer
        preconditions: []
        side_effects: []

      - from: WAITLISTED
        to: CANCELLED
        trigger: POST /storefronts/:storefront_id/orders/:order_id/cancel
        actor: customer
        preconditions: []
        side_effects: []

      - from: NEEDS_REVIEW
        to: CANCELLED
        trigger: POST /storefronts/:storefront_id/orders/:order_id/cancel
        actor: customer
        preconditions: []
        side_effects: []

      - from: ACCEPTED
        to: IN_KITCHEN
        trigger: POST /storefronts/:storefront_id/orders/:order_id/advance
        actor: kitchen
        preconditions: []
        side_effects: []

      - from: IN_KITCHEN
        to: READY
        trigger: POST /storefronts/:storefront_id/orders/:order_id/advance
        actor: kitchen
        preconditions: []
        side_effects: []

      - from: READY
        to: PICKED_UP
        trigger: POST /storefronts/:storefront_id/orders/:order_id/advance
        actor: kitchen
        preconditions:
          - "Order must belong to a SEALED bundle"
        side_effects: []

      - from: ACCEPTED
        to: VOIDED
        trigger: POST /storefronts/:storefront_id/orders/:order_id/void
        actor: operator
        preconditions: []
        side_effects:
          - "servings_remaining incremented by quantity"
          - "Order removed from bundle if bundled"

      - from: IN_KITCHEN
        to: VOIDED
        trigger: POST /storefronts/:storefront_id/orders/:order_id/void
        actor: operator
        preconditions: []
        side_effects:
          - "servings_remaining incremented by quantity"
          - "Order removed from bundle if bundled"
          - "Counted as waste void for posture calculation"

      - from: READY
        to: VOIDED
        trigger: POST /storefronts/:storefront_id/orders/:order_id/void
        actor: operator
        preconditions: []
        side_effects:
          - "servings_remaining incremented by quantity"
          - "Order removed from bundle if bundled"
          - "Counted as waste void for posture calculation"
          - "Makegood record created automatically"

  - entity: Bundle
    initial_state: DRAFT
    terminal_states: [SEALED]
    transitions:
      - from: DRAFT
        to: SEALED
        trigger: POST /storefronts/:storefront_id/bundles/:bundle_id/seal
        actor: operator
        preconditions: []
        side_effects:
          - "Enables READY → PICKED_UP for orders in this bundle"

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: servings_remaining
    trigger: "order acceptance, void, pickup"
    algorithm: aggregation
    formula: |
      servings_remaining = servings_total - sum(quantity for orders in ACCEPTED, IN_KITCHEN, READY, PICKED_UP)
      Never goes negative.
    note: "Updated immediately on acceptance, void, or pickup"

  - name: waste_void_count
    trigger: "between ops runs"
    algorithm: count
    formula: |
      Count of orders voided from IN_KITCHEN or READY since last run_ops.
      0 waste voids → OPEN, 1 → THROTTLED, 2+ → PAUSED

  - name: settlement
    trigger: "run_ops"
    algorithm: queue
    formula: |
      For each LIVE drop, process orders in SUBMITTED and WAITLISTED status
      ordered by ticket_no ascending:
        if order.quantity <= drop.servings_remaining:
          order → ACCEPTED, servings_remaining -= quantity
        else:
          order → WAITLISTED (or stays WAITLISTED)
          STOP processing further tickets for this drop (no jumping the line)

  - name: makegood_amount
    trigger: "void from READY"
    algorithm: simple
    formula: |
      amount_cents = min(quantity * 500, 2000)
      ($5 per serving, capped at $20 total, stored as cents)

  - name: quantity_limit
    trigger: "order creation, submission"
    algorithm: threshold
    formula: |
      OPEN: max quantity = 6
      THROTTLED: max quantity = 2
      PAUSED: no new orders accepted

  - name: one_active_order_per_customer_per_drop
    trigger: "order creation"
    algorithm: uniqueness
    formula: |
      For a given (drop_id, customer_ref), only one order in active states
      (DRAFT, SUBMITTED, WAITLISTED, NEEDS_REVIEW, ACCEPTED, IN_KITCHEN, READY)
      is allowed at a time. Terminal states (CANCELLED, VOIDED, PICKED_UP) free the slot.

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: concurrency
    check: "If-Match header must be present on all PUT and PATCH requests"
    error_id: ERR_MISSING_IF_MATCH
    http_status: 400
    applies_to: "PUT, PATCH endpoints"

  - priority: 2
    category: existence
    check: "Resource IDs in path must exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all endpoints with path params

  - priority: 3
    category: state
    check: "Resource must be in valid state for the requested lifecycle action"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all state transition endpoints

  - priority: 4
    category: business
    check: "Business rule blockers (posture, drop status, quantity, bundle capacity, constraint violations)"
    error_id: "ERR_STORE_PAUSED | ERR_DROP_PAUSED | ERR_DROP_CLOSED | ERR_DROP_NOT_LIVE | ERR_QUANTITY_LIMIT_EXCEEDED | ERR_BUNDLE_FULL | ERR_BUNDLE_LOCKED | ERR_CONSTRAINT_VIOLATION"
    http_status: "varies (400/409)"
    applies_to: varies

  - priority: 5
    category: general
    check: "General request format errors"
    error_id: ERR_BAD_REQUEST
    http_status: 400
    applies_to: all endpoints

# =============================================================================
# Table 5: API Endpoint Table (18 endpoints)
# =============================================================================
endpoints:
  # --- Storefront ---
  - method: POST
    path: "/storefronts"
    description: "Create a new Storefront"
    roles: [Any]
    code: 201
    input: []
    output: Storefront
    side_effects: ["posture initialized to OPEN, ops_run_index to 0"]

  - method: GET
    path: "/storefronts/:storefront_id"
    description: "Get a specific Storefront"
    roles: [Any]
    code: 200
    input: []
    output: Storefront
    side_effects: []

  - method: POST
    path: "/storefronts/:storefront_id/run_ops"
    description: "Run an ops cycle: update posture based on waste, settle orders for live drops"
    roles: [Any]
    code: 200
    input: []
    output: Storefront
    side_effects:
      - "ops_run_index incremented"
      - "Posture recalculated from waste voids"
      - "Settlement: accept/waitlist orders for each LIVE drop"
      - "Cancel SUBMITTED/WAITLISTED/NEEDS_REVIEW orders on CLOSED drops"

  # --- Drop ---
  - method: POST
    path: "/storefronts/:storefront_id/drops"
    description: "Create a new Drop"
    roles: [Any]
    code: 201
    input: [title, servings_total]
    output: Drop
    side_effects: ["status set to PLANNED, servings_remaining = servings_total"]

  - method: GET
    path: "/storefronts/:storefront_id/drops/:drop_id"
    description: "Get a specific Drop"
    roles: [Any]
    code: 200
    input: []
    output: Drop
    side_effects: []

  - method: PATCH
    path: "/storefronts/:storefront_id/drops/:drop_id"
    description: "Update a Drop (status, servings_total)"
    roles: [Any]
    code: 200
    input: ["status?, servings_total?"]
    output: Drop
    side_effects:
      - "If-Match required (optimistic concurrency)"
      - "Status transitions (PLANNED→LIVE, LIVE→PAUSED, PAUSED→LIVE, LIVE→CLOSED, PAUSED→CLOSED)"
      - "servings_total adjustable while not CLOSED (cannot go below committed servings)"
      - "Pausing flips SUBMITTED/WAITLISTED orders to NEEDS_REVIEW"

  # --- Order ---
  - method: POST
    path: "/storefronts/:storefront_id/orders"
    description: "Create a new Order (draft)"
    roles: [Any]
    code: 201
    input: [drop_id, customer_ref, quantity, "note?"]
    output: Order
    side_effects:
      - "Status set to DRAFT"
      - "ticket_no assigned"
      - "One active order per (drop_id, customer_ref) enforced"
      - "Quantity limit checked against current posture"
      - "Storefront must not be PAUSED"

  - method: GET
    path: "/storefronts/:storefront_id/orders/:order_id"
    description: "Get a specific Order"
    roles: [Any]
    code: 200
    input: []
    output: Order
    side_effects: []

  - method: PUT
    path: "/storefronts/:storefront_id/orders/:order_id"
    description: "Edit an Order (quantity, note)"
    roles: [Any]
    code: 200
    input: ["quantity?, note?"]
    output: Order
    side_effects:
      - "If-Match required"
      - "DRAFT: quantity and note editable"
      - "SUBMITTED/WAITLISTED/NEEDS_REVIEW: note editable, quantity can only be reduced"
      - "ACCEPTED or later: locked (ERR_INVALID_STATE)"

  - method: POST
    path: "/storefronts/:storefront_id/orders/:order_id/submit"
    description: "Submit an order into the intake pipeline"
    roles: [Any]
    code: 200
    input: []
    output: Order
    side_effects:
      - "DRAFT → SUBMITTED or NEEDS_REVIEW → SUBMITTED"
      - "Drop must be LIVE, storefront posture must allow intake"
      - "Quantity checked against posture limit"

  - method: POST
    path: "/storefronts/:storefront_id/orders/:order_id/cancel"
    description: "Cancel a pending order"
    roles: [Any]
    code: 200
    input: []
    output: Order
    side_effects:
      - "Only from DRAFT, SUBMITTED, WAITLISTED, NEEDS_REVIEW"
      - "Status → CANCELLED"

  - method: POST
    path: "/storefronts/:storefront_id/orders/:order_id/advance"
    description: "Advance an order through kitchen states"
    roles: [Any]
    code: 200
    input: []
    output: Order
    side_effects:
      - "ACCEPTED → IN_KITCHEN → READY → PICKED_UP"
      - "READY → PICKED_UP requires order to be in a SEALED bundle"

  - method: POST
    path: "/storefronts/:storefront_id/orders/:order_id/void"
    description: "Void an accepted/in-kitchen/ready order"
    roles: [Any]
    code: 200
    input: []
    output: Order
    side_effects:
      - "ACCEPTED/IN_KITCHEN/READY → VOIDED"
      - "Releases servings back to drop"
      - "Removed from bundle if bundled"
      - "IN_KITCHEN/READY voids are waste voids"
      - "READY void creates a makegood record (returned as makegood_id)"

  # --- Bundle ---
  - method: POST
    path: "/storefronts/:storefront_id/bundles"
    description: "Create a pickup bundle"
    roles: [Any]
    code: 201
    input: [drop_id, max_orders]
    output: Bundle
    side_effects: ["status set to DRAFT, order_ids empty"]

  - method: GET
    path: "/storefronts/:storefront_id/bundles/:bundle_id"
    description: "Get a specific Bundle"
    roles: [Any]
    code: 200
    input: []
    output: Bundle
    side_effects: []

  - method: POST
    path: "/storefronts/:storefront_id/bundles/:bundle_id/add_order"
    description: "Add an order to a bundle"
    roles: [Any]
    code: 200
    input: [order_id]
    output: Bundle
    side_effects:
      - "Order must be READY"
      - "Order must belong to same drop_id as bundle"
      - "Bundle must be DRAFT"
      - "Bundle must not have exceeded max_orders"
      - "Order must not already be in a different bundle"

  - method: POST
    path: "/storefronts/:storefront_id/bundles/:bundle_id/seal"
    description: "Seal a bundle for handoff"
    roles: [Any]
    code: 200
    input: []
    output: Bundle
    side_effects: ["status → SEALED"]

  # --- Makegood ---
  - method: GET
    path: "/storefronts/:storefront_id/makegoods/:makegood_id"
    description: "Get a specific Makegood record"
    roles: [Any]
    code: 200
    input: []
    output: Makegood
    side_effects: []

# =============================================================================
# Table 6: Error Code Catalogue (13 error codes)
# =============================================================================
errors:
  - id: ERR_BAD_REQUEST
    http: 400
    condition: "General request format error (missing required fields, type mismatch, etc.)"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Resource with given ID does not exist or wrong storefront"

  - id: ERR_MISSING_IF_MATCH
    http: 400
    condition: "If-Match header missing on PUT or PATCH request"

  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "If-Match value does not match current version"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Resource is in wrong state for the requested lifecycle action"

  - id: ERR_STORE_PAUSED
    http: 409
    condition: "Storefront is PAUSED; cannot accept new orders"

  - id: ERR_DROP_NOT_LIVE
    http: 409
    condition: "Drop is not LIVE (required for submission)"

  - id: ERR_DROP_PAUSED
    http: 409
    condition: "Drop is PAUSED"

  - id: ERR_DROP_CLOSED
    http: 409
    condition: "Drop is CLOSED; cannot accept new submissions"

  - id: ERR_QUANTITY_LIMIT_EXCEEDED
    http: 409
    condition: "Order quantity exceeds posture-based limit (OPEN: 6, THROTTLED: 2)"

  - id: ERR_CONSTRAINT_VIOLATION
    http: 409
    condition: "Would violate a hard integrity constraint (e.g., reducing servings_total below committed count)"

  - id: ERR_BUNDLE_FULL
    http: 409
    condition: "Bundle has reached max_orders"

  - id: ERR_BUNDLE_LOCKED
    http: 409
    condition: "Bundle is SEALED; cannot add orders"

# =============================================================================
# RBAC Role Permission Matrix
# =============================================================================
roles:
  - name: Any
    description: "All operations are available to any caller; no role restrictions in DropBite"
    shared_operations:
      - "All 18 endpoints are accessible to any caller"
