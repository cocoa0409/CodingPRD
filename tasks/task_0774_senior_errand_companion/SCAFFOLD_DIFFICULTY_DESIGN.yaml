scaffold_difficulty_design:
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: visit_estimate_vs_final_invoice_diverge
        grounds:
          - calculations.visit_billing_cost
          - entities.Visit.fields.estimated_cost_cents
          - entities.Invoice.fields.total_cents
        distinguishing_aspect: "The provisional Visit.estimated_cost_cents (9000, from scheduled 3h, zero mileage, no add-ons) differs from the final Invoice.total_cents (12750, from actual 3.5h + 10mi + a 1500 add-on) on the Visit/Invoice domain."
        test_recipe:
          setup:
            - "Cleared, bonded caregiver; client @ 3000c/hr, 75c/mile; visit scheduled 09:00-12:00 (180min); caregiver assigned (provisional estimate set); one 1500c MEAL_PREP add-on APPROVED; clocked in 09:00, clocked out 12:30 with 10 miles."
          setup_api_calls:
            - call: "POST /care/caregivers"
              payload: { name: "CG A", home_zip: "90001" }
              as: CareCoordinator
              captures: { cg: $.data.id }
            - call: "POST /care/caregivers/${cg}/background-checks"
              payload: {}
              as: CareCoordinator
              captures: { bgc: $.data.id }
            - call: "POST /care/background-checks/${bgc}/decision"
              payload: { outcome: "CLEARED", expires_at: "2027-01-01T00:00:00Z" }
              as: CareCoordinator
            - call: "POST /care/caregivers/${cg}/bonds"
              payload: { coverage_cents: 5000000, effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }
              as: CareCoordinator
            - call: "POST /care/clients"
              payload: { name: "Client A", home_zip: "90001", hourly_rate_cents: 3000, mileage_rate_cents_per_mile: 75 }
              as: CareCoordinator
              captures: { cl: $.data.id }
            - call: "POST /care/visits"
              payload: { client_id: "${cl}", task_type: "COMPANION", scheduled_start: "2026-03-05T09:00:00Z", scheduled_end: "2026-03-05T12:00:00Z" }
              as: CareCoordinator
              captures: { v: $.data.id, vv: $.data.version }
            - call: "POST /care/visits/${v}/assignments"
              payload: { caregiver_id: "${cg}", expected_visit_version: "${vv}" }
              as: CareCoordinator
              captures: { asg: $.data.id }
            - call: "POST /care/visits/${v}/add-ons"
              payload: { addon_type: "MEAL_PREP", fee_cents: 1500 }
              as: CareCoordinator
              captures: { ao: $.data.id }
            - call: "POST /care/add-ons/${ao}/approve"
              payload: { outcome: "APPROVE" }
              as: CareCoordinator
            - call: "POST /care/visits/${v}/clock-in"
              payload: { actual_start: "2026-03-05T09:00:00Z" }
              as: Caregiver
              as_user_id: "${cg}"
            - call: "POST /care/visits/${v}/clock-out"
              payload: { actual_end: "2026-03-05T12:30:00Z", mileage_miles: 10 }
              as: Caregiver
              as_user_id: "${cg}"
          trigger:
            - call: "GET /care/invoices?visit_id=${v}"
              as: BillingClerk
              captures: { inv: "$.data[0].id" }
          assert:
            - "Visit.${v}.estimated_cost_cents == 9000"
            - "Invoice.${inv}.labor_cents == 10500"
            - "Invoice.${inv}.total_cents == 12750"
            - "Visit.${v}.estimated_cost_cents != Invoice.${inv}.total_cents"

      - name: ltc_indemnity_vs_reimbursement_diverge
        grounds:
          - calculations.ltc_reimbursement
          - entities.ReimbursementClaim.fields.reimbursed_cents
          - entities.LTCPolicy.fields.benefit_type
        distinguishing_aspect: "For the same eligible base (12000 = labor 10500 + add-on 1500), an INDEMNITY policy reimburses 10000 while a REIMBURSEMENT policy reimburses 9600 — dual-variant on the ReimbursementClaim domain."
        test_recipe:
          setup:
            - "One FINALIZED invoice with labor 10500, add-on 1500, mileage 750 (total 12750, eligible 12000); an INDEMNITY policy (daily_benefit 10000) and a REIMBURSEMENT policy (rate 0.8, cap 12000) on the client."
          setup_api_calls:
            - call: "POST /care/caregivers"
              payload: { name: "CG B", home_zip: "90001" }
              as: CareCoordinator
              captures: { cg: $.data.id }
            - call: "POST /care/caregivers/${cg}/background-checks"
              payload: {}
              as: CareCoordinator
              captures: { bgc: $.data.id }
            - call: "POST /care/background-checks/${bgc}/decision"
              payload: { outcome: "CLEARED", expires_at: "2027-01-01T00:00:00Z" }
              as: CareCoordinator
            - call: "POST /care/caregivers/${cg}/bonds"
              payload: { coverage_cents: 5000000, effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }
              as: CareCoordinator
            - call: "POST /care/clients"
              payload: { name: "Client B", home_zip: "90001", hourly_rate_cents: 3000, mileage_rate_cents_per_mile: 75 }
              as: CareCoordinator
              captures: { cl: $.data.id }
            - call: "POST /care/visits"
              payload: { client_id: "${cl}", task_type: "COMPANION", scheduled_start: "2026-03-05T09:00:00Z", scheduled_end: "2026-03-05T12:00:00Z" }
              as: CareCoordinator
              captures: { v: $.data.id, vv: $.data.version }
            - call: "POST /care/visits/${v}/assignments"
              payload: { caregiver_id: "${cg}", expected_visit_version: "${vv}" }
              as: CareCoordinator
            - call: "POST /care/visits/${v}/add-ons"
              payload: { addon_type: "MEAL_PREP", fee_cents: 1500 }
              as: CareCoordinator
              captures: { ao: $.data.id }
            - call: "POST /care/add-ons/${ao}/approve"
              payload: { outcome: "APPROVE" }
              as: CareCoordinator
            - call: "POST /care/visits/${v}/clock-in"
              payload: { actual_start: "2026-03-05T09:00:00Z" }
              as: Caregiver
              as_user_id: "${cg}"
            - call: "POST /care/visits/${v}/clock-out"
              payload: { actual_end: "2026-03-05T12:30:00Z", mileage_miles: 10 }
              as: Caregiver
              as_user_id: "${cg}"
            - call: "GET /care/invoices?visit_id=${v}"
              as: BillingClerk
              captures: { inv: "$.data[0].id" }
            - call: "POST /care/invoices/${inv}/finalize"
              payload: {}
              as: BillingClerk
            - call: "POST /care/clients/${cl}/ltc-policies"
              payload: { payer_name: "IndemCo", benefit_type: "INDEMNITY", lifetime_max_cents: 1000000, daily_benefit_cents: 10000 }
              as: CareCoordinator
              captures: { pol_ind: $.data.id }
            - call: "POST /care/clients/${cl}/ltc-policies"
              payload: { payer_name: "ReimbCo", benefit_type: "REIMBURSEMENT", lifetime_max_cents: 1000000, reimbursement_rate: 0.8, daily_cap_cents: 12000 }
              as: CareCoordinator
              captures: { pol_reimb: $.data.id }
          trigger:
            - call: "POST /care/invoices/${inv}/claims"
              payload: { ltc_policy_id: "${pol_ind}" }
              as: BillingClerk
              captures: { cl_ind: $.data.id }
            - call: "POST /care/invoices/${inv}/claims"
              payload: { ltc_policy_id: "${pol_reimb}" }
              as: BillingClerk
              captures: { cl_reimb: $.data.id }
          assert:
            - "ReimbursementClaim.${cl_ind}.reimbursed_cents == 10000"
            - "ReimbursementClaim.${cl_reimb}.reimbursed_cents == 9600"
            - "ReimbursementClaim.${cl_ind}.reimbursed_cents != ReimbursementClaim.${cl_reimb}.reimbursed_cents"

  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: labor_tiered_overtime_nonlinear
        grounds:
          - calculations.labor_charge
          - entities.Invoice.fields.labor_cents
        distinguishing_aspect: "Mode (a): a 9h visit at 3000c/hr with ot_threshold 8, ot_multiplier 1.5 yields labor = min(9,8)*3000 + max(9-8,0)*3000*1.5 = 24000 + 4500 = 28500 via nested min/max + conditional tier."
        test_recipe:
          setup:
            - "Cleared bonded caregiver; client @ 3000c/hr, ot_threshold 8, ot_multiplier 1.5; visit worked 08:00-17:00 (9h), zero mileage."
          setup_api_calls:
            - call: "POST /care/caregivers"
              payload: { name: "CG C", home_zip: "90001" }
              as: CareCoordinator
              captures: { cg: $.data.id }
            - call: "POST /care/caregivers/${cg}/background-checks"
              payload: {}
              as: CareCoordinator
              captures: { bgc: $.data.id }
            - call: "POST /care/background-checks/${bgc}/decision"
              payload: { outcome: "CLEARED", expires_at: "2027-01-01T00:00:00Z" }
              as: CareCoordinator
            - call: "POST /care/caregivers/${cg}/bonds"
              payload: { coverage_cents: 5000000, effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }
              as: CareCoordinator
            - call: "POST /care/clients"
              payload: { name: "Client C", home_zip: "90001", hourly_rate_cents: 3000, mileage_rate_cents_per_mile: 75, ot_threshold_hours: 8, ot_multiplier: 1.5 }
              as: CareCoordinator
              captures: { cl: $.data.id }
            - call: "POST /care/visits"
              payload: { client_id: "${cl}", task_type: "COMPANION", scheduled_start: "2026-03-05T08:00:00Z", scheduled_end: "2026-03-05T17:00:00Z" }
              as: CareCoordinator
              captures: { v: $.data.id, vv: $.data.version }
            - call: "POST /care/visits/${v}/assignments"
              payload: { caregiver_id: "${cg}", expected_visit_version: "${vv}" }
              as: CareCoordinator
            - call: "POST /care/visits/${v}/clock-in"
              payload: { actual_start: "2026-03-05T08:00:00Z" }
              as: Caregiver
              as_user_id: "${cg}"
            - call: "POST /care/visits/${v}/clock-out"
              payload: { actual_end: "2026-03-05T17:00:00Z", mileage_miles: 0 }
              as: Caregiver
              as_user_id: "${cg}"
          trigger:
            - call: "GET /care/invoices?visit_id=${v}"
              as: BillingClerk
              captures: { inv: "$.data[0].id" }
          assert:
            - "Invoice.${inv}.labor_cents == 28500"
            - "Invoice.${inv}.total_cents == 28500"

      - name: invoice_rounding_per_line_then_sum
        grounds:
          - calculations.invoice_assembly
          - entities.Invoice.fields.labor_cents
          - entities.Invoice.fields.mileage_cents
          - entities.Invoice.fields.total_cents
        distinguishing_aspect: "Mode (b): labor_raw 6437.5 and mileage_raw 607.5 are each rounded FIRST (6438, 608) then summed to 7046; sum-then-round would give 7045 — the pinned per-line order changes the cent."
        test_recipe:
          setup:
            - "Cleared bonded caregiver; client @ 2575c/hr, 67.5c/mile; visit worked 09:00-11:30 (2.5h), 9 miles, no add-ons."
          setup_api_calls:
            - call: "POST /care/caregivers"
              payload: { name: "CG D", home_zip: "90001" }
              as: CareCoordinator
              captures: { cg: $.data.id }
            - call: "POST /care/caregivers/${cg}/background-checks"
              payload: {}
              as: CareCoordinator
              captures: { bgc: $.data.id }
            - call: "POST /care/background-checks/${bgc}/decision"
              payload: { outcome: "CLEARED", expires_at: "2027-01-01T00:00:00Z" }
              as: CareCoordinator
            - call: "POST /care/caregivers/${cg}/bonds"
              payload: { coverage_cents: 5000000, effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }
              as: CareCoordinator
            - call: "POST /care/clients"
              payload: { name: "Client D", home_zip: "90001", hourly_rate_cents: 2575, mileage_rate_cents_per_mile: 67.5 }
              as: CareCoordinator
              captures: { cl: $.data.id }
            - call: "POST /care/visits"
              payload: { client_id: "${cl}", task_type: "GROCERY", scheduled_start: "2026-03-05T09:00:00Z", scheduled_end: "2026-03-05T11:30:00Z" }
              as: CareCoordinator
              captures: { v: $.data.id, vv: $.data.version }
            - call: "POST /care/visits/${v}/assignments"
              payload: { caregiver_id: "${cg}", expected_visit_version: "${vv}" }
              as: CareCoordinator
            - call: "POST /care/visits/${v}/clock-in"
              payload: { actual_start: "2026-03-05T09:00:00Z" }
              as: Caregiver
              as_user_id: "${cg}"
            - call: "POST /care/visits/${v}/clock-out"
              payload: { actual_end: "2026-03-05T11:30:00Z", mileage_miles: 9 }
              as: Caregiver
              as_user_id: "${cg}"
          trigger:
            - call: "GET /care/invoices?visit_id=${v}"
              as: BillingClerk
              captures: { inv: "$.data[0].id" }
          assert:
            - "Invoice.${inv}.labor_cents == 6438"
            - "Invoice.${inv}.mileage_cents == 608"
            - "Invoice.${inv}.total_cents == 7046"

  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: visit_fork_escalated_produces_no_invoice
        grounds:
          - state_machines.Visit.IN_PROGRESS_to_ESCALATED
          - state_machines.Visit.IN_PROGRESS_to_COMPLETED
          - entities.WellnessCheck.fields.status
        distinguishing_aspect: "The IN_PROGRESS fork to ESCALATED creates a WellnessCheck(OPEN) and produces NO invoice, a strictly different side-effect set than the COMPLETED branch (branching non-linearity on Visit)."
        test_recipe:
          setup:
            - "Cleared bonded caregiver assigned to a visit, clocked in (IN_PROGRESS)."
          setup_api_calls:
            - call: "POST /care/caregivers"
              payload: { name: "CG E", home_zip: "90001" }
              as: CareCoordinator
              captures: { cg: $.data.id }
            - call: "POST /care/caregivers/${cg}/background-checks"
              payload: {}
              as: CareCoordinator
              captures: { bgc: $.data.id }
            - call: "POST /care/background-checks/${bgc}/decision"
              payload: { outcome: "CLEARED", expires_at: "2027-01-01T00:00:00Z" }
              as: CareCoordinator
            - call: "POST /care/caregivers/${cg}/bonds"
              payload: { coverage_cents: 5000000, effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }
              as: CareCoordinator
            - call: "POST /care/clients"
              payload: { name: "Client E", home_zip: "90001", hourly_rate_cents: 3000, mileage_rate_cents_per_mile: 75 }
              as: CareCoordinator
              captures: { cl: $.data.id }
            - call: "POST /care/visits"
              payload: { client_id: "${cl}", task_type: "COMPANION", scheduled_start: "2026-03-05T09:00:00Z", scheduled_end: "2026-03-05T12:00:00Z" }
              as: CareCoordinator
              captures: { v: $.data.id, vv: $.data.version }
            - call: "POST /care/visits/${v}/assignments"
              payload: { caregiver_id: "${cg}", expected_visit_version: "${vv}" }
              as: CareCoordinator
            - call: "POST /care/visits/${v}/clock-in"
              payload: { actual_start: "2026-03-05T09:00:00Z" }
              as: Caregiver
              as_user_id: "${cg}"
          trigger:
            - call: "POST /care/visits/${v}/escalate"
              payload: { severity: "HIGH", reason: "client fall risk" }
              as: Caregiver
              as_user_id: "${cg}"
              captures: { wc: $.data.id }
          assert:
            - "Visit.${v}.status == ESCALATED"
            - "WellnessCheck.${wc}.status == OPEN"
            - "GET /care/invoices?visit_id=${v} returns data == [] (no invoice on the ESCALATED branch)"

      - name: claim_cycle_submitted_needsinfo_submitted
        grounds:
          - state_machines.ReimbursementClaim.SUBMITTED_to_NEEDS_INFO
          - state_machines.ReimbursementClaim.NEEDS_INFO_to_SUBMITTED
          - entities.ReimbursementClaim.fields.status
        distinguishing_aspect: "The claim loops SUBMITTED -> NEEDS_INFO -> SUBMITTED and lands back on SUBMITTED, a genuine cycle on the ReimbursementClaim entity (not a linear pipeline)."
        test_recipe:
          setup:
            - "A FINALIZED invoice and an ACTIVE INDEMNITY policy; a claim submitted then bounced to NEEDS_INFO by request-info."
          setup_api_calls:
            - call: "POST /care/caregivers"
              payload: { name: "CG F", home_zip: "90001" }
              as: CareCoordinator
              captures: { cg: $.data.id }
            - call: "POST /care/caregivers/${cg}/background-checks"
              payload: {}
              as: CareCoordinator
              captures: { bgc: $.data.id }
            - call: "POST /care/background-checks/${bgc}/decision"
              payload: { outcome: "CLEARED", expires_at: "2027-01-01T00:00:00Z" }
              as: CareCoordinator
            - call: "POST /care/caregivers/${cg}/bonds"
              payload: { coverage_cents: 5000000, effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }
              as: CareCoordinator
            - call: "POST /care/clients"
              payload: { name: "Client F", home_zip: "90001", hourly_rate_cents: 3000, mileage_rate_cents_per_mile: 75 }
              as: CareCoordinator
              captures: { cl: $.data.id }
            - call: "POST /care/visits"
              payload: { client_id: "${cl}", task_type: "COMPANION", scheduled_start: "2026-03-05T09:00:00Z", scheduled_end: "2026-03-05T12:00:00Z" }
              as: CareCoordinator
              captures: { v: $.data.id, vv: $.data.version }
            - call: "POST /care/visits/${v}/assignments"
              payload: { caregiver_id: "${cg}", expected_visit_version: "${vv}" }
              as: CareCoordinator
            - call: "POST /care/visits/${v}/clock-in"
              payload: { actual_start: "2026-03-05T09:00:00Z" }
              as: Caregiver
              as_user_id: "${cg}"
            - call: "POST /care/visits/${v}/clock-out"
              payload: { actual_end: "2026-03-05T12:00:00Z", mileage_miles: 0 }
              as: Caregiver
              as_user_id: "${cg}"
            - call: "GET /care/invoices?visit_id=${v}"
              as: BillingClerk
              captures: { inv: "$.data[0].id" }
            - call: "POST /care/invoices/${inv}/finalize"
              payload: {}
              as: BillingClerk
            - call: "POST /care/clients/${cl}/ltc-policies"
              payload: { payer_name: "IndemCo", benefit_type: "INDEMNITY", lifetime_max_cents: 1000000, daily_benefit_cents: 5000 }
              as: CareCoordinator
              captures: { pol: $.data.id }
            - call: "POST /care/invoices/${inv}/claims"
              payload: { ltc_policy_id: "${pol}" }
              as: BillingClerk
              captures: { clm: $.data.id }
            - call: "POST /care/claims/${clm}/submit"
              payload: {}
              as: BillingClerk
            - call: "POST /care/claims/${clm}/request-info"
              payload: { note: "need EOB" }
              as: BillingClerk
          trigger:
            - call: "POST /care/claims/${clm}/submit"
              payload: {}
              as: BillingClerk
          assert:
            - "ReimbursementClaim.${clm}.status == SUBMITTED"

  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: client_suspend_cascade_depth3
        grounds:
          - state_machines.Client.ACTIVE_to_SUSPENDED
          - state_machines.RecurringSchedule.ACTIVE_to_PAUSED
          - state_machines.Visit.SCHEDULED_to_CANCELLED
          - state_machines.Assignment.CONFIRMED_to_CANCELLED
        distinguishing_aspect: "Suspending the client drives Client.SUSPENDED -> Schedule.PAUSED -> Visit.CANCELLED -> Assignment.CANCELLED, each hop caused by the previous, and releases the caregiver's committed_minutes to 0 (depth-3 cascade)."
        test_recipe:
          setup:
            - "Active client with an ACTIVE weekly THU schedule; one generated SCHEDULED visit on 2026-03-05; a cleared bonded caregiver CONFIRMED on it (committed_minutes 180)."
          setup_api_calls:
            - call: "POST /care/caregivers"
              payload: { name: "CG G", home_zip: "90001" }
              as: CareCoordinator
              captures: { cg: $.data.id }
            - call: "POST /care/caregivers/${cg}/background-checks"
              payload: {}
              as: CareCoordinator
              captures: { bgc: $.data.id }
            - call: "POST /care/background-checks/${bgc}/decision"
              payload: { outcome: "CLEARED", expires_at: "2027-01-01T00:00:00Z" }
              as: CareCoordinator
            - call: "POST /care/caregivers/${cg}/bonds"
              payload: { coverage_cents: 5000000, effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }
              as: CareCoordinator
            - call: "POST /care/clients"
              payload: { name: "Client G", home_zip: "90001", hourly_rate_cents: 3000, mileage_rate_cents_per_mile: 75 }
              as: CareCoordinator
              captures: { cl: $.data.id }
            - call: "POST /care/clients/${cl}/schedules"
              payload: { task_type: "COMPANION", frequency: "WEEKLY", day_of_week: "THU", start_time: "09:00", duration_minutes: 180, start_date: "2026-03-01T00:00:00Z", end_date: "2026-03-31T00:00:00Z" }
              as: CareCoordinator
              captures: { sch: $.data.id }
            - call: "POST /care/schedules/${sch}/generate-visits"
              payload: { from_date: "2026-03-05T00:00:00Z", to_date: "2026-03-05T23:59:59Z" }
              as: CareCoordinator
              captures: { v: "$.data[0].id", vv: "$.data[0].version" }
            - call: "POST /care/visits/${v}/assignments"
              payload: { caregiver_id: "${cg}", expected_visit_version: "${vv}" }
              as: CareCoordinator
              captures: { asg: $.data.id }
          trigger:
            - call: "POST /care/clients/${cl}/suspend"
              payload: {}
              as: CareCoordinator
          assert:
            - "Client.${cl}.status == SUSPENDED"
            - "RecurringSchedule.${sch}.status == PAUSED"
            - "Visit.${v}.status == CANCELLED"
            - "Assignment.${asg}.status == CANCELLED"
            - "Caregiver.${cg}.committed_minutes == 0"

      - name: invoice_void_cascade_withdraws_claim
        grounds:
          - state_machines.Invoice.FINALIZED_to_VOID
          - state_machines.ReimbursementClaim.SUBMITTED_to_WITHDRAWN
          - entities.Client.fields.outstanding_balance_cents
        distinguishing_aspect: "Voiding a FINALIZED invoice drives Invoice.VOID -> Claim.WITHDRAWN (hop caused by the void) and reverses the 9000c debit, leaving outstanding_balance_cents at 0 (depth-2 cascade from a different trigger than the suspend chain)."
        test_recipe:
          setup:
            - "A FINALIZED invoice (total 9000, balance 9000) with a SUBMITTED claim against it."
          setup_api_calls:
            - call: "POST /care/caregivers"
              payload: { name: "CG H", home_zip: "90001" }
              as: CareCoordinator
              captures: { cg: $.data.id }
            - call: "POST /care/caregivers/${cg}/background-checks"
              payload: {}
              as: CareCoordinator
              captures: { bgc: $.data.id }
            - call: "POST /care/background-checks/${bgc}/decision"
              payload: { outcome: "CLEARED", expires_at: "2027-01-01T00:00:00Z" }
              as: CareCoordinator
            - call: "POST /care/caregivers/${cg}/bonds"
