            - call: "POST /watch/incident-reports"
              payload: { block_id: "${b1}", reporter_member_id: "${m1}", category: "OTHER", occurred_at: "2026-07-15T10:00:00Z", severity: 2 }
              as: Member
              as_user_id: "${m1}"
              captures: { r1: $.data.id }
            - call: "POST /watch/incident-reports/${r1}/begin-review"
              payload: {}
              as: ProgramCoordinator
            - call: "POST /watch/incident-reports"
