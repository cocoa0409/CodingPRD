      - name: decision_requires_certified_institution
        grounds:
          - state_machines.AccountApplication.SUBMITTED_to_OPENED
          - "validations[priority=9]"
          - "errors[ERR_INSTITUTION_NOT_CERTIFIED]"
        distinguishing_aspect: |
          Entity pair AccountApplication -> PartnerInstitution: an application created while
          the institution was CERTIFIED cannot be APPROVEd after the institution is SUSPENDED;
          the decision transition re-checks the parent institution's live state.
        test_recipe:
          setup:
            - "CERTIFIED institution; participant fully documented; application SUBMITTED while CERTIFIED"
            - "Institution then SUSPENDED before the decision call"
          setup_api_calls:
            - { call: "POST /api/account-standards", payload: { code: "BO-2026", name: "Bank On 2026", effective_from: "2026-01-01", monthly_fee_cap_cents: 500, overdraft_fee_allowed: false, min_opening_deposit_cap_cents: 2500, accepted_alt_id_types: ["MATRICULA_CONSULAR"], chex_second_look_required: true, requires_financial_education: false, rubric_mode: "STANDARD_RUBRIC" }, as: CoalitionAdmin, captures: { std_id: $.data.id } }
            - { call: "POST /api/account-standards/${std_id}/activate", payload: {}, as: CoalitionAdmin }
