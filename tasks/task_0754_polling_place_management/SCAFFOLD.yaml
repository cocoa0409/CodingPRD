    path: "/poll-workers/{id}/complete-training"
    description: "Mark a worker CERTIFIED after training."
    roles: [ElectionAdmin]
    code: 200
    input: []
    output: PollWorker
    side_effects: ["training_status PENDING -> CERTIFIED", "increments PollWorker.version by 1"]

  - method: POST
    path: "/assignments"
    description: "Propose assigning a worker to a place."
    roles: [PrecinctCaptain, ElectionAdmin]
    code: 201
    input: [poll_worker_id, polling_place_id, "is_lead?"]
    output: Assignment
    side_effects: []
  - method: GET
    path: "/assignments/{id}"
    description: "Fetch an assignment."
    roles: [ElectionAdmin, PrecinctCaptain, CustodyOfficer, SupportAgent, PollWorker]
    code: 200
    input: []
    output: Assignment
    side_effects: []
  - method: GET
    path: "/assignments"
    description: "List assignments; filterable by worker and/or place."
    roles: [ElectionAdmin, PrecinctCaptain, CustodyOfficer, SupportAgent, PollWorker]
    code: 200
    input: ["poll_worker_id?", "polling_place_id?", "limit?", "offset?"]
    output: Assignment[]
    side_effects: []
  - method: POST
    path: "/assignments/{id}/activate"
    description: "Activate an assignment (fills a staffing slot)."
    roles: [PrecinctCaptain, ElectionAdmin]
    code: 200
    input: []
    output: Assignment
    side_effects: ["status PROPOSED -> ACTIVE", "place.slots_filled += 1; place.slots_open -= 1", "increments Assignment.version by 1"]
  - method: POST
    path: "/assignments/{id}/withdraw"
    description: "Withdraw an assignment (releases a slot if it was ACTIVE)."
    roles: [PrecinctCaptain, ElectionAdmin]
    code: 200
    input: []
    output: Assignment
    side_effects: ["status -> WITHDRAWN", "if was ACTIVE: place.slots_filled -= 1; place.slots_open += 1", "increments Assignment.version by 1"]

  - method: POST
    path: "/shifts"
    description: "Schedule a shift for an active assignment."
    roles: [PrecinctCaptain, ElectionAdmin]
    code: 201
    input: [assignment_id, scheduled_start, scheduled_end]
    output: Shift
    side_effects: ["copy poll_worker_id/polling_place_id/is_lead from assignment", "compute scheduled_hours and scheduled_pay_cents (scheduled_projection variant)", "enforce per-worker overlap and place capacity"]
  - method: GET
    path: "/shifts/{id}"
    description: "Fetch a shift with computed hours and pay."
    roles: [ElectionAdmin, PrecinctCaptain, CustodyOfficer, SupportAgent, PollWorker]
    code: 200
    input: []
