# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# On-Call Emergency Maintenance Rotation. Breadth walk over §1.1–§1.7 claims not
# already covered by SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8). Sections and
# claim_type values follow references/claim-extraction-guide.md.
# Names are unique across BOTH design files.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------
  - section: entities
    instances:
      - name: technician_creation_applies_system_defaults
        claim_type: defaults
        grounds: [entities.Technician.fields.status, entities.Technician.fields.callback_minutes_168h, entities.Technician.fields.fatigue_block_until]
        distinguishing_aspect: "A freshly created technician is ACTIVE with a zeroed fatigue ledger and version 1; system fields are server-stamped."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /v1/technicians", payload: { full_name: "New Tech", capability: "TECHNICIAN", base_hourly_rate_cents: 5000, on_call_differential_bp: 1000 }, as: PropertyAdmin, captures: { st: $.data.status, cb: $.data.callback_minutes_168h, fb: $.data.fatigue_block_until, v: $.data.version } }
          assert:
            - "status == ACTIVE (default)"
            - "callback_minutes_168h == 0 and fatigue_block_until == null"
            - "version == 1; id is a server-minted UUID; created_at/updated_at present"

      - name: unit_get_roundtrip_returns_stored_fields
        claim_type: retrieval
        grounds: [entities.Unit.fields.unit_number, entities.Unit.fields.habitability_status]
        distinguishing_aspect: "GET returns exactly what POST stored plus the system default HABITABLE."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /v1/units", payload: { unit_number: "A-1", building_code: "BA" }, as: PropertyAdmin, captures: { u: $.data.id } }
          trigger:
            - { call: "GET /v1/units/${u}", as: Dispatcher, captures: { un: $.data.unit_number, hb: $.data.habitability_status } }
          assert:
            - "unit_number == A-1, building_code == BA"
            - "habitability_status == HABITABLE"

      - name: paystatement_is_immutable_without_version
        claim_type: immutability
        grounds: [entities.PayStatement]
        distinguishing_aspect: "PayStatement has common_fields: false — its representation carries id + created_at only; no version / updated_at keys exist and no update endpoint exists."
        test_recipe:
          setup: ["one technician with one COMPLETED shift inside a closed pay period"]
          setup_api_calls:
            - { call: "POST /v1/technicians", payload: { full_name: "Pat Tech", capability: "TECHNICIAN", base_hourly_rate_cents: 6000, on_call_differential_bp: 1500 }, as: PropertyAdmin, captures: { t1: $.data.id } }
            - { call: "POST /v1/rotation-shifts", payload: { technician_id: "${t1}", start_at: "2026-08-01T01:00:00Z", end_at: "2026-08-01T02:00:00Z" }, as: PropertyAdmin, captures: { s1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T01:30:00Z" }, as: PropertyAdmin }
            - { call: "POST /v1/rotation-shifts/${s1}/start", as: PropertyAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T03:00:00Z" }, as: PropertyAdmin }
            - { call: "POST /v1/rotation-shifts/${s1}/complete", as: PropertyAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-08T00:00:00Z" }, as: PropertyAdmin }
            - { call: "POST /v1/pay-periods", payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-08T00:00:00Z" }, as: PropertyAdmin, captures: { pp: $.data.id } }
            - { call: "POST /v1/pay-periods/${pp}/close", as: PropertyAdmin }
          trigger:
            - { call: "GET /v1/pay-statements?pay_period_id=${pp}", as: PropertyAdmin, captures: { psid: "$.data[0].id" } }
          assert:
            - "PayStatement ${psid} has id and created_at but NO version and NO updated_at keys"
            - "No PUT/PATCH/DELETE endpoint exists for /v1/pay-statements (append-only)"

      - name: list_rotation_shifts_paginates_with_envelope
        claim_type: listing
        grounds: [response_envelope, entities.RotationShift]
        distinguishing_aspect: "List honors limit/offset with total_count and has_more; envelope carries meta.api_request_id and response_type array."
        test_recipe:
          setup: ["two technicians with one shift each (two shifts total)"]
          setup_api_calls:
            - { call: "POST /v1/technicians", payload: { full_name: "Pat Tech", capability: "TECHNICIAN", base_hourly_rate_cents: 4800, on_call_differential_bp: 1500 }, as: PropertyAdmin, captures: { t1: $.data.id } }
            - { call: "POST /v1/technicians", payload: { full_name: "Terry Two", capability: "TECHNICIAN", base_hourly_rate_cents: 4800, on_call_differential_bp: 1500 }, as: PropertyAdmin, captures: { t2: $.data.id } }
            - { call: "POST /v1/rotation-shifts", payload: { technician_id: "${t1}", start_at: "2026-08-01T08:00:00Z", end_at: "2026-08-01T16:00:00Z" }, as: PropertyAdmin }
            - { call: "POST /v1/rotation-shifts", payload: { technician_id: "${t2}", start_at: "2026-08-01T08:00:00Z", end_at: "2026-08-01T16:00:00Z" }, as: PropertyAdmin }
          trigger:
            - { call: "GET /v1/rotation-shifts?limit=1&offset=0", as: PropertyAdmin }
            - { call: "GET /v1/rotation-shifts?limit=1&offset=1", as: PropertyAdmin }
          assert:
            - "page 1: exactly 1 row, total_count == 2, has_more == true"
            - "page 2: exactly 1 row, has_more == false"
            - "both responses: meta.api_request_id and meta.api_request_timestamp present; response_type == array"

      - name: ticket_create_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.CallTicket.fields.category, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "An out-of-enum category is rejected at priority 4 before any state/business logic."
        test_recipe:
          setup: ["unit exists"]
          setup_api_calls:
            - { call: "POST /v1/units", payload: { unit_number: "A-2", building_code: "BA" }, as: PropertyAdmin, captures: { u: $.data.id } }
          trigger:
            - { call: "POST /v1/call-tickets", payload: { unit_id: "${u}", caller_name: "X", caller_phone: "555", category: "BROKEN_PIPE", description: "bad enum" }, as: Dispatcher, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_INVALID_REQUEST (400); no ticket row created"]

      - name: shift_create_inverted_window_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.RotationShift.fields.end_at, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "end_at <= start_at is a request-shape error (400), not an overlap error."
        test_recipe:
          setup: ["technician exists"]
          setup_api_calls:
            - { call: "POST /v1/technicians", payload: { full_name: "Pat Tech", capability: "TECHNICIAN", base_hourly_rate_cents: 4800, on_call_differential_bp: 1500 }, as: PropertyAdmin, captures: { t1: $.data.id } }
          trigger:
            - { call: "POST /v1/rotation-shifts", payload: { technician_id: "${t1}", start_at: "2026-08-01T16:00:00Z", end_at: "2026-08-01T08:00:00Z" }, as: PropertyAdmin, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_INVALID_REQUEST (400)"]

      - name: get_technician_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_TECHNICIAN_NOT_FOUND]"]
        distinguishing_aspect: "Unknown technician id -> 404 with the technician-specific error code."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /v1/technicians/00000000-0000-4000-8000-000000000001", as: PropertyAdmin, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_TECHNICIAN_NOT_FOUND (404)"]

      - name: get_unit_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_UNIT_NOT_FOUND]"]
        distinguishing_aspect: "Unknown unit id -> 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /v1/units/00000000-0000-4000-8000-000000000002", as: PropertyAdmin, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_UNIT_NOT_FOUND (404)"]

      - name: get_vendor_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_VENDOR_NOT_FOUND]"]
        distinguishing_aspect: "Unknown vendor id -> 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /v1/vendors/00000000-0000-4000-8000-000000000003", as: PropertyAdmin, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_VENDOR_NOT_FOUND (404)"]

      - name: get_rotation_shift_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_ROTATION_SHIFT_NOT_FOUND]"]
        distinguishing_aspect: "Unknown shift id -> 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /v1/rotation-shifts/00000000-0000-4000-8000-000000000004", as: PropertyAdmin, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_ROTATION_SHIFT_NOT_FOUND (404)"]

      - name: get_call_ticket_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_CALL_TICKET_NOT_FOUND]"]
        distinguishing_aspect: "Unknown ticket id -> 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /v1/call-tickets/00000000-0000-4000-8000-000000000005", as: Dispatcher, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_CALL_TICKET_NOT_FOUND (404)"]

      - name: get_work_order_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_WORK_ORDER_NOT_FOUND]"]
        distinguishing_aspect: "Unknown work order id -> 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /v1/work-orders/00000000-0000-4000-8000-000000000006", as: PropertyAdmin, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_WORK_ORDER_NOT_FOUND (404)"]

      - name: get_vendor_authorization_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_VENDOR_AUTHORIZATION_NOT_FOUND]"]
        distinguishing_aspect: "Unknown vendor authorization id -> 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /v1/vendor-authorizations/00000000-0000-4000-8000-000000000007", as: PropertyAdmin, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_VENDOR_AUTHORIZATION_NOT_FOUND (404)"]

      - name: get_relocation_case_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_RELOCATION_CASE_NOT_FOUND]"]
        distinguishing_aspect: "Unknown relocation case id -> 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /v1/relocation-cases/00000000-0000-4000-8000-000000000008", as: PropertyAdmin, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_RELOCATION_CASE_NOT_FOUND (404)"]

      - name: get_incident_record_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_INCIDENT_RECORD_NOT_FOUND]"]
        distinguishing_aspect: "Unknown incident record id -> 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /v1/incident-records/00000000-0000-4000-8000-000000000009", as: PropertyAdmin, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_INCIDENT_RECORD_NOT_FOUND (404)"]

      - name: get_pay_period_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_PAY_PERIOD_NOT_FOUND]"]
        distinguishing_aspect: "Unknown pay period id -> 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /v1/pay-periods/00000000-0000-4000-8000-00000000000a", as: PropertyAdmin, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_PAY_PERIOD_NOT_FOUND (404)"]

      - name: get_pay_statement_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_PAY_STATEMENT_NOT_FOUND]", entities.PayStatement]
        distinguishing_aspect: "Unknown pay statement id -> 404 with the statement-specific error code."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /v1/pay-statements/00000000-0000-4000-8000-00000000000b", as: PropertyAdmin, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_PAY_STATEMENT_NOT_FOUND (404)"]

  # ---------------------------------------------------------------
  - section: state_machines
    instances:
      - name: ticket_close_from_received_rejected
        claim_type: invalid_transition
        grounds: [state_machines.CallTicket, "errors[ERR_CALL_TICKET_INVALID_STATE]"]
        distinguishing_aspect: "Close is legal only from MITIGATED; from RECEIVED it fails with the ticket state error and no timestamps are written."
        test_recipe:
          setup: ["unit + ticket in RECEIVED"]
          setup_api_calls:
            - { call: "POST /v1/units", payload: { unit_number: "S-1", building_code: "BS" }, as: PropertyAdmin, captures: { u: $.data.id } }
            - { call: "POST /v1/call-tickets", payload: { unit_id: "${u}", caller_name: "X", caller_phone: "555", category: "APPLIANCE", description: "dishwasher leak" }, as: Dispatcher, captures: { tk: $.data.id } }
          trigger:
            - { call: "POST /v1/call-tickets/${tk}/close", as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CALL_TICKET_INVALID_STATE (409)"
            - "CallTicket.${tk}.status still RECEIVED; closed_at remains null"

      - name: deferred_ticket_terminal_and_creates_deferred_work_order
        claim_type: terminal_state_lockdown
        grounds: [state_machines.CallTicket.RECEIVED_to_DEFERRED, state_machines.CallTicket.TRIAGED_to_DISPATCHED, state_machines.WorkOrder]
        distinguishing_aspect: "Triage with is_true_emergency=false lands in terminal DEFERRED and auto-creates a DEFERRED-priority work order; a later dispatch attempt is a state error even with a fresh OCC version."
        test_recipe:
          setup: ["unit, technician T1, ticket triaged as non-emergency"]
          setup_api_calls:
            - { call: "POST /v1/units", payload: { unit_number: "S-2", building_code: "BS" }, as: PropertyAdmin, captures: { u: $.data.id } }
            - { call: "POST /v1/technicians", payload: { full_name: "Pat Tech", capability: "TECHNICIAN", base_hourly_rate_cents: 4800, on_call_differential_bp: 1500 }, as: PropertyAdmin, captures: { t1: $.data.id } }
            - { call: "POST /v1/call-tickets", payload: { unit_id: "${u}", caller_name: "X", caller_phone: "555", category: "APPLIANCE", description: "dishwasher hums" }, as: Dispatcher, captures: { tk: $.data.id } }
            - { call: "POST /v1/call-tickets/${tk}/triage", payload: { is_true_emergency: false }, as: Dispatcher, captures: { st: $.data.status } }
          trigger:
            - { call: "GET /v1/work-orders?call_ticket_id=${tk}", as: Dispatcher, captures: { wop: "$.data[0].priority", wos: "$.data[0].status" } }
            - { call: "GET /v1/call-tickets/${tk}", as: Dispatcher, captures: { tv: $.data.version } }
            - { call: "POST /v1/call-tickets/${tk}/dispatch", payload: { technician_id: "${t1}", expected_call_ticket_version: "${tv}" }, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "triage response status == DEFERRED (terminal)"
            - "auto-created WorkOrder exists with priority == DEFERRED and status == OPEN"
            - "dispatch on the DEFERRED ticket fails: ERR_CALL_TICKET_INVALID_STATE (409)"

      - name: completed_shift_cannot_be_cancelled
        claim_type: terminal_state_lockdown
        grounds: [state_machines.RotationShift, "errors[ERR_ROTATION_SHIFT_INVALID_STATE]"]
        distinguishing_aspect: "COMPLETED is terminal; cancel is rejected and provisional pay fields remain intact."
        test_recipe:
          setup: ["T1 with a COMPLETED shift (2026-08-01 01:00-02:00)"]
          setup_api_calls:
            - { call: "POST /v1/technicians", payload: { full_name: "Pat Tech", capability: "TECHNICIAN", base_hourly_rate_cents: 4800, on_call_differential_bp: 1500 }, as: PropertyAdmin, captures: { t1: $.data.id } }
            - { call: "POST /v1/rotation-shifts", payload: { technician_id: "${t1}", start_at: "2026-08-01T01:00:00Z", end_at: "2026-08-01T02:00:00Z" }, as: PropertyAdmin, captures: { s1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T01:30:00Z" }, as: PropertyAdmin }
            - { call: "POST /v1/rotation-shifts/${s1}/start", as: PropertyAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T03:00:00Z" }, as: PropertyAdmin }
            - { call: "POST /v1/rotation-shifts/${s1}/complete", as: PropertyAdmin, captures: { prov: $.data.provisional_shift_pay_cents } }
          trigger:
            - { call: "POST /v1/rotation-shifts/${s1}/cancel", as: PropertyAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ROTATION_SHIFT_INVALID_STATE (409)"
            - "shift remains COMPLETED with provisional_shift_pay_cents == 5520 (60 min x 4800 x 1.15 / 60)"

      - name: incident_record_return_revision_cycle
        claim_type: valid_transition
        grounds: [state_machines.IncidentRecord.UNDER_REVIEW_to_RETURNED, state_machines.IncidentRecord.RETURNED_to_DRAFT]
        distinguishing_aspect: "The DRAFT <- RETURNED loop lets the creator replace narrative/damage and resubmit; version increments on revise."
        test_recipe:
          setup: ["ticket ON_SCENE with T1 assigned; S1 supervisor; IR created (DRAFT), submitted, under review, RETURNED with reason"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: PropertyAdmin }
            - { call: "POST /v1/technicians", payload: { full_name: "Pat Tech", capability: "TECHNICIAN", base_hourly_rate_cents: 4800, on_call_differential_bp: 1500 }, as: PropertyAdmin, captures: { t1: $.data.id } }
            - { call: "POST /v1/technicians", payload: { full_name: "Sam Sup", capability: "SUPERVISOR", base_hourly_rate_cents: 6000, on_call_differential_bp: 1500 }, as: PropertyAdmin, captures: { sup1: $.data.id } }
            - { call: "POST /v1/units", payload: { unit_number: "S-3", building_code: "BS" }, as: PropertyAdmin, captures: { u: $.data.id } }
            - { call: "POST /v1/rotation-shifts", payload: { technician_id: "${t1}", start_at: "2026-08-03T00:00:00Z", end_at: "2026-08-03T08:00:00Z" }, as: PropertyAdmin, captures: { sh: $.data.id } }
            - { call: "POST /v1/rotation-shifts/${sh}/start", as: PropertyAdmin }
            - { call: "POST /v1/call-tickets", payload: { unit_id: "${u}", caller_name: "X", caller_phone: "555", category: "APPLIANCE", description: "sparking outlet" }, as: Dispatcher, captures: { tk: $.data.id } }
            - { call: "POST /v1/call-tickets/${tk}/triage", payload: { is_true_emergency: true }, as: Dispatcher }
            - { call: "GET /v1/call-tickets/${tk}", as: Dispatcher, captures: { tv: $.data.version } }
            - { call: "POST /v1/call-tickets/${tk}/dispatch", payload: { technician_id: "${t1}", expected_call_ticket_version: "${tv}" }, as: Dispatcher }
            - { call: "POST /v1/call-tickets/${tk}/arrive", as: OnCallTechnician, as_user_id: "${t1}" }
            - { call: "POST /v1/call-tickets/${tk}/incident-record", payload: { narrative: "v1 narrative", estimated_damage_cents: 30000 }, as: OnCallTechnician, as_user_id: "${t1}", captures: { ir: $.data.id } }
            - { call: "POST /v1/incident-records/${ir}/submit", as: OnCallTechnician, as_user_id: "${t1}" }
            - { call: "POST /v1/incident-records/${ir}/begin-review", as: MaintenanceSupervisor, as_user_id: "${sup1}" }
            - { call: "POST /v1/incident-records/${ir}/return", payload: { reason: "Need moisture readings" }, as: MaintenanceSupervisor, as_user_id: "${sup1}", captures: { st_r: $.data.status } }
          trigger:
            - { call: "POST /v1/incident-records/${ir}/revise", payload: { narrative: "v2 narrative with readings", estimated_damage_cents: 42000 }, as: OnCallTechnician, as_user_id: "${t1}", captures: { st_d: $.data.status, dmg: $.data.estimated_damage_cents } }
            - { call: "POST /v1/incident-records/${ir}/submit", as: OnCallTechnician, as_user_id: "${t1}", captures: { st_s: $.data.status } }
          assert:
            - "st_r == RETURNED, then revise lands st_d == DRAFT with estimated_damage_cents == 42000 (fields replaced)"
            - "second submit succeeds: st_s == SUBMITTED (cycle RETURNED -> DRAFT -> SUBMITTED traversed)"

      - name: relocation_reject_resubmit_cycle
        claim_type: valid_transition
        grounds: [state_machines.RelocationCase.PROPOSED_to_REJECTED, state_machines.RelocationCase.REJECTED_to_PROPOSED]
        distinguishing_aspect: "REJECTED is not a dead end: resubmit re-enters PROPOSED with amended dates/rate, recomputed estimate, and the reject reason preserved for audit."
        test_recipe:
          setup: ["ticket mitigated unit_uninhabitable=true; RC proposed by T1 (2026-08-03..2026-08-06, 15000) then REJECTED by S1"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PropertyAdmin }
            - { call: "POST /v1/technicians", payload: { full_name: "Pat Tech", capability: "TECHNICIAN", base_hourly_rate_cents: 4800, on_call_differential_bp: 1500 }, as: PropertyAdmin, captures: { t1: $.data.id } }
            - { call: "POST /v1/technicians", payload: { full_name: "Sam Sup", capability: "SUPERVISOR", base_hourly_rate_cents: 6000, on_call_differential_bp: 1500 }, as: PropertyAdmin, captures: { sup1: $.data.id } }
            - { call: "POST /v1/units", payload: { unit_number: "S-4", building_code: "BS" }, as: PropertyAdmin, captures: { u: $.data.id } }
            - { call: "POST /v1/rotation-shifts", payload: { technician_id: "${t1}", start_at: "2026-08-01T00:00:00Z", end_at: "2026-08-01T08:00:00Z" }, as: PropertyAdmin, captures: { sh: $.data.id } }
            - { call: "POST /v1/rotation-shifts/${sh}/start", as: PropertyAdmin }
            - { call: "POST /v1/call-tickets", payload: { unit_id: "${u}", caller_name: "X", caller_phone: "555", category: "FLOOD", description: "flood" }, as: Dispatcher, captures: { tk: $.data.id } }
            - { call: "POST /v1/call-tickets/${tk}/triage", payload: { is_true_emergency: true }, as: Dispatcher }
            - { call: "GET /v1/call-tickets/${tk}", as: Dispatcher, captures: { tv: $.data.version } }
            - { call: "POST /v1/call-tickets/${tk}/dispatch", payload: { technician_id: "${t1}", expected_call_ticket_version: "${tv}" }, as: Dispatcher }
            - { call: "POST /v1/call-tickets/${tk}/arrive", as: OnCallTechnician, as_user_id: "${t1}" }
            - { call: "POST /v1/call-tickets/${tk}/mitigate", payload: { mitigation_notes: "extracted", unit_uninhabitable: true }, as: OnCallTechnician, as_user_id: "${t1}" }
            - { call: "POST /v1/relocation-cases", payload: { unit_id: "${u}", call_ticket_id: "${tk}", start_date: "2026-08-03T00:00:00Z", end_date: "2026-08-06T00:00:00Z", nightly_rate_cents: 15000 }, as: OnCallTechnician, as_user_id: "${t1}", captures: { rc: $.data.id } }
            - { call: "POST /v1/relocation-cases/${rc}/reject", payload: { reason: "Rate not negotiated" }, as: MaintenanceSupervisor, as_user_id: "${sup1}", captures: { st_r: $.data.status } }
          trigger:
            - { call: "POST /v1/relocation-cases/${rc}/resubmit", payload: { start_date: "2026-08-04T00:00:00Z", end_date: "2026-08-06T00:00:00Z", nightly_rate_cents: 18000 }, as: OnCallTechnician, as_user_id: "${t1}", captures: { st_p: $.data.status, est: $.data.est_cost_cents, rr: $.data.reject_reason } }
            - { call: "POST /v1/relocation-cases/${rc}/approve", as: MaintenanceSupervisor, as_user_id: "${sup1}", captures: { st_a: $.data.status } }
          assert:
            - "st_r == REJECTED then st_p == PROPOSED (cycle) with est_cost_cents == 51000 (2 nights x 18000 + 15000)"
            - "reject_reason 'Rate not negotiated' preserved across the resubmit"
            - "st_a == APPROVED (second review round succeeds)"

      - name: work_order_hold_resume_roundtrip
        claim_type: side_effect_execution
        grounds: [state_machines.WorkOrder.ASSIGNED_to_ON_HOLD, state_machines.WorkOrder.ON_HOLD_to_OPEN, state_machines.RelocationCase.ACTIVE_to_ENDED]
        distinguishing_aspect: "The hold cascade catches ASSIGNED (not just OPEN) standard work orders, and the end-of-relocation resume returns them to OPEN with the assignment cleared — full roundtrip."
        test_recipe:
          setup:
            - "ticket mitigated unit_uninhabitable=true; auto EMERGENCY_FOLLOWUP WO cancelled; manual STANDARD WO created and ASSIGNED to T1"
