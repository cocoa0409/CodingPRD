# =============================================================================
# Scaffold: design-firm project accounting & multiplier billing (task 2812)
# =============================================================================

scenario: |
  2812. Design Firm Project Accounting & Multiplier Billing (architecture and
  engineering firm finance): project setup with contract type, fee structure and
  phase budgets mapped to a work breakdown structure, labor cost rate and billing
  multiplier maintenance with overhead rate audits, percentage-complete revenue
  recognition with earned value assessment by phase, consultant subcontract
  management with markup rules and pay-when-paid terms, reimbursable expense
  tracking and client-specific allowability rules, invoice preparation with backup
  requirements and client review cycles, work-in-progress and unbilled aging
  management with write-off approvals, project profitability analysis and overhead
  rate certification for public clients

domain_name: design-firm-project-accounting
api_prefix: ""    # flat topology: every collection is a top-level path segment

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  difficulty_level: expert_plus
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - derived_field_reconciliation

  entity_topology: flat
  # Every entity is a top-level collection joined by explicit FK fields; the only
  # nesting in the model is Phase.parent_phase_id (self-referential WBS tree),
  # and even that is addressed through the flat /phases collection.

  state_machine_shape: cyclic
  # Invoice loops DRAFT -> PENDING_CLIENT_REVIEW -> REVISION_REQUESTED -> DRAFT with a
  # bounded revision_round; TimeEntry loops APPROVED -> BILLED -> APPROVED on invoice
  # void; ConsultantInvoice carries three independent status axes; WriteOff forks on
  # an approval-routing threshold and joins on APPROVED.

  relationship_patterns:
    - one_to_many          # Project -> Phase / TimeEntry / ExpenseItem / Invoice / WriteOff
    - self_referential     # Phase.parent_phase_id -> Phase.id (work breakdown structure)
    - cross_aggregate      # ConsultantInvoice.client_invoice_id -> Invoice.id; firm-wide OverheadRateCertification gates per-project invoicing
    - polymorphic          # WriteOff.target_type selects which charge population the amount is allocated against

  role_model: segregation_of_duties
  # The user who prepares a charge or a write-off may never be the user who
  # approves it, and the approval level required is chosen by a monetary/aging
  # threshold rather than by the requester.

  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table (12 entities)
# =============================================================================
entities:

  - name: Client
    parent: null
    common_fields: false      # id, created_at only — client billing configuration is immutable once created
    fields:
      - { name: name, type: string, source: input, description: "Client legal name" }
      - { name: is_public_agency, type: boolean, source: input, description: "True when the client is a public agency subject to overhead-rate certification and statutory unallowable-cost rules" }
      - { name: retainage_pct, type: number, source: input, description: "Fraction of each invoice withheld as retainage", constraints: "0.0000-0.2000, 4 decimal places" }
      - { name: expense_markup_pct, type: number, source: input, description: "Markup applied to allowable reimbursable expenses", constraints: "0.0000-0.2500, 4 decimal places" }
      - { name: disallowed_categories, type: array, source: input, description: "Expense categories this client contractually refuses to reimburse", constraints: "subset of {TRAVEL, MILEAGE, PRINTING, MEALS, ENTERTAINMENT, PERMIT_FEE}; may be empty" }
      - { name: receipt_required_above, type: number, source: input, description: "Expense amount at or above which a receipt must be attached before the expense is allowable", constraints: ">= 0.00, 2 decimal places" }
      - { name: review_cycle_days, type: integer, source: input, description: "Contractual number of days the client has to review an invoice; recorded for reporting only", constraints: "1-90" }

  - name: Project
    parent: null
    common_fields: true       # id, created_at, updated_at, version
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; the billing client for this project" }
      - { name: name, type: string, source: input, description: "Project name" }
      - { name: contract_type, type: enum, source: input, description: "FIXED_FEE | TIME_AND_MATERIALS | COST_PLUS_FIXED_FEE" }
      - { name: contract_amount, type: number, source: input, description: "Total contract value; the denominator for PERCENT_OF_CONTRACT phase fees", constraints: "> 0.00, 2 decimal places" }
      - { name: project_manager_user_id, type: string, source: input, description: "Opaque X-User-ID of the ProjectManager who owns this project; compared against the acting X-User-ID, never against any entity id" }
      - { name: percent_complete_method, type: enum, source: input, description: "EFFORT_BASED | ASSESSED — selects which phase_earned_value variant feeds earned_revenue_to_date" }
      - { name: target_multiplier, type: number, source: input, description: "Multiplier the firm targets on this project; reported against net_multiplier_achieved", constraints: "1.0000-6.0000, 4 decimal places" }
      - { name: wip_alert_threshold, type: number, source: input, default: 50000.00, description: "unbilled_wip level above which billing_posture becomes REVIEW_REQUIRED", constraints: ">= 0.00, 2 decimal places" }
      - { name: status, type: enum, source: system, description: "SETUP | ACTIVE | CLOSED", default: SETUP }
      - { name: locked_through_date, type: string, source: system, description: "Accounting period lock; work_date on or before this date is closed to new labor. Null until POST /projects/{project_id}/lock-period", constraints: "ISO 8601 date (YYYY-MM-DD) or null" }
      - { name: billing_posture, type: enum, source: computed, description: "OPEN | REVIEW_REQUIRED | HOLD — derived by project_billing_posture; gates invoice creation and new consultant commitments" }
      - { name: certified_multiplier_ceiling, type: number, source: computed, description: "Maximum billing multiplier permitted on a public-agency project, derived from the CERTIFIED overhead rate; null when no certification exists for the current fiscal year", constraints: "4 decimal places or null" }
      - { name: earned_revenue_to_date, type: number, source: computed, description: "Sum of recognized_earned_value over the project's leaf phases", constraints: "2 decimal places" }
      - { name: unbilled_wip, type: number, source: computed, description: "Billable value of charges that are approved/allowable but attached to no invoice", constraints: "2 decimal places" }
      - { name: billed_open, type: number, source: computed, description: "Sum of Invoice.gross_billed for invoices in {DRAFT, PENDING_CLIENT_REVIEW, REVISION_REQUESTED, APPROVED}", constraints: "2 decimal places" }
      - { name: paid_gross_to_date, type: number, source: computed, description: "Sum of Invoice.gross_billed for invoices in {PAID}", constraints: "2 decimal places" }
      - { name: written_off_gross, type: number, source: computed, description: "Sum of Invoice.gross_billed for invoices in {WRITTEN_OFF} plus billable_amount of TimeEntry rows in {WRITTEN_OFF}", constraints: "2 decimal places" }
      - { name: raw_labor_cost_to_date, type: number, source: computed, description: "Sum of TimeEntry.raw_cost for entries in {APPROVED, BILLED, WRITTEN_OFF}", constraints: "2 decimal places" }
      - { name: total_charge_value, type: number, source: computed, description: "Conserved quantity: unbilled_wip + billed_open + paid_gross_to_date + written_off_gross", constraints: "2 decimal places" }
      - { name: net_multiplier_achieved, type: number, source: computed, description: "Billable labor value divided by raw labor cost; 0.0000 when raw_labor_cost_to_date == 0.00", constraints: "4 decimal places" }
      - { name: overhead_adjustment_required, type: boolean, source: system, default: false, description: "Set true only by the Controller branch of write_off_approval; flags the project for disclosure in the next overhead certification" }

  - name: Phase
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; owning project" }
      - { name: parent_phase_id, type: string, source: input, description: "FK -> Phase.id; parent work breakdown structure node, null for a top-level phase", constraints: "must belong to the same project; must not create a cycle" }
      - { name: wbs_code, type: string, source: input, description: "Work breakdown structure code", constraints: "unique per project_id" }
      - { name: fee_basis, type: enum, source: input, description: "PERCENT_OF_CONTRACT | LUMP_SUM" }
      - { name: fee_percent, type: number, source: input, description: "Fraction of Project.contract_amount allocated to this phase; required when fee_basis == PERCENT_OF_CONTRACT, must be omitted otherwise", constraints: "0.0001-1.0000, 4 decimal places" }
      - { name: lump_sum_fee, type: number, source: input, description: "Fixed fee for this phase; required when fee_basis == LUMP_SUM, must be omitted otherwise", constraints: "> 0.00, 2 decimal places" }
      - { name: phase_fee, type: number, source: computed, description: "round_half_up(Project.contract_amount * fee_percent, 2) when PERCENT_OF_CONTRACT, else lump_sum_fee", constraints: "2 decimal places" }
      - { name: budget_labor_cost, type: number, source: input, description: "Budgeted raw labor cost for this phase; denominator of the EFFORT_BASED percent complete", constraints: ">= 0.00, 2 decimal places" }
      - { name: consultant_budget, type: number, source: input, description: "Consultant commitment capacity for this phase, enforced per overlapping commitment window", constraints: ">= 0.00, 2 decimal places" }
      - { name: status, type: enum, source: system, description: "PLANNED | IN_PROGRESS | COMPLETE", default: PLANNED }
      - { name: assessed_percent_complete, type: number, source: input, default: 0.0000, description: "ProjectManager physical-completion assessment written by POST /phases/{phase_id}/assess", constraints: "0.0000-1.0000, 4 decimal places" }
      - { name: is_leaf, type: boolean, source: computed, description: "True when no Phase declares this phase as parent_phase_id; only leaf phases may carry charges" }
      - { name: depth, type: integer, source: computed, description: "0 for a top-level phase, parent.depth + 1 otherwise" }
      - { name: actual_labor_cost_to_date, type: number, source: computed, description: "Sum of TimeEntry.raw_cost on this phase for entries in {APPROVED, BILLED, WRITTEN_OFF}", constraints: "2 decimal places" }
      - { name: effort_based_percent_complete, type: number, source: computed, description: "min(1.0000, round_half_up(actual_labor_cost_to_date / budget_labor_cost, 4)); 0.0000 when budget_labor_cost == 0.00", constraints: "4 decimal places" }
      - { name: effort_based_earned_value, type: number, source: computed, description: "round_half_up(phase_fee * effort_based_percent_complete, 2)", constraints: "2 decimal places" }
      - { name: assessed_earned_value, type: number, source: computed, description: "round_half_up(phase_fee * assessed_percent_complete, 2)", constraints: "2 decimal places" }
      - { name: recognized_earned_value, type: number, source: computed, description: "The variant selected by Project.percent_complete_method; forced to phase_fee once status == COMPLETE", constraints: "2 decimal places" }
      - { name: consultant_committed_open, type: number, source: computed, description: "Sum of ConsultantSubcontract.committed_amount on this phase for subcontracts in {EXECUTED}", constraints: "2 decimal places" }

  - name: LaborRate
    parent: null
    common_fields: false      # id, created_at only — rate history is append-only and never mutated
    fields:
      - { name: role_code, type: enum, source: input, description: "PRINCIPAL | PROJECT_ARCHITECT | DESIGNER | ADMIN — firm-wide labor grade" }
      - { name: raw_cost_rate, type: number, source: input, description: "Hourly raw cost rate for this role", constraints: "> 0.00, 2 decimal places" }
      - { name: effective_from, type: string, source: input, description: "Inclusive start of the rate's effective interval", constraints: "ISO 8601 date (YYYY-MM-DD)" }
      - { name: effective_to, type: string, source: input, description: "Exclusive end of the rate's effective interval; omitted means open-ended", constraints: "ISO 8601 date (YYYY-MM-DD) or null; must be > effective_from" }

  - name: BillingMultiplier
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; multipliers are maintained per project" }
      - { name: multiplier, type: number, source: input, description: "Factor applied to rounded raw labor cost to produce the billable amount", constraints: "1.0000-6.0000, 4 decimal places" }
      - { name: effective_from, type: string, source: input, description: "Inclusive start of the multiplier's effective interval", constraints: "ISO 8601 date (YYYY-MM-DD)" }
      - { name: effective_to, type: string, source: system, description: "Exclusive end of the interval; null while ACTIVE, set to the successor's effective_from when superseded", constraints: "ISO 8601 date (YYYY-MM-DD) or null" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUPERSEDED", default: ACTIVE }

  - name: TimeEntry
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; owning project" }
      - { name: phase_id, type: string, source: input, description: "FK -> Phase.id; charged phase, must be a leaf of the same project" }
      - { name: role_code, type: enum, source: input, description: "PRINCIPAL | PROJECT_ARCHITECT | DESIGNER | ADMIN — selects the LaborRate row" }
      - { name: hours, type: number, source: input, description: "Hours worked", constraints: "> 0.00, <= 24.00, 2 decimal places" }
      - { name: work_date, type: string, source: input, description: "Date the work was performed; drives both rate and multiplier lookup and WIP aging", constraints: "ISO 8601 date (YYYY-MM-DD)" }
      - { name: submitted_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the submitter, captured from the request header" }
      - { name: approved_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the approver; null until approval" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | BILLED | WRITTEN_OFF", default: SUBMITTED }
      - { name: raw_cost, type: number, source: computed, description: "round_half_up(hours * LaborRate.raw_cost_rate, 2), frozen at approval", constraints: "2 decimal places" }
      - { name: billable_amount, type: number, source: computed, description: "round_half_up(raw_cost * BillingMultiplier.multiplier, 2), frozen at approval", constraints: "2 decimal places" }
      - { name: applied_multiplier, type: number, source: computed, description: "The BillingMultiplier.multiplier value used, frozen at approval", constraints: "4 decimal places" }
      - { name: billed_invoice_id, type: string, source: system, description: "FK -> Invoice.id; the invoice that swept this entry, null while unbilled" }

  - name: ExpenseItem
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; owning project" }
      - { name: phase_id, type: string, source: input, description: "FK -> Phase.id; charged phase, must be a leaf of the same project" }
      - { name: category, type: enum, source: input, description: "TRAVEL | MILEAGE | PRINTING | MEALS | ENTERTAINMENT | PERMIT_FEE" }
      - { name: amount, type: number, source: input, description: "Incurred cost before markup", constraints: "> 0.00, 2 decimal places" }
      - { name: incurred_on, type: string, source: input, description: "Date the cost was incurred; drives WIP aging and invoice sweep eligibility", constraints: "ISO 8601 date (YYYY-MM-DD)" }
      - { name: receipt_attached, type: boolean, source: input, description: "Whether backup documentation is on file" }
      - { name: incurred_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the submitter, captured from the request header" }
      - { name: allowability_status, type: enum, source: system, description: "PENDING_REVIEW | ALLOWED | DISALLOWED — set by expense_allowability_and_markup at creation, changeable only by POST /expenses/{expense_id}/review", default: PENDING_REVIEW }
      - { name: allowability_reason, type: enum, source: system, description: "CLIENT_EXCLUDED | STATUTORY_UNALLOWABLE | RECEIPT_MISSING | ALLOWED_BY_RULE | ALLOWED_BY_REVIEW | DISALLOWED_BY_REVIEW" }
      - { name: billing_status, type: enum, source: system, description: "UNBILLED | BILLED", default: UNBILLED }
      - { name: billable_amount, type: number, source: computed, description: "round_half_up(amount * (1 + Client.expense_markup_pct), 2) when allowability_status == ALLOWED, else 0.00", constraints: "2 decimal places" }
      - { name: billed_invoice_id, type: string, source: system, description: "FK -> Invoice.id; the invoice that swept this expense, null while unbilled" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the Controller who reviewed a PENDING_REVIEW expense; null otherwise" }
      - { name: review_justification, type: string, source: input, description: "Free-text justification recorded by POST /expenses/{expense_id}/review; null before review" }

  - name: ConsultantSubcontract
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; owning project" }
      - { name: phase_id, type: string, source: input, description: "FK -> Phase.id; the leaf phase whose consultant_budget this commitment consumes" }
      - { name: consultant_name, type: string, source: input, description: "Subconsultant firm name" }
      - { name: committed_amount, type: number, source: input, description: "Total contractual commitment to the subconsultant", constraints: "> 0.00, 2 decimal places" }
      - { name: commitment_start, type: string, source: input, description: "Inclusive start of the commitment window", constraints: "ISO 8601 date (YYYY-MM-DD)" }
      - { name: commitment_end, type: string, source: input, description: "Inclusive end of the commitment window", constraints: "ISO 8601 date (YYYY-MM-DD); must be >= commitment_start" }
      - { name: pay_when_paid, type: boolean, source: input, description: "When true, payment release requires the client invoice carrying the consultant charge to be settled" }
      - { name: status, type: enum, source: system, description: "DRAFT | EXECUTED | CLOSED", default: DRAFT }
      - { name: approved_to_date, type: number, source: computed, description: "Sum of ConsultantInvoice.amount on this subcontract with approval_status == APPROVED", constraints: "2 decimal places" }
      - { name: released_to_date, type: number, source: computed, description: "Sum of ConsultantInvoice.amount on this subcontract with payment_status == RELEASED", constraints: "2 decimal places" }
      - { name: committed_remaining, type: number, source: computed, description: "committed_amount - approved_to_date; conserved across approve/reject pairs", constraints: "2 decimal places" }

  - name: ConsultantInvoice
    parent: null
    common_fields: true
    fields:
      - { name: subcontract_id, type: string, source: input, description: "FK -> ConsultantSubcontract.id; the commitment this payable draws against" }
      - { name: amount, type: number, source: input, description: "Consultant invoice face amount (the firm's cost)", constraints: "> 0.00, 2 decimal places" }
      - { name: invoice_date, type: string, source: input, description: "Consultant invoice date; drives WIP aging and client invoice sweep eligibility", constraints: "ISO 8601 date (YYYY-MM-DD)" }
      - { name: backup_attached, type: boolean, source: input, description: "Whether the consultant's supporting backup documentation is on file; public-agency clients refuse an invoice that bills a payable without backup" }
      - { name: entered_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the ProjectAccountant who entered the payable, captured from the request header" }
      - { name: approval_status, type: enum, source: system, description: "Axis 1 — RECEIVED | APPROVED | REJECTED", default: RECEIVED }
      - { name: payment_status, type: enum, source: system, description: "Axis 2 — WITHHELD | RELEASED", default: WITHHELD }
      - { name: billing_status, type: enum, source: system, description: "Axis 3 — UNBILLED | BILLED_TO_CLIENT", default: UNBILLED }
      - { name: approved_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the approver; null until approval" }
      - { name: rejection_reason, type: string, source: input, description: "Reason recorded by POST /consultant-invoices/{consultant_invoice_id}/reject; null otherwise" }
      - { name: applied_markup_pct, type: number, source: computed, description: "Effective markup fraction chosen by consultant_markup_computation, frozen at approval", constraints: "4 decimal places" }
      - { name: markup_amount, type: number, source: computed, description: "round_half_up(amount * applied_markup_pct, 2), frozen at approval", constraints: "2 decimal places" }
      - { name: billable_amount, type: number, source: computed, description: "amount + markup_amount, frozen at approval; 0.00 while approval_status != APPROVED", constraints: "2 decimal places" }
      - { name: client_invoice_id, type: string, source: system, description: "FK -> Invoice.id; the client invoice that swept this payable, null while unbilled" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; billed project" }
      - { name: period_end, type: string, source: input, description: "Inclusive cut-off date for the sweep; charges dated after it are not swept", constraints: "ISO 8601 date (YYYY-MM-DD)" }
      - { name: status, type: enum, source: system, description: "DRAFT | PENDING_CLIENT_REVIEW | REVISION_REQUESTED | APPROVED | PAID | WRITTEN_OFF | VOID", default: DRAFT }
      - { name: revision_round, type: integer, source: system, default: 0, description: "Count of client revision requests absorbed by this invoice", constraints: "0-3" }
      - { name: prepared_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the ProjectAccountant who created the invoice" }
      - { name: submitted_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the user who submitted the invoice to the client; must differ from prepared_by_user_id, and is cleared again by POST /invoices/{invoice_id}/revise" }
      - { name: labor_billed, type: number, source: computed, description: "Sum of TimeEntry.billable_amount over swept entries", constraints: "2 decimal places" }
      - { name: consultant_billed, type: number, source: computed, description: "Sum of ConsultantInvoice.billable_amount over swept payables", constraints: "2 decimal places" }
      - { name: expense_billed, type: number, source: computed, description: "Sum of ExpenseItem.billable_amount over swept expenses", constraints: "2 decimal places" }
      - { name: gross_billed, type: number, source: computed, description: "labor_billed + consultant_billed + expense_billed", constraints: "2 decimal places" }
      - { name: volume_discount_pct, type: number, source: computed, description: "Tier selected from gross_billed BEFORE any discount", constraints: "0.0000 | 0.0100 | 0.0200" }
      - { name: discount_amount, type: number, source: computed, description: "round_half_up(gross_billed * volume_discount_pct, 2)", constraints: "2 decimal places" }
      - { name: retainage_amount, type: number, source: computed, description: "round_half_up((gross_billed - discount_amount) * Client.retainage_pct, 2)", constraints: "2 decimal places" }
      - { name: net_due, type: number, source: computed, description: "gross_billed - discount_amount - retainage_amount", constraints: "2 decimal places" }
      - { name: backup_missing_count, type: integer, source: computed, description: "Count of swept ConsultantInvoice rows with backup_attached == false; must be 0 before the invoice may be submitted to a public-agency client" }
      - { name: swept_labor_count, type: integer, source: computed, description: "Number of TimeEntry rows attached to this invoice" }
      - { name: swept_expense_count, type: integer, source: computed, description: "Number of ExpenseItem rows attached to this invoice" }
      - { name: swept_consultant_count, type: integer, source: computed, description: "Number of ConsultantInvoice rows attached to this invoice" }
      - { name: client_decision_comment, type: string, source: input, description: "Comment supplied with the latest client review decision; null before the first decision" }
      - { name: paid_on, type: string, source: system, description: "Date the payment was recorded; null until PAID", constraints: "ISO 8601 date (YYYY-MM-DD) or null" }
      - { name: void_reason, type: string, source: input, description: "Reason recorded by POST /invoices/{invoice_id}/void; null otherwise" }

  - name: WriteOff
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; the project bearing the write-off" }
      - { name: invoice_id, type: string, source: input, description: "FK -> Invoice.id; required when target_type == INVOICE_RECEIVABLE, must be omitted when target_type == UNBILLED_LABOR_WIP" }
      - { name: target_type, type: enum, source: input, description: "UNBILLED_LABOR_WIP | INVOICE_RECEIVABLE — selects the charge population the amount is allocated against" }
      - { name: amount, type: number, source: input, description: "Value to write off", constraints: "> 0.00, 2 decimal places" }
      - { name: reason, type: string, source: input, description: "Business justification" }
      - { name: aging_days, type: integer, source: computed, description: "For UNBILLED_LABOR_WIP: the greatest age in whole days of the allocated entries as of the logical clock. For INVOICE_RECEIVABLE: age in whole days of Invoice.period_end. Frozen at creation" }
      - { name: required_approver, type: enum, source: computed, description: "PROJECT_MANAGER | CONTROLLER — chosen by write_off_approval_routing at creation" }
      - { name: allocated_time_entry_ids, type: array, source: computed, description: "Ordered list of TimeEntry ids the amount was allocated to; empty for INVOICE_RECEIVABLE" }
      - { name: status, type: enum, source: system, description: "PENDING_PM_APPROVAL | PENDING_CONTROLLER_APPROVAL | APPROVED", default: PENDING_PM_APPROVAL }
      - { name: prepared_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the preparer; may never equal the approver's X-User-ID" }
      - { name: approved_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the approver; null until approval" }

  - name: OverheadRateCertification
    parent: null
    common_fields: true
    fields:
      - { name: fiscal_year, type: integer, source: input, description: "Calendar fiscal year the certification covers", constraints: "2020-2100; at most one row per fiscal_year in {SUBMITTED, CERTIFIED}" }
      - { name: ytd_months, type: integer, source: input, description: "Number of months of actuals in the submitted figures; used only by the PROVISIONAL variant to annualize", constraints: "1-12" }
      - { name: direct_labor_base, type: number, source: input, description: "Direct labor cost base for the period", constraints: "> 0.00, 2 decimal places" }
      - { name: indirect_cost_pool, type: number, source: input, description: "Indirect cost pool for the period, inclusive of unallowable costs", constraints: "> 0.00, 2 decimal places" }
      - { name: unallowable_costs, type: number, source: input, description: "Portion of the indirect pool that is statutorily unallowable and removed only by the FINAL variant", constraints: ">= 0.00, 2 decimal places" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | CERTIFIED | REJECTED", default: SUBMITTED }
      - { name: provisional_overhead_rate, type: number, source: computed, description: "Annualized rate computed at creation from the submitted figures WITHOUT removing unallowable costs", constraints: "4 decimal places" }
      - { name: final_overhead_rate, type: number, source: computed, description: "Actual-basis rate computed at certification WITH unallowable costs removed and no annualization; null until CERTIFIED", constraints: "4 decimal places or null" }
      - { name: prepared_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the ProjectAccountant who submitted the certification" }
      - { name: certified_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the Controller who certified it; null otherwise" }
      - { name: certified_multiplier_ceiling, type: number, source: computed, description: "round_half_up((1 + final_overhead_rate) * (1 + PROFIT_MARGIN_CAP), 4); null until CERTIFIED. Copied onto every public-agency Project at certification", constraints: "4 decimal places or null" }
      - { name: findings, type: string, source: input, description: "Audit findings recorded by POST /overhead-certifications/{certification_id}/return-findings; null otherwise" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:

  - entity: Project
    dimension: status
    initial_state: SETUP
    terminal_states: [CLOSED]
    transitions:
      - from: SETUP
        to: ACTIVE
        trigger: "POST /projects/{project_id}/activate"
        actor: FirmAdmin | Controller | ProjectManager
        preconditions:
          - "Project.status == SETUP"
          - "at least one Phase exists on the project"
          - "at least one BillingMultiplier with status == ACTIVE exists on the project"
        side_effects:
          - "recompute Project.billing_posture via project_billing_posture"
          - "increments Project.version by 1"
        note: "Charges (time entries, expenses, subcontracts) and invoices are only accepted while status == ACTIVE."
      - from: ACTIVE
        to: CLOSED
        trigger: "system — re-evaluated at the end of any transition that changes a Phase status, an Invoice status, or a WriteOff status"
        actor: system
        preconditions:
          - "every Phase of the project has status == COMPLETE"
          - "Project.unbilled_wip == 0.00"
          - "every Invoice of the project has status IN {PAID, WRITTEN_OFF, VOID}"
        side_effects:
          - "Project.status = CLOSED"
          - "recompute Project.billing_posture (CLOSED projects always report OPEN because no gate applies)"
          - "increments Project.version by 1"
        note: "Bubble-up aggregate transition: the parent's state is a function of its children's states."

  - entity: Phase
    dimension: status
    initial_state: PLANNED
    terminal_states: [COMPLETE]
    transitions:
      - from: PLANNED
        to: IN_PROGRESS
        trigger: "system — first TimeEntry on this phase reaching APPROVED, or first ConsultantSubcontract on this phase reaching EXECUTED"
        actor: system
        preconditions:
          - "Phase.status == PLANNED"
        side_effects:
          - "Phase.status = IN_PROGRESS"
          - "increments Phase.version by 1"
      - from: IN_PROGRESS
        to: COMPLETE
        trigger: "POST /phases/{phase_id}/complete"
        actor: ProjectManager
        preconditions:
          - "Phase.status == IN_PROGRESS"
          - "no TimeEntry on this phase has status == SUBMITTED"
          - "no ExpenseItem on this phase has allowability_status == PENDING_REVIEW"
          - "no ConsultantSubcontract on this phase has status == EXECUTED with released_to_date < committed_amount"
        side_effects:
          - "Phase.status = COMPLETE"
          - "Phase.recognized_earned_value = Phase.phase_fee (completion forces 100% recognition regardless of Project.percent_complete_method)"
          - "that change re-derives Project.earned_revenue_to_date, and through it Project.total_charge_value reporting"
          - "re-evaluate the Project ACTIVE -> CLOSED bubble-up condition"
          - "increments Phase.version by 1 and Project.version by 1"

  - entity: BillingMultiplier
    dimension: status
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system — POST /billing-multipliers creates a successor on the same project"
        actor: system
        preconditions:
          - "predecessor.status == ACTIVE"
          - "successor.effective_from > predecessor.effective_from"
        side_effects:
          - "predecessor.effective_to = successor.effective_from (half-open truncation, no overlap error is raised)"
          - "predecessor.status = SUPERSEDED"
          - "increments BillingMultiplier.version by 1"
        note: "Truncation-on-supersede is deliberately different from LaborRate interval semantics, where an overlapping interval is rejected outright."

  - entity: TimeEntry
    dimension: status
    initial_state: SUBMITTED
    terminal_states: [WRITTEN_OFF]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /time-entries/{time_entry_id}/approve"
        actor: ProjectManager | Controller
        preconditions:
          - "TimeEntry.status == SUBMITTED"
          - "acting X-User-ID != TimeEntry.submitted_by_user_id"
          - "Project.status == ACTIVE"
          - "a LaborRate row covers (role_code, work_date)"
          - "a BillingMultiplier row covers (project_id, work_date)"
        side_effects:
          - "hop 1 — freeze raw_cost, applied_multiplier and billable_amount via labor_charge_computation; set approved_by_user_id"
          - "hop 2 — that freeze raises Phase.actual_labor_cost_to_date, which re-derives Phase.effort_based_percent_complete, Phase.effort_based_earned_value and Phase.recognized_earned_value"
          - "hop 3 — that phase re-derivation raises Project.earned_revenue_to_date and Project.unbilled_wip (and Project.raw_labor_cost_to_date, Project.net_multiplier_achieved, Project.total_charge_value)"
          - "hop 4 — that project re-derivation re-runs project_billing_posture: when unbilled_wip > wip_alert_threshold the posture moves OPEN -> REVIEW_REQUIRED, which blocks POST /consultant-subcontracts/{subcontract_id}/execute"
          - "if Phase.status == PLANNED it moves to IN_PROGRESS"
          - "increments TimeEntry.version, Phase.version and Project.version by 1"
      - from: APPROVED
        to: BILLED
        trigger: "system — POST /invoices or POST /invoices/{invoice_id}/revise sweeps the entry"
        actor: system
        preconditions:
          - "TimeEntry.status == APPROVED"
          - "TimeEntry.billed_invoice_id == null"
          - "TimeEntry.work_date <= Invoice.period_end"
        side_effects:
          - "TimeEntry.billed_invoice_id = Invoice.id"
          - "Project.unbilled_wip decreases by billable_amount, Project.billed_open increases by the same value"
          - "increments TimeEntry.version by 1"
      - from: BILLED
        to: APPROVED
        trigger: "system — POST /invoices/{invoice_id}/void releases the entry"
        actor: system
        preconditions:
          - "TimeEntry.billed_invoice_id == the voided Invoice.id"
        side_effects:
          - "TimeEntry.billed_invoice_id = null"
          - "Project.unbilled_wip increases by billable_amount, restoring the exact pre-invoice value (compensating action)"
          - "increments TimeEntry.version by 1"
        note: "Revision loop: an entry may travel APPROVED -> BILLED -> APPROVED any number of times without changing its frozen billable_amount."
      - from: APPROVED
        to: WRITTEN_OFF
        trigger: "system — POST /write-offs/{write_off_id}/approve on an UNBILLED_LABOR_WIP write-off that allocated this entry"
        actor: system
        preconditions:
          - "TimeEntry.status == APPROVED"
          - "TimeEntry.id appears in WriteOff.allocated_time_entry_ids"
        side_effects:
          - "Project.unbilled_wip decreases by billable_amount, Project.written_off_gross increases by the same value"
          - "increments TimeEntry.version by 1"

  - entity: ExpenseItem
    dimension: allowability_status
    initial_state: PENDING_REVIEW
    terminal_states: [DISALLOWED]
    transitions:
      - from: PENDING_REVIEW
        to: ALLOWED
        trigger: "system at POST /expenses when expense_allowability_and_markup returns ALLOWED_BY_RULE; or POST /expenses/{expense_id}/review with decision == ALLOW"
        actor: system | Controller
        preconditions:
          - "for the review path: allowability_status == PENDING_REVIEW"
          - "for the review path: NOT (Client.is_public_agency AND category IN {MEALS, ENTERTAINMENT}) AND category NOT IN Client.disallowed_categories — otherwise ERR_EXPENSE_UNALLOWABLE"
        side_effects:
          - "allowability_reason = ALLOWED_BY_RULE (create path) or ALLOWED_BY_REVIEW (review path)"
          - "billable_amount = round_half_up(amount * (1 + Client.expense_markup_pct), 2)"
          - "Project.unbilled_wip increases by billable_amount, which re-runs project_billing_posture"
          - "increments ExpenseItem.version and Project.version by 1"
      - from: PENDING_REVIEW
        to: DISALLOWED
        trigger: "system at POST /expenses when the category is excluded by the client or statutorily unallowable; or POST /expenses/{expense_id}/review with decision == DISALLOW"
        actor: system | Controller
        preconditions:
          - "for the review path: allowability_status == PENDING_REVIEW"
        side_effects:
          - "allowability_reason = CLIENT_EXCLUDED | STATUTORY_UNALLOWABLE (create path) or DISALLOWED_BY_REVIEW (review path)"
          - "billable_amount stays 0.00 — the cost is borne by the firm and never enters unbilled_wip"
          - "increments ExpenseItem.version by 1"

  - entity: ExpenseItem
    dimension: billing_status
    initial_state: UNBILLED
    terminal_states: []
    transitions:
      - from: UNBILLED
        to: BILLED
        trigger: "system — POST /invoices or POST /invoices/{invoice_id}/revise sweeps the expense"
        actor: system
        preconditions:
          - "allowability_status == ALLOWED"
          - "billing_status == UNBILLED"
          - "incurred_on <= Invoice.period_end"
        side_effects:
          - "billed_invoice_id = Invoice.id"
          - "Project.unbilled_wip decreases by billable_amount, Project.billed_open increases by the same value"
          - "increments ExpenseItem.version by 1"
      - from: BILLED
        to: UNBILLED
        trigger: "system — POST /invoices/{invoice_id}/void releases the expense"
        actor: system
        preconditions:
          - "billed_invoice_id == the voided Invoice.id"
        side_effects:
          - "billed_invoice_id = null"
          - "Project.unbilled_wip increases by billable_amount (compensating action)"
          - "increments ExpenseItem.version by 1"

  - entity: ConsultantSubcontract
    dimension: status
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: EXECUTED
        trigger: "POST /consultant-subcontracts/{subcontract_id}/execute"
        actor: ProjectManager
        preconditions:
          - "ConsultantSubcontract.status == DRAFT"
          - "Project.status == ACTIVE"
          - "Project.billing_posture != REVIEW_REQUIRED"
          - "consultant_commitment_overlap_exposure(phase, this subcontract) <= Phase.consultant_budget"
        side_effects:
          - "Phase.consultant_committed_open increases by committed_amount"
          - "if Phase.status == PLANNED it moves to IN_PROGRESS"
          - "increments ConsultantSubcontract.version and Phase.version by 1"
      - from: EXECUTED
        to: CLOSED
        trigger: "system — released_to_date reaches committed_amount after a ConsultantInvoice payment release"
        actor: system
        preconditions:
          - "ConsultantSubcontract.status == EXECUTED"
          - "released_to_date >= committed_amount"
        side_effects:
          - "Phase.consultant_committed_open decreases by committed_amount, which clears the phase's open-commitment precondition for IN_PROGRESS -> COMPLETE"
          - "increments ConsultantSubcontract.version and Phase.version by 1"

  - entity: ConsultantInvoice
    dimension: approval_status
    initial_state: RECEIVED
    terminal_states: [REJECTED]
    transitions:
      - from: RECEIVED
        to: APPROVED
        trigger: "POST /consultant-invoices/{consultant_invoice_id}/approve"
        actor: ProjectManager | Controller
        preconditions:
          - "approval_status == RECEIVED"
          - "ConsultantSubcontract.status == EXECUTED"
          - "Project.status == ACTIVE"
          - "amount <= ConsultantSubcontract.committed_remaining"
        side_effects:
          - "freeze applied_markup_pct, markup_amount and billable_amount via consultant_markup_computation"
          - "ConsultantSubcontract.approved_to_date increases by amount and committed_remaining decreases by the same amount"
          - "Project.unbilled_wip increases by billable_amount, which re-runs project_billing_posture"
          - "increments ConsultantInvoice.version, ConsultantSubcontract.version and Project.version by 1"
      - from: RECEIVED
        to: REJECTED
        trigger: "POST /consultant-invoices/{consultant_invoice_id}/reject"
        actor: ProjectManager | Controller
        preconditions:
          - "approval_status == RECEIVED"
        side_effects:
          - "rejection_reason recorded; billable_amount stays 0.00"
          - "increments ConsultantInvoice.version by 1"
      - from: APPROVED
        to: REJECTED
        trigger: "POST /consultant-invoices/{consultant_invoice_id}/reject"
        actor: ProjectManager | Controller
        preconditions:
          - "approval_status == APPROVED"
          - "billing_status == UNBILLED"
        side_effects:
          - "compensating action — ConsultantSubcontract.approved_to_date decreases by amount and committed_remaining increases by the same amount, restoring committed_amount == committed_remaining + approved_to_date"
          - "Project.unbilled_wip decreases by the previously frozen billable_amount; applied_markup_pct, markup_amount and billable_amount reset to 0.0000 / 0.00 / 0.00"
          - "increments ConsultantInvoice.version, ConsultantSubcontract.version and Project.version by 1"

  - entity: ConsultantInvoice
    dimension: payment_status
    initial_state: WITHHELD
    terminal_states: [RELEASED]
    transitions:
      - from: WITHHELD
        to: RELEASED
        trigger: "POST /consultant-invoices/{consultant_invoice_id}/release-payment"
        actor: Controller
        preconditions:
          - "approval_status == APPROVED"
          - "payment_status == WITHHELD"
          - "if ConsultantSubcontract.pay_when_paid == true: client_invoice_id is not null AND that Invoice.status == PAID"
        side_effects:
          - "ConsultantSubcontract.released_to_date increases by amount"
          - "when released_to_date >= committed_amount the subcontract moves EXECUTED -> CLOSED"
          - "increments ConsultantInvoice.version and ConsultantSubcontract.version by 1"
      - from: WITHHELD
        to: RELEASED
        trigger: "system — the client Invoice carrying this payable reaches PAID, or reaches WRITTEN_OFF"
        actor: system
        preconditions:
          - "approval_status == APPROVED"
          - "payment_status == WITHHELD"
          - "billing_status == BILLED_TO_CLIENT"
        side_effects:
          - "same as the Controller-triggered release: released_to_date increases, possible EXECUTED -> CLOSED cascade"
          - "increments ConsultantInvoice.version and ConsultantSubcontract.version by 1"
        note: "A written-off receivable does not excuse the firm from paying the subconsultant, so the write-off path releases the payable too."

  - entity: ConsultantInvoice
    dimension: billing_status
    initial_state: UNBILLED
    terminal_states: []
    transitions:
      - from: UNBILLED
        to: BILLED_TO_CLIENT
        trigger: "system — POST /invoices or POST /invoices/{invoice_id}/revise sweeps the payable"
        actor: system
        preconditions:
          - "approval_status == APPROVED"
          - "billing_status == UNBILLED"
          - "invoice_date <= Invoice.period_end"
        side_effects:
          - "client_invoice_id = Invoice.id"
          - "Project.unbilled_wip decreases by billable_amount, Project.billed_open increases by the same value"
          - "increments ConsultantInvoice.version by 1"
      - from: BILLED_TO_CLIENT
        to: UNBILLED
        trigger: "system — POST /invoices/{invoice_id}/void releases the payable"
        actor: system
        preconditions:
          - "client_invoice_id == the voided Invoice.id"
          - "payment_status == WITHHELD"
        side_effects:
          - "client_invoice_id = null"
          - "Project.unbilled_wip increases by billable_amount (compensating action)"
          - "increments ConsultantInvoice.version by 1"
        note: "The three axes evolve independently: a payable can be RELEASED while still BILLED_TO_CLIENT, and can be REJECTED only while UNBILLED."

  - entity: Invoice
    dimension: status
    initial_state: DRAFT
    terminal_states: [PAID, WRITTEN_OFF, VOID]
    transitions:
      - from: DRAFT
        to: PENDING_CLIENT_REVIEW
        trigger: "POST /invoices/{invoice_id}/submit"
        actor: ProjectAccountant
        preconditions:
          - "Invoice.status == DRAFT"
          - "Invoice.gross_billed > 0.00"
          - "Client.is_public_agency == false OR Invoice.backup_missing_count == 0"
        side_effects:
          - "invoice becomes read-only for sweeps until it returns to DRAFT"
          - "increments Invoice.version by 1"
      - from: PENDING_CLIENT_REVIEW
        to: APPROVED
        trigger: "POST /invoices/{invoice_id}/review with decision == APPROVE"
        actor: ClientContact
        preconditions:
          - "Invoice.status == PENDING_CLIENT_REVIEW"
          - "acting X-User-ID == Project.client_id"
        side_effects:
          - "client_decision_comment recorded"
          - "increments Invoice.version by 1"
      - from: PENDING_CLIENT_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /invoices/{invoice_id}/review with decision == REQUEST_REVISION"
        actor: ClientContact
        preconditions:
          - "Invoice.status == PENDING_CLIENT_REVIEW"
          - "acting X-User-ID == Project.client_id"
          - "Invoice.revision_round < 3"
        side_effects:
          - "Invoice.revision_round increases by 1"
          - "client_decision_comment recorded"
          - "increments Invoice.version by 1"
        note: "Cycle termination: at revision_round == 3 a further REQUEST_REVISION is rejected with ERR_REVISION_LIMIT_EXCEEDED, leaving the client only APPROVE while the firm may VOID."
      - from: REVISION_REQUESTED
        to: DRAFT
        trigger: "POST /invoices/{invoice_id}/revise"
        actor: ProjectAccountant
        preconditions:
          - "Invoice.status == REVISION_REQUESTED"
        side_effects:
          - "already-attached charges stay attached; the sweep re-runs and additionally attaches every newly eligible charge dated on or before period_end"
          - "invoice_totals_computation re-runs, so gross_billed, volume_discount_pct, discount_amount, retainage_amount and net_due are recomputed from the new charge set"
          - "increments Invoice.version by 1"
      - from: APPROVED
        to: PAID
        trigger: "POST /invoices/{invoice_id}/record-payment"
        actor: Controller
        preconditions:
          - "Invoice.status == APPROVED"
        side_effects:
          - "hop 1 — Invoice.status = PAID and paid_on = received_on; Project.billed_open decreases by gross_billed while Project.paid_gross_to_date increases by the same value"
          - "hop 2 — that settlement satisfies pay-when-paid, so every ConsultantInvoice with client_invoice_id == this invoice and payment_status == WITHHELD moves WITHHELD -> RELEASED"
          - "hop 3 — each release raises its ConsultantSubcontract.released_to_date; a subcontract whose released_to_date >= committed_amount moves EXECUTED -> CLOSED"
          - "hop 4 — that closure lowers Phase.consultant_committed_open, which clears the open-commitment precondition blocking Phase IN_PROGRESS -> COMPLETE"
          - "re-evaluate the Project ACTIVE -> CLOSED bubble-up condition"
          - "increments Invoice.version and Project.version by 1"
      - from: APPROVED
        to: WRITTEN_OFF
        trigger: "system — POST /write-offs/{write_off_id}/approve on an INVOICE_RECEIVABLE write-off naming this invoice"
        actor: system
        preconditions:
          - "Invoice.status == APPROVED"
          - "WriteOff.amount == Invoice.net_due"
        side_effects:
          - "Project.billed_open decreases by gross_billed while Project.written_off_gross increases by the same value"
          - "every ConsultantInvoice with client_invoice_id == this invoice and payment_status == WITHHELD moves WITHHELD -> RELEASED"
          - "re-evaluate the Project ACTIVE -> CLOSED bubble-up condition"
          - "increments Invoice.version and Project.version by 1"
      - from: DRAFT
        to: VOID
        trigger: "POST /invoices/{invoice_id}/void"
        actor: Controller
        preconditions:
          - "Invoice.status == DRAFT"
        side_effects:
          - "every attached TimeEntry moves BILLED -> APPROVED, every attached ExpenseItem moves BILLED -> UNBILLED, every attached ConsultantInvoice moves BILLED_TO_CLIENT -> UNBILLED"
          - "Project.unbilled_wip returns to exactly its pre-invoice value and Project.billed_open decreases by gross_billed, leaving Project.total_charge_value unchanged"
          - "increments Invoice.version and Project.version by 1"
      - from: PENDING_CLIENT_REVIEW
        to: VOID
        trigger: "POST /invoices/{invoice_id}/void"
        actor: Controller
        preconditions:
          - "Invoice.status == PENDING_CLIENT_REVIEW"
        side_effects:
          - "identical release-and-restore side effects as the DRAFT -> VOID transition"
          - "increments Invoice.version and Project.version by 1"
      - from: REVISION_REQUESTED
        to: VOID
        trigger: "POST /invoices/{invoice_id}/void"
        actor: Controller
        preconditions:
          - "Invoice.status == REVISION_REQUESTED"
        side_effects:
          - "identical release-and-restore side effects as the DRAFT -> VOID transition"
          - "increments Invoice.version and Project.version by 1"

  - entity: WriteOff
    dimension: status
    initial_state: PENDING_PM_APPROVAL
    terminal_states: [APPROVED]
    transitions:
      - from: PENDING_PM_APPROVAL
        to: PENDING_CONTROLLER_APPROVAL
        trigger: "system at POST /write-offs when write_off_approval_routing returns CONTROLLER"
        actor: system
        preconditions:
          - "amount >= 5000.00 OR aging_days >= 90"
        side_effects:
          - "required_approver = CONTROLLER"
        note: "Fork: creation routes the write-off down one of two approval branches; both branches join on APPROVED."
      - from: PENDING_PM_APPROVAL
        to: APPROVED
        trigger: "POST /write-offs/{write_off_id}/approve"
        actor: ProjectManager | Controller
        preconditions:
          - "WriteOff.status == PENDING_PM_APPROVAL"
          - "when the acting role is ProjectManager, acting X-User-ID == Project.project_manager_user_id"
          - "acting X-User-ID != WriteOff.prepared_by_user_id"
        side_effects:
          - "branch-specific: Project.overhead_adjustment_required is left unchanged"
          - "for UNBILLED_LABOR_WIP: every TimeEntry in allocated_time_entry_ids moves APPROVED -> WRITTEN_OFF"
          - "Project.unbilled_wip decreases by amount and Project.written_off_gross increases by amount"
          - "re-run project_billing_posture and re-evaluate the Project ACTIVE -> CLOSED bubble-up condition"
          - "increments WriteOff.version and Project.version by 1"
      - from: PENDING_CONTROLLER_APPROVAL
        to: APPROVED
        trigger: "POST /write-offs/{write_off_id}/approve"
        actor: Controller
        preconditions:
          - "WriteOff.status == PENDING_CONTROLLER_APPROVAL"
          - "acting role == Controller"
          - "acting X-User-ID != WriteOff.prepared_by_user_id"
        side_effects:
          - "branch-specific: Project.overhead_adjustment_required = true (the write-off must be disclosed in the next overhead certification)"
          - "for UNBILLED_LABOR_WIP: every TimeEntry in allocated_time_entry_ids moves APPROVED -> WRITTEN_OFF"
          - "for INVOICE_RECEIVABLE: the named Invoice moves APPROVED -> WRITTEN_OFF, which releases its withheld consultant payables"
          - "for UNBILLED_LABOR_WIP: Project.unbilled_wip decreases by amount and Project.written_off_gross increases by amount; for INVOICE_RECEIVABLE: Project.billed_open decreases by the invoice's gross_billed and Project.written_off_gross increases by that same gross_billed (the write-off amount is the net_due, but the rollup moves the gross, so total_charge_value stays conserved)"
          - "re-run project_billing_posture and re-evaluate the Project ACTIVE -> CLOSED bubble-up condition"
          - "increments WriteOff.version and Project.version by 1"
        note: "Join: the two branches converge on APPROVED but carry different side-effect sets — only this branch sets overhead_adjustment_required and only this branch may write off a receivable."

  - entity: OverheadRateCertification
    dimension: status
    initial_state: SUBMITTED
    terminal_states: [CERTIFIED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: CERTIFIED
        trigger: "POST /overhead-certifications/{certification_id}/certify"
        actor: Controller
        preconditions:
          - "status == SUBMITTED"
          - "acting X-User-ID != prepared_by_user_id"
        side_effects:
          - "hop 1 — final_overhead_rate computed by the FINAL variant of overhead_rate_computation; certified_by_user_id recorded"
          - "hop 2 — every Project whose Client.is_public_agency == true recomputes certified_multiplier_ceiling from the new final_overhead_rate"
          - "hop 3 — those projects re-run project_billing_posture, so a project held for a missing certification moves HOLD -> OPEN"
          - "increments OverheadRateCertification.version by 1 and each affected Project.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /overhead-certifications/{certification_id}/return-findings"
        actor: Controller
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "findings recorded; final_overhead_rate stays null"
          - "the fiscal year is freed, so a corrected certification may be submitted for the same fiscal_year"
          - "increments OverheadRateCertification.version by 1"

# =============================================================================
# Table 2.1: Concurrency Rules (OCC on Project.version only)
# =============================================================================
concurrency_rules:
  - rule_id: multiplier-create-stale-project
    parent_entity: Project
    write_endpoint: "POST /billing-multipliers"
    occ_field: "expected_project_version"
    description: |
      Creating a BillingMultiplier against a Project whose version has advanced
      since the client last read it is rejected. A successor multiplier legitimately
      supersedes the incumbent (truncating its effective_to), so a writer holding a
      stale view of the project would silently supersede a multiplier it never saw.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412

  - rule_id: invoice-create-stale-project
    parent_entity: Project
    write_endpoint: "POST /invoices"
    occ_field: "expected_project_version"
    description: |
      Creating an Invoice against a Project whose version has advanced since the
      client last read it is rejected. Invoice creation sweeps every eligible
      unbilled charge into itself, so a writer holding a stale view of the project
      would bill a charge population it never observed.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table (15 rules)
# =============================================================================
calculations:

  - name: effective_rate_lookup
    trigger: "POST /time-entries/{time_entry_id}/approve, immediately before labor_charge_computation"
    algorithm: interval_merge
    formula: |
      # Half-open interval semantics: [effective_from, effective_to)
      rate_rows = LaborRate rows where role_code == entry.role_code
                    AND effective_from <= entry.work_date
                    AND (effective_to IS NULL OR entry.work_date < effective_to)
      if rate_rows is empty -> ERR_NO_EFFECTIVE_LABOR_RATE
      rate = the single row in rate_rows      # uniqueness guaranteed by the overlap rejection at POST /labor-rates

      mult_rows = BillingMultiplier rows where project_id == entry.project_id
                    AND effective_from <= entry.work_date
                    AND (effective_to IS NULL OR entry.work_date < effective_to)
      if mult_rows is empty -> ERR_NO_EFFECTIVE_MULTIPLIER
      multiplier = the single row in mult_rows  # uniqueness guaranteed by supersede truncation
    input_set: "All LaborRate rows for the entry's role_code regardless of creation order; all BillingMultiplier rows of the project in status {ACTIVE, SUPERSEDED} — a SUPERSEDED row still governs work_dates inside its truncated interval"
    constants: {}
    precision: "dates compared as calendar dates; adjacency (prev.effective_to == next.effective_from) leaves no gap and no overlap"
    variants: []

  - name: labor_charge_computation
    trigger: "POST /time-entries/{time_entry_id}/approve (freezes raw_cost, applied_multiplier and billable_amount on the entry)"
    algorithm: aggregation
    formula: |
      # PINNED ROUNDING ORDER: round the raw cost to cents FIRST, multiply SECOND,
      # round the product to cents THIRD. The invoice then sums already-rounded
      # per-entry values; it never re-derives labor from hours.
      raw_cost         = round_half_up(hours * rate.raw_cost_rate, 2)
      applied_multiplier = multiplier.multiplier
      billable_amount  = round_half_up(raw_cost * applied_multiplier, 2)
      # Forbidden alternative that yields different cents:
      #   round_half_up(hours * rate.raw_cost_rate * multiplier.multiplier, 2)
      # e.g. hours=7.35, rate=62.50, multiplier=3.0500
      #   pinned: round(459.375,2)=459.38 -> round(459.38*3.05,2)=1401.11
      #   forbidden: round(7.35*62.50*3.05,2)=round(1401.09375,2)=1401.09
    input_set: "The single TimeEntry being approved; the LaborRate and BillingMultiplier rows returned by effective_rate_lookup for its work_date"
    constants: {}
    precision: "2 decimal places at each of the two rounding steps, round_half_up; applied_multiplier stored at 4 decimal places"
    variants: []

  - name: expense_allowability_and_markup
    trigger: "POST /expenses (initial adjudication) and POST /expenses/{expense_id}/review (Controller override)"
    algorithm: threshold
    formula: |
      # Ordered adjudication — the FIRST matching clause wins.
      # CLAUSE ORDER IS PINNED: the missing-receipt clause outranks both exclusion
      # clauses, because allowability cannot be adjudicated before the backup is in
      # hand. An undocumented expense is therefore held PENDING_REVIEW even when its
      # category would have been excluded, and the exclusion is applied at review.
      if amount >= Client.receipt_required_above AND receipt_attached == false:
          allowability_status = PENDING_REVIEW; allowability_reason = RECEIPT_MISSING
      elif Client.is_public_agency == true AND category IN {MEALS, ENTERTAINMENT}:
          allowability_status = DISALLOWED; allowability_reason = STATUTORY_UNALLOWABLE
      elif category IN Client.disallowed_categories:
          allowability_status = DISALLOWED; allowability_reason = CLIENT_EXCLUDED
      else:
          allowability_status = ALLOWED; allowability_reason = ALLOWED_BY_RULE

      billable_amount = round_half_up(amount * (1 + Client.expense_markup_pct), 2)
                        when allowability_status == ALLOWED, else 0.00
      # Review path: decision == ALLOW is refused with ERR_EXPENSE_UNALLOWABLE when the
      # expense would have been excluded had the receipt been present — i.e. when
      # (Client.is_public_agency AND category IN {MEALS, ENTERTAINMENT}) or
      # category IN Client.disallowed_categories. Neither exclusion is overridable.
      # decision == ALLOW on an otherwise-allowable RECEIPT_MISSING expense sets
      # allowability_reason ALLOWED_BY_REVIEW and computes the markup; decision ==
      # DISALLOW always lands DISALLOWED_BY_REVIEW with billable_amount 0.00.
    input_set: "The single ExpenseItem plus the Client row reached through Project.client_id"
    constants: {}
    precision: "2 decimal places, round_half_up; the receipt threshold comparison is inclusive (amount == receipt_required_above already requires a receipt)"
    variants: []

  - name: consultant_markup_computation
    trigger: "POST /consultant-invoices/{consultant_invoice_id}/approve (freezes applied_markup_pct, markup_amount and billable_amount)"
    algorithm: tiered_pricing
    formula: |
      # Four inputs interact non-linearly: cumulative project volume tier,
      # contract type, public-agency status and the invoice amount.
      approved_cost_to_date = sum(ci.amount) over ConsultantInvoice rows whose
          subcontract belongs to THIS project AND ci.approval_status == APPROVED,
          evaluated BEFORE this approval is applied
      base_pct = MARKUP_TIER2 if approved_cost_to_date >= MARKUP_TIER2_THRESHOLD
                 else MARKUP_STANDARD
      if Project.contract_type == FIXED_FEE:
          base_pct = base_pct + MARKUP_FIXED_FEE_BONUS
      applied_markup_pct = min(base_pct, MARKUP_PUBLIC_CAP) if Client.is_public_agency
                           else base_pct
      markup_amount   = round_half_up(amount * applied_markup_pct, 2)
      billable_amount = amount + markup_amount
    input_set: "Every APPROVED ConsultantInvoice of the project across all of its subcontracts (the tier is a project-level cumulative volume, not a per-subcontract volume); the row being approved is excluded from its own cumulative base"
    constants:
      MARKUP_STANDARD: 0.1000
      MARKUP_TIER2: 0.0600
      MARKUP_TIER2_THRESHOLD: 250000.00
      MARKUP_FIXED_FEE_BONUS: 0.0200
      MARKUP_PUBLIC_CAP: 0.0500
    precision: "applied_markup_pct at 4 decimal places; money at 2 decimal places, round_half_up; the tier threshold is inclusive (approved_cost_to_date == 250000.00 selects MARKUP_TIER2)"
    variants: []

  - name: invoice_totals_computation
    trigger: "POST /invoices and POST /invoices/{invoice_id}/revise"
    algorithm: waterfall_allocation
    formula: |
      # ---- sweep (input sets pinned; sums are order-insensitive) ----
      labor_billed      = sum(TimeEntry.billable_amount) over entries with
                            project_id == invoice.project_id AND status == APPROVED
                            AND billed_invoice_id IS NULL AND work_date <= period_end
                            (plus entries already attached to this invoice on a revise)
      expense_billed    = sum(ExpenseItem.billable_amount) over expenses with
                            project_id == invoice.project_id AND allowability_status == ALLOWED
                            AND billing_status == UNBILLED AND incurred_on <= period_end
                            (plus expenses already attached to this invoice on a revise)
      consultant_billed = sum(ConsultantInvoice.billable_amount) over payables whose
                            subcontract.project_id == invoice.project_id AND
                            approval_status == APPROVED AND billing_status == UNBILLED
                            AND invoice_date <= period_end
                            (plus payables already attached to this invoice on a revise)
      gross_billed = labor_billed + consultant_billed + expense_billed
      if gross_billed == 0.00 -> ERR_NOTHING_TO_INVOICE

      # ---- PINNED EVALUATION ORDER (the dependency only looks circular) ----
      # STEP 1: the volume tier is keyed on the PRE-discount gross_billed.
      volume_discount_pct = DISCOUNT_TIER2_PCT if gross_billed >= DISCOUNT_TIER2_THRESHOLD
                            else DISCOUNT_TIER1_PCT if gross_billed >= DISCOUNT_TIER1_THRESHOLD
                            else 0.0000
      discount_amount = round_half_up(gross_billed * volume_discount_pct, 2)
      # STEP 2: retainage is keyed on the POST-discount base, never on gross_billed.
      retainage_amount = round_half_up((gross_billed - discount_amount) * Client.retainage_pct, 2)
      net_due = gross_billed - discount_amount - retainage_amount
      # Forbidden alternative (retainage first, then tier the net-of-retainage amount)
      # e.g. gross_billed = 100500.00, retainage_pct = 0.0500
      #   pinned:    pct=0.0100, discount=1005.00, retainage=4974.75, net_due=94520.25
      #   forbidden: retainage=5025.00, pct=0.0000, discount=0.00,    net_due=95475.00

      backup_missing_count = count of swept ConsultantInvoice rows with backup_attached == false
    input_set: "Only charges of the invoice's project that are unattached (or already attached to this same invoice) and dated on or before period_end; DISALLOWED expenses, PENDING_REVIEW expenses, SUBMITTED time entries and RECEIVED/REJECTED consultant payables are excluded"
    constants:
      DISCOUNT_TIER1_THRESHOLD: 100000.00
      DISCOUNT_TIER1_PCT: 0.0100
      DISCOUNT_TIER2_THRESHOLD: 250000.00
      DISCOUNT_TIER2_PCT: 0.0200
    precision: "2 decimal places, round_half_up; both tier comparisons are inclusive (>=)"
    variants: []

  - name: fixed_fee_billing_headroom
    trigger: "POST /invoices and POST /invoices/{invoice_id}/revise, after invoice_totals_computation, only when Project.contract_type == FIXED_FEE"
    algorithm: threshold
    formula: |
      already_billed = Project.billed_open + Project.paid_gross_to_date + Project.written_off_gross
                       # measured EXCLUDING the invoice under construction
      headroom = round_half_up(Project.earned_revenue_to_date - already_billed, 2)
      if gross_billed > headroom -> ERR_BILLING_EXCEEDS_EARNED
    input_set: "The project's recognized earned revenue over its leaf phases versus every invoice in {DRAFT, PENDING_CLIENT_REVIEW, REVISION_REQUESTED, APPROVED, PAID, WRITTEN_OFF}; VOID invoices are excluded"
    constants: {}
    precision: "2 decimal places, round_half_up; the comparison is strict (gross_billed == headroom is permitted)"
    variants: []

  - name: phase_earned_value
    trigger: "recomputed whenever a TimeEntry on the phase reaches APPROVED, whenever POST /phases/{phase_id}/assess writes assessed_percent_complete, and whenever the phase reaches COMPLETE"
    algorithm: forward_looking
    formula: |
      effort_based_percent_complete =
          0.0000 if budget_labor_cost == 0.00
          else min(1.0000, round_half_up(actual_labor_cost_to_date / budget_labor_cost, 4))
      effort_based_earned_value = round_half_up(phase_fee * effort_based_percent_complete, 2)
      assessed_earned_value     = round_half_up(phase_fee * assessed_percent_complete, 2)

      recognized_earned_value =
          phase_fee                          if status == COMPLETE
          else effort_based_earned_value     if Project.percent_complete_method == EFFORT_BASED
          else assessed_earned_value
    input_set: "actual_labor_cost_to_date sums TimeEntry.raw_cost on this phase for entries in {APPROVED, BILLED, WRITTEN_OFF}; SUBMITTED entries are excluded, so an unapproved timesheet moves neither variant"
    constants: {}
    precision: "percent complete at 4 decimal places, money at 2 decimal places, both round_half_up"
    variants:
      - name: EFFORT_BASED
        when: "Project.percent_complete_method == EFFORT_BASED — cost-to-cost recognition"
        difference: "Earned value tracks incurred raw labor cost against budget_labor_cost, so it ignores the ProjectManager's physical assessment entirely and can only rise when timesheets are approved."
      - name: ASSESSED
        when: "Project.percent_complete_method == ASSESSED — physical-completion recognition"
        difference: "Earned value tracks the ProjectManager's assessed_percent_complete, so with identical timesheets it yields a different figure (e.g. phase_fee 200000.00, actual cost 1084.38, budget 60000.00, assessment 0.2500: EFFORT_BASED = 3620.00 while ASSESSED = 50000.00)."
      - name: COMPLETION_OVERRIDE
        when: "Phase.status == COMPLETE"
        difference: "Both variants are discarded and recognized_earned_value is forced to phase_fee, so completing a phase reconciles the delta between the selected variant and full fee in one step."

  - name: project_rollup_metrics
    trigger: "recomputed on every mutation that touches the project's charges, invoices, phases or write-offs, and on every read of Project"
    algorithm: aggregation
    formula: |
      raw_labor_cost_to_date = sum(TimeEntry.raw_cost   where status IN {APPROVED, BILLED, WRITTEN_OFF})
      labor_billable_total   = sum(TimeEntry.billable_amount where status IN {APPROVED, BILLED, WRITTEN_OFF})

      unbilled_wip = sum(TimeEntry.billable_amount        where status == APPROVED  AND billed_invoice_id IS NULL)
                   + sum(ExpenseItem.billable_amount      where allowability_status == ALLOWED AND billing_status == UNBILLED)
                   + sum(ConsultantInvoice.billable_amount where approval_status == APPROVED AND billing_status == UNBILLED)
      billed_open        = sum(Invoice.gross_billed where status IN {DRAFT, PENDING_CLIENT_REVIEW, REVISION_REQUESTED, APPROVED})
      paid_gross_to_date = sum(Invoice.gross_billed where status == PAID)
      written_off_gross  = sum(Invoice.gross_billed where status == WRITTEN_OFF)
                         + sum(TimeEntry.billable_amount where status == WRITTEN_OFF)

      # Conserved quantity — this identity MUST hold after every request, including
      # every cascade hop: no forward/compensating pair may leave drift.
      total_charge_value = unbilled_wip + billed_open + paid_gross_to_date + written_off_gross

      earned_revenue_to_date = sum(Phase.recognized_earned_value where Phase.is_leaf == true)
      net_multiplier_achieved = 0.0000 if raw_labor_cost_to_date == 0.00
                                else round_half_up(labor_billable_total / raw_labor_cost_to_date, 4)
    input_set: "All charges of the project; VOID invoices contribute to none of the four buckets, and non-leaf phases contribute nothing to earned_revenue_to_date (their fee is represented by their children)"
    constants: {}
    precision: "money at 2 decimal places, net_multiplier_achieved at 4 decimal places, round_half_up"
    variants: []

  - name: project_billing_posture
    trigger: "recomputed on every mutation touching the project and on every read of Project; also re-run for every public-agency project when an OverheadRateCertification reaches CERTIFIED"
    algorithm: threshold
    formula: |
      # Ordered — the FIRST matching clause wins.
      if Project.status == CLOSED:                                    posture = OPEN
      elif Client.is_public_agency == true
           AND no OverheadRateCertification exists with status == CERTIFIED
               AND fiscal_year == calendar_year(logical_clock_date):  posture = HOLD
      elif unbilled_wip > wip_alert_threshold:                        posture = REVIEW_REQUIRED
      else:                                                          posture = OPEN
      # Gates: HOLD blocks POST /invoices (ERR_OVERHEAD_RATE_NOT_CERTIFIED);
      #        REVIEW_REQUIRED blocks POST /consultant-subcontracts/{subcontract_id}/execute
      #        (ERR_PROJECT_UNDER_BILLING_REVIEW) but never blocks invoicing, because
      #        invoicing is how the excess work in progress is cleared.
    input_set: "The project's Client row, the firm-wide OverheadRateCertification population, and the project's own unbilled_wip"
    constants: {}
    precision: "the work-in-progress comparison is strict (unbilled_wip == wip_alert_threshold stays OPEN)"
    variants: []

  - name: overhead_rate_computation
    trigger: "PROVISIONAL at POST /overhead-certifications; FINAL at POST /overhead-certifications/{certification_id}/certify"
    algorithm: weighted_scoring
    formula: |
      # PROVISIONAL — annualize the year-to-date figures, keep unallowable costs in the pool
      pool_annualized = round_half_up(indirect_cost_pool * MONTHS_PER_YEAR / ytd_months, 2)
      base_annualized = round_half_up(direct_labor_base  * MONTHS_PER_YEAR / ytd_months, 2)
      provisional_overhead_rate = round_half_up(pool_annualized / base_annualized, 4)

      # FINAL — actual basis, unallowable costs removed, no annualization
      final_overhead_rate = round_half_up((indirect_cost_pool - unallowable_costs) / direct_labor_base, 4)

      # Certification side effect on every public-agency project
      certified_multiplier_ceiling = round_half_up((1 + final_overhead_rate) * (1 + PROFIT_MARGIN_CAP), 4)
    input_set: "Only the figures submitted on the certification row; the CERTIFIED row for calendar_year(logical_clock_date) is the one that supplies certified_multiplier_ceiling, and at most one such row can exist"
    constants:
      MONTHS_PER_YEAR: 12
      PROFIT_MARGIN_CAP: 0.1000
    precision: "annualized money at 2 decimal places, rates and the ceiling at 4 decimal places, round_half_up"
    variants:
      - name: PROVISIONAL
        when: "computed at submission, used for interim billing guidance"
        difference: "Annualizes the year-to-date pool and base by MONTHS_PER_YEAR / ytd_months and leaves unallowable costs inside the pool, so it reports a higher rate than the certified one for identical inputs (e.g. pool 1980000.00, base 1200000.00, unallowable 90000.00, ytd_months 6: PROVISIONAL = 1.6500)."
      - name: FINAL
        when: "computed at certification, the only rate a public client may be billed against"
        difference: "Uses the unannualized actuals and subtracts unallowable_costs from the pool, yielding a different rate from the very same submitted figures (same inputs as above: FINAL = 1.5750, and the derived ceiling is 2.8325)."

  - name: consultant_commitment_overlap_exposure
    trigger: "POST /consultant-subcontracts/{subcontract_id}/execute"
    algorithm: interval_merge
    formula: |
      # CLOSED-INCLUSIVE interval semantics: two windows that merely touch
      # (previous.commitment_end == candidate.commitment_start) DO overlap.
      # Pairwise overlap is legal; only the AGGREGATE exposure is capped.
      overlapping = { s : s.phase_id == C.phase_id
                          AND s.id != C.id
                          AND s.status == EXECUTED
                          AND s.commitment_start <= C.commitment_end
                          AND s.commitment_end   >= C.commitment_start }
      exposure = sum(s.committed_amount for s in overlapping) + C.committed_amount
      if exposure > Phase.consultant_budget -> ERR_CONSULTANT_BUDGET_OVERCOMMIT
    input_set: "Only EXECUTED subcontracts on the same phase; DRAFT and CLOSED subcontracts contribute nothing, so closing a subcontract frees its capacity for a new overlapping commitment"
    constants: {}
    precision: "2 decimal places; the cap comparison is strict (exposure == consultant_budget is permitted)"
    variants: []

  - name: wip_aging_buckets
    trigger: "GET /projects/{project_id}/wip-aging"
    algorithm: chronological
    formula: |
      as_of = calendar date of the logical clock
      for each unbilled charge:
          charge_date = TimeEntry.work_date | ExpenseItem.incurred_on | ConsultantInvoice.invoice_date
          age_days    = max(0, whole_days_between(charge_date, as_of))
          value       = the charge's billable_amount
      bucket_0_30    = sum(value) where age_days <= 30
      bucket_31_60   = sum(value) where 31 <= age_days <= 60
      bucket_61_90   = sum(value) where 61 <= age_days <= 90
      bucket_over_90 = sum(value) where age_days >= 91
      total_unbilled = bucket_0_30 + bucket_31_60 + bucket_61_90 + bucket_over_90   # == Project.unbilled_wip
      write_off_eligible_amount = bucket_over_90
      # DELIBERATE ASYMMETRY: the OVER_90 bucket is STRICTLY greater than 90 days,
      # while write_off_approval_routing escalates to CONTROLLER at aging_days >= 90.
      # A charge exactly 90 days old therefore sits in bucket_61_90 yet already
      # forces Controller approval.
    input_set: "TimeEntry rows with status == APPROVED and billed_invoice_id IS NULL, ExpenseItem rows with allowability_status == ALLOWED and billing_status == UNBILLED, ConsultantInvoice rows with approval_status == APPROVED and billing_status == UNBILLED"
    constants: {}
    precision: "money at 2 decimal places; ages are whole calendar days, computed date-to-date with no time-of-day component"
    variants: []

  - name: write_off_wip_allocation
    trigger: "POST /write-offs with target_type == UNBILLED_LABOR_WIP"
    algorithm: waterfall_allocation
    formula: |
      candidates = TimeEntry rows where project_id == W.project_id
                     AND status == APPROVED AND billed_invoice_id IS NULL
      order candidates by work_date ASC, then created_at ASC   # never by id
      running = 0.00; allocated = []
      for e in ordered candidates:
          running = running + e.billable_amount
          allocated.append(e.id)
          if running == W.amount: break with success
          if running >  W.amount: -> ERR_WRITE_OFF_AMOUNT_NOT_ALLOCATABLE
      if running != W.amount: -> ERR_WRITE_OFF_AMOUNT_NOT_ALLOCATABLE
      allocated_time_entry_ids = allocated
      aging_days = max(age_days of the allocated entries, using work_date and the logical clock)
      # For target_type == INVOICE_RECEIVABLE there is no allocation: the amount MUST
      # equal Invoice.net_due exactly (else ERR_WRITE_OFF_AMOUNT_MISMATCH) and
      # aging_days is the age of Invoice.period_end.
    input_set: "Only the project's unbilled APPROVED labor; expenses and consultant payables are never written off through this path"
    constants: {}
    precision: "2 decimal places; the amount must equal an exact prefix sum of the ordered candidate list"
    variants: []

  - name: write_off_approval_routing
    trigger: "POST /write-offs, after write_off_wip_allocation has fixed amount and aging_days"
    algorithm: threshold
    formula: |
      required_approver = CONTROLLER if (amount >= WRITE_OFF_CONTROLLER_AMOUNT
                                         OR aging_days >= WRITE_OFF_CONTROLLER_AGING_DAYS)
                          else PROJECT_MANAGER
      status = PENDING_CONTROLLER_APPROVAL if required_approver == CONTROLLER
               else PENDING_PM_APPROVAL
      # INVOICE_RECEIVABLE write-offs always route to CONTROLLER regardless of amount.
    input_set: "The single WriteOff row being created"
    constants:
      WRITE_OFF_CONTROLLER_AMOUNT: 5000.00
      WRITE_OFF_CONTROLLER_AGING_DAYS: 90
    precision: "both thresholds are inclusive: amount == 5000.00 and aging_days == 90 each route to CONTROLLER"
    variants: []

  - name: subcontract_commitment_rollup
    trigger: "recomputed whenever a ConsultantInvoice on the subcontract changes approval_status or payment_status"
    algorithm: aggregation
    formula: |
      approved_to_date   = sum(ci.amount where ci.approval_status == APPROVED)
      released_to_date   = sum(ci.amount where ci.payment_status  == RELEASED)
      committed_remaining = committed_amount - approved_to_date
      # Conserved quantity — this identity MUST hold after every request:
      #   committed_amount == committed_remaining + approved_to_date
      # A RECEIVED -> APPROVED -> REJECTED round trip therefore returns
      # committed_remaining to its exact starting value.
    input_set: "All ConsultantInvoice rows of this subcontract; REJECTED rows contribute to neither sum"
    constants: {}
    precision: "2 decimal places"
    variants: []

# =============================================================================
# 1.4 VALIDATION RULES (ORDERED BY PRIORITY)
# -----------------------------------------------------------------------------
# The FIRST rule whose condition is violated determines the response. Lower
# priority number == evaluated earlier == wins. Regulatory/compliance safety
# (overhead-rate certification, unallowable cost screening, period locks) is
# deliberately placed AHEAD of fiscal capacity checks (budget, commitment,
# earned-value ceilings), because a public-agency billing built on an
# uncertified rate is a compliance defect whereas an over-budget billing is
# merely a money defect.
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Id and X-User-Role headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is one of FirmAdmin, Controller, ProjectManager, ProjectAccountant, ClientContact AND is listed in the endpoint's roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "ownership: when X-User-Role == ProjectManager on an endpoint that mutates a project's own records, X-User-Id must equal Project.project_manager_user_id"
    error_id: ERR_NOT_PROJECT_MANAGER
    http_status: 403
    applies_to: "POST /phases, POST /phases/{phase_id}/assess, POST /phases/{phase_id}/complete, POST /time-entries, POST /time-entries/{time_entry_id}/approve, POST /consultant-subcontracts, POST /consultant-subcontracts/{subcontract_id}/execute, POST /consultant-invoices/{consultant_invoice_id}/approve, POST /consultant-invoices/{consultant_invoice_id}/reject, POST /write-offs, POST /write-offs/{write_off_id}/approve, POST /projects/{project_id}/activate"
  - priority: 4
    category: auth
    check: "ownership: when X-User-Role == ClientContact, X-User-Id must equal the Project's client_id"
    error_id: ERR_NOT_PROJECT_CLIENT
    http_status: 403
    applies_to: "POST /invoices/{invoice_id}/review, GET /invoices/{invoice_id}, GET /invoices"

  - priority: 5
    category: auth
    check: "segregation of duties: the acting X-User-Id must differ from the user who created the record under approval (TimeEntry.submitted_by_user_id, ConsultantInvoice.entered_by_user_id, WriteOff.prepared_by_user_id, Invoice.prepared_by_user_id)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /time-entries/{time_entry_id}/approve, POST /consultant-invoices/{consultant_invoice_id}/approve, POST /write-offs/{write_off_id}/approve, POST /invoices/{invoice_id}/submit"

  - priority: 6
    category: auth
    check: "approval level: a WriteOff whose status is PENDING_CONTROLLER_APPROVAL may only be approved by X-User-Role == Controller; a ProjectManager is authenticated and authorized for the endpoint but not for this row"
    error_id: ERR_APPROVAL_LEVEL_INSUFFICIENT
    http_status: 403
    applies_to: "POST /write-offs/{write_off_id}/approve"

  - priority: 10
    category: business_constraint
    check: "request body/query shape: required fields present, correct JSON types, enum members valid, money >= 0.00 with at most 2 decimals, multipliers and percents within declared ranges, dates valid ISO-8601 calendar dates, pagination limit in [1,100] and offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 20
    category: existence
    check: "path resources exist, resolved strictly left to right"
    error_id: ERR_PROJECT_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a {project_id} path parameter"

  - priority: 21
    category: existence
    check: "path resource exists: {phase_id}"
    error_id: ERR_PHASE_NOT_FOUND
    http_status: 404
    applies_to: "GET /phases/{phase_id}, GET /phases/{phase_id}/earned-value, POST /phases/{phase_id}/assess, POST /phases/{phase_id}/complete"

  - priority: 22
    category: existence
    check: "path resource exists: {time_entry_id} / {expense_id} / {consultant_invoice_id}"
    error_id: ERR_CHARGE_NOT_FOUND
    http_status: 404
    applies_to: "GET /time-entries/{time_entry_id}, POST /time-entries/{time_entry_id}/approve, GET /expenses/{expense_id}, POST /expenses/{expense_id}/review, GET /consultant-invoices/{consultant_invoice_id}, POST /consultant-invoices/{consultant_invoice_id}/approve, POST /consultant-invoices/{consultant_invoice_id}/reject, POST /consultant-invoices/{consultant_invoice_id}/release-payment"

  - priority: 23
    category: existence
    check: "path resource exists: {subcontract_id}"
    error_id: ERR_SUBCONTRACT_NOT_FOUND
    http_status: 404
    applies_to: "GET /consultant-subcontracts/{subcontract_id}, POST /consultant-subcontracts/{subcontract_id}/execute"

  - priority: 24
    category: existence
    check: "path resource exists: {invoice_id}"
    error_id: ERR_INVOICE_NOT_FOUND
    http_status: 404
    applies_to: "GET /invoices/{invoice_id}, POST /invoices/{invoice_id}/submit, POST /invoices/{invoice_id}/review, POST /invoices/{invoice_id}/revise, POST /invoices/{invoice_id}/record-payment, POST /invoices/{invoice_id}/void"

  - priority: 25
    category: existence
    check: "path resource exists: {write_off_id} / {certification_id} / {billing_multiplier_id} / {client_id}"
    error_id: ERR_WRITE_OFF_NOT_FOUND
    http_status: 404
    applies_to: "GET /write-offs/{write_off_id}, POST /write-offs/{write_off_id}/approve"

  - priority: 26
    category: existence
    check: "path resource exists: {certification_id}"
    error_id: ERR_CERTIFICATION_NOT_FOUND
    http_status: 404
    applies_to: "GET /overhead-certifications/{certification_id}, POST /overhead-certifications/{certification_id}/certify, POST /overhead-certifications/{certification_id}/return-findings"

  - priority: 27
    category: existence
    check: "path resource exists: {billing_multiplier_id}"
    error_id: ERR_MULTIPLIER_NOT_FOUND
    http_status: 404
    applies_to: "GET /billing-multipliers/{billing_multiplier_id}"

  - priority: 28
    category: existence
    check: "path resource exists: {client_id}"
    error_id: ERR_CLIENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /clients/{client_id}"

  - priority: 29
    category: business_referential
    check: "body foreign keys resolve: client_id, project_id, phase_id, parent_phase_id, subcontract_id, invoice_id referenced in the request body must exist, and phase_id must belong to the referenced project_id"
    error_id: ERR_INVALID_REFERENCE
    http_status: 422
    applies_to: "POST /projects, POST /phases, POST /time-entries, POST /expenses, POST /consultant-subcontracts, POST /consultant-invoices, POST /write-offs"

  - priority: 30
    category: state
    check: "optimistic concurrency: expected_project_version must equal the current Project.version"
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412
    applies_to: "POST /billing-multipliers, POST /invoices"

  - priority: 40
    category: state
    check: "the owning Project must be in ACTIVE status for charge capture, subcontracting, invoicing and write-off preparation. BillingMultiplier creation is deliberately exempt — a project cannot be activated until an ACTIVE multiplier exists, so the first multiplier is written while the project is still in SETUP; for POST /billing-multipliers the requirement is only Project.status != CLOSED"
    error_id: ERR_PROJECT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /time-entries, POST /expenses, POST /consultant-subcontracts, POST /consultant-invoices, POST /invoices, POST /write-offs, POST /phases/{phase_id}/assess, POST /phases/{phase_id}/complete, POST /billing-multipliers (CLOSED only)"

  - priority: 41
    category: state
    check: "the target row must be in a state from which the requested transition is declared in §1.2 (TimeEntry must be SUBMITTED to approve, ExpenseItem must be PENDING_REVIEW to review, ConsultantSubcontract must be DRAFT to execute, ConsultantInvoice must be RECEIVED to approve/reject and APPROVED with payment_status WITHHELD to release payment, Invoice must be DRAFT to submit / PENDING_CLIENT_REVIEW to review / REVISION_REQUESTED to revise / APPROVED to record payment, WriteOff must be PENDING_*_APPROVAL to approve, OverheadRateCertification must be SUBMITTED to certify or return findings, Phase must be PLANNED or IN_PROGRESS to assess and IN_PROGRESS to complete)"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "every action endpoint"

  - priority: 50
    category: business_safety
    check: "public-agency compliance: when Client.is_public_agency is true, a CERTIFIED OverheadRateCertification must exist for the calendar year of the logical clock before an Invoice may be prepared (project_billing_posture == HOLD blocks POST /invoices)"
    error_id: ERR_OVERHEAD_RATE_NOT_CERTIFIED
    http_status: 409
    applies_to: "POST /invoices"

  - priority: 51
    category: business_safety
    check: "public-agency compliance: a BillingMultiplier on a public-agency project must not exceed certified_multiplier_ceiling derived from the CERTIFIED final overhead rate"
    error_id: ERR_MULTIPLIER_ABOVE_CERTIFIED_CEILING
    http_status: 422
    applies_to: "POST /billing-multipliers"

  - priority: 52
    category: business_safety
    check: "allowability: a PENDING_REVIEW ExpenseItem whose category is statutorily unallowable for a public agency or listed in Client.disallowed_categories may not be allowed at review (decision ALLOW is refused; decision DISALLOW is always available), and a DISALLOWED expense may never be swept onto an Invoice"
    error_id: ERR_EXPENSE_UNALLOWABLE
    http_status: 422
    applies_to: "POST /invoices, POST /expenses/{expense_id}/review"

  - priority: 55
    category: business_temporal
    check: "period lock: a charge whose service date (TimeEntry.work_date, ExpenseItem.incurred_on, ConsultantInvoice.invoice_date) falls on or before Project.locked_through_date cannot be created or approved"
    error_id: ERR_PERIOD_LOCKED
    http_status: 422
    applies_to: "POST /time-entries, POST /expenses, POST /consultant-invoices, POST /time-entries/{time_entry_id}/approve"

  - priority: 56
    category: business_temporal
    check: "labor rate windows: a new LaborRate for the same role_code must not overlap an existing window; the intervals are half-open [effective_from, effective_to), so a window starting exactly on an existing window's effective_to is adjacent and therefore legal"
    error_id: ERR_RATE_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /labor-rates"

  - priority: 57
    category: business_temporal
    check: "multiplier backdating: a new BillingMultiplier's effective_from must be strictly greater than the effective_from of the project's current ACTIVE multiplier, and must not precede any already-BILLED charge's work_date"
    error_id: ERR_MULTIPLIER_BACKDATED
    http_status: 409
    applies_to: "POST /billing-multipliers"

  - priority: 60
    category: business_constraint
    check: "charges may only be booked to a leaf phase (a phase with no child phases)"
    error_id: ERR_PHASE_NOT_LEAF
    http_status: 422
    applies_to: "POST /time-entries, POST /expenses, POST /consultant-subcontracts"

  - priority: 61
    category: business_constraint
    check: "work breakdown structure acyclicity: parent_phase_id must not create a cycle in the phase tree and must reference a phase in the same project"
    error_id: ERR_WBS_CYCLE
    http_status: 422
    applies_to: "POST /phases"

  - priority: 62
    category: business_constraint
    check: "wbs_code must be unique within the project"
    error_id: ERR_WBS_CODE_DUPLICATE
    http_status: 409
    applies_to: "POST /phases"

  - priority: 63
    category: business_referential
    check: "an effective LaborRate must exist for the time entry's role_code covering work_date at approval time"
    error_id: ERR_NO_EFFECTIVE_LABOR_RATE
    http_status: 422
    applies_to: "POST /time-entries/{time_entry_id}/approve"

  - priority: 64
    category: business_referential
    check: "an effective BillingMultiplier must exist for the project covering the time entry's work_date"
    error_id: ERR_NO_EFFECTIVE_MULTIPLIER
    http_status: 422
    applies_to: "POST /time-entries/{time_entry_id}/approve"

  - priority: 65
    category: business_constraint
    check: "pay-when-paid: a ConsultantInvoice may only be released for payment once the client Invoice that billed it has reached PAID"
    error_id: ERR_PAY_WHEN_PAID_NOT_SATISFIED
    http_status: 409
    applies_to: "POST /consultant-invoices/{consultant_invoice_id}/release-payment"

  - priority: 66
    category: business_constraint
    check: "a Phase may not be completed while it still has SUBMITTED time entries or PENDING_REVIEW expenses"
    error_id: ERR_PHASE_HAS_OPEN_CHARGES
    http_status: 409
    applies_to: "POST /phases/{phase_id}/complete"

  - priority: 67
    category: business_constraint
    check: "at most one OverheadRateCertification per fiscal_year may exist in SUBMITTED or CERTIFIED status"
    error_id: ERR_CERTIFICATION_YEAR_DUPLICATE
    http_status: 409
    applies_to: "POST /overhead-certifications"

  - priority: 68
    category: business_constraint
    check: "revision cycle termination: a REQUEST_REVISION decision is refused once Invoice.revision_round has reached 3"
    error_id: ERR_REVISION_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /invoices/{invoice_id}/review"

  - priority: 69
    category: business_constraint
    check: "backup documentation: when Client.is_public_agency is true, Invoice.backup_missing_count must be 0 — every swept ConsultantInvoice must carry backup_attached == true"
    error_id: ERR_BACKUP_DOCUMENTATION_MISSING
    http_status: 409
    applies_to: "POST /invoices/{invoice_id}/submit"

  - priority: 70
    category: business_constraint
    check: "a Phase must not be created or re-parented such that the sum of sibling phase_fee values exceeds the parent's phase_fee"
    error_id: ERR_WBS_FEE_ROLLUP_MISMATCH
    http_status: 422
    applies_to: "POST /phases"

  - priority: 71
    category: state
    check: "billing review hold: a subcontract may not be executed while the project's billing posture is REVIEW_REQUIRED"
    error_id: ERR_PROJECT_UNDER_BILLING_REVIEW
    http_status: 409
    applies_to: "POST /consultant-subcontracts/{subcontract_id}/execute"

  - priority: 80
    category: business_fiscal
    check: "aggregate consultant capacity: the total committed_amount of EXECUTED subcontracts whose closed commitment windows intersect the candidate's window must not exceed Phase.consultant_budget"
    error_id: ERR_CONSULTANT_BUDGET_OVERCOMMIT
    http_status: 409
    applies_to: "POST /consultant-subcontracts/{subcontract_id}/execute"

  - priority: 81
    category: business_fiscal
    check: "a ConsultantInvoice's amount must not exceed the subcontract's committed_remaining"
    error_id: ERR_SUBCONTRACT_COMMITMENT_EXCEEDED
    http_status: 422
    applies_to: "POST /consultant-invoices/{consultant_invoice_id}/approve"

  - priority: 82
    category: business_fiscal
    check: "fixed-fee headroom: an Invoice's gross_billed must not exceed billing_headroom (earned fee minus already-billed fee) on FIXED_FEE and COST_PLUS_FIXED_FEE contracts"
    error_id: ERR_BILLING_EXCEEDS_EARNED
    http_status: 422
    applies_to: "POST /invoices"

  - priority: 83
    category: business_fiscal
    check: "there must be at least one billable unbilled charge for the period; gross_billed of 0.00 is not an invoice"
    error_id: ERR_NOTHING_TO_INVOICE
    http_status: 422
    applies_to: "POST /invoices"

  - priority: 84
    category: business_fiscal
    check: "an UNBILLED_LABOR_WIP write-off amount must equal an exact prefix sum of the project's unbilled APPROVED time entries ordered by work_date ASC, created_at ASC"
    error_id: ERR_WRITE_OFF_AMOUNT_NOT_ALLOCATABLE
    http_status: 422
    applies_to: "POST /write-offs"

  - priority: 85
    category: business_fiscal
    check: "an INVOICE_RECEIVABLE write-off amount must equal Invoice.net_due exactly"
    error_id: ERR_WRITE_OFF_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /write-offs"

# =============================================================================
# 1.5 API ENDPOINT TABLE
# -----------------------------------------------------------------------------
# Topology is FLAT: api_prefix is "" and every entity has a top-level
# collection, one single-resource GET at /<collection>/{id} and one filtered
# list GET at /<collection> carrying every inbound FK as an optional query
# parameter. That gives every FK declared in §1.1 a reverse-reachability path
# (filtered-list form) and lets a test discover cascade-created rows that never
# appear in any creation response (e.g. a TimeEntry's billed_invoice_id link).
# =============================================================================
endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical clock, which is the sole source of 'now' for aging buckets, effective-date lookups, certification fiscal-year matching and created_at. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; the server MUST NOT fall back to real wall-clock time."
    roles: [FirmAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock set to to_iso8601", "project_billing_posture and wip_aging_buckets re-evaluate against the new instant on their next read"]

  - method: POST
    path: "/clients"
    description: "Register a billing client with its allowability, backup and public-agency profile"
    roles: [FirmAdmin, Controller]
    code: 201
    input: [name, is_public_agency, retainage_pct, expense_markup_pct, disallowed_categories, receipt_required_above, review_cycle_days]
    output: Client
    side_effects: ["client available as an invoicing counterparty"]

  - method: GET
    path: "/clients/{client_id}"
    description: "Retrieve one client"
    roles: [FirmAdmin, Controller, ProjectManager, ProjectAccountant]
    code: 200
    input: []
    output: Client
    side_effects: []

  - method: GET
    path: "/clients"
    description: "List clients"
    roles: [FirmAdmin, Controller, ProjectManager, ProjectAccountant]
    code: 200
    input: ["is_public_agency?", "limit?", "offset?"]
    output: Client[]
    side_effects: []

  - method: POST
    path: "/projects"
    description: "Create a project in SETUP with its contract type, fee structure and percent-complete method"
    roles: [FirmAdmin, Controller]
    code: 201
    input: [client_id, name, contract_type, contract_amount, project_manager_user_id, percent_complete_method, target_multiplier, "wip_alert_threshold?"]
    output: Project
    side_effects: ["version initialised to 1", "project_rollup_metrics initialised to zero", "project_billing_posture computed"]

  - method: GET
    path: "/projects/{project_id}"
    description: "Retrieve one project with its live rollup metrics, billing posture and OCC version"
    roles: [FirmAdmin, Controller, ProjectManager, ProjectAccountant]
    code: 200
    input: []
    output: Project
    side_effects: ["project_rollup_metrics recomputed", "project_billing_posture recomputed"]

  - method: GET
    path: "/projects"
    description: "List projects, filterable by client, manager and status"
    roles: [FirmAdmin, Controller, ProjectManager, ProjectAccountant]
    code: 200
    input: ["client_id?", "project_manager_user_id?", "status?", "limit?", "offset?"]
    output: Project[]
    side_effects: []

  - method: POST
    path: "/projects/{project_id}/activate"
    description: "Move a project from SETUP to ACTIVE, opening it for charge capture and invoicing"
    roles: [FirmAdmin, Controller, ProjectManager]
    code: 200
    input: []
    output: Project
    side_effects: ["Project.status -> ACTIVE", "increments Project.version by 1", "all PLANNED phases become chargeable"]

  - method: POST
    path: "/projects/{project_id}/lock-period"
    description: "Close an accounting period: charges dated on or before locked_through_date can no longer be created or approved"
    roles: [Controller]
    code: 200
    input: [locked_through_date]
    output: Project
    side_effects: ["Project.locked_through_date set", "increments Project.version by 1", "ERR_PERIOD_LOCKED becomes reachable for charges in the closed window"]

  - method: GET
    path: "/projects/{project_id}/wip-aging"
    description: "Computed read: unbilled work-in-progress bucketed by age against the logical clock, with the over-90-day write-off eligible amount"
    roles: [Controller, ProjectManager, ProjectAccountant]
    code: 200
    input: []
    output: WipAgingReport
    output_shape: "{ project_id, as_of_date, bucket_0_30, bucket_31_60, bucket_61_90, bucket_over_90, total_unbilled, write_off_eligible_amount } — a computed report, not a persisted entity"
    side_effects: ["wip_aging_buckets evaluated"]

  - method: POST
    path: "/phases"
    description: "Add a work breakdown structure node with its fee basis and phase budgets"
    roles: [FirmAdmin, Controller, ProjectManager]
    code: 201
    input: [project_id, wbs_code, fee_basis, "parent_phase_id?", "fee_percent?", "lump_sum_fee?", budget_labor_cost, consultant_budget]
    output: Phase
    side_effects: ["phase_fee derived from fee_basis", "parent phase becomes non-leaf and is no longer chargeable", "ERR_WBS_FEE_ROLLUP_MISMATCH enforced against the parent's fee"]

  - method: GET
    path: "/phases/{phase_id}"
    description: "Retrieve one phase with its derived fee, actual cost and recognized earned value"
    roles: [FirmAdmin, Controller, ProjectManager, ProjectAccountant]
    code: 200
    input: []
    output: Phase
    side_effects: ["phase_earned_value recomputed"]

  - method: GET
    path: "/phases"
    description: "List phases, filterable by project, parent node and status"
    roles: [FirmAdmin, Controller, ProjectManager, ProjectAccountant]
    code: 200
    input: ["project_id?", "parent_phase_id?", "status?", "limit?", "offset?"]
    output: Phase[]
    side_effects: []

  - method: POST
    path: "/phases/{phase_id}/assess"
    description: "Record the project manager's physical completion assessment for the phase"
    roles: [ProjectManager, Controller]
    code: 200
    input: [assessed_percent_complete]
    output: Phase
    side_effects: ["Phase.assessed_percent_complete set", "phase_earned_value recomputed (moves recognized_earned_value only when the project's method is ASSESSED)", "project_rollup_metrics.earned_revenue_to_date refreshed"]

  - method: POST
    path: "/phases/{phase_id}/complete"
    description: "Close an in-progress phase; recognized earned value is forced to the full phase fee regardless of the project's percent-complete method"
    roles: [ProjectManager, Controller]
    code: 200
    input: []
    output: Phase
    side_effects: ["Phase.status -> COMPLETE", "recognized_earned_value := phase_fee", "when every leaf phase of the project is COMPLETE the Project bubbles up to CLOSED", "project_rollup_metrics.earned_revenue_to_date refreshed"]

  - method: GET
    path: "/phases/{phase_id}/earned-value"
    description: "Computed read: both percent-complete variants side by side so the divergence between cost-to-cost and assessed recognition is visible"
    roles: [Controller, ProjectManager, ProjectAccountant]
    code: 200
    input: []
    output: EarnedValueReport
    output_shape: "{ phase_id, phase_fee, budget_labor_cost, actual_labor_cost_to_date, effort_based_percent_complete, effort_based_earned_value, assessed_percent_complete, assessed_earned_value, selected_method, recognized_earned_value } — a computed report, not a persisted entity"
    side_effects: ["phase_earned_value evaluated for both variants"]

  - method: POST
    path: "/labor-rates"
    description: "Publish a raw cost rate (raw_cost_rate) for a role code over a half-open effective window [effective_from, effective_to)"
    roles: [Controller]
    code: 201
    input: [role_code, raw_cost_rate, effective_from, "effective_to?"]
    output: LaborRate
    side_effects: ["pairwise overlap screened against existing windows for the same role_code (adjacency at effective_to is legal)", "future time entries for this role_code resolve against this window"]

  - method: GET
    path: "/labor-rates"
    description: "List published cost rates, optionally resolving the window covering a given date"
    roles: [FirmAdmin, Controller, ProjectAccountant]
    code: 200
    input: ["role_code?", "effective_on?", "limit?", "offset?"]
    output: LaborRate[]
    side_effects: []

  - method: POST
    path: "/billing-multipliers"
    description: "Set the project's billing multiplier from a given effective date; supersedes the current ACTIVE multiplier. Optimistically concurrent on Project.version"
    roles: [Controller]
    code: 201
    input: [project_id, multiplier, effective_from, "effective_to?", expected_project_version]
    output: BillingMultiplier
    side_effects: ["previous ACTIVE multiplier -> SUPERSEDED with effective_to truncated to the new effective_from", "increments Project.version by 1", "certified ceiling enforced on public-agency projects"]

  - method: GET
    path: "/billing-multipliers/{billing_multiplier_id}"
    description: "Retrieve one billing multiplier"
    roles: [FirmAdmin, Controller, ProjectAccountant]
    code: 200
    input: []
    output: BillingMultiplier
    side_effects: []

  - method: GET
    path: "/billing-multipliers"
    description: "List billing multipliers for a project including superseded history"
    roles: [FirmAdmin, Controller, ProjectManager, ProjectAccountant]
    code: 200
    input: ["project_id?", "status?", "limit?", "offset?"]
    output: BillingMultiplier[]
    side_effects: []

  - method: POST
    path: "/time-entries"
    description: "Submit a timesheet line against a leaf phase; hours are recorded but no money is computed until the line is approved"
    roles: [ProjectManager, ProjectAccountant]
    code: 201
    input: [project_id, phase_id, role_code, work_date, hours]
    output: TimeEntry
    side_effects: ["submitted_by_user_id captured from X-User-Id", "status -> SUBMITTED (contributes to no rollup and no aging bucket yet)", "raw_cost, billable_amount and applied_multiplier stay 0.00/0.00/null until approval"]

  - method: GET
    path: "/time-entries/{time_entry_id}"
    description: "Retrieve one time entry with its frozen rate, multiplier and amounts"
    roles: [FirmAdmin, Controller, ProjectManager, ProjectAccountant]
    code: 200
    input: []
    output: TimeEntry
    side_effects: []

  - method: GET
    path: "/time-entries"
    description: "List time entries; filtering by billed_invoice_id is the only way to discover which entries an invoice swept"
    roles: [FirmAdmin, Controller, ProjectManager, ProjectAccountant]
    code: 200
    input: ["project_id?", "phase_id?", "status?", "billed_invoice_id?", "submitted_by_user_id?", "limit?", "offset?"]
    output: TimeEntry[]
    side_effects: []

  - method: POST
    path: "/time-entries/{time_entry_id}/approve"
    description: "Approve a submitted timesheet line; the effective rate and multiplier for its work_date are resolved and frozen here, then the line is admitted to work in progress"
    roles: [ProjectManager, Controller]
    code: 200
    input: []
    output: TimeEntry
    side_effects: ["effective_rate_lookup resolves the LaborRate and BillingMultiplier rows covering work_date", "labor_charge_computation freezes raw_cost, applied_multiplier and billable_amount", "status -> APPROVED", "approved_by_user_id captured from X-User-Id (must differ from submitted_by_user_id)", "Phase.actual_labor_cost_to_date increases by raw_cost", "phase_earned_value recomputed", "Phase PLANNED -> IN_PROGRESS on first approval", "project_rollup_metrics.unbilled_wip increases by billable_amount", "project_billing_posture re-evaluated"]

  - method: POST
    path: "/expenses"
    description: "Record a reimbursable expense against a leaf phase; client allowability rules and markup are applied at capture"
    roles: [ProjectManager, ProjectAccountant]
    code: 201
    input: [project_id, phase_id, category, amount, incurred_on, receipt_attached]
    output: ExpenseItem
    side_effects: ["expense_allowability_and_markup sets allowability_status and billable_amount", "a missing receipt at or above the client threshold lands PENDING_REVIEW and outranks both exclusion clauses", "a documented but statutorily or contractually excluded category lands DISALLOWED with billable_amount 0.00", "only an ALLOWED expense increases project_rollup_metrics.unbilled_wip"]

  - method: GET
    path: "/expenses/{expense_id}"
    description: "Retrieve one expense with its allowability decision and marked-up billable amount"
    roles: [FirmAdmin, Controller, ProjectManager, ProjectAccountant]
    code: 200
    input: []
    output: ExpenseItem
    side_effects: []

  - method: GET
    path: "/expenses"
    description: "List expenses, filterable by phase, allowability, billing status and sweeping invoice"
    roles: [FirmAdmin, Controller, ProjectManager, ProjectAccountant]
    code: 200
    input: ["project_id?", "phase_id?", "allowability_status?", "billing_status?", "billed_invoice_id?", "limit?", "offset?"]
    output: ExpenseItem[]
    side_effects: []

  - method: POST
    path: "/expenses/{expense_id}/review"
    description: "Controller adjudicates an expense held for missing backup: ALLOW applies the client markup, DISALLOW zeroes the billable amount"
    roles: [Controller]
    code: 200
    input: [decision, justification]
    output: ExpenseItem
    side_effects: ["allowability_status -> ALLOWED (allowability_reason ALLOWED_BY_REVIEW) or DISALLOWED (allowability_reason DISALLOWED_BY_REVIEW)", "billable_amount recomputed by expense_allowability_and_markup on ALLOW, forced to 0.00 on DISALLOW", "project_rollup_metrics.unbilled_wip adjusted in the same request"]

  - method: POST
    path: "/consultant-subcontracts"
    description: "Draft a consultant subcontract against a leaf phase's consultant budget with its commitment window and pay-when-paid terms; the client-facing markup is not supplied here, it is derived per payable by consultant_markup_computation"
    roles: [FirmAdmin, Controller, ProjectManager]
    code: 201
    input: [project_id, phase_id, consultant_name, committed_amount, pay_when_paid, commitment_start, commitment_end]
    output: ConsultantSubcontract
    side_effects: ["status -> DRAFT (consumes no capacity yet)", "committed_remaining initialised to committed_amount"]

  - method: GET
    path: "/consultant-subcontracts/{subcontract_id}"
    description: "Retrieve one subcontract with its live commitment rollup"
    roles: [FirmAdmin, Controller, ProjectManager, ProjectAccountant]
    code: 200
    input: []
    output: ConsultantSubcontract
    side_effects: ["subcontract_commitment_rollup recomputed"]

  - method: GET
    path: "/consultant-subcontracts"
    description: "List subcontracts, filterable by project, phase and status"
    roles: [FirmAdmin, Controller, ProjectManager, ProjectAccountant]
    code: 200
    input: ["project_id?", "phase_id?", "status?", "limit?", "offset?"]
    output: ConsultantSubcontract[]
    side_effects: []

  - method: POST
    path: "/consultant-subcontracts/{subcontract_id}/execute"
    description: "Execute a drafted subcontract, committing the phase's consultant budget for the commitment window"
    roles: [FirmAdmin, Controller, ProjectManager]
    code: 200
    input: []
    output: ConsultantSubcontract
    side_effects: ["consultant_commitment_overlap_exposure evaluated against other EXECUTED subcontracts on the same phase with closed-inclusive windows", "status -> EXECUTED", "phase consultant capacity consumed", "refused while the project's billing posture is REVIEW_REQUIRED"]

  - method: POST
    path: "/consultant-invoices"
    description: "Enter a consultant's payable against an executed subcontract; the client-billable amount is the payable plus the applicable markup"
    roles: [ProjectAccountant, Controller]
    code: 201
    input: [subcontract_id, amount, invoice_date, backup_attached]
    output: ConsultantInvoice
    side_effects: ["consultant_markup_computation freezes markup_amount and billable_amount", "entered_by_user_id captured from X-User-Id", "approval_status -> RECEIVED, payment_status -> WITHHELD, billing_status -> UNBILLED (three independent axes)"]

  - method: GET
    path: "/consultant-invoices/{consultant_invoice_id}"
    description: "Retrieve one consultant payable with its three status axes and frozen markup"
    roles: [FirmAdmin, Controller, ProjectManager, ProjectAccountant]
    code: 200
    input: []
    output: ConsultantInvoice
    side_effects: []

  - method: GET
    path: "/consultant-invoices"
    description: "List consultant payables; filtering by client_invoice_id is the only way to discover which payables an invoice swept"
    roles: [FirmAdmin, Controller, ProjectManager, ProjectAccountant]
    code: 200
    input: ["subcontract_id?", "client_invoice_id?", "approval_status?", "payment_status?", "billing_status?", "limit?", "offset?"]
    output: ConsultantInvoice[]
    side_effects: []

  - method: POST
    path: "/consultant-invoices/{consultant_invoice_id}/approve"
    description: "Approve a consultant payable, drawing down the subcontract's remaining commitment and admitting the marked-up amount to work in progress"
    roles: [ProjectManager, Controller]
    code: 200
    input: []
    output: ConsultantInvoice
    side_effects: ["approval_status -> APPROVED", "approved_by_user_id captured from X-User-Id (must differ from entered_by_user_id)", "subcontract_commitment_rollup reduces committed_remaining by amount", "project_rollup_metrics.unbilled_wip increases by billable_amount"]

  - method: POST
    path: "/consultant-invoices/{consultant_invoice_id}/reject"
    description: "Reject a consultant payable; when it had already been approved, the commitment drawdown and the work-in-progress admission are both reversed"
    roles: [ProjectManager, Controller]
    code: 200
    input: [reason]
    output: ConsultantInvoice
    side_effects: ["approval_status -> REJECTED", "compensating: committed_remaining restored to its pre-approval value", "compensating: project_rollup_metrics.unbilled_wip reduced by billable_amount", "payment_status stays WITHHELD permanently — a REJECTED payable can never be released"]

  - method: POST
    path: "/consultant-invoices/{consultant_invoice_id}/release-payment"
    description: "Release payment to the consultant; under pay-when-paid terms only permitted once the client invoice that billed it has been paid"
    roles: [Controller]
    code: 200
    input: []
    output: ConsultantInvoice
    side_effects: ["pay_when_paid gate evaluated against client_invoice_id's Invoice.status", "payment_status -> RELEASED", "released_to_date on the subcontract rollup increases"]

  - method: POST
    path: "/invoices"
    description: "Prepare a draft invoice that sweeps every billable unbilled charge dated on or before period_end. Optimistically concurrent on Project.version"
    roles: [ProjectAccountant, Controller]
    code: 201
    input: [project_id, period_end, expected_project_version]
    output: Invoice
    side_effects: ["invoice_totals_computation freezes labor_billed, expense_billed, consultant_billed, gross_billed, discount_amount, retainage_amount and net_due", "swept TimeEntry rows -> BILLED with billed_invoice_id set", "swept ExpenseItem rows -> BILLED with billed_invoice_id set", "swept ConsultantInvoice rows -> BILLED_TO_CLIENT with client_invoice_id set", "prepared_by_user_id captured from X-User-Id", "increments Project.version by 1", "project_rollup_metrics.unbilled_wip falls to the residual and billed_open rises by gross_billed"]

  - method: GET
    path: "/invoices/{invoice_id}"
    description: "Retrieve one invoice with its frozen totals and revision count"
    roles: [FirmAdmin, Controller, ProjectManager, ProjectAccountant, ClientContact]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: GET
    path: "/invoices"
    description: "List invoices for a project"
    roles: [FirmAdmin, Controller, ProjectManager, ProjectAccountant, ClientContact]
    code: 200
    input: ["project_id?", "status?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []

  - method: POST
    path: "/invoices/{invoice_id}/submit"
    description: "Submit the invoice to the client for review; consultant backup completeness is enforced here for public-agency clients, not at preparation"
    roles: [ProjectAccountant, Controller]
    code: 200
    input: []
    output: Invoice
    side_effects: ["Invoice.backup_missing_count verified against the public-agency requirement", "status -> PENDING_CLIENT_REVIEW", "submitted_by_user_id captured from X-User-Id (must differ from prepared_by_user_id)"]

  - method: POST
    path: "/invoices/{invoice_id}/review"
    description: "Client contact accepts the invoice or requests a revision; a revision request sends it back to REVISION_REQUESTED and increments revision_round"
    roles: [ClientContact]
    code: 200
    input: [decision, "comment?"]
    output: Invoice
    side_effects: ["decision APPROVE: status -> APPROVED", "decision REQUEST_REVISION: revision_round incremented then status -> REVISION_REQUESTED", "a REQUEST_REVISION at revision_round == 3 is refused with ERR_REVISION_LIMIT_EXCEEDED"]

  - method: POST
    path: "/invoices/{invoice_id}/revise"
    description: "Return a revision-requested invoice to DRAFT so its swept charges can be re-examined; the totals stay frozen"
    roles: [ProjectAccountant, Controller]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status -> DRAFT (the cycle DRAFT -> PENDING_CLIENT_REVIEW -> REVISION_REQUESTED -> DRAFT)", "submitted_by_user_id cleared so the segregation-of-duties check applies afresh"]

  - method: POST
    path: "/invoices/{invoice_id}/record-payment"
    description: "Record receipt of the invoice's net due in full; this is the event that satisfies pay-when-paid downstream"
    roles: [Controller]
    code: 200
    input: [received_on]
    output: Invoice
    side_effects: ["status -> PAID", "project_rollup_metrics moves gross_billed from billed_open to paid_gross_to_date", "every ConsultantInvoice with client_invoice_id == this invoice becomes eligible for payment release", "project_billing_posture re-evaluated"]

  - method: POST
    path: "/invoices/{invoice_id}/void"
    description: "Void an invoice, releasing every charge it swept back to unbilled so it can be re-invoiced"
    roles: [Controller]
    code: 200
    input: [reason]
    output: Invoice
    side_effects: ["status -> VOID", "compensating: swept TimeEntry rows return to APPROVED with billed_invoice_id cleared", "compensating: swept ExpenseItem rows return to UNBILLED with billed_invoice_id cleared", "compensating: swept ConsultantInvoice rows return to UNBILLED with client_invoice_id cleared", "project_rollup_metrics.unbilled_wip restored to its pre-invoice value with no drift"]

  - method: POST
    path: "/write-offs"
    description: "Prepare a write-off of unbilled labor work in progress or of an uncollectible invoice receivable; the approval level is routed from amount and aging"
    roles: [ProjectAccountant, ProjectManager, Controller]
    code: 201
    input: [project_id, target_type, amount, reason, "invoice_id?"]
    output: WriteOff
    side_effects: ["write_off_wip_allocation resolves allocated_time_entry_ids and aging_days", "write_off_approval_routing sets required_approver and the initial status", "prepared_by_user_id captured from X-User-Id"]

  - method: GET
    path: "/write-offs/{write_off_id}"
    description: "Retrieve one write-off with its allocation and routing decision"
    roles: [FirmAdmin, Controller, ProjectManager, ProjectAccountant]
    code: 200
    input: []
    output: WriteOff
    side_effects: []

  - method: GET
    path: "/write-offs"
    description: "List write-offs, filterable by project, target invoice, status and preparer"
    roles: [FirmAdmin, Controller, ProjectManager, ProjectAccountant]
    code: 200
    input: ["project_id?", "invoice_id?", "status?", "prepared_by_user_id?", "limit?", "offset?"]
    output: WriteOff[]
    side_effects: []

  - method: POST
    path: "/write-offs/{write_off_id}/approve"
    description: "Approve a routed write-off; the two routing branches join on APPROVED but apply different side effects"
    roles: [ProjectManager, Controller]
    code: 200
    input: []
    output: WriteOff
    side_effects: ["status -> APPROVED", "approved_by_user_id captured from X-User-Id (must differ from prepared_by_user_id)", "UNBILLED_LABOR_WIP: each allocated TimeEntry -> WRITTEN_OFF and unbilled_wip falls by the write-off amount", "INVOICE_RECEIVABLE: the target Invoice -> WRITTEN_OFF and its gross_billed moves from billed_open to written_off_gross", "a PENDING_CONTROLLER_APPROVAL row rejects a ProjectManager approver"]

  - method: POST
    path: "/overhead-certifications"
    description: "Submit a fiscal year's indirect cost pool and direct labor base; the provisional overhead rate is computed on annualized, unadjusted figures"
    roles: [Controller, FirmAdmin]
    code: 201
    input: [fiscal_year, ytd_months, direct_labor_base, indirect_cost_pool, unallowable_costs]
    output: OverheadRateCertification
    side_effects: ["overhead_rate_computation PROVISIONAL variant applied", "status -> SUBMITTED (public-agency projects remain on HOLD)"]

  - method: GET
    path: "/overhead-certifications/{certification_id}"
    description: "Retrieve one certification with both rate variants and the derived multiplier ceiling"
    roles: [FirmAdmin, Controller, ProjectAccountant]
    code: 200
    input: []
    output: OverheadRateCertification
    side_effects: []

  - method: GET
    path: "/overhead-certifications"
    description: "List certifications by fiscal year and status"
    roles: [FirmAdmin, Controller, ProjectAccountant]
    code: 200
    input: ["fiscal_year?", "status?", "limit?", "offset?"]
    output: OverheadRateCertification[]
    side_effects: []

  - method: POST
    path: "/overhead-certifications/{certification_id}/certify"
    description: "Certify the fiscal year: the final rate is recomputed on unannualized actuals with unallowable costs removed, and the certified multiplier ceiling becomes binding on every public-agency project"
    roles: [Controller]
    code: 200
    input: []
    output: OverheadRateCertification
    side_effects: ["overhead_rate_computation FINAL variant applied", "certified_multiplier_ceiling derived", "status -> CERTIFIED", "every public-agency project's billing posture leaves HOLD for the certified calendar year", "certified_by_user_id captured from X-User-Id"]

  - method: POST
    path: "/overhead-certifications/{certification_id}/return-findings"
    description: "Return an audit finding instead of certifying; the fiscal year stays uncertified and public-agency invoicing stays blocked"
    roles: [Controller]
    code: 200
    input: [findings]
    output: OverheadRateCertification
    side_effects: ["status -> REJECTED", "no certified_multiplier_ceiling is published", "the fiscal_year slot is freed for a corrected submission"]

# =============================================================================
# 1.6 ERROR CODE CATALOG
# =============================================================================
errors:
  # --- authentication / authorization ---
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Id or X-User-Role header missing or empty" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "the acting role is unknown or not listed in the endpoint's roles" }
  - { id: ERR_NOT_PROJECT_MANAGER, http: 403, condition: "a ProjectManager acts on a project whose project_manager_user_id is someone else" }
  - { id: ERR_NOT_PROJECT_CLIENT, http: 403, condition: "a ClientContact acts on an invoice whose project belongs to a different client" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "the approver/submitter is the same user who created the record under approval" }
  - { id: ERR_APPROVAL_LEVEL_INSUFFICIENT, http: 403, condition: "a ProjectManager attempts to approve a write-off routed to PENDING_CONTROLLER_APPROVAL" }

  # --- request shape ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "missing required field, wrong type, unknown enum member, negative or over-precise money, malformed date, out-of-range pagination, or a fee field that contradicts fee_basis" }

  # --- existence (404) ---
  - { id: ERR_CLIENT_NOT_FOUND, http: 404, condition: "{client_id} does not resolve" }
  - { id: ERR_PROJECT_NOT_FOUND, http: 404, condition: "{project_id} does not resolve" }
  - { id: ERR_PHASE_NOT_FOUND, http: 404, condition: "{phase_id} does not resolve" }
  - { id: ERR_CHARGE_NOT_FOUND, http: 404, condition: "{time_entry_id}, {expense_id} or {consultant_invoice_id} does not resolve" }
  - { id: ERR_SUBCONTRACT_NOT_FOUND, http: 404, condition: "{subcontract_id} does not resolve" }
  - { id: ERR_INVOICE_NOT_FOUND, http: 404, condition: "{invoice_id} does not resolve" }
  - { id: ERR_WRITE_OFF_NOT_FOUND, http: 404, condition: "{write_off_id} does not resolve" }
  - { id: ERR_CERTIFICATION_NOT_FOUND, http: 404, condition: "{certification_id} does not resolve" }
  - { id: ERR_MULTIPLIER_NOT_FOUND, http: 404, condition: "{billing_multiplier_id} does not resolve" }

  # --- referential integrity (body FKs) ---
  - { id: ERR_INVALID_REFERENCE, http: 422, condition: "a foreign key in the request body does not resolve, or the referenced phase belongs to a different project than the referenced project_id" }

  # --- concurrency ---
  - { id: ERR_STALE_PROJECT_VERSION, http: 412, condition: "expected_project_version does not equal the project's current version" }

  # --- state ---
  - { id: ERR_PROJECT_NOT_ACTIVE, http: 409, condition: "the owning project is still in SETUP or already CLOSED for an operation that requires ACTIVE; for POST /billing-multipliers only the CLOSED case triggers it" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "the requested transition is not declared from the row's current state, including repeating a transition already applied and any attempt to leave a terminal state" }
  - { id: ERR_PROJECT_UNDER_BILLING_REVIEW, http: 409, condition: "a subcontract execution is attempted while the project's billing posture is REVIEW_REQUIRED" }

  # --- compliance / safety (evaluated before fiscal capacity) ---
  - { id: ERR_OVERHEAD_RATE_NOT_CERTIFIED, http: 409, condition: "an invoice is prepared for a public-agency client with no CERTIFIED overhead rate for the logical clock's calendar year" }
  - { id: ERR_MULTIPLIER_ABOVE_CERTIFIED_CEILING, http: 422, condition: "a billing multiplier on a public-agency project exceeds (1 + final_overhead_rate) * (1 + PROFIT_MARGIN_CAP)" }
  - { id: ERR_EXPENSE_UNALLOWABLE, http: 422, condition: "decision ALLOW is attempted on an expense whose allowability_reason is STATUTORY_UNALLOWABLE or CLIENT_EXCLUDED" }

  # --- temporal ---
  - { id: ERR_PERIOD_LOCKED, http: 422, condition: "a charge dated on or before Project.locked_through_date is created or approved" }
  - { id: ERR_RATE_PERIOD_OVERLAP, http: 409, condition: "a new labor rate window for the same role_code overlaps an existing one; adjacency at effective_to is not an overlap" }
  - { id: ERR_MULTIPLIER_BACKDATED, http: 409, condition: "a new billing multiplier's effective_from is not strictly after the current ACTIVE multiplier's effective_from, or precedes an already-billed charge" }

  # --- work breakdown structure constraints ---
  - { id: ERR_PHASE_NOT_LEAF, http: 422, condition: "a charge or subcontract is booked to a phase that has child phases" }
  - { id: ERR_WBS_CYCLE, http: 422, condition: "parent_phase_id would create a cycle or points outside the project" }
  - { id: ERR_WBS_CODE_DUPLICATE, http: 409, condition: "wbs_code already exists on the project" }
  - { id: ERR_WBS_FEE_ROLLUP_MISMATCH, http: 422, condition: "the sum of a parent's child phase fees would exceed the parent's phase_fee" }
  - { id: ERR_PHASE_HAS_OPEN_CHARGES, http: 409, condition: "a phase is completed while SUBMITTED time entries or PENDING_REVIEW expenses remain" }
  - { id: ERR_CERTIFICATION_YEAR_DUPLICATE, http: 409, condition: "a second overhead certification is submitted for a fiscal_year that already has a SUBMITTED or CERTIFIED row" }

  # --- rate resolution ---
  - { id: ERR_NO_EFFECTIVE_LABOR_RATE, http: 422, condition: "no labor rate window for the role_code covers the work_date" }
  - { id: ERR_NO_EFFECTIVE_MULTIPLIER, http: 422, condition: "no billing multiplier covers the charge date" }

  # --- consultant / pay-when-paid ---
  - { id: ERR_PAY_WHEN_PAID_NOT_SATISFIED, http: 409, condition: "payment release is attempted on a pay-when-paid subcontract before the client invoice that billed the payable reached PAID (including the case where it was never billed)" }
  - { id: ERR_CONSULTANT_BUDGET_OVERCOMMIT, http: 409, condition: "the aggregate committed amount of window-intersecting EXECUTED subcontracts would exceed the phase's consultant_budget" }
  - { id: ERR_SUBCONTRACT_COMMITMENT_EXCEEDED, http: 422, condition: "a consultant payable's amount exceeds the subcontract's committed_remaining" }

  # --- invoicing / write-off fiscal checks ---
  - { id: ERR_BILLING_EXCEEDS_EARNED, http: 422, condition: "an invoice's gross_billed exceeds the fixed-fee billing headroom implied by recognized earned value" }
  - { id: ERR_NOTHING_TO_INVOICE, http: 422, condition: "no billable unbilled charge exists on or before period_end" }
  - { id: ERR_BACKUP_DOCUMENTATION_MISSING, http: 409, condition: "an invoice is submitted for a public-agency client while backup_missing_count > 0 (a swept consultant payable has backup_attached == false)" }
  - { id: ERR_REVISION_LIMIT_EXCEEDED, http: 409, condition: "a client requests a fourth revision of the same invoice (revision_round is already 3)" }
  - { id: ERR_WRITE_OFF_AMOUNT_NOT_ALLOCATABLE, http: 422, condition: "an unbilled-labor write-off amount is not an exact prefix sum of the project's unbilled approved time entries in chronological order" }
  - { id: ERR_WRITE_OFF_AMOUNT_MISMATCH, http: 422, condition: "an invoice-receivable write-off amount differs from the invoice's net_due" }

# =============================================================================
# 1.7 RBAC MATRIX
# -----------------------------------------------------------------------------
# Role model: segregation of duties. Preparation and approval of the same
# artefact must be performed by different X-User-Ids, and the write-off
# approval level is a second, amount-driven gate on top of role membership.
# =============================================================================
roles:
  - name: FirmAdmin
    description: "Firm-level administrator: reference data, project setup and the logical clock"
    identity: opaque
    exclusive_operations: ["set the logical clock"]
    shared_operations: ["create clients", "create projects", "activate projects", "create phases", "draft and execute consultant subcontracts", "submit overhead certifications", "read every project, phase, charge, invoice, write-off and certification"]

  - name: Controller
    description: "Firm finance controller: rate governance, expense adjudication, payment release, period locks, certification and the higher write-off approval level"
    identity: opaque
    exclusive_operations: ["publish labor rates", "set billing multipliers", "lock accounting periods", "review expenses held for backup", "release consultant payments", "record invoice payments", "void invoices", "certify overhead rates", "return audit findings"]
    shared_operations: ["create clients", "create projects", "activate projects", "create phases", "assess and complete phases", "approve time entries", "draft and execute consultant subcontracts", "enter, approve and reject consultant payables", "prepare and submit invoices", "prepare and approve write-offs", "submit overhead certifications", "read every record"]

  - name: ProjectManager
    description: "Project manager for their own projects: charge capture, physical completion assessment, first-level approvals"
    identity: opaque
    exclusive_operations: []
    shared_operations: ["create phases on their own project", "assess and complete phases", "submit time entries", "approve time entries submitted by another user", "record expenses", "draft and execute consultant subcontracts", "approve and reject consultant payables", "prepare write-offs", "approve write-offs routed to PENDING_PM_APPROVAL", "activate their own project", "read their own project's records"]

  - name: ProjectAccountant
    description: "Project accountant: timesheet and expense entry, consultant payable entry, invoice preparation and submission, write-off preparation"
    identity: opaque
    exclusive_operations: []
    shared_operations: ["submit time entries", "record expenses", "enter consultant payables", "prepare invoices", "submit invoices", "revise invoices", "prepare write-offs", "read projects, phases, charges, invoices, write-offs and certifications"]

  - name: ClientContact
    description: "The client's own reviewer; X-User-Id is the Client row's id"
    identity: "entity_backed:Client"
    exclusive_operations: ["accept or request revision on an invoice under client review"]
    shared_operations: ["read the invoices of their own client's projects"]
