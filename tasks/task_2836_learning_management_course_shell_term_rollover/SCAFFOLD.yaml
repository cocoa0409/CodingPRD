    roles: [LmsAdmin]
    code: 200
    input: [decision, "reason?"]
    output: CourseShell
    side_effects:
      - "APPROVE moves REQUESTED -> PROVISIONED; REJECT moves REQUESTED -> REJECTED and sets reject_reason"
      - "REJECT recomputes the owner's sandbox_storage_chargeback and the term's term_rollover_completion_pct"
      - "increments CourseShell.version by 1"

  - method: POST
    path: "/course-shells/{id}/publish"
